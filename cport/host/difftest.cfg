# begin sound_lib_setup.c
# divsi3_814DA9C: its zero-divisor path calls the __div0 nullsub, so it returns
# with LR pointing past that call rather than at the caller; the game's
# callers of this division helper only need the quotient, the loop registers
# and the flags.
divsi3_814DA9C compare=r0,r1,r2,r3,r4,r12,nz,c,v
# SampleFreqSet_814EDC0 and m4aSoundVSyncOn_814EF94 return by popping their return word into r0
# and branching to it, so they leave LR holding an address inside themselves;
# no caller can depend on that value (the port returns to the same place).
SampleFreqSet_814EDC0 compare=r0,r1,r2,r3,r4,r5,r12,nz,c,v
m4aSoundVSyncOn_814EF94 compare=r0,r1,r2,r3,r4,r12,nz,c,v
# m4aSoundVSyncOff_814EF14: its contract promises only r2/r3; r0, r1, LR and the flags are
# its own and the CpuSet call's scratch.
m4aSoundVSyncOff_814EF14 compare=r2,r3
# end sound_lib_setup.c
