# difftest.cfg — per-function inputs and registers to compare.
#   NAME [rN=v1|v2|...]... [compare=rA,rB,...,nz,c,v]   (compare= must come last; nz/c/v: flags)
# Unlisted registers get random values (pointers, small ints, noise).
# Without compare=, a function is compared on its register contract, which the lifter writes into
# cport/include/difftest_pairs.h (every r0-r12 it does not leave free, the flags callers read).
# compare= replaces that contract: a promise of less, with a "# reason" line above it.
palette_addOrSubtractColor r2=0|4 r7=0x3001750|0x3001B60|0x3001550|0x3001960|0x200F388 r6=0|2|4|0x20|0x40|0x200 compare=r0,r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,r11,r12,nz,c,v
palette_fadeTowardWhiteOrBlack r2=8|12 r7=0x3001750|0x3001B60|0x3001550|0x3001960|0x200F388 r0=0|0x7FFF|0x4210|0x1084|0x2D6B|0x5294 r6=0|2|4|0x20|0x200 compare=r5,r7
# m4aSoundInit: the C port deliberately skips the SoundMainRAM copy to IWRAM
m4aSoundInit hwtick ignore=0x03005700:0x400
# The m4a mixer runs only in the VCount interrupt (sound_vcountCallback -> call_m4aSoundMain -> m4aSoundMain
# -> SoundMain, which jumps here). The r12 and flags it leaves reach only the interrupt's return: the
# dispatcher (asm38.s, loc_3005C6C) pops r0-r3 and the saved SPSR, and the BIOS pops r12 and restores CPSR
# from SPSR. Its contract lists them only because the lifter cannot see past the interrupt dispatcher.
SoundMainRAM_iwram_03005700 compare=r0,r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,r11
sprite_buildOamShadow compare=r0,r1,r2,r3,r4,r5,r6,r7,r12
MPlayMain compare=r4,r5,r6,r7,r8,r9,r10,r11
sprite_queueFramePieces compare=r5,r10,r11
sprite_queueOamEntries compare=r4,r5,r6,r7,r8,r9,r10,r11,r12
sprite_queueOamEntry compare=r0,r1,r2,r3,r4,r5,r6,r7,nz,c,v
sprite_projectAndCull compare=r5,r10
sprite_ensureGfxResident compare=r5,r10
# r2/r3 are what sprite_queueFramePieces leaves at the end of battle_updateEStructSprites_80465F8 (it promises
# r5,r10,r11); same for the lifted original (tools/oracle.py --lifted).
sub_8127ACC compare=r0,r1,r4,r5,r6,r7,r8,r9,r10,r11,r12,nz,c,v
# bg_scroll.c. The four edge loaders' only caller, scrollBGTileMapToCamera_8030580, is readable and calls
# draw_edge directly, so they promise r5 and r10. getMapCellTileIds_80305E4 leaves what the original
# leaves (redrawBGTileIdsWindowCellByCell_8030808, still lifted, passes them to the tile callback). scrollBGTileMapToCamera_8030580
# restores what it pushes and leaves r2/r3 and c/v as the original.
drawBGTileMapLeftColumns_803066E compare=r5,r10
drawBGTileMapRightColumns_80306C8 compare=r5,r10
drawBGTileMapTopRows_8030722 compare=r5,r10
drawBGTileMapBottomRows_803077C compare=r5,r10
getMapCellTileIds_80305E4 compare=r0,r1,r2,r3,r4,r6,r7,nz,c,v
scrollBGTileMapToCamera_8030580 compare=r2,r3,r4,r5,r6,r7,r8,r9,r10,r11,r12,c,v
# begin sound_lib_setup.c
# divsi3_814DA9C: its zero-divisor path calls the __div0 nullsub, so it returns
# with LR pointing past that call rather than at the caller; the game's
# callers of this division helper only need the quotient, the loop registers
# and the flags.
divsi3_814DA9C compare=r0,r1,r2,r3,r4,r12,nz,c,v
# SampleFreqSet_814EDC0 and m4aSoundVSyncOn_814EF94 return by popping their return word into r0
# and branching to it, so they leave LR holding an address inside themselves;
# no caller can depend on that value (the port returns to the same place).
SampleFreqSet_814EDC0 compare=r0,r1,r2,r3,r4,r5,r12,nz,c,v
m4aSoundVSyncOn_814EF94 compare=r0,r1,r2,r3,r4,r12,nz,c,v
# m4aSoundVSyncOff_814EF14: its contract promises only r2/r3; r0, r1, LR and the flags are
# its own and the CpuSet call's scratch.
m4aSoundVSyncOff_814EF14 compare=r2,r3
# end sound_lib_setup.c
