name: MettaurDecideStates
address: '0x08109FF0'
kind: data
previous_names:
- off_8109FF0
status: probable
summary: 'The Mettaur''s five decision states: check status and row, hop toward row, confused, choose
  attack, post-chip wait.'
details: The branch calls these the own 5 states of battle_aiDispatchByState_8109FD6, indexed by a pre-multiplied
  DecideState byte. Its notes name them CHECK_STATUS_AND_ROW, ARM_HOP_TO_ROW, CONFUSED, CHOOSE_ATTACK
  and ARM_GUARD. On master battle_aiDispatchByState_8109FD6 indexes it by oAIState_ScriptId. The entries
  are sub_810A004, ai_attackStateStep_810A080, sub_810A0BA, battle_aiSelectAndUseChip_810A126 and sub_810A204.
