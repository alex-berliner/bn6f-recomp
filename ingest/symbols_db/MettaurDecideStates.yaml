open_questions:
- The note's ARM_GUARD label for state 0x10 conflicts with sub_810A204, which returns to the choose-attack
  state.
- The note calls the confused roll the only RNG roll, yet sub_810A254 and sub_810A1B4 also call GetPositiveSignedRNG.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be ai_mettaurDecideStates.'
