name: sub_814FE0C
address: '0x0814FE0C'
kind: function
status: probable
summary: 'Sound-sequence extended-command handler: reads the next byte from the track''s command stream
  (+0x40) into track byte +0x2E and advances the stream.'
interface: (r0 = ignored, r1 = track/context block) -> no return; r1[0x2E] = *r1->[+0x40]; r1->[+0x40]
  += 1; clobbers r0, r2
details: The C (BYTE_READER macro) loads the stream pointer at ctx+0x40, copies one byte to ctx+0x2E and
  stores the pointer back incremented by one. It is reached only through the 12-entry table off_81C06C0,
  which sub_814FD54 indexes with a sub-command byte read from the same stream. The table order and offsets
  (+0x40 command pointer, +0x24..0x2F tone data) match the m4a sound engine's MusicPlayerTrack and its
  xcmd handlers (this entry lines up with ply_xsust, setting tone.sustain).
