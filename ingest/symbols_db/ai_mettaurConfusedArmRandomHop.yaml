summary: 'Confused Mettaur: sets up a hop in a random neighbouring row and starts the HOP action.'
interface: (r4 = AIData, r6 = AIState, r7 = AIAttackVars) -> nothing; sets panel-choose callback = sub_810A254,
  AttackDuration = byte_8109F46[Version], CurAction 0x0A, sub-state 4
details: The branch says it arms a random-direction hop using sub_810A254. On master it stores sub_810A254
  as oAIAttackVars_PanelChooseCallback and loads the per-Version cooldown from byte_8109F46. It calls
  object_setAttack0(0xA), the hop action, and sets the sub-state to 4.
