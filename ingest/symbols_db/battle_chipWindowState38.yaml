summary: 'Chip window inner state 0x38: a three-step sub-machine that consumes and confirms selected chips
  through active-chip record 8.'
interface: (r5 = eS20364C0) -> (); r4 = getLocOfActiveChips_8027E1C(8) for its handlers; sub-state in
  the halfword at +2
details: Row 0x38 of off_8026AA4. It dispatches on [r5+2] through off_8027428 to three steps. The first,
  sub_8027434, sets +0x40 to 0x18, clears +0x44 and +0x5F and fills a buffer. The other two are customScreen_consumeSelectedChipsStep
  and customScreen_confirmChipSelection. It then runs battleObject_chipSelectAnimTick_8029C08 and sub_802899C.
