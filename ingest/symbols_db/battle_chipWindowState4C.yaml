name: battle_chipWindowState4C
address: '0x08027834'
kind: function
previous_names:
- sub_8027834
status: probable
summary: 'Chip window inner state 0x4C: a 20-frame effect. It plays SOUND_SELECT_7A, swaps the window''s
  base tile map every third frame, then hands over to state 0x54.'
interface: (r5 = eS20364C0) -> (); counters at +0x40 and +0x44; sub-state flag at +2
details: Row 0x4C of off_8026AA4, entered from custMenuSomeHandler_8028B74. On the first call it clears
  +0x40 and +0x44 and plays SOUND_SELECT_7A. Every third frame it copies a base map from off_80278E0 into
  unk_2035000, re-stamps the patch rectangles from byte_8027B4A (part of byte_8027B2C) with sub_8027CCC,
  and uploads the map to BG block 3. After 0x14 frames it sets JumpOffset01 to 0x54 and calls sub_802794A
  directly.
