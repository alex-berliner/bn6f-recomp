name: sub_81207C4
address: '0x081207C4'
kind: function
status: probable
summary: 'Packs 30 folder-editor entries (0x20 bytes each) into a halfword list: for each nonzero 9-bit
  field at bits 7-15 of +0x1C, writes (bits0-6 << 9) | field.'
interface: (r0 = first 0x20-byte entry, r1 = u16 output array of 30) -> no return; out[i] = ((w & 0x7F)
  << 9) | ((w >> 7) & 0x1FF) when that 9-bit field is nonzero, else out[i] is left unchanged
details: The C walks 30 entries of 32 bytes, splits the low 16 bits of the word at +0x1C into a 7-bit
  low field and a 9-bit high field, and writes the swapped packing when the 9-bit field is nonzero; the
  output pointer always advances. The only caller (sub_8133A68, asm36.s:7718) passes word_202A020 (the
  folder/pack editor's 0x20-byte chip entries) and unk_2039AA0, then calls pet_applyStatModsToCurNavi.
