summary: Returns the address of 13-byte entry (r0 & 0xFF) of the array at unk_20102E0.
interface: (r0 = index) -> r0 = 0x020102E0 + (r0 & 0xFF) * 13; clobbers r1
details: The C masks the index to a byte and returns base + idx*13. The only caller, sub_812A2EC (asm33.s:14957),
  takes entry 1, converts its strings with chatbox_convertTwoByteStringsToCharCodes and reads its +0xB
  halfword via getStruct0BHalfptr.
