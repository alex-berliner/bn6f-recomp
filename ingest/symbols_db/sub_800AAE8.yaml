name: sub_800AAE8
address: '0x0800AAE8'
kind: function
status: probable
summary: Sets the battle state's PendingBattleEndAction halfword (+0x3a) to 1.
interface: (r10 = Toolkit) -> no return; *(u16 *)(Toolkit.BattleStatePtr + 0x3a) = 1; clobbers r0, r1
details: The C writes the u16 1 to offset 0x3a of the struct at Toolkit+0x18 (BattleStatePtr), which master
  names oBattleState_PendingBattleEndAction. The only caller (asm32.s:1446) is a battle-object teardown
  sequence (clears chips held, removes the actor from the alive list) and calls it near the end.
