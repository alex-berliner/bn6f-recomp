  result: 'agrees: yes'
open_questions:
- off_80E0408 inside the table is a mislabel and should not be treated as a separate pointer.
- The deletion and heal row roles come from the Rust reimplementation and were not confirmed from the
  code.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_effectObjectRows.'
