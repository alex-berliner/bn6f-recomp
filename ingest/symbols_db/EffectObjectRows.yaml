name: EffectObjectRows
address: '0x080E0398'
kind: data
previous_names:
- byte_80E0398
status: probable
summary: 'Row table for type-4 effect objects (hit sparks, deletion, heal, sword arcs): sprite, animation
  and palette per row.'
details: 'Rows of 4 bytes read at Param1 * 4 by battle_objectInitAction_80E0568 (state 0 of t4_0x0_80E0548):
  bytes 0 and 1 go to sprite_load, byte 2 to CurAnim, byte 3 plus Param3 to sprite_setPalette. The table
  runs to the end of sub_80E0376, about 108 rows; a stray label off_80E0408 (.word unk_200150C) sits inside
  it at row 28 and is really row data.'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "The type-4 EFFECT ROW table (row 3 the deletion effect, row 6 the heal,
    rows 0x16-0x1a the sword arcs/blades)", citing src/battle.rs:4101.'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/asm/asm31.s:90799
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80E0398'
  result: bn-notes names it EffectObjectRows_80E0398 (commit ffe10f48, 2026-09-15). The branch read the
    code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master reads 4-byte rows at Param1*4 into sprite_load, CurAnim and palette; rows 0x16-0x1A all
    use sprite 0x0C/0x14 with different animations and palettes, consistent with a family of sword arcs.
  refs:
  - bn6f/asm/asm31.s:90799
  reproduce: |
