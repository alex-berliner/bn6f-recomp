name: ChipWindowMap
address: '0x086E625C'
kind: data
previous_names:
- byte_86E625C
status: probable
summary: Tilemap of the battle chip-select window, 15x20 halfwords (0x258 bytes), copied into the BG map
  buffer.
details: The branch says this is the 15x20 map, in palette bank 9. On master code at asm03_0.s:594 copies
  0x258 bytes from byte_86E625C (or from byte_86E64B4 when a counter is nonzero) to unk_2035000 and then
  patches it. The block is 0x258 bytes long, up to byte_86E64B4.
