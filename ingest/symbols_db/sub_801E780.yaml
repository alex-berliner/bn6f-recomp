name: sub_801E780
address: '0x0801E780'
kind: function
status: probable
summary: If byte_2036840+8 is 2 or 4, writes 0x2D to byte_2036840+7.
interface: () -> no return; if byte_2036848 in {2,4} then byte_2036847 = 0x2D; clobbers r0-r2
details: The C reads the byte at 0x02036848 and, when it is 4 or 2, stores 0x2D at 0x02036847. byte_2036840
  is the state block written by battle_dispatchKindEffect_801E792, and comm_checkCrossNetBattleReady_801E754
  tests the same +8 values 2/4. Callers are chip_previewShowSelectedChip and object_stateDelayTick in
  asm03_0.s.
