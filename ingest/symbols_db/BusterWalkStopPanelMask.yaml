name: BusterWalkStopPanelMask
address: '0x0800FB4C'
kind: data
previous_names:
- byte_800FB4C
status: probable
summary: Per-alliance panel-flag mask that stops the buster's forward scan of free panels (used to set
  the buster hold length).
details: 'Two words indexed by alliance*4: 0x0D880080 (alliance 0) and 0x0E880080 (alliance 1). scanFrontPanels_800FAF6
  steps forward panel by panel, stopping when object_getPanelParameters returns 0 or shares a bit with
  this mask; the count (capped at 5) then indexes BusterHoldFramesByRapid. The branch calls this the mask
  that stops the forward walk.'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "The alliance MASK of panel parameters that stops the forward walk" (bn
    src/actor.rs:476).'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/asm/asm00_2.s:2160
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_800FB4C'
  result: bn-notes names it BusterWalkStopPanelMask_800FB4C (commit 2ea59267, 2026-09-15). The branch
