name: BarrierHpByType
address: '0x08020B2C'
kind: data
previous_names:
- byte_8020B2C
status: probable
summary: 'Barrier stats per barrier type: starting HP and two related values copied when a barrier is
  installed.'
details: 'Records of six bytes (three halfwords: HP, related value, counter) indexed type*6 by battle_installBarrier,
  which stores them into the object''s CollisionData BarrierHP, BarrierRelatedValue and BarrierCounterU16.
  Type 0 is 0 HP; type 1 is 10 HP; later types give 30, 50, 80, 100, 150, 200. The branch says hits are
  taken off this HP and the barrier breaks at zero.'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row (shared with barrierTakeDamage_801A7CC and barrierBreak_801A802): "A Barrier
    chip''s remaining HP ... hits are taken off it"; "and it breaks at zero"; "Barrier''s HP for type
    1 is 10 (byte_8020B2C)" (bn src/actor.rs:377-378; src/battle.rs:650).'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/data/dat01.s:189
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_8020B2C'
  result: bn-notes names it BarrierHpByType_8020B2C (commit ffe10f48, 2026-09-15). The branch read the
    code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: battle_installBarrier multiplies the type by 6, loads three halfwords from byte_8020B2C and
    stores the first as BarrierHP; record 1's first halfword is 0x000A = 10.
  refs:
  - bn6f/data/dat01.s:189
  reproduce: |
    sed -n '189,249p' bn6f/data/dat01.s
  result: 'agrees: yes'
open_questions:
- The branch names 0x0801A7CC barrierTakeDamage, but master code there (battle_installBarrier) installs
  a barrier from this table rather than applying damage.
- Meaning of the second and third halfwords is not given.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_barrierHpByType.'
sources:
- bn6f bn-notes ffe10f48
- audit docs/reviews/2026-10-20-orphaned-branches.md
