name: sub_811BC00
address: '0x0811BC00'
kind: function
status: probable
summary: If record r2 of eStructArr2008450 (0x58-byte stride) is in use, writes u16 r0 at +0xe, u16 r3
  at +0x18 and byte r1 at +9.
interface: (r0 = u16 for +0xe, r1 = byte for +9, r2 = record index, r3 = u16 for +0x18) -> no return;
  no-op if the record's first byte is 0
details: The C computes 0x02008450 + idx*88, returns if byte 0 is zero, and otherwise stores the three
  fields; it inlines getStructFrom2008450 because that helper reports emptiness through the Z flag. Master
  calls getStructFrom2008450 and branches on its flags. Callers are sub_812EC2C and two sites in asm35.s
  (one loads a halfword from word_2023FA0 into record 9).
