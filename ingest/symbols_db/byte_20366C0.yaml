name: byte_20366C0
address: '0x020366C0'
kind: ram
status: probable
summary: 'The turn''s selected-chips record: a flag byte, then six-entry halfword arrays including each
  chip''s ID with its code.'
details: The branch calls it the selected-chip code array. On master custMenu_confirmAndProcessSelectedChips_8029110
  sets byte 0 (0 or 0xFF for no chips). It stores the chip ID|code halfword per slot at +0x32 and copies
  queue data into +2, +0xE and +0x1A. custMenu_matchChipComboPattern runs over +0x32. folder_tallyChipsByClass_802A4FC
  reads it too, and battle_backupStateForRestart_800B3A2 copies 0x50 bytes from it.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "selected-chip code array", citing docs/recon/T10.md:18.'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/ewram.s:2751
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_20366C0'
  result: bn-notes names it eSelectedChipCodes_20366C0 (commit 0d5c5f33, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: The +0x32 array does hold chip IDs packed with codes (getChipID_802A54E result) and feeds the
    PA matcher, but the label also starts a larger record with other arrays at +2, +0xE, +0x1A and +0x26.
  refs:
  - bn6f/ewram.s:2751
  reproduce: |
    sed -n '2751,2755p' bn6f/ewram.s
  result: 'agrees: partly'
open_questions:
- The name covers only the +0x32 sub-array; the label is the head of a wider selected-chips record.
- 'The branch''s name eSelectedChipCodes_20366C0 was not proposed: it would mislead (see details).'
