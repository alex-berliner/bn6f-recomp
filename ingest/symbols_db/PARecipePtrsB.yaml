name: PARecipePtrsB
address: '0x0802BC60'
kind: data
previous_names:
- off_802BC60
status: probable
summary: Pointer list of 20 three-chip exact-match Program Advance recipes, scanned when the PA check's
  +0x1C flag is set; it has no terminator of its own and runs on into PARecipePtrsA.
details: 'Twenty words, byte_802BB98..byte_802BC56. Each recipe is 10 bytes: count 3, matcher 4, a PA
  id halfword and three chip ids. custMenu_matchChipComboPattern uses this list instead of off_802BCB0
  when [r7+0x1C] is nonzero, and walks it until a NULL word. off_802BCB0 follows directly, so a scan that
  starts here covers 20 + 43 = 63 recipes.'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row citing docs/recon/T10.md:14: "20 pointers byte_802BB98..byte_802BC56" (and
    "43 pointers byte_802BA60..byte_802BB92, terminated .word NULL" for the A list).'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:12295
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'off_802BC60'
  result: bn-notes names it PARecipePtrsB_802BC60 (commit 0d5c5f33, 2026-09-15). The branch read the code
    and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: I count 20 pointers with no NULL before off_802BCB0, and the choice of list is ldr r0,[r7,#0x1c];
    cmp r0,#0; ldr r4,=off_802BC60.
  refs:
  - bn6f/asm/asm03_0.s:12295
  reproduce: |
    sed -n '12295,12355p' bn6f/asm/asm03_0.s
  result: 'agrees: yes'
open_questions:
- The meaning of the +0x1C flag (which situation scans list B) is not given.
- The A/B suffixes are arbitrary, and B is really a prefix of the combined list.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_paRecipePtrsB.'
