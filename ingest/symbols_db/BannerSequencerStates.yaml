  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'off_8008038'
    git -C bn6f show a5c3b9fe:asm/asm00_1.s | sed -n '10400,10409p'
    git -C bn6f show a5c3b9fe:asm/asm00_1.s | sed -n '10411,10412p'
  result: bn-notes names it BannerSequencerStates_8008038 (commit 5f6c6d00, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: battle_runMainStep_800801C does ldrb r0,[r5] (r5 = dword_203CA70) then ldr r1,[table,r0], and
    the table holds exactly 10 words, matching the pre-multiplied 0x00..0x24 claim.
  refs:
  - bn6f/asm/asm00_1.s:11130
  reproduce: |
    sed -n '11130,11190p' bn6f/asm/asm00_1.s
  result: 'agrees: yes'
open_questions:
- Per-entry roles (e.g. WIN_COUNT, LOSE_COUNT) come from the branch notes; only entries 0, 7 and the dispatch
  mechanism were checked here.
- A second dispatcher (sub_80084F0) uses the same state word with a different table, so state values are
  not globally unique.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_bannerSequencerStates.'
