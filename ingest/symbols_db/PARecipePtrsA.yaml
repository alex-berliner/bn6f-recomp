name: PARecipePtrsA
address: '0x0802BCB0'
kind: data
previous_names:
- off_802BCB0
status: probable
summary: 'NULL-terminated list of 43 Program Advance recipe pointers: the default list the PA check scans,
  and the tail that PARecipePtrsB runs into.'
details: 43 pointers, byte_802BA60..byte_802BB92, then .word NULL. The recipes mix matcher 4 (an exact
  list of 3-4 chip ids) and matcher 0 (one chip id with consecutive codes). custMenu_matchChipComboPattern
  uses this list when [r7+0x1C] is 0.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row (T10.md:14): "43 pointers byte_802BA60..byte_802BB92, terminated .word
    NULL"; note at asm/asm03_0.s:11554 on bn-notes: "PARecipePtrsA ends in a .word NULL terminator as
    its 64th pointer, so it holds 63 PA records."'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:12316
  - bn-notes a5c3b9fe:asm/asm03_0.s:11554
  - bn-notes a5c3b9fe:asm/asm03_0.s:11561
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'off_802BCB0'
    git -C bn6f show a5c3b9fe:asm/asm03_0.s | sed -n '11554,11555p'
    git -C bn6f show a5c3b9fe:asm/asm03_0.s | sed -n '11561,11574p'
  result: bn-notes names it PARecipePtrsA_802BCB0 (commit 0d5c5f33, 2026-09-15). The branch read the code
