- method: assembly-reading
  date: '2026-10-20'
  detail: I count 43 pointers plus NULL, which agrees with renames.md; the note's '64th pointer / 63 records'
    only holds when counting from off_802BC60 (20 + 43), so the note is wrong about this table.
  refs:
  - bn6f/asm/asm03_0.s:12316
  reproduce: |
    sed -n '12316,12376p' bn6f/asm/asm03_0.s
  result: 'agrees: partly'
open_questions:
- The branch note (63 records) contradicts both the renames.md row and the code (43).
- A second branch note at the same spot (the RESULT window chain) belongs to the routine that follows,
  battle_initChipSelect_802BD60, not to this table.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
