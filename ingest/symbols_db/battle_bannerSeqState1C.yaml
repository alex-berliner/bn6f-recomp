name: battle_bannerSeqState1C
address: '0x080083E4'
kind: function
previous_names:
- sub_80083E4
status: probable
summary: 'Banner sequencer state 0x1C: the paused-battle state; when Start is pressed it plays a sound
  and resumes the fight.'
interface: '(r5 = eBattleSequencerState record) -> on Start: writes 8 to [r5], plays SE 0x9F, calls dispatch_801DACC(0x200)'
details: Entry 7 (state 0x1C) of BannerSequencerStates. It tests bit 3 (Start) of the joypad record dword_2036820
  for the player in [r5+5] via getRecordFlagBit3; if set it plays sound 0x9F, writes state 0x08 (the fight
  state) to the state word and calls dispatch_801DACC with 0x200. The branch note calls it the state a
  paused battle loads in.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "on Start it writes 0x1C -> 8 at frame 11, PC 0x080083F8, inside sub_80083E4"
    (docs/coverage/battlestart_gunner.md:57-59); table note on bn-notes: "BATTLE_SEQ_1C: the state a PAUSED
    battle loads in; on Start it writes FIGHT."'
  refs:
  - bn6f 5f6c6d00 (branch bn-notes)
  - bn6f/asm/asm00_1.s:11634
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'sub_80083E4'
  result: bn-notes names it bannerSeqState1C_80083E4 (commit 5f6c6d00, 2026-09-15). The branch read the
    code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: runtime
  date: '2026-09-15'
  detail: The branch's note says this was measured live against the original game (by the bn reimplementation's
    harness); the measurement is not in this repo and was not repeated in this audit.
  refs:
  - bn6f 5f6c6d00 (branch bn-notes)
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'sub_80083E4'
  result: claim recorded as the branch states it
- method: assembly-reading
  date: '2026-10-20'
  detail: Code reads record bit 3 (GBA Start key) from dword_2036820+player*8+4, then mov r0,#8; str r0,[r5]
    at 0x080083F8, exactly the write the branch traced.
  refs:
  - bn6f/asm/asm00_1.s:11634
  reproduce: |
    sed -n '11634,11694p' bn6f/asm/asm00_1.s
  result: 'agrees: yes'
open_questions:
- Name only restates the state number (1C); a role name such as a pause state would be more informative.
- The branch also says entries 6 and 7 are reached only when battle_getPhaseMode_800A152 returns 7; not
  checked.
