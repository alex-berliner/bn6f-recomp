summary: 'Mettaur shockwave damage per Version: six packed words whose low 16 bits are 10, 30, 50, 70,
  50, 100.'
details: The branch reads byte_8109F28[Version] as a packed u32 whose low 16 bits are {10,30,50,70,50,100}
  for Version 0..5. On master battle_aiSelectAndUseChip_810A126 loads word [Version*4] into oAIAttackVars_Damage
  before setting CurAction 0x0B (attack). The bytes are 0A 00 0A 00, 1E 00 0A 00, 32 00 0A 00, 46 00 0A
  00, 32 00 0A 00, 64 00 0A 00.
