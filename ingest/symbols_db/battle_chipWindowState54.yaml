name: battle_chipWindowState54
address: '0x0802794A'
kind: function
previous_names:
- sub_802794A
status: probable
summary: 'Chip window inner state 0x54: per-frame input handler that reads the joypad through sub_8028A78
  and redraws the chip slots.'
interface: (r5 = eS20364C0, r10 = toolkit) -> (); on the first call clears +0x40 and +0x44 and sets +2
  = 1; later calls pass r7 = JoypadPtr to sub_8028A78
details: Row 0x54 of off_8026AA4. It is entered from sub_8027834 (state 0x4C) and from battleObject_chipSelectTick
  (state 0x58). After the input call it runs battle_customScreen_clearSelection_80279C8 and loops over
  the slots, comparing each with [r5+0x1B] and the bytes at +0x55. sub_8028A78 can move the window on
  to 0x50 or 0x5C.
