name: iObjPaletteMirror
address: '0x03001550'
kind: ram
previous_names:
- byte_3001550
status: probable
summary: IWRAM mirror of the 16 sprite (OBJ) palettes, 16 x 32 bytes.
details: The branch says 0x03001550 holds 16 x 32 bytes, an IWRAM mirror of the 16 OBJ palettes. On master
  sprite_loadPalette_8002818 copies 0x20 bytes into byte_3001550 + slot*0x20. getPalleteAndTransition_80023E0
  copies 0x200 bytes from here to iPallete3001750, and the asm38.s palette slot allocator searches it
  as a cache.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "0x03001550 holds 16 x 32 bytes: an IWRAM mirror of the 16 OBJ palettes",
    citing docs/recon/F39a.md:162.'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/iwram_data.s:49
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_3001550'
  result: bn-notes names it iObjPaletteMirror_3001550 (commit 2ea59267, 2026-09-15). The branch read the
    code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: CopyByEightWords of 0x20<<4 = 0x200 bytes to iPallete3001750 and per-slot 0x20 writes from sprite_loadPalette_8002818
    match 16 palettes of 32 bytes.
  refs:
  - bn6f/iwram_data.s:49
  reproduce: |
    sed -n '49,53p' bn6f/iwram_data.s
  result: 'agrees: yes'
