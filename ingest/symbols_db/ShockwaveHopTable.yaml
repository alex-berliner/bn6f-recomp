open_questions:
- The note itself says every hop reads the same row, so the name ShockwaveHopTable (per-hop) may mislead;
  it is per-tier, not per-hop.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_shockwaveHopTable.'
