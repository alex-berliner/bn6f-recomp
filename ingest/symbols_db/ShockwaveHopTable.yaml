    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80C6B00'
    git -C bn6f show a5c3b9fe:asm/asm31.s | sed -n '31377,31396p'
  result: bn-notes names it ShockwaveHopTable_80C6B00 (commit 8a20e179, 2026-09-15). The branch read the
