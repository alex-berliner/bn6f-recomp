name: sub_803DD60
address: '0x0803DD60'
kind: function
status: probable
summary: 'Link helper: returns 0 if the eStruct200BC30 jump offset is 4, 1 if 8, else 1 iff eLinkState+0x48
  has bit 0 or 1 set.'
interface: () -> r0 = 0/1; reads eStruct200BC30_getJumpOffset00() and the u32 at eLinkState+0x48 (0x02009A18);
  clobbers r1, r7 saved
details: 'The C calls eStruct200BC30_getJumpOffset00: a nonzero value of 4 returns 0, 8 returns 1, and
  any other value (or 0) falls through to returning (*(u32 *)(0x020099D0+0x48) & 3) != 0. e_compareLinkStates
  and its variants sub_81324A8/sub_8132538 use the result to decide which of two link records gets priority;
  it has about 40 callers across link/battle code.'
