name: sub_8000E28
address: '0x08000E28'
kind: function
status: probable
summary: Returns the u32 at offset 0x18 (GameTimeFrames on master) of the S2001c04 struct the Toolkit
  points to.
interface: (r10 = Toolkit) -> r0 = Toolkit.S2001c04_Ptr->[+0x18] (u32); clobbers r3; no other side effects
details: The C loads the pointer at Toolkit+0x40 (S2001c04_Ptr) and returns the u32 at +0x18 of it. Master's
  struct definition names that field GameTimeFrames. The only caller is playCreditsScene_81382D0, which
  stores the result at [r5+0x20].
