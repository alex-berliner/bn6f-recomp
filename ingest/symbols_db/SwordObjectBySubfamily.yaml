name: SwordObjectBySubfamily
address: '0x080EBB64'
kind: data
previous_names:
- byte_80EBB64
status: probable
summary: Per-subfamily choice of the held sword object's sprite record.
details: 20 bytes; sub_80EBB34 returns byte_80EBB64[AIAttackVars byte 3], and callers add it to r4 before
  spawn_t1_0x5_tempAttackObject_80B8E30, so it is a row of byte_80B8BD4 (proposed TempObjectRecords).
  Slots 0-11 are 3, slots 12-15 are 0x19-0x1C, followed by 0, 3, 3, 0. sub_80EBB34 also branches on ActorType
  and AIIndex, but every path returns the same value.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "The sword object is byte_80B8BD4''s row ... (byte_80EBB64)", citing src/battle.rs:3093,
    in the sword row.'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/asm/asm31.s:116603
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80EBB64'
  result: bn-notes names it SwordObjectBySubfamily_80EBB64 (commit ffe10f48, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master sub_80EBB34 does ldrb r7,[byte_80EBB64 + tier] and returns it; callers add it into the
    temp-attack object's parameters, consistent with a TempObjectRecords row.
  refs:
  - bn6f/asm/asm31.s:116603
  reproduce: |
    sed -n '116603,116663p' bn6f/asm/asm31.s
  result: 'agrees: yes'
open_questions:
- sub_80EBB34 is also used at asm31.s:116381 with getSpawnTablePos and at 13630, so the value is not only
  for swords.
- The table is 20 bytes for 16 slots; the last 4 bytes' use is unknown.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_swordObjectBySubfamily.'
sources:
- bn6f bn-notes ffe10f48
- audit docs/reviews/2026-10-20-orphaned-branches.md
