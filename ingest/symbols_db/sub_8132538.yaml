name: sub_8132538
address: '0x08132538'
kind: function
status: probable
summary: Variant of e_compareLinkStates that treats state 0x84 like 4 when ranking two link records' state
  halfwords; 0xFF if neither exceeds 2.
interface: (r0 = two consecutive 16-byte records, state u16 at +8 of each) -> r0 = 0xFF, 1, 2, 3 or 4;
  calls sub_803DD60 to choose which record is checked first
details: 'The C returns 0xFF unless a = [+8] or b = [+0x18] is greater than 2. If sub_803DD60 is nonzero:
  a==8 gives 1, b==8 gives 2, b in {0x84,4} gives 4 if a in {0x84,4} else 3, otherwise 0xFF; with sub_803DD60
  zero the roles of a and b swap. The only caller is sub_812A8EC (asm33.s:15840).'
