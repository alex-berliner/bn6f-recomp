  date: '2026-05-25'
  detail: 'Old C: "if (a == 8u) return 1u; if (b == 8u) return 2u; if (b != 0x84u && b != 4u) return 0xFFu;
    if (a == 0x84u || a == 4u) return 4u; return 3u;". No commit description.'
