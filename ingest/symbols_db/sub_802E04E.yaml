name: sub_802E04E
address: '0x0802E04E'
kind: function
status: probable
summary: Subtracts r1 from the halfword counter at +0x28 of entry r0 of the 0x1D0-byte array unk_2036120,
  clamping at 0.
interface: (r0 = entry index, r1 = amount) -> no return; entry = getEntryPtr_2036120_1D0_802E070(r0);
  entry[+0x28] = max(0, entry[+0x28] - r1) (u16); clobbers r0-r2
details: The C gets the slot from the 0x1D0-stride entry helper, subtracts the amount from the u16 at
  +40 as a signed value and stores 0 if it went negative. battle_addCounterAmount (asm03_0.s:19385) calls
  it as the alternate path to battle_addCappedCounter for its counter at field 0x28; other callers are
  sub_802E95C and sub_80E45F8.
