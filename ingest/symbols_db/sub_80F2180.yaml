name: sub_80F2180
address: '0x080F2180'
kind: function
status: probable
summary: 'Phase of a player charge action that, on an animation cue, resolves an outcome: sound, heal
  or HP loss.'
interface: '(r5 = player battle object, r7 = AIAttackVars) -> no return; waits for sprite frame flag 0x80,
  then by object byte +0x75: 0/2 play sound 0x1A4, 1 applies HP 0x1E, 3/4 subtract 50/70 HP, set anim
  0x1F and play SOUND_HIT_6B; sets HitElement 0xC or 0x14'
details: Entry 2 of off_80F210C, the phase table of sub_80F20F8, action 11 of the player's action table
  off_80EA6DC. The previous phase, ai_chargeAttackUpdate, sets HitElement 8 when byte +0x74 is nonzero,
  writing that value minus 1 to +0x75. This routine then branches on +0x75 as described.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "played from the shot-impact handler sub_80F2180", citing docs/coverage/audio-buster.md:26.'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/asm/asm31.s:131119
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'sub_80F2180'
  result: bn-notes names it shotImpact_80F2180 (commit ffe10f48, 2026-09-15). The branch read the code
    and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master shows a player-action phase that changes the player's own HP and animation based on an
    outcome byte, and plays sounds; nothing in it spawns or handles a shot, so shot impact is only loosely
    supported.
  refs:
  - bn6f/asm/asm31.s:131119
  reproduce: |
    sed -n '131119,131179p' bn6f/asm/asm31.s
  result: 'agrees: partly'
open_questions:
- The routine works on the player object itself (HP, CurAnim), not a shot; what sets byte +0x74 and which
  chip/action this is was not established.
- The only evidence is an audio note saying a sound is played from it.
- 'The branch''s name shotImpact_80F2180 was not proposed: it would mislead (see details).'
sources:
- bn6f bn-notes ffe10f48
- audit docs/reviews/2026-10-20-orphaned-branches.md
