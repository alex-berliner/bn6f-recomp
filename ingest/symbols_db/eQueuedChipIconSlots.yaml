name: eQueuedChipIconSlots
address: '0x020352E0'
kind: ram
previous_names:
- dword_20352E0
status: probable
summary: Six slots, one per battle object, used to draw that object's queued chip icon above its head.
details: The branch calls these the six slots at dword_20352E0. On master the area is cleared as 0x30
  bytes (6 x 8). Each entry holds an in-use byte, X/Y offsets, an alliance byte at +3 and an object pointer
  at +4. battleObject_registerCustomArm_801DB84 claims a slot for an object. battle_drawChipCountsOAM_801C082
  and battle_loadChipPreviewGfxFromHandTable_801C002 walk the six slots and draw or load the selected
  chip's icon over each object.
evidence:
