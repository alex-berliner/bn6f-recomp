  detail: 'docs/renames.md row (Battle HUD elements section): "the six slots at dword_20352E0", citing
    src/battle.rs:4593 and TODO_ARCHIVE.md:1613 (F11).'
  refs:
  - bn6f 5f6c6d00 (branch bn-notes)
  - bn6f/ewram.s:2696
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'dword_20352E0'
  result: bn-notes names it eQueuedChipIconSlots_20352E0 (commit 5f6c6d00, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master zero-fills 0x30 bytes, and both draw loops iterate 6 entries of 8 bytes calling battle_getSelectedChipForUse_800ED90
    on the slot's object, which fits queued chip icons.
  refs:
