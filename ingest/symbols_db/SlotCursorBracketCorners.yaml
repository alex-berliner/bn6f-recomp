name: SlotCursorBracketCorners
address: '0x080288B0'
kind: data
previous_names:
- byte_80288B0
status: probable
summary: 'Corner offsets for the blinking cursor brackets drawn around a chip slot in the chip window:
  two blink frames of four corners each.'
details: '32 bytes: two frames of four words. The bytes of each word are dy, 0, dx and a flip flag (0x00,
  0x10, 0x30, 0x20 give the four corner orientations). Frame 0 spans 0xE; frame 1 pulls the brackets in
  to 1..0xC. battleObject_computeBButtonOffsets_8028894 (entries 0, 6 and 7 of jt_802886C, chosen by selection
  kind) returns it in r6 with a base position from the slot index. battle_custMenuDispatchSelection_8028820
  then adds (x-3, y-3), picks the frame from bit 3 of a counter, and pushes the four words with fifo_pushRecord16_8009FF8.'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row citing src/custom.rs:305: "byte_80288B0 for a slot, byte_80288E4 for OK
    ... four words each of dy, 0, dx, flags".'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:5303
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80288B0'
  result: bn-notes names it SlotCursorBracketCorners_80288B0 (commit 0d5c5f33, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: The layout matches (four dy,0,dx,flags words per frame; the frame is chosen by blink bit <<
    4), and only battleObject_computeBButtonOffsets_8028894 loads it.
  refs:
  - bn6f/asm/asm03_0.s:5303
  reproduce: |
    sed -n '5303,5363p' bn6f/asm/asm03_0.s
  result: 'agrees: yes'
open_questions:
- Master names the loader computeBButtonOffsets, which has nothing to do with cursor brackets.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_slotCursorBracketCorners.'
