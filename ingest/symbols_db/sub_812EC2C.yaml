name: sub_812EC2C
address: '0x0812EC2C'
kind: function
status: probable
summary: Masks r0 to 15 bits and forwards it to sub_811BC00 (record r1, byte r2, +0x18 = 0); returns the
  masked value.
interface: '(r0 = value, r1 = eStructArr2008450 record index, r2 = byte for +9) -> r0 = r0 & 0x7FFF; side
  effect: sub_811BC00(r0 & 0x7FFF, r2, r1, 0)'
details: The C zero-extends bits 0-14 of the first argument, calls sub_811BC00 with it, the byte argument,
  the record index and 0, and returns the masked value. Master's register shuffle (r2<-r1, r1<-r6, r3<-0)
  produces the same call. Callers are battle_restoreMapBackground and other asm35.s/dat34.s sites.
