name: sub_8146728
address: '0x08146728'
kind: function
status: probable
summary: Returns the little-endian halfword at bytes +11/+12 of r0, read bytewise (unaligned).
interface: (r0 = record pointer) -> r0 = r0[11] | (r0[12] << 8); clobbers r1
details: The C combines two bytes into a u16 to avoid an unaligned halfword load; master does the same
  with two ldrb. Callers are rfu_drawConnectedPlayerEntries and sprite_drawValuePairAndQueueOam (asm03_1_1.s),
  which use the result as a value to draw for a connected player entry.
