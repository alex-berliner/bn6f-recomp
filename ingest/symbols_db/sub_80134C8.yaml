name: sub_80134C8
address: '0x080134C8'
kind: function
status: probable
summary: Initializes a 100-byte NaviStats block with fixed defaults (HP 500, Attack/Speed/Charge 2, etc.);
  used when building the battle Navi stats for battle mode 1.
interface: (r0 = pointer to 0x64-byte NaviStats block) -> no return; zero-fills 100 bytes then writes
  the default bytes/halfwords; preserves r4 via push
details: The C calls ZeroFillByWord(p, 100) and then stores BPwrAtk=1, BLeftAbility=0xFF, RegUP=4, CustomLevel=5,
  MegaLevel=5, GigaLevel=1, Mood=0x99, Attack/Speed/Charge=2, Folder1Reg/Folder2Reg/+0x30=0xFF, +0x27=0x1F,
  +0x20=1, BeastOutCounter (+0x21)=1, MaxBaseHP/CurHP/MaxHP=500, and zeros elsewhere (field names from
  master's NaviStats struct). The only caller, battle_initBattleStateBuffer_800B144, calls it on dword_203CBE0+0xc
  when GetBattleMode returns 1, where other modes copy a real NaviStats there.
