name: sub_802D1B4
address: '0x0802D1B4'
kind: function
status: probable
summary: Returns byte +0xd of the 0x20-byte entry r0 of the array at byte_203C4A0 (via getTableEntryPtr32_802D064).
interface: (r0 = entry index) -> r0 = *(u8 *)(getTableEntryPtr32_802D064(r0) + 0xd)
details: The C calls the entry-pointer helper (0x0203C4A0 + idx*32) and returns the byte at +0xd. The
  only caller is battle_drawSideCounters (asm00_2.s:28264), which renders two per-side counters.
