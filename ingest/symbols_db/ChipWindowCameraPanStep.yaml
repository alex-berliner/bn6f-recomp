name: ChipWindowCameraPanStep
address: '0x08026CC8'
kind: data
previous_names:
- dword_8026CC8
status: probable
summary: 'Camera pan step (0x18000) that the chip window applies to the battle camera on every slide call:
  added on the slide-out, subtracted on the slide-in.'
details: A single word, 0x18000. scrollStrip_update_8026BF4 (state 0x08, the slide-out) adds it to [Camera+0x34]
  on each call. battle_custMenuAnimateCursorToOK_8026B04 (state 0x00, the slide-in) subtracts it. Both
  skip the pan when GetBattleMode returns 1.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row citing src/custom.rs:1096 and TODO_ARCHIVE.md:2119 (F29): "every slide-out
    call adds dword_8026CC8 = 0x18000 to the camera''s y at Camera+0x34"; note at asm/asm03_0.s:845: the
    slide-out is "panning the camera by ChipWindowCameraPanStep a call".'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:1189
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'dword_8026CC8'
  result: bn-notes names it ChipWindowCameraPanStep_8026CC8 (commit 0d5c5f33, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Two readers, ldr r1,[CameraPtr,#0x34] with add r1,r3 at 0x8026C50 and sub r1,r3 at 0x8026B86,
    both behind a GetBattleMode != 1 check.
  refs:
  - bn6f/asm/asm03_0.s:1189
  reproduce: |
    sed -n '1189,1249p' bn6f/asm/asm03_0.s
  result: 'agrees: yes'
open_questions:
- The slide-in uses it too (subtracting), not only the slide-out.
- The code alone does not show that Camera+0x34 is the y axis.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_chipWindowCameraPanStep.'
