  date: '2026-09-15'
  detail: 'docs/renames.md row: "the empty icon byte_86E601C where there is no chip (sub_8028310)", citing
    src/custom.rs:14.'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/data/dat38_85.s:2949
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_86E601C'
  result: bn-notes names it EmptyChipIcon_86E601C (commit 0d5c5f33, 2026-09-15). The branch read the code
    and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
