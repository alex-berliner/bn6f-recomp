status: probable
summary: The empty chip icon (128 bytes, 16x16) shown in a chip-select slot when there is no chip.
details: The branch says the empty icon byte_86E601C is drawn where there is no chip (by battle_endActionSetup_8028310).
  On master battle_getChipElementData_80281A8 returns byte_86E601C for the no-chip id 0x1FF and ChipData+0x20
  otherwise. The block is 0x80 bytes long, up to dword_86E609C.
