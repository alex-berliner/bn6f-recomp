  date: '2026-09-15'
  detail: 'Note at include/structs/S20364C0.inc on bn-notes: "Unk_40 (the same word as unk_2036500) is the
    window''s OWN FRAME COUNTER, and it is the phase of the highlight bracket''s blink ... Its value is therefore
    frames since THIS window opened and means nothing across windows."'
  refs:
