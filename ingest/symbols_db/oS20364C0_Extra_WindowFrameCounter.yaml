name: oS20364C0_Extra_WindowFrameCounter
address: '0x40'
kind: struct-field
previous_names:
- oS20364C0_Extra_Unk_40
status: probable
summary: The chip window's own frame counter, which also sets the blink phase of the cursor's highlight bracket.
details: 'A u32 at eS20364C0+0x40 (the same word as unk_2036500). Per the branch, the window''s slide-in
  state seeds it to 0x78 and counts it down by 0xc. The interactive state increments it once a frame and
  zeroes it again when a chip is selected. The cursor-bracket drawer reduces it to (x >> 3) & 1 and adds
  that to base tile 0xb764 to choose between the two bracket tiles. Its value is therefore "frames since
  this window opened" and means nothing from one window to the next.'
evidence:
