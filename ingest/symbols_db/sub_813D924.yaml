summary: Returns 0x214 if the byte at eS200BC50+7 is nonzero, else 0x2B.
interface: '() -> r0 = eS200BC50[7] ? 0x214 : 0x2B; clobbers r1'
details: The C tests the byte at 0x0200BC57 and returns 0x214 or 0x2B. The only caller, sub_81465FC (libs.s:5293),
  stores the result as the halfword at +6 of an RFU parameter block it fills alongside values set by sub_8146588.
