name: sub_80C4090
address: '0x080C4090'
kind: function
status: probable
summary: If r0 is a non-null battle object, sets its u32 at ExtraVars+0x18 (offset 0x78) to 1.
interface: (r0 = BattleObject or NULL) -> no return; if r0 then *(u32 *)(r0 + 0x78) = 1; clobbers r1
details: The C does a null check and writes 1 to word 30 (offset 0x78) of the pointer. Master addresses
  it as oBattleObject_ExtraVars+0x18. The only caller (sub_8110416, asm32.s:5250) calls it on the object
  just returned by battle_spawnOwnedObject54.
