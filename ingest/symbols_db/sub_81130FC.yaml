open_questions:
- Master code sets these CurActions from status-effect and hit handling, so materialize looks wrong.
- The four slots call four different shared routines, not one shared appear routine.
- The name only restates the slot number (04..07).
- 'The branch''s name gunnerMaterialize06_81130FC was not proposed: the code does not support it.'
