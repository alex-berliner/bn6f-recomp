name: sub_81130FC
address: '0x081130FC'
kind: function
status: hypothesis
summary: 'Gunner CurAction 0x06 handler: clears its related-object pointer, then runs the shared battle_objectStatePendingCommit
  routine.'
interface: (r4 = AIData, r5 = Gunner battle object) -> nothing; clears RelatedObject1Ptr via sub_8113114,
  then calls battle_objectStatePendingCommit
details: The branch names the Gunner's CurAction 4..7 slots (table offsets 0x10-0x1C) materialize handlers
  that clear RelatedObject1Ptr and call a shared appear routine. On master ForGunner_8113078 holds this
  at CurAction 0x06. The body is bl sub_8113114 then bl battle_objectStatePendingCommit. The four slots
  call four different shared routines (battleObject_initAndRunAI_8016B02, battleObjectStateDispatcher_8016CE8,
  battle_objectStatePendingCommit, battle_hoverBobObjectUpdate).
