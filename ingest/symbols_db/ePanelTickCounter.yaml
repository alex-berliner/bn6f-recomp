name: ePanelTickCounter
address: '0x0203CB04'
kind: ram
previous_names:
- byte_203CB04
status: probable
summary: Panel frame countdown that reloads to 0x8C (140) frames and times periodic panel events.
details: The branch calls it the counter byte_203CB04 (reload 0x8c). On master sub_800BF88 stores 0x8C
  into it. panel_800BFC4 decrements it each unpaused frame and reloads 0x8C at zero. Panel code at loc_800C438
  compares it with 0x8C (or 0x46) before spawning an object.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "counter byte_203CB04 (reload 0x8c)", citing docs/recon/T10.md:46.'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/ewram.s:3110
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_203CB04'
  result: bn-notes names it ePanelTickCounter_203CB04 (commit 2ea59267, 2026-09-15). The branch read the
    code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: 'panel_800BFC4 does ldr/sub #1/str and reloads #0x8c on zero, which matches a reloading counter.'
  refs:
  - bn6f/ewram.s:3110
  reproduce: |
    sed -n '3110,3114p' bn6f/ewram.s
  result: 'agrees: yes'
open_questions:
- It is accessed as a 32-bit word although labelled byte_; the 12-byte reservation may hold more than
  the counter.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_panelTickCounter.'
sources:
