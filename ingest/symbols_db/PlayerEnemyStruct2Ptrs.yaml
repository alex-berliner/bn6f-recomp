summary: Player (MegaMan) per-AI-index pointer table for enemy struct 2 (per-version HP/element records).
details: Slot 2 (player) of off_800F260 in enemy_getStruct2, which indexes by ActorType, then AIIndex
  * 4, then version * 6 into a 6-byte record (element/HP, flags, element/damage). It holds 25 words, mostly
  byte_80F0304. The navi and virus counterparts are off_80F253C and off_8109150.
