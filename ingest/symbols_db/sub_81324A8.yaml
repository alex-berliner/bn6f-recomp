  date: '2026-05-25'
  detail: 'Old C: "if (a == 8u) { return (b == 8u) ? 8u : 1u; } if (b == 8u) return 2u; if (b != 4u) return
    0xFFu; if (a == 4u) return 4u; return 3u;". No commit description.'
