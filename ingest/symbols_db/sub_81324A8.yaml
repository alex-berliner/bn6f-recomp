name: sub_81324A8
address: '0x081324A8'
kind: function
status: probable
summary: Variant of e_compareLinkStates that ranks two link records' state halfwords (+8, +0x18) and also
  returns 8 when both are 8; 0xFF if neither exceeds 2.
interface: (r0 = two consecutive 16-byte records, state u16 at +8 of each) -> r0 = 0xFF, 1, 2, 3, 4 or
  8; calls sub_803DD60 to choose which record is checked first
details: 'The C returns 0xFF unless at least one of a = [+8] and b = [+0x18] is greater than 2. If sub_803DD60
  returns nonzero: a==8 gives 8 when b==8 else 1; b==8 gives 2; b==4 gives 4 if a==4 else 3; otherwise
  0xFF. If it returns 0 the same rules apply with a and b swapped. It differs from e_compareLinkStates
  (old sub_8132430) by the both-8 result 8. It is called from data/dat33.s, dat34.s and dat35.s.'
