summary: 'The single sequence track of SOUND_BUSTER_6A: sets tempo, voice 0, volume and pan, plays one
  note, then ends.'
details: The branch says the song header (dword_81B82FC) has one track and this is that song's single
  track. On master the bytes are BC 00 BB 4B BD 00 BE 60 BF 40 D6 7F 7F 87 B1 00. In M4A commands that
  is KEYSH, TEMPO, VOICE 0, VOL, PAN, a note, a wait, then FINE. dword_81B82FC's third word points here.
