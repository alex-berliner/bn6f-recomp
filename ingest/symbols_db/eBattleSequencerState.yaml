name: eBattleSequencerState
address: '0x0203CA70'
kind: ram
previous_names:
- dword_203CA70
status: probable
summary: Top-level battle step state; its low byte picks the current battle phase handler each frame.
details: The branch calls it the battle/banner sequencer state word and says its low byte is the state.
  On master battle_runMainStep_800801C and sub_80084F0 load byte [0] and use it as an offset into jump
  tables (off_8008038 with 10 handlers, off_8008508 with 7), then return byte [4]. clearDword_203CA70Record_80084C0
  zero-fills the 12-byte record.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row (Battle sequencer and battle FSM section): "the battle/banner sequencer
    state word (ewram.s:3040); its low byte is the state", citing src/battle.rs:1719 and TODO_ARCHIVE.md:3031
    (T9c).'
  refs:
  - bn6f 5f6c6d00 (branch bn-notes)
  - bn6f/ewram.s:3098
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'dword_203CA70'
  result: bn-notes names it eBattleSequencerState_203CA70 (commit 5f6c6d00, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Both dispatchers do ldrb r0,[r5] then ldr r1,[r1,r0] and bx through a jump table, so byte 0
    is the state offset.
  refs:
  - bn6f/ewram.s:3098
  reproduce: |
    sed -n '3098,3102p' bn6f/ewram.s
  result: 'agrees: yes'
