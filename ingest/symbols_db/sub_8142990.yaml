name: sub_8142990
address: '0x08142990'
kind: function
status: probable
summary: Returns the soul-weapon map-grid tile index (into byte_2006670) under the overworld player's
  current position.
interface: (r10 = Toolkit) -> r0 = ow_getCursorMapTileIndex(playerX, playerY) where X/Y come from ReadOWPlayerObjectCoords
  in r0/r1; saves r4-r7
details: The C calls ReadOWPlayerObjectCoords and then the old sub_8142816 (master ow_getCursorMapTileIndex);
  the player X/Y in r0/r1 pass implicitly as the 16.16 offsets that ow_getCursorMapTileIndex adds to the
  map-specific soul-weapon camera offset before computing x + y*256. Callers include selectSoulWeaponCursorDir
  and other asm37_1.s soul-weapon cursor code, owPlayer_beastOutFacingStep and sub_80A7F78.
