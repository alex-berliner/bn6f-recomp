name: sub_813B928
address: '0x0813B928'
kind: function
status: probable
summary: Returns byte_20096D8, the NaviCust held-part rotation (0-3) stepped by L/R on the placement screen.
interface: () -> r0 = *(u8 *)0x020096D8; clobbers r1
details: The C returns the byte at 0x020096D8. Its setter is sub_813B920. The only callers, in navicust_handlePlacementCursorInput
  (asm36.s:13006 and 13018), read it, add or subtract 1 mod 4 on button bits 0x200/0x100, and store it
  back through sub_813B920.
