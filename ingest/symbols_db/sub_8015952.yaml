name: sub_8015952
address: '0x08015952'
kind: function
status: probable
summary: Writes r0, r1 and r2 as bytes to byte_203CED0[0], [1] and [3].
interface: (r0 = byte 0, r1 = byte 1, r2 = byte 3) -> no return; byte_203CED0[0]=r0, [1]=r1, [3]=r2
details: The C stores the three arguments' low bytes to offsets 0, 1 and 3 of byte_203CED0; offset 2 is
  left alone. Callers are three call sites in sub_8029344 (asm03_0.s:6843-6890), each passing r1 = 0 in
  the visible case.
