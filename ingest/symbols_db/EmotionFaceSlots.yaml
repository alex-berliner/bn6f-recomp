name: EmotionFaceSlots
address: '0x0801E6F4'
kind: data
previous_names:
- byte_801E6F4
status: probable
summary: Maps a navi's battle emotion to the face/emotion window slot used on the battle HUD.
details: 'Eight bytes: six entries 0,2,3,1,5,4 plus two padding bytes, indexed by the emotion value from
  callPossiblyGetBattleEmotion_8015B54. It is read by battleObject_resolveEmotionPalette_801E6A8 (called
  from battle_updateObjectAnim_801CB38), its alternate entry and sub_801E660, which also add offsets when
  the mapped slot is 2 or 3 for some transformation states.'
evidence:
