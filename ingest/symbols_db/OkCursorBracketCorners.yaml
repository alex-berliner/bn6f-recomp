  date: '2026-09-15'
  detail: 'docs/renames.md row citing src/custom.rs:305: "byte_80288B0 for a slot, byte_80288E4 for OK
    ... four words each of dy, 0, dx, flags".'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:5325
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80288E4'
  result: bn-notes names it OkCursorBracketCorners_80288E4 (commit 0d5c5f33, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: The layout matches, and the table goes with selection kind 1 at a fixed screen position, which
    fits a single button; the code alone does not show that the button is OK.
  refs:
  - bn6f/asm/asm03_0.s:5325
  reproduce: |
    sed -n '5325,5385p' bn6f/asm/asm03_0.s
  result: 'agrees: yes'
