name: OkCursorBracketCorners
address: '0x080288E4'
kind: data
previous_names:
- byte_80288E4
status: probable
summary: 'Corner offsets for the blinking cursor brackets drawn around the OK button in the chip window:
  two blink frames of four corners each.'
details: 32 bytes in the same layout as byte_80288B0 (SlotCursorBracketCorners), with larger spans (0x16
  by 0x14, then 0x14 by 0x12). loadConstArgsAndPairTable_80288D0, entry 1 of jt_802886C, returns it in
  r6 together with a fixed position (r0 = 0x5B, r1 = 0x6E).
