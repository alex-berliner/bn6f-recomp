name: ThrownBombLandRegionByParam1
address: '0x080C5D7C'
kind: data
previous_names:
- dword_80C5D7C
status: probable
summary: 'Per-bomb collision region byte used when a thrown bomb lands: small blast for MiniBomb, wide
  for BigBomb.'
details: Indexed by Param1 in battleObject_updateBombPanelBomb_80C5C9C when the bomb lands on a solid
  panel; the byte is written to CollisionData.Region before sub_801BD3C and SOUND_HIT_BOMB_1. The word
  0x0F000001 gives bytes 1, 0, 0, 0x0F for Param1 0 to 3. A companion byte table dword_80C5D80 (all zero)
  is read the same way.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "the region byte dword_80C5D7C[Param1] is 1 for MiniBomb and 0xf for BigBomb",
    citing src/battle.rs:945.'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/asm/asm31.s:31623
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'dword_80C5D7C'
  result: bn-notes names it ThrownBombLandRegionByParam1_80C5D7C (commit 2ea59267, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master does ldrb r3,[dword_80C5D7C + Param1] then strb r3,[CollisionData,#Region]; byte 0 is
    1 and byte 3 is 0xF, consistent if MiniBomb is Param1 0 and BigBomb Param1 3.
  refs:
  - bn6f/asm/asm31.s:31623
  reproduce: |
    sed -n '31623,31683p' bn6f/asm/asm31.s
  result: 'agrees: yes'
open_questions:
- Which Param1 values belong to MiniBomb and BigBomb is not visible here; only 4 bytes exist, so Param1
  above 3 would read into dword_80C5D80.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_thrownBombLandRegionByParam1.'
sources:
- bn6f bn-notes 2ea59267
- audit docs/reviews/2026-10-20-orphaned-branches.md
