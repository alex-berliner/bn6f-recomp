  then moves to state 0x10 or 0x14.'
interface: (r5 = BattleState) -> writes Index_01 = 0x10 (battle effects bit 1 set) or 0x14; clears StatePhaseAndInitFlag
details: Entry 0x1C of BattleFsmStates. On first entry it runs chatbox script 0x10 (BattlePhase <= 1)
  or 0x20 from TextScriptDadCybeastTut; then waits until chatbox flag 0x80 clears and picks the next state
  from GetBattleEffects bit 1. The branch's only evidence is the table position.
