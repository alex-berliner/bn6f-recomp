name: sub_8012792
address: '0x08012792'
kind: function
status: probable
summary: 'Battle AI helper: walks a table of halfword-stream pointers backwards, advancing a per-stream
  byte cursor on a match with r1; returns the stopping stream index or 0xFF.'
interface: '(r0 = 4 * entry count, r1 = wanted u16, r2 = table of u32 stream pointers, r3 = one past the
  end of a byte cursor array) -> r0 = index i or 0xFF; side effect: cursor[i] += 2 on a match'
details: 'For i from count-1 down to 0 the C reads the u16 at stream[i] + cursor[i]: if it is 0 it returns
  i; if it equals the wanted value it bumps cursor[i] by 2 and returns i if the u32 at the new position
  is 0, otherwise it continues; it returns 0xFF when the table runs out. Both callers (asm31.s:125161
  and 125345, in the AI chip-selection routine) pass the table at oAIAttackVars_PanelChooseCallback, counts
  5 and 3, and the cursor bytes at AIAttackVars+0x30.'
evidence:
- method: assembly-reading
  date: '2026-05-25'
  detail: 'Old C: "h = *(u16 *)(p + c); if (h == 0u) return (u32)i >> 2; if (h != wanted) continue; c
    += 2u; *cursors = (u8)c; if (*(u32 *)(p + c) == 0u) return (u32)i >> 2;". Commit description: "scan-down
    hword search with cursor bump".'
  refs:
  - bn6f 75b2c2a2 (old master, shelved decomp work)
  - e6bb4969:src/c/sub_8012792.c
  - bn6f/asm/asm00_2.s:8804
  reproduce: |
    git -C bn6f fetch origin old-master-2026-07-12
    git -C bn6f show e6bb4969:src/c/sub_8012792.c
  result: A hand C translation from the shelved decomp effort on the old master, which its replay harness
    accepted at the time; that harness was removed and not re-run here.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master's loop (sub r0,#4/bmi; sub r7,#1; ldr r2,[r6,r0]; ldrb r1,[r7]; ldrh r3,[r2,r1]; compare;
    add r1,#2; strb; ldr r3,[r2,r1]) matches the C step for step, including reading the u32 with the untruncated
    cursor+2.
  refs:
  - bn6f/asm/asm00_2.s:8804
  reproduce: |
    sed -n '8804,8864p' bn6f/asm/asm00_2.s
  result: 'agrees: yes'
open_questions:
- What the streams encode (likely AI input/panel patterns) and why the master field at AIAttackVars+0x28
  is called PanelChooseCallback when it is used as a table pointer here.
- The u32 terminator read may be unaligned (cursor only even), which on the GBA rotates the loaded word.
