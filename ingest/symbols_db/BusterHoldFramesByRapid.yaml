name: BusterHoldFramesByRapid
address: '0x080209CC'
kind: data
previous_names:
- byte_80209CC
status: probable
summary: Buster hold length in frames after firing, by Rapid level and number of free panels ahead (max
  5).
details: Thirty bytes (five rows of six) plus two padding bytes, indexed row*6 + min(free panels ahead,
  5) by scanFrontPanels_800FAF6, with the row from GetBattleNaviStatsByte(alliance, 2) in battle_SpawnObjectOnFrontPanel_800FAAC.
  Row 0 is 4,8,12,16,20,24; later rows are shorter. The branch says the full buster pose is battle_busterFirePhase's
  five fire ticks plus this value.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "byte_80209CC[Rapid*6 + min(free panels ahead,5)] ... three exact predictions"
    (TODO_ARCHIVE.md:2274, ticket F31b). Note at data/dat01.s on bn-notes: "Measured at three columns
    on the real ROM: 29 / 25 / 21 frames at columns 1 / 2 / 3, Rapid row 0."'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/data/dat01.s:146
  - bn-notes a5c3b9fe:data/dat01.s:146
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80209CC'
    git -C bn6f show a5c3b9fe:data/dat01.s | sed -n '146,149p'
  result: bn-notes names it BusterHoldFramesByRapid_80209CC (commit 2ea59267, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: runtime
  date: '2026-09-15'
  detail: The branch's note says this was measured live against the original game (by the bn reimplementation's
    harness); the measurement is not in this repo and was not repeated in this audit.
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80209CC'
    git -C bn6f show a5c3b9fe:data/dat01.s | sed -n '146,149p'
  result: claim recorded as the branch states it
- method: assembly-reading
  date: '2026-10-20'
  detail: scanFrontPanels_800FAF6 computes r1 = stat*6 + count (count capped at 5) and does ldrb from
    byte_80209CC; row 0 values 24/20/16 plus 5 match the measured 29/25/21.
  refs:
  - bn6f/data/dat01.s:146
  reproduce: |
    sed -n '146,206p' bn6f/data/dat01.s
  result: 'agrees: yes'
open_questions:
- That NaviStats byte 2 is Rapid comes from the branch; master's struct calls offset 2 Speed.
- Master names of the two readers (battle_SpawnObjectOnFrontPanel_800FAAC, scanFrontPanels_800FAF6) do
  not reflect the buster role.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_busterHoldFramesByRapid.'
