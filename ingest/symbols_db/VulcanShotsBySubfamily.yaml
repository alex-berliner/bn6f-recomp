    sub_80EBF6E"; "Shots per Vulcan, from the subfamily (dword_80EBFEC = 0xA050403)", citing src/battle.rs:490,497,4354
    and src/shot.rs:89.'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
