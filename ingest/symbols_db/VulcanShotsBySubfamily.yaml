status: probable
summary: Number of shots each Vulcan chip fires, per subfamily (3, 4, 5, 10).
details: 'A word 0x0A050403 read as bytes indexed by AIAttackVars byte 3 in ai_attackChargedRepeatSpawner
  (0x080EBF6E): 3, 4, 5 and 10 are stored in ChargeCycles as the shot count. The same routine fires a
  shot every 0xA frames.'
