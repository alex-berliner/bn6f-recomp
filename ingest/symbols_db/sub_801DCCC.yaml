  date: '2026-05-25'
  detail: 'Old C: "if ((p[0] & 1u) != 0u && *(u8 **)(p + 0xc) == bo) { p[4] = (u8)a; p[5] = (u8)b; return
    0u; }". Commit description: "set bytes +4/+5 of first slot whose +0xc == bo".'
  refs:
  - bn6f 9b4d2f03 (old master, shelved decomp work)
