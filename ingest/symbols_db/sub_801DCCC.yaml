name: sub_801DCCC
address: '0x0801DCCC'
kind: function
status: probable
summary: Updates bytes +4/+5 of the battle status-list slot (byte_203EB50) owned by the battle object
  in r5; returns 0, or 1 if none.
interface: (r0 = byte for +4, r1 = byte for +5, r5 = BattleObject) -> r0 = 0 on update, 1 if no in-use
  slot (bit 0 of byte +0 set) has +0xc == r5; clobbers r1-r3
details: The C scans the four 0x14-byte entries at byte_203EB50 for one with bit 0 of byte +0 set and
  owner pointer +0xc equal to r5, writes the two argument bytes to +4 and +5 and returns 0, else returns
  1. sub_801DC7C, which claims these slots, writes the same two parameters to +4/+5 when it creates an
  entry, so this is the update counterpart. The only caller (sub_80BC468, asm31.s:9752) passes r0 = an
  X-distance between two objects and r1 = 0 with r5 set to the other object.
evidence:
