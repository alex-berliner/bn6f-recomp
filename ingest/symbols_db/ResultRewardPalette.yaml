name: ResultRewardPalette
address: '0x08733394'
kind: data
previous_names:
- dword_8733394
status: probable
summary: A 32-byte reward palette for the RESULT window (bank 12), used when the reward is of one particular
  kind (kind 1).
details: The branch says this is the 32-byte reward palette for bank 12. On master the reward-drawing
  code picks a tiles/palette pair by reward kind. Kind 1 uses dword_8732E54 / dword_8733394, kind 2 and
  kind 3 use other palettes, and chips use their ChipData +0x24/+0x28. The palette goes to unk_3001AE0
  (bank 12) as 0x20 bytes.
