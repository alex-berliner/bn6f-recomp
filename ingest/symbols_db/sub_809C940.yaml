name: sub_809C940
address: '0x0809C940'
kind: function
status: probable
summary: Clears the event flag whose number is the u32 at +0x14 of the struct pointed to by eCutsceneState+0x70.
interface: () -> no return; ClearEventFlag(*(u32 *)(*(u32 *)(eCutsceneState + 0x70) + 0x14)); saves r4-r7
details: The C reads the pointer at 0x02011C50+0x70 (eCutsceneState, just past owMapObjectPtrs_44 on master),
  then its word +0x14, and passes it to ClearEventFlag. The only caller is e_decelRiseUpdate (asm29.s:10200),
  which calls it when its 30-frame decelerating motion finishes.
