summary: 4bpp tile blob that animated-tile scripts copy from, for the battle backdrop and several overworld
  warp animations.
details: The branch says the backdrop's animation slices its tiles out of the blob at dword_8617488, and
  deliberately does not name it for the backdrop. On master it is the gfx_src of gfx_anim_4bit_tile_copy
  commands in data/dat20.s (five uses, to 0x6000040). Warp scripts in maps/CentralArea, GreenArea, SeasideArea
  and SkyACDCArea (two in SkyACDCArea) also copy from it, each copying 0x24 tiles.
