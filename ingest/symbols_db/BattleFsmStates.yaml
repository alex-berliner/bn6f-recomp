name: BattleFsmStates
address: '0x080091BC'
kind: data
previous_names:
- off_80091BC
status: probable
summary: Jump table of the top-level battle state machine states 0x00..0x24 (intro, chip window, fight,
  result, tutorial messages, comm error).
details: Ten handler pointers dispatched by battle_runBattlePhase_8009158 using BattleState.Index_01 as
  a pre-multiplied byte offset. The branch says a battle walks 0x00 -> 0x04 -> 0x08 -> 0x0C and parks
  at 0x0C, the state that runs the banner sequencer each frame. Entry 0x08 is battle_fsmState08 (waits
  on battle_isChipWindowReady), 0x0C is battle_stepRunAndDecideResult_800938A, 0x1C/0x20 are battle_fsmState1C/battle_fsmState20
  and 0x24 is battle_stateNaviCommErrorMsg.
