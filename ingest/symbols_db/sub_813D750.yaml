name: sub_813D750
address: '0x0813D750'
kind: function
status: probable
summary: Writes the halfword 0xB to eS200BC50+8 (RFU link-state struct); used as a callback in two timed
  callback tables.
interface: () -> no return; *(u16 *)0x0200BC58 = 0xB; leaves r0 = eS200BC50, r1 = 0xB
details: The C impl stores 11 at 0x0200BC58 and is wrapped by DECOMP_VTABLE_WRAPPER (push lr, bl impl,
  pop/mov pc) for its use as a function pointer. It is listed in the (value, function) tables dword_80496EC
  (paired with 0x4C) and dword_803A5C4 (paired with 0x50), between entries for sub_803C34E.
