summary: Clears the halfword at eS200A290+0x20 and the byte at eS200A290+0x16.
interface: () -> no return; *(u16 *)0x0200A2B0 = 0; *(u8 *)0x0200A2A6 = 0; clobbers r0, r2
details: The C zeroes the u16 at 0x0200A290+0x20 and the u8 at +0x16. Master's assembly does the same
  via eS200A290. It has about 13 callers in battle-scene and link setup code (asm03_1_1.s, asm03_2.s),
  including the battle scene initialization at asm03_1_1.s:2023.
