status: probable
summary: Three BG palette-bank masks (banks 11, 12 and 9) that the chip window ORs into chip-icon map
  entries.
details: 'Three halfwords: 0xB000 (bank 11), 0xC000 (bank 12) and 0x9000 (bank 9). Only sub_80283C8 (battle_pickChipIconPaletteBank)
  reads it, at byte offsets 0, 2 and 4.'
