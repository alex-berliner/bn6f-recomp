    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_8028470'
  result: bn-notes names it ChipIconPaletteBanks_8028470 (commit 0d5c5f33, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: The data is .byte 0x0,0xB0,0x0,0xC0,0x0,0x90, read with ldrh r2,[r1,r2]; the evidence names
