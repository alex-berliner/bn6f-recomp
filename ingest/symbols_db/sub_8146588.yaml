summary: 'Sets five RFU link defaults: byte_200FE80=0, byte_2010160=0x20, byte_200FFE4=1, byte_2010164=1,
  word_200FE50=0xF0.'
interface: () -> no return; five constant stores; clobbers r0, r1
details: The C writes the five constants to those EWRAM addresses. sub_81465FC later copies byte_2010160,
  byte_2010164 and word_200FE50 into an RFU parameter block and uses byte_200FFE4. Callers are rfu_tryStartLinkSession
  and other link setup code in asm03_1_1.s, asm03_2.s and asm33.s.
