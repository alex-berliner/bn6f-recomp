name: sub_803C2A0
address: '0x0803C2A0'
kind: function
status: probable
summary: Sets flag bit 8 in the RFU shared state flags word via rfu_orFlags(8).
interface: () -> no return; rfu_orFlags(8) (ORs 8 into eS200BC50+0xC); saves r4-r7
details: The C is a thin wrapper calling the old sub_803CB00 with 8; that address is master's rfu_orFlags,
  which ORs its argument into the flags word at offset 0xC of the RFU/wireless state at 0x200BC50. Callers
  are in RFU/link code (asm36.s:4222 rfu_initOrRestartSession area, asm03_2.s:5386/5444, asm03_1_1.s:2480
  battle_transitionToStart).
