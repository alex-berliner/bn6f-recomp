name: BattleBackdropTiles0
address: '0x0807FE40'
kind: data
previous_names:
- byte_807FE40
status: probable
summary: 'One frame of the battle backdrop art animation: a list of 36 tile indices copied into VRAM.'
details: A 72-byte table of 36 halfword tile indices into dword_8617488, used as one frame by the backdrop
  animation script off_807FB98 (BattleBackdropGFXAnimScript), which references it 3 times out of 29 entries.
  The seven tables sit 0x48 bytes apart from 0x0807FC90 to 0x0807FE40. The branch numbers it frame 0,
  following the order of the FRAMES array in the bn Rust reimplementation.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row covering byte_807FE40 to byte_807FDF8: "FRAMES[0]=E40, [1]=CD8, [2]=C90,
    [3]=D20, [4]=D68, [5]=DB0, [6]=DF8", citing TODO_ARCHIVE.md:317 (A7) and src/backdrop.rs:74-76; no
    note at this symbol.'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/data/dat20.s:214
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_807FE40'
  result: bn-notes names it BattleBackdropTiles0_807FE40 (commit 2ea59267, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master shows a 36-halfword table referenced only by gfx_anim_data_ptr entries in off_807FB98,
    consistent with a backdrop tile frame; the number 0 is not derivable from the ROM order or the script
    order.
  refs:
  - bn6f/data/dat20.s:214
  reproduce: |
    sed -n '214,274p' bn6f/data/dat20.s
  result: 'agrees: yes'
open_questions:
- The index in the name comes from the Rust FRAMES array, not ROM address order or first use in the script;
  the owner may prefer an address-ordered or role-based name.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_backdropTiles0.'
sources:
