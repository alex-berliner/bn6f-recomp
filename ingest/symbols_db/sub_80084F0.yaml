  date: '2026-09-15'
  detail: 'Note at asm/asm00_1.s on bn-notes: "A SECOND dispatcher over the SAME eBattleSequencerState
    word, with its own seven-entry table (off_8008508) instead of BannerSequencerStates", reached from
    sub_800980E rather than battleFsmState0C; it adds that sub_800855E is "the fight state''s per-frame
    body, which adds to the CUSTOM gauge and opens every frame with UnpauseBattle."'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/asm/asm00_1.s:11794
  - bn-notes a5c3b9fe:asm/asm00_1.s:11058
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe:asm/asm00_1.s | sed -n '11058,11064p'
  result: bn-notes documents it in a note but keeps the name sub_80084F0. The branch read the code and
