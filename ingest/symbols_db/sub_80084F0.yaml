name: sub_80084F0
address: '0x080084F0'
kind: function
status: probable
summary: Second dispatcher over the battle sequencer state word, used during the battle-result phase with
  its own seven-state table.
interface: (no args) -> r0 = byte [dword_203CA70+4]; dispatches off_8008508[[dword_203CA70]] with r5 =
  dword_203CA70
details: Same shape as battle_runMainStep_800801C but indexes a 7-entry table off_8008508 (sub_8008528,
  battle_dispatchNextPhase, e_dispatchUpdateByState, sub_8008764, battle_effectWaitDispatch, battle_introStepDispatch,
  npc_checkRecordFlagFinish). Its only caller is battle_processBattleResultPhase (0x0800980E), not the
  banner sequencer's FSM state, so the meaning of a state value depends on which battle FSM state is running.
  The branch keeps address names for these seven states.
evidence:
