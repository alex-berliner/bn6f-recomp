  refs:
  - bn6f/asm/asm00_1.s:11794
  reproduce: |
    sed -n '11794,11854p' bn6f/asm/asm00_1.s
  result: 'agrees: yes'
open_questions:
- sub_800855E named in the note is master's battle_dispatchNextPhase (entry 1, offset 4), whose master
  name suggests a different role than 'fight per-frame body'.
- No rename proposed; a name such as a result-phase sequencer step could be considered.
