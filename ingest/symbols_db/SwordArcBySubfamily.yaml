name: SwordArcBySubfamily
address: '0x080EBAD8'
kind: data
previous_names:
- byte_80EBAD8
status: probable
summary: Per-subfamily effect used for the sword's slash arc.
details: 16 bytes indexed by AIAttackVars byte 3 in the sword attack routine. The byte, plus the flip
  in bits 8-15 and an extra field for slots 0xC-0xF, is passed to spawn_t1_0x0_EffectObject, i.e. it selects
  a row of byte_80E0398 (proposed EffectObjectRows). Values are 0x16-0x1C, 0x28, 0x2D, 0x25 and 0x5F.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "The arc''s animation is byte_80EBAD8 per subfamily", citing src/battle.rs:4193,
    in the sword row.'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/asm/asm31.s:116521
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80EBAD8'
  result: bn-notes names it SwordArcBySubfamily_80EBAD8 (commit ffe10f48, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master uses the byte as the low parameter of spawn_t1_0x0_EffectObject, so it is an effect-row
    index (rows 0x16-0x1A are the arcs in byte_80E0398), not a raw animation number.
  refs:
  - bn6f/asm/asm31.s:116521
  reproduce: |
    sed -n '116521,116581p' bn6f/asm/asm31.s
  result: 'agrees: partly'
open_questions:
- The branch calls it the arc's animation, but the code passes it as the effect object's row (Param1),
  which then picks sprite and animation.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_swordArcBySubfamily.'
sources:
- bn6f bn-notes ffe10f48
- audit docs/reviews/2026-10-20-orphaned-branches.md
