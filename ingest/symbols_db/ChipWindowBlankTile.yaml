name: ChipWindowBlankTile
address: '0x08026C88'
kind: data
previous_names:
- byte_8026C88
status: probable
summary: Blank (tile 0) column of BG map entries; the chip window's slide-out stamps it over each column
  the window has just left.
details: Sixty zero bytes (30 u16 tile ids). scrollStrip_update_8026BF4, row 0x08 (the slide-out) of off_8026AA4,
  passes it through off_8026C84 to CopyBackgroundTiles as a 1x20 column in BG block 3, one or two columns
  per call. That is its only reference.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row citing src/custom.rs:710 and TODO_ARCHIVE.md:1552 (F3): "clears the columns
    the window has vacated with the blank tile (byte_8026C88)"; note at asm/asm03_0.s:845 on bn-notes:
    the slide-out is "clearing each vacated column with ChipWindowBlankTile".'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:1182
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_8026C88'
  result: bn-notes names it ChipWindowBlankTile_8026C88 (commit 0d5c5f33, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: In scrollStrip_update_8026BF4, ldr r3,=byte_8026C88 with r4 = 1 and r5 = 0x14 feeds CopyBackgroundTiles
    once per vacated column, as the note says.
  refs:
  - bn6f/asm/asm03_0.s:1182
  reproduce: |
    sed -n '1182,1242p' bn6f/asm/asm03_0.s
  result: 'agrees: yes'
open_questions:
- 'The singular ''Tile'' undersells it: this is a 20-entry column buffer (60 bytes, of which 40 are read).'
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_chipWindowBlankTile.'
