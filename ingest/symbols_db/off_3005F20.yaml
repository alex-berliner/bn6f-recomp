name: off_3005F20
address: '0x03005F20'
kind: data
status: probable
summary: Two-entry table of colour-blend routines (add colour, subtract colour) used by the palette tint
  routine.
details: The branch says the routine is a colour blend of the staged words in place, not an allocator,
  with r2 a jump index into off_3005F20. On master palette_addOrSubtractColor loads off_3005F20[r2] and
  calls it once per BGR555 entry. The table has two entries, sub_3005F34 and sub_3005F56. It is called
  from sprite_loadPalette_8002818 and through byte_8002450 in getPalleteAndTransition_80023E0.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "a colour-blend of the 16 staged words in place, not an allocator: r0
    = blend param, r2 = jump index into off_3005F20", citing docs/recon/F39a.md:163.'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/asm/asm38.s:572
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'off_3005F20'
  result: bn-notes names it ObjPaletteBlendModes_3005F20 (commit 2ea59267, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: The table is two blend helpers indexed by r2, but getPalleteAndTransition_80023E0 also runs
    it for ePalette20097a0 transition entries, where r7 can be any buffer pointer, so it is not only for
    OBJ palettes.
  refs:
  - bn6f/asm/asm38.s:572
  reproduce: |
    sed -n '572,632p' bn6f/asm/asm38.s
  result: 'agrees: partly'
open_questions:
- The blend routine works on any palette buffer passed in r7, so the ObjPalette prefix may be too narrow.
- 'The branch''s name ObjPaletteBlendModes_3005F20 was not proposed: it would mislead (see details).'
sources:
- bn6f bn-notes 2ea59267
- audit docs/reviews/2026-10-20-orphaned-branches.md
