name: MoveDestinationFilterMask
address: '0x08012DD4'
kind: data
previous_names:
- byte_8012DD4
status: probable
summary: Per-alliance panel filter used when picking a random destination panel for a moving object.
details: 'Two 8-byte rows (one per alliance) of two words: alliance 0 = 0x20, 0x80; alliance 1 = 0x00,
  0xA0. sub_8012DB8 passes it to GetAllianceDependentPanelParamArgs (returns the pair in r2/r3) and then
  to sub_8015C94, a random panel picker; the chosen panel is packed as x | y<<4. object_transferPanelReserve
  uses that result when moving a panel reservation.'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "the game''s destination filter rejects by the panel''s reserve and occupant
    flags (byte_8012DD4 ...)" (bn src/actor.rs:776).'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/asm/asm00_2.s:9740
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_8012DD4'
  result: bn-notes names it MoveDestinationFilterMask_8012DD4 (commit ffe10f48, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Code loads the row by alliance*8 as two words and feeds them to the random-panel picker sub_8015C94,
    consistent with a destination filter, though which bits mean reserve and occupant is not visible.
  refs:
  - bn6f/asm/asm00_2.s:9740
  reproduce: |
    sed -n '9740,9800p' bn6f/asm/asm00_2.s
  result: 'agrees: yes'
open_questions:
- The data is two words per alliance (likely required/rejected flag sets), not a single mask; the name
  'Mask' may undersell that.
- Reserve/occupant meaning of 0x20, 0x80, 0xA0 not confirmed here.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_moveDestinationFilterMask.'
sources:
- bn6f bn-notes ffe10f48
- audit docs/reviews/2026-10-20-orphaned-branches.md
