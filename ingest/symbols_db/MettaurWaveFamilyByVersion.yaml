name: MettaurWaveFamilyByVersion
address: '0x08109F40'
kind: data
previous_names:
- byte_8109F40
status: probable
summary: Mettaur per-Version byte copied into the attack vars as the shockwave's family tag; the values
  are just 0..5.
details: The branch says the code reads byte_8109F40[Version] into AIAttackVars_Unk_0c as a family tag.
  On master battle_aiSelectAndUseChip_810A126 stores byte_8109F40[Version] into oAIAttackVars_AttackBoost2
  before the attack. The six bytes are 0,1,2,3,4,5, the Version itself.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "reads byte_8109F40[Version] into AIAttackVars_Unk_0c (a ''family'' tag)",
    citing src/objects.rs:471; docs/renames.md Mettaur AI block header: the notes "walk the entire machine
    state by state and say it was measured live against the real ROM".'
  refs:
  - bn6f ea20f9de (branch bn-notes)
  - bn6f/asm/asm31.s:181946
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_8109F40'
  result: bn-notes names it MettaurWaveFamilyByVersion_8109F40 (commit ea20f9de, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: runtime
  date: '2026-09-15'
  detail: The branch's note says this was measured live against the original game (by the bn reimplementation's
    harness); the measurement is not in this repo and was not repeated in this audit.
  refs:
  - bn6f ea20f9de (branch bn-notes)
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_8109F40'
  result: claim recorded as the branch states it
- method: assembly-reading
  date: '2026-10-20'
  detail: One ldrb [table, Version] into the attack vars field master calls AttackBoost2; the table is
    the identity 0..5, so its meaning comes from the reader, not the data.
  refs:
  - bn6f/asm/asm31.s:181946
  reproduce: |
    sed -n '181946,182006p' bn6f/asm/asm31.s
  result: 'agrees: yes'
open_questions:
- The values equal the Version index, so what family means is not visible in the data.
- Master calls the destination field AttackBoost2, the branch Unk_0c.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be ai_mettaurWaveFamilyByVersion.'
