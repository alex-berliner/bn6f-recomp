name: sub_81466E4
address: '0x081466E4'
kind: function
status: probable
summary: Returns the address of 8-byte entry (r0 & 0xFF) of the staging buffer unk_2009750.
interface: (r0 = index) -> r0 = 0x02009750 + (r0 & 0xFF) * 8; clobbers r1
details: The C masks the index to a byte and returns base + idx*8; master does lsl 24 / lsr 21. unk_2009750
  is an RFU staging buffer of eight 8-byte entries per symdb. The only caller is sub_803CAC4 (asm03_1_1.s:8461),
  which pairs each entry with ow_getOverworldEntry via storeIndexedPair.
