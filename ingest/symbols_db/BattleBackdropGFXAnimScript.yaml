name: BattleBackdropGFXAnimScript
address: '0x0807FB98'
kind: data
previous_names:
- off_807FB98
status: probable
summary: GFX animation script that animates the battle backdrop's tile art in a 192-frame loop.
details: 'A gfx_anim script: one 4-bit tile copy header (source dword_8617488, destination unk_6000040,
  36 tiles, buffer index 5) followed by 29 frame entries and gfx_anim_loop. The first 10 entries hold
  4 frames each and the next 19 hold 8 frames each, 192 frames in total. Each entry points at one of seven
  36-entry tile index tables (byte_807FC90 to byte_807FE40). It is referenced from a pointer list in asm/asm21.s
  (off_8081298).'
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "the script is off_807FB98 (data/dat20.s:140-172): TEN 4-frame entries,
    then NINETEEN 8-frame entries, a 192-frame loop", citing TODO_ARCHIVE.md:364 (A7), "VERIFIED EXACT
    against a live dump", and src/backdrop.rs:69; the note at data/dat20.s:140 on bn-notes says it was
    read entry by entry against the live eGFXAnimStates slot and that the art starts one frame before
    the scroll counters reach zero.'
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  - bn6f/data/dat20.s:140
  - bn-notes a5c3b9fe:data/dat20.s:140
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'off_807FB98'
    git -C bn6f show a5c3b9fe:data/dat20.s | sed -n '140,146p'
  result: bn-notes names it BattleBackdropGFXAnimScript_807FB98 (commit 2ea59267, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: runtime
  date: '2026-09-15'
  detail: The branch's note says this was measured live against the original game (by the bn reimplementation's
    harness); the measurement is not in this repo and was not repeated in this audit.
  refs:
  - bn6f 2ea59267 (branch bn-notes)
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'off_807FB98'
    git -C bn6f show a5c3b9fe:data/dat20.s | sed -n '140,146p'
  result: claim recorded as the branch states it
- method: assembly-reading
  date: '2026-10-20'
  detail: Master shows exactly 10 gfx_anim_data_ptr entries with delay 4 and 19 with delay 8 (10*4+19*8
    = 192) before gfx_anim_loop, copying 0x24 tiles from dword_8617488 to unk_6000040.
  refs:
  - bn6f/data/dat20.s:140
  reproduce: |
    sed -n '140,200p' bn6f/data/dat20.s
  result: 'agrees: yes'
open_questions:
- Which battlefield/backdrop uses it is not stated; it is one of several similar scripts (e.g. off_807FE88)
  in the asm21.s pointer list.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_backdropGFXAnimScript.'
