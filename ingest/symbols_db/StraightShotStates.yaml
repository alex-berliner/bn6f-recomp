summary: 'State table for a panel-stepping attack object (straight shot): init, travel, destroy.'
details: Three-entry state table read by t3_0x0_80C4E58 on CurState, which then calls object_updateSprite.
  State 0 is battleObject_initAttackFromDefTable_80C4E7C (loads sprite and animation from a 12-byte definition
  picked by Param1 from off_80C4C78), state 1 is battle_object_collisionPhase_80C4F02 (counts Timer down
  and steps one panel when it goes below zero), state 2 is object_genericDestroy.
