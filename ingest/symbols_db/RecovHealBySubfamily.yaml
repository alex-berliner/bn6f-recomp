name: RecovHealBySubfamily
address: '0x080EC870'
kind: data
previous_names:
- byte_80EC870
status: probable
summary: HP restored by each Recov chip, per subfamily (10, 30, 50, 80, 120, 150, 200, 300, 1000).
details: Ten halfwords (10, 30, 50, 80, 120, 150, 200, 300, 1000, 0) indexed by AIAttackVars byte 3 *
  2 in sub_80EC844, which passes the amount to battleObject_applyHPAndHandleSpecial_800E2FC with r1 =
  1 and then exits the attack state. The renames row's other half names battle_aiAttackStateDispatch_80EC884
  as AirShot.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row: "AirShot (attack family 0x21, sub_80EC884)"; "the amounts are byte_80EC870,
    one per subfamily", citing src/battle.rs:620 and :643.'
  refs:
  - bn6f ffe10f48 (branch bn-notes)
  - bn6f/asm/asm31.s:118453
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'byte_80EC870'
  result: bn-notes names it RecovHealBySubfamily_80EC870 (commit ffe10f48, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Master sub_80EC844 does ldrh r0,[byte_80EC870 + tier*2] then applies it as HP; the values match
    the Recov10-Recov300 series plus 1000.
  refs:
  - bn6f/asm/asm31.s:118453
  reproduce: |
    sed -n '118453,118513p' bn6f/asm/asm31.s
  result: 'agrees: yes'
open_questions:
- The renames row mixes this table with the AirShot routine at 0x080EC884; the reader is sub_80EC844,
  not sub_80EC884.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_recovHealBySubfamily.'
sources:
- bn6f bn-notes ffe10f48
- audit docs/reviews/2026-10-20-orphaned-branches.md
