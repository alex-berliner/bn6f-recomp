status: probable
summary: BG tile ids drawn at the end of the custom gauge while it is full, two alternating groups of
  four tiles.
details: Eight halfword tile ids 0x9236..0x923D. battle_drawTimerTiles_801C4E4 (HUD draw slot 4), once
  the gauge value reaches 0x4000, picks offset (counter & 8), i.e. the first or second group of four,
  and writes a 4-tile row at column 0xD with bg_writeTileIdRow_80018E0, so the group alternates every
  8 frames.
