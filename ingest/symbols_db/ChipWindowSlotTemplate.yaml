name: ChipWindowSlotTemplate
address: '0x0802A7CC'
kind: data
previous_names:
- dword_802A7CC
status: probable
summary: Template for the first word of each of the chip window's twelve slot records; copied in when
  chip selection starts.
details: Twelve words. resetBattleRecordSlots_8027E90 copies word i into the first word of 12-byte record
  i at r4 and zeroes the other two words. It then sets header bytes +0x84 and +0x8B according to battle
  mode. Master's own comment says it 'feeds into the first word of most entries in unk_20365C0'.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row citing src/custom.rs:92: "sub_8027E90 copies the template dword_802A7CC
    into the twelve per-slot records".'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:9785
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'dword_802A7CC'
  result: bn-notes names it ChipWindowSlotTemplate_802A7CC (commit 0d5c5f33, 2026-09-15). The branch read
    the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: mov r3,#0xc, then a loop of ldr [r1]; str [r2]; zero +4 and +8; r1 += 4; r2 += 0xC, confirms
    twelve records seeded from the twelve words.
  refs:
  - bn6f/asm/asm03_0.s:9785
  reproduce: |
    sed -n '9785,9845p' bn6f/asm/asm03_0.s
  result: 'agrees: yes'
open_questions:
- The meaning of the four bytes in each template word is not documented.
- Master names the copier resetBattleRecordSlots_8027E90, not a chip-window name.
- 'Name style: data and RAM follow master''s existing convention here; the strict prefix_lowerCamel form
  would be battle_chipWindowSlotTemplate.'
sources:
- bn6f bn-notes 0d5c5f33
- audit docs/reviews/2026-10-20-orphaned-branches.md
