proposed_name: battle_bannerSeqState00Settle
branch_status: probable
branch_summary: 'Banner sequencer state 0x00: the settle step after the chip window closes, before the
  next banner wait.'
interface: (r5 = eBattleSequencerState record) -> writes 4 to [r5] when done; uses [r5+2], [r5+3] as latches
details: Entry 0 of BannerSequencerStates. On first entry ([r5+3]==0) it calls sub_80147E4 with byte_203F558/byte_203F658
  and sets [r5+3]=4; each frame it calls battle_runControllerStep_801483C and waits while that returns
  nonzero. It then latches [r5+2] via timer_resetAndStart_801482C, and on the next pass runs sub_8015A38
  on both players and writes state 0x04 (banner wait).
