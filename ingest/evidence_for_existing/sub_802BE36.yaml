existing_entry: symbols/db/sub_802BE36.yaml
address: '0x0802BE36'
kind: function
proposed_name: battle_resultWindowSlideTick
branch_status: probable
branch_summary: 'Per-frame slide step of the battle RESULT window: moves it 2 tile columns (16 px) a tick
  until column 3, drawing the clear time and busting level.'
interface: (r5 = eS20364C0) -> (); signed byte [r5+6] += 2, clamped to 3, then JumpOffset01 = 4; unless
  [r5+4] == 2, calls sub_802C4E8(r0 = [r5+0x1C], r1 = [r5+0xE]) and sub_802C6EC(r0 = [r5+8])
details: It is entry 1 of object_dispatchByStep's table, i.e. state 0x00 of battle_chipSelectStep_802BDC0's
  machine. Each frame, battle_initChipSelect_802BD60 (the branch's result-window driver) passes the signed
  column byte +6 as the CopyBackgroundTiles x of the 0x18x0x12 window block.
