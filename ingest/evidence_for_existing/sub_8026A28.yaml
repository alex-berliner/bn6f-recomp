proposed_name: battle_isChipWindowReady
branch_status: probable
branch_summary: Per-frame tick of the chip-select (Custom) window's outer state machine; its return value
  tells the battle when the window is done.
interface: () -> r0 = handler status (0 while the window is running); loads r5 = eS20364C0 itself and
  dispatches on JumpOffset00
details: 'Dispatches on eS20364C0.JumpOffset00 through the 3-entry table off_8026A3C: sub_8026A50 (0x00,
  setup), custMenuMainMaybe_8026A88 (0x04, runs the window) and object_runFrameUpdate_8026A6C (0x08, teardown,
  returns byte +4). Its only caller, sub_8009338 in asm/asm00_1.s, runs battle_initCustomScreen_8026840
  once and then polls it every frame. The caller keeps waiting on 0, goes to battle phase 0x14 on 2, and
  carries on into the turn on any other nonzero value.'
