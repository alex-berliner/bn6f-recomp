kind: function
proposed_name: battle_blankPickedDeckSlots
branch_status: probable
branch_summary: When OK is pressed, marks the folder entries of the chips just picked as empty (0xFFFF)
  so they drop out of the deck.
interface: (r5 = eS20364C0, r10 = toolkit) -> (); writes 0xFFFF through each picked slot's folder-entry
  pointer (+8); may clear BattleState+0x17 and decrement BattleState+0x45
details: It loops NumChipsSelected times over the slot indices at [r5+0x48]. For each it fetches the slot
  record with getLocOfActiveChips_8027E1C, following a kind-2 record's link at +4 when GetBattleMode is
  1. For a kind-0 record it clears BattleState+0x17 if bit 0 of +4 is set, stores 0xFFFF at the folder
  entry pointed to by +8, and decrements BattleState+0x45 if +0x44 is nonzero. custMenuPressOK_8028D3A
  calls it right after custMenu_confirmAndProcessSelectedChips_8029110; battle_compactFolderChipList_802945A
  later squeezes out the 0xFFFF entries.
