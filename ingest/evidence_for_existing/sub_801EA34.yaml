existing_entry: symbols/db/sub_801EA34.yaml
address: '0x0801EA34'
kind: function
proposed_name: battle_queueChipPowerDigits
branch_status: probable
branch_summary: Queues the four digit glyphs of a chip's power number into OBJ VRAM for the chip name
  display.
interface: (r1 = VRAM destination of rightmost digit, r4 = four packed digit nibbles) -> queues 8 GFX
  transfers; r1 stepped back; preserves r5, r6
details: For each of four nibbles of r4 (low first) it picks a glyph pointer from off_801FD90 and queues
  two 0x20-byte transfers (top at r1, bottom at r1+0x80), then steps r1 back by 0x20, so digits are laid
  right to left. Its caller chip_renderListEntry converts the chip's power to BCD and pads with 0xA nibbles;
  destinations come from dword_801EA7C/dword_801EA88 (0x6017060/0x6017160 for player one, 0x60174E0/0x60175E0
  for player two).
