# Not a symbols/db entry: sub_80283C8 already has one (symbols/db/sub_80283C8.yaml (confirmed); queued rename recolorActiveChipIcons_80283C8), which this audit does not change.
# What the orphaned branch adds for it, to append to that entry's evidence if the owner agrees
# (and, with proposed_name, to rename it with tools/rename_symbol.py, which moves the entry).
existing_entry: symbols/db/sub_80283C8.yaml
address: '0x080283C8'
kind: function
proposed_name: battle_pickChipIconPaletteBank
branch_status: probable
branch_summary: Recolours the chip icons in the chip window's ten slots by setting the palette bank of
  each icon's 2x2 map cells from the slot's kind and selectable flag.
interface: () -> (); reads ten 12-byte slot records from getLocOfActiveChips_8027E1C(0); rewrites the
  palette bits of four halfwords per slot in the unk_2035000 map buffer (pointers in off_802843C); r4,
  r5 preserved
details: Slot kinds 1, 2 and 3 are left unchanged. Kind 0xA always uses entry 0 (bank 11). Kinds 0, 6
  and 7 use entry 2 (bank 12) when byte +7 is 1, otherwise entry 0. Every other kind uses entry 4 (bank
  9). The chosen mask is ORed into the halfwords at +0, +2, +0x1E and +0x20 of the slot's cell. There
  are two callers in asm/asm03_0.s.
evidence:
- method: assembly-reading
  date: '2026-09-15'
  detail: 'docs/renames.md row citing src/custom.rs:78: "maps the slot record''s selectable byte through
    byte_8028470 to bank 11 or 12".'
  refs:
  - bn6f 0d5c5f33 (branch bn-notes)
  - bn6f/asm/asm03_0.s:4627
  reproduce: |
    git -C bn6f fetch origin bn-notes
    git -C bn6f show a5c3b9fe^:docs/renames.md | grep -n -F 'sub_80283C8'
  result: bn-notes names it pickChipIconPaletteBank_80283C8 (commit 0d5c5f33, 2026-09-15). The branch
    read the code and cites the bn reimplementation's sources; neither was re-run in this audit.
- method: assembly-reading
  date: '2026-10-20'
  detail: Byte +7 == 1 does pick bank 12 over 11 for kinds 0, 6 and 7, but kind 0xA is always bank 11,
    other kinds get bank 9 from a third entry, and kinds 1-3 are skipped.
  refs:
  - bn6f/asm/asm03_0.s:4627
  reproduce: |
    sed -n '4627,4687p' bn6f/asm/asm03_0.s
  result: 'agrees: partly'
open_questions:
- The evidence leaves out the bank-9 case and the skipped kinds 1-3.
- The name is singular, but the routine rewrites all ten slots.
- Master's symdb says it sets an OBJ palette on sprites; the code writes BG map entries at 0x2035188 and
  up.
