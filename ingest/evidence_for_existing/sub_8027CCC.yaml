proposed_name: battle_applyChipWindowMapPatches
branch_status: probable
branch_summary: Stamps one rectangle of running tile ids into the chip window's map buffer (unk_2035000,
  30 cells wide), row-major or column-major; callers use it to apply each ChipWindowMapPatches record.
interface: (r0 = column, r1 = row, r2 = first tile id including palette bits, r3 = width, r4 = height,
  r5 = 1 for column-major) -> r2 = next tile id; r0, r1, r3-r7 preserved
details: 'Three callers walk ChipWindowMapPatches and call it once per record, threading r2 through to
  get running ids: battle_initCustomScreen_8026840, initBackgroundTilemap and sub_8027834. The row stride
  is 0x1E halfwords. It never reads the table itself.'
