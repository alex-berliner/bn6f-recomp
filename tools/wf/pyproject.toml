[project]
name = "recomp-wf"
version = "0.1.0"
description = "The recomp project's workflows as typed, observable Burr graphs"
requires-python = ">=3.12"
dependencies = [
    "apache-burr[start]==0.43.0",
    "pydantic==2.14.0",
]

[dependency-groups]
dev = ["basedpyright==1.40.2"]

[tool.basedpyright]
include = ["wf"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
