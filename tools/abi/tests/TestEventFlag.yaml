# A callee still in the register convention, kept as a gen.py test fixture: readable callers get a typed
# wrapper (call_TestEventFlag) instead of GUEST_CALL + reading registers. It answers in Z (Z clear when the
# flag is set); r0 holds the flag's whole byte, which four readable callers once tested by mistake.
name: TestEventFlag
abi:
  c: bool TestEventFlag(u16 flag)
  args: [r0]
  ret: flag:!z
  globals: [toolkit]
  keep: []
  convention: registers
  reason: callers in lifted code branch on Z right after the call (symbols/db/TestEventFlag.yaml)
