# Synthetic gen.py fixtures (no such game functions): the result kinds, keep and in/out registers the
# pilots do not use, so the generated code for each is compiled by `gen.py --test`.
- name: abiTest_flagAndKeep
  abi:
    c: bool abiTest_flagAndKeep(OverworldNPCObject *npc, u32 count)
    args: [r5, r2]
    ret: flag:z
    globals: [toolkit]
    keep:
      - {reg: r3, expr: "count * 2 + (ret ? 1 : 0)", caller: "synthetic: a lifted caller reading r3"}
    convention: c
- name: abiTest_pairAndCursor
  abi:
    c: U32Pair abiTest_pairAndCursor(u32 x, u32 *cursor)
    args: [r0, "&r6"]
    ret: r0:r1
    globals: []
    keep: []
    convention: c
- name: abiTest_carry
  abi:
    c: bool abiTest_carry(s16 value)
    args: [r1]
    ret: flag:c
    convention: c
- name: abiTest_lifted
  abi:
    c: u8 *abiTest_lifted(Toolkit *tk, u32 *inout, s8 delta)
    args: [r0, "&r4", r7]
    ret: r0
    globals: [toolkit]
    convention: registers
    reason: synthetic
- name: abiTest_liftedPair
  abi:
    c: U32Pair abiTest_liftedPair(void)
    args: []
    ret: r0:r1
    convention: registers
    reason: synthetic
