name: battle_flyInDescendPhaseUpdate
address: '0x080DC7FC'
kind: function
status: probable
summary: Battle-object phase handler that flies the object in from its side of the field, descends it
  onto its target panel, and then chooses its next action according to the panel's state.
interface: (r5 = battle object) -> void; no return value used
details: 'Standard phase update keyed off oBattleObject_PhaseInitialized: on first entry it gets the alliance
  facing multiplier via object_getFrontDirection, sets XVelocity to ±0x40000 and ZVelocity to -0x80000,
  loads Timer=0x14, and marks the phase initialized. Each subsequent frame it advances X and Z by the
  velocities (so the object slides inward while dropping from Z=0x100000 down to 0 over 20 frames); at
  Timer==0x0A it plays sound effect 0x140 via PlaySoundEffect. When the timer expires it snaps Z to 0,
  sets collision region 1 via object_setCollisionRegion, copies PanelX/PanelY into ExtraVars+8/+0xC, clears
  ExtraVars+0x18/0x1C, and calls sub_80DC9EC(panelX,panelY), which returns a flag; the object''s CurAction
  is set to 8 if that flag is nonzero, otherwise 4, and CurPhaseAndPhaseInitialized is reset to 0 to advance
  to the next phase.'
