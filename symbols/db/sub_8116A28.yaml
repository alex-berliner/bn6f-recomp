name: sub_8116A28
address: '0x08116A28'
kind: function
status: hypothesis
summary: If a state/counter byte pointed to by r7 has reached 8, writes 8 into r5+8 to keep the two bytes in sync,
  then tail-continues into sub_8116A44
interface: void sub_8116A28(r5=destStructPtr, r7=counterBytePtr /*, r4/r6 also live inputs; r4-r7 preserved*/);
  returns via sub_8116A44 in r0-r3 with nzcv set
details: 'Tiny wrapper/trampoline: loads the byte at [r7] and compares it against 8. Only when it equals 8 does
  it store the constant 8 to [r5+8], so the two fields (a counter and some state/phase byte in a struct passed in
  r5) are kept consistent once the counter completes. Whether the byte is less or greater than 8 it leaves r5+8
  untouched. It then falls through into sub_8116A44 (the bl is effectively a tail call, since lr is not re-pushed
  and the routine pops pc immediately after), so all register outputs and flags actually come from sub_8116A44.
  The magic value 8 suggests a completed countdown/animation/phase index; without knowing sub_8116A44''s role the
  exact game context (npc script state, battle phase, etc.) is not established.'
