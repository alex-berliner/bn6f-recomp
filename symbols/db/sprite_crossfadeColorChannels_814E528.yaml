name: sprite_crossfadeColorChannels_814E528
address: '0x0814E528'
kind: function
status: confirmed
summary: Crossfades two color/fade channels of an object toward a source object's values, driven by a signed fade-position
  byte that makes one channel rise while the other falls.
interface: void sprite_crossfadeColorChannels_814E528(dst /*r4*/, src /*r5*/); // returns r2 = sign-extended fade
  position from [dst+0x14]; clobbers r0-r3 and NZCV flags; lr is return address
details: 'Takes a destination struct in r4 and a source struct in r5. Reads a weight byte from [r4+0x12] and a signed
  fade position from [r4+0x14] (sign-extended, range -0x80..0x7F). Channel 1 (stored to [r4+2]) is scaled by (0x80
  + pos) * weight, channel 2 (stored to [r4+3]) by (0x7F - pos) * weight; each product is multiplied by the matching
  source byte ([r5+0x10] and [r5+0x11]) and shifted right by 14, i.e. a 12.14 fixed-point multiply. Results saturate
  at 0xFF (only the upper side is clamped; no lower clamp, so negative intermediate results would wrap, though inputs
  normally keep it non-negative). Finally r2 is left holding the sign-extended fade position for the caller. The
  opposite slopes of the two channels (one at 0x80+pos, the other at 0x7F-pos) mean this blends a pair of palette/color
  components between two states as pos sweeps its range — typical of a palette/flash crossfade effect on a sprite
  or object. All arithmetic is done in 32-bit MULs on byte values.

  '
