name: sub_814E09C
address: '0x0814E09C'
kind: function
status: hypothesis
summary: Copies a fixed 36-word table (at off_81C0418) into a caller-supplied buffer, passing each word through
  a converter routine before storing it.
interface: void copyConvertedWordTable_814E09C(u32 *dest /* r0 */); returns via r12 (return address is stashed in
  r12 instead of using lr normally)
details: 'Takes a destination pointer in r0, then loops exactly 0x24 (36) times over the source table whose address
  is embedded as the literal off_81C0418 (value off_81C0418). Each iteration loads one word, sets up r0 = current
  destination pointer, r1 = remaining loop count, r2 = current source address, r3 = the raw word, and calls sub_814E0B6,
  which returns the (possibly transformed) word in r3; the result is stored with a writeback store (stmia r0!, {r3})
  so the destination pointer advances automatically. The loop counter counts down from 0x24 using the flags set
  by the decrement. Notably the function never touches lr after entry: it saves lr into r12 at the top and ends
  with bx r12, so r12 carries the return address both through the calls (it is reloaded after each sub_814E0B6 call
  in the verified C) and back to the caller; r12 is effectively both clobbered-with-return-address and an output.
  All of r4-r11 are listed as inputs/outputs in the contract but the routine itself neither reads nor writes them,
  so the contract likely just reflects caller-side noise around the sub_814E0B6 calls. The 36-word size and the
  per-word transform hook suggest a decoded/converted data table (e.g. byte-swapped or lightly obfuscated constants)
  rather than raw copy data; the actual in-game use depends on what sub_814E0B6 does and who calls this.

  '
