name: sub_80AA004
address: '0x080AA004'
kind: function
status: confirmed
summary: Copies a 16-byte OAM/template row from a small inline table (byte_80AA01C) into a chip/PET header buffer
  at byte_2001130, selected by the caller's low nybble of r0, then clears r0.
interface: void sub_80AA004(u32 index /* r0 */); // r0 returned as 0; lr used; other regs preserved
details: '- Saves r4-r7,lr; restores r4-r7,pc at end.

  - Takes index in low nibble of r0 (only `lsl r0, r0, #4` is applied -> *16), used to pick a 16-byte entry out
  of a hard-coded template table at byte_80AA01C (declared at off_80AA018).

  - The 16-byte entries are OAM-shaped (tile/shape/colors palettes, with sentinel 0xFF bytes), strongly suggesting
  a small OAM bank for a pet/sprite header block (16 bytes = one OAM entry).

  - Destination is byte_2001130 (declared at off_80AA054), an EWRAM chip/PET header buffer. The readable C labels
  it the "chip/pet header buffer"; this routine writes one OAM-shaped template row into it.

  - Delegates to CopyBytes(src=&byte_80AA01C[index*16], dest=&byte_2001130, count=0x10).

  - After the copy, returns 0 in r0 (sets NZ based on r0=0).

  - Quirks: only the low nybble is meaningful due to `lsl r0,r0,#4`; high bits of r0 would overflow the table. The
  0xFF/0x20 byte runs look like palette-terminated OAM shapes.

  '
