name: battle_advancePhase14Wipe
address: '0x0802AED8'
kind: function
status: probable
summary: Advances the overworld wipe, entering battle phase 0x14 once the horizontal BG2 wipe completes.
interface: (r0 = ..., r1 = ...) -> r0 = ...; flags ...
details: Calls the existing BG2-column wipe routine and returns immediately while it is still in progress.
  When the wipe reports completion, it invokes the battle state transition helper for phase 0x14, then
  stores 8 through the caller-provided pointer in r5. The precise meaning of the byte written at [r5]
  and the full calling convention are not visible here.
