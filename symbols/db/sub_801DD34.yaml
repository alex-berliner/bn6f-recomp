name: sub_801DD34
address: '0x0801DD34'
kind: function
status: confirmed
summary: Scans a four-slot table (entries at byte_203EB50) for an active record whose id equals r5, clears its flag
  byte, and returns success.
interface: '// r5 = id to match (caller-owned)

  // returns r0: 0 = cleared a matching record; 1 = no match

  // clobbers r1, r2, r3 and N/Z/C/V

  u8 search_handleEndById_801DD34(u32 id /* r5 */);

  '
details: 'Reads byte_203EB50 as the base of four 0x14-byte records. Iterates r3 from 4 down to 1,

  stepping r2 through the entries. For each record it tests bit 0 of the flag byte (LD8(r2) & 1)

  and, if active, compares the id field at +0x0C to the input id. On a hit it writes 0 to the

  flag byte (deactivating the record) and returns r0 = 0. If all four entries are exhausted, returns

  r0 = 1. r1 is set to 1 and used as the probe bit mask; r2/r3 are left pointing at the first

  post-iteration entry / count after the scan ends. Final NZ / N/Z/C/V are determined by the

  path''s tail instructions (the SUB r3, #1 then MOV r0, #1 in the miss path).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
