open_questions:
- The exact contents of the per-chip-kind dispatch table at off_8028370 are not enumerated here; resolving
  them would settle what each chip-kind helper actually does to VRAM/OBPal in the loop. The semantic difference
  between r0=0 and r0=1 is correct, but the callers may use either arg depending on which screen state
  they leave the custom screen in.
