name: oAIAttackVars_ChipID
address: '0x14'
kind: struct-field
status: probable
summary: The BattleChip ID of the chip currently queued/selected for the AI or controlled battle object's
  attack action.
details: The field is consistently passed to getChip8021DA8 as an index (asm00_2.s:2202, asm00_2.s:8334,
  asm03_0.s:15547, asm31.s:109087, asm31.s:118878, asm31.s:119055), written from a chip-selection table
  lookup (asm31.s:118878/119055, asm00_2.s:8329), and compared directly against hardcoded BattleChip IDs
  like 0x153, 0x173, 0x177, 0x185 (asm03_0.s:15560, asm31.s:118896/119073, asm31.s:120654). It is passed
  alongside alliance to incrementRecordCounterByte_8021D14 (asm00_2.s:8358), a chip-use counter. Zero
  clears (asm00_2.s:2141, asm00_2.s:3747) indicate "no chip queued".
