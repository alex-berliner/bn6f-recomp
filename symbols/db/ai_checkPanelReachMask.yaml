name: ai_checkPanelReachMask
address: '0x0810B598'
kind: function
status: probable
summary: Calls sub_8109708 twice with filter params 4 then 2 and returns a bitmask (bit0 = filter 4 found
  a panel, bit1 = filter 2 found a panel) indicating which reach modes have a pickable panel.
interface: '(r0 = battle object ptr, r1 = panel-pick params for sub_8109708) -> r0 = bitfield: bit0 =
  filter 4 found a panel, bit1 = filter 2 found a panel; r4 preserved.'
details: It calls sub_8109708 twice with the caller's r0/r1 unchanged, first setting the filter param
  r2=4, then r2=2, saving/restoring r0-r2 around each call so only r2 differs. Each nonzero result sets
  one bit of r4 (bit0 for the r2=4 probe, bit1 for the r2=2 probe, via orr), and the accumulated mask
  is returned in r0. Since sub_8109708 picks a random panel relative to the object's position using reach/filter
  parameters varying with alliance, this is a boolean availability check for two reach modes rather than
  an actual selection. The Swordy AI caller (0x0810B436, attack id 0xC) presumably uses the mask to choose
  between row-wise and column-wise attack targeting, falling back to move/step logic when both bits are
  clear.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'push {r0-r2} with r2=4 before bl sub_8109708, pop after — first probe uses filter 4 while preserving
    caller args; second call repeats with mov r2, #2 and orr r4, r0*2 on success — filter 2 result is
    bit1 of the mask; sub_8109708 summary: picks a random panel relative to a battle object''s position
    using reach/filter params varying by alliance; caller 0x0810B436 ai_swordyTryStartAttack launches
    attack id 0xC or falls back to move/step logic, matching a direction-availability test'
