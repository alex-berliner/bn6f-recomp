name: ai_checkPanelReachMask
address: '0x0810B598'
kind: function
status: confirmed
summary: Builds a 2-bit reachability mask for a given NavPanel by probing two AI path types through sub_8109708.
interface: u32 ai_checkPanelReachMask(u32 panelData /*r0*/, u32 panelInfo /*r1*/, u32 aiContext /*r5*/) /* r0 =
  mask; r4-r7 preserved */
details: Calls sub_8109708 twice with the same panelData (r0), panelInfo (r1), and aiContext (r5) but different
  path-type selectors in r2. First probe uses path type 4; if r0 returns nonzero, bit 0 of the mask is set. Second
  probe uses path type 2; if r0 returns nonzero, bit 1 is OR'd in. The resulting mask (0..3) is returned in r0.
  r4 is saved on the stack and used as the local accumulator. r2 is re-loaded before the second call (r0/r1/r5 are
  not re-set, so they persist across the first call's clobbers—note the push/pop of r0-r2 around the first call
  to shield r0 and r1 from being destroyed by sub_8109708). Flags from sub_8109708 are not propagated to the caller;
  only the final r0 value matters.
