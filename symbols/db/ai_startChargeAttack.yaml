name: ai_startChargeAttack
address: '0x0810AAE6'
kind: function
status: probable
summary: 'AI attack-script step that begins a standing (non-sliding) attack: reserves the enemy''s own
  panel, locks it in place, and sets up per-version damage/animation for attack 0xA.'
interface: (r4 = battle object base, r5 = object struct, r6 = AI state struct, r7 = AI attack vars) ->
  r0 = 0; writes oAIState_ScriptId = 0; flags from object_canMove test
details: If object_canMove says the object is blocked, the function does nothing but clear oAIState_ScriptId
  to 0. Otherwise it sets oAIAttackVars_AttackDuration = 0x30 and loads Damage and ExtraDamage from two
  byte tables (byte_810AA20, byte_810AA28) indexed by oAIData_Version, so damage differs per game version.
  It zeroes the byte at object+0x68, calls object_reservePanel on the object's own PanelX/PanelY, and
  picks CurAnim from a word table (byte_810AB38, values 1 or 2) indexed by the halfword at object+0x7C.
  It then sets oAIAttackVars_StepTimer = 0x14, ExtraVars = 1, ORs OBJECT_FLAGS_CANNOT_SLIDE into the object
  flags, and registers attack id 0xA via object_setAttack0. Reserving its own panel plus CANNOT_SLIDE
  suggests a stationary charge/stand-and-fire attack that runs for 0x30 frames with 0x14-frame substeps.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_810AB2E: entire setup is skipped when the object cannot act; ldrb
    r1,[r4,#oAIData_Version_16] then ldrb from byte_810AA20/byte_810AA28: Damage and ExtraDamage are version-indexed
    tables; ldrb PanelX/PanelY then bl object_reservePanel with OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1:
    claims its own panel and forbids sliding; strh #0x30 into oAIAttackVars_AttackDuration, #0x14 into
    oAIAttackVars_StepTimer, mov #1 into oBattleObject_ExtraVars: multi-frame attack state; mov r0,#0xa;
    bl object_setAttack0 then strb #0 to oAIState_ScriptId: registers attack 0xA and ends the AI script
    step'
