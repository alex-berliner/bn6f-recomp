name: battle_clearSubordinateObjectField0C
address: '0x080E0DCA'
kind: function
status: probable
summary: Zeroes byte 0xC of a battle object; callers apply it to the AI subordinate object while resetting
  hit state.
interface: (r0 = battle object ptr) -> r0 = passed-in ptr; no flags
details: 'Stores 0 to byte [r0,#0xC] and returns. Both call sites pass the pointer from oAIData_SubordinateObjectPtr,
  i.e. the subordinate/child object linked from the AI data, immediately after clearing bit 2 (mask #2)
  of oObjectHeader_Flags and oCollisionData_LastHitObjectPtr''s flags byte, so it looks like part of a
  hit/deactivation cleanup that resets the subordinate object''s byte 0xC as well.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80E0DCA: mov r1,#0; strb r1,[r0,#0xc] — single byte zero store; sub_80E1352 at 0x080E137C:
    ldr r1,[r2,#oAIData_SubordinateObjectPtr]; bl sub_80E0DCA — called on subordinate object; sub_80E146C
    at 0x080E1482: same pattern, called right after bic #2 on oObjectHeader_Flags; Both callers also clear
    bit 2 of [oCollisionData_LastHitObjectPtr], showing a reset-after-hit context'
  refs:
  - bn6f/asm/asm31.s:89733
  - 0x080E1352 sub_80E1352
  - 0x080E146C sub_80E146C
  reproduce: python3 tools/asmcat.py 0x080E0DCA
