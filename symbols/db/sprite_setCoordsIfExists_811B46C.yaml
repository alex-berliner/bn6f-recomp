name: sprite_setCoordsIfExists_811B46C
address: '0x0811B46C'
kind: function
status: confirmed
summary: Set a sprite's screen X/Y coordinates only if the sprite id resolves to a live sprite struct.
interface: void sub_811B46C(u32 x /*r0*/, u32 y /*r1*/, u32 sprite_id /*r2*/, u32 preserve_r5 /*out*/)
details: 'Saves r0/r1 (x, y) on the stack, passes r2 (sprite_id) to getStructFrom2008450 to look up

  the sprite''s struct pointer (returned in r1). If the lookup fails (Z set, struct == 0),

  the function returns immediately without touching the sprite. On success, r5 is set to

  the struct pointer, and the saved x/y are reloaded into r0/r1 before calling

  sprite_setCoordinates to update the sprite''s screen position. r4-r7 are preserved across

  the call; r5 is both an input (preserved via the stack frame) and an output (clobbered by

  the callee and restored on return). The C-style wrapper "set_sprite_coords_if_found" in

  the verified source captures the intent: this is a guarded sprite-position setter.

  '
