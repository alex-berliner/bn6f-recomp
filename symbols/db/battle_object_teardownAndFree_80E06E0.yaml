name: battle_object_teardownAndFree_80E06E0
address: '0x080E06E0'
kind: function
status: confirmed
summary: Teardown callback for a battle entity - unless some global check says to skip cleanup, it runs a teardown
  step (arg 2) and frees the resulting object's memory.
interface: void sub_80E06E0(void); // reads r5/r10 as context (preserved), no explicit args; returns via LR pop,
  flags on early-exit path reflect the TST of the guard call
details: 'Pushes LR and immediately calls sub_800AA92 with r0 = 0; the result acts as a guard -

  if it is nonzero the function returns without doing anything (this is the path taken,

  presumably, when the battle/object system should not free things yet, e.g. during a

  transition or when the object is still needed). Otherwise it calls sub_8001382 with

  r0 = 2; whatever pointer/handle that returns in r0 is passed straight to

  object_freeMemory, so sub_8001382(2) is the "get the object to clean up" step and the

  constant 2 likely selects a slot, type, or teardown mode within that subsystem.

  r5 and r10 are live on entry (the caller contract shows them as inputs) and r5 is

  preserved across the whole routine, so the surrounding object/state lives in r5.

  The early-exit path leaves NZ flags set from TST r0, r0 on sub_800AA92''s result;

  the normal path''s flag state is whatever object_freeMemory leaves. Nothing outside

  the object system is touched directly - all work is delegated to the two callees.

  '
