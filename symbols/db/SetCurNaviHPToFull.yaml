name: SetCurNaviHPToFull
address: '0x0803CEB8'
kind: function
status: confirmed
summary: Sets the current PET navi's HP stat to its max HP, healing it to full.
interface: void SetCurNaviHPToFull(void) -> r0=0, Z set / N clear on return; preserves r4-r7
details: Looks up which navi is currently in the PET via GetCurPETNavi, reads that navi's oNaviStats_MaxHP halfword
  with GetCurPETNaviStatsHword, then writes the same value back to the oNaviStats_CurHP halfword with SetCurPETNaviStatsHword.
  Effectively full-heals the active navi's HP in PET save/state data. Returns r0 = 0 with Z set and N clear from
  the final "mov r0,
