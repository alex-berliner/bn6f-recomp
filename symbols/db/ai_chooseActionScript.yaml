name: ai_chooseActionScript
address: '0x08101CC0'
kind: function
status: probable
summary: 'Enemy battle AI decision routine: picks a movement/action script (ScriptId) based on proximity
  to the player, step/turn counters and RNG, or queues an attack.'
interface: (r4 = enemy BattleObject, r5 = BattleObject ptr, r6 = oAIState state block) -> r0 = ?; sets
  oAIState_ScriptId/oAIState_SubState, may flip oAIState_Unk_0c/0d
details: Runs some pre-check (sub_8103038), then searches for the closest BattleObject of the opposite
  alliance; if found and a pattern table (byte_8101DD7/byte_8101DE6) matches via sub_810222C, it toggles
  oAIState_Unk_0c bit 2 and jumps to script 0x14/0x18 setup. Otherwise it increments oAIState_AttackCounter
  (up to 4, with a 1/8 RNG chance to increment twice) and, once counters reach thresholds, tests movement
  pattern tables (pairs like 1,1 / 1,2 / 2,3 terminated by 0x7F) via sub_810222C to choose ScriptId 4,
  8, 0xC, or 0x10 with SubState 0, toggling oAIState_Unk_0d between attempts. In the attack branch it
  calls ai_setupAttack9PanelChoose with callback sub_8102C38+1 to start attack 9 at a chosen panel. Overall
  this is the per-turn 'decide move vs attack and which script to run' dispatcher for an AI-controlled
  enemy.
