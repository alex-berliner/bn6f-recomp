name: ai_pickForwardRowPanel
address: '0x0811152C'
kind: function
status: probable
summary: 'Battle AI move picker: prefers advancing one row toward the enemy (Y+1 from row 1, Y-1 or Y+1
  from row 2, Y-1 from row 3) by calling battle_pickRandomRowObjectFields and GetRandomRelativePanelFiltered;
  falls back to a horizontal sidestep via panelFlagCheck for rows 1/3, or to a vertical one-row shuffle
  for row 2.'
interface: (r5 = battle object; reads oBattleObject_PanelX/PanelY/Alliance) -> r0 = result/panel-or-0
  from the pickers (0 = no panel found); picks an AI move target via callee side effects
details: Dispatches on the object's PanelY (1/2/3, i.e. which row it stands on). For each row it first
  calls battle_pickRandomRowObjectFields_810971A on the adjacent row toward the other side (Y+1 from row
  1, Y+1 then Y-1 from row 2, Y-1 from row 3); a nonzero return means that row holds objects, so it retries
  the other direction. If a candidate row is clear, it loads alliance-dependent panel parameters (byte_8111740
  table via GetAllianceDependentPanelParamArgs) and calls GetRandomRelativePanelFiltered with r4=1 and
  r6=Alliance to pick a random reachable panel there. When no forward move works, it calls panelFlagCheck_8015D80
  with a relative-offset list byte_8111640 = (-1,0),(1,0),0x7F — a horizontal sidestep in the current
  row. The byte_8111630 entry of the off_8111624 list table (vertical offsets) is loaded into r4 in some
  paths but never dereferenced here, so it is dead/local-unused. Result handling is entirely inside the
  picker callees, which likely write the chosen target panel into the AI/object state.
