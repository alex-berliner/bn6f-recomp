name: ai_initSpoutManAttack
address: '0x080F7886'
kind: function
status: probable
summary: 'Initializes SpoutMan''s AI attack: sets up attack variables, targets the opposing player, and
  starts attack 0xB.'
interface: (r0 = unused/scratch, r5 = attacker BattleObject, r7 = AIAttackVars struct) -> r0 = result
  of object_setAttack0; struct fields written
details: Reads the enemy AI difficulty tier and stores it in oAIAttackVars_AiDifficultyTier, sets InitFlag
  = 2, then fills the attack duration (from sub_80F7768), a boost value and timer/cycle count (from sub_80F778C).
  Calls sub_80F78FA with r0=1 (likely an RNG/panel helper that must run before target selection). It computes
  the target as battle_findPlayer(alliance XOR 1), i.e. the object on the opposite side, storing it as
  TargetObjectPtr, and stores a panel-choose callback (sub_80F8256). ScratchVar is set to object pointer
  + 0x60, and object_setAttack0 with id 0xB starts the attack state.
