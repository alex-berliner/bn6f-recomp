  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] after bl battle_getAiDifficultyTier_800FE36 initializes
    attack state; eor r0,r1 (alliance^1) then bl battle_findPlayer -> str [r7,#oAIAttackVars_TargetObjectPtr]
    targets the opposing side; ldr r0,off_80F79EC =sub_80F8256+1 stored into oAIAttackVars_PanelChooseCallback,
