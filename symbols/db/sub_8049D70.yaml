summary: Draw a fresh value from the RNG and store the low 16 bits as the new RNG seed (word_2001800).
interface: 'void storeNextRngSeed_8049D70(void);  /* in: lr; out: r4 r5 r6 r7; clobbers r0-r3, lr, flags nz c v
  */'
details: 'Calls GetRNG to obtain a fresh random u32 in r0, then writes its low 16 bits (strh) into the global RNG
  seed at off_8049D94 (word_2001800). This advances the random sequence used elsewhere in the game by exposing the
  new value through the shared seed variable. No other globals, structs, or side effects are touched; r4-r7 are
  preserved for the caller.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
