name: ai_stepWoodPanelStrike
address: '0x080F0968'
kind: function
status: probable
summary: AI attack step that initiates a wood-element strike of all matching field panels, then waits
  20 frames before marking hits as wood.
interface: (no args; r5 = battle object, r7 = oAIAttackVars) -> void; sets oAIAttackVars_AttackElement,
  StepTimer, HitElement and object CurAnim
details: On entry with AttackElement == 0 it writes element 4 (wood), sets the object's current animation
  to 0x12, calls ai_strikeMatchingPanels (which hits every panel matching the alliance-dependent attribute
  mask with the object's queued attack damage), and stores 0x14 into StepTimer. On subsequent frames it
  decrements StepTimer each call until it reaches zero, then writes element 4 into oAIAttackVars_HitElement
  so later damage/contacts use wood. State persists across calls via the oAIAttackVars fields, so the
  function is a step/state handler rather than a one-shot init.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne loc_80F0982 — first-call vs. repeat-frame
    state machine; strb r0,[r5,#oBattleObject_CurAnim] with r0=0x12 — plays the attack animation on the
    battle object; bl ai_strikeMatchingPanels — delegates the panel-wide strike to the known panel-strike
    helper; strh r0,[r7,#oAIAttackVars_StepTimer] with 0x14, then sub r0,#1 / bgt — 20-frame delay before
    completing; strb r0,[r7,#oAIAttackVars_HitElement] with 4 — finished state marks hits as element 4
    (wood)
