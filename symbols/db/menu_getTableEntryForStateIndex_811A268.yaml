name: menu_getTableEntryForStateIndex_811A268
address: '0x0811A268'
kind: function
status: confirmed
summary: Computes an index from the active menu state block and returns the corresponding 4-byte entry from the
  table at dword_201FC20.
interface: void sub_811A268(r4,r5,r6,r7 /*preserved*/) -> r0=u16 entry field, r1=u8 entry+2, r2=u8 entry+3, r3=entry
  ptr; nz flags set from r0
details: 'Selects the "current menu state block" pointer: the global sSubmenu while its first byte

  equals 8, otherwise unk_2037780 (a different menu-state struct, likely the main library/

  list menu). From the chosen block it reads two halfwords, at offsets 0x3C and 0x40

  (most likely a category/page index and a cursor/selection index), sums them, and shifts

  left by 2 to get a byte offset into the table whose base is stored directly in the RAM

  variable dword_201FC20 (the table base is itself the RAM value, so the table lives in

  RAM and the pointer is reloaded each call). Each entry is 4 bytes: u16 at +0, u8 at +2,

  u8 at +3. The function returns the three fields in r0/r1/r2, the entry pointer in r3,

  and leaves the nz flags set from the u16 field at +0 so the caller can branch on

  "entry present / zero" without extra work. r4-r7 are preserved only because they were

  pushed; nothing in the function reads them, so the inputs r4-r7 and lr are dead.

  This looks like a shared helper for list-style menus (e.g. library/folder-style

  entry listings) to fetch the descriptor of the entry under the cursor.

  '
