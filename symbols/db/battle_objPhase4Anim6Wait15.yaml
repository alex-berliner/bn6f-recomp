open_questions:
- no known callers, so which object type and which action 0xC this state belongs to is unknown
- sub_80E71A0's return value semantics (stored to ExtraVars) are unexamined
- what animation 6 depicts and why the fixed 15-frame wait matters in gameplay
- The code does set phase=4, anim=6, call sub_80E71A0 with r4=1, set Timer=0xF, decrement Timer each frame,
  and on expiry write CurAction=0xC and clear CurPhaseAndPhaseInitialized — all matching the proposal.
  However, it sets Timer with strh (0xF fits), and on entry also clears the initialized flag implicitly
  via the state machine, but the summary's mention of 'returns to action 0xC' is correct. The name 'battle_objPhase04Anim6WaitState'
  is reasonable but the phase variable written is the 'curPhase' only (top byte of PresPhase, init bit
  stays set), so a clearer name emphasizing just the timer-wait aspect is preferable.
