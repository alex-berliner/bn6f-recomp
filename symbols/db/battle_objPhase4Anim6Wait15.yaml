name: battle_objPhase4Anim6Wait15
address: '0x080BA81C'
kind: function
status: probable
summary: On phase entry, sets CurPhase=4, CurAnim=6, calls sub_80E71A0(1) storing result in oBattleObject_ExtraVars,
  and sets Timer=15; then each call decrements Timer and, when it reaches 0, sets CurAction=0xC and clears
  CurPhaseAndPhaseInitialized.
interface: (r5 = battle object ptr (implied), r4 = 1 passed to callee) -> r0 = sub_80E71A0 result stored
  to oBattleObject_ExtraVars; updates CurPhase/CurAnim/Timer/CurAction fields.
details: Reads oBattleObject_CurPhase from the object in r5. On phase 0 (state entry) it writes phase=4,
  sets oBattleObject_CurAnim=6, calls sub_80E71A0 with r4=1 and stores its return value in oBattleObject_ExtraVars,
  and sets oBattleObject_Timer=0xF. Otherwise it decrements Timer each call; while Timer>0 the state persists.
  When the timer expires it writes CurAction=0xC and clears CurPhaseAndPhaseInitialized, handing control
  back to the action dispatcher. Behavior is a self-contained wait/animation state of the battle-object
  state machine; the meaning of anim 6, the ExtraVars value, and action 0xC are unknown from this function
  alone.
