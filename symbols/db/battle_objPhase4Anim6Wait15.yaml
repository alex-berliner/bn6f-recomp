  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The code does set phase=4, anim=6, call sub_80E71A0 with r4=1, set Timer=0xF, decrement Timer each
    frame, and on expiry write CurAction=0xC and clear CurPhaseAndPhaseInitialized — all matching the
    proposal. However, it sets Timer with strh (0xF fits), and on entry also clears the initialized flag
    implicitly via the state machine, but the summary''s mention of ''returns to action 0xC'' is correct.
