    the zero path; bl sub_80E71A0 with r4=1, result stored to [r5,#oBattleObject_ExtraVars]; timer decrement
    loop (sub #1, bgt) keeps the object in the state for 15 frames; on expiry writes CurAction=0xC and
    zeroes CurPhaseAndPhaseInitialized to end the state'
  refs:
