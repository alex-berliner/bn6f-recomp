name: ai_lungeTowardTargetPanel
address: '0x0810B0B8'
kind: function
status: probable
summary: AI attack step that dashes the battle object one panel toward its target panel, reserving the
  destination panel while it slides, then commits and releases it.
interface: (r0 unused entry; r5 = battle object, r7 = AI attack vars) -> updates oAIAttackVars state (AttackElement,
  ChargeCycles, HitElement) and object panel/position fields; no return value
details: 'Driven by r7''s oAIAttackVars: when AttackElement is 0 it starts the lunge (sets it to 1), computes
  TargetPanelX - PanelX, sets XVelocity to +/-0x80000 with a +/-1 panel step, and validates the destination
  panel via object_checkPanelParameters using AiAttackParam and PanelParamFlags2 masks. If dx is 0 or
  the panel check fails, HitElement is advanced by 4 (attack aborts/finishes). Otherwise it writes FuturePanelX/Y,
  claims the destination with object_reservePanel, sets ChargeCycles=5 and ScratchPointerOrPanel=2 as
  the midpoint marker. Each subsequent call adds XVelocity to X, and at the halfway count syncs panel
  coords from the pixel position via object_setPanelsFromCoordinates/object_updateCollisionPanels. When
  the countdown goes negative it copies FuturePanelX/Y into PanelX/Y, releases the panel with object_removePanelReserve,
  recomputes pixel coords and collision panels, and clears AttackElement so the attack can restart.'
