name: ai_circusmanGetAttackParams
address: '0x080FEAD8'
kind: function
status: probable
summary: Returns two difficulty-scaled attack parameter values for CircusMan's attack setup, read from
  a per-difficulty byte table.
interface: () -> r0 = table[difficulty] of byte_80FEAF4[0..3], r1 = table[difficulty] of byte_80FEAF4[4..7];
  flags from sub_800FE28's last call
details: The function calls sub_800FE28 twice with pointers into byte_80FEAF4 (base and base+4) and returns
  the two results in r0/r1. byte_80FEAF4 holds two 4-entry tables {1,3,3,3} and {0x10,0xC,8,8}, matching
  the game's four difficulty tiers; sub_800FE28 evidently selects an entry from such a table by the current
  difficulty. The sole caller ai_circusmanInitAttackState uses these as attack parameters when launching
  attack id 0xC — the second value (0x10/0xC/8/8) shrinks at higher difficulty, consistent with an interval
  or timer. The first value (1/3/3/3) grows with difficulty, e.g. a count or amount. Both values are plain
  bytes read straight out of ROM data.
