name: battle_objectRunActionHandler
address: '0x080DEEE8'
kind: function
status: probable
summary: 'Per-frame battle-object action dispatcher: skips during time-stop, destroys the object when
  the battle is over, otherwise jumps to the handler for the object''s current action.'
interface: (r5 = battle object pointer, no args) -> r0 = handler-dependent; sets object state to CUR_STATE_DESTROY
  if battle is over
details: 'Calls battle_isBattleOver; if true it writes CUR_STATE_DESTROY into the combined CurState/ActionPhase/PhaseInitialized
  field of the battle object at r5 and returns, tearing the object down. Otherwise calls battle_isTimeStop
  and returns without doing anything while a time-stop is freezing the battle. Otherwise it loads oBattleObject_CurAction
  from the object and indexes off_80DEF10 (three handler pointers: sub_80DEF1C, sub_80DEF3C, sub_80DEFC6),
  dispatching with mov lr, pc / bx r1 so the chosen handler runs with r5 still pointing at the same object.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_isBattleOver / tst + bne: battle-over path stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized;
    bl battle_isTimeStop / bne locret: whole update is suppressed while time-stop flag (bit 2) is set;
    ldrb r0,[r5,#oBattleObject_CurAction] + ldr r1,[r1,r0] + bx r1: jump table off_80DEF10 indexed by
    the object''s current action; off_80DEF10 holds three code pointers (sub_80DEF1C, sub_80DEF3C, sub_80DEFC6),
    one per action state'
