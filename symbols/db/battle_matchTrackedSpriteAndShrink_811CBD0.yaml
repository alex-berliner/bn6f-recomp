name: battle_matchTrackedSpriteAndShrink_811CBD0
address: '0x0811CBD0'
kind: function
status: confirmed
summary: Moves the object's sprite onto the sprite it is tracking, copies the tracked sprite's size, shrinks it
  to 1/256 scale, and starts a 10-frame timer.
interface: int sub_811CBD0(Object* r5 /* r4,r6,r7 preserved; lr return address */); always returns 1 with flags
  set from it
details: 'Called with the owning object in r5. It first calls sub_811CC68 to get a pointer to the sprite/state data
  the object is currently tracking, then calls sprite_setCoordinates with the tracked sprite''s position: signed
  halfword at +0x2 as X, signed halfword at +0x4 as Y (the C shows LDS16 of tracked+2 and tracked+4, matching ldrsh
  at offsets 4 and 2 after a mov r2 sequence). It fetches the tracked sprite pointer again and copies the size halfwords
  at +0x6 and +0x8 into the object''s own fields at r5+0x14 (width) and r5+0x1A (scale/height). It then calls sprite_setScaleParameters(0,
  scale>>8, scale>>8) where scale is the halfword from +0x8; since these scale values are 8.8 fixed point, >>8 reduces
  the sprite to roughly 1/256 of the tracked size, i.e. effectively shrinking it out of view. Finally it calls counter_addU32_r5Plus0C_811CC60
  with 10 to set a 10-frame countdown in the object at r5+0xC, and returns r0 = 1 (a "state finished / advance"
  result for the object''s state machine, with NZ flags set from that value). The tracked data layout (+2 X, +4
  Y, +6 width, +8 scale) is a sprite descriptor; the object fields +0xC (frame counter), +0x14 and +0x1A mirror
  parts of it.

  '
