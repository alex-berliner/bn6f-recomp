summary: Returns the boolean state of the jack-in-related flag byte at byte_2009470 via the Z flag.
interface: () -> flags Z/C set from (byte_2009470 != 0); r0 clobbered with the flag byte
details: 'Loads the single byte at IWRAM byte_2009470 into r0 and executes ''tst r0, r0'', so it is a
  pure predicate: NZ means the flag is set, Z means clear. It writes nothing and calls nothing. All known
  callers are jack-in flow code — ow_attemptJackIn and several routines at 0x08039xxx/0x0803A1xx — which
  use it as a condition on the jack-in state stored in that flag byte (e.g. jack-in in progress or permitted).'
