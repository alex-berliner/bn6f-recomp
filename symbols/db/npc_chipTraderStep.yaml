  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and most field offsets are correct, but the proposal swaps the meaning of r0: when the
    countdown expires and the chatbox check returns 0 (chatbox not busy), it returns r0=0 and writes state
    8 to obj+0x84; when still counting down, it returns r0=1. Also, the chatbox flag test is the opposite
    of stated: it `beq loc_809A802` (returns early with 1) when the chatbox flag bit 0x20 is clear, meaning
    it waits until chatbox is clear. The function name and prefix are reasonable; minor wording adjustment
    only.; run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by
    MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
