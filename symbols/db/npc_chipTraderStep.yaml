name: npc_chipTraderStep
address: '0x0809A7B0'
kind: function
status: probable
summary: 'Per-frame step handler for the Chip Trader NPC object: counts down obj+0xC by tick while updating
  an animation counter at obj+0x70 and stepping sub_809A80C; once expired, waits for chatbox bit 0x20
  to clear, then runs the Chip Trader text script, clears EVENT_1725, sets state byte 8 at obj+0x84, and
  returns 0.'
interface: (r5 = chip trader object) -> r0 = 0 when it just started/finished the chatbox interaction,
  1 while still waiting; no flags of use
details: Decrements the u16 at obj+0xC; while it is still >= 0 it also subtracts the byte at obj+0xF from
  the counter at obj+0x70 (likely a spin/slot animation tick) and calls sub_809A80C(obj+0x74) before returning
  1. Once the countdown expires it polls chatbox flag 0x20 via chatbox_mask_eFlags2009F38 and exits until
  it is clear. With chatbox state 0 it calls sub_809A80C on obj+0x74, zeroes the byte at obj+0x9, runs
  TextScriptChipTrader86C580C via chatbox_runScript, clears EVENT_1725, stores state 8 into obj+0x84,
  and returns 0. If the chatbox state is nonzero it instead calls chatbox_8040818 (likely closing/resetting
  the box), sets obj+0x9 = 1, and returns 0.
