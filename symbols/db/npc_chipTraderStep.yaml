  detail: 'ldr r0, off_809A894 // =TextScriptChipTrader86C580C + bl chatbox_runScript: it triggers the
    Chip Trader dialogue; bl ClearEventFlagFromImmediate with EVENT_1725: clears the trader''s one-shot
    story flag after running the script; countdown at r5+0xC (ldrh/sub #1/strh) gates the whole block
    until it goes negative; chatbox_mask_eFlags2009F38(0x20) + chatbox_GetState check waits for the chatbox
    to be free before talking; state field obj+0x84 set to 8 and byte obj+0x9 toggled 0/1 match the object
    state-machine pattern seen in sibling step handlers'
