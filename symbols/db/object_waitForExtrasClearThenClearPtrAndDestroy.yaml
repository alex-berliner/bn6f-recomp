  date: '2026-10-19'
  detail: 'sub_80BEA10+0x06: orr of ExtraVars+0xc and +0x10 gates initialization (bne return); sub_80BEA10+0x0e:
    mov r0,#0x1e; strh [oBattleObject_Timer] sets the 30-frame delay; sub_80BEA10+0x1e: strb r1(0),[r0]
    where r0=[ExtraVars] clears the target byte; sub_80BEA10+0x24: mov r0,#CUR_STATE_DESTROY; str [oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    destroys the object; no callers known; role inferred purely from object-state handler field layout'
