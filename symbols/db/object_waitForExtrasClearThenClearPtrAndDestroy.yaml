name: object_waitForExtrasClearThenClearPtrAndDestroy
address: '0x080BEA10'
kind: function
status: probable
summary: Battle-object phase handler that waits until oBattleObject_ExtraVars+0xc and +0x10 are both zero,
  sets oBattleObject_Timer to 30, then on expiry stores 0 to the byte pointed to by ExtraVars+0 (if nonzero)
  and writes CUR_STATE_DESTROY.
interface: (r5 = battle object) -> r0 = next state (CUR_STATE_DESTROY written to oBattleObject_CurStateActionPhaseAndPhaseInitialized);
  no return value used
details: Reads oBattleObject_PhaseInitialized; if not yet set, checks ExtraVars+0xc OR ExtraVars+0x10
  and returns without initializing while either is nonzero (i.e. waits until both are clear). Once both
  are zero it sets oBattleObject_Timer to 0x1e (30 frames) and sets PhaseInitialized to 4. Each subsequent
  call decrements the timer and returns while it is positive. On expiry, if ExtraVars+0 holds a nonzero
  pointer, it stores 0 to the byte at that pointer, then writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object is destroyed. The trailing word table (off_80BEA40..4C) points to data used by neighboring
  handlers, not by this one.
evidence:
