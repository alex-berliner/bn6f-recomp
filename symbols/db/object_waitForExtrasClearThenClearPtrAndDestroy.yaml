    loads 0x1e into oBattleObject_Timer, decrements, and on expiry if ExtraVars+0 is nonnull writes 0
    there and CUR_STATE_DESTROY. However PhaseInitialized is set to 4, not used as a flag value, and oBattleObject_Timer
