summary: Initializes a 0x58-byte AI chip-queue slot in EWRAM at 0x02011860 for a given actor slot index
interface: (r0 = ActorType (1=virus, 2=player), r1 = slot index, r2 = BattleObject ptr) -> r0 = pointer
  to initialized 0x58-byte slot
details: 'Loads the base pointer 0x02011860 (battle AI queue area) into r5, scales slot index by 0x58

  (mul r1, r4 with r4=0x58) to pick the per-actor slot. Stores ActorType at +1, writes the

  magic byte 0x09 at +0 (chip-queue state/sentinel), the passed BattleObject pointer at +4, and

  zero at +8 (counter/queue head). Returns the slot pointer in r0. The function is a leaf

  (pop {r4-r7,pc}), used by battle init flows (sub_81419A0 family, sub_8089D26/44, sub_808FF30/44,

  sub_8093212, sub_80467FC) to set up one actor''s chip-queue workspace before AI runs.

  The 0x58 stride and the 0x09 state byte match the layout of an "AI chip queue" record that

  downstream AI opcode handlers index by slot.

  '
