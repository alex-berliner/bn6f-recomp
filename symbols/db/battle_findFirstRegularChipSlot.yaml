  detail: 'loop reads a byte at [r4] and passes it to getLocOfActiveChips_8027E1C (12 bytes/entry) to
    fetch the active-chip record; skips on ldrb r0,[r0]; cmp #0xA/#0xB via add r4,#1 loop at 8028048;
    returns the unskipped slot index byte at 802804C; caller 8027FDC uses the result for the chip-select
    screen''s active/selected chip pointer; caller 8027F84 stores the chip ID of the highlighted slot
    with a 5/9 swap, consistent with slot-list scanning'
