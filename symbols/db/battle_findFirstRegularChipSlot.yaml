name: battle_findFirstRegularChipSlot
address: '0x08028034'
kind: function
status: probable
summary: Scans a chip slot list and returns the first slot whose active chip is not ID 0xA/0xB.
interface: (r0 = pointer to byte list of active-chip slot indices, terminated in practice by a non-0xA/0xB
  entry) -> r0 = first slot index whose chip's ID byte is not 0xA or 0xB; flags clobbered
details: Walks a byte array of chip slot indices (r4). For each index it calls getLocOfActiveChips_8027E1C
  to get the 12-byte active-chip entry, reads the entry's first byte (chip ID), and keeps scanning while
  that ID is 0xA or 0xB. It returns the slot index of the first entry whose ID byte is something else;
  it never checks for an end marker, so the caller must guarantee termination. Given the chip-select caller's
  use of an id-indexed lookup for the highlighted slot, this finds the first 'real' chip slot, skipping
  whatever chip IDs 10/11 represent (likely non-chip/placeholder entries).
