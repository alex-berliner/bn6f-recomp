name: sprite_updateAnimPassthrough_811C22C
address: '0x0811C22C'
kind: function
status: confirmed
summary: Trivial wrapper that tail-calls sprite_update, forwarding its arguments so the current object's sprite
  animation frame is advanced.
interface: void sprite_updateAnimPassthrough(r4, r5); // r4/r5 passed straight through to sprite_update; returned
  r0-r3 and NZCV flags are whatever sprite_update leaves
details: 'Body is just `push {lr}; bl sprite_update; pop {pc}`, i.e. a non-tail

  (but effectively tail) thunk around sprite_update. r4 and r5 are not

  touched locally, so they arrive at sprite_update exactly as the caller

  passed them — this looks like one of the many one-line update callbacks

  stored in object/NPC step tables where the handler type matches

  sprite_update''s signature directly but a distinct entry point is needed

  (or the wrapper exists so the table slot can be patched/hooked later).

  No other state is read or written; all results, clobbers (r0-r3) and

  flags come solely from sprite_update.

  '
