- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` ... `pop {pc}` shows the function is called as a leaf in the player tick chain
    (line `owPlayer_applyCountdownUpdate_809D5C4:` and exit). - `bl owPlayer_TickCountdownOrWait_809DDCC` followed by `tst r0, r0;
    beq loc_809D60C` is the only branch: expired vs in-progress tick (`0x809D5CC`). - `mov r0, #0x1c;
    add r0, r0, r5; bl checkZCoordModifiers_8031612` then `cmp r1, #1` uses r1 as the returned Z-modifier
    (call contract says r1 is out). - `movflag EVENT_1716; bl TestEventFlagFromImmediate` plus `beq loc_809D5F4`
    (the default-write block) gates the elevated branch on story progress EVENT_1716 being set. - `strb
    r3, [r5,#oOWPlayerObject_Unk_13]` then `ldr r0, [r5,#oOWPlayerObject_Unk_38]; lsl r0, r2; ... add
    ... str` and same for `Unk_3c`/Y implement the conditional nudge. - `loc_809D60C`: `ldr r0, [r5,#oOWPlayerObject_NextX]`
    etc., then `str r0, [r5,#oOWPlayerObject_X]; str r1, [r5,#oOWPlayerObject_Y]; str r2, [r5,#oOWPlayerObject_Z]`
    snap to target coords on countdown expiry. - All 40 captured snapshots show identical entry (r0=4,
    r1=2, r2=2, r3=0x4c, lr=0x809d4fc) and exit (r0=0x8000, flags cleared), consistent with a stable per-frame
    handler that the parent tick chain calls every frame during this state.'
