status: probable
summary: 'Per-tick handler that runs when the overworld player''s countdown is still active: reads a Z-coordinate
  modifier (notably "shoes on a given Z layer"), gates a doubling case on event flag EVENT_1716, and slides
  the player by Unk_38/Unk_3c shifted by the chosen Z layer.'
interface: '(r5 = OWPlayerObject*) -> void ; side effects: writes Unk_13, X, Y on the player object via
  r5'
details: "Called from somewhere in the OW player tick chain (callee `owPlayer_TickCountdownOrWait_809DDCC`\
  \ reports whether the 16-bit Unk_18 countdown has expired; the lr 0x0809d4fc points at a parent in `ow_player`).\n\
  \  If the countdown is still active (r0 != 0): compute r0 = r5 + 0x1c and call `checkZCoordModifiers_8031612`,\
  \ which by contract returns a Z-layer index in r1 (1 means \"doubled/elevated\"; 0 means base). r2 =\
  \ shift count, r3 = Unk_13 value to write. Default path sets r2=0, r3=1 (shift 0, write 1). If r1==1,\
  \ set r2=1, r3=2 (write 2). Then, only on that elevated branch, additionally test EVENT_1716 via `TestEventFlagFromImmediate`;\
  \ if the flag is unset, fall back to the default (r2=0, r3=1). After the conditional, store r3 into\
  \ `oOWPlayerObject_Unk_13` (offset 0x13). Then load `oOWPlayerObject_Unk_38`/`Unk_3c`, LSL by r2 (0\
  \ or 1), and add them to X/Y respectively; store back. This implements a one-tile horizontal/vertical\
  \ nudge per tick where the magnitude (Unk_38/Unk_3c) doubles when on the elevated Z layer, gated by\
  \ EVENT_1716.\n  If the countdown expired (r0 == 0): copy `oOWPlayerObject_NextX/NextY/NextZ` into X/Y/Z\
  \ (snap to target tile).\n  Returns via `pop {pc}` (Tail-call style with the saved LR pushed first).\
  \ The function's contract is essentially void: caller doesn't read r0 (the parent tick loop at 0x809d4fc\
  \ just continues), and r5/r8/r9/r12 are written but restored by the caller.\ndetails_evidence_quirks:\
  \ The assembly does `push {lr}` ... `pop {pc}` so this is a leaf-style caller; the value in r0 from\
  \ `owPlayer_TickCountdownOrWait_809DDCC` is the only branch discriminator. The `push {r3}` / `pop {r3}`\
  \ around `TestEventFlagFromImmediate` exists solely to save r3 across that call (since r3 holds the\
  \ Unk_13 value to write).\n"
