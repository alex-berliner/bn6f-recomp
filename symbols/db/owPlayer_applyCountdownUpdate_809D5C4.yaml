open_questions:
- The exact semantics of `Unk_13` (1 vs 2) — looks like a "step/animation frame index" but is unverified.
- The exact meaning of `Unk_38`/`Unk_3c` — used here as the per-tick displacement, possibly the slide
  vector magnitude (one tile in fixed-point units).
- What EVENT_1716 represents narratively (likely a story-progress / location-unlock flag for an elevated
  Z layer). Settling it would require scanning the EVENT flag definitions.
