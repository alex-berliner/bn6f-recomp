name: battleObject_updateSprite_80C4484
address: '0x080C4484'
kind: function
status: confirmed
summary: 'Per-frame sprite update for a battle object: applies mosaic scaling + alpha, then runs the standard
  object update unless Param3 is set or the battle is time-stopped.'
interface: void sub_80C4484(u32 battle_obj /* r5 */); // preserves r4, r5, r7, r10, lr; clobbers nz/c/v,
  r0-r3
details: 'Operates on the battle-object struct pointed to by r5. Reads

  `[r5 + oBattleObject_RelatedObject1Ptr]` and passes it to

  `sprite_getMosaicScalingParameters`, then calls `sprite_setAlpha` to

  configure the related sprite''s rendering. Dispatches on

  `[r5 + oBattleObject_Param3]`: if non-zero, jumps to `sub_801BCD0` (an

  alternate object update path); if zero, calls `battle_isTimeStop` and,

  when the battle is NOT time-stopped, calls `object_updateSprite`. When

  time is stopped with Param3 == 0, the sprite update is skipped entirely.

  Preserves r4/r5/r7 across the call; r10 is passed in but not used

  directly here. Note: register contract lists r5 as an input, but the

  function never writes r5, matching the adapter''s claim.

  '
