name: object_projectileAdvanceXTick
address: '0x080D4B00'
kind: function
status: confirmed
summary: Advances a battle projectile one tick along X — counts down its pre-move delay, moves it by XVelocity,
  refreshes its panels/collision, plays a sound on reaching column 2, and destroys it at column 7.
interface: void object_projectileAdvanceXTick(void)  // r5 = battle object; passes r5 through callees and returns
  the (possibly retargeted) object in r5 and r10 as the callees left it; clobbers flags and r0-r3, lr
details: 'Per-tick X movement for a projectile-type battle object (r5 = oBattleObject). While Param1 (a pre-movement
  delay counter) is non-zero it is decremented and the function returns without moving. Once the delay reaches zero,
  X += XVelocity, then object_setPanelsFromCoordinates and object_updateCollisionPanels refresh the occupied/collision
  panels from the new coordinates. Two edge conditions follow: if PanelX == 2 and Param2 == 1, Param2 is cleared
  and sound effect 0xFF is played via PlaySoundEffect (r2 is whatever updateCollisionPanels left in r2); if PanelX
  == 7 (end of flight / off the field), object_clearCollisionRegion releases the object''s collision region and
  CurStateActionPhaseAndPhaseInitialized is set to CUR_STATE_DESTROY. r5 and r10 must be threaded through setPanelsFromCoordinates
  and PlaySoundEffect because those callees can retarget the object pointer and produce the r10 the caller expects.
  PanelX==2 with Param2 set looks like a "crossed into a notable column" trigger (e.g. entering the far/near side)
  rather than a hit, since no collision with entities is checked here.

  '
