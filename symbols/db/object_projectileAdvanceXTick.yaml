name: object_projectileAdvanceXTick
address: '0x080D4B00'
kind: function
status: probable
summary: 'Per-tick update for a straight-flying battle object: after an optional delay it advances X by
  its velocity, plays a sound once when passing column 2, and destroys itself at column 7.'
interface: (r5 = battle object) -> r0 = 0; updates oBattleObject_X, PanelX/PanelY, collision record; may
  set state to CUR_STATE_DESTROY
details: If Param1 is nonzero it decrements it and returns, acting as a startup delay. Otherwise it adds
  XVelocity to X, then recomputes the object's panels from its position and syncs the collision record/facing.
  When the object reaches PanelX 2 while Param2 is 1, it clears Param2 and plays sound effect 0xFF (a
  one-shot trigger). When PanelX reaches 7 it clears its collision region and sets its state word to CUR_STATE_DESTROY,
  i.e. it flies off the far side of the field and despawns.
