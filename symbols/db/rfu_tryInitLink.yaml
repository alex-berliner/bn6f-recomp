name: rfu_tryInitLink
address: '0x0813DAC0'
kind: function
status: probable
summary: Attempts to (re)initialize the RFU link session via rfu_initLinkSession; on failure bumps a retry
  counter at [r5+2] by 4, then writes 0 to byte 0x200BC55 via sub_813D62C and returns 0.
interface: (no args) -> r0 = 0, r1 = base of IWRAM struct at 0x200BC50; side effects on struct bytes 2
  and 5
details: r5 points to a state struct whose byte at +2 is a retry counter and byte at +5 is a phase/error
  field. The routine calls rfu_initLinkSession (which also tears down any current link); if it returns
  nonzero (failure), it adds 4 to the retry counter at [r5,#2]. It then stores 0 into byte 0x200BC55 (offset
  5 of the 0x200BC50 struct) via sub_813D62C, which also returns the struct base in r1, and exits with
  r0 = 0. The initial bl to 0x0800027C is a far-call trampoline, not a semantic callee.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl rfu_initLinkSession; tst r0,r0; beq skip — the return value gates the counter update; ldrb
    r0,[r5,#2]; add r0,#4; strb r0,[r5,#2] — failure path increments a retry counter; mov r0,#0; bl sub_813D62C
    — zeroes byte 0x200BC55 and fetches the 0x200BC50 struct base; rfu_initLinkSession summary matches:
    inits adapter work buffer, timer IRQ, resets eLink state for a new session'
  refs:
  - bn6f/asm/asm37_0.s:4686
  - 0x0800027C crt0_start_800027C
  - 0x081465BC rfu_initLinkSession
  - 0x0813D62C sub_813D62C
  reproduce: python3 tools/asmcat.py 0x0813DAC0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The behavior matches: it calls rfu_initLinkSession, increments the retry counter at [r5,#2] by 4
    on failure, then zeroes a byte via sub_813D62C and returns 0. However, the proposed name ''rfu_initSessionStep''
    is misleading because the routine does not initialize the RFU session itself (rfu_initLinkSession
    does) and it isn''t really a ''step'' — it''s more like a one-shot RFU link-start attempt that records
    a retry on failure. The summary''s claim about ''resets the connection phase byte to 0'' is also imprecise:
    it stores 0 into byte 0x200BC55 via sub_813D62C, whose role we don''t know is a phase byte.; run wf
    investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
