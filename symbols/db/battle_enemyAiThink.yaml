    GetPositiveSignedRNG result AND 0xF, bge #0xC gates incrementing StepCounter before sub_80FAFF2 (80FAE1C-80FAE2E);
    StepCounter >= 1 branch resets it and calls sub_80FB028, an alternate movement action (loc_80FAE34)'
