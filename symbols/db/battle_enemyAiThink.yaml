name: battle_enemyAiThink
address: '0x080FADF0'
kind: function
status: probable
summary: 'Per-turn AI decision routine for a battle enemy: on the first turn it runs an opening action
  (sub_80FAFA0); otherwise it picks an attack threshold of 7 normally or 5 when HP is at or below half,
  and when AttackCounter reaches the threshold it resets and attacks via sub_80FAFB4, otherwise it increments
  AttackCounter and takes a movement action (sub_80FAFF2 or sub_80FB028) gated by StepCounter and a GetPositiveSignedRNG
  & 0xF roll.'
interface: (r5 = battle object, r6 = AI state; no args) -> r0 = whatever the chosen action callee returns;
  calls GetPositiveSignedRNG
details: 'Reads oAIState_TurnCounter in r6: if it is 0 (first turn) it increments it and calls sub_80FAFA0,
  likely an opening/spawn behavior. Otherwise it resets TurnCounter and picks a threshold of 7 attacks,
  lowered to 5 when the object''s HP is at or below half of MaxHP (oBattleObject_MaxHP/oBattleObject_HP
  in r5). If oAIState_AttackCounter has reached the threshold it resets it and calls sub_80FAFB4 (attack
  action); otherwise it increments AttackCounter and takes a movement action: if oAIState_StepCounter
  >= 1 it resets it and calls sub_80FB028, else it rolls GetPositiveSignedRNG & 0xF and increments StepCounter
  on rolls <12 (about 75%), then calls sub_80FAFF2. The two movement callees likely differ in movement
  type/panel target.'
