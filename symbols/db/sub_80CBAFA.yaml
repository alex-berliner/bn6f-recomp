name: sub_80CBAFA
address: '0x080CBAFA'
kind: function
previous_names: []
status: hypothesis
summary: (hypothesis) If the current BattleObject is on its alliance's starting/front column, compare its PanelY
  against the nearest enemy BattleObject's PanelY (from battleObject_findClosestEnemyBattleObject_80103F8) and store
  a {-1,0,+1} signed row delta in the BattleObject's ExtraVars+4 slot; no-op otherwise.
interface: in r5 = self BattleObject, r10 = Toolkit ; out no documented caller-visible return (only r1/r5 preserved
  per the contract; r0 ends as 1 in captures but is not annotated as live) ; writes self->ExtraVars+4 (signed -1/0/+1)
  only when self->PanelX equals 1 (ally side) or 5 (opponent side); r2 is clobbered for the comparison result; no
  other side effects observed
details: "1. push {lr}; tail-return via pop {pc} pattern (this is a leaf helper the caller `sub_80CBA34`/`sub_80CBA52`\
  \ invokes inline).\n  2. Reads self->Alliance (0x16), XORs with 1 to flip alliance, multiplies by 5 and adds 1\
  \ to get the expected \"front column panel X\" for that side: alliance 0 → 1, alliance 1 → 5. Tested at 0x80cbafc\
  \ against self->PanelX (0x12). If the object is not on the front row for its side, the function returns immediately\
  \ and writes nothing.\n  3. Only on a match: pushes the Alliance, repositions to self->PanelY (0x13). Calls battleObject_findClosestEnemyBattleObject_80103F8\
  \ with the flipped-alliance value, receiving the nearest enemy BattleObject in r0.\n  4. Hard-codes PanelY==1\
  \ as a special case that keeps r2=1 (the \"ahead of me by one row, no equal case here\" branch).\n  5. Otherwise\
  \ loads the enemy's PanelY from [r0,#0x13] (same offset, BattleObject union) into r0 and compares to self->PanelY\
  \ in r1: if equal, r2=0 (loc_80CBB2E); if r0 > r1 (enemy \"behind\" self in row order), r2 was 1 then decremented\
  \ by 2 → -1; if r0 <= r1, r2 remains +1. The cmp/bgt sequence is the classic two-way signed compare that yields\
  \ a {-1,0,+1} relative-row signal.\n  6. Stores r2 into self->ExtraVars+4 (str r2,[r5,#oBattleObject_ExtraVars+4]).\
  \ r2 fits s32 because all source PanelY are bytes (0..2 on a 3-wide grid) so the only values seen are -1/0/+1.\n\
  \  Observed in callers: the contract shows r1 out is \"live\"; in the captures r0 ends as 1, but that's the side\
  \ effect of the calling convention rather than a meaningful return — consistent with being a void-like helper.\n"
