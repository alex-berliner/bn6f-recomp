open_questions:
- Exact semantic of the stored {-1,0,+1} (signed "row delta to enemy" vs "stepping direction" vs "row-rank compare");
  the function does not sign-extend, just stores the literal r2.
- Whether r0=1 on exit is meaningful or just the residual of the last arithmetic op (no caller-visible meaning is
  annotated).
- Per-instance offset of oBattleObject_ExtraVars (T1/T3 use 0x2c size, T4 uses 0x1c; "+4" lands at different bytes
  in each variant). Pending identification of which BattleObject variant the callers pass (likely t3 given the BeastOut
  context, but not certain).
- The two callers (0x80cba34, 0x80cba52) and the callee battleObject_findClosestEnemyBattleObject_80103F8 need one-line
  project summaries before the subsystem prefix and prefix choice can be locked in.
- 'Captured calls 1, 10, 11, 12, 13 enter with r0=0 r2=5 r3=3 (which is the matching "opponent alliance on PanelX=5"
  case the first branch tests for), while entry #0 has r0=r1=0x80 — probably a different object type being passed
  as `r5` — that asymmetry would be clarified with names for the two callers.'
