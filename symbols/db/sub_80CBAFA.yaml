  detail: '- "ldrb r0,[r5,#oBattleObject_Alliance]; mov r1,#1; eor r0,r1" + "mov r1,#5; mul r0,r1; add r0,#1" →
    byte XOR 1 → {0,1}, ×5 +1 = {1,5}; the two front-column values for a 3-col × 3-row BN grid (panels 0..2 each
    axis), one per alliance. - "cmp r0,r1; bne locret_80CBB32" against self->PanelX at oBattleObject_PanelX (=0x12):
    early-out if not on front column. - "bl battleObject_findClosestEnemyBattleObject_80103F8" provides the nearest
    enemy BattleObject in r0; the function then reads [r0,#0x13], exactly oBattleObject_PanelY. - "mov r2,#1; ...
    cmp r0,r1; beq loc_80CBB2E; sub r2,#2; ... mov r2,#0" yields {-1,0,+1} for (r0<r1, r0==r1, r0>r1) read in this
    order — but note the bgt on r0,r1 means r2 stays +1 when r0 is not greater, and only becomes -1 when r0 > r1
    (i.e., enemy PanelY > self PanelY). Read literally that''s "r2 = +1 if enemy not ahead, 0 if exactly aligned,
    -1 if enemy is on a higher row". - "str r2,[r5,#oBattleObject_ExtraVars+4]" — the only memory write; matches
    the contract''s may_write of [r5,...]. - Callers and callee are unnamed in this drop; sub_80CBA34/sub_80CBA52
    both look like upstream BeastOut/SoulWeaver-related decision steps given the captured file prefix `snap_beastsp_…`,
    but I can''t confirm the subsystem from the supplied summaries.'
