name: getBattleArmPositionMaybe_8018810
address: '0x08018810'
kind: function
status: confirmed
summary: Returns the mirrored (x, y) attachment offset of an arm/part slot on a battle object, or the fixed default
  pair (0, 7) for invalid slot ids 0xCD..0xFF.
interface: (int armId /*r0*/, int index /*r1*/, int objA /*r2*/, int objB /*r3*/) -> (int x /*r0*/, int y /*r1*/,
  int flip /*r2*/); r4-r6 preserved, NZCV clobbered
details: 'Computes one coordinate pair of an arm/part attachment point relative to a battle object, taking the object''s
  facing direction into account. If the arm id is out of range (0xCD <= id <= 0xFF treated as "no real slot"), it
  short-circuits and returns the fixed offset (x=0, y=7) with no flip value. Otherwise it saves r1/r2/r3 into r4/r5/r6
  and calls sub_800F26C to fetch a lookup base for the object pair, then getIndexedSignedBytePair_8018842 with the
  index in r2 to read the signed byte pair (offsetX, offsetY) for that slot, then object_getFlipDirection(objA,
  objB) to get the mirror factor for the object''s facing. The final result is r0 = offsetX * flip, r1 = offsetY
  unchanged, and r2 = flip direction handed back to the caller. Quirk: the y offset is NOT mirrored, only x is multiplied
  by the flip factor, and the flip value is returned in r2 as a bonus output. The invalid-id branch leaves r2 undefined
  (it just returns immediately), and the returned pair (0,7) suggests the default arm rest position.

  '
