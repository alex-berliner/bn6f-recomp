name: ai_initAttackState
address: '0x0810806E'
kind: function
status: probable
summary: 'Initializes the enemy AI''s attack state: records difficulty tier, sets substate 2, picks a
  panel-choose callback, computes attack duration/boost, and targets the opposing player before starting
  attack 12.'
interface: (r7 = AIAttackVars struct, r5 = AI's BattleObject) -> r0 = clobbered; writes oAIAttackVars
  fields, sets attack 0xC via object_setAttack0
details: Stores the AI difficulty tier (from battle_getAiDifficultyTier) into oAIAttackVars_AiDifficultyTier
  and clears the InitFlag. Calls sub_8108124 with r0=2, presumably selecting substate 2 of the AI attack
  state machine, and installs sub_8108CBA as oAIAttackVars_PanelChooseCallback, implying the attack picks
  a panel to strike. sub_8107F48 and sub_8107F5C supply the AttackDuration, AttackBoost2, and TimerOrCycles
  initial values. It then eors the object's Alliance bit and calls battle_findPlayer to store the opposing
  player's object pointer in oAIAttackVars_TargetObjectPtr. Finally it invokes object_setAttack0 with
  0xC, beginning the attack itself. All four callers appear to be distinct AI attack entry points that
  share this common initialization.
