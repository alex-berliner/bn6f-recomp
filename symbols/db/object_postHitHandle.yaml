name: object_postHitHandle
address: '0x080DF132'
kind: function
status: probable
summary: 'Handles a battle object after a hit: removes its collision data, spawns the hit effect, optionally
  clears its collision region, decrements Timer each frame, refreshes collision data while the timer is
  positive, then clears the region and transitions to CUR_STATE_DESTROY.'
interface: (r5 = battle object pointer, no args) -> void; sets oBattleObject_CurState to CUR_STATE_DESTROY
  when the timer expires
details: 'Runs on an object whose collision has already been processed: it first tears down the collision
  data, spawns the hit effect at the object''s position, and, if the collision flags word is nonzero,
  clears the object''s collision-region byte so it leaves its collision region. Each frame it decrements
  oBattleObject_Timer; while the timer is still positive it calls object_presentCollisionData to keep
  refreshing collision state (clearing one-shot hit data). Once the timer reaches zero it clears the collision
  region again and writes CUR_STATE_DESTROY into oBattleObject_CurState, handing the object over to the
  destroyer. Reads oCollisionData_FlagsFromCollision through oBattleObject_CollisionDataPtr to decide
  whether the early region clear is needed.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData / object_spawnCollisionEffect at entry: standard hit-processing
    teardown plus effect spawn; ldr flags via oBattleObject_CollisionDataPtr + oCollisionData_FlagsFromCollision;
    tst/beq guards an object_clearCollisionRegion call; ldrh/sub/strh on oBattleObject_Timer with ble
    to the destroy branch shows a countdown; timer>0 path calls object_presentCollisionData, matching
    ''keep collision state while present in a collision''; expiry path: object_clearCollisionRegion then
    mov #CUR_STATE_DESTROY; strb into oBattleObject_CurState'
