  reproduce: python3 tools/asmcat.py 0x080DF132
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function calls object_removeCollisionData first (not just ''tears down collision data'' generically),
    and the CUR_STATE_DESTROY write matches. However, the summary and details overstate: object_presentCollisionData
    is only called while the timer is positive (b locret_80DF15E branch), not unconditionally, and the
    early region-clear is conditional on the flags word — both consistent with code. The name misses the
    key initial action of removing collision data; something like object_postHitHandle reflects this better.;
    run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
