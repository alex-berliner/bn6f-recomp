name: clearBattleObjectLinkedLists_800318C
address: '0x0800318C'
kind: function
status: confirmed
summary: Resets the battle object doubly linked list (head block + sentinel node) and a related list pointer to
  an empty state, likely when setting up a battle.
interface: 'void clearBattleObjectLinkedLists(void) — in: lr only; out: r2 = eUnkBattleObjectLinkedList address,
  r3 = 0 (incidental); clobbers r0, r1, NZ flags'
details: Initializes the battle object linked list structures for an empty list. Stores NULL to eUnkBattleObjectLinkedList
  (0x2009xx region), NULL to eBattleObjectsLinkedListStart (first object pointer), and the sentinel address to eBattleObjectsLinkedListStart+4
  (last pointer). Then points the sentinel node back at the list start block (sentinel+0 = list start address) and
  stores NULL at sentinel+4 (next pointer). The result is an empty doubly linked list whose head block has first=NULL
  / last=sentinel and whose sentinel has prev=head / next=NULL. The r2/r3 leftover values look incidental (r2 holds
  the unk-list address from the loading sequence, r3 holds the NULL constant), but the register contract records
  them as outputs since callers must not rely on them being preserved. Called presumably before battle object allocation
  begins.
