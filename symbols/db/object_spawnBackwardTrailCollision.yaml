  detail: 'loop counter: add r4,#1 / cmp r4,#3 / blt loc_80C8FA4 — exactly three spawns; neg r0,r0; mul
    r0,r4; add to [r5,#oBattleObject_PanelX] — offsets 0,-dir,-2dir behind the facing direction; ldrb
    Element, DamageAndStaminaDamageCounterDisabler and constants 0x4050101/3 passed to object_spawnCollisionRegion;
    strh Param2 into [r0,#oBattleObject_Timer] of each spawned region — per-region timer from the source
