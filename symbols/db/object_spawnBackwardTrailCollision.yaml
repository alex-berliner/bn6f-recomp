name: object_spawnBackwardTrailCollision
address: '0x080C8FA0'
kind: function
status: probable
summary: Spawns a row of three collision regions trailing behind a battle object, opposite its facing
  direction.
interface: (r5 = oBattleObject*; r0 not used) -> r0 = 0 or pointer to last spawned collision region; no
  flags of interest
details: Iterating r4 = 0..2, it computes an offset of -getFrontDirection() * r4 and adds it to the object's
  PanelX, keeping PanelY fixed, so three consecutive panels are targeted going backwards from the object's
  facing. Each iteration calls object_spawnCollisionRegion(x, PanelY, Element, 0, 0x4050101, DamageAndStaminaDamageCounterDisabler,
  3), reusing the spawner's damage field and passing constant 0x4050101 and 3. If a region was created
  (nonzero r0), the object's Param2 is copied into the new object's Timer field, likely its lifetime or
  delay. The three regions are therefore a trail of damaging panels left behind the moving/facing object.
