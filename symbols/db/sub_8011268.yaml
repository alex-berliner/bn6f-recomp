name: sub_8011268
address: '0x08011268'
kind: function
status: confirmed
summary: Dispatches a mode index in r0 to one of 24 handler functions via a jump table
interface: void dispatchMode_8011268(u32 mode /* r0 */, lr); clobbers r0-r3, r4-r12, nzcv; no preserved regs
details: 'Tiny thunk that reads a 32-bit function pointer from jump table at 0x0801127C

  indexed by (r0 << 2), then tail-calls it via a "mov lr,pc; bx r0" gadget so

  the handler''s return pops sub_8011268''s saved lr and goes straight back to

  the original caller. Because it tail-calls, the handler''s output registers

  (r4-r12 per the contract) are exposed to the caller as this function''s

  outputs. r2 is hard-set to 0 before the call. Table entries are stored with

  the +1 thumb-bit set; nullsub_42/nullsub_43 are no-op slots, and entries

  sub_80112E0..sub_8011366 are the real handlers. The "+1" in the table

  reflects Thumb addresses; 0x0801127C and the literal "off_801127C" base

  are the table itself, not a pointer to it (off_8011278 just reloads the

  same literal).

  '
