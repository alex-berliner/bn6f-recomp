- Which subsystem owns this mode index? r0 is a raw 0..23 mode, but no game-side field is named here, so the prefix
  (battle_, script_, etc.) is not yet justified.
- Why are several table entries (5 of 24) the same nullsub_43 stub? Worth checking if those mode indices are valid-but-unimplemented
  on this version (Falzar) vs. Gregar.
- r2=0 is passed to every handler unconditionally; confirm whether any handler actually consumes it as a meaningful
  argument or if it is just scratch for the dispatch.
