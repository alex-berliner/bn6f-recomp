name: gfxDecompressWorkBuffer
address: '0x030016F0'
kind: data
status: probable
summary: 'Proposed name: gfxDecompressWorkBuffer. Shared 32-byte IWRAM work buffer for graphics copied
  or decompressed by battle HUD, active-chip, and submenu graphics routines. (u8[32])'
details: The label is used as the destination of 32-byte graphics transfers in battle HUD and active-chip
  loading, and as the destination of CopyWords followed by decompAndCopyData in submenu_entry_87DE44C.
  Its reused role across battle HUD, active-chip, and submenu graphics paths identifies it as a shared
  graphics work buffer, not a persistent data table. No site directly initializes or inspects its contents;
  callers supply or decode the graphics that are written there.
