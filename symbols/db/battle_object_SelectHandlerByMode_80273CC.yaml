name: battle_object_SelectHandlerByMode_80273CC
address: '0x080273CC'
kind: function
status: confirmed
summary: Picks a battle object's next routine from a per-mode pointer table and flags the object with state 4.
interface: void sub_80273CC(battleobj *r5); /* returns r0=4, r1=table base, NZ from r0=4 (clear), C from mode<<2
  */
details: Treats r5 as a battle object. Reads the mode byte at +0xC, doubles it twice (mode*4 byte index) and loads
  a word from the pointer table at off_8027C84 indexed by that mode, storing the result into the object's routine/handler
  slot at +0x40. Then writes halfword 4 to the object's state field at +2, which likely tells the object's executor
  to call the freshly selected handler. Nothing else in the object is touched; lr is only pushed for the return.
