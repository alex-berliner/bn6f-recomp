name: overworld_leaveArea_808CBD8
address: '0x0808CBD8'
kind: function
status: confirmed
summary: 'Handles transitioning out of the current area: spawns the overworld map object, sets a BBS flag,
  switches game state to mode 3, and plays a departure sound unless the map group is 0x85.'
interface: u32 overworld_leaveArea_808CBD8(/* r4 = spawnArg, r10 = toolkit */); // returns r0 = 0, sets
  nz; preserves r4-r7, r10
details: Calls SpawnOverworldMapObject(0x11, 0, 0, 0, r4) to create the overworld map entity (object ID
  0x11), passing the caller's r4 as the 5th argument (likely the originating entity/area index). Then
  calls reqBBS_setFlag_e17b0f7_8140A00 to mark a BBS progression flag. Sets gameState unk09 field to 3
  (overworld/exploration mode). Reads the map group from gameState+oGameState_MapGroup; if the group is
  not 0x85, plays sound 0x1F with argument 0x13B (a transition SFX). Returns 0 with flags updated. Map
  group 0x85 appears to be a special area where the departure sound is suppressed. The function explicitly
  saves and restores r5 around the SpawnOverworldMapObject call because that callee clobbers r5.
