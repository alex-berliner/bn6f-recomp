name: ai_attackState_SetupSpecial_8112FBA
address: '0x08112FBA'
kind: function
status: confirmed
summary: AI attack driver that branches the battle-object state machine on attacker.oBattleObject_RelatedObject1Ptr,
  setting up a "special" attack (anim 2, victim lookup 0x12810, extra flag 14, timer/0xA, front direction,
  0x1E frame counter) when it is 1, otherwise writing a phase id (0xC if 0, no-op otherwise).
interface: '// r5 = attacker battle object*, r7 = AI attack vars*, r10/lr preserved by caller

  u32 sub_8112FBA(void);

  // reads: r5 attacker, r7 aiVars

  // writes: r0 phase value (8, 0xC, or the RelatedObject1Ptr value), r1 scratch, r5 preserved-as-in

  // clobbers NZCV (sets flags via final phase compare); r0,r2-r4,lr scratch; r5-r7 preserved

  // side effects: ST8 anim, ST32/ST16 AI vars fields, calls sub_80C4038, battle_SetObjectExtraFlag14_80C4086,
  object_getFrontDirection, object_setCounterTime

  '
details: "Branches on attacker->oBattleObject_RelatedObject1Ptr:\n  - 1 (\"special\" attack path):\n \
  \     * attacker->oBattleObject_CurAnim := 2\n      * aiVars->oAIAttackVars_Unk_28 := 0\n      * victim\
  \ = sub_80C4038(0,0,0,0, 0x12810); aiVars->oAIAttackVars_Unk_30 := victim\n      * flag_target = battle_SetObjectExtraFlag14_80C4086();\
  \ flag_target->oBattleObject_Timer := aiVars->oAIAttackVars_Unk_0e * 0xA (one byte * 0xA stored as halfword)\n\
  \      * aiVars->oAIAttackVars_Unk_34 := object_getFrontDirection()\n      * object_setCounterTime(0x1E)\n\
  \      * aiVars->oAIAttackVars_Unk_00 := 8; returns 8\n  - 0: aiVars->oAIAttackVars_Unk_00 := 0xC; returns\
  \ 0xC\n  - other: leaves Unk_00 untouched; returns RelatedObject1Ptr value\nNames of the touched fields\
  \ are placeholders (Unk_00, Unk_0e, Unk_28, Unk_30, Unk_34). The 0x12810 constant and sub_80C4038 look\
  \ like a target-object factory keyed on a chip/attack id. Battle-object fields: oBattleObject_RelatedObject1Ptr,\
  \ oBattleObject_CurAnim, oBattleObject_Timer.\n"
