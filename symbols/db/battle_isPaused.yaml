name: battle_isPaused
address: '0x0800A03C'
kind: function
status: confirmed
summary: Reads the battle-paused flag from the current game state and returns it with NZ flags set from the byte.
interface: bool battle_isPaused(Toolkit* toolkit /* r10 */); returns r0 = oGameState_BattlePaused byte, r1 = game
  state pointer, NZ flags from tst r0,r0
details: Loads the toolkit's game state pointer (r10 + oToolkit_GameStatePtr), then reads the byte at oGameState_BattlePaused.
  Returns that byte in r0 and the game state pointer in r1 as side outputs. Flags come from a tst r0,r0, so Z=1
  iff the byte is zero and N mirrors bit 7 of the byte; callers can branch directly on the result without a separate
  comparison. No memory is written and no other registers are touched, so it is a cheap predicate suitable for polling
  inside the battle loop (e.g. to freeze updates while the pause menu is open in battle).
