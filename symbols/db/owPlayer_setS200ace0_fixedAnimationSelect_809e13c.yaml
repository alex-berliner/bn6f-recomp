name: owPlayer_setS200ace0_fixedAnimationSelect_809e13c
address: '0x0809E13C'
kind: function
status: confirmed
summary: Stores a fixed overworld player animation id into eStruct200ace0 and raises event flag EVENT_1719.
interface: void owPlayer_setFixedAnimationAndFlag_ADDRESS(u8 animId /*r0*/); clobbers r0, r1, r3, lr and NZCV via
  SetEventFlagFromImmediate
details: Takes an animation id in r0 and stores it as a byte into eStruct200ace0 at offset 2 (oS200ace0_owPlayerFixedAnimationSelect_02),
  the field the overworld player object presumably consults to force a fixed animation (e.g. a scripted pose or
  cutscene stance). It then sets event flag EVENT_1719 by calling SetEventFlagFromImmediate with group 0x17 in r0
  and flag 0x19 in r1 (the movflag EVENT_1719 pseudo-op expands to those register loads). Everything else callers
  observe (r0, r1, r3, NZCV) reflects the state left by SetEventFlagFromImmediate, since the function does nothing
  after the call except return. The flag being set right after selecting the animation suggests EVENT_1719 is a
  signal to the overworld player object or a waiter that the animation change is ready to apply.
