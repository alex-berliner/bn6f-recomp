name: sub_81419A0
address: '0x081419A0'
kind: function
previous_names: []
status: hypothesis
summary: Top-level per-frame handler for the overworld PET "Beast Spam"/BeastOut gating check that, given clean
  input, either processes inputs (sub_8141A10) or finishes a sequence (sub_8141A70) — i.e. tick of `eStruct2001010`
  while no cutscene/screen-fade/subsystem block is active and not paused.
interface: (r0..r3 not inputs; toolkit in r10) -> r0 = 0 ; no other returns
details: "Loads `r5 = eStruct2001010`. Calls `sub_8141AA8`; if it returns NZ, jumps to exit. Otherwise checks `eStruct2001010+3`:\
  \ if non-zero, clears it to 0 and calls `sub_80468BA`, then `sub_80468C6(0x1,0x0,0x0)` and `sub_80468C6(0x2,0x1,0x0)`\
  \ (two acknowledgement writes). Always calls `sub_8046818`, `sub_8046854`, then `sub_811E0BA`. Bails on any of:\
  \ cutscene script active (`IsCutsceneScriptNonNull`), overworld player busy/cutscene active (`owPlayer_isBusyOrCutsceneActive_809E462`),\
  \ screen fade active (`IsScreenFadeActive`), chatbox flag 0x80 set (`chatbox_mask_eFlags2009F38`), or `GameState->SubsystemIndex\
  \ != 4`. If `SubsystemIndex == 4`, calls `sub_8141AD2`: if it returns NZ, falls into `sub_8141A70`; else `sub_8141A10`.\
  \ Always returns r0=0.\n  Reads offset `0x3` of `eStruct2001010` (the 4-byte EWRAM struct at 0x02001010). Reads\
  \ `tk->GameStatePtr + oGameState_SubsystemIndex`.\n"
