name: sub_81419A0
address: '0x081419A0'
kind: function
previous_names: []
status: hypothesis
summary: 'Per-frame battle update: drives AI dispatch, sprite GFX, cutscene/cursor gating, and chip-custom-screen
  selection (subsystem 4 only).'
interface: '(r10 = toolkit) -> r0 = 0 ; side effects: many (writes AIData flags, calls AI dispatch, sprite GFX,
  game select, cutscene poll, screen-fade poll)'
details: "Entry sequence calls sub_8141AA8 (returns NZ when some AIData flag eStruct2001010+3 is set, see `tst r0,r0\
  \ ; beq loc_81419CC`). When that branch is taken the function clears `eStruct2001010+3` to 0, calls sub_80468BA\
  \ (battle setup helper), and primes two sub_80468C6 events with args (1,0,0) and (2,1,0). Otherwise it falls through\
  \ to the unconditional update tail.\n\n  Tail (loc_81419CC): always calls battle_callAIDispatch_8046818, battleObject_updateSpriteGfxForAll_8046854,\
  \ sub_811E0BA (per-frame battle object update). Then a series of early-outs if any of these are active: a cutscene\
  \ script is running (IsCutsceneScriptNonNull), the overworld player is busy/in a cutscene (sub_809E462), a screen\
  \ fade is active (IsScreenFadeActive beq = active so jump), chatbox event flag 0x80 is set (chatbox_mask_eFlags2009F38).\n\
  \n  Only when GameState->SubsystemIndex == 4 (chip selection/custom screen) does it call sub_8141AD2; if that\
  \ returns Z it calls sub_8141A10 else sub_8141A70. This is the chip/custom-screen selection routine for in-battle\
  \ chip pick (subsystem 4 only runs during battle).\n\n  Returns 0 in r0 (set explicitly before pop {pc}). Function\
  \ is void from the caller's perspective (r0 written but always 0; no caller-visible state).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4-r7,lr}` and constant `eStruct2001010` (`off_8141B14`) is loaded into r5 then `ldrb r0,[r5,#3]`
    (`byte_2001013 - 0x2001010`) is read. - `tst r0,r0` followed by `beq loc_81419CC` shows the byte at offset +3
    gates the one-shot init block; the block clears it via `strb r0,[r5,#3]` with r0=0. - Direct calls to `battle_callAIDispatch_8046818`
    and `battleObject_updateSpriteGfxForAll_8046854` show it kicks the standard battle tick (AI + sprite GFX). -
    Sub_811E0BA is the per-frame battle-object update (called unconditionally in tail). - Guard chain: `IsCutsceneScriptNonNull`,
    `sub_809E462` (`owPlayer_isBusyOrCutsceneActive_809E462`), `IsScreenFadeActive`, `chatbox_mask_eFlags2009F38`
    with `mov r0,#0x80` (test bit 0x80 of the chatbox flag word); all `bne loc_8141A0C` short-circuit out. - GameState
    subsystem check `ldrb r0,[r0,#oGameState_SubsystemIndex]; cmp r0,#4; bne loc_8141A0C` and the calls to sub_8141AD2
    / sub_8141A10 / sub_8141A70 are reached only when subsystem == 4, matching the in-battle chip/custom-screen
    phase. - `mov r0,#0 ; pop {r4-r7,pc}` shows r0 always returned as 0.'
