open_questions:
- The semantic meaning of `eStruct2001010+3` (a "pending one-shot init" flag) and the meaning of the two `sub_80468C6`
  enqueues (1,0,0) and (2,1,0) — these likely set up the panel/battle-stage state for the chip-select transition
  but the exact event IDs are not in this file. Also unclear which of sub_8141A10 vs sub_8141A70 is the "OK" vs
  "Cancel" path; the test against sub_8141AD2's NZ result probably reflects cursor selection state. Snap context
  (`snap_beastsp_0140000_*`) shows this is reached 40 times from a battle context (lr=08003b1a), consistent with
  a per-frame battle tick.
