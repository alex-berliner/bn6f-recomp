open_questions:
- Identity of the caller object class (likely an enemy/Navi step-AI used by patrolling or chasing routines) — not
  derivable from this function alone.
- Meaning of the byte_80E3CB4 parameter table for GetAllianceDependentPanelParamArgs (likely alliance-aware walkability
  / movement-cost mask).
- Exact semantics of CurAction = 4 and the special-action path triggered by ExtraVars[2] != 0 (probably a custom
  attack/anim rather than a plain step).
- Why the bounce path is gated on Param2 == 0 (Param2 likely toggles whether the object should reverse on contact
  versus proceed through).
