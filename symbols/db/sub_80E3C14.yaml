name: sub_80E3C14
address: '0x080E3C14'
kind: function
status: confirmed
summary: Battle object per-tick handler that walks one panel step in its X-velocity direction, bouncing off unwalkable
  panels, snapping to the panel grid when the timer expires.
interface: void sub_80E3C14(u32 obj /* r5 */) /* preserves r4 r5 r6; clobbers r0-r3, lr, nzcv; may set CurStateActionPhaseAndPhaseInitialized
  to "0:8" (destroy) and CurPhase to 0 */
details: 'Operates on a battle object (oBattleObject_*) passed in r5.

  First sanity-checks the current panel via object_isCurrentPanelValid; if invalid

  clears the related object1''s oBattleObject_ObjectHeader and transitions self to

  CUR_STATE_DESTROY ("0:8"). Also destroys self if the related object1 has a null

  object header.

  On phase 0 (new step) it seeds Timer from Timer2; if ExtraVars[2] (offset

  oBattleObject_ExtraVars+8) is non-zero it switches CurAction to 4 and

  reinitializes CurPhaseAndPhaseInitialized to 0 (i.e. performs a special

  action instead of walking). Otherwise it computes the next panel from the

  sign of XVelocity (±1 in X) and calls GetAllianceDependentPanelParamArgs

  with the table at byte_80E3CB4 (= 0x20, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00,

  0x00, 0x00, 0x00, 0x01, 0x00, 0x20, 0x00, 0x00, 0x00) and the object, then

  object_checkPanelParameters on (nextX, nextY, args.r2, args.r3). When the

  panel is not walkable the object proceeds to move anyway; when walkable

  and Param2 is 0 it negates XVelocity (bounces) and resets CurPhase to 0.

  Mid-walk (phase != 0) it advances X by XVelocity, calls

  object_setPanelsFromCoordinates, copies the resulting PanelXY into the

  u16 pointed to by ExtraVars[1] (offset oBattleObject_ExtraVars+4),

  decrements Timer, and on expiry calls object_setCoordinatesFromPanels and

  clears CurPhase.

  '
