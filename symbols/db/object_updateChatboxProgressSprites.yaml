name: object_updateChatboxProgressSprites
address: '0x0809A6A4'
kind: function
status: probable
summary: 'Per-frame object update: bumps a step byte at [r5+4] by 0x10 up to 0x60, then on reaching the
  cap snapshots the chatbox''s 0x4C halfword/0x50 byte into [r5+6]/[r5+5], slides three sprites at id
  (counter-0x30), runs entity/sprite updates plus sub_809A80C on [r5+0x74], and returns 0 until EVENT_F5
  is set (1 after).'
interface: (r5 = object record, preloaded by caller) -> r0 = 0 while EVENT_F5 clear, 1 once set; no other
  outputs
details: 'Reads the byte at [r5+4], adds 0x10, and caps it at 0x60, storing it back — a frame counter
  incremented in steps of 16 up to 96. While below the cap it copies chatbox fields: halfword [chatbox+0x4C]
  -> [r5+6] and byte [chatbox+0x50] -> [r5+5] (looks like the chatbox''s current text-render progress).
  It then computes firstId = counter - 0x30 and calls sprite_setPositionForIdRange3 to move three consecutive
  sprite-table entries from that id (negative ids simply have no entries and are skipped, so the window
  effectively starts at id 0 once counter >= 0x30). It then runs the global entity/sprite pipeline (entity_runAllUpdateHandlers,
  battle_updateEStructSprites) and calls sub_809A80C with [r5+0x74]. Finally it tests EVENT_F5, the usual
  ''script step finished'' flag, returning 0 until it is set and 1 after — the standard ''keep waiting''
  update-handler contract.'
