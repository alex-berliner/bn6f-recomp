name: startScreen_fadeOutUpdateIfFlag40_802FB90
address: '0x0802FB90'
kind: function
status: confirmed
summary: On the start screen, when state field 0xA has flag 0x40 set, runs one step of the fade/transition routine
  driven by the parameter table byte_802FBA8.
interface: 'void sub_802FB90(StartScreen *self /* r5 */); outputs: r2/r3/c/v as left by sub_8001158; r4-r7 preserved'
details: 'Reads the 16-bit state/flag word at StartScreen+0xA (r5 is the start-screen context, kept by the caller
  in r5). If bit 0x40 is clear it returns immediately; if set, it loads r0 with the pointer at off_802FBA4, which
  points to byte_802FBA8 — a small parameter table (bytes 0x04, 0x40, then word 0x80282C20) — and tail-context calls
  sub_8001158, a generic update/transition worker that consumes such tables. This is the per-frame driver for the
  start screen''s fade-out / scene-transition phase: the caller keeps r5 in r5 across the call, and the callee''s
  effects (flags c/v and r2/r3 in the contract) come from whatever sub_8001158 leaves behind.'
