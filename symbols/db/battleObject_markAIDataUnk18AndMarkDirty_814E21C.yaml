open_questions:
- Exact semantics of AIData.Unk_18 (looks like a phase/state id) and the meaning of bits 0..3 of
- AIData[0] — likely a dirty/re-evaluate flag for the AI loop, but the AIData layout only documents
- Unk_00 implicitly via `ActorType`/`AIIndex`. Naming the AIData byte as "dirty" is inferred from the
- 0x0F mask pattern matching other battle-tick code. Settling it would require inspecting other
- sites that read AIData[0] low nibble and sub_814E36D's dispatcher.
