name: info_copyTimestampToWorkArea_803F8B2
address: '0x0803F8B2'
kind: function
status: confirmed
summary: Copies the 20-byte InfoText timestamp buffer into the packet/work area at toolkit->S2001c04 + 0x6C.
interface: void sub_803F8B2(void); /* reads r10 (toolkit ptr); r0/r1/r2 are left holding CopyBytes' final r0/r1/r2,
  which callers treat as outputs r1/r2/r3 */
details: Loads the address of the EXE6_InfoText_timestamp buffer (a 20-byte / 0x14 timestamp record associated with
  InfoText data) and copies it with CopyBytes into the work area pointed to by [r10 + oToolkit_S2001c04_Ptr] at
  offset 0x6C. No other state is touched; the only interesting quirk is that the caller-visible r1/r2/r3 outputs
  are just CopyBytes' leftover register values (dest cursor and remaining count), so callers apparently rely on
  or at least observe those post-call values.
