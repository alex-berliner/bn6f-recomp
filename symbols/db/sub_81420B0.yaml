name: sub_81420B0
address: '0x081420B0'
kind: function
status: confirmed
summary: Looks up a per-enemy byte from a small table (indexed by the enemy index derived from the map group in
  r10) and returns it shifted left by 16 so it lands in bits 16-23 of r0.
interface: 'u32 battle_getShiftedEnemyTableByte(void /* index source in r10 */); // in: r10 (passed through to sub_8142080),
  lr; out: r0 = table_byte << 16; clobbers r1, lr, flags; preserves r4-r7'
details: 'Tail-style helper: pushes r4-r7,lr, calls battle_getEnemyIndexFromMapGroup_8142080

  (which consumes r10, presumably a map-group/world value) to get an enemy index in r0,

  then reads a byte from a lookup table at dword_81420C4 (0x081420c4) at that index and

  lsls it by 16 before returning. The table''s only defined word is 0x404080, i.e. bytes

  {0x80, 0x40, 0x40, 0x00} for indices 0-3, so the result values are 0x800000, 0x400000,

  0x400000, 0x000000 for those entries. The <<16 shift strongly suggests the caller ORs

  the result into a 32-bit word whose upper byte holds this per-enemy attribute (the

  values 0x80/0x40 look like bit flags or an alpha/blend-style field), but the consumer

  is not in this function. r4-r7 are pushed/popped purely as a preserved-register

  courtesy; they are never used. The table has room for 4 entries as currently known;

  behavior for larger enemy indices depends on what follows dword_81420C4 in ROM.

  '
