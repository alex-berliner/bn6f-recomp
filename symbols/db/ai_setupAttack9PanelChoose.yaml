name: ai_setupAttack9PanelChoose
address: '0x08101F08'
kind: function
status: probable
summary: 'AI attack-setup callback: saves the chosen-panel result and target object, loads duration/scratch
  value from tables, and starts attack 9'
interface: (r0 = panel-choose callback result/index, r5 = current battle object) -> r0 = 9 (attack id
  passed to object_setAttack4); no flags carried
details: Stores r0 into oAIAttackVars_PanelChooseCallback of the AI attack-vars block at r7, then resolves
  the target by reading oAIData_BattleObjectPtr from the object's AIDataPtr and storing it in oAIAttackVars_TargetObjectPtr.
  It calls sub_800FE28 twice with table pointers (dword_8101978, dword_810197C), storing the first result
  as the byte oAIAttackVars_AttackDuration and the second into oAIAttackVars_ScratchVar. It ends by invoking
  object_setAttack4(9), i.e. attack family 4 / id 9, so the duration and scratch value parameterize that
  attack's step logic (the PanelChooseCallback is presumably consulted when the attack executes). Called
  six times from the dispatcher sub_8101CC0, matching the pattern of per-attack-id setup handlers.
