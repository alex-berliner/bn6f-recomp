name: pet_setCurNaviStatAto7
address: '0x08131684'
kind: function
status: probable
summary: Writes 7 into stat byte 0xA of the currently selected PET navi's record at 0x203CCE0
interface: () -> void; no return value used
details: Calls GetCurPETNavi to obtain the id of the navi selected on the PET, then calls SetNaviStats203CCE0Byte
  with r0 = that navi id, r1 = 0xA (field index within the per-navi struct at 0x203CCE0), and r2 = 7 (value
  to store). It is a fixed write of constant 7 to field 0xA; nothing else is touched. The meaning of field
  0xA and of the value 7 is not shown here, and with no known callers its trigger context is unknown.
