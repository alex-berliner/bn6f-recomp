name: CutsceneCmd_wait_cutscene_process
address: '0x08037826'
kind: function
status: confirmed
summary: Polls the running map script each frame and reports whether it has reached its end-of-script opcode, letting
  the cutscene player wait for the script to finish.
interface: 'Next CutsceneCmd_wait_cutscene_process(void); // in: r5 = script context base, r4 = script read-offset
  register pair, r7 = current cutscene command pointer; out: r0 = 1 if script finished else 0, r7 advanced by 2
  on completion, NZC/V reflect the opcode compare and r0'
details: 'Per-frame poll for the "wait for map script to end" cutscene command. Calls ReadMapScriptByte with r6
  = 1, which fetches the byte at the script''s current data pointer ([r5 + r4] -> byte) and advances the script
  read position in r4. If the fetched opcode is 0x11 (end-of-script), the cutscene command pointer in r7 is advanced
  by 2 to skip past this command and r0 = 1 is returned ("done"); otherwise r0 = 0 ("still running") so the cutscene
  engine keeps waiting. Flags on exit come from the CMP against 0x11 and then the NZ set on r0.

  '
