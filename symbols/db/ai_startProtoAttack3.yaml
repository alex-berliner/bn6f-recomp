name: ai_startProtoAttack3
address: '0x080FBF24'
kind: function
status: probable
summary: 'Init step of one of ProtoMan''s RNG-gated AI attacks: loads its version-scaled parameters and
  launches attack id 3.'
interface: (r5 = base value for scratch var, r7 = AI attack-vars struct) -> r0 = result of object_setAttack0;
  no meaningful flags
details: Reads the enemy's difficulty tier into oAIAttackVars_AiDifficultyTier, clears InitFlag, then
  calls ai_loadVersionedAttackParams with attack index 3 to fill the damage field. It installs off_80FC070
  (sub_80FCDDE+1) as the PanelChooseCallback, stores sub_80FBD90's result as AttackDuration and sub_80FBDA4's
  as AttackBoost2, sets ScratchVar to 0x64 + r5, and finally issues object_setAttack0 with attack id 0xd.
  This is a per-attack initializer in the ProtoMan AI state machine, reached only through the four RNG-gated
  attack branches.
