name: ai_attackProcUseChipResult
address: '0x08011CB4'
kind: function
status: probable
summary: 'AI attack-state handler: queries the use-chip state machine and sets charge-ready or difficulty-tier
  flags based on its result code.'
interface: '(r0 unused, forced to 0; r7 = AI attack-vars struct pointer) -> r0 = status code: unchanged
  (0x53/0x54) when charge flag set, otherwise 0x41'
details: Calls useChipRelated_80127C0 with selector 0 and inspects the returned action code. If the code
  is 0x53 or 0x54 it stores 1 into oAIAttackVars_ChargeReadyFlag (marking the AI's charge/buster attack
  as ready) and returns. If the code is 0x40 it stores 0x11 into oAIAttackVars_AiDifficultyTier, then
  falls through to return 0x41; any other code also returns 0x41. The 0x41 return value looks like the
  next AI attack-state/action code handed back to the caller's state machine. r4 is pushed but unused,
  suggesting the function is a boilerplate state-handler stub sharing a common prologue with its siblings.
