name: object_actionSlideForward
address: '0x080D6020'
kind: function
status: probable
summary: Battle-object action handler that slides the object forward (toward the enemy side) a Param1
  number of panels at a fixed velocity, then finishes into CurAction 4.
interface: (r5 = battle object pointer) -> void; moves object X by XVelocity each frame until Timer expires,
  then sets CurAction=4 and clears phase
details: On phase 0 it sets phase=4, gets the facing multiplier from object_getFrontDirection, computes
  a target PanelX = PanelX + 2*dir (so it slides two panels toward the front), and calls sub_80D61D2 with
  that target and a table entry indexed by Param1*4 from byte_80D6088 (all entries 0x00020000); the call
  returns an XVelocity and a frame Timer which are stored. Each later frame it adds XVelocity to X, clears
  the collision region if the current one has flags, recomputes PanelX/PanelY via object_setPanelsFromCoordinates
  and object_updateCollisionPanels, and re-enters collision region 1 whenever the panel actually changed.
  When the Timer counts below zero it sets CurAction=4 and resets CurPhaseAndPhaseInitialized to 0, ending
  the move.
