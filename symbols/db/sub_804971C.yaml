name: sub_804971C
address: '0x0804971C'
kind: function
status: confirmed
summary: Dispatches the chatbox state machine by jumping through a per-state thumb vector table using the chatbox
  state's state byte as the table index.
interface: "void sub_804971C(void);\n  /* in : r5 = chatbox context; r2, r4-r12, lr are passed through to the\n\
  \          selected handler.\n   * out: returns to caller via popped lr; leaves in the guest registers\n     \
  \     whatever the dispatched handler returns in r3, r8-r12 and the\n          c/v flags (r4-r7 are preserved\
  \ by the callee per ABI, nz are\n          clobbered, r0/r1/r2/lr are clobbered). */\n"
details: 'The function is a tiny dispatcher for the chatbox subsystem. r5 is the

  chatbox work area; the byte at offset 1 of that struct holds the current

  state. That state byte is used as a *raw byte offset* into a 16-entry

  jump table at off_8049730, each entry holding a Thumb function pointer

  (stored as +1 to set the CH bit before the `bx r0`). It loads the

  handler''s address from `[off_804972C + state]`, then performs a

  cross-mode jump via `mov lr, pc; bx r0`. The handler is therefore

  entered with r0 holding its own code address and r1 holding the state

  byte, while r2 and r4-r12 flow through unchanged from the caller. On

  return, r4-r7 are preserved by the callee per the EABI and the

  callee''s results (r3, r8-r12 and the c/v flag) are what this function

  leaves in the guest state. The push/pop of {r4-r7,lr} is just a tail-

  call frame: on exit the popped lr returns directly to sub_804971C''s

  caller, so it behaves like a `goto` through the selected handler.

  '
