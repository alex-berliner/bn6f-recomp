name: sub_80170E4
address: '0x080170E4'
kind: function
status: confirmed
summary: Tears down a battle object's active state (clears collision, AI data, chip slot/hand, reapplies sprite
  flip), optionally checks for battle end, and sets the object's phase to 4.
interface: void sub_80170E4(battleObject_t* r5 /* in */);
details: "- r5 points to an oBattleObject (battle object) entry; the routine mutates several\n  fields on it.\n\
  - Calls object_clearCollisionRegion, battle_ClearObjectCollisionResult_801A5E2,\n  and battle_resetCollisionState_80101C4\
  \ to wipe collision tracking for the\n  object this frame.\n- Calls sub_8012EA8 and releaseSlotByValue_801DC36,\
  \ then zeroes\n  oBattleObject_ChipsHeld and writes 0xFFFF (-1) to oBattleObject_Chip, so\n  the object ends up\
  \ with no held chips and no currently selected chip.\n- Reapplies the object's stored flip onto its sprite\n \
  \ (object_getFlip -> sprite_setFlip).\n- Calls battle_clearAIDataAndBarrier_801A7F4 to reset AI state and any\n\
  \  barrier state for the object.\n- If oBattleObject_Param2 is 0, calls relatedToIsBattleOver_800A11C, which\n\
  \  evaluates whether the battle itself is finished. Param2 >= 1 suppresses\n  this check.\n- Calls sub_802EF5C\
  \ (purpose not determined from this routine).\n- Sets oBattleObject_CurPhaseAndPhaseInitialized to 4, transitioning\
  \ the\n  object to phase 4.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
