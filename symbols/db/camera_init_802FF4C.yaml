name: camera_init_802FF4C
address: '0x0802FF4C'
kind: function
status: confirmed
summary: 'Initialize the field camera for a newly entered map: clear its block, set movement limits from the map
  size, snap it to the player''s position, pick the shake setting for the map group, and run the camera update chain.'
interface: '(r0: u32 player_x, r1: u32 player_y, r2: u32 player_z, r3: u32 map_group, r4: u32 map_number, r10: *const
  Toolkit) -> (); preserves r5-r9/r12, leaves nz/c/v clobbered'
details: 'Reads the camera pointer from the Toolkit and zeroes its 0x4C-byte block

  via ZeroFillByWord, after first saving and restoring oCamera_Unk_03 (a

  mode byte) and oCamera_Unk_14 across the fill so live camera state is not

  lost. Derives axis movement limits in 1/4-tile fixed point (<<18) from

  eMapTilesState200be70''s map width/height: x limit = (MapWidth - 0x1E) <<18,

  y limit = (MapHeight - 0x14) <<18, with negated copies stored as

  Unk_18/Unk_24 (minima) and Unk_1c/Unk_20 (maxima). Writes the player''s

  coordinates into oCamera_X/Y/Z and zeroes the Unk_04/Unk_06 scroll

  fields. Picks the shake strength byte stored at oCamera_Unk_02 by map

  group: groups 0xD0/0xE0/0xF0+ get fixed values 0x10/0xC/8; groups 0x80..0xCF

  index off_803378C, lower groups index off_8033770, both arrays of byte

  tables sized REAL_WORLD_NUM_GROUPS and read as u32 then indexed by map_number

  (the disassembly notes the read is byte-sized but every entry yields the

  same value either way). Calls camera_doShakeEffect_80301e8 with the camera

  pointer and the saved r9/r12, then camera_dispatchUpdate_8030054, the

  post-update sub_80302D0, and finally camera_SavePosition_803011A. The

  original ABI manually pushes/pops high registers (r5-r9, r12) on entry

  and pops them back before returning, so callers see them unchanged.

  '
