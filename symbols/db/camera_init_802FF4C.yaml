open_questions:
- What oCamera_Unk_02 actually controls (the "shake strength" label is inferred from the camera_doShakeEffect_80301e8
  name).
- What oCamera_Unk_03 (the mode byte preserved across the zero fill) encodes; the comment hints at a "mode" but
  its semantics are unclear.
- Why oCamera_Unk_14 alone is preserved through the fill rather than the full state.
- Whether the table-read of `LD32(LD32(table + index * 4) + map_number)` is really u32 or byte (the disassembly
  suggests byte-sized pointers but uniform contents make it observable either way).
