name: sub_8047D84
address: '0x08047D84'
kind: function
status: confirmed
summary: Computes the address of the currently-selected battle grid cell from the cursor's column and row in the
  battle state block.
interface: void sub_8047D84(void) -> r0 (cell address); preserves r4-r7; clobbers r1, flags nz/c/v
details: 'Reads the 16-bit column index at "word_2011C24" and row index at "word_2011C28" (both halfwords inside
  the battle state struct at byte_2011C10), sums them, multiplies by 8 (the size of one battle cell entry), and
  adds the base address of the cell data table at byte_2019A00. The returned pointer in r0 therefore points at the
  entry for (column + row) in that table, i.e. the cell currently highlighted by the battle cursor. The trailing
  tables/bytes following the function in the dump belong to surrounding battle data and are not used by this routine.

  '
