name: object_commitPanelMove
address: '0x080F0898'
kind: function
status: probable
summary: Finalizes a battle object's move onto its reserved target panel and returns it to its normal
  state.
interface: (r5 = battle object) -> r0 = 0; no meaningful return
details: 'Clears oBattleObject_CurAnim to 0, calls object_setCollisionRegion with region 1 and keeps the
  returned collision pointer unused. It copies oBattleObject_FuturePanelX/Y into oBattleObject_PanelX/Y,
  calls object_removePanelReserve to release the panel it had reserved, then object_setCoordinatesFromPanels
  to recompute pixel X/Y from the committed grid coords, and finally object_exitAttackState. The r5-based
  access without r0/r1 argument setup implies a fixed ''current object'' register convention (called within
  an object context). Essentially the tail of a move/teleport routine: snap to the reserved panel and
  stop attacking.'
