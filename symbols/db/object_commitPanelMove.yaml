- method: assembly-reading
  date: '2026-10-18'
  detail: strb of 0 to oBattleObject_CurAnim resets animation before the move commit; FuturePanelX/Y copied
    to PanelX/Y then object_removePanelReserve releases the reservation; object_setCoordinatesFromPanels
    immediately after committing panel coords updates pixel position; object_exitAttackState last confirms
    it ends an attack/move sequence
