    mov r7,r0` at :12-15. - Add u16 from tk->Unk2004334_Ptr[0]: `ldr r2,[r10,#oToolkit_Unk2004334_Ptr];
    ldrh r2,[r2]; add r2,r2,r7; mov r7,r2` at :16-19. - Write r7 to navi 0''s MaxHP (0x42) then CurHP
    (0x40): `mov r0,#0; mov r1,#0x42; mov r2,r7; bl SetCurPETNaviStatsHword` and again with r1=0x40 at
    :20-25. - Gate by event flag: `movflag EVENT_PET_NAVI_ACTIVE; bl TestEventFlagFromImmediate; beq locret_803CEB4`
    at :26-28. - When flag set, repeat for GetCurPETNavi(): read its 0x3e and write 0x42 then 0x40 with
    the same r7, but only if non-zero (`cmp r0,#0; beq locret_803CEB4`) at :29-44. - NaviStats struct
    offsets 0x3e/0x40/0x42 are MaxBaseHP/CurHP/MaxHP per NaviStats.inc. - Only confirmed caller is `applyNaviStatsMaybe_813C458`,
    which per its summary "rebuilds and re-applies the equipped NaviCust programs and stock PET navi stats"
    - consistent with re-seeding MaxHP after NaviCust re-evaluation.'
