open_questions:
- Exact meaning of the bonus u16 at tk->Unk2004334_Ptr (it is added to MaxBaseHP before re-seeding both
  MaxHP and CurHP). It might be a NaviCust HP+ bonus or similar; checking what writes that u16 would confirm.
  - The 0x90 value returned in r0 in captured calls does not appear consumed by the only known caller;
  it is likely an artifact of the last SetCurPETNaviStatsHword or related helper rather than a meaningful
  return.
