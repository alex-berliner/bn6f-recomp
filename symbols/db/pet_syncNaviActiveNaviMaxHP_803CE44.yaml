name: pet_syncNaviActiveNaviMaxHP_803CE44
address: '0x0803CE44'
kind: function
previous_names:
- sub_803CE44
status: probable
summary: Syncs the Active Navi's MaxHP (stat 0x42) and CurHP copy into the toolkit's NaviStats entry,
  only when MapGroup < 0x80 and a "PET navi active" event flag is set.
interface: '(no args; uses r10 = Toolkit) -> r0 = 0x90 (unused by caller) ; side effect: writes 0x3e/0x40/0x42
  fields of the current PET Navi''s NaviStats entry'
details: '1. Reads GameState via tk->GameStatePtr; if MapGroup >= 0x80, returns immediately (no battle/overlay).

  2. Reads the current PET navi''s NaviStats field 0x3e (MaxBaseHP) into r7, then adds a u16 at tk->Unk2004334_Ptr
  (the PET''s "active navi" u16) to r7, storing the sum back in r7.

  3. Writes that sum to field 0x42 (MaxHP) and 0x40 (CurHP) of the current PET navi''s NaviStats via SetCurPETNaviStatsHword(navi=0,stat=0x42/0x40,val=r7).
  Both copies are seeded with the same value, so CurHP is forced to MaxHP.

  4. Tests flag EVENT_PET_NAVI_ACTIVE via TestEventFlagFromImmediate; if not set, returns.

  5. Otherwise calls GetCurPETNavi and, if non-zero, does the same write for that navi: read its field
  0x3e into r7, then write r7 to its own fields 0x42 (MaxHP) and 0x40 (CurHP).

  6. In the non-active branch the writes are skipped entirely, so the function is a "no-op except possibly
  one navi''s stats" when the flag is clear.

  7. Field 0x3e is MaxBaseHP and 0x42 is MaxHP per NaviStats.inc; 0x40 is CurHP. The added value from
  tk->Unk2004334_Ptr is therefore a bonus to MaxHP applied to both stock and active PET navis.

  '
