name: RemoveGivenAliveBattleActorFromList
address: '0x080077B4'
kind: function
status: confirmed
summary: Clears every slot in the battle state's 8-entry alive player actor list that points to the given actor.
interface: void RemoveGivenAliveBattleActorFromList(Actor* actor /* r0 */, Toolkit* toolkit /* r10 */); clobbers
  r1-r3, N/Z/C/V flags; preserves nothing else
details: 'Reads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), then scans the 8-pointer
  array at oBattleState_AlivePlayerActors. Each slot that equals the passed actor pointer is written with 0 (i.e.
  the actor is removed from the "alive player actors" list); non-matching slots are left untouched. The loop runs
  exactly 8 iterations regardless of matches, so it removes all duplicates of the actor if it appears in several
  slots. No bounds check on the actor pointer and no early exit once found. Side effects on scratch registers: r1
  ends up one past the end of the list, r2 holds the last slot value read (0 if it matched), r3 = 8, and flags reflect
  `cmp r3, #8` (C set, Z clear) on exit.

  '
