  detail: '- `ldr r1, [r5,#0x10]; add r1, #2; str r1, [r5,#0x10]` — counter at +0x10 is incremented by
    2 (so units are half-pixels or quarter-tiles). - `ldr r3, [r5,#0x14]; lsl r3, r3, #2; cmp r1, r3;
    bge` — cap = +0x14<<2; loop is gated by comparison. - `ldr r4, [r5,#0x18]; add r4, #1; str r4, [r5,#0x18];
    mov r3, #3; and r4, r3` — stride counter at +0x18, masked by 3 to fire every 4 updates. - `mov r0,
    #0x80; bl chatbox_mask_eFlags2009F38; bne loc_8119A76; mov r0, #SOUND_UNK_7E; bl PlaySoundEffect`
    — chatbox flag 0x80 gate then SFX 0x7E. - `mov r0, #0x12; mov r1, #0xd; mov r2, #0; ldr r3, off_8119A9C;
    mov r4, #0xa; mov r5, #2; bl CopyBackgroundTiles` — reuses BG-tile helper to repaint tile block 0
    starting at (0x12, 0xd), 0xa×2 tile window from tile-id table `hword_8119904`. - `ldrb r0, [r5,#0x4];
    tst r0, r0; bne locret_8119A9A` — gate by flag at +0x4. - Final `bl sub_8119AA0` mirrors first call
    but uses (0x12, 0xF) and `r2>>2` as third param, matching the side:cap ratio used elsewhere as a 4-tile
    period. - Caller is `sub_81199C0` (a Beast-SP per-frame pump) and is reached via 0x081199db from the
    beastsp snapshots; the metric name fields ("BeastOutAPwrAtk", "PwrAtkCurChargeTime", "PwrAtkState",
    "PwrAtkButton" in AIData) point at the cross-transform SP-charge meter.'
