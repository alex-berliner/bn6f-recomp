name: battleObject_beastSpAdvanceAndDrawTiles_8119A48
address: '0x08119A48'
kind: function
status: confirmed
summary: Advance the BeastSpirit activation scroll counter, play a tick sound every 4 frames, redraw the scrolling
  text tile block, and conditionally draw a cursor row.
interface: void battleObject_beastSpAdvanceAndDrawTiles_8119A48(u32 obj /*r5*/, u32 bg /*r10*/); // outputs r2 =
  scroll offset, r3 = callee residue; preserves r4-r7,r10
details: "Operates on a BeastSpirit activation display object. Steps:\n1. Increments scroll position at obj+0x10\
  \ by 2.\n2. Computes a scroll cap from obj+0x14 << 2. If the new scroll is still below\n   the cap (signed compare),\
  \ sets r2 to the current scroll and proceeds:\n   - Increments a frame tick counter at obj+0x18.\n   - On every\
  \ 4th tick (low 2 bits of counter == 0), calls\n     chatbox_mask_eFlags2009F38(0x80); if that flag is clear (Z\
  \ set),\n     plays SOUND_UNK_7E.\n3. Regardless of scroll state, redraws a 10-col x 2-row background tile\n \
  \  block via CopyBackgroundTiles(j=0x12, i=0xD, block=0,\n   tile_ids=hword_8119904, j_size=0xA, i_size=2). The\
  \ call is bracketed\n   with push {r2,r5} / pop {r2,r5} so the scroll value and object pointer\n   survive the\
  \ clobber.\n4. Reads a gate byte at obj+4. If nonzero (cursor managed elsewhere),\n   returns leaving r2 = scroll\
  \ value (or 0x28 sentinel when out of range).\n5. If gate byte is zero, draws a single cursor row via\n   copyBgTilesFromTable(j=0x12,\
  \ i=0xF, r2=scroll>>2), advancing the\n   visual cursor in 4-pixel steps.\nFields touched: obj+0x10 (scroll y),\
  \ obj+0x14 (scroll line count),\nobj+0x18 (tick counter), obj+0x04 (cursor-managed gate byte).\nQuirk: the 0x28\
  \ sentinel in r2 when the scroll exceeds the cap is\neffectively an \"off-screen\" indicator; the cursor-row call\
  \ would then\ndraw at position 10 (0x28>>2) which is presumably outside the visible\ntile rows.\n"
