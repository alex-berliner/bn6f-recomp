name: battleObject_beastSpAdvanceAndDrawTiles_8119A48
address: '0x08119A48'
kind: function
previous_names:
- sub_8119A48
status: probable
summary: Per-step Beast SP meter/bar advance that draws/replaces the bar's tile strip and pings SFX 0x7E
  every 4 increments when the chatbox flag is clear.
interface: (r5 = beastSp state ptr, r10 = toolkit) -> side effects only (modifies r5->state, copies BG
  tiles, plays SFX)
details: "Bumps a u16 counter at [r5+0x10] by adding 2 to it. Computes the cap as [r5+0x14] shifted left\n\
  \  by 2. While the counter has not reached the cap, r2 is set to 0x28 (a width in tiles); no further\n\
  \  work is done this tick and we fall through to the tile copy with r2 = 0x28.\n  Once the counter has\
  \ met/exceeded the cap, r2 becomes the carry value (initial [r5+0x10] before\n  bumping, i.e. the post-overflow\
  \ portion). A stride counter at [r5+0x18] is incremented and\n  every time its low 2 bits are 0 (so\
  \ every 4 calls), if chatbox event flag 0x80 (`& eFlags2009F38`)\n  is clear (Z), SFX `SOUND_UNK_7E`\
  \ is played.\n  Then unconditionally `CopyBackgroundTiles(j=0x12, i=0xd, tileBlock32x32=0, tile_ids=hword_8119904,\n\
  \  j_size=0xa, i_size=2)` is called to overwrite the bar's tile strip with r2 as a height param\n  (r2\
  \ is passed via {push r2,r5} so the called function sees a tile-block parameter).\n  Finally if [r5+0x4]\
  \ is 0, `sub_8119AA0(0x12, 0xF, [r5+0x10]>>2)` is called to update a secondary\n  related tile strip;\
  \ otherwise the helper is skipped. The guard at [r5+0x4] likely distinguishes\n  which side of the meter\
  \ is being updated (player vs enemy/peak value state).\n  r5 returned with the post-increment state\
  \ pointer; r2/r3/r10 live-on for the caller per contract.\n  The function is `void` (no return value\
  \ pushed to caller).\n"
