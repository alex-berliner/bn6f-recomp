name: sub_8030DA2
address: '0x08030DA2'
kind: function
status: confirmed
summary: Appends the tile under pixel (r4, r7) to the movement trail recorder at dword_2011D10, skipping duplicates
  and capping at 16 entries.
interface: void sub_8030DA2(s32 x /* r4 */, s32 y /* r7 */); /* r0/r4/r5/r7 preserved, nz/c/v + r8 clobbered */
details: 'Operates on the trail recorder struct at dword_2011D10. Layout: +0x06 u16 last tile index, +0x08 u8 tile
  pitch (low bit dropped before use), +0x09 u8 row bias (halved), +0x0A u8 entry count, +0x14 u32 bytes used, +0x18
  entries[16] of size 0x10 (u16 tile at +0, u32 aligned x at +4, u32 aligned y at +8). Flattens (x,y) to a single
  tile index by shifting each axis right by 3, adding the halved pitch (x) and halved row bias (y), then computing
  row*(pitch & ~1) + column. If the flattened tile matches oTrail_LastTile or the recorder already holds 16 entries,
  the call is a no-op (early return through the loc_8030E02 path that only restores the stack and returns). Otherwise
  writes the new tile to oTrail_LastTile, increments oTrail_Count, bumps oTrail_BytesUsed by 0x10, and fills the
  next entry with the flattened tile, x aligned down to 8, and y aligned down to 8. r8 is used as a temporary to
  round the original x while r7 still holds y (so the rounding uses r4 before it is clobbered), and r0 ends up holding
  7 (the mask used with bic). The function itself is a leaf returning via `mov pc, lr`.'
