name: ai_attackStepTimerHitCMoveResume
address: '0x08108B64'
kind: function
status: probable
summary: 'Per-object AI attack step: when the step timer expires, clear the attack-hold flag, mark the
  object as moving, and set its hit element to 0xC.'
interface: (r7 = object AI vars pointer; no args in r0-r3) -> void; writes StepTimer, sets/clears ObjectFlags1
  bits, sets HitElement
details: Decrements the halfword at oAIAttackVars_StepTimer and returns early while it is still >0. On
  expiry (timer reached 0), it clears ObjectFlags bit 0x40 via object_clearFlag — plausibly an 'attacking/pose
  held' flag — then sets ObjectFlags1 bit (1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) via object_setFlag1,
  so the object resumes movement. It also stores 0xC into oAIAttackVars_HitElement, making the object's
  contact damage use element 0xC from now on. The timer is not reloaded here, so something else (the attack
  setup code) must set StepTimer and the 0x40 flag initially; a caller would confirm which attack uses
  element 12.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh/strh on [r7,#oAIAttackVars_StepTimer] with 'sub r0,#1; bgt' = countdown gate for the whole
    body; bl object_clearFlag with r0=0x40 right after the timer expires; bl object_setFlag1 with r0=(1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)
    sets the moving state; strh r0,#0xC into [r7,#oAIAttackVars_HitElement] assigns the contact element;
    callee names object_clearFlag/object_setFlag1 confirm r7 is a battle object's collision/AI data
