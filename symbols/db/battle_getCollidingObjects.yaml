name: battle_getCollidingObjects
address: '0x0801A4DC'
kind: function
status: probable
summary: Collects the parent object pointers of all collision entries whose flag bit is set in the accumulated
  collision flags, up to a capacity.
interface: (r0 = u32* out array, r1 = capacity in bytes) -> r0 = number of pointers written; flags clobbered
details: Reads the battle object's CollisionDataPtr (oBattleObject_CollisionDataPtr) and its accumulated
  collision flags word (oCollisionData_CollisionFlagsAccumulated), then walks the static eCollisionData
  array in oCollisionData_Size strides. For each bit set in the flags (shifted left one bit per iteration),
  it stores the entry's oCollisionData_ParentObjectPtr into the caller's array, advancing the output pointer.
  The loop stops when the capacity r1 (decremented by 4 per entry, so given in bytes) is exhausted or
  no flag bits remain; the return value is the count of entries written.
