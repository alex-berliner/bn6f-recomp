    source of flags is the object''s collision data; ldr r2,off_801A550 (=eCollisionData) with add r2,#oCollisionData_Size
    loop stride: iterates the collision entry table; ldr r4,[r2,#oCollisionData_ParentObjectPtr]; str
    r4,[r0]; add r0,#4: writes each colliding entry''s owning object pointer to the output array; cmp
    r5,#4 / sub r5,#4 with r5=r1: capacity argument counted in bytes, one pointer per 4 bytes; mov r0,r3
    before pop: returns the count of collected pointers'
