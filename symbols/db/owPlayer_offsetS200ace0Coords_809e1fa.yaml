name: owPlayer_offsetS200ace0Coords_809e1fa
address: '0x0809E1FA'
kind: function
status: confirmed
summary: Adds the caller's X/Y/Z deltas to the overworld player's position fields in eStruct200ace0.
interface: 'void owPlayer_offsetPlayerCoordsByDeltas(int dx, int dy, int dz); // in: r0=dx, r1=dy, r2=dz; out: r3=new
  Z, NZCV from the Z add; r7 preserved'
details: 'Reads the player overworld position from the global struct eStruct200ace0 via a literal-pool pointer,
  then adds r0 to oS200ace0_PlayerX (dword_200ACE8), r1 to oS200ace0_PlayerY (dword_200ACEC), and r2 to oS200ace0_PlayerZ
  (dword_200ACF0), storing each result back. It is a plain coordinate delta, not an absolute set, so callers use
  it to move the player relatively (e.g. walking, scripted nudges). Quirk: r3 ends up holding the new Z value and
  the NZCV flags come from the final add (the Z update), since the routine makes no attempt to hide them; r7 is
  used as the struct-pointer scratch but is saved/restored. No clamping, bounds checks, or collision handling here
  — the caller decides the deltas.

  '
