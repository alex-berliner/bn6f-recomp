name: submenu_runModeHandler_811BD64
address: '0x0811BD64'
kind: function
status: confirmed
summary: Dispatches the current submenu mode's handler, passing the submenu object from the toolkit and the mode
  byte to one of three handlers.
interface: void sub_811BD64(void); reads r5 (menu work area), r10 (toolkit); calls handler at off_811BD7C[byte r5[8]]
  with r0 = handler address, r1 = mode byte, r6 = toolkit->oToolkit_SubmenuPtr; r0/r1/flags returned from the handler;
  r6 preserved
details: 'Menu-state dispatcher for the submenu system. r5 points at the menu work area whose byte at +8

  holds the current submenu mode, used directly as a byte offset (0, 4 or 8) into the handler

  table at off_811BD7C. The table holds three Thumb handler addresses: sub_811BD88 (mode 0),

  sub_811BDCC (mode 4) and sub_811BDF4 (mode 8). r10 is the toolkit; its oToolkit_SubmenuPtr

  field is loaded and passed to the handler in r6, so the handlers operate on the shared submenu

  object pointed to by the toolkit rather than on the work area. The table entry is loaded into

  r0 before bx, so each handler also receives its own address in r0. r6 is only a scratch

  argument register at this level, so it is saved/restored for the caller. r0, r1 and the flags

  are passed straight through from whichever handler runs.

  '
