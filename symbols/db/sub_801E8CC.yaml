name: sub_801E8CC
address: '0x0801E8CC'
kind: function
status: hypothesis
summary: Calls a helper with r4 = 0, then if the caller's value was 0x50 and a flag byte in the r5 struct is set,
  subtracts 0x10 from a counter byte in that struct.
interface: 'void condDecrementByte2By10h(u32 value /*r0*/, State* state /*r5*/); value must already be in r0 and
  the struct pointer in r5 by the caller (Thumb ABI: r5 is callee-saved, so this is an internal helper relying on
  r5 being live). Returns r0 and flags encoding which branch was taken.'
details: "Saves the caller's r0, sets r4 = 0, and calls sub_801E95C (whose result in r0 is\ndiscarded; r0 is restored\
  \ from the saved copy afterwards). Then:\n- if the caller's r0 was not 0x50, nothing else happens;\n- if it was\
  \ 0x50 and the byte at state+0xC is non-zero, the byte at state+2 is\n  decremented by 0x10 (wrapping as a u8)\
  \ and stored back.\nThe function communicates its outcome through both r0 and the NZCV flags, which is\nunusual:\
  \ the caller apparently branches on the flags/r0 left by the final CMP/SUBS.\nFields touched: state+0x2 (u8 counter,\
  \ decremented by 0x10) and state+0xC (u8 flag /\nenable). 0x50 could be a button mask (e.g. Up|Right in the BN\
  \ input bit layout) or a\ncomparison constant supplied by the caller; sub_801E95C with r4 = 0 may be an input\n\
  or state-polling helper, but that is unverified.\n"
