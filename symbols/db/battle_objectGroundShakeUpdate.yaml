name: battle_objectGroundShakeUpdate
address: '0x080BF8DA'
kind: function
status: probable
summary: Phase-update handler for a battle object that shakes the camera, loops a rumble sound effect,
  and periodically calls a helper for ~0x6A frames before advancing the phase.
interface: (r5 = battle object, no args in r0) -> void; on completion writes phase 8 into oBattleObject_CurPhaseAndPhaseInitialized
details: On first entry it resets Timer/Timer2, plays the object's animation index 2 via battle_setObjectAnim,
  triggers a camera shake (magnitude 2, duration 0x6A) via camera_initShakeEffect_80302a8, and sets PhaseInitialized=4.
  While active it plays sound effect 0x12B every time Timer2 wraps (every 16 frames), and at Timer==0/8/16
  calls sub_80BFD02 with r0=0/1/2 and r1=0x5A — three evenly spaced events, likely spawning debris or
  impact effects. After Timer exceeds 0x6A (matching the camera shake duration) the object's phase is
  advanced to 8. r5 holds the battle object pointer per the engine's update-handler convention.
