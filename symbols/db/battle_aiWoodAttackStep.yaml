name: battle_aiWoodAttackStep
address: '0x080F315C'
kind: function
status: probable
summary: 'Per-frame step of an enemy AI attack: arms a wood-element attack, plays its animation, waits
  15 frames, then marks the hit as wood.'
interface: (no args; r7 = oAIAttackVars of acting object, r5 = battle object) -> no return; updates AttackElement,
  CurAnim, StepTimer, HitElement
details: If oAIAttackVars_AttackElement is still 0 (unarmed), it sets it to 4 (wood), switches the object's
  current animation to 0x11, and loads StepTimer with 0xF as the attack's wind-up delay. On later calls
  it simply decrements StepTimer until it expires, at which point it writes 4 into oAIAttackVars_HitElement
  so the pending attack resolves as a wood hit. It is a leaf routine operating purely through the AI attack
  variable struct, so it is meant to be called every frame from a larger attack-state dispatcher.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne shows an init-vs-wait state split on the
    element field; strb r0,#4 into AttackElement and strh #4 into HitElement make wood (element 4) the
    attack/hit type; strh #0xf into StepTimer plus the sub #1/bgt loop is a 15-frame delay before committing
    HitElement; strb #0x11 into [r5,#oBattleObject_CurAnim] selects the attack''s animation on the battle
    object; leaf function (push {lr}/pop {pc}) touching only oAIAttackVars/oBattleObject fields fits a
    per-frame AI attack state'
