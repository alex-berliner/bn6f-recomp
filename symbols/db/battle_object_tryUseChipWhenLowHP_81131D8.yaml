open_questions:
- Why exactly the threshold is "HP ≤ MaxHP/2" rather than some other low-HP trigger — could be a desperation
  chip use, an emergency AI behavior, or an anti-StandStill check; only the caller's full logic or function
  context would settle it. The role of sub_800F322 (post-use cleanup vs. something else) is also unclear
  from this routine alone.
