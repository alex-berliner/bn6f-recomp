name: battle_waitPhaseTimerThenEndPhase
address: '0x080BD960'
kind: function
status: probable
summary: Battle-object phase handler that waits 20 frames, then ends the phase by setting CurAction=8
  and clearing the phase state.
interface: (r5 = battle object; no args in r0-r3) -> void; advances object state when timer expires
details: Uses r5 as the battle object. On first invocation (PhaseInitialized==0) it stores PhaseInitialized=4
  and Timer=0x14 (20 frames) and returns. On subsequent calls it decrements Timer each frame; when it
  reaches zero it sets CurAction=8 and clears CurPhaseAndPhaseInitialized=0, moving the object's state
  machine to the next action/phase. PhaseInitialized value 4 presumably marks this as a timer-wait phase
  type.
