name: sub_80897E8
address: '0x080897E8'
kind: function
previous_names: []
status: hypothesis
summary: On every tick, if the chip-lockout chatbox flag isn't active, advance the chip lockout timer and start
  a white screen fade when it expires, marking the screen state byte at [r5] with 0x24.
interface: '(r5 = pointer to a battle/screen state byte) -> r0 = 1 ; side effects: may write 0x24 to [r5], may call
  SetScreenFade and battle_tickChipLockout_8089CB4'
details: "Entry contract only names r5 and lr as live-ins, with r5 pointing at a small\n  state struct (the captured\
  \ snap files always show r5 was 0x080895c0 at call\n  time, a fixed EWRAM address). The function masks chatbox\
  \ flag 0x80 via\n  chatbox_mask_eFlags2009F38; if that flag is set, jump straight to returning\n  1. Otherwise\
  \ call battle_tickChipLockout_8089CB4 (named callee) which\n  decrements / ticks the chip lockout counter; if\
  \ it returns non-zero (i.e.\n  the lockout just elapsed) call SetScreenFade(4, 0xff) (a white/flash fade\n  with\
  \ no extra arg) and write 0x24 into the byte at [r5]. Either way set r0\n  = 1 and return. r5 is treated as a\
  \ pointer into a state struct whose\n  byte-0 stores a screen/post-fade state value (0x24 written here likely\n\
  \  means \"fade-out in progress\" / \"pre-custom-screen\").\ndetails: |\n  - `mov r0,#0x80 ; bl chatbox_mask_eFlags2009F38\
  \ ; bne loc_8089804` checks\n    flag bit 0x80 in the chatbox event-flag word; if set we skip the whole\n    tick.\n\
  \  - `bl battle_tickChipLockout_8089CB4 ; beq loc_8089804` only runs the\n    fade-out branch when the timer helper\
  \ returns NZ (i.e. just expired).\n  - `mov r0,#4 ; mov r1,#0xff ; bl SetScreenFade` requests a screen-fade\n\
  \    with parameters 4 / 0xFF (palette flash).\n  - `mov r0,#0x24 ; strb r0,[r5]` records the new screen state\
  \ 0x24 into\n    the byte at *r5 (the caller's screen-state struct).\n  - Always returns r0=1 (truthy \"still\
  \ alive\" return for the caller).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Callees include battle_tickChipLockout_8089CB4 (its name in this project is literally "battle_tickChipLockout_*"),
    confirming this function reacts to the chip-lockout timer. - chatbox_mask_eFlags2009F38 is called with mask
    0x80 (`mov r0,#0x80`), matching the project description of that helper. - SetScreenFade(4, 0xff) is invoked
    only on the lockout-expiry branch (`beq loc_8089804` skips it otherwise). - The byte written, 0x24, is an immediate;
    combined with the `strb r0,[r5]` it is the post-fade state marker; given the surrounding context it is almost
    certainly the screen-state byte for the chip-select / custom screen transition. - The fact that every captured
    call shows the same r1/r2/r3/r5 values and'
