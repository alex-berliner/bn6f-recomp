name: chatbox_setState4IfFlag80Clear_8027320
address: '0x08027320'
kind: function
status: confirmed
summary: If chatbox event flag 0x80 (eFlags2009F38) is clear, sets a chatbox state/halfword field to 4.
interface: 'int sub_8027320(uint16_t *stateField /* r5: struct with u16 field at +2 */, int r1 /* unused */, void
  *lr /* return */); /* returns r0 = flag-test result, sets nz/c/v from the cmp/move */'
details: 'Tiny conditional-state setter in the chatbox subsystem. It calls

  chatbox_mask_eFlags2009F38 with r0 = 0x80 to test bit 0x80 of the chatbox

  event-flags word at 0x2009F38. If the flag test returns nonzero (bit set),

  the function returns immediately without touching anything. If the flag is

  clear, it stores the halfword value 4 to [r5+2], which by layout is a

  16-bit state/phase/timer field of the object or chatbox context pointed to

  by r5 (state value 4 likely means "advance to next chatbox phase").

  r1 is listed as an input in the caller contract but is never read; it is

  preserved. r0 on return is the flag-test result (or 4 if the store path

  was taken), and NZ/C/V reflect the last cmp/move, matching the original.

  The _ADDRESS-style tail-call helper name suggests the flags word is

  accessed through a mask-and-test helper rather than directly.

  '
