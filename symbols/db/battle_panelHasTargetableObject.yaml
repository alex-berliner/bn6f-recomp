name: battle_panelHasTargetableObject
address: '0x080DC9F0'
kind: function
status: probable
summary: Returns 1 only if a panel of one of two specific status types at (x,y) carries an object of the
  opposite panel-side key whose collision flags lack bits 1-2.
interface: (r0 = tile x, r1 = tile y) -> r0 = 1 if qualifying object present on qualifying panel, else
  0; r5 clobbers panel struct from callee
details: 'object_getPanelParameters returns the panel''s status flags in r0 and (apparently) the panel
  struct in r5. The byte at panel+0x16 (0 or 1) indexes the word table byte_80DCA30 as a required-flag
  mask (0x05800000 or 0x0A800000); if panel flags don''t intersect it the function returns 0. It then
  XORs that byte with 1 and calls sub_800AE54 with (x, y, flippedByte, 1), i.e. it searches an object
  pointer list for an entry whose key bytes 0x12/0x13 match the coords with the opposite side/plane byte.
  If no object is found it returns 0; if object_getFlag on it yields any of bits 1 or 2 it returns 0;
  otherwise it returns 1. So the ''positive'' case is: special panel type + present object of the complementary
  key that is not flagged with bits 1|2.'
