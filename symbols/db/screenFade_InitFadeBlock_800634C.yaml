name: screenFade_InitFadeBlock_800634C
address: '0x0800634C'
kind: function
status: confirmed
summary: Initializes one entry of the eScreenFade array, resetting its step, frame counter, direction, and pending
  flag while setting the fade's step count from the selector's high nibble.
interface: void screenFade_InitFadeBlock(u32 blockOffset /* r0 = block index * 0x10 */); returns r2 = blockOffset
  >> 4 (step count), r0 = 0; reads no flags, clobbers flags and r0, preserves r5
details: 'Takes r0 as a byte offset into eScreenFade (callers pass fade index * 0x10) and reinitializes

  that 16-byte fade state block: stores r0>>4 (the fade''s total step count) into offset 0xC

  (speed/steps field), then clears offset 0 (current step), offset 2 (fade direction/state),

  offset 3 (frame counter), and offset 0xD (pending/repeat flag). This effectively restarts a

  fade from its beginning — callers invoke it to (re)arm a screen fade before it runs. Note the

  odd calling convention: r5 is both an input (must hold the eScreenFade base or is expected to

  survive) and an output; the function itself overwrites r5 with the block pointer but restores

  it via pop {r5,pc}, and leaves r2 = r0>>4 live for the caller.

  '
