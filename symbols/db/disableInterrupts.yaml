name: disableInterrupts
address: '0x03005E6A'
kind: function
status: probable
summary: Clears REG_IME, globally disabling interrupts.
interface: () -> r0 = clobbered (not meaningful); REG_IME = 0
details: Stores 0 as a halfword to the Interrupt Master Enable register (0x04000208) and returns immediately,
  with no other side effects. It lives in IWRAM (0x03005Exx), alongside IWRAM-resident SIO code (libSIO814469C,
  sio_linkStateUpdate), suggesting it is placed in fast/copyable memory for use during timing-sensitive
  or reset-critical sequences. Its only known caller is the early startup routine start_80002A8. Being
  a leaf with no callee, its purpose rests entirely on the single store.
