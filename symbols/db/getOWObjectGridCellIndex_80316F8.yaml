summary: Turn an overworld object's position into a cell index of the layer-region grid.
interface: (r0 = object coords, r5 = grid header (Ex2011a20)) -> [r5+8] = (unk06 & ~1) * (y/8 + unk07/2) + x/8 +
  unk06/2; [r5+0xC] = x & ~7, [r5+0x10] = y & ~7; r1 = the index, r3 = 7
details: x and y are the high halves of the object's 16.16 coordinates (ldrsh at +2/+6). unk06/unk07 look like the
  grid's width/height in tiles (0xFE seen).
