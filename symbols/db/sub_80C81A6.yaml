summary: Spawns a battle projectile (type 0x1F) at the given panel, inheriting element, damage counter and alliance/flip
  from the source object.
interface: void battleSpawnProjectile_80C81A6(u8 panelX /* r0 */, u8 panelY /* r1 */, u8 element /* r2 */, struct
  BattleObject* spawned /* r5 out */, struct BattleObject* source /* r5 in */, u32 damageCounter /* r6 */);  clobbers
  r0,r2,r3,lr; preserves r4,r6,r7; NZCV clobbered; r1 returns 0x10 on success else original r0
details: 'Calls object_spawnType3 with spawn type 0x1F. On success, writes panelX/panelY/element/damageCounter into
  the new battle object''s PanelX, PanelY, Element, and DamageAndStaminaDamageCounterDisabler fields, copies the
  AllianceAndDirectionFlip halfword from the source object, and ORs 0x10 into oObjectHeader_Flags (object active
  / initialized). The return address is stored via pop {pc}, so this is a tail-call-style leaf wrapping object_spawnType3.
  Spawn type 0x1F in MMBN battlefields corresponds to projectiles/effects spawned by attacks.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
