  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the described structure: RNG & 0xF, branch on >=6, sets AI difficulty tier, boost,
    cycles, init flag, calls sub_80F2DDC, stores duration, finds opposing player, sets target, and ends
    by clearing TurnCounter and ScriptId on r6. The callee list confirms sub_80F2D08 and sub_80F2D2C are
    used. However, the summary overstates: sub_80F2DDC is called with arg 1 in the <6 path and arg 2 in
    the >=6 path (matching sub_80F2DDC(1)/sub_80F2DDC(2)), but the route probability is 10/16 vs 6/16
    since >=6 means values 6..15 (10 outcomes) and <6 means 0..5 (6 outcomes), not 7/16 vs 9/16. Also
    note the off_80F2ECC loads sub_80F3784+1 (thumb+1), not sub_80F3784 directly, so calling it a PanelChooseCallback
    storage is slightly off. Name is fine; better summary needed.; run wf investigate investigate-20261018-155607;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
