name: ai_initAttackSelection
address: '0x080F2BEE'
kind: function
status: probable
summary: 'AI routine that rolls RNG & 0xF and branches: if >=6 selects attack 0xC, else selects attack
  0xB (probability 10/16 vs 6/16); both paths store AI difficulty tier, attack boost, cycle count, init
  flag, call sub_80F2DDC(1 or 2), set duration, resolve opposing player via battle_findPlayer as target,
  and call object_setAttack0; the 0xC path additionally stores a panel-callback (sub_80F3784+1) and r5+0x6C
  in scratch fields, then clears AIState TurnCounter and ScriptId.'
interface: (r0 = rng? unused, r5 = BattleObject*, r6 = AIState*, r7 = AIAttackVars*) -> r0 = 0; sets AIState_TurnCounter=0,
  ScriptId=0
details: 'Rolls the global RNG (value & 0xF) and branches: if >= 6 it prepares attack 0xB (calling sub_80F2D64/sub_80F2D50/sub_80F2D08
  for boost, cycle count, and duration, plus sub_80F2DDC(1)); otherwise it prepares attack 0xC (sub_80F2D88/sub_80F2DAC/sub_80F2D2C,
  sub_80F2DDC(2)) and additionally stores sub_80F3784 as a PanelChooseCallback and an object+0x6C pointer
  in ScratchVar. Both paths store the AI difficulty tier (from battle_getAiDifficultyTier_800FE36), set
  InitFlag=1, resolve the opposing side''s player object via battle_findPlayer(Alliance ^ 1) into TargetObjectPtr,
  and finally select the attack with object_setAttack0(0xB or 0xC). It ends by clearing oAIState_TurnCounter
  and oAIState_ScriptId on the AI state struct, resetting the AI''s turn/script state for the chosen attack.
  This looks like a boss/enemy per-turn attack-choice initializer whose probability is 7/16 vs 9/16.'
