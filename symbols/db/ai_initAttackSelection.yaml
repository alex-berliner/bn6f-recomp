  date: '2026-10-18'
  detail: 'bl GetPositiveSignedRNG; and r0,#0xf; cmp r0,#6; bge loc_80F2C32 — random pick between two
    branches; both branches: bl object_setAttack0 with r0=0xB or r0=0xC — selects which attack the enemy
    uses; str r0,[r7,#oAIAttackVars_TargetObjectPtr] after bl battle_findPlayer with Alliance^1 — targets
    the opposing player; strb r0,[r7,#oAIAttackVars_InitFlag] and strh r0,[r7,#oAIAttackVars_AttackDuration]
    — initializes AI attack-vars fields; tail: strb r0=0,[r6,#oAIState_TurnCounter]; strb r1=0,[r6,#oAIState_ScriptId]
    — resets AI turn/script state'
