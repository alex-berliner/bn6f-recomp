name: sub_812977C
address: '0x0812977C'
kind: function
status: confirmed
summary: 'Commit/reset the 3-slot unk_20251A0 array: if any slot has a pending entry, return early; otherwise clear
  every slot''s pending flag, set the caller''s state byte to 8, call sub_812B3FC, and clear bit 0 of the caller''s
  flag byte at +0x1b.'
interface: void sub_812977C(void /* via r5 = caller struct, r10 = caller struct */);
details: 'Operates on `unk_20251A0`, a 3-entry (0xC bytes) array of 32-bit slot pointers.

  Each slot pointer has its flag bit (bit 31) AND-ed out before use; the "type"

  byte at `slot+7` indicates an in-use entry. First loop scans the 3 slots

  looking for an in-use entry; if one is found, returns immediately with r4 =

  unk_20251A0, r6 = the breaking slot index in bytes, r5 unchanged. Otherwise

  a second loop clears bit 31 of all three slot entries. Then writes the literal

  8 to byte 3 of the caller''s struct (via r5), calls `sub_812B3FC`, and

  clears bit 0 of byte 0x1B of the caller''s struct. r10 is listed as input by

  the lifter but not actually referenced in this function body (likely a

  caller-saved value passing through).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
