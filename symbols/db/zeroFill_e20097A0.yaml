name: zeroFill_e20097A0
address: '0x08002368'
kind: function
status: confirmed
summary: Zero-fills the fixed 0x108-byte palette buffer at ePalette20097a0 by word writes.
interface: 'void zeroFill_e20097A0(void); // in: r2 r3 lr (lr only for return); out: flags c v as left by ZeroFillByWord;
  r2 r3 preserved, r0 r1 and nz clobbered'
details: 'No-argument helper that loads the address of the ePalette20097a0 buffer (label A_ePalette20097a0_0_Unk_00)
  into r0 and the constant size 0x108 into r1, then tail-calls ZeroFillByWord to clear the region one word (4 bytes)
  at a time — 66 words total, so 66 palette entries'' worth of color data. There is no other logic: no arguments
  are accepted, r2/r3 are untouched, and the returned condition codes are simply whatever ZeroFillByWord leaves
  in nzcv. The caller''s lr is popped straight into pc, so the call to ZeroFillByWord is not a tail call in the
  strict sense (push {lr} / pop {pc} framing) but behaves as one. The 0x108 size is stored as a literal pool word
  at off_8002374 rather than a mov-immediate.'
