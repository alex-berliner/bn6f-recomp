name: object_updateMovementAngle
address: '0x080A8A7C'
kind: function
status: probable
summary: Applies a fixed-distance movement step along the angle of an object and decrements its remaining
  movement steps.
interface: (implicit object pointer in r5) -> void
details: Reads the object's angle at offset 4 and movement speed at offset 5, using math_sinTable and
  math_cosTable to calculate horizontal and vertical displacement. Adds the displacement to the position
  fields at offsets 0xC and 0x10, then decrements the signed step counter at offset 6 once its value is
  positive. The function is called four times in succession by sub_80A89FC, indicating repeated movement
  updates during initialization or scripted motion.
