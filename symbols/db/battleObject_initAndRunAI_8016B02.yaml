open_questions:
- The exact semantics of Unk_5c and what writes to it (which AI handler stages the transition) are
- not visible in this function. Tracing the dispatcher to find which sub-AI writes 0x5c would settle it.
- Whether OBJECT_FLAGS_INVULNERABLE is intentionally cleared on every actor each frame (or whether
- a different object header bit is meant) cannot be confirmed without seeing what the AI handler
- expects.
