open_questions:
- The exact semantics of AIData offset 0x44 (whether it is truly an "input locked" gate or a different
  mode flag); could be settled by checking the only writer of that byte.
- Whether the value at [r5,#0xD] (saved prior state) is itself used as the previous submenu state by other
  helpers; the swap pattern suggests yes but no other code is visible from this function.
- Caller-side meaning of the constant 0xC as a submenu state value; the three callers all use the same
  byte, so the meaning is consistent, but its exact name ("confirm-screen-open" vs "Beast-Out cancel"
  vs "folder-edit confirm") is unknown.
