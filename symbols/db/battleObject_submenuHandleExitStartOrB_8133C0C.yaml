status: probable
summary: Handles START/B input to confirm or cancel a submenu/folder-edit screen; flips a state byte and
  resets Anger-like halfword to 0.
interface: (r5 = AIData-like struct, r10 = toolkit) -> void ; side effects may write r0 for sound ID,
  may call IsButtonPressed and PlaySoundEffect
details: '- Pushes lr, reads JOYPAD_START via IsButtonPressed; if newly pressed, jumps to the exit-handling
  path.

  - Otherwise loads byte [r5,#3]; if it equals 0xC (the "open" submenu state), additionally checks JOYPAD_B
  via IsButtonPressed and exits the function on either START or (in state 0xC) a fresh B press.

  - On exit (loc_8133C24): checks byte [r5,#0x44] (likely a "input locked" flag); if non-zero, returns.

  - When in state 0xC ([r5,#3] == 0xC, the open-confirm branch): copies [r5,#0xD] back into [r5,#3] (restores
  the prior state, "cancel") and plays SOUND_EXIT_SUBMENU.

  - Otherwise (entering state 0xC from another state): stores current [r5,#3] into [r5,#0xD] (saves previous
  state), sets [r5,#3] = 0xC, zeroes the 16-bit at [r5,#0x34] (the Anger halfword per AIData), and plays
  SOUND_MENU_SELECT.

  - All three r5 offsets used (0x3, 0xD, 0x34, 0x44) line up exactly with AIData fields (Unk_03 / Unk_0d
  / Anger / Unk_44) when the AIData struct is laid out at offset 0 from r5.

  - The trailing `mov r0, #0; tst r0, r0` is a vestigial clear-Z pattern that ensures Z is set on the
  fall-through `loc_8133C52` path (matches the captured-call exit flags `-Z--`).

  - All callers (folderEdit_step_813388C, battleObject_runSubmenuInputHandler_81337E8, battleObject_submenuLoopStep_8133944)
  treat r5 as an AIData-like blob and route "exit" input through this helper, which fits its role as the
  shared cancel/confirm dispatcher.

  '
