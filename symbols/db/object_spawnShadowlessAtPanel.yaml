name: object_spawnShadowlessAtPanel
address: '0x080DCE5C'
kind: function
status: probable
summary: 'Initializes a battle object at its panel position: loads sprite resource 0x80/8/0x15, no shadow,
  animation 0x2A, palette 0, applies facing, and enters the update state.'
interface: (r5 = object pointer, implicit) -> r0 = CUR_STATE_UPDATE; initializes the object's sprite,
  position, flags and state
details: Recomputes the object's pixel X/Y from its panel coordinates and zeroes its Z (height), placing
  it flat on the field. It loads sprite (0x80, 8, 0x15) via sprite_load, then marks the sprite attribute
  flags so no shadow is drawn. It ORs bit 1 (0x2) into oObjectHeader_Flags, sets CurAnim and its copy
  to 0x2A, and runs sprite_setAnimation plus sprite_loadAnimationData. It sets palette 0 and mirrors the
  object's effective flip (alliance XOR DirectionFlip) into the sprite. Finally it stores CUR_STATE_UPDATE
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, handing the object to its per-frame update
  logic.
