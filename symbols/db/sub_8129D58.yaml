summary: 'Chip-use object idle step: if a busy-check flag is clear, reset the object into its initial chip-use state.'
interface: void sub_8129D58(u16/*unused*/ unused, u32* obj /* r5 */);
details: "Reads obj->field_0x20 and forwards it to sub_812B318, which appears to\nreturn a \"still busy?\" flag.\
  \ When that returns 0 the object is fully\nre-initialised:\n  obj[0x02]   = 8\n  obj[0x03]   = 0\n  obj[0x1D]\
  \   = 3   (timer mode / state phase)\n  obj[0x13]   = 0   (counter / wait fields cleared)\nThe contiguous 0x02/0x03\
  \ pair (8 then 0) and the clearing of 0x13 and\nmode 3 at 0x1D match the boilerplate used elsewhere in the chip-use\
  \ /\nbattle-object machinery for \"kick the object back to its initial\nframe\". r4, r5, r6 are preserved; only\
  \ r5 is an input (the object\npointer; the r5 in the return list of the lifter is the same\nregister kept across\
  \ the body).\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C\
  \ allowed; tools/abi/retype_queue.tsv)."
