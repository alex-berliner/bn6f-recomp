name: battle_countAdjacentPanelsOfOtherAlliance_800D5F0
address: '0x0800D5F0'
kind: function
status: confirmed
summary: Counts how many of the three panels adjacent to a given panel position hold objects belonging to a different
  alliance (side) than the given one.
interface: int battle_countAdjacentPanelsOfOtherAlliance_800D5F0(u32 position, u32 alliance); // r0 = panel position,
  r1 = alliance id; returns count in r0; r1 returns holding the last panel's Alliance byte, r2/r3 clobbered by the
  callee; sets c/v from the final adds
details: 'Battles helper. For the panel at the given position, it iterates the three

  neighbouring panel slots (1..3) and calls object_getPanelDataOffset(position, slot)

  to fetch each neighbour''s panel data. For every neighbour that exists, it reads the

  Alliance byte at offset oPanelData_Alliance (offset 3 in the panel data struct) and,

  if it differs from the alliance id passed in r1, increments the counter. Returns the

  number of adjacent panels occupied/claimed by the opposing side. r4 = alliance id and

  r5 = count are callee-saved (r4-r7 preserved); r6 = position, r7 = slot loop counter

  (1..3, signed ble comparison). Quirk: r1 on return holds the last non-null neighbour''s

  alliance byte rather than the input alliance; the final mov r0,r5 encodes as

  adds r0, count, #0, so c and v are also set as a side effect. Likely used for

  ally/enemy panel-adjacency checks (e.g. panel-steal, obstacle, or placement rules).

  '
