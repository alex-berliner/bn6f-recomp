open_questions:
- Exact semantics of the 7 columns (the row-major layout maps to beast × "affinity" axis but the column
  meaning is inferred from the caller's pattern of (r1,r2) — r2 multiplies by 7 which suggests it's the
  row index, not column as I wrote above). Reading of `mul r2, r0; add r2, r2, r1` actually means `idx
  = r1 + r2*7`, so r2 is the row and r1 is the column. The naming above should treat r2 as beast idx and
  r1 as the selector. (See details.)
