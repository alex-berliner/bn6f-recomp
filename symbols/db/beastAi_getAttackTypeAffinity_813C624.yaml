status: probable
summary: Looks up a Beast-SP AI affinity/availability byte from a packed 7-byte-per-row table indexed
  by beast index and selector.
interface: '(r0 = beastIndex/row, r1 = colSelector, r2 = colSelector2) -> r0 = byte at byte_813C640[beastIndex*7
  + colSelector] ; side effects: preserves r0..r2 via push/pop'
details: "Prologue pushes {r0,r2,lr}; r2 is multiplied by 7 then added to r1 to form a byte offset into\n\
  \  `byte_813C640` at 0x0813C640 (a 7-byte-per-row table; the second row r0=3 begins at offset 7).\n\
  \  The lookup is a single `ldrb r1, [r0, r2]` against that table base, with r1 returned.\n  r0 is restored\
  \ from the stack and returned, leaving the contract \"returns the byte read into r1\n  plus the original\
  \ r0 echoed back\". The captured calls show varied row/col inputs (r0=1..3,\n  r1=1..3) and matching\
  \ byte values returned in r0 (e.g. r0=1 returns 0xFF, r0=2 returns 0xFF,\n  r0=3 returns 0xFF — all\
  \ FFs which correspond to the table bytes shown).\n  This is consumed by the BeastSP AI helper sub_813BD90\
  \ (caller lr = 0x0813be09) which is the\n  \"beast-out SP decision\" routine, picking which special\
  \ the controlled partner beast should use.\n  No memory pointers are in/out of r0/r1 in captured calls;\
  \ the function is read-only.\n"
