name: event_raiseFlag8000AndDispatch_801CEFA
address: '0x0801CEFA'
kind: function
status: confirmed
summary: Raises the event/scene flag 0x8000 via sub_801BED6 and then hands the same flag to dispatcher sub_801DACC
  so the pending event or transition takes effect.
interface: void sub_801CEFA(void) // no incoming registers; returns via pop {pc}, r0-r3 and flags end up clobbered
  by the calls
details: 'Trivial two-call thunk. It loads r0 = 1 << 15 (i.e. the value 0x8000) and passes it to

  sub_801BED6, then reloads the same constant and passes it to dispatch_801DACC (whose

  contract is (a0: flags32) -> ()). The pattern "set flag, then dispatch" matches the

  engine''s event/scene-trigger idiom: sub_801BED6 records/asserts flag bit 0x8000 and

  sub_801DACC processes the resulting pending event or transition for this frame.

  No state is read other than the constant; the function preserves nothing itself and

  relies on the callees'' own register discipline (r5-r7 survive via the callees).

  The 0x8000 value is a single-bit mask, so it likely toggles one specific game-progress

  or scene-state bit; which bit that is in game terms is not determinable from this

  function alone.

  '
