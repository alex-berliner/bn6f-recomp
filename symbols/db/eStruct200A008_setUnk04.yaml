name: eStruct200A008_setUnk04
address: '0x0800B6CE'
kind: function
status: confirmed
summary: Setter that stores a caller-supplied 16-bit value into offset +4 of the overworld player-adjacent struct
  at 0x200A008.
interface: void eStruct200A008_setUnk04(u16 value /* r0 */)
details: 'Tiny Thumb setter. It loads the fixed struct base (the symbol eOWPlayerObjectEnd, i.e. the address right
  after the overworld player object''s sprite data, 0x200A008) and does STRH of r0 at base+4, which is word_200A00C
  (0x200A00C). No other state, registers or flags are touched; it returns immediately via mov pc, lr. Judging by
  the naming pattern (eStruct200A008_setUnk04), this is one of a family of generated accessors for fields of this
  overworld struct, with the field''s purpose still unknown. The value written is whatever callers pass in r0; the
  contract shows no callers reading anything back, so it behaves as a pure write.

  '
