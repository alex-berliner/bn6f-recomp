name: ai_spawnAttackShot
address: '0x08103A08'
kind: function
status: probable
summary: 'Wrapper that fires one AI enemy shot: packs the shot kind and difficulty tier and forwards panel
  position, damage, and target to the common attack-spawn routine.'
interface: (r0 = shot/attack kind byte) -> spawns attack object via 0x080CED58; returns callee's result
details: r0 is shifted left 8 and ORed with the attacker's AI difficulty tier byte, producing a 16-bit
  packed parameter (kind in the high byte, difficulty tier in the low byte) passed as r3. It then loads
  the attacker's panel X/Y from the battle object at r5, an init/variant flag and the shot damage from
  the AI attack-vars struct at r7, plus the target object pointer, and calls sub_80CED58 with all six
  arguments. The single caller (ai_stepMultiShotAttack) invokes it per shot while counting down its shot
  budget, so this is the per-shot spawn step of a repeated AI attack. All the real work happens in the
  shared callee; this function is only argument assembly from the object and AI state structures.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: lsl r0,#8 + orr with oAIAttackVars_AiDifficultyTier packs kind<<8|tier as one 16-bit argument;
    ldrb r0/[r5,#oBattleObject_PanelX], ldrb r1/[r5,#oBattleObject_PanelY] pass the attacker's panel coords;
    ldr r6 [r7,#oAIAttackVars_Damage] and ldr r7 [r7,#oAIAttackVars_TargetObjectPtr] pass damage and target;
    sole caller ai_stepMultiShotAttack calls this between shots while decrementing a shot budget
