name: battle_spawnPanelAttackObject
address: '0x080CF778'
kind: function
status: probable
summary: Spawns battle object type 0x57, initializes it with panel coordinates, element, damage and alliance
  from the caller, and hands its pointer back through a caller-supplied variable.
interface: (r0 = panelX, r1 = panelY, r2 = element, r3/r5/r6/r7 = extra args incl. parent object in r5,
  damage in r6, out-ptr in r7) -> r0 = new object ptr or 0 on failure; flags unchanged
details: 'Wrapper around object_spawnType3: it sets r0=0x57 as the object type and passes the caller''s
  r1-r3 through as the remaining spawn arguments. The push/pop dance preserves the caller''s r0-r2 across
  the call, and on success they are stored into the new object as PanelX, PanelY and Element. The parent
  object passed in r5 donates its AllianceAndDirectionFlip word and is recorded in RelatedObject1Ptr;
  r6 is written to the DamageAndStaminaDamageCounterDisabler field. r7 must point to a word: it is stored
  in ExtraVars and the new object''s pointer is written back through it, cross-linking caller and object.
  Finally oObjectHeader_Flags gets bit 0x10 ORed in. On spawn failure r0=0 and nothing is written.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_spawnType3 with r0=0x57 selects battle object type 0x57; pop {r1-r3,r5} recovers saved
    r0-r2 which are stored to PanelX/PanelY/Element; ldrh from [r5,#oBattleObject_AllianceAndDirectionFlip]
    and str r5,[r0,#RelatedObject1Ptr] link the new object to the parent in r5; str r0,[r7] plus str r7,[r0,#ExtraVars]
    cross-link the caller's variable with the new object; orr of 0x10 into oObjectHeader_Flags marks the
    freshly spawned object
