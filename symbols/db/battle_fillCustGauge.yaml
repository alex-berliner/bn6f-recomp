name: battle_fillCustGauge
address: '0x0800AF34'
kind: function
status: probable
summary: 'Adds to the custom gauge each tick: normally 0x4000 via SetCustGauge, or an alliance-scaled
  amount when battle flag 0x40 is set'
interface: (r5 = battle object) -> r0 = gauge result path; calls SetCustGauge(0x4000) or sub_802E032(alliance,
  0x1555)
details: Reads battle flag 0x40 via battle_testFlag0x40_800A8F8. If the flag is clear, it calls SetCustGauge
  with 0x4000, the standard per-turn/period custom-gauge increment. If the flag is set, it instead calls
  sub_802E032 with the battle object's Alliance field (r5+oBattleObject_Alliance) and constant 0x1555
  (5461, ~1/12 of 0x10000), suggesting a fractional fixed-point gauge fill rate. The r5 use implies this
  runs inside an object context with a battle object pointer in r5, likely the per-frame battle update.
  The two paths presumably implement a modified gauge-speed rule (e.g., a NaviCust part or debuff) selected
  by flag 0x40.
