name: submenu_updateCursorAndTiles
address: '0x0812D748'
kind: function
status: probable
summary: 'Per-frame handler for an 8-entry menu: moves the cursor up/down with the d-pad (unless some
  state forbids it) and refreshes a background tile patch each frame.'
interface: () -> void; r7 = menu state pointer (callee-returned), cursor index stored at [state+0x34]
details: Calls sub_812D6F8 to fetch a state/context struct into r7. sub_812D700 returns a flag that skips
  all input handling when set; otherwise sub_812D7A4 is checked the same way. When input is allowed, the
  low-sensitivity held-keys word from the toolkit joypad struct (r10 -> oToolkit_JoypadPtr, oJoypad_LowSensitivityHeld)
  is fed to menu_moveCursorUpDown_811FA22 with entry count 7 (r1), step 1 (r2) and the current value of
  [r7+0x34], and the returned index is written back to [r7+0x34] — an 8-entry vertical list cursor with
  wrap/clamp and cursor sound handled inside the callee. Unconditionally afterwards, copyBgTilesToBlock0
  blits a fixed 8x17 tile patch from RAM buffer unk_20227A0 into BG block 0 at (i=2, j=0x15) — likely
  the cursor/highlight artwork — and sub_812D668 runs, presumably redrawing or advancing that screen.
  The unconditional tile blit even on frames where input is disabled suggests the patch shows a state
  that must be kept on screen.
