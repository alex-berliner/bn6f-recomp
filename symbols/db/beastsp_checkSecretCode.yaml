name: beastsp_checkSecretCode
address: '0x0813C334'
kind: function
status: probable
summary: Checks the player's button presses against a 10-input secret code for the selected entry, and
  toggles 4 event flags when the full code is entered.
interface: (r0 = entry selector (row id << 2), r1 = current input position 0-9) -> r0 = updated input
  position (0 = reset/wrong, 10 = code completed); plays OK sound and toggles flags on completion
details: 'On any newly pressed button (oToolkit_JoypadPtr -> oJoypad_Pressed), it looks up byte_813B522[(r0>>2)*10
  + r1] and maps that byte through byte_813C3A4 (0=L, 2=R, 4=A, 6=B) to an expected joypad mask. A mismatch
  or a 0xFF terminator resets the position to 0; a match advances it. When the position reaches 10, the
  code is complete: it reads flag base 0x2660 + (r0 & ~3) and uses SetEventFlagRange/ClearEventFlagRange
  with length 4 to toggle that entry''s block of 4 flags, then plays SOUND_OK_8B. r7 is used as a combined
  table/flag selector (r7>>2 = table row, r7&~3 = flag block offset), implying the caller passes an entry
  id pre-shifted by 2. The function returns the new position so the caller can persist it between frames.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: byte_813C3A4 holds JOYPAD_L/R/A/B masks compared against oJoypad_Pressed (ldrh r3,[r1,r2]; tst
    r0,r3); code table byte_813B522 is indexed by (r7>>2)*10 + r6, i.e. 10 button slots per entry; cmp
    r6,#0xa / beq path calls TestEventFlag then SetEventFlagRange or ClearEventFlagRange with base 0x2660+(r7&~3)
    and r2=4; mov r0,#SOUND_OK_8B; bl PlaySoundEffect fires only after the 10th correct press; mismatch
    and 0xFF terminator both do mov r6,#0, restarting the sequence
