name: battle_applyBlindStatus
address: '0x08013ED6'
kind: function
status: probable
summary: 'Applies the Blind status to a battle object: sets its blind timer to 5 seconds and flags it
  in collision flags2.'
interface: (r0 unused?, r5 = battle object pointer) -> r0 = flags2 result; sets BlindTimer = 300 and flag
  0x20 in collision flags2
details: Reads the object's collision data pointer from r5+oBattleObject_CollisionDataPtr, stores 0x12C
  (300 frames, 5 s) into oCollisionData_BlindTimer, then calls object_setFlag2 with bit 0x20. The 0x20
  flag presumably marks the object as blinded, and the timer counts down the duration. Takes the object
  in r5 rather than r0, so callers set it up beforehand. No callers are known, so register conventions
  beyond r5 are unconfirmed.
