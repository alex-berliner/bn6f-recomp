- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r1,[r5,#oBattleObject_CollisionDataPtr]; strh r0(=0x12c),[r1,#oCollisionData_BlindTimer]
    sets a 300-frame blind timer; mov r0,#0x20; bl object_setFlag2 sets bit 0x20 in the object's collision
    flags2, matching a status marker; callee object_setFlag2 is documented as setting bits in the collision
    data flags2 word
