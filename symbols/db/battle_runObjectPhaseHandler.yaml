name: battle_runObjectPhaseHandler
address: '0x080D8EC6'
kind: function
status: probable
summary: Dispatches the current-phase handler of the battle object in r5 via a 3-entry jump table
interface: (r5 = battle object ptr, oBattleObject_CurPhase selects handler) -> r0 = handler return; calls
  table[curPhase](implicit r5 context)
details: 'Reads oBattleObject_CurPhase from the battle object in r5, loads a function pointer from off_80D8ED8[curPhase]
  (entries: battle_scanAttackPanels, sub_80D8F20, nullsub_11), and does the classic ''mov lr, pc; bx r1''
  long-call trampoline so the handler returns back into this function. The handler itself presumably operates
  on r5 (THUMB caller-saved register convention used by this object code). Phase 2 is a nullsub, so the
  object idles in that phase. The caller sub_80D8EB0 runs this each frame, decrements oBattleObject_Timer,
  and sets CUR_STATE_DESTROY when the timer hits zero, so this function is the object''s update/phase-step
  routine.'
