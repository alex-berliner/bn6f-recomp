status: probable
summary: Spawns one battle object's beast-form (sprite 0x80/anim 0x2f, palette 0, no shadow, priority
  derived from +0xC) when CurState transitions from 3 to 4 (BattleObject in r5)
interface: '(r5 = BattleObject*, r10 = Toolkit*, lr) -> void; side effects: writes CurAction=3, then CurState=4,
  sets EVENT_5FF, conditionally calls sub_80A76E8 when EVENT_5E5 is set'
details: '- r0/#3 -> [r5+0x9] (BattleObject.CurAction = CUR_STATE_INITIALIZE for the per-action state
  machine). Note BattleObject.CurAction is at +0x9 (not CurState+0x8); the CUR_STATE_INITIALIZE=0 constant
  is used here for the action sub-state.

  - Calls sub_80A75A4 -> r4: returns a small beast descriptor (params struct); observed loading from r4+[0]/+[2]
  (16.16 base X/Y) and r4+[6]/+[7] into the BattleObject (struct offsets 0x2C/0x30).

  - sprite_load(0x80, 0x1c, 0x2f): load beast sprite table 0x80, slot 0x1c, animation 0x2f; r4+4 (anim
  id halfword) is copied to [r5+5] = CurAnim, then sprite_setAnimation + sprite_loadAnimationData + sprite_noShadow.

  - applyLayerEffectToOWObject_8035694(r5+0xC): set BattleObject''s Z-derived layer priority; sprite_setPriority_8002E14
  (priority bits written into sprite byte 0x15).

  - sprite_setPalette(0): palette index 0.

  - Copies 16.16 coords from r4 to [r5+0xC]/[r5+0x10] (BattleObject.X/Y) via ''ldrh .. lsl #16'' / str
  r0; Z fixed at 0 ([r5+0x14]=0); copies r4+[6]/+[7] to BattleObject.Damage/StaminaDamageCounterDisabler-like
  fields at 0x2C and 0x30.

  - sub_80A7514 (no args, may_write everything from r0-r4): additional setup call right after the coord/damage
  writes.

  - Z-velocity/counter field cleared: str r0,[r5+0x24] (=0). Also a separate fixed value 0x11 at [r5+0x34].

  - TestEventFlagFromImmediate(EVENT_5E5) != 0 -> bl sub_80A76E8 (extra beast-state init hook gated by
  story/event 0x5E5).

  - Then strb 4,[r5+8] (CurState = CUR_STATE_UPDATE = 4) and bl battleObject_updateFromCurAction_80A7354
  (per-action state machine tick).

  - SetEventFlagFromImmediate(EVENT_5FF): mark a one-shot "beast out just happened" event on exit.

  '
