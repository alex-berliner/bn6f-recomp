open_questions:
- Exact meaning of EVENT_5F1 (story progress vs. local battle flag) and what consuming the latch at [r5+0x24]
  does downstream — would need a follow-on caller that reads [r5+0x24].
- Whether the r6 box path is the "primary" trigger and the player-coord path is a fallback, or vice versa
  — the assembly only makes the r6 path gated on r6+0x84!=0.
