name: sub_80173F4
address: '0x080173F4'
kind: function
status: confirmed
summary: Forces every sprite into its white flash palette and dispatches the battle object's current phase handler
  via the jump table at off_801740C.
interface: void R5_battleObject (in r5); returns r5/r10 (object), r1 (handler address), r8/r9/r11/r12 untouched
  by the wrapper; nz/c/v clobbered
details: 'Calls sprite_forceWhitePalette first, then reads the byte at oBattleObject_CurPhase off the object and
  uses it to index off_801740C, a four-entry Thumb jump table: 0x0 -> sub_801741C, 0x4 -> sub_801746E, 0x8 -> battle_objectTickTimerAndSetPhaseC_80174AA,
  0xC -> sub_80174BE. Phases are 4-step (0, 4, 8, 0xC), matching the CurPhase scheme used elsewhere. The handler
  address (with Thumb bit set) is loaded into r1 and the handler is tail-called with mov lr, pc / bx r1, so on return
  execution pops pc — there is no further work in the wrapper. r5 and r10 therefore reach the handler untouched.'
