name: sub_800B75A
address: '0x0800B75A'
kind: function
status: hypothesis
summary: Writes 0xFF to the single byte at byte_203C960, apparently flagging a "cancel / back out" state for whatever
  menu or screen owns that byte.
interface: void sub_800B75A(void); // clobbers r0, r1 and the NZ flags; returns via lr (never touches lr otherwise)
details: 'Three-instruction thunk: loads the address of byte_203C960 (IWRAM) with a literal-pool LDR, stores 0xFF
  into it, and returns.

  Nothing else is read or written. The value 0xFF is used elsewhere in the codebase as a "none/exit/cancel" sentinel
  (e.g. menu

  selection indices use 0xFF for "back"), so the likely intent is to set byte_203C960 to that sentinel — either
  a cancel request

  flag or an "invalid/none" index. The caller supplies nothing; the register contract (only lr in, nothing read
  back) shows every

  caller ignores the result and just uses the side effect on byte_203C960.

  Note it writes the raw byte 0xFF rather than clearing or toggling, so byte_203C960 is presumably interpreted as
  a signed -1 or

  a 0xFF sentinel by its readers.

  '
