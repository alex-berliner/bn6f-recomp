name: initMapTilesState_803037c
address: '0x0803037C'
kind: function
status: confirmed
summary: Initialize the global map-tiles state (eMapTilesState200be70) with the BG descriptor, palette/tileset pointers,
  map dimensions, and three per-map callbacks for the current map.
interface: void initMapTilesState_803037c(u8 map_group /* r0 */, u8 map_number /* r1 */); preserves r4-r9, r12;
  clobbers r0-r3, NZCV
details: 'Picks one of two world-specific tables (real-world off_80329A8/off_8032F6C, or internet off_80329C4/off_8032F88
  with map_group rebased by subtracting INTERNET_MAP_GROUP_START), then indexes [map_group][map_number] to get a
  MapBGDescriptor and a 3-entry (12-byte) callback triple. Stores: the BG descriptor pointer at oMapTilesState200be70_MapBGDescriptorPtr;
  the three callbacks at UnkCallback_18/_1c/_20; the tilemap''s width/height (read from oMapBGTilemapHeader at descriptor->TilemapPtr);
  descriptor->PalettePtr; descriptor->TilesetPtr; and a pointer to eDecompBuffer2013A00 at Unk_0c. The C version''s
  "state = oMapTilesState200be70_MapWidth" is just shorthand for the base address; offsets used here are relative
  to the 0x200be70 base.'
