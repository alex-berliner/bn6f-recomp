name: submenu_getSelectedTile
address: '0x0812ED34'
kind: function
status: probable
summary: Returns the display tile word for the submenu's currently selected list entry, fetched from the
  table at word_2023FA0 with the 0x8000 bit (palette 8) set.
interface: () -> r0 = halfword word_2023FA0[submenuState.0x20 + submenuState.0x24] | 0x8000; no flags
  of interest
details: Fetches the submenu state struct via submenu_getStatePtr, reads two halfword fields at +0x20
  and +0x24 (likely a list scroll base and the cursor/selected index), adds them, and multiplies by 4
  to index word_2023FA0 as an array of 4-byte entries. It loads the low halfword of the entry and ORs
  in 0x8000 — for a BG-map-style halfword this sets palette 8, i.e. it builds a ready-to-write tile/palette
  attribute word. The sole caller stores the result into object field [r5,#0x2a] after setting [r5,#0x10]=0xc,
  consistent with configuring a sprite/BG element showing the selected entry. The table contents and the
  meaning of the two state fields are inferred, not proven.
