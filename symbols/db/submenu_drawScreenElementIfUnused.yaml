name: submenu_drawScreenElementIfUnused
address: '0x0812DA3C'
kind: function
status: probable
summary: Draws or queues a shared submenu screen element when its corresponding structure slot is unused.
interface: (r0 = unused selector 6) -> r0 = getStructFrom2008450(6)'s in-use byte; flags NZ reflect whether
  the slot is in use
details: The function queries fixed structure entry 6 through getStructFrom2008450. If the returned status
  byte is zero, it invokes submenu_drawScreenElement; otherwise it returns immediately. It passes the
  fixed selector 6 as r0 to the status query and does not otherwise modify the shared submenu work structure.
