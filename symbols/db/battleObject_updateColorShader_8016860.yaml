open_questions:
- 'Exact semantics of byte_80168A8 and r4 bits: it could equally mean "temperature tint" or "battlefield
  blue/orange tint", tied to whether the r5 object is the controlled navi versus an enemy.'
- Whether the 0x2c byte is NaviStats.Transformation (0x2c) or some AIData field is not fully clear from
  this function alone.
