details: 'Reads the 0x50-byte block at 0x200A6A0 (referred to as eStruct200a6a0). If byte[+0] is non-zero

  AND a callback function pointer is installed at offset +8, it tail-calls that callback

  (loaded into r0; r5 keeps pointing at the struct base for the callee, matching the original

  `mov lr, pc; bx r0` trick). After that — regardless of whether the callback ran — it

  ZeroFillByWord''s the entire 0x50-byte block, effectively disarming and clearing the event.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
