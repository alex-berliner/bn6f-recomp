name: ai_runElementAttackUpdate
address: '0x0811088A'
kind: function
status: probable
summary: 'Per-frame AI attack-state update: clears collision region on certain hit flags, then dispatches
  to an element-specific attack handler.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = handler return value; flags clobbered
details: Reads the object's collision data and tests oCollisionData_FlagsFromCollision; if any of the
  bits in mask 0x0C000000 are set, calls object_clearCollisionRegion so the attack stops registering collisions
  in its region. Then loads oAIAttackVars_HitElement from the AI attack vars struct and uses it as an
  index into the table at off_81108B4, long-calling (mov lr,pc; bx r1) the selected handler; entries include
  known AI attack routines like ai_updateDiveAttack, ai_attackTelegraphFrontPanel, ai_lungeAttackUpdate,
  ai_checkGuardFrame and genericAI_exitAttackStateAffterDelay. After the handler returns, it always calls
  sub_8110D7C before popping. Effectively the shared update step for an enemy's element-based attack behavior
  (Dive/Beast-style attacker used in battlesweep and beastsp routes).
