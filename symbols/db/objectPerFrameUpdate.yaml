name: objectPerFrameUpdate
address: '0x080DD7FC'
kind: function
status: probable
summary: 'Per-frame driver for a battle object: tears down its collision data, destroys it if the battle
  is over, otherwise dispatches to its CurAction handler and refreshes sprite and collision state.'
interface: (r0 = battle object pointer (also cached in r5)) -> r0 = destroyed? (state set to CUR_STATE_DESTROY)
  / handler result; calls object_removeCollisionData, battle_isBattleOver, action jump table, object_updateSprite,
  object_presentCollisionData
details: The function first calls object_removeCollisionData, then if the collision data's FlagsFromCollision
  word is nonzero it also calls object_clearCollisionRegion to detach the object from its region. If battle_isBattleOver
  returns true, it clears the collision region again and writes CUR_STATE_DESTROY into oBattleObject_CurState,
  ending the object's life. Otherwise it indexes off_80DD838 with oBattleObject_CurAction (4 entries)
  and tail-calls the selected handler via mov lr,pc; bx r1, after which it unconditionally runs object_updateSprite
  and object_presentCollisionData for the frame. This is the standard per-frame driver for this object
  class; the action handlers at sub_80DD848/87C/8D2/8F0 implement the object's four behaviors.
