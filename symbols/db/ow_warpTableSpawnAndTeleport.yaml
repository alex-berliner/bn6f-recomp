name: ow_warpTableSpawnAndTeleport
address: '0x0809BDB8'
kind: function
status: probable
summary: 'Overworld warp handler: matches player grid position against byte_809BE6C table (or forces index
  3 via EVENT_128); for index < 0x10 builds a 0x14-byte spawn request at r5+0x70 from byte_809BA30, calls
  SpawnOverworldMapObject, sets/clears event flags, and writes camera (r0=1,r1=request); regardless of
  index, copies player-state+0x24/+0x28/+0x2c into coordinates via owPlayer_indirectlySetPlayerCoordsMaybe.'
interface: (r0 = unused/result flag input, r5 = overworld controller struct, r10+0x3c = overworld/player
  state struct) -> r0 = 0; sets/clears event flags, writes camera field
details: If EVENT_128 is set it immediately uses index 3, otherwise it reads two halfwords from the struct
  at r10+0x3c (fields +0x4 and +0xc, likely the player's grid x/y) and scans byte_809BE6C, a table of
  halfword coordinate pairs, for a match, storing the index at r5+8. If the index is < 0x10 it builds
  a 0x14-byte spawn request at r5+0x70 from byte_809BA30[idx*0x14] (x/y/z sign-extended and <<16, halfword
  +6 lsr 1 as a parameter, +0xe copied), calls SpawnOverworldMapObject and stores the returned object
  pointer at request+0x10; it also sets EVENT_38 and EVENT_39, clears the event-flag bitfield at table
  entry +0x10, and flags camera field via camera_writeUnk03(r6,1). Finally it copies the struct's +0x24/+0x28/+0x2c
  words into the player's coordinates via owPlayer_indirectlySetPlayerCoordsMaybe_809e1a4, i.e. moves
  the player to the destination position. Indices >= 0x10 (the last five table pairs) skip the spawn/teleport
  entirely.
