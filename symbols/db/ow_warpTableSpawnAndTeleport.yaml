open_questions:
- Which in-game location/trigger uses this (recorded only on the beastsp route); the exact meaning of
  the coordinate tables byte_809BA30 and byte_809BE6C and the fields r10+0x3c+4/+0xc/+0x24 is unconfirmed
- What SpawnOverworldMapObject returns and the full layout of the r5+0x70 request record are only partially
  known
- The proposal states indices >= 0x10 'skip the spawn/teleport entirely' but the bge at line 'bge loc_809BE52'
  jumps directly to the teleport code, so only the spawn block is skipped and owPlayer_indirectlySetPlayerCoordsMaybe_809e1a4
  still executes. The table byte_809BE6C has 23 halfword-pair entries, not 16; calling indices 16-22 'the
  last five table pairs' is incorrect. The camera call is 'mov r0,#1; mov r1,r6; bl camera_writeUnk03'
  so arguments are (1, r6) not (r6,1). The destination coords at +0x24/+0x28/+0x2c are read from the player-state
  struct (r10+0x3c), not 'the overworld struct.'
