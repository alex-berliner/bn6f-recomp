summary: 'Plays the "Beast Out" transformation transition: clears/loads beast-out graphics, fires dispatch
  effects, and plays the SE 0x9f jingle.'
interface: '(r10 = toolkit) -> side effects only; side effects: clears bit 0x10000 of dword_20352C0, dispatches
  flags 0x10000 and 0x200, queues a 3-entry GFX transfer list, plays sound 0x9f'
details: "Five-step sequence run inside a captured \"beast sp\" (sp = special) scenario:\n1. `flags_clearBits_eStruct2035280_801BED6(0x10000)`\
  \ — clears bit 0x10000 (likely the\n   \"beast-out active\" toggle, also matches dispatch mask in step\
  \ 4) on the flags field\n   of eStruct2035280 (the field at offset 0x44 in that struct, called UnkFlags_44).\n\
  2. `dispatch_801DACC(0x10000)` — calls the dispatch/effect handler with mask 0x10000;\n   the matching\
  \ `flags_clearBits_eStruct2035280_801BED6` is named in the project as\n   clearing exactly this bit\
  \ in the same struct, so the two calls are paired.\n3. `QueueGFXTransfersInList(off_801E188)` — walks\
  \ a 12-byte/entry list at dword_86E611C\n   that pushes three graphics chunks: tiles 0x6016E00 size\
  \ 0x140, palette/byte_86F2900 at\n   0x30016B0 size 0x20, and a null terminator. These are the beast-out\
  \ battle sprites\n   and palette for the player's Navi transformation.\n4. `dispatch_801DA48(0x200)`\
  \ — triggers another effect handler with mask 0x200 (likely a\n   beast-out visual/blast flag, one bit\
  \ of the same UnkFlags_44 field).\n5. `PlaySoundEffect(0x9f)` — the M4A SE id 0x9f is the player's \"\
  Beast Out!\" voice clip\n   / jingle in BN6 (confirmed by the captured r0=0x9f exit values in both beastsp\
  \ snapshots).\nThe function takes no register args (only `r10` toolkit via the project calling convention,\n\
  used by the leaf `PlaySoundEffect` wrapper), saves only `lr`, and returns via `pop pc`. All\ncallers\
  \ in `sub_80080D2 / 855E / 89CC / 8DDC` are themselves unnamed; given the surrounding\ncontext, they\
  \ are the four battle state-update dispatchers that handle the player transforming\ninto the beast form,\
  \ and this function is the one-shot effect that fires when the transition\nis triggered.\n"
