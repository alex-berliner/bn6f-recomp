status: probable
summary: 'BattleObject "CUR_STATE_UPDATE" entry hook: sets Z to 0, loads sprite bank 0x80/anim 0x0e, picks
  animation 0x3e, palette 0, facing from object_getFlip, reserves the panel under (PanelX,PanelY) and
  bumps CurState/CurAction/Phase to CUR_STATE_UPDATE (0x4)/0/0.'
interface: '(r5 = battle object) -> void ; side effects: writes the object''s Z, sprite, animation, palette,
  flip and reserves its panel'
details: '1. object_setCoordinatesFromPanels(r5) so X/Y pixels match current panel coords.

  2. Z (16.16 at oBattleObject_Z = 0x3c) is cleared to 0.

  3. sprite_load(0x80, 8, 0x0e) — sprite bank 0x80, sub 8, param 0x0e.

  4. sprite_noShadow() disables shadow attribute bits.

  5. OR''s OBJECT_FLAG_VISIBLE (0x02) into oObjectHeader_Flags via ldrb/orr/strb.

  6. Writes CurAnim (0x10) and CurAnimCopy (0x11) to 0x3e, calls sprite_setAnimation(0x3e) then sprite_loadAnimationData().

  7. sprite_setPalette(0), then object_getFlip()''s result is passed to sprite_setFlip().

  8. object_reservePanel(PanelX, PanelY) reserves the panel under the object.

  9. Stores CUR_STATE_UPDATE (0x04) into oBattleObject_CurStateActionPhaseAndPhaseInitialized (a u32 at
  +0x8), zeroing CurAction/CurPhase/PhaseInitialized implicitly because only the low byte is written with
  0x04? Actually a u32 store with value 4 sets all 4 bytes to 0 except the lowest; the assembly uses `mov
  r0,#CUR_STATE_UPDATE` then `str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]`, so the
  top three bytes of the slot are zeroed — CurAction/CurPhase/PhaseInitialized all become 0, only the
  CurState byte becomes 0x04. Ends with `pop {pc}`.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0,#CUR_STATE_UPDATE / str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]`
    at the bottom is exactly the CUR_STATE_UPDATE transition. - `sprite_load(0x80, 8, 0x0e)` followed
    by animation 0x3e (writing both CurAnim and CurAnimCopy) shows this is a fixed initialization sprite/animation
    choice. - `bl object_setCoordinatesFromPanels` then `str r0,[r5,#oBattleObject_Z]` (=0x3c by struct
    definition) zeroes Z. - `ldrb r0,[r5,#oBattleObject_PanelX] / ldrb r1,[r5,#oBattleObject_PanelY] /
    bl object_reservePanel` reserves the panel under the object. - `bl object_getFlip / bl sprite_setFlip`
    mirrors by alliance+direction-flip. - ORing 0x02 into oObjectHeader_Flags sets OBJECT_FLAG_VISIBLE;
    the routine never touches OBJECT_FLAG_ACTIVE, so the object is expected to already have been activated
    by an outer constructor.'
  refs:
  - bn6f/asm/asm31.s
  reproduce: 'python3 tools/asmcat.py 0x080D028C

    '
  result: the body read as described above
