open_questions:
- Sprite bank 0x80 + sub 8 + anim 0x3e (also palette 0) is meaningful in-game but we have no caller to
  tell us which chip/object this is — could be any "summon slot" battle object initialiser.
- The function takes only r5 in its contract and produces no caller-observable value, so it's clearly
  an init hook called from a jumptable (probably oBattleObject+0x8's state-action jumptable on CurState=CUR_STATE_UPDATE
  entry), but no callers are listed in the captured data here.
