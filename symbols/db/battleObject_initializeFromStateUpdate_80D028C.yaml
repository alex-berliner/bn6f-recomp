name: battleObject_initializeFromStateUpdate_80D028C
address: '0x080D028C'
kind: function
status: confirmed
summary: Re-initializes a battle object from its stored state - places it on its panels, reloads its sprite, plays
  animation 0x3E, and switches it to the update state.
interface: battleObject_restoreFromSavedState_80D028C(r5 = battle object) -> r5 (object pointer returned unchanged);
  clobbers r0-r3, lr, flags
details: "Takes a battle object in r5 (pointer to a battle object / object header struct) and\nperforms the full\
  \ \"come back from stored state\" sequence:\n- object_setCoordinatesFromPanels(): recomputes the object's pixel\
  \ position from\n  oBattleObject_PanelX/oBattleObject_PanelY.\n- Zeroes oBattleObject_Z (puts the object on the\
  \ ground).\n- sprite_load(0x80, 8, 0xE): loads sprite resource set 0x80 with palette 8 and\n  graphic slot 0xE\
  \ for this object; then sprite_noShadow() removes its shadow.\n- Sets bit 1 (value 2) of oObjectHeader_Flags,\
  \ marking the sprite as loaded.\n- Sets oBattleObject_CurAnim and oBattleObject_CurAnimCopy to 0x3E, calls\n \
  \ sprite_setAnimation(0x3E) and sprite_loadAnimationData() to load that animation's\n  frame data; then sprite_setPalette(0)\
  \ and applies the object's facing via\n  object_getFlip()/sprite_setFlip().\n- object_reservePanel(panelX, panelY)\
  \ re-reserves the panel the object stands on,\n  so occupancy state matches the restored position.\n- Finally\
  \ stores CUR_STATE_UPDATE into\n  oBattleObject_CurStateActionPhaseAndPhaseInitialized, so the object's next step\n\
  \  runs its normal per-frame update logic.\nThe single fixed sprite set (0x80/8/0xE) and fixed animation 0x3E\
  \ suggest this is\nused for one specific object or class of objects being restored/respawned from a\nsaved state\
  \ record rather than being a generic object initializer.\n"
