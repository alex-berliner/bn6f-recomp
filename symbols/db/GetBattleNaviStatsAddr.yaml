name: GetBattleNaviStatsAddr
address: '0x08013682'
kind: function
status: confirmed
summary: Returns the address of a navi's entry in the battle navi stats table for a given navi index.
interface: NaviStats* GetBattleNaviStatsAddr(int index); // r0 = index, returns r0 = &eBattleNaviStats0[index];
  r1 also ends up holding the table base, flags set by the final ADD
details: Multiplies r0 by oNaviStats_Size (sizeof of a NaviStats record), loads the base address of the battle navi
  stats table (symbol eBattleNaviStats0) from a literal pool, and returns base + index*size in r0. r1 is not restored;
  it retains the table base address, which callers may or may not rely on. The flags reflect the ADD used to form
  the pointer. No memory is read or written beyond the address computation, and the index is not bounds-checked,
  so an out-of-range index yields a pointer past the table.
