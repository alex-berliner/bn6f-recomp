name: t3_0x7b_80D4A28
address: '0x080D4A28'
kind: function
status: confirmed
summary: Battle-object phase dispatcher that reads the object's current state and jumps to the matching handler
  (init, destroy-phase, or generic destroy).
interface: void battleObject_runStatePhase_80D4A28(BattleObject* obj /* r5 */); dispatches via `mov lr, pc; bx r1`
  into the selected handler, which returns directly to this function's caller
details: 'Standard t3 "phase dispatcher" thunk for one battle object type. Loads oBattleObject_CurState from the
  object passed in r5, indexes the state table at off_80D4A3C with it, and tail-dispatches using the classic `mov
  lr, pc; bx r1` trick so the callee''s return goes straight back to this function''s caller. The table has three
  entries: state 0 -> battleObject_initializePhase_80D4A48 (freshly spawned), state 1 -> object_destroyPhase_80D4A98
  (marked for deletion), state 2 -> object_genericDestroy (already destroyed). Because the callee runs with this
  handler''s register file, whatever r5/r8-r12 the phase handler leaves become this function''s observed outputs
  per the callers'' contract. The three-state table (spawn/destroy/destroyed) suggests this object has no ongoing
  behavior phases beyond one-time initialization.

  '
