name: sub_8119C94
address: '0x08119C94'
kind: function
status: confirmed
summary: Returns a per-navi (x, y) offset pair from a lookup table, selected by the navi currently equipped in the
  PET (navi 0 additionally switches entry sets based on its stats byte 0x17 and EVENT_163).
interface: int sub_8119C94(void); returns r0 = x (s16), r1 = y (s16); reads r10/lr context via GetCurPETNavi
details: 'Calls GetCurPETNavi to get the navi id currently equipped in the PET. If the id is non-zero, the table
  entry index is 0xB + navi_id, so entries 0xB.. onward are one-per-navi offsets. If the id is 0, the function instead
  reads GetCurPETNaviStatsByte(0, 0x17) — a per-navi stats byte, likely a form/variant selector — and uses that
  as the index; if TestEventFlagFromImmediate(EVENT_163) is set, 0x17 (23) is added to the index, i.e. a second
  block of 23 entries for navi 0''s alternate state. The final index is scaled by 4 and used to load two signed
  16-bit values from the table at byte_8119CCC (entries of two s16 = (x, y)); r0 gets x, r1 gets y. Table values
  are small pixel offsets (e.g. -4..8, many 0s, some pairs like {0x02,0x00}, {0xFC,0xFF} = -4). r4 is scratch (preserved
  for the caller); flags nzcv are clobbered. The caller context in r10 is consumed by GetCurPETNavi. The -4/+2 style
  values suggest a small sprite draw/cursor offset keyed to which navi is shown (e.g. PET screen or status-area
  emblem positioning).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
