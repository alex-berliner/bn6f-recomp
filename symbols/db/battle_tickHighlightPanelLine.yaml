name: battle_tickHighlightPanelLine
address: '0x080D55F8'
kind: function
status: probable
summary: Per-frame update that calls sub_80D5634, decrements Timer, destroys the object at 0, and while
  alive highlights the object's panel, the panel ahead (X+dir), and then a 4-entry row via highlightPanelIfSomeCondition_8109660.
interface: (r5 = battle object) -> r0 = destroyed(?) via state store; flags from timer compare (ble)
details: 'First calls sub_80D5634 (likely the object''s animation/step routine), then decrements oBattleObject_Timer;
  when it reaches 0 the object''s state is set to CUR_STATE_DESTROY and it returns. While alive, it gets
  the object''s facing multiplier from object_getFrontDirection and highlights three panels along its
  row: its own PanelX/PanelY, then X+dir (twice, second pass seemingly redundant) before calling highlightPanelIfSomeCondition_8109660
  with a count of 4 and dy=0 context, which applies a (dx,dy) offset list with the facing sign to highlight
  further panels on the 6x3 grid. The combination suggests an attack whose hit area spans the object''s
  own panel and a shaped region ahead (e.g. a wide/long multi-panel hit). The object pointer is expected
  in r5, so the caller (sub_80D55A4) presumably dispatches per-object.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; ble -> CUR_STATE_DESTROY: timed lifetime, self-destruct;
    bl object_getFrontDirection then add r0,r0,r7 onto PanelX: highlights extend forward relative to facing;
    push/pop of (PanelX,PanelY) around two object_highlightPanel calls: own panel and next panel are marked;
    mov r2,#4; mov r3,#0; bl highlightPanelIfSomeCondition_8109660: 4 more offsets from a (dx,dy) list,
    mirrored by side sign; recorded route ''battlesweep'' and callees object_highlightPanel/highlightPanelIfSomeCondition
    confirm battle-grid panel marking'
