open_questions:
- The "8" passed in r0 in the captured calls isn't consumed by this body; it's almost certainly `CurState`
  picked up by the dispatcher before the call. The exact selector for *which* battle-object functions
  get routed here is unknown.
- What `sub_800ED80` does (and what the HP saved at +0xe before the sentinel write is used for) would
  clarify why the HP load sits in the not-0xFF branch.
- Whether `PhaseInitialized = 4` is generally "destroy-done" vs. "next phase is CUR_STATE_UPDATE" needs
  a wider look at the dispatcher.
