summary: Tiny wrapper that applies collision status effect 0x32 (50) to an entity
interface: (no meaningful args) -> calls object_setCollisionStatusEffect2(r0=0x32); returns its result
details: The function immediately loads 0x32 into r0 and tail-calls object_setCollisionStatusEffect2,
  then returns; it does nothing else. So it is a parameterless helper that stamps status-effect id 0x32
  (decimal 50) onto whatever context object_setCollisionStatusEffect2 operates on (presumably the battle
  collision/effect target). Without a caller or the callee's enum we cannot tell which in-game status
  (blind, confusion, etc.) id 50 corresponds to. It is likely a shared hook/handler invoked by the battle
  engine when a specific attack or panel effect lands.
