    of the actor. - `strh r0,[r7,#oAIAttackVars_Unk_00]` with `mov r0,#4` at 0x80EC908 writes the "finished" sentinel.
    - Captured exits r0={1,2,4} per `r4`/object type telltale; the 4 in particular is what this routine consistently
    ends on once Unk_10 reaches 0xA.'
