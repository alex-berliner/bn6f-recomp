open_questions:
- Which chip/attack this actually is. The `0x13` payload and 0xAF SFX could be any of multiple "charge-then-fire"
  Navi/virus attacks; the caller list is empty in the inputs, so identification is shallow.
- Whether the `push {r7}` / `pop {r7}` around `sub_80EC934`+spawn is preserving r7 over the spawner or just window-dressing;
  project convention says r7 is caller-saved across `bl`, but the explicit push implies `spawn_t1_0x5_tempAttackObject_80B8E30`
  clobbers it.
- The callers section is empty, so the "AI attack step" framing relies on register convention (r5=BattleObject,
  r7=AIAttackVars) consistent with the surrounding 0x80EC8xx cluster.
