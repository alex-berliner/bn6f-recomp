name: object_advanceToPhase4SpawnAttack
address: '0x080B8390'
kind: function
status: probable
summary: 'Battle-object per-frame phase handler: plays anim 6 for 40 frames, then on expiry switches to
  anim 5, advances to phase 4, and spawns a type-1 subtype-5 attack object with id 0x11C1F.'
interface: (r5 = battle object) -> void; sets oBattleObject_CurAnim/Timer/CurPhaseAndPhaseInitialized,
  spawns attack object 0x11C1F
details: Standard scripted phase handler for a battle object. On first entry it sets PhaseInitialized,
  arms Timer to 0x28 (40 frames), and plays animation 6 (wind-up/charge). Each frame it decrements Timer;
  once it hits zero it switches to animation 5, writes phase 4 into CurPhaseAndPhaseInitialized, loads
  r4 with 0x11C1F (attack/element id) and r7 with the object's field at +0x4C (pointer slot for the spawned
  object), then calls the type-1 subtype-5 temp-attack-object spawner which links the new object to the
  related battle object and inherits panel XY/alliance. The spawn happens on the same frame the timer
  expires; the phase-4 write lets the object's next phase take over afterwards.
