    and CurPhaseAndPhaseInitialized=4 before spawning; ldr r4,=0x11C1F and r7=r5+0x4C feed the spawn call,
    matching spawn_t1_0x5's 'related object pointer stored' behavior; only callee is spawn_t1_0x5_tempAttackObject_80B8E30,
