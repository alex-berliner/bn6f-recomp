name: battle_phaseDispatch
address: '0x080BD114'
kind: function
status: probable
summary: 'Battle-object phase-state dispatcher: reads the object''s CurPhase and calls that phase''s handler
  from a jump table.'
interface: (r5 = battle object) -> calls off_80BD128[CurPhase](r0 = phase value, r5 = object); returns
  to caller after handler returns
details: Loads the battle object pointer from r5 (callee-saved, so set up by the caller) and reads its
  CurPhase byte, then indexes a three-entry function-pointer table at off_80BD128 with it and calls the
  selected handler via mov lr,pc / bx r1, so control returns through pop {pc} when the handler finishes.
  The handler is passed the phase index in r0 while r5 still holds the object. The table has exactly three
  handlers (sub_80BD134, battle_phaseStrikeRandomEnemyPanels, sub_80BD1B8), so this object runs a three-phase
  behavior loop, one of which strikes random enemy panels. It is a generic dispatch trampoline, not a
  behavior itself.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0] indexes handler table by phase (asm lines
    2-4); mov lr,pc; bx r1 calls the selected handler, pop {pc} returns to the original caller (lines
    5-6); table off_80BD128 holds three Thumb pointers including battle_phaseStrikeRandomEnemyPanels+1;
    known callee battle_phaseStrikeRandomEnemyPanels shows the dispatched handlers are battle phase behaviors
  refs:
  - bn6f/asm/asm31.s:11095
