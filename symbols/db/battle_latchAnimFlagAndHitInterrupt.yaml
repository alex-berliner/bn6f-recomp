name: battle_latchAnimFlagAndHitInterrupt
address: '0x080D9930'
kind: function
status: probable
summary: 'Per-frame battle-object update: latches anim 2 once the current frame''s attribute sets bit
  0x80, and interrupts into hit action 4 when the object takes a flinch-type hit.'
interface: (r0 = unused/clobbers, r5 = battle object ptr) -> r0 = clobbered; no return value, mutates
  oBattleObject_CurAnim, Param1, CurAction, CurPhaseAndPhaseInitialized
details: 'Guarded by oBattleObject_Param1: while it is 0, sprite_getFrameParameters supplies the frame''s
  attribute byte, and if bit 0x80 is set the object''s animation is switched to 2 and Param1 is set to
  2 so the check never repeats. Then it dereferences oBattleObject_CollisionDataPtr and tests oCollisionData_HitModifierFinal
  against 0x3C, the bit mask for flinch-class hit modifiers. If any of those bits are set, CurAction is
  set to 4 (hit/flinch action) and the phase field is zeroed so the new action starts from phase 0. The
  two halves are independent, so the anim latch and the hit interrupt can both happen in the same tick.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Param1] / bne: one-shot gate, latches strb #2 into CurAnim and Param1
    after frame attribute bit 0x80 (tst r0,#0x80); bl sprite_getFrameParameters: the 0x80 bit tested is
    the known attribute byte of the current animation frame; ldr r0,[r5,#oBattleObject_CollisionDataPtr];
    ldrb [r0,#oCollisionData_HitModifierFinal]; tst #0x3C: reads the final hit modifier and tests flinch-class
    bits; strb #4 -> CurAction, strh #0 -> CurPhaseAndPhaseInitialized: standard restart-into-action-4
    hit-reaction transition'
  refs:
  - bn6f/asm/asm31.s:73490
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x080D9930
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
