name: tableAddSaturatedByte_800AB46
address: '0x0800AB46'
kind: function
status: confirmed
summary: Adds r2 to one byte of the row-table at byte_203EAE0 (row r0, column r1), clamping the result at 255.
interface: void tableAddSaturatedByte(u32 row /*r0*/, u32 column /*r1*/, u32 addend /*r2*/); returns row base pointer
  in r3; sets carry/overflow flags from CMP(sum, 0xFF)
details: Computes the address byte_203EAE0 + row*0x10 (the table uses 16-byte rows), loads the byte at row base
  + r1, adds r2, saturates the result to 0xFF if it would exceed that (signed BLE against 0xFF), and stores it back.
  Leaves the computed row base address in r3 on return and sets c/v per the comparison with 0xFF (callers that use
  these flags would see the flags for an unclamped sum). The table at byte_203EAE0 is only known here as an array
  of 16-byte records addressed by row/column; the in-game meaning of the individual byte is not determined from
  this function alone.
