summary: tail-dispatcher that runs the currently-selected chatbox step handler
interface: 'void sub_804C058(void); /* in: r5=chatbox object; out/clobber: r0-r3,r8-r12,lzcv; preserved: r4-r7 */'
details: 'A two-entry handler table at off_804C06C. The "handler selector" byte at

  [r5+0x10] (0..1) indexes it; the chosen Thumb function is tail-called

  (mov lr,pc ; bx r0 ; pop {pc}), so on return control goes straight to

  sub_804C058''s caller. Entry 0 -> sub_804C08C; entry 1 ->

  chatbox_stepIfGatesOpen_804C11C. Only preserved registers across the

  dispatch are r4-r7; r0-r3 and r8-r12 are forwarded from the chosen

  handler to the caller, matching a chatbox-style step/phase pump where

  r5 holds the chatbox state object and [r5+0x10] selects the current

  sub-step. Selector is passed back in r1 to the handler (likely as a

  convenience rather than reloading it).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
