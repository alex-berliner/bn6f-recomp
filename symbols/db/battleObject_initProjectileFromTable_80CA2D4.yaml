summary: 'Init handler of a velocity-driven projectile: sprite 0x80/0x10/7 (0x57 when Param1==4), X/Y
  velocities from the 12-byte-per-variant table byte_80CA26C (YVelocity negated on the bottom row), then
  CUR_STATE_UPDATE via tail call.'
details: 'sprite_load(0x80, 0x10, 7); when Param1 == 4 the third id is 0x57 and the shadow is dropped
  (sprite_noShadow) instead of sprite_hasShadow. oObjectHeader_Flags |= 2 (visible). Animation: 1 when
  Param1==4 and PanelY != 1, else 0 (CurAnim/CurAnimCopy + sprite_setAnimation + sprite_loadAnimationData).
  Variant table byte_80CA26C indexed by Param1*0xC: the entry pointer goes into oBattleObject_RelatedObject1Ptr,
  entry+4 into XVelocity; entry+8 into YVelocity unless Param2 == 3, and when PanelY == 3 the YVelocity
  is negated (bottom row shoots upward). Timer = 0, palette 0, flip, object_setCoordinatesFromPanels.
  Allocates collision data (frees the object on failure), object_setupCollisionData(4, 5, Param4 ? 3 :
  1), collision region 1, hit effect 4, object_presentCollisionData, sub_80CA510, PlaySoundEffect(0xB7),
  CurState = CUR_STATE_UPDATE.

  '
