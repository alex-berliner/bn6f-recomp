name: battle_animOscillatePos_80A93E8
address: '0x080A93E8'
kind: function
status: confirmed
summary: Oscillate a battle object's fixed-point animation position back and forth with 24-step phase
  toggling
interface: void battle_animOscillatePos_80A93E8(u32 r5); /* clobbers r0, r1, flags; reads/writes r5->byte[6]
  phase, r5->byte[7] counter, r5->dword[0x14] position */
details: 'Operates on a battle object pointed to by r5. Uses a phase byte at offset 6 (0 = left, 1 = right)
  and an 8-bit step counter at offset 7. Each call increments the counter. While the counter is below
  24 (ANIM_PHASE_COUNT), it subtracts or adds a fixed-point step of 1<<14 (0x4000) to the 32-bit animation
  position at offset 0x14. When the counter reaches 24 it wraps to 0 and flips the phase byte, producing
  a smooth ping-pong oscillation. The phase toggle is asymmetric: from phase 0 the object moves leftward;
  from phase 1 it moves rightward. The counter is a byte so it naturally wraps at 256, but the explicit
  24-step threshold governs the animation cycle length.'
