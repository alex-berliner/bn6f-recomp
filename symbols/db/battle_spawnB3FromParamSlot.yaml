  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Param2]; lsl r0,#2; add r1,#0x60; ldr r7,[r5,r1] indexes a pointer
    table at object+0x60 by Param2; ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element and ldr r6
    from DamageAndStaminaDamageCounterDisabler set up the spawn arguments; bl battle_spawnObjectB3 (known
    wrapper: spawns object type 0xB3, fills panel pos, element, linked pointer, copies alliance); sole
