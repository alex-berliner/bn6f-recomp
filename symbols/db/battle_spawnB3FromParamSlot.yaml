name: battle_spawnB3FromParamSlot
address: '0x080BC160'
kind: function
status: probable
summary: Spawns a battle object of type 0xB3 using a linked-object pointer selected by this object's Param2
  from its pointer array at +0x60.
interface: (r0 = this battle object (r5), uses Param2/PanelX/PanelY/Element/Damage fields) -> r0 = spawned
  object or 0; no flags of interest
details: Reads oBattleObject_Param2, shifts left by 2, and uses it as an index into an array of 32-bit
  pointers starting at offset 0x60 of the battle object, loading the selected entry into r7 (the linked-object
  pointer for battle_spawnObjectB3). It then passes PanelX, PanelY and Element in r0-r2 and the DamageAndStaminaDamageCounterDisabler
  field in r6 to battle_spawnObjectB3, which spawns type 0xB3 and copies the linked object's alliance.
  The function is a thin wrapper that chooses which stored object pointer to inherit from via Param2.
  Param2 acts as a slot selector, so the parent object keeps several candidate linked objects at +0x60.
