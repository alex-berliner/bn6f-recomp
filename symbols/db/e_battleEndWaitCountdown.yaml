name: e_battleEndWaitCountdown
address: '0x0800873A'
kind: function
status: probable
summary: Per-frame step of a one-shot 30-frame delay that, on expiry, advances the battle-end sequence
  (sets BattleEndSubState = 1 and clears player-struct unk02).
interface: '(r5 = state struct: +3 state byte, +4 done flag, +8 halfword frame counter; r10 = toolkit)
  -> r0 = 0 return from callee; no meaningful return, flags clobbered'
details: On first run (state byte at [r5+3] == 0) it loads the halfword countdown at [r5+8] with 0x1E
  (30 frames) and stores state 4 into [r3]. Every subsequent call decrements the counter at [r5+8]; while
  it is still positive it just returns. When the counter reaches zero it sets [r5+4] = 1 (a 'finished'
  flag for the owning object/state machine), writes 1 to GameState.BattleEndSubState via the toolkit's
  game-state pointer, and calls eStruct200A008_setUnk02 with 0 on the fixed overworld player struct at
  0x200A008. r5 is a caller-provided struct pointer, so the function is a step/tick callback rather than
  a self-contained routine. The BattleEndSubState write ties it to the post-battle wrap-up flow.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#3] / str #4 -> one-time init of state and 0x1E-frame timer at [r5,#8]; ldrh/sub/strh
    + bgt: classic frame countdown that returns until it hits zero; strb #1,[r1,#oGameState_BattleEndSubState]
    via oToolkit_GameStatePtr: advances the battle-end sub-state; bl eStruct200A008_setUnk02 with r0=0
    clears a byte in the fixed overworld player struct on completion; strb #1,[r5,#4] sets a done/status
    byte in the same struct, typical of object state callbacks'
