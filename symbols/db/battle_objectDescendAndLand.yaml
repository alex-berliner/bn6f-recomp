name: battle_objectDescendAndLand
address: '0x080C3816'
kind: function
status: probable
summary: Phase step that lowers a battle object's Z each frame until it lands, then plays a sound, starts
  a 30-frame timer, switches to anim 1, and moves to phase 8.
interface: (r5 = battle object, fields read/written in place; no args in r0-r3) -> void; no meaningful
  return value
details: 'r5 points to a battle object; it reads oBattleObject_Z, subtracts 0x40000 (a fixed-point descent
  step), and stores it back. The shifted value Z>>16 is compared against 0x10: while greater, the routine
  returns and the descent continues next frame. Once Z>>16 <= 0x10 it sets CurAnimAndCurAnimCopy to 1
  (halfword), zeroes Z completely, writes 0x1E to oBattleObject_Timer, plays M4A sound effect 0xD4 via
  PlaySoundEffect, and writes 8 to CurPhaseAndPhaseInitialized to hand control to the next phase. The
  0x1E timer likely governs a post-landing state in phase 8.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r0,[r5,#oBattleObject_Z] / sub 0x40000 / str back: per-frame descent of height field; lsr
    r0,#0x10; cmp r0,#0x10; bgt locret: only when high half of Z <= 0x10 does landing trigger; strh #1,[CurAnimAndCurAnimCopy]
    and str #0,[Z]: snap to ground with a new animation; bl PlaySoundEffect with r0=0xD4: landing sound
    effect; strh #8,[CurPhaseAndPhaseInitialized]: advances the object''s phase state machine'
  refs:
  - bn6f/asm/asm31.s:25427
  - 0x080005CC PlaySoundEffect
  reproduce: python3 tools/asmcat.py 0x080C3816
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
