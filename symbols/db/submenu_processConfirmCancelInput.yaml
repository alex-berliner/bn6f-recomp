  reproduce: python3 tools/asmcat.py 0x0812D690
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The flow matches: sub_812D6F8 returns r7, [r7+0x28] gates input handling, A/B are checked via IsButtonPressed,
    [r5+0x1b]|=1 and [r5+0x26]=4/8 set, SFX 0x81/0x83 played, and sub_812D700''s nonzero return aborts.
    However, the proposal misnames r5 as the state struct: r5 is overwritten from r7 inside the input
