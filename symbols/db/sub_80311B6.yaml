name: sub_80311B6
address: '0x080311B6'
kind: function
status: confirmed
summary: Computes an entity's movement delta since its last recorded position (dropping diagonal moves) and stores
  it in the scroll/camera state before converting that state's world position to screen coordinates.
interface: u32 scroll_updateObjectDelta_80311B6(void* obj /*r0*/, void* aux /*r5, passed through*/); returns whatever
  sprite_worldToScreenPos_80310EC returns in r0
details: 'Takes an object whose fields +0x00/+0x04 hold its current X/Y world position and +0xC/+0x10 hold its previously
  recorded position. Computes dx = [+0]-[+0xC] and dy = [+4]-[+0x10]. If BOTH deltas are nonzero (diagonal movement),
  both are forced to zero -- the camera only follows movement along a single axis at a time. The resulting delta
  is written to the scroll state at dword_200F3E0 (+0x18 = dx, +0x1C = dy), which presumably gets consumed by the
  screen-position conversion done next. r6 is set to the object and r0 to the scroll state, then sprite_worldToScreenPos_80310EC
  is tail-called to turn the state''s world position into screen coordinates; the caller''s r5 is passed through
  untouched. Note deltas are computed with unsigned subtraction, so a backwards scroll wraps to a large positive
  value rather than going negative.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
