name: ow_tryTileInteraction_809DF00
address: '0x0809DF00'
kind: function
status: confirmed
summary: Handles the player attempting to interact with the tile in front of them, either rejecting it when interaction
  is blocked or forwarding the tile's interaction value to the game state.
interface: u32 ow_tryTileInteraction_809DF00(OWPlayerObject* r5 player, Toolkit* r10 toolkit); returns 1 if interaction
  was blocked, 0 otherwise; leaves r7 = GameState* and NZ/C/V flags reflecting the return value (NZ set from it,
  CV from the final mov r0,#0 path only on the non-blocked branch); lr clobbered.
details: Called when the player presses the interact action facing a tile. First calls sub_809E01C, which reports
  whether tile interaction is currently disallowed (e.g. during a cutscene or scripted sequence). If blocked (returns
  0), it stores 1 into GameState+oGameState_Unk_10 and returns 1. If allowed, it reads the overworld player object's
  byte oOWPlayerObject_Unk_0f — the interaction/coord value of the tile being faced — copies it to GameState+oGameState_CoordInteractionValue,
  and if it is nonzero also latches the same value into GameState+0x03; then returns 0. r7 is left holding the GameState
  pointer (loaded from toolkit+oToolkit_GameStatePtr) on both paths, and flags are set from the return value so
  callers can branch on 'blocked' directly.
