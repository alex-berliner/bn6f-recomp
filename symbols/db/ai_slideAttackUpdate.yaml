name: ai_slideAttackUpdate
address: '0x080F6994'
kind: function
status: probable
summary: AI melee attack that slides the enemy object across the panel row toward the target and arms
  a collision hit, resolving on contact or timer expiry.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = status (sub_80F71A8 result path); sets oAIAttackVars_HitElement
  when done
details: 'On first run (AttackElement==0) it initializes: sets AttackElement=4, gets a value via sub_80F7500(0xA),
  sets up collision data (id 0x51, types 2/3) via object_updateCollisionData, stores oAIAttackVars_Damage
  into oCollisionData_SelfDamage (low half) and the StaminaDamageCounterDisabler (high half), calls sub_80D4C0A
  on object+9 with 0xFF, and computes an X velocity with battle_calcPanelSlideStep from the object''s
  alliance (via dword_80F6A4C lookup) and AiDifficultyTier (byte_80F6A38: step values 0 or 2), storing
  the step count in oAIAttackVars_StepTimer. Each frame it adds XVelocity to X and checks sub_80F71A8
  (likely reached-target/wall check). When the slide completes it re-derives PanelX from coordinates,
  syncs collision panels, enters a new collision region if the panel changed (object_setCollisionRegion
  with 1), and counts down StepTimer; on expiry it sets HitElement=0x10, or 0x1c immediately if sub_80F71A8
  returned nonzero (blocked/no target).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r1, [byte_80F6A38 + AiDifficultyTier*4] + battle_calcPanelSlideStep -> XVelocity: per-difficulty
    slide speed in px/panel; ldr r0, [XVelocity]; add X -> str X: applies the slide movement each frame;
    strh r0, [SelfDamage] / strb [StaminaDamageCounterDisabler]: arms the contact damage from oAIAttackVars_Damage;
    ldrh [StepTimer]; sub #1; bge: timer in steps until the attack ends with HitElement=0x10, else 0x1c;
    object_setPanelsFromCoordinates + object_updateCollisionPanels + object_setCollisionRegion: keeps
    collision/panel state synced while sliding'
