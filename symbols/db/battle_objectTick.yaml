name: battle_objectTick
address: '0x080C7450'
kind: function
status: probable
summary: 'Per-frame update for a battle object: computes a param, then dispatches its current action handler,
  or destroys it when the battle is over.'
interface: (r5 = battle object) -> void; clobbers r0-r3,lr
details: r5 points to a battle object (fields oBattleObject_Param2, oBattleObject_CurAction, oBattleObject_CurStateActionPhaseAndPhaseInitialized).
  If battle_isBattleOver says the battle ended, the object's state is set to CUR_STATE_DESTROY. Otherwise
  sub_80C7572 computes a value stored into Param2, and unless a time-stop is active, the word at off_80C747C
  indexed by CurAction is called as an ARM routine (mov lr,pc; bx r1) — entry 0 is sub_80C7484, entry
  1 is sub_80C7524, so CurAction has at least two values. Time-stop skips the action handler but still
  updates Param2.
