name: ai_chatScriptTickStoreState38_808989C
address: '0x0808989C'
kind: function
status: confirmed
summary: If a battle-side check passes, runs chat-script kind 7 for the object in r5 and then writes state
  byte 0x38 to it, always returning 1.
interface: int sub_808989C(u32 r5 /* object ptr */, u32 r10 /* context */); returns r0 = 1; r2/r3 (and
  r1) come through from the kind-7 chat-script call when it runs; flags clobbered
details: 'Pushes r4-r7/lr and first calls battle_tickChipLockout_8089CB4 with the object pointer in r5
  (r10 carries surrounding context). If that call leaves Z set (nothing to do / lockout not expired),
  the routine skips everything and just returns. Otherwise it calls ai_runChatScript (sub_8089CA4) with
  r0 = 7 — script kind 7 — whose results stay in r1/r2/r3 and whose possibly-updated r5 is used as the
  store target; it then stores byte 0x38 at [r5]. 0x38 looks like a state/phase byte of the AI object
  (a known post-script state). Both paths fall through to mov r0,#1, so the caller always sees r0 = 1;
  the original''s pop restores its own saved r5, so r5 is preserved to the caller even though the chat-script
  call may return an updated pointer in r5 internally.

  '
