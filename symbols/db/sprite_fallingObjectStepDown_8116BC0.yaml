name: sprite_fallingObjectStepDown_8116BC0
address: '0x08116BC0'
kind: function
status: confirmed
summary: Steps a falling object 8 px downward each call until it reaches its per-state stop depth, then snaps it
  there and advances its phase byte to 4.
interface: void sub_8116BC0(void) // r5 = falling-object state struct; returns r0=4 (settled) or r0/r1 = read-back
  x/y via sprite_getCoordinates; sets nz cv
details: 'Moves the object''s sprite down by (x+0, y+8) via sprite_addCoordinates, then reads its coordinates back
  with sprite_getCoordinates (r0 = x, r1 = y). It reads the state byte at [r5+4], doubles it as a halfword index
  into the stop-depth table at byte_8116BEC (entries 0x20, 0x30, 0x40, 0x50, 0x60, 0x70, 0x80, 0x90), and compares
  that depth against the current y. If y is still above the depth (table value > y) the call returns without further
  changes; once y has reached or passed the depth, the y coordinate is snapped to exactly the table value via sprite_setCoordinates
  and phase 4 is stored into the state byte at [r5+9], marking the "landed/settled" phase of the falling-object
  script. r5 is never touched except for those two field reads/writes; the same [r5+4] index presumably selects
  both the fall distance and behavior in sibling phase functions.

  '
