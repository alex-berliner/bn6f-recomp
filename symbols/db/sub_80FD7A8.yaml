name: sub_80FD7A8
address: '0x080FD7A8'
kind: function
status: confirmed
summary: 'AI attack object "approach" countdown tick: when the timer elapses, snap onto the pre-reserved future
  panel, release the reservation, refresh coords/collision, and arm the next phase (animation 3, Unk_10=4, Unk_00=8).'
interface: void aiAttackObject_commitApproach_80FD7A8(oBattleObject* r5, oAIAttackVars* r7); /* clobbers r0,r2,r3,lr;
  flags nzcv; r1 preserved by tail of last call */
details: "Per-tick handler run from the AI attack object's update list. Reads/writes:\n  - oAIAttackVars_Unk_10:\
  \ 16-bit countdown, decremented each tick; signed (BGT),\n    so the body only fires once it hits zero or below.\n\
  \  - oAIAttackVars_Unk_00: 16-bit phase/next-timer, set to (0x8) on completion.\n  - oBattleObject_CurAnim: animation\
  \ index, set to (0x3).\n  - oBattleObject_FuturePanelX/Y -> oBattleObject_PanelX/Y: copy the pre-reserved\n  \
  \  landing panel into the current panel, effectively \"snapping\" the object\n    onto the tile it previously\
  \ reserved.\nCalls: object_removePanelReserve (release the panel reservation made earlier),\nobject_setCoordinatesFromPanels\
  \ (recompute world coords from the new PanelX/Y),\nobject_updateCollisionPanels (refresh collision bookkeeping\
  \ for the new tile).\nPreserves r4, r6; r1 is documented as the output register but is actually\nuntouched on\
  \ both the early-return and body paths (on the body path it ends\nup holding whatever object_updateCollisionPanels\
  \ left in r1).\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
