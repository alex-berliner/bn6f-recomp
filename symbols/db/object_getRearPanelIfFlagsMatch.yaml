name: object_getRearPanelIfFlagsMatch
address: '0x08107970'
kind: function
status: probable
summary: Returns the rear-panel coordinates (x in r0, y in r1) of a battle object only if object_checkPanelParameters
  confirms the rear panel matches the caller-supplied flag masks; on failure, returns x=0 with the computed
  y left in r1.
interface: '(r0 = battle object ptr, r1-r3: r2/r3 = panel-flag set/clear masks passed through) -> r0 =
  rear panel x (or 0 if check fails), r1 = rear panel y; flags clobbered'
details: The function negates object_getFrontDirection's +1/-1 side multiplier and adds the object's byte
  at +0x12, giving x of the panel opposite the object's facing, i.e. the tile behind it (y taken from
  +0x13). It preserves the caller's r2/r3 across the first call and forwards them to object_checkPanelParameters
  as the flag masks, so the panel-behind is tested against caller-chosen panel states. The computed x/y
  are kept live across the call via push/pop {r0,r1} and returned in r0/r1 when the check passes. On failure
  it zeroes r0 only, leaving r1 = y (so a failed check still reports y). Note r0=0 is ambiguous with a
  real x=0 tile, so callers likely only use it where the rear column is never 0 or only test nonzero.
