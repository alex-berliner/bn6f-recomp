- Which TextScriptArchive byte_809CEAC+4 refers to and the exact wording of scripts 0x32/0x34/0x33
- What r1 returned by petNaviTryGiveElementFolder counts (chip total vs threshold) and why 0x10/0xf get
  different scripts
- 'The flow matches: GetCurPETNavi -> (sub_809CE40 or reloadCurNaviBaseStats) -> reloadCurNaviStatBoosts
  -> petNaviTryGiveElementFolder(0) -> chatbox_runScript based on r1 count (0x10/0xf/else). However the
  proposal claims r0 is the script index (0x32/0x34/0x33) and r1 is set to it before the call, but chatbox_runScript
  takes (archive, script_idx), so r0 is the archive and r1 is the index — the code does `mov r1, r0` then
  loads r0 from byte_809CEAC+4. The summary is otherwise accurate but the script-idx names should be 0x33/0x34/0x32
  not 0x32/0x34/0x33.'
