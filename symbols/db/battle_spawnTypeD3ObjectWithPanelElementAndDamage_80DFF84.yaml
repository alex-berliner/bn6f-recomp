name: battle_spawnTypeD3ObjectWithPanelElementAndDamage_80DFF84
address: '0x080DFF84'
kind: function
status: confirmed
summary: Spawns a battle object of type 0xD3 and initializes it with a panel position, element, damage word, and
  the alliance/flip halfword of another object.
interface: BattleObject* battle_spawnTypeD3ObjectWithPanelElementAndDamage(u8 panelX /*r0*/, u8 panelY /*r1*/, u8
  element /*r2*/, BattleObject* sourceObject /*r5*/, u32 damageAndStamina /*r6*/); clobbers NZCV; returns object
  pointer in r0, old r0/r1/r2 shifted into r1/r2/r3, sourceObject preserved in r5; r4/r6/r7 untouched
details: 'A thin wrapper around object_spawnType3. It pushes r0-r2 and r5, calls object_spawnType3 with r0 = 0xD3
  (the battle object type to spawn); the spawner returns the new object pointer in r5 (NULL if creation failed).
  On success, the new object is filled in from the caller''s arguments: PanelX = old r0, PanelY = old r1, Element
  = old r2, the 32-bit DamageAndStaminaDamageCounterDisabler word = old r6, and the 16-bit AllianceAndDirectionFlip
  halfword is copied from the caller-supplied source object (old r5). The popped values shift one register (pop
  {r1-r3,r5} restores saved r0-r2 into r1-r3), so on return r1/r2/r3 hold the caller''s original panelX/panelY/element,
  and on the success path r3 is overwritten with the copied alliance halfword. Returns the new object pointer (or
  NULL) in r0 via mov r0, r5 which executes unconditionally. Quirk: if the spawn fails, the halfword copy and the
  field stores are skipped entirely and r3 keeps the original element value.'
