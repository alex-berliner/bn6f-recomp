name: drawPanel_800C01C
address: '0x0800C01C'
kind: function
status: confirmed
summary: draws one battle field panel's 5x3 block of BG tiles from its tile-set family
interface: 'static void draw_panel(u32 column, u32 row, u32 art, u32 side); adapter: in r0=column, r1=row, r2=art,
  r3=side, r10=toolkit; out r1-r7 (r4-r7 preserved, r1-r3 as iCopyBackgroundTiles leaves them)'
details: Looks up the panel's first BG tile column through the byte_800C0AA mirror table (row of 8 entries selected
  by BattleState+0xD, the flipped-field flag) and its first tile row as row*3+6. The tile-id set comes from byte_86DFA98
  + (art*6 + side*3 + row - 1)*0x20 — one 0x20-byte set per side and field row. On the flipped field families >=
  0xB are remapped (0xC becomes 0xB, anything else becomes 0xC, so an ART_BLANK 0xFF turns into family 0xC there)
  and the side inverts; family 0xFF on the normal field blanks the block with the all-zero ids at byte_800C08C.
  Copies the block into tile block 2 via iCopyBackgroundTiles (reached through its thumb stub).
