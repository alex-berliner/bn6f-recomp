name: battle_delayThenSetAction20
address: '0x080C1DA0'
kind: function
status: probable
summary: Battle object phase that waits 30 ticks then sets CurAction=0x20 and clears the phase fields
interface: (r5 = oBattleObject*) -> void; sets oBattleObject_PhaseInitialized, oBattleObject_Timer, oBattleObject_CurAction,
  oBattleObject_CurPhaseAndPhaseInitialized
details: On first entry, marks the phase as initialized (flag = 4) and sets a 30-tick timer. On subsequent
  entries, decrements the timer; when it hits zero, writes 0x20 into CurAction and clears CurPhaseAndPhaseInitialized
  to 0, handing control to the action-0x20 handler. The use of a fixed 30-tick delay with no input data
  suggests a simple 'pause this frame for half a second' inter-phase, common between battle actions.
