name: battle_checkNaviFreeze_800A1D0
address: '0x0800A1D0'
kind: function
status: confirmed
summary: Returns 1 if the player or enemy navi is under a freeze/slowdown status and the corresponding
  battle flag bit confirms it is currently in effect.
interface: 'battle_checkNaviFreeze_800A1D0(u32 r6, u32 r10) -> r0 (active: 0 or 1), r1 (flag bit consulted),
  NZ flags reflect r0'
details: Queries two battle-navi status bytes at offset 0x2C (player index 0, enemy index 1) for freeze/slowdown
  status values 0x17 or 0x18. If either navi carries such a status, it then tests battle flags bit 2 (FLAG_FREEZE);
  if the bit is set the function returns 1. If neither navi has the status, or the bit-2 test fails, it
  falls through to test battle flags bit 4 (0x10, FLAG_SLOWDOWN) and returns 1 if that bit is set. Early-exits
  returning 0 when battle_isTimeStop is true or battle_isBattleOver is non-zero. Touches the navi status
  table via GetBattleNaviStatsByte and the global battle-flag word via battle_getFlags. r1 is written
  with the flag mask consulted (2 or 0x10) on the flag-check paths but is clobbered by the helper calls
  on the early-exit paths.
