name: table_GetCurrentEntryHeader_8031760
address: '0x08031760'
kind: function
status: confirmed
summary: Reads the header bytes (signed count at +0, byte at +1, and byte at +2 when requested) of the current entry
  of the table pointed to by dword_2011A20.
interface: int table_GetCurrentEntryHeader(u32 mode) -> r0 = signed byte at entry+0, r1 = entry+2 byte (if mode==1)
  else 0, r2 = entry pointer, r3 = entry+1 byte, r5 = table base pointer
details: 'Reads the table base pointer from dword_2011A20 and fetches the current entry pointer from its +0x14 field
  (dword_2011A34). Then it loads the entry header: a signed byte at offset 0 (returned in r0, likely a count/charge/index
  value), an unsigned byte at offset 1 (returned in r3), and, only when the caller passes mode == 1 in r0, an unsigned
  byte at offset 2 returned in r1; otherwise r1 is cleared to 0. The entry pointer itself is always returned in
  r2 and the table base pointer in r5, so callers can walk the entry afterwards. All other modes of r0 (anything
  != 1) behave the same as mode 0. Clobbers flags only; returns via mov pc, lr, so it can be tail-called with any
  LR.

  '
