name: ai_waitAndCheckFrontPanelPhase
address: '0x080E5E44'
kind: function
status: probable
summary: 'Battle-object AI phase: on entry, if the panel directly in front matches a fixed panel-flag
  condition it triggers sub_80D4408, then waits 60 frames before advancing to action 0xC.'
interface: (r5 = battle object) -> r0 = 0; sets oBattleObject_Timer=60, PhaseInitialized=4, later CurAction=0xC
  and phase 0
details: 'Runs only when PhaseInitialized is 0 (the tst/bne guard), so it is the one-time setup + countdown
  body of an AI phase. It computes the facing multiplier via object_getFrontDirection, adds it to PanelX
  to get the panel in front, and tests it with object_checkPanelParameters using a per-alliance table
  at byte_80E5E98 (two 8-byte entries: required mask 0x00000010, forbidden mask 0x0F880080). If the panel
  matches, it calls sub_80D4408(r2=Element, r3=0, r4=Params, r5=DamageAndStaminaDamageCounterDisabler,
  plus r0/r1 coordinates preserved across the push). It then sets Timer=0x3C (60 frames) and PhaseInitialized=4;
  on subsequent calls it decrements Timer and, at zero, sets CurAction=0xC and phase 0.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: tst/bne on PhaseInitialized gates the setup block; end sets Timer=0x3C and PhaseInitialized=4;
    object_getFrontDirection + PanelX arithmetic targets the panel in front, passed with PanelY to object_checkPanelParameters;
    off_80E5E94 -> byte_80E5E98 supplies two per-alliance (required=0x10, forbidden=0x0F880080) panel-flag
    masks; on match, sub_80D4408 is called with Element/0/Params/Damage fields read from the object; Timer
    countdown ends with CurAction=0xC and phase 0, the standard next-phase dispatch pattern
  refs:
  - bn6f/asm/asm31.s:100298
  - 0x0800CC86 object_checkPanelParameters
  - 0x0800E2CA object_getFrontDirection
  - 0x080D4408 sub_80D4408
  reproduce: python3 tools/asmcat.py 0x080E5E44
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-010606'
open_questions:
- What sub_80D4408 does (likely a damage/effect application given Element/Params/Damage args) to name
  the action taken on success
- Which panel flag 0x10 is (e.g. hole/broken) and which flags 0x0F880080 forbids
- Which AI phase value 4 and action 0xC correspond to in the object's state machine
