name: t3_0x6f_80D2460
address: '0x080D2460'
kind: function
status: confirmed
summary: Battle-object state machine dispatcher that jumps to the handler for the object's current state (init/enter,
  active update, or destroy).
interface: void battleObject_stateDispatcher_80D2460(battleObject* obj /* r5 */); tail-call dispatch, handler results
  left in r5 r8 r9 r10 r11 r12, flags clobbered
details: "Generic per-object state machine tick. The battle object pointer is passed in r5; it reads the\nobject's\
  \ current state byte (oBattleObject_CurState) and indexes the jump table jt_80D2474 with\nthe raw byte as an *unscaled*\
  \ word offset, so valid states are 4 apart (0, 4, 8 in this table).\nDispatch:\n  state 0 -> battleObject_initAppearOrEntryFromSide_80D2480\
  \ (spawn/appear or enter from a side)\n  state 4 -> sub_80D24F0 (active per-frame update, purpose unknown)\n \
  \ state 8 -> object_genericDestroy (free/remove the object)\nUses the classic mov lr, pc; bx r1 trick to call\
  \ the Thumb handler, then pops pc to return.\nThe handler receives the object in r5 and the state byte still in\
  \ r0 (r1 still holds the\nhandler address at branch time), and its r5/r8-r12 results flow straight back to the\
  \ caller.\nThis looks like a shared template (t3 = task/template slot 0x6f) instantiated for a specific\nobject\
  \ type; other object templates would swap in different handler tables.\n"
