name: sub_802F81C
address: '0x0802F81C'
kind: function
status: confirmed
summary: Handles menu navigation inputs (Start to exit, L/R to cycle selection index) for a small in-game menu.
interface: void sub_802F81C(u32 toolkit_ptr /* r10 */, u8 *menu_state /* r5 */, u32 arg2 /* r2 */);
details: "Reads joypad state through the toolkit's joypad pointer. Two menu_state\nbytes matter: byte 8 = current\
  \ selection index, byte 9 = item count.\n- On Start/Select (pressed & 0x09): if a screen fade is already running,\n\
  \  do nothing; otherwise call musicGameState_8000784, play SE 0x9D, set\n  menu_state[1] = 0x10 (a \"return to\
  \ overworld\" flag), and kick off a\n  screen fade (type 0xC, speed 0x10).\n- On L (held & 0x40): decrement byte\
  \ 8 with wrap (0 -> count-1); play\n  SOUND_UNK_66 on actual change.\n- On R (held & 0x80): increment byte 8 with\
  \ wrap (count -> 0); play\n  SOUND_UNK_66 on actual change.\nOther buttons are ignored. L/R use the \"Held\" field\
  \ rather than\n\"Pressed\", so the menu scrolls continuously while the shoulder is held.\n"
