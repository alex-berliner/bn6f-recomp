name: sub_812B2C4
address: '0x0812B2C4'
kind: function
status: probable
summary: 'Per-frame animated-sprite step: queues one OAM entry for the entity''s current animation frame and advances
  to the next frame when the frame timer expires.'
interface: (r0 = offset/id selecting a byte in the entity record r5, r5 = entity/anim-state record) -> void; r4,
  r6 preserved, r0-r3 clobbered
details: 'r5 is an animation-state record: [r5+0x17] is the current animation row index, [r5+0x18] a frame-delay
  countdown, and bit0 of [r5+0x1b] an enable/pause flag that skips the whole routine. The byte [r5+r0] selects a
  19-tile (0x13) slot, giving tile base 0x80000 | (byte*0x13 + 0x1D). It then calls battleObject_queueOamFromTableRow
  with r2 = current frame index [r5+0x17], r3 = tile/attribute table byte_8129178, r1 = 0x20004 and r4 = 0x40000000
  as packed OAM attribute words, queuing exactly one sprite. After queueing it decrements [r5+0x18]; when it reaches
  0 it calls battleObject_advanceAnimTableBy0xFF on the frame-index table dword_8129180 and stores the returned
  row index into [r5+0x17] and the returned frame delay into [r5+0x18]. Effectively this renders one frame of a
  looping animation and steps the animation table on a timer.'
