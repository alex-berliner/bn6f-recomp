name: entity_runAllUpdateHandlers_80465BC
address: '0x080465BC'
kind: function
status: confirmed
summary: Each frame, walks a 15-entry array of 0x58-byte entity records and calls the update handler selected by
  each active record's type byte.
interface: 'void sub_80465BC(void); // pure dispatcher: r0 not read, r2/r3 pass through untouched; handlers are
  called via blx-style bx lr with r0 = handler address itself, r1 = type*4, r5 = record pointer, r7 = record index
  (0..14)'
details: 'Iterates the fixed 15-slot array at eStructArr2008450 with a 0x58-byte stride.

  A slot is active when bit 0 of the flag byte at +0 is set (R1 is preloaded with 1

  before the test, so inactive slots just leave r1 == 1). For active slots, the byte

  at +1 is an index into the handler pointer table off_804646C (entry = byte * 4).

  The handler is invoked with lr = pc (ARM-style "call that returns to thumb via

  bx lr" idiom), receiving r0 = the handler''s own address from the table, r1 = the

  scaled type index, r5 = pointer to its 0x58-byte record, and r7 = its slot index;

  r2/r3 and r8-r12 pass through unchanged. r7 is pushed/popped around the call so

  the loop counter survives whatever the handler does to it. The loop''s final

  "cmp r7, #0xF" leaves carry set and overflow clear on exit, and r1 is 1 if the

  last slot was inactive, otherwise whatever the last handler returned in r1.

  The 0x58-byte records and per-type handler table suggest a lightweight

  entity/object system (15 concurrent objects) rather than the main battle

  entity list; handlers presumably read/write fields inside their own record.

  '
