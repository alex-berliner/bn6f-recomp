name: sub_80A5A1C
address: '0x080A5A1C'
kind: function
status: probable
summary: Copies a stored position triple into a battle object's position fields (current and target), then turns
  the object's navi sprite to face the same direction as the overworld player.
interface: (r5 = battle object) -> r0 = direction octant from the final anim call; no meaningful return
details: Reads three words at byte_2000EC0+0xC8 (= dword_2000F88) and writes them twice into the object at r5+0xC..0x14
  and r5+0x24..0x2C, i.e. two parallel X/Y/Z slots (likely current and destination position). It then calls ReadOWPlayerObjectCoords
  to get the overworld player's actual X/Y, subtracts the stored position from it, and passes the delta to battle_calcAngleOctant_800118A,
  whose octant result drives the facing-aware animation swap at 80A598C so the sprite matches the OW player's facing.
  Finally it sets the object's state byte at r5+0 to 3 and copies the byte at byte_2000EC0 to r5+9 (likely an anim/frame
  or subtype field). The mirrored-state copy and byte 3 write suggest this is a 'copy of the player' battle object
  (the Beast-Out shrine's fake player) being aligned to the real player each update.
