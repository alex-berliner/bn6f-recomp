name: oAIAttackVars_ScratchPointerOrPanel
address: '0x3c'
kind: struct-field
status: probable
summary: Scratch field reused per-attack — either a heap-allocated handle from sub_800FE28/sub_80D4C0A
  or a small panel/counter value (e.g., ChargeCycles>>1, packed PanelXY), depending on the attack in progress.
details: The same slot is loaded as a full 32-bit word in five places (e.g. `str r0, [r7,#oAIAttackVars_Unk_3c]`
  after `bl sub_800FE28` at asm31:156508), strongly indicating a heap pointer — yet at asm32:10598 it
  is written with `oBattleObject_PanelXY` (a packed 16-bit coordinate) and at asm31:175084 with `ChargeCycles>>1`
  (a tiny loop threshold compared to `ChargeCycles`). These uses are incompatible for a single u8; the
  field is shared scratch space across different attack routines.
