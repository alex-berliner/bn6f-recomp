summary: Initialises four fixed EmotionData slots (type 0x1C, tag 0x09) from a static flags table as part
  of cutscene battle-scene setup.
interface: () -> r0 = clobbered; fills EmotionData slots 0..3 of the 0x02008450 EWRAM array
details: 'Loops r4 = 0..3, passing r0 = 0x1C (type byte), r1 = slot index, and r2 = a word read from the
  table at byte_81313B0 with stride 4: words 0x00000800, 0x00000001, 0x00010001, 0x00020001. Each call
  goes to battle_initEmotionTableEntry_8046670, which stamps a 0x58-byte EWRAM slot with the type, the
  fixed tag 0x09, and the passed flags value. The table is inlined in the function''s literal pool area
  (byte_81313B0, 16 bytes). It takes no arguments and returns nothing; it is purely a fixed-table bulk
  initialiser. Called only by init_cutsceneSceneState, so these entries are part of the scripted cutscene
  battle scene state.'
