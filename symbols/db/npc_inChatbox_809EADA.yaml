name: npc_inChatbox_809EADA
address: '0x0809EADA'
kind: function
status: confirmed
summary: Per-frame update for an overworld NPC whose state is "standing in a chatbox" — dispatches its CurAction
  handler, then refreshes sprite and interaction areas.
interface: void npc_chatboxStateUpdate(OverworldNPCObject *self /* r5 */); no meaningful return value, flags and
  r0-r3+ scratch are caller-agnostic (contract shows nz/c/v in and out but no caller reliance documented)
details: 'Overworld NPC state handler (self comes in via r5, part of the caller''s

  register convention, not a normal argument). Reads the NPC''s CurAction

  byte (oOverworldNPCObject_CurAction, offset 9) and uses it to index the

  dispatch table at off_809EAFC; that table currently has a single entry,

  npc_inChatbox_curAction_809EB04, so this state only supports one action.

  The handler is tail-called via bx with lr = pc (a manual "call" that lets

  the handler return straight back here). After the action handler returns,

  the function calls sprite_update to refresh the NPC''s sprite, then

  npc_createInteractionAreas_809F526 to rebuild the interaction/hit areas

  used for player-initiated chat. Finally it tests bit 0x40

  (OW_NPC_UNK_FLAGS_60_0x40) of UnkFlags_60 (a 32-bit field at the NPC

  object); if set, it calls sub_809F922 (purpose unknown — some follow-up

  per-frame task gated by that flag), otherwise it just returns. Quirk: in

  the not-taken branch the NZ flags from the TST are left live on return,

  which is likely incidental rather than part of the contract.

  '
