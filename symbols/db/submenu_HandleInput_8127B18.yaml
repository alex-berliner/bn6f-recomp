name: submenu_HandleInput_8127B18
address: '0x08127B18'
kind: function
status: confirmed
summary: 'Submenu screen input handler: B cancels/exits (with fade), A activates (when state allows),
  Start toggles, and held-input refresh redraws the background.'
interface: "void submenu_HandleInput_8127B18(/*in*/ u32 submenuStatePtr in r5,\n                     \
  \              /*in*/ u32 toolkitPtr in r10,\n                                   /*in*/ u32 ignored\
  \ in r2,\n                                   /*out/clobber*/ r4 r5 r6 r7 r8 r9 r10 r11 r12 + nz c v)\n"
details: "Dispatches B/A/Start plus a refresh-on-held-input tail for one submenu screen whose state\n\
  struct lives at r5 and whose toolkit ptr is r10. Field r5+0x1E is a \"can-activate\" gate; the\nfunction\
  \ only honors A/Start/refresh when it is non-zero, while B always cancels.\n  - JOYPAD_B -> submenu_ConfirmExitAndFade_811FB64(8):\
  \ back out and trigger a fade-out (value 8\n    is the exit code, matching the SOUND_MENU_SELECT-style\
  \ magic numbers used elsewhere).\n  - JOYPAD_A -> sub_8128318 (open/confirmation action), sub_8128008\
  \ (rebuild list/menu items),\n    bg_ReloadBackgroundRegion_5_3_81281C0 (redraw BG region 5_3), PlaySoundEffect(SOUND_MENU_SELECT).\n\
  \  - JOYPAD_START -> store 0x0C at r5+2 (set next state/phase to 0x0C), PlaySoundEffect(SOUND_MENU_SELECT),\n\
  \    then sub_8120CC8(0, &dword_8127980) returning two bytes that are stored at r5+0xF and r5+0x10\n\
  \    (cursor/selection snapshot).\n  - Held-input tail: reads toolkit->oToolkit_JoypadPtr->oJoypad_LowSensitivityHeld\
  \ and calls\n    sub_811F7F8(held, 4, 0, 0); if it returns non-zero the menu is rebuilt via sub_8128008\
  \ and\n    bg_ReloadBackgroundRegion_5_3_81281C0 (auto-scroll / repeat navigation).\nFunction is called\
  \ via tail of a `bl sub_8127B18` from a submenu screen loop; r5 and r10 are\nthe caller-owned working\
  \ pointers (r5 = per-screen state, r10 = oToolkit from the caller).\n"
