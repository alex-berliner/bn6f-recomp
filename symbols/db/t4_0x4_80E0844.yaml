name: t4_0x4_80E0844
address: '0x080E0844'
kind: function
status: confirmed
summary: Per-tick battle object dispatcher that reads the object's state byte and calls its state handler (init,
  main step, or free-memory teardown).
interface: void t4_0x4_80E0844(void); /* r5 = battle object; returns whatever the state handler returns (pass-through)
  */
details: 'Dispatches a battle object''s per-tick behavior from its state byte at oBattleObject_CurState (offset
  8). The state value is used directly as a byte offset into the jump table at off_80E0858, so stored state values
  are 0, 4 or 8: 0 -> sub_80E0864 (init/idle step), 4 -> sub_80E08A6 (main step), 8 -> object_freeMemory (teardown,
  releasing the object). The handler is entered with r0 = state byte and r1 = the fetched Thumb entry address. ''mov
  lr, pc; bx r1'' plus ''pop {pc}'' makes this a pass-through call: the handler''s register results and flags flow
  straight through to this function''s caller, and lr/sp end up unchanged. States outside 0/4/8 never occur in the
  game; the original would index past the table.

  '
