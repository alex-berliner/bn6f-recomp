name: sub_81375F4
address: '0x081375F4'
kind: function
status: hypothesis
summary: Selects one of two u32 values (0x40000000 or 0x50000000) by index and passes them, plus fixed constants
  0x2E40/1/2, to the common handler at loc_8001048.
interface: void dispatchSelectedParam_81375F4(u32 arg0, u32 arg1, u32 tableIndex /*0|1*/); /* r0,r1 passed through
  to callee; r10 preserved */
details: 'r2 is used as a 0-based index into a 2-entry u32 array at byte_813760C

  (entry 0 = 0x40000000, entry 1 = 0x50000000). The selected value becomes

  the new r2 for the callee. r3 is set to 0x2E40, r4 to 1, r5 to 2 before

  branching to loc_8001048 (a generic parameterized routine with no

  generated wrapper). r4/r5 are saved and restored around the call so the

  original caller''s values are unchanged. r0, r1, r10 are transparently

  passed through. The nzcv/v flags are clobbered by the callee.

  '
