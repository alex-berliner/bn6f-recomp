name: battle_buffTwoStatsPlus2OnEventF6_801A720
address: '0x0801A720'
kind: function
status: confirmed
summary: When a battle object receives collision event 0xF6, raises two of its navi battle stats (offsets 0x18 and
  0x19) by 2 each, capped at 7, then runs a follow-up handler.
interface: void sub_801A720(BattleObject* obj /* r5 */); preserves r4/r6/r7, clobbers r0-r3 and lr, and leaves C/V
  set from the final comparison (the event-type cmp on the early-exit path, the cap check or sub_801A77A otherwise)
details: 'Loads the object''s collision data pointer from r5+oBattleObject_CollisionDataPtr and reads the event
  byte at offset 0xA4 of that data. If it is not 0xF6 the function does nothing (early return, flags left from that
  comparison). Otherwise it reads navi stat byte 0x18 via GetBattleNaviStatsByte_AllianceFromBattleObject, adds
  2, clamps to 7 using a *signed* compare (ble), and writes it back with SetBattleNaviStatsByte_AllianceFromBattleObject;
  then repeats exactly the same read/add/clamp/write for stat byte 0x19. Finally it tail-calls sub_801A77A (still
  with the object in r5), whose result/flags are the ones seen by callers on the normal path. The clamp is done
  in r2 after each Get, so the caller-visible r2 output is the clamped value of stat 0x19 (or stale flags-only data
  on the early-exit path). The stats are per-battle stat modifiers (attack/rapid-style buffs capped at 7, i.e. the
  usual +N battle-chip/stat cap range 0..7). r4 is pushed/popped purely as a save slot but the C model reads it
  as collisionData, so it is nominally clobbered mid-function yet restored on exit.

  '
