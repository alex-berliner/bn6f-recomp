name: chatbox_E5_nop
address: '0x08040E90'
kind: function
status: confirmed
summary: No-op chatbox script opcode 0xE5 that advances the script pointer and returns 2 to keep the chatbox driver
  running.
interface: uint32_t chatbox_E5_nop(uint8_t *script /* r4 */)
details: 'Handles script byte 0xE5 for the chatbox text/script interpreter. It is a deliberate

  no-op: it skips the opcode byte itself by incrementing the script pointer (r4) by 1

  and returns the constant value 2 in r0. The return value is the same value other

  script opcodes use to signal "continue script execution" to the chatbox state machine.

  No other registers or memory are touched; r0 is clobbered, r4 (the script pointer)

  is updated in place, and the ARM flags (N, Z, C, V) are set according to r0 = 2

  (so N=0, Z=0, C=1, V=0). The function is one of a family of small `chatbox_XX_<mnemonic>`

  handlers dispatched from the chatbox script runner, each returning 2 to mean

  "advance / keep going" or another value to change driver state.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
