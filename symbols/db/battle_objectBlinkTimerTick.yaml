name: battle_objectBlinkTimerTick
address: '0x080C03D4'
kind: function
status: probable
summary: 'Per-frame tick for a blinking battle object: flickers it for Param2 frames (toggling the render
  flag every 3 ticks), then switches it to action 4.'
interface: (r0/r1 unused; r5 = battle object) -> mutates object fields; r0 clobbered, flags from sub/bic
details: Runs on the current battle object in r5. Each call sets bit 0x2 of oObjectHeader_Flags (a render/visibility-style
  flag) and decrements Param3; when Param3 reaches 0 it reloads it with 3 and clears bit 0x2, so the object
  flickers on a 3-frame cycle. Independently it decrements Param2, the total blink duration; when that
  expires it sets oBattleObject_CurAction = 4 and zeroes CurPhaseAndPhaseInitialized, moving the object
  to its next action state. Typical 'invincibility/blink after hit then resume' handler.
