name: battle_stepToFrontPanel_80D8BBC
address: '0x080D8BBC'
kind: function
status: confirmed
summary: Advances a battle object one panel in its facing direction, stores the resulting panel and pixel
  coordinates.
interface: void battle_stepToFrontPanel_80D8BBC(r5 = object) -> r2 (pixel Y from getCoordinatesForPanels)
details: 'Reads oBattleObject_FrontDirection via object_getFrontDirection(r5). Computes future panel X
  as front-direction delta + current oBattleObject_PanelX; future panel Y is unchanged from oBattleObject_PanelY.
  Stores both into oBattleObject_FuturePanelX/Y (byte-sized). Calls object_getCoordinatesForPanels with
  (futureX, futureY) to obtain pixel-space coordinates; stores the X pixel result (r0) into oBattleObject_ExtraVars
  as a 32-bit write. r2 (pixel Y) is left by the callee and is the function''s observable output per the
  register contract. Quirk: ExtraVars is overwritten wholesale (u32 str), so any prior content there is
  lost. The front-direction value is treated as an additive delta rather than an index into a direction
  table, suggesting directions encode panel offsets (e.g. 1=right, -1=left, 0=vertical movement handled
  by Y).'
