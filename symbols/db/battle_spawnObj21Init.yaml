name: battle_spawnObj21Init
address: '0x080E2C80'
kind: function
status: probable
summary: Spawns battle object 0x21 via object_spawnType4 and, on success, initializes several of its fields
  from the caller's registers and a source object.
interface: (r0 = stack-arg word for the spawner, later stored to obj+0x12; r1 -> obj+0x13; r2 -> obj+0x0e;
  r5 = source object -> obj+0x4c; r6 -> obj+0x2c; r7 -> obj+0x30) -> r0 = new object or null; flags Z
  from the null check
details: 'The helper pushes r0-r2,r5 so that the original r0 becomes the fifth (stack) argument to object_spawnType4,
  called with r0=0x21 as the object id. The wrapper returns the new object pointer such that the lsls-encoding
  ''mov r0,r5'' sets Z, letting the beq skip all initialization when the spawn failed. On success the
  new object gets byte fields +0x12/+0x13/+0x0e from the entry values of r0/r1/r2, the word +0x4c set
  to the source pointer r5, and the halfword +0x16 copied byte-for-word from [r5+0x16], linking the new
  object to the source object''s state. Words +0x2c and +0x30 are taken from r6/r7. Quirk: r6 and r7 are
  consumed but never saved, so this must be a specialized helper whose (unknown) callers treat them as
  scratch.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x21 + bl object_spawnType4: spawns battle object id 0x21 with r1-r3 plus the pushed
    old r0 as the five parameters; pop {r1-r3,r5} right after the call cleans the 4-word frame used to
    pass the stack argument and recovers the field values; mov r0,r5 assembles to lsls r0,r5,#0, so the
    following beq is a null-check on the spawn result before field setup; strb/str to +0x0e,+0x12,+0x13,+0x2c,+0x30,+0x4c
    write the new object''s fields from caller registers; ldrh r1,[r5,#0x16]; strh r1,[r0,#0x16] copies
    a halfword from the r5 source object into the spawn'
  refs:
  - bn6f/asm/asm31.s:93507
  - 0x080033AC object_spawnType4
  reproduce: python3 tools/asmcat.py 0x080E2C80
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No callers are known, so the meaning of the entry arguments (what ends up in +0x12/+0x13/+0x0e/+0x4c)
  and the identity of battle object id 0x21 are unconfirmed
- Why r6/r7 are not saved — whether this is a real ABI quirk or the function bounds/prologue are misidentified
- What battle-object fields +0x16, +0x2c, +0x30, +0x4c mean in the battle object struct
