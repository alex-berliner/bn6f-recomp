name: sub_814E7A4
address: '0x0814E7A4'
kind: function
status: hypothesis
summary: Resets two status bytes of a battle-side struct and ORs a mode value (0xC or 3) into its flags byte depending
  on a delay/counter byte.
interface: void battle_resetActionState(struct* r1); /* writes bytes +0x00, +0x16, +0x1A of *r1; returns r2 = mode
  (0xC or 3), r3 = new flags byte; N/Z set from OR result, C=1/V=0 left over from the CMP */
details: Takes a pointer in r1 to a small battle-related status structure. It clears the byte at +0x16 and the byte
  at +0x1A (likely per-frame or per-tick status/latched flags), then reads the byte at +0x18, which appears to be
  a counter/delay field. If that byte is 0 the constant 0xC is chosen, otherwise 3; this value is OR'd into the
  flags byte at +0x00, so it only sets bits and never clears ones already present in the low byte. The chosen mode
  value and the resulting flags byte are left in r2/r3 as outputs, and the ORR preserves the C=1/V=0 condition produced
  by the CMP, which callers could theoretically read. The byte 0 padding after the BX suggests it sits immediately
  before another routine in the same battle module. Exact meaning of the 0xC-vs-3 distinction is unknown without
  caller analysis; this looks like an action/hit-state reset where 0xC marks a "no delay" path.
