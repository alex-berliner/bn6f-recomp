name: NPCCommand_write_hidden_oam_pieces
address: '0x0809EF60'
kind: function
status: confirmed
summary: NPC script opcode handler that reads a 32-bit operand from the script and stores it as the NPC's hidden
  OAM pieces value.
interface: Next npcScriptCmd_SetHiddenOAMPieces(NPCObject* npc /* r5 */, u8* scriptPtr /* r6 */); returns operand
  in r0, scriptPtr advanced by 5 in r6, flags set by the pointer increment
details: 'Overworld NPC script opcode handler. The script stream format is one opcode

  byte followed by a 32-bit little-endian operand; the handler calls

  ReadNPCScriptWord on (scriptPtr + 1) to fetch that word and stores it into

  the NPC object at oOverworldNPCObject_HiddenOAMPieces. It then advances the

  script pointer by 5 (opcode byte + 4-byte operand) so execution continues

  with the next opcode. The hidden OAM pieces field appears to configure

  extra/hidden sprite pieces drawn for the overworld NPC; the exact meaning of

  the stored value is not established here. r1-r3 and the nz/c/v flags in the

  contract come from the ReadNPCScriptWord call and the final `add r6, #5`

  respectively; callers of these opcode handlers typically ignore them.

  '
