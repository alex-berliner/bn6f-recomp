name: battle_beastSpBuildSpriteMaskFromFlagTable
address: '0x08118658'
kind: function
status: confirmed
summary: Builds a 32-bit element-visibility mask for a battle beast's sprite by consulting a flag table obtained
  through the AI-dispatch lookup, then applies it via sprite_setUnk0x2c.
interface: 'battle_beastSpBuildSpriteMaskFromFlagTable(void) – in: r5 (caller-saved context), r6 (battle-beast sprite
  object ptr), r10 (unmodified, passed to callee); out: r0–r3, r8–r12, all flags; r4–r7 preserved.'
details: 'Reads two 16-bit tile-attribute words at sprite+0x38 and sprite+0x3A, sums them, shifts left 2 to get
  a byte offset into the word_201DA80 lookup table (indexed by (attr_hi+attr_lo)*4), loads a 16-bit entry, and subtracts
  0x90 to yield a dispatch table index. Palette byte at sprite+0x0E is passed alongside the index to battleObject_runAIDispatchTable_813B7A0,
  which returns a pointer (r0) to a per-beast flag structure. Starting at r0+8, the routine walks 0x31 (49) flag
  bytes: for each nonzero byte the corresponding bit (starting at bit 31, shifting down) is cleared in a 0xFFFFFFFF
  mask. After every 5 flags the table pointer and the loop counter each advance by an extra 2 bytes, implementing
  7-byte rows (5 flags + 2 pad). The final mask, together with the dispatch callee''s r5 (returned as the struct
  member dispatch_r5), is passed to sprite_setUnk0x2c to commit the visibility mask onto the sprite. r2 is left
  holding the residual shift value (0x80 >> n) on return. The function does not write back to the sprite object
  itself; side effects are entirely within sprite_setUnk0x2c.

  '
