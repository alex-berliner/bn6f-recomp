    on Timer expiring leads to ''mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]'';
    callees'' known summaries (cross panel highlight, dimming collision path) match a telegraph-then-repeated-hit
    attack pattern'
