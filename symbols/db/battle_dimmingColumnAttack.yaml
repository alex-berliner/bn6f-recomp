name: battle_dimmingColumnAttack
address: '0x080C6E90'
kind: function
status: probable
summary: Battle-object state that on first frame derives the target column from Param3 via sub_80C6F08,
  sets a cross-shaped warning via battle_highlightCrossPanels at Param4, and every 30 frames spawns a
  dimming collision lane toward that column via battle_spawnDimmingCollisionPath, destroying itself when
  the Timer expires.
interface: (r5 = battle object; no args) -> updates oBattleObject fields in place; no return value, sets
  state to CUR_STATE_DESTROY when finished
details: On phase 0 (oBattleObject_CurPhase == 0) it advances the phase to 4, derives the target column
  in oBattleObject_Param4 from oBattleObject_Param3 via sub_80C6F08, loads the duration into oBattleObject_Timer
  from oBattleObject_Param2, seeds Timer2 with 1, and calls sub_80C6FC8 with Timer and Param4 (likely
  registering the attack timing/layout). Every frame it draws the cross-shaped warning area at column
  Param4 via battle_highlightCrossPanels and decrements Timer; when Timer reaches 0 the object is destroyed.
  While Timer2 counts down, each time it hits 0 it resets Timer2 to 0x1E (30 frames) and calls battle_spawnDimmingCollisionPath
  with Param4, spawning a lane of dimming panels up to 4 panels toward the target column plus a two-tile-tall
  column there — i.e., the actual damaging hit region repeats on a 30-frame cycle.
