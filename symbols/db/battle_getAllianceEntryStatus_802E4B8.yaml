name: battle_getAllianceEntryStatus_802E4B8
address: '0x0802E4B8'
kind: function
status: confirmed
summary: Looks up the battle object's alliance entry and returns a status code depending on which flag bytes are
  set in it.
interface: '// in: r5 = battle object ptr (oBattleObject_Alliance read)

  // out: r0 = status code (9, 0xD, or 1); r1 = 0x54 left behind on the +0x54-check paths

  // clobbers: NZCV; r7 preserved (pushed/popped)

  int getAllianceEntryStatus(void /* r5=this */);'
details: 'Reads the object''s alliance slot index (byte at oBattleObject_Alliance in the battle object at r5) and
  fetches the corresponding entry pointer via getEntryPtr_2036120_1D0_802E070 (alliance table at 0x2036120, 0x1D0-sized
  entries). Then returns a small enum in r0: 9 if the byte at entry+0x50 is nonzero, else 0xD if the byte at entry+0x54
  is nonzero, else 1. These look like faction/affiliation state codes used elsewhere in battle logic (e.g. deciding
  how an object relates to allies/enemies); the exact meaning of 9/0xD/1 is not confirmed from this function alone.
  Quirk: r1 is loaded with 0x54 before the second test and is not cleaned up, so callers must not rely on r1; the
  0xA000 word after the function is padding/data, not code.'
