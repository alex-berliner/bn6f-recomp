- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r2,[r7,#oAIAttackVars_InitFlag] / ldrb r4,[r7,#oAIAttackVars_AiDifficultyTier] / ldr r6,[r7,#oAIAttackVars_Damage]
    load AI attack vars; values in r2/r4/r6 are the only setup before bl sub_80D5EB0, so they are its
    arguments; only caller 0x080F7238 ai_pickRandomMatchingPanels 'invokes a per-panel effect', matching
