name: ai_performPanelEffect
address: '0x080F73BC'
kind: function
status: probable
summary: Wrapper that pulls init flag, AI difficulty tier and damage from the current AI attack vars and
  passes them to the per-panel effect routine used by the panel-targeting AI attack.
interface: (r7 = oAIAttackVars struct, no args in registers) -> r0 = result of sub_80D5EB0; r0 = oAIAttackVars_InitFlag,
  r1 = oAIAttackVars_AiDifficultyTier, r2 = oAIAttackVars_Damage
details: 'Pure argument-marshalling thunk: it reads three fields out of the oAIAttackVars structure addressed
  by r7 — the byte InitFlag, the byte AiDifficultyTier, and the word Damage — then calls sub_80D5EB0 with
  those as r0-r2 and returns its result. It saves only r4 and r6 (loaded but unused locally, presumably
  clobbered by the callee). Its only known caller is ai_pickRandomMatchingPanels, which per its summary
  picks shuffled candidate panels and invokes a per-panel effect, so this is that per-invocation effect
  call. The actual behaviour is entirely delegated to sub_80D5EB0, which is undocumented, so the effect
  itself (damage application, panel change, etc.) is not visible here.'
