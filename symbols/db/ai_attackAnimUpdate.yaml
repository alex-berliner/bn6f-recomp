name: ai_attackAnimUpdate
address: '0x0810A462'
kind: function
status: probable
summary: 'Per-frame AI attack-state handler: plays/restarts the attack animation (anim 3) and counts down
  a 20-frame timer before leaving the attack state.'
interface: () -> r0 = scratch only; touches r5 = battle object (oBattleObject_CurAnim), r7 = AI attack
  vars (StepTimer, HitElement); no return value
details: 'If the object''s current animation is 3 (the attack anim), it calls sprite_getFrameParameters
  and tests attribute bit 0x80 (a hidden/end frame); when seen it resets CurAnim to 0. It then calls sub_810A534
  (the attack trigger/condition check, still unnamed); on a nonzero result it arms the attack: sets CurAnim
  = 3, StepTimer = 0x14 (20 frames) and HitElement = 0xC, then returns. Otherwise it decrements StepTimer
  each frame and, when it reaches zero, calls object_exitAttackState to leave the attack. The HitElement
  = 0xC write suggests the attack''s element/type is fixed for whatever move this handles.'
