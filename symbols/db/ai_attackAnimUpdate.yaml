  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurAnim] / cmp #3 gates the sprite_getFrameParameters call, whose
    0x80 attribute-bit test resets CurAnim to 0; nonzero return of sub_810A534 stores CurAnim=3, StepTimer=0x14
    and HitElement=0xC before returning; zero path decrements oAIAttackVars_StepTimer and calls object_exitAttackState
    when it hits 0; uses known battle-object and oAIAttackVars fields, matching an AI attack step routine;
    recorded in battlesweep and beastsp routes, consistent with enemy/boss AI attack execution'
