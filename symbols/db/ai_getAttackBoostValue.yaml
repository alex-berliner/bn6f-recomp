    and oAIAttackVars_TimerOrCycles; caller context: battle_getAiDifficultyTier_800FE36 and ai_loadAttackParams(1)
    immediately precede, so the lookup is part of AI attack setup; byte_8107F40 = {0x10,0x10,0xC,0xC,0x8,0x8,0x8,0x8}:
