name: ai_getAttackBoostValue
address: '0x08107F24'
kind: function
status: probable
summary: Calls sub_800FE28 twice on byte_8107F40 and byte_8107F40+4 to look up AI attack boost parameters
  (indexed by difficulty tier set just before in the caller), returning only the first result in r0; the
  second result in r1 is unused.
interface: () -> r0 = value from byte_8107F40[...] via sub_800FE28, r1 = value from byte_8107F40+4 lookup;
  flags clobbered
details: Takes no arguments; calls sub_800FE28 with &byte_8107F40, saves the result, then calls it again
  with &byte_8107F40+4, returning the first result in r0 and the second in r1. byte_8107F40 is a small
  ROM table {0x10,0x10,0xC,0xC,0x8,0x8,0x8,0x8}, and the base/+4 split suggests two adjacent sub-tables
  (or a pair of values per entry) selected inside sub_800FE28, likely by the AI difficulty tier fetched
  just before in the caller. The caller (sub_8108046, an AI attack initializer that sets InitFlag, loads
  attack params with ai_loadAttackParams(1), and sets attack 0xb) uses only r0, storing it to both oAIAttackVars_AttackBoost2
  and oAIAttackVars_TimerOrCycles; the r1 result is unused there.
