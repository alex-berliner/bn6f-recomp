name: battle_timerTriggerRelatedObject
address: '0x080E3CC4'
kind: function
status: probable
summary: Battle object that plays a sound/animation, waits Param1 frames, then activates its related object
  and destroys itself.
interface: (r4 = battle object pointer in r5, r5 = this) -> r0 = CUR_STATE_DESTROY written to this; sets
  RelatedObject1Ptr->ObjectHeader = 1
details: Standard per-frame battle object update using r5 as the object pointer. On the first call (CurPhase
  == 0) it latches CurPhase = 1, sets CurAnim = 1, plays sound effect 0xBD, and copies Param1 into Timer
  as a frame countdown. Each subsequent frame decrements Timer; when it reaches zero, it stores 1 into
  the ObjectHeader field of the object at RelatedObject1Ptr (activating it) and sets its own state to
  CUR_STATE_DESTROY. Effectively a delayed one-shot trigger that animates for Param1 frames, then flags
  a linked object before dying.
