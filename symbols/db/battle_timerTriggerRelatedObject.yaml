- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; cmp #0 gate runs init only once (sub_80E3CC4 head); mov
    r0,#0xbd; bl PlaySoundEffect plays fixed SE on first frame; ldrb r0,[r5,#oBattleObject_Param1]; strh
    r0,[r5,#oBattleObject_Timer] copies Param1 as countdown; ldr r1,[r5,#oBattleObject_RelatedObject1Ptr];
    str r0,[r1,#oBattleObject_ObjectHeader] with r0=1 activates related object; mov r0,#CUR_STATE_DESTROY;
    str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] self-destructs after trigger'
