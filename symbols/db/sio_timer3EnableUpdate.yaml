name: sio_timer3EnableUpdate
address: '0x08144BF0'
kind: function
status: probable
summary: 'Part of the SIO link state machine: enables Timer 3 (the multiplayer clock timer) while the
  comm session requests it, and disables/clears that request once a state counter reaches 8.'
interface: () -> void; no arguments, operates on the comm struct eTimerEnable200F460 and Timer3Control;
  no return value
details: 'Reads the struct at eTimerEnable200F460: if the byte at +0x29 equals 8, it terminates by zeroing
  the byte at +0x28 (the enable flag) and the counter at +0x29. Otherwise, if the enable flag at +0 is
  nonzero, it sets bit 0x80 of Timer3Control — the GBA timer-enable bit — keeping Timer 3 running for
  the SIO link. The counter/flag pair suggests the link state machine arms the timer for a fixed phase
  and this routine re-asserts enable each frame until that phase ends. No return value; only the Z-flag
  path differs, nothing else is touched.'
