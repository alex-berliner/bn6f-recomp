    phase flag +0x28, counter +0x29; cmp r0, #8 / bne ... strb #0 to +0x28 and +0x29: clears the enable
    request when the counter hits 8; ldr r0, =Timer3Control; orr r1, #0x80; strh: sets the hardware timer-enable
    bit (bit 7) for Timer 3'
