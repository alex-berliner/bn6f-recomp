name: chatbox_event163Progress_81273B4
address: '0x081273B4'
kind: function
status: confirmed
summary: Chatbox script handler for event flag 163 that advances a per-event progress counter and queues the next
  (or final) chatbox text.
interface: "void chatbox_event163Progress_81273B4(void);\n  inputs: r10 = oToolkit pointer (used to fetch per-event\
  \ data record at oToolkit_Unk200a220_Ptr), lr = return; r5/r7 caller-saved per contract\n  outputs: r5/r8/r9/r10/r11/r12\
  \ clobbered; no flags/regs exposed to caller beyond the contract\n  flags: nz, c, v set/cleared by intermediate\
  \ calls; not preserved\n"
details: "Tests Event flag 0x163 via TestEventFlagFromImmediate; if clear (zf set) the chatbox step is skipped entirely.\n\
  If set, reads a pointer from r10 + oToolkit_Unk200a220_Ptr into r6 (a per-event data record).\nCalls sub_8121198\
  \ (r10 still live) to get the current progress value, then:\n  - if progress+1 != 0x0F: stores (progress+1) to\
  \ [r6, #0xC] and queues text script id 0x12\n  - if progress+1 == 0x0F: writes 0x13 to [r6, #0xC] (cap/finished\
  \ state) and queues text script id 0x13\nFinally calls sub_8127578 with r0=textId, r1=0, r2=0x600AC00, r3=&eTextScript201BF20,\
  \ r4=&unk_201A600; r6 still holds the data record pointer but sub_8127578's contract only consumes r0-r4/r2/r3\
  \ here.\nQuirks: the \"0xF\" comparison uses the post-incremented value, so the field actually saturates at 0x13\
  \ (decimal 19) the moment it would hit 0xF. The literal 0x13 doubles as both the stored \"done\" progress and\
  \ the text id for the final stage.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
