name: battle_checkAlliancePanelPair
address: '0x080F77E8'
kind: function
status: probable
summary: 'SpoutMan AI helper: checks whether either of two preset panels belonging to the object''s alliance
  is in a required panel state, for its RNG-gated attack.'
interface: (r5 = battle object, reads oBattleObject_Alliance) -> r0 = 1 if either of the alliance's two
  panels passes object_checkPanelParameters, else 0; r0-r3 clobbered
details: 'Indexes byte_80F7828 by alliance*4 + i*2, giving two (byte0, byte1) pairs per alliance ({5,2},{6,2}
  for alliance 0; {2,2},{1,2} for alliance 1), likely panel coordinates. For each pair it calls object_checkPanelParameters
  with r0/r1 = the two bytes, r2 = 0x10 (parameter bits that must all be set) and r3 = 0xF8800C0 (bits
  that must be clear), taken from dword_80F781C/0x80F7820. The tst on the return happens before the pop
  {r0,r1}, so a matching panel (r0 != 0) exits immediately with r0 = 1; otherwise it tries the second
  panel and returns its result. Net effect: true if any of the two alliance-owned panels satisfies the
  mask (bit 4 set, bits 6,7,22,23,27-31 clear — plausibly an intact/normal panel). r5 is not saved, so
  the caller must keep the object pointer there.'
