open_questions:
- Exact meaning of oObjectHeader_Flags bit 1 (visible? collidable?) — need a known writer/reader of that
  bit
- Which callers assign this as an object's update/state handler and what initial Timer values they use
- The summary is essentially correct, but the proposed name 'object_timerDestroy' implies a standalone
  helper. The code is clearly an object behavior/state routine invoked with r5 holding the battle object
  pointer, so a name reflecting its role as an object state handler fits better. Also, the 'toggling'
  description is slightly off — bit 1 (value 2) of oObjectHeader_Flags is only ever cleared (BIC), never
  set, so it isn't truly toggled.
