name: sub_80C4C52
address: '0x080C4C52'
kind: function
previous_names: []
status: hypothesis
summary: Returns a per-Row-name animation override (0xC/0xD) for a battle object's related object, otherwise just
  returns the actor-type in r1.
interface: '(r5 = related BattleObject*) -> r1 = {0xC, 0xD, or returned actor-type value}; side effects: none observed'
details: "Looks up r5->RelatedObject1Ptr, reads its NameID (u16 at oBattleObject_NameID), and calls\n  unpackVerActorTyAndAIIdx_800F29C\
  \ to obtain an actor type / AI index triple in r0,r1,r2.\n  - If the returned r1 < 0x23, r1 is left as-is (so\
  \ r1 holds the actor type).\n  - If r1 == 0x23, 0x2F, or <= 0x29 (and > 0x23 except 0x24), r1 is left as-is.\n\
  \  - If r1 == 0x24, r1 is forced to 0xD.\n  There's also a single override branch at loc_80C4C74 (taken when r0==0x24)\
  \ that sets r1=0xD.\n  Net: for actor types whose NameID is in the 0x24..0x29 range with one specific match, the\n\
  \  function returns 0xD, otherwise 0xC is set as a \"default\" override — actually re-reading the\n  assembly,\
  \ r1 is preset to 0xC at the top, so the default is 0xC and r1==0x24 replaces it with 0xD.\n  No persistent writes;\
  \ only the r1 result is observable to the caller. The two callers both use\n  the returned r1 to override the\
  \ per-frame update's CurAnim for that actor.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r1, #0xc` before the comparison chain sets a default of 0xC (likely another CurAnim value). -
    `cmp r0, #0x24 / beq loc_80C4C74` is the only path that overwrites r1 -> `mov r1, #0xd` sets 0xD. - `ldr r0,
    [r5,#oBattleObject_RelatedObject1Ptr]` plus `ldrh r0, [r0,#oBattleObject_NameID]` match the AIData/ActorType
    naming used elsewhere in this subsystem. - Caller `battleObject_refreshAndMirrorRelated_80C4B84` exposes its
    result through `CurAnim` mirroring per its summary.'
