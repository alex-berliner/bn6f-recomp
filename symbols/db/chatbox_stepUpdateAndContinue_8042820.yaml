name: chatbox_stepUpdateAndContinue_8042820
address: '0x08042820'
kind: function
status: confirmed
summary: Runs the chatbox's per-frame update (sub_809CA84), stores its result into the chatbox control block at
  +0x4C, advances the state counter by 2, and reports "continue" (r0=1) to the caller.
interface: u32 chatbox_stepUpdateAndContinue(void); // reads r4 (state counter/ptr), r5 (chatbox control block),
  r10; writes result to [r5+0x4C], returns r4+=2 in r4 and constant 1 in r0; clobbers r1, lr, NZCV
details: 'A thin wrapper in the chatbox state-machine family. It first calls sub_809CA84, which performs the actual
  per-frame chatbox processing and leaves its working state in r2/r4/r5/r6/r7 (r5 pointing at the chatbox control
  block, r4 acting as a step/cursor counter, r0 holding the value to record). This function then stores that value
  into the control block at offset 0x4C ([r5+0x4C]) — likely a next-state or progress field — and adds 2 to r4,
  advancing the chatbox''s script/state counter by one step (step size 2 suggests the counter indexes 2-byte entries,
  e.g. script commands or state pairs). It always returns r0 = 1, which callers use as a "keep going / not done"
  result for the chatbox update loop. No argument registers are set up before the call: r4, r5 and r10 are passed
  through untouched, so this only works when the caller already has the chatbox context loaded (a chained state-handler
  pattern rather than a normal C-abi function).

  '
