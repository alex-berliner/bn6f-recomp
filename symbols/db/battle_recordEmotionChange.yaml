    run wf investigate investigate-20261019-022109'
open_questions:
- what fields 4 and 5 of the r5 struct mean (turn/state counters?)
- what emotion type 0x3A represents in game terms
- what the 0xC byte at entry+9 selects (the callee's default there is 0x09)
- what sub_811CE34 does and when it invokes this
