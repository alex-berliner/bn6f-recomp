name: battle_recordEmotionChange
address: '0x0811DBD0'
kind: function
status: probable
summary: Appends a new EmotionData entry (type 0x3A, flags 6, byte 9 = 0xC) to the 0x02008450 emotion
  table and updates counters in the caller's state struct.
interface: (no args; r5 = pointer to caller's state struct) -> r0 = pointer to the newly initialised EmotionData
  entry; no flags set
details: Reads [r5,#5], adds 5 and stores it back, then clears the low byte of the word at [r5,#4] and
  sets that byte to 5, so byte 4 becomes 5 and byte 5 is a counter incremented by 5 per call. It calls
  battle_initEmotionTableEntry_8046670 with r0=0x3A (entry type/ID) and r1=6 (flags value), which allocates
  and fills a slot in the EWRAM array at 0x02008450. After the call, r0 points to the new entry and the
  function overwrites the entry's byte at offset 9 with 0xC, replacing the callee's default 0x09 tag.
  No other state is touched, so the whole effect is 'log this emotion event and advance two state counters'.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#5]; add r0,#5; strb — increments a byte counter by 5 in the r5 struct; lsr/lsl
    r2 by 8 then orr #5 — rewrites only the low byte of [r5,#4] to 5, preserving upper bytes; mov r0,#0x3a;
    mov r1,#6; bl battle_initEmotionTableEntry_8046670 — creates an emotion entry of type 0x3A with flags
    6; strb r1 (0xC),[r0,#9] after the call — overrides the default 0x09 tag at entry+9; sole caller sub_811CE34
    is itself unnamed, so caller context adds nothing'
  refs:
  - bn6f/asm/asm32.s:32431
  - 0x0811CE34 sub_811CE34
  - 0x08046670 battle_initEmotionTableEntry_8046670
