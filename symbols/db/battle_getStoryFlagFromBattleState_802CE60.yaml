summary: Returns a packed 4-word story/turn entry indexed by (param ^ oBattleState_Unk_0d), reading r0=lo16,
  r1=hi16, r2=upper from a global table
interface: (r0 = selector 0..n, r10 = toolkit) -> r0 = u16 entry[0], r2 = u16 entry[2], r1 = u32 entry[4]
  ; no side effects, returns through r0/r1/r2
details: 'Takes a one-byte selector in r0. Loads Toolkit->BattleStatePtr via r10 (mov r1,r10; ldr r1,[r1,#oToolkit_BattleStatePtr]),
  reads the byte at offset oBattleState_Unk_0d (ldrb r1,[r1,#0xd]), XORs it with the selector (eor r0,r1),
  and multiplies the result by 0x10 to index into a 0x10-byte-per-entry table rooted at unk_2036720. Returns
  the 10-byte entry spread across r0,r1,r2: r0 = first halfword at [ptr+0], r2 = second halfword at [ptr+2],
  r1 = full word at [ptr+4]. The sole caller sub_801C984 invokes this twice with r0=0 and r0=1, packing
  the pair into two booleans on a local struct (probably "is this story scene/step active" or two flag
  bits keyed by oBattleState_Unk_0d). The 0x10-byte stride and r0/r2 returning u16s with r1 returning
  a u32 strongly suggests a small struct of {u16,u16,u32} per story branch.

  interface: (r0 = selector 0..n, r10 = toolkit) -> r0 = u16 entry[0], r2 = u16 entry[2], r1 = u32 entry[4]
  ; no side effects, returns through r0/r1/r2

  '
