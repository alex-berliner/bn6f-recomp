name: NPCCommand_disable_collision_alternate
address: '0x0809F03C'
kind: function
status: confirmed
summary: NPC script command that turns off the NPC's collision (walk-through) by setting flag bit 0x10 in its UnkFlags_60
  field, then steps the script to the next command.
interface: void NPCCommand_disable_collision_alternate(r5 = OverworldNPCObject* npc, r6 = &script_command_counter)
  -> returns via lr; outputs r0 (flag bit 0x10), r1 (updated UnkFlags_60), r6 (counter advanced by 1), and NZCV
  flags from the counter increment (ADDS).
details: Part of the overworld NPC scripting VM. The "instruction pointer" is r6, which indexes the NPC's script
  command stream; this handler reads the NPC's UnkFlags_60 word, ORs in OW_NPC_UNK_FLAGS_60_DISABLE_COLLISION_0x10
  (bit 0x10, a "collision disabled / intangible" state flag), writes it back, and then does add r6,#1 so execution
  moves on to the next script command. Like all script commands it tail-jumps back with mov pc, lr; the NZCV flags
  the caller sees are just the side effects of the counter increment, not meaningful results. The "_alternate" suffix
  suggests a companion variant of the ordinary disable-collision command (presumably setting a different flag or
  the inverse operation), but the exact difference would be confirmed by comparing to the sibling handler.
