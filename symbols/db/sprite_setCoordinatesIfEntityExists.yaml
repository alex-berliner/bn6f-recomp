name: sprite_setCoordinatesIfEntityExists
address: '0x0811BC24'
kind: function
status: probable
summary: Sets an object's x/y position only if the entity at the given index in the 0x58-byte struct array
  is in use.
interface: (r0 = x coordinate, r1 = y coordinate, r2 = entity index) -> r0 = pass-through result from
  sprite_setCoordinates; NZ flags from the entity's in-use byte via getStructFrom2008450
details: Loads args, calls getStructFrom2008450 with r2 = index to fetch the status/in-use byte of the
  entry in the fixed 0x58-byte struct array at 0x2008450; if that byte is zero the function returns without
  doing anything (beq to epilogue). Otherwise it calls sprite_setCoordinates with the saved r0/r1 coordinates
  and the entry pointer in r1, which writes x/y into the 0x10-byte sprite sub-entry selected by the resource's
  byte-2 high nibble. It is essentially a guarded position-update wrapper so callers don't have to check
  entity existence themselves.
