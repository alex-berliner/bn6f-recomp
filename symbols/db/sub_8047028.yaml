name: sub_8047028
address: '0x08047028'
kind: function
status: confirmed
summary: Per-frame update for a chatbox dialogue context that (re)starts its text script with a speed depending
  on a repeat flag, while a global event flag is set.
interface: 'chatbox_stepContextScript_8047028(context: *ChatboxContext /* r5 */) -> u32 /* always 0, Z set */; preserves
  r4-r7, clobbers r0-r3/r12/lr and flags'
details: 'Steps the chatbox dialogue state machine for one frame. First calls sub_8047134, which advances some inter-frame
  chatbox state. Then it checks global event flag 0x8 via chatbox_mask_eFlags2009F38 (the eFlags2009F38 word); the
  script logic only runs while that flag is set. When it is, the script to run and the text scroll speed are chosen
  from the context at r5: the halfword at offset 0x12 is a kind of repeat/ alternate-text counter — nonzero selects
  script index 1 with scroll speed 8, zero selects script index 0xA with scroll speed 0x20. The chosen speed is
  stored into the context''s state byte at offset 0x00, and chatbox_runScript is called with the TextScriptArchive
  pointer at context+0x24 and the chosen script index. The function always returns 0 in r0 with the Z flag set (a
  "not done / continue" style result). Quirk: the caller''s r5 is the real argument; r4/r6-r12 are only carried
  through the lifter''s conservative contract, and r1/r2 are left as the callees left them.

  '
