name: ai_attackWoodStep
address: '0x08108602'
kind: function
status: probable
summary: 'Per-frame step of an AI boss''s wood-element attack: on the first call sets AttackElement=4,
  plays anim 0xC on the battle object, sets counter time 8, plays sound 0xC5, spawns a front-panel effect,
  and arms StepTimer=0x14; afterwards decrements StepTimer, calls sub_8108E34(0) when it hits 0x11, and
  writes HitElement=0x18 when it reaches 0.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = undefined; no flags
details: 'If oAIAttackVars_AttackElement is 0 (no attack active), it starts one: sets AttackElement to
  4 (wood), plays animation 0xC on the battle object, sets a counter time of 8 via object_setCounterTime,
  plays sound 0xC5, spawns effect 0 on the panel in front (battle_spawnEffectAtFrontPanel handles facing
  mirroring), and sets StepTimer to 0x14 (20 frames). On later frames it counts StepTimer down; when it
  reaches 0x11 it calls sub_8108E34 (spawn follow-up, argument 0), and when it hits 0 it writes HitElement
  = 0x18 so the AI/hit system resolves the attack''s damage. Element 4 = wood matches the front-panel
  effect spawn pattern; 0x18 as HitElement is an attack-type index not decoded here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/tst on [r7,#oAIAttackVars_AttackElement] with strb 4 shows it initiates a wood-element
    attack if none active; bl object_setCounterTime with r0=8 and strh 0x14 StepTimer show an 8-frame
    charge plus 20-frame step timer; bl PlaySoundEffect (0xC5) and bl battle_spawnEffectAtFrontPanel(0)
    show the charge telegraph on the front panel; timer reaching 0 stores 0x18 into oAIAttackVars_HitElement,
    deferring damage to the hit system; called from battlesweep route with no direct callers: reached
    via the AI attack dispatch table'
  refs:
  - bn6f/asm/asm31.s:170357
