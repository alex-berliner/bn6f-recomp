name: battle_destroyObjectOnFrameFlag_80C6536
address: '0x080C6536'
kind: function
status: confirmed
summary: Reads the battle object's current sprite frame parameters and moves the object into the destroyed state
  if the frame carries the 0x80 "self-destruct" flag.
interface: 'void battle_destroyObjectOnFrameFlag(BattleObject* obj /* r5 */) — actually returns the frame parameters
  in r0-r3 and the flags (nz/c/v) left by sprite_getFrameParameters (or the final MOV on the destroy path), so effectively:
  FrameParams battle_destroyObjectOnFrameFlag(BattleObject* obj), with callers consuming r0-r3 and flags as outputs.'
details: 'r5 holds a battle object pointer. Calls sprite_getFrameParameters for the object''s

  current sprite frame; the returned parameters in r0-r3 are passed straight through to

  the caller. Tests bit 0x80 of the first returned value (the frame parameter word):

  if set, stores CUR_STATE_DESTROY (8) into the object''s CurState field at

  obj+oBattleObject_CurState (offset 8), i.e. the sprite animation tells the battle

  engine when the object''s lifespan ends. Always returns, preserving lr as a return

  address via pop {pc} (the function is a tail-continuation of a bl-based call,

  returning to whatever lr pointed at on entry).

  Quirks: the flag test is on the value returned by sprite_getFrameParameters, not on

  any object field; c and v are not explicitly set, so callers reading c/v inherit

  sprite_getFrameParameters'' flag state (or the MOV/AND on the destroy path).

  '
