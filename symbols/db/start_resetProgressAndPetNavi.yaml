name: start_resetProgressAndPetNavi
address: '0x0809C01C'
kind: function
status: probable
summary: Resets game-progress story flags and reinitializes the selected PET navi, as if preparing a fresh
  scenario/playthrough state.
interface: (r5 = toolkit or scenario struct; [r5,#0x34] = config struct) -> r0 = 0; no flags
details: Reads a struct at [r5,#0x34] and, if the u16 flag at +0x16 is set AND event flag EVENT_120 is
  NOT set, stores game progress 0 to the progress buffer and writes 0x80 into the GameState's GameProgress
  byte. It then clears the event-flag bitfield word at +0x18 if nonzero, syncs the current PET navi from
  byte +0x14 into the toolkit (both game state and the S2001c04 byte +7), reloads the navi's base stats,
  and fully resets the PET navi setup (heals HP, clears boosts/mood/BeastOut counters and session flags).
  The EVENT_120 guard means the progress reset only happens once — after that flag is set the progress
  byte is left alone. Returns 0.
