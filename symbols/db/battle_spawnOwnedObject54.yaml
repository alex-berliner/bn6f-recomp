name: battle_spawnOwnedObject54
address: '0x080C4038'
kind: function
status: probable
summary: Spawns auxiliary battle object 0x54 tethered to a given owner object, inheriting the owner's
  position/alliance and stashing four caller parameters in its ExtraVars.
interface: (r0 = param D (also passed as spawn params), r1-r3 = params A-C (also passed as spawn x/y/z),
  r5 = owner BattleObject) -> r0 = new object ptr or NULL; flags set by mov r0,r5
details: Calls object_spawnType1 with id 0x54, forwarding r1-r3 as x/y/z and the original r0 as the stack-passed
  params argument. If spawning fails it returns 0. On success the four entry arguments are stored to the
  new object's ExtraVars (+0xC, +8, +4, +0 in reverse order), the object's X, Y, Z and AllianceAndDirectionFlip
  are overwritten with the owner's values from entry r5, and RelatedObject1Ptr is set to the owner, linking
  child to owner. ObjectHeader_Flags gets 0x14 (bits 0x4 and 0x10) ORed in, and ExtraVars+0x10 and +0x14
  (two timers/counters) are cleared. The owner pointer is a hidden fifth argument in r5, not part of the
  C-level argument list.
