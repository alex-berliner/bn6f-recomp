  detail: 'mov r0,#0x54; bl object_spawnType1 — spawns type-1 object id 0x54, forwarding r1-r3 and the
    stacked original r0 as spawn args; pop {r1-r4} then str r1/r2/r3/r4 to ExtraVars+0xC/+8/+4/+0 — the
    four entry args are cached on the new object; ldr from [r5,#X/Y/Z/AllianceAndDirectionFlip]; str to
    [r0,...] and str r5,[r0,#RelatedObject1Ptr] — new object copies position/alliance from and links back
