name: ai_attackChoosePanelAndReserve
address: '0x081071C0'
kind: function
status: probable
summary: 'AI attack step: asks a per-attack callback to pick a target panel, reserves it, locks the object
  in place and starts the attack wind-up animation.'
interface: (r0 = attack state in r5/r7 battle object + oAIAttackVars) -> r0 = HasMoved flag (via struct);
  flags not meaningful
details: If object_canMove says the object is blocked, it clears oAIAttackVars_HasMoved and bails via
  object_exitAttackState. Otherwise it invokes the oAIAttackVars_PanelChooseCallback with r0 = TargetObjectPtr
  and two constants from dword_8107214/8107218 (0x10000, 0x0F880080, likely packed panel-range bounds),
  expecting the chosen panel in r0/r1. It stores those as TargetPanelX/Y, calls object_reservePanel, copies
  the object's current PanelX/Y to FuturePanelX/Y and reserves again, then ORs OBJECT_FLAGS_CANNOT_SLIDE
  into the object flags so it can't be pushed off the spot. Finally it sets CurAnim = 4, a 3-frame oAIAttackVars_StepTimer,
  HasMoved = 1 and HitElement = 4 before returning; on failure it clears HasMoved and exits the attack
  state.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_canMove / beq loc_8107206 gates the whole routine on movement being allowed; ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]
