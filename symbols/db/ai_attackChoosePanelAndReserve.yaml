    calls plus copying PanelX/Y to FuturePanelX/Y claim the chosen panel; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE;
    bl object_setFlag1 pins the object during wind-up; failure path sets HasMoved=0 and calls object_exitAttackState,
