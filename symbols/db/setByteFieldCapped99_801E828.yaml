name: setByteFieldCapped99_801E828
address: '0x0801E828'
kind: function
status: confirmed
summary: Stores a byte value clamped to a maximum of 99 into a struct field, then calls a helper to refresh whatever
  depends on it.
interface: void sub_801E828(u8 value /*r1*/, struct* ptr /*r5*/); sets flags and r0-r3 via the tail call
details: 'Takes a byte value in r1 and a struct pointer in r5. If the value exceeds 99 it is

  clamped to 99 (note the comparison is a signed ble against 0x63, so incoming values

  with bit 7 set wrap around and pass through unclamped — a quirk if the field is meant

  to be unsigned). The clamped value is stored as a byte at [r5+9], r1 is left holding

  the final value, and sub_801E838 is tail-called with r5 still pointing at the struct,

  presumably to update displays/values derived from this field. Register contract shows

  callers treat r4-r7 and lr as preserved and only rely on the callee''s outputs.

  The 99 cap is the classic "two-digit display" limit, suggesting a count/amount field

  shown on screen (e.g. an item count or similar counter) rather than an HP-style stat.

  '
