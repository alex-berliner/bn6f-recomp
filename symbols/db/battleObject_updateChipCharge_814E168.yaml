summary: Advances the buster/chip-charge frame on a battle object and stores a damage-scaled value
interface: '(r0 = BattleObject*, r1 = ?) -> r0 = BattleObject* ; side effects: writes halfwords to BattleObject+0x1c
  and +0x20, clobbers r1..r3 and flags'
details: "Saved-lr dispatch (mov r12, lr / bx r12) so this is invoked from a tail-call / jump-table\n\
  \  entry, not via BL. Calls battleObject_runUpdateRoutineAndAdvancePC_814E0D0 once with the\n  caller-supplied\
  \ arguments preserved (returns a new r0, writes the routine's r0..r2 into\n  r0..r2 of the captured\
  \ calls).\n  After the call it reads the u16 at BattleObject+0x1c (Unk_1c), doubles it (lsl #1), writes\n\
  \  it back as a u16 (so effectively *= 2 saturated to 16 bits), then multiplies the\n  u16 at +0x1e\
  \ (Unk_1e_Unk_1f low byte, the captured-call value looks like PwrAtkButton-style\n  data) by that doubled\
  \ value, takes the high byte (lsr #8) and stores the result at\n  BattleObject+0x20 (Timer).\n  PwrAtkButton\
  \ is at +0x1e in the BattleObject struct, and +0x1c/0x20 are the small\n  charge-state fields directly\
  \ below PwrAtkState — strongly suggests this computes a chip\n  charge bar / power-atk charge frame\
  \ value.\n  Returns the original BattleObject* in r0 (r0 is preserved through the callee).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r12, lr ; bl battleObject_runUpdateRoutineAndAdvancePC_814E0D0 ; bx r12` shows a routine
    that ends by tail-returning to the caller''s lr, dispatching through the callee. - r0 across captured
    calls is stable (02010890, 02010be0, 020108d0, 02010990), confirming it is the BattleObject* being
    threaded through. - `strh r3, [r0,#0x1c]` after `lsl r3, r3, #1` is a *2-and-truncate on the field
    at +0x1c. - `ldrh r2, [r0,#0x1e]; mul r3, r2; lsr r3, r3, #8; strh r3, [r0,#0x20]` is a (Unk_1e *
    new_Unk_1c) >> 8 stored at +0x20 — a classic Q.8 / fixed-point multiply used for charge bar advance.
    - In BattleObject.inc, +0x1c sits between ChipsHeld (+0x1a) and Unk_1e_Unk_1f (+0x1e), and +0x20 is
    `Timer`; +0x1e is a halfword that captures look like PwrAtkButton — matches a charge-step computation.'
