open_questions:
- Exact meaning of the 0x90 bitmask 0x8000 (likely OBJECT_FLAGS_DEAD or a "this hit already counted" flag).
- What sub_801445C / sub_8014490 actually gate (presumably per-side state checks tied to the
- transformation IDs 0/0xB/0xC). Naming them would settle it.
- Whether the 0x0E write of 0xFF is "clear transformation" or "queue a transformation-cancel flag";
- the callee name suggests the latter.
