  0->1 wrap on Left
- 'The B/A/dpad logic matches the code at loc_813654C/loc_8136560/loc_8136570. However the cursor-clamp
  claim is inverted: the asm at loc_8136570 sets r4=1 (the *increment* value), and at loc_813657E it falls
  back to r4=0 when the new value is <0 or >2 — so out-of-range snaps to 0, not to 1. Also B stores 0xFF,
  not 0xFFFF (mov r0,#0xff; strh). The name fits well.'
