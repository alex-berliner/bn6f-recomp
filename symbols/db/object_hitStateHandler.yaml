name: object_hitStateHandler
address: '0x080D8310'
kind: function
status: probable
summary: 'Per-frame state handler for a battle object that has just been hit: spawns the hit effect, tears
  down its collision data, and either destroys the object or dispatches to an action-specific handler
  via CurAction.'
interface: (r0/r5 = battle object) -> r0 = destroyed state value when destroying; flags used for battle-over/timestop
  checks
details: Runs with the battle object in r5 (standard state-handler convention). It first removes the object's
  collision data and spawns a hit-effect object from the last collision's position (with up to 8px jitter).
  If the battle is over, or the collision's flags byte in the CollisionData is nonzero, it clears the
  collision region, frees and nulls the object's ExtraVars pointer, and sets the object's state to CUR_STATE_DESTROY.
  Otherwise, if time is not stopped, it dispatches through a 3-entry jump table indexed by oBattleObject_CurAction
  (off_80D8370) to per-action handlers, then refreshes the object's per-frame collision state via object_presentCollisionData.
  This reads as the shared 'object hit / dying' state used by attackable battle objects.
