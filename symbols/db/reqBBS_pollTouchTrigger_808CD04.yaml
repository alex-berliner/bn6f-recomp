name: reqBBS_pollTouchTrigger_808CD04
address: '0x0808CD04'
kind: function
status: confirmed
summary: Polls the touch-trigger handler and, if the reported touch id is in the range 0xC0..0xCC, records it in
  the BBS work area's trigger byte and reports success.
interface: 'u32 reqBBS_pollTouchTrigger_808CD04(void); // r0 in: none used; r0 out: 1 if a trigger id was recorded
  else 0; NZ set from r0; r10 passed through untouched'
details: 'Loads the BBS work-area pointer from dword_808CA44 (points at 0x2000B40) and calls

  reqBBS_81409E4, which reports the current touch-input event id in r0. If the id is

  within the signed range 0xC0..0xCC (inclusive), the id is stored as a byte at

  work+5 (byte_2000B45, the "last touch trigger id" slot) and the return flag is set

  to 1; otherwise the byte is left alone and 0 is returned. The caller reads the

  result via r0/NZ. Values 0xC0..0xCC are presumably the per-button/per-region touch

  trigger ids for the BBS screen layout. Note the id is a signed comparison, so ids

  0x80..0xBF would also satisfy the lower bound if ever produced. r2/r5/r9-r12 on

  exit simply inherit whatever reqBBS_81409E4 left behind.

  '
