name: reqBBS_pollTouchTrigger_808CD04
address: '0x0808CD04'
kind: function
previous_names:
- sub_808CD04
status: probable
summary: Polls the on-touch BBS request and caches its id if it falls in the 0xC0..0xCC range.
interface: '() -> r0 = bool (1 if the touch request id was accepted and stored, 0 otherwise) ; side effects:
  stores the request id byte at *(dword_808CA44+5) when in range'
details: "Loads the pointer chain dword_808CA44 -> dword_2000B40 (the comment \"(byte_2000B45 - 0x2000b40)\"\
  \ confirms the base is 0x2000B40, so the store lands at EWRAM 0x2000B45).\n  Calls reqBBS_81409E4, which\
  \ returns a request id byte in r0.\n  If the returned byte is in the inclusive range [0xC0, 0xCC] (cmp\
  \ #0xc0 / blt and cmp #0xcc / bgt form a signed range test), it is strb'd into the cached byte at offset\
  \ 0x05 of the ReqBBS2001150-style struct and r4 is set to 1; otherwise r4 stays 0.\n  Returns r4 in\
  \ r0 (mov r0, r4) and the caller uses tst r0, r0 to branch on the boolean.\n  The narrow 0xC0..0xCC\
  \ range (13 values) suggests these are the \"BBS request from NPC touch\" ids, distinct from any other\
  \ trigger source.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl reqBBS_81409E4` followed by `cmp r0, #0xc0` / `blt loc_808CD1C` and `cmp r0, #0xcc` /
    `bgt loc_808CD1C` is a textbook signed range check on the returned id byte. - `strb r0, [r5,#0x5]`
    with the assembly comment `(byte_2000B45 - 0x2000b40)` shows the store hits EWRAM byte 0x2000B45,
    i.e. offset 5 from a 0x2000B40 base. - `mov r4, #1` only on the in-range branch and `mov r0, r4` then
    `tst r0, r0` at the return shows a boolean (1=true, 0=false) was returned. - The single caller `sub_808CB0C`
    (the only known call site) provides r10 (Toolkit) so the function inherits the EWRAM context indirectly
    via dword_808CA44. - The id range 0xC0..0xCC is contiguous and small, consistent with a fixed set
    of NPC-triggered BBS ids rather than a generic range.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0808CD04

    '
  result: the body read as described above
