name: battle_objectHandleDestroy
address: '0x080D4EFC'
kind: function
status: probable
summary: 'Battle-object destroy state handler: releases the reserved panel, dispatches destroy sub-events,
  clears the list entry, then branches on ObjectFlags2 (0x8000 set vs clear, with 0x300000 mask altering
  behavior) to either run a destroy animation/state machine, start a death action (CurAction=9) when 0
  HP and Param2==0 and sub_80D4FF6 != 0xFF, or spawn a destruction effect at +0x34 with z+=0x100000, play
  SE 0x90, clear the collision region, clear active bit, and set CUR_STATE_DESTROY.'
interface: (r0 = sound/state id? unused mostly, r5 = battle object pointer, register-based this) -> void;
  sets oBattleObject_CurState to CUR_STATE_DESTROY or starts death action 9
details: 'This is a per-object state handler using r5 as the battle object. It first frees the object''s
  reserved panel (FuturePanelX/Y), dispatches destroy sub-events, and clears its battle-state object-list
  entry. It then reads ObjectFlags2: bit 0x8000 gates the destruction sequence and bits 0x300000 mark
  objects that skip the effect path (sub_800F90E(9) instead). With 0x8000 clear, an object at 0 HP with
  Param2==0 snapshots CollisionData FlagsFromCollision into ExtraVars, calls sub_80D4FF6, and if that
  != 0xff begins a death action (CurAction=9, phase 0) instead of vanishing immediately. Otherwise it
  spawns a type-0 effect at the object''s position (fields at +0x34, z nudged +0x10/+0x14), calls sub_80E1D7A,
  plays sound effect 0x90, clears collision region, clears active bit 1 of ObjectHeader_Flags, and sets
  state CUR_STATE_DESTROY.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_removePanelReserve / battle_dispatchDestroyEvents / clearEntryOfBattleStateBattleObjectList
    — standard teardown on erase; HP==0 && Param2==0 path stores FlagsFromCollision to ExtraVars and sets
    CurAction=9, phase 0 — starts a death animation rather than instant removal; spawn_t1_0x0_EffectObject
    with position fields from [r5+0x34..] plus PlaySoundEffect(0x90) — destruction effect and erase sound;
    trailer clears bit 1 of oObjectHeader_Flags and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized;
    bits 0x8000/0x300000 of ObjectFlags2 branch around the effect/sound path — special-case flags for
    objects that die differently
  refs:
