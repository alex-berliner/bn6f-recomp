  reproduce: python3 tools/asmcat.py 0x080D4EFC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code does roughly what the proposal describes, but several specifics are inverted or wrong.
    The 0x8000 branch is the one that gates the destruction sequence; the 0x300000 test actually skips
    it (going to sub_800F90E(9) or sub_800F8CE), and when 0x8000 is clear the function takes the HP/Param2/ExtraVars/sub_80D4FF6
    path with action 9. The proposal flips this. Also, the z-nudge constants are wrong: one path adds
    +0xC0000 with effect type 0x14, the other adds +0x100000 with effect type 0x14 (same constants, different
    alignment). Sound 0x90 only plays in the 0x8000 branch via sub_80D4F8E, not unconditionally.; run
    wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
