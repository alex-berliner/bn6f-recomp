name: t4_drawNaviChipNameTiles
address: '0x08137D50'
kind: function
status: probable
summary: Renders up to 7 navi-chip name strings (via text-script lookup) into two tile-index buffers,
  8 tiles per name.
interface: (r0 = base index multiplier, r1 = array base, r2/r3 = u16 tile-out buffers, r3<<12|0x200 on
  stack = param for callee) -> void; r0-r5 clobbered
details: r5 = r0*2 + r1 points into an array of byte entries walked with stride 2 for 7 iterations. Each
  nonzero byte is doubled and used as a u16 index into TextScriptNaviChipNames, yielding a pointer to
  that name's text-script string. sub_81202B4 expands the string into pairs of font tile indices written
  to r2/r3, with a stack argument 0x200|(origR3<<12) passed as a 5th parameter. r2 and r3 each advance
  by 0x10 (8 u16 slots) per entry, so each name gets an 8-tile-wide output slot; a zero byte skips that
  slot entirely. The 7 entries plus the NaviChipNames script table strongly suggest a fixed list of navi
  names (e.g. cross/navi selection labels) being tiled for display.
