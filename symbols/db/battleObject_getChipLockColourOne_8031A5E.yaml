status: probable
summary: Thin wrapper that returns the chip-lockout palette index 3 (locked) by forwarding `r0 = 1` to
  the chip-lockout colour helper and returning its result.
interface: () -> r0 = 3 (carry set in all captured snapshots); no side effects
details: "Body is three instructions: push lr, mov r0,#1, bl sub_8031980, pop pc. It hard-codes\n  the\
  \ argument 1 before tail-calling `sub_8031980` (whose summary says it returns 3 when\n  some chip-lockout\
  \ condition is true, else 2). All 40 captured calls show the function\n  exiting with `r0 = 3` and the\
  \ carry flag set (`--C-`), so callers are requesting the\n  \"chip currently locked\" colour. The lr\
  \ value `0x08031902` in every snapshot indicates\n  the immediate caller is one site in the chip-select\
  \ / battle flow (likely\n  `sub_8031902`, just below this routine in `asm03_0.s`). Because the routine\
  \ takes no\n  real arguments and only re-issues the call, it is functionally equivalent to\n  `sub_8031980(1)`;\
  \ the indirection exists so the call site can be patched independently\n  of the helper. No struct field\
  \ is read or written here.\n"
