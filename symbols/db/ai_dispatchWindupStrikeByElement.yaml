name: ai_dispatchWindupStrikeByElement
address: '0x081083C6'
kind: function
status: probable
summary: AI attack helper that dispatches to one of four per-element attack-step handlers based on the
  attack's hit element.
interface: (r0 = none; reads r7 = attack vars struct, [r7+oAIAttackVars_HitElement] = element index) ->
  calls handler from off_81083D8[element], returns to caller
details: 'Loads the element byte from the AI attack-vars struct at r7 and uses it as a word index into
  a 4-entry function-pointer table (off_81083D8), then calls the selected handler via ''mov lr, pc; bx
  r1'' (an ARM/Thumb interworking BL). The table has four entries: sub_81083E8, sub_8108408, ai_stepWindupStrikeAttack,
  sub_810849C, one per element variant. The function itself is a pure dispatcher; the attack behavior
  lives in the handlers, one of which is the known windup-strike attack step. The r7-relative access implies
  the caller runs with the AI attack-vars struct in r7 (Thumb frame-pointer style).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_HitElement] selects the table entry, so dispatch is by element;
    off_81083D8 holds four thumb pointers including ai_stepWindupStrikeAttack, tying the dispatcher to
    the windup-strike attack family; mov lr,pc; bx r1 is a tail-call-as-call pattern: the dispatcher just
    forwards control and returns straight to its own caller; no other work is done besides the indexed
    load and call, confirming a pure dispatch stub'
  refs:
  - bn6f/asm/asm31.s:174380
  reproduce: python3 tools/asmcat.py 0x081083C6
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
