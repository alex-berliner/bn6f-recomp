name: ai_initPanelReserveAttack
address: '0x08110F36'
kind: function
status: probable
summary: 'AI attack setup: reserves the panel under the acting object, then fills the AI attack vars with
  version-dependent parameters and kicks off attack type 0xB.'
interface: (r5 = battle object, r4 = AIData, r6 = AI state, r7 = AIAttackVars; version from [r4+0x16])
  -> r0 = 0; no meaningful flags
details: First it copies the object's PanelX/PanelY into fields 0x78/0x79 of the same object and calls
  object_reservePanel to claim that panel. It then indexes five byte tables (0x8110E60, E68, E70, E50,
  E58) by the AI's version field to fill SubStepIndex, ScratchVar, Unk_32, AiAttackParam and Unk_36 in
  the AIAttackVars, plus a damage value from byte_8110E30 and a halfword AttackBoost2 from word table
  byte_8110E24 (version*2 index), hardcoding ExtraDamage = 10. PanelChooseCallback is set to r5+0x70,
  i.e. a pointer into the object's own data (likely a callback/function table at object+0x70 rather than
  a separate function). Finally it calls object_setAttack0 with attack id 0xB and zeroes AIState_ScriptId,
  so the AI falls back to script 0 for the rest of the turn. The per-version tables imply the attack's
  behaviour/damage differs between Gregar and Falzar versions; executed on the battlesweep and beastsp
  recorded routes.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_reservePanel after saving PanelX/Y to object+0x78/0x79 reserves the object's own panel;
    six ldrb [tbl,version] sequences fill oAIAttackVars fields, showing version-dependent attack parameters;
    mov r0,#0xa into oAIAttackVars_ExtraDamage and halfword from byte_8110E24[version*2] into AttackBoost2
    set the attack's damage values; PanelChooseCallback = r5+0x70 and object_setAttack0(0xB) start the
    actual attack step; strb 0 to [r6,#oAIState_ScriptId] resets the AI script id as attack setup finishes
