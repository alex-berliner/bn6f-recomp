name: NPCCommand_set_active_and_visible
address: '0x0809EE12'
kind: function
status: confirmed
summary: NPC script command that turns an object on, making it both active and visible on the map.
interface: void NPCCommand_set_active_and_visible(ObjectHeader *r5, NPCScript *r6 /* in/out, advanced by 1 */);
  sets nz/cv from the pointer increment
details: 'Executes one NPC script command. Writes the byte (ACTIVE|VISIBLE) = 0x03 to the object header''s flags
  field at offset 0 (oObjectHeader_Flags), which both enables the object''s logic and makes it render on screen.
  Then it advances the NPC script pointer (r6) by one byte, since this command takes no arguments. The final ADD
  r6,#1 is the last flag-setting instruction, so callers see NZCV from the pointer increment rather than from the
  flag write. Returns via mov pc,lr, so it must be called with a return address in lr (i.e. via BL from thumb mode
  is fine, but it does not push/pop anything).

  '
