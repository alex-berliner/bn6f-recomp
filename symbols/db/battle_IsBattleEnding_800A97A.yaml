name: battle_IsBattleEnding_800A97A
address: '0x0800A97A'
kind: function
status: confirmed
summary: Returns whether the battle is in its end sequence (end-of-battle effect active and the end-phase counter
  has reached 15).
interface: 'bool battle_IsBattleEnding(void) — in: r10 (toolkit), lr; out: r0 (0/1), flags from last comparison,
  r1/r3 clobbered'
details: Calls GetBattleEffects and tests bit 3 (0x8), which appears to be the "battle ending" effect flag. If clear,
  returns 0 immediately (r1 ends up holding the masked test value, flags set by the TST). If set, reads the toolkit's
  battle state pointer (r10 + oToolkit_BattleStatePtr), loads byte 7 of the battle state (oBattleState_Unk_07, a
  phase/countdown counter), and returns 1 only when that counter is >= 15 (0xF). So the battle is considered "over"
  only once the ending effect has been active long enough for the counter to tick up to 15; byte 7 is presumably
  a frame/step counter for the fade-out or victory sequence. r3 is used as scratch for the battle state pointer.
