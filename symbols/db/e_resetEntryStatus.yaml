name: e_resetEntryStatus
address: '0x0811C4D8'
kind: function
status: probable
summary: Forces an active entry of the eStructArr2008450 array back to status 1, leaving free (0) entries
  untouched.
interface: (r0 = entry index into eStructArr2008450) -> r0 clobbered by callee call; entry's status byte
  set to 1 if it was nonzero; flags from getStructFrom2008450
details: It looks up the entry's first byte via getStructFrom2008450, which returns the byte's value in
  r0 and its address in r1 with NZ flags set. If the status byte is 0 the function returns immediately,
  so free/unused entries are never touched. Otherwise it writes 1 into that same byte, normalizing any
  nonzero status (e.g. mid-action or finished states) back to the base 'active' value. Effectively 'clear
  substatus but keep the entry allocated'. The 0x58-byte struct's other fields are not touched here.
