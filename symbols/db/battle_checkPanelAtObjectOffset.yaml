name: battle_checkPanelAtObjectOffset
address: '0x08111F38'
kind: function
status: confirmed
summary: Checks whether the panel at (object panel X + x offset, object panel Y) is usable for the object's side,
  returning the checked X (0 on failure) and Y.
interface: int battle_checkPanelAtObjectOffset(u32 x_offset /* r0 */, BattleObject* object /* r5 */); returns r0
  = checked panel X (0 if blocked), r1 = panel Y, r4/r5 = side results from object_checkPanelParameters; preserves
  r4/r5, clobbers r2/r3 and flags
details: 'Takes an X offset in r0 and a battle object pointer in r5. Reads the object''s PanelX and PanelY bytes
  (oBattleObject_PanelX / oBattleObject_PanelY) and forms the target panel (PanelX + r0, PanelY); the Y offset is
  implicitly 0, so only horizontal offsets are supported. It saves the two coordinates on the stack, then calls
  GetAllianceDependentPanelParamArgs with r3 = object and r5 preserved, passing a static argument table (byte_8111F60:
  {0x10, ptr 0x0F8800A0}, {0x30, ptr 0x0F880080}) that selects the alliance/side-dependent panel rule parameters.
  The returned r2/r3 rules are forwarded with the coordinates to object_checkPanelParameters, which validates the
  panel (hole/broken/out-of- bounds/side-occupancy style checks). If the check passes (r0 != 0), r0 keeps the computed
  X; otherwise r0 is forced to 0. r1 always holds the panel Y, and r4/r5 pass through whatever object_checkPanelParameters
  left in them (it preserves r4/r5), giving callers extra side/panel info. Quirk: on failure the caller cannot distinguish
  "panel X was 0" from "check failed" from r0 alone.

  '
