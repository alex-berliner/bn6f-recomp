name: battle_checkPanelAtObjectOffset
address: '0x08111F38'
kind: function
status: probable
summary: Checks whether the panel at a caller-given X offset from a battle object's current panel satisfies
  an alliance-dependent panel condition.
interface: (r0 = base X offset, r5 = battle object; r3 auto = table byte_8111F60) -> r0 = nonzero (the
  absolute X) if the panel at (base+objPanelX, objPanelY) matches the alliance's entry, else 0; flags
  clobbered
details: Loads the object's PanelX/PanelY from the battle object in r5, adds the caller's r0 offset to
  PanelX, and passes (x, y) with r3 = byte_8111F60 to GetAllianceDependentPanelParamArgs, which picks
  one of the table's two 8-byte entries by the object's alliance field and yields a param word and args
  pointer. Those are fed to object_checkPanelParameters, which tests the tile at those coordinates against
  required/not-required flag mask sets. On mismatch it returns 0; on match it returns the popped r0 (base+PanelX),
  a nonzero truthy value. The table holds two entries (0x10/0x0F8800A0-ish and 0x30/0x0F880080-ish), one
  per alliance, so the accepted panel state depends on which team the object is on. The odd pop {r0,r1}
  after the compare means the success return value is just 'nonzero', not a meaningful result.
