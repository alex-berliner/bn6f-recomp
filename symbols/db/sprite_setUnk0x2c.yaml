name: sprite_setUnk0x2c
address: '0x08002FA6'
kind: function
status: confirmed
summary: Stores a 32-bit value into field 0x2c of an object's sprite struct, whose offset is derived from the sprite
  ID nibble in the object header.
interface: void sprite_setUnk0x2c(u32 value /* r0 */, ObjectHeader* header /* r5 */); returns r3 = pointer to the
  object's sprite struct, flags from the address add
details: Reads the oObjectHeader_TypeAndSpriteOffset byte at offset 2 of the object header, masks off the low nibble
  with (byte >> 4) << 4 so the high nibble acts as a 16-byte-granular offset, adds that to the header pointer to
  locate the object's sprite struct (the sprite structs immediately follow the header, one 16-byte block per sprite
  slot), and writes the r0 value to oObjectSprite_Unk_2c at offset 0x2c of that struct. The high nibble thus encodes
  which sprite entry the object currently uses, capping the offset at 0xf0. r3 is left pointing at the sprite struct
  as a side effect for callers; flags (nzcv) reflect the pointer add. No other registers or memory are touched.
