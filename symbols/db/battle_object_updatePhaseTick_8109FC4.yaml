summary: 'Per-frame phase bookkeeping for a battle object: clears the object''s Param4 byte when the object is still
  in phase 0, then runs the shared per-object update routine.'
interface: void battle_object_updatePhaseTick(battleObject* obj /* r5 */)  // sets NZCV from sub_8016CE8's tail
details: 'Takes a battle object pointer in r5 (the caller''s r5 is passed through untouched, per the register contract).
  Reads oBattleObject_CurPhase (offset 0 of the battle object struct); if the object is still in phase 0, it also
  zeroes oBattleObject_Param4 (offset 7) before doing anything else, effectively initializing that scratch byte
  on the object''s first phase. It then tail-calls sub_8016CE8, the shared per-battle-object update routine, whose
  result/flags are returned to this function''s caller unchanged (the final pop {pc} lives in the callee path via
  the bl). Nothing else is touched and no value is explicitly returned in r0-r3 beyond whatever sub_8016CE8 leaves
  there. The phase-0-only Param4 reset suggests Param4 is a per-phase accumulator or counter that must start clean
  on a fresh phase cycle.

  '
