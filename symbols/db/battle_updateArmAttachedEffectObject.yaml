name: battle_updateArmAttachedEffectObject
address: '0x080E0954'
kind: function
status: probable
summary: Per-frame tick for an effect object riding on its owner's arm slot 5; plays SOUND_UNK_88 every
  60 frames, inherits the owner's position/scale offset, and frees itself when its ExtraVars target word
  or parent flag mask condition fails.
interface: (r5 = battle object pointer; no register args) -> r0 = destroyed or undefined; no meaningful
  flags
details: 'Early-outs while time-stop is active. It sets flag bit 2 (0x2) on the object, then clears it
  again if battle_findPlayerByAlliance_800EB6C reports the opposing player is blinded; it also clears
  bit 2 if the object''s recomputed panel is invalid. When Param1 == 0 it counts down Timer, resetting
  it to 60 and playing sound 0x3C each time it reaches zero. It copies the three-word position/scale block
  at RelatedObject1Ptr+0x34 into its own +0x34 block, offset by the owner''s arm-slot-5 attachment position
  (getBattleArmPositionMaybe with r1=5), then refreshes its panel coordinates. Lifetime is governed by
  ExtraVars: the pointer at ExtraVars+4 targets a word that must be nonzero, and the parent''s flag word
  (via object_getFlag) must contain the mask stored at (*ExtraVars)+4, otherwise the target word is zeroed
  and object_freeMemory releases the object; while alive it calls object_updateSpriteTimestop.'
