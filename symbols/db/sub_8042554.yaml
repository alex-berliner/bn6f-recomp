summary: 'Dead code: a random-item chatbox command handler — plays SOUND_UNK_73, draws GetRNG & [r4+2], picks a
  byte from the table after the arguments, stores it to r5+0x4C and calls GiveItem(1). Nothing in bn6f/asm references
  it, so it never runs.'
details: 'thumb_local_start in chatbox.s (5917-5937), body: bl PlaySoundEffect(SOUND_UNK_73); bl GetRNG; r1 = GetRNG
  & [r4+2]; the item id is loaded from r4+3+(r&count) and stored to [r5+0x4C]; GiveItem(r0=item, r1=1); r4 advances
  past the arguments. A grep over all of bn6f finds only its definition and thumb_func_end — no bl, no table entry
  — so the vidsync note "its FB slot is 0" holds in the stronger form: it has no reference at all.'
