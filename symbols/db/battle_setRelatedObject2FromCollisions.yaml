name: battle_setRelatedObject2FromCollisions
address: '0x080DC3B2'
kind: function
status: probable
summary: Collects current colliding objects and, for the first whose +0x28 byte is in 0xCD–0xFF and passes
  sub_800F486, stores its pointer into the battle work's RelatedObject2Ptr and returns 1; returns 0 if
  no entry matches.
interface: () -> r0 = 1 if a matching colliding object was found (its pointer stored in [r5+RelatedObject2Ptr]),
  else 0; r4/r6 clobbered
details: Reserves 16 bytes on the stack and calls battle_getCollidingObjects(sp, 0x10), which fills it
  with parent object pointers and returns the count. It walks the list, loading each object's field at
  +0x28 (a type/id byte) and accepting only values >= 0xCD and <= 0xFF. Accepted candidates are passed
  (value in r0, object pointer in r1) to sub_800F486, and only if that returns nonzero does the routine
  store the object pointer into [r5+oBattleObject_RelatedObject2Ptr] of the battle-work object r5 points
  at, returning 1. Otherwise it continues to the next entry; exhausting the list returns 0. Note r5 is
  never set here, so it relies on a register-held global battle pointer from the caller.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_getCollidingObjects with (sp, 0x10) then loop over returned count at 80DC3C8–80DC3EA;
