    loop tests each entry''s +0x28 against 0xCD..0xFF, calls sub_800F486, and on success stores the pointer
    in [r5+oBattleObject_RelatedObject2Ptr] returning 1. The only inaccuracy is the claim that ''r5 is
    never set here'' — this is true in this function, but the proposal should not call that out as a notable
