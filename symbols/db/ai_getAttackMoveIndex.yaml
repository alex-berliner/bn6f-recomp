  date: '2026-10-18'
  detail: 'sub_800FE28 is called with off_80F3BA8 pointing at dword_80F3BAC = 0x14191E28 (four packed
    byte thresholds 20/25/30/40); tst r0, r1 with r1 = 0xA000 checks flag bits 15/13 from object_getFlag''s
    collision-data word; add r4, #0x3C shifts the returned index by 60 when those flags are set; sole
    caller 0x080F3A24 ai_selectAttackBranch uses the result to program the AI attack-vars block for the
