name: ai_getAttackMoveIndex
address: '0x080F3B8C'
kind: function
status: probable
summary: Computes the enemy AI's attack-move index for the turn, shifting the result by +0x3C when the
  active object carries flag bits 0x8000/0x2000.
interface: () -> r0 = AI attack-move index (0..? or 0x3C..?); no flags set
details: Calls sub_800FE28 with a pointer to dword_80F3BAC (0x14191E28, four bytes 0x14/0x19/0x1E/0x28
  — likely 20/25/30/40 thresholds, e.g. HP-percentage breakpoints picking one of four moves) and keeps
  the result. It then reads the battle object's first collision flag word via object_getFlag and tests
  it against 0xA000 (bits 15 and 13); if either is set, 0x3C (60) is added to the index. The final value
  is returned and, per the caller, used by ai_selectAttackBranch to choose among attack setups — so the
  return is an offset/selector into an AI move table, with the +0x3C half selecting an alternate move
  set for flagged objects.
