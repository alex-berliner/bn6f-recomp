name: t3_0x5_80C55B0
address: '0x080C55B0'
kind: function
status: confirmed
summary: Per-frame step for a Beast Out battle object — dispatches a state handler from a jump table by the object's
  CurState, then runs the common sprite update.
interface: void t3_0x5_80C55B0(r5 = battle object ptr) -> r5 = (possibly updated) battle object ptr; trashes r0-r4,
  r6, r7, flags NZCV, lr
details: "Battle object state dispatcher for Beast Out objects. r5 holds the battle object; the byte\noBattleObject_CurState\
  \ ([r5]) indexes a byte-scaled jump table at off_80C55C8 with three\nhandlers:\n  0: battleObject_initBeastOut_80C55E4\
  \ (state 0 = init/enter Beast Out)\n  4: battleObject_beastOutUpdate_80C5654 (state 1 = per-frame Beast Out update)\n\
  \  8: sub_80C55D4 (state 2, purpose unknown)\nThe handler is tail-called with the original \"mov lr, pc; bx r1\"\
  \ pattern, so the handler's\nreturn lands back in this function; the handler receives the state in r0 and the\
  \ object in r5\nand may revise r5. After the handler returns, object_updateSprite is called (object still in\n\
  r5) to refresh the object's sprite, and r5 is left in place for the caller. This matches the\nstandard battle\
  \ object state-machine + sprite-update pattern used elsewhere in the battle engine.\n"
