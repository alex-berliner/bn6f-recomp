name: link_getSlotState_803F740
address: '0x0803F740'
kind: function
status: confirmed
summary: Query a link-player slot's activation state and associated eCamera fields.
interface: r0 = linkIndex → c, v, r0 (eCamera.unk_66 or 0), r1 (0 if active, 1 if empty), r2 (eCamera.unk_60
  or callee scratch); flags set by cmp entry,0xFF
details: "Saves r4-r7/lr. Calls link_getModeSelector_803DD30(r7=linkIndex) to obtain a byte selector.\n\
  That selector indexes a constant byte table at 0x0803F774 ({0x2,0xFF,0xFF,0x4,0x40,0x99,0x0,\n0x2,0x40,0x99,0x0,0x2}).\
  \ The looked-up entry is compared against 0xFF.\n- If 0xFF (slot empty/inactive): r0=0, r1=1, carry\
  \ set; r2 retains whatever\n  link_getModeSelector_803DD30 left in r2 (never overwritten on this path).\n\
  - Otherwise (slot active): reads two halfwords from eLinkState@0x20099D0:\n  r0 = [eLinkState+0x16]\
  \ (eCamera.unk_66), r1 = 0, r2 = [eLinkState+0x10]\n  (eCamera.unk_60); carry clear.\nThe \"mul r1,\
  \ r7; add r1, r1, r0\" sequence that computes 8*index+entry is dead code—r1 is\nimmediately overwritten\
  \ with 0 or 1 before being read. The second word in the literal pool\n(byte_2009940) is unused by this\
  \ function.\n"
