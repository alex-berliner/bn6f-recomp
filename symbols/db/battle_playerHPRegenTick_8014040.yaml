name: battle_playerHPRegenTick_8014040
address: '0x08014040'
kind: function
status: confirmed
summary: Per-tick HP regeneration for the player, healing ceil(navi stat 0x3E/10) HP and showing the heal effect
  and sound when regeneration is enabled.
interface: 'void sub_8014040(int alliance /* r0: which side''s player to regenerate */)'
details: 'HP recovery tick for the battle player on the alliance side given in r0

  (0 = player, nonzero = opponent''s player side). Calls battle_findPlayer

  with r0 as the alliance flag to get the player BattleObject, then checks

  GetBattleEffects: if bit 0x8 is set (regeneration suppressed for this

  battle, e.g. by a battle condition/effect), the function returns without

  healing. Next it reads the player''s navi stats byte 0x36 via

  GetBattleNaviStatsByte_AllianceFromBattleObject; it must equal 1 for the

  regen feature to be active (likely the "Reg Up"/auto-recovery

  NaviCust/statistic flag), otherwise it returns early (and that path leaves

  the Z/C flags from cmp r0,#1, matching the lifter''s c/v outputs).


  When active, it reads the navi stats halfword 0x3E (recovery amount),

  computes (amount + 9) / 10 with the BIOS Div SWI (svc 6, i.e. an

  round-up division by 10), and passes the result and the player object to

  object_addHP. It then loads three words from player+0x34 (the player''s

  effect-parameter block at +0x34/+0x38/+0x3C) with an ldmia whose

  writeback also yields player+0x40 in r0, sets r4=6 (effect kind: the

  heal/recovery effect), and calls spawn_t1_0x0_EffectObject to spawn the

  heal effect over the player. Finally it plays SOUND_UNK_8A through

  PlaySoundEffect.


  Register quirks: r4/r5 are pushed/popped, so callers get back the entry

  values of r4 and r5; r2/r3 on return are whatever

  spawn_t1_0x0_EffectObject left in them; the sound effect ID

  (SOUND_UNK_8A) is passed in r0.

  '
