name: text_renderChipNameEntries
address: '0x08126334'
kind: function
status: probable
summary: Renders up to 5 chip-name strings from a list of chip-code entries into tilemap buffers, zero-filling
  empty slots.
interface: (r0:r1 = array of 4-byte entries {halfword char code, halfword param}; r2 = dest tilemap buffer;
  r3, r4 = decoder words (r3|0x200<<... and r4<<12|0x200 pushed as stack args); r5 = zero-fill flag) ->
  r0 = decode result of last entry
details: Builds an entry pointer as r1 + r0*4 and loops 5 times over entries {u16 code, u16 extra}. Each
  code's high byte selects a string table from TextScriptChipNamesPtrs (two tables, TextScriptChipNames0/1),
  the low byte shifted <<1 indexes into that table to get a string offset, and text_decodeCharTiles8 expands
  it into 8 tilemap halfwords (16 bytes) at r2, advancing r2 and r3 (a second buffer) by 0x10 per entry.
  When the entry's +2 byte is >1, the second stack word (r4<<12|0x200) is substituted for the first (r3<<12|0x200)
  before the decode call. If a code is 0 and the r5 flag is set, both 16-byte buffers are zero-filled
  instead (clearing that slot); if r5 is clear, the fallback pointer off_81263C4/unk_201CC20 is used as
  the table. The 0x200 OR'd into the shifted words are passed through the stack to the tile decoder, likely
  base tile/palette or VRAM-ish parameters.
