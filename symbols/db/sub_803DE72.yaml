name: sub_803DE72
address: '0x0803DE72'
kind: function
status: hypothesis
summary: Dispatches a global handler read from unk_200A284 to sub_81445F8 if non-null.
interface: 'void sub_803DE72(void);  /* reads: r0 (handler ptr) via unk_200A284; writes: r0 (handler ptr forwarded),
  r1-r3, lr (clobbered by call), nz/c/v flags; preserves r4; returns to lr via pop {pc} */'
details: Tiny "check-and-call" trampoline. Loads a 32-bit pointer from the global word at unk_200A284 (already at
  0x0200A284 by virtue of the relocation-style `=unk_200A284` plus the indirect load). If the handler is non-zero,
  it falls through to bl sub_81445F8, which itself consumes r0 as the handler address. If the handler is zero, the
  function returns immediately, leaving r0 = 0 and the condition flags in the tst r0,r0 state (Z set, N/C/V clear).
  Control returns via `pop {pc}`, i.e. a tail-style `bx lr` from the saved lr on the stack. No local frame, no other
  memory accesses inside this function; the only observable side effect is the potential call through sub_81445F8,
  which is defined out-of-file and not yet typed.
