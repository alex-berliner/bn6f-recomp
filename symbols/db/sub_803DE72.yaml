open_questions:
- What subsystem owns unk_200A284 (the .bss/global that holds the handler pointer)? Likely a registered IRQ, menu,
  save, or engine callback slot, but no symbol names it.
- What is sub_81445F8 (the called target)? Its contract lists r0 in and r0-r3 + flags out, consistent with a generic
  callback invoker.
- Why is r4 listed as preserved when no instruction here references it? It is simply the callee-saved register pushed
  implicitly by `push {lr}` semantics in the contract; the function itself neither reads nor writes r4.
- Why does `beq locret_803DE80` branch to a label that is just `pop {pc}` with no delay slot, and is the pop essentially
  `bx lr`? Just an observation worth flagging during further disassembly.
