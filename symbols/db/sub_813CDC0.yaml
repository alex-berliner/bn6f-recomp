name: sub_813CDC0
address: '0x0813CDC0'
kind: function
status: hypothesis
summary: Thin fixed-argument wrapper that invokes sub_813CDD8 with r4 = 10 and r6 = 2 and passes the callee's r2
  result back to the caller.
interface: u32 wrapper(u32 r10); returns r2 (result of sub_813CDD8); r6 is read back unchanged by callers; preserves
  r4-r7; clobbers r0, r1, r3, lr and flags nzcv
details: The function saves r4-r7 and lr, sets r4 = 0xA and r6 = 2, tail-calls into sub_813CDD8 (which presumably
  consumes r10 plus these two constants), then pops r4-r7 before returning. The only visible effect to the caller
  is r2 left by the callee (and r6 restored to the caller's original value, which the register contract reports
  as an "output"). r10 is neither clobbered nor reloaded here, so it is forwarded to the callee untouched. Nothing
  in this body itself touches any game structure, string, or hardware register - all meaning lives in sub_813CDD8,
  which has no typed interface yet. The constants 10 and 2 most likely select a mode/page/index for whatever sub_813CDD8
  implements; sibling wrappers around sub_813CDD8 with different constant pairs would confirm that pattern.
