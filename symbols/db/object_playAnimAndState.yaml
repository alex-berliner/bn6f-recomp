name: object_playAnimAndState
address: '0x080A7EF8'
kind: function
status: probable
summary: Sets the object's sprite to animation index [obj+3]+12, loads that animation's frames, plays
  sound effect 0x17D, and writes state 4 to byte 9 of another object record.
interface: (r7 = object ptr, reads [obj+3] as anim index base; r5 = object ptr) -> r0 = 0; writes state
  4 to [r5+9]
details: Reads a byte at [r7,#3], adds 0xC, and passes it to sprite_setAnimation, so the animation chosen
  is animIndex+12 — a fixed extra animation bank beyond the object's base set. It then calls sprite_loadAnimationData
  to load that animation's frames, and plays sound effect 0x17D (0x7E + 0xFF) via PlaySoundEffect, a large-ID
  effect consistent with a special transformation jingle. Finally it stores 4 into byte 9 of another object
  record (r5), likely advancing that object's state/substate machine into a 'transforming' phase. Called
  during the beastsp route (beast transformation sequence); no callers captured, so r7/r5 are presumed
  object pointers set up by the caller.
