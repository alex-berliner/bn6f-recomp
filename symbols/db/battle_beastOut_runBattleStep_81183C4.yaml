summary: Beast-out / Program-Advance dispatcher that runs the per-frame battle step for the current actor
  (calls AI helper, sets sprite anim, loads animation data, updates sprite), then returns the alive-enemy-row
  count.
interface: '(r6 = BattleObject*, r10 = Toolkit*) -> r0 = alive-enemy-row count (0x1C60 baseline saved
  in r5); side effects: r2/r3/r5 clobbered, all caller-saved regs touched, tail-call via r6->byte2 dispatch.'
details: "- Reads `r6+2` (BattleObject.TypeAndSpriteOffset upper nibble, i.e. the Type field) via `ldrb\
  \ r1,[r6,#2]` and loads a function pointer from `off_81183E8[index]` using `ldr r0,[r0,r1]` then `bx\
  \ r0` (Thumb switch with `+1` for BLX targets).\n  - The 15-entry table at off_81183E8 dispatches on\
  \ the actor's Type; entries include `sub_8118424` (some basic step), `beastOutOrProgramAdvanceSetTransform_811842C`\
  \ (transform-set, used at 0, 11, 13), `sub_811847C`, `sub_81184A8` (used at 3, 8, 14), `sub_81184C0`,\
  \ `sub_81184EC`, `sub_8118510` (used at 6, 10), `sub_8118550`, `sub_811857C`, `sub_81185A8`.\n  - After\
  \ the dispatched helper runs, calls `battle_aiCountAliveEnemiesInRow_81185C0` (matches r6 BattleObject\
  \ context; the callee signature returns a row count via r0), then `sprite_setAnimation` (with r0 = result\
  \ of the AI helper, low byte as animation index), `sprite_loadAnimationData`, and `sprite_update`.\n\
  \  - The captured-call exit r0=0x1C60 is consistent with \"row count\" returned by `sub_81185C0`; in\
  \ the captured snaps the dispatch happens with r5/r6/r10/lr callee-saved by the parent.\n  - Caller\
  \ `sub_8118368` has the same contract (in r5/r6/r10/lr, out r2/r3/r5) — looks like a per-frame battle\
  \ actor update trampoline.\n  - The name uses `beastOut_` per the convention from sibling `beastOutOrProgramAdvanceSetTransform_811842C`\
  \ and the table's role as actor-type dispatch. \"runBattleStep\" matches the loadAnimation+update tail.\n"
