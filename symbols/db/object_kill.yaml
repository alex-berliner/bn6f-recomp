name: object_kill
address: '0x080D4EE0'
kind: function
status: probable
summary: 'Tears down a battle object: removes its collision region, clears its bit-1 flag, and queues
  it for destruction unless time-stop is freezing the battle'
interface: (r5 = battle object header, implied) -> r0 = 0; destroys flags/state fields on the object
details: Clears the object's collision region via object_clearCollisionRegion so it no longer participates
  in collision. Then reads oObjectHeader_Flags, bic's bit 1 (0x2), and writes it back — likely clearing
  a 'hittable/active' or 'invulnerable-from-hits' style flag. Calls battle_isTimeStop; if time-stop is
  active (nonzero return) it returns early, deferring destruction. Otherwise it stores CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, which the object state machine interprets
  as 'destroy this object'. Note r5 is used without being set in the routine, so the caller must pass
  the object pointer in r5 (a register-based this-style convention).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_clearCollisionRegion — first removes the object from collision; ldrb/bic #2/strb
    on oObjectHeader_Flags — clears bit 1 of the object''s flags; bl battle_isTimeStop; bne locret — destruction
    is skipped while time-stop freezes the battle; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    — queues the object''s state machine to destroy it; uses r5 as the object pointer without setting
    it — caller supplies the object in r5'
