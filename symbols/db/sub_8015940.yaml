name: sub_8015940
address: '0x08015940'
kind: function
status: hypothesis
summary: Resets the record at byte_203CED0 (marker byte and dword at +4 set to 0xFF) and stores the value returned
  by sub_80103EC at +8.
interface: void initRecord_203CED0(void) /* r4, r5, r6, r10 pass through untouched; caller sees the c/v flags left
  by sub_80103EC */
details: 'Loads the base pointer byte_203CED0 into r5, then writes 0xFF to the first byte (offset 0) and to offset
  4 (the low byte of dword_203CED4). It then calls sub_80103EC with no visible arguments and stores the returned
  word at offset 8 (byte_203CED8). Setting both fields to 0xFF looks like marking entries as "unused/none" before
  filling in the current value, so this is likely an initialization/reset of a small per-run state record — but
  without knowing what sub_80103EC returns or who owns byte_203CED0, the game meaning is unresolved. The pointer
  is kept in r5 across the call, so sub_80103EC must preserve it (or at least the callers of this function have
  been observed not caring). r4, r6 and r10 are neither read nor written; the c and v flags reaching the caller
  are whatever the callee left.

  '
