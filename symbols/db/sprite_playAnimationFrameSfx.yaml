name: sprite_playAnimationFrameSfx
address: '0x081178AC'
kind: function
status: probable
summary: Looks up the current animation frame in an 8-byte-per-entry event table and, if the entry is
  type 3, plays the sound effect recorded in that entry.
interface: (r6 = sprite/anim struct; reads [r6+0x14] anim id and [r6+0x18] frame index) -> r0 = 0, or
  result of sub_803D148(r0 = sfx id, r1 = entry halfword at +4)
details: 'Indexes the table at byte_2019A00 with (anim id + frame index) * 8, so entries are 8 bytes.
  Entry layout: +0 a type/status byte, +2 a halfword, +4 a halfword. If the type byte is 3, it calls sub_803D148
  with (entry+2) + 0x90 as the first argument and entry+4 as the second — the +0x90 base strongly suggests
  an SFX id offset, and entry+4 a volume/pan or playback parameter. If the type byte is not 3 it returns
  0 without doing anything, i.e. only type-3 entries trigger sound. It belongs to the sprite/animation
  cluster around sprite_updatePalette, which shares the same r6 struct and computes animation-related
  indices.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'index = ldrh [r6,#0x14] + ldrh [r6,#0x18], then *8 into byte_2019A00 table (asm lines 3-8);
    cmp r0,#3 / bne return-0 gate: only type-3 entries act (asm lines 10-11); call sub_803D148(r0 = [r7,#2]
    + 0x90, r1 = [r7,#4]) — 0x90 looks like an SFX id base; immediately precedes/interleaves sprite_updatePalette,
    same r6 struct usage (caller 0x08117872); other locals at 0x08117820/0x0811788C call it too, all in
    the same animation-update block'
