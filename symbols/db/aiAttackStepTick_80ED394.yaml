name: aiAttackStepTick_80ED394
address: '0x080ED394'
kind: function
status: confirmed
summary: Ticks down an enemy-AI attack's step timer and, once it expires, arms the hit element and jumps
  to the attack's execution routine.
interface: void sub_80ED394(u32 r1, u32 r3, u32 r5, struct oAIAttackVars* r7, u32 r10); // out r1, r5,
  r10; clobbers r0,r2,r3,r6, nzcv
details: 'Operates on an AI attack state block pointed to by r7 (fields oAIAttackVars_AttackElement, oAIAttackVars_StepTimer,
  oAIAttackVars_HitElement). On the first invocation after an attack is selected (AttackElement == 0),
  it seeds the step timer to 10 ticks and writes 4 into AttackElement to mark the attack armed. Every
  call then decrements StepTimer and returns early while it is still > 0 (the AI waits out the wind-up).
  When the countdown reaches 0, it writes 4 into HitElement (as a halfword, unlike the byte AttackElement)
  and tail-calls sub_80ED3B6, which performs the actual attack and produces the outgoing r1 state; r5
  and r10 pass through unchanged. Control-flow quirk: the timer decrement happens every call including
  the arming call, so an attack armed with 10 ticks actually fires after 9 further calls; entering with
  StepTimer == 0 would underflow to 0xFFFF and still take the fired branch (signed bgt), firing immediately.

  '
