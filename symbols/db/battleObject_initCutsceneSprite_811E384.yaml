    with r0=0x23/r1=0x36 registers sprite table index 0x36. - `bl sprite_setAnimation` and `bl sprite_loadAnimationData`
    with r0=0 reset anim. - `bl sprite_noShadow` is the only "no" helper — the GUI sprite intentionally
    drops the shadow. - 0x280 stored into slotList matches what other battle GUI objects (e.g. cursor/preview)
    use; 0xA palette bank also matches the typical "extra GUI" bank in bn6. - `strb r0, [r5,#8]` writes
    4 at offset 8 (CurState/CurAction union region), consistent with setting an active/visible flag so
    the object is immediately drawn. - Tail-call to battleObject_setCoordsFromCutsceneScript_811E3CC confirms
    the cutscene-script slot 0 coordinate lookup. - The save of only `lr` (push {lr}; pop {pc}) shows
    the function consumes r5/r6/r10 but returns nothing meaningful.'
