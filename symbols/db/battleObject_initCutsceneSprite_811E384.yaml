open_questions:
- 'The exact purpose of value 4 at [r5,#8]: it lands in the CurState/CurAction union (offset 8) but whether
  it is CurState''s "update" (0x04) or some local flag cannot be settled without seeing callers.'
- What r6 carries on entry is undocumented by the contract; other battleObject_ helpers commonly take
  a child/sibling object in r6, but no callee here actually reads it.
- Whether this routine is "battle" or "cutscene" prefixed is uncertain — `battleObject_` matches the r5=battleObject
  convention plus the GUI sprite usage, but no callers are recorded to confirm.
