summary: State-machine step for the object in r5 that runs one sub-step, sets the object's state byte to 0x10, then
  runs a second sub-step.
interface: void sub_811975C(void); /* r5 = object/state pointer (read only); r4-r9 preserved; r0 and NZCV returned
  from sub_811976C */
details: A tiny chaining routine, presumably one entry of a state/handler table for an object (sprite/NPC/battle
  entity). It first calls sub_8119438 (whose own behavior is not visible here), then stores the constant 0x10 into
  byte [r5+9], which reads as the object's state/phase field being advanced to 0x10 (likely a "done"/"advance" marker
  consumed by the enclosing state machine), and finally tail-follows with a call to sub_811976C before returning
  to the real caller with pop {pc}. No other registers or fields are touched; r5 is only used as the base for the
  state byte store.
