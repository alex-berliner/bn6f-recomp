name: navicust_NCP_SlipRunr
address: '0x0813C9E0'
kind: function
status: confirmed
summary: NaviCust "SlipRunner" program hook — turns the SlipRunner effect on by setting a flag byte in the current
  PET's navi stats.
interface: void navicust_NCP_SlipRunr(void); // hidden arg in r10, forwarded to SetCurPETNaviStatsByte
details: 'Hook/apply routine for the SlipRunner NaviCust program. It sets the current PET''s navi stats byte at
  offset 0x35 to 1 via SetCurPETNaviStatsByte(0, 0x35, 1), presumably marking the program as installed/enabled so
  the game''s stat code can then apply the SlipRunner effect. r0 = 0 is likely a slot/index or "current PET" selector,
  0x35 is the stats-field offset for this program, and 1 is the value being written. Notably, r10 is never read
  here but is clobbered in name only — the contract lists it as an input because SetCurPETNaviStatsByte reads r10
  as a hidden argument, so the caller''s r10 flows through unchanged (the push/pop of lr around it does not disturb
  r10). Function is padded with 2 bytes of zeros after pop {pc}.

  '
