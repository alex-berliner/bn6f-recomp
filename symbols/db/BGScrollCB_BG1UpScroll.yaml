name: BGScrollCB_BG1UpScroll
address: '0x080019EC'
kind: function
status: confirmed
summary: BG1 scrolling-callback that advances its counter by 4 and writes the divided scroll value into the BG1
  vertical scroll slot of the toolkit's render info.
interface: 'void BGScrollCB_BG1UpScroll(void);  /* in: r10 = toolkit ptr; clobbers r1, r3, NZCV */'
details: 'Loads the 32-bit scroll-counter from the global array A_eBGScrollCBCounters (offset 0x0),

  stores it back decremented by 4, then shifts the result right by 4 (divide by 16) to obtain a

  BG1 vertical scroll offset. That 16-bit value is written to offset oRenderInfo_Unk_12 in the

  render-info block that R10 (toolkit) points at via oToolkit_RenderInfoPtr.

  The "up" in the name implies BG1 scrolls upward as the counter grows negative; identical-shape

  siblings likely handle BG2/down with different counter slots and offsets.

  No input/output registers besides R10; preserves nothing, returns via mov pc, lr (thumb tail).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
