name: pet_runEffect0AndChatbox30
address: '0x0809CB68'
kind: function
status: probable
summary: Triggers PET effect 0, sets bit 0x80 on eStruct2001010, runs chatbox script 30 of archive 4,
  then zeroes byte at [r5,#8] and word at [r5,#0x70] of a caller-provided struct.
interface: (r0 unused; r5 from caller = state struct) -> void; r0-r3, r12 clobbered by calls
details: 'The routine is a fixed sequence wrapper: it queues PET effect 0 via doPETEffect_8033fc0 (which
  plays sound 0x9B only for effect 3, so no sound here), calls unknown sub_8003984, sets bit 0x80 of the
  eStruct2001010 status byte, then calls chatbox_runScript with r0=4 (archive/index argument, literal-pool
  value) and r1=0x1e (script 30). Finally it zeroes the byte at [r5,#8] and the word at [r5,#0x70] of
  a struct that is never set up inside the function — r5 must be a live register from the caller, a quirk
  of the calling convention. This looks like a one-shot ''show message after a PET effect'' helper, likely
  invoked via tail position or far call since no callers are recorded.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl doPETEffect_8033fc0 with r0=0 queues PET effect 0; bl chatbox_runScript with r1=0x1e and
    literal r0=0x4 (byte_809CEAC+4) runs a fixed chatbox script; bl e_setFlag2001010Bit7 marks the event-structure
    status byte before the script runs; strb/str r0,[r5,#8],#0x70] clear caller-owned state fields; r5
    is never initialized in this function; no archive setup, text pointers, or conditionals — the whole
    body is a hardcoded script-playing sequence
  refs:
  - bn6f/asm/asm28_0.s:4914
  - 0x08040384 chatbox_runScript
  - 0x08033FC0 doPETEffect_8033fc0
  - 0x08003AD4 e_setFlag2001010Bit7
  reproduce: python3 tools/asmcat.py 0x0809CB68
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The assembly confirms PET effect 0, the e_setFlag2001010Bit7 call, chatbox_runScript with r0=4 and
    r1=0x1e, and clearing [r5,#8] and [r5,#0x70]. However, r5 is pushed in the prologue (push {r4-r7,lr})
    without being loaded, so the ''r5 from caller'' quirk claim is wrong — r5 is whatever the caller placed
    in it, but the function does save/restore it, not use it as a fresh quirk. The name ''pet_queueEffectAndRunScript''
    is fine but the summary should not claim r0 is unused (r0=0 is explicitly passed to doPETEffect_8033fc0).
    Also the summary saying ''sets a bit'' is fine, but calling it bit 0x80 is redundant with the callee
    name. Minor naming tweak to drop ''cat'' phrasing.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- what sub_8003984 does (it runs between the effect queue and the flag set)
- which struct r5 points to and what fields 0x8/0x70 mean — needs a caller
- whether r0=4 is an archive pointer, archive index, or something else for chatbox_runScript
- the actual game trigger for this sequence, since no callers are known
- The assembly confirms PET effect 0, the e_setFlag2001010Bit7 call, chatbox_runScript with r0=4 and r1=0x1e,
  and clearing [r5,#8] and [r5,#0x70]. However, r5 is pushed in the prologue (push {r4-r7,lr}) without
  being loaded, so the 'r5 from caller' quirk claim is wrong — r5 is whatever the caller placed in it,
  but the function does save/restore it, not use it as a fresh quirk. The name 'pet_queueEffectAndRunScript'
  is fine but the summary should not claim r0 is unused (r0=0 is explicitly passed to doPETEffect_8033fc0).
  Also the summary saying 'sets a bit' is fine, but calling it bit 0x80 is redundant with the callee name.
  Minor naming tweak to drop 'cat' phrasing.
