name: battle_dispatchStateStep_8008A7C
address: '0x08008A7C'
kind: function
status: confirmed
summary: Battle main-loop state dispatcher — reads the battle state byte and tail-jumps to that state's
  step handler via a 4-entry table.
interface: void battle_dispatchStateStep(r5=battleStateObj, r3, r7, r10); // r0..r2,r4..r12/nzcv clobbered
  per handler; lr must hold return-to-caller address
details: 'Trampoline used by the battle main loop. r5 points at the battle state object; the byte at

  [r5+2] is the current battle state index. It loads a function pointer from the state table

  off_8008A90 (indexed by that byte) and calls it with mov lr,pc; bx r1, so the handler returns

  straight to this function''s caller — the dispatcher leaves no trace on the return address.

  States known from the table: 0 = battle_tickPreBattleInit_8008AA0, 1 = sub_8008B10,

  2 = battle_waitCrossNetReadyStep, 3 = battle_battleEndDelayStep.

  On handler entry: r0 = state byte, r1 = handler address, r3/r5/r7/r10 pass through unchanged,

  so handlers receive the caller''s arguments plus the state object. The tail-call trick means

  the handler''s r2..r12/flags results are effectively this function''s results.

  '
