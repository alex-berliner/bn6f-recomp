name: battle_handShiftStep
address: '0x0802DE74'
kind: function
status: probable
summary: Performs one left-shift step of the selected battle-hand slot's chip data (removing its front
  entry) and flags the corresponding record for update.
interface: (r0 = clobbers; r5 = battle/hand object with selected hand index at +0x16) -> r0 = clobbered;
  sets flag byte
details: Reads the hand slot index from [r5+0x16] and fetches the 0x50-byte hand record via getBattleHandAddr_8010018
  (array at 0x20349C0). If the counter byte at hand+1 is nonzero, it decrements it and shifts three parallel
  u16 arrays (at hand+0x00, +0x0C and +0x18) down by one element for indices 0..5, i.e. six iterations
  copying [i+1] into [i] — dropping the front entry of each array. Then it computes the record for the
  same index in the 0x1D0-stride array at 0x2036120 (via getEntryPtr_2036120_1D0_802E070) and stores 1
  at byte offset 0x53, presumably marking that record dirty/active so a later routine processes the shift
  (likely an animation or hand-refill trigger). No caller is known, so the exact gameplay trigger (chip
  use vs. hand scroll) is unconfirmed.
