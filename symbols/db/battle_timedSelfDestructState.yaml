name: battle_timedSelfDestructState
address: '0x080D8B18'
kind: function
status: confirmed
summary: Per-tick state handler for a battle object that destroys itself after a short 4-tick fuse.
interface: void battle_timedSelfDestructState(r5=battleObject*); caller passes r5/r10; r4-r7 preserved, r0-r3/lr
  clobbered, flags clobbered (r1 left holding whatever battle_dispatchDestroyEvents_802EF5C left)
details: 'Runs on the object in r5. On the first tick (oBattleObject_PhaseInitialized == 0) it blanks oBattleObject_CurAnim
  to 0, spawns an effect of kind 0x14 from the parameter block at obj+0x34 (its three words go in r1-r3 and ldmia
  writeback leaves r0 pointing past the block), sets oBattleObject_Timer to 4, and stores 4 into PhaseInitialized.
  Each tick then decrements the 16-bit Timer; while it stays positive the tick ends. When the fuse reaches 0 the
  object is torn down: battle_dispatchDestroyEvents_802EF5C is called (with r0 = the counted-down value), clearEntryOfBattleStateBattleObjectList_800F656
  removes it from the battle-state object list, object_clearCollisionRegion clears its collision region, and CUR_STATE_DESTROY
  is written to oBattleObject_CurStateActionPhaseAndPhaseInitialized. Quirk: the effect kind 0x14 travels in r4,
  a saved register here, so this function must push/pop r4 even though it also uses it.

  '
