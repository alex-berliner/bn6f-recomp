name: battle_timedSelfDestructState
address: '0x080D8B18'
kind: function
status: probable
summary: Battle-object state that spawns an effect once, waits 4 frames, then destroys the owning object.
interface: (r5 = battle object) -> void; sets oBattleObject_PhaseInitialized, Timer, CurStateActionPhaseAndPhaseInitialized
details: 'First-frame path (PhaseInitialized==0): zeroes CurAnim, reads three words from [r5+0x34] into
  r1-r3, sets r4=0x14 and calls spawn_t1_0x0_EffectObject, then writes Timer=4 and sets PhaseInitialized=4.
  Every frame it decrements Timer; when it reaches 0 it calls battle_dispatchDestroyEvents_802EF5C (destroy
  sub-event signal), clearEntryOfBattleStateBattleObjectList_800F656 (remove from object list), object_clearCollisionRegion,
  and stores CUR_STATE_DESTROY into CurStateActionPhaseAndPhaseInitialized. The 0x34 source and the 0x14
  argument look like effect position/params and an effect kind or size passed to the spawn wrapper. r4
  is live across the spawn call, so it is part of the spawn argument set.'
