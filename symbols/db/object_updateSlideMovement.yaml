name: object_updateSlideMovement
address: '0x080D8A3C'
kind: function
status: confirmed
summary: Advances a sliding battle object by one frame, handling panel-boundary crossings, slide-timer expiry, and
  transitioning back to stopped/idle when the slide cannot continue.
interface: u32 object_updateSlideMovement(u32 obj /* r5 -> battle-object pointer */) -> r1 /* collision panel from
  last object_updateCollisionPanels call */; flags clobbered
details: "Called once per frame for a battle object in a slide state (e.g. a Navi gliding across the battlefield).\
  \ r5 points to the oBattleObject structure.\n1. Lazily initializes the slide phase: reads FuturePanelX/Y, calls\n\
  \   object_canSlideOntoPanel; if the target is invalid it immediately finishes\n   the slide (snaps to current\
  \ panel, sets CurAction=4 which is likely\n   \"stopped/idle\", clears phase). Otherwise writes PhaseInitialized=4.\n\
  \n2. Computes predicted next X = XVelocity + X (fixed-point, 32-bit fields).\n3. Checks whether the predicted\
  \ X crosses a panel boundary by calling\n   IsR2BetweenR0AndR1 with the current X, predicted X, and an ExtraVars\n\
  \   threshold. If it does:\n   - Calls sub_80D8BBC (unknown helper, possibly a boundary-cross event/hitcheck).\n\
  \   - Re-validates the future panel via object_canSlideOntoPanel; if invalid,\n     finishes the slide.\n   -\
  \ Decrements Timer2; if it reaches zero, finishes the slide.\n\n4. Converts the predicted pixel XY to panel coordinates\
  \ via\n   convertBattleObjectXYToPanelXY_800E24C. If the object can slide onto that\n   panel AND its current\
  \ PanelX differs from the new one (i.e. it is crossing\n   into a fresh panel), finishes the slide (snap to panel,\
  \ CurAction=4).\n\n5. Otherwise commits: writes new X, recalculates panels from coordinates\n   (object_setPanelsFromCoordinates),\
  \ refreshes collision panels, and returns\n   with the object still sliding.\n\nFields touched: PhaseInitialized,\
  \ FuturePanelX, FuturePanelY, XVelocity, X, Y, ExtraVars, Timer2, PanelX, CurAction, CurPhaseAndPhaseInitialized.\
  \ Quirk: PhaseInitialized is set to the same literal 4 that CurAction uses for \"stopped\"; this likely means\
  \ the phase enum and action enum share numbering.\n"
