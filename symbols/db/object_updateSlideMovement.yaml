name: object_updateSlideMovement
address: '0x080D8A3C'
kind: function
status: probable
summary: 'Battle-object movement phase: slides the object along X toward its FuturePanel target at XVelocity,
  aborting if the target panel becomes invalid, then snaps panels and ends the action.'
interface: (r5 = battle object pointer, r0 = 0 on entry for phase init) -> r0 = 0 when the move finishes,
  else non-zero/returns while moving; flags clobbered
details: 'Phase-gated via oBattleObject_PhaseInitialized: on first entry it calls sub_80D8C10(FuturePanelX,
  FuturePanelY) and only arms the phase (sets PhaseInitialized = 4) if that check passes. Each tick it
  computes newX = X + XVelocity and uses IsR2BetweenR0AndR1 with ExtraVars as a target X to detect when
  the slide has reached or passed the destination. If the target X is crossed, sub_80D8BBC runs, the target
  panels are re-validated, and Timer2 counts down frames before the move completes. Completion (loc_80D8A7E)
  calls object_setCoordinatesFromPanels and object_updateCollisionPanels, sets CurAction = 4 and clears
  CurPhaseAndPhaseInitialized; if mid-slide the target becomes invalid or the object already entered the
  next panel, it finishes early by snapping the current coordinates instead. Otherwise it commits newX
  to X and refreshes PanelX/PanelY and collision panels each step.'
