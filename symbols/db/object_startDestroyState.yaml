name: object_startDestroyState
address: '0x080DD584'
kind: function
status: probable
summary: 'Begins a battle object''s destruction: removes it from its collision region, switches its animation,
  and moves it to the destroy state.'
interface: (r5 = battle object) -> void; writes oBattleObject_CurAnim = 1 and CurState = CUR_STATE_DESTROY
details: The routine first clears the object's collision region via object_clearCollisionRegion, so it
  no longer participates in collision handling. It then writes 1 into the object's current animation byte
  at r5+oBattleObject_CurAnim (likely a destroy/despawn animation) and stores CUR_STATE_DESTROY into the
  combined current-state/phase word at r5+oBattleObject_CurStateActionPhaseAndPhaseInitialized, which
  is what drives the state machine to run the destruction sequence. It takes its object in r5, not r0,
  and returns nothing. The animation value 1 being hardcoded suggests this is the standard death/despawn
  path for a particular object class.
