name: ai_tenguLoadAttackDamage
address: '0x080F9222'
kind: function
status: probable
summary: Loads TenguMan's attack damage pair from two AI-version-parameter tables and stores it packed
  into the battle object's AI attack-damage field (AIData+0xA0).
interface: (r0 = attack/table index) -> r0 = packed value; stores word at [battleObj->AIData + 0xA0] (oAIAttackVars_Damage)
details: Takes an index in r4, scales it by 8, and fetches two entries via battle_aiGetVersionedTableEntry_800FE12
  — one from table byte_80F9284 and one from byte_80F92A8 — so both values vary with the battle object's
  AI version. The first value is kept as the low halfword, the second is shifted left 16 and OR'd in,
  producing a packed word. This word is written to AIData+0xA0, the known oAIAttackVars_Damage field of
  the AI attack-vars block. All callers are TenguMan AI routines (ai_tenguInitAttack sets up an attack
  with rolled duration/boost values), so this fills in the damage side of that setup.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: two battle_aiGetVersionedTableEntry_800FE12 calls with tables byte_80F9284 and byte_80F92A8,
    index*8 in r0; lsl r0,#0x10 + orr r6 packs the second table value into the upper halfword; str r6,[r3,#0xA0]
    after r3=[r5+oBattleObject_AIDataPtr]+0xA0 writes oAIAttackVars_Damage; only callers are TenguMan
    AI attack-init/step routines at 0x80F9168/0x80F91A2/0x80F91F6
