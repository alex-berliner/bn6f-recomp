  reproduce: python3 tools/asmcat.py 0x080EF6FC
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the described behavior: RNG-pick path at loc_80EF712, charge-cycle decrement at
    loc_80EF722, panel-choose call at loc_80EF75E, mapping via byte_80EF7D8, getChip8021DA8 fetch, writes
    to ChipID/byte 0xC/word 0x10/byte 0xB, and the boss vs. normal CurAction=0x41 split. However, the
    proposal misnames several offsets (oAIAttackVars_AiDifficultyTier for byte 0xC, oAIAttackVars_AttackBoost2
    for word 0x10) and oAIAttackVars_PanelChooseCallback is wrong (the actual compute is `r3 = (0x14>>2)+0x30+r7`,
    not loading a stored callback). Also the summary overstates ''AiDifficultyTier'' semantics and the
    read at the end (byte 0xF -> PwrAtkState) applies to boss range 0xB..0x18 *or* invincibles, which
    the proposal misses.; run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
