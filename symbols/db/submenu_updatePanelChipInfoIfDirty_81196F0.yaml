open_questions:
- The exact semantics of r5+0x9=0x04; it looks like a CurAction kick (compare with sub_menu_struct CurAction
  enum) but the struct mapping to SubMenu offsets above is thin, so the meaning is inferred.
- 'The 0xFF exit r0 in unchanged path: probably an artifact of sub_8119880 leaving r0=0xFF; whether that''s
  a sentinel or just dead return is unclear from this function alone.'
- Whether sub_8119880 truly compares +0xE to +0xF rather than +0xE to itself in a different slot — the
  contract summary claims +0xE vs +0xF but the assembly here only touches +0xE/+0xF via that helper and
  the local cache uses +0xC/+0xD/+0x10/+0x18/+0x1A.
