name: eStruct200A008_setUnk02
address: '0x0800B6C2'
kind: function
status: confirmed
summary: Writes a one-byte value into offset 2 of the fixed overworld player struct at 0x200A008 and returns the
  struct's base address.
interface: void owPlayer_setUnk02(u8 value); /* returns r1 = struct base 0x200A008, value stored at byte_200A00A
  */
details: 'Loads the address labeled eOWPlayerObjectEnd (0x200A008, the base of a small overworld-player-related
  struct/RAM pool) into r1 and stores the low byte of r0 with strb at [r1,#2], i.e. into byte_200A00A (offset 2
  of the struct). It then returns with r1 still holding the struct base address, so callers get a pointer to the
  struct as a side effect of the setter. r0 is treated as a byte value; lr is the return address. No other registers
  or flags are touched. The "eOWPlayerObjectEnd" labeling ties this pool to the overworld player object data, but
  the meaning of the byte at offset 2 is not established from this function alone.

  '
