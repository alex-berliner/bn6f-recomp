open_questions:
- what unk_20347D8's tile-id table depicts (dialog window vs. cutscene graphic)
- what the state>>4 value selects inside sub_8120348 (layer/offset vs. mode)
- what sub_8130404's record and its +0xC counter represent, and what sub_8130850 prepares
- The proposal correctly identifies the decrement-counter gate, the tile-table at unk_20347D8, and the
  two blit calls. However, the summary says tile block 2 is used for the tilemap filler when in fact r2=2
  is passed to CopyBackgroundTiles, and the filler sub_8120348 uses r3=1 (first arg=1, not block). Also,
  r0>>4 is passed as the first arg to the filler, not to CopyBackgroundTiles. More importantly, the name
  't4_drawTilemapRect' is reasonable but 't4_drawTextBox' or 't4_stampBoxTiles' better reflects the blank-text-box
  tile behavior of sub_8120348. The revised summary should note it draws the HP/emotion box based on player
  state nibble.
