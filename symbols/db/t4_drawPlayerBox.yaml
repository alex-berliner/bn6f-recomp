name: t4_drawPlayerBox
address: '0x08130810'
kind: function
status: probable
summary: Overlay helper that, gated on a scene counter, reads the player object's state nibble and stamps
  the HP/emotion box tiles (from unk_20347D8) into BG tile block 2 via sub_8120348 + CopyBackgroundTiles.
interface: () -> void; no incoming args — it fetches the scene record via sub_8130404 and reads its byte
  at +0xC as a counter, using (counter-1) as the slot for battle_getPlayerCurState_8137884.
details: It first calls sub_8130404 (returns a scene/record pointer in r7) and sub_8130850, then exits
  early if the record's byte at +0xC is zero; otherwise it decrements that byte and reads the battle object's
  state byte for slot (value-1) via battle_getPlayerCurState_8137884, using state>>4 as the first argument
  to the tilemap filler. It calls sub_8120348 with r1 = &unk_20347D8 (tile-id table), r2 = 10, r3 = 1,
  r4 = 15 to fill the base spans with the blank text-box tile, then CopyBackgroundTiles(8, 6, block 2,
  &unk_20347D8, 15, 2) to stamp the tile rectangle from the same table into BG block 2. unk_20347D8 therefore
  holds the tile-id pattern (including the blank tile index) for the drawn region. The second word of
  off_8130848 (unk_20018EC) is not used by any code path visible here.
