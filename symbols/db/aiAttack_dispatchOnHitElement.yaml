name: aiAttack_dispatchOnHitElement
address: '0x080F0094'
kind: function
status: probable
summary: Dispatches an AI attack's update to one of two handlers chosen by the attack's HitElement flag,
  tail-calling either the hit handler (sub_80F00B0) or the per-frame timer tick (aiAttack_tickTimerAndExitWhenDone).
interface: (r7 = attack object with oAIAttackVars_HitElement) -> tail-jump to handler; no direct return
  value of its own
details: 'Reads the byte at r7+oAIAttackVars_HitElement and uses it as an index into the table off_80F00A8,
  then performs a computed ''call'' via mov lr, pc; bx r1 so the selected handler runs with this function''s
  return address. The table has only two entries: entry 0 is sub_80F00B0+1 and entry 1 is aiAttack_tickTimerAndExitWhenDone+1,
  so HitElement acts as a boolean (not-hit vs hit, or element vs none). Because the index byte is not
  masked, any value >1 would read past the two-word table, implying HitElement is expected to be 0 or
  1 here. It is effectively a branch-on-hit-state wrapper inside the AI attack update path.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0] indexes off_80F00A8 by the hit-element
    byte; table off_80F00A8 has exactly two targets: sub_80F00B0+1 and aiAttack_tickTimerAndExitWhenDone+1;
    mov lr,pc; bx r1 is a Thumb long-call, so this is a dispatcher, not a jump table switch; known callee
    aiAttack_tickTimerAndExitWhenDone shows one branch is the idle/not-yet-hit attack timer path'
  refs:
  - bn6f/asm/asm31.s:123327
  reproduce: python3 tools/asmcat.py 0x080F0094
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- what sub_80F00B0 does (presumably the on-hit effect), and whether HitElement is a strict boolean or
  an element id truncated to two cases
- no known callers, so the object layout behind r7 and when this runs per attack are inferred only from
  the oAIAttackVars field name
