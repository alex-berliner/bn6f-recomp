name: chatbox_processScriptEntry_80419D0
address: '0x080419D0'
kind: function
status: confirmed
summary: Processes one 5-byte chatbox script entry, either advancing past it (0xFF end marker) or loading its script
  ID into the chatbox.
interface: chatbox_processScriptEntry(Entry* r4 /*current entry*/ /*r10 = chatbox context, passed through*/); returns
  r0 = 1 always
details: 'r4 points at the current chatbox script entry, a 5-byte record. The state byte at [r4+2] is passed to
  sub_8048C24 (which presumably consults the chatbox/text state, likely using r10 as context), and its boolean-ish
  return selects which trailing byte holds the script ID: offset 3 when the state check is nonzero, offset 4 when
  it is zero. The script ID is then loaded into r1 before the branch. If the ID is 0xFF (end-of-script marker),
  r4 is advanced by 5 to point at the next entry and the function returns without any further action. Otherwise
  the ID is handed to chatbox_config_80408D0 (its r0 "notUsed" parameter receives the state-check result and is
  ignored by that callee). Always returns r0 = 1 (true, "keep running"/entry handled). NZ flags are set from the
  return value. r5/r6/r7 are preserved despite being listed as inputs, so callers may pass values through them.

  '
