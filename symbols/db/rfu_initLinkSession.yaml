name: rfu_initLinkSession
address: '0x081465BC'
kind: function
status: probable
summary: Initializes the wireless adapter (rfu) API on a fixed work buffer, installs its timer interrupt,
  tears down any current link, and resets the eLink state block for a new link session.
interface: (no args) -> r0 = 1 if rfu_initializeAPI succeeded (returned 0), else 0; calls rfu_setTimerInterrupt(3,
  off_3000E8C-4), link_RequestDisconnect, eLinkState_ResetForNewUse(4)
details: Calls rfu_initializeAPI with the fixed work buffer unk_3000000, size 0xE64, callback pointer
  off_3000E8C, and flag 1; on success (return 0) it wires the STWI timer via rfu_setTimerInterrupt with
  timer 3 and the interrupt handler stored just before off_3000E8C (r1 = off_3000E8C - 4), then requests
  link teardown (state 4) and resets the eLink/link-battle state block for reuse. Returns 1 on success,
  0 if rfu_initializeAPI failed. No inputs; everything is set up for a fresh wireless link session, which
  matches the SubMenu caller resetting eLink state and advancing to phase 4 (the link-wait phase) on r0
  != 0.
