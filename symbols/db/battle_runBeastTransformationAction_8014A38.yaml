name: battle_runBeastTransformationAction_8014A38
address: '0x08014A38'
kind: function
status: confirmed
summary: Dispatches the per-actor-type AI step for a beast/cross-process transformation attack, selecting a handler
  table by actor type and hit element, then refreshes the sprite animation unless suppressed by an AI-data flag.
interface: void Next(void)  /* r5 = battleObject*, r7 = AIAttackVars*; preserves r5 r8 r9 r10 r11 r12 through callees
  */
details: 'Reads oBattleObject_Alliance from r5, then calls battle_ai_getActorInfo_801595E to obtain the numeric
  actor type (1..0x18 maps to the various beast/cross forms). If the type is out of range (<1 or >0x18) the function
  clears AI-data flag 0x80 via ClearAIDataUnk0x48Flag and returns immediately. Otherwise it selects one of five
  jump-tables based on actor type ranges: actor_type < 0x0B → off_8014AB4 (transformation intro, beast-SP attack,
  move landing); 0x0B ≤ type < 0x0D → off_8014AC8 (relocate to panel, fire-attack step, exit state); 0x0D ≤ type
  < 0x17 and navi stat byte 0x2C ≤ 0x0A → off_8014ADC (land at target, rise up, forward attack, delayed trigger);
  0x0D ≤ type < 0x17 and stat > 0x0A → off_8014B04 (panel emerge, white flash, navi attack intro, timer finish);
  type ≥ 0x17 → off_8014AF0 (late-form handlers, attack timeout). Each table is indexed by oAIAttackVars_HitElement
  (0-3) from r7, and the selected 4-byte entry is branched to via bx. After the handler returns, GetAIDataUnk0x48Flag
  is checked against bit 0x80000; if that bit is clear, battleObject_updateSpriteAnimIfChanged_801BCD0 refreshes
  the battle-object sprite animation. Structures touched: BattleObject (alliance field), AIAttackVars (hit element
  field), AI data word at offset 0x48.

  '
