open_questions:
- The semantics of sub_801595E return r0 (looks like a Navi grade 0..0x17, but its summary is unknown).
- Exact identity of each 4 sub-functions in the 5 tables; only the bytes are known, the labels are guesses
  (battle_runTransformationIntroStep_8014BEE etc.).
- Whether 0x80000 in AIData->Unk_48 means "this AIData is currently in beast mode" or "skip the next per-frame
  step".
