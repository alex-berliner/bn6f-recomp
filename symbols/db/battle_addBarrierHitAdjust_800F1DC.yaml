name: battle_addBarrierHitAdjust_800F1DC
address: '0x0800F1DC'
kind: function
status: confirmed
summary: If the incoming hit/event type targets a barrier (types 0x5F-0x61 or 0x150) and the battle object has an
  active barrier, adds 50 (0x32) to the value passed in r0.
interface: u32 battle_addBarrierHitAdjust(u32 value /*r0*/, u32 arg1 /*r1, preserved*/, u32 hitType /*r2*/, BattleObject*
  obj /*r5*/); // returns possibly adjusted value in r0; also returns collision ptr in r3
details: 'Part of the battle damage/hit processing chain. Callers pass a value in r0 (damage or a hit-related stat)
  and the incoming hit/event type in r2, with r5 pointing at a battle object whose oBattleObject_CollisionDataPtr
  field holds a collision data record. Only certain hit types are barrier-relevant: the special value 0x150, and
  the range 0x5F..0x61 inclusive; anything else leaves r0 untouched and returns early. For relevant types the function
  loads the collision data pointer and reads oCollisionData_Barrier. The barrier byte counts as "active" only when
  it is nonzero and below 0x10. Special case: barrier value 8 is only treated as active if oCollisionData_Unk_16
  is nonzero (a secondary counter/charge for that barrier variant). When the barrier is active, 0x32 (50) is added
  to r0 — consistent with a barrier absorbing/buffering incoming hits (barrier HP values in this family are often
  multiples such as 50). On exit r3 holds either the collision data pointer or the sentinel 0x150 (when the type
  check failed before the pointer was loaded); r2 ends up holding the barrier/Unk_16 byte on barrier-check paths.
  Flags on return are leftovers of the last comparison (or the add of 0x32 on the adjusted path), so callers that
  branch on returned flags would be sensitive to exit path. r1, r6, r7 and lr are preserved (pushed/popped); note
  r1 is pushed purely to keep the stack aligned but is genuinely preserved.

  '
