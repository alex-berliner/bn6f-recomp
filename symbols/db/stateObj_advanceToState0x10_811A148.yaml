name: stateObj_advanceToState0x10_811A148
address: '0x0811A148'
kind: function
status: confirmed
summary: Lazily initializes a state object, switches it to state 0x10, and steps it once.
interface: void stateObj_advanceToState0x10(void); /* r5 = state object pointer, preserved; returns whatever sub_811A160
  leaves in r0 */
details: 'Small state-machine step for the object whose pointer lives in r5 (r5 is not passed explicitly but is
  assumed set by the caller). If the byte at r5+4 (looks like an "initialized" flag) is still zero, it first calls
  sub_8119EEC to run that object''s initialization. It then writes 0x10 to the state byte at r5+9, and tail-calls
  sub_811A160 (via bl, then pop {pc}) to advance the object to its next state. r0 on return is whatever sub_811A160
  left. The state value 0x10 and the +4/+9 field offsets are the notable constants; the two callees carry the real
  per-state behavior.

  '
