name: zeroFill_e200F3A0
address: '0x0800182E'
kind: function
status: confirmed
summary: Zero-fills the 12-byte structure pointed to by the toolkit's oToolkit_Unk200f3a0_Ptr field.
interface: 'void zeroFill_e200F3A0(void /* r10: toolkit base, r3: passed through untouched */), returns with r2
  = toolkit base pointer (r10) and r3 unchanged'
details: Reads a pointer from the toolkit (r10) at offset oToolkit_Unk200f3a0_Ptr, then calls ZeroFillByWord with
  that pointer and a byte count of 0xC (12 bytes). The r10-based base pointer is copied into r2 before the call,
  so callers that want the toolkit pointer afterwards can read it from r2; r3 is neither read nor modified, merely
  preserved through the call. No flags or other registers are meaningful on return. The target struct's purpose
  is unknown, so this is likely a per-battle or per-frame reset of some 12-byte scratch/entry block.
