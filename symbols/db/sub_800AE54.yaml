name: sub_800AE54
address: '0x0800AE54'
kind: function
status: confirmed
summary: Looks up an object in one of the battle-state's object pointer lists by a 2-byte key (bytes 0x12/0x13 of
  the entry), returning the matching object or 0.
interface: u32 battleStateFindObjectByKey_800AE54(u8 keyA, u8 keyB, u32 listSelector); // r0=keyA, r1=keyB, r2=listSelector;
  returns object in r0; NZCV set per tst/cmp; r4,r6,r7 preserved
details: 'R10 holds the toolkit/Engine pointer; oToolkit_BattleStatePtr (0x4C) yields the battle state base.

  dword_800AE8C is a packed descriptor table addressed by (r2 << 1): each 2-byte entry is {offset from

  battle state (u8), entry count (u8)}. The first table entry decodes to offset 0x48, count 0x49

  (i.e. 73 slots × 4 bytes), so this covers the "objects" array of the battle state. The routine

  linear-scans that array of u32 pointers and, for each non-zero pointer, compares its bytes 0x12

  and 0x13 against r0/r1. On a hit it returns the object pointer with r2 = remaining count and

  r3 = address of the matching slot; on miss it returns 0 with r2 = 0 and r3 = the slot just past

  the end. The "key" bytes at +0x12/+0x13 are commonly the object type/ID pair used by BN''s battle

  objects. Selectors other than 0 would address the two bytes that follow in the table, so the

  same function is reused for any other descriptor-indexed object array the engine has.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
