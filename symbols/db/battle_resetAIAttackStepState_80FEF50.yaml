name: battle_resetAIAttackStepState_80FEF50
address: '0x080FEF50'
kind: function
status: confirmed
summary: 'Resets an AI attack''s per-step state: clears the sub-step index and panel param flags and restores
  the hit element to its default (0xC = no element).'
interface: void battle_resetAIAttackStepState(void) // r7 = AIAttackVars*; no outputs; clobbers r0 and
  NZ flags
details: 'Writes through the AI attack variables struct passed in r7 (kept in r7 by the caller, not a
  stack parameter): stores 0 into the byte at oAIAttackVars_SubStepIndex, stores 0 into the 32-bit oAIAttackVars_PanelParamFlags2,
  and stores 0xC (halfword) into oAIAttackVars_HitElement, which is evidently the "no element / neutral"
  sentinel for hit-element tracking. Presumably called at the start or end of an AI attack routine to
  reinitialize state between sub-steps. lr is pushed/popped as a tail-call-style return to the caller.'
