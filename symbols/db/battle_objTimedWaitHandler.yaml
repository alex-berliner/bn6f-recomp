summary: Per-frame state handler for a battle object that runs a 30-frame timed wait with animation 5,
  fires a one-shot helper at the halfway mark, then ends by setting CurAction to 0x14.
interface: (r5 = battle object ptr, read only) -> updates object fields; no return value
details: 'Standard battle-object state machine step keyed on oBattleObject_CurPhase. On phase 0 it initializes:
  writes phase=4, CurAnim=5, and Timer=0x1e (30 frames), then returns. While phase 4 runs it decrements
  Timer each frame; when Timer reaches 0xf it calls sub_80BAA0C (presumably spawning a mid-sequence effect),
  and when Timer counts below 0 it sets CurAction=0x14 and clears CurPhaseAndPhaseInitialized so the object''s
  action/phase machine moves on. The 0xf-frame midpoint trigger suggests an event timed partway through
  the 30-frame animation.'
