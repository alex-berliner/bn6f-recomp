status: probable
summary: returns true (r0=1 -> 7) while the per-battle scenario-effect state at eScenarioEffectState2000780+0xE
  is non-zero, serving as a guard for the scenario-effect handlers
interface: () -> r0 = 1 if scenario-effect state+0xE != 0 else 0 ; sets NZ, clobbers r4, restores lr via
  tail-call
details: "Tail-call helper: push {r4-r7,lr} only to load r5 with the absolute address of eScenarioEffectState2000780\n\
  \  (commented `off_8142308`), then ldrb r0,[r5,#0xE] reads the one-byte scenario-effect flag, and `tst\n\
  \  r0,r0` followed by pop {r4-r7,pc}` returns NZ/Z in r0 via the pop's load of pc. The five callers\n\
  \  (sub_808983A / 808985A / 80898B2 / 80899F2 / 8089C16, all in the BeastSP / Beast-Out handling block)\n\
  \  branch-test the returned flag to decide whether to apply the scenario effect (extra Beast-Out\n \
  \ formulas keyed by Version_16/Version_17, which the captured snap @02011860 shows at offsets\n  0x09=BeastOut\
  \ APwrAtk, 0x0a=Unk, 0x19=ChipLockoutTimer, etc.). Because it tail-calls through\n  `{r4-r7,pc}`, the\
  \ contract lists r4/r5/r7 in `out` and may_write them. Behaviorally `void`/bool.\n"
