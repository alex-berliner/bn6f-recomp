name: resetAllGraphicsState_8005F40
address: '0x08005F40'
kind: function
status: confirmed
summary: Resets all graphics state for a fresh scene by clearing VRAM, work RAM buffers, extended palettes, and
  render info, and installing dummy BG scroll callbacks.
interface: void sub_8005F40(void)  /* no inputs; r4-r7 preserved and pass through, r0-r1/lr and flags clobbered
  */
details: 'Pure initialization sequence with no parameters or return value: calls zeroFillVRAM to blank VRAM, clears
  the sprite/OAM work area at 0x3001960, installs the dummy (no-op) BG scroll callbacks via SetDummyBGScrollCallbacks
  so no real scroll handlers run until a scene sets them, clears the EWRAM graphics buffer at 0xe20094c0, wipes
  extended palette RAM at 0x20097a0 via palette_clearEPalette20097a0_80023A8, clears the second EWRAM buffer at
  0xe2009740, the IWRAM buffer at 0xe200f3a0, and the misc render state at 0x80024a2, then resets both render info
  blocks (renderInfo_8001788 and renderInfo_80017A0). Likely called at scene/boot transitions before a new scene
  loads its own tiles, palettes, and scroll handlers.

  '
