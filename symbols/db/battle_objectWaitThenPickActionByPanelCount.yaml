name: battle_objectWaitThenPickActionByPanelCount
address: '0x080C2216'
kind: function
status: probable
summary: 'Battle-object phase handler: on entry counts matching panels into Param2 and waits 60 frames,
  then dispatches to CurAction 8 if any panel matched, else to CurAction 0x1c.'
interface: (r5 = battle object) -> updates object fields; no return value
details: 'Uses r5 as the battle object pointer, not r0. On the first invocation (PhaseInitialized == 0)
  it sets PhaseInitialized = 4, CurAnim = 0, calls battle_countPanelsForAlliance which stores the matching-panel
  count in the object''s Param2, clears Param1, and sets Timer = 0x3c (60 frames). On subsequent calls
  it decrements Timer until it hits zero. Then it branches on Param2: if nonzero it sets CurAction = 8,
  otherwise CurAction = 0x1c, and in both cases clears CurPhaseAndPhaseInitialized to restart a new action/phase.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized]/bne skips the init block, which sets PhaseInitialized=4
    and Timer=0x3c; bl battle_countPanelsForAlliance fills Param2 with a panel count before the wait,
    and that count is the only branch condition afterwards; after Timer expires, tst Param2 picks strb
    #8 vs #0x1c into oBattleObject_CurAction; both branches strh #0 to oBattleObject_CurPhaseAndPhaseInitialized,
    the standard phase-reset pattern; the structure (init-once flag, frame countdown, action dispatch)
    matches battle object per-phase step handlers'
