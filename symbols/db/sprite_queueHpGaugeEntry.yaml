name: sprite_queueHpGaugeEntry
address: '0x0800AE90'
kind: function
status: probable
summary: Queues a 16-byte graphics-FIFO record that draws a small HP-gauge sprite at the given screen
  position, alternating its record type every 8 frames and playing sfx 0x91 every 16 frames.
interface: (r0 = screen x, r1 = screen y) -> void; plays sfx 0x91 when (frame & 0xF)==0; pushes FIFO record
  only if x+16 < 0xFF and y+16 < 0xB0; clobbers r2-r7,r6 via calls
details: The function takes an on-screen position, bounds-checks it (x+16 must stay under 0xFF, y+16 under
  0xB0, i.e. inside the 240x160 screen with a 16px margin) and otherwise silently returns. It packs the
  position as ((x | 0x400000) << 16) | y — the 0x400000 flag likely marking a gauge/HUD element — into
  a 16-byte record pushed to the render FIFO ring buffer at dword_3002180 via fifo_pushRecord16_8009FF8.
  The record's ID is 0xD3CA or 0xD3CE, selected by bit 3 of the current frame counter (r10->CurFramePtr),
  so the element alternates between two graphics every 8 frames, most plausibly a blinking gauge animation.
  Independently, every 16 frames (frame & 0xF == 0) it plays sound effect 0x91, matching the caller's
  documented 'gauge change sound' behavior.
