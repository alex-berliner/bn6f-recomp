name: reqBBS_81408C8
address: '0x081408C8'
kind: function
status: confirmed
summary: Returns the e-Request ID of the entry currently selected on the e-Reader-style BBS board, combining cursor
  position and page offset.
interface: u32 reqBBS_getSelectedEntryId_81408C8(void* board_state /* r5 */); returns entry ID in r0, r5 passed
  through unchanged
details: 'Reads the BBS board selection state from the struct at r5: halfword at +0x20 (cursor/page index) plus
  halfword at +0x24 (per-page offset / scroll) forms an index into the reqBBS_eRequestEntriesIDs byte table, and
  the byte at that index (the e-Request ID for that board slot) is returned in r0. r5 is untouched, so callers can
  chain further board-state queries. lr is pushed/popped only for the return, no flags or other registers are used.
  Part of the BN6 e-Request / BBS board subsystem (reqBBS_ prefix, entries referenced through reqBBS_eRequestEntriesIDs).

  '
