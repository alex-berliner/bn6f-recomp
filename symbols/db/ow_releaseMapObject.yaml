name: ow_releaseMapObject
address: '0x080A9F4E'
kind: function
status: confirmed
summary: Thin overworld wrapper that releases a map object slot by forwarding the object pointer in r5 to FreeOverworldMapObject.
interface: 'void ow_releaseMapObject(void) // in: r5 = map object pointer; out: r2, r3 = values left by FreeOverworldMapObject
  (callers read only these); clobbers r0, r1, lr, nzcv'
details: 'A two-instruction tail-call thunk (save r4-r7/lr, bl FreeOverworldMapObject, pop into pc).

  It simply passes the map object pointer in r5 to FreeOverworldMapObject, which frees the

  object''s slot in the overworld map-object structures. Callers of this wrapper read back only

  r2 and r3 of whatever FreeOverworldMapObject returns (release status and related values);

  r0/r1 and the flags are treated as clobbered. No logic of its own — it exists purely as a

  named call site so callers get a labeled "release map object" step in the call graph.

  '
