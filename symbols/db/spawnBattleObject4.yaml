name: spawnBattleObject4
address: '0x080033C8'
kind: function
status: probable
summary: Thin wrapper that spawns a battle object of type 4 from a 5-word caller context and links it
  into the battle object list.
interface: (r0-r4 = spawn record fields) -> r0 = BattleObject* or NULL; flags clobbered by calls
details: Stores the five incoming registers (r0-r4) as a 20-byte stack record, then calls SpawnBattleObjectCommon
  with object type 4 in r0 and the record pointer in r1. If the returned pointer is non-NULL it calls
  UpdateBattleObjectLinkedList to append the new object to the battle object list; the NULL case is skipped
  silently. This is just a convenience wrapper fixing obj_type=4; the semantics of type 4 and of the five
  record fields are not visible here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'stmia r7!, {r0-r4} copies the caller''s 5 registers to the stack record passed as ctx; mov
    r0, #4 before bl SpawnBattleObjectCommon fixes the object type to 4; tst r5, r5 / beq skips UpdateBattleObjectLinkedList
    only when allocation returned NULL; callees SpawnBattleObjectCommon (pool alloc + header init from
    stack record) and UpdateBattleObjectLinkedList (list tail insert) match a spawn-and-link wrapper'
