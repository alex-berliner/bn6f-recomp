name: battle_weatherCompDispatch_80A92B8
address: '0x080A92B8'
kind: function
status: confirmed
summary: Dispatches a battle object to one of four weather-comparison state handlers based on its state
  byte at +8.
interface: void sub_80A92B8(r5=object, r10=passthrough); outputs r2,r3,r4,r5,r8,r9,r10,r11,r12 come from
  the chosen handler; clobbers r0,r1,r6,r7,lr and flags
details: 'A tiny state-machine dispatcher for the "weather comparison" battle effect (likely the Falzar/Brazilian
  weather system that alters attack properties). r5 points to a battle object whose byte at offset +8
  holds the current state (0..3); that byte indexes the handler table off_80A92CC and the entry is jumped
  to via the classic ''mov lr, pc; bx r0'' tail-call, so handlers return directly to this function''s
  caller. Before branching it loads r6 with the shared state block eWeatherCompState and passes r10 through
  untouched. Handlers: state 0 = sprite_initBeastSp (initial/ reset state), states 1-3 = sub_80A931C/sub_80A9360/sub_80A93D0.
  All register outputs and clobbered flags are whatever the selected handler leaves behind; the dispatcher
  itself only sets r6, r1 (re-used by the ldrb) and r0.'
