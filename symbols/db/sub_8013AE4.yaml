name: sub_8013AE4
address: '0x08013AE4'
kind: function
status: probable
summary: Applies a chip-driven alliance adjustment to a navi's alliance stat, capped at 7, when the chip's collision-data
  byte 0xA4 indicates an alliance-modifying chip (0x18 or 0x19).
interface: 'void sub_8013AE4(u32 battle_object /* r5 */);

  // reads r5 in, no return value; clobbers r0-r3, lr; preserves r6, r7

  '
details: "Loads the battle object's collision-data pointer (offset oBattleObject_CollisionDataPtr),\nthen inspects\
  \ byte 0xA4 of that structure to decide whether/how to modify the navi's\nalliance stat.\n  - byte 0xA4 == 0:\
  \ function returns immediately (no effect).\n  - byte 0xA4 == 0x18 or 0x19: reads byte 0xA5, adds the current\
  \ navi alliance stat\n    (obtained via GetBattleNaviStatsByte_AllianceFromBattleObject), clamps the sum to\n\
  \    a maximum of 7, and -- only if byte 0xA4 is also < 0x64 when treated as signed --\n    writes the result\
  \ back via SetBattleNaviStatsByte_AllianceFromBattleObject.\nThe < 0x64 signed check is effectively a guard: once\
  \ the chip-effect counter reaches\n0x64 the adjustment is suppressed, so repeated applications of the same chip\
  \ hit a\nceiling instead of stacking past +7. Clamp at 7 matches the in-battle alliance scale\nfor chips like\
  \ AppleDay/Alliance-related chips in the Battle Network series.\nBytes 0xA4/0xA5 of the collision data are a per-chip-effect\
  \ scratch pair (effect kind\nand magnitude) embedded in the chip's collision payload.\n"
