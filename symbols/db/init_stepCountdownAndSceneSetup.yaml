name: init_stepCountdownAndSceneSetup
address: '0x0809A630'
kind: function
status: probable
summary: 'State-step handler on a per-object pointer in r5: while EVENT_F6 is set it counts a halfword
  timer down at r5+0xc and updates a word at r5+0x70 by a byte at r5+0xf each tick; on expiry it re-reads
  r5+0x70 via sub_802D15E and, if EVENT_F5 is set, performs a one-shot scene setup (writes 0x20 to r5+0x04,
  resets and respawns the battle eStruct records from byte_8099E90, patches three table entries via r5+0x7c/r5+0x80,
  moves three sprites to (-0x30, 0x58, 0), clears EVENT_F6) and returns 0; otherwise it calls sub_809A80C
  on r5+0x74 and returns 1.'
interface: (r0-r4 unused; r5 = this-object with fields 0x04, 0x0c, 0x0f, 0x70, 0x74, 0x7c, 0x80) -> r0
  = 0 once the setup has fired, 1 while still waiting; flags clobbered by bls
details: 'While EVENT_F6 is set it decrements the halfword at r5+0x0c and subtracts the byte at r5+0x0f
  from the word at r5+0x70 each tick; when the halfword goes negative it re-reads a value via sub_802D15E
  into r5+0x70. If EVENT_F5 is also set, it does the one-shot setup: writes 0x20 to r5+0x04, calls sub_809A308,
  resets the eStructArr2008450 scene-record array, respawns records from table byte_8099E90, patches three
  consecutive table entries (base id from r5+0x7c, values 0x80/0/0 read relative to r5+0x80), moves three
  consecutive sprite-table entries to (-0x30, 0x58, 0), clears EVENT_F6 and returns 0. Otherwise it calls
  sub_809A80C on r5+0x74 and returns 1. The 0/1 return pattern marks this as a step function of an update
  state machine (the object pointer arriving in r5, not r0, suggests it is tail-called from a dispatcher).'
