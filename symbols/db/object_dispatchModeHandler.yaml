- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r5,#8]; ldr r0,[r0,r1] indexes off_811E42C by the object''s mode byte; table entries:
    object_initSpriteObjA1+1, sub_811E490+1, sub_811E510+1 — three mode handlers; mov lr,pc; bx r0 is
    the standard thumb call, so this is a dispatcher not a jump; r5 is untouched, indicating handlers
    operate on the same caller-held object struct'
