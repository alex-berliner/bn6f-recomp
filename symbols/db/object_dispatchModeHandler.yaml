name: object_dispatchModeHandler
address: '0x0811E418'
kind: function
status: probable
summary: Calls one of three handler routines selected by the mode byte at [r5,#8], passing that mode as
  r1.
interface: (r5 = object whose +8 byte selects handler) -> tail-call to handler(r1 = mode, r5 preserved);
  r0 = whatever the handler returns
details: 'Loads a byte from offset +8 of the struct pointed to by r5 and uses it directly (0..2) as an
  index into the word table at off_811E42C. The table holds three thumb pointers: object_initSpriteObjA1,
  sub_811E490 and sub_811E510. It invokes the selected handler with mov lr,pc / bx r0 (classic thumb call),
  leaving r5 intact so handlers can access the same object. r1 carries the mode value itself, so handlers
  likely switch on it again or use it as a sub-argument. This is a small state/mode dispatcher for an
  object with exactly three modes.'
