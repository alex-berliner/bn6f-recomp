name: battle_endRelatedObject2Anim
address: '0x0810214A'
kind: function
status: probable
summary: Ends the current animation of a battle object's second related object (its 'partner' link target).
interface: (r5 = battle object) -> r0 = result of battle_EndObjectCurrentAnim on the related object; flags
  from callee
details: Loads the pointer at oBattleObject_RelatedObject2Ptr from the battle object in r5 and passes
  it to battle_EndObjectCurrentAnim_80C44D2, which marks that object's animation as finished (0xFF) and
  refreshes its animation state. The trampoline does nothing itself beyond the indirection, so it is a
  one-line wrapper that syncs a linked object's animation end. If RelatedObject2Ptr is NULL, the callee
  is a no-op. With no known callers, the gameplay context for which object pairs use this link is unverified.
