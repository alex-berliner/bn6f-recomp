name: dimUnownedChipStrip_8047CFA
address: '0x08047CFA'
kind: function
status: confirmed
summary: greys out a row's strip tilemap when the player owns none of the chip
interface: 'static void dim_unowned_chip_strip(u32 slot, u32 entry, u32 chip, u32 code, u32 palette, u32 branch_byte,
  bool secret); adapter: in r0 = slot, r1 = chip id, r2 = code, r3 rides along to the counter call, r4 = palette,
  r6 = count the secret collection, r7 = entry; out r0-r7 all as they came (the original pushes and pops them)'
details: 'Secret rows (r6 nonzero) count the collection through sub_803D138(chip + 0x90, code); the others count
  the pack through GetChipCountOfCode(chip, code). A nonzero count returns without touching anything. Otherwise
  the row''s strip tilemap at byte_202F800 + slot * 0x48 is repainted: ten u16 entries at +0 and ten at +0x24 keep
  their low 12 bits, get 0x3000 ORed in on even rows and 0x4000 on odd rows, with palette << 13 added on top (the
  addition can spill into the low 12 tile bits, exactly as the original adds it). The branch_byte parameter is only
  the r3 the original''s kind branch leaves there when the counter is called; the counters ignore it.

  '
