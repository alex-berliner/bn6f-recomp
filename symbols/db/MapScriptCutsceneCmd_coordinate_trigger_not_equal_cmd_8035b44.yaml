name: MapScriptCutsceneCmd_coordinate_trigger_not_equal_cmd_8035b44
address: '0x08035B44'
kind: function
status: confirmed
summary: Map-script command opcode handler that branches when the coordinate-trigger value at the player's position
  (with an in-script Z delta) is not equal to the next script byte.
interface: void MapScriptCutsceneCmd_coordinate_trigger_not_equal_cmd_8035b44(u32 scriptPc /* r7 */, u32 toolkit
  /* r10 */, u32 lr /* return addr */); // returns r7 = next script pc, r0 = 1, sets nz; clobbers r0..r4,r11,r12,c,v
details: "One of the map-script/cutscene command opcode handlers run by the cutscene interpreter.\nBehavior, end-to-end:\n\
  \  1. Reads a signed byte operand (ReadMapScriptSignedByte, r6=2) which is shifted into the\n     upper halfword\
  \ and added to the player's third (Z) coordinate word at oGameState\n     player+0x24. The player's three coordinate\
  \ words at offsets 0x1c (X), 0x20 (Y), 0x24 (Z)\n     are loaded and pushed onto a 12-byte scratch area on the\
  \ stack as a coordinate triple.\n  2. Calls checkCoordinateTrigger_8031a7a passing that stack buffer; its dual-answer\n\
  \     convention returns the trigger value in r0 with r1 as a fallback used only when r0==0\n     (mov r0, r1\
  \ in the false branch of tst r0, r0 / bne).\n  3. Reads the next script byte (ReadMapScriptByte, r6=1) and, if\
  \ it equals the trigger\n     value, advances r7 by 7 (skip this command). Otherwise reads the following word\n\
  \     (ReadMapScriptWord, r6=3) and jumps r7 to that absolute script offset.\n  4. Always returns r0=1 (\"keep\
  \ interpreting the cutscene\") and pops {pc}, so the nz flag\n     in the contract is the side-effect of returning\
  \ a non-zero status byte.\nNo globals are written; only the caller's r7 (next script pc) is updated. Touched\n\
  structures: toolkit at oToolkit_GameStatePtr -> oGameState_OverworldPlayerObjectPtr,\nplayer coord triple at +0x1c/+0x20/+0x24.\n"
