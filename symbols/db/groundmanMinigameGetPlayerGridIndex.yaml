name: groundmanMinigameGetPlayerGridIndex
address: '0x08143EA4'
kind: function
status: probable
summary: Returns the player's current GroundMan minigame grid cell index, by combining OW player coords
  with the grid-offset conversion.
interface: () -> r0 = u8 grid cell index of the player on the GroundMan minigame board
details: 'Tail-style trampoline: pushes callee-saved regs, calls ReadOWPlayerObjectCoords (no args, returns
  coords via r0/r1 and pointer), forwards those into groundmanMinigamePosToGridIndex which adds the map''s
  grid offsets and shifts into 32-px cells, then restores regs and returns via pop {pc}. No additional
  state or side effects beyond the calls it forwards to. Used by the GroundMan cutscene dispatcher as
  the player position passed to groundmanMinigameFindActiveEntry, and by sub_8092EC4 to convert to map-coords
  for angle computation.'
