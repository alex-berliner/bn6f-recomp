name: battle_launchObjectAtPanel
address: '0x0800F768'
kind: function
status: probable
summary: 'Aims a battle object at a target panel and gives it lob-style velocities: horizontal speed 8
  toward the panel plus an inverse-distance Z velocity for the arc.'
interface: (r0 = target panel column, r1 = target panel row; object in r5) -> r0 = written ZVelocity value
  (8 if target is closer than ~8px); sets oBattleObject_DirectionAngle/XVelocity/YVelocity/ZVelocity
details: 'Converts the r0/r1 panel column/row to 16.16 screen coordinates via object_getCoordinatesForPanels,
  then forms the vector from the r5 object''s oBattleObject_X16/Y16 to that point. The vector''s angle
  (calcAngle_800117C) is stored in oBattleObject_DirectionAngle, and math_getPolarVector(angle, 8<<16)
  supplies an XVelocity/YVelocity of magnitude 8 pointing at the target. It then computes dx*dx+dy*dy,
  takes the BIOS Sqrt (svc 8) of it to get the distance, divides by the magnitude 8<<16 to get the flight
  time in frames, and sets ZVelocity = 0x40<<16 / frames — so the accumulated vertical travel over the
  flight is a constant 64px regardless of distance. If the target is at/near the object (quotient 0),
  it instead zeroes X/YVelocity, sets ZVelocity to 8<<16 and returns 8. Quirk: the object pointer is expected
  in r5, not passed as an argument, and r4 is clobbered.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_getCoordinatesForPanels with r0/r1 untouched from entry shows the args are panel
    column/row; sub r2,r0,objX16 / sub r0,r1,objY16 then bl calcAngle_800117C, strb r0,[r5,oBattleObject_DirectionAngle]
    stores the aim angle; mov r1,#8 lsl #16 before bl math_getPolarVector, results stored to oBattleObject_XVelocity/YVelocity:
    fixed speed-8 heading; square-sum, svc 8 (BIOS Sqrt), lsl #8, svc 6 (BIOS Div) by the popped 8<<16,
    then ZVelocity = 0x40<<16 / quotient = 64px/(dist/8 frames); beq loc_800F7C4 (zero quotient) zeroes
    X/YVelocity and writes 8<<16 to ZVelocity, returning 8'
