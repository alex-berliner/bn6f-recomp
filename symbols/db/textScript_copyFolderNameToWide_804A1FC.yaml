name: textScript_copyFolderNameToWide_804A1FC
address: '0x0804A1FC'
kind: function
status: confirmed
summary: Copies the name of the folder with the given index from the text-script folder-name table into a buffer,
  writing one text-script character per 2 bytes until the 0xE6 end marker.
interface: void sub_804A1FC(u32 folderIndex /*r0*/, void *dst /*r1*/); clobbers r0/r1 and flags, preserves r4-r7
details: 'Uses TextScriptFolderNames as a table of 16-bit relative offsets: the entry selected by folderIndex*2
  is added to the table base to get the source string. Characters are then copied one at a time into the destination,
  advancing the destination pointer by 2 per character (wide/2-byte text script characters). Special bytes: 0xE6
  is the terminator and is NOT copied; 0xE4 is a two-byte escape whose following byte is copied with it verbatim
  (both stored at dst and dst+1, source advances by 2); any other byte, including 0xE5, is copied as-is and the
  source advances by 1. The copy is a plain byte copy with no zero padding, so the caller must handle whatever follows
  the last written character. Folder index and destination buffer are not bounds-checked.

  '
