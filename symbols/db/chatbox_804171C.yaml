name: chatbox_804171C
address: '0x0804171C'
kind: function
status: confirmed
summary: Chatbox step that runs one of two script IDs based on an event flag, or skips the command if both are 0xFF.
interface: void chatbox_runConditionalScript_804171C(u16 flagID_highByte);  // r4 = script command ptr, r10 preserved,
  r0 out=1, r2 out=scriptOffset, r3 out=clobbered, nzc/V clobbered
details: 'Chatbox command interpreter step. The 6-byte command at r4 holds:

  - [r4+2..3]: little-endian u16 event flag id

  - [r4+4]:    script id to run if the flag is SET

  - [r4+5]:    script id to run if the flag is CLEAR

  Calls TestEventFlag(u16 flag) which uses Z (clear = set). Based on the Z result it

  picks [r4+4] or [r4+5] as scriptId. If that scriptId == 0xFF, r4 is simply advanced

  by 6 (treats the command as a no-op advance). Otherwise it dispatches via

  chatbox_config_80408D0(int unusedR0, u8 scriptID) -- note r0 passed in is the

  return value TestEventFlag left behind, not a clean zero. Always returns r0=1 to

  the chatbox driver so execution continues to the next command. The two script-id

  fields mirror the 0xFF "no-op" sentinel also seen in the 80408D0 config writer.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
