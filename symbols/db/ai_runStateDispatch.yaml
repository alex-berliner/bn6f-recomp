name: ai_runStateDispatch
address: '0x08112278'
kind: function
status: probable
summary: 'Per-frame AI update: tries to start a chip attack, otherwise dispatches to the AI state handler
  selected by the object''s ScriptId field.'
interface: (r6 = AI battle object ptr) -> r0 = tryStartChipAttack result (1 if chip attack started, else
  handler's return); flags clobbered
details: 'Takes the AI object in r6 (no arguments in r0-r3). First calls battleObject_tryStartChipAttack_8112600;
  if it returns nonzero the chip-attack startup was performed and the function returns immediately. Otherwise
  it reads the object''s oAIState_ScriptId byte, indexes the jump table at off_8112294, and tail-calls
  that handler with lr set via ''mov lr, pc'' (ARM/Thumb interwork dispatch, handlers are Thumb+1). The
  table has three states: battleObject_aiSetupCombatInit_81122A0 (combat init), ai_prepareTargetedAttack,
  and sub_811239A. r4 is preserved but never used inside, suggesting it was live in the original caller
  or a leftover.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battleObject_tryStartChipAttack_8112600; cmp r0,#0; bne locret — chip attack preempts normal
    AI state; ldrb r0,[r6,#oAIState_ScriptId]; ldr r1,[r1,r0]; mov lr,pc; bx r1 — state-indexed tail dispatch;
    off_8112294 table: aiSetupCombatInit, ai_prepareTargetedAttack, sub_811239A — exactly three AI states;
    Called from recorded battle routes (battlesweep, beastsp) with no known direct callers, consistent
