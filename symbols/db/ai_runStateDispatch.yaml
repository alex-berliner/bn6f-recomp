name: ai_runStateDispatch
address: '0x08112278'
kind: function
status: confirmed
summary: Per-tick AI dispatch for a battle object — tries to start a queued chip attack, otherwise jumps to the
  object's AI state handler selected by its script id.
interface: void ai_runStateDispatch(battleobj* r6 /* object */, r4, r5, r7, r10 /* passthrough state */); tail-dispatches
  handler(r0 = script_id) and returns its outputs (r1, r5, r8-r12); r0 nonzero from the chip-attack attempt means
  the tick is done
details: 'Entry point of a battle object''s AI tick. First calls battleObject_tryStartChipAttack_8112600 (preserving
  r4/r6 around it); if it returns nonzero in r0, a queued chip attack was started and the function returns immediately,
  passing that callee''s outputs (r1, r5, r8-r12) through to its own caller. Otherwise it reads the AI script id
  byte at r6+oAIState_ScriptId, indexes the 3-entry jump table at off_8112294 (0 = battleObject_aiSetupCombatInit_81122A0,
  1 = ai_prepareTargetedAttack, 2 = sub_811239A), and tail-calls the selected handler via mov lr,pc / bx r1 with
  the script id in r0 and its own address in r1; all other registers (r4-r12) reach the handler as the chip-attack
  call left them. r4/r6 are saved and restored around the whole dispatch, so they are preserved to the caller. Quirk:
  the handler address is loaded from the jump table at run time, so the call needs an indirect dispatch; script
  ids beyond 2 would read past the table.'
