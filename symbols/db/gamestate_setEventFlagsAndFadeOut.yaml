name: gamestate_setEventFlagsAndFadeOut
address: '0x08005990'
kind: function
status: probable
summary: A GameState handler that sets two story flags, starts a screen fade, ticks the countdown-timer
  table, and advances to overworld subsystem 0x10.
interface: (r0 = GameState* in r5, self) -> r0 = 0x10 stored to oGameState_SubsystemIndex; no return value
details: The function is a state-handler callback taking the GameState pointer (kept in r5, per the comment).
  It first sets two immediate story/event flags (EVENT_1703 and EVENT_1738) via SetEventFlagFromImmediate.
  It then starts a screen fade with SetScreenFade(4, 0x10) — likely fade type 4 with a 0x10-step duration.
  It ticks the table of 32 countdown timers (timer_tickCountdownTable_8035738), suggesting this state
  runs across multiple frames while a timed sequence plays. Finally it writes 0x10 into GameState+oGameState_SubsystemIndex,
  which the comment says dispatches to overworld_owMap_renderAndTickSubsystems_800536E via cbGameState_80050EC,
  i.e. it hands control to the next subsystem in the state chain.
