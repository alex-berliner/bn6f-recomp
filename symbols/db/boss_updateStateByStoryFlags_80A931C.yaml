name: boss_updateStateByStoryFlags_80A931C
address: '0x080A931C'
kind: function
status: confirmed
summary: Per-frame update for a boss actor that branches on story flags EVENT_BE6/EVENT_BE4 to pick a
  hit reaction, an alternate state, or idle behaviour, then updates the sprite.
interface: void sub_80A931C(u32 obj /*r5*/, u32 context /*r10*/); clobbers r0-r3, r8-r12, nzcv; preserves
  r4-r7; outputs r2-r5, r8-r12 are callee leftovers
details: 'Boss/actor per-frame step. r5 is the object; obj+8 is a state byte. Three mutually exclusive
  cases: (1) EVENT_BE6 set — raise the sprite''s draw priority to 3 via sprite_setPriority_8002E14, store
  state 8, play SOUND_HIT_6B and run the hit sub-step sub_80A9360; (2) else EVENT_BE4 set — store state
  0xC and run sub_80A93D0; (3) else run the two idle sub-steps sub_80A93D8 and sub_80A93E8. sprite_update
  runs on every path afterwards. The BE6/BE4 flags look like story/battle-progress flags (BE bank), so
  the boss switches behaviour as the fight/story advances; the sound and priority bump suggest the BE6
  case is the boss being struck or taking damage.'
