open_questions:
- exact meaning of state id 0x14 (presumably the next battle sub-state after the custom screen opens)
- what unk_2035260 fields setupNaviDisplay consumes beyond the documented copy
- why the init flag is set to 4 rather than 1 (flag encodes which one-time setup ran)
