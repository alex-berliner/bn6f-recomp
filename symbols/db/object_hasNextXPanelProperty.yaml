name: object_hasNextXPanelProperty
address: '0x08110D34'
kind: function
status: confirmed
summary: Returns 1 if the panel one X-velocity-step ahead of the battle object carries any property masked by 0x3800000
  (e.g. a wall, hazard, or special panel flag), 0 otherwise.
interface: r5 = battle object pointer -> r0 = 0 or 1; clobbers r0-r3, lr, NZCV; preserves r4-r7
details: 'Reads oBattleObject_X and oBattleObject_XVelocity, adds them to get the projected next-X

  world coordinate, pairs it with oBattleObject_Y, and converts to panel (col, row) via

  convertXYToPanelXY_800E258.  Calls object_getPanelParameters to fetch that panel''s 32-bit

  property word, then ANDs it with the literal-pool mask at byte_8110DB0 (verified value

  0x3800000, i.e. bits 20-22).  A non-zero result becomes 1 in r0; zero becomes 0.

  The mask is loaded via an ldr from a data label the disassembler tagged "byte_" but the

  instruction is a word load; the verified C uses 0x3800000u.

  '
