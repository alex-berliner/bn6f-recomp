name: object_updateTimedSelfDestroy
address: '0x080BF9FE'
kind: function
status: probable
summary: battle-object update that counts down a 30-frame timer, then queues the object for destruction
interface: (r5 = battle object) -> none; sets oBattleObject_Timer=30 and PhaseInitialized=4 on first run,
  decrements Timer each call, writes CUR_STATE_DESTROY to CurStateAction when it reaches 0
details: Standard object state-update stub using r5 as the object pointer. On the first invocation (PhaseInitialized
  == 0) it seeds oBattleObject_Timer with 0x1E frames and stores 4 into oBattleObject_PhaseInitialized
  to mark init done. Every call decrements oBattleObject_Timer and branches out while it is still > 0;
  when the counter expires it stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  handing the object to the destroy phase. No other fields are touched and it calls nothing.
