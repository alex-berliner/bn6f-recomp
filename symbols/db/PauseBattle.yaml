name: PauseBattle
address: '0x0800A028'
kind: function
status: confirmed
summary: Sets the "battle paused" flag on the current game state, pausing the ongoing battle.
interface: PauseBattle(r10 toolkit) -> r0 = 1, r1 = game state ptr; NZ set from r0
details: 'Loads the game state pointer from the toolkit (r10 + oToolkit_GameStatePtr), writes 1 as a byte to oGameState_BattlePaused,
  and returns 1 in r0 with NZ flags set accordingly. r1 is left holding the game state pointer. No other registers
  or memory are touched; resuming must be handled elsewhere by clearing the same flag.

  '
