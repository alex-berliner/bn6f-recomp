name: battle_aiAttackDispatchByHitElement_80EF534
address: '0x080EF534'
kind: function
status: confirmed
summary: AI attack step dispatcher that tail-calls either the SnakeArm attack-part stepper or the generic attack
  tick-down, chosen by the element the attack hit with.
interface: void sub_80EF534(r5 attackCtx?, r6 attackCtx?, r7 aiAttackVars, r10 workArea); tail-calls handler(element
  in r0, handler addr in r1) and returns the handler's result/registers to this function's caller
details: 'Reads the oAIAttackVars_HitElement byte from the AI attack vars pointed to by r7 and uses it as an index
  into the two-entry handler table off_80EF548. Element 0 dispatches to battleObject_runSnakeArmAttackPart_80EF550
  (the attack continues with the SnakeArm attack-part logic), any other value dispatches to battle_aiAttackTickDown_80EF608
  (the attack''s timer simply ticks down). The call is done via mov lr,pc / bx r1, which makes the handler''s return
  go straight back to this function''s caller (an indirect tail call, ARM/Thumb interworking via the +1 address).
  r0 is passed to the handler as the element value and r1 as the handler''s own address. r5, r6 and r10 are only
  passed through untouched for the handler to use. All listed outputs are just whatever the selected handler leaves
  in r1, r4-r12.

  '
