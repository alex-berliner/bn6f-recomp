name: sub_802D6C4
address: '0x0802D6C4'
kind: function
status: hypothesis
summary: Ticks a two-slot state machine stored at dword_203C970, advancing or polling its two child objects and
  returning the state byte at offset +4.
interface: void tick_stateMachine_802D6C4(void) /* returns u8 state in r0; NZ flags reflect that byte */
details: "Uses the global struct pointed to by dword_203C970 as a base:\n  +0x3 : gate byte. If 0, the function\
  \ runs a \"kick-off\" pass over both child slots; any\n         other value means it polls them.\n  +0x4 : status\
  \ byte returned in r0 (the \"state\").\n  +0x8  : pointer to child object A (passed to sub_802DD1E / sub_802DD10\
  \ or sub_802DD4A).\n  +0xC  : pointer to child object B (same treatment).\n\nKick-off branch (gate == 0): for\
  \ each of the two child pointers, calls sub_802DD1E; if that\nreturns nonzero, calls sub_802DD10 on the same pointer.\
  \ Then writes 4 to the gate byte,\nmeaning the next call enters the polling branch.\n\nPoll branch (gate != 0):\
  \ calls sub_802DD4A on each child pointer. If either returns nonzero\nthe function returns early with the current\
  \ +4 status byte. Only when BOTH return zero does\nit clear the +4 status byte to 0 before falling through to\
  \ return it.\n\nThe function ends with `ldrb r0, [r5,#0x4]; pop {r5,pc}` so the returned status byte is the\n\
  sole output and the NZ flags reflect that load. r5/r7 are preserved by the contract but only\nr5 is actually saved\
  \ here (r7 was never clobbered).\n"
