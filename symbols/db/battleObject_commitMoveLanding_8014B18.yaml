summary: 'Land a battle object on its queued panel: commit FuturePanelXY, recompute coords/collision,
  clear invulnerability and Press-A charge, restart the AI attack script, and reset the post-dash sprite/animation.'
interface: '(r5 = battle object, r7 = AIAttackVars) -> r0 = 4 ; side effects: panel coords/pixel coords/collision/facing
  updated; AI flag 0x80000 cleared; PwrAtkState cleared; AIAttackVars[0] := 6 then 4; RelatedObject2 may
  be flagged 0x14/1 if non-null'
details: 'Sets the AI flag word bit 0x80000 first (SetAIDataUnk0x48Flag), then commits the battle object''s

  FuturePanelX/FuturePanelY (offsets 0x14/0x15) into PanelX/PanelY (0x12/0x13). Calls

  object_removePanelReserve to release the panel the object was standing on, then

  object_setCoordinatesFromPanels, object_updateCollisionPanels, object_clearInvulnerableTime.

  After sub_800F46C the returned byte is written into DirectionFlip (offset 0x17).

  battleObject_refreshSpriteAndArm_800F2C6 updates sprite+arm; battleObject_clearPwrAtkState_8012EA8

  drops any in-progress PwrAtk charge.

  The AIData pointer''s 0x5c child is passed to sub_80C4C3A, then sub_80158FA is invoked.

  Sets AIAttackVars[+0x10] = 6 then [+0x00] = 4 (returned in r0).

  Then: only if GetBattleNaviStatsByte_AllianceFromBattleObject with byte index 0x2c == 9

  AND CurAnim == 0x16, it resets CurAnim to 0, clears RelatedObject1Ptr and AIData[+0x68],

  Clears the 0x80000 AI flag, and if RelatedObject2Ptr is non-null writes 1 to its Param3

  (offset 0x6) and ORs 0x14 into its oObjectHeader_Flags (offset 0x0).

  Returns 4 (matches captured exit r0=4).

  '
