name: e_decrementCountdown
address: '0x08143F7C'
kind: function
status: probable
summary: Ticks down a countdown counter in eStruct2001010 while a fade is active in a specific subsystem,
  unless a flag byte blocks it.
interface: () -> r0 = undefined; no flags relied on; reads caller's r5 as a structure pointer
details: Takes no arguments; it tests byte [r5+9] of the caller's r5 (a structure the callee never sets
  up), and returns immediately if it is nonzero. Otherwise it loads dword at eStruct2001010+0xC (0x200101C),
  decrements it, and stores it back — but only if the decremented value is >= 0 (the blt skips the store),
  so the counter floors at 0. The call site only runs it while IsScreenFadeActive returns true and GameState->SubsystemIndex
  == 4, suggesting the counter gates something during a fade in that subsystem.
