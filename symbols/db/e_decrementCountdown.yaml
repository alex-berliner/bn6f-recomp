- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8143F7C: tst [r5,#9] early-out, then ldr/str of [eStruct2001010,#0xC] with sub #1 and blt
    guarding the store (floor at 0); caller 0x081440A2: only calls it after IsScreenFadeActive is true
    (beq skips the call); caller 0x0814409A: ldrb GameState_SubsystemIndex; cmp #4; bne skips the call;
    the function''s only known data touch is eStruct2001010, offset 0xC (dword_200101C), and its result
