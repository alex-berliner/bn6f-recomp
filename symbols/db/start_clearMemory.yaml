name: start_clearMemory
address: '0x080001C4'
kind: function
status: confirmed
summary: Zero-fills a word-aligned memory region by walking backwards in 4-byte steps (the "start" helper used during
  boot/early init).
interface: void start_clearMemory(u32 dst, u32 byte_count /* r0, r1 */); /* clobbers r1, r2, NZCV; Z set on return
  */
details: 'Sits at the very start of ROM (0x080001C4), so it is one of the earliest

  runtime helpers and is reused for any later word-aligned zero fill. The

  loop decrements r1 by 4 each iteration and stores 0 at [r0 + r1], i.e. it

  walks the buffer from end to start. The "straw" pointer that decrements

  first is what makes the backward walk happen with a single register.

  Quirks: byte_count must be a multiple of 4 (no tail handling, no alignment

  fixup); zero-sized input leaves the loop condition C-set/Z-clear on the

  subs, but the bx is taken immediately so callers must not rely on the

  final flags beyond Z being set on the normal-return path. r1 is consumed

  as the running index, and r2 is hard-coded to 0 as the store value.

  '
