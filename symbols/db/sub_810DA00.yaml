name: sub_810DA00
address: '0x0810DA00'
kind: function
status: hypothesis
summary: AI step that probes the panel directly in front of the battle object and transitions AI state based on
  the result.
interface: 'void aiProbeForward_810DA00(void); /* in: r5=battle object, r6=AI state struct; clobbers r0,r1,r2,r3,lr,NZCV;
  preserves r4,r7 */'
details: 'Reads the object''s facing direction from object_getFrontDirection, combines it with oBattleObject_PanelX/Y
  and the ExtraVars+4 word to call sub_8109708 (a forward-panel probe/lookup). If the probe returns nonzero, sets
  oAIState_Unk_00 to 0x0C (state transition). If the probe fails, writes 0 to oAIState_Unk_02 and 8 to oAIState_Unk_00.
  Likely part of an NPC/battle AI decision loop where the AI checks whether the panel ahead is passable/occupied
  before choosing its next action.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
