name: reqBBS_81405E8
address: '0x081405E8'
kind: function
status: confirmed
summary: Draws the bulletin-board (BBS) background by copying a fixed 8x2 block of tiles from a table into tile
  block 32x32
interface: void drawBbsBackground_81405E8(r10 context, lr return_address); reads r4/r5 to preserve them; returns
  r5 unchanged (callers read r5 back but it is untouched)
details: 'Wrapper around CopyBackgroundTiles with fully constant arguments: j=0xA (destination tile

  column 10), i=0 (destination row), tileBlock32x32=2, tileIds=*byte_813F32C (a fixed tile

  id table), j_size=8, i_size=2. So it pastes an 8-wide, 2-tall background tile chunk into

  the third 32x32 tile block of the background map — evidently the backdrop of the BBS

  (bulletin board) screen. The function itself is just six moves plus the call; all logic

  lives in CopyBackgroundTiles. It pushes r4-r7,lr solely because CopyBackgroundTiles

  clobbers r4/r5 (its internal 8x2 loops leave r4=18), so the save/restore is pure register

  preservation, not real state. The register contract lists r10 as an input, but this body

  never touches r10 — likely a caller-side convention artifact (r10 carries some context in

  the surrounding BBS scene code) rather than a real parameter. r5 is listed as an output

  only because it passes through unchanged for the callers to keep reading.

  '
