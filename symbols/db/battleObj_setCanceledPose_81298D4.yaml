name: battleObj_setCanceledPose_81298D4
address: '0x081298D4'
kind: function
status: confirmed
summary: 'Battle object step: if the busy''s "mode 3" allows it, force the object into the canceled/event-end pose
  (state=3, pose=2) with a freshly resolved sprite frame and cleared frame counter.'
interface: void sub_81298D4(void /*r5*/); /* preserves r4,r5,r6; clobbers nz,c,v,r0-r3,lr */
details: "Caller hands the object pointer in r5 (a struct already laid out as a sprite/state\nobject used by the\
  \ battle engine; e.g. +0x12 sub-state id, +0x1D state byte,\n+0x20 pose/anim index, +0x02 current frame, +0x03\
  \ frame counter).\n\n1. Calls sub_812B318 with r0=3 — this is the engine's \"is the busy/queued update\n   path\
  \ for mode 3 currently permitted?\" gate. If it returns non-zero the function\n   bails immediately and leaves\
  \ the object untouched.\n2. On permission, writes the fixed pose pair: state byte +0x1D = 3 and pose byte\n  \
  \ +0x20 = 2. This is the canonical \"battle canceled / result pose\" stamp for\n   objects of this type (same\
  \ magic pair as other battleObj step routines).\n3. Reads the sub-state at +0x12 and asks sub_81325F4 (a sprite-lookup\
  \ helper\n   that maps (state,substate) -> sprite tile/frame index) to produce the correct\n   frame, stored back\
  \ at +0x02.\n4. Resets the frame counter at +0x03 to 0 so the pose animates from the start.\n\nNo collision/hit\
  \ data is touched — purely a pose/state setter gated by the busy\ncheck. The `tst r0,r0 ; bne locret` is the only\
  \ conditional; it never falls\nthrough to a slow path.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
