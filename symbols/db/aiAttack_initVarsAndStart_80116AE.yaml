open_questions:
- 'Exact meaning of the values written: r0 to AttackVars.Unk_0c, r1 to Unk_18, r2 to Unk_03 — none of
  these fields are documented, so the action enum being passed through r0 is unknown. Settling it would
  need either a documented AIAttackVars spec or tracing what the state machine does with each combo.'
- Why the dead tail writes AttackVar[4]=0x3f and calls sub_80EB234 — could be a leftover from a refactor;
  not reachable from any observed caller in the captures.
