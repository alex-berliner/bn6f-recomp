name: sub_804A24C
address: '0x0804A24C'
kind: function
status: hypothesis
summary: Returns a pointer into unk_2001850 at an offset taken from the dword_804A25C lookup table indexed by r0.
interface: u32 getDword_804A25CEntry(u32 index /* r0 */) -> /* r0 */ pointer into unk_2001850; preserves r4-r7;
  clobbers nzcv/r1
details: 'Thin lookup helper. Reads a single byte from the table at dword_804A25C

  using r0 as the byte index (ldrb r1, [r1,r0]); the table base (0x0804a25c)

  sits right after the function''s pool entry and currently holds only the

  32-bit constant 0x402000, suggesting it is a placeholder or a header

  preceding larger data. The byte is then added to the fixed base

  unk_2001850 (a pointer-sized anchor in IWRAM/main RAM at 0x02001850)

  and the resulting address is returned in r0.

  The function does not itself touch byte_804A264/byte_804A29C/byte_804A2A4/

  dword_804A2AC/byte_804A2B0; those just happen to be adjacent ROM data and

  are not used here.

  Callers are expected to interpret the returned address as a pointer to a

  structure/array element within the unk_2001850 region, gated by an index

  in r0 (likely a small enum since the index is used as a raw byte offset

  into a ROM table). Preserved registers r4-r7 indicate it is intended to

  be called from C-style code that keeps locals across the call.

  '
