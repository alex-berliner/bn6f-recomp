name: checkLayerPriority_80318b0
address: '0x080318B0'
kind: function
previous_names: []
status: confirmed
summary: Find the layer-region record covering an object's cell and height, and run its kind's handler.
interface: (r0 = object) -> records the object at dword_200F3D0; cell = sub_80316F8, first entry = sub_8030B1E;
  for each entry of that cell whose record {s8 top; u8; u8 height; u8 kind} spans the object's Y (+0xA), stores
  the record at [dword_2013940+0x14] and calls the kind's handler; r0 = 2 if none matched, else the handler's r0;
  r4-r9, r12 preserved
details: The original calls through a table of handlers indexed by kind; the readable version names the nine non-NULL
  ones (kinds 1-4, 9-12, 17) in a switch. A NULL kind would crash the original and does nothing here (never seen).
