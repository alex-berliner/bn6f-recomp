    r2,[r5,#oBattleObject_Element] passed to sub_80C8514 -> element attack of strength 4; alliance branch:
    tst oBattleObject_Alliance picks r0=0/r4=0x104 vs r0=7/r4=0x4; r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler
    forwarded unchanged to the damage helper'
