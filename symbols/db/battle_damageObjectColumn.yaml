name: battle_damageObjectColumn
address: '0x080B903A'
kind: function
status: probable
summary: Hits every valid panel in the battle object's own column (rows y-1..y+1) with a fixed 4-damage
  element attack, alliance-dependent.
interface: (r5 = battle object) -> r0 = clobbered; no meaningful return
details: 'Treats r5 as a battle object and loops r7 = 0..2, forming coordinates (oBattleObject_PanelX,
  oBattleObject_PanelY - 1 + r7), i.e. the three rows of the object''s own column. Each coordinate is
  validated with object_isValidPanel; valid panels are passed to sub_80C8514 as r0=x, r1=y. The call also
  passes r2 = oBattleObject_Element, r3 = 4, r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler,
  and r4 = alliance-dependent constant: alliance 0 gives r0=0 / r4=0x104, any other alliance gives r0=7
  / r4=0x4 (0x100 bit set only for alliance 0). The 3 seems to be the damage/flag payload, with 0x100
  likely a flag distinguishing the two alliances'' attack (e.g. heal-vs-damage or target-side selection).
  The effect resembles a column-sweeping attack (hits its whole lane), such as an enemy''s signature move.'
