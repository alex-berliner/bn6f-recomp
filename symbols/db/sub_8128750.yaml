name: sub_8128750
address: '0x08128750'
kind: function
status: confirmed
summary: 'Initialise a screen/scene: clear VRAM/OAM, set up render info and state block, run sub-init helpers, and
  start a screen fade from black.'
interface: void sub_8128750(void) // uses r5 (state struct ptr), r10 (toolkit ptr)
details: "Entry-point style \"init\" function for a non-battle screen (called from the\ngame's main state machine;\
  \ identified in the readable-C comment as a\ntitle/screen init). Steps performed in order:\n  1. Clears all GBA\
  \ video buffers: zeroFillVRAM (tile/map VRAM), the\n     small byte buffer at 0x03001960, and the GFX buffer at\
  \ 0x030025C0\n     (sprite/OAM equivalent).\n  2. Calls sub_80015FC with r0 = 0x10 (likely a \"scene/stage\" selector\n\
  \     in a generic setup helper).\n  3. Reads render-info pointer via oToolkit_RenderInfoPtr off the\n     toolkit\
  \ struct pointed to by r10. Writes 0x1F40 to the tile-base\n     field and zeros the six 16-bit slot/offset fields\
  \ at offsets\n     +0x10..+0x1A.\n  4. Initialises the r5-pointed state struct: byte +0x01 = 4 (state\n     phase),\
  \ byte +0x02 = 0 (timer), bytes +0x0F and +0x10 cleared,\n     halfwords +0x22 and +0x26 and byte +0x0E seeded\
  \ with 0xFF\n     (typical \"no object / unused\" sentinel for slot indices).\n  5. Calls four sub-initialisers\
  \ in turn: sub_81288FC, sub_81289C4,\n     sub_8128A44, sub_8128AB0, sub_8128B34 (sub_81288FC interleaved\n  \
  \   with the r5 writes).\n  6. Kicks off SetScreenFade(8, 0x10) - 8-step fade from black using\n     palette bank\
  \ 0x10.\nClobbers nz/c/v plus r0,r1,r2,r3,r7,lr; preserves r4,r5,r6,r8,r9.\nSaves only lr; tail-pops pc, so it\
  \ is a leaf-style init that returns\ndirectly to its caller (the main loop / state machine).\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
