name: ai_getSpoutManAttackParams
address: '0x080F778C'
kind: function
status: probable
summary: Returns a pair of SpoutMan attack parameters looked up from a small table via sub_800FE28, used
  by ai_initSpoutManAttack.
interface: () -> r0 = first param, r1 = second param (both read from byte_80F77A8 through sub_800FE28)
details: 'Calls sub_800FE28 twice, first with byte_80F77A8 and then with byte_80F77A8+4; the first result
  is saved on the stack and returned in r0, the second in r1. The table is 8 bytes: 02 03 05 05 | 18 12
  0C 0C. The second group (24, 18, 12, 12) looks like damage values and the first group (2, 3, 5, 5) like
  counts/ranges, so sub_800FE28 most likely picks one entry per call based on some game state (e.g. version
  or attack level). Only ever called from ai_initSpoutManAttack on the recorded routes.'
