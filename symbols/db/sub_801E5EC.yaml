name: sub_801E5EC
address: '0x0801E5EC'
kind: function
status: hypothesis
summary: One-argument thunk that calls sub_801BEB8 with r0 = 0x4000 (1 << 14), passing the callee's results straight
  back to the caller.
interface: 'void sub_801E5EC(void); /* in: lr only; out: r0-r2, N/Z/C and lr as produced by sub_801BEB8 */'
details: 'Trivial wrapper: pushes lr, loads r0 with 1 << 14 = 0x4000 via "mov r0,#1; lsl r0,r0,#14", tail-calls
  sub_801BEB8, and returns with pop {pc}. It contributes no logic of its own; r0-r2 and the N/Z/C flags the caller
  sees are exactly whatever sub_801BEB8 leaves. The lift must reproduce C=0 (and N=0, Z=0) from the lsl before the
  call since the callee passes C through unchanged. Without callers of this wrapper or knowledge of what sub_801BEB8
  does with its argument, the game meaning of the constant 0x4000 is unknown; in MMBN code such a single hard-coded
  argument often selects a mode, text/sound id, or flag bank in the callee.

  '
