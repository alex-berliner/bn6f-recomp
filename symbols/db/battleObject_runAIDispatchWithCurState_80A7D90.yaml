  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#4] ; bl sub_81428C2 ; mov r7, r0` (entry of AIData byte dispatched through
    helper at 0x081428c2) - `ldrb r1, [r5,#8]` is the index into the 3-entry table at off_80A7DAC - `mov
    lr, pc ; bx r0` is the standard ARM7TDMI Thumb-interworking tail-call (table entries are `+1`) - Table
    at off_80A7DAC lists `sub_80A7DB8+1`, `sub_80A7E14+1`, `sub_80A7E0C+1` (3 dispatched handlers) - `push
    {r4-r7,lr} ... pop {r4-r7,pc}` frame shape indicates a void trampoline that returns whatever the tail-call
    left in r0 - Captured exit flags `-Z--` and r0 values (e.g. 0x2118, 0x2058, 0x1f98) are returned solely
    from the dispatched handler; this fn itself does not set NZ.'
