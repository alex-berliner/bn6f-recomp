open_questions:
- The actual semantics of the 3 child handlers (DB8/E14/E0C) and what AIData+8's enum is - probably an
  AI sub-phase or animation class, but the only field near 0x8 in AIData is `BeastOutAPwrAtk`/the BPwrAtk
  cluster, so the precise role of that index is unconfirmed.
- What `sub_81428C2` actually does with the byte at AIData+4 - some kind of state/id resolver, possibly
  returning a function pointer that is then ignored (r7 only) while the call returns a value in r0 too?
