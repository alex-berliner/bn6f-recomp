  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly right but has errors: the slot zeroed is at r7+0x6 (0x2022B76), matching the
    proposal, but the early loop already fetched r4 via battleObject_getByIndex at loc_8136712 using the
    initial entry''s index (before any loop iteration), so r4 is set once, not ''fetches an object index...
    and reads byte +3'' iteratively. The loop at loc_813671A checks whether any OTHER entry (entries 0..N)
    shares byte +3 == r4 and bails to loc_8136768 (no removal). Otherwise it scans the 6-byte list and
    removes the first matching tag. So the behavior matches the proposal but with a cleaner name.; run
    wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
