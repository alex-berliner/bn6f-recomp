    to r4 (early exit if equal); loc_8136740: scans 6 bytes at off_8136798 = unk_2022B70 for r4; loc_8136752:
    memmove-style byte shift left (ldrb [r0,r3] / strb [r1,r3]) then strb #0 at 0x2022B76'
