name: battle_removeObjectTagFromList
address: '0x081366FC'
kind: function
status: probable
summary: Removes a battle object's tag byte (descriptor byte +3) from the 6-slot list at unk_2022B70 by
  shifting later entries left, unless another object in the first N entries of the 2004190 array shares
  the same tag.
interface: (r5 = battle object/holder with halfwords at +0x28 and +0x2c) -> r0 = destroyed; touches unk_2022B70[0..6]
details: It first calls battle_checkItemFlagFor_813B9B4 with [r5+0x28] and [r5+0x2c]; the returned flag
  minus 1 is kept on the stack as a loop count. It then fetches an object index from the r5-related toolkit
  entry (toolkit_getUnk2004190EntryPtr) and reads byte +3 of that battle-object descriptor as a tag value
  r4. It scans the first N entries of the 2004190 array (8 bytes each, halfword at +0 = object index);
  if any of those objects' byte +3 equals r4, it returns without changing anything. Otherwise it searches
  the 6-byte array unk_2022B70 for a byte equal to r4 and, if found, shifts all later bytes left by one
  and zeroes the last slot (0x2022B76), removing that entry. The exact gameplay meaning of the tag byte
  and of the 6-entry list is not established here.
