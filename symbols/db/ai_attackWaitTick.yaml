name: ai_attackWaitTick
address: '0x080FA6B0'
kind: function
status: probable
summary: 'Per-frame AI attack step: on first run initializes the attack (element 4, anim 0, timer = duration),
  then counts the timer down and exits the attack state when it expires.'
interface: (r0 = unused/scratch, r5 = battle object, r7 = AI attack vars) -> r0 = clobbered by object_exitAttackState
  path; no meaningful return
details: Reads oAIAttackVars_AttackElement; if it is 0 (attack not yet started), it writes element 4,
  sets the object's oBattleObject_CurAnim to 0, and copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer
  to start the countdown. On subsequent frames it decrements StepTimer each call; once the timer reaches
  0 it calls object_exitAttackState to return the AI object to its normal state. Element 4 likely corresponds
  to a normal/none buster-type attack whose behavior is just playing anim 0 for AttackDuration frames.
  Uses r7 as the AI attack-vars base and r5 as the owning battle object, consistent with other AI attack
  step handlers.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne: 0 means the attack has not been initialized
    yet; strb #4 into AttackElement and mov #0 into oBattleObject_CurAnim on first run sets up the attack
    pose; ldrh AttackDuration / strh StepTimer initializes a frame countdown from the attack''s duration;
    sub r0,#1 / strh / bgt: decrements the timer each later call until it hits 0; bl object_exitAttackState
    when the timer expires ends the attack state'
