name: submenu_subchip_81240BC
address: '0x081240BC'
kind: function
status: confirmed
summary: Per-frame tick of the sub-chip sub-menu; advances its update routine and, once the screen fade completes,
  marks the sub-menu state as ready.
interface: void subchipSubmenu_tick_81240BC(struct UnkSubMenu* state /* r5 */);
details: 'Takes the UnkSubMenu state in r5. Calls sub_81244EC (the routine that performs the per-frame work for
  this sub-menu). Then calls IsScreenFadeActive; if the fade is still active (Z set), it returns IsScreenFadeActive''s
  r0 with flags NZ seeded so N=1, Z=0. When the fade is done, it writes the literal byte 4 to state->byte2 (offset
  0x2 of UnkSubMenu, used as the "ready/phase 4" flag), and returns r0=4 with NZ seeded to 4 (N=0, Z=0). Function
  exits via `pop {pc}` (tail return). Preserved: r4, r5, r6, r7. Two zero padding bytes follow the function for
  alignment.

  '
