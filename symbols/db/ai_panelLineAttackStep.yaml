  date: '2026-10-19'
  detail: 'start branch: ldrb AttackElement; tst; sets element 4, anim 0x12 on r5, timer 0x3C, then PlaySoundEffect(0xBA);
    calls ai_attackSpawnPanelLine immediately after starting, matching a multi-panel line attack; otherwise
    decrements oAIAttackVars_StepTimer and returns until it hits zero (bgt locret); at expiry writes 0x28
    to oAIAttackVars_HitElement, or 0x30 if oAIAttackVars_AttackStepIndex == 2; register usage (r7 AI
    vars, r5 object) matches the other named ai_ attack step routines'
