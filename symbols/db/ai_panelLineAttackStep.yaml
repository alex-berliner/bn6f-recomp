name: ai_panelLineAttackStep
address: '0x080F5FF4'
kind: function
status: probable
summary: AI attack step handler that triggers a line-of-panels attack (sound, animation, spawn), then
  on timer expiry queues the hit element per step.
interface: (r7 = AI attack vars struct, r5 = battle object) -> void; flags set by timer decrement compare
details: 'If oAIAttackVars_AttackElement is 0, this is the attack''s initiation: it sets AttackElement
  to 4, switches the object to animation 0x12, loads StepTimer with 60 frames, plays sound effect 0xBA,
  and calls ai_attackSpawnPanelLine to place attack effects on up to five panels ahead. On subsequent
  calls it decrements StepTimer until it reaches zero. At expiry it writes the hit element into oAIAttackVars_HitElement:
  0x28 normally, 0x30 when AttackStepIndex equals 2, so the third step of the attack deals a different
  element/type. The r7/r5 base registers match other ai_* attack-step handlers, implying a shared AI attack-state
  context.'
