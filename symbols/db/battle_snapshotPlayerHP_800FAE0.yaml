name: battle_snapshotPlayerHP_800FAE0
address: '0x0800FAE0'
kind: function
status: confirmed
summary: Stores the player's current HP into the battle state (oBattleState_Unk_34), keeping a snapshot of the player's
  HP for later comparison.
interface: 'void battle_snapshotPlayerHP(void); // in: r10 = toolkit; out: r2 as left by battle_findPlayer, flags
  clobbered; r4-r6 preserved'
details: Reads the toolkit's battle state pointer (oToolkit_BattleStatePtr via r10), takes the alliance byte at
  oBattleState_Unk_0d, and calls battle_findPlayer to locate the player's BattleObject. If a player object is found,
  it copies the 16-bit oBattleObject_HP into the battle state's oBattleState_Unk_34 field; otherwise it does nothing.
  Likely used to record the HP at a point in the turn (e.g. turn start) so damage/HP-change tracking can compare
  against it later.
