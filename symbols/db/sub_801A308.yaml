name: sub_801A308
address: '0x0801A308'
kind: function
status: confirmed
summary: Flips a battle object's alliance to the opposite side, then adds its collision-data halfword at +0x92 into
  that side's AI data byte oAIData_Unk_10.
interface: void battle_toggleAllianceAndAccumulateCollisionToAiData(BattleObject* object /* r5 */); also saves/restores
  r4; no meaningful return value
details: 'Takes a battle object pointer in r5. It XORs the byte at oBattleObject_Alliance with 1 (player <-> enemy
  side swap) and calls sub_8010022 with the new alliance value to obtain the AI data block pointer for that side.
  It then loads the object''s collision data pointer (oBattleObject_CollisionDataPtr), reads the halfword at CollisionData+0x92,
  and adds that value (as a byte) into oAIData_Unk_10 of the retrieved AI data, storing the sum back. Only r4 is
  explicitly saved/restored (push {r4,lr}); r5 and r6 are untouched, and r0-r3, flags are clobbered by the call.
  The addition can overflow the byte, which is presumably intended or handled by later logic. The caller contract
  reports r4/r6/r10 as inputs, but the body only uses r5, so those may simply be live registers at the call site.

  '
