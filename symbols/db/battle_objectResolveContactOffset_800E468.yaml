name: battle_objectResolveContactOffset_800E468
address: '0x0800E468'
kind: function
status: confirmed
summary: Resolves a battle object's contact offset, zeroing it when the target panel isn't on the object's alliance.
interface: "void sub_800E468(void * /* r5 */ battleObj)\n    -> r0,r1,r2 (contact offset x,y,extra);\n       c,v\
  \ clobbered by alliance check; r3 untouched here;\n       r4 preserved\n"
details: 'Reads a contact-type byte at oBattleObject_Unk_0f on the battle object pointed to by r5,

  then calls battle_dispatchObjectContactHandler_800E498 with that type in r0 to obtain a

  12-byte ContactOffset (x,y,extra) returned in r0/r1/r2 and spilled to the stack.

  Adds the object''s panel X/Y (oBattleObject_PanelX, oBattleObject_PanelY) to that offset,

  then calls battle_objectCheckPanelByAlliance_800E5AC to test whether that target panel

  is aligned with the object''s alliance. If the check fails (Z=1) it returns (0,0,0);

  otherwise it returns the original raw offset. Likely used so that attacks/spread patterns

  don''t apply if the contact target would land on an off-alliance panel.

  '
