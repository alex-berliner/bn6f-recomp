name: sub_80AA394
address: '0x080AA394'
kind: function
status: confirmed
summary: Initialises a CopyBot-related work area, picking its slot from the CopyBot event flag and seeding values
  for two helpers.
interface: void sub_80AA394(u32 work /* r5 */, void* passthrough_r2, void* passthrough_r10, void* passthrough_r11);
  clobbers r0 r1 r3 r4 r6 r7 lr, flags NZCV
details: 'Writes a 3 to work[0]. Tests event flag EVENT_COPYBOT_ACTIVE via

  TestEventFlagFromImmediate (r0 = 0x17, r1 = 0x29); when the flag is unset (zf=0)

  the slot byte at work[5] becomes 2, otherwise it stays 0.

  Calls sub_80AA3C2 with r0 = 0, then seeds work[0x24] = 0x5A, work[0x28] = 1,

  work[8] = 4, and calls sub_80AA402 with r0 = 4.

  The push/pop {r4-r7,lr} exists only because the two callees clobber r4-r7.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
