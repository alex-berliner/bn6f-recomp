open_questions:
- The exact meaning of byte 1 of `[[dword_2013920]+0x14]`. It is treated as a per-call boolean, but whether
  it represents "is target on enemy line side", "AI is allowed to attack this line", or a movement-style
  flag (0x40/0x00 look more like a stat than a bool, but two distinct values were observed) is unknown.
- Whether the "0x40" return is a direct copy of that byte or ANDed/ORed with the line-test result. The
  captured calls show only the 0x40 (true) and 0x00 (false) cases, so the operation could be AND, OR,
  or "return second if first non-zero".
- What the caller's r5 (passed in and preserved) actually points to — likely a battle-objects context
  or AIData, since `battle_calcRelPosToTarget_803172E` is documented to need an "entity and target reference".
