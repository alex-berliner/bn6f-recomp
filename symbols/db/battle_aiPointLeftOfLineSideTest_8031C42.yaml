status: probable
summary: AI helper that returns 1 if the AI's target battle object is on the left side of a directed line
  through two reference points (else 0), used as a directional/spatiality test for AI decisions.
interface: (r0 = scratch/result buffer @02009f5c, r5 = some context ptr) -> r0 = 1 if left-of-line, 0
  otherwise ; sets Z flag accordingly
details: "- Tail-calls three helpers in sequence: first `battle_calcRelPosToTarget_803172E` (r0=scratch,\
  \ r5=ctx) to fill the scratch at 0x02009f5c with the entity's (and next-position) coordinates relative\
  \ to a doubled target reference point.\n  - Loads r2=0, r3=0xe, r4=0xe, r5=0 and calls `math_pointLeftOfLineTest_80315DC`,\
  \ treating the test point as the buffer at r0 and the directed line as (r2,r4)=(0,0xE) -> (r3,r5)=(0xE,0).\
  \ The two 0xE (panel-coordinate) endpoints and zero origin match BN's \"doubled\" panel coordinate scheme\
  \ used by the rel-pos helper.\n  - Finally calls `sub_8031B7C(r0=1)` to fetch a byte 1 of `[[dword_2013920]\
  \ + 0x14]`; this byte is returned to the caller (seen 0x40 in early snaps, 0x00 in later snaps where\
  \ the AI target crossed to the other side of the line).\n  - Captured-call memory at 0x02009f5c shows\
  \ the two {x,y} pairs (each `0xc0??/0x00??` halfword pair) advancing by ~1 panel per frame and crossing\
  \ the diagonal `(0,0xE)-(0xE,0)` between snaps 11 and 12, exactly when the returned byte flips from\
  \ 0x40 to 0x00.\n  - `pop {pc}` is a tail-call return: this is a leaf that just sequences the three\
  \ calls; r5 and lr are preserved across the chain (callee-saved), so the caller's r5 is live on exit.\n\
  \  - The \"0x40 vs 0x00\" return value pattern is consistent with a bool/flag return; `sub_8031B7C`'s\
  \ summary says it returns byte 1 of `[[dword_2013920]+0x14]` when r0=1, so this function effectively\
  \ ANDs the \"left-of-line\" test with that global AI flag (returns 0x40 if both, 0 otherwise). Likely\
  \ the `1` argument to sub_8031B7C selects \"is target on the enemy line side\" as a one-bit result packed\
  \ into a single byte.\n"
