name: object_destroyWithExplosion
address: '0x080C734E'
kind: function
status: probable
summary: 'Shared destruction handler for a battle object: spawns a hit-bomb explosion effect at its position,
  plays the hit sound, cleans up references to it, and switches its state to CUR_STATE_DESTROY.'
interface: (no args; r5 = battle object pointer) -> void; sets object's state word to CUR_STATE_DESTROY
details: 'Takes no arguments; it operates on the current object in r5. It copies the three words at r5+0x34
  (the object''s position/coords) and spawns a type-1 effect object (effect type 0, the standard explosion)
  at that spot, then plays SOUND_HIT_BOMB_1 and clears the object''s collision region so it no longer
  registers hits. If the word at oBattleObject_ExtraVars+4 is nonzero it calls sub_80E1E3E (likely notifying
  or clearing an attached sub-object/handler). It then follows the pointer at oBattleObject_ExtraVars:
  if that structure''s first word points back to this object, it stores 0 there, removing the object from
  it (likely an owner/target/linked reference). Finally it writes CUR_STATE_DESTROY into the state/phase
  word, which makes the engine run the destroy state and free the object.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldmia r0!, {r1-r3} from r5+0x34 passed to spawn_t1_0x0_EffectObject: explosion spawned at the
    object''s stored position; mov r0, #SOUND_HIT_BOMB_1; bl PlaySoundEffect: plays the bomb-hit sound
    on destruction; bl object_clearCollisionRegion: dead object is removed from collision processing;
    ldr r1,[r5,#oBattleObject_ExtraVars]; cmp r0,r5; str 0: clears a back-reference to this object in
    its extra-vars struct; mov r0,#CUR_STATE_DESTROY; str [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]:
    hands the object to the destroy state'
