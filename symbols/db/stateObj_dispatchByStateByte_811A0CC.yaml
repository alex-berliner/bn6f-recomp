summary: state-object dispatcher that routes to one of five handlers based on the state byte at obj+9
interface: void sub_811A0CC(void /* r5 = state object */)
details: "Trivial state-machine dispatcher for a small per-object controller struct anchored at r5.\nReads the state\
  \ byte at offset 9 of the r5 object and uses it as an index into a 5-entry\nthumb-ARM jump table at 0x0811A0E0.\
  \ Because each table entry is a 4-byte address, the state\nbyte is treated as already pre-multiplied (valid values\
  \ 0, 4, 8, 12, 16 → states 0..4).\nSelected targets:\n  - state 0  (0x0811A0F4) — generic handler\n  - state 1\
  \  (battle_initScalableSpriteObject_811A11C)\n  - state 2  (npc_ClearBusyFlagAndResetState_811A138)\n  - state\
  \ 3  (stateObj_advanceToState0x10_811A148)\n  - state 4  (sprite_scaleShrinkStep_811A160)\nThe dispatcher itself\
  \ does not modify r5, r10 or any flags; the chosen handler runs with\nthe caller's full register context (r0–r4,\
  \ r6–r9, r12, NZCV free; r5/r10/lr are the live\nones it sees). On return, control comes back via `pop {pc}`,\
  \ so it tail-pops lr as the\nreturn address and the caller regains its original r5/r10 unchanged.\nTouched globals:\
  \ the jump table at 0x0811A0E0 (5 word entries); field at `obj+9` is the\nstate selector.\n"
