open_questions:
- What object type is r5 here? The mix of handlers (NPC busy-flag reset, scalable battle sprite init, state 0x10
  advance, shrink step) suggests a battle-side controller struct rather than a generic NPC, but no field offsets
  other than +9 are referenced by this function itself.
- Why is the state byte stored pre-multiplied by 4? Likely a convention used by the subsystem that owns this object
  so the same byte can be reused for both branch-on-state and array indexing without a shift.
- The `pop {pc}` return path bypasses the normal `bx lr`; safe only because every caller enters with `push {lr}`
  (lr holds the real return), but unusual and worth flagging.
