name: sub_809FACE
address: '0x0809FACE'
kind: function
status: probable
summary: Writes a 16-bit value into the mystery-data event-flag buffer entry for a given offset.
interface: (r0 = offset from 0x1400 into the 0x02004xxx flags buffer, r1 = low byte value, r2 = high byte value)
  -> r0 = address of the written halfword; no flags of interest
details: Saves the two value arguments across the call with push {r1,r2}, then calls sub_809FADE, which maps the
  offset relative to 0x1400 to the address of a halfword-sized entry in the toolkit's 0x02004xxx buffer. It stores
  r1 at [r0] and r2 at [r0+1], i.e. writes r1:r2 as a little-endian halfword into that entry. r0 ends up holding
  the entry's address after return. Both known callers are mystery-data processing that clears event flags for map
  entries, so the halfword is presumably a flag value/count being cleared (likely to 0).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_809FACE: push {r1,r2} / bl sub_809FADE / pop {r1,r2} preserves r1,r2 through the pointer computation;
    sub_809FACE: strb r1,[r0] then strb r2,[r0,#1] writes a little-endian halfword at the callee-returned address;
    callee sub_809FADE returns ''address of a halfword-sized entry ... offset relative to 0x1400'' in the 0x02004xxx
    buffer; caller clearMysteryDataEventFlags_809FB04 clears each non-GREEN mystery-data entry''s event flag, consistent
    with writing flag values; caller mysteryData_processMapGroups_809F9DC resolves type-5 entries and clears their
    event flags'
