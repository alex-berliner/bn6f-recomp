name: ai_stepWindupStrikeAttack
address: '0x08108454'
kind: function
status: probable
summary: 'AI enemy attack step: starts a 30-frame windup (anim 0xC, element 4), plays the strike anim
  at frame 20, and registers the hit (HitElement 0xC) when the timer runs out'
interface: (r5 = battle object, r7 = oAIAttackVars of that object) -> updates oAIAttackVars_AttackElement/StepTimer/HitElement
  and object anim; no return value used
details: 'On first entry (AttackElement == 0) it initializes the attack: AttackElement = 4, CurAnim =
  0xC via object_setCounterTime with 0xC frames, and StepTimer = 30. Each subsequent call decrements StepTimer;
  when it reaches 20 it calls battle_playSideVariantAnim with r4 = 3 and r6 = oAIAttackVars_Damage, i.e.
  the strike animation variant chosen from the four side/facing variants. When the timer reaches 0 it
  sets HitElement = 0xC, which presumably applies the attack''s hit/element to the target. The element
  value 4 and hit element 0xC identify which scripted attack this handles.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on [r7,#oAIAttackVars_AttackElement]: zero means attack not started, so it sets element
    4, anim 0xC and StepTimer 0x1E; timer decrement path with cmp 0x14 beq calls battle_playSideVariantAnim(r4=3,
    r6=[r7,#oAIAttackVars_Damage]) at tick 20; timer reaching 0 stores 0xC into oAIAttackVars_HitElement,
    the delayed hit trigger; callee battle_playSideVariantAnim plays a team/facing-dependent animation
    variant on object r5, confirming r5/r4/r6 argument roles'
  refs:
