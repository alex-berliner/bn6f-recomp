name: object_updateCollisionAndDispatch
address: '0x080DD438'
kind: function
status: probable
summary: 'Per-frame collision update for a battle object: remove its collision data, spawn a new collision
  effect, dispatch its CurAction through a 4-entry jump table, re-register it in region 1 if it moved
  onto a new panel, present this frame''s collision data when its panel is valid, and otherwise run the
  despawn handler.'
interface: (r5 = battle object pointer, no args) -> void; r0 = flags/result of callees
details: 'The routine first removes and respawns the object''s collision data (clearing one-shot hit flags),
  then, unless time is stopped and the battle is not over, checks collision flags (0x1E800000 mask): if
  set it clears the object''s collision region and saves its current PanelXY into ExtraVars, apparently
  marking ''was hit / moved this frame''. It then dispatches through a 4-entry jump table indexed by oBattleObject_CurAction
  (sub_80DD4B0/4E8/538/584). After the handler, if CurState != 8, the collision region byte is 0, and
  PanelXY differs from the saved ExtraVars, it re-registers the object in region 1 via object_setCollisionRegion.
  Finally it validates the current panel; if valid it presents the collision data for this frame, otherwise
  it calls sub_80DD584, the same handler used when the battle is over — the despawn/removal state.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_removeCollisionData / object_spawnCollisionEffect at entry — refresh per-frame collision
    state; tst r0, r1 with dword_80DD760=0x1e800000 on oCollisionData_FlagsFromCollision gates clearCollisionRegion
    + PanelXY save; ldr r1,[r1,r0] from off_80DD4A0 indexed by oBattleObject_CurAction — 4-entry state/action
    dispatch table; cmp PanelXY, ExtraVars + mov r0,#1 bl object_setCollisionRegion — re-registers region
    only after a panel change; beq loc_80DD496 bl sub_80DD584 on battle over / invalid panel, and sub_80DD584
    is also jump-table entry 3 — shared teardown path
  refs:
  - bn6f/asm/asm31.s:80573
  - 0x0800A18E battle_isBattleOver
  - 0x0800A098 battle_isTimeStop
  - 0x0801A074 object_clearCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080DD438
