open_questions:
- Which exact header bit 0x2 corresponds to in the BattleObject.Flags byte (OBJECT_FLAG_* set
- list) -- only the higher-level behaviour "set a 'reached target' bit on the object" is certain.
- What r5 carries into the function on entry (probably a scroll-state/timer slot; battle_scrollAccumulateStep_8031176
  reads r5 too but its internals weren't lifted here).
