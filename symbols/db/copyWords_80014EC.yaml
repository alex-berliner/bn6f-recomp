name: copyWords_80014EC
address: '0x080014EC'
kind: function
status: confirmed
summary: Word-aligned memmove — copies a byte count of words from source to destination, copying backwards when
  the regions overlap with destination above source.
interface: void memmoveWords(u32* src /*r0*/, u32* dst /*r1*/, s32 sizeBytes /*r2*/) — preserves r0-r7 and lr, sets
  NZCV per the final loop-counter subtraction
details: 'Generic 32-bit block copy (memmove semantics) used all over the engine. r0 = source

  pointer, r1 = destination pointer, r2 = size in bytes (must be a multiple of 4).

  If (s32)src < (s32)dst it copies backwards: offsets are advanced by size-4 and words

  are read/written from the end toward the start (loop runs while size >= 0 after each

  subtraction). Otherwise it copies forwards from the first word while size > 0.

  Both loops transfer one word per iteration via r3 as scratch.

  Quirks: the signed comparison of the pointers is what picks direction (pointers are

  compared as signed values in Thumb); all registers r0-r7 and lr are preserved because

  the routine pushes them and returns with pop {r0-r7,pc} — so callers get their

  pointer arguments back unchanged. Flags are a side effect of the last counter

  subtraction, not a documented return value. Size of 0 still performs one word copy

  in the forward path (do-while), so callers must pass a nonzero multiple of 4.

  '
