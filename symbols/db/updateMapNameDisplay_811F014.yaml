name: updateMapNameDisplay_811F014
address: '0x0811F014'
kind: function
status: confirmed
summary: Renders the current map's name into VRAM and refreshes the on-screen map-name display buffers.
interface: void updateMapNameDisplay(void)
details: 'First calls sub_803D06C, which returns a pointer (the current map''s name/script data); this pointer is
  stored at +8 of the scene-state struct reached through the toolkit''s Unk200a220 pointer (r10-relative table).
  Then it renders the map-name text table (TextScriptMapNames, entry/script 0xF1, palette 7, one line) as graphics
  via renderTextGfx_8045F8C, using the scratch text buffer unk_200C0E0 and the font/table data at dword_86A5D60.
  Finally sub_811F5DC copies the rendered name from unk_200C0E0 into the display buffer byte_200CF20, associated
  with the char block at 0x6015240. r4-r7 are used as call arguments but are explicitly preserved for the caller
  (pushed/popped around the body).

  '
