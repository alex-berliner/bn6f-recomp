name: rfuConnectionSlots
address: '0x02010CB0'
kind: data
status: probable
summary: 'Proposed name: rfuConnectionSlots. Array of pointers to the RFU library''s per-connection slot
  structures. (table of pointers to RFU connection slots)'
details: The label is indexed by connection slot number, scaled by four, and each entry points to a larger
  RFU connection structure. The routines inspect fields at offsets zero and 0x34 to process commands,
  timeouts, and disconnects, and clear slot data during teardown. It therefore appears to be the primary
  array of active RFU connection slots, likely one pointer per possible peer connection. Its runtime pointers
  and slot-structure contents are not initialized in the ROM itself.
evidence:
- method: caller-analysis
  date: '2026-10-20'
  detail: bn6f/asm/libs.s:4162 loads the table, indexes it by a slot number scaled by 4, and reads command/status
    fields from the pointed structure.; bn6f/asm/libs.s:4384 uses the selected slot pointer while checking
    a timeout-related status and writing a timeout/state value.; bn6f/asm/libs.s:4465 indexes the table
    by the current connection slot and checks for disconnect command 0x26.; bn6f/asm/libs.s:4680 iterates
    the table and reads command/status fields from each pointed slot during slot teardown.; bn6f/asm/libs.s:4811
    iterates the table while updating each connection's send/receive target state.
  refs:
