name: sub_8128B34
address: '0x08128B34'
kind: function
status: confirmed
summary: Copies the 23x8 tile ID block at unk_201C040 into background tile block 2 at column 4, row 3.
interface: void sub_8128B34(void);  // (no register args; uses r10/lr only as caller convention)
details: 'Thin wrapper around CopyBackgroundTiles. Loads arguments from literals and

  the global unk_201C040 (a u16 tile-id table), so callers do not need to

  arrange them. r4/r5 are the game''s size-argument register convention for

  this helper; the function preserves them across the call (push/pop of

  r4-r7,lr) so its single output register contract (r5) is the caller''s

  preserved-r5 expectation rather than a return value. j_size=0x17 (23) and

  i_size=8 (8) define the source tile grid; destination is bg tile block 2

  placed at j=4, i=3.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
