name: sub_80A5428
address: '0x080A5428'
kind: function
status: confirmed
summary: Dispatches to an object's per-mode handler chosen by [r5+8], forwarding r5/r10 and returning the handler's
  r2/r5/r10/r11.
interface: "void dispatchModeHandler_80A5428(void);\n  // in:  r5 = object pointer (mode byte at +0x8 selects handler),\
  \ r10 = opaque, lr = return\n  // out: r2, r5, r10, r11 = whatever the selected handler leaves in them\n  // clobbers:\
  \ r0,r1,r3,r4,r6,r7,r8,r9,r12, lr; flags N,Z,C,V all touched\n"
details: 'Loads a function pointer from the small jump table at off_80A543C using the

  unsigned byte at [r5+8] as a direct byte-indexed offset (no shift/scale):

  r0 = off_80A5438; r1 = LD8(r5+8); handler = LD32(r0 + r1). The table at

  off_80A543C currently lists three Thumb entries: sub_80A5448, sub_80A5494,

  sub_80A549C, so mode values in practice are 0..2.


  Performs an interworking call ("mov lr, pc; bx r0") so each handler entry

  must be stored with the low bit set (Thumb). r1 = mode byte is still live

  on entry, but the contract only commits r5/r10; the handler receives the

  address in r0 and the mode in r1, and is free to use them.


  Returns via "pop {pc}" (a tail-return idiom for a single-push leaf). The

  caller''s r2/r5/r10/r11 are read back from the live registers, which is why

  a handler that never touches some of them transparently preserves the

  caller''s values.


  The mode byte at [r5+8] implies objects handled here carry their

  current-mode selector at +8; mode indexes into a 32-bit-per-entry dispatch

  table (handler addresses) at "off_80A543C" (variable name in the

  disassembly is the address itself).

  '
