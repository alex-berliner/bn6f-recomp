summary: Handles one tick of an enemy AI's battle-AI routine, selecting an attack script and target based
  on HP ratios and difficulty tier.
interface: '(r5 = *BattleObject self, r6 = *AIState state, r7 = *AIAttackVars attackVars) -> void ; side
  effects: mutates AIState counters (Unk_04/Unk_05) and AIAttackVars fields (Unk_02, Unk_03, Unk_18, Unk_28,
  Unk_2c, Unk_30) and triggers object_setAttack0/4 on self'
details: "1. Reads self HP (oBattleObject_HP, r5+0x24) and MaxHP (oBattleObject_MaxHP, r5+0x26); compares\
  \ half of MaxHP vs HP to derive r3 = 4 if HP>=half, else r3 = 2.\n2. Compares r6->Unk_04 (oAIState_Unk_04)\
  \ against r3; if Unk_04 < r3, takes the \"low-HP trigger\" branch at 0x80F8518 which increments Unk_04,\
  \ stores difficulty tier into r7->Unk_03, sets Unk_28 to sub_80F8CF8+1 (off_80F8704), stores a value\
  \ into Unk_18 from sub_80F85B2, and calls object_setAttack4(r0=9).\n3. Otherwise (Unk_04 >= r3): clears\
  \ Unk_04 to 0, reads difficulty tier via battle_getAiDifficultyTier_800FE36, then uses the tier as an\
  \ index into dword_80F853C = 0x030030306 (i.e. per-tier byte table at 0x80F853C, four bytes [0x06,0x03,0x03,0x00])\
  \ to compare against r6->Unk_05.\n4. If Unk_05 < tier-threshold: increments Unk_05, calls sub_80F8610\
  \ (returns r0), and routes to one of three pre-attack sub-scripts:\n     - sub_80F8DA8 (off_80F86F8,\
  \ branch when sub_80F8610 returns >= 3): Unk_02=4, sub_80F865C(r0=1), sub_80F85D4 -> Unk_18; target\
  \ = battle_findPlayer(opposite alliance); Unk_30 not set; object_setAttack0(0x0b).\n     - sub_80F8D3E\
  \ (off_80F86FC, default branch): Unk_02=4, sub_80F865C(r0=0), sub_80F85E8 -> Unk_18; target set; Unk_30\
  \ = r5 + 0x64 (ExtraVars base of self); object_setAttack0(0x0a).\n   Note sub_80F8610 is only called\
  \ here, then its return is compared; it acts as a delay/probability gate for the attack choice.\n5.\
  \ Else (Unk_05 at/past threshold): clears Unk_05, sets Unk_03 = tier, Unk_02 = 0, sub_80F865C(r0=2),\
  \ sub_80F85FC -> Unk_18, sets target = battle_findPlayer(opposite), Unk_28 = sub_80F8DFE+1 (off_80F8700),\
  \ Unk_30 = r5 + 0x60 (likely ExtraVars[0] or HitEffect-related), then object_setAttack0(0x0c).\n6. r5/r6/r7/r10\
  \ are preserved across calls; lr saved/restored. No explicit return value.\n"
