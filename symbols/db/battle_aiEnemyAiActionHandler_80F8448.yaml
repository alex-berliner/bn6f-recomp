  They look like attack-pattern scripts (param0 differs: 0x0b, 0x0a, 0x0c) but their internal roles are
  inferred only from offsets.'
- What Unk_04 / Unk_05 actually count (cooldown? consecutive-attempt counter?) – the asm shows them as
  1-byte counters compared against tier-derived thresholds but semantics not labeled.
- What oAIAttackVars_Unk_30 points to (r5+0x60 vs r5+0x64) – likely an ExtraVars slot used by the chosen
  attack script, but field semantics unclear.
- 'Who calls this function: contract lists no callers (no `bl sub_80F8448` in the provided snapshot).
  Identifying the dispatch site would settle whether r5/r6/r7 setup matches a typical per-actor AI tick.'
