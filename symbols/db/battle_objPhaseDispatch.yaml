name: battle_objPhaseDispatch
address: '0x080E68DC'
kind: function
status: probable
summary: Dispatches execution to a per-phase handler based on the battle object's current phase index.
interface: (r5 = BattleObject*, phase index from CurPhase) -> tail-call to handler at off_80E68F0[r0];
  returns handler's result
details: 'Loads the byte at offset oBattleObject_CurPhase on the object pointer in r5, uses it as an index
  into a 2-entry thumb jump table at off_80E68F0, and tail-calls the chosen handler (with the +1 Thumb-bit
  bit set, which bx consumes). Known entries: index 0 runs the chatbox script handler, index 1 jumps to
  sub_80E6924 (also +1, so Thumb). Because the function does an effective tail call (mov lr,pc; bx r1;
  pop {pc}), caller frames pass through unmodified. The r0 returned from the lookup is forwarded via bx,
  not directly useful as a C return; in practice the result is whatever the selected phase handler returns
  in r0.'
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 'phase index read: ldrb r0, [r5,#oBattleObject_CurPhase] at sub_80E68DC+6; jump table base off_80E68F0
    loaded into r1 and indexed by r0 (ldr r1, [r1,r0]) at +8/+12; tail-call via mov lr,pc ; bx r1 at +14/+16,
    with entries stored as func+1 (off_80E68F0 = battle_objPhaseRunChatboxScript+1 ; sub_80E6924+1); function
    ends with pop {pc}, confirming tail-call semantics; no callers or callees are known beyond the table
