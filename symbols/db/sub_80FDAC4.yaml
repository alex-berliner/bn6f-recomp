name: sub_80FDAC4
address: '0x080FDAC4'
kind: function
status: confirmed
summary: Picks a random reachable target panel for a battle object from its alliance's preferred columns, falling
  back to its current panel when none qualify.
interface: void battle_pickTargetPanelForObject_80FDAC4(u32 param0, u32 param2, u32 param3, struct BattleObject*
  r5); returns r0=chosenPanelX, r1=chosenPanelY; clobbers nz,c,v,r2,r3,lr; preserves r4,r6,r7
details: 'Reserves the object''s current panel via object_reservePanel at entry so concurrent movement sees it busy,
  and releases that reservation (object_removePanelReserve) before returning. Walks up to two preferred columns
  looked up from byte_80FDB80 (table 1,2 / 6,5 indexed by oBattleObject_Alliance). For each column, calls object_checkPanelParameters
  with the column (r0), param0+0x13 as the row byte (r1), and the caller-supplied param2/param3; on success it stores
  a packed (row<<4|col) byte in a small stack buffer and increments the candidate count.


  If no candidate was accepted, it then either reuses the object''s current panel (when it already sits on the requested
  row and its column matches a preferred one) or asks object_getPanelsInColumnFiltered per preferred column, passing
  the running output buffer pointer through r7, to gather per-row candidates. When even that yields nothing it defaults
  to the object''s own panel coordinates.


  Otherwise it picks one of the packed candidates uniformly: calls GetPositiveSignedRNG, then uses SVC 6 (SoftDiv)
  with r6 as the divisor to get an index, decompresses the packed byte into panelX (low nibble) and panelY (high
  nibble). The inline push/pop around object_removePanelReserve preserves the chosen panel across the reservation
  release.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
