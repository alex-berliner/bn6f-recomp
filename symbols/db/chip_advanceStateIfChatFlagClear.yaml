name: chip_advanceStateIfChatFlagClear
address: '0x08026FAA'
kind: function
status: probable
summary: Advances a chip's execution state to 4 (and clears its sub-field) once chatbox/cutscene flag
  0x80 is no longer set; otherwise leaves state untouched.
interface: (no args; uses r5 = chip state struct) -> no return; branch only
details: Calls chatbox_mask_eFlags2009F38 with the 0x80 bit mask. If that bit is clear (NZ not set in
  the comparison), it writes 4 to r5+1 (likely a state/stage field of a chip in the chip-use pipeline)
  and 0 to r5+2 (likely a sub-counter or timer). If the flag is set, execution returns immediately with
  r5 untouched. Runs from the chip-use code path recorded in the route table.
