name: math_getPolarVector
address: '0x080011A0'
kind: function
status: probable
summary: converts an angle index plus magnitude into a (dx, dy) vector using the cosine/sine tables, with
  the y component negated for screen coordinates
interface: (r0 = angle table index, r1 = magnitude/scale) -> r0 = cos(angle)*mag >> 8, r1 = -sin(angle)*mag
  >> 8; flags clobbered, r2-r3 clobbered
details: Doubles the angle index and reads math_cosTable and the parallel table byte_80066E0 (almost certainly
  the sine table, same stride) as halfwords. It negates the sine value and multiplies both by r1, then
  arithmetic-shifts right by 8 (fixed-point 8.8 scale), returning r0 = x and r1 = y. The negated sine
  gives a vector rotated in screen space (y down), i.e. (mag*cos, -mag*sin). No memory is written and
  no other state is touched; it is a pure leaf helper. The nearby functions sub_80011C0 and sub_80012C6
  are almost certainly the companion sin/cos-only variants.
