name: MapScriptCutsceneCmd_write_gamestate_byte
address: '0x08035EF2'
kind: function
status: confirmed
summary: Map-script cutscene command that reads an offset and a byte value from the script stream and stores the
  value into the GameState struct at that offset.
interface: 'void mapScriptCmd_writeGamestateByte(Toolkit* r10 /* GameState via oToolkit_GameStatePtr */, u8* r7
  /* script stream ptr */); // out: r0 = 1, r7 += 3, NZCV set from "add r7,#3"'
details: 'Handler for one opcode of the map-script cutscene command set. It pulls two

  operand bytes from the script stream via ReadMapScriptByte (script pointer in

  r7, mode selector in r6): first with r6=1 to get the offset within the

  GameState struct, then with r6=2 to get the value to write. The GameState

  base pointer is loaded from the toolkit (r10 + oToolkit_GameStatePtr), the

  address is formed as gamestate + offset, and the value byte is stored with

  strb. Notably, ReadMapScriptByte delivers the byte it read in r4 (which is

  why this handler both "reads" and "writes" r4), while r0 carries the

  gamestate/address; the handler then advances the script pointer r7 by 3

  (opcode + 2 operands) and returns r0 = 1, presumably the "continue script"

  result expected by the cutscene dispatcher. The flags left behind are just

  the side effect of the r7 += 3 add.

  '
