name: object_stepApproachTarget
address: '0x080AA0B8'
kind: function
status: probable
summary: Per-frame object step that eases a 32-bit counter at obj+0x14 toward a target value returned
  by sub_80AA134 and raises event flag 1640 once the counter's high half reaches 0x20 while obj+4 is 0.
interface: (r0 = unused on entry; r5 = overworld object struct) -> updates [r5+0x14] by ±1 toward sub_80AA134([r5+4])
  and sets/clears EVENT_1640; no return value
details: 'r5 points to an overworld object record. It reads the byte at +0x04, passes it to sub_80AA134
  to get a target value, and compares it with the 32-bit value at +0x14; if they differ it adds ±1 (r4
  = 1, negated when current > target) and stores the result back, so +0x14 slowly approaches the target
  each call. Independently, when byte +0x04 is 0 it sets EVENT_1640, then checks (value >> 16) == 0x20:
  if true the flag stays set, otherwise it is cleared — so the flag is only held while byte4==0 and the
  counter''s upper half equals 0x20 (≈0x200000). Finally it calls sprite_update on the object''s sprite
  struct. Likely a lift/moving-platform-style object whose counter is a height or progress value in 16.16
  form.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'cmp r0,r1 / neg r4 / add r1,r1,r4 / str r1,[r5,#0x14]: eases +0x14 by 1 toward sub_80AA134''s
    result; lsr r0,#0x10; cmp r0,#0x20 gates whether EVENT_1640 stays set; SetEventFlagFromImmediate/ClearEventFlagFromImmediate
    of the same flag EVENT_1640 bracket the threshold check; bl sprite_update at the end shows it is a
    per-frame object step handler; only caller is object_initSprite''s dispatch, consistent with a step
    handler table entry'
