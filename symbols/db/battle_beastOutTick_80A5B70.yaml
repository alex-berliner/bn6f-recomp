open_questions:
- Exact meaning of r5's fields (offsets 0x6,0x7,0x9,0xC,0x10,0x14,0x24) and whether r6 really is a
- BattleObject (offset 0x88/0x8C/0x90 fall in the AIData/ExtraVars range, not the standard Coords
- block at 0x34). The BBS-request branch's caller-visible purpose ("sync story flag after Beast Out")
- is plausible but inferred only from the flag name. Settling the r5 struct identity would confirm
- whether this is "Beast Out tick" or a more general "transformation state machine" for the player's
- PET (Mega/Beast/Giga).
