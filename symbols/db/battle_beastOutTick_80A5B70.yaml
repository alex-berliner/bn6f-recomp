name: battle_beastOutTick_80A5B70
address: '0x080A5B70'
kind: function
previous_names:
- sub_80A5B70
status: probable
summary: per-frame state machine that drives the player's Beast Out transformation and un-transformation
  during battle
interface: '(r5 = BeastOutAIData-like ctx, r6 = related BattleObject, r10 = toolkit) -> void ; side effects:
  mutates ctx/r5 and BattleObject/r6 state, sets/clears event flags 0x5F2/0x5F3/0x5F4/0x17-0x7/PET_DISABLED/L_MESSAGE_ACTIVE,
  ends with sub_80A6014 + sprite_update on r5''s sprite'
details: "Entry: r6[5] is a sub-state (0/1/2/3) and r5[0x24] is a mode/phase (0/1). The function dispatches\n\
  \  on r6[5]: 0/1 path handles normal transform flow, 3 hands off to sub_80A5EC8 (related cleanup/animation),\n\
  \  while r6[5]==1 with r5[0x24]==1 takes a teardown branch (clears PET_DISABLED + L_MESSAGE_ACTIVE,\
  \ then\n  either finishes Beast Out or invokes sub_80A5D48 on a sub-state==2 path). r5[7] is a \"transform\
  \ allowed\" /\n  active flag; r5[9] is a small step counter that gates sub_80A5C74's \"Beast Out trigger\"\
  \ check.\n  On a successful trigger (sub_80A5C9C returns 1 at 0x80A5BB0), it commits the transformation:\n\
  \  copies r6[6]->r6[8], r5[6]->r6[6], r5[6]+1 -> r6[0xD], and writes 3 fixed-point coords from\n  r5[0xC/0x10/0x14]\
  \ into r6+0x88/0x8C/0x90 (the BattleObject's X/Y/Z float block). Then it tests\n  flag 0x5F2 to pick\
  \ between setting 0x5F3 (new transform path: also calls sub_80A5E8C and a BBS\n  request that sets event\
  \ 0x17 bit 0x7) or just setting 0x5F4. The \"untransform / abort\" branch\n  (sub_80A5C9C returning\
  \ anything other than 1 or 2) clears the same two flags and resets r5[9]/r5[0x24].\n  Every exit path\
  \ falls through to sub_80A6014 then sprite_update on the object held in r5.\n  r5 looks like a small\
  \ \"BeastOut controller\" struct (offsets 6,7,9,0xC,0x10,0x14,0x24); r6 is the\n  BattleObject being\
  \ transformed (offsets 5,6,8,0xD,0x88,0x8C,0x90).\n"
