name: ai_useChipAttack
address: '0x0801056A'
kind: function
status: probable
summary: 'Sets up the player-AI''s chip attack: loads the chip''s stats into the AI attack vars and dispatches
  one of three attack behaviors.'
interface: (r0 = behavior flags, r1 = chip-use delay, r2 = AI difficulty tier) -> r0 = 0; side effects
  on battle object AIData
details: 'r0-r2 are saved on the stack, then the object''s related-object pointer and AIData temp-attack
  pointer are nulled and the 0x48 AI flag cleared before flag 0x40 is dispatched. It reads the 16-byte
  chip record for the object''s alliance from table 0x2036720 and stores ChipID, damage, and attack boost
  into oAIAttackVars at aidata+0xA0, zeroing the init flag and taking chip-use delay and difficulty tier
  from the arguments. If battle_networkInvert(alliance) is nonzero and a chip is set, it calls sub_801EB18
  with chipID/damage/boost, which looks like the network-battle (dark chip?) side effect. Finally the
  low bits of the flags argument select the behavior: 0x200 -> attack id 0x47 + sub_80EE90C, 0x400 ->
  attack id 0x48 + sub_80EEA3C, otherwise attack id 0x4B + sub_80EED56.'
