name: battle_initShadowlessObject
address: '0x080C6DFC'
kind: function
status: probable
summary: 'First-time setup for a battle object''s appearance: places it at its panel, loads its sprite
  with no shadow, resets animation/palette/flip, and hands control to its update state.'
interface: (r0/r4 = battle object pointer, r5 = same) -> r0 = result of sub_80C6E50; object left in CUR_STATE_UPDATE
  with phase fields reset
details: 'The routine acts on a battle object: it first recomputes pixel coordinates from the panel grid
  (object_setCoordinatesFromPanels), zeroes and then increments the Z16 and Y16 halfword fields, and loads
  a sprite with fixed arguments (0x10, 0x20, 0x80) via sprite_load. It then marks the sprite shadowless,
  sets oObjectHeader_Flags bit 0x2, resets both animation fields (CurAnim and CurAnimCopy) to 0 and applies
  animation 0 and palette 0, and sets the horizontal flip from object_getFlip (alliance/DirectionFlip).
  Finally it writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized and calls
  sub_80C6E50, likely the matching update handler. The pattern is the classic per-object state-0 ''init''
  handler in BN6 battle code; which specific object/effect it belongs to is not shown here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels then Z16/Y16 updates: object is positioned from its panel
    coords at spawn; sprite_load (0x10,0x20,0x80) + sprite_noShadow: gives the object its sprite and suppresses
    its shadow; CurAnim/CurAnimCopy zeroed + sprite_setAnimation(0) + sprite_setPalette(0) + sprite_setFlip(object_getFlip()):
    full sprite-state reset; str CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    then bl sub_80C6E50: transition to the update state handler; runs in battlesweep/beastsp/chips recorded
    routes, consistent with a battle-scene object initializer'
