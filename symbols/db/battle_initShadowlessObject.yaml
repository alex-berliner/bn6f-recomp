name: battle_initShadowlessObject
address: '0x080C6DFC'
kind: function
status: confirmed
summary: 'Initialize a shadowless battle object: position from panels, load sprite without shadow, set initial animation/palette/flip,
  then transition to update phase.'
interface: void battle_initShadowlessObject(void); /* r5 = object pointer; outputs r5, r8, r9, r10, r11, r12 via
  sub_80C6E50 */
details: "Operates on the BattleObject pointed to by r5.\n- Calls object_setCoordinatesFromPanels to place the object\
  \ on the battle grid.\n- Sets Z16 to 1 and increments Y16 by 1 (slight vertical offset; both are 16-bit fields\
  \ at\n  oBattleObject_Z16 / oBattleObject_Y16). The Z16 write is done via a redundant\n  zero-then-add-1 sequence\
  \ rather than a direct store, but the net result is Z16 = 1.\n- Loads the sprite via sprite_load(r0=0x80, r1=0x10,\
  \ r2=0x20) then calls sprite_noShadow\n  to suppress the ground shadow that normal battle objects render.\n- ORs\
  \ flag bit 1 (value 2) into oObjectHeader_Flags, marking the object as shadowless /\n  a special category.\n-\
  \ Resets oBattleObject_CurAnim and oBattleObject_CurAnimCopy to 0, calls\n  sprite_setAnimation(0) and sprite_loadAnimationData()\
  \ to load frame-0 animation data,\n  then sprite_setPalette(0).\n- Reads the object's current flip direction (object_getFlip)\
  \ and applies it to the\n  sprite (sprite_setFlip).\n- Writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized,\n\
  \  transitioning the state machine to its per-frame update phase.\n- Tail-calls sub_80C6E50, which produces the\
  \ final r5/r8/r9/r10/r11/r12 outputs that\n  this function returns to its caller.\nTypical callers would be initialization\
  \ routines for battle effects, projectiles, or\nenvironmental objects that should not cast a shadow sprite.\n"
