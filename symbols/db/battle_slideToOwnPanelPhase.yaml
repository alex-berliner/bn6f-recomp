name: battle_slideToOwnPanelPhase
address: '0x080BBCD8'
kind: function
status: probable
summary: Battle-object phase handler that slides the object sideways each frame until it reaches a panel
  of its own alliance, then counts down and moves to the next action.
interface: (r0 = unused/scratch, r5 = battle object) -> updates object phase/action fields; no return
  value
details: 'On phase 0 it sets phase 4, plays animation 0x12, plays sound 0xC0 (0xC1-1 computed in-register),
  and stashes sub_80E7896''s result in ExtraVars. On phase 4 it advances X by XVelocity, recomputes PanelX/PanelY
  via object_setPanelsFromCoordinates, and calls sub_80BBE3A whenever PanelX changed. It then looks up
  a per-alliance pair of panel-mask words from byte_80BBD50 (alliance 0: require 0x10 / owner value 5;
  alliance 1: require 0x10 / owner value 0xA) and calls object_checkPanelParameters with the object''s
  PanelX/PanelY/Alliance. If the panel matches, it decrements Timer and, on expiry, sets CurAction=0xC
  with phase reset to 0; if the panel doesn''t match, it jumps straight to CurAction=0x10 with phase 0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'phase 0 branch: strb #4 CurPhase, mov #0x12 CurAnim, bl PlaySoundEffect (0xC1+0xFF) — startup
    of a timed move; phase 4: loads XVelocity into X then bl object_setPanelsFromCoordinates — continuous
    horizontal slide; off_80BBD4C indexes byte_80BBD50 by Alliance<<3 into two mask words passed to object_checkPanelParameters
    — per-side panel ownership check; timer countdown then CurAction=0xC on success vs CurAction=0x10
    on check failure — branch to next behavior based on panel validity'
