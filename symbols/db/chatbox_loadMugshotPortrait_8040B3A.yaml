name: chatbox_loadMugshotPortrait_8040B3A
address: '0x08040B3A'
kind: function
status: confirmed
summary: Sets up the chatbox's sprite sub-structure to display a character's mugshot portrait, loading
  its graphics and animation data.
interface: void chatbox_loadMugshotPortrait_8040B3A(u32 mugshotId /*r0*/, u32 attr01 /*r1*/, Chatbox*
  chatbox /*r5*/); /* r4 passes through; returns r1=chatbox+0x88 value, r2/r3 whatever the sprite animation
  loader left, r7=chatbox */
details: 'Takes the chatbox object in r5 and operates on its sprite sub-structure at offset 0x1F8

  (CHATBOX_SPRITE_OFFSET). Calls spriteLoadMugshot_800275A with the mugshot id (r0) and the

  value from r1 (stored afterwards at sprite+4, some attribute/select byte), with r1 and r2

  deliberately kept live across the call in the original. Then resets the sprite state fields:

  sprite+0xA = 3 (halfword), sprite+0 = 0 (idle state), sprite+3 = 6, sprite+0x14 = 0.

  Quirk: if the chatbox''s own state byte at chatbox+0x0A (oChatbox_Unk_0A) is already 3, the

  sprite state at sprite+0 is set to 3 instead of 0, carrying the chatbox state over.

  Reads chatbox field 0x90 (a resource number), shifts it left by 4, stores the low byte at

  sprite+0x15, and calls sprite_loadAnimationData_spritePtrProvidedDirectly with that sprite

  id (r0), sprite+3''s value 6 still in r1 and 0x90 in r2; r2 on return is whatever the loader

  left there. Finally stores fixed tile base 0x3C0 at sprite+8, copies chatbox field 0x84

  into sprite+0xC (halfword) and chatbox field 0x88 into sprite+0xE (byte); the 0x88 value is

  also what callers observe in r1 on return. r4 and r5 are preserved; r7 ends up holding the

  chatbox pointer. r0, flags (nzcv) are clobbered.

  '
