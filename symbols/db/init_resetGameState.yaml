name: init_resetGameState
address: '0x08005E22'
kind: function
status: probable
summary: Resets game state by zeroing oGameState_Ptr_20, freeing type-0x25 objects, resetting all graphics,
  running a setup step, reinitialising the battle-fade GFX state, zero-filling global structs (eStruct200a6a0
  and the scenario effect state block at 0x2000780), and finally refreshing the current PET navi's HP.
interface: () -> r0 = 0 written to GameState->field20; no return value, flags from last callee
details: Loads the game state pointer from the toolkit (r10-relative oToolkit_GameStatePtr) and clears
  its oGameState_Ptr_20 field to 0. Calls FreeAllObjectsOfSpecifiedTypes with type 0x25 to free all objects
  of that class. Then resets all graphics state (VRAM, palettes, render info, dummy BG scroll callbacks)
  via resetAllGraphicsState_8005F40, runs one setup step (sub_802FDB0) and wipes its work memory, initializes
  the battle fade graphics state, and zero-fills the fixed global structs including eStruct200a6a0 (0x50
  bytes) and the scenario effect state block at 0x2000780. Finally calls sub_8038A9C and reloadCurNaviStatBoosts_813c3ac,
  which heals the current PET navi's HP back to MaxHP depending on map group and EVENT_PET_NAVI_ACTIVE.
  The whole sequence reads as 'prepare engine for a fresh scene' rather than an in-battle routine.
evidence:
