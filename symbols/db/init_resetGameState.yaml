    followed by runSetupStepAndClearWorkArea_8005F6C: classic scene-restart reset chain; bl sprite_initBattleFadeGfxState_80027C4:
    battle fade pipeline state initialized, implying a transition fade follows; bl reloadCurNaviStatBoosts_813c3ac:
    restores current PET navi HP to MaxHP, consistent with leaving a mode that drained it'
