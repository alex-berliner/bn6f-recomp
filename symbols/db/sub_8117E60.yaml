name: sub_8117E60
address: '0x08117E60'
kind: function
status: confirmed
summary: Picks a battle sprite's animation index from its and the object's facing/lane, swaps it in if changed,
  then runs the per-frame sprite update.
interface: void sub_8117E60(void *battleSprite /* r5 */, void *battleObj /* r7 */); clobbers r0,r1; r2/r3 returned
  via sprite_update; NZCV clobbered
details: 'Operates on a battle sprite struct at r5 and a battle object/state struct at r7.

  Reads sprite fields: +3 = current facing, +4 = base anim index, +0xC = current anim

  index. Reads object fields: +0xD = object facing (0..3, where 2 means "same row

  /long-range") and +0x21 = some boolean flag (only checked when facing >= 2).

  Logic: if the object''s facing lane (facing>>1) matches the sprite''s facing lane,

  use the sprite''s base anim; if the object''s facing is neither 2 nor 0, bump to

  base+1. Otherwise (opposite lane) use base+5, or base+6 when facing >= 2 and the

  flag at +0x21 is set (i.e. long-range 2-laner facing a same-row target).

  Only when the resolved anim index differs from the sprite''s current anim index

  at +0xC does it call sprite_setAnimation(u8), sprite_loadAnimationData(), and

  sprite_noShadow() to switch animations and clear the shadow; otherwise it just

  calls sprite_update(). The r2/r3 outputs in the contract come from sprite_update.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
