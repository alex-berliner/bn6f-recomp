summary: Reads a sign-extended 16-bit immediate from a cutscene camera script at a given byte offset.
interface: s16 ReadCutsceneCameraScriptSignedHalfword(const void *script /*r0*/, int offset /*r1*/); preserves r1-r3,
  returns value in r0
details: Computes script_ptr + offset, reads the 16-bit little-endian value there using two byte loads (so unaligned
  offsets work), sign-extends it via lsl
