name: GetCurPETNavi
address: '0x080010B6'
kind: function
status: confirmed
summary: Returns the navi currently selected on the PET, leaving the game state pointer in r3.
interface: u8 GetCurPETNavi(void); inputs r10 (toolkit), lr; outputs r0 (navi id), r3 (game state pointer)
details: Reads the toolkit's GameState pointer (r10 + oToolkit_GameStatePtr), then loads a byte from oGameState_CurPETNavi
  and returns it in r0. As a deliberate side effect, r3 is left holding the game state pointer, which some callers
  make use of. No flags or other registers are touched.
