name: battle_objectInitAction_80E0568
address: '0x080E0568'
kind: function
status: confirmed
summary: Battle object's "init" state action - loads sprite descriptor data, sets up animation/palette/flip,
  marks the object active, then advances to the update phase.
interface: u32 battle_objectInitAction_80E0568(u32 obj /* r5 */); // returns r0 = CUR_STATE_UPDATE; clobbers
  r0-r3, lr, NZCV
details: "Called once when a battle object first spawns, as the initial entry in its state-action table.\n\
  Reads oBattleObject_Param1 as an index into a 4-byte-per-entry descriptor table anchored at\nbyte_80E0398\
  \ (loaded via off_80E0634). Each descriptor is [sprite_id, palette_id, anim_id, base_palette_index].\n\
  \nSequence:\n  1. sprite_load(0x80, desc[0], desc[1]) then sprite_loadAnimationData(), sprite_noShadow()\n\
  \  2. desc[2] -> oBattleObject_CurAnim and oBattleObject_CurAnimCopy, then sprite_setAnimation/loadAnimationData/update\n\
  \  3. sprite_setPalette(desc[3] + oBattleObject_Param3)\n  4. sprite_setFlip(oBattleObject_Param2)\n\
  \  5. Sets bit 1 of oObjectHeader_Flags (marks the object \"active\" in the object header)\n  6. If\
  \ oBattleObject_Param4 != 0, forces sprite BG priority 0 via sprite_setPriority_8002E14(0)\n  7. Calls\
  \ battle_MirrorRelatedObjectFlag1_80E0616 (mirrors a related-object flag into this object)\n  8. Writes\
  \ CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized and returns the same value\n"
