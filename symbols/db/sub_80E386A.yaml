name: sub_80E386A
address: '0x080E386A'
kind: function
previous_names: []
status: hypothesis
summary: 'Beast-Out power-atk object dispatch: copies object-flag bit 2 from the related object, then jumps to one
  of five state handlers indexed by CurAction (or destroys the object if CurAction is not 0xb and Param1 != 4).'
interface: '(r5 = this battle object, r10 = toolkit) -> void ; side effects: writes oObjectHeader_Flags, may branch
  to one of sub_80E38C8 / sub_80E38EE / sub_80E3904 / sub_80E3930 / sub_80E3950, may set CurState to CUR_STATE_DESTROY'
details: "- Reads Param1 from this object and CurAction from its RelatedObject1Ptr; the dispatch path\n    is taken\
  \ when Param1 == 4 or RelatedObject1Ptr->CurAction == 0xb.\n  - Copies flag bit 0x02 (OBJECT_FLAG_VISIBLE) from\
  \ RelatedObject1Ptr->oObjectHeader_Flags into\n    this object's oObjectHeader_Flags (mask of ~2, then OR with\
  \ the source bit).\n  - When Param1 != 4 the function additionally requires battle_isTimeStop == false (z flag\
  \ from\n    bl+bne) before continuing; when Param1 == 4 the time-stop check is skipped.\n  - The dispatch table\
  \ at off_80E38B4 has five entries (CurAction 0..4) indexing five sibling\n    handlers (only the entries visible\
  \ from assembly are listed). `+1` is the Thumb switch.\n  - The fallback path (CurAction != 0xb and Param1 !=\
  \ 4) sets CurState to CUR_STATE_DESTROY (8),\n    marking the object for teardown.\n  - Captured-call input r0=4\
  \ across all six snapshots aligns with Param1==4 on the very first\n    check, so the visible-path branch dominates\
  \ the sampled execution. The differing exit r0\n    values (8/7/0) come from the five callees / destroy path:\
  \ r0=8 likely is CUR_STATE_DESTROY,\n    r0=0 means the handler returned 0, r0=7 is whatever sub_80E38C8 returned\
  \ (some non-zero\n    status). Cannot fully confirm semantics of the five handlers without their listings.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#oBattleObject_Param1]` then `cmp r0, #4` / `beq loc_80E387C` is the gating test at offset
    0x080E386E. - `ldr r0, [r5,#oBattleObject_RelatedObject1Ptr]; ldrb r0, [r0,#oBattleObject_CurAction]` plus `cmp
    r0, #0xb` matches a "Beast-Out / SP Out power-atk active" check (action 0xb). - `mvn r1, r2` with r2=2 (`mov
    r2, #2`) plus `and r0, r1` (clear bit 1), then `and r1, r2; orr r0, r1` then `strb r0, [r5,#oObjectHeader_Flags]`
    shows OBJECT_FLAG_VISIBLE propagation from RelatedObject1Ptr''s header into this object''s header. - `bl battle_isTimeStop`
    at 0x080E3894 with the preceding `bne locret_80E38AC` jump-back shows the function returns early if a time-stop
    is in effect (only on the Param1 != 4 branch). - The `off_80E38B4` table has exactly five words (`sub_80E38C8+1,
    sub_80E38EE+1, sub_80E3904+1, sub_80E3930+1, sub_80E3950+1`) and is indexed by `ldrb r0, [r5,#oBattleObject_CurAction]`
    so CurAction values 0..4 dispatch to five sibling handlers.'
