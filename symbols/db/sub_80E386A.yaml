name: sub_80E386A
address: '0x080E386A'
kind: function
previous_names: []
status: hypothesis
summary: 'Beast-Out extra-action state for a battle object: jumps to one of five sub-actions by CurAction or destroys
  the object'
interface: (r5 = BattleObjectPtr, r10 = ToolkitPtr) -> void ; modifies r5-relative battle object (flags, CurStateActionPhaseAndPhaseInitialized)
details: "The function reads `oBattleObject_Param1` (offset 0x4) at r5. If that byte equals 4, OR if the related\
  \ object's `CurAction` equals 0xB, it merges bit 1 (0x02) of the related object's `oObjectHeader_Flags` into the\
  \ current object's `oObjectHeader_Flags` (`mvn r1, #2` / `and` / `orr` / `strb r0, [r5,#oObjectHeader_Flags]`).\n\
  \  When `Param1 == 4` the dispatch jumps straight to the action table; otherwise `battle_isTimeStop` is consulted\
  \ and the function returns early if a time stop is active.\n  Otherwise the function dispatches via the indirect\
  \ jump table at `off_80E38B4` keyed by `oBattleObject_CurAction` (5 entries → sub_80E38C8, sub_80E38EE, sub_80E3904,\
  \ sub_80E3930, sub_80E3950, all jumped to via `bx r1` with `mov lr, pc`).\n  The fall-through path (when neither\
  \ Param1==4 nor CurAction==0xB) sets `CurState = CUR_STATE_DESTROY` and writes the full 32-bit field at `oBattleObject_CurStateActionPhaseAndPhaseInitialized`\
  \ (so CurAction/CurPhase/PhaseInitialized are also clobbered).\n  The captures show entry `r0=0x4`, so Param1\
  \ is read but r0 on entry is unused (only r5/r10/lr are in the contract); exit r0 is whatever the action-table\
  \ target returns (8/7/0/0/0 across the captured calls). The first two non-zero exits come from the dispatched\
  \ handlers; the later zeros suggest those handlers can return 0 as well, but the contract doesn't expose an output\
  \ so this function itself is void-like for its caller.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#oBattleObject_Param1]; cmp r0, #4; beq loc_80E387C` — entry reads Param1 and branches
    if 4 - `ldr r0, [r5,#oBattleObject_RelatedObject1Ptr]; ldrb r0, [r0,#oBattleObject_CurAction]; cmp r0, #0xb`
    — second guard uses 0xB as a sentinel action id - `mvn r1, #2 ... ldrb r0, [r5,#oObjectHeader_Flags] ... ldrb
    r1, [r3,#oObjectHeader_Flags] ... and r1, r2 ... orr r0, r1; strb r0, [r5,#oObjectHeader_Flags]` — copies bit
    1 of the related object''s header flags into the current object''s header flags - `bl battle_isTimeStop; bne
    locret_80E38AC` — bails out under time-stop unless Param1==4 (the earlier branch bypassed the check) - `ldr
    r1, off_80E38B0; ldrb r0, [r5,#oBattleObject_CurAction]; ldr r1, [r1,r0]; mov lr, pc; bx r1` — standard Thumb-via-BX
    jump table dispatch on CurAction - `off_80E38B4` lists sub_80E38C8, sub_80E38EE, sub_80E3904, sub_80E3930, sub_80E3950
    (5 entries), matching CurAction values 0..4 - `mov r0, #CUR_STATE_DESTROY; str r0, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]`
    — default-fallthrough sets destroy state and zeros CurAction/CurPhase/PhaseInitialized because CUR_STATE_DESTROY=8
    packs to 0x08000000 in the union - Captures show entry r0=0x4 (=Param1) across 40 calls; exit r0 varies (8/7/0)
    per dispatched handler, consistent with returning the inner routine''s r0'
