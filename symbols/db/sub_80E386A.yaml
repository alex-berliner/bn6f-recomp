open_questions:
- The exact semantic of the action IDs 0..4 dispatched to the five handlers is unknown; resolving it needs each
  of sub_80E38C8 / EE / 04 / 30 / 50.
- Whether the copied header bit really is OBJECT_FLAG_VISIBLE (0x02) or some other 0x02-valued flag in this object's
  header is not provable from this function alone.
- The "beast" naming is only inferred from the captured call filename `snap_beastsp_*`; renaming would be safer
  if a generic name like `battleObject_dispatchByCurAction_80E386A` were preferred.
