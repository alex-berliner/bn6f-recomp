- from this function's listing; the variation in exit r0 (0 vs 7 vs 8) comes from them and
- would be needed to give precise CurAction semantics.
- Whether `Param1==4` corresponds to "Beast-Out already active" vs "SP-Out slot" vs some other
- special mode; only the action 0xb constant on the related object suggests a power-atk-related
- path.
