name: scenario_ClearEffectActiveFlag_800399A
address: '0x0800399A'
kind: function
status: confirmed
summary: Clears the "active" bit (bit 7) of the scenario effect state byte at 0x2000780, deactivating the current
  scenario effect while preserving its low-7-bit id.
interface: void scenario_ClearEffectActiveFlag_ADDRESS(void)
details: 'Reads the single state byte at 0x2000780 (eScenarioEffectState2000780), masks it with 0x7F,

  and stores it back. Bit 7 appears to be an enable/active flag for the scenario effect; the

  low 7 bits hold the effect id/state and are left untouched, so the effect''s selection is

  remembered but it is no longer running. No other registers or memory are touched; the

  push/pop of r4-r7 is pure preservation and the function effectively clobbers only r0/r1.

  Likely called when a cutscene/field effect (e.g. a scenario-triggered visual or event

  effect) finishes or is dismissed.

  '
