name: battle_spawnArmAttackObject
address: '0x080E4A6E'
kind: function
status: probable
summary: 'Spawns a battle object on a Navi''s arm: loads its sprite/animation, marks it active, renders
  one frame with facing, and enters its per-frame update state.'
interface: (uses r4 = battle object header; r0/r1/r2 = sprite resource args 0x80/0xC/0x20 for sprite_load)
  -> r0 = result of battleObject_updateAttachedArmCoords; object state set to CUR_STATE_UPDATE
details: 'The routine initializes an existing object record (pointed to by r4 through the shared sprite/object
  helpers): it loads sprite resource 0x80 with params (12, 32), skips forward to the attached animation
  data and loads it, and flags the sprite as shadowless. It sets a bit (0x2) in the object header flags,
  writes animation index 2 into both oBattleObject_CurAnim and its copy, commits it via sprite_setAnimation,
  reloads animation data, and calls sprite_update. It then applies the object''s effective facing (alliance
  XOR flip override) to the sprite, stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to switch the object into its update state, and finally syncs the object''s X/Y/Z and panel coords to
  its RelatedObject1Ptr''s arm offset via battleObject_updateAttachedArmCoords — confirming this is an
  arm-attached object (a chip-attack/part object) being spawned into play.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sprite_load(0x80, 0xC, 0x20) + sprite_loadAnimationData + sprite_noShadow: sets up the object''s
    visual (asm lines 2-8); orr r0,#2 on oObjectHeader_Flags and CurAnim=2 in both anim slots: marks loaded/active
    with animation 2; object_getFlip -> sprite_setFlip: orients sprite per alliance/facing, typical of
    battle projectiles/parts; str CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized:
    hands the object to its per-frame update handler; battleObject_updateAttachedArmCoords_80E4AAE as
    final call: object position is derived from RelatedObject1Ptr''s arm offset, i.e. an arm-attached
    spawn'
