name: battle_spawnArmAttackObject
address: '0x080E4A6E'
kind: function
status: confirmed
summary: Initializes the "arm attack" battle object — loads its sprite, sets the object flag and animation, mirrors
  facing, and hands it to the per-frame update state.
interface: void battle_spawnArmAttackObject(r5=battleObject, r10=battleContext); returns r5=battleObject (unchanged
  pointer); clobbers r0-r3, lr, flags
details: "Spawn/setup routine for an arm-attack effect object in battle (e.g. an attack limb attached to\nthe player,\
  \ cf. battleObject_updateAttachedArmCoords_80E4AAE). The object pointer lives in r5\nfor the whole routine and\
  \ is the only meaningful value callers get back (r4 is popped, so its\nincoming value is dead). Steps:\n  1. sprite_load(0x80,\
  \ 0xC, 0x20) — loads the arm-attack sprite resources with fixed resource\n     IDs 0x80/0xC/0x20 (sprite/palette/animation\
  \ set as used by sprite_load).\n  2. sprite_loadAnimationData, then sprite_noShadow — this object casts no battle\
  \ shadow.\n  3. Sets bit 1 (0x2) of oObjectHeader_Flags — likely the \"no shadow / special draw\" style flag\n\
  \     for battle objects.\n  4. Sets oBattleObject_CurAnim and oBattleObject_CurAnimCopy to 2 (the spawn/idle\
  \ animation\n     index), calls sprite_setAnimation(2), reloads animation data and calls sprite_update to\n  \
  \   render the first frame.\n  5. object_getFlip / sprite_setFlip — copies the object's horizontal facing onto\
  \ the sprite.\n  6. Writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized,\n     switching\
  \ the object into its standard per-frame update state, then calls\n     battleObject_updateAttachedArmCoords_80E4AAE\
  \ to position the arm relative to its owner.\nNo caller-visible flags: nz/c/v are clobbered by the callees.\n"
