name: gameState_GetUnk74_8006DEC
address: '0x08006DEC'
kind: function
status: confirmed
summary: Returns a single value (field Unk_74) from the current game state object.
interface: u32 gameState_GetUnk74(void); // reads toolkit from r10, returns gameState->Unk_74 in r0
details: 'Tiny getter. It loads the toolkit pointer from r10 (the dispatcher''s usual context register), follows
  oToolkit_GameStatePtr to the current game state struct, and returns the 32-bit value at oGameState_Unk_74 in r0.
  It pushes/pops r4-r7 and lr purely to preserve the caller''s registers (r4 is used briefly as a scratch copy of
  r10). No flags are meaningfully set; only r0 is a real output. The meaning of oGameState_Unk_74 is not determined
  from this function alone - it is just whatever 32-bit field lives at offset 0x74 of the game state (possibly a
  counter, timer, or mode flag used by callers).

  '
