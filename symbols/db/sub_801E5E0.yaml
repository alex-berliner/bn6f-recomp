name: sub_801E5E0
address: '0x0801E5E0'
kind: function
status: hypothesis
summary: One-line wrapper that invokes sub_801BEC2 with the fixed argument 0x4000 (1<<14), contributing nothing
  else.
interface: void sub_801E5E0(void) — tail-behaves as Next sub_801BEC2(int arg /* 0x4000 */); callers pass only lr,
  and see through r0-r2, NZC and lr from the callee.
details: 'Sets r0 = 1 << 14 = 0x4000 using the Thumb "mov r0,#1; lsl r0,#14" idiom, then branches to

  sub_801BEC2 with the return address still in lr (push {lr} / pop {pc} around a bl, so the

  wrapper returns straight to its own caller). The wrapper''s only contribution is the argument

  and the flag state on entry: the shifted mov sets N=0, Z=0 and C from bit 18 of the value 1,

  which is 0, so sub_801BEC2 is entered with C clear — significant only on paths where that

  callee preserves carry. r0-r2 and NZC on return are exactly whatever sub_801BEC2 leaves.

  Without identifying sub_801BEC2''s purpose, the meaning of the constant 0x4000 (a size,

  layer/flag bitmask, or mode selector) is unknown, so no game-terms name or subsystem prefix

  can be assigned yet.

  '
