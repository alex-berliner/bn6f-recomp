name: sub_804C074
address: '0x0804C074'
kind: function
status: confirmed
summary: Clears battle event flag (flag id 4, bit 0xFE) and turns off the 0x400 render/info bit in the toolkit's
  render-info word.
interface: 'void sub_804C074(void) /* in: r10 toolkit ptr, lr return; out: r2=0x400, r3, r5; clobbers r0,r1,lr +
  nz,c,v */'
details: "First calls ClearEventFlagFromImmediate with an immediate flag id of 4 and bit 0xFE\n(clear that bit in\
  \ event-flag slot 4). Then loads the toolkit pointer from r10 and,\nvia the toolkit's render-info pointer offset\
  \ (oToolkit_RenderInfoPtr), reads the current\n16-bit render-info word, ANDs it with ~0x400 (loaded into r2 from\
  \ off_804C294), and\nwrites the result back as a half-word. The mask value 0x400 is intentionally left\nin r2\
  \ as the function's r2 output (quirk matching the original). The cleared bit\ncorresponds to a render/info state\
  \ on the battle/UI toolkit (e.g. dismissing a\npanel, palette, or animation flag in the toolkit's render info\
  \ word).\nQuirks:\n  \"- Uses EVENT_4FE notation: flag index 4, bit 0xFE (NOT a 12-bit id of 0x4FE).\"\n  - \"\
  movflag EVENT_4FE\" is the lifter's rendering of the immediate flag-id encoding.\n  - Preserves r4-r7; only r5\
  \ appears in the output set because of the preserved-register\n    shadow left in the immediate operand.\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
