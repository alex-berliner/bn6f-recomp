name: enemy_getStruct1
address: '0x0800F214'
kind: function
status: confirmed
summary: Resolves an enemy index to a pointer to its per-enemy struct by looking up actor type (virus/navi/player)
  and AI index tables.
interface: enemy_resolveStructByActorType(u16 enemy_idx) -> (void *struct_ptr /*r0*/, u32 ai_index_x4 /*r2*/); clobbers
  r1, lr, NZC flags; V flag also reported as output by callers
details: 'Given an enemy index in r0, calls GetVerActorTyAndAIIdx_80182B4(enemy_idx),

  which returns a pointer to a 3-byte record {version (u8), actor_type (u8),

  ai_index (u8)} describing that enemy. actor_type is multiplied by 4 and used

  to index the top-level table at off_800F230, which holds three pointer

  tables: index 0 = virus structs (off_81090D0), index 1 = navi structs

  (off_80F24D8), index 2 = player struct (off_80EA814). The selected

  per-type table is then indexed by ai_index << 2 (each entry is a 4-byte

  pointer) and the resulting struct pointer is returned in r0. As a side

  effect r2 is left holding ai_index * 4, which some callers appear to

  reuse. Pure table lookup, no writes; the exact struct layout depends on

  the actor type and is defined by the target tables.

  '
