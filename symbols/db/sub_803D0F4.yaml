name: sub_803D0F4
address: '0x0803D0F4'
kind: function
status: hypothesis
summary: Returns the player's protected bug-frags count from the game state, returning 0 if the bug-frag encryption
  check succeeds.
interface: '/* r10 = toolkit; returns bugfrags in r0, game-state pointer in r1 */

  /* On the "encryption active" path, only r0/r1 are set to 0/unmodified; r2-r7 are preserved */

  /* clobbers: r0, r1, NZ, CV; preserves: r2-r7; uses: r10 (toolkit), lr (return) */

  '
details: 'Calls encryption_bugfrags_8006fd0 to test whether bug-frag-encryption mode is active (Z set

  indicates no bugfrags, non-zero indicates encryption is in effect). If encryption is active

  (branch taken to loc_803D104), returns 0 in r0 with r1 left as incoming r1 (= r10''s caller

  value, which is just the prior r1 not the toolkit). If encryption is NOT active, follows the

  chain through the toolkit''s oToolkit_GameStatePtr to load oGameState_ProtectedBugfrags from

  the game state into r0, and returns the resolved game-state pointer in r1. The toolkit pointer

  is supplied via r10 per the register contract (not via the stack), and the function itself

  tail-pops {pc} so it is a leaf/thunk-style helper. Likely called from save/load or link-related

  code paths that need the real protected bug-frag value but must hide it behind the encryption

  check.

  '
