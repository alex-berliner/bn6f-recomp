name: battle_hitSelfAndFrontPanel
address: '0x080C8660'
kind: function
status: probable
summary: Battle-object action that plays a sound, applies an effect to its own panel and the panel it
  faces (skipping the front one if that panel is flagged, e.g. a hole), then destroys itself.
interface: (r5 = battle object) -> r0 = CUR_STATE_DESTROY stored to oBattleObject_CurStateActionPhaseAndPhaseInitialized;
  no return value
details: Plays sound effect 0x1D via PlaySoundEffect, then calls sub_80C8806 with the object's PanelX,
  PanelY, Element and Param1 with 0x100 ORed into the high byte, plus r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler
  — so sub_80C8806 is likely a 'spawn hit/attack effect at panel' helper. It then computes the adjacent
  panel using object_getFrontDirection (+1/-1 by alliance/DirectionFlip) and queries its status with object_getPanelParameters;
  if bit 0x10 is clear it repeats the sub_80C8806 call for that front panel with the 0x100 flag cleared,
  and with it does not. Finally it writes CUR_STATE_DESTROY to the object's state field, ending the object.
  The 0x10 panel-status bit is presumably 'hole/broken panel', which the attack cannot cross; the 0x100
  Param1 flag likely marks the hit variant (self vs front).
