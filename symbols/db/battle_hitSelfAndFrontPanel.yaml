name: battle_hitSelfAndFrontPanel
address: '0x080C8660'
kind: function
status: confirmed
summary: Plays a destroy SFX, spawns an element effect on the object's own panel and optionally on the panel one
  step ahead (if solid), then transitions the object to DESTROY state.
interface: void battle_hitSelfAndFrontPanel(r2 sfx_extra, r5 obj) -> preserves r4 r5 r6 r7 r10
details: Plays sound effect 0x11D (0x1E+0xFF) with r2 as extra parameter. Reads oBattleObject_PanelX, PanelY, Element,
  Param1, and DamageAndStaminaDamageCounterDisabler from the object pointed to by r5. Calls sub_80C8806 to spawn
  an outgoing element effect on the object's own panel with kind=0x100 (the "front" flag) OR'd into r3/r4. Determines
  the facing direction via object_getFrontDirection, adds it to PanelX to get the target column (PanelY unchanged),
  and queries object_getPanelParameters. If the returned parameters have bit 4 (0x10, meaning the panel is solid),
  a second sub_80C8806 call spawns an incoming effect (kind=0, no front flag) on that adjacent panel.  Finally writes
  CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized. r4 and r6 are pushed at entry because
  sub_80C8806 clobbers them as input params but the caller contract requires them preserved.
