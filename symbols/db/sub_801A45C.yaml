name: sub_801A45C
address: '0x0801A45C'
kind: function
status: confirmed
summary: 'Counter-hit resolution: shows the "Counter Hit" popup on the opposing side, credits their counter tally,
  resets this object''s counter timer, and (while the battle is still going) fires the counter-hit event and plays
  the select SFX.'
interface: 'void sub_801A45C(void);

  // inputs : r5 = battle object (BattleObject*); r10, lr = caller frame

  // outputs: r2 (0x40 on early-out, callee leftover otherwise)

  // clobbers: r0, r1, r2, r3, r8, r9, r10, r11, r12, lr

  //           flags NZ, C, V

  // preserves: r4, r6 (saved/restored by the function)

  '
details: "Reads the BattleObject's CollisionDataPtr (r4) and its oCollisionData_FlagsFromCollision\nfield (r6).\
  \ When bit 0x40 of those collision flags is clear, returns early after leaving\nr2 = 0x40 (matching the source's\
  \ `mov r2, #0x40`). Otherwise:\n  - Calls battle_testFlag0x40_800A8F8; if it returns non-zero, opens popup 0x1500\
  \ on the\n    opposing side via sub_802E032 (alliance is loaded with `ldrb` then `eor #1`).\n  - Re-reads oBattleObject_Alliance\
  \ and adds +1 (saturated byte) to the opposing side's\n    stat-table entry #8 (counter-hit tally) via tableAddSaturatedByte_800AB46.\n\
  \  - Zeros oCollisionData_CounterTimer on this object's CollisionData.\n  - Calls battle_isBattleOver; bails out\
  \ if the battle has ended.\n  - Calls sub_801E270 (counter-hit event handler, fed via the context registers r4-r6),\n\
  \  keeping its r0 alive across the PlaySoundEffect call with `push {r0}` / `pop {r0}`,\n  and plays SOUND_SELECT_86\
  \ (sound id 86).\nReads/writes BattleObject.oBattleObject_Alliance and .oBattleObject_CollisionDataPtr,\nand CollisionData.oCollisionData_FlagsFromCollision\
  \ and .oCollisionData_CounterTimer.\nCaller-visible contract: r4 and r6 are saved/restored explicitly via `push\
  \ {r4,r6}` /\n`pop {r4,r6}`; r5 is preserved only because the ldr-from-r5 reads are not destructive;\nr7-r12 are\
  \ merely un-touched here and left whatever the callees left them.\n"
