name: battle_snapToRelatedObjectPanel
address: '0x080C2678'
kind: function
status: probable
summary: Copies the related object's panel coordinates into this battle object, drops it to ground level,
  and offsets its pixel X by 10 px opposite its facing side.
interface: (r5 = battle object, uses r5->RelatedObject1Ptr) -> r0 = new X coordinate; clobbers r0-r3,
  lr
details: Reads PanelX/PanelY from the object pointed to by r5->RelatedObject1Ptr and stores them into
  r5's own PanelX/PanelY, then calls object_setCoordinatesFromPanels to recompute pixel X/Y from those
  grid coordinates. Z is zeroed (no elevation). It then calls object_getFrontDirection to get the +1/-1
  side multiplier, negates it, scales by 0xA0000 (10 << 16, fixed-point pixels) and adds that to oBattleObject_X,
  shifting the object 10 pixels to the side opposite its facing — i.e. parked just behind the related
  object. The object's own panel state thus mirrors its related object's, keeping it on the same tile.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r1,#oBattleObject_PanelX]/ldrb r1,[r1,#oBattleObject_PanelY] then strb into r5 copies
    panels from RelatedObject1Ptr; bl object_setCoordinatesFromPanels syncs pixel position to the copied
    panel coords; neg r0,r0; mov r1,#0xa; lsl r1,#16; mul combines -facing with 10 fixed-point pixels
    for the X offset; called by battle_initR5ObjectSpriteAndState and battle_slideToPanelAction, both
    battle-object setup/movement handlers
