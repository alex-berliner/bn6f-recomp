summary: Update handler for battle objects whose CurAction is 0x16 (Snakearm); routes to a per-action
  step and tears down the object on battle-over or non-hole+non-solid panels.
interface: (r5 = BattleObjectPtr, r8 = ?, r10 = Toolkit, r4/r7 = saved) -> void ; r0 trashed, flags clobbered
details: 'Reads `oBattleObject_CurAction` (r5+0x9) into r0, indexes the two-entry jump table at

  `off_80C6C58` (entries 0x16 -> `battleObject_kind0x16SnakearmStep_80C6C6A+1`, 0x17

  (read) `battleObject_dyingTickDespawn_80C6CBA+1`) using a Thumb `bx r1` indirection so

  the callee sees Thumb state. The `CurAction` byte is the index; the slot used in the

  trace (`r0=0x4` on entry is the BattleObject + size-of-pushed-context, not the action)

  and the captured-call `r1=0x080c6c15` is just `sub_80C6C14|1`, the Thumb-bit trampoline

  the caller uses. The function unconditionally calls `object_removeCollisionData` and

  `object_spawnCollisionEffect` first; if `battle_isBattleOver` returns non-zero, or the

  object''s current panel has neither the `0x10` (hole) bit nor the solid panel bit (the

  `tst r0,r3`/`beq` branch into the destroy path), it clears the collision region and

  sets `CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY`. Otherwise, if

  `oCollisionData_FlagsFromCollision` is non-zero it clears the collision region, then

  dispatches via the action jump table; the `kind0x16` action calls

  `object_presentCollisionData` then `object_highlightCurrentCollisionPanels`, while the

  `0x17` action (`dyingTickDespawn`) presumably tears them down. The action dispatch uses

  `CurAction` only as a 0/1 index into a 2-entry table, so this is in practice a 0x16/0x17

  handler.

  '
