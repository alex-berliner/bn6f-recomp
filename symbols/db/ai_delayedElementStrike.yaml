name: ai_delayedElementStrike
address: '0x081076CE'
kind: function
status: probable
summary: 'AI charge-then-strike: on first call write element 4 to AttackElement and copy AttackDuration
  into StepTimer; on later calls decrement StepTimer, and when it reaches 0 write 0x2C to HitElement (halfword).'
interface: (r7 = attacking entity's oAIAttackVars) -> r0 = clobbered; sets AttackElement/StepTimer on
  first call, HitElement on expiry
details: 'On first invocation AttackElement is 0, so it writes element #4 into oAIAttackVars_AttackElement
  and copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, arming a frame countdown. On later
  calls it decrements StepTimer each frame; when it reaches 0 it writes 0x2C into oAIAttackVars_HitElement,
  which the AI/hit pipeline presumably reads as the attack to apply. It touches no other structures and
  returns without changing flow state, so re-entry is what drives the phases. Element 4 vs hit id 0x2C
  suggests a charge-then-strike pattern typical of boss AI attack scripts.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne splits init phase from countdown phase; strb
    r0,#4 -> AttackElement and ldrh AttackDuration -> strh StepTimer arm the timer once; sub r0,#1; strh
    StepTimer; bgt loops the countdown frame by frame; mov r0,#0x2c; strh r0,[r7,#oAIAttackVars_HitElement]
    fires the delayed effect on expiry; executed from recorded battlesweep routes, matching boss/anti-body
    AI attack scripting
