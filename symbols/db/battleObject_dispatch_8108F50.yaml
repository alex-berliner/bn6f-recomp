name: battleObject_dispatch_8108F50
address: '0x08108F50'
kind: function
status: confirmed
summary: Dispatches a battle object (r5) to its current-state handler via a 3-entry jump table, then runs the post-dispatch
  update that keeps enemy attack animations playing.
interface: 'void battleObject_dispatch_8108F50(struct BattleObject* battle_obj /* r5 */);

  // inputs:  r4–r12, lr preserved by callees

  // outputs: r5, r8–r12

  // clobbers: r0–r4, r6, r7, lr, flags (N, Z, C, V)

  '
details: 'Reads byte field oBattleObject_CurState from the BattleObject pointed to by r5,

  uses it as a byte offset into the 3-entry jump table at 0x08108F68

  (off_8108F64 -> off_8108F68), and tail-calls the matching handler with the full

  register file intact (mov lr,pc; bx r1). The three targets are sub_8016F56

  (offset "0":0), battle_8108F74 (offset "4":1), and sub_8016C4E (offset "8":2).

  After the handler returns, it unconditionally calls sub_8016E64, which the

  in-source comment notes "disabling this causes enemy attack animations to

  cease playing", implying sub_8016E64 drives enemy attack animation/tick

  processing for the battle-object subsystem. The function itself uses lr (push

  {lr} / pop {pc}) only as a stack frame; no local stack is allocated.

  '
