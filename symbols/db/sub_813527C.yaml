name: sub_813527C
address: '0x0813527C'
kind: function
status: confirmed
summary: Copies a run of 32-byte battle-state/toolkit slots from src to dst, then zero-fills the next slot past
  the copied range.
interface: void battle_copyStateSlotsAndZeroNext_813527C(u32 src /*r0*/, u32 dst /*r1*/, u32 slot_count /*r2*/);  //
  r4-r7 preserved; r0, r1, lr, flags clobbered; r2, r3 written by callees
details: 'SLOT_SIZE is 0x20 (32 bytes), the fixed stride for a battle-state / toolkit entry. If slot_count != 0
  the function calls CopyByEightWords(src, dst, slot_count*0x20) to bulk-copy that many slots, then advances the
  local dst pointer by the same byte total.  In every case (including slot_count == 0, where the copy branch is
  skipped entirely) it calls ZeroFillByEightWords(dst_advanced, 0x20) to blank the single slot that immediately
  follows the copied region, leaving it ready for the next writer.  r3 is forced to 0x20 before the copy call and
  survives via callee preservation, so it is listed as an output.  The function never modifies r4-r7 (they are merely
  spilled for callee safety) and uses r6 as its internal copy of the slot-count argument.  The tail padding is two
  zero bytes (0x00, 0x00) to maintain THUMB alignment.

  '
