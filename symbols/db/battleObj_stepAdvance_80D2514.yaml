name: battleObj_stepAdvance_80D2514
address: '0x080D2514'
kind: function
status: confirmed
summary: 'Advance a battle-object projectile one tick: apply X-velocity, map to panel grid, spawn its
  collision hitbox at timer 2, and restart the action cycle on timer expiry.'
interface: void battleObj_stepAdvance(u32 r5 /* battle object ptr */);
details: Per-tick update for a moving battle object (projectile or chip-attack tile). It adds oBattleObject_XVelocity
  to oBattleObject_X, converts the resulting world XY via convertXYToPanelXY_800E258 into oBattleObject_PanelX/PanelY,
  and stores those panel coordinates. When the 16-bit oBattleObject_Timer equals 2, it calls object_spawnCollisionRegion
  with panel X/Y, element, Z-depth, hit-mask 0x4040401 (r4), the object pointer (r5), the DamageAndStaminaDamageCounterDisabler
  value (r6), and action/event ID 0x51 (r7); r4/r6/r7 are saved and restored around that call. After the
  collision branch, the timer is decremented; when it reaches zero the object's action cycle restarts
  with Timer=0x14 (20 ticks), CurAction=4, and CurPhaseAndPhaseInitialized=0. oBattleObject_X is a 32-bit
  sub-pixel coordinate; oBattleObject_Timer is a 16-bit countdown.
