name: sub_80062EC
address: '0x080062EC'
kind: function
status: hypothesis
summary: Tiny sequencer that runs two sub-steps (sub_80062D0 then sub_80062D6) back to back; its game meaning is
  entirely inherited from those callees.
interface: void sub_80062EC(void) — callers pass values in r3 and r5 (forwarded to the callees), and read back r1,
  r2, r5 plus C/V flags produced by the second call; r3 is preserved through the wrapper.
details: The whole function is push {lr}; bl sub_80062D0; bl sub_80062D6; pop {pc}. It adds no logic of its own
  — it merely chains the two callees in a fixed order, so all caller-visible effects (registers r1, r2, r5 and the
  C/V flags, per the register contract) come from the second call, sub_80062D6; anything sub_80062D0 leaves in r1/r2/flags
  is overwritten. r3 and r5 are forwarded untouched as inputs to both calls, and r3 comes back unchanged through
  the wrapper. Without reading sub_80062D0 and sub_80062D6 there is nothing to say about what game system this serves
  — it could be an update pair, a state-machine step, or an init/setup pair. No memory is accessed and no structures
  are touched at this level.
