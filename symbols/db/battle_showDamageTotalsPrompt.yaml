name: battle_showDamageTotalsPrompt
address: '0x0800838A'
kind: function
status: probable
summary: 'State object: on first entry it fetches both players'' total damage taken and forwards both
  values to sub_802CB38, then waits; on subsequent frames sub_802CB78''s return picks between advancing
  the battle phase step (result 1 -> state 0xc), incrementing the custom-gauge charge (result 2 -> state
  0x10), or defaulting to state 0x14.'
interface: '(r5 = state/controller object: +0 next-state word, +3 substate byte; r10 = toolkit) -> none;
  advances oBattleState_PhaseStepIndex or oBattleState_CustGaugeChargeLevel and picks next state via [r5].'
details: 'r5 is a small state-machine object: byte [r5,#3] distinguishes first entry (0) from waiting
  (4), and word [r5] receives the next state id. On first entry it reads battle_getPlayerTotalDamageTaken(1)
  and (0) and passes both totals to sub_802CB38 — likely displaying/processing the damage-taken figures
  — then latches substate 4. On later frames it calls sub_802CB78, whose r1 return acts as a result code:
  1 increments oBattleState_PhaseStepIndex and moves to state 0xc, 2 increments oBattleState_CustGaugeChargeLevel
  and moves to state 0x10, otherwise it falls to state 0x14. The involvement of damage totals, PhaseStepIndex
  and CustGaugeChargeLevel suggests a tutorial-style or scripted battle sequence rather than normal battle
  flow.'
