name: battle_stateCrossNetBattleIntroStep
address: '0x08009AD8'
kind: function
status: probable
summary: 'Battle state-machine sub-phase handler: fires a one-shot battle sub-effect (using the event
  count as kind byte), then polls cross-net/linked-battle readiness before advancing to state 8.'
interface: (r0,r1 unused on entry; r5 = battle state struct) -> r0 clobbered; updates oBattleState_SubPhaseInitFlag
  / StatePhaseAndInitFlag
details: This is a per-frame step of the battle state machine operating on the battle state struct in
  r5. On the first invocation (SubPhaseInitFlag == 0) it calls battle_dispatchKindEffect_801E792 with
  kind byte taken from oBattleState_State4EventCount (r0=0 as another arg), then latches the init flag
  to 4 so the effect is only queued once. On every later frame it calls comm_checkCrossNetBattleReady_801E754;
  while that returns nonzero it keeps waiting, and once it returns 0 it writes phase 8 into oBattleState_StatePhaseAndInitFlag
  (halfword store, phase in low byte), moving the battle on. No known callers yet, so the exact phase
  this handles in the outer state machine is inferred only from the shared struct layout.
