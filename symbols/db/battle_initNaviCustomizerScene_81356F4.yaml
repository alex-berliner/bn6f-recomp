name: battle_initNaviCustomizerScene_81356F4
address: '0x081356F4'
kind: function
status: confirmed
summary: 'Initializes the in-battle Navi Customizer overlay: clears display buffers, sets up BG0 render info, loads
  customizer tile graphics, draws the 6x6 board tilemap, resets E-Struct records, and starts the customizer BGM
  with a fade-in.'
interface: void battle_initNaviCustomizerScene_81356F4(/* r5 = screenStateStruct*, r9–r12 = toolkit/caller context
  */)
details: 'Called when the player activates the Navi Customizer during a battle. r5 points to a per-screen state
  struct whose byte/word fields (offsets 1,2,0xC–0x17,0x1E–0x26,0x30–0x3A,0x44) are zeroed or set to encode the
  current customizer UI state (screen mode=4 at r5+1, customizer-owner count at r5+0x10, key-item-0x71 possession
  flag at r5+0x0F, data-table pointer at r5+0x44). r10 is the toolkit context; oToolkit_RenderInfoPtr is written
  with BG0 screen value 0xDF40 (224 tiles in base block 1, 64 KB map) and scroll registers 0x10–0x1A are cleared.
  oToolkit_Unk200f3a0_Ptr (a display/palette config block) receives mode=6, window-control bytes 0xF0/0xE, priority
  bits 0x2F/0x3F/0x3F, and BLANK=0. SetScreenFade(8, 0x10) initiates a fade-in. battle_resetEStructRecords_8046664()
  wipes all E-Struct slots; battle_loadNaviCustomizerGfx loads 16x16 tile graphics for the customizer panel; navicust_drawBoardTilemap
  draws the 6x6 grid with placed/unplaced chip tiles; sub_813BAA8, battle_copyWorkBlockToBattleWork_813676C, sub_813660C,
  and sub_81362F8 set up and refresh the sub-screen state and cursor/selection UI; navicust_giveKeyItem14C handles
  a conditional key-item grant (item 0x14C) and submenu_rebuildKeyItemList refreshes the item-list display; battle_spawnEStructRecordsFromTable_80465A0
  re-populates E-Struct slots from a static table at byte_8135628; PlayMusic(SONG_NAVI_CUSTOMIZER) starts the loop.
  Quirks: the return value of sub_813B920 (storeWorkByte) is stored into r5+0x10 unconditionally (the C wrapper
  shows ST8(r5+0x10,0) but the assembly actually stores whatever r0 was—likely 0 in practice because the wrapper
  is a no-op or the call is a query that returns 0 here); the 0xDF40 BG0 control value encodes tile-base block 1,
  screen-base block 0, size 64x64.

  '
