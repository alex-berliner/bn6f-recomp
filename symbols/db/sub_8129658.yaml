name: sub_8129658
address: '0x08129658'
kind: function
status: confirmed
summary: Dispatches the battle AI's current sub-state to one of seven handlers, then fires event 0xE.
interface: "void sub_8129658(void);\n  // uses: r4 r5 r6 r7 r10 in; r5 r8 r9 r10 r11 r12 out\n  // clobbers: r0\
  \ r1 r2 r3 r4 r6 r7 lr, flags nz c v\n"
details: 'Reads the battle-AI object''s current state byte at r5+3 (already pre-shifted

  by 4: legal values 0x00, 0x04, 0x08, 0x0C, 0x10, 0x14, 0x18) and uses it as

  a raw byte index into the handler table at off_8129670 (no LSL applied by

  the `ldr r0,[r0,r1]`). Each entry is a Thumb handler address stored with

  the +1 bit set, jumped to via `mov lr,pc; bx r0`. Handlers receive

  r0 = their own table pointer and r1 = the state id, and return control

  back to this dispatcher. After the handler returns, sub_812B25C is called

  with r0 = 0xE (battle event id 0xE) — the standard "post-state event"

  pattern for this AI family. The seven handlers cover the seven known

  AI sub-states (sub_812968C, sub_81296A0, sub_81296D8,

  battle_object_advanceState3_8129738, sub_8129758, sub_812977C,

  sub_81297C0).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
