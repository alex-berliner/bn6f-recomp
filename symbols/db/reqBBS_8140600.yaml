name: reqBBS_8140600
address: '0x08140600'
kind: function
status: confirmed
summary: No-op stub among the bulletin-board "request" handlers; accepts a request number and returns immediately
  without doing anything.
interface: void reqBBS_noopStub_8140600(void); /* preserves r4-r7, no outputs of its own */
details: 'Body is exactly `push {r4-r7,lr}` / `pop {r4-r7,pc}`: it saves the caller''s r4-r7 and return address,
  then immediately restores them and returns. No register is read or modified, no memory or structure is touched,
  and no flags are set deliberately. It sits in reqBBS.s alongside the other bulletin-board request (BBS) handlers,
  so it is almost certainly a placeholder for a request-board entry that does nothing in the Falzar build (an unimplemented
  or disabled request handler). Callers may still observe r4-r6 passing through unchanged, which is why the register
  contract lists r5 as an output.

  '
