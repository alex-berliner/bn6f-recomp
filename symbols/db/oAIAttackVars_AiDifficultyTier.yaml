name: oAIAttackVars_AiDifficultyTier
address: '0x3'
kind: struct-field
status: probable
summary: Difficulty tier index assigned to the AI attack (set by battle_getAiDifficultyTier_800FE36),
  reused as a table index for attack-parameter lookups and to gate step-machines.
details: 'The field is populated almost exclusively by the return value of `bl battle_getAiDifficultyTier_800FE36`
  followed by `strb r0, [r7,#oAIAttackVars_Unk_03]`, and is then read into r0 and used as an index into
  byte/u16 tables (e.g. `lsl r0, r0, #2`/`#1`/`#2` then `ldrb r0,[table,r0]` or `ldrh r0,[table,r0]`)
  for animation/animation timing parameters (loc_80EB69A, loc_80EB0AA, sub_80EC844, sub_80EBD9C, sub_80EF0E2,
  etc.). A few sites store hardcoded constants (0,1,2,3,4,8,9,0x10,0x11,0x14) which are consistent with
  a small set of attack-mode ids that share the same slot; the getSlashBeastWaveAttackLockonTypeMaybe_80EAF26
  helper reads Unk_03 directly as a table index. All observed uses match the "difficulty tier / mode id
  indexing a lookup table" pattern.'
