summary: 'Battle-intro step of the battle-start state machine: spawns the field/enemy actors, applies
  navi stats, starts the battle BGM, then polls the intro task and hands off to the battle-flow index
  (0x04, or 0x24 when EVENT_1735 is set).'
details: 'Two phases keyed on oBattleState_Unk_03. Phase 0: GetBattleEffects - when bit 0x400 is clear
  copies BattleSettings+5 into Unk_1a, else increments it; battle_spawnType4ObjectWithActiveFlag_80E06F8,
  battle_SpawnEnemyObjects_8007358 (spawns viruses/navi/mystery data from the EnemySetup data), PauseBattle,
  battle_applyNaviStatTableEntry_8014178; BGM song 0x15 when effects bit 0x8 set else BattleSettings+2,
  played unless it equals 0x63 (no music); Unk_03 = 4. Phase 4: when Unk_02 == 0 runs task484_RunFrame_800927C
  and marks Unk_02 = 4; polls battle_getStateUnk5c_800139A bit 2 (lsr #2, bcc); once set: dispatch_801DA48(1),
  eStruct2035280_SetRequestBits_801BECC(1), Index_01 = 4 (0x24 when TestEventFlagFromImmediate(EVENT_1735)),
  and clears Unk_02_03 as a halfword.

  '
