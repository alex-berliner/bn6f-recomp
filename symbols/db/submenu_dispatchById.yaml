name: submenu_dispatchById
address: '0x0812CE28'
kind: function
status: probable
summary: Dispatches a submenu operation using byte 0x0C of the active structure as an index into a four-entry
  handler table.
interface: (r5 = active submenu structure) -> r0, r1, ...; flags preserved
details: Reads the active object's index at offset 0x0C, loads the corresponding Thumb handler from off_812CE40,
  and tail-calls it without setting up further arguments. The four targets are sub_812AC14, sub_812CE50,
  sub_812CEA4, and sub_812CEEC; one known target draws or queues a screen element when its slot is unused.
  The tail call preserves the caller's lr continuation and likely returns through the selected handler.
