name: battle_aiGetVersionedTableEntry_800FE12
address: '0x0800FE12'
kind: function
status: confirmed
summary: Reads a halfword from an AI parameter table indexed by the battle object's AI version, with a special multiplier-scaled
  entry for AI version 4.
interface: u16 battle_aiGetVersionedTableEntry_ADDRESS(const void* table, BattleObject* obj) — r0 = table base,
  r5 = battle object; returns r0 = table value (halfword), r1 = AI data pointer, r2 = version*2 or the multiplier
  byte; flags clobbered
details: 'Loads the battle object''s AI data pointer (oBattleObject_AIDataPtr) and reads its AI version byte (oAIData_Version_16).
  For versions 0-3 the halfword at table[version*2] is returned, so the table holds one u16 per AI version. For
  AI version 4 the entry is instead taken from a fixed slot at table+8 and multiplied by the byte at oAIData_Unk_0c,
  allowing a per-enemy scaling factor for that AI tier. R1 and R2 are also returned to callers (AI data pointer
  and the index/multiplier), suggesting the caller continues working with the AI data afterwards. Likely used when
  initializing or tuning enemy AI behavior from version-dependent parameter tables.

  '
