name: battle_spawnDimRegionFromParams
address: '0x080E9F9C'
kind: function
status: probable
summary: Battle-object handler that spawns a dimming collision-region object using the object's own parameter
  fields.
interface: (r5 = battle object ptr, implicit) -> r0 = object; no return value used
details: Reads oBattleObject_Param1, Param2, Element, and Damage from the battle object in r5, then calls
  object_spawnDimmingCollisionRegion with r3=0, r4=0xB05FF01 (constant argument word, likely a sprite/behavior
  descriptor), r6=Damage, r7=0. It is a thin parameter-marshaling wrapper — no logic of its own — so the
  object's stored fields become the collision region's position/size/damage inputs. The damage field is
  forwarded, meaning the spawned region deals the object's configured damage while dimming.
