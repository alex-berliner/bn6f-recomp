name: ai_initBossAttack2PanelTarget
address: '0x080F5AA0'
kind: function
status: probable
summary: 'Initializes one boss AI attack mode: reads the difficulty tier, loads attack 2''s damage pair,
  installs the panel-choose/state handlers, and targets the opposing player before entering attack state
  0xb.'
interface: (r5 = boss BattleObject, r7 = boss AIAttackVars struct) -> r0 = destroyed; writes tier, init
  flag, callbacks, param and target into the AI attack vars
details: 'The routine reads the AI difficulty tier (only meaningful for AI data version 4) and stores
  it into oAIAttackVars_AiDifficultyTier, then sets InitFlag to 3 to mark this attack setup as done. It
  loads the damage word pair for boss attack index 2 via ai_loadBossAttackDamagePair. Two function pointers
  are installed: a panel-choose callback (sub_80F61B6) into PanelChooseCallback and another handler (sub_80F61E4)
  into ScratchVar, implying the attack depends on panel selection. It stores r5+0x60 (a sub-structure
  of the boss object, likely its attack/panel data block) as AiAttackParam, resolves the opposing-side
  player via battle_findPlayer(alliance^1) into TargetObjectPtr, and finally starts attack state 0xb through
  object_setAttack0.'
