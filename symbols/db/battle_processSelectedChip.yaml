name: battle_processSelectedChip
address: '0x0802E2C4'
kind: function
status: probable
summary: Per-battle-entity updater that waits out the selected chip's use delay and then either fires
  it (player side, with denial sound on failure) or queues it (non-player side after a 0x1500-frame wait),
  writing chip state at +0x24/+0x26/+0x28/+0x2A and +2/+4/+5.
interface: (r0 = battle side/entity index) -> r0 = varies (0/0xff/queued chip via callees); writes selected-chip
  state to the side's entry at 0x2036120 (+0x24 selected, +0x26 prev, +0x28 timer, +0x2A queued chip)
details: 'Fetches the side''s entry via getEntryPtr_2036120_1D0_802E070; if the active byte is clear it
  only calls sub_802E790. Computes the selected chip id with sub_802E558, masks it to 9 bits (0x1FF) into
  entry+0x24, and aborts when battle_isPaused, battle_isTimeStop or battle_isBattleOver say so. If entry+0x50
  is zero it waits [entry+0x28] frames against a threshold from byte_802E430 indexed by 2*(chip+9 bit0x20
  ? chip+9 : chip+7), then tries sub_802E82A (0xFF = fail) or sub_802E62A; if this side is the player
  side (battle state oBattleState_PlayerSide == r0) it plays a denial sound or calls sub_801EC44 on failure.
  Otherwise (flag set) after 0x1500 counts it calls sub_802E5FC and sub_8029514 (with battle_networkInvert
  applied) storing the queued chip at +0x2A and bytes at +4/+5, zeroing the timer, or sets entry+2 = 0xB4
  on failure. Tail always copies +0x24 into +0x26 (previous selection) and calls sub_802E790.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/tst on entry byte then getChip8021DA8 on [entry+0x24] shows it acts on a chip id held in
    the side entry; 0x1FF mask and chip-database lookup + byte_802E430 halfword thresholds (0x15/0x2A/0x40)
    show a per-chip wait before use; cmp r0, oBattleState_PlayerSide with PlaySoundEffect(SOUND_CANT_JACK_IN)/sub_801EC44
    only on the player side; battle_isPaused/isTimeStop/isBattleOver guards confirm this runs inside the
    battle update loop; [entry+0x26] = [entry+0x24] tail tracks the previous selected chip for change
    detection
  refs:
  - bn6f/asm/asm03_0.s:17362
  - 0x080005CC PlaySoundEffect
  - 0x0800A18E battle_isBattleOver
  - 0x0800A03C battle_isPaused
  reproduce: python3 tools/asmcat.py 0x0802E2C4
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The summary''s callee name is wrong: the code calls sub_802E830 (not sub_802E82A) at loc_802E396
