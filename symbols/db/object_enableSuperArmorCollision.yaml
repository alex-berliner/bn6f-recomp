name: object_enableSuperArmorCollision
address: '0x08014640'
kind: function
status: probable
summary: Enables super armor on the current battle object and refreshes its collision state.
interface: (r0 = current battle object) -> r0 = unspecified; flags may be modified by the collision refresh
  callee
details: Sets the current object's ObjectFlags1 super-armor bit through object_setFlag1, then invokes
  the collision rebuild/resolution routine. The function takes no explicit object argument because the
  callees obtain the current battle object from shared global state.
