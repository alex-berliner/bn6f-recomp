name: sub_80C0D98
address: '0x080C0D98'
kind: function
status: confirmed
summary: Spawns a dimming (type 3) collision region attached to the battle object, using its damage/stamina damage
  counter as the region index.
interface: void sub_80C0D98(r0 baseX, r1 baseY, r5 battleObject); preserves r5; clobbers r0-r4,r6-r7,lr,nzcv
details: "Thin wrapper that hard-codes parameters for a \"dimming\" collision region and delegates\nto object_spawnDimmingCollisionRegion.\n\
  - r2 = 0 (Z coordinate of the region)\n- r3 = 0x14 << 16 (world Y offset 0x140000, i.e. 0x14.0 cells down from\
  \ the anchor)\n- r4 = 0x04050001 (object/tile + palette attribute for the dimming region sprite)\n- r6 = [r5 +\
  \ oBattleObject_DamageAndStaminaDamageCounterDisabler] (reused as the\n  collision region ID; interesting because\
  \ it is the same field that disables the\n  damage/stamina counter, suggesting this region is tied to a counter-style\
  \ effect\n  such as a \"broken\" / countered hit indicator rather than a generic hitbox)\n- r7 = 3 (region type\
  \ = dimming)\nThe caller's XY in r0/r1 are passed through to the spawn routine, so this positions\nthe dimming\
  \ region at the supplied battle coordinates on the object r5. r5 is\npreserved (pushed/popped via lr) so callers\
  \ can continue to use the battle object.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
