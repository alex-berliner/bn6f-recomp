name: battle_spawnNaviSprite
address: '0x080BCB74'
kind: function
status: probable
summary: Loads and initializes the sprite for a battle object from its related navi object (navi id or
  arm-part record), then puts it into the normal update state.
interface: (r5 = battle object, r4 = its RelatedObject1Ptr read inside) -> r0 = clobbered; sets CurAnim=0,
  CurAnimCopy=0xFF, object flag bit1, copies offset-0x34 fields, palette, flip, and CurState=CUR_STATE_UPDATE
details: Reads the related object's NameID and, if the unpacked actor type is 2 (a navi), looks up chip-class
  data from its NaviStats bytes 0x2C/0x29; otherwise resolves an arm/part position via enemy_getArmPosition.
  Those values plus 0x80 are passed to sprite_load and sprite_loadAnimationData to attach graphics to
  the object. It then resets CurAnim, sets the sprite-visible/update flag (bit 1) in oObjectHeader_Flags,
  copies 12 bytes at offset 0x34 (world position) from the related object to this one and recomputes panel
  coords, picks and applies the navi palette from the Navi stats, applies horizontal flip, sets CurStateActionPhase
  to CUR_STATE_UPDATE, and finishes via sub_80BCC0C. Effectively this is the 'give this battle object
  its navi sprite and start updating it' step; no caller is known so the r5-passed convention is inferred
  from register use.
