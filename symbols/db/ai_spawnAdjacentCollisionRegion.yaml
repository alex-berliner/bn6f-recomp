name: ai_spawnAdjacentCollisionRegion
address: '0x080F0B80'
kind: function
status: probable
summary: Spawns a collision region at the panel adjacent in the object's facing direction, using parameters
  (init flag, damage, packed region bytes, and flag word) sourced from the AI attack vars struct.
interface: (r0/r4-r7 loaded from oAIAttackVars in r5/r7 context) -> r0 = spawned region object from object_spawnCollisionRegion;
  flags from callee
details: 'Reads the ±1 facing step from object_getEnemyDirection for the object at r5, adds it to oBattleObject_PanelX
  to get the adjacent panel, and uses oBattleObject_PanelY unchanged. It fills object_spawnCollisionRegion''s
  argument registers from the oAIAttackVars block: r2 = oAIAttackVars_InitFlag, r3 = 0, r6 = oAIAttackVars_Damage,
  plus two literals — r4 = 0x7050304 (packed region parameters, likely element/type/attribute bytes) and
  r7 = 0x1001 (likely flags/lifetime packing). It is a thin wrapper that materializes the AI''s queued
  melee-style attack on the neighboring panel and returns the callee''s result.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_getEnemyDirection; add r0, r0, [r5,#oBattleObject_PanelX] — target panel is one step
    in the object's facing direction; ldrb r2, [r7,#oAIAttackVars_InitFlag] and ldr r6, [r7,#oAIAttackVars_Damage]
    — attack parameters come from the AI attack variable block; r4 = 0x7050304 and r7 = 0x1001 literals
    are fixed region descriptor constants passed straight through; single bl object_spawnCollisionRegion
    with pop {pc} — pure wrapper, no post-processing
  refs:
  - bn6f/asm/asm31.s:123108
  - 0x080F0A7A sub_80F0A7A
  - 0x0800E2C0 object_getEnemyDirection
  - 0x080C536A object_spawnCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080F0B80
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches: it loads the facing step from object_getEnemyDirection, adds it to oBattleObject_PanelX,
    keeps PanelY, reads InitFlag/Damage from oAIAttackVars (r7), and calls object_spawnCollisionRegion
    with the two literals. However, the function does not just ''spawn a hitbox on the adjacent panel''
    — it spawns a collision region whose coordinates are explicitly computed as the facing-adjacent panel,
    so a name that conveys ''spawn collision region at facing-adjacent panel from AI attack vars'' is
    more accurate than ai_spawnAdjacentPanelAttack.; run wf investigate investigate-20261019-003606; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
