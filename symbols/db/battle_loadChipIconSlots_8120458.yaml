open_questions:
- Exact semantics of r3 (`altCode` / element variant offset) and how callers pick it; the
- chip-record byte scan only goes 0..2, so likely uses index within first 3 fields of the
- chip entry (probably element/types).
- The 0x1c halfword's upper bit may be a broader "filled" flag and the low 7 bits a packed
- chip ID with element code, not a literal chip database index. Naming the helper
- '"loadChipIconSlots" is consistent with the assembly but the precise struct/field meaning'
- rests on the battle-object struct's 0x1c being a chip-icon descriptor.
