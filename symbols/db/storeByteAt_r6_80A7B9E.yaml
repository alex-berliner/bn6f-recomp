name: storeByteAt_r6_80A7B9E
address: '0x080A7B9E'
kind: function
status: confirmed
summary: One-byte setter helper — stores the byte in r0 to the address held in r6 and returns.
interface: void sub_80A7B9E(u8 value /* r0 */, void* dest /* r6 */)
details: 'A two-instruction helper: STRB r0,[r6] then return. The destination is passed in the unusual
  r6 slot (callers must have set up r6 beforehand, likely as a pointer to an object/state struct base),
  while the value comes in r0. No flags are defined by the store. Nothing is preserved or clobbered beyond
  the store itself. Since it is a bare byte store with no context, the game-level meaning depends entirely
  on what r6 points to at each call site; no struct field can be attributed from this function alone.

  '
