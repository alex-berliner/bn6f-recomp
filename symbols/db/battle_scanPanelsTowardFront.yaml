name: battle_scanPanelsTowardFront
address: '0x0800F436'
kind: function
status: probable
summary: Ray-casts along the battle object's facing direction until a panel whose status flags match a
  mask is found, or it walks off the field.
interface: (r0 = starting column, r1 = row, r2 = panel-status mask) -> r0 = 1 if a matching panel was
  hit, 0 if the scan left the 6x3 grid; sets flags via tst/cmp
details: Fetches the caller's +1/-1 front direction via object_getFrontDirection, then repeatedly advances
  the column by that step while keeping the row fixed. Each iteration validates the (column,row) with
  object_isValidPanel; if off the grid it returns 0. Otherwise it reads the panel's status flags via object_getPanelParameters
  and tst's them against the mask stored on the stack; any matching bit stops the loop and returns 1.
  The mask is kept in stack slot [sp] because r2 must be preserved across calls. Effectively a line-of-sight/panel-property
  probe in front of an object (e.g. searching for hole/broken/occupied panels ahead).
