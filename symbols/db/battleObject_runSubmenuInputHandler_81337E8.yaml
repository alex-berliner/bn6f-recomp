summary: Per-frame input/state dispatcher for the in-battle custom-screen submenu (handles B/START/A/SELECT/LR/dpad,
  folder-edit quit, submenu BG clear, and runs the two row-align/tile-upload helpers plus AI turn-handler
  steps 5/6).
interface: '(r5 = sSubmenu/this battle object, r10 = Toolkit, r2 = ?, r4 / lr saved) -> r0 = 0x40 ; side
  effects: writes sSubmenu.unk_02/unk_1B/obj+1/obj+2, runs script 0x17, plays SFX, dispatches into chatbox_*/folder-edit/object_saveState/BG/AI
  helpers.'
details: '1. Calls submenu_isOpen_81355D8; if no submenu is open, branches to loc_813381E to try B-cancel
  (sub_8133BB4), START/B-cancel (sub_8133C0C), and A-confirm in folder edit (folderEdit_AConfirmPress_8134A3C).

  2. If a submenu is open, loads sSubmenu pointer from off_8133888, checks sSubmenu+0x2 == 0x24 (custom-screen
  mode) or bit 0x40 of sSubmenu+0x1B; both jump to the rendering/AI tail (loc_8133864). Otherwise tests
  IsButtonPressed(START|B|A).

  3. On START/B/A press, stores 0x10 at obj+1 and 0 at obj+2, runs chatbox script 0x17, plays SOUND_UNSELECT_7B,
  and falls through to the tail.

  4. Falls back through chatbox_selectPress_8133C58, then reads LowSensitivityHeld from the Toolkit JoypadPtr
  and calls menu_adjustCursorOrValue_811F7F8 (mask 7, min 0, max 0).

  5. Tail (loc_8133864) always runs: battleObject_submenuRenderFolderAndChips_81341A0, submenu_clearBgIfClosed_8134594,
  object_resolveTableEntryByIndex_8134538, battleObject_alignRowOffsetCheckSN3_81353DC, then battle_aiRunTurnHandler_81353F0(5,0)
  and (6,1).

  6. Captured calls show consistent r0=0x40 on exit (the function is `void`-like to callers, no useful
  r0 returned; r0=0x40 here appears to be a passthrough from the last BL into r0).

  '
