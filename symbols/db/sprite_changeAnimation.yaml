name: sprite_changeAnimation
address: '0x080A8CB8'
kind: function
status: probable
summary: Changes an object's sprite animation to a new index, reloading animation data only when the index
  actually differs from the current one.
interface: (r0 = new animation index; r5 = sprite slot pointer) -> r0 = undefined; no flags
details: Reads the slot's current animation index from byte 7 and, if it equals r0, does nothing (keeps
  the slot's cached state in sync with the sprite system's slot+0). Otherwise writes r0 into slot+7, calls
  sprite_setAnimation to store the index in the slot's first byte, and calls sprite_loadAnimationData
  to (re)load the animation's frame data. Byte 7 thus acts as a shadow copy of the active animation used
  to skip redundant reloads.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r5,#7]; cmp r0,r1; beq skip — early-out when index unchanged (sub_80A8CB8:2-4); strb
    r0,[r5,#7] before sprite_setAnimation — byte 7 mirrors the animation index written to slot+0; sprite_loadAnimationData
    is only called on the changed path, consistent with reloading frame data for a new animation; callers
    sub_80A8B4C and sub_80A8BBC sit alongside this sprite-slot code, consistent with animation selection
    for objects
