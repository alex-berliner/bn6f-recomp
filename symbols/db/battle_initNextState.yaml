name: battle_initNextState
address: '0x08007F2C'
kind: function
status: probable
summary: Waits for the screen fade to clear, then stops the battle BGM, frees type-0x1A objects, and writes
  oBattleState_Index_00=8 / oBattleState_Index_01=4 with a zeroed phase field to defer into the next battle
  state.
interface: (r0 = unused/scratch, r5 = battle state struct pointer set by caller) -> r0 = clobbered; sets
  battle state fields, no meaningful return
details: Waits until IsScreenFadeActive reports no fade in progress, then calls the music routine that
  switches the driver state and marks BGM off, and frees all objects of type 0x1A. It then writes oBattleState_Index_00
  = 8 and oBattleState_Index_01 = 4 and zeroes oBattleState_StatePhaseAndInitFlag, effectively queueing
  the next battle state (via battle_main_8007800 / battle_state_tick_8007CA0) with a fresh phase counter.
  The r5 base is never set inside the function, so the caller must place the battle state struct there.
  The early return keeps everything deferred while a fade is still running.
