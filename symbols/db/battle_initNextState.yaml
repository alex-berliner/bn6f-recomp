    one object category; strb #8/[r5,oBattleState_Index_00] and strb #4/[r5,oBattleState_Index_01] set
    the state IDs the battle main loop dispatches on; strh #0/[r5,oBattleState_StatePhaseAndInitFlag]
    resets the phase/init field of the same struct'
