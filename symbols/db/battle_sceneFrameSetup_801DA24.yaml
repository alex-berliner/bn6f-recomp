name: battle_sceneFrameSetup_801DA24
address: '0x0801DA24'
kind: function
status: confirmed
summary: Per-frame battle-scene setup — queues the battle scene's graphics transfers, sets a render-info value,
  and refreshes the stored player battle object pointer.
interface: void sub_801DA24(void); /* r10 = toolkit base in, clobbers r0-r2, lr; no meaningful outputs (c/v flag
  residue only) */
details: 'Runs each frame while the battle scene is active. Reads the render-info pointer from the toolkit (r10
  + oToolkit_RenderInfoPtr) and writes the halfword 0x1F09 to oRenderInfo_Unk_0a, likely a scene/render mode or
  screen-state selector for the battle view. Then calls QueueGFXTransfersInList on the dataList at off_801ECB4,
  registering the battle scene''s tile/sprite graphics for VRAM transfer. Finally calls battle_preUpdateAndGetPlayerObject_80103EC,
  which performs the player object''s pre-update step and returns its object pointer; that pointer is stored into
  the battle state struct at eStruct2035280 + 0x48 (dword_20352C8), where the rest of the battle code presumably
  reads the current player battle object. No arguments are taken; the toolkit base is expected in r10 per the engine''s
  calling convention.

  '
