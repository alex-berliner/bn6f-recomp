name: sub_8123300
address: '0x08123300'
kind: function
status: confirmed
summary: Decompresses the current PET Navi's LZ77-compressed tile graphic into a destination buffer, using a per-Navi
  bank offset.
interface: void sub_8123300(u32 r0 /* bank_table */, u32 r1 /* dest_buf */, u32 r2 /* out_buf */); clobbers r0,
  r2, r3, lr, flags; preserves r1 (and is reloaded into r1 from the stack); r7 is scratch; r4 is unused but preserved.
details: 'Selects a bank index: by default 0x30, or (GetCurPETNavi() << 2) when sub_8123360() returns non-zero

  (so the offset is per-Navi in multiples of 4 bytes). Treats the input r0 as a table of LZ77

  source pointers; loads bank_table[bank_index] and calls SWI_LZ77UnCompReadNormalWrite8bit to

  decompress it into out_buf. After decompression, reads the 32-bit LZ77 header at out_buf,

  computes a payload size of "(header_word >> 8) - 4", and bulk-copies that many bytes from

  out_buf+4 into dest_buf, picking the widest legal copy unit by testing the size''s low bits:

  bit0 -> CopyBytes, bit1 -> CopyHalfwords, bits0-4 -> CopyWords, else CopyByEightWords.

  r1 and r2 are spilled to the stack and restored so they pass through unchanged to the caller.

  r4 is preserved (never written); r7 is used as a scratch for the bank index and the literal

  0x30 is loaded into it before the call.

  '
