name: navicust_handlePlacementCursorInput
address: '0x0813612C'
kind: function
status: probable
summary: 'Navi Customizer part-placement screen: per-frame input handler that confirms/cancels, rotates
  the held part, and moves the board cursor.'
interface: (r0 = toolkit?, r5 = naviCust screen state struct) -> r0 = destroyed; updates cursor/rotation
  fields and plays menu sounds
details: 'Reads the joypad via the toolkit''s JoypadPtr: A (key 1) calls navicust_confirmPartPlacement,
  B (key 2) calls sub_813640C (likely cancel/back). Held R/L (0x100/0x200) bump the byte at [r5+0xE] mod
  4 — the rotation of the part being placed — via sub_813B928/sub_813B920 and call sub_8136384. Direction
  keys scroll positions: Up/Down (0xC0) adjust halfword [r5+0x2C] and Left/Right (0x30) adjust [r5+0x28],
  each wrapping between a paired halfword (0x2E/0x2A) and limits supplied by sub_813633C/sub_8136318 from
  byte_8136210[[r5+0xF]*2], a per-entry pair {6/7, 6/7} of board dimensions selected by [r5+0xF]. Each
  successful move or rotation plays SOUND_MENU_CUR_MOVE. The current/previous halfword pairs (0x28/0x2A,
  0x2C/0x2E) are compared so no-ops don''t replay the sound.'
