name: cleareMemory_802FF2C
address: '0x0802FF2C'
kind: function
status: confirmed
summary: Resets a global state word to 0 and zeroes a 0x180-byte work buffer, likely preparing shared game/battle
  scratch state for reuse.
interface: void state_resetAndClearBuffer(void); // r2/r3 preserved, r0/r1/lr clobbered, flags whatever ZeroFillByEightWords
  leaves
details: 'Zeroes the 32-bit global dword_2009A2C (EWRAM), then zeroes 0x180 (384) bytes starting at word_200A6F0
  (EWRAM) via ZeroFillByEightWords, which clears memory in eight-word (32-byte) chunks. No arguments are used; the
  function ignores the incoming r2/r3 (callers happen to pass them, and the routine preserves them). The two globals
  are presumably adjacent parts of one state block: a scalar state/counter field at 0x2009A2C followed by a 384-byte
  buffer at 0x200A6F0. The original label "cleareMemory" (sic) suggests it was already understood as a memory-clearing
  init/reset routine. Caller-side register analysis shows only lr is meaningfully consumed, so it behaves as a plain
  void(void) call.

  '
