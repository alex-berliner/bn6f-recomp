name: ai_attackStepHighlightFrontPanel_8115492
address: '0x08115492'
kind: function
status: confirmed
summary: Advances an enemy AI attack-step counter every tick and, on the attacking steps (3 of every 8), highlights
  the panel directly in front of the battle object.
interface: void sub_8115492(r5 battleObject, r7 aiAttackVars) -> r1 (status from the highlight call, or 4 on off-steps);
  r5 returned from highlightPanelIfSomeCondition_8109660 on the attacking path
details: 'r5 is a battle object and r7 its AI attack variable block. Increments the byte at

  oAIAttackVars_AttackStepIndex and stores it back; if the new counter has bit 2 set

  (step & 4 != 0), it returns immediately with r1 = 4 (the leftover test mask), so the

  attack only runs on 4 of every 8 steps of the counter. On attacking steps it calls

  object_getFrontDirection (r5 passes through) to get the direction in front of the

  object, then builds a target panel: x = frontDirection + oBattleObject_FuturePanelX,

  y = oBattleObject_PanelY, side = oBattleObject_Alliance XOR oBattleObject_DirectionFlip.

  Passes these with r2 = oAIAttackVars_AiAttackParam (appearance/parameter block for the

  highlight) into highlightPanelIfSomeCondition_8109660, which marks/telegraphs the panel

  in front of the enemy before an attack lands there. This is a typical boss/enemy AI

  attack-script step: one entry in an AI attack routine that telegraphs a front panel hit.

  r4-r7 preserved; nzcv and r0/r2/r3/lr clobbered. The odd r5 output comes from the

  highlight callee leaving its own r5 in place; on the early-exit path r5 is unchanged.

  '
