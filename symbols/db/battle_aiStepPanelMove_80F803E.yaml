name: battle_aiStepPanelMove_80F803E
address: '0x080F803E'
kind: function
status: confirmed
summary: 'Per-frame step handler for an AI enemy''s panel-move attack: on first call it initiates the
  panel traversal animation, on subsequent calls it ticks a cooldown timer and transitions to the hit
  state when it expires.'
interface: u32 battle_aiStepPanelMove_80F803E(/* r5 */ BattleObject *obj, /* r7 */ AIAttackVars *ai, /*
  r1 */ u32 r1_in); // returns r1_out; clobbers r0 r2 r3, flags; preserves r4 r6
details: 'Two-phase state machine keyed on ai->AttackElement. Phase 1 (AttackElement==0, first entry):
  sets AttackElement to 4, switches obj->CurAnim to 3 (the walk/step animation), releases the panel reservation
  at the current (PanelX, PanelY), copies FuturePanelX/Y into the active panel fields, releases the reservation
  at the destination panel, recomputes screen coordinates and collision boxes, clears flag bit 0x40 (movement-pending),
  sets OBJECT_FLAGS_CURRENTLY_MOVING_1, clears bit 0x16, then seeds ai->StepTimer to 8 so the move animates
  for 8 frames. Phase 2 (AttackElement!=0, subsequent entries): decrements the 16-bit StepTimer; when
  it reaches 0 the function writes 0x1C into ai->HitElement, advancing the AI attack chain to the next
  (hit) element. The r1 register passes through the last object_clearFlag return value on the kickoff
  path or is returned unchanged on the tick path. Structs touched: BattleObject (PanelX, PanelY, FuturePanelX,
  FuturePanelY, CurAnim, object flags), AIAttackVars (AttackElement, StepTimer, HitElement).'
