name: battle_drawCardToHand_800FC7C
address: '0x0800FC7C'
kind: function
status: confirmed
summary: Draws the next card from an alliance's deck into its battle hand during card selection, stopping at a full
  hand or an empty deck.
interface: void battle_drawCardToHand_800FC7C(BattleObject* obj /* r5 */); leaves r1 = next card id (or 0xFFFF),
  r2 = 0xFFFF deck-end marker, r3 = hand address; sets c/v per the final CMP (hand count vs 5, card vs 0xFFFF) or
  ADD (count+1), clobbers r0 and nz flags
details: Reads the battle object's oBattleObject_Alliance byte and uses it to fetch the hand/deck buffer via getBattleHandAddr_8010018.
  The buffer layout is a byte card count at offset 0 followed by 2-byte card slots starting at offset 2. If the
  count is already >= 5 the function returns without changes (hand is full). Otherwise it reads the 2-byte card
  id at hand[count*2+2]; if that value is 0xFFFF (deck exhausted / end marker) it also returns unchanged. Otherwise
  it increments the count byte, effectively adding that card to the hand. Values of 0xFFFF in a slot act as the
  deck-empty sentinel, and 5 is the hand-size limit for card selection.
