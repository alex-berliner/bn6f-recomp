name: eT1BattleObject0_HP
address: '0x0203A9D4'
kind: ram
previous_names: []
status: confirmed
summary: MegaMan's current HP in a battle (u16, eT1BattleObject0 + 0x24, oBattleObject_HP); the HP box shows a copy
  of it (eStruct2035280+0x24) taken on hits and heals.
details: 'Object 0 of eT1BattleObjects is MegaMan. Damage and healing change this field and then copy it to the
  HP box''s shown value (battle_eStruct2035280_postEvent_801E0A0 / sub_801E0BC read it through eStruct2035280+0x48),
  so a write here alone does not change the box until the next hit or heal; it takes the hits that follow from the
  written value (vidsync: 170 written became 120 after a 50-damage hit 8 frames later). HP carries over after the
  battle.

  '
