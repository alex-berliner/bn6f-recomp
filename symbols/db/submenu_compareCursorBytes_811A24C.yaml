name: submenu_compareCursorBytes_811A24C
address: '0x0811A24C'
kind: function
status: confirmed
summary: Submenu helper that tests the menu object's state byte and, unless it is in state 2 or 3, compares the
  sSubmenu struct's two cursor bytes (unk_0E vs unk_0F) so the caller can branch on the result.
interface: 'void sub_811A24C(menu /*r5*/) // inputs: r5 (menu object), lr; outputs: flags NZCV from the final CMP,
  r6 = &sSubmenu (when state is not 2/3); clobbers r0, r1; callers branch on returned flags'
details: 'Reads the menu object''s state byte at [r5+5]. If the state is 2 or 3 the function returns

  immediately with flags set from CMP state,#2 / CMP state,#3 (Z set in either case, so both

  states look "equal" to a caller branching on EQ), and r6 is left untouched. For any other

  state it loads the sSubmenu struct address into r6, reads its byte fields unk_0E and unk_0F

  (the submenu''s cursor/selection pair), and compares them, leaving NZCV from CMP unk_0E,unk_0F

  for the caller''s follow-up conditional branch. It is a pure flag-producing dispatcher hook:

  no memory is written and nothing else in sSubmenu is touched. The quirks to note are the

  dual exit paths with different flag semantics (state-equality vs cursor-equality) and that

  r6 is only conditionally loaded, which callers must respect.

  '
