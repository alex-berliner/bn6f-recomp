name: object_updateRelatedPosition
address: '0x080D1934'
kind: function
status: probable
summary: Per-frame update that removes its collision data and spawns a collision effect, then either mirrors
  its related object's position (copying offset 0x34, re-deriving panels, and refreshing collision) or
  tears down and enters CUR_STATE_DESTROY if the battle ended, the related object's CurAction changed,
  or its own panel is invalid.
interface: (r5 = battle object pointer, no args in r0-r3) -> r0 = clobbered; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY on teardown paths
details: 'The routine tears down the object''s old collision data, spawns a collision effect, and exits
  to destroy state if the battle is over or the related object''s CurAction no longer matches a value
  stored in the object''s ExtraVars+8 (owner died/changed action). It then tests the related object''s
  collision flags against an alliance-indexed mask table (byte_80D19B8: 0x05800000 for alliance 0, 0x0A800000
  for alliance 1); if hit and Param3 is nonzero, it clears its collision region (gets shoved out of the
  way). Otherwise it copies the three words at offset 0x34 of the related object (position/panel coordinates)
  into itself, re-derives its panel from PanelX/Y via object_setPanelsFromCoordinates and object_updateCollisionPanels,
  sets collision region 1 if the panel actually changed, and refreshes collision state with object_presentCollisionData.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb CurAction of [r5,#oBattleObject_RelatedObject1Ptr] compared against [r5,#oBattleObject_ExtraVars+8]
    gates destruction (action-mismatch check); off_80D19B4/byte_80D19B8 is a per-alliance mask (0x05800000
    / 0x0A800000) tested against oCollisionData_FlagsFromCollision before clearing the region; ldmia/stmia
    of 3 words from relatedObject+0x34 to this object+0x34 copies position fields, followed by object_setPanelsFromCoordinates;
    object_setCollisionRegion(1) is only called when PanelX/Y changed, then object_presentCollisionData
    refreshes collision; fallthrough paths call object_clearCollisionRegion and store CUR_STATE_DESTROY,
    i.e. self-destruct
  refs:
  - bn6f/asm/asm31.s:55544
  - 0x0800A18E battle_isBattleOver
  - 0x0801A074 object_clearCollisionRegion
  - 0x0800CC72 object_isValidPanel
  reproduce: python3 tools/asmcat.py 0x080D1934
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s flow matches well: copies the 3 words at offset 0x34 of the related object into
    self, uses collision mask table byte_80D19B8 indexed by alliance, and destroys when battle is over
    or the related object''s CurAction no longer matches the stored value. However, the teardown path
    at loc_80D19A8 calls object_clearCollisionRegion (matching), and Param3 nonzero triggers clearing
    the collision region (not ''gets shoved out of the way'' — it simply tears down collision). Minor
    wording aside, the core mechanics align, but object_spawnCollisionEffect is called unconditionally
    each frame which is a notable behavior the summary omits.; run wf investigate investigate-20261018-223614;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- No callers are known, so which entity uses this (e.g. an object glued to its shooter vs a pushed cube)
  is unconfirmed
- The exact meaning of the collision-flag mask bits in byte_80D19B8 and of oBattleObject_Param3 is not
  established
- 'The proposal''s flow matches well: copies the 3 words at offset 0x34 of the related object into self,
  uses collision mask table byte_80D19B8 indexed by alliance, and destroys when battle is over or the
  related object''s CurAction no longer matches the stored value. However, the teardown path at loc_80D19A8
  calls object_clearCollisionRegion (matching), and Param3 nonzero triggers clearing the collision region
  (not ''gets shoved out of the way'' — it simply tears down collision). Minor wording aside, the core
  mechanics align, but object_spawnCollisionEffect is called unconditionally each frame which is a notable
  behavior the summary omits.'
