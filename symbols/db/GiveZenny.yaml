name: GiveZenny
address: '0x0803CFF8'
kind: function
status: probable
summary: Adds zenny to the player's wallet (max 999999), preserving an encrypted/parallel copy.
interface: '/* r0 = s32 amount (zenny to add), r10 = Toolkit* ptr */

  /* returns r0: 0 = added normally, 1 = already at max or integrity check failed, 2 = clamped to max */

  u32 GiveZenny(u32 amount, u32 toolkit_ptr);

  /* clobbers nz c v; preserves r4-r7 via push/pop */

  '
details: 'Validates a zenny "encryption"/integrity check by calling encryption_zenny_8006f78; if it

  fails (Z not set after the call) the function returns 1 immediately without touching the

  wallet. Otherwise it reads the current zenny from GameState->ProtectedZenny

  (oToolkit_GameStatePtr -> oGameState_ProtectedZenny). If the wallet is already exactly

  MAX_ZENNY (999999), it returns 1. Otherwise it adds the requested amount; if the result

  exceeds 999999 (signed comparison: `cmp r1, r4 / ble` after sign-extending via signed

  add), it clamps to 999999 and returns 2. The new total is stored back into

  oGameState_ProtectedZenny, then encryption_zenny_8006f54 is invoked with r0 = status,

  r1 = new_zenny, r2 = game_state_ptr, r3 = status, r4 = MAX_ZENNY to refresh the

  encrypted zenny blob (r4 is preserved across that call thanks to the push/pop wrapper).

  The "ProtectedZenny" field on GameState appears to be the in-RAM wallet mirror whose

  encryption is kept in sync by the two encryption_zenny_* helpers.

  '
