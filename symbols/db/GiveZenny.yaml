name: GiveZenny
address: '0x0803CFF8'
kind: function
status: confirmed
summary: Adds the given amount of Zenny to the player's wallet (encrypted), capping at 999999 and returning a status
  code.
interface: u32 giveZenny_803CFF8(s32 amount /* r0 */);  // returns 0=ok, 1=cheat-detected or already full, 2=overflow
  capped; clobbers r0-r3, lr; preserves r4-r7; needs r10 = toolkit pointer
details: "Verifies the encrypted wallet's checksum via encryption_zenny_8006f78; if it fails, returns 1 with no\
  \ write.\nOtherwise reads the current (encrypted) Zenny from oGameState_ProtectedZenny (reached via oToolkit_GameStatePtr\n\
  on the toolkit in r10) and compares against the constant 999999:\n  - already == 999999: r3 (status) = 1, no change\
  \ to amount\n  - else add r0 to current; if the signed result exceeds 999999, clamp to 999999 and r3 (status)\
  \ = 2\n  - otherwise r3 (status) = 0\nStores the (possibly clamped) value back to oGameState_ProtectedZenny, then\
  \ re-encrypts the wallet\nvia encryption_zenny_8006f54 passing (status, zenny, gameState, status, 999999) in r0-r4.\
  \ The two\npaths return through the same pop {r4-r7, pc}; r4-r7 are preserved across the call.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
