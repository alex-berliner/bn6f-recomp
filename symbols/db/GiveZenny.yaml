open_questions:
- What is the exact layout/encoding of the "encrypted zenny" blob that encryption_zenny_8006f78 validates and 8006f54
  rewrites?
- Why are both r0 and r3 passed as the status code (and r2 as the game_state pointer) to encryption_zenny_8006f54?
- The signed `ble` after `add r1, r1, r0` suggests `amount` is treated as signed even though MAX_ZENNY is unsigned;
  can the caller ever pass a negative amount?
