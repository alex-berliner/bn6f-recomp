name: navicust_loadSelectedPartInfo
address: '0x0813658C'
kind: function
status: probable
summary: In the Navi Customizer, looks up the part occupying the cell at struct+0x28/+0x2c, copies its
  width/height and palette bytes into the screen state, rebuilds the parts list, redraws the board, and
  sets byte +2=0x20 (next state) and byte +0x10=1.
interface: (r0 = unused on entry; r5 = NaviCust screen-state struct with cursor coords at +0x28/+0x2c)
  -> r0 = clobbered; updates struct fields +0xe, +0x10, +0x14, +0x28, +0x2c, +0x38, +0x3a, +0x3c, +0x3e
  and byte +2
details: Takes the halfwords at struct+0x28 and +0x2c (board cell x/y or cell index fields) and calls
  battle_checkItemFlagFor_813B9B4 to look up the part placed there in the toolkit array at 0x200414c;
  result-1 indexes the 8-byte part-entry array behind toolkit_getUnk2004190EntryPtr_813B9FC. From that
  entry it copies field+3 into +0x28/+0x3c, field+4 into +0x2c/+0x3e (likely part width/height), field+6
  into +0x14 and field+5 into +0xe (likely colors), keeping the original cell value in r6. It then calls
  sub_813B9C4/sub_813BA48 with the part index, forces a board redraw via navicust_drawBoardTilemap, rebuilds
  the parts list with submenu_rebuildKeyItemList, and stores sub_8135DF8(partId) into +0x3a (likely a
  text/name id), clearing +0x38 to 0. Finally it writes 0x20 to byte +2 and 1 to byte +0x10, which look
  like a 'next screen state' and a 'redraw/transition' flag.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r5,#0x28]/ldrh r1,[r5,#0x2c] then bl battle_checkItemFlagFor_813B9B4: looks up what
    occupies the cell at the struct''s cursor coords; sub r0,#1 then bl toolkit_getUnk2004190EntryPtr_813B9FC:
    the cell''s part id minus 1 indexes the part-data entry array; ldrb r0,[r7,#3]/[r7,#4] stored to +0x28/+0x3c
    and +0x2c/+0x3e: part dimensions copied into the screen struct; bl navicust_drawBoardTilemap and bl
    submenu_rebuildKeyItemList: the board and parts list are refreshed after the selection changes; mov
    r0,#0x20; strb r0,[r5,#2] and mov r0,#1; strb r0,[r5,#0x10]: sets a next-state code and a redraw/transition
    flag, typical of a menu-state handler'
