  reproduce: python3 tools/asmcat.py 0x0813658C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The callees sub_813BA64 and sub_813B920 are called once each before any struct writes, and the loads
    use [r7,#3]/[r7,#4] only for +0x28/+0x2c (part dims), while [r7,#5] goes to +0xe (palette) and [r7,#6]
    goes to +0x14. The summary''s claim that +0x28/+0x3c carry field+3 from the entry and that submenu_rebuildKeyItemList
    is called alone fits, but the name `loadSelectedPartInfo` overstates it: it doesn''t just load info,
    it also redraws and finalizes a selection state (writes 0x20 to +2 and 1 to +0x10). A name like `navicust_confirmSelectedPart`
    better reflects the transition-flag behavior, but `navicust_loadSelectedPartInfo` is still acceptable.;
    run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
