name: sub_803C0BE
address: '0x0803C0BE'
kind: function
status: hypothesis
summary: Walks a 2-byte-per-entry list to its first 0xE6 terminator and, if that terminator lies past the used range,
  rewrites trailing free slots (0x00 or 0xE5 entries) into 0xE5 0xE5 pairs.
interface: "void sub_803C0BE(u32 countOffset /*r0*/, u32 listOffset /*r1*/,\n                 struct* base /*r5*/,\
  \ ...);\n/* out: r1 = address of the last 0xE5/0xE5 slot written (or original listOffset\n   if nothing was written);\
  \ r3 = base + listOffset;\n   flags NZ/C/V set from terminator/entry byte compares; r4-r7 preserved. */\n"
details: "Operates on a record at r5 that contains:\n  - r5+r0: a single byte giving the entry count\n  - r5+r1:\
  \ an entry list, two bytes per entry, terminated by the sentinel 0xE6\nFree entries in this list are either 0x00\
  \ (truly empty) or 0xE5; the function\nnormalises the tail of the list to the 0xE5 0xE5 pair, walking backward\
  \ from\nthe first 0xE6 terminator only if it lies at or beyond (count*2) bytes into\nthe list. Stops the moment\
  \ it hits an entry that is neither 0x00 nor 0xE5\n(an occupied slot) or once the byte index underflows below (count*2).\n\
  Uses 0xE5 as both the free-entry marker and the terminator candidate; the\n0xE6 byte is the real end-of-list marker\
  \ and is left untouched. r3 is loaded\nas r5+r1 once and reused; r1 is only clobbered on a write (it returns the\n\
  address of the most recent rewritten slot, otherwise the incoming listOffset).\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
