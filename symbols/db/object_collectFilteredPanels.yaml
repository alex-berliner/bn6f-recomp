  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The byte encoding is (row<<4)|col, not (col<<4)|row: at loc_8102D36 and the main loop, the code
    does `lsl r1, r1, #4; orr r0, r1` where r0 is the column and r1 is the row, placing row in the high
    nibble. The extras gathered via the recursive call still pass object_isValidPanel, sub_8102E5C, and
    object_checkPanelParameters filters, so they are not truly ''random panels'' but valid filtered panels
    whose selection order is randomized by ShuffleByteList_PrimaryRNG. The seeded-panel duplicate check
    at loc_8102DA8 only compares against [r7] (the first byte), matching the proposal''s ''duplicate of
    the seeded panel'' phrasing. The interface and walk description (direction from object_getFrontDirection,
    rows 1..3 per column, mask pair from byte_8102E4C[index*8]) all match the code. Everything else is
    accurate; only the nibble order and the ''random'' characterization need correction.; run wf investigate
    investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
