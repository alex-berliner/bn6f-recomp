name: object_collectFilteredPanels
address: '0x08102CF8'
kind: function
status: probable
summary: Collects up to N battle-grid panels passing validity/type/occupancy filters, seeds the source
  object's panel first, tops off with shuffled extras from a filtered recursive pass, and writes them
  as (row<<4)|col bytes.
interface: (r0 = object ptr whose panel is seeded first, r1 = arg forwarded to sub_8102E5C filter, r2
  = output byte buffer, r3 = count (bits 0-6) with bit 7 = no-refill flag; r5 = acting object with fields
  0x12 x, 0x13 y, 0x16 mask index) -> r0 = number of panel bytes written; no flag guarantees
details: First it may append the source object's own panel (x,y from +0x12/+0x13) if sub_8102E5C accepts
  it, remembering that via sp+0x24. It then walks columns in the direction from object_getFrontDirection
  starting at r5.x+dir, and for each column rows 1..3, keeping panels that are on the 6x3 grid (object_isValidPanel),
  pass the sub_8102E5C filter, aren't a duplicate of the seeded panel, and match the clear/must mask pair
  loaded from byte_8102E4C[r5.field0x16] via object_checkPanelParameters. Each kept panel is encoded as
  (col<<4)|row into a 0x30-byte stack buffer. If fewer than the requested count (r3&0x7f) were found and
  bit 7 of r3 is clear, it recurses with the local buffer to gather extra random candidates (ShuffleByteList
  on the recursion result, CopyBytes of min(needed, extra) into buffer+count). Finally the whole list
  is shuffled with ShuffleByteList_PrimaryRNG and min(count, total) bytes are CopyBytes'd to the caller's
  r2 buffer; returns the count actually written.
