name: battle_objectFlyAnimUpdateAndDestroy_80E1D54
address: '0x080E1D54'
kind: function
status: confirmed
summary: Per-frame update for a battle object in flight — advances its sprite animation, integrates its Z velocity,
  and switches it to the destroy state once the animation's end-of-life frame flag (0x80) is set.
interface: void sub_80E1D54(r4 /*ignored*/, BattleObject* r5 /*object*/, void* lr /*return addr*/); sets flags from
  the final test; returns frame params (or CUR_STATE_DESTROY) in r0
details: 'Battle-object state updater (r5 = object). Steps:

  1. Calls sprite_update to advance the object''s sprite animation.

  2. Integrates vertical motion: oBattleObject_Z += oBattleObject_ZVelocity (32-bit wrap-around adds, so ZVelocity
  can be negative).

  3. Calls sprite_getFrameParameters and tests bit 0x80 of the result — this appears to be the animation''s "last
  frame / end marker" bit.

  4. If the bit is set, writes CUR_STATE_DESTROY (8) to the packed field oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  replacing the object''s current state/action/phase in one store; the object is then torn down by the normal state
  machine.

  Typical use would be projectiles or thrown objects whose flight is animated and which vanish at the end of their
  animation. Preserves r4 and r5; r0-r3, lr and flags are not preserved.

  '
