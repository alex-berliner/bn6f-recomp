name: test0x200bc50_0x5_813D60C
address: '0x0813D60C'
kind: function
status: hypothesis
summary: Tests the boolean flag byte at offset 5 of the IWRAM struct at 0x200BC50 and returns its value and the
  struct address so callers can branch on it.
interface: 'void testStruct200BC50Flag05_813D60C(void) /* in: lr only; out: r0 = flag byte (0 or nonzero), r1 =
  &struct200BC50, Z/N flags set from r0 */'
details: 'Loads the byte at eS200BC50+5 (IWRAM 0x200BC55), copies it to r0, sets NZ flags from it via tst, and also
  returns r1 = &eS200BC50. Callers are expected to use the flags to branch (e.g. beq/bne) and can additionally use
  r1 to call further accessors on the same struct without recomputing the address. The byte is only read, never
  modified. Based purely on the generated name, eS200BC50 is an engine-managed state struct in IWRAM; without knowing
  what subsystem owns it, the meaning of flag +5 (e.g. "active", "busy", "finished") is unknown.

  '
