summary: Trivial stub that always returns 0 (false); no game logic, likely a disabled/removed hook.
interface: 'int stub_alwaysReturnsFalse_8010D20(void) /* in: lr only (r4 saved/restored); out: r0 = 0 */'
details: 'Immediately pushes r4/lr, zeroes r0, and pops r4/pc, so every caller receives 0 in r0 and all other registers
  are untouched. No flags are meaningfully set (the lifter notes nz/c/v as clobbered only because of the mov r4,#0
  / mov r0,r4 sequence). The words following the function (off_8010D28..off_8010D54, pointing at 0x3E9, byte_203EB00,
  byte_8020E54, 0x1500, 0x1F4, 0x3E7, 0x3FF, unk_20018C0, byte_80212D4, dword_203CDF0) are separate data-pool entries,
  not referenced by this stub — they belong to other functions'' literal pools and should not be attributed to it.
  Since the body is unconditional, callers always observe a false result; this pattern usually indicates a feature
  check (e.g. "is X active") that was stubbed out in this build, or a placeholder for a function removed from the
  final ROM.

  '
