name: owPlayer_triggerNpcChat
address: '0x0809D7A8'
kind: function
status: probable
summary: 'Overworld player chat/inspect action: if no cutscene is running, face the NPC''s direction and
  mark the interacted NPC as chat-triggered, entering chat substate 4.'
interface: (r5 = OW player object) -> r0 = undefined; sets NPC ChatTriggered and player ActionSubState,
  or falls into clear-state path when a cutscene script is active
details: First calls IsCutsceneScriptNonNull; if a cutscene script is active it branches to owPlayerObject_clearStateUnk10_809D7D8
  (the event-flag 0x80 state-clearing path). Otherwise it copies the player's FacingDirection into AnimationSelect
  so the player sprite animates toward the NPC it is facing. It then loads the interacted NPC object from
  oOWPlayerObject_interactedNPCObject_58 and checks its InteractionLocked byte; if locked, it does nothing
  further. Otherwise it writes TRUE to oOverworldNPCObject_ChatTriggered and sets the player's ActionSubState
  to 4, presumably handing control to the chat state machine. The route capture comment 'chat triggered'
  matches the ChatTriggered field write.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl IsCutsceneScriptNonNull / bne loc_809D7E2: cutscene-active case routes into the known clear-state
    callee; ldrb r0,[r5,#FacingDirection]; strb r0,[r5,#AnimationSelect]: player turns toward interacted
    target; ldr r7,[r5,#oOWPlayerObject_interactedNPCObject_58]: operates on the NPC the player is facing;
    tst r0 / bne locret: NPC InteractionLocked byte gates the interaction; strb TRUE,[r7,#oOverworldNPCObject_ChatTriggered];
    strb #4,[r5,#ActionSubState]: starts the chat substate'
