- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleState_SubPhaseInitFlag]; tst/bne = one-time init vs poll pattern; bl chatbox_runScript
    with =TextScriptBattleTutFullSynchro and r1=#0xa names the tutorial message; chatbox_mask_eFlags2009F38(0x80)
    bne exit = waits for the chatbox to be dismissed; GetBattleEffects + tst r0,#2 picking 0x10 vs 0x14
    ties the branch to a battle-effect outcome (Full Synchro); strb r2,[r5,#oBattleState_Index_01] then
    StatePhaseAndInitFlag=0 = advance tutorial state
