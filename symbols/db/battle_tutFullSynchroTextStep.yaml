name: battle_tutFullSynchroTextStep
address: '0x0800951E'
kind: function
status: probable
summary: 'Battle-tutorial step: shows the Full Synchro tutorial text once, waits for the chatbox to close,
  then records whether Full Synchro was achieved and advances the tutorial state.'
interface: (r5 = *BattleState) -> void; writes oBattleState_Index_01 (0x10/0x14), sets oBattleState_SubPhaseInitFlag
  = 4, zeroes oBattleState_StatePhaseAndInitFlag; flags set by callee branches
details: 'Uses r5 as a battle-state struct (fields oBattleState_SubPhaseInitFlag, oBattleState_Index_01,
  oBattleState_StatePhaseAndInitFlag). First pass runs chatbox_runScript with TextScriptBattleTutFullSynchro
  index 0xA and stores 4 into the init flag; subsequent passes first poll chatbox flag 0x80 (script still
  active/box open) and bail while set. Once the box is free, GetBattleEffects is consulted: bit 1 of the
  mask selects 0x10 (synchro done) vs 0x14 (not done), which is stored in oBattleState_Index_01 as the
  value the tutorial logic later reads. Finally StatePhaseAndInitFlag is cleared to 0, moving the tutorial
  to its next phase. Only meaningful during the Full Synchro battle tutorial.'
