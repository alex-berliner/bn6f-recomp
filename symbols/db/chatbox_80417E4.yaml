name: chatbox_80417E4
address: '0x080417E4'
kind: function
status: confirmed
summary: 'Chatbox script command "check key item": compares the player''s key item status against an expected value
  and branches to one of three scripts (equal/greater/less).'
interface: chatbox_cmdCheckKeyItem_80417E4(ChatboxScriptCmd *cmd /* r4 */, u8 *r10, void *lr /* return addr */)
  -> u8 /* r0 = 1 */; clobbers r1 r2 lr and nzcv flags; r2 out = selected branch offset (4/5/6)
details: 'r4 points at a 7-byte chatbox script command. Field +2 holds a key item ID,

  which is passed to CheckKeyItem (result treated as a signed byte for the

  comparison). Field +3 is the expected value. If the check result equals the

  expected value, the script ID at cmd+4 is used; if the result is greater,

  cmd+5; if less, cmd+6. If the selected script ID is not 0xFF, it is started

  via chatbox_config_80408D0 (first argument r0 is unused there and happens

  to still carry the CheckKeyItem result); if it is 0xFF, no script is

  launched and the command pointer r4 is advanced by 7 to skip the whole

  command. Always returns 1 (continue chatbox script processing). Quirk: on

  the non-0xFF path the command pointer is not advanced by this handler, so

  the called script presumably manages the pointer.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
