name: battleObj_runUpdateAndSetActive_814E1C0
address: '0x0814E1C0'
kind: function
status: confirmed
summary: Runs a per-object update routine for the entity whose pointer is in r1, writes the routine's result byte
  into the object, and sets the object's status byte low bits to mark it active/updated.
interface: void sub_814E1C0(u32 arg0 /*r0, passed through*/, void* obj /*r1*/); // r4-r11 preserved, r0-r3 and r12
  clobbered, flags set from the final ORR
details: 'A thin wrapper around sub_814E0D0: it saves the return address in r12, tail-calls that routine (which
  apparently takes r0/r1 as arguments and leaves the object pointer intact in r1 and a result byte in r3), then
  stores the r3 result byte at obj+0x12. Finally it reads the object''s status/state byte at obj+0x00, ORs in 0x03
  (setting both low bits), writes it back, and returns via bx r12 so the flags from the ORR are live for the caller.
  The object layout touched here is just offset 0x00 (state/status byte) and offset 0x12 (per-update result byte);
  everything else is sub_814E0D0''s business. The "OR 3" pattern reads like marking an object as active/enabled/updated
  this frame rather than writing an exact state value. Returning through a saved copy of lr in r12 is a quirk: the
  routine is not tail-callable in the normal sense and intentionally leaves NZ flags from the status byte for its
  caller.

  '
