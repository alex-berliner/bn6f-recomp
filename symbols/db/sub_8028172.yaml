open_questions:
- What data structure lives at byte_86E56FC (32-byte records) and which game system owns it?
- What semantic ordering the permutation {3,0,4,1,5,2,6,0} encodes (it looks like a deliberate reorder of slots
  0-6).
- What the adjacent table byte_802819C (12 entries) is used for and whether it is an inverse/parallel mapping.
- Whether callers guarantee index <= 7; entry 6 of the permutation maps to record 0, which may be a deliberate clamp
  or an unused index.
