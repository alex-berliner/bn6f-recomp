name: ai_sweepTargetSelect
address: '0x081114C8'
kind: function
status: probable
summary: 'Enemy-AI sweep-attack helper: picks or refreshes a target and writes its result (r0/r1, likely
  target coordinates) into the AI work area at +0x65/+0x66.'
interface: (r4-r5 = AI/enemy work area) -> stores r0 byte at [r5+0x65] and r1 byte at [r5+0x66] when either
  early check passes; no return value used
details: Runs two predicate calls (sub_81114EE, sub_811152C) and, if either returns nonzero, calls sub_81117DA
  whose r0/r1 results are stored as bytes at offsets 0x65 and 0x66 of the struct in r5 — a shape typical
  of writing target x/y into an enemy-AI work area. If neither predicate fires, it falls through to sub_8111650
  instead and stores nothing. Called from ai_sweepAttackInit, which counts ticks, chooses a move target
  and closest enemy, and queues attack 0xB, so this is a sub-step of that routine's target/parameter selection.
  The predicates likely test conditions such as whether a target row/column is already known or occupied.
