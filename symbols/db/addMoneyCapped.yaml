name: addMoneyCapped
address: '0x0802D164'
kind: function
status: probable
summary: Adds an amount to a stored counter (likely zenny), clamping it at 999999.
interface: (r0 = amount to add) -> r0 = unused (value not returned); flags set by final str/cmp sequence
  are not meaningful, returns via bx lr
details: Reads a 32-bit value from dword_2006740, adds r0, and if the sum exceeds 999999 (0xF423F) it
  is clamped to exactly 999999 before being written back. The value is never returned and no other state
  is touched. The clamp value 999999 matches the typical max money cap in the series, suggesting dword_2006740
  is the player's zenny. Thumb function, 9 instructions, no calls.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r2, [r1]; add r2, r2, r0 — accumulates r0 into the dword_2006740 counter; ldr r3, =0xF423F;
    cmp; ble; mov r2, r3 — clamps the sum to 999999; str r2, [r1]; mov pc, lr — writes back and returns,
    no other effects
  refs:
  - bn6f/asm/asm03_0.s:15134
  reproduce: python3 tools/asmcat.py 0x0802D164
