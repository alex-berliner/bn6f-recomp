    called — moves object onto target panel; mov r0,#1; bl object_setCollisionRegion and setFlag1 with
    bit OBJECT_FLAGS_CURRENTLY_MOVING_1 mark the object as dashing; tail: StepTimer-- ; on 0 writes 0x18
