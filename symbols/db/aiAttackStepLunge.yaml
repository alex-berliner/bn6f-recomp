name: aiAttackStepLunge
address: '0x08106162'
kind: function
status: probable
summary: AI attack state that dashes the enemy object onto its target panel, then arms the hit element
  after a short delay
interface: (r5 = battle object, r7 = AI attack vars) -> void; sets up movement/anim on first call, counts
  oAIAttackVars_StepTimer down on later calls
details: This is a per-frame step of an AI-controlled attack. On entry (AttackElement == 0) it stamps
  element 4 into oAIAttackVars_AttackElement, plays battle animation 0x16, commits the object's FuturePanelX/Y
  into PanelX/Y, releases its reserved panel via object_removePanelReserve, recomputes pixel coordinates
  and collision panels, zeroes Z, sets collision region 1, clears flag 0x40, and sets the OBJECT_FLAGS_CURRENTLY_MOVING_1
  bit, with StepTimer = 4. On subsequent frames it just decrements StepTimer; when it reaches 0 it writes
  0x18 into oAIAttackVars_HitElement, presumably activating the attack's damage. The pattern matches a
  lunge/dash-in melee attack state machine entry.
