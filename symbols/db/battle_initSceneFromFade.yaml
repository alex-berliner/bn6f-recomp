name: battle_initSceneFromFade
address: '0x0812AE74'
kind: function
status: probable
summary: 'Fade-gated scene initializer: clears VRAM/GFX, loads entity slot-0 graphics, primes the chatbox,
  sets a speed/timer field on the caller''s state struct, clears a flag, zero-fills a small EWRAM block,
  loads the screens3 background tiles, spawns eStruct records from a table, and conditionally stops the
  RFU wireless mode.'
interface: (r5 = cutscene/screen state struct, set by caller) -> r0 = undefined; no meaningful flags
details: Entry is gated on IsScreenFadeActive — if no fade is in progress the whole body is skipped, so
  this runs as part of a fade-driven scene transition. It calls battle_initScene_8129248 (VRAM/GFX clears
  + render-info block setup), loads the current entity's jump-table slot-0 graphics, and primes the chatbox.
  It writes r5+3 = 0x10, bumped to 0x2C when r5+2 >= 0x14 (looks like a wait/timer or text-speed field),
  and clears r5+0x1E. It zero-fills the 0x10-byte block at unk_20251A0, redraws the menu-style background
  via screens3_loadBackgroundTiles, and spawns eStruct records from the (id,slot,param) table byte_8129150.
  Finally, if the mode byte at EWRAM 0x200BC30 is nonzero it issues rfu_REQ_stopMode and waits for completion,
  ending a wireless link before the cutscene proceeds.
