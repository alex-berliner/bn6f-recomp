name: sprite_advanceAnimFrame
address: '0x08138478'
kind: function
status: probable
summary: 'Processes the next animation frame of an object: copies the frame''s parameters into the object''s
  0x200a220 struct, queues its tile/sheet upload to VRAM, and advances the animation pointer and frame
  counter.'
interface: (r3 = ptr to current animation frame entry, r5 = object struct) -> r0 = 0; r5+0xd = (frame
  counter + 1) & 0xF, r5+0x18 = frame ptr + 4
details: Reads byte [r3,#1] (likely a frame/sheet id) and calls sub_8045FC6 with r4=0xC, r5=1, r6=byte_86ACD60
  (constant table) and r7=unk_2014000 (work buffer), sourcing data from the two decomp buffers 2013A00/2014A00.
  It then queues a VRAM graphics upload via sprite_queueSheetGfxUpload and runs sub_8138890. Finally it
  wraps a frame counter at r5+0xD modulo 16 and advances the frame-entry pointer at r5+0x18 by 4 bytes,
  matching 4-byte animation frame entries. Callers copy fields of the frame entry (r5+0xA, +0xB, +0xE,
  +0x10) into the per-object struct at [0x200a220]+8 and +0xC before calling it.
