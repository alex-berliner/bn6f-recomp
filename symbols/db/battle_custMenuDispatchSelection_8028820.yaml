name: battle_custMenuDispatchSelection_8028820
address: '0x08028820'
kind: function
previous_names:
- sub_8028820
status: probable
summary: 'Custom-menu chip-select dispatcher: routes per selected-slot index to a small handler that packs
  (row,column) pair-coords into FIFO records.'
interface: (r5 = active-chip-array base, r6 = out-pair-table base; saves r4-r6,lr) -> flags ; side effects
  writes records into the FIFO at dword_3002180 via fifo_pushRecord16_8009FF8
details: "Reads Param4 (byte at [r5,#7]) of the active chip slot; looks it up via getLocOfActiveChips_8027E1C,\n\
  \  then dispatches on slot index through jt_802886C (10 entries, mostly sub_8028894 / sub_8028938 fallbacks).\n\
  \  Computes a base pair coord (r4) by subtracting 3 from current Y/X, bit 3 of [r5,#0x40] selects an\n\
  \  offset table (0xb764 or 0xb764 + 0x10), and pushes 3 pairs (r6, r6+0x10, r6+0x20) into the FIFO\n\
  \  with the encoded (row,column) pair. Loop runs while r6 >= 0, walking pointer by -4 each iteration.\n\
  \  Captured entry r2=0xffff / r3=0x02001cb4 come from the caller's packet; r0..r3 are not interpreted\n\
  \  meaningfully here. Four of the ten cases (5,6,3,4 in jt) reuse sub_8028894 / sub_8028938, so the\n\
  \  handler is mostly about the two distinct cases (default and offset-with-load).\n"
