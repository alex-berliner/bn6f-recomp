open_questions:
- The exact field semantics ("PwrAtkState"/"PwrAtkButton") are inferred from a comment in AIData.inc that says "ai
  state and ai attack vars might be swapped"; verifying whether +0x1d is really PwrAtkState or rather a generic
  state byte would settle the name.
- The role of sub_80E1662 is unknown; without seeing its body the "cleanup helper" wording is best-effort.
