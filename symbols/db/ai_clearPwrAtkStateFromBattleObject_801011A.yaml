name: ai_clearPwrAtkStateFromBattleObject_801011A
address: '0x0801011A'
kind: function
previous_names:
- sub_801011A
status: probable
summary: Clears the Power Attack (PwrAtk) state and button fields in the battle object's AIAttackVars sub-struct
  and then runs the lone helper sub_80E1662.
interface: (r5 = BattleObject*) -> void ; clears AIAttackVars.Unk_1d = 0, AIAttackVars.Unk_1e = 0 (u16), then tail-calls
  sub_80E1662 with r5 preserved
details: "Pushes lr, loads the AI data pointer via `[r5, #oBattleObject_AIDataPtr]` (=+0x58) into r0, then advances\
  \ by 0xa0 to land on the AIAttackVars byte-array that starts at AIData+0xA0 (struct_org 0xa0, AttackVars). Stores\
  \ 0 into the single byte at offset 0x1d relative to that (=PwrAtkState) with strb and 0 into the u16 at +0x1e\
  \ relative to that (=PwrAtkButton) with strh. Calls sub_80E1662 with r0 still = AIAttackVars base (caller contract\
  \ in=['r5','lr'] out includes only r0/r1 from sub_80E1662, plus the obvious Z/C/V from the stores), then pops\
  \ {pc} to return.\n  The captured-call snapshots consistently show AIDataPtr+0xA0 as the start of an array of\
  \ u8 with byte 0x1d = 0x1e (which is read here as the literal 0x1e constant? actually a u8 value) right up to\
  \ a save/load pointer pair at +0x44/+0x48; combined with the struct, the function is clearing the fresh PwrAtk\
  \ bookkeeping at the moment a PwrAtk action finishes, before invoking a cleanup helper.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, [r5,#oBattleObject_AIDataPtr]` with `oBattleObject_AIDataPtr` = 0x58 per BattleObject.inc
    loads the AI data pointer from the battle object in r5. - `add r0, #0xa0` matches `struct_org 0xa0 u8_arr AttackVars,
    0x50` in AIData.inc — the AIAttackVars array. - `strb r1, [r0,#0x1d]` clears AIAttackVars+0x1d; in ai_attack_vars_struct
    Unk_1d is the byte right before Unk_1e, and the struct comment notes PwrAtk-related fields live around there
    (PwrAtkState/PwrAtkButton). - `strh r1, [r0,#0x1e]` clears the u16 AIAttackVars+0x1e. - `bl sub_80E1662` takes
    the AIAttackVars pointer in r0 and only reads/writes r0/r1, consistent with a small per-attack cleanup helper.
    - `pop {pc}` after only one bl means sub_80E1662 is allowed to clobber r0/r1 freely; lr was pushed so this is
    a tail-return. - Callers confirm a battle/AIAttack context: `ai_eventuallyRunsAIAttack_801AF44` (AI-attack scheduler),
    `object_setAttack5` (object-side attack setter), and the wrapper `sub_80EAF36`.'
