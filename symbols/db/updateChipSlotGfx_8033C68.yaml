open_questions:
- What exactly gfxTransfer_8033DA0 does with the 0/0x20 dispatch values and which VRAM region it targets
  (the 0x20 values look like 32-byte tile loads rather than 0x100-byte ones).
- Which chip-slot animation set owns the pointer table at off_8033D2C and whether it is one large global
  or per-bank.
- Whether the two sub_802FE28 calls are BG2 X-scroll writes, window registers, or HBlank DMA buffers tied
  to the chip-slot shake/spin.
- Whether state[7] is a frame counter or a real SFX cooldown (0x60 frames at 60 fps is ~1s, suggesting
  a "spin every second" cadence).
- The role of dword_30016D0 referenced right after the 0x100 size word.
