name: sub_81374C4
address: '0x081374C4'
kind: function
status: confirmed
summary: If chatbox eFlags2009F38 bit 0x80 is clear, writes the byte 0x74 to the caller-supplied byte pointer; otherwise
  does nothing.
interface: void sub_81374C4(u8* dest /* r5 */)  // no return value, flags not meaningful to callers
details: 'Tests a single flag in the chatbox work area''s eFlags2009F38 word by calling

  chatbox_mask_eFlags2009F38 with mask 0x80 (that helper returns with Z set when the

  tested bit is clear). When the flag is clear, stores the constant 0x74 as a byte at

  the address given in r5. 0x74 looks like a chatbox state/code byte (e.g. a textbox

  command or next-state value) rather than a boolean, but its exact meaning is unknown.

  When the flag is set the function is a no-op. Only r0 and the flags are clobbered;

  r1 is preserved, and the routine is a leaf wrapper around the flag test plus one

  strb. Tail behavior is a plain pop {pc}.

  '
