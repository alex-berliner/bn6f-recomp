name: battle_spawnObjectBBAndInit
address: '0x080DC986'
kind: function
status: probable
summary: 'Spawns battle object #0xBB through the type-3 spawner with forwarded arguments, then runs the
  base battle-object initializer on it if the spawn succeeded.'
interface: (r0-r2, r4 = forwarded spawner args, r5 = extra arg used as init's r0) -> r0 = spawn result;
  spawn's zero flag selects whether the init call runs
details: The wrapper saves r0-r2 and r5, replaces r0 with the constant 0xBB and calls object_spawnType3,
  leaving r1-r4 untouched so the caller's remaining four spawner arguments pass straight through. object_spawnType3
  leaves its success flag in the Z flag; beq skips the initializer when the spawn failed. The push {r0-r2,r5}
  / pop {r1-r3,r5} pair shifts the original r0-r2 into r1-r3, and r0 for BasicBattleObjectInitialize is
  taken from the caller's r5 (mov r0,r5 executes before the pop), so callers evidently pass a fourth parameter
  in r5 — most plausibly a parent/owner object pointer — that becomes the init's first argument. The whole
  thing is a fixed-ID 'spawn and initialize' helper for one specific battle entity.
