name: ai_damageFlaggedPanelsInFront
address: '0x080F1B24'
kind: function
status: probable
summary: 'AI attack helper: sweeps every panel in front of the battle object and deals the attack''s damage
  on panels whose status flags match a per-alliance mask.'
interface: (r5 = battle object, r7 = AI attack vars {InitFlag, Damage}) -> r0 = ?; no meaningful return
details: 'Outer loop iterates absolute panel coordinates y = 1..2 (r6) with inner loop x = 1..5 (r4),
  i.e. the whole 5x2 panel grid. For each panel it computes dir*(objX - x) via object_getFrontDirection
  and only processes panels strictly in front of the object (skip when >= 0). object_getPanelParameters(x,
  y) gives the panel status word, which is tested against a per-alliance mask from byte_80F1B70 (alliance
  0: 0x05800000, alliance 1: 0x0A800000; shared bit 0x00800000 plus alliance-specific bits). If any masked
  flag is set, it calls sub_80D05C4 with r0 = x, r1 = y, r2 = r7->InitFlag and r6 = r7->Damage (r6 is
  saved/restored around the call, so it is deliberately passed as an argument despite also being the loop
  counter). The alliance-dependent masks suggest the attack only triggers on panels in a particular state,
  but which terrain/status the bits mean is not confirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loc_80F1B2A loops r4=1..5 and r6=1..2 as absolute panel x/y passed to object_getPanelParameters;
    mul r0,r1 with object_getFrontDirection plus 'bge' skip restricts hits to panels in front of r5; tst
    r0,r2 against off_80F1B6C word selected by oBattleObject_Alliance<<2 gates each hit; push {r6}/ldr
    r6,[r7,#oAIAttackVars_Damage] before bl sub_80D05C4 shows damage comes from the AI attack vars; caller
    sub_80F1A60 and callee sub_80D05C4 are both unnamed, so no external confirmation
