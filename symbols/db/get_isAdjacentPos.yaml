name: get_isAdjacentPos
address: '0x0814299C'
kind: function
status: probable
summary: Returns 1 if two packed (x,y) tile positions are the same or 4-neighbors (Manhattan distance
  <= 1), else 0.
interface: (r0 = packed pos A (hi=x<<8|lo? hi byte x, lo byte y), r1 = packed pos B) -> r0 = 1 if |dx|+|dy|
  <= 1 else 0; sets flags via tst
details: 'Splits each 16-bit argument into high and low bytes, treating each as a coordinate pair (x =
  >>8, y = &0xFF). It subtracts the components pairwise, negates negative differences to get absolute
  deltas, sums them into a Manhattan distance, and sets the result flag to 1 only when the sum is <= 1
  — i.e. the two positions are identical or one step apart on a grid. Pure computation: no memory, structures,
  or callees touched; r4-r6 are saved but unused. Sign handling is done with neg/cmp rather than a helper,
  and the result is returned in r0 with r7 as the internal flag.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'lsr r2,r0,#8 / and r3,#0xff: unpack r0 into two byte coordinates (0x081429A2-0x081429A7); sub
    r2,r2,r4; neg on negative branch: absolute per-axis deltas (0x081429A8-0x081429BC); add r2,r2,r3;
    cmp r2,#1; bgt skip; mov r7,#1: return 1 only when Manhattan distance <= 1 (0x081429BE-0x081429C4);
    no loads/stores or bl in the whole routine: pure positional predicate'
