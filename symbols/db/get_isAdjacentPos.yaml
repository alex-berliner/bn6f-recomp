  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code at 0x0814299C matches: it splits r0/r1 into x (>>8) and y (&0xFF), computes |dx|+|dy| into
    r2, and sets r7=1 when r2<=1 (bgt skips), then returns r0. However, the comparison r2<=1 means adjacent
    includes the same tile and also diagonally-adjacent tiles (dx=1,dy=1 gives 2 and fails, so only 4-neighbors
