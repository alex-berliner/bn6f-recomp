name: battle_updateWaitTimerPhase
address: '0x080DF3CC'
kind: function
status: probable
summary: Per-frame battle-object step that, on entering phase 0, loads a frame delay from Param1 into
  Timer and, once the timer elapses, sets CurAction=4 and clears the phase so the object's state machine
  advances.
interface: (r5 = battle object) -> void; no return value, mutates oBattleObject_CurPhase, Timer, Param1->Timer
  copy, CurAction, CurPhaseAndPhaseInitialized
details: Standard battle-object updater taking the object in r5 (BN6 convention for the currently-updated
  object). If oBattleObject_CurPhase is 0 (fresh state), it writes phase=4 and copies oBattleObject_Param1
  into oBattleObject_Timer as the delay. On later frames it decrements Timer; when it reaches 0 it writes
  CurAction=4 and stores 0 to CurPhaseAndPhaseInitialized, signaling completion and resetting the phase
  for the next state. It is purely a timed wait that ends by selecting action 4.
