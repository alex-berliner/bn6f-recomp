- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst/bne: phase 0 branch writes phase=4 and strh Param1
    into Timer (loc_80DF3CC..); ldrh r0,[r5,#oBattleObject_Timer]; sub #1; bgt: delay counts down each
    frame (loc_80DF3DE); mov r0,#4; strb [r5,#oBattleObject_CurAction] then strh 0 to CurPhaseAndPhaseInitialized:
    ends the wait by choosing action 4; uses only battle-object state fields via r5 with no callees, matching
