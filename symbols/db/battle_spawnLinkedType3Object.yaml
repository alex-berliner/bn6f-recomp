name: battle_spawnLinkedType3Object
address: '0x080D6B78'
kind: function
status: probable
summary: Spawns a battle object (kind 0x8c) and initializes its panel position, element, damage, alliance
  and owner links from caller-supplied values.
interface: (r0 = PanelX, r1 = PanelY, r2 = Element, r3/r5 = passed to object_spawnType3 with r5 also source
  object, r6 = damage/stamina value, r7 = ptr to owner slot) -> r0 = new oBattleObject or 0 on failure
details: Saves r0-r2 and r5 with an odd push {r0-r2,r5} / pop {r1-r3,r5} pairing so the original arguments
  survive the spawn call. Calls object_spawnType3 with r0=0x8c; success is tested by `mov r0,r5` (Thumb
  low-reg MOV = LSLS r0,r5,#0, so it sets flags) followed by beq, implying the spawn returns the new object
  pointer (or NULL) in r5. On success it writes oBattleObject_PanelX/PanelY/Element from the saved r0-r2,
  stores r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler, copies the halfword oBattleObject_AllianceAndDirectionFlip
  from the r5 source object and sets that source as oBattleObject_RelatedObject1Ptr. Finally it stores
  the new object into [r7] and r7 into oBattleObject_ExtraVars, a two-way link between the object and
  its owner/handle. The original r3 is consumed only by object_spawnType3, not stored into the object.
