name: battle_objectDieOnCollisionHit_801A6D6
address: '0x0801A6D6'
kind: function
status: confirmed
summary: Runs a battle object's collision check and zeroes the object's HP if the check reports a hit.
interface: void battle_objectDieOnCollisionHit(battle_object* obj /*r5*/); // extra args/scratch in r4 (collision
  data, forwarded to sub_801A6E8) and r7; contract reports r2/r4/r7 as outputs
details: 'Loads the battle object''s collision data pointer from obj->CollisionDataPtr

  (oBattleObject_CollisionDataPtr) into r4 and calls sub_801A6E8 with it. If that

  helper returns nonzero (a hit was detected), the object''s HP field

  (oBattleObject_HP, a halfword) is written to 0, which for a battle object means

  it is destroyed/removed by whatever processes HP afterwards. r4 is saved on

  entry and restored before returning, and r7 passes through untouched, so the

  helper sub_801A6E8 is expected to preserve or not need them despite the caller

  contract listing r4 among outputs. No flags are meaningful on return beyond the

  clobbers listed (nzcv).

  '
