status: probable
summary: 'State table of the Mr. Weather comp tornado (map object type 0x1A): its state byte +8 (0, 4, 8, 0xC) is
  the byte offset of the handler: init, active, caught, free when the animation ends.'
details: "Four Thumb pointers at asm29.s:7677-7681, read only by owMapObject_weatherTornado_80A8E74 (through the\
  \ literal\noff_80A8E84): it loads r6 = eWeatherCompState, then r0 = [off_80A8E88 + byte +8] (the state byte is\
  \ used as the\nbyte offset itself, not scaled) and calls it with `mov lr, pc; bx r0`, r5 = the map object.\n \
  \ +0 (state 0)   owMapObject_weatherTornado_init_80A8E9C: sprite 0x80/0x1C/0x6C, animation 0x18, home position;\n\
  \                 with EVENT_BFB set, state 0xC if owMapObject_weatherTornado_isCaught_80A91D4 (and return), else\
  \ its\n                 saved state restored; without it, fresh counters; then parameters, state 4 and one active\
  \ step\n  +4 (state 4)   owMapObject_weatherTornado_active_80A8F08: EVENT_BEF -> state 8; else, outside cutscenes\
  \ and the\n                 chatbox, moveOrPause and checkHitPlayer; then priority, sprite, saveState\n  +8 (state\
  \ 8)   owMapObject_weatherTornado_caught_80A8FA0: once its caught flag is set, animation 0x19, sound 0x160,\n\
  \                 state 0xC\n  +0xC (state 0xC) owMapObject_weatherTornado_freeWhenAnimEnds_80A8FE4\nThe handlers\
  \ have entries of their own. vidsync's BN6F_SYMBOLS.md lists the table (level P for the tornado as a\nwhole, from\
  \ field writes that moved it as predicted); vidsync never reads or writes the table itself. Its\nweather_comp_tornado_state\
  \ handler counts a tornado as live when +8 is 4 or 8, which fits the states here.\n"
