name: queue_popHalfword_802C8D4
address: '0x0802C8D4'
kind: function
status: confirmed
summary: Pops the next halfword entry from an in-struct FIFO queue, returning 0 when it is empty.
interface: 'u16 queue_popHalfword(void *state /* r5 */); // in: r5 = queue state, lr = return; out: r0 = value (0
  if empty), r1 = read index, r2 = entry offset/count; flags c/v set by the last CMP/ADD, nz clobbered'
details: 'Queue lives inside a struct passed in r5. Layout: +0xC (u8) is the read index,

  +0xD (u8) is the entry count, and entries start at +0x14 as halfwords, so each

  entry is at +0x14 + 2*readIndex. If the read index has reached the count the

  queue is exhausted: r0 = 0 is returned, the read index is left untouched, and

  the c/v flags reflect CMP(read, count). Otherwise the halfword at the current

  index is loaded into r0, the read index is incremented and stored back to +0xC,

  and c/v reflect ADD(index, 1). r1 returns the (possibly incremented) read index

  and r2 the byte offset of the entry (or the count when empty) — callers

  apparently use or at least tolerate these. No other state is touched; the write

  index / ring-buffer wraparound handling must live in the matching push routine,

  so this may be a simple linear queue that is refilled by a producer elsewhere.

  '
