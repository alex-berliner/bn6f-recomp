open_questions:
- No known callers, so which enemy/attack state machine invokes this and what HitElement values 4 and
  8 mean downstream is unconfirmed
- The exact purpose of sub_80F146E/sub_80F14BC/sub_80F149C (0x60000 argument suggests an animation or
  effect) is unknown
- Which attack element/value 4 represents and the meaning of oAIAttackVars fields ScratchVar/AiAttackParam
