name: sub_8127060
address: '0x08127060'
kind: function
status: confirmed
summary: Draws the background tiles for one folder-list row (folder-name banner plus four icon strips) onto tile-block
  1, with icon horizontal positions offset by the row descriptor's column byte.
interface: 'void sub_8127060(void);  // in: r5 = row-descriptor record pointer, r10 preserved; out: r5, r7 preserved;
  clobbers r0-r3, lr, n/z/c/v'
details: "Copies five 16-color background tile regions into VRAM tile-block 1 via CopyBackgroundTiles (j, i, which_tile_block_32x32=1,\
  \ *tileIds, j_size, i_size):\n  * Banner: 30x20 tiles at (0,0) from 'eTextScript201BA20' (the folder-name string-art\
  \ tiles).\n  * Icon strip 1: 14x10 (col + 0x0F, 2) from unk_201CF20.\n  * Icon strip 2: 14x10 (col + 0x22, 2)\
  \ from unk_201D120.\n  * Icon strip 3: 13x10 (col + 0x30, 2) from unk_201D320 (one column narrower).\n  * Icon\
  \ strip 4: 12x8 (col + 1, 4) from unk_201D520 (wider but shorter).\nThe 'col' offset is the signed byte at record\
  \ offset 0xD (the row's horizontal position on the folder list).\nAll five copies target tile-block 32x32 #1,\
  \ so this is the \"list of folders\" tile-blob laid down once per visible row.\nThe function preserves r4/r5/r6/r7/r10\
  \ (push/pop) and only really uses r5 as the row-record pointer (stashed in r7 and re-read five times for the col\
  \ byte).\n"
