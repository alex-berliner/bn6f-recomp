name: ow_getPlayerTileMapIndex_8142990
address: '0x08142990'
kind: function
status: confirmed
summary: Returns the map tile index for the overworld player's current position (reads the player object's
  coords, then converts them via the cursor-tile-index helper).
interface: u32 ow_getPlayerTileMapIndex(void /* r10 = overworld context */)
details: 'A tiny two-call wrapper. It first calls ReadOWPlayerObjectCoords, which fills r0/r1 with the
  player overworld object''s tile coordinates (the function takes its context from r10, which the caller
  supplies and this tail of code does not touch). It then immediately calls ow_getCursorMapTileIndex (the
  generated C wrapper lists this target under its raw name sub_8142816, but the disassembly branch target
  is the named symbol) with those two coordinates in r0/r1, and returns its r0 result: the tile index
  in the current map corresponding to the player''s position. r4-r7 are pushed and popped only to satisfy
  the AAPCS-style prologue around the calls; their values are unchanged on return. No flags are meaningful;
  nzcv are clobbered by the calls.

  '
