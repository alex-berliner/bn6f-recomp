name: object_isCurrentPanelSolid
address: '0x0800CCA6'
kind: function
status: confirmed
summary: returns whether the panel a battle object currently occupies is solid (hole, broken tile, off-grid, etc.)
interface: bool object_isCurrentPanelSolid(battleObject* obj /* r5 */)
details: 'Thin wrapper over object_isPanelSolid for a battle object. Loads the object''s current panel coordinates
  from its BattleObject struct (oBattleObject_PanelX at the object''s PanelX field, oBattleObject_PanelY at PanelY,
  both bytes) and tail-calls object_isPanelSolid with r0 = panel X and r1 = panel Y. Because it is a tail call (pop
  {pc}), the callee''s return value and condition flags (nz, c, v) pass straight through to this function''s caller;
  r0 is the boolean solidity result. r5 is the object pointer and is not preserved beyond the tail call, which matches
  the observed contract (callers only rely on r5 going in). No other state is touched.

  '
