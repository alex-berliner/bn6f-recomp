name: startScreen_playSoundIfFlagSet_802FBD8
address: '0x0802FBD8'
kind: function
status: confirmed
summary: On the title/start screen, plays a fixed sound or voice clip when status bit 0x10 is set.
interface: void startScreen_playSoundIfFlagSet_802FBD8(StartScreen *screen /* r5 */)
details: 'Takes the StartScreen struct in r5, tests the halfword of status flags at offset +0xA

  against bit 0x10. If the bit is clear, the function returns immediately without doing

  anything. If it is set, r0 is loaded with the address of byte_802FBF0 — a small inline

  data table (0x4, 0x40, 0x7C, 0x80, 0x40, 0x82 followed by zero padding) that looks like

  a sound/voice playback descriptor — and sub_8001158 is called to play it. sub_8001158 is

  presumably the shared "play sound from descriptor" helper. The data table is embedded

  right after the function body, aligned to 4 bytes. r4-r7 are preserved; r0/r1, the NZ

  flags and lr are clobbered. On the not-taken path C and V still reflect the caller''s

  TST result, which callers ignore anyway.

  '
