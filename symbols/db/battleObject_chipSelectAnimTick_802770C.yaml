name: battleObject_chipSelectAnimTick_802770C
address: '0x0802770C'
kind: function
status: confirmed
summary: Runs one tick of the chip-select screen animation state machine for a battle object, dispatching through
  a per-step handler table and then running the shared animation tick.
interface: void battleObject_chipSelectAnimTick_802770C(self r5 /* * S20364C0 */, r10); returns r2-r6 and passes
  r8-r12 through from the state handler; clobbers r0, r1, r7, lr and flags
details: 'Per-frame driver for the chip-select animation on a battle object (struct S20364C0 in r5). The animation
  step/state lives in the byte at self+2; the byte is used as an index into the jump table off_8027724, whose entries
  are Thumb addresses reached via the mov lr, pc / bx r1 pattern with r0 = step and r5 = object pointer. The table
  has five states: sub_8027738, sub_802774C, sub_802777C, sub_8027796, and battle_advanceScriptStateOnFadeDone (the
  last state hands off to the script/advance-on-fade handler, i.e. the animation ends by triggering the usual fade-complete
  state advance). After the state handler returns (it may update r5), the shared per-object tick battleObject_chipSelectAnimTick_8029C08
  runs on the object and its r2-r6 results are propagated to callers; r8-r12 are written by the state handler and
  preserved through 8029C08, living only in the guest register file.

  '
