open_questions:
- Which S20364C0.Unk_02 value maps to which handler (need each sub_* to inspect).
- Whether the unreachable `bl battleObject_chipSelectAnimTick_8029C08` was actually emitted in ROM or
  is a stray emitted by the disassembler after the bx — no callers are listed, so calling context is also
  unknown.
