name: battle_startBattleIntro
address: '0x08009658'
kind: function
status: probable
summary: 'Battle-state phase-4 handler: init spawns a type-4 object and enemy objects, pauses, applies
  navi stats, plays encounter BGM; subsequent frames run sub_80096E0 then poll bit 2 of unk5c and dispatch
  the intro-finished transition to the next state.'
interface: (r5 = battle state) -> updates oBattleState_SubPhaseInitFlag, State4EventCount, StatePhase,
  Index_01; r0 = 0/1
details: 'Runs once (init half): reads the battle-effects bitmask; if bit 0x400 is set it increments State4EventCount,
  otherwise copies BattleSettings+5 into it, then spawns the enemy objects via battle_SpawnEnemyObjects_8007358,
  calls PauseBattle, applies the navi stat table entry, and plays the BGM — song 0x15 if effect bit 8
  is set, else BattleSettings+2, skipped when it equals 0x63 — before setting SubPhaseInitFlag = 4. On
  later frames it runs sub_80096E0 once (StatePhase = 4) and polls bit 2 of battle_getStateUnk5c_800139A;
  when set it calls dispatch_801DA48(1) and sets eStruct request bits, then stores 4 (or 0x24 if event
  flag EVENT_1735 is set) into Index_01 and clears StatePhaseAndInitFlag to advance the state machine.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: init half calls battle_SpawnEnemyObjects_8007358, PauseBattle, PlayMusic — classic battle-start
    sequence; effect bit 8 selects song 0x15 else BattleSettings+2, with 0x63 meaning 'no BGM change';
    loop half waits on battle_getStateUnk5c_800139A bit 2 before dispatch_801DA48(1); sets State4EventCount
    from BattleSettings+5 or an increment, depending on effect bit 0x400; Index_01 = 4 vs 0x24 selected
    by story flag EVENT_1735
  refs:
