name: object_phaseStealPanels
address: '0x080E6600'
kind: function
status: probable
summary: Battle-object phase handler that on first run XORs the object's Alliance with 1 and claims its
  PanelX/PanelY tiles for the opposite alliance via object_setPanelAlliance + object_setPanelAllianceTimerLong
  (0x708), then stores Timer=0x13 and PhaseInitialized=4. Each subsequent frame it decrements Timer; on
  expiry it clears CurAnim, plays sound effect 0x12A (0x2b + 0xff), sets CurAction=4, and clears CurPhaseAndPhaseInitialized.
interface: (r5 = battle object pointer, no args) -> void; r0 clobbered by calls
details: A per-object phase routine keyed off oBattleObject_PhaseInitialized. On first run it reads the
  object's PanelX/PanelY and Alliance, XORs the alliance with 1, and calls object_setPanelAlliance to
  claim the panels at those coordinates for the opposite alliance, immediately refreshing them with object_setPanelAllianceTimerLong
  (0x708). It then stores Timer = 0x13 and sets PhaseInitialized = 4. On subsequent frames it decrements
  Timer; when it reaches 0 it resets CurAnim to 0, plays sound effect 0x2C (0x2b + 0xff), sets CurAction
  = 4 (idle/fallback action), and clears CurPhaseAndPhaseInitialized. The panel claim for the flipped
  alliance plus the timed revert pattern matches a panel-stealing/capture trap or boss mechanic that holds
  stolen tiles for a while.
