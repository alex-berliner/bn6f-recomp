name: handlePanelDamage_8013F1E
address: '0x08013F1E'
kind: function
status: confirmed
summary: After a hit lands, sums the three panel-damage slots on the attacker's collision record; if any
  damage was dealt, updates the AI's "did damage" latch and dispatches to the per-alliance damage handler
  (null for one team, sub_8013F82/F8C/F96 for the others).
interface: 'void handlePanelDamage_8013F1E(u32 obj /* r5 */);

  /* reads r5, returns nothing; flags NZVC clobbered */

  '
details: "- Called from the per-hit dispatcher for an attacker battle object whose pointer arrives in\n\
  \  r5.\n- First gate: object_getFlag2(obj) must have bits 0x104 set (the \"this object can take\n  damage\"\
  \ / hit-this-frame mark).\n- Second gate: the object's CollisionDataPtr->FlagsFromCollision must be\
  \ non-zero, i.e.\n  some collision actually occurred.\n- Third gate: the sum of the three panel-damage\
  \ slots PanelDamage1/3/5 (each slot packs two\n  targets; +0, +4, +8 from the PanelDamage1 base) must\
  \ be non-zero.\n- If all three gates pass, the AI's oAIData_Unk_1c byte is touched:\n    * prevent_anim\
  \ == 0 -> cleared to 0\n    * prevent_anim != 0 -> if already 1, bail; else set to 1. Acts as a one-shot\
  \ latch\n      per attack animation.\n- Then reads the attacker's alliance byte via\n  GetBattleNaviStatsByte_AllianceFromBattleObject(obj,\
  \ 0x16), multiplies by 4, and jumps\n  through off_8013F70 to one of: nullsub_46 (index 0), sub_8013F82\
  \ (1), sub_8013F8C (2),\n  sub_8013F96 (3). The bx uses +1 offsets, so each entry is a Thumb switch\
  \ target.\n- The misaligned `add r1, #oCollisionData_PanelDamage1` followed by three loads at +0/+4/+8\n\
  \  from that base is the implementation of summing the three packed damage slots.\n- Empty bodies (early\
  \ returns via pop {pc}) match the \"no damage dealt this hit\" path:\n  nothing to do, do not touch\
  \ the AI latch, do not dispatch.\n"
