open_questions:
- Which alliance maps to which handler (0 = nullsub_46; 1/2/3 = the three sub_ handlers), and what each
  of sub_8013F82 / sub_8013F8C / sub_8013F96 actually applies (panel break, elemental panel effect, aura,
  etc.).
- Exact meaning of bit 0x104 in object_getFlag2 (two-bit field covering the "can be hit" mark; one bit
  may be the per-frame hit flag the function itself sets elsewhere).
- Exact meaning of oAIData_Unk_1c and oBattleObject_PreventAnim - the latch here looks like "this navi
  has already reacted to a hit during the current attack animation", preventing a duplicate reaction when
  prevent_anim is set.
- Whether oCollisionData_FlagsFromCollision is the "any panel hit occurred" mask or also encodes which
  panel type was struck (the panel-damage slots imply at least the former).
