- method: assembly-reading
  date: '2026-10-18'
  detail: 'movflag EVENT_BE4/EVENT_BE5 + bl ClearEventFlagFromImmediate clears the event''s own story
    flags; bl ZeroOWPlayerNaviPaletteIndex and bl owPlayer_clearInteractionLocked_809e23c reset the overworld
    player after the event; ldr r1, off_808F5D4; strb r0, [r1,#0x1c] zeroes an event-struct state byte
    at 0x200032C; mov r0, #0; pop {pc} always returns 0, fitting a completion-status callback; callees
    are all one-shot resets (no gameplay logic), consistent with tear-down'
