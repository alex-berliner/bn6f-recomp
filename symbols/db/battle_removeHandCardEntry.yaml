    (halfwords) and [p+0x3E],[p+0x44] (bytes) to p, then p += 2 on both sides (shift left by 2); ldr r6,
    dword_800B82C (=0xFFFF) and cmp r2, r6 / bne loop: terminates after the 0xFFFF end marker is copied'
