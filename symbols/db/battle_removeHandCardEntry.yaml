open_questions:
- No callers known, so the exact r0/r1 semantics (slot index vs. raw pointer, entry index vs. byte offset)
  are inferred from getBattleHandAddr alone
- What the halfwords at +0x0E..+0x32 and bytes at +0x3E/+0x44 mean in the 0x50-byte hand slot structure
  (card IDs, selected flags, animation/timer data?) is not shown here
- Whether the loop can read past the 0x50-byte slot if 0xFFFF is never found within it
