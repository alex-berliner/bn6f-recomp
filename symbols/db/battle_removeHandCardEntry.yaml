name: battle_removeHandCardEntry
address: '0x0800B762'
kind: function
status: probable
summary: Deletes one entry from a battle hand slot by shifting the slot's data left by 2 bytes until the
  0xFFFF end marker is reached.
interface: (r0 = battle hand slot index (for getBattleHandAddr), r1 = halfword entry index within the
  slot) -> void; no return value, flags clobbered.
details: Computes r4 = r1*2 and gets the hand slot address (array at 0x20349C0, 0x50-byte strides via
  getBattleHandAddr_8010018). Destination pointer = slot + r1*2, source = destination + 2, so the routine
  closes a 2-byte gap at entry r1. Each iteration copies the halfwords at +0x02, +0x0E, +0x1A, +0x26,
  +0x32 and the bytes at +0x3E and +0x44 from source to destination, then advances both pointers by 2;
  together these cover the even offsets of the slot, so it is an unrolled shift of the whole remaining
  slot content. The loop ends once the halfword read at +2 (the just-shifted field) equals 0xFFFF (loaded
  from dword_800B82C), meaning the terminator entry has been moved up too. This matches removing a used/discarded
  card from the battle hand and compacting the list; the scattered fixed offsets (+0x0E/+0x1A/... spaced
  0xC, plus bytes at +0x3E/+0x44) suggest per-card or per-slot metadata stored at fixed positions that
  gets shifted along with the IDs.
