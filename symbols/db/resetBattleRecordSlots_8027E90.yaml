name: resetBattleRecordSlots_8027E90
address: '0x08027E90'
kind: function
status: confirmed
summary: Initializes the 12-entry battle-record slot array from a ROM template and sets the panel-mode/panel-flag
  header bytes based on the current battle mode.
interface: 'void resetBattleRecordSlots_8027E90(u32* slotArray)  // in: r4=slot array base; clobbers r0..r3,
  r6, lr; preserves r4, r5; sets NZCV'
details: "Clears 12 slots of size 0xC at the pointer in r4, copying a 4-byte panel-id pointer\nfrom each\
  \ entry of the ROM template table at dword_802A7CC into slot[+0] and zeroing\nslot[+4] and slot[+8].\
  \ Then branches on the result of GetBattleMode():\n  * If mode == 1 (single-player): only when BATTLE_CONFIG_PTR+0x4\
  \ (a \"0/non-zero\" flag\n    at byte_20349A4) is zero, writes 3 to slot_array[0x84] (PANEL_MODE).\n\
  \  * Otherwise: if sub_8029FB4() returns true, writes 2 to slot_array[0x84] and\n    sub_802A57E()'s\
  \ truth value (inverted: true->0, false->1) to slot_array[0x8B]\n    (PANEL_FLAG).\nr6 is used purely\
  \ as a scratch byte for the second-branch flag. The final return value\nis the address one past the\
  \ last slot (r4 + 12*0xC).\n"
