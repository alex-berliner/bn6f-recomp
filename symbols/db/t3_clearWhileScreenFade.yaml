name: t3_clearWhileScreenFade
address: '0x08126F94'
kind: function
status: probable
summary: Zeroes three bytes of a struct at r5 while a screen fade is in progress, otherwise does nothing.
interface: (r5 = struct pointer, set by caller; no args in r0-r3) -> r0 clobbered; ZF from IsScreenFadeActive
  leaks through on the early-return path
details: Calls IsScreenFadeActive and returns immediately if the branch is taken; otherwise stores 0 into
  bytes at r5+1, r5+2 and r5+3, clearing three consecutive flag/counter fields of the caller's struct.
  The struct base comes from r5, so this is a leaf helper meant to be called with r5 already pointing
  at some per-entity/per-object state. The ZF set by IsScreenFadeActive is still live at locret, so callers
  could also branch on it after the call. No other registers or memory are touched.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl IsScreenFadeActive at 0x8126F98 is the only call; result is used solely for a beq early return;
    three strb r0,[r5,#1..3] with r0=0 clear bytes 1-3 of the r5 struct; no other writes or calls, so
    the whole effect is the conditional three-byte zeroing; no known callers, so r5's struct type and
    the fade-polarity convention are not confirmed
  refs:
  - bn6f/asm/asm33.s:7998
  - 0x080062F8 IsScreenFadeActive
  reproduce: python3 tools/asmcat.py 0x08126F94
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
- which structure r5 points to (object, sprite, t3?) — a caller would identify it
- polarity of IsScreenFadeActive's ZF (active vs inactive), which decides whether the clear happens during
  or outside fades
- what bytes +1..+3 mean in that struct (counters, state flags, timers?)
