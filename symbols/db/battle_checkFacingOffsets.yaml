name: battle_checkFacingOffsets
address: '0x080265D0'
kind: function
status: probable
summary: Walks a 0x7F-terminated table of signed tile offsets, mirrors each by the object's facing direction,
  and returns nonzero as soon as a checker on the resulting relative tile succeeds.
interface: (r0 = arg pushed to stack; r6 = base object/pointer, r7 = checker arg, custom ABI) -> r0 =
  first nonzero checker result, else 0
details: 'The function is a scan loop over the byte table byte_8026735: each signed byte is multiplied
  (mul r0, r1) by object_getFrontDirection()''s +1/-1 facing multiplier and added to r6, forming a relative
  address/offset, then sub_8026450(r0, r7, stackArg) is called. If the checker returns nonzero the loop
  exits immediately with that value; reaching the 0x7F terminator byte returns 0. The original r0 is pushed
  and read back as the third checker argument, and r6/r7 are expected to be preset by the caller (non-standard
  ABI), so the six tiny callers at 0x8026650-0x802668A are wrappers that fix up r6/r7/arg before jumping
  here. Semantics beyond ''some per-relative-offset predicate'' depend on sub_8026450, which is unrenamed.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrsb r1,[r4,r1] / cmp r1,#0x7f / beq — table walk terminated by 0x7F sentinel at byte_8026735;
    bl object_getFrontDirection + mul r0,r1 — each offset is mirrored by the battle object's facing side;
    bl sub_8026450 / cmp r0,#0 / bne — early-out on first successful per-offset check; push {r0} ... ldr
    r2,[sp] — original r0 is passed through on the stack as third argument; six 0xA-byte wrapper callers
    (0x8026650..0x802668A) fit the preset-r6/r7 custom ABI
