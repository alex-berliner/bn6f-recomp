name: battle_checkFacingOffsets
address: '0x080265D0'
kind: function
status: confirmed
summary: Scans a facing-offset table, computing candidate positions (frontDirection × offset + base) and testing
  each against the target via sub_8026450 until a hit or the 0x7F terminator is found.
interface: battle_checkFacingOffsets(r0=target, r5=objPtr, r6=base, r7=dir) -> r0 hit/0, r1 r2 r3 side-results;
  sets nz/c/v; preserves r4 r5 r6 r7 lr
details: 'Loads the signed-byte offset table pointer (byte_8026735 via off_80267E8) into r4. Iterates over entries:
  calls sub_8026450(r6_base, r7_dir, r0_target, r5_objPtr) to test whether the current candidate is a valid facing
  target. If non-zero, returns that result immediately (with r1-r3 side-outputs). Otherwise calls object_getFrontDirection
  to get the unit''s facing vector, reads the next signed offset from the table, and if it is not the 0x7F terminator,
  computes the new candidate as front*offset+base and loops. If the terminator is reached, returns r0=0. The target
  (original r0) is stashed on the stack at entry and reloaded each iteration to pass as r2 to sub_8026450. Flags
  after return reflect the final cmp r0,#0.

  '
