name: ai_dispatchAttackHandlerByElement
address: '0x08110714'
kind: function
status: probable
summary: Dispatches an AI attack handler chosen by the element of the AI's pending hit/attack, using a
  per-element jump table.
interface: (r7 = AI attack vars struct, [r7+oAIAttackVars_HitElement] = element index) -> jumps to handler
  = table[element], returns to caller after handler returns; r0 clobbered
details: Loads the HitElement byte from the AI attack-vars struct at r7 and uses it as an index into a
  jump table at off_8110728 (entries like ai_aimRowTargetStartAttack+1). It sets lr to the instruction
  after the branch (mov lr, pc before bx in Thumb), so the selected handler returns here and the function
  then returns to its own caller — a classic computed-call trampoline. The table is the per-element handler
  list; only the first entry (element 0, likely Normal/aim-row-target attack) is visible in the dump.
  No register arguments are forwarded, so the handlers must operate on the shared r7 struct or globals.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement] indexes the handler table (asm lines 3-4); ldr r1,[r1,r0];
    mov lr,pc; bx r1 is a computed call that keeps the caller's return path; table entry ai_aimRowTargetStartAttack+1
    confirms handlers are AI attack routines; called in recorded battle routes (battlesweep, beastsp),
