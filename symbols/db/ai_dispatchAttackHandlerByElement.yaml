name: ai_dispatchAttackHandlerByElement
address: '0x08110714'
kind: function
status: confirmed
summary: Battle AI trampoline that looks up the element-specific attack handler for the hit element stored in the
  AI's variable block and tail-calls it.
interface: void ai_dispatchAttackHandlerByElement(void) — uses r7 as pointer to the AI attack variable block; passes
  r0 = HitElement byte and r1 = handler table entry into the callee; r5, r6, r7, r10 pass through untouched; outputs
  are whatever the element handler leaves in r1, r5, r8-r12; flags nzcv clobbered.
details: Tail-call dispatch for the battle AI's attack processing. Reads the byte at r7+oAIAttackVars_HitElement
  (the element of the hit currently being handled), uses it unshifted as an index into the handler table at off_8110728,
  then performs the classic ARM/Thumb interwork trampoline `mov lr, pc; bx r1` so the handler returns through `pop
  {pc}` back to this function's caller. r5/r6/r7/r10 are deliberately not saved or restored — the caller's live
  context (including the AI variable block pointer in r7) must still be intact inside the handler. Because the target
  comes from a table and the handler's "return value" is the set of live registers r1/r5/r8-r12 it leaves behind,
  this can only be represented as a register-form helper, not a normal C call.
