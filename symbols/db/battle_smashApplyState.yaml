name: battle_smashApplyState
address: '0x0814F9AC'
kind: function
status: confirmed
summary: Stamps a smash-SFX tag onto active battle-object entries whose index bit is set in a supplied mask, guarded
  by a re-entrancy sentinel.
interface: Next battle_smashApplyState(void) — in r0=state_ptr, r1=mask (low 16 bits), r2=tag; out r1=entry pointer
  past loop, r2=0, r3=caller r8, r5-r9 restored, r12=3 if loop ran; clobbers r0, flags
details: "Guards with a \"Smsh\" sentinel (0x68736D53) at state+0x34; skips entirely if mismatch.\nReads entry count\
  \ (u8) at state+0x08 and base pointer (u32) at state+0x2c.\nIterates `count` entries at stride 0x50. For entry\
  \ i, if bit i of mask (truncated to 16 bits)\nis set AND entry byte+0 has bit 7 (active flag, 0x80):\n  - writes\
  \ (tag>>2) into entry+0x13 (smash tag byte)\n  - ORs 0x03 into entry+0 (force-tag bits on the flags byte)\nSets\
  \ sentinel to +1 on entry, restores to original on exit (all paths).\nThe tag value is pre-shifted: r2 lsl 16,\
  \ then lsr 18, yielding the low byte of tag>>2.\nMask is lsl 16 then lsr 16, zero-extending to 16 effective bits.\n\
  Register quirks: the epilogue pops saved r8/r9 into r3/r4 before restoring r8/r9,\nso r3 at return equals the\
  \ caller's r8; r12 retains the loop's constant 3 only when\nthe count was non-zero and the guard passed.\n"
