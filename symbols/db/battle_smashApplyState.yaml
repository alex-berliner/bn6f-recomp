name: battle_smashApplyState
address: '0x0814F9AC'
kind: function
status: probable
summary: Iterates the Smsh-tagged structure's entries and, for each bit set in r1 whose +0x00 flag has
  bit 0x80, stores r2>>2 at +0x13 and ORs 0x3 into +0x00, guarded by a re-entrancy key at +0x34.
interface: (r0 = Smash-manager struct, r1 = 16-bit entry bitmask, r2 = packed state/param byte) -> r0
  = void
details: 'The struct at r0 carries a magic key ''Smsh'' (0x68736D53) at +0x34; the routine increments
  it on entry and restores it on exit, so a re-entrant or nested call sees key+1 and bails out immediately.
  It reads an entry count from +0x08 and an entry array pointer from +0x2C, entries being 0x50 bytes apart.
  For each bit set in the r1 mask (LSR #0x12 on the r2 argument also packs r2>>2 into r6), if the entry''s
  byte at +0x00 has bit 0x80 set, it writes r6 (= r2>>2, six bits) to +0x13 and ORs 0x3 into the +0x00
  flag byte. Bit 0x80 at +0x00 looks like an ''active/valid'' flag, and the low two bits set to 3 look
  like a state field (e.g. smashed/broken terrain or hit-state). The magic string ''Smsh'' and the state-3
  write strongly indicate the battle smash (panel-breaking) mechanic.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'dword_814FA10 = 0x68736D53 = ''Smsh'', checked at [r4,#0x34] and restored at loc_814FA00 (re-entry
    guard); loop at loc_814F9DC strides r1 by 0x50, iterating count from [r4,#0x08] over array at [r4,#0x2C];
    per entry: tests bit 0x80 of [r1], then strb r6,[r1,#0x13] with r6 = r2<<16>>0x12 = r2>>2; orr r0,
    r3 / strb r0,[r1] sets low 2 bits of the entry flag byte to 3; bne loc_814FA04 skips the whole body
    when the ''Smsh'' key does not match (guard failed)'
  refs:
  - bn6f/asm/libs.s:25358
  reproduce: python3 tools/asmcat.py 0x0814F9AC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal well: the ''Smsh'' magic at +0x34, count at +0x08, entry pointer at
    +0x2C with 0x50 stride, bitmask loop in r7, and writing r6 (r2>>2) to +0x13 plus ORing 3 into the
    +0x00 flag byte are all confirmed. However r6 is `r2 << 16 >> 0x12 = r2 >> 2` (unsigned), and `strb
    r6,[r1,#0x13]` stores a byte, so r2 must already be small; the proposal''s ''packed state/param byte''
    in r2 fits but the name `battle_smashSetState` is slightly off since both state (low 2 bits -> 3)
    and a separate value (>>2 -> +0x13) are written. A more accurate name is `battle_smashApplyState`.;
    run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
