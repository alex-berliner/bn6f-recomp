name: battle_advanceAnimCounters
address: '0x0801D450'
kind: function
status: probable
summary: Advances a two-digit base-6 frame counter in a battle object, frozen while the battle is paused
  or time-stopped.
interface: (r5 = object/work struct with counter fields) -> r0 clobbered; no return value, flags not meaningful
  to caller
details: Reads the battle-paused flag and the time-stop flag and returns immediately (leaving the counters
  untouched) if either is active. Otherwise it increments the halfword at [r5,0x34]; when it reaches 6
  it wraps to 0 and increments the halfword at [r5,0x36], which also wraps 5→0. The pair therefore forms
  a 0–5/0–5 counter cycling every 36 unpaused frames, stored in two halfword fields of the struct at r5.
  Typical of a battle animation/phase timer that must respect pause and time-stop.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_isPaused / tst+bne: early exit while paused (0x0801D454–0x0801D45A); bl battle_isTimeStop
    / bne: also early exit during time-stop (0x0801D45C); ldrh r0,[r5,#0x34]; add #1; cmp #6; blt: inner
    counter counts 0–5 (0x0801D460); ldrh r1,[r5,#0x36]; add #1; cmp #6; blt; mov r1,#0: outer counter
    wraps 5→0 only when inner overflows (0x0801D46A)'
