name: battle_spawnSelfPanelCollisionRegion
address: '0x080D020E'
kind: function
status: probable
summary: Wrapper that spawns a collision region on the battle object's own panel using its element, presumably
  so the object itself can hit/interact with players.
interface: (r0 unused on entry; r5 = battle object) -> calls object_spawnCollisionRegion(panelX, panelY,
  element, size=0x100000, flags=0x4050604, damageStamina=object field, kind=3)
details: Loads oBattleObject_PanelX, PanelY and Element from the battle object in r5 and forwards them
  as the new region's position and element. The constant 0x10 shifted left 16 is passed in r3, likely
  a fixed-point size/radius for the region. r4 gets 0x4050604 (probably flags or a callback pointer for
  the region) and r6 passes through the object's DamageAndStaminaDamageCounterDisabler field, so hits
  by this region likely register with the object's damage stats. r7 = 3 is likely a region type or lifetime
  selector consumed by object_spawnCollisionRegion. The function preserves only r4/r6/r7, so it is a thin
  parameterized spawn helper for this object's behavior step.
