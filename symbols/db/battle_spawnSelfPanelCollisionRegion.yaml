name: battle_spawnSelfPanelCollisionRegion
address: '0x080D020E'
kind: function
status: confirmed
summary: Spawns a collision region covering the battle object's own panel, parameterized by the object's element.
interface: 'u32 battle_spawnSelfPanelCollisionRegion(BattleObject* obj /* r5 */) ; preserves r4, r6, r7; returns
  r5 as left by object_spawnCollisionRegion; clobbers r0-r3, lr, flags

  '
details: 'Tail wrapper around object_spawnCollisionRegion for the common "hitbox over my own tile" case. Reads the
  object''s PanelX (byte), PanelY (byte), Element (byte), and the DamageAndStaminaDamageCounterDisabler field (word)
  from the BattleObject in r5 and passes them as the callee''s r0/r1/r2/r6. Hardcoded arguments: r3 = 0x100000 (0x10
  << 16, likely a lifetime or size fixed-point constant), r4 = pointer 0x4050604 (collision region descriptor table
  entry), r7 = 3 (region size, i.e. 3x3 or extent 3 covering one panel and neighbors). r5 is forwarded unchanged
  as the callee''s object argument; its outgoing value is whatever object_spawnCollisionRegion leaves in r5. Preserves
  r4/r6/r7 via push/pop and does not touch flags intentionally (nzcv listed as clobbered by the callee path).

  '
