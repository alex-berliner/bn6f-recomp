name: spawnParamDimRegion
address: '0x080E9F64'
kind: function
status: probable
summary: Spawns a dimming collision-region object configured from the calling battle object's Param1/Param2/Element
  fields, with a per-Param3 variant word from a small lookup table.
interface: (r5 = battle object ptr, r4 = obj ptr base) -> r0 = spawned object; no flags of note
details: Reads oBattleObject_Param3, multiplies by 4, and indexes byte_80E9F8C to get a 32-bit word (values
  0x1, 0x1001, 0x2001, 0x3001 — byte-pairs 1 / 0,0x10..0x30) into r7. It then packs r0=Param1, r1=Param2,
  r2=Element, r3=0, and pushes r4=0xB05FF01, r6=(oBattleObject_StaminaDamageCounterDisabler<<16), r7=table
  word as stack arguments to object_spawnDimmingCollisionRegion, returning its result. The table is a
  4-entry array of {u8, u8, u16} records selected by Param3, whose second byte steps by 0x10 — likely
  a size or offset in half-panels/pixels per variant. The 0xB05FF01 word looks like a packed template/ID
  pair for the spawned region object. Effectively a thin parametrized wrapper over the dim-region spawner
  for an attack or trap whose variant comes from Param3.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_Param3]; lsl r0,#2; ldr r7,[r1,r0] selects one of 4 words in byte_80E9F8C;
    r0/r1/r2 loaded from oBattleObject_Param1/Param2/Element, i.e. attack-object parameter fields; push
    {r4,r6,r7} with r4=0xB05FF01, r6=StaminaDamageCounterDisabler<<16 forms stack args to the callee;
    only callee is object_spawnDimmingCollisionRegion, whose summary says it spawns a timestop-resistant
    collision-region object; table entries 0x1,0x1001,0x2001,0x3001 step by 0x10 in one byte, consistent
    with per-variant geometry
