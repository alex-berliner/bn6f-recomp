open_questions:
- Exact meaning of r0 (never read by this function)
- Whether r1/r2 at the call to sub_81202B4 carry extra meaning (e.g. array length vs. buffer pointers)
- Full contents of the off_8120270 bank table beyond the two known chip-name banks
- Why id 0 maps to entry 0x31 of the default script — caller sub_812D934 is unanalyzed
- The proposal's interface, role, and behavior (splitting bank/index, table lookup, 0x200 tile base, max
  8 chars expand into two u16 arrays via sub_81202B4) match the code, including the r4==0 fallback reading
  off_8120278 (eTextScript201BA20) with index 0x31. However the name prefixes tile indexing with 't3'
  while the callee manipulates tile attributes as (r3<<12)|0x200, which is consistent with chatbox/text
  rendering rather than a generic t3 helper.
