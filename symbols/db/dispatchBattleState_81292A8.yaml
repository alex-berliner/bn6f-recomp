name: dispatchBattleState_81292A8
address: '0x081292A8'
kind: function
status: confirmed
summary: Dispatches to a battle state handler via a 7-entry jump table indexed by the sub-state byte at
  [r5+2]
interface: '/* trampoline: all guest registers and flags are forwarded to the callee */

  void dispatchBattleState_81292A8(void /* r5 = state object */);

  '
details: 'Reads the sub-state selector byte from [r5+2] (r5 is the battle state object).

  Uses that byte as an offset into a 7-entry jump table (off_81292BC) of

  Thumb function pointers (sub_81292D8, sub_812933C, sub_8129400, sub_8129454,

  sub_812952C, sub_812954C, sub_812956C). Loads the selected handler into r0

  with the raw byte offset preserved in r1, then tail-calls via `mov lr, pc;

  bx r0` and re-enters via `pop {pc}`. All caller-provided registers and flags

  pass through unchanged to the selected handler — no work is done in this

  function other than the dispatch.

  '
