name: sub_801DC06
address: '0x0801DC06'
kind: function
status: hypothesis
summary: Looks up an entry by 32-bit id in a fixed 6-slot, 8-bytes-per-slot work table and patches two of its bytes,
  returning 1 if no entry with that id exists.
interface: int sub_801DC06(u8 value /*r0*/, u8 amount /*r1*/, u32 id /*r5*/); returns r0 = value and r1 = amount
  - 8 on a hit (flags from subs r1,#8), or r0 = 1 (flags from mov) when no slot matches; r4/r6/r7 preserved, r2
  ends as the last 'in use' flag byte read, r3 as the remaining slot count
details: 'Scans a 6-entry registry rooted at dword_20352E0, 8 bytes per entry:

  +0 = "in use" flag byte (must be nonzero to consider the slot), +4 = id

  word compared against the id passed in r5. On a match it stores the r0

  byte at entry+1 and (r1 - 8) at entry+2, then returns r0 = value and

  r1 = amount - 8. If all six slots are exhausted without a match, it

  returns r0 = 1 as a failure marker. The caller-supplied id in r5 and the

  preserved callee-saved r4/r6/r7 suggest this sits inside a larger routine

  (r5 is not touched by this stub). The subtraction of exactly 8 from the

  second byte before storing is the most game-specific detail; without

  knowing what owns dword_20352E0 the units of "amount" (count? timer?

  currency in some scale?) are unclear. r4/r6/r7 being pushed but unused

  inside the routine points at it being a helper inlined-caller contract

  rather than an independent gameplay block.

  '
