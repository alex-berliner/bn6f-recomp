name: t4_delayedScreenScrollFade
address: '0x0813838C'
kind: function
status: probable
summary: Counts down a frame timer on some object; when it hits zero, writes fixed screen-scroll values
  into the toolkit RenderInfo and triggers a screen fade, then moves the object to its next state.
interface: '(r5 = object: u16 timer at +4, u8 state at +1) -> void; no return value'
details: This is a per-frame delay step in a state-machine object. It decrements the halfword at [r5+4];
  while it is still >0 it just returns. On expiry it loads the toolkit's RenderInfo pointer via oToolkit_RenderInfoPtr
  and writes constant halfwords 0x1240, 0x1D00 and 0x1E89 to RenderInfo+0, +6 and +8 (fixed-point screen/BG
  scroll or camera position fields), calls SetScreenFade(8, 4) to start a fade, zeroes the timer, and
  stores 4 into the state byte at [r5+1] so the object's next step runs. The magic constants suggest it
  snaps the view to a predetermined spot — likely part of a cutscene or area transition.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r5,#4]; sub r0,#1; strh; bgt locret — frame countdown stored in object field +4; ldr
    r0,[r10,oToolkit_RenderInfoPtr] then strh 0x1240/0x1D00/0x1E89 into +0/+6/+8 — fixed scroll/camera
    position write; bl SetScreenFade with r0=8, r1=4 — starts a fade after the delay; mov r0,#4; strb
    r0,[r5,#1] — advances object's state byte to 4, then resets timer to 0; no known callers, so the identity
    of the r5 object (task/event step) is not confirmed
  refs:
  - bn6f/asm/asm36.s:17395
  - 0x08006270 SetScreenFade
