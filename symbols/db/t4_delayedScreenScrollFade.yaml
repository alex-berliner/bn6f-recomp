    run wf investigate investigate-20261019-030611'
open_questions:
- which structure r5 is (task/event object) and which subsystem runs it — need a caller that dispatches
  on [r5+1]
- exact meaning of RenderInfo fields +0/+6/+8 (scroll vs camera) and the semantics of SetScreenFade's
  (8, 4) arguments
