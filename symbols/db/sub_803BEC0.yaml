name: sub_803BEC0
address: '0x0803BEC0'
kind: function
status: confirmed
summary: Expand a static table of text-script word indexes into per-byte 8-byte command records in a RAM buffer.
interface: void sub_803BEC0(void /* reads off_803BF18 list, TextScript87E36F8, writes unk_2024A00 buffer, returns
  via lr with r4-r7 preserved */);
details: "Iterates an entry table at off_803BF18 (pairs of (output_ptr in unk_2024A00, word_index))\nuntil an output_ptr\
  \ is NULL. For each entry it resolves the matching word in\nTextScript87E36F8 (text at 87E36F8) by indexing an\
  \ offset table with the supplied\nword_index*2, then walks that text byte-by-byte emitting one 8-byte record into\
  \ the\noutput buffer:\n\n  +0: u16 = 0x0002 (command type id)\n  +2: u8  = source byte (the opcode)\n  +3: u8\
  \  = 0xE5 for single-byte opcodes, second source byte for 0xE4 (two-byte)\n  +4: u8  = 0xE6 (terminator marker)\n\
  \  rest of 8 bytes unused\n\nThe walk stops on a source byte == 0xE6, at which point the function writes a final\n\
  0xE6 marker at offset +2 (i.e. signals end of this record stream) and advances to the\nnext entry. Opcodes 0xE4\
  \ are recognised as a two-byte form (consumes 2 source bytes,\nwrites both into the record); all others are single-byte.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
