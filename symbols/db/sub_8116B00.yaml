name: sub_8116B00
address: '0x08116B00'
kind: function
status: confirmed
summary: Initializes a battle sub-member sprite (PET Navi / team variant) by setting team byte, animation, palette,
  priority, coordinates, and dispatching its variant update.
interface: void sprite_initBattleVariant_8116B00(u32 *sprite /*r5*/, u32 *player_slot /*r7*/)
details: 'Writes a team identifier byte at sprite offset 0 (0x23 default, 0x43 if the kind field at offset 4 is
  non-zero). Calls the sub-record initializer at loc_8002774. Picks animation index from sprite offset 4; if that
  value is 3 and GetCurPETNavi() returns non-zero, overrides to animation 8 (the active PET Navi). Loads animation
  data (which may relocate the sprite slot pointer via r5 output). Disables shadow, sets palette bank 0xD, palette
  1, priority 0, stores slot-list halfword 0x350, and clears sub-record field A. Sets frame state to 4/0 at offsets
  8/9. For coordinates: if offset 5 is non-zero (team-flagged sprite), reads a per-kind Y table at byte_8116BEC
  indexed by offset 4 * 2; X is 0x1E when the sprite''s kind matches the player slot''s kind, else 0x16. Otherwise
  X=0x16, Y=0x20. Marks sprite visible at offset 0xD=1 and offset 0xC=0. Finally calls sprite_dispatchVariantUpdate_8116B9C,
  whose outputs (r2, r3, r5, r10, r11) become this function''s outputs.

  '
