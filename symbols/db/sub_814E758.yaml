name: sub_814E758
address: '0x0814E758'
kind: function
status: confirmed
summary: Advances a sound channel's script stream to read the next target pitch, then scans the channel's active-note
  list to mark the first matching unplayed note as dispatched.
interface: void snd_dispatchChannelNote_814E758(/* r1 = */ uint32_t chan);  /* r4, r5 preserved; clobbers r0-r3,
  flags */
details: 'Reads the byte at *(chan+0x40) (script read pointer). If that byte < 0x80 it is treated as a new pitch:
  stored at chan+5 and the pointer is advanced by 1. If >= 0x80 the stream is considered halted and the previously
  stored pitch at chan+5 is reused. The resulting pitch byte is called "key". The function then walks the linked
  note list whose head is at chan+0x20. Each note entry has a flag byte at offset 0x00 (bits 0x83 = quality/eligible,
  bit 0x40 = already played), a pitch byte at 0x11, and a next-node pointer at 0x34. A self-referencing next pointer
  (node->next == node) is zeroed and treated as list end. The first note that is eligible (quality bits set), not
  yet played (0x40 clear), and whose pitch matches key gets bit 0x40 set. Only one note per call is flagged. r4/r5
  are pushed and popped, so callers relying on them are unaffected.

  '
