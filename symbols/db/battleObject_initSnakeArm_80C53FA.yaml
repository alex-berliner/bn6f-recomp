open_questions:
- The exact game element this represents (Snakeman/Sword-style "arm" part vs. generic helper arm) isn't
  named in-source; the address label and the name table at 0x80C54D0 containing 0x14 at index 10 hint
  at "Snakeman long arm" but couldn't be confirmed.
- Why ExtraVars+4 is given the constant 0x80 (and not Param2*something) is unclear — possibly a latch
  for "armed this frame".
- The Param4==1 special branch (table indexed by Param4*4 looking up 4 at offset 8 and 0x14 at offset
  0x28) appears to add a panel-level x-shift on top of front dir — purpose not labelled.
