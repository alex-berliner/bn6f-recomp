name: Sio32IDInit
address: '0x0814CCFC'
kind: function
status: confirmed
summary: Initializes the GBA serial I/O hardware into multiplayer-link mode, readying the link-cable ID buffer before
  the handshake begins.
interface: void linkCable_sio32Init_814CCFC(void);
details: 'Runs at the very start of the SIO32 (multiplayer-link) bring-up. Disables master IRQs while it clears
  the multiplayer-SIO enable bit (computed as 8 << save-data multiplayer id, read from A_dword_2010CCC + 0xA) and
  the generic SIO bit 0x80 from A_InterruptEnableRegister, then re-enables master IRQs. Switches A_SIOModeSelect_GeneralPurposeData
  to 0 (general-purpose data mode) and programs RCNT (= A_InterruptEnableRegister - 0xD8) to 0x1000, then ORs in
  0x4080 to enter multiplayer mode with parent-to-child transfer enabled, using the original read-modify-write sequence.
  Zero-fills the 12-byte link ID buffer at A_byte_2010CD0 via SWI_CpuSet (a 3-u32 stack-source copy) and finally
  acknowledges the SIO interrupt by writing 0x80 to A_InterruptRequestFlags_IRQAcknowledge. Called once during link
  initialization; no registers are meaningful on input or output (only r4/r5 are saved and restored around the stack
  frame).

  '
