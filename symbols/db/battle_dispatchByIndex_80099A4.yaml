name: battle_dispatchByIndex_80099A4
address: '0x080099A4'
kind: function
status: confirmed
summary: Dispatches to the current battle phase's handler, selected by the battle state's phase index into a jump
  table.
interface: void battle_dispatchPhaseHandler_80099A4(BattleState* r5); // tail-calls handler(r0=index, r1=table entry)
  with caller's r2-r7,r10 live; results returned as pass-through registers r2-r6,r8-r12
details: 'Reads the byte at battle state + oBattleState_Index_01 (r5 is the battle

  state pointer) and uses it directly as the byte offset — already 4*phase

  number, not a plain phase number — into the jump table at off_80099B8,

  then tail-calls (mov lr, pc; bx r1) the selected handler. The handler

  receives the phase index in r0 and its own table entry in r1; the

  dispatcher''s caller''s r2-r7 and r10 argument registers are still live at

  the call, and the register state the handler leaves in r2-r6 and r8-r12

  is exactly what the dispatcher''s callers observe, so this is a pure

  pass-through dispatcher. Table entries: phase 0

  battle_advanceIndexFromPauseIntro_80099E0, phase 1 sub_8009A88,

  phase 3 battle_runBattleStep_8009B20, phase 4 sub_8009BAC, phase 5

  battle_subphaseFadeOut, phase 9 rfu_stepShowNaviCommError (the

  navi-comm-error screen step), phases 2/6/7/8 are NULL (unused phases).

  Quirk: the Index_01 field stores a byte offset, not an index, so any

  code writing it must multiply the phase number by 4.

  '
