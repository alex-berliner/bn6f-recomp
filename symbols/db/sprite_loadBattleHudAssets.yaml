name: sprite_loadBattleHudAssets
address: '0x08130108'
kind: function
status: probable
summary: Loads battle HUD sprite tiles, palettes, and compressed graphics by building the init-ref table,
  fetching two fixed assets, then decompressing an inline 12-byte-entry table into VRAM, OAM sprite slots,
  and a 0x20-byte palette.
interface: () -> void; no meaningful flags
details: Calls decomp_buildInitRefTable_812AF3C to build the 0x64-byte reference table at unk_201D020,
  then loadDecompressedAsset_812AF78 (off_812B0E8 reference) and sub_812AFA4 (byte_812B1C0 blob) to load
  two fixed assets, and finally decompAndCopyData with an inline 12-byte-entry table. The table decompresses
  COMPRESSED_PTR_FLAG-tagged blobs into 0x6014980 (VRAM), eGuiSprite2022FA0, eGuiSprite2022AA0, unk_202458C/202488C/2024E8C
  (each preceded by staging in eDecompBuffer2013A00), and copies a 0x20-byte palette (byte_86C9D6C) to
  byte_30016D0. All loaded blobs are comp_86xxxxx ROM graphics, so this is the one-shot resource load
  for a specific GUI screen, run before that screen draws.
