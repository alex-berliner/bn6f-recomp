name: battle_objectTickTimer_80E05C4
address: '0x080E05C4'
kind: function
status: confirmed
summary: 'Per-frame tick for a battle object: decrements its timer and destroys it when the timer expires
  or when its frame parameters'' bit 7 is set while the object''s frame-data word is non-positive.'
interface: 'void sub_80E05C4(void);  // uses caller-provided r5 as the battle-object pointer

  '
details: "Takes the battle-object pointer in r5 (per register contract) and is structured as a thin\n\
  wrapper that ends in `pop {pc}` rather than the usual `bx lr`, so it relies on its single\nleaf (sprite_update)\
  \ clobbering r0–r3, lr, and nz/c/v but leaving r4 and r5 alone.\n\nOperates on a battle object of the\
  \ usual oObjectHeader layout. Touched fields:\n  - +oBattleObject_Timer (u16): decremented by 1 each\
  \ tick.\n  - +oBattleObject_FrameData (s16, offset 0x20): signed per-frame data; read with ldrsh.\n\
  \  - +oObjectHeader_Flags (u8): bit 1 cleared on destruction (bic r0, #2).\n  - +oBattleObject_CurStateActionPhaseAndPhaseInitialized\
  \ (u32): set to\n    \"CUR_STATE_DESTROY\" (= 8) on destruction; this is the same self-destruct hand-off\n\
  \    used elsewhere in the battle engine and is consumed by the object dispatcher.\n\nDestruction conditions\
  \ (any one triggers destroy):\n  1. The decremented timer reached 0 (beq loc_80E05E4).\n  2. battle_MirrorRelatedObjectFlag1_80E0616\
  \ reports nothing to veto, AND\n     sprite_getFrameParameters returns a value with bit 0x80 set, AND\n\
  \     the s16 at offset 0x20 (frame data) is ≤ 0.\n\nAlways finishes by calling sprite_update so the\
  \ sprite's animation/pose is advanced\nregardless of whether the object was destroyed this frame. The\
  \ destroy flag is just\nqueued via the cur-state field; sprite_update still runs in the same call.\n"
