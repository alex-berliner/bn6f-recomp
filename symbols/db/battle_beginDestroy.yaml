name: battle_beginDestroy
address: '0x080D239C'
kind: function
status: probable
summary: 'Begins an object''s destruction: dispatches destroy events, clears its collision region and
  panel reservation, nulls the pointee of oBattleObject_ExtraVars, conditionally plays a sound or spawns
  a single effect (silent path) or spawns three jittered effects (visible path), clears collision again,
  and sets CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY.'
interface: (r5 = battle object pointer, r0 unused) -> r0 = ?; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY; no flags guaranteed
details: 'Entry point for an object''s death/removal: it first dispatches the paired destroy sub-event
  (battle_dispatchDestroyEvents_802EF5C), clears the object''s collision region and releases any panel
  it reserved (using FuturePanelX/Y), and zeroes the pointer at oBattleObject_ExtraVars. It then reads
  ObjectFlags2: if bit 0x8000 is clear, it spawns the visual death effects — two AddRandomVarianceToTwoCoords-jittered
  spawns via sub_80E47A4 (r4=0) plus one effect object (r4=1) offset +0x14 from object+0x34 coordinates.
  If bit 0x8000 is set (silent/quiet destroy), no effects are spawned; instead bit pair 0x300000 selects
  either sound 5 (sub_800F90E) or a sub_800F8CE-gated path. Finally it re-clears the collision region
  and writes CUR_STATE_DESTROY into the state/phase field; r4 is clobbered as scratch.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'prologue: bl battle_dispatchDestroyEvents_802EF5C then bl object_clearCollisionRegion — destroy-event
    + collision teardown first; ldrb r0,[r5,#oBattleObject_FuturePanelX/Y]; bl object_removePanelReserve
    — frees the object''s reserved panel; ldr r1,dword_80D2458 (0x8000); tst against object_getFlag2 result
    — branch decides effects vs quiet path; loc_80D23F0: two AddRandomVarianceToTwoCoords+sub_80E47A4
    pairs and spawn_t1_0x0_EffectObject from object+0x34 coords — death particle spawns; mov r0,#CUR_STATE_DESTROY;
    str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] — transitions the object to the
    DESTROY state'
