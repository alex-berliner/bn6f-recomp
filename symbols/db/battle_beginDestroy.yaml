  reproduce: python3 tools/asmcat.py 0x080D239C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and name are directionally correct (dispatches destroy events, clears collision, releases
    panel, spawns effects, writes CUR_STATE_DESTROY), but the detail about ''zeroes the pointer at oBattleObject_ExtraVars''
    is wrong: the code reads the ExtraVars pointer, tests it (tst r0,r0), and if non-zero, writes 0 to
    *ExtraVars (str r1,[r0]) — it doesn''t zero the ExtraVars slot itself. Also, the proposal inaccurately
    says ''only one effect object (r4=1)'' on the silent path; the code shows that sub_800F8CE returning
    1 or other leads to a spawn with r4=1, but the non-jittered spawn uses Z offset 0x14 while the jittered
    ones use Z=0x10, matching the code. A slightly better name would emphasize the transition to CUR_STATE_DESTROY.;
    run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
