details: "Indexed table byte_803B6AC in ROM holds 8-byte background-descriptor entries\nselected by r0 (entry =\
  \ byte_803B6AC + r0*8). Each entry's layout:\n  +0  u16 param0 -> r0 of fillOamTileStripes_8001930 (tile-id base/size)\n\
  \  +2  u8  param1 -> r1 of fillOamTileStripes_8001930\n  +3  u8  jSize  -> r2 of fillOamTileStripes_8001930; doubled\
  \ (x2) for r4 of CopyBackgroundTiles\n  +4  u8  iSize  -> r3 of fillOamTileStripes_8001930; doubled (x2) for r5\
  \ of CopyBackgroundTiles\n  +5  u8  jPos   -> r0 of CopyBackgroundTiles (j offset within 32x32 block)\n  +6  u8\
  \  iPos   -> r1 of CopyBackgroundTiles (i offset within 32x32 block)\n  +7  u8  tileBlock32x32 -> r2 of CopyBackgroundTiles\
  \ (which 32x32 tile block)\nEWRAM buffer unk_2030A00 is used as the scratch tile-id list: built by\nfillOamTileStripes_8001930,\
  \ then handed to CopyBackgroundTiles as tile_ids.\nr10 is forwarded into the first callee (fillOamTileStripes_8001930)\
  \ and\nis not consumed by this wrapper; r4/r5/r6/r7 are preserved across the call.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
