name: battle_objectSpawnStepEffect
address: '0x080BAEC0'
kind: function
status: probable
summary: Spawns a battle-object step-effect (attack object) three frames' worth of positions in front
  of the object based on a step index.
interface: (r0 = step index 0..2, r5 = oBattleObject) -> void; calls sub_80DC4B8 (likely AddObject/spawn)
  with computed panel X = PanelX + facingDir*3 + (stepIndex+1)
details: Reads the object's facing direction multiplier (object_getFrontDirection) and its PanelX, computes
  a target panel column by adding facingDir*3 + (step+1). Then calls sub_80DC4B8 with the oBattleObject
  pointer and these coordinates. The parameter passed in r0 (the step index from Param3) is incremented
  before being reused as the third argument to the spawn call. Likely spawns the three lane-stepped line-attack
  object or a similar moving attack effect.
