    table returns panel X/Y stored into FuturePanelX/FuturePanelY; bl object_reservePanel then mov r0,#OBJECT_FLAGS_CANNOT_SLIDE;
    bl object_setFlag1 — object commits to the chosen panel; CurAnim=4 / StepTimer=4 / HitElement=8 writes
    are the attack windup state; HitElement=0x18 is the failure value; ScratchVar deref writes [0xB]=1
