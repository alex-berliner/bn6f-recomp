name: ai_attackStepTargetPanel
address: '0x080F3472'
kind: function
status: probable
summary: 'AI attack state-machine step: ask a per-alliance callback for a target panel, reserve it, lock
  the object onto it and arm the attack (anim/timer/element), else fail with HitElement=0x18.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = destroyed; on success sets FuturePanelX/Y,
  reserves panel, sets flag OBJECT_FLAGS_CANNOT_SLIDE, CurAnim=4, StepTimer=4, HitElement=8; on failure
  HitElement=0x18
details: Increments oAIAttackVars_SubStepIndex, bails to HitElement=0x18 if object_canMove says the object
  can't act. It then indexes byte_80F34DC by Alliance*8 to fetch two words (r2/r3) and calls the stored
  oAIAttackVars_PanelChooseCallback (via mov lr,pc/bx), which returns success in r0 with r0/r1 = target
  panel X/Y. On success those are written to oBattleObject_FuturePanelX/Y, object_reservePanel claims
  the panel, OBJECT_FLAGS_CANNOT_SLIDE is set via object_setFlag1, CurAnim=4 and StepTimer=4 run a short
  windup, and HitElement=8 records the attack element/type. Once SubStepIndex > 1, a struct pointer in
  oAIAttackVars_ScratchVar (if non-null) gets [0xB]=1 plus the target X/Y at offsets 6/7 — likely activating
  a target marker/warning for the upcoming attack.
