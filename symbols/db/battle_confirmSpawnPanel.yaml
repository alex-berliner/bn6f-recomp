name: battle_confirmSpawnPanel
address: '0x08133C9C'
kind: function
status: probable
summary: 'Confirms a panel selection for placing a battle object: cancels if the same panel is re-picked,
  rejects occupied or blocked spots, otherwise spawns the eStruct records there and advances the handler
  state.'
interface: (uses global context r5; r0 clobbered immediately with slot id 4) -> no return value; writes
  handler state to [r5+0x68] (0, 8, or 0xC) and selection data to [r5+0x1C]/[r5+0x4C]
details: 'Reads work record 4 of the eStructArr2008450 array via getStructFrom2008450; if it exists and
  the panel sum [r5+0x20]+[r5+0x24] equals the previously stored target [r5+0x1C], it treats it as a cancel:
  writes 8 to the eStruct''s status byte, clears bit0 of [r5+0x4C], resets [r5+0x1C] to 0xFFFF, plays
  SOUND_EXIT_SUBMENU and runs text script 0x21, setting state 0xC. Otherwise it scans the 0xFFFF-terminated
  word list at [r5+0x5C..0x60]: if the target panel is already listed it runs script 0xE and sets state
  8 (occupied message). Then sub_81349E8 is polled for a bit-0 flag — if set, it plays SOUND_CANT_JACK_IN
  and either aborts (state 0, byte [r5+3]=4) or runs script 1 (state 8). If the spot is valid, it spawns
  eStruct records from the table at byte_8133154 (skipped once bit0 of [r5+0x4C] is set), records the
  new target in [r5+0x1C], runs battleObject_alignRowOffsetCheckSN3_81353DC, sets bit0 of [r5+0x4C], plays
  SOUND_SELECT_82 and script 0x19, and sets state 0xC.'
