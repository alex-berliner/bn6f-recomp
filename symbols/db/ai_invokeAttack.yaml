name: ai_invokeAttack
address: '0x08103B10'
kind: function
status: probable
summary: Loads the AI attack parameters out of the AIAttackVars struct and invokes the shared attack-execution
  routine.
interface: (r0 = attacker/caller context, r7 = AIAttackVars struct ptr) -> r0 = result of sub_80CF058;
  r2 = InitFlag, and DifficultyTier/Damage/TargetObjectPtr passed via r4/r6/r7
details: 'This is a thin wrapper that reads four fields from the oAIAttackVars struct addressed by r7:
  InitFlag into r2, AiDifficultyTier into r4, Damage into r6, and TargetObjectPtr into r7, then tail-calls
  sub_80CF058 without altering r0. The use of callee-saved r4/r6/r7 to carry arguments suggests sub_80CF058
  is a shared helper that reads its extended parameters from these registers (or the wrapper is a trampoline
  into an inlined call site), which is unusual but consistent across the whole function. The field names
  mark this as part of the enemy/battle AI attack machinery: it takes the staged attack data (target,
  damage, difficulty gating, init flag) and hands it to the common executor. Its only caller sub_8103A20
  and its appearance in recorded battle routes place it in normal battle AI attack dispatch.'
