name: ai_attackAccelXStep
address: '0x080EC2A4'
kind: function
status: probable
summary: 'AI attack step: moves the object along X with per-frame acceleration for a limited number of
  frames, teleporting it offscreen if it leaves valid panels.'
interface: (r5 = battle object ptr, r7 = oAIAttackVars ptr) -> r0 = panel-validity result (also final
  return value via object_isCurrentPanelValid); flags clobbered
details: Clears the object's collision region when oCollisionData_FlagsFromCollision is nonzero, then
  advances oBattleObject_X by oBattleObject_XVelocity and syncs panels (object_setPanelsFromCoordinates,
  object_updateCollisionPanels). While oAIAttackVars_StepTimer is nonzero it decrements it and adds oAIAttackVars_ScratchVar
  to XVelocity each frame, so the object accelerates over its step count. When object_isCurrentPanelValid
  fails, X is reset to 0xDC0000 (apparently an offscreen/parked coordinate) and both oAIAttackVars_StepTimer
  and oAIAttackVars_HitElement are set to 8, ending the dash. No callers are known, so the intended attack
  and the meaning of HitElement=8 remain inferred.
