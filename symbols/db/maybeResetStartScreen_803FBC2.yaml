name: maybeResetStartScreen_803FBC2
address: '0x0803FBC2'
kind: function
status: confirmed
summary: If no screen fade is in progress, runs the title/start-screen reinit sequence (subsystem reset,
  start-screen init, clear and init the start-screen animation control) and sets the render-info LCD control
  to 0x40.
interface: void maybeResetStartScreen_803FBC2(void)
details: 'Guarded by IsScreenFadeActive: when a fade is active the function is a no-op.

  Otherwise it sequences four subroutine calls (sub_8006910,

  startScreen_init_802F530, clear_e200AD04, init_eStartScreenAnimationControl200B1A0_2)

  and then invokes SetRenderInfoLCDControl with the constant 0x40 (LCD control

  register setting for BG mode 0 / forced blank via 0x40 bit pattern in this

  engine). Reads/writes the named external state structs at 0x0200AD04 (e

  start-screen control) and 0x0200B1A0 (start-screen animation control).

  Register contract (per lifter): inputs r10/lr; clobbers NZCV, r0/r1/r3/lr;

  preserves r2/r4. The function only writes the r0 argument and never reads

  back results, matching a void init-style entry point typically called once

  after a screen transition completes.

  '
