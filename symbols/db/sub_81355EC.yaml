name: sub_81355EC
address: '0x081355EC'
kind: function
status: confirmed
summary: Registers the Battle Start battle-script block with the script engine
interface: void sub_81355EC(void); // r5, r10, lr passed through from callee; r5 returned; clobbers nz,c,v r0-r3,
  lr; preserves r4-r7
details: "Thin wrapper that calls sub_8135314 (the script-block registrar) with fixed arguments drawn\nfrom this\
  \ object's literal pool:\n  r0 = word_202A020 (per-battle / runtime script-record scratch area)\n  r1 = off_8135604\
  \ -> {byte_813315C, byte_8133164}  (start/end of a static instruction/data\n         byte pool used as the script's\
  \ source table)\n  r2 = 0xA5  (total script length in bytes)\n  r3 = 0x28  (script step / op count)\n  r4 = byte_8135610\
  \  (8-byte init/header record; values 5 and 6 in the first two words)\nThe context comment in the C draft (\"\
  Register the Battle Start script\") and the byte_813315C /\nbyte_8133164 / 0xA5 / 0x28 / record-with-5-and-6 layout\
  \ match the battle-opening script block\nregistered when a battle initializes. No fields of any C struct are written\
  \ here directly;\nall side effects happen inside sub_8135314.\n"
