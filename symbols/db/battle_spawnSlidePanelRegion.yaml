name: battle_spawnSlidePanelRegion
address: '0x080D1784'
kind: function
status: probable
summary: Spawns an element-tagged collision region on the battle object's current panel, used by the sliding-object
  tick to hit/highlight each panel it passes.
interface: (r5 = battle object) -> r0 = object_spawnCollisionRegion result; reads oBattleObject_PanelX,
  _PanelY, _Element
details: 'Wrapper around object_spawnCollisionRegion: r0=PanelX, r1=PanelY, r2=Element come from the battle
  object in r5; r3=0, r6=0 are passed as zero, r4=0x405FF01 (likely packed region/hit flags) and r7=0x1000
  (likely size or duration) are constants. No state of the caller object is modified. Being argument-free,
  it always acts at the object''s current panel position. The element argument means the spawned region
  inherits the attack''s element (fire/aqua etc.) for weakness interactions.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1/r2 from [r5,#oBattleObject_PanelX/_PanelY/_Element] then bl object_spawnCollisionRegion;
    constants 0x405FF01 and 0x1000 loaded into r4/r7 are fixed flags/parameter words for the region; only
    caller battle_slideToTargetPanelTick highlights panels passed during a slide, matching a per-panel
    hitbox spawn
  refs:
