name: ai_attackAnimHitStep
address: '0x081128FA'
kind: function
status: probable
summary: 'AI attack per-frame handler: if the current animation frame has the 0x80 attribute bit set (a
  hit/impact frame), it switches the battle object to animation 3, resets the AI attack sub-step index
  to 0, sets the attack-step index to 3, and stores 8 into the AI attack-vars hit-element field.'
interface: (r5 = battle object, r7 = AI attack-vars struct) -> void; fields of r7 struct and r5->CurAnim
  written
details: It first reads the current animation frame's attribute byte via sprite_getFrameParameters and
  tests bit 0x80, which evidently marks a 'hit/impact' frame; if not set the function returns immediately.
  On a hit frame it switches the object's current animation to 3 (oBattleObject_CurAnim), clears oAIAttackVars_SubStepIndex
  to restart the sub-state, and calls object_getFlag to get the object's collision flag word. It tests
  that flag against the mask byte at byte_8112998 and stores 1 into oAIAttackVars_AttackStepIndex if any
  bit matches, otherwise 3 — a branch between two follow-up attack states. Finally it always stores 8
  into oAIAttackVars_HitElement, so this attack deals element type 8 on the hit frame. Its use of the
  oAIAttackVars layout and no known static callers suggests it is referenced from an AI attack-step table
  used by enemy scripts in the recorded routes.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_getFrameParameters + tst r0,#0x80 gates the whole body on the frame''s attribute
    bit (asm lines 2-5); strb #3,[r5,#oBattleObject_CurAnim] and strb #0,[r7,#oAIAttackVars_SubStepIndex]
    switch animation and reset sub-state on the hit frame; bl object_getFlag + tst against byte_8112998
    picks AttackStepIndex = 1 or 3; strh #8,[r7,#oAIAttackVars_HitElement] hard-codes the attack''s element;
    oAIAttackVars_* field names imply r7 is the per-attack AI state struct used by enemy attack scripts'
  refs:
  - bn6f/asm/asm32.s:9421
  - 0x0801A166 object_getFlag
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x081128FA
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary''s claim that the function ''sets the hit element'' is wrong: the strh r0, [r7,#oAIAttackVars_HitElement]
    stores 8 unconditionally at the end, not on the hit frame only — the hit-frame gate is only for the
    early return. Also, the branch is not a ''follow-up attack state'' choice based on a mask test; byte_8112998
    = 0x0, so tst r0, r1 is always zero, meaning AttackStepIndex is always set to 3 (the ''beq'' branch
    always taken), never 1. The name ''ai_attackAnimHitStep'' is acceptable but the summary needs correction.;
    run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
