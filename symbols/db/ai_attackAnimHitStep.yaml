open_questions:
- No static caller is known; the AI attack table entry that points here (and thus which enemy/attack this
  is) is unidentified
- The mask byte_8112998's intended value/meaning (comment shows 0x0) is unclear, so the condition distinguishing
  step 1 vs step 3 is unconfirmed
- What element id 8 maps to in the element table is not known from this function
- 'The summary''s claim that the function ''sets the hit element'' is wrong: the strh r0, [r7,#oAIAttackVars_HitElement]
  stores 8 unconditionally at the end, not on the hit frame only — the hit-frame gate is only for the
  early return. Also, the branch is not a ''follow-up attack state'' choice based on a mask test; byte_8112998
  = 0x0, so tst r0, r1 is always zero, meaning AttackStepIndex is always set to 3 (the ''beq'' branch
  always taken), never 1. The name ''ai_attackAnimHitStep'' is acceptable but the summary needs correction.'
