name: object_runBattleAction
address: '0x080D0566'
kind: function
status: probable
summary: 'Battle-object action dispatcher: tears the object down if the battle is over, skips its tick
  during a time-stop, otherwise tail-calls the handler indexed by CurAction in off_80D058C (currently
  only sub_80D0590).'
interface: (r5 = battle object) -> sets r5->CurState = CUR_STATE_DESTROY if battle over, else tail-dispatches
  to action table [CurAction]; r0 = battle-over/time-stop check results
details: Standard battle-object update dispatcher. First it calls battle_isBattleOver; if the battle has
  ended it force-writes CUR_STATE_DESTROY into the object's CurState field (offset oBattleObject_CurState)
  so the object is torn down. Otherwise it calls battle_isTimeStop and returns immediately while a time-stop
  is freezing the battle, so objects do not act during freezes like custom-menu/finish flashes. In the
  normal case it indexes off_80D058C with the object's CurAction byte (oBattleObject_CurAction) and does
  a bx dispatch to the per-action function; the table here has only one entry, sub_80D0590, so this object
  has exactly one action. The object pointer lives in r5, not r0, matching the project's battle-object
  calling convention.
