name: battleObject_decideEnemyYTargetDirection_80CBAFA
address: '0x080CBAFA'
kind: function
previous_names:
- sub_80CBAFA
status: probable
summary: Decides whether the AI's Y-panel target should be above, below, or matching the closest enemy
interface: (r5 = self BattleObject) -> out r1/r5 ; sets self->ExtraVars+4 to 1 (move up), -1 (move down),
  or 0 (same row)
details: "Reads self->Alliance (offset 0x16), XORs with 1 to get the opposing alliance id (0 or 1),\n\
  \  multiplies by 5 and adds 1 to form a row index, then compares that against self->PanelX\n  (offset\
  \ 0x12). If they don't match, the function returns without writing anything.\n  When they do match,\
  \ calls battleObject_findClosestEnemyBattleObject_80103F8 with the\n  flipped alliance, takes the closest\
  \ enemy BattleObject, and reads its PanelY (offset\n  0x13). Compares it to self->PanelY (offset 0x13):\
  \ sets r2=1 if strictly less, r2=0 if\n  equal, otherwise subtracts 2 (r2 = -1). The resulting direction\
  \ code is stored at\n  [r5 + oBattleObject_ExtraVars + 4]. This is consistent with an AI helper that\
  \ wants to\n  move along Y toward/away from the nearest enemy before deciding what to do.\n  Callee\
  \ name battleObject_findClosestEnemyBattleObject_80103F8 takes (r0 = alliance id,\n  r5 = self, r10\
  \ = toolkit) per its contract.\n"
