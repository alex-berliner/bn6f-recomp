    `eor r0, #1` then `mul r0, #5; add r0, #1` builds a "row-of-enemies" panel index for the opposing
    side - `cmp r0, r1; bne locret` against self->PanelX guards work to the row the enemy spawns on -
    `bl battleObject_findClosestEnemyBattleObject_80103F8` looks up the nearest opposing BattleObject
    - `ldrb r0, [r0,#0x13]` reads the result''s PanelY, `ldrb r1, [r5,#oBattleObject_PanelY]` reads self''s
    - the bgt/beq/`sub r2,#2` chain maps to {r2=1, r2=0, r2=-1} - `str r2, [r5,#oBattleObject_ExtraVars+4]`
    (oBattleObject_ExtraVars is at 0x60, so slot 4 is a long) is the visible side effect'
