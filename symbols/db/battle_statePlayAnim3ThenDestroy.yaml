name: battle_statePlayAnim3ThenDestroy
address: '0x080E3930'
kind: function
status: probable
summary: 'Battle-object state handler: plays animation 3 with action 0x10 once, then destroys the object.'
interface: (r0 = unused/scratch, r5 = battle object pointer) -> r0 = clobbered; sets oBattleObject_CurAnim/CurAction/CurPhaseAndPhaseInitialized
  or CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY
details: Reads oBattleObject_PhaseInitialized from the object at r5. If it is 1 (first update of a new
  state), stores anim id 3 into oBattleObject_CurAnim, action 0x10 into oBattleObject_CurAction, and zeroes
  the halfword oBattleObject_CurPhaseAndPhaseInitialized to restart phase counting. If it is 2 (state
  finished), writes CUR_STATE_DESTROY to oBattleObject_CurStateActionPhaseAndPhaseInitialized so the engine
  removes the object. Any other phase value exits without changes. The r5-based access pattern indicates
  it is invoked as a state callback with the object in a fixed register rather than r0.
