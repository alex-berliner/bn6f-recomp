name: setFlagTrue_8118C84
address: '0x08118C84'
kind: function
status: confirmed
summary: Stores 1 (true/set) into the byte whose address the caller passes in r5; a trivial boolean-flag
  setter.
interface: void setFlagTrue(u8 *flag /* r5 */) — returns nothing callers use; clobbers r0 and NZ flags
details: 'Trivial helper: pushes lr, writes the immediate value 1 as a byte to [r5],

  then returns. r5 holds a pointer to a single byte, most plausibly a flag,

  "done"/"active" slot, or state byte in some struct that the caller has a

  pointer to. The C lift notes r0 ends as 1 with NZ set from it, but the

  register contract says callers do not read r0 back, so the write to *r5 is

  the only observable effect. Which struct/field r5 points at depends entirely

  on each call site; this routine itself touches no globals.

  '
