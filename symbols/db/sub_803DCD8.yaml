summary: Stores caller-provided link/companion index and two halfword fields into the global eLinkState struct (used
  to set up a link state configuration).
interface: void setLinkStateFields(u32 linkIdx, u16 field0A, u16 field0E);  // preserves r4-r7, tail-call return
details: "Resolves the global eLinkState pointer via off_803DCE4 (=eLinkState).\nWrites:\n  - R0 (full word) into\
  \ eLinkState+0x1C  (treated as a chosen link/companion object index; overlaps a \"pad\" gap in the camera struct\
  \ view at offset 0x20099D0+0x1C)\n  - R1 (halfword) into eLinkState+0x0A\n  - R2 (halfword) into eLinkState+0x0E\n\
  No reads, no flag usage, no calls. Ends in pop {r4-r7,pc}, so it acts as a tail thunk that itself returns to the\
  \ caller; r4-r7 are preserved for the caller's frame, not produced by this function.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
