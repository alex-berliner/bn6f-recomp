name: battleObject_actionParalyzeSetAnim41
address: '0x08103E06'
kind: function
status: probable
summary: Battle object action handler that runs the paralyze logic and then forces the object's current
  animation to 0x41.
interface: (r0 = battle object, r5 = battle object) -> r0 = destroyed/unknown; no meaningful return
details: The handler pushes r4/lr, tail-calls the known Paralyze action handler (which commits the pushed-back
  position, plays animation 2 and waits out the paralysis counter, shortened by button mashing), then
  stores 0x41 into oBattleObject_CurAnim of the object kept in r5 before returning. Because the call clobbers
  r0-r3 and this routine still relies on r5, r5 must already hold the battle object pointer on entry.
  Without any known caller it is unclear which entity or state selects this variant; the 0x41 animation
  id is what distinguishes it from the plain paralyze handler.
