name: object_timerFadeStateTick
address: '0x080270EA'
kind: function
status: probable
summary: Per-tick handler that drains a field for 8 ticks, then fades the screen, plays SFX 0x91 and switches
  the entity's state to 0xC.
interface: '(r0-r4 = unused, r5 = entity struct: +0x40 tick counter, +0x44 value drained by 2/tick, +2
  halfword state) -> r0 = clobbered; writes +0x40, +0x44, +2'
details: Each call subtracts 2 from the word at r5+0x44 and increments the counter at r5+0x40. Once the
  counter reaches 8, it resets to 0, calls SetScreenFade(0x34, 0x20) (likely fade color/speed), plays
  sound effect 0x91 via the M4A wrapper, and stores state id 0xC into the halfword at r5+2, i.e. the owning
  object's state machine advances to its next phase. It then unconditionally calls sub_80298D8 (purpose
  unknown) before returning. The 8-tick cadence and fade+sound look like the end of a short timed sequence
  (charge-up, warp, or drain effect), but the entity and the meaning of the +0x44 field are unknown without
  callers.
