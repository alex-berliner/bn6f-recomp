name: sub_80E0668
address: '0x080E0668'
kind: function
status: confirmed
summary: Dispatches to the per-phase handler of a battle object based on its current phase byte (phase 0 -> sub_80E0684,
  phase 1 -> teardown/free).
interface: "void battle_object_dispatchPhase_80E0668(void);\n  // in:  r5 = battle object pointer, r10 = pass-through\
  \ value to callee\n  // out: r5, r8, r9, r10, r11, r12 (as returned by the selected phase handler)\n  // trashed:\
  \ r0-r4, r6, r7, lr; flags NZCV\n"
details: 'Reads oBattleObject_CurPhase from the battle object in r5 and uses it as an

  index into the two-entry thumb-jump table at off_80E067C. The selected

  entry (already a thumb address with bit 0 set) is loaded into r1, the

  phase byte into r0, and execution is transferred via a manual

  `mov lr, pc; bx r1` followed by `pop {pc}`, so the callee returns

  directly to the caller of sub_80E0668. r5 and r10 are preserved across the

  dispatch so they reach the handler untouched; r0 is set to the phase

  byte and r1 to the handler''s thumb address. Phase 0 runs sub_80E0684

  (the normal phase handler); phase 1 runs

  battle_object_teardownAndFree_80E06E0 (object teardown + free).

  No memory is written by this function itself.

  '
