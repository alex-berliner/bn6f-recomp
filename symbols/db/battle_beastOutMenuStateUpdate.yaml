name: battle_beastOutMenuStateUpdate
address: '0x08133788'
kind: function
status: probable
summary: 'Per-frame state handler for the beast-out related submenu/effect: advances state bytes, runs
  text script 0x17 when a submenu is open, and triggers the beast status effect on the battle object.'
interface: (r0 unused/ignored; r5 = state struct pointer set up by caller) -> r0 = result of object_resolveTableEntryWrapper;
  flags from final calls
details: Reads event-flag bit 0x80 via chatbox_mask_eFlags2009F38 to decide whether to run the setup path.
  If the submenu (menu window) is open, it stores 0x10 into state byte r5+1, clears r5+2, and runs text
  script index 0x17 from eTextScript2028A20; otherwise it stores 4 into r5+2 and copies r5+0xd into r5+3.
  It then clears the submenu background if the menu closed (submenu_clearBgIfClosed), resolves an object-table
  entry by index, invokes battleObject_runBeastStatusEffect_81345B0 (which drives the beast/transform
  effect on the active battle object via battleObject_updateShieldOrStatusEffect), and finally resolves
  a second fixed object-table entry (table 0x182). r5 is an external per-scene/per-object state struct
  whose other fields (e.g. r5+0xd) are prepared by the unknown caller.
