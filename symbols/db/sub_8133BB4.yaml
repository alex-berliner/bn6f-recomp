name: sub_8133BB4
address: '0x08133BB4'
kind: function
status: confirmed
summary: 'Handles a B-button press in the Navi customizer/submenu: either clears an in-progress exit flag with its
  SFX, kicks off the quit-and-fade confirm, or fires a chatbox script with the "can''t jack-in" cue.'
interface: void sub_8133BB4(u32 r2, u32 r4 /*chatbox?*/, u32 r5 /*submenu state struct*/, u32 r10 /*toolkit*/) ->
  out NZ, r2, r5, r10 (all clobbered)
details: "Per-frame handler invoked while the Navi submenu is up. It first checks `IsButtonPressed(JOYPAD_B)`;\n\
  if B is not held the function returns immediately with the original Z/NZ flags preserved.\n\nThree branches follow,\
  \ gated by two fields of the submenu state struct in r5:\n\n* `r5+0x44` (AFA_SUBMENU_EXIT_FLAG, 1 byte): when\
  \ set, this is a \"second B\" to cancel the\n  in-progress exit. The flag is cleared and `PlaySoundEffect(SOUND_EXIT_SUBMENU)`\
  \ is played,\n  leaving the return NZ flags and r2/r5/r10 from that SFX call.\n\n* `r5+0x17` (AFA_CHAT_STATE)\
  \ == 0x1E: special \"exit confirmation\" mode. Calls\n  `submenu_ConfirmExitAndFade_811FB64(8, ...)`, then clears\
  \ `r5+2` (chatbox state byte).\n  Returns with NZ forced non-zero (the literal `mov r0,#1; tst r0,r0`).\n\n* Otherwise\
  \ the \"open a chatbox\" path:\n  - `r5+0xD = r5+0x03` (copies a source-identifier byte into the chatbox slot)\n\
  \  - `r5+0x02 = 8` (chatbox state/transition byte)\n  - reads a script index from `r5+0x1E`\n  - loads the global\
  \ chatbox pointer via `r10->oToolkit_ChatboxPtr` and stashes that index\n    at `chatbox+0x4C` (the slot a chatbox\
  \ script looks up to know what to display — likely\n    the \"I can't jack in right now\" line)\n  - calls `chatbox_runScript_803FD9C_on_eTextScript2028A20(2,\
  \ r4, r5)`\n  - plays `SOUND_CANT_JACK_IN` and returns with NZ set non-zero.\n\nAll callees (`IsButtonPressed`,\
  \ `PlaySoundEffect`, `chatbox_runScript_…`,\n`submenu_ConfirmExitAndFade_811FB64`) are emitted via the lifter's\
  \ `call_*` wrappers\nbecause they have no typed C interface yet; r2/r5/r10 in the return value are whatever\n\
  the last callee left in those registers (r4 is read but never propagated back).\n"
