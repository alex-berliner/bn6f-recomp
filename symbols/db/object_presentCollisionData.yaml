name: object_presentCollisionData
address: '0x0801A018'
kind: function
status: confirmed
summary: Refreshes a battle object's collision state for the current frame while it is present in a collision, clearing
  one-shot hit/status data (unless time is stopped) and then running the shared collision handler.
interface: void object_presentCollisionData(void) // r5 = battle object, r1 = new collision flags, r3 = context
  for the collision handler; preserves r4-r7, returns r0-r3 as left by sub_300777C
details: 'Per-frame setup for an object that is present in a collision. Loads the object''s collision data block
  via oBattleObject_CollisionDataPtr (r5 is the battle object, set up by the caller; r4 is repurposed to hold the
  collision data pointer for callees). Merges oCollisionData_Unk_54 with oCollisionData_FlagsFromCollision into
  a scratch value, then stores the caller-supplied r1 into oCollisionData_Unk_54 as the new pending flags. Calls
  battle_isTimeStop; if time is NOT stopped (i.e. no chip/time-freeze in effect), clears the one-shot hit state:
  oCollisionData_HitModifierFinal = 0, the byte at coll+0x03 = 0, and oCollisionData_Unk_54 = 0. Always clears oCollisionData_StatusEffectFinal
  to 0 and zeroes the object''s interaction buffer at coll+0x68 (128 bytes, via ZeroFillByHalfword with count 0x40
  halfwords). Reloads the (possibly updated) collision data pointer from the object and tail-invokes the shared
  collision handler sub_300777C via lr=pc with r3 as context; r0-r3 on return are whatever that handler left. The
  merge result of Unk_54|FlagsFromCollision is only passed to battle_isTimeStop in r0/r2 and does not appear to
  be stored, so its real effect there is unclear.

  '
