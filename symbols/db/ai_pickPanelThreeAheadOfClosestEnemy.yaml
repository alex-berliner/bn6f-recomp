name: ai_pickPanelThreeAheadOfClosestEnemy
address: '0x0810ADAC'
kind: function
status: probable
summary: 'AI helper: finds the closest enemy BattleObject, builds an anchor panel 3 tiles in front of
  it, and picks a random reachable panel via GetRandomRelativePanelFiltered (index 1, fallback 7) using
  the byte_810AE08 param entry.'
interface: (r5 = BattleObject) -> r0 = success/panel result of the second pick (0 = none); r4-r7 preserved
details: 'Takes the object in r5, flips its Alliance bit to search the opposing side with battleObject_findClosestEnemyBattleObject_80103F8,
  and returns early if no enemy exists. For the found enemy it computes a panel coordinate: object_getFrontDirection()
  * 3 + byte at +0x12 as X, byte at +0x13 as Y — i.e. a panel shifted 3 columns in the enemy''s facing
  direction. It then calls GetAllianceDependentPanelParamArgs with the byte_810AE08 table entry and GetRandomRelativePanelFiltered
  (r6 = alliance) with offset-list index r4=1; if that yields 0, it recomputes the same panel and retries
  with r4=7 as a fallback list. Both picks share the same param-table entry pointer (byte_810AE08), suggesting
  the routine fills an output (target panel) through that entry''s args pointer rather than returning
  it directly.'
