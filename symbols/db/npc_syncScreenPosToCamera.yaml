name: npc_syncScreenPosToCamera
address: '0x080A8644'
kind: function
status: confirmed
summary: Copies an NPC's fixed-point screen position (dropping the fractional bits) into its integer on-screen x/y
  coordinates.
interface: void npc_syncScreenPosToCamera(r5 sourceObj, r6 destObj) /* no return value, no flags read */
details: 'Takes the 32-bit fixed-point values at [r5+0xC] (screen x) and [r5+0x10] (screen y), arithmetic-shifts
  each right by 16 to convert from a 16.16 fixed-point value to an integer, and stores the results as halfwords
  at [r6+0x16] (x) and [r6+0x18] (y). The destination offsets 0x16/0x18 look like the render/camera-facing coordinate
  fields of the destination object, so this syncs an NPC''s precise world/screen position into the integer coordinates
  used for drawing or camera checks. Reads only the two source fields, writes only the two destination halfwords.
  r4 is preserved; only r0/r1 and flags are clobbered. Named in the disassembly already, and the C reconstruction
  was verified, so no further action needed beyond confirming the struct layouts for 0xC/0x10 (fixed-point pos)
  and 0x16/0x18 (integer screen pos).

  '
