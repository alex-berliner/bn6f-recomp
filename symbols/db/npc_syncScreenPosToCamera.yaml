name: npc_syncScreenPosToCamera
address: '0x080A8644'
kind: function
status: probable
summary: Converts two 26.8 fixed-point source positions (likely the camera) into integer halfwords stored
  into the NPC actor's screen-offset fields, anchoring the actor to the viewport.
interface: (r5 = source struct with fixed-point fields at +0xC and +0x10, r6 = destination actor struct)
  -> stores halfwords at r6+0x16 and r6+0x18; no return value
details: Loads two 32-bit values from [r5,#0xC] and [r5,#0x10], each arithmetic-shifted right by 16 —
  the standard unpacking of 26.8 fixed-point coordinates (e.g. camera x/y) into integer pixel values.
  The results are stored as halfwords at offsets 0x16 and 0x18 of the struct in r6, which per the caller
  npc_updateGuarded is an overworld NPC/actor whose update runs only outside cutscenes/busy states. This
  looks like re-anchoring a screen-space overlay NPC (one that should stay at a fixed screen position)
  every frame, using the camera's current fixed-point position as the source. The push/pop of r4 is vestigial;
  r4 is never used.
