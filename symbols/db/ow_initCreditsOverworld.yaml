name: ow_initCreditsOverworld
address: '0x081387D8'
kind: function
status: probable
summary: 'Prepares the engine for the credits overworld scene: zeroes GameState+0x20, runs the full overworld
  reset chain, decompresses coord event 2 data, initializes the field camera for map group 0xD0 / map
  0 at (0,0,0), clears effect/scenario state and event-flag ranges at 0x2DE/0x2C8, force-ends any active
  cutscene, clears stale script positions and pending battle state for event 0x1708, then frees all type-0x25
  objects.'
interface: () -> r0 = FreeAllObjectsOfSpecifiedTypes result; clears GameState field at +0x20 and many
  engine work areas
details: Nulls the toolkit's GameState pointer, then runs the full overworld scene reset chain (resetOverworldScene,
  graphics reset, work-area clear, copy/setup helpers). It loads coordinate event data for EVENT_2 and
  initializes the camera for map group 0xD0 map 0 at position (0,0,0), snapping it via camera_writeUnk03_14
  and SetCameraXYZ. It then wipes effect/scenario state, clears event-flag ranges at 0x2DE and 0x2C8,
  force-ends any running cutscene, clears stale script positions, and clears pending battle state for
  event 0x1708. Finally it frees all objects of type 0x25. This is a 'clean slate' entry into the credits
  overworld (map group 0xD0), not a per-frame update.
