name: battle_spawnInitCollision
address: '0x080D1B68'
kind: function
status: probable
summary: 'Spawn-phase state handler for a battle object: allocates and initializes its collision data,
  then advances it to the update state.'
interface: (r5 = battle object ptr, implicit) -> r0 = collision data ptr on success; object state set
  to CUR_STATE_UPDATE; on allocation failure the object is freed
details: Allocates a collision slot for the object at r5 with object_createCollisionData; if none is free
  it destroys the object with object_freeMemory. On success it calls object_setupCollisionData with (r1=0,
  r2=0x18, r3=0), where 0x18 selects a collision-type flag table entry, zeroes oBattleObject_Element (elementless/neutral),
  and stores region 2 via object_setCollisionRegion. It then refreshes collision state for the frame with
  object_presentCollisionData, sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE
  so the next frames run the update handler, and tail-calls sub_80D1B9A (likely that update handler).
  This is a one-shot 'spawn' phase handler, the standard BN6 battle-object state pattern.
