summary: Returns a battle object's panel coordinates (x in r0, y in r1) from its oBattleObject struct.
interface: (r5 = battle object pointer) -> r0 = oBattleObject_PanelX, r1 = oBattleObject_PanelY; flags
  untouched
details: A two-line getter that reads the object's panel X and panel Y bytes (fields of the battle-object
  struct at offset oBattleObject_PanelX/oBattleObject_PanelY) into r0 and r1 and returns. It relies on
  r5 already holding the object pointer, so it is a leaf helper called with 'this' in r5 rather than a
  proper argument register — an unusual calling convention (likely a tail-position or inlined-helper pattern).
  No flags are affected; no other registers are touched.
