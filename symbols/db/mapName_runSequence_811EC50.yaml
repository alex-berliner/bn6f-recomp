    \ in-contract regs,\n  showing r10 is the toolkit ptr threaded straight through.\n- The five callee\
    \ names from the project (`queueGFXTransfersFromTable`, `sub_811EFB8`,\n  `updateMapNameDisplay`,\
    \ `drawMapNamesScreen`, `drawCurrentMapName`) all describe map-name\n  / GFX upload work, and the\
    \ project tags `drawMapNamesScreen` and `drawCurrentMapName` as\n  the two text-screen renders.\n\
    - The single caller (sub_8005462) is an unnamed per-frame dispatcher that itself has\n  out=['r8','r9','r10','r11','r12'],\
    \ i.e. an \"outer\" sub-routine that calls this map-name\n  sequence each frame.\n- Captured-call\
    \ r0 (0x0200c920) matches the pointer the last callee would plausibly keep in\n  r0 (a work buffer\
    \ / font ptr), confirming the tail of this function is the\n  `drawCurrentMapName_811F08C` return."
