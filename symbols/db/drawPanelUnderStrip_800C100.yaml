name: drawPanelUnderStrip_800C100
address: '0x0800C100'
kind: function
status: confirmed
summary: draws the one-tile-high strip just below a panel (5x1 tiles)
interface: 'static void draw_panel_strip(u32 column, u32 row, u32 side); adapter: in r0=column, r1=row (already
  +1 from the panel row), r2=side, r10=toolkit; out r1-r3, r6, r7 (r4-r7 preserved, r1-r3 as CopyBackgroundTiles
  leaves them)'
details: Placement uses its own column mirror table byte_800C182 (row of 8 selected by the flipped-field flag);
  the tile ids are one 0x20-byte set from byte_86E0498 selected by side ^ flip. Drawn 5 wide, 1 tall into tile block
  2. Called with the panel's row + 1 when ePanelData +0xC is set, and after a slot is blanked (via sub_800C138).
