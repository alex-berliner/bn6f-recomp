name: shop_addStockEntry_kind4_8048F88
address: '0x08048F88'
kind: function
status: confirmed
summary: Registers a single shop stock entry (entry kind 4) pointing at the item table byte_8048BE4, then
  returns.
interface: void sub_8048F88(void); // tail-wraps shop_addItemStockEntry(4, byte_8048BE4); r4-r7 preserved,
  lr/r0-r3/r8/r9/NZCV pass through from the callee
details: 'One-line wrapper: loads the address of the item/stock data table byte_8048BE4 into r1, sets
  r0 = 4

  (an entry-kind parameter for shop_addItemStockEntry), calls it, and immediately pops {r4-r7,pc}.

  It adds no state of its own — everything the caller sees afterwards (r0-r3, r8, r9, r12, NZCV, and

  lr as left by shop_addItemStockEntry) is exactly what the callee left behind. r4-r7 are pushed and

  popped only as part of the shared prologue/epilogue pattern and are untouched. The dword_8046B98

  word in its literal pool is dead data for this code path (next literal slot, not referenced here).

  A sibling-style table at byte_8048BE4 presumably describes the item being stocked (id, price, etc.).

  '
