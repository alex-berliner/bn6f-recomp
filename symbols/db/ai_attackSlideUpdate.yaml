name: ai_attackSlideUpdate
address: '0x081062F8'
kind: function
status: probable
summary: Per-frame AI attack update that initializes a sliding enemy attack on first call (sets AttackElement=4,
  anim=0x1D, sprite flip from Alliance^DirectionFlip^TimerOrCycles, Z=0, run hitbox helpers, request camera
  shake, play SFX 0xC7, optionally call sub_80E8FB0), then on later frames adds XVelocity to X, resyncs
  panels, re-runs sub_81067D0 on panel change, and advances TimerOrCycles with HitElement=8 then 0x14
  as StepTimer expires.
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = clobbered; updates object X/panels,
  oAIAttackVars_TimerOrCycles/StepTimer/HitElement
details: 'On the first call (AttackElement==0) it initializes the attack: sets AttackElement=4, animation
  0x1D, flips the sprite from Alliance^DirectionFlip^TimerOrCycles, zeroes Z, runs hitbox helpers sub_8106774/sub_81067D0,
  requests a camera shake (magnitude 3, duration StepTimer), plays SFX 0xC7, and calls sub_80E8FB0 if
  a ScratchVar flag is set. On later frames it adds XVelocity to X, resyncs PanelX/Y via object_setPanelsFromCoordinates
  and object_updateCollisionPanels, and re-runs sub_81067D0 whenever the panel changes (moving hitbox).
  StepTimer counts down each frame; on expiry TimerOrCycles increments and HitElement is set to 8 after
  the first cycle and 0x14 after the second, presumably controlling what the attack damages.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_81062F8+4: reads oAIAttackVars_AttackElement and branches between one-time setup (element
    4, anim 0x1D) and per-frame movement; loc_8106346: X += XVelocity then bl object_setPanelsFromCoordinates
    / object_updateCollisionPanels — the object physically travels; cmp r0, r4 / bl sub_81067D0: hitbox
    helper re-invoked only when PanelX changes, i.e. hit tracking follows the moving body; bl camera_initShakeEffect_80302a8
    with r0=3 and PlaySoundEffect(0xC7): attack-launch presentation; StepTimer countdown then HitElement=8
    (cycle 1) / 0x14 (cycle 2) sets the attack''s hit payload over its lifetime'
  refs:
  - bn6f/asm/asm31.s:167347
  - 0x080005CC PlaySoundEffect
  - 0x080302A8 camera_initShakeEffect_80302a8
  - 0x0800E2AC object_setPanelsFromCoordinates
  reproduce: python3 tools/asmcat.py 0x081062F8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code agrees with the proposed behavior: first-call init (AttackElement=4, anim=0x1D, sprite
    flip combining Alliance^DirectionFlip^TimerOrCycles, Z=0, helpers, camera shake mag 3 duration=StepTimer,
    SFX 0xC7, optional sub_80E8FB0 when TimerOrCycles & ScratchVar set), and per-frame X += XVelocity
    + panel resync, re-running sub_81067D0 on panel change, with StepTimer decrement driving TimerOrCycles++
    and HitElement=8 then 0x14. Minor inaccuracies: HitElement is stored with strh (u16), not strb; direction
    flip eor uses all three operands as described; camera duration comes from StepTimer not the other
    way. Name ai_attackDashUpdate is reasonable but "dash" is interpretive; ai_attackSlideUpdate or simply
    ai_attackXSlideUpdate fits equally. Summary is largely correct.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
