name: object_setPositionIfEntryActive
address: '0x0811AD18'
kind: function
status: probable
summary: Sets an object's sprite coordinates only if the corresponding entry in the 0x58-byte struct array
  at eStructArr2008450 is active.
interface: (r0 = object/resource pointer, r1 = coordinate value/struct for sprite_setCoordinates, r2 =
  index into eStructArr2008450) -> r0 = pass-through of sprite_setCoordinates result; no meaningful flags
  (beq used on callee result).
details: The function saves r0-r2, then calls getStructFrom2008450 with r2 to fetch the in-use/status
  byte of an entry in the fixed 0x58-byte struct array at eStructArr2008450; if that byte is zero (entry
  inactive), it returns without doing anything. Otherwise it calls sprite_setCoordinates with the saved
  r0/r1, which writes x/y into the 0x10-byte sprite sub-entry selected by the high nibble of the resource's
  byte 2. r4-r7 are pushed but never used, suggesting a thunk/wrapper. The in-use check acts as a guard
  so positions are only updated for live entries.
