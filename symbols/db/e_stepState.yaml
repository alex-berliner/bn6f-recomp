name: e_stepState
address: '0x0813D9AC'
kind: function
status: probable
summary: Dispatches via a 2-entry thumb handler table indexed by eS200BC50+1, returns sub_813D9F4's value
  (4 = done), otherwise calls sub_8146B70 as a per-step wait.
interface: (no args) -> r0 = new state/task value (4 appears to mean finished); no flags
details: Loads the struct at 0x200BC50, reads its state byte at +1, and dispatches through a two-entry
  thumb handler table (sub_813D9DC, sub_813D9E8) using the lr=pc long-call trick. It then calls sub_813D9F4
  to obtain a status value; if that value is not 4, it calls sub_8146B70 (presumably a per-step update/wait
  routine), otherwise it returns immediately. Caller sub_813DA0C seeds eStruct203F7D8+1 with 2 and, when
  that struct's flag byte at +0 is set, replaces it with this function's return value, suggesting the
  return is a next-mode/state selector.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sub_813D9AC reads byte_200BC51, shifts it left 2 and indexes off_813D9D4, a table of two handler
    addresses (state dispatcher pattern); after the handler it calls sub_813D9F4, keeps r0, and only calls
    sub_8146B70 when r0 != 4, so 4 acts as a terminal/done code; caller sub_813DA0C writes 2 to eStruct203F7D8+1,
    then stores this function's return into that same byte, treating the return as a state/mode value;
    the alternative caller path CopyWords from eStruct2036780 to unk_2039A00/20399F0 shows the flag byte
    gates between this task and a direct copy path
