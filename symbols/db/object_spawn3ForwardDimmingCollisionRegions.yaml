- method: assembly-reading
  date: '2026-10-19'
  detail: three object_spawnDimmingCollisionRegion calls with r0 = object_getFrontDirection() * 1, 2,
    3 added to [r5+oBattleObject_PanelX]; PanelY, Element, DamageAndStaminaDamageCounterDisabler all read
    from the same r5 battle object each time; identical constants 0x19050301 (dword_80BA99C) and 0x1101
    (dword_80BA9A0) passed for every region; only caller sub_80BA84C shares the same r5 context, confirming
    r5 is the battle object this-pointer
