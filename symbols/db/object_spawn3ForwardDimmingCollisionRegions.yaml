name: object_spawn3ForwardDimmingCollisionRegions
address: '0x080BA946'
kind: function
status: probable
summary: Spawns three dimming collision-region objects in front of the caller battle object at PanelX
  + dir*1, dir*2, dir*3 on the same PanelY row, using the object's Element/DamageAndStaminaDamageCounterDisabler.
interface: (r5 = battle object) -> r0 = last spawned region object; flags preserved by callee
details: 'Uses the caller''s battle object in r5 (never set inside this function, so it is effectively
  a this-pointer passed via r5). It reads the object''s PanelX/PanelY and Element and calls object_getFrontDirection
  three times to get the +1/-1 facing multiplier, spawning a dimming collision region at PanelX + dir*1,
  dir*2, and dir*3, all at the object''s PanelY. Each spawn uses the same constant arguments: r2 = the
  object''s Element, r3 = 0, r4 = 0x19050301 and r7 = 0x1101 (region properties such as lifetime/damage/flags),
  r6 = the object''s DamageAndStaminaDamageCounterDisabler field. Quirk: it relies on r5 being live from
  the caller rather than taking a parameter, so it is only valid as a leaf helper of sub_80BA84C.'
