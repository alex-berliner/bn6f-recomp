    — The code''s three offsets are dir*1, dir*2, dir*3 (see the `mov r1, #2; mul r0, r1` and `mov r1,
    #3; mul r0, r1` blocks), all at the object''s PanelY, spawning dimming collision regions. The proposal''s
    summary is essentially correct, but the name''s ''Front'' panel row reading is imprecise — these are
