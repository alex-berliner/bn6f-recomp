open_questions:
- Is the size guaranteed to be a non-zero multiple of 4 at every call site? A size of 0 would underflow r2 to 0xFFFFFFFC
  and copy 4 GiB.
- Why expose the final-SUBS flags to callers (N=0, C=1) rather than just returning in a known state? Possibly a
  calling-convention artifact from the surrounding start-up code that needs SUBS flags live.
