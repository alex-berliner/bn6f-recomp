name: start_copyMemory
address: '0x080001D8'
kind: function
status: confirmed
summary: Copies 'size' bytes from src (r0) to dst (r1) one word at a time, walking backwards from the end.
interface: 'void copyMemory(u32 src /*r0*/, u32 dst /*r1*/, u32 size /*r2*/); // returns: r2=0, r3=last word copied;
  flags from final SUBS (r2-4): N=0, Z=1, C=1, V=0'
details: 'Tight word-wise memmove-style helper used during early init (placed at 0x080001D8 right at the

  ROM start, alongside the IWRAM copy descriptors and GamePakWaitstateControl table). Each

  iteration subtracts 4 from r2, copies [r0+r2] -> [r1+r2], and loops until the result of the

  SUBS is zero (so size is assumed to be a non-zero multiple of 4). Because it walks from high

  offsets downward, it is safe for overlapping regions where dst > src (a backwards memmove

  for word-aligned, size%4==0 buffers). The final SUBS of 4-4 sets the condition flags

  deterministically (Z set, C set, V clear) so callers observe a fixed flag state on return;

  r2 is left at 0 and r3 holds the last word read from src. No scratch registers beyond r2/r3

  are used; the function ends with `bx lr`, so it runs in ARM mode only despite the Thumb-

  looking prologue (address is word-aligned and falls inside the start-of-ROM ARM region).

  Sits adjacent to off_80001EC/off_80001F0/off_80001F4/off_80001F8 pointers (byte_3007F60,

  byte_3007FE0, iStack, byte_3007FFC) and the sub_3005B00 / GamePakWaitstateControl /

  IWRAMRoutinesROMLocation / SetPrimaryToolkitPointers / RandomizeExtraToolkitPointers /

  entryRomInit_800023C / dword_2009930 / dword_200A870 / GeneralLCDStatus_STAT_LYC_ /

  KeyInterruptControl records (up through main_+1), i.e. the GBA startup / IWRAM-copy and

  interrupt-vector setup tables.

  '
