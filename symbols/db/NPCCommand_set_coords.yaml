name: NPCCommand_set_coords
address: '0x0809EEB6'
kind: function
status: confirmed
summary: NPC script command that teleports the NPC to an X/Y/Z position given by three halfword operands in the
  script.
interface: void NPCCommand_set_coords(OverworldNPCObject* npc /*r5*/, NPCScriptCursor* cursor /*r6*/); returns updated
  cursor in r6 and sets flags from the +7 pointer advance
details: 'Handler for one NPC overworld script opcode. The script pointer in r6 points at the opcode byte; three
  operands follow at +1, +3 and +5, each read as a little-endian halfword via ReadNPCScriptHalfword. Each value
  is shifted left 16 bits (fixed-point, 16 fractional bits) and stored into the NPC object''s X, Y and Z fields
  (oOverworldNPCObject_X/Y/Z, 32-bit each) in that order. Finally the script pointer is advanced by 7 bytes (1 opcode
  byte + 3x2 operand bytes) with ADDS, so the NZCV flags on exit reflect that pointer arithmetic. Callers are expected
  to keep r5 = NPC object and r6 = script cursor; lr is the return address (the handler returns with pop {pc} into
  the script dispatcher).

  '
