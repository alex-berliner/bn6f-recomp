name: t3_0x4_80C53C0
address: '0x080C53C0'
kind: function
status: confirmed
summary: Per-frame dispatcher that runs a battle object's current state handler from a small jump table, then refreshes
  its sprite.
interface: 'void battle_object_updateStateAndSprite_80C53C0(void); /* in: r5 = battle object; out: r5 = battle object
  (may be moved by state handler); clobbers nz,c/v, r0-r4,r6-r7,r8-r12,lr; trashes: r8-r12 via callees */'
details: 'Reads the battle object''s state byte at oBattleObject_CurState (r5 + #oBattleObject_CurState),

  loads a 32-bit function pointer from the jump table at off_80C53D8 indexed by that state,

  and tail-calls it via `mov lr, pc; bx r1` (the listed+1 offsets are Thumb-bit tricks). The

  three table entries are sub_80C53FA+1, sub_80C54E0+1, and sub_80C53E4+1, giving three

  per-state handlers. Whatever object pointer the handler returns in r5 is then passed to

  object_updateSprite so the sprite reflects the new state.'
