- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r2,[r5,#oBattleObject_Param2] then dword_80C6DC8 offsets {-1,+1,0} applied to PanelY show
    Param2 stores the previously chosen row offset; bl object_getFrontDirection + add r0,r0,PanelX computes
    the facing-side front panel X; byte_80C6DB8 indexed by 8*(Alliance^DirectionFlip)+PanelX supplies
    per-column filter params for sub_8109708; three sub_8109708 calls with filters 0x16/0x17 for Y-1/Y-1
    retries, storing Param2=1/2, show a row-escape fallback
