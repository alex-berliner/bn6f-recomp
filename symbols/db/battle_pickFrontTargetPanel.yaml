name: battle_pickFrontTargetPanel
address: '0x080C6D1E'
kind: function
status: probable
summary: Chooses the panel in front of a battle object (or one row up/down from it) as a movement/attack
  target, remembering the row choice in Param2.
interface: (r5 = oBattleObject*) -> r0 = target PanelX, r1 = target PanelY; writes oBattleObject_Param2
  (1 = row-1, 2 = row+1) on first valid pick
details: 'Uses r5 as an oBattleObject. If Param2 is already nonzero, it returns the front panel (object_getFrontDirection
  + PanelX) with Y offset taken from the signed-byte table dword_80C6DC8[Param2-1] = {-1, +1, 0}, validated
  to stay in rows 0-3. If Param2 is 0, it first tests the front panel via sub_8109708 using a filter byte
  from byte_80C6DB8 indexed by 8*(Alliance^DirectionFlip)+PanelX (16 entries per side: 8,0x20,7,6,2,1,...
  and 06 07 00 82); if that test returns 0 it retries with filter 0x16 one row up, then 0x17 one row down,
  and on success locks in the row by storing Param2 and returns that panel. If no panel passes the test,
  it falls back to returning the plain front panel. The table''s per-side/per-column values look like
  reach or occupancy filters for the random-panel picker. No caller is known, so the exact gameplay use
  (likely a boss/AI reposition step) is inferred.'
