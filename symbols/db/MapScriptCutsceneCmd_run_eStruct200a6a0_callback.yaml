name: MapScriptCutsceneCmd_run_eStruct200a6a0_callback
address: '0x0803821E'
kind: function
status: confirmed
summary: Map-script command handler that invokes the current cutscene callback, advances the script counter past
  the command, and always returns "keep running" (r0 = 1).
interface: 'u32 mapScript_cmd_runCutsceneCallback(u32 scriptCounter /* r7 in, dead */, u32 *out /* r7 out */); //
  tail-branchless: sets NZ flags from r0'
details: 'Tail of a map-script command dispatch: calls run_eStruct200a6a0_Callback_8002484 (the cutscene/eStruct-200a6a0
  callback runner), which leaves its own state and its returned script-counter value in r7 (the caller''s incoming
  r7 is ignored/dead). This wrapper then does add r7, #1 to step the script program counter past this command word,
  sets r0 = 1 (status "keep running script"), and returns. All other registers and the final NZ flags visible to
  the caller come from the callee and the mov r0, #1 (always non-zero, non-negative; c flags carry over from the
  callee). Preserves r4-r6 as the map-script ABI requires; clobbers r0, r1, lr and passes through clobber of r2,
  r3, r8-r12 from the callee.

  '
