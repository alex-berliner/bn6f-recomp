open_questions:
- Exact meaning of the two table words (0x20/0) passed to object_getPanelsInColumnFiltered (min panel
  count vs filter flag)
- r1 is not set before object_getPanelsInColumnFiltered — whether it must hold the object pointer from
  the caller, and how the stack buffer is actually received (r7 vs stack), needs the callee's own signature
- Whether the returned depth indexes rows or selects among the 8 patterns directly in ai_spawnStrikePanelPattern
