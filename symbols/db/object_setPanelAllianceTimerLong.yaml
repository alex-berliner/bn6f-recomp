name: object_setPanelAllianceTimerLong
address: '0x0800CC36'
kind: function
status: confirmed
summary: Sets the panel-ownership/panel-alliance timer of the indexed object in the object array to a long duration
  (0x708).
interface: void object_setPanelAllianceTimerLong(u32 index); // r0=object index; returns r1=&object[index], r2=0x708,
  r0=array base (0x2034010); c/v set by the ADDS that forms the entry address
details: 'Takes an object index in r0, scales it by 8 (mov r1,#8; mul r1,r0), and indexes the object

  array whose base literal is 0x2034010 (each object entry is 8 bytes). It then stores the

  halfword 0x708 at entry+6, which is presumably the field holding the remaining lifetime of

  a panel-ownership/"alliance" effect (e.g. an Ice/Panel-area style timer) for that object.

  Quirks: the caller-visible side effects are unusual — r0 ends up holding the array base,

  r1 the entry address (the flags come from the ADDS forming it, since MUL writes no flags),

  and r2 retains the stored constant 0x708; the routine otherwise relies only on the literal

  pool pointers off_800CE58 (=unk_2034010) and off_800CE5C (=0x708).

  '
