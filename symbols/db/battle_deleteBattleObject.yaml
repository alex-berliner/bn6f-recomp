name: battle_deleteBattleObject
address: '0x0811670E'
kind: function
status: probable
summary: 'Tears down a battle actor: decrements its alliance count, clears it from the alive-actor list,
  and marks its state as destroy'
interface: (r0 = unused; actor pointer expected in r5) -> r0 = destroyed; sets object state to CUR_STATE_DESTROY
details: Acts on a battle object whose pointer is held in r5, not passed in r0 (the incoming r0 is discarded).
  It first calls the battle-over bookkeeping routine, which decrements the actor's alliance member count
  and clears its entries in the alive-actor turn list when an actor leaves. It then calls RemoveGivenAliveBattleActorFromList
  to clear every slot in the 8-entry alive player actor list that points to this actor. Finally it stores
  CUR_STATE_DESTROY into the object's state/phase field, so the object's update loop will run its destroy
  phase. The r5 convention suggests this is called from a shared object-dispatch path rather than directly.
