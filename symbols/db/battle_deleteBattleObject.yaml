name: battle_deleteBattleObject
address: '0x0811670E'
kind: function
status: confirmed
summary: Deletes a battle object by running battle-over bookkeeping, unlinking it from the alive-actor list, and
  setting its state to "destroyed".
interface: battle_deleteBattleObject(r5 = battle object, r10 = battle state); returns r1 (result carried back from
  RemoveGivenAliveBattleActorFromList); clobbers r0-r3, flags, lr
details: 'Takes a battle object pointer in r5 (battle state pointer in r10 is passed through to the callee). First
  calls relatedToIsBattleOver_800A11C, which appears to handle the "is the battle over" bookkeeping for the object
  (e.g. checking whether its deletion ends the battle). Then calls RemoveGivenAliveBattleActorFromList with the
  object in r0, unlinking it from the list of alive battle actors; r1 on return is whatever that routine leaves
  there and is propagated to this function''s caller. Finally it writes CUR_STATE_DESTROY into the object''s oBattleObject_CurStateActionPhaseAndPhaseInitialized
  field, marking it destroyed so its update loop stops processing it. Callers are expected to pass the object in
  r5 rather than r0, which is unusual for this codebase.

  '
