name: battleObject_stepSpriteIfAliveAndUnfrozen_80B881E
address: '0x080B881E'
kind: function
status: confirmed
summary: Advances a battle object's sprite animation by one frame, but only when the battle is unpaused, the object
  is still alive, and it is not frozen/hidden.
interface: int battleObject_stepSpriteIfAliveAndUnfrozen(BattleObject* obj /* r5 */, u32 passthrough /* r10 */);
  returns 1 in r0 if the animator was stepped, 0 otherwise
details: 'Gate function around object_updateSpritePaused. Loads the object''s oBattleObject_RelatedObject1Ptr (r5+0x??)
  and refuses to step if that related object''s oBattleObject_HP (16-bit) is zero (dead). Then reads the related
  object''s oBattleObject_CollisionDataPtr -> oCollisionData_ObjectFlags1 and bails out if any bit of mask 0x80110C00
  is set; that mask is the set of "frozen/hidden" state flags that stop sprite animation (r1 is left holding the
  mask on this exit path, a quirk of the tst). If all three checks pass, calls object_updateSpritePaused with the
  object pointer still in r5 (r10 is passed through untouched for the callee) and returns 1. Returns 0 in r0 for
  every early exit. r4 is used as the local result and preserved; r1/r3 leftover values on early exits are incidental
  (documented in the C model).

  '
