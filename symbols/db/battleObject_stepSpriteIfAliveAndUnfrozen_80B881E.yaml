name: battleObject_stepSpriteIfAliveAndUnfrozen_80B881E
address: '0x080B881E'
kind: function
previous_names:
- sub_80B881E
status: probable
summary: Steps a battle object's sprite one frame when the battle is running, the related object is alive,
  and not frozen/invisible/flashing/bubbled/dead.
interface: '(r5 = BattleObject*, r10 = Toolkit*) -> r0 = bool (1 if sprite was stepped, 0 otherwise);
  side effects: advances the object''s sprite animation one frame on success'
details: "- 1) save r4/lr; clear r4=0 (the \"did step\" return flag).\n  - 2) call battle_isPaused; if\
  \ the battle is paused (NZ true) return 0 without touching it.\n  - 3) otherwise, load the RelatedObject1Ptr\
  \ (offset 0x4C) of the BattleObject in r5; if that related object's HP (offset 0x24) is 0, return 0.\n\
  \  - 4) load the related object's CollisionDataPtr (offset 0x54) and read its ObjectFlags1 word (offset\
  \ 0x3C); tst it against the mask 0x80110C00 (bits INVIS 0x02, DEAD 0x100, FLASHING 0x200, FROZEN 0x10000,\
  \ BUBBLED 0x80000000 plus 0x10 extra — the object is paused/step-protected from sprite stepping). If\
  \ any bit matches, return 0.\n  - 5) only when none of those block it, call object_updateSpritePaused\
  \ (r5, r10); set r4=1 and fall through.\n  - 6) return r4 as a bool indicating whether the sprite was\
  \ advanced.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battle_isPaused` followed by `bne loc_80B8840` skips the whole body when the game-state
    BattlePaused flag is set, returning r4=0. - `ldrh r0,[r3,#oBattleObject_HP]` / `cmp r0,#0` / `beq
    loc_80B8840` guard against a dead/HP=0 actor. - `ldr r1,[...,#oCollisionData_ObjectFlags1]` and `ldr
    r1,dword_80B88CC` (0x80110C00) with `tst r0,r1` mask the bits that should freeze the sprite (INVISIBLE
    0x2, DEAD 0x100, FLASHING 0x200, FROZEN 0x10000, BUBBLED 0x80000000 plus 0x10 = OBJECT_FLAGS_UNK_4);
    the matching branch returns 0. - `bl object_updateSpritePaused` (which steps the object''s sprite
    animation one frame even when its logic is paused) is called only after all checks pass; r4 is set
    to 1 right after, and that is the returned value. - The two callers (sub_80B86C4 and sub_80B86D4)
    at 0x080b86c4/0x080b86d4 are tight call-sites inside the per-frame battle object update loop and consume
    the bool to decide whether to do further per-object work.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080B881E

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: battlesweep, beastsp'
  reproduce: 'grep -l ''^080b881e '' tools/traces/coverage/*.prof

