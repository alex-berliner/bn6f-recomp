open_questions:
- The exact meaning of bit 0x10 in the 0x80110C00 mask (OBJECT_FLAGS_UNK_4) — i.e. whether this also skips
  stepping for some non-frozen/invis state. Knowing which objects have that bit set in known scenes would
  clarify it.
- Whether r4 ever needs to be re-cleared across the body is irrelevant because it is reset to 0 at entry
  and only set to 1 on the success path, so the contract is just "1 == sprite stepped".
