name: ai_attackStepTimerExpire
address: '0x080F5D1C'
kind: function
status: probable
summary: When the AI attack step timer reaches zero, resets the object's animation, clears the 0x40 attack
  flag, re-sets the currently-moving flag, and sets the attack hit element to 0xC.
interface: () -> void; uses r5 = battle object, r7 = AI attack vars; flags not meaningful
details: 'Decrements oAIAttackVars_StepTimer at r7 and returns immediately unless it reaches 0. On expiry
  it writes 0 to oBattleObject_CurAnim (r5), clears ObjectFlags1 bit 0x40 via object_clearFlag, sets the
  OBJECT_FLAGS_CURRENTLY_MOVING_1 bit via object_setFlag1, and stores 0xC into oAIAttackVars_HitElement
  (r7). This looks like the tail of an AI attack state: the charged/attack pose ends, normal movement
  resumes, and the hitbox element id for the attack is chosen. All state lives in the caller-provided
  r5/r7 structures; the function takes no arguments.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/strh on r7 StepTimer with ''bgt locret'' gates everything after on timer hitting zero;
    strb #0 to r5+oBattleObject_CurAnim resets the object''s animation on expiry; object_clearFlag(0x40)
    then object_setFlag1(1<<CURRENTLY_MOVING_1) toggles collision flags; strh #0xc into r7+oAIAttackVars_HitElement
    assigns the attack''s element id'
