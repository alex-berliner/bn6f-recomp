name: object_execCurAction
address: '0x080E344C'
kind: function
status: probable
summary: 'Dispatches a battle object''s current action to its handler: dim screen, draw chip name, sub_80E3470,
  or undim screen'
interface: (r5 = battle object) -> jumps to handler for [r5+oBattleObject_CurAction]; r0 = action index
  on entry to handler
details: 'Reads oBattleObject_CurAction from the battle object at r5 and uses it to index off_80E3460,
  a 4-entry thumb handler table, then tail-calls the selected handler with lr set so it returns straight
  to this function''s caller. Handlers: object_dimScreen, object_drawChipName, sub_80E3470 (unknown),
  object_undimScreen. The object pointer is not passed in registers — handlers must also rely on r5 being
  the current object. Effectively a per-object state machine step for screen-dim/chip-name overlay states.'
