- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0, [r5,#oBattleObject_CurAction]; ldr r1, [r1,r0]; bx r1 — jump table indexed by CurAction
    (sub_80E344C); table off_80E3460 entries: object_dimScreen+1, object_drawChipName+1, sub_80E3470+1,
    object_undimScreen+1; mov lr, pc; bx r1 with pop {pc} — tail-call dispatch, no result handling by
    caller wrapper; no known callers, so r5-as-object convention inferred from callee prefix and struct
    field'
