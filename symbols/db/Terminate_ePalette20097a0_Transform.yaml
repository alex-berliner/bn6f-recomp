name: Terminate_ePalette20097a0_Transform
address: '0x0800239A'
kind: function
status: confirmed
summary: Frees one entry of the ePalette20097a0 palette pool by clearing its first (active) byte.
interface: void Terminate_ePalette20097a0_Transform(u32 index) // r0 = entry index; returns r0=0, r1=entry size,
  r2=address of cleared byte; sets nz/c/v
details: 'Takes an index in r0 and scales it by oPalette20097a0_Size (the size of one entry of the ePalette20097a0
  structure array) with a multiply, then adds it to the base address loaded from off_8002464 (=ePalette20097a0)
  to get the selected entry. It stores 0 into the entry''s first byte (oPalette20097a0_Unk_00), which acts as the
  live/active flag — "terminating" that palette transform slot so it is no longer in use. Nothing else in the entry
  is touched. Side effects on registers: r0 is left 0, r1 holds oPalette20097a0_Size, r2 holds the address of the
  cleared byte; the NZ flags come from the final "mov r0, #0" and the C/V flags from the ADDS that formed the entry
  address. No memory other than the one flag byte is modified.

  '
