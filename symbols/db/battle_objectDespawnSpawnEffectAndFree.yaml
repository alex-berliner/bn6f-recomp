name: battle_objectDespawnSpawnEffectAndFree
address: '0x080C3D0C'
kind: function
status: probable
summary: 'Object self-destruct step: spawns an effect near its position, signals its related object to
  advance to phase 8, zeroes a byte via a stored pointer, then frees its own object slot.'
interface: (r5 = battle object pointer, called with r5 convention) -> r0 = destroyed; spawns effect object,
  frees r5's slot
details: Loads three consecutive words at r5+0x34..0x3C; the third (a coordinate, likely Y in 1/65536
  fixed point) is incremented by 0x100000 (16.0 units) and passed with r1=0x12 to the effect-spawning
  wrapper, so it spawns effect kind 0x12 slightly below the object. It then takes oBattleObject_RelatedObject1Ptr
  and calls battle_setObjectStateActionPhase8, telling the linked object (likely the owner/attacker that
  spawned this one) that its effect/despawn phase is done. Next it stores byte 0 through the pointer held
  in the XVelocity field (that field evidently holds a pointer to a byte flag here, or the label is off).
  Finally it calls object_freeMemory on itself, so this runs as the object's terminal routine — a typical
  'spawn parting effect, notify parent, clean up' handler for short-lived battle objects.
