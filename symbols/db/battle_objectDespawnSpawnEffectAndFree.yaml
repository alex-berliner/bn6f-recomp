open_questions:
- No caller known — need to see how r5 is set up and which object type uses this as its death/despawn
  handler
- Exact meaning of effect kind 0x12 and of the byte zeroed through the XVelocity-slot pointer
- Whether r5+0x34 holds X/Y/Z or screen-space coords, and why only the third word is offset by 0x100000
