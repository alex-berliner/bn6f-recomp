name: battle_getObjPanelXy
address: '0x0810EB76'
kind: function
status: probable
summary: Returns a battle object's panel coordinates, letting the callee override them.
interface: (r5 = battle object) -> r0 = panel X, r1 = panel Y; flags from tst on callee result
details: Calls sub_810EB86; if it returns nonzero, r0/r1 are taken as already set (the callee apparently
  fills them in), otherwise the function reads oBattleObject_PanelX and oBattleObject_PanelY from the
  object in r5 and returns those. It is a simple coordinate getter with a fallback path. The r5-only object
  access suggests it is called with the object in a fixed register by a wrapper or convention. Nothing
  else is touched.
