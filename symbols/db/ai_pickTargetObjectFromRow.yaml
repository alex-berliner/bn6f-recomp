name: ai_pickTargetObjectFromRow
address: '0x0811252C'
kind: function
status: confirmed
summary: AI target-selection helper that picks a random panel for a battle object, first trying objects in the target's
  row, then preferred panel lists, then a shared fallback list.
interface: void ai_pickTargetPanelPreferringRow(battle_object_t* obj in r5); out r0/r1 = panel result from the last
  battle_pickRandomPanelByAlliance call, r5 possibly updated; clobbers r2, r3, lr and all flags; preserves r4, r6,
  r7
details: 'Takes the battle object in r5 and reads its PanelY (row) field. Calls battle_pickRandomRowObjectFields_810971A
  (r0=row, r5=object) to pick a random object from that row. If it succeeds (r0 != 0), indexes the pointer table
  at off_8112584 with [obj + oBattleObject_ExtraVars+8] * 4 and calls battle_pickRandomPanelByAlliance with that
  list; returns early on success. Otherwise (or if the preferred list failed), indexes the second table at off_811259C
  the same way (by the same ExtraVars+8 slot) and retries battle_pickRandomPanelByAlliance. If that also fails,
  calls it one last time with the table''s first entry (off_811259C[0]) as the default list. The ExtraVars+8 field
  thus acts as an index/selects which panel-list set the object uses. Output contract is loose: r0/r1/r5 are whatever
  the last battle_pickRandomPanelByAlliance left, which callers presumably interpret as a chosen panel/target.

  '
