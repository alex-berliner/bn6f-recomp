name: ai_pickTargetObjectFromRow
address: '0x0811252C'
kind: function
status: probable
summary: 'AI helper that resolves an object (target) for a targeted attack: tries a random row pick, then
  falls back through variant-indexed table entries and finally the table''s first entry.'
interface: (r0 = result of prior call, r5 = battle object) -> r0 = nonzero object/handle or 0; called
  as tail of ai_prepareTargetedAttack before attack state 0xC
details: Called with r0 = the object's PanelY, it asks battle_pickRandomRowObjectFields_810971A to pick
  a random object from the row at that Y (alliance-dependent panel params) and returns its entry byte
  (id low 3 bits, 4-bit attribute). If that returns 0, it loads a pointer table chosen by off_8112584,
  indexes it with [r5+ExtraVars+8]<<2 (an attack/variant index), and calls sub_8112562 on that entry;
  if still zero it retries with a second table (off_811259C) at the same index, and finally with entry
  [0] of that second table as a default. Each call's r0 return is passed through, so the function returns
  the first non-null candidate or 0. ExtraVars+8 acts as the selector between alternate target/attack
  tables, matching the caller's 'records direction/panel params' behavior. The exact meaning of the table
  entries is unknown since sub_8112562 is undocumented.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_PanelY]; bl battle_pickRandomRowObjectFields_810971A — random object
