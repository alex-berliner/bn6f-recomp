name: object_expireAfterTimer
address: '0x080D9498'
kind: function
status: probable
summary: Object routine that clears the object's collision region, counts a timer down, and marks the
  object for deletion when it expires
interface: (r5 = battle object ptr) -> r0 = 0 while timer still counting; updates oBattleObject_Timer,
  oObjectHeader_Flags, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: Called with the battle object in r5 (same convention as the callee object_clearCollisionRegion).
  It unconditionally calls object_clearCollisionRegion to remove the object from its current collision
  region, then decrements oBattleObject_Timer and returns while it is still positive. Once the timer reaches
  zero, it sets bit 1 (value 2) of oObjectHeader_Flags, sets oBattleObject_CurAction to 4, and resets
  oBattleObject_CurPhaseAndPhaseInitialized to 0 — the flag/action pair that appears to signal object
  removal, leaving the deletion itself to the normal object-update flow. The behavior reads as a generic
  'lingering object that becomes intangible and then despawns after a delay'.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_clearCollisionRegion with object in r5 clears hitbox every invocation; ldrh/sub/strh
    on oBattleObject_Timer with bgt keeps the object alive until the timer runs out; expiry sets oObjectHeader_Flags
    bit 1 and oBattleObject_CurAction = 4 with phase reset, matching a despawn marker
