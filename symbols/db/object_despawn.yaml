name: object_despawn
address: '0x080CAB14'
kind: function
status: probable
summary: 'Removes a battle object from play: clears its collision region, a flag bit, and switches it
  to the DESTROY state.'
interface: (r5 = battle object pointer, no args passed) -> r0 = 0; flags clobbered
details: Acts on the battle object held in r5 (register-global convention). It first calls object_clearCollisionRegion
  so the object stops occupying its collision region, then reads oObjectHeader_Flags, clears bit 0x2,
  and writes the flags back. Finally it stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  which makes the object's state machine process it as destroyed. This is the standard teardown entry
  for an object rather than a state transition within normal play.
