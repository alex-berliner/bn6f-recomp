name: bg_drawTileRegion2x14_8126484
address: '0x08126484'
kind: function
status: confirmed
summary: Draws a 2x14-tile strip of background graphics from a supplied tile-ID list, always using 32x32 tile block
  2.
interface: void bg_drawTileRegion2x14(u32 j, u32 i, const u16 *tileIds) — r0=j (x/column origin), r1=i (y/row origin),
  r2=tileIds pointer; consumes r2, preserves r0 and r4-r7; r3 returns holding the tileIds pointer (leftover from
  CopyBackgroundTiles), r4-r7 are popped back to their incoming values; flags clobbered.
details: 'Thin wrapper around CopyBackgroundTiles(j, i, which_tile_block_32x32, tile_ids, j_size, i_size). It shifts
  the tile-ID pointer from r2 into r3, hardcodes which_tile_block_32x32 = 2, j_size = 2, and i_size = 0xE (14),
  then tail-calls. Net effect: at background cell (j, i) it stamps a region 2 tiles wide and 14 tiles tall, tile
  data sourced from the caller-provided list and read from tile block 2 (the 32x32 block). r0 and r1 are already
  in the correct argument registers, so they pass straight through. Because the callee clobbers r4-r7, the function
  pushes them at entry and pops them after the call, so r4-r7 are preserved for the caller. Quirk: r3 still contains
  the tileIds pointer on return (CopyBackgroundTiles leaves it there) and is effectively an extra "output" of the
  wrapper; callers in the register contract also see r4-r7 as outputs even though the wrapper restores them.'
