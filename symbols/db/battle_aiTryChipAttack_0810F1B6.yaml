open_questions:
- Exact meaning of the 0x12C threshold on `BattleState->Unk_40` (turn charge? damage counter?).
- r7/r10/r4 input roles beyond "toolkit in r10 and callee-saved" — r5 in particular looks like the actor
  pointer but the contract lists it under `out` rather than `in`, which may simply be that the lifter
  couldn't model it as a struct-ptr-in.
- What `sub_800F322` does (likely SFX / animation trigger) — confirming would solidify the "fire chip"
  framing.
