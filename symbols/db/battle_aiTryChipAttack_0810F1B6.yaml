status: probable
summary: Per-actor AI helper that fires a selected battle chip when charge/threshold gates pass.
interface: '(r5 = battle object AI data ptr?, r10 = toolkit, r7/r4/r6 = preserved callee-saved) -> r0
  = 1 if chip was triggered, 0 otherwise ; side effects: may write chip params, set attack, and update
  related object state'
details: "- `r6` is initialised to 0 and used as the success/failure flag at the end (mov r0,r6).\n  -\
  \ Reads the battle object's currently selected chip via `battle_getSelectedChipForUse_800ED90(r5)` (caller\
  \ passes r5 as the battle object pointer; saved in r0 then carried through subsequent calls).\n  - If\
  \ the returned chip flag/status word (r3) is zero, or the key derived in r4 is zero, the function bails\
  \ to `loc_810F1E2` returning 0.\n  - `r4 = (r0 & 0xFF)` shifted/masked (LSL #0x17 / LSR #0x17) — masks\
  \ the chip id to its low byte.\n  - Calls `battle_getStateUnk40_800A704` to fetch `BattleState->Unk_40`\
  \ and compares it against `0x12C` (off_810F1FC). Only proceeds when `Unk_40 >= 0x12C` (a charge/threshold\
  \ gate).\n  - On success: writes the chip params into the AI attack vars (or chip-use buffer) via `somethingWriteChipParams_80126E4(r4)`,\
  \ then `object_setAttack0` to set the attack, then `sub_800F322` (probably a sound/animation trigger).\
  \ Sets r6=1 and returns it.\n  - The four captured call sites all share the same `r0=0, r1=0810f0d9,\
  \ r2=0x80, r3=0x3` shape and exit with `r0=0, flags=Z` — in those samples the early `tst r3,r3`/r4-zero\
  \ branch fires, so this is the no-fire path of the gate.\n  - Naming follows caller `sub_810F0D8` (which\
  \ is itself the AI sub-state machine at 0x0810f0d8) and the chip-selection+set-attack pattern; this\
  \ is the \"fire chip if ready\" step.\n"
