name: sub_8119ACC
address: '0x08119ACC'
kind: function
status: hypothesis
summary: Tail-dispatch helper that calls one of three per-object state handlers selected by a state byte, then returns
  the handler's result straight to its own caller.
interface: void sub_8119ACC(Object* r5 /* object with u8 state at +8 */) — tail-calls the selected handler and returns
  whatever it returns (r0-r3 and flags pass through)
details: 'Tiny trampoline/dispatcher. It loads the byte at [r5+8] (a state or mode field on the

  object whose pointer callers keep in r5) and uses it as a BYTE OFFSET, not an index,

  into the three-entry jump table off_8119AE0: values 0, 4 and 8 select sub_8119AEC,

  sub_8119BD0 and sub_8119BE0 respectively. It loads the handler address, sets

  lr = pc, and bx r0 into it, so the handler returns via the pop {pc} here and then

  straight back to this routine''s caller — r0-r3 and the NZCV flags are whatever the

  handler left. R1 is reloaded with the selector byte before the call; r2-r12 and the

  flags reach the handler untouched. Any selector value other than 0/4/8 would read a

  word past the table and jump to garbage, but the game apparently never produces one.

  The three targets (sub_8119AEC, sub_8119BD0, sub_8119BE0) presumably implement the

  individual states/phases of one object (likely an NPC or sprite object), but those

  handlers were not identified here, so the subsystem prefix and game meaning are

  inferred only from the dispatch pattern.

  '
