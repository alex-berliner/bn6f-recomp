name: t3_0x98_80D8444
address: '0x080D8444'
kind: function
status: confirmed
summary: Tail-call dispatcher that jumps to a BattleObject handler chosen by BattleObject->CurState via a 3-entry
  jump table.
interface: "void battleObject_stateDispatch_80D8444(void);\n  // in:  r5 = BattleObject*\n  // out: r5 r8 r9 r10\
  \ r11 r12 (per selected handler); r0-r4 r6 r7 clobbered\n  // flags: nz c v clobbered\n"
details: 'Reads a byte state index from r5+oBattleObject_CurState, scales it as a byte

  offset into the 3-entry jump table at off_80D8458, loads a Thumb handler

  address (already +1 to flag Thumb mode), and tail-calls it via the classic

  "mov lr, pc; bx r1" idiom so the handler returns directly to this function''s

  caller. The three dispatched handlers are sub_80D8464+1 (state 0),

  battleObject_respawn_80D84DE+1 (state 1), and object_genericDestroy+1

  (state 2), matching the standard table_state_t lifecycle

  (init/active/destroy). `push {lr}` / `pop {pc}` is a Thumb2 veneer for a

  function that never actually returns locally.

  '
