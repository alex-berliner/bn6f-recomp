  detail: '- `strb r0,[r5]` with `mov r0,#0x23` sets CurState byte to 0x23 (lines just past `battle_beastOut_initActor_8118368:`).
    - `bl initGuiSprite_8002770` uses `r1=&unk_201F6F0` (off_81183C0), the shared 0x12 sprite header for
    the Beast-out / Program-Advance overlay. - `ldrh r2,[r6,#0x20]` reads BattleState (r6) +0x20 — matches
    `BattleState.Unk_20` rather than AIData; the multiplier `*0x14` looks like a column stride for the
    panel grid (3 panels per column * 0x08 stride, or panel-row spacing). - `sprite_setCoordinates(r0=0xE6,
    r1=0x1B + computed)` hard-codes X=0xE6 and uses the running actor column to drive Y, consistent with
    placing an overlay actor relative to a fixed pivot on the field. - Tail call to `battle_beastOut_runBattleStep_81183C4`
    matches the dispatcher summary (Lib/AI + sprite updates, returns enemy-alive count). - Capture''s
    exit `r0=0x1C60, Z=1` is exactly an alive-enemy-bitmask count of 7 with zero carry, matching the dispatcher''s
    "alive-enemy-row count" return semantics. - Out-contract lists only `r2,r3,r5` — those are the BattleState
    fields the inner step updates, not values exposed to upper callers, so this function itself is effectively
    void-like.'
