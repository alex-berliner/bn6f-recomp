name: object_restorePanelPositions
address: '0x080E8612'
kind: function
status: probable
summary: Restores a battle object's saved panel position sequence.
interface: (r0 = battle object pointer or null) -> r0 = unspecified; flags preserved
details: If the object pointer is non-null, it restores three panel positions from ExtraVars+4, ExtraVars+8,
  and ExtraVars into the object via object_setPanelPosition, using panel row 2. The calls occur during
  panel-slide setup/advance, where the saved panel sequence is synchronized before further movement. A
  null pointer is accepted as a no-op. The return value is not consumed by the listed callers.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly calls object_setPanelPosition three times with panel coordinates loaded from ExtraVars+4,
    +8, and +0, always with r1=2.; object_panelSlideMovementStep passes RelatedObject1Ptr and the computed
    destination panel in r2 at 0x080CE99E.; sub_80CE8F4 initializes ExtraVars and calls the function with
    RelatedObject1Ptr when Param2 equals 1 at 0x080CE92C.; sub_80E8656 calls it after checking related-object
    fields at 0x080E8678.
