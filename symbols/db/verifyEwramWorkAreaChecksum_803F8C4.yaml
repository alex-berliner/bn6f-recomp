name: verifyEwramWorkAreaChecksum_803F8C4
address: '0x0803F8C4'
kind: function
status: confirmed
summary: Anti-tamper integrity check - recomputes a byte-sum checksum over the 0x6710-byte EWRAM work area and compares
  it with the stored value, clearing the store and returning 0 on match, 1 on mismatch.
interface: 'int verifyEwramWorkAreaChecksum_803F8C4(void); // r0 out: 0 = checksum OK, 1 = mismatch; NZ flags set
  from r0'
details: 'Reads the toolkit''s S2001c04 pointer (r10 + oToolkit_S2001c04_Ptr), takes the previously stored checksum
  from offset 0x68, and immediately zeroes that field so each check consumes the stored value (it must be re-saved
  elsewhere before the next call). Then sums all bytes of the EWRAM work area starting at timer_2000000 (0x2000000)
  from offset 0x670F down to 0, adds a fixed bias of 0x18, and compares the total with the stored value. Returns
  0 when equal (data intact) and 1 otherwise. This is a RAM-tamper/cheat-detection routine: any modification (codes,
  memory editors) to that work region between checksum generation and verification makes the sum differ. r1-r7 and
  lr are pushed and restored; r0 is the only meaningful output besides NZ flags.'
