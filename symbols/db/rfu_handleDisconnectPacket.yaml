name: rfu_handleDisconnectPacket
address: '0x081460B0'
kind: function
status: probable
summary: 'Handles a received disconnect (command 0x26) during wireless connection state 0xF: tears down
  the link slot and clears connection state.'
interface: (void) -> void; only acts when state byte 200FE04 == 0xF and incoming packet ID == 0x26
details: 'Checks the rfu connection struct at 200FE00: if state byte +0x04 is 0xF, it looks up the current
  slot index at +0x10 in the packet table dword_2010CB0 and reads the packet''s halfword ID; if it is
  0x26 (a disconnect/end command), it zeroes the state bytes +0x04 and +0x05, frees the RFU slot via rfu_clearSlot(4,
  slot), clears bit (1<<slot) in the connected-slots bitmask at +0x24, zeroes the per-slot halfword at
  +0x28+slot*2, and finally calls sub_81461B0(0x24, 0) to clear data starting at struct offset 0x24. Effectively
  the ''peer disconnected / link ended'' branch of the connection state machine.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#0x4]; cmp #0xF gates everything on connection state 0xF (asm lines 3-5); packet
    table dword_2010CB0[slot] halfword compared to 0x26 before any teardown (lines 7-11); state bytes
    200FE04/05 zeroed and rfu_clearSlot(4, slot) called only on match (lines 12-17); bic of (1<<slot)
    into byte 200FE24 clears the slot''s connection bit (lines 20-24); all six call sites are inside rfu_handleConnectionEvent,
    the link-event dispatcher'
