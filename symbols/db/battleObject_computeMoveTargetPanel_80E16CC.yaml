name: battleObject_computeMoveTargetPanel_80E16CC
address: '0x080E16CC'
kind: function
status: confirmed
summary: Builds a packed panel/row target for a battle object's movement (own panel, one ahead, or one behind depending
  on requested side vs. effective alliance) and hands it to the battle-object row iterator.
interface: u32 battle_computeMoveTargetPanelAndIterateRow_80E16CC(u32 mode /*r0*/, BattleObject* object /*r1*/,
  u32 arg2 /*r2*/); r4 pass-through (pushed/popped, returned unchanged); r6/r7 preserved; flags clobbered; returns
  iterator result in r0
details: "Computes a packed target specifier and immediately calls battle_aiIterateOverBattleObjectsByRow_80E1704\
  \ with it in r4, the battle object pointer in r6, and the caller's third argument in r7 (all three are effectively\
  \ the iterator's arguments; r6/r7 are saved and restored around the call). The packed specifier depends on mode\
  \ (r0): - mode == 2: \"stay put\" - PanelX is packed into BOTH bytes of the specifier (PanelX | PanelX<<8),\n\
  \  so the object targets its own panel.\n- otherwise: the object's effective side is read as Alliance ^ DirectionFlip\
  \ (a direction-flipped\n  object counts as the opposite alliance). If mode == effective side, the specifier is\n\
  \  (PanelX + 1) | (6 << 8) - one panel forward with row selector 6 in the high byte. If mode differs,\n  the specifier\
  \ is ((PanelX - 1) << 8) | 1 - one panel back with selector 1 in the low byte.\nNote the asymmetric byte packing\
  \ between the two non-neutral branches: in the \"same side\" case the column is in the low byte and the selector\
  \ in the high byte, while in the \"opposite side\" case the column is in the high byte and the selector in the\
  \ low byte. Fields touched: oBattleObject_PanelX, oBattleObject_Alliance, oBattleObject_DirectionFlip. This looks\
  \ like part of battle AI/ movement target selection feeding the row iteration helper.\n"
