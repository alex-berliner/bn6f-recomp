open_questions:
- What r2/r7 carries (likely a column mask / object reference passed straight to the callee); what the
  high-byte constants 6 and 1 encode (probably movement direction flags the callee interprets); and whether
  2 really means the human player or some other actor-type enumerator — settling it needs the AIIndex
  / ActorType usage in nearby AI code and the body of sub_80E1704.
