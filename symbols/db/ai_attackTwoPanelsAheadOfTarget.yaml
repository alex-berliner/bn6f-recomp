name: ai_attackTwoPanelsAheadOfTarget
address: '0x081010A0'
kind: function
status: probable
summary: AI attack routine that hits the panel in front of the target plus the one above it, for two vertically
  stacked tiles.
interface: (r0-r3 unused? struct in r7) -> none; r7 = AI attack vars {TargetPanelX, TargetPanelY, InitFlag,
  AiDifficultyTier, Damage}
details: Loops twice (r6 = 0..1). Each pass computes x = TargetPanelX + object_getFrontDirection() (one
  column toward the object's facing side) and y = TargetPanelY - 1 + r6, i.e. the target's row and the
  row above it, and skips the hit if object_isValidPanel rejects the tile. For each valid panel it calls
  sub_80D6EB0 with the (x, y) coords, InitFlag in r2, and a packed value 0x1E00 | AiDifficultyTier, loading
  Damage from the struct into r6 around the call (5th-argument convention for that callee). The 0x1E00
  constant looks like an attack/element id packed with the difficulty tier into one halfword-style argument.
  InitFlag being forwarded suggests sub_80D6EB0 both initializes and fires the attack object at the given
  panel.
