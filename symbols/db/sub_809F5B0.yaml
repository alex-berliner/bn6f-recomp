name: sub_809F5B0
address: '0x0809F5B0'
kind: function
status: confirmed
summary: Rebuilds an overworld NPC's interaction/collision area around its next position, unless the NPC has collision
  disabled, then clears its Unk_54 slot.
interface: void sub_809F5B0(OverworldNPCObject *r5 npc, u32 r2 pass_through) -> u32 r2 (createOWObjectInteractionArea
  result, or the pass-through value when skipped), u32 r5 (npc, unchanged)
details: 'Takes an overworld NPC object in r5. First checks oOverworldNPCObject_UnkFlags_60 for the

  OW_NPC_UNK_FLAGS_60_DISABLE_COLLISION bit; if set, the whole interaction-area rebuild is

  skipped (r2 falls through unchanged). Otherwise it computes the NPC''s center in fixed-point

  overworld coordinates: NextX/NextY/NextZ plus the corresponding signed-byte CenterOffsetX/Y/Z

  shifted left 16 bits (the standard overworld 1/65536-pixel coordinate format). It then calls

  createOWObjectInteractionArea_80037ac with the computed x/y/z, hardcoded size parameter

  0x804, flag OW_OBJECT_INTERACTION_AREA_FLAG_0x80000, flags

  (OW_OBJECT_INTERACTION_AREA_FLAG_0x10000 | OW_OBJECT_INTERACTION_AREA_FLAG_0x40000), and

  r6 = npc + oOverworldNPCObject_Unk_54 as the output/handle slot the callee writes through.

  r5 is saved around the call and restored, so r5 is preserved. Afterwards (and on the skip

  path too) it stores 0 into oOverworldNPCObject_Unk_54 — the clear must happen after the call

  since the callee writes through that pointer. The callee''s r2 result is propagated to the

  caller; the callee also returns values in r3/r7 per its ABI, but this function only forwards r2.

  Callers pass r2 in as a pass-through on the skip path, so r2 must be considered an input.

  '
