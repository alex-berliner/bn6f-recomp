name: battle_fadeInCountdownObjectUpdate
address: '0x080CBCB0'
kind: function
status: probable
summary: Per-frame update that fades a battle object in via alpha blending, and on timer expiry disables
  alpha, sets action 8, calls sub_80CC006, optionally enables collision region 1, frees its reserved FuturePanel,
  and runs a Param1-gated follow-up handler.
interface: (r5 = battle object) -> r0 = 0; touches oBattleObject_Timer2 (alpha level), oBattleObject_Timer
  (lifetime), oBattleObject_CurAction, FuturePanelX/Y, Param1
details: Each call increments Timer2 and passes it to sprite_setAlpha, so the object's alpha level ramps
  up over its lifetime (fade-in). It then decrements Timer; while Timer stays >= 0 the routine returns.
  When the countdown expires it calls sprite_disableAlpha, writes action 8 to oBattleObject_CurAction
  and zeroes a halfword at a fixed low address, then calls sub_80CC006; if that returns nonzero it sets
  collision region 1 via object_setCollisionRegion and releases the panel reserved at FuturePanelX/FuturePanelY
  via object_removePanelReserve. Finally, if oBattleObject_Param1 is nonzero it calls sub_80CBF8C, presumably
  to spawn or transition to another behavior.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r5,#oBattleObject_Timer2]; add #1; bl sprite_setAlpha_8002c7a — alpha level tracks
    the incrementing Timer2 (fade-in); ldrh r0,[r5,#oBattleObject_Timer]; sub #1; bge locret — Timer is
    a frame countdown gating the end-of-life path; bl sprite_disableAlpha; mov r0,#8; strb r0,[r5,#oBattleObject_CurAction]
    — on expiry the object leaves the fading state via action 8; bl object_setCollisionRegion (r0=1) +
    bl object_removePanelReserve with FuturePanelX/Y — expiry makes the object solid and frees its reserved
    panel; ldrb r0,[r5,#oBattleObject_Param1]; bl sub_80CBF8C — optional post-expiry behavior keyed off
    Param1'
