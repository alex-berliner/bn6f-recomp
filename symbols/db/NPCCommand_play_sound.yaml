name: NPCCommand_play_sound
address: '0x0809F048'
kind: function
status: confirmed
summary: NPC script opcode handler that reads a halfword sound-effect id from the script and plays it.
interface: 'void NPCCommand_play_sound(u32 scriptPos /* r6 */); out: r0 = sound id (whatever PlaySoundEffect leaves),
  r6 = scriptPos + 3, nzcv set by "adds r6, #3"'
details: 'One of the NPC script interpreter''s command handlers. On entry r6 points at the current

  script instruction: byte 0 is the opcode, bytes 1-2 are a halfword sound-effect id.

  Calls ReadNPCScriptHalfword with r0 = scriptPos+1 to fetch the id (this reads the script

  via the interpreter''s byte-access routine, so it works wherever the script is loaded),

  passes the id to PlaySoundEffect, then advances r6 by 3 to skip the whole instruction.

  Preserves the other caller registers (r2-r5, r7, r10). The final adds r6, r6, #3 leaves

  nz/c flags that some callers inspect (the interpreter dispatch loop checks for carry/negative

  style conditions on the new script position).

  '
