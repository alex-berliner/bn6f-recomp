name: owPlayer_lockPlayerForNonNPCDialogue_809E0B0
address: '0x0809E0B0'
kind: function
status: confirmed
summary: Locks the player in place so dialogue with non-NPC objects (L button, jacking in, examining objects) can
  run without the player moving.
interface: 'void owPlayer_lockPlayerForNonNPCDialogue_809E0B0(void); // in: r10 (passed by callers, unused here),
  lr as return address; out: r0, r1, r3 and NZCV as left by the callees'
details: 'Marks the player as busy/locked by storing 1 as a byte into the single-byte struct at

  eStruct200ace0 (0x0200ACE0); the comment notes that while this byte is not set, the map

  location can change after the call, e.g. when jacking in. Then sets event flag

  EVENT_1718 (bank 0x17, index 0x18) via SetEventFlagFromImmediate — same remark applies:

  while unset, the map location changes after the call (also when jacking in). Finally

  calls ClearPlayerCanMoveEventFlag to strip the player-can-move flag so free movement is

  disabled until the dialogue releases the player. Callers invoke this before pressing L,

  jacking in, or talking to objects (but not NPCs). Tail-calls through to

  ClearPlayerCanMoveEventFlag, so r0/r1/r3 and the flags on return are whatever that

  callee left.

  '
