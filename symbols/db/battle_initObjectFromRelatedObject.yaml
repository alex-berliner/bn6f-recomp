  reproduce: python3 tools/asmcat.py 0x080BAF74
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function reads RelatedObject1Ptr (r4), copies its position, palette, facing, and loads sprite/animation
    data into r5, then advances r5 to CUR_STATE_UPDATE. That matches a ''clone/visual copy from related
    object'' description well. However, the name ''initSpriteFromRelatedObject'' is fine but a bit narrow
    — it also sets position, palette, facing, and calls sub_80BB00C (likely a final init step). The proposed
    summary is largely accurate, but it omits that CurAnimCopy is set to 0xFF (already in details), and
    the heavy Navi-stats path is only one branch (cmp r0,#2 / bne loc_80BAF9E); non-Navi sources go through
    enemy_getArmPosition_800F26C. The name ''battle_initSpriteFromRelatedObject'' is reasonable; a more
    general name like ''battle_initObjectFromRelatedObject'' would cover the position/palette/facing/state
    work too.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- No known caller, so which objects take this path (clone/illusion/transform?) and what r5 points to at
  entry is unconfirmed
- Meaning of the variant==2 branch (stats bytes 0x2C/0x29 + chip class) and of sub_8010DF6 / sub_80BB00C
  / sub_80E1352(0xF) is unresolved
- The function reads RelatedObject1Ptr (r4), copies its position, palette, facing, and loads sprite/animation
  data into r5, then advances r5 to CUR_STATE_UPDATE. That matches a 'clone/visual copy from related object'
  description well. However, the name 'initSpriteFromRelatedObject' is fine but a bit narrow — it also
  sets position, palette, facing, and calls sub_80BB00C (likely a final init step). The proposed summary
  is largely accurate, but it omits that CurAnimCopy is set to 0xFF (already in details), and the heavy
  Navi-stats path is only one branch (cmp r0,#2 / bne loc_80BAF9E); non-Navi sources go through enemy_getArmPosition_800F26C.
  The name 'battle_initSpriteFromRelatedObject' is reasonable; a more general name like 'battle_initObjectFromRelatedObject'
  would cover the position/palette/facing/state work too.
