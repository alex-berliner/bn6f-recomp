name: battle_initObjectFromRelatedObject
address: '0x080BAF74'
kind: function
status: probable
summary: Clones a related object's sprite (graphic+animation), position, palette, and facing into the
  given battle object, then advances its state to CUR_STATE_UPDATE and runs sub_80BB00C.
interface: (r5 = battle object being set up; uses r5->RelatedObject1Ptr as source) -> r0 = void; called
  late in the object's setup with r5 already holding the object
details: The source is r4 = r5->RelatedObject1Ptr. Its NameID is unpacked via unpackVerActorTyAndAIIdx;
  if the variant/type byte is 2, the sprite graphic is chosen via GetBattleNaviStatsByte (0x2C, 0x29)
  plus chip_class_lookup, otherwise via enemy_getArmPosition (slot 0xCD..0xFF vs normal actor ids). sprite_load/sprite_loadAnimationData
  load the graphic and animation, then CurAnim is zeroed, CurAnimCopy set to 0xFF, and oObjectHeader_Flags
  bit 1 is set. Three words at source+0x34 (position x/y/z) are copied to the new object's +0x34 before
  object_setPanelsFromCoordinates recomputes its panel coords; palette comes from battle_pickPaletteIndexForNavi
  and facing from object_getFlip. Finally sub_8010DF6/sub_80E1352(0xF) run, CurStateActionPhaseAndPhaseInitialized
  is set to CUR_STATE_UPDATE, and sub_80BB00C is called. The heavy reliance on the related object's Navi
  stats for palette suggests this builds a visual copy/clone of another actor (e.g. an illusion or transformed
  navi).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r4,[r5,#oBattleObject_RelatedObject1Ptr]; ldrh r0,[r4,#oBattleObject_NameID] — sprite id
    comes from the related object; bl sprite_load / sprite_loadAnimationData / sprite_hasShadow — loads
    and animates the sprite; ldmia r0!,{r1-r3} at src+0x34; stmia at r5+0x34 then bl object_setPanelsFromCoordinates
    — copies world position from source; bl battle_pickPaletteIndexForNavi_801002C + sprite_setPalette
    + object_getFlip + sprite_setFlip — palette and facing derived from the source navi; mov r0,#CUR_STATE_UPDATE;
    str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]; bl sub_80BB00C — finishes setup
    by advancing the state machine
  refs:
  - bn6f/asm/asm31.s:6276
  - 0x08013774 GetBattleNaviStatsByte_AllianceFromBattleObject
  - 0x0801002C battle_pickPaletteIndexForNavi_801002C
