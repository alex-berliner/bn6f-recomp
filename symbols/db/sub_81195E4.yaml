kind: function
status: confirmed
summary: Zeros the header and body tile blocks of an object's tiles in `vObjectTiles`, sized 0xA00 and 0x780 bytes,
  preserving the caller's r0.
interface: void clearObjectTileBlocks_81195E4(void /* r5 = object, r0 preserved, r1/r2/lr/NZCV clobbered */);
details: "Uses r5 as a pointer to an object/entity structure. Reads `r5+5` as an index\ninto the descriptor table\
  \ at `off_8119128`, where each entry is a pointer to\na small descriptor struct:\n  - desc->+0 : header tile-block\
  \ slot\n  - desc->+8 : body tile-block slot\nEach slot is shifted left by 5 to produce a byte offset within the\n\
  `vObjectTiles` tile buffer, then the region is zeroed with\n`ZeroFillByEightWords`. The header region is 0xA00\
  \ bytes; the body region\nis 0x780 bytes. `r0` is push/pop'd around both BL calls so the caller's\nvalue survives.\
  \ No flags are passed in or out beyond standard convention.\nLikely counterpart to (or called before) the function\
  \ that uploads the\nper-object tiles into those same slots.\n\nRegister form, old prompt; queued for retype (the\
  \ farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
