name: object_spawnElementCollisionRegionWithFallback
address: '0x080DCC96'
kind: function
status: probable
summary: Spawns a collision-region object on this battle object's panel and Element using the standard
  spawner; if it fails, retries via the timestop-persistent (dimming) variant.
interface: (r5 = battle object (not an r0-style arg)) -> r0 = spawned region object via callee, or undefined
  on failure path; no meaningful flags to caller
details: Reads the object's PanelX, PanelY, and Element fields from its oBattleObject struct and passes
  them, with r3=0, r4=0x0A050701, r6=its DamageAndStaminaDamageCounterDisabler field, and r7=3, to object_spawnCollisionRegion.
  If oBattleObject_Param2 equals 1 it instead calls object_spawnDimmingCollisionRegion, the variant that
  keeps updating during timestop. Both branches pass identical arguments; the only difference is which
  spawner is used. The branch target after the normal spawn only jumps away when the callee returns success-equal
  flag clear (failure), so errors are silently dropped. The caller's r5 is an object context pointer,
  so this is a method-like helper on a battle object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1/r2 of oBattleObject_PanelX/PanelY/Element before both bl's shows the region is placed
    on the object's panel with its element; cmp r0,#1 / beq selecting object_spawnDimmingCollisionRegion
    shows Param2 picks the timestop-persistent variant; ldr r4 =0xA050701 constant reused for both calls
    is the packed region-spawn parameter set; ldr r6 from oBattleObject_DamageAndStaminaDamageCounterDisabler
    forwards the object's damage-counter-disable flag to the region; callee summaries of object_spawnCollisionRegion
    / object_spawnDimmingCollisionRegion match the spawn pattern
