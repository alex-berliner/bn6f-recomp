name: battle_applyElementAttackModIfEnabled_80CAD14
address: '0x080CAD14'
kind: function
status: confirmed
summary: Conditionally applies the elemental-attack damage modifier to a battle object, forwarding its element,
  attack parameter and damage-counter-disable word to the modifier routine.
interface: void battle_applyElementAttackModIfEnabled(u32 enable /*r0*/, u32 r1, u32 r3, BattleObject* obj /*r5*/);
  flags Z from (enable==0) when enable==0, otherwise whatever sub_80CAEC8 leaves
details: A thin guarded wrapper around sub_80CAEC8. If r0 is zero the function does nothing except leave the Z flag
  from "tst r0, r0" for the caller (C/V untouched in that path). If r0 is nonzero, it reads BattleObject fields
  oBattleObject_Element (byte) into r2, oBattleObject_Param1 (byte, offset +4) into r4, and oBattleObject_DamageAndStaminaDamageCounterDisabler
  (word) into r6, then calls sub_80CAEC8 to apply the elemental modifier. r1 and r3 are passed through to the callee
  untouched. The push {r4,r6,lr} / pop {r4,r6,pc} pair exists only to keep r4 and r6 intact across the call, so
  callers always see their own r4/r6 regardless of the branch taken; r2 is only meaningful when the call happens.
