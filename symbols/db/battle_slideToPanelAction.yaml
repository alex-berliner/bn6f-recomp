name: battle_slideToPanelAction
address: '0x080C2324'
kind: function
status: probable
summary: 'Battle-object action handler that slides the object to a target panel: reserves the destination,
  moves it there with sound/anim, spawns an effect object, and times the move out back to idle.'
interface: (r0 = unused/pass-through, r5 = battle object) -> r0 = trash; updates object panel fields,
  timer, CurAnim, CurAction/Phase, reserves panels, plays SFX 0xB0, spawns temp attack object
details: 'On first entry (PhaseInitialized==0) it sets PhaseInitialized=4 and Timer=0x1E (30 frames),
  releases the panel reserved at FuturePanelX/Y, then calls sub_80C2518(1) to validate/resolve the move;
  on success it copies the returned target into PanelX/PanelY and DirectionFlip, recomputes pixel coordinates
  and sprite flip, copies the panel back into FuturePanelX/Y, reserves the new panel via object_reservePanel,
  plays SFX 0xB0, sets CurAnim=5, and spawns a type-1 subtype-5 temp attack object (header 0x10D03) linked
  at object+0x64. If the move is rejected it sets Param3=1 and calls sub_80C2678 instead. During the timed
  phase it decrements Timer: with Param3==0 it at Timer==0x12 calls sub_80C26A0(0x17) and sub_80C2600(1),
  and at 0 resets CurAnim and calls sub_80B8E58(ExtraVars+4); with Param3!=0 it just counts down. On expiry
  (or failure path end) it clears Param3, sets CurAction=0x14 and CurPhase=0, returning the object to
  its idle action.'
