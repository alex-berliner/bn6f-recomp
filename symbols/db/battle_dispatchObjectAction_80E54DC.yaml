name: battle_dispatchObjectAction_80E54DC
address: '0x080E54DC'
kind: function
status: confirmed
summary: Battle-object action dispatcher — reads the object's CurAction byte and jumps to the matching
  per-action handler via a jump table.
interface: void battle_dispatchObjectAction(BattleObject* obj /*r5*/); tail-calls one of three handlers
  with (r0 = action byte, r1 = handler address, r5 = obj); outgoing r5/r8-r12 and flags come straight
  from the chosen handler
details: 'A tiny trampoline: loads the battle object''s oBattleObject_CurAction byte from [r5], indexes
  the table at off_80E54F0 with the raw byte, and performs `mov lr, pc; bx r1` so the handler returns
  to this function, which then `pop {pc}`s back to the original caller. Table entries (thumb+1 addresses):
  action 0x00 -> object_slideXAndCheckPanel (sub_80E54FC), action 0x04 -> battle_introAnimPhaseHandler
  (sub_80E5546), action 0x08 -> object_destroyIfExtraVarTargetNull (sub_80E557A). Since the raw byte indexes
  the 4-byte-stride table, only action values 0/4/8 land on valid entries — any other CurAction would
  jump to garbage, so callers are expected to keep CurAction within that set. All register effects are
  simply whatever the selected handler leaves behind; this routine itself preserves nothing.

  '
