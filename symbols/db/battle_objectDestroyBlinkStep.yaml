  date: '2026-10-18'
  detail: 'sub_800F8CE: tst r0, r1 (0x40000); beq -> return 2 — early-out when the destroy condition isn''t
    set; loc_800F8E8-loc_800F8F6: sets/clears bit 2 of oObjectHeader_Flags depending on Timer&2 — blink
    pattern; Timer initialized to 0x14 and decremented; ''mov r4,#1'' on expiry — 20-frame countdown before
    returning done; Called from battle_finalizeObjectRemoval (0x080DB252) and battle_bombExplode (0x080CBDE6/0x080CBE48)
    — destruction paths of battle objects; Called from battle_bombObjectUpdate (0x080DA2EC) which ''spawns
    an explosion effect and destroys/cleans up the object'' — same destroy sequence'
