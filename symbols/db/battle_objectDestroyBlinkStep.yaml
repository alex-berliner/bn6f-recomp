name: battle_objectDestroyBlinkStep
address: '0x0800F8CE'
kind: function
status: probable
summary: 'Per-frame destroy-state step for a battle object: returns 2 if bit 0x40000 is clear, otherwise
  runs a 20-frame blink timer that clears the visible bit on odd-half frames and returns 1 when the timer
  expires, else 0.'
interface: (r0 = object status/flags word, r5 = battle object pointer, not saved) -> r0 = 2 if bit 0x40000
  clear, 0 while counting down, 1 when timer expired; no flags of interest
details: The caller preloads r5 with the battle object; the function only saves r4/lr. If bit 0x40000
  of r0 is clear it returns 2 immediately (state not applicable). On first entry it sets oBattleObject_PhaseInitialized=1
  and loads oBattleObject_Timer=0x14, then sets bit 2 (visible/active) in oObjectHeader_Flags. While the
  timer runs, bit 2 is cleared on frames where (Timer & 2) != 0 and re-set otherwise, producing a 2-frame-period
  flicker. The timer is decremented each call; when it reaches 0 it returns 1 (done), otherwise 0 (still
  blinking). It is a state-handler step returning a tri-state code, matching the bomb explode/destroy
  flows that call it before tearing the object down.
evidence:
