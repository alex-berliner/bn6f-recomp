summary: Look up a chip-id-driven reordering table for chip-pack slot rows.
interface: (r0 = chipIndexInSearchTable 0..0xA) -> r0 = remappedSlotIndex ; side effects none
details: "Tiny tail-call helper. `push {lr}` / `pop {pc}` plus `ldr r1, =byte_811FF60; ldrb r0,[r1,r0]`\
  \ is\n  the canonical Thumb idiom for \"return table[index]\" with no stack frame.\n  `byte_811FF60`\
  \ is a 12-entry u8 remap table: `[0,1,2,3,8,4,6,7,5,9,0xA,0]`. Indices\n  0..3 and 0xA pass through,\
  \ 4→8, 5→4, 6→6, 7→7, 8→5, 9→9, 0xB→0. The caller passes r0 in\n  0..0xA (captured calls show 0x4..0xA\
  \ only), and the function returns the remapped value\n  in r0.\n  Two of the three confirmed callers\
  \ are chip-pack construction routines:\n  buildChipSearchTable_811FE7C indexes 0..3 in this region,\
  \ and sub_81203E4 (\"packed\n  chip-slot address list from a chip-pack entry row of the folder table\"\
  ) calls it for\n  each chip in a row — exactly the place where the engine needs a reorder to map a\n\
  \  5-chip pack's row position into the final 10-chip selection order. The 0 and 0xA\n  pass-through\
  \ plus the 8↔4 swap strongly suggest this is the \"second row of a pack\"\n  ordering helper (the first\
  \ row uses 0..4 directly).\n  The `_ADDRESS` suffix is kept because the larger role (\"render the 10-slot\
  \ select\n  order from a 5-pack row\") relies on caller context rather than this function alone.\n"
