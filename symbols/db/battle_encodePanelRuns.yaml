  date: '2026-10-18'
  detail: 'loc_800C68C: cursors [sp]=1 and [sp+4]=6, loop while [sp] < [sp+4], r4 negated each pass (neg r4) — two-sided
    zigzag scan; bl countMatchingRun_800C84A with (cursor, ±1); strb r0,[r7,#2] / strb r1,[r7,#3] store count and
    returned value as a record; add r5,r5,r3 / str r5,[r6]: cursor advanced by count*dir, so each record consumes
    one full run of equal panels; strb r0,[r7] / strb r3,[r7,#1]: record bytes 0-1 = (count-1)*dir+count and -dir;
    ldr r7,off_800C8D0 = byte_203F6B0 output base; loc_800C6CE: strb 0xFF,[r7] terminates the record list; sole
    caller battle_buildPlayerPanelGrid_800C4BC is the panel-grid builder'
