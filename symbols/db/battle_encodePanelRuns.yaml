name: battle_encodePanelRuns
address: '0x0800C67C'
kind: function
status: probable
summary: Finalises the player panel grid by scanning it as a zigzag from row 1 downward and row 6 upward, emitting
  a 0xFF-terminated list of 4-byte equal-panel run records to byte_203F6B0.
interface: () -> void; writes run records to byte_203F6B0 (4 bytes each, first byte 0xFF terminates)
details: 'Uses two stack cursors initialised to 1 and 6, which must be the first and last panel rows of the grid
  built by battle_buildPlayerPanelGrid_800C4BC. Each pass calls countMatchingRun_800C84A(cursor, dir) with dir alternating
  +1/-1 (r4 is negated every iteration), counting a run of equal 8-byte-stride panel entries next to the cursor
  row. For each run it writes a record: byte2 = run length, byte3 = value returned in r1 by countMatchingRun, byte1
  = -dir, byte0 = (count-1)*dir + count, then advances that pass''s cursor by count*dir (r5 = [r6] + count*dir stored
  back), so consecutive records tile the grid without overlap. The two cursors close in on each other (loop exits
  when cursor1 >= 6-cursor), producing records ordered from the top edge down and bottom edge up alternately. The
  byte0 formula and the meaning of countMatchingRun''s r1 return are not fully pinned down without that callee''s
  body, but the structure is a run-length/packing pass over the panel grid, likely consumed by panel rendering or
  a panel animation.'
