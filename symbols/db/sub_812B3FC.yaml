summary: Runs a chatbox script line whose ID is looked up from a small table using a field in the R5 struct.
interface: 'void sub_812B3FC(void);  /* reads: r5 (struct), r10; writes: r2,r3,r4,r5,r6,r7,lr; clobbers: r0,r1,N,Z;
  preserves: r6,r7 */'
details: 'Pulls a byte at offset 0xE from the struct pointed to by r5 (an "index" / line-id field), uses

  it as an index into the 2-entry table at dword_812B410 (entries 0x00080706 and presumably a

  second), and passes the looked-up value to chatbox_runScript_803FD9C_on_eTextScript201BA20,

  which runs the corresponding eTextScript201BA20 chatbox line. r10 is passed in from the caller

  but unused here. Tail-calls the script runner via pop {pc}, so lr is preserved as a return path

  to the caller rather than to a fixed point.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
