name: battleObject_jumpStepSetLandAnim
address: '0x08103E1E'
kind: function
status: probable
summary: Steps an object's jump/landing sequence one tick, then switches its current animation to 0x41.
interface: (r5 = battle object pointer, implicit; no args in r0-r3) -> r0 = 0; flags from battleObject_jumpLandStep
details: 'A tiny wrapper around the jump/land step routine: it calls battleObject_jumpLandStep_8017768
  (which handles the hop state machine on the object in r5), then unconditionally stores the constant
  0x41 into the object''s oBattleObject_CurAnim byte, overriding whatever animation that step left selected.
  It returns 0 in r0. r5 is used directly without being passed in, so the caller must hold the object
  pointer in r5.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battleObject_jumpLandStep_8017768 performs the per-frame jump/land update on the r5 object;
    mov r0,#0x41; strb r0,[r5,#oBattleObject_CurAnim] hard-codes animation 0x41 as the follow-up state;
    no other reads/writes: the whole body is push, bl, mov/strb pair, pop, so it only advances the hop
    and sets the anim'
  refs:
  - bn6f/asm/asm31.s:163734
  - 0x08017768 battleObject_jumpLandStep_8017768
  reproduce: python3 tools/asmcat.py 0x08103E1E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- which caller invokes this and with what object (r5 is never named), so the exact gameplay meaning of
  animation 0x41 (e.g. landing pose vs. a specific enemy pose) is unconfirmed
