name: sub_803DD30
address: '0x0803DD30'
kind: function
status: confirmed
summary: Derives a small link-mode selector (0..3) from the eStruct200BC30 jump-offset slot and eLinkState, returning
  it in r0 with the zero flag set iff it is 0.
interface: 'int sub_803DD30(void) // in: nothing (r7, lr saved); out: r0 = selector (0..3), NZ flags per r0; preserves
  r7'
details: 'Reads the jump-offset slot of the structure at eStruct200BC30 (eStruct200BC30_getJumpOffset00). If that
  value is 4 the selector is 0; if it is 8 the selector is 1; for any other value (including 0) it falls back to
  the low 2 bits of the word at eLinkState + 0x48 (dword_2009A18) via AND #3. The result is returned in r0 and the
  NZ flags are set from it, so callers can both branch on zero and use the value directly. Likely used to pick a
  variant of link/communication behaviour (e.g. which partner or network state applies). r1 is clobbered as scratch;
  c/v are clobbered as a side effect of the compare/tst.

  '
