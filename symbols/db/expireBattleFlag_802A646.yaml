name: expireBattleFlag_802A646
address: '0x0802A646'
kind: function
status: confirmed
summary: Clears a battle-state flag at state+0x44 once the state's counter at state+0x45 reaches/exceeds
  a threshold read from the source object at r5+6.
interface: "void Next(uint32_t source /* r5 */, void /* r10 -> oToolkit_BattleStatePtr */);\n  /* trashes\
  \ r0, r1, r3 and N/Z/C/V flags; preserves nothing */\n"
details: 'Loads the battle state struct via r10->oToolkit_BattleStatePtr. If state->0x44 is 0 the

  routine returns immediately. Otherwise it compares state->0x45 (treated as signed) to

  r5[6] (the source object''s tick/threshold byte) and, once state->0x45 >= r5[6], writes 0

  to state->0x44, "expiring" whatever transient flag lives there. In other words, this is

  the auto-expiry half of a tiny timer pair: r5+6 is the duration, state+0x45 the

  accumulator, state+0x44 the one-shot flag.

  '
