open_questions:
- Exact meaning of r0's three table slots (which event IDs map to tables 1/2) and the full argument set
  handlers receive
- Whether handlers take the object pointer in r2/r3 or re-derive it; needs the callee sub_80111CA/sub_80111DC
  bodies or the caller call sites' register setup
- The dispatch is two-level but off_801105C has only 3 entries (0=35-nullsub table, 1=2=51-entry handler
  table), so r0 distinguishes at most 3 categories rather than acting as a free 'event selector'. Caller
  battle_despawnEnemyObject and sub_80C0EE2 (wait 4 frames then queue destruction) strongly imply a teardown
  hook, not an arbitrary event dispatch. The interface (r0,r1 preserved across mov lr,pc;bx r2) is correct
  but the per-object teardown framing is more specific than 'dispatchObjectEvent'.
