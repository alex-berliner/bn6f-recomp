    (... == 5) ? 2 : 1; ST16(..., attack_plus_one * damage_multiplier * 10)`, so emotion 5 gives (Attack+1)*20.
    Example: Attack = 3, emotion 5: original 10, C 80. (2) Unk_0c on the RN...'
