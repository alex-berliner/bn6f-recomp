name: busterBugChargeShotDamageCalcHappensHere_8011A7E
address: '0x08011A7E'
kind: function
status: probable
summary: 'AI attack-damage calculation for the Buster-bug-style charge shot: fills an AI attack-vars struct with
  damage derived from Attack (+1 if the user is a beast transformation), a randomized counter field, and zeroes
  the rest, then returns 0x16.'
interface: u32 battle_aiAttackDamageCalcBusterBug_8011A7E(u8 /*ignored*/ r5 /*= battle object (navi)*/, u8 /*ignored*/
  r10, aiAttackVars_t *r7 /*inout*/, void (*into) lr); // r0/r1/r2/r3/r5/r6/r7/lr clobbered, NZ set, return value
  in r0 = 0x16
details: "Inputs are passed in registers by callers (r5 = battle navi object whose stats drive the formula,\nr7\
  \ = the AI attack-vars struct to fill, r10/lr = extra caller state preserved/clobbered).\n\nDamage formula:\n\
  \  damage = ((Attack + 1) * 10)\n  if get_battle_emotion(navi.alliance) == 5 (the \"beast\" transformation) damage\
  \ *= 2\n  Stored as u16 at ai_vars + 0x08 (oAIAttackVars_Damage).\n\nA second value (oAIAttackVars_Unk_0c, u32\
  \ at +0x0C) is computed from a navi stat byte\n(oNaviStats_Unk_4f = 0x4F):\n  - if the stat is 0 or 6, the field\
  \ is set to 6\n  - else a \"random pick\" mask is chosen: mask = 7 when the stat is 9 or 0x23, else mask = 1\n\
  \    and (GetPositiveSignedRNG() & mask) == 0 forces the field to 6; otherwise the raw stat\n    value is kept\
  \ (or 6 only when the random bit was zero). The mask of 7 only matters if the\n    result is then compared with\
  \ 0; given the visible code, 7 vs 1 has no observable effect\n    here beyond possibly never being 0, which is\
  \ curious.\n\nAll other AI attack-vars fields (Unk_02, Unk_03, Unk_04, AttackBoost at +0x06, Unk_0a at +0x0A,\n\
  Unk_05 at +0x05) are cleared to 0.\n\nThe function returns 0x16 (in r0, sets NZ).\n\nQuirks:\n  - The pushed r0\
  \ between the Attack+1 read and the emotion check looks like a stub for a\n    possible future damage modifier,\
  \ but it has no observable effect today.\n  - The \"0x16\" return value is consistent with other AI attack builders\
  \ and is likely an\n    attack-id or completion sentinel consumed by the caller.\n  - r4 is pushed/popped around\
  \ the function only for alignment with the tail; it is also\n    used as a temporary for the unk_0c computation.\n"
