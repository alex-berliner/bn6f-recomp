name: battle_dispatchDetachRelatedObject_8011384
address: '0x08011384'
kind: function
status: confirmed
summary: Jumps to one of 27 per-type "detach related object" handlers selected by the type index in r0,
  running it with the caller's register context (notably the object pointer in r5) intact.
interface: void battle_dispatchDetachRelatedObject(u32 type_index /*r0*/, void* ctx /*r5*/); returns whatever
  the selected handler leaves in r4-r12 (tail-bridged to the caller)
details: 'Trampoline-style dispatcher for detaching a battle object''s related/child objects.

  r0 is a type index that is shifted left by 2 and used to load a handler address from

  the 27-entry table at off_8011398 (first entry battle_object_detachRelatedObject2_80111B8,

  entries 1-10 sub_80113FC, entry 11 and 13-17 and 24 nullsub_43, the rest sub_801140E).

  It then does the classic "mov lr, pc / bx r0" trick: the selected handler is entered

  with r1 = table base and lr pointing at the following pop {pc}, so the handler runs as

  if it were this function''s body and its r4-r12 results propagate straight to this

  function''s caller (the register contract lists r4-r12 as outputs for exactly that

  reason). r5, presumably the battle object being detached, is passed through untouched.

  There is no bounds check on the type index: indices >= 27 read bytes past the table

  and would jump to garbage, exactly as in the original. The thumb_func_end implies the

  handlers are expected to return with a matching pop/return.

  '
