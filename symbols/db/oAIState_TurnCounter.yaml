name: oAIState_TurnCounter
address: '0x4'
kind: struct-field
status: probable
summary: Per-attack turn/wait counter incremented each AI step until a difficulty-scaled threshold, after
  which the AI commits to its prepared attack.
details: The field is consistently read at the top of an AI step, compared against a small constant (2/3/4/5),
  and either incremented by 1 (with occasional +2/-1/+3 in special cases) or zeroed when the threshold
  is reached. Reaching the threshold triggers the actual attack setup (rng gates, sub_80F2CC2, object_setAttack0,
  etc.), and the byte is reset to 0 right after — a classic "wait N turns then act" pattern. Difficulty-tier
  tables in sub_80F594C/sub_8100308 index by AI difficulty and the result is compared directly against
  this byte, confirming it is the count of elapsed AI ticks before the attack fires.
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: 'Counter compared against threshold (cmp r0, #3) at the start of a Navi AI step; if >= threshold,
    attack branch taken.'
  refs:
  - bn6f/asm/asm31.s:125373
  reproduce: grep -n 'oAIState_TurnCounter' bn6f/asm/asm31.s | head
  result: '"ldrb r0, [r6,#oAIState_TurnCounter]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: 'Counter incremented by 1 each tick (`add r0, #1` / `strb r0, [r6,#oAIState_TurnCounter]`) when the
    rng gate fails, building up wait time.'
  refs:
  - bn6f/asm/asm31.s:125373
  reproduce: grep -n 'oAIState_TurnCounter' bn6f/asm/asm31.s | head
  result: '"ldrb r0, [r6,#oAIState_TurnCounter]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: '"strb r0, [r6,#oAIState_TurnCounter]" — counter cleared to 0 once the attack fires, so the next
    attack cycle restarts the wait.'
  refs:
  - bn6f/asm/asm31.s:125373
  reproduce: grep -n 'oAIState_TurnCounter' bn6f/asm/asm31.s | head
  result: '"mov r0, #0"'
- method: assembly-reading
  date: '2026-10-15'
  detail: AI difficulty tier indexes a per-difficulty threshold table which is compared against this byte
