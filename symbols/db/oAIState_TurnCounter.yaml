  refs:
  - bn6f/asm/asm31.s:125373
  reproduce: grep -n 'oAIState_TurnCounter' bn6f/asm/asm31.s | head
  result: '"ldrb r0, [r1,r0]" (difficulty table) / "ldrb r1, [r6,#oAIState_TurnCounter]" / "cmp r1, r0"'
- method: assembly-reading
