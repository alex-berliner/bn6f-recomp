  - bn6f/asm/asm31.s:125373
  reproduce: grep -n 'oAIState_TurnCounter' bn6f/asm/asm31.s | head
  result: '"cmp r0, #5 / bge loc_80F64D6"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Counter can be incremented by 2 in one step (rng-dependent burst), matching a wait counter with
    stochastic extra delay.
  refs:
  - bn6f/asm/asm31.s:125373
  reproduce: grep -n 'oAIState_TurnCounter' bn6f/asm/asm31.s | head
  result: '"bl GetPositiveSignedRNG / lsr r0, r0, #6 / bcc ... / ldrb r0, [r6,#oAIState_TurnCounter] / add
    r0, #1"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Halfword store here is misaligned/rare, but in context the AI setup routine seeds the field
    to a non-zero value (here 1) as the initial wait count before the first attack.
  refs:
