name: copyBgTilesToBlock0
address: '0x0812D78C'
kind: function
status: probable
summary: Blits a fixed 8x17 tile patch from the RAM buffer unk_20227A0 into background tile block 0 at
  position (j=0x15, i=2).
interface: () -> void; no flags (r0-r5 set internally, calls CopyBackgroundTiles)
details: 'The routine is a parameterless wrapper: it hardcodes CopyBackgroundTiles(j=0x15, i=2, which_tile_block_32x32=0,
  tile_ids=&unk_20227A0, j_size=8, i_size=0x11). unk_20227A0 is a buffer of tile IDs (passed as *const
  u16) that was filled elsewhere, so the actual content depends on whoever wrote that buffer before the
  three callers run this. It only copies tile indices into the BG tile map block, never palettes or VRAM
  graphics directly.'
