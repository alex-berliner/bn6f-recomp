name: IsCutsceneScriptNonNull
address: '0x08036F36'
kind: function
status: confirmed
summary: Tests whether a cutscene script pointer is currently set and returns the pointer with NZ flags so callers
  can branch on "a cutscene script is active".
interface: bool IsCutsceneScriptNonNull(u32 toolkit /*r10*/); // returns r0 = script pointer, flags NZ from tst;
  clobbers only r0
details: 'Reads the toolkit (r10) field oToolkit_CutsceneStatePtr to get the cutscene state object, then loads oCutsceneState_CutsceneScriptPos
  (the script pointer, s_02011C50.ptr_1C offset 0x1C) from it. TST r0,r0 sets NZ from that pointer and MOV pc,lr
  returns, leaving r0 = the script pointer itself. Callers thus get both the raw pointer (in r0) and the "non-zero?"
  condition via flags, enabling conditional tail-branch patterns like "if a script is loaded, jump into it". No
  other registers or flags are touched; no stack is used.

  '
