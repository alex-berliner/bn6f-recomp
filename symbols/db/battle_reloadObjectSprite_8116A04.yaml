name: battle_reloadObjectSprite_8116A04
address: '0x08116A04'
kind: function
status: confirmed
summary: Checks a battle object's sprite frame parameters and, when they flag a needed animation (re)load, restarts
  animation 0, hides the shadow, runs follow-up setup, and sets the object's state byte to 8.
interface: void battle_reloadObjectSprite_8116A04(r4=?, r5=battleObject, r6=?, r7=?) — reads r4-r7 as live context
  (only r5 is used), clobbers r0-r3, preserves r4-r7; leaves flags from TST r0,#0xC0 (skip path) or MOV r0,#8 (reload
  path).
details: 'Calls sprite_getFrameParameters and tests the result against 0xC0; if neither high bit is set, nothing
  happens and the function returns immediately (r1 left holding 0xC0). Otherwise it performs a full animation restart
  on the current sprite work area set up by earlier calls in the caller chain (r4-r7 carry that context into sprite_setAnimation
  etc., which take no arguments in registers here): sprite_setAnimation(0), sprite_loadAnimationData, sprite_noShadow,
  then sub_8116A44 for additional setup. Finally it stores 8 into the battle object''s byte at offset +9 (a state/phase
  byte), which also leaves 8 in r0. Note the store happens after sub_8116A44, so that callee cannot influence the
  written value. The 8 is likely a "spawned/active" or post-init state marker for this object type.'
