summary: 'Reset step of the battle-overlay scene record array (eStructArr2008450): re-runs the record-array init
  (battle_initEStructArr_804657C) after sub_80466AA, so scene ticks returning from a battle overlay start from clean
  records.'
interface: void sub_8046664(r2, r3, r4, r5, r6, r7, lr) -> returns c, v, r1, r2, r3, r4, r5, r6, r7, lr
details: 'Pushes r4-r7 and lr, tail-calls nothing but sequentially bl''s sub_80466AA and then sub_804657C, then
  pops r4-r7 and pc. It performs no work of its own: no registers are read or modified here beyond what the callees
  do, and r4-r7 are preserved both here and (per the caller analysis) inside both callees. The pairing suggests
  the two callees are the two halves of one update routine — e.g. a state/handler pass followed by a draw or advance
  pass — for whatever object or subsystem both belong to. The caller contract notes only c and v as flag outputs,
  both inherited from the callees'' last flag-setting operations; r1 being listed as an output despite not being
  touched here implies one of the callees sets it meaningfully for callers. Update 2026-10-14: the second callee
  is battle_initEStructArr_804657C (re-init of the 15x0x58 record array eStructArr2008450 that battle_updateEStructSprites_80465F8
  walks every frame), and every caller is a scene tick that also runs battle_updateEStructSprites_80465F8 - so this
  wrapper re-initialises the record array before the next frame''s sprite pass (e.g. the PET-menu return path in
  pet_menuUpdateAndHandleExit-style ticks).'
