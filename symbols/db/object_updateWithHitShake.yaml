    with r0=1, r1=0x1e; ldr r1, off_80D7570; ldr r1,[r1,r0] indexed by oBattleObject_CurAction -> 2-handler
    action dispatch; cmp oCollisionData_Region / CurAction==4 / CurState==8 guards before object_setCollisionRegion(1)
    and object_highlightPanel(PanelX,PanelY); tail calls object_updateSprite then object_presentCollisionData
