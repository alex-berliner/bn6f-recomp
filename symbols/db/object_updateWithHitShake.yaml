name: object_updateWithHitShake
address: '0x080D74DC'
kind: function
status: probable
summary: 'Per-frame battle-object update: handles a hit reaction with camera shake, runs the object''s
  current action via a 2-entry state table, then refreshes collision region, panel highlight, sprite and
  collision data.'
interface: (r5 = battle object ptr) -> r0 = varies from last callee; updates object fields, no meaningful
  return
details: 'The routine first tears down the object''s collision data and spawns the collision-hit effect.
  If collision flags (oCollisionData_FlagsFromCollision) are set, it saves PanelXY into ExtraVars, clears
  the collision region, and on the first frame of the reaction (ExtraVars+4 == 0) sets TimerAndTimer2
  from YVelocity-related data, triggers a camera shake (magnitude 1, 0x1e frames) and sets the reaction
  flag. It then dispatches CurAction through the table off_80D7570 (two handlers: sub_80D7578, sub_80D75A4).
  Afterwards, if the object''s collision region is 0 and it is not in CurAction 4 / CurState 8, it re-registers
  region 1 when the panel changed since the hit, and highlights the panel the object stands on. Finally
  it calls object_updateSprite and object_presentCollisionData. A trailing block (spawn_t1_0x0_EffectObject
  + clearCollisionRegion + storing 8 into [r5,#8]) looks like a destruction/defeat path, though its entry
  point is not visible in this listing.'
