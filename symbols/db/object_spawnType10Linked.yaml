name: object_spawnType10Linked
address: '0x080B999A'
kind: function
status: probable
summary: Spawns a battle object of type 0xA at a panel with a given element, linked to an existing object
  whose team/flip it inherits, and attaches caller-provided collision data.
interface: (r0 = x/panelX, r1 = y/panelY, r2 = element; side-channel r5 = source BattleObject, r6 = damage/stamina-damage-counter-disabler
  word, r7 = collision data ptr) -> r0 = new BattleObject or 0; flags from callee tested for spawn failure
details: 'Calls object_spawnType1 with object index 0xA and the three register arguments, then returns
  early with the spawn result still in r0/r5 if it failed (beq). On success it fills the new BattleObject:
  PanelX and PanelY from the original r0/r1, Element from r2 (all via a push {r0-r2,r5}/pop {r1-r3,r5}
  register-shuffle that re-maps the saved args), RelatedObject1Ptr from the caller''s r5, and copies AllianceAndDirectionFlip
  (halfword) from that same source object at [r5+oBattleObject_AllianceAndDirectionFlip], so the new object
  shares the source''s team/direction. It then stores the caller''s r6 into DamageAndStaminaDamageCounterDisabler
  and the caller''s r7 into CollisionDataPtr, writing 1 to the first byte of that collision data (likely
  enabling/arm it). The r5/r6/r7 side-channel convention strongly suggests this helper was split out of
  a larger inlined spawning routine rather than called normally.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0xa; bl object_spawnType1 — spawns battle object type 10, return pointer annotated in
    r5 and moved to r0; push {r0-r2,r5} ... pop {r1-r3,r5} — saves original args and re-loads them shifted
    so PanelX/PanelY/Element can be stored from r1/r2/r3; ldrh r1,[r5,#oBattleObject_AllianceAndDirectionFlip];
    strh r1,[r0,...] — inherits team/direction-flip from the related object in r5; str r5,[r0,#oBattleObject_RelatedObject1Ptr];
    str r6,[...DamageAndStaminaDamageCounterDisabler]; str r7,[...CollisionDataPtr] — links object and
    installs caller-supplied r6/r7; mov r1,#1; strb r1,[r7] — first byte of collision data set to 1, presumably
    activating it
  refs:
  - bn6f/asm/asm31.s:3242
  - 0x08003320 object_spawnType1
  reproduce: python3 tools/asmcat.py 0x080B999A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- Which enemy/chip spawns a type 0xA object — no callers are known, so the real-world identity of this
  object and why r5-r7 carry the extra arguments is unconfirmed
- Exact meaning of the fields written (is r2 truly Element, and what does collisionData byte 0 = 1 mean)
  depends on the object type 10 initialiser run inside object_spawnType1
