name: ai_stepRepeatElementPanelAttack
address: '0x080F1D30'
kind: function
status: probable
summary: AI attack step that repeatedly attacks a random panel with element 4 (with camera shake) for
  a counted number of repeats, then sets the hit element to finish the move.
interface: (r7 = object AI struct, fields oAIAttackVars_*) -> r0 = 0; updates AttackElement, StepTimer,
  AttackBoost2, HitElement
details: If AttackElement is still 0, it sets it to 4, picks a random panel for that element via ai_attackRandomPanel,
  triggers a camera shake (magnitude 1, duration 20), and sets StepTimer to 20 frames. On later calls
  it counts the StepTimer down; when it hits zero it decrements AttackBoost2, which acts as a repeat counter
  — if repeats remain, AttackElement is cleared to 0 so the next call starts another random-panel attack.
  Once AttackBoost2 is exhausted, it writes 0xC into HitElement, presumably signalling the next AI state.
  The struct pointer arrives in r7, so the caller must have it loaded there.
