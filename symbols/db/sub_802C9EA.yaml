name: sub_802C9EA
address: '0x0802C9EA'
kind: function
status: confirmed
summary: When battle effect bit 3 (0x8) is active, copies the halfword at offset +8 between the two side effect
  buffers (unk_2035260/unk_203526C), regenerating a 0xFFFF "empty" value from the destination's byte at +1.
interface: 'void sub_802C9EA(void); /* in: r4/r5/r10 (r10 = toolkit ptr, preserved), lr; out: r0-r7 clobbered, c/v/nz
  flags clobbered, r4/r5 preserved */'
details: 'Calls GetBattleEffects (R10 is the toolkit pointer) and only acts when bit 3 (mask 0x8) of the returned
  effect bitmask is set. Picks a source/destination pair of 12-byte-apart side buffers: by default unk_203526C ->
  unk_2035260, but if the byte oBattleState_Unk_10 of the current battle state (*toolkit+oToolkit_BattleStatePtr)
  is nonzero the direction is swapped (unk_2035260 -> unk_203526C) — Unk_10 most likely encodes which side/perspective
  owns the effect. It copies the full word at src+8 to dst+8, then re-reads the source halfword at +8: if it equals
  0xFFFF (empty/expired marker), it computes a replacement by calling sub_80AABA4 with the destination''s byte at
  +1 and stores that halfword into dst+8. The byte at +1 of each buffer thus acts as a seed/parameter for regenerating
  the +8 value when the source slot is empty. Registered contract notes: returns with c/v set per the final flag
  state, r1-r7 scratch, r0 clobbered.

  '
