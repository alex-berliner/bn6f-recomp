name: ai_lungeAttackUpdate
address: '0x08110B70'
kind: function
status: probable
summary: 'AI attack-state step for a lunging enemy: on first tick it records its panel and launch velocity,
  then charges forward until it hits something or the timer runs out, then snaps back to its starting
  panel.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; updates oAIAttackVars_AttackElement, StepTimer,
  HitElement and the object's panel/coordinates
details: On entry with oAIAttackVars_AttackElement==0 it stashes the object's PanelX/PanelY (fields 0x78/0x79)
  into 0x7A/0x7B, calls sub_8110CC6 to set up the charge, copies Unk_32 into StepTimer and sets AttackElement=1.
  Each tick it decrements the halfword timer at object+0x7E; while the timer is still >=0 and sub_8110D58
  (hit/collision test) returns 0, it advances oBattleObject_Y by YVelocity and resyncs panels via object_setPanelsFromCoordinates/object_updateCollisionPanels.
  On timer expiry it restores the saved PanelY, recomputes pixel coordinates, and writes HitElement=0x24.
  On a hit it clears object flag bit 1, restores the saved start panel from 0x78/0x79, calls sub_81110C8
  and sub_811109C, releases the reserved panel (object_removePanelReserve), sets collision region 1, and
  writes HitElement=0x28. In both end paths AttackElement is reset to 0 so the state can be re-entered.
