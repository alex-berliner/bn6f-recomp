name: battle_dadCybeastTutStep_8009552
address: '0x08009552'
kind: function
status: confirmed
summary: Advances the dad's Cybeast battle tutorial, running its textbox script on entry and picking the next tutorial
  index once the dialogue is closed.
interface: void sub_8009552(r5=battleState, r10=toolkit); clobbers r0,r1,lr and nzcv; returns r2..r6 (mostly pass-through;
  r2 carries the chosen index, r5 may be the value chatbox_runScript left)
details: "Called each frame while this battle sub-phase is active, with r5 = battle state struct\nand r10 = toolkit\
  \ (r10 is only read for oToolkit_BattleStatePtr).\nTwo-step state machine keyed on battleState+oBattleState_SubPhaseInitFlag:\n\
  1. Init flag == 0 (first pass): reads the current battle phase from\n   toolkit->battleState->oBattleState_BattlePhase;\
  \ if phase <= 1 it runs script 0x10,\n   otherwise script 0x20, both from the TextScriptDadCybeastTut archive\
  \ via\n   chatbox_runScript. Then writes 4 to oBattleState_SubPhaseInitFlag and returns\n   (subsequent frames\
  \ take the wait path). Note the init-flag store uses whatever r5\n   the script runner leaves, which the verified\
  \ C keeps faithful.\n2. Init flag != 0: sets flag 0x80 via chatbox_mask_eFlags2009F38 (tests/clears the\n   textbox-active\
  \ bit); while it is still set, the function just returns and waits.\n   Once the flag is clear, it calls GetBattleEffects\
  \ and stores 0x10 into\n   battleState+oBattleState_Index_01 if battle effect bit 1 (0x2) is set, else 0x14;\n\
  \   finally it zeroes the halfword at oBattleState_StatePhaseAndInitFlag to leave this\n   sub-phase and move\
  \ the battle state machine on.\nTouches: oBattleState_SubPhaseInitFlag, oBattleState_BattlePhase,\noBattleState_Index_01,\
  \ oBattleState_StatePhaseAndInitFlag, oToolkit_BattleStatePtr,\nthe TextScriptDadCybeastTut text archive, the\
  \ 0x80 textbox flag in eFlags2009F38,\nand the battle-effects word.\nQuirk: on the early-return paths r2-r6 are\
  \ passed back exactly as entered\n(except r5 on the script path); the caller evidently relies on r2/r5-style\n\
  pass-through of this dispatcher's register state.\n"
