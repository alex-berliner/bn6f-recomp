name: camera_LoadPositionFromSource_8030126
address: '0x08030126'
kind: function
status: confirmed
summary: Copies a camera position (X/Y/Z) from the data block pointed to by the camera object's field oCamera_Unk_14
  into the camera's own X/Y/Z fields.
interface: void sub_8030126(camera in r5); returns r7 = source block pointer, r2 = copied Z value
details: 'Takes the camera object pointer in r5. Reads the pointer at oCamera_Unk_14

  (an external data block holding a position triple) into r7, then copies the

  three 32-bit words from that block into the camera object fields

  oCamera_X (offset 0), oCamera_Y (offset 4) and oCamera_Z (offset 8).

  This looks like a camera "follow/attach" step: the camera position is

  re-synced each frame from a source block selected elsewhere (possibly a

  followed entity''s position or an interpolation endpoint).

  Quirks: r2 is left holding the Z value and r7 the source block pointer;

  the register contract shows callers read both, so callers chain further

  work off this routine. No flags are meaningful; r5 and lr are the only

  true inputs and nothing is preserved beyond what the caller needs.

  '
