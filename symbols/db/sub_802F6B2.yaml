name: sub_802F6B2
address: '0x0802F6B2'
kind: function
status: confirmed
summary: Per-frame title-screen tick that counts down, plays the title jingle at a fixed value, and on START input
  fades into the main menu.
interface: "void sub_802F6B2(u16 timer /* @r5+4 */,\n                 void *menu /* @r2 */,\n                 u32\
  \ screenCtx /* @r10 */,\n                 void *lr /* return addr */)\n  -> /* out */ r8 r9 r10 r11 r12;\n// clobbers\
  \ nzcv r0 r1 r2 r3 r7 lr; preserves r4 r5 r6 r8 r9 r12\n"
details: "Self is the *StartScreen object (in r5). Reads u16 timer at offset 4.\nThree branches keyed off that timer:\n\
  \  1. timer == 0 → writes 0x10 to the state/jump-table byte at offset 1\n     (handing off to startScreen_RunStateHandler_802F63C\
  \ which will\n     dispatch state 0x10), and calls SetScreenFade(0xC, 0x10) so the\n     already-black background\
  \ can fade back in.\n  2. timer decremented to 0x12C → pushes/pops {r0,r5} around\n     sound_dispatchCueHandler_800068A(0x1F,\
  \ 0x10) to fire the\n     title-screen jingle SFX (cue 0x1F, priority 0x10).\n  3. timer below 0xA0A *and* startScreen_IsTitleAnimationFinished_803E928\n\
  \     returns 0 (Z set) → calls sub_802FD54 (advances the start-screen\n     state via the 0x01 jump-table byte),\
  \ then\n     menu_onStartPressBeginTransition_802F7E8 to set up the START-press\n     fade-out, then sub_802F88E\
  \ as a cleanup/teardown step.\nUntil then, only the decrement and the threshold check run. The >= test\nis signed\
  \ but operands are non-negative, so the comment matches the\nactually-compared values.\n"
