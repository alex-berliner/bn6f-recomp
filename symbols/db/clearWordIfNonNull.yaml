name: clearWordIfNonNull
address: '0x080FCF9C'
kind: function
status: probable
summary: Null-safe helper that writes 0 through a pointer (clears a flag/word) if the pointer is non-null.
interface: (r0 = pointer to word, or NULL) -> if r0 != 0, *r0 = 0; r0 unchanged, no meaningful return
details: 'Tests r0 against itself (tst r0, r0); if the pointer is null it returns immediately, otherwise
  it stores 0 (mov r1, #0; str r1, [r0]) to the addressed 32-bit word. This is a classic defensive ''clear
  if set'' utility used to zero a flag, counter, or request field without risking a NULL write. Nothing
  else is touched and no callee is invoked. The exact meaning of the cleared word depends on the callers,
  none of which are documented here.'
