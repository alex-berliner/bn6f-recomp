name: battle_aiBusterAttackTick_80EBE54
address: '0x080EBE54'
kind: function
status: confirmed
summary: One tick of an enemy AI's buster attack — plays the charge-up animation once, fires a buster
  shot (with muzzle flash) on the panel in front, then returns the AI attack state to idle.
interface: battle_aiBusterAttackTick_80EBE54(void) -> u32  /* r7 = oAIAttackVars struct of the attacking
  object, r4/r5 = caller context (r5+0x4C is passed as a pointer to the temp-object spawner); r0 = fire-timer
  ticks, or 8 on the reset path; flags from "cmp r0,
details: "State machine tick driven through the oAIAttackVars struct reached via r7:\n  +0x00 u16 attack\
  \ state (oAIAttackVars_Unk_00) — set to 8 (idle) when done\n  +0x01 u8  charge phase (oAIAttackVars_Unk_01)\
  \ — 0 means not yet started\n  +0x08 u16 damage (oAIAttackVars_Damage) — passed to the spawned shot\n\
  \  +0x0C u8  element/type (oAIAttackVars_Unk_0c) — first arg to the front-panel spawn\n  +0x10 u16 fire\
  \ timer (oAIAttackVars_Unk_10)\n  +0x12 u16 handle of the spawned shot (oAIAttackVars_Unk_12)\nOn the\
  \ first tick (phase byte 0): plays animation 0xE via object_setAnimation, calls\nsub_80EB562 (per-object\
  \ charge handler), stores 4 into the phase byte, sets object\nflag bit 22 (1 << OBJECT_FLAGS_UNK_BIT_22_BIT)\
  \ via object_setFlag1, and clears the\nfire timer. When the fire timer equals 1: plays SOUND_BUSTER_6A,\
  \ spawns the buster\nshot on the panel in front via battle_SpawnObjectOnFrontPanel_800FAAC (args: element\n\
  from +0x0C, damage from +0x08, r3 = 0x180000; r2 is deliberately left as the caller\nleft it), stores\
  \ the returned handle at +0x12, and spawns a muzzle-flash temp object\nvia spawn_t1_0x5_tempAttackObject_80B8E30\
  \ (template 0, value 5 in r4, r7 = r5+0x4C;\nr4/r7 are saved/restored around the call). Each tick increments\
  \ the timer; once it\nexceeds 4 the attack state (+0x00) is reset to 8. The returned r0/flags always\
  \ come\nfrom comparing the tick count against 4, so callers can test the result with a single\nCMP.\
  \ Preserves r4-r10; note the heavy reliance on r7 as the struct pointer, which is\nunusual and suggests\
  \ the caller set it up as a dedicated base register.\n"
