    run wf investigate investigate-20261019-015108; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- exact role of the 0x200414c vs 0x2004190 buffers (script interpreter state vs script text/data) needs
  confirmation from the callers of those buffers
- whether byte_201BA40 is default script state or eReader/card-related payload; inspecting sub_813658C's
  context would clarify when this reset runs
