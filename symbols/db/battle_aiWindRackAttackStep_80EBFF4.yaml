name: battle_aiWindRackAttackStep_80EBFF4
address: '0x080EBFF4'
kind: function
status: confirmed
summary: 'Per-frame AI step for a wind-rack style attack: plays animation 10, runs a 10-frame timer, then detaches
  the related object and exits the attack state.'
interface: void sub_80EBFF4(battleObject *obj /*r5*/, aiAttackVars *vars /*r7*/); clobbers r0-r3,r6,r7,lr and NZCV
  per the final SUBS/object_exitAttackState
details: "AI attack-state handler called with r5 = battle object and r7 = the AI attack\nvars block. On the first\
  \ invocation (state byte at r7+1 == 0) it:\n- reads the object's AIData pointer (oBattleObject_AIDataPtr) and\
  \ the block\n  at oAIData_Unk_68, incrementing the u8 counter at that block +0x10;\n- starts animation 10 via\
  \ object_setAnimation;\n- stores the frame timer 10 into oAIAttackVars_Unk_10 (u16);\n- marks the attack as started\
  \ by writing 4 to the state byte r7+1.\nEvery subsequent call decrements oAIAttackVars_Unk_10; while it stays\
  \ >= 0\nthe attack simply continues next frame (the decrement's flags are the\nfunction's return flags). Once\
  \ the timer expires (goes negative), it:\n- clears oBattleObject_RelatedObject1Ptr to NULL on the battle object;\n\
  - resets the oAIData_Unk_68 pointer inside the AIData to NULL;\n- calls object_exitAttackState to leave the attack\
  \ state (this call's\n  flags/registers are what callers see in that case).\nQuirk: the timer is preloaded to\
  \ 10 and checked after the first decrement,\nso the attack runs the init frame plus 10 active frames total.\n"
