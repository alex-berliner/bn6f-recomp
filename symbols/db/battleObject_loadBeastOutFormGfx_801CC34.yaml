open_questions:
- The semantic of BattleObject+0x15 being repurposed here as a form-id cache rather than FuturePanelY
  is inferred from context; confirming it is unused for panel tracking on this object would settle it
  (e.g. via the caller's setup).
- The exact composition of the two source tables byte_872D014 (0x80 bytes) and byte_872D094 (r0*0x100
  bytes) is unknown; whether the first is the OBJ tile data and the second is the palette (or vice versa)
  would resolve the "why two transfers of different sizes to the same VRAM dest".
- The meaning of r4 on entry (an AIData ptr? a battle-id?) is not directly attested.
