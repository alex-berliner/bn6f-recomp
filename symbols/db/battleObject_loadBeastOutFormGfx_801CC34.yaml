name: battleObject_loadBeastOutFormGfx_801CC34
address: '0x0801CC34'
kind: function
status: confirmed
summary: Loads tile, sprite-palette, and emotion-palette DMA transfers for a Cybeast/Beast Out form sprite, refreshing
  the object's animation flag.
interface: u32 battleObject_loadBeastOutFormGfx_801CC34(u32 object_id /*r0*/, u32 r4, u32 object_ptr /*r5*/, u32
  r6) -> u32 /* returns object_id unchanged; updates r5, r6 via emotion resolve */
details: 'object_id indexes a u8 per-object palette-table at byte_801CDDC (1-based).

  If object_id differs from the current-form byte at object_ptr+0x15, the function

  queues two DMA transfers: 0x100 bytes of tile data from

  (0x0872D094 + palette_idx*0x100) into VRAM tile region 0x06017680, and 0x80 bytes

  of sprite palette from (0x0872D014) into the adjacent VRAM block 0x06017780.

  It then sets the anim-refresh flag at object_ptr+0x10 to 0xFF.

  battleObject_resolveEmotionPalette_801E6A8 is called (updates r5/r6 in place) and

  returns an emotion_state in r0. If the emotion-pending byte at (new_r5+0x17) equals

  0xFF and emotion_state==3, a sub-palette selector of 1 is chosen; otherwise 0.

  That selector is written back to object_ptr+0x10 (overwriting the earlier 0xFF).

  Finally 0x20 bytes of emotion palette are queued from

  (0x0872D694 + palette_idx*0x40 + selector*0x20) to OAM palette memory byte_30016D0.

  r10 is in the register contract but never touched in the body.

  The original push {r0,…} / pop {r0,…} pair preserves object_id across the call,

  so the return value is always the input unchanged.

  '
