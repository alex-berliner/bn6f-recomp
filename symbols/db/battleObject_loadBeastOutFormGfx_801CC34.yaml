open_questions:
- r10 is listed as an input in the register contract but is not referenced in the body—confirm whether callers rely
  on it being preserved or it is an artifact of the lifter.
- The anim-refresh flag at offset 0x10 is set to 0xFF then immediately overwritten by the emotion selector (0 or
  1); verify whether any code between the two writes could read 0xFF, or whether the 0xFF write is dead when the
  form-change branch is taken.
- What is the exact semantics of emotion-pending byte at offset 0x17==0xFF combined with emotion_state==3 selecting
  sub-palette 1 (e.g., is this the 'angry' Cybeast variant palette)?
