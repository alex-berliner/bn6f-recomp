name: clearMysteryDataEventFlags_809FB04
address: '0x0809FB04'
kind: function
status: confirmed
summary: Walks the mystery-data map entries and clears each non-GREEN entry's event flag.
interface: void clearMysteryDataEventFlags_809FB04(u32 group /* r4 */); // r5/r6/r7/lr in; preserves r4-r7;
  clobbers r0-r3, lr, flags
details: "Iterates a MysteryDataMapGroupEntry array (r4). Each entry has { MapGroup, MapNumberPtr }.\n\
  A MapGroup of 1 terminates the walk; a MapGroup of 0 is skipped; otherwise the entry's\nMapNumberPtr\
  \ is followed into a null-terminated array of MysteryDataEntry pointers, each\nentry being { u8 Kind;\
  \ u8 pad; u16 EventFlag; u32 PlacementsPtr; u32 ContentsPtr; }.\nFor every MysteryDataEntry whose Kind\
  \ != 0 and != GREEN_MYSTERY_DATA, the function:\n  1. Calls sub_809FB4C(kind, PlacementsPtr, ContentsPtr,\
  \ EventFlag) -> returns kindResult (r0)\n     and placementResult (r1).\n  2. Calls sub_809FACE(EventFlag,\
  \ kindResult, placementResult).\n  3. Calls ClearEventFlag(EventFlag).\nGREEN_MYSTERY_DATA entries are\
  \ skipped (event flag left set). After the per-entry loop,\nr6 is advanced by 4 (pointer size) and the\
  \ per-map-number loop re-reads; r6 == 0 then\nadvances r4 by oMysteryDataMapGroupEntry_Size to the next\
  \ group.\nr4-r7 are preserved across the call so the caller can resume with its pointers intact.\n"
