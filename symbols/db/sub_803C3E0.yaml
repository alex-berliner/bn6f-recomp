interface: 'bool testByte_2006772(void) // in: lr only; out: r0 = byte value, Z set if zero, N set if bit7 set'
details: Loads the pointer word_2006770 (IWRAM at 0x2006770), reads the byte at offset 2 (absolute 0x2006772), and
  returns it, setting NZ flags from the value via tst. This is a plain global-flag/state test with no side effects
  and no register clobbers beyond r0. The purpose of the 0x2006770 work area is unknown from this snippet, so the
  byte's game meaning cannot be determined here; callers presumably branch on the returned flags or use the value.
