    \ object slot's byte 0xb (a \"phase initialized\" boolean in BattleObject).\n- Init arm writes 0xFF sentinel\
    \ to `[r6+4]` (Param1 / CurAnim byte in BattleObject) then\n  reanimates via sprite_setAnimation(0), sprite_loadAnimationData,\
    \ sprite_noShadow - the\n  canonical \"load + nuke shadow\" sequence the other object-init callers use.\n- `movflag\
    \ EVENT_BF2` + `bl TestEventFlagFromImmediate` shows the runtime branch is gated on a\n  story flag; bne picks\
    \ sub_811E000 else the default sub_811DFD4, then both tails hit the\n  shared `bl sprite_update`.\n- Single\
    \ caller battleObject_initNaviRosterEntry_811DF40 with the comment \"Initialise a\n  battle object's sprite\
    \ + position for one of the pre-battle Navi roster tiles\" lines up\n  with this exact shape."
