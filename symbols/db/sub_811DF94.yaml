status: hypothesis
summary: per-frame update for a Navi roster icon used in pre-battle lineup, branching on story flag
interface: (r5 = BattleObject*, r6 = object-slot/state, r10 = Toolkit*) -> void ; updates sprite/animation and runs
  sprite_update; branches via EVENT_BF2
details: 'Reads the object slot''s "phase initialized" byte at [r6+0xb]. If zero (slot not initialized yet),

  it primes the icon: writes 0xFF to [r6+4] (likely an anim id sentinel / reset flag), sets the

  current animation to 0 via sprite_setAnimation, then sprite_loadAnimationData and

  sprite_noShadow. This is the "first-time init" path that gives the icon its no-shadow look.

  Falls through to a shared update helper sub_811DFD4, then sprite_update.

  If [r6+0xb] is non-zero, the icon is already initialized. It tests EVENT_BF2 (a story/quest

  flag) via TestEventFlagFromImmediate; depending on that, calls sub_811DFD4 (default path) or

  sub_811E000 (alternate path), and finally sprite_update unconditionally.

  r0..r3/r4/r5/r10/lr are clobbered; the only side effect beyond the object slot in r6 is the

  via sprite_update tick of the object''s sprite struct (r5).

  This is invoked once per roster entry from battleObject_initNaviRosterEntry_811DF40''s frame

  update loop.

  '
