name: object_updateTimedCollisionToggle
address: '0x080DDCF4'
kind: function
status: probable
summary: Per-frame update for a battle object that runs the standard hit/collision pipeline, dispatches
  on CurAction between two states, and in one state disables its collision region with an 8-frame timer.
interface: (r5 = battle object) -> void
details: 'Standard battle-object frame update: tears down the object''s collision data, spawns the hit
  effect for its last collision (jittered), dispatches through a 2-entry jump table indexed by oBattleObject_CurAction,
  advances the sprite animation, then re-presents collision data. State handler sub_80DDD30 calls object_clearCollisionRegion,
  stores 8 into the object''s field at +8 (likely a frame timer), and clears bit 1 of the flags byte at
  +0, effectively switching the object into a non-colliding phase. The other handler (sub_80DDDB8) is
  not shown, so the exact two-state behavior and object identity are uncertain.'
