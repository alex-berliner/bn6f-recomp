    frame the dispatch (sub_80DDCF4 prologue/epilogue); ldr r1,[r1,r0] with r0 = ldrb [r5,#oBattleObject_CurAction]
    and off_80DDD28 holding two thumb pointers shows a 2-state action dispatch; handler after pop{pc}:
