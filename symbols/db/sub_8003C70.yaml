name: sub_8003C70
address: '0x08003C70'
kind: function
status: hypothesis
summary: Trivial wrapper that invokes sub_80028C0 with r0 = 0, apparently resetting or clearing whatever state that
  routine manages.
interface: void sub_8003C70(void)
details: 'Pushes lr, sets r0 to 0, tail-calls sub_80028C0 (via bl, then pop {pc}), and returns whatever sub_80028C0
  returns in r0. No other registers are touched, no flags are read before the call, and no game structures are accessed
  here directly — everything meaningful happens inside sub_80028C0, which itself clobbers r0-r2, lr and the nz flags.
  Because the only argument is a constant zero, this reads like a "reset/clear/disable" entry point for the subsystem
  sub_80028C0 tracks (a counter, buffer, or mode flag), but without the callee''s identity this is only a guess
  about which subsystem it is.

  '
