name: battle_tickCollisionTimer_8010162
address: '0x08010162'
kind: function
status: confirmed
summary: Counts down a battle object's collision-data timer once per tick, plays sound 0x94 when it hits zero, and
  toggles the object's flag bit 4 each call.
interface: void sub_8010162(void); // reads battle-object pointer from r5->oBattleObject_CollisionDataPtr; uses
  r4 as the collision-data pointer for the flag helpers; clobbers r0-r2 and flags, preserves r3-r7 and r10
details: "Per-call \"tick\" routine for a battle object. Loads the collision data pointer from\n[r5 + oBattleObject_CollisionDataPtr]\
  \ and reads the halfword counter at\noCollisionData_Unk_26. If the counter is the sentinel 0xFFFF the countdown\
  \ is disabled\n(timer parked). Otherwise:\n  - if the counter is already 0, the routine skips straight to clearing\
  \ flag bit 4\n    (object_clearFlag(4)) and returns;\n  - otherwise it decrements and stores the counter, and\
  \ when the decrement lands on 0\n    plays sound effect 0x94 via PlaySoundEffect (an expiry/warning sound).\n\
  After the timer handling it calls object_getFlag() and tests bit 0x400000 on the object:\nif set, flag bit 4 is\
  \ cleared; if clear, flag bit 4 is set. So bit 4 flips state every\ncall whenever 0x400000 is set — a classic\
  \ per-tick blink/flicker toggle (likely the\nobject's invisible/flicker flag), with 0x400000 acting as the \"\
  blink enabled\" gate.\nNote the flag helpers operate on the collision-data pointer left in r4 by this routine,\n\
  and object_setFlag1/object_clearFlag take the bit number (4) in r0.\n"
