name: battleObject_runCustSwallow
address: '0x080B939E'
kind: function
status: probable
summary: 'Advances the Custom Gauge''s chip-swallow phase: starts the swallow anim/timer, then transitions
  the action once the timer expires.'
interface: (r5 = oBattleObject*) -> void; writes CurPhase, CurAnim, Timer, CurAction, CurPhaseAndPhaseInitialized
details: Operates on a battle object in r5. If CurPhase is zero, it sets CurPhase to 4, CurAnim to 0x12,
  and Timer to 0xD, then returns. On subsequent calls (CurPhase != 0) it decrements Timer each frame;
  when Timer reaches zero it writes 0xC to CurAction and clears CurPhaseAndPhaseInitialized, handing control
  back to the battle object's main action dispatcher. This is a small state machine tick that drives a
  short fixed-length animation before advancing to the next action.
