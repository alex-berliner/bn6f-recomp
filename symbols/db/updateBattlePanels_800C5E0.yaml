name: updateBattlePanels_800C5E0
address: '0x0800C5E0'
kind: function
status: confirmed
summary: 'per-frame update: steps the panel animations, then redraws every panel slot'
interface: 'static void update_panels(void); adapter: in r10=toolkit, out v, r1-r7 (r4-r7 preserved); flags left
  as the final cmp r6, #0x28'
details: Calls stepPanelTileAnimations_800C192, then walks the 0x28 slots of ePanelData (stride 0x20). A slot whose
  column/row fails object_isValidPanel is skipped. An inactive slot (+0 == 0) is blanked (drawPanel with family
  0xFF) and sub_800C138 draws what shows in its place at row+1, skipping the strip. Otherwise a one-shot redraw
  (+0xD, art/side from +8/+9), a one-shot overlay (+1, overlay value-1), or the steady-state art (+6/+7) is drawn,
  then the strip below (+0xC set) via drawPanelUnderStrip_800C100 with side from +7. The one-shot flags are cleared
  before drawing.
