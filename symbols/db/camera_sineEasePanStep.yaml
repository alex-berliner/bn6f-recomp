name: camera_sineEasePanStep
address: '0x080A7A40'
kind: function
status: confirmed
summary: Per-tick sinusoidal ease-out interpolation of the battle camera X/Y from a start position toward a target
  position, using a timer-driven sine lookup.
interface: void camera_sineEasePanStep(u32 r5 /*entity*/, u32 r6 /*panConfig*/, u32 r10); -> NZ flag (0 = still
  easing or blocked, nonzero = finished), r5/r6 preserved.
details: "Guard: calls battle_isInputAllowedOrBattleBusy_80A7C58; if Z is not set (input blocked / motion inactive)\
  \ the function returns immediately with r0=0.\nPan config struct (pointed to by r6, possibly refreshed by the\
  \ busy-check):\n  +0x06 (u16): remaining tick counter\n  +0x0C/+0x10: written to entity – current camera X/Y\n\
  \  +0x14 (s32): start X\n  +0x18 (s32): start Y\n  +0x1C (s32): end/target X\n  +0x20 (s32): end/target Y\n  +0x24\
  \ (u32): expired-threshold for the timer\nEach tick the timer at +0x06 is decremented by the threshold at +0x24\
  \ and stored back. If the result is <=0 the pan is complete: the entity's X/Y (offsets +0x0C/+0x10) are snapped\
  \ to the config's end values (+0x1C/+0x20), a completion byte is written via addToByteAtR6_80A7BA2(1, r6), and\
  \ r0=1 (Z clear) signals \"done\".\nOtherwise a sine-table index is computed as (64 − timer/256)*2, the 16-bit\
  \ signed value from math_sinTable is the ease factor, and the interpolated position is:\n  X = ((endX − startX)\
  \ >> 8) * ease + startX\n  Y = ((endY − startY) >> 8) * ease + startY\nThese are stored to entity offsets +0x0C\
  \ and +0x10. r0=0 (Z set) signals \"still in progress\".\nClobbers r0,r1,r3,lr; preserves r4,r5,r6,r7 via stack\
  \ push/pop.\n"
