name: camera_sineEasePanStep
address: '0x080A7A40'
kind: function
status: probable
summary: Sine-eased lerp of a camera/scroll position from start to end coordinates across a countdown, snapping
  to end and returning 1 when done (via sub_80A7BA2), blocked by battle_isInputAllowedOrBattleBusy; used in beast-sp
  cutscene panning.
interface: (r0 = unused, r6 = move descriptor {u16 counter@6, u32 step@0x24, start x/y@0x14/0x18, end x/y@0x1c/0x20},
  r5 = destination state {x@0xc, y@0x10}) -> r0 = 1 when the move finished, 0 while blocked/in progress; no flags
  meaningful
details: 'First calls battle_isInputAllowedOrBattleBusy; if it returns nonzero the function exits with r0=0 without
  touching state. Otherwise it subtracts the step at r6+0x24 from the u16 counter at r6+6; if the counter is exhausted
  (<= step), it copies the end coordinates r6+0x1c/0x20 straight into r5+0xc/0x10, calls sub_80A7BA2(1), and returns
  1. While still running it computes a sine-table factor: index = (0x40 - (counter>>8))<<1 into math_sinTable, giving
  an eased 0..1 weight. It then lerps start (r6+0x14/0x18) toward end (r6+0x1c/0x20) as (end-start)>>8 * sinVal
  added to start, storing the intermediate x/y into r5+0xc/0x10 and returning 0. The descending counter with sine
  lookup gives an ease-out style motion; the descriptors appear to be static/inline data rather than a heap object.'
