    run wf investigate investigate-20261019-003606'
open_questions:
- Caller identity unknown — which object/state machine owns the r5 struct and whether the [r5+1]=0x34
  state has a known name
- Why the archive table is indexed by step*4 while script index 0xA is fixed — other step handlers may
  use different slots/scripts
- Exact meaning of state 0x34 and the [r5+2] counter field in the owning struct
