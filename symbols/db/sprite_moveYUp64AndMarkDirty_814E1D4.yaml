name: sprite_moveYUp64AndMarkDirty_814E1D4
address: '0x0814E1D4'
kind: function
status: confirmed
summary: Shifts an object's Y coordinate up by 0x40 units via a helper call, then sets the object's low state-flag
  bits so the change takes effect.
interface: void sprite_moveYUp64AndMarkDirty(unknown r0, Object* r1 /* object ptr, preserved into callee */, unknown
  r4-r11); clobbers r2-r3, r12, flags (NZ from ORR, C/V from the subtract); returns to caller via saved LR in r12
details: Tail-wraps around a call to sub_814E0D0 (which clobbers LR, so the return address is parked in r12 and
  restored with `bx r12`). That callee is invoked with r1 = object pointer and produces a value in r3, apparently
  the object's Y coordinate or a related position value. This function subtracts 0x40 from it (moving the object
  up 64 units, plausibly one tile's worth) and stores the result into the object at offset +0x14 (byte store). It
  then reads the object's byte at +0x00, ORs in 0x3 (low two bits set — likely "position changed"/"dirty" or a small
  state field), and writes it back, so whatever consumes this object picks up the new position. r0 and r4-r11 are
  passed through untouched per the caller contract; the caller-visible flag changes come from the intermediate SUBS/ORR
  and are probably incidental.
