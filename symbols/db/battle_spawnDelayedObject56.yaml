name: battle_spawnDelayedObject56
address: '0x08010F86'
kind: function
status: probable
summary: Spawns a battle object of type 0x56 linked to a battle object, passing a combined 32-bit parameter
  (delay << 16 | 0xB) and storing the new object in the owner's RelatedObject2Ptr field.
interface: (r0 = owner battle object, r2 = 16-bit count/delay in low half) -> r0 = spawned object; also
  stores it at [r5 + oBattleObject_RelatedObject2Ptr]
details: The routine takes a 16-bit value from the low half of r2, shifts it into the high half, and ORs
  in 0xB (r4 = 0xB + (r2 << 16)), forming a 32-bit parameter that looks like a frame counter/delay of
  r2*0x10000 + 11 frames. It calls the known spawner battle_spawnObject56LinkedToOwner_80C44A8 with r0
  (the owner object) and that parameter, which spawns battle object type 0x56, inherits alliance/direction
  from the owner, and sets header flag bits 0x04|0x10. The returned object pointer is stored into r5's
  field oBattleObject_RelatedObject2Ptr, linking it back to the caller's context. Given its recorded use
  from the 'battlesweep' and 'chips' routes, it most likely implements a chip effect that spawns a timed
  support/auxiliary object attached to the user. The meaning of the 0xB low half (timer value or object
  sub-parameter) is inferred, not proven.
