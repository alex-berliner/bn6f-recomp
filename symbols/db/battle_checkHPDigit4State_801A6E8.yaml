name: battle_checkHPDigit4State_801A6E8
address: '0x0801A6E8'
kind: function
status: confirmed
summary: Checks whether a battle object's HP, converted to BCD, contains a digit 4, and manages a per-object state
  byte (+0xA4) that gates whatever effect depends on that.
interface: 'u32 checkHPDigit4(void *stateObj /* r4: object with u8 state at +0xA4 */, void *hpObj /* r5: object
  whose u16 HP at oBattleObject_HP is read */); returns r0 = 1 if the state is already flagged (0xF4) or the HP
  readout has a 4 digit, else 0. Clobbers r1-r3 and flags; r4/r5/r7 preserved.'
details: 'Reads the state byte at +0xA4 of the object in r4. Three cases: (1) 0xF7 = ''pending check'' - loads the
  u16 HP of the object in r5, runs it through memory_bcdConvert, then scans every BCD nibble in a loop; if any nibble
  equals 4, the function returns 1 and leaves the state byte untouched, otherwise it writes 0 back to +0xA4 and
  returns 0. (2) 0xF4 = already flagged - returns 1 immediately without touching anything. (3) Any other value -
  returns 0 without changes. The 0xF4/0xF7 sentinel values suggest the caller sets +0xA4 to 0xF7 to arm the check,
  and on a hit (digit 4 found, or previously flagged) does some follow-up action before/while the byte becomes 0xF4;
  the caller owns that transition since this function never writes 0xF4. In game terms this looks like a superstitious
  ''unlucky 4'' (death number) check on the HP readout, e.g. a bug/curse-style battle effect that triggers when
  a 4 appears in the displayed HP, but which battle object (player, enemy, a summoned entity) plays which role is
  not established from this function alone. r7 is taken from callers but never read here.

  '
