open_questions:
- Which battle objects r4 and r5 refer to (they are not required to be the same object) and who sets the state byte
  to 0xF7/0xF4.
- What the caller does when this returns 1 - the actual effect of the digit-4 hit happens outside this function.
- Why the pending check returns 1 but keeps the state byte intact instead of clearing or advancing it to 0xF4 itself.
- Whether +0xA4 is a general-purpose scratch/state slot reused by several battle effects rather than a dedicated
  field.
