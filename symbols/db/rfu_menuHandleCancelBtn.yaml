    SetScreenFade(0xC,0x10) called in both exit paths — screen fade-out on leaving; eStruct200BC30_getJumpOffset00
    result gates rfu_REQ_stopMode+rfu_waitREQComplete — teardown only when wireless mode was running;
    state 0x11 + zero offset falls through to sub_8132614, the known menu-choice dispatcher
