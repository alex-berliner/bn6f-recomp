name: rfu_menuHandleCancelBtn
address: '0x0812BF10'
kind: function
status: probable
summary: 'A/B button handler for an RFU/wireless menu state: on press, advances the menu state machine
  (to handler 0x14, or 0x18 in state 0x11 with an active wireless mode) and tears down the RFU link while
  fading the screen.'
interface: (r5 = menu state record) -> void; sets record fields and global screen fade
details: 'Runs once per frame for some wireless menu. If A or B is newly pressed, it reads the record''s
  current state at r5+0x10: for state 0x11 it writes next-handler 0x18 into r5+2 (or, when the EWRAM record
  at 0x200BC30 says no wireless mode is active, defers to sub_8132614''s menu-choice dispatch); for other
  states it writes handler 0x14. In both exit paths it zeroes r5+3 (a frame/timer counter), calls SetScreenFade(0xC,
  0x10) to fade out, and — if the 0x200BC30 record''s first byte is nonzero — issues rfu_REQ_stopMode
  and rfu_waitREQComplete to end the wireless mode before returning. If no button is pressed it simply
  returns, so the handler is polled each frame.'
evidence:
