name: checkOWObjectInteractions_80037f4
address: '0x080037F4'
kind: function
status: confirmed
summary: Resolves pairwise interactions among overworld object interaction areas registered for the current frame,
  snapping the player to a "touched" object's coords and clearing the interaction-area list for next frame.
interface: void resolveOWObjectInteractions_80037f4(void);  /* clobbers r0-r3, NZCV; preserves r5; r4 and r6 returned
  to caller */
details: "Iterates the ordered pair set (i, j), i != j, over eOWObjectInteractionAreas (count in eNumOWObjectInteractionAreas),\n\
  elements of size oOWObjectInteractionArea_Size with fields Unk_08, Unk_0c, Unk_10, X, Y, Z. For each pair:\n \
  \ 1. Quick-rejects if (outer.Unk_0c & inner.Unk_08) is zero.\n  2. Calls checkOWObjectInteractionAreasOverlap_8003894(outer,\
  \ inner); skips the pair on false.\n  3. ORs (outer.Unk_0c & inner.Unk_08) into the u32 pointed to by outer.Unk_10\
  \ (event-flag accumulator).\n  4. If outer.Unk_08 has bit OW_OBJECT_INTERACTION_AREA_FLAG_0x200000, copies inner.X/Y/Z\
  \ (word16 each)\n     into eOWPlayerObject at offsets oOWPlayerObject_Unk_72, _74, _76 (player snap-to-touch).\n\
  \  5. ORs (outer.Unk_08 & inner.Unk_0c) into the u32 pointed to by inner.Unk_10 (symmetric flag write).\nOn exit\
  \ writes 0 to eNumOWObjectInteractionAreas so the area list is empty for the next frame.\nReturned r4 carries\
  \ the last inner-area base (a pointer into eOWObjectInteractionAreas) and r6 the\nouter loop index; r5 is preserved\
  \ across the call. The pair overlap is recomputed only when\nthe cheap mask test passes, so it is really a tagged-area\
  \ interaction pass rather than a broad sweep.\n"
