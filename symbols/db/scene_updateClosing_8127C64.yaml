name: scene_updateClosing_8127C64
address: '0x08127C64'
kind: function
status: confirmed
summary: Per-frame update of the closing/ending cutscene; once the screen fade starts, stores the scene's
  exit value into the game state and returns to the map.
interface: void scene_updateClosing_8127C64(void); /* work = r5 (scene object), toolkit = r10; clobbers
  r0-r4, lr, flags; preserves r5-r9, r12 */
details: 'Runs four scene-step subroutines (sub_81281E0, sub_8127F54, sub_8127FE4, sub_8128280), then
  the global entity update handlers (entity_runAllUpdateHandlers_80465BC) and sub_80465F8. If no screen
  fade is active (IsScreenFadeActive returns Z clear), the function returns and the scene simply runs
  again next frame. Once a fade is underway it finalizes the scene: calls sub_8046664, obtains an exit
  value from sub_8127EF4 (returned in r0), loads the game state pointer from toolkit + oToolkit_GameStatePtr,
  and stores the exit value according to bit 0 of the scene object''s byte at +0xD: bit set -> 32-bit
  store to game state +0x78, bit clear -> byte store to game state + oGameState_Unk_13. It then re-reads
  the +0xD mode byte and branches on bit 0 again: set -> calls ClearPETMenuDataFlag with r0=1, r1=1, r2=1,
  r3=mode byte, followed by next_exitToMap_811F728; clear -> calls pet_menuExitToMap_811F708 with r0=mode
  byte (re-read), r1=1, r2=1, r3=mode byte (first read). Quirk: the mode byte is read twice instead of
  being reused, and the exit routines inherit whatever registers the previous callee left behind. The
  function is a leaf-style wrapper whose only real inputs are r5 and r10, so its C form reads them from
  the caller''s register state.

  '
