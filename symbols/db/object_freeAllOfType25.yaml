details: 'The function is a one-shot wrapper: it loads the constant 0x25 into r0 and calls FreeAllObjectsOfSpecifiedTypes,
  then returns. It therefore destroys/dequeues all spawned objects whose type/species field equals 0x25,
  leaving all other object types untouched. It takes no arguments of its own and preserves nothing. What
  kind of entity type 0x25 is (which battle object, effect, or placeholder) is not determinable from this
  thunk alone; the caller sub_8138514 is also unnamed, so no context narrows it down.'
