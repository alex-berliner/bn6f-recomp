name: dispatchGameHandlerByIndex_80AA6A4
address: '0x080AA6A4'
kind: function
status: confirmed
summary: Jump-table dispatcher that tail-calls one of 12 game-handler routines selected by an index passed in R0.
interface: void sub_80AA6A4(u32 r0 /* handler index */); -> r0 = handler's return; r2..r12 forwarded from handler
  (r1 clobbered, lr clobbered, flags clobbered)
details: "Implements a 12-way switch on R0: R0 is shifted left 2, used to index JumpTable80AA6B8 (via the\noff_80AA6B4\
  \ pointer), the Thumb target (+1 bit) is loaded, then the function tail-calls it via\n`mov lr, pc; bx r0` followed\
  \ by `pop {pc}` (so the caller's saved LR is used as the new PC).\nR7/R10 (and the original LR saved by the prologue)\
  \ are inputs forwarded untouched to the\nhandler; r1, r3 and the condition flags are clobbered by the address\
  \ computation and indirect\ncall. The 12 handler targets are:\n  0  -> alwaysTrue_80AA6E8\n  1  -> sub_80AA6EC\n\
  \  2  -> sub_80AA756\n  3  -> isEventFlag212Set_80AA764\n  4  -> sub_80AA778\n  5  -> sub_80AA78C\n  6  -> sub_80AA7AC\n\
  \  7  -> sub_80AA7C0\n  8  -> sub_80AA7D4\n  9  -> sub_80AA7E8\n  10 -> sub_80AA7FC\n  11 -> sub_80AA810\nEntry\
  \ 3 (`isEventFlag212Set_80AA764`) hints these are boolean predicate/condition handlers\n(e.g. \"is event flag\
  \ 212 set\"), but the majority are still unnamed and must be classified before\nthe dispatcher itself can be tied\
  \ to a specific subsystem (battle/chapter/event/...).\n"
