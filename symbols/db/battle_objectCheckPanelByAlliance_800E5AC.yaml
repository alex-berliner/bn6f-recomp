name: battle_objectCheckPanelByAlliance_800E5AC
address: '0x0800E5AC'
kind: function
status: confirmed
summary: Gates an object's use of a panel — validates the panel, then picks per-alliance panel parameters (selected
  by a panel flag bit) and runs the parameter check on them.
interface: int battle_objectCheckPanelByAlliance(u32 panelParamA, u32 panelParamB, struct BattleObject* obj /* in
  r5 */); returns 0 (Z set) for an invalid panel; otherwise returns object_checkPanelParameters's r1-r3 results
  and NZCV flags unchanged
details: 'Takes two panel-identifying parameters in r0/r1 and a battle object in r5

  (only oBattleObject_Alliance is read). Calls object_isValidPanel on the

  parameters; if it reports an invalid panel, the function returns 0 in r0

  with Z set (C/V untouched) and r1-r3 left as they were on entry.


  For a valid panel, object_getFlag is called to fetch the panel''s flag

  word. Bit 4 (0x10) of that flag selects one of two halves of the table at

  byte_800E660, and the object''s alliance (byte, shifted left by 3) selects

  the 8-byte row within it — i.e. 16 entries of two words total, arranged as

  two halves of 8 alliance-indexed rows. The two words at

  byte_800E660 + (flag & 0x10) + (alliance << 3) are loaded into r2/r3, the

  original panel parameters are restored into r0/r1, and

  object_checkPanelParameters is tail-called; its return values (r1-r3) and

  flags are passed straight back to the caller.


  Effectively this is the shared "can this object (of this alliance)

  interact with / stand on this panel" test, where the acceptable panel

  parameter thresholds differ per alliance and per a panel property

  (flag bit 4, e.g. some panel state/category). r4-r7 are preserved.

  '
