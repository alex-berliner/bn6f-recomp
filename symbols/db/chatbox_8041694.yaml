name: chatbox_8041694
address: '0x08041694'
kind: function
status: confirmed
summary: Handles a 7-byte "show textbox" script command, picking a text id by an event-flag test or skipping if
  0xFF
interface: void chatbox_runTextboxCmd_8041694(u8* cmdStream, ?, ?, ?, /*out*/ r0=1 always)
details: 'Interpreter for one chatbox script opcode that conditionally shows a textbox.

  The 7-byte command layout (offsets from r4): +2/+3 = little-endian event flag id,

  +4 = flag count, +5 = textbox id when the flag test is true, +6 = textbox id

  when the flag test is false. Calls TestEventFlagRange(flagId, flagCount) and

  inspects the zero flag: Z set (test failed / condition false) uses +6, Z clear

  (condition true) uses +5. If the chosen id is 0xFF the command is a no-op and

  r4 is advanced past the 7 bytes. Otherwise chatbox_config_80408D0 is called

  with R1 = scriptID and R0 = TestEventFlagRange''s return (ignored by callee).

  Always returns 1 in r0 to signal successful step.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
