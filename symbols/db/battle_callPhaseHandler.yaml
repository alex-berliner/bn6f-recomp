name: battle_callPhaseHandler
address: '0x080C3DDC'
kind: function
status: probable
summary: Calls the per-phase handler of the battle object in r5, selected by its CurPhase from a 4-entry
  jump table
interface: (r5 = battle object) -> r0 = handler return value; no flags used
details: 'Reads byte oBattleObject_CurPhase from the battle object pointer in r5, loads a handler address
  from off_80C3DF0[phase], and tail-calls it in ARM/Thumb interworking style via mov lr,pc + bx. The table
  has 4 entries: phase 0 = battle_phaseWaitAnim8ThenNext (wait for anim frame 8, then advance phase),
  phases 1 and 2 = small local handlers (sub_80C3E2E, sub_80C3E46), phase 3 = battle_decrementTimerAndDestroyOnExpire
  (timer countdown, destroy object when it expires). No argument setup beyond the object pointer, so handlers
  presumably also receive the object in r5. This is the standard per-frame phase dispatcher for a battle
  object.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0]; bx r1 — dispatch on CurPhase via jump
    table; table off_80C3DF0 holds exactly 4 thumb handler addresses; phase 0 entry = battle_phaseWaitAnim8ThenNext,
    phase 3 = battle_decrementTimerAndDestroyOnExpire, both known battle-phase helpers; mov lr,pc; bx
    r1 pattern = call handler with link, handlers run in thumb
