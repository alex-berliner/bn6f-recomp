name: ai_tickChargedAttack
address: '0x08107388'
kind: function
status: probable
summary: 'Enemy-AI attack state machine tick: on first call it arms an attack (element 4, timer = AttackDuration),
  counts the timer down each frame, and on expiry stamps HitElement = 0x24 to trigger the hit.'
interface: (r7 = AI entity whose oAIAttackVars is the target) -> r0 = 0/scratch only; no meaningful return,
  updates oAIAttackVars_AttackElement, _StepTimer, _HitElement
details: 'All state lives in the oAIAttackVars struct at r7. Phase 1: if AttackElement is 0, it writes
  element 4 into AttackElement and copies AttackDuration (halfword) into StepTimer, so the attack stays
  armed for its configured duration. Phase 2 (element already set): it decrements StepTimer each call
  and returns while it is still >0. When the timer reaches 0, it writes 0x24 into the halfword HitElement,
  presumably the value some other AI/battle routine polls to apply or spawn the attack''s hit. The two-phase
  ''arm then count down then emit hit code'' pattern is typical of a delayed/charging enemy attack, but
  which attack (element 4 and hit code 0x24) is not provable from this stub alone.'
