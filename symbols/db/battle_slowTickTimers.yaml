name: battle_slowTickTimers
address: '0x0800EA90'
kind: function
status: confirmed
summary: Halves every per-hit collision timer on a battle object each slow tick, banking the lost odd ticks into
  the master slow timer, and reports whether anything actually ticked down.
interface: void battle_slowTickTimers(BattleObject* self /* r5 */) -> u16 unchanged (r0), CollisionData* coll (r2);
  clobbers r1, r3 and flags; preserves r4
details: 'Reads the object''s collision data pointer (battle object + oBattleObject_CollisionDataPtr), snapshots
  the master slow timer at collision+0x80, then walks the four 16-bit per-hit collision timers at collision+0x82,
  0x84, 0x86, 0x8A (loop offsets 0x82..0x8A step 2, stopping at 0x8C). Each timer is replaced by (value+1)>>1, i.e.
  halved rounding up, so a timer of 1 stays 1 and only reaches 0 on the next tick. The sum of all halves is subtracted
  from the master slow timer at collision+0x80 and stored back, so the master counter tracks the total timer mass
  including the lost halves. Returns 1 (r0=1) when the master slow timer is unchanged from before the tick — meaning
  all per-hit timers were already 0 and nothing was lost — otherwise 0. r2 is left holding the collision data pointer
  for the caller. r4 is pushed/popped (holds the pre-tick master total during the loop) and is preserved for the
  caller despite the register contract listing it as an output.

  '
