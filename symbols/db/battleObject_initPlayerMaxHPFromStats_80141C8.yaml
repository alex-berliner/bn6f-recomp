open_questions:
- What exactly the second hword (r1=0x40 path) corresponds to in NaviStats — likely CurHP vs MaxHP, but the exact
  mapping (and what the masked-out "0x4" battle-effect bit represents, e.g. FullCust or similar) cannot be confirmed
  from this function alone. Settling it would require tracing the indices 0x40 and 0x42 inside GetBattleNaviStatsHword_AllianceFromBattleObject.
