name: battle_runUpdatesAndCheckFade_81250E0
address: '0x081250E0'
kind: function
status: confirmed
summary: 'Battle scene update: runs five battle sub-updates and, if a screen fade is active, marks the
  scene state byte at [r5+1] as 8.'
interface: void battle_runUpdatesAndF ade_81250E0(void) /* uses r5 as a pointer to a battle-scene state
  struct; returns r0 = 8 with N=0,Z=0 if a screen fade was active, otherwise r0 and flags from IsScreenFadeActive
  */
details: 'Pushes {lr} and tail-calls five battle subsystems in sequence:

  sub_812674C, sub_81267A8, sub_8125444, sub_8125D10, sub_81264F4.

  Then calls IsScreenFadeActive(); if it returns "fade in progress" (BEQ not taken

  in the disassembly, i.e. Z clear), the function writes the immediate 8 to the byte

  at [r5+1] and returns r0 = 8 with N=0,Z=0. Otherwise it falls through to locret_8125100

  and returns whatever r0/condition codes IsScreenFadeActive produced (Z set when

  no fade is active). C and V flags are not modified here, so callers observe

  IsScreenFadeActive''s C/V. r5 is a battle scene state pointer carried by every

  caller; the byte at offset +1 is some kind of "next/last sub-state" or

  "fade-related phase" marker that is forced to 8 (= "fading") while a fade plays.

  '
