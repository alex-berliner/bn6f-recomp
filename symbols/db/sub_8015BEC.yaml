name: sub_8015BEC
address: '0x08015BEC'
kind: function
status: confirmed
summary: Writes a one-byte value to offset 0x0E of the given side's player NaviStats, but only when the player object
  exists and is in a state accepted by two state-check helpers.
interface: void battle_setPlayerNaviStatsField0E(u32 alliance, u8 value) // r0 = alliance flag, r1 = byte to store;
  flags on return are those left by the last executed call
details: 'Saves the alliance flag (r0) in r6 and the byte value (r1) in r4, then calls battle_findPlayer(alliance)
  to get that side''s player BattleObject. If there is no player object it exits immediately. Otherwise it runs
  two gating checks on the object (kept in r5): sub_801445C and sub_8014490; if either returns nonzero the update
  is aborted. Only when both checks pass does it call GetBattleNaviStatsAddr(alliance) and store the byte with strb
  r4, [r0,#0xE] into the NaviStats record. The meaning of the 0x0E byte is unknown from this call site alone; the
  double gating suggests the write is only allowed while the player is in some normal/in-battle state (e.g. not
  in a special condition handled by the two check helpers). Note this function has no explicit return value: on
  every exit path r0/r1 (and clobbered r2) are whatever the last executed helper call left behind, and NZCV come
  from that call''s last flag setting (the "no player" exit''s flags come from cmp r0,#0). r4-r6 are preserved.

  '
