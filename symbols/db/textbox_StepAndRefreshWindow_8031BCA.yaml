name: textbox_StepAndRefreshWindow_8031BCA
address: '0x08031BCA'
kind: function
status: confirmed
summary: Advances the text engine by one step, then blits the affected window region and refreshes the text box
  display.
interface: void textbox_StepAndRefreshWindow(void) — takes context in r0/r5 for the text-engine step; returns final
  callee register/flag state (r0,r2-r7,nzcv) unchanged to caller
details: 'Thin wrapper of three calls. First calls sub_803172E, the text-engine stepper, passing through r0 (and
  r5) from the caller; this advances the current text script state (e.g. revealing more characters / handling the
  next control code). Then it sets up a blit for sub_80315B8 with r2=0 (source x/column), r3=0x10 (width 16 px,
  a full text-box row), r4=8 (source y/row), r5=8 (height 8 px, one character line), i.e. exactly one 16x8 text
  row of the text-box window. Finally calls sub_8031B7C to redraw/refresh the text box using those blit parameters.
  No state of its own is kept; all inputs except r0/r5 are set locally and all outputs come from the last callee.

  '
