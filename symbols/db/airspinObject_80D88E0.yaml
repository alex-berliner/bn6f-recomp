name: airspinObject_80D88E0
address: '0x080D88E0'
kind: function
status: confirmed
summary: 'Per-frame tick for the AirSpin battle object: dispatches to the state handler (init / update / destroy)
  via a jump table, then refreshes the sprite unless time is stopped.'
interface: battle_airspinObjectTick(r4, r5, r6, r7, r8, r10) -> r5, r8, r9, r10, r11, r12; clobbers r0-r4, r6, r7,
  lr, all flags
details: Reads the object's current state byte at r5+oBattleObject_CurState and indexes a three-entry jump table
  at 0x080D88FC (states 0=init via airspinObject_init_80D8908, 1=update via airspinObject_update_80D8988, 2=destroy
  via object_genericDestroy). The handler is invoked as a tail-jump (mov lr, pc; bx r1). After the handler returns,
  the function calls battle_isTimeStop; if the result is Z==1 (time not stopped) it calls object_updateSprite with
  the possibly-advanced r5 pointer. When time IS stopped the sprite is frozen. The function is the registered tick
  routine for the AirSpin (spin-blade) chip/projectile object.
