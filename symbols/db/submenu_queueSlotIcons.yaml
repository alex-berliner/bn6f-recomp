    0x20 words) copies palette-size data per slot; QueueEightWordAlignedGFXTransfer(eTextScript202BA04
    + highNibble*0x200, 0x6016E00 + slot*0x200, 512) uploads the slot''s tile graphics; sprite_queueOamEntryThunk(0x40110020+slot*0x20,
    0xB30+byte_8049C58[idx] | perSlot<<12, ...) queues an OAM entry with palette/tile bits; call to sub_8132A50
    with x=0xA6, y=0x13+slot*0x20, w=1, h=0x370+slot*0x10 sets per-slot layout, confirming on-screen icon
    placement'
