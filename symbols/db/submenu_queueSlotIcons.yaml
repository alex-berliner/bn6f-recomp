name: submenu_queueSlotIcons
address: '0x08049BC0'
kind: function
status: probable
summary: Loops four slots; per active slot, copies a 0x20-word palette block into an IWRAM buffer, DMA-copies
  a 0x200-byte icon tile set from eTextScript202BA04 into VRAM 0x6016E00+slot*0x200, queues an OAM sprite
  with the per-slot base 0x40110020+slot*0x20, and records layout data via sub_8132A50.
interface: () -> void; no return value, loops slots 0-3
details: For each of four slots, sub_803C316(1<<slot) gates whether the slot is active and sub_813D638
  caps the slot index; sub_803C440/sub_8146738 yield a value whose low nibble selects one of 12 icon tile
  blocks (byte_86C0B20.., 0x40 bytes each) copied with CopyWords (0x20 words) into one of four IWRAM palette
  buffers (byte_3001730/1650/16B0/16D0), while the high nibble selects a 0x200-byte tile set from eTextScript202BA04
  DMA'd to VRAM 0x6016E00 + slot*0x200. A per-slot byte from dword_8049C68 (0x0F,0x08,0x0B,0x0C) shifted
  left 12 is ORed with 0xB30 + byte_8049C58[palIndex] (palette/tile assignment) and passed with base pointer
  0x40110020 + slot*0x20 to sprite_queueOamEntry, queueing the sprite entry. Finally sub_8132A50(0xA6,
  0x13 + slot*0x20, 1, 0x370 + slot*0x10) records per-slot screen layout data (x=166, y rows spaced 32px).
evidence:
