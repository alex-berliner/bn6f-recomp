open_questions:
- what object/caller sub_80CBCB0 belongs to, and what phase 4 does in its state machine
- whether the 0x40 flag cleared here is a specific known ObjectFlags1 bit
- why FuturePanel is set to the current panel — later overwritten, or an intentional in-place move
- The proposal's name and mechanics match the code (0x3C into Timer, phase 4, clear 0x40, set MOVING flag,
  copy panel to future panel). However 'battle_beginMoveTimerPhase' is awkward and misleading — it's not
  beginning a 'move timer phase', it's simply placing the object into phase 4 with a 60-frame timer and
  marking it as currently moving while pointing its future panel at its current one. The flag operations
  are flag bitfields, not a scratch slot, so the interface description is off. A name like 'object_setMovingOnCurrentPanel'
  or 'object_enterPhase4Moving' fits better.
