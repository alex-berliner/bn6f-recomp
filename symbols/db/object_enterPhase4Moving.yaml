  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s name and mechanics match the code (0x3C into Timer, phase 4, clear 0x40, set MOVING
    flag, copy panel to future panel). However ''battle_beginMoveTimerPhase'' is awkward and misleading
    — it''s not beginning a ''move timer phase'', it''s simply placing the object into phase 4 with a
    60-frame timer and marking it as currently moving while pointing its future panel at its current one.
