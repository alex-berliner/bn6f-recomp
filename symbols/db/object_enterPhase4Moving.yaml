name: object_enterPhase4Moving
address: '0x080CBF8C'
kind: function
status: probable
summary: Sets the object's phase to 4 with a 60-frame Timer, clears ObjectFlags1 bit 0x40, sets the CURRENTLY_MOVING_1
  bit, and copies the current PanelX/PanelY into FuturePanelX/FuturePanelY.
interface: (r5 = battle object pointer; r0 = scratch flag bits) -> r0 = flag bits after setFlag1; no meaningful
  return
details: Stores 0x3C into oBattleObject_Timer and 4 into oBattleObject_CurPhaseAndPhaseInitialized, so
  the object enters phase 4 with a one-second countdown. It clears ObjectFlags1 bit 0x40 and sets the
  OBJECT_FLAGS_CURRENTLY_MOVING_1 bit via the CollisionData helpers. Finally it copies oBattleObject_PanelX/PanelY
  into oBattleObject_FuturePanelX/FuturePanelY, making the movement target the current tile. The object
  is passed in r5 rather than r0, so r0 only carries flag bitfields for the helpers. This looks like the
  setup step of a delayed move/teleport in an enemy or object AI state machine.
