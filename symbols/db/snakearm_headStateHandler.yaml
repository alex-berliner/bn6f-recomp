name: snakearm_headStateHandler
address: '0x080CD3B0'
kind: function
status: confirmed
summary: 'Per-frame tick for the Snake Arm head enemy: destroys it on hit/death/battle-end, otherwise steps it forward
  and re-presents its hitbox.'
interface: void Next snakearm_headStateHandler(void) // in r4 r5 r7 r8 r10 -> out r5 r8 r9 r10 r11 r12; clobbers
  nzcv r0-r3 r6 r7 lr
details: "Called each frame as the head's state handler (r5 = head BattleObject).\n\n1. Calls object_removeCollisionData\
  \ to detach the head's current hitbox.\n\n2. Evaluates three destroy conditions in order:\n   a) oBattleObject_ExtraVars\
  \ points to a CollisionData block whose\n      oCollisionData_FlagsFromCollision is nonzero (head was struck).\n\
  \   b) ExtraVars+4 points to a health struct whose first byte is 0\n      (head health depleted by another means).\n\
  \   c) battle_isBattleOver returns nonzero; in this case the health\n      byte at ExtraVars+4 is zeroed before\
  \ destruction.\n\n3. If destroying: calls object_clearCollisionRegion, clears bit 1\n   of oObjectHeader_Flags\
  \ (active flag), and writes\n   CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,\n\
  \   then returns.\n\n4. If alive: dispatches the head's movement through a single-entry\n   jump table at off_80CD410\
  \ indexed by oBattleObject_CurAction;\n   the only target is object_stepXAndDestroyIfBlocked (which may\n   itself\
  \ set CUR_STATE_DESTROY if the head is blocked). After the\n   dispatch, oBattleObject_Param1 is shifted left\
  \ by 25 bits into r1\n   and passed to object_presentCollisionData to re-attach the hitbox.\n\nQuirks: the jump\
  \ table currently holds exactly one entry (+1 for\nThumb bit), so the action dispatch is effectively a direct\
  \ call.\nobject_stepXAndDestroyIfBlocked can clobber r5/r8 (the C wrapper\nmodels this via head_dispatch_result).\n"
