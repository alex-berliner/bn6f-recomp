name: snakearm_headStateHandler
address: '0x080CD3B0'
kind: function
status: probable
summary: 'Per-frame state handler for the snake-arm head battle object: removes collision data, checks
  flags, and either transitions to destroyed or dispatches the current action and refreshes collision.'
interface: (r5 = battle object pointer) -> r0 = CUR_STATE_DESTROY stored to oBattleObject_CurStateActionPhaseAndPhaseInitialized;
  no return value
details: 'Removes the object''s collision data, then checks oBattleObject_ExtraVars and its CollisionDataPtr''s
  FlagsFromCollision; if both clean, also checks ExtraVars+4 (a byte flag). Calls battle_isBattleOver
  and, if over, zeroes the byte at ExtraVars+4. Otherwise it dispatches oBattleObject_CurAction through
  the jump table at off_80CD410 (single entry sub_80CD414) and refreshes collision via object_presentCollisionData.
  The destroy path clears the collision region, clears bit 2 of oObjectHeader_Flags (present/active),
  and stores CUR_STATE_DESTROY into the state word. Quirk: the state table has only one action entry,
  so the destroyed state runs one fixed action handler each frame.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tail-jumped from battleObject_initSnakeArmHead_80CD310, the snake-arm head init/state handler;
    bl object_removeCollisionData at entry tears down collision first; bl battle_isBattleOver then strb
    r0,[r1] zeroes the ExtraVars+4 byte when the battle ends; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    sets the destroyed state; ldr r1,[r1,r0] off off_80CD410 (only sub_80CD414) dispatches by oBattleObject_CurAction,
    then bl object_presentCollisionData
  refs:
  - bn6f/asm/asm31.s:45905
  - 0x080CD310 battleObject_initSnakeArmHead_80CD310
  - 0x0800A18E battle_isBattleOver
  - 0x0801A074 object_clearCollisionRegion
  - 0x0801A018 object_presentCollisionData
  reproduce: python3 tools/asmcat.py 0x080CD3B0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function is the per-frame state/update handler for the snake-arm head, not exclusively a ''destroyed
    state.'' The code has two distinct exit paths: loc_80CD3E2 clears collision region, clears bit 2 of
    oObjectHeader_Flags, and stores CUR_STATE_DESTROY, while loc_80CD3F4 dispatches through the jump table
    at off_80CD410 and calls object_presentCollisionData to refresh the object. The proposal''s interface
    line claiming CUR_STATE_DESTROY is always stored contradicts loc_80CD3F4, which never writes that
    word. The caller battleObject_initSnakeArmHead_80CD310 jumps here as its per-frame handler, not as
    a dedicated destroy-state routine. The logic in details is otherwise accurate (removeCollisionData,
    ExtraVars checks, battle_isBattleOver gating the zeroing of the byte flag).; run wf investigate investigate-20261018-155607;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
