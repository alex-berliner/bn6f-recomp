name: battle_startQuakeEffect
address: '0x080CBFAE'
kind: function
status: probable
summary: 'Battle earthquake routine: plays a rumble and shakes the camera; a second entry point (0x80CBFC4)
  additionally spawns effect object 0x22 on a shuffled selection of field panels.'
interface: (r0 = count limit for panel debris at alt entry; unused at 0x80CBFAE) -> r0 = ?; no meaningful
  flags
details: 'The primary entry calls sub_80E2FE8 with (0x81, 2, 0, 1) — likely playing a quake rumble sound
  or arming an effect — then calls camera_initShakeEffect(1, 0x1E), i.e. shake magnitude 1 for 30 frames,
  and returns. The code after the unconditional branch is reachable only from a second entry at ~0x80CBFC4:
  it takes r0 as a max count into r4, calls object_getPanelsExceptCurrentFiltered to get a filtered list
  of field panels (excluding the current one), ShuffleByteList_PrimaryRNG to randomize the byte list at
  sp, clamps the loop start to min(count, r4)-1, and for each panel decodes packed coordinates (high nibble
  = row, low 3 bits = column via lsr/lsl-lsr) with object_getCoordinatesForPanels and spawns effect object
  0x22 (r3=0) at that tile. This matches an earthquake/debris attack or scripted battle event: screen
  rumble plus falling effects on random panels.'
