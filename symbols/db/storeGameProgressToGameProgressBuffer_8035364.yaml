name: storeGameProgressToGameProgressBuffer_8035364
address: '0x08035364'
kind: function
status: confirmed
summary: Archives the current game-progress byte into gameProgressBuffer[slot] and clears the live progress value
  to 0xFF so it is not archived twice.
interface: void storeGameProgressToGameProgressBuffer_8035364(u32 slot); // r0 = slot (byte offset into gameProgressBuffer),
  r10 = toolkit pointer; clobbers r0 and flags
details: 'Adds r0 (a byte offset/index into gameProgressBuffer_20010f0) to the buffer base, reads the game state
  pointer from the toolkit (r10 + oToolkit_GameStatePtr), copies the live progress byte (oGameState_GameProgress)
  into the selected buffer entry, then writes 0xFF back into the live field — 0xFF acting as the "no pending progress"
  sentinel so the same progress value is not stored again. The push/pop of r4-r7 is a pure saved-register pass-through;
  those registers are never used inside the function and are returned unchanged. r0 and the flags are clobbered,
  but callers ignore both.

  '
