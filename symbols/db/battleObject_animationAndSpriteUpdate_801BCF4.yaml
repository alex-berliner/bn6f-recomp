    shows a battle-paused early-out; battle_isPaused contract confirms it reads the BattlePaused flag.
    - `ldrb r0,[r5,#oObjectHeader_Flags]; tst r0,#1; beq locret` shows OBJECT_FLAG_ACTIVE gate. - `tst
    r0,#8; bne locret` matches OBJECT_FLAG_STOP_SPRITE_UPDATE (bit 3) defined in ObjectHeader.inc. - `tst
    r0,#0x10; bne loc_801BD16` matches OBJECT_FLAG_PAUSE_UPDATE (bit 4): if set, skip the timestop check
    and proceed; otherwise `bl battle_isTimeStop; bne locret` enforces timestop freeze. - `ldr r0,[r5,#oBattleObject_CollisionDataPtr];
    tst r0,r0; beq loc_801BD22` reads oBattleObject_CollisionDataPtr (offset 0x54 in BattleObject.inc)
    and skips the PreventAnim check when no collision data exists. - `ldrb r0,[r5,#oBattleObject_PreventAnim];
    tst r0,r0; bne locret` gates animation updates on PreventAnim (0x18) being zero. - CurAnim/CurAnimCopy
    pair at offsets 0x10/0x11 matches the BattleObject.inc union; equality-check `cmp r0,r1; beq loc_801BD36`
    then `strb r0,[r5,#oBattleObject_CurAnimCopy]` re-syncs the shadow only after a real change. - The
    two sprite callees (sprite_setAnimation, sprite_loadAnimationData, sprite_update) all take r5 as the
    object pointer per their contracts. - Caller playerObject_main_80EA460 description says it runs "the
    shared post-state hook" after CurState dispatch, consistent with this function being that hook.'
