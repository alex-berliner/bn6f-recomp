summary: 'Battle-object per-frame animation dispatcher: applies pause/timestop/stop-sprite-update flags,
  syncs CurAnim into the sprite slot, loads frame data, and ticks sprite_update.'
interface: '(r5 = BattleObject*) -> void ; side effects: reads/writes object header flags and sprite slot;
  calls sprite_setAnimation / sprite_loadAnimationData / sprite_update.'
details: "Early-out when battle_isPaused returns non-zero (bne locret). Otherwise reads the object header\
  \ flags byte at oObjectHeader_Flags (r5+0):\n  - bit 0 OBJECT_FLAG_ACTIVE must be set (tst r0,#1; beq\
  \ locret).\n  - bit 3 OBJECT_FLAG_STOP_SPRITE_UPDATE set => early-out (no sprite work this frame).\n\
  \  - bit 4 OBJECT_FLAG_PAUSE_UPDATE unset, so call battle_isTimeStop; if time-stop is active, early-out\
  \ too. (If bit 4 is set, fall through past the timestop check.)\nThen if the object has no CollisionDataPtr\
  \ (oBattleObject_CollisionDataPtr at r5+0x54 == 0), or if PreventAnim (r5+0x18) is 0, allow anim sync.\
  \ Otherwise early-out.\nCompare CurAnim (r5+0x10) with CurAnimCopy (r5+0x11); if they differ:\n  - bl\
  \ sprite_setAnimation with the new anim index in r0 (its contract is in=['r0','r5'] so r0 already carries\
  \ CurAnim).\n  - bl sprite_loadAnimationData to pull frame data for the object's sprite block.\n  -\
  \ Write CurAnim into CurAnimCopy to mark them in sync.\nFinally bl sprite_update unconditionally (it\
  \ uses oBattleObject header + (header byte 2 & 0xF0) to pick the sprite struct).\npush {lr} / pop {pc}\
  \ style; only r5 is preserved across the call. Called from playerObject_main_80EA460 as the shared post-state\
  \ hook for the player's battle object.\n"
