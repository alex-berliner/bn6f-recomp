name: NPCCommand_set_animation_force_update
address: '0x0809F12C'
kind: function
status: confirmed
summary: Overworld NPC script opcode that sets the NPC's animation selection and forces an immediate animation update,
  then advances the script cursor.
interface: 'void NPCCommand_set_animation_force_update(void) /* r5 = NPC object, r6 = script cursor */; out: r6
  = next script cursor; clobbers r0, flags NZCV'
details: 'Reads the animation index from the script operand at [r6+1] (a single byte) and stores it

  into the overworld NPC object''s AnimationSelect field. It then writes the bitwise complement

  (~animation) into AnimationSelectUpdate, which presumably acts as an "invalidate" / force-refresh

  signal so the renderer commits the new animation rather than skipping an unchanged value.

  r6 (the script cursor) is advanced by 2 bytes past the opcode+operand, and that advanced

  pointer is returned to the caller as the next script position. The SET_FLAGS_NZ on r6 in

  the C listing reflects the mvn-then-strb/mov pc,lr Thumb sequence; effectively the function

  returns the new cursor in r6 with flags from the final operation.

  Quirks: inherits the script-parser calling convention used by all NPCCommand_* handlers

  (r5 = NPC, r6 = cursor, returns cursor in r6); only ever forces the update via

  the complement trick rather than a separate "force" flag bit.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
