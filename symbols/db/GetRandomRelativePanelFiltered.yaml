name: GetRandomRelativePanelFiltered
address: '0x08015E46'
kind: function
status: confirmed
summary: Picks a random reachable panel relative to a given panel, indexing PanelOffsetListsPointerTable by the
  caller's panel id.
interface: u32 getRandomRelativePanelFiltered_8015E46(u32 r0, u32 r1, u32 r2, u32 r3, u32 panel_index, u32 r6) ->
  r0,r1,r2,r3,r5 + nz/c/v flags preserved across the call
details: Thin front-end over `_GetRandomRelativePanelFiltered`. The caller's `panel_index` arrives in r4; it is
  used as a word index into `PanelOffsetListsPointerTable` (each entry is a pointer to a panel-offset list describing
  which adjacent panels are reachable from a given panel-type/template). The looked-up pointer is moved into r4
  and forwarded to `_GetRandomRelativePanelFiltered`, which presumably scans that list and returns a chosen offset.
  r4 and r7 are saved/restored so the caller's r4 survives; everything else (r0-r3, r5, flags nz/c/v) is the implementation's
  output and is passed straight through. Used during battle/field movement when the game needs to pick a neighboring
  panel from a rules list filtered by current panel.
