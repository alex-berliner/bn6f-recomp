open_questions:
- No caller is known, so which chip/attack/enemy owns this object (and what the spawned type-0xF object
  is in game terms) is unidentified
- The exact meaning of r1 = 1..3 in the spawn callee (row/column offset vs. index) and the role of byte_80E07D0's
  0x20 entries are unclear without battle_spawnTypeFObjectInitState_80C6548's internals
- What flag 0x10 on oObjectHeader_Flags means (e.g. just-spawned/no-collision) is not shown here
