- method: assembly-reading
  date: '2026-10-14'
  detail: '- Zero-fill of eStruct200F360 at 0x20 halfwords is at the first `bl ZeroFillByHalfword`. - eLinkState
    reset is the `bl eLinkState_ResetForNewUse_803DE88` with r0=0. - Camera setup uses the documented callee sub_803DCE8
    with args (0x10,2,4,4). - BRE5 magic-tag block init is `bl sub_813DBC0(0,0,dword_803F734[r4])`; r4 is the user''s
    selector shifted left by 2. - The `strh r1, [r0,#0xc]` writes 0x3C into eLinkState+0xC, which is Camera.unk_0C
    per Camera.inc. - `movflag EVENT_172F` + `bl SetEventFlagFromImmediate` matches the pattern of other event-flag
    sets. - 26 captured calls all enter with r0=00000000, r1=00000040, r2=00000020, r3=02001f6e (event-flag bits
    pointer), and always exit r0=00000001.'
