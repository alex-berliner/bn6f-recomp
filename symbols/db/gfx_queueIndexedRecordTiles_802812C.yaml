name: gfx_queueIndexedRecordTiles_802812C
address: '0x0802812C'
kind: function
status: confirmed
summary: Queues the tile graphics of an indexed 0x80-byte record for VRAM transfer, split into two 0x40-byte halves
  at 0x060170E0/0x06017160, plus a linked 0x20-byte chunk to IWRAM at byte_30016B0.
interface: void gfx_queueIndexedRecordTiles(u32 recordIndex /* r0 */); preserves r4-r7, clobbers flags and r0-r3/lr
details: 'Takes a record index in r0 (saved across the calls) and resolves it with getIndexed80hRecordPtr_8028164
  to a pointer to that record''s 0x80-byte graphics block. It then queues three DMA-style transfers via QueueEightWordAlignedGFXTransfer:
  the first 0x40-byte half of the block to VRAM 0x060170E0, the second 0x40-byte half (reusing the returned source
  pointer advanced by r2 = 0x40, which the queue function leaves intact) to VRAM 0x06017160, and finally a 0x20-byte
  chunk obtained by calling sub_8028172 with the record index again to IWRAM buffer byte_30016B0 (0x030016B0). The
  two 0x40 halves together form one contiguous 0x80-byte tile set loaded to adjacent VRAM slots; the 0x20-byte side
  chunk likely holds per-record palette or attribute data buffered in IWRAM.

  '
