name: sub_801CE28
address: '0x0801CE28'
kind: function
status: confirmed
summary: Advances the shared state-machine step counter and dispatches to the current mode's per-frame tick handler
  via a 4-entry jump table.
interface: void stateMachine_stepDispatch_801CE28(void /* lr = caller return */); /* reads/writes byte_2036840 state
  block; clobbers r0-r12, nzcv; preserves r5, r10 */
details: "State block base pointer stored in r5 from off_801CE54 (=byte_2036840).\nLayout of the state block:\n\
  \  +0x00  mode (byte; valid table byte-offsets 0, 4, 8, 12)\n  +0x07  step counter (byte; cycles 1-5)\n  +0x08\
  \  sub-phase (byte; used by mode 4 as a hold indicator)\n\nStep-advance logic: nextStep = counter+1. If nextStep==5\
  \ AND mode==4 AND\nsub-phase==2 or sub-phase==4, the counter write is skipped (machine stalls,\nholding text-printing\
  \ until input is released). Otherwise the counter is\nwritten back unconditionally.\n\nDispatch: jump table at\
  \ off_801CE5C is indexed by (mode byte) directly as a\nbyte-offset into the table (0, 4, 8, 12 → entries 0-3).\
  \ The handler is invoked\nas a subroutine: \"mov lr,pc; bx r1\" loads the epilogue address into lr and\nbranches,\
  \ so the handler's \"pop {r5,pc}\" returns to this function's epilogue.\nHandlers (thumb, so table adds +1):\n\
  \  offset 0  → screenFadeOutStepTick_801CE6C\n  offset 4  → chatbox_stepTextPrinter_801CE92\n  offset 8  → flags_clearWordSlicesTaskStep_801CED2\n\
  \  offset 12 → event_raiseFlag8000AndDispatch_801CEFA\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
