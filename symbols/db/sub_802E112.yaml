name: sub_802E112
address: '0x0802E112'
kind: function
status: hypothesis
summary: Sets battle flag 0x40 when the current battle is a network-style "gate" fight (gate-byte nonzero, or network
  battle with event flag 0x1722 set), skipping crossover, tomahawk/dustman minigames, virus battler, and while the
  0x200000 battle effect is active.
interface: void sub_802E112(void); /* uses r10/lr from caller, clobbers nzcv r0-r3 lr */
details: 'Reads the current battle mode via GetBattleMode and bails out for modes

  1 (crossover), 7 (tomahawk minigame), 9 (dustman minigame), and 6

  (virus battler). Reads GetBattleEffects() and skips while bit

  0x200000 (effect byte at offset 0x21) is set. Otherwise queries

  notZero_eByte200AD04 — a gate-related counter/byte at 0x200AD04 —

  and short-circuits when it is nonzero. If that byte is zero, falls

  back to requiring bit 0x08 of GetBattleEffects() (network battle)

  and the set state of event flag 0x1722

  (EVENT_1722_BEAST_LINK_GATE_RELATED) via TestEventFlagFromImmediate.

  On any qualifying path calls battle_setFlags with 0x40, marking the

  battle state with BATTLE_FLAG_0x40. Touches the IWRAM byte at

  0x200AD04 and the battle effects/mode globals; no other structures

  are dereferenced.

  '
