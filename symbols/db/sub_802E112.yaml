open_questions:
- What gameplay condition BATTLE_FLAG_0x40 represents (likely a "Beast Link gate allowed" marker, given the event
  flag naming).
- Meaning of GetBattleEffects() bit 0x200000 (which effect byte is it, and which battle state sets it).
- Exact semantics of notZero_eByte200AD04 (counter vs. trigger byte) and which subsystem maintains it.
