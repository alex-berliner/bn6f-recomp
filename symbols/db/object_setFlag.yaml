name: object_setFlag
address: '0x080C46C0'
kind: function
status: confirmed
summary: Sets the "flag" slot of a battle object's extra vars to 1.
interface: void object_setFlag(BattleObject* object) /* r0=object; returns r1=1, NZ flags set from that value */
details: 'Stores 1 into [r0 + oBattleObject_ExtraVars + 8], i.e. the third word of the battle

  object''s ExtraVars block (offset +8 from ExtraVars). r1 is loaded with 1 before the

  store, so on return r1 holds the value written and the caller can test NZ against it

  (mov r1,#1 always sets Z=0, N=0 — callers apparently can rely on r1==1 rather than the

  flags). Tiny leaf routine; no other registers touched, no branches.

  '
