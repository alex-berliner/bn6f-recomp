name: battle_initRoundState
address: '0x081378D4'
kind: function
status: probable
summary: 'Initializes a battle-overlay scene/round state: wipes video buffers, resets scene records, clears
  a run of event flags, and sets up the first object''s animation with a screen fade.'
interface: (r0-r3 unused; r5 = scene state struct base, r10[8] = render-state struct) -> r0 = 0; writes
  state fields at r5+0x1,0x2,0xc,0xd,0xe,0x1e and render fields at r10[8]+0x0,0x10..0x1a; invokes screen
  fade
details: The function wipes VRAM, the 0x3001960 palette buffer, and the 0x2000-byte BG tile block, applies
  overlay palette slot 0x10, and resets the eStructArr scene records — a full battle-scene visual reset.
  It zeroes a byte at r5+0xc (cleared as four state bytes), then unless sSubmenu's byte equals 0x18, clears
  18 consecutive event flags starting at EVENT_BF (entry 0x12), likely round/turn event flags that don't
  reset in that special submenu mode. It calls five init helpers (sub_8137BF0..F5C) whose result is stored
  at r5+0x1e, sets a halfword 0x1F40 (8000) at r10[8] plus six zero halfwords at +0x10..0x1a, sets state
  bytes r5+1=4 and r5+2=0, and computes the initial animation byte for object 0 via the 0xFF-terminated
  anim-table walker, OR-ing the table entry<<4 into the state bytes. Finally it triggers SetScreenFade(8,
  0x10), a fade-in/out pair, and returns 0. This reads like the start-of-battle/round setup step of the
  overlay's state machine.
