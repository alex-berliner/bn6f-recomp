open_questions:
- Why HitModifierFinal is written to 1 in two places back-to-back in the bit-0x40- set branch (likely
  an aliased field write); and the exact name of bits 2/0x10/ 0x100 in ObjectFlags2 (semantically unknown
  beyond numeric).
- What r7 contributes on entry; the contract advertises r7 read but the code only indexes through r7 once
  for HitModifierFinal, so it must be a struct in r7 (likely a CollisionData/related struct pointer) -
  the exact role of r7 vs the r5 BattleObject pointer is not fully explained by this slice.
