summary: Translate the HitModifierFinal byte of a battle object's collision data into ObjectFlags2 side-effects
  and Unk_0f updates.
interface: (r5 = BattleObject*, r7 = ?, lr) -> void (returns nothing to callers; r0/r1/r2/r4 are scratch
  and r4/r7/lr are restored)
details: "Reads BattleObject_Unk_0f at offset oCollisionData_HitModifierFinal (which is\nCollisionData+0xF,\
  \ i.e. oBattleObject_Unk_0f == CollisionData_HitModifierFinal by the\nstruct layout shown in battle_object_struct/collision_data_struct).\
  \ Each set bit\nselects an effect:\n  - bit 0x01 (no superarmor/anger): setObjectFlags2(4)\n  - bit\
  \ 0x02: setObjectFlags2(2)\n  - bit 0x3C mask = 0x3C -> four sub-cases selected by bit 0x40:\n     \
  \ * bit 0x40 set: setObjectFlags2(0x100), clearObjectFlags2(4), write 1 to\n        [r5,+0x0F] twice\
  \ (oBattleObject_Unk_0f, which aliases\n        CollisionData.HitModifierFinal -- the duplicate store\
  \ suggests a redundant\n        update across the two aliases)\n      * bit 0x40 clear and flag bit\
  \ 0x100040 clear: setObjectFlags2(0x10),\n        write 1 to [r5,+0x0F]\n      * bit 0x40 clear and\
  \ flag bit 0x100040 set: do nothing (skip to return)\nThe dword 0x220000 in dword_801AF40 is OBJECT_FLAGS_SUPERARMOR|OBJECT_FLAGS_ANGER\n\
  (0x20000|0x200000 = 0x220000), used in object_getFlag to short-circuit bit 0x01\nwhen the object already\
  \ has super-armor or anger.\nSide effects: ObjectFlags2 bit 0x04/0x02/0x10/0x100 may be set/cleared,\
  \ plus a\nscratch flag in object_getFlag; HitModifierFinal/oUnk_0f may be written to 1.\nCallers all\
  \ share a per-frame post-collision pipeline (the three\nbattleObject_processCollisionResults* callers),\
  \ and this is the per-object step that\npropagates the precomputed hit modifier into flag state.\n"
