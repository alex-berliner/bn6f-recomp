    writes r5+0x02=4, r5+0x14=0, r5+0x2a=0xdc and sets r5+0x1b bit 0x20 — a state-machine transition of
    the owning event object; only callees are eLinkState/sub_803EAE4/sub_803EF74 helpers and the scene
    initializer — consistent with a link-multiplayer gated story trigger'
