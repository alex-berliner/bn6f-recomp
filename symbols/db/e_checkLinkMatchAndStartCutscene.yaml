name: e_checkLinkMatchAndStartCutscene
address: '0x08130FC8'
kind: function
status: probable
summary: Event-state routine that clears a flag, sets state 0x21, dispatches via sub_803EAE4; on bit 0x10
  copies r5+0x26/0x2a into a sub_81325CC struct, otherwise fetches eLinkState and a 2-entry record (stride
  0x10) from sub_81323B0, requiring both entries' offsets 4/2/0xa to match eLinkState+0x1c/+0xa/0xd9.
  On mode-4 or full match, once IsScreenFadeActive clears it calls init_cutsceneSceneState (fade + chatbox
  script 0x68), then writes r5+0x02=4, r5+0x14=0, r5+0x2a=0xdc, and sets r5+0x1b bit 0x20 to advance.
interface: () -> void; operates on the event object in r5, sets condition codes via callees only
details: 'Entry clears bit 0x08 of r5+0x1b (a flag byte) and writes state code 0x21 to r5+0x10, then calls
  the eStruct dispatcher sub_803EAE4. Result 1 exits; result 4 jumps straight to the cutscene path; bit
  0x10 in the result copies r5+0x26 and r5+0x2a into a struct returned by sub_81325CC (offsets 8 and 0xa).
  Otherwise it fetches eLinkState (sub_803E8F8) and a two-entry (0x10-stride) record from sub_81323B0
  (0xffffffff = none), requiring BOTH entries to match: entry+4 == eLinkState+0x1c, entry+2 == eLinkState+0xa,
  entry+0xa == 0xd9 (r3 counts down 8->4->2, so a single partial match never triggers). On full match
  or mode 4, once IsScreenFadeActive clears it calls init_cutsceneSceneState (fade + script 0x68), then
  sets r5+0x02 = 4, r5+0x14 = 0, r5+0x2a = 0xdc, clears r5+0x1b and sets its bit 0x20, advancing the event
  state.'
