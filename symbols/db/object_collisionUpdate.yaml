name: object_collisionUpdate
address: '0x080D5B84'
kind: function
status: probable
summary: 'Per-frame collision phase for a battle object: refreshes collision data, spawns the hit effect,
  destroys the object when the battle ends, then dispatches the current action''s collision handler.'
interface: (r5 = battle object) -> r0 = destroyed?(1/0 via CUR_STATE path not returned); flags preserved
  from tst results
details: Calls object_removeCollisionData then object_spawnCollisionEffect (spawning the hit effect at
  the object's coordinates unless suppressed). If battle_isBattleOver returns nonzero, it clears the object's
  collision region and sets oBattleObject_CurState to CUR_STATE_DESTROY, ending the update. Otherwise,
  if the flags byte loaded from the collision data (oCollisionData_FlagsFromCollision) is nonzero it clears
  the collision region. When battle_isTimeStop says time is stopped it calls object_presentCollisionData
  to just refresh collision state; otherwise it indexes off_80D5BC8 by oBattleObject_CurAction and calls
  the handler via mov lr,pc; bx r1 (ARM caller, THUMB targets), the table currently holding only sub_80D5BCC+1.
