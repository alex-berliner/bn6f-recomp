name: rfu_initCommState
address: '0x08147B54'
kind: function
status: probable
summary: 'Resets the wireless-adapter link state: zeroes two buffers, clears per-player connection tables,
  binds the RFU receive buffer, and sets the comm state to 0x31.'
interface: (r0 = buffer A to zero, r1 = buffer B (later used as RFU recv buffer), r2 = size in bytes)
  -> r0 destroyed; global comm state initialized, word_200BC58 = 0x31
details: The two SWI_CpuSet calls use mode (r2>>1) | 0x1000000, i.e. 16-bit fill, zeroing r0 and then
  r1 with r2 bytes each (the zero is staged in two halfwords on the stack). It then calls sub_8146A70
  on unk_200FFF0 and unk_200FE90 (likely clearing link/session structures), sets byte_20101B4 = 1, and
  copies byte_2010292 into byte_2010274. A 4-iteration loop zeroes byte_2010220[i], word_2010400[i*2]
  and word_2010428[i*2], which look like per-player (max 4) connection tables, and clears byte_2010390.
  It then calls rfu_clearSlot(0xC, byte_20103E0) and rfu_setRecvBuffer(0x20, byte_20103E0, r1, r2), attaching
  the caller's buffer as the wireless receive buffer for the slot stored in byte_20103E0. Finally it writes
  0x31 (49) to word_200BC58, presumably a comm task/state selector that makes the main wireless loop proceed.
