name: sub_811CC02
address: '0x0811CC02'
kind: function
status: hypothesis
summary: Runs the action implemented by sub_811CC4E and then reports success by returning 1.
interface: void sub_811CC02(r5 in /* context passed through to sub_811CC4E */, lr); out r0 = 1 (success), r1 = whatever
  sub_811CC4E left, NZ from r0=1, C = whatever sub_811CC4E left
details: A tiny wrapper/thunk. It tail-delegates to sub_811CC4E (which presumably consumes r5, likely some object
  or script context), then unconditionally sets r0 = 1 to signal success or "true", sets the NZ flags from that
  value, and returns. r1 and the carry flag are not set by this function; they simply carry over from the callee,
  so callers depending on them are really reading sub_811CC4E's leftovers. Given the shape (do work, return 1),
  this looks like a script/Battle action or event step that always reports success, but without knowing what sub_811CC4E
  does there is not enough evidence to name it in game terms or assign a subsystem prefix.
