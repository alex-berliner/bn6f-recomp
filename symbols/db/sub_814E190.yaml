name: sub_814E190
address: '0x0814E190'
kind: function
status: confirmed
summary: Pops the next entry number off an 8-bit command queue and copies (via sub_814E0B6) the three words of that
  table entry into the work struct's 0x24/0x28/0x2C parameter slots.
interface: void loadNextQueuedParams(u32 *owner /*r0, holds table ptr at +0x30*/, u32 *work /*r1, queue cursor at
  +0x40, params at +0x24/0x28/0x2C*/)
details: "Sequence-driven parameter loader, part of a small scripted-event/queue interpreter:\n- Reads a byte at\
  \ the cursor stored in the work struct at r1+0x40 (the cursor is\n  a 32-bit pointer into a byte queue of entry\
  \ indices), advances the cursor by 1.\n- Uses the byte as an index into a 12-byte-per-entry table whose base pointer\
  \ is\n  stored in the owner struct at r0+0x30 (entry address = table + index*12).\n- Loads the three words of\
  \ that entry (offsets 0, 4, 8) and runs each through\n  sub_814E0B6 (an in-place word transform on r3 — likely\
  \ a decrypt/decode step)\n  before storing them to work+0x24, work+0x28 and work+0x2C, where the rest of\n  the\
  \ interpreter presumably reads them as command/parameter fields.\nQuirks: the return address is stashed in r12\
  \ (mov r12, lr ... bx r12), so the\ncaller's LR is free to be clobbered by sub_814E0B6 without a stack save; any\n\
  reimplementation must set r12 = LR before returning. The entry index is treated\nas an unbounded byte, so a corrupt\
  \ queue byte indexes out of the table. The two\n0x00 bytes after bx r12 are padding for alignment.\n"
