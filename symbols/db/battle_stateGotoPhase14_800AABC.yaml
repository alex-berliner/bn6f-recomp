status: confirmed
summary: Advances the battle state machine into phase 0x14, first running the struct-setup helper with argument
  4
interface: void battle_stateGotoPhase14_ADDRESS(Toolkit *r10 /* uses r10->battleStatePtr */);  // reads r5/r10/lr,
  returns r0=battleState, r1=0, NZ flags from 0
details: 'Reads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), calls setTwoStructs_800A840
  with r0=4 (likely an id selecting which pair of battle structs to initialize/reset), then writes phase index 0x14
  into the battle state byte at oBattleState_Index_01 and zeroes the halfword at oBattleState_Unk_02_03 (per-phase
  counter/progress field). The final `mov r1, #0` sets NZ from 0, so the caller sees Z=1 N=0 on return; r0 carries
  the battle state pointer back. r5 is preserved despite being used as a scratch copy of the toolkit pointer. Phase
  0x14 is one of the battle-flow states dispatched by the main battle loop; the exact gameplay meaning of phase
  0x14 (e.g. which screen or sub-mode it enters) is not identifiable from this function alone.'
