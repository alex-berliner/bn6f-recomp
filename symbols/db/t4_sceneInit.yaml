    re-init of overlay scene records and text box; strh 0x1F40,[RenderInfo] and clearing RenderInfo+0x10..0x1A:
    resets render/scroll state; battleObject_advanceAnimTableBy0xFF_8120CC8(0, dword_8129180) with results
