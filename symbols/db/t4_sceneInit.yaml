name: t4_sceneInit
address: '0x08130084'
kind: function
status: probable
summary: 'Full initialization routine for an overlay cutscene/scene: resets video, scene records, chatbox,
  and the scene object''s animation state, then fades in.'
interface: () -> void; r5 = scene/object state ptr, r10 = toolkit must be set by caller; clobbers r7
details: 'Calls sub_8130404 (result kept in r7, likely a work buffer) then wipes all video state: VRAM
  zero-fill, the 4-byte palette buffer at 0x3001960, and the 0x2000-byte BG tilemap buffer, and applies
  overlay palette slot 0x10. It re-initializes the battle-overlay eStruct record array via battle_resetEStructRecords_8046664
  and resets the chatbox. It then zeroes RenderInfo fields: stores 0x1F40 (8000) into the halfword at
  RenderInfo+0 and clears +0x10..+0x1A, and zero-fills 0x400 bytes at the sub_8130404 result. A series
  of sub-init calls (8130108/813017C/81301DC/8130208/813064C/8130810/81304BC/81304EC) set up scene pieces;
  finally it reads the first entry of animation table dword_8129180 via battleObject_advanceAnimTableBy0xFF_8120CC8
  with index 0, storing the frame/table bytes into r5+0x17 and r5+0x18, and calls SetScreenFade(8, 0x10)
  to fade the scene in.'
