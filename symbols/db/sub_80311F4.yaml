open_questions:
- What do sub_8031122, sub_8031570, sub_80311B6, sub_8030E14 actually do? sub_8031570 looks like a probe/raycast
  or "is this subevent active?" test; sub_8030E14 looks like a position/screen-to-world query given its (0x20, 0x20)
  tile-ish args and r6=1.
- What struct is being passed via r0 and mutated by sub_8031122/sub_80311B6? The lifted body treats the saved {r0,r1,r2,r5}
  as a 16-byte context blob written through the r0 pointer; the field layout is unknown.
- Is r12 really a "flags" word, or is it something like an event mask / visibility cap that gets bits 0..1 forced
  on after the shake?
- Is the "hit" actually a sub-event trigger (e.g. enemy contact, Navi hit, screen transition), and the camera shake
  is the visible consequence? This matches the camera_moveByDelta call but isn't proven.
