name: sub_80311F4
address: '0x080311F4'
kind: function
status: hypothesis
summary: Likely a small per-frame effect routine that, when sub_8031570 reports a hit/non-zero event, re-runs sub_8031122/sub_80311B6
  setup, queries sub_8030E14 for a position delta, neg-halves it via neg;lsr
interface: "void sub_80311F4(u32* io /* r0 */, u32 arg1 /* r1 */, u32 arg2 /* r2 */, u32 arg5 /* r5 */, u32* ioFlags\
  \ /* r12, gets |=3 */)\n  -> sets r0/r1/r2/r5/r12; clobbers r4/r6/r7/r8/r9 and NZCV; preserves caller r0/r1/r2/r5\n"
details: '- Saves {r0,r1,r2,r5,lr} on the stack and uses that frame as the implicit "context" pointer that callees
  (sub_8031122, sub_80311B6) write through via r0. r12 is deliberately NOT saved: the function reads it, ORs in
  3, and returns it.

  - First calls sub_8031122 with the saved context (r0 points at the stack frame).

  - Calls sub_8031570(r2=0, r3=0x20, r4=0x20, r5=0) which returns a status in r0; the caller''s branch treats 0
  as "no event" (beq loc_8031234) and non-zero as "fire the shake". r3 is left at 0 from the surrounding code, then
  reused as a scratch before the call.

  - On hit: pops {r0,r1,r2,r5} back out of the same stack slot (net SP unchanged — the slot is reused), calls sub_80311B6
  (also writes through r0), then sub_8030E14(r2=0, r3=0x20, r4=0x20, r5=0, r6=1) which returns a (dx,dy) pair in
  r0/r1.

  - The classic neg;lsr #1;neg sequence is applied to both r0 and r1 to remap a magnitude to a sign-preserving offset
  around zero (this is the standard "absolute value, divide by 2, then re-apply a biased sign" trick used for camera
  shake deltas; identical bit pattern to abs(v)/2 with sign bias).

  - The resulting (dx,dy) is handed to camera_moveByDelta_80310B0, strongly suggesting the camera-shake interpretation.

  - Epilogue does `r0 = r12; r0 |= 3; r12 = r0` — sets the low two bits of a flags/state word in r12 — then `pop
  {r0-r2,r5,pc}` to return.

  '
