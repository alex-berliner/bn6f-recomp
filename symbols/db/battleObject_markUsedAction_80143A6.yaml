status: probable
summary: Sets the navi alliance's navi-stats `Unk_0e` flag to 0x80 for the AI actor in r5, clears the
  global `USING_ACTION`/`FLINCHING` object flags, and zeros the actor's AIData Anger and Unk_4c fields.
interface: '(r5 = *BattleObject whose AIDataPtr is set up) -> r0 = 0 ; side effects: clears `object_clearFlag(1<<0x15)`
  and `object_clearFlag2(0x200)`, writes 0x80 to NaviStats+0xe, writes 0 to AIData.Anger and AIData.Unk_4c'
details: "1. Reads `BattleObject.Alliance` at oBattleObject_Alliance (r5+0x16) and calls `GetBattleNaviStatsAddr(alliance)`\
  \ to fetch the alliance's `*NaviStats`.\n  2. Writes 0x80 into `[NaviStats+0xe]` — this matches `NaviStats`'s\
  \ `Unk_0e` slot rather than a named field; in context with the AI's action lifecycle it is effectively\
  \ \"this alliance's navi has just used an action / is actioning\".\n  3. Falls through (tail-call style\
  \ via `b loc_80143B6`) into the shared tail:\n     - `object_clearFlag(1<<0x15)` clears global `OBJECT_FLAGS_USING_ACTION`\
  \ (bit 21).\n     - `object_clearFlag2(0x200)` clears `OBJECT_FLAGS_2_UNK_BIT_09`.\n     - Loads `r5->AIDataPtr`\
  \ and writes 0 as a halfword to `AIData.Anger` (offset 0x34) and as a word to `AIData.Unk_4c` (offset\
  \ 0x4c).\n  4. Returns `r0 = 0` (Z flag set in the captured exit).\n  The pattern — \"mark alliance\
  \ navi used-action, clear global USED_ACTION, reset AI Anger + Unk_4c\" — is shared by many AI action\
  \ handlers (sub_8014BEE, 8014E08, 8015040, 80152C8, 80154C8) and `useChipRelated_80127C0`, suggesting\
  \ this is the AI \"done with this action, clear input/aggro bookkeeping\" routine.\n"
