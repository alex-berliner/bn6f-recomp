name: getUnk200431cTableByteCapped3_813BF0C
address: '0x0813BF0C'
kind: function
status: confirmed
summary: Reads a byte at the given index from the toolkit's Unk200431c table and clamps the value to a maximum of
  3.
interface: u8 getUnk200431cTableByteCapped3_ADDRESS(u32 index /* r0 */); // r1 also returns the table base pointer;
  flags clobbered
details: 'Loads the toolkit pointer (r10-based struct, field oToolkit_Unk200431c_Ptr),

  then reads an unsigned byte from that table at offset r0 (the index). If the

  value is greater than 3 it is clamped to 3 before being returned in r0; the

  table pointer itself is returned in r1 as a side output. The comparison uses

  ble, but since the operand is a zero-extended byte (0-255) the clamp is

  effectively an unsigned max(3) saturate. No other state is touched, so this

  is a pure lookup accessor; what the table tracks in game terms (the pointer

  lives at toolkit offset 0x200431c) is not identifiable from this function alone.

  '
