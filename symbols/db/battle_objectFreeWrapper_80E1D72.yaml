name: battle_objectFreeWrapper_80E1D72
address: '0x080E1D72'
kind: function
status: confirmed
summary: Trivial destructor wrapper that releases a battle object's memory slot back to the object pool via object_freeMemory.
interface: void battle_objectFreeWrapper(object* obj /* r0 */); tail-calls object_freeMemory(r0)
details: 'A one-line helper: pushes lr, calls object_freeMemory, then pops pc (so lr/pc handling is explicit rather
  than a tail-branch). The incoming r0 (pointer to a battle object) is passed straight through to object_freeMemory,
  which disposes of the object and returns its slot to the pool. r5 is untouched and preserved for the caller; the
  flags and r0-r3 returned are simply whatever object_freeMemory leaves behind. Callers consistently treat this
  as "free this object now", so it functions as the standard destructor/teardown hook for battle objects, likely
  registered or called when an object despawns or a battle scene is torn down.

  '
