name: battle_queueEffectRequest
address: '0x0800BF16'
kind: function
status: probable
summary: Records an id into both request slots of the byte_203CF00 array (plus two work slots), then arms
  slot r0 as an active battle effect/spawn request with a type byte and parameter word.
interface: (r0 = slot index (0/1), also recorded as a byte; r1 = type/kind byte; r2 = param word; r5 read
  as-is from caller) -> r0 = entry pointer, no meaningful return; r1-r3 clobbered
details: 'The function first stores its r0 byte at offset +3 of entry 0 and entry 1 of the 0x50-byte-per-entry
  array at 0x203CF00 (via getEntryPtr), and also passes it to writeByteToWorkSlots0And1, which mirrors
  it into two work slots — so some ''current id'' byte is fanned out to several places. Control then falls
  into a shared tail (also entered from a twin prologue at loc_800BF30) that fetches entry[r0]: if the
  word at entry+8 is a non-null pointer, it writes 8 to obj+8 and 4 to obj+0xB (apparently marking/state-setting
  on the previously attached object) before the pointer is replaced. It then stores r1 at entry+2, r2
  at entry+8, the caller''s (stale, unsaved) r5 at entry+0xC, and sets entry+1 = 1 as an active/enabled
  flag. So the entries look like queued request descriptors: +1 active, +2 type, +3 id, +8 attached object/pointer,
  +0xC param. Callers are all battle chip/AI effect firers, consistent with this being the shared ''queue
  the effect'' call.'
evidence:
