  date: '2026-10-18'
  detail: '0x800BF1C-0x800BF28: getEntryPtr(0) and getEntryPtr(1), strb r4,[r0,#3] each — same id byte
    written to both slots; 0x800BF36: bl writeByteToWorkSlots0And1_800B8AC with the same r0 byte, matching
    its ''writes byte to slots 0 and 1'' summary; 0x800BF3E-0x800BF4A: ldr r3,[r0,#8]; sets [r3,#8]=8
    and [r3,#0xB]=4 on the non-null object pointer already held at entry+8; 0x800BF50-0x800BF5A: strb
    r1,[r0,#2]; str r2,[r0,#8]; str r5,[r0,#0xC]; mov r1,#1; strb r1,[r0,#1] — arms the slot (type, param,
    active flag); Callers battle_applyInvisibleClear_80106C0, battle_lowHPTileTrigger_8010660 and AI sub_80EC350
    all invoke it right after clearing a stats flag and firing a panel/attack effect'
