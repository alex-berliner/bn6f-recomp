  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary of behavior is mostly correct: it calls sub_814339C, zero-fills the 0xA0-byte crow records
    array at byte_2000D20, and twice calls sub_81430B6(0) followed by ClearEventFlagRange(8). The ''mov
    r0,r0'' before the first ClearEventFlagRange is a no-op (r0 still holds sub_81430B6''s return), so
    the first ClearEventFlagRange uses that return value, while the second uses r1 (overwritten by ClearEventFlagRange''s
    own return). Since ''clear'' is the appropriate prefix and ''Lesson'' isn''t an established one, a
    tighter name would be ''clearCybercrowLesson'' or ''initCybercrowLesson''.; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
