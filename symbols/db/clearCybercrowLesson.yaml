    buffer wipe, tying flag clearing to the lesson reset; byte_2000D20 is symdb-identified as Cybercrow
    lesson crow records with state/timer/heading/position fields; sole caller sub_8142ECC and callees
    sub_814339C/sub_81430B6 are unknown, but the reset pattern is self-contained
