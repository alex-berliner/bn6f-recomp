name: clearCybercrowLesson
address: '0x081431C6'
kind: function
status: probable
summary: 'Resets the Cybercrow lesson state: runs sub_814339C, zero-fills the 0xA0-byte crow-records array
  at byte_2000D20, and calls sub_81430B6(0) twice with each result passed to ClearEventFlagRange(8).'
interface: () -> void; clobbers r0-r2, calls sub_814339C, ZeroFillByWord, sub_81430B6, ClearEventFlagRange
details: Takes the pointer to byte_2000D20 (the Cybercrow lesson crow records, 8 slots of 0x14 bytes),
  first runs sub_814339C (unknown, likely per-slot teardown or state fetch), then zero-fills the whole
  0xA0-byte array, wiping state/timers/heading/position of every crow slot. It then calls sub_81430B6
  with r0=0 twice and after each call invokes ClearEventFlagRange with range 8, clearing a block of event
  flags tied to the lesson entries. The odd 'mov r0, r0' / 'mov r0, r1' suggest r1 (the flag bitfield
  argument) comes from sub_81430B6's return, so the flags cleared depend on its result. Overall this reads
  as an init/reset routine run when the Cybercrow lesson area is entered or restarted.
