open_questions:
- Contents of byte_8136828 (the eStruct spawn table) and of sub_8136B58/its caller sub_8136218 are unknown; they
  would confirm whether this is beast-out activation vs. another beast-related effect
- Meaning of the 0x27/0x37/0x3f bytes in Unk200f3a0 and the 0x48/0x37/0xC/0x10 writes to Unk2009740 is not established
- The summary is accurate about state resets, table-driven eStruct spawn, and the various toolkit writes (including
  the 0x48/0x37/0xC/0x10 into Unk2009740 and the byte_81368C8 lookup into RenderInfo+0x18). However, the render
  info lookup uses `[r5+0xF]` as an index, not a stride of itself; the lsl r1,r1,#2 scales that index, and stores
  a halfword at offset 0x18 with offset 0x1A zeroed — the proposal's description is fine but the name is too specific.
  Since the function ends by calling sub_8136B58(0) and clearly configures an object's beast-out visual state, a
  more standard name like `object_beastOutSetup` fits the object's prefix convention better.
