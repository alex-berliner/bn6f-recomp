name: object_beastOutSetup
address: '0x0813686C'
kind: function
status: probable
summary: 'Battle-side setup for the Beast Out transformation: initializes object state, spawns the associated eStruct
  effects from byte_8136828, and programs the toolkit''s Unk200f3a0 / RenderInfo / Unk2009740 fields before calling
  sub_8136B58(0).'
interface: (no args used; object in r5, toolkit in r10) -> void; no return value
details: Resets the object's state fields ([r5+3]=0, [r5+0x12]=8, [r5+0x1c]=0xA), then spawns a table-driven batch
  of eStruct effect records from byte_8136828 via battle_spawnEStructRecordsFromTable_80465A0. It writes 0x27, 0x37,
  0x3f to bytes 9-0xB of the Unk200f3a0 struct, and indexes byte_81368C8 with the object's byte at r5+0xF (x4 stride)
  to load a halfword (0xF6/0xFC, likely a scroll/layer offset) into RenderInfo+0x18 with +0x1A zeroed. Finally it
  writes 0x48, 0x37, 0xC, 0x10 into the struct at Unk2009740 (offsets 0-3) and calls sub_8136B58(0). The recorded
  route is 'beastsp', consistent with beast-out/spawn setup.
