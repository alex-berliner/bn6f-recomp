name: owMapObject_weatherTornado_isPauseDue_80A9150
address: '0x080A9150'
kind: function
status: confirmed
summary: Checks a tornado overworld map object's pause countdown, resetting it and signaling the caller when it
  has reached its threshold.
interface: u32 owMapObject_weatherTornado_isPauseDue_80A9150(MapObject* obj /* r5 */); sets NZ flags from r0
details: 'r5 points to a map-object struct. The object keeps a countdown at +0x28 and a threshold/pause-length byte
  at +7. If the countdown (read as signed byte) is still below the threshold, the function returns 0. Once the countdown
  reaches or exceeds the threshold, it writes 0 back to +0x28 (resetting the timer so the pause cycle restarts)
  and returns 1. The result is also left in the NZ flags via tst r0, r0, so callers can branch directly on the return
  value. The +0x28 field and +7 field are presumably the object''s shared timer slot and a per-object parameter
  byte set by the tornado spawn code.

  '
