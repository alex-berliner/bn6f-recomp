name: list_tryAddUniqueEntry_800AA1A
address: '0x0800AA1A'
kind: function
status: confirmed
summary: Adds a 32-bit value to an 8-entry registry list returned by getNextEntryAddress_800AAAE, storing it in
  the first free (zero) slot; fails if the value is already present or the list is full.
interface: bool list_tryAddUniqueEntry_800AA1A(u32 value /*r5*/); /* r7 and lr are working inputs (r7 saved/restored);
  returns r0 = 1 if stored, 0 if already listed or list full; clobbers r1 and flags */
details: 'Calls getNextEntryAddress_800AAAE to obtain the base address of a fixed 8-word (0x20-byte) list, then
  scans it linearly in 4-byte steps. If a slot already equals the value in r5, it returns 0 without writing. If
  it finds a zero slot first, it stores the value there and returns 1. If all 8 slots are non-zero and none match,
  it returns 0 (list full). r1 is left holding the last list word read. The list is not sorted; zero acts as the
  "empty" sentinel, so a genuine value of 0 can never be meaningfully registered. Note the caller passes r7 in even
  though it is immediately saved and overwritten with the list address — the contract reflects observed callers,
  but r7''s incoming value is not used.

  '
