name: owPlayer_setInteractionLocked_809e230
address: '0x0809E230'
kind: function
status: confirmed
summary: Sets the overworld player object's InteractionLocked flag to TRUE so the player cannot act while e.g. a
  cutscene or dialog is running.
interface: void owPlayer_lockInteraction(Toolkit *toolkit /* r10 */); returns r0 = 1 (TRUE), r3 = overworld player
  object pointer, NZ flags set from r0
details: 'Reads the toolkit''s GameState pointer (r10 + oToolkit_GameStatePtr), then the GameState''s OverworldPlayerObjectPtr
  (oGameState_OverworldPlayerObjectPtr), and stores the byte value 1 (TRUE) at oOWPlayerObject_InteractionLocked
  on the player object. This flag presumably makes the overworld player non-interactive, e.g. during cutscenes or
  dialogs. Only ever locks; there is no unlock path here (a companion clear/zero function likely exists). Does not
  follow a typical AAPCS call shape: it takes its argument in r10 and returns the player object pointer in r3 plus
  a constant TRUE in r0 with flags set, so callers are compiler-generated/tail-context rather than hand-written
  C conventions.'
