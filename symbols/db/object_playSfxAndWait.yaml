name: object_playSfxAndWait
address: '0x080BF2FC'
kind: function
status: probable
summary: Plays sound 0x94 once, decrements an oBattleObject Timer from 60, then sets CurAction=4 and CurPhaseAndPhaseInitialized=0.
interface: (r5 = battle object, only fields read/written) -> r0 = 0 always; no flags used by caller pattern
details: Uses r5 as a battle object struct with the known oBattleObject fields. On first run (PhaseInitialized
  == 0) it plays sound effect 0x94, loads Timer with 0x3C (60 frames), and sets PhaseInitialized = 4 so
  the init block is skipped afterwards. Every frame it decrements Timer; while it's still > 0 it just
  returns. When the timer reaches 0 it sets CurAction = 4 and writes 0 to CurPhaseAndPhaseInitialized,
  sending the object on to its next action/phase. This is the classic one-shot 'play sound, pause a second,
  move on' phase seen in battle object scripts.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / tst / bne guards a one-time init block (asm
    lines 2-4); init block: mov r0,#0x94; bl PlaySoundEffect — plays SFX 0x94 once; strh r0(=0x3C),[r5,#oBattleObject_Timer]
    — 60-frame countdown; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt locret — per-frame wait
    until timer expires; on expiry: strb 4 -> CurAction and strh 0 -> CurPhaseAndPhaseInitialized — advances
    to action 4, re-arms phase init'
