name: ai_animEndResetAttack
address: '0x08111AEC'
kind: function
status: probable
summary: Checks the current animation frame's attribute for the 'last frame' flag and, when set, resets
  the object's animation and reloads its AI attack timers.
interface: (r0 = battle object ptr, r5 = battle object (CurAnim), r7 = AI attack vars ptr) -> r0 = clobbered;
  flags from tst
details: Calls sprite_getFrameParameters on the object and tests bit 0x80 of the returned attribute byte,
  which marks the animation's end/loop frame. If the flag is clear the function does nothing and just
  returns. When the flag is set it stores 0 into oBattleObject_CurAnim (restarting the animation at frame
  0), copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer (re-arming the step/attack countdown),
  and writes 0x10 into oAIAttackVars_HitElement, apparently a neutral/default element value. Effectively
  this is a per-frame tick that reinitializes an AI attack cycle once its animation finishes. r5 and r7
  are not set inside, so callers must provide object and attack-vars pointers.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sprite_getFrameParameters; tst r0,#0x80 gates the whole body — only the animation-end attribute
    bit triggers the reset; strb r0,[r5,#oBattleObject_CurAnim] with r0=0 restarts the sprite animation;
    ldrh/strh pair copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, re-arming the AI
    attack countdown; HitElement is set to the constant 0x10, a reset/default element rather than a passed-in
    value; 13-instruction leaf with no other calls; runs in battle routes (battlesweep, beastsp) where
    AI attack state ticks
  refs:
  - bn6f/asm/asm32.s:7746
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x08111AEC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-203615'
coverage:
- battlesweep
- beastsp
open_questions:
- No known caller, so which object/attack this resets and what element 0x10 denotes is unconfirmed
- The exact meaning of attribute bit 0x80 in sprite_getFrameParameters (end-of-animation vs loop marker)
  needs a second usage to pin down
