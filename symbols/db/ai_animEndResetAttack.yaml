name: ai_animEndResetAttack
address: '0x08111AEC'
kind: function
status: confirmed
summary: When an AI-controlled battle object's animation reaches its end frame, resets the attack state (idle anim,
  restart step timer, element back to normal).
interface: void ai_animEndResetAttack(battleObject* r5, aiAttackVars* r7); // returns r1 = 0x80 always
details: 'Calls sprite_getFrameParameters with the object in r5 and checks bit 0x80 (the "animation end" flag) of
  the returned frame parameters. If the current animation has not ended, nothing else happens. Otherwise it: stores
  0 to oBattleObject_CurAnim (back to the idle/default animation), reloads oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer
  (restarting the attack/step countdown), and stores 0x10 into oAIAttackVars_HitElement (0x10 being the "normal/none"
  element). r1 is left holding 0x80 (the mask value loaded before the tst), which callers apparently ignore or accept.
  Presumably used as an animation-end callback for AI attack routines.

  '
