open_questions:
- exact meaning of r1=2 in object_getFirstPanelInDirectionFiltered and object_checkPanelParameters (panel
  parameter type?)
- which structure r5 points to and what field 0x16 semantically is (variant id vs row/area index)
- what flag bit 0x20 denotes on a panel (e.g. hole/broken/grass)
- which boss or enemy AI uses this, since no callers are known
