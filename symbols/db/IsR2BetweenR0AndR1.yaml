name: IsR2BetweenR0AndR1
address: '0x0800E6E8'
kind: function
status: confirmed
summary: Generic math helper that checks whether a value (r2) lies within the interval bounded by r0 and r1, returning
  1/0 regardless of which bound is smaller.
interface: bool IsR2BetweenR0AndR1(int lower_or_upper_a /*r0*/, int the_other_bound /*r1*/, int value /*r2*/); sets
  NZCV flags, result also mirrored in r3
details: 'Compares r0 against r1 first; if r0 <= r1 it tests r1 >= r2 > r0, otherwise (bounds given reversed) it
  tests r0 >= r2 > r1. In both cases the lower bound is EXCLUSIVE and the upper bound INCLUSIVE, so the check is
  "value is in (min(r0,r1), max(r0,r1)]". Touches no memory — pure register computation, no game structures. Returns
  the boolean in both r0 and r3 (r3 is used as scratch accumulator and then copied to r0). A quirk is that equal
  inputs (r0 == r1) take the ascending path, so the empty interval (x, x] can never be true; also a value exactly
  equal to the smaller bound is rejected, while a value equal to the larger bound is accepted. clobbers NZCV via
  cmp.

  '
