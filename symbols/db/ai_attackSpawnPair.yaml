name: ai_attackSpawnPair
address: '0x08102F38'
kind: function
status: probable
summary: AI attack handler step that spawns two type-3 objects (variants 1 and 3) on the attacker's side,
  forwarding the attack's init flag, damage and sub-step index.
interface: (r5 = attacker battle object, r7 = oAIAttackVars {InitFlag, Damage, SubStepIndex}) -> spawns
  two battle objects via battle_spawnObjectBBAndInit; r0-r3 clobbered
details: Reads oBattleObject_Alliance from the attacking object and computes a spawn coordinate as alliance*5+1
  (own side vs enemy side). It calls battle_spawnObjectBBAndInit twice with the same coordinate, first
  with variant 1 then variant 3, so the attack manifests as a pair of related 0xBB objects. Arguments
  forwarded to the spawner are r2 = oAIAttackVars_InitFlag, r6 = oAIAttackVars_Damage and r4 = oAIAttackVars_SubStepIndex;
  r0/r2 are pushed and popped around the first call because the callee clobbers them. The oAIAttackVars
  field names and the caller chain within an AI attack route indicate this is one step of an AI-driven
  attack routine.
