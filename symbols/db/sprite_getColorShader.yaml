name: sprite_getColorShader
address: '0x08002EDC'
kind: function
status: confirmed
summary: Returns the 16-bit color/palette shader value stored in an object's sprite data.
interface: u16 sprite_getColorShader(ObjectHeader *header /* r0 */)
details: 'Takes a pointer to an object header in r0. Reads the header''s TypeAndSpriteOffset byte

  (offset +2), whose high nibble encodes a byte offset to the object''s sprite data. The nibble

  is isolated and shifted back left so the offset is a multiple of 16, then added to the header

  pointer to locate the sprite block. Returns the halfword at +6 within that sprite block

  (oObjectSprite_Unk_06), which the readable C identifies as the sprite''s color/palette shader

  value. Only r3 is used as scratch; the caller''s r0 is overwritten with the result.

  '
