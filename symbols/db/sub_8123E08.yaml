name: sub_8123E08
address: '0x08123E08'
kind: function
status: hypothesis
summary: Tests bit 0x20 of a per-index status byte in the table at 20018EC, returning 1 if set / 0 if clear.
interface: bool isStatusBit20Set(void* state /* r5 */); // returns in r0 (and mirrors it in r2); leaves NZ flags
  set from the AND with 0x20 for caller branching; clobbers r1
details: 'Takes a state/struct pointer in r5 and reads a one-byte index from offset 0xC. Uses that index into the
  byte table at unk_20018EC (a global status/flag array in IWRAM) and masks the byte with 0x20. If the bit is set,
  both r0 and r2 are set to 1, otherwise both are 0; r2 is likely used as a secondary result or scratch output by
  callers. The NZ flags are left over from the AND, so some callers may branch directly on the flags instead of
  reading r0. With r5 being a caller-provided object pointer and the index at +0xC, this looks like a generic "check
  object''s status flag" helper rather than subsystem-specific code, but what the 0x20 bit means (active, hidden,
  transformed, custom-set flag, etc.) is not yet known from this function alone.

  '
