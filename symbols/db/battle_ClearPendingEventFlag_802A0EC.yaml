summary: Clears the byte flag at byte_20352CC (offset 0x4C of eStruct2035280), marking the battle/event it tracks
  as finished.
interface: 'void sub_802A0EC(void); // in: lr only; out: r1=0, r2=0x4C, NZ set from "mov r2,#0x4C"; clobbers r0'
details: Trivial one-store helper. Loads the base pointer of eStruct2035280 (0x02035280) via a literal pool, then
  writes 0 to the single byte at offset 0x4C (byte_20352CC). No other fields are touched and no branches are taken.
  The register contract shows callers read back r1 (always 0), r2 (always 0x4C), and the NZ flags (set by the r2
  load), so this looks like a tail-converted "clear flag" call whose return values are incidental artifacts of the
  compiled code rather than meaningful results. Given the work area and flag placement, the byte appears to act
  as a "pending battle/event in progress" marker that this function resets to signal completion; callers presumably
  test it afterwards (or rely on it being clear) to resume normal flow.
