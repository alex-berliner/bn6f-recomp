name: ai_stampAreaPattern
address: '0x0813B950'
kind: function
status: probable
summary: Stamps a 7x7 AI-selected area pattern centered on a battle-grid tile, writing value+1 into grid
  cells where the pattern is nonzero.
interface: (r0 = marker value, r1 = AI dispatch argument, r2 = center x, r3 = center y) -> r0 = dispatched
  pattern pointer; no return value
details: 'Calls ai_dispatchFromGlobalByte (global byte at 20096D8 picks the AI routine) and treats its
  returned pointer as a 7x7 byte pattern, read row-major. It centers that pattern on tile (r2, r3): base
  = *toolkit[200414c] + 7*(y-3) + (x-3). It walks 7 rows of 7 bytes, clipping row and column indices to
  0..6 so the stamp wraps nothing outside the grid, and stores r0+1 (the caller''s value incremented first)
  into each in-bounds cell whose pattern byte is nonzero; zero pattern bytes leave the grid cell untouched.
  The destination looks like a per-battle AI 7x7 grid (panel threat/marking map) in the toolkit struct;
  the +1 encoding suggests 0 means ''unmarked''.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl ai_dispatchFromGlobalByte returns r7, read as 49 bytes ldrb [r7,r3] with r7+=7 per row;
    sub r1,#3 / sub r2,#3 / mul r3,r2,#7 / add r3,r1 computes the centered grid offset 7*(y-3)+(x-3);
    bounds checks cmp r1,0 / cmp r1,7 (col) and cmp r2,0 / cmp r2,7 (row) skip out-of-grid cells; add
    r0,#1 before use and strb r0,[r6,r3] only when tst r4,r4 nonzero: writes value+1 where pattern set;
    destination r6 comes from ldr r6,[r10,#oToolkit_Unk200414c_Ptr], a persistent grid in the toolkit
    struct'
