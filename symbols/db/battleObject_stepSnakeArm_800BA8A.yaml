open_questions:
- What battle "kind effect" 0x4C/0x50 represent (the game's chip-effect dispatch opcode table would confirm);
  the "_SnakeArm" name is inferred from SNAKEARM_EV_1..0x20 constants in the struct header — the chip-id
  range check [0xDD, 0x118] plus the alliance-conditioned effect kind 0x4C/0x50 strongly suggest a snake-style
  arm/coil chip, but the precise mapping is not proven by this function alone. - The meaning of dword_200F3B8[Alliance]
  (whether it's a "ready to retract" flag, an animation trigger, or a per-side counter) is unknown; the
  value 1 is written but never read here.
