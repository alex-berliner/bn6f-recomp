name: aiAttack_windupTick_80EEC90
address: '0x080EEC90'
kind: function
status: confirmed
summary: Per-tick state machine for an enemy AI attack's charge-up and release, driving animations and element/timer
  fields.
interface: void sub_80EEC90(r5 battleObject, r7 aiAttackVars, r10 battleState); /* outputs r1 = leftover from last
  callee, not meaningful; flags clobbered */
details: 'Two-phase attack tick for an enemy object. Phase 1 (AttackElement == 0): play animation 0x12 (charge pose),
  reset the object''s counter to its default via object_setDefaultCounterTime, set the object flag bit OBJECT_FLAGS_UNK_BIT_22_BIT
  (charging marker), store 0xE into oAIAttackVars_StepTimer (14 ticks of wind-up), and set oAIAttackVars_AttackElement
  to 4 (charged) so later ticks take phase 2. Phase 2: decrement the halfword StepTimer each tick; while it stays
  >= 0 the function returns without side effects. When it goes negative, play animation 0x13 (attack/release pose),
  reload StepTimer to 0x15 (21), and set oAIAttackVars_HitElement to 4, presumably telling the attack/hit handler
  which element to apply. Touches only the AI attack-variable block fields AttackElement, StepTimer, HitElement
  plus object-level animation, counter and flag state. Quirk: r1 on return is whatever the last called helper left
  there; the function never assigns it itself, so callers that read r1 get garbage by design (typed interface returns
  void).

  '
