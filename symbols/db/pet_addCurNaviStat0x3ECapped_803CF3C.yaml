name: pet_addCurNaviStat0x3ECapped_803CF3C
address: '0x0803CF3C'
kind: function
status: confirmed
summary: Adds a per-navi-slot offset to PET navi stat 0x3E, caps it at 1000, writes it back, and propagates the
  new value through sub_803CF74.
interface: void pet_addCurNaviStat0x3ECapped_803CF3C(u8 navi_slot /* r1 */, u32 mustBe0x70 /* r4 */); r4 must equal
  0x70 or the call returns immediately; r4-r12 are preserved, flags clobbered
details: 'Guarded by an early-out unless r4 == 0x70 (the caller passes a value that acts as a gate/opcode; only
  the 0x70 case triggers this stat update). Computes a per-entry byte offset of 0x14 (20) * r1 — i.e. r1 is a navi
  slot index into a 20-byte-per-navi PET stats array. Reads stat id 0x3E for navi slot 0 via GetCurPETNaviStatsHword,
  adds the slot offset to the raw value, clamps to a max of 1000 (0x3E8), stores the clamped result back with SetCurPETNaviStatsHword
  (again targeting navi 0 / stat 0x3E), then calls sub_803CF74 with (new value, slot offset) so the change is propagated
  to whatever mirrors the stat (likely an active/in-memory copy of the navi stats). Note that the slot offset is
  folded into the stat value itself rather than used as an array index, which looks intentional in this code path
  (stat 0x3E appears to be a running/accumulated value that encodes position within the block, or the stat is only
  meaningful for slot 0 and the offset tags which slot was adjusted).

  '
