name: battle_BDT_80c956c
address: '0x080C956C'
kind: function
status: confirmed
summary: Thunder-1 BattleObject — chooses travel axis/direction toward the opponent (or facing) and writes velocity
  + lifetime timer, applying a speed/bump when Param1 == 2.
interface: void battle_thunderSetVelocity_80c956c(u32 r5 thunderObj /* in */, u32 lr) -> u32 r2 thunderObj->Param1;
  clobbers r0 r1 r3 lr; preserves r4 r6 r7; flags nv c
details: "Thunder-1 (\"BDT\") AI helper. Called with the thunder BattleObject pointer\nin r5. Uses FindOpponentPanelXYForThunderObject(oppX=r0,\
  \ oppY=r1) to locate\nthe target panel.\n  - If no opponent panel is found (r0 == 0), the direction is taken from\n\
  \    object_getFrontDirection() and motion is purely horizontal.\n  - If oppY == thunderY (same row): move horizontally\
  \ toward oppX.\n  - If oppX == thunderX (same column): move vertically toward oppY.\n  - Otherwise (neither matches;\
  \ the assembly flow falls through into the\n    same-row branch): move horizontally toward oppX.\nSign of chosen\
  \ direction: -1 if the target panel is less than the\nthunder's panel coordinate on the chosen axis, otherwise\
  \ +1.\n\nSpeed bases loaded from the literal pool at 0x080C95DC–0x080C95E8:\n  0xAAAB — normal X base  (≈ 1/3\
  \ of 0x10000 * 0x8000 in signed .16)\n  0x10000 — powered X base (charges / heavier thunder)\n  0x6666 — normal\
  \ Y base\n  0x999A — powered Y base\n\"Powered\" values are picked when Param1 == 2; otherwise normal values.\n\
  Multiplication is `mul r0, r1` (signed-word multiply low), so the result\nis direction * base stored as a 32-bit\
  \ signed velocity. The unused axis\nvelocity is cleared to 0.\n\nLifetime timer stored at oBattleObject_Timer:\n\
  \  0x3C (60 frames) normally, 0x28 (40 frames) when Param1 == 2.\nNote: the assembly writes the timer after the\
  \ velocity in both branches,\nusing Param1 re-read in r2.\n\nThe function tail-loads `pc` from `lr` (Thumb-2 `pop\
  \ {pc}`), so it is\ncalled as a `bl` tail-jump, not really push/pop-balanced with `push {lr}`\nat entry.\n"
