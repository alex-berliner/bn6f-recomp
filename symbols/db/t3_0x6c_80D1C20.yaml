name: t3_0x6c_80D1C20
address: '0x080D1C20'
kind: function
status: confirmed
summary: Per-frame state tick for a battle object — dispatches the handler for the object's current state via a
  jump table, then refreshes its paused-sprite bookkeeping.
interface: void (r5 = battle object ptr; r4/r6/r7/r8/r10 = live caller state carried through the state handler)
  -> r5/r8-r12 = handler-modified object/state values (caller-visible high-register results), flags clobbered
details: 'Battle-object tick dispatcher. Reads the object''s CurState byte at r5+oBattleObject_CurState and indexes
  the jump table at off_80D1C38 with the raw byte (entries are already Thumb code addresses, i.e. pre-scaled to
  the 4-byte stride, not a state-index-times-4 computation). This table belongs to a "HP 50 enemy"-style battle
  object: entry 0 = battleObject_stateInitHp50Enemy, entry 1 = object_runCollisionState_80D1D14, entry 2 = sub_80D1C44.
  Dispatches with the thumb tail-call-in-place idiom "mov lr, pc; bx r1", so the handler returns back into this
  function; the handler is entered with r0 = CurState, r1 = its own table entry, r5 = object, and the tick''s other
  registers live. Handlers keep their locals in high registers, so their r5/r8-r12 results are what this tick''s
  callers observe afterwards — the wrapper preserves/propagates them. After the handler returns, calls object_updateSpritePaused
  with whatever object pointer the handler left in r5, then returns via "pop {pc}" to the original caller. lr is
  used purely as the dispatch return address, so lr is listed as an input but is clobbered internally. Flags nzcv
  are clobbered by the handler and the sprite update.

  '
