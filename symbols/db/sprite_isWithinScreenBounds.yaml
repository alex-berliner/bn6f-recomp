name: sprite_isWithinScreenBounds
address: '0x0811C754'
kind: function
status: probable
summary: Returns whether a sprite's position lies inside the screen area padded by 32 px on every side.
interface: (r0 = sprite/object pointer) -> r0 = 1 if x in [-32,272] and y in [-32,192], else 0; r0-r3
  clobbered, flags clobbered
details: Calls sprite_getCoordinates, which returns the sprite's x in r0 and y in r1. Each coordinate
  is compared (signed) against the constants 0xFFFFFFE0 (-32), 0x110 (272) for x and 0xC0 (192) for y;
  any coordinate outside its range branches to return 0. The range corresponds to the 240x160 screen with
  a 32-pixel margin on all sides, so sprites slightly off-screen still count as visible. Likely used by
  callers to skip rendering or AI processing for off-screen entities. The margin constants are stored
  as literals right after the function.
