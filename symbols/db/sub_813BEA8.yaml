name: sub_813BEA8
address: '0x0813BEA8'
kind: function
status: confirmed
summary: Scans the toolkit's unknown-entry table, collects up to 0x31 unique info-table IDs into a scratch buffer,
  and bumps one of two tally bytes on the counter (oToolkit_Unk200431c_Ptr) by 1 or 2 when 5 or more distinct IDs
  are found.
interface: void sub_813BEA8(void /* r10 = toolkit ptr */); /* r7 preserved; clobbers r0/r2, NZCV */
details: 'Zero-fills the 0x31-byte scratch buffer at byte_2006D30 with 0xFF (the

  "not yet seen" sentinel). Iterates index 0..0x30 of the unknown-entry table

  via toolkit_getUnk2004190EntryPtr_813B9FC; for each live entry (low u16

  flag != 0) follows the flag to an info structure through sub_813B780 and

  reads byte 3 as the ID. Each ID is appended into the scratch buffer only

  if it is not already present there, until the buffer is full. After the

  scan, if the number of collected unique IDs exceeds 4, it loads the

  counter struct pointer (r10->field at oToolkit_Unk200431c_Ptr) and bumps

  its offset 0xB byte by +1 when exactly 5 IDs were collected, otherwise

  (+2) on offset 0xC — i.e. distinct-ID overflow tally. The thresholds

  and asymmetric bump amounts (1 vs 2) suggest a "reward tier" trigger

  keyed on how full the ID set is.

  '
