name: battleObject_attackVars_tickExitTimer_80F1888
address: '0x080F1888'
kind: function
status: confirmed
summary: Ticks an AI attack's wind-down exit timer, setting up the exit pose (element 4, anim 7) on the first tick
  and returning the object to object_exitAttackState when the countdown expires.
interface: void battleObject_attackVars_tickExitTimer_80F1888(battleObject *r5, ctx *r6, AIAttackVars *r7) -> u32
  r1 (passthrough or whatever object_exitAttackState leaves in r1); flags clobbered, callers ignore them
details: 'Called with r5 = battle object, r6 = object context (passed through untouched), r7 = AI attack vars. Two-phase
  behavior keyed on oAIAttackVars_AttackElement: on the first tick of the wind-down (AttackElement == 0) it selects
  exit element 4 (strb #4 to oAIAttackVars_AttackElement), switches the object''s current animation to 7 (oBattleObject_CurAnim),
  and initializes the 16-bit oAIAttackVars_StepTimer from the byte oAIAttackVars_TimerOrCycles (attack cycle count).
  On subsequent ticks it decrements oAIAttackVars_StepTimer and stores it back; while the result is > 0 it does
  nothing further. When the timer reaches 0 it tail-calls object_exitAttackState(r5, r6, r7) to hand the object
  back out of its attack state. r1 is only meaningful if the caller wants object_exitAttackState''s return value;
  otherwise it is preserved input. r0, r2, r3, flags and lr are clobbered; r5 and r6 are preserved.

  '
