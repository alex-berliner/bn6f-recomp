name: battleObject_attackVars_tickExitTimer_80F1888
address: '0x080F1888'
kind: function
previous_names:
- sub_80F1888
status: probable
summary: Ticks an AIAttackVars countdown and exits the attack state when it elapses, else plays the victory/finish
  anim on first entry.
interface: '(r5 = battleObject*, r7 = AIData*) -> void ; side effects: writes AIData->AIAttackVars[].Unk_01
  / Unk_10, BattleObject->CurAnim'
details: "Operates on per-attack scratch space at AIData->AIAttackVars[0] (accessed via r7). On first\n\
  \  call (Unk_01 == 0), sets Unk_01 = 4 to mark the \"started\" phase, sets CurAnim = 7 on the\n  battle\
  \ object (the standard attack/victory finish animation, matching the AnimateVictoryAnim\n  0x7 used\
  \ by the attack-exit path), and initialises the Unk_10 counter from AIData->Unk_0d\n  (latched via the\
  \ Unk_0d field that AIData exposes at 0x0d). On subsequent calls it\n  decrements Unk_10; once the counter\
  \ reaches 0 (BGT falls through) it calls\n  object_exitAttackState to leave the attack phase. Pops {pc}\
  \ — no other return value\n  beyond the flags implied by the decrement/test.\ndetails-extra: |\n  The\
  \ \"first call\" branch writes Unk_01=4 to suppress re-entry, the same hand-off used by\n  the attack-state\
  \ exit chain, and the \"subsequent\" branch only decrements. Naming\n  captures the role: it is the\
  \ per-frame \"end of attack\" tick living on AIAttackVars.\n"
