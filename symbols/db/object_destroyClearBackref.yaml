- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1,[r5,#oBattleObject_ExtraVars]; ldr r0,[r1]; cmp r0,r5 — reads a slot whose value is compared
    against this object; bne loc_80C753E / mov r0,#0; str r0,[r1] — zeroes the slot only when it equals
    r5 (conditional unlink); bl object_genericDestroy — ends with the generic battle-object destructor,
