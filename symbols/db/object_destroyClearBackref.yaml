name: object_destroyClearBackref
address: '0x080C7530'
kind: function
status: probable
summary: Destructor variant that clears another object's back-pointer to this object before destroying
  it.
interface: (r5 = this battle object) -> r0 = object_genericDestroy result; no flag contract visible
details: Loads the object's oBattleObject_ExtraVars pointer, then reads the word it points to; if that
  word still equals r5 (i.e., another structure stores a reference back to this object there), it writes
  0 to unlink it. It then tail-calls object_genericDestroy to release panel tile reserves, collision data,
  and the object's memory. The extra-vars target is thus a foreign slot holding a pointer to this object,
  cleared only when it still matches. Uses r5 rather than r0 for 'this', matching the destructor calling
  convention used around battle objects.
