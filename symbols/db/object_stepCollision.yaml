name: object_stepCollision
address: '0x080C9D9E'
kind: function
status: probable
summary: 'Per-frame collision step for a battle object in r5: tears down stale collision data, spawns
  the hit effect, and dispatches an action-specific handler from off_80C9DD4 via oBattleObject_CurAction;
  if battle_isTimeStop is set, falls back to object_presentCollisionData instead.'
interface: (r5 = battle object pointer, implicit) -> void; flags from battle_isTimeStop used for branch
details: Operates on the battle object in r5. It first calls object_removeCollisionData to clear the previous
  frame's collision state, then object_spawnCollisionEffect to spawn the jittered hit-effect object for
  the object's last collision. If the battle is not in time-stop (battle_isTimeStop clear), it indexes
  the table off_80C9DD4 with oBattleObject_CurAction and tail-calls one of three handlers (sub_80C9DE0,
  sub_80C9E20, sub_80C9E88) via a bl-to-lr/bx-r1 dispatch. When time is stopped it instead calls object_presentCollisionData
  to just refresh collision state without advancing. One handler tail clears the object's collision region
  and stores 8 into field [r5,#8], resetting its collision timer/state.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'opens with bl object_removeCollisionData then bl object_spawnCollisionEffect: collision teardown
    + hit-effect spawn; bl battle_isTimeStop; bne loc_80C9DB8 skips the action dispatch when frozen; ldrb
    r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; bx r1 — jump table off_80C9DD4 with 3 action handlers;
    time-stop path calls object_presentCollisionData instead of the dispatch; handler tail calls object_clearCollisionRegion
    and stores 8 to [r5,#8]'
