    in the time-stop branch (loc_80C9DB8) after `bne`, and the action-dispatch runs in the fall-through
    (time not stopped). The action table indexes oBattleObject_CurAction at [r5,oBattleObject_CurAction]
    with three +1 (THUMB-bit) entries dispatching sub_80C9DE0/9E20/9E88. The object_clearCollisionRegion
