name: BGScrollCB_BG3FastLeftScroll
address: '0x08001A6A'
kind: function
status: confirmed
summary: Background scroll callback that scrolls the BG3 layer steadily to the left, decrementing a shared scroll
  counter by 8 each frame.
interface: void BGScrollCB_BG3FastLeftScroll(u32 toolkit /* r10 */); // returns via lr; clobbers r1, r2 and flags
details: 'One of the BGScrollCB callbacks (probably registered as a per-frame toolkit/render callback, hence the
  toolkit pointer arriving in r10). It reads the shared scroll counter at eBGScrollCBCounters.Counter0, subtracts
  8 (a fixed-point scroll amount, e.g. 8/16 = 0.5 pixel per frame of leftward motion), and stores the updated value
  back. It then takes counter >> 4 (the integer pixel part, top 16 bits of the 20.12-style fixed point) and writes
  it as a halfword into RenderInfo.Unk_18, the BG3 horizontal scroll field, via the RenderInfo pointer held in the
  toolkit struct (oToolkit_RenderInfoPtr). Net effect: BG3 scrolls left half a pixel per frame, i.e. a "fast" leftward
  parallax. No other state is touched.

  '
