name: sub_800A954
address: '0x0800A954'
kind: function
status: hypothesis
summary: Runs the same per-buffer routine (sub_800A964) over two adjacent work areas at byte_20349C0 and byte_2034A10,
  likely stepping two sprite/object state buffers each frame.
interface: void sub_800A954(void); /* r2, r3, r4 pass through untouched; r0/r1/lr clobbered, flags clobbered */
details: Trivial wrapper that tail-sequences two calls to sub_800A964, first with r0 = byte_20349C0, then r0 = byte_2034A10.
  The two buffers sit 0x50 bytes apart in IWRAM, so they are likely two instances of the same fixed-size struct
  (0x50 bytes) — plausibly sprite/NPC animation or object-work slots. r2, r3 and r4 are neither read nor written
  here; the contract shows them passing through to sub_800A964 and back to its callers, meaning this wrapper is
  transparent to those registers (they presumably carry loop/context state of an outer caller into the worker).
  Flags are clobbered. Nothing else is touched by this function itself; all real behavior lives in sub_800A964,
  which was not analyzed here, so the game-level meaning of the buffers is inferred only from their size and adjacency.
