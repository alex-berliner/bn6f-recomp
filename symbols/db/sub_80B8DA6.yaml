name: sub_80B8DA6
address: '0x080B8DA6'
kind: function
status: confirmed
summary: Syncs a secondary object (in r5) to its related primary object's position and sprite state, then either
  updates the sprite or queues it for destruction.
interface: "void syncRelatedObjectVisualState_80B8DA6(void);\n    // r5 in/out: secondary battle object\n    //\
  \ r10 in: caller-saved context (battle scene globals)\n    // lr in: return address\n    // preserves: r4, r5,\
  \ r7\n"
details: "Treats r5 as a battle object that mirrors a \"related\" object stored at\noBattleObject_RelatedObject1Ptr\
  \ (loaded into r4). Copies the 12-byte\nposition block at +0x34 from r4 into r5, then layers per-frame motion\
  \ on\ntop: XVelocity (+oBattleObject_XVelocity) added to X, ZVelocity\n(+oBattleObject_ZVelocity) added to Z,\
  \ and (s8)+0xC sign-extended << 16\nsubtracted from both Y and Z (this byte is the height/scale delta used by\n\
  sprite mirroring logic).\n\nThen mirrors a small set of visual attributes from related to self, in this\norder:\
  \ color shader, final palette, alpha (with related's mosaic scaling\nparameters), flip. Flag bit 1 from r4's header\
  \ is propagated into r5's\nheader (bit 1 is first cleared on self to make the copy clean).\n\nAfter mirroring,\
  \ branches on oBattleObject_ExtraVars[0]:\n  - if 0: clear flag bit 1 on self and write CUR_STATE_DESTROY into\n\
  \    oBattleObject_CurStateActionPhaseAndPhaseInitialized, then return.\n  - else: skip object_updateSprite when\
  \ oBattleObject_Param3 is non-zero\n    OR battle_isTimeStop() is true; also skip when battle_isPaused() is\n\
  \    true. Only when none of those guard conditions hold is object_updateSprite\n    called. Note: the time-stop\
  \ check is gated behind Param3==0, so a non-zero\n    Param3 short-circuits directly into the paused check.\n\n\
  Quirks:\n  - The \"preserve r7\" claim in the contract comes from the surrounding\n    state machine; the function\
  \ itself only pushes {r4,lr}, so r7 is\n    preserved by virtue of not being touched.\n  - oBattleObject_CurStateActionPhaseAndPhaseInitialized\
  \ is written only on\n    the destroy branch.\n  - Returns via pop {r4,pc}, so the link register is consumed as\
  \ the\n    return path.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
