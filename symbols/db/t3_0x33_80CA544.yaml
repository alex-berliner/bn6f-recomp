name: t3_0x33_80CA544
address: '0x080CA544'
kind: function
status: confirmed
summary: Dispatches a battle object's current state through a 3-entry jump table (init/step/destroy), then calls
  object_updateSprite.
interface: void t3_0x33_80CA544(u32 r4, u32 r5 /*battle obj*/, u32 r7, u32 r8, u32 r10) -> r5 r8 r9 r10 r11 r12
  (NZCV clobbered, all guest regs pass through to state handlers)
details: 'Reads the byte at r5 + oBattleObject_CurState, uses it as a direct 4-byte

  stride index into a 3-entry table at off_80CA55C, and tail-calls (via bx via

  lr/mov trick) the selected handler. The table contains sub_80CA568,

  sub_80CA61A, object_genericDestroy — i.e. setup, update/think, destroy

  states. Falls through to bl object_updateSprite afterwards. Return is

  performed with `pop {pc}` instead of the usual `pop {r4-r7, pc}`, so the

  state handlers are expected to clobber most guest registers; r5 r8 r9 r10

  r11 r12 reach the caller as the live values left by object_updateSprite

  (r4 r6 r7 are trashed by it per register contract).

  Subsystem: battle object state machine.

  '
