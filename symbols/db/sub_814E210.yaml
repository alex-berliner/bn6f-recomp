name: sub_814E210
address: '0x0814E210'
kind: function
status: hypothesis
summary: Thin wrapper that calls sub_814E0D0 and stores the byte result it leaves in r3 at [r1+0x1B].
interface: 'void sub_814E210(...); // tail-style: preserves LR in r12, calls sub_814E0D0(r0,r1,...), then writes
  the callee''s r3 byte to *(u8*)(r1+0x1B); all other registers and flags pass through from the callee'
details: Three-instruction wrapper. It saves the original return address into r12, branches to sub_814E0D0 (so the
  callee sees the caller's r0/r1 and other registers unchanged), and on return stores the low byte of r3 (a value
  produced by sub_814E0D0) at offset 0x1B of the structure whose pointer is in r1. It then returns with bx r12,
  so the caller sees the callee's return values and flags as if it had called sub_814E0D0 directly, plus the side
  effect of the byte store. Without knowing what sub_814E0D0 computes (it was not analyzed here), the game meaning
  of the byte written to +0x1B is unknown; the pattern suggests a state/flag byte being recorded into a struct after
  some check or update performed by the callee.
