name: npc_stepTowardTargetPos
address: '0x080A85B4'
kind: function
status: probable
summary: Moves an overworld NPC's fixed-point X/Y one step toward target coordinates read from r6, clamping
  to avoid overshoot, and writes a moved-flag to [r6+0xC].
interface: (void; r5/r6 = actor & control structs set up by callees) -> r0 = clobbered; stores updated
  X at [r5+0xC], Y at [r5+0x10], and moved-flag at [r6+0xC]
details: First calls sub_80A8548 and sub_80A8580; the latter's return value in r0 is used as the per-frame
  step size (speed). It then treats [r5+0xC] (X) and [r5+0x10] (Y) as <<16 fixed-point coordinates, comparing
  each against integer targets read from [r6+0x1A] and [r6+0x1C] (shifted left 16 for the comparison).
  For each axis it advances the coordinate toward the target by the step, clamping so it cannot overshoot
  (no update if the remaining distance is less than the step). If either axis moved, r4 is set to 1 and
  stored into [r6+0xC], apparently an 'actor still moving / position changed' flag; it is cleared to 0
  at entry each frame. The caller npc_updateGuarded runs this as the per-frame movement for an NPC whose
  special action only fires when no cutscene/chatbox/PET lock is active, consistent with a free-roaming
  overworld NPC walking toward a destination.
evidence:
