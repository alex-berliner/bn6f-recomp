  date: '2026-10-18'
  detail: 'cmp r0,r1 with r1 = ldrh [r6+0x1A]<<16: fixed-point current X vs integer target X (0x080A85CB-85D4);
    add/sub r0 by r2 guarded by cmp r3,r2 / blt: step toward target without overshoot on both axes; mov
    r4,#1 ... str r4,[r6+0xC] only when a coordinate changed: per-frame ''moved/still-moving'' flag; step
    value comes from callee sub_80A8580''s return in r0 (mov r2,r0); only caller is npc_updateGuarded,
    an overworld NPC per-frame update gated on no cutscene/chatbox/PET lock'
