summary: Zero-fills a 0x3C0-byte buffer at the address given in r0 using the eight-word block fill helper.
interface: void sub_811FE34(void* buffer /*r0*/); // r2, r3 passed through untouched; returns with r1 = 0x3C0, clobbers
  nz/c flags
details: 'A trivial wrapper: loads 0x3C0 (960) into r1 and tail-calls ZeroFillByEightWords with r0 as the destination,
  clearing 960 bytes of some buffer. r0, r2 and r3 are preserved through the call, so callers can rely on their
  buffer pointer and side arguments surviving. On return r1 still holds the size constant, and the flags are set
  by the last fill iteration. The 0x3C0 size and the caller-passed base address suggest a fixed-size scratch or
  work buffer (e.g. a battle-area screen/effect buffer), but the symbol database has no caller naming to pin which
  subsystem owns it. Only one call site of the fill helper is inlined here; the adjacent literal pool also holds
  0x3C, likely used by a nearby sibling routine.

  '
