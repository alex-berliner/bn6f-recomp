    r0,#0xc; strh r0,[r7,#oAIAttackVars_HitElement]''; ChargeCycles lsr #3 + bcs gates the highlight to
    every 8th frame; bl object_getFrontDirection then object_highlightPanelRegion(r0=x+dir, r1=PanelY,
    r2=4, r3=(DirectionFlip<<8)|Alliance); route ''battlesweep'' and callee object_getFrontDirection show
    this is an enemy AI battle attack telegraph'
