name: ai_chargeHighlightPanels
address: '0x080F4DF8'
kind: function
status: probable
summary: 'Per-frame AI attack charge: initializes the attack (element 4, anim 0xF, timer from AttackBoost2),
  then while charging highlights the panel region in front of the object every 8 frames and sets HitElement=0xC
  when the charge timer expires.'
interface: (r5 = battle object ptr, r7 = oAIAttackVars struct) -> r0 = undefined; updates oAIAttackVars
  fields and draws panel highlight
details: 'On the first call (AttackElement==0) it starts the attack: writes element 4 into oAIAttackVars_AttackElement,
  sets the object''s current animation to 0xF, loads the charge duration from oAIAttackVars_AttackBoost2
  into StepTimer, and zeroes ChargeCycles. On subsequent frames it decrements StepTimer; when it reaches
  0 it writes 0xC into oAIAttackVars_HitElement and stops. While the timer is still counting, ChargeCycles
  is incremented and every 8th cycle (carry out of lsr #3) it calls object_getFrontDirection and object_highlightPanelRegion
  with x=PanelX+frontDir, y=PanelY, count 4, and r3 = (DirectionFlip<<8)|Alliance, i.e. a periodic flashing
  highlight of the panels about to be hit. r7 is the AI attack-variable struct and r5 the oBattleObject;
  callers must supply both.'
