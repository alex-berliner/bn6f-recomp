name: battle_objectStepByPhase
address: '0x080CD144'
kind: function
status: probable
summary: Dispatches battle-object processing according to the object's current phase.
interface: (r0 = implicit r5 battle object) -> r0 = selected handler's return value; flags = handler-dependent
details: Selects an entry from a two-item jump table using the battle object's CurPhase byte, then tail-branches
  to the selected Thumb handler. The available phase targets are battle_objectStepVariant and battle_waitTimer2EndPhase.
  The function preserves lr before dispatch and does not normalize the callee's return or flags.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 0x080CD144 reads [r5 + oBattleObject_CurPhase] and indexes off_80CD158.; 0x080CD158 maps phase
    0 to battle_objectStepVariant and phase 1 to battle_waitTimer2EndPhase.; The mov lr, pc / bx r1 sequence
    is a tail dispatch to the selected phase handler.; The recorded execution route is chips, and r5 holds
    the battle object in this battle-object context.
