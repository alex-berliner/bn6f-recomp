name: battle_aiAttackInit
address: '0x080FB028'
kind: function
status: probable
summary: 'Initializes an AI attack: loads difficulty tier, sets phase flags, configures attack duration/timer/sub-step
  fields, installs the panel-choose callback, targets the opposing player via XOR''d alliance, and starts
  the attack with object_setAttack0(0xc).'
interface: (r0 = attack AI data ptr, r5 = attacker object, r7 = oAIAttackVars state) -> r0 = 0 (from object_setAttack0);
  no flags expected
details: Reads the enemy AI difficulty byte via battle_getAiDifficultyTier_800FE36 into oAIAttackVars_AiDifficultyTier,
  then writes 0x10 to InitFlag (a state-machine phase marker). Calls sub_80FB062(2) to configure something
  (likely an attack mode/step), then fills AttackDuration from sub_80FAF7C and AttackBoost2/TimerOrCycles/SubStepIndex
  from sub_80FAF44. Installs sub_80FB812 as PanelChooseCallback — the routine that picks panels while
  the attack runs. Flips the attacker's Alliance bit and calls battle_findPlayer to store the enemy player
  object in TargetObjectPtr, then calls object_setAttack0 with 0xc to begin the attack phase.
