name: sub_81196F0
address: '0x081196F0'
kind: function
previous_names: []
status: hypothesis
summary: Compares the chip-panel submenu's current chip fields (+0xC/E/18) against the previous render and re-renders
  the chip image/text only on change, otherwise writes a "frame" stamp at +0x9.
interface: (r0 = caller's tail-call frame setup word, low bit = selector; r5 = active submenu ptr from r10 toolkit;
  r10 = Toolkit*) -> void ; no value returned to callers (only caller-saved r4–r9 clobbered, lr popped as pc).
details: "- Entry contract takes the flags.nz set by the tail-call from 0x081196D0 (`sub_81196D0`) which selects\
  \ the \"new chip chosen\" branch (`beq loc_811970A`).\n  - First calls `sub_8119880`, whose description says it\
  \ compares the two submenu status bytes (+0xE and +0xF) and returns Z if equal. NZ means the two bytes differ\
  \ and re-rendering is required.\n  - When NZ (mismatch): invokes `chipPanel_renderChipGfxAndText_8119438` to redraw,\
  \ then commits three fields into the \"last rendered\" shadow region: copies +0xE (current selected chip id, u16)\
  \ to +0x10, +0xC (chip slot index, u8) to +0xD, and +0x18 (chip code, u16) to +0x1A — i.e. stores the just-rendered\
  \ values as the new comparison baseline.\n  - When Z (no change from last frame): loads the shadowed previous-chip\
  \ fields into r3/r4/r1 (chip id, slot idx, chip code), compares against the current +0xE/+0xC/+0x18; if any differ\
  \ (bne at 0x8119722), commit the same three stores and additionally write 4 at +0x9 (the submenu \"needs redraw\"\
  \ / counter byte at `oSubMenu+9`). If equal, returns immediately.\n  - The +0x9 = 4 write is the only oddity in\
  \ the steady-state path — looks like a \"frame id\" stamp used by something downstream; the captured-call exits\
  \ (r0 = 4 vs 0xFF) suggest one caller cares about +0x9 via byte at the end (`b locret_811972C` falls through,\
  \ but the +0x4 is set only via `strb r0, [r5,#9]`).\n  - The lr-pop-as-pc tail-call return suggests this is never\
  \ called from a `bl` expecting a return value — more like a \"step\" function possibly inlined in a jumptable.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- callee `chipPanel_renderChipGfxAndText_8119438` is only reached when `sub_8119880` returns NZ, consistent
    with "only re-render on change" semantics. - Assembly mirrors `+0xE -> +0x10`, `+0xC -> +0xD`, `+0x18 -> +0x1a`
    at 0x8119716–0x811971E (strh/strb/strh) followed by `b locret_811972C` — these are the "snapshot the just-rendered
    state" stores. - Steady-state path at loc_811970A reads the snapshot back (ldrh r4,[r5,#0xe]; ldrb r6,[r5,#0xc];
    ldrh r3,[r5,#0x18]; ldrh r1,[r5,#0x1a]) and `cmp`s each against the current equivalent. - `beq locret_811972C`
    after the three cmp''s means return-without-write when nothing changed. - The `mov r0, #4; strb r0, [r5,#9]`
    at 0x8119728 is the only writer of submenu byte +9 in this function. - Captured-call exit r0 values (4 on story2_0;
    0xFF on story2_1..13) match the two branches'' loose tail-call behavior — though r0 is set inside the chip-render
    callee, not here; the MayWrite flags on r0 here are due to the `bl` rather than a local mov. The 4-exit case
    (story2_0) is the special one.'
