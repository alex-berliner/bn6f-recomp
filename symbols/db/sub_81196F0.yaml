name: sub_81196F0
address: '0x081196F0'
kind: function
status: hypothesis
summary: Battle-object state sync/rollback stub — copies primary HP/ID/position fields to their backups, or rolls
  the backup forward to current values when the gate (sub_8119880) flags them stale, marking state=4.
interface: void sub_81196F0(u32 *battleObj /* r5 */) -> preserves r4-r9, returns current pos in r0 and sub_8119438's
  flags; clobbers r0-r3, r12, lr.
details: "Acts on a battle-object struct at *r5 with fields:\n  +0x09 state byte (set to 4 when backup is stale\
  \ and rewritten)\n  +0x0C current unit ID (byte)\n  +0x0D backup unit ID (byte)\n  +0x0E current HP (u16)\n  +0x10\
  \ backup HP (u16)\n  +0x18 current position (u16)\n  +0x1A backup position (u16)\nTwo paths:\n  • sub_8119880\
  \ returns Z=0 (gate pass): runs sub_8119438 (frame tick), then unconditionally\n    mirrors 0x0E→0x10, 0x0C→0x0D,\
  \ 0x18→0x1A and returns the current position in r0.\n  • sub_8119880 returns Z=1 (gate fail): compares current\
  \ HP/ID/pos against their\n    backups; on any mismatch, copies current→backup and writes state=4. If all three\n\
  \    match, returns the backup ID in r0 with Z=1 preserved.\nFlag handling is the read non-obvious point: the\
  \ gate-fail path uses local CMPs to\nbuild its own Z sequence (pos→hp→id), so the final Z reflects the ID comparison\n\
  (or the most recent mismatching CMP). CPSR survives the ldrh/strh/ldrb/strb copies in\nboth paths. Pushes r4-r7,lr;\
  \ preserves r4-r9."
