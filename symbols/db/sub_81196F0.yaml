open_questions:
- Whether r5 in this frame is the SubMenu* ptr or something else (toolkit r10 -> oSubMenu = +0x34 ptr, then r5 set
  previously in the caller's tail-call prologue). Without seeing the 0x081196D0 prologue, the exact semantic of
  r5 offset semantics is inferred only from "+0x9 and +0xC" appearing in `sub_menu_struct` and `chipPanel_renderChipGfxAndText`.
- The meaning of byte +0x9 == 4 written only when previous-vs-current fields differ is unknown.
