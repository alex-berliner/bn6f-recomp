name: ai_attackStepMoveToTarget
address: '0x08100A5C'
kind: function
status: probable
summary: AI attack step that on first call picks a panel for the object to move to (via PanelChooseCallback
  with constants 0x10 and 0xF880080), reserves both panels, locks it into CANNOT_SLIDE and anim 4, and
  arms a 2-tick wind-up; once the timer expires it writes HitElement=4 so the strike resolves. Failure
  to move exits the attack state.
interface: (r7 = AI attack vars context, r5 = battle object; r0 scratch) -> r0 = status/0; updates oAIAttackVars_*
  fields and object flags
details: 'If oAIAttackVars_AttackElement is 0 it begins the attack: sets AttackElement=4, calls object_canMove,
  then loads the two constants at off_8100AC0 (0x10 and 0xF880080) as extra args and calls the object''s
  PanelChooseCallback with TargetObjectPtr to pick a destination panel; the callback returns x/y in r0/r1.
  On success it stores TargetPanelX/Y, calls object_reservePanel on the chosen panel, copies the object''s
  current PanelX/Y into FuturePanelX/Y and reserves its own panel, sets OBJECT_FLAGS_CANNOT_SLIDE via
  object_setFlag1, switches the object to anim 4, sets HasMoved=1 and StepTimer=2. If it cannot move or
  the callback returns 0, it sets HasMoved=0 and calls object_exitAttackState. On later invocations (AttackElement
  already 4) it simply decrements StepTimer and, when it reaches 0, writes HitElement=4 so the strike
  resolves with that element.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/beq branches between begin-attack and wind-up-timer
    paths; ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; mov lr,pc; bx r1 — callback with TargetObjectPtr
    returns panel x/y stored into TargetPanelX/Y; bl object_reservePanel twice plus strb PanelX/Y->FuturePanelX/Y
    and OBJECT_FLAGS_CANNOT_SLIDE shows the move-onto-panel behavior; mov r0,#4; strb r0,[r5,#oBattleObject_CurAnim]
    and StepTimer=2 with HitElement=4 on expiry matches a 2-frame wind-up strike; loclf path sets HasMoved=0
    and calls object_exitAttackState on failure, consistent with the other AI attack-step handlers
  refs:
  - bn6f/asm/asm31.s:155603
  - 0x0800E5E2 object_canMove
  - 0x0801BB1C object_reservePanel
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x08100A5C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and overall flow match the code: AttackElement is checked (tst/ldrb), set to 4 on first
    entry, object_canMove is called, then the PanelChooseCallback is invoked with the two constants 0x10
    and 0xF880080 from off_8100AC0, and on success the chosen panel is reserved, the object''s current
    panel is reserved as its future panel, OBJECT_FLAGS_CANNOT_SLIDE is set via object_setFlag1, anim
    4 is selected, HasMoved=1 and StepTimer=2 are set; failure jumps to 0x8100AB6 which clears HasMoved
    and calls object_exitAttackState. On later entries StepTimer is decremented and HitElement is set
    to 4 when it hits zero. However the proposed name ''ai_attackStepStrikeTarget'' is misleading since
    the function does not strike the target itself—it merely sets up the movement and winds up; the actual
    strike happens elsewhere when HitElement=4 is observed. A name like ''ai_attackStepMoveToTarget''
    better reflects that this step is about choosing and reserving a destination panel.; run wf investigate
    investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
