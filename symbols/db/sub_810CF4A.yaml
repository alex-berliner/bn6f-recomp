details: "Sub-step that sits inside the AI chip-use path (called from sub_810CE1A, the parent AI chip\n  selector).\
  \ It first calls battle_getSelectedChipForUse_800ED90 to obtain the chip id the\n  object has committed to; the\
  \ result lands in r0/r1. It then reads oBattleState_Unk_40 via\n  battle_getStateUnk40_800A704 to gate a branch,\
  \ and if non-zero writes chip parameters through\n  somethingWriteChipParams_80126E4 (passing the actor's BattleObject\
  \ in r5 plus the chip param\n  struct in r7). It then calls object_setAttack0 to put the actor into the Attack0\
  \ chip-use\n  state, and finally calls sub_800F322 (which seems to advance the AI/attack update). Preserves\n\
  \  r4/r5/r6/r7 across the call so that the surrounding AI state machine can continue iterating.\ndetails: |\n\
  \  Cannot summarise confidently without assembly; the \"step list\" above is inferred from callee\n  identities\
  \ and contract (in={r4,r5,r7,r10,lr}, out={r0,r1,r4-r7}).\n"
