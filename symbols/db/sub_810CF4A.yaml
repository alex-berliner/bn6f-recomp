  \ with this function, so this is\n  almost certainly the inner per-actor step it calls once a chip is queued.\n\
  \n  The callees suggest the following skeleton:\n    1. r0 = battle_getSelectedChipForUse_800ED90(r5 = actor,\
  \ ...) -- fetches the chip id\n       (or possibly the chip-pointer-pair) the actor intends to use, resolving\
  \ hand/field\n       selection.\n    2. The result is fed into somethingWriteChipParams_80126E4(...) to materialise\
  \ the\n       chip's parameters on the BattleObject's AttackVars / AIData.AttackVars region\n       (offsets seen\
  \ in BattleObject+AIData.AttackVars at 0xa0..0xf0 and AIAttackVars at\n       +0x00..0x50).\n    3. object_setAttack0(r0\
  \ = chipParamStruct, r5 = actor) is called to actually start\n       attack-0 on the object.\n    4. battle_getStateUnk40_800A704\
  \ reads BattleState+0x40 (oBattleState_Unk_40) into r0,\n       probably as a guard or to pick a parameter (e.g.\
  \ main/sub attack slot).\n    5. sub_800F322 is called with r5; it has no in-contract apart from r5 and writes\
  \ r0\n       and NZCV -- looks like a small finalisation step.\n\n  In/out contract says r0 and r1 are caller-visible\
  \ on return and flags NZCV are live,\n  which is consistent with a \"did the chip setup succeed / was there a\
  \ chip\" bool.\n\n  Likely effect: given a BattleObject whose AI has already chosen a chip, look up the\n  chip\
  \ parameters and set the object's attack-0 to that chip, returning a status flag.\n"
