name: sub_810CF4A
address: '0x0810CF4A'
kind: function
previous_names: []
status: hypothesis
summary: Stages a chip-use from the AI's currently selected chip by filling attack vars and writing params.
interface: (r5 = AIDataPtr) -> r0 = ?, r1 = ? ; mutates AIData, attack vars, and the battle object's chip params
details: "Operates on the AI's AIData pointer carried in r5 (r4/r7/r10 hold the surrounding battle context, with\n\
  \  the toolkit/BattleState in r10). Calls battle_getSelectedChipForUse_800ED90 (via r0) to fetch the chip\n  the\
  \ AI will use; battle_getStateUnk40_800A704 pulls an Unk_40 from the current BattleState used as\n  param data;\
  \ somethingWriteChipParams_80126E4 pushes per-chip parameters onto the BattleObject;\n  object_setAttack0 forces\
  \ the actor's CurAnim/CurAnimCopy (oBattleObject+0x10/0x11) to 0; and\n  sub_800F322 queues the chip use on the\
  \ AI side (AttackVars at oAIData+0xa0). The two scratch regs\n  r0/r1 returned to the caller carry the params\
  \ pointer and the chip use result for the AI tick. As\n  the assembly itself is missing from this build, the role\
  \ is reconstructed from the callee set and\n  the caller's contract (which keeps r4/r5/r7/r10/lr over the call).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- All four callees plus the caller sub_810CE1A share r4/r5/r7/r10/lr, identifying this as AI tick glue.
    - battle_getSelectedChipForUse_800ED90 is the per-actor "chip I want to use this turn" resolver. - object_setAttack0
    zeroes the CurAnim/CurAnimCopy fields of oBattleObject, the standard "init attack" hook. - somethingWriteChipParams_80126E4
    takes the chip id and the param word to write into chip param buffers. - sub_800F322 only consumes r5 (the AIDataPtr)
    and writes back into AttackVars — consistent with queuing. - battle_getStateUnk40_800A704 returns BattleState+0x40
    used as the param source word.'
