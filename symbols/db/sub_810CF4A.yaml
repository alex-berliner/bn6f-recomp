summary: AI handler that selects a battle object's chip and writes the resulting attack parameters to its AIData
interface: '(r4 = AIDataPtr, r5 = BattleObjectPtr, r7 = ?, r10 = ToolkitPtr, lr = ret) -> r0 = chip descriptor ptr,
  r1 = flags/status; side effects: writes AIAttackVars via somethingWriteChipParams_80126E4, may set OBJECT_FLAGS_2_DO_UPDATE_COLLISION_PANELS
  via object_setAttack0, writes chip-related AIData fields, calls sub_800F322 (likely block0/chip-use reset)'
details: "- Entry contract takes AIData in r4 (per the AIData pointer pattern used across the AI subsystem) and\
  \ BattleObject in r5; r10 is Toolkit (always, per project convention).\n  - First callee battle_getSelectedChipForUse_800ED90\
  \ looks up the chip the actor intends to use (chip ID, element, etc.); its return in r0 is the chip descriptor\
  \ the rest of the function operates on.\n  - Next, battle_getStateUnk40_800A704 reads oBattleState_Unk_40 (a battle-state\
  \ field) into r0, then this is used to gate the body (likely only chip-using navis run this AI pass).\n  - object_setAttack0\
  \ takes r0 (chip descriptor) and r5 (BattleObject) and toggles a flag on the object — most likely setting OBJECT_FLAGS_2_DO_UPDATE_COLLISION_PANELS\
  \ so the new attack's hitbox is taken into account this frame.\n  - somethingWriteChipParams_80126E4 (contract:\
  \ r0 = chip descriptor, r5 = BattleObject, r7 = ?, r10 = Toolkit; writes AIAttackVars at oAIData+0xa0) populates\
  \ the AIData attack-vars block (Damage, AttackBoost, element breakdown, etc.) from the chip descriptor and the\
  \ target's collision info.\n  - sub_800F322 (in=r5, may_write r0) runs on the BattleObject afterwards — by elimination\
  \ (no other write is called after the chip-params write) this likely finalizes the chip-use state (e.g. clearing\
  \ chip lockout / chip-used flag, akin to block0_idle-0800F2F0's wrapper).\n  - Out=r0/r1 suggests callers read\
  \ the chip descriptor and a small flags/status word afterwards (e.g. to decide on hit-effect selection or to fall\
  \ through if no chip is usable).\n"
