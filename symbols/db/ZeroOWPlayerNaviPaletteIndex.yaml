name: ZeroOWPlayerNaviPaletteIndex
address: '0x0809E2FC'
kind: function
status: confirmed
summary: Zeroes the overworld player Navi's palette-index byte (0x2000AA5), resetting the player's color palette
  to the default.
interface: 'ZeroOWPlayerNaviPaletteIndex(void) -> r3: pointer to eStruct2000aa0 (also leaves r0 = 0)'
details: 'Entry point that stores 0 into the byte at 0x2000AA5, the OWPlayerNaviPaletteIndex field (offset +5) of
  the eStruct2000aa0 struct, which selects which palette variant of the player''s Navi sprite is used in the overworld.
  It is tail-merged with SetOWPlayerNaviPaletteIndex, which takes the palette index in r0 and stores it the same
  way; this entry point is the r0 = 0 case, reached by falling through. Side effects of the merge: r0 is left as
  0 and r3 is left pointing at eStruct2000aa0. Only the NZ flags are clobbered by the mov.

  '
