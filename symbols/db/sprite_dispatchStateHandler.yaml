name: sprite_dispatchStateHandler
address: '0x081172B0'
kind: function
status: probable
summary: Calls one of three sprite handlers selected by a state/type byte in the object struct at r5+8.
interface: (r5 = sprite/object struct) -> calls table[r5+8] handler; no direct return value
details: 'Loads a byte at [r5,#8] and indexes the three-entry table off_81172C4 (sub_81172D0, sprite_updateWrapper,
  sub_8117354), then tail-calls the selected Thumb function via mov lr,pc/bx. The struct pointer stays
  in r5, so the handlers operate on the same object. This is a state-machine dispatcher: r5+8 selects
  which per-state routine runs. With no known callers, nothing shows what sets r5+8 or what the states
  mean.'
