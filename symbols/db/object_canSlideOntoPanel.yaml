name: object_canSlideOntoPanel
address: '0x080D8C10'
kind: function
status: confirmed
summary: Returns whether an object is allowed to slide onto the panel it is facing, based on the panel's parameter
  flags.
interface: bool object_canSlideOntoPanel(u32 object, u32 panelOrParamArg); // r0,r1 in -> r0 out (1 = may slide,
  0 = may not)
details: "Wraps object_getPanelParameters(r0, r1), which returns a panel parameter\nbitmask in r0, and applies three\
  \ checks to decide if the object may slide\nonto that panel:\n  1. flags == 0 -> not slidable (no panel parameters\
  \ at all).\n  2. flags & 0x0F800000 -> not slidable; this bit group appears to mark\n     special/occupied panel\
  \ states (e.g. hole/broken/special attribute\n     bits) that block sliding.\n  3. !(flags & 0x10) -> not slidable;\
  \ bit 0x10 is the \"slidable\" flag of\n     the panel parameter word.\nOnly if all three pass does it return\
  \ 1. The routine itself is a pure\npredicate: it clobbers r1-r3 and flags but preserves nothing, and its\nresult\
  \ is just the flag test. The neighboring literal pool words\n(0x3800000, 0xC41, 0xE0F0300, 0x40000, 0xF800002,\
  \ ...) belong to other\nnearby functions, not to this one.\n"
