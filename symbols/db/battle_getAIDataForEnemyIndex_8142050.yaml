summary: Returns an AI data pointer for the given enemy slot using the toolkit/enemy-index lookup table.
interface: (r0 = enemyIndex) -> r0 = ptr (in r7, copied to r0 on exit); r10 = toolkit (preserved by callee-saved)
details: "- Saves r4-r6 and lr; computes r4 = enemyIndex*4.\n  - Calls sub_8142080 (battle_getEnemyIndexFromMapGroup_8142080)\
  \ with r10 (toolkit) and r0 in some role, getting back an index in r0.\n  - Loads base pointer off_8141B18\
  \ into r7, then loads r7 = [r7 + r0*4] (a table indexed by the previous lookup's result).\n  - Final\
  \ result in r7 = [r7 + r4] where r4 is the per-enemy slot offset (enemyIndex*4).\n  - Restores r4-r6\
  \ and returns the pointer via r0 (r7->r0 effectively via r7).\n  - Behavior: a two-stage indirection\
  \ for AI data: first by map group / category, then by enemy slot.\n"
