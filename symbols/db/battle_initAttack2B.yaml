name: battle_initAttack2B
address: '0x0802EBA8'
kind: function
status: probable
summary: Resets an entity's attack-state fields and queues attack 0x2B via object_setAttack0.
interface: (r0 = unused, r6 = battle entity/attack struct) -> r0 = 1; sets struct fields at r6+2..+0xC
  and attack id 0x2B
details: Stores 0 at r6+2, 3 at r6+3, and 0 at bytes r6+4 and r6+5, then zeroes halfwords r6+6, r6+8 and
  r6+0xA — likely clearing step/state, timers and counters for a fresh attack. Writes the constant 0x13C
  (316, plausibly a frame duration or charge count) to the word at r6+0xC. Calls object_setAttack0 with
  r0 = 0x2B, telling the battle object system to begin attack id 43 (attack0 phase). Always returns 1.
  Uses r6 as an implicit base pointer, so it is only valid when the caller has the entity in r6 (a Thumb
  caller-saved-register convention quirk).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strb/strh/str sequence at 0x0802EBA8–0x0802EBE0 zeroes fields +2..+0xA of the r6 struct before
    use; str r0,[r6,#0xC] with off_802EBCC literal 0x13C sets a 316-count word field; bl object_setAttack0
    with r0=#0x2B registers attack id 43 with the known object-attack routine; returns mov r0,#1, typical
    of battle object step functions reporting success/continue; callee object_setAttack0 places this in
    the battle object attack subsystem
