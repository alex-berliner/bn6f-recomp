name: object_getPanelsIgnoreColumnFiltered
address: '0x0800CFA6'
kind: function
status: confirmed
summary: Scan battle-panel grid (rows 1-3, cols 1-6) skipping the row matching the ignore parameter, packing each
  passing panel as (col | row<<4) into the output buffer; returns panel count.
interface: s32 object_getPanelsIgnoreColumnFiltered(u32 ignore_row /* r0 */, u32 param_a /* r2 */, u32 param_b /*
  r3 */, u8 *buf /* r7 */);
details: 'Iterates row=1..3 and col=1..6; when row matches the input ignore_row the inner loop is skipped via beq.
  For each (col,row) pair, it calls object_checkPanelParameters(col=r0,row=r1,param_a=r2,param_b=r3). The original
  asm does push {r0-r3} before the call and pop {r0-r3} after to preserve r2/r3 across iterations of the inner loop;
  r0 and r1 are then reloaded by the col++ / next row logic. When the callee returns non-zero, a packed panel byte
  is computed as `(u8)(col | (row<<4))` (via lsl r1,#4; orr r0,r1) and stored at buf+count (strb [r7,r6]); count
  (r6) is then incremented. After the loops, r0 receives the final count and r1 is set to 4 (used as the loop boundary
  value for outer callers). Only r4,r6,lr are pushed in the prologue; r2,r3,r4,r5,r6 are contract-preserved across
  the call. Flags NZ/C/V are clobbered.

  '
