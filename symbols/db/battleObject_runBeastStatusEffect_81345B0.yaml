name: battleObject_runBeastStatusEffect_81345B0
address: '0x081345B0'
kind: function
previous_names:
- sub_81345B0
status: probable
summary: Triggers a single beast/transform-style status effect update on the active battle object (id
  0xF3, param 0x16, 0x11) via battleObject_updateShieldOrStatusEffect_813468C
interface: '(r10 = Toolkit) -> void ; side effect: dispatches a status-effect step through the shield/status
  helper'
details: "This is a thin dispatcher. It loads four constants into r0-r3, a base pointer in r4\n  (= byte_81331EC,\
  \ the EWRAM state byte used by several nearby battle objects), the\n  constant 0x10000000 in r6, then\
  \ calls battleObject_updateShieldOrStatusEffect_813468C\n  and returns. The constants 0xF3 / 0x16 /\
  \ 0x0 / 0x11 map to a status-effect id and\n  three parameters in the order consumed by the helper (mirroring\
  \ the patterns in\n  sibling wrapper stubs 81343E8/8134470/81344F8/8134574). The same lr (0x0813391d)\n\
  \  and r5/r10 entry shape as every other per-frame battle-object step in 0x08133xxx\n  (sub_8133434,\
  \ sub_8133788, sub_81338D4, sub_8133A68, sub_8133B18, sub_8133B74,\n  folderEdit_step_813388C, petNavi_perFrameUpdate_81339BC,\
  \ sub_8133944) confirm it is\n  a fixed one-line tail call invoked from the battle scene step. Out registers\
  \ r4-r7\n  are callee-saved and never observed live after return — pure void step.\n"
