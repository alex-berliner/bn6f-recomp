name: TestPETMenuDataFlag
address: '0x0811EBE0'
kind: function
status: confirmed
summary: Tests a bit in the PET menu flags byte (ePETMenuData+5) and sets NZ flags for the caller to branch on.
interface: bool pet_testMenuDataFlag(u32 mask /* r0 */); // result in Z/N flags; also returns r1=flags byte, r2=&ePETMenuData
details: Loads the flags byte at ePETMenuData+5 (labeled eFlags200DF25 in the 0x200df20 block), ANDs it with the
  mask in r0, and tails out with the Z/N flags set from the result so callers branch with BEQ/BNE. As side effects
  it leaves r1 = the whole flags byte and r2 = the ePETMenuData address. Uses TST+MOV pc,lr (tail jump), so it preserves
  no caller registers beyond what the contract lists. The flags byte presumably tracks PET menu/menu-data state
  such as unlocked menu options or data availability; which bit corresponds to which feature depends on the values
  callers pass in r0.
