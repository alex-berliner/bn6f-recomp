name: object_hopSidewaysAction
address: '0x080D60BC'
kind: function
status: probable
summary: Battle-object action handler that repeatedly hops the object sideways across panels (5 hops)
  before destroying it.
interface: (r5 = battle object, no args) -> mutates object fields (X, XVelocity, Timer, CurPhase, Param3,
  CurAction, Z16, collision region); r0 undefined
details: 'On phase 0 it sets phase 4, zeroes Z16, calls sub_80D61FC (likely a visual/animation setup),
  then calls sub_80D61D2 with r0 = byte selected by Alliance from dword_80D6160 (0x7, presumably 0x8 for
  the other alliance, i.e. direction/hop id) and r1 = a word picked by Param1 from byte_80D614C (0x00080000/0x90000/0xA0000/0xB0000,
  a speed/power table); the results are stored as XVelocity and Timer. Each frame it advances X by XVelocity,
  clears the collision region if a collision flag is set, recomputes PanelX/PanelY from coordinates, clears
  the region if the new panel is invalid, and sets collision region 1 when the PanelX changed. When Timer
  hits -1 it increments Param3: while Param3 < 5 it sets Z16 to -1, sets CurAction = 0xC and clears the
  phase (restarting the hop action), otherwise it clears the region and transitions to CUR_STATE_DESTROY.
  Net effect: a repeated horizontal hop move with collision tracking, ending in self-destruction.'
