name: pet_tickSceneAndReloadOnFade
address: '0x080057A0'
kind: function
status: probable
summary: Per-frame tick of the PET/menu scene state; once a screen fade is active it tears the scene down
  and hands control to the reload/main-jumptable mode 0x40.
interface: '(self: * GameState $r5) -> (); sets eMainJumptableIndex byte to 0x40 when tearing down'
details: 'Runs one frame of the current scene: the PET menu dispatcher, the scenario effect-state jumptable,
  per-type object dispatch, the full sprite/NPC/map-object draw-and-queue pipeline, and any armed event
  callback. It then checks IsScreenFadeActive; if no fade is active it just returns, but during a fade
  it unloads everything: clears chatbox, frees objects of type 0x21, wipes NPC state words, resets graphics
  and setup work areas, re-inits sprite fade gfx and effect state, zero-fills work, re-randomizes the
  extra toolkit pointers and reloads the current navi''s stat boosts. Finally it reads the GameState pointer
  from the toolkit, and stores 0x40 (byte) into the main jumptable index, presumably selecting the next
  (scene reload) mode. So this is the tick handler that keeps a scene alive until a fade-out triggers
  a full unload-and-transition.'
