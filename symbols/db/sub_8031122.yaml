summary: Zeroes two counter/flag words of the global state struct at dword_200F3E0 and then continues processing
  it via sub_80310EC.
interface: u32 resetStateAndStep_8031122(u32 stateObj /*r0*/, u32 arg /*r5, forwarded to callee*/); returns r0 =
  result of sub_80310EC
details: 'Saves the caller''s r0 (a state object pointer/handle) into r6, loads the base pointer from off_80311F0
  (global struct at 0x200F3E0), and stores 0 into offsets 0x18 and 0x1C of that struct (globals dword_200F3F8 and
  dword_200F3FC). These look like counters, timers, or progress flags that must be cleared before the next step
  of the state machine. It then calls sub_80310EC with r0 = the 0x200F3E0 struct base (the original r0 is kept in
  r6, so sub_80310EC can also reach the caller''s object) and r5 forwarded unchanged, and returns the callee''s
  r0 to its own caller. The whole thing reads like a "restart/advance this state" entry point; the actual role of
  the 0x200F3E0 struct (text engine, dialog, UI, etc.) is not identifiable from this fragment alone.

  '
