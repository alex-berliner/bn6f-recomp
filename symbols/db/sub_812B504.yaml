name: sub_812B504
address: '0x0812B504'
kind: function
status: confirmed
summary: If bit 4 (0x10) of the flag byte at [r5+0x1B] is set, calls the draw/render helper sub_811FAF4 with a fixed
  argument block; otherwise returns immediately.
interface: void sub_812B504(void* obj /*r5*/); clobbers r0-r3, preserved r4; flags on early-exit path come from
  tst of (byte & 0x10)
details: 'Tiny conditional wrapper. Loads the byte at r5+0x1B of the object passed in r5, tests it against 0x10,
  and only when that bit is set performs the call sub_811FAF4(0xC80008, 0x20004, 0, &dword_8129184, r4=0x80004000).
  All five arguments are compile-time constants held in a literal pool right after the function (0xC80008, 0x20004,
  0, pointer to data table dword_8129184, and 0x80004000), so this is a fixed "render/draw this one thing" invocation
  whose behavior is gated purely by the object''s bit-4 flag. r5+0x1B looks like a status/flag byte on an entity
  or effect object. r4 is pushed solely to survive the call (the callee is passed 0x80004000 in r4, an unusual extra
  argument, suggesting sub_811FAF4 takes a 5th parameter in r4). The caller-side contract lists r10 as an input,
  presumably because sub_811FAF4 reads it; this wrapper itself never touches r10 and passes it through untouched.

  '
