name: ai_checkActorNearbyOrTimeoutScript
address: '0x0810FE18'
kind: function
status: probable
summary: AI script step that scans the battlefield for any actor with a nonzero parameter near (0x60,0x5b,0x60);
  if found it sets script 8 to keep going, otherwise it times out after 3 ticks (or honors a one-shot
  flag) and switches to script 4 with ExtraVars=1.
interface: (r0 = collision region id, r5 = battle object ptr, r6 = AI state ptr) -> r0 = count/sum result
  from scan; sets [r5+0x66] counter, [r5+0x7d] flag, [r5+ExtraVars], [r6+scriptId]
details: 'First it stores collision region 1 into the object''s collision data via object_setCollisionRegion.
  It then calls FindBattleActorsWithNonzeroParam_ReturnCountAndSum with (0x60,0x5b,0x60), presumably an
  x/y/radius or panel search; if the returned count is nonzero it simply returns, leaving the AI to its
  current flow. When nothing is found, a one-shot flag at [r5+0x7d] short-circuits to the transition path
  (clear the flag, ExtraVars=1, scriptId=4). Otherwise a retry counter at [r5+0x66] is incremented: while
  it stays at or below 2 the function sets scriptId=8 (retry/keep waiting), and on the third failure it
  resets the counter, sets ExtraVars=1 and scriptId=4 (give up / advance). r5 and r6 are preserved caller-provided
  object/state pointers, consistent with an AI script opcode handler.'
