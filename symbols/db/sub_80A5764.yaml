name: sub_80A5764
address: '0x080A5764'
kind: function
status: confirmed
summary: Picks a "BBS" message id based on the current map group and the result of reqBBS(4)
interface: u32 sub_80A5764(struct GameState *gameState_in_r10) -> u32 messageId; clobbers r1,r2,r3,flags
details: 'Reads GameState->MapGroup (offset +4). When MapGroup == 0x85 (Beast+ gate-link area) the

  alternate 5-entry table at byte_80A579C is selected, otherwise the default table at

  byte_80A578C is used. Both tables are 5 little-endian 32-bit pairs where the low 16 bits

  hold an id and the high 16 bits hold a message number. Calls reqBBS_81409D0 with arg 4 to

  obtain an index 0..4, then returns the index-th 32-bit word of the chosen table. The

  function reads inputs via the global Toolkit pointer held in r10 (oToolkit_GameStatePtr).

  The two source tables share layout: entries {0,0C,0A,0B,0A} for the default map group and

  {0,08,06,07,06} for the Beast+ area, with high-word 0x20 and top bit 0x80 in pairs.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
