name: sub_81245D4
address: '0x081245D4'
kind: function
status: confirmed
summary: Handles interacting with a map object, running its chatbox script on normal maps or dispatching to a special
  per-type handler on maps with group >= 0x80.
interface: void mapObj_interactDispatch_81245D4(MapObj* obj /* r5 */, Toolkit* toolkit /* r10, r4/r10 pass-through
  */); tail-calls or returns to caller with r2 = selected handler address
details: 'Reads the current map group from gameState->MapGroup (via toolkit->GameStatePtr).

  For map groups < 0x80: sets obj->state (byte at +0x02) = 8 and calls

  chatbox_runScript201C100_812474C with r0 = 6 (script slot 6), then returns.

  For map groups >= 0x80 (special/undernet-style areas): looks up a selector byte

  in the table at unk_201C400 using obj->field14 (halfword at +0x14) * 2 as index;

  subtracts 0x80, scales by 4, and loads a handler pointer from off_812460C,

  then tail-jumps to it with lr = return address. Selector bytes 0x80 and 0x81

  both map to sub_8124624; 0x82 -> sub_8124660, 0x83 -> sub_812469C,

  0x84 -> sub_81246D8, 0x85 -> sub_812471C. Any other selector byte would load

  an out-of-table pointer, but presumably callers never produce those values.

  Passes the selector byte in r0 and (selector - 0x80) * 4 in r1 to the handler.

  r5 and r10 pass through unchanged to the dispatched handler; r2 ends up holding

  the handler address (r8/r9/r11/r12 also listed as outputs by the lifter, likely

  inherited from the tail-called handlers).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
