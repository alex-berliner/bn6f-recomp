  detail: '- `sub_809E3A2:` is 4 instructions: `ldr r3,off_809E430`; `ldrb r0,[r3,#0x8]`; `tst r0,r0`;
    `mov pc,lr` — purely a flag-setting leaf. - `off_809E430` resolves to `eStruct2000aa0`, the EWRAM
    state struct whose symbol `eStruct2000aa0` is used in nearby OW code. - The `S2000aa0` struct definition
    reserves offsets 0..0x1c; offset 0x8 is currently unnamed in the macro but is in-range. - Contract
    `in=[''lr'']` / `out=[''nz'']` and `may_write=[''nz'',''r0'',''r3'']` matches the `tst`/`mov pc,lr`
    shape exactly. - The four captured snapshots (snap_story2_0..13) enter with r0=0, r1=0xf0, r2=0x08040000,
    r3=0x50 (consistent OW player update inputs), and all return r0=0 with Z set — i.e. the predicate
    is false in those story2 frames.'
