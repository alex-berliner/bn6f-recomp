name: owMapObject_isHoveringElevator_0809E3A2
address: '0x0809E3A2'
kind: function
previous_names:
- sub_809E3A2
status: probable
summary: Returns NZ (Z=0) iff the byte at eStruct2000aa0+0x8 is non-zero (i.e. the overworld player Navi
  is currently in the elevator pose/animation).
interface: () -> r0 = byte at (eStruct2000aa0 + 0x8); flags Z set when byte == 0, NZ otherwise ; no side
  effects
details: "Leaf function (only reads via `tst r0,r0` and returns via `mov pc,lr`). Loads the address of\n\
  \  `eStruct2000aa0` from `off_809E430` into r3, then reads the single byte at offset 0x8\n  (`ldrb r0,[r3,#0x8]`),\
  \ and tests it. The `S2000aa0` struct (size 0x1c) holds the OW player\n  Navi display parameters: `OWPlayerNaviHorizontalCompress`\
  \ (0x0), `OWPlayerNaviVerticalCompress`\n  (0x1), `OWPlayerNaviRotation` (0x2), `Unk_03`, `Sprite_04`,\
  \ `OWPlayerNaviPaletteIndex` (0x5),\n  `OWPlayerNaviColorShader` (0x6), then padding until 0x1c. Offset\
  \ 0x8 falls inside an undefined\n  gap, but the four captured stories all pass identical entry state\
  \ and observe Z set at exit\n  (r0=0), implying the byte is read as 0 in those frames. Callers test\
  \ the Z result to gate\n  behaviour: `sub_809D348` and `sub_809D800` are large OW player state handlers\
  \ (in `ow_player.s`),\n  `sub_80A7C58` lives in the same player file, and `sub_8141F7C` is unrelated\
  \ but consumes the\n  same predicate.\n"
