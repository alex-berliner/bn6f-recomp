name: battle_updateNaviAIJoypad_8012DFC
address: '0x08012DFC'
kind: function
status: confirmed
summary: Advances one frame of virtual-joypad edge state for a player-controlled battle navi, including
  a frozen-input mirror used during TimeStop.
interface: void battle_updateNaviAIJoypad(u32 naviIndex /*r0*/) – reads AI data via battle_getPlayerAIData_8010022;
  leaves c,v set by last internal test/cmp; clobbers r0,lr; preserves r4,r5,r6
details: "Fetches the player-AI struct via battle_getPlayerAIData_8010022 (r4).\nIf battle_isBattleOver\
  \ returns non-zero the four joypad fields\n(oAIData_JoypadHeld/Released/Pressed/Up) are zeroed and the\
  \ function exits.\nReads navi stats byte 0x2C via GetBattleNaviStatsByte; values 0x17–0x18\nmean the\
  \ navi is in a \"no-input\" state (e.g. being deleted or mid-animation)\nso the function returns early\
  \ without touching joypad fields.\nRaw button bitmask for this navi is read from a per-navi table at\n\
  dword_2036820 (stride 8, offset +2 into each slot), indexed by r0 (r7).\nMain joypad is updated with\
  \ standard edge logic:\n  released ← old held\n  held     ← new raw\n  pressed  ← (~old held) & new\
  \ raw\n  up       ← (~new raw) & old held\nA secondary mirror at oAIData_Unk_2a/2c/2e/30 holds a duplicate\n\
  held/pressed/up chain.  When battle_isTimeStop returns zero (time-stop\ninactive) the mirror is zeroed;\
  \ when non-zero the mirror is advanced with\nthe same edge logic so that inputs frozen during a TimeStop\
  \ effect still\nregister single-shot edges on the first frame after the effect ends.\nThe function does\
  \ not write r5 in the disassembly; the register contract\nlists it as an output read-back from callees\
  \ (r5 is caller-saved in the\nABI but the lifter observed callers reading it post-call)."
