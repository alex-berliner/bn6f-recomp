name: ai_beastSpAtkInit
address: '0x08011E1C'
kind: function
status: confirmed
summary: AI-script handler that initialises the Beast-Out special attack of an enemy AI, resetting its charge bookkeeping
  and computing base damage.
interface: void ai_beastSpAtkInit(r5 basePower, r7 aiAttackVars, r10 helperInput); returns r0 = next script opcode
  (0x52), r5 = value left by battle_beastPwrAtk_addScaledBase_8012642; flags clobbered
details: 'One opcode of the enemy AI scripting VM. r7 points at the AI''s attack-vars structure (oAIAttackVars_*
  fields). The handler clears the charge-ready flag, the chip-use delay and the attack boost (all zeroed), stores
  a fixed extra-damage seed of 0x9E into oAIAttackVars_ExtraDamage, then calls battle_beastPwrAtk_addScaledBase_8012642
  with r0=0x32 (50) and r1=0xA (10) plus the incoming base power in r5 (the helper also consumes r10 on its own)
  to scale the attack off the AI''s power, and stores the result into oAIAttackVars_Damage. Finally it writes 0
  to oAIAttackVars_InitFlag (marking the attack state as initialised) and sets oAIAttackVars_ChargeCycles to 2,
  then returns the next script opcode 0x52 in r0. r4/r6 are preserved; r5 out is whatever the damage helper left,
  not the incoming value.

  '
