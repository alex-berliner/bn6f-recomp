name: ai_beastSpAtkInit
address: '0x08011E1C'
kind: function
status: probable
summary: 'Initializes the AI attack-vars block for the Beast-SP charged attack: clears its state, sets
  damage from the beast-power formula, and returns a cycle/timer value.'
interface: (no args; entity AI struct in r7) -> r0 = 0x52 (value stored by caller, likely a countdown/interval);
  sets InitFlag=0, ChargeCycles=2, ChargeReadyFlag=0, ChipUseDelay=0, AttackBoost=0, ExtraDamage=0x9E,
  Damage=scaled base
details: Zeros the charge-ready flag, chip-use delay and attack boost, writes fixed ExtraDamage 0x9E (158),
  then calls battle_beastPwrAtk_addScaledBase_8012642 with base 0x32 (50) and multiplier argument 0xA;
  the returned (base*mult, mult clamped to 5) value is stored into oAIAttackVars_Damage. It clears the
  init flag and sets ChargeCycles=2 so the attack recharges over two cycles before becoming ready again.
  The constant 0x52 (82) returned in r0 is presumably a duration/cooldown the caller stores. Runs on the
  beastsp recorded route, so this is one of the BeastOut/BeastSP AI enemy attack initializers; the oAIAttackVars_*
  field offsets are already known in the project.
