name: battle_bombExplode
address: '0x080CBDE6'
kind: function
status: probable
summary: 'Detonation/destruction handler for a bomb-type battle object: plays the bomb-hit sound, spawns
  an explosion effect, then tears the object down.'
interface: (r5 = battle object, no args in r0-r3) -> r0 = CUR_STATE_DESTROY stored into object; no meaningful
  return
details: 'Operates on the battle object in r5. It first releases the panel reserved at the object''s FuturePanelX/Y
  via object_removePanelReserve, then reads ObjectFlags2: if bit 0x8000 is clear it plays SOUND_HIT_BOMB_1
  and spawns an effect object using the object''s position triple at +0x34 (r3 += 8, r4 = 0xE); if 0x8000
  is set and bits 0x300000 are clear it calls sub_800F8CE (still holding Flag2 in r0), returning silently
  on 0, destroying with no effect on 1, and otherwise spawning a larger effect (r3 += 0xC, r4 = 0x14).
  In all destroy paths it clears the collision region, removes the object from the battle object list,
  dispatches its destroy sub-events (only if battle flag 0x40 is set), and writes CUR_STATE_DESTROY into
  the object''s state/phase field. The 0x300000 mask appears to suppress the explosion effect entirely.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: SOUND_HIT_BOMB_1 is played unconditionally on the normal (0x8000 clear) path, pointing at a
    bomb/blast object; spawns effect objects at the object's +0x34 position with the two explosion-style
    parameter pairs (8/0xE and 0xC/0x14); removes panel reservation by FuturePanelX/Y and clears the collision
    region before teardown; ends with clearEntryOfBattleStateBattleObjectList + battle_dispatchDestroyEvents
    + storing CUR_STATE_DESTROY, the standard battle-object death sequence; flags 0x8000/0x300000 in ObjectFlags2
    select between explosion variants, no effect, and silent skip
  refs:
