  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-223614'
open_questions:
- purpose of sub_800F8CE (called with Flag2 in r0, returning 0/1/other) is unknown and gates the 0x8000
  path
- no known caller, so whether this is a timer-expiry handler vs a hit handler for the bomb is inferred
  rather than confirmed
- meaning of ObjectFlags2 bits 0x8000 and 0x300000 and the r4 parameter (0xE/0x14) passed to the effect
  spawner
