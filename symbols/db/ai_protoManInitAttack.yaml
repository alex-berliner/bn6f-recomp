name: ai_protoManInitAttack
address: '0x080FBEE8'
kind: function
status: probable
summary: 'Initializes one of ProtoMan''s AI attacks: reads difficulty tier, sets up attack timing/panel-choose
  callback, targets the opposing player, and kicks off attack state 0xC.'
interface: (r0 = AI attack vars base?, r5 = current BattleObject, r7 = oAIAttackVars struct) -> r0 clobbered;
  no meaningful return
details: Stores the AI difficulty tier (from battle_getAiDifficultyTier_800FE36) and clears the InitFlag
  in the oAIAttackVars struct at r7. Calls sub_80FBF92 with r0=2, installs sub_80FCDBA+1 as the PanelChooseCallback,
  and stores sub_80FBD68/sub_80FBD7C results as AttackDuration and AttackBoost2. ScratchVar is set to
  r5+0x64 (object pointer plus 0x64). It looks up the enemy of the current object's alliance via battle_findPlayer(alliance^1)
  and stores it as TargetObjectPtr, then calls object_setAttack0(0xC) to begin the attack. All four callers
  are ProtoMan AI steps gated by RNG rolls (tier-scaled thresholds 0xC/0xE), consistent with this being
  a shared attack-entry routine.
