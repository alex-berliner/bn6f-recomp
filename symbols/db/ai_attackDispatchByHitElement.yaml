- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0] — element byte indexes the handler table;
    table off_8105E74 holds five thumb pointers, three of which are known ai_* attack step functions;
    mov lr,pc; bx r1 is a call, so handlers return into pop {r7,pc} of this frame
