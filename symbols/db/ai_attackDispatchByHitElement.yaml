name: ai_attackDispatchByHitElement
address: '0x08105E60'
kind: function
status: probable
summary: Dispatches the current attack step to the element-specific AI attack handler based on HitElement
interface: (r7 = pointer to AI attack vars struct) -> calls handler from off_8105E74 indexed by [r7+oAIAttackVars_HitElement];
  r0 = HitElement passed through
details: 'Reads the HitElement byte from the AI attack vars struct at r7, indexes the table off_8105E74
  with it, and performs a Thumb call (mov lr, pc; bx r1) to the selected handler: sub_8105E88, ai_attackChooseTargetPanelStep,
  ai_woodAttackMoveStep, ai_attackChargeShot, or sub_8105FC2. The handler''s r0 receives the HitElement
  value as a leftover from the ldrb. The tail ''pop {r7,pc}'' runs on return from the handler. It is a
  small state/element dispatcher bridging generic AI attack code to per-attack-type step routines.'
