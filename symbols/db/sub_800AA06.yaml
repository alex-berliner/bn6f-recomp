open_questions:
- Whether r0 is actually hard-coded to index 1 or whether the caller's r0 value is meaningful (it is unused by the
  function but propagated to `getNextEntryAddress_800AAAE`). Knowing which next-array slot means surveying who else
  writes index 0/1 in the array.
- The semantic meaning of r5 - "battle object index into the LinkedList" vs "u32 pointer to another BattleObject";
  `cmp r0, r5` works either way, but `sub_810A004` summary's "waits on ExtraVars+4" suggests a handle/index rather
  than a pointer. Settle by inspecting how sub_810A004 derives r5.
