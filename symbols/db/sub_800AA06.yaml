name: sub_800AA06
address: '0x0800AA06'
kind: function
status: hypothesis
summary: Resolves a handle to its record via sub_800AAAE and reports whether the record's id field equals the expected
  id in r5.
interface: bool handleIdMatches(u32 handle /* r0 */, u32 expectedId /* r5 */); returns 1 on match, 0 otherwise;
  also leaves the result in r2 and sets flags from the final mov (nz clobbered, c/v listed as outputs by the lifter)
details: 'Wrapper/comparison helper. Calls sub_800AAAE with r0 unchanged (the handle); that callee returns a pointer
  in r0. The first word at that pointer (offset 0 of the pointed-to structure) is treated as an id field and compared
  against r5. r2 is set to 1 on equality, 0 otherwise, then copied to r0 and returned. Flags come from the final
  `mov r0, r2` (an implicit adds r0, r2, #0 in Thumb). No other state is touched and nothing is preserved beyond
  what the ABI implies. The game-level meaning depends entirely on what kind of handle sub_800AAAE resolves; without
  knowing that caller context this can only be described as a generic "does this handle''s id match X" test.

  '
