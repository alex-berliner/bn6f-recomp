name: sub_800AA06
address: '0x0800AA06'
kind: function
previous_names: []
status: hypothesis
summary: Returns 1 if the Next[1] pointer in the active battle object's AI block matches a battle object index passed
  in r5, else 0.
interface: '(r5 = battle object index) -> r0 = 0/1 ; r0 = slot pointer from `getNextEntryAddress_800AAAE`, r1 =
  array base, side effect: clobbers flags'
details: 'Pushes lr, calls `getNextEntryAddress_800AAAE(1)` to fetch the entry pointer for index 1 in the Next array
  at 0x2038170 (so the r0 argument is hard-coded to 1 - the function ignores any caller''s r0). It loads the u32
  at that pointer (`ldr r0, [r0]`) and compares it to the r5 value. Returns 1 on equality, 0 otherwise. r1 and r2
  are also clobbered, but only r0 is reported in `out`. The register contract lists `in=[''r0'', ''r5'', ''lr'']`,
  but the assembly never uses the incoming r0 (it sets r0 itself via `mov r0, #0`). Two of three callers (`battleObject_joinAlly_80163B4`
  and `sub_810A004`) operate during the ally-join / Mettaur loop and treat a "true" return as a signal to take an
  action when this slot still references the joining actor.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl getNextEntryAddress_800AAAE` is called with no prior argument setup, and the callee''s contract
    defines `in=[''r0'', ''lr'']` - so r0 reaches it as whatever the caller passed in; the assembly then overwrites
    r0 with the loaded pointer, suggesting a fixed in-function call. - `getNextEntryAddress_800AAAE` docstring:
    "Returns the address of entry `r0` (0x20 bytes each) in the Next array at 0x2038170" - the only values this
    fn could feed are 0 (caller arg) or 1; either is plausible. - `mov r2, #0`; `ldr r0, [r0]`; `cmp r0, r5`; `bne
    loc_800AA16`; `mov r2, #1`; `mov r0, r2`; `pop {pc}` produces a clean 1-on-match, 0-on-mismatch boolean. - `battleObject_joinAlly_80163B4`
    caller summary mentions "flag it as friendly, set its init state" - consistent with polling whether the actor
    is still linked in the Next array. - `sub_810A004` (Mettaur loop step) per its summary "waits on ExtraVars+4
    (sub_800AA06)" - confirms r5 holds a Mettaur-specific battle object index/pointer being polled. - Captured snapshot
    trace: entry r0=0 consistently with exit r0=1 on match (snap_story2_0) and r0=0 otherwise - exactly the boolean
    contract.'
