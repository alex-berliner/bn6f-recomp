  itself preserves r4-r7, implying it runs inside a larger sprite/object worker frame that keeps sprite state (object
  pointer, work memory, possibly via r10 as a segment/base register) in those registers. No branch or flag logic
  of its own; the flag outputs are just leftovers from the called code.
