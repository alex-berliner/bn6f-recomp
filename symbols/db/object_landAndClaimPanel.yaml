    header; off_80C6510 -> byte_80C6514 indexed by Alliance<<3 feeding object_checkPanelParameters; bl
    object_setPanelAlliance followed by object_setPanelAllianceTimerLong claims the panel for a long duration;
    mov r0,#4; strb r0,[r5,#oBattleObject_CurAction] transitions the object to the landed action
