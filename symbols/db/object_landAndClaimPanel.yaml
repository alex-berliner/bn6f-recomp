name: object_landAndClaimPanel
address: '0x080C64A0'
kind: function
status: probable
summary: 'Processes an airborne battle object''s landing: applies gravity, and on touchdown spawns its
  collision region and claims the panel it lands on, then moves to the landed action state.'
interface: (no args; r5 = battle object) -> r0 = 0/1 whether the panel-claim checks passed; sets oBattleObject_CurAction
  = 4 when landed, returns early while still airborne
details: Each call subtracts oBattleObject_ZVelocity from oBattleObject_Z; if Z is still positive the
  object is still falling and the function returns immediately. On touchdown it clamps Z to 0 and calls
  object_spawnCollisionRegion with the object's PanelX/PanelY, Element, Z and DamageAndStaminaDamageCounterDisabler
  fields, setting flag bit 0x10 in the spawned region's oObjectHeader_Flags. It then reads an 8-byte-per-alliance
  table at byte_80C6514 (indexed by Alliance<<3) and calls object_checkPanelParameters with the panel
  coordinates, requiring the landed panel to match that alliance's mask; additionally sub_800D668 must
  pass for the panel with the alliance inverted (Alliance eor 1). If both checks pass, the panel is claimed
  for the object via object_setPanelAlliance (using Param1) and its ownership timer is set to the long
  0x708 duration. Finally oBattleObject_CurAction is set to 4, the landed/next action state. The table
  bytes (0x80,0x88F,0x20 / 0xA0,0x88F,0) suggest the panel must be in a specific state (e.g. not broken/hole)
  for the claim to apply.
evidence:
- method: assembly-reading
  date: '2026-10-18'
