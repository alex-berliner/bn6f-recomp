name: battle_spawnEffectInFrontOfSelf
address: '0x080F6254'
kind: function
status: probable
summary: Spawns a type-4 effect object on the panel two steps in front of the acting battle object, with
  a facing-dependent parameter.
interface: (r5 = battle object 'this') -> r0 = spawned effect object pointer; r4 clobbered inside as argument
  to spawn wrapper
details: Takes the caller's battle object in r5 (oBattleObject_PanelX/PanelY fields). It reads the object's
  effective flip, computes r4 = flip*0x100 + 0x64, and reads frontDirection (±1) times 2 added to PanelX
  to select the panel two columns ahead in the object's facing. That panel column/row is converted to
  16.16 fixed-point screen coordinates via object_getCoordinatesForPanels, then spawn_t1_0x0_EffectObject
  is called with the coordinates and r3 = 0x180000 (24.0 fixed point, likely a y/height offset). The r4
  value (0x64 plus a flip-scaled component) is presumably forwarded by the thin spawn wrapper as an effect
  variant/parameter, so the effect differs left vs right.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r5,#oBattleObject_PanelX]; add r0,r0,r1 with r0 = frontDirection*2 selects the panel
    2 columns ahead; object_getCoordinatesForPanels call converts the chosen panel to pixel coordinates
    passed to the spawn wrapper; r4 = object_getFlip()<<8 + 0x64 is computed just before the spawn call,
    implying it is forwarded as an effect parameter; callee spawn_t1_0x0_EffectObject is a documented
    thin wrapper spawning a type-4 effect object; sole caller sub_80F5D74 lies on recorded battle routes,
    consistent with an in-battle visual effect
