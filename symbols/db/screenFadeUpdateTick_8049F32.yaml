name: screenFadeUpdateTick_8049F32
address: '0x08049F32'
kind: function
status: confirmed
summary: Advances an in-progress screen-fade animation one step and then chains into the next screen/fade
  update routine.
interface: 'void screenFadeUpdateTick_8049F32(void); // inputs: r4 r5 r10 lr; outputs: r8 r9 r10 r11 r12;
  clobbers: nz c v r0 r1 r2 r3 lr

  '
details: 'Called once per update tick from a screen-state loop (r5 points to the screen struct, whose

  state byte at offset 1 is overwritten with 8). If IsScreenFadeActive() reports a fade is

  currently running, it drives the fade animation forward by calling sub_803BB2C with arg 0x14

  (likely a fade timer/duration parameter) and sub_803BB7C with arg 0x0F (likely a fade draw or

  blend update), then writes 8 to r5+1 to mark the new screen-state phase. Regardless of

  whether a fade is active, control then tails into sub_8049F70, which presumably handles the

  next stage of the screen update (e.g. drawing or continuing the state flow). The pair

  sub_803BB2C(0x14) + sub_803BB7C(0x0F) followed by writing 8 to r5->state1 is the routine''s

  main observable effect, and matches a "step the fade, mark state 8" pattern typical of

  MegaMan Battle Network screen transitions.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
