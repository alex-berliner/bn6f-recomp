name: battle_initFlyToPanelAttack
address: '0x080DDC30'
kind: function
status: probable
summary: Initializes a battle object that flies from its spawn position to a target panel over 10 frames,
  then becomes an active collidable attack object.
interface: '(r5 = battle object header, oBattleObject_Param1 = target panel: low 3 bits column, bits 4+
  row) -> void; object freed if collision-slot allocation fails, otherwise state set to CUR_STATE_UPDATE'
details: Sets object flag bit 1, loads sprite 0x56 (palette 0x10?) and plays animation 2, then syncs flip
  and position from panels. It nudges the object half a panel (0x80000) forward along its front direction
  and 0x80000 down in Z. Param1 encodes the destination panel (column in low 3 bits, row in the high nibble);
  object_getCoordinatesForPanels gives the target pixel coordinates, and SWI 6 division computes per-frame
  X/Y/Z velocities as (target - current)/10 with oBattleObject_Timer = 10, so the object glides to that
  panel in exactly 10 frames. It then allocates collision data (freeing the object if none is available),
  sets up a collision box (0x15, 5, 3), copies the element's hit effect into the collision data, clears
  the collision region, presents it, plays sound effect 0xFF, and switches the object to its update state.
