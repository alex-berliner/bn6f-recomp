name: battle_queueActiveChipGfx
address: '0x0802707C'
kind: function
status: probable
summary: Queues two GFX transfers (0x80 bytes of chip-indexed graphics to VRAM 0x60172C0 and 0x20 bytes
  from byte_872CF94 to a RAM buffer) based on active chip slot 11, then sets a state field.
interface: (r0 unused, r5 = object/state struct) -> r0 = destroyed; queues GFX transfers, writes r5+0x40=0,
  r5+0x44=chip*0x10+0x18, r5+2=4
details: Fetches active-chip entry 11 via getLocOfActiveChips_8027E1C (12 bytes/entry) and reads a byte
  at +6, falling back to +5 when +6 is zero (two ID-like fields). The chosen value *0x80 indexes byte_8725894,
  and 0x80 bytes from there are queued to VRAM 0x60172C0 via QueueEightWordAlignedGFXTransfer — a per-chip
  block of tile data. It then computes r5[8]*0x10+0x18 into r5+0x44 (an offset into a 0x10-strided table)
  and queues 0x20 bytes from byte_872CF94 into byte_30016F0, likely palette/attribute data staged in IWRAM.
  Finally stores 4 to halfword r5+2, evidently advancing this object's state machine.
