    GFX table; QueueEightWordAlignedGFXTransfer(0x60172C0) — VRAM destination, so the 0x80 bytes are tile
    data; second QueueEightWordAlignedGFXTransfer from byte_872CF94 to byte_30016F0, size 0x20 — a companion
    32-byte blob staged in IWRAM; strh r0,[r5,#2] with r0=4 after clearing r5+0x40 and setting r5+0x44
