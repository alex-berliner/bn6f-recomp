name: battle_tickCustomScreenEffect_800A892
address: '0x0800A892'
kind: function
status: confirmed
summary: Per-frame battle hook that runs the custom-screen (Full Custom/custom gauge) effect's update when that
  effect is active and its sub-state is ready.
interface: void sub_800A892(void); // no args, no return; preserves r4-r7, clobbers flags and r0-r3/lr
details: 'Reads the current battle effect bitmask via GetBattleEffects. Only acts when bit 0x100 is set (an effect
  whose id occupies bit 8 of the mask — associated with the custom screen / custom gauge visuals) AND bit 0x8 is
  clear (the effect is not suppressed by a conflicting state, e.g. regular custom screen open vs. its variants).
  It then calls sub_800A832, which returns the effect''s current phase/state, and only when that state equals 2
  invokes sub_8005DBE, the effect''s main update routine (likely animating the custom gauge or custom-screen transition).
  All other cases fall through and return immediately, so this is a cheap per-frame gate rather than a worker itself.

  '
