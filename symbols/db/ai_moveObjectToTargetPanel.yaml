name: ai_moveObjectToTargetPanel
address: '0x080FB650'
kind: function
status: probable
summary: 'AI/behavior state handler that instantly moves a battle object onto its stored target panel:
  it commits the target coordinates, updates collision/panel state, flags it as currently moving, waits
  10 frames, then advances the state machine to state 8.'
interface: '(r5 = battle object, r7 = behavior/state struct: [r7,#1] phase byte, [r7,#0x10] timer halfword,
  [r7,#0] next-state halfword) -> void'
details: On the first entry (phase byte at [r7,#1] == 0) it sets the phase to 4 and writes 3 to [r5,#0x10],
  then copies the target panel bytes at [r5,#0x14]/[#0x15] into the current panel slots [r5,#0x12]/[#0x13].
  It calls object_removePanelReserve to free the object's reserved panel, recomputes pixel coordinates
  from the new panel coords, and syncs the collision record via object_updateCollisionPanels. It clears
  ObjectFlags1 bit 0x40 (likely an in-progress-move/reserve flag) and sets the 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1
  bit, then stores a 10-frame timer at [r7,#0x10]. On later entries it decrements the timer and, when
  it reaches zero, writes 8 into [r7,#0], the next state of the state machine. The copy of target panels
  into current panels suggests this is a teleport-style or scripted repositioning rather than a step-by-step
  move.
