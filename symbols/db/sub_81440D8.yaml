name: sub_81440D8
address: '0x081440D8'
kind: function
status: confirmed
summary: 'Tears down the link-communication hardware prior to a hardware/mode hand-off: backs up and masks the master
  interrupt state, trims IE to 0xFF3F (clearing the timer IRQs), stops SIO and Timer 3, pokes the SIO control register,
  then BIOS-fills the timer-enable block at 0x200F460 (0x266 halfwords) and the SIO buffer at 0x200F44C (2 words)
  with zeros and clears its second byte.'
interface: "void Next sub_81440D8(void);              /* entry: no GBA regs in/out */\ncall_SWI_CpuSet_result reset_comm_hardware(void);\n\
  \  /* sets r1 = unk_200F44C, r2 = 0x1000002, r3 = 0x1000002 (last CpuSet\n     mode word), flags = ADD(r1, 0)\
  \ so C=0 V=0 N=0 Z=0;\n     preserves r4/r5 across the prologue, writes lr via bx r0 from saved\n     pop; clobbers\
  \ r0 as scratch. */\n"
details: 'Saves IME (InterruptMasterEnableRegister) into word_2006DFC, disables master IRQ, masks IE with 0xFF3F
  (drops timer 0-3 IRQ bits and a couple of SIO-related bits), then restores IME — a standard "save/mask/restore"
  interrupt gating.; SIOCNT = 0x2000 (0x80 << 6) halts the multiplayer SIO engine; Timer3Control = 0 stops timer
  3 (a known link/IRQ driver timer).; Writes 0xC0 to SIOControlRegister + 0xDA — a hardware register adjacent to
  SIOCNT (likely RCNT or a sibling GBA wireless/SIO control register).; Two BIOS CpuSet fills use 4 bytes of stack
  scratch (SP -= 8 … SP += 8): the first slot is a 0 word copied 0x266 halfwords over the timer-enable block at
  eTimerEnable200F460 (0x200F460); the second slot has its low halfword zeroed and is copied 2 words into unk_200F44C
  (the SIO buffer header at 0x200F44C). After the fill, byte_200F44D is zeroed, clearing a flag in the SIO buffer
  header.; The mode constant 0x5000266 = source-is-halfword, count=(0x266 & 0x03FFFFFF) = 0x266 halfwords, fixed
  source (0x4000000). 0x1000002 = 2 words.; Register form exists because the CpuSet source operand has to live at
  the guest''s SP address; a C buffer can''t sit at guest SP. The adapter hands the BIOS `SP` and `SP+4` directly.;
  Flag side-effect comes from the very last ARM-pop''s "mov r1, r4" emitted as `adds r1, r4,'
