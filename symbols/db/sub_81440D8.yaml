open_questions:
- Exact meaning of 0xC0 written to "SIOCNT + 0xDA" — comment says SIOCNT in the disassembly but +0xDA lands outside
  SIOCNT; could be RCNT or a wireless unit register.
- Layout of unk_200F44C (the SIO buffer header) and the meaning of byte 0x1D (cleared to 0). 0x200F44C looks like
  the GBA multiplayer/SIO transfer buffer header right before the 16-bit child buffer at 0x200F4C4.
- Whether r3 in the returned tuple really equals 0x1000002 unchanged (the CpuSet BIOS doc shows r3 as the destination
  address on ARM7, but the disp call here was emitted with r3 not in the documented output set; treat as best-effort
  from observed code).
