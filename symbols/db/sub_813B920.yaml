name: sub_813B920
address: '0x0813B920'
kind: function
status: confirmed
summary: Writes the byte value passed in r0 into the work-area byte at 0x20096D8 and returns that address in r1.
interface: 'void storeWorkByte_813B920(u8 value); // in: r0 = byte value, lr = return addr; out: r1 = &byte_20096D8
  (side effect: byte written); flags untouched'
details: Single-instruction setter. It loads the fixed address byte_20096D8 (work/RAM area 0x20096D8) and stores
  r0's low byte there with strb. As a quirk of the original code, r1 is left holding the buffer address when the
  function returns, so callers (or the lifted Next code) can chain off it; the register contract confirms r1 is
  the only meaningful output besides the memory write. No flags are affected and no other registers are touched.
  Purpose of the byte is not identifiable from this function alone; it is a plain one-byte field in the 0x2009xxx
  EWRAM work area.
