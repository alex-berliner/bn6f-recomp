name: byte_203CF00_getEntryPtr_800BF5C
address: '0x0800BF5C'
kind: function
status: confirmed
summary: Address helper that converts a slot index into a pointer to that entry in the 0x50-byte-per-entry array
  at byte_203CF00.
interface: u8* byte_203CF00_getEntryPtr(u32 index /* r0 */); // returns r0 = byte_203CF00 + index*0x50, also sets
  r1 = byte_203CF00 base, NZCV flags set by the final ADD
details: 'Tiny indexing thunk: multiplies r0 by 0x50 (80-byte struct stride) with MUL, adds the fixed

  base byte_203CF00, and returns via "mov pc, lr" (an ARM-mode-style return from Thumb, so it

  must only be called from ARM code or with bit0-clear target handling). r1 is left holding the

  array base, which callers may reuse for further field access. The final add sets the condition

  flags, so callers could theoretically branch on the result address. No bounds checking on the

  index, so callers are responsible for keeping it within the array. The 0x50-byte structure

  stored here is not identified by this function alone; byte_203CF00 is in EWRAM (0x0203xxxx

  work RAM), so it is a runtime work buffer, not ROM data.

  '
