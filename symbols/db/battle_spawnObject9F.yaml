name: battle_spawnObject9F
address: '0x080D924E'
kind: function
status: probable
summary: Spawns battle object kind 0x9F at a panel with an element, links it to a parent structure, copies
  alliance/direction from a reference object, and flags it 0x10.
interface: (r0 = panel X, r1 = panel Y, r2 = element, r3 = parent/link struct ptr, r5 = reference battle
  object, r6 = damage/counter-disabler value) -> r0 = new oBattleObject on success; returns via object_spawnType3's
  success flags (beq skips setup on failure).
details: 'Saves the caller''s r0-r3/r5 on the stack so they double as the stack-passed argument block
  for object_spawnType3, called with type 0x9F. On success the wrapper back-fills the new oBattleObject:
  PanelX/PanelY from the args (also duplicated to bytes +0x64/+0x65, likely current vs. home panel), Element
  from r2, DamageAndStaminaDamageCounterDisabler from r6, and AllianceAndDirectionFlip copied from the
  caller''s r5 reference object. It cross-links the new object with a caller structure: newObject->oBattleObject_ExtraVars
  = r3 and *r3 = newObject. Finally it ORs 0x10 into oObjectHeader_Flags of the new object. The push/pop
  shuffling means the post-spawn stores operate on the spawned object while the alliance read uses the
  caller''s preserved r5 pointer.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0,#0x9f; bl object_spawnType3 with the caller''s r0-r2/r3/r5 saved as its stack argument
    block; beq locret right after the call/return-path flags: all field setup is skipped when the spawn
    failed; strb r1/r2 to oBattleObject_PanelX/PanelY plus duplicate strb to offsets 0x64/0x65 of the
    new object; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh r3,[r0,#...] copies alliance/direction
    from the caller''s object to the spawn; str r4,[r0,#oBattleObject_ExtraVars] / str r0,[r4] cross-link,
    then oObjectHeader_Flags |= 0x10'
