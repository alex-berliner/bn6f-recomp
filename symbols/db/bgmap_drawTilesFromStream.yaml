name: bgmap_drawTilesFromStream
address: '0x08004B28'
kind: function
status: probable
summary: Renders an encoded tile stream (byte_2006848) into the BG map as a run of tile writes, then resets the
  stream pointer.
interface: () -> r0 = destroyed; reads stream buffer byte_2006848 and read cursor *dword_2006C48, writes tiles via
  bgmap_WriteTileIdAtBlock_800187C, resets cursor to buffer start
details: 'Walks a command stream whose entries are read at halfword stride (r4 += 2 each read, low byte used). Each
  row starts with two bytes: x (kept in r6/r0) and y (r1). Then per entry: value 0xFF ends the row and a new (x,y)
  pair is read; 0xFE moves down one row (y++, x reset to the row''s start) reusing the same stream; any other value
  is written as tile id (value + 0xF2A0) at (x, y) in block 0 via bgmap_WriteTileIdAtBlock_800187C, with x incremented
  per tile. Loop ends when the read cursor (dword_2006C48 dereferenced, minus buffer start) reaches 0, and the cursor
  is reset to byte_2006848 so the buffer can be refilled.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r4,=byte_2006848 / ldr r5,=dword_2006C48; sub r5,r5,r4 gives remaining stream bytes from the current
    cursor; 0xFF (beq loc_8004B3A) terminates a row and reloads x/y from the next two stream bytes; 0FE branch does
    mov r0,r6; add r1,#1 — next row at the same starting column; otherwise add r3,r3,r7 (r7=0xF2A0) then bl bgmap_WriteTileIdAtBlock_800187C
    with r0=x, r1=y, r2=0 block; epilogue stores byte_2006848 back into *dword_2006C48, resetting the read cursor
  refs:
  - bn6f/asm/asm00_1.s:3680
  - 0x0800187C bgmap_WriteTileIdAtBlock_800187C
  reproduce: python3 tools/asmcat.py 0x08004B28
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: agree; run wf investigate
    investigate-20261019-030611'
