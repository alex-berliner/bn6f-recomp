name: sprite_queueOamEntryHflipPal12
address: '0x0803B8F8'
kind: function
status: probable
summary: Builds and queues one OAM entry for a hardware-flipped sprite whose tile comes from an index,
  using palette 12.
interface: (r0 = attr0 value (Y/shape, ≤16 bits), r1 = attr1 X/attribute bits, r2 = tile index) -> void;
  flags not meaningful.
details: Computes index*2 (r4 = r2<<1), packs a1 = (r0<<16) | r1 | 0x9000 — the 0x9000 in the low half
  sets attr1 hflip (0x1000) and the high size bit (0x8000), so callers pass X and any other attr1 bits
  in r1 and Y/shape in r0. Then attr2 = 0xC080 + index*2, i.e. tile 0x80 + 2*index with palette number
  12 (0xC000) and priority 0. It zeroes r2/r3 for sprite_queueOamEntry's unused 3rd/4th args and tail-calls
  it through the thumb trampoline at 0x802FE28. r2 is consumed before being clobbered, so the index and
  the 'unused' slot share a register position. Tile stride of 2 suggests an animation/variant stepping
  through consecutive 2-tile entries.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'lsl r4, r2, #1 followed by 0xC080+r4 as attr2 arg: tile 0x80 + 2*index, palette field 0xC000;
    orr r0, r1 / orr r0, 0x9000 packs caller attr0 (high half) with caller attr1 plus hflip+size bits;
    mov r2,#0 / mov r3,#0 before bl sprite_queueOamEntryThunk_802FE28 matches the (u32,u16,unused,unused)
    enqueue signature; dword_803B914/918 literals 0x9000/0xC080 are the only fixed attribute bits, rest
    comes from caller'
