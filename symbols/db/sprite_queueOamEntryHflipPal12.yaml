    run wf investigate investigate-20261019-022109'
open_questions:
- Caller sub_803B880 is undocumented, so which sprite/shape (attr0 bits in r0) and what X positions (r1)
  are passed in game terms is unknown
- Whether index r2 selects animation frames or sub-tiles of a larger 64x32 (or similar) horizontal object
  needs the caller or the tile data at VRAM tile 0x80
