name: sub_8120618
address: '0x08120618'
kind: function
status: confirmed
summary: Converts a range of 0x20-byte battle-grid panel entries into packed BCD tilemap words for display.
interface: void battle_decodePanelTiles_8120618(u32 firstIndex /*r0*/, u32 tableBase /*r1*/, u32 dst /*r2*/, u32
  tileSrcBase /*r3*/, u32 count /*r5*/); // clobbers r0-r3, nzcv; preserves r4-r7
details: 'Iterates `count` panels starting at `firstIndex` in the 0x20-byte-stride table at `tableBase`. For each
  panel: reads the u16 at +0x1C; if bits 7+ are zero (inactive), writes two zero u32s to `dst`. Otherwise reads
  the u32 at +0x14; if the low halfword is zero (no HP/damage value), also writes two zeros. If the high halfword
  (the numeric value) exceeds 0x63 (99 decimal), it is clamped to 99. SVC 6 is used to perform an unsigned division
  by 10, yielding quotient (tens digit) and remainder (ones digit). Each digit is turned into a tile index by adding
  1 (if nonzero) then shifting left by 1 (×2) and adding `tileSrcBase`; a quotient of zero instead maps directly
  to `tileSrcBase`. The two 16-bit tile indices are packed into one u32 and stored at `dst`; a second u32 equal
  to the first plus 0x10001 is stored at `dst+4`, producing an adjacent tile (likely a second row of the same digit
  pair). The loop is do-while, so it executes at least once even when `count` is zero.'
