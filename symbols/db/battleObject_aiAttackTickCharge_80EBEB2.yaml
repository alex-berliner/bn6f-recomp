open_questions:
- The semantic identity of AttackVars Unk_01=4 ("attack-in-progress" sentinel), whether Unk_12 is a frame
  counter or attack-telegraph timer, and whether sub_80116AE is the actual counter-attack launcher vs.
  a state-transition fan-out. Settling any of these would need a type-1 attack sequence trace (virus attacks
  vs. counter-attack) and to confirm what Unk_10 reaching 0 represents in the game logic.
