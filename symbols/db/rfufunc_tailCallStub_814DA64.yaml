name: rfufunc_tailCallStub_814DA64
address: '0x0814DA64'
kind: function
previous_names:
- sub_814DA64
status: probable
summary: One-instruction Thumb tail-call stub that just `bx r1` to whatever the caller parked in r1 —
  used as an RFU library indirect-call trampoline.
interface: (r0 = scratch, r1 = target function pointer to `bx` into) -> returns whatever the callee returns
  ; no side effect at this stub itself (it never executes any code after entry)
details: "- The function is a single Thumb instruction `bx r1` preceded by the standard `thumb_func` /\
  \ `thumb_func_end` glue and a NOP-padding halfword `0x46C0` (`mov r8, r8` style). This is exactly the\
  \ shape of a global-IRQ/handler-dispatch stub seen at the bottom of GBA libraries.\n  - Callers (rfu_REQ_sendData,\
  \ sub_8145D54, sub_814ECA0, sub_814ECB4, sub_814EEC0) all live in the RFU (wireless) subsystem (the\
  \ `rfu_REQ_*` / `sio_*-style` 0x0814xxxx block), and their in-contracts consistently show they hand\
  \ a function pointer in r1 with r0 as data. The stub never touches its own stack frame, never reads/writes\
  \ memory, and never produces flags — yet flags and r0/r1/r2/r3/r4/r12 are in the `may_write` set simply\
  \ because the lifter's contract propagates whatever the tail-callee returns.\n  - Because there is literally\
  \ no code to cite, the safest summary is \"tail-call trampoline that jumps to whatever pointer the caller\
  \ put in r1\". The single NOP halfword (`0x46C0`) is real and lives at 0x0814DA66.\n  - Drop-in IRT-style:\
  \ pairs of callers put the same kind of stub at very similar offsets (0x0814DA64 etc.) so RFU command\
  \ dispatch can choose between two tail targets from inlined branches.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `sub_814DA64:` at bn6f/asm/libs.s:20600 disassembles to `bx r1` then `.hword 0x46C0`, a hardware-level
    tail-call. - All five callees (`rfu_REQ_sendData`, `sub_8145D54`, `sub_814ECA0`, `sub_814ECB4`, `sub_814EEC0`)
    live in the 0x0814xxxx RFU/SIO region, making the subsystem attribution concrete rather than guessed.
    - Caller in-contracts all put a `r1` parameter that is caller-supplied with no use before the call
    site (consistent with handing it straight to the function pointer). - The `out`/`may_write` lists
    include flags and the scratch GP registers purely because the lifter forwards whatever the tail target
    clobbers, not because this stub touches them.'
