name: battle_resetAndInitScene
address: '0x0811F758'
kind: function
status: probable
summary: Tears down the current mode, jumps the main jumptable to state 0x28, and reinitializes the battle
  scene.
interface: () -> r0 = destroyed; sets Toolkit+SubmenuPtr byte to 0x18, runs main-state teardown and battle_initScene
details: 'It first calls mainState_resetGameAndGoto28_8005524, which frees type-0x21 objects, runs the
  standard clear/init passes, and advances the main state jumptable to state 0x28. It then reads the toolkit
  pointer from r10, loads the Toolkit''s SubmenuPtr field (offset from oToolkit_SubmenuPtr), and stores
  0x18 into it — likely selecting a mode/entry used by the battle scene. Finally it calls battle_initScene_8129248,
  which clears VRAM/GFX, primes the toolkit render-info block (0x1F40 at offset 0), and starts the battle
  opening. The trailing words (.word 0x40, ePETMenuData pointer) are adjacent data, not referenced by
  this function''s code. Net effect: a ''go to battle'' restart path rather than a normal gameplay step.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl mainState_resetGameAndGoto28_8005524 — teardown + jumptable to state 0x28 before anything
    else; ldr r0,[r10,#oToolkit_SubmenuPtr]; strb 0x18 — writes mode/entry id 0x18 into the toolkit submenu
    byte; bl battle_initScene_8129248 — ends by initializing the battle scene (VRAM clear, render-info
    0x1F40, opening cutscene); trailing off_811F76C/.word ePETMenuData are unreferenced pool/data, tying
