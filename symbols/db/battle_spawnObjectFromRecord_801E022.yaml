name: battle_spawnObjectFromRecord_801E022
address: '0x0801E022'
kind: function
status: confirmed
summary: Spawns a battle object from a small record (two ID bytes at r5+1/r5+2) with fixed placement/parameter values,
  then calls sub_801BEC2 with 0x80.
interface: void battle_spawnObjectFromRecord(SpawnRecord* record /* r5 */) // reads record[1], record[2]; outputs
  whatever call_sub_3005EBA/sub_801BEC2 leave in r0-r3, N=Z=V per sub_801BEC2, C=0
details: 'Takes a pointer in r5 to a record (layout: byte at +1 and byte at +2 are the primary data passed on, probably
  object kind/ID and variant) and invokes call_sub_3005EBA with the pair (r0,r1) plus the constant argument set
  r2=3, r3=0, r4=6, r5=2. The fixed values look like placement or category parameters for the spawned entity (e.g.
  a type, a flag, and two coordinates/indices), but their exact meaning inside call_sub_3005EBA is not visible from
  here. After the spawn call, it calls sub_801BEC2 with 0x80 (built as 1<<7), likely toggling or reporting a state
  bit related to the spawn. r4/r5 of the caller are saved and restored; r6/r7/r10 pass through untouched. The final
  ''lsl r0, r0, #7'' shifts out a zero, so the carry flag is always clear on return.

  '
