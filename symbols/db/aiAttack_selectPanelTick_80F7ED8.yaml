name: aiAttack_selectPanelTick_80F7ED8
address: '0x080F7ED8'
kind: function
status: confirmed
summary: 'Advances the AI panel-selection highlight state machine one frame: arms the sequence, repaints
  the target tile, and drives the step timer toward release/hit transitions.'
interface: u32 aiAttack_selectPanelTick(BattleObject *obj /*r5*/, AIAttackVars *vars /*r7*/, u32 r1) /*returns
  r1; clobbers r0 r2 r3, flags*/
details: 'Called each frame during the AI''s "select target panel" phase of an attack sequence. r5 points
  to the owning BattleObject, r7 to the AIAttackVars block.

  First entry (AttackElement == 0): writes AttackElement = 4, sets obj->CurAnim to 0x11 (selection-start
  animation), initialises StepTimer to 0x23 (35 ticks) and zeroes ChargeCycles, then returns immediately.

  Subsequent entries: increments ChargeCycles; when bit-2 of the new count is clear (checked via lsr #3
  + bcs, i.e. every 8th frame the highlight is skipped) it loads TargetPanelX/TargetPanelY and calls object_highlightPanel
  to repaint the cursor. Decrements StepTimer; at 0x1E (30) it switches obj->CurAnim to 0x12 (release/confirm
  animation); at 0 or below it writes HitElement = 4 (marking the attack as landing). Values in 1..0x1D
  cause no state change—just continued waiting.

  r1 is passed through from the caller to object_highlightPanel and returned unchanged when highlight
  is skipped.

  '
