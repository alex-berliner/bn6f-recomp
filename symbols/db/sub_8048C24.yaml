name: sub_8048C24
address: '0x08048C24'
kind: function
status: confirmed
summary: Iterates a shop's item table and returns 1 if any active entry is a navi-gated unique item that is currently
  unavailable (no PET-navi equipped, wrong kind, or real price when a sentinel is expected).
interface: int shop_checkUniqueItemLocked(u32 shopIndex /*r0*/, u32 toolkit /*r10*/) -> r0=locked(1)/clear(0), r2=entry
  ptr, r3=last flag byte
details: "Uses r0 as an index into a global shop-descriptor table at dword_8046B98\n(stride 0x10). Each descriptor\
  \ holds a data-offset (+8) and a slot count (+C).\nThe toolkit pointer in r10 supplies ShopDataPtr (oToolkit_ShopDataPtr);\n\
  adding the descriptor offset yields the base of the shop's item array.\nEach item entry is 8 bytes: byte 0 = kind\
  \ (1 = \"unique\"/navi-gated),\nbyte 1 = availability flag, u16 at +2 = price (0x70 = sentinel meaning\n\"no purchasable\
  \ cost / display-only\").\nFor every entry whose flag byte is non-zero:\n  - Calls GetCurPETNavi; if it returns\
  \ 0 (no PET-navi equipped) → locked (r0=1).\n  - If kind byte != 1 (not a unique entry) → locked (r0=1).\n  -\
  \ If price != 0x70 → locked (r0=1).\n  - If price == 0x70 the entry is considered valid and iteration continues.\n\
  Entries with a zero flag byte are silently skipped.\nIf all entries pass, returns 0. r2 is left pointing at the\
  \ current (or past-last)\nentry; r3 holds the last flag byte read. The loop uses a signed (blt)\ncomparison of\
  \ counter vs slot-count so a count of 0 still executes the body once.\n"
