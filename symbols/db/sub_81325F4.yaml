kind: function
status: confirmed
summary: 8-bit table lookup from a 10-entry constant byte table indexed by caller-supplied value.
interface: uint8_t lookupByte_81325F4(uint32_t index); // r0 in -> r0 byte out; r1 left pointing at table base
details: 'Loads the address of byte_8132600 into r1, then returns the byte at [r1 + r0].

  The table holds ten entries: 0x14, 0x18, 0x1C, 0x00, 0x01, 0x49, 0xF7, 0x46, 0xF7, 0x46

  (followed by 0x00, 0x00 padding). The dword_8132610 word (0x001C1814) is a duplicate

  little-endian encoding of the first three bytes and is not read by this function.

  No memory clobbers; tail call via `mov pc, lr`. The function is small enough to be a pure

  lookup helper, but the meaning of the indices and which subsystem consumes them is unclear

  from this routine alone.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
