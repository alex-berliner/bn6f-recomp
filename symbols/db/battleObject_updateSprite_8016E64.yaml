name: battleObject_updateSprite_8016E64
address: '0x08016E64'
kind: function
status: confirmed
summary: Drives one battle object's sprite animation per frame, gated on time/pause/HP and a few object
  flags.
interface: 'void sub_8016E64(u32 battleObj /* r5 */);

  // preserves r4, r5; clobbers r0-r3, lr, N/Z/C/V; outputs only r5

  '
details: 'Operates on the BattleObject pointed to by r5. Reads oObjectHeader_Flags (r5); if bit 0x8

  is set, returns immediately. Calls battle_isTimeStop() and returns if true (time-stopped).

  Reads oBattleObject_NameID (r5). When the name id is in the inclusive range 0x49..0x4E the

  HP check is skipped; otherwise it must read oBattleObject_HP and return when HP == 0.

  Calls GetBattleMode(); if the result is not 1, calls battle_isPaused() and returns on true.

  Then calls object_getFlag() and returns if any bit of 0x80110C00 is set; calls

  object_getFlag2() and returns if bit 0x8 is set.

  If oBattleObject_CurAnim differs from oBattleObject_CurAnimCopy, calls

  sprite_setAnimation(cur_anim), sprite_loadAnimationData(), and stores cur_anim into

  oBattleObject_CurAnimCopy. Finally calls sprite_update().

  In short: the per-frame "advance the sprite anim" step for a battle actor, skipped under

  header flag 0x8, battle time-stop, paused (non-mode-1) battles, certain global object

  flags, and zero-HP actors (except for the 0x49..0x4E name-id window).

  '
