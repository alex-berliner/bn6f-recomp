open_questions:
- The semantics of r5 (is it AIData, GameState, or another per-frame struct?) and what r5+0x34 represents in the
  caller -- here r5 comes from the caller's frame so without the caller's prologue it is hard to label.
- The exact role of r6 (OverworldMapObject vs. some sub-struct) and offsets 0x7C/0x80/0x84 -- they could be the
  OWObjectInteractionArea (size 0x14) embedded or a separate per-map-object spotted-region struct.
- Whether EVENT_5F1 is the actual "beast spotted" flag in BN6 -- snapshot names "snap_beastsp_*" strongly suggest
  yes, but the EVENT_5F1 mapping would settle it.
