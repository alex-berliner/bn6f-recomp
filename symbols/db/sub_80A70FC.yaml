status: hypothesis
summary: 'Overworld beast-out spotted check: tests EVENT_5F1, then if the player is inside a small box (0x120000,
  ~18 px) around the OW map object''s interact area center (r6+0x7C), sets EVENT_5F1 and writes 1 to [r5+0x34] (Anger/flag
  field); else if player is inside the larger box (r6+0x7C/0x80 box coords with reach) and r6+0x84 (some object-relative
  counter/timer) is 0, also triggers the flag+write.'
interface: '(r5 = toolkit-ish ptr with +0xC/+0x10 coords and +0x34 anger field, r6 = OverworldMapObject-ish ptr,
  r10 = event flag token) -> void ; side effects: may set EVENT_5F1 and str 1 into [r5+0x34]'
details: "Early-returns if EVENT_5F1 already set (TestEventFlagFromImmediate). Otherwise reads the OW player coords\
  \ with ReadOWPlayerObjectCoords into r0/r1 (X/Y), checks z!=0 and falls through to the \"no object interaction\"\
  \ path when z==0.\n  Fast path: if [r5+0xC]/[r5+0x10] (player X/Y) is within +/-0x120000 of the object's \"tight\"\
  \ coords [r6+0x7C+8]? -- actually the loaded r2/r3 come from ldr r3,[r6,r2] with r2=0x84, then compared to 0 --\
  \ and the withinBoxCheck returns 1, plus the \"reach\" field [r6+0x84] is 0, jump to SetEventFlagFromImmediate+write\
  \ 1.\n  Slow path: otherwise re-checks using the broader area: ldr r2,[r6,0x7C] and ldr r3,[r6,0x80] as the box,\
  \ with r4=0x120000 radius, and only triggers when [r6+0x84]==0.\n  The captured call frames all show r1=0xFFC00000\
  \ and r2/r3 matching \"min/max\" type coordinates of a box (r2 positive small, r3 positive big), consistent with\
  \ the box-center + radius/half-extent arguments.\n  Writes back to [r5+0x34] (matches AIData.Anger offset 0x34\
  \ / GameState cur coords area; here likely a \"spotted\" flag/state byte in the caller-context object).\n"
