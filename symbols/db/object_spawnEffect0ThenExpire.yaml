name: object_spawnEffect0ThenExpire
address: '0x080D3D90'
kind: function
status: probable
summary: Battle-object update that on init spawns effect-type-0 at its own position, waits 5 frames, then
  clears its collision region and destroys itself.
interface: (r5 = battle object pointer, implicit) -> void; sets oBattleObject_PhaseInitialized=4, Timer=5,
  later CurState=DESTROY
details: Typical phase-based object update reading r5 as an oBattleObject. First invocation (PhaseInitialized==0)
  writes phase 4, calls spawn_t1_0x0_EffectObject with the object's X/Y/Z fields and r4=0x12, and sets
  Timer=5 halfwords. Each later frame decrements Timer; once it goes negative it calls object_clearCollisionRegion
  to drop out of the collision grid, calls sub_80D3F32, and writes CUR_STATE_DESTROY to CurState so the
  engine deletes it. The 5-frame lifetime and single effect spawn suggest a transient ground/impact marker
  or hit-spark anchor rather than a persistent entity.
