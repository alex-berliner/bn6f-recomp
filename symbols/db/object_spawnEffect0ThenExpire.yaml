    one-shot effect spawn at own coords; mov r0,#5; strh r0,[Timer] then sub r0,#1 / bge: fixed 5-frame
    countdown; bl object_clearCollisionRegion before destroy: releases its collision-grid slot; mov r0,#CUR_STATE_DESTROY;
    strb r0,[CurState]: self-termination path; no r0 input used before the phase check: pure per-frame
