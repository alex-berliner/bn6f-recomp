  but the claim that r4 is a *nonstandard* extra horizontal scale is wrong: `mov r7, r4` at the prologue
  saves the CALLER''s r4 (an unmodified argument register scratch), and `mov r4, r2` overwrites it, so
  r7 here is just whatever r4 held on entry — typically a preserved register, not an X-scale. The horizontal-vs-vertical
  asymmetry is real (cos term gets an extra mul r6,r7 vs. sin''s plain mul), but the proposal''s interpretation
  of that extra multiply is unconvincing. Suggested name `offsetPointByAngle` is fine; a more accurate
  summary is needed.'
