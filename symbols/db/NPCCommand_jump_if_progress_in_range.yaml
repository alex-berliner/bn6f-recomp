name: NPCCommand_jump_if_progress_in_range
address: '0x0809F270'
kind: function
status: confirmed
summary: NPC script opcode that jumps to a script address if the game's story progress value lies within an inclusive
  range.
interface: int NPCCommand_jump_if_progress_in_range(u8* scriptPtr /*r6*/, void* toolkit /*r10*/, void* ret /*lr*/);
  // returns via r6 = next script pointer or jump target; flags set on the returned value
details: 'Handles an NPC script opcode. Operand layout at the script pointer (r6):

  +1 = minimum progress byte, +2 = maximum progress byte, +3..+4 = 16-bit jump

  target fetched with ReadNPCScriptWord. Loads the game state via

  r10->oToolkit_GameStatePtr, reads oGameState_GameProgress, and compares it

  against the bounds. If min <= progress <= max, r6 becomes the jump target

  (interpreter continues there); otherwise r6 advances by 7, skipping the whole

  command. Sets NZCV flags on the resulting r6 either way (via movs/adds

  semantics), which callers presumably use for conditional logic. Note the

  bounds are compared signed (blt/bgt), though progress is a byte.

  '
