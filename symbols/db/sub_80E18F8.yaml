status: confirmed
summary: 'Drives a battle object''s per-phase countdown: on the first tick it signals a related object and arms
  a 30-frame timer; when the timer expires it ends the object''s current action and resets the phase state.'
interface: void runBattleObjectPhaseTimer_80E18F8(void /* r5 = oBattleObject */); /* preserves r4-r7, returns r5;
  clobbers r0-r3, lr, nzcv */
details: "Operates on the battle object pointed to by r5.\n- If oBattleObject_PhaseInitialized is zero, it inspects\
  \ oBattleObject_Unk_19:\n  * If that byte is 0 or 0x17, the phase cannot proceed and is ended immediately.\n \
  \ * Otherwise it calls sub_80E1332(self->RelatedObject1Ptr, 0), writes 0x1E to\n    oBattleObject_Timer, and sets\
  \ oBattleObject_PhaseInitialized to 4. Because the\n    init path falls through into the decrement, the first\
  \ tick already decrements\n    the timer once.\n- When oBattleObject_PhaseInitialized is already non-zero, it\
  \ just decrements\n  oBattleObject_Timer each tick.\n- On expiry (timer underflow), it writes 0x10 to oBattleObject_CurAction\
  \ and\n  clears oBattleObject_CurPhaseAndPhaseInitialized, finishing the current action.\n\nRegister form, old\
  \ prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
