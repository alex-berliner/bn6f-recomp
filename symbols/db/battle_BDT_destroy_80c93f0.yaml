name: battle_BDT_destroy_80c93f0
address: '0x080C93F0'
kind: function
status: confirmed
summary: Destroy hook for a battle BDT (battle-data/destructible) object when its sprite's frame-parameter destroy
  bit (0x80) is set.
interface: 'void battle_BDT_destroy_80c93f0(void); /* in: r5 = battle object; out: r5; clobbers nz,c,v,r0,r1,r2,r3,lr;
  preserved r5,r6,r7 */'
details: 'Polls the object''s sprite via sprite_getFrameParameters and tests bit 0x80 (frame-parameter

  destroy flag). When clear, the function just returns; when set, it null-clears the

  "ObjectHeader" field of the related object (oBattleObject_RelatedObject1Ptr -> field at

  +oBattleObject_ObjectHeader), then calls object_genericDestroy. The C retranslation''s note

  about r0/r1 holding related/0x80 is a literal register-state description of how the call is

  made and should not be taken as a separate semantic input; the meaningful arg passed to

  object_genericDestroy here is r0 = related object pointer (which may be NULL).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
