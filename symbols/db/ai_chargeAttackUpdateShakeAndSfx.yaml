name: ai_chargeAttackUpdateShakeAndSfx
address: '0x08104C18'
kind: function
status: probable
summary: 'AI attack-state update: locks the attacker in place with anim 0x4b and charges for ~60 frames
  with camera shake and periodic sound 0xE3, then flags the hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> r0 = 4 (element) written to HitElement when
  timer expires; no return value
details: If oAIAttackVars_AttackElement is unset, sets it to 4, copies PanelX/Y into FuturePanelX/Y so
  the enemy stays put, sets animation 0x4B, plays sound 0x91, starts a camera shake (magnitude 2, using
  StepTimer as duration) and initializes StepTimer=60 and ChargeCycles=16. During charging it plays sound
  0xE3 every 16 frames (ChargeCycles) and decrements StepTimer each frame; when StepTimer reaches 0 it
  writes element 4 into oAIAttackVars_HitElement, handing off to the attack's hit phase.
