    chip attack gated on bits 7/11 of the AI-data +0x44 flag; mov r1,#0; mov r2,#0; bl ai_useChipAttack:
    known callee sets up the player-AI chip attack with cleared attack vars; mov lr,pc / bx r1 pattern:
