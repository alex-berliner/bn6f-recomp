name: ai_attackHitElementDispatch
address: '0x080EC45E'
kind: function
status: probable
summary: 'AI attack step: dispatches a per-element attack handler based on the hit element, then performs
  the AI''s chip attack if the AI-data 0x44 flag has bits 0x8600 set.'
interface: (r7 = AI attack-vars context, no register args) -> dispatches table handler with r0 = element;
  may call ai_useChipAttack(r1=0, r2=0); no return value used
details: Reads the element byte at [r7, oAIAttackVars_HitElement] and indexes the two-entry table off_80EC484
  with it, calling sub_80EC490 or sub_80EC556 via mov lr,pc/bx (r0 still holds the element as argument).
  After the handler returns, it calls GetAIData_Unk_44_Flag and tests the result against 0x8600 (bits
  7 and 11, likely element/type marker bits in that word-sized flag); if any are set it zeroes r1/r2 and
  calls ai_useChipAttack to make the AI fire its current chip. The element-specific handlers themselves
  are not shown, so the exact per-element behavior is unknown.
