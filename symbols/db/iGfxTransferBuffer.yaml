summary: 'Proposed name: iGfxTransferBuffer. IWRAM staging buffer for queued 32-byte VRAM graphics transfers
  (table of what)'
details: This 32-byte IWRAM region is repeatedly supplied as the source address to QueueEightWordAlignedGFXTransfer,
  with a transfer size of 0x20 bytes. Uses include battle background, overlay, mode, and chip-panel graphics,
  as well as sprite tile-row loading. Its address is also embedded in a turn-order graphics descriptor
  table as the transfer source. The contents are runtime graphics data rather than persistent game state;
  the label denotes the shared staging buffer.
