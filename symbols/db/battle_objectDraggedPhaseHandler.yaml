name: battle_objectDraggedPhaseHandler
address: '0x080D1E32'
kind: function
status: probable
summary: Per-frame handler for a battle object being dragged panel-to-panel by an external mover, destroying
  it when its duration expires.
interface: (r5 = battle object) -> void; sets object panel coords, collision region, and state
details: 'On first entry sets PhaseInitialized and a 5-tick Timer. Each frame, if the object''s ExtraVars+0x14
  controller struct is set, copies its bytes 0x12/0x13 into PanelX/PanelY and recomputes pixel position
  and collision panels. Timer counts down each call; when it reaches 0, Timer2 decrements: if Timer2 hits
  0 the object''s collision region is cleared and CurState set to CUR_STATE_DESTROY; otherwise object_setCollisionRegion(1)
  is applied and PhaseInitialized is reset so the 5-tick cycle repeats. So the object is repeatedly repositioned
  to panels dictated by the controller struct and held in region 1 until a total duration (Timer2 x 5
  ticks) ends.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc init: strb #1 PhaseInitialized, strh #5 Timer only on first entry; copies [r1,#0x12]/[r1,#0x13]
    from ExtraVars+0x14 into PanelX/PanelY then calls object_setCoordinatesFromPanels and object_updateCollisionPanels;
    Timer2 expiry path: bl object_clearCollisionRegion then mov r0,#CUR_STATE_DESTROY stored to CurState...field;
    non-expiry path: mov r0,#1; bl object_setCollisionRegion and PhaseInitialized reset to 0, restarting
    the 5-tick cycle'
