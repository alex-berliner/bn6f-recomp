name: battle_objectDraggedPhaseHandler
address: '0x080D1E32'
kind: function
status: confirmed
summary: 'Per-frame update for a battle object in its dragged state: polls a drag-target panel, refreshes collision,
  and runs a two-stage countdown that either re-arms collision or destroys the object.'
interface: 'battle_objectDraggedPhaseHandler(r5: BattleObject*) -> r1: u32 /* collision-region update result */;
  clobbers r0,r2,r3,lr,flags; preserves r4,r6'
details: "Handles one tick of the Next-state phase for a battle object that the player has\ngrabbed and is dragging\
  \ across the battlefield grid (e.g. Nav-mode cursor placement\nor a chip-target selection widget).\n\nFirst tick:\
  \ sets oBattleObject_PhaseInitialized=1 and loads oBattleObject_Timer=5\n(a 5-frame collision-check window in\
  \ 16-bit timer units).\n\nDrag target: reads a pointer from oBattleObject_ExtraVars+0x14. When non-null, the\n\
  target's panel coordinates (bytes at offsets 0x12 and 0x13 in the target struct) are\ncopied into oBattleObject_PanelX\
  \ / oBattleObject_PanelY, then\nobject_setCoordinatesFromPanels and object_updateCollisionPanels are invoked to\n\
  reposition the drag sprite and recalculate which grid panels overlap it.\n\nTimer cascade:\n  - Decrement oBattleObject_Timer\
  \ (16-bit, signed comparison after 32-bit sub).\n  - If still > 0, return collision result from updateCollisionPanels.\n\
  \  - Once primary expires, decrement oBattleObject_Timer2.\n  - If Timer2 > 0: call object_setCollisionRegion(1,\
  \ obj) to re-enable collision,\n    then clear PhaseInitialized so the 5-frame window restarts next cycle.\n \
  \ - If Timer2 <= 0: call object_clearCollisionRegion(obj) and write\n    CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,\n\
  \    retiring the object.\n\nFields touched: oBattleObject_PhaseInitialized (byte), oBattleObject_Timer (u16),\n\
  oBattleObject_Timer2 (u16), oBattleObject_PanelX (byte), oBattleObject_PanelY (byte),\noBattleObject_ExtraVars+0x14\
  \ (u32 pointer),\noBattleObject_CurStateActionPhaseAndPhaseInitialized (u32 state word).\n\nQuirk: the Timer decrement\
  \ is performed as a 32-bit subtraction then stored as 16-bit,\nso the bgt after the strh reads the sign-extended\
  \ halfword rather than the full 32-bit\ndifference; values above 0x7FFF wrap but are irrelevant for small countdowns.\n"
