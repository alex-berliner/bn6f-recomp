name: ai_getColonelPanelAttackParams
address: '0x0810154C'
kind: function
status: probable
summary: Returns a pair of Colonel panel-attack parameters looked up from a fixed byte table via a helper.
interface: () -> r0 = param from byte_8101568[0..3], r1 = param from byte_8101568[4..7]; flags clobbered
details: 'Takes no arguments: it calls sub_800FE28 twice, first with pointer byte_8101568 and then with
  byte_8101568+4, keeping the first result in r0 and moving the second into r1, then returns. The table
  holds eight bytes (10 0C 0C 0A 28 1E 1A 14), i.e. two 4-byte groups, so the helper plausibly selects
  one value per group — most likely a difficulty-tier-indexed or random pick, matching the difficulty-tier
  state that the sole caller, ai_initColonelPanelAttack, sets up before starting attack 0xD. The returned
  pair is thus the tier-dependent parameters (e.g. area/extent or count values) for Colonel''s panel attack.'
