name: battle_objectIntroEntryAndActedSetup_8016460
address: '0x08016460'
kind: function
status: confirmed
summary: During the battle intro, plays an object's entry effect (unless it belongs to the currently acting side),
  then marks it as having acted and resets its phase counter.
interface: void battle_objectIntroEntryAndActedSetup_8016460(BattleObject* obj /*r5*/, Toolkit* toolkit /*r10*/,
  u32 unused_r4 /*r4 preserved*/); returns flags nz c v and r0 = state>>2 when the intro gate fails
details: 'r5 is a battle object and r10 the toolkit. First it calls battle_getStateUnk5c_800139A and tests bit 1
  of the returned state via lsr r0,#2 carry: if the bit is clear the intro sequence is not at the right stage and
  the function returns immediately (r0 = state>>2, flags from that value). Otherwise it calls GetBattleMode; if
  the mode is not 6, it compares the object''s oBattleObject_Alliance against oBattleState_Unk_0d of the current
  battle state (toolkit->BattleStatePtr) — a match (eor result zero) skips the entry effect, so the effect only
  plays for objects on the side the intro state does not expect (or in battle mode 6, for every object). The entry
  effect is sub_801DC7C with arguments r0=0, r1=0 by default, but objects whose oBattleObject_NameID is in the inclusive
  range 0x49..0x4E (likely the Falzar-version boss/secret enemies in that ID block) pass r0=-0x20 and r1=3 instead,
  probably a different entry animation variant. Finally the object is flagged as having taken its action: oBattleObject_CurAction
  = 1 and oBattleObject_CurPhaseAndPhaseInitialized = 0 (halfword clear). r4, r6, r7 are passed in and preserved
  but otherwise unused in the body.

  '
