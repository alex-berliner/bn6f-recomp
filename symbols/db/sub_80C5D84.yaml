name: sub_80C5D84
address: '0x080C5D84'
kind: function
status: hypothesis
summary: On battle-object destruction, spawns a sword-flavor (Param1==1) or wind-flavor (Param1==2) panel-area hit
  using the object's panel/element/damage fields, then sets state to destroy.
interface: "void sub_80C5D84(void);\n    // inputs:  r4, r5 (oBattleObject*), lr\n    // outputs: r1, r5\n    //\
  \ clobbers: NZ CV, r0, r2, r3, r4, r6, lr\n"
details: "Clears the object's collision region via object_clearCollisionRegion().\nBranches on oBattleObject_Param1:\n\
  \  - == 1: packet for sub_80C6018 (sword-style spread); passes panel X/Y,\n    element, R3=0, R4=0x3C<<8 (shape/extent\
  \ magic), and the\n    oBattleObject_DamageAndStaminaDamageCounterDisabler word.\n  - == 2: packet for sub_80C68B0\
  \ (wind-style row spread); same X/Y/element,\n    R3=0, and the damage word (no R4 shape constant).\nAlways writes\
  \ CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,\nqueuing the object for cleanup.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
