name: FreeOverworldMapObject
address: '0x080048B2'
kind: function
status: confirmed
summary: Releases an overworld map object, clearing its active bit in the global allocation bitfield, marking its
  slot free, and unmarking it in the sprite system.
interface: void FreeOverworldMapObject(struct OverworldMapObject* obj /* r5 */); returns r0-r3 = whatever sprite_makeUnscalable
  leaves, flags NZCV clobbered
details: 'Takes a map object pointer in r5. Reads the object''s list index from offset +3 (oOverworldMapObject_ListIndex)
  and clears the corresponding bit in the global bitfield at eActiveOverworldMapObjectsBitfield: the bit mask is
  0x80000000 rotated right by the index (index 0 = bit 31 of word 0, index 32 = bit 31 of word 1, ...), and the
  word is selected as bitfield + ((index >> 5) * 4). It then stores 0 to the object''s first byte (+0), which acts
  as the slot''s state/in-use marker, and finally calls sprite_makeUnscalable — notably with the leftover rotated
  bit mask still in r0, so that routine apparently takes the same index mask (or r0 is simply ignored there). r5
  is preserved; r0-r3 and flags come back from the sprite call. This is the free/teardown half of the map-object
  slot allocator overworld code uses to spawn and despawn overworld entities.

  '
