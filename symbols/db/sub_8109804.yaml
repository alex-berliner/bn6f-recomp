name: sub_8109804
address: '0x08109804'
kind: function
status: confirmed
summary: tail-call dispatcher that jumps to one of two AI-attack handlers based on a selector byte from the AI attack-vars
  block
interface: void aiAttackDispatch_8109804(u32 selector /* r0 read from stack index? effectively r0=selector, r7->attackVars
  */); inputs r5 r6 r7 lr; outputs nz c v r0 r1 r2 r3 r4 r5 r6 r7 r8 r9 r10 r11 r12 lr (all pass-through from the
  jumped-into handler)
details: 'Reads a single byte selector from [r7 + oAIAttackVars_Unk_00] (the AI attack-vars

  struct pointed at by the caller-held r7). Uses it directly (no shift/scale) as a

  byte index into a 2-entry Thumb jump-table anchored at off_8109818, where

  off_8109818 = &sub_8109820+1 (handler A) and off_810981C = &sub_810986E+1

  (handler B). Sets LR=PC and BXes into the chosen handler. Because there is no

  explicit return path of its own, the original `pop {pc}` falls through to the

  caller, so every register and flag the handler writes is observed as this

  function''s output. Effectively a swtch-style trampoline for one phase of the

  AI attack script indexed by an unnamed byte field in the AI attack-vars block.

  '
