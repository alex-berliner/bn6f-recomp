name: eStruct203F7D8_getUnk01
address: '0x0801FEE8'
kind: function
status: hypothesis
summary: Trivial getter returning the unknown byte field at offset 1 of the global struct eStruct203F7D8.
interface: 'Next eStruct203F7D8_getUnk01(void); returns u8 in r0 (zero-extended byte at eStruct203F7D8+1). Inputs:
  lr only. No flags read or written; no other registers clobbered.'
details: Loads the fixed address eStruct203F7D8 (=0x203F7D8 in EWRAM) via an offset-literal pool entry at 0x80200EC,
  then reads a single byte at +0x1 with ldrb and returns it via mov pc, lr (tail-return to lr). It touches no other
  memory, has no branches, and preserves nothing besides implicitly returning r0. Since the struct and its field
  at +1 have not been identified yet, the in-game meaning of this byte is unknown; the function is a plain one-byte
  field accessor on that singleton.
