name: object_runParam3StateHandler
address: '0x080BDAE0'
kind: function
status: probable
summary: Dispatches the battle object's per-state update handler indexed by its Param3 field (a second-level
  state machine step).
interface: (r0 = unused/scratch, r5 = battle object) -> r0 = handler result; runs handler [r5+oBattleObject_Param3]
  via table off_80BDAF4
details: Reads oBattleObject_Param3 from the object at r5, loads a thumb pointer from the 4-entry table
  off_80BDAF4, and calls it with mov lr,pc/bx r1 so the callee's lr return lands back in this function.
  State 0 and 1 run sub_80BDB04 and sub_80BDB3C, state 2 runs object_timer2CountTo15SetParam3C (waits
  on timer2, counts to 15, then sets Param3=3), and state 3 is nullsub_9 (done). Called unconditionally
  by sub_80BD89C right after that function's own CurPhase dispatch, so it acts as the object's sub-state
  (Param3) step, driven after the phase-level handler runs.
