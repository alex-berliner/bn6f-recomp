    table off_80BDAF4; table entries: sub_80BDB04, sub_80BDB3C, object_timer2CountTo15SetParam3C (state
    advances Param3 to 3), nullsub_9 (terminal state); caller sub_80BD89C at 0x080BD8A8 calls it right
    after its own CurPhase dispatch table, i.e. as the per-object state step'
