name: encryption_copyByteXor6fToToolkitBuffer_8006e3c
address: '0x08006E3C'
kind: function
status: confirmed
summary: Copies one byte from the table at byte_20004E0 to the toolkit's oToolkit_Unk2004a8c buffer, XOR'd with
  0x6F, as an obfuscation/encryption step.
interface: void encryption_copyByteXor6fToToolkitBuffer(u32 index /* r0 */); reads byte_20004E0[index], writes oToolkit_Unk2004a8c[index]
  = byte_20004E0[index] ^ 0x6F; no register outputs
details: 'Tiny obfuscation helper. Takes a byte index in r0, loads byte_20004E0[index],

  XORs it with the constant 0x6F, and stores the result at the same index in the

  buffer whose pointer lives at oToolkit_Unk2004a8c_Ptr inside the toolkit struct

  (reached via the r10 base pointer). No bounds checking, no loop — a single byte

  per call, so callers presumably iterate over the buffer elsewhere. The XOR with

  0x6F is its own inverse, so the same routine serves both encrypt and decrypt

  directions. All registers r1-r7 and the return address are saved/restored, making

  it fully transparent to the caller; the lifter''s listed "outputs" r5/r7 are just

  restored originals, not computed values.

  '
