  date: '2026-10-18'
  detail: step timer decrement with 'bgt locret' gates all work until countdown reaches 0; FuturePanelX/Y
    copied to PanelX/Y before object_removePanelReserve, matching a reserved-move commit; callee object_removePanelReserve
    'releases a battle panel previously reserved by a given object'; object_setCoordinatesFromPanels +
