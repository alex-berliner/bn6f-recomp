name: ai_attackCommitMove
address: '0x080FC398'
kind: function
status: probable
summary: AI attack step-timer handler that, when the step countdown reaches zero, commits the reserved
  panel as the object's new position (step/flick movement).
interface: (r5 = battle object, r7 = AI attack vars) -> void; r0 clobbered
details: Decrements oAIAttackVars_StepTimer in r7 and returns early while it is still positive. On expiry
  it sets the object's current animation to 3 (a move/step pose), copies FuturePanelX/Y into PanelX/Y,
  releases the previously reserved panel via object_removePanelReserve, recomputes pixel coordinates from
  the new panel position, and syncs collision panels plus facing. It then reloads StepTimer with 3 for
  the next step and sets oAIAttackVars_HitElement to 8, presumably the element/flag for the attack's hitbox
  check that follows this step. This looks like the per-step tick of a multi-step AI lunge attack (battlesweep
  route), where each step commits one panel of movement.
