name: initBackgroundTilemap
address: '0x080279FC'
kind: function
status: confirmed
summary: Copies the compressed tileset into the work buffer, builds 16-bit tile attributes from a 6-byte attribute
  table (chained via sub_8027CCC), then blits the 15x20 tile block 3 into the background tilemap.
interface: void initBackgroundTilemap(void /* preserves r4 r5 r6; clobbers r0-r3; reads r10 lr */);
details: 'Phase 1: CopyByEightWords copies 0x258 (600) bytes of tile pixel data from ROM

  (byte_86E64B4) into the working tile buffer at unk_2035000.


  Phase 2: Iterates a 6-byte-per-entry attribute table starting at byte_8027B2C,

  terminated by a 0xFF sentinel byte. Each iteration assembles a 16-bit tile attribute:

  the low 12 bits come from r2 (initially 0x9B, then returned by sub_8027CCC on the

  prior iteration — a chained carry), the high 4 bits come from byte[4] of the entry

  shifted left 12. The five bytes [0],[1],[2],[3],[5] are passed as r0,r1,r3,r4,r5

  alongside the assembled attribute in r2. sub_8027CCC presumably writes the final

  tile-map entry into the work buffer and returns a modified r2 for the next chain.


  Phase 3: CopyBackgroundTiles renders tile block 3 (a 32x32-pixel tileset block)

  into a 15-column x 20-row background tilemap region starting at grid position (0,0),

  using the populated tile-id grid at unk_2035000.


  r4, r5, r6 are saved/restored via stack so the caller''s values are preserved despite

  being clobbered by the loop and CopyBackgroundTiles.

  '
