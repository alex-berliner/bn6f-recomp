name: initBackgroundTilemap
address: '0x080279FC'
kind: function
status: probable
summary: Initializes a 15x20 background tilemap in unk_2035000 by copying a base grid from byte_86E64B4,
  stamping rectangle entries from byte_8027B2C via sub_8027CCC, and uploading the result to BG tile block
  3.
interface: () -> void; no args, writes tilemap VRAM via callees
details: Copies 0x258 bytes (300 u16 tile ids) from byte_86E64B4 into the unk_2035000 grid buffer with
  CpuFastSet. Iterates a 6-byte entry list at byte_8027B2C until a 0xFF terminator, calling sub_8027CCC
  per entry with x=byte0, y=byte1, and start-index arg (byte4<<12)|0x9B — byte4 acting as a flag above
  the 0xFFF mask (likely the 'number down columns' bit), 0x9B as the constant base tile id. Bytes 2, 3,
  and 5 supply the callee's remaining rect parameters (width/height/etc.). Entries' return value (next
  tile index) is ignored, so every stamp restarts at 0x9B. Finally CopyBackgroundTiles(0, 0, 3, unk_2035000,
  15, 20) flushes the composed map into tile block 3 at the origin, covering the visible screen grid.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: CopyByEightWords( byte_86E64B4, unk_2035000, 0x258 ) pre-fills the 15x20 tile-id buffer with
    a default map; loop reads 6-byte records at byte_8027B2C, builds (byte4<<12)|0x9B, and calls known
    rect-stamper sub_8027CCC; exits when byte0 == 0xFF; tail calls known CopyBackgroundTiles(j=0, i=0,
    tileBlock=3, unk_2035000, j_size=0xF, i_size=0x14) — 15x20 = 300 = 0x258/2, matching the buffer size
