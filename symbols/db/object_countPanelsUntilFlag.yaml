name: object_countPanelsUntilFlag
address: '0x080E8486'
kind: function
status: probable
summary: Steps along the battle grid in a horizontal direction and counts panels until it hits one whose
  status flags match a per-type mask.
interface: (r0 = start column, r1 = start row, r2 = type/facing selector, r3 = facing flag) -> r0 = panel
  count reached before flagged panel, or 0xFF if the edge of the grid is reached first; flags clobbered
details: r2 indexes word table byte_80E84C8 (r2*4) to pick a flag mask (0x05000080 or 0x0A000080), and
  is also fed with r3 to object_getFlipDirection, whose ±1 result becomes the X step. Starting at (r0,r1),
  each loop iteration checks object_isValidPanel and, if valid, tests object_getPanelParameters's status
  word against the mask with tst; the coordinate result is discarded and the original (r0,r1) restored
  via push/pop. On a flag match it returns the loop counter r6; if the walk leaves the 6x3 grid it returns
  0xFF. So it measures, in panels, how far away the nearest panel with a given status (e.g. hole/broken-type
  flags) is along the row. The mask table may extend past the two visible words for other r2 values.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r7, [r7,r4] with r4 = r2*2<<1 loads the flag mask from byte_80E84C8 (words 0x05000080, 0x0A000080);
    bl object_getFlipDirection then add r0, r0, r4 makes the ±1 X step used each iteration; bl object_getPanelParameters;
    tst r0, r7; bne exit — loop ends on a panel whose status word matches the mask; beq loc_80E84C0 after
    object_isValidPanel returns 0xFF when the walk runs off the grid; Sole caller sub_80E84D0 sits immediately
    after, consistent with a helper for a grid scan
