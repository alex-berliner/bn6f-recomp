name: sub_8146BF4
address: '0x08146BF4'
kind: function
status: hypothesis
summary: Reads the state byte of the singleton object tracked by dword_2010CC0 and returns 1 if it is in state 0
  or 1, else 0.
interface: 'bool sub_8146BF4(void) // in: lr (return addr); out: r0 = 1 if state==0 or state==1 else 0; NZ/C/V left
  per final CMP/MOV so callers can branch'
details: Dereferences the global pointer at dword_2010CC0 (a singleton struct/instance, e.g. some manager or scripted
  object), loads its first byte as a state code, and returns TRUE (1) when the state is 0 or 1 and FALSE (0) for
  any other state. The two 'active' states (0 and 1) are treated as equivalent. Clobbers only r0/r1; tail-returns
  to lr. No flags are set intentionally beyond the leftover CMPs, so callers branch on r0 rather than flags in most
  patterns.
