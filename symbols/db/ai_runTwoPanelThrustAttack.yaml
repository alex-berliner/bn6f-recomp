name: ai_runTwoPanelThrustAttack
address: '0x080FC8FE'
kind: function
status: probable
summary: 'AI attack handler: lunges forward, spawning a hit collision two panels ahead plus visual effects
  on the two panels in front.'
interface: (r5 = battle object, r7 = oAIAttackVars block) -> r0 = clobbered; advances r7 StepTimer state
  machine until HitElement set to 0x14
details: 'Runs a small state machine over the caller''s AI attack variable block. On the first call (AttackElement
  == 0) it marks the attack as type 4, switches the object''s CurAnim to 5, spawns temp attack 0xb11 via
  battle_spawnTempAttackB11, plays SFX 0xB0, sets the object''s counter to 0xC, and stores 30 in oAIAttackVars_StepTimer.
  On later calls it decrements StepTimer: at 20 it places an AI attack collision two panels in front (frontDirection*2
  + PanelX, PanelY, arg 9) and spawns an effect object there with sprite flip*0x100 + 0x27; at 15 it spawns
  another effect one panel ahead with sprite flip*0x100 + 0x25; at 0 it writes 0x14 into oAIAttackVars_HitElement,
  which ends the attack. Panel coordinates come from object_getCoordinatesForPanels as 16.16 fixed-point
  for the effect spawner.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_80FC926: ldrh StepTimer / sub 1 / strh — a per-call countdown state machine; timer==0x14:
    object_getFrontDirection*2 + oBattleObject_PanelX, PanelY into ai_spawnAttackCollision — hit region
    two panels ahead; timer==0x14 and 0xf: spawn_t1_0x0_EffectObject with r4 = flip*0x100 + 0x27 / 0x25
    — directional effect sprites at the struck panels; first entry: strb #5 CurAnim, battle_spawnTempAttackB11(0xb11),
    PlaySoundEffect(0xB0) — attack initiation; timer<=0: mov r0,#0x14; strh oAIAttackVars_HitElement —
    signals the AI state machine the attack finished'
