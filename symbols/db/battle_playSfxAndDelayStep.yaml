name: battle_playSfxAndDelayStep
address: '0x080D715C'
kind: function
status: probable
summary: 'One phase step of a battle object''s action state machine: plays sound effect 0xB8, waits 10
  frames, then ends the action.'
interface: (r5 = battle object) -> r0 = clobbered; touches oBattleObject_CurPhase, oBattleObject_Timer,
  oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: r5 holds a battle object, not r0 (the routine is a thunk-style state handler). On phase 0 it
  stores phase 4, plays M4A sound effect 0xB8, and sets oBattleObject_Timer to 10. Each later call decrements
  the timer; once it goes negative, it writes CurAction = 4 and clears CurPhaseAndPhaseInitialized to
  0, signalling the object's action (action id 4) is finished. The phase is never explicitly re-zeroed
  on entry, so the decrement branch relies on CurPhase being nonzero from a previous step.
