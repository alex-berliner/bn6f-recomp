name: pet_getStatusIconIndex
address: '0x08119C08'
kind: function
status: probable
summary: Computes the graphics/palette index used for the PET status icon sprite, based on whether a Navi
  is present, event flag 200AD04, and the Navi's stats byte 0x10.
interface: () -> r0 = index into the PET status icon sprite resource table (0, 4, table[byte], or byte*5+0x12,
  +4 when no Navi)
details: 'If GetCurPETNavi says a Navi is selected, the result is just pet_GetNaviStatsBaseOrEmpty(0)
  (0, or 4 if the PET holds no Navi, stats byte 0xE == 0xFF). Otherwise it checks event byte 200AD04:
  if set, the same base 0/4 result is returned. If clear, it reads NaviStats byte 0x10; if that byte is
  zero the index is taken from lookup table byte_80203EA[byte], otherwise the index is computed as byte*5+0x12
  (5-byte stride, base 18). The final value is passed through pet_GetNaviStatsBaseOrEmpty, which adds
  4 when no Navi is equipped, and returned. Callers use the result to pick the sprite form (buildPetStatusIconSprite)
  and the palette for the PET status icon.'
