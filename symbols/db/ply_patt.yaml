name: ply_patt
address: '0x0814E0FC'
kind: function
status: confirmed
summary: Advance one step in a music pattern's playback (writes the next note pointer, bumps the step index, then
  yields via ply_goto) or signals end-of-pattern to ply_fine once all 3 steps are consumed.
interface: void ply_patt(u32 patt) /* r1 in; r4 r5 lr out; clobbers r0 r1 r2 r3 nzcv */
details: 'Operates on a pattern-state object addressed by r1. Reads the 8-bit step index at offset +2; if it is
  < 3 the routine computes a per-step slot pointer (patt + (step<<2)), pulls the 32-bit "next-note" address from
  offset +0x40, adds 4 to it, and stores it into that slot at slot+0x44. It then increments the step byte at offset
  +2 and tail-calls ply_goto to continue playback. When step already equals 3 (pattern fully consumed) it branches
  to ply_fine instead. The 0x40/0x44 offset pair looks like a note-stream cursor written into the per-step entry
  of a 4-entry (step 0..3) inline table.

  '
