open_questions:
- What sub_800FE28 does with the 0x101E283C descriptor (object search by id/coords?) is unknown
- Whether r4 is a pointer into the object struct (field at 0 vs 0x1E) or a scalar such as a frame delay
- Meaning of flag bits 0x8000 and 0x2000 in the object flag word
