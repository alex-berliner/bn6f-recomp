name: battle_aiAttackGetParam
address: '0x080F4A54'
kind: function
status: probable
summary: 'Helper for AI attack init: resolves an object from a constant descriptor and returns a value
  (or field offset) that is bumped by 0x1E when the object''s flag word has bits 0x8000/0x2000 set.'
interface: () -> r0 = value/pointer from sub_800FE28, +0x1E if (flags & 0xA000); flags clobbered by bl
  calls
details: Passes the address of the constant dword 0x101E283C to sub_800FE28, whose return value is kept
  in r4; since object_getFlag is then called with no new argument setup, sub_800FE28 most likely returns
  a battle object pointer located via that descriptor. object_getFlag returns the object's first collision-flag
  word, which is tested against 0xA000 (bits 15 and 13). If either bit is set, 0x1E is added to r4, so
  the result is either the raw value or the value plus 30 — consistent with returning either a pointer
  to an alternate struct field at +0x1E or a frame delay/param with a 30-unit penalty. Only its single
  caller battle_initAiAttack (attack id 2) is known, so the meaning of the +0x1E adjustment and the descriptor
  layout remain inferred.
