name: object_appearWaitState
address: '0x080C2E30'
kind: function
status: probable
summary: 'Battle-object phase handler: one-shot appear setup (anim 3, mirrored flip, panel coords) then
  a 3-frame wait before advancing to phase 0x18.'
interface: (r5 = battle object ptr, r7 = ptr with panel XY at +0x10) -> void; updates object's phase state
details: Runs as a per-object state function keyed off oBattleObject_PhaseInitialized. On first entry
  it clears RelatedObject1Ptr, sets CurAnim to 3, computes a flip value as (Alliance XOR DirectionFlip)
  XOR 1 and passes it to sprite_setFlip (i.e. sprite drawn mirrored relative to its side), sets Timer
  to 3, copies the panel coordinate halfword from [r7+0x10] into PanelXY and converts it to pixel coordinates
  via object_setCoordinatesFromPanels, then marks itself initialized (PhaseInitialized = 4). On subsequent
  calls it decrements Timer; when it hits 0 it writes 0x18 into CurPhaseAndPhaseInitialized, chaining
  to the next phase. The r7 source of the panel coords is presumably the spawning/parent object, making
  this a spawned-object placement-then-wait state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'first-run branch: str #0 RelatedObject1Ptr, mov #3 CurAnim, eor Alliance/DirectionFlip/1 ->
    sprite_setFlip (80C2E30 init block); mov r0,#3; strh Timer then ldrh Timer; sub #1; bgt — a 3-frame
    countdown gate; ldrh r0,[r7,#0x10]; strh PanelXY; bl object_setCoordinatesFromPanels — copies a panel
    XY halfword from r7 and repositions the object; mov r0,#0x18; strh CurPhaseAndPhaseInitialized after
    timer expiry — transitions to the next phase; mov r0,#4; strb PhaseInitialized — standard ''state
    already initialized'' latch used by other object phase handlers'
