    run wf investigate investigate-20261019-003606'
open_questions:
- Which battle object uses this state (no callers known), and what phase 0x18 does next
- What r7 points to (likely the spawner/parent object whose panel XY at +0x10 is inherited)
- What anim 3 depicts for this object
