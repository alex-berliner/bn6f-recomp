name: sub_80D1EE8
address: '0x080D1EE8'
kind: function
status: hypothesis
summary: Resets an object's HP gauge/display state, storing state id 8 and clearing its value halfword.
interface: void sub_80D1EE8(void *obj /* r0 */)
details: 'Tiny two-write setter on a structure passed in r0: writes byte 8 to offset +9 (a state/kind field) and
  stores 0 into the halfword at offset +0xA (a value/amount field). The state value 8 plausibly means "empty/hidden"
  for a battle HP gauge attached to a battle object, with the halfword being the displayed/remaining gauge value;
  both are set together so callers can reinitialize the gauge before it is drawn or refilled. Tail-calls nothing
  and touches nothing else; r1 is scratch and flags are clobbered.

  '
