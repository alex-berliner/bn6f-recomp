summary: 'Thumb interworking trampoline that tail-calls the real implementation `_object_getPanelDataOffset` (loaded
  via `off_800C914: .word _object_getPanelDataOffset+1`) with the caller''s r0 and r1 forwarded unchanged.'
interface: void object_getPanelDataOffset(u32 r0, u32 r1) /* r0,r1 in; r0-r3, lr, C, V out; N,Z clobbered */
details: 'Pure interworking trampoline in the form `push {lr}; ldr r2, =callee+1; mov lr, pc; bx r2; pop {pc}`.

  The ldr loads the Thumb entry word stored at `off_800C914` (i.e. `_object_getPanelDataOffset+1`)

  into r2, `mov lr, pc` then `bx r2` tail-calls the real routine. When that routine returns

  into the trampoline, `pop {pc}` returns directly to the trampoline''s caller. Net effect is a

  tail call: r0, r1 are forwarded from the caller, and r0-r3, lr plus the C/V condition flags

  produced by the callee are passed back to the caller verbatim; N/Z are clobbered by the `bx`

  flag update. No result is copied back explicitly. No game structures are touched directly here;

  all real work and field access happens in `_object_getPanelDataOffset`.

  '
