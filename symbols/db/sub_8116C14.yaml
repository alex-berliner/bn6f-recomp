name: sub_8116C14
address: '0x08116C14'
kind: function
status: confirmed
summary: Moves a sprite along one axis by 8x its signed scroll-speed field, then if the coordinate went negative
  clears its scale counter and marks it unscalable (it has scrolled off/shrunk away).
interface: void sprite_scrollStepAndCullOffscreen_8116C14(Sprite* sprite /* r7 */); returns with r0/r1 = resulting
  coordinates (from sprite_getCoordinates), flags from CMP of that coordinate vs 0 (or from the reset callee when
  it fires)
details: 'Caller-supplied r7 points at a sprite/scrolling-object struct. Reads a signed

  16-bit value at sprite+0x10 (a per-axis speed/scroll delta), multiplies it by 8,

  and passes it as dx to sprite_addCoordinates with dy = 0 — so the sprite moves

  horizontally (or along whichever axis addCoordinates treats as first) by

  8*(s16)(sprite+0x10) pixels. Then calls sprite_getCoordinates and compares the

  returned coordinate against 0; if it is now negative, calls

  sprite_clearScaleCounterAndMakeUnscalable_804668A to reset the sprite''s scale

  counter and flag it non-scalable — the "shrunk/scrolled away" state used by

  perspective-scrolling backgrounds/objects. The dword_8116C34 literal 0x20 sits

  in the pool right after the routine (unused inline, likely a shared constant).

  r4-r6 are passed through untouched per the contract (preserved r4-r7).

  Trampoline-style tail: returns to caller via the standard RETURN_TO_CALLER

  mechanism, so r0-r3/lr/flags are all considered outputs by the lifter.

  '
