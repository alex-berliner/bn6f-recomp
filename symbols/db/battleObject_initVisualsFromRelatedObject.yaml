name: battleObject_initVisualsFromRelatedObject
address: '0x080B8600'
kind: function
status: confirmed
summary: Sets up a battle object's sprite visuals by cloning the sprite resource, palette and current animation
  from its related object, then advances it to the update state.
interface: battleObject_initVisualsFromRelatedObject(r5 = battle object, r10 passthrough) -> r5 = battle object,
  r8-r12 = callee register image; clobbers r0-r4, r6, lr and flags; preserves r7
details: Runs on a battle object whose visuals should mirror a related object (oBattleObject_RelatedObject1Ptr).
  Loads the standard battle sprite resource (sprite_load with args 0x80, 0x10, 0x30), loads its animation data,
  and marks the sprite as casting no shadow (sprite_noShadow). It then reads the related object's palette via sprite_getPalette
  and applies it to this object with sprite_setPalette, copies the related object's oBattleObject_CurAnim byte into
  this object's oBattleObject_CurAnimAndCurAnimCopy (value/copy pair written as a halfword), applies that animation
  with sprite_setAnimation, reloads animation data, and calls sprite_update to apply the frame. Finally it stores
  CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized to advance the object's state machine,
  and tail-calls battleObject_syncVisualStateFromRelatedObject_80B863A to finish the remaining visuals from the
  related object's state. The object pointer lives in r5 throughout and is chained through every sprite helper call
  since those helpers may replace it; r10 is only passed through to the sync helper.
