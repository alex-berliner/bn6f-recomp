name: battleSweepTick
address: '0x080FB6C0'
kind: function
status: probable
summary: Per-frame tick for the BattleSweep chip, animating a sweep count and playing a sweep SFX once.
interface: (r5 = entity?, r7 = chipState?) -> void; preserves r4,r6
details: Drives a small state machine on a chip control struct at r7. On the first call (byte [r7+1] ==
  0) it sets the state to 4, writes 0x12 to [r5+0x10], calls sub_80FB874, plays sound effect 0x20 (0x21+0xFF)
  via PlaySoundEffect, and stores byte [r7+0xE] into the halfword at [r7+0x10] as a duration/frame counter.
  Subsequent calls decrement that counter; when it reaches zero it decrements byte [r7+0xD] (a sweep remaining
  count). If more sweeps remain it clears state to 0 to re-trigger the animation; if none remain it writes
  0x10 to the halfword at [r7] as a terminal/done state.
