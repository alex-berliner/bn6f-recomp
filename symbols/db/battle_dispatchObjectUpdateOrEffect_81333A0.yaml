    high nibble). - `off_81333EC` defines 5 words whose entries are stored `+1` for Thumb bit set, listed at 0x081333EC.
    - `mov lr, pc; bx r0` at 0x081333B2 is the canonical Thumb tail-call pattern; no lr push means it is a jump,
