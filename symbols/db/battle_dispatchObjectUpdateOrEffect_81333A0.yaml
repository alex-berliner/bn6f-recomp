open_questions:
- Whether off_81333EC's index is the upper nibble or the lower nibble of [r5+2]; the code does `ldrb r1,[r5,#2]`
  and indexes a 5-entry table, but only constants 0..4 appear in the dispatch fall-throughs (the 0xC path is intercepted
  above), strongly suggesting either indexing by upper nibble of a packed byte OR a separate "TypeAndSpriteOffset"
  mask not visible here. The exact masking (high vs low nibble) would settle which battle-object Type set maps to
  which handler.
- What each of the 5 handlers does; only the first one (battle_objectUpdate_8133400) has a name hint.
- Whether sub_81345D4/45E8/4610 are sequential independent effect spawns or one combined "spawn chain" is not clear
  from this dispatch alone.
