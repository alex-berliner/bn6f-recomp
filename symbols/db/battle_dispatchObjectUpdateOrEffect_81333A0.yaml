summary: 'Battle object dispatcher: jumps to one of five per-object update handlers (by [r5+2].Type), runs shared
  post-update steps (entity handler loop, eStruct sprites), then conditionally spawns one of three battle effects.'
interface: (r5 = current battle object pointer, r10 = toolkit, lr = ret) -> void ; tail-calls update handler; tail-calls
  entity/sprite update; conditionally tail-calls one of sub_81345D4, battle_spawnFixedArgEffect_wrapper_81345E8,
  sub_8134610 (Type != 0xC, [r5+3] != 0xC), or sub_81345FC (Type == 0xC, [r5+3] != 0)
details: "- Reads [r5+2] (object header's TypeAndSpriteOffset high nibble = Type) at 0x081333AE; multiplies it as\
  \ an index into the off_81333EC dispatch table containing 5 function pointers (battle_objectUpdate_8133400, sub_81337C4,\
  \ sub_8133434, sub_8133484, sub_8133788) and tail-calls the selected one via `mov lr, pc; bx r0` at 0x081333B4.\n\
  \  - Then unconditionally calls battle_setFieldsFromObj_81340FC, sub_8134490, entity_runAllUpdateHandlers_80465BC,\
  \ and battle_updateEStructSprites_80465F8 at 0x081333BA-0x081333C2.\n  - After that, re-reads [r5+2] (0x081333C4):\
  \ if Type == 0xC, branch to loc_81333DA (0x081333D2), which checks [r5+3]==0 to early-return; otherwise calls\
  \ sub_81345FC.\n  - The other branch (Type != 0xC) at 0x081333CA first checks if [r5+3] == 0xC; if so, skips the\
  \ three-effect spawn (loci_81333E4 early-return), else at 0x081333CC tail-calls sub_81345D4, battle_spawnFixedArgEffect_wrapper_81345E8,\
  \ and sub_8134610 in sequence.\n  - The contract says in includes r5 (the caller's r5 is preserved across the\
  \ tail-calls since the bx chain doesn't touch it), and the lr is preserved via the thumb BX/LR trampoline pattern.\n\
  \  - Captured exits consistently show r0=0, flags -Z--, confirming no return-value contract.\n  - 40 snap entries\
  \ with identical r0/r1/r2/r3 (081333a1 thumb bit, 0x04, 0x0, 0x02001c04) and matching exit state demonstrate the\
  \ dispatch is invoked once per battle-object tick from a stable caller (sub_813320C lr) with consistent environment.\n"
