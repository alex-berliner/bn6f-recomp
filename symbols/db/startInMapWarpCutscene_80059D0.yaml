name: startInMapWarpCutscene_80059D0
address: '0x080059D0'
kind: function
status: confirmed
summary: Sets the two story event flags that mark the in-map warp event as started, then launches the "on in-map
  warp" cutscene.
interface: void sub_80059D0(GameState *self /* r5 */); sets NZCV per SetEventFlagFromImmediate; clobbers r0-r3,
  lr; preserves r2, r5
details: 'Tail of / entry into an in-map warp event handler: it raises two event flags in event word 0x17 — bit
  3 (EVENT_1703) and bit 0x38 (EVENT_1738) — via SetEventFlagFromImmediate, then calls StartCutscene with the CutsceneScript
  at CutsceneScriptOnInMapWarp_8098a78 and parameter 0. The flags presumably record that the warp was used / the
  warp scene began so it cannot repeat. Caller''s r5 (GameState) is passed through untouched; return is via pop
  {pc} straight back to the caller.'
