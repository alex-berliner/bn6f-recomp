name: battle_spawnDebrisBurst
address: '0x080D5516'
kind: function
status: probable
summary: Spawns three short-lived debris/particle effects at a battle object's position, each flying with
  a preset velocity, starting from a random entry in a 4-entry velocity table.
interface: (r5 = battle object whose oBattleObject_X/oBattleObject_Y fields give the spawn point) -> r0
  = spawn-subroutine result of last call; clobbers r4, r6, r7
details: Rolls GetPositiveSignedRNG and masks to 0-3 for a starting table index, then loops three times.
  Each iteration loads two 16.16 fixed-point values from byte_80D5550 + index*8 into r6/r7 and calls sub_80E1084
  with r0=2, r1=object X, r2=object Y, r3=0 — the table words decode to (xvel,yvel) pairs of (0.5,2.5),
  (-0.5,3.0), (1.0,2.5), (-0.5,1.5). The index wraps with &3 and increments each iteration, so the three
  particles use three consecutive table entries. r5 is never set or saved here, so callers must place
  the object pointer in r5. The r6/r7 argument passing is nonstandard and only safe if sub_80E1084 treats
  them as inputs.
