- method: assembly-reading
  date: '2026-10-19'
  detail: bl GetPositiveSignedRNG; and r6, r0 masked to 2 bits picks the random start index; loop runs
    exactly 3 times (cmp r4,#2 / bmi) re-reading byte_80D5550 + r6*8 each pass; table words 0x00008000/0x00028000
    etc. decode as clean 16.16 fixed-point velocity pairs; bl sub_80E1084 with r0=2, r1=[r5,X], r2=[r5,Y],
