name: ai_attackStepWaitCurAnim0
address: '0x080FF01E'
kind: function
status: probable
summary: AI attack-state handler that waits out the configured attack duration, then exits the attack
  state.
interface: (r0 = unused here, r7 = oAIAttackVars, r5 = battle object) -> r0 = object_exitAttackState result
  on expiry; no meaningful return otherwise
details: 'Reads oAIAttackVars_AttackElement as a state marker: if it is 0, the function initializes the
  attack — writes element 4 to AttackElement, sets oBattleObject_CurAnim to 0, and copies oAIAttackVars_AttackDuration
  into oAIAttackVars_StepTimer as the countdown. If the element is already nonzero, it decrements StepTimer
  each call; once the timer reaches zero it calls object_exitAttackState to leave the attack. So the routine
  is a two-phase per-frame step: setup on first call, frame-countdown on later calls. Element 4 presumably
  marks this attack as in progress / a specific element for the AI''s current attack.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst r0,r0; bne loc_80FF034 — zero element selects
    the init branch; strb r0(4),[r7,#oAIAttackVars_AttackElement]; strb r0(0),[r5,#oBattleObject_CurAnim]
    — init sets element marker and resets animation; ldrh r0,[r7,#oAIAttackVars_AttackDuration]; strh
    r0,[r7,#oAIAttackVars_StepTimer] — duration becomes the countdown timer; loc_80FF034: sub r0,#1; strh
    r0,[r7,#oAIAttackVars_StepTimer]; bgt skip — countdown on repeat calls; bl object_exitAttackState
    when timer hits 0 — ends the attack state'
