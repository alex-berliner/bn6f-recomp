name: install_object_state_handler_811CA1C
address: '0x0811CA1C'
kind: function
status: confirmed
summary: Initialise and install the sprite state handler for a generic object, marking it as state 0x23 during sprite
  setup, then transitioning to state 4.
interface: void sub_811CA1C(void);  // r5 = object record pointer (in); no out regs/flags exposed to caller (r5
  preserved)
details: "Treats r5 as a pointer to a 3-field object record: byte at +0 is the current\nstate byte, byte at +4 is\
  \ a palette-bank index, byte at +8 is the \"next\nstate\" byte. The function:\n  1. Sets +0 = 0x23 (\"initialising\
  \ sprite\" sentinel).\n  2. Loads graphics/animation tables via loc_8002774 (args 0x89, &unk_201BA04).\n  3. Runs\
  \ the standard sprite configuration chain: setAnimation(0),\n     loadAnimationData, noShadow, makeScalable, setScaleParameters(0,\
  \ 0x80, 0x80)\n     (uniform non-scaling scale).\n  4. Sets the palette bank to r5+4 (palette_index) via\n   \
  \  sprite_setSubEntryPaletteBank_800304A.\n  5. Calls slotList_storeHalfwordAndClearField_800306C with\n     (palette_index\
  \ * 0x30 + 0x80) as the slot address.\n  6. Priority and sub-record field A both set to 0; coordinates set to\
  \ (0, 0).\n  7. Writes next-state byte at +8 = 4.\n  8. Calls object_SetStateHandler_811CC4E; if it succeeds it\
  \ dispatches to\n     sub_811CA94, otherwise it undoes the scalable setup with\n     sprite_clearScaleCounterAndMakeUnscalable_804668A\
  \ and returns.\nHard-coded values pulled into the call: state sentinel 0x23, graphics id 0x89,\nscale 0x80/0x80,\
  \ scale slot base 0x80, slot stride 0x30, target state 4.\n"
