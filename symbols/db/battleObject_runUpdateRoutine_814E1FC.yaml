summary: 'Tail thunk: invokes sub_814E0D0 with (r0=ActorType ptr, r1=AIData ptr), then sets AIData.Unk_0f=r3
  result and OR-s 0xC into AIData byte 0; returns the actor-type pointer.'
interface: '(r0 = ActorType-ish pointer, r1 = AIData pointer) -> r0 = same pointer ; side effect: AIData[0]
  |= 0x0C, AIData[0xf] = r3 (from sub_814E0D0 return)'
details: "Saves lr in r12, then calls sub_814E0D0 (\"battleObject_runUpdateRoutineAndAdvancePC\"). After\
  \ the call, the low byte of r1 (which is the first byte of AIData — `ActorType`) is read and OR-ed with\
  \ 0x0C and written back (`strb r3, [r1]` after setting `r3 = 0x0C | AIData[0]`). Then the byte r3 returned\
  \ by 814E0D0 is stored into AIData+0xF (`Unk_0f`). Returns to the saved lr (it is a thunk: stores lr\
  \ into r12 via `mov r12, lr; bl ...; bx r12`).\n  - byte[0] = ActorType (u8). OR-ing 0x0C sets the low\
  \ nibble's bits 2 and 3 (0x0C = bits 2+3).\n  - byte[0xF] = Unk_0f storage for the routine's return\
  \ value.\n  - The bytes that follow in the function are 0x00,0x00 (likely padding/thumb branch alignment).\n"
