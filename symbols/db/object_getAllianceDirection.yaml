name: object_getAllianceDirection
address: '0x0800E2C2'
kind: function
status: confirmed
summary: Converts an alliance/side id into a facing direction multiplier (+1 for player side, -1 for enemy side).
interface: int object_getAllianceDirection(int alliance /* r0 */); returns 1 - 2*alliance in r0, sets N/Z/C/V from
  the final rsbs
details: 'Trivial helper mapping an alliance id to a signed direction multiplier:

  alliance 0 (player side) -> +1, alliance 1 (enemy side) -> -1.

  The computation is lsl r0,#1; sub r0,#1; neg r0,r0, i.e. r0 = -(2*alliance - 1) = 1 - 2*alliance.

  The final NEG is an RSBS (0 - value), so it is flag-setting: N/Z come from the result

  (Z set when alliance is neither 0 nor 1, i.e. result 0), C is the borrow of the negation

  (clear when the input operand was 0, i.e. alliance==... when 2*a-1==0), V set on overflow.

  Any alliance id other than 0/1 yields 0 or negative values depending on the low bit only,

  since only bit 0 of the id survives (lsl then sub keeps 2*a-1, whose sign/magnitude depends

  on the whole id). Tail-calls back via mov pc, lr (returns to the caller''s lr).

  '
