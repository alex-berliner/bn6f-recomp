name: sub_8047B88
address: '0x08047B88'
kind: function
status: confirmed
summary: Builds the filtered, deduplicated list of purchasable items for the active shop context (regular shop or
  PET-navi shop) into the shared display buffer at 0x2019A00 and returns the valid slot count.
interface: u32 shop_buildFilteredList_8047B88(u32 modeData /* r0 */, u32 modeContext /* r5, deref at +0x1c */, u32
  toolkit /* r10 */) -> u32 count /* r0 */; r4-r7 preserved; nzc flags clobbered
details: "Zero-fills 128 bytes (16 × 8-byte item slots) at byte_2019A00, then branches on mode\n(field 0 of the\
  \ structure at r5+0x1c):\n\n• Regular shop (mode != 2): source list = toolkit[oToolkit_ShopDataPtr] +\n  modeData[oModeData_ItemBase],\
  \ length modeData[oModeData_ItemCount]. For each\n  8-byte entry {type u8, stock u8, num u16, category u8, flag\
  \ u8, extra u16}:\n  skip if type==0 or stock==0; skip if (type,num,category) duplicates the last\n  accepted\
  \ entry; skip if sub_8047CB0(type,num) rejects it; additionally skip\n  type 1 num 0x70 when the player has an\
  \ active PET navi (GetCurPETNavi != 0).\n  Survivors are copied into the buffer sequentially. Final pass counts\
  \ entries\n  whose stock byte is non-zero.\n\n• PET-navi shop (mode == 2): source list = byte_201AE00. For each\
  \ entry: skip if\n  sub_8047CA8(num) rejects it; copy 8 bytes into the buffer. If the entry's num\n  equals the\
  \ target passed in r4 (saved as r3) and stock != 0xFF, decrement stock\n  in both source and output (a \"consume\
  \ one\" side effect). Final pass counts\n  entries whose num halfword is non-zero.\n\nOutput buffer layout (0x2019A00):\
  \ 16 slots × 8 bytes:\n  +0 type(u8) +1 stock(u8) +2 num(u16) +4 category(u8) +5 flag(u8) +6 extra(u16)\n"
