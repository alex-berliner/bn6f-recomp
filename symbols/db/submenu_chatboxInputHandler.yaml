  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The name and details largely fit the code: the event-flag guard at 0x081336C8, adjust-cursor with
    mask 7/min 0/max 7 at 0x081336D6, A-branch storing 0 or 4 to r5+0x68 at 0x081336FA, and B-branch running
