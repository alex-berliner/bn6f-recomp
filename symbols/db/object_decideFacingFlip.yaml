name: object_decideFacingFlip
address: '0x080C9F18'
kind: function
status: probable
summary: Decides whether the battle object should flip its facing this tick, stores it in DirectionFlip,
  and returns the resulting facing side.
interface: (r5 = battle object) -> r0 = new facing direction (result XOR alliance); writes oBattleObject_DirectionFlip
details: 'Calls object_getFrontDirection, then reads the object''s PanelX/PanelY and fetches alliance-dependent
  panel parameters from table off_80C9F64. sub_800D120 (args from that lookup) returning nonzero forces
  result 0 (no flip). Otherwise battle_pickRandomRowObjectFields_810971A picks a random object in the
  row at PanelY: any pick (or PanelX equal to (Alliance^1)*5+1, the column adjacent to the enemy-side
  front) sets result 1 (flip). The result is stored to oBattleObject_DirectionFlip and returned XORed
  with Alliance, so the caller receives the final facing multiplier. The alliance-parameter table at off_80C9F64
  holds two entries whose words (0x4000000/0x8000000) look like pointers or IDs whose meaning is unclear.
  object_getFrontDirection''s result is kept in r4 but apparently unused, a quirk of the original code.'
