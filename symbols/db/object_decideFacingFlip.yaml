open_questions:
- what sub_800D120 checks with the panel-parameter args (it gates the flip off)
- what the random row-object pick at PanelY means for the behavior (a target? an obstacle?)
- what the table entries 0x4000000/0x8000000/0x348000 point to or encode
- why object_getFrontDirection's result is unused
