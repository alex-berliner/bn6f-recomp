name: chatbox_expandWordTable
address: '0x08049D98'
kind: function
status: probable
summary: Thin wrapper that expands a text-script word-index table into per-byte 8-byte command records
  via sub_803BEC0.
interface: '(args passed through to sub_803BEC0: r0 = word-index table pointer, r1..r3 = as callee requires)
  -> r0 = callee''s return; flags clobbered by callee'
details: 'The function is a 4-instruction wrapper: it preserves r4-r7 and lr, tail-calls sub_803BEC0 with
  arguments untouched, and returns with the callee''s result. Since sub_803BEC0 is already known to take
  a static table of text-script word indexes and write per-byte 8-byte command records into a RAM buffer,
  this routine exists only as an indirect entry point to that expansion (likely so callers at 0x812A058
  and 0x812A2EC reach it through a hookable/relocatable address). It touches no state of its own.'
