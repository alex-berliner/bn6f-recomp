name: sub_81196C4
address: '0x081196C4'
kind: function
previous_names: []
status: hypothesis
summary: SubMenu index dispatcher that jumps to one of five handler routines based on `oSubMenu+0x9` (Idx_00's neighbour
  byte), via a Thumb-BX table, then returns through `lr`.
interface: '(r5 = oSubMenuPtr implicit, r9 = toolkit implicit) -> r0 = 0x40000000 ; side effects: jumps to one of
  five handler routines and returns to caller; no other saved-state effects.'
details: "- Function is a tail-call dispatcher: `push {lr}` / `pop {pc}` — `lr` is restored as `pc`, so this returns\
  \ to *its* caller's caller (caller seeds `lr` with the return target).\n  - Loads the dispatcher table address\
  \ `off_81196D8`, reads a `u8` at `r5 + 0x9` (this is the byte immediately after `oSubMenu.idx_00`, i.e. an index/state\
  \ byte inside the `oSubMenu` record), indexes into the table, and `bx`-jumps there.\n  - Table `off_81196DC` holds\
  \ 5 ARM-mode entry points (note the `+1` Thumb flag): `submenu_updatePanelChipInfoIfDirty_81196F0+1`, `sub_8119730+1`,\
  \ `sub_811974C+1`, `npc_stepChainSetState0x10_811975C+1`, `sprite_stepZoomShrinkOut_811976C+1`.\n  - The table\
  \ size (5 entries) and the named handlers strongly suggest these are the per-`Index_00` actions for the SubMenu\
  \ subsystem (update, two unknown helpers, an NPC chain step that sets state 0x10, and a \"zoom shrink out\" sprite\
  \ animation step).\n  - Entry `r0` is the return address +1 (caller sets Thumb bit via the `bl` from `0x081196ae`,\
  \ i.e. `sub_81196AC`+2); entry r2/r3 are scratch; on exit r0=0x40000000 NZ cleared (set by the called handler,\
  \ not this dispatcher).\n  - Despite the contract listing `may_write` for many regs, those are written by whichever\
  \ handler is dispatched through the table — this dispatcher itself only mutates `r0`, `r1`, `lr` and the low flags.\n\
  \  - Naming: keep `_ADDRESS` suffix because the table contents are partially inferred (only 3 of 5 targets have\
  \ project summaries).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` ... `pop {pc}` at 0x081196c4 / 0x081196d4: explicit tail-call (return-via-lr) pattern.
    - `ldrb r1, [r5, #9]` at 0x081196ca: reads index byte from object held in r5; per `oSubMenu`, byte 0x9 is the
    first state/index byte beyond the explicit `idx_00` at +0. - `ldr r0, off_81196D8` then `ldr r0, [r0, r1]` then
    `mov lr, pc; bx r0`: standard ARM/Thumb jumptable dispatch. - Table at 0x081196dc holds exactly 5 `+1` Thumb
    targets. - One target `npc_stepChainSetState0x10_811975C` is consistent with `oSubMenu` having sub-systems;
    `sprite_stepZoomShrinkOut_811976C` matches the `object_sprite_struct` traversal path typical of SubMenu close
    animations. - Captured-call `r5` is consistently non-zero across 40 story captures and `r0` on entry is `0x081196c5`
    (= function+1, `bl` Thumb return address).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x081196C4

    '
  result: the body read as described above
