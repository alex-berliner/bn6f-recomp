open_questions:
- Which SubMenu state each of the five table entries handles (only 3/5 are summarised by the project; the two `sub_`
  stubs at 0x08119730 and 0x0811974c are unknown).
- Whether `r5` always points at the same `oSubMenu` instance or can vary; the captured calls all use the same pattern
  but only a slice is shown.
- Whether the `r0=0x40000000` exit value is meaningful to the caller or just leftover from the most-recently dispatched
  handler (callee `sprite_setUnk0x2cFromLoader_81198E8` writes such a base — but it's not a direct callee here,
  only reachable via the dispatch).
