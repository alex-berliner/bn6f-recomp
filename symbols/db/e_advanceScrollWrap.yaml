open_questions:
- What game element owns eStruct200FE00 and what the +0x6/+0x4 selector values (1/5, 0/9) mean
- What units the r0 argument and the 140 wrap period are in (pixels of a scroll? frames of an animation?)
- What sub_81453F0 does between its six call sites, which would pin down the caller-side state inputs
- Whether states 2, 4 and 6 are handled elsewhere (this function only transitions into them)
