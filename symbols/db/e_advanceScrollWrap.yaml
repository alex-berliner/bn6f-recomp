name: e_advanceScrollWrap
address: '0x081455E8'
kind: function
status: probable
summary: Advances a small state machine in the eStruct200FE00 object, computing wrapped halfword counters
  via mod 140 and moving through states 5/6 → 1 → 2/3 → 4.
interface: (r0 = integer operand for the mod-140 wrap calculation) -> r0 = 0 (clobbered); writes state
  byte +0x7, config bytes +0x6/+0x4 and counter halfwords +0x1A/+0x1C of eStruct200FE00
details: The function ignores its argument except in state 1, where it computes r0 % 140 (0x8C), stores
  the remainder at +0x1A and 140-remainder at +0x1C, then sets state 2 if the remainder is nonzero else
  3. In state 5 (entered only when state == 5) it copies +0x1C to +0x1A, writes 1 to +0x6 and 5 to +0x4,
  then goes to state 6 if +0x1C is nonzero else state 1. State 3 clears +0x6, sets +0x1A to 40, +0x4 to
  9, and advances to state 4. The bytes at +0x6 and +0x4 look like mode/sub-controller selectors and the
  halfwords at +0x1A/+0x1C like paired scroll/phase counters that wrap over a 140-pixel period, so this
  reads as a periodic wrap/reposition step for whatever background or animated element owns struct 0x200FE00.
