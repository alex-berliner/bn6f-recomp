name: getChip8021DA8
address: '0x08021AA4'
kind: function
status: confirmed
summary: Returns a pointer to the 44-byte chip data record for a given chip ID in the static chip database (206
  entries).
interface: ChipData* battle_getChipData_8021DA8(int which_chip /* r0 */); sets c/v (and nz) from the final address
  ADD
details: 'Pure address computation: multiplies the chip index in r0 by 44 (the size of one ChipData entry) and adds
  the base of ChipDataArr_8021DA8, an array of 206 chip records (206 * 44 = 9064 bytes total). Returns the entry
  pointer in r0; r1 holds the table base and r2 holds 44 on return as scratch side effects. Because the final add
  is an ADDS, the c/v flags reflect the address addition and some callers may branch on them, though nothing meaningful
  is signaled by them here. No bounds checking on the index — callers must pass a valid chip ID (0..205); out-of-range
  values simply index past the table. The 2 bytes of padding after the mov pc, lr keep the following literal word
  aligned. Typical use is anywhere chip name, class, element or other static chip metadata is looked up by ID.

  '
