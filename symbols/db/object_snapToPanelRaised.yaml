  date: '2026-10-19'
  detail: 'bl object_setCoordinatesFromPanels before the Y edit: pixel position derived from panel grid;
    add r0,r0,r1 with r1=0x80000 then str to [r5,#oBattleObject_Y]: shifts Y by 8 px fixed point; str
    r1,[r5,#oBattleObject_Z]: sets the height/elevation field to the same 8.0 constant; four callers all
    in one nearby code block (0x80D6580/6694/66E2/6810) share this placement idiom'
