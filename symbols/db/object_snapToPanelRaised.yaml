name: object_snapToPanelRaised
address: '0x080D67D2'
kind: function
status: probable
summary: Places a battle object at its panel's pixel position but raised 8 px, setting its height field
  to 8.
interface: (r5 = battle object ptr) -> void; updates oBattleObject_Y and oBattleObject_Z
details: First calls object_setCoordinatesFromPanels to derive the object's screen X/Y from its grid panel
  coords. It then loads oBattleObject_Y, adds 0x80000 (8.0 in 16.16 fixed point, i.e. 8 pixels downward
  on screen), and stores it back. Finally it writes 0x80000 into oBattleObject_Z, the object's elevation/height
  field, so the object sits at a fixed 8 px altitude. The constant is stored in a literal pool (dword_80D67E8)
  and reused for both the Y offset and Z. Callers in the same 0x80D65xx–0x80D68xx region all use this
  as a 'reposition onto panel, then elevate' step, likely for an object/obstacle whose placement must
  visually float above the tile.
