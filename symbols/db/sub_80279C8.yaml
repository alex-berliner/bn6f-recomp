open_questions:
- Exact semantics of customScreen_redrawChipSlot_8029CD4's r1 flag (selected vs unselected slot rendering) — guessed
  from the bgt/inc pattern. Settling it would require disassembling 0x8029CD4 to confirm how r1 affects the draw.
- Whether sub_802899C and battle_endingBgUpdate_8029D34 are part of the "chip-select retire" sequence or simply
  always-on per-frame hooks — confirmed sub_802899C is the cust-gfx FIFO loader, but whether it is unconditionally
  requeued here or whether it depends on prior state is unclear.
