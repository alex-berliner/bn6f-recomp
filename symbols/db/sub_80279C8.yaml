name: sub_80279C8
address: '0x080279C8'
kind: function
previous_names: []
status: hypothesis
summary: 'Finishes the chip-select subsystem: ticks the selection anim, refills a 4-slot chip row, then runs the
  Custom-screen exit sequence.'
interface: '(r5 = *S20364C0, r10 = *Toolkit, lr) -> void ; side effects: writes to chip-select state at r5+8 (NumChipsSelected)
  and to Toolkit/BattleObject state during the exit sequence'
details: "- Pushes {r4,lr}; calls battleObject_chipSelectAnimTick_8029C08(r5), sub_802899C, battle_endingBgUpdate_8029D34\
  \ to advance the current chip-select animation frame.\n  - Then walks r4 = 4,3,2,1,0 and calls customScreen_redrawChipSlot_8029CD4(r0=r4,\
  \ r1=(r4 < r5->NumChipsSelected-1 ? 1 : 0), r2=0). The boolean indicates whether the slot is part of the currently\
  \ selected \"row\" (slots 0..NumChipsSelected-2) — slots whose index is strictly less than NumChipsSelected-1\
  \ get r1=1, the tail slot and unused slots get r1=0. So this refills/redraws the chip-select row in EWRAM/S20364C0\
  \ after the anim tick.\n  - Finally calls customScreen_ExitSequence_8028E32 to tear down the chip-select screen\
  \ and pop back to the previous menu.\n  - r4 is the only caller-saved local; nothing meaningful is returned in\
  \ r0 (it's left at 0 from the last redrawChipSlot call).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battleObject_chipSelectAnimTick_8029C08` immediately after push (chip select anim tick on the r5
    S20364C0 state). - `ldrb r2, [r5,#8]` reads NumChipsSelected (struct S20364C0 offset 0x8), then `sub r2, #1;
    cmp r0, r2; bgt loc_80279E6; mov r1, #1` is the classic "index < NumChipsSelected-1" check that yields r1=1
    for selected-row slots and 0 for the trailing/empty slot. - Loop `mov r4, #4; ... sub r4, #1; bpl` iterates
    r4 = 4,3,2,1,0 (5 slots: a 4-wide chip row plus OK/last slot). - `bl customScreen_ExitSequence_8028E32` is the
    confirmed Custom-screen close-out, tail-called with `pop {r4,pc}`. - `r5` documented as "*S20364C0" by battleObject_chipSelectAnimTick_8029C08;
    r10 is the Toolkit.'
