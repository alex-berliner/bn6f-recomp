  shown
- The callee is `battle_beastPwrAtk_addScaledBaseFromIndex_8010D04`, not `somethingWriteChipParams_80126E4`;
  the chip-param call is to `loc_80126EA` and the proposal swaps them. Also `r0` is passed as `#0x14`
  (a scale/base), not as 0 (it is later discarded by the `pop {r0}`), so r0 is not really preserved meaningfully.
