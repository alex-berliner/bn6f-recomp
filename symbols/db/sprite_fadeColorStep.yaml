name: sprite_fadeColorStep
address: '0x0811CF64'
kind: function
status: probable
summary: 'Advances a per-object color fade: brightens the sprite''s gray color-shader by 2 levels per
  call while counting down a duration, resetting when it expires.'
interface: (r5 = object/sprite block, r0-r3 scratch) -> updates [r5+0x8], [r5+0xc], [r5+0xe]; calls sprite_setColorShader
  with r0 = packed RGB
details: Reads the intensity byte at +0xe, adds 2, clamps it to 31 (5-bit per channel) and stores it back.
  Decrements the frame counter at +0xc; when it would go below 1 it sets the byte at +0x8 to 8 (likely
  the next effect/state id) and clears the counter to 0. It then packs the intensity as r|r<<5|r<<10 —
  an equal R=G=B gray value — and passes it to sprite_setColorShader, which applies it to the sprite block
  selected by the object's high-nibble sprite index. This is the classic white-flash/brighten-over-frames
  effect used on battle objects. No caller is known, so what triggers the fade and what state 8 means
  remain unconfirmed.
