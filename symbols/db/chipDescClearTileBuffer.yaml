name: chipDescClearTileBuffer
address: '0x02028000'
kind: data
status: probable
summary: 'Proposed name: chipDescClearTileBuffer. 512-byte EWRAM buffer used as the tile-data target when
  clearing the two sprite tile-blocks that hold the chip-description text in the library screen. (u8)'
details: Lives in EWRAM at 0x02028000, 512 (0x200) bytes long — the size of two 16x16 GBA tile blocks.
  sub_8119F88 zeros an object's two sprite tile blocks, and unk_2028000 is the address handed to it from
  both menu_drawChipDescription and as the listing-paired clear target in sub_81252C0's tilemap-load table.
  sub_81252C0 then uses it again as one of the destination buffers alongside eDecompBuffer2013A00, consistent
  with it being the blank tile-block buffer the menu redraws on. No write into it is shown at indexed
  offsets, so it is treated as a flat byte buffer rather than a struct field.
evidence:
- method: caller-analysis
  date: '2026-10-20'
  detail: asm32.s:25409 menu_drawChipDescription passes unk_2028000 in r0 to sub_8119F88 after a tst/bne,
    i.e. it is the buffer to clear for the chip-description sprite.; asm32.s:25583 sub_8119F88 ('zeroes
    an object's two sprite tile blocks in object VRAM') takes unk_2028000 as its object address.; asm32.s:25583
    unk_2028000 is listed at off_811A094 right after TextScriptChipDesc1 — the table pairing text scripts
    with their clear buffers.; asm33.s:4440 sub_81252C0 ('loads background tilemaps') lists unk_2028000
    alongside eDecompBuffer2013A00 as a separate destination buffer pair.
