open_questions:
- No site in the eight shown actually writes the buffer's contents, so the exact tile pattern it should
  hold when 'fresh' is not seen.
- Whether 512 bytes always corresponds to exactly two tile blocks in this screen, or just coincidentally
  matches, is not confirmed by the shown sites.
