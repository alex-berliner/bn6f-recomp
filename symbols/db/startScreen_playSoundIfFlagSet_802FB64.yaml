name: startScreen_playSoundIfFlagSet_802FB64
address: '0x0802FB64'
kind: function
status: confirmed
summary: On the start/title screen, if the screen state halfword has flag 0x80 set, feeds the small audio command
  table at byte_802FB7C to the sound sequencer helper sub_8001158 (e.g. a jingle/cursor sound), otherwise does nothing.
interface: void sub_802FB64(const StartScreen* self /* r5 */) /* clobbers r0,r1,r2,r3, flags; sets C,V */
details: 'Takes the start screen object pointer in r5 and tests bit 0x80 of the

  halfword at self+0xA (a state/status flags field). If clear, it returns

  immediately. If set, it loads the address of byte_802FB7C (a 20-byte

  inline table right after the function: 02 40 04 80 80 92 00 00 /

  12 40 04 40 88 92 00 00 / 00 00 00 00) and calls sub_8001158 with r0

  pointing at it; sub_8001158 is presumed to be the sound/SSEQ driver

  entry that parses such command blocks. The table looks like two

  parameterized sound-driver commands (0x02 and 0x12 opcodes with 0x40/0x04

  sub-parameters, 0x80/0x88 track params, 0x92 terminators) followed by

  padding. Per the register contract, r2/r3 are trashed and C/V are marked

  as outputs (side effects of the tst/beq path on flags); r4-r7 are

  preserved throughout. The flag at +0xA&0x80 is not cleared here, so the

  caller is responsible for managing that state bit.

  '
