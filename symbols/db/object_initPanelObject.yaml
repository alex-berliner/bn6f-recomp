name: object_initPanelObject
address: '0x080C9D24'
kind: function
status: probable
summary: 'Initializes a battle object that occupies one panel: validates the panel, loads its sprite (0x80,
  0x10, 0x1d) and animation, positions it from panel coords, allocates/configures collision data (0xC
  x 0xD, r3=3), reserves the panel, and transitions to CUR_STATE_UPDATE.'
interface: (r5 = battle object) -> r0 = clobbered; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE
details: First checks that the object's current panel is a valid battlefield position via object_isCurrentPanelValid;
  on failure it frees the object's memory and returns. Otherwise it loads sprite resource (0x80, 0x10,
  0x1d), disables the shadow, calls an unknown setup (sub_80C9F18), sets flip/animation 0/palette 0, and
  starts a 0x30 (48-frame) timer in oBattleObject_Timer. It then positions the object from its panel via
  object_setCoordinatesFromPanels, allocates a collision slot, and if none is available bails out to object_freeMemory
  as well. It configures a 0xC x 0xD collision box (r3=3), zeroes the hit effect, clears/presents collision
  state, copies PanelX/Y into FuturePanelX/Y, and reserves the panel for itself via object_reservePanel.
  Finally it enters CUR_STATE_UPDATE and calls sub_80C9D9E (the first update step).
