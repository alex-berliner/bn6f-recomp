name: camera_writeUnk03_14_80301b2
address: '0x080301B2'
kind: function
status: confirmed
summary: Writes a byte and a word into the camera struct, leaving a pointer to it in r2.
interface: void camera_setUnk03_andUnk14(u8 value /* r0 */, u32 word /* r1 */); returns camera ptr in r2
details: 'Reads the toolkit''s camera pointer (oToolkit_CameraPtr off r10), stores the byte in r0 at camera+0x03
  and the word in r1 at camera+oCamera_Unk_14 (0x14). Returns the camera struct pointer in r2, which callers can
  use for further field updates. This is a small camera-field setter helper, not a camera-movement routine itself;
  the meaning of the 0x03 byte and 0x14 word within the camera struct is not established from this function alone.

  '
