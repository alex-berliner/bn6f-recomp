summary: Resets a battle object's extra counter and clears its linked auxiliary object's timer.
interface: (r5 = battle object) -> r0 = 0; no flags of note
details: 'Zeroes the caller object''s field at oBattleObject_ExtraVars+8, then checks the pointer at ExtraVars+0xc;
  if non-NULL it calls battle_ResetObjectTimerTo8 on that referenced object (writing 8 into its field
  at +8) and then nulls ExtraVars+0xc. This looks like a cleanup/reset of a timed sub-state: the object''s
  own counter is zeroed and an associated object it was tracking is given its default timer value of 8
  and unlinked. The callee is null-safe, and the caller double-checks NULL before calling anyway. Runs
  in beastsp battle routes.'
