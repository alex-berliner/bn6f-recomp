name: battle_countdownNotifySourceAndDestroy
address: '0x080C13E4'
kind: function
status: probable
summary: 'Battle object update: counts down its Timer; when it expires, flags the source object (field
  8 = 8) and destroys itself.'
interface: (r5 = battle object) -> void; object state set to CUR_STATE_DESTROY when Timer reaches 0
details: First calls sub_80C1466 (per-frame object update), then decrements the object's Timer field.
  When the timer hits zero, it reads the object's AIDataPtr and takes oAIData_SpawnedSourceObjectPtr from
  the AI data, passing it to sub_80E1A86 which writes 8 into that object's field at offset 8 (only if
  non-NULL) — likely resetting a respawn/cooldown or 'used' flag on the spawner. Finally it stores CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the engine deletes the object. If the timer
  has not expired, it just returns. Typical of a timed projectile/panel-hazard that must tell its parent
  it has ended.
