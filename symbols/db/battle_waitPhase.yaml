name: battle_waitPhase
address: '0x080BF548'
kind: function
status: probable
summary: Battle-object phase step that delays 30 frames (initializing the timer on first entry), then
  switches the object to action 0x14.
interface: (r5 = battle object) -> mutates oBattleObject_Timer, oBattleObject_PhaseInitialized, oBattleObject_CurAction,
  oBattleObject_CurPhaseAndPhaseInitialized; no return value
details: 'On first invocation (PhaseInitialized == 0) it sets Timer to 0x1E (30 frames) and PhaseInitialized
  to 4, a one-time init pattern. Every call then decrements the 16-bit Timer; while it is still positive
  it returns, doing nothing else. When the timer expires it writes CurAction = 0x14 and clears the combined
  CurPhaseAndPhaseInitialized word to 0, handing control back to the object''s action dispatcher. This
  is the standard battle-object state-machine shape: init-once flag, frame countdown, then advance to
  a hardcoded next action.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / bne skips init, which stores Timer=0x1E and
    PhaseInitialized=4 (init-once pattern); ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt locret
    — pure frame countdown, no other work while waiting; on expiry: mov r0,#0x14; strb r0,[r5,#oBattleObject_CurAction]
    and strh 0 to CurPhaseAndPhaseInitialized — hardcoded transition to next action'
  refs:
  - bn6f/asm/asm31.s:16156
  reproduce: python3 tools/asmcat.py 0x080BF548
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- which object or encounter uses this 30-frame wait and what action 0x14 does — no callers known, so the
  specific in-game role (e.g. intro pause, enemy delay) is unidentified
