name: sub_804634C
address: '0x0804634C'
kind: function
status: hypothesis
summary: Thin trampoline that calls sub_8046356 and returns with r3 forced to 0.
interface: void sub_804634C(void); // clobbers r0,r1,r2,r3,r4,r6,r7,lr; NZCV
details: 'Only meaningful instructions are `bl sub_8046356` followed by `mov r3, #0`

  and a `pop {pc}` (real tail-return). It exists solely to guarantee that the

  caller of this entry point sees r3 = 0 in the output, regardless of what

  sub_8046356 leaves in r3. No game data or state is touched here; the

  behavior is entirely defined by sub_8046356 plus the r3 zeroing. The

  register contract shows r0 and lr as inputs and r0,r3 as outputs, but

  functionally the only output contract that matters to the caller is r3 = 0.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
