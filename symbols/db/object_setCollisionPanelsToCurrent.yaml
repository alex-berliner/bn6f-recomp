name: object_setCollisionPanelsToCurrent
address: '0x0801A066'
kind: function
status: confirmed
summary: Copies a battle object's current panel X/Y coordinates into its collision data record.
interface: void object_syncCollisionDataPanelPos(BattleObject* obj /* r5 */); clobbers r0-r2, preserves r4
details: Reads the object's oBattleObject_PanelX and oBattleObject_PanelY bytes and stores them into the corresponding
  oCollisionData_PanelX/oCollisionData_PanelY fields of the collision record pointed to by oBattleObject_CollisionDataPtr.
  This keeps the collision system's notion of the object's occupied panel in sync with the object's logical grid
  position, e.g. after an object moves so hit detection/collision queries use the updated panel. r4 is pushed/popped
  purely as an ABI requirement (thumb push must include lr with pc); it is neither read nor written. r0/r1/r2 are
  left holding panelX/panelY/collision pointer, but these are incidental leftovers, not meaningful return values.
  No flags are set or depended on.
