name: object_spawnType4
address: '0x080033AC'
kind: function
status: confirmed
summary: Wrapper that spawns a battle object of type 4 from five caller-supplied parameters and immediately runs
  its initializer.
interface: battle_spawnObjectType4(u32 param0, u32 param1, u32 param2, u32 param3, u32 param4) -> BattleObject*
  (r0-r4 in; r0 = object pointer or NULL out; NZ flags reflect NULL-ness when nothing spawned)
details: 'Thin spawn wrapper around SpawnBattleObjectCommon for object type 4 (r0 = 4). The five

  parameter words passed in r0-r4 are stored with stmia into a 0x14-byte context block built

  on the stack (the frame is 0x14 bytes of locals plus the 8-byte r7/lr pair), and the

  block''s address is handed to SpawnBattleObjectCommon in r1. If the common spawner returns

  a non-NULL object pointer (r5), sub_8003400 is called immediately as the object''s

  initializer/constructor, with the spawn results still live in the registers (r0-r5, r7

  still pointing at/above the parameter block, as sub_8003400 is documented to read).

  If no object was created, the function just falls through, leaving the NZ flags from the

  tst r5, r5 for the caller. Returns the object pointer (or NULL) in r0. r4, r6 and r7 are

  preserved across the call; note r7 is used as a scratch pointer to the context block

  during the call (a quirk callers of the initializer rely on, but it is restored before

  returning to this function''s caller).

  '
