name: ai_updateStepAttack
address: '0x081073A8'
kind: function
status: probable
summary: AI attack-state handler that dashes the object onto its reserved target panel and waits out a
  13-frame step before ending the attack.
interface: (r0 = object entry? read via r5/r7 AI/battle object structs) -> r0 = destroyed; updates ObjectFlags1,
  panel coords, animation, StepTimer
details: 'First call: writes AttackElement=4 into the AI vars (r7), sets CurAnim=3 on the battle object
  (r5), then calls object_removePanelReserve for the current panel and again after copying FuturePanelX/Y
  into PanelX/Y — committing the planned lunge destination. It then syncs pixel coords via object_setCoordinatesFromPanels
  and updates the collision record/facing via object_updateCollisionPanels, clears ObjectFlags bit 0x40,
  sets the CURRENTLY_MOVING_1 flag, and arms StepTimer=0xD. On later calls it only decrements StepTimer
  and, at zero, calls object_exitAttackState to return the AI to its idle/decision state. No element is
  assigned, so the dash deals untyped contact damage if it hits.'
