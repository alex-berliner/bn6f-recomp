- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb AttackElement/tst+bne: branches to timer-tick path if attack already started, so first
    entry is the dash setup; future-panel copy into PanelX/Y plus two object_removePanelReserve calls
    commits the lunge movement; object_setFlag1 with CURRENTLY_MOVING_1_BIT marks the object as in-motion
    during the step; StepTimer=0xD and decrement-to-zero ending in object_exitAttackState is the standard
    attack-duration wait pattern; recorded ''battlesweep'' route: only AI-controlled enemy attack steps
    invoke this'
