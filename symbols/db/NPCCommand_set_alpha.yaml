name: NPCCommand_set_alpha
address: '0x0809F15A'
kind: function
status: confirmed
summary: NPC script command handler that sets (or clears) the NPC sprite's alpha blending level from the command's
  parameter byte.
interface: void NPCCommand_set_alpha(r5 npcCtx?, r6 cmdPtr /*in/out*/, r7, r10); returns r6 advanced by 2; clobbers
  r0-r3, flags
details: 'Part of the NPC script command dispatch table (r6 = current script pointer).

  First calls sprite_disableAlpha to turn alpha blending off for the NPC''s

  sprite, then loads the command''s parameter byte from [r6+1]. If that byte

  is nonzero it calls sprite_setAlpha_8002c7a with the byte as the new alpha

  level, overriding the disable; if it is zero the sprite is simply left with

  alpha disabled. Finally advances r6 past the 2-byte command (add r6,#2);

  the NZ/CV flags on exit come from that add, not from the alpha calls.

  Touches only the sprite''s alpha state, no NPC data structure fields directly.

  Quirk: the parameter byte is always loaded into r0 (so the command byte is

  visible in r0 even when the setAlpha call is skipped).

  '
