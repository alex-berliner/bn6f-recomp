  reproduce: 'grep -l ''^080a5a5c '' tools/traces/coverage/*.prof

    '
  result: beastsp, maps
open_questions:
- What byte_2000EC0 actually represents (it sits inside the larger EWRAM block used by
- BattleObject helpers, but no struct currently names offset 0xEC0). Settling it would
- require looking at every other reader of byte_2000EC0 in the ROM, or a named label in
- the matching bn6f symbols file.
