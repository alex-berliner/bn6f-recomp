open_questions:
- What the per-chip handler functions actually do (only their dispatch slot counts are visible here).
- Whether off_80109DC index 0 (sub_8010A90) is the "sword" group and sub_8010AE4 is something else; the
  table layout is clearly classified by ChipData.Unk_1a but the names/groups aren't readable from this
  function alone.
- Exact meaning of r0 return value (0x0A, 0x14) — likely damage or a status flag bit but needs one of
  the dispatch targets to confirm.
