name: battle_chipEffectDispatcher_80109A4
address: '0x080109A4'
kind: function
previous_names:
- sub_80109A4
status: probable
summary: Dispatches a battle chip's "use" handler from the static chip data, then jumps into it with (r0=chipID,
  r1=targetStruct).
interface: '(r0 = chipID, r1 = user data pointer) -> r0 = return value from the dispatched handler ; side
  effects: jumps through a handler table indexed by ChipData[chipID].Unk_1a (offset 0x1a in the 44-byte
  chip record), threads into the per-chip effect routine.'
details: "Saves r4/r7/lr, preserves chipID in r7 and the user-data pointer in r4. If chipID == 0xFFFF\
  \ the function early-returns r0=0 (no chip). Otherwise it calls getChip8021DA8(r0) to fetch the *const\
  \ ChipData (44-byte record), reads the halfword at ChipData[chipID].Unk_1a (offset 0x1a in the record\
  \ — ldrh r0,[r0,#0x1a]) into r0, subtracts 0x3E8 (mov r2,#0xfa; lsl r2,#2 -> 0x3E8), and if the result\
  \ is < 0 the function returns 0. Otherwise it computes a word index (lsl r0,r0,#2) into off_80109DC\
  \ at 0x080109DC and tail-calls (mov lr,pc; bx r2) the function pointer stored there, restoring r0=chipID\
  \ and r1=userPtr. off_80109DC is a 44-entry dispatch table: index 0 -> sub_8010A90 (the \"other\" branch,\
  \ used for the base 0x3E8 entry); indices 1..18 -> sub_8010AE4 (apparently a generic chip handler —\
  \ likely Sword/LongSword or similar shared); index 19 -> sub_8010B78; 20 -> sub_8010BF0; 21 -> sub_8010C06;\
  \ 22 -> sub_8010C50 (the most populated slot, indices 22..43, 22 entries). The wide use of sub_8010C50\
  \ (called out 22 times) suggests a default/standard ranged-attack chip handler (e.g., Cannon/Shot/etc.).\n\
  \  The \"0x3E8\" threshold matches an internal chip-effect ID classification (probably \"no special\
  \ handler\" = 0, \"sword-like\" = 1, \"ranged\" = 22+, etc.). Return values observed in captured calls:\
  \ 0x00, 0x0a, 0x14 — looks like some flag/status from the per-chip handler.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl getChip8021DA8` at 0x80109B0 returns the 44-byte ChipData record for the chip ID; `ldrh
    r0,[r0,#0x1a]` reads the effect-class field. - `mov r2,#0xfa; lsl r2,#2` => r2=0x3E8; `sub r0,r0,r2`
    then `cmp r0,r2; blt locret_80109D2` only dispatches when (Unk_1a - 0x3E8) >= 0 and < 0x3E8 (table
    size 44 entries). - `lsl r0,r0,#2; ldr r2,off_80109D4; ldr r2,[r0,r2]; ... bx r2` is a textbook indexed-function-pointer
    dispatch. - `mov r0, r7; mov r1, r4` before `bx r2` re-installs the original chipID in r0 and userPtr
    in r1 as expected. - Captured call snap_story2_0: r0=0xB8 (chip 184) routed through, exit r0=0; snap_story2_10:
    r0=5 routed, exit r0=0x0A; snap_story2_12: r0=4 routed, exit r0=0x14 — consistent with the per-chip
    handler returning a damage/status byte. - off_80109DC layout: 1 entry to sub_8010A90, 18 to sub_8010AE4,
    then 1+1+1+1+(22) to sub_8010B78/BF0/C06/C50 — strongly suggests effect-class groupings. - Caller
    `handleVariableDamageChip_800AEE8` ("re-rolls damage of variable-damage chips") calls this to actually
