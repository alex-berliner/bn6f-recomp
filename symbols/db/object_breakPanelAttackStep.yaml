name: object_breakPanelAttackStep
address: '0x080C70D8'
kind: function
status: probable
summary: Step routine of a one-shot battle attack object that spawns a hitbox on its panel and crumbles
  the panel, then destroys itself after 18 frames.
interface: (r0 unused on entry; r5 = battle object) -> updates oBattleObject_Timer/PhaseInitialized/CurState;
  sets object state to CUR_STATE_DESTROY when timer expires
details: On first call (PhaseInitialized == 0) it reads oBattleObject_PanelX/PanelY and calls object_spawnCollisionRegion
  with fixed parameters 0xa05ff01 (r3 = 0), then calls object_breakPanelLoud on the same panel tile, loads
  the timer with 0x12 (18 frames), and sets PhaseInitialized = 4. On every call it decrements oBattleObject_Timer;
  once it goes negative it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object is removed. The hitbox parameters 0xa05ff01 are packed fields (likely power/element/extent)
  passed through r4. It performs its effect exactly once and then idles until the timer runs out.
