name: battle_aiAttackStateDispatch_80EC884
address: '0x080EC884'
kind: function
status: confirmed
summary: Dispatches the enemy AI's attack-state handler selected by the mode byte at offset 0 of the AI attack-vars
  block (r7), tail-calling it with lr set to return to this function's caller.
interface: 'void battle_aiAttackStateDispatch_ADDRESS(void) /* r7 = AI attack-vars block; trampoline: all registers/flags
  other than what the handler sets pass straight through as outputs */'
details: 'Reads the mode byte at r7+oAIAttackVars_Unk_00 (offset 0 of the AI attack-vars structure) and indexes
  off_80EC898 with it to fetch a Thumb handler address (mode 0 -> sub_80EC8A0, mode 1 -> sub_80EC90E). It sets lr
  = pc so the handler returns to this function, which immediately does pop {pc}, effectively making the handler
  return to the original caller. The handler is entered with r0 = mode byte and r1 = its own jump-table entry (its
  Thumb entry address); whatever registers and NZCV flags the handler leaves become this function''s outputs, so
  the register contract is inherited from the handlers. Only modes 0 and 1 are valid; the table has exactly two
  entries and there is no bounds check, so any other mode byte would jump through garbage.

  '
