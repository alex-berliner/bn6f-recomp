name: sChip_loadRecordIntoSlot_8021AB4
address: '0x08021AB4'
kind: function
status: confirmed
summary: Copies a 60-byte S-chip record into one slot of the S-chip table and unpacks/registers each of its 9-bit
  packed fields.
interface: void sub_8021AB4(const u32* src, u32 slot) — r0 = record source, r1 = slot index; r10 = toolkit (base
  pointer read from [r10 + oToolkit_S_Chip_2002178_Ptr]); exits with r2 = 1 and r3 = result of the last sub_8021B2A
  call
details: 'Computes the destination as S-chip table base ([r10 + oToolkit_S_Chip_2002178_Ptr]) + slot * 0x3C,

  then CopyWords()s 0x3C bytes (15 words) from r0 into that slot. It then re-scans the freshly

  copied slot data as 30 halfwords (loop step 2, limit 0x3C): each halfword is passed to

  split9BitsFromBitfield_8021AE0, which splits it into two 9-bit values (returned in r0/r1), and

  those values are handed to sub_8021B2A with r2 = 1 (a count/flag of 1 per entry). The structure

  appears to be a packed bitfield record whose halfwords each hold two 9-bit fields — likely a

  compressed chip/part definition being installed into the S-chip (secret/special chip) table and

  its entries individually registered. r4-r7 are preserved across the whole routine; r6/r7 are

  used as loop counter and slot pointer only internally.

  '
