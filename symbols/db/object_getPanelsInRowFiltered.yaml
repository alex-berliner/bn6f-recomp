name: object_getPanelsInRowFiltered
address: '0x0800D012'
kind: function
status: confirmed
summary: Scans the six columns of one battle row and collects the coordinates of panels passing a filter into a
  caller-supplied byte buffer.
interface: "int object_getPanelsInRowFiltered(u32 row /* r0 */, u32 filterA /* r2 */,\n                        \
  \          u32 filterB /* r3 */, u8* out /* r7, in-register */);\nreturns r0 = number of panel coordinates written;\
  \ r4-r7 preserved; flags clobbered."
details: 'Saves filter parameters r2/r3 on the stack, then loops columns 1..6 of the row given in r0, calling object_checkPanelParameters(column,
  row, filterA, filterB) for each panel. For every panel that passes (nonzero return), it stores the packed coordinate
  column | (row << 4) as a byte at r7[count] — note the output pointer arrives in r7, so this must be called from
  code that has that buffer pinned in a high register (likely a wrapper using r7 as a local). Returns the panel
  count in r0. Coordinates use the usual battle grid encoding: low nibble = column (1-based), high nibble = row.
  r4-r7 are pushed/popped so the caller''s r7 buffer pointer survives, though the object_checkPanelParameters call
  could in principle clobber it; it evidently preserves r7 in practice.

  '
