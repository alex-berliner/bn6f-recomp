name: ai_tryStartPanelReserveAttack
address: '0x0810EADE'
kind: function
status: probable
summary: Finds a target panel via sub_810EBB0, reserves it, then sets up and starts attack 0xC using per-version
  tables; on failure zeros object ExtraVars+0x1C, sets AI step timer to 60, and starts attack 9.
interface: (r4 = AI data struct, r5 = battle object, r6 = AI state, r7 = AI attack vars) -> r0 = 0; sets
  attack via object_setAttack0
details: First calls sub_810EBB0, which on success returns target panel coords in r0/r1; these are stored
  at object+0x77/0x78. It then calls object_reservePanel to claim that panel for the object, saving the
  object's own panel coords (oBattleObject_PanelX/Y) into +0x75/0x76 beforehand, implying the attack moves
  or affects the panel being stood on. It indexes several byte tables (byte_810E80A, byte_810E810, byte_810E818,
  byte_810E7FC) and a halfword/word table byte_810E7E4 (index*4) by oAIData_Version_16 to fill oAIAttackVars
  fields (AiAttackParam, AttackDuration, ScratchVar, Unk_32, Damage), then triggers attack id 0xC via
  object_setAttack0. If sub_810EBB0 returns 0, it zeroes object ExtraVars+0x1c, sets the attack step timer
  to 0x3C (60 frames), and starts attack 9 instead. In both paths ScriptId in the AI state is reset to
  0. r4-r7 are assumed caller-provided pointers since only r0/r1 come from the callee.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sub_810EBB0; tst r0,r0; beq loc_810EB2E — success path stores r0/r1 to object+0x77/0x78
    as coordinates; bl object_reservePanel right after saving PanelX/Y to +0x75/0x76 — attack claims a
    panel; off_810EC5C..6C tables indexed by oAIData_Version_16 fill AiAttackParams/Duration/Damage, then
    mov r0,#0xC; bl object_setAttack0; failure path: str 0 to ExtraVars+0x1c, mov r0,#0x3C into StepTimer,
    attack 9 via object_setAttack0; both paths: strb r0(=0),[r6,#oAIState_ScriptId] — resets AI script
    step counter'
