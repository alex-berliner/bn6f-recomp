name: object_setupTripleSpritesFromTable
address: '0x0804A574'
kind: function
status: probable
summary: Looks up a 0x20-byte entry in unk_202A3E0 using two halfwords from the caller's object struct,
  splits the entry's +0x1c word into two 7-bit values, configures three consecutive sprite-table entries
  (ids 0xFFFFFFD8..0xFFFFFFDA) with those values plus zero fields, repositions the trio to (0x58, 0),
  then sets the object's state to 4 and clears its frame counter.
interface: '(r0 = unused on entry; r5 = object struct: +0x2a/+0x2e halfword table index, +0x01 state byte,
  +0x18 halfword counter) -> r0 = 0; sets [r5+1]=4, [r5+0x18]=0'
details: The function indexes unk_202A3E0 by ([r5+0x2a]+[r5+0x2e])*0x20, so that table holds 0x20-byte
  entries (likely per-room or per-object data). It loads the entry's word at +0x1c and splits it into
  bits 9-15 and bits 0-6, passing them with r2=r3=0 to setFieldsInThreeTableEntries_811980C, which writes
  a byte and two halfwords into three consecutive structs rooted at 0x2008450 (skipping missing entries)
  — plausibly sprite ids/attributes for a three-part object. It then calls sprite_setPositionForIdRange3_8119854
  with first id 0xFFFFFFD8 (-40, likely a signed base id the callee offsets) at position (0x58, 0). Finally
  it stores state 4 into [r5+1] and clears the halfword at [r5+0x18], i.e. it is one state in an object's
  update handler.
