name: ai_attackStepAdvanceFuture8
address: '0x080F7A6C'
kind: function
status: probable
summary: 'Per-frame tick that advances an AI attacker one panel: after the step timer expires it commits
  the planned panel move, releases the reserved panel, and resets the timer for the next step'
interface: (r5 = battle object, r7 = object AI vars) -> void; commits FuturePanelX/Y into PanelX/Y and
  reloads StepTimer=8, HitElement=8
details: Counts down oAIAttackVars_StepTimer each call and does nothing until it hits 0. On expiry it
  sets oBattleObject_CurAnim to 3, copies oBattleObject_FuturePanelX/Y into oBattleObject_PanelX/Y, calls
  object_removePanelReserve to free the panel the object reserved for the move, then object_setCoordinatesFromPanels
  and object_updateCollisionPanels to sync pixel position, collision panel and facing to the new tile.
  Finally it reloads StepTimer with 8 and stores 8 into oAIAttackVars_HitElement, priming the next step/phase
  of the attack. The 8 written to HitElement looks like a phase parameter (e.g. element or step count
  for the follow-up), not a hit element in the usual sense.
