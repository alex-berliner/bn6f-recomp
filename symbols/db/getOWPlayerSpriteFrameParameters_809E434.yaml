name: getOWPlayerSpriteFrameParameters_809E434
address: '0x0809E434'
kind: function
status: confirmed
summary: Returns the current sprite frame parameters of the overworld player object.
interface: 'void getOWPlayerSpriteFrameParameters(u32 r10=toolkit, void* r5 /*unused input, overwritten*/, return
  r0..r3 = frame parameters, r5 preserved)

  '
details: 'Thin wrapper: saves r5, loads the toolkit''s gameState pointer (r10 = toolkit, oToolkit_GameStatePtr),
  then reads oGameState_OverworldPlayerObjectPtr to get the overworld player object, loads it into r5 as the argument,
  and tail-calls sprite_getFrameParameters. The four values returned in r0-r3 are the sprite''s frame parameters
  (typically animation/ frame data used by overworld rendering code). r5 is restored to its original value on return,
  so despite being used as scratch it is effectively preserved for callers. No other state is touched; flags nz
  c v are clobbered by the pointer loads.

  '
