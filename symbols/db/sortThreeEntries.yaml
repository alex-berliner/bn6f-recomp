name: sortThreeEntries
address: '0x08012D70'
kind: function
status: probable
summary: runs three compare/swap passes over entries 0-2 of a small list, likely to (re)sort it after the caller
  shifts bytes
interface: () -> r0 = undefined; calls sub_8012D8C(idx, idx) with (0,1),(0,2),(1,2)
details: Takes no arguments and simply invokes sub_8012D8C three times with the index pairs (0,1), (0,2), (1,2)
  — the standard 3-input sorting network. sub_8012D8C presumably compares and swaps (or otherwise orders) the entries
  at those indices within some fixed 3-entry structure. Its only caller sub_8012D24 manipulates bytes in a small
  buffer (copying [r7] to [r7+1]/[r7+2], decrementing r7 by 2 or 3) as if inserting or removing an element, then
  calls this to restore ordering. Without sub_8012D8C the operand structure (which buffer, entry size, sort key)
  is unknown.
