name: object_spawn2A
address: '0x080C063C'
kind: function
status: probable
summary: Wrapper that spawns battle object type 0x2A and self-links it before returning it.
interface: '(args for object_spawnType1: type 0x2A fixed, x, y, z, params) -> r0 = new BattleObject or
  NULL'
details: Calls object_spawnType1 with the object index hard-coded to 0x2A; the callee returns the new
  BattleObject pointer in r5, which is moved to r0. If the spawn failed (NULL), it returns immediately.
  On success it stores the object's own pointer into its field +0x4C (a self/owner-style link) and re-writes
  halfword +0x16 with the value read from the same halfword, a no-op copy that likely just commits/normalises
  that field after the type-specific initialiser ran. The identity of object type 0x2A is not shown here;
  the nearby cos/sin table words belong to surrounding code, not this function.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0x2a; bl object_spawnType1 — object type 0x2A is fixed by this wrapper; mov r0, r5;
    beq locret — null-check on the spawned object pointer returned in r5; str r5, [r0,#0x4c] — stores
    the object''s own pointer into its +0x4C field; ldrh r1,[r5,#0x16]; strh r1,[r0,#0x16] — halfword
    +0x16 read and written back on the same object; push/pop {r5} around the call shows r5 is the callee''s
    return register, not caller state'
