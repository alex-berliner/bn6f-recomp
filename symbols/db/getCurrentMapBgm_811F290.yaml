name: getCurrentMapBgm_811F290
address: '0x0811F290'
kind: function
status: confirmed
summary: Returns the BGM id assigned to the player's current overworld map (0xFF if none).
interface: 'u8 getCurrentMapBgm_811F290(void);

  // inputs: r10 (toolkit pointer, used to fetch the game-state pointer)

  // outputs: r0 = BGM id for (mapGroup, mapNumber)

  // clobbers: r1, r2; flags N,Z (set via the final ldrb)

  '
details: 'Reads the GameState pointer through the toolkit (r10 -> oToolkit_GameStatePtr) and

  inspects oGameState_MapGroup / oGameState_MapNumber. Groups >= 0x80 are remapped by

  subtracting 0x80 and adding 7, suggesting the top half of the group range holds

  special/internal maps that share the same per-map BGM table layout. The group value

  is then used as an index (shifted left by 2) into the 32-entry pointer table at

  off_811F2B0; the resulting pointer is a 16-byte array indexed by mapNumber whose

  entries are BGM ids (0xFF = "no BGM"). Several table rows are entirely 0xFF

  (byte_811F3F8, byte_811F408, byte_811F428, byte_811F438, byte_811F448,

  byte_811F478, byte_811F488), meaning those map groups contain no maps with custom

  BGMs (they presumably fall back to the area/default music).

  '
