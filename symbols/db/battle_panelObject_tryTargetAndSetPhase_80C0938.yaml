name: battle_panelObject_tryTargetAndSetPhase_80C0938
address: '0x080C0938'
kind: function
status: confirmed
summary: Tries to acquire a panel target via sub_80C0C9A; on success stores the returned param bytes into
  the object's Param3/Param4 and advances to phase 4 (execute panel effect), otherwise falls back to action
  0xC and resets phase to 0.
interface: void sub_80C0938(struct BattleObject *r5 /* in/out */);
details: "Operates on a battle object pointer passed in r5 (preserved across the call).\nCalls sub_80C0C9A\
  \ to find a panel target; that helper may clobber nz/c/v and\nr0..r3. Two outcomes are written into\
  \ the BattleObject fields:\n  * Success (R0 != 0): byte R0 -> +oBattleObject_Param3, byte R1 ->\n  \
  \  +oBattleObject_Param4 (the two param bytes of the resolved panel target),\n    +oBattleObject_CurPhaseAndPhaseInitialized\
  \ is set to 4 (panel-effect\n    execution phase).\n  * Failure (R0 == 0): +oBattleObject_CurAction\
  \ is set to 0xC (a fallback\n    \"no target\" action ID) and +oBattleObject_CurPhaseAndPhaseInitialized\n\
  \    is cleared to 0, returning the object to an idle phase.\nlr is popped directly as pc (tail-style\
  \ return).\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
