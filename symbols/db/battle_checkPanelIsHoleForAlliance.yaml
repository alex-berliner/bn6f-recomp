name: battle_checkPanelIsHoleForAlliance
address: '0x080D1700'
kind: function
status: probable
summary: Tests the battle object's current panel against a per-alliance flag bit (hole/void panel) and
  latches a 'hit hole' flag into Param2, returning whether it matched.
interface: (r5 = battle object) -> r0 = 1 if the panel's status flags include the alliance's bit (0x4000000
  for alliance 0, 0x8000000 for alliance 1), else 0; writes 1 to oBattleObject_Param2 on match
details: Reads the object's PanelX/PanelY and fetches the panel status word via object_getPanelParameters.
  Indexes a two-entry table at off_80D1724 by oBattleObject_Alliance*4 to pick the mask bit (0x4000000
  or 0x8000000), which appear to mark a hole/removed panel for each side of the field. If the bit is set,
  stores 1 into oBattleObject_Param2 and returns 1; otherwise returns 0 without touching Param2. Only
  called from battle_slideToTargetPanelTick, where it presumably lets a sliding object detect that it
  has reached a hole panel.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb PanelX/PanelY + bl object_getPanelParameters: result is the panel status flags word; ldr
    r1,[r2,r1] with table {0x4000000,0x8000000} indexed by Alliance<<2: per-side panel bit test; strb
    r4,[r5,#oBattleObject_Param2] and ''mov r0,r4'': match sets Param2=1 and is the return value; sole
    caller battle_slideToTargetPanelTick slides toward a target panel, so this gates that slide on a panel
    condition'
