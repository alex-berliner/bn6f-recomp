name: e_confirmSelection
address: '0x081359A0'
kind: function
status: probable
summary: State-machine step that copies the selection index from [r5+0x30] to [r5+0x32], then based on
  entry 10 of eStructArr2008450 and the current selection (0, 0xFFFF, or other) either sets next state
  to 8, or — after sub_81365F0 succeeds — plays SOUND_EXIT_SUBMENU, clears entry 10, resets selection
  to 0xFFFF, runs chatbox script 5, and sets state 0x38 (in cyberspace maps, MapGroup >= 0x80), else calls
  sub_81366FC/sub_813658C and sets timers [r5+0x11]=0x28, [r5+0xC]=0x10; clears [r5+0x13] and returns
  0.
interface: (r5 = handler state struct) -> r0 = 0; writes next-state byte [r5+2], selection copy [r5+0x32],
  timers [r5+0xC]/[r5+0x11], clears [r5+0x13]
details: 'Copies the halfword selection value [r5+0x30] to [r5+0x32], calls sub_813652C, then checks the
  in-use byte of entry 10 of eStructArr2008450. If not in use: a selection of 0 leads to a branch setting
  timer [r5+0x11]=0x24 and calling sub_813658C; 0xFFFF stores 8 into the next-state byte [r5+2]. For any
  other value it calls sub_81365F0; if that succeeds and GameState MapGroup >= 0x80 (cyberspace maps)
  it plays SOUND_EXIT_SUBMENU, clears entry 10 via sub_8046696, resets the selection to 0xFFFF, queues
  chatbox text script 5 on eTextScript201D280, and sets next state 0x38; if MapGroup < 0x80 it calls sub_81366FC
  and sub_813658C and sets [r5+0x11]=0x28, [r5+0xC]=0x10. Finally clears byte [r5+0x13] and returns 0.'
