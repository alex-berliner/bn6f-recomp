name: object_netScriptTriggerStep
address: '0x0804921E'
kind: function
status: probable
summary: Object step that, on each call, consumes one use via sub_803BB80; if B is pressed it shows text index 0x83
  (sub_803C28A), otherwise when chatbox flag bit 3 is set and sub_803BB94/C558/13D638 pass (with sub_803BB90(0x1E)),
  it selects network script 0xB and advances the phase byte [r5+1] to 0x20, then tails into sub_803A1B0.
interface: '(r5 = object state block: [r5] = uses-left counter, [r5+1] = phase byte; r10 = toolkit) -> r0 = sub_803A1B0
  result; updates [r5+1] = 0x20 on trigger'
details: 'First calls sub_803BB80 to consume one ''use'' from the 32-bit counter at [r5]; if exhausted (returns
  1), it skips straight to sub_803A1B0 and returns. Otherwise it reads the pressed joypad bits via oToolkit_JoypadPtr:
  on B (bit 1, mask 2) it calls sub_803CAF8 and, unless bit 3 is set, performs sub_803C28A(0x83). On the non-B path
  it requires chatbox flag word eFlags2009F38 bit 3 (mask 8) set, passes sub_803BB94 and sub_803C558 checks, arms
  a 30 (0x1E) value via sub_803BB90, and passes sub_813D638''s check; only then it selects network text script 0xB
  (sub_803BB2C) and stores 0x20 into the phase byte [r5+1]. The 0x1E value set just before the check suggests a
  timed retry/wait window.'
