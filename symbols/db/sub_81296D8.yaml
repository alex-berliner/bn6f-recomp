name: sub_81296D8
address: '0x081296D8'
kind: function
status: confirmed
summary: Handles D-pad cursor movement and A/B button input for a submenu (e.g. PET folder/Equip submenu), committing
  the new index and redrawing, confirming with A, or exiting to phase 0x18 with a screen fade on B.
interface: void sub_81296D8(struct SubMenu *r5 /* menu descriptor */, u32 r6, u32 r7, struct Toolkit *r10 /* joypad
  source */); preserves r4 r6 r7 r10
details: "Reads the pressed joypad bits via the global Toolkit (r10) and the\nSubMenu cursor index at r5+0xE. Calls\
  \ menu_moveCursorUpDown_811FA22\nwith pressed buttons, max index 3, wrap=1 and the current cursor to\ncompute\
  \ the new cursor value.\n- If the cursor changed (result != old index), stores the new index\n  at r5+0xE and\
  \ calls sub_812B3FC (the menu redraw / row-update\n  helper) before returning.\n- If the cursor did not change,\
  \ checks IsButtonPressed for JOYPAD_A:\n    * On A: plays SOUND_MENU_SELECT, sets the submenu state byte at\n\
  \      r5+3 to 0xC, ORs 1 into the flags byte at r5+0x1B, and clears\n      r5+0x1C and r5+0x1E.\n- If A was not\
  \ pressed, checks IsButtonPressed for JOYPAD_B:\n    * On B: plays SOUND_EXIT_SUBMENU, sets r5+3 to 0x18, and\
  \ starts\n      a screen fade via SetScreenFade(0xC, 0x10).\nOtherwise (neither A nor B) the function does nothing\
  \ and returns.\nSubMenu layout touched: +0x03 (state/phase), +0x0E (cursor index),\n+0x1B (flags), +0x1C, +0x1E\
  \ (cleared on confirm).\n"
