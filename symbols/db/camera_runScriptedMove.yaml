name: camera_runScriptedMove
address: '0x0808C948'
kind: function
status: probable
summary: 'Ticks a scripted camera move driven by a halfword bitmask at [r10+4]: on the first call it initializes
  state via camera_writeUnk03_14_80301b2 and sub_8089244(1), then each call dispatches on one of 8 mask
  bits via byte_808CA18 to pick X/Y deltas from byte_808CA24, tests the new point with sub_80303FC (else
  calls sub_8089370), and commits via SetCameraXYZ; returns 1 while running and 0 when bit 0x200 terminates
  it (clears EVENT_9D4, plays SFX 0x83).'
interface: () -> r0 = 1 while the pan sequence is still running, 0 when it finishes; reads global state
  at unk_2000B40 and the word at [r10+4]
details: 'On the first invocation (state byte at unk_2000B40+1 <= 0) it writes 0 into the camera struct
  via camera_writeUnk03_14_80301b2, calls sub_8089244(1) and bumps the state byte. Each call reads a halfword
  bitmask at [r10+4]; if bit 0x200 is set it terminates the sequence: resets the state byte, clears EVENT_9D4,
  plays sound effect 0x83 and returns 0. Otherwise it scans an 8-entry mask table (byte_808CA18) to find
  which screen/sector bit matches, and picks two signed-byte X/Y deltas from a table at byte_808CA24 (second
  set of 8 selected when bit 0x2 of the mask is set), adding them to the current GetCameraXYZ position.
  It passes the resulting (x, y, 0) point on the stack to sub_80303FC; if that returns 0 the camera is
  moved to the new position with SetCameraXYZ, if nonzero the camera is left at the original position
  and sub_8089370(screenIndex) is called instead. It then calls sub_8089280 and returns 1. Deltas are
  sign-extended via lsl #0x10, and the point is passed as three stack words suggesting a fixed-point/world-coordinate
  struct for the sub_80303FC test.'
