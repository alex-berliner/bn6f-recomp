    table, sub_80303FC test, SetCameraXYZ/sub_8089370 branch, sound 0x83, EVENT_9D4 clear). However, there
    is no concrete caller in the asm and the callees (ClearEventFlagFromImmediate, PlaySoundEffect, SetCameraXYZ,
