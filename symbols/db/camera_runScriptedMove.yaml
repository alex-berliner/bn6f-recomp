    == mask selects one of 8 screen indices; ldrsb pair from byte_808CA24[2*idx + (bit2?0x10:0)] gives
    per-screen signed X/Y deltas added to GetCameraXYZ results; sub_80303FC called with (x,y,0) on stack;
    r0==0 -> SetCameraXYZ(new pos), r0!=0 -> sub_8089370(idx) + SetCameraXYZ(old pos); first-run block:
    camera_writeUnk03_14(0), sub_8089244(1), state byte [unk_2000B40+1]++ shows sequence initialization'
