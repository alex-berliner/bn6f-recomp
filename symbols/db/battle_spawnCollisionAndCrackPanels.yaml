name: battle_spawnCollisionAndCrackPanels
address: '0x080C89C8'
kind: function
status: probable
summary: Spawns a collision region at the battle object's panel and cracks adjacent panels based on Param1
  (1 = same + neighbors, 5 = self only).
interface: (r5 = battle object) -> r0 = clobbered; cracks panels via object_crackPanelIfIntact
details: Reads oBattleObject_Param1, masks with 3 to pick one of four bytes 0x50-0x53 from dword_80C8A5C,
  and calls sub_801BD3C with the object's PanelX/PanelY, Alliance, and r3=4. It then reads a 32-bit entry
  from byte_80C8A3C (Param1*4; values 3, 3, 0x100000, 0xFB03) and calls object_spawnCollisionRegion with
  PanelX/PanelY, r2=0, r3=0, r4=0xa05ff04, and the object's DamageAndStaminaDamageCounterDisabler as r6.
  If Param1 is 1 it cracks the object's own panel plus the panels one row above (y-1) and below (y+1);
  if Param1 is 5 it cracks only the object's own panel (r2=1 as the crack argument).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; and r0,#3 indexes dword_80C8A5C = 0x53525150 (bytes 0x50..0x53);
    bl sub_801BD3C with oBattleObject_PanelX/Y, oBattleObject_Alliance, r3=4; ldr r7,[r1,r0] from byte_80C8A3C
    passed to object_spawnCollisionRegion alongside PanelX/PanelY; Param1==1 branch calls object_crackPanelIfIntact
    three times with y, y-1 (add r1,#1 after pop swaps), y+1; Param1==5 branch (loc_80C8A28) calls object_crackPanelIfIntact
    once for the object's own panel
  refs:
  - bn6f/asm/asm31.s:36484
  - 0x080C88C8 sub_80C88C8
  - 0x080C8A60 object_crackPanelIfIntact
  - 0x080C536A object_spawnCollisionRegion
  - 0x0801BD3C sub_801BD3C
  reproduce: python3 tools/asmcat.py 0x080C89C8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s structure: it spawns a collision region via object_spawnCollisionRegion
    and cracks panels via object_crackPanelIfIntact, with the same Param1-based branching (cmp r0,#5;
    cmp r0,#1). However, the Param1==1 branch cracks the same panel three times (object panel, y+1, y-1)
    — not ''object''s own panel plus rows above/below'' as a single set, but rather calling crackPanelIfIntact
    thrice. Also the byte_80C8A3C table shows entries indexed by Param1*4, but values are 32-bit (0x3,
    0x3, 0x100000, 0xFB03) read as ldr r7,[r1,r0] which the proposal got right. The name ''battle_spawnPanelCrackEffect''
    is reasonable but ''battle_spawnCollisionAndCrack'' or ''object_spawnCollisionAndCrackPanels'' better
    reflects both behaviors.; run wf investigate investigate-20261019-015108; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- purpose of sub_801BD3C and meaning of the 0x50-0x53 bytes
- meaning of byte_80C8A3C entries and the constant 0xa05ff04 in object_spawnCollisionRegion
- which attack/chip object calls this (the only known caller sub_80C88C8 is itself undocumented)
