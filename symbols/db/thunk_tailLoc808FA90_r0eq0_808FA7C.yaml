name: thunk_tailLoc808FA90_r0eq0_808FA7C
address: '0x0808FA7C'
kind: function
status: confirmed
summary: Pure tail-call thunk that pushes the r4-r7/lr frame, sets r0 = 0, and branches to loc_808FA90, whose pop
  {r4-r7,pc} returns straight to this function's caller.
interface: void sub_808FA7C(void); // entered with r4-r7/r10/lr live, tail-calls loc_808FA90 with r0=0; r4-r7 come
  back restored via the callee's pop
details: 'The entire body is: push {r4-r7,lr}; mov r0,#0; b loc_808FA90 (0x0808FA90). It has no frame of its own
  — the pushed registers belong to the tail callee, which ends with pop {r4-r7,pc}, so the caller''s r4-r7 are restored
  and control returns directly to sub_808FA7C''s caller. Effectively it is "call 0x0808FA90 with argument 0" while
  keeping the caller''s callee-saved registers intact across the transfer. No game-meaningful logic lives here;
  its purpose depends entirely on what loc_808FA90 does. r10 is live on entry but only because the contract records
  caller state, not because this code touches it. Flags nzcv are clobbered by the callee''s path, not by this stub
  itself.

  '
