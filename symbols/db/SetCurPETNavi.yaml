name: SetCurPETNavi
address: '0x080010BE'
kind: function
status: confirmed
summary: Stores the selected PET navi index (r0) into the game state's CurPETNavi byte.
interface: void SetCurPETNavi(u8 naviIndex /* r0, via r10 = toolkit, returns game state ptr in r3 */)
details: 'Reads the toolkit''s game state pointer (r10 + oToolkit_GameStatePtr), then writes the

  low byte of r0 (navi index) to oGameState_CurPETNavi (offset 1 in the game state

  structure). Only one byte is written, so the caller is expected to pass a valid navi

  index in r0. Quirk: r3 is left holding the game state pointer on return, though the

  register contract lists r3 as an output - callers likely ignore it, but any caller

  that uses r3 after the call receives the GameState pointer. lr is used as the return

  via "mov pc, lr", which is fine only for non-Blx-style returns within ARM state

  (standard Thumb leaf pattern here). Does not touch flags.

  '
