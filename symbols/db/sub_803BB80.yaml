name: sub_803BB80
address: '0x0803BB80'
kind: function
status: confirmed
summary: Decrements a 32-bit "uses remaining" counter on the object pointed to by r5; returns 0 if a use was consumed,
  1 if already exhausted.
interface: '// r5 in: pointer to a struct with a u32 use counter at offset 0x28

  // returns r0: 0 = decremented, 1 = already <= 0 (no write)

  // flags out: C/V from the SUBS r0,#1 on the loaded counter value; N/Z clobbered by the final MOV r0,#0/#1

  void sub_803BB80(void);

  '
details: 'Reads the 32-bit field at r5+0x28, decrements it in memory only if it was

  strictly positive, and returns 0 to signal success. If the field is 0 or

  negative the memory is left untouched and 1 is returned to signal the

  counter was already exhausted. The struct field is treated as signed for

  the branch (`blt` after `sub r0,#1`), so any negative stored value is

  also "exhausted". r0 is the only caller-visible register besides lr;

  the `mov pc, lr` epilogues use literal return values (#0 / #1) so N/Z

  on exit reflect the return code, while C/V reflect the decrement test.

  Reads and writes: [r5+0x28] (u32, read; conditionally written back as value-1).

  '
