name: sub_802BE90
address: '0x0802BE90'
kind: function
status: confirmed
summary: Dispatches the battle object in r5 to the per-state handler chosen by [r5+2] via a four-entry jump table
  at off_802BEA4.
interface: 'void dispatchBattleObjectState(u32 object /* r5 */);

  // passes through r2, r4, r6, r7, r10 to the handler unchanged;

  // handler''s return lives in r5-r12 (passed back to caller as-is)

  '
details: "Reads the 1-byte state field at object+2 (r5+2) and uses it as an index into\nthe handler table at off_802BEA4\
  \ (four Thumb entries, address forced into ARM\nby the +1). Offsets and entries:\n  [0] = sub_802BEB4\n  [1] =\
  \ dispatchBattleObjectBehavior_802BF4C\n  [2] = sub_802C170\n  [3] = runObjectStateHandler_802C1D4\nActs as an\
  \ indirect tail-call dispatcher: it pushes lr, loads the handler\naddress, sets lr=pc, and bx's into it, so the\
  \ handler returns directly to\nthe original caller. Reserves 4 bytes on SP for the duration of the call\nbecause\
  \ the handlers compute frame-relative addresses. No own output is\nproduced; results in r5-r12 are whatever the\
  \ selected handler leaves behind.\n"
