name: battle_loadOverlayTiles
address: '0x0801DE3C'
kind: function
status: probable
summary: Queues a small GFX upload, draws an 18x2 run of background tiles from a static tile list, and sets bit
  0x20 in the eStruct2035280 flag word.
interface: () -> void; touches IWRAM GFX queue buffer unk_3001A80, BG tile VRAM via CopyBackgroundTiles, and flag
  word eStruct2035280+0x44
details: First it queues a 0x20-byte DMA-style transfer of dword_86E1C78 into the IWRAM buffer unk_3001A80 via QueueEightWordAlignedGFXTransfer.
  It then calls CopyBackgroundTiles to write tiles 6,0 of tile block 3, taking an 0x12x2 (18x2) rectangle of tile
  indices from the static table word_801ED6C, i.e. it paints a fixed strip of background tiles. Finally it ORs bit
  0x20 (1<<5) into the flag word at eStruct2035280+0x44 via flagSetBits_eStruct2035280_801BEB8, likely marking the
  drawn overlay/state as active so it is not redrawn. No arguments are taken and no value is returned. The exact
  gameplay meaning of the flag bit and the painted strip is not derivable without a caller.
