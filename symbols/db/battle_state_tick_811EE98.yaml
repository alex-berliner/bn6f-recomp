name: battle_state_tick_811EE98
address: '0x0811EE98'
kind: function
status: confirmed
summary: Battle-state tick handler that decrements the per-frame countdown by 4, clamps at -32, and triggers
  a timeout (state byte 0xC) when the PET GFX animation finishes.
interface: void sub_811EE98(u32* r5 /* battle state struct */) -> void (clobbers r0,r1,r2,r3,lr,nz,c,v;
  caller must preserve r5)
details: 'Operates on a battle state struct passed in r5. Reads the 16-bit countdown at offset 0x10,

  subtracts 4 each invocation, and stores it back. When the value reaches or falls below the

  floor constant 0xFFFFFFE0 (-32, loaded via `ldr r1, byte_811EEC8` and sign-extended by the

  subsequent `cmp`/`bgt`), the countdown is clamped to 0xFFE0 and the struct''s first byte

  (offset 0x0) is set to 0x0C, indicating a countdown timeout/defeat transition - but only

  if the PET-related GFX animation slot 0x10 is no longer active (checked via

  IsGFXAnimActive; non-zero return means still active and the flag is NOT set).

  Regardless of the branch, it then unconditionally calls sub_811F0C8, sub_811F11C,

  CopyBackgroundTiles_PET_811EF70 and CopyBackgroundTiles_onNaviSelect_811F54C - the

  latter two are PET and Navi-select background tile blits, suggesting this state is the

  PET / Navi-customisation battle entry screen where a pre-battle countdown plays over a

  choice of Navi. The "0x10" animation id matches the PET animation budget already used

  by the copy-tile helpers, reinforcing the PET-context reading.

  Quirks: floor is loaded as a 32-bit negative constant (0xFFFFFFE0) but only the low 16

  bits are stored; the `bgt` comparison treats r0 as signed so equality still triggers the

  floor branch. State byte write uses `strb` so only the LSB of r0 matters.

  '
