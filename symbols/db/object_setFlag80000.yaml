name: object_setFlag80000
address: '0x0802AF28'
kind: function
status: probable
summary: Sets bit 0x80000 in a battle object's flags2 word, used by overworld chatbox-wait state machines.
interface: (r0 = object ptr) -> r0 = set bits; no other return/flags used
details: 'Thin wrapper: saves r0 into r5, loads the constant 0x80000 from the literal pool, and calls
  object_setFlag2(object, 0x80000) to OR that bit into the object''s flags2 word in its collision data.
  The single literal 0x80000 confirms it exists only to set this one bit. Its callers are the chatbox-wait
  object step (ow_chatboxWaitStep) and three nearby undocumented routines, all of which appear to drive
  overworld object state machines around dialogs. The bit''s gameplay meaning (e.g. ''has been talked
  to'' / ''interaction finished'') is inferred only from that caller context.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'body: ldr r0, =0x80000 then bl object_setFlag2 with the object pointer in r0; caller 0x0802AE14
    is ow_chatboxWaitStep, a dialog-waiting object state step; three sibling callers 0x0802AC10/0x0802AC6E/0x0802AD84
    sit in the same overworld-object code block; callee object_setFlag2 is documented as setting bits
    in the object''s flags2 field'
