name: e_dispatchStateHandler
address: '0x0803ED1C'
kind: function
status: probable
summary: Dispatches via the byte at eStruct200BC30+5 to one of two thumb routines, then if that byte is
  0 and it returned 4, surfaces 4; otherwise returns the original r0 argument.
interface: (r0 = value passed through to caller) -> r0 = same value, or 4 when mode byte is 0 and the
  handler returned 4; no flags of interest
details: 'Reads the byte at eStruct200BC30+0x5 and uses it to index a two-entry thumb handler table (sub_803ED4C
  for state 0, sub_803EE98 otherwise), calling the handler with lr=pc. After the call it re-reads the
  +0x5 byte: if it is now 0 and the handler returned 4, the function overrides its return value to 4;
  otherwise it returns the original r0 argument unchanged (r7, set on entry, is callee-saved so handlers
  cannot alter it). So the +0x5 byte selects which of two update routines runs, and 4 appears to be a
  ''phase complete'' code surfaced to the caller. The caller sub_803EB04 only invokes this after sub_803DEB4
  returned 2, so this is the second stage of a multi-step update sequence.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#0x5]; ldr r0,[r0,r1]; bx r0 — indexed dispatch on eStruct200BC30 field 5 (asm at
    0x0803ED24-0x0803ED2C); off_803ED40 holds exactly two targets, sub_803ED4C+1 and sub_803EE98+1 — the
    state machine has two modes; tst r1,r1 / bne + cmp r0,#4 / mov r7,r0 — return forced to 4 only when
    field 5 is 0 and handler returned 4; mov r0,r7 / pop — otherwise the caller's r0 is returned unchanged,
    acting as a pass-through status; caller sub_803EB04 calls this only when sub_803DEB4 returns 2 — it
    is a conditional second stage of an update chain
  refs:
  - bn6f/asm/asm03_1_1.s:12247
  - 0x0803EB04 sub_803EB04
  reproduce: python3 tools/asmcat.py 0x0803ED1C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The handler table at off_803ED40 has two entries (sub_803ED4C and sub_803EE98), and the byte at
    eStruct200BC30+5 selects between them — but the index is loaded directly from r1 (0 or non-zero),
    not specifically ''state 0 vs otherwise'' as a two-mode dispatcher with explicit modes. The post-call
    logic re-reads +5 and overrides r7 to r0 when the byte is 0 AND r0==4, matching the proposal. However,
    the proposal claims ''r7 is callee-saved so handlers cannot alter it'' — r7 is saved on entry and
    only written here, which is fine. The bigger issue: the function doesn''t ''step'' anything; it just
    dispatches and possibly maps a return code. Also the ''finished'' -> 4 mapping is backwards: if mode
    byte is 0 after the call and the handler returned 4, then r7 (originally the input r0) gets overwritten
    to 4 — so the return value becomes 4 only when the handler signaled completion. The proposed name
    e_stepStateHandler and the ''finished result'' framing are close but slightly misleading about direction.;
    run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
