name: sub_80902DC
address: '0x080902DC'
kind: function
previous_names: []
status: probable
summary: 'Mr. Weather comp: tests a per-map event flag and returns whether it is set — flag 0x0BE1 + MapNumber,
  or 0x0FD2 when the map group is 0x85 (undernet?). Table byte_8090300 = { 0x0BE1, 0x0BE2, 0x0BE3, 0x0FD2 }.'
details: 'Reads GameState.MapGroup; if it is 0x85 uses table index 3, otherwise index = GameState.MapNumber (so
  maps 0..2 of a normal group). The u16 at byte_8090300 + 2*index is tested with TestEventFlag and the result returned
  via flags (TestEventFlag leaves !zf). weatherComp_pickScript_8090104 (asm25.s:1215) skips its next candidates
  when this flag IS set: it gates the start of cutscene byte_808F728 (which sets flag 0xBF2 and plays a text archive).'
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: 'Body re-read (answers the dossier''s open question "what empties the rainbow meter — sub_80902DC unread"):
    it is a plain event-flag test, no RNG, no counter writes.'
  reproduce: awk 'index($0,"sub_80902DC:")==1{f=1} f{print} f&&/thumb_func_end/{exit}' bn6f/asm/asm25.s; grep -n -A4 '^byte_8090300:' bn6f/asm/asm25.s
  result: 'body at asm25.s:1460-1483 reads oGameState_MapGroup (cmp #0x85 -> index 3) else oGameState_MapNumber, loads the u16 at byte_8090300+2*i and calls TestEventFlag; byte_8090300 bytes E1 0B E2 0B E3 0B D2 0F = 0x0BE1 0x0BE2 0x0BE3 0x0FD2; the sole caller is weatherComp_pickScript_8090104 at asm25.s:1215'

