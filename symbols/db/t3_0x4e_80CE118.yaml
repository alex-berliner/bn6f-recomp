name: t3_0x4e_80CE118
address: '0x080CE118'
kind: function
status: confirmed
summary: Dispatches a battle object's current-state byte through a small jump table to the matching state handler.
interface: void battleObject_dispatchState_80CE118(u32 r2_in, struct BattleObject *r5_obj, u32 r10_in) /* clobbers
  r0-r4, r6-r7, lr, NZCV; preserves r5, r8-r12; on return r5/r8-r12 carry the handler's results */
details: 'Reads `oBattleObject_CurState` (a single byte at r5+offset) and uses it to

  index the jump table at off_80CE12C (states 0..2 mapped to

  battleObject_spawnEntry_80CE138, sub_80CE178, sub_80CE21C). The chosen

  handler is entered via `mov lr,pc ; bx r1`, with r0 = the state byte,

  r1 = table base, r2/r5/r10 passed through from the caller, and the

  dispatcher''s `push {lr}` placing the original caller''s return address

  at [SP] where some handlers peek at it. The handler''s results in

  r5/r8-r12 flow out to the dispatcher''s caller unchanged. The literal in

  the table load is `0x80ce128` (pointer to off_80CE12C).

  '
