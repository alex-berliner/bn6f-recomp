name: ai_initColonelAttack
address: '0x081016C8'
kind: function
status: probable
summary: 'Initializes Colonel''s AI attack state: resets per-attack vars, picks a panel-choosing attack
  (id 12) targeting the player.'
interface: (r7 = AI attack vars struct, r5 = own BattleObject) -> r0 = 0 via object_setAttack0; sets difficulty
  tier, init flag, duration, boost, target, panel callback in struct
details: Stores the AI difficulty tier (from battle_getAiDifficultyTier_800FE36) into oAIAttackVars_AiDifficultyTier
  and clears oAIAttackVars_InitFlag. Calls sub_810176E with 3 (likely selects attack type 3 in the AI
  state machine), then sub_8101524/sub_8101538 to fill oAIAttackVars_AttackDuration and oAIAttackVars_AttackBoost2,
  and installs sub_81038FE as oAIAttackVars_PanelChooseCallback, implying the attack needs panel selection.
  It XORs oBattleObject_Alliance with 1 and calls battle_findPlayer to store the player-side object as
  oAIAttackVars_TargetObjectPtr, then issues attack id 0xc (12) via object_setAttack0. Called from sub_81013AA
  under state guards (cmp 2/3/1) with a random 1-or-2 pick, so it is one of Colonel's randomly chosen
  attack initializations.
