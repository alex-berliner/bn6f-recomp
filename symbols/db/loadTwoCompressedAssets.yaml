name: loadTwoCompressedAssets
address: '0x0809A308'
kind: function
status: probable
summary: Decompresses two LZ77-compressed ROM assets into fixed RAM buffers via the table-driven loader.
interface: () -> void; no return value, no flags used
details: Builds a 12-byte-entry init reference table (source ROM pointer, destination RAM address, and
  a shared third word that appears to be a size/limit for both entries) and passes it to decompAndCopyData.
  Entry 1 decompresses comp_86C7980 into unk_2034E00; entry 2 decompresses comp_86C73D8 into unk_2036500;
  both entries use unk_2033700 as their third field, suggesting both assets share a size bound. The table
  is NULL-terminated, ending the loader pass. The function itself is a thin wrapper — no other logic beyond
  pushing lr, calling the loader, and returning. Its only purpose is bulk asset decompression at load
  time; what the two buffers are subsequently used for is not visible here.
