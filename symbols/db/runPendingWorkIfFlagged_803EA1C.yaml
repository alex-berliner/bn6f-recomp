name: runPendingWorkIfFlagged_803EA1C
address: '0x0803EA1C'
kind: function
status: confirmed
summary: If the flag byte at 0x200AD04 is non-zero, dispatch to sub_803F560 to service the pending work; otherwise
  do nothing.
interface: void sub_803EA1C(void); // no meaningful inputs or outputs; calls notZero_eByte200AD04 and conditionally
  sub_803F560, so r0-r3 and flags reflect whatever those leave behind
details: Tiny gated dispatcher. First calls notZero_eByte200AD04, which tests the byte at EWRAM 0x200AD04 and returns
  its zero/non-zero state (branch taken when zero). If the byte is non-zero, calls sub_803F560 to perform the pending
  work; the flag byte itself is not cleared here, so clearing (if any) must happen inside sub_803F560. Preserves
  r4-r7 via push/pop and returns directly to its caller. No other memory or registers are touched. Likely a per-frame
  "is there queued work? process it" hook used by some subsystem's update loop; the exact domain depends on what
  byte_200AD04 and sub_803F560 belong to.
