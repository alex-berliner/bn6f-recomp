name: sprite_positionSubmenuEntries_8116FDC
address: '0x08116FDC'
kind: function
status: confirmed
summary: Lays out the three sprites of a submenu entry slot (selected entry plus its two neighbours) around an anchor
  point and toggles each entry's visible/hide flag depending on whether the anchor is on screen.
interface: void sub_8116FDC(u32 baseX /*r0*/, u32 baseY /*r1*/, u32 firstPoolIndex /*r2*/); preserves r4-r7, r5
  returned untouched, r3 left as sprite_setCoordinates left it
details: "Iterates over three object-pool indices (firstPoolIndex .. firstPoolIndex+2), resolving each\nthrough\
  \ getStructFrom2008450 (r0=index in, Z flag set means no object at that index, r1 = struct\npointer out); unregistered\
  \ indices are skipped. For each entry:\n- x offset: the selected entry (index == firstPoolIndex) and any neighbour\
  \ whose halfword at\n  struct+0xE is nonzero use the table byte_8117060 (one {dx,dy} pair per slot: slot 0 = {0,0},\n\
  \  slot 1 = {0xFFF3,0}, slot 2 = {0x0D,0}, i.e. neighbours 13px left/right of the anchor).\n  A neighbour with\
  \ struct+0xE == 0 \"huddles\" toward the selected entry instead: 7px\n  (0xFFFFFFF9) while its counter halfword\
  \ at struct+0xC is < 10, then 3px (0xFFFFFFFD) after.\n- y offset always comes from the table.\nCalls sprite_setCoordinates(baseX+dx,\
  \ baseY+dy, entry) (r5 carries the entry pointer through\nthe call and is restored on exit).\nVisibility: clears\
  \ bit 1 of the entry's status byte at struct+0 (show) only when the anchor is\non screen (baseX < 0x38) AND the\
  \ current submenu id at sSubmenu is 0x18 or 8; otherwise sets\nbit 1 (hide). The anchor x cutoff 0x38 makes entries\
  \ slide out instead of being drawn off-edge.\nTouches: object-pool structs (+0x00 status byte, +0x0C huddle counter,\
  \ +0x0E expand flag),\nbyte_8117060 offset table, sSubmenu current-menu byte.\n"
