name: battle_stepObjectXByVelocityAndDestroyIfInvalidPanel_80C6A08
address: '0x080C6A08'
kind: function
status: confirmed
summary: Moves a battle object one step sideways by its X velocity (in panel space) and destroys it if the panel
  it lands on is not a valid standing spot.
interface: void battle_stepObjectXByVelocityAndDestroyIfInvalidPanel(/* r5 */ struct BattleObject* obj)  // r4,
  r5, r6 in; r4/r6 preserved; returns validity flag of final panel in r0 with nz/c/v set from it
details: 'Expects r5 = battle object pointer. Reads the object''s XVelocity (oBattleObject_XVelocity) as a full
  32-bit value and adds it to the byte-sized PanelX (oBattleObject_PanelX), storing the wrapped result back — since
  PanelX is one byte the add wraps modulo 256, which acts as wraparound within the one tile dimension. Then calls
  object_setCoordinatesFromPanels to recompute pixel coordinates from the new panel position, object_updateCollisionPanels
  to refresh the occupied collision tiles, and object_isCurrentPanelValid to test whether the object now stands
  on a walkable/valid panel. If the panel is invalid (r0 == 0): clears the object''s collision region (object_clearCollisionRegion),
  clears bit 1 (value 2) of oObjectHeader_Flags (an "active"/collidable-style flag), and writes CUR_STATE_DESTROY
  (8) into oBattleObject_CurStateActionPhaseAndPhaseInitialized to mark the object for destruction this frame. Returns
  with r0 = 0 and nz set from the destroy state in the invalid case, or nz/c/v reflecting the panel-validity test
  in the valid case. Callers pass r4/r5/r6 with the object in r5; r4 and r6 are preserved.

  '
