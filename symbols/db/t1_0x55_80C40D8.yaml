name: t1_0x55_80C40D8
address: '0x080C40D8'
kind: function
status: confirmed
summary: 'State dispatcher for battle object template 0x55 (a beast-related object): jumps to the state 0 init /
  state 1 update / state 2 free handler selected by the object''s CurState byte.'
interface: void battle_object55_stateDispatch(BattleObject* r5 object, u32 r10 passThrough); // tail-dispatches
  via guest call, results carried in r5 r8 r9 r10 r11 r12
details: "Reads the object's oBattleObject_CurState byte from the BattleObject at r5, then uses it as a\nraw word\
  \ offset into the handler table at off_80C40EC (no bounds check, matching the original):\n  state 0 -> battle_object_spawnBeast_80C40F8+1\
  \ (state init, spawns the beast)\n  state 1 -> t1_0x55_updateFromRelatedObject_80C4146+1 (per-frame update, apparently\
  \ driven by a related object)\n  state 2 -> object_freeMemory+1 (frees the object)\nEnters the chosen handler\
  \ with r0 = CurState value, r1 = the handler's own entry address\n(from the table), r5 = object pointer and r10\
  \ passed through untouched. The dispatch is done\nwith mov lr, pc / bx r1 so the handler's final r5/r8/r9/r10/r11/r12\
  \ land directly in the\nregister file before the pop {pc} returns to the caller; nothing is explicitly copied\
  \ back.\nFlags nz/c/v are clobbered by the handler.\n"
