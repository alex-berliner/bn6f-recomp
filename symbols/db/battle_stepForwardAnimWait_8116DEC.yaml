name: battle_stepForwardAnimWait_8116DEC
address: '0x08116DEC'
kind: function
status: confirmed
summary: Advances an object's "step forward" animation (pose 0x16) and marks its state as finished (state 8) once
  0x11A frames have elapsed.
interface: void battle_stepForwardAnimWait(r5 = object state ptr); out r0 = frames run by sprite_addCoordinates
  (or 8 on the finished path), r1-r3 scratch, NZCV from the final CMP (elapsed vs 0x11A) or from mov r0,#8 on the
  finished path; lr clobbered
details: 'Per-frame tick for an object whose current behavior is a long forward movement.

  Calls sprite_addCoordinates with pose/animation id 0x16 and parameter 0; that

  helper returns the number of frames the movement has run so far. The returned

  count is compared against the constant 0x11A (282 frames, ~4.7 s at 60 fps)

  loaded from dword_8116E04. While the count is below the limit nothing else

  happens; once it reaches the limit, the object''s state byte at [r5+8] is set

  to 8, which presumably switches the object to its next behavior/state.

  Quirks: on the finished path the store byte 8 is also left in r0, so callers

  reading r0 must distinguish "elapsed count" from the sentinel 8; the flag

  outputs differ between the two exit paths (CMP flags vs mov-set NZ, V unchanged).

  r5 is the only real input and is used purely as the object-state base pointer.

  '
