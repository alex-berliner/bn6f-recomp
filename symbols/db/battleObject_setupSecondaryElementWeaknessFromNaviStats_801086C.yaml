name: battleObject_setupSecondaryElementWeaknessFromNaviStats_801086C
address: '0x0801086C'
kind: function
previous_names:
- sub_801086C
status: probable
summary: Sets the battle object's secondary-element weakness using stat look-ups of the actor's and its
  foe NaviStats.
interface: '() -> void ; side effects: writes SecondaryElementWeakness and SecondaryElement on the actor''s
  CollisionData (r5->r0 via battle object lookup)'
details: "Callee of several battle-object init/setup paths (e.g. playerObject_init_80172F0, sub_80144CA,\
  \ sub_802D7A0 and friends). Uses GetBattleNaviStatsByte_AllianceFromBattleObject (r5 keeps the battle\
  \ object) to pull two values: first NaviStats byte 0x29, then if 0 fallback, NaviStats byte 0x2c. The\
  \ selected byte indexes table byte_80108B8 (25 entries of mostly 0x1/0x2/0x3/0x4). That byte is passed\
  \ to sub_8019F8C.\n  After that, it does a parallel pass for the opposing side: try NaviStats byte 0x2c\
  \ first, then 0x29, indexed into table byte_80108D1 (single-element bit flags). That byte is passed\
  \ to battleObject_SetSecondaryElementWeakness_8019F9E which writes SecondaryElementWeakness / SecondaryElement\
  \ (offset 0x18/0x19) on the CollisionData.\n  r4/r5 are preserved/callee-saved; the function returns\
  \ 0 in r0 with no flags requirements.\n  All three callees are battle-element/elemental helpers. The\
  \ two lookup tables encode element mapping per NaviStats combination.\n"
