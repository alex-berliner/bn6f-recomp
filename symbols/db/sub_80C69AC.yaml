name: sub_80C69AC
address: '0x080C69AC'
kind: function
status: confirmed
summary: 'Per-tick update for a battle object: manages collision data lifecycle, detects landing on a panel, dispatches
  movement or phase handler via jump table, and destroys the object if it moves off a valid panel.'
interface: void battle_object_stepTick(u32 r4, BattleObject *obj /* r5 */, u32 r7, u32 r8, u32 r10) -> r5, r8, r9,
  r10, r11, r12 modified; r7 preserved
details: 'Called each battle frame for every active object. Sequence: (1) object_removeCollisionData clears last-frame
  collision bookkeeping; (2) object_spawnCollisionEffect re-creates the visual hit effect; (3) reads obj->CollisionDataPtr,
  checks CollisionData->FlagsFromCollision (contact flag); if contact occurred and the LANDED flag (bit 8, 0x100)
  is not yet set on the object, sets it via object_setFlag1, transitions CurAction to 4 (landed), and resets CurPhaseAndPhaseInitialized
  to 0; (4) jump-table dispatch on obj->CurAction: index 0 calls battle_stepObjectXByVelocityAndDestroyIfInvalidPanel_80C6A08
  (advance x by velocity, destroy if panel invalid), index 1 calls battle_object_dispatchPhaseHandler_80C6A34 (run
  the current phase''s handler); (5) object_presentCollisionData commits the updated collision rectangle; (6) destroy
  path (reached via bx from the movement handler when the panel is invalid): calls object_clearCollisionRegion,
  clears bit 2 of the byte at obj+0 (active/valid flag), writes 8 to obj+8 (death/inactive tag), then returns. Quirk:
  the jump-table callee may branch to 0x80C69E8 within this function''s range instead of returning to 0x80C69E2,
  so C cannot model the full control flow.'
