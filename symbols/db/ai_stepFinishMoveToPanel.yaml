name: ai_stepFinishMoveToPanel
address: '0x081099DA'
kind: function
status: probable
summary: AI attack step routine that, on the last tick of a move, teleports the object onto its reserved
  future panel and updates its battle state.
interface: (r5 = battle object, r7 = AI attack vars struct) -> void; spawns effect objects, no return
  value
details: Runs once per frame for an enemy's scripted movement attack. While oAIAttackVars_StepTimer equals
  3 and the AI difficulty tier has bit 1 set, it spawns an effect at the destination panel (FuturePanelX/Y
  converted to pixel coordinates via object_getCoordinatesForPanels, r3=0x100000). Each tick decrements
  StepTimer; on reaching 0 it spawns another effect built from fields at object+0x34..0x39 (plus 0x100000
  offset), copies FuturePanelX/Y into PanelX/PanelY, calls object_removePanelReserve, object_setCoordinatesFromPanels
  and object_updateCollisionPanels (recomputing position and facing), then calls sub_81096BA (likely the
  attack action itself). On hard difficulty (tier bit 0) it also forces the animation to oAIAttackVars_AttackStepIndex.
  Finally it reloads StepTimer from oAIAttackVars_AiAttackParam and sets HitElement to 8.
