- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_getFrontDirection gives the forward-facing sign, so tiles extend ahead of the object;
    loop counts 1, 3, 5 with column offsets 1*dir, 2*dir, 3*dir match a widening cone of panels; every
    iteration does bl sub_80B9288 with (PanelX+col, PanelY+row) as arguments; r5 indexing uses oBattleObject_PanelX/oBattleObject_PanelY
    battle object fields
