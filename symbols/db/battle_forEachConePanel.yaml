name: battle_forEachConePanel
address: '0x080B9240'
kind: function
status: probable
summary: Enumerates the panels in an expanding 1-3-5 cone in front of a battle object, invoking a per-panel
  callback for each.
interface: (r0 = battle object pointer, used via oBattleObject_PanelX/PanelY fields) -> r0 clobbered;
  calls sub_80B9288(r0=x, r1=y) for every cone tile
details: 'First calls object_getFrontDirection to get the +1/-1 forward multiplier for the object''s side,
  then walks three columns ahead of the object''s panel: 1 tile at x+dir, 3 tiles at x+2*dir (y-1..y+1),
  and 5 tiles at x+3*dir (y-2..y+2). Each (x,y) pair is passed to sub_80B9288, whose behavior determines
  the function''s net effect. The tile coordinates are read from the battle object struct fields oBattleObject_PanelX
  and oBattleObject_PanelY.'
