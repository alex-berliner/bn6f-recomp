name: map_getPerMapTableRowPtr_80A9570
address: '0x080A9570'
kind: function
status: confirmed
summary: Returns a pointer into one of four per-map 8-byte-row data tables, selecting the row indexed
  by a byte in the caller's object struct.
interface: u8* map_getPerMapTableRowPtr(struct SomeObj* obj /*r5*/, struct Toolkit* toolkit /*r10*/)
details: 'Reads the toolkit''s GameState pointer (r10+oToolkit_GameStatePtr), then computes a table selector:
  if the state''s MapGroup byte (oGameState_MapGroup) equals 0x85 the selector is forced to 3, otherwise
  it is the state''s MapNumber byte (oGameState_MapNumber). The selector indexes off_80A9598, a four-entry
  list of table bases (byte_8143724, byte_814375C, byte_8143794, byte_81437CC) — one table per map. Each
  table has 8-byte entries; the row index is the byte at [r5,#4] of the object passed in r5, multiplied
  by 8. The result (tableBase + 8*rowIndex) is returned in r0; callers presumably use it as a pointer
  to an 8-byte record (two words) for that row of the current map''s data. Flags NZCV are clobbered; only
  r0 is meaningful on return.

  '
