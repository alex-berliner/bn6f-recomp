    run wf investigate investigate-20261019-003606'
open_questions:
- What the four handlers sub_80CCAF4, sub_80CCBD0, sub_80CCBDC, sub_80CCBF6 do, i.e. which CurAction values
  0-3 they correspond to
- What the byte at oBattleObject_ExtraVars means when zeroed (a per-object enable/alive flag?) and why
  only one ExtraVars byte is cleared
