- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly reads AIAttackVars_ScratchVar through r7 and branches to the reset path when it is
    zero (0x0810D8B2-0x0810D8BE).; A nonzero ScratchVar decrements SubStepIndex and wraps 1 to 16 (0x0810D8C0-0x0810D8CE).;
    The transition branch passes 0x2C to PlaySoundEffect (0x0810D8D2-0x0810D8D6).; The completion path
    writes CurAnim, StepTimer, ChargeCycles, and HitElement (0x0810D8D8-0x0810D8E4).; Recorded execution
    occurs during battlesweep, beastsp, story4, and story6, consistent with combat attack timing.
