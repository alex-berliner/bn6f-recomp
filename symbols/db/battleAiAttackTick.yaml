name: battleAiAttackTick
address: '0x0810D8B2'
kind: function
status: probable
summary: Advances an AI-controlled attack's substep and timer, then resets it to the animation and duration
  state for the next cycle.
interface: (r5 = battleObject, r7 = AIAttackVars) -> void; flags conditionally modified
details: If ScratchVar is nonzero, the function decrements SubStepIndex and cycles it from 1 back to 16;
  that transition plays sound effect 44. It then decrements StepTimer, leaving the existing state unchanged
  until the timer expires. On expiration or when ScratchVar is zero, it sets the battle object's animation
  to 3, copies AttackDuration into StepTimer, and initializes ChargeCycles to 22 and HitElement to 8.
  The function is reached by recorded battle, beast, and story routes, but no direct caller is identified.
