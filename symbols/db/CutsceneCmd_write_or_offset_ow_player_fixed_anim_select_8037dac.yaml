name: CutsceneCmd_write_or_offset_ow_player_fixed_anim_select_8037dac
address: '0x08037DAC'
kind: function
status: confirmed
summary: Map-script cutscene command that sets the overworld player's fixed animation select, either to an immediate/table
  value or to an offset from the player's current facing direction.
interface: void CutsceneCmd_setOwPlayerFixedAnimSelect(void) — reads script operands via ReadMapScriptByte; returns
  r0 = 1 (success); advances the script pointer r7 by 4; uses r5 (script context/table base) and r10 (script state),
  clobbers r0, r1, r3, r4, r6 and flags (nz c v)
details: "Cutscene/map-script command handler for the overworld player's \"fixed animation select\"\n(the animation-slot\
  \ selector in the s200ace0 overworld-player structure).\n\nTwo script operands are consumed via ReadMapScriptByte,\
  \ whose mode is selected in r6:\n  1. Animation value (mode 2 read): if the byte read is 0xFF, the value follows\
  \ as a\n     raw immediate (fetched with a mode-3 read); otherwise the byte is an index into\n     the lookup\
  \ table at r5 and the actual value is loaded from there (ldrb r4,[r5,r4]).\n  2. Offset flag (mode 1 read): if\
  \ nonzero, the animation value is treated as a\n     relative offset and added to GetOWPlayerFacingDirection()'s\
  \ result, so the\n     effective animation is (facing + offset) — e.g. to pick a directional animation\n     relative\
  \ to which way the player sprite is currently facing. Note the code relies\n     on GetOWPlayerFacingDirection\
  \ preserving r4 (the offset).\n\nThe final value (in r0) is passed to owPlayer_setS200ace0_fixedAnimationSelect_809e13c,\n\
  which writes the fixed-animation selector on the overworld player object at s200ace0.\n\nOn completion the handler\
  \ adds 4 to the script pointer (r7) — this command's total\nencoded length — and returns r0 = 1 to signal the\
  \ script step succeeded.\n"
