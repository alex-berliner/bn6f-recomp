open_questions:
- Exact meaning/range of the fixed animation select values and how they index the player's fixed-animation set.
- Whether the table at r5 is a per-script constant table or shared script-data storage, and how the 0xFF immediate
  marker interacts with larger operand encodings.
- Behavior when facing-direction + offset wraps past the valid direction/animation range.
