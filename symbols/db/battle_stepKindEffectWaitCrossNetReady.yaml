  the task in this waiting phase. Once the readiness check returns nonzero, the function returns without
  touching state, letting an outer dispatcher move to the next phase. The struct at r5 is the standard
  battle task work area with a phase byte at +3 and halfword scratch/state fields at +2/+8.
