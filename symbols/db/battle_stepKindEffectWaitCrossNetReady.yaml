details: First entry (phase byte [r5+3] == 0) dispatches battle sub-effect 0x1C through battle_dispatchKindEffect_801E792,
  zeroes halfword [r5+8] (a timer or sub-state), and sets the phase to 4. On every call it polls comm_checkCrossNetBattleReady_801E754;
