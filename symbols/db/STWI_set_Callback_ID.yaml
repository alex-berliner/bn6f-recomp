name: STWI_set_Callback_ID
address: '0x0814C378'
kind: function
status: confirmed
summary: Sets the wireless (STWI) callback ID by storing it into the callback-ID field of the STWI work struct.
interface: void STWI_set_Callback_ID(u32 callbackId /* r0 */)
details: 'Reads the pointer at dword_2010CCC (the STWI/wireless work-area pointer), then stores r0 (the callback
  ID) into that struct''s field at offset +0x20, which is the STWI callback-ID slot used by the wireless library
  (e.g. CGB Wireless Adapter stack). Only r1 is used as scratch; everything else, including the caller''s r0, is
  untouched. The function is a plain tail return (bx lr), so no flags or other state are affected. Naming matches
  the official-style STWI_* naming already used in the disassembly.

  '
