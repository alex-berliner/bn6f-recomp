  (queueGFXTransfersFromTable_811EC68). The entries it holds come from a packed source table walked two
  words at a time via sub_811FB84, plus a trailing verbatim table copied in (off_811ECB4). The bound 0x40/0x30/0x20
  word caps match the per-call source sizes; the buffer has 96 bytes = 24 words, enough headroom for the
  largest caller.
