open_questions:
- The semantic role of 0x5A5856 (looks like a packed ASCII string "ZXV", so probably a code label baked into the
  ROM rather than a data pointer) is not verifiable from this frame alone; the lifter's callee summary describes
  it as "applyAIDataToAttackTable", which is the best hint we have for what 0x5A5856 points at.
- Whether r1 truly is a `count` or a `stride/struct-size`; combining with r3=5 and a known AIData size of 0x100
  (per the inc), 0x20 is too small to be a single AIData, so it is almost certainly an inner per-actor slice (e.g.
  TotalDamage/Joypad block). Callee disassembly would settle this.
