name: sub_8123BE0
address: '0x08123BE0'
kind: function
previous_names: []
status: hypothesis
summary: Configures and dispatches battle-object attack-variable (AIData) initialisation for the per-frame battle
  setup chain.
interface: '(r5 = BattleObject*, r10 = Toolkit*) -> no return; side-effect: populates AIData at 0x020047CC via sub_8123C20
  with arg block in IWRAM at 0x081233D8'
details: "- The function does no real work in its own frame: it just sets up a fixed argument vector and tail-calls\
  \ sub_8123C20 (named here by the lifter as battleObject_applyAIDataToAttackTable_8123C20).\n  - r0 = dword_8123BFC\
  \ (a ROM pointer = 0x5A5856, used as the AIData/AIState base from `0x08123BFC`), r1 = 0x20 (count/stride into\
  \ the AI table), r2 = byte_81233E0 (IWRAM arg/source buffer at 0x081233D8), r3 = 5, r4 = 0x5c, r6 = 0. These five\
  \ constants plus r0 are forwarded verbatim into sub_8123C20, so sub_8123BE0 is essentially a wrapper that packages\
  \ the constants needed by the AI-attack-table builder.\n  - r5 (BattleObject pointer, kept live across the call\
  \ by the parent battle-update loop) and r10 (Toolkit pointer) are not touched; they are documented as `in` only\
  \ because the caller has them live on entry but sub_8123BE0 never reads them itself. They are passed through and\
  \ survive, hence `out` lists r5.\n  - All three callers (battle_updateFrame_8123558, sub_8123574, sub_81235A4)\
  \ are battle-object phase orchestration routines, fitting a setup helper that primes AI attack variables once\
  \ a battle object is moving from setup into update phase 4.\n  - The literal 0x5A5856 is treated as a ROM-side\
  \ base for AIData/AIState data; the constant 0x5c matches oAIData+0x5c (the `Unk_5c` pointer field), and r1=0x20\
  \ matches oAIData+0x20 (`TotalDamageTaken` region start). So the call is plausibly copying 0x20 bytes of AIData\
  \ into each of the 5 battle objects (player + 4 actors), using Unk_5c as the per-row storage pointer.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Assembly is exactly `push/pop {r4-r7,lr}` plus 7 mov/ldr instructions and one `bl sub_8123C20` (asm33.s:1368),
    i.e. a thin wrapper with no conditional logic. - dword_8123BFC == 0x5A5856 sits in ROM at 0x08123BFC and is
    loaded as r0 (the only ROM pointer passed). - r1 #0x20 / r3 #5 / r4 #0x5c line up with oAIData: 0x20 is the
    start of the post-header fields, 0x5c is the `Unk_5c` field, and 5 is plausibly `1 player + 4 opponents`. -
    Captured-call entry r0-r3 shows the same caller context across 40 samples (r0=1, r2=0x081233D8, r3=0x020047CC),
    consistent with a setup helper invoked once the battle object reaches the right phase. - Caller chain (updateFrame_8123558
    -> ... -> mode-2 driver -> here) shows this is reached as part of the post-fade phase transition, hence "setup
    AI attack vars" rather than a per-tick thing.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08123BE0

    '
  result: the body read as described above
