summary: Configures AI state from a vtable-derived data block and forwards to applyAIDataToAttackTable with constant
  args.
interface: '(r0=dword_8123BFC ptr (r0=1, r2=&ai_data byte array 0x81233E0, r1=0x20, r3=5, r4=0x5c, r6=0)) -> r0=0x20
  ; side effects: clobbers r0-r7,lr; tail-calls battleObject_applyAIDataToAttackTable_8123C20'
details: "The function pushes r4-r7/lr, then loads r0 from `dword_8123BFC` (which holds 0x5A5856) and r2 from `byte_81233E0`\
  \ (an EWRAM-resident 0x5C-byte AI data array; its size matches `AIData` field at loc=0x5c on BattleObject, i.e.\
  \ AIDataPtr). r1 is forced to 0x20 (likely an AIData offset/index, matching AIData's `struct_org 0x20` boundary\
  \ for joypad/damage fields), r3=5 (likely one of the small-count attack-vars fields in AIAttackVars such as NumChipsSelected\
  \ or a chip-slot count), r4=0x5c (size of the AIData payload, matching struct size 0x100 minus offset 0x5c...\
  \ actually exact size of AIData), r6=0. It then tail-calls the single callee `sub_8123C20` (battleObject_applyAIDataToAttackTable_8123C20)\
  \ with that exact argument set, and returns the callee's r0 (0x20) via `pop {pc}`.\n  Given the argument shape\
  \ (a 0x5C-byte AIData blob, an index 0x20, count 5, size 0x5C), this is consistent with copying/filling 5 attack-vars\
  \ entries from the AI data blob at offset 0x20 into the AIAttackVars array inside a battle object. The captured-call\
  \ snapshot (r0=1, r1=0, r2=&ai_data, r3=020047CC, sp=03007DE0, lr=08123563) shows the caller `battle_updateFrame_8123558`\
  \ is operating on the live `oS20047CC` EWRAM blob at 0x020047CC and a battle object pointer, consistent with re-applying\
  \ AI/attack data each turn. The function name is therefore plausibly a thin wrapper that fills the AIAttackVars\
  \ (5 entries × 8 bytes = 0x28, or 5 entries × different size) from an AIData region, then forwards to the real\
  \ applier. The exact semantics in `sub_8123C20` would settle it.\n"
