summary: Nullary wrapper that invokes sub_8123C20 with a hardcoded argument set (3-byte constant 0x5A,0x58,0x56,
  work area byte_81233E0, and mode/geometry values 0x20/5/0x5C/0), preserving the caller's r4-r7 around the call.
interface: void sub_8123BE0(void) /* no meaningful inputs or outputs; r4-r7 saved and restored, caller-visible state
  unchanged */
details: 'Pure argument-marshalling thunk: it pushes {r4-r7,lr}, then immediately loads its arguments and calls
  sub_8123C20, restoring r4-r7 and returning right after. The fixed arguments are: r0 = pointer to the literal-pool
  constant at dword_8123BFC, which holds the three bytes 0x5A, 0x58, 0x56 (a tiny data blob, e.g. three tile/ palette/attribute
  values); r1 = 0x20; r2 = pointer to the work area byte_81233E0; r3 = 5; r4 = 0x5C (overwritten locally, so the
  caller''s r4 is only saved to be restored); r6 = 0. r5 and r7 are passed through to the callee unchanged from
  the caller. The callee''s return value (if any) is discarded. Nothing here identifies the game-level purpose;
  the meaning of the parameters lives in sub_8123C20 and the users of byte_81233E0. The 3-byte constant and the
  small count-like values (0x20 = 32, 5, 0x5C = 92) suggest a small fixed setup/transfer, possibly sprite, tile,
  or display-list related, but this is not established from this function alone.

  '
