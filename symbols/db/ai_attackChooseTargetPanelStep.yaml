open_questions:
- Which boss/attack this belongs to and what element id 4 (AttackElement) and 8 (HitElement) denote; no
  callers known
- Exact meaning of the callback's r2/r3 arguments (likely preferred x/y or dx/dy from byte_8105F10)
- Where oAIAttackVars_HitElement = 8 is consumed to fire the attack
