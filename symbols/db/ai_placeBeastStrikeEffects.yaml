open_questions:
- What sub_80C6248 is (spawn effect, move object, set attack target?) and whether it consumes r4/r6 as extra arguments
  - this would confirm what exactly is placed at the computed positions
- Why r5 is used without being set in this function - the caller sub_80EC5EC must show what r5 points to (same battle
  object as r0, or a separate AI attack state)
- Meaning of the r4 bits 24-31 table value and the +2 increment, and what NaviStats byte 0x2C actually encodes (form/cross/beast
