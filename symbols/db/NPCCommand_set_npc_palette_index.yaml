name: NPCCommand_set_npc_palette_index
address: '0x0809EE62'
kind: function
status: confirmed
summary: NPC script opcode that sets an overworld NPC's palette index from a byte embedded in the script and advances
  the script pointer.
interface: (r5 NPC object, r6 script pointer, lr return) -> r0 = palette byte read, r6 = script pointer advanced
  by 2, NZCV flags from "ADDS r6,
details: 'Handler for a 2-byte NPC overworld script command. Byte 0 is the opcode (consumed implicitly by dispatch),
  byte 1 is the palette index. The handler reads the operand with "ldrb r0, [r6,#1]" and stores it into the NPC
  object''s PaletteIndex field (r5 + oOverworldNPCObject_PaletteIndex), which controls which 16-color palette slot
  the NPC''s sprites are drawn with. It then advances the script cursor r6 by 2 via "add r6, #2", so the return
  flags (NZCV) reflect that ADDS; r0 returns the byte that was read. This is one of a family of NPCCommand_* script
  interpreters dispatched over the NPC''s script stream; the caller-supplied r5/r6 convention means the interpreter
  state lives in registers, not on the stack.

  '
