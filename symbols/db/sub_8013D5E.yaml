name: sub_8013D5E
address: '0x08013D5E'
kind: function
status: probable
summary: 'Stat-gated weighted pick for the charge shot: builds a 16-entry list from NaviStats bytes 0x14
  (1s) and 0x15 (2s), then one primary draw & 0xF picks from it; 0 when both stats are 0.'
details: Reads the battle object's navi stats bytes 0x14 and 0x15 via GetBattleNaviStatsByte_AllianceFromBattleObject,
  fills a 16-byte stack list with stat-0x14 entries of 1 followed by stat-0x15 entries of 2, draws one
  GetRNG and returns list[rng & 0xF]. With both stats at 0 the list is empty and the returns fall through
  as 0, so the caller's branch sees 0.
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: 'Verified from the body: stats 0x14/0x15 fill the table, one GetRNG, result = table[rng & 0xF].
    The BN6F_SYMBOLS.md row''s ''navi stat 0x4D'' does not match this code; the stats involved are 0x14
    and 0x15.'
