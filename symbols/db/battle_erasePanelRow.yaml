    r4,[r6,r0] — side-mirrored lookup in byte_800C182; byte_800C182 bytes 0xFB,0,5,...,0x1E,...,5,0,0xFB
    — symmetric ramp, one half per battle side; mov r4,#3; mul r4,r1; add r4,#6 — row position = 3*r1+6;
    tile_ids = byte_800C178 (all zeros) with j_size=5,i_size=1 to CopyBackgroundTiles — blank 5x1 tile
    strip into tile block 2; Caller updateBattlePanels_800C5E0 is described as stepping panel animations
    then redrawing every panel slot
