name: battle_erasePanelRow
address: '0x0800C138'
kind: function
status: probable
summary: Writes a 5x1 strip of blank (tile id 0) tiles into BG tile block 2 at the mirrored panel position
  for the current side, clearing one row of a battle panel slot during the panel animation update.
interface: (r0 = panel column/frame index into byte_800C182, r1 = row index) -> r0 clobbered by call;
  no return value
details: Loads oBattleState_PlayerSide from the current BattleState and indexes byte_800C182 at (r0 +
  side*8), a 16-entry table mirrored around the center (0xFB,0,5,10,15,20,25,30 | 30,25,20,15,10,5,0,0xFB),
  giving the horizontal position for the player's or enemy's side. The row is computed as 3*r1+6. It then
  calls CopyBackgroundTiles with tileBlock32x32=2, tile_ids pointing at byte_800C178 (ten zero bytes,
  i.e. blank tile ids), j_size=5, i_size=1, so exactly five blank tiles are written. It is called per-frame
  from updateBattlePanels_800C5E0, which steps panel animations and redraws panel slots, so this is the
  erase/blank step for one animated panel row. The mirrored table suggests the panel area animates symmetrically
  for both sides (e.g. area steal / panel shift), with the horizontal position being the animated offset.
