name: battle_slideOffFieldUpdate
address: '0x080CF700'
kind: function
status: probable
summary: Object state handler that slides the object sideways off the battlefield and destroys it when
  it leaves the field or a 40-frame timer expires.
interface: (r0 = unused, r5 = battle object) -> void; sets CurPhase to 4 after init, CurState to CUR_STATE_DESTROY
  on exit condition
details: On phase 0, sets CurPhase=4, reads oBattleObject_Param1 as an index into byte_80CF75C (four words,
  all equal to 6) and multiplies it by object_getFrontDirection() (+1/-1) to get XVelocity, then sets
  Timer to 0x28 (40). Each frame it decrements Timer, adds XVelocity to X, and recomputes PanelX/PanelY
  via object_setPanelsFromCoordinates/object_updateCollisionPanels. If object_isCurrentPanelValid fails
  or the timer hits 0, it clears the collision region, zeroes the ExtraVars pointer target, and sets CurState
  to CUR_STATE_DESTROY. Speed is always 6 in this table, so Param1 currently only picks among identical
  speeds — possibly modifiable per attack.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_80CF700 init block: table load * object_getFrontDirection -> XVelocity, Timer=0x28, phase
    set to 4; loop: X += XVelocity then object_setPanelsFromCoordinates/object_updateCollisionPanels/object_isCurrentPanelValid;
    exit path: object_clearCollisionRegion, ExtraVars=0, CurState=CUR_STATE_DESTROY; byte_80CF75C contains
    four word entries all = 6, indexed by Param1<<2; callees are all battle-object panel/collision helpers,
