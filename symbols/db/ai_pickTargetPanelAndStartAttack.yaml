name: ai_pickTargetPanelAndStartAttack
address: '0x0802D3CA'
kind: function
status: probable
summary: AI step that picks a panel from an alliance-dependent param table (selected by object flag bit
  0x10), stores sub_802D430's low-byte return into TargetPanelX/Y, clears TargetObjectPtr/ScratchVar,
  starts AI attack type 5 via aiAttack_initVarsAndStart_80116AE(5,8,2), increments the AI step counter,
  and returns 3.
interface: (r0 = battle object ptr) -> r0 = 3 (next AI state); uses r6 = AI state struct, r7 = AI attack
  vars
details: 'Entry: r0 is a battle object, whose object flag word is tested for bit 0x10 to select one of
  two 8-byte parameter tables (byte_802D410 vs byte_802D420, differing in first byte 0x10 vs 0 and panel-arg
  byte 0x30 vs 0x20). The chosen table is passed to GetAllianceDependentPanelParamArgs, which indexes
  it by the object''s alliance field. The resulting args feed sub_802D430, whose r0/r1 return values are
  stored as TargetPanelX/TargetPanelY in the AI attack vars at r7; TargetObjectPtr and ScratchVar are
  zeroed, so this attack targets a panel, not an object. Then aiAttack_initVarsAndStart(5, 8, 2) initializes
  and immediately steps the attack state machine. The AI state struct at r6 has its step counter ([r6+4])
  incremented and [r6] cleared, and the function returns 3, presumably the next AI state.'
