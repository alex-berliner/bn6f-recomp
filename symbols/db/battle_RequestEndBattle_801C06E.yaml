summary: Wrapper that passes 1 to sub_801C082, requesting the battle to end.
interface: void battle_RequestEndBattle_ADDRESS(void); // tail-calls sub_801C082(1)
details: 'One-instruction wrapper: loads r0 with 1 and tail-calls sub_801C082 via bl, so sub_801C082 returns directly
  to this function''s caller (the pop {pc} after the bl is the compiler''s shared epilogue). All state flows through
  r0; no registers are read before the call. Presumably sub_801C082 is a shared setter for a battle-state flag whose
  argument selects on/off (1 = on here), with the off case covered by a sibling wrapper passing 0. Callers use this
  to signal that the battle should terminate and hand control back to the battle flow code.

  '
