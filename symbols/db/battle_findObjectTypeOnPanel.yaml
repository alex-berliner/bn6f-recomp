name: battle_findObjectTypeOnPanel
address: '0x080C67A4'
kind: function
status: probable
summary: Scans the battle object list for an object of type 3 with index 0x10 standing on the given panel,
  returning 0 if found.
interface: (r0 = panel X, r1 = panel Y) -> r0 = 0 if such an object occupies the panel, else r0 unchanged
  (nonzero); clobbers r2-r7
details: 'Iterates eBattleObjectsLinkedListStart via the +4 next pointer until reaching eBattleObjectsLinkedListSentinel.
  For each node it reads the byte at node+0x10: low nibble (oBattleObject_Type) must be 3 and oBattleObject_Index
  must be 0x10, then compares oBattleObject_PanelX/oBattleObject_PanelY to r0/r1. On match returns 0;
  otherwise falls through the whole list and returns with r0 still holding the X argument, so ''not found''
  is signalled by any nonzero value — a quirk the caller relies on with cmp r0,#0 / beq. Caller sub_80C6774
  feeds it panel coords packed as one byte per entry at object+0x64+i (X in the high nibble, Y in the
  low 3 bits) and acts on the panels that are NOT occupied, passing Element, Param1+1 and the damage-counter
  field to sub_80C67D8.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sub_80C67A4 walks eBattleObjectsLinkedListStart to eBattleObjectsLinkedListSentinel comparing
    next pointers; match requires (Type&0xF)==3, Index==0x10, PanelX==r0 and PanelY==r1 before returning
