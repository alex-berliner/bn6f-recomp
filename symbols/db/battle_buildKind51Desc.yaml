name: battle_buildKind51Desc
address: '0x080BC13E'
kind: function
status: probable
summary: Loads PanelX/PanelY/Element and DamageCounter into sub_80DB800 (return discarded), then returns r0=0x51,
  r1=X, r2=Y, r3=Z, r4=(flip<<8)|0x51 describing the object for the caller to use with kind-0x51.
interface: (r5 = battle object, not r0) -> r0 = 0x51, r1 = oBattleObject_X, r2 = oBattleObject_Y, r3 = oBattleObject_Z,
  r4 = (object_getFlip() << 8) | 0x51; flags from the add
details: Reads the object's PanelX, PanelY and Element and passes them with r4=1 and r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler
  to sub_80DB800, which presumably applies or prepares element-dependent damage for that panel; its return value
  is discarded. It then queries object_getFlip to get the object's effective facing, and composes r4 = flip<<8 +
  0x51 — the usual low-byte-kind/high-byte-flip attack-object descriptor. Finally it returns the constant 0x51 in
  r0 and the object's X, Y, Z coordinates in r1-r3, so the caller can spawn/queue the kind-0x51 attack at the object's
  current tile and facing.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element then bl sub_80DB800 with r6 = DamageAndStaminaDamageCounterDisabler:
    panel-targeted, element-aware damage setup; bl object_getFlip followed by lsl r4,r0,#8 / add r4,#0x51: encodes
    mirrored facing into a kind-0x51 object descriptor; ldr r1/r2/r3 from oBattleObject_X/Y/Z right before pop {r4,r6,pc}:
    returns world position of the object for the spawn; r0 = 0x51 constant in all return registers pattern matches
    other battle attack-parameter helpers'
  refs:
  - bn6f/asm/asm31.s:8835
  - 0x080BC058 sub_80BC058
  - 0x0800E456 object_getFlip
  - 0x080DB800 sub_80DB800
  reproduce: python3 tools/asmcat.py 0x080BC13E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The asm
    returns r4 = (flip<<8)|0x51 in addition to r0-r3, but the proposal''s interface description is ambiguous about
