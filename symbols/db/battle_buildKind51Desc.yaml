    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- What sub_80DB800 does with panel X/Y, element and the damage-counter field (damage application vs. hitbox setup)
- What object kind 0x51 is (which attack/animation the caller spawns with these parameters)
- What caller sub_80BC058 does with the returned r0-r4 tuple
- The asm returns r4 = (flip<<8)|0x51 in addition to r0-r3, but the proposal's interface description is ambiguous
  about r4 being an output (it says 'flags from the add' as if internal). Also, the code does not show this builds
  'spawn parameters' — it just returns values; whether the caller spawns an attack/hitbox is inferred from the kind
  0x51, not confirmed here. The PanelX/PanelY/Element + DamageCounter loading into sub_80DB800 is accurately described.
