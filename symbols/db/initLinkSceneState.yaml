name: initLinkSceneState
address: '0x0812A240'
kind: function
status: probable
summary: 'One-shot initializer that sets up a scene/object: configures the camera with layout (12,3,2,0),
  writes a fixed tag (0x42523545) into the global eLinkState, dispatches an object state, clears a 0x100-byte
  work buffer, and puts the caller context (r5) into state 4.'
interface: (no meaningful args; uses global r5 context pointer) -> sets [r5+3] = 4 (state/mode byte) and
  [r5+0xC] = 0; clobbers r0-r3
details: 'The routine runs a fixed setup sequence: sub_813D90C(1) and sub_8147350 (unknown setup steps),
  then sub_803DCE8(12,3,2,0) which initializes the camera/screen block tied to eLinkState and zero-fills
  two buffers, then sub_803DCD8(0x42523545, 0x2000, 0) which stores a constant ID (ASCII ''ER25'' little-endian)
  plus 0x2000 into the global eLinkState struct. It then calls sub_81322E8 (object record lookup + per-state
  dispatch via state+0xE) and sub_803EF60 which reinitializes state and returns a zero-filled 0x100-byte
  buffer. Finally it writes 4 to byte [r5+3] and 0 to byte [r5+0xC]; since r5 is never set locally, it
  is a fixed global context pointer (typical task/object control block), so this is likely an object/scene
  state-4 entry point that performs the whole scene bootstrap.'
