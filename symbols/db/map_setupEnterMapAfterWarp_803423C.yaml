name: map_setupEnterMapAfterWarp_803423C
address: '0x0803423C'
kind: function
status: confirmed
summary: Starts the enter-map sequence after a warp — switches the main state machine to state 4, clears VRAM/GFX
  buffers, resets the fade param, and runs the warp-arrival and area-music updates.
interface: void map_setupEnterMapAfterWarp(void); /* reads toolkit ptr from r10; returns with r7 still = r10 (toolkit
  ptr), other regs clobbered by calls */
details: 'Reads the toolkit pointer from r10 (mirroring it into r7, which stays set on return).

  Stores 4 into the main jumptable index (toolkit''s first field, via oToolkit_MainJumptableIndexPtr),

  putting the game into the enter-map state. Then blanks video memory (zeroFillVRAM), wipes the

  uncompressed GFX buffer at 0x30025C0 (ZeroFillGFX30025c0), and resets sprite/OAM state

  (sub_8006910) so the new map''s tiles/sprites load fresh. Clears GameState.EnterMapFadeParam1

  (oGameState_EnterMapFadeParam1) to 0 so the arrival fade starts clean. Calls

  map_triggerEnterMapOnWarp_8005C04 to run warp-arrival handlers, then sub_8033FDC with the

  GameState pointer in r0 (enter-map setup), and finally musicGameState_8000784 to update the

  area music — note it passes through whatever r0 sub_8033FDC returned, as the original does.

  '
