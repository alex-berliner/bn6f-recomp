name: object_spawnCollisionRegionByParam3
address: '0x080C63AE'
kind: function
status: probable
summary: Spawns the battle object's collision region, using a dimming (timestop-proof) variant when Param3
  == 2 and the plain collision-region spawner otherwise.
interface: (r5 = battle object; reads Param3, PanelX, PanelY, Element, Z, DamageAndStaminaDamageCounterDisabler)
  -> r0 = spawned region object from spawn helper
details: 'Dispatches on oBattleObject_Param3 (1, 2, 3, default) but all four branches load the same arguments:
  panel X/Y, Element, Z, r4 = 0x400FF0F (spawn flags), r6 = the object''s DamageAndStaminaDamageCounterDisabler,
  and r7 = 1. Only the Param3 == 2 branch calls object_spawnDimmingCollisionRegion; every other case calls
  object_spawnCollisionRegion with identical arguments, so the switch is effectively ''dimming if Param3
  == 2, plain otherwise''. Both callees are known collision-region spawners, the dimming one keeping the
  region updating during timestop.'
