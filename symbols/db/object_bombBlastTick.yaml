name: object_bombBlastTick
address: '0x080C66E4'
kind: function
status: probable
summary: Per-tick state handler for a battle object that plays SOUND_HIT_BOMB_1 every 8 ticks, calls sub_80C6774
  once when Timer2 reaches 0, and on Timer expiry either resets CurPhase to 0 to loop (decrementing Param2)
  or clears the collision region and sets CUR_STATE_DESTROY.
interface: (r5 = battle object) -> void; updates oBattleObject_Timer, Timer2, Param2, CurPhase and CurState
  (sets CUR_STATE_DESTROY)
details: 'Runs as a state handler on a battle object in r5. Every 8 frames (ExtraVars+8 counter & 7) it
  plays SOUND_HIT_BOMB_1, giving a repeating explosion rumble. It decrements Timer2 each tick and, when
  it reaches 0, calls sub_80C6774 exactly once (Timer2 is likely an initial delay for that). It also decrements
  Timer (the phase duration); when it goes negative, it decrements Param2 — a repeat count: if repeats
  remain it resets CurPhase to 0 to loop the state, otherwise it calls object_clearCollisionRegion and
  sets CurState to CUR_STATE_DESTROY. The combination of bomb sound, lingering multi-phase loop and delayed
  follow-up fits an explosion object''s active phase.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr/add/str on [r5,#oBattleObject_ExtraVars+8] with and #7 gates mov r0,#SOUND_HIT_BOMB_1;
    bl PlaySoundEffect every 8 frames (loc_80C66F8 entry); Timer2 countdown to 0 triggers one-shot bl
    sub_80C6774; Timer countdown then decrements Param2; nonzero reloads CurPhaseAndPhaseInitialized =
    0 to repeat the phase; When Param2 hits 0: bl object_clearCollisionRegion then mov r0,#CUR_STATE_DESTROY
    into oBattleObject_CurStateActionPhaseAndPhaseInitialized; Callee summaries (PlaySoundEffect, object_clearCollisionRegion)
    match an explosion-lifetime state handler'
  refs:
  - bn6f/asm/asm31.s:31575
  - 0x080005CC PlaySoundEffect
  - 0x0801A074 object_clearCollisionRegion
  - 0x080C6774 sub_80C6774
  reproduce: python3 tools/asmcat.py 0x080C66E4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary captures most behavior correctly (Timer2->sub_80C6774 once, ExtraVars+8 modulo 8 SOUND_HIT_BOMB_1,
    looping via CurPhase reset, CUR_STATE_DESTROY with clearCollisionRegion). However the proposal incorrectly
    says Param2 is a repeat count decremented ''when Timer goes negative''; the asm shows Timer (word)
    decrementing each tick, and only on going negative (bge fall-through) Param2 is decremented and loop/destroy
    decided — i.e., Timer is the per-phase duration and Param2 counts phase repeats. Also the name ''explosionStateUpdate''
    is fine but ''object_bombBlastTick'' is more descriptive of the per-tick bomb-rumble loop.; run wf
    investigate investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
