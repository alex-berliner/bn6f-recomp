summary: 'Bootstraps a battle scene by chaining subsystem initializers: two unspecified setups, a channel reset,
  two SFX loads/plays, and two display/object setups.'
interface: 'void battleInitSceneAudioDisplay_803A7B8(void); /* inputs: r5, r10, lr; outputs: r5, r8, r9, r10, r11,
  r12; clobbers nzcv, r0-r3, lr; preserves r4-r7 */'
details: 'Thin dispatcher that calls nine subroutines in a fixed sequence with no parameters

  beyond single immediate arguments in r0. The first pair (sub_803BA64, sub_803BA74)

  look like generic scene/audio engine inits. sub_803BAE2 is then called with 0,

  which the readable C labels as a reset/clear of some channel. Two SFX are queued

  using the loader/player pair: sub_803B522(0x0A) + sub_803B674(0x26) and

  sub_803B522(0x0B) + sub_803B674(0x27); the second argument is the actual sound

  ID/group to play while the first appears to be a bank/index selector. Finally

  sub_803A8B4(0) and sub_803A8E2() perform display-side setup, possibly creating

  scene objects/sprites. The address suffix "0x803A7B8" is preserved per the

  naming convention.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
