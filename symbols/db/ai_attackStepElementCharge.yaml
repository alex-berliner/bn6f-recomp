name: ai_attackStepElementCharge
address: '0x081072B8'
kind: function
status: probable
summary: 'AI attack step: arms an element-4 attack with animation, sound and a front-panel effect, then
  counts down 20 frames before firing via sub_8107A00.'
interface: (r0 = attack context/object passed through to callees, r5 = battle object, r7 = AI attack vars
  struct) -> r0 = 0 after spawn call, clobbered; flags from timer compare
details: 'State machine keyed on oAIAttackVars_AttackElement: on first invocation (element 0) it sets
  element 4, switches the battle object''s CurAnim to 0xC, calls object_setCounterTime(0x18), plays M4A
  sound effect 0x1C5 (0xC6+0xFF), and spawns front-panel effect kind 0 on the panel in front of the object
  via object_spawnFrontPanelEffect, then loads oAIAttackVars_StepTimer with 0x14. On later ticks it decrements
  StepTimer; when it reaches 0x11 it calls sub_8107A00 (presumably the attack''s actual hit/projectile
  spawn), and when it reaches 0 it stores 0x18 into oAIAttackVars_HitElement, likely signaling the attack
  phase''s end or clearing the hit element. The element value 4 suggests a specific elemental attack chosen
  elsewhere.'
