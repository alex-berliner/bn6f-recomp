name: battle_stateDestroyAfterTimer
address: '0x080CC090'
kind: function
status: probable
summary: 'State handler that gives the object a 20-frame lifetime: on first entry it sets a timer, then
  counts down each frame and destroys the object when it expires, updating the sprite meanwhile.'
interface: (r5 = battle object) -> r0 = sprite_update result; sets Timer=0x14, PhaseInitialized=4 on entry,
  writes CUR_STATE_DESTROY to CurStateActionPhaseAndPhaseInitialized when the timer hits 0
details: A per-object state handler. On the first invocation (PhaseInitialized flag clear) it stores 0x14
  (20 frames) into oBattleObject_Timer and sets PhaseInitialized to 4 to mark initialization done. Each
  frame afterwards it decrements oBattleObject_Timer; when the decrement makes it zero (bgt not taken)
  it overwrites the object's combined state/phase field with CUR_STATE_DESTROY, so the object removes
  itself. Every invocation it tail-calls sprite_update so the object's sprite keeps animating until destruction.
  No other side effects, no sound, no collision.
