  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized]; tst/bne guard writes Timer=0x14, PhaseInitialized=4
    only once (asm lines 2-8); ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh then bgt skips setting
    CUR_STATE_DESTROY when timer still positive; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    requests object destruction; bl sprite_update runs the sprite animator (callee sprite_update) every
