name: battle_phaseWaitAnim8ThenNext
address: '0x080C3E00'
kind: function
status: probable
summary: 'Battle-object AI phase handler: plays animation 8 once, then when it finishes switches to animation
  0xD, plays sound 0xFD, starts a 30-frame timer and advances the object to phase 4.'
interface: (r0 = scratch, r5 = battle object) -> r0 = sprite_getFrameParameters result clobbered; updates
  oBattleObject fields on r5
details: On first entry (oBattleObject_PhaseInitialized == 0) it latches the flag and sets oBattleObject_CurAnim
  = 8, so the phase's opening animation only starts once. Every call it then asks sprite_getFrameParameters
  for the current frame's attribute byte and tests bit 0x80, which here acts as the animation-finished/end-of-loop
  marker. When that bit is set it swaps CurAnim to 0xD, plays sound effect 0xFD via PlaySoundEffect, stores
  0x1E (30) into oBattleObject_Timer, and writes phase 4 into oBattleObject_CurPhaseAndPhaseInitialized,
  moving the state machine on. It is a self-contained 'wait for animation then transition' step; r5 is
  the object pointer throughout.
