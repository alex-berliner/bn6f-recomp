name: battle_initSpriteAndSpawnEffect
address: '0x080C04CC'
kind: function
status: probable
summary: Initializes a battle object's sprite (load 0x80/8/0xB, reset anims, toggle shadow, set visible flag), plays
  sound 0x8C, spawns a linked effect via sub_8010DF6(1, Param1, 1), and transitions to the CUR_STATE_UPDATE handler
  sub_80C0526.
interface: (r4/r5 = battle object pointer, args preloaded in r0-r2) -> r0 = return of sub_80C0526; object state
  set to CUR_STATE_UPDATE
details: Sets up the object's visuals by calling sprite_load with (0x80, 8, 0xB), reloading animation data, enabling
  then re-evaluating the shadow via sprite_hasShadow/sprite_removeShadow, resetting CurAnim/CurAnimCopy to 0, and
  re-running sprite_setAnimation/loadAnimationData/update. It forces palette 0 and applies the object's facing via
  object_getFlip/sprite_setFlip, then sets oObjectHeader_Flags bit 1 (likely the visible/active flag). It plays
  sound effect 0x8C and calls sub_8010DF6(1, oBattleObject_Param1, 1), which appears to spawn or configure something
  keyed on the object's Param1. Finally it writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and tail-calls sub_80C0526, presumably the update entry for the new state.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sprite_load/sprite_loadAnimationData/sprite_setAnimation/sprite_update sequence initializes the object''s
    sprite and animation from scratch; oBattleObject_CurAnim/CurAnimCopy zeroed before sprite_setAnimation, typical
    of first-time sprite setup; ldrb r0,[r5,#oObjectHeader_Flags]; orr #2; strb sets the object''s active/visible
    flag; PlaySoundEffect(0x8C) then sub_8010DF6(1, oBattleObject_Param1, 1) ties the init to a sound and a Param1-driven
    side effect; str CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized followed by tail-call
    sub_80C0526 hands control to the update state'
  refs:
  - bn6f/asm/asm31.s:18029
