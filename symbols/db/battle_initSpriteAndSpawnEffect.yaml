  - 0x0800E456 object_getFlip
  - 0x08002E3C sprite_hasShadow
  reproduce: python3 tools/asmcat.py 0x080C04CC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The code
    matches the proposed behavior (sprite_load(0x80,8,0xB), shadow toggle, sound 0x8C, sub_8010DF6, CUR_STATE_UPDATE,
    tail-call sub_80C0526). However, this is clearly an init/spawn routine, and the proposal''s name ''battle_spawnInitSprite''
    awkwardly mixes ''spawn'' and ''sprite''; the standard prefix would be ''init'' or ''spawn''. Since the routine
    initializes a battle object''s sprite and spawns an effect (sub_8010DF6 with Param1), a cleaner name is ''init''
    prefixed.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- No callers are known, so the object type and gameplay context (which enemy/obstacle this spawns) are unidentified
- The exact meaning of sprite_load's arguments (0x80, 8, 0xB) and what sub_8010DF6 spawns or sets via Param1 are
  unknown
- sub_80C0526's role (update handler vs. post-init helper) needs confirmation
- The code matches the proposed behavior (sprite_load(0x80,8,0xB), shadow toggle, sound 0x8C, sub_8010DF6, CUR_STATE_UPDATE,
  tail-call sub_80C0526). However, this is clearly an init/spawn routine, and the proposal's name 'battle_spawnInitSprite'
  awkwardly mixes 'spawn' and 'sprite'; the standard prefix would be 'init' or 'spawn'. Since the routine initializes
  a battle object's sprite and spawns an effect (sub_8010DF6 with Param1), a cleaner name is 'init' prefixed.
