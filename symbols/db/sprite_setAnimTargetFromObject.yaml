name: sprite_setAnimTargetFromObject
address: '0x080A5DE8'
kind: function
status: probable
summary: Copies a 3-word target triple from the object struct (r6+0x7C..0x84) into the sprite animator's
  target fields (r5+0x28..0x30) before interpolation toward it.
interface: (r5 = sprite/animator struct, r6 = object struct) -> stores [r6+0x7C,0x80,0x84] into [r5+0x28,0x2C,0x30];
  no return value, flags clobbered
details: 'The function is a simple 3-word copy: it loads three consecutive words at r6+0x7C/0x80/0x84
  and stores them to r5+0x28/0x2C/0x30. Its only caller (sub_80A5D80) invokes it first, then immediately
  calls sprite_updateAnimTowardTarget and compares r5+0x28 (the freshly written target) against r5+0xC
  (the current value), stepping the current value by 0x10000 (1.0 fixed-point) toward it — so the triple
  is an interpolation target for the animator, and r5+0xC is a mirrored current-value field. r6+0x7C..0x84
  are the object-side source of that target (position/scale or similar), and the copy is re-done every
  call so the animator keeps chasing the object''s live values.'
