name: battle_scrollLayersTick
address: '0x08038CF4'
kind: function
status: probable
summary: 'Per-frame tick of the battle-exit transition: scrolls all three BG layers until the wipe finishes,
  then resets the battle scene records and advances the state machine.'
interface: '(r5 = state struct: +2 state byte, +4 timer halfword, +6 cycle counter byte, +8 scroll offset
  word) -> void; no return value'
details: Each call decrements the scroll offset at [r5,#8] by 0xC0 while it is > 0, otherwise zeroes it
  and calls sub_811DBF0 for layers 0,1,2. The resulting offset (r4) is passed with layer ids 0,1,2 to
  sub_811D69C (offset,layer), and then sub_811D634 is called once per layer (r2 = 0/1/2), so it drives
  all three backgrounds together. A countdown at [r5,#4] gates per-step progress; when it reaches 0 the
  cycle counter [r5,#6] is incremented. On the 5th cycle it calls battle_resetEStructRecords_8046664 (clearing
  the eStructArr2008450 battle scene records), sets state 0x10 with timer 0x14; otherwise it rewinds to
  state 0 with timer 0xA. The reset-records call ties this to leaving the battle overlay scene.
