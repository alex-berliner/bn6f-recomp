  date: '2026-10-19'
  detail: '[r5,#8] decremented by 0xC0 each frame and passed as r4 to sub_811D69C with r1 = 0,1,2 (layer
    ids); sub_811DBF0 called with 0,1,2 only when the offset reaches 0, mirroring the layer loop; battle_resetEStructRecords_8046664
    (''re-runs the record-array init after battle …'') is called exactly when [r5,#6] reaches 5; state
    byte [r5,#2] is rewritten to 0x10 (timer 0x14) or 0 (timer 0xA), a scene state-machine pattern'
