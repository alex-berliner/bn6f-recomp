open_questions:
- Whether r5 holds `BattleStatePtr` directly or the toolkit `r10` is being used to derive it - the contract
  lists r10 as a preserved callee-clobber and the caller sets up r5; the precise caller is not in the
  project, so the field role ("Unk_03 sentinel", "Unk_07", "Unk_1e") is still inferred from the offset
  names.
- The semantic meaning of `BattleState.Index_01` = 0x10/0x14/0x18/0x1c/0x20 (which battle-result codebook
  entry each maps to, e.g. flee-success vs forfeit vs disconnect) is not provable from this routine alone
  - it would require cross-referencing the dispatch jumptable that consumes `Index_01`.
