status: probable
summary: 'Drives the "pre-result / run-away" sub-phase of battle: validates chip hand, runs the inner
  battle step, and then decides which battle-result code (0x8, 0x10, 0x14, 0x18, 0x1c, 0x20) to store
  into BattleState.Index_01.'
interface: '(no args via registers; toolkit/BattleState ptr in r10) -> r0 = 0 ; side effects: writes BattleState.Unk_03,
  BattleState.Index_01, BattleState.Unk_02_03, BattleState.Unk_1e, clears dword_203CA70 record, calls
  several battle helpers.'
details: "- Entry guard: `ldrb r0, [r5,#oBattleState_Unk_03]` (r5 holds the BattleState pointer; `push\
  \ {r4,lr}` only saves r4) - if it is 0, `clearDword_203CA70Record_80084C0` is called and 0x4 is written\
  \ to `BattleState.Unk_03` to mark \"init done\".\n  - Then `battle_runMainStep_800801C` runs the actual\
  \ battle sub-step.\n  - `someChipHandValidationHappensHere_800B090` returns a battle-flow status in\
  \ r0.\n  - r0 == 6 -> writes 0x8 to `BattleState.Index_01` and 0 to `BattleState.Unk_02_03`, then returns.\n\
  \  - r0 == 0 -> early return (no result change).\n  - Otherwise: writes `oBattleState_Unk_07` into `eOWPlayer+3`\
  \ (`eStruct200A008_setUnk03`), then branches on r0 == 1 vs r0 == 2:\n    - r0 == 1 path: `setTwoStructs_800A840(1)`,\
  \ run `sub_800AF84`, store its byte at `BattleState.Unk_1e`, call `eStruct200A008_setUnk00`, run `sub_800B6F2`\
  \ (pending-event list firing), then pick r2 = 0x18 / 0x1c / 0x20 based on `GetBattleMode()` (4/5/8),\
  \ otherwise check `GetBattleEffects()` bit 0x2 -> r2 = 0x14, or bit 0x400 -> leave r2 = 0x10, else consult\
  \ `sub_800AF50` and force r2 = 0x10 only when it returns 1 (r0 == 0 or r0 == 2 collapse to r2 = 0x14\
  \ at loc_8009452).\n    - r0 == 2 path: similar, using `setTwoStructs_800A840(2)`, the same `sub_800AF84`/`eStruct200A008_setUnk00`\
  \ calls, but it checks GetBattleEffects bits 0x8 and 0x2 -> collapses to r2 = 0x14, otherwise 0x10 /\
  \ 0x14 via the same `sub_800AF50` check.\n  - r0 == anything else (not 1/2/6/0) falls straight to `loc_8009452`\
  \ with r2 = 0x14.\n  - `loc_8009454`: `strb r2, [r5,#oBattleState_Index_01]` then zero `BattleState.Unk_02_03`,\
  \ r0 = 0, return via `pop {r4,pc}`.\n  - The chosen constants stored to `BattleState.Index_01` (0x10,\
  \ 0x14, 0x18, 0x1c, 0x20) and the chip-hand validation, BattleMode/BattleEffects branching, plus the\
  \ `BattleState.Unk_1e` write and pending-event flush strongly suggest this routine handles the \"flee\
  \ / battle-flow result\" sub-state that decides which battle-result codebook entry to jump into next\
  \ (one of the standard battle-result codes).\n  - Although `eOWPlayer` and `200A008` are touched, the\
  \ structure being modified is actually the battle's secondary struct at 0x0200A008 (the chip-hand /\
  \ player-area struct), not the overworld player object - the helpers `eStruct200A008_setUnk00`/`setUnk03`\
  \ are reused as convenient mutators.\n"
