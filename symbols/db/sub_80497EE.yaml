name: sub_80497EE
address: '0x080497EE'
kind: function
status: hypothesis
summary: 'Per-frame state driver for an object: tests flag 0x80 of eFlags2009F38; if unset, calls sub_803BB80 and,
  on a non-zero result, sets state byte 1 to 0xC, then always runs battle_moduleInit_803A820.'
interface: 'void sub_80497EE(void);

  // no in/out regs (r5 points to object, r10 to caller context); preserves r4-r9,r12

  // uses NZ; outputs to r0 (passed on to sub_803A820), then borrows r3,r8-r11,r12 + C/V from sub_803A820

  '
details: "- r0 = 0x80 is passed in to chatbox_mask_eFlags2009F38(flag). If the flag is set the routine\n  falls\
  \ straight through (bne loc_8049802 -> skip the sub_803BB80 call AND the state write,\n  but r0 is overwritten\
  \ by 0xC only when both conditions trigger).\n- sub_803BB80 is consulted only when the eFlags2009F38 mask test\
  \ returned 0. Its non-zero\n  result (bne/!Z) flips the object's [r5+1] byte from its previous value to 0xC, the\n\
  \  standard sub-state index used by the object's state machine.\n- After the conditional block, sub_803A820 (battle_moduleInit)\
  \ is invoked with r0 carrying\n  either 0x80 (no change) or 0xC (state was updated). This coupling between object\
  \ sub-state\n  and module init suggests sub_803A820 re-initialises the battle module according to the\n  chosen\
  \ phase.\n- The function always tails into sub_803A820, so eFlags2009F38 mask set and not-set paths both\n  run\
  \ module init each frame, but only the \"flag clear + sub_803BB80 != 0\" path promotes the\n  object to sub-state\
  \ 0xC.\n- The chatbox_ prefix on eFlags2009F38 conflicts with this being a battle/object driver; the\n  flag is\
  \ shared elsewhere (likely a global \"skip update\" / \"suppress\" toggle).\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
