name: battle_redrawChipSelectScrollColumn
address: '0x08125F5C'
kind: function
status: probable
summary: After a chip-select scroll step, redraws the BG tile block 2 column strips (3-wide left strip,
  an 8-wide right strip, a 2x14 middle strip and a 3x14 patch) and reloads up to 7 chip icon GFX plus
  the 7 selection-slot structs; chooses between a standard and a 0xF/15-variant tile-offset layout.
interface: (r5 = chip-select screen work struct; r0-r4 clobbered) -> r0 = destroyed; no return value
details: Reads [r5+0x64]; returns immediately if 0, uses the special offset layout if it equals 0xF, otherwise
  the normal one. Uses [r5+0x36] as an argument to the tile-draw helpers (likely a BG map/page id) and
  [r5+0x74] as a base tile offset (0x5F is subtracted, then small column offsets are added), writing everything
  into BG tile block 2 via byte_2017A00. In both branches it calls battle_loadChipIconSprites_8126430
  with dword_201F420, byte_8124A4C and VRAM dest 0x6007800 to load up to 7 chip icons, and packSelectionSlots_8126494
  to fill the 7 chip-selection slot structs. The two branches differ only in the tile offsets added to
  the base (1/6/4/0xE vs 3/1/4/0xB), i.e. scroll up vs scroll down.
