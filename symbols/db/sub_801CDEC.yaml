name: sub_801CDEC
address: '0x0801CDEC'
kind: function
status: confirmed
summary: Queues two palette transfers (two paired palette blobs) for an object, targeting slots selected by the
  object's byte at +0x12, skipping objects whose state byte at +0x0F is 5 or 6.
interface: void palette_QueueObjectPalettePair(Obj *obj /* r5; r4/r6/r7 passed in but unused, preserved */)
details: 'Takes a single object pointer in r5 (r4/r6/r7 come in per the caller contract but are only

  preserved, never read). First it reads the object''s state byte at r5+0x0F; if it is 5 or 6

  the function returns immediately without doing anything (a common "hidden/inactive state"

  guard in this engine). Otherwise it reads the object''s palette-slot index from r5+0x12,

  shifts it left by 16 so it lands in bits 16-23, and adds that to two fixed transfer

  destination descriptors: 0x80004012 and 0x40200012 (the slot index replaces the upper byte

  of each descriptor''s low half, i.e. 0x8000XX12 / 0x4020XX12). For each descriptor it then

  calls sub_802FE28 (a palette/transfer-queue helper taking a destination descriptor in r0

  and a ROM source pointer in r1, with r2/r3 zeroed only before the first call) with the

  paired data blobs at 0xCBB4 and 0xCBBC in ROM. Net effect: load two related palettes

  (likely an object''s base palette plus a second variant, e.g. palette + paletteB) into

  consecutive palette slots assigned to that object. Quirk: r2/r3 are not re-zeroed before

  the second call, so whatever the first callee left there is passed on; the caller-visible

  r0-r3/flags after the call are whatever the second callee leaves.

  '
