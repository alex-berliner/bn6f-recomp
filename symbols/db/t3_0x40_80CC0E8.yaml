name: t3_0x40_80CC0E8
address: '0x080CC0E8'
kind: function
status: confirmed
summary: Per-frame update for the laser-shot battle object type, dispatching its state machine (init laser shot
  / collision phase / destroy) and then updating its sprite.
interface: (r4=work?, r5=battle object, r7, r8, r10) -> void; leaves r5/r8/r9/r10/r11/r12 as set by the callees;
  clobbers flags nzcv
details: 'Frame-update routine (Thumb, tail-call style: push {lr} ... pop {pc}) for a battle

  object whose state table is off_80CC104. Reads the object''s CurState byte at

  obj+oBattleObject_CurState, indexes the table with it, and jumps to the handler with

  mov lr, pc; bx r1 — so the handler returns to just after the branch (the two bl calls).

  The three states are: battleObject_initLaserShot_80CC110 (state 0), object_dispatchCollisionPhase_80CC1A0

  (state 1), and object_clearExtraBackrefAndDestroy (state 2, i.e. the object despawns).

  The state handler sees the object pointer in r5 plus the caller''s r4, r7, r8, r10

  unchanged; the object pointer it leaves in r5 feeds the calls that follow.

  After the state dispatch it calls handleRenderBlindForSpecificObjectsMaybe_80169BE

  (the blind/hidden-object render hook, again with the object in r5), then

  object_updateSpritePaused, the pause-aware sprite animation/position update.

  This function itself returns whatever r5/r8-r12 the callees leave, contributing

  nothing of its own. Given the init handler name, this object type is a laser/beam

  projectile fired in battle; the state machine runs init -> collision phase each

  frame -> destroy when done.

  '
