name: rfu_pollLinkState
address: '0x0803C90C'
kind: function
status: probable
summary: 'Polls the RFU link: if a local flag byte (byte_2010280) is set and sub_8146938 reports nonzero,
  aborts with r0=2; once the RFU link (bit 0x04) is up, sends request 0x22 via sub_813D9A0 and advances
  caller''s state byte (r7+3) to 8. Otherwise returns r0=r1=0.'
interface: () -> r0 = result code (0 = done/continue, 2 = abort), r1 = 0; uses r7 = caller's state struct
  (byte at +3 set to 8)
details: Reads a global flag byte (byte_2010280); if it is set, it calls sub_8146938 and returns r0=2
  if that reports nonzero, otherwise falls through. It then tests RFU status bit 0x04 via rfu_testStatusFlags;
  when the link is up, it calls sub_813D9A0(0x22) (likely a wireless request/command code) and stores
  8 into byte +3 of the state structure addressed by r7, which is set up by each of the three tiny caller
  wrappers. All fall-through paths return r0=0, r1=0. The unused pool entries (byte_200AF80, unk_200FE70)
  suggest shared literal-pool layout with neighbouring functions. This fits the wireless connection/trade
  setup flow where each state-step function reports progress codes.
