name: battleObject_clearPwrAtkState_8012EA8
address: '0x08012EA8'
kind: function
previous_names:
- sub_8012EA8
status: probable
summary: 'Clears the active PwrAtk (charged/Press A) state of a battle object: zeros the AIData charge-related
  bytes and clears the 0x60000 flag in the AI flag word.'
interface: '(r5 = BattleObjectPtr) -> r0 = 0x60000 ; side effects: writes AIData offsets 0x1b/0x1d/0x1e
  to 0 and clears bits 0x60000 in AIData Unk_44'
details: "- Loads r3 = [r5 + oBattleObject_AIDataPtr] (0x58).\n  - Stores 0 to AIData + 0x1d (PwrAtkState),\
  \ + 0x1b (PwrAtkCurChargeTime), + 0x1e (PwrAtkButton).\n  - Loads the literal 0x60000 and calls ClearAIData_Unk_44_Flag(r0=0x60000,\
  \ r5=obj, lr=ret), which masks that bit out of AIData Unk_44.\n  - Returns the same 0x60000 constant\
  \ in r0 (mostly a side artifact of passing it as the mask).\n  - Pure cleanup: no other state mutated;\
  \ commonly invoked from sub_80170E4 (battle-object teardown) and many of the 0x80xxxxx battle subroutines\
  \ that abort a PwrAtk.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r3, [r5,#oBattleObject_AIDataPtr]` reads the AI pointer at the struct offset 0x58. -
    The three `strb r0, [r3,#oAIData_*]` writes use offsets 0x1d/0x1b/0x1e which the AIData struct names
    as PwrAtkState/PwrAtkCurChargeTime/PwrAtkButton. - `ldr r0, dword_8012FAC // =0x60000` provides the
    mask passed to the only callee, ClearAIData_Unk_44_Flag (0x0800ffee), whose confirmed role is to clear
    that flag from AI Unk_44. - `pop {pc}` is the only exit and the post-call r0 is consistently 0x60000
    in the captured calls. - All listed callers take r5 = BattleObjectPtr and have r10 in scope (battle/object
    update routines), matching the contract.'
