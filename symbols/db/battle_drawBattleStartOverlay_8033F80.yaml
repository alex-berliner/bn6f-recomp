open_questions:
- Exact semantics of the per-call argument r0 (battle-state phase index vs. menu/page index vs.
- arbitrary sub-id) — only three table slots are decoded; capturing an entry with r0=2 or r0=3
- and observing which OAM parameter is fetched would settle it.
- Why the function reads a battle-state byte (0x200AD04) but only triggers when non-zero is not
- labelled in this struct set; a state struct view for 0x200AD04 would clarify (likely the
- '`eSubsystemIndex`/`InBattle` flag in `BattleState` 0x11 region).'
- The `sprite_queueOamEntryThunk_802FE28` argument shape is inferred from the callee's
- contract; the precise OAM attribute fields it fills (palette, x/y, shape) are unknown.
