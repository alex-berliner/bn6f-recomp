status: probable
summary: Searches a small 6-entry custom-gauge animation slot table for an entry matching the caller's
  battle-object pointer (r5) and, if found, stores the requested panel coords and panel-index byte into
  that slot.
interface: '(r0 = animId/u8, r1 = panelX | (panelY<<8)) -> r0 = 1 if no match found (slot scan exhausted),
  else r0 = passed-in animId ; side effects: writes to the matched entry in the dword_20352E0 6-entry
  slot table at +1 (anim id) and +2 (panelX-1, panelY-1)'
details: "1. Saves (r0, r1) to the stack as scratch, loads r4 = dword_20352E0 (the 6-slot custom-gauge\n\
  \     animation table), and uses r3 as a down counter initialised to 6.\n  2. The slot loop: ldrb r2,[r4];\
  \ cmp r2,#0; if zero the entry is free/inactive and is skipped;\n     otherwise ldr r0,[r4,#4]; cmp\
  \ r0,r5; if the embedded battle-object pointer equals the\n     caller's r5 (BattleObject*), this slot\
  \ is the target.\n  3. Each iteration advances r4 by 8 and decrements r3; if r3 underflows to zero the\
  \ function\n     returns r0 = 1 (no match) without modifying the table.\n  4. On match: restores r0\
  \ and r1 from the stack, subtracts 8 from r1 to convert the panelY\n     word into panelX|(panelY<<8)\
  \ (lower byte +0, upper byte +2 -> decrements panelX by 1 and\n     panelY by 1; i.e. subtracts 8 from\
  \ the packed coord), then strb r0,[r4,#1] (anim id)\n     and strb r1,[r4,#2] (packed panel coord) into\
  \ the slot.\n  5. Does not touch the battle object in r5; r5 is used purely as a lookup key. Return\
  \ value on\n     match path is the original r0 (anim id), as r0 is reloaded from the stack before return.\n\
  \  6. Captured callers all pass r0=8 and r1=0xFFFFFFD0 (=0xC8 in u8 view packed) with r5 the\n     current\
  \ BattleObject*; the snapshot scripts show N flag set on return, consistent with\n     r0 staying 0x08\
  \ and the final strb/return path leaving N=1.\n  7. Naming: a \"custom-gauge bar animation\" entry gets\
  \ rebound to a new panel; consistent with\n     the AIData/BattleObject subsystem where custom-gauge\
  \ bars track their target panel.\n"
