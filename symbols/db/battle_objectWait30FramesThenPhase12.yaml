name: battle_objectWait30FramesThenPhase12
address: '0x080E90B0'
kind: function
status: probable
summary: 'Battle-object phase step: waits 30 frames, then advances the object to phase 0xC.'
interface: (r5 = battle object, no args in r0-r3) -> r0 clobbered; no return value
details: On first entry (oBattleObject_PhaseInitialized == 0) it stores 0x1E into oBattleObject_Timer
  and sets PhaseInitialized = 4, so the wait only counts once. Every call it decrements oBattleObject_Timer
  and, once the value goes negative (bge not taken), writes 0xC into oBattleObject_CurPhaseAndPhaseInitialized
  to move to the next phase. The timer is 16-bit (strh) and the init flag 8-bit. No other state is touched
  and no calls are made.
