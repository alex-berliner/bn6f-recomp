- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized] / tst r0,r0 gates one-time timer init of 0x1E and
    flag=4; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh...; bge locret decrements the wait each
    frame; mov r0,#0xc; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized] advances to phase 0xC
    when the timer expires
