open_questions:
- Why are two flags (0x17a0+ and 0x19a0+ ranges) set for one message? Probably one is the "unread" flag and the
  other the "exists" flag, or one set is per-save vs. networked; no in-file evidence either way.
- Is the per-board index table at unk_2000FC0 a u16, a u16 with a u16 padding, or a u32? The code does `lsr r3,#4`
  after `lsl r3,#6`, i.e. *4, so it is treated as 4 bytes wide here. Other producers might disagree.
- The red `mov r0,r0` between the two SetEventFlag calls is an artifact of the lift, not present in ROM.
- Board capacity is hard-coded at 64 entries; what happens at index==64 (wrap vs. error) is not visible here.
