name: reqBBS_addBBSMessage_813e5dc
address: '0x0813E5DC'
kind: function
status: confirmed
summary: 'Records a BBS (bulletin-board) message: sets its event flag, marks a second mirror flag, and appends its
  per-board message number into the board''s circular message table.'
interface: "void reqBBS_addBBSMessage(u32 flag /* r0 */)\n    -> u32 nextWriteIndex /* r0 */, u32* writeIndexBase\
  \ /* r1 */, u8* boardLog /* r2 */;\n// Preserves r3 and r7; leaves lr at the address returned by the final SetEventFlag\
  \ tail-call.\n"
details: "Takes an event flag id `r0` whose address \"8888\" is split into a board and a\nper-board message number\
  \ using two anchor flag ids:\n  - off_813E6A4 = 0x17a0 : base of the \"first\" BBS message flags (flag 0 lives\
  \ here).\n  - off_813E6A8 = 0x19a0 : base of the \"second\"/mirror BBS message flag range, 0x200 above the first.\n\
  Steps:\n  1. Calls SetEventFlag(flag, 2).\n  2. Translates the flag into the mirror range: flag' = (flag - 0x17a0)\
  \ + 0x19a0, and calls SetEventFlag(flag', 2).\n     This is why subtracting 0x16b0 (=0x19a0-0x17a0) without the\
  \ second `mov r0,r0` is equivalent; the red `mov r0,r0` is a stack-frame artifact of the lifter, not present in\
  \ the ROM.\n  3. Computes `board = (flag - 0x17a0) / 64` by `lsr r7,#6` (still using r7, which is preserved by\
  \ the helper).\n  4. Aligns that to 64 (`lsl r3,r3,#6`) to get the byte offset of this board's slot in the per-board\
  \ log at byte_2001400.\n  5. Loads the board's next free slot index from unk_2000FC0[board] (index table base\
  \ 0x2000fc0, scaled by 4 via `lsr r3,#4` after the lsl, i.e. *4).\n  6. Stores the message's per-board number\
  \ (`r7 & 0x3f`, low 6 bits of flag-0x17a0) into byte_2001400[board*64 + index].\n  7. Writes index+1 back to unk_2000FC0[board].\n\
  The write index is therefore a monotonic per-board counter that doubles as the\ncapacity/rollover limit; r1/r2\
  \ returned to the caller expose the index table\nbase and this board's log pointer so the caller can keep appending.\n\
  Pushes {r3,r7,lr} / pops {r3,r7,pc} so r3 and r7 are preserved across the two\nguest calls to SetEventFlag (which\
  \ clobbers caller-saved regs); r10 ends up\nholding the post-call lr, exactly matching the original.\n"
