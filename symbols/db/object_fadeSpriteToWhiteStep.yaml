name: object_fadeSpriteToWhiteStep
address: '0x080A94F8'
kind: function
status: confirmed
summary: 'Advance one frame of the overworld ''fade to white'' sprite animation: shift Y upward, ramp color toward
  white, and on completion clear the trigger event flag and free the map-object thunk.'
interface: void object_fadeSpriteToWhiteStep(u32 r5 /* sprite object ptr */, u32 r10 /* event bank */); outputs
  r2, r3 (from sprite_update); r4, r5 preserved
details: 'Reads a frame step counter at object+0x24, divides by 2 for a 16-entry table index. Looks up a Y-shift
  delta (upper-halfword of fixed-point object+0x14) and an RGB5 channel intensity from byte_80A9544 and byte_80A9558
  respectively. Builds a monochrome white/gray color (intensity replicated into all three 5-bit channels) and applies
  it via sprite_setColorShader. When the delta table returns 0xFF the effect is complete: clears event flag 0xFC
  in bank 0x0B via ClearEventFlagFromImmediate and releases the overworld object with owMapObject_freeThunk. Regardless
  of completion the step counter is incremented by 1 and sprite_update(r5) is called (its r2/r3 become this function''s
  outputs). r10 (event bank) is present in the register contract but not read in the disassembly shown; the hardcoded
  bank 0x0B may come from a different caller path or the value is baked into the flag constant.'
