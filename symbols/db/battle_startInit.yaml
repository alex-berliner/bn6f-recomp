name: battle_startInit
address: '0x0803AC56'
kind: function
status: probable
summary: Records a launch-context byte (chatbox/cutscene vs normal) into the battle struct and then initializes
  the battle module.
interface: (r0 = unused flag arg consumed by helper; r5 = battle work struct pointer set up by caller)
  -> r0 = result of battle_moduleInit_803A820; writes mode byte to [r5+1]
details: 'Tests bit 0x80 of the event/chatbox flag word eFlags2009F38 via chatbox_mask_eFlags2009F38;
  if set it skips the mode selection. Otherwise it reads the low-3-bit state selector at eFlags2009F38
  via chatbox_GetState_8045F4C: a nonzero state stores 0xC into byte [r5+1], zero stores 0x20. It then
  calls battle_moduleInit_803A820 to run the battle module''s registration and main init sequence. r5
  is not set inside this function, so the caller must supply the battle-related struct. The 0xC/0x20 values
  are most plausibly battle launch-mode/type codes, 0xC being used when the chatbox/cutscene system is
  active.'
