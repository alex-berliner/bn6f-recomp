- method: assembly-reading
  date: '2026-10-18'
  detail: 'mask 0x80 test on eFlags2009F38 followed by bne skipping the mode write (asm lines 3-5); chatbox_GetState_8045F4C
    result compared to 0 to choose strb 0xC vs 0x20 at [r5+1] (loc_803AC6E); unconditional tail bl battle_moduleInit_803A820
    before pop (loc_803AC72); callee battle_moduleInit_803A820''s known summary: registers battle entries
    10/0x26 and 11/0x27 then starts main init with arg 0; chatbox helpers operate on eFlags2009F38, tying
    the mode byte to cutscene/chatbox state'
