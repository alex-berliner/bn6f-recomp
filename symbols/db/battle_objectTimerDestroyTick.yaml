name: battle_objectTimerDestroyTick
address: '0x080C0072'
kind: function
status: probable
summary: 'Per-frame update for a short-lived battle object: animates its sprite, counts down a lifetime
  timer, then signals its spawner and marks itself for destruction.'
interface: (r5 = battle object ptr, implicit) -> void; destroys the object when its Timer reaches 0
details: Runs an object-specific hook (sub_80C00CE) first, then bails out entirely while the battle is
  time-stopped. Each live frame it advances the related sprite via sprite_updateRelatedObjectIfActive
  and decrements oBattleObject_Timer. When the timer reaches zero it follows oAIData_SpawnedSourceObjectPtr
  on its AI data and calls sub_80E1A86, which writes 8 to offset 8 of the spawning source object — a notification
  that the spawned object expired. Finally it stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object is torn down next state pass. Looks like a generic 'effect with a lifetime' or projectile-expiry
  tick whose exact identity depends on the object script that installs it.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isTimeStop + bne skips all per-frame work during time stop; bl sprite_updateRelatedObjectIfActive
    animates the object''s sprite every live frame; ldrh/sub #1/strh on oBattleObject_Timer: classic lifetime
    countdown, destroy on zero; ldr oAIData_SpawnedSourceObjectPtr then bl sub_80E1A86 (sets offset 8
    to 8) notifies the spawner before dying; mov #CUR_STATE_DESTROY str into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    = self-destruct'
