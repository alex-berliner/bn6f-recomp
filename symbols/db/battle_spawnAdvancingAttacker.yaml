  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s field-mapping and spawn details agree with the asm (0xC0 spawn, Element=3, offsets
    0x64/AllianceAndDirFlip/ExtraVars/Damage fields, Flags|=0x10, object_setPanelsFromCoordinates, byte_8113DC0
