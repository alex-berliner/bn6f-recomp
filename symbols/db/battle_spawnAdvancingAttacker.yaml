  date: '2026-10-18'
  detail: bl object_spawnType3 with r0=#0xC0 after shuffling r0-r2 into r1-r3; strb r3(=3),[r0,#oBattleObject_Element]
    and strh r4>>8,[r0,#oBattleObject_AllianceAndDirectionFlip]; ldr r0,[off_80DD344 table byte_8113DC0
    + (byte at +0x64)*4] then bl object_getFrontDirection; str r0(=facing*table),[r5,#oBattleObject_XVelocity];
    str r3(=facing),[r5,#oBattleObject_YVelocity]; bl object_setPanelsFromCoordinates and orr flags with
    0x10 before the velocity setup
