name: battle_spawnAdvancingAttacker
address: '0x080DD25E'
kind: function
status: probable
summary: Spawns a type-3 battle object (spawn id 0xC0, element 3) configured as an attacker that advances
  each tick with per-type lateral drift taken from a table at 0x08113DC0 (XVelocity = facing*tableEntry,
  YVelocity = tableEntry).
interface: '(r0/r1/r2 = spawn coordinates passed through to object_spawnType3; r4 = packed: low byte =
  movement-table index stored at oBattleObject+0x64, upper halfword -> oBattleObject_AllianceAndDirectionFlip;
  r5 -> oBattleObject_ExtraVars; r6 -> oBattleObject_DamageAndStaminaDamageCounterDisabler) -> r0 = spawned
  object pointer or 0'
details: 'Tail-argshuffles r0-r2 and calls object_spawnType3 with spawn type 0xC0, then on success initializes
  the new object: Element = 3, the low byte of r4 goes to offset 0x64, r4>>8 to AllianceAndDirectionFlip,
  r5/r6 to ExtraVars and the damage-counter field, and sets oObjectHeader_Flags bit 0x10. It then calls
  object_setPanelsFromCoordinates to sync PanelX/PanelY with the world position. Finally it reads the
  byte at +0x64, indexes the word table byte_8113DC0 (entry = byte*4), calls object_getFrontDirection
  to get the +1/-1 facing multiplier, and stores XVelocity = facing*tableEntry and YVelocity = facing
  — i.e. the object steps forward every tick while sliding sideways by the table amount for its type.
  The function returns the object pointer (kept on the stack across the helper calls).'
evidence:
