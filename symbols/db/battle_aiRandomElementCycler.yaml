name: battle_aiRandomElementCycler
address: '0x080F6EA6'
kind: function
status: probable
summary: AI attack object tick that travels one panel per frame and, every StepTimer cycles (up to 5),
  rerolls its element via GetPositiveSignedRNG & 7 (avoiding repeat) and sets HitElement=4; when the cycle
  cap is reached or the object deactivates, it stores HitElement=0x10 and hides the object.
interface: (r0 = battle object (r5 ptr), r7 = AI attack vars) -> void; updates object X position, panels,
  and HitElement
details: On first entry (AttackElement==0) it sets AttackElement=4, anim 0xF, plays SFX 0xE3, computes
  an X velocity and a step timer. Each run it advances X by XVelocity, converts panel X/Y to screen coords,
  then via collision checks (byte_80F6F74 alliance-based flag masks) clears/moves its collision region
  and refreshes panels. When the step timer counts down it calls sub_80F7514, deactivates the object (Z=0xFF,
  shadow/collision removal), and increments a cycle counter; for up to 5 cycles it rolls GetPositiveSignedRNG
  & 7, rerolling to avoid repeating the previous value, and stores it as the new HitElement (0x10 when
  the attack ends or the object survived). The avoid-repeat RNG on a hit element strongly suggests a boss/AI
  projectile that changes its element each hit.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: first-entry block sets AttackElement=4, CurAnim=0xF, PlaySoundEffect(0xE3) and a velocity/timer
    (asm start); per-frame block applies oBattleObject_XVelocity to oBattleObject_X then object_setPanelsFromCoordinates/object_updateCollisionPanels;
    timer expiry calls battle_deactivateObject and cycles oAIAttackVars_TimerOrCycles up to 5; GetPositiveSignedRNG
    & 7 compared against AttackBoost2 with reroll, result stored to HitElement — random non-repeating
    element choice; byte_80F6F74 is an alliance-indexed mask table used with oCollisionData_FlagsFromCollision
    to detect hitting an object
