  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary mostly fits: on first entry it sets AttackElement=4 and anim 0xF (lines 0x080F6EB0-0x080F6EB8),
    plays SFX 0xE3 (0x080F6EBC), advances X each frame (0x080F6EE0), checks collision via byte_80F6F74
    (0x080F6F00), clears/moves collision region, and on step-timer expiry increments TimerOrCycles up
    to 5 then rerolls element via GetPositiveSignedRNG & 7 avoiding repeat (0x080F6F3A-0x080F6F5E). However
    the proposal misidentifies the struct field used to avoid repeat as ''AttackBoost2''; the asm stores
    the rolled element into the same field and sets oAIAttack_HitElement=4 (0x080F6F60), while on termination
    sets HitElement=0x10 (0x080F6F6A). The 5-cycle limit and random element per cycle are correct, so
    only naming/summary needs tightening.; run wf investigate investigate-20261018-222121; proposed by
    Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
