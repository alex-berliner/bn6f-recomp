name: sub_8127800
address: '0x08127800'
kind: function
status: confirmed
summary: Scans 13 paired event flags; sets EVENT_F7 if any pair has either flag set.
interface: void checkStoryFlagPair_8127800(void /* uses r10, lr trivially */)
details: "Iterates two parallel 13-entry flag tables (group_a at 0x8127834, group_b at 0x812787C)\nwith stride 4\
  \ (u32 entries). For each index i, it tests group_a[i] via TestEventFlag;\nif set, or if group_b[i] is set (tested\
  \ on ZF fall-through), it calls\nSetEventFlagFromImmediate(EVENT_F7) and exits the loop. If neither flag of the\
  \ pair is\nset the loop advances (r6 += 4) until i >= 0x34 (i.e. 13 entries).\ngroup_a entries (story/social gates):\
  \ 0x321, 0x327, 0x32D, 0x333, 0x339, 0x345, 0x34B,\n    0x351, 0x357, 0x35D, 0x33F, 0x369, 0x303.\ngroup_b entries\
  \ (completion/chip-link gates, 0xAC..0xB8 inclusive, 13 entries starting\n    at 0xAC then 0xAD..0xB8).\nThe mnemonic\
  \ 'EVENT_F7' is the literal event flag id 0xF7 set via the immediate variant\nSetEventFlagFromImmediate (bits\
  \ 0/1 are the immediate flag-id in r1).\nCaller's r10/lr are preserved across the call; r5 is initialized to 0\
  \ and r6 to the table\noffset cursor (preserved on return per the register contract). No NV clobbered register\n\
  other than the standard scratch set (r0/r1/r3/lr plus nzcv from TestEventFlag).\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
