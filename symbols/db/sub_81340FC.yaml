name: sub_81340FC
address: '0x081340FC'
kind: function
status: confirmed
summary: Looks up a battle-table entry via the object's index fields, unpacks two bit-fields from offset +0x1C,
  and forwards them to the shared three-table-entry setter.
interface: void battle_setFieldsFromObj(u32 *obj /*r5*/); // outputs c v r1 r2 r3 (from callee); preserves r4 r5
  r6 r7; clobbers r0 nz
details: 'Reads a flag byte at obj+0xE. If set, uses the secondary index pair (obj+0x2A + obj+0x2E) and the alternate
  table pointer unk_202A3E0; otherwise uses the primary pair (obj+0x20 + obj+0x24) and word_202A020. The summed
  index is multiplied by 0x20 (entry size) to address the table. A 32-bit packed value at entry offset +0x1C is
  unpacked: bits [15:7] (lsl #16 / lsr #23) become r0, bits [6:0] (AND 0x7F) become r1. r2 is forced to 0 and r3
  is set to the entry index. The tail call to setFieldsInThreeTableEntries_811980C writes r1/r2/r3 and sets the
  c and v flags, which the caller reads back.

  '
