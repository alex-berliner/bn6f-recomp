name: battle_initProjectileObject
address: '0x080DB9B8'
kind: function
status: probable
summary: 'Battle-object init handler: loads the object''s sprite resources, links a related object, allocates
  collision data, gives it a facing-based X velocity, and switches it to its update state.'
interface: (r5 = battle object ptr, set by caller) -> r0 = clobbered; on failure of related-object lookup
  or collision allocation the object is freed; flags and CurState updated
details: Decompresses and loads sprite resource (0x10,0x47), sets the hasShadow flag bit in oObjectHeader_Flags,
  resets CurAnim/CurAnimCopy/Param1 to 0, applies animation 0, palette 0 and object_getFlip via sprite_setFlip.
  Calls sub_80DC38A to fetch a related object stored into oBattleObject_RelatedObject2Ptr and frees the
  object if none is found. Allocates collision data (failing frees the object), configures it with (4,5,3),
  sets XVelocity = object_getFrontDirection() * 0x30000, stores hit-effect 0xFF, refreshes collision state,
  copies Damage & 0xFFF into ExtraVars+4, and writes CUR_STATE_UPDATE to CurStateActionPhaseAndPhaseInitialized.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sprite_decompressTemp/sprite_load/sprite_hasShadow/sprite_setAnimation with resources 0x10,0x47
    — sprite setup typical of object init; bl sub_80DC38A; str r0,[r5,#oBattleObject_RelatedObject2Ptr];
    bne skip; bl object_freeMemory — requires a related/parent object; bl object_createCollisionData/object_setupCollisionData(4,5,3)
    then object_setCollisionHitEffect(0xFF) and object_presentCollisionData; ldr r1,=0x30000; mul with
    object_getFrontDirection result into oBattleObject_XVelocity — moves away from its spawner/facing;
    ldrh Damage & 0xFFF -> ExtraVars+4 and CUR_STATE_UPDATE written to CurStateActionPhaseAndPhaseInitialized
    ends the init
