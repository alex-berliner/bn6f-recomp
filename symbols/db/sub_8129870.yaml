name: sub_8129870
address: '0x08129870'
kind: function
status: confirmed
summary: Handles D-pad selection (up/down among 3 items), A confirm, and B cancel on a small vertical choice menu,
  writing the resulting sub-state into the menu struct.
interface: void sub_8129870(u32 r5, u32 r6, u32 r7, u32 r10 /*toolkit*/); // returns r4 r5 r6 r10; clobbers NZCV
  r0-r3 lr
details: 'Reads the currently-pressed buttons at r10->toolkit->joypad->Pressed and the current

  cursor index at r5+0x12. Calls menu_moveCursorUpDown_811FA22 with (pressed, max=3,

  step=1, curIndex, curIndex, r5, r6, r7) to clamp movement. If the returned new index

  differs, persists it back to r5+0x12 and calls sub_812B39C(r4=oldIndex, r5) to

  refresh the menu (likely redraw / mark dirty).

  On A: plays SOUND_MENU_SELECT, sets r5+3 = 0xC (a "selected" sub-state code),

  zeroes r5+0x1C and r5+0x1E, and sets bit 0 of r5+0x1B (a "dirty / needs re-issue".

  On B: plays SOUND_EXIT_SUBMENU, sets r5+3 = 0x10 (a "cancel/back" sub-state code),

  and applies the same zero + flag-bit pattern.

  Likely a menu-state handler for a 3-option vertical menu (e.g., save/load, delete,

  or a confirm dialog), where 0xC and 0x10 at offset 3 are state IDs the parent state

  machine dispatches on.

  '
