open_questions:
- What exactly is the 0x21 mask passed to FreeAllObjectsOfSpecifiedTypes (which object-type bits does
  it cover)?
- What is the role of sub_8004702, zeroFill_80024A2, zeroFill_8003AB2, and scenario_initEffectState_8003962
  in this teardown — naming them would clarify what state is being reset.
- Why is initBattleStructsAndVram_80071D4 called again here if battle is ending — is it to refresh reward-screen
  / result-screen structures, or to seed state for the next battle?
- Is initBattleStructsAndVram_80071D4 being passed both CurBattleDataPtr (r0) AND gameState (r5) — does
  it actually consume r5, or is r5 there for the next call only?
- What is the meaning of `oToolkit_GameStatePtr` — confirm it really points at the live GameState struct
  that receives SubsystemIndex = 0xC.
- Why is eLogoScreenState filled with the constant 0x2180 (and the count is also 0x2180 bytes) — is 0x2180
  a sentinel/default value, or a flag layout?
- Who calls this function, and from which post-battle context (battle result screen, link battle, etc.)?
