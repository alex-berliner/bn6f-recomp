name: endBattleAndEnterMap_800531C
address: '0x0800531C'
kind: function
status: confirmed
summary: End-of-battle teardown that frees battle-time objects, resets misc state, queues the post-battle
  map-entry subsystem (0xC), and reinitializes battle structures/VRAM plus the logo-screen state buffer.
interface: "void sub_800531C(void); // inputs: r4 r5 r6 r7 r10 lr; outputs: r8 r9 r10 r11 r12;\n     \
  \                   // clobbers NZCV + r0 r1 r2 r3 r5 lr; preserves r4 r6 r7\n                     \
  \   // r10 (to) = toolkit pointer carrying the GameStatePtr used to set SubsystemIndex.\n"
details: "Sequence driven entirely off the Toolkit's GameState pointer (loaded via r10 / oToolkit_GameStatePtr):\n\
  \  1. chatbox_8040818 — tear down the battle chatbox.\n  2. FreeAllObjectsOfSpecifiedTypes(0x21) — free\
  \ all battle objects whose type bits match 0x21.\n  3. sub_8004702 — clear misc per-battle state block\
  \ 1.\n  4. zeroFill_80024A2 — zero another state region.\n  5. scenario_initEffectState_8003962 — reinit\
  \ the scenario / effect state slot.\n  6. zeroFill_8003AB2 — zero yet another state region.\n  7. RandomizeExtraToolkitPointers\
  \ — re-randomize the extra toolkit pointers (e.g., chip-drop / trade RNG pool).\n  8. GameState.SubsystemIndex\
  \ = 0xC — the \"HandlesBattleMainUntilEndOfBattleThenTriggersEnterMap\" subsystem (handled via cbGameState_80050EC),\
  \ which ends battle main and triggers the map-entry flow.\n  9. initBattleStructsAndVram_80071D4(CurBattleDataPtr,\
  \ gameState) — rebuild battle structs and battle VRAM one final time (presumably so the after-battle\
  \ chip/reward screens can still render correctly).\n 10. WordFill(eLogoScreenState, 0x2180, ~0) — fill\
  \ the \"eLogoScreenState\" table (size 0x2180) with the constant word 0x2180 (i.e., initialize every\
  \ entry to the value 0x2180 over the full 0x2180-byte range via the all-ones count).\nQuirks: pops {pc}\
  \ instead of lr, so this is a tail-call cleanup. WordFill is invoked with `mvn r2, r2; r2 = ~0` so it\
  \ runs across the whole 0x2180-byte logo-screen-state region.\n"
