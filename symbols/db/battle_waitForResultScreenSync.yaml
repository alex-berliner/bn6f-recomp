name: battle_waitForResultScreenSync
address: '0x080098D8'
kind: function
status: probable
summary: 'Link-battle state handler: initializes the result transition, waits until both players'' tracked
  id equals 0x1f2f3f4f (or a 180-frame timeout), then restores result records and advances the battle
  state.'
interface: (r0-r4 = state work area in r5, no args) -> r0 = clobbered; sets oBattleState_StatePhaseAndInitFlag
  = 4 on sync or oBattleState_Index_00 = 0xc on timeout
details: Runs once per frame as a battle state-machine step using the oBattleState struct in r5. On first
  entry (SubPhaseInitFlag clear) it calls sub_800B428, which reinitializes global work and issues a mode-4
  request to the state manager at 0x80200A4 — almost certainly opening the result/result-screen mode —
  then zeroes CountdownTimer and latches the init flag. Afterwards it compares the link-sync tracked id
  against the constant 0x1f2f3f4f via battle_doBothTrackedIdsMatch_800B46C; only when both EWRAM slots
  (0x203F4A0/0x203F5A0) hold that id does it clear the sync words, restore the 12-byte link battle-result
  records into unk_2035260/unk_203526C (sub_800B444), and set the phase to 4. If the peer id does not
  match, it increments CountdownTimer and, after 180 frames (0xb4), forces state index 0xc as a timeout
  fallback, routed through battle_main_8007800.
