details: Used in battle_restoreMapBackground as the source tile_ids pointer for CopyBackgroundTiles(0,
  0, 1, unk_201E920, 0x1e, 0x14) — a 30x20 u16 tilemap destined for BG tile block 1. Also referenced from
  screens3_loadBackgroundTiles as one of the candidate background tile tables it can decompress/copy.
  It is a plain RAM buffer, not a decompress destination itself; the 120 bytes recorded to the next label
  is only the spacing in ewram.s, the full tilemap window is the 0x1e*0x14*2 bytes the Copy call describes.
