name: battle_applyInvisibleClear_80106C0
address: '0x080106C0'
kind: function
status: probable
summary: 'Battle chip handler: clears the opponent Navi''s stats-byte 0x0D bit 1 (an "invisible/busy"
  marker) when gates pass, then triggers an animation/spawn on the opponent''s panel.'
interface: u32 sub_80106C0(u32 chip_index /* r0 */, BattleObject* self_obj /* r5 */, u8 opponent_alliance
  /* r6 */, flags out nz); returns 1 on success, 0 if any gate fails
details: "Gates (all must pass to take action):\n  1. GetBattleEffects() & 0x8 must be set.\n  2. GetBattleNaviStatsByte(opponent_alliance,\
  \ 0x0D) must not be 0xFF and must have bit 1 set.\n  3. Chip data byte 7 (element) must be 1 or 2.\n\
  Action when passing:\n  - Clear bit 1 of opponent's stats byte 0x0D via SetBattleNaviStatsByte.\n  -\
  \ Look up opponent BattleObject via battle_findPlayer(alliance).\n  - Call sub_80E90FE(panelX, panelY,\
  \ 0, 0, 1, 0, 0x17A) and pass its return to sub_800BF16(alliance, 1, result).\n  - Return 1.\nOtherwise\
  \ returns 0. oBattleObject_Alliance, oBattleObject_PanelX, oBattleObject_PanelY are the BattleObject\
  \ fields touched. r4 is used as scratch inside (set to 1 before the sub_80E90FE call) and preserved\
  \ across it. Note the r6 register is both an input (opponent alliance) and overwritten with the XOR'd\
  \ alliance value internally.\n"
