name: sprite_setColorShader
address: '0x08002ED0'
kind: function
status: confirmed
summary: Stores a color-shader id into the sprite block selected by an object's high-nibble sprite index.
interface: void sprite_setColorShader(u16 shaderId /*r0*/, ObjectHeader* obj /*r5*/); returns r3 = address of the
  affected sprite block, sets nzcv from the final ADD
details: 'Reads the type/sprite-offset byte at obj+2 (oObjectHeader_TypeAndSpriteOffset), takes its high

  nibble as a sprite block index (<<4 gives a 16-byte-stride offset), and computes the sprite

  block base as obj + (highNibble << 4). Writes the halfword in r0 to spriteBlock+6

  (oObjectSprite_Unk_06), interpreted by the caller as a color-shader/palette-effect id.

  Tail-jumps back via mov pc, lr, so it is a leaf-style helper usable from Thumb callers.

  Side effect on return value: r3 holds the sprite block base address, and the flags come from

  the ADD that formed it (r3 + r5), which callers could in principle consume but likely ignore.

  No other registers or memory are touched.

  '
