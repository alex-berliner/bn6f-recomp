name: MapScriptCmd_jump_if_map_group_compare_last_map_group
address: '0x08035C6E'
kind: function
status: confirmed
summary: Map-script opcode that conditionally jumps if the current map group equals (or, via the mode byte, not
  equals) the previous map group.
interface: "void mapScriptCmd_jumpIfMapGroupEqLastMapGroup_8035C6E(void);\n  inputs:  r7 (script PC), r10 (toolkit),\
  \ lr (return)\n  outputs: nz (r0=1), r7 (advanced script PC: jump target on match, else PC+6)\n  clobbers: r0,\
  \ r1, r4, r6, c, v\n  preserved: -\n"
details: 'Reads the game-state pointer through the toolkit (r10 -> oToolkit_GameStatePtr) and pulls oGameState_MapGroup
  and oGameState_LastMapGroup (each a u16) for the comparison.

  Consumes 1 byte of the script stream via ReadMapScriptByte (R6=1, result returned in R4) to pick the mode: R4==1
  => "jump if current == last", anything else => "jump if current != last".

  On a match, reads a 16-bit relative offset via ReadMapScriptWord (R6=2, result in R4) and writes it into R7 as
  the new script PC.

  On no match, R7 is bumped by 6 to skip the 1 mode byte + 2 offset bytes + the opcode header itself.

  Always returns R0 = 1 so nz is set; the script dispatcher continues at the (possibly jumped) R7.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
