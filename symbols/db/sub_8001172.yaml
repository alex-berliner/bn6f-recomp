name: sub_8001172
address: '0x08001172'
kind: function
status: hypothesis
summary: Writes a caller-supplied byte into GameState+0x09 (an unnamed one-byte state field), via the toolkit's
  game state pointer.
interface: void sub_8001172(u8 value /*r0*/); // r10 = toolkit; returns r3 = game state pointer
details: 'Reads the game state pointer from toolkit+oToolkit_GameStatePtr (r10 is the toolkit

  base, carried in the caller''s register convention), then stores the low byte of r0

  into GameState+0x09 with strb. GameState+0x09 has no named macro yet, so the exact

  in-game meaning of the field is unknown; note offset 9 sits before the oGameState_Unk_15

  group. Also returns the game state pointer in r3 as a side effect (likely incidental,

  but callers may rely on it).

  '
