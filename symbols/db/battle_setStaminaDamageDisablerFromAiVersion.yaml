name: battle_setStaminaDamageDisablerFromAiVersion
address: '0x08114E30'
kind: function
status: probable
summary: Sets the battle object's stamina-damage-counter-disabler field from a lookup table indexed by
  the AI data's version byte.
interface: (r5 = battle object, implied) -> writes halfword to oBattleObject_StaminaDamageCounterDisabler;
  no return value, flags clobbered.
details: Loads the object's AIData pointer, reads byte oAIData_Version_16, uses it as an index into byte_8114758,
  and stores the fetched byte as a halfword into oBattleObject_StaminaDamageCounterDisabler. The table
  presumably maps AI version (e.g. which Navi/cross AI variant) to a counter-disable flag. It is a leaf
  function with no other effects. Caller r5 must already hold the battle object; nothing validates the
  index.
