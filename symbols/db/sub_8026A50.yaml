name: sub_8026A50
address: '0x08026A50'
kind: function
status: hypothesis
summary: Queries some value via sub_802FE48, stores it on the object, starts sub_802FE7A with (0,0x40,0x40,value),
  then moves the object to state 4 and returns 0.
interface: u8 sub_8026A50(S20364C0* self /* r5 */); /* returns 0 in r0, sets Z=1 N=0, clobbers r1-r3 */
details: Small state-machine step for an object whose struct pointer arrives in r5 (type S20364C0). It calls sub_802FE48
  with no visible arguments, saves the returned byte at self+0x0E (oS20364C0_Unk_0e), then calls sub_802FE7A with
  r0=0, r1=0x40, r2=0x40 and r3=that same value — the 0x40/0x40 pair looks like size or screen coordinates, and
  the value in r3 an id/parameter for whatever sub_802FE7A starts. Finally it writes the object's state word at
  self+0x00 to 4, so the object's handler will take the "state 4" branch next tick, and returns 0 (the caller contract
  shows callers read back r0 and NZCV, all from the trailing "mov r0,#0"). r4-r7 and lr are declared inputs but
  the body only reads r5; r4-r7 are preserved, r0-r3 and the flags are clobbered. The exact game meaning depends
  on what S20364C0 and the two callees are; the pattern (query value -> remember on object -> kick off helper ->
  advance state) reads like an NPC/event object preparing an animation, effect or dialogue step.
