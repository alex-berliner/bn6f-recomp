name: sprite_initPlacementSettings
address: '0x080027F4'
kind: function
status: probable
summary: Initializes the global sprite-placement block (byte_20098A8=0x10, byte_20098A9=0 [isometric projection],
  halfword at 0x20098AA=0xFF) during overworld scene reset.
interface: () -> r0 = undefined; writes globals byte_20098A8..A9 and word_20098AA, clobbers flags
details: Stores 0x10 into byte_20098A8, clears byte_20098A9 to 0 — which per the symdb selects camera
  projection 0 (isometric) — and stores halfword 0xFF into word_20098AA (+2). It takes no arguments and
  returns whatever the last store leaves in r0. It is called once, in the overworld scene-reset path right
  after resetOverworldScene/resetAllGraphicsState/runSetupStepAndClearWorkArea and before camera_init,
  so it primes the placement block before the camera and map data are set up.
