    (0 = isometric, 4 = side view); It writes fixed constants 0x10 and 0xFFFF into byte_20098A8 and word_20098AA,
    i.e. a fixed default-state initializer with no inputs; Sole call site 0x081387EE sits in a scene-reset
    routine between resetAllGraphicsState_8005F40/runSetupStepAndClearWorkArea_8005F6C and camera_init_802FF4C;
    camera_init is called with map_group 0xd0-style args right after, matching a fresh overworld load
