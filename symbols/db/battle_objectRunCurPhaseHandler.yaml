name: battle_objectRunCurPhaseHandler
address: '0x080C37AC'
kind: function
status: probable
summary: Dispatches a battle object's current phase via a per-phase jump table indexed by oBattleObject_CurPhase,
  tail-calling the selected handler
interface: (r5 = battle object pointer, no args) -> r0 = handler return value; flags from handler
details: 'Reads oBattleObject_CurPhase from the object in r5, indexes the jump table off_80C37D0 (7 entries:
  sub_80C37EC, battle_objectDescendAndLand, battle_timerWaitThenSetAnim2PhaseC, sub_80C3852, sub_80C38A0,
  battle_checkFrameEndFlag, sub_80C38DA), and tail-calls the selected handler via the mov lr,pc/bx r1
  mode-switch idiom. All handlers operate on the same r5 object, advancing its motion/animation state
  machine. The caller at 0x080C3758 sets the object''s Flags bit 2, Timer to 0x28, plays sound 0x16, stores
  CUR_STATE_UPDATE, then calls this so the new state''s phase runs immediately.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_80C37BC: ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0] indexes off_80C37D0 by phase;
    mov lr,pc / bx r1 tail-calls the selected handler with r5 object context unchanged; jump table entries
    are object-behavior routines (battle_objectDescendAndLand, battle_timerWaitThenSetAnim2PhaseC, battle_checkFrameEndFlag);
    caller 0x080C3758 stores CUR_STATE_UPDATE then immediately calls this to execute the new state''s
    first phase; callee phase handlers match the named pattern of other battle object phase routines'
  refs:
  - bn6f/asm/asm31.s:25876
  - 0x080C3758 sub_80C3758
  - 0x080C37BC sub_80C37AC
  reproduce: python3 tools/asmcat.py 0x080C37AC
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The function is a thin tail-call dispatcher to a per-phase handler, but naming it `battle_objectRunCurPhaseHandler`
    is fine. However the sub_80C37AC entry is only `push {lr}; bl loc_80C37BC; pop {pc}` — the real dispatcher
    body lives at loc_80C37BC (which is not labeled as a separate function, so naming the pair is ambiguous).
    The summary and details are otherwise accurate.; run wf investigate investigate-20261019-094015; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
