summary: 'Proposed name: worldMapAnimRowOneTileData. Middle of three 32-byte world-map BG row tile/palette
  data blobs sourced by the per-frame world-map animation advance. (table of u8)'
details: Lives in ROM at 0x086C2360, 32 bytes long. Referenced once, as the .word tile-data source of
  the second row of dword_8034408 inside sub_80343B0. Each row of dword_8034408 is a (sourcePtr, count,
  destTileIdPtr) triple, and this label is the sourcePtr of row 2, sitting between byte_86C2340 (row 1)
  and byte_86C2380 (row 3). The function advances world-map animation, queueing row palettes and restamping
  a 32x20 BG tile block each frame.
