- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl chatbox_mask_eFlags2009F38 with r0=0x80 gates the setup block on an event flag bit (bne
    skips it); bl sub_803C0BE (0x10,0x30) then bl sub_803C132 (0x10,0x30): list is normalized to E5 pairs,
    counted, count stored at [r5,#0x10]; strb 0xC at [r5,#1] and strb 0 at [r5,#0x13] initialize context
    fields only in the first-run branch; loc_804A072 is reached from both branches and always calls sub_8049F70,
    which ''queues setup actions and resumes script playback''; callee semantics of sub_803C0BE/sub_803C132
    (2-byte entries, 0xE5/0xE6 markers) identify the list format'
