name: e_condInitSceneListSetup
address: '0x0804A04E'
kind: function
status: probable
summary: Script/event step that, when event-flag bit 0x80 is not yet set, sanitizes and counts a halfword
  entry list and sets up scene state fields, then always resumes scene/script playback.
interface: (r5 = scene/task context struct) -> r0 = passthrough of sub_8049F70; writes r5+0x00, r5+0x10,
  r5+0x13; reads event flag bit 0x80
details: 'It first tests event-flag bit 0x80 via chatbox_mask_eFlags2009F38; if the bit is clear it performs
  one-time setup: clears byte r5+0x13, calls sub_803C0BE(0x10, 0x30) which compacts trailing free slots
  (0x00 or 0xE5) of a 2-byte-per-entry list into 0xE5 0xE5 pairs up to a 0xE6 terminator, then counts
  the valid entries with sub_803C132(0x10, 0x30) and stores the count at r5+0x10, and finally writes 0xC
  to r5+0x01. The 0x10/0x30 arguments likely identify the buffer and its capacity (48 halfword entries).
  Whether the flag bit was set or not, it always tail-calls sub_8049F70, which queues setup actions and
  resumes script playback. The E5/E6 markers and cleanup pattern suggest the list is a persistent, save-relevant
  table rather than scratch data.'
