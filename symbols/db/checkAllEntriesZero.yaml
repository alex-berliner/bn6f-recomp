name: checkAllEntriesZero
address: '0x080F2DC0'
kind: function
status: probable
summary: returns 1 if all three dwords of a 3-entry array at r0 are zero, else 0
interface: (r0 = pointer to array of 3 dwords) -> r0 = 1 if every entry is 0, 0 if any entry is nonzero;
  flags clobbered
details: Iterates r3 = 0..2 over the array at r4 = r0, loading each dword with ldr [r4, r3*4]. On the
  first nonzero entry it bails out immediately returning 0; if all three entries are zero it returns 1.
  The early-exit tst/bne means it is a short-circuit 'is this 3-slot set empty/all-clear' test. The entries
  are compared as whole 32-bit values, so they could be pointers, IDs, or counters; nothing in this function
  identifies the structure. No callers, callees, or data references are known, so the game-side meaning
  of the array is undetermined.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loop ldr r1,[r4,r2] with r2=r3*4 covers exactly offsets 0,4,8 (three dwords); tst r1,r1 / bne
    returns 0 on first nonzero entry (short-circuit); fall-through after cmp r3,#3 sets r0=1 only when
    all three were zero
