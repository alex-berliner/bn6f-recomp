name: ow_scrollBg2LeftWriteTiles
address: '0x0802AF6C'
kind: function
status: probable
summary: Animates a horizontal BG2 screen slide (scroll X 120->0 in 12px steps) while writing tile columns
  from unk_2035000 into BG block 3, playing a sound on the first frame.
interface: '(r5 = state object, preloaded by caller; fields: +2 started flag byte, +38 scroll X word,
  +3c step counter word) -> r0 = remaining scroll X (0 when finished); writes BG2ScrollX in toolkit RenderInfo,
  plays sound, updates BG block 3 tiles'
details: 'On the first call (byte at r5+2 == 0) it initializes scroll X to 0x78, plays SOUND_SELECT_79,
  sets the step counter at r5+0x3c to 0xf and the scroll at r5+0x38 to 0x78, and sets the started flag.
  Each call then subtracts 0xc from the scroll at r5+0x38 and, depending on ((scroll-12)&4)>>2, writes
  one or two columns of tiles: it reads 16-bit tile ids from unk_2035000 indexed by the decrementing counter
  at r5+0x3c (stride 0x1e bytes per column, 20 rows per column via r1 0..0x14), passing them to bgmap_WriteTileIdAtBlock
  with block 3 and x = counter. The new scroll value is stored both back to r5+0x38 and into oRenderInfo_BG2ScrollX
  of the toolkit''s RenderInfo, and returned; the effect ends when scroll reaches 0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#2] / bne: one-time init writes 0x78 to scroll, calls PlaySoundEffect, sets +3c=0xf,
    +38=0x78, flag=1; sub r0,#0xc ... pop {r0,...}: scroll stored back at r5+0x38 decreases by 12 each
    call, loop until 0 (cmp r0,#0); mov r6,#4; and/lsr +1: 1 or 2 column passes per call depending on
    scroll value; ldr r4,off_802B08C =unk_2035000; ldrh r3,[r4]; bl bgmap_WriteTileIdAtBlock_800187C with
    r2=3, r1=row 0..19, r4+=0x1e per row step; strh r0,[r1,#oRenderInfo_BG2ScrollX]: scrolls the toolkit''s
    BG2 horizontally'
