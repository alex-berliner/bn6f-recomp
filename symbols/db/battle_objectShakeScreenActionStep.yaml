name: battle_objectShakeScreenActionStep
address: '0x080B9ABA'
kind: function
status: probable
summary: Battle-object action step that plays a 30-frame camera shake, then advances the object to action
  0xC
interface: (r0 unused on entry, r5 = battle object) -> r0 clobbered; no return value, mutates object phase/anim/timer/action
details: This is a per-frame state handler for a battle object. On phase 0 it stores phase 4 and anim
  4 into the object, loads the timer with 0x1E (30 frames), and calls camera_initShakeEffect (r0=0, r1=duration=30)
  to start a screen shake. On subsequent frames it decrements oBattleObject_Timer; once it hits zero it
  sets oBattleObject_CurAction to 0xC and clears oBattleObject_CurPhaseAndPhaseInitialized, so the object's
  action machine moves to the next action. The shake trigger reuses the timer value as the shake duration.
