name: pet_updateDefaultNaviSceneStep
address: '0x0812B608'
kind: function
status: probable
summary: 'Scene-step helper: snapshots the current PET navi into [r5+0x1a], resets it to the default (0)
  if story flag 0x163 is unset, copies [r5+0x2a] to [r5+0x44], and if the two bytes are below 0xC0/0x16
  respectively, calls sub_812B768 and advances the phase byte [r5+0x02] to 4.'
interface: (r5 = scene/game-state context struct) -> r0 = 0 or sub_812B768 result; sets [r5+0x1a], [r5+0x44],
  [r5+0x02]; flags clobbered
details: 'Reads the currently selected PET navi via GetCurPETNavi and stores it at [r5+0x1a]. If story/event
  flag 0x163 is clear, it writes navi index 0 back through SetCurPETNavi, i.e. it forces the default navi
  when the choice flag has not been set yet. It then copies the halfword at [r5+0x2a] into [r5+0x44] and
  range-checks its two bytes: if the low byte is >= 0xC0 or the high byte is >= 0x16, the function returns
  without doing anything further. Otherwise it calls sub_812B768 (unknown, presumably starting the next
  intro event/cutscene) and stores 4 into the state byte [r5+0x02], which looks like a scene/state-machine
  phase field. r5 is never initialized inside the function, so it is a context pointer supplied by the
  caller.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetCurPETNavi / strb r0,[r5,#0x1a] — caches the selected navi into context field 0x1a; movflag
    EVENT_163 + TestEventFlagFromImmediate + SetCurPETNavi(0) — forces default navi 0 when flag 0x163
    is unset; ldrh r4,[r5,#0x2a]; str r4,[r5,#0x44] with cmp low<0xC0, high<0x16 — gated copy of a two-byte
    value into field 0x44; bl sub_812B768; mov r0,#4; strb r0,[r5,#2] — on success runs the next step
    and sets scene state 4
