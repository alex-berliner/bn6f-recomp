summary: Thumb trampoline that jumps to one of three handlers chosen by the byte at r5+8.
interface: 'void sub_8117BC8(struct HandlerObj *r5); /* returns: r2 r3 r5 r10 r11 */'
details: 'Loads the dispatch table base from off_8117BD8, indexes it by the unsigned byte at

  r5+8, and tail-calls the resulting address with lr set to the next instruction so

  that `pop {pc}` on return resumes the original caller. Targets (switched by the

  thumb bit) are sub_8117BE8, sub_8117C4C, sub_8117CCC. r5 is the handler object

  threaded through every call. No other register contract beyond r5 is meaningful;

  the other output/clobbered registers come from whatever the dispatched handler

  does.

  '
