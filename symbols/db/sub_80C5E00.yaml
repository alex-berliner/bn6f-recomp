summary: 'Battle object spawn initializer: places the object from its panels, seeds its Timer from Param2, builds
  collision data, and enters the running/update phase.'
interface: void sub_80C5E00(struct BattleObject *r5 /* battleObject */, void *r8 /* unknown owner? */, void *r10
  /* unknown owner? */)
details: 'Standard battle-object spawn pipeline used by one of the battle action states (likely init/state-handler
  entry from a larger FSM). Sequence: object_setCoordinatesFromPanels to drop the object on its panel; copies oBattleObject_Param2
  (byte) into oBattleObject_Timer (halfword) as a delay/counter seed. Calls object_createCollisionData; if that
  returns NULL, falls into a cleanup tail that calls object_freeMemory and returns early (the object''s owner is
  responsible for deallocation). Otherwise object_setupCollisionData is called with hand=0xA, group=5, and a flag
  table derived from oBattleObject_Param3 (0 -> 3, 1 -> 1, default -> 0), likely mapping to ally/enemy/neutral hit-class
  masks. Then sets collision hit effect = 0 (no effect), clears the collision region, calls object_presentCollisionData,
  and finally writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized (also clearing the
  "phase initialized" half so the next handler runs a one-shot init). Preserved r4-r7 match a battle-object "owning
  callback" frame r5,r8,... pattern from the battle subsystem; r10 is treated as opaque by this routine.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
