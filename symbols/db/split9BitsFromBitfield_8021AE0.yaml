name: split9BitsFromBitfield_8021AE0
address: '0x08021AE0'
kind: function
status: confirmed
summary: Splits a packed 18-bit value into its low and high 9-bit halves, returning them in r0 and r1.
interface: 'u9Pair split9BitsFromBitfield(u32 bitfield) // in: r0 = bitfield, lr = return; out: r0 = low 9 bits
  (masked with 0x01FF), r1 = bitfield >> 9, r2 = mask word 0xB51001FF; flags NZ set from r0, C clobbered'
details: A small helper that unpacks two 9-bit fields stored in one word, likely a tile/map or coordinate pair packed
  into 18 bits. Computes r1 = r0 >> 9 (upper 9 bits) and r0 &= 0x01FF (lower 9 bits). The mask is loaded from a
  literal pool halfword (0x01FF); because the load is a full word, r2 ends up as 0xB51001FF, with the upper half
  coming from the next function's push opcode bytes. Callers presumably only rely on r0/r1, but r2 is a visible
  side value. Bits 16-31 of the input are assumed clear by all callers, so no 32-bit masking is done. Flags NZ are
  set from the masked result as a side effect of the AND.
