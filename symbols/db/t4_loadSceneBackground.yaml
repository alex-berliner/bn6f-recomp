name: t4_loadSceneBackground
address: '0x0813017C'
kind: function
status: probable
summary: Copies a full 30x20-tile (whole-screen) background map from RAM into BG tile block 1 when an
  overlay cutscene is set up.
interface: () -> void; no input args, all parameters hardcoded
details: 'A thin wrapper around CopyBackgroundTiles: it passes which_tile_block_32x32 = 1, tile_ids =
  unk_201F820, and size j=0x1E (30), i=0x14 (20) — exactly the GBA screen in 8px tiles — starting at map
  position (0,0). unk_201F820 therefore holds a prebuilt full-screen tilemap in RAM that gets blitted
  to background layer 1. Called by t4_sceneInit and two other scene routines, it is the background (re)loader
  for t4 overlay cutscene scenes. No return value; flags are whatever CopyBackgroundTiles leaves.'
