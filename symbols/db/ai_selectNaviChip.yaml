    into oAIAttackVars_* and passed to object_setAttack0; sub_8012792 called with r0=0xC and callback
    at oAIAttackVars_PanelChooseCallback, returning 0xFF as 'no pick', with PlaySoundEffect(SOUND_OK_8B)
    on success; ChargeCycles decrement and ChargeReadyFlag setting oBattleObject_CurAction=0x41 tie this
    to the AI's attack/chip-use phase; NaviStats byte 0x2C compared to 0x17/0x18 and range 0xB-0x18 gates
    randomness and PwrAtkState, matching Navi-ID style checks
