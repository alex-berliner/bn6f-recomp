name: ai_selectNaviChip
address: '0x080EF87C'
kind: function
status: probable
summary: AI routine that picks a chip ID for the opponent Navi's next attack (randomly or via panel choice),
  loads its chip data, and sets up the attack state.
interface: (no args; r5 = battle object, r7 = AI attack-vars struct) -> stores oAIAttackVars_ChipID, AiDifficultyTier,
  AttackBoost2, PwrAtkState; may set oBattleObject_CurAction = 0x41
details: Reads NaviStats byte 0x2C; if it is 0x17/0x18 (specific Navis) or the object is invincible, it
  picks a chip purely at random (GetPositiveSignedRNG mod 4, svc 6, mapped through byte_80EF958 to IDs
  0x176-0x178). Otherwise it decrements oAIAttackVars_ChargeCycles; when charged (or when the panel-choose
  callback sub_8012792 with the 0x30-entry weight table at r7+0x30+0xC returns a valid index), it selects
  a chip, plays SOUND_OK_8B on the manual path, and stores the ID at oAIAttackVars_ChipID. It then fetches
  the 44-byte chip record via getChip8021DA8, copies byte 0xC to oAIAttackVars_AiDifficultyTier, word
  0x10 to oAIAttackVars_AttackBoost2, and calls object_setAttack0 with chip byte 0xB (element/type). Chip
  0x177 is special-cased (skips the charge-action branch), and when oAIAttackVars_ChargeReadyFlag is set
  it sets oBattleObject_CurAction = 0x41 (charged attack action); for NaviStats 0x2C in range 0xB-0x18
  (or while invincible) it also copies chip byte 0xF to oAIAttackVars_PwrAtkState.
