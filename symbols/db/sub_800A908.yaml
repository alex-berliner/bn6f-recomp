name: sub_800A908
address: '0x0800A908'
kind: function
status: confirmed
summary: Clears the 32-bit battle state counter at A_dword_2000B30 to 0 and returns its address in r1.
interface: void clearBattleStateCounter_800A908(u32 *outCounter /* r1 */)
details: 'Stores 0 to the word pointed to by off_800A950 (dword_2000B30), a 32-bit battle state

  counter (likely a frame/tick counter for the active battle). Sets r0 = 0 so callers can

  detect "just cleared" via the NZ condition flags (nz clobber contract). Returns the

  address of that counter in r1. No other side effects.

  '
