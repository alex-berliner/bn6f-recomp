name: battle_objectDispatchByAction
address: '0x080E65E0'
kind: function
status: probable
summary: 'Dispatcher for the player-anchored battle object: reads the object''s CurAction and jumps to
  one of three action handlers.'
interface: (r5 = battle object ptr, r0/r1 scratch) -> tail-calls handler for oBattleObject_CurAction;
  no return value of its own
details: Loads off_80E65F4 (a 3-entry function-pointer table) and indexes it with the byte at r5+oBattleObject_CurAction,
  then calls the selected handler in ARM mode (mov lr, pc; bx r1) so each handler returns through pop
  {pc}. r0 ends up holding the action index when the handler is entered, so handlers likely also receive
  the action id in r0. The three handlers are sub_80E6600, sub_80E6644, and sub_80E667C. This is the standard
  battle-object per-frame state dispatcher pattern; r5 must be set up by the caller (battle_initObjectOnPlayerPanel's
  object loop).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0]: table indexed by the object''s current
    action; off_80E65F4 holds exactly three thumb pointers (sub_80E6600/80E6644/80E667C), one per action
    state; mov lr,pc; bx r1; pop {pc}: tail-call dispatch preserving return to this function''s caller;
    only known caller is battle_initObjectOnPlayerPanel, which creates this player-panel object'
