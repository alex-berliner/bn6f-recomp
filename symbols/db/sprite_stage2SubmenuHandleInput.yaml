name: sprite_stage2SubmenuHandleInput
address: '0x08125678'
kind: function
status: probable
summary: 'Per-frame input handler for a battle-sprite submenu: Start/B records selection 0x3C and triggers
  exit+fade, Right writes state 0x48 or 0x1c based on [r5+0x64], Left writes 0x14 (all play SFX 0x7A);
  Up/Down delegate to sub_8125820 after swapping in [r5+0x60] as the cursor field at [r5+0x26].'
interface: (r0 = context/r5 struct ptr, uses toolkit joypad via r10) -> r0 = clobbered; sets state byte
  [r5+2], plays SFX 0x7A, or exits menu
details: 'Reads pressed keys from the toolkit joypad struct. Start or B calls menu_confirmExitAndFade
  (submenu selection + sound + fade kind 0xC, 0x10 frames) and returns, i.e. leaves this mode. Pressed
  Right (0x10): if [r5+0x64] is zero it stores state 0x48 into byte [r5+2], otherwise 0x1c, then plays
  SFX 0x7A; pressed Left (0x20) stores state 0x14 and plays the same SFX — [r5+2] looks like a state-machine
  next-state byte. Otherwise, if halfword [r5+0x60] is nonzero, it saves [r5+0x26], temporarily copies
  [r5+0x60] into [r5+0x26], and calls sub_8125820(r0 = pressed&~0xC0 or held, r1 = 7, r2 = 0) — the 0x300
  held mask (Up/Down) selects which variant — then stores the joypad pointer at [r5+0x70] and restores
  [r5+0x26]; so +0x26 is the scroll/cursor field the helper operates on and +0x60 the scroll amount/target.'
