name: battle_checkTargetAheadInRow
address: '0x08108EBC'
kind: function
status: probable
summary: Returns 1 if the AI attack's target object stands one or two panels directly in front of the
  acting object in its facing row.
interface: (r5 = battle object ptr, r7 = AI attack vars with TargetObjectPtr) -> r0 = 1 if target is in
  the 1–2 tiles ahead on the same row, else 0
details: Calls object_getFrontDirection to get the +1/-1 facing multiplier for the acting object, then
  loads the target object pointer from the AI attack vars (offset oAIAttackVars_TargetObjectPtr). It reads
  the target's panel coordinates at offsets 0x12 (X) and 0x13 (Y) and the actor's oBattleObject_PanelX/PanelY.
  If the target's Y differs from the actor's Y it returns 0; otherwise it checks whether target X equals
  panelX+dir or panelX+2*dir, returning 1 in either case. This is the classic 'two tiles straight ahead'
  melee-attack hit test used by battle AI attacks.
