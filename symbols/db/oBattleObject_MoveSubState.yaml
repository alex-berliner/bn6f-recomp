name: oBattleObject_MoveSubState
address: '0xd'
kind: struct-field
status: probable
summary: Sub-state index used by the per-object move-step handlers (and a few other dispatcher tables)
  to select between their inner phases (typically 0, 4, and 8 — "wait / pick target / arrived").
details: ">\n  All observed uses are consistent with a small enum-style state index. Every store sets\
  \ it to one of three literals (0, 4, or 8), and every load feeds it directly into a tail-jump table\
  \ (`ldr r1, [r1,r0]` / `bx r1`) to pick one of three sub-handlers, mirroring the existing CurAction/CurState\
  \ dispatchers in this struct.\n  Specifically: the move-step handlers (battleObject_initMoveStep_80178D4\
  \ and friends) store #4 when they have just reserved a FuturePanel, store #8 when they finish arrival/cleanup,\
  \ and store #0 in the turn-end / damage handlers; the value is then read back by sub_80178B6 / sub_8017CC0\
  \ / sub_8017E26 / battleObjectStateDispatcher_8016CE8 to jump into the matching sub-routine. The \"\
  strb r1, [r0,#oBattleObject_Unk_0d]\" alongside `DirectionAngle = PanelX` and `Element = PanelY` in\
  \ spawn code is just initializing the new object with the source's panel Y as a default sub-state."
