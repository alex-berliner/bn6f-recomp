name: CutsceneCmd_wait_if_player_sprite_cur_frame_not_equal_maybe
address: '0x080377B6'
kind: function
status: confirmed
summary: Cutscene/map-script command that stalls the script until the player's overworld sprite reaches a given
  animation frame.
interface: bool f(u8 targetFrame in r4, script cursor in r7, script ctx in r5/r10) -> r0 = 1 when frame matches
  (r7 advanced past operand), r0 = 0 while still waiting; NZCV left reflecting the final compare/pointer update;
  r5-r7, lr preserved or updated as described
details: 'Entry point of one cutscene-script command handler (part of the interpreter''s command dispatch, hence
  the nonstandard lr return and r7 script-pointer side effects). It reads one byte from the current map script via
  ReadMapScriptByte (the desired animation frame), then calls getOWPlayerSpriteFrameParameters_809E434 to fetch
  the player overworld sprite''s current animation frame, and compares that against r4 (the frame value carried
  in from the caller / earlier in the command). If the frames match, it advances the script cursor r7 by 2 (skipping
  the command''s operand so the script resumes after this command), returns 1 in r0. If they differ, it returns
  0 in r0 without touching r7, so the interpreter keeps re-running this command until the sprite reaches the requested
  frame. The comparison flags from the cmp/pointer update are left live for the dispatcher. r6 is set to 1 before
  the script read (likely a ReadMapScriptByte argument, e.g. "read from current script position").

  '
