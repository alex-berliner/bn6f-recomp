name: battle_spawnTempAttackB11
address: '0x080FCF90'
kind: function
status: probable
summary: Thin battle wrapper that spawns the subtype-5 temp attack object with fixed parameter 0xb11.
interface: (r0 = source battle object / spawner context) -> r0 = pointer to the spawned attack object
  (from callee); r4 = 0xb11 passed through to the spawner
details: Saves r0 in r7, loads the constant 0xb11 into r4, then tail-calls spawn_t1_0x5_tempAttackObject_80B8E30,
  which creates a type-1/subtype-5 temp attack object linked to a related battle object, inheriting panel
  XY and alliance/direction and setting header flag 0x14. The original r0 is forwarded unchanged, so the
  caller's entity/context is what the new object is anchored to. The only thing this wrapper adds is the
  fixed value 0xb11 in r4, which the callee presumably consumes as an attack/effect/graphic id. No other
  work, no branch on results; r4 is dead after the call from this function's perspective. Callers clustered
  at 0x80FC2xx-0x80FCBxx on the battlesweep route all use it to fire this one specific spawn.
