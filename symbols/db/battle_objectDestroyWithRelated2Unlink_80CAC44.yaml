name: battle_objectDestroyWithRelated2Unlink_80CAC44
address: '0x080CAC44'
kind: function
status: confirmed
summary: Destroys a battle object after first clearing the back-pointer its second related object holds to it.
interface: 'battle_objectDestroyWithRelated2Unlink(object /* r5: BattleObject* to destroy */); clobbers r0-r3, flags
  via object_genericDestroy'
details: 'Entry point for destroying a battle object (r5). First loads the object''s

  RelatedObject2Ptr field; if that related object''s ObjectHeader field

  (offset 0 of a BattleObject) still points back at the object being

  destroyed, it is zeroed so the surviving object does not keep a dangling

  reference. Then tail-calls object_genericDestroy to free the object and

  whatever it owns. r5/r6/r7 are preserved (r5 is re-read from the stack

  frame by object_genericDestroy''s convention); r0-r3 and NZCV afterwards

  are whatever object_genericDestroy leaves behind.

  Distinct from the first related-object pointer: this routine only cleans

  up the second related-object link before destruction.

  '
