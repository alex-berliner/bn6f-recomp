name: sub_80F85D4
address: '0x080F85D4'
kind: function
status: hypothesis
summary: Thin wrapper that passes a hardcoded 4-entry flag table (dword_80F85E4 = "0x10181E26") to sub_800FE28 and
  returns its result.
interface: u32 sub_80F85D4(u32 r5 /* forwarded to sub_800FE28 */); returns r0 of sub_800FE28
details: 'Nothing but a trampoline: pushes lr, loads r0 with the address of the constant dword

  at dword_80F85E4 (0x10181E26), then tail-calls sub_800FE28 with r5 forwarded untouched

  from the caller. The dword reads as four bytes 26 1E 18 10, which looks like a small

  flag-ID list (descending) handed to the flag-table routine, with r5 likely being the

  flag-work pointer or a mode/selector. Whatever sub_800FE28 computes in r0 (and r2,

  which this wrapper drops) is returned in r0. r1/r2 and all flags are clobbered by the

  callee; no registers are preserved by this wrapper itself.

  Without the analysis of sub_800FE28 it is unknown whether this sets, clears, tests,

  or counts the listed flags.

  '
