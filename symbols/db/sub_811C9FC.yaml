summary: Dispatches to one of three object-state handlers based on a mode byte at [r5+8].
interface: void sub_811C9FC(u32 ctx) // r5 in; trashes r0-r4,r6-r12,flags; returns via tail bx
details: 'Reads the mode byte at [ctx + 8] (offset 0x8), uses it as an index into the

  jump table at off_811CA10 (entries at 0x0, 0x4, 0x8), loads a Thumb handler

  address (still tagged with the +1 Thumb bit from the original `sub_XXX+1`

  symbols), and tail-calls it via `bx r0`. The handler then returns directly

  to sub_811C9FC''s caller via the saved lr popped into pc, so this is a pure

  dispatcher with no return-value handling. The three known targets are

  install_object_state_handler_811CA1C, sub_811CA94, and sub_811CAE4. The

  mode byte is also passed to the handler in r1, matching the contract''s

  "inputs: nz r5 lr" / "outputs: r2 r3 r5 r10 r11" view where r5 is the

  object pointer preserved through the dispatch.

  '
