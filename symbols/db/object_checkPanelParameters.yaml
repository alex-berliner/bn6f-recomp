open_questions:
- Exact meaning of the individual panel flag bits (hole, broken, grass, etc.) depends on object_getPanelParameters's
  flag layout, which is not documented here.
- A zero flag word is treated as failure even though it could in principle be a real panel with no flags; whether
  that case is reachable in-game is unverified.
