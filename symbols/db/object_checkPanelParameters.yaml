name: object_checkPanelParameters
address: '0x0800CC86'
kind: function
status: confirmed
summary: Tests whether the panel at given coordinates matches a required flag state (all of one mask set, none of
  another) and returns 1/0.
interface: bool object_checkPanelParameters(int x /*r0*/, int y /*r1*/, u32 mustBeSet /*r2*/, u32 mustBeClear /*r3*/);
  returns r0 = 1 on success, 0 on failure; r4/r5 preserved; NZ set from the 0/1 result, C/V left from object_getPanelParameters
  or from the final cmp on the mustBeSet path
details: 'Wrapper over object_getPanelParameters, which returns the flag word for the panel at coordinates (r0,
  r1). Before that call the two mask arguments are shuffled into r4 (must-be-set) and r5 (must-be-clear) to match
  the callee''s register contract. Three checks fail to 0: (1) tst r0,r0 — the panel returns no flags at all (treated
  as "panel does not exist / empty panel"); (2) tst r0,r5 — the panel has at least one flag from the must-be-clear
  mask; (3) and r0,r4 + cmp r0,r4 — the panel is missing at least one flag from the must-be-set mask. On success
  returns 1. Because (flags & mask) <= mask, the final cmp sets carry exactly on the success exit of that path,
  so callers branching on carry can distinguish it from the earlier failure paths (which leave the callee''s flags
  untouched). r4 and r5 are saved and restored. This is the generic "is this tile usable / is a panel in the required
  state" predicate used by object/battle code when placing or validating things on the field grid.'
