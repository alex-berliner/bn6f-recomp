name: battle_transitionTick_8125170
address: '0x08125170'
kind: function
status: confirmed
summary: 'Drives one frame of a battle visual-transition sequence: runs six stage update routines, then
  bumps the transition phase byte to 8 while the screen fade is still active.'
interface: 'void sub_8125170(void); /* in: r5 = battle-object ptr; out: r0, r1-r3, r5, r7-r12 clobbered,
  lr; flags from IsScreenFadeActive path; preserves r5 across the body (used for [r5+1] store) */'
details: "Sequence: calls sub_812674C, sub_81267A8, sub_8125444, sub_8126114, sub_8126554, sub_81267F0\n\
  in order (each a stage/step of a battle intro or transition). Then queries IsScreenFadeActive:\n  -\
  \ fade inactive (beq locret_8125194): exit immediately, leaving battle_obj phase byte untouched.\n \
  \ - fade active: write 8 to battle_obj+1 (a 1-byte phase/state field on the battle object),\n    which\
  \ appears to advance the transition into its next stage (phase 8).\nPreserved register contract: r5\
  \ is the battle-object pointer kept live from the caller and\nused as the store base; r5, r6, r8, r9,\
  \ r12 are preserved. r1-r3, r7, r10, r11, lr are\ncaller-clobbered; r0 is the IsScreenFadeActive return\
  \ / MOV R0,#8 result.\n"
