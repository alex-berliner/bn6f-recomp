summary: Spawns a battle object of type 3 with a 5-word context taken from r0-r4, linking it into the battle object
  list on success.
interface: 'BattleObject* spawnBattleObjectType3WithCtx(u32 ctx0, u32 ctx1, u32 ctx2, u32 ctx3, u32 ctx4); // in:
  r0-r4=context words; out: r5=BattleObject* or NULL; clobbers r0-r3,LR,flags; preserves r4,r6,r7'
details: 'Stashes r0..r4 onto the stack as a context block, then calls SpawnBattleObjectCommon

  with type=3 (r0) and a stack pointer to that block (r1). The new object''s

  constructor presumably reads its arguments out of that block. If the spawn

  succeeds (r5 != NULL), UpdateBattleObjectLinkedList is called to insert the new

  BattleObject into the live list. Failure leaves the list untouched. Preserved

  registers r4/r6/r7 match the documented contract. Likely a thin specialization

  of the generic spawner used to emit a particular battle-object class (type 3)

  with an immediate inline context.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
