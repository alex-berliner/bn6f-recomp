status: probable
summary: 'Init handler of a forward-flying, slowly rising projectile: forward speed picked from the four-word
  table byte_80CADCC by Param1, ZVelocity +1.0/frame, then hands off to the standard update; no sound,
  no private updater.'
interface: 'void battleObject_initRisingShot(u32 r5 /* battle object */) : r5 -> [r5 r8 r10]'
details: 'Recomputes pixel coords from panels and stores 0xFF into oBattleObject_Z16 (halfword 0x3E).
  XVelocity = object_getEnemyDirection() * byte_80CADCC[oBattleObject_Param1] (Param1*4 index; words 0x5A000,
  0x6A000, 0x75000, 0x90000 = 5.6/6.6/7.3/9.0 px/frame in 16.16), ZVelocity = 0x10000 (1.0/frame, from
  dword_80CADDC). sprite_load(0x80, 8, 0xD) + sprite_hasShadow, ObjectFlags |= 2 (visible), CurAnim =
  CurAnimCopy = 0x17, sprite_setAnimation(0x17) + sprite_loadAnimationData, palette 0, flip per alliance.
  Allocates collision data (frees the object on failure), object_setupCollisionData(4,5,3), hit effect
  2, object_clearCollisionRegion, object_presentCollisionData once, CurState = CUR_STATE_UPDATE, return
  (no tail-called updater, no PlaySoundEffect).

  '
