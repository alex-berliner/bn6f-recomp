name: pet_setCurNaviStat1c
address: '0x081316A4'
kind: function
status: probable
summary: Sets byte 0x1C of the currently selected PET navi's stats block (203CCE0) to 1.
interface: () -> void; calls GetCurPETNavi then SetNaviStats203CCE0Byte(curNavi, 0x1C, 1)
details: Fetches the navi currently selected on the PET via GetCurPETNavi (which also leaves the game-state
  pointer in r3), then calls SetNaviStats203CCE0Byte with r1=0x1C and r2=1, writing the value 1 into field/entry
  0x1C of that navi's stats structure at 203CCE0. The function is a thin two-call wrapper with no other
  logic. What byte 0x1C semantically means (a flag, a counter, an unlock marker) is not shown by the code
  or the known callee summaries.
