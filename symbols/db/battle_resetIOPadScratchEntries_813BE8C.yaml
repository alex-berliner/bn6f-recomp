open_questions:
- The exact meaning of the halfword at +0 of each entry is unknown; the assembly only reads and tests
  it without storing. Whether the call is intended to clear it (and the clear happens implicitly because
  toolkit_getUnk2004190EntryPtr_813B9FC itself zeroes, or because the test always falls through) or just
  to walk the array validating emptiness would need either a closer look at the callee or a writes-observed
  snapshot to settle.
