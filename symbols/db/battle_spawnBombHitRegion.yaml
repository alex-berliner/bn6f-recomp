name: battle_spawnBombHitRegion
address: '0x080CEE38'
kind: function
status: probable
summary: Spawns a short-lived damage collision region on the bomb's current panel using the bomb's element
  and damage data.
interface: (r5 = bomb battle object) -> r0 = spawned collision region object or 0; sets its Timer to 5
details: 'Reads the bomb object''s PanelX, PanelY, Element and DamageAndStamina fields and calls object_spawnCollisionRegion
  with those, r3=0, literal 0xA050101 (likely packed hit flags/damage modifiers) and literal 3 (likely
  region type/shape). If a region object is returned, it writes Timer=5 so the hitbox lives only a few
  frames. This is the bomb''s landing impact hitbox: the caller battle_bombFlightPhase invokes it when
  the thrown bomb reaches its target panel, right before the panel crack and explosion effect. The trailing
  dword/byte tables after the function belong to adjacent bomb-type data, not this routine.'
