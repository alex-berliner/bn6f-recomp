name: CallBGScrollCallback1
address: '0x080019A0'
kind: function
status: confirmed
summary: Trampoline that invokes the first of the two BG-scroll callbacks stored in eBGScrollCallbacks (slot at
  offset 8).
interface: void CallBGScrollCallback1(void); /* r10 in, lr in; r8 r9 r10 r11 r12 out; nz c v + r0-r7 lr clobbered
  */
details: 'Loads the pointer at offset 8 of the eBGScrollCallbacks table (off_200A888 - 0x200a888 base, i.e. the
  Callback1 slot per oBGScrollCallbacks_Callback1 == 8) into r0 and tail-calls it via `bx r0`. Pure forwarder: pushes
  only lr and pops pc so the callback returns directly to CallBGScrollCallback1''s caller with no locals preserved.
  Executed in ARM mode (registers include the high regs r8-r12 and pushes only lr, not r14); targets an external
  function whose typed signature is unknown. The companion slot at offset 0 (Callback0) is loaded but unused here.'
