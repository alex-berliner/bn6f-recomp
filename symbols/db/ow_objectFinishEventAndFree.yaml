name: ow_objectFinishEventAndFree
address: '0x080A7F26'
kind: function
status: probable
summary: 'Ends an overworld map object''s event: clears state fields, sets the object''s event flag plus
  a related flag at 0x1650+id, then releases the object''s slot.'
interface: (r5 = map object struct with event id at +4; r7 = owner struct) -> r0 = freed; no meaningful
  flags
details: The routine first zeroes [r7,#4] (halfword) and [r7,#6] (byte), likely resetting counters/state
  in a caller-provided struct. It then reads the event id from the object's field +4, passes it through
  sub_81427A4 (whose return value is fed straight to SetEventFlag), and additionally sets flag 0x1650
  + id, suggesting a base flag region indexed by the object's event id. Finally it calls FreeOverworldMapObject
  with the same pointer, releasing the object from the global allocation bitfield and sprite system. This
  looks like the 'event completed, despawn NPC' path for overworld map objects; the mov r0,r0 pairs are
  interwork veneers.
