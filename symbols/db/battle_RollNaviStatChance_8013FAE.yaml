name: battle_RollNaviStatChance_8013FAE
address: '0x08013FAE'
kind: function
status: confirmed
summary: Rolls a d8 against a battle object's navi stat byte 0x11, returning 1 (success) if the roll is within the
  stat value.
interface: int battle_RollNaviStatChance(void *battleObj /* r4 */); -> r0 = 1 on success, 0 on fail; sets NZ/C/V
  from the final CMP (or from the stat==0 exit)
details: 'Reads stat id 0x11 from the battle object via GetBattleNaviStatsByte_AllianceFromBattleObject (r4 holds
  the object; the callee''s byte 0x11 is some chance/likelihood-type stat, e.g. luck or a custom-stat-derived percentage
  bucket). If the stat is 0 it returns failure immediately, reusing the callee''s R0 (0) and leaving flags as those
  of the `mov r4, r0` (NZ only). Otherwise it calls GetRNG, masks the result to 3 bits (roll = RNG & 7, i.e. 0-7),
  computes limit = stat-1, and returns 1 if roll <= limit else 0. With stat max 8 this is a straight stat-out-of-8
  probability check (stat/8 chance of success). Flags on the normal exit are the CMP(roll, limit) result; clobbers
  r0-r3 and lr, preserves r4 (and r6/r7 per contract, unused here).

  '
