summary: Stores the halfword from r0 into AIData+0x18 (Unk_18) of the AIData struct pointed to by r5.
interface: '(r0 = halfword value, r5 = AIData*) -> (none, void); side effect: *(AIData* r5 + 0x18) = r0
  as u16'
details: "Single-instruction helper: `strh r0, [r5,#0x18]` followed by `mov pc, lr`. Takes a halfword\
  \ value\n  in r0 and the address of an AIData struct (per the AIData.inc definition) in r5, then writes\n\
  \  r0 to the Unk_18 byte pair (only the lower 16 bits matter since strh). Returns no value to\n  callers.\
  \ The 17 caller functions live in 0x0808964C..0x08089C16, all of which are part of the\n  AI update\
  \ flow for battle objects (their `in` contracts all list `r5`, which by convention is\n  the AIData\
  \ pointer in this codebase — see AIData.inc and the battle AI caller pattern). The\n  variety of captured-call\
  \ r0 values (0x0a, 0x05, 0x1e, 0x00, 0x1e, 0x00) shows Unk_18 is used\n  as a small enum/state/flag\
  \ field rather than a numeric accumulator.\n"
