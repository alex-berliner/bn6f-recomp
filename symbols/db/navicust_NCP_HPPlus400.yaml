name: navicust_NCP_HPPlus400
address: '0x0813CBA4'
kind: function
status: confirmed
summary: Navicust program "HP+400" effect — adds 400 to the player's current max-HP bonus.
interface: void navicust_NCP_HPPlus400(r10 toolkit) — no return value; r10 input only, r0-r2 clobbered
details: Reads the toolkit pointer passed in r10, follows toolkit->Unk2004334_Ptr to a struct whose halfword at
  offset 0 holds the max-HP bonus, and adds 0x190 (400 HP) to it in place (ldrh/add/strh). This is the on-activate
  effect of the HP+400 NaviCust program; the same pointer presumably also carries other stat bonuses at other offsets.
  No flags are tested or preserved; condition codes are clobbered but callers per the contract ignore them.
