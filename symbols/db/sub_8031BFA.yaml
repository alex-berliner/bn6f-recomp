name: sub_8031BFA
address: '0x08031BFA'
kind: function
previous_names: []
status: hypothesis
summary: 'One step of an AI action: compute entity''s relative pos to target, run sub_8031570 with r2=0/r4=0x10/r3=0x10/r5=0,
  then test sub_8031B7C and return its result in r0.'
interface: '(r0 = ???, r5 preserved) -> r0 = 0 or 3 ; side effects: clobbers r2-r7, flags'
details: "Tail-call wrapper. push {lr}; bl battle_calcRelPosToTarget_803172E which leaves the\n  computed rel-pos\
  \ scratch buffer (still pointed to by r0). Sets r2=0, r4=0x10, r3=0x10, r5=0\n  and calls sub_8031570 (which the\
  \ contract shows takes r0/r2/r3/r4/r5). Then bl sub_8031B7C\n  (its contract says r0=1 -> returns byte 1 of [[dword_2013920]+0x14];\
  \ here r0 is not forced to 1,\n  so the call is run with whatever r0 sub_8031570 left, hence the captured-call\
  \ exit values 0 and\n  3 across the snapshots). pop {pc} tail-pops back to caller (lr was the entry lr). Return\
  \ value\n  for callers is r0 (the sub_8031B7C result) plus the caller's saved r5/lr. The captured-call\n  snapshots\
  \ (entry r0=02009f5c, r1=0x6ab2, r2=02029fc0, r3=8, lr=08031ad0) come from caller 0x08031ad0.\n  Inferred role\
  \ from callee contracts: a \"try/step\" hook for the AI battle driver that first\n  refreshes rel-pos bookkeeping\
  \ then probes a battle flag/state field and returns the verdict.\n"
