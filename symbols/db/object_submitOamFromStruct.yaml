name: object_submitOamFromStruct
address: '0x0812DA08'
kind: function
status: probable
summary: Parameterized helper that packs r0 into the low half of a word, sets the high half to a fixed
  0x20002 flag word, reads two halfwords from the caller-supplied object in r5 at the offsets given in
  r2 and r3, and calls object_computeAndQueueOamEntry_811FA98 with fixed extras (r4=7, r6=0xC24C, r7=0x64)
  to submit one OAM entry.
interface: (r0 = value A (16-bit), r1 = value B (16-bit), r2 = offset of field 1 in [r5], r3 = offset
  of field 2 in [r5]) -> r0 = result of object_computeAndQueueOamEntry; no meaningful flags
details: 'It stores r1-r3 on the stack, packs r0:r1 into one word via lsl #0x10 + orr (two 16-bit values,
  likely an x/y or packed position pair), then overwrites r1 with the constant 0x20002. It reads two halfwords
  from the object/base struct at r5 at the offsets supplied in r2 and r3, so the caller selects which
  struct fields supply the tile-id and sub-index. It then calls object_computeAndQueueOamEntry_811FA98
  with fixed extra arguments r4=7, r6=0xC24C and r7=0x64 (100). r5 is inherited from the caller (sub_812D9F0),
  not set here. Essentially a parameterized one-sprite OAM submit with the sprite''s graphics fields picked
  dynamically out of the active object''s data.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: lsl r0,#16 / orr r0,r1 packs the first two arguments into one word before the call; ldrh r2,[r5,r2]
    / ldrh r3,[r5,r3] fetch two halfword fields from the r5 struct at caller-chosen offsets; ldr r1,=0x20002
    with r4=7, r6=0xC24C, r7=0x64 are fixed constants passed straight to the callee; bl object_computeAndQueueOamEntry_811FA98,
    whose known summary is computing a packed (tile,attribute) OAM piece and queueing it; only caller
    is sub_812D9F0, which must set up r5 and the field offsets
  refs:
  - bn6f/asm/asm34.s:942
  - 0x0812D9F0 sub_812D9F0
  - 0x0811FA98 object_computeAndQueueOamEntry_811FA98
  reproduce: python3 tools/asmcat.py 0x0812DA08
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is mostly accurate: it packs two halfwords, sets r1=0x20002, reads two halfwords from
    [r5] at supplied offsets, and calls object_computeAndQueueOamEntry_811FA98 with r4=7, r6=0xC24C, r7=0x64
    (see lsl/orr at 0x0812DA14-0x0812DA1A, ldrh at 0x0812DA22/0x0812DA26, mov/ldr/mov at 0x0812DA28-0x0812DA30).
    However, the proposed name `sprite_queueOamEntryFromStruct` is misleading: the struct-field reads
    supply the base tile and sub-index for the inner OAM computation, but this is just a single-object
    sprite OAM submit helper, not a ''queue'' operation itself. A name like `object_submitOamFromStruct`
    better reflects that it is a parameterized front-end to object_computeAndQueueOamEntry and that the
    caller (sub_812D9F0) selects the object via r5. The summary''s mention of ''two 16-bit arguments''
    is also slightly off because only r0 is treated as a packed 16-bit value; r1 is just forwarded, then
    overwritten.; run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
