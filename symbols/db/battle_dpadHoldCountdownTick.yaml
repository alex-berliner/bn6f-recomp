- method: assembly-reading
  date: '2026-10-18'
  detail: bits 0x10/0x20/0x40/0x80 tested on a halfword are exactly the GBA d-pad key mask (asm tst sequence
    at 80E9F28-80E9F3A); oBattleObject_Timer2 counts to 0x1E (30 frames) to define a sampling window;
    oBattleObject_Timer is only decremented by 0x14 when ExtraVars+4 (held-frame count) >= 3, then both
    window counters reset at loc_80E9F5C
