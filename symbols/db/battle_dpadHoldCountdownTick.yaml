name: battle_dpadHoldCountdownTick
address: '0x080E9F1C'
kind: function
status: probable
summary: Per-frame update for a battle object that shortens its countdown timer faster while a d-pad direction
  is held.
interface: (r5 = battle object) -> void; no return value, no flag effects documented
details: Reads a halfword at +0x24 of the structure pointed to by ExtraVars+0x58 and tests it against
  0x40, 0x80, 0x20 and 0x10 — the GBA key bits for Up/Down/Left/Right, i.e. the d-pad. While any of those
  bits is set, it increments the counter at ExtraVars+4. Every frame it increments oBattleObject_Timer2;
  once Timer2 reaches 0x1E (30 frames), if the accumulated held-frame count is at least 3 it subtracts
  0x14 (20) from the countdown in oBattleObject_Timer (only while Timer > 0x14), then clears both Timer2
  and the held-frame counter. So each 30-frame window in which the d-pad was held at least 3 frames drains
  the countdown by 20 ticks; windows without holding just reset the counters.
