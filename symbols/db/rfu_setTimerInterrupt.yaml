name: rfu_setTimerInterrupt
address: '0x08149440'
kind: function
status: confirmed
summary: Thin wrapper that sets up the hardware timer the wireless adapter library uses for its interrupt, with
  the two arguments swapped before calling STWI_init_timer.
interface: void rfu_setTimerInterrupt(u32 argA /* -> becomes arg2 of STWI_init_timer, truncated to u8 */, u32 argB
  /* -> becomes arg1 of STWI_init_timer */)
details: 'Part of the RFU (wireless adapter) library glue. It pushes lr, swaps its two arguments (R1 ends up in
  R0), truncates the original R0 to 8 bits (lsl #0x18 / lsr #0x18) before moving it into R1, then tail-calls STWI_init_timer,
  the routine that programs the GBA hardware timer used by the wireless protocol layer. It is a pure passthrough
  otherwise: whatever STWI_init_timer leaves in R2-R5 is returned to the caller, R4/R5 are preserved by both sides,
  and the NZCV flags are clobbered and not meaningful. No game structures or memory are touched directly; all real
  work happens inside STWI_init_timer.

  '
