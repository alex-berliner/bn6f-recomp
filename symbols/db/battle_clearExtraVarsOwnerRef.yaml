name: battle_clearExtraVarsOwnerRef
address: '0x080D01FE'
kind: function
status: confirmed
summary: Detaches a battle object from its ExtraVars slot by blanking the slot's owner back-pointer if it still
  points at the object.
interface: void battle_clearExtraVarsOwnerRef(BattleObject* r5) // tailcalls via pop {pc}; clobbers r0, r1, NZCV
details: 'Reads the object''s oBattleObject_ExtraVars pointer (a slot in some per-battle pool). Each slot begins
  with a word holding the address of the BattleObject that owns it. If that owner word still equals r5, the slot
  is cleared to 0 so the slot becomes free/unowned; if another object has taken ownership (owner != r5), the slot
  is left untouched. Only the first word of the slot is cleared, not the whole slot. Uses r5 as the object pointer
  (a common convention in battle code where r5 holds the "current" battle object), so it is not a normal C callable.

  '
