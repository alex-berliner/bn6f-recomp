name: battle_clearExtraVarsOwnerRef
address: '0x080D01FE'
kind: function
status: probable
summary: Clears the owner back-reference in a battle object's ExtraVars block if it still points at this
  object.
interface: (r0 unused, r5 = battle object) -> r0 = 0 if cleared; flags from cmp
details: Loads the object's oBattleObject_ExtraVars pointer, then reads the first word of that referenced
  structure. If that word equals the battle object itself (r5), it is treated as a stale back-pointer
  to this object and is overwritten with 0; otherwise the structure is left untouched. The function returns
  0 in r0 in the clearing case and preserves the value otherwise. It is a small conditional cleanup step,
  almost certainly part of an object teardown/unregistration path called from sub_80D01BC.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r1, [r5,#oBattleObject_ExtraVars] then ldr r0,[r1] reads the first field of the extra-vars
    struct; cmp r0, r5 / bne skip: only acts when the struct''s first word is this same object; mov r0,#0
    / str r0,[r1]: zeroes that first word, i.e. removes the self-reference; single caller sub_80D01BC
    and no callees fit an inline cleanup helper in object teardown'
