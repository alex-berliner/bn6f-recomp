name: battleObject_runAIDispatcher_8109F7E
address: '0x08109F7E'
kind: function
previous_names:
- sub_8109F7E
status: probable
summary: 'Battle-object per-tick dispatcher: runs the object''s AI routine and, when action 8 ends, clears
  the AI extra-vars/Param4 state.'
interface: (r4 = toolkit, r5 = battle object, r10 = ?toolkit alias, lr = return) -> void (no r0..r3 returned
  to caller; callee-saves restored)
details: "- The function is a thin two-call shim. It first calls battleObject_initAndRunAI_8016B02, the\
  \ project's AI init/run dispatcher (its contract mirrors what the game's per-object AI tick does), then\
  \ calls battle_object_onAction8EndClearExtraVars_8109FA2 to release any extra-vars payload and zero\
  \ Param4.\n  - Both callees read the active battle object from r5 and the toolkit/BattleState plumbing\
  \ from r4/r10, matching the callees' contracts (`in=['r5','lr']` for the cleanup callee; `'r4','r5','r10','lr'`\
  \ for the AI callee).\n  - The body is just `push {lr}` / two `bl` / `pop {pc}`, so there is no local\
  \ state, no stack frame, and no register preservation besides lr. The contract's listed `out` registers\
  \ (r1, r5) are simply whatever the second callee leaves behind when it tail-pops into the return; callers\
  \ do not consume them as semantic returns (no callers section was provided, suggesting these are inline-style\
  \ call sites rather than call-by-value APIs).\n  - Captured-call signatures (r0=`08109f7f` on entry\
  \ — i.e. caller's PC + 0x1 — with r1=0x10, r2=0xff, r3=`02038598`, return r0=4) reflect the live AI\
  \ state the dispatcher is configuring on this battle object; the `out=r0=4` is produced by the AI/init\
  \ callee, not by this function.\n  - Action 8 in Mega Man Battle Network is the \"move/dodge\" AI slot;\
  \ ending it cleanly implies the \"AI in progress\" cleanup path, which is why the cleanup callee wipes\
  \ Param4 (the action slot) and the extra-vars reference.\n"
