name: sub_800825A
address: '0x0800825A'
kind: function
status: confirmed
summary: Per-frame update of the post-battle wait state that performs end-of-fight bookkeeping on the first call,
  then ticks a countdown and hands control to the next state once the link layer releases and the timer expires.
interface: void sub_800825A(u32 r3, u32 r5 controller, u32 r6, u32 r7, u32 r10 toolkit, u32 lr) -> u32 r2-r12; flags
  clobbered
details: "Controller block pointed to by r5 with fields:\n  +0x3 oEndCtrl_Step (u8) - 0 until the one-time wrap-up\
  \ has run, then set to 4\n  +0x4 oEndCtrl_Next (u8) - handover state, written to 2 when the wait ends\n  +0x8\
  \ oEndCtrl_Timer (s16) - frames left in the wait; initial value chosen\n    here, decremented every call, tested\
  \ as signed\nToolkit pointed to by r10 holds the BattleState and GameState pointers used\nhere. On the first call\
  \ (Step == 0):\n  - dispatches then clears event-flag batch 0xE4C53 (END_OF_BATTLE_FLAGS)\n  - XORs BattleState+0x0D\
  \ with 1 and stores at BattleState+0x10\n    (records the win/lose outcome flip)\n  - if GetBattleEffects() bit\
  \ 3 is set, plays SONG_LOSER\n  - sets Timer to 0x5E frames if GetBattleEffects() bit 1 is set, else 0x66\n  -\
  \ reads battle_getPhaseMode_800A152; calls sub_800A8B2 with it; if the\n    phase mode is 7, the link message\
  \ is forced to 0x18 before passing it\n    to sub_801E792\n  - writes 4 to oEndCtrl_Step so the wrap-up only runs\
  \ once\nEvery call then decrements the s16 timer. The wait ends only when\ncomm_checkCrossNetBattleReady_801E754\
  \ returns 0 (link has released) AND\nthe signed timer is <= 0; on that branch it sets controller+0x4 = 2,\nGameState+0x14\
  \ = 2, and calls eStruct200A008_setUnk02(1). The function\nreturns the caller's r4 unchanged (the verified C reuses\
  \ it as preserved).\nr4, r5, r6, r7 are preserved by the callee; everything else is clobbered.\n"
