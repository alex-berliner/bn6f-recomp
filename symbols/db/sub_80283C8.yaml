name: sub_80283C8
address: '0x080283C8'
kind: function
status: confirmed
summary: Sets the OBPalette index on each of the ten active-chip icon sprites on the custom-screen based on the
  slot's chip kind.
interface: void recolorActiveChipIcons_80283C8(void); // returns in r0/r1/r2 various leftovers (see details); clobbers
  r6,r7; preserves r4,r5; returns via lr
details: "Iterates the ten active-chip slot records returned by getLocOfActiveChips_8027E1C (stride 0xC).\nFor each\
  \ slot reads the kind byte at offset 0:\n\n  - kinds 1, 2, 3: leave the icon's palette alone (continue).\n  -\
  \ kind 0xA: use the standard palette (0xB000).\n  - kinds 0, 6, 7: read flag byte at offset 7; if 1 use alternate\
  \ palette (0xC000), else standard (0xB000).\n  - any other kind: use a third palette (0x9000).\n\nWrites the chosen\
  \ palette into the top six bits of four OBJ attribute halfwords per icon\n(offsets 0x00, 0x02, 0x1E, 0x20), keeping\
  \ the low ten bits (mask 0x3FF). The icon OAM\naddresses come from off_802843C (one dword per slot, ten slots\
  \ -> 0x2035188..0x2035198).\n\nQuirks / register leftovers (callers can read these):\n  - r0 holds the last value\
  \ stored into an attribute halfword; for slots that were skipped\n    it ends as that slot's kind byte instead.\n\
  \  - r1 holds 0x3FF once any icon is recolored, otherwise it is whatever r1\n    getLocOfActiveChips_8027E1C left\
  \ behind.\n  - r2 holds the palette applied to the last-recolored slot, or 0 if the final slot was\n    skipped.\n\
  \nPalette table lives at byte_8028470 (byte_8028470..byte_8028475); mask constant is the\ndword_8028464 literal\
  \ 0x3FF. Slots are iterated 0..9 (comparison is 0xA).\n"
