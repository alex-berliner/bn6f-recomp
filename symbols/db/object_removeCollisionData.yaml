name: object_removeCollisionData
address: '0x0801A00E'
kind: function
status: confirmed
summary: THUMB trampoline that tail-invokes the ARM helper _object_removeCollisionData to tear down an object's
  collision data.
interface: void object_removeCollisionData(void) — arguments passed implicitly in r4-r7 and r10; returns results
  in r1-r3 and the nzcv flags; r4-r7 preserved, r0/r1-r3/lr clobbered
details: 'This routine is a bare trampoline: it pushes r4-r7 and lr, loads the address of the ARM routine _object_removeCollisionData
  from the literal pool at off_801A0C8 (= _object_removeCollisionData+1, i.e. a THUMB/ARM interwork address with
  the LSB set for BX), performs a long blx-equivalent via "mov lr, pc; bx r0", and pops straight back to the caller
  with "pop {r4-r7,pc}". It contains no logic of its own — the actual collision-data removal lives in the ARM helper,
  which reads its arguments from the caller''s r4-r7 (and r10) registers rather than from the standard ABI argument
  registers. The push/pop here exists only so the helper can clobber r4-r7 internally without breaking the THUMB
  caller''s frame; the register contract shows r4-r7 emerging unchanged and the real outputs (r1-r3 plus condition
  flags) coming from the helper. Any game-level description of what "removing collision data" means for a battle/object
  entity must be verified against _object_removeCollisionData itself.

  '
