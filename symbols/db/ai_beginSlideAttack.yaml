- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_81041CC: behavior branches on whether the object may act; mov r0,
    #OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1: marks the object as sliding; strb r0(0x43), [r5, #oBattleObject_CurAnim]:
    plays the slide animation; strh #3 [r7, #oAIAttackVars_StepTimer] and #4 [r7, #oAIAttackVars_HitElement]:
    sets step timing and hit element for the attack; failure path: clears oAIAttackVars_HasMoved and bl
    object_exitAttackState_801171C, i.e. cancels the attack'
