name: ai_beginSlideAttack
address: '0x081041B0'
kind: function
status: probable
summary: 'AI attack step that starts a slide: sets the cannot-slide flag, plays anim 0x43 and timers,
  or cancels the attack if the object can''t move'
interface: () -> void; reads current object context in r5/r7 (no args), no return value
details: This is one step of an AI attack routine operating on the implicit battle object. If object_canMove
  reports the object is free to act, it ORs OBJECT_FLAGS_CANNOT_SLIDE into the object's flags (marking
  it as sliding/locked from sliding normally), sets oBattleObject_CurAnim to 0x43 (slide animation), sets
  oAIAttackVars_StepTimer to 3 and oAIAttackVars_HitElement to 4, and returns. If the object cannot move,
  it clears oAIAttackVars_HasMoved and calls object_exitAttackState_801171C to tear down the attack instead.
