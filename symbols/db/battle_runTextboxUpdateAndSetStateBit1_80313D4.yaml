name: battle_runTextboxUpdateAndSetStateBit1_80313D4
address: '0x080313D4'
kind: function
status: confirmed
summary: Runs the standard battle text-box update sequence (init, fill/clear with fixed parameters, redraw pass)
  and then marks bit 1 of the r12 battle-state flag word as done.
interface: void sub_80313D4(u32 arg0 /*r0*/, u32 arg1 /*r1*/, u32 arg2 /*r2*/, u32 state /*r5*/, u32 flags /*r12*/);
  // preserves r0-r2, r5; clobbers r3,r4,r6-r9,r12,lr; flags out NZ from "flags |= 2" (CV from callee chains)
details: 'Saves r0-r2, r5 and lr on the stack so the caller''s arguments and the r5 state pointer survive the whole
  sequence. Calls sub_8031136 first with r0-r1 as passed in (this callee also reads the r12 flag word, so r12 must
  be live on entry). Then calls sub_8030F04 with a fixed fill/clear-style parameter set: r2=0x20 (32, likely a row/column
  count or buffer size), r3=0, r4=-1, r5=-1, r6=1. Third, calls sub_80310B0 with r0=0; its results left in r3/r4/r6
  remain live for the caller. Finally ORRs bit 1 (0x2) into the r12 flag word, which also sets NZ flags for the
  caller, then restores r0-r2/r5 and returns. The r12 word acts as a step/phase tracker for the battle text box:
  this routine is the "do the full textbox refresh this frame and record that step 1 (bit 1) is complete" helper.
  Note r5 is pushed/popped purely because sub_8030F04 is given r5=-1 as a parameter, so the caller''s value must
  be restored.'
