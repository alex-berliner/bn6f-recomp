name: object_stepMoveX
address: '0x080DD4E8'
kind: function
status: probable
summary: 'Per-frame horizontal movement step for a battle object: advances X by its velocity, resyncs
  panel/collision data, and detects arrival at the target X to trigger the next action state.'
interface: (r5 = battle object) -> void; sets object fields on arrival
details: Reads oBattleObject_XVelocity and adds it to oBattleObject_X, bracketed by calls to sub_80DD6F4
  and sub_80DD738 (likely target/velocity setup and update). It then calls object_setPanelsFromCoordinates
  and object_updateCollisionPanels to sync the object's panel position and facing. It converts the object's
  PanelX/PanelY to pixel coordinates via object_getCoordinatesForPanels and uses IsR2BetweenR0AndR1 to
  test whether that pixel x lies between the new X and X - XVelocity, i.e. whether the object crossed/reached
  its destination this step. On arrival, if oBattleObject_Param4 is nonzero, it stores Param4 into oBattleObject_Timer,
  sets oBattleObject_CurAction = 8 and zeroes CurPhaseAndPhaseInitialized, switching to a timed next action.
  Otherwise it falls through to sub_80DD5C8 and sub_80DD5E2, presumably to continue the move animation
  or advance intermediate step logic.
