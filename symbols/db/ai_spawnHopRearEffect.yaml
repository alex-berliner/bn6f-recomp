name: ai_spawnHopRearEffect
address: '0x08115446'
kind: function
status: confirmed
summary: Spawns an effect object (kind 1) one hop-step behind an actor, offset backward by 14 fixed-point units
  from its facing direction.
interface: void ai_spawnHopRearEffect(actor in r5); out r1, r5, r7 as left by the effect spawner (clobbers r0-r3,
  lr, flags; preserves r4)
details: 'r5 is an actor/object whose position triple lives at object+0x34 (x at +0x34,

  y at +0x38, third field, likely elevation/height, at +0x3C). Calls

  object_getFrontDirection(actor) to get the facing sign (+1/-1), computes

  (14 << 16) * facing as a fixed-point step, subtracts it from the actor''s x so

  the effect appears one tile-step *behind* the actor, and passes the adjusted

  (x, y, extra) triple to spawn_t1_0x0_EffectObject with kind = 1 in r4 — a

  hop/dust-type rear effect used by AI actors. The third position field is also

  bumped before spawning (per the verified C, += 0x80000, though the literal pool

  annotation for byte_81154E8 reads 0x0 — see open questions). The caller-visible

  r1/r5/r7 outputs are simply whatever spawn_t1_0x0_EffectObject leaves behind;

  the wrapper around r4 exists only to keep it preserved across the calls.

  Naming/behavior suggest a hop or rear-hop attack/motion accompanying effect.

  '
