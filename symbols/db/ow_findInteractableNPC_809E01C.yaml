name: ow_findInteractableNPC_809E01C
address: '0x0809E01C'
kind: function
status: confirmed
summary: Scans the overworld NPC object array for the first live NPC whose interaction isn't disabled and records
  it in the player object's interacted-NPC slot.
interface: 'int ow_findInteractableNPC(OWPlayerObject *player /* r5 */); returns r0: 0 = NPC found and stored, nonzero
  = no interactable NPC (1 = no live NPC found, or the disabled NPC''s UnkFlags_60 word when the first live NPC
  has interaction disabled)'
details: 'Iterates over eOverworldNPCObjects (array base in r7, end = base + 0xD80 bytes,

  stepping by oOverworldNPCObject_Size per entry). For each entry it checks

  oOverworldNPCObject_Unk_50 bit 0 ("slot in use"/live); if clear, it moves to the

  next entry. On the first live entry it checks oOverworldNPCObject_UnkFlags_60

  bit 0 (OW_NPC_UNK_FLAGS_60_DISABLE_INTERACTION): if clear, the NPC pointer is

  stored into the player object (r5) field oOWPlayerObject_interactedNPCObject_58

  and r0 = 0 is returned; if set, it returns immediately with r0 = that NPC''s

  flags word and stores nothing.

  Quirk: the loop does not continue past a live NPC with interaction disabled —

  the first live NPC in the array wins, so a disabled NPC earlier in the array

  blocks interaction with any later NPC until it becomes non-live.

  Always sets r1 = 1 and r2 = one-past-end of the NPC array on exit; r7 ends up

  pointing at the entry where the loop stopped (the found/disabled NPC, or the

  array end). Flags C and V are set by the final CMP (and V possibly by the ADD

  computing the array end); N/Z reflect the last CMP or the flags test.

  '
