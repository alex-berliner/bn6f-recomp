name: object_findMatchingPanelRunEnd
address: '0x080E5386'
kind: function
status: probable
summary: Finds the far edge of a contiguous run of same-status panels starting from the nearest panel
  matching a side-dependent filter, returning its coordinates.
interface: (r5 = battle object) -> r0 = x column, r1 = y row of last matching panel; r0 = 0 if no panel
  qualifies or it has flag 0x800000
details: Indexes byte_80E5400 with ((Alliance ^ DirectionFlip) ^ 1)*8 to pick an 8-byte filter (0x20 in
  word0 for one side, word1 for the other) and calls object_getClosestPanelMatchingRowFiltered, getting
  candidate panel x,y. If object_getPanelParameters at that spot has bit 0x800000 set (likely hole/invalid
  panel) it returns 0. Otherwise it steps x by the object's Param1 in the direction from object_getFlipDirection,
  looping while the panel keeps the same 0x20 status bit, lacks 0x800000, and stays in the 1..6 column
  range; it backs off one step and returns the coordinates of the last panel that still matched. With
  Param1 = 0 it just returns the initially found panel. This looks like targeting/movement logic that
  measures how far a panel condition extends from an object.
