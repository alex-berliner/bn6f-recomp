name: battle_initEntry_8007A0C
address: '0x08007A0C'
kind: function
status: confirmed
summary: 'Initializes a new battle: clears hit data, resets object/panel lists, sets up sprite decomp
  state, then advances the battle state phase index to 4.'
interface: void sub_8007A0C(struct BattleState *r5); // clobbers nz c v r0 r1 r2 r3 r5 r6 r7 r8 r9 r10
  r12 lr
details: 'Called via the battle main dispatcher with r5 pointing at the current BattleState struct. Resets
  all collision hit boxes (collision_resetAllHitData_801986C), clears the object linked lists (clearBattleObjectLinkedLists_800318C),
  runs panel_800BFC4, then initializes the uncomp-screen sprite state at offset eLogoScreenState. Reads
  the battle-effects flags word via GetBattleEffects and, unless bit 3 (0x8) is set, dereferences BattleState->oBattleState_BattleSettings
  (struct pointer at +0xC inside the settings blob) to feed decompSprites_80029A8. Always clears the enemy
  fade-in list (battle_clearEnemyFadeinList), then writes the literal value 4 into BattleState->oBattleState_Index_00
  so the battle main loop dispatches battle_update_8007A44 on its next tick. Touches fields oBattleState_BattleSettings
  and oBattleState_Index_00 on the BattleState struct.

  '
