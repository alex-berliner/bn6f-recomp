name: applyChipAllianceEffect_8013AE4
address: '0x08013AE4'
kind: function
status: confirmed
summary: Applies an alliance-style chip stat bonus (stat 0x18 or 0x19) read from the battle object's collision data,
  capped at 7.
interface: void applyChipAllianceEffect_8013AE4(struct BattleObject* r5_battleObject)
details: 'Reads `oBattleObject_CollisionDataPtr` from the passed battle object (r5). Treats the

  pointed-to collision data as a small record where offset 0xA4 is a stat id and offset

  0xA5 is a bonus amount. If the stat id is 0, the function returns immediately doing

  nothing (collision with no stat payload). Only stat ids 0x18 and 0x19 are handled;

  they are passed through GetBattleNaviStatsByte_AllianceFromBattleObject to fetch the

  current allied-navi''s byte for that stat, the bonus amount from 0xA5 is added, and

  the total is clamped to a maximum of 7 (signed > 7 test). Then, only if the stat id

  is < 0x64, SetBattleNaviStatsByte_AllianceFromBattleObject is called to write back

  statId and newValue. The unrelated guard `cmp r1, #0x64` is effectively always true

  for the two accepted ids. Uses 8 bytes of stack space for the local copies of statId

  and amount.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
