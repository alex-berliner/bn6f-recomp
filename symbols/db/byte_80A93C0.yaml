summary: 'Brightness ramp of the Mr. Weather comp map object type 0x1B''s fade: 4, 6, ..., 0x1E, 0x1F, then 0xFF
  (end); sub_80A937C applies entry [r5+0x24] >> 1 as a grey color shader.'
details: '16 bytes at asm29.s:8459-8461: 0x04, 0x06, 0x08, 0x0A, 0x0C, 0x0E, 0x10, 0x12, 0x14, 0x16, 0x18, 0x1A,
  0x1C,

  0x1E, 0x1F, 0xFF. Its only reader is sub_80A937C (through the literal off_80A93BC, asm29.s:8457), which each

  frame takes entry [r5+0x24] >> 1 (so each value lasts two frames, 30 frames for the 15 values), passes

  v | v << 5 | v << 10 (the same 5-bit level in red, green and blue) to sprite_setColorShader, and increments

  [r5+0x24]; at the 0xFF entry it sets state +8 = 0xC, calls sub_80A93D0 and sets EVENT_BE7 instead of the

  shader (the counter still increments).

  sub_80A937C runs from sub_80A9360, the state-8 handler of map object type 0x1B (sub_80A92B8), which its state-4

  handler sub_80A931C enters when EVENT_BE6 is set (owMapObject_weatherTornado_checkHitPlayer_80A91A4 sets it when

  a tornado reaches MegaMan while EVENT_BE4 is set). vidsync''s BN6F_SYMBOLS.md

  lists this as the white fade of type 0x1B (the rainbow orbs, "probably") and notes a white fade seen in both

  the run and the video at game 432736; which object''s fade that was was not checked, and vidsync never reads

  or writes the table.

  '
