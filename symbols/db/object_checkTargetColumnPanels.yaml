name: object_checkTargetColumnPanels
address: '0x080F3704'
kind: function
status: probable
summary: Returns 1 if any of a table-chosen panel, its two vertical neighbours, or the panel one step
  in front matches the caller's panel-flag masks, else 0.
interface: (r0=?) r5=object (field 0x16 = table index), r2=required panel mask, r3=forbidden panel mask
  -> r0 = 1 if any checked panel matches, 0 if none; flags clobbered
details: 'Reads byte [r5+0x16], doubles it, and fetches a (x,y) coordinate pair from table dword_80F3780
  (bytes 01 02 06 20, likely more entries follow). It then calls object_checkPanelParameters four times:
  at (x,y), (x,y-1), (x,y+1), and (x+object_getFrontDirection(), y), passing the caller''s r2/r3 masks
  through unchanged each time. On the first successful check it exits with that nonzero result in r0;
  if all four fail it sets r0=0. The shape checked is a 3-tall vertical column at the table''s x plus
  one extra panel toward the object''s facing side. The coordinate source being a data table indexed by
  an object field suggests per-state/per-attack target positions, but the object structure and full table
  are unknown.'
