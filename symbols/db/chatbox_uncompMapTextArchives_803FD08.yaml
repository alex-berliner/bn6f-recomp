name: chatbox_uncompMapTextArchives_803FD08
address: '0x0803FD08'
kind: function
status: confirmed
summary: LZ77-decompresses the current map's three chatbox text archives (dialogue text, text scripts) into their
  fixed RAM work buffers, then returns 0.
interface: void chatbox_uncompMapTextArchives_803FD08(void); /* returns 0 in r0; r4-r7 preserved (pushed/popped);
  clobbers r0-r3, lr, flags */
details: 'Loads the map-specific compressed chatbox data by calling three selectors and uncompresses

  each with the BIOS LZ77 routine (SWI_LZ77UnCompReadNormalWrite8bit):

  1. chatbox_selectCompTextByMap_8040730 with arg 0 -> eDecompressedTextArchive202DA00

  2. chatbox_selectCompTextByMap_8040794 (no args) -> DecompressionBuf2033400

  3. chatbox_selectCompTextByMap_80407C8 (no args) -> eDecompressedTextArchive202FA00

  The three selectors presumably pick the compressed archive matching the current map from a

  table. The destination buffers are fixed addresses (~0x202DA00, 0x2033400, 0x202FA00) in

  EWRAM, so subsequent chatbox/text-script code reads the decompressed data from those

  locations. Always returns 0 in r0. No inputs are actually read; the register contract''s

  r4-r7 "inputs" are just callee-saved registers it pushes and preserves.

  '
