name: battle_phaseAppear
address: '0x080CC36C'
kind: function
status: confirmed
summary: Phase handler for a battle object's entrance/appear animation on the battlefield grid; initializes position
  and Z-order on first call, then ticks a 30-frame appear timer counting down.
interface: void battle_phaseAppear(u32 r5 /* BattleObject* */); /* in r5, out r1 (pass-through or sprite_noShadow
  result) */
details: 'Called repeatedly as the current phase for a battle object (r5) whose PhaseInitialized field is 4 (PHASE_APPEAR_INIT).
  On the first invocation (PhaseInitialized == 0): writes 4 to PhaseInitialized; latches FuturePanelX/Y into PanelX/Y
  then calls object_setCoordinatesFromPanels to convert grid coords to pixel coords; sets Z16 to 0x28 (a fixed appear
  draw-order); calls object_updateCollisionPanels; starts CurAnim = 3 (the appear/idle-entrance animation); calls
  sprite_noShadow to suppress the object''s ground shadow; sets Timer = 0x1E (30 frames). On each subsequent call:
  decrements Timer by 1; when Timer == 0x19 (25, i.e. 5 frames elapsed) zeroes CurAnim (appear animation ends, sprite
  freezes); when Timer goes negative (underflow past 0, 30 total frames elapsed) clears CurAction to 0 and zeroes
  the combined CurPhaseAndPhaseInitialized word, ending the appear phase. Clobbers r0-r3, lr, and all condition
  flags; preserves r4, r6; outputs r1.'
