name: endSlipRunState_809DE30
address: '0x0809DE30'
kind: function
status: confirmed
summary: 'If the EVENT_1716 gate is active, finalize the player''s slip-run: optionally mark EVENT_173F,
  then clear the in-slip-run flag and EVENT_173E.'
interface: void endSlipRunState_809DE30(void);
details: "Operates exclusively on event flags in page 0x17:\n  - 0x1716: gate flag; routine returns immediately\
  \ if this is clear.\n  - 0x173D: \"in slip-run\" state flag.\n  - 0x173F: transition/event flag set\
  \ on slip-run exit when 0x173D was set.\n  - 0x173E: companion flag that is unconditionally cleared\
  \ on exit.\nFlow:\n  1. Test 0x1716; bail out (locret_809DE5E) if it is clear.\n  2. Test 0x173D; if\
  \ set, set 0x173F (loc_809DE4E branch).\n  3. Clear 0x173D, then clear 0x173E.\nAll flag manipulation\
  \ goes through TestEventFlagFromImmediate,\nSetEventFlagFromImmediate, and ClearEventFlagFromImmediate\
  \ with\npage in R0 and byte in R1 (event-flag API convention).\nRegister contract: only LR is preserved\
  \ across the call; the\nflag/result registers are left by whichever event-flag helper\nran last on each\
  \ return path (a return-via-pop {pc} is used).\n"
