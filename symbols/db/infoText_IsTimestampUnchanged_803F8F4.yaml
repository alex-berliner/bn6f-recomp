name: infoText_IsTimestampUnchanged_803F8F4
address: '0x0803F8F4'
kind: function
status: confirmed
summary: Compares a 20-byte timestamp stored in the save buffer against the master info-text timestamp, returning
  0 when the on-screen info text is still current and 1 when it must be refreshed.
interface: bool infoText_IsTimestampUnchanged(void); /* r0 = 0 if all 20 bytes match, r0 = 1 if any differ; nz reflects
  r0; preserves r1-r7 */
details: 'Reads the S2001c04 struct pointer from the toolkit (R10 + oToolkit_S2001c04_Ptr), points at offset 0x6C,
  and walks bytes 0x13 down to 0 comparing them one by one with the reference buffer EXE6_InfoText_timestamp. The
  first mismatch exits early with r0 = 1 (text stale); if all 20 bytes match it returns r0 = 0 (text unchanged).
  The comparison result is also left in the nz flags for callers that branch on it. This is a change-detection helper
  for whatever info/text data lives at save+0x6C: the timestamp tells the game whether the copy the player sees
  is still up to date or needs to be reloaded/regenerated.'
