name: ReadMapScriptHalfword
address: '0x080360A8'
kind: function
status: confirmed
summary: Map script interpreter helper that reads a little-endian 16-bit operand at (script pointer + offset) into
  r4, also exposing the low byte in r6.
interface: int mapScript_ReadHalfword(u8 *script /* r7 */, u32 offset /* r6 */) -> r4 = halfword value, r6 = low
  byte; r7 preserved
details: 'Helper for the map/route script interpreter. Callers supply the script data pointer in r7 and an

  offset/index in r6; the routine computes r7+r6 and loads two bytes, combining them little-endian:

  r4 = (byte[addr+1] << 8) | byte[addr]. It deliberately leaves the low byte in r6, so callers can

  read the value and still have the raw low operand available (likely for opcode dispatch or for

  distinguishing one-byte vs two-byte operands). r7 is preserved via the push/pop (it is reloaded,

  not recomputed), r4 is the return value register, and r6 is overwritten with the low byte. Flags

  are clobbered by the lsl/orr. No memory writes, no other structures touched. The "Next" pseudo

  return in the C version indicates the interpreter tail-calls back into the dispatch loop after

  this helper.

  '
