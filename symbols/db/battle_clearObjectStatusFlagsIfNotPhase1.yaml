name: battle_clearObjectStatusFlagsIfNotPhase1
address: '0x0801472A'
kind: function
status: probable
summary: Battle helper that, unless the current battle phase is 1, calls battle_clearObjectStatusFlagsAndTimers_801A264
  (which clears both status flag words and the status timers of a battle object).
interface: (r0 = battle object ptr, passed through from caller) -> no return value used; calls battle_clearObjectStatusFlagsAndTimers_801A264
  when oBattleState_BattlePhase != 1
details: 'Loads the toolkit from r10, follows oToolkit_BattleStatePtr to the battle state, and reads oBattleState_BattlePhase.
  If the phase equals 1 it returns immediately; otherwise it falls through into battle_clearObjectStatusFlagsAndTimers_801A264,
  which wipes both status flag words and all status timers (blind, etc.) of an object. Quirk: the mov
  r0, r10 overwrites the incoming r0 before the call, so either the clear routine reads the target from
  another register/argument convention, or this stub is called at a point where the object pointer is
  no longer needed (e.g., the clear routine defaults to a fixed object). No callers are known, so the
  intended target object cannot be confirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0,[r0,#oToolkit_BattleStatePtr]; ldrb r0,[r0,#oBattleState_BattlePhase] — reads the battle
    phase from the battle state; cmp r0,#1; beq locret_801473A — does nothing while phase == 1; bl battle_clearObjectStatusFlagsAndTimers_801A264
    — sole action is the known status-flag/timer clear; push {lr}/pop {pc} with no other side effects
    — a thin conditional wrapper around the clear routine
  refs:
  - bn6f/asm/asm00_2.s:13327
  - 0x0801A264 battle_clearObjectStatusFlagsAndTimers_801A264
  reproduce: python3 tools/asmcat.py 0x0801472A
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The body matches: it reads oToolkit_BattleStatePtr, checks oBattleState_BattlePhase, and falls into
    battle_clearObjectStatusFlagsAndTimers_801A264 when not 1. However, the asm never loads an object
    into r0 from r1 or similar — it only overwrites r0 with r10 and the callee is the same routine in
    the callee list. This suggests the function is not a generic ''clearStatusFlagsOutsidePhase1'' over
    an object pointer; it''s a battle-state-only guard that always feeds the same toolkit-derived argument
    into the clear routine. The summary overstates the per-object nature.; run wf investigate investigate-20261019-015108;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- No callers known, so which object gets cleared and when in the battle loop this runs is unconfirmed
- The incoming r0 is clobbered by mov r0, r10 before the call — the callee's actual argument register/convention
  needs checking
- What battle phase 1 represents (e.g., command select vs. action execution) and why clearing is skipped
  there
- 'The body matches: it reads oToolkit_BattleStatePtr, checks oBattleState_BattlePhase, and falls into
  battle_clearObjectStatusFlagsAndTimers_801A264 when not 1. However, the asm never loads an object into
  r0 from r1 or similar — it only overwrites r0 with r10 and the callee is the same routine in the callee
  list. This suggests the function is not a generic ''clearStatusFlagsOutsidePhase1'' over an object pointer;
  it''s a battle-state-only guard that always feeds the same toolkit-derived argument into the clear routine.
  The summary overstates the per-object nature.'
