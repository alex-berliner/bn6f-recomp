open_questions:
- exact meaning of ObjectFlags2 bits 0x8000 and 0x300000, and what sub_800F8CE/sub_800F90E return/decide
- whether this is bomb-specific or shared by other explosive chip objects
- The proposal states 'Regardless of branch it then dispatches the destroy sub-events' but the code at loc_80CD1DC
  shows that if sub_800F8CE returns 0, execution jumps to locret_80CD234 which pops and returns WITHOUT any destruction
  (no battle_dispatchDestroyEvents, no unlist, no panel release, no CUR_STATE_DESTROY). The spawn call in the sub_800F8CE
  path passes r4=0x14 (after the 0xC<<16 z-offset adjustment), not r4=0xC as the proposal claims. The 0x8000-clear
  → SOUND_HIT_BOMB_1 + spawn path and the destroy sequence (clearEntry, sub_80E544C, object_clearCollisionRegion,
  object_removePanelReserve, bic flag bit 1, CUR_STATE_DESTROY) are otherwise correctly described.
