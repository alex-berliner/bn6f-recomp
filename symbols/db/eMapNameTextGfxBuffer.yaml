summary: 'Proposed name: eMapNameTextGfxBuffer. EWRAM tile/tilemap buffer that holds the rendered graphics
  for the current map name before they are uploaded to the map-name VRAM slot. (struct)'
details: drawCurrentMapName_811F08C renders the current map's display name with renderTextGfx_8045F8C
  and then passes the same buffer to sprite_repackAndQueueTiles_811F5DC, which packs the tiles and queues
  them for upload to the BG/Sprite VRAM window at 0x6015780. The buffer is sized to hold the 0xC tiles
  that the repack call uploads, matching the 0xC passed in r3. The neighbouring byte_200C620 is the matching
  source tile set, and TextScriptMapNames provides the string. The label is the destination tile/tilemap
  staging area for the map-name strip.
