name: ai_pickAttackDuration
address: '0x08107F10'
kind: function
status: probable
summary: Loads the value table at dword_8107F20 (24,24,32,32) and tail-calls sub_800FE28 to pick one entry,
  returning it as the AttackDuration halfword stored at oAIAttackVars_AttackDuration.
interface: (no args) -> r0 = randomly picked byte from table dword_8107F20, stored as AttackDuration;
  flags from sub_800FE28
details: 'Thin wrapper: loads the address of the constant table dword_8107F20 (bytes 18 18 20 20 = 24,24,32,32)
  into r0 and tail-calls sub_800FE28, which evidently picks one entry from such a list (likely at random).
  Its single caller sub_8108046 stores the result halfword into oAIAttackVars_AttackDuration, right after
  loading AI difficulty tier and attack params, and then sets the object to attack state 0xb. A sibling
  wrapper sub_8107F24 with a different table feeds AttackBoost2/TimerOrCycles, confirming the pattern
  of per-property value tables. The value is a frame count/timer for how long the attack lasts.'
