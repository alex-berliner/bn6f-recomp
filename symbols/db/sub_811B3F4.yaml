name: sub_811B3F4
address: '0x0811B3F4'
kind: function
status: confirmed
summary: Dispatches an object's per-frame update through a 3-way jump table keyed by the byte at [object+8].
interface: 'void sub_811B3F4(void);  // in: r5=object pointer; out: r2,r3,r5,r10,r11 (whatever handler leaves);
  clobbers NZCV,r0,r1,r4,r6-r9,r12,lr'
details: "The function pushes only lr, reads a pointer to jt_811B408 from off_811B404,\nuses the byte at r5+8 as\
  \ a selector into that jump table, then performs an\ninterworking tail call: `mov lr,pc; bx r0`. This makes r0\
  \ the handler's\nentry address and r1 the selector byte, exactly as the original handlers\nexpect. The handler\
  \ list (jt_811B408) is:\n  [0] gui_initSprite0x2C_811B414\n  [1] sprite_updateWrapper_811B45C\n  [2] sub_811B464\n\
  The `bx r0` lands on the +1 (Thumb) variants stored in the table, so the\nselector values are 0,1,2 — i.e. a small\
  \ tagged union over object kinds\n(GUI/initialized sprite 0x2C, generic sprite update, and a third unknown\ntype).\
  \ Because the call is via `bx r0`/address-taken entry, callee and\ncaller share a register file with no typed\
  \ wrapper; the documented output\nset (r2,r3,r5,r10,r11) is whatever the dispatched handler happens to leave\n\
  behind, and NZCV are clobbered and not propagated.\n"
