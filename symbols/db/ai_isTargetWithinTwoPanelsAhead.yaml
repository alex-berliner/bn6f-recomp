name: ai_isTargetWithinTwoPanelsAhead
address: '0x08107A88'
kind: function
status: probable
summary: 'AI check: returns 1 if the target object stands on the same row one or two panels in front of
  the attacker''s facing direction.'
interface: (r5 = attacker battle object ptr, [r7+oAIAttackVars_TargetObjectPtr] = target object ptr) ->
  r0 = 1 if target is 1-2 panels ahead on same row, else 0
details: Calls object_getFrontDirection to get the +1/-1 facing multiplier for the attacker (r5). Reads
  the target's PanelX (offset 0x12) and PanelY (offset 0x13). If target Y == attacker PanelY and target
  X == attacker PanelX + dir or + 2*dir, sets result to 1; any other case yields 0. Registers r4 (direction)
  and r6 (result) are scratch; the function has no side effects.
