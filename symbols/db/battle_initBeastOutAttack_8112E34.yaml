name: battle_initBeastOutAttack_8112E34
address: '0x08112E34'
kind: function
previous_names:
- sub_8112E34
status: probable
summary: Initializes the per-attack state for the BeastOut/Rush/Fish attack (timers, animation, facing-direction)
  when a related battle object is present.
interface: '(r5 = self BattleObject*, r7 = AIAttackVars*, r10 = toolkit) -> void ; side effects: writes
  to BattleObject and AIAttackVars, calls object_setCounterTime(0x1e), battle_SetObjectExtraFlag14_80C4086'
details: "- Loads `self->RelatedObject1Ptr` (offset 0x4C, `oBattleObject_RelatedObject1Ptr`) and compares\
  \ it to 1.\n  - Branch == 1 (beast-related object case): sets `self->CurAnim = 2`, clears `AIAttackVars->Unk_28`,\
  \ calls\n    `sub_80C4038` with all-zero args and a constant argument from `dword_8113074 = 0x12810`,\
  \ storing the\n    returned pointer in `AIAttackVars->Unk_30`. Then `battle_SetObjectExtraFlag14_80C4086`\
  \ flips an extra\n    flag on the returned object; the new object's `Timer` is loaded from\n    `AIAttackVars->Unk_0e\
  \ * 0xA` (so Unk_0e is a small \"rank/scale\" index). Stores the object's\n    front-direction multiplier\
  \ (`object_getFrontDirection`) into `AIAttackVars->Unk_34`, arms a 0x1E-tick\n    counter via `object_setCounterTime`,\
  \ and finally sets `AIAttackVars->Unk_00 = 8`.\n  - Branch == 0 (no related object): writes `AIAttackVars->Unk_00\
  \ = 0xC` directly (no animation change,\n    no helper object spawned). Any non-zero/non-one value of\
  \ `RelatedObject1Ptr` falls through and does\n    nothing.\n  - Return is `void`-like: the contract\
  \ marks only r1/r5 as live; the function does not write back a\n    caller-meaningful value.\n  - Captured-call\
  \ register snapshot (r0=4, r1=0x08112e35 (lr), r2=0x80, r3=3, lr=0x08112da8) and the\n    \"beastsp\"\
  \ frame name align with callers in the BeastOut/Rush family of attacks dispatched from\n    `0x08112da8`.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, [r5,#oBattleObject_RelatedObject1Ptr]; cmp r0,#1` is the central discriminator.
    - `mov r0,#2; strb r0,[r5,#oBattleObject_CurAnim]` only happens on the ==1 branch, mapping to a distinct
    attack animation. - `mov r0,#0; mov r1,#0; mov r2,#0; mov r3,#0; ldr r4,=0x12810; bl sub_80C4038;
    str r0,[r7,#oAIAttackVars_Unk_30]` shows a child BattleObject is created with constant 0x12810 and
    cached in Unk_30. - `bl battle_SetObjectExtraFlag14_80C4086` followed by `ldrb r1,[r7,#oAIAttackVars_Unk_0e];
    mov r2,#0xa; mul r1,r2; strh r1,[r0,#oBattleObject_Timer]` ties the spawned object''s timer to Unk_0e
    × 10. - `bl object_getFrontDirection` (a side-aware facing-direction getter) is stored at `oAIAttackVars_Unk_34`,
    then `mov r0,#0x1e; bl object_setCounterTime` arms a fixed 30-frame counter. - `mov r0,#8; strh r0,[r7,#oAIAttackVars_Unk_00]`
    is the entry-phase status word on the ==1 branch. - The else branch writes only `AIAttackVars->Unk_00
    = 0xC` with no spawn; matches a "no related object, skip setup" guard.'
