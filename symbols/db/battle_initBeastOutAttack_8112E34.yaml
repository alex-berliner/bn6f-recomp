open_questions:
- What AIAttackVars state machine values 8 and 0xC actually mean downstream (they likely are substate
- numbers consumed by the parent handler). Looking at the parent `0x08112da8` and the function it
- transitions to would settle this.
- Identity of `sub_80C4038` (creates an auxiliary battle object — possibly a projectile or shadow
- object); not in callee summary, so role is inferred only from the constant 0x12810 and the
- immediate `SetObjectExtraFlag14`/timer setup.
