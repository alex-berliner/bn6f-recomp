details: This is a tiny AI-driver step for the battle enemy state machine. It first calls battle_aiInitAttackPanelSelect,
  which sets up one AI attack attempt (per-difficulty timing, a panel-choose callback, and the opposing
  player as target). It then stores the immediate value 4 as a byte into the AI state struct at offset
  oAIState_ScriptId, so after the attack-panel-select phase is primed the AI script continues at step
  4. It preserves only r4/r6 and is tail-call-free (explicit pop {pc}). Its purpose is entirely defined
  by the callee and the script-advance store; the exact caller context is unknown since no callers are
  recorded.
