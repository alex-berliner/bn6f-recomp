name: sub_814E9F0
address: '0x0814E9F0'
kind: function
status: confirmed
summary: Restart a BGM track on its music player if it is the track currently playing.
interface: void sub_814E9F0(u16 songId);  // preserves r4-r6, r7-r12, lr; clobbers r0, r1, r2, r3, r10, nzcv
details: 'Looks up `songId` (low halfword, scaled by 8) in `sound_MusicTable` to get

  the paired MPlay player index. Resolves that player in `gMPlayTable`

  (12-byte entries) and compares the song header it is currently playing

  against the table entry''s header pointer. On match, calls sub_814F1E8 on

  the player (which restarts/retriggers the currently playing track); if the

  player is idle or playing a different song, this is a no-op. Register

  residue is left intentionally for inlined callers (R1=current song header,

  R2=player info, R3=gMPlayTable).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
