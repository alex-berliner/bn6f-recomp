name: battle_getEnemyIconFlags_80AA824
address: '0x080AA824'
kind: function
status: confirmed
summary: Walk the battle object's per-enemy state-entry list and accumulate a bitmask of which enemy icons
  to display in the battle HUD.
interface: u32 battle_getEnemyIconFlags_80AA824(u32 battleObj /* r0 */) -> r0 = iconFlags, r2 = lastShiftVal;
  clobbers r1,r3,lr,flags; preserves r4,r6,r7
details: 'Reads a pointer from battleObj+0xC (the active-enemy entry list) and a state byte at battleObj+7.
  If that byte equals 2 the seed flags are 0x40 (boss-encounter bit). Each 4-byte entry''s first byte
  is masked to its high nibble: 0xF0 terminates the walk and returns accumulated flags; 0x10 denotes an
  enemy-reference entry whose bytes[2] plus nibble of bytes[3] form an index passed to enemy_getStruct2.
  The returned enemy struct''s halfword bits 12-15 give an icon-slot shift; the accumulator ORs (1 <<
  shift) into the flag word (also left in r2). If that struct''s byte[2] is >= 4 the function short-circuits
  and returns 0x20 instead, suppressing all other icon bits (a death/defeat or special-state icon). Unrecognised
  entry types advance the pointer by 4 and continue scanning. r4, r6, r7 are only used as locals and are
  push/pop-restored.'
