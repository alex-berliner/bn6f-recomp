name: battle_aiDispatchAttackPhase_80FE0D4
address: '0x080FE0D4'
kind: function
status: confirmed
summary: Jump-table trampoline that dispatches one of four battle-AI attack-phase handlers based on the
  current phase byte in the AIAttackVars structure.
interface: void battle_aiDispatchAttackPhase(void)  /* r7 = AIAttackVars*, all other registers pass through
  to the selected handler; r7 preserved */
details: Reads the byte at offset oAIAttackVars_Unk_00 through r7 as a zero-based index, loads a Thumb
  function pointer from the 4-entry jump table at off_80FE0E8, and tail-calls (mov lr,pc; bx r1) the handler.
  Phase 0 → sub_80FE0F8, phase 1 → sub_80FE130, phase 2 → sub_80FE1B4, phase 3 → battle_aiTickAttackTimer_80FE1FE.
  The pop {r7,pc} at the trampoline's epilogue restores the caller's frame pointer because the dispatched
  handler itself returns via the same pop-through pattern. No computation beyond the table lookup; every
  other register (r0–r6, r8–r12, flags) is simply handed to the callee.
