summary: 'Folder-edit scene renderer: rebuilds the folder/column BG tilemap rows of the folder-edit menu
  and copies them into BG blocks at column offsets derived from the folder-edit object state.'
interface: '(r5 = folderEdit object pointer, r10 = toolkit) -> r0 = computed next X base; side effects:
  writes BG tile blocks via CopyBackgroundTiles and queues chip/folder GFX via battle_loadFolderChipGfx/sub_81203E4/sub_8120458/sub_81204C4/sub_8120618.'
details: "Saves r4-r7/lr; uses r5 as the folderEdit struct base (mov r7, r5). Reads `r7+0x2e` (a folder-row\
  \ index, `Unk_2e` in S20364C0) and `r7+0x18`/`r7+0x1a` (two `s16` scroll/cursor fields) to compute X\
  \ bases for each BG column. The function then runs six paired GFX-build/copy sequences:\n    1. sub_81200EC\
  \ (header column? r0=`Unk_2e`, r1=unk_202A3E0, r2=eTileIds20345FC, r3=0x0b, r5=7) → CopyBackgroundTiles\
  \ at j=0x21-`Unk_2e`, i=4, tileBlock=2.\n    2. battle_loadFolderChipGfx_8120390 (r0=`Unk_2e`, r1=unk_202A3E0,\
  \ r2=eTileIds20346DC, r3=byte_81331B4, r4=0x6007600, r5=7) → CopyBackgroundTiles at j=0x1f-`Unk_2e`.\n\
  \    3. sub_81203E4 (chip-slot packed address list, base 0x6006b80 + 0x35c) → CopyBackgroundTiles at\
  \ j=0x29-`Unk_2e`.\n    4. sub_8120458 (converts chips) → CopyBackgroundTiles at j=0x2b-`Unk_2e` with\
  \ j_size=1.\n    5. sub_81204C4 (chip-type iterators, base 0x9000+0x34f) → CopyBackgroundTiles at j=0x2c-`Unk_2e`.\n\
  \    6. sub_8120618 (panel→BCD tilemap words, base 0xb000+0x200) → CopyBackgroundTiles at j=0x2e-`Unk_2e`.\n\
  \  After the fixed six columns, it conditionally runs call_sub_3005EBA with the same j=4/i=2/i_size=0x0e\
  \ shape; the choice depends on `r7+0x18 - r7+0x1a` (mvn/add pattern around loc_8134434), and either\
  \ uses j=0x30-`Unk_2e` (>=0 branch) or an offset based on the negative delta (loc_8134448 branch). All\
  \ callers feed r5 as the folderEdit struct, the captured `r0=Unk_2e` value grows by 2 each capture and\
  \ the exit `r0` matches `2*Unk_2e + 0x14` for the bottom-half calls and `2*Unk_2e + 0x16` for the top\
  \ half, consistent with the `sub r0, r0, r1` pattern.\n  Returns r0 as a derived position value but\
  \ callers only keep r5; reads/writes the live EWRAM 0x0202A3E0/0x020345FC/0x020346DC/0x02034714/0x0203474C/0x02034768/0x020347A0\
  \ tile-id buffers and 0x020033BD sub-chip pointers. No callers reuse r0.\n"
