  detail: '- `m4a_mplay_trackEndJumpStub_814E4CC:` is literally `bx r3` (asm line 22146), so all "logic" happens in the caller-supplied
    r3. - `dword_814E4D8: .word 0x68736D53` is the ASCII ''Smsh'' marker that m4a uses for end-of-track
    callbacks; every captured call shows r2 == 0x68736d53. - Captured-call snapshots have the same bytes
    53 6d 73 68 61 e2 14 08 immediately after the ''Smsh'' tag, i.e. a u32 LE pointer 0x0814E261 — that
    is the offset right after `MPlayMain`''s call to this thunk, which is exactly where r3 is sourced
    from. - All six example callsites share the same magic tag and pointer-to-callers; identifies this
    as a shared jump-slot for the m4a driver. - The contract shows every caller''s callee-saved set (r4-r12,
    lr) listed as `in` and `out`, which only makes sense for a tail-call dispatch.'
