status: probable
summary: Indirect-jump trampoline used as the track-end callback for m4a MPlay tracks; reaches the real
  routine through r3.
interface: (r0 = MPlayTrackInfo*, r1 = MPlayChannel*, r2 = 0x68736D53 'Smsh' tag, r3 = target_fn) -> r0
  = ?, flags clobbered; tail-call into r3 with r4-r12/lr preserved.
details: "Body is a single `bx r3` instruction (sub_814E4CC at 0x0814E4CC), so this function is purely\
  \ a thunk.\n  Immediately followed by an alignment pad (two 0x00 bytes) and a small data table:\n  \
  \  off_814E4D0 = byte_81C068C (some code/data blob in ROM)\n    off_814E4D4 = byte_3007FF0 (IWRAM address,\
  \ the last word of IWRAM)\n    dword_814E4D8 = 0x68736D53 (\"Smsh\", the small 'S' tag that m4a uses\
  \ to mark end-of-track callbacks).\n  The four bytes seen in every captured-call r2 (0x68736D53) — and\
  \ the \"Smsh\"/`61 e2 14 08` (LE u32 = 0x0814e261) sitting just past the 'Smsh' tag in each\n    pointer\
  \ target — match the structure of an m4a `MPlayTrackInfo` `trackEndCallback` slot ('Smsh' magic, then\
  \ callback pointer). The caller (MPlayMain)\n    is documented as the m4a sequencer, and ply_note /\
  \ sub_814E4DC are confirmed/unnamed m4a helpers, all consistent with this being part of the music driver.\n\
  \  Rather than call a real function, MPlayMain loads the track-end entry from r0's struct and `bx`s\
  \ to it; the function exists at this fixed address only so the\n    data table for `off_814E4D0/off_814E4D4/dword_814E4D8`\
  \ lives at a known offset. Control returns via r3; this is a tail-call (no bx lr / no return).\n"
