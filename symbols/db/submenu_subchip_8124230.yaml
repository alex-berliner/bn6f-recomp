  detail: Not of this function itself (vidsync never ran or hooked it) but of the two fields it sets. vidsync's
    subchip handler (try_subchip) writes EVENT_170A's byte with mask 0x20 and 0 to the counter at eStruct2001c04+0x24
    at the end of a frame near a loss on an internet map, so that the expiry cutscene starts when the video's does,
    and keeps the write only when the sync then follows the speedrun video. One such fix is in the recorded BeastSP
    route (tools/traces/beastsp.poke, vidsync's kept fixes) at game frame 208526.
