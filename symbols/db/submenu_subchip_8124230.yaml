name: submenu_subchip_8124230
address: '0x08124230'
kind: function
previous_names: []
status: probable
summary: Sub-chip menu step for using SneakRun - sets EVENT_170A, starts its counter (eStruct2001c04+0x24 = 0x1770,
  6000), moves the menu to state 0x10 and runs chatbox script 0xA with the menu's message halfword.
interface: (r5 = sub-chip menu state, r10 = toolkit) -> void; writes EVENT_170A, the u32 at eStruct2001c04+0x24,
  menu byte +0x02 and the chatbox's +0x4C; r4 preserved; returns whatever chatbox_runScript201C100_812474C leaves
  in r0-r3.
details: 'Body (asm33.s:2287-2307): SetEventFlagFromImmediate(EVENT_170A); str 0x1770 to [toolkit->S2001c04 + 0x24]
  (32

  bits); strb 0x10 to menu +0x02; the halfword at menu +0x10 to [toolkit->Chatbox + 0x4C] (32-bit str);

  chatbox_runScript201C100_812474C(0xA). It is mode 8 of the sub-chip menu dispatcher submenu_subchip_dispatch_8124144

  (jt_8124188, asm33.s:2163-2169). Its siblings there do the same for the other sub-chips: submenu_subchip_812425C

  sets EVENT_1709 (no counter), submenu_subchip_812427C sets EVENT_170B and 0x1770 at +0x28 (and copies +0x1C to
  +0x2C),

  submenu_subchip_81242AC sets EVENT_1708 and state 0x14.


  The flag and counter are what make SneakRun last. npc_80350BC (asm03_1_0.s:2721), on internet maps (MapGroup >=

  0x80), clears EVENT_170A and starts the cutscene byte_8099DC0 (r1 = 1, the "<item> just expired!" message) once
  the

  flag is set and the counter is 0; EVENT_170B with +0x28 gives the same cutscene with r1 = 0.

  endOfSection_NaviSetup_80340F6 zeroes both counters and clears EVENT_170A, EVENT_170B and EVENT_1709. The

  random-encounter code reads +0x24 (asm29.s:10761, named oS2001c04_EncounterGate there).


  Which flag is which sub-chip is vidsync''s: its subchip handler calls EVENT_170A (byte 0x02001F69, mask 0x20)
  with

  the counter at 0x02001C28 "SneakRun", and EVENT_170B (mask 0x10) with 0x02001C2C "LocEnemy" (docs/vidsync/BN6F_SYMBOLS.md,

  level R for the flags and counters); nothing in this entry ties the names to the flags independently.

  '
