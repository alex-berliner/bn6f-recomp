name: battle_setupBeastPwrAttackVars
address: '0x080121F8'
kind: function
status: probable
summary: Initializes an AI attack object's damage variables from the beast power-attack table before an
  attack step runs.
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = 9 (next state); clobbers r0-r1, lr
details: Loads the battle object's Alliance byte (r5+oBattleObject_Alliance) and passes it with a fixed
  index of 0xA to battle_beastPwrAtk_addScaledBaseFromIndex_8010D04, which scales the beast power-Atk
  base entry at byte_80212D4[0xA] by the attacker's side. The returned damage is written to oAIAttackVars_Damage;
  a constant 0x8A (138) is stored to oAIAttackVars_ExtraDamage, and the InitFlag byte is set to 2. It
  then returns 9, consistent with a state-machine step handler that yields its next state in r0. This
  looks like the one-time setup step for a specific Beast Out power attack whose fixed bonus damage is
  138.
