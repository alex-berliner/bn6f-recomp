summary: 'One-time graphics/tilemap setup: reset graphics state, decompress the shared init-refs table, clear the
  tile GFX area, and blit 32x20 and 30x20 background tile maps into VRAM tile blocks 1 and 2.'
interface: void copyTileData_803FC64(void); /* inputs ignored; clobbers r0-r4, r10, lr, nzcv; preserves r5, r6,
  r7 */
details: 'Calls resetAllGraphicsState_8005F40, runSetupStepAndClearWorkArea_8005F6C, and sub_80027C4 to restore
  default hardware state. Then drives decompAndCopyData with the initRefs803FCA4 table (four entries: compressed
  font/tilemap/palette blobs at comp_86C41D0, comp_86C4490, comp_86C45A8 plus palette_3001960, mapped to VRAM 0x06000000,
  decompressed via eDecompBuffer2013A00, with destination buffers byte_2017A00 / unk_2018A00 / "0x0" for the third).
  After ZeroFillGFX30025c0 clears the tile GFX area, it issues two CopyBackgroundTiles calls blitting tile-id arrays
  eTileIds2018A04 (32x20 into tile block 1) and eTileIds2017A04 (30x20 into tile block 2), both starting at (j=0,
  i=0). The trailing byte_803FCE4 =0x0, 0x2A, 0x0, 0x0, 0x0, 0x54, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0 looks like leftover
  padding (not referenced by this function). The shape of the initRefs table plus the two 32x20 / 30x20 tilemaps
  are consistent with title-screen/boot graphics, but no caller context is in view.'
