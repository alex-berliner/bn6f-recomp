name: object_setDefaultCounterTime
address: '0x0800FDB6'
kind: function
status: confirmed
summary: Wrapper that resets the working object's counter timer to the default 0x10 frames via object_setCounterTime.
interface: void object_setDefaultCounterTime(void) — reads r5, r10, lr; everything else (r0-r3, lr, c, v, nz) reflects
  whatever object_setCounterTime leaves behind
details: 'Tail-style wrapper around object_setCounterTime: pushes lr, loads the constant 0x10 into r0 (the game-wide
  default counter/invulnerability-style time in frames), calls object_setCounterTime, then pops pc. The object to
  act on is not passed directly — the callee picks it up from the caller''s working-object context (r5/r10 per the
  register contract), so this must be called from the standard object-update context where r5 points at the object
  and r10 at its related workspace. Only the counter time field is touched (through the callee); no other object
  fields are modified here.

  '
