open_questions:
- The exact meaning of oOWPlayerObject_Unk_18 == 0xA is not provable from this function alone; a
- follow-up read of sub_809D348's handling of [r5+0x18] would confirm whether 0xA is "landed, ready
- to resume normal control" or a cutscene-script handoff.
- The FacingDirection -> bit mapping in byte_809DFFC has two duplicates (entries 0x4 and 0x6 both
- yield 0x4, 0x5 and 0x7 both yield 0x8), so 0xF being the completion condition is consistent but
- not the only reading; verifying the player only cycles through 4 distinct facings per jump would
- confirm 0xF really is the "fully turned around mid-jump" sentinel.
