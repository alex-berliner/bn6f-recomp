name: battleObject_initSpawnedObject_80D03B8
address: '0x080D03B8'
kind: function
previous_names:
- sub_80D03B8
status: probable
summary: Initializes a freshly-allocated battle object for a moving/animated spawn (recomputes coords
  from panels, sets Z to 0, nudges Y/Z up by 1 panel, loads sprite 0x80/anim 0x3F, gives it a shadow,
  sets flip from facing, sets an X-velocity based on Param1, allocates collision data with hit-effect
  6, plays SE 0xB3, and advances state to UPDATE)
interface: '(r5 = battleObject, r10 = toolkit, lr = return) -> void ; side effects: writes many battle-object
  fields, allocates a CollisionData slot, plays sound effect 0xB3'
details: '1. Recomputes the object''s pixel X/Y from its current panel grid (object_setCoordinatesFromPanels).

  2. Zeros oBattleObject_Z, then increments oBattleObject_Y16 and oBattleObject_Z16 by +1 (so the object
  sits one panel half-row above its current row).

  3. Computes a facing ±1 via object_getFrontDirection, indexes a 4-entry signed-velocity table at byte_80D0444
  by (Param1<<2) to get a direction-specific X-velocity scalar, multiplies, and stores into oBattleObject_XVelocity.
  The table holds entries {0, +6, -6, +7, -7} (signed 16.16), so Param1 selects one of four presets depending
  on how the object should slide horizontally.

  4. Loads sprite index 0x80 with two extra args 8/0xE (sprite_load), turns on the shadow (sprite_hasShadow),
  sets flag bit 0x02 (OBJECT_FLAG_VISIBLE) in oObjectHeader_Flags, and forces CurAnim/CurAnimCopy = 0x3F.

  5. sprite_setAnimation(0x3F), then sprite_loadAnimationData, palette 0 (sprite_setPalette).

  6. Copies the current horizontal flip from object_getFlip via sprite_setFlip.

  7. Allocates a CollisionData slot via object_createCollisionData; if allocation fails it frees the object
  (object_freeMemory) and returns — defensive path.

  8. On success: object_setupCollisionData(..., r1=4, r2=5, r3=3) initializes the collision block from
  the parent, sets hit-effect 6 (object_setCollisionHitEffect), and registers the collision for this frame
  (object_presentCollisionData).

  9. Plays sound effect 0xB3 (PlaySoundEffect) — a "spawn/appear" cue.

  10. Stores CUR_STATE_UPDATE (0x04) into the full u32 oBattleObject_CurStateActionPhaseAndPhaseInitialized
  slot and returns.

  Note: r10 (toolkit) is preserved by the contract but is not directly used by this routine — kept live
  across calls so callees that expect it in r10 see it intact.

  '
