  date: '2026-10-14'
  detail: '- `bl object_setCoordinatesFromPanels` is the first call after `push {lr}` — clear "set up
    from panels" intent. - `mov r0,#0; str r0,[r5,#oBattleObject_Z]` plus `ldrh r1,[r5,#oBattleObject_Y16];
    add r1,r1,#1; strh r1,[r5,#oBattleObject_Y16]` and the matching Z16 bump show explicit Z=0 / +1 panel
    lift. - `bl object_getFrontDirection; ldrb r1,[r5,#oBattleObject_Param1]; lsl r1,r1,#2; ldr r2,[off_80D0440];
    ldr r1,[r2,r1]; mul r0,r1; str r0,[r5,#oBattleObject_XVelocity]` shows the Param1-driven velocity
    table lookup. - The 16-byte table at byte_80D0444 = {0,0, 6,0, 0,0x80, 6,0, 0,0, 7,0, 0,0x80, 7,0}
    (little-endian u32) corresponds to {0x00000000, +0x00060000, -0x00060000, +0x00070000, -0x00070000}
    → four signed presets at indices 0..3. - `mov r1,#8; mov r2,#0xe; mov r0,#0x80; bl sprite_load` →
    sprite 0x80 with sub-args 8 and 0xE. - `bl sprite_hasShadow` then OR''ing bit 0x02 into `oObjectHeader_Flags`
    adds OBJECT_FLAG_VISIBLE. - `mov r0,#0x3f; strb r0,[r5,#oBattleObject_CurAnim]; strb r0,[r5,#oBattleObject_CurAnimCopy];
    bl sprite_setAnimation; bl sprite_loadAnimationData` forces anim 0x3F and loads it. - `bl object_createCollisionData;
    tst r0,r0; bne loc_80D0420; bl object_freeMemory` shows the standard "alloc-or-die" pattern. - `mov
    r1,#4; r2,#5; r3,#3; bl object_setupCollisionData` then `mov r0,#6; bl object_setCollisionHitEffect`
    then `mov r0,#0xb3; bl PlaySoundEffect` are unique constants that pin the routine''s identity. - `mov
    r0,#CUR_STATE_UPDATE; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]` is the standard
    init→update step transition.'
