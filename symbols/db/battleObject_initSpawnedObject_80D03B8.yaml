open_questions:
- Which chip/battle-object category uses sprite 0x80 + anim 0x3F + SE 0xB3 — probably a generic spawn/despawn
  helper shared by multiple battle objects; naming "initSpawnedObject" reflects that without claiming
  a specific chip.
- Exact gameplay meaning of Param1 (0..3 selects a horizontal-velocity preset); would need a caller trace
  to map the four presets to named variants.
