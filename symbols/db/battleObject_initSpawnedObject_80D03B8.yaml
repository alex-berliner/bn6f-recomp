name: battleObject_initSpawnedObject_80D03B8
address: '0x080D03B8'
kind: function
status: confirmed
summary: 'Full initialisation of a freshly spawned battle object: derive grid position, set ground-level offset,
  assign facing-based X velocity from a four-entry speed table, load sprite 0x80 with shadow, enter animation slot
  0x3F, allocate and configure collision hitbox (axes 4/5/3, hit-effect 6), play spawn SFX 0xB3, and transition
  the object to CUR_STATE_UPDATE; frees the object if collision allocation fails.'
interface: void battleObject_initSpawnedObject_80D03B8(r5 = object*, r8 = context, r10 = context) -> (r5, r8, r10
  unchanged); NZCV clobbered; r0-r3, lr clobbered; r4, r6, r7, r10 preserved
details: oBattleObject_Z is zeroed and Y16/Z16 each incremented by 1 to snap the object to ground level with a half-tile
  vertical offset. oBattleObject_Param1 indexes a four-entry word table at 0x080D0444 ({0x00060000, 0x00068000,
  0x00070000, 0x00078000}) whose 16-bit halves encode X and Z speed magnitude; the product with the front-direction
  result is stored in oBattleObject_XVelocity. Sprite loaded with ID 0x80, cell-size 8, flag 0xE. Header flags bit
  1 (shadow) is OR-ed in. Both CurAnim and CurAnimCopy set to 0x3F before sprite_setAnimation/sprite_loadAnimationData/sprite_setPalette(0).
  Collision data axes are (4, 5, 3) with hit-effect ID 6. If object_createCollisionData returns null the object
  is freed and the function returns early without setting state. Spawn sound effect 0xB3 is played after collision
  presentation. Final write sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE. r10 is
  passed through (inputs/outputs) but not read in this function's body.
