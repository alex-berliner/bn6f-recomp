name: selectVirusOrNaviNamesAndWhich_800EC56
address: '0x0800EC56'
kind: function
status: confirmed
summary: Given a battle chip ID, returns the text script holding that chip's name string (navi chips have IDs above
  0xFF and use a separate name table) and the ID's low byte.
interface: u8 lowByte selectChipNameScript(u16 chipId /* r0 */) -> r0 = TextScript* (virus or navi chip name list),
  r1 = chipId & 0xFF; flags clobbered
details: 'Takes a battle chip ID in r0. Compares it against 0xFF as a signed value: if chipId > 0xFF (i.e. the high
  byte is set, which the game uses to mark MegaMan/navi chips), it selects TextScriptNaviChipNames; otherwise it
  selects TextScriptVirusChipNames. Returns the chosen text script pointer in r0 and the chip ID truncated to its
  low byte in r1 (so a navi chip ID like 0x1xx maps back into the 0..0xFF range used as an index into the selected
  name list). The caller is expected to feed both values to the text-script engine to display the chip''s name (e.g.
  in the chip selection/folder UI). The 0xFF threshold relies on signed comparison (ble), so it effectively tests
  (s16)chipId > 255 rather than any unsigned range check.

  '
