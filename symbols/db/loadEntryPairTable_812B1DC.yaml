name: loadEntryPairTable_812B1DC
address: '0x0812B1DC'
kind: function
status: confirmed
summary: Decodes a sentinel-terminated 4-byte-per-entry table through sub_8046670 and stores the results
  into the 4-slot scratch buffer unk_20251A0 (zeroed first).
interface: 'void loadEntryPairTable_812B1DC(const void *entryTable /* r0 */);

  // clobbers r0-r3, r4, r5, r6, lr; NZCV; r4/r5/r6 preserved in

  // practice (set by callee but live across the call)

  '
details: 'The input pointer (r0) points at an array of 4-byte records laid out as

  { u8 a, u8 b, u16 c }. The first record is decoded standalone via

  sub_8046670(a, b, c); its return value is discarded. From the second record on,

  the loop walker (r4) advances one entry (4 bytes) at a time, the slot index

  (r6) is ORR-ed into the high half of r2 before the call, and the result

  is stored into unk_20251A0 at offset (slot << 2). The buffer is zeroed by

  ZeroFillByWord(unk_20251A0, 0x10) before any decoding, so the four 32-bit

  slots start cleared. The loop ends when the byte at the next record''s

  offset 0 is 0xFF (sentinel terminator). With slot starting at 0 and

  incrementing once per record, only 4 slots exist (0x10 bytes / 4), so

  the table is implicitly limited to 4 entries beyond the first "header"

  record (5 records total including the unstored first one).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
