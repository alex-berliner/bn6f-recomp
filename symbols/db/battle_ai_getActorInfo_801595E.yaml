summary: Reads three AIData fields (ActorType, AIIndex, Unk_03) for the AI slot given by r0 and returns
  them in r0/r1/r3.
interface: '(r0 = aiSlotIndex) -> r0 = ActorType, r1 = AIIndex, r3 = Unk_03 ; side effects: none (leaf)'
details: "Indexes a global AIData table at unk_203A980. Multiplies r0 by 0x10 (sizeof AIData, see AIData.inc\n\
  \  which defines AIIndex at 0x1, Unk_03 at 0x3, and the struct org stepping confirms a 0x10 stride).\n\
  \  Loads AIData[slot].ActorType (offset 0x0) into r0, AIData[slot].AIIndex (offset 0x1) into r1, and\n\
  \  AIData[slot].Unk_03 (offset 0x3) into r3, then returns. No callees, no stack frame, no memory\n \
  \ writes. Caller lr (= 0x08014a41, the AI state-machine dispatcher in sub_8014A38) uses the returned\n\
  \  triple to decide which AI handler to run; all 11 callers in the AI dispatcher cluster share the\n\
  \  same captured signature (r0=slot, r2/r3 carry unrelated battle-state pointers). r3 returned as a\n\
  \  u8 fits the AIData.Unk_03 contract used in sub_8014E08 (recovery-jingle AI step).\n"
