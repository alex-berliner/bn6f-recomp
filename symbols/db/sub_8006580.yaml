name: sub_8006580
address: '0x08006580'
kind: function
status: confirmed
summary: Tears down the cross-over/transform overlay effect, freeing its two BG palettes and clearing the render-info
  bits it set up.
interface: 'void effectTransformTeardown_8006580(struct EffectState* r5, struct Toolkit* r10) -> r2 = 0x40

  '
details: 'Frees hardware palettes 0x14 and 0x15 via Terminate_ePalette20097a0_Transform. Zeroes the

  global word at dword_20096D0 and the byte at effectState+0xD. Through the toolkit''s

  oToolkit_RenderInfoPtr the function then masks out bit 0x40 ("effect window" flag) from the

  three halfword fields at renderInfo+6, +8 and +0xA, and zeroes renderInfo+2 (a counter/

  timer halfword). Leaves r2 = 0x40 for the caller as a "mask that bit" reminder value.

  Side note: the data immediately after the function (byte_80065BC, math_sinTable,

  math_cosTable, byte_80066E0) is colocated math/sine lookup data not used by it; the function

  itself is just the cleanup stub above.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
