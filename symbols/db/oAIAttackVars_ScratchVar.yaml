name: oAIAttackVars_ScratchVar
address: '0x30'
kind: struct-field
status: hypothesis
summary: Multi-purpose scratch field reused as frame counter, boolean flag, sub-state id, spawned-object
  pointer, or function pointer depending on the active AI attack handler.
details: 'The 265 accesses show wildly inconsistent usage: incremented/capped as a tick counter (asm00_2.s:13856),
  set to 0/1 and tested with tst as a boolean (asm31.s:113793, aiAttack_stepStateMachine_80EB04C), loaded-then-dereferenced
  as a pointer to a spawned attack object (asm31.s:126813 `ldr r0,[r0]`), set to `r5+0x60/0x64/0x6c/0x74`
  as a pointer into the BattleObject''s ExtraVars (asm31.s:125390, 143873), set to small ints 1-4 as a
  sub-state (asm31.s:116124), and stored as a `sub_XXX+1` function pointer that is `bx`-called (asm31.s:131933).
  A single named purpose does not fit all uses — this is clearly a generic scratch slot that the active
  handler repurposes.'
