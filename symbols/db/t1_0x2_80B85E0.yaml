name: t1_0x2_80B85E0
address: '0x080B85E0'
kind: function
status: confirmed
summary: Battle-object state dispatcher - reads the object's CurState and tail-calls the matching handler (init
  visuals, sync visuals, or free the object).
interface: void battleObject_dispatchCurState_80B85E0(BattleObject* obj /*r5*/, u32 passthrough /*r10*/); clobbers
  r0-r7,r12,lr and nzcv; outputs r5,r8-r12 as left by the invoked handler; returns to the original caller.
details: "A tiny trampoline for a battle object type (the t1_0x2 tag): the object's\nbyte at oBattleObject_CurState\
  \ indexes a 3-entry jump table at off_80B85F4:\n  0 -> battleObject_initVisualsFromRelatedObject  (first-time\
  \ visual setup)\n  1 -> battleObject_syncVisualStateFromRelatedObject_80B863A (refresh visuals)\n  2 -> object_freeMemory\
  \ (release the object's memory)\nThe dispatch is done with a manual long-call trick: lr is loaded with pc\n(so\
  \ the handler's lr points just past the 'bx r1', i.e. the pop {pc}), the\ntable entry is called via bx r1, and\
  \ on handler return this routine just\npops pc to return straight to its own caller. Handlers are entered with\n\
  r0 = CurState, r1 still holding the table entry, r5 = object pointer, and\nr10 passed through untouched. Whatever\
  \ r5/r8-r12 the handler leaves are\neffectively this routine's outputs, since the wrapper returns directly.\n\
  The two bytes of padding after 'pop {pc}' are part of the Thumb alignment.\n"
