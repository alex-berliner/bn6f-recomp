summary: 'Proposed name: panelTileAnimationFrameOffsets. IWRAM destination offsets used when copying animated
  panel tile frames (table of what)'
details: The ROM bytes are eight little-endian pointer-sized values used as IWRAM copy destinations by
  stepPanelTileAnimations_800C192. The surrounding dword_800C2B0 descriptor pairs a count of eight with
  this destination table. The function copies each due animation frame from the corresponding source tile
  animation into one of these IWRAM offsets. The table is therefore a destination-offset array, not tile
  pixel data itself.
