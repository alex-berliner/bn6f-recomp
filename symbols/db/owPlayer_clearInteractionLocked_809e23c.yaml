name: owPlayer_clearInteractionLocked_809e23c
address: '0x0809E23C'
kind: function
status: confirmed
summary: Clears the overworld player object's "interaction locked" flag so the player can start a new interaction.
interface: void owPlayer_clearInteractionLocked_809e23c(toolkit *r10) ; returns r0=0, r3=player object ptr, flags
  NZ from r0
details: 'Reads the toolkit''s GameState pointer from r10 (oToolkit_GameStatePtr), then the overworld player object
  pointer from the game state (oGameState_OverworldPlayerObjectPtr), and stores FALSE (0) as a byte into oOWPlayerObject_InteractionLocked
  on that object. This ends the "currently interacting" state, unlocking the player for further NPC/dialog/interaction
  handling on the overworld. Side effects: r0 is set to 0 and flags NZ are set from it; r3 ends up holding the player
  object pointer. No stack usage; returns via mov pc, lr.

  '
