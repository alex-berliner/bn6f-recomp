name: sub_811A1F4
address: '0x0811A1F4'
kind: function
status: confirmed
summary: For every entity slot from a caller-chosen start slot up to (not including) slot 4, looks up the slot's
  struct and overwrites three of its fields with values passed by the caller.
interface: void sub_811A1F4(u16 halfwordVal /*r0*/, u8 byteVal /*r1*/, u32 startSlot /*r2*/, u16 halfwordVal2 /*r3*/);
  preserves r4; no meaningful return
details: "Calls getStructFrom2008450(slot) for each slot index from r2 through 3. That helper\nreturns r0 = pointer/flag\
  \ for the struct registered in the per-slot table at\n0x2008450 (r0 == 0 means \"no struct for this slot\") and\
  \ the struct address in r1.\nWhen a struct exists, it writes three fields:\n  +0x0C (byte)  = r1 argument\n  +0x0E\
  \ (halfword) = r0 argument\n  +0x18 (halfword) = r3 argument\nNote that the struct fields are written even for\
  \ the start slot itself, and the\nloop never reaches slot index 4, so the write range is [startSlot, 3]. The loop\n\
  counter lives in r4 but the function pushes/pops r4, so it is preserved. The\nvalues are pushed to the stack first\
  \ (a 0x10-byte frame) because r0-r3 are needed\nafter the call to getStructFrom2008450 clobbers them. What the\
  \ three fields mean\n(likely per-entity state such as an id/type byte and two counters/flags) is not\nconfirmed\
  \ from this function alone; the pattern suggests a bulk update applied to\na group of slots, e.g. refreshing properties\
  \ on the player's side or a group of\nNPCs/custom entities when some game state changes.\n"
