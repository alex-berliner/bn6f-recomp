name: sprite_objectUpdateAnimation_811B284
address: '0x0811B284'
kind: function
status: confirmed
summary: Per-frame update for an animated sprite object — runs the object's own frame handler, then advances its
  sprite animation.
interface: 'void sub_811B284(void); /* inputs: r4, r5, r7 (object/animation state pointers, carried by the callee);
  preserved: r4, r5, r7; clobbers r0-r3 and flags nz cv */'
details: 'A tiny thunk used as the update step of some animated object (sprite/entity driver).

  It first calls sub_811B298 — the object''s own per-frame handler, which presumably

  reads r4/r5/r7 as its object/state pointers — and then calls sprite_update to

  advance that object''s sprite animation one frame. It is called with lr as the

  return address and simply returns to the grand-caller via pop {pc}, so it is a

  pass-through step in the object''s update chain, holding no state of its own.

  The register contract shows callers only pass r4/r5/r7 and expect them preserved,

  consistent with this being a generic per-frame tick dispatched from an object

  table (each entry having its own handler at the sub_811B298 slot).

  '
