name: main_zeroFill_80017EC
address: '0x080017EC'
kind: function
status: confirmed
summary: Zeroes the first two halfwords of the palette buffer at palette_3001960 and of BG palette memory (0x5000000)
  during boot.
interface: void main_zeroFillFirstPaletteEntries(void); // preserves r2/r3, returns caller's r3 unchanged
details: 'Calls ZeroFillByHalfword twice with count 2: first on the scratch palette buffer palette_3001960 (clearing
  its first 2 halfwords = first color entry), then on hardware BG palette memory at 0x5000000 (clearing the first
  2 halfwords there, i.e. BG palette color index 0 and 1). r0 is the destination address, r1 the halfword count.
  The function itself does not read r2 or r3, but the register contract shows callers pass r2/r3 and get r3 back
  unchanged — the routine happens to preserve both, so r3 passes through. Likely a very early boot-time init step
  that blanks the first palette slot before anything is drawn.

  '
