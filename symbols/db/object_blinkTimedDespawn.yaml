name: object_blinkTimedDespawn
address: '0x080C59B6'
kind: function
status: probable
summary: Battle-object state handler that removes the object from collision, blinks it invisible for its
  final frames, then destroys it when its timer runs out.
interface: (r5 = battle object pointer, r0 unused on entry) -> writes oBattleObject_CurPhase/Timer, oObjectHeader_Flags;
  sets state to CUR_STATE_DESTROY when timer expires
details: Runs as a per-frame state handler for a battle object whose current phase is held in oBattleObject_CurPhase.
  On the first invocation (phase 0) it advances to phase 1, calls object_clearCollisionRegion so the object
  stops colliding immediately, and starts a 26-frame (0x1A) countdown in oBattleObject_Timer. During the
  last 9 ticks (timer <= 8) it clears the flag bit 0x2 in oObjectHeader_Flags (apparently the visible/enabled
  bit) and re-sets it only on frames where the timer has bit 1 set, producing a 2-frame blink. Each frame
  it decrements the timer; when the decrement underflows (timer becomes negative) it writes CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, tearing the object down.
