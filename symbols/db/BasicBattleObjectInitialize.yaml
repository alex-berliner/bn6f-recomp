name: BasicBattleObjectInitialize
address: '0x0801155A'
kind: function
status: confirmed
summary: Fills in the base battle-object fields (position, element, related object, flags) for a newly spawned battle
  entity.
interface: void BasicBattleObjectInitialize(BattleObject* obj, u8 panelX, u8 panelY, u8 element, BattleObject* related,
  u32 damageStaminaCounterDisabler) -> r1 = alliance/flip value of related object
details: 'Writes the caller-supplied spawn data into the base (shared) part of a battle object:

  PanelX (byte), PanelY (byte) and Element (byte) from r1/r2/r3, a 32-bit word at

  oBattleObject_DamageAndStaminaDamageCounterDisabler from r6 (a flag disabling damage/stamina

  counters), and a halfword oBattleObject_AllianceAndDirectionFlip copied from the related

  object at r5. The related object pointer is stored at oBattleObject_RelatedObject1Ptr,

  so the new object inherits its alliance and direction-flip state from that source

  (typically the owner/spawner of the object). No clobbered registers; the loaded

  alliance/flip halfword is passed through in r1 as a convenience for callers.

  This is a common initializer invoked by every battle entity spawn (players, enemies,

  custom objects) before the type-specific setup runs.

  '
