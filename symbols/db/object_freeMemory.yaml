name: object_freeMemory
address: '0x08003458'
kind: function
status: confirmed
summary: Releases a battle object's slot — clears its flags, frees its bitmap slot for its type, unlinks it from
  the active-object list, and resets its sprite scaling.
interface: void object_freeMemory(BattleObject *obj /* r5 */); clobbers r0-r3 and flags via tail work in sprite_makeUnscalable;
  preserves r5; returns to sprite_makeUnscalable's caller with its register/flag state (nz c v r0-r3, lr).
details: "Takes a battle object pointer in r5 and frees it back to the battle object allocator:\n1. Zeroes the object's\
  \ flags byte at +0x00, marking it inactive.\n2. Reads the object's type byte at +0x02 and masks the low nibble\
  \ (type id 0-15), uses it\n   to index ActiveObjectBitfieldPointers[type] to get that type's 32-bit allocation\
  \ bitmap.\n3. Reads the object's ListIndex byte at +0x03 and clears bit (0x80000000 >> ListIndex) in\n   the bitmap\
  \ — slots are handed out from the top bit down, so slot n is bit 31-n. (Thumb\n   LSR-by-register yields 0 for\
  \ shifts >= 32, so out-of-range indices silently clear\n   nothing.)\n4. Unlinks the object from the doubly-linked\
  \ list of active objects: the list node is a\n   header sitting oBattleObject_LinkedList_Size bytes before the\
  \ object proper, with Prev\n   at +0x00 and Next at +0x04; splices prev->next = next and next->prev = prev.\n\
  5. Tail-calls sprite_makeUnscalable with r0 = list node (object - LinkedList_Size),\n   r1 = prev node, r2 = next\
  \ node, r3 = freed slot bit; on return r0-r3 and the flags are\n   whatever that call left.\nTouches only the\
  \ object's flags/type/list-index bytes and the shared per-type bitmap and\nlist links; the rest of the object's\
  \ memory is not zeroed.\n"
