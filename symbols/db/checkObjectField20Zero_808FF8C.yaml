name: checkObjectField20Zero_808FF8C
address: '0x0808FF8C'
kind: function
status: confirmed
summary: Tests whether field 0x20 of the object pointer in r5 is zero and returns the answer in the Z
  flag (Z clear = field is zero).
interface: 'bool checkField20Zero(void* obj /* r5 */); returns via flags: Z set when [r5+0x20] != 0, Z
  clear when [r5+0x20] == 0; clobbers r0, r1 and V/C (unconditionally, per the lifter''s caller analysis)'
details: 'Tiny predicate helper. Loads the 32-bit value at [r5+0x20], and if it is nonzero leaves r0 =
  0;

  if it is zero sets r0 = 1. It then TSTs r0 with itself so the Z flag carries the result:

  Z set means the field was nonzero ("test failed"), Z clear means the field was zero

  ("test passed"). Callers are expected to follow with a conditional branch on the flags.

  The inverted sense (r0=1 for zero, then testing r0) makes the Z clear case the "field is

  zero" case, which callers presumably branch to with BNE. Note r1 is loaded but never used

  beyond the comparison, and r0/r1 are listed as clobbered even though only r0 truly carries

  a value out. Nothing else in the function hints at the structure''s meaning, so the game-level

  role of field 0x20 is unresolved.

  '
