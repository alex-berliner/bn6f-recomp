name: owObject_lineDraw_8030CAC
address: '0x08030CAC'
kind: function
status: confirmed
summary: Bresenham line draw across an OWObjectCoords from target to current position, calling sub_8030DA2
  to plot each tile along the way.
interface: "void sub_8030CAC(OWObjectCoords* obj, u32 ctx /* r5 */)\n  /* inputs: r0=obj, r5=ctx, lr */\n\
  \  /* outputs: r0=obj (preserved), r5=ctx (preserved) */\n  /* clobbers: r1-r4, r6-r8, lr, and flags\
  \ N/Z/C/V */\n"
details: "The function reads four signed 16-bit coordinate fields from an OWObjectCoords\nobject at offsets\
  \ 2 (cur_x), 6 (cur_y), 0xE (tgt_x), and 0x12 (tgt_y). It\ncomputes the deltas and their absolute values,\
  \ then dispatches one of three\nBresenham loops based on which axis dominates:\n\n  * |dx| > |dy|  ->\
  \ step along X (sx), adjust Y (sy) when 2*ady error crosses adx\n  * |dx| < |dy|  -> step along Y (sy),\
  \ adjust X (sx) when 2*adx error crosses ady\n  * |dx| == |dy| and dx != 0 -> diagonal, step both axes\
  \ each iteration\n  * dx == dy == 0 -> degenerate single draw at tgt position\n\nEach step calls sub_8030DA2\
  \ with a packed register state; r3 always carries\nthe per-axis step direction (+1 / -1) and r5 carries\
  \ the running Bresenham\nerror term. The initial draw seeds using obj->next_x (offset \"NextX\") and\n\
  obj->next_y (offset \"NextY\"). The final draw after the loop uses the current\nposition fields (offsets\
  \ 2 / 6).\n\nPushes {r0, r5} on entry to preserve them across the inner calls and\nrestores them before\
  \ the trailing sub_8030DA2 call and return. The sx step\nsign is also returned to the caller in r3 (via\
  \ the C model's return value).\n"
