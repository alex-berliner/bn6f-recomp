    args; strb r1,[r4,#1] from oBattleObject_Param1: parent param copied into collision data; mov r0,#0xff;
    bl object_setCollisionHitEffect: hit effect explicitly set to 0xFF; str r0 (=CUR_STATE_UPDATE),[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]:
