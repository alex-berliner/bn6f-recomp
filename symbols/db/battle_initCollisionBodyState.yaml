name: battle_initCollisionBodyState
address: '0x080D956C'
kind: function
status: probable
summary: 'Spawn/init phase of a battle object: builds its collision body (kind 0x39) from its panel position,
  then advances it to the update state.'
interface: (r5 = battle object) -> r0 = destroyed?; returns early via object_freeMemory if no collision
  slot; otherwise object state set to CUR_STATE_UPDATE
details: 'Runs as the object''s initial state handler: it first calls an unknown helper sub_80D9682, recomputes
  pixel X/Y from the object''s panel coords (object_setCoordinatesFromPanels), then allocates a collision-data
  slot (object_createCollisionData); if allocation fails the object frees itself. On success it initializes
  the collision block with kind 0x39 and flag-table args 2/3 (object_setupCollisionData), copies oBattleObject_Param1
  into collision byte 1, and sets hit effect 0xFF (likely ''no effect''). It then refreshes collision
  for the frame (object_presentCollisionData), mirrors PanelX/PanelY into object fields 0x6A/0x6B (remembered
  spawn/current panel), and writes CUR_STATE_UPDATE into the state/phase field so the next run uses the
  update handler.'
