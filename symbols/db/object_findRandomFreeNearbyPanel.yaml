name: object_findRandomFreeNearbyPanel
address: '0x08108C10'
kind: function
status: probable
summary: Picks a random free battle panel in the 3x3 area around an object (falling back to anywhere,
  then to its own tile), using temporary panel reservations to filter out occupied/claimed tiles.
interface: (r0 = object whose byte 0x13 (row) is the ignore-row for the panel scan, r2 = required panel
  attribute mask, r3 = forbidden panel attribute mask, r5 = object whose x/y at +0x12/+0x13 anchor the
  offsets) -> r0 = panel column, r1 = panel row; no flags of interest
details: It walks a 9-entry table at byte_8108CA8 of signed (dx,dy) offsets — (0,0) plus the 8 surrounding
  tiles — and calls object_reservePanel for each tile around the object at r5+0x12/+0x13, so reserved
  panels count as unavailable. It then calls object_getPanelsIgnoreColumnFiltered (skipping the row in
  r0's byte 0x13, applying the r2/r3 attribute masks) into a stack buffer, releases all nine reservations,
  and if any candidates were found picks one with GetPositiveSignedRNG modulo the count (svc 6), unpacking
  the packed (col | row<<4) byte into column and row. If no nearby panel passes the filter it retries
  with object_getPanelsExceptCurrentFiltered over the whole grid; if that also fails it returns the object's
  own x/y unchanged.
