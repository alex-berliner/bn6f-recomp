name: m4aSoundVSync
address: '0x0814F00C'
kind: function
status: confirmed
summary: VSync hook of the M4A sound driver; on a VSync tick, decrements a frame gate and, when it expires, restores
  its period and re-kicks the two Direct Sound DMA channels.
interface: void m4aSoundVSync(void) // clobbers r0,r1,r2,r3 and N/Z/C/V; lr saved+restored via push/pop
details: 'Reads the M4A driver state pointer stored at `byte_3007FF0`. The first word of that block

  (offset 0) is the driver''s stamp; the body computes `stamp + 0x978C92AD` and bails out (no

  sound work) unless that sum is 0 or 1, matching how the driver "claims" the block on init.


  Inside the guard, byte at offset 4 of the state block is a per-VSync countdown. It is

  decremented each call and the signed result is tested against 0; while it is still positive

  the function returns without touching hardware. When the countdown reaches zero it is

  reloaded from the byte at offset 0xB (the "period" / sub-frame rate for Direct Sound

  streaming) and the two DMA channels used for sample streaming are re-armed.


  The DMA work uses GBA register symbols already named in the disassembly:

  `DMA1WordCount` (0x40000D8) and `DMA2WordCount` (0x40000E8) are first conditionally

  force-reloaded with `0x84400004` (full-word-count reload) only if the channel is still

  armed (bit `0x80<<18` set). Then `DMA1Control` / `DMA2Control` are written twice: first

  with `0x0400` (32-bit, channel disabled) to halt them, then with `0xB600`

  (repeat + 32-bit + start + IRQ) to re-launch streaming in lockstep. Both channels are

  driven together so the paired Direct Sound streams stay in sync.


  Quirks: the original epilogue is `pop {r0}; bx r0`, which both returns control to the

  VBlank caller and sets r0 to the saved LR; r1..r3 are whatever the chosen exit path

  last left in them, and N/Z/C/V reflect the CMP/MOVS on that path (the readable C

  reconstructs all of this through a `SoundVSyncExit` struct and a single

  `SET_FLAGS_ADD`).

  '
