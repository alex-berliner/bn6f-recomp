name: timer_tickCountdownTable_8035738
address: '0x08035738'
kind: function
status: confirmed
summary: Ticks a table of 32 countdown timers, decrementing each active entry once per call.
interface: void sub_8035738(void); // inputs r4-r7 (preserved), lr; outputs r3 = last computed value, C/V/NZ from
  final subtract or loop compare
details: 'Walks a fixed 32-entry table at dword_2000DC0 with 8-byte stride. Each entry is { u32 timer @ +0, u32
  active @ +4 }. For every entry whose active flag is nonzero, the timer is decremented and written back. Quirk:
  if an active entry''s timer is already 0, the decrement would go negative - the routine bails out immediately
  without storing, leaving the decremented value in r3 (flags from the subtract). Normally timers are re-armed before
  hitting zero elsewhere, so the underflow path is likely an error/safety case. Normal exit after all 32 entries
  leaves flags from the final loop compare (r4 == 0x20, C set, Z set). r3 on normal exit holds the last entry''s
  active flag. The table''s purpose (what entity or effect these timers drive) is not identified from this routine
  alone; likely a subsystem-wide timer list (screen effects, delays or similar).

  '
