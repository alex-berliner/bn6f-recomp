name: reqBBS_81409F4
address: '0x081409F4'
kind: function
status: confirmed
summary: Returns the current game state's coord-interaction value (u8), used as a condition for the BBS/quest request
  it gates.
interface: u32 reqBBS_getCoordInteractionValue_81409F4(u32 toolkitR10); // r10 = toolkit ptr, returns u8 zero-extended
  in r0
details: Tiny accessor from a family of "req" requirement-check functions (used to evaluate whether a BBS/request-related
  condition is met). Loads the toolkit's GameState pointer (r10 + oToolkit_GameStatePtr), then reads the single
  byte at GameState + oGameState_CoordInteractionValue and returns it zero-extended in r0. No side effects; clobbers
  only r1 (holding the GameState pointer temporarily) and lr via push/pop {lr}/pop {pc}. Padded with two zero bytes
  to 4-byte alignment. The CoordInteractionValue field presumably stores the id/type of the coordinate (tile) the
  player is currently interacting with, which the caller compares against an expected value.
