name: battle_elementHitDispatcher
address: '0x080ED374'
kind: function
status: confirmed
summary: AI attack trampoline that jumps to one of three element-specific hit handlers based on the hit-element
  byte in the AI attack vars.
interface: "void battle_elementHitDispatcher(u32 hitElement /* read from r7+oAIAttackVars_HitElement */,\n     \
  \                            u32 arg_r3, u32 arg_r5, u32 arg_r6, u32 arg_r10);\n// in: r0 (don't care, overwritten),\
  \ r1 (overwritten), r3, r5, r6, r7 (ptr to AI attack vars), r10, lr // out: r1, r5, r8, r9, r10, r11, r12 = whatever\
  \ the chosen handler left behind; flags clobbered (nzcv)\n"
details: 'Tail-call dispatcher: loads the HitElement byte from the AI attack vars struct at r7+oAIAttackVars_HitElement
  and uses it directly (unscaled ldr, so the byte holds the byte offset 0/4/8, i.e. element index 0-2) to pick an
  entry from the jump table off_80ED388 (sub_80ED394, sub_80ED3B6, ai_attackSpawnTimedTempObject). It then does
  "mov lr, pc / bx r1", so the chosen handler returns through the dispatcher''s pop {pc} straight back to the dispatcher''s
  caller; the handler is entered with r0 = the HitElement byte and r1 = its own table entry address, with r3, r5,
  r6, r7 and r10 passing through untouched. All "outputs" are simply the handler''s leftovers. Element cases 0 and
  1 go to dedicated handlers at 0x080ED394 and 0x080ED3B6; case 2 (and anything that lands on the last slot) spawns
  a timed temp AI attack object via ai_attackSpawnTimedTempObject.

  '
