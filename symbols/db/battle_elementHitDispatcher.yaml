name: battle_elementHitDispatcher
address: '0x080ED374'
kind: function
status: probable
summary: Dispatches to an element-specific hit handler chosen by the attacker's HitElement field in the AI attack
  vars.
interface: (r0 = element index read from [r7+oAIAttackVars_HitElement], r7 = AI attack vars struct) -> jumps (via
  lr=pc trick) to handler off_80ED388[element]; tail-calls one of sub_80ED394/sub_80ED3B6/sub_80ED41C with r0 still
  holding the element.
details: Loads the HitElement byte from the caller's AI attack vars struct at r7, indexes the pointer table at off_80ED388,
  and branches to the selected handler with lr set to the return address so it acts as a tail call (pop {pc} returns
  to the original caller). The table has exactly three entries, matching the three element values used for AI attacks.
  The callee receives the element in r0, suggesting the handlers share the element value or that r0 is simply preserved.
  This is a standard per-element switchboard; without the callees' behavior it is not known which effects (e.g.
  burn/freeze/paralysis) each branch performs.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0]; bx r1 — direct indexed jump on HitElement; off_80ED388
    holds exactly 3 handler pointers (sub_80ED394+1, sub_80ED3B6+1, sub_80ED41C+1); mov lr,pc; bx r1; pop {pc} —
    tail-call pattern returning straight to the original caller; HitElement lives in the AI attack vars struct (oAIAttackVars_
    prefix), tying this to the battle AI attack pipeline
  refs:
  - bn6f/asm/asm31.s:114599
  reproduce: python3 tools/asmcat.py 0x080ED374
