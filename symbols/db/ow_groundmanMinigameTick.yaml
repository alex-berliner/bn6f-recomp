name: ow_groundmanMinigameTick
address: '0x08143978'
kind: function
status: probable
summary: 'Groundman minigame overworld tick: sets event flags 0x1670..0x169F, returns early if sub_8143C18''s
  flag is set, updates a coordinate state, spawns overworld map object 0x2B for each per-map grid entry
  whose flag is unset, and if EVENT_D36 is set starts the cutscene script at byte_8093358 (param 0) before
  clearing D30/D34/D35/D36.'
interface: () -> r0 = 0; no flags guaranteed — clears event flags 0x1670..0x169F, D30, D34, D35, D36 and
  spawns overworld map objects
details: 'First sets a run of 0x30 consecutive event flags starting at EVENT_1670, then after sub_8143C18
  tests a flag and returns 0 early if set. It reads a state struct via r10+0x3C: compares bytes at +4
  vs +0xC and +5 vs +0xD (two coordinate pairs); if they differ it calls sub_8143C30. It indexes a per-map
  table (off_8143A4C, GetGroundmanMinigameMapIndex) of 4-byte entries {flagByte, paramByte, gridCoords
  u16}; for each non-0xFF entry it derives a flag via sub_8143B5E, and if not set, clears it and calls
  SpawnOverworldMapObject(0x2B, ConvertGroundmanMinigameGridCoordsToMapCoords(entry+2)). After the 0xFF
  terminator, entry+1 goes to sub_8143F58, then sub_8143C88/sub_8143C62 run; if EVENT_D36 is set it starts
  cutscene script byte_8093358 (param 0), runs sub_8143F38, and clears D36, then clears D30/D34/D35 and
  returns 0.'
