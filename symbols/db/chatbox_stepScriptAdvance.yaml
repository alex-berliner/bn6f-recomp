name: chatbox_stepScriptAdvance
address: '0x0809AADC'
kind: function
status: probable
summary: Cutscene step that checks the chatbox-active flag and either queues follow-up script 0xC from
  the 0x2033404 archive (advancing a controller state) or re-queues script 0xB while the chatbox is busy.
interface: (r0 unused, r5 = controller/task struct) -> r0 = 0 when a script was run, 1 when the chatbox
  flag bit was clear; writes byte [r5+8], word [r5+0x84], event flag EVENT_1725
details: First it tests bit 3 of the chatbox flag word eFlags2009F38 via chatbox_mask_eFlags2009F38(8);
  if clear it does nothing and returns 1. If the chatbox state (low 3 bits of the same word, chatbox_GetState_8045F4C)
  is nonzero it runs script index 0xB from the TextScriptArchive at 0x2033404, stores 0 into byte r5+8,
  and returns 0. If the state is 0 (chatbox idle) it instead runs script index 0xC, stores 1 into byte
  r5+8, stores 8 into the word at r5+0x84 (likely the owning state machine's next state/mode), clears
  story flag EVENT_1725, and returns 0. r5 appears to be a cutscene/step-controller struct set up by the
  caller; the byte at +8 looks like a done/waiting flag and +0x84 a next-state field.
