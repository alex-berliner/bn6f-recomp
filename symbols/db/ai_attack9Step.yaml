name: ai_attack9Step
address: '0x08101E24'
kind: function
status: probable
summary: 'AI attack-9 state step: first invocation queues the panel-choose attack setup, then on later
  invocations resets the AI script state and runs the post-move follow-up.'
interface: (r6 = AI state object, r7 = AI attack vars) -> r0 = 0; no meaningful return
details: Reads oAIState_AttackDecisionFlag from the AI state struct at r6; when clear, writes 4 to that
  flag and tail-calls ai_setupAttack9PanelChoose (which saves the chosen panel/object and starts attack
  9). Once the flag is set, it zeroes oAIState_ScriptId and oAIState_SubState, checks oAIAttackVars_HasMoved
  at r7, and only then calls sub_8101F70 (unknown follow-up, likely executing the attack after the move).
  Reached via recorded battlesweep routes with no direct caller found, so it is presumably dispatched
  through the AI script/state table.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/tst on [r6,#oAIState_AttackDecisionFlag] gates two phases (sub_8101E24+2..+A); bl ai_setupAttack9PanelChoose
    with flag=4 stored first shows it arms attack 9 panel selection; strb/strh zeroing oAIState_ScriptId
    and oAIState_SubState resets the AI script state in phase 2; ldrb [r7,#oAIAttackVars_HasMoved] guards
    bl sub_8101F70, tying phase 2 to the enemy having moved
