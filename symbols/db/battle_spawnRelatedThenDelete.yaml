name: battle_spawnRelatedThenDelete
address: '0x080E8AA4'
kind: function
status: probable
summary: 'Battle-object handler: on first call spawns a related type-1 object via spawnType1Object_0x24
  using owner''s panel/element/damage data and r5+5 as an arg, then marks PhaseInitialized=4; when Param2
  is 0 sets CurAction=0xC and clears CurPhaseAndPhaseInitialized to end the object.'
interface: (r0 = ignored, r5 = battle object pointer) -> r0 = garbage; sets object fields, no meaningful
  flags
details: Runs as a per-object phase routine with r5 = battle object. If oBattleObject_PhaseInitialized
  is 0 it reads PanelX, PanelY, Element, and DamageAndStaminaDamageCounterDisabler + Z16Save (a damage/position
  value), fetches oBattleObject_RelatedObject1Ptr, and calls spawnType1Object_0x24_80BF6AE to spawn the
  associated 0x24-byte object with these parameters (r4=0, r7=r5+5 passed as extras). It then stores 4
  into PhaseInitialized so the spawn happens only once. Every run it checks oBattleObject_Param2 (likely
  a lifetime counter decremented elsewhere); when it is 0 it writes 0xC to oBattleObject_CurAction and
  clears CurPhaseAndPhaseInitialized, which ends the object. The function returns immediately without
  doing anything while Param2 is nonzero.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb PhaseInitialized / bne loc_80E8ACC: spawn block guarded to run only once, then stores
    4 into PhaseInitialized; loads PanelX/PanelY/Element and DamageAndStaminaDamageCounterDisabler+Z16Save
    into r0-r3 before bl spawnType1Object_0x24_80BF6AE, with RelatedObject1Ptr in r5; cmp Param2,#0 /
    bne locret: waits until Param2 is 0 before finishing; str 0xC into CurAction and 0 into CurPhaseAndPhaseInitialized:
    the standard self-termination write seen in expiring battle objects'
  refs:
  - bn6f/asm/asm31.s:107115
  - 0x080BF6AE spawnType1Object_0x24_80BF6AE
  reproduce: python3 tools/asmcat.py 0x080E8AA4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is accurate in spirit but slightly misleading: the function does NOT return immediately
    while Param2 is nonzero — it falls through after the spawn-once block, then checks Param2 and either
    self-deletes or simply ends without further work. Also, the ''clear CurPhaseAndPhaseInitialized''
    note is correct (strh writes 2 bytes, clearing that field). The spawn call passes r4=0, r7=r5+5, not
    the other way around, but this is consistent. Behavior is correct overall.; run wf investigate investigate-20261019-030611;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- no known caller, so which objects use this routine (which custom/related object links to it) is unknown
- exact meaning of Param2 (lifetime counter vs. trigger flag) and how it is decremented
- what the spawned 0x24-byte object is and the semantics of the r4/r7 extra arguments to spawnType1Object_0x24_80BF6AE
- 'The summary is accurate in spirit but slightly misleading: the function does NOT return immediately
  while Param2 is nonzero — it falls through after the spawn-once block, then checks Param2 and either
  self-deletes or simply ends without further work. Also, the ''clear CurPhaseAndPhaseInitialized'' note
  is correct (strh writes 2 bytes, clearing that field). The spawn call passes r4=0, r7=r5+5, not the
  other way around, but this is consistent. Behavior is correct overall.'
