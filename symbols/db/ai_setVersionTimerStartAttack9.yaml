name: ai_setVersionTimerStartAttack9
address: '0x08113674'
kind: function
status: probable
summary: AI state handler that loads a version-dependent timer value, queues attack 9, and switches the
  AI script to id 4.
interface: (r4 = AI entity, r7 = AI attack vars, r6 = AI state) -> r0 = 0 from callee; sets StepTimer,
  attack, ScriptId
details: Reads the entity's AI version byte (oAIData_Version_16) and uses it to index byte_8113620, a
  per-version lookup table, storing the fetched byte into oAIAttackVars_StepTimer (a step/cooldown timer).
  Calls object_setAttack0 with r0=9 to start attack id 9, then writes 4 to oAIState_ScriptId, changing
  which AI script/state runs next. The version table suggests this behavior differs between game versions
  or enemy variants. With no direct callers it is presumably reached via an AI state/script dispatch table.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r4,#oAIData_Version_16]; ldr r0,off_8113730 (=byte_8113620); ldrb r0,[r0,r1] — timer
    comes from a per-AI-version table; strh r0,[r7,#oAIAttackVars_StepTimer] — fetched byte is stored
    as the step timer; mov r0,#9; bl object_setAttack0 — queues attack 9 via the known attack setter;
    mov r0,#4; strb r0,[r6,#oAIState_ScriptId] — switches AI script to id 4; no direct callers; consistent
    with dispatch via an AI state table (routes battlesweep/beastsp)
