name: cross_loadEntryFields_8098CCC
address: '0x08098CCC'
kind: function
status: confirmed
summary: Loads one Cross System entry's fixed fields (selected by an index in the work area) into the work area,
  and writes the entry's partner-character id into the partner state block when one is defined.
interface: u32 sub_8098CCC(void* work /* r5 */, void* state /* r10 */); returns 0 in r0, partner-state pointer in
  r2, flags NZ from the final mov r0,#0; clobbers r0-r2, c, v; lr returned to via mov pc,lr
details: 'Reads a 1-byte index from work+0x04 and selects a 0x14-byte record from the table at off_8098C28 (entry
  = off_8098C28 + 0x14 * index), storing that pointer at work+0x34. Copies three fixed fields out of the record:
  record+0x13 to work+0x05, record+0x10 to work+0x06, and record+0x11 to work+0x07. Then fetches the partner state
  block pointer from state+0x3C; if record+0x12 (partner id) is not 0xFF, writes the id to partner+0x16 and a 0xFF
  terminator to partner+0x17 (a two-byte "id, 0xFF" pair, suggesting a null-terminated partner id list in the partner
  state block). If the id is 0xFF the partner block is left untouched (note: the pointer is still loaded and returned
  in r2 even then). Always terminates with r0 = 0 and Z set, so callers can test the flag as a "done/success" result.
  r2 keeps the partner state pointer for the caller.

  '
