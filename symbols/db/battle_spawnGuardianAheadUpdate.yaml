name: battle_spawnGuardianAheadUpdate
address: '0x080E679C'
kind: function
status: probable
summary: Per-frame update for a battle object that, once, spawns its guardian (kind 0x7d) on the panel
  directly in front of it if that panel's state passes a flag check, then waits 30 frames before ending
  the action.
interface: (r0-r3 scratch, r5 = battle object ptr) -> void; sets oBattleObject_Timer/PhaseInitialized/CurAction
  on r5, return value unused
details: On first run (PhaseInitialized == 0) it calls object_getFrontDirection to get +1/-1 facing, computes
  the front panel (PanelX+dir, PanelY), and tests it with object_checkPanelParameters using must-set mask
  0x10 (r2) and must-clear mask 0x0F880080 (r3, from dword_80E6808) — i.e. the panel must be in a specific
  state (e.g. normal, not hole/broken). If the check passes it calls spawnGuardianObject, forwarding the
  object's Element, Params, and Damage field plus Z16Save (added to the damage argument, likely lifetime/counter),
  with r5 as the object to register. Either way it sets Timer=0x1E and PhaseInitialized=4, so subsequent
  frames just decrement Timer; when it reaches 0 it sets CurAction=0xC and clears phase, handing control
  back to the object's action dispatcher. Note the spawn is skipped silently on failure but the 30-frame
  wait still runs, so the action ends without a guardian if the front panel is invalid.
