open_questions:
- Exact meaning of the panel flag masks 0x10 (r2) and 0x0F880080 (r3) — which panel states are accepted/rejected
- Which chip/enemy action dispatches CurAction value that leads here, to name the specific guardian variant
- Whether Z16Save added to the damage field is a lifetime/tile-count for the guardian
