name: battle_initAttack2bState
address: '0x0802ED8A'
kind: function
status: probable
summary: Battle-side setup routine that initializes an entity's action state and arms attack 0x2b with
  a counter bump.
interface: (implicit r6 = battle entity/object work struct) -> r0 = 1, r1 = 0; no flags returned
details: 'Writes a fixed configuration into the struct at r6: byte +2 = 0, byte +3 = 3, bytes +4/+5 =
  0, halfwords +6/+8/+0xA = 0, and a word 0x23C at +0xC (likely an ID, timer, or handler reference). It
  then calls battle_addCounterAmount with 0x8B — an encoded amount whose bit 7 selects the capped/alternate
  add path, i.e. it bumps the entity''s counter at field +0x28 — and object_setAttack0 with 0x2B, assigning
  attack slot 0 attack ID 0x2B. It returns r0 = 1, r1 = 0, the usual ''done/continue'' pair of battle
  AI script steps. r6 is never loaded inside the function, so it is supplied by the dispatcher; no caller
  is known, so the exact struct owner is unconfirmed.'
