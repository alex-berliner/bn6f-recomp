name: sub_811A4DC
address: '0x0811A4DC'
kind: function
status: confirmed
summary: Dispatches to a per-state sprite update handler picked by the state field at r5+4, then runs the shared
  sprite_update.
interface: void sub_811A4DC(struct Sprite* r5 /* work pointer */);  // clobbers r0,r1,r2,r3,r4,r6,r7,r8,r9,r10,r11,r12,lr;
  flags NZ C V
details: 'Reads the 1-byte state index at offset 4 of the r5 sprite/work object, doubles it

  to a word, indexes off_811A4F4 (a 2-entry Thumb dispatch table at 0x0811a4f4 holding

  sub_811A4FC+1 for state 0 and sub_811A500+1 for state >=1), and tail-calls the

  selected handler via "mov lr,pc; bx r0" so control falls through into sprite_update

  after the handler returns. Every handler therefore ends up running sprite_update

  before this thunk pops pc. No other registers are preserved; r5 carries the work

  pointer in.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
