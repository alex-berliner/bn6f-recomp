name: init_eStartScreenAnimationControl200B1A0_1
address: '0x0803E900'
kind: function
status: confirmed
summary: Resets the 8-byte start-screen animation control block to zero and marks it active with state 0xB4.
interface: void startScreen_initAnimationControl200B1A0(void); /* preserves r2/r4, returns r0=0xB4 with NZ flags
  set from it */
details: 'Loads the fixed address eStartScreenAnimationControl200B1A0 into r4, clears all 8 bytes of the control
  block via ZeroFillByByte, then stores the byte 0xB4 at offset +3. Offset 3 appears to be the state/active flag
  of the animation control: 0xB4 is presumably a "running/initialized" state code used by the e-reader start-screen
  animation updater. Returns r0 = 0xB4 (flags NZ set from that value), matching the store, which callers may or
  may not consume.

  '
