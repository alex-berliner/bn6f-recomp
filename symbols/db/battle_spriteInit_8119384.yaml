name: battle_spriteInit_8119384
address: '0x08119384'
kind: function
status: confirmed
summary: Initialize a battle sprite object from its character/team indices, setting graphic, animation,
  palette, priority, slot halfword, sub-entry palette bank, sub-record field A, and final state fields.
interface: void sub_8119384(u32* obj /* r5 */)
details: "Reads char_idx from [obj+4] and team_idx from [obj+5].\nClears the \"forced\" bit (0x10) from\
  \ char_idx if set, and writes 1 to [obj+0xA].\nWrites a sprite-type byte to [obj]: 0x23 if char_idx==1\
  \ (Net.EXE), 0x83 otherwise.\nIf char_idx==0, calls sub_81195E4 with the sprite type (special-case handler).\n\
  Then performs a series of per-team/per-character table lookups (base tables indexed by\ndword_8119624\
  \ / dword_811963C; team tables off_81191B4, off_8119208, off_8119128,\noff_8119170, off_8119228, off_811924C)\
  \ and drives the GUI sprite setup:\n  - initGuiSprite_8002770(base_graphic=tab8119624[char_idx], sprite_ptr=tab81191B4[team][char])\n\
  \  - sprite_setAnimation(anim_id=tab811963C[char_idx])\n  - sprite_loadAnimationData\n  - sprite_noShadow\n\
  \  - sprite_setPalette(0)\n  - sprite_setPriority_8002E14(tab8119208[team][char])\n  - slotList_storeHalfwordAndClearField_800306C(tab8119128[team][char])\n\
  \  - sprite_setSubEntryPaletteBank_800304A(tab8119170[team][char])\n  - sprite_setSubRecordFieldA_8003060(tab8119228[team][char])\n\
  If char_idx==0, also calls object_writeSubstructField30_8002FEC(tab811924C[team]).\nFinally writes the\
  \ post-init state fields:\n  [obj+0x08] = 4, [obj+0x10] = 0x00FF (low half of 0xFF strh), [obj+0x0D]\
  \ = 0xFF,\n  [obj+0x1A] = 0x00FF, [obj+0x13] = 0, then calls sub_81196A0 to finalize.\nQuirk: the `mov\
  \ r0,#0xFF` followed by strh stores only 0x00FF (low 16 bits), not 0xFFFF.\n"
