summary: Entry stub of the battle object/enemy spawner; sets up the shared frame and tail-branches into the spawner
  body at loc_80076A8.
interface: BattleObject *battle_spawnEnemyObject_800768C(u16 enemy_idx, u8 panel_x, u8 panel_y, bool alliance, u32
  a5 /* in r5 */)
details: 'Frame-setting prologue only: pushes r4-r7/LR, reserves a 0x14-byte local frame shared with the spawner
  body (slots 0x0 enemy index, 0x4 panel x, 0x8 panel y, 0xC alliance flag, 0x10 running result), zeroes the local
  at stack_800768C_unk_10, then tail-branches (b, not bl) to loc_80076A8, a second entry point inside the spawner
  body. Because the branch is unconditional and the shared body pops this stub''s saved r4-r7/LR and returns directly
  to the original caller, control never comes back to this stub; the return value (BattleObject pointer in r0) is
  produced entirely by the body at loc_80076A8. The actual spawn logic (enemy lookup, panel placement, alliance/team
  handling, object allocation) therefore lives in the body, not here; this stub exists so the spawner can be called
  with the full argument set while loc_80076A8 also serves as an internal re-entry point.'
