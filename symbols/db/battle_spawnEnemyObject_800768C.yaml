  body. Because the branch is unconditional and the shared body pops this stub''s saved r4-r7/LR and returns directly
  to the original caller, control never comes back to this stub; the return value (BattleObject pointer in r0) is
  produced entirely by the body at loc_80076A8. The actual spawn logic (enemy lookup, panel placement, alliance/team
  handling, object allocation) therefore lives in the body, not here; this stub exists so the spawner can be called
  with the full argument set while loc_80076A8 also serves as an internal re-entry point.'
