name: t4_updateChoiceOamAndPlayerBox
address: '0x081307F4'
kind: function
status: probable
summary: Refreshes a T4 object's choice sprite and, when enabled, its player HP/emotion box.
interface: (r0 = objectQueueChoiceOam context, r5 = current object) -> r0 = unchanged; flags clobtered
details: Runs only when the object byte at +1 equals 8 and the byte at +0x49 equals 4. It passes the current
  object to object_queueChoiceOam, then invokes t4_drawPlayerBox. The function leaves r0 as object_queueChoiceOam
  returns it and does not otherwise alter the current object pointer. Its two call sites are consistent
  with frame or scene update routines.
