name: pet_copyCurNaviStat42To40
address: '0x0803CEF8'
kind: function
status: probable
summary: Copies one u16 stat field (0x42) of the navi currently selected on the PET into another field
  (0x40) of the same navi's stats entry.
interface: (r0 = navi selection/index u8) -> r0 = destroyed; no flags returned
details: Takes the PET navi selector in r0, reads u16 stat 0x42 from the toolkit navi-stats table via
  GetCurPETNaviStatsHword, then writes that value back into stat 0x40 of the same entry via SetCurPETNaviStatsHword.
  It is a one-field copy inside the current navi's stats record; r4-r7 are pushed only to preserve r4
  across the calls. The semantics depend on the unknown navi-stats field layout — 0x40 and 0x42 are likely
  adjacent fields (e.g. a current/max pair or a value and its mirror).
