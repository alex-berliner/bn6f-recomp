name: doPETEffect_8033fc0
address: '0x08033FC0'
kind: function
status: confirmed
summary: Queues a PET effect by writing its index into the eS2011E30 state block, clearing the pending-effect flag,
  and playing sound 0x9B for effect 3.
interface: void pet_SetEffect_8033fc0(u32 effect /* r0 */); // returns r0 = effect (or PlaySoundEffect result when
  effect == 3), flags from `cmp effect,
details: Writes the requested effect index (r0) into byte oS2011E30_Idx_04 of the global eS2011E30 state block and
  zeroes oS2011E30_Unk_07 (the pending-effect/request byte), presumably so the PET update loop consumes the new
  effect exactly once. If the effect index is 3, it additionally plays sound effect 0x9B via PlaySoundEffect; for
  all other indices no sound is played. Only r5 and lr are saved/restored; the effect index is preserved in r0 on
  the non-sound path, which matches the callers' contract. The block eS2011E30 appears to be the PET-related state
  object whose fields drive the PET screen effect renderer elsewhere.
