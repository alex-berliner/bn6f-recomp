name: util_nandByteArray40_80AAB88
address: '0x080AAB88'
kind: function
status: confirmed
summary: Computes a bitwise NAND of two 40-byte buffers into a third (dst[i] = ~(srcA[i] | srcB[i]))
interface: void util_nandByteArray40(const u8* srcA /*r0*/, const u8* srcB /*r1*/, u8* dst /*r2*/)
details: 'Simple elementwise loop over exactly 0x28 (40) bytes: for each index it loads a byte from srcA (r6) and
  srcB (r7), ORs them, bitwise-inverts with MVN, and stores the result to dst (r5). Effectively dst[i] = ~(srcA[i]
  | srcB[i]) = NOT(srcA[i] OR srcB[i]) — bits in the destination are set only where BOTH sources are clear at that
  bit position, so it works equally well as a per-byte boolean op on flag/flagmask arrays or as a raw bitwise op.
  No overlap handling; if dst aliases a source the earlier written bytes would feed later reads. Clobbers r0-r3;
  returns r3 = 0x28 and r1 = the last byte read from srcB, with the final CMP (r3 vs 0x28) flags left set (C set,
  V clear, Z set) — the register contract shows some callers inspect C/V, though the flags are just the loop-exit
  compare and unlikely to be meaningful. The 40-byte length suggests a fixed-size flag/checkbox set (e.g. a 40-entry
  unlocked/collected mask) rather than panel or chip data, but the function is fully generic; callers would define
  the purpose.

  '
