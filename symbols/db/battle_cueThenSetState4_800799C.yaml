name: battle_cueThenSetState4_800799C
address: '0x0800799C'
kind: function
status: confirmed
summary: Plays some battle cue/step via sub_801FE24, then stores battle-state value 4 into the state struct and
  returns.
interface: void sub_800799C(battle state in r5 /* preserved */, other args in r2-r4, r6-r7, r10); out r0 = 4, r1-r3
  scratch, NZ flags set from 4
details: 'Tiny two-step battle-state handler. It first calls sub_801FE24 (which presumably performs

  the actual work for this phase of the battle, using values the caller left in r2-r4, r6-r7

  and r10, since this wrapper sets none of them). On return it writes the immediate 4 as a

  byte to r5+0x02 (oBattleState_Unk_02), i.e. it advances/sets the battle state machine to

  state 4. r5 is a battle-state/context struct pointer that the caller provides and that is

  preserved across the call. Quirk: the store reuses the "mov r0, #4" that also sets N/Z

  (value 4, positive, not zero) and leaves C/V untouched, so the flag state on return is a

  side effect of the constant load rather than anything meaningful.

  '
