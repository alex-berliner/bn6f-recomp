name: sub_801C984
address: '0x0801C984'
kind: function
status: hypothesis
summary: Calls the checker at sub_802CE60 twice (with 0 and 1) and stores each answer as a 0/1 boolean into two
  byte fields of the struct at r5.
interface: 'void sub_801C984(struct *r5 /* +7, +9 written */); callers pass r5, r10 (unused here) and lr; returns
  r0 = (sub_802CE60(1) != 0 ? 1 : raw second answer), r1-r2 and NZCV from the tail of the second query''s compare/mov
  sequence'
details: Wrapper that normalizes two queries of sub_802CE60 into booleans. First calls sub_802CE60 with r0=0, converts
  the result to 0/1 with CMP + BEQ/MOV, and stores it at [r5+7]. Then calls sub_802CE60 with r0=1, again normalizes
  to 0/1, and stores it at [r5+9]; the normalized value is also left in r0 so the caller sees the second answer,
  with flags reflecting the final CMP/MOVS. The +7 and +9 fields of the r5 struct are byte-sized flags, suggesting
  the struct holds per-slot (0 and 1) state such as connection or selection status, but the meaning of sub_802CE60's
  argument and result is not confirmed, so the game-level reading is a guess. r10 is received from callers but never
  read in this function.
