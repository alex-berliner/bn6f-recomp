name: ai_attackTeleportToTargetPanel
address: '0x080F6C76'
kind: function
status: probable
summary: AI attack step that instantly moves the acting battle object onto the target panel, resets its
  animation, and queues a hit with element 0xC.
interface: (r0 = battle object ptr? unused/ignored, r5 = battle object, r7 = AI attack vars) -> r0 = 0;
  stores CurAnim=0, PanelX/Y = TargetPanelX/Y, HitElement=0xC
details: Zeroes the object's current animation, copies the target panel coordinates from the AI attack
  variables (oAIAttackVars_TargetPanelX/Y) into the object's PanelX/PanelY, then calls object_setCoordinatesFromPanels
  to recompute pixel position and object_updateCollisionPanels to sync collision panels and facing. Calls
  the unknown helper sub_80F7154 (likely the follow-up damage/attack effect given it runs after the move
  completes). Finally stores 0xC into oAIAttackVars_HitElement, suggesting a caller state machine reads
  this element for the resulting strike.
