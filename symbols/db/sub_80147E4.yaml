name: sub_80147E4
address: '0x080147E4'
kind: function
status: confirmed
summary: Installs two 0x10-byte chatbox text/portrait descriptor blocks, copying each into both the live chatbox
  state (dword_20367F0) and the cached copies (unk_203A980 / unk_203A990), then resets the word counter and flags
  the state as active.
interface: void sub_80147E4(const u32 *src0 /* r0 = byte_203F558 */, const u32 *src1 /* r1 = byte_203F658 */)
details: "Operates on a chatbox descriptor state object rooted at dword_20367F0 (an EWAM-style state\nstruct: a\
  \ u32 counter at offset 0, a u8 active flag at offset 4, then two 0x10-byte\ndescriptor blocks at offsets 8 and\
  \ 0x18, likely a \"before/active\" or \"line A / line B\"\npair consumed by the text-window engine).\nFour CopyWords\
  \ calls of 0x10 bytes each fan the two source blocks (passed in r0/r1, coming\nfrom the chatbox's per-line buffers\
  \ byte_203F558 / byte_203F658) into:\n  - dword_20367F0 + 0x08  (live slot 0)\n  - unk_203A980            (cached\
  \ slot 0)\n  - dword_20367F0 + 0x18  (live slot 1)\n  - unk_203A990            (cached slot 1)\nAfter the copies,\
  \ the u32 word counter at dword_20367F0+0 is cleared (str #0) and the u8\nactive byte at dword_20367F0+4 is set\
  \ to 1, which is what flags the chatbox state as live\nand ready to be ticked by the chatbox update loop.\nClobbers\
  \ r0/r1/lr and NZCV; preserves r3, r5, r6, r7 per the contract (r5-r7 are locals\nfor the base pointer and the\
  \ two src pointers).\n"
