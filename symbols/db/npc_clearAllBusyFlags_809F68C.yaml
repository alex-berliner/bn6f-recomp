name: npc_clearAllBusyFlags_809F68C
address: '0x0809F68C'
kind: function
status: confirmed
summary: Clears bit 0 of field Unk_50 on every overworld NPC object, releasing all NPCs from their "busy/mid-interaction"
  state (e.g. across a scene or map change).
interface: 'void sub_809F68C(void); // in: lr only; out: r1=1, r2=array end pointer, r3=loop-exit cursor, c/v from
  final CMP (r3 vs r2), nz clobbered'
details: 'Iterates the whole eOverworldNPCObjects array (NUM_OVERWORLD_NPC_OBJECTS entries of oOverworldNPCObject_Size
  bytes; the size literal is 0xD80 per off_809F6A8), and for each entry reads the 32-bit field at oOverworldNPCObject_Unk_50,
  clears bit 0 with BIC (mask constant 1 left in r1), and writes it back. The loop is a do/while: the body always
  runs at least once, and the terminator is a signed compare of the cursor against one-past-the-end of the array.
  Bit 0 of Unk_50 is evidently a "busy / interaction in progress" latch set while a chatbox or interaction owns
  the NPC; this function bulk-clears it so no NPC stays flagged as mid-interaction when the overworld state is torn
  down or reset. Callers get garbage-looking but harmless register results (r1=1, r2=end pointer, r3=exit cursor
  plus derived flags); no memory besides the flag bits is touched. Nearby data at off_809F6AC/dword_809F6B0/ dword_809F6B4
  references other Unk_50 flag bits (0x400 chatbox flag, 0x1000, FACE_PLAYER_WHEN_INTERACTED), corroborating that
  Unk_50 is a per-NPC flag/status word. The rest of the listing after the function is unrelated NPC script data
  sharing the file.

  '
