name: ai_attackStepDurationIdleExit
address: '0x080F939E'
kind: function
status: probable
summary: 'Per-frame AI attack step handler: arms the attack (element 4, anim 0, timer) once, then counts
  it down and exits the attack state.'
interface: (r0 = scratch, uses r5 = battle object, r7 = AI attack vars) -> r0 = object_exitAttackState
  result when timer expires; flags from decrement
details: Reads oAIAttackVars_AttackElement from the AI vars struct at r7; if zero it initializes the attack
  by writing element id 4, setting oBattleObject_CurAnim at r5 to 0, and loading oAIAttackVars_AttackDuration
  into oAIAttackVars_StepTimer as the phase length. Otherwise it decrements StepTimer each call and branches
  out while it is still positive. When the timer reaches zero it calls object_exitAttackState to return
  the object to its normal state. The hard-coded element 4 suggests this handler belongs to one specific
  enemy attack whose element is fixed. It behaves like the generic 'charge/step then release' attack pattern
  used by battle AI objects.
