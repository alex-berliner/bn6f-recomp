name: battle_setupObjectSpriteAtRelated
address: '0x080BF710'
kind: function
status: probable
summary: Loads and places a battle object's sprite from a small resource table indexed by Param1, anchoring
  it to its related object's position.
interface: (r0 = ignored, r5 = battle object) -> r0 = return of sub_80BF7BC; sets oBattleObject_NameID,
  sprite, CurAnim, position fields, Flags|2, CurStateUpdate=CUR_STATE_UPDATE
details: 'Indexes the 8-byte-per-entry table byte_80BF7A8 with Param1*8: copies entry halfword+2 into
  NameID, and if entry byte0 has bit 0x80, decompresses with sprite_decompressTemp after masking to 0x7F.
  Then calls sprite_load (entry byte0&0x7F as id, byte1 as palette/anim param) plus sprite_loadAnimationData
  and sprite_hasShadow, and resets CurAnim=0 / CurAnimCopy=0xFF. Entry bytes 4 and 5 are signed X/Y offsets
  (X multiplied by object_getFrontDirection''s facing) added to the first three words of RelatedObject1Ptr+0x34,
  and the result triple is written both to object+0x34 and +0x40; object_setPanelsFromCoordinates then
  recomputes PanelX/Y, Z is cleared, and Flags gets bit 2 set. Finally applies object_getFlip via sprite_setFlip,
  runs unpackVerActorTyAndAIIdx_800F29C on NameID to derive actor type/AI index, calls sub_8010DF6, and
  moves the object to its next state phase (CUR_STATE_UPDATE) before tail-calling sub_80BF7BC. The two
  table entries suggest only two Param1 values are valid for whatever spawns this object.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r7, off_80BF7A8; ldrb r0,[r5,#Param1]; lsl r0,#3 — table indexed by Param1, halfword at
    +2 stored to NameID; tst r0,#0x80 + bl sprite_decompressTemp, then bl sprite_load/sprite_loadAnimationData/sprite_hasShadow
    — loads the entry's sprite with compression flag; ldrsb r0,[r7,#4] / [r7,#5]; mul r0,r4 (front direction);
    add to ldmia from RelatedObject1Ptr+0x34; stmia to +0x34 and +0x40 — offsets relative to related object's
    position; bl object_setPanelsFromCoordinates; str r0,[Z]; orr Flags,#2; bl object_getFlip; bl sprite_setFlip
    — repositioning and orientation setup; ldrh r0,[r5,#NameID]; bl unpackVerActorTyAndAIIdx_800F29C;
    mov r0,#CUR_STATE_UPDATE str [CurStateActionPhase...] — registers actor and advances state machine
