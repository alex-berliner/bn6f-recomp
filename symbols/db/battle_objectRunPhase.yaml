name: battle_objectRunPhase
address: '0x080E62B4'
kind: function
status: probable
summary: 'Runs one battle object''s phase: initializes it once, steps it each call, and advances the object
  to phase 4 when the step reports done.'
interface: (r0/r4? = battle object in r5 on entry) -> r0 = clobbered; sets oBattleObject_CurPhaseAndPhaseInitialized
  = 4 when the step function signals completion
details: Reads the PhaseInitialized byte of the battle object at r5; if zero, calls sub_80E6316 (one-time
  phase setup) and stores 4 into PhaseInitialized so init never runs again. Each invocation then calls
  sub_80E6438, whose nonzero return marks the phase as finished, at which point the function stores 4
  into the CurPhaseAndPhaseInitialized halfword, ending the phase. The object pointer lives in r5, so
  this is compiled as part of a larger routine or called with r5 preset (no callers known). Note PhaseInitialized
  is written as a byte while the combined phase field is written as a halfword, consistent with CurPhaseAndPhaseInitialized
  packing phase and initialized-flag together.
