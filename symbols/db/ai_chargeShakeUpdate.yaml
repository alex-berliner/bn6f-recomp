name: ai_chargeShakeUpdate
address: '0x080FE394'
kind: function
status: confirmed
summary: 'Per-frame tick for the AI charge-shake attack: drives camera shake cycles, periodic target-column highlighting,
  and animation duration countdown.'
interface: ai_chargeShakeFrame(u32 r5 /* battleObject */, u32 r7 /* aiAttackVars */, u32 r10) -> r1, r5 (leaked
  from battle_highlightTargetColumns); no meaningful return
details: 'On first call (AttackElement == 0): sets AttackElement to 4, switches the battle

  object''s CurAnim to 4, seeds StepTimer from AttackBoost2 (attack strength),

  zeroes TimerOrCycles, starts a camera shake of magnitude 10 via

  camera_initShakeEffect_80302a8, and sets ChargeCycles to 10.

  On subsequent calls: decrements ChargeCycles each frame and restarts the

  camera shake every 10 frames. Increments TimerOrCycles and calls

  battle_highlightTargetColumns on every frame where bit 3 of the counter is

  clear (effectively every 8 frames, producing a flashing target highlight).

  Decrements StepTimer each frame; when it expires, writes HitElement = 8 to

  advance the attack to its next phase.

  Touches AIAttackVars fields AttackElement, AttackBoost2, StepTimer,

  TimerOrCycles, ChargeCycles, HitElement, and BattleObject field CurAnim.

  '
