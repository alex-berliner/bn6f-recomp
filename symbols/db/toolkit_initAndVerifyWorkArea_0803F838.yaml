status: probable
summary: 'Re-initialise the save/toolkit work area: zero and checksum the 0x6710-byte EWRAM buffer, re-seed
  RNG and the extra-toolkit pointer block, and set EVENT_1704 to reflect whether the on-disk save was
  tampered with or outdated.'
interface: (r10 = Toolkit, plus any caller globals) -> r0 = bool (FALSE if work area + info-text are still
  current, TRUE if either failed); ZF cleared/!ZF based on r0 (tst r0,r0 then pop with PC); side effects
  clobber r0..r3 (toolkit/callee state).
details: '1. Push r0..r3 with the params for a 4-arg helper: r0=0xE000100, r1=timer_2000000, r2=0x6710,
  r3=0; bl sub_814D8F0 (timed wait/sync that consumes those four args) then pop the original r0..r3 back.

  2. Pop r0..r2 into the right slots and bl encryption_save_memSetFlags_8006E0E(r0=ptr, r1=size=0x6710)
  — XORs the whole 0x6710-byte EWRAM work-area buffer with the save obfuscation key (which both decrypts
  the freshly-read save and re-encrypts the in-memory copy).

  3. bl SetExtraToolkitPointers — installs the 22 absolute toolkit pointer slots used by the rest of the
  engine (BattleState, Chatbox, NaviStats, ...).

  4. bl verifyEwramWorkAreaChecksum_803F8C4 — recomputes the byte-sum checksum over the 0x6710-byte buffer;
  returns !ZF=1 on mismatch (tampered/cleared store), !ZF=0 on match.

  5. On mismatch, bne to loc_803F870 (the "tampered" path).

  6. If checksum matched, bl infoText_IsTimestampUnchanged_803F8F4 — compares the 20-byte info-text timestamp
  embedded in the save buffer against the master copy; non-current returns !ZF=1, again branching to the
  tampered path.

  7. Both checks OK: r4=FALSE; movflag EVENT_1704; bl SetEventFlagFromImmediate — flag 1704 means "save
  is trustworthy / no tampering / info text still current".

  8. Tampered branch (loc_803F870): r4=TRUE; movflag EVENT_1704; bl ClearEventFlagFromImmediate; bl SeedRNG
  — also resets the primary RNG seed (0xA338244F), forcing the in-game RNG to a known state since the
  saved RNG stream may be junk.

  9. loc_803F87E (merge): bl RandomizeExtraToolkitPointers — rebuilds the trailing extra-toolkit pointer
  slots from the base pointer saved at the eUnusedExtraToolkitPtrsOffset (confirmed by its callee summary).

  10. Return r0 = r4 (the BOOL above) and pop {r1..r7, pc}. Note r10 (Toolkit) is preserved by the callee
  convention, which is why sub_814D8F0 and the other helpers can take it implicitly.

  EVENT_1704 is used as the "save is clean / current" flag (TRUE = clean); the function returns that same
  boolean, so callers can branch on r0 to decide whether to re-prompt for info text, force a re-seed,
  etc.

  '
