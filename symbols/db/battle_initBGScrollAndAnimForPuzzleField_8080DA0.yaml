  date: '2026-10-14'
  detail: "- `bl sub_8081308` at 0x08080da4 returns r0 used as `lsl r1, r4, #4` indexing into\n  off_8080E34\
    \ entry table.\n- `ldr r0,[r7]; ldr r1,[r7,#4]; ldr r2,[r7,#8]; bl SetBGScrollCallbacks` at 0x08080db0\n\
