    \ layout from BGScrollCallbacks.inc.\n- `bl GetRenderInfoLCDControl`/`orr r0,r1`/`bl SetRenderInfoLCDControl`\
    \ at 0x08080db6\n  merges the entry's +0xc word into DISPCNT.\n- `ldr r6,[r6,r1]; bl LoadBGAnimData`\
    \ at 0x08080dc2 indexes a u32 array of BGAnimData\n  by puzzle byte, scaled by 2 (lsl #2).\n- `ldr\
    \ r0,[r0,r1]; bl LoadGFXAnims` at 0x08080dcc indexes a u32 array of\n  GFXAnimScript arrays by puzzle\
    \ byte.\n- `bl GetBattleMode; cmp r0,#1; beq locret_8080DE8` at 0x08080dd4-0x08080dd8 confirms\n \
    \ the death-load path is skipped when battle mode == 1.\n- `bl sub_803537C` followed by `bl battle_loadDeathAnims_8035424`\
    \ matches their\n  confirmed summaries."
