name: battle_initBGScrollAndAnimForPuzzleField_8080DA0
address: '0x08080DA0'
kind: function
previous_names:
- sub_8080DA0
status: probable
summary: Installs the BG scroll callbacks, BG-anim data and per-puzzle-field GFX anim scripts for the
  current battle, then conditionally loads the death GFX.
interface: '(r10 = toolkit) -> void ; side effects: writes DISPCNT via SetRenderInfoLCDControl, arms IRQ4
  HBlank via SetBGScrollCallbacks, queues GFX anim scripts via LoadGFXAnims, and conditionally loads battle-loadDeathAnims_8035424
  when battle mode != 1.'
details: 'Computes a "puzzle status" via sub_8081308; the returned byte (r4) is used as an

  index into a packed-by-0x10 table at off_8080E34 (entries of {BGScrollCallbacks,

  LCDControlMask}), and into a u32 table at off_8080F98 of BGAnimData pointers, and

  into a table at off_8081220 of GFXAnimScript arrays. SetBGScrollCallbacks is called

  with (r0,r1,r2) = (Callback0,HBlankCallback,Callback1) from the per-index entry; the

  OR''d HBlank+LCD bits from the entry''s word at +0xc are merged into the current frame''s

  DISPCNT via SetRenderInfoLCDControl. LoadBGAnimData installs the BGAnimData for the

  field. LoadGFXAnims installs the matching array of GFXAnimScripts. If

  GetBattleMode() != 1, sub_803537C is run (re-arm EVENT_28 from a built-in

  auto-increment table) and battle_loadDeathAnims_8035424 loads the alternate-death

  GFX/Anims. Return contract has only callee-saved r4-r9 and r12, so it is void-like

  from the caller''s view.

  '
