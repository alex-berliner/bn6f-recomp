    path; ldr r0,[r5,#oBattleObject_ExtraVars]; add r1,r0,#1; str; ldrb r0,[r0]: ExtraVars used as script
    byte pointer, consumed once; lsr/lsl nibble split of the byte into r1 (high) and r0 (low), with oBattleObject_Element
    in r2 passed to bl sub_80CE6E6; mov r0,#8; strh [r5,#oBattleObject_Timer] and Timer/Param2 countdown
    loop: repeats every 8 frames Param2 times; strb CurAction=1 on entry and CurAction=0 after each tick:
    standard battle-object action state machine pattern'
