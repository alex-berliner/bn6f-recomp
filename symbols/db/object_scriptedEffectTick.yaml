  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary correctly notes CurAction gating, the byte consumption from oBattleObject_ExtraVars,
    the call to sub_80CE6E6 with element/Param1-loaded-but-zeroed r4, and the 8-frame timer. However,
    the proposal misstates the destroy semantics: lines 0x80E514A set CUR_STATE_DESTROY only when battle_isBattleOver
    OR Param2 reaches 0; the fall-through for Param2>0 resets CurAction=0 and continues (line ''mov r0,#0;
    strb r0,[r5,#oBattleObject_CurAction]''), not ''keeps CurAction=0 for next cycle''. The destroy path
