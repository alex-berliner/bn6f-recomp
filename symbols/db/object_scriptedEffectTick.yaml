name: object_scriptedEffectTick
address: '0x080E50FE'
kind: function
status: confirmed
summary: Per-frame tick for a scripted-effect battle object that repeatedly spawns a sub-effect from its script
  byte stream and destroys itself when the repetitions run out.
interface: void object_scriptedEffectTick(BattleObject* r5 /* also reads r10 battle state */)
details: "Runs one frame of a scripted-effect battle object (r5).\n- If battle_isBattleOver() returns non-zero,\
  \ the object is destroyed immediately by\n  writing CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized.\n\
  - On the first tick of an action (oBattleObject_CurAction == 0) it sets CurAction = 1,\n  consumes one byte from\
  \ the object's extra-data stream (oBattleObject_ExtraVars is a\n  byte pointer, post-incremented), splits that\
  \ byte into a 3-bit selector (low bits,\n  via lsl #29/lsr #29) and a 4-bit value (high nibble, lsr #4), and calls\
  \ sub_80CE6E6\n  with (low3=r0, high4=r1, element=oBattleObject_Element, 0, param1=oBattleObject_Param1\n  zero-extended\
  \ to 32 bits, obj=r5, oBattleObject_DamageAndStaminaDamageCounterDisabler=r6)\n  to spawn/apply the scripted effect.\
  \ It then seeds oBattleObject_Timer with 8.\n- Each tick afterwards decrements oBattleObject_Timer; while it is\
  \ still > 0 the object\n  keeps waiting. When the timer expires, oBattleObject_Param2 (repetition counter) is\n\
  \  decremented: if repetitions remain, CurAction is reset to 0 so the effect triggers\n  again next frame (new\
  \ script byte consumed each time); otherwise the object is\n  destroyed via CUR_STATE_DESTROY.\n- Quirk: only\
  \ preserves r4 and r6 across the sub_80CE6E6 call even though the callee\n  clobbers them; r5 (object pointer)\
  \ and r10 (battle state) are the real inputs, and r5\n  is returned unchanged. The Timer is treated as a signed\
  \ value (sub #1, bgt).\n"
