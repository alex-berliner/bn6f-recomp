name: object_scriptedEffectTick
address: '0x080E50FE'
kind: function
status: probable
summary: Per-frame handler reading one scripted byte per 8-frame tick from oBattleObject_ExtraVars, invoking
  sub_80CE6E6(lowNibble, highNibble, element, 0) Param2 times, then destroying the battle object via CUR_STATE_DESTROY
  when Param2 hits 0 or the battle ends.
interface: (r5 = battle object) -> r0 = clobbered; updates oBattleObject fields; sets state to CUR_STATE_DESTROY
  when finished or battle over
details: On first entry (CurAction==0) it sets CurAction=1, then consumes one byte from the stream pointed
  to by oBattleObject_ExtraVars (the pointer is incremented), splitting it into a high nibble (r1) and
  low nibble (r0). It calls sub_80CE6E6(lowNibble, highNibble, oBattleObject_Element, 0), with oBattleObject_Param1
  loaded into r4 but effectively unused by the call (r3 is forced to 0 via a dead 'orr'), then sets oBattleObject_Timer=8.
  Each tick decrements Timer; on expiry it decrements oBattleObject_Param2, and if that reaches 0 the
  action completes by resetting CurAction=0... wait, it actually falls through only via Param2==0 to destroy
  otherwise keeps CurAction=0 for the next cycle. If battle_isBattleOver reports the battle ended, the
  object is destroyed immediately via CUR_STATE_DESTROY in oBattleObject_CurStateActionPhaseAndPhaseInitialized.
