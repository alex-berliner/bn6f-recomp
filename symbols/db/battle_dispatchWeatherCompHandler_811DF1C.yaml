name: battle_dispatchWeatherCompHandler_811DF1C
address: '0x0811DF1C'
kind: function
status: confirmed
summary: Jump-table dispatcher that selects and calls a weather-compensation handler based on a per-object
  state byte, passing eWeatherCompState as context.
interface: void battle_dispatchWeatherCompHandler(BattleObject* r5); // r1=selector, r6=&eWeatherCompState
  passed to handler; r2,r3,r5,r10,r11 returned by handler
details: 'Reads a byte at object+8 (r5) as a direct byte-offset into a 3-entry jump table at off_811DF30.
  Entries: [0]=battleObject_initNaviRosterEntry_811DF40, [1]=sub_811DF94, [2]=sub_811DFCC. Before branching
  (mov lr, pc; bx r0), loads r1 with the selector byte and r6 with the address of eWeatherCompState, so
  each handler receives those as arguments. The handler''s results in r2, r3, r5, r10, r11 are read back
  directly by the original caller via the register contract. No return value is marshalled back through
  r0.'
