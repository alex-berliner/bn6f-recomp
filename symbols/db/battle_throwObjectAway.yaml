name: battle_throwObjectAway
address: '0x0810E4F0'
kind: function
status: probable
summary: Fully cleans a battle object out of the fight (collision, AI, actor list, held chip) and then
  launches it off as a thrown projectile.
interface: (r5 = battle object, r7 = its AI-attack-vars struct; no args in r0-r3) -> r0 = 0xF00000 * frontDirection
  (throw speed X); r5/r7 object fields updated
details: 'The routine first strips the object of all battle presence: it clears its collision region,
  collision result, collision state, AI data and barrier flag, zeroes its held-chip count, writes 0xFFFF
  to its Chip field, nulls its related-object pointer, and removes it from the alive actor list. It then
  reads object_getFrontDirection, scales it by 0xF00000 as a horizontal speed component, converts the
  object''s PanelX/PanelY to pixel coordinates with object_getCoordinatesForPanels, and feeds those to
  math_getThrowSpeeds (with 0xFFFF8000 as a bound) to get an arc. The resulting velocities are stored
  into oBattleObject_XVelocity/oBattleObject_ZVelocity, oAIAttackVars_StepTimer is set to 0x28 (40 frames),
  and oAIAttackVars_HitElement is set to 4, so the object flies off while remaining an active, element-tagged
  attacker for that duration.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl chain of object_clearCollisionRegion / battle_ClearObjectCollisionResult / battle_resetCollisionState
    / battle_clearAIDataAndBarrier wipes all combat state; strh #-1 into oBattleObject_Chip and RemoveGivenAliveBattleActorFromList(r5)
    detach the object from play; mul r4, r0 with dword_810E7A0=0xF00000 after object_getFrontDirection
    gives a directional throw speed; bl math_getThrowSpeeds then stores into oBattleObject_XVelocity/oBattleObject_ZVelocity,
    i.e. a projectile launch; strh #0x28 into oAIAttackVars_StepTimer and #4 into oAIAttackVars_HitElement
    set the throw''s duration and element'
