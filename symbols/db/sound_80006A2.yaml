open_questions:
- Which entry of off_8000704 corresponds to which MML channel (the table order may not be physical channel order).
- Whether r1 (channel_arg) is volume, loop count, priority, or another engine-specific parameter.
- Meaning of the BGMusicIndicator field beyond a "last requested song" cache (e.g., is it consulted for restart
  on map load?).
- Why song_id > 0x25 is silently skipped — does the table only cover up to 0x25 and higher are SE rather than BGM,
  or is this a guard against an invalid id?
