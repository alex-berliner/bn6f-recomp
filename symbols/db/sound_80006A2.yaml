name: sound_80006A2
address: '0x080006A2'
kind: function
status: confirmed
summary: Play a background-music track on one of the MML sound channels, also recording the song id in the GameState
  indicator.
interface: void sound_80006A2(u32 song_id /* r0 */, u32 channel_arg /* r1 */, u32 channel_index /* r2 */, void *toolkit
  /* r10 */); /* clobbers r1-r3,r4-r10,r12,lr; NZCV; preserves r4-r10,r12 */
details: 'If song_id <= 0x25 (signed compare), the song id is stashed as a byte at oGameState_BGMusicIndicator inside
  the GameState struct pointed to by oToolkit_GameStatePtr of the Toolkit.

  The channel_index (r2 << 2) is used to fetch a per-channel working buffer pointer from a 32-entry ROM table at
  off_8000704 (entries 0x00..0x1F, mostly byte_2010xxx/unk_2010xxx scratch areas; slot 0x1F is off_2010890, the
  function''s own tail literal).

  Five driver calls into sound_8000808 then orchestrate the MML engine for that channel: start the song (m4a_SongNumStart+1),
  attach the channel buffer (sub_814EB1C+1), reset to arg 0xFF/0 (sub_814F9AC+1), commit the song number (sub_814E9F0+1),
  and bind the channel_arg (sub_814EAF0+1).

  r4..r7 are pushed/popped only to spill caller-saved r12/r8/r9/r10 so the function can address its toolkit argument
  across the sub-call chain.

  '
