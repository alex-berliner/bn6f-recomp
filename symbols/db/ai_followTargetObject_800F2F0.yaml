name: ai_followTargetObject_800F2F0
address: '0x0800F2F0'
kind: function
status: confirmed
summary: AI trampoline that redirects processing from an AI data block to the battle object it belongs to, then
  tail-calls sub_800F2FC.
interface: void sub_800F2F0(u32 selfObject /* r5 = battle object whose AI is running */); returns sub_800F2FC's
  results in r3/r4/r5, r5 passed through
details: 'Pure thunk/trampoline. Loads battleObject->aiData (offset oBattleObject_AIDataPtr from

  r5), then loads aiData->battleObject (offset oAIData_BattleObjectPtr), and tail-calls

  sub_800F2FC with r0 = the pointed-to battle object and r5 (the original object) passed

  through untouched. Nothing is copied for the caller because callers only consume the

  r3/r4/r5 results that sub_800F2FC leaves behind. No flags are set with intent; NZCV

  are whatever sub_800F2FC leaves. Presumably one of several entry points into the

  shared AI routine at sub_800F2FC, this one reached "via the AI''s owning object".

  '
