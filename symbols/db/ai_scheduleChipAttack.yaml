summary: AI attack routine that loads chip params for chip 0x25 and arms the AI attack-vars timer fields
  in r7 to fire it after a 40-frame delay.
interface: (r7 = AI attack-vars struct base; no args in r0-r3) -> void; r0 clobbered by call
details: 'Passes chip ID 0x25 to somethingWriteChipParams_80126E4, which loads that chip''s parameters
  for the AI''s attack, then writes three bytes into the oAIAttackVars structure pointed to by r7: ChipUseDelay
