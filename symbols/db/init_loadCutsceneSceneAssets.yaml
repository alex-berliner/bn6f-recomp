name: init_loadCutsceneSceneAssets
address: '0x08131400'
kind: function
status: probable
summary: Loads the three graphics asset archives (LZ77-compressed) used by the cutscene/battle-scene UI
  into their RAM buffers.
interface: () -> void; no meaningful return flags
details: 'Wrapper that first builds the reference table used by the asset loader (decomp_buildInitRefTable_812AF3C,
  filling unk_201D020) and loads the piece referenced by off_812B0E8 (loadDecompressedAsset_812AF78).
  It then calls decompAndCopyData with a table at byte_8131418 containing three 12-byte entries: a compressed
  source pointer (comp_86D91FC, comp_86D93E0, comp_86DD488 with COMPRESSED_PTR_FLAG), a destination (eGuiSprite2022AA0,
  byte_20231A0, unk_2021DA0), and the shared decompression work buffer eDecompBuffer2013A00, terminated
  by NULL. So each of the three assets is LZ77-decompressed through the shared scratch buffer into its
  destination. Called only from init_cutsceneSceneState, right after VRAM/palette/tile buffers are wiped,
  i.e. it populates the scene''s sprite/tile data before the fade and chatbox script 0x68 run.'
