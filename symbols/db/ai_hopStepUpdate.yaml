name: ai_hopStepUpdate
address: '0x08115398'
kind: function
status: confirmed
summary: 'Advance one physics tick of a hopping enemy: integrate velocity, apply gravity, switch to landing anim
  at apex, and on timer expiry snap to the reserved panel, reset height, and spawn the dust-cloud effect.'
interface: ai_hopStepUpdate(u32 obj /*r5*/, u32 aiVars /*r7*/) -> (u32 collisionInfo /*r1*/, u32 obj /*r5*/)
details: 'Called each frame while a hopper-type battle object is airborne. Reads r5 (battle object) and r7 (AI attack
  variables), preserves r4/r5/r6/r7 across internal calls. 1. Integrates XVelocity into X and ZVelocity into Z (world-space
  position), then subtracts 0xA000 from ZVelocity (gravity constant dword_81154E4 = 0xFFFF6000). 2. Calls object_setPanelsFromCoordinates
  and object_updateCollisionPanels to keep the spatial grid in sync; r1 carries a collision result back to the caller.
  3. When StepTimer reaches 8 (apex frame), sets CurAnim to 5 (landing animation). 4. Decrements StepTimer. While
  it stays >= 0 the hop is still in flight and the function returns early. 5. On expiry (remaining < 0): promotes
  FuturePanelX/Y to PanelX/Y, removes the panel reservation, zeroes Z (ground snap), rebuilds coordinates and collision
  panels, sets collision region 1, clears flag 0x40, and sets OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT in flag-word 1.
  6. Spawns a rear dust-cloud visual via ai_spawnHopRearEffect, which may return a modified r5/r7. 7. Resets StepTimer
  to 0x18 (24 frames idle before next hop) and sets HitElement to 0x14.

  '
