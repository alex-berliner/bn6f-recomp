- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_8115398 start: X += XVelocity, Z += ZVelocity, then ZVelocity += 0xFFFF6000 gives hop arc;
    timer==8 sets oBattleObject_CurAnim = 5, mid-air pose change; timer<0 block copies FuturePanelX/Y
    into PanelX/Y and calls object_removePanelReserve before landing; landing path: Z=0, object_setCoordinatesFromPanels,
    object_setCollisionRegion(1), clear 0x40, set CURRENTLY_MOVING flag; ends by setting StepTimer=0x18
    and HitElement=0x14 in oAIAttackVars, chaining to sub_8115446'
