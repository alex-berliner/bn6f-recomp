name: ai_hopStepUpdate
address: '0x08115398'
kind: function
status: probable
summary: 'Per-frame update for an AI attack''s hop/leap: integrates X/Z velocity along an arc, then lands
  the object on its reserved future panel.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets object anim, flags, and state timer
details: 'Each frame it adds XVelocity to X and ZVelocity to Z, then subtracts 0xA000 from ZVelocity (dword_81154E4
  = 0xFFFF6000), producing a parabolic hop arc. When oAIAttackVars_StepTimer equals 8 it switches the
  object''s animation to 5 (presumably the descent pose), then decrements the timer. When the timer goes
  negative, the object lands: FuturePanelX/Y are copied into PanelX/Y, the panel reserve is released,
  Z is zeroed, pixel coordinates and collision panels are recomputed, collision region 1 is set, flag
  0x40 is cleared and the CURRENTLY_MOVING flag set, and sub_8115446 is called (likely queuing the next
  attack phase). It then reloads the timer with 0x18 and oAIAttackVars_HitElement with 0x14.'
