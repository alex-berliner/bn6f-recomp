open_questions:
- What the [r5+0xF] byte really is (it's a "draw-meter" enable). No struct definition directly maps to
  it; could be AIData.Unk_0f, a BattleObject flag, or a chip-select transient. Confirming what r5 points
  to in sub_802BDC0 would settle it.
- Exact meaning of the r4=2 height argument; the confirmed helper comment only mentions w/h via r0..r3,
  so r4 likely encodes a tile-bank/sub-buffer selector not visible from this assembly slice.
