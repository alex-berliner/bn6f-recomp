name: battle_chipSelectDrawMeterBlocks_802C85C
address: '0x0802C85C'
kind: function
previous_names:
- sub_802C85C
status: probable
summary: Draws the CustGauge/Mood-style meter block tiles (border + filled segments) into the 24x32 chip-select
  row buffer using the current frame's bit-4 to choose one of two tile palettes.
interface: '(r5 = battle object / chip-select ctx, r10 = Toolkit) -> r0 = 0 ; side effect: writes up to
  4 tile rows into the chip-select row buffer at unk_2034B30 via blitTileBlockToRowBuffer_802C4B6'
details: "1. Reads byte at [r5+0xF]; if zero, returns immediately (no border/meter to draw).\n  2. Loads\
  \ Toolkit->CurFramePtr (toolkit+0x24) into r7 and picks halfword [r7]; ANDs with 0x10, shifts to bit\
  \ 0x4 -> bit 0, then LSL#2 to give an index of 0 or 4.\n  3. Uses that index into off_802C884 (single-entry\
  \ indirection to byte_802C890 array of two pointer-sized entries) to select one of two tile-id tables:\
  \ byte_802C890 (8 entries of 0xB4,0x90 mix -> border/palette-0 tiles) or byte_802C8A0 (0xC7..0xCE ->\
  \ border/palette-1 tiles).\n  4. Calls blitTileBlockToRowBuffer_802C4B6 with width=10, x=4, y=4, height=4\
  \ (r0..r3) and r4=2 (y stride from the contract). The pointer table becomes the source for a 10x4-tile\
  \ block blit.\n  5. In effect: each frame where bit-0x10 of frame counter is set, the meter-tile color\
  \ flips to the second palette; when clear, palette 0 is used. This is the per-frame animation toggle\
  \ between the two tile-id strips.\n  6. The unconditional exit via `pop {pc}` (locret_802C882) plus\
  \ the contract indicating no return-value registers other than callee-saved r5/r6/r7 suggests this is\
  \ treated as void from the chip-select draw path.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#0xf]` followed by `tst r0, r0` / `beq locret_802C882` is the clear guard for
    some "should draw meter" flag. - `mov r7, r10; ldr r7, [r7,#oToolkit_CurFramePtr]` matches toolkit
    offset 0x24 (CurFramePtr) per Toolkit.inc. - `ldrh r0, [r7]; mov r1, #0x10; and r0, r1; lsr r0, r0,
    #4; lsl r0, r0, #2` selects bit 4 (value 0 or 1) and multiplies by 4 to index two 4-byte pointer slots.
    - off_802C884 -> off_802C888 -> {byte_802C890, byte_802C8A0} is the two-entry table, and the two labels''
    contents (0xB4/0x90 vs 0xC7..0xCE) differ only in tile-id palette. - `bl blitTileBlockToRowBuffer_802C4B6`
    (confirmed blit helper) with r0=0xa (width), r1=4 (x), r2=ptr, r3=4 (y), r4=2 (height) matches the
    routine''s documented (r0..r3, r4) parameter list. - r5 / r10 in the contract indicate caller is passing
    a chip-select/AIData-like struct (r5 is reused in nearby chain for AIData access) and the Toolkit
    respectively; combined with `byte_802C890/0xC8` style tile IDs this is a UI draw call, not gameplay
