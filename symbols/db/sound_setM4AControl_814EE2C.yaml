name: sound_setM4AControl_814EE2C
address: '0x0814EE2C'
kind: function
previous_names:
- sub_814EE2C
status: probable
summary: m4a sound driver control register update (handles D-ma/pcm wave volume bits and a sample-rate
  reroll guarded by the "Smsh" header magic)
interface: (r0 = 32-bit control bits) -> r0 = saved lr (return address); updates m4a driver's direct-sound
  state at *byte_3007FF0, writes to hardware regs via SoundPWMControl
details: "Loads the pointer stored at `byte_3007FF0` into r4, peeks the first word of that\n  struct and\
  \ compares it against the literal `0x68736d53` (\"Smsh\" little-endian). If\n  it doesn't match, it\
  \ just pops the saved lr and returns (no work done, no recursion\n  guard). If it does match, it bumps\
  \ the magic word (r4[0] += 1) as a re-entry guard,\n  then sweeps bits of r0 one nibble at a time:\n\
  \   - bit 7..0   -> r4[5] = (r0 & 0xff) & 0x7f (master left volume)\n   - bits 0xf00 -> sets r4[6] =\
  \ (r0 >> 8), then zeroes a 0x40-byte stride table at\n     r4+0x50..r4+0x50+0xc*0x40 (12 channel slots\
  \ x 64 bytes of channel state) — looks\n     like the \"reset DMA buffers / channel snapshot\" config\
  \ word.\n   - bits 0xf0000 -> r4[7] = (r0 >> 12) (master right volume)\n   - bits 0xb0000000 -> OR's\
  \ two channel-decode nibbles into the low 6 bits of\n     `SoundPWMControl+1` (the GBA's SOUNDCNT_X\
  \ mixed-control byte: writing to bit\n     +0 of `+1` lands on SOUNDCNT_H bits 0..5, i.e. direct-sound\
  \ A/B volume),\n     clamping the existing 6 bits with a 0x3F mask; the upper byte holds the\n     4-bit\
  \ shift value.\n   - bits 0xf0000000 -> forwards the high 8 bits of r0 to m4aSampleFreqSet as the\n\
  \     \"sample rate id / sound id\" to recompute pcmDmaPeriod/pcmFreq/divFreq.\n  Finally restores r4[0]\
  \ back to 0x68736d53 and returns the saved lr (so the caller\n  sees its own return address in r0).\
  \ This is a thin control dispatcher sitting on\n  top of the m4a driver, not the main update loop.\n"
