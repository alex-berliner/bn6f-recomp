- 0x40 and loop count 12; the project's m4a EWRAM struct isn't surfaced in the
- Structs section, so this stays hypothesis-level pending a libmid m4a header cross-
- reference. Bit-pack meaning for the SOUNDCNT_X nibble (which 4 bits of r0 go where
- in `SoundPWMControl+1`) was derived from the `0xC0 << 14` mask; s80 would confirm
- the exact field name.
