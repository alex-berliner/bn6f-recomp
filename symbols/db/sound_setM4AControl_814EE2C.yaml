  detail: '- `ldr r0, off_814EEB4 // =byte_3007FF0` then `ldr r4, [r0]; ldr r1, [r4]` — fetches the m4a
    driver''s EWRAM state pointer. - `cmp r1, r0` with `dword_814EEB8 = 0x68736d53` ("Smsh" LE) — only
    proceeds if the driver''s struct begins with that magic. - `add r0, r1, #1; str r0, [r4]` then a final
    `str 0x68736d53, [r4]` — a lock-token pattern taken from libmid''s m4a internals. - `strb r3, [r4,#5]`
    after isolating r0 & 0xff — drives an m4a internal byte at offset 5 (DSound master volume L slot).
    - The 0..11 loop `mov r0, r4; add r0, #0x50; mov r1, #0; strb r1, [r0]` with `sub r3, #1; add r0,
    #0x40` — exactly a 12-iteration zero-write at stride 0x40, i.e. clearing one byte per m4a channel
    record. - `ldr r2, off_814EEBC // =SoundPWMControl+1` and the `ldrb ... and r0, r1, #0x3f;'
