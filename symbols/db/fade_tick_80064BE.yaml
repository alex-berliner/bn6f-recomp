name: fade_tick_80064BE
address: '0x080064BE'
kind: function
status: confirmed
summary: Advances a two-slot palette color fade by one tick, repaints the affected palette entries, then
  dispatches to a running or finished handler.
interface: void sub_80064BE(u32 fade_state /* r5 */) /* preserves r4-r7; clobbers nzcv,r0,r1,r2,r3,r6,r7,lr
  */
details: "Operates on a fade state block pointed to by r5:\n  +0x03 u8   running flag (cleared on completion)\n\
  \  +0x04 u16  per-tick step\n  +0x06 u16  current fade position (r/w)\n  +0x08 u16  argument forwarded\
  \ to sub_8002378 (likely dest palette index)\n  +0x0A u16  end position; reaching it ends the fade\n\
  \  +0x0C u8   base palette slot index\n  +0x10 u32  first  palette slot descriptor passed as r4 to sub_8002378\n\
  \  +0x14 u32  second palette slot descriptor\n  +0x18 u16  first  palette slot length/payload arg\n\
  \  +0x1C u16  second palette slot length/payload arg\nEach tick: pos += step; if pos >= end, clamp pos=end,\
  \ clear +0x03, set r7=4; else r7=0.\nThe top 4 bits of pos are broadcast into R, G, B of an RGB555 color\
  \ via shifts\nof 0,5,10; that color is written to palette entries base+0x12 and base+0x13\nthrough sub_8002378(r0=arg_at_+8,\
  \ r1=color, r2=arg_at_+18/+1c, r3=base+0x12/+13, r4=descriptor_+10/+14).\nFinally dispatches via an\
  \ indirect jump through off_8006510[r7]: r7=0 -> sub_8006518\n(fade still running, called once per tick),\
  \ r7=4 -> sub_8006580 (fade just completed).\n"
