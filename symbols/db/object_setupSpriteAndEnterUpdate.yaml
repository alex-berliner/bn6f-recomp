name: object_setupSpriteAndEnterUpdate
address: '0x080BAAB0'
kind: function
status: probable
summary: Reloads a battle object's sprite (recomputes pixel coords, decompresses sheet 8x0x10 into OAM
  slot 0x80, loads animation data, enables shadow, resets CurAnim/CurAnimCopy to anim 0, sets palette
  0, applies facing flip, runs sub_8010DF6(2,0x10,1)) and transitions the object to CUR_STATE_UPDATE.
interface: (r0 unused; r5 = battle object pointer) -> r0 = ?; sets object state to CUR_STATE_UPDATE
details: Acts on the battle object in r5 (all callees operate implicitly on it). It first recomputes pixel
  X/Y from panel coordinates and zeroes the object's Z field, then decompresses sprite data into a temp
  buffer and loads it via sprite_load(0x80, 8, 0x10) followed by sprite_loadAnimationData, so 8/0x10 look
  like sprite-sheet size parameters. It enables the shadow, resets CurAnim and CurAnimCopy to 0 and applies
  animation 0, sets palette 0, and applies the object's facing via object_getFlip/sprite_setFlip. It then
  calls sub_8010DF6(2, 0x10, 1) — likely an OAM/graphics upload or priority step, still unidentified.
  Finally it writes CUR_STATE_UPDATE into the object's state field, so this is the sprite-loading/init
  phase of an object's state machine before normal per-frame updates begin.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels followed by str r0,[r5,#oBattleObject_Z]=0 repositions the
    object flat on its panel; sprite_decompressTemp(8,0x10) then sprite_load(0x80,8,0x10) + sprite_loadAnimationData
    load full sprite resources; strb #0 into oBattleObject_CurAnim and CurAnimCopy then sprite_setAnimation(0)
    resets the animation; object_getFlip -> sprite_setSpriteFlip re-applies the object''s facing to the
    sprite; mov r0,#CUR_STATE_UPDATE; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    transitions to the update state'
