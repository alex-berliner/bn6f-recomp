    release uses FuturePanelX/Y, not current panel.; run wf investigate investigate-20261018-222121; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- Exact meaning of object_getFlag2's return values and the byte_80D4A20/A24 bit masks (data bytes shown
  as 0)
- What ExtraVars+0, +4 and +0xC count down (hidden flag vs. death delay)
- No caller known, so the r0-vs-r5 calling convention (whether r0 is the object) is unconfirmed
- 'The summary''s gist (per-frame destroy handler that gates on flags, plays effects, then tears down)
  matches the code: loc_80D497E is the convergence teardown with clearCollisionRegion, panel-reserve release,
  flag bit 2 clear, and CUR_STATE_DESTROY store at the end. However the proposal''s ''id 0x74'' is wrong:
  `mov r7, #0x75; add r7, #0xff` yields 0x174, not 0x74. Also the name prefix ''battle_object'' violates
  the allowed-prefix rules; ''object'' is the correct prefix. The ''CurStateAction'' write target is actually
  the combined 32-bit CurStateActionPhaseAndPhaseInitialized field, and panel-reserve release uses FuturePanelX/Y,
  not current panel.'
