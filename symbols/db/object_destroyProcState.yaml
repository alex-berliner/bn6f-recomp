    0x14/0x24 and z-offsets 0xC/0x10 from object+0x34 block — deletion/explosion effect; PlaySoundEffect(0x107)
    only after the variant-0x24 spawn, matching a distinct deletion sound; battle_queueEffectRequest(alliance,
