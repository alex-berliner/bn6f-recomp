name: object_destroyProcState
address: '0x080D48AE'
kind: function
status: probable
summary: 'Per-frame handler for a battle object''s destroy state: gates on flag2 (0=early-out, 1 or flag
  0x4000000=teardown only), otherwise waits out a countdown in ExtraVars+0xC (skipped under time-stop,
  battle-over, or zero ExtraVars/+0x4) then spawns a deletion effect (variants 0x14/0x24 with z-offset
  0x0C0000 or 0x100000, sound 0x107 for the big one), dispatches flag 0x40, queues battle-effect request
  id 0x174 with the object''s alliance via sub_80E61D2, then converges on dispatchDestroyEvents, collision-region
  clear, panel-reserve release, and CUR_STATE_DESTROY.'
interface: (r0 = unused, r5 = battle object header) -> r0 = undefined; sets object CurStateAction to CUR_STATE_DESTROY,
  clears flag bit 2, clears collision region and panel reserve
details: Early-outs (returns with nothing done) when object_getFlag2's mapped value is 0, and takes a
  no-effect teardown path when it is 1 or when object flag 0x4000000 is set. Otherwise it gates on ExtraVars+4
  (nonzero = full effect path), battle_isTimeStop and battle_isBattleOver, and a countdown in ExtraVars+0xC;
  when the countdown expires it sets phase 8 and clears object-flag bit 2. The effect path spawns a deletion
  effect from the object's 0x34-block (x,y + z at +0xC or +0x10, effect variant 0x14 or 0x24 with 0x10/0x14
  z-offsets), plays sound 0x107 for the big variant, dispatches flag 0x40, and queues a battle effect
  request (via sub_80E61D2 on the object's panel coords and params, id 0x74) with the object's alliance.
  All paths converge on battle_dispatchDestroyEvents_802EF5C, removal from the battle object list, collision-region
  clear, panel-reserve release, and CUR_STATE_DESTROY. The byte_80D4A20/A24 tst masks pick between effect
  variants.
