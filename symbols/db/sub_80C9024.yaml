kind: function
status: confirmed
summary: 'Initialize a battle object: load its sprite (0x80/5 frames), set animation 0x0B with no shadow, snap to
  panel coords, mark it facing along +X, set element 5 (Wind), allocate collision data, then transition to the update
  phase.'
interface: "void sub_80C9024(oBattleObject* r5, ? r8, ? r10, ? lr);\n  // preserves r4, r5, r6, r7\n  // clobbers\
  \ r0, r1, r2, r3, lr; sets nz/c/v\n"
details: '- Loads sprite via sprite_load(0x80, 0x14, 5).

  - Writes oBattleObject_CurAnim = 0x0B, then sprite_setAnimation + sprite_loadAnimationData + sprite_noShadow +
  sprite_update.

  - Calls object_setCoordinatesFromPanels, then stores object_getFrontDirection() result into oBattleObject_XVelocity
  (so facing direction is being abused/reused as X velocity storage here).

  - Sets oBattleObject_Element = 5 (Wind element in BN6).

  - object_createCollisionData: if it returns 0 the object is freed via object_freeMemory and the function returns
  without entering the update state.

  - On success: object_setupCollisionData(?, 4, 5, 0) and object_presentCollisionData.

  - Writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized, placing the object into the
  update phase of its state action.

  - Pure initialization path used when a battle object is created/spawned mid-battle.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
