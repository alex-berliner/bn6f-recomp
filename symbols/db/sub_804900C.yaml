name: sub_804900C
address: '0x0804900C'
kind: function
status: confirmed
summary: Tear down the current scene (close chatbox, blank LCD, release palette and graphics state) and write the
  next scene state (0xC or 0x8) into the caller's struct.
interface: 'void sub_804900C(void); // in: r5=scene state struct; out: r3, flags c,v'
details: "Called as part of a scene/area-transition path. Performs a full graphics-teardown\nsequence in order:\n\
  \  1. chatbox_8040818 (close any open chatbox/textarea)\n  2. SetRenderInfoLCDControl(0x40) then renderInfo_8001788\
  \ + renderInfo_80017A0\n     (blank the LCD via the render-info layer)\n  3. toolkit_applyOverlayPalette_80015FC(0x11)\
  \ (release palette/DMA slot 0x11)\n  4. resetAllGraphicsState_8005F40 (full graphics state reset)\n  5. sub_803BEC0,\
  \ sub_8049CBC, sub_8049D42 (subsystem cleanups)\n\nThen decides the next scene state and stores it in the r5-pointed\
  \ struct:\n  byte [r5+0x00] = 0xC and byte [r5+0x01] = 0 if sub_8049D42 returned Z==1\n                   (i.e.\
  \ its r3==0) OR if halfword [r5+0x22] is nonzero\n                   (work still pending);\n  byte [r5+0x00] =\
  \ 0x8 and byte [r5+0x01] = 0 otherwise.\n\nThe c/v flags are forwarded to the caller as left by sub_8049CBC, and\
  \ r3 is\nforwarded as left by sub_8049D42. r4-r7 are preserved.\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
