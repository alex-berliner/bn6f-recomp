name: chatbox_config_80408D0
address: '0x080408D0'
kind: function
status: confirmed
summary: Configures the chatbox to begin playback of a given text script entry, resetting its cursor/state and clearing
  two chatbox-related flags.
interface: "void chatbox_startScript(u32 chatbox /* r5 */, u32 script_idx /* r1 */)\n  -> r1, r2, r3, r4, lr (r4\
  \ = resolved script pointer);\n  clobbers nz, r0; preserves r2, r3; C/V preserved (ORR has no effect on them).\n"
details: "Stores the requested text-script index into oChatbox_TextScriptIdx on the chatbox struct pointed to by\
  \ r5.\nLooks up the script via the u16 offset table at oChatbox_TextScriptPtr:\n  ptr = *(u16*)(TextScriptPtr\
  \ + script_idx*2) + TextScriptPtr\nWrites that pointer into both oChatbox_TextScriptCursorPtr and oChatbox_CurrTextScriptPtr\
  \ (kept in sync).\nZeroes a batch of small script-state fields: oChatbox_TextScriptState_04, oChatbox_Unk_64,\
  \ oChatbox_Unk_12,\noChatbox_CurrLine, oChatbox_Unk_17, +0x3D, +0x80.\nSets oChatbox_JumpTableOffset_11 and oChatbox_Unk_74\
  \ to 1.\nMirrors oChatbox_TextScriptCharIdx into +0x94 (a stored typing/text-coordinate snapshot).\nTail-calls\
  \ chatbox_resetAndClearBuffers_8045F60 to reset internal buffers.\nORs \"FLAGS_3E_UNK_0400 | FLAGS_3E_UNK_0800\"\
  \ and passes the mask to chatbox_clearFlags_3e to clear those\ntwo unrelated bits. Returns to caller via pop {pc}.\n"
