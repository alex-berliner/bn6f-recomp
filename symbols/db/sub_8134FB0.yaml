name: sub_8134FB0
address: '0x08134FB0'
kind: function
status: hypothesis
summary: Clears the bitmask tied to a given member id from an object's status word at +0x4C, then triggers a re-update
  if the result no longer has both 0x60 bits set.
interface: void clearMemberFlags_8134FB0(u32 memberId /* r0 */, void *obj /* r5 */);
details: 'Walks a two-entry dispatch table at off_8135018 (slot offsets into the

  object pointed to by r5) and a parallel mask table at byte_8135030. For

  each slot whose stored word equals the incoming memberId, the

  corresponding mask word is cleared from the status word at obj+0x4C

  (BIC, not AND-NOT, so the mask is used raw as a clear mask).

  After the loop, if obj+0x4C no longer has both 0x60 bits set,

  sub_8134FE0 is called to refresh the object''s derived state. The 0x60

  mask is the "fully-joined / not-needs-update" sentinel for the

  two tracked members.

  Quirks: the mask load clobbers r0 (the memberId), so the per-iteration

  compare uses the original id only for the first hit; later slots compare

  the slot''s stored word against the mask that was just loaded. This is

  harmless in practice because the slot words are distinct member ids and

  no mask will equal a real id. r4-r7 are pushed/popped, so r7''s loop

  scratch is discarded; r2 is the only output register that survives and

  holds the last table entry (or whatever sub_8134FE0 leaves).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
