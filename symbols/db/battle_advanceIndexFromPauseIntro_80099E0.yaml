status: probable
summary: Battle state step that, after a battle is paused mid-introduction, finishes the intro by spawning
  the type-4 enemy object and enemy objects, plays battle music, then advances BattleState Index_00 from
  pause intro (4) to either the next state or returns to the chip-select dispatch.
interface: '(r5 = BattleStatePtr) -> void ; side effects: writes to BattleState Unk_03/Unk_02/Index_01/Unk_02_03/Unk_1a,
  may play music, pause battle, set event flag 0x1735, set request bits at dword_20352C0'
details: "- On entry, reads BattleState_Unk_03 (r5+0x03). If zero (first entry), increments Unk_1a or\
  \ loads it from BattleSettings+5 depending on whether GetBattleEffects()&0x400 is set, then calls battle_spawnType4ObjectWithActiveFlag_80E06F8,\
  \ battle_SpawnEnemyObjects_8007358, PauseBattle, battle_applyNaviStatTableEntry_8014178; finally chooses\
  \ a music id (0x15 if effects&0x8, else BattleSettings+2) and PlayMusic unless id==0x63, then sets Unk_03=4\
  \ and exits.\n  - On the second entry (Unk_03 nonzero), if BattleState_Unk_02 is zero, calls sub_8009A68\
  \ and sets Unk_02=4; then waits for the battle-state Unk_5c bit2 (battle_getStateUnk5c_800139A result\
  \ >>2 bcc) before dispatching: dispatch_801DA48(1), eStruct2035280_SetRequestBits_801BECC(1), EVENT_1735\
  \ set (with r4=0x24 if event already set, else r4=4), writes r4 to BattleState Index_01, zeros BattleState\
  \ Unk_02_03 (halfword at r5+2).\n  - r10 is Toolkit (per callees reading r10); r5 holds BattleStatePtr.\n\
  \  - The \"intro\" framing matches typical BN6 patterns: state=0->4 spawns/setup; state=4->idle pauses\
  \ then dispatches the next BattleController tick.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#oBattleState_Unk_03]` and `bne loc_8009A30` gate the two-stage behaviour on
    this byte. - First stage: `bl battle_spawnType4ObjectWithActiveFlag_80E06F8`, `bl battle_SpawnEnemyObjects_8007358`,
    `bl PauseBattle`, `bl battle_applyNaviStatTableEntry_8014178`, then `bl PlayMusic` with id derived
    from `BattleSettings+5`/`BattleSettings+2` (or 0x15). - Second stage: `bl battle_getStateUnk5c_800139A`
    then `lsr r0,#2; bcc locret` is the wait-for-flag pattern. - On completion: `mov r0,#1; bl dispatch_801DA48`
    and `bl eStruct2035280_SetRequestBits_801BECC` set the next state/dispatch, with r4 chosen from EVENT_1735
    check (`TestEventFlagFromImmediate`). - Writes to r5: `strb r0,[r5,#oBattleState_Unk_03]`, `oBattleState_Unk_02`,
    `oBattleState_Index_01`, `strh r0,[r5,#oBattleState_Unk_02_03]`.'
