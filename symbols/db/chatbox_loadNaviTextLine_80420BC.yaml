name: chatbox_loadNaviTextLine_80420BC
address: '0x080420BC'
kind: function
status: confirmed
summary: Copies one 64-byte block of the current PET navi's dialogue text into the next chatbox buffer
  slot and advances the script cursor.
interface: r4=scriptPtr (command stream), r5=chatbox (chatbox struct); returns r0=1, r4=text slot dest
  pointer, r7=chatbox+0x64 (slot-counter address); flags from final mov r0,#1 (nz set, c/v clear)
details: 'Increments the per-chatbox line counter (chatbox+oChatbox_Unk_05). Reads the active PET navi
  via GetCurPETNavi. Uses scriptPtr[2] as a table selector (0 or 1) indexing off_8042118 to pick TextScriptNaviNames0
  or TextScriptNaviNames1; fetches a u16 per-navi offset from that table and computes the source text
  pointer. Computes a destination slot in the global text pool at byte_200AFA0: (u16 slot index at chatbox+0x64)
  << 6 gives a 64-byte-aligned address. Calls CopyBytes(src, dest, 0x40) to transfer one block. Increments
  the slot index (wrapping within the pool). Writes dest into chatbox+oChatbox_TextScriptCursorPtr and
  writes scriptPtr+3 (past the 3-byte command) into chatbox+oChatbox_Unk_44 and into a per-line pointer
  array at chatbox+0x140+(counter-1)*4. Returns with r4 holding the dest pointer so callers can read the
  just-copied text directly.'
