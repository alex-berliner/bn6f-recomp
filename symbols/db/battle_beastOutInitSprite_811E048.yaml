status: probable
summary: Initialise a Beast-out navi's battle sprite (animation 0, palette bank 0xB, OAM priority 1, palette
  0, no shadow) and chain into the Beast-out per-frame sprite update hook.
interface: '(r5 = battle object) -> void ; side effects: writes object header flags byte at [r5]+0 (0x23),
  object CurState at [r5,#8] = 0x4, sprite sub-record nibbles/palettes; called from one Beast-out caller
  at 0x0811E032.'
details: '- Entry `r0=0811e049` is the standard Thumb-mode LR+1 sentinel (function is called via `bl`);
  `r1=0`, `r2=0`. `r5` is the battle object, but no EWRAM/IWRAM pointer was provided in `r0`/`r1` for
  the captured snapshots, so the object address is not visible.

  - `strb r0, #0x23, [r5]` sets the object''s header Flags to 0x23 = OBJECT_FLAG_ACTIVE (0x01) | OBJECT_FLAG_VISIBLE
  (0x02) | OBJECT_FLAG_PAUSE_UPDATE (0x04) | OBJECT_FLAG_STOP_SPRITE_UPDATE (0x08) | OBJECT_FLAG_UPDATE_DURING_TIMESTOP
  (0x10); in other words the object is alive and visible but its update loop and sprite update are paused
  (typical Beast-out pre-spawn state) and timestop immunity is on.

  - `initGuiSprite_8002770(0x31)` initialises the object''s GUI sprite with value 0x31 (per the callee''s
  documented `(a1, a2)` contract).

  - `sprite_setAnimation(0)`, `sprite_loadAnimationData()`, `sprite_noShadow()` reset the sprite to animation
  0, load its anim data, and disable shadow rendering.

  - `sprite_setSubEntryPaletteBank_800304A(0xB)` sets the high nibble of the sprite sub-entry''s +0x15
  byte to 0xB (palette bank 11).

  - `slotList_storeHalfwordAndClearField_800306C(0x298)` stores halfword 0x298 in the slot picked from
  the object''s bank/index nibble (per the callee''s contract) and zeroes an adjacent field.

  - `sprite_setSubRecordFieldA_8003060(0)` writes 0 into +0xA of the same sub-record.

  - `sprite_setPriority_8002E14(1)` sets OAM priority to 1; `sprite_setPalette(0)` sets base palette to
  0.

  - `strb r0, #4, [r5,#8]` writes 4 into the object''s `CurState` (i.e. `CUR_STATE_UPDATE`, since 0x4
  is the documented update-state value), kicking the object into its update phase.

  - Tail-calls `sub_811E090` (the Beast-out per-frame sprite-update hook) before returning via `pop {pc}`.

  - No callers are listed; the function is presumably invoked from the Beast-out init code at the captured
  `lr=0x0811E032`.

  '
