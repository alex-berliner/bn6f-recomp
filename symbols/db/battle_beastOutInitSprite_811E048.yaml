open_questions:
- The exact value of `initGuiSprite_8002770`'s second argument (`a2`) on entry is unknown (r1 was captured
  as 0, but the callee contract mentions two args).
- The semantic meaning of the 0x298 halfword written by `slotList_storeHalfwordAndClearField_800306C`
  is unknown (likely a sprite/OAM slot config word specific to the Beast-out).
- Whether `CurState = 4` here really is the Beast-out *first-update* or a "spin up / wait one frame" sentinel
  depends on caller behaviour at 0x0811E032.
