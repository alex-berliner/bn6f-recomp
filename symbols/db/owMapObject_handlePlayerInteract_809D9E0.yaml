open_questions:
- Exact meaning of the low-nibble -> FacingDirection mapping (which nibble value means "up/down/left/right")
- is not nailed down here; the constant table byte_809DAD8 is the only ground truth for the conversion
- and would be confirmed by tracing the callers that consume Unk_4c.
- Whether Unk_4c carries "intended facing direction (0..3)" + flags (start pressed? in-event?) vs an
- interaction-result code is unclear; only the consumers of Unk_4c would settle it.
