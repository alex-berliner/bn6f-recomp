name: owMapObject_handlePlayerInteract_809D9E0
address: '0x0809D9E0'
kind: function
previous_names:
- sub_809D9E0
status: probable
summary: 'Overworld player interaction handler: builds a target XYZ ahead of the player''s facing direction,
  runs the coordinate trigger check (e.g. examining an NPC/object via the A button), and packs the resulting
  "interaction" bits into the OW player''s `Unk_4c` word, also updating `Unk_0d` / `FacingDirection` on
  no-input.'
interface: (uses r5=OWPlayer, r10=Toolkit) -> r0 unused, r2 carries result ; sets OWPlayer.Unk_4c, OWPlayer.Unk_0d,
  OWPlayer.FacingDirection
details: "Entry: r5 = OWPlayerObject*, r10 = Toolkit*, lr = return address.\n  Reads `eStruct200ace0.fixOWPlayerAnim_15`\
  \ (byte at +0x15). If nonzero, takes the second branch\n  (loc_809DA98) which never calls the coordinate\
  \ trigger / event-flag tests, just builds Unk_4c\n  from r1 = word at +0x18 of the same struct (treated\
  \ as `Joypad.Pressed`-like value).\n  Main path (fixOWPlayerAnim_15 == 0):\n    - Skips entirely while\
  \ IsScreenFadeActive is set (loc_809DA94 -> r0=0).\n    - If EVENT_PLAYER_CAN_MOVE is clear, output\
  \ r0=0.\n    - If EVENT_1717_PLAYER_ADVANCE_FORWARD is set, also output r0=0.\n    - If a cutscene script\
  \ is running (`IsCutsceneScriptNonNull`), output r0=0.\n    - Saves FacingDirection to Unk_11.\n   \
  \ - If JOYPAD_START is in Pressed, output r0=0.\n    - If JOYPAD_A is in Pressed: builds a 3-word coordinate\
  \ struct on the stack frame\n      (sp = player X,Y,Z plus a per-direction offset loaded from off_809DC0C\
  \ indexed by FacingDirection*4),\n      calls checkCoordinateTrigger_8031a7a; stores the low byte of\
  \ its return into OWPlayer.Unk_0d\n      and sets Toolkit.GameState->Unk_11 = 1 (lock movement).\n \
  \   - Otherwise fall through to read `Toolkit.GameState->SubsystemIndex` (byte+1n).\n      Index `(r2\
  \ >> 4) & 0xf` indexes byte_809DAD8 to set bits 0..3, plus bit 4 (0x10) and conditional\n      bit 5\
  \ (0x20) based on SubsystemIndex bit 1.\n    - Final Unk_4c = (r0 from the above) | (r2 from coord trigger\
  \ if any); then if low nibble is nonzero,\n      `FacingDirection = (low nibble) - 1` (an old direction\
  \ value is stored).\n    - The two paths merge at loc_809D90 (add sp,#0xc; pop {pc}) and at the `strh\
  \ r0,[r5,r3]` (`r3=0x4c`).\n  Stack frame is 12 bytes used as the 3-word coord trigger arg block.\n\
  \  Side effects: writes OWPlayer.Unk_11, OWPlayer.Unk_0d, OWPlayer.Unk_4c, OWPlayer.FacingDirection,\n\
  \  Toolkit.GameState->Unk_11 (movement lock), and conditionally calls checkCoordinateTrigger.\n"
