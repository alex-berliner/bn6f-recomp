name: naviStatus_SetGfxAndStatus_801E724
address: '0x0801E724'
kind: function
status: confirmed
summary: Records a new navi status graphics index and status value into the navi status state block, carrying over
  the previous display index and flagging a pending update.
interface: void naviStatus_SetGfxAndStatus(u8 gfxIdx /*r0*/, u8 status /*r1*/); returns displayIdx in r2, clobbers
  r0 and flags
details: Operates on the state struct at 0x2035280 (eStruct2035280). Reads the current display gfx index at +0x17;
  if it is 0xFF (unset), falls back to the value at +0x15 instead. The resulting index is stored to +0x1F (the index
  actually used for display). Then stores the caller's status argument to +0x16 and the new gfx index to +0x17,
  and writes 0xFF to +0x13, apparently marking that a status change is pending (to be picked up elsewhere). Callers
  pass r0 = new gfx index, r1 = new status; r2 comes back holding the display index that was written to +0x1F. r5
  is pushed/popped and preserved despite being used for the struct pointer. Note the C model writes 0xFF to r0 before
  returning, but the analyzed callers treat r0 as clobbered rather than an output.
