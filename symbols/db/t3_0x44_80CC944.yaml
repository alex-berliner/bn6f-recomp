name: t3_0x44_80CC944
address: '0x080CC944'
kind: function
status: confirmed
summary: Dispatches a battle object (task type 3) to one of three state handlers based on its current state byte
interface: '// Inputs: r5 = battle object pointer

  //         r4, r7, r8, r10, lr = live caller values

  // Outputs: r5, r8-r12 = whatever the selected state handler leaves on the guest register file

  //           (r0-r4, r6, r7, lr clobbered by the dispatched handler)

  void battleObject_stateDispatcher_80CC944(void);

  '
details: "Reads r5->oBattleObject_CurState and uses it as an index into the jump\ntable at off_80CC958 to tail-call\
  \ one of:\n    state 0 -> sub_80CC964\n    state 1 -> sub_80CC9AA\n    state 2 -> object_genericDestroy\nThe dispatch\
  \ is performed with `mov lr, pc; bx r1`, so control returns\ndirectly to the original caller through the trailing\
  \ `pop {pc}`; this\nroutine itself has no own epilogue work. The chosen handler therefore owns\nall output registers\
  \ (r5, r8-r12) and they are not touched here.\nIdentified by signature: starts by loading r5's state byte and\
  \ routing\nthrough a small state-handler table -- the classic pattern for a task-3\nbattle object dispatcher.\
  \ Offsets touched:\n    oBattleObject_CurState (via r5)\n    off_80CC958 (handler table)\n"
