name: npc_triggerCutscene
address: '0x080A8DB0'
kind: function
status: probable
summary: 'Overworld NPC trigger: if the player may advance and sub_8002E04 allows, and bit 0x10000 of the NPC record''s
  +0x24 word is set, starts cutscene 0x808C315 with sub_8143088''s return as param, plays SE 0x122, then runs sub_8143204
  and the sub_8143220 Cybercrow-style countdown randomizer on the record''s +0x04 id byte.'
interface: (r0..r3 = unused; r5 = Cybercrow/NPC state struct) -> r0 = clobbered; only acts when player may advance,
  sub_8002E04 passes, and bit 0x10000 of +0x24 is set
details: Early-outs unless check_playerCanAdvanceForward_8034C36 returns true, unless sub_8002E04 returns nonzero,
  and unless flag 0x10000 is set in the struct field at r5+0x24. It then calls sub_8143088 and passes its result
  as the cutscene param, starting the cutscene whose script pointer is 0x808C315 (StartCutscene r0 = script, r1
  = param). It plays sound effect 0x23+0xFF = 0x122 via PlaySoundEffect, and finally passes the byte at r5+0x04
  to sub_8143204 and to sub_8143220, the latter being the known Cybercrow routine that randomizes the +0x02 countdown
  (0x1E + GetRNG&0x3F frames) and sets state 1 unless it is 3. r5 is thus a Cybercrow/NPC record with a flag word
  at +0x24 and an id/state byte at +0x04. The exact meaning of the sub_8143088 return value (cutscene param) is
  not visible here.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl check_playerCanAdvanceForward_8034C36 / beq exit: only fires on a permitted forward step; ldr r0,[r5,#0x24];
    tst r0,0x10000: gated by a bit in the object''s flag field; mov r1,r0 after bl sub_8143088; ldr r0,=0x808C315;
    bl StartCutscene: starts cutscene 0x808C315 with computed param; mov r0,#0x23; add r0,#0xff; bl PlaySoundEffect:
    plays SFX 0x122; ldrb r0,[r5,#4]; bl sub_8143204 and bl sub_8143220: sub_8143220 is the known Cybercrow countdown/state
    setter, so r5 is the Cybercrow record'
