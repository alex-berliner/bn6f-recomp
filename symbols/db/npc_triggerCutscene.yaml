  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The summary
    captures the structure correctly: gates on canAdvance, sub_8002E04, and bit 0x10000 of r5+0x24; calls StartCutscene
    with script 0x808C315, plays SE 0x122, then handles the Cybercrow record. The script address in dword_80A8DEC
    is 0x808C315, not 0x808C2F0 (the disassembly comment for the pointer is slightly off). The proposed name ''cybercrow_triggerCutscene''
    fits as a generic overworld NPC/Cybercrow trigger, but since r5 is a general NPC/Vill record reused for Cybercrow
    among others and the prefix ''npc'' is more appropriate and avoids hardcoding Cybercrow without evidence this
    routine is Cybercrow-specific.; run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
