name: object_cybercrowOrbitUpdate
address: '0x080A8B4C'
kind: function
status: probable
summary: 'Overworld tick handler for the Cybercrow: on sub_80A8DF0 failing, sleeps via sprite_update;
  otherwise runs update helpers, uses index from sub_80A8D02(0x85) into cos/sin tables (scaled <<8) to
  subtract offsets from +0x0C/+0x10, copies player Y into +0x14, then runs remaining helpers and sprite_update.'
interface: (r4/r5 = object record) -> void; also calls sprite_update on the object every frame
details: 'Each frame it first calls sub_80A8DF0; when that check fails it only calls sprite_update (object
  dormant/hidden). Otherwise it runs a chain of helpers: sub_80A8DB0, sub_80A8D42, the known Cybercrow
  wobble sub_80A8CCC, then sub_80A8D02 with 0x85 whose result>>8 & 0xFF, doubled, indexes math_cosTable/math_sinTable.
  The cos/sin values (multiplied by 8<<5 = 256) are subtracted from the record''s fields +0x0C and +0x10,
  moving the object along a circle, and its +0x14 is set to the player''s Y coordinate (from ReadOWPlayerObjectCoords)
  plus 0x14 scaled into the position''s fixed-point format. Three more helpers (sub_80A8C7C, sub_80A8C98,
  sub_80A8CB8) and sub_80A8D7C run before the sprite refresh.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bne loc_80A8BA8 skips all logic straight to sprite_update, so sub_80A8DF0 is an activation/visibility
    check; callee sub_80A8CCC is already documented as 'Cybercrow map object wobble', tying this handler
    to that object; off_80A8BB0/BB4 load math_cosTable/math_sinTable and the indexed values are subtracted
    from [r5,#0xc]/[r5,#0x10], a circular-motion step; bl ReadOWPlayerObjectCoords followed by str r0(=player
    Y + 0x14<<16),[r5,#0x14] pins one axis to the player's position plus a fixed offset; bl sprite_update
    at the tail marks this as a per-frame object update routine
