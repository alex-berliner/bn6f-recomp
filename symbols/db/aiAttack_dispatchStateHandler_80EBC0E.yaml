name: aiAttack_dispatchStateHandler_80EBC0E
address: '0x080EBC0E'
kind: function
status: confirmed
summary: Dispatches an AI attack routine based on the attack sub-state byte stored in the AI attack vars structure,
  tail-calling the selected handler.
interface: void aiAttack_dispatchStateHandler(struct AiAttackVars *vars /* r7 */); // tail-calls handler(state),
  whose registers/flags return directly to the caller
details: 'R7 holds a pointer to an AI attack vars struct; the byte at offset 0 (oAIAttackVars_Unk_00) is the attack
  sub-state. It is loaded, passed in R0, and used to index a two-entry ROM dispatch table at off_80EBC20 (via the
  pointer off_80EBC1C): state 0 -> sub_80EBC28, state 1 -> sub_80EBD3C. The handler pointer is left in R1 for the
  handler. `mov lr, pc / bx r1` makes this an effective tail call, so all registers and NZCV flags flow straight
  from the handler back to this function''s caller. Quirk: state values >= 2 read past the end of the two-entry
  table, so only states 0 and 1 are valid.'
