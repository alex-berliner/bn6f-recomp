status: probable
summary: MPlay note callback that scales a track's current/volume bytes by attacker FPorta's bend and
  possibly a Beast-Out rage offset, then writes back to the channel state.
interface: '(r0 = ChannelPtr (SoundChannel*, unused), r1 = ChannelPtr / NoteTrack) -> r0 = saved LR (return
  address); side effects: writes TrackState[0x8], TrackState[0x9], TrackState[0x10], TrackState[0x11],
  TrackState[0], and pops {r4,pc}'
details: "Called from MPlayMain and ply_note as a per-note/post-update callback. The argument\n  pointer\
  \ is in r1; the function immediately moves it to r2 for convenience. Treats\n  `[r2 + 0]` as a flags\
  \ byte, `[r2 + 0x18]` as a subMode selector (0/1/2).\n\n  Branch 0x1 (flag bit 0x01): pitch processing.\n\
  \    r3 = (PanelX-or-equivalent * PanelY-or-equivalent) >> 5   [mul+lsr from bytes 0x12,0x13].\n   \
  \ If subMode == 1, also r3 *= ((int8)byte0x16 + 0x80) >> 7.\n    r1 = ((int8)byte0x14)<<1 + (int8)byte0x15;\
  \ if subMode == 2 add (int8)byte0x16.\n    Clamp r1 to [-0x80, 0x7f], then r0 = r1+0x80.\n    byte[0x10]\
  \ = (r0 * r3) >> 8\n    byte[0x11] = ((0x7f - r1) * r3) >> 8    — i.e. a split between two track state\
  \ bytes.\n\n  Branch 0x4 (flag bit 0x02): volume processing, computed entirely from bytes 0xa..0xf\n\
  \  combined into r1 (the 16-bit accumulator is right-shifted by 8 to give the track byte\n  at +0x08)\
  \ with low 8 bits stored at +0x09. If subMode == 0, byte 0x16 adds r0<<4 to r1.\n\n  Finally clears\
  \ bits 0x05 of byte[0] (and r0 in r3 marks which bits were) and tail-pops\n  r4 plus the saved LR into\
  \ PC.\n\n  The captured-call snapshot r0=0x0814e427 is the saved return LR into MPlayMain / ply_note,\n\
  \  matching the `pop {r0}; bx r0` epilogue.\n"
