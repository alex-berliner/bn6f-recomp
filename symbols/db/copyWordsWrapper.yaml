name: copyWordsWrapper
address: '0x080068E0'
kind: function
status: probable
summary: Thin forwarding wrapper around the BIOS CpuSet word-copy helper (CopyWords), passing src/dest/size
  straight through.
interface: (r0 = src *const u32, r1 = dest *mut u32, r2 = size in bytes) -> r0 = ? (CpuSet clobbers);
  no meaningful return
details: The function only pushes lr, tail-calls CopyWords (which converts the byte count and issues SWI
  5 CpuSet in word mode), and returns. It does not touch or modify any arguments, so it is a pure pass-through/thunk
  around the word-copy routine, likely existing to give callers a fixed call site or to keep CopyWords
  out of direct use. No structures or fields are touched by the wrapper itself. Which buffers it copies
  in game terms depends entirely on the single caller.
