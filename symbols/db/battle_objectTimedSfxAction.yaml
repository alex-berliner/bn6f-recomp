name: battle_objectTimedSfxAction
address: '0x080D7BB0'
kind: function
status: probable
summary: Battle-object action that on phase 0 plays SFX 0x94 and loads its timer to 30 + Param1*12 frames,
  then ticks down the timer each call and ends the action (CurAction=4) when it expires.
interface: (r5 = battle object) -> void; no return value, updates oBattleObject fields in place
details: 'Standard battle-object per-action phase handler called with r5 = object. On phase 0 it initializes:
  sets CurPhase to 4, plays SFX 0x94 (PlaySoundEffect), and loads oBattleObject_Timer with 0x1E + oBattleObject_Param1*12
  (30 + 12 frames per param unit). On subsequent calls (phase 4) it decrements the 16-bit timer each frame;
  once it goes below zero it sets CurAction = 4 and zeroes CurPhaseAndPhaseInitialized, ending the action.
  The 0x94 sound and long param-scaled delay suggest a slow timed effect (e.g. rumble/hum) whose length
  is configured per spawn.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst/bne splits init phase 0 from run phase 4; mov r0,#0x94;
    bl PlaySoundEffect — init plays a fixed sound effect; mul r0,r1 (12) + add #0x1E stored to oBattleObject_Timer
    — delay scaled by Param1; loc_80D7BCE decrements Timer and on negative sets CurAction=4 and clears
    CurPhaseAndPhaseInitialized to end the action'
  refs:
  - bn6f/asm/asm31.s:69628
