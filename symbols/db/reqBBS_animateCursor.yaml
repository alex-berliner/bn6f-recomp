name: reqBBS_animateCursor
address: '0x08140688'
kind: function
status: confirmed
summary: Animates one frame of the blinking cursor sprite shown in the BBS request dialog
interface: void reqBBS_animateCursor_8140688(ReqBBSGui *r5)
details: "Called every frame while the BBS request GUI is visible. r5 points to the\nReqBBSGui object.\n\n1. Reads\
  \ oReqBBSGui_AnimationTimer1 (per-GUI timer byte) and uses it to\n   index a 4-entry frame table at dword_81406E4+2\
  \ (values 1,1,2,2).\n   Multiplies the resulting frame index by 128 (0x80) and offsets from the\n   cursor tileset\
  \ base at unk_201AA04, then queues an 8-word-aligned GFX\n   DMA of 0x80 bytes to OBJ tile 0 (0x6017F80) via\n\
  \   QueueEightWordAlignedGFXTransfer.\n\n2. Computes the sprite Y coordinate from the GUI object's row field\n\
  \   [r5+0x20] as (row * 16 + 24) pixels.\n\n3. Advances the pose counter at [r5+9]. If the next pose value hits\
  \ the\n   0xFF sentinel in the frame table, the counter resets to 1.\n\n4. Packs the OAM attribute word: OBJ_ENABLE\
  \ (0x40000000) | tile-bank 3\n   (3 << 16) | Y, and queues the sprite through\n   sprite_queueOamEntryThunk_802FE28\
  \ with tile 0xC3FC, no flip, priority 3.\n\nAll r0-r7 and lr are preserved across the two DMA/OAM calls via a\n\
  push/pop pair.\n"
