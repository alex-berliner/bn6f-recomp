details: This six-instruction wrapper passes the table at 0x08128F38 to the table-driven asset loader,
  which copies or LZ77-decompresses its entries into RAM. It is called while the event scene state initializes
  VRAM, palette, background tiles, and scene objects, before the eStruct table is spawned.
