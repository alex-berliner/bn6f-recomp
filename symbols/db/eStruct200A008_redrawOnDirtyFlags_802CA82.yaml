summary: Checks two dirty/update flags (unk04, unk06) on the singleton struct at 0x200A008 and runs the shared redraw
  pair (sub_802C54C + sub_802CAA6) once per set flag.
interface: 'void sub_802CA82(void); /* in: nothing meaningful (r4-r7 preserved); out: nothing; called via BL, returns
  to caller */'
details: 'Refresh/trigger handler for the singleton structure at 0x200A008 ("eStruct200A008").

  Flow: reads field unk04 via eStruct200A008_getUnk04; if non-zero, calls sub_802C54C followed

  by sub_802CAA6 (a paired update/redraw sequence, since the pair is always invoked together).

  Then independently reads field unk06 via eStruct200A008_getUnk06; if non-zero, runs the same

  sub_802C54C + sub_802CAA6 pair again. The two fields are checked independently, so both can

  trigger the redraw in one call, producing two redraw passes. No state is cleared by this

  function itself; whatever sub_802C54C/sub_802CAA6 do (likely recompute and re-render

  something tied to this struct) is responsible for consuming the condition. r4-r7 and r10

  are preserved/passed through untouched; only r0-r3 and flags are clobbered by the calls.

  '
