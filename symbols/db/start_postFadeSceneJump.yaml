- what map (0,0)/progress 0x65/sub-area 0x62 actually renders (title screen vs. intro cutscene)
- what sub_8138758 and the object at [r5+0x20] do, to confirm the triggering context
- what main jumptable state 4 handles
- 'The function sets MainJumptableIndex=4 and writes MapGroup=0, MapNumber=0, SubsystemIndex=0, GameProgress=0x65,
  MapSubArea=0x62. The caller in sub_8138730 runs after a fade completes (IsScreenFadeActive check at
  0x08138744), matching post-fade scene transition. However, ''start_returnToTitleScreen'' is misleading:
