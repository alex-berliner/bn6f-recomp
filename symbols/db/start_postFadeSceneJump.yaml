name: start_postFadeSceneJump
address: '0x0803578C'
kind: function
status: probable
summary: After a fade completes, sets the main jumptable index to 4 and resets GameState to MapGroup=0,
  MapNumber=0, SubsystemIndex=0, GameProgress=0x65, MapSubArea=0x62 to force a scene transition.
interface: () -> void; writes Toolkit.MainJumptableIndex = 4 and GameState MapGroup/MapNumber/SubsystemIndex/GameProgress(0x65)/MapSubArea(0x62)
details: 'Takes no arguments. Sets the toolkit''s main jumptable index to 4 so the next main-loop dispatch
  runs that handler, then writes the GameState struct: MapGroup=0, MapNumber=0, SubsystemIndex=0 (which
  triggers EnterMap via cbGameState_80050EC), GameProgress=0x65, and MapSubArea=0x62. The fixed map (0,0)
  with progress 0x65 and sub-area 0x62 points to a specific fixed scene rather than normal overworld travel.
  The sole caller is a delay counter that only fires once IsScreenFadeActive reports the fade is done,
  so this is a post-fade scene transition.'
evidence:
