  date: '2026-10-19'
  detail: 'sub_803578C: strb r1(4) into [r7,#oToolkit_MainJumptableIndexPtr] switches the main loop state;
    sub_803578C: MapGroup/MapNumber/SubsystemIndex all set to 0, the cbGameState_80050EC EnterMap trigger;
    sub_803578C: GameProgress=0x65 and MapSubArea=0x62 select one specific fixed scene; caller 0x0813874A:
    fires only after a countdown hits 0 and IsScreenFadeActive is true, i.e. after a fade-out; caller
    calls sub_8000F86 on [r5,#0x20] first, cleaning up an active object before the transition'
