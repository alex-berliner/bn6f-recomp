name: sprite_writeBeastOutOamAttr0
address: '0x08136644'
kind: function
status: probable
summary: For six slot IDs in unk_2022B70, reads a halfword from one of two 16-byte OAM attr0 tables (selected
  by r0) and stores it at unk_30019E0+0xF4..0xFE; when i>=4 and ID==0, uses a fixed 'slot off' entry from
  the same table instead.
interface: (r0 = table set, 0 or 1) -> writes 6 halfwords to unk_30019E0 + 0xF4..0xFE; r0,r1,r2-r4,r7
  clobbered, flags clobbered
details: 'Loops i = 0..5, reading a byte ID from unk_2022B70[i]. A pointer table (off_81366A0) indexed
  by r0 selects one of two 16-byte tables of halfwords (byte_81366A8 / byte_81366B8), and the ID indexes
  that table (id*2, ldrh). For i >= 4, if the ID is 0 the code instead loads the table''s entry 7 (offset
  0xE = 0x1E3C), a fixed "slot off" attribute. Each resulting halfword is stored at unk_30019E0 + byte_81366C8[i]*2,
  i.e. offsets 0xF4,0xF6,...,0xFE — six consecutive halfword slots (indices 0x7A-0x7F of an attr array).
  The values look like OAM attr0 words: y in the low byte (0xE1/0xF7 offscreen, 0x1E3C has OBJMODE bits
  = 3 = not displayed), supporting an OAM-staging-buffer interpretation. Note the sequence loading unk_201CF80
  + 0x100 is dead code (r1 is overwritten before use), so unk_201CF80 is not actually read.'
