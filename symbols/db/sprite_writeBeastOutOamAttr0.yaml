- method: assembly-reading
  date: '2026-10-18'
  detail: 'loop 0x813664E-0x813667C: reads ldrb [unk_2022B70 + i], indexes halfword table by id*2, stores
    strh to [unk_30019E0 + byte_81366C8[i]*2]; byte_81366C8 = 0x7A..0x7F, so the six writes land at unk_30019E0
    offsets 0xF4-0xFE as consecutive halfwords; i>=4 && id==0 path loads [table+0xE] = 0x1E3C, whose bits10-11
    = 3 (OAM ''not displayed''), a hide/default attribute; off_81366A0 holds two 16-byte halfword tables
    selected by r0*4, matching a two-variant (e.g. Gregar/Falzar) sprite set on the beastsp route; ldr
    r1,=unk_201CF80 / add #0x100 at 0x8136660-0x8136664 is dead: r1 is reloaded from off_813669C before
    any use'
