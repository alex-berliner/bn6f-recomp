  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is mostly correct: six loop iterations over unk_2022B70, two lookup tables via off_81366A0,
    halfword stored at unk_30019E0+byte_81366C8[i]*2 (offsets 0xF4..0xFE), and the unk_201CF80 load is
    indeed dead since r1 is overwritten by off_813669C two instructions later (lines 0x08136656-0x07).
