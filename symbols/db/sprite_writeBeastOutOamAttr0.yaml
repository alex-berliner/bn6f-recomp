name: sprite_writeBeastOutOamAttr0
address: '0x08136644'
kind: function
status: confirmed
summary: Populates six OAM shadow-buffer slots (indices 0x7A–0x7F) for the Beast Out transformation sprite, selecting
  attribute values from a per-mode lookup table.
interface: 'void sprite_writeBeastOutOamAttr0(u32 mode /* r0: 0 or 1 selects sprite variant */);  // clobbers r0–r3;
  preserves r4–r7, lr'
details: Iterates i = 0..5. For each iteration reads a 1-byte index from the sprite-attribute staging buffer at
  unk_2022B70[i]. When i >= 4 and the index byte is 0 the entry is treated as "empty" and a fixed u16 at offset
  0xE of the mode-selected table is written instead. Otherwise the u16 at table + index*2 is used. The mode argument
  (0 or 1) selects between two byte tables pointed to by off_81366A0 (byte_81366A8 and byte_81366B8), each holding
  a series of OAM attribute words for a different Beast Out sprite variant. The six output slot indices are supplied
  by the constant byte table byte_81366C8 = {0x7A,0x7B,0x7C,0x7D,0x7E,0x7F}, so the function writes a contiguous
  12-byte region of the OAM shadow buffer at unk_30019E0. A small addition of 0x100 to unk_201CF80 appears in the
  empty-slot branch when mode == 0 but is immediately overwritten by the table-pointer lookup (dead code / assembler
  artifact). The two tables end with bytes 0x5D,0x80,0x2,0x3C,0x1E and 0x7,0x3C,0x1E respectively, consistent with
  OAM size/priority/palette encoding.
