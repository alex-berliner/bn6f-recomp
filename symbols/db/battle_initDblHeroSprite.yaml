  reproduce: python3 tools/asmcat.py 0x080BCD38
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The summary is largely accurate: it copies AIDataPtr and NameID from RelatedObject1Ptr (forces 0x1AB
    when Param1==1), loads a sprite/animation, offsets position from the partner''s +0x34 using a signed
    per-Param1 entry (dword_80BCE44 = 0x0A0AF6F6 holds ±10) multiplied by front direction, sets palette/flip,
    and spawns/links the partner object via spawnDblHeroObject_80BD20A when Param1==0. However, calling
    it ''battle_setupDblHeroPartnerSprite'' is misleading because Param1==0 is the main spawn path that
    actually creates the linked double-hero object; the sprite setup is secondary. A name reflecting both
    roles is more accurate.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
