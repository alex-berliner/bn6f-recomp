name: battle_initDblHeroSprite
address: '0x080BCD38'
kind: function
status: probable
summary: 'Initializes a double-hero battle object: mirrors AIDataPtr/NameID from its partner (forcing
  0x1AB when Param1==1), loads/recolors a navi sprite, offsets its position from the partner''s coords
  by a per-Param1 entry times the facing direction, and when Param1==0 spawns and stores the matching
  partner via spawnDblHeroObject_80BD20A.'
interface: (r5 = battle object with oBattleObject_RelatedObject1Ptr set to its partner) -> r0 = 0; sprite
  loaded, position/panels/palette/flip set, state set to CUR_STATE_UPDATE; flags set
details: 'The function copies the partner''s AIDataPtr and NameIDAndChip into this object (unless Param1==1,
  where NameID is forced to 0x1AB). It derives sprite/an ids from NameID: if actor type==2 it reads NaviStats
  bytes 0x2C/0x29 and runs chip_class_lookup_800FC9E, else enemy_getArmPosition_800F26C, then calls sprite_load/sprite_loadAnimationData
  and resets CurAnim to 0. It reads the partner''s x/y/z triple at +0x34, offsets x by a signed per-Param1
  byte from dword_80BCE44 (±10) multiplied by the facing direction from object_getFrontDirection, writes
  it back to this object''s +0x34, then object_setPanelsFromCoordinates and Z=0. It sets the palette via
  battle_pickPaletteIndexForNavi_801002C (skipped when Param1==1), applies object_getFlip to the sprite,
  calls sub_8010DF6 and sub_80E1352(partner,0), and when Param1==0 calls spawnDblHeroObject_80BD20A with
  the partner''s panel x/y/element/damage word, cross-linking both objects via oBattleObject_ExtraVars+0x10
  before advancing the state phase.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[Param1]; cmp #1 branches select NameID 0x1AB vs copying NameIDAndChip from RelatedObject1Ptr;
    calls sprite_load/sprite_loadAnimationData/sprite_hasShadow after id resolution via unpackVerActorTyAndAIIdx_800F29C;
    off_80BCE44 dword 0x0A0AF6F6 = signed bytes ±10/±10 used as x/y offset scaled by object_getFrontDirection
    result; battle_pickPaletteIndexForNavi_801002C + sprite_setPalette recolors the sprite as a navi;
    calls spawnDblHeroObject_80BD20A (Param1==0) and stores the result in both objects'' ExtraVars+0x10,
    cross-linking them'
