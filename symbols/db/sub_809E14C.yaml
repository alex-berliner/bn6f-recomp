name: sub_809E14C
address: '0x0809E14C'
kind: function
status: confirmed
summary: Asks the overworld player to play a fixed animation, applying it immediately (and raising event flag EVENT_1719)
  if allowed, otherwise parking the id in a pending slot for later.
interface: void sub_809E14C(u32 animId /* r0 */); returns nothing; clobbers r0-r3,r12 and flags; preserves r4-r7
details: "Entry point for triggering one of the overworld player's fixed (scripted/cutscene)\nanimations. Takes\
  \ the animation id in r0 and saves it in r4. It loads the pointer to\nstruct eStruct200ace0 (overworld player\
  \ state, at 0x200ACE0) into r7 and calls\nsub_809E462, which reads r4 (the id) and r7 (the struct) and returns\
  \ a yes/no in r0\n(and the Z flag) for whether the new animation can take effect right now.\n- Approved (sub_809E462\
  \ returns 0 / Z set): the id is stored to the fixed-animation\n  select byte at eStruct200ace0+2 (byte_200ACE2,\
  \ field owPlayerFixedAnimationSelect_02),\n  and event flag EVENT_1719 (bank 0x17, flag 0x19) is raised via SetEventFlagFromImmediate.\n\
  \  That flag presumably tells the overworld animation driver that a fixed animation was\n  newly selected.\n-\
  \ Denied (nonzero): the request is deferred by writing the id to the pending byte at\n  eStruct200ace0+0x1c (byte_200ACFC,\
  \ field Unk_1c), to be picked up later when the\n  current animation/busy state ends.\nIn both cases the function\
  \ returns immediately; it touches no other fields and the\ncaller's r4-r7 are preserved.\n"
