name: chatbox_ClearEntryWaitFlagAndAdvanceEntry_80411BC
address: '0x080411BC'
kind: function
status: confirmed
summary: Clears the text-advance event flag for the current chatbox entry and steps the chatbox entry pointer to
  the next 4-byte slot.
interface: void chatbox_80411BC(u16 eventFlagBitfield /*r0*/, ChatboxEntry *entry /*r4, also r10 caller-preserved
  base*/); // returns with r4 advanced by 4, flags set by the ADDS
details: 'Very small helper used by the chatbox/text-advance system. r0 holds an event flag

  bitfield (the "press A / text advance" flag used to gate waiting on a chatbox entry),

  which is passed straight to ClearEventFlag so the game stops treating the current

  entry as awaiting confirmation. r4 is a pointer into the chatbox''s current entry

  record (4 bytes per slot); after the flag is cleared, r4 is incremented by 4 with

  ADDS (add r4, #4), which also sets NZCV from the pointer arithmetic — the caller''s

  contract lists nz c v as outputs for this reason. No other registers are touched;

  r10 (likely a chatbox state base pointer) is only observed as an input and is not

  modified. The pop {pc} returns directly to the caller of the wrapper.

  '
