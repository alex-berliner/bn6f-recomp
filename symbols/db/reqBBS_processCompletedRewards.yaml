name: reqBBS_processCompletedRewards
address: '0x081430F4'
kind: function
status: probable
summary: 'Processes a table of BBS request completions: stores each entry''s word into the per-request
  status array and sets the request''s completion event flag.'
interface: (no args used) -> r0 = 0; calls SetEventFlag and reqBBS_setFlag; clobbers r0-r4
details: 'First calls reqBBS_setFlag_e17b0f7_8140A00 (which sets event flag 0x7 in event byte 0x17) and
  sub_8143088, whose return value (r0) indexes a table at off_8143168 by *4 to pick a list head. It then
  walks an 8-byte-per-entry list: byte 0 is a nonzero request ID used as a terminator when 0, word at
  +4 is a value. For each entry it writes the word to unk_2011EA0 + id*4 (a per-request status/result
  array) and sets event flag 0x16f1 + (id-1), i.e. one completion flag per request ID in a contiguous
  block. Returns 0. The pattern — table select, per-ID status write, batched SetEventFlag — matches awarding/acknowledging
  completed BBS requests after the reqBBS flag handler ran.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl reqBBS_setFlag_e17b0f7_8140A00 at top: BBS request handler runs first; lsl r0,r0,#2 + ldr
    r4,[r4,r0]: sub_8143088''s result selects the list from off_8143168; str r0,[r1] with r1=unk_2011EA0+id*4:
    writes entry value to per-request slot; ldr r0,=0x16f1; sub r1,#1; bl SetEventFlag: sets flag 0x16f0+id
    per entry; ldrb r0,[r4]; beq exit; add r4,#8: 0-terminated 8-byte entry list'
