name: battleObject_panelShaker_init_80C7C3C
address: '0x080C7C3C'
kind: function
status: confirmed
summary: 'Initializes a panel-shaker battle object: loads its 128x20x20 sprite, sets up a collision hitbox (with
  optional paralysis status when Param1==1), plays the panel-shake sound effect, and advances the object to its
  update phase.'
interface: r5 = object (battleObject pointer, preserved); r8, r10 = caller context (preserved); no meaningful return
  registers; clobbers r0-r3, lr, all flags
details: 'Calls object_setCoordinatesFromPanels to place the shaker on its grid panel. Loads sprite tile 0x80 at
  20x20 with no shadow. Sets header flag bit 2 (likely "active/visible" or "no idle animation" for this object type).
  Resets CurAnim and CurAnimCopy to 0, loads animation data, and selects palette 0. Copies the object-level flip
  onto the sprite. Allocates collision data via object_createCollisionData; on allocation failure the object is
  freed via object_freeMemory and the init is aborted. The collision box width depends on Param1: when Param1==1
  the box is 10 units wide (wider grab area) and status-effect 0x10 (paralysis) is applied on contact; otherwise
  the box is 4 units wide (single-panel shake). Hit effect is set to 3. object_presentCollisionData registers the
  hitbox with the battle field. Sound effect 0x12E (0x2f + 0xff) is played (panel-shake audio). Finally the state-action-phase
  field is written to CUR_STATE_UPDATE so the object begins ticking. r8 and r10 are passed through to presentCollisionData
  and PlaySoundEffect respectively without modification.'
