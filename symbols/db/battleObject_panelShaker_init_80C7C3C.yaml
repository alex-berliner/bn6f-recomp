status: probable
summary: Initializes the battle-object "Panel Shaker" support object at r5 (sprite load, no-shadow, palette
  0, panel-recompute, collision setup) and transitions it to its update state while playing its spawn
  SFX.
interface: '(r5 = BattleObject ptr, r10 = Toolkit ptr, r8 = ?, lr = ret) -> void ; side effects: allocates
  CollisionData, plays SFX 0x2e, sets CurState=CUR_STATE_UPDATE'
details: '1. Calls object_setCoordinatesFromPanels() to refresh pixel X/Y from the object''s current PanelXY.

  2. Clears FuturePanelXY (oBattleObject_FuturePanelXY) to 0.

  3. Loads the PanelShaker sprite (tile id 0x14) and shadow flag 0x14 into object slot 0x80 via sprite_load,
  then strips the shadow with sprite_noShadow.

  4. Sets OBJECT_FLAG_VISIBLE (bit 1) into oObjectHeader_Flags; resets CurAnim/CurAnimCopy to 0 and calls
  sprite_setAnimation(0) + sprite_loadAnimationData.

  5. sprite_setPalette(0) and sprite_setFlip(object_getFlip()).

  6. Allocates a CollisionData slot via object_createCollisionData; on failure calls object_freeMemory
  and returns without scheduling an update.

  7. Reads Param1: if ==1 (Param1==1 path at loc_80C7C98) sets collision-type tables with r1=0xa/r2=5/r3=3
  and additionally applies object_setCollisionStatusEffect1(0x10); otherwise uses r1=4/r2=5/r3=3.

  8. object_setCollisionHitEffect(3), object_presentCollisionData() (registers this frame''s collision
  into the global collision system).

  9. PlaySoundEffect(0x2e) (0x2f + 0xff -> 0x2e).

  10. Writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized and returns.

  The Param1==1 variant installs status effect 0x10 in addition to the default collision setup, suggesting
  two spawn variants (likely normal vs. cracked-panel variant).

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, #0; strh r0, [r5,#oBattleObject_Z16]` (Z16 == offset of FuturePanelXY within AllianceAndDirectionFlip
    union) zeroes future panel coords. - `mov r1, #0x14; mov r2, #0x14; mov r0, #0x80; bl sprite_load`
    loads tile 0x14 into slot 0x80 — concrete sprite id of this object type. - `orr r0, r1` with r1=2
    sets OBJECT_FLAG_VISIBLE on oObjectHeader_Flags. - `bl object_createCollisionData` + `tst r0, r0;
    bne ...; b locret_00C7CBE` is the classic "abort if collision slot unavailable" path that frees the
    object and exits. - `ldrb r1, [r5,#oBattleObject_Param1]; cmp r1, #1; beq loc_80C7C98` is the explicit
    two-variant fork driven by Param1. - The two setupCollisionData calls differ only in r1 (0x4 vs 0xa);
    the 0xa branch additionally calls `object_setCollisionStatusEffect1(0x10)` — matching collision-type-group
    encoding with an extra status. - `object_setCollisionHitEffect(3)` is the standard hit-effect (e.g.
    "panel crack" type 3) for panel-manipulation objects. - `mov r0, #0x2f; add r0, #0xff` → r0=0x2e then
    `bl PlaySoundEffect` plays sound 0x2E (a panel/shake SFX id range). - `mov r0, #CUR_STATE_UPDATE;
    str r0, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]` writes the standard "init done,
    now run update" state for the per-frame jumptable.'
