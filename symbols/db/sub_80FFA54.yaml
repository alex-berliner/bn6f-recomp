name: sub_80FFA54
address: '0x080FFA54'
kind: function
status: hypothesis
summary: Computes a palette-like index/base value for an object by looking it up in a small table (0x12,0x18,0x1E,0x24),
  then adds 0x3C when the object carries flag bits 0xA000.
interface: u32 sub_80FFA54(u32 r5_object); // -> r0 = base value (+0x3C if flags & 0xA000)
details: 'Entry point loads the pointer to dword_80FFA74 (a table of four byte-like entries 0x12, 0x18, 0x1E, 0x24,
  i.e. 18/24/30/36 in steps of 6) and calls sub_800FE28 with the table pointer in r0 and the object (passed in r5
  by all callers) still in r5; sub_800FE28 returns a base value in r0 (and something in r2, which is ignored here).
  The result is saved in r4. object_getFlag is then called on the same object (r5) and the result is tested against
  0xA000 (bits 13 and 15); if either bit is set, 0x3C (60) is added to the base value. Returns the adjusted value
  in r0. The +0x3C offset applied to a flag-conditioned variant strongly suggests a palette/VRAM-slot style second
  bank or an alternate-color variant of the base value, but the semantics of sub_800FE28 and object_getFlag are
  not typed yet, so this remains a guess. r4 is preserved for the caller; r1, r2 and flags are clobbered.

  '
