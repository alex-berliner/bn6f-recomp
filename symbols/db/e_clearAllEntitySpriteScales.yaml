name: e_clearAllEntitySpriteScales
address: '0x080466AA'
kind: function
status: probable
summary: Sweeps all 15 entity slots and, for each active one, clears its sprite scale counter and marks
  the sprite unscalable.
interface: () -> r0 = clobbered; touches every entity struct in eStructArr2008450 (0x58-byte stride)
details: Walks the entity array at 0x2008450 (15 entries, 0x88... actually 0x58 bytes apart), skipping
  entries whose active byte at offset 0 is zero. For each active entity it calls sprite_clearScaleCounterAndMakeUnscalable_804668A,
  which zeroes the scale/cycle counter byte and rebuilds that entity's sprite as unscalable. Since r0
  is left holding the loaded flag byte, the callee evidently works off the shared r5 pointer/global context
  rather than a passed entity pointer. This is a global reset of sprite zooming (used with beast-out size-scaling
  effects), called from routes including beastsp.
