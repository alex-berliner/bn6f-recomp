name: battle_stepNaviDisplayThenChipSelect
address: '0x08009916'
kind: function
status: probable
summary: 'Battle state handler: on entry sets up the result/navi display once, then runs the chip-select
  init until it finishes, then advances the battle state machine to 0x14.'
interface: (r5 = battle state struct) -> r0 = 0 when chip-select init still running, 1/nonnull when phase
  done and state advanced; writes state fields
details: This is a battle-mode sub-state step keyed off the state struct in r5. On the first pass (oBattleState_SubPhaseInitFlag
  == 0) it calls setupNaviDisplay_802C34E with the 12-byte result record at unk_2035260 (battle state
  +0x0D area) to build the result-screen/navi display, then latches the init flag to 4 so setup runs only
  once. Every frame it calls battle_initChipSelect_802BD60, which initializes the chip-select/custom screen
  at eS20364C0 and returns nonzero when done. Once that returns nonzero, it sets oBattleState_Index_01
  = 0x14 and clears oBattleState_StatePhaseAndInitFlag, moving to the next battle state; otherwise it
  returns with the state unchanged.
