name: sub_8030E14
address: '0x08030E14'
kind: function
status: confirmed
summary: line-vs-point hit test; on hit returns the segment/line crossing offset (rx,ry) relative to a reference
  point, on miss returns (0,0)
interface: "u32 sub_8030E14(u32 matrix, u32 x1, u32 y1, u32 x2, u32 y2, u32 mode, u32 r9_in)\n    /* r0: matrix\
  \ ptr (ref0 = +0/+4, ref1 = +0xC/+0x10) */\n    /* r2: x1, r4: y1, r3: x2, r5: y2 */\n    /* r6: mode (1 = one-sided,\
  \ ignore ref1) */\n    /* returns: r0 = rx (crossing x relative to ref0; 0 on miss) */\n    /*          r1 = ry\
  \ (crossing y relative to ref0; 0 on miss) */\n    /*          r4,r6,r7,r8,r9 = per-path working values the caller\
  \ may keep */\n    /* clobbers flags; lr clobbered via tail-pop */\n"
details: 'Treats the two endpoints (x1,y1)/(x2,y2) as defining the extended line of a

  2D segment and tests whether the two reference points stored in `matrix`

  lie on opposite signed sides of that line (one-sided when mode==1, only

  ref0 must be strictly on the negative side).


  Per-axis line math: dy = y2 - y1, neg_dx = x1 - x2,

  cross = x2*y1 - x1*y2, side(p) = cross + px*dy + py*neg_dx.


  On a hit, each axis of the crossing point is solved by calling

  sub_8031048 (a divmod helper at 0x08031048) once per axis with the

  appropriate numerator/denominator and the live `side` value still in r5

  from whichever ref-point test ran last; the quotient is then de-biased

  by the matching ref0 coordinate read back from `matrix` after the call.

  Outputs are crossing offset (rx,ry) from ref0, mirrored into r4 (rx)

  and r8 (ry), with the last divide''s remainder/quotient left in r6/r7

  and rx duplicated into r9.


  On a miss it returns (0,0) and leaves dy/neg_dx in r6/r7, the last

  py*neg_dx partial product in r4, mode in r8, and the caller''s r9

  value passed through untouched.

  '
