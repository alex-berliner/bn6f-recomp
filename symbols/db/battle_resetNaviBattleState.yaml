name: battle_resetNaviBattleState
address: '0x08014080'
kind: function
status: probable
summary: Guarded by NaviStats byte 0x29, clears several ObjectFlags1 bits (0x20000, 0x20, 0x40000, 0x10),
  zeros NaviStats bytes 0x23/0x1b/0x1d/0x1c, sets byte 0x07 to 0xFF, refreshes collision data passing
  the Custom+ flag result, and if byte 0x2C is zero stores 0xFF into the object's AIData BLeftAbility.
interface: (r0 = battle object) -> void; destroys r0-r3
details: The function reads NaviStats byte 0x29 first and returns without touching anything if it is nonzero.
  Otherwise it clears ObjectFlags1 bits 0x20000 and 0x40000, zeroes NaviStats bytes 0x23, 0x1b, 0x1d and
  0x1c, clears flag bits 0x20 and 0x10, sets byte 0x07 to 0xff, and refreshes the collision data via object_updateCollisionData
  (args 1,2). Finally it re-reads byte 0x2c and only if it is zero stores 0xff into the object's AIData
  BLeftAbility byte. The BLeftAbility name plus the 0x29/0x2c guards strongly suggest BeastOut/BeastOver-related
  teardown of temporary battle state.
