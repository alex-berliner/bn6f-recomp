name: chip_SelectNameTextTable_8027D10
address: '0x08027D10'
kind: function
status: confirmed
summary: Splits a battle chip id into one of two chip-name text tables plus an index into the chosen table.
interface: u32* chip_SelectNameTextTable(u32 chipId /* r0 */); /* returns table ptr in r0, index in r1 */
details: 'Takes a chip id in r0 and truncates it to 9 bits (ids are 0..511, covering standard + Mega + Giga chips).
  A base pointer table at off_8027D2C initially points at TextScriptChipNames0; if the 9-bit id is greater than
  0xFF the base advances by one word to TextScriptChipNames1 and the id is truncated to 8 bits (0x100..0x1FF become
  0x00..0xFF, wrapping into the second table). Returns r0 = the loaded pointer to the selected chip-name text array
  and r1 = the index to use within it. Implemented with "mov pc, lr" so it works from Thumb callers via a plain
  branch-with-link. Flags (nzcv) are clobbered.

  '
