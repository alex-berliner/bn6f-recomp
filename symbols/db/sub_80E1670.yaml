open_questions:
- Exact semantics of r0 in object_getEnemyByNameRange (count vs flags vs index) and
- the meaning of 0x1c3 (still looks like a bitmask but doesn't fully match byte_80E16C4)
- What sub_80E16CC actually does with (r0=slotIdx, r1=relatedObj, r2=table) - it likely
- picks one of the table entries for that slot. Without its body, the function's higher-
- level purpose is partially inferred.
- 'Whether the returned r0 is meaningful: the contract says out=[''r0'',''r5''] but the'
- assembly only does `pop {pc}` without a `mov r0,...`, so r0 likely returns whatever
- the last sub_80E16CC set or remains clobbered.
- The trailing `balign 4, 0` followed by `byte_80E16C4:` (8 bytes of data) being right
- after `thumb_func_end` is unusual - it suggests this data may belong to a different
- routine (sub_80E16CC?) but is physically co-located.
