name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: On the AI's battle object (`r5`), locate a 4-slot enemy-name-range array using the flipped alliance, then
  probe RelatedObject1Ptr for matching names at slot indices 0, 1 and 2 via sub_80E16CC.
interface: '(r5 = AI/target BattleObjectPtr, r6 caller-saved, r7 caller-saved, r10 = toolkit, lr) -> r0 = last sub_80E16CC
  return (probe hit flag), r5 preserved (callee-saved) ; side effects: stack scratch `0x34` bytes, calls object_getEnemyByNameRange
  and sub_80E16CC three times.'
details: "- Sets up a 4-word (0x34 bytes = 13 words + sp+0 padding aligns to 4) scratch buffer on the stack at r4\
  \ = sp, passed to object_getEnemyByNameRange as `out` array (initialised with `r1=0`, `r2=0x1c3`).\n  - Flips\
  \ the caller's Alliance byte (`ldrb r3, [r5,#oBattleObject_Alliance]; eor r3, #1`) so the search runs against\
  \ the opposing side.\n  - Result count is shifted into slot 0 (str r0, [r4]; mov r6,r0 then lsl r3,r0,#2; add\
  \ r3,r3,r4; str r0,[r3]) before each probe - meaning the first u32 holds the count returned by the range query.\n\
  \  - Then it loops for indices 0, 1, 2 calling sub_80E16CC(r0=index, r1=r5->RelatedObject1Ptr, r2=r4=buffer);\
  \ on the first non-zero return it skips to the epilogue.\n  - Only one named caller (sub_80E1566) sits in a small\
  \ routine that already knows about enemy name lists, suggesting this lives inside a battle-AI naming/selection\
  \ path.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r3, [r5,#oBattleObject_Alliance]; eor r3, #1` (lines `mov r3, ... eor r3, r0`) directly flips
    the alliance and feeds it into object_getEnemyByNameRange''s `r3`. - `ldr r1, [r5,#oBattleObject_RelatedObject1Ptr]`
    is reused unchanged for all three sub_80E16CC calls, treating RelatedObject1Ptr as the search pool. - Stack
    frame of 0x34 (sub sp, #0x34) plus `mov r4, sp` and a 4-slot walk (`lsl r3,r0,#2; add r3,r3,r4`) shows a small
    array used as the range-query output buffer. - Hardcoded `dword_80E17E4 = 0x1c3` passed in r2 likely selects
    which enemy name range table to walk over. - Final `bx`/pop with `out=r0,r5` matches the contract: r5 (the AI
    BattleObject) is preserved; r0 holds whatever sub_80E16CC last returned. - Three `cmp r0,#0; bne loc_80E16BA`
    repeated blocks match a short-circuit "find first match across indices 0/1/2 then exit".'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080E1670

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080e1670 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- What object_getEnemyByNameRange actually fills into the stack buffer (whether the first dword is the count or
  the names themselves) - need to read its body to confirm the 0x34-byte layout.
- The semantic meaning of `0x1c3` and how RelatedObject1Ptr is structured - is it a list of allied names or a per-side
  list of names? Would be confirmed by sub_80E16CC's body and by the caller sub_80E1566.
- Whether r6 (`mov r6, r0` after getEnemyByNameRange) is later used by the caller or just stored for debugging -
  the contract lists r6 as caller-saved in/out so it is throwaway here.
