name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: Initializes a 4-slot name-range lookup table for an enemy's cross-element weak-point search
interface: '(r5 = BattleObject*, r10 = Toolkit*, lr) -> r0 = 0 ; side effects: writes 0x34 bytes on stack, calls
  object_getEnemyByNameRange and sub_80E16CC'
details: "Allocates 0x34 bytes on the stack as a scratch buffer at r4=sp, then loads r5's Alliance\n  (oBattleObject_Alliance),\
  \ XORs it with 1 to get the opposite side, and calls\n  object_getEnemyByNameRange(r4=outBuf, 0, 0x1c3=range)\
  \ to populate it with up to 0x1c3\n  enemy name IDs. Stores the returned count in r6 and writes 0 into slot 0\
  \ of the buffer\n  (presumably as a terminator). Then for related object index 0, 1 and 2 of the source\n  BattleObject\
  \ (r5->RelatedObject1Ptr at oBattleObject_RelatedObject1Ptr), invokes\n  sub_80E16CC with r0=index, r1=related\
  \ object ptr, r2=buffer. As soon as one returns\n  non-zero the loop falls through. The contract returns r0 (likely\
  \ the index that\n  matched) and tears down the stack. Used by sub_80E1566 which is in the AI/external\n  object\
  \ setup path.\n"
