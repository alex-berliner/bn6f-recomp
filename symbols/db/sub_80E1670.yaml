name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: For a battle object, populate a stack scratch buffer with the opponent-side actors returned by `object_getEnemyByNameRange`
  matching the index 0/1/2, based on the object's alliance.
interface: (r5 = current battle object, r10 = toolkit, lr = return) -> r0 = scratch return (latest sub_80E16CC return,
  or 0), r5 = current battle object preserved
details: "The function allocates 0x34 bytes on the stack (`sub sp, sp, #0x34`), used as a scratch table (saved as\
  \ r4).\n  It reads `oBattleObject_Alliance` (offset 0x16) from r5 (the current battle object), toggles bit 0 (`eor\
  \ r3, r0` with r0=1), and passes that as the third argument (`r2`) to `object_getEnemyByNameRange` along with\
  \ `r1 = 0` and a count from `dword_80E17E4` (= 0x1c3 = 451 enemies, i.e. iterate the whole enemy table). The result\
  \ is stored in `r6`.\n\n  Then for `result_index = 0, 1, 2`, it writes `0` to `scratch[result_index*4]` (`str\
  \ r0, [r3]` where r3 = r4 + index*4) and calls `sub_80E16CC(scratch_as_arg=result_index, relatedObj1Ptr=r5->RelatedObject1Ptr,\
  \ scratch_buffer=r4)`. If `sub_80E16CC` returns non-zero it short-circuits the loop (bne loc_80E16BA), otherwise\
  \ it continues with the next index. After the loop it pops and returns.\n\n  Net effect: it tries to find 3 enemy\
  \ battle objects (the opponents of `r5`'s alliance) and, for each, calls `sub_80E16CC` with the enemy's index,\
  \ the related-object pointer of `r5`, and the scratch buffer; only the first non-zero return aborts further calls.\
  \ The result in `r6` and the populated scratch buffer are presumably used by the caller (sub_80E1566) to pick\
  \ a target.\ninterface: (r5 = current battle object, r10 = toolkit, lr = return) -> r0 = scratch return (latest\
  \ sub_80E16CC return, or 0), r5 = current battle object preserved\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4,r6,r7,lr}` + `sub sp, sp, #0x34` makes a 0x34-byte scratch buffer on stack (`mov r4, sp`)
    — bn6f/asm/asm31.s:88300. - `ldrb r3, [r5,#oBattleObject_Alliance]` (offset 0x16) loads alliance, `eor r3, #1`
    toggles it to find the opposing side — bn6f/asm/asm31.s:88304. - `bl object_getEnemyByNameRange` with r0=scratch,
    r1=0, r2=toggled alliance, r3=0x1c3 — iterates enemy table once per call — bn6f/asm/asm31.s:88309. - `mov r6,
    r0` saves the returned table pointer and uses `lsl r3, r0, #2; add r3, r3, r4; str r0, [r3]` to clear three
    entries in the scratch table for r6=0..2 — bn6f/asm/asm31.s:88310. - The three calls `mov r0, #0/#1/#2; ldr
    r1, [r5,#oBattleObject_RelatedObject1Ptr]; mov r2, r4; bl sub_80E16CC; cmp r0, #0; bne loc_80E16BA` invoke `sub_80E16CC`
    three times with index, related-object1, and scratch; non-zero short-circuits the loop — bn6f/asm/asm31.s:88314..88327.
    - `byte_80E16C4` follows the function but appears to be unrelated tail data (an 8-byte table of constants 0xA0,
    0xA4, 0xAC, 0xB0, 0xB4, 0xB8, 0xBC, 0xFF); no live use in this function — bn6f/asm/asm31.s:88331. - Caller `sub_80E1566`
    (in= r5/r6/r7/r10/lr, out= same wide set) consumes r6 (or the scratch) immediately after; consistent with a
    "pick a target for r5''s related object" helper.'
