name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: Checks the alliance of the BattleObject's RelatedObject1Ptr against the caller's alliance, returning a
  result via sub_80E16CC into a stack buffer.
interface: '(r5 = caller BattleObject, r10 = toolkit) -> r0 = 0 ; side effects: stack scratch, may read RelatedObject1Ptr
  chain'
details: "- Allocates 0x34 bytes on the stack as a scratch buffer (r4 = sp).\n  - Loads the caller's Alliance byte\
  \ (offset 0x16) from r5, XORs with 1 (eor r3, #1) to flip friend/enemy.\n  - Calls object_getEnemyByNameRange(r4=buf,\
  \ r1=0, r2=0x1c3) which presumably fills the scratch buffer with a name list / table and returns a count in r0\
  \ -> saved in r6.\n  - Zeros buf[r6*4] (str r0, [r3]) to clear the first slot beyond the populated entries.\n\
  \  - Calls sub_80E16CC(bufIdx=0, r1=RelatedObject1Ptr, r2=buf) and bne-skip-out if non-zero; repeats with bufIdx=1\
  \ and 2. Each non-zero short-circuits the chain to loc_80E16BA which simply restores sp and returns.\n  - The\
  \ result r0 on return is the last bufIdx (2) when all three checks return 0, otherwise 0. The exact semantics\
  \ live in sub_80E16CC; from this caller it is a \"first match in {0,1,2}\" probe of RelatedObject1Ptr against\
  \ the enemy-name list.\n  - This is part of the AI's enemy-target search using a reversed-alliance search: the\
  \ caller asks \"which of the three target slots is an enemy of me?\"\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r3, [r5,#oBattleObject_Alliance]` and `eor r3, #1` at the entry show the function flips the caller''s
    Alliance to the opposing side before searching (`oBattleObject_Alliance` = 0x16). - `bl object_getEnemyByNameRange`
    with a stack buffer (r4=sp, r1=0, r2=0x1c3=451) populates an enemy-name table; result r0 stored in r6 and used
    to size-clear the buffer (`lsl r3, r0, #2; add r3, r3, r4; mov r0, #0; str r0, [r3]`). - `ldr r1, [r5,#oBattleObject_RelatedObject1Ptr]`
    (offset 0x4c) loads the first related-object pointer and passes it to sub_80E16CC three times with indices 0,
    1, 2. - Each call uses `cmp r0, #0 / bne loc_80E16BA`, indicating a "found / not found" boolean style return;
    the `bne` jumps to the epilogue, leaving r0 with the last call''s non-zero value. - Only caller is sub_80E1566
    (also unnamed AI-routine in the 0x080e15xx range), consistent with AI enemy-targeting helpers. - The 8-byte
    literal at byte_80E16C4 is data referenced by something else, not used by this function.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080E1670

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080e1670 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- The exact meaning of sub_80E16CC's bufIdx (0/1/2) and what it indexes in the scratch buffer is unknown; whether
  the indices are "enemy by panel column / row / distance" or AI attack-vars array slots is unclear. Disassembly
  of sub_80E16CC would settle it.
- Whether r0 on return is meaningful to the caller (it currently is 0 if matched early, 2 if none matched) is unknown
  because the only caller sub_80E1566 is also unnamed.
