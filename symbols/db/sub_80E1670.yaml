name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: Resolve opposing-side enemies within an enemy-name ID range and store their object pointers into a caller-provided
  4-entry table on the stack.
interface: '(r5 = self BattleObject*, r6..r10 scratch) -> void ; stack: out [BattleObject*, BattleObject*, BattleObject*,
  u8] indexed by alliance-flipping enemy name IDs, side-effect-only (caller-provided scratch + stack)'
details: "Stack frame reserves 0x34 bytes used as a 4-slot u32 table (8*4=0x20 plus trailing bytes),\n  where index\
  \ 0..2 receive BattleObject* of enemies (set to 0 if none) and the trailing bytes\n  appear to hold 7 enemy-name\
  \ IDs (0xA0,0xA4,0xAC,0xB0,0xB4,0xB8,0xBC,0xFF) stored in `byte_80E16C4`.\n\n  1. Load `oBattleObject_Alliance`\
  \ (off 0x16) from `r5` and XOR with 1 to get the opposing\n     alliance (friend<->enemy). This selects which\
  \ list of name IDs to enumerate.\n  2. Call `object_getEnemyByNameRange(r4=table_ptr, r5=self?, r0=1=enable?,\
  \ r1=0, r2=0x1c3 mask/range)`\n     - The literal 0x1c3 looks like a bitmask for the 7 name IDs in `byte_80E16C4`\n\
  \       (0x80|0x40|0x20|0x10|0x08|0x04|0x02|0x01 = 0xFF, but 0x1c3 = 0b111_000_011 covers bits 0,1,6,7,8,9).\n\
  \     Actually 0x1c3 = 0b1_1100_0011 - selects bits 0,1,6,7,8. The remaining `byte_80E16C4` IDs\n     (0xA4,0xAC,0xB0,0xB4,0xB8,0xBC\
  \ = bits 2..5) are not covered; `r0=1` likely toggles \"include\n     viruses\" vs \"include navis\". Return:\
  \ `r6 = bitmask` of which IDs had hits.\n  3. `r6<<2` -> word offset; for each set bit `i`, the table slot at\
  \ `[r4+i*4]` is zeroed.\n  4. Three sequential calls to `sub_80E16CC(r0=arg0, r1=self->RelatedObject1Ptr (off\
  \ 0x4c), r2=r4=table)`\n     with arg0 in {0,1,2}. Each call returns nonzero if it populated a slot. The bne's\
  \ collapse\n     to a single fall-through (loc_80E16BA) regardless of which call succeeded.\n  5. Stack frame\
  \ is torn down; function returns void-like.\n\n  Interpretation: this function appears to populate a list of valid\
  \ enemy targets for\n  the AI/object, considering `self->RelatedObject1Ptr` (likely the player's controlled\n\
  \  object). The 3 calls with hard-coded 0/1/2 likely represent virus slot indices or\n  target categories for\
  \ the related object's enemies.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r3,[r5,#oBattleObject_Alliance]` (off 0x16) + `eor r3,#1` clearly flips the alliance bit to query
    the opposing side - `ldr r1,[r5,#oBattleObject_RelatedObject1Ptr]` (off 0x4c) reads self''s first related object
    pointer; passed as r1 to every sub_80E16CC call - The literal pool at `byte_80E16C4` lists 7 enemy name IDs
    (0xA0..0xBC) terminated with 0xFF - Stack reservation `sub sp,#0x34` is followed by writing 0 into `[r4+r6<<2]`,
    indicating a u32 table on stack whose size matches ~0x20 bytes - `object_getEnemyByNameRange` name implies it
    returns a list/bitmask of enemies in a given name-ID range - Three hard-coded calls with r0=0,1,2 to sub_80E16CC,
    each consulting the same table, suggest iterating 3 enemy "slots" on the related object'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080E1670

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080e1670 '' tools/traces/coverage/*.prof

    '
