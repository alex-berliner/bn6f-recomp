open_questions:
- What `sub_80E16CC` does with `(enemyIndex, relatedObject1Ptr, scratch)` is unknown from this function alone; it
  might assign a related-object pointer, store HP, or do some targeting test. Looking at sub_80E16CC's body would
  settle the meaning.
- Why exactly three attempts (0/1/2) and why abort on first success — could be picking first alive, first matching
  element, or first non-null in some priority list.
- The byte table `byte_80E16C4` is referenced via `dword_80E17E4` for the enemy-name range constant; the trailing
  bytes are unused here.
