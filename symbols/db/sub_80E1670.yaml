name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: Allocates a stack scratch array of enemy-panel target slots, then probes the related object via sub_80E16CC
  for indices 0/1/2 (snake-arm candidate panels).
interface: '(r5 = *BattleObject self) -> r0 = ? ; side effects: writes 0x34 bytes of stack scratch, may clobber
  r0..r3/r4/r6/r7/lr'
details: "- Sub sp, #0x34 reserves 0xD (13) u32-ish slots on the stack; r4 = sp is the base of that scratch array.\n\
  \  - Reads oBattleObject_Alliance (off r5), XOR with 1 to flip friendly/enemy side, and calls object_getEnemyByNameRange(sp=scratch,\
  \ count=0x1c3, mask derived from toggled Alliance) to enumerate enemy panels.\n  - The first scratch slot (at\
  \ r4 + 0) is then zeroed; r6 keeps the count returned by the range search.\n  - Loads self's oBattleObject_RelatedObject1Ptr\
  \ into r1 and calls sub_80E16CC three times in sequence, first with r0=0, then 1, then 2 (and short-circuits as\
  \ soon as one returns nonzero). The companion function uses the literal byte_80E16C4 (0xA0,0xA4,0xAC,0xB0,0xB4,0xB8,0xBC,0xFF)\
  \ as panel/col offsets and returns nonzero when the related object's panel matches a candidate.\n  - This pattern\
  \ matches SnakeArm's targeting setup: pick the three enemy-side panel columns to potentially snake to. The literal\
  \ table at 0x80E16C4 encodes seven even panel offsets 0xA0..0xBC plus a 0xFF terminator; only the first three\
  \ (0xA0, 0xA4, 0xAC) are exercised here.\n  - Return value (r0) is whatever sub_80E16CC last left in r0 (per its\
  \ contract) — i.e. nonzero on the first probe (0/1/2) that matched, otherwise 0. The caller sub_80E1566 treats\
  \ it as \"did we find any snake-arm target column\".\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `sub sp, sp, #0x34` plus `mov r4, sp` establishes a 0x34-byte scratch array; `str r0, [r3]` (where
    r3 = r4 + r6*4) zeroes the slot pointed at by the range-search count. - `ldrb r3, [r5,#oBattleObject_Alliance];
    eor r3, #1` flips the caller''s alliance (this BattleObject''s own alliance) before passing it to object_getEnemyByNameRange
    — i.e. enumerates the *opposing* alliance''s panel range. - `dword_80E17E4 = 0x1c3` is the mask (or count+flags)
    passed as the third argument to the range helper. - The .byte table `byte_80E16C4 = 0xA0, 0xA4, 0xAC, 0xB0,
    0xB4, 0xB8, 0xBC, 0xFF` is a typical panel/column offset table for an enemy row in BN; the 0xFF terminator pattern
    matches the in-battle panel index list used by SnakeArm. - Three sequential calls to sub_80E16CC with r0 = 0,
    1, 2, each bailing on the first nonzero, iterate over the first three candidate columns of that table.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080E1670

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080e1670 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- The exact contract of sub_80E16CC and the meaning of its r0 (which here is used as an index into the literal)
  — only checking the decompiled sibling will confirm.
- Whether r0 actually carries back a "found" flag, or whether the result is consumed through scratch memory written
  by sub_80E16CC (the call here writes neither back to sp nor to r5, so the in-r0 return is the only live channel).
- Naming the broader function "SnakeArm" assumes this sits inside the snake-arm battle object's initialize/init-update
  path; verifying the parent sub_80E1566 is the SnakeArm handler would settle it.
