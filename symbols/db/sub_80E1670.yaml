name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: Look up this object's `RelatedObject1Ptr`'s opponents at indices 0,1,2 and store any matches from an enemy
  name list into a small stack buffer
interface: '(r5 = self BattleObject*, r10 = toolkit, lr = return) -> r0 = bool (from last sub call); side effects:
  writes ~0x34 bytes to stack'
details: "Stack frame is 0x34 bytes (one w store here holds the result array elements).\n  Reads `oBattleObject_Alliance`\
  \ (offset 0x16, low byte of `AllianceAndDirectionFlip`) and EORs with 1, so the function targets the *opposite*\
  \ alliance.\n  Calls `object_getEnemyByNameRange(r4=stack_buf, r5=on_stack_trash, r2=0x1c3, r3=name_count)` with\
  \ the enemy name range list. r2=0x1c3 is the start of an inline table at `byte_80E16C4` (the 8-byte blob 0xA0,0xA4,0xAC,0xB0,0xB4,0xB8,0xBC,0xFF\
  \ matches the dataset layout for that helper).\n  Whatever `object_getEnemyByNameRange` returns in r0 is lsl'd\
  \ by 2 and stored as a 0 into a slot of r4, so each iteration creates a \"clear entry if index N is out of range\"\
  .\n  Then loops three times (i = 0, 1, 2): loads `RelatedObject1Ptr` (offset 0x4c), passes r5+off, r4=stack, r2=i,\
  \ to `sub_80E16CC`. Any non-zero r0 branch-skips cleanup.\n  Only callable is `sub_80E1566` (a sibling battle\
  \ AI/script dispatcher); the 0x4c-related slot is consumed by callers building an attack target list, so this\
  \ is most likely the \"build opponent-target index set\" step of a battle AI attack routine.\n  No registers are\
  \ restored to caller-preserved set on success path beyond r5/lr; the function looks `void`-ish with r0 just carrying\
  \ the last inner return.\n"
evidence:
