  date: '2026-10-14'
  detail: '- `ldrb r3, [r5,#oBattleObject_Alliance]; eor r3, #1` at 0x080e167a+ picks the opposite side. - `object_getEnemyByNameRange`
    call uses r2=0x1c3, matching the dword at `dword_80E17E4` listed in the function''s data pool; `byte_80E16C4`
    holds a 7-entry name list terminated by 0xFF consistent with that helper''s name range format. - Three identical
    call blocks pass `r0 = 0,1,2` and re-load `r1 = [r5,#oBattleObject_RelatedObject1Ptr]` (offset 0x4c) — these
    are coordinate checks against `RelatedObject1Ptr` for column/row 0/1/2. - The big 0x34-byte stack frame plus
    `lsl r3, r0, #2` after the lookup writes a per-row clear slot, so the buffer is laid out as a small table keyed
    by the iteration index. - Caller `sub_80E1566` also passes r5/r10/lr, the same battle-context register set,
    fitting a battle AI helper.'
