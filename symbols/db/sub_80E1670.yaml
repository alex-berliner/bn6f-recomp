name: sub_80E1670
address: '0x080E1670'
kind: function
previous_names: []
status: hypothesis
summary: Initialise a stack-local list of allied/enemy BattleObject pointers (5-word slots) by collecting opponents
  via object_getEnemyByNameRange, then zeroing the self-slot.
interface: '(r5 = self BattleObject) -> r0 = 0 (always); side effects: writes 0x34 bytes of stack temp, mutates
  self→RelatedObject1Ptr via sub_80E16CC'
details: "- Allocates a 0x34-byte (13-word) temp buffer on the stack with r4 pointing at it.\n  - Reads self→oBattleObject_Alliance\
  \ (offset 0x16, bool) into r3, EORs with 1 to flip it, so r3 = the *opposite* alliance (the enemy side from self's\
  \ perspective).\n  - Calls object_getEnemyByNameRange(temp, 0, 0x1c3, flipped_alliance). r2=0x1c3 is the NameID\
  \ range mask; the constant lives in dword_80E17E4. Returned enemy count is lsl'd*2 to index into temp as a u32\
  \ slot, where 0 is then written (presumably clearing the slot reserved for self).\n  - Reads self→oBattleObject_RelatedObject1Ptr\
  \ (offset 0x4c) into r1 and calls sub_80E16CC(temp, related1, 0/1/2) three times with each of the three plausible\
  \ \"self-side\" values. The first matching call returns non-zero and short-circuits via the bne→loc_80E16BA fallthrough\
  \ (all three bne's jump to the same epilogue, so only the first hit is acted on).\n  - Because r0 is unconditionally\
  \ set to 0 immediately before sub_80E16CC is invoked the first time, and the callee contract declares r0 as the\
  \ out, but the assembly's epilogue just `add sp; pop {pc}` — no explicit r0 write at exit — the function's effective\
  \ return is whatever sub_80E16CC left in r0. With the three-call early-exit pattern, this looks like a lookup\
  \ that records something (likely the local slot of self) into temp when found.\n  - The trailing byte_80E16C4\
  \ constant (0xA0,0xA4,0xAC,0xB0,0xB4,0xB8,0xBC,0xFF) is referenced by `ldr r2, dword_80E17E4` but here the loaded\
  \ immediate is 0x1c3, not the byte array — the byte array is unrelated trailing data emitted by the assembly listing.\n\
  \  - Net effect: build an enemy list from the opposite alliance, zero the slot for self in that list, then probe\
  \ RelatedObject1Ptr to populate additional context. The exact semantic of \"populate\" is hidden in sub_80E16CC.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r3, [r5,#oBattleObject_Alliance]; eor r3, #1` flips the alliance byte at offset 0x16 (matches
    struct BattleObject.Alliance). - `ldr r2, dword_80E17E4 // =0x1c3` is the NameID range parameter to object_getEnemyByNameRange.
    - `lsl r3, r0, #2; add r3, r3, r4; str r0, [r3]` (with r0=0) zeroes a u32 slot of the stack temp at index =
    returned enemy count. - `ldr r1, [r5,#oBattleObject_RelatedObject1Ptr]` (offset 0x4c) and three identical `bl
    sub_80E16CC` calls with r0 = 0,1,2 indicate probing which of the three actor types self''s related-object points
    to. - Three `bne loc_80E16BA` short-circuits all converge on the same epilogue at loc_80E16BA, so only the first
    successful call has any side effect. - Stack reservation `sub sp, sp, #0x34` (= 13 words) is consistent with
    a small fixed-capacity pointer list.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080E1670

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080e1670 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- What sub_80E16CC actually stores back into temp (and into *r1) is unknown without its body; whether this is a
  "record self position" or "populate more enemy list entries" step can't be settled here.
- The trailing byte_80E16C4 table (0xA0,0xA4,...) looks like a u16 jump/offset table to nearby functions but is
  unreferenced in this routine; may belong to the surrounding caller or to sub_80E16CC.
- Whether the 0x34-byte temp is `[ptr;7]` slots or something else is unclear; the only write is a single u32=0 at
  index=enemy_count, suggesting ≤7 used slots, with byte_80E16C4 possibly indicating up to 7 valid NameID ranges.
