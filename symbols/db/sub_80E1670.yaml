  detail: '- `ldrb r3, [r5,#oBattleObject_Alliance]` then `eor r3, #1` (flip side) at 0x080E167A-0x080E167C - `bl
    object_getEnemyByNameRange` with r0=stack buffer, r1=0, r2=0x1c3 at 0x080E1686 - Stack frame: `sub sp, sp, #0x34`
    then writes 0 to `[r4 + r6*4]` after the call (terminator) - Three iterations of `mov r0, #0/#1/#2` then `bl
    sub_80E16CC` with r1=r5->RelatedObject1Ptr, r2=buffer - Each iteration tests `cmp r0, #0` / `bne loc_80E16BA`
    so the function bails on first non-zero result - Locals r5/r6/r7/r10 pushed in prologue: typical battle-AI helper'
