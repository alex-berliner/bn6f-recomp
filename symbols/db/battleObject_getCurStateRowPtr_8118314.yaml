open_questions:
- The exact struct field at r5+2 being interpreted (the assembly literal `ldrb r0, [r5,#2]` accesses byte
  2, but the BattleObject union starts at +0x8 with CurState byte 0 and CurAction byte 1; the most plausible
  resolution is that callers seed r5 differently than the object base - e.g., r5 = base+6 - so what we
  see as +2 is actually the CurAction byte). Without disassembly of callers 0x08117FC4 / 0x081182A4 this
  is not definitive.
