status: hypothesis
summary: Writes the constant 8 to a single byte at the address in r5, almost certainly setting a battle object's
  state/counter/kind field to 8.
interface: battle_SetEntityByteTo8(u8* field /* r5 */) -> u8 /* r0 = 8, NZ flags from 8 (N=0, Z=0) */
details: 'Trivial three-instruction thunk: pushes lr, stores the immediate 8 as a byte to [r5], pops pc. Because
  of the tail-trampoline calling style, it also leaves r0 = 8 and the NZ flags set from that value. r5 is used as
  a pointer and is not modified; callers pass some structure pointer (per the contract, r5 and lr in; nz and r0
  out). Storing a small constant into a struct field with no other context strongly suggests initializing or advancing
  a battle entity''s state byte (e.g. an obj/state/counter field in a battle work struct), but nothing in the function
  itself reveals which struct or field. No flags are read, no other registers touched.'
