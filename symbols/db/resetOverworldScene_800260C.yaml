name: resetOverworldScene_800260C
address: '0x0800260C'
kind: function
status: confirmed
summary: Resets overworld scene state by zeroing OAM and sound RAM, then reinitializing player/NPC/map
  object structs, sprite variables, and a small RAM buffer.
interface: void resetOverworldScene_800260C(void)
details: "Called once on a fresh scene/load. Performs the following in order:\n  * ZeroFillByEightWords(0x07000000,\
  \ 0x400) - clears OAM (sprites/affine).\n  * ZeroFillByEightWords(0x06010000, 0x8000) - clears sound\
  \ RAM region (DirectSound buffers).\n  * copy_8002668 - extra copy/loader helper (palette/VRAM setup;\
  \ unknown exact role).\n  * InitializeOWPlayerObjectStruct - zeroes the player overworld object struct.\n\
  \  * InitializeOverworldNPCObjectStructs - zeroes NPC object structs.\n  * InitializeOverworldMapObjectStructs\
  \ - zeroes map object structs.\n  * sprite_resetObjVars_800289C - resets sprite engine variables.\n\
  \  * ZeroFillByByte(unk_200F388, 7) - clears a 7-byte RAM buffer at 0x0200F388.\nOnly lr is consumed\
  \ as input; r4/r7 are preserved across the call. No return value, no flags\nset on return. Quoted addresses:\
  \ \"0x07000000\", \"0x400\", \"0x06010000\", \"0x8000\",\n\"unk_200F388:7 bytes\".\n"
