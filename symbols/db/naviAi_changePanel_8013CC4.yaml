name: naviAi_changePanel_8013CC4
address: '0x08013CC4'
kind: function
status: probable
summary: 'Navi-AI panel-altering behavior: with a probability tied to the Navi''s stats, converts/recolors/cracks/breaks
  the panel under the Navi''s feet and plays a panel-type SFX.'
interface: 'void sub_8013CC4(u32 obj, u32 param, /* via r5 */ u32 battleObject);

  // clobbers r0-r3, r4-r7, r10, lr; flags NZCV

  '
details: "Reads the battle object's AI data; only acts when actor_type == 2\n(i.e. a Navi-controlled battle object).\
  \ Uses two stat-byte lookups on\nthe Navi via GetBattleNaviStatsByte_AllianceFromBattleObject:\n  - stat 0x13:\
  \ probability gate (a value of 0 disables the behavior)\n  - stat 0x12: target panel type to apply\nRolls (RNG\
  \ & 7) and skips if the roll exceeds (prob - 1).\nLooks up the panel under (obj,param) via object_getPanelDataOffset;\n\
  bails out if the current panel type is 0 (empty) or 1 (normal).\nThen dispatches by desired new type:\n  - new_type\
  \ == 1 -> object_breakPanel_dup2 (break the panel)\n  - new_type == 3 -> object_crackPanelDup1 (crack the panel)\n\
  \  - otherwise     -> object_setPanelType(obj,param,new_type)\nIf the type actually changed and the per-new-type\
  \ entry in\nPanelChangeSfxTable (at byte_8013D44, 16 halfwords indexed by\nnew_type*2) is non-zero, plays it via\
  \ PlaySoundEffect. Notable SFX\nids visible: 0x0090 (idx 4), 0x00A4 (idx 6), 0x011B/0x0118/0x011C/\n0x01FC (idx\
  \ 8..11), 0x00FC (idx 12..15). No SFX for new types 0..3\nand 5/7. r5 (battle object) is preserved across the\
  \ call; r0/r1\n(obj + param) flow through unchanged.\n"
