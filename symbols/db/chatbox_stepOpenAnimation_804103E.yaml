open_questions:
- Is chatbox_setflags_3e/clearFlags_3e/maskFlags_3e really a single 32-bit flag word or three separate
  8-bit flag slots for the 0x01/0x04/0x100 bits?
- Why is the redundant `ldrb/cmp/bne/ldrb` pair kept when reloading OpenState on the BoxY==0 path -- is
  it a relic of an earlier intermediate-state branch?
- What is the meaning of the 0x100 mask cleared only on the non-final path? It is not touched on the OpenState==3
  fast path.
- Does the caller's r1/r2 carry real inputs in some call sites, or are the output clobbers just an artifact
  of the original using r1 for BoxY and r2 for the constant 3?
- Is this function called only once per frame, or are some callers re-entrant during the OpenState==3
  -> mask 0x04 wait?
