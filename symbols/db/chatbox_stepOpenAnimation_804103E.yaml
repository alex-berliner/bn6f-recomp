name: chatbox_stepOpenAnimation_804103E
address: '0x0804103E'
kind: function
status: confirmed
summary: Advances the chatbox open animation one tick, ticking BoxY down then OpenState 0->3, returning
  1 when the open transition completes.
interface: "void chatbox_stepOpenAnimation_804103E(void);\n  /* r5: pointer to chatbox state struct (deref\
  \ +0x10 OpenState, +BoxY) */\n  /* in: r1, r2 are ignored */\n  /* out: r0 = 0 while animating, 1 when\
  \ open completes this tick */\n  /* out: r1 clobbered (BoxY-1 on scroll path, 0 once drained) */\n \
  \ /* out: r2 clobbered to 3 on the drain path after BoxY reaches 0 */\n  /* flags: N/Z from final r0\
  \ (mov r0,#0 or mov r0,#1); C/V left as guest */\n  /* clobbers: r0, r1, r2, lr; flips flags 1, 0x04,\
  \ 0x100 on chatbox flag word */\n"
details: "Tick driver for the chatbox opening. Each invocation first sets flag 0x01\n(the per-tick \"\
  tick happened\" trigger), then branches on OpenState:\n  - OpenState == 3 (already fully open): test\
  \ mask 0x04 via chatbox_maskFlags_3e;\n    if it was clear (z), clear trigger 0x01 and return 1 (just-finished\n\
  \    sentinel); otherwise still in progress (return 0). On this fast path r1/r2\n    are left at the\
  \ caller's values.\n  - OpenState != 3: clear flag 0x100 (high-byte mask), then if BoxY != 0,\n    decrement\
  \ BoxY and return 0. When BoxY is 0, increment OpenState (with\n    a redundant reload/branch pair in\
  \ the original that always re-reads the\n    same value), test the new OpenState against 3 -- setting\
  \ r2 = 3 before\n    the compare on this drain path -- and if it just reached 3, run the\n    same maskFlags/clear-trigger\
  \ sequence as the fast path but with r1\n    zeroed (from the earlier BoxY ldrb) and r2 = 3. Otherwise\
  \ the box has\n    settled into a non-final state, so reset BoxY = 0 and return 0.\nToggles the 0x01\
  \ (per-tick trigger), 0x04 (\"fully open\" sentinel) and\n0x100 (high-byte) bits of the chatbox flag\
  \ word handled by the unnamed\nsetFlags/clearFlags/maskFlags_3e helpers (FLG34 class, 0x3e-prefixed\
  \ names\nin the contract).\n"
