name: e_clearStatusFlags
address: '0x0803C30C'
kind: function
status: probable
summary: Clears bits specified by the r0 mask in the halfword status/flags field at offset 0x20 of the
  global struct eS200A290.
interface: (r0 = bitmask of flags to clear) -> r0 = undefined; flags from bic/strh not meaningful
details: Loads the global struct pointer eS200A290 (likely the sprite/engine state object), reads the
  halfword at offset 0x20, clears every bit set in r0 via BIC, and stores it back. Offset 0x20 in such
  structs is typically a status or render-flags field. It is a single-purpose inline-style helper; r1
  is scratch and no other fields are touched.
