summary: Loads a 0x20-byte tile block into a sprite object and starts a sound effect (SFX 0x10/0x30).
interface: void sub_804A14C(u16 sprite_id R5+0x22); // R0 destroyed, R5 preserved
details: 'Reads the sprite id (u16) at R5+0x22, looks up an 8-bit offset from byte_804A178 using that id

  as index, then copies 0x20 bytes from unk_2001850 + offset into the object''s buffer at R5+0x30.

  Calls CopyBytes(src, dest, 0x20). Then calls sub_803C132(0x10, 0x30) (likely an SFX player; the

  0x10/0x30 args are typical bank/note or priority/volume pairs in BN6) and stores the returned

  handle byte at R5+0x10. Fields touched: R5+0x22 (sprite id), R5+0x30 (32-byte dest buffer),

  R5+0x10 (sfx handle). The object base is passed via R5, suggesting this is a sprite/entity vtable

  method invoked through a function pointer, with sprite id and buffer as the per-sprite state.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
