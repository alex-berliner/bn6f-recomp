open_questions:
- What exactly do reg_flag and tag_flag semantically represent (likely "regular" pinned chip and "tag" chips that
  must remain at the end)?
- Is slot 0 in the non-giga list the first usable folder slot, or is the first entry truly always pinned regardless
  of reg_flag?
- What does the index written to battleState[0x45] (the pair chosen for tagging) get consumed by downstream — the
  Tag Change / post-battle folder display?
- Are there upper bounds guaranteed (e.g. non_giga_count must be >= 13 in normal mode) that callers must respect
  to avoid div-by-zero in the RNG modulus?
