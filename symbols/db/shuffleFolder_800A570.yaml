name: shuffleFolder_800A570
address: '0x0800A570'
kind: function
status: confirmed
summary: Shuffles a 30-chip battle folder, separating Giga chips, re-inserting them at random positions, and optionally
  tagging a random chip pair into the last two slots.
interface: void shuffleFolder_800A570(u32 folder_ptr, u32 reg_flag, u32 tag_flag, u32 toolkit /* r10 */); // preserves
  r4-r7, clobbers r0-r3,lr,flags
details: 'Splits a 30-entry folder (u16 chip IDs) into two scratch lists in RAM

  (non-gigas at dword_2033000, gigas at word_2033040), looking up each chip''s

  element type via getChip8021DA8 (field at offset 0x7 == 2 means Giga). Both

  lists are shuffled with ShuffleHwordList_SecondaryRNG; if reg_flag is set

  the first non-giga entry is excluded from the shuffle (pinned), and if

  tag_flag is set the last two non-giga entries are also excluded. Each Giga

  is then re-inserted into the non-giga list at a random position via

  sub_800A672, using GetPositiveSignedRNGSecondary mod (non_giga_count-12)

  in normal battle or mod 11 in Crossover (battle mode == 1), with insertion

  offsets 10/8 respectively. When tag_flag is set, a random pair index

  (rng mod 19 + 1) is chosen and that pair is swapped with slots 28/29

  (offsets 0x38/0x3A); the chosen index is also stored into

  battleState[0x45] (via r10->oToolkit_BattleStatePtr). Finally, the 60

  halfwords at dword_2033000 are copied back to the caller''s folder buffer

  (CopyHalfwords, count 0x3C = 60).

  '
