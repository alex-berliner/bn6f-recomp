name: battle_objectDelayPhase
address: '0x080BE254'
kind: function
status: probable
summary: battle object phase handler that resets the object's animation/state, waits 30 frames, then advances
  to phase 4
interface: (r5 = battle object) -> void; r0 scratch
details: On first entry (PhaseInitialized == 0) it sets CurAnim to 0, calls sub_80B8E58 on the pointers
  at oBattleObject_ExtraVars+8 and +0xC (likely clearing/stopping two attached sub-structures), stores
  0x1E (30) into Timer, and sets PhaseInitialized = 4. On subsequent frames it decrements Timer and, once
  it hits 0, writes phase 4 into CurPhaseAndPhaseInitialized, so this state is a fixed 30-frame delay
  before phase 4.
