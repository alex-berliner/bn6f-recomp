    ends by writing phase 4 to CurPhaseAndPhaseInitialized; mov r0,#0; strb [r5,#oBattleObject_CurAnim]
    resets the current animation during init; both bl sub_80B8E58 calls pass fields ExtraVars+8 and +0xC,
    suggesting two sibling sub-objects being reset'
