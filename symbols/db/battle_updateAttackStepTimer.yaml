name: battle_updateAttackStepTimer
address: '0x081045E8'
kind: function
status: probable
summary: Advances the current attack action, assigning its initial step delay or counting down until the
  next hit element is selected.
interface: (r0 = ignored current battle object in r7) -> r0 = last loaded field value; flags may reflect
  the countdown test
details: This routine operates on an AI attack-variable structure through the global object pointer r7.
  If AttackElement is zero, it changes it to 4 and copies AttackBoost2 into the halfword StepTimer. Otherwise,
  it decrements StepTimer and, when the unsigned countdown reaches zero, sets HitElement to 12. No caller
  is currently known, so the exact action/event context driving these fields remains unclear.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The function reads and conditionally updates oAIAttackVars_AttackElement, initializing it to
    4.; The initialization branch copies oAIAttackVars_AttackBoost2 into oAIAttackVars_StepTimer.; On
    later calls, the 16-bit StepTimer is decremented; reaching zero writes 0x0c to oAIAttackVars_HitElement.
  refs:
