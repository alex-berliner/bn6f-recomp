name: sub_800BDB2
address: '0x0800BDB2'
kind: function
status: confirmed
summary: Dispatches to a battle object's per-phase handler based on its current phase byte.
interface: 'void sub_800BDB2(void) // in: r5 = battle object, r10 = (passed through to handler); out: r5, r8, r9,
  r10, r11, r12 (handler''s results); flags: handler''s nz/c/v'
details: "Reads the battle object's current phase from oBattleObject_CurPhase (a single byte\non the object in r5),\
  \ then indexes into the jump table at off_800BDC4 (three entries,\none word each) to obtain a Thumb handler:\n\
  \  phase 0 -> sub_800BDD0\n  phase 1 -> sub_800BE0C\n  phase 2 -> sub_800BE2C\nThe dispatch is implemented with\
  \ `mov lr, pc; bx r1` followed by `pop {pc}`,\nmaking the handler's results the function's outputs and the handler's\
  \ return\ngoing straight back to sub_800BDB2's caller (effectively a tail call).\nr5 (the object) and r10 (untyped\
  \ caller value) pass through to the handler.\nClobbers nz/c/v/r0/r1/r2/r3/r4/r6/r7/lr. No registers are preserved.\n\
  Used as the central per-frame phase step for a battle object; the handler\nis responsible for advancing the phase\
  \ byte when appropriate.\n"
