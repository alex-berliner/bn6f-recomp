name: oBattleState_State4EventCount
address: '0x1a'
kind: struct-field
status: probable
summary: Countdown/queue counter for state-4 battle events; initialized from BattleSettings[5], incremented
  on effect bit 0x400, and used to index a settings table.
details: ">\n  Consistently initialized via `ldrb r1, [r1,#5]` from oBattleState_BattleSettings (asm00_1.s:13428,\
  \ 14086, 14581, 14995) or incremented (`add r1, #1`) when `GetBattleEffects & 0x400` is set — matching\
  \ symdb's \"Countdown or Advance\" semantics. The loaded value is then passed as the second arg to `battle_dispatchKindEffect_801E792`\
  \ (asm00_1.s:13601, 14246, 14710, 15124) and used to index `byte_203CA50` after `sub #1; add r0,r0`\
  \ (asm03_0.s:15231), confirming it is a numeric event index/counter."
evidence:
