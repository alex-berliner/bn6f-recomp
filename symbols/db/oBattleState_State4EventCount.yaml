  date: '2026-10-15'
  detail: Field is seeded from BattleSettings byte 5, i.e. a per-battle-configured starting count.
  refs:
  - bn6f/asm/asm31.s:86396
  reproduce: grep -n 'oBattleState_State4EventCount' bn6f/asm/asm31.s | head
  result: '"ldrb r1, [r1,#5]  ; strb r1, [r5,#oBattleState_State4EventCount]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: When battle-effects bit 0x400 is set, the field is incremented (advance/queue step).
  refs:
  - bn6f/asm/asm31.s:86396
  reproduce: grep -n 'oBattleState_State4EventCount' bn6f/asm/asm31.s | head
  result: '"ldrb r1, [r5,#oBattleState_State4EventCount]  ; add r1, #1  ; strb r1, [r5,#oBattleState_State4EventCount]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Field is tested for zero to gate writing 0xa into Unk_28 — i.e. "countdown reached zero" branch.
  refs:
  - bn6f/asm/asm31.s:86396
  reproduce: grep -n 'oBattleState_State4EventCount' bn6f/asm/asm31.s | head
  result: '"ldrb r1, [r5,#oBattleState_State4EventCount]  ; tst r1, r1  ; beq loc_80092E6"'
- method: assembly-reading
  date: '2026-10-15'
  detail: The counter value is passed as the effect-dispatch argument, treating it as a state-4 event
    index.
  refs:
  - bn6f/asm/asm31.s:86396
  reproduce: grep -n 'oBattleState_State4EventCount' bn6f/asm/asm31.s | head
