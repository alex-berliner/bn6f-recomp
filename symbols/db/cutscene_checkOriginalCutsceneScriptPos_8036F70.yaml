name: cutscene_checkOriginalCutsceneScriptPos_8036F70
address: '0x08036F70'
kind: function
status: confirmed
summary: Returns CUTSCENE_SCRIPT_UNK_MAGIC_SCRIPT_VALUE_0x1 if the given script position equals the cutscene state's
  saved "original" script position, else 0; also outputs the loaded original position.
interface: "u32 cutscene_isOriginalScriptPos_8036F70(u32 scriptPos /* r0 */,\n                                 \
  \         u32 *posOut /* r1 */,\n                                          u32 *flagOut /* r2 */,\n          \
  \                                struct Toolkit *toolkit /* r10 */);\n// returns nz/c/v in flags, returns r0\n"
details: 'Reads the global CutsceneState pointer from the toolkit at oToolkit_CutsceneStatePtr,

  then loads the saved oCutsceneState_originalCutsceneScriptPos_40 field (offset 0x40).

  Compares that saved position against the caller''s scriptPos. If equal, returns the

  magic constant CUTSCENE_SCRIPT_UNK_MAGIC_SCRIPT_VALUE_0x1; otherwise 0. The loaded

  original position is also returned in r1 and the boolean-like result in r2, so the

  caller can use either as a flag without re-running the comparison. The final

  `tst r0, r0` only refreshes N/Z (C/V left as set by the cmp).

  '
