name: chatbox_runVariantScript_8127ED4
address: '0x08127ED4'
kind: function
status: confirmed
summary: Runs a chatbox text script from a fixed archive, switching to an alternate variant (index +10) when bit
  0 of a context flag byte is set.
interface: void chatbox_runVariantScript_8127ED4(u32 scriptIdx /*r0*/, /*r5 = context object, [r5+0xD] = variant
  flags*/); clobbers r0-r3,r4; preserves r6,r7
details: 'Thin wrapper around the chatbox script runner. The script index arrives in r0; a pointer to a fixed TextScriptArchive
  (eTextScript201BA00) is loaded from a literal pool, so the text set this serves is hard-wired. The caller''s context
  object is in r5: byte [r5+0xD] is a flags/variant byte whose bit 0 selects between two text variants — if set,
  the script index is bumped by 0xA before dispatch, otherwise it is used as-is. Two entrypoints of the chatbox
  runner are used (chatbox_runScript_803FDA4 vs _803FD9C, 8 bytes apart); the variant-flag path consistently uses
  the former, the normal path the latter, so the pair likely differ in open-vs-queued/immediate handling of the
  chatbox. r2/r3 are loaded (flags byte and constant 1) only for the tst, and r4 is clobbered without being written
  here — it is dead per the contract. Returns whatever r0-r3 the runner leaves behind; no meaningful return value.'
