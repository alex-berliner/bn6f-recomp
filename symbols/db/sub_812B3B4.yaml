name: sub_812B3B4
address: '0x0812B3B4'
kind: function
status: hypothesis
summary: Looks up a script number from a small table indexed by a byte in the calling struct and runs it on the
  eTextScript201BA20 script via the chatbox subsystem.
interface: 'void sub_812B3B4(void); /* in: r4 r5 r10 lr; out: c v r2 r3 r4 r5 r6 lr; clobber: r0 r1 nz; preserved:
  r6 r7 */'
details: 'r5 points at a caller struct; only offset 0x12 (low byte) is read. That byte indexes into

  dword_812B3C8 (whose only stored word is 0x00000D0C), the byte loaded there is passed as the

  script id to chatbox_runScript_803FD9C_on_eTextScript201BA20. The table is declared as a

  single dword constant (0xD0C) used as a base by the disassembler; the actual lookup is a

  single byte read, so the "table" only meaningfully exists for index 0 unless the surrounding

  memory is also reserved. Effectively a one-line dispatch: field 0x12 -> script -> runScript.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
