status: hypothesis
summary: Sets an object's field at offset 8 to value 8 if the object pointer is non-NULL.
interface: void sub_80E1A86(void *r0_obj); // returns 8 in r1, clobbers nz; r0 unchanged
details: 'Guarded setter: when r0 is non-NULL, writes the constant 8 (held in r1) to

  the object''s slot at offset 8. When r0 is NULL, the function returns

  immediately without writing anything. r1 is set to 8 only on the success

  branch; callers passing NULL see their original r1 preserved. The ARM caller

  contract shows r0 as an input only (object pointer) and r1 as the output

  (written value), with NZ flags clobbered by TST R0,R0.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
