name: battle_clearActiveChipIfMegaGiga_8027F6A
address: '0x08027F6A'
kind: function
status: confirmed
summary: After a Mega (0xA) or Giga (0xB) chip is chosen as the active chip, clears the active-chip selection index
  back to 0xFF (none).
interface: void battle_clearActiveChipIfMegaGiga(struct ActiveChipState* state) // r7 = pointer to folder/active-chip
  state block; only reads/writes its byte at +1
details: 'r7 points at a chip-folder/active-chip state block; byte at offset +1 holds the currently

  selected active-chip index. The index is passed to getLocOfActiveChips_8027E1C, which returns

  a pointer to the entry in the active-chips table; the entry''s first byte is the chip''s class

  (0xA = Mega chip, 0xB = Giga chip). If the selected chip is Mega or Giga, the selection index

  at r7+1 is reset to 0xFF, i.e. "no chip selected". This enforces that only one Mega/Giga chip

  can be set as the active (regular-use) chip in the custom screen / folder UI: picking one

  deselects it (likely after it was used or when re-selecting). Clobbers r0-r1 and flags;

  preserves r7.

  '
