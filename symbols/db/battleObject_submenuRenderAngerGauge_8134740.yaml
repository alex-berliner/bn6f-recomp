    table. - `strb r0,[r5,#0x15]; ... ldrb r0,[r5,#0x15]; and r0,#0xf; lsl r1,r1,#4; orr r0,r1; strb r0,[r5,#0x15]`
    recomposes Unk_15 = (newStep & 0xf) | (nextHighNibble<<4), confirming Unk_15 is a packed timer (step/frame).
    - Caller battleObject_submenuLoopStep_8133944 is the only caller, and it manages the folder-edit/Beast-Anger
    submenu where Anger is the gauge that needs rendering. - The address suffixes 0xC0000/0xA40000 match
    the OBJ VRAM bank offsets (0x06000000 + 0x10000 * bank), confirming this writes to OAM OBJ tiles.'
