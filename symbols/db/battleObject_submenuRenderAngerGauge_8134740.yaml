    used as a tile-bank flag). - `ldrh r1,[r5,#0x34]; mov r3,#0x10; mul r1,r3; add r1,#0x20; orr r0,r1`
    reads AIData.Anger (u16 at 0x34 of AIData struct), shifts left 4, adds 0x20, OR-s into r0 -> forms
    an OAM tile base. - `ldr r4, dword_813479C = 0x40000000` -> the standard OAM OBJ-mode 7 bits, confirming
    this is an OBJ tile address. - `ldrb r2,[r5,#0x15]; str r2,[sp]` then `mov r3,#0xf; and r2,r3` masks
    low nibble -> that low nibble becomes the row index passed to battleObject_queueOamFromTableRow. -
    `ldr r1,[sp]; lsr r1,#4; sub r1,#1; bne loc_813477A` checks whether the high nibble was 1 (= display
