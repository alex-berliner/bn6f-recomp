summary: 'Per-frame OAM render for a battle object''s submenu "anger/charge" gauge: queues one sprite
  tile from a descriptor table and animates the low-nibble timer through its 0x10 step sequence.'
interface: '(r5 = battleObject AIData ptr, r10 = toolkit) -> r0 = next frame''s low-nibble value (callee-saved
  r5 live); side effects: OAM entry queued via battleObject_queueOamFromTableRow; reads/writes battleObject.AIData.Unk_15
  (frame timer).'
details: '1. Picks the VRAM bank base for the tile pair based on AIData.Unk_0d (r5+0xd): if non-zero use
  0xA40000 (OBJ VRAM bank 1), otherwise 0xC00000 (OBJ VRAM bank 0) (`ldr r0, dword_813478C / 8134790`).

  2. Builds a u32 OAM-tile base by OR-ing in AIData.Anger (r5+0x34, u16) << 4 with +0x20 offset, and OR-s
  in 0x40000000 to set OBJ character VRAM mode 7 bits for 4bpp OBJ (constant 0x40000000).

  3. Stashes the current AIData.Unk_15 byte on the stack (`str r2, [sp]`).

  4. Calls battleObject_queueOamFromTableRow_811FAF4 with row index = AIData.Unk_15 & 0x0F, descriptor
  table = byte_81331F4, additional arg = 2 (likely sprite count or palette slot).

  5. If the high nibble of the stashed byte was 0 (i.e. `((Unk_15 >> 4) - 1) == 0`, meaning timer count
  reached 1), calls battleObject_advanceAnimTableBy0xFF_8120CC8 on dword_81331FC to fetch the next animation
  step byte and stores the low nibble back into AIData.Unk_15 (`strb r0, [r5,#0x15]`).

  6. Final stage: writes the new high-nibble frame-counter back into AIData.Unk_15: `Unk_15 = (Unk_15
  & 0x0F) | (high_nibble_next << 4)`. So Unk_15 is a packed (frameCounter<<4 | stepIndex) timer.

  Caller battleObject_submenuLoopStep_8133944 invokes this every frame as part of the Beast/Custom-Anger
  submenu; AIData.Anger is the per-actor Anger meter (u16 at 0x34), and AIData.Unk_15 acts as a packed
  (4-bit) step + (4-bit) frame counter for the gauge tile cycling.

  Note: r10 is the toolkit per convention; the function never directly references it though - the actual
  storage base used by the callee is determined by r0 passed in.

  '
