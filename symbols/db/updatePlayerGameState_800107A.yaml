name: updatePlayerGameState_800107A
address: '0x0800107A'
kind: function
status: confirmed
summary: Copies the overworld player object's X/Y/Z position and facing direction into the game state, presumably
  to remember where the player stood before a warp.
interface: GameState* updatePlayerGameState_800107A(Toolkit* toolkit /* r10 */); returns r3 = game state pointer;
  clobbers r0, r1.
details: 'Reads the game state pointer from the toolkit (r10 + oToolkit_GameStatePtr), then the overworld player
  object pointer from the game state (oGameState_OverworldPlayerObjectPtr). Copies the object''s position fields
  into the game state: word at +0x1C -> oGameState_PlayerX, word at +0x20 -> oGameState_PlayerY, word at +0x24 ->
  oGameState_PlayerZ. Also copies the byte at +0x10 (the object''s facing direction) into oGameState_FacingDirectionAfterWarp
  as a word (zero-extended). Returns the game state pointer in r3 so the caller can immediately use it. The FacingDirectionAfterWarp
  field name suggests this runs right before a warp or transition so the player''s pre-warp position/direction can
  be restored. Note the direction byte is stored with str (32-bit) into a game state field, relying on adjacent
  fields or padding.'
