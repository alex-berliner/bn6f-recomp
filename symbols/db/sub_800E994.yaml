name: sub_800E994
address: '0x0800E994'
kind: function
status: confirmed
summary: Classifies a signed (dx, dy) delta between two points into one of six direction codes (0=origin, 1=up,
  2=down, 3/4=other axes depending on r4 flag, 5=out of range) used to drive an entity toward/away from a target.
interface: u32 sub_800E994(u32 ax, u32 ay, u32 bx, u32 by, u32 flag) -> r0=code (0..5), r1=dy (raw unsigned ay-by);
  preserves C/V from the final CMP against
details: "Computes dx = (s32)(ax - bx) and dy = (s32)(ay - by). Any dx or dy whose signed\nvalue is >= 2 is treated\
  \ as out-of-range (code 5) before finer classification.\nOnce both |dx|<2 and |dy|<2:\n  - dx==0, dy==0 -> 0 (coincident)\n\
  \  - dx==0, dy>0  -> 2 (target is south)\n  - dx==0, dy<0  -> 1 (target is north)\n  - dx!=0, dy!=0 -> 5 (off-axis;\
  \ the extra axis rules are only consulted when\n    one axis is zero)\n  - dx!=0, dy==0 -> 3 if r4==0, else 4\
  \ (or swapped when dx<0 vs dx>0; the\n    assembly at loc_800E9C0 / loc_800E9CC swaps 3 and 4 depending on sign\
  \ of\n    dx, so the effective meaning is \"direction code 3 or 4 picks an east/west\n    branch keyed by r4\"\
  )\nr4 acts as a mode flag the caller uses to flip which side is 3 vs 4 (e.g.\n\"approach\" vs \"retreat\" handedness\
  \ for the requester). r1 on return holds the\nraw unsigned dy = ay - by so the caller can use it without re-subtracting.\n\
  The lifter's \"outputs: nz c v r0 r1\" matches the code: r0=code (NZ set when\nnonzero), r1=dy, and C/V are leaked\
  \ from the final CMP against #2 in the\nnormalised branch. No memory or struct fields are touched -- the function\
  \ is\npure register arithmetic.\n"
