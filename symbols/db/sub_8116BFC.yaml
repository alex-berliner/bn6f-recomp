name: sub_8116BFC
address: '0x08116BFC'
kind: function
status: hypothesis
summary: Runs two phase-update helpers on some state object, then when a shared counter byte reaches 8 also stores
  8 into the object at +9 (a phase/done flag?).
interface: void sub_8116BFC(r4 = ?, r5 = state object ptr, r6 = ?, r7 = ptr to counter byte); returns r0 = counter
  byte (or 8 on the store path), flags from cmp counter,#8, preserves r4-r6
details: Sequence driver of unknown subsystem. Calls sub_8116C40 then sub_8116C78 (presumably the per-frame/per-step
  updates of two phases or two entities sharing this state). Afterwards it loads the byte at [r7] and compares it
  with 8; when it equals 8 it writes 8 to [r5+9], likely mirroring "counter finished" into a state/phase field of
  the object. r5 and r7 are almost certainly fields of the same structure (r7 pointing at a counter, r5+9 a status/phase
  byte). No other memory is touched, and the final flags/r0 are left for the caller, which likely branches on counter==8.
  Without callers identified, the subsystem (battle, npc script, cutscene, etc.) is unknown, hence the name is left
  unchanged.
