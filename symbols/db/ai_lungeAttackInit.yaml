name: ai_lungeAttackInit
address: '0x08110CC6'
kind: function
status: confirmed
summary: 'Initialises a lunge attack: sets per-axis velocities from an AI-version speed table, orients them toward
  the target panel, and computes fixed-point per-frame step values via BIOS signed division.'
interface: void ai_lungeAttackInit(void *ai_data /* r4 */, void *battle_obj /* r5 */); // returns with r4-r7 preserved,
  r0-r3 and flags clobbered
details: 'Clears two s16 step-accumulator fields at battle_obj+0x7c (X) and +0x7e (Y). Loads a 32-bit speed from
  a u32 table at byte_8110E0C, indexed by the AI-version nibble (ai_data[oAIData_Version_16] << 2), and writes it
  to both oBattleObject_XVelocity and oBattleObject_YVelocity. Reads the object''s current panel (oBattleObject_PanelX
  / _PanelY) and the destination panel (unnamed offsets 0x7a / 0x7b), computes signed delta, and negates the velocity
  if the delta is negative (orienting the lunge toward the target). Multiplies the delta by a fixed-point scale
  (0x280000 for X, 0x180000 for Y), calls BIOS SVC 6 (signed DIV) with that product as dividend and the oriented
  velocity as divisor, and stores the quotient into the step-accumulator fields. These step values are the per-frame
  sub-pixel position increments used by the lunge motion routine.

  '
