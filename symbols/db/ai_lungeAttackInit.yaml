name: ai_lungeAttackInit
address: '0x08110CC6'
kind: function
status: probable
summary: Initializes a lunging enemy's X/Y velocity from a version-indexed table and computes per-axis
  travel-time timers (stored at object+0x7c/0x7e) based on the delta to its target panel.
interface: (r0 = unused/0-written, r4 = AI attack data, r5 = battle object) -> r0 = computed timer; object
  X/YVelocity and fields 0x7c/0x7e written
details: Reads oAIData_Version_16 from the AI data (r4), indexes table byte_8110E0C (pointer table via
  off_8110DA4), and stores the entry as both oBattleObject_XVelocity and oBattleObject_YVelocity. For
  each axis it computes target−current from object panel coords (oBattleObject_PanelX/Y vs fields 0x7a/0x7b,
  the recorded target panel), negates the velocity if the delta is negative so motion heads toward the
  target, then performs delta*scale/velocity (scale 0x280000 for X, 0x180000 for Y) via SWI 6 to get a
  travel-time value stored as a halfword at object+0x7c (X) and +0x7e (Y). Both timer fields are zeroed
  first. The scales differ, so the two timers are not simply equal — likely per-axis interpolation timers
  consumed by the lunge update.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r1,[r4,#oAIData_Version_16]; ldr r0,[r0,r1] with table byte_8110E0C → per-version velocity
    selection; velocity negated when target−current < 0, targeting fields 0x7a/0x7b of the object; mul
    by 0x280000/0x180000 then svc 6 (SWI Div) with velocity as divisor → frame-count timers stored to
    +0x7c/+0x7e; caller ai_lungeAttackUpdate matches: records panel+velocity on first tick, then charges
    until a timer expires'
