  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal in every detail: it zeroes 0x7c/0x7e, looks up a velocity from a version-indexed
    table at off_8110DA4/byte_8110E0C, stores it to XVelocity/YVelocity, negates it based on panel delta,
    and computes delta*scale/velocity via SWI 6. However, the function is called by ai_lungeAttackUpdate
    and sub_81108E4, both of which are AI-lunge setup/init code, so a clearer name reflecting its role
    as the initialization/setup for the lunge attack (not the per-tick update) would be ai_lungeAttackInit.;
