open_questions:
- What r7 points to (camera? per-object view? GFXAnimState?) — it isn't in the project struct list; the offset pattern
  (3 words xyz, then a ptr+two bytes) doesn't match RenderInfo (size 0x40) or a Toolkit field.
- Meaning of the 0xd byte subtracted from Z — could be a panel-row adjustment or a sprite-pivot Y offset.
- Exact semantics of setting renderInfo bits 0x4800; could be enable-fade-window + mosaic-related flag.
- Whether the gfx_anim_data blocks at 804C4B0/804C4E0 are referenced from here or are merely co-located constants.
