name: battle_applySelfDamageFromBattleEffect_80142C2
address: '0x080142C2'
kind: function
status: confirmed
summary: If the active battle effects include flag 0x8, writes a self-damage value of 10 into the battle object's
  collision data.
interface: void battle_applySelfDamageFromBattleEffect(r5 battleObject, r10) // reads r5 = battle object; out r0
  = battle effects or 0xA, r1 = 8 or collision ptr, nz from last op
details: 'Reads the current battle effects via GetBattleEffects and tests bit 0x8. When that effect is active, loads
  the object''s collision-data pointer from oBattleObject_CollisionDataPtr (r5 + offset) and stores halfword 0xA
  (10) into oCollisionData_SelfDamage, causing the object to take 10 damage from itself (e.g. an effect that damages
  its user each move). When the effect is not active it does nothing except leave flags/registers behind. Inputs
  r5 (battle object) and r10 come from callers; r10 is passed through untouched. r0/r1 and the nz flags on return
  are leftovers of the implementation, not a real result contract. Data at dword_80142D8 (0x400) sits in the same
  pool but is not referenced by this routine.

  '
