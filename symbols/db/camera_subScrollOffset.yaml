name: camera_subScrollOffset
address: '0x08136B48'
kind: function
status: probable
summary: Subtracts r0 from the scroll/offset halfword at +0x18 of the toolkit's RenderInfo, adjusting
  the render scroll by a delta.
interface: (r0 = amount to subtract) -> r0 = new offset value; flags set by the final strh? no — flags
  from sub remain
details: 'Loads the toolkit''s RenderInfo pointer via r10 (oToolkit_RenderInfoPtr), reads the halfword
  at RenderInfo+0x18, subtracts r0 from it, stores the result back, and returns with r0 holding the new
  value (sub leaves the difference in r1, but r0 is untouched on return per this listing). RenderInfo+0x18
  is a 16-bit field, consistent with a screen/camera scroll or layer offset used by sprite rendering.
  The routine is tiny and pure: it only mutates that one field. Caller sub_8136AE8 is itself unnamed,
  so the semantic of r0 (pixels? tiles?) is not yet confirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r2,r10; ldr r2,[r2,#oToolkit_RenderInfoPtr] fetches the shared render-info struct; ldrh/strh
    on [r2,#0x18] shows a single 16-bit field being read-modify-written; sub r1,r1,r0 implements 'offset
    -= r0', a delta-style adjustment rather than an absolute set; sole caller sub_8136AE8 is also undocumented,
    providing no higher-level context
  refs:
