name: battle_shakeRenderCoords
address: '0x0801823C'
kind: function
status: probable
summary: Jitters a battle object's render X/Z by a small random amount for up to 30 frames, using its
  original X16/Z16 as scratch and writing the result to r5+0x34..0x3C before restoring the true coordinates.
interface: (r5 = battle object, no args) -> writes jittered X/Y/Z render coords to r5+0x34..0x3C; no return
  value
details: First calls hideSummonsWhenBlind. If PreventAnim is clear, it snapshots oBattleObject_X16 into
  the ChipID scratch field and Z16 into Z16Save, clears WobbleOrEffectTimer and sets PreventAnim=4 to
  freeze animation. If the word at CollisionDataPtr+0x80 is nonzero, the shake timer is set to 30 frames.
  Each frame while the timer is nonzero it decrements it and calls AddRandomVarianceToTwoCoords with mask
  3 on the saved X16/Z16 (Y passed along), storing the jittered fixed-point coords into the scratch block
  at r5+0x34 used for rendering, so the object visibly quakes around its original spot. When the timer
  hits zero the saved X16/Z16 are written back, ending the shake. The ChipID/Z16Save fields are clearly
  reused as scratch, not real chip data.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Snapshot + PreventAnim=4 + timer setup at the top of sub_801823C freezes animation during the
    effect; CollisionDataPtr+0x80 flag selects a 30-frame WobbleOrEffectTimer duration; shake loop calls
    AddRandomVarianceToTwoCoords (known: centered random jitter, mask 3, one RNG roll) and stores results
    at r5+0x34..; timer expiry path restores X16/Z16 from ChipID/Z16Save scratch; chip-route callers (0x801B4D4/B610/B750)
    invoke it per-frame as a battle-object updater'
