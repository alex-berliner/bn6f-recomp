  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code does run a position-shake using AddRandomVarianceToTwoCoords (mask 3) over saved X/Z with
    the current Y, writing the result into r5+0x34..0x3C as jittered render coords, and ends by restoring
    X16/Z16 from the ChipID/Z16Save scratch fields. However, the proposal claims PreventAnim is set to
    4 to freeze animation, but the code only sets PreventAnim=4 once on the first call when it was zero,
    not every frame; and the shake timer is 30 frames only if the CollisionDataPtr+0x80 word is nonzero.
    The name is reasonable but should reflect it preserves the real coords as scratch rather than implying
    the animation pause is its main purpose.; run wf investigate investigate-20261018-200615; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
