open_questions:
- Which chips/objects the callers 0x801B4D4/B610/B750 belong to, i.e. which attacks trigger this shake
- Exact meaning of the CollisionDataPtr+0x80 flag and the role of the Y value passed to AddRandomVarianceToTwoCoords
- The code does run a position-shake using AddRandomVarianceToTwoCoords (mask 3) over saved X/Z with the
  current Y, writing the result into r5+0x34..0x3C as jittered render coords, and ends by restoring X16/Z16
  from the ChipID/Z16Save scratch fields. However, the proposal claims PreventAnim is set to 4 to freeze
  animation, but the code only sets PreventAnim=4 once on the first call when it was zero, not every frame;
  and the shake timer is 30 frames only if the CollisionDataPtr+0x80 word is nonzero. The name is reasonable
  but should reflect it preserves the real coords as scratch rather than implying the animation pause
  is its main purpose.
