name: battle_checkPlayerActorStoryFlag_808CC10
address: '0x0808CC10'
kind: function
status: confirmed
summary: If the given battle actor is in story state 2 and event flag EVENT_9D8 is not yet set, sets that flag and
  reports that it was just latched.
interface: bool battle_checkPlayerActorStoryFlag_808CC10(void* actor /* r5 */); returns NZ set (r4 = 1) only on
  the call that sets the flag; r3/r4/r5/r6 also live on return (r3 is leftover from the flag helper, r4-r6 are pass-through).
details: Battle-side one-shot story-flag latch. Reads the actor header byte at [r5+4] (story/state byte) and only
  acts when it equals 2. It then tests event flag EVENT_9D8 via TestEventFlagFromImmediate (flag split as r0 = bank
  9, r1 = index 0xD8); if clear, it sets the flag with SetEventFlagFromImmediate and sets r4 = 1. Finally tst r4,r4
  drives the NZ flags, so callers branch on "flag was set by this call" vs "nothing happened" (already set, or actor
  not in state 2). r4-r7 are pushed/popped, so r4-r6 reach the caller unchanged (r4 as the result, r5/r6 pass-through);
  r10 is listed as an input by the callers but is never read in the body. No other game state is touched.
