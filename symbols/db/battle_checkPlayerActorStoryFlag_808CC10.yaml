name: battle_checkPlayerActorStoryFlag_808CC10
address: '0x0808CC10'
kind: function
previous_names:
- sub_808CC10
status: probable
summary: If the battle actor at r5 is a player actor (Unk_04 == 2) and story flag EVENT_9D8 is unset,
  sets the flag and marks the result true; otherwise returns false.
interface: (r5 = SomeBattleActorPtr, r10 = toolkit) -> flags only (r4 holds result)
details: "Saves callee-saved r4-r7, sets r4 = 0.\n  ldrb r0, [r5, #4] loads Unk_04 of the pointed-to BattleObject\
  \ (offset 0x4 per `battle_object_struct`: the `Params`/`Param1` byte). Compares against #2.\n  On equality,\
  \ calls `TestEventFlagFromImmediate` with `EVENT_9D8`; if the flag is already set, falls through with\
  \ r4 = 0 (returns nz=false). Otherwise calls `SetEventFlagFromImmediate(EVENT_9D8)` and sets r4 = 1\
  \ (returns nz=true).\n  Final `tst r4, r4` followed by `pop {r4-r7, pc}` returns the boolean in the\
  \ z flag to the caller `sub_808CC34`.\n  The check on Unk_04 == 2 corresponds to the high nibble of\
  \ `Params`, which per `object_header_struct` is the actor's `ListIndex`/type, gating the work to one\
  \ specific battle object kind.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `cmp r0, #2` at 0x808CC18 tests the byte at [r5, #4] against the constant 2. - Two direct
    calls to `TestEventFlagFromImmediate` then `SetEventFlagFromImmediate` with the same `EVENT_9D8` immediate
    from `movflag`. - r4 is initialised to 0 before the branch and only set to 1 on the "set the flag"
    path; the trailing `tst r4, r4` plus the caller contract `out=[''nz'', ...]` show r4 is the boolean
    returned via flags. - r5 in is callee-saved and used as the actor pointer; r10 is the toolkit (matches
    the `EventFlagsPtr`-based flag APIs).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0808CC10

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^0808cc10 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- The exact game meaning of EVENT_9D8 and which subset of actors ("battle object kind 2") this fires for.
  Mapping EVENT_9D8 to a named story milestone and confirming which `ListIndex` byte == 2 corresponds
  to would settle both.
