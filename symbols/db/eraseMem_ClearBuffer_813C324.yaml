name: eraseMem_ClearBuffer_813C324
address: '0x0813C324'
kind: function
status: confirmed
summary: Zero-fills the 8-byte work record at unk_2000090 in EWRAM, passing the caller's r2 through untouched.
interface: 'void sub_813C324(void) /* in: r2 (pass-through value, preserved); out: r2 unchanged; clobbers r0, r1,
  lr, flags */'
details: 'Wrapper over ZeroFillByByte: loads the fixed address unk_2000090 (EWRAM, 0x2000090) into r0,

  sets a byte count of 8 in r1, and calls ZeroFillByByte to wipe that 8-byte buffer, then returns.

  The buffer looks like a small per-call work record (the project''s EraseMem-area scratch slot),

  so this is effectively "reset/clear the 8-byte scratch record to all zero before reuse".

  The only quirk is the register contract: r2 is neither read nor written by this routine but is

  guaranteed preserved across it, and lr is clobbered (pushed/popped for the return), so callers

  rely on r2 surviving the call — consistent with a helper invoked mid-sequence while a value is

  held in r2. Flags are not meaningful on return.

  '
