name: battle_rollRandomItemDrops_80AA88C
address: '0x080AA88C'
kind: function
previous_names:
- sub_80AA88C
status: confirmed
summary: 'At enemy spawn, gives one enemy a held chip: each alive opponent (battle state +0x90, up to four) draws
  from its virus''s held-chip table (sub_80AED50) with 4 bits of one RNG value; the last one that draws a chip (not
  0xFFFF) gets it (+0x2A Chip, +0x1A ChipsHeld = 1).'
interface: 'void battle_rollRandomItemDrops(void) /* in: r10 = toolkit; out: flags C/V from (loop count == 4); clobbers
  r0-r3 */'
details: 'Takes the toolkit''s battle-state pointer (oToolkit_BattleStatePtr via r10), walks a

  four-entry array of drop-state pointers starting at battle+0x90 (stride 4). For each

  non-null slot it reads the slot''s kind/variant from halfword oBattleState_Unk_28,

  resolves that kind''s item-drop table via sub_80AED50, and consumes 8 bits of a single

  GetPositiveSignedRNG value: shifts it right 4, masks 0x1E to get a halfword-aligned

  table offset (i.e. up to 16 halfword entries), then shifts right 5 more. Entries equal

  to 0xFFFF mean "no drop"; the last slot whose roll yields a real item is remembered

  (both its state pointer and the item id). After the loop, the winning slot (if any)

  gets the item id stored to halfword 0x2A and byte 0x1A set to 1 (item-rolled/drop-

  pending flag). One RNG call is shared across all four slots, so later slots use the

  upper RNG bits. Returns the loop counter (4) only as far as the caller-visible C/V

  flags of the final `cmp r6, #4`; the pointer result itself is never returned.



  Correction (2026-10-13): this is not a post-battle drop roll. Its only caller is battle_SpawnEnemyObjects_8007358,
  right after SpawnBattleObjectUsingBattleEntityConfig_8007368 spawns the enemies; battle state +0x90 is AliveOpponentActors
  (BattleState.inc), so the four "slots" are the opponent battle objects, and the halfword read with the name oBattleState_Unk_28
  is really BattleObject.NameID (0x28); the writes are BattleObject.Chip (0x2A) and ChipsHeld (0x1A). Proposed name
  battle_rollEnemyHeldChip_80AA88C. The rename waits in symbols/pending_renames.txt: the subsystem farm''s worktrees
  share bn6f and still hold copies of the C that names this symbol, so renaming now would break their builds.


  Precision over the earlier summary: the per-slot index is the byte offset (r >> 4) & 0x1E into the row — i.e.
  halfword index bits 5-8 of the one GetPositiveSignedRNG value, 16 halfword slots per version (byte_80AED74 rows
  are 0x20 bytes).'
