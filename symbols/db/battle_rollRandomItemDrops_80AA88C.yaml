name: battle_rollRandomItemDrops_80AA88C
address: '0x080AA88C'
kind: function
status: confirmed
summary: Rolls a random item drop for up to four post-battle drop slots and flags the winning slot with
  the rolled item id.
interface: 'void battle_rollRandomItemDrops(void) /* in: r10 = toolkit; out: flags C/V from (loop count
  == 4); clobbers r0-r3 */'
details: 'Takes the toolkit''s battle-state pointer (oToolkit_BattleStatePtr via r10), walks a

  four-entry array of drop-state pointers starting at battle+0x90 (stride 4). For each

  non-null slot it reads the slot''s kind/variant from halfword oBattleState_Unk_28,

  resolves that kind''s item-drop table via sub_80AED50, and consumes 8 bits of a single

  GetPositiveSignedRNG value: shifts it right 4, masks 0x1E to get a halfword-aligned

  table offset (i.e. up to 16 halfword entries), then shifts right 5 more. Entries equal

  to 0xFFFF mean "no drop"; the last slot whose roll yields a real item is remembered

  (both its state pointer and the item id). After the loop, the winning slot (if any)

  gets the item id stored to halfword 0x2A and byte 0x1A set to 1 (item-rolled/drop-

  pending flag). One RNG call is shared across all four slots, so later slots use the

  upper RNG bits. Returns the loop counter (4) only as far as the caller-visible C/V

  flags of the final `cmp r6, #4`; the pointer result itself is never returned.

  '
