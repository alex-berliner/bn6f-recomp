details: 'Called as part of leaving the Custom (chip select) screen. It runs four steps in order: sub_8028E4C (unknown
  first step, likely state/handler setup or teardown), updateCustomScreen_WhenUnselectingChip_8028EC8 (the already-named
  routine that updates custom screen state after the player unselects a chip), sub_8028F48 and sub_8028F84 (follow-up
  updates, likely cursor/chip-slot cleanup and screen redraw or transition bookkeeping). Finally it calls sub_8028250
  with r0 = 0, which appears to be a shared exit/state-switch helper taking a result or next-state code of 0. The
  function itself touches no state directly; it is purely an orchestration wrapper. Preserves r4-r7 (callee-saved)
  as required by the ABI; its register contract shows all caller registers flowing through untracked because the
  work happens in the callees.'
