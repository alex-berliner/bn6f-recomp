name: sub_80F77D4
address: '0x080F77D4'
kind: function
status: hypothesis
summary: Thin wrapper that invokes sub_800FE28 with a fixed 4-byte descriptor (0x03030302) and passes its r5 argument
  through, returning sub_800FE28's result.
interface: u32 sub_80F77D4(u32 r5 /* arg passed through to sub_800FE28 */); returns r0 from sub_800FE28
details: 'Pushes lr, loads the address of dword_80F77E4 (whose contents are the single word "0x03030302", i.e. bytes
  02 03 03 03 in memory), calls sub_800FE28 with that pointer in r0 and the caller''s r5 preserved, then pops pc
  and returns sub_800FE28''s r0 unchanged. The wrapper itself touches no game state besides the descriptor pointer;
  all actual behavior lives in sub_800FE28, which is not yet analyzed, so the game-level meaning of the descriptor
  bytes (possibly a small struct of mode/count fields) is unknown. Clobbers r1, r2 and flags; keeps nothing of its
  own besides lr.

  '
