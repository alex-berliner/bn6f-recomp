name: battle_armAttachmentSpawnFlankEffects
address: '0x080D7E98'
kind: function
status: probable
summary: Periodic update for a timed battle object that spawns two effects on the panels directly above
  and below its own panel, then restarts its cycle.
interface: (r5 = battle object) -> void; destroys nothing, sets oBattleObject_CurPhase and oBattleObject_Timer2
details: 'Runs as a per-frame object update. On phase 0 it initializes: sets CurPhase=1 and Timer2=0xF.
  While Timer2 counts down, at the tick where it equals 0xB it calls sub_80D7EF6 twice with the object''s
  own PanelX and PanelY-1 with r2=0xE1, and PanelX/PanelY+1 with r2=0xD1 — i.e. it plants something on
  the two vertically adjacent panels, with the two r2 values likely distinguishing object/effect kinds
  for the two sides. When Timer2 reaches 0 it clears CurPhase back to 0, so the next frame re-initializes
  and the spawn cycle repeats every 15 frames. The function never destroys the object; its lifetime is
  handled by the caller''s own timer logic.'
