- method: assembly-reading
  date: '2026-10-21'
  detail: strb r0, [r5,#oBattleObject_Param2] with r0=0 clears Param2 on entry; strb r0, [r5,#oBattleObject_Param3]
    with r0=1 sets Param3 first-frame sentinel; str r0, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    writes CUR_STATE_UPDATE to enter the update branch; r5 as the object pointer matches the standard
    BN6 battle-object calling convention
