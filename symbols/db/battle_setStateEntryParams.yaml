name: battle_setStateEntryParams
address: '0x080E6E64'
kind: function
status: probable
summary: Initializes a battle object's state-entry parameters (Param2=0, Param3=1) and marks CurStateActionPhaseAndPhaseInitialized
  as CUR_STATE_UPDATE on the object pointed to by r5.
interface: (r5 = oBattleObject*) -> void; writes 0 to Param2, 1 to Param3, CUR_STATE_UPDATE to CurStateActionPhaseAndPhaseInitialized
details: A small state-entry initializer for a battle object. It clears Param2, sets Param3 to 1 (the
  typical 'first frame' sentinel), and writes CUR_STATE_UPDATE into the combined CurStateActionPhaseAndPhaseInitialized
  word so the object's state machine runs its initialization branch on the next update tick. Since no
  callers are known in the symbol map, the specific owning subsystem (battle/pet/spawn/etc.) cannot be
  pinned down, but the field set is consistent with the battle-object convention.
