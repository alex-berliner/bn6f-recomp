open_questions:
- Exact meaning of sub_3007868 (claim panel, set owner, etc.); the function's only confirmed callee summary
  is "(r0,r1,r2) -> r2" and that it writes to multiple registers, which fits a "set panel owner to r2"
  pattern but is not certain.
- The 0x80 branch is only seen in a single high-level caller (`object_presentCollisionData`); whether
  bit 0x80 is set per-region statically (table data) or dynamically is unknown. Knowing what regions set
  it would settle the branch's real-world trigger.
- The swapped (r7,r8) vs (r6,r7) argument order in the second branch's `_object_updatePanelParameters`
  call looks like a possible bug or intentional row-as-X for that helper; confirming what the helper does
  with (x,y) would resolve it.
