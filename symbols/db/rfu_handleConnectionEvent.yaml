name: rfu_handleConnectionEvent
address: '0x08145658'
kind: function
status: probable
summary: 'Wireless-adapter connection state-machine dispatcher: handles one link event against the rfu
  connection struct at 200FE00, advancing/clearing search-and-connect states.'
interface: (r0 = event id (0x10..0x3D dispatch range), r1 = param (0 = action allowed, nonzero = ignored))
  -> r0 = result/status of the branch taken; clobbers r4-r7, uses eStruct200FE00
details: 'First checks byte 200FE0E as a busy/queue flag — if zero it returns immediately, otherwise clears
  it and switches on (r0 - 0x10) over a 46-entry jump table (most cases are defaults). Each case implements
  a step of the librfu parent/child connection flow: copying state byte 0x05 into 0x04 (prev state / current
  state pair), setting new states, decrementing the countdown at 200FE1A and transitioning on expiry,
  and calling rfu APIs — rfu_getConnectParentStatus into buffer 200FE10, rfu_REQ_endSearchParent when
  a parent slot reports status 4 via dword_2010CC0, plus rfu_clearSlot, rfu_NI_CHILD_setSendGameName,
  rfu_CHILD_getConnectRecoveryStatus elsewhere. Cases store error/parent-count codes into word 200FE14
  and word 200FE1E, then signal via sub_81461B0. Several branches bail (returning early) unless r1 ==
  0, so r1 acts as an ''abort/no-op'' flag.'
