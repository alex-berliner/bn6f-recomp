name: spawnBattleIllusion
address: '0x080EAFC2'
kind: function
status: probable
summary: Spawns an afterimage/illusion battle object for the caller's battle object (r5), computing a
  packed id from object_getFlip and oBattleObject_NameID with a 0xA2..0xAB range override, calling spawnIllusionObject_80E33FA,
  then dispatching sub_80E341E with arg 1 or 2 based on GetBattleNaviStatsByte at offset 0x2C for the
  object's alliance side.
interface: (r0-r3 = spawn params, reordered to (old r3,r2,r1,r0); r5 = battle object) -> r0 = spawned
  illusion object or 0
details: Reads the battle object's effective facing via object_getFlip and the object's NameID; if NameID-0xFF
  falls in 0xA1..0xAB (a specific form/ID range) the low index becomes 0, otherwise it stays 0xF. It builds
  a packed id r4 = (flip<<8 | index)<<16 | 0xFF, shuffles its four incoming arguments (r0<->r3, r1<->r2)
  and calls spawnIllusionObject_80E33FA with r6=0x83E0 and r7=0x1010014-old r3, apparently using the custom
  r4/r6/r7 side-channel arguments. If an object is returned, it reads NaviStats byte 0x2C for the object's
  alliance side via GetBattleNaviStatsByte; values 0x0B..0x18 call sub_80E341E(obj,1), anything else sub_80E341E(obj,2).
  Nearby data (byte table at 80EB028, AIAttackJumptable pointer, 0xFFFF sentinel) suggests this belongs
  to a Beast/AI attack setup block. Run on the beastsp route, consistent with Beast Out handling.
