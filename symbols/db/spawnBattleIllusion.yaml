name: spawnBattleIllusion
address: '0x080EAFC2'
kind: function
status: confirmed
summary: Spawns a flickering holographic illusion copy of a battle object and programs its flicker rate from the
  owning navi's stats.
interface: void spawnBattleIllusion(r0..r3 = spawn args, r5 = battle object*) ; leaves r5 = spawned illusion object,
  r6 = illusion attr2 word, preserves r4 and r7; clobbers r0-r3, flags
details: 'Builds OAM attributes for the illusion sprite from the source object: object_getFlip

  supplies the horizontal-flip bit (shifted into attr1''s high byte), and the palette

  slot is 0xF unless the object''s oBattleObject_NameID (raw value, compared after

  subtracting 0xFF) falls in the special range 0x1A1..0x1AB, in which case palette 0

  is used. attr2 is the fixed word 0x83E0 (dword_80EB01C) combined with the flip and

  palette nibble; attr1 is base 0x1010014 (dword_80EB020) minus the old r3 argument.

  Calls spawnIllusionObject_80E33FA to create the illusion; if it returns non-null,

  reads oBattleObject_Alliance from the source object and queries

  GetBattleNaviStatsByte(alliance, 0x2C): if that stat is 0x0B..0x18 the illusion''s

  flicker mode (sub_80E341E) is set to 1 (fast flicker), otherwise 2 (slow flicker).

  Quirk: r0-r3 are pushed before the getFlip call and popped back one slot shifted

  (pop {r1-r3}; pop {r0}), so the spawner sees r1=old r0, r2=old r1, r3=old r2, and

  old r3 only offsets the attr1 base; r4/r6/r7 are saved and restored verbatim.

  Nearby data (byte_80EB028 table of small values, AIAttackJumptable pointer) suggests

  this belongs to the battle AI''s illusion/clone effect, not a player-facing routine.

  '
