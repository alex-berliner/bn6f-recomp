name: battle_phaseInitRelatedNaviAndWaitParam2
address: '0x080E4954'
kind: function
status: probable
summary: 'Battle-object phase handler: on first entry initializes itself and its related Navi object (sets
  Timer=0x3C, PhaseInitialized=4), then on each frame returns until Param2 clears; when Param2 is 0, sets
  CurAction=0xC and resets the phase field. The related-Navi alliance byte at offset 0x21 selects between
  sub_8014446 and ai_clearCounterHitChainFlag.'
interface: (r5 = battle object pointer, set by caller) -> void; r4/r6 preserved, r0-r3/r7 clobbered
details: 'A per-frame state handler for a battle object whose state lives in r5. If PhaseInitialized is
  0 it runs one-time init: calls sub_80C4AEC with r0=r5+5 (some sub-object/field base), calls sub_80E49C4
  and sub_801E658 on RelatedObject1Ptr, then reads NaviStats byte 0x21 for the related object''s side;
  if nonzero it calls sub_8014446, otherwise ai_clearCounterHitChainFlag — i.e. the counter-hit chain
  field is reset either way, via different paths. It then sets Timer=0x3C (60 frames) and marks PhaseInitialized=4.
  On subsequent frames it just checks Param2: if nonzero it returns and keeps waiting; once Param2 is
  0 it sets CurAction=0xC and CurPhaseAndPhaseInitialized=0, finishing the state. This is the classic
  BN6 battle ''wait for condition, then move to next action'' pattern; the exact meaning of Param2 (likely
  a flag set elsewhere when some event occurs) is not visible here.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'PhaseInitialized==0 guard with init body then strb #4, [PhaseInitialized]: one-shot init then
    steady state; mov r0,#0x3C; strh [oBattleObject_Timer]: 60-frame delay is the state''s purpose; push
    {r5}; ldr r5,[r5,#oBattleObject_RelatedObject1Ptr]; bl GetBattleNaviStatsByte_AllianceFromBattleObject:
    acts on the linked Navi object''s side; both branches of the byte-0x21 test end in clearing the counter-hit
    chain (sub_8014446 / ai_clearCounterHitChainFlag); tail: if Param2==0 -> CurAction=0xC, CurPhaseAndPhaseInitialized=0:
    transition out of the state'
