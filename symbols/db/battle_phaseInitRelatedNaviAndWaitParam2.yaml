  reproduce: python3 tools/asmcat.py 0x080E4954
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The call sequence operates on the *related* Navi object (r5 is reloaded from oBattleObject_RelatedObject1Ptr
    before the GetBattleNaviStatsByte_Alliance call at ldr r5,[r5,...]; mov r1,#0x21), so the alliance
    check is on the related Navi, not the battle object''s side. Also only the r0==0 path calls ai_clearCounterHitChainFlag;
    the nonzero path calls the unknown sub_8014446, so ''reset either way'' is wrong. Name and overall
    summary direction are reasonable.; run wf investigate investigate-20261019-010606; proposed by Hyper
