open_questions:
- What sub_80C4AEC, sub_80E49C4 and sub_801E658 do (they would pin down the init's exact effect)
- What sets Param2 to nonzero/zero, i.e. what condition ends the 60-frame wait
- What CurAction 0xC means in the battle action table
- The call sequence operates on the *related* Navi object (r5 is reloaded from oBattleObject_RelatedObject1Ptr
  before the GetBattleNaviStatsByte_Alliance call at ldr r5,[r5,...]; mov r1,#0x21), so the alliance check
  is on the related Navi, not the battle object's side. Also only the r0==0 path calls ai_clearCounterHitChainFlag;
  the nonzero path calls the unknown sub_8014446, so 'reset either way' is wrong. Name and overall summary
  direction are reasonable.
