name: MapScriptCutsceneCmd_write_eStruct2001c04_byte
address: '0x08035F0E'
kind: function
status: confirmed
summary: Map script command that writes one byte at a given offset into the S2001c04 work-area struct.
interface: void mapScriptCmd_writeS2001c04Byte(toolkit r10, scriptCursor r7); // returns r0 = 1, r7 += 3, flags
  from r7+3
details: 'Cutscene/map-script bytecode handler. Fetches the S2001c04 struct pointer from

  the toolkit at oToolkit_S2001c04_Ptr (r10). It then reads two bytes from the

  script stream via ReadMapScriptByte, using r6 as a selector (r6=1 reads the

  first operand, r6=2 the second; the byte value comes back in r4):

  - byte 1: offset into the S2001c04 struct (added to the struct base pointer)

  - byte 2: value to store

  The value is stored with strb at S2001c04[offset]. Advances the script cursor

  r7 by 3 (command byte + 2 operands) and returns 1 in r0, which the script

  interpreter evidently treats as "continue / command consumed".

  Quirks: the offset byte is used unmasked and unchecked, so a script can write

  past the struct; the offset is also not zero/sign-extended beyond what the

  add leaves. r4 is used as the read-result register handoff, and r6 doubles as

  the "which script byte am I reading" counter for ReadMapScriptByte.

  '
