name: battle_regenEnemyUpdate
address: '0x0810E854'
kind: function
status: probable
summary: Per-frame update for a battle object that regenerates HP and switches its (and an attached child
  object's) animation based on remaining HP.
interface: (r5 = battle object) -> void; no return value, flags clobbered
details: 'Every frame, unless the battle is paused or time-stopped, it increments a frame counter at ExtraVars+0x10;
  once it passes 4 it heals the object: if HP>0 and HP<MaxHP it does HP+=1 (roughly +1 HP every 4 frames,
  counter is stored without being reset to 0). It then returns early if a flag at ExtraVars+0x1c is set.
  Otherwise it picks an animation index from HP: >0x50 -> index 0, <=0x50 -> 1, <=0x1e -> 2, and returns
  immediately if HP==0. Table byte_810E8D4 maps index {0,1,2} to {anim 0/no extra (0xFF), anim 1 + extra
  6, anim 2 + extra 7}: the anim byte goes into oBattleObject_CurAnim, and for a non-0xFF extra it writes
  it to ExtraVars+4 object''s field +0x10, or calls sub_810EB42 if no child object exists; on 0xFF it
  resets the child timer (battle_ResetObjectTimerTo8) and NULLs the ExtraVars+4 pointer.'
