name: clearScenarioEventFlag
address: '0x0808FC7C'
kind: function
status: probable
summary: Clears a story/event flag whose id is looked up from a table using a byte from the context at
  r10.
interface: () -> r0 = 0; no flags used
details: Reads a pointer from r10 (offset 0x3c) to some active-context struct. If byte at +4 equals 0x85
  it uses the constant 3, otherwise it takes byte at +5, doubles it, and indexes byte_808FCA8 (a table
  of u16 event-flag ids) to get the flag to clear, then calls ClearEventFlag. Always returns 0. The 0x85
  special case looks like a version/scenario-variant override forcing flag id 3. Without callers, the
  meaning of the r10 struct and the table's contents (which scenario each flag belongs to) are unknown.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r5, off_808FCE0 / ldr r5,[r5,#0]: loads pointer used only to reach the flag table setup,
    main source is mov r0,r10 / ldr r0,[r0,#0x3c]; cmp r1,#0x85 ... mov r1,#3 / else ldrb r1,[r0,#5]:
    selects index 3 or byte at struct+5; lsl r1,r1,#1 / ldrh r0,[r0,r1]: reads u16 flag id from byte_808FCA8;
    bl ClearEventFlag: passes the looked-up id to the known event-flag clearer; mov r0,#0 / pop {r5,pc}:
    fixed return value 0'
