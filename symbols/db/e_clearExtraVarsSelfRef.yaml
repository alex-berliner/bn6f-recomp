name: e_clearExtraVarsSelfRef
address: '0x080D5348'
kind: function
status: probable
summary: Clears the object's own pointer out of its extra-vars block (self-back-reference check) during
  teardown.
interface: (r5 = battle object, callee-saved convention) -> r0 clobbered; no return value
details: Reads the object's oBattleObject_ExtraVars pointer and, if the first field of that block equals
  the object's own address (r5), stores 0 there. This unlinks a self/back-reference the object holds in
  its extra data, a cleanup step run by battle-object initializers and the linger-during-owner-deletion
  updater. No other fields are touched and nothing else is cleared, so it is purely a null-out of that
  one pointer.
