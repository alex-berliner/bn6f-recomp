name: battle_resetObjectPhaseCounter_80B8E58
address: '0x080B8E58'
kind: function
status: confirmed
summary: Resets a battle object's current state-action phase counter, marking the object's current phase as not
  yet initialized; silently does nothing for a NULL object.
interface: 'void sub_80B8E58(BattleObject *obj)  /* in: r0 = battle object (may be NULL); out: nz flags and r1 are
  side effects of the original (r1=8 and Z clear when obj != NULL), callers ignore them */'
details: 'Takes a battle object pointer in r0. If it is NULL the function returns immediately without touching memory.
  Otherwise it stores the constant 8 into the object''s oBattleObject_CurStateActionPhaseAndPhaseInitialized field.
  The offset name indicates this field packs the current state-action phase counter together with a "phase initialized"
  flag; writing 8 clears the low bits that count phases/steps within the current action while keeping the initialized
  bit (bit 3) set, so the next state tick re-enters the phase-0 handling of the object''s current state action.
  It is the typical "restart this state''s action from the beginning" helper called by battle state machines after
  a state transition or when an action needs to replay its phases. Quirk: on the NULL path r1 and the flags are
  simply whatever the caller left, and on the store path the flags come from the ''mov r1, #8'' rather than from
  any deliberate test — callers evidently ignore both.

  '
