name: chatbox_cmdSetEventFlag_8041218
address: '0x08041218'
kind: function
status: confirmed
summary: Chatbox script command handler that sets an event flag from the flag table and advances the script pointer
  to the next command.
interface: void chatbox_cmdSetEventFlag(void* record /* r4 */, void* chatboxState /* r5 */); clobbers r0, r1, r3,
  r4, lr and NZCV via SetEventFlag and the pointer bump
details: 'Handles one ''set event flag'' opcode in the chatbox command stream. r4 points at the current 3-byte command
  record; its byte 2 is a flag-word index (0-255) which is scaled by 4 and used to fetch a u32 from a flag-word
  table at chatboxState(r5)+0x4C (so the table spans 0x4C..0x14B for 256 entries). That word is passed to SetEventFlag,
  which presumably turns on the bit selected by the remaining bytes of the record (byte 0/1 likely carry the bit
  number or opcode encoding - not shown here). Afterwards r4 is advanced by 3 to point at the next command record;
  the final `adds r4, #3` sets the outgoing NZCV from the pointer arithmetic. Note the tail call to SetEventFlag
  means r0/r1/r3 and flags on return are whatever SetEventFlag leaves.'
