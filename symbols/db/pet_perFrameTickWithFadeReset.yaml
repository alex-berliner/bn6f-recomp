name: pet_perFrameTickWithFadeReset
address: '0x0800585A'
kind: function
status: probable
summary: 'Per-frame PET/main tick: runs the scene dispatcher, scenario effects, object dispatch and the
  full sprite/OW render pipeline, and when a screen fade is active performs a full teardown-and-reinit
  then jumps the main jumptable to state 0x50.'
interface: () -> (); sets the byte at *oToolkit_MainJumptableIndexPtr to 0x50 and tears down/reinits global
  state when a fade is in progress; tail clobbers r0/r1/r5/r7
details: 'Every call it ticks the PET scene dispatcher (dispatch_80339CC), the scenario effect jumptable,
  object dispatch by type, then the whole render path: sprite flush/palette reset, overworld map object
  rendering, palette group init, NPC sprite draw, battle-sprite group queue finalize, group finish, OW
  sprite queuing, and the armed event callback. It then checks IsScreenFadeActive: if no fade is active
  it simply returns (beq locret). If a fade IS active, it executes a reset sequence: chatbox_8040818,
  FreeAllObjectsOfSpecifiedTypes(0x21), npc_clearOverworldNpcStateWord, resetAllGraphicsState, runSetupStepAndClearWorkArea,
  sprite battle-fade gfx init, zero-fills, scenario_initEffectState, RandomizeExtraToolkitPointers and
  reloadCurNaviStatBoosts, then loads the GameState pointer from the toolkit and writes 0x50 to the main
  jumptable index to switch to the next game state. Note the comment''s ''(self: * GameState $r5)'' is
  misleading — r5 is only loaded late from oToolkit_GameStatePtr, and no GameState field is otherwise
  touched.'
