name: battle_queueHpUpdate_8128C20
address: '0x08128C20'
kind: function
status: confirmed
summary: Queues an HP-related battle update command (opcode 0xE1.0x13) derived from the battle object's HP field.
interface: 'void sub_8128C20(void); /* in: r5 = battle object pointer (uses offset 0x1E = HP, 0x24 = some field);
  out: r5 preserved; clobbers r0,r1,r2,r3,lr, nzc/v; preserved r4,r5,r6,r7 */'
details: 'Reads the battle object''s HP halfword at r5 + 0x1E, computes coord = (hp & 1) + (hp >> 1)

  (i.e. remainder-of-2 + half of HP), then prepares register arguments for sub_811FA98:

  r0 = 0xE10013 (command opcode), r1 = 0x20002, r2 = coord, r3 = LD16(r5 + 0x24),

  r4 = 4, r6 = 0xC240 (the "byte_8128C48" actually encodes 0x40 0xC2 0x00 0x00 i.e. 0xC240),

  r7 = 0x37, and tails into sub_811FA98. r4/r6/r7 are preserved across the call by the

  push/pop of r4-r7,lr, but the C listing shows r6 = 0xC240 (not 0x40) and r7 = 0x37 as

  expected by the callee. Likely an HP-related state or damage update queued into the

  battle command buffer.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
