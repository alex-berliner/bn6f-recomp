name: sub_802C6EC
address: '0x0802C6EC'
kind: function
status: confirmed
summary: Renders a 0-11 counter value as digit glyphs (values over 10 clamped and shown as a single special "11"
  glyph) and blits it into a UI row buffer.
interface: void sub_802C6EC(u32 value /* r0, 0..11 */); callers see r5-r7 back but these are incidental (r7 is whatever
  blitTileBlockToRowBuffer_802C4B6 leaves), r4 preserved, flags clobbered
details: 'Builds a 5-slot scratch tile row on the guest stack (sp lowered by 0x1C; +0x14 spills the clamped value,
  as in the original). Each u16 slot gets a tile pair: a blank glyph (NUMBER_TILE_BANK+0x14 = 0x90B4) plus the next
  tile, written to both the slot at +0x00 and its duplicate at +0x0A. Values > 11 are clamped to 11 first. If the
  value is >= 11, a single glyph is taken from a tile bank 0x1000 indices further in (0x90A0 + 0x1000, likely a
  second glyph sheet, e.g. a filled/complete marker); otherwise memory_bcdConvert converts the value to packed BCD
  and countHexDigits_8000C5C gives the digit count. Digit glyphs are then written right-to-left (glyph index = digit*2,
  paired with digit*2+1) over the blank-filled slots from sp+8 downward, so the number is right-aligned in the 5-slot
  field. Finally blitTileBlockToRowBuffer_802C4B6(0x10, 6, sp, 5, 2) blits a 16x6-tile area (5 tile pairs, 2 rows
  apart, tile column 0x10) into the row buffer. Given the use of memory_bcdConvert and a digit tile bank, this looks
  like a small on-screen counter in a memory/menu-style screen (e.g. counting collected items or progress out of
  11); exact screen is not identified.

  '
