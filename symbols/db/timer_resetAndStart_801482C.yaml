name: timer_resetAndStart_801482C
address: '0x0801482C'
kind: function
status: confirmed
summary: Resets the counter in the tracking struct at 0x20367F0 to zero and sets its active flag, starting/restarting
  whatever count it tracks.
interface: void sub_801482C(void) /* returns struct pointer in r1 */
details: Stores 0 into the 32-bit counter dword_20367F0 and writes 1 to the byte at 0x20367F4 (offset +4 of the
  same struct), marking the tracked state as active/fresh. Returns the struct base address 0x20367F0 in r1. Clobbers
  r0 and the NZ flags; no other state touched. The paired counter increment elsewhere presumably reads dword_20367F0
  while the +4 flag gates whether it counts; callers likely keep r1 to hand the struct address onward.
