name: ai_attackBurrowStep
address: '0x080FF2E4'
kind: function
status: probable
summary: 'AI attack step: the enemy burrows into its current panel — reserving it, vanishing from collision,
  waiting 19 frames, then arming its hit element for the emergence.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = hit-element value to apply when the timer
  expires; updates object and AI state
details: 'First call (AttackElement == 0): sets AttackElement to 4, copies the object''s PanelX/Y into
  its FuturePanelX/Y, and calls object_reservePanel to claim the panel it stands on. It then switches
  the object''s animation to 0xD, clears its collision region (making it unhittable), clears a matching
  record in the byte_203EB50 table via sub_801DD34, and ORs OBJECT_FLAGS_CANNOT_SLIDE into its flags so
  it can''t be pushed off the reserved panel. It stores 0x13 (19) into StepTimer and returns. On subsequent
  calls it just decrements StepTimer each frame; when it reaches zero it writes 8 into HitElement, presumably
  so the next step applies that element to the attack that ends the burrow.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: cmp of oAIAttackVars_AttackElement against 0 branches to a pure timer-decrement path, confirming
    this is one step of an AI attack state machine; object_reservePanel called right after copying PanelX/Y
    to FuturePanelX/Y claims the tile the enemy sits on; object_clearCollisionRegion plus OBJECT_FLAGS_CANNOT_SLIDE
    via object_setFlag1 makes the object untargetable and immovable while burrowed; StepTimer = 0x13 decremented
    per call, on expiry oAIAttackVars_HitElement = 8 sets up the follow-up hit; anim 0xD written to oBattleObject_CurAnim
    matches a special burrow/hide pose
