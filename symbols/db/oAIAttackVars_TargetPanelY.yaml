  reproduce: grep -n 'oAIAttackVars_Unk_17' bn6f/asm/asm31.s | head
  result: '"ldrb r1, [r7,#oAIAttackVars_Unk_17] / ldr r0, [r7,#oAIAttackVars_Unk_30] / add r1, r1, r0
    / strb r1'
- method: assembly-reading
  date: '2026-10-15'
  detail: Used as the target Y to compute Y-axis slide velocity — only meaningful if the field is a panel
    Y coordinate.
