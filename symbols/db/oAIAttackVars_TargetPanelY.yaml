name: oAIAttackVars_TargetPanelY
address: '0x17'
kind: struct-field
status: probable
summary: AI attack target panel Y coordinate (paired with offset 0x16 = TargetPanelX), used to plan and
  commit multi-panel moves.
details: This field is consistently loaded/stored as the second half of a (X,Y) target panel pair, written
  to oBattleObject_FuturePanelY/PanelY, fed to panel reservation/highlight/check functions, and used to
  compute the Y-axis delta for slide velocity (e.g., asm31.s:172137). It is also the value incremented/decremented
  by Unk_30 for step-wise panel movement (asm31.s:113543, 113560). The partner field at offset 0x16 is
  clearly X, so 0x17 is the Y counterpart.
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: Stored alongside Unk_16 into oBattleObject_FuturePanelX/Y after a picker validates a panel —
    confirms it's a target panel Y.
