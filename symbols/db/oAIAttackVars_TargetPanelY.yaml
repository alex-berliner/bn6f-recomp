  - bn6f/asm/asm31.s:109381
  reproduce: grep -n 'oAIAttackVars_Unk_17' bn6f/asm/asm31.s | head
  result: '"strb r1, [r7,#oAIAttackVars_Unk_17]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Incremented/decremented by a signed step (Unk_30) clamped to [1,3] — step-wise panel Y movement.
  refs:
