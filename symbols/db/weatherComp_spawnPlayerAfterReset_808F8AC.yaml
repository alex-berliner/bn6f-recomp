open_questions:
- The exact role of the trailing `mov r0,#4 ; bl loc_809E306` — whether 4 is a state id, a sub-jumptable
  offset, or a flag (0x4) for the OW player state at +0x08 — isn't inferrable from this function alone.
  Comparing to other cuts at loc_809E306 would settle it.
- 'Whether SetOWPlayerNaviPaletteIndex is being asked to "set" or to "read+set" is implicit from the order:
  the function first reads s2000aa0+0x1c then calls SetOWPlayerNaviPaletteIndex(r0) without further use
  — looks like a one-shot copy from a temp byte.'
- Why sprite 0x80 specifically vs reusing an already-loaded sprite slot — could be the "MegaMan after
  reset" sprite; matching values across the Mr. Weather comp sub_jumptable would confirm.
