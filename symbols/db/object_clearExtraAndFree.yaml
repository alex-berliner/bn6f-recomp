name: object_clearExtraAndFree
address: '0x080B9F00'
kind: function
status: probable
summary: Clears the current battle object's extra-variable flag, then releases the object.
interface: (r0 = battle object, r1...r5 = caller-saved context; r5 = object base) -> r0 = 0; flags caller-saved
details: Sets the byte at `object + oBattleObject_ExtraVars` to zero and passes the object pointer in
  r0 to `object_freeMemory`. The cleanup delegate releases the object's slot, unlinks it from the active
  list, and resets associated sprite state. The function uses r5 to locate the object and supplies r1
  as the ExtraVars field address.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The body stores zero at `[r5,#oBattleObject_ExtraVars]`.; It immediately calls `object_freeMemory`
    with the same object base in r0.; The sole callee is the known battle-object slot release routine.
  refs:
  - bn6f/asm/asm31.s:4171
