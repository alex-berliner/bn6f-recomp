name: SampleFreqSet_814EDC0
address: '0x0814EDC0'
kind: function
status: probable
summary: 'm4a''s SampleFreqSet: turns a sound id''s rate group into pcmDmaPeriod, pcmFreq and divFreq and restarts
  the PCM DMA.'
interface: 'static VsyncOnRegisters sample_freq_set(u32 sound_id) (runs sound_vsync_off

  inside and returns what sound_vsync_on leaves)

  Next sub_814EDC0: in r0 sound id, r4/r5 preserved, lr; out r0 the popped

  return word, r1/r2/r3/r12 from m4aSoundVSyncOn, r4/r5 restored, nz/c/v.

  '
details: 'Bits 16-19 of the id select the rate entry in m4a''s halfword table at

  byte_81C058C (index freq-1); stores go to SoundInfo +0x08, +0x10, +0x0B,

  +0x14, +0x18 in the original''s order, each quotient coming from divsi3.

  divFreq = (16777216/pcmFreq + 1) >> 1. The m4aSoundVSyncOff call first and

  the m4aSoundVSyncOn call last are the ones in the assembly, so the ending

  registers and flags are m4aSoundVSyncOn''s.

  '
