name: pet_recalcCurrentNaviHp
address: '0x0803CF10'
kind: function
status: probable
summary: Recomputes the selected PET navi's 16-bit stat 0x42 as stat 0x3E plus a global modifier, clamped
  to at least 1.
interface: () -> void; no return value, no flags used
details: Gets the currently selected navi via GetCurPETNavi, then reads its u16 stat field 0x3E from the
  navi-stats table. It loads a halfword from the toolkit through the pointer at Unk2004334, adds it to
  that stat, clamps the sum to a minimum of 1, and writes the result back into stat field 0x42 of the
  same navi via SetCurPETNaviStatsHword. The clamp to >=1 strongly suggests this is HP (or an HP-like
  counter) that must never reach zero. The Unk2004334 halfword acts as an additive adjustment (possibly
  negative, since the clamp is needed) held outside the navi-stats table, e.g. a temporary debuff or mode
  modifier.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_803CF10+4: bl GetCurPETNavi then GetCurPETNaviStatsHword(navi, 0x3e) reads the base value;
    sub_803CF10+0xC: ldrh from toolkit->Unk2004334_Ptr->[0] supplies the additive modifier; sub_803CF10+0x12:
    cmp r7,#1 / bge / mov r7,#1 clamps the result to a minimum of 1; sub_803CF10+0x1A: bl SetCurPETNaviStatsHword(navi,
    0x42, r7) stores the result into stat 0x42'
