name: object_panelSlideMovementStep
address: '0x080CE932'
kind: function
status: probable
summary: 'Per-frame update for a battle object sliding horizontally panel-by-panel: it advances X until
  it crosses into the next panel, then re-syncs grid/collision, and once the configured panel count is
  exhausted it hands control to the next action.'
interface: (r5 = battle object ptr, implied) -> updates oBattleObject fields in place; r0 clobbered
details: Runs as an object state-machine step. Each frame it adds oBattleObject_XVelocity to oBattleObject_X
  and, via convertXYToPanelXY, checks whether the object has entered a new column; on crossing it updates
  PanelX in both the object and its CollisionDataPtr and re-registers collision region 1. A countdown
  Timer (reset to 8 frames) gates the panel snap via object_setCoordinatesFromPanels, and a counter in
  oBattleObject_ExtraVars counts remaining panels to travel (ExtraVars+8 acts as an optional wait/hold
  flag checked when Param2 != 0). When the travel counter runs out it sets ExtraVars+0x10 = 1 (an arrival
  flag); then if Param2 != 1 it computes Param3 - remaining as a new value stored at ExtraVars+0xc, sets
  CurAction = 4 and phase = 0 to transition to the next behavior, whereas Param2 == 1 instead calls sub_80E8612
  on the related object with (Param3 - remaining, remaining).
