name: naviAi_dashToPanel
address: '0x080EB2DC'
kind: function
status: probable
summary: 'Navi-AI attack routine: dashes the Navi object toward a pre-set target panel with a decelerating
  velocity, then on arrival changes the panel under it with a landing camera shake and SFX.'
interface: (no args; r5 = battle object struct, r7 = AI state struct) -> void; advances AI script via
  [r7]=8
details: 'A three-state handler keyed on byte [r7,#1]: setup stores velocity 0x88000 into r5+0x48, a 0x23-frame
  timer into [r7,#0x10], and enters state 1. State 1 adds the velocity fields (r5+0x48/0x40/0x44) into
  position fields (r5+0x3C/0x34/0x38), decreasing velocity by 0x8000 per frame, refreshing panels via
  object_setPanelsFromCoordinates/object_updateCollisionPanels; while the displacement hasn''t reached
  0 and the current panel (r5+0x12/0x13) doesn''t match the stored target (r7+0x16/0x17) it clears the
  collision region and sets flag 0x20, and near the end (timer==5) spawns a wide collision region (0x600FF01).
  When the timer expires it commits arrival: calls naviAi_changePanel (stat-probability panel alteration
  under the Navi), copies r5+0x14/0x15 into the current-panel fields, releases the reserved panel, re-establishes
  the collision region, clears flag 0x20, shakes the camera (2, 0xF), plays SFX 0xC0, sets animation 3,
  and moves to state 2. State 2 just counts down its timer, then clears flag 0x40, sets the CURRENTLY_MOVING_1
  flag, and writes 8 to [r7] to run the next AI command.'
