name: battle_scanChipSeq_80295C8
address: '0x080295C8'
kind: function
status: confirmed
summary: Validates a run of consecutive chip codes in the battle buffer against a target and a trailing
  descending sub-sequence pattern, returning the owning chip's data field on success.
interface: battle_scanChipSeq_80295C8(r2=count, r3=data_ptr, r6=buffer_offset, r7=buffer_base) -> (r0,
  r1, nzcv)
details: 'Reads a u16 target code from [data_ptr+4]. First pass verifies `count` consecutive

  u16 entries starting at [buffer_base+buffer_offset] all equal that target; any

  mismatch returns 0. Then advances offset by +8 and reads [buffer_base+r6] as the

  starting value (r0 = value+1) of a descending sub-sequence. Second pass walks

  `count` entries backwards (r6 -= 2 each iteration), checking each equals r0 after

  decrement. Value 0x1A is treated as a single wildcard: if encountered while r0 is

  0x1B it re-derives the expected value from the prior entry [r6-2]+2; otherwise

  it simply substitutes r0-1. More than one wildcard is a failure. A negative

  final r0 is also a failure. On success returns r0 = [data_ptr+2] and r1 = r6-8

  (the scan end position). The data_ptr struct appears to hold at minimum:

  u16 at +2 (owner/result ID), u16 at +4 (expected chip code), u16 at +6 (sequence

  start value). The 0x1A wildcard likely represents a "any" or filler chip slot in

  multi-code sequences (lock chips, program chip sub-codes). Flags on return:

  success sets NZ from r1 and CV from the final CMP(r6, 8); failure zeroes everything.

  '
