    investigate-20261019-030611'
open_questions:
- Contents and origin of unk_2026A00 (which font/charcode table it holds) are unknown
- Callers sub_803C150 and sub_8049DC4 are undocumented, so the exact subsystem (chatbox text vs sprite text) and
  meaning of codes 0xE5/0xE6 are unconfirmed
