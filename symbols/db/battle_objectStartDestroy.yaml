name: battle_objectStartDestroy
address: '0x080B9B58'
kind: function
status: probable
summary: Battle-object state handler that disables the object's collision and switches it to the DESTROY
  state.
interface: (r5 = battle object) -> r0 = CUR_STATE_DESTROY stored to object state; no return value
details: Calls sub_8011044 with r0=2, r1=0xD (likely a fixed sound or effect for this event), then clears
  oCollisionData_Enabled in the object's collision data (via oBattleObject_CollisionDataPtr) so it can
  no longer be hit, and finally sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY,
  transitioning the object into its destruction state. Runs as part of the battle object's state machine
  on r5.
