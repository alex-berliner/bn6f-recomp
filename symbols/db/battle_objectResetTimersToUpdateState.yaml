name: battle_objectResetTimersToUpdateState
address: '0x080E21F8'
kind: function
status: probable
summary: Small battle-object state step that restarts the object's timers and switches it to the update
  state.
interface: (r5 = battle object pointer) -> r0 = CUR_STATE_UPDATE; no flags used
details: 'r5 is an oBattleObject. It stores 1 into Timer, then reads Param2 and stores it into Timer2,
  effectively re-arming a secondary counter whose duration was set earlier in Param2. Finally it writes
  CUR_STATE_UPDATE into the CurState/ActionPhase field, so the object''s normal update routine runs next.
  This looks like the tail of an object''s init/wait state: it behaves like a transition handler that
  commits timing values and moves to the generic update state. No branches or other fields are touched.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strh r0,#1 to [r5,#oBattleObject_Timer] resets the main timer; ldrb/strh copies Param2 into
    Timer2, seeding the wait duration; str CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized
    ends the state switch; tail-call shape (push {lr}... pop {pc}, no bl) fits a state-handler invoked
    via function pointer
