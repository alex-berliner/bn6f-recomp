name: sprite_setupEffect_80A4BFC
address: '0x080A4BFC'
kind: function
status: confirmed
summary: Overworld sprite "setup" handler for an effect/shockwave entity — loads tile/palette, applies Z and layer-effect
  transforms, sets animation/priority/palette, and kicks off the per-frame tick.
interface: 'void sub_80A4BFC(void);

  /* r5  in:  pointer to overworld effect-object (r10, lr inherited from caller; only r5 is meaningful) */

  /* r2  out: clobbered */

  /* r5  out: preserved across the call (caller''s object pointer) */

  /* r6  out: original Z value loaded from obj+0x14 (clobbered; caller observes it) */

  /* r10 out: preserved */

  /* r11 out: clobbered */

  /* clobbers: N Z C V, r0, r1, r3, r6, lr; preserves r4, r5, r7, r8, r9, r12 */

  '
details: 'Writes the "state" byte at obj+0x0 to 3 (the "sprite loaded" sentinel used elsewhere in the

  overworld object lifecycle). Calls sprite_load with tile_count=0x80, tile_slot=byte at

  obj+6, palette_slot=byte at obj+7, then runs the standard post-load chain on the coord

  triple at obj+0xC: checkZCoordModifiers_8031612 produces a Z modifier that is shifted left

  16 and stored at obj+0x14, applyLayerEffectToOWObject_8035694 reads that shifted value,

  and the original obj+0x14 word is then restored (saved into r6, which is why r6 is clobbered

  and ends up holding the unmodified Z for the caller). Continues with sprite_setPriority,

  sprite_setAnimation(byte at obj+4), sprite_loadAnimationData, sprite_noShadow, and

  sprite_setPalette(byte at obj+5), writes the animation-step field at obj+8 to 4, then calls

  sprite_tickWithFlagReset_80A4C46 to begin per-frame ticking. Field layout used: obj+0x0

  state, obj+4 animation id, obj+5 palette id, obj+6 tile slot, obj+7 palette slot,

  obj+8 animation step, obj+0xC coord triple, obj+0x14 Z bias word.

  '
