name: object_countdownAttackStepTimer
address: '0x08109B64'
kind: function
status: probable
summary: Per-object AI state handler that ticks down the attack step timer and leaves the attack state
  when it expires.
interface: (r7 = object record) -> void; flags from the timer decrement
details: Reads the halfword at oAIAttackVars_StepTimer in the object struct pointed to by r7, decrements
  it, and stores it back. If the result is negative (bge not taken), it calls object_exitAttackState to
  end the current attack. Otherwise it simply returns. The word table right after the body lists handler
  addresses including sub_8109B64 itself, indicating this routine is one entry in an object AI/state dispatch
  table rather than being called directly.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh/strh on [r7,#oAIAttackVars_StepTimer] with sub #1 is a simple per-tick countdown (asm
    lines 2-5); bge locret skips the exit call only while the timer is still >= 0 after decrement; bl
    object_exitAttackState runs when the timer runs out, ending the attack; off_8109B74 ends with .word
    sub_8109B64+1 among battle object state handlers, showing it is a dispatch-table entry'
  refs:
  - bn6f/asm/asm31.s:176461
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x08109B64
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-030611'
open_questions:
- No callers are known, so which AI state selects this handler and what sets oAIAttackVars_StepTimer's
  initial value is unconfirmed
- Exact meaning of 'step' in StepTimer (frames per movement step vs. whole attack duration) needs the
  code that writes the field
