name: battle_stepWaitAndSignalRelated
address: '0x080E6850'
kind: function
status: probable
summary: 'Battle-object phase step: signals a related object once (Param3=1), waits 60 frames, then sets
  the object to action 0xC phase 0.'
interface: (r5 = battle object) -> void; no return value
details: Runs each frame for a battle object using r5 as the object pointer. On first entry (PhaseInitialized
  == 0) it writes 1 to the Param3 byte of the object pointed to by RelatedObject1Ptr — a one-shot signal
  to another object — then sets Timer = 0x3C (60 frames, ~1 second) and PhaseInitialized = 4 so the init
  block never re-runs. Each subsequent frame it decrements Timer; while it is nonzero the object just
  idles. When Timer reaches 0 it ends the step by writing CurAction = 0xC and resetting CurPhaseAndPhaseInitialized
  = 0, letting the object's state machine pick the next action.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: init block only runs when ldrb r0,[r5,#PhaseInitialized]; tst r0,r0; bne skips it, and it ends
    by storing 4 to PhaseInitialized (one-shot init); init writes 1 to [RelatedObject1Ptr + Param3], a
    signal flag to another battle object; Timer = 0x3C is stored then decremented each frame with `sub
    r0,#1; bne` — a frame-count delay; on Timer expiry it stores 0xC to CurAction and 0 to CurPhaseAndPhaseInitialized,
    i.e. transitions to the next state; function only touches battle-object fields (PhaseInitialized,
    Timer, CurAction, RelatedObject1Ptr, Param3), confirming a battle-object per-frame handler
  refs:
  - bn6f/asm/asm31.s:102870
  reproduce: python3 tools/asmcat.py 0x080E6850
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- no callers known, so which object type and game situation uses this step (e.g. a boss summoning a helper,
  or a telegraph pause) is unknown
- what action 0xC means in the caller's state machine and what Param3=1 makes the related object do
