open_questions:
- Which battle object/actor uses this handler and what actions 0x14 (and anim 0x12, sound 0xBA) mean in
  its script — needs the object's action table or a caller to identify
- What sub_80BB8B0 does (probably animation restart)
- Why phase value 4 is stored while polling is done via CurPhase == 0 on the next dispatch
