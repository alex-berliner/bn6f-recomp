name: object_lerpPoint
address: '0x080C9B36'
kind: function
status: probable
summary: Returns the point partway along a straight line from (r0,r1) to (r2,r3) at fraction r6/r7, used
  for mid-hop object positions
interface: (r0 = start x, r1 = start y, r2 = end x, r3 = end y, r6 = numerator, r7 = denominator) -> r0
  = interpolated x, r1 = interpolated y; clobbers r2-r3
details: 'Computes dx = r2-r0 and dy = r3-r1, multiplies each by r6 (the progress numerator held in a
  register by the caller), and divides by r7 using BIOS SWI 6 (Div, quotient in r0) once per axis. The
  two quotients are stacked temporarily, then the scaled deltas are added back to the start point and
  returned in r0/r1. It is a generic 2D linear-interpolation helper whose fraction is passed in r6/r7
  rather than on the stack. Quirks: it divides twice with the BIOS routine, so r7 must be nonzero, and
  only the quotient (integer part) of each division is used.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub r2,r2,r0 / sub r3,r3,r1 then mul r2,r6 / mul r3,r6: delta scaled by caller-set numerator
    r6; svc 6 twice (mov r0,r2; mov r1,r7 / mov r0,r3; mov r1,r7): BIOS Div of each scaled delta by denominator
    r7; add r0,r0,r2 / add r1,r1,r3 after pop {r0,r1}: scaled deltas re-added to the start point; caller
    object_hopAcrossPanels interpolates an object''s position between panels over a timed hop, matching
