name: NPCCommand_set_event_flag
address: '0x0809EDEE'
kind: function
status: confirmed
summary: NPC script command that sets an event flag whose id is read from the script.
interface: 'u32 NPCCommand_set_event_flag(u32 r6_script_ptr) // r10: script context, lr: return; returns updated
  script pointer in r6'
details: 'Implements the NPC script opcode "set event flag". r6 points at the opcode byte of the running NPC script;
  the callee reads the halfword at r6+1 via ReadNPCScriptHalfword (which handles unaligned/halfword fetching from
  the script byte stream), passes that value to SetEventFlag to mark the corresponding game event/flag as done,
  and advances r6 by 3 (opcode byte + 2-byte flag id) before returning to the script interpreter. The 16-bit flag
  id is read as an unsigned halfword; SetEventFlag may clobber r0/r1/r3 but only r6 needs to be preserved/returned
  to the interpreter loop.

  '
