name: camera_restartWithScriptHead
address: '0x0809C7A0'
kind: function
status: confirmed
summary: Prepares an 8-byte cutscene camera script head (three 16-bit coordinates packed as byte pairs with a <<4
  shift, plus trigger byte 8) in a global buffer, flags the camera struct for restart, and calls SetCutsceneCameraScript
  to load it.
interface: 'camera_restartWithScriptHead(r5 = camera*): void  /* clobbers r0,r1,lr; sets flags; r2,r3 scratch; r4-r7
  pushed */'
details: "Reads the script-data pointer at [camera+0x04] and saves it to [camera+0x70].\nThe global work buffer\
  \ is byte_20065E0 (8 bytes on the GBA IWRAM).\nFor each of three u32 reads at offsets 0, 4, 8 of the script-data\
  \ pointer,\nthe upper 16 bits are extracted (>>16), shifted left by 4, and stored as a\nlow/high byte pair at\
  \ buffer offsets 1-2, 3-4, 5-6.  Buffer offset 0 is\nzeroed first.  Buffer offset 7 is written with the constant\
  \ 8 (a script\ntrigger / opcode).\nCamera struct fields touched:\n  +0x13 (u8): restart flag, set to 1.\n  +0x3c\
  \ (u32): script-pointer slot, set to the global buffer address.\nFinally calls SetCutsceneCameraScript(r0 = buffer)\
  \ whose r2 result is\ndiscarded.  Returns r0 = 0.\n\nRegister form kept (C call semantics could not work): u32\
  \ camera_restart_with_script_head(u32 camera)"
