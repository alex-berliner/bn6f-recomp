name: battle_pickAllianceRandomPanel
address: '0x08114030'
kind: function
status: probable
summary: Looks up an alliance-dependent panel parameter entry from table byte_8114160 via GetAllianceDependentPanelParamArgs,
  then calls sub_8015C94 to pick a random non-current panel.
interface: (r0 = battle object/panel context) -> r0 = result of random panel picker (panel coords or current
  panel fallback); flags from last callee
details: 'The routine first calls GetAllianceDependentPanelParamArgs with table byte_8114160, which resolves
  an 8-byte panel-effect parameter entry keyed by the battle object''s alliance field and yields a param
  word plus args pointer. It then immediately calls sub_8015C94, the filtered random-panel chooser, which
  rolls GetPositiveSignedRNG % count over the panel list excluding the current panel and decodes x (low
  3 bits) / y (high nibble), returning the current panel as a fallback. No return-value setup of its own
  is visible in the 8 instructions, so it acts purely as a two-step glue routine: parameter lookup then
  random panel selection. This matches panel-area effects that place or change something on a random enemy/alliance-relative
  panel.'
