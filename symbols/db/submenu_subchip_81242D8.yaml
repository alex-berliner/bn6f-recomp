name: submenu_subchip_81242D8
address: '0x081242D8'
kind: function
status: confirmed
summary: 'Sub-chip submenu handler: consumes the selected sub-chip and clamps the cursor when the stack shrinks.'
interface: 'void submenu_subchip_81242D8(struct UnkSubMenu* state /* r5 */);

  // uses: r10, lr in; r5 out preserved; r0-r3, NZCV scratch

  '
details: 'Checks chatbox_mask_eFlags2009F38(0x80); if the chatbox isn''t busy, sets state->field_0x2 = 4,

  reads the sub-chip ID from state->field_0x10 as a u16, calls TakeItem(id, 1) to remove one

  copy from the player''s sub-chip inventory, then calls sub_8124384 (likely the equip/place-on-battle

  selection prompt). Finally, it lowers state->field_0x14 (the cursor) by one but only if the

  decremented value (field_0xC - 1) is less than the current cursor — clamping the cursor into range

  after an entry was removed. Always falls through to sub_8124870, which looks like the sub-menu

  post-step / re-render driver. The "skip if chatbox busy" path is the post-action redraw guard.

  State struct fields used: +0x2 (phase), +0xC (count), +0x10 (selected sub-chip ID), +0x14 (cursor).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
