name: battle_state_finishBattlePhase_80079d0
address: '0x080079D0'
kind: function
status: confirmed
summary: Battle-state phase hook that ends the battle when the battle manager reports it finished, tearing down
  the scene, copying battle structs/stats back, and advancing the state machine to phase 0x0C.
interface: void sub_80079D0(r4=?, r5=battleState*, r6=?, r7=?, r10=?); returns r0=0 (battle not finished) or 0x0C
  (finished, phase advanced); flags NZ reflect r0
details: 'Acts as one phase of the battle state machine driven via sub_8007978. It queries the

  battle-state manager (sub_800B46C) with the magic token 0x12345678 to ask whether the

  battle is finished; the token is loaded from a literal pool (dword_80079EC = 0x12345678).

  If the query returns 0, the function returns immediately with r0 = 0 (NZ set from 0).

  Otherwise it calls sub_800B460 (battle scene teardown) and

  battle_copyStructsIncludingBattleStats_800b2d8 (copies battle structs including the

  battle statistics back), then stores 0x0C into the battle state struct''s phase byte at

  offset 0x02 (oBattleState_Unk_02) of r5 to trigger the follow-up handler, and returns

  with r0 = 0x0C. r4, r6, r7 (and presumably r10) are passed through untouched; the

  register contract lists r4/r5/r6/r7 as both inputs and preserved, with r5 being the

  only one actually read.

  '
