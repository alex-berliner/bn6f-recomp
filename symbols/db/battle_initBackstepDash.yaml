    — writes panel grid coords then resnaps pixel position; bl object_getFrontDirection; mul r1,r0 with
    dword_80B88BC=0x140000; sub from [r5,#0x34] — moves fixed-point x 20px opposite the facing direction;
    0x280000/0x6aaaa*dir/0xd5555 stored to +0x3c/+0x40/+0x48 — fixed-point motion velocity constants,
    one signed by facing; strh #3,[r5,#0x20]; strb #3,[r5,#0x10]; strh #0,[r5,#0xa] — resets counters/phase
    fields for the new state'
