name: battle_initBackstepDash
address: '0x080B87AC'
kind: function
status: probable
summary: 'Conditional (mode==4) step-back setup: stores panel coords and an extra param, refreshes pixel
  position, shifts fixed-point x 20px opposite facing, loads three motion constants, and transitions the
  object to state 3 (+0x20/+0x10) with mode byte 8.'
interface: (r0 = battle object, r1 = value for field 0x2c, r2/r3 = panel x/y) -> void; no return value
details: Only runs when the object's byte at +9 equals 4 (some prior mode); otherwise it returns immediately.
  It stores r1 at +0x2c and r2/r3 as panel grid coordinates at +0x12/+0x13, then calls object_setCoordinatesFromPanels
  to refresh pixel position. It multiplies object_getFrontDirection (+1/-1 by alliance) by 0x140000 (20.0
  in 16.16 fixed point) and subtracts it from field +0x34, moving the object's fixed-point x 20px opposite
  its facing. It then sets +0x3c = 0x280000 (40.0), +0x40 = 0x6aaaa (6.67) * direction, and +0x48 = 0xd5555
  (13.33) — signed horizontal velocity and related motion constants. Finally it writes state 3 to halfword
  +0x20 and byte +0x10, sets byte +9 to 8 and halfword +0xa to 0, switching the object into a new movement/attack
  state.
