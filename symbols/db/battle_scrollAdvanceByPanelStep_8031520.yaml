open_questions:
- The exact meaning of r12's two bits (panel-reached vs wedge-crossed) is inferred from the callee descriptions;
  confirming the bit usage would require seeing how sub_8030BFC consumes r12.
- r1/r5 role is opaque — likely the scroll-step table pointer / packed pair, but the assembly doesn't
  dereference them here.
