name: map_resolveTileAddress_8142DA0
address: '0x08142DA0'
kind: function
status: confirmed
summary: Resolves a map tile's RAM address by offsetting a base pointer up or down by a row/column delta
  derived from the current tile index.
interface: u32 resolve(u32 baseAddr /*r0*/) -> r0 = adjusted tile address; preserves r5 = tile-state ptr
details: 'Reads the 1-byte map width from *(eMapTilesState200be70). Reads the tile index byte from *(unk_2000B40
  + 0x9). If the index >= 0x80 the tile is "forward" in the scroll buffer; otherwise it is "backward."  The
  delta is |index - 0x80|.  The byte offset is computed as ((delta * 2 * width + delta * 4) << 1), i.e.
  each delta unit advances by (2*width+4)*2 bytes, consistent with a 2-byte-per-tile row stride of width*2
  plus a 4-byte per-tile header, doubled for a second tile-plane. The result is added to (forward) or
  subtracted from (backward) the caller-supplied base address in r0.  r5 (the tile-state pointer) is deliberately
  preserved in r5 for the caller''s subsequent use.

  '
