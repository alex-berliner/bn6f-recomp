name: battle_spawnObj27LinkedToR5
address: '0x080C0098'
kind: function
status: probable
summary: Spawns battle object type 0x27 and links it to the given object (copies its alignment/flip and
  sets its linked flag).
interface: (r5 = source BattleObject ptr, r0 = spawn args) -> r0 = new BattleObject ptr (or 0 on failure);
  flags from spawn call.
details: Calls object_spawnType1 with id 0x27 and four more args, then on success (beq on the returned
  flags) stores r5 into oBattleObject_RelatedObject1Ptr of the new object, copies the source's oBattleObject_AllianceAndDirectionFlip
  halfword into the new object, and ORs 0x4 into oObjectHeader_Flags. r0's pointer is moved to r5 before
  the branch, so the success path operates on the new object. Failure skips all linking and just pops.
  The untyped spawn arguments and the meaning of flag 0x4 are inferred only from field names.
