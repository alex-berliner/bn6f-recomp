open_questions:
- What menu/task owns r5 and what state 0x20 displays (help screen, info popup, etc.) — callers sub_812D690/sub_812D748
  and sub_812D6F8 would show the state table
- Meaning of the halfword at r7+0x34 that gets cleared on open
- How the final tst Z flag result is consumed by the callers
- 'The summary and flow are correct: START toggles the 0x20 subscreen state on/off, with B also closing
  it, saving state to [r7,#0xd] and playing SOUND_MENU_SELECT/SOUND_EXIT_SUBMENU. The ''not handled''
  flag is set via tst r0,r0 at loc_812D742 (only reached when neither START nor B triggered and state
