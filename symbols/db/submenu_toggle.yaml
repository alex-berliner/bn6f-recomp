name: submenu_toggle
address: '0x0812D700'
kind: function
status: probable
summary: 'Per-frame handler that toggles a menu subscreen (state 0x20): START opens or closes it, B also
  closes it, otherwise reports not-handled via Z flag.'
interface: (r5 = menu work struct, r7 from callee = related struct) -> r0 untouched (returns via Z flag
  from final tst); side effects on state byte and sounds
details: Calls sub_812D6F8 to fetch a struct pointer in r7, then checks START. If START is pressed and
  the state byte [r5,#2] equals 0x20, it restores the saved state from [r7,#0xD] and plays SOUND_EXIT_SUBMENU
  (closing the subscreen); otherwise it saves the current state byte to [r7,#0xD], sets [r5,#2]=0x20,
  clears the halfword [r7,#0x34] (likely a cursor/scroll reset), and plays SOUND_MENU_SELECT (opening
  it). While in state 0x20 without START, pressing B also closes it the same way. If not in state 0x20
  and START/B unused, it returns with Z set via `mov r0,#0; tst r0,r0`, apparently reporting 'not handled'
  to the caller through flags rather than r0.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#2] / cmp r0,#0x20 gates all branches: 0x20 is a special menu state; state byte
    saved/restored symmetrically between [r5,#2] and [r7,#0xD] on open/close; PlaySoundEffect with SOUND_MENU_SELECT
    on open and SOUND_EXIT_SUBMENU on close; IsButtonPressed(JOYPAD_START) opens/toggles, IsButtonPressed(JOYPAD_B)
    closes while in state 0x20; strh r0,[r7,#0x34] zeroes a halfword only on open, consistent with resetting
    a scroll/cursor field'
