name: pet_getCurNaviChainedLookup_800A4E0
address: '0x0800A4E0'
kind: function
status: probable
summary: Fetches a per-navi value for the currently equipped PET navi via a two-step table lookup, returning 0xFF
  when the battle is in mode 1.
interface: u32 pet_getCurNaviChainedLookup_800A4E0(void) -> r0 (value or 0xFF); r1/r3 also hold leftovers from the
  second sub_800A540 call; preserves r4/r6, clobbers flags
details: 'First calls GetBattleMode; if the battle mode is 1 (some special/extra mode) it immediately returns 0xFF,
  which likely acts as an ''invalid / none'' sentinel for callers. Otherwise it obtains the navi ID currently equipped
  on the PET via GetCurPETNavi (r4). It then performs a chained lookup through sub_800A540, which appears to be
  a byte getter of the form sub_800A540(naviId, key) reading some per-navi data table: first it requests key 0x2D
  for this navi, then uses that result as an offset, requesting key (0x2E + result) for the same navi. The final
  r0 (and r1, as left by sub_800A540) is returned to the caller. The r4 listed as an input is not actually read
  before being overwritten with the navi ID; it is only pushed/popped for preservation. Flags are clobbered by the
  cmp and the calls. The 0x2D/0x2E key pair suggests an entry in a navi stat or Cross/Beast-related table where
  entry 0x2D selects an index and 0x2E+index holds the actual value.

  '
