summary: 'Cybercrow "pecked" cutscene helper: on the object''s +4 state trigger it sets a 0x3C (60) frame countdown
  at +0x70+0 and then, once per frame while it runs, rolls GetRNG & 0xFF (re-rolling while the high nibble matches
  the stored value at +0x70+0xC).'
details: 'Body (asm24.s): +4 gate, strb 1 to [r5,#4], countdown [r7,#4] init 1 with [r7,#0xC] = ~0 and [r7] = 0x3C,
  [r7,#8] = 0xC; each expiry: ReadOWPlayerObjectCoords and the GetRNG & 0xFF / lsr 5 / cmp loop.'
