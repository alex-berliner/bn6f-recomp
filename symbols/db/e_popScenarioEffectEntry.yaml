  date: '2026-10-19'
  detail: 'sub_8142224: ldr r4,[r5,#0x28]; sub r4,#1; blt loc_8142238 - count at +0x28 acts as stack depth,
    empty means return 0; sub_8142224: lsl r4,r4,#2; add r4,#0x2c; ldr r6,[r5,r4] - element read from
    array at +0x2C indexed by decremented count (top of stack); caller 0x0808999C: bl sub_8142224; tst
    r0,r0; beq ... - result tested as entry/nonempty flag; caller 0x0808999C: nonzero path does bl ow_dealDamageToCurrentNavi
    - popped entry is used as a damage payload; caller empty path: bl e_clearScenarioEffectStateFlag and
    sets 0x1E/0x54 timers - empty stack means no pending effect to apply'
