name: e_popScenarioEffectEntry
address: '0x08142224'
kind: function
status: probable
summary: Pops the most recent entry off the scenario-effect state's LIFO stack (0-based count at +0x28,
  entries at +0x2C), returning it, or 0 if the stack is empty.
interface: () -> r0 = popped entry (0 if empty); flags from tst on r0 (Z set when empty)
details: Reads the stack count at eScenarioEffectState+0x28 and decrements it; if it goes below 0 nothing
  is popped (count not stored back, r0 = 0). Otherwise the decremented count is stored back and used as
  an index into the 4-byte-per-entry array at +0x2C, whose top element is returned. The caller in the
  battle update uses a nonzero result as a value passed into ow_dealDamageToCurrentNavi, so entries appear
  to be pending damage/effect payloads; on empty it instead sets ai data unk18 to 0x1E, stores 0x54 at
  [r5], and clears a scenario-effect flag, i.e. waits/retries on a timer.
