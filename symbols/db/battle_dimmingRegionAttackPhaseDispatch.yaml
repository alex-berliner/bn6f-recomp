name: battle_dimmingRegionAttackPhaseDispatch
address: '0x080BECF0'
kind: function
status: probable
summary: Dispatches the dimming-region attack effect's handler for the battle object's current phase (attack
  update vs. its cleanup/second phase).
interface: (r5 = battle object (global), r0 unused) -> tail-call to handler table[CurPhase] with r0 =
  phase, no return value of its own
details: 'Reads byte oBattleObject_CurPhase from the battle object pointer kept in r5, uses it to index
  off_80BED04, and does mov lr,pc; bx to call the selected thumb handler. Table has exactly two entries:
  battle_dimmingRegionAttackUpdate+1 for phase 0 and sub_80BEDCC+1 for phase 1. It then pops {pc}, so
  handlers return directly to this function''s caller. The +1 on both table entries confirms thumb handlers.
  Since no caller is known, r5 being the battle object is inferred from the oBattleObject_ field access.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0]; bx r1 = phase-indexed handler dispatch;
    off_80BED04 holds battle_dimmingRegionAttackUpdate+1 and sub_80BEDCC+1, tying this to the dimming-region
    attack effect; phase is passed on in r0 to the handler, matching an update(currentPhase) handler signature
  refs:
  - bn6f/asm/asm31.s:14952
  reproduce: python3 tools/asmcat.py 0x080BECF0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112'
