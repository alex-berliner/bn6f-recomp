name: ai_updateAttackHoldState
address: '0x080F8B20'
kind: function
status: confirmed
summary: Per-frame update for an AI attack hold — starts the hold (sets attack element state, attack animation,
  duration timer) or counts it down and exits the attack state when it expires.
interface: void ai_updateAttackHoldState(u32 r1_pass, BattleObject* r5 obj, u32 r6 passThrough, AIAttackVars* r7
  vars) -> r1 (pass-through on early return, whatever object_exitAttackState left on expiry)
details: "r7 points at the AI attack variables block, r5 at the owning battle object,\nand r6 is passed through\
  \ untouched to object_exitAttackState.\n\nIf vars->AttackElement (byte, oAIAttackVars_AttackElement) is 0, no\
  \ attack\nis in progress, so begin one:\n  - AttackElement = 4 (active/hold state marker)\n  - obj->CurAnim (oBattleObject_CurAnim)\
  \ = 7 (the attack animation)\n  - StepTimer (16-bit) = AttackDuration (16-bit)\nand return immediately (r1 untouched\
  \ by this function).\n\nOtherwise the hold is running: decrement StepTimer (16-bit store, but the\ncomparison\
  \ is done as a signed 32-bit value, so a stored 0xFFFF wrap would\nread as negative and still exit). While the\
  \ result is > 0, keep holding.\nWhen it reaches 0 or below, call object_exitAttackState (r5/r6/r7 passed\nthrough)\
  \ and return its r1 to the caller.\n\nFlags nzcv are clobbered (tst/sub/bgt) but no caller contract depends on\n\
  them. No registers other than r1 are meaningful outputs.\n"
