name: initUncompSpriteState_80028d4
address: '0x080028D4'
kind: function
status: confirmed
summary: Initializes the 0x50-byte uncompressed-sprite work block at byte_200DCA0, recording the sprite data pointer
  and pre-filling its tables before a sprite is decompressed into it.
interface: void resetUncompSpriteWorkBlock_80028d4(const void *spriteData /* r0 */); // preserves r3, r5; r2/r3/r5
  and carry/overflow read back by callers (r2 ends as 0xFF, flags from the last ByteFill)
details: "Takes a pointer (r0) to the source sprite data and resets the per-sprite\nwork block at byte_200DCA0 so\
  \ a later decompression step can fill it:\n  - zeroes the whole 0x50-byte block with ZeroFillByWord,\n  - stores\
  \ the sprite data pointer at block+0x4C (dword_200DCEC) so the\n    state remembers which sprite it belongs to,\n\
  \  - fills the 0x18-halfword table at block+0x04 with 0x7FFF (built\n    in code as ~(0x80<<24) >> 16; likely\
  \ per-entry \"no value\" markers,\n    possibly OAM/affine or attribute indices),\n  - fills the 0x30-byte buffer\
  \ at block+0x1C with 0xFF (likely a\n    tile/pixel buffer primed to transparent/background color 0xFF).\nr0 is\
  \ spilled to the stack around the first fill call; r3 and r5 are\npreserved. The 0x30-byte buffer plus surrounding\
  \ fields up to 0x4C make\nup the rest of the record, presumably filled in by the decompression\nroutine that follows.\n"
