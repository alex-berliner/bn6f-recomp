name: battle_frontPanelAttackPhase
address: '0x080BD6B6'
kind: function
status: probable
summary: 'Two-stage attack phase handler: on entry sets CurAnim/Copy=5, spawns a t1 kind 5 temp attack
  object, plays SFX 0xB0, sets Timer=10, and marks PhaseInitialized=4. When timer hits 5 it spawns a dimming
  collision region (Element + DamageAndStaminaDamageCounterDisabler) on the panel in front and a t1 kind
  0 effect at that panel''s coords shifted by (getFlip<<8)+0x27, shakes the camera (mag 1, dur 10), and
  spawns an ExtraVars object. Timer counts down to 0, then CurPhaseAndPhaseInitialized is cleared.'
interface: (r5 = battle object) -> void; clobbers r4/r6/r7, no return value
details: This is a two-stage phase handler keyed off oBattleObject_PhaseInitialized. On entry it sets
  CurAnim/CurAnimCopy to 5, spawns a temp attack object (t1 kind 5), plays SFX 0xB0, sets Timer to 10,
  calls sub_80BDA7C(5) to pick a follow-up state, and marks the phase initialized (state 4). When the
  timer reaches 5 it computes the panel directly in front via object_getFrontDirection plus PanelX, calls
  object_spawnDimmingCollisionRegion with the object's Element and DamageAndStaminaDamageCounterDisabler
  data, spawns a t1 kind 0 effect at that panel's screen coordinates flipped by object_getFlip plus 0x27
  pixels, triggers a camera shake (magnitude 1, duration 10), and spawns an ExtraVars object (kind 0xA)
  holding the temp attack object pointer (r7 = obj+0x68). The timer then counts down and on zero the whole
  CurPhaseAndPhaseInitialized is reset to 0.
