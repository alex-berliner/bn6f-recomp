    and anim 5 shows a telegraphed attack startup; object_getFrontDirection + PanelX/PanelY fed to object_spawnDimmingCollisionRegion
    shows the hit lands on the panel in front of the object; object_getFlip result *0x100 + 0x27 passed
    with object_getCoordinatesForPanels into spawn_t1_0x0_EffectObject positions a flip-aware effect at
