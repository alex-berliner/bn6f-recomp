name: battle_objectTimerWaitState
address: '0x080D86D2'
kind: function
status: probable
summary: Battle-object state that waits 60 frames, then either destroys the object (clearing a related
  object's flags) or continues to action 8 phase 0.
interface: (r5 = battle object; r0 unused) -> r0 = nothing; object fields Timer, PhaseInitialized, CurState/CurAction,
  oObjectHeader_Flags of RelatedObject1 modified
details: 'On first run (PhaseInitialized == 0) it sets oBattleObject_Timer to 0x3C (60 frames) and marks
  the phase initialized with value 4. Each call it decrements Timer and returns while it is still >= 0.
  When the timer lapses, it reads oBattleObject_Param2: if 0xFF, it writes 0 to oObjectHeader_Flags of
  the object pointed to by oBattleObject_RelatedObject1Ptr and sets its own state word to CUR_STATE_DESTROY
  (destroying itself); otherwise it sets CurAction = 8 and CurPhase = 0 to move to the next action. The
  use of r5 instead of r0 for the object pointer is a quirk, matching other state-handler-style routines.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb PhaseInitialized / strh #0x3C to Timer seeds a one-shot 60-frame countdown (sub_80D86D2
    start); Timer decrement with bge locret keeps the object waiting until it hits 0xFFFF; Param2 == 0xFF
    branch clears RelatedObject1Ptr''s oObjectHeader_Flags and sets CUR_STATE_DESTROY; otherwise strb
    #8 to CurAction and strh #0 to CurPhaseAndPhaseInitialized advance to the next action'
  refs:
  - bn6f/asm/asm31.s:71444
  reproduce: python3 tools/asmcat.py 0x080D86D2
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
