name: battle_queuePartyObjectSprites
address: '0x080C9ECE'
kind: function
status: probable
summary: Queues OAM entries for all eight battle party objects (player + allies / enemies) so they render
  this frame.
interface: (r0 = tool record with r10 base, r1 = unused, r2 = unused) -> void
details: Loads the BattleState pointer from the tool record at offset oToolkit_BattleStatePtr, then indexes
  the BattleObjectList array starting there. It iterates through 8 entries, calling battle_queueObjectSprite
  for each object (which updates its animation state and queues its sprite at the object's x/y, skipping
  null/hidden objects), advancing the iterator by one object record (4 bytes — likely an array of pointers,
  so +4 == next pointer slot). Used to drive the OAM refresh of all party-side battle objects in one call.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 'Iterates exactly 8 entries via r3=8..0 (`mov r3, #8`, `sub r3, #1`, `bne loc_80C9EDA`), matching
    an 8-member BattleObjectList.; Each iteration calls battle_queueObjectSprite (known summarizer for
    per-object OAM queue) at `bl battle_queueObjectSprite`.; Pointer advance `add r0, #4` matches an array
    of 4-byte object pointers within the BattleState struct.; BattleState is reached via oToolkit_BattleStatePtr
    -> oBattleState_BattleObjectList, consistent with other battle-side helpers.'
  refs:
  - bn6f/asm/asm31.s:40981
  - 0x080C9EE6 battle_queueObjectSprite
  reproduce: python3 tools/asmcat.py 0x080C9ECE
  result: 'proposed by minimax/MiniMax-M3, self_score 4; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-004802'
open_questions:
- Exact meaning of args r1/r2 — likely scratch/return values tied to its one caller; without any known
  call sites we can't pin them down.
- Whether the 8 includes only the player party (and the 7 enemy slots are updated separately) or all 8
  battle object slots.
