name: object_collectFilteredPanelsToFlags
address: '0x080E8C84'
kind: function
status: probable
summary: Zeros the 0x28-halfword panel flag table at r5+0x64, fetches a version-dependent panel filter
  via GetAllianceDependentPanelParamArgs2, runs object_getPanelsFiltered into a stack buffer, then per
  byte calls sub_80E8CC4 with the low 3 bits and high nibble to populate the table, returning 1 if any
  panel matched.
interface: (r5 = object/work struct; r0-r2 = filter args from GetAllianceDependentPanelParamArgs2) ->
  r0 = 1 if any matching panels, else 0
details: Zeroes 0x28 halfwords at [r5+0x64], a per-panel flag/value table. It passes &byte_80E8D6C to
  GetAllianceDependentPanelParamArgs2 and feeds its result (r0-r2) to object_getPanelsFiltered, which
  writes panel descriptor bytes into a 0x20-byte stack buffer (r7 = sp) and returns the count. For each
  byte it splits low 3 bits into r0 and the high nibble into r1 and calls sub_80E8CC4, which can still
  see r4 = r5+0x64 and presumably sets an entry of the table for that panel. Returns 1 if at least one
  panel was found, 0 otherwise; r6 is used purely as a loop counter.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl ZeroFillByHalfword with r0=r5+0x64, r1=0x28 clears the destination table before use; r7=sp
    before object_getPanelsFiltered and r3=sp after show the panel list is built on the stack; lsr r1,r0,#4
    / lsl+lsr 0x1d split each list byte into high-nibble and low-3-bit fields passed to sub_80E8CC4; r4=r5+0x64
    kept live across the bl, so sub_80E8CC4 writes into the zeroed table; r0=1 after the loop vs fall-through
    with r0=0 gives a found/none boolean return
  refs:
  - bn6f/asm/asm31.s:106388
  - 0x080E8BF8 sub_80E8BF8
  - 0x0800EC48 GetAllianceDependentPanelParamArgs2
  - 0x080008C0 ZeroFillByHalfword
  - 0x0800CEA0 object_getPanelsFiltered
  reproduce: python3 tools/asmcat.py 0x080E8C84
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is essentially correct: it zeroes 0x28 halfwords at r5+0x64 via ZeroFillByHalfword,
    calls GetAllianceDependentPanelParamArgs2 then object_getPanelsFiltered, then loops splitting each
    byte into low 3 bits (r0) and high nibble (r1) calling sub_80E8CC4 with r4 still set to r5+0x64. The
    return is 1 if count > 0 else falls through with r1=1 then sets r0=1 and returns (note r1 is set to
    0 before pop so r1 is not the return). The prefix is better captured as ''object'' since it operates
    on an object''s panel-flag table, not a battle-scoped operation.; run wf investigate investigate-20261018-235109;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- What sub_80E8CC4 writes into the [r5+0x64] table (flag vs value) and its field layout
- What panel filter GetAllianceDependentPanelParamArgs2 with byte_80E8D6C selects, and why it is version/alliance-dependent
- What r5 refers to (battle entity vs other struct) — the caller sub_80E8BF8 would confirm
- 'The summary is essentially correct: it zeroes 0x28 halfwords at r5+0x64 via ZeroFillByHalfword, calls
  GetAllianceDependentPanelParamArgs2 then object_getPanelsFiltered, then loops splitting each byte into
  low 3 bits (r0) and high nibble (r1) calling sub_80E8CC4 with r4 still set to r5+0x64. The return is
  1 if count > 0 else falls through with r1=1 then sets r0=1 and returns (note r1 is set to 0 before pop
  so r1 is not the return). The prefix is better captured as ''object'' since it operates on an object''s
  panel-flag table, not a battle-scoped operation.'
