summary: Per-frame folder/chip-page background tile uploader for the battle custom-screen/submenu scene
  (writes five tile blocks via CopyBackgroundTiles, depending on the submenu scroll index at object+0x18).
interface: '(r5 = submenu/BattleObject-like struct with u16 anim/id at +0x24 and s16 scrollIndex at +0x18)
  -> r0 = 0x1c ; side effects: BG tile blocks 2/1/2/1/2 at column offsets derived from scrollIndex; queue/decompress
  folder chip GFX; queue u16 tile-id writes.'
details: "- `mov r7, r5`; loads `r0 = u16 [r7+0x24]` (the anim/folder-set field) and three EWRAM pointers\
  \ (`word_202A020`, `unk_2034458`, `byte_813317C`) and dispatches five build-and-blit passes that fill\
  \ 8x14 tile-id buffers in EWRAM then DMA them to VRAM BG.\n  - Pass 1: `sub_81200EC` builds the first\
  \ buffer `unk_2034458` (unpacked chip-pack tile ids), `CopyBackgroundTiles` copies at column `0xf -\
  \ scrollIndex`, i=4 rows, tileBlock32x32=2, j_size=8, i_size=0xe.\n  - Pass 2: `battle_loadFolderChipGfx_8120390`\
  \ builds `unk_2034538` for folder chip GFX into VRAM `0x6007200`; blits at column `0xd - scrollIndex`,\
  \ i=4 rows, tileBlock32x32=2, j_size=2, i_size=0xe.\n  - Pass 3: `sub_81203E4` packs chip-slot list\
  \ from a (0xa << 12) | 0x35c = 0xa35c chip-pack row into `unk_2034570` and uploads to VRAM `0x6006b80`;\
  \ blits at column `0x17 - scrollIndex`, i=4 rows, tileBlock32x32=2, j_size=2, i_size=0xe.\n  - Pass\
  \ 4: `sub_8120458` builds `unk_20345A8` from (0xb << 12) | 0x216 = 0xb216 chip-pack row; blits at column\
  \ `0x19 - scrollIndex`, i=4 rows, tileBlock32x32=1, j_size=1, i_size=0xe.\n  - Pass 5: `sub_81204C4`\
  \ builds `unk_20345C4` from (0x9 << 12) | 0x34f = 0x934f chip-pack row; blits at column `0x1a - scrollIndex`,\
  \ i=4 rows, tileBlock32x32=2, j_size=2, i_size=0xe.\n  - After the five blits, computes `r4 = scrollIndex\
  \ - [r7+0x1a]` (the bottom scrollIndex), branches: if `r4 >= 0` and column differs, calls `call_sub_3005EBA`\
  \ for that column with sizes (1,2,0,0x10) -- this is a \"blur/swap rectangles\" effect that compares\
  \ the two scroll indices.\n  - If `r4 < 0` (bottom > top), runs two `call_sub_3005EBA` calls -- first\
  \ for column `0xb - r1 - r4` with sizes (2,2,0,2), then for column `0xd - r1 - r4` with sizes (4,2,0,0xe);\
  \ these blit a column of cells that just entered the visible area in the animated scroll.\n  - `r0 =\
  \ 0x1c` on exit is the standard \"I took a frame, return 0x1c to the per-frame stepper\" sentinel seen\
  \ across the battle/scene object suite.\n  - Uses `r10` (= Toolkit) only implicitly through callees\
  \ (`battle_loadFolderChipGfx_8120390` etc.); the function reads scroll/anim from the `r5`-passed object\
  \ and writes BG via `CopyBackgroundTiles` and `call_sub_3005EBA`.\n"
