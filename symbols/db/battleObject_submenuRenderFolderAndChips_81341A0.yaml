    sizes 8xE, 2xE, 2xE, 1xE, 2xE))` triplets at lines 81341B0..813426A show it is a tile-blitter driven
    by `[r5+0x18]`. - Loaders `sub_81200EC`, `battle_loadFolderChipGfx_8120390`, `sub_81203E4`, `sub_8120458`,
    `sub_81204C4` are all "build a u16 tile-id buffer in EWRAM from a chip-pack row" helpers (their contracts
    in the prompt match that role). - Branch at `blt loc_8134298` followed by the mvn/add/sub math shows
    it is computing a delta between the two scroll indices stored at `r5+0x18` and `r5+0x1a`; the rect
    blits via `call_sub_3005EBA` are clearly an animated scroll transition. - `r0 = 0x1c` is the per-frame
    return sentinel that `battle_objectUpdate_8133400` (and siblings) interpret as "stepped a frame";
