name: object_updateCollisionAndResolveCleared_8014606
address: '0x08014606'
kind: function
status: confirmed
summary: Flags the object for collision (0x30), rebuilds its collision geometry with NoCustom+ awareness,
  and invokes a secondary collision-resolution handler when the object's status dword is zero.
interface: object_updateCollisionAndResolveCleared_8014606(u32 r4, u32 r5 /*object ref*/, u32 r6 /*object
  base*/, u32 r10, u32 lr) -> {r0-r7, nz, c, v, lr}
details: "1. Calls object_setFlag1(0x30, r5) to mark the object with collision flag 0x30.\n2. Calls battle_IsNoCustomPlusActive_80107C0;\
  \ the result in r3 is forwarded into\n   the collision update, so the rebuild is aware of NoCustom+\
  \ mode.\n3. Calls object_updateCollisionData(r1=0x10, r2=2, r3, r5) to regenerate the\n   object's collision\
  \ geometry (type 0x10, mode 2).\n4. Computes r7 = r6 + 0x40 and loads the 32-bit status word at that\
  \ offset.\n   If status != 0 the function returns immediately with the comparison flags\n   (N/Z from\
  \ the loaded value, C=1, V=0).\n   If status == 0 it delegates to sub_80E1620, passing r1-r4 from the\
  \ collision\n   update, r5 (object ref), and r7 (the status-dword address). All register and\n   flag\
  \ outputs come from that callee.\nFields touched: object block at r6+0x40 (status dword), object flag\
  \ field (0x30\nvia object_setFlag1), collision geometry (via object_updateCollisionData).\nThe caller's\
  \ r4 is preserved into sub_80E1620 on the zero-status path but is not\nread on the non-zero path.\n"
