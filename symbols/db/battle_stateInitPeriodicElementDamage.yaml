name: battle_stateInitPeriodicElementDamage
address: '0x080E82C0'
kind: function
status: probable
summary: Battle-object state entry that initializes the periodic element-damage effect (20-frame tick,
  11 ticks, phase 4) and runs its first step.
interface: (r5 = battle object) -> r0 = result of battle_statePeriodicElementDamage; flags from callee
details: This looks like a per-state handler for a battle object held in r5. It stores Timer2 = 0xB (11,
  likely the number of 20-frame damage ticks the effect lasts), Timer = 0x14 (20 frames, matching the
  callee's damage period), and sets the object's phase field to 4 (marking the state as entered/initialized).
  It then tail-calls into battle_statePeriodicElementDamage, which deals element damage with sound 0xB7
  every 20 frames until the effect ends and destroys the object. Given the known callee behavior, the
  stored values are exactly the timing parameters that state uses.
