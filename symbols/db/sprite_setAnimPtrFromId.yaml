name: sprite_setAnimPtrFromId
address: '0x080A6E50'
kind: function
status: probable
summary: Interpreter opcode handler (0x24/0x25) that resolves an id byte through a pointer table and stores
  the resulting pointer into the sprite work struct.
interface: (r0 = id byte from struct, r1 = pointer table) -> r0 = pointer stored at [r5,r6]; flags clobbered
  by cmp
details: 'r6 is the opcode index passed by the caller''s dispatch: 0x24 takes the id byte at struct+4
  and indexes PtrTable_80A6050, anything else (0x25 path) takes struct+5 and indexes off_80A619C. The
  chosen table entry (word-sized, indexed id*4) is stored at [r5, r6], so each opcode writes the pointer
  into the struct field at its own offset (0x24 or 0x25). The routine is a tail helper (mov pc, lr) shared
  by two dispatch sites. The two id bytes likely hold the current animation/graphic id, and the tables
  map those ids to animation or frame-data pointers. Only r0/r1 setup differs between the two opcode cases;
  all addressing is through r5 and r6.'
