name: chatbox_F3_control
address: '0x08041C54'
kind: function
status: confirmed
summary: Text-script F3 opcode handler that shows or hides the chatbox, optionally with an explicit box length.
interface: 'int chatbox_F3_control(r1, r2, /*r4*/ const u8 *scriptPtr, lr); // r4 in/out: advanced past the opcode;
  returns 1 in r0, clobbers r0/r1(=arg)/r2(=arg)/lr and NZCV, preserves r1/r2 across the body'
details: "Part of the chatbox/text-script interpreter: r4 points at the current script\nopcode record, whose byte\
  \ [r4+1] is the F3 subtype.\n  - subtype 0: show the chatbox at full size, calling\n    chatbox_set_eFlags2009F38(0x40);\
  \ advances r4 by 2 bytes.\n  - subtype 1: hide the chatbox, calling chatbox_clear_eFlags2009F38(0x40);\n    advances\
  \ r4 by 2 bytes.\n  - subtype 2 (and any other value, by fallthrough of the two BEQs): show the\n    chatbox with\
  \ the length taken from byte [r4+2], passed to\n    chatbox_set_eFlags2009F38; advances r4 by 3 bytes.\nAlways\
  \ returns 1 in r0 (success/continue signal to the script dispatcher).\nThe eFlags2009F38 helper presumably writes\
  \ a chatbox geometry/visibility\nfield; 0x40 is the default full box length. Quirk: only subtypes 0-2 are\ndistinguished,\
  \ but anything >= 3 behaves like subtype 2 (reads [r4+2] anyway).\n"
