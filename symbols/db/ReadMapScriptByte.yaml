name: ReadMapScriptByte
address: '0x08036094'
kind: function
status: confirmed
summary: Reads one byte of the current map script stream at (script pointer + offset) into r4.
interface: (r7 scriptPtr, r6 offset, lr) -> r4 byte, NZCV set by the pointer add; r7 preserved
details: 'Trivial map-script fetch: computes scriptPtr + offset (add r7, r7, r6), loads the byte at that address
  with ldrb into r4, and returns. r7 is saved/restored, so the caller''s script pointer is unchanged; the offset
  is supplied in r6 and consumed. The add sets NZCV, so callers can in principle branch on the pointer computation,
  though that is almost certainly incidental. No other registers or memory are touched. Likely used as the primitive
  behind opcode decoding / immediate fetches in the map script interpreter, with r6 acting as the read cursor or
  opcode operand index.

  '
