name: sub_813677C
address: '0x0813677C'
kind: function
status: hypothesis
summary: Copies 8 bytes from the battle state buffer at 0x2022B70 into the work buffer at 0x2000090.
interface: void sub_813677C(void)
details: Trivial wrapper around CopyBytes (u8 *src, u8 *dest, int count) with a fixed count of 8. Source is unk_2022B70
  (an IWRAM battle/state slot), destination is unk_2000090 (IWRAM work buffer). Takes no arguments and returns nothing;
  only lr is read on entry, and r0-r3 plus flags are clobbered via the tail work of CopyBytes. The meaning of the
  8-byte block is not established from this function alone; the name is a guess based on the source buffer appearing
  to be battle-related state.
