name: object_timerWaitAdvancePhase8
address: '0x080CDB2C'
kind: function
status: probable
summary: Battle-object phase step that counts down a frame timer and, on expiry, sets a sprite field,
  plays sound 0xC1, reloads the timer with 60, and moves the object to phase 8.
interface: (r5 = battle object ptr, r0 unused) -> r0 = 8 after trigger, else timer-decrement result; sets
  oBattleObject_CurPhase
details: 'Standard battle-object state handler: decrements the halfword at oBattleObject_Timer and returns
  until it reaches zero. On expiry it calls sprite_setUnk0x2c with 0x2C000000 (packed sprite-field write,
  probably animation/display bits in the high byte 0x2C), reloads oBattleObject_Timer with 0x3C (60 frames)
  for the next cycle, plays sound effect 0xC1 via PlaySoundEffect, and stores phase 8 into oBattleObject_CurPhase
  so the next tick runs a different handler. The 60-frame reload implies the action repeats every second
  while the object stays in phase 7 (this handler''s phase).'
