- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh/sub/strh on oBattleObject_Timer with bne exit: per-frame countdown gate; bl sprite_setUnk0x2c
    with dword_80CDB4C = 0x2C000000 on trigger; mov r0,#0x3C; strh -> timer reset to 60 frames; mov r0,#0xC1;
    bl PlaySoundEffect — audible cue when timer lapses; mov r0,#8; strb into oBattleObject_CurPhase —
    transitions to phase 8'
