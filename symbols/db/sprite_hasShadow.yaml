name: sprite_hasShadow
address: '0x08002E3C'
kind: function
status: confirmed
summary: Turns on the shadow for an object's current sprite by setting the shadow bit and clearing the no-shadow
  bit in its sprite state byte.
interface: void sprite_enableShadow(Object* obj /* r5 */); returns r0 = new sprite state byte, r1 = 4, r3 = sprite
  struct address; N/Z from the stored byte, C/V left over from the address ADD
details: 'Takes an object pointer in r5. Reads the object header byte at +2 (oObjectHeader_TypeAndSpriteOffset),
  whose upper nibble selects which 0x10-byte sprite struct within the object belongs to it, and masks it down to
  a 0x10-aligned offset via (byte >> 4) << 4. Adds that offset to the object pointer to get the sprite struct address
  (this ADDS is what sets C and V, since later ORR/BIC leave them alone). Then reads the sprite state byte at sprite+3
  (oObjectSprite_Unk_03), sets bit 0 (shadow enabled) and clears bit 2 (no-shadow flag) with ORR #1 / BIC #4, and
  stores it back. BIC only updates N/Z, so the returned flags are a mix: N/Z from the final state byte, C/V from
  the earlier ADDS. Returns r0 = new state byte, r1 = the constant 4 (the BIC mask, unused by callers per the contract),
  r3 = sprite struct address. Despite the name sprite_hasShadow, this is a setter that grants a shadow, not a predicate;
  a rename to something like sprite_enableShadow reflects the actual effect.

  '
