name: subsystem_launchShop
address: '0x08005D28'
kind: function
status: confirmed
summary: Fades the screen out and queues the shop subsystem (0x20) to take over from the current map.
interface: void subsystem_launchShop(Toolkit *toolkit /* r10 */); leaves r1 = 0x20, clobbers r0-r3, preserves r4-r7
details: 'Runs the pre-transition hook sub_8046CC8 (no args, results unused), then reads the GameState pointer from
  the toolkit (oToolkit_GameStatePtr). Copies the current map group (GameState+4) into oGameState_LastMapGroup so
  the shop subsystem can send the player back to the right map afterwards. Calls updatePlayerGameState_800107A to
  refresh the player''s game state, starts a screen fade with SetScreenFade(0xC, 0x10) (fade kind 0xC, speed 0x10),
  and finally stores 0x20 into the GameState''s subsystem index byte (offset 0) - the game state callback cbGameState_80050EC
  picks this up and launches the shop. Quirk: the returned r1 value (0x20) is just the leftover argument used for
  the subsystem index, not a deliberate return value.

  '
