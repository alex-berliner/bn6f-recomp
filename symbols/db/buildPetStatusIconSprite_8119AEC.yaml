name: buildPetStatusIconSprite_8119AEC
address: '0x08119AEC'
kind: function
status: confirmed
summary: Build and display the PET-Navi status (style/element) icon sprite for the current PET Navi, choosing
  the sprite form from a table based on the active Navi or its stats.
interface: 'void sub_8119AEC(void /* obj ptr in r5 */);

  // inputs: r5 (object ptr)

  // outputs: r2 r3 r5

  // clobbers: r0 r1 lr; flags n z c v

  '
details: "Tags the object in r5 by writing 0x23 to [r5]. Selects a sprite-form ID from\nthe kSpriteFormTable\
  \ (byte_8119B74, 32-bit words) either by:\n  - direct index = get_cur_pet_navi() when a real Navi is\
  \ out, or\n  - when no Navi is out: index 0; if byte 0x200AD04 is non-zero AND event\n    \"0:0x63\"\
  \ (EVENT_163) is clear, index = 0x0C + stats_byte_0x17\n    (stats read via GetCurPETNaviStatsByte).\
  \ Otherwise a fallback index\n    of 0x1B is used via the explicit mov r0,#0x1b dead branch.\nInitialises\
  \ the sprite via initGuiSprite_8002770(formId, ?), sets animation\n0, loads animation data, disables\
  \ shadow, calls sub_8119C08 to lay out\ncompanion/companion-related sprites (its r0 is forwarded as\
  \ the palette\nindex to sprite_setPalette), sets priority 2, calls\nslotList_storeHalfwordAndClearField_800306C\
  \ with 0, sets sub-entry palette\nbank 0, sets sub-record field A = 3, writes 0x4 to [r5+8], and finally\n\
  calls sprite_applyComputedPaletteAndUpdate_8119BD0.\nSprite-form table values observed: 0x1B, 0x3F,\
  \ 0x40, 0x41, 0x42, 0x43,\n0x44, 0x45, 0x46, 0x47, 0x48, 0x62, 0x5F, 0x54, 0x55, 0x56, 0x57, 0x58,\n\
  0x59, 0x5A, 0x5B, 0x5C, 0x5D (indexed by either Navi ID or derived\nstats index).\n"
