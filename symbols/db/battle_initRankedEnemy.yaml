open_questions:
- Which enemy/boss sprite resource 0x80 corresponds to (what the tables byte_80D39B4 and byte_80D3A68
  feed into in the update handler sub_80D3F32)
- Meaning of the ExtraVars+8 value (0x50-0x80) — timer, speed, or attack counter
- No callers known, so the spawn context (which encounter sets Param1/Param2) is unconfirmed
