    r0, [r1,r0] from byte_80D3A68 (0x50,0x60,0x70,0x80) indexed by Param1*4 into ExtraVars+8; mov r0,
    #CUR_STATE_UPDATE; str r0, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] ends init; sprite_load(0x80,8,0xF)
    + sprite_setAnimation(0x13) + object_setupCollisionData(0x13,0x14,3) define the enemy''s visuals and
