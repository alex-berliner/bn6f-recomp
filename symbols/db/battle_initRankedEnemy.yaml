name: battle_initRankedEnemy
address: '0x080D39E0'
kind: function
status: probable
summary: Battle-object initializer that spawns an enemy whose HP and a per-variant value are selected
  by its Param1 rank index.
interface: (r0 = object? via r5 battle object, Param1 = rank 0-3, Param2 = palette) -> r0 = 0/destroyed;
  object left in CUR_STATE_UPDATE phase
details: Recomputes the object's pixel position from its panel coordinates, zeroes oBattleObject_Z16,
  loads sprite resource 0x80 (r1=8, r2=0xF) and marks the object flags with bit 1. Sets animation 0x13,
  palette = Param2*4, and flip from object_getFlip, then allocates collision data; if allocation fails
  it runs sub_80D3F32 and frees the object. Collision box is set to (0x13, 0x14) with type 3 and hit effect
  6. HP/MaxHP are read as halfwords from byte_80D39B4 at Param1*2, and a word (0x50/0x60/0x70/0x80 for
  ranks 0-3) from byte_80D3A68 at Param1*4 is stored in ExtraVars+8, likely a per-rank timer or speed.
  Param4 is cleared and the object's state word is set to CUR_STATE_UPDATE to hand control to its update
  routine.
