name: sub_8049FA4
address: '0x08049FA4'
kind: function
status: confirmed
summary: Top-level dispatcher that runs the current menu/battle substate handler and then refreshes the submenu
  and battle object.
interface: void sub_8049FA4(void)
details: "Reads the active substate id by calling sub_803AFC2(1); when the id is non-zero it\nindexes a small jump\
  \ table at dword_8049FC8 to invoke the matching handler:\n  1 -> handleExitSubmenu_803AA24 (exit submenu)\n  2\
  \ -> battleObj_dispatchSubstate_803AA40 (per-frame substate of the battle object)\n  3,4,5 -> sub_803ABF4, sub_803AB6C,\
  \ sub_803AB94 (other substate handlers, names TBD)\nAfter the handler (or directly when id==0) it calls sub_8049F50\
  \ then sub_803BC7C\nto refresh the submenu and the battle object respectively. Id 0 falls through with\nno handler\
  \ call, so the post-handler refresh still runs.\nPreserves r4-r7; clobbers r0-r3, r8-r12, lr and flags; r2/r4/r5/r10/lr\
  \ are used as\ninputs by callees via the GUEST_CALL ABI. The \"off_8049FC4 = dword_8049FC8\" form\nof the table\
  \ base is a quirk of the disassembly dump and is not meaningful in\ngame logic.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
