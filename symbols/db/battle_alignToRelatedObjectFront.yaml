name: battle_alignToRelatedObjectFront
address: '0x080C205C'
kind: function
status: probable
summary: Copies the panel coordinates of the object's related/parent object onto itself, snaps its pixel
  position there, and steps it one panel (10 px) forward in facing direction.
interface: (r5 = battle object) -> r0 = new X (discarded); updates PanelX/Y, X, Z
details: Reads RelatedObject1Ptr from the r5 battle object and copies that object's PanelX/PanelY into
  the r5 object's own panel fields, then calls object_setCoordinatesFromPanels to recompute pixel X/Y.
  It zeroes oBattleObject_Z, making the object lie flat on the panel. object_getFrontDirection gives +1/-1
  based on alliance side and DirectionFlip; multiplied by 10 (0xA) this shifts X one half-panel/panel
  forward, so the object sits in the panel immediately in front of its related object. Typical of attached/turret-style
  enemies spawned from a parent.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb from [r1,#oBattleObject_PanelX/Y] then strb into [r5,...] copies panel coords from RelatedObject1Ptr;
    bl object_setCoordinatesFromPanels recomputes pixel X/Y from the copied grid position; mov r0,#0;
    str [r5,#oBattleObject_Z] flattens onto the ground plane; mul r0 by 0xA after object_getFrontDirection
    adds a one-panel forward X offset; Caller battle_initEnemy438 sets up an enemy object, consistent
    with positioning a spawned附属/attached part in front of a parent
