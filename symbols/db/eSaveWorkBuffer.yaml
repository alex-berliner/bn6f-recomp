  hand to libSave_CopyToGamePak, and flush to the Game Pak save area at 0xE007F80 (struct)'
details: EWRAM buffer of exactly 0x80 bytes. rng_FillSeedBuffer_803FAEE fills it with 32 random u32 words
  from GetRNG. save_CommitWorkBufferToGamePak_803FB04 writes the caller's r0 at offset 0 and then copies
  the whole buffer to Game Pak. save_BackupToGamePakWithRetry_803FAB4 seeds it via rng_FillSeedBuffer_803FAEE
  and copies the buffer to the Game Pak backup slot. The 0x80-byte size matches a Game Pak SRAM page used
  by the save library.
