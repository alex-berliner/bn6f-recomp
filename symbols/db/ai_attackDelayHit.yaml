name: ai_attackDelayHit
address: '0x080FFE48'
kind: function
status: confirmed
summary: AI attack state that delays a few steps then makes the attack's hit element (4) come out.
interface: 'u32 ai_attackDelayHit(u32 r1, AIAttackVars* r7); // out: r1; clobbers r0, flags, lr'
details: 'Part of the enemy AI attack state machine; r7 points to the AI attack variable block. On the first entry
  (oAIAttackVars_AttackElement == 0) it arms the attack: sets AttackElement to 4, loads oAIAttackVars_StepTimer
  with 5, and if the pointer in oAIAttackVars_ScratchVar is non-null (dereferences to non-zero), calls sub_80D29B2
  with that value, propagating its r1 result. Every call then decrements the 16-bit StepTimer; while it is still
  >0 the function just returns r1. When the timer reaches 0 (or below, via signed compare), it stores element 4
  into oAIAttackVars_HitElement, i.e. the delayed hit lands on that step. Flags (nz c v) are clobbered but callers
  ignore them. r1 is read on entry and returned unchanged except on the sub_80D29B2 path.

  '
