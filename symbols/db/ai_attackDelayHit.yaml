name: ai_attackDelayHit
address: '0x080FFE48'
kind: function
status: probable
summary: 'AI attack state step: arms attack element 4 with a 5-frame delay, then applies it as the hit
  element'
interface: (r7 = AI attack vars object) -> r0 = hit element (4) written to oAIAttackVars_HitElement after
  timer expires; no return value
details: Reads oAIAttackVars_AttackElement from the r7 object; if it is still 0 (unarmed), it sets AttackElement
  = 4, loads oAIAttackVars_StepTimer with 5, and if the pointer in oAIAttackVars_ScratchVar points at
  a nonzero value, calls sub_80D29B2 (possibly spawning/queueing the attack visual). Each call then decrements
  StepTimer; once it reaches 0 it writes 4 into oAIAttackVars_HitElement, ending the delayed hit. Element
  4 is a fixed constant here, so this is a specific attack's state handler rather than a generic helper.
  The ScratchVar check makes the sub_80D29B2 call conditional on some external state (target/obstacle
  presence).
