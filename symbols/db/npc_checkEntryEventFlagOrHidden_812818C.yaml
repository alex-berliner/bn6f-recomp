name: npc_checkEntryEventFlagOrHidden_812818C
address: '0x0812818C'
kind: function
status: confirmed
summary: Looks up an event flag from a table entry and returns 0x8000 if the flag is unset, otherwise passes the
  caller's value through.
interface: 'u32 npc_checkEntryEventFlagOrHidden(u32 defaultResult /*r2*/, u32 indexAddend /*r3*/, Object* object
  /*r5*/); // out: r2 = defaultResult if flag set, 0x8000 if clear; r0/r1/r3/r4 preserved via push/pop'
details: 'Reads the halfword at object+0x24, adds r3 to it, and uses the sum as an index into the 0x20-byte-stride
  table at dword_2027590 (a global object/NPC table). From the entry''s word at +0x18 it takes the upper halfword,
  adds 0x1D20 (7456), and passes that as the event flag id to TestEventFlag. If the flag is set, the incoming r2
  is returned unchanged; if it is clear, r2 is replaced with 0x8000 (a value that in this codebase''s animation/render
  values typically acts as a ''hidden/invalid'' marker, e.g. in sprite animation parameter slots). So the table
  entry effectively defines an optional flag-gate: word+0x18>>16 is a flag offset relative to base 0x1D20, and when
  that content is not unlocked the caller receives 0x8000 instead of its default. All other registers are faithfully
  preserved; flags are clobbered by the TestEventFlag call.

  '
