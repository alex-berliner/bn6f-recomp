name: sub_80273A4
address: '0x080273A4'
kind: function
status: confirmed
summary: Dispatch a battle object's per-frame handler by reading its mode byte and tail-calling the corresponding
  entry.
interface: void sub_80273A4(r5=*self, r10=preserved, lr=preserved) -> r2 r3 r5 r6 r8 r9 r10 r11 r12 (handler returns);
  clobbers nz,c,v r0 r1 r7 lr; r4 preserved.
details: 'Trampoline on a battle object stored at r5. Loads the handler context word from `[self+0x40]` into r4,
  the mode byte from `[self+2]` into r0, and looks up the handler pointer in a 5-entry table at off_80273B8 (entries:
  0 battle_object_SelectHandlerByMode_80273CC, 1 sub_80272D0, 2 chatbox_setState4IfFlag80Clear_8027320, 3 sub_8027332,
  4 sub_80273E4). Tail-calls the chosen handler with `mov lr,pc; bx r1`, then `pop {r4,pc}` restores the caller''s
  r4 and returns to the original caller — so any caller-visible r2,r3,r5-r12 and flags come from the dispatched
  handler. The mode byte is used directly as a byte index into the table without range checking; values outside
  0..4 still branch through `table+mode` (calls are reproduced via a computed-address helper).

  '
