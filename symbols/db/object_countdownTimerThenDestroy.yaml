name: object_countdownTimerThenDestroy
address: '0x080E8E82'
kind: function
status: probable
summary: Decrement the battle object's Timer each frame; once it expires, mark the object for destruction.
interface: (r5 = battle object) -> r0 = scratch; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY when Timer goes below zero
details: Loads the halfword at oBattleObject_Timer from the battle object in r5, subtracts 1, and stores
  it back. If the decremented value is still non-negative (bge), it just returns. When the timer underflows
  (negative), the function writes CUR_STATE_DESTROY into the combined current-state/action-phase field,
  which makes the engine destroy the object on its next state update. No other fields are touched and
  no calls are made; the caller must set oBattleObject_Timer beforehand to the desired lifetime in frames.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh — per-frame countdown of the Timer field;
    bge locret — only acts when the timer has gone negative; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    — requests object destruction; no known callers/callees and 8 instructions — a trivial per-frame tick
    handler, consistent with an object's update callback
