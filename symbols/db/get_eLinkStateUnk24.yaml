name: get_eLinkStateUnk24
address: '0x0803E8DC'
kind: function
status: probable
summary: Returns the word at offset 0x24 of eLinkState (the same cell the project annotates as eCamera.unk_74).
interface: () -> r0 = eLinkState->unk24 (aliased with eCamera.unk_74); no flags used
details: Loads the eLinkState global pointer, then returns [r0,#0x24]. The project's annotation on that
  load marks the cell as eCamera.unk_74, so the field is shared between the link-state and camera structs.
  It is a pure getter with no side effects. Its only caller uses the result as input to get_eLinkStateUnk38
  during a link error/cleanup path (r7=2 branch) before sub_803F118 and sub_803EFFC. Whether the field
  is a pointer or a small value cannot be told from these uses alone.
