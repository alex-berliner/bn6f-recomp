name: ai_pickRandomPanelExcludingSelf
address: '0x08112B06'
kind: function
status: probable
summary: AI helper that returns a random battle panel (x,y) for the acting enemy to target, temporarily
  reserving the object's own panel while searching.
interface: (r4 = AI data of acting object, r5 = its battle object) -> r0 = chosen panel X (low 3 bits),
  r1 = chosen panel Y (high nibble); both 0 if no candidate panel was found.
details: It first reserves the panel under the object (object_reservePanel on r5's PanelX/PanelY), then
  looks up an alliance-dependent panel-parameter entry from byte_8112B60 and calls sub_800D45C with a
  stack buffer, which fills a candidate panel list and returns its count. If that fails it retries with
  object_getPanelsFiltered; given a nonzero count it draws GetPositiveSignedRNG, divides by the count
  (svc 6), and reads the indexed buffer byte, splitting it into a 3-bit X and a 4-bit Y. Finally it releases
  the reservation via object_removePanelReserve and returns the coordinates. The 0,0 fallback when no
  panels are available means callers must treat (0,0) as 'no target'.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_reservePanel ... bl object_removePanelReserve brackets the whole routine around the
    object''s own panel; byte_8112B60 passed as table to GetAllianceDependentPanelParamArgs twice, feeding
    sub_800D45C / object_getPanelsFiltered which fill the sp buffer; svc 6 on GetPositiveSignedRNG result
    divided by r7 (list count), then ldrb [sp,r1] picks a random list entry; lsr r1,r0,#4 / lsl+lsr #0x1d
    extracts Y (high nibble) and X (low 3 bits) from the picked byte; followed immediately by GunnerEnemyStruct
    tables, and the route is ''battlesweep''/''beastsp'' enemy AI context'
