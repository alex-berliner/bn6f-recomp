name: NPCCommand_run_secondary_script
address: '0x0809F16E'
kind: function
status: confirmed
summary: NPC script opcode handler that reads a 32-bit address from the script and stores it as the NPC's secondary
  script pointer, then skips past the 5-byte instruction.
interface: void npcCmd_setSecondaryScriptPtr(OverworldNPCObject* npc /*r5*/, u8* scriptCursor /*r6*/); returns next
  cursor in r6, flags from the r6+5 increment, r0-r3 as left by ReadNPCScriptWord
details: Part of the overworld NPC script interpreter's opcode dispatch. On entry r6 points just past the opcode
  byte; the handler calls ReadNPCScriptWord with r0 = r6+1 to fetch the 4-byte operand (a 32-bit address) and writes
  it to the NPC object (r5) at offset oOverworldNPCObject_UnkNPCScriptPtr_5c (0x5c), the field holding the NPC's
  secondary/next script pointer. The cursor r6 is then advanced by 5 (1 opcode byte + 4 operand bytes) and the flags
  come from that add (r6+5), so NZCV reflect the new cursor value. r0-r3 are whatever ReadNPCScriptWord left behind;
  lr is passed through to the caller of the tail-jumped handler.
