name: get_globalState
address: '0x0803CAF8'
kind: function
status: probable
summary: returns the current global state value stored at eS200BC5C
interface: () -> r0 = dword at eS200BC5C (current global state/mode); flags from load (irrelevant)
details: 'Pure getter: loads off_803CB20 (=eS200BC50) and returns the dword at +0xC (0x200BC5C), touching
  nothing else. Callers compare the value against 4 and 8 or test bit 8, treating it as a small enumerated
  state. In sub_81320AC the value gates a state write to [r5,#0xc] (4->8, 8->0xC) only when the jack-in
  flag is set, suggesting it tracks a scene/transition state rather than input. The actual meaning of
  each value (4, 8, bit 8) is not determinable from this code alone.'
