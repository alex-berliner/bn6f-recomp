- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_803CAF8: ldr r3,=eS200BC50; ldr r0,[r3,#0xc]; return-only getter of 0x200BC5C; sub_81320AC
    0x081320BE: cmp r0,#4 / cmp r0,#8 map result to 8/0xC stored at [r5,#0xc] after ow_checkJackInFlag;
    sub_804921E 0x08049232: after KEY_A pressed check, tst r0,#8 gates a call to sub_803C28A(0x83); values
    4/8/bit8 are enumerated-state-like, consistent across both callers'
