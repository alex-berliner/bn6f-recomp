name: NPCCommand_init_movement
address: '0x0809F218'
kind: function
status: confirmed
summary: NPC script "init movement" command handler — copies direction/speed/distance from the script into the NPC
  object and reads the command's argument word.
interface: void NPCCommand_init_movement(OverworldNPCObject *npc /* r5 */, const u8 *script /* r6 */) -> returns
  r0 = next script word via ReadNPCScriptWord; flags from cmp r6,r0 (nz c v); r1-r3 clobbered by callee, r4 = oOverworldNPCObject_MovementDistanceReload,
  lr clobbered
details: 'Handler for the "init movement" opcode in an overworld NPC''s script. r5 holds the NPC

  object, r6 a pointer to the command in its script. The command is 8 bytes total:

  +0 opcode, +1 direction, +2 speed, +3 distance (the middle bytes are padding), and

  execution resumes at +8. The three parameters are stored to the object''s

  MovementDirectionReload / MovementSpeedReload / MovementDistanceReload fields

  (the "Reload" copies, later presumably transferred to the active fields), and the

  object''s LinkRegister (script resume pointer) is set to script+8. It then calls

  ReadNPCScriptWord with script+4 to fetch the word following the command (this

  command''s argument, e.g. which movement script/animation to start), returning it

  in r0 and r6. Flags are set from a cmp of the returned word against 0 (SET_FLAGS_ADD),

  so callers can branch on it. r4 is left holding oOverworldNPCObject_MovementDistanceReload,

  likely a convenience for the dispatch loop or the next handler.

  '
