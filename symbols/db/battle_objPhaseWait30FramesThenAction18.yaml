name: battle_objPhaseWait30FramesThenAction18
address: '0x080C23CC'
kind: function
status: probable
summary: Battle-object phase step that delays 30 frames, then switches the object to CurAction 0x18
interface: (r0 = unused, object in r5) -> updates oBattleObject_PhaseInitialized/Timer/CurAction/CurPhaseAndPhaseInitialized;
  r0 clobbered
details: Standard two-part phase handler for a battle object whose pointer is kept in r5. On the first
  call it stores 4 to oBattleObject_PhaseInitialized and 0x1E (30) to oBattleObject_Timer and returns,
  letting the delay run. Each later call decrements oBattleObject_Timer; once it reaches 0 it writes 0x18
  to oBattleObject_CurAction and zeroes the combined CurPhaseAndPhaseInitialized field, so the object's
  dispatcher starts the next action/phase from scratch. It touches no other fields and calls nothing.
