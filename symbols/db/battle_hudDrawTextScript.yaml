name: battle_hudDrawTextScript
address: '0x0801E408'
kind: function
status: probable
summary: Draws a fixed text script (TextScript86F0374) into the battle HUD's text tile area via the text
  renderer, then flags the HUD for redraw and dispatches that request.
interface: () -> void; sets HUD request bit 0x100000 in eStruct2035280+0x40 and dispatches it
details: 'First it stores 0x32 into the HUD state halfword at eStruct2035280+0x32, an unknown field near
  the HP-box tile data. It then calls renderTextGfx_8045F8C with TextScript86F0374 as the text source,
  byte_203C4E0 as working state, 0x60098E0 as the VRAM destination (a tile block in the HUD''s tile map
  area), index 0xA, flag 1, and glyph table dword_86B7AE0. After rendering, it ORs bit 0x100000 into the
  HUD''s request dword at +0x40 (eStruct2035280_SetRequestBits_801BECC) and hands the same bit to dispatch_801DA48,
  so the HUD redraw request is both queued and acted on. The whole thing is a parameterless one-shot:
  no register arguments are used, everything is hardcoded, so it is a fixed HUD text update rather than
  a general renderer.'
