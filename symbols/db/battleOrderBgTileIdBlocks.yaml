summary: 'Proposed name: battleOrderBgTileIdBlocks. Per-turn-order BG tile-id blocks (32 bytes each) sourced
  into VRAM for the order-selection BG overlay. (table of u8)'
details: 'Lives in ROM and is passed to QueueEightWordAlignedGFXTransfer as the src in both callers. The
  size argument is fixed at 0x20 (32 bytes) in battle_loadBgTileset_801DE82 and computed as 32 bytes (0x20
  mul) per row in battle_drawOrderBGSelectionArrows_801C640, where the index is the BG''s inner count
  (e.g. 1..3), so each row is a 32-byte BG tile-id block. Both call sites target the same VRAM dst, unk_3001A80.
  Three rows fit in the first 96 bytes (each 32 bytes: bg ids, palette ids, then arrow slots), matching
  the size to the next label.'
