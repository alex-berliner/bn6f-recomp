    into SubStepIndex; bl object_setCounterTime(0xc) + anim 0x10 + PlaySoundEffect(0xb8): the strike moment
    after StepTimer hits 0; object_getFlip + object_getCoordinatesForPanels(PanelX,PanelY) + spawn_t1_0x0_EffectObject
    with r4=flip<<8|0x41: spawns the attack effect on the boss''s own panel, mirrored by facing; mov r0,#0xc;
    strh r0,[r7,#oAIAttackVars_HitElement]: marks the resulting hit''s element'
