name: ai_woodAttackStrikeStep
address: '0x080F961A'
kind: function
status: probable
summary: 'AI attack state handler for a wood-element (element 4) boss attack: charges with a wind-up anim
  and per-difficulty sub-step count, then on timeout strikes — sound effect, effect object at the boss''s
  panel, and sets the hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> r0 = 0/1 whether still running; writes oAIAttackVars
  fields, oBattleObject_CurAnim, spawns an effect object
details: 'On entry with oAIAttackVars_AttackElement == 0 it ''begins'' the attack: sets AttackElement
  = 4 (wood), plays anim 0xf (wind-up), copies AttackBoost2 into StepTimer as a delay, derives a sub-step
  count via SWI Div of 0x18/0x28 << 17 by a word from byte_80F9690 indexed by AiDifficultyTier*4 (giving
  0x18000/0x20000/0x28000/0x30000 divisors, i.e. easier tiers get more sub-steps), stores it in SubStepIndex,
  and calls sub_80F9A18 with TimerOrCycles. On later calls (element set) it decrements StepTimer; when
  it expires it sets counter time 0xc via object_setCounterTime, plays anim 0x10, plays sound effect 0xb8,
  and spawns a type-1/0 effect object at object_getCoordinatesForPanels(PanelX, PanelY), passing r4 =
  (object_getFlip() << 8) + 0x41 (x offset 0x41 adjusted for facing) and r3 = 0x20<<16 to the spawn wrapper.
  Finally sets oAIAttackVars_HitElement = 0xc.'
