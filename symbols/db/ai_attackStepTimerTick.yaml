name: ai_attackStepTimerTick
address: '0x08103528'
kind: function
status: probable
summary: Per-frame tick of an AI attack's step timer; when the timer runs out it ends the attack state,
  resetting the object to its base animation and marking it as moving again.
interface: (r7 = AI attack vars of the acting object, r5 = battle object) -> r0 = 0/1 (timer expiry) unused;
  no return value used
details: 'Called every frame during an AI attack sequence: it decrements oAIAttackVars_StepTimer and returns
  immediately while the timer is still positive. On expiry it sets oBattleObject_CurAnim to 0 (return
  to idle/neutral animation), clears collision ObjectFlags1 bit 0x40 (likely an attack-active/immobile
  bit), and sets the OBJECT_FLAGS_CURRENTLY_MOVING_1 bit so the object can move again. Finally it writes
  0xC into oAIAttackVars_HitElement, presumably restoring a default/none hit-element for the next action.
  The routine is the tail of some larger AI attack state machine, sharing the object pointer (r5) and
  attack variable block (r7) with its caller.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/sub/strh on oAIAttackVars_StepTimer with ''bgt locret'' = frame-countdown that only acts
    on expiry; strb #0 to oBattleObject_CurAnim resets the object''s current animation; bl object_clearFlag
    with 0x40 then object_setFlag1 with 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1 re-enables movement; strh #0xc
    to oAIAttackVars_HitElement restores a default hit element after the attack; executed only from recorded
    ''battlesweep'' routes, matching per-frame AI battle logic'
