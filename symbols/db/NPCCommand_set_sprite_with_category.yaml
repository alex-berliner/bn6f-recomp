name: NPCCommand_set_sprite_with_category
address: '0x0809F01C'
kind: function
status: confirmed
summary: NPC script bytecode command that assigns an overworld NPC a sprite index and sprite category, and marks
  it as a normal (non-shadow) sprite.
interface: void NPCCommand_set_sprite_with_category(npc r5, cursor r6) -> flags r0, shadowFlagConst r1, cursor r6
  (sets nz cv via r6+3)
details: 'Part of the overworld NPC scripting interpreter: r5 points to an OverworldNPCObject and r6 is the cursor
  into the NPC''s command stream. Byte [r6+1] is the sprite index, stored into the halfword field oOverworldNPCObject_NPCSprite
  (strh); byte [r6+2] is the sprite category, stored (as a 32-bit str, leaving the upper bytes of the word field
  as whatever was read from that single byte load) into oOverworldNPCObject_NPCSpriteCategory. It then clears bit
  OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x80 (0x80) in oOverworldNPCObject_UnkFlags_60, so this sprite is rendered normally
  rather than as a shadow variant - i.e. this command explicitly un-shadows the NPC. The cursor r6 is advanced by
  3 (opcode + two operand bytes), and the add sets the condition flags (nz cv reflect r6+3); r0 returns the updated
  flags word and r1 the shadow-flag bit constant, both likely incidental to the interpreter''s tail behavior.

  '
