open_questions:
- Exact meaning of the shadow flag bit 0x80 in UnkFlags_60 (rendered-as-shadow vs. some other display mode) is inferred,
  not confirmed.
- Why the sprite category is stored with a 32-bit str from a byte load (upper 24 bits of the field are effectively
  zeroed only if the field was byte-sized or the load zero-extends into a word store) - possibly just a compiler
  artifact with no gameplay effect.
- Whether the returned r0/r1 values are consumed by the interpreter dispatcher or are just side effects of the shared
  command-return sequence.
