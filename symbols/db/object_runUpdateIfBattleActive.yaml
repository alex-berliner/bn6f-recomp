name: object_runUpdateIfBattleActive
address: '0x080E9498'
kind: function
status: probable
summary: Object update wrapper that destroys the object if the battle is over, skips updating while time-stopped,
  and otherwise invokes the object's per-frame update (sub_80E94B4).
interface: (r5 = battle object) -> r0 = result of battle_isBattleOver/battle_isTimeStop; writes CUR_STATE_DESTROY
  to r5->oBattleObject_CurStateActionPhaseAndPhaseInitialized when the battle is over
details: This is a standard object-update wrapper using r5 as the current battle object (set up by the
  caller, typical of the engine's object dispatch). It first calls battle_isBattleOver; if true, it stores
  CUR_STATE_DESTROY into the object's CurState/phase word so the object gets torn down. Otherwise it calls
  battle_isTimeStop; when time-stop is active (battle flags bit 2) it returns without updating, and only
  when the battle is running normally does it call sub_80E94B4, which is presumably the object's actual
  per-frame update behavior.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_isBattleOver / tst r0,r0 / bne -> stores #CUR_STATE_DESTROY to [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized];
    bl battle_isTimeStop / bne locret skips the update while time-stop is active; falls through to bl
    sub_80E94B4 only when battle is running and not time-stopped; r5 is not initialized here, so the caller
    supplies the battle object, matching an object-update dispatch pattern'
