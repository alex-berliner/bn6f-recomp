name: battle_dispatchAttackByHitElement_810B06A
address: '0x0810B06A'
kind: function
status: confirmed
summary: Jump-table dispatch that selects and executes the AI attack behaviour matching the hit-element
  byte of the current attack vars.
interface: void battle_dispatchAttackByHitElement(u32 aiAttackVars /*r7*/) -> void
details: "Reads oAIAttackVars_HitElement (byte) from the structure pointed to by r7,\nindexes the 5-entry\
  \ jump table at off_810B07C, and branches (bx r1) into the\nselected handler.  The push {r6,lr} / pop\
  \ {r6,pc} frame preserves r6 and the\noriginal caller return address so each handler can simply tail-pop\
  \ back to\nthe dispatch caller.  The five table entries are:\n  0 -> ai_slideLungeAttackStart  (default\
  \ / no-element fallback)\n  1 -> ai_lungeTowardTargetPanel (lunge toward target)\n  2 -> ai_setAttackTargetPanel\
  \   (set / lock target panel)\n  3 -> ai_lungeTowardTargetPanel (same handler as element 1)\n  4 ->\
  \ ai_endAttackIntoMove      (finish attack and transition to movement)\nThe dispatcher itself only touches\
  \ r0, r1, r6, lr, and NZCV; every other\nregister (r2-r5, r7-r12) passes through unchanged, though the\
  \ handlers may\nfreely overwrite them.\n"
