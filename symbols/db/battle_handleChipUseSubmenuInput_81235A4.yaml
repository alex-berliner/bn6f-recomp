summary: Handles Start/B to exit and A to confirm in a battle chip-use submenu, then refreshes chip-use
  stats and steps the battle-object update phases.
interface: 'void (r5 = navi/battle use-context struct, r10 = Toolkit); side effects: exits submenu on
  Start/B, plays SFX, mutates r5 fields (+2=anim, +3, +0xc cursor, +0x1e/+0x20/+0x28/+0x32 AIData counters,
  +0x32 again), refreshes chip-use stats; then calls drawBattleBackground + AI/attack-table apply phases.'
details: "- Entry is `push {lr}` and the function `pop {pc}` at the end (no `push/pop` of other regs in\
  \ lifter's contract `out`); in practice it relies on the caller preserving the callee-saved set around\
  \ this call (r4/r5/r6/r7/r10).\n  - If IsButtonPressed(START|B) is true: confirm-exit submenu (`submenu_ConfirmExitAndFade_811FB64(8)`)\
  \ and play `SOUND_EXIT_SUBMENU`, then fall through to the unconditional tail.\n  - Else if IsButtonPressed(A):\
  \ call `sub_8123E08` (status-bit test), `sub_8123D54` (text/label picker → printer), play `SOUND_MENU_SELECT`,\
  \ start animation `sub_811B314(1, 3)`, store `0x0c` at `[r5+2]` and `0` at `[r5+3]`, clear `[r5+0x20]`,\
  \ then fall through.\n  - Else (no Start/B and no A): unconditionally store `0x1a` into `[r5+0x1e]`,\
  \ `[r5+0x28]`, `[r5+0x32]`. Read `oToolkit_JoypadPtr` → `oJoypad_LowSensitivityHeld`, take `[r5+0xc]`\
  \ as an index, load a byte from `dword_8123640` (= literal `0x140A00`), and call `sub_811F91C(joypad,\
  \ tableByteByIndex, 1, 0)`; if non-zero, jump to the tail. Otherwise feed joypad+`[S2001c04+5]` into\
  \ `menu_moveCursorLeftRight_811FA0C`; if its returned column differs from the current `[r5+0xc]`, store\
  \ it back and call `refreshChipUseStats_8123A80`.\n  - `r5` here looks like a battle-side struct that\
  \ mixes submenu-owned fields (anim/state bytes at +2/+3, cursor at +0xc) with an AIData footer (reads/writes\
  \ at offsets 0x1e/0x20/0x28/0x32, which are in the AIData struct's `Unk_1a`/`JoypadHeld`/`JoypadReleased`/`Unk_32`\
  \ range).\n  - Tail calls `drawBattleBackground_8123AB8`, `battleObject_applyAIDataToAttackTable_8123BC0`,\
  \ `battleObject_runAttackTableApply_8123BE0`, `battleObject_runAITurnPhase_8123C00` (last three named\
  \ here as suggestions since the assembly calls only show the unnamed subs; their confirmed summaries\
  \ in callees show the AI/attack pipeline).\n"
