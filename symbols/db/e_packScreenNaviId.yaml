name: e_packScreenNaviId
address: '0x08132670'
kind: function
status: probable
summary: Looks up the current eLink/communication screen in a small table and packs its index together
  with the PET's selected navi (gated by an event flag) into one returned ID.
interface: '() -> r0 = (screenIndex << 4) | (EVENT_163 ? currentPETNavi : 0); flags clobbered'
details: 'Reads the halfword at eLinkState+0xA (a screen/state id) and scans the 11-entry halfword table
  at byte_81326B0 (0,1,0x10,0x11,0x20,0x21,0x100,0x110,0x200,0x210,0x220) for a match; if no entry matches,
  r4 stays at 0x16 and lsr/lsl #4 maps it to index 11 (0xB0). The match index is shifted left by 4 into
  the high bits. It then calls GetCurPETNavi for the navi selected on the PET, but forces that to 0 (HeatElec?)
  unless story flag EVENT_163 is set, and ORs the navi into the low nibble. The returned value is thus
  a combined (screen, navi) selector, presumably consumed by link/communication handling. The .word sSubmenu
  in the literal pool is not referenced by this function''s code, and byte_81326C8 right after looks like
  the start of a separate 0xFF-terminated table.'
