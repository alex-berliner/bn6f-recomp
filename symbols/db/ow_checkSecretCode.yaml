name: ow_checkSecretCode
address: '0x0813D41C'
kind: function
status: probable
summary: Verifies an 8-byte player-entered code against a lookup table and, on first match, sets the corresponding
  story event flag.
interface: (r0 = u8 code[8]) -> r0 = 1 (new match, r1 = entry id, r2 = entry halfword, r3 = entry byte1),
  2 (match already claimed), 0 (no match); r4 = 0xFF on no-match/already-claimed paths
details: 'Walks a 12-byte-stride table at byte_813CF9C until a 0xFF terminator. For each entry it remaps
  the caller''s 8 bytes through substitution table byte_813D410 and compares them to the entry''s 8-byte
  pattern at offset 4; the first full match wins and the search index is kept. The claimed flag is 0x2620
  + match index: if TestEventFlag says unset, it calls SetEventFlag and returns 1 with the entry''s id
  (offset 0), halfword (offset 2) and byte (offset 1); if already set it returns 2; exhausted table returns
  0. The remap table means the input bytes are compared under some cipher/scramble rather than literally.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_813D426: table walk with 0xFF terminator and 0xC stride entries; loc_813D432 inner loop
    compares 8 bytes of r0 (remapped via byte_813D410) against entry+4; dword_813D488 = 0x2620 added to
    match index, fed to TestEventFlag/SetEventFlag; match path returns 1 plus entry id/halfword/byte1;
    stale and no-match paths return 2/0 with 0xFF fillers; callees are only SetEventFlag/TestEventFlag,
    so its only side effect is claiming a story flag'
