name: ai_dispatchHitElementAttack_8111B4A
address: '0x08111B4A'
kind: function
status: confirmed
summary: Dispatches an in-progress AI attack to the per-hit-element handler selected from a small jump
  table.
interface: void ai_dispatchHitElementAttack(r2, r5, r7 (AI attack vars), r10, lr); // tail dispatch; results
  passed through in r1, r5, r8-r12
details: 'Reads the attacker''s HitElement byte from its AI attack-vars struct at [r7 + oAIAttackVars_HitElement],
  uses it directly as a byte offset into the 5-entry handler table at off_8111B5C (so the stored value
  is effectively pre-multiplied by 4, i.e. 0/4/8/12/16), and jumps to the selected handler via the classic
  "mov lr, pc; bx r1" Thumb interwork trampoline. The handler returns into this routine (to pop {pc}),
  which returns straight to the original caller, so the handler''s register results (r1, r5, r8-r12) are
  observed unchanged by the caller. Handlers in the table are: sub_8111B70, ai_tickCharge, ai_setCurAnimAndHitElementOnFlag,
  ai_resetAnimOnFrameFlag, and genericAI_exitAttackStateAfterDelay_81097BA. r2/r5/r7/r10 are passed through
  untouched as AI state. The table base is loaded via off_8111B58 pointing at off_8111B5C. r0 and r2-r4,
  r6, r7 and flags are clobbered by the dispatch path; the element byte itself also ends up in r0/r1 for
  the handler.

  '
