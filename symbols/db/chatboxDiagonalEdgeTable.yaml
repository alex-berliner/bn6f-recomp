summary: 'Proposed name: chatboxDiagonalEdgeTable. Shared 160-by-160-entry work table used to build clipped
  diagonal window edges for the chatbox. (table of what)'
details: The 1280-byte block has room for 160 rows of eight bytes, matching the full 0xA0-by-0xA0 maximum
  passed to win_buildDiagonalEdgeTable. sub_8006A6C selects a row using a clipped y-coordinate multiplied
  by eight and rebuilds the remaining diagonal-edge data. The caller initializes the table, then supplies
  its address to the background window task with Window0HorizontalDimensions and a four-layer window request,
  so it is the chatbox's diagonal-edge build buffer rather than persistent window state.
