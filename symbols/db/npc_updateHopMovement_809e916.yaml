name: npc_updateHopMovement_809e916
address: '0x0809E916'
kind: function
status: confirmed
summary: Advances an NPC's hop (jump) arc one frame, landing on the ground if the arc completes.
interface: void npc_updateHopMovement_809e916(u32 *npc_obj /* r5 */) -> r0 (new Z when in-flight; undefined when
  landing), r1 (previous Z), r2 (ground Z, <<16), nzcv from `cmp new_z, ground_scaled`
details: 'Operates on the Overworld NPC object pointed to by r5. Reads ground Z via

  checkZCoordModifiers_8031612 from the NPC''s Coords field. Adds oOverworldNPCObject_HopDelta

  into the running oOverworldNPCObject_HopDeltaCompounded, then adds the compounded total to

  oOverworldNPCObject_Z. If the resulting Z is still above ground (signed < ground_z),

  the new Z is stored back and the function returns the in-flight Z in r0. When the hop

  bottoms out (Z has reached or passed ground), oOverworldNPCObject_Z is snapped to ground,

  oOverworldNPCObject_InteractionLocked is cleared (unlocking interaction), and

  npc_enableScript0x19_809f516 is fired to start the completion script. r5 (the NPC pointer)

  is preserved across the call.

  '
