name: object_mirrorOwnerState
address: '0x080E3EFC'
kind: function
status: probable
summary: 'Keeps a battle sub-object in sync with its related object: it survives time-stop with HP 1,
  otherwise clears its HP and destroys itself unless the related object is in action 0xD, and always copies
  3 words from the related object into itself.'
interface: (r5 = battle object with oBattleObject_* fields) -> r0 = clobbered; modifies own HP, CurState/Action/Phase,
  and fields at +0x34..0x3F; flags from battle_isTimeStop and the action comparison
details: The routine first writes HP=1 into itself, then calls battle_isTimeStop. If time-stop is active
  it skips the reset and destroy path; otherwise it writes HP=0 and, if the related object's CurAction
  (byte at oBattleObject_CurAction) is not 0xD, sets its own state word (oBattleObject_CurStateActionPhaseAndPhaseInitialized)
  to CUR_STATE_DESTROY, killing the object. Unconditionally it then reads 12 bytes at related+0x34 via
  ldmia and stores them into its own +0x34 via stmia, mirroring the related object. The temporary HP=1
  appears to be a marker or probe that only persists during time-stop; the +0x34 block is likely position/sprite/animation
  state copied from the parent.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strh r1,[r5,#oBattleObject_HP] with 1, then battle_isTimeStop, bne to skip the HP=0 reset —
    HP stays 1 only while time-stop is active; cmp r0,#0xd against ldrb [RelatedObject1Ptr,#oBattleObject_CurAction];
    only mismatch sets CUR_STATE_DESTROY; ldmia/stmia of 3 words at +0x34 copies state from RelatedObject1Ptr
    into this object every call; Callee battle_isTimeStop confirms this runs in battle with battle flags
    bit 2 semantics
  refs:
  - bn6f/asm/asm31.s:96192
  - 0x0800A098 battle_isTimeStop
  reproduce: python3 tools/asmcat.py 0x080E3EFC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No caller is known, so the object type and why HP=1 matters during time-stop are unconfirmed
- What battle action 0xD is and which object uses this (invis, aura-like, clone?) is unknown
- The meaning of the 3 words at +0x34 in the battle object struct
