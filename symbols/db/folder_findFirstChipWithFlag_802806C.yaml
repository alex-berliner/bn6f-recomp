name: folder_findFirstChipWithFlag_802806C
address: '0x0802806C'
kind: function
status: confirmed
summary: Scans ten folder/slot entries and records the index of the first one whose chip has flag 0x20 set in its
  chip-data status byte, skipping the scan if a result was already stored.
interface: void folder_findFirstChipWithFlag_802806C(void) /* r4 = slot list base, r5 = owner struct; r2/r3/r5 pass
  through; r4, r6 preserved; NZCV clobbered */
details: 'Walks ten 0xC-byte slot entries at r4. Each entry: +0 u8 state flag (only entries with 0 here are examined),
  +8 pointer to a halfword chip word. For each active slot the halfword is passed to sub_802A53C (chip word -> chip
  id, result masked to 9 bits with lsl/lsr 17/15), then getChip8021DA8(chipId) fetches the ChipData record and byte
  +9 is tested against 0x20. The first matching slot''s index (0..9) is written to [r5+7] and the scan stops; the
  field is also the guard — if [r5+7] is already non-zero on entry the whole function returns immediately, so index
  0 can never be recorded this way (quirk). If no slot matches, [r5+7] is left unchanged (stays 0, so the scan repeats
  next call). Only r0/r1 are used as scratch inside the loop; r2/r3/r5 are untouched pass-throughs per the caller
  contract, and r4/r6 are saved/restored around the body.

  '
