name: NPCCommand_end_secondary_script
address: '0x0809F18E'
kind: function
status: confirmed
summary: NPC script opcode that terminates an overworld NPC's secondary (event) script, clearing its script pointer
  and timer so the NPC returns to normal behavior.
interface: void NPCCommand_end_secondary_script(OverworldNPCObject *npc /* r5 */) -> returns r0=NULL, r6=0, NZ flags
  from r6==0
details: 'One of the NPC script command handlers (r5 = NPC object, lr = return into the script interpreter). It
  stores NULL (0) into the NPC''s secondary script pointer at oOverworldNPCObject_UnkNPCScriptPtr_5c, zeroing the
  halfword timer at oOverworldNPCObject_Timer_22 that drives that script, and sets r6 = 0 before returning. r6 =
  0 is the interpreter''s "script ended" signal (a nonzero r6 presumably means the script jumped elsewhere / is
  still running); NZ flags are just the side effect of the final mov r6,#0. No other state is touched; the NPC falls
  back to whatever its primary behavior is once the pointer is NULL.

  '
