name: getOffsetToQuantityOfChipCodeMaybe_8021c7c
address: '0x08021C7C'
kind: function
status: confirmed
summary: Returns the address of the pack-stock quantity byte for a given chip id and code letter (falling back to
  the first code slot if the chip has no such code).
interface: 'u8 *pack_getChipCodeQuantityPtr(u32 chipId, u32 code); // out: r0=ptr, r1=12*chipId, r2=chipId, r3=codeIndex;
  clobbers nzcv'
details: 'Looks up the chip''s static data via getChip8021DA8 and scans its four code

  letters (bytes 0..3 of the ChipData entry) for the wanted code r1. If none

  of the four codes match, the index falls back to 0 (first code slot)

  instead of erroring. Then it loads Toolkit.unk_2002230 (a pointer at

  R10+oToolkit_Unk2002230_Ptr) to a per-chip table laid out as 12 bytes per

  chip (four code slots of 3 bytes each, or a 12-byte per-chip record), and

  returns table + 12*chipId + codeIndex — i.e. a pointer to the byte holding

  the quantity of that chip+code in the player''s pack/folder library.

  Unlike a normal AAPCS call it also returns extra state in r1-r3

  (12*chipId, chipId, codeIndex) for callers to reuse, and preserves r4/r7

  while clobbering flags.

  '
