name: oBattleState_CountdownTimer
address: '0x28'
kind: struct-field
status: probable
summary: Frame/turn countdown timer (frames at 60fps, also used as a link-sync timeout in frames) reused
  by many battle-state subroutines.
details: The field is always written as a halfword with value 0x0a (10) on first entry, decremented each
  tick with `sub r0,#1` / `strh`, and tested via `bge` to decide when to advance the state. This is the
  canonical "count N frames then transition" pattern. The link-sync routines reuse the same slot as an
  incrementing frame counter compared against 0xb4 (180 frames ≈ 3s) as a timeout.
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: Initialize the timer to 10 frames on the first call (Unk_03 == 0).
  refs:
  - bn6f/asm/asm00_1.s:10421
  reproduce: grep -n 'oBattleState_CountdownTimer' bn6f/asm/asm00_1.s | head
  result: '"mov r0, #0xa\nstrh r0, [r5,#oBattleState_CountdownTimer]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Decrement each tick; when it goes negative, fall through to set the next state — classic countdown-then-advance.
  refs:
  - bn6f/asm/asm00_1.s:10421
  reproduce: grep -n 'oBattleState_CountdownTimer' bn6f/asm/asm00_1.s | head
  result: '"ldrh r0, [r5,#oBattleState_CountdownTimer]\nsub r0, #1\nstrh r0, [r5,#oBattleState_CountdownTimer]\nbge locret_8007'
- method: assembly-reading
  date: '2026-10-15'
  detail: Same slot reused as an incrementing frame counter (timeout at 0xb4 = 180 frames) for link-sync
    waiting.
