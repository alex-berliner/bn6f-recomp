  reproduce: grep -n 'oBattleState_CountdownTimer' bn6f/asm/asm00_1.s | head
  result: '"ldrh r0, [r5,#oBattleState_CountdownTimer]\nadd r0, #1\nstrh r0, [r5,#oBattleState_CountdownTimer]\ncmp r0,
