name: NPCCommand_set_animation
address: '0x0809EEF8'
kind: function
status: confirmed
summary: Overworld NPC script opcode handler that sets which animation the NPC plays, reading the animation ID as
  the byte after the opcode.
interface: u8 NPCCommand_set_animation(OverworldNPCObject* npc /*r5*/, u8* scriptPtr /*r6*/); returns updated scriptPtr
  in r6, animation ID in r0, flags from ptr+2
details: 'Script interpreter command for overworld NPCs. r5 points to an NPC object and r6 to the

  current script command stream. Reads the byte at [r6+1] (the argument following the opcode,

  which itself was presumably dispatched/consumed by the caller) and stores it into the NPC''s

  AnimationSelect field (offset oOverworldNPCObject_AnimationSelect), which selects which

  animation the NPC''s overworld sprite plays. Advances the script pointer r6 by 2 (opcode +

  one-byte argument) so the interpreter continues at the next command. The returned r0 carries

  the animation ID and the NZCV flags reflect the r6 += 2 addition, which the interpreter

  may rely on; r6 is both input and output (updated in place).

  '
