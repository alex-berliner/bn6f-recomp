name: battle_checkSubFlags_8128280
address: '0x08128280'
kind: function
status: confirmed
summary: Iterates the four battle object slots whose indices follow obj_flags; for each whose matching event flag
  (sub_flag + 0x1DA0) is unset, calls sub_81282C0 with the slot index.
interface: 'void sub_8128280(struct BattleObj *r5 /* in/out, preserved */, void *r10 /* in, preserved */);

  // returns via RETURN_TO_CALLER(); clobbers r0-r3, lr, N Z C V; preserves r4, r6, r7.

  '
details: 'Reads r5+0x24 as a u16 "object base index" (obj_flags) and r5+0x1E as the u16

  active count (obj_count). Bails out when obj_count == 0.

  The base table dword_2027590 is an array of 0x20-byte records. For each

  i in [0,4), while i < obj_count, it loads the high u16 of dword at

  (base + (obj_flags + i) * 0x20 + 0x18) — treating it as a "sub flag" id —

  and adds 0x1DA0 to produce an event-flag id passed in r0 to TestEventFlag.

  If TestEventFlag returns "not set" (Z clear path lands on the bne target

  because !Z means flag was set, so the else branch fires when Z is set),

  it calls sub_81282C0(r0 = i). Note the control-flow quirk in the C

  reproduction: the assembly''s `bne loc_81282AC` jumps PAST the sub_81282C0

  call, so sub_81282C0 is invoked exactly when the flag is NOT set.

  obj_flags is reused as an offset base, not as bit flags.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
