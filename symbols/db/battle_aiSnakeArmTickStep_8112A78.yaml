name: battle_aiSnakeArmTickStep_8112A78
address: '0x08112A78'
kind: function
status: confirmed
summary: 'Per-frame AI tick for Snake Arm: counts down the attack timer, validates row occupancy, loads difficulty-scaled
  dash parameters, and kicks off attacks 0xA (panel choice) and 0xB (dash).'
interface: u32 battle_aiSnakeArmTickStep_8112A78(u32 ai_data /*r4*/, u32 obj /*r5*/, u32 ai_state /*r6*/, u32 attack_vars
  /*r7*/, /*r10*/); -> r1; clobbers r0 r2 r3; preserves r4 r5 r6 r7; flags n z c v destroyed.
details: 'Two sub-phases selected by oAIState_Timer value. Phase 1 (timer != 0xFF): decrement timer; when it hits
  0, set oAIAttackVars_PanelChooseCallback to ai_pickRandomPanelExcludingSelf, call object_setAttack0(0xA) to enter
  the random-panel selection attack, and clear oAIState_ScriptId. Phase 2 (trigger flag at ExtraVars+0x14 was set):
  if ExtraVars+0 is nonzero, disarm it, then scan for enemy actors on the Snake Arm''s own row (0x74) and the player''s
  row (0x64) in the 0x7F–0x84 parameter window via FindBattleActorsWithNonzeroParam_ReturnCountAndSum; reject if
  either scan returns a nonzero count. Also reject if object_getFlag bit 0x8000 is set. If all pass, set ExtraVars+0x14=1,
  read the AI difficulty tier from oAIData_Version_16, and index four per-tier byte tables (byte_81129DC, byte_81129E2,
  byte_81129E8, byte_81129D0) to fill oAIAttackVars_StepTimer, _ChargeCycles, _AttackDuration, _Damage. Hard-code
  _ExtraDamage=0xA, _AttackBoost2=0x64, _TimerOrCycles=0x68. Clear ExtraVars+0x8/+0xC/+0x10 (dash sub-state) and
  call object_setAttack0(0xB) to begin the Snake Arm dash. Output r1 carries the second-register result of the most
  recent setAttack0 or FindBattleActors call.'
