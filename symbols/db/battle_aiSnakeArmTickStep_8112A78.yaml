open_questions:
- Exact meaning of FindBattleActorsWithNonzeroParam args (0x74/0x64 paired with 0x7F and 0x84) —
- the param-bit patterns look like alliance/element checks but the project does not document them.
- The semantic role of "snake arm" is inferred from sub_8112B06 being grouped with this code;
- no in-function string confirms the actor identity. Naming `battle_aiSnakeArmTickStep_*` is a
- hypothesis pending the matching sub_8112A64 wrapper which presumably dispatches per attack
- state.
