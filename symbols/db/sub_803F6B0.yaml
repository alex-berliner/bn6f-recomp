name: sub_803F6B0
address: '0x0803F6B0'
kind: function
status: confirmed
summary: 'Initialize a new link-comm encounter scene for the chosen scenario: clear the link buffer, run the crt0
  trampoline, reset link state, configure the comm window, dispatch the scenario-specific loader, set the camera
  dwell, and raise event flag 0x172F.'
interface: void sub_803F6B0(u32 scenario /* r0 */); /* clobbers nz,r0,r1,r2,r3,lr; preserves r4-r7 */
details: 'Entry point for kicking off a link-comm scene. Wipes the 0x20-halfword (0x40-byte)

  eStruct200F360 link buffer via ZeroFillByHalfword, then runs crt0_entry_trampoline_8000288

  to set up the scene''s heap/environment. Resets link state with

  eLinkState_ResetForNewUse_803DE88(0) and a follow-up sub_803DEAC, then configures the

  comm window via sub_803DCE8(0x10, 2, 4, 4). Dispatches a scenario-specific loader by

  indexing dword_803F734[scenario << 2] and calling it through sub_813DBC0 with r0=r1=0.

  Sets the camera dwell to 0x3C frames (eLinkState+0xC = 0x3C), and raises event flag

  0x172F via SetEventFlagFromImmediate (the inline `movflag EVENT_172F` encodes bank 0x17,

  bit index 0x2F). r10 is taken in but unused. r4 is pushed to preserve the scenario

  index across the early calls (ZeroFillByHalfword/etc. free to clobber r4); the body

  also pushes r5, though it isn''t actually clobbered inside.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
