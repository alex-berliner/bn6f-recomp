summary: Per-frame field entity tile-animation ticker that pushes an affine-bg update and advances the
  entity's tile/duration sequence when its timer expires.
interface: 'void sub_8127F54(struct FieldEntity* entity /* r5 */, void* r10, lr);

  // outs: r5 preserved; r0/r1/r2/r3/lr clobbered (callee); NZCV clobbered

  '
details: "Operates on a field-entity struct in r5:\n  +0x00 [+0] : state id (terminator 0x0C used as the\
  \ \"inactive\" stop code)\n  +0x0C [+1] : current tile id (input to sub_811FAF4 as r2)\n  +0x0E [+1]\
  \ : duration timer (ticked each call; on reaching 0 the next entry from the sequence is loaded)\n  +0x1E\
  \ [+1] : active flag (0 => not active => bail)\n  +0x20 [+2] : column index used to fetch the column-offset\
  \ (multiplied by 0x10, +0x18) in the setup word built at +0xE0000\n\nSequence:\n  1. Quick bail when\
  \ +0x1E active flag is 0 or state id is 0x0C.\n  2. Build the affine-bg setup word: 0xE0000 | (col *\
  \ 0x10 + 0x18).\n     Dispatch sub_811FAF4 with:\n       r0 = setup word\n       r1 = 0x00020003 (selector\
  \ / mode bits)\n       r2 = current tile id (+0x0C)\n       r3 = byte_8127978 (per-column tile table)\n\
  \       r4 = 0x40000000 (base/destination preserved across the call).\n     sub_811FAF4 is the affine-bg\
  \ tile-stream applier for the field.\n  3. Decrement the +0x0E duration timer; on zero, call sub_8120CC8\
  \ with\n     r1 = pointer to dword_8127980 (the (tile, duration) sequence), get\n     the next (tile,\
  \ duration) pair back in (r0, r1), and store into\n     +0x0C / +0x0E respectively.\n\nr5 is the entity\
  \ pointer and is preserved across the function. r10 is\npassed through (no use observed here) and lr\
  \ is the standard return.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
