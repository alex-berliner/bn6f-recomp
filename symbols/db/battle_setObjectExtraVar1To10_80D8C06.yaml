name: battle_setObjectExtraVar1To10_80D8C06
address: '0x080D8C06'
kind: function
status: confirmed
summary: Sets the second halfword of a battle object's "extra vars" field to 10, likely initializing a
  counter or timer.
interface: void battle_setObjectExtraVar1To10_80D8C06(battle_object *obj /* r5 */); r5 in, no outputs,
  clobbers r0 and NZ flags
details: 'Trivial battle-object setter. Takes the battle object pointer in r5 (note: this caller convention
  passes the object in r5, not r0), and stores the immediate value 0xA (10) at oBattleObject_ExtraVars+4,
  i.e. the second halfword slot of the object''s extra-vars area. The `mov r0,#0xa; b loc_80D8C0C` before
  the store is a vestigial jump; the value 10 is what lands in the field. The store is a full 32-bit str,
  so it also writes the adjacent halfword slot with the upper half of 0xA being 0 — effectively zeroing
  ExtraVars+6 as well. Likely used to set up a 10-frame/10-step counter or state value for some battle
  object behavior. Returns to caller via popped lr (tail of a thunk-style routine per the readable C,
  RETURN_TO_CALLER).'
