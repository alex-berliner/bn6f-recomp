name: copyBgTileBand
address: '0x08138908'
kind: function
status: probable
summary: Draws a scrolling 32x8 background-map band plus a fixed 14x6 tile patch from byte_2016A00 into
  BG tile block 1, positioned by a counter in the caller's struct.
interface: (r5 = struct ptr; uses byte at r5+0xC as wrap-around position counter) -> r0 = void; no flags
  used by callers likely
details: 'No real arguments: it relies on r5 already pointing at a struct (set by caller sub_8138528)
  and reads only field +0xC. It computes (byte+0xA0)&0x1F == byte mod 32 and calls call_sub_3005EBA(0,
  pos, 1, 0xD300, 0x20, 8) — 0xD300 reads as a packed screen entry (tile 0x300, palette 0xD), suggesting
  a 32x8 map strip filled at the wrapped offset. It then calls CopyBackgroundTiles(j=9, i=pos+1, block=1,
  byte_2016A00, 14, 6), blitting a 14x6 block of tile IDs from a static buffer into tile block 1 at a
  fixed row. The mod-32 arithmetic makes the band''s position cycle 0..31, i.e. an animated/scrolling
  background segment with a fixed overlay patch. The trailing dword 0xD000 at dword_8138940 hints at a
  sibling variant of this routine using a different packed entry.'
