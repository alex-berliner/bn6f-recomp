name: battle_buildPlayerPanelGrid_800C4BC
address: '0x0800C4BC'
kind: function
status: confirmed
summary: Builds the 5×8 player-side battle panel grid (ePanelData) and per-column active flags for a turn, then
  hands off to the grid finaliser.
interface: void sub_800C4BC(u32 tableArg_r0, u32 colMask_r1, u32 passthrough_r2, u32 passthrough_r3); returns via
  sub_800C67C -> r2, r3, c, v; clobbers r0,r1,r2,r3,lr; preserves r4-r7
details: "Called once per battle turn setup with a bitmask of the player's active interior columns\n(bits 0..5 =\
  \ columns 1..6) and a table12 record index. Workflow:\n  1) getTable12Record_800D730_800C6D6 resolves the 4-bit\
  \ HP nibble table for the record.\n  2) battle_getPanelEntry_800C8C2(0) is the base of an 8-entry × 8-byte column-array;\
  \ the\n     first 0x40 bytes are cleared and byte 0 of each 8-byte entry is set to the corresponding\n     bit\
  \ of colMask_r1 (columns 0 and 7 are sentinel 0xFF = \"not a player column\").\n  3) ePanelData (0x500 bytes total)\
  \ is cleared, then iterated row 0..4 × col 0..7. For each\n     cell (stride 0x14) it writes:\n       [+0x00]\
  \ walkability/obstacle byte from byte_800C590[row*8+col]\n       [+0x02] and [+0x06] 4-bit HP nibble from the\
  \ table record\n                (LD32 at record+(row-1)*4, shifted by (col-1)*4, masked 0xF;\n               \
  \  only set when object_isValidPanel returns non-zero)\n       [+0x03] [+0x04] [+0x07] copy of the column entry's\
  \ active byte (sentinel 0xFF for\n                columns 0/7, the column mask bit otherwise)\n       [+0x0A]\
  \ col, [+0x0B] row\n       [+0x0C] secondary tile-property byte from byte_800C5B8[row*8+col]\n       [+0x0E] tile\
  \ attribute halfword from sub_800C488\n       [+0x12] constant 0x0708\n  4) sub_800C67C finalises the grid (tile\
  \ graphics / breakage state / panel-occupancy),\n     propagating r2/r3/c/v back to the caller.\nThe two inline\
  \ tables at 0x800C590 and 0x800C5B8 encode per-cell terrain flags for the\nstandard 3x3 play-area plus cracked/empty/HL\
  \ panel variants.\n"
