name: battle_ClearWorkBuffer_8021D08
address: '0x08021D08'
kind: function
status: confirmed
summary: Zero-fills a 0x5C0-byte work buffer at 0x203A0A0, likely resetting battle state between encounters.
interface: void sub_8021D08(void) // clobbers r0, r1, lr, flags; preserves r2, r3 (callers observe r2 pass through
  unchanged)
details: Trivial wrapper — loads the address unk_203A0A0 (IWRAM work area at 0x203A0A0) into r0 and the halfword
  count 0x2E0 (i.e. 0x5C0 bytes) into r1, then tail-calls ZeroFillByHalfword to clear the region. No parameters
  are actually consumed despite the contract listing r2/r3 as inputs; those are simply preserved through the call,
  which is why the lifter records r2 as an "output" (pass-through). The buffer at 0x203A0A0 is a scratch/state area;
  given its placement in the 0x203xxxxx battle work range and the sizeable 0x5C0-byte footprint, this is most plausibly
  a battle-side initialization/reset routine that wipes stale data before a fight or on cleanup. The tail-call (bl
  then pop {pc} — effectively a jump via the pushed lr) means lr is clobbered, not returned.
