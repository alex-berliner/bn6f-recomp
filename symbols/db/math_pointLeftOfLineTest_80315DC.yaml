name: math_pointLeftOfLineTest_80315DC
address: '0x080315DC'
kind: function
status: confirmed
summary: Returns 1 if the point stored at r0 lies on the left side of the directed line through (r2,r4)->(r3,r5),
  else 0.
interface: int math_pointLeftOfLineTest(const Point* point /*r0*/, int p1x /*r2*/, int p2x /*r3*/, int p1y /*r4*/,
  int p2y /*r5*/)
details: 'Geometry helper performing a line-side (orientation) test. The point P = {x,y} is read from the two words
  at [r0] (x at +0, y at +4); P1 = (r2,r4) and P2 = (r3,r5) are the endpoints of a directed line passed in registers.
  It computes the left normal of P1->P2 (r6 = p2y-p1y, r7 = p1x-p2x), the signed cross/dot accumulation dotX+dotY
  (r3), the line offset p2x*p1y - p1x*p2y (r2), sums them in r5, and returns 1 when the signed value is > 0 (P strictly
  left of the line) and 0 otherwise. Points exactly on the line also return 0. Pure computation: no memory is written
  and no global state is touched. Typical use would be polygon/edge hit tests such as triangle point-in-polygon
  checks built from successive edge tests. Callers should treat r2-r7 outputs as scratch unless they happen to reuse
  the values; the contract shows callers let r2,r3,r5,r6,r7 be clobbered.

  '
