name: eNaviCustomizerPanelTileIds
address: '0x0201BE80'
kind: data
status: probable
summary: 'Proposed name: eNaviCustomizerPanelTileIds. UWRAM tile-id table passed as the per-tile-id source
  to CopyBackgroundTiles for the Navi Customizer full panel background. (table of u16)'
details: It is a 128-byte EWRAM buffer whose address is loaded into r3 and handed as the `tile_ids` argument
  to CopyBackgroundTiles while drawing the Navi Customizer screen's full-panel background. The same address
  is also referenced from the off_8135CBC table, which mixes it with the compressed Navi Customizer asset
  pointer and the decomp buffer. The function `battle_loadNaviCustomizerGfx` is the only site in the symbol
  DB that touches it, so the label is filled at runtime by the customizer's screen-init routine rather
  than holding any static data of its own.
evidence:
- method: caller-analysis
  date: '2026-10-20'
  detail: asm36.s:12287 ldr r3,off_8135CBC loads byte_201BE80 and passes r3 as the `tile_ids` arg of CopyBackgroundTiles
    for the Navi Customizer full panel.; asm36.s:12368 off_8135CBC contains a `.word byte_201BE80` entry,
    placing it in the same table as the Navi Customizer compressed graphics and decomp buffer.; byte_201BE80
    is 128 bytes of EWRAM with no ROM bytes of its own, so it is filled at runtime.; Only battle_loadNaviCustomizerGfx
    references it in the symbol DB (2 sites, 1 descriptive owner).
  refs:
  - bn6f/ewram.s:2069
  - bn6f/asm/asm36.s:12287
