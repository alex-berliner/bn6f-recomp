name: eT1BattleObject1_HP
address: '0x0203AAAC'
kind: ram
previous_names: []
status: confirmed
summary: Current HP (u16) of T1 battle object 1 (eT1BattleObject1 + 0x24, oBattleObject_HP), usually an enemy; writing
  0 deletes it.
details: 'The same field as eT1BattleObject2_HP, for object 1: eT1BattleObject1 is at 0x0203AA88 (0x0203A9B0 + 1
  * 0xD8), its u16 HP at +0x24 (MaxHP at +0x26). The code reaches it only through a battle-object pointer (`[r5,
  #oBattleObject_HP]`), never by this name or address.

  '
evidence:
- method: assembly-reading
  date: '2026-10-17'
  detail: The struct definition puts `u16 HP` at loc=0x24; eT1BattleObject1 is the second t1_battle_object_struct
    in eT1BattleObjects, and the ELF symbol is 0x0203AA88 + 0x24.
  refs:
  - bn6f/include/structs/BattleObject.inc:105-106
  - bn6f/ewram.s:3026
  reproduce: 'sed -n ''105,106p'' bn6f/include/structs/BattleObject.inc

    sed -n ''3026p'' bn6f/ewram.s

    arm-none-eabi-nm bn6f/bn6f.elf | grep '' eT1BattleObject1$\| eT1BattleObject1_HP$''

    '
  result: u16 HP // loc=0x24; eT1BattleObject1 0x0203aa88, eT1BattleObject1_HP 0x0203aaac
- method: runtime
