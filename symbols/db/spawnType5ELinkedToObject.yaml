name: spawnType5ELinkedToObject
address: '0x080D036C'
kind: function
status: probable
summary: Spawns a type-0x5E battle object on a given panel/element and links it to a caller-supplied battle
  object, inheriting its alliance/direction-flip and setting flag 0x10.
interface: (r0 = panelX, r1 = panelY, r2 = element, r3-r4 = passed through to object_spawnType3, r5 =
  related battle object) -> r0 = spawned object or NULL; Z flag reflects NULL check
details: 'Saves caller r0-r2 and r5, calls object_spawnType3 with type 0x5E and the shifted args (orig
  r0-r2 become its r1-r3, r4 passes through). object_spawnType3 evidently returns the new object pointer
  in r5 and sets flags on it; ''mov r0, r5'' (assembled as lsls, setting Z) both retrieves the pointer
  into r0 and provides the branch condition after pop restores r1-r3 to the original arguments and r5
  to the caller''s object. On success it writes orig r0/r1/r2 into the new object''s oBattleObject_PanelX/PanelY/Element,
  sets oBattleObject_RelatedObject1Ptr = r5, copies r5''s oBattleObject_AllianceAndDirectionFlip into
  the new object (so it shares alliance/direction-flip with its source), and ORs 0x10 into oObjectHeader_Flags.
  Net effect: a type-0x5E object tied to an existing battle object, placed on a panel with a caller-chosen
  element. What object ID 0x5E is and what flag 0x10 marks are not shown here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: push {r0-r2,r5} / pop {r1-r3,r5} shifts caller r0-r2 into the spawn call's r1-r3 while preserving
    r5; mov r0,#0x5e immediately before bl object_spawnType3 hardcodes the spawned object type as 0x5E;
    strb r1/r2/r3 into oBattleObject_PanelX/PanelY/Element stores the original r0-r2 into the new object;
    str r5,[r0,#oBattleObject_RelatedObject1Ptr] and ldrh/strh of oBattleObject_AllianceAndDirectionFlip
    copy the link and alliance from the caller's r5 object; mov r0,r5 (lsls, flag-setting) followed by
    beq is the NULL check on the pointer object_spawnType3 leaves in r5; flag 0x10 is ORed into oObjectHeader_Flags
    on success
  refs:
  - bn6f/asm/asm31.s:52360
  - 0x080FF7A4 sub_80FF7A4
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080D036C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior closely: it spawns a type-0x5E object via object_spawnType3
    with shifted args, copies panel/element from original r0-r2, links it via oBattleObject_RelatedObject1Ptr,
    copies alliance/direction-flip, and sets flag 0x10. However, the Z-flag trick is slightly different:
    ''mov r0, r5'' assembles as ''lsls r0, r5, #0'' which tests Z on r5 (the spawnType3 return), not r0.
    The summary is mostly correct but the description of the Z-flag mechanism should note it tests r5.
    Name is reasonable but ''spawn'' prefix fits better than ''battle'' since it''s a spawn helper.; run
    wf investigate investigate-20261018-203615; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
