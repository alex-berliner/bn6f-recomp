name: get_progressStageFlagIndex
address: '0x08121108'
kind: function
status: probable
summary: Returns the index (0-6) of the highest set flag among a fixed table of story flags {0x400,0x500,0x600,0x800,0xA00,0xC00,0xE00},
  defaulting to 0.
interface: () -> r0 = u16 index 0..6 of highest set flag in the table (0 if none set); Z from TestEventFlag's
  last result is clobbered
details: Scans a static table of 7 halfword flag IDs (0x400, 0x500, 0x600, 0x800, 0xA00, 0xC00, 0xE00)
  from the last entry down to the first using TestEventFlag, stopping at the first set flag; the returned
  value is the table index (byte offset / 4, so 0..6). If no flag is set (including the 0x400 entry),
  it forces r6=0 and returns 0. The stride-0x200 flag IDs suggest ordered story-progress milestones. The
  single caller, reloadCurNaviBaseStats_8120df0, presumably uses this index to select which stats table
  row to load for the navi.
