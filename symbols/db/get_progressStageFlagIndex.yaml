- method: assembly-reading
  date: '2026-10-18'
  detail: 'off_8121128 holds the halfword flag IDs 0x400,0x500,0x600,0x800,0xA00,0xC00,0xE00, indexed
    by r6 in steps of 4; loop at loc_812110E: ldr r0,[r4,r6]; bl TestEventFlag; bne exits as soon as a
    flag is set; return at loc_812111E: lsr r0,r6,#2 converts byte offset to table index 0..6; if the
    loop falls through (no flag set), mov r6,#0 forces return value 0; sole caller reloadCurNaviBaseStats_8120df0
    implies the index picks a stats/state variant tied to progress'
