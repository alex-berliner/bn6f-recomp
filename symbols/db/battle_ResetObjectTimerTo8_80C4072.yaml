name: battle_ResetObjectTimerTo8_80C4072
address: '0x080C4072'
kind: function
status: confirmed
summary: Null-safe helper that writes 8 into a battle object's field at +8, likely resetting its wait/counter timer.
interface: void battle_ResetObjectTimerTo8(void* obj /* r0 */); /* returns r1=8 when obj != NULL, clobbers nz */
details: 'Takes a battle object/entity pointer in r0. If the pointer is null the function returns

  immediately without touching memory or r1; otherwise it stores the constant 8 into the

  32-bit field at offset +8 of the object and returns. Given typical MegaMan Battle Network

  entity layouts, the +8 field is most plausibly a timer/cooldown/delay counter used by the

  object''s update routine, so callers use this to restart that countdown at a value of 8 frames.

  Only r1 is written; the value left in r1 when the pointer is null is whatever the caller had,

  but the register contract lists r1 as an output, and callers reading r1 back would get 8 in

  the non-null case. No flags are meaningful on return besides the clobbered n/z from the tst.

  Trivial, no other registers or state touched.

  '
