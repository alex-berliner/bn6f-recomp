name: battle_checkAIDataUnk36IsNonZero_8014490
address: '0x08014490'
kind: function
previous_names:
- sub_8014490
status: probable
summary: Returns whether the battle object's AIData `Unk_36` halfword is non-zero (sets r0 to that value
  and Z flag accordingly)
interface: (r5 = BattleObject*) -> r0 = AIData->Unk_36 (halfword, zero-extended) ; Z set when that halfword
  is 0
details: "The function is a Thumb tail-call wrapper (no push/pop, no bl). It reads `r5->AIDataPtr` (offset\
  \ `oBattleObject_AIDataPtr`), loads the halfword at offset `oAIData_Unk_36` (0x36) inside the AIData\
  \ struct, compares it against 0 and returns to the caller via `mov pc, lr`, leaving the value in r0\
  \ and the Z flag set when it was 0.\n  Because the field is documented only as `u16 Unk_36` (no semantic\
  \ name), this is a generic \"is Unk_36 non-zero\" predicate. The caller `battle_setPlayerNaviStatsField0E_8015BEC`\
  \ uses it (likely as an `if` guard) before writing NaviStats offset 0x0E (Mood). The other two callers\
  \ reuse r5 differently so the predicate semantics are stable.\n  No memory is written; only `r0` and\
  \ `r5`-derived flags are observable to callers (lr is consumed by the return, but r5 itself is preserved\
  \ through the indirect load).\n"
