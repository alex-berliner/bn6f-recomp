name: battle_aiAttack_stepGlide_80FE1B4
address: '0x080FE1B4'
kind: function
status: confirmed
summary: Advance a battle object along its X/Y velocity each frame, refresh panel and collision data while
  the move's glide timer (Unk_10) remains non-negative, then on landing commit the future panel as the
  current panel, release the panel reservation, resync coordinates and collision panels, toggle the post-move
  object flags and advance the AI attack state to substate 0x0C.
interface: void sub_80FE1B4(u32 object /* r5 */, u32 aiAttackVars /* r7 */)
details: "Object (r5) fields touched:\n  - oBattleObject_X (ldr + add XVelocity, str back)\n  - oBattleObject_XVelocity\
  \ (read)\n  - oBattleObject_Y (ldr + add YVelocity, str back)\n  - oBattleObject_YVelocity (read)\n\
  \  - oBattleObject_FuturePanelX / FuturePanelY (read into PanelX/PanelY on landing)\n  - oBattleObject_PanelX\
  \ / PanelY (written on landing)\nAI attack vars (r7) fields touched:\n  - oAIAttackVars_Unk_10 (u16\
  \ glide timer, decremented each call; bge early return)\n  - oAIAttackVars_Unk_00 (u16, set to 0x0C\
  \ on landing)\nCall sequence per tick:\n  object_setPanelsFromCoordinates(y+vy, vy)\n  object_updateCollisionPanels()\n\
  \  decrement Unk_10; if still >= 0 return.\nOn landing (Unk_10 underflow):\n  PanelX/Y := FuturePanelX/Y\n\
  \  object_removePanelReserve(fx, fy)\n  object_setCoordinatesFromPanels()\n  object_setCollisionPanelsToCurrent()\n\
  \  object_clearFlag(0x40)\n  object_setFlag1(1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)\n  Unk_00 :=\
  \ 0x0C\nPreserves r4, r5, r6. Clobbers r0, r1, r2, r3, lr and flags (N/Z/C/V).\nNote: r5 and r1 are\
  \ listed as outputs only because the lifter sees the final\nldr/pop restoring r5; r5 is the preserved\
  \ object pointer, not a real return.\n"
