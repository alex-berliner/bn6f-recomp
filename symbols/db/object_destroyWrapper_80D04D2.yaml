name: object_destroyWrapper_80D04D2
address: '0x080D04D2'
kind: function
status: confirmed
summary: Thin wrapper that destroys the object in r5 via object_genericDestroy and returns the same pointer.
interface: u32 object_destroyWrapper(u32 object /* in r5 */); /* returns the same object in r5, other
  regs clobbered */
details: 'Trampoline for object destruction: pushes lr, tail-calls object_genericDestroy (which takes
  the object pointer in r5 and returns it in r5), then pops pc. It adds no logic of its own — it exists
  only so some pointer table or vtable slot can point at a destroy routine with this exact calling position.
  r5 is both the input and output register and is preserved across the call; r6/r7 are also preserved.
  All other scratch registers and flags are clobbered by object_genericDestroy.

  '
