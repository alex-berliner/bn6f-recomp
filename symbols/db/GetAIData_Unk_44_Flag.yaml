name: GetAIData_Unk_44_Flag
address: '0x0800FFFE'
kind: function
status: hypothesis
summary: Returns a boolean-style flag stored at offset 0x44 of a battle object's AI data block.
interface: u32 BattleObject_GetAIFlag44(battle_object *obj in r5); returns flag in r0, AI data pointer in r3
details: 'Tail-call-style accessor for a per-object AI flag. Takes the battle object in r5, loads its AI data pointer
  from oBattleObject_AIDataPtr, then loads the 32-bit flag at oAIData_Unk_44 and returns it in r0. It also conveniently
  returns the AI data pointer itself in r3, which callers may reuse. Uses mov pc, lr to return, so it is a plain
  jump-return with no stack use; no flags are meaningfully set. Until the oAIData_Unk_44 field is identified, the
  flag''s game meaning (e.g. an AI behavior trigger or custom-state marker) is unknown; the "_Flag" suffix in the
  original name suggests callers treat it as boolean.

  '
