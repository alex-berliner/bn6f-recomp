name: battle_breakFrontPanelsWaitPhase
address: '0x080BAD06'
kind: function
status: probable
summary: 'Battle-object phase: breaks the two panels in front, plays sound 0x99, waits 30 frames, then
  moves to action 0x14.'
interface: (r0 unused; r5 = battle object) -> r0 clobbered; updates oBattleObject_PhaseInitialized, Timer,
  CurAction, CurPhase
details: 'Guarded by oBattleObject_PhaseInitialized: on first entry it stores 4 there, calls battle_breakFrontPanels
  (marks the two front-column panels as type 7 and spawns panel effects), plays sound effect 0x99, and
  sets oBattleObject_Timer to 0x1E (30 frames). On subsequent calls it decrements the timer each frame;
  once it reaches zero it writes 0x14 to oBattleObject_CurAction and clears the phase fields (CurPhaseAndPhaseInitialized
  = 0) so the next action/phase can run. r5 holds the battle object, implying the caller passes the object
  in r5 per the battle-step calling convention. The wait likely lets the breaking animation/effects play
  before the next action.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on oBattleObject_PhaseInitialized with ''mov r0,#4; strb'' is the standard run-once
    phase guard; bl battle_breakFrontPanels — known step that breaks the two front panels; mov r0,#0x99;
    bl PlaySoundEffect — plays a sound effect for the breaking; timer set to 0x1E then decremented with
    bgt loop — a 30-frame wait; after wait: CurAction=0x14 and CurPhaseAndPhaseInitialized=0, advancing
    the object''s action state machine'
