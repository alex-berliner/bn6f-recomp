name: set_flags32_20093A4
address: '0x0800719A'
kind: function
status: confirmed
summary: Sets (ORs) the caller-supplied bit(s) in the 32-bit global flags word at 0x20093A4.
interface: void setGlobalFlagsBits_20093A4(u32 bits /* r0 */); // returns updated word in r2; clobbers r1 and NZ
  flags
details: 'Read-modify-write of the global flags word flags32_20093A4 (at 0x20093A4): loads the word, ORs in r0,
  stores it back, and leaves the new word in r2 for the caller. LR is used directly as the return target (mov pc,
  lr), so it only works from ARM-state code paths as written. No other state is touched; the flags word is presumably
  a general-purpose event/progress bitfield used elsewhere in the game.'
