name: SoundMainRAM
address: '0x0814DC88'
kind: function
status: confirmed
summary: The m4a ("Sappy") PCM mixer that m4aSoundInit copies to IWRAM 0x03005700 and SoundMain runs every frame.
interface: Tail-jumped to from SoundMain inside its stack frame (r0 = SoundInfo, r4 = pcmDmaCounter, r5 = buffer
  position this frame, r8 = samples per frame; [sp+0x14] = scanline budget, [sp+0x18] = SoundInfo); returns through
  SoundMain's epilogue.
details: 'm4aSoundInit CpuSets 0x400 bytes from here to IWRAM 0x03005700 and the game runs that copy, so the lifter
  lifts it at its IWRAM address (tools/lifter/lift.py COPIES: SoundMainRAM_iwram) and the port''s readable
  replacement is SoundMainRAM_iwram_03005700 in cport/src/game/m4a_mixer.c (the C port skips the copy, see
  m4aSoundInit). It ages the previous half of the PCM double buffer (reverb or silence), then advances every active
  DirectSound channel''s envelope and mixes its samples into the buffer the DMA streams to the FIFOs: 8-bit
  wraparound mixing, 23-bit fixed-point resampling, envelope steps, loops, and a scanline time budget, all exactly
  as the original.'
