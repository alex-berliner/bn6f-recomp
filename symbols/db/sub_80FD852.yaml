name: sub_80FD852
address: '0x080FD852'
kind: function
status: confirmed
summary: 'Ticks one frame of an AI attack''s wind-up: on first call arms the counter, plays the caster''s attack
  anim, spawns the hit via sub_80C82A8, plays the SFX and stores a frame counter; on later calls decrements that
  counter and advances Unk_00 to 0x18 when it hits zero.'
interface: void aiAttack_tick_80FD852(u32 r3 /* ignored? */, BattleObject* r5, AIAttackVars* r7, u32 r10 /* caller-owned
  */)
details: "Called once per frame from an AI-attack state machine (likely from r10, which the lifter\nnever clobbers\
  \ here so it is probably an outer attack context pointer).\nFirst-tick path (Unk_01 == 0):\n  * Writes 4 to oAIAttackVars_Unk_01\
  \ (probably an \"attack armed / in flight\" flag).\n  * object_setCounterTime(0x18) opens a counter window.\n\
  \  * Sets oBattleObject_CurAnim = 9 on the caster battle object (its attack animation).\n  * Builds a packed descriptor\
  \ in r4 for sub_80C82A8 (the projectile/hit spawner):\n      bits  0..7  = oAIAttackVars_Unk_03        (element\
  \ id)\n      bits  8..15 = dword_80FD8AC[Unk_03]       (sub-element; the dword holds 0x50 each so always 0x50)\n\
  \      bits 16..23 = oAIAttackVars_Unk_0c        (direction)\n    Damage is passed in r6 from oAIAttackVars_Damage.\n\
  \    sub_80C82A8 is called with r0=PanelX, r1=PanelY, r2=oAIAttackVars_Unk_02.\n  * PlaySoundEffect(0x17E) (the\
  \ hit SFX; immediate value 0x7F + 0xFF).\n  * Stashes dword_80FD8AC[Unk_03] in oAIAttackVars_Unk_10 as a u16 frame\
  \ counter.\n  * Leaves r1 pointing at dword_80FD8AC (not meaningful to callers; just a side-effect of the ldr).\n\
  Recurring path (Unk_01 != 0): --Unk_10 until it underflows past zero, then writes\noAIAttackVars_Unk_00 = 0x18\
  \ to hand the AI attack state machine off to its next state.\nTouches oAIAttackVars_Unk_01, _Unk_03, _Unk_0c,\
  \ _Unk_02, _Damage, _Unk_10, _Unk_00 and\noBattleObject_CurAnim, oBattleObject_PanelX, oBattleObject_PanelY.\n\
  Note: dword_80FD8AC = 0x50505050, so the \"sub-element\" byte is hard-coded to 0x50 regardless\nof Unk_03, and\
  \ the frame counter always starts at 0x50 — only one arm of the table byte is\nmeaningfully read (the byte index\
  \ = Unk_03), but the table only has one non-zero entry used.\nPreserves r4/r5/r6/r7/r10 explicitly across the\
  \ call.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
