name: MapScriptSubCmd_free_all_spawned_ow_map_objects
address: '0x08037F90'
kind: function
status: confirmed
summary: Cutscene script sub-command that frees every overworld map object the current script spawned and steps
  the script pointer past this command.
interface: void MapScriptSubCmd_free_all_spawned_ow_map_objects(CutsceneState *state /*r5*/, u16 *scriptPtr /*r7*/);
  /* returns r0 = 1, advances r7 by 2 */
details: 'Script sub-command handler for the overworld/cutscene interpreter. Walks the

  owMapObjectPtrs pointer array in the cutscene state (r5), which spans offsets

  0x44..0x6C (end marker 0x70). For each non-null entry it clears the slot to 0,

  moves the object pointer into r5, and calls FreeOverworldMapObject (which takes

  the object in r5) to release it. The caller''s state pointer is preserved via a

  push/pop of r5 around the call. After the loop it advances the script pointer

  r7 by 2 (past this command word), sets r0 = 1 (success/continue), and returns.

  r1 is zeroed for the slot-clear write but left holding whatever

  FreeOverworldMapObject last left there, since the loop''s store only happens

  when a slot is non-null.

  '
