name: t4_0x28_80E32B8
address: '0x080E32B8'
kind: function
status: confirmed
summary: Task step for battle-object task type 0x28 that dispatches to the object's current-state handler via a
  small state table (init sprite / update mystery data / despawn).
interface: void t4_0x28_80E32B8(battle object in r5, pass-through u32 in r10); clobbers r0-r4, r6, r7, lr and flags;
  r5/r8-r12 outputs come from the dispatched handler (tail-call style pop {pc});
details: 'A per-tick "step" entry for one kind of battle object task (type 0x28). Reads the object''s CurState byte
  at [r5,#oBattleObject_CurState] and uses it as an index into the table at off_80E32CC, then calls the selected
  handler with r0 = state and r1 = handler address (the handler address is passed in r1, presumably so the handler
  knows its own identity or for a shared trampoline convention). The object pointer stays in r5 and a caller value
  in r10 is passed through untouched, so handlers read their arguments from the register file rather than the stack.
  The three states are: 0 = battleObject_initSpriteFromRelatedOrParam2_80E32D8 (first step: build the object''s
  sprite, likely from a related object or param2), 1 = battleObject_updateMysteryData_80E336E (ongoing update, mystery-data/unknown-object
  behavior), 2 = battle_despawnEnemyObject (tear-down / remove the object). The call is a tail call (mov lr,pc;
  bx r1 ... pop {pc} returns straight to this routine''s caller), so register results depend entirely on which handler
  ran. State values beyond 2 would read garbage from the table (no bounds check).'
