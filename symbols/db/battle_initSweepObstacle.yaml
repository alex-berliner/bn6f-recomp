name: battle_initSweepObstacle
address: '0x080E2280'
kind: function
status: probable
summary: 'Initializes one of four sweep-field object variants: places it on a preset panel with a random
  offset, gives it a random fixed-point velocity, and loads its sprite/animation before handing it to
  the update state.'
interface: (r5 = battle object, r5->Param1 = variant 0-3) -> r0 = 0; object fully spawned, CurStateActionPhase
  = CUR_STATE_UPDATE
details: 'Param1 selects a variant. PanelX/PanelY come from byte_80E233C pairs ((7,1),(0,1),(1,4),(1,0))
  and pixel coords are recomputed; Z is fixed at 0x28. A GetPositiveSignedRNG roll with SVC 6 division
  jitters the spawn: variants 0-1 offset Y by ±0x48, variants 2-3 offset X by ±0xF0, then panels are recomputed
  from coordinates. Velocity is a per-variant signed unit vector from byte_80E2348 ((-1,0),(1,0),(0,-1),(0,1))
  multiplied by 0x40000 + (RNG & 0x3FFFF), i.e. fixed-point speed with random low bits. Timer is set to
  0x46 frames (0x1E for variants ≥2), sprite resource 0x80 (args 8/0xC) is loaded with animation 0xF (0x10
  for variants ≥2), palette 0, no-shadow flag, flip taken from the byte table at 0x80E2354, and the object''s
  state is set to CUR_STATE_UPDATE.'
