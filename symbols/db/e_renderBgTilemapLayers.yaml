summary: Fills BG tile blocks 3 and 2 with tilemap entries from eReader-scene tilemap buffers to build
  the scene's background layers.
interface: () -> r0 = destroyed; r1-r5 clobbered; no return value
details: 'Calls CopyBackgroundTiles twice: block 3 from byte_201BB60 with j_size=0xf, i_size=0x14, and
  block 2 from byte_201BDF8 with j_size=0x1e, i_size=0x14 — both starting at (0,0), covering the whole
  screen. The tilemap source buffers sit in the eReader working-RAM area near eDecompBuffer2013A00 and
  eTextScript201BA00, so they were filled earlier by decompressing scene assets (comp_86D66A8, comp_86C9BD4
  etc. per the load table at byte_8128F38). Tile block 3 uses a 15-wide map and block 2 a 30-wide map,
  matching two distinct BG layers. The function is purely a composition step: no VRAM/palette writes of
  its own, those happen in the loader handled by its caller sub_8128CD8.'
