open_questions:
- Exact meaning of the halfword at byte_2000210+6 that sub_809FE36 compares against r4 (collected-id tracker
  vs. some counter) and what the incremented r0 return value is used for
- What the computed pointer (record base+8*state+2) and the byte from the second resolved table represent
  (item id? amount? text index?) — would need sub_809FE36's body or how NPCCommand_init_mystery_data consumes
  r0-r3
- The callee sub_809FE36 is captured as 'Increments a caller-supplied counter when r4 equals the halfword
  index/state field... otherwise returns the counter unchanged,' which contradicts a 'returns record parameters
  (or not-found marker)' interface. The function is plumbed to deliver entry bytes plus computed pointers/index
  to a counter-update callee, not forward a record to the caller; the 0/0xFF 'not-found' branch is consistent
  with not bumping the counter. Rename should reflect a lookup-then-bump idiom, not a 'get entry' getter.
  Proposed name 'mysteryData_getNpcEntry' is misleading.
