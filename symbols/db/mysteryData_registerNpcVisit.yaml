  - 0x0809FE36 sub_809FE36
  reproduce: python3 tools/asmcat.py 0x0809FC1C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The callee sub_809FE36 is captured as ''Increments a caller-supplied counter when r4 equals the
    halfword index/state field... otherwise returns the counter unchanged,'' which contradicts a ''returns
    record parameters (or not-found marker)'' interface. The function is plumbed to deliver entry bytes
    plus computed pointers/index to a counter-update callee, not forward a record to the caller; the 0/0xFF
    ''not-found'' branch is consistent with not bumping the counter. Rename should reflect a lookup-then-bump
    idiom, not a ''get entry'' getter. Proposed name ''mysteryData_getNpcEntry'' is misleading.; run wf
    investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
