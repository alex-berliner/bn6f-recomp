name: clearIndexEntryPair_800AAFC
address: '0x0800AAFC'
kind: function
status: confirmed
summary: Fills one 0x28-byte entry (selected by index) of each of two parallel RAM tables with 0xFFFFFFFF.
interface: void sub_800AAFC(u32 index); // r0 in = entry index; r2 out = 0xFFFFFFFF; preserves r3/r4
details: 'Takes an entry index in r0, multiplies it by 0x28 (40 words = 160 bytes per record), and calls WordFill
  twice: once on unk_20018C0[index] and once on unk_2000260[index], each time filling 0x28 words with the value
  0xFFFFFFFF (built by mvn of 0). The two tables are kept in parallel, so a single index identifies a matching record
  in both. Clearing to 0xFFFFFFFF rather than 0 suggests the records use 0xFF-style "empty" sentinels (common for
  list slots). Caller''s r3/r4 are preserved; r2 is left holding 0xFFFFFFFF from the last fill value.

  '
