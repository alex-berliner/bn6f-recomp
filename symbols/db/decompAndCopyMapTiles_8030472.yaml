open_questions:
- What does the UnkCallback_1c routine actually do (likely applies the tilemap and registers BG layers)? Its signature
  and purpose are not yet known.
- Is the +4 skip on the palette pointer a fixed header size, or does it depend on something in the palette data?
- Does the +4 bytes on the palette source relate to a 16-bit BG mode flag vs 4bpp/8bpp selector? The copy length
  0x1A0 is 13 palettes (13 * 16 * 2 bytes), which is what a single 256-color BG bank would hold, but two BG tilesets
  are loaded so it is unclear which bank this is.
- Why is the first tilemap copy a raw CopyWords rather than an LZ77 decompression? Likely the header is intentionally
  uncompressed so the game can read parameters (size, mode, etc.) from it before decompressing the rest.
