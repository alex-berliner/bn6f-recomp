name: decompAndCopyMapTiles_8030472
address: '0x08030472'
kind: function
status: confirmed
summary: Decompresses the current overworld map's BG tilesets and tilemap, installs them in VRAM, and dispatches
  the map state's post-load callback.
interface: void loadMapTiles_8030472(void)
details: "Reads the per-map tile-loading state at A_eMapTilesState200be70, then performs four steps:\n\n1. BG palette:\
  \ copies 0x1A0 bytes (13 << 5) from\n   (PalettePtr + 4) into the work-RAM palette buffer at A_palette_3001960\n\
  \   via CopyByEightWords (the +4 skips a 4-byte palette header).\n\n2. Two BG tilesets (BG1 and BG2): for each\
  \ entry in the tileset list\n   pointed to by oMapTilesState200be70_TilesetPtr, takes the\n   oMapBGTilesetHeader_CompressedDataOffset\
  \ (a relative offset added\n   to the tileset list base), LZ77-decompresses it into the scratch\n   buffer at\
  \ A_eDecompBuffer2013A00 via SWI_LZ77UnCompReadNormalWrite8bit,\n   then copies WordCount << 2 bytes from that\
  \ buffer to\n   oMapBGTilesetHeader_VRAMOffset + 0x06000000 (the BG VRAM base).\n   Loops twice (i = 0..1), stepping\
  \ by oMapBGTilesetHeader_Size.\n\n3. BG tilemap: copies the plain oMapBGTilemapHeader_Size header of\n   the map's\
  \ tilemap (via oMapTilesState200be70_MapBGDescriptorPtr ->\n   oMapBGDescriptor_TilemapPtr) into A_eDecompBuffer2013A00\
  \ with\n   CopyWords, then LZ77-decompresses the tile entries that follow\n   the header (tilemap + oMapBGTilemapHeader_Size)\
  \ into\n   A_eDecompBuffer2013A00 + oMapBGTilemapHeader_Size via\n   SWI_LZ77UnCompReadNormalWrite8bit.\n\n4.\
  \ Calls the function pointer stored at oMapTilesState200be70_UnkCallback_1c\n   using a \"mov lr, pc; bx r0\"\
  \ trick (so the callback sees the caller's\n   return address). On entry to the callback r0 is the callback's\
  \ own\n   address and r1-r3 are the leftovers of the last LZ77 SWI; r5 holds\n   the state pointer, r6 the tileset\
  \ list base, and r7 the end of the\n   tileset list (r6/r7 are used as a register-form arg pair).\n\nThe function\
  \ preserves r4-r7 and r8/r9/r12 across the callback by\nsaving them to the stack on entry and restoring them on\
  \ exit.\n"
