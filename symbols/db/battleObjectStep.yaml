name: battleObjectStep
address: '0x080275EC'
kind: function
status: probable
summary: 'Per-frame step for a battle object: dispatches to a state handler selected by the object''s
  state byte from a 5-entry Thumb table, then ticks the chip-select pulse animation on the same self pointer.'
interface: (r0 unused; r5 = self *S20364C0) -> r0 = whatever the state handler leaves; calls handler then
  anim tick, no meaningful return
details: Reads a state byte at [r5,#2], uses it as a byte offset into a 5-entry Thumb handler table at
  off_8027604 (state*2), and long-calls the handler with lr set so it returns here, then unconditionally
  runs battleObject_chipSelectAnimTick_8029C08 on the same self. The table mixes object-specific handlers
  (0x8027618, 0x8027624, 0x8027658, 0x8027672) with the known battle_runFirstTutorialChatboxStep, indicating
  this is the state machine driving the first battle tutorial scene. r5 is used directly as the context
  pointer, matching the S20364C0 comment. No callers are known, so the surrounding object lifecycle is
  unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#2]; ldr r1,[r1,r0]; mov lr,pc; bx r1: byte-indexed dispatch into off_8027604 handler
    table; table entry .word battle_runFirstTutorialChatboxStep+1 ties state 4 to the first-battle tutorial
    chatbox flow; bl battleObject_chipSelectAnimTick_8029C08 after the call: chip-select pulse anim runs
    every frame regardless of state'
  refs:
  - bn6f/asm/asm03_0.s:2523
  - 0x08029C08 battleObject_chipSelectAnimTick_8029C08
  reproduce: python3 tools/asmcat.py 0x080275EC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s mechanics are accurate: state byte at [r5,#2] indexes a 5-entry Thumb handler table
    at off_8027604, then battleObject_chipSelectAnimTick_8029C08 is called. However, r0 is loaded with
    the state byte before bx r1 (not unused), which contradicts the proposed interface. The name should
    drop the ''tutorial'' qualifier since the table mixes generic handlers (0x8027618, 0x8027624, 0x8027658,
    0x8027672) with only one tutorial entry, suggesting a general battle object step rather than a tutorial-specific
    one.; run wf investigate investigate-20261019-022109; proposed by Hyper glm-5.3-flash, revised by
    MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
