name: chatbox_EF_checkflag
address: '0x0804156C'
kind: function
status: confirmed
summary: Dispatches the chatbox script opcode at work-area offset 1 to its handler via the jt_ctrl_8041580 jump
  table.
interface: 'void chatbox_runScriptCmd_804156C(struct chatbox_ctx *r4);  // tail call: returns whatever regs/flags
  the handler leaves'
details: 'Reads `*(u8*)(r4 + 1)` as the opcode, multiplies by 4, fetches `jt_ctrl_8041580[opcode]` into r0,

  then `mov lr, pc; bx r0` so the chosen handler returns directly to this function''s caller.

  r1 holds `opcode*4` for the handler. All other regs/flags are entirely the handler''s output.

  The name `chatbox_EF_checkflag` is misleading; this is a generic chatbox script-command

  dispatcher (case 1''s handler is `chatbox_cmdRunScriptByGameProgress_8041748`, etc.), not a flag check.

  '
