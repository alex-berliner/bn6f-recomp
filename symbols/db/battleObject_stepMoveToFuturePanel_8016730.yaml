name: battleObject_stepMoveToFuturePanel_8016730
address: '0x08016730'
kind: function
status: confirmed
summary: 'Per-frame step of a battle object''s staged grid-panel movement: ticks a sub-pixel walk timer, then on
  arrival resolves panel-type effects (holes, contact zones, shift-allowed tiles) and either chains to the next
  panel or finalises the move.'
interface: battleObject_stepMoveToFuturePanel_8016730(BattleObject *obj /*r5*/) -> void; preserves r4,r6,r7; clobbers
  r0-r2,lr,flags
details: 'Called once per frame for any battle object in the MoveToFuturePanel state. The object carries a step
  timer (oBattleObject_MoveToFuturePanelStepTimer, default 4), a signed byte delta-X at +0x1C and delta-Y at +0x1D,
  and target grid coords (oBattleObject_FuturePanelX/Y, packed as oBattleObject_FuturePanelXY). While the timer
  is >0 the object advances sub-pixels by delta×(0xA0000, 0x60000) per frame and refreshes its panel/collision footprint.
  When the timer hits 0 the object snaps to the future panel: the old reserve is freed, PanelXY is overwritten with
  FuturePanelXY, and world coordinates are recomputed. Then the destination panel''s type is read: type 7 (hole)
  grants an extra shift step unless the object''s primary element is 2 (liquid); types 9–0xC trigger a contact-resolution
  branch (unless the object''s flag bitmask has bits 5 and 2 set, mask 0x24, which forces a normal shift instead);
  all other types go straight to the shift attempt. The shift path decrements oBattleObject_PanelShiftCounter, validates
  the next tile with battle_objectCheckPanelByAlliance_800E5AC, and if valid sets a fresh 4-frame timer, writes
  the new future-panel coords, and calls object_reservePanel. First contact (ContactState ≠ 3) resolves an offset
  via battle_objectResolveContactOffset_800E468, records direction in CollisionData, sets ContactState=3, and may
  chain another shift. Repeated contact (state already 3) writes a freeze timer of 5 into AIData. Finalisation writes
  the move direction, zeroes AIType, clears flag bit 12 (the move-to-future-panel in-progress marker), resets ContactState,
  and updates collision panels to the current position.'
