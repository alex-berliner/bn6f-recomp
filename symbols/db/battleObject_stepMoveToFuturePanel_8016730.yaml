open_questions:
- What exactly are panel types 9 through 0xC? Likely special tiles (e.g. conveyor, oil, broken panel) that can block
  movement and trigger contact.
- Flag mask 0x24 (bits 5 and 2) – which game flags do these correspond to?
- What does a non-zero r2 out of battle_objectResolveContactOffset_800E468 signify? Appears to be an offset that
  grants an extra shift step.
- Is 4 the universal step-timer value, or do some objects use different durations?
