name: rfu_stepLinkState
address: '0x0803C86A'
kind: function
status: probable
summary: Dispatches the RFU link state at [r7,#3] through a 3-entry Thumb jump table (off_803C87C) to
  sub_803C888, rfu_updateLinkManager, or sub_803C8E8, returning the handler's r0 unchanged via pop {pc}.
interface: (r0 = state obj * S200BC50 (r7), r1 = scratch) -> r0 = whatever the selected state handler
  returns; flags clobbered
details: 'Reads the byte at [r7,#3] of a struct held in r7 (project-annotated as S200BC50) and indexes
  off_803C87C, a 3-entry Thumb jump table: state 0 -> sub_803C888, state 1 -> rfu_updateLinkManager, state
  2 -> sub_803C8E8. It then calls the selected handler with lr manually set to pc+4 (mov lr, pc; bx r0),
  which returns straight back to the dispatcher''s caller via pop {pc}, so the handler''s return value
  in r0 passes through unchanged. The struct''s +3 byte thus acts as the current link state and the dispatcher
  as the per-frame/per-tick state step. Note r1 is preloaded with the table address before being replaced
  by the byte read, so no arguments beyond the object are set up.'
evidence:
