  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#3]; ldr r0,[r1,r0]: state byte at struct+3 selects a handler from the table; off_803C87C
    entries: sub_803C888+1, rfu_updateLinkManager+1, sub_803C8E8+1 — all wireless/rfu handlers; mov lr,pc;
    bx r0; pop {pc}: tail-call pattern passing r0 through to the dispatcher''s caller; annotation ''(self:
    * S200BC50 $r7) -> (u32?, bool)'' matches a state-object step returning a status/bool'
