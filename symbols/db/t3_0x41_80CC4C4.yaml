name: t3_0x41_80CC4C4
address: '0x080CC4C4'
kind: function
status: confirmed
summary: Per-frame step for a battle object type — dispatches its current-state handler from a 3-entry table, then
  runs the shared blind-render and sprite-update passes.
interface: void battleObject_runStateStepAndRender_80CC4C4(BattleObject *obj /* r5 */); outputs r5 r8 r9 r10 r11
  r12 are whatever the state handler leaves; flags nz c v clobbered
details: "Battle object state-machine driver. r5 holds the object pointer throughout.\nReads the object's current\
  \ state byte (obj + oBattleObject_CurState), which is not a\nplain state index but the byte offset of the handler's\
  \ entry within the table at\noff_80CC4E0, so it is used directly as an index into that table (states 0, 4, 8).\n\
  Dispatches via the game's usual mov lr,pc / bx r1 tail-call-with-return trick so the\nhandler returns straight\
  \ back into this function; r0 (state byte) and r1 (handler\naddress) plus the other entry registers are passed\
  \ through untouched.\nThe three handlers are:\n  0 -> battleObject_initFromPanelSpriteAndCollision_80CC4EC (state\
  \ 0: initialize from\n       panel sprite and collision data)\n  4 -> object_dieOrUpdateCollision_80CC562 (state\
  \ 1: die / update collision)\n  8 -> object_genericDestroy (state 2: generic destroy)\nAfter the handler returns,\
  \ it calls handleRenderBlindForSpecificObjectsMaybe_80169BE\n(blind/darkness render handling for specific objects)\
  \ and then object_updateSprite,\nboth with the same r5 object pointer. r4, r7, r8, r10 are inputs consumed/passed\n\
  through; r0-r3, r6, r7 and the flags are scratch.\n"
