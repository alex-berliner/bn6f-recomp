open_questions:
- The exact meaning of each 8-byte entry (likely OAM tile0/tile1 + affine-param or palette indices; values
  like "0x83,0x3D" suggest VRAM tile IDs in the 0x3D..0x3F range and an 0x80 size/affine flag).
- Why entries 0 and 1 are all-zero (possibly "no overlay" sentinels).
- Whether oToolkit_RenderInfoPtr points at a 4-byte pre + 4-byte post pair, or at a larger structure and
  +4 is the "second" slot.
