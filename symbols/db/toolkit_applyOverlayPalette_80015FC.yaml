name: toolkit_applyOverlayPalette_80015FC
address: '0x080015FC'
kind: function
status: confirmed
summary: Copies an 8-byte palette/tile slot entry from a ROM table into the toolkit render-info write
  area.
interface: void sub_80015FC(u32 entry_index /* r0 */, void *toolkit /* r10 */); -> void; clobbers r0,
  r1, r2, r3, N, Z, C, V
details: 'Loads the base of the ROM table at "byte_8001618" (a table of 8-byte entries whose words look
  like OAM tile

  attributes, e.g. "0x8,0x3C,0x3,0x3D,..."). The selected entry index comes in r0 and is multiplied by
  8 to

  index the table (entries 0 and 1 are zero). Then it reads oToolkit_RenderInfoPtr from the toolkit pointer
  in

  r10, adds 4 to get the render-info "post" slot, and writes the two 32-bit halves of the selected table
  entry

  there. Returns r2 = that render-info address and r3 = the toolkit pointer (matching the register contract''s

  reported outputs r2, r3). Effectively a small helper that stages a tile/palette pair for the toolkit''s

  subsequent sprite render pass.

  '
