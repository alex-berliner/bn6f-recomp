name: object_setPanelCollisionBit
address: '0x03007868'
kind: function
status: probable
summary: Sets one panel's collision-index bit in the battle panel-collision bitmap (unk_2034F60).
interface: (r0 = word column index in bitmap, r1 = row index, r2 = ptr to collision data whose CollisionIndexBit
  is the mask) -> r0/r1/r2 clobbered; no return value
details: Computes &unk_2034F60[(r1*8 + r0)] — the bitmap is laid out as rows of 8 words (32 bytes per
  row) — loads the word, ORs in the bit mask read from [r2+oCollisionData_CollisionIndexBit], and stores
  it back. It is a leaf function with no other side effects. It marks a single grid cell as occupied by
  the object whose collision-index bit is in the passed collision-data struct. The caller object_updateCollisionPanels
  invokes it per panel while walking an object's collision footprint (and its second mode scans the whole
  grid). It is the write half of the panel-occupancy bitmap; a clear/erase counterpart presumably exists
  elsewhere.
