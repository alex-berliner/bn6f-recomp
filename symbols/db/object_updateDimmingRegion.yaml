name: object_updateDimmingRegion
address: '0x080B98EC'
kind: function
status: probable
summary: Battle-object phase handler that waits ~5 frames, then spawns a keep-updating-during-timestop
  dimming collision region on the front panel with the object's element and hit-attribute 0x700FF11, spawns
  an effect object (ID 0x133/0xFF33 by facing), plays sound 0x10A, and shakes the camera; resets phase
  when timer expires.
interface: (r0 = this battle object in r5-convention, PhaseInitialized/Timer fields read) -> void; sets
  oBattleObject_CurAnim, Timer, CurAction, CurPhaseAndPhaseInitialized
details: Standard battle-object phase handler. On first entry it sets PhaseInitialized=4, CurAnim=0x10
  and Timer=0x3C and returns. It then decrements Timer each frame; when it hits 0x37 it calls object_getFrontDirection
  and spawns a dimming collision region (keep-updating-during-timestop) at PanelX+frontDir, PanelY, passing
  Element and the hit-attribute word 0x700FF11 with argument 1. It also spawns an effect object at that
  panel's screen coordinates with an ID built as object_getFlip()<<8 + 0x33 (i.e. 0x133 or 0xFF33 depending
  on facing), plays sound effect 0x10A, and triggers a camera shake of magnitude 1 for 30 frames. Once
  Timer goes negative it sets CurAction=0x10 and clears PhaseInitialized/phase, restarting the cycle.
