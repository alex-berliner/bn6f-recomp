open_questions:
- No callers are known, so which chip/trap/boss spawns this object is unknown
- The exact game meaning of hit word 0x700FF11 and the effect ID 0x133/0xFF33 (likely the dimming/dark
  hole visual) is unconfirmed
- The proposal correctly identifies the structure and most side-effects, but the proposed name's 'Trap'
  is speculative (no callers are known to confirm it's a trap), the CurAction reset is to 0x10 to 0x10
  (not a different action), and the sound ID is 0x10A (=0xB+0xFF) which matches the asm. PhaseInitialized=4
  timer start, dimming spawn, effect spawn, sound, camera shake all match. The cycle reset is to CurPhaseAndPhaseInitialized=0
  (clearing phase) keeping CurAction=0x10, so 'restarting the cycle' is slightly off.
