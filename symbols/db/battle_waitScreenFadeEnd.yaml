name: battle_waitScreenFadeEnd
address: '0x0800B97E'
kind: function
status: probable
summary: Battle-object phase step that starts a screen fade and blocks the object's action until the fade
  finishes.
interface: (r5 = battle object, no args) -> void; advances oBattleObject_CurAction by 4 and clears phase
  state when the fade completes
details: On first entry (PhaseInitialized == 0) it calls SetScreenFade(0x78, 0x80), resets oBattleObject_Timer,
  and sets PhaseInitialized = 4. Every frame it increments Timer, then checks IsScreenFadeActive; while
  a fade is running it just returns, keeping the object in this phase. Once the fade is no longer active,
  it adds 4 to oBattleObject_CurAction (moving to the next action state) and zeroes oBattleObject_CurPhaseAndPhaseInitialized
  so the object's phase machine restarts for the next action. r5 is the battle object struct passed implicitly
  via the register; Timer/PhaseInitialized/CurAction/CurPhaseAndPhaseInitialized are its standard phase-machine
  fields.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl SetScreenFade with r0=0x78, r1=0x80 runs once under the PhaseInitialized guard (loc 800B97E..800B996);
    bl IsScreenFadeActive; bne locret keeps the object polling every frame while the fade lasts; after
    fade ends: ldrb r0,[r5,#oBattleObject_CurAction]; add r0,#4; strb — advances the action state by one
    entry; mov r0,#0; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized] resets the sub-phase for
    the next action; oBattleObject_Timer is incremented per frame but never compared, so it only records
    fade-wait duration'
