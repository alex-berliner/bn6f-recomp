name: battle_stepPanelEffectSpread
address: '0x080E8BF8'
kind: function
status: probable
summary: 'Battle panel-effect tick: clears one already-marked panel from the 6x6 flag map, then computes
  and stores the next panel position to process.'
interface: (r5 = battle object) -> r0 = void; stores next panel word into battleObject->ExtraVars
details: First calls sub_80E8C84 (a guard condition); if it fails, battle_markFilteredPanelFlags rebuilds
  the 6x6 boolean map at struct+0x64 for panels matching an alliance-dependent panel-param filter. Then,
  if ExtraVars is nonzero, it decodes it as row = word>>4, col = word&7, computes index row*6+col+0x64
  and clears that byte in the map — i.e. it consumes the previously selected panel. It then looks up the
  8-byte panel-param entry via GetAllianceDependentPanelParamArgs (table byte_80E8C34, param 0x20), and
  sub_80E8D92 uses the args to produce a new (row,col) packed as (r1<<4)+r0, which is stored back into
  ExtraVars. So each invocation handles exactly one panel of the effect, spreading/iterating over the
  filtered panel set one panel per tick.
