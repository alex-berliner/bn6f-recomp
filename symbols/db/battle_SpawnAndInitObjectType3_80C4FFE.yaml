name: battle_SpawnAndInitObjectType3_80C4FFE
address: '0x080C4FFE'
kind: function
status: confirmed
summary: Spawns a type-3 battle object (spawn type 0) and, if one was created, runs BasicBattleObjectInitialize
  on it with the caller's three arguments.
interface: void sub_80C4FFE(u32 arg0 /*r0*/, u32 arg1 /*r1*/, u32 arg2 /*r2*/); returns r0 = object pointer (NULL
  if spawn failed), N/Z set from the pointer, C=V=0; r4-r7 preserved
details: 'Thin spawn-and-initialize wrapper for battle objects. It saves r0-r2 (plus a padding

  slot for r5/r6) on the stack, sets r0 = 0 (spawn "type" argument 0) and calls

  object_spawnType3 with r1-r3 still holding the caller''s values, so the caller''s

  arguments are forwarded to the spawner as-is. The created object pointer comes back

  in r5. The "mov r0, r5" after the pop is actually "adds r0, r5, #0", which both

  restores the original r0-r2 into r1-r3 for the initializer and sets flags: N/Z from

  the object pointer, C and V always clear (adding zero never carries or overflows).

  If the pointer is non-NULL, BasicBattleObjectInitialize is called with

  (object, arg0, arg1, arg2) - i.e. this thunk''s r0-r2 shifted down into the

  initializer''s r1-r3, with the object pointer as the new r0. If the spawn failed

  (NULL), the initializer is skipped and r0 still holds NULL for the caller.

  The stack shuffling (push {r0-r2,r5,r6} / pop {r1-r3,r5,r6}) exists purely to

  preserve the incoming arguments across the spawn call and slide them down one

  register for the initializer call.

  '
