name: ai_battlesweepTargetPanelStep
address: '0x08100D2C'
kind: function
status: probable
summary: AI attack state step that picks a target panel on first run and, after a timed delay, triggers
  the attack effect on that panel, reporting success or failure via HitElement.
interface: (r7 = oAIAttackVars struct) -> r0 = status/element code written to HitElement (0x10 = attack
  executed, 0x14 = no target); no flags of interest
details: 'It reads oAIAttackVars_AttackElement: if unset (0), it sets it to 4 and calls sub_8101190, which
  returns a target panel in r0/r1 (X/Y); on success it stores TargetPanelX/Y and loads StepTimer from
  AttackBoost2 (the charge/delay in frames), otherwise it writes HitElement = 0x14 to signal failure.
  On later calls (element already 4) it decrements StepTimer each frame until it hits 0, then clears SubStepIndex,
  calls sub_8101204 with the stored TargetPanelX/Y to apply the attack at that panel, and writes HitElement
  = 0x10 to mark completion. This is a classic multi-frame attack coroutine step: init-and-target on entry,
  count down, then execute and report.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne splits first-call init vs later countdown;
    bl sub_8101190 with r0/r1 stored into TargetPanelX/TargetPanelY — a panel-picker callee; strh r0,[r7,#oAIAttackVars_StepTimer]
    loaded from AttackBoost2 — delay taken from an attack stat; bl sub_8101204 with TargetPanelX/Y then
    HitElement=0x10 — effect fired at the chosen panel, success code; HitElement=0x14 only in the beq
