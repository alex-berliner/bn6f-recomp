name: petMenu_updateObject_81169B0
address: '0x081169B0'
kind: function
status: confirmed
summary: 'Per-frame update for a PET menu object: dispatches on the object''s mode byte to one of three state handlers,
  then refreshes its sprite.'
interface: void petMenu_updateObject(void* obj /* r5, object with mode byte at +9 */)
details: 'Called with the PET menu object pointer in r5. Reads the mode byte at (r5+9) and uses it directly as a
  byte offset into the three-entry handler table off_81169CC (modes 0, 4, 8 -> sub_81169D8, sub_8116A04, sub_8116A28).
  The handler is invoked with r7 = ePETMenuData (the PET menu global data) and r1 = the mode byte, using the "mov
  lr, pc; bx r0" idiom so the handler returns to 0x81169BE, i.e. straight into the following bl sprite_update --
  handlers effectively fall through into the sprite refresh. After sprite_update, pop {r7,pc} returns to the original
  caller (the lr saved on entry), deliberately discarding the link left by the internal calls. Quirk: the mode byte
  is used as a table offset, so only values 0/4/8 are valid; anything else would read garbage from the table.

  '
