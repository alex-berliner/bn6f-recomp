open_questions:
- 'Exact meaning of the three `sub_80E16CC` r0 values (0/1/2): without seeing sub_80E16CC''s assembly
  they could be attack-mode indices, actor-type filters, or target-priority lanes.'
- What the `object_getEnemyByNameRange` return is meant to populate in the local buffer (count? first
  victim index? full list?). The `mov r0,#0; str r0,[r3]` writes 0 into slot 0 of the count area, suggesting
  r6 (return) is being used as a per-element counter rather than a count to stash.
- Whether this is invoked from "select enemy to attack" vs "select ally to support" — the flipped alliance
  and AI context favors the former; called from a script dispatcher makes it ambiguous without seeing
  the caller's branch.
