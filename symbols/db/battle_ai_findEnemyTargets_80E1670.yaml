name: battle_ai_findEnemyTargets_80E1670
address: '0x080E1670'
kind: function
status: confirmed
summary: Collects opposing-alliance enemies, then probes up to three move-target panels via the related object,
  returning the first valid panel index or zero.
interface: u32 battle_ai_findEnemyTargets(u32 r5 /*battleObj*/, u32 r6, u32 r7, u32 r10) -> r0 /*targetPanelResult*/;
  preserves r4-r7
details: 'Allocates a 0x34-byte stack buffer and fills it with enemy names via

  object_getEnemyByNameRange using the opposing alliance (r5->oBattleObject_Alliance ^ 1)

  and a name-range count of 0x1c3.  Null-terminates the list at r0*4 bytes into the

  returned buffer base (r4 from the callee).  Reads r5->oBattleObject_RelatedObject1Ptr

  and calls battleObject_computeMoveTargetPanel_80E16CC three times with target indices

  0, 1, 2, passing the enemy-list pointer as r2.  Stops at the first non-zero return;

  if all three return zero the final result is zero.  The byte table at 0x80E16C4

  (A0 A4 AC B0 B4 B8 BC FF) is emitted after the function but not referenced here—

  likely a lookup consumed by the callee or a dead literal pool entry.

  r10 is passed through to object_getEnemyByNameRange as r7.

  '
