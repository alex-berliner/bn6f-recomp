  date: '2026-10-14'
  detail: '- `ldrb r3,[r5,#oBattleObject_Alliance]` and `eor r3,#1` at the entry — explicitly flips alliance
    of the calling battle object, the canonical "find enemies" trick. - `bl object_getEnemyByNameRange`
    with `r2=0x1c3` and the buffer pointer — this enumerates enemy actors whose name/ID matches 0x1c3
    and writes their count/index list into the passed buffer (per the project''s helper contract). - The
    literal `byte_80E16C4 = 0xA0, 0xA4, 0xAC, 0xB0, 0xB4, 0xB8, 0xBC, 0xFF` directly after `sub_80E16CC`
    is consistent with mode-0..2 indexing (used by the helper using r0=0/1/2). - Caller `sub_80E1566`
    lives in the AI region (`0x080e16xx`, in the same `sub_80E1566` AI script dispatcher) and passes r5
    (BattleObject) and r10 (Toolkit), matching AI helpers. - `oBattleObject_RelatedObject1Ptr` is at offset
    0x4c and is read for the sub call — this is the AI-related battle object slot, used during AI candidate
    selection. - The 0x34-byte stack slot is the right size for ~13 word entries (matches a `0x1c3`-bounded
    id list plus count/scratch).'
