name: battle_ai_findEnemyTargets_80E1670
address: '0x080E1670'
kind: function
previous_names:
- sub_80E1670
status: probable
summary: finds enemy (virus/navi) battle objects on the opposite alliance and stores them into a stack-local
  array, with sub_80E16CC probing specific related-target slots
interface: '(r5 = self BattleObject, r10 = Toolkit) -> r0 = 0 (Alliance-precomputed count of stored slots),
  r5 preserved ; side effects: writes a 0x34-byte scratch buffer on the stack and queries object_getEnemyByNameRange
  plus three sub_80E16CC probes'
details: "Allocates 0x34 bytes on the stack (`sub sp,#0x34`) and takes `sp` as the local scratch buffer\
  \ (`mov r4, sp`).\n  Reads `oBattleObject_Alliance` (0x16) from `r5`, eors it with 1 to flip alliance,\
  \ and zeroes that flipped value back into a slot of the local buffer at `[r3]` (where `r3 = r0*4 + r4`,\
  \ i.e. slot 0).\n  Calls `object_getEnemyByNameRange(r0=r4 ptr-to-buffer, r1=0, r2=0x1c3)` to enumerate\
  \ enemy actors whose name/ID range covers 0x1c3 — the count returned in `r6` determines how many further\
  \ slots get filled next.\n  Then it makes up to three probes via `sub_80E16CC(self=object in r5 with\
  \ `ldr r1,[r5,#oBattleObject_RelatedObject1Ptr]`, mode=r0=0,1,2, buffer=r4)` — looks like it is checking\
  \ which of three category/pass types the related object satisfies (likely distinguishing Player/Navi/Virus\
  \ targeting, matching `AIData.ActorType` 0..2). The first zero return is the result value handed back\
  \ in `r0` (loops via `bne loc_80E16BA` break on first non-zero). Whoever moves the alliance-flip count\
  \ into slot 0 of the local 0x34-byte buffer and gets a per-mode-0..2 count from `sub_80E16CC` is preparing\
  \ a target list for AI selection.\n  Stack is restored and only r0/r5 are live; r4/r6/r7 are pushed/popped\
  \ as scratch.\n  This strongly resembles an AI \"find valid enemy targets\" helper: flip alliance, build\
  \ an enemy-name-id list in a stack buffer, then for each candidate probe mode via the related-object\
  \ routine.\n"
evidence:
