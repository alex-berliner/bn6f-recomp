name: object_resetAnimFrame
address: '0x080C4C3A'
kind: function
status: probable
summary: 'Resets a battle object''s animation/state for its landing-warp: writes state id 8 into obj+0x08
  and zeroes the counter pointed to by obj+0x64.'
interface: (r0 = battle object) -> r0 untouched; obj+0x08 = 8, *(u32*)(obj+0x64 deref) = 0
details: 'Takes a battle object pointer in r0, stores the constant 8 into field +0x08, then loads a pointer
  from field +0x64 and stores 0 through it. All recorded callers are in the AI attack/move-commit path:
  ai_relocateToFuturePanel (warp onto reserved future panel with emerge animation) and battleObject_commitMoveLanding_8014B18
  (landing commit) plus three nearby unnamed handlers, so this is invoked whenever an object is placed
  on a panel and its emerge/landing sequence begins. Field +0x08 behaves like an animation/state selector
  (value 8) and the word behind +0x64 like its frame or step counter, which the function restarts at zero.
  The function is position-independent and returns via mov pc, lr.'
