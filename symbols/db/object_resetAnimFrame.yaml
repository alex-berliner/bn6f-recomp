- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_80C4C3A: ''str r1,[r0,#8]'' with r1=8 sets a fixed state/animation id on the object; sub_80C4C3A:
    ''ldr r2,[r0,#0x64]'' / ''str r1,[r2]'' zeroes the counter reached via the object''s +0x64 pointer;
    caller 0x08014D08 ai_relocateToFuturePanel is described as warping a object onto its future panel
    with an emerge-style animation; caller 0x08014B18 battleObject_commitMoveLanding_8014B18 commits a
    panel landing, matching a reset of landing/emerge animation state; no callees and only two stores
