name: ow_saveInternetReturnPosition
address: '0x080010A4'
kind: function
status: probable
summary: Stashes the player's internet-area position, facing direction and map ID into the GameState for
  later restoration.
interface: (r0 = x, r1 = y, r2 = z, r3 = facingDirection, r4 = mapId) -> void; no flags, no return value
details: 'Loads the toolkit''s GameState pointer via r10 (oToolkit_GameStatePtr) and stores four/three
  arguments plus the non-standard r4 ''argument'' into consecutive SavedInternet* fields: X, Y, Z, facing
  direction, and map ID. r4 is never set inside the function, so the caller must place the map ID in r4
  before calling — an unusual fifth-argument convention worth flagging. The fields named oGameState_SavedInternet*
  (already labeled by the project) indicate this records where the player was in the internet so the game
  can send them back there later. The function is a pure save routine: no branches, no other memory touched.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r5,[r10,#oToolkit_GameStatePtr] then str r0/r1/r2/r3 into oGameState_SavedInternetX/Y/Z/FacingDirection
    shows a position snapshot save; str r4,[r5,#oGameState_SavedInternetMapId] with r4 unset inside shows
    map ID passed as an out-of-convention 5th register argument; SavedInternet* field names in GameState
    match cybeast internet-jack-in/out state restoration; no callees and only push/pop around the stores
    confirm a simple field-writer
  refs:
  - bn6f/asm/asm00_0.s:2065
