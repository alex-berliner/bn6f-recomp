name: sub_80E0864
address: '0x080E0864'
kind: function
status: confirmed
summary: Initialize a battle object's sprite/animation by indexing a per-object sprite descriptor table with the
  object's Param1 field, then mark the object as initialized and arm CUR_STATE_UPDATE.
interface: 'void sub_80E0864(void);

  /* r5 is the battle object pointer (preserved across the call). Clobbers r0-r3, lr, N Z C V. */

  '
details: "Reads the battle object's Param1 field (offset oBattleObject_Param1) and uses it as an index\ninto the\
  \ table at A_off_80E0804, where each entry is a 4-byte sprite descriptor:\n  +0 tile id (u8) -> sprite_load arg\
  \ R1\n  +1 palette slot (u8) -> sprite_load arg R2\n  +2 initial animation id (u8)\n  +3 palette id (u8)\nCalls\
  \ sprite_load with tile/palette id and R0 = 0x80 (graphics destination slot), then\nsprite_loadAnimationData,\
  \ sprite_noShadow, writes the animation id into both CurAnim and\nCurAnimCopy, calls sprite_setAnimation, sprite_loadAnimationData\
  \ again, sprite_setPalette\nwith the palette id, and sprite_update. Finally sets bit 0x1 of oObjectHeader_Flags\
  \ (OR with\n0x2) and stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized,\nmoving\
  \ the object's state machine into its update phase.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
