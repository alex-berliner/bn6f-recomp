name: battle_stepDefeatSequence
address: '0x08008EA0'
kind: function
status: probable
summary: 'Battle-flow step that runs the player-defeat sub-sequence: clears dispatches/event bits 0x4C43,
  marks the player as loser, plays the defeat jingle (overridden to 0x24 in phase-1/cross-net), ticks
  player HP regen, dispatches kind-effect 0x14, then counts down substep+8 before writing next-state 0xC.'
interface: '(r0 = this, battle sub-state struct: byte+0x03 = substep, halfword+0x02 = next state, halfword+0x08
  = timer) -> void; no meaningful return'
details: 'r5 is a battle-flow state object keyed by a byte at +0x03. On first entry (byte 0) it clears
  event-struct bits 0x4C43, ticks player HP regen (so regen doesn''t apply after loss), copies oBattleState_PlayerSide
  into oBattleState_LoserSide, sets substep 4, then picks music/timer from GetBattleEffects: if effects
  bit 1 is set, song 0x19 with timer 0x41, otherwise song 0x1F with timer 0x66; battle phase 1 overrides
  song to 0x24 (cross-net battle variant). It then dispatches battle kind-effect 0x14 (defeat/loss animation)
  via battle_dispatchKindEffect. On later ticks it decrements the halfword timer at +0x08, waits until
  it reaches 0, and pauses the countdown while a cross-net battle is still connected (comm_checkCrossNetBattleReady);
  when it expires it writes next-state 0xC to the halfword at +0x02.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r1,[r0,#oBattleState_LoserSide] with r1=oBattleState_PlayerSide marks the player as the
    losing side; GetBattleEffects bit 1 selects song 0x19/timer 0x41 else song 0x1F/timer 0x66; PlayMusic
    plays it; battle_dispatchKindEffect_801E792 with kind 0x14 launches the defeat/loss animation; countdown
    on [r5,#8] gated by comm_checkCrossNetBattleReady, then strh 0xC,[r5,#2] transitions the battle state;
    battle_playerHPRegenTick called before loss processing, matching end-of-battle cleanup
  refs:
  - bn6f/asm/asm00_1.s:12974
  - 0x0802D246 GetBattleEffects
  - 0x080005D4 PlayMusic
  - 0x0801E792 battle_dispatchKindEffect_801E792
  reproduce: python3 tools/asmcat.py 0x08008EA0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal correctly identifies first-entry init (substep 0→4), loser-side copy, regen tick, music
    selection with phase-1 override, kind-effect 0x14 dispatch, and the timer countdown paused by cross-net
    ready. However the proposal misreads `dispatch_801DACC(0x4C43)` followed by `flags_clearBits...` as
    a single clearing; in fact `dispatch_801DACC` is called once then `0x4C43` is cleared, so claiming
    it ''clears event-struct bits 0x4C43'' in one breath slightly misrepresents the two-call sequence.
    The name and overall summary still fit well, but the precise mechanics of the two flag calls warrant
    attention.; run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
