name: battle_clearActiveChipState2
address: '0x0802A61A'
kind: function
status: probable
summary: Clears byte 7 of each active-chip entry (when it equals 2), iterating over slots up to the slot
  limit from the chip context.
interface: (r0 = folder data ptr; r5 = chip context struct) -> r0 = 0; r4, r6 clobbered
details: First counts the chips in the equipped folder with battle_countFolderChips_8027D58 (r0). It takes
  r6 = min(count, byte [r5,#6]), so the slot limit field caps the loop. For i = 0..r6-1 it calls getLocOfActiveChips_8027E1C(i)
  to get the 12-byte active-chip entry, and if byte 7 == 2 it stores 0 there, otherwise leaves it untouched.
  This reads like resetting a two-state marker (2 -> 0) on active chips, e.g. selected/used state. Note
  r5 is used without being saved or set, so the caller is responsible for it (callee-saved-register quirk).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_countFolderChips_8027D58 with cmp r0,[r5,#6] computes min(folder count, slot-limit
    byte); loop body: getLocOfActiveChips_8027E1C(r4) then ''ldrb r1,[r0,#7]; cmp r1,#2; strb 0'' only
    when equal; loop bound cmp r4,r6 / blt iterates over active chip slots only, not the whole folder'
