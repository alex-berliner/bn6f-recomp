  date: '2026-10-19'
  detail: 'sub_803F0A4: ldrb r4,[r5,#3]; mov r2,#0x40; mul r2,r4; add r1,r1,r2 — src offset is 0x40 *
    frame index; bl CopyByEightWords with src=bank+0x40*frame, dest=r6, size=r3 unchanged from caller;
    add r4,#1; and r4,#7; strb r4,[r5,#3] — frame index cycles through 8 frames; ldrh r0,[r5,#8]; add
    r0,#1; strh r0,[r5,#8] — u16 counter at state+8 incremented, returned in r0; tst of [r0] and [r0,#0xC]
    with bail-out bl sub_803EF48(=1) guards the copy'
