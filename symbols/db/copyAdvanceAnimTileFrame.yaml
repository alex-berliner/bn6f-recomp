name: copyAdvanceAnimTileFrame
address: '0x0803F0A4'
kind: function
status: probable
summary: If config flags at [r0] and [r0+0xC] are both clear, calls sub_803EF48(1); then copies the current
  animated tile frame (index [r2+3], stride 0x40 bytes from r3 frame bank) into the dest buffer (r1) via
  CopyByEightWords, advances the frame index modulo 8, and increments the call counter at [r2+8].
interface: (r0 = config struct (u8 flag@0x0, u8 flag@0xC), r1 = dest ptr, r2 = state struct (u8 frameIdx@0x3,
  u16 count@0x8), r3 = src frame bank base) -> r0 = new frame count; no meaningful flags
details: If either byte at [r0] or [r0,#0xC] is zero, it calls sub_803EF48(1) (r0 saved around the call),
  likely flagging/requesting something. It then selects frame [r2+3] from a bank at r3 whose frames are
  0x40 bytes apart, and block-copies r3 bytes (size passed straight through from the caller) via CpuFastSet
  wrapper CopyByEightWords. Afterwards it advances the frame index at [r2+3] modulo 8 and increments the
  u16 counter at [r2+8]. The 8-frame, 0x40-byte-stride layout is the classic GBA animated-tile pattern,
  so the dest (r1, from the caller) is presumably a VRAM tile slot. The exact meaning of the r0 flags
  and of the sub_803EF48(1) call is not visible here.
evidence:
