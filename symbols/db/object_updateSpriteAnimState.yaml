name: object_updateSpriteAnimState
address: '0x081177EC'
kind: function
status: probable
summary: 'Per-frame update for a fixed-position sprite object: recomputes an animation index each frame,
  applies it only when it changed, then runs the sprite update.'
interface: () -> void; uses r5 as object struct (field 0xC = cached animation index), no return value
  used
details: The routine pins the object's sprite at screen coordinates (0x78, 0x40) via sprite_setCoordinates
  every frame, then calls three local helpers (sub_8117872, sub_8117820, sub_811788C) whose chained result
  appears to be the desired animation index. It compares that value against the object's cached index
  at [r5,#0xC]; only on a change does it store the new index and call sprite_setAnimation followed by
  sprite_loadAnimationData, avoiding redundant animation reloads. Finally it always calls sprite_update
  to advance/draw the sprite. r5 is not set up in this function, so the caller supplies the object pointer.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_setCoordinates called with hardcoded r0=0x78, r1=0x40 each invocation; ldr r1,[r5,#0xC];
    cmp r0,r1; strne r0,[r5,#0xC] caches the computed animation index; sprite_setAnimation + sprite_loadAnimationData
    only executed when the index changes; sprite_update called unconditionally at the end, matching a
    per-frame object tick; callees sub_8117872/8117820/811788C produce the value compared into the cache
    field
