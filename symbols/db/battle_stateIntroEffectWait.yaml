name: battle_stateIntroEffectWait
address: '0x080092F0'
kind: function
status: probable
summary: 'Battle state handler: on entry fires the queued battle sub-effect (intro/effect kind), then
  waits until cross-net battle readiness allows advancing to state phase 8.'
interface: (r5 = battleState struct) -> void; reads/writes oBattleState_SubPhaseInitFlag, oBattleState_State4EventCount,
  oBattleState_StatePhaseAndInitFlag
details: A per-frame battle state step for one state (state 4?) of the battle state machine. On first
  invocation (SubPhaseInitFlag == 0) it calls battle_dispatchKindEffect_801E792 with the kind byte taken
  from oBattleState_State4EventCount (dispatching effect kind 0-ish, likely the battle intro effect) and
  stores 4 into SubPhaseInitFlag so the effect only starts once. On every later frame it polls comm_checkCrossNetBattleReady_801E754;
  while that returns nonzero it stays in the current phase, and once it returns 0 it writes phase 8 into
  oBattleState_StatePhaseAndInitFlag to move the battle state machine on. Being executed on the battlesweep/beastsp
  routes with no other callers fits a battle-intro state handler that waits for the intro effect and link-battle
  sync before continuing.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/tst on oBattleState_SubPhaseInitFlag with bne makes the dispatch a one-shot init (asm
    80092F2-80092F6); bl battle_dispatchKindEffect_801E792 with r1 = oBattleState_State4EventCount starts
    the queued battle sub-effect; strb #4 to oBattleState_SubPhaseInitFlag marks the effect as already
    started; bl comm_checkCrossNetBattleReady_801E754 then tst/bne keeps the state until it returns 0;
    strh #8 to oBattleState_StatePhaseAndInitFlag advances the battle phase when the check passes'
