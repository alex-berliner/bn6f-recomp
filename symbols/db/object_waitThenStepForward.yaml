name: object_waitThenStepForward
address: '0x080C2804'
kind: function
status: probable
summary: 'Battle-object update: waits 30 frames on its panel, destroys itself if the panel became invalid,
  otherwise starts action 4 stepping one panel forward.'
interface: (r0 = battle object (r5 preserved by caller convention), unused on entry) -> r0 = clobbered
  by calls; updates Timer, PhaseInitialized, CurStateActionPhaseAndPhaseInitialized, FuturePanelX/Y, ExtraVars,
  CurAction
details: On first run (PhaseInitialized==0) it initializes a 30-frame timer (0x1E) and marks phase 4 as
  initialized, then returns. Once the timer counts down to zero, it reads the object's PanelX/PanelY and
  calls object_checkPanelParameters with required-mask 0x10 and clear-mask 0; if the panel no longer satisfies
  that flag (e.g. became a hole/broken panel), the object's state is set to CUR_STATE_DESTROY. Otherwise
  it takes object_getFrontDirection (+1/-1), stores PanelX+dir into FuturePanelX, writes 1 into the FuturePanelY
  field, sets ExtraVars+8 = 1 and ExtraVars+0xC = object_getFlip (facing/alliance XOR override), and finally
  sets CurAction = 4 with CurPhaseAndPhaseInitialized = 0 to begin the next action phase.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'init branch: mov r0,#0x1e; strh [Timer]; mov r0,#4; strb [PhaseInitialized] — one-time 30-frame
    delay; bl object_checkPanelParameters (mask 0x10) followed by mov r0,#CUR_STATE_DESTROY — self-destruct
    when panel flag lost; bl object_getFrontDirection; add r0,PanelX; strb [FuturePanelX] — forward panel
    target computed from facing; bl object_getFlip; str [ExtraVars+0xc] — facing flip recorded for the
