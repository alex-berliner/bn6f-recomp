name: battle_advanceToAction4AfterDelay
address: '0x080C8D64'
kind: function
status: probable
summary: Battle-object phase handler that plays SFX 0xF7 and sets a 5-frame timer on first entry, then
  on timer expiry writes CurAction=4 and clears CurPhaseAndPhaseInitialized to hand off to the next action.
interface: (r5 = battle object pointer; r0 unused input) -> void; updates oBattleObject_CurPhase, oBattleObject_Timer,
  oBattleObject_CurAction
details: Runs once per frame as part of a battle object's action state machine. If oBattleObject_CurPhase
  is 0 it sets phase to 4, plays sound effect 0xF7 via PlaySoundEffect, and loads oBattleObject_Timer
  with 5. On later ticks it simply decrements oBattleObject_Timer; when it reaches 0 it writes 4 into
  oBattleObject_CurAction and zeroes CurPhaseAndPhaseInitialized, handing control to the next action handler.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst/beq: phase 0 branch does the one-time setup (80C8D66-80C8D74);
    mov r0,#0xf7; bl PlaySoundEffect: plays SFX 0xF7 exactly once at entry; mov r0,#5; strh r0,[r5,#oBattleObject_Timer]:
    5-frame countdown; sub r0,#1 / bgt: plain frame-wait loop on subsequent ticks; strb r0(4),[r5,#oBattleObject_CurAction]
    + strh 0 to CurPhaseAndPhaseInitialized: transitions to action 4'
  refs:
  - bn6f/asm/asm31.s:36512
  - 0x080005CC PlaySoundEffect
