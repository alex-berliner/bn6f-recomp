name: battle_updateDashForwardPhase
address: '0x080B9D6E'
kind: function
status: probable
summary: Battle-object action phase that teleports to a start panel based on alliance, then dashes forward
  with per-frame acceleration for 40 frames while flashing a telegraphed target panel every 8 frames,
  before ending the action.
interface: (r0-r3 scratch, r5 = battle object pointer, phase-dispatched) -> void; sets CurAction=0x10
  and clears CurPhase when the 40-frame timer expires
details: On phase 0 it stores phase 4, sets collision region 4, animation 0x13, Z=0x10, and places the
  object on a start panel taken from dword_80B9E34 indexed by Alliance*2 (alliance 0 -> panel (0,3), alliance
  1 -> (7,0)); velocity is set to frontDirection*0x50000 and Timer=40. Phase 4 integrates X/Y velocities
  each frame, recomputes panels/collision, and adds frontDirection*0xA000 to XVelocity per frame (accelerating
  dash); when PanelX changes it re-sets collision region 4. Every 8th frame (Timer2 bit 3) it calls object_highlightPanelRegion
  on a fixed panel from dword_80B9E3C per alliance, likely a telegraph/target flash. When Timer hits 0x1E
  it plays sound 0x13C (0x3D+0xFF); at Timer<=0 it writes CurAction=0x10 and clears CurPhaseAndPhaseInitialized,
  returning control to the action state machine.
