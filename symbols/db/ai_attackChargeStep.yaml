name: ai_attackChargeStep
address: '0x081103A0'
kind: function
status: probable
summary: 'AI attack state handler: charges up an attack (effect + sounds), telegraphs the panel in front
  of the attacker, then advances to the strike sub_8110416 when the timer runs out.'
interface: (r5 = attacker battle object, r7 = oAIAttackVars) -> r0 = clobbered; flags from timer compare
details: On first entry (AttackElement==0) it marks the attack as element 1, switches the object to animation
  1, spawns an effect object of type 1 (0x45, size copied from the object's 0x34 block) and calls sub_80C4038
  (0x200000, 0x10011104 args) storing the result through the PanelChooseCallback, then plays two sound
  effects (0x2E and 0x8A, charge-style). While StepTimer <= 0x10 and on alternating ticks (bit 2), it
  highlights the panel directly in front of the object (front direction applied to PanelX, Alliance^DirectionFlip
  as side) as an attack warning. It decrements StepTimer each frame; when it reaches zero it sets the
  object counter time to 0x1E, sets HitElement to 4, and calls sub_8110416 to continue the attack.
