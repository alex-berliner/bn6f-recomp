name: reqBBS_81408F0
address: '0x081408F0'
kind: function
status: confirmed
summary: BBS request that validates PET/Navi slot availability and chatbox state, then sets event flags 0x173A/0x173C
  and chains sub-request helpers to register the slot for Broadcast Beacon System use.
interface: 'u32 reqBBS_validatePetNaviRegistration_81408F0(u32 r5 /* BBS toolkit ptr */) -> r0 /* result code 0x00,0x0D,0x0E,0x0F,0x10
  */;

  r10 and lr are inputs; r5 is read through helper calls but preserved on return.

  '
details: 'Five result codes: 0x00 (chatbox mask 0x20 absent or 0x110 present – request not applicable), 0x0E (chatbox
  mask 0x80 absent, or helper pair 1 returned nonzero), 0x0F (event flag 0x173A already set – first-time gate),
  0x10 (helper pair 2 returned nonzero), 0x0D (success: flags set and helper chain 3 executed, or PET Navi slot
  occupied). Gates proceed in order: chatbox_mask_eFlags2009F38 checks bits 0x80, 0x20, 0x110; helper reqBBS_81408C8
  loads a toolkit field into r5, reqBBS_8140868 / reqBBS_8140884 validate it; TestEventFlagFromImmediate(0x17,0x3A)
  ensures the request hasn''t already run; EVENT_PET_NAVI_ACTIVE (0x17,0x1D) must be set while GetCurPETNavi must
  return 0 (empty slot). On success SetEventFlagFromImmediate marks 0x173A and 0x173C, then reqBBS_81408C8 → reqBBS_81408A0
  → reqBBS_81408DC execute the BBS sub-request dispatch. off_8140970 holds the constant 0x110 loaded via ldr for
  the third mask check.'
