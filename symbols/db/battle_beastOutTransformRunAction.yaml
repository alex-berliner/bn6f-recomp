summary: 'Dispatch routine for the beast-out transformation battle object: jumps to one of four action
  handlers selected by the object''s Param1 state.'
interface: (r5 = battle object ptr; r0 = oBattleObject_Param1 state index 0-3) -> tail-calls handler for
  that state; returns its result
details: Reads Param1 from the battle object at r5, multiplies by 4, and indexes the 4-entry jump table
  off_80E95C8, tail-calling the selected Thumb handler with lr set via 'mov lr, pc' so handlers return
  through 'pop {pc}'. The handlers are battle_beastOutTransformAction (state 0), sub_80E96C6 (state 1),
  sub_80E9714 (state 2), and ai_clearRelatedFlagAndEndAction (state 3, apparently the terminal/cleanup
  step). This is the classic per-frame action/state-machine dispatcher pattern for a battle object, here
  specifically the beast-out transformation sequence.
