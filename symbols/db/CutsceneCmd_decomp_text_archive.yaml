name: CutsceneCmd_decomp_text_archive
address: '0x08037AB6'
kind: function
status: confirmed
summary: Cutscene script command that loads a text archive (decompressing it first if needed) and stores its pointer
  in the cutscene state.
interface: u32 CutsceneCmd_load_text_archive(CutsceneState *r5 /* state */, u32 r2, u32 r3, u8 *r7 /* script cursor
  */, void *lr)
details: 'Implements a cutscene/map-script command ("load text archive"). Reads a 32-bit operand from the script
  stream via ReadMapScriptWord into r4. If the value is negative (top bit set), it is treated as a pointer to a
  compressed text archive (CompText) and is passed to DecompressTextArchiveForCutscene, which returns a plain TextScriptArchive*;
  otherwise the value is used directly as an uncompressed TextScriptArchive pointer. The resulting pointer is stored
  at r5 + oCutsceneState_TextArchivePtr in the cutscene state. The script cursor in r7 is advanced by 5 (command
  byte + 4-byte operand), and the command returns 1 in r0 (the "continue/advance" status shared by cutscene commands).
  Returns flags: n/z from `mov r0,#1`, c/v from the cursor increment. r6 is set to 1 before ReadMapScriptWord, apparently
  as an argument/size selector for that helper (word-sized read).

  '
