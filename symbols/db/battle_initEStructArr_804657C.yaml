name: battle_initEStructArr_804657C
address: '0x0804657C'
kind: function
status: confirmed
summary: Initialises the 15-slot eStruct array at eStructArr2008450, zero-filling it and marking every slot as free
  with element/type byte 0x20 and its slot index.
interface: 'void sub_804657C(void); // in: none; out: r0/r1 clobbered (r1 = whatever ZeroFillByWord left), Z=1 C=1
  V=0 from the loop''s final cmp; r2-r7,lr preserved'
details: 'Zero-fills 0x528 bytes at eStructArr2008450 (15 entries of 0x58 bytes each) via

  ZeroFillByWord, then walks the array with a 0x58-byte stride: for each of the 15

  entries it stores 0x20 at +2 (looks like an element/object type or "slot empty"

  marker) and the 0-based entry index at +3, so each slot already knows its own ID.

  This is a classic pool-reset: after this, every entry is a uniform free slot with

  a valid index, ready for battle code to claim entries by rewriting +2/+3 and the

  rest of the per-entry fields.

  Quirks: does not restore r1 after the ZeroFillByWord call, and the caller receives

  the NZCV flags from the init loop''s last `cmp r7, #0xF` (Z set, C set, V clear).

  '
