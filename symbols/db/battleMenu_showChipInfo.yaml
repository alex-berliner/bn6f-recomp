name: battleMenu_showChipInfo
address: '0x08047A96'
kind: function
status: probable
summary: On confirmation in the battle-menu chip browser, looks up the selected entry's 8-byte record
  and runs the matching chatbox description script (with event-flag-dependent variants); passes halfword+2
  as text-id, byte+4, and CDC-scaled halfword+6 to chatbox_setTextParams.
interface: '(r5 = battle-menu state struct: u8 cursor@0x14, u16 page@0x18, mode-ptr@0x1C, TextScriptArchive*@0x24)
  -> none; selects script index in r7 and plays a sound effect'
details: 'Reads the 8-byte record at byte_2019A00 + (col+page)*8 (pointer saved to [r5,#0x20]); fields:
  byte0=kind (0-3, kind 3 adds 0x90 to the text id at halfword+2), byte1=variant flag, halfword+6=numeric
  param routed through sub_8047CDC (x100 unless a global mode==1). Those three values go to chatbox_setTextParams.
  If *(u32*)[r5,#0x1C]==2 it additionally tests event flags 0x1E20+id and 0x2420+id (acquired/seen flags)
  and sub_8048F68(id) to choose among script indices 0x18-0x1D; otherwise it picks script 5/4/0xB by kind
  after a stub check (failure path plays SOUND_CANT_JACK_IN and returns without text). Success path plays
  SOUND_SELECT then chatbox_runScript([r5,#0x24], index).'
