name: battle_setObjectToArmAnchorPos_8110D18
address: '0x08110D18'
kind: function
status: confirmed
summary: Repositions a battle object at the fixed-point coordinates of its "part 5" arm/anchor position derived
  from its name ID, alliance, and facing.
interface: void sub_8110D18(u32 object /* r5 = battle object struct */); outputs r5/r6/r7 unchanged (entry values),
  r4 preserved; flags clobbered
details: 'Reads the battle object at r5: halfword oBattleObject_NameID, byte

  oBattleObject_Alliance, byte oBattleObject_DirectionFlip. Passes these plus

  part ID 5 to getBattleArmPositionMaybe_8018810 (getBattleArmPositionMaybe_8018810

  returns the anchor x in r0, y in r1, and a value in r5 that is carried on).

  Then calls sub_80E8124 with the position as fixed point: r1 = x << 16,

  r3 = y << 16, r2 = 0, r4 = 0, r5 = the value left by the position routine;

  sub_80E8124 returns something in r3 which is discarded. Net effect: the

  object''s drawn/position state is snapped to where its buster-shot anchor

  (arm position, part 5) sits for its current identity and facing. The

  push/pop {r4-r7,lr} is pure register preservation — r5/r6/r7 are returned

  exactly as entered, so callers see this as a no-op on registers besides

  flags; r4 is handed to sub_80E8124 as 0 and still restored on exit.

  '
