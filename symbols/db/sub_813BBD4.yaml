name: sub_813BBD4
address: '0x0813BBD4'
kind: function
status: confirmed
summary: Initializes a battle-related state buffer plus three 0x31-byte I/O scratch buffers pulled from the toolkit,
  then runs the battle sub-init sequence (layout, sprite/cell setup, etc.) on the state buffer.
interface: 'void sub_813BBD4(u32 toolkit_ptr /* r10 */);

  // returns nothing; r4..r8 preserved, r9/r10 clobbered, NZCV clobbered, r0..r3 / lr clobbered

  '
details: "Reads a 32-bit pointer from \"oToolkit_Unk200431c_Ptr\" at (r10) into r7; that pointer\nis the \"battle\
  \ state\" object (passed to all later sub-inits as the first argument).\n\nThen ZeroFillByByte is called four\
  \ times:\n  - 0x10 bytes at the state pointer itself\n  - 0x31 bytes at \"unk_2006CF8\"\n  - 0x31 bytes at \"\
  unk_2006C88\"\n  - 0x31 bytes at \"unk_2006CC0\"\nThe three 0x31-byte buffers at 0x2006xxx in WRAM are typical\
  \ for cell/sprite\nupload work-buffers used by the battle sprite pipeline in this game.\n\nAfter zeroing, the\
  \ routine fires a fixed init pipeline on the state pointer:\n  sub_813BC1C(state)   // likely primary layout /\
  \ struct population\n  sub_813BC98(state)   // secondary init\n  sub_813BD24()        // global init (no arg)\n\
  \  sub_813BE8C()        // global init (no arg)\n  sub_813BEA8()        // global init (no arg)\n  sub_813C584(state)\
  \   // likely final wiring / start hook\n\nAll non-preserved registers and flags are free to be clobbered; r4..r8\
  \ are kept\nacross the call, suggesting the callers rely on those locals being untouched.\nThe body is a pure\
  \ tail-call to sub_813C584 (mov r0,r7; bl ...; pop {r4-r7,pc}).\n"
