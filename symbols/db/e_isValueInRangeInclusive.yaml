name: e_isValueInRangeInclusive
address: '0x0800E708'
kind: function
status: probable
summary: Returns 1 if r2 is between r0 and r1 inclusive (either order), else 0.
interface: (r0 = bound A, r1 = bound B, r2 = value) -> r0 = 1 if min(A,B) <= value <= max(A,B), else 0;
  flags clobbered
details: Pure three-argument predicate with no memory or callee access. It first handles the equality
  short-circuits (value == A or value == B yields 1), then branches on whether A <= B or A > B and checks
  the value against the lower and upper bounds, so the two bounds can be given in either order. Equivalent
  to (A <= v && v <= B) || (B <= v && v <= A). Typical use is a coordinate-in-span test, e.g. checking
  whether a row/column/panel index lies between two endpoints in battle logic.
