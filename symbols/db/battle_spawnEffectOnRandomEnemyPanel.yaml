open_questions:
- Which in-game attack/chip uses this (effect IDs 0x21 vs 0x16) — callers sub_80BCF7A/sub_80BD156 would
  tell
- Whether the sweep also should include the object's own starting column or stops strictly at adjacent-and-beyond
- Exact meaning of oBattleObject_Param1 selecting the 0x16 variant
