name: battleObject_phaseTickToNext_80D458C
address: '0x080D458C'
kind: function
status: confirmed
summary: Ticks a battle object's phase timer and, when it expires, resets it to 8 and moves the object to phase
  4.
interface: void battleObject_phaseTickToNext_80D458C(struct BattleObject* obj /* r5 */)
details: 'Operates on the BattleObject in r5 using the standard struct offsets. On the first

  invocation for a phase (oBattleObject_PhaseInitialized == 0) it sets the initialized

  byte to 1 and seeds oBattleObject_Timer (16-bit) from oBattleObject_Param2 (read as a

  byte, so the seed is 0-255). Each call then decrements the timer; while it remains

  positive the call returns without further effect. Once the timer reaches 0 (or wraps

  below), the timer is reloaded with 8 and oBattleObject_CurPhaseAndPhaseInitialized is

  written as 16-bit value 4 — writing the phase also clears the PhaseInitialized bit

  packed into the same field, so the next cycle re-seeds the timer from Param2 again.

  No other state is touched; r0 and the NZCV flags are clobbered, no results returned.

  '
