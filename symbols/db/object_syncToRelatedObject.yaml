name: object_syncToRelatedObject
address: '0x080BFE24'
kind: function
status: probable
summary: Loads a new sprite, then mirrors the animation (with Param1/Param2 offsets), flip, and panel
  coordinates from RelatedObject1Ptr, transitioning the object to CUR_STATE_UPDATE.
interface: (r5 = battle object) -> void; sets oBattleObject state to CUR_STATE_UPDATE
details: Loads sprite resource 0x15 with arguments (0x80, 8, 0x15) into the object and marks it shadowless.
  It clears bit 1 of the object's Flags, then reads the related object (RelatedObject1Ptr) current animation,
  adjusts it by the object's Param2 (subtract) and Param1 (add), and writes the result into both CurAnim
  and CurAnimCopy before sprite_setAnimation and sprite_loadAnimationData. It then applies the related
  side's flip via object_getFlip, recomputes pixel coordinates from the panel grid, and switches the object
  into the CUR_STATE_UPDATE phase, calling sprite_update and a local follow-up routine at 0x080BFE6E.
  This pattern of copying another object's animation with an offset plus flip strongly suggests a mirror/clone-style
  rendering object kept in step with its source.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: loads sprite (r0=0x80, r1=8, r2=0x15) then sprite_noShadow, indicating a fresh placeholder-free
    sprite setup; anim = related.CurAnim - Param2 + Param1 written to both CurAnim and CurAnimCopy before
    sprite_setAnimation; object_getFlip result passed to sprite_setFlip, mirroring the related object's
    facing; object_setCoordinatesFromPanels keeps the copy aligned to its source's panels; stores CUR_STATE_UPDATE
    into oBattleObject_CurStateActionPhaseAndPhaseInitialized and tail-calls sprite_update
  refs:
