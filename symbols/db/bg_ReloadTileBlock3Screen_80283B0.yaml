name: bg_ReloadTileBlock3Screen_80283B0
address: '0x080283B0'
kind: function
status: confirmed
summary: Runs a companion setup routine (sub_80283C8) and then loads a 15x6-tile background screen from the tile
  map at unk_2035186 into 32x32 tile block 3.
interface: void sub_80283B0(void) — takes no meaningful inputs (r4/r5/r10 are caller state it must preserve); returns
  nothing, with r0-r3 and NZCV left as CopyBackgroundTiles leaves them
details: 'Wrapper that first calls sub_80283C8 (re-initializing whatever state that routine tracks), then performs
  a single background tile copy: CopyBackgroundTiles(j=0, i=13, tileBlock32x32=3, tileIds=unk_2035186 (0x2035186),
  j_size=15, i_size=6). The tile map lives in IWRAM at 0x2035186 and describes a full-width screen of 15 tiles by
  6 tiles (240x96 pixels), copied into tile block 3 at row offset j=0, column offset i=13 within the 32x32 block.
  Saving/restoring r4 and r5 is needed because the arguments are passed through those registers. The fixed destination
  (block 3, i=13) suggests this refreshes a specific overlay or window area of the background rather than the whole
  screen.

  '
