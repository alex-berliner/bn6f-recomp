name: object_spawnSelfPanelCollisionRegion
address: '0x080EF30A'
kind: function
status: probable
summary: Spawns a collision region covering the battle object's current panel, using a fixed parameter
  blob.
interface: (r5 = battle object ptr, implied) -> r0 = object PanelX, r1 = PanelY, r2 = 5, r3 = 0, r4 =
  &0x3205FF83 blob, r6 = 0, r7 = 0x4600 -> calls object_spawnCollisionRegion; no return value used
details: This is a thin wrapper that reads the object's PanelX and PanelY from the battle object struct
  at r5 and immediately calls object_spawnCollisionRegion with them, so the collider is created at the
  object's own panel. The size/shape argument is 5 and an argument is 0; r4 points to a single hard-coded
  word 0x3205FF83, presumably a packed field of collider parameters (kind/flags/extent). r6 = 0 and r7
  = 0x4600 are additional fixed arguments to the callee, likely damage or property values. Because r5
  is not set inside the function, the caller must have the object pointer live in r5 before calling. Its
  only known use is from sub_80EF29C, so the exact gameplay meaning of the 0x3205FF83 blob and 0x4600
  is not yet confirmed.
