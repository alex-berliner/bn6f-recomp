name: getCurNaviStatTier_8014150
address: '0x08014150'
kind: function
status: confirmed
summary: Returns 2/1/0 depending on which of two unlock/stat flags (0x38, then 0x37) is set on the currently equipped
  PET Navi.
interface: int getCurNaviStatTier(void) // preserves r4, r10; result in r0
details: 'Calls GetCurPETNavi to get the current navi id, then reads navi stat byte 0x38 via GetCurPETNaviStatsByte.
  If it is nonzero the function returns 2. Otherwise it re-fetches the navi id and reads stat byte 0x37; if that
  is nonzero it returns 1, and if it is also zero it returns 0. So the return value is a small priority tier: byte
  0x38 outranks byte 0x37, and no flag set yields 0. No flags are used for the result; only the Z flag from tst
  drives branching. The navi id is fetched twice (once per stat byte read) even though it cannot change in between.
  The caller-side contract shows r4 and r10 as inputs, but the routine never reads them - it only uses r4 as a local
  result holder (preserved across the calls) - so the real interface takes no arguments. Register contract note:
  nz/c/v clobbered, r0/r3 outputs (r3 presumably from the bl stubs), lr clobbered.

  '
