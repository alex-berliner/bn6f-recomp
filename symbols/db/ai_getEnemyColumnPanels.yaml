name: ai_getEnemyColumnPanels
address: '0x08111CBA'
kind: function
status: probable
summary: AI helper that counts the panels of a filtered column on the opponent's side, skipping the lookup
  when a stored AI attack variable already matches that side's parameter index.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = number of panel IDs written by the filtered
  column scan, or 0 if the early-out check matched; clobbers r4/r7 use internal to caller frame
details: 'Reads oBattleObject_Alliance and flips it with eor #1 to get the opposing team, then computes
  (alliance^1)*5+1, an index into the alliance-dependent panel-effect parameter table (stride 5, +1 for
  the non-zero variant). If this index equals oAIAttackVars_AttackBoost2 the function returns 0 without
  doing anything. Otherwise it calls GetAllianceDependentPanelParamArgs with that index to fetch the enemy
  side''s panel-effect param word and args pointer, then swaps r7/r4 and calls object_getPanelsInColumnFiltered,
  which fills a caller buffer with panel IDs passing object_checkPanelParameters and returns the count.
  The count (or 0) is the function''s return value.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_Alliance]; eor r0,#1; mul r0,#5; add r0,#1 — indexes the panel-param
    table by the opposite team; ldrb r1,[r7,#oAIAttackVars_AttackBoost2]; cmp; beq-style early return
    0; bl GetAllianceDependentPanelParamArgs with the computed index fetches enemy-side panel effect params;
    bl object_getPanelsInColumnFiltered — fills a buffer with filtered panel IDs and its return value
    is the function's result; recorded on battlesweep and beastsp routes, both AI decision contexts
  refs:
  - bn6f/asm/asm32.s:8012
  - 0x081096FA GetAllianceDependentPanelParamArgs
  - 0x0800CFDC object_getPanelsInColumnFiltered
  reproduce: python3 tools/asmcat.py 0x08111CBA
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-200615'
