- meaning of bit 0x2 in oObjectHeader_Flags (hide? blink-off?) — needs a caller or the renderer that reads
  the flag
- which objects use it and what initial Timer value callers set
- The code unconditionally sets flag bit 0x2, then clears it if timer bit 1 is 0, producing a 2-frame
  blink, then decrements the timer by 1; when it goes negative (bge not taken) it clears the flag and
  stores CUR_STATE_DESTROY. The summary's 'remaining Timer frames' phrasing and the name are mostly right,
  but the proposed interface says r5 is the object header ptr, while it is the battle object (oBattleObject_*
  fields). A better name focuses on the destroy-after-blink behavior.
