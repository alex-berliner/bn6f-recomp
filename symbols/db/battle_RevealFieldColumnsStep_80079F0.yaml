name: battle_RevealFieldColumnsStep_80079F0
address: '0x080079F0'
kind: function
status: confirmed
summary: 'One step of the battle-start field reveal: applies the panel column pattern to the battle field, then
  advances the battle-state script to step 8 and resets its timer.'
interface: Next sub_80079F0(BattleState* r5); /* r5 = battle state struct; r4,r6,r7,r10,lr preserved; returns with
  Z flag set (mov r0,#0) */
details: 'Runs a single frame/step of the sequence that reveals the battle field at the start of a battle. It calls
  GetBattlePanelColumnPattern to obtain which columns of panels the reveal effect should cover, then calls sub_800BF88
  with the pattern (r1) and the battle field id read from BattleState+0x06 (oBattleState_BattleField) to apply that
  pattern to the field layout. It then calls sub_800A3E4 to let the field effect play out, and advances the battle
  state script: stores 8 into BattleState+0x01 (oBattleState_Index_01) and clears the 16-bit timer at BattleState+0x02
  (oBattleState_Unk_02_03). The final mov r0,#0 leaves the Z flag set, so callers can branch on equality after the
  call. r5 is the battle state struct and is preserved alongside r4-r7.

  '
