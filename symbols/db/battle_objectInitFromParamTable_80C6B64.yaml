open_questions:
- Exact meaning of the per-entry byte[0..3] beyond graphic id / anim / timer / target panel — e.g., is there an
  embedded palette table behind the pointer?
- What game entities actually use byte_80C6B00 (viruses, minion Navi summons, environmental objects, projectiles).
  The function is a generic dispatcher, so the table is shared by several callers.
- Whether 0xA6 is the universal spawn blip or whether it varies by Param1 (the function plays a single fixed SFX,
  but table could redundantly encode it).
- The meaning of bit 0x10 of object_getPanelParameters' return value across the whole battle-field grid (what panel
  class it represents).
- Whether CUR_STATE_UPDATE is exactly 4 here or just happens to coincide with other constants; the define `#define
  CUR_STATE_UPDATE 4` was carried over from a sibling function and may need re-checking against the state enum.
