name: battle_objectInitFromParamTable_80C6B64
address: '0x080C6B64'
kind: function
status: confirmed
summary: Spawns a battle object (e.g., a virus, minion, or effect) on the current panel using a per-Param1 sprite/animation
  table entry, then transitions it to its update phase.
interface: "/* sub_80C6B64(r5 = oBattleObject*, lr) -> r0 (CUR_STATE_UPDATE on success,\n   or result of object_freeMemory\
  \ on abort), flags from last callee */\nvoid sub_80C6B64(u32 r5 oBattleObject*);\n/* preserves r4, r5, r6, r7,\
  \ r10; clobbers nzcv + r0..r3, lr */\n"
details: "The function is the \"construct-from-table\" / spawn entry for battle objects whose\nappearance is driven\
  \ by a 4-byte-per-entry lookup table at byte_80C6B00, indexed\nby oBattleObject_Param1. It performs the full spawn\
  \ sequence:\n\n1. Panel validation: calls object_isCurrentPanelValid and aborts (object_freeMemory)\n   if the\
  \ current panel is invalid.\n2. Panel-type gate: reads the object's panel (oBattleObject_PanelX / _PanelY),\n\
  \   fetches panel parameters via object_getPanelParameters, and requires bit 0x10\n   (PANEL_TYPE_FLAG) to be\
  \ set; otherwise aborts.\n3. Looks up the per-Param1 table entry (size 4 bytes) at\n   &byte_80C6B00[Param1 *\
  \ 4] and stashes the pointer into\n   oBattleObject_ExtraVars for the lifetime of the object.\n4. Loads a sprite\
  \ with sprite_load (mode 0x10, the table entry's first byte as\n   graphic id, with the entry pointer itself passed\
  \ in r4 as the 4th arg,\n   presumably a palette/arg slot), then strips the shadow with sprite_noShadow.\n5. Sets\
  \ OBJ_FLAG_HAS_SPRITE (bit 1) on oObjectHeader_Flags, copies byte[1] of\n   the table entry into both oBattleObject_CurAnim\
  \ and _CurAnimCopy, and runs\n   sprite_setAnimation + sprite_loadAnimationData.\n6. Writes byte[2] of the entry\
  \ into oBattleObject_Timer (16-bit), sets\n   oBattleObject_Timer2 = 4, and forces palette index 0 with sprite_setPalette.\n\
  7. Mirrors the object's horizontal flip onto the sprite\n   (object_getFlip -> sprite_setFlip).\n8. Reads byte[3]\
  \ (target panel) from the entry and calls\n   battle_objectDispatchPanelChange_80C6CFC with the object's current\
  \ panel\n   coords and that target, then calls object_setCoordinatesFromPanels to snap\n   to panel coords.\n\
  9. Allocates collision data via object_createCollisionData; aborts on failure.\n   Collision dimensions depend\
  \ on the target panel byte: target == 0xFF means\n   \"fixed / no movement target\" and gets a 4-wide x 5-tall\
  \ hitbox; otherwise\n   (e.g., a moving projectile/crawler) the width is 0xA. Height is always 5,\n   flag is\
  \ 3.\n10. Marks the collision slot active (writes 1 to col[1]), sets hit effect 0xFF\n    via object_setCollisionHitEffect,\
  \ and calls object_presentCollisionData.\n11. Plays spawn SFX 0xA6 and writes CUR_STATE_UPDATE (4) into\n    oBattleObject_CurStateActionPhaseAndPhaseInitialized,\
  \ transitioning the\n    object into its per-frame update phase.\n\nQuirks: r4 is used as both a callee arg register\
  \ (carrying the table-entry\npointer into sprite_load and into the collision path) and as a local, so the\nfunction\
  \ explicitly saves/restores r4 and r7 via push {r4,r7,lr} / pop\n{r4,r7,pc} despite the disassembly contract.\
  \ R5 is the implicit object handle\n(oBattleObject*). The 0xFF target sentinel behaves as a \"stationary object\"\
  \nswitch for collision sizing. PANEL_TYPE_FLAG 0x10 is the same bit used by\nother battle-object spawners in this\
  \ area as the \"can-spawn-here\" panel bit.\n"
