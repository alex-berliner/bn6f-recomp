name: object_initScriptedFlight
address: '0x080D9D6C'
kind: function
status: probable
summary: 'Initializes a battle object (sprite 0x80/0xC, anim 5, HP 40): computes a flight angle and polar
  velocity (mag 0x2C000) toward Param3/Param4 panel coords, then uses battle_calcTargetApproach with descriptor
  dx=0, dy=-40, dz=0x1770 and speed 0xA0000 to fly the object in over a fixed frame count, allocates its
  collision (setup 0x4E/0x14/0, status 0x20), and self-frees if no collision slot is available.'
interface: (r5 = battle object header) -> void; on collision-slot allocation failure the object is freed
  instead
details: Sets object flag bit 1, loads sprite (0x80, 0xC, 2), sets animation 5 with CurAnimCopy=0xFF,
  then updates and checks for a shadow. Copies Param3/Param4 into FuturePanelX/Y and converts them to
  pixel coordinates, then computes the angle from the object's current position (fields at r5+0x34..0x37)
  to the target via calcAngle_800117C, storing it in DirectionAngle. Uses math_getPolarVector with magnitude
  0x2C000 to fill X/YVelocity, and battle_calcTargetApproach with the descriptor at byte_80D9E1C (dx=0,
  dy=-40, dz=0x1770) and speed 0xA0000, storing the Z step in ZVelocity and the frame count in Timer —
  i.e. a scripted high-arc approach from the air. Sets HP and MaxHP to 0x28 (40), allocates collision
  data (setup 0x4E/0x14/0, status effect 0x20, clears collision region), sets CurState to CUR_STATE_UPDATE,
  and calls sub_80D9E24. If object_createCollisionData returns zero (no slot), the object frees itself.
