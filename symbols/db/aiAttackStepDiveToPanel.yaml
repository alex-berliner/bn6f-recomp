name: aiAttackStepDiveToPanel
address: '0x080FF322'
kind: function
status: probable
summary: 'AI attack step: enemy teleports above the target panel, dives down over 10 frames, and signals
  a hit when it lands.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value, updates object Z/panel/anim
  and AI vars
details: 'Two-phase step routine keyed off oAIAttackVars_AttackElement: zero means ''start dive'' — element
  is set to 4, anim 0xE is selected, the object is moved to TargetPanelX/Y (fields copied into oBattleObject_PanelX/Y,
  pixel coords and collision panels refreshed via callees), Z is set to 0x780000 with sprite_noShadow
  applied, ZVelocity to 0xC0000 and StepTimer to 10. Each later frame subtracts ZVelocity from Z (0x780000/0xC0000
  divides exactly into the 10-frame timer), so the object descends linearly onto the panel. When StepTimer
  reaches 0, Z is clamped to 0 and 0xC is written to oAIAttackVars_HitElement, which presumably triggers
  the attack''s damage application elsewhere. No shadow while airborne keeps the dive visually clear of
  the ground.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'setup branch: strb #4 AttackElement, anim 0xE, copy TargetPanelX/Y to oBattleObject_PanelX/Y
    then bl object_setCoordinatesFromPanels / object_updateCollisionPanels; Z=0x780000 with ZVelocity=0xC0000
    and StepTimer=10: 0x780000/0xC0000 = exactly 10 descent frames; fall branch: ldr Z, ldr ZVelocity,
    sub, str — linear descent each frame until timer expires; landing: when StepTimer hits 0, Z is set
    to 0 and 0xC stored to oAIAttackVars_HitElement (strike flag); bl sprite_noShadow on entry to the
    dive confirms airborne state'
