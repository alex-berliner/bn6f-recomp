status: probable
summary: Adds r0 to the custom gauge (eStruct2035280+0x20), saturating at its 0x4000 maximum.
interface: (r0 = amount to add) -> custom gauge updated; r0-r2 clobbered
details: Read-modify-write of the custom gauge halfword with a clamp at 0x4000, the same maximum SetCustGauge
  enforces. Its caller battle_dispatchNextPhase calls it with r0 = 13 once per frame unless time is stopped,
  so the gauge goes from empty to 0x4000 in 1261 frames (about 21 s at 60 fps) when nothing else changes
  it.
