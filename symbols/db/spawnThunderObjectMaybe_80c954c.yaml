  the related-object pointer (oBattleObject_RelatedObject1Ptr). The "thunder" guess in

  the original name is unconfirmed; type 0x2A is the only evidence of the object''s role.

  Callee-saved (r4, r5, r6, r7) are preserved. r3 returns either the source object''s

  alliance/direction halfword (on success) or the original element argument (on spawn

  failure). The caller is expected to have r5 = a battle object whose alliance/direction

  should be inherited.


