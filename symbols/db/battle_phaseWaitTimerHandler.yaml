name: battle_phaseWaitTimerHandler
address: '0x080BA490'
kind: function
status: probable
summary: 'Battle-object action-phase handler: phase 0 sets up a timed phase (anim 0xD, 19-frame timer),
  phase 4 counts it down and then ends the action by setting CurAction = 0xC.'
interface: (r0 = battle object, used as r5 via prior register move not shown in snippet; only r5 read/written)
  -> void; sets Z from phase test, no meaningful return value
details: 'Takes the battle object in r5. If oBattleObject_CurPhase is 0 it initializes the phase: writes
  phase 4, animation 0xD into oBattleObject_CurAnim, and a 19-frame countdown into oBattleObject_Timer.
  Otherwise (phase 4 running) it decrements oBattleObject_Timer each call; when the counter reaches 0
  it terminates the action by writing 0xC to oBattleObject_CurAction and clearing oBattleObject_CurPhaseAndPhaseInitialized,
  which sends the object back to its normal action-dispatch state. The tst/bne on phase 0 vs nonzero is
  the standard two-part (init/run) phase-handler shape; the exact meaning of anim 0xD and action 0xC depends
  on which object uses this handler, which is unknown since no callers are identified.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst; bne — classic phase-0-init / phase-N-run handler
    split; phase 0 branch stores phase 4, anim 0xD, and timer 0x13 — a fixed 19-frame wait is set up;
    ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt — phase 4 is a frame countdown loop; on expiry
    writes CurAction=0xC and zeroes CurPhaseAndPhaseInitialized — ends the action like other phase handlers
