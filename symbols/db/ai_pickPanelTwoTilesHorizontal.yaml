  date: '2026-10-19'
  detail: 'ldr r3, off_8114C20 (byte_8114C80, all zeros) then bl GetAllianceDependentPanelParamArgs supplies
    a trivial param table; ldr r4, off_8114C24 (byte_8114C28: 02 00, FE 00, 7F) then bl panelFlagCheck_8015D80
    passes candidate panels at relative x = +2 and -2, y = 0; byte_8114C28 ends with 0x7F terminator,
    matching the picker''s documented relative-offset list format; panelFlagCheck_8015D80 is documented
    as a filtered random relative panel picker used by AI, transforming offsets via object_getEnemyDirection'
