name: ai_pickPanelTwoTilesHorizontal
address: '0x08114C04'
kind: function
status: probable
summary: AI helper that picks a random panel two tiles to the left or right of the object and checks its
  flag state.
interface: (r0 = battle object) -> r0 = result from panel picker (panel/flag-check result); flags from
  callee
details: 'Wrapper around two known utilities: it first calls GetAllianceDependentPanelParamArgs with an
  all-zero parameter table (byte_8114C80, 16 zero bytes, so alliance-dependent params are effectively
  null/zero), then calls panelFlagCheck_8015D80 with the candidate list at byte_8114C28: relative offsets
  (2,0) and (-2,0) terminated by 0x7F. The picker transforms these relative offsets by the object''s facing
  direction and performs the filtered random selection and flag check. So the function asks "is there
  a usable panel two squares ahead or two squares behind the object" (in facing terms). The zero param
  table suggests no special panel-effect filtering is requested. Its only role is supplying this fixed
  candidate list to the shared picker.'
