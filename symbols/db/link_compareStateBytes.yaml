name: link_compareStateBytes
address: '0x0803E88C'
kind: function
status: probable
summary: compares two bytes of eLinkState (+3 vs +4) and returns the comparison in the flags
interface: () -> flags set by cmp eLinkState+4, eLinkState+3 (r0/r1 clobbered); caller uses bgt on the
  result
details: Loads eLinkState, reads the byte at offset 4 and the byte at offset 3, compares them with cmp,
  and returns immediately — pop {pc} preserves the flags, so the function exists to hand a byte-vs-byte
  comparison to its caller. No value is returned in r0. The caller (sub_803E288) sets up a local of 8
  bytes, calls it, and uses 'bgt' to skip a scan loop that walks halfwords looking for values 0x62 and
  0x60. The meaning of eLinkState+3 and +4 is not otherwise shown; they are plausibly two counters or
  indices of the link state (e.g. buffer indices) whose ordering gates the caller's behavior.
