name: GetNaviStatsByte
address: '0x08013704'
kind: function
status: confirmed
summary: Reads a single byte from one of the two navi-stats records (MegaMan's or a second navi's) in the save data.
interface: u8 GetNaviStatsByte(u32 useSecondRecord, u32 fieldOffset) via r0=selector, r1=field offset, r10=toolkit;
  returns r0=byte, r3=address of the byte read
details: 'The selector in r0 is booleanized: any nonzero value becomes 1. The routine then

  computes toolkit->naviStatsPtr (loaded via oToolkit_NaviStatsPtr from the toolkit

  struct pointed to by r10) plus record * oNaviStats_Size, so it addresses an array

  of NaviStats records where record 0 is the default (r0 == 0) and record 1 is the

  alternate (any other r0). It then reads the byte at the requested field offset r1

  within that record and returns both the byte (r0) and the exact address of that

  byte (r3) to the caller. Only flags are clobbered; no memory or other state is

  written, so this is a pure accessor over the navi-stats save structure. The

  dual-record layout implies the game tracks two stat records, most plausibly the

  player''s navi and a second one (e.g. a transformation/other navi''s stats).

  '
