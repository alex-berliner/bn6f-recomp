name: battleObject_stateInitHp50Enemy
address: '0x080D1C5A'
kind: function
status: probable
summary: 'Init-state handler for a battle-enemy object: positions via panels, loads sprite 0x1001031,
  sets HP/MaxHP=50, palette from Param1, derives XVelocity=dir×speed from a Param1-indexed table, computes
  Timer2=0x280000/speed (~26 frames), registers with parent object, then enters update state.'
interface: (r0 = unused/scratch, r5 = battle object header) -> r0 = success flag from sprite init; object
  state updated in place
details: The routine first recomputes the object's pixel position from its panel coordinates, then tries
  battleObject_initSpriteAndCollision with fixed sprite id 0x1001031 and animation data 0xC0D0000; on
  failure it spawns an effect at object+0x34 and frees the object's slot. On success it sets object flag
  bit 1, selects hit-effect type 4, and sets HP and MaxHP to 0x32 (50). It uses Param1 as an index into
  byte_80D1CE4 (word at Param1*4 = speed 0x18000, word at Param1*4+0x18 = 0xE666) stored into ExtraVars,
  then sets XVelocity = object_getFrontDirection() * speed (fixed-point). Timer2 is computed as 0x280000
  / (frontDirection * speed) via SWI 6 (Div), giving about 17 frames. It increments a counter at offset
  0 of the object referenced by RelatedObject1Ptr, stores its own pointer into the list at ExtraVars+8,
  and writes CUR_STATE_UPDATE into oBattleObject_CurState.
