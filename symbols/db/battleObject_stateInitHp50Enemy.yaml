    r0,#0x34; ldmia r0!,{r1-r3}; bl spawn_t1_0x0_EffectObject; bl object_freeMemory — aborts spawn via
    effect+free; strh r0,[r5,#oBattleObject_HP]/MaxHP with r0=0x32, and bl sprite_setPalette with Param1
    — per-instance HP and palette config; table byte_80D1CE4 indexed by Param1*4 (0x18000 speed words,
    0xE666 secondary words) feeding XVelocity = frontDirection * speed; ldr r0,[r5,#RelatedObject1Ptr];
    add r1,#1; str plus str r5,[ExtraVars+8]; mov r0,#CUR_STATE_UPDATE — links to parent, self-registers,
    transitions to update state'
