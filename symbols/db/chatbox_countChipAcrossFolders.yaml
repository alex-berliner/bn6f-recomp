name: chatbox_countChipAcrossFolders
address: '0x08021C02'
kind: function
status: probable
summary: Scans the chip-folder table over a count of folder entries from unk_20018EC, returning how many
  matching id+code slots the player also holds in the pack, used by chatbox chip-script conditions.
interface: (r0 = chip id, r1 = code letter value) -> r0 = number of matching slots found; flags set by
  final compare/pop
details: Reads a count from toolkit S2001c04 byte 5 and iterates that many entries of the byte list at
  unk_20018EC, using each byte's high nibble as a folder index (x0x3C stride) into the chip-folder table
  at oToolkit_S_Chip_2002178_Ptr. For each of the 30 halfword slots (0x3C bytes per folder) it masks 0x1FF
  for the chip id and shifts >>9 for the code, comparing both against r0/r1. On a match it calls pack_hasChipOfCode_8006EA4
  with the same id/code and only increments the tally if the player also holds that chip in the pack.
  Returns the total count in r0. The low nibble of each list byte is ignored.
evidence:
