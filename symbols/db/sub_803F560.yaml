name: sub_803F560
address: '0x0803F560'
kind: function
status: confirmed
summary: Returns a link-battle state code (0xFF, 0x80 or 0) by checking the current battle mode and, in mode 2,
  polling the link partner and the four link slots.
interface: u32 battle_getLinkStateCode_803F560(void); /* out r0 = code (0xFF/0x80/0), out r1 = path-dependent (partner
  value, leftover, or 0); N/Z set from r0, C=V=0; r4-r7 preserved */
details: 'First asks sub_803DEB4 for the current battle/mode code. Mode 4 keeps the

  default code 0xFF; any mode other than 2 or 4 forces 0x80; mode 2 (link

  battle) takes a polling path: it calls sub_813DB24(0, 1) to query the link

  partner. If that returns 0xFF the code stays 0xFF and r1 receives the

  callee''s r2 (the partner''s answer); otherwise it loops over the four link

  slots 0..3 calling sub_8144D04(slot), and if slot 1 or slot 3 reports state

  2 the code is dropped to 0 (and r1 is set to 0). Slots 0 and 2 are ignored

  for the downgrade even though they are polled. r4 is bumped once per loop

  iteration by the original but is restored on exit (only pushed/popped, never

  read). The literal pool references eLinkState. The trailing "mov r0, r6" is

  an ADDS, so N/Z reflect the returned code and C/V end up clear.

  Likely used to gate behaviour during link battles / tag-style setups where

  partner slots are odd-numbered (1 and 3).

  '
