  reproduce: grep -n -w unk_2022B70 bn6f/ewram.s
  result: 'proposed by minimax/MiniMax-M3, self_score 4; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate-data investigate-data-20261020-192515'
open_questions:
- What occupies the remaining two bytes of the 8-byte block; sub_813677C only copies 8, but only 6 are
  documented as the tracked-object-tags list
- Whether a zero slot means 'no entry' or an entry whose tag happens to equal zero (the asm uses tst/beq
  to skip zero-value slots when picking Beast-Out attrs)
