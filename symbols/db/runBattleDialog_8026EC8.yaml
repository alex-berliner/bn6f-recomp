name: runBattleDialog_8026EC8
address: '0x08026EC8'
kind: function
status: confirmed
summary: Picks and runs the battle tutorial / battle-run text script and plays the unselect jingle.
interface: 'void sub_8026EC8(u32 base_r4 /* r4 */, u32 state_ptr /* r5 */); // out: r2 r3 r5 r6 r10; clobbers
  nzcv r0 r1 lr'
details: "Calls GetBattleEffects; if bit 0x20 is set (battle-run branch), writes 4 to\nstate_ptr->+2 and\
  \ runs A_TextScriptBattleRunDialog at script index base_r4.\nOtherwise writes 8 to state_ptr->+2 and:\n\
  \  - if GetBattleMode() == 5: runs the first-battle tutorial slot at\n    A_TextScriptFirstBattleTutorials+0xC\
  \ with script_idx 0x23.\n  - else reads state_ptr->+0xC byte as a tutorial index; 0xFF means use\n \
  \   A_TextScriptBattleRunDialog at base_r4+3, otherwise indexes the\n    first-battle tutorial table\
  \ by idx<<2 with script index from\n    A_byte_8027034[idx].\nThen calls PlaySoundEffect(SOUND_UNSELECT_7B).\n\
  r4 is the base of a run-away text-script index table; r5 points to a small\nbattle-state object (off_t\
  \ result slot at +2, tutorial byte at +0xC).\n"
