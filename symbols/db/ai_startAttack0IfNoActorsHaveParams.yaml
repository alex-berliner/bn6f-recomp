name: ai_startAttack0IfNoActorsHaveParams
address: '0x08115F2E'
kind: function
status: probable
summary: 'Enemy AI attack handler: starts a charge attack (object_setAttack0 type 0xA) with version-specific
  stats unless some actor has the three checked parameters set.'
interface: (r4 = AIData actor, r5 = battle object, r6 = AI state, r7 = AIAttackVars) -> r0 = 0; clears
  oAIState_ScriptId
details: First counts actors whose parameter 0x64/0xA9/0xAE values are nonzero; if the count is nonzero
  the attack is skipped entirely. Otherwise it fills oAIAttackVars (AttackDuration, Damage, ExtraDamage,
  StepTimer) from four per-version byte tables indexed by oAIData_Version_16, sets ChargeCycles to 0x10,
  sets CurAnim to 1 and ExtraVars+4 to 1, calls object_setAttack0 with argument 0xA, and zeroes AttackElement.
  Finally it always stores 0 into oAIState_ScriptId, ending the AI script step. The version tables imply
  the attack's numbers differ between Gregar/Falzar builds or enemy versions.
