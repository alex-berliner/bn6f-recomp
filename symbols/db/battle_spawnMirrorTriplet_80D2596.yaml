name: battle_spawnMirrorTriplet_80D2596
address: '0x080D2596'
kind: function
status: confirmed
summary: Spawns three Type 6F battle objects as a mirrored triplet, with a slot base derived from the
  parent object's alliance XOR direction-flip.
interface: battle_spawnMirrorTriplet(BattleObject *r5, u32 r2, u32 r3, u32 *r4, BattleObject **r5, BattleObject
  **r6) -> r1=lastResult, r5=accumPtr5, r6=accumPtr6; preserves r2, r3, r4
details: Reads oBattleObject_Alliance and oBattleObject_DirectionFlip from r5, computes XOR, negates,
  multiplies by 5, adds 6 to get a slot base (effectively 6 when alliance==flip, 5 when they differ).
  Calls battle_spawnType6FAndInitObject_80D2580 three times with slot indices 1, 2, 3, chaining r4/r5/r6
  forward so each successive call initialises the next object in the triplet. r2 and r3 are saved/restored
  around every call because the callee may clobber them. The embedded data table (0x4040401, then byte
  pairs 8,0 / C,0 / 10,0 / 18,0) sits just past the function and likely indexes into sprite/animation
  parameters consumed by the callee.
