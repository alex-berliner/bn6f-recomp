name: sub_8128A44
address: '0x08128A44'
kind: function
status: confirmed
summary: Renders up to 8 consecutive text glyphs from a script into one row of VRAM tile data, using the chatbox/textbox
  state's start-index and total character count.
interface: "void sub_8128A44(struct ChatboxState* r5 /*in: state ptr, +0x1E = char count, +0x24 = start idx */,\n\
  \                 u32 /*in*/ r10);\n// clobbers r0,r1,r2,r3,r12,NZCV; preserves r4,r6,r7; trashes r8,r9,r11,r12\
  \ via callee\n// returns via r5 (state), r8, r9, r10, r11, r12 from renderTextGfx_8045F8C\n"
details: 'Iterates glyphCount = min(remaining_chars, 8) times (bounded by 0x8). Each iteration

  reads the attribute byte at eTextScript201BF00 + 2*(startIdx+i) and calls

  renderTextGfx_8045F8C with palette slot 0xA, copying one glyph into a 0x280-byte

  VRAM tile slot at 0x6004020 + i*0x280, sourced from byte_2017A00 + i*0x280,

  using dword_86A5D60 and a zero flag, with the 4bpp tile data fetched from

  TextScript873D9FC. The state object (r5) carries the start character index at

  offset 0x24 (shifted left 1 for byte addressing) and the total character count

  at offset 0x1E; when count == startIdx*2 the remaining is 0 and nothing renders.

  Early-returns (locret_8128A8E) skip the loop entirely if char count is zero.

  The pushed register frame {r4-r7,lr} around the loop is to restore the caller''s

  preserved registers after renderTextGfx_8045F8C clobbers them.

  '
