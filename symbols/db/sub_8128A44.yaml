- Is this strictly a "chatbox" renderer, or a generic textbox/bitmap-font row renderer reused by menus and battle
  text? Caller r10 hints at a chatbox/screen state.
- Why is the start index stored halved at +0x24 (it is shifted *1 again to get the byte offset into the attribute
  table)?
- Is dword_86A5D60 a glyph width/stride or a palette/script descriptor?
- The 0x8 max glyphs suggests a fixed 8-tile-wide row (one BG tile map row of 8 columns on GBA).
