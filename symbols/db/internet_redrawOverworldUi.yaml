name: internet_redrawOverworldUi
address: '0x08033B46'
kind: function
status: probable
summary: 'Redraws the Internet-overworld HUD: PET HP digits, battle-start overlay state, an extra UI layer,
  and the current map name.'
interface: (no register args; callee set uses r5 = self * S2011E30) -> no return value; r0 clobbered by
  callees
details: 'A pure composition/sequencing routine: it calls the four drawing steps of the overworld UI in
  order with no logic of its own. First internet_drawHpDigits renders the navi''s HP as four OAM digits,
  then battle_drawBattleStartOverlay is invoked with r0=1 (a forced/one-shot variant) which conditionally
  DMA-loads the battle-start overlay and queues an OAM entry, then sub_8033D88 (still unnamed) adds another
  UI element, and finally RenderMapName draws the zone name. All callees operate on the shared self pointer
  in r5 (struct S2011E30, the overworld screen state), so no arguments are passed through r0-r3 except
  the literal flag to the overlay call.'
