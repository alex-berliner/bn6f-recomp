    overworld UI''; callee battle_drawBattleStartOverlay_8033F80 ''DMA-loads the battle-start overlay
    tilemap/sprite frame and queues a battle-start OAM entry''; callee RenderMapName_8033EE8 draws the
    map/zone name; comment ''(self: * S2011E30 $r5)'' shows the whole callee set shares the overworld
    state struct via r5'
