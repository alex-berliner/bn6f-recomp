name: chatbox_setBgTile
address: '0x0803065A'
kind: function
status: probable
summary: Stores one halfword tile entry into row/column of BG tilemap block 1 in the toolkit's iBGTileIdBlocks.
interface: (r0 = unused, r1 = tile id halfword, r3 = column index, r4 = row index) -> r0 = clobbered (untouched);
  flags untouched
details: 'Reads oToolkit_iBGTileIdBlocks_Ptr from r10-based toolkit struct, selects block 1 via r2=1 shifted
  to 0x800 bytes — the size of one 32x32 halfword tilemap block. Then indexes that block as a halfword
  array: column r3*2 plus row r4*64 (32 halfwords per row) and stores r1. r0 is ignored by the routine,
  suggesting callers pass it incidentally. No flags are set and no callee is invoked.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r7,[r7,#oToolkit_iBGTileIdBlocks_Ptr]; lsl r6,r2,#0xb selects the 0x800-byte block 1; r3*2
    + r4*64 is a halfword row/column index into a 32-wide tilemap; strh r1,[r7,r6] writes the tile value
    passed in r1; r0 is never read, so the first argument is unused at this call shape
  refs:
  - bn6f/asm/asm03_0.s:22790
  reproduce: python3 tools/asmcat.py 0x0803065A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112'
open_questions:
- No callers known, so which UI subsystem (chatbox text vs another BG block user) writes block 1 and what
  r1 contains semantically (tile id vs map entry) is unconfirmed; a caller showing r1 as a glyph tile
  from font rendering would confirm the chatbox role
