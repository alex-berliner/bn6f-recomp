name: battle_crossNetIntroStep
address: '0x08008864'
kind: function
status: probable
summary: Battle-side update step that fires the cross-net battle intro once (effect kind 0x54) and then
  waits until the linked partner reports battle-ready.
interface: (r5 = battle sub-state struct ptr, no r0 args) -> r0 clobbered; writes [r5+2] (halfword), [r5+3]
  (byte), [r5+8] (halfword)
details: 'Called with r5 pointing at a small battle state struct. If the state byte [r5+3] is still 0,
  it performs one-time intro setup: runs dispatch_801DACC on constant 0x824c43 (an id/handle, likely a
  battle intro script or effect resource), clears the matching bits (0x824c43) in the flags word behind
  dword_20352C0 (eStruct2035280), kicks battle effect kind 0x54 via battle_dispatchKindEffect, zeroes
  halfword [r5+8], and sets [r5+3]=4 so the init branch never re-runs. On every call it then polls comm_checkCrossNetBattleReady;
  if the partner session is ready (nonzero return) it returns immediately, otherwise it writes 4 into
  halfword [r5+2], presumably a state/next-step selector or timer that keeps the intro waiting. Quirk:
  [r5+3] is set to 4 rather than 1, so the value also encodes a state, and init is keyed on ''== 0''.'
