name: battle_initBattleStateBuffer_800B144
address: '0x0800B144'
kind: function
status: confirmed
summary: Initializes the per-battle state buffer at dword_203CBE0 (RNG seed, battle settings, Navi stats
  picked by battle mode/effects, weapon arrays, event-flag snapshot) at the start of a battle.
interface: void sub_800B144(u32 r10 /* toolkit ptr */, u32 lr, u32 r6 /* passed through to sub_81209DC
  */); /* clobbers r0,r1,r2,r3,lr,N,Z,C,V; preserves r4,r5,r6,r7 */
details: "Operates on a large battle state struct rooted at dword_203CBE0 (r4). Saves the primary RNG\
  \ seed and the current battle settings (via oToolkit_BattleStatePtr -> oBattleState_BattleSettings)\
  \ into offsets +4 and +8.\n\nPicks how to fill the Navi stats block at +0xC (0x64 bytes) by branching\
  \ on GetBattleEffects bit 0x200000 (use backup Navi stats at dword_203CCE0 and stamp both weapon arrays\
  \ at +0x70/+0x98 with 0x474) versus GetBattleMode:\n  - mode 1 -> sub_80134C8\n  - mode 2/3/4 -> initNaviStats_WithDefaultStatsMaybe_8013438\n\
  \  - mode 5/8 -> initNaviStats_WithDefaultStatsMaybe_8013438, then copy words at +0x3E/+0x40 from the\
  \ current PET-Navi stats, packing the high half into both halves of +0x40\n  - mode 7 -> sub_8013554\n\
  \  - mode 9 -> sub_80135E8\n  - otherwise: copy 0x64 words from the current PET-Navi's stats; if GetBattleEffects\
  \ bit 8, force byte +0x21 to 3; if battle_testFlag0x40_800A8F8 is set, EVENT_163 clear, and current\
  \ PET-Navi is 0, force byte +0x17 to 0xC.\n\nIn non-backup paths it then copies unk_20018C0 to +0x70\
  \ and unk_2000260 to +0x98 (both 0x28 bytes). On the backup path those copies are skipped.\n\nCalls\
  \ sub_81209DC twice (R6 forwarded as caller-supplied, defaulting to the navi_stats pointer on the fallback\
  \ path) and stores the four returned bytes at +0xC8/+0xC9 and +0xCA/+0xCB.\n\nCopies 0x28 bytes from\
  \ the event-flags block at oToolkit_EventFlagsPtr + 0x3C4 into +0xCC, writes stub_alwaysReturnsFalse_8010D20\
  \ into +0xF4.\n\nIf EVENT_163 is set, sub_8121198 -> +0xC0; otherwise 0xFF -> +0xC0. Then sub_803D0F4(flagResult,\
  \ 0xC0) -> +0xC4.\n\nFinalizes by writing the sentinel 0x12345678 at +0 and calling sub_80200A4(0x3E)\
  \ (battle setup SFX/BGM hook).\n"
