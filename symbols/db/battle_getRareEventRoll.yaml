summary: Getter returning the halfword the rare-event roll stored in battle state field 0x38.
interface: () -> r0 = halfword at oBattleState_Unk_38; flags not meaningful
details: 'A three-instruction read-only accessor: it loads the battle state pointer from the toolkit (r10
  + oToolkit_BattleStatePtr) and returns the halfword at offset 0x38. Its only known caller, battle_rollRareEvent,
  writes a scaled random halfword into the battle state during battle setup, so this reads that stored
  roll value back (presumably so later code can compare against it). No flags are set and r1-r3 are untouched.
  The exact meaning of field 0x38 (threshold, timer, or roll result) is not visible from this function
  alone.'
