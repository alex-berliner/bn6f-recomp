name: startScreen_dispatchIfFlag20_802FBB4
address: '0x0802FBB4'
kind: function
status: confirmed
summary: Checks the start-screen object's state halfword for flag 0x20 and, if set, hands a ROM-based record (byte_802FBCC)
  to helper sub_8001158.
interface: void startScreen_dispatchIfFlag20_802FBB4(const StartScreen *self /* r5 */); caller-saved r0-r3, flags
  c/v returned as-is, nz set by the tst
details: "Called with a start-screen object pointer in r5 (preserved by the callee, so this is a\n\"self\" pointer,\
  \ not scratch). Loads the 16-bit state field at self+0xA and tests it\nagainst 0x20. If the bit is clear it returns\
  \ immediately; if set it loads the address of\nbyte_802FBCC into r0 and tail-calls sub_8001158 (a no-args-per-lifter\
  \ helper that takes\nthe record pointer in r0).\n\nbyte_802FBCC is a small literal record embedded right after\
  \ the function:\n  word 0x80544004 (a ROM pointer into the 0x805440xx area),\n  halfword 0x8230, then 6 zero bytes\
  \ of padding.\nSo the call passes {pointer-to-ROM-data, 0x8230}-shaped data; sub_8001158 presumably\ninterprets\
  \ this record (e.g. starting some presentation/sound/script keyed by the\nsecond field). The flag 0x20 in the\
  \ state halfword is one of several per-object state\nbits; this function is a conditional dispatcher, not the\
  \ code that sets the bit.\n\nQuirk: on the not-taken path the function falls through to pop {pc} with the tst\n\
  result left in the N/Z flags, so callers could in principle observe (state & 0x20)\nvia flags, though the lifter\
  \ records c/v as unchanged outputs.\n"
