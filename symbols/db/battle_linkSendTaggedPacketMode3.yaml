name: battle_linkSendTaggedPacketMode3
address: '0x0800B4B2'
kind: function
status: probable
summary: Writes a 0xA9B8C7D6-tagged two-word packet into the outgoing battle link buffer and requests battle mode
  3.
interface: (r0 = passed to sub_800B4CE, r1 = second payload word) -> r0 = 1 from battle_requestSetBattleMode; r4
  consumed as first payload word
details: Calls sub_800B4CE (unknown, possibly producing r4), then stores the magic 0xA9B8C7D6 into dword_203CBE0,
  the tag word of the outgoing battle link packet, and stores r4 and r1 at dword_203CBE4+0 and +4 as the packet
  payload. It then calls battle_requestSetBattleMode_80200A4 with mode 3, which writes mode 3 at eStruct203F7D8+3
  and ORs 1 into the flags byte at +2, so the battle state machine moves to mode 3 right after queuing the packet.
  The tag 0xA9B8C7D6 is a third packet type alongside the known 0x12345678 (battle-start) and 0x1F2F3F4F (result
  record) tags.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r0, =0xA9B8C7D6 / str r0, [dword_203CBE0] — stores a new tag word into the documented outgoing battle
    link packet header; str r4 / str r5(r1) at dword_203CBE4+0/+4 — fills the packet payload right after the tag;
    bl battle_requestSetBattleMode_80200A4 with r0=3 — posts battle mode 3 into eStruct203F7D8 immediately after
    queuing the packet; symdb: dword_203CBE0 is the outgoing link packet tag word sent last, so the receiver waits
    on it — confirming this builds a link packet'
