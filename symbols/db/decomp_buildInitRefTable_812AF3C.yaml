name: decomp_buildInitRefTable_812AF3C
address: '0x0812AF3C'
kind: function
status: confirmed
summary: Builds a 0x64-byte pointer/reference table at unk_201D020 from a fixed 0x60-byte template, resolving each
  group's leading reference via sub_811FB84, then hands the table to decompAndCopyData to decompress the referenced
  data into place.
interface: void sub_812AF3C(void); // no caller-passed registers used; r0-r3 and lr clobbered per ABI (the reported
  r1-r7 "outputs" are caller-side artifacts, since r4-r7 are pushed/popped)
details: 'Reads a 0x60-byte template table at off_812B024 (six groups of four words) and writes a

  rebuilt table to the buffer at unk_201D020. For each group: the first two words are passed

  to sub_811FB84 (r0 = first word, r1 = second word), and its returned value (r0) is stored

  as one entry — this is the "reference resolution" step, presumably turning some

  id/handle pair into a concrete pointer or packed value. The next two words of each group

  are copied through unchanged. The rebuilt table is therefore 24 words, terminated by a

  zero word (total 0x64 bytes). Finally r0 = unk_201D020 and decompAndCopyData is called,

  which consumes the terminated reference list and decompresses/copies the referenced

  data into its destinations. Both source and destination are fixed addresses, so this is

  a one-shot, no-argument setup routine; the loop counters are r6 (write offset) and r7

  (read offset), with r1 as the inner 2-word copy counter. The "initRefs" comment in the

  disassembly supports reading this as game boot/init-time resource loading.

  '
