name: sub_809FE36
address: '0x0809FE36'
kind: function
status: hypothesis
summary: Increments a caller-supplied counter when r4 equals the halfword index/state field at byte_2000210+6; otherwise
  returns the counter unchanged.
interface: int bumpCounterIfMatchesWord2000210_6(int counter /* r0 */, int value /* r4 */)
details: Loads the u16 at byte_2000210+6 (offset 6 of the block at byte_2000210 in IWRAM, apparently some selection/index
  state shared with other routines) and compares it to the value passed in r4. On a match it returns r0+1, otherwise
  r0 unchanged. r4-r7 and lr are preserved; NZCV flags are clobbered by the compare and the add. r5, r6 (used only
  for the pointer load) and r7 are preserved per the contract. The caller also passes r5-r7 as inputs per the contract,
  but the code does not read them beyond r4, so the contract's r5-r7 inputs are likely an artifact of inlining/loop
  context rather than real parameters.
