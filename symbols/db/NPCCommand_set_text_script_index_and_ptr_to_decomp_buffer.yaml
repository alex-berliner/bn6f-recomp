name: NPCCommand_set_text_script_index_and_ptr_to_decomp_buffer
address: '0x0809F3C0'
kind: function
status: confirmed
summary: Overworld NPC script opcode handler that assigns a text script index to the NPC and points it at the text
  decompression buffer, marking it ready to show a chatbox.
interface: 'Next NPCCommand_set_text_script_index_and_ptr_to_decomp_buffer(NPC* r5 npc, u8* r6 cmdArgs); // out:
  r6 = cmdArgs+2, flags (nz c v) and scratch r0/r1/r3 left as byproducts; lr used as return'
details: 'Handler for the "start text script" command in an NPC''s overworld script bytecode. r5 holds the OverworldNPCObject
  and r6 points at the command arguments. It reads the index byte at cmdArgs+1 and stores it in the NPC''s TextScriptIndex
  field, sets the 0x400 chatbox flag in UnkFlags_60 to mark the NPC as having a text script pending, and writes
  the fixed address of the text decompression buffer at byte_202FA04 into the NPC''s TextScriptPtr field (stored
  via offset oOverworldNPCObject_TextScriptPtr). It then advances r6 by 2 (opcode byte + index byte) so the NPC
  script interpreter continues at the next command, and returns using the pushed lr. The ADDS r6,#2 also sets nz/c/v
  flags, which the dispatch loop uses; r0, r1, and r3 end up holding 0x400, the TextScriptPtr offset, and byte_202FA04
  respectively as harmless leftovers. The trailing word data after the return (off_809F3E0 pointing at off_realWorld_8044470
  and off_internet_80444C4) is unrelated nearby data for other tables, not used by this function.

  '
