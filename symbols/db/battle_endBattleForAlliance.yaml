name: battle_endBattleForAlliance
address: '0x080D8DEE'
kind: function
status: probable
summary: Ends the current battle from a battle object's side, marking its alliance slot as finished and
  setting the battle-over condition.
interface: (r5 = battle object, r10 = toolkit) -> r0 = battle_setFlags result unused; sets battle state
  flags bit 8
details: Loads the battle state pointer from the toolkit, reads the object's Alliance field (oBattleObject_Alliance),
  adds 4 to form an offset into the battle state, and stores 0 there — clearing that alliance's condition/counter
  byte. It then writes 1 to oBattleState_BattleOverConditionFlag, selecting battle-over condition 1 (likely
  'all enemies of the alliance deleted'). Finally it calls battle_setFlags with bit 8 to raise the battle-over
  flag in the battle state. The function acts on r5 rather than a passed argument, so it is meant to be
  called with the object held in the high register by its caller.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#oBattleObject_Alliance]; add r1,#4; strb r0,[r2,r1] zeroes a per-alliance byte
    in battle state; strb r1,[r2,#oBattleState_BattleOverConditionFlag] with r1=1 sets the battle-over
    condition to 1; mov r0,#8; bl battle_setFlags raises flag bit 8, matching battle_setFlags' known role
    of ORing bits into battle state flags; r2 comes from [r10,#oToolkit_BattleStatePtr], confirming it
    operates on the active battle state
  refs:
  - bn6f/asm/asm31.s:71929
  - 0x080D8CF0 sub_80D8CF0
  - 0x0800A2D8 battle_setFlags
  reproduce: python3 tools/asmcat.py 0x080D8DEE
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- exact meaning of condition value 1 (enemies deleted vs. other victory type) and of the per-alliance
  byte at alliance+4
- which battle objects use it — caller sub_80D8CF0 is also unnamed; a boss/deletion handler would confirm
  semantics
