name: battle_spawnEStructIfSlotEmpty
address: '0x08130290'
kind: function
status: probable
summary: Refills battle eStruct slot 0 from a fixed spawn table whenever slot 0 is currently unused.
interface: (r0 = unused/0 passed through, r1 = unused) -> r0 = spawned eStruct or 0; flags NZ from slot-0
  in-use byte
details: 'It checks eStruct slot 0 via getStructFrom2008450(0): if the in-use flag byte is nonzero, it
  returns immediately. Otherwise it loads the fixed table pointer byte_812F04C, clears r1 (popped 0 =
  slot 0) and sets r2=0x40, then calls battle_spawnEStructRecordsAtPosition to spawn the table''s records
  into slot 0 and place them on the field. This is effectively a ''keep slot 0 occupied'' respawn pattern
  — the caller (sub_8130464) presumably invokes it periodically so a persistent field object (obstacle/trap)
  re-spawns as soon as its slot frees up.'
