- method: assembly-reading
  date: '2026-10-19'
  detail: bl getStructFrom2008450 with r0=r1=0 checks slot 0's in-use flag; bne locret skips spawn when
    occupied; pop {r1} recovers the pushed 0 so slot=0 is passed to the spawn call; ldr r0, off_81302AC
    loads fixed table byte_812F04C as the record source; bl battle_spawnEStructRecordsAtPosition with
    r2=0x40 spawns/positions the records
