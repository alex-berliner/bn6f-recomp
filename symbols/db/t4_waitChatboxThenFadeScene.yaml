name: t4_waitChatboxThenFadeScene
address: '0x08135AF8'
kind: function
status: probable
summary: Cutscene-style step that waits for the chatbox to become inactive, then sets a scene state, triggers
  a screen fade, and advances before pumping the chatbox handler.
interface: (r0 = unused, r5 = per-scene state struct pointer) -> r0 = clobbered; sets [r5+1] = 8, [r5+2]
  = 0 or 4; no return value
details: 'First it requires two bits of the chatbox/event flag word eFlags2009F38 (0x80 and 0x20) to be
  set, returning immediately otherwise, so it only acts during a specific scripted context. It then reads
  the chatbox state selector: if there is no active text (state == 0) it writes state bytes [r5+1] = 8
  and [r5+2] = 0, calls SetScreenFade(0xC, 0x10) to start a fade, and calls sub_813BAC4 to advance the
  sequence. If text is still showing it instead writes [r5+2] = 4, marking ''wait for the chatbox to finish''.
  In both paths it finishes by calling chatbox_8040818, presumably to run/update the chatbox for this
  frame. The two trailing pool words (0x120, 0x100) are unreferenced in the shown body.'
