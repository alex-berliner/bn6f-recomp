    path writes [r5+1]=8,[r5+2]=0, else [r5+2]=4 (wait flag); state==0 path calls SetScreenFade(0xC, 0x10)
    and sub_813BAC4, i.e. fade the screen and advance the sequence; both paths end with chatbox_8040818,
