name: oAIAttackVars_AiAttackParam
address: '0x34'
kind: struct-field
status: probable
summary: Generic scratch/parameter slot used by AI attack state-machine handlers for per-attack values
  (timers, velocities, pointer-as-int, panel masks, etc.).
details: 'Across ~110 accesses this slot holds wildly different kinds of data depending on the attacking
  Navi/attack: timer counts (e.g. 0x20 decrementing in Wind style attack at asm31.s:133331), pointer/index
  values into a "param args" table returned by GetAllianceDependentPanelParamArgs (asm31.s:175512, asm32.s:8131),
  front-direction multiplier copied into XVelocity (asm31.s:121874), result of sub_80E8770 used as a teardown
  flag (asm31.s:124310), and a packed byte loaded from an offset table (asm32.s:6324). The consistent
  pattern is that it''s the "second parameter word" paired with oAIAttackVars_Unk_38 — same value often
  initialized to the same constant (e.g. 3 in many AttackBoost init blocks), then read back to seed StepTimer
  (asm31.s:157288, asm32.s:1514) or to feed object_checkPanelParameters alongside Unk_38. The field is
  not a u8 — it is loaded/stored as word and halfword in many sites — so the struct size declaration is
  wrong; treat naming as hypothesis until typed.'
