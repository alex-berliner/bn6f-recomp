name: m4aSoundVSyncOff_814EF14
address: '0x0814EF14'
kind: function
status: confirmed
summary: 'm4a''s m4aSoundVSyncOff: takes the PCM DMA off — releases the block''s ident, stops Timer 0, stops the
  repeating PCM DMAs, sets both DMA controls to 32-bit and zero-fills the PCM buffer.'
interface: "static VsyncOffRegisters sound_vsync_off(void) ->\n    VsyncOffRegisters { u32 r2, r3; }\nNext sub_814EF14:\
  \ in lr; out r2/r3 as the original leaves them; r0, r1, LR\nand the flags are documented scratch.\n"
details: 'The live test is (ident - ID_NUMBER) <= 1, spelled as ident + 0x978C92AD

  <= 1; a live block gets ident += 10, then TM0CNT_H = 0, the pause word

  0x84400004 for either PCM DMA still showing m4a''s active bit 0x02000000, and

  0x0400 (32-bit) in both DMA controls. The buffer is cleared by SWI 0xB

  (CpuSet) in CpuFill32 mode 0x5000318 over SoundInfo+pcmBuffer (0x318 words),

  from a zero word reserved on the guest stack. r2/r3 are the register

  contract: the pointer plus the tag constant when offline, else whatever the

  SWI left.

  '
