name: ai_attackElementWindupStep
address: '0x08100894'
kind: function
status: probable
summary: 'AI attack wind-up step: on first call assigns the attack''s element, plays a wind-up anim/effect/sound,
  then after 20 frames arms the strike element.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = clobbered; sets oAIAttackVars_AttackElement/StepTimer/HitElement
  and oBattleObject_CurAnim
details: 'If oAIAttackVars_AttackElement is 0, it initializes the wind-up: sets AttackElement = 4, switches
  the battle object to anim 6 (charge/wind-up pose), spawns an effect at the object''s panel via battle_spawnEffectAtObjectPanel,
  plays sound 77, and loads StepTimer with 0x14 (20 frames). On later calls it decrements StepTimer each
  frame; when it reaches zero it writes HitElement = 8, which presumably tells the following attack-step
  logic to resolve the strike with that element. It is a per-frame state function inside an enemy AI attack
  routine, using the shared oAIAttackVars scratch fields.'
