name: battle_objAdvanceStateTimer_8008492
address: '0x08008492'
kind: function
status: confirmed
summary: State-machine step for a battle object pointed to by r5, choosing between starting a timed state 4 and
  jumping to state 6 based on battle mode 5, battle flag 0x40 and a check in sub_801483C.
interface: 'void sub_8008492(void); /* in: r5 = battle object/work struct ptr; out: none (r0 holds 4/6 or the sub_801483C
  result on the early-return path, NZ flags per last tst/mov) */'
details: 'Reads the current battle mode via GetBattleMode. If the mode is not 5, it tests battle flag 0x40 (TestBattleFlag_0x40);
  if that flag is set, it immediately stores state 6 into the object byte at r5+4 and returns. The same state-6
  store happens on the "other" path when the object''s state byte at r5+2 is already non-zero. Only when mode ==
  5 (or flag 0x40 is clear), sub_801483C returns 0, and r5+2 is still 0 does it take the "start" branch: it calls
  timer_resetAndStart_801482C (start a fresh countdown), stores state 4 into r5+2, and returns. So r5+2 is the object''s
  current state/phase byte (0 = not started, 4 = timed state running) and r5+4 is a next-state/exit byte set to
  6 when the sequence is skipped or already finished. What sub_801483C tests is unknown from this call site; its
  non-zero result simply aborts the step without touching the object. Flags on return differ per path (tst of sub_801483C''s
  result vs the mov of the stored constant 4/6); c/v inherit from the last callee.

  '
