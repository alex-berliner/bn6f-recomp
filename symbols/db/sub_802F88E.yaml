open_questions:
- Which Toolkit (i.e. which world object) holds oToolkit_CurFramePtr here; the caller's r10 is a bare register,
  not a field name.
- Why the upload stops past the 32-frame mark - tile eviction by another system, or simply that one resubmit per
  cycle is enough once tiles are loaded.
- Whether sub_8001158 is a generic "run this script list" that interprets 0x78 as the GFX-upload opcode, or something
  more specific.
- Identity of the sprite whose tiles live at 0x800000+0x3440..0x800000+0x34A0 region (looks like a small character/UI
  element given the compact 8-byte spacing).
