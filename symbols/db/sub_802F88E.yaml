name: sub_802F88E
address: '0x0802F88E'
kind: function
status: confirmed
summary: Per-frame refresh hook that, during frames 0-32 of a 64-frame cycle, resubmits an object's GFX request
  table (5 entries) to the script list runner for a Toolkit referenced by r10.
interface: void sub_802F88E(u32 toolkit /* r10 */); /* no return; clobbers r0-r3, lr, N/Z/C/V; preserves r4-r7 */
details: 'Reads the Toolkit at oToolkit_CurFramePtr (current animation frame counter), masks the

  frame index with 0x3F to obtain the low 6 bits (a 0..63 position in a 64-frame cycle).

  If the masked frame is <= 0x20, calls sub_8001158 (scriptListRun_8001158) with the

  pointer byte_802F8AC as the argument; otherwise returns immediately.


  The data table byte_802F8AC lives immediately after the function in ROM and consists of

  five 8-byte graphics-request entries (each starting with 0x78 0x40 = "GfxReq" opcode)

  followed by an 8-byte zero terminator. The entries reference VRAM tiles at 0x803440,

  0x803454, 0x803474, 0x803494, and 0x800B4A respectively, with sub-opcodes 0x01/0x09/

  0x11/0x19/0x21 (increasing by 8 per row) and a final 0x21 byte, suggesting a tiled

  strip sprite whose sub-tiles are uploaded in sequence. Because the call is gated to

  the first ~half of the frame cycle, the table is effectively resubmitted twice per

  cycle, keeping the tiles resident.


  No external structure fields are written; this is a one-way per-frame upload pump

  driven by an animation-phase check, presumably to make sure a Toolkit-owned object''s

  GFX stays loaded while it is on screen.

  '
