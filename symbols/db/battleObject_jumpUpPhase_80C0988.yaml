name: battleObject_jumpUpPhase_80C0988
address: '0x080C0988'
kind: function
status: confirmed
summary: 'Per-frame Z-axis pop-up animation for a battle object: launches it upward once, integrates Z
  until it clears 0xA0 to advance the phase, and ticks a 5-frame period timer that calls sub_80C0DC2 on
  roll-over.'
interface: void Next(void *r5 /* battle object */);
details: 'Operates on an oBattleObject-like struct passed in r5. On first invocation (PhaseInitialized
  == 0): sets Timer to 4, ZVelocity to 0x0F0000, and stamps PhaseInitialized to 4. On subsequent ticks:
  adds ZVelocity into Z and, once the high half of Z reaches 0xA0, writes 0xC into CurPhaseAndPhaseInitialized
  (advancing the object''s main state machine) and returns. Regardless, decrements Timer; when it underflows,
  reloads Timer to 5 and tail-calls sub_80C0DC2 (which likely advances through sub-phases or spawns the
  next effect at this beat). The "Z" field uses fixed-point with the high 16 bits as the integer (it is
  the upper 16 bits of the integrated Z that is compared to 0xA0). The ZVelocity 0x0F0000 gives an initial
  upward jump consistent with a "pop in" or "rise" appearance. clobbers r0–r4 and lr; preserves r5–r7
  and NZCV other than the explicit cmp/tst outputs.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
