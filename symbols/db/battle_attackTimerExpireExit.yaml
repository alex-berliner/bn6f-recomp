name: battle_attackTimerExpireExit
address: '0x08109EE4'
kind: function
status: probable
summary: Counts down the object's AI attack StepTimer and, once it hits zero, leaves the attack state.
interface: (r7 = battle object with oAIAttackVars) -> r0 = decremented StepTimer; flags from the BNE,
  no return value
details: Loads the halfword oAIAttackVars_StepTimer from the object at r7, decrements it, stores it back,
  and if the result is nonzero returns immediately; when the timer reaches zero it calls object_exitAttackState
  to end the object's attack state. It is a one-shot per-frame tick handler, same pattern as battle_attackTimerTick_8109CBC,
  so it is a state-handler function invoked via the object's action dispatch table rather than called
  directly. No other fields or structures are touched.
