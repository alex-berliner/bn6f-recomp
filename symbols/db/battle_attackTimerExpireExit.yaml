- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/strh on [r7,#oAIAttackVars_StepTimer] with sub #1: it is decrementing a countdown timer;
    bne locret skips the call, so object_exitAttackState runs only when the timer hits zero; callee object_exitAttackState
    matches the exit-on-expire behavior; sits next to battle_attackTimerTick_8109CBC (0x24 handler) in
    the Mettaur action table, both attack-timer handlers; recorded routes battlesweep/beastsp show it
    runs during battle object updates'
