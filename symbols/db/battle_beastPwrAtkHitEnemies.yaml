open_questions:
- what sub_80C7F20 does with r0-r3 plus the r6=0x8a0000|damage and r7=0 side arguments
- which enemy IDs ranges 0..0xba and 0x100..0x1c3 cover, and why the search is split in two
- meaning of the 3-bit and 4-bit fields packed in each entry byte produced by sub_8012D24
- no caller is known, so the identity of the r5 battle object and when this runs in a turn is unconfirmed
