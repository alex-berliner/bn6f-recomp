    at beq loc_8012D20 when zero; bl battle_beastPwrAtk_addScaledBase_8012642 with base 0x1e and arg 0x14,
    result orr''d into 0x8a<<16; loop of exactly 3 iterations unpacking each entry byte into low-3-bit
