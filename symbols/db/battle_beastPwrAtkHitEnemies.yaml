name: battle_beastPwrAtkHitEnemies
address: '0x08012CB2'
kind: function
status: probable
summary: 'Beast-Out power-attack helper: finds opposing-side enemies matching two ID ranges, applies a
  30-base damage hit scaled by the Beast-Out multiplier to each, then shakes the camera.'
interface: (r0 = battle object, in r5) -> r0 = destroyed; touches enemy list and camera struct, no return
  value used
details: 'Reads the caller''s battle object alliance from r5, XORs it with 1 to target the opposite side,
  then calls object_getEnemyByNameRange twice into local buffers on the stack: once with range (0, 0xba)
  and once with (0x100, 0x1c3), summing the returned counts in r4. If no enemy matched it returns immediately.
  Otherwise sub_8012D24 processes the second buffer at sp+0x10, and a 3-iteration loop walks one byte
  per entry: low 3 bits go in r0, high nibble in r1, with r2=0x10 and r3=0. Each iteration computes damage
  via battle_beastPwrAtk_addScaledBase(0x1e, 0x14) — 30 base damage times the Beast-Out multiplier — and
  hands 0x8a0000|damage in r6 plus the packed byte fields to sub_80C7F20 (which also receives r6/r7 as
  nonstandard extra arguments). After the loop it triggers a camera shake (magnitude 2, duration 0x14).
  The split ID ranges and the fixed damage/multiplier call strongly tie this to the Cybeast Beast-Out
  attack routine family.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
