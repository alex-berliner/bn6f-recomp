name: menu_adjustCursorOrValue_811F7F8
address: '0x0811F7F8'
kind: function
previous_names:
- sub_811F7F8
status: probable
summary: Adjusts a cursor/selection index by ±1 on D-pad/shoulder input, clamps to a min/max range, writes
  the new index back into a slot state word, and returns whether the value changed.
interface: (r0 = joypad-held flags, r1 = joypad struct ptr, r2 = flags/mask, r3 = caller scratch, r5 =
  toolkit ptr) -> r0 = 0xff if value changed, 0x00 if unchanged ; also writes the new halfword back to
  [r5 + r3 + 0x20] and [r5 + r3 + 0x24]
details: "Operates on a pair of halfword \"cursor\" fields in a slot/object state block\n  indexed by\
  \ r3 (offsets 0x20 and 0x24 relative to r5, i.e. toolkit + slot).\n  r1 originally carries 0x44 and\
  \ is right-shifted: bits 0x6/0x7 (D-pad L/R or\n  similar) and the rotated 0x80/0x40 equivalents (R/L\
  \ shoulder via lsl+lsr trick)\n  act as inc/dec inputs. r0's low bits 0x40/0x80 are likewise ORed-in\
  \ inc/dec triggers\n  depending on the r1 shift branch. The \"min\" (r9 = r1-1 after stripping 0xc0)\
  \ and\n  the \"max\" (loaded from [r5, r3+0x1e]) bound the result.\n\n  Two parallel halves mirror each\
  \ other: a left-shifted half (bit 6/7 from r1) and\n  a right-shifted half (bits 0/1) each move the\
  \ index by ±1 and clamp against the\n  corresponding bound read from the slot. After movement, both\
  \ candidate values\n  are compared to the previously-stored values; if either differs, the new values\n\
  \  are written back and SOUND_MENU_CUR_MOVE is played (unless r2's bit 0x2 is set,\n  which suppresses\
  \ the SE). The function returns 0xff on change, 0x00 on no-op.\n\n  Heavy use of r5 (toolkit base) and\
  \ indirect r3 offset suggests this is the\n  shared \"nudge a selection index\" helper used by every\
  \ menu/folder/submenu screen,\n  which matches the long caller list (folderEdit, submenu, reqBBS, BBS\
  \ static,\n  generic battle-screen state objects).\n"
