name: battle_transitionFrameStep
address: '0x08009D58'
kind: function
status: probable
summary: 'One per-frame step of a battle transition/effect: raises request bits 0x404, runs the transition
  dispatch, refreshes the battle scene, and posts an empty event.'
interface: () -> r0 = 0/void; sets request bits 0x404 in eStruct2035280+0x40, posts event with r0=0, r1=0
details: The routine ORs 0x404 into the request dword at eStruct2035280+0x40 via eStruct2035280_SetRequestBits_801BECC,
  then passes the same 0x404 to dispatch_801DA48, so the mask drives both the request flags and the dispatcher
  selection for this step. It then calls battle_sceneFrameSetup_801DA24 to queue the battle scene's graphics
  transfers and refresh render info, and finally posts event (r0=0, r1=0) through battle_eStruct2035280_postEvent_801E0A0,
  which zeroes the event halfword/byte fields — i.e. signals 'no further event this step'. Its position
  inside the battlesweep route and sole caller sub_8009CD0 suggest it is one state of a battle entry/transition
  sequence stepped each frame until the 0x404 request completes.
