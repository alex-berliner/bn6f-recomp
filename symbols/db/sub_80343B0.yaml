name: sub_80343B0
address: '0x080343B0'
kind: function
status: confirmed
summary: Per-frame advance of the world-map animation table, queueing its row palette and restamping the 32x20 BG
  tile block before ticking entities and draining queued GFX.
interface: void sub_80343B0(void);  // r5 = state (row table + frame counter); r10 passed through; clobbers r0-r3,
  r8, r9, r11, r12, lr, NZCV; preserves r4, r5, r6, r7
details: "Drives a small per-frame animation table rooted at off_8034400. State layout:\n  state+3  (u8)  current\
  \ row offset into the 12-byte-per-row table\n  state+6  (u16) frames remaining on the current row\nEach row is\
  \ {tileIds pointer, palette_src pointer, frame_count, ?}. Behavior:\n  - If frames_left > 1: decrement and stay\
  \ on the row.\n  - Else: peek row_ptr+0xC. If zero (end-of-table sentinel) wrap to row 0\n    but keep r3 on the\
  \ row that just expired (so the queued palette still\n    comes from the old row). Otherwise advance by 0xC to\
  \ the next row and\n    pick up its frame count from row_ptr+8.\nThen writes the new row_idx/frames_left back\
  \ to state, queues the row's\npalette source (32 bytes / 0x20) into palette_3001960 via\nQueueWordAlignedGFXTransfer,\
  \ restamps the standard 32x20 BG tile block\nfrom eTileIds2017A04 via CopyBackgroundTiles(j=0, i=0, block=1, ...,\n\
  j_size=32, i_size=20), runs entity_runAllUpdateHandlers_80465BC, and\nfinishes via sub_80465F8 (queue-drain).\n\
  Note: the array at off_8034400 is 7 rows; rows 4..6 reuse\neTileIds2017A04 and the palette source cycles byte_86C22C0,\
  \ byte_86C22E0,\n..., byte_86C2380 with frame_count = 2.\n"
