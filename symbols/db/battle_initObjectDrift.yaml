name: battle_initObjectDrift
address: '0x080D6580'
kind: function
status: probable
summary: Initializes a battle object sprite (0x80/0x10/0x45), disables shadow, sets CurAnim=1/CurAnimCopy=0xFF
  with animation reload, applies flip, palette from Param3, sub_80D67D2, and a slow backward drift (XVel
  = -frontDir, YVel = 1) for 0x168 frames with no angle-based motion before handing off to its update
  state.
interface: '(r5 = battle object pointer, inputs in r0-r2 preset by caller: 0x80/0x10/0x45 sprite ids)
  -> r0 = result of sub_80D65E0; sets object fields'
details: Loads the sprite via sprite_load(0x80,0x10,0x45) and its animation data, marks it shadowless
  (sprite_noShadow), sets CurAnim=1/CurAnimCopy=0xFF and applies sprite_setAnimation, then reloads animation
  data and calls sprite_update. Sets oObjectHeader_Flags |= 2, applies the object's effective flip via
  object_getFlip/sprite_setFlip, and calls sub_80D67D2 before setting the palette from oBattleObject_Param3.
  Movement is set to XVelocity = -object_getFrontDirection() (drifts opposite the facing side) and YVelocity
  = 1, with oBattleObject_Timer2 = 0x168 (360 frames lifetime) and DirectionAngle = 0xFF (no angle-based
  motion). Finally sets the state word to CUR_STATE_UPDATE and tail-calls sub_80D65E0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_load with hardcoded 0x80/0x10/0x45 plus sprite_loadAnimationData/sprite_noShadow show
    a fixed decorative sprite setup; neg r0 after object_getFrontDirection stored into oBattleObject_XVelocity
    and YVelocity=1 give the drift motion; Timer2 = 0x168 and DirectionAngle = 0xFF set a fixed 360-frame
    lifetime without directional movement; storing CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    and calling sub_80D65E0 transitions to per-frame update; sprite_noShadow and palette from Param3 suggest
    a non-physical effect/particle rather than an enemy
  refs:
  - bn6f/asm/asm31.s:65775
  - 0x0800E456 object_getFlip
  - 0x0800E2CA object_getFrontDirection
  - 0x080026E4 sprite_load
