  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal matches the asm: sprite_load(0x80,0x10,0x45), sprite_noShadow, CurAnim=1/CurAnimCopy=0xFF,
