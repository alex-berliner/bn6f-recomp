name: reqBBS_81403A8
address: '0x081403A8'
kind: function
status: confirmed
summary: BBS menu request handler that starts a screen fade, sets the caller's menu-state byte to 8 (leaving/transition),
  and plays the "unselect" sound.
interface: 'u32 bbs_menu_beginFadeOut_81403A8(u32 unusedR2, u8* menuStatePtr); // in: r2 (arg, unused), r5 (pointer
  to menu state byte), lr; out: r10 (whatever PlaySoundEffect leaves there); clobbers r0-r3, lr, NZCV'
details: "One of the \"req\" (request) handlers dispatched by the BBS/board menu. It:\n  1. Calls SetScreenFade(0xC,\
  \ 0x10) — fade type 0x0C at speed 0x10, i.e. a scripted fade-out for leaving the menu.\n  2. Stores 8 into the\
  \ byte pointed to by r5, advancing the caller's menu/scene state machine into its transition state.\n  3. Calls\
  \ PlaySoundEffect(SOUND_UNSELECT_68), the menu-cancel/unselect blip.\nQuirks: the caller's r2 input is never actually\
  \ consumed before the sound call — PlaySoundEffect receives\nwhatever SetScreenFade left in r2, so the caller's\
  \ r2 value is effectively dead (likely vestigial from a\ncommon dispatcher signature). The state pointer survives\
  \ because SetScreenFade preserves r5. The only live\noutput is r10 as set by PlaySoundEffect; its V flag output\
  \ is not propagated as meaningful. Function ends\nwith two padding bytes (0x00 0x00).\n"
