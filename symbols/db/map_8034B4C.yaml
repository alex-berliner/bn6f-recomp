name: map_8034B4C
address: '0x08034B4C'
kind: function
status: confirmed
summary: Loads a map (real-world or internet) by clearing the per-map work block, running map-music/event setup,
  spawning the overworld player and NPCs, then installing the map's on-init/on-update script pair and starting the
  map's music.
interface: void loadMap_8034B4C(u8 map_group /* r0 */, u8 map_number /* r1 */);
details: "Entry: r0 = map_group, r1 = map_number. Caller-saved r8/r9/r12 are\nsnapshotted on the stack and restored\
  \ on exit; r4-r7/r10/lr are saved\nin the prologue and restored in the epilogue.\n\nSteps:\n1. Zeroes the 0x40-byte\
  \ per-map work block at unk_2011EA0 via\n   ZeroFillByWord.\n2. Calls playCertainMapMusicBasedOnEventByte_8036e44,\
  \ then the\n   gamestate helper sub_8035028, then owPlayer_80350a8, then the\n   NPC spawner npc_spawnOverworldNPCObjectsForMap\
  \ (which receives\n   the live r5/r6/r7). r0/r1 are preserved across these calls by\n   being pushed on the stack\
  \ first.\n3. Calls sub_803537C and then sub_80353DA on the r0/r1 it leaves\n   behind (re-pushed to keep map_group/map_number\
  \ available for the\n   table lookup below).\n4. Selects the script-pointer table: RealWorldMapScriptPointers\
  \ if\n   map_group < INTERNET_MAP_GROUP_START, otherwise\n   InternetMapScriptPointers (after subtracting\n  \
  \ INTERNET_MAP_GROUP_START).\n5. Resolves the (on_init, on_update) script pair for the group/map\n   through two\
  \ levels of indirection:\n     group_entry = table + (map_group << 3)\n     on_init    = [[[group_entry + 0] +\
  \ (map_number << 2)]]\n     on_update  = [[[group_entry + 4] + (map_number << 2)]]\n6. Calls StoreMapScriptsThenRunOnInitMapScript(on_init,\
  \ on_update),\n   which stashes the script pair and runs the on-init handler for\n   the freshly loaded map.\n\
  7. Calls PlayMapMusic to start the map's BGM.\n\nTouches: unk_2011EA0 (0x40-byte map work block, zeroed),\nRealWorldMapScriptPointers\
  \ and InternetMapScriptPointers\n([*const [*const [*const MapScript]; 2]; NUM_GROUPS]).\n"
