name: sceneUpdate_804A078
address: '0x0804A078'
kind: function
status: confirmed
summary: Scene-update hook that, while a screen fade is active, tears down scene graphics (VRAM, GFX buffer,
  tile memory, LCD control, chatbox, system init); otherwise delegates to sub_8049F70.
interface: void sub_804A078(void) /* r5/r10/lr in, no return value, clobbers r0-r3/r12 + nzcv */
details: 'Called as a per-frame scene update step. Checks IsScreenFadeActive(); on the branch where it
  returns true (fade in progress), it reads an opaque state/flags word at [r5 + 0x22], passes it through
  sub_804A230, then performs a full graphical tear-down chain: zeroFillVRAM, ZeroFillGFX30025c0 (clears
  the 0x30025c0 GFX buffer region), copyMemory_8001850 (restores tile/Vram backing), SetRenderInfoLCDControl(0x40),
  chatbox_8040818 (resets the chat/text box), and sub_8123408 (system/region init). When no fade is active
  it simply falls through to sub_8049F70 (the normal non-fade scene update path).

  Quirks:

  - Conditional is inverted vs. its natural English reading: "If fade is active -> tear down; else ->
  sub_8049F70". The teardown path is the screen-fade-active branch.

  - r5 is assumed to point at a scene/state struct (only field used here is +0x22, a u16).

  - LCD control value 0x40 (BG0 on, mode 0) is written via SetRenderInfoLCDControl.

  - Callers pass r5/r10/lr; lr is the standard interworking return. Function is thumb.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
