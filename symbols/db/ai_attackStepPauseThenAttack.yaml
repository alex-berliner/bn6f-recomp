name: ai_attackStepPauseThenAttack
address: '0x080F5C2C'
kind: function
status: probable
summary: 'Per-frame tick for an AI enemy''s attack step: counts the step timer down, first transitioning
  from a movement pause into the attack phase, then exiting the attack state when the attack phase timer
  runs out.'
interface: (r0 = destroyed by ldrb/tst, r5 = battle object, r7 = AI attack vars struct) -> r0 = clobbered;
  no meaningful return
details: Reads oAIAttackVars_AttackElement as a phase selector. If it is 0 (pre-attack pause), it decrements
  oAIAttackVars_StepTimer; on expiry it sets the object's current animation to 0, clears ObjectFlags bit
  0x40, sets the CURRENTLY_MOVING_1 flag (bit 1) to make the object move, reloads StepTimer from oAIAttackVars_AttackDuration,
  and sets AttackElement to 4 to enter the attack phase. If AttackElement is nonzero, it decrements StepTimer
  and, on expiry, calls object_exitAttackState to end the attack. The struct at r7 is the AI attack variable
  block (element/step timer/duration fields); r5 is the battle object whose collision-data flags are modified.
