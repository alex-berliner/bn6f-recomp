open_questions:
- The exact meaning of byte_203CA74 returned in r0 (flags or step id);
- would settle by looking at how sub_800938A interprets the r0 it gets
- back from this call.
- The disassembly comment listing `bl sub_802DE5C` as an intra-function
- callee is suspect; that instruction almost certainly belongs to one of
- the dispatched handlers (likely the sub_800825A slot whose first
- instruction is the BL to sub_802DE5C).
