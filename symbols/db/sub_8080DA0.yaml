name: sub_8080DA0
address: '0x08080DA0'
kind: function
status: confirmed
summary: Loads the per-field BG scroll callbacks, BG-anim script, sprite/GFX anim scripts, and LCD-control mask
  for the current battle field, and preloads the death-anim set when not in a real battle.
interface: 'void battle_loadFieldData_8080DA0(void);  /* r10 in: field index; clobbers r0..r3, r6..r12, lr, nzc/v
  */'
details: "Indexes three field tables using the field id returned by sub_8081308 (via r10):\n  - off_8080E34: 16-byte-per-field\
  \ struct holding three BG scroll callback fns (off 0/4/8) and an LCD-control OR-mask (off 0xC). The three fns\
  \ are forwarded to SetBGScrollCallbacks; the mask is OR'd into the result of GetRenderInfoLCDControl and written\
  \ back via SetRenderInfoLCDControl.\n  - off_8080F98: 4-byte-per-field pointer to a BGAnimData block, passed to\
  \ LoadBGAnimData.\n  - off_8081220: 4-byte-per-field pointer to a sprite/GFX anim array, passed to LoadGFXAnims.\n\
  When GetBattleMode() != 1 (i.e. outside real battles, e.g. story or custom screens) it additionally calls sub_803537C\
  \ and battle_loadDeathAnims_8035424 to preload the death animations; battle scenes skip this and presumably load\
  \ their own.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C\
  \ allowed; tools/abi/retype_queue.tsv)."
