open_questions:
- What is sub_8081308 exactly resolving? The caller-supplied r10 is shifted/used to compute the index, but the actual
  return value of sub_8081308 is the field id used for all three table lookups -- is r10 just a re-derivation of
  the same id, or an override?
- The off_8080E34 struct mixes three callbacks and an OR-mask in a single 16-byte record; can the mask be negative
  (bits-to-clear) as well, or is it strictly additive?
- Does the function only run on field entry, or also on transitions that change only the LCD-control bits (e.g.
  fade modes)?
