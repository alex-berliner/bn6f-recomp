name: submenu_renderEntryText
address: '0x08118134'
kind: function
status: probable
summary: Renders the text/gfx for one entry of the submenu's item list into a per-slot text buffer, after
  classifying the entry's state.
interface: (r0 = base index from sSubmenu.unk_24, r1 = entry offset from r5 (slot id at [r5,#4]), r5 =
  submenu slot struct) -> void; stores state byte at [r5,#0xE] and a halfword at toolkit->Unk200a220+8
details: 'Computes an index as sSubmenu.unk_24 + [r5,#4] - 2 and bounds-checks it against sSubmenu.unk_1E;
  out of range returns without rendering. Each 4-byte entry in word_201DA80 holds two halfwords: the first
  is a text id (validated against sentinel 0x14C) and the second a value/state word. It writes a state
  byte to [r5,#0xE]: 4 if text id == 0x14C, 0 if second halfword nonzero, else 2, and stores the state
  halfword to toolkit->Unk200a220+8. It then calls renderTextGfx_8045F8C with r0 = TextScript873EA50,
  r1 = (textId - 0x90) >> 2 as glyph-chunk index, r2 = one of seven 0x400-spaced buffers (byte_2017A00..unk_2019200)
  selected by slot, r3 = a per-slot tile/palette offset from byte_81181C0 (0x33C0, 0x2BC0, ... stepping
  8), and fixed r4=8, r5=1, r6=dword_86B7AE0, r7=0. The seven buffers plus seven tile offsets suggest
  the submenu displays up to seven such entries simultaneously.'
