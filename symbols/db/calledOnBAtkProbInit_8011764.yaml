name: calledOnBAtkProbInit_8011764
address: '0x08011764'
kind: function
status: confirmed
summary: Dispatches an active battle object's B-button attack to the handler selected by its AI configuration.
interface: u32 calledOnBAtkProbInit_8011764(struct BattleObject *battleObj /* r5 */, void *attackProcCtx /* r10
  */); returns the selected handler's result in r0; r5, r8-r12 are outputs, while nz, c, and v are clobbered and
  r1-r4, lr, and r6-r7 are not preserved.
details: 'Reads the battle object''s AIDataPtr, computes the address of AIData_AttackVars, reads the u8 AIData_BButton
  selector, and uses it to index a four-entry handler table. The selected handler is invoked by a computed-address
  bx with r5 retaining the battle object, r6 pointing to AIData, r7 pointing to AttackVars, and r10 retaining the
  attack-procedure context. The jump-table range is reached through the pointer stored at off_80117D0. There is
  no normal C-level cleanup after dispatch: the handler is responsible for returning through the stack frame arranged
  by this adapter. No direct values are written beyond register setup and the jump.'
