open_questions:
- Exactly what r6 is and which byte at r6#0xD gates the header bit 1 (OBJECT_HEADER flags bit).
- Whether the dword_8089128 (CutsceneScript) embed used here is per-BeastSP cutscene or a generic one
  — the 40 beastsp snapshots strongly suggest BeastSP cutscenes, but no constant tag in the function itself
  names them.
- Resolution of `sub_81421D0`'s role ("scenario effect state field") — only known by its name in capture.
- Whether the matching header-bit-1 toggle is "panel/trap-armed" vs "object pause" would be settled by
  cross-checking r6 pointer type, which isn't visible here.
