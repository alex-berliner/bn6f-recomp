status: probable
summary: Adjusts a battle object's sprite X/Y using a cutscene-script-relative offset (subtract 0x14/0x10-byte
  row, +8) when its source-cutscene script slot index 0 matches, then runs sprite_update
interface: '(r5 = BattleObject*, r6 = ?, r10 = Toolkit/CutsceneState base; lr = return into caller) ->
  (r0 = 0x1AC, NZ flag set) ; side effects: writes Object[5] in scratch mem, sets Coordinates of object''s
  sprite sub-entry, runs sprite_update'
details: "Steps:\n  1. push {lr}; load byte at [r5] -> r4 (object header byte 0).\n  2. mov r1,#2; ldrb\
  \ r0,[r6,#0xd]; tst r0,r0 — toggle bit 0x02 of the header in r4 (0x02 clear if the r6#0xd byte is nonzero,\
  \ else set), then strb r4,[r5].\n  3. bl battle_getScenarioEffectStateField_81421D0 (sub_81421D0) ->\
  \ r0 = scenario/effect slot index.\n  4. r1 = 0x10 * r0 + 0x0C; push {r0=0xDC, r1}; r0 = &dword_8089128\
  \ (`CutsceneScript` ptr, the cutscene script state used by cutscene_checkOriginalCutsceneScriptPos_8036F70).\n\
  \  5. bl cutscene_checkOriginalCutsceneScriptPos_8036F70 → returns Z flag. If NZ (slot not at \"original\"\
  \ pos), r0 -= 0x14 and r1 += 8, then `bl sprite_setCoordinates` with (r0,r1)=sprite X/Y for the 0xDC\
  \ sub-entry.\n  6. bl sprite_update(r5), then pop {pc}.\n  Captured call #0 shows entry r0=4, r1=0xA0\
  \ coming from sub_811E384 with lr=0x0811e3c5 (the push-lr + first instr of the function), and exit r0=0x1AC\
  \ Z set (i.e. `sprite_setCoordinates` returns NZ normally then `beq` is not taken, r0 settled to 0x1AC).\n\
  \n  40 recorded snapshots cover many `0x08 7d d8 e5` cutscene-script positions (the BattleSP cutscenes),\
  \ so this is the BeastSP cutscene slot-position handler.\n  All routing through the cutscene-check return\
  \ flag decides the \"scenario-adjusted offset\" variant; only differs from the trivial pass-through\
  \ by -0x14/+8.\n"
