name: ReadCutsceneCameraScriptHalfword
address: '0x08037460'
kind: function
status: confirmed
summary: Reads a little-endian 16-bit value at a given offset within a cutscene camera script buffer.
interface: u16 ReadCutsceneCameraScriptHalfword(u32 scriptOffset /*r0*/, u8 *scriptBase /*r1*/); preserves r1-r3,
  clobbers flags
details: Computes the address scriptBase + scriptOffset and loads a 16-bit value byte-by-byte (low byte at the address,
  high byte at address+1) to form r0 = (byte[1] << 8) | byte[0], i.e. a little-endian halfword. The two-byte read
  exists because the offset is generally odd/misaligned, so a single ldrh would be invalid and a 32-bit ldr would
  rotate on unaligned addresses. r1 (the base) and r2-r3 are preserved; r2-r3 are used only as scratch. Presumably
  used by the cutscene camera interpreter to fetch operands/parameters (command codes, coordinates, durations) from
  the current camera script.
