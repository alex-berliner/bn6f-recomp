name: battle_customObjectFrameTick
address: '0x080CD9CA'
kind: function
status: probable
summary: 'Per-frame update tick for one battle object: palette/HP end-of-battle handling, hit-reaction
  teardown, action dispatch, sprite and collision update.'
interface: (r5 = battle object, oBattleObject) -> r0 = destroyed; clobbers lr
details: 'Runs the full per-frame pipeline for a single battle object held in r5. First it clears the
  sprite final-palette high nibble (undoing flash), then if the battle is over it stores 0 into oBattleObject_HP
  to kill the object. It then calls object_finishCollisionHitReaction to wind down collision state and
  spawn effects, and dispatches the object''s CurAction handler via battleObject_dispatchActionHandler
  using an embedded 10-entry table (off_80CD9F4: sub_80CDA1C, ResetObjectActionState, sub_80CDBE8, etc.)
  — this object''s private action list. Finally it advances the object''s animation via object_updateSprite
  and refreshes its collision state via object_presentCollisionData. The pointer at off_80CD9F0 points
  back at off_80CD9F4, so the action table is passed as a pointer-to-pointer to the dispatcher.'
