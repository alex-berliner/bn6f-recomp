name: eLinkState_ResetForNewUse_803DE88
address: '0x0803DE88'
kind: function
status: confirmed
summary: Resets the eLink/link-battle state block and its side buffers, then stores the caller's state pointer at
  eLinkState+0x58.
interface: void sub_803DE88(void *statePtr /* r0 */); clobbers r0/r1/nz/c/v, preserves r2-r7
details: 'Takes a pointer in r0 (kept in r4 across the calls) and prepares the eLink subsystem for a fresh session:
  ZeroFillByHalfword is called three times to wipe eLinkState (0x58 bytes), the 0x10-byte auxiliary buffer at byte_200DD10,
  and a 0x40-byte work area at unk_2009480. Afterwards the supplied pointer is stored at eLinkState+0x58 (dword_2009A28),
  which the rest of the eLink code presumably dereferences to reach the caller''s state object. The 0x58-byte clear
  stops exactly where the pointer field lives, so the pointer is written after the clear on purpose. Return values
  are just the leftovers of the last ZeroFillByHalfword call (r0/r1, nz, c, v); callers per the contract read back
  c, v and r1, which suggests they only treat this as an ordinary bl whose flags are incidental.

  '
