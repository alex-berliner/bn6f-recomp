name: SeedRNG
address: '0x08001514'
kind: function
status: confirmed
summary: Resets the primary RNG seed variable to its fixed initial value 0xA338244F.
interface: void SeedRNG(void)
details: Writes the constant 0xA338244F into the 32-bit primary RNG seed variable (ePrimaryRngSeed), presumably
  at boot or when a seeded run starts, so the game's random sequence begins from a known state. Only touches that
  one global; no other state, no stack use, and it returns via mov pc, lr. The seed value likely feeds the game's
  RNG update routine elsewhere.
