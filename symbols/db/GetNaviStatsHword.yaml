name: GetNaviStatsHword
address: '0x08013740'
kind: function
status: confirmed
summary: Reads a halfword field from one of the two Navi stats records indexed off the toolkit's NaviStatsPtr.
interface: 'u16 naviStats_readHword(u32 record /* r0: 0 = first, nonzero = second */, u32 field_offset /* r1: byte
  offset within oNaviStats */, Toolkit* toolkit /* r10 */)'
details: 'Normalizes the record selector to 0/1 (any nonzero r0 selects the second record), multiplies it by oNaviStats_Size,
  loads the base pointer from toolkit + oToolkit_NaviStatsPtr, then returns the halfword at base + record*oNaviStats_Size
  + field_offset. r10 (the toolkit) must already be set up by the caller; the function only returns r0 and clobbers
  r3 and flags.

  '
