name: submenu_getScrollStep
address: '0x0812EEEC'
kind: function
status: probable
summary: Returns the per-frame pixel scroll step (0/4/8, or 12 for snap/wrap) for animating the submenu
  list toward the current cursor position.
interface: '(r0,r1 ignored by body; r1 = value from menu_adjustCursorOrValue_811F7F8) -> r0 = scroll step:
  0 none, 4 up, 8 down, 12 snap/wrap; flags clobbered'
details: Calls submenu_getStatePtr and works on the state struct at 0x2037780. Compares halfword [state+0x24]
  (current cursor/list position) with [state+0x26] (previous/target position). If getStatePtr's r1 flag
  is set, or the absolute difference is exactly 6 (a wrap of a 6-entry list), returns 12. Equal positions
  return 0; otherwise returns 8 if [0x24] > [0x26], else 4. The caller stores the result at +0xc of its
  own struct (skipping the call once it is 12) and copies [0x24] and [0x20] to +0x3e/+0x3c, presumably
  render offsets updated by the scroll.
