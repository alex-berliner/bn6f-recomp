    them; diff==6 or getStatePtr r1!=0 -> return 12 (loc_812EF0A), equal -> 0, gt -> 8, else 4 (loc_812EF0E);
    caller 0x0812ECEC: skips the call when [r7,#0xc]==0xc, stores result to [r7,#0xc], then copies [0x24],[0x20]
    to [0x3e],[0x3c]'
