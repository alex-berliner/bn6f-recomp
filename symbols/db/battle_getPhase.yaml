summary: Returns the current battle phase byte from the active battle state.
interface: () -> r0 = oBattleState_BattlePhase of the current battle; no flags
details: Loads the toolkit's battle state pointer (r10-relative oToolkit_BattleStatePtr), dereferences
  it, and reads the oBattleState_BattlePhase byte, returning it in r0. It is a pure four-instruction getter
  with no side effects and no flags set. It is called from sub_8008688 and sub_8008EA0 and runs in the
  beastsp recorded route, so callers likely branch on the battle phase (intro/action/transform counters).
