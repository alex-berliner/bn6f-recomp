name: battle_getPhase
address: '0x0800A84E'
kind: function
status: confirmed
summary: Returns the current battle phase byte from the battle state pointed to by the toolkit.
interface: u32 battle_getPhase(void) — takes r10 = toolkit pointer, returns r0 = phase byte; no flags read or written
details: 'Tiny accessor: loads the battle state pointer from the toolkit struct

  (oToolkit_BattleStatePtr) and reads the phase byte (oBattleState_BattlePhase)

  from it, returning it in r0. The toolkit is passed in r10 rather than a

  standard argument register — callers must have r10 set to the toolkit base.

  No other registers or flags are touched. The phase value presumably encodes

  the current battle flow step (intro, main, transforms/outro, etc.) used by

  battle update logic and scripts to gate behavior.

  '
