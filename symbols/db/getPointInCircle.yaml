name: getPointInCircle
address: '0x080011F0'
kind: function
status: probable
summary: Returns 1 if the point (x,y) is within radius r of center (cx,cy), else 0, using squared comparison.
interface: (r0 = point x, r1 = point y, r2 = center x, r3 = center y, r4 = radius) -> r0 = 1 if (x-cx)^2
  + (y-cy)^2 <= r^2, else 0; flags clobbered
details: The function subtracts the center (r2,r3) from the point (r0,r1) to get the dx/dy deltas, then
  squares each delta via the self-multiply idiom (mov r2,rX; mul rX,r2) and sums them into the squared
  distance. It squares the radius in place the same way (mov r2,r4; mul r4,r2) and compares radius^2 against
  distance^2 with a signed bmi, avoiding any sqrt. It returns 1 when the squared distance is less than
  or equal to the squared radius (point inside/on the circle) and 0 otherwise. The r4 radius register
  is clobbered (becomes r^2). No memory or structures are touched; it is a pure 5-argument arithmetic
  test.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sub r0,r0,r2 / sub r1,r1,r3 computes point-minus-center deltas (asm lines 1-2); mov r2,r0; mul
    r0,r2 and same for r1 implement dx*dx + dy*dy (lines 6-10); mov r2,r4; mul r4,r2 squares the radius
    before the compare (lines 4-5); cmp r4,r0; bmi -> return 0, fallthrough -> return 1 encodes the inside-circle
    condition (lines 11-15)
