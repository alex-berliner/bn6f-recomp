name: battle_objectMirrorRelatedAndFlinchStep_80E7142
address: '0x080E7142'
kind: function
status: confirmed
summary: Per-tick update for a battle object that syncs fields from its related object and then runs the
  flinch step, switching to the destroy state when the battle is over or the related object's action is
  invalid.
interface: void sub_80E7142(r5=battle object ptr, r10=battle context, lr=return); no return value, flags
  and r0-r3/lr clobbered
details: 'Battle object per-tick handler (r5 = oBattleObject, r10 = battle context used by callees). First
  calls battle_isBattleOver; if the battle is over, it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and returns. Otherwise it copies three words (+0x34..+0x3F) from [r5+oBattleObject_RelatedObject1Ptr]+0x34
  onto the same offsets of the object itself, keeping its own position/data mirrored to the related object.
  If oBattleObject_Param1 is nonzero, the object must flinch this tick: battle_objectFlinchStep is called
  unconditionally. If Param1 is zero, the related object''s oBattleObject_CurAction is checked: action
  0xA is only allowed when time is NOT stopped (battle_isTimeStop returns with Z set when time is stopped;
  the code returns without flinching in that case), and any other action value destroys this object via
  CUR_STATE_DESTROY. Note the ldmia/stmia advance r0 past the copied block, so +0x34..+0x3F of the object
  are scratch/mirrored fields rather than the state word.'
