name: ai_beginPanelSlideMove
address: '0x08017E44'
kind: function
status: probable
summary: 'Battle-object AI step: snaps the object onto its queued next panel, picks an adjacent-panel
  slide direction, and starts a velocity-driven move onto it (or falls back to phase 0x18 if blocked).'
interface: (r5 = current battle object, no args) -> void; sets XVelocity/YVelocity, MoveSubState, CurPhase
details: Operates on the global current battle object (r5). It sets ObjectFlags1 bit 0x100000, clears
  RelatedObject1Ptr, commits FuturePanelXY into PanelXY, and resyncs pixel position and collision panels
  via object_setCoordinatesFromPanels/object_updateCollisionPanels, clears flags 0x1040, and releases
  the panel reserve for the old target. It then calls sub_800F598 to fill ContactPanelOffsetX/ContactOffsetY/DirectionAngle,
  builds an index r4 from the direction angle and the target panel's flag 0x20, and looks up byte_8017F24
  (values 0,1,1,2,2) to choose a direction; if nonzero it checks the candidate panel (panel + signed bytes
  at offsets 0x1c/0x1d) via sub_800F55C, else defaults direction 0 and checks via sub_800F534. On success
  it sets XVelocity = off0x1c * 0xA0000, YVelocity = off0x1d * 0x60000, stores the candidate into FuturePanelX/Y,
  and sets MoveSubState = 4; if the target check fails (beq) it sets CurPhase = 0x18 and MoveSubState
  = 8 instead.
