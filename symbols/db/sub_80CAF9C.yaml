name: sub_80CAF9C
address: '0x080CAF9C'
kind: function
status: confirmed
summary: Per-frame tick for a battle object; marks it for destruction if the battle ended, skips if time is stopped,
  otherwise dispatches its current action handler via a jump table.
interface: void battle_objectNextTick(Object* obj /*r5*/)
details: 'r5 holds the battle-object pointer. First calls battle_isBattleOver; if the result is non-zero the object''s
  combined state/phase field (oBattleObject_CurStateActionPhaseAndPhaseInitialized) is overwritten with CUR_STATE_DESTROY
  and the function returns. Otherwise calls battle_isTimeStop; if the Z flag is set (time stopped) the function
  returns without processing. If neither gate trips, the object''s byte field oBattleObject_CurAction is read and
  used as an index into a jump table at off_80CAFC4. The table currently contains a single entry (action 0 → sub_80CAFC8+1,
  thumb address). The dispatch uses the classic "mov lr, pc / bx r1" idiom so the callee returns directly to this
  function''s caller. r10 is carried in as context (likely the battle-system pointer used by the callee) and the
  callee may set r8–r12 on return. The function itself preserves r5 across the two guest calls.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
