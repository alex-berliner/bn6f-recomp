name: battle_objectTimerExpire
address: '0x080BC36E'
kind: function
status: probable
summary: Runs the object's sprite update, counts down its Timer, and when it reaches 0 notifies the object
  it was spawned from and switches this object to the destroy state.
interface: (r0 = battle object pointer, r5 = same object) -> r0 clobbered by callees; sets oBattleObject
  state word to CUR_STATE_DESTROY when timer expires
details: Each call first invokes battle_tryUpdateObjectSprite to advance the object's sprite animation.
  It then decrements the halfword at oBattleObject_Timer; if nonzero it just returns. On reaching zero,
  it loads oAIData_SpawnedSourceObjectPtr from the object's AIData and calls sub_80E1A86, which sets the
  source object's field 8 to 8 (likely a status/flag reset), then writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the engine destroys the object. Typical of timed battle effects (e.g., lingering panels or effects)
  that expire after a fixed delay and signal their creator.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_tryUpdateObjectSprite advances the sprite every call; ldrh r0,[r5,#oBattleObject_Timer];
    sub r0,#1; strh ...; bne exit implements a one-shot countdown; ldr r0,[r5,#oBattleObject_AIDataPtr];
    ldr r0,[r0,#oAIData_SpawnedSourceObjectPtr]; bl sub_80E1A86 notifies the spawning object on expiry;
    mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] requests
    self-destruction
