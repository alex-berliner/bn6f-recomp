name: ai_setupBeastPwrAtkVars
address: '0x08011DBC'
kind: function
status: probable
summary: 'Initializes an AI attack-vars struct for a Beast-Out power attack: clears ChargeReadyFlag, ChipUseDelay,
  and AttackBoost; sets ExtraDamage=0x9E; computes Damage via battle_beastPwrAtk_addScaledBase(base=0x32,
  mult=0x14); sets InitFlag=4; returns 0x4E.'
interface: (no args; uses r7 = AI attack vars struct) -> r0 = 0x4E (next state/step); writes oAIAttackVars
  fields
details: Clears ChargeReadyFlag, ChipUseDelay and AttackBoost to 0, sets ExtraDamage to 0x9E (158), then
  calls battle_beastPwrAtk_addScaledBase with base damage 0x32 (50) and multiplier arg 0x14 (20), storing
  the returned scaled damage into oAIAttackVars_Damage. Finally sets InitFlag to 4 and returns 0x4E, which
  looks like a state-machine advance value. The struct is the AI attack parameter block (oAIAttackVars_*)
  used by AI-controlled battlers. No arguments are read; r7 must already point at the struct, so this
  runs inside an AI routine with r7 established.
