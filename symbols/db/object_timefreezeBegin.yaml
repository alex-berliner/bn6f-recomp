name: object_timefreezeBegin
address: '0x0800B916'
kind: function
status: confirmed
summary: Starts a time freeze for the battle object in R5, queueing the freeze dispatch, raising battle flag 4 for
  player-side objects, clearing its freeze counter, and switching it to the UPDATE state.
interface: void object_timefreezeBegin(BattleObject *obj /* r5, caller-provided */); clobbers r0-r2 and flags (nz,
  c set by the <<2 index shift and final mov)
details: 'Operates on the battle object whose pointer is already in R5 (a battle-object "this" passed in by callers
  rather than a register argument). Reads the object''s oBattleObject_Alliance byte and calls battle_networkInvert;
  if the network is not inverted it calls dispatch_801DACC with a0=0x40, presumably queueing the engine-wide time-freeze
  dispatch (bit 0x40). Then calls sub_800B8D8 with the alliance byte — likely a "is this the player''s side" check
  — and if true sets battle flag 4 via battle_setFlags. Finally indexes the per-alliance freeze counter table dword_200F3B8
  (alliance<<2, so one u32 per alliance), zeroes that entry, and stores CUR_STATE_UPDATE (4) into the object''s
  oBattleObject_CurState byte so the object resumes its normal update loop. Note the function both starts the freeze
  (dispatch/flag) and resets the object''s own freeze counter, so it behaves like "begin freeze on this object /
  enter frozen-update mode" rather than a plain state setter.

  '
