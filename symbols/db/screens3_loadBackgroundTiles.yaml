name: screens3_loadBackgroundTiles
address: '0x0812AFC8'
kind: function
status: probable
summary: 'Sets up one ''screens3'' menu screen: copies a full 30x20 background tilemap into BG tile block
  1 and then renders its two text GFX panels.'
interface: () -> (); no args or return value; calls CopyBackgroundTiles and sub_812B430, so r0-r3 are
  clobbered
details: 'The body is just two calls: CopyBackgroundTiles(0, 0, tile_block=1, tile_ids=unk_201D120, j_size=0x1E,
  i_size=0x14) writes an entire 30x20 BG map (full GBA text-mode screen) into tile block 1 using the tile-id
  table at unk_201D120, then calls sub_812B430, which decompresses eTextScript201BA20 via eDecompBuffer2013A00
  and renders two text GFX panels into VRAM slots 0x20/0x21. The data tables right after the routine (off_812B0C0
  etc.) hold per-screen decompression source/dest pairs, so the sibling functions at 0x812A424-0x812BFAC
  are parallel screen-setup variants. This is a per-screen load step in the screens3 sub-menu, not a per-frame
  tick.'
