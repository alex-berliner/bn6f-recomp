name: battle_advanceMoveStep
address: '0x0803AB6C'
kind: function
status: probable
summary: Advances a battle object's multi-step move/animation counter each tick, playing the move sound
  and restarting a sub-effect, and marks the object's current action done once the steps run out.
interface: (r5 = battle object ptr, set by caller; no args) -> r0 = undefined; increments obj+0x10, clears
  obj+0x13 when a new step starts
details: 'Treats r5 as a battle-object structure: byte +0x10 is a step/frame counter and halfword +0x24
  is the number of steps. If counter+1 <= +0x24 it stores the incremented counter, calls sub_803C040(0x10,
  0x30) (meaning of the two constants unknown), clears byte +0x13 (likely a per-step flag/delay), and
  plays sound 0x80 (the current-move sound, matching the callees'' naming). Once the counter would exceed
  the limit it instead calls markBattleObjCurDone_803ABDC, ending the object''s current action. No known
  callers, and r5 is never set inside the function, so the exact caller context is unconfirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r4,[r5,#0x10] / ldrh r1,[r5,#0x24] / cmp+strb: step counter vs step count; bl markBattleObjCurDone_803ABDC
    in the fall-out branch: object action completion path; bl PlaySoundEffect with 0x80 on the increment
    path, matching CUR_MOVE sound used by markBattleObjCurDone callee; strb #0,[r5,#0x13]: per-step state
    reset when a new step begins; sub_803C040 called with constants 0x10,0x30 — purpose unknown'
