  date: '2026-10-14'
  detail: '- First half: `sub r6,r5,r4`/`sub r7,r2,r3` then `mul r3,r4`/`mul r2,r5`/`sub r2,r3,r2` (2D
    cross product) at asm03_0.s:23699-23705. - Loads [r0+0]/[r0+4] and forms `r2 + r3*r6 + r4*r7`; `cmp
    r5,#0; ble loc_8030F76` shows the early-out returns r0=0/r1=0 at asm03_0.s:23717/23787. - Second pass
    repeats with offsets 0xc/0x10 then branches to 0x8030F3C when also >0. - Two `bl sub_8031048` calls
    at asm03_0.s:23749 and 23761 push {r6,r7}, swap into r6/r7, return; results become r8 (==r9 in different
    order) and are returned in r0/r1. - All five callers are battle transition/camera drivers (battle_runTextboxUpdateAndSetStateBit1_80313D4,
    sub_8031264, sub_8031330, sub_8031420, sub_8031478) that pass r0 plus a delta pair and accumulate
    a state bit in r12 — matches the cross-product / two-half-pass pattern. - The 0x40-byte capture at
