status: probable
summary: Battle textbox update helper called from camera-scroll/textbox transition sequences; returns
  0,0 on early-out, otherwise two deltas used by callers' r12 accumulator.
interface: (r0 = ptr, r2 = ?, r3 = ?, r4 = ?, r5 = ?, r6 = ?) -> r0 = deltaLo (or 0), r1 = deltaHi (or
  0)
details: "Pushes {lr}, saves r6 into r8.\n  Computes r6 = r5 - r4 and r7 = r2 - r3, then r2 = r2*r5 -\
  \ r3*r4 (cross product of (r4,r3) and (r5,r2)?).\n  Loads r3 = [r0+0], r4 = [r0+4]; multiplies by r6,r7\
  \ and accumulates with r2; if the result is <= 0 it takes the loc_8030F76 early-out returning r0=r1=0.\n\
  \  Otherwise reads the +0xc/+0x10 pair and repeats the same test. If that also fails, it falls through\
  \ to the 0x8030F3C path which calls sub_8031048 twice (using r6/r7) and returns two r7-style differences\
  \ in r8/r9 (final r0/r1).\n  The early-out returns the documented 0xfffffff1/0xfffffff5/0xfffffff0/0xfffffff8\
  \ sentinel negatives only in the captured calls where the second-branch condition is also <=0; in the\
  \ assembly the explicit early-out path returns 0,0. The captured negative r0 values are the *caller*\
  \ (sub_8031264/sub_8031330) post-processing this function's return (likely a flag/limit check), not\
  \ this function itself.\n  Function is called from five battle-state-driven camera/textbox update sequences\
  \ that all fold a result bit into r12.\n"
