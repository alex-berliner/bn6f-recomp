name: req_stepBoardCutsceneAnim
address: '0x080A7640'
kind: function
status: probable
summary: State-machine driver (states 0..3 at [r5+9]) that animates a request-board overworld sprite through
  a two-stage cutscene (anim 0x0A then 9 with SFX 0xE1), then clears the BBS completion flag, zeroes [r5+0x24],
  writes 2 to [r6+9], and hands control back via sub_80A7398.
interface: (r5 = object state struct ptr, r6 = config/marker struct ptr) -> r0 = destroyed; advances state
  byte [r5+9] 0..3 and loops back to 0 when done
details: State 0 sets animation 0x0A via sprite_setAnimation/sprite_loadAnimationData and sprite_noShadow.
  State 1 polls sprite_getFrameParameters until bit 0x80 (animation-finished flag) is set. State 2 copies
  three words from [r6+0x7C], [r6+0x80], [r6+0x84] into [r5+0xC], [r5+0x10], [r5+0x14] (apparently destination
  x/y and a parameter), sets animation 9, and plays sound effect 0xE1. State 3 writes 3 to [r6+7], calls
  sub_80A76CC, again waits on the 0x80 animation flag, then calls reqBBS_clearFlag_8140A0C, resets its
  state byte to 0, zeroes [r5+0x24], writes 2 to [r6+9], and tail-calls sub_80A7398 to hand control back.
  The function re-enters every frame and is effectively a coroutine-style sequencer.
