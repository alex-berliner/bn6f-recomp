name: sub_8003E18
address: '0x08003E18'
kind: function
status: confirmed
summary: Iterates the battle object list and updates/queues each sprite, then finalizes the frame.
interface: void sub_8003E18(void); // clobbers r0-r3, r10, r12, flags, lr; preserves r4-r9, r11
details: "Walks dword_2039A10 for byte_2036778 object slots. For each object the\nstatus byte at offset 0 controls\
  \ per-sprite work:\n  - bit 1 set: calls sprite_projectAndCull (transform at +0x34), then\n    sprite_ensureGfxResident(r0=1),\
  \ then sprite_queueFramePieces(r0=2,\n    r1=0x40) on the piece list at +0x90.\n  - bit 1 clear: zeroes the queued-piece\
  \ counter at +0x90+0x24; if bit 0\n    is also set, still calls sprite_projectAndCull to keep the transform\n\
  \    up to date.\nAfter the loop it calls sub_80028C0(1) to commit the batched frame. Saves\nand restores r4-r9\
  \ and r12 across the callees that would clobber them.\n"
