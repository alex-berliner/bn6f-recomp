name: battle_attackSubstepSlashTick_8115466
address: '0x08115466'
kind: function
status: confirmed
summary: Decrements an AI attack sub-step counter; on wrap, spawns a slash effect object at the attacker's
  forward position.
interface: void battle_attackSubstepSlashTick_8115466(u32 attacker /*r5*/, u32 attack_vars /*r7*/)  //
  preserves r5,r7; clobbers r0-r3,r4,lr,nzcv
details: "Reads the 8-bit oAIAttackVars_SubStepIndex from the AI attack variable block (r7) and decrements\n\
  it. If the result is non-zero the function returns immediately (early exit at locret). When the\ncounter\
  \ reaches zero it is reloaded with 4 (SUBSTEP_RELOAD). On that reload the function:\n  - Calls object_getFrontDirection\
  \ with the acting battle object (r5) to obtain the 4-bit facing\n    direction index.\n  - Multiplies\
  \ facing by 0xE0000 (14 px in 12.4 fixed-point) to get a forward x-offset.\n  - Reads the attacker's\
  \ (x,y,z) position triple at attacker+0x34 via LDMIA.\n  - Adds the x-offset to x and adds SLASH_Z_OFFSET\
  \ (0x80000, loaded from literal byte_81154E8)\n    to z.\n  - Calls spawn_t1_0x0_EffectObject with r1=x,\
  \ r2=y, r3=z, r4=1 to instantiate a type-1\n    slash visual effect.\nThe function is a single sub-step\
  \ tick within a multi-phase AI attack routine; it runs every\nframe the parent attack state is active.\
  \ r4 is saved/restored around the two callees because\nspawn_t1 clobbers it. The byte_81154E8 literal\
  \ is currently 0x0, so the z-offset is effectively\nnil in this build.\n"
