name: battleObject_dispatchCurPhaseByJumpTable_80D4570
address: '0x080D4570'
kind: function
status: confirmed
summary: Reads the battle object's current phase byte and tail-jumps to that phase's tick handler via a two-entry
  table next to the code.
interface: void battleObject_dispatchCurPhaseHandler_80D4570(r5 battleObject) — in r5=battle object, lr=return;
  out r1/r5/r8-r12+flags are whatever the dispatched handler leaves (passed through); clobbers r0-r7,lr
details: 'Tiny trampoline for battle objects. Loads the object''s oBattleObject_CurPhase byte from [r5+oBattleObject_CurPhase],
  uses it directly as a word offset into the inline table off_80D4584 (so phase 0 -> battleObject_phaseTickToNext_80D458C,
  phase 1 -> sub_80D45AE), then does the classic "mov lr, pc; bx r1" trick to enter the Thumb handler and return
  via pop {pc}. The handler is entered with r0 = phase value and r1 = the table entry (handler address) it was dispatched
  through, matching the original register state before bx. Because it tail-calls the handler, everything the handler
  leaves behind (r1, r5, r8-r12, NZCV) is effectively this function''s output contract. The table only covers phase
  values 0 and 1; any larger phase byte would read past off_80D4584 into whatever follows.

  '
