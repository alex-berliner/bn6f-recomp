open_questions:
- What semantic CurPhase 0 vs 1 corresponds to (only one BattleObject byte field, so the two handlers are likely
  "phase A / phase B" sub-states of the same CurState/CurAction).
- Whether sub_80D458C/sub_80D45AE themselves recurse through this trampoline or share further state.
