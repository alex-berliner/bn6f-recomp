name: object_updateCollisions
address: '0x080DE4EC'
kind: function
status: probable
summary: 'Per-frame collision-processing routine for a battle object: tears down old collision data, spawns
  hit effects, and dispatches by the object''s current action (or destroys the object once the battle
  is over).'
interface: (r5 = battle object ptr) -> void; destroys object by writing CUR_STATE_DESTROY when battle
  is over
details: Uses r5 as the battle object this-pointer. It first calls object_removeCollisionData and object_spawnCollisionEffect
  (hit-effect at the last collision, RNG-jittered), so this runs once per frame after a collision was
  detected. If the battle is over it clears the object's collision region and sets its state word (oBattleObject_CurStateActionPhaseAndPhaseInitialized)
  to CUR_STATE_DESTROY, ending the object. Otherwise, if any of the top bits of oCollisionData_FlagsFromCollision
  (mask 0xFF800000) are set it also clears the collision region. When time-stop is not active it jumps
  through a 3-entry table indexed by oBattleObject_CurAction to action-specific handlers (sub_80DE544/80DE594/80DE618);
  when time-stop is active it only refreshes collision data and highlights the collision panels.
