open_questions:
- No known caller, so the gameplay purpose (which mechanic scans for these panel flags) is unconfirmed
- Exact meaning of the flag bits in masks 0x20/0x2000/0x4000 (panel-state enum in object_checkPanelParameters)
- With direction -1 the table index base-8 lands on the literal pool; the table base is likely labeled
  8 bytes late or the direction values are not exactly +-1 — needs the real table layout
- What entity field 0x16 formally is (alliance/side id) and which structure r5 points to
