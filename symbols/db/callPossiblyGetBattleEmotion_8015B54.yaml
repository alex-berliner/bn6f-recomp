kind: function
status: confirmed
summary: Thin thumb wrapper that tail-calls possiblyGetBattleEmotion_8015B64 to fetch the player's current battle
  emotion/transformation state.
interface: (u8 alliance /* r0 */) -> (enum8? emotion /* r0 */, u8 transformation /* r1 */, u8 mood /* r2 */, u8
  beastOutCounter /* r3 */); flags c, v passed through from the callee
details: 'Pushes lr then immediately tail-calls possiblyGetBattleEmotion_8015B64 (0x08015B64) via bl, popping lr
  straight into pc on return, so the wrapper adds no logic of its own — all arguments and results pass straight
  through in the registers. The callee presumably resolves the emotion (Cross/Beast-Out related, per the returned
  transformation and beast-out counter) for the given alliance flag. Nothing here touches memory directly; structures
  and fields are handled in the wrapped function. Quirk: it exists purely as a register-callable entry point so
  callers don''t have to manage lr themselves when invoking the lookup.'
