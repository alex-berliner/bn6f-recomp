name: battle_object_destroy_80C6AAC
address: '0x080C6AAC'
kind: function
status: confirmed
summary: Tears down a battle object — clears its collision region and puts it into the destroyed state.
interface: void battle_object_destroy(BattleObject* obj /* r5 */); sets NZ flags from the state constant (Z=0, N=0
  for CUR_STATE_DESTROY=8)
details: 'Runs on a battle object passed in r5 (the standard oBattleObject pointer). First it calls

  object_clearCollisionRegion() so the object stops interacting with hits/collisions immediately.

  It then stores CUR_STATE_DESTROY (8) into the packed state field at offset 8

  (oBattleObject_CurStateActionPhaseAndPhaseInitialized), which is the state/action-phase pair the

  object''s state machine dispatches on; from the next update the object follows the "destroyed"

  state instead of running its normal behavior. The routine is a generic end-of-life handler, so

  it is likely used as the destroy/expire state handler shared by simple battle objects

  (effects, generic enemies whose death needs no special animation cleanup). Quirk: it relies on

  MOV #8 setting flags, and callers appear to branch on that, so the flags output is load-bearing.

  '
