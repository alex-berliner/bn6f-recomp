name: sub_81237E0
address: '0x081237E0'
kind: function
status: confirmed
summary: Initialises a PETNavi battle object on entry to a battle, optionally wiping VRAM/GFX buffers and HP on
  first entry, then starting an 8-frame fade-in.
interface: void battle_initNaviObject(u32 first_entry_flag /* r0 */, u32 battle_state_ptr /* r1 */, u32 navi_obj
  /* r5 */, u32 toolkit /* r10 */);  // r7 = toolkit, r4/r5 preserved
details: 'Saves the first-entry flag in r4. Zeroes twelve halfword timer/sub-state

  fields at navi_obj+0x20..0x3A (step 2 bytes) and navi_obj+0x18 (halfword),

  plus two bytes at 0x10/0x11. Stores the battle-state pointer at +0x4C.

  Calls sub_8120CC8(0, dword_81233D4) to fetch a graphics/sprite lookup,

  shifts its r1 left by 4, ORs into r0, and stores the packed byte at +0x12

  (navi sprite index). Calls GetCurPETNavi() to record the selected PET navi

  id at +0x14.

  If the first-entry flag is non-zero (r4 != 0): calls zeroFillVRAM(),

  ZeroFill_byte_3001960(), and GetCurPETNaviStatsByte(navi_id, 0x2D) to

  snapshot the navi''s HP (stat index 0x2D) into +0x0C.

  Regardless of flag: calls ZeroFillGFX30025c0() to clear the graphics

  buffer at 0x30025C0, then toolkit_applyOverlayPalette_80015FC(0x10) to

  set up the overlay palette. Writes 0x1F40 to the render-info word at

  toolkit+oToolkit_RenderInfoPtr+0 (sets BG mode / display control), zeroes

  six halfwords at +0x10..+0x1A (scanline counters). Sets navi_obj+0x01 = 4

  (active battle state code) and +0x02 = 0. Calls SetScreenFade(8, 0x10)

  to begin an 8-frame fade-to-black-in sequence. Assigns r7 = r10 (toolkit

  pointer) so the caller can use it directly after return.

  Called with r0/r1 as inputs; reads r5 (object base) and r10 (toolkit)

  throughout; writes r7 on exit. r4 is pushed/popped so it is transparent

  to the caller; r5 is never modified.

  '
