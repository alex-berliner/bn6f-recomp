name: sub_80293F8
address: '0x080293F8'
kind: function
status: confirmed
summary: Walks the player's selected-chip list and resets each active chip's in-flight state (clears firing flag,
  writes -1 sentinel to hit counter, decrements battle-state active-chip count).
interface: void custom_resetSelectedChipState_80293F8(u32 r5 /* chip-select HUD base (oS20364C0) */, u32 r10 /*
  toolkit base (oToolkit_BattleStatePtr) */)
details: "Reads oS20364C0_NumChipsSelected (byte at +0x20364C0) as a loop count; iterates starting at\nchip-select\
  \ HUD offset 0x48, one byte per entry. For each entry:\n  1. Calls getLocOfActiveChips_8027E1C with the chip ID\
  \ to obtain its chip record pointer.\n  2. If the record's type byte (offset +0) is 2 (linked chip), checks GetBattleMode()==1;\n\
  \     if not standard mode, skips the entry. Otherwise re-resolves through the link ID at +4.\n  3. If the final\
  \ record's type byte is 0 (active chip):\n     a. Reads the firing/in-flight flag at record+4 bit 0; if set, zeroes\
  \ battleState+0x17\n        (the global \"chip currently in flight\" byte).\n     b. Loads the hit-counter pointer\
  \ at record+8 and stores 0xFFFF (−1 as a u16) to it,\n        marking the chip as never-fired.\n     c. Reads\
  \ battleState+0x44 (active-chip enabled flag); if nonzero, decrements\n        battleState+0x45 (active-chip count).\n\
  r7 is preloaded to (0−1) = 0xFFFF as the halfword sentinel for the hit counter.\nThe loop advances idx by 1 and\
  \ decrements count by 1 each iteration.\nOutputs r1, r2, r3 are the last loop-iteration values (not meaningful\
  \ to callers).\nr4, r6, r7 are saved/restored across the call.\n"
