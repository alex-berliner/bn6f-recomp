name: navicust_exitScreen
address: '0x081360B4'
kind: function
status: probable
summary: Handler that closes the Navi Customizer screen, restoring the board display and returning to
  the submenu with the exit sound.
interface: () -> void; uses r5 = navi-cust screen state struct (global)
details: Sets the byte at [r5,#2] (a state/phase field of the Navi Cust screen state struct) to 0xC, then
  runs two teardown/transition helpers (sub_81362B8, sub_81362F8). It calls navicust_getCellProgramId
  once more (likely flushing the cursor cell's last update), calls sub_813660C with argument 0, and redraws
  the full 49-cell customizer board via navicust_drawBoardTilemap so the board BG is left in a clean state.
  Finally it plays SOUND_EXIT_SUBMENU and returns, matching the pattern of a UI exit handler that hands
  control back to the pet submenu.
