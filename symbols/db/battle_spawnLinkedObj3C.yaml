name: battle_spawnLinkedObj3C
address: '0x080E4B34'
kind: function
status: confirmed
summary: Spawns a battle object of type 0x3C, links it to a parent object and the parent's extra-vars block, and
  inherits the parent's alliance/direction-flip.
interface: void battle_spawnLinkedObj3C(u32 arg1 /*r1*/, u32 arg2 /*r2*/, u32 arg3 /*r3*/, u32 arg4 /*r4*/, BattleObject*
  parent /*r5*/, BattleObject** outPtr /*r7*/); returns new object in r0 (NULL on failure); r3/r6 are leftovers
  from the spawn call, r5 preserved
details: 'Wrapper around object_spawnType4 with the object type hardcoded to 0x3C; r1-r4 are spawn arguments passed
  straight through. On success (new object != NULL in r5 before it is saved around the pop): copies the parent''s
  oBattleObject_AllianceAndDirectionFlip halfword into the new object, stores the parent in the new object''s oBattleObject_RelatedObject1Ptr,
  stores the caller''s r7 (an extra-vars/owner block pointer) into oBattleObject_ExtraVars, writes the new object''s
  pointer back into the first word of that block (mutual link), and ORs 0x14 into the new object''s oObjectHeader_Flags
  (bit set 0x14 = 0x10|0x04). On failure nothing is linked and only the raw spawn-call leftovers are returned. Note
  the assembly keeps the new object in r0 and restores the original parent pointer into r5 around the call, so r5
  is unchanged for the caller and the fresh object is delivered in r0 (contract lists outputs r3/r5/r6, with r0/r1/r2
  clobbered).

  '
