name: battle_spawnLinkedObj3C
address: '0x080E4B34'
kind: function
status: probable
summary: Spawns battle object 0x3C of spawn-type 4 and links it to the requesting object, recording the
  new object's handle for the caller.
interface: (r0 = object id 0x3C for object_spawnType4, r1-r4 = other spawn params passed through unmodified
  from this fn's caller, r5 = parent battle object, r7 = ptr to handle slot) -> r0 = spawned object ptr;
  Z from spawn result gates the linking
details: Calls object_spawnType4 with id 0x3C; only r0 is set inside this function, so r1-r4 must already
  hold position/params prepared by the caller. On success (non-null spawn), it copies the parent's oBattleObject_AllianceAndDirectionFlip
  from r5 into the new object so they share alliance/flip, and stores r5 into the new object's oBattleObject_RelatedObject1Ptr,
  making the parent the related-object link. It writes r7 into the new object's oBattleObject_ExtraVars
  and writes the new object pointer back through r7 (*r7 = new obj), i.e. ExtraVars points at the caller's
  handle slot holding the object itself - the usual self-erasing handle so the parent can null the link
  when the object despawns. Finally it ORs flag bits 0x14 into the new object's oObjectHeader_Flags, likely
  marking it as linked/related. The `mov r0, r5`/`pop {r5}` pair around the null-check looks like a decode
  artifact of keeping the spawn result in r0 while restoring the parent pointer in r5.
evidence:
- method: assembly-reading
  date: '2026-10-18'
