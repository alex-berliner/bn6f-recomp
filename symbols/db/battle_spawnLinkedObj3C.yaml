    strh r1,[r0,...] — child inherits parent''s alliance/flip; str r5,[r0,#oBattleObject_RelatedObject1Ptr]
    — new object''s related-object link is the parent r5; str r7,[r0,#oBattleObject_ExtraVars]; str r0,[r7]
    — ExtraVars points at caller''s handle slot which now holds the new object; ldrb r1,[r0,#oObjectHeader_Flags];
    orr r1,#0x14 — sets flags 0x14 on the spawned object'
