- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_setCoordinatesFromPanels then object_createCollisionData with failure path calling
    object_freeMemory — collision allocation for the spawning object; mov r1,#0x36; bl object_setupCollisionData
    — collision setup with fixed collision type 0x36; ldrb r1,[r5,#oBattleObject_Param1]; strb r1,[r4,#1]
    — parent object's Param1 copied into the new collision-data block; mov r0,#0xff; bl object_setCollisionHitEffect
    — default/none hit effect on the collision data; mov r0,#CUR_STATE_UPDATE; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    — state advances to the update phase after spawn setup
