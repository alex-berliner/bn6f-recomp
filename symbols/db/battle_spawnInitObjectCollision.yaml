name: battle_spawnInitObjectCollision
address: '0x080D4B88'
kind: function
status: probable
summary: 'Spawn-state handler: gives a newly entering battle object its collision data, then advances
  it to the update state.'
interface: (r5 = battle object) -> r0 = next state (CUR_STATE_UPDATE); object freed if collision slot
  allocation fails
details: Runs sub_80D4C3A then object_setCoordinatesFromPanels to place the object on its panel. Calls
  object_createCollisionData; on failure (r0==0) it calls object_freeMemory to despawn the object and
  returns. On success it calls object_setupCollisionData with collision type 0x36, r2=r3=0, copies oBattleObject_Param1
  into collision data byte 1, sets the hit effect to 0xFF via object_setCollisionHitEffect, and runs object_presentCollisionData
  to evaluate collisions this frame. Finally it stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object switches to its normal update state next tick.
