name: battle_swordAreaHighlightStep
address: '0x08102680'
kind: function
status: probable
summary: 'Per-frame update for a sword-type AI attack: highlights the 2x3 panel area in front of the attacker
  while the attack is charging up, then triggers the hit.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 0; sets AttackElement/StepTimer/HitElement
  in the AI attack struct and panel highlight flags
details: 'State machine driven by oAIAttackVars_AttackElement: when 0 it initializes StepTimer from AttackBoost2
  and sets AttackElement to 4 (sword), returning immediately. Otherwise, every 4th frame (StepTimer bit
  2) it gets the facing direction via object_getFrontDirection and calls object_highlightPanel six times,
  marking two columns ahead of the object (x+dir and x+2dir) across all three rows (y-1, y, y+1) — exactly
  the WideSword hit area. Each call pushes/pops the x,y pair around object_highlightPanel, which sets
  the panel''s flag byte (offset 1) to 1 so the engine draws the targeting/slash overlay. StepTimer counts
  down each frame; when it reaches 0, HitElement is set to 4, handing off to the damage phase.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; bne skip-init; sets AttackElement=4 and StepTimer=AttackBoost2
    (init phase); bl object_getFrontDirection then r0=dir+PanelX, calls object_highlightPanel six times
    at y-1,y,y+1 for x+dir and x+2dir (2x3 area ahead); StepTimer counts down and on expiry strh r0,#4
    into oAIAttackVars_HitElement (transition to hit); callee object_highlightPanel sets the panel flag
    byte at offset 1 to 1, i.e. marks panels as highlighted
  refs:
  - bn6f/asm/asm31.s:160148
  - 0x0800E2CA object_getFrontDirection
  - 0x0800CBD8 object_highlightPanel
  reproduce: python3 tools/asmcat.py 0x08102680
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-010606'
open_questions:
- No caller known, so which enemy/attack uses this handler and what element 4 means in the element table
  is unconfirmed
- Whether the highlighted flags are consumed by a later sword-damage routine could not be verified from
  the shown code
