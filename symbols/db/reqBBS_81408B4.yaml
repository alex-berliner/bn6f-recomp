name: reqBBS_81408B4
address: '0x081408B4'
kind: function
status: confirmed
summary: Marks a BBS (bulletin-board) request as read/completed by setting the event flag whose index the caller
  passes, offset by the request-text table's base value.
interface: void reqBBS_setRequestReadFlag(u32 r0 flagIndex); inputs r0 = request flag index, r10 must be valid (required
  by SetEventFlag); outputs none meaningful (r3 is whatever SetEventFlag left in it), r4-r7 preserved, flags clobbered
details: 'Loads the pointer table reqBBS_textualPointers, reads entry at offset 0x18 (word index 6) to get a base
  flag value, adds the caller''s index in r0 to it, and tail-calls SetEventFlag to mark that event flag set. In
  game terms this is the "request board post has been handled/read" trigger: each BBS request text has an associated
  flag, and this routine sets it so the board state or NPC dialogue can reflect completion. No other state is touched;
  r4-r7 are pushed/popped purely as a formality (or to match a wrapper convention) and are unchanged. The result
  registers r3 (and the nzcv flags) are just residue from the SetEventFlag call, not intentional outputs.'
