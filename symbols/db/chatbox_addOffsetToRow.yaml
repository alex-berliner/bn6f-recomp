name: chatbox_addOffsetToRow
address: '0x03006C18'
kind: function
status: probable
summary: Adds a value fetched from a global chatbox table to all 16 words of one 0x40-byte row and advances
  the caller's output pointer/loop counters.
interface: (r6 = base table ptr, r1 = row index, r2 = dest row ptr; r4/r5 = loop counters) -> writes r6+r1*64[i]+globalVal
  to r2[i] for i=0x3C..0; r2 += 0x40, r4++, r5++; r0/r6 clobbered
details: 'Computes a source row as base r6 + r1*64, then loops r1 from 0x3C down to 0 in steps of 4, loading
  each word, adding r0 = [[r10+0x38]+0x38] (a global value reached via a high-register global pointer),
  and storing to r2. The row is exactly 0x40 bytes (16 words). The popped r0/r6 mean the caller passes
  the base in r6 and the routine''s own r6 use is scratch; r2, r4, r5 are deliberately returned modified,
  so the caller loops over multiple rows with this as one iteration. It sits in the chatbox text-engine
  cluster: chatbox_printNumber (0x3006CD0) and three other nearby subroutines (0x3006B94, 0x3006C3C, 0x3006E1C)
  call it, so it applies a per-row adjustment during text/glyph generation.'
