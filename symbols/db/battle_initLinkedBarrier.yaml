name: battle_initLinkedBarrier
address: '0x080CBB76'
kind: function
status: probable
summary: Spawns/initializes a sprite-0x80 translucent panel barrier at the object's panel; Param1==0 makes
  it a 0x13x0x14 50-HP smaller barrier linked to its parent via RelatedObject1Ptr's object header, otherwise
  a 0xEx0xF 150-HP larger variant, both stationary and CANNOT_SLIDE.
interface: (r0 = ? unused; r5 = battle object already allocated) -> r0 = collision slot or freed object;
  sets object into CUR_STATE_UPDATE
details: Loads sprite 0x80 anim 0 palette 0 with no shadow and marks the object flag bit2, then sets NameID
  0xD4 and HP/MaxHP to 0x32 (50) when Param1==0 or 0x96 (150) otherwise. Creates collision data sized
  0x13x0x14 (Param1==0) or 0xEx0xF, sets hit effect 0xFF, clears the collision region and runs the present-collision
  pass. When Param1==0 it stores itself into its RelatedObject1Ptr's object-header field, implying it
  is a summoned/linked component of a parent. It sets OBJECT_FLAGS_CANNOT_SLIDE, Timer=0xF, applies sprite
  alpha, spawns an effect object from the 3-word params at +0x34 with count 6, plays SFX 0x112, reserves
  its current panel (FuturePanelX/Y = PanelX/Y), and moves to the update state.
