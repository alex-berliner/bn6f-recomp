summary: Zeroes the 32-bit flag word at 020093A4
interface: void reset_flags32_20093A4(void)
details: 'Stores 0 into the single dword flags32_20093A4 (IWRAM 020093A4) and returns.

  It is a one-line resetter with no masking, so the entire flag word is cleared.

  The literal pool shows five more pointers to the same symbol at off_80071BC

  through off_80071CC, meaning several other call sites reference this flag

  word directly, likely for set/test operations nearby. Callers pass only lr

  and read back nothing; r0 and r1 plus the nz flags are clobbered.

  '
