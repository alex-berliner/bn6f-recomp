name: battle_initSlotsOrderPhaseB_80133EC
address: '0x080133EC'
kind: function
status: confirmed
summary: Initializes seven battle slot entries (via init_8013B4E) in the fixed order {0,6,7,8,9,A,B}, the second
  of two hard-coded init orders.
interface: void battle_initSlotsOrderPhaseB_80133EC(void); // no meaningful inputs; clobbers r0,r1,flags,LR; preserves
  r5,r6 (pushed/popped)
details: 'Reads a pointer table at off_801340C and takes entry 4, which points at byte_801341B = { 0x0, 0x6, 0x7,
  0x8, 0x9, 0xA, 0xB }. It then loops i = 0..6, calling init_8013B4E(i, orderList[i]) — i.e. (index, slotId) pairs
  — to initialize seven battle slot/entity entries in this specific sequence. A sibling routine (implied by the
  same pointer table) uses the other list byte_8013414 = { 0x0, 0x1, 0x2, 0x3, 0x4, 0x5, 0xB }, so the two order
  lists most likely correspond to two battle setup phases (e.g. front/rear row ordering or pre/post transition of
  the 0xB..0xB slot set). The order values 0..0xB suggest slot IDs into a 12-entry battle object table; only 7 of
  the 12 are touched here. r5/r6 are used only as scratch but are saved/restored, matching the original push {r5,r6,lr}
  / pop {r5,r6,pc}.

  '
