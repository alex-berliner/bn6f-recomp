summary: Start one 8-pixel walking step in MovementDirection.
interface: (r5 = NPC) -> Unk_70/Unk_74 = X/Y + NPCMovementIterationDeltas[dir] << 16 (the step's target); Timer
  = ceil(0x80000 / MovementSpeed / 0x1000) (SWI_Div); DeltaX/Y = NPCMovementSubiterationDeltas[dir] * speed << 12,
  DeltaZ = 0; MovementFlag_0a = 4; Next* = position + delta; sub_809F5B0; leaves r0 = Z, r1 = 0, r3 = 1, r4 = speed,
  r7 = subiteration delta entry
details: Reached only through jump tables (NPCCurActionJumptable, jt_809E6F0), so the lifted contract lists every
  register and flag as an output; the readable version leaves the original's (marked 'as the original').
