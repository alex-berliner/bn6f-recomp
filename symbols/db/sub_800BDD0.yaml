name: sub_800BDD0
address: '0x0800BDD0'
kind: function
status: hypothesis
summary: 'Battle-object phase step: when an action slot''s Unk_30 is in the 0xDD..0x118 window and the cross-team
  table lookup yields 0xBA, run the panel-targeted sub-animation (sub_800B884) and a panel-XY helper (sub_800ABC6)
  and set phase to 4; otherwise just bump CurAction by 4 and zero the phase field.'
interface: "void sub_800BDD0(void);          // r5 = battle object base, r10 = ?, lr = return\n                \
  \                 // clobbers r0,r1,r2,r3,lr and nz,cv; preserves r4,r5,r6,r7,r10\n"
details: "Operates on a battle object via r5 (oBattleObject_* layout).\n- Reads Unk_30 (u16 at +0x30) and checks\
  \ whether (Unk_30 - 0xDD) <= 0x3B, i.e. range 0xDD..0x118.\n- On hit, reads Alliance (u8 at +0x.., likely oBattleObject_Alliance),\
  \ XORs with 1 to get the opposing team's index, and calls getTable2036720EntryFields_802CE78(r0=oppAlli|r0^1,\
  \ r1=1) to fetch a 0xBA-tagged entry.\n- If the returned field equals 0xBA, it dispatches:\n    * sub_800B884(r0=Alliance,\
  \ r1=4)  -- likely a panel/animation kicker for the object\n    * sub_800ABC6(r0=PanelX, r1=PanelY) -- panel-XY\
  \ reaction/animation\n    * and stores 4 into CurPhaseAndPhaseInitialized (u16 at +0x..).\n- Default path stores\
  \ CurAction+4 back into CurAction (u8) and writes 0 into CurPhaseAndPhaseInitialized.\nNote: in the original asm\
  \ the xor path passes `r0 = alliance ^ 1`; the readable C comment\nshows `R1 = 0` but the asm pushes `mov r1,\
  \ #1`, so the second arg to getTable2036720EntryFields\nis 1, not 0.\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
