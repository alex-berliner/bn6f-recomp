name: navicust_dialogDelayTick
address: '0x08137550'
kind: function
status: probable
summary: Counts frames on an object and, after 60 frames, fires a navi-cust dialog script and advances
  the object's state.
interface: (r5 = object ptr, no args) -> r0 = 0x25/0x84 side effects only; increments halfword [r5+0xE],
  sets byte [r5+0x0]=0x84 when done
details: Each call increments the halfword counter at [r5+0xE] and compares it against 0x3C (60 frames,
  one second at 60fps). Below the threshold it returns immediately. At the threshold it calls sub_81375D8
  (unexamined), then invokes RunTextScriptNaviCustDialog with script id 0x25 — a fixed navi custom dialog
  — and finally stores 0x84 into the state byte at [r5+0x0], which the surrounding object code presumably
  dispatches on next frame. The counter is not reset here, so state 0x84 must take it out of this branch.
