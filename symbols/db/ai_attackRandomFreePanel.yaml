name: ai_attackRandomFreePanel
address: '0x08107FF4'
kind: function
status: probable
summary: 'AI attack setup: queues a callback that picks a random free nearby panel, targets the player,
  and enters attack state 9'
interface: (r5 = attacker BattleObject, r7 = its oAIAttackVars) -> r0 destroyed; sets PanelChooseCallback,
  AttackDuration, TargetObjectPtr, attack state 9
details: Stores object_findRandomFreeNearbyPanel into oAIAttackVars_PanelChooseCallback so the AI's panel
  selection is deferred/randomized, then calls sub_8107EB0 and stores its result as AttackDuration. It
  XORs the attacker's oBattleObject_Alliance with 1 and passes that to battle_findPlayer to cache the
  opposing player object in oAIAttackVars_TargetObjectPtr. Finally it calls object_setAttack4 with state
  9 to transition the object into the attack phase. The four callers are presumably per-panel-count or
  per-element variants that share this common setup tail.
