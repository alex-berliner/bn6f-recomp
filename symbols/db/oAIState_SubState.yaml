name: oAIState_SubState
address: '0x2'
kind: struct-field
status: probable
summary: AI sub-state index that drives a 2-entry handler dispatch table and per-script progress (e.g.,
  init vs. active vs. wait/timeout) within each AI script step.
details: ">\n  Heavy evidence as a sub-state index. At asm32.s:128 (`sub_810DA24`), `ldrb r0, [r6,#oAIState_Unk_02]`\
  \ is used to index `off_810DA40/off_810DA44`, dispatching to one of two handlers (\"off_810DA44:0\"\
  \ -> handler 0, \"off_810DA44:1\" -> handler 1). The same 2-entry dispatch pattern recurs at asm32.s:6238\
  \ (`sub_8110EB8`, indexing `off_8110ED0/off_8110ED4`) and at asm31.s:173151 (`sub_810A0BA`, indexing\
  \ `off_810A0C8/off_810A0CC`). Beyond dispatch, the field is used as a classic 0/1 progress flag: it\
  \ is set to 1 to enter the \"active\" branch (asm32.s:5143 SnakeArm, 16273 sub_81164EC, 16474 sub_8116758),\
  \ then set back to 0 when a timer expires; in ProtoMan routines (asm31.s:143346/143520/168518/168575/168637)\
  \ it is XORed with 1 (`eor r1, r0`) and `tst`-tested to alternate between two branches; and it is zeroed\
  \ alongside `oAIState_ScriptId` changes at every script transition, e.g., asm31.s:156095-156125, asm31.s:173127-173142,\
  \ asm32.s:6298."
