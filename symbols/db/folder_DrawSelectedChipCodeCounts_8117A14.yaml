name: folder_DrawSelectedChipCodeCounts_8117A14
address: '0x08117A14'
kind: function
status: confirmed
summary: On the folder screen, renders the selected chip's four code letters and the per-code "copies in folder"
  tallies into a tile buffer and queues them to VRAM.
interface: 'void sub_8117A14(r4: *entry /* folder entry, chip id halfword at +2 */) -> r0-r3 as left by QueueEightWordAlignedGFXTransfer,
  nz/c/v from last callee; r4-r7 preserved'
details: 'Folder-screen selected-entry redraw. Clears the 0x200-byte tile buffer at unk_2016300 via ZeroFillByEightWords,
  then reads the chip id halfword from the folder entry at r4+2 and looks it up with getChip8021DA8. Bytes 0-3 of
  the chip''s database entry are its four code letters; each letter is drawn into the tile buffer by sub_8117A84,
  and folder_CountChipsOfCodeOrSkipEntry_8117AA0 counts matching folder entries (skipping the selected chip''s own
  entry) and draws the tally next to it. The drawing callees thread a write cursor in guest r6 and expect the chip
  id in r4 and the chip database entry in r5, which this function reloads around each call. The finished tiles are
  queued to VRAM at 0x6013B40 (size 0x20 << 4 = 0x200) with QueueEightWordAlignedGFXTransfer.

  '
