name: ow_copyTiles8x17ToBg
address: '0x0804AE50'
kind: function
status: probable
summary: Blits a fixed 8x17-tile image stored in RAM (unk_203486C) onto background tile block 0 at column
  0x15, row 2.
interface: () -> r0 = void; calls CopyBackgroundTiles(0x15, 2, 0, unk_203486C, 8, 0x11); no meaningful
  flags
details: 'The routine is a thin wrapper: it hardcodes j=0x15, i=2, tileBlock32x32=0 and passes the pointer
  to unk_203486C as the tile_ids source with an 8-wide by 0x11-tall region. So an 8x17 tile image must
  already be staged in RAM at unk_203486C before this is called, and it is written into tile block 0 at
  grid position (0x15, 2). No other state is touched and the return value is unused. What the image depicts
  depends on whoever fills unk_203486C, which is not visible here.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0x15 / mov r1,#2 / mov r2,#0 set the CopyBackgroundTiles j/i/block arguments; ldr r3,
    off_804AE64 loads tileIds = unk_203486C; mov r4,#8 / mov r5,#0x11 give the 8x17 tile region size;
    sole callee is CopyBackgroundTiles (0x080018C2), so the whole effect is one BG tile copy; single caller
    sub_804A514 at 0x0804A514, whose purpose is unknown
