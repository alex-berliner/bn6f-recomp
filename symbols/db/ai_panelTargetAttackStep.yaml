name: ai_panelTargetAttackStep
address: '0x080FFCA8'
kind: function
status: probable
summary: 'AI attack step: picks a target panel via a per-alliance callback, reserves it, animates the
  attacker onto it, then sets the hit element after a short delay.'
interface: (r0 = ignored (reloaded from oAIAttackVars_AttackElement), r5 = attacker object, r7 = AI attack
  vars) -> r0 = scratch/exit value; sets FuturePanelX/Y, HasMoved, StepTimer, HitElement
details: Two-phase step function. On entry (AttackElement==0) it writes element 4 into AttackElement,
  checks object_canMove, then indexes a table at byte_80FFD10 by alliance*8 to get two arguments and calls
  the callback stored in oAIAttackVars_PanelChooseCallback with the target object pointer; the callback
  returns panel coords in r0/r1, which are stored to oBattleObject_FuturePanelX/Y. It then claims the
  panel with object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, plays animation
  4, clears ScratchVar, sets HasMoved=1 and StepTimer=2. On the follow-up step (AttackElement!=0) it decrements
  StepTimer and when it hits 0 writes element 4 into oAIAttackVars_HitElement. If movement is blocked
  or the callback returns no panel, it clears HasMoved and bails via object_exitAttackState.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst r0,r0 / bne on oAIAttackVars_AttackElement makes the two-phase (start vs. follow-up) structure
    explicit; ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; bx r1 with table args from byte_80FFD10[alliance*8]
    returns target panel coords in r0/r1; strb r0/[r5,#oBattleObject_FuturePanelX/Y] followed by bl object_reservePanel
    shows it claims the chosen panel; object_setFlag1 with OBJECT_FLAGS_CANNOT_SLIDE and CurAnim=4 shows
    the attacker locks in place with an attack animation; StepTimer countdown ending in strh r0,[r7,#oAIAttackVars_HitElement]
    with element 4 shows the delayed hit assignment
