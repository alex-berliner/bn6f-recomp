name: ai_panelTargetAttackStep
address: '0x080FFCA8'
kind: function
status: confirmed
summary: 'One step of the AI''s "walk onto the target''s panel and strike" attack: reserves a destination panel
  via the alliance''s panel-choose callback, then counts down a short wind-up before the hit fires.'
interface: void ai_panelTargetAttackStep(battleobject *r5, int r6 /*attack phase*/, aiattackvars *r7); clobbers
  r0-r4, r6, r7, lr and nzcv; leaves r1/r5/r8-r12 as the callees leave them
details: "Per-frame step routine for an AI attack whose motion is \"move to the target's\npanel\". r5 = battle object,\
  \ r6 = phase argument (unused here), r7 = AI attack\nvariables block.\n\nFirst invocation (oAIAttackVars_AttackElement\
  \ == 0):\n  * Latches element id 4 into oAIAttackVars_AttackElement so later steps take\n    the timer path.\n\
  \  * Calls object_canMove; if the object cannot move, clears\n    oAIAttackVars_HasMoved and calls object_exitAttackState\
  \ to abandon the attack.\n  * Otherwise reads an 8-byte descriptor entry from the table at byte_80FFD10,\n   \
  \ indexed by oBattleObject_Alliance << 3 (four alliances, entries are pairs of\n    words passed in r2/r3).\n\
  \  * Calls the routine stored in oAIAttackVars_PanelChooseCallback with\n    r0 = oAIAttackVars_TargetObjectPtr\
  \ and r1 = the callback itself; it returns\n    the chosen panel in r0 (x) and r1 (y).\n  * If the callback returns\
  \ 0 in r0 (no usable panel), clears HasMoved and exits\n    the attack state via object_exitAttackState.\n  *\
  \ Otherwise stores the chosen panel into oBattleObject_FuturePanelX/Y, calls\n    object_reservePanel with (x,\
  \ y, object), sets flag OBJECT_FLAGS_CANNOT_SLIDE\n    via object_setFlag1 so the object can't be pushed off the\
  \ reserved panel,\n    sets oBattleObject_CurAnim to 4 (wind-up/attack animation), clears\n    oAIAttackVars_ScratchVar,\
  \ sets oAIAttackVars_HasMoved to 1 and starts\n    oAIAttackVars_StepTimer at 2.\n\nSubsequent invocations (AttackElement\
  \ != 0): decrements the 16-bit\noAIAttackVars_StepTimer; while it is still > 0 (signed compare via bgt on the\n\
  full 32-bit decremented value, so only a timer of 0 or 1 counts as expired) it\njust returns. When the timer runs\
  \ out it stores 4 into the 16-bit\noAIAttackVars_HitElement, telling the next attack step to fire the actual hit.\n\
  \nTable byte_80FFD10 (per-alliance panel-choose descriptors): alliance 0 =\n0x10,0x00000 0A0,0x0F88 word pair;\
  \ alliance 1 = 0x30,0x00000 0F88 word pair\n(byte data: 0x10 0x00 0x00 0x00 0xA0 0x00 0x88 0x0F / 0x30 0x00 0x00\
  \ 0x00 0x80\n0x00 0x88 0x0F).\n"
