open_questions:
- What the two-word descriptor entries in byte_80FFD10 actually encode (function pointer plus parameter? two pointers?)
  and which panel-choose routines they select for each alliance.
- The meaning of element id 4 (both in AttackElement and HitElement) - presumably a "normal/physical melee" element
  id in the AI attack tables.
- What animation id 4 (oBattleObject_CurAnim) corresponds to visually.
- Whether oAIAttackVars_ScratchVar is used by a later step of this same attack.
