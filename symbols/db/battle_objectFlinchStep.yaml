name: battle_objectFlinchStep
address: '0x080E717A'
kind: function
status: confirmed
summary: Runs one frame of a battle object's flinch state machine — starts the flinch pose, counts its 15-frame
  timer down, then switches to the recovery animation and ends the flinch.
interface: void battle_objectFlinchStep(battleObject* obj /* r5 */); no return value, NZCV clobbered
details: "State machine over the battle object struct (r5), using oBattleObject_CurAction,\noBattleObject_Timer\
  \ and oBattleObject_CurAnim:\n- If CurAction is 8 (flinch already finished/ended), returns immediately without\
  \ touching anything.\n- If CurAction is not 4 (not currently flinching), the flinch is started: CurAction = 4\
  \ and\n  Timer (u16) = 15 frames.\n- Every call then decrements Timer; while the result is still > 0 nothing else\
  \ happens.\n- When the timer reaches 0, CurAnim = 9 (recovery/flinch-end animation) and CurAction = 8,\n  which\
  \ is the terminal state this step ignores on later calls.\nPresumably called once per frame from the battle object\
  \ update loop for objects that got hit\n(custom/FLD parts flinch behaviour). Only r0/r1 and flags are clobbered;\
  \ r5 is the object\npointer and must be set up by the caller.\n"
