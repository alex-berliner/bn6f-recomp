name: battle_aiAttackStep_80FEF60
address: '0x080FEF60'
kind: function
status: confirmed
summary: 'Per-frame AI attack tick: initializes a fire-element attack on first call, then counts charge
  cycles while highlighting panels until the step timer expires and the hit resolves.'
interface: 'void battle_aiAttackStep(/*r5=battleObject, r7=aiAttackVars*/); /* in: r5,r7,lr; out: r1;
  clobbers: r0,r2,r3,nzcv,lr; preserves: r4 */'
details: Operates on an AIAttackVars struct (r7) and a BattleObject (r5). If oAIAttackVars_AttackElement
  is 0 (first tick), sets element to 4 (Fire), animation 7 on the battle object, copies oAIAttackVars_AttackBoost2
  (a byte) into oAIAttackVars_StepTimer (u16), zeroes oAIAttackVars_ChargeCycles, and seeds oAIAttackVars_AttackStepIndex
  from byte 0x12 of the target object at oAIAttackVars_TargetObjectPtr. On subsequent ticks, increments
  oAIAttackVars_ChargeCycles; when bit 2 of the counter is clear (charge cycles mod 8 != 4..7), calls
  object_highlightPanelRegion(stepIndex, 2, 4, allianceAndDirFlip) to flash the relevant panel. Decrements
  oAIAttackVars_StepTimer (signed compare); once it reaches zero or below, writes 0x10 to oAIAttackVars_HitElement
  to trigger the impact phase. r1 is passed through (or overwritten by highlightPanelRegion's return in
  r1).
