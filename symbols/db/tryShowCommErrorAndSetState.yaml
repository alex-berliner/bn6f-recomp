name: tryShowCommErrorAndSetState
address: '0x0803CD40'
kind: function
status: probable
summary: If no screen fade is active, runs the comm-error text script (index 0xA) and writes 8 as a byte
  to [r5] (a state field in the caller's context).
interface: (r0 unused on entry; r5 -> error object/context) -> r0 clobbered; flags clobbered
details: It calls IsScreenFadeActive and returns immediately if a fade is in progress (beq skips the body).
  Otherwise it invokes RunTextScriptCommError_803CD64 with r0 = 0xA, presumably a message/script index
  for the comm-error text, then writes the constant 8 as a byte to [r5], likely a state/phase field of
  a context the caller keeps in r5. The guard against fading suggests the message must only appear during
  normal rendering.
