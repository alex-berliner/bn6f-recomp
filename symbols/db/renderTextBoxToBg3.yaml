name: renderTextBoxToBg3
address: '0x08136BA0'
kind: function
status: probable
summary: Renders a text-graphics string into VRAM tiles at 0x600B800 and copies the resulting 10x6 tile
  block onto BG3 at map position (0xD, 0x12).
interface: (r0 = text index/param passed to renderTextGfx) -> void
details: The function forwards its argument (r0, moved to r1) to renderTextGfx_8045F8C along with the
  text base eTextScript201D280, scratch buffer byte_201B200, a VRAM target of 0x600B800, size 0xA, palette/bank
  3, and font table dword_86A5D60, so the string's glyphs are drawn as 4bpp tiles into 0x600B800. It then
  calls CopyBackgroundTiles with j=0x12, i=0x13, tile block 3, tile-id list byte_813565C, and extent 10x6,
  copying the freshly rendered tile region into the BG3 tilemap at that map position. The tile-id list
  byte_813565C sits just before this function, suggesting the two are part of one text-display unit. No
  return value is produced and registers r4-r7 are only scratch.
