name: encryption_navicustMaybe_8006e50
address: '0x08006E50'
kind: function
status: confirmed
summary: Verifies one entry of a data table against an obfuscated reference checksum byte, signalling a mismatch.
interface: int encryption_navicustVerifyChecksumByte(u32 index /* r0 */, void* toolkit /* r10 */); // returns flags
  from CMP on match, r0 = 1 on mismatch
details: 'Compares a tamper-check byte against actual data. index (r0) selects a byte of the

  static table byte_20004E0, which is XORed with 0x6F to recover the expected value.

  The expected value is compared against the byte at index in the array pointed to by

  toolkit->Unk2004a8c_Ptr (the pointer lives at oToolkit_Unk2004a8c_Ptr offset within

  the toolkit struct reached via r10). If the two bytes differ, r0 is set to 1

  (mismatch/corruption detected); if they match, r0 is left clobbered with the

  comparison index and callers must rely on the CMP flags instead. r1-r7 and the

  return address are preserved via push/pop. Given the XOR-obfuscated checksum table,

  this looks like an anti-tamper/integrity check over navicust-related save or

  working data, hence the tentative "navicust" association.

  '
