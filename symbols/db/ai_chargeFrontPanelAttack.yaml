name: ai_chargeFrontPanelAttack
address: '0x080FC226'
kind: function
status: probable
summary: 'AI attack state machine: starts a charge attack (element 4, anim 0xF), highlights the panel(s)
  in front of the enemy while charging, and triggers the hit when the step timer expires.'
interface: (no args; r5 = battle object, r7 = AI attack vars) -> void
details: 'When oAIAttackVars_AttackElement is 0 the attack is initialized: element is set to 4, the object''s
  current animation to 0xF, the step timer is loaded from AttackBoost2, and ChargeCycles is cleared. On
  subsequent calls ChargeCycles increments; every 8 cycles (lsr #3 carry) it computes the facing multiplier
  via object_getFrontDirection and calls object_highlightPanelRegion on the adjacent panel in front (panelX+dir,
  panelY, alliance/direction-flip in r3, region size 6). Meanwhile StepTimer counts down, and when it
  reaches 0 the attack fires by writing HitElement = 0x10 for the damage handler downstream. The highlighted
  panel is the telegraph of where the attack will land.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: AttackElement==0 branch sets element 4, anim 0xF, StepTimer=AttackBoost2, ChargeCycles=0 (init
    state); ChargeCycles>>3 carry-gated call to object_getFrontDirection + object_highlightPanelRegion
    highlights the front panel every 8 charge cycles; StepTimer decrement to 0 writes HitElement=0x10,
    handing off to the attack/damage phase; r5 fields oBattleObject_PanelX/PanelY/AllianceAndDirectionFlip
    confirm the highlighted panel is relative to the acting battle object
