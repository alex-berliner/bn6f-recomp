name: camera_beginLinkPan
address: '0x0813005C'
kind: function
status: probable
summary: 'Starts a camera state-8 pan: picks a target id from overlay work, marks it 0x8000, snapshots
  the link state into the camera end position, and sets speed 2.'
interface: () -> void; reads target camera struct from caller-set r5, no args or return
details: Stores state 8 into r5+2 and 0 into r5+3, so this initializes one mode of a camera/task state
  struct. It fetches the overlay work struct, reads the byte at +0xC (a target/entity id), ORs in 0x8000
  and stores the halfword to r5+0x2A and to eCamera+0xA — the 0x8000 bit likely flags the value as an
  id/absolute target rather than a raw coordinate. camera_copyLinkStateToEnd is called to seed the camera's
  end position from eLinkState fields 0x1C/0x0A, so the pan ends at the current link position. It then
  writes 2 to r5+0x26 and eCamera+8, plausibly a scroll/interpolation speed. No other structs are touched;
  the function is purely an initializer for this camera mode.
