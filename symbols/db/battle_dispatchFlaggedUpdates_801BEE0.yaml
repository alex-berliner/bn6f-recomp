    0x40) - `lsr r7, r7, #1` / `bcs loc_801BEF2` together with `beq locret_801BEFC` at top of loop = walk
    bits LSB-first until exhausted - `ldr r0, [r6]` + `mov lr, pc` + `bx r0` mimics a `bl` to the slot
    pointer (each slot +1 means thumb bit already set) - `add r6, #4` advances the handler table regardless
    of whether the slot was called - Handler slot table at `off_801BF04` lists 24 pairs ending at `sub_801D71A`;
    4 of them are `nullsub_58` => bits 6/9/11/13 are inert - Single caller is `battle_update_8007A44`,
    the per-frame battle update entry (r4/r10 live across, in contract) - Captured r0 on entry differs
