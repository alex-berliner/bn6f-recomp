name: rfuLinkMismatchCount
address: '0x02010434'
kind: data
status: probable
summary: 'Proposed name: rfuLinkMismatchCount. EWRAM byte counting wireless-link peer value mismatches,
  cleared when a transfer starts. (u8)'
details: Lives in EWRAM next to other RFU link-state bytes. rfu_startLinkTransfer zeroes it together with
  the other link-state globals when initializing a transfer. rfu_uniPollPeerValueChanges increments it
  by one each time a peer's reported value does not match the expected slot (the 'other' tally), and the
  function summary notes that once all masked peers have reported it 'increments a mismatch counter'.
  It is a simple per-transfer byte, not a field of an EWRAM struct, so it gets a standalone prefix_name
  rather than an e<Struct>_<Field> name. The two .word occurrences are just the standard off_ table entries
  that relocate every EWRAM label to its runtime address.
