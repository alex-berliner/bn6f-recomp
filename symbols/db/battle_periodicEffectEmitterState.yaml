name: battle_periodicEffectEmitterState
address: '0x080E1A0C'
kind: function
status: probable
summary: State handler for a battle object that periodically emits a jittered effect (with optional sound)
  around a target until its lifetime timer expires.
interface: (r5 = battle object) -> sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY
  on expiry; no return value
details: 'Reads oBattleObject_ExtraVars; if it or its first word is zero, or after oBattleObject_Timer
  counts down to 0, it destroys the object. Each frame while alive, it checks the Timer''s low bits: with
  mask 0xF (or 3 when oBattleObject_Param1==0) it fires when Timer&mask equals the mask, i.e. every 16
  frames (every 4 when Param1 is zero). On fire, it takes the RelatedObject1Ptr''s X/Y/Z, jitters X and
  Y via AddRandomVarianceToTwoCoords with range 0x1F, adds 0x10 to Z, and spawns a type-4 effect object
  of effect type oBattleObject_Param2 via spawn_t1_0x0_EffectObject. If oBattleObject_Param3 is zero it
  also plays sound effect 0x6F. Fields used: ExtraVars (+deref), Timer, Param1/2/3, RelatedObject1Ptr,
  CurStateActionPhaseAndPhaseInitialized.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: Timer decrement with bhi skip, then mov r0,#CUR_STATE_DESTROY to oBattleObject_CurStateActionPhaseAndPhaseInitialized
    = lifetime countdown; and r0,r1 with mask 0xF (or 3 if Param1==0) and cmp == mask = periodic trigger
    every 16/4 frames; ldr RelatedObject1Ptr X/Y/Z then bl AddRandomVarianceToTwoCoords with 0x1F range
    = jittered emitter position; bl spawn_t1_0x0_EffectObject with r4=Param2 effect type and Z+0x10 =
    spawns the effect one tile up; bl PlaySoundEffect 0x6F gated by Param3==0 = optional sound per emission
