name: ai_setBeastOutPwrAtk_800FFAA
address: '0x0800FFAA'
kind: function
status: confirmed
summary: Writes the AI's held power-attack id, making any Beast Out value (0x21-0x26) stick until replaced, and
  fixes the B-button remap while in Beast state.
interface: u32 ai_setBeastOutPwrAtk(AIData* ai /* r4 */, u8 value /* r0 */); returns report in r2 (value written
  when in Beast state, otherwise the caller's incoming r2 passes through)
details: 'Operates on the AI data struct at r4, touching oAIData_BPwrAtk (offset 7) and oAIData_BButton (offset
  6). A "Beast" power-attack value is one in 0x21..0x26. The new value in r0 is written unconditionally if it is
  itself a Beast value; a non-Beast value is only written while the stored value is not a Beast value, so an active
  Beast Out attack is never overwritten by a normal one. Afterwards, if the stored value is a Beast value, the AI''s
  B-button field is normalized: button 3 or 4 becomes 0, and button 0x2C becomes 0x2B (0x2B is also reported in
  r2 when the button was neither 3, 4, nor 0x2C). r2 therefore reports what was written (0, 0x2B, or, on the non-Beast
  early-exit path, whatever the caller left in r2). A pooled table pointer off_800FFE0 -> byte_8020354 follows the
  function but is not referenced by it. Flags NZCV are clobbered; r0, r1, lr are scratch and everything else is
  preserved.

  '
