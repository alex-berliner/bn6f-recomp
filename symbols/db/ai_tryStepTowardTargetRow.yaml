name: ai_tryStepTowardTargetRow
address: '0x080F3F24'
kind: function
status: probable
summary: 'AI attack-state movement step: moves the object one panel vertically toward a stored target
  row, reserving the panel and setting slide velocity.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = void; calls object_exitAttackState on failure
details: If object_canMove passes, the routine reads the object's PanelY and a target row from oAIAttackVars_AttackBoost2,
  deriving a +1/-1 vertical step direction (negative if the object is below/above the target row). It
  adds the step to Y and validates the resulting panel with object_checkPanelParameters using per-alliance
  mask pairs from byte_80F3F8C (both alliances use mask 1 / ~mask 0x0F8800A0 vs 0x0F880080). On success
  it stores FuturePanelX/Y, claims the panel via object_reservePanel, looks up a per-difficulty-tier word
  from byte_80F3FA0 (0x45000/0x55000/0x65000/0x70000), and calls sub_80F46A4 to get X/Y velocities and
  a step duration, storing velocities in oBattleObject_X/YVelocity and the duration in oAIAttackVars_StepTimer.
  It then calls sub_80F3FB0, sets OBJECT_FLAGS_CANNOT_SLIDE in the object's flags (so it can't be knocked
  off its reserved panel), and sets oAIAttackVars_HitElement = 8 (contact element while stepping). If
  the panel check or canMove fails, it exits the attack state via object_exitAttackState.
