name: packSelectionSlots_8126494
address: '0x08126494'
kind: function
status: confirmed
summary: Packs 7 chip-selection slots (12 bytes each) from an index table, clearing them if the chip index
  is 0 or filling three trailing u16 fields with consecutive words from 0x8340 + chip-byte5*3.
interface: void sub_8126494(u32 chipIndex, u32 baseAddr, u32 slotAddr); // r0 in, r1 in, r2 in; r7 clobbered
  (loop counter); r4-r7 preserved across body
details: "Walks 7 entries of a chip-index table located at baseAddr + chipIndex*4 (each entry is a u16\n\
  read at the cursor's low half). For each slot (12 bytes at slotAddr + i*0xC):\n  - If the chip index\
  \ is 0, the slot is fully zeroed (12 bytes + the trailing u16 at\n    offset 0xA via strh).\n  - Otherwise\
  \ it calls getChip8021DA8(idx) to fetch the chip's data record, reads byte 5 of\n    the returned struct,\
  \ and computes tableBase (0x8340) + byte5*3. The first three u16\n    fields (offsets 0/2/4) are zeroed;\
  \ the last three u16 fields (offsets 6, 8, 0xA) are\n    filled with that base, base+1, base+2 as u16s.\n\
  Likely the slot layout mirrors the battle chip-select list used by the chip cursor: the\n[unknown] u16s\
  \ at 0/2/4 may hold flags/counts that are reset, while offsets 6/8/0xA hold\nthree consecutive palette/anim/icon\
  \ data words indexed by the chip's element/class byte.\nQuirks: stores \"0x8340\" (literal at dword_81264E0)\
  \ is the element/anim lookup base; r4 is\nused as a scratch running pointer, doubled via lsl r0,#1 then\
  \ r0 + r0 (i.e. *3) to index\nit by 3 bytes per entry. The +1/+1/+1 sequence means the three trailing\
  \ fields are\ncontiguous (base, base+1, base+2) rather than stride-3.\n"
