name: GetPositiveSignedRNGSecondary
address: '0x08001562'
kind: function
status: confirmed
summary: Advances the game's secondary RNG seed and returns it as a non-negative signed value for caller convenience.
interface: 'u32 GetPositiveSignedRNGSecondary(void); // in: none (r7 preserved as save/restore scratch) // out:
  r0 = new seed with bit 31 cleared (always in [0, 0x7FFFFFFF]) //      r2 = old seed << 1, r3 = old seed >> 31
  (callers reportedly reuse these) // clobbers: r1, flags NZCV

  '
details: 'Reads the 32-bit secondary RNG seed from eSecondaryRngSeed, advances it, and stores the new value back.
  The advance is: rotl(seed,1) computed as (seed<<1)+(seed>>31), then +1, then XOR with the constant 0x873CA9E5.
  Before returning, the result is masked to 31 bits via (seed<<1)>>1 (logical), so the returned value is always
  a "positive" signed 32-bit number; the full 32-bit new seed is what gets stored. r2 and r3 are left holding the
  shift intermediates of the *old* seed and r1 holds the constant, which some callers apparently rely on (hence
  they appear as outputs in the contract). This is a secondary RNG stream, distinct from the main one, used for
  things like random battle/injection events where a guaranteed non-negative value simplifies modulo/bounds math
  at call sites.

  '
