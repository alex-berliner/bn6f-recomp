name: battleObject_runInitPhaseOrAdvance
address: '0x080E7EE0'
kind: function
status: probable
summary: Initializes a battle object's panel-position-related state on first execution, then advances
  to action 0xC if the current Param2 is 0
interface: (r5 = battleObject*) -> void; uses r0,r1,r2,r3,r6,r7 as scratch
details: On entry, if oBattleObject_PhaseInitialized is 0, it gathers the object's panel coordinates (PanelX,
  PanelY), its Element, and an aggregate of oBattleObject_DamageAndStaminaDamageCounterDisabler plus oBattleObject_Z16Save,
  then calls sub_80BCCDC to perform an initialization using a pointer built at r5+5 and the RelatedObject1Ptr.
  It marks the phase as initialized by writing 4 to PhaseInitialized. After init, if oBattleObject_Param2
  is 0, it sets CurAction=0xC and clears CurPhaseAndPhaseInitialized, otherwise it returns. The function
  name reflects the conditional init-then-advance pattern.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: PhaseInitialized byte at r5 is checked and only set to 4 on first call (asm 2,18); sub_80BCCDC
    called with PanelX, PanelY, Element and damage+Z16 aggregate (asm 5-13); RelatedObject1Ptr (r5+0x...)
    and r5+5 are passed to the initializer (asm 12-14); On re-entry, Param2==0 forces CurAction=0xC and
    clears CurPhaseAndPhaseInitialized (asm 21-25); No callers known — function is reached only as a phase
