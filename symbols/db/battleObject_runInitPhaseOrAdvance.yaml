open_questions:
- Which callers invoke this function — needed to know which battle object type and what action 0xC is
- What sub_80BCCDC actually does with the panel/element/damage arguments (also undocumented)
- What the r5+5 word (used as one of two pointers to sub_80BCCDC) actually contains
- Why oBattleObject_Z16Save is added to the damage counter before the initializer call
- Whether the '4' written to PhaseInitialized is a phase id or merely a non-zero marker
