name: sub_80FD6A6
address: '0x080FD6A6'
kind: function
status: confirmed
summary: Battle AI attack step machine — winds up the attack then launches a hit at the panel in front of the object.
interface: void sub_80FD6A6(u32 r1, u32 r3 /*ctx?*/, BattleObject* r5, AIAttackVars* r7) -> r1, r5
details: 'Operates on a battle object''s AI attack variables (r7 -> AIAttackVars) and the object itself (r5).

  On first call (Unk_01 == 0): initializes windup — sets Unk_01 = 4, sets oBattleObject_CurAnim = 5,

  calls object_setCounterTime(0x12), sets Unk_10 = 0x18 (windup ticks).

  On subsequent calls while Unk_10 > 0: decrements Unk_10 and returns.

  On expiry (Unk_10 reaches 0): reads Unk_03 (direction index 0..3), looks up high-nibble

  from the 4-entry table A_byte_80FD6F0 = {0xE,0xC,0xA,0x8} (so attack IDs become

  (table[idx]<<8) | idx, i.e. 0x0E00|idx .. 0x0800|idx), calls object_getFrontDirection to

  compute the front-panel coordinate, then calls sub_80C81A6(targetX, targetY, Unk_02, r3,

  attack_id, Unk_Damage) to spawn the hit, and finally sets Unk_00 = 0x14 (recovery state).

  Note: Unk_02 carries the attack element/type; Unk_Damage carries the damage amount.

  Preserves r4, r6.

  '
