name: MapScriptCutsceneCmd_jump
address: '0x08035924'
kind: function
status: confirmed
summary: 'Map-script command handler for "jump": consumes a jump-target word from the script and transfers script
  execution there, always reporting success.'
interface: "void MapScriptCutsceneCmd_jump(u32 scriptReader in r4 /* implicitly via ReadMapScriptWord */,\n    \
  \                           u32 cmdId out r6 = 1,\n                               u32 newScriptPtr out r7 (copy\
  \ of updated r4),\n                               u32 result out r0 = 1,\n                               flags:\
  \ \"nz/c/v set per \\\"adds r7, r4, #0\\\" then nz from \\\"mov r0, #1\\\";\"\n                              \
  \ lr used as return address)\n"
details: 'Handler for map-script cutscene command id 1 (the "jump" command). It sets r6 = 1 as the command id and
  calls ReadMapScriptWord, which reads the next word from the script stream (the script state/pointer being carried
  in r4) and performs the actual jump by updating that pointer to the target word. Afterwards r7 is refreshed from
  r4 (r7 = r4 via "adds r7, r4, #0") so both registers point at the new script position, and the routine returns
  to the dispatcher by popping pc from lr. It always returns r0 = 1 (command handled / success); there is no failure
  path. Flag behavior is a quirk of Thumb encoding: "mov r7, r4" assembles as "adds r7, r4, #0" (sets c/v, both
  always 0 since adding 0 cannot carry or overflow), and the final "mov r0, #1" only updates n/z.

  '
