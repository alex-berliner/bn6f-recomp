name: sub_80C5590
address: '0x080C5590'
kind: function
status: confirmed
summary: Spawn a sibling battle object inheriting this object's params/counter/extra-vars/element, then wire the
  new object's RelatedObject1Ptr to this one's.
interface: BattleObject* battleObject_spawnSibling_80C5590(u32 r0, u32 r1, u32 r5_saved /*BattleObject* this*/);
  returns new BattleObject* in r0; r0/r1 preserved across the call; clobbers r2-r4,r6,r7,lr; flags NZCV clobbered.
details: 'Pushes caller-supplied r0/r1 and lr onto the stack. Loads this (r5) object''s

  Params (oBattleObject_Params -> r4), DamageAndStaminaDamageCounterDisabler

  word (r6), ExtraVars (r7) and Element byte (r2), with r3=0 selecting the

  "create new" variant, and tail-calls sub_80C5578 (a battle object

  factory/constructor) which returns the new object pointer in r0. After the

  call it copies this->RelatedObject1Ptr (the related-object pointer, e.g.

  parent/navi link used widely in BN battle objects) into the new object at

  the same offset, effectively parenting the new object to this one''s

  existing counterpart. Returns via `pop {r0,r1,pc}`, restoring the caller''s

  original r0/r1 in addition to PC. The two .word entries (byte_80C54DC,

  byte_80C54D0) immediately following are the address pool for sub_80C5578,

  not consumed by this function itself.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
