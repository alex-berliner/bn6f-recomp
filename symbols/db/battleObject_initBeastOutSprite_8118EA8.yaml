status: probable
summary: 'Initialises a battle object''s sprite for a BeastOut-state visual: GUI sprite init, animation,
  palette, priority, and a per-actor coordinate table lookup.'
interface: '(r5 = battle object, r6 = secondary context) -> void ; side effects: writes object/sprite
  fields, sets up OAM, no return value to caller'
details: "Sets object header byte 0 to 0x23 (bits 1+2+4+0x20 = active|visible|pause_update|unk_20).\n\
  \  Calls `initGuiSprite_8002770(r0=0x17, r1=unk_20226F0)` to bring up a GUI sprite with a 0x17\n  parameter.\n\
  \  Reads byte 0xF from the secondary context (`[r6,#0xf]`) as the actor index; uses it both as\n  the\
  \ animation index (`sprite_setAnimation`) and to select a (x,y) pair from a hard-coded\n  3-entry table\
  \ at `byte_8118F0C`:\n    index 0 -> (0x4F, 0x60),  index 1 -> (0x47, 0x60),  index 2 -> (0x47, 0x58).\n\
  \  Then `sprite_setCoordinates(r0=x, r1=y)`, also writing 0x4 into `[r5,#8]` (CurState value,\n  likely\
  \ CUR_STATE_UPDATE).\n  Sprite-load-animation-load, no-shadow follow, priority=0, storeHalfword 0x220\
  \ via the slot\n  selector, sub-record field +0xA = 4, sub-entry palette bank = 4, palette = 0, and\n\
  \  `sprite_setObjWindowMode` complete the OAM configuration.\n  Finally tail-calls `sub_8118F14` with\
  \ no arguments and `pop {pc}` to return.\n  Caller is `0x08118e92` (one observed), suggesting this is\
  \ invoked from a beastOut/object\n  init list. r5 holds the battle object being configured; r6 looks\
  \ like a secondary object\n  or per-actor context whose byte 0xF picks the sprite variant.\n"
