name: sub_80058D0
address: '0x080058D0'
kind: function
status: confirmed
summary: Overworld tick that arms a warp when the player stands on a map warp trigger whose "warp seen" event flag
  is still clear, dispatching to the cutscene matching the warp's type.
interface: 'void sub_80058D0(struct Toolkit *toolkit /* r10 */);

  // returns in r5 (preserved), with r1..r12 set up for the dispatched cutscene

  // handler (r1 = JumpTable8005948, r2 = this warp''s data entry, r4 = entry

  // offset, r5 = GameState*); r0 untouched on return; clobbers r0,r1,r2,r3,

  // r4,r6,r7,lr and the N/Z/C/V flags; preserves r5.

  '
details: "Runs from the overworld dispatcher while oGameState_SubsystemIndex == 4\n(the on-map-update gamestate).\
  \ Bails out early if any of the following\nhold: !sub_809E462 (other update substate not ready),\n!warp_LoadCurrentAndReadUnk10_8005F28\
  \ (warp state not free to arm),\nTestPETMenuDataFlag(1) (PET menu data flag set), IsScreenFadeActive,\nor IsCutsceneScriptNonNull.\n\
  Reads the player's coords from the OverworldPlayerObjectPtr +\noOWPlayerObject_Coords and calls checkCoordinateTrigger_8031a7a\
  \ to get\na 1..15 warp trigger index (stored in r4 == r1). 0 and >0xF mean \"no\ntrigger\"; r4 < 1 also bails.\n\
  Indexes EVENT_16F0 + warp_index (a \"warp seen\" event flag) via\nTestEventFlag; only fires when the flag is still\
  \ clear.\nOn a hit, writes into the block at oToolkit_Warp2011bb0_Ptr ->\n{ oWarp2011bb0_Unk_10 = 1, oWarp2011bb0_WarpIndex\
  \ = warp_index,\noWarp2011bb0_MapGroupTransitionType = 0 }, looks up\noWarpData_Size * (warp_index - 1) into the\
  \ block's\noWarp2011bb0_WarpDataPtr, reads oWarpData_warpType_02, and dispatches\nvia JumpTable8005948 with the\
  \ warp's data entry pointer in r2 and the\nGameState self pointer in r5. The jump table entries (the comment block\n\
  already names them) are:\n  0 gameState_beginEndingSequence_800596C  (fade to black)\n  1 sub_8005990        \
  \                    (fade to white)\n  2 map_onMapWarpCutscene_80059B4          (jack out, cross-map fade, jack\
  \ in, walk)\n  3 startInMapWarpCutscene_80059D0         (jack out, auto scroll, jack in, walk)\n  4 sub_80059EC\
  \                            (jack out)\n  5 sub_8005A00                            (levbus)\n  6 sub_8005A0C\
  \                            (underground)\n  7 sub_8005A28                            (fade to black + hardcoded\
  \ SFX, delay A)\n  8 sub_8005A50                            (fade to black + hardcoded SFX, delay B)\nAll jump\
  \ targets are called Thumb-style via `mov lr,pc; bx r0` with the\njump table base held in r1 and the per-type\
  \ data entry pointer in r2.\nr4 (the entry's byte offset within the warp-data array) is set up as\ndescribed but\
  \ not consumed by this function; the comment on the\nLift-C contract notes it must stay live through callees in\
  \ case any of\nthem read it.\n"
