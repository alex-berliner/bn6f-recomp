name: object_chipNameOverlayDispatch
address: '0x080E81F8'
kind: function
status: probable
summary: 'Tail-dispatch function that reads oBattleObject_CurAction and branches via off_80E820C to one
  of four handlers: object_dimScreen, object_drawChipName, an unknown handler, and object_undimScreen,
  bracketing a chip-name overlay between screen-dim and undim.'
interface: (r5 = battle object) -> tail-dispatch to handler; no direct return value
details: 'Reads oBattleObject_CurAction (byte at r5) and indexes off_80E820C, a 4-entry Thumb pointer
  table, then branches to the selected handler: object_dimScreen, object_drawChipName, sub_80E821C (unknown),
  or object_undimScreen. The dim/undim bracket plus drawChipName strongly suggests a chip-name popup shown
  over a dimmed battle screen. r0 passed through to handlers is the raw action byte. No other fields are
  touched; the function is purely a state dispatch.'
