open_questions:
- no callers are known, so whether this is a generic per-object step invoked from the main object loop
  or a specific handler variant is unconfirmed
- the meaning of oBattleObject_ExtraVars being zeroed on destruction, and what sub_80DC310 (the sole table
  entry) does, are not shown
