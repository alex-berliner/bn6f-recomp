- 'The `mov r0, #1 / cmp r0, #0 / beq loc_802A2A2` sequence looks like dead/optimised-out code — it always
  takes the branch (1 ≠ 0), but the desired path then executes `mov r4, r6 / mov r0, r4`. The intent is
  unclear; possibly an un-removed conditional store.'
- Naming "computePuppeteerSwitchElement" is plausible because the L+R swap, the chip-style override (sub_8120B54),
  and the BattleState slot read all cohere with the Style Change / Puppeteer systems, but I have no string
  in the ROM that confirms the "Puppeteer" wording — keep the `_ADDRESS` suffix per the rules.
