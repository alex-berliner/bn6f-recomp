name: battleObject_computePuppeteerSwitchElement_802A220
address: '0x0802A220'
kind: function
previous_names:
- sub_802A220
status: probable
summary: Decides whether the puppeteer (L+R swap mechanic) should swap to a new element for the player's
  MegaMan this frame, returning that element code or 0xFF if no swap.
interface: (r2 -> used as save 0xb selection; r5 = ?, r10 = toolkit) -> r0 = element code (0..0xB) if
  a swap is due, else 0xFF
details: "Initializes r4 = 0xFF (the \"no change\" sentinel).\n  Tests event flag EVENT_163; if set, returns\
  \ 0xFF (line 0x802A22A: movflag EVENT_163 / bl TestEventFlagFromImmediate / bne loc_802A2A2).\n  Reads\
  \ GetBattleEffects() and masks with 0x200000; if that bit is set, returns 0xFF (line `tst r0, r1` with\
  \ r1 = dword_802A2A8).\n  Calls GetBattleMode(); only modes 0, 0xA, and 0xB fall through (line `cmp\
  \ r0, #0/0xa/0xb` + `beq loc_802A248`); otherwise returns 0xFF.\n  Pulls BattleStatePtr via [r10, #oToolkit_BattleStatePtr]\
  \ and reads BattleState+0xD (the live battle slot/turn byte, possibly the player slot counter), then\
  \ calls GetBattleNaviStatsByte(slot, 0x29) (line `mov r1, #0x29`). The retrieved Mood (NaviStats+0xE\
  \ according to struct) byte is range-checked 1..0xB; if outside that window, returns 0xFF (line `cmp\
  \ r0, #1 / blt loc_802A25C / cmp r0, #0xb / ble loc_802A2A2`).\n  Loads r7 = dword_20349A0 (a per-battle\
  \ puppeteer/swap state block) and reads byte at offset 0x5 (battleType-like field); if 0xFF, returns\
  \ 0xFF.\n  Calls sub_8120B54 (chip-ID -> element override code 6..10); if that returns 0xFF, returns\
  \ 0xFF. Saves the result in r6.\n  Compares r6 against r5+0x3a (AIData Unk_3a, the AI/owner \"current\
  \ element\" field) — if equal, returns 0xFF (line `ldrh r1, [r5, #0x3a] / cmp r0, r1 / beq loc_802A2A2`).\n\
  \  Reads a u16 bitmask at r7+0xE (the \"element availability\" flags); if bit r6 is already set, returns\
  \ 0xFF (line `ldrh r1, [r7, #0xe] / mov r2, #1 / lsl r2, r0 / tst r1, r2 / bne loc_802A2A2`).\n  Reads\
  \ GetBattleEffects() again; if bit 0x8 (L-trigger effect) is set, also re-checks byte_20349A5: only\
  \ allow swap when it's <2; otherwise no swap (lines `tst r0, r1 / bne loc_802A292`).\n  In both surviving\
  \ branches the function hard-codes `mov r0, #1 / cmp r0, #0 / beq loc_802A2A2` (which always takes the\
  \ branch since r0=1≠0) — this looks like redundant/dead-byte artifact, but the real effect is to fall\
  \ through to the `mov r4, r6 / mov r0, r4` return path, so r0 returns the candidate element code.\n\
  \  Called from chatbox_stateMaybeFinishText_8026E4C and custMenuUpdateWaitSelectionState_8026CCC plus\
  \ their sibling sub_8026D06 / sub_8026F1A, all of which are custom-screen / escape-attempt helpers —\
  \ consistent with this being a per-frame \"should we change the player's chip element right now\" hook.\n"
