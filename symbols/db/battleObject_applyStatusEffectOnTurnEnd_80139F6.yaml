open_questions:
- Exact meaning of each switch value (which ailment vs which counter is incremented). The 0x18/0x19 pair,
  the 0xFF (0x14) reparam branch, and 0xF8 "Anger" branch can be confirmed with data tables; the others
  (0x54, 0xF5/F9/FA/FE) would need either navi-stats field labels or runtime traces.
- Whether `sub_801393A` / `sub_801469C` are generic "decrement bug timers" or ailment-specific follow-ups.
