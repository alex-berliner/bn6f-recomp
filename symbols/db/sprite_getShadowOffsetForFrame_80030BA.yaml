name: sprite_getShadowOffsetForFrame_80030BA
address: '0x080030BA'
kind: function
status: confirmed
summary: Return the (X, Y) shadow-grounding offset for a given animation frame index of a sprite object, or (0,
  0) past the table's 0xFF sentinel.
interface: sprite_getShadowOffsetForFrame_80030BA(r0 = sprite object ptr, r1 = target frame index) -> r0 = shadow
  X (s8 sign-extended), r1 = shadow Y (s8 sign-extended); clobbers r2 r3 NZCV; preserves r4-r7 via push/pop.
details: "Computes the sprite-data base by masking the object header's TypeAndSpriteOffset byte with 0xF0 and adding\
  \ it to the object pointer. From the sprite-data record it follows oObjectSprite_AnimFrameDataPtr to get the current\
  \ animation-frame byte, multiplies by 4 to form a word-array offset, then combines oObjectSprite_AnimationResourcePtr\
  \ with the +0xC subframe offset (read through oObjectSprite_AnimationSubFramePtr) to resolve a relative pointer\
  \ into the animation-resource blob. That blob is a list of 5-byte shadow-offset records:\n  byte 0 = flag (0xFF\
  \ = end-of-list sentinel),\n  byte 1 = signed X offset,\n  byte 2 = signed Y offset,\n  bytes 3-4 = unused.\n\
  The list is walked in 5-byte steps; when the step counter equals r1 the two signed bytes are loadedsb into r0/r1\
  \ and returned. Hitting the sentinel first returns (0, 0). r5 holds the object ptr internally and r6 is never\
  \ written; both are restored by the prologue/epilogue."
