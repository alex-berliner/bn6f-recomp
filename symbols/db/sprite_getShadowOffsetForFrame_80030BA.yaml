- Exact semantics of the [r3,r2]/[Unk_18 + Unk_1c+0xc] indirection and of bytes
- +3..+4 of each record. Settling it needs to see what populates
- '`Unk_18/Unk_1c/Unk_20` for a known sprite, and what sub_80B8932 does with the'
- returned dx/dy.
