status: probable
summary: Given a camera struct (or two) and source/dest fields, returns a (deltaX, deltaY) pair to apply
  when scrolling between battlefield positions; returns 0,0 when the source/dest are aligned.
interface: '(r0 = cameraStructPtr, r1 = ?, r2 = destField1, r3 = destField2, r4 = srcField1, r5 = srcField2,
  r6 = out_ptr_or_field?, r12 = ?) -> r0 = deltaX, r1 = deltaY ; side effects: writes r8/r9 (return regs
  preserved through callees)'
details: "Captured entry shows r0 = 0x0200f3e0 (EWRAM, camera-ish or scroll struct), r1 a u16/cell-ish\n\
  \  value (e.g. 0x796b / 0x8f3f / 0x903d — looks like 16-bit panel coords), r2 = r3 = 0x20\n  (probably\
  \ a \"cell size\" or doubled width). r4/r5 hold two source-axis values, r6 a third\n  value used as\
  \ a kind of \"count\" or guard (checked against 1).\n\n  Math: r6 = r8_save; delta = (r5-r4); otherDelta\
  \ = (r2-r3); computes two scalar products\n  (r3*r4 - r2*r5) and a dot product (r3*[r0] + r4*[r0+4])\
  \ to test which side of a 2-D\n  edge the source point lies on. If the sign disagrees with [r0+0xc..0x10]\
  \ (a second point\n  on the same edge), the function falls into a refinement branch that calls sub_8031048\n\
  \  twice with the negated sign products to iteratively correct r8/r9, which the callers\n  (sub_8031478\
  \ \"two-axis scroll\" and camera_initAndActivate_803123E) then feed to\n  camera_moveByDelta_80310B0.\n\
  \n  When the sign test matches, exits with r0=r1=0 (already-aligned case). Otherwise returns\n  the\
  \ corrected (r9, r8) pair as the scroll delta.\n"
