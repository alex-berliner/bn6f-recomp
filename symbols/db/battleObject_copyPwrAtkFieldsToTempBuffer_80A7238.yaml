status: probable
summary: Copies a BattleObject's power-attack / beast-out fields (BPwrAtk, BButton, Anger, AIData ptrs)
  into a scratch EWRAM table indexed by the object's slot id.
interface: (r5 = BattleObjectPtr) -> side effects only; no return value
details: "Treats r5 as a BattleObject. Reads BPowerAtk slot id from [r5+4] and BButton from [r5+6];\n\
  \  also reads the PowerAttack APwrAtk byte from [r5+5] and stores it at byte_2000EC0+0x16.\n  Uses base\
  \ byte_2000EC0 (loaded once into r7) and writes several entries in that scratch\n  buffer:\n\n  - byte_2000ED6\
  \ = APwrAtk ([r5+5]) (offset 0x16 in the buffer)\n  - byte_2000ED0 + (slot_id+0x17) = BButton ([r5+6])\n\
  \  - byte_2000ED0 + (slot_id+0x26) = low byte of Anger ([r5+0x34])\n  - word at byte_2000ED0 + 0x2C\
  \ + (slot_id*4) = [r5+0xC] (AIData pointer slot)\n  - word at byte_2000ED0 + 0x44 + (slot_id*4) = [r5+0x10]\n\
  \n  Indexing by slot id with a stride of 4 for the pointer fields implies the buffer is an\n  array\
  \ of per-slot records at base 0x2000EC0 with offsets 0x17/0x26/0x2C/0x44 keyed off\n  the object's 4-bit\
  \ slot id. The function is a leaf (only branches/calls are off_80A7268),\n  and preserves r4-r7. Only\
  \ one caller (sub_80A6F2C) is recorded, suggesting it's part of a\n  battle init / pre-step that loads\
  \ per-battle-object power-attack state into the side\n  scratch table used by sub_80A6F2C's loop.\n"
