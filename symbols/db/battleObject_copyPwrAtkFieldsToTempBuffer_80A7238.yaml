- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r3, [r5,#4]` and subsequent `lsl r3, r3, #2` index off the slot id (BattleObject.Params
    byte 1), used as both a scalar and a stride-4 base. - `ldrb r0, [r5,#5]` -> `strb [r7,#0x16]` writes
    APwrAtk (BattleObject.Params byte 2 / AIData.APwrAtk+0x01) into the scratch table at fixed offset
    0x16. - `ldrb r2, [r5,#6]` -> `strb r2, [r7,r0]` with r0 = 0x17 + slot writes BButton (BattleObject.Params
    byte 3) at slot-indexed entry. - `ldr r2, [r5,#0x34]` -> `strb r2, [r7,r0]` with r0 = 0x26 + slot
    writes low byte of BattleObject.Anger at slot-indexed entry. - `ldr r2, [r5,#0xc]` and `ldr r2, [r5,#0x10]`
    are stored as words at 0x2C + slot*4 and 0x44 + slot*4; these match the pointer fields 0x0C (AIDataPtr)
    and 0x10 (something else) inside the BattleObject header region. - No direct BL calls; only `pop {r4-r7,pc}`
    after `off_80A7268` lookup -> leaf, scratch-table write. - Trailing `.byte` constants (byte_80A726C..)
    live inside the function''s footprint but are unreferenced by the body''s instructions, suggesting
    they are coincidentally adjacent data (likely part of an earlier static table in the same translation
    unit).'
