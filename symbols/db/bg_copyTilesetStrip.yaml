  does, and CopyBackgroundTiles uses the built stack array. The ''bg_blit'' prefix is fine but ''TileRowPair''
  is misleading since it actually fills a 2-tile-tall strip whose height in BG-map writes is 2 rows (i_size=2)
  regardless of w.'
