name: CutsceneCmd_wait_chatbox
address: '0x08037790'
kind: function
status: confirmed
summary: Cutscene script command that blocks the script until the chatbox reaches the state selected by the command's
  flag operand.
interface: 'Next CutsceneCmd_wait_chatbox(void /* r1, r7 = script state ptr, lr */); returns r0: 0 = still waiting,
  1 = done; on completion advances r7 by 2 and sets NZ/C/V from that ADDS r7,#2'
details: "Cutscene script opcode handler for \"wait for the chatbox\". Sets r6 = 1 and calls\nReadMapScriptByte\
  \ to fetch a one-byte operand into r4 (a bitmask selecting which\nchatbox conditions to wait for). It then queries\
  \ the chatbox state flags\n(eFlags2009F38) twice via chatbox_mask_eFlags2009F38, which ANDs the given mask\nagainst\
  \ those flags:\n  - (operand & 0x80) & eFlags2009F38 must be nonzero (the 0x80 condition must be\n    currently\
  \ true), AND\n  - (operand & 0x38) & eFlags2009F38 must be zero (none of the 0x38 conditions\n    may be set yet)\n\
  While either check fails the handler returns r0 = 0 without consuming the command\nbyte, so the same wait command\
  \ is re-executed on each subsequent cutscene update.\nOnce both conditions hold, it advances the script pointer\
  \ (ADDS r7, #2, consuming\nthe command and its operand byte) and returns r0 = 1. Note the wait succeeds when\n\
  the 0x80 test fails immediately on the first check — the 0x38 test is only reached\nif the 0x80 test passes, so\
  \ '0x80 clear' also unblocks the wait.\nCallers observe the ADDS r7,#2 carry/overflow flags (used for bounds/error\
  \ checks\nin the script interpreter).\n"
