open_questions:
- What gameplay property does ChipData byte 9 bit 0x20 encode (tag chip, hidden chip, class marker, etc.)?
- Which menu states 0x18 and 4 correspond to (custom screen vs. folder/tag editor), and what r5 structure is this
  exactly?
- Why is r5+7's slot only honored when the slot's first byte is 0 — is 0 'empty/pending' or something else?
- Whether any caller depends on the outgoing r1 value despite it looking incidental.
