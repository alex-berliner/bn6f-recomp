name: chipSelect_selectedSlotChipHasAttr20_802A394
address: '0x0802A394'
kind: function
status: confirmed
summary: On the chip-select screen, checks whether the chip pending in the currently selected regular/custom slot
  has ChipData attribute bit 0x20 set, returning 1 if so.
interface: bool sub_802A394(ChipSelectState* state /* r5 */); also reads (but per contract ignores/passes through)
  r2,r3,r4,r6,r7,r10,lr; returns r0 = 0/1, r1 = incidental value (slot byte, 0x20, or stale input value), preserves
  r3-r7; clobbers NZCV.
details: Reads the menu-mode byte at r5+1; if it is neither 0x18 nor 4 the function just returns 0 immediately (leaving
  r1 as whatever the caller passed in). In those modes it reads the selected slot index from r5+7 and calls getLocOfActiveChips_8027E1C
  to get that active-chip slot entry. If the entry's first byte is nonzero the slot is treated as settled and the
  result is 0; if it is 0 the entry is considered empty/pending and the function follows the pointer at entry+8,
  loads the halfword there, extracts the chip id as the low 9 bits (lsl 23 / lsr 23), calls getChip8021DA8 to fetch
  the ChipData record, and tests bit 0x20 of the attribute byte at offset 9. r4 accumulates the 0/1 result and is
  copied to r0 on return; r1 ends as the slot byte on the busy path, 0x20 on the flag-test path, or the incoming
  r1 on the mode-check-fail path — callers evidently must not rely on r1. The meaning of ChipData byte 9 bit 0x20
  is not independently confirmed (candidate readings include a tag/hidden/special-class marker); only that the game
  gates chip-select behavior on it is certain.
