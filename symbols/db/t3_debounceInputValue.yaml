name: t3_debounceInputValue
address: '0x0803E7D8'
kind: function
status: probable
summary: 'Debounce state machine: only commits a value into a two-slot history after it has been passed
  unchanged for 8 consecutive calls (frames).'
interface: (r0 = value/key bit to track, r7 = state struct base) -> r0 clobbered; updates r7+0x10/0x12/0x14/0x16/0x18
details: 'If r0 differs from the last raw value at r7+0x14, it stores r0 there and resets the frame counter
  at r7+0x18 to 0. Each call increments the counter until it reaches 8; until then nothing else happens.
  Once the value has been stable for 8 calls, it is committed: if r7+0x12 is zero, r0 is written to r7+0x16,
  r7+0x10 and r7+0x12; otherwise r7+0x12 takes the old r7+0x10, r7+0x10 takes r0, and r7+0x16 is cleared.
  So 0x10/0x12 act as a current/previous pair of accepted values, 0x14 is the raw last-seen value, 0x18
  the stability counter, and 0x16 a one-shot flag set only on the first commit. This is a classic hold-8-frames
  debounce/accept filter for a periodically polled input value.'
