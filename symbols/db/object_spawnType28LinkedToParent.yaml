name: object_spawnType28LinkedToParent
address: '0x080C02A6'
kind: function
status: probable
summary: Spawns battle object type 0x28 and attaches it to the current object, copying the parent's alliance/direction-flip
  word.
interface: (r5 = parent BattleObject, caller-held) -> r0 = new BattleObject pointer or 0 on spawn failure;
  Z flag set by object_spawnType1
details: Saves the caller's r5 (the parent object, kept in r5 by the caller) and requests object_spawnType1
  with obj_idx 0x28; the callee's returned pointer comes back in r5, which is moved to r0. If the spawn
  failed (r0==0, flag from the callee) it just returns null. On success it stores the parent's pointer
  into the new object's oBattleObject_RelatedObject1Ptr field and copies the parent's oBattleObject_AllianceAndDirectionFlip
  halfword (team/alliance plus flip bit) into the child, so the spawned type-0x28 object shares the parent's
  side and facing.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0,#0x28 + bl object_spawnType1: spawns fixed object index 0x28; mov r0,r5 / pop {r5}:
    callee returns pointer in r5, parent pointer preserved across the call; beq locret_80C02BC right after
    pop: null-return path on failed spawn; str r5,[r0,#oBattleObject_RelatedObject1Ptr]: links parent
    into the new object; ldrh/strh of oBattleObject_AllianceAndDirectionFlip: copies alliance and flip
    from parent to child'
