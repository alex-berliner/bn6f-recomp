name: battle_spawnObject200AtPanel
address: '0x080DE2F0'
kind: function
status: probable
summary: Pushes r0-r3,r5 and sets r0=0xC8 (object 200), then calls object_spawnType3; on success writes
  PanelX/PanelY as bytes, stores r4 as a byte at obj+0x60, and copies the AllianceAndDirectionFlip halfword
  from the r5 source object to the new one.
interface: '(r0-r3 = spawn args for object_spawnType3, r5 = 5th arg: pointer to source battle object;
  panelX=r1, panelY=r2, byte r4 -> obj+0x60) -> r0 = new battle object pointer or 0 on failure'
details: 'Wrapper around object_spawnType3: it pushes {r0-r3,r5} so the spawner can pop the five arguments,
  sets r0 = 0xC8 (the object ID to spawn, 200), and calls it. If the spawn returns non-null, it writes
  arg1 to oBattleObject_PanelX and arg2 to oBattleObject_PanelY as bytes, stores arg3 (r4) as a byte at
  object offset 0x60 via an offset loaded into r1, and copies the oBattleObject_AllianceAndDirectionFlip
  halfword from the object pointer passed in r5 to the new object. On a null return it returns immediately
  without touching the new object. The five-argument-through-stack handshake and the r5 pointer arg match
  the project''s description of object_spawnType3.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'push {r0-r3,r5}; mov r0, #0xC8; bl object_spawnType3 — spawns object ID 200 with five caller-supplied
    args; strb r1,[r0,#oBattleObject_PanelX] / strb r2,[r0,#oBattleObject_PanelY] — args 1-2 are the spawn
    panel coordinates; mov r1,#0x60; strb r4,[r0,r1] — third arg stored as a byte at object+0x60; ldrh
    r3,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh r3,[r0,#same] — alliance/flip word copied from
    the r5 source object; beq locret_80DE30C right after the spawn call — fields are only initialized
    when spawning succeeded'
  refs:
  - bn6f/asm/asm31.s:83393
  - 0x080DE7C8 sub_80DE7C8
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080DE2F0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary has several errors: r0-r3 are not ''spawn args''—r1/r2 become PanelX/PanelY stored at
    the new object, and r4 is written to obj+0x60. The proposal says r5 is the source pointer used for
    copying the alliance/direction halfword, which matches the ldrh r3,[r5,...]/strh r3,[r0,...] at the
    end. It also claims ''byte r4 -> obj+0x60'' but the code is strb r4,[r0,r1] with r1=0x60, so r4 is
    indeed stored as a byte at +0x60. However the claim that r0-r3 are spawn args for object_spawnType3
    is wrong: only r0=0xC8 is set before the call; r1-r4 and r5 are pre-loaded from the pushed registers.
    The name itself is reasonable but ''battle_spawnObject200AtPanel'' better reflects the function than
    the summary text.; run wf investigate investigate-20261019-015108; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
