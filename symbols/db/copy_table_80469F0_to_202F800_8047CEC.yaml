name: copy_table_80469F0_to_202F800_8047CEC
address: '0x08047CEC'
kind: function
status: confirmed
summary: Copies a fixed 0x168-word data table from ROM (byte_80469F0) into a fixed EWRAM work buffer (byte_202F800).
interface: 'void sub_8047CEC(void) /* in: none (lr only); out: none; preserves r3; clobbers r0-r2, lr,
  NZC */'
details: 'Takes no inputs and produces no outputs; it just performs CopyWords(src=byte_80469F0, dest=byte_202F800,
  size=0x168), i.e. a word-wise copy of 0x168 words (0x5A0 bytes) from a constant ROM table into the large
  EWRAM buffer at 0x202F800, then returns. Since the source is a ROM constant and the destination is a
  fixed address, this effectively (re)initializes a working table in RAM each call. No game-meaning for
  the table contents could be determined from this function alone; r3 is passed in and preserved but never
  used, suggesting callers keep a value live across the call.

  '
