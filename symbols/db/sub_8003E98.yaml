summary: Calls sub_80028C0 with mode 1 to reset/teardown battle objects at scene exit.
interface: void battle_resetObjects_8003E98(void); /* clobbers r0-r2, lr */
details: 'Thin trampoline that forwards r0=1 to sub_80028C0, which appears to be a battle-object

  reset/destroy dispatcher (mode 1 = teardown). It writes nothing back and the only path is

  the pop {pc}, so the unreachable 0x20-slot eT1BattleObject0 walk that zeros

  oT1BattleObject_SpriteData[0x24] is dead code (or a residual from a prior version). The

  nearby T3BattleObjectJumptable (battle-object type-3 handler table at 0x8003EA8) is also

  dead and not invoked here despite living in this function''s range.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
