name: e_decelRiseUpdate
address: '0x080A9E5E'
kind: function
status: confirmed
summary: 'Per-frame update for a decelerating-rise cutscene sprite: applies Z velocity and deceleration, and on
  timer expiry triggers the landing sequence (swap animation, remove shadow, teleport to backup coords, play landing
  SFX, set landed state).'
interface: void sprite_decelRiseUpdate_080a9e5e(u32 r5 /* objPtr */, u32 r10 /* state */); preserves r4-r7, r10;
  clobbers r0-r3, r5, flags, lr
details: 'Called each frame as part of a cutscene/animation state machine (the "e_" prefix denotes an entry-state
  handler). The object at r5 uses a known layout: PosX 0x0c, PosY 0x10, PosZ 0x14, SndFlag 0x04, FlipDir 0x05, State
  0x09, Timer 0x24 (u16), VelZ 0x28, Decel 0x2c, BackupX/Y/Z 0x30/0x34/0x38.

  Each call: PosZ += VelZ; VelZ -= Decel; Timer++ (u16 store, s32 compare). If Timer <= 30 (0x1e) the function returns
  immediately (decelerating upward).

  On expiry (Timer reaches 31): resets Timer to 0, then runs the landing sequence— sprite_setFlip(FlipDir), sprite_setAnimation(5),
  sprite_loadAnimationData(), sprite_noShadow(), cutscene_clearEntryEventFlags_809C940(), copies BackupX/Y/Z into
  PosX/Y/Z, conditionally plays sound effect 0x20d (0xAE+0xFF) when SndFlag (offset 0x04) is zero, and sets State
  (offset 0x09) to 0x10 (landed).

  r5 is preserved across the landing sub-calls (the wrappers reload it from the stack frame). r10 (state variable)
  is preserved but not modified here.

  '
