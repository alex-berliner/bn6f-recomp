open_questions:
- No caller is known, so what spawns this object and sets up fields 0x28/0x2c/0x30-0x38 is unknown
- Which coordinate 0x14 is (x/y/z) and the exact meaning of state byte 0x10 await the struct layout and
  sub_809C940's role
- Whether SFX 0x1AD is a beast-transformation roar could confirm the beastsp connection
