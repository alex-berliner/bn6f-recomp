name: e_decelRiseUpdate
address: '0x080A9E5E'
kind: function
status: probable
summary: Per-frame update that moves an object (likely the Beast-Out/BeastSP sprite) with a decelerating
  motion for 30 frames, then resets its animation, restores its saved position, plays SFX 0x1AD and sets
  a state byte.
interface: (r5 = object/entity struct, no arg registers) -> r0 = void; sets state byte [r5+9] = 0x10 when
  the 30-frame motion completes
details: Each call adds the velocity at [r5+0x28] to the position field [r5+0x14] and subtracts an acceleration
  at [r5+0x2c] from the velocity, i.e. a decelerating (or easing-out) motion, probably along the screen-z/height
  axis since 0x0c/0x10/0x14 look like an x/y/z triple. A frame counter at [r5+0x24] is incremented each
  call; while it is <= 0x1e the function returns, so the motion lasts 30 frames. On the final frame it
  resets the counter, calls sprite_setFlip from byte [r5+5], sprite_setAnimation(5), sprite_loadAnimationData
  and sprite_noShadow, calls sub_809C940, then copies the saved triple at [r5+0x30/0x34/0x38] back into
  [r5+0x0c/0x10/0x14], restoring the original coordinates. Unless byte [r5+4] is nonzero (a mute/variant
  flag), it plays sound effect 0x1AD via PlaySoundEffect. Finally it writes 0x10 into byte [r5+9], seemingly
  advancing the object's state machine, which would be set up by whatever spawned this sequence.
