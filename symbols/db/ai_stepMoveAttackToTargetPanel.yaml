name: ai_stepMoveAttackToTargetPanel
address: '0x080F1694'
kind: function
status: probable
summary: 'AI attack step: after a countdown finishes, teleports the attack object to the stored target
  panel and arms its hit element.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 0; updates object panel/coords/collision,
  sets HitElement = 0x10
details: 'Each call decrements oAIAttackVars_StepTimer (r7); while still positive it just returns. When
  the timer expires, the target panel coordinates held in oAIAttackVars_TargetPanelX/Y are written into
  the battle object''s PanelX/PanelY, then object_setCoordinatesFromPanels recomputes the object''s pixel
  position and object_updateCollisionPanels syncs its collision record and facing for the new panel. Finally
  it stores 0x10 into oAIAttackVars_HitElement, activating the attack''s hit element/flag so it can damage
  things now that it has arrived at the target tile. This is a two-phase delayed attack: wait on the target
  panel, then relocate and become hazardous.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub r0,#1 / bgt locret: only acts when StepTimer reaches 0, otherwise nothing happens; strb
    r0,[r5,#oBattleObject_PanelX]/strb r1,..._PanelY copies TargetPanelX/Y into the object before the
    two callee calls; bl object_setCoordinatesFromPanels and bl object_updateCollisionPanels resolve the
    new panel into pixel coords and collision/facing; mov r0,#0x10; strh r0,[r7,#oAIAttackVars_HitElement]
    arms the hit element only after the move completes; Route capture shows it runs in the beastsp (Cybeast
    Falzar boss) sequence'
  refs:
  - bn6f/asm/asm31.s:123298
  - 0x0800E29C object_setCoordinatesFromPanels
  - 0x0801A04C object_updateCollisionPanels
  reproduce: python3 tools/asmcat.py 0x080F1694
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-182231'
