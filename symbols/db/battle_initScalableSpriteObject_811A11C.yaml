name: battle_initScalableSpriteObject_811A11C
address: '0x0811A11C'
kind: function
status: confirmed
summary: Sets up a battle object's sprite (id 0x90) as a scalable sprite with a 0x90→0x40 vertical scale setup and
  marks the object state as 8.
interface: void battle_initScalableSpriteObject_ADDRESS(/* r5 */ BattleObject* obj)
details: 'Takes a battle object pointer in r5 (preserved through the call). Stores sprite

  id 0x90 into the object''s byte at +0x12, calls sprite_makeScalable to give the

  object''s sprite scaling support, then calls sprite_setScaleParameters with

  (0, 0x90, 0x40) — apparently source height 0x90 and destination height 0x40,

  i.e. a shrink-to-half-ish vertical scaling setup, likely for a boss/enemy

  entrance or transformation effect. Finally writes state value 8 to the object''s

  state byte at +9, which appears to select a "scalable sprite" update mode for

  the object''s per-frame handler. Flags are left reflecting r0=8 (NZ set from the

  last mov), though callers likely ignore them.

  '
