name: object_initType41State
address: '0x0810D150'
kind: function
status: probable
summary: Initializes a battle object by spawning its linked type-0x41 helper and entering AI script state
  4.
interface: (r4 = object data with version field, r5 = owning battle object, r6 = AI state) -> r0 = 0;
  flags preserved
details: Reads bit 0 of the object's version byte and passes it, together with r5 as owner, to object_spawnLinkedType41Helper.
  Stores the spawned helper pointer in the owning object's ExtraVars field. Sets ScriptId to 4 and SubState
  to 0 before returning 0.
