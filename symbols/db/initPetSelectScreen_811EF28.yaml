name: initPetSelectScreen_811EF28
address: '0x0811EF28'
kind: function
status: confirmed
summary: Initializes the PET/Navi-select screen background by clearing a flag, loading GFX anim scripts,
  and copying background tiles for both the PET and Navi-select screens.
interface: void sub_811EF28(void *state /* r5 */)
details: 'Takes a pointer to a screen state struct in r5. Writes 0 to its 16-bit field at

  offset 0x10, then writes 4 to its byte at offset 0x00 (sets a phase/state value

  of 4). Calls a sequence of setup helpers: sub_8046664 (no args), sub_80465A0

  with palette/data blob A_byte_811EBA4, two LoadGFXAnim calls using scripts at

  A_byte_811EAD4 and A_byte_811EAEC, several in-file setup routines (sub_811F1B8,

  sub_811F214, sub_811F0C8, sub_811F11C), and two background-tile copy routines

  CopyBackgroundTiles_PET_811EF70 and CopyBackgroundTiles_onNaviSelect_811F54C.

  The two background copy routines indicate this routine serves the combined

  PET + Navi selection screen.

  '
