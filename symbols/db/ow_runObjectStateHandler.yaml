name: ow_runObjectStateHandler
address: '0x080A9F58'
kind: function
status: probable
summary: Calls the overworld object's state handler selected by the object's state field.
interface: (r5 = object struct) -> dispatches to handler via table lookup; r0 passes through as handler
  arg
details: Reads a byte at r5+0x8 (the object's state index) and indexes a table of Thumb function pointers
  at off_80A9F6C. The three handlers are ow_initObjectSprite, ow_updateApproachObject, and sub_80A9FFC
  (state 2), matching an init/approach/... behavior state machine for overworld objects. It sets lr to
  pc manually to call the Thumb handler, then pops pc, so the handler's return goes straight back to this
  function's caller. r5 is not set up inside the function, so the object struct must be a caller-maintained
  register convention. r0 loaded from the table is only used as the branch target, so the handler inherits
  any r0 the caller set.
