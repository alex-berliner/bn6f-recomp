name: rfu_multiStartProbe
address: '0x0814475C'
kind: function
status: probable
summary: 'Performs one RFU/SIO multiplayer start-detection handshake step: sends 0x8FFF/0xA6C0 sync word,
  snapshots all 4 players'' SIODATA32, counts responders, and returns 1 if the expected player count acknowledged.'
interface: (no args; uses link phase byte_200F454 and comm struct at 0x200F460) -> r0 = 1 when the expected
  number of players acknowledged the handshake, else 0
details: 'Writes 0x8FFF or 0xA6C0 to the SIO 16-bit data register (0x4000120) depending on the toggled
  flag at 0x200F460+0x10, then clears that flag. It copies the 8-byte SIODATA32 snapshot (all four players''
  halfwords) to 0x200F460+4/+8 and scans the 4 halfwords: values matching 0xA6C0/0x8FFF(bit2 clear)/0xFF00
  mark the slot''s status byte at base+0x2A+slot as 1 or 2 and increment a responder count; 0xFFFF matching
  the expected index at +0x2 resets the count. The count is stored at +0x3 and mirrored to byte_2006E00;
  the verdict ((count&3)+1 or 0/1) goes to +0x11. Returns 1 only when count > 1, equals byte_2006E00,
  and slot 0 reads 0x8FFF. When byte_200F454 is not 0 or 2, a shorter variant just sends the sync word
  and copies the SIODATA32 snapshot.'
