  date: '2026-10-19'
  detail: strh of 0x8FFF/0xA6C0 into SIOData_Normal_8bitandUARTMode_ (0x4000120) at loc_81447B4/loc_81448EC
    — SIO handshake words; ldr of SIOData0_Parent__Multi_PlayerMode_ (0x4000120) copied 8 bytes into 0x200F460+4
    — snapshot of all four SIOMULTI slots; loop over 4 halfwords comparing against 0xA6C0/0x8FFF/0xFF00
    with per-slot status bytes at base+0x2A — classifying player responses; returns 1 when r9>1, equals
    byte_2006E00, and halfword0==0x8FFF — session detection success condition; called only from sio_linkStateUpdate,
