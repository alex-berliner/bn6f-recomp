name: battle_checkFlowAdvanceFlags_800A046
address: '0x0800A046'
kind: function
status: confirmed
summary: 'Gate for battle flow: returns 0xFF if the battle is over or time is stopped, otherwise 0 or 1 depending
  on which of two ready-flags (bit 3) is set in the battle work at dword_2036820.'
interface: 'u32 battle_checkFlowAdvanceFlags(void); in: r10, lr (r10 preserved by callees, unused here); no meaningful
  register inputs. out: r0 = 0xFF (battle over / time stop / neither flag set), 0 (bit 3 of dword_2036824 set),
  or 1 (bit 3 of dword_203682C set, only if the first is clear). side outputs: r3 = dword_2036820 (battle work base),
  r2 = 8 (test mask) are left set for callers; r1 clobbered; flags NZCV clobbered.

  '
details: 'First calls battle_isBattleOver; if true, returns 0xFF immediately. Then calls battle_isTimeStop; if true,
  also returns 0xFF. Otherwise it loads the battle work pointer dword_2036820 (IWRAM/ERAM battle controller struct)
  and reads two halfword flag fields: offset +4 (dword_2036824) and offset +0xC (dword_203682C), testing bit 3 (mask
  8) of each. The +4 flag has priority: if set, the function returns 0; otherwise if the +0xC flag is set it returns
  1; if neither is set it falls through to the default 0xFF. So the tri-state return is "not ready / use source
  A / use source B". The deliberate leaking of the struct pointer in r3 and mask 8 in r2 shows callers continue
  working directly with this same battle struct right after the call.

  '
