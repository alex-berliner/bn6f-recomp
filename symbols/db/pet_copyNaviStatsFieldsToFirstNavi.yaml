name: pet_copyNaviStatsFieldsToFirstNavi
address: '0x0809CE40'
kind: function
status: probable
summary: Copies NaviStats bytes at offsets 0x2D-0x30 and 0x56-0x5B from the PET's currently selected navi
  record into navi 0's record via GetCurPETNaviStatsByte/SetCurPETNaviStatsByte, using a 0xFF-terminated
  offset table at byte_809CE84.
interface: () -> void; no meaningful return value
details: 'Builds a local buffer on the stack, then walks a table of NaviStats field offsets at byte_809CE84
  (0x2D,0x2E,0x2F,0x30,0x56..0x5B, terminated by 0xFF). For each non-terminator offset it reads one byte
  via GetCurPETNaviStatsByte, passing the byte at [[r10]+0x40]+7 (likely the selected navi id) as the
  first argument. In a second pass over the same table it writes each saved byte back via SetCurPETNaviStatsByte
  with first argument 0, i.e. targeting navi 0''s record. The terminating 0xFF entry ends both loops.
  Net effect: the fields at offsets 0x2D-0x30 and 0x56-0x5B are duplicated from the selected navi onto
  the first navi; the terminator word 0xFF,4,34,3,2 at byte_809CEAC is just padding/data after the table.'
