    saves each field byte; second loop: ldr r2,[r7,r5]; mov r0,#0; bl SetCurPETNaviStatsByte writes saved
    value with navi arg 0; cmp r1,byte_809CEAC(0xFF); beq exit — 0xFF terminates the offset table; callee
