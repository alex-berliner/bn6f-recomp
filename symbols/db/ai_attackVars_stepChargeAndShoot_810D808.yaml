name: ai_attackVars_stepChargeAndShoot_810D808
address: '0x0810D808'
kind: function
previous_names:
- sub_810D808
status: probable
summary: Ticks a charged-beam attack timer in AIAttackVars, plays the windup/recoil anims, and spawns
  the projectile once the timer expires.
interface: (r4 = AIDataPtr, r5 = BattleObjectPtr, r7 = AIAttackVarsPtr, r10 = ToolkitPtr) -> r0 = remaining
  windup frames (or final state); writes AIAttackVars fields, BattleObject.CurAnim, CollisionData flag,
  and a child battle object via sub_80C5578.
details: 'On entry r4=AIData, r5=BattleObject, r7=AIAttackVars, r10=Toolkit. First visit (Unk_01==0) primes
  the attack: sets the already-firing latch to 1, raises OBJECT_FLAGS_UNK_BIT_22 on the BattleObject via
  object_setFlag1, sets Unk_12 (a u16 windup timer) to 0x26 (38 frames), changes CurAnim to 1 (charge
  anim), arms a 0x1e (30) frame counter via object_setCounterTime, and if AIAttackVars.Unk_28 points at
  a non-null script, writes 5 to its +0x10. Each call then decrements Unk_12; when it hits zero, builds
  a packed spawn descriptor (r4) by ORing in [AIData_Version_16]:8 with (Unk_0c-1)<<8, 1<<24 (the "fire"
  bit, OBJECT_FLAGS_USING_ACTION), and Unk_10 from AIAttackVars. It reads object_getFrontDirection to
  know which side the actor faces, computes the front panel as (panelX + facing, panelY), sets Unk_0e=1,
  advances CurAnim to 2 (recoil/attack anim), reloads the optional script latch (battle_ResetObjectTimerTo8_80C4072
  then clears Unk_28), stores 1 into the AIAttackVars handle at Unk_30, and calls sub_80C5578 with (panelXfront,
  panelY, 1, Damage=r6, scratchPtr=r7=r7[0x30]) to spawn/handle the projectile. While Unk_12 % 4 != 0,
  calls highlightPanelIfSomeCondition_8109660 with the same front panel coords plus (Alliance ^ DirectionFlip)
  and Unk_0d so the cursor blinks on the firing panel.

  '
