- method: assembly-reading
  date: '2026-10-14'
  detail: '- "ldrb r0,[r7,#oAIAttackVars_Unk_01]; cmp r0,#0; bne loc_810D836" is the first-call latch
    primed by writing 1 back. - "lsl r0,r0,#OBJECT_FLAGS_UNK_BIT_22_BIT; bl object_setFlag1" sets the
    pre-fire collision flag bit 22. - "strh r0,[r7,#oAIAttackVars_Unk_12]" with #0x26 stores 38 as the
    windup counter; the subsequent sub #1 / strh / bne loc_810D892 loop is the per-frame tick. - "strb
    r0,[r5,#oBattleObject_CurAnim]" with #1 (charge) and later #2 (recoil) show the two anim phases (0x10/0x11
    of BattleObject). - "bl object_setCounterTime" with #0x1e arms the 30-frame timeout on the BattleObject.
    - "orr r4,r0 / ldrh r0,[r7,#oAIAttackVars_Unk_10]; orr r4,r0" packs AIData.Version_16, (Unk_0c-1)<<8,
    1<<24 (USING_ACTION), and Unk_10 into r4 before the spawn. - "bl object_getFrontDirection; ldrb r1,[r5,#oBattleObject_PanelX];
    add r0,r0,r1" computes the panel in front of the actor. - "ldr r6,[r7,#oAIAttackVars_Damage]; ldr
    r7,[r7,#oAIAttackVars_Unk_30]; bl sub_80C5578" passes Damage and the handle at Unk_30 as the scratch/spawn
    argument pair. - "bl battle_ResetObjectTimerTo8_80C4072 ... str r0,[r1]" clears Unk_28 and writes
    1 into Unk_30 to mark the projectile created. - The tail "tst r0,#4 / bne locret_810D8B0" gates highlightPanelIfSomeCondition_8109660
    to a 4-frame strobe on Unk_12.'
