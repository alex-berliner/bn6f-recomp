name: sprite_load
address: '0x080026E4'
kind: function
status: confirmed
summary: Loads a sprite into an object, clearing its loaded-flag bit and falling back to a placeholder when not
  found.
interface: 'void sprite_load(void *spriteData, u16 spriteId, u8 subIndex, void *objectHeader); /* returns via r4/r5
  preserved, r1 holds original spriteData */ /* in:  r0 spriteData, r1 spriteId, r2 subIndex, r5 objectHeader out:
  r1 = original r0 (spriteData), r4/r5 preserved clobbers: N Z C V, r0 r2 r3 lr */'
details: 'Resolves the object''s per-type sprite slot by reading oObjectHeader_TypeAndSpriteOffset''s high nibble
  as a stride and adding it to the object base (R5) to get the sprite header pointer. Clears bit 3 (0x8) of oObjectHeader_Flags
  to mark the object as not-yet-loaded. Looks up the sprite data by packing r1:r2 into a single id ((r1<<8)|r2)
  via lookupValueForIdInTableAt_200DCA0_8002986. If the lookup misses, falls back to SpritePointersList[r1] then
  index [r2*4] (signed word, high bit indicates a placeholder pointer -- in this case spriteWhiteDot). Calls sprite_initialize
  with the resolved sprite pointer and then writes the original r0 (spriteData) into oObjectSprite_Unk_03 of the
  sprite header.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
