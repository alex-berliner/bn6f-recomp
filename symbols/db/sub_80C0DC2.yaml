summary: Adds a small random variance to the battle object's X/Y (using its X/Y/Z as input) and spawns a type-1
  effect object at the base object's Z offset.
interface: 'void sub_80C0DC2(void);

  // r5 => battle object (struct oBattleObject*); r5/r6/r7 preserved

  // r0 = 0x10 -> variance range constant passed to AddRandomVarianceToTwoCoords

  // sets r4 = 0x26 before spawning effect object

  '
details: 'Reads oBattleObject_X, oBattleObject_Y and oBattleObject_Z from the battle object

  pointer in r5, then calls AddRandomVarianceToTwoCoords with variance = 0x10 and

  the X/Y (with Z carried separately in r3) to jitter the spawn position. After

  returning, it sets r4 = 0x26 (likely a param/flags argument to the spawner) and

  calls spawn_t1_0x0_EffectObject to create the effect. The 0x10 / 0x26 constants

  and "t1/0x0" effect-object type/role come from the spawn helper; specific

  visual identification of the spawned effect is unknown.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
