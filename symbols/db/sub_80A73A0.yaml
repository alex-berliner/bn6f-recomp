  detail: '- r5 is dereferenced as Param2 at [r5+0x5] and Param3 at [r5+0x6]: strb/ldrb on offsets 0x5-0x7 in the
    assembly. - sub_8003694 (the camera projection helper) is called with r0=r5+0xc; r2 is its in-viewport flag,
    which gates the strb r0,[r5,#7]. - sub_80A743C/7454/74A8/7514 are the only "phase" callees, dispatched by Param3==0..2
    vs ==3. - The four branches on Param2==0..3 read [r5+0xc] vs [r5+0x10] (X vs Y) and write back to the same offset,
    matching a one-axis-at-a-time push routine. - Caller chain is sub_80A7354 -> sub_80A73A0 (single-level dispatch)
    with r5 carrying the same object pointer (preserved across the call).'
