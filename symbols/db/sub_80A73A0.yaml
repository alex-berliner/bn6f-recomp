summary: 'Battle object: project position, update sub-state, run post-projection X/Y clamp helper'
interface: (r5 = BattleObject*, r10 = Toolkit*) -> void
details: "Acts on a battle object passed in r5 (likely a chained \"helper\" object — see Param3 0x6 used as\n  a\
  \ sub-state at offset 0x6, Param2 0x5 used as axis selector at offset 0x5, result-of-clamp\n  written at 0x7).\n\
  \  1. Projects the object's world coords (passed as r5+0xc to sub_8003694) into screen\n     coordinates; r2 (visibility/non-zero\
  \ flag) decides whether byte 0x7 is set to 1 or 0.\n     This is also the source of the differing r0 exit values\
  \ (screen-XY packed).\n  2. Calls sub_80A743C; when it returns 1, increments Param3 (offset 0x6). If byte 0x7\
  \ is 0\n     after increment, calls sub_80A7454 then sub_80A7514; otherwise calls sub_80A74A8 then\n     sub_80A7514\
  \ and then resets Param3 to 0. So Param3 cycles through 0..3 before resetting,\n     dispatching to one of two\
  \ phase routines depending on the screen-visibility flag.\n  3. Calls sub_80A7590, using its r0 as a clamp delta.\
  \ Loads limits from [r5+0x18] (r6) and\n     [r5+0x1c] (r7), then dispatches on Param2 (r4 = [r5+0x5]) over 0..3:\n\
  \        - 0: X += delta; if (X+delta < minX) clamp to minX; store at [r5+0xc]\n        - 1: Y += delta; if (Y+delta\
  \ < minY) clamp to minY; store at [r5+0x10]\n        - 2: X -= delta; if (X-delta > minX) clamp to minX; store\
  \ at [r5+0xc]\n        - 3: Y -= delta; if (Y-delta > minY) clamp to minY; store at [r5+0x10]\n     The \"off-screen\"\
  \ half (>= 2) clamps while still moving the other way, suggesting this\n     is a screen-edge follow / chase helper\
  \ that pushes X or Y back into view (think camera\n     or HP-pickup attachment tracking).\n  Caller is sub_80A7354\
  \ (a per-frame dispatcher for this kind of helper object).\n"
