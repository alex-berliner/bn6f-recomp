name: rfu_STC_REQ_callback
address: '0x081494B8'
kind: function
status: confirmed
summary: RFU library callback for incoming REQ packets; logs the request command and dispatches it to the armed
  handler slot if one is enabled.
interface: 'void rfu_STC_REQ_callback(u8 srcId /*r0*/, u16 reqCmd /*r1*/); note: r0 exits holding the entry LR (pop
  {r0}; bx r0 epilogue quirk)'
details: 'Part of the Nintendo wireless (RFU/STWI) library used by Battle Network 6''s link features. On every REQ
  packet received over the wireless link, the STWI layer calls this with the requesting device id (r0, byte) and
  the request command (r1, halfword). It first re-arms the library''s default async callback via STWI_set_Callback_M
  (rfu_CB_defaultCallback), then stores reqCmd into offset 0x1C of the RFU work-area structure pointed to by dword_2010CC4
  (this field is the "current request" slot the library later inspects). It then checks bit 3 (0x8) of the work
  area''s status byte at offset 0: if set (a REQ callback is registered/armed), it calls sub_814DA68 with r0 = srcId,
  r1 = reqCmd, and r2 = the pointer loaded from the handler slot *dword_2010CC8 (the list/table of registered REQ
  handlers); it also mirrors reqCmd into r4 and srcId into r5 for that callee. If the bit is clear the request is
  swallowed (recorded but not dispatched). Quirks: the epilogue pop {r0}; bx r0 leaves r0 = entry LR on both paths;
  on the skip path r1 retains the whole status byte and flags are those of the bit test, while on the dispatch path
  flags/registers come from sub_814DA68. r4/r5 are preserved across the call.

  '
