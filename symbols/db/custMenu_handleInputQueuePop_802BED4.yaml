name: custMenu_handleInputQueuePop_802BED4
address: '0x0802BED4'
kind: function
status: confirmed
summary: Custom-menu state handler that pops the next halfword from the menu input queue, backing out to the state
  dispatcher if the queue is empty, otherwise storing the entry and advancing the menu state with a hold timer.
interface: void custMenu_handleInputQueuePop_802BED4(/* r5 */ CustomMenuObj *menu); // lr clobbered; returns R0
  = 0 (queue empty) or 4 (consumed), NZ set from R0, c/v untouched, R1 = Unk_0c byte on consumed path
details: "Called with r5 pointing at a custom-menu object (oS20364C0 field layout). Pops one halfword\nvia queue_popHalfword_802C8D4\
  \ and branches on it:\n- Zero (queue empty): writes 8 to the jump-offset byte at r5+0x1 (oS20364C0_JumpOffset01),\n\
  \  routing the next state step to sub_8026BF4 through the menu main handler\n  (custMenuMainMaybe_8026A88), and\
  \ clears the halfword at r5+0x2. R0 = 0.\n- Nonzero: stores the popped value into the halfword at r5+0x10 (oS20364C0_Unk_10),\
  \ then\n  picks a hold timer for the byte at r5+0xb (oS20364C0_Unk_0b): 1 frame when the byte at\n  r5+0xc (oS20364C0_Unk_0c)\
  \ is nonzero, otherwise 30 (0x1e) frames. Finally writes 4 to the\n  byte at r5+0x3 (oS20364C0_Unk_03) to advance\
  \ the menu state machine. R0 = 4.\nThe tst of the popped halfword also leaves NZ set from R0 on both paths; c\
  \ and v are never\ntouched. Function ends with pop {pc} (uses lr as the return address slot).\n"
