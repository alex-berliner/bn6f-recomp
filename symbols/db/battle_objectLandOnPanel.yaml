name: battle_objectLandOnPanel
address: '0x080C62A0'
kind: function
status: probable
summary: Battle-object state handler that snaps the object's pixel position to its panel coordinates,
  zeroes its height (Z16), and resumes the update state.
interface: (r5 = battle object ptr, no args) -> void; sets object state to CUR_STATE_UPDATE
details: Runs as a per-object state/phase handler using r5 as the battle object. First it calls object_setCoordinatesFromPanels
  so pixel X/Y match the object's current panel grid coords. It then stores 0 into oBattleObject_Z16,
  the object's Z/height halfword, dropping the object flat onto the panel. Finally it writes CUR_STATE_UPDATE
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, making the next tick go through the normal
  update handler. The pattern fits a landing or 'return to ground' transition used after jumps, warps,
  or being knocked back.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_setCoordinatesFromPanels re-syncs pixel X/Y from the object's panel coords; strh r0,#0
    into [r5,#oBattleObject_Z16] clears the object's height/Z halfword; str CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    hands control back to the standard update state; no arguments are read; all state is via r5, typical
    of battle object state-handler thunks
  refs:
  - bn6f/asm/asm31.s:31042
