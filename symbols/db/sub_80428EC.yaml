name: sub_80428EC
address: '0x080428EC'
kind: function
status: confirmed
summary: Copies a cursor index and adjacent byte from a script entry into the chatbox struct and advances the script
  pointer by 4 bytes.
interface: void sub_80428EC(struct ScriptEntry* r4, struct Chatbox* r5); returns 1 in r0; clobbers r1,nz,cv; reads/writes
  R4,R5,R0
details: 'Reads two bytes from the script/source pointer at offsets +2 and +3 (the cursor index and an

  adjacent flag/option byte). Writes them into the chatbox struct at oChatbox_CursorIdx and

  oChatbox_Unk_1B. Advances R4 (the script pointer) by 4 bytes so the next op can be read, and

  sets r0 = 1 (truthy result indicating the cursor-load op was consumed). Caller-supplied lr is

  used to return via `mov pc, lr` (a tail return into the chatbox script interpreter loop).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
