name: battle_panelFlagCheckByAlliance
address: '0x080DABE8'
kind: function
status: probable
summary: 'Cornfiesta helper: runs the panel-flag candidate check on a panel, using a panel-flag mask that
  depends on the attacker''s alliance (team).'
interface: (r0 = battle object ptr, r1 = panel/arg for panelFlagCheck) -> r0 = panelFlagCheck result;
  r2/r3 = param + args from the alliance-indexed table, r4 = candidate list
details: It is a thin two-call wrapper. It saves the caller's r0/r1, calls GetAllianceDependentPanelParamArgs
  with r3 = off_80DABFC, an 8-byte-per-entry table with two entries {0x4000000, NULL} and {0x8000000,
  NULL} indexed by the object's alliance field, so each team gets a different flag mask word (both with
  a NULL args pointer). It then restores the original r0/r1, sets r4 = byte_80DACC0 (the relative-offset
  candidate panel list, 0x7F-terminated), and tail-calls panelFlagCheck_8015D80, which filters/validates
  candidate panels against the returned flag mask. The differing masks per alliance suggest a 'panel belongs
  to my side vs. the enemy side' or team-specific panel-state test for the Cornfiesta chip attack's target
  panel.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetAllianceDependentPanelParamArgs with r3 = off_80DABFC, whose two 8-byte entries hold distinct
    flag words 0x4000000 and 0x8000000; pop {r0,r1} before the second call shows the original arguments
    are forwarded unchanged to panelFlagCheck_8015D80; ldr r4, =byte_80DACC0 supplies the relative-offset
    candidate panel list consumed by panelFlagCheck_8015D80; sole caller chooseCornfiestaPanelXY_80DABC4
    is the Cornfiesta chip-attack panel chooser, so the flag check gates that attack's chosen panel
  refs:
