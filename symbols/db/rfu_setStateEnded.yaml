name: rfu_setStateEnded
address: '0x0813D978'
kind: function
status: probable
summary: RFU helper that records state value 9 in the wireless work struct and invokes the lower RFU state
  routine with 0.
interface: () -> r0 = return of sub_813D934(0); no other side effects visible
details: Writes halfword 9 to offset +0x8 of the struct at 0x200BC50 (word_200BC58) and tail-delegates
  to sub_813D934 with r0=0, returning its result. The struct is the RFU/wireless work area shared with
  the other callers. Given rfu_resetSlotsAndReportOffline (which tears down slots and reports offline)
  calls this, 9 plausibly encodes a link-ended/reset state, but the enum meaning is not shown. The callee
  likely drives the state machine or sends the corresponding request.
