name: sub_8015C12
address: '0x08015C12'
kind: function
status: confirmed
summary: Lowers the active Navi's mood by a given amount, clamping it at a minimum of 1.
interface: 'void navi_DecreaseMood(bool alliance /* r0: flag passed to GetBattleNaviStatsAddr */, u32 amount /*
  r1 */); returns flags from CMP (reduced mood vs 1) in c/v/nz'
details: 'Calls GetBattleNaviStatsAddr (r0 = alliance flag selects which Navi''s stats to fetch,

  presumably the active/allied Navi) to get the NaviStats struct, then reads the

  oNaviStats_Mood byte. If the mood is 0 it is left untouched (no write happens when

  mood == 0). Otherwise it computes mood - amount (r4 preserves amount across the call)

  and stores the result back as a byte, but clamps it to a minimum of 1: if the signed

  comparison (reduced < 1, via CMP r1,#1 + BGE) fails, the value 1 is stored instead.

  The flags left by the final CMP (mood-amount vs 1) escape the function, so callers can

  tell whether the reduction clamped (carry set = would have gone below 1). Mood likely

  feeds the soul/unity or buddy Navi behavior in battle; a mood of 0 appears to be a

  special "already at floor/dead" state that this function deliberately does not modify.

  '
