name: battle_forEachShapePanel
address: '0x080C7132'
kind: function
status: probable
summary: Iterates over a shape's panel offsets (flipped to the object's facing) and calls a worker for
  every offset that lands on a valid grid panel.
interface: (r0 = origin column, r1 = origin row, r2 = arg2, r3 = arg3, r4 = shape index, [sp+0x3C] = stacked
  arg) -> r0 = last worker result; calls worker per valid panel with (col, row, arg2, arg3, r4=0, stackedArg)
details: 'r4 selects one of three offset tables (byte_80C7194/197/19C) holding pairs of signed-byte (dx,dy)
  offsets terminated by a 0x7F byte. Each dx is multiplied by object_getFrontDirection() (+1/-1, so shapes
  mirror with the object''s alliance side / DirectionFlip) and added to the base column; dy is added to
  the base row. object_isValidPanel rejects offsets outside the 6x3 battle grid, and for each surviving
  panel sub_80C7114 is called with the transformed coordinates plus the forwarded r2/r3, r4 forced to
  0, and the stacked 5th argument passed through. The three shapes are: single panel (0,0); two-panel
  column (0,0),(0,1); and a wide shape (0,0),(0,-1),(0,1). This is a typical BN6 ''shape'' hit/effect-area
  helper.'
