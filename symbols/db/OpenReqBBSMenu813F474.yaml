name: OpenReqBBSMenu813F474
address: '0x0813F474'
kind: function
status: confirmed
summary: 'Initialise and open the Request BBS screen: run the one-time intro-event ack, reset state fields, execute
  the screen bring-up chain, render request names, apply overlay palette and fade, spawn entry graphics, then enter
  the header view (unread selection) or the loading view.'
interface: 'void reqBBS_openMenu(u32 r5, u32 r10); // in: r5=*reqBBSState, r10=*parentWindow; out: r10, r11 modified;
  clobbers nzcv r0-r3 r7 r12 lr'
details: 'Reads/writes on the reqBBS state struct at r5: clears fields at +0x8 (u8), +0x20/+0x24/+0x26 (u16), +0x9
  (u8), +0xB (u8). Final dispatch writes +0x0 (u8 mode: 0x28=loading or 0x04=header) and +0x8 (u8 phase=5).

  Intro-event path: tests global event flag 0x173A; if set, reads eReqBBSGui+0xF (current new-request slot index),
  computes a per-request "new" event flag via reqBBS_textualPointers (index at offset 0x18 from base 0x813F34C);
  if that flag is also set, marks a "seen" flag (index at offset 0x14), clears 0x173A, and zeroes eReqBBSGui+0xF.

  Bring-up chain: reqBBS_813FDA8, reqBBS_813FE54, reqBBS_813FEB0, reqBBS_copyTextDataToRAM (all take/return r5).
  Then reqBBS_renderRequestNames(r5+0x24 count, r5) and reqBBS_81405C0() which also return r10/r11.

  Screen effects: renderInfo_8001788, renderInfo_80017A0, overlay palette 0x17, SetScreenFade(8, 0x10).

  Spawns entry sprite records from reqBBS_entriesGfx via battle_spawnEStructRecordsFromTable_80465A0.

  View choice: if r5+0x1E (u16) != 0 AND r5+0x5 (u8) == 0, enters header view (mode 4) calling reqBBS_renderSelectedEntry_HeaderText,
  writes 0x5E40 to window buffer at [r10+8]+0; otherwise enters loading view (mode 0x28), writes 0x5F40.

  Returns final r10 (window/screen pointer) and r11 (render context) to caller.

  '
