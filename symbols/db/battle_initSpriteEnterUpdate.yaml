name: battle_initSpriteEnterUpdate
address: '0x080E798C'
kind: function
status: probable
summary: Battle-object initializer that loads a fixed sprite resource onto the object, sets animation/palette/flip,
  and transitions the object's state machine to CUR_STATE_UPDATE.
interface: (r0 = object header in r5, r1-r3 = scratch; uses sprite ids 0x80, 0x0c, 0x1b) -> r0 = 0 (state
  word set to CUR_STATE_UPDATE); no flags guaranteed
details: It first calls sub_80E7AB0, then loads sprite resource group 0x80 with indices 0x0c/0x1b into
  the object and runs the animation loader on the attached sprite block. It marks the sprite shadowless,
  ORs flag bit 0x2 into the object header's Flags byte (likely a 'visible/active' or 'has-sprite' bit),
  selects animation index 2 (written to both oBattleObject_CurAnim and oBattleObject_CurAnimCopy) via
  sprite_setAnimation, reloads animation data, and sets palette 0. Finally it reads the object's effective
  facing via object_getFlip and passes it to sprite_setFlip so the sprite mirrors correctly, then stores
  CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized, ending the object's init
  phase. The hardcoded resource ids suggest it is the one-shot setup for one specific enemy/boss object.
