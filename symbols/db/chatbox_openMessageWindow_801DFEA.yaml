name: chatbox_openMessageWindow_801DFEA
address: '0x0801DFEA'
kind: function
status: confirmed
summary: Lays out a standard dialogue message window (18x3 cells at the screen origin, box style 0x11 on layer 2)
  and activates it with mode 0x40.
interface: void sub_801DFEA(void); // returns r0 = 0x40, r1/r2 as left by sub_801BEC2, r3 = 0, flags from the lsl
  (N=0,Z=0,C=0); r4-r7 preserved
details: 'A fixed-parameter wrapper that opens the game''s message/dialog window. It first calls call_sub_3005EBA
  with the window geometry hardcoded in registers: origin (x=0, y=0), width 0x12 cells, height 3 cells, box style
  0x11, palette/layer argument 2. r4 and r5 are used purely to carry the 5th/6th arguments to that callee and are
  restored from the stack on return, so the caller''s r4/r5 values survive. It then calls sub_801BEC2 with r0 =
  0x40 (built as mov r0,#1; lsl r0,#6), which appears to start / enable the configured window (bit 6 as an activation
  mode flag). No game state structures are touched directly here; all work is delegated to the two callees. Exits
  with r3 = 0 and the flags of the shift instruction unless sub_801BEC2 sets its own.

  '
