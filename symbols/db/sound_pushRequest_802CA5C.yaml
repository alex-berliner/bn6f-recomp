name: sound_pushRequest_802CA5C
address: '0x0802CA5C'
kind: function
status: confirmed
summary: Packs a sound ID from a request struct into a FIFO record and sends it to the ARM7 sound handler.
interface: void sound_pushRequest_802CA5C(/* r5 */ struct SoundRequest *req); // no meaningful return; flags/regs
  out are just fifo_pushRecord16's leftovers
details: 'Reads a signed 8-bit sound id at offset +6 of the struct pointed to by r5 and pushes a single 16-bit-format
  FIFO record via fifo_pushRecord16_8009FF8 with tag 0xB200 and data words 0, 0. The record value is "0x40000000
  | (((id << 3) + 13) & 0x1FF) << 16 | 0x15": bit 30 marks the record as a sound request, bits 16..24 carry the
  9-bit packed id (id*8+13, the same packing the ARM7 side decodes), and the low byte 0x15 is the sound command
  selector. r5 is only read; r4/r6/r7 are preserved. Presumably called when gameplay or scripts want a sound/SFX
  played, with the actual mixing handled on the ARM7 side of the FIFO.

  '
