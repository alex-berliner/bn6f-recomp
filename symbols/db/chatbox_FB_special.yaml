name: chatbox_FB_special
address: '0x08042388'
kind: function
status: confirmed
summary: Chatbox script dispatcher for the 0xFB opcode, jumping through a table of handler routines based on the
  action byte at offset 1 of the current script command.
interface: void chatbox_FB_special(u32 r4_scriptPtr); /* clobbers all of r0-r12, lr, nz/c/v */
details: 'Reads the action byte at scriptPtr+1, multiplies it by 4 to index jt_804239C, loads the

  handler address (with thumb bit) into r0, then bx-jumps through it. Returns via pop {pc},

  so control comes back to whatever invoked this step. r4 (the script pointer) is the only

  register preserved on entry; r10/lr are inputs that the dispatcher does not use here.

  All output registers and flags are whatever the dispatched handler leaves behind. The

  jump table is sparse (entries 4, 7, 9, 12 are 0), so unimplemented actions would jump to

  address 0. Entries 5 is chatbox_textScriptAction_openShop_80424BC; the others are

  unnamed chatbox handlers (0,1,2,3,6,8,10,11,13,14,15).

  '
