name: chatbox_placeCenteredTextRun_804293C
address: '0x0804293C'
kind: function
status: confirmed
summary: Executes the chatbox text script's "place next run centered" command, computing and recording the centered
  horizontal start position for the next chunk of text.
interface: void chatbox_placeCenteredTextRun_804293C(u32 r4 /* script cmd ptr */, u32 r5 /* chatbox obj */) -> r0=1,
  r1=new oChatbox_Unk_7C, r2=aligned start offset (px/4), r3=next char X, r4=r4+3; NZCV clobbered
details: 'Handler for one of the chatbox text-script commands (the 3-byte form where byte 2 is the

  run length in tiles). Reads the tile count at r4+2, computes the pixel width of the run

  as 11*(tiles-1)+16, picks the right edge of the text area as 0xB0 when chatbox flag

  bit 0x2 is set (the alternate/inset layout used for narrower sub-areas, e.g. bottom

  NaviCust-style panels) or 0xF0 otherwise, and centers the run: startX = (right - width)/2.

  When the flag is clear, startX is further shifted back by chatbox.oChatbox_TextScriptCharIdx

  so already-printed characters on the current line are accounted for.

  The chosen startX is stored at chatbox+0x94 as the next character X, and the run''s draw

  position is updated by adding ((startX>>1)<<3) (down-rounded to 8-pixel alignment, in

  pixels/4 units) to chatbox.oChatbox_Unk_7C, the chatbox''s current draw cursor pointer.

  Returns r0=1 to signal the script command was consumed, leaves r4 stepped past the

  3-byte command for the caller, and produces NZ=0, CV=0 via the trailing r4+=3 add.

  Field offsets touched: oChatbox_TextScriptCharIdx, oChatbox_Unk_7C, and an unnamed byte

  at chatbox+0x94 that holds the next character''s X coordinate.

  '
