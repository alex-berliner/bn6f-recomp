open_questions:
- What is the exact set of chatbox flag bits that chatbox_maskFlags_3e tests? Only bit 0x2 is observed here.
- Is chatbox+0x94 the same field as oChatbox_TextScriptCharIdx or a separate "next glyph X"? The readable C treats
  it as separate storage that happens to be written with the same charIdx-relative value.
- What 0xF0/0xB0 actually represent in pixels (likely 240/176 = GBA width vs. an inset chatbox width) is inferred
  from the constant names, not confirmed.
- The 8-pixel alignment step uses ((x>>1)<<3), which is equivalent to (x&~1)<<2; whether this is intentionally pixels/4
  rounded down to 8-pixel chunks or a leftover quirk is unclear.
