name: checkBattleEventGate_8029FB4
address: '0x08029FB4'
kind: function
status: confirmed
summary: Returns 1 when the battle event gate is open (battle mode 5, or normal mode with no sub-state
  and the expected event/flag/effect conditions), else 0
interface: 'u32 sub_8029FB4(u32 r5_battleState); // out: r0 gateOpen, r4 preserved; clobbers nz c v r1
  r3 lr'
details: "Called from the battle script/event controller (r5 points at the current battle-state struct).\n\
  Returns 1 (r0=1) immediately if GetBattleMode() == 5 (scripted event battles are always considered \"\
  open\").\nOtherwise returns 1 only when ALL of the following hold:\n  - byte at battleState+0x10 ==\
  \ 0 (no active sub-state / busy flag),\n  - EVENT 0x163 is NOT set,\n  - battle flag 0x40 is NOT set\
  \ (TestBattleFlag_0x40),\n  - battle-effects mask 0x200000 is NOT set (GetBattleEffects() & 0x200000\
  \ == 0),\n  - EVENT 0xE0 IS set.\nAny other combination returns 0. r4 is preserved across the call and\
  \ is used internally as the\naccumulating result (starts 0, set to 1 on success paths, returned via\
  \ r0).\nr5 is the live battle-state pointer carried by the caller.\n"
