name: sub_8033BE8
address: '0x08033BE8'
kind: function
status: confirmed
summary: Queues the current PET navi's graphics chunk into VRAM and triggers the update for the battle screen.
interface: void sub_8033BE8(void)
details: 'Gets the currently equipped PET navi id via GetCurPETNavi(), then queues a 0x80-byte graphics chunk into
  VRAM at 0x06017380 using QueueWordAlignedGFXTransfer. The source is picked from a 13-entry pointer table at off_8033C24
  (byte_86C1B20 .. byte_86C1E20, spaced 0x80 apart), indexed by navi id << 2. Special case: while event flag EVENT_163
  (flag 0x63 of the bank/index pair passed to TestEventFlagFromImmediate) is still clear, a nonzero value in byte_200AD04
  overrides the navi id with slot 12 (byte_86C1E20). After the transfer is queued, calls sub_802FE28 with the packed
  parameters 0x40120006 and 0xC79C and (1, 0) to kick off the graphic swap. Preserves r5-r7; clobbers r0-r4 and
  lr.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
