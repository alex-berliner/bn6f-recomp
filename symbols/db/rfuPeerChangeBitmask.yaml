summary: 'Proposed name: rfuPeerChangeBitmask. Accumulated bitmask of wireless peer slots reporting a
  received-value change. (u8)'
details: A one-byte EWRAM variable is reset to 1 by link-transfer initialization. During peer-value polling,
  each slot with pending received data has its bit ORed into this variable, and the accumulated value
  is read after polling all four slots. sub_8148884 also resets it to 1 while setting a neighboring RFU
  state byte to 1, before querying connection status. Despite the four-byte span to the next label, all
  observed accesses are byte accesses, so only its first byte is used here.
