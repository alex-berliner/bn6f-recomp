name: storeIndexedPair
address: '0x0803C434'
kind: function
status: probable
summary: Writes two parallel 32-bit arrays (0x200A3C0 and 0x200A3E0) at a caller-supplied index, building
  paired per-slot tables from two getter calls
interface: (r0 = index, r1 = first value, r2 = second value) -> void; writes unk_200A3C0[index] = r1 and
  unk_200A3E0[index] = r2
details: The function scales r0 by 4 and stores r1 into the array at 0x200A3C0 and r2 into the parallel
  array at 0x200A3E0 (the two arrays are 0x20 apart, so each holds at least 8 word entries). It is a trivial
  two-word setter with no other logic or flag effects. Its only known caller loops a counter r4 from 0
  upward, calls sub_81466E4(r4) and sub_8146714(r4), and passes their return values as the pair, so it
  fills both tables slot by slot with the results of those getters for each index.
