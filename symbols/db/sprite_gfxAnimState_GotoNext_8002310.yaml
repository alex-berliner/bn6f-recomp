name: sprite_gfxAnimState_GotoNext_8002310
address: '0x08002310'
kind: function
status: confirmed
summary: Switches a graphics animation state over to the "next" animation referenced by its current animation data
  slot.
interface: void sprite_gfxAnimState_GotoNext(const struct GFXAnimData* animData /*r0*/, struct GFXAnimState* state
  /*r7*/); r4-r6 passed through as scratch; r4-r7 preserved
details: 'Wrapper around sub_8002378 that performs a "chain to next animation" on a GFXAnimState.

  It reads GFXAnimData.ParamNext (a 32-bit field) and clears the top bit by shifting left

  then right by 1, which suggests the MSB is used as a flag/marker bit (e.g. end-of-chain

  or loop marker) inside the next-animation pointer/index field. It then gathers the

  caller''s current animation parameters from the GFXAnimState: Param0 (byte), Param2

  (byte), Index (byte at offset 1), and Param1 (32-bit word), packs them into r0-r4

  (r0=Param0, r1=nextState, r2=Param2, r3=Index, r4=Param1) and tail-calls sub_8002378

  to install the new animation into the state. Only r4 and r7 are saved/restored; r5 and

  r6 are simply passed through untouched for the callee. Registers r0-r3 are fully

  consumed by the callee, so nothing meaningful is returned to this function''s caller.

  '
