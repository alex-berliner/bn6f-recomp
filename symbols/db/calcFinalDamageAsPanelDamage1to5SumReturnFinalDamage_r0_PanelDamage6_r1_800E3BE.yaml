name: calcFinalDamageAsPanelDamage1to5SumReturnFinalDamage_r0_PanelDamage6_r1_800E3BE
address: '0x0800E3BE'
kind: function
status: confirmed
summary: Sums a battle object's five per-panel collision damage values into its FinalDamage field and returns that
  total plus the sixth panel damage value.
interface: (r5 = battle object, r4 = preserved scratch) -> r0 = u16 FinalDamage (sum of PanelDamage1..5), r1 = u16
  PanelDamage6, r3 = collision data pointer; clobbers r2 and nzcv flags
details: 'Reads the object''s collision data pointer from oBattleObject_CollisionDataPtr, then loops five times
  over consecutive u16 entries starting at oCollisionData_PanelDamage1, accumulating them into r0. The sum is stored
  as a u16 to oCollisionData_FinalDamage in the same collision data block. PanelDamage6 is deliberately NOT included
  in the sum; it is read separately and returned in r1, suggesting the caller handles it differently (e.g. as a
  distinct damage component). All values are 16-bit halfwords. Quirk: the loop advances r3 by 2 each iteration,
  so at exit r3 sits 10 bytes past oCollisionData_PanelDamage1, and the FinalDamage store address is computed from
  this advanced pointer plus the oCollisionData_FinalDamage offset (r1 is 0 after the loop, then gets the offset
  added); the verified C model treats the store as landing on collision+oCollisionData_FinalDamage and the returned
  r3 as the collision pointer, which implies the offset constants are defined so the arithmetic works out. r4 is
  pushed/popped unchanged despite the contract listing it as an output.'
