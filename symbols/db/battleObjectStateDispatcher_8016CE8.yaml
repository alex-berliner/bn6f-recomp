name: battleObjectStateDispatcher_8016CE8
address: '0x08016CE8'
kind: function
status: confirmed
summary: Reads a battle object's state byte and tail-jumps to one of three per-state handlers, passing the state
  byte through.
interface: void sub_8016CE8(struct BattleObject* obj /* in r5 */); // r0 = state byte and r1 = handler address passed
  on to the selected handler; all other registers pass through untouched
details: 'Trampoline/state dispatcher for a battle object. r5 points to the battle object; the byte at oBattleObject_Unk_0d
  is used as a *byte offset* (not a scaled index) into the handler table at off_8016CFC, so only values 0, 4 and
  8 are valid and select sub_8016D08, sub_8016D8C and sub_8016E3C respectively. The dispatcher is a tail call: it
  loads the handler address, sets r0 = the state byte and leaves r1 = the handler address from the table load, then
  bx''s into the handler with lr still pointing at this function''s caller (mov lr, pc + bx r1 with the pop {pc}
  epilogue only reached if the handler returns to this frame). Every register except r0 and r1 passes through unchanged,
  so the handlers see the caller''s full register context.

  '
