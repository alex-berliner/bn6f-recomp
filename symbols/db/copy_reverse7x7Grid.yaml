name: copy_reverse7x7Grid
address: '0x0813B818'
kind: function
status: probable
summary: Copies a 49-byte 7x7 grid from [r7] to [r4] in reversed order (180-degree flip).
interface: (r4 = dest buffer (49 bytes), r7 = source cursor) -> writes 49 bytes to r4; r7 advanced past
  source; no return value
details: 'Uses caller-provided r4/r7 without saving them. Outer counter r5 walks row bases 0x2a,0x23,0x1c,0x15,0x0e,0x07,0x00
  (stride −7); inner counter r6 walks 6..0, so each source byte read sequentially from [r7] is stored
  at r4[r5+r6], yielding dest offset 48−i for source byte i. Net effect: a 49-byte block reversed, equivalent
  to rotating a 7x7 byte grid by 180 degrees. No flags or other structures touched; nothing returned.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_813B818+2: mov r5,#0x2a then sub r5,#7 / bge — row bases 42 down to 0, seven rows of seven;
    loc_813B81E: add r3,r5,r6; ldrb r0,[r7]; strb r0,[r4,r3]; add r7,#1 — sequential source reads into
    r4[r5+r6]; r6 loop 6..0 over r5+r6 covers offsets 48..0 exactly once, pairing src byte i with dest
    48−i (reversal/180° flip); r4 and r7 are never set or pushed, so both buffer and source come from
    the (unknown) caller'
