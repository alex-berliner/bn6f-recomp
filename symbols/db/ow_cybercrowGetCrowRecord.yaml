summary: Returns a pointer to one of the eight Cybercrow crow records (index * 0x14 into byte_2000D20).
interface: (r0 = record index) -> r0 = &byte_2000D20[index * 0x14] (0x14-byte crow record); flags not
  meaningful
details: 'Multiplies r0 by the 0x14 record size and adds the base byte_2000D20, returning the address
  of that slot. The records are the Cybercrow lesson crow records: +0 state byte, +2/+6 timers, +4 heading,
  +8/+0xC/+0x10 s16.16 X/Y/Z position. It is a pure address computation with no side effects; callers
  then read or mutate the returned record''s fields. Despite pushing r4-r7, none are used — likely compiler
  artifact.'
