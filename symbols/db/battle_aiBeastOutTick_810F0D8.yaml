status: probable
summary: 'Beast-Out AI tick step: when the beast-AI flag is set, advance the turn counter and queue an attack; otherwise
  countdown and either pick a chip attack or queue a counter/decide.'
interface: '(r4 = AIData, r5 = BattleObject, r6 = AIState, r7 = AIAttackVars) -> void ; side effects: AIAttackVars
  (damage/flags/cmd), object_setAttack0, possibly sub_80103F8 reads from the opposite-ally battle object.'
details: "Registers r4..r7 are loaded by the caller; no arguments are passed in r0-r3 (the saved entry\n  r1=0x0810f0d9,\
  \ r2=0x80, r3=0x03 are residues from the caller frame, not inputs here). The first\n  block checks the beast-AI\
  \ \"extra-var2\" field at BattleObject+0x64 (oBattleObject_ExtraVars+4):\n  if non-zero it is cleared, ExtraVars[0]\
  \ is incremented, AttackVars.Unk_0c is set to that value,\n  and object_setAttack0(0xb) is invoked (object code\
  \ 0xb = \"exit/sync BeastOut turn\"); this branch\n  fires when BeastOutSet was requested last tick. Otherwise\
  \ the function calls\n  battle_aiTryChipAttack_0810F1B6; if it succeeds it returns. On failure it decrements the\n\
  \  BattleObject.0x6c halfword (custom-counter/timer) and bails out while still > 0. When the timer\n  hits zero\
  \ it increments AIState.Unk_04 (a 0..3 sub-state). For sub-states >= 3 it clears Unk_04\n  back to 0, then runs\
  \ \"should we end the beast AI?\" checks: skip if battle_isBattleOver returns\n  true, otherwise read the *opposite*\
  \ alliance's battle object via sub_80103F8(r0=!Alliance, 1),\n  inspect its HP (the ldrh [r0,#0x24] -> oBattleObject_HP),\
  \ and bail if HP==0. If those pass, the\n  function looks up version-indexed damage from byte_810F18C[oAIData.Version_16]\
  \ (a 6-entry table\n  per Beast tier; values 0x0A,0x1E,0x50,0x64,0x32,0x64), stores it into AttackVars.Damage\
  \ and\n  AttackVars.Unk_0a, then writes AttackVars.Unk_0c from byte_810F192 indexed by sub_810F1E6()\n  (1..3\
  \ by tier), records the navi Version_16 in Unk_0d, copies ExtraVars[0] into Unk_0e, and\n  arms AttackVars.Unk_28\
  \ with &BattleObject+0x64 (the AI extra-vars scratch slot), then calls\n  object_setAttack0(0xa) (the actual beast-attack\
  \ frame).\n  In the >=3 branch fall-through (loc_810F160), the function instead stores the \"wait\"\n  duration\
  \ from byte_810F1A4 into AttackVars.Unk_10, zeros AttackVars.Unk_2c, points\n  AttackVars.Unk_28 at sub_810F1F2+1\
  \ (a \"no-op\" return stub) and calls object_setAttack0(9).\n"
