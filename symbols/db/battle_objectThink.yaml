name: battle_objectThink
address: '0x080D102E'
kind: function
status: probable
summary: 'Per-frame update step for a battle object: process damage/collision, run its current action
  handler, or begin despawn when the battle ends or the object dies.'
interface: (r5 = battle object) -> r0 = destroyed (nonzero) via CUR_STATE_DESTROY set; otherwise updates
  object in place
details: 'Runs the shared per-frame logic for a battle object pointed to by r5. It first tears down and
  respawns the object''s collision data, then checks battle-over: if the battle is over, a damage handler
  (basicHandleBattleObjectDamage_801156A with r0=0) returns <0, or the collision data reports flag bits
  from the last collision, the object is destroyed — releasing its reserved panel (by PanelX/PanelY),
  calling sub_80D11FC (likely unlisting/cleanup), clearing its collision region, and setting oBattleObject_CurState
  to CUR_STATE_DESTROY. Otherwise, unless a time-stop is active (then it only refreshes collision data),
  it dispatches through a 4-entry jump table indexed by oBattleObject_CurAction to per-action handlers
  (sub_80D1094..sub_80D1136).'
