name: rfu_initOrRestartSession
address: '0x08132104'
kind: function
status: probable
summary: 'RFU session setup/restart: bails on flag bits 8 (stores 0xC at +0xC) or on sub_803C330 pending
  (after error step); otherwise if flag 0x10 is set, runs the mode dispatcher, then either re-initializes
  the wireless session (adapter present) or tears down via sub_8147B24, finally spinning one counter tick
  and calling two RFU cleanup routines.'
interface: (r0 = selector passed to sub_803CB18 checks, r5 = eS200BC50 state struct) -> r0 = destroyed;
  writes state bytes at eS200BC50+0xC and +0x3
details: r5 points at the eS200BC50 state struct (its literal is in the pool). If check sub_803CB18(8)
  is true, it stores 0xC at +0xC and exits. Otherwise, if sub_803C330 reports something pending it runs
  sub_803C2A0 and sub_803CB00(0x20) (likely an error/fade step) and again stores 0xC at +0xC. If sub_803CB18(0x10)
  reports the link active, it dispatches the mode handler (sub_803EA78), calls sub_8132398, writes 0xC
  to +0x3, and then either calls rfu_initWirelessSession (when sub_803EA50 says the adapter is present)
  or sub_8147B24 (likely link teardown) otherwise. It then busy-waits one tick of the counter returned
  by sub_813D5D0 and calls sub_81469A0/sub_81469E8 (RFU-side cleanup/reset) before returning. The repeated
  0xC stores look like a shared error/close state code in the connection state machine.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: pool literal .word eS200BC50 plus strb r0,[r5,#0xc]/[r5,#3] show r5 is that struct and 0xC is
    a state code; bl rfu_initWirelessSession on the success path of sub_803EA50 ties this to wireless
    link handling; sub_803CB18(8)/sub_803CB18(0x10) gate the two exit paths, so it reacts to link status
    flags; sub_803EA78 mode dispatch plus sub_803CB00(0x20) suggest a mode/error transition on failure;
    tail busy-wait on sub_813D5D0 and calls to sub_81469A0/sub_81469E8 are RFU-area cleanup before return
  refs:
  - bn6f/asm/asm36.s:4058
  - 0x08148D24 rfu_initWirelessSession
  - 0x0803EA78 sub_803EA78
  - 0x0803C2A0 sub_803C2A0
  reproduce: python3 tools/asmcat.py 0x08132104
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code checks sub_803CB18(8) first and bails to store 0xC at +0xC if non-zero (not the other way
    around as the proposal suggests — `beq loc_8132114` means it skips the store when zero). Only after
    both check 8 and check via sub_803C330 return zero does it try sub_803CB18(0x10). The name ''recoverLinkError''
    misframes it as error recovery when much of the logic is conditional init/re-init. A better name reflects
    the RFU session setup/restart role: rfu_initOrRestartSession. The 0xC stores at +0xC and +0x3 are
    short-circuit exits on early failure flags, not shared error codes.; run wf investigate investigate-20261019-010606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- no known callers, so the trigger condition and the exact meaning of state 0xC are unconfirmed
- sub_8147B24, sub_8132398, sub_81469A0/sub_81469E8 are unnamed, so the teardown-vs-reset split is inferred
- the semantics of the sub_803CB18 flag bits 8 and 0x10 are unknown
- 'The code checks sub_803CB18(8) first and bails to store 0xC at +0xC if non-zero (not the other way
  around as the proposal suggests — `beq loc_8132114` means it skips the store when zero). Only after
  both check 8 and check via sub_803C330 return zero does it try sub_803CB18(0x10). The name ''recoverLinkError''
  misframes it as error recovery when much of the logic is conditional init/re-init. A better name reflects
  the RFU session setup/restart role: rfu_initOrRestartSession. The 0xC stores at +0xC and +0x3 are short-circuit
  exits on early failure flags, not shared error codes.'
