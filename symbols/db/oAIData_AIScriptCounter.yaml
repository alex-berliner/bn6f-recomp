name: oAIData_AIScriptCounter
address: '0x4c'
kind: struct-field
status: probable
summary: Counter incremented by the AI each tick and read by AI script helpers; cleared to 0 on battle
  init / chip-use reset.
details: 'The field is accessed exclusively through four tiny helper thunks with highly consistent semantics:

  battle_clearAIDataField4c_8014424 stores 0, battle_incrementAIDataUnk4c_8014432 does "load → add 1 →

  store", and battleObject_aiGetUnk4cPtr_801442C returns the value. It''s also explicitly zeroed at

  bn6f/asm/asm00_2.s:12611 alongside oAIData_Anger after a "mark used action" reset. The plain

  increment-1 pattern (no conditional, no scaling) is the strongest signature for a monotonic tick

  / script-step counter rather than a state or flag.'
