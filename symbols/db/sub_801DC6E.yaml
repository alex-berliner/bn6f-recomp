name: sub_801DC6E
address: '0x0801DC6E'
kind: function
status: hypothesis
summary: One-line wrapper that invokes sub_801BEB8 with the single flag value 4 (bit 2), likely requesting/setting
  one state bit in whatever subsystem that routine services.
interface: void sub_801DC6E(void); // takes no register inputs (callers only pass lr and incoming carry); r0-r2
  and N/Z/C on return are whatever sub_801BEB8 leaves
details: 'Builds the constant 4 as (1 << 2) using mov r0,#1 / mov r1,#2 / lsl r0,r1, then tail-branches (bl + pop
  {pc}) into sub_801BEB8 with that value in r0. It touches no memory, globals, or structures of its own; all real
  behavior lives in sub_801BEB8, so the meaning of "bit 2" depends entirely on that callee. Because the LSL is the
  last flag-setting instruction before the call and sub_801BEB8 preserves flags, the caller-visible N=0, Z=0, C=0
  must survive — the readable C models this with SET_FLAGS_ADD(1,3), which yields the identical flag state. The
  wrapper is effectively a named constant invocation: "do operation X with mask bit 2".'
