name: owMapObject_weatherTornado_active_80A8F08
address: '0x080A8F08'
kind: function
status: confirmed
summary: 'Per-frame update for the weather-tornado overworld entity: handles caught-state transition, cutscene/dialog
  suppression, normal movement, player-collision check, and sprite/priority/state persistence.'
interface: owMapObject_weatherTornado_active_80A8F08(r5 = obj, r6 = data, r10 = ambient) -> r2 r3 r4 r5 r6 r7 r8
  r9 r10 r11 r12 (clobbers r0 r1 lr flags)
details: 'Dispatches on event flag 0xB:0xEF (tornado-caught marker). If set, writes byte 8 to obj+0x08 (state =
  caught) and calls owMapObject_weatherTornado_caught_80A8FA0 for the post-capture animation. Otherwise, gates movement
  behind three checks: original-cutscene script position (0x8036F40, 0x8036F58) and a chatbox/dialog mask flag 0x80
  via chatbox_mask_eFlags2009F38; if any is active the tornado pauses. When free to move, calls owMapObject_weatherTornado_moveOrPause_80A8F48
  and owMapObject_weatherTornado_checkHitPlayer_80A91A4. Regardless of branch, the frame-end sequence always runs:
  set draw priority (0x80A91F4), generic sprite_update, and save state (0x80A9218). Touches obj+0x08 (u8 state field),
  uses r5/r6 as object and companion-data pointers throughout.'
