name: CutsceneCmd_do_camera_shake
address: '0x0803822A'
kind: function
status: confirmed
summary: Cutscene command handler that reads two map-script bytes (shake magnitude and duration) and triggers the
  camera shake effect, then advances the script by 4 bytes.
interface: void CutsceneCmd_do_camera_shake(void) /* uses r7 (script ptr), r10, lr in; r0=1, script ptr += 4 out;
  clobbers r1,r2,r4,r6, cv flags */
details: 'Dispatched by the map/cutscene script interpreter when the current opcode

  requests a camera shake. Sets the script-read slot index (r6) to 1 and

  calls ReadMapScriptByte to fetch the shake magnitude, then sets r6=2 and

  calls ReadMapScriptByte again to fetch the shake duration (the byte

  values come back in r4 and are shuttled into r0/r1). Calls

  camera_initShakeEffect_80302a8 with those two parameters to start the

  shake. Finally adds 4 to r7 (the script pointer) to consume the two

  argument bytes plus the opcode, and returns 1 in r0 to signal the step

  was handled. Saved LR is popped directly into PC (tail-call style via

  `pop {pc}`), so r10/lr are clobbered across the call into the script VM.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
