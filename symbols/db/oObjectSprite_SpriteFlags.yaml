name: oObjectSprite_SpriteFlags
address: '0x11'
kind: struct-field
status: probable
summary: Bitfield of per-sprite render flags (0x03 = scalable/affine slot, 0x0C = alpha/blend mode, 0x10
  = mosaic enable).
details: ">\n  Every access treats Unk_11 as a packed flag byte. Bits 0x0C are read with `mov r7, #0xc;\
  \ bic r1, r7; orr r1, r2`\n  to set alpha mode (sprite_setAlpha / sprite_setObjWindowMode). Bit 0x10\
  \ is cleared with `bic r1, #0x10` in\n  sprite_clearMosaic and masked via `and r2, r0` / `orr r1, r2`\
  \ to enable mosaic (Unk_10 comment confirms bit\n  0x10 is mosaic). Bits 0x03 are toggled in sprite_makeScalable/Unscalable\
  \ (set with `orr r2, #3; strb`, cleared\n  with `bic r0, #3`) and tested with `tst r1, #3` to gate affine-slot\
  \ allocation. The struct comment\n  explicitly notes \"set this to 0x10 to give this sprite a mosaic.\""
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: Low 2 bits tested for affinity/scalable state (gates actor-index allocation).
  refs:
  - bn6f/asm/sprite.s:946
  reproduce: grep -n 'oObjectSprite_Unk_11' bn6f/asm/sprite.s | head
  result: '"ldrb r0, [r5,#oObjectSprite_Unk_11] ... mov r1, #3; tst r0, r1"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Bits 2-3 are an alpha/obj-window mode field (3 = enable window mode).
  refs:
