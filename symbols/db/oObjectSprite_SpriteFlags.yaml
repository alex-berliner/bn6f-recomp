  reproduce: grep -n 'oObjectSprite_Unk_11' bn6f/asm/sprite.s | head
  result: '"ldrb r1, [r3,#oObjectSprite_Unk_11] ... bic r1, #0xc; orr r1, #8; strb r1,[r3,#Unk_11]"'
- method: assembly-reading
