name: ai_attackRandomPanel
address: '0x080F1E98'
kind: function
status: probable
summary: 'AI attack step: picks a random panel matching an alliance-based attribute filter and launches
  an attack on it using the object''s damage value.'
interface: (r5 = battle object, r7 = AI attack vars struct) -> r0 = return of sub_80D54F0; no branch flags
  of interest
details: Reads the object's Alliance field and indexes the pair table at off_80F1EF0 (alliance<<3) to
  get required/forbidden panel-attribute masks. It fills a stack list with all panels matching those masks
  except the object's own panel via object_getPanelsExceptCurrentFiltered and bails out if the count is
  zero. It then rolls GetPositiveSignedRNG and uses SWI 6 (Div) to take rand % count as an index into
  the panel list. The selected packed panel byte is decoded as x = byte>>4, y = byte & 7. Finally it calls
  sub_80D54F0 with (r0 = y, r1 = x, r2 = oAIAttackVars_InitFlag, r3 = 0, r4 = 0xA, r6 = oAIAttackVars_Damage),
  i.e. spawning the attack effect on the chosen panel.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Alliance]; lsl #3; ldr pair from off_80F1EF0 -> alliance-dependent
    required/forbidden masks for the panel filter; bl object_getPanelsExceptCurrentFiltered with list
    buffer at sp, then ''beq'' exit when zero matches; bl GetPositiveSignedRNG; r1=count; svc 6 (Div)
    -> remainder = random index; ldrb r0,[sp,r1] selects the panel byte; lsr r1,#4 / lsl+lsr #0x1d unpack
    panel byte into x and y before the attack call; ldr r6,[r7,#oAIAttackVars_Damage] and r2=[r7,#oAIAttackVars_InitFlag]
