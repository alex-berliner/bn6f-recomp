  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst; phase 0 path stores phase=4 and timer=0x3C (60 frames);
    decrement path: ldrh/sub/strh on oBattleObject_Timer with bgt exit — a frame countdown; on timer expiry:
    mov r0,#0x14; strb to oBattleObject_CurAction and clears CurPhaseAndPhaseInitialized; push/pop {pc}
    with no r0 return value — pure state-mutation step on the r5 object'
