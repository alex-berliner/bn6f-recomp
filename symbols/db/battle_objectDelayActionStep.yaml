name: battle_objectDelayActionStep
address: '0x080BA0D8'
kind: function
status: probable
summary: Per-frame state step that makes a battle object wait 60 frames before starting action 0x14.
interface: (r5 = battle object) -> void; no return value
details: 'Runs as part of a battle object''s per-frame state machine (r5 holds the object). On entry with
  CurPhase == 0 it initializes the wait: sets CurPhase to 4 and the object timer to 60 (0x3C). On subsequent
  calls (CurPhase != 0) it decrements oBattleObject_Timer; when it reaches zero it writes CurAction =
  0x14 (20) and clears CurPhaseAndPhaseInitialized to 0, kicking off the next action. Note it writes the
  halfword CurPhaseAndPhaseInitialized (clearing both phase and initialized flag) but writes only the
  byte CurPhase when setting phase 4. The 60-frame delay followed by a fixed action suggests a scripted
  pause before an enemy/object behavior.'
