    output: transformation effect at the navi''s arm; PlaySoundEffect(0x19) on entry and PlaySoundEffect(SOUND_LOG_IN_77)
    at timer 0x1c: transformation roar then a mid-animation sound; SetBattleNaviStatsByte calls write
