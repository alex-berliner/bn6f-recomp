name: battle_beastOutTransformAction
address: '0x080E95D8'
kind: function
status: probable
summary: 'Battle action handler that performs the player navi''s Beast Out transformation: roar effect
  and sound, beast-out stat boosts, then a 60-frame animation wait.'
interface: (r5 = battle object ptr, frame-stepped) -> void; sets object CurAction=12 and phase=0 when
  the timer expires
details: 'r5 is a battle object; phase 0 is one-shot setup: sets phase=1, timer=60, copies three words
  from RelatedObject1+0x34, computes the navi''s arm position from NameID/Alliance/DirectionFlip and spawns
  effect object type 0x5a there, plays SFX 0x19. It then applies beast-out bonuses to the navi''s NaviStats
  record via the alliance-aware byte accessors: byte1 += (5 - beastOutDamageCap) if cap < 5, byte2=4,
  byte3=4, byte0xA=8, byte7=59 if it was 0xFF (also written directly through GetBattleNaviStatsAddr),
  and bytes 0x1B-0x1D=1; it also sets object flag 0x40030 and updates collision data (offset 0x10, 2 entries),
  skipped when Custom+ is disabled (battle_IsNoCustomPlusActive). Byte 0x63 is compared to BattleState.BattlePhase
  and set to phase+1 if nonzero and not ahead of the phase. Phase 1 just counts the 60-frame timer down
  (SFX 77 at timer==28), then sets CurAction=0xC and phase=0 to end the action.'
