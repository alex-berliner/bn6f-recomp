open_questions:
- What the four per-map byte arrays at 80A81BE/81CC/81DE/81F0 actually contain (only seen indexed via `ldrh ...
  [r0,r2]` with r2 = 2*byte_4_of_object); they likely hold event-flag ids specific to a particular object class.
- What object type lives at r5 (the callers are unnamed and only share the same `(r5, r10, lr)` in-contract; r5
  is some object/sprite pointer with at least 5 bytes known to this routine).
- The semantic meaning of MapGroup==0x85 forcing index 3 (probably one of the Expo/floating-map variants, given
  this is bn6f Falzar).
