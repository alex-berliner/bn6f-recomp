name: sub_80A82DC
address: '0x080A82DC'
kind: function
previous_names: []
status: hypothesis
summary: For an overworld map object (r5), if its "tier/event" event flag for the current map is set, raise its
  sprite OAM priority to 3, and report whether the flag was set.
interface: '(r5 = OWMapObjectPtr, r10 = ToolkitPtr) -> r0 = 0/1 (event flag set?); side effect: may call sprite_setPriority
  with priority=3 on the object''s sprite'
details: "- Reads Toolkit->GameStatePtr (oToolkit_GameStatePtr, offset 0x3c) into r0.\n  - Reads MapGroup at oGameState_MapGroup\
  \ (0x4). If MapGroup == 0x85, uses MapNumber index 3; otherwise reads MapNumber at oGameState_MapNumber (0x5)\
  \ directly.\n  - Multiplies that index by 4 and indexes off_80A8310, a small table of four pointers whose targets\
  \ are the byte arrays at 0x80A81BE, 0x80A81CC, 0x80A81DE, 0x80A81F0 (these sit inside the caller 0x80A822C's data\
  \ region, which is also the function that holds the four per-map event-flag tables).\n  - Treats r5 byte at offset\
  \ 4 as a sub-index; lsls #1 and ldrh from the chosen table gives a u16 event-flag id, which is passed to TestEventFlag.\n\
  \  - If the flag is set (TestEventFlag returns NZ), sets r4=1 and calls sprite_setPriority_8002E14(0x3) to push\
  \ the object's sprite to OAM priority 3; otherwise r4 stays 0.\n  - Returns r0 = r4. The function appears to be\
  \ a sprite/visibility nudge for a particular overworld object depending on a story-progress flag on the current\
  \ map.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, [r10,#oToolkit_GameStatePtr]` reads the game-state pointer. - `ldrb r1, [r0,#oGameState_MapGroup];
    cmp r1, #0x85; bne loc_80A82EC` shows the map-group special case 0x85. - `ldrb r1, [r0,#oGameState_MapNumber]`
    in the fall-through reads the map number. - `lsl r1, r1, #2; ldr r2, [off_80A8310]; ldr r0, [r2,r1]` builds
    an index into a 4-entry pointer table. - `ldrb r2, [r5,#4]; lsl r2, r2, #1; ldrh r3, [r0,r2]` reads a per-object
    u16 event-flag id from the chosen per-map table. - `bl TestEventFlag` (confirmed `TestEventFlag (flag: u16)
    -> !zf`). - `mov r0, #3; bl sprite_setPriority_8002E14` in the "flag set" branch. - `mov r0, r4` at the end
    returns the boolean.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080A82DC

    '
  result: the body read as described above
