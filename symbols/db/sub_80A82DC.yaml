open_questions:
- What the four byte_* tables at 0x80A81BE/CC/DE/F0 represent (story flags per zone? per chapter?); what
- MapGroup==0x85 corresponds to (likely a special map group like WWW/Expo). The byte_4 field is assumed
- to be ObjectID because BattleObject's first field (byte 0) is the ObjectHeader and byte 1 is the
- Index, but r5 isn't confirmed to be a BattleObject vs OverworldMapObject/etc.; both share the
- ObjectHeader layout so byte 4 differs in meaning. Callee `sprite_setPriority_8002E14` summary says
- it touches sprite byte 0x15, but the struct in this project puts ObjectSprite at 0x90/0x80 in
- BattleObject — byte 0x15 may actually be at oBattleObject_SpriteData+0x15 within the struct.
