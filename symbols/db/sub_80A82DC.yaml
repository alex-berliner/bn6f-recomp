name: sub_80A82DC
address: '0x080A82DC'
kind: function
previous_names: []
status: hypothesis
summary: Tests an event flag selected by current map/object index; if set, returns 1 and bumps the battle object's
  sprite OAM priority to 3
interface: '(r5 = BattleObjectPtr) -> r0 = 0/1 ; side effects: may call TestEventFlag and sprite_setPriority_8002E14'
details: "Reads GameStatePtr from r10->Toolkit, picks a per-map group/number (group 0x85 is treated as 3, otherwise\n\
  \  the map number byte) and uses it as an index into the table at off_80A8314 (four u16 entry pointers\n  into\
  \ byte_* data tables at 0x80A81BE/CC/DE/F0). Loads a u16 event-flag offset from that table indexed\n  by r5->ObjectID\
  \ (r5 byte 4 << 1 as u16), and calls TestEventFlag. On success writes r4=1 and calls\n  sprite_setPriority_8002E14(r0=3)\
  \ on the sprite pointed to by r5 (sprite byte 0x15 = priority 3). On\n  failure r4 stays 0. Returns r4 (0 or 1)\
  \ in r0. Looks like a per-battle-object \"has the story flag\n  been set that should raise this object's sprite\
  \ above others\" check.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- r10->Toolkit->GameStatePtr load (`mov r0, r10` then `ldr r0, [r0,#oToolkit_GameStatePtr]`) - MapGroup==0x85
    branch substitutes a hardcoded index 3 instead of MapNumber (`cmp r1,#0x85; ... mov r1, #3`) - ldr r2,[off_80A8310]
    -> table of 4 word pointers (off_80A8314) used as u16 arrays of event flags - `ldrb r2, [r5,#4]` then `lsl r2,r2,#1`
    uses r5 byte 4 (ObjectID within the BattleObject struct) as index - `ldrh r3,[r0,r2]` reads a u16 event flag
    number that is passed to TestEventFlag - On flag set: `mov r4,#1; mov r0,#3; bl sprite_setPriority_8002E14`
    raises sprite priority to 3 - Returns r4 in r0'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080A82DC

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp, maps'
