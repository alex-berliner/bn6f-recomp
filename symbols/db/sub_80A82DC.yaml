name: sub_80A82DC
address: '0x080A82DC'
kind: function
previous_names: []
status: hypothesis
summary: If a story-progress (event) flag is set for the current map/group, bump the sprite's OAM priority on the
  object passed in r5 and return 1; otherwise return 0.
interface: (r5 = object ptr, r10 = toolkit ptr) -> r0 = 0 (no priority bump) or 1 (priority was bumped to 3)
details: "- Reads GameState via r10->Toolkit->GameStatePtr, then picks MapGroup (when == 0x85) or MapNumber to index\
  \ a small table of u16 flag tables.\n  - Uses object[r5]+0x4 (an actor/object index) doubled as a word index to\
  \ load a u16 event flag index, then calls TestEventFlag on it.\n  - When the flag is set: writes r4=1, calls sprite_setPriority_8002E14(r0=3)\
  \ on the sprite implied by r5, and returns 1.\n  - Otherwise: returns 0 without touching sprite priority.\n  -\
  \ The selection of 3 as the OAM priority is hard-coded; the index lookup is a per-map/per-group flag table.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, r10; ldr r0, [r0,#oToolkit_GameStatePtr]` then `ldrb r1, [r0,#oGameState_MapGroup]` and `ldrb
    r1, [r0,#oGameState_MapNumber]` (map id read from GameState). - `cmp r1, #0x85; bne loc_80A82EC` then `mov r1,
    #3; b loc_80A82EE` substitutes 3 when MapGroup == 0x85 (special "always uses index 3" path). - `lsl r1, r1,
    #2; ldr r2, off_80A8310; ldr r0, [r2,r1]` selects one of byte_80A81BE/byte_80A81CC/byte_80A81DE/byte_80A81F0
    (four flag tables). - `ldrb r2, [r5,#4]; lsl r2, r2, #1; ldrh r3, [r0,r2]` reads an index from the object at
    offset 4 and indexes the chosen u16 flag table. - `bl TestEventFlag` (confirmed event flag tester), with `beq
    loc_80A830C` skipping the priority change. - On flag set: `mov r4, #1; mov r0, #3; bl sprite_setPriority_8002E14`
    (the callee''s summary explicitly matches: bits 2-3 of sprite byte 0x15 = r0). - `mov r0, r4; pop {r4,pc}` returns
    r4 (=1 on success, 0 otherwise).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080A82DC

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp, maps'
  reproduce: 'grep -l ''^080a82dc '' tools/traces/coverage/*.prof

    '
  result: beastsp, maps
open_questions:
- Whether r5 must be an OverworldMapObject (or NPCObject) vs a generic object — the only field touched is byte at
  +0x4 which is the ObjectID in those structs; sprite_setPriority_8002E14 likely walks r5 the same way its callers
  in nearby code do.
- Why MapGroup 0x85 forces the table index to 3 is unclear without knowing the map-group numbering.
- Exactly which four flag tables at byte_80A81BE/byte_80A81CC/byte_80A81DE/byte_80A81F0 contain (unconfirmed; only
  their addresses are referenced via off_80A8314).
