name: battle_initArmPositionObject
address: '0x080DBB64'
kind: function
status: probable
summary: Spawn/init step for a battle object that resolves an arm-slot id to a position, loads its sprite
  there, and sets up its collision box, freeing itself if the slot is invalid.
interface: (r5 = battle object) -> r0 = 1 if the object was initialized and switched to CUR_STATE_UPDATE,
  else the object was freed; clobbers r0-r3
details: Reads the object's ExtraVars as an arm/part slot id and calls enemy_getArmPosition_800F26C; 0xFF
  (invalid/absent slot) makes it object_freeMemory and bail. Otherwise it saves the returned x/y/? record,
  calls sprite_load with the id, sets oObjectHeader_Flags bit 1, enables/disables the shadow from the
  fifth returned byte, sets CurAnim and CurAnimCopy from the third byte plus sprite_setAnimation and sprite_loadAnimationData,
  and sets the palette from the fourth byte. ExtraVars 0xD8/0xD9 get sub_8002EAC instead of the alliance-based
  sprite_setFlip. It then snaps to panel coordinates, offsets X by frontDirection * 0x120000, sets Z16
  to 0x10, allocates collision data, and on success configures it with (6, 5, 3), hit effect 0x0A, marks
  the collision present, and advances the object's state phase to CUR_STATE_UPDATE; if collision allocation
  fails the object is freed.
