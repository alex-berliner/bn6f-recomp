  detail: '- `ldr r5, =off_8083C38; ldr r5, [r5]` at +0 loads the per-scene state struct pointer (0x08083DF4–6).
    - Two cutscene-script sentinel checks (`cutscene_checkOriginalCutsceneScriptPos_8036F40`/`_8036F58`)
    and the busy guard (`owPlayer_isBusyOrCutsceneActive_809E462`) only OR into the "freeze and exit"
    branch — confirms this is gated on cutscene/intro conditions. - `bl SetEventFlagFromImmediate`/`bl
    ClearEventFlagFromImmediate` with EVENT_4FD before/after the guard establishes a "intro is running"
    lock flag. - `TestEventFlagFromImmediate` of EVENT_4EB after the guard at 0x8083E1E tests a "intro
    already completed" sentinel. - `ldrb r4,[r5]; cmp r4,#0/1/2/3/4` cascade at 8083E2C/8083E40/8083E6C/8083E98/8083EAE
    reads the `State` byte; each `add r4,#1; strb r4,[r5]` is the state advance. - Timer fields +0x12,
    +0x14, +0x16 are written with concrete constants 0x28, 0x5A and decremented each frame, then branch
    on zero — classic frame-countdown pattern. - The 7 `ClearEventFlagFromImmediate` calls in the termination
    block + `reqBBS_clearFlag_8140A0C` show a coordinated cleanup of the same flags the intro had set.
    - Final return `r0=0` (terminate) vs the two `r0=1` returns (continue / freeze).'
