name: ai_attackStepChoosePanelAndCharge
address: '0x080F4D50'
kind: function
status: probable
summary: 'One step of an enemy AI attack: pick a target panel via a callback, reserve both target and
  own panels, lock into an attack pose, and after a short countdown register the attack element.'
interface: (r0-r3 = battle object + AIAttackVars context in r5/r7) -> void; no return value
details: Runs as a state step of the AI attack vars block in r7. If AttackElement is still 0 it sets it
  to 4, and only proceeds if object_canMove allows it. It calls the stored PanelChooseCallback with r0
  = TargetObjectPtr and constants 0x10 / 0xF880080 (from off_80F4DB8/dword_80F4DBC); the callback returns
  a panel (x in r0, y in r1), which is stored to TargetPanelX/Y and claimed with object_reservePanel.
  The object's own panel is copied to FuturePanelX/Y and also reserved, then OBJECT_FLAGS_CANNOT_SLIDE
  is set so it cannot be pushed, anim 4 (attack stance) is set, HasMoved=1, sub_80F57DE runs, and StepTimer
  is set to 3. On subsequent calls the timer counts down; at 0 it writes element 4 into HitElement, completing
  the wind-up; if the panel choice or movement failed it clears HasMoved and calls object_exitAttackState.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'callback result stored: strb r0/r1 -> TargetPanelX/Y then bl object_reservePanel (target panel
    claim); own PanelX/Y copied to FuturePanelX/Y and object_reservePanel called again (claim own panel);
    OBJECT_FLAGS_CANNOT_SLIDE set via object_setFlag1 plus anim 4 and HasMoved=1 = committed attack stance;
    StepTimer=3 then decremented; at 0 HitElement=4 written, i.e. timed wind-up before the hit; object_canMove
    gate and object_exitAttackState on failure show it is one attack-state step'
