name: ClearOWPlayerLayerIndexOverride
address: '0x0809E26A'
kind: function
status: confirmed
summary: Clears the overworld player object's layer-index override so the player renders at its default layer again.
interface: u32 ClearOWPlayerLayerIndexOverride(u32 toolkit /* r10 */); returns r3 = overworld player object pointer
details: 'Takes the toolkit pointer in r10 (this routine is part of a group that receives context in a nonstandard
  register), loads GameState via oToolkit_GameStatePtr, then the overworld player object via oGameState_OverworldPlayerObjectPtr,
  and stores 0 as a byte into oOWPlayerObject_LayerIndexOverride, disabling the forced layer index. Unusually for
  a "clear" helper, it leaves the player object pointer in r3 as an output; the C model treats that as the return
  value. Flags are clobbered (writes set no meaningful flags here, but nz is marked dirty). lr is used as a plain
  return (mov pc, lr), so it must not be tail-called from code needing a preserved lr.

  '
