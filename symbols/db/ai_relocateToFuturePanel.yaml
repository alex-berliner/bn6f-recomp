name: ai_relocateToFuturePanel
address: '0x08014D08'
kind: function
status: probable
summary: AI attack-state handler that warps a battle object onto its reserved future panel and finishes
  the move with an emerge-style animation.
interface: (r5 = battle object, r7 = AI attack vars) -> void; moves object to FuturePanelX/Y, sets CurAnim=0x11,
  StepTimer=6, HitElement=4
details: Commits the object's FuturePanelX/Y into PanelX, releases the panel reservation, and recomputes
  pixel coordinates, collision panels and facing. It clears the post-hit invulnerability and the charged/PwrAtk
  state, resets the AI script offset via sub_80C4C3A, and nulls RelatedObject1Ptr and AIData TempAttackObjectPtr,
  i.e. it is the cleanup at the end of an AI-driven move. The object is left playing CurAnim 0x11 with
  sprite bank 12/sub-sprite 5 decompressed, and RelatedObject2 (likely a hole/ground effect) is flagged
  with Param3=1 and object flags |=0x14. Finally it writes StepTimer=6 and HitElement=4 into the AI attack-var
  struct at r7. No caller was captured, so which AI attack uses this (e.g. a burrowing/reappearing enemy
  move) is inferred, not proven.
