name: ai_attackChoosePanelStep
address: '0x080F4C44'
kind: function
status: probable
summary: 'One step of an enemy AI attack: picks a target panel via a callback, reserves it, locks the
  object in place, and counts down before signaling the hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> r0 = clobbered; updates AttackElement, FuturePanelX/Y,
  CurAnim, StepTimer, HitElement, AttackDuration
details: 'This is one step of an AI attack state machine. On the first call (AttackElement == 0) it marks
  the attack as started (AttackElement = 4), and if object_canMove says the object is free, it calls the
  panel-choose callback stored in oAIAttackVars_PanelChooseCallback with two per-alliance words from a
  table indexed by Alliance*8 as r2/r3; the callback returns the target panel in r0 (x) and r1 (y), which
  are stored into FuturePanelX/FuturePanelY. It then claims the panel with object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE
  on the object via object_setFlag1 so it can''t be pushed off the reserved panel, switches the object
  to animation 4, calls sub_80F57DE (unknown, likely anim/state update), and sets StepTimer = 3. On subsequent
  calls it decrements StepTimer and, when it reaches zero, writes HitElement = 4 (the attack element to
  apply). If the object cannot move or the callback rejects the panel, the attack is aborted instead:
  AttackDuration = 0x50 and HitElement = 8.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/tst on oAIAttackVars_AttackElement with ''mov r0,#4; strb'' on first entry gates the one-time
    setup path; stores FuturePanelX/FuturePanelY then ''bl object_reservePanel'' show it claims the chosen
    panel for this object; ''mov r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1'' pins the object while
    the attack winds up; panel-choose callback pointer called with ''mov lr,pc; bx r0'' and per-alliance
    data from byte_80F4CA4 (alliance * 8) returns x/y; StepTimer countdown path ends with ''strh #4, HitElement'',
    matching element 4 set when the attack started'
