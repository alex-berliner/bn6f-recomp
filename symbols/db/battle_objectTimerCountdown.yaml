- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isTimeStop / battle_isPaused early-exits guard the countdown (asm); ldrh r0,[r5,#oBattleObject_Timer];
    sub r0,#1; strh ... decrement loop; bne path: bl object_clearCollisionRegion then strh r0(=0),[r5,#oBattleObject_HP];
    cmp r0,#0xb4; lsr r0,#2; bic 0x2 of oObjectHeader_Flags every 4th tick; Called from six battle-side
    chip routines (sub_80CD08C etc.) per the route record'
