name: battle_objectTimerCountdown
address: '0x0800F672'
kind: function
status: probable
summary: Counts down a battle object's lifetime timer and destroys the object (HP=0, collision cleared)
  when it expires or the battle ends.
interface: (r5 = battle object header) -> r0 = scratch; updates oBattleObject_Timer, oObjectHeader_Flags,
  oBattleObject_HP; returns void
details: 'Early-returns while time-stop or pause is active. Decrements oBattleObject_Timer; when it hits
  0, or if battle_isBattleOver says the battle ended, it calls object_clearCollisionRegion and stores
  0 into oBattleObject_HP, which is the standard ''kill this object'' pattern. Otherwise, once the timer
  is at or below 0xB4 (180 frames) it clears flag bit 0x2 of oObjectHeader_Flags every 4th tick (lsr #2
  carry), likely phasing the object out of some state (e.g. invulnerable/no-hit) during its final seconds.'
