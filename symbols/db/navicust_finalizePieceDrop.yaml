name: navicust_finalizePieceDrop
address: '0x081371B0'
kind: function
status: probable
summary: On releasing a program in the Navi Customizer, runs up to three placement-validation checks against
  the drop coordinates and the held piece, showing error dialogs 0x17/0x18/0x16 and setting state 0x44
  on failure, or clearing the drag offset and setting state 0x48 on success.
interface: ()(r5 = customizer state struct, r7 = drag context with x/y at +0x28/+0x2C) -> sets state byte
  [r5] to 0x44 (invalid, show dialog) or 0x48 (placed); no return value used
details: 'Entry plays/sets something with id 0x3F8 via sub_8137670 and bails out if flag [r7,#0xD] is
  set. It then runs three placement checks against the drop coordinates (ldrh [r7,#0x28]/[r7,#0x2C]) and
  the held piece pointer [r7,#0x44]: sub_813BB68 fails -> dialog 0x17, sub_813BFB8 fails -> dialog 0x18,
  sub_813BF60 fails -> dialog 0x16, each leaving state 0x44 (stay in drag/error mode). If all checks pass,
  it calls sub_8137670(1), clears the halfword at [r5,#0xE] (likely drag offset) and sets state 0x48,
  which presumably commits the program into the grid. Dialog IDs 0x16-0x18 are NaviCust error messages
  such as overlapping programs or illegal cells.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: three sequential validity checks (sub_813BB68/BFB8/BF60) each branch to RunTextScriptNaviCustDialog
    with 0x17, 0x18, 0x16 on failure; drop coordinates read from r7+0x28/0x2C and held-piece data at r7+0x44
    passed to the checks; success path clears [r5,#0xE] and writes state 0x48 vs error path writing 0x44,
    a typical UI state-machine transition; callee RunTextScriptNaviCustDialog identifies this as the Navi
    Customizer screen's dialog flow
  refs:
