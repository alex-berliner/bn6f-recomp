  reproduce: python3 tools/asmcat.py 0x081371B0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is largely correct: it sets state 0x44 on validation failure (bne cases at loc_81371E2
    and locret_8137222 via loc_8137208) and 0x48 on success at loc_8137214, and the three checks with
    dialogs 0x17/0x18/0x16 match the asm. However, the success path calls sub_8137670(1) and clears [r5,#0xe],
    while the failure paths call sub_8137670(0); the initial sub_8137670(0x3F8) at entry matches sub_8137670
    taking an ID/argument, not a commit/confirm. The summary''s ''commits the placement'' is an overreach
    — it just finalizes the visual/state. A better name: navicust_finalizePieceDrop.; run wf investigate
    investigate-20261018-212108; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
