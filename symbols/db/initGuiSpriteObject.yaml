name: initGuiSpriteObject
address: '0x0811A7AC'
kind: function
status: probable
summary: Initializes a GUI sprite object (resource 0x2A) with fixed anim/palette/priority and places it
  at one of three preset positions chosen by a variant byte.
interface: (r5 = object struct; variant in [r5+4]) -> void; sets [r5]=0x23, [r5+8]=4
details: 'Object initializer: writes type 0x23 into byte 0 of the object struct, then sets up the sprite
  via initGuiSprite_8002770 with eGuiSprite2022AA0/0x2A, animation 0, no shadow, palette 0, priority 2.
  Stores halfword 0x1D0 through slotList_storeHalfwordAndClearField_800306C and sets sub-entry palette
  bank 0xA and sub-record field A = 3. Reads variant byte [r5+4] to index two 3-byte tables (byte_811A810
  = 0xBC,0xB0,0xAC and byte_811A813 = 0x40,0x48,0x48), passing both bytes plus r2=6 to sub_811A838, which
  likely sets position. Sets state byte [r5+8] = 4 and finishes via sub_811A818. No callers are known,
  so the trigger context is unconfirmed.'
