name: sprite_updateStateDispatch
address: '0x0811B570'
kind: function
status: probable
summary: 'Per-frame update for a sprite object: dispatches to one of two state handlers selected by the
  object''s state byte, then runs shared post-update logic and sprite_update.'
interface: (r5 = object/sprite struct; state = [r5+9]) -> r0 destroyed; updates object state via handler,
  refreshes sprite
details: Loads the byte at r5+9 (the object's state/mode field) and indexes a two-entry jump table at
  jt_811B58C, calling sub_811B594 for state 0 and sub_811B5C0 for state 1 via the classic mov lr,pc/bx
  trick. After the handler returns, it unconditionally calls sub_811B8C8 (unknown shared logic) and then
  sprite_update, which advances the object's sprite animation. This is the standard per-frame tick structure
  for an OAM-based object whose behavior is a small state machine.
