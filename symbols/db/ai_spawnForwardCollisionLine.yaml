- method: assembly-reading
  date: '2026-10-18'
  detail: 'loop: mov r4,#1 ... add r4,#1; cmp r4,#3; ble loc_80F99CE - three placements at increasing
    offsets; mul r0,r4 on object_getFrontDirection result plus ldrb PanelX gives x = panelX + dir*1..3;
    ldr r6,[r7,#oAIAttackVars_Damage] feeds the spawned region''s damage; dword_80F99F4 = 0x400FF01 and
    dword_80F99F8 = 3 are the spawn parameter constants; callee object_spawnCollisionRegion confirms a
    battle collision region is created each iteration'
