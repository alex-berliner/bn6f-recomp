name: ai_spawnForwardCollisionLine
address: '0x080F99CA'
kind: function
status: probable
summary: Spawns three collision-region panels in a line 1-3 panels ahead of an enemy, dealing the attack's
  damage on each.
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = ?; clobbers r4-r7 (saved/restored)
details: Loops r4 = 1..3; each iteration computes frontDirection * r4 + the actor's PanelX to place a
  collision region progressively farther in front (PanelY fixed). It passes oAIAttackVars_InitFlag as
  one arg, 0 as another, reads oAIAttackVars_Damage into r6, and uses the constants 0x400FF01 (flags/type
  for object_spawnCollisionRegion) and 3 (likely region lifetime or size). The damage comes from a shared
  AI attack-variable struct, so the caller sets up Damage and InitFlag before invoking this. The register-argument
  convention (r4-r7) matches the spawnCollisionRegion callee rather than this routine's own signature.
