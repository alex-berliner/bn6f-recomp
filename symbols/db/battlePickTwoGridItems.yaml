name: battlePickTwoGridItems
address: '0x0802A9D0'
kind: function
status: probable
summary: 'Battle submenu letting the player select up to two items from a grid under a 0x32 budget: A
  picks a cell (id from unk_2031000, weight from byte_802B5FC, total tracked at [r5+0x12]) into slot [r5+0x10]
  then [r5+0x11]; B clears the most recent slot; 0x100 inspects (state 0x18, sound 0x9c); 0x200 confirms
  (state 0x1c, text script 0).'
interface: (r5 = menu state struct, r10 = toolkit) -> void; drives sounds, text script and screen rebuilds
details: State machine on [r5+1] with a mode byte at [r5+2] (0 = grid mode). Cursor is a grid position
  ([r5+0x24] = one axis, [r5+0x20] = other) whose index into the halfword grid unk_2031000 is (x+y)*2;
  a 0xFFFF entry is an empty/invalid cell. A press on a valid cell loads its weight from byte_802B5FC[id*8+4]
  and, if the running total [r5+0x12] stays <= 50 (0x32) and the item isn't already chosen, stores the
  id into slot [r5+0x10] then [r5+0x11]; B clears the last-chosen slot back to 0xFF (via sub_802B5B0).
  D-pad scroll goes through menu_adjustCursorOrValue_811F7F8, and after any change the display is rebuilt
  by sub_802B358(unk_2031000, decomp_2032000) plus sub_802B438(unk_2030E60, unk_2031000). The 0x200 button
  sets state 0x1c and runs battle-context text script 0 (RunTextScriptBattleRunDialog); 0x100 on a cell
  sets state 0x18 with sound 0x9c (inspect?). Per-frame tail calls sub_802B15C for OAM slots 0x10/0x11,
  then sub_802B1E4/sub_802B270.
