name: object_initDefaults
address: '0x080F9DF2'
kind: function
status: probable
summary: 'Re-initializes a battle object to a neutral default state: clears two ObjectFlags1 bits (0x40
  and 0x400000), claims its status-UI slot with name 0/HP 0, enables sprite shadow, zeroes Z, refreshes
  collision with hardcoded (0,1,2,3) and selects region 1, then writes the low halfword of DamageAndStaminaDamageCounterDisabler
  into both SelfDamage and StaminaDamageCounterDisabler of the collision record.'
interface: (r5 = battle object) -> void; no return value
details: 'Uses r5 as the battle object pointer. It clears ObjectFlags1 bit 0x40 and bit 0x400000, then
  calls the status-list claim routine with (0,0), which empties the object''s slot in the battle status
  UI at 0x203EB50 (name ID 0, HP 0). It turns the sprite''s shadow on, zeroes the object''s Z halfword,
  and refreshes collision with hardcoded values (r0=0, r1=1, r2=2, r3=3), then selects collision region
  1. Finally it reads the DamageAndStaminaDamageCounterDisabler word: the low halfword is stored as SelfDamage
  in the collision record and the low byte again as StaminaDamageCounterDisabler, while the high halfword
  is discarded after being extracted. This looks like a ''reset/deactivate object'' step, likely run when
  an object is recycled or returned to a blank state.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: two object_clearFlag calls with 0x40 and 0x400000 wipe object flag bits (asm loc_80F9DF4); sub_801DC7C
    called with r0=0,r1=0 zeroes the object's status-list entry per that callee's summary; sprite_hasShadow
    re-enables the shadow, consistent with resetting sprite state; object_updateCollisionData(0,1,2,3)
    and object_setCollisionRegion(1) install neutral collision values; self-damage fields are reloaded
    from the object's own DamageAndStaminaDamageCounterDisabler word, not zeroed, preserving configured
    damage
  refs:
