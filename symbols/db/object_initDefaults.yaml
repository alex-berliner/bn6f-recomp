- Exact meaning of the hardcoded updateCollisionData arguments (0,1,2,3) and collision region 1
- Whether the high halfword of DamageAndStaminaDamageCounterDisabler is meant to be dropped or stored
  elsewhere
- 'The proposal correctly describes clearing flags 0x40 and 0x400000, calling the status-list claim with
  (0,0), enabling shadow, zeroing Z, and refreshing collision with the hardcoded params, followed by extracting
  low halfword of DamageAndStaminaDamageCounterDisabler. However, the summary''s claim of ''selects collision
  region 1'' and ''discards high halfword'' is slightly misrepresented — object_setCollisionRegion(1)
  is indeed called, and only the high halfword is unused, which fits. The bigger issue is the name: ''object_resetDefaults''
