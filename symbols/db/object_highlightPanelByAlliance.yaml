open_questions:
- parameter semantics of object_highlightPanelRegion (which of r0/r1 is x/y or rect, what 0x11 selects)
- why alliance 0 maps to {0x05,0x20} while alliance 1 maps to {0x02,0x02}
- which game context the caller sub_81060D8 runs in (which object type triggers this highlight)
