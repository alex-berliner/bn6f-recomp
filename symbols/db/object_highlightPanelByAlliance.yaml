name: object_highlightPanelByAlliance
address: '0x08106670'
kind: function
status: probable
summary: Wrapper that highlights a panel region with parameters chosen from a two-entry table indexed
  by the battle object's alliance.
interface: (r0..r3 unused on entry; r5 = battle object) -> calls object_highlightPanelRegion(x=?, y=?,
  r2=0x11, r3=oBattleObject_AllianceAndDirectionFlip); no return value
details: Loads the object's oBattleObject_Alliance byte, doubles it, and indexes dword_810668C (bytes
  05 20 02 02, i.e. entry0={0x05,0x20}, entry1={0x02,0x02}) to fetch two parameter bytes. It then calls
  object_highlightPanelRegion with those bytes in r0/r1, a constant 0x11 in r2, and the object's AllianceAndDirectionFlip
  halfword in r3. r5 is not set up here, so the caller (sub_81060D8) must place the battle object pointer
  in r5 before calling. The table suggests the highlighted panel area/effect differs between the two alliances
  (e.g. player side vs enemy side). The exact meaning of the table bytes and of the 0x11 constant depends
  on object_highlightPanelRegion's signature, which is not shown here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Alliance]; lsl r0,r0,#1 selects one of two 2-byte entries in dword_810668C;
    dword_810668C = 0x02020205 gives entries {0x05,0x20} and {0x02,0x02}; mov r2,#0x11 passes a fixed
    mode/color constant to object_highlightPanelRegion; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip]
    forwards the object's alliance/flip flags; only caller sub_81060D8; the r5 object pointer must be
    prepared there
