name: sub_80AA824
address: '0x080AA824'
kind: function
previous_names: []
status: probable
summary: 'A battle-settings entry''s kind bits for pickBattleSettingsEntry_80AA5F4''s filter: 0x20 when its setup
  has a Navi (enemy data byte 2 >= 4), else a bit per enemy family (bit from the enemy data''s top nibble), plus
  0x40 when the entry''s byte 7 is 2.'
interface: (r0 = BattleSettings *) -> r0 = kind bits; r4, r6, r7 restored
details: 'Walks the entry''s setup (+0xC) in 4-byte records until kind 0xF0: for each enemy record (kind & 0xF0
  == 0x10) it looks up the enemy (enemy_getStruct2 with the u16 id from bytes 2-3) and ORs 1 << (data hword >> 12
  & 0xF); an enemy whose data byte 2 is 4 or more returns 0x20 at once. Seaside Area 1''s DiveMan entry 0x080B5B6C
  (one enemy 0x14B) is such an entry. The 0x40 bit marks entries with condition 2 (byte 7).

  '
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'r6 = [r0+0xC]; byte 7 == 2 -> r7 = 0x40; loop: kind & 0xF0 == 0xF0 ends (returns r7), == 0x10 reads the
    enemy: orr r7, 1 << ((hword >> 12) & 0xF); byte 2 >= 4 -> return 0x20.'
  refs:
  - bn6f/asm/asm29.s:11175
  - pickBattleSettingsEntry_80AA5F4
  reproduce: sed -n '11175,11215p' bn6f/asm/asm29.s
