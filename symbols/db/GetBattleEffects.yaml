name: GetBattleEffects
address: '0x0802D246'
kind: function
status: confirmed
summary: Returns the battle-effects bitmask for the currently active battle by reading it out of the current battle
  state's battle settings.
interface: 'int GetBattleEffects(void) — in: r10 (toolkit pointer), lr; out: r0 (battle-effects bitmask from GetBattleEffectsFromBattleSettings)'
details: 'Thin wrapper/accessor: reads the toolkit''s battle state pointer (r10 + oToolkit_BattleStatePtr), then
  the battle settings pointer from the battle state (oBattleState_BattleSettings), and tail-calls GetBattleEffectsFromBattleSettings
  to extract the effects bitmask. The bitmask presumably encodes active battle modifiers/effects (e.g. Dark Chip
  pollution, custom effects) for the current battle. No local state is touched; clobbers nothing beyond r0 (and
  lr is restored by pop {pc}). r10 (toolkit singleton) must be valid, so only callable in gameplay context where
  the toolkit is initialized.'
