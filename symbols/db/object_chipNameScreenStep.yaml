name: object_chipNameScreenStep
address: '0x080E7644'
kind: function
status: probable
summary: 'Per-frame step function of a battle object that dispatches, by the object''s CurAction, through
  a fixed phase sequence: dim screen, draw chip name, unknown routine, undim screen.'
interface: (r5 = battle object) -> dispatches to off_80E7658[oBattleObject_CurAction]; r0 left as the
  action byte, r1 holds the function pointer at call time; no return value used.
details: Reads oBattleObject_CurAction from the object in r5 and uses it as an index into the 4-entry
  handler table off_80E7658, then performs a Thumb long-call (mov lr, pc; bx r1) to the selected handler.
  The phase 0/3 handlers are object_dimScreen/object_undimScreen, phase 1 is object_drawChipName, so the
  object implements a screen-dim -> chip-name display -> undim presentation. r0 is clobbered with the
  action byte before the call, so callees either receive the action index in r0 or ignore arguments and
  read the object from r5. The caller-side loop advancing CurAction is not known, so which code triggers
  each phase is unknown.
