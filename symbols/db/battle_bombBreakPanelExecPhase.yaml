name: battle_bombBreakPanelExecPhase
address: '0x080C667C'
kind: function
status: probable
summary: 'phase-state dispatcher for the bomb-break-panel battle object: jumps to the handler matching
  the object''s current phase'
interface: (r5 = battle object, phase in [r5,#oBattleObject_CurPhase]) -> calls handler for that phase
  via jump table off_80C6690; r0 passed through to handler (phase byte read)
details: Loads the battle object's current phase byte at [r5,#oBattleObject_CurPhase], uses it to index
  a two-entry jump table at off_80C6690, and tail-dispatches to that handler with `mov lr, pc; bx r1`
  (ARM/Thumb interworking call). Phase 0 resolves to battle_bombBreakPanelPhase and phase 1 to sub_80C66E4,
  so the object's state machine has at least two steps; a phase value above 1 would index out of the table.
  r5 is not set up here, so it is expected to already hold the object pointer from the caller (typical
  battle object update context). The pattern is the standard per-object phase runner used by battle objects.
