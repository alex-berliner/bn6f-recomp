name: battle_objectStepUpOntoElevatedPanel_80C5090
address: '0x080C5090'
kind: function
status: confirmed
summary: Moves a battle object one tile upward (Y and Z += 0x10000) when its Param1 state hits 0x1D, i.e. it finishes
  stepping onto an elevated panel.
interface: void battle_objectStepUpOntoElevatedPanel(BattleObject* obj /* r5 */)
details: 'Takes the battle object in r5 and checks its Param1 byte (offset 4, likely an animation/movement state
  counter). Only when that value equals 0x1D does it do anything: it adds the fixed-point one-tile delta 0x10000
  (1 tile in 16.16 fixed point) to both the object''s Y and Z fields, which in this engine''s coordinate system
  raises the sprite one tile on screen (Z appears to be the visual height/depth layer paired with Y). This matches
  the "step up" animation tail of an object climbing onto an elevated panel (e.g. an up-panel/raised tile): the
  walk animation finishes at state 0x1D and the object is snapped up a row. Uses the tail-call/return pattern via
  pop {pc}; flags NZCV are clobbered by the compare. The trailing byte_80C50AC table (12 bytes, values 0/1) sits
  after the literal pool and looks like unrelated local data (possibly a per-frame or per-param flag table for the
  caller''s state machine), not part of this routine.

  '
