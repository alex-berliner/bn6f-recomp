name: battle_getDirFromDelta
address: '0x0801683C'
kind: function
status: probable
summary: Converts a (dx,dy) delta into a direction/facing enum code (1-5), with an optional horizontal-mirror
  flag.
interface: '(r0 = dx, r1 = dy, r2 = mirrorX flag: nonzero negates dx) -> r0 = direction code: 4 if dx>0,
  3 if dx<0, 2 if dx==0 && dy>0, 1 if dx==0 && dy<0, 5 if dx==0 && dy==0; no flags used'
details: 'The function classifies a movement delta into one of five direction constants: horizontal moves
  dominate (3/4 for negative/positive dx), vertical only when dx is zero (1/2), and the zero vector yields
  5. The r2 argument acts as a side/facing mirror: when set, dx is negated first, so the same screen delta
  maps to the opposite horizontal direction — useful for enemy-team objects whose local ''forward'' is
  flipped. The mirror only affects the x axis, never dy. It is a pure helper with no memory access, called
  per-frame from the move-to-future-panel battle step to pick a facing/animation direction while sliding
  toward the target panel.'
