    of the new object; ldrh/strh around oBattleObject_AllianceAndDirectionFlip — copies the parent's alliance/flip
    halfword into the spawn; mov r2,#1; bl setFieldBattleObject_800F614 — final field/registration setup
    with flag 1; beq locret after the spawn call — early return of 0 when object_spawnType3 fails
