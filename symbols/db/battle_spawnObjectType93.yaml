name: battle_spawnObjectType93
address: '0x080D7A78'
kind: function
status: probable
summary: Wrapper that spawns a type-0x93 battle object via object_spawnType3 (passing through r1-r4 from
  caller), copies r6 and the alliance/flip halfword from the caller's source object into the spawned object,
  and registers it as a field battle object with setFieldBattleObject_800F614.
interface: (r0 = value stored into the new object's DamageAndStaminaDamageCounterDisabler field; r1-r4
  = pass-through spawn args) -> r0 = spawned object pointer, or 0 if spawn failed
details: The wrapper saves the caller's r0 on the stack, sets the spawn type to 0x93 and calls object_spawnType3,
  which consumes r1-r4 unchanged from the caller. If the spawn fails (r0 == 0, checked via the flags from
  the call) it just returns. On success it writes the saved caller value into the new object's DamageAndStaminaDamageCounterDisabler
  field, copies a halfword (AllianceAndDirectionFlip) from the caller-supplied source object into the
  new object, and calls setFieldBattleObject_800F614 with r2=1 to finalize/register the object. Being
  on the recorded 'chips' route with a single nearby caller, it is a shared chip-effect spawn helper rather
  than a per-chip routine.
