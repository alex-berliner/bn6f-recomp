name: ai_loadAttackParams
address: '0x08108124'
kind: function
status: probable
summary: Loads an enemy AI attack's two version-dependent parameter halfwords into the attack state's
  damage field.
interface: (r0 = attack index) -> stores packed (highTable<<16 | lowTable) at [AIDataPtr+0xA0]; r0 clobbered
details: Indexes byte_8108190 and byte_81081D8 with r0*8 and calls battle_aiGetVersionedTableEntry_800FE12
  on each, which selects the halfword by the battle object's AI version. The first result becomes the
  low halfword, the second (zero-extended via lsl 16) the high halfword; they are orr'd together and stored
  as a 32-bit value at oAIAttackVars_Damage (AIDataPtr+0xA0). The 8-byte stride suggests each table slot
  holds several version entries, of which only the version-selected one is read.
