name: battle_initSpriteForObject
address: '0x080BFF88'
kind: function
status: probable
summary: 'Initializes a battle object''s sprite: loads sprite 0x19 with palette 4, makes it shadowless,
  copies the related object''s palette, sets animation 6, updates the sprite, transitions to CUR_STATE_UPDATE,
  and calls sub_80BFFC0 before returning.'
interface: () -> void; r7 preserved; r5 = battle object
details: Loads sprite 0x80/4/0x19 into the object at r5 via sprite_load, then attaches animation data
  and removes the shadow flag. It reads oBattleObject_RelatedObject1Ptr from the object, fetches that
  object's palette with sprite_getPalette, and applies it to itself with sprite_setPalette, so this object
  visually matches its related object's palette. It selects animation 6, runs a sprite update, sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_UPDATE, and tail-calls sub_80BFFC0 before returning.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_load called with constants r0=0x80, r1=4, r2=0x19, so sprite id and base palette are
    hard-coded; ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]; bl sprite_getPalette; bl sprite_setPalette
    — palette is copied from a linked object; bl sprite_noShadow then mov r0,#6; bl sprite_setAnimation
    followed by sprite_loadAnimationData and sprite_update; mov r0,#CUR_STATE_UPDATE; str into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    hands the object to the per-frame update state; Callee summaries (sprite_load/getPalette/setPalette/setAnimation/noShadow)
    each match one asm block
  refs:
  - bn6f/asm/asm31.s:17194
  - 0x08002D8C sprite_getPalette
  - 0x080026E4 sprite_load
  - 0x080026A4 sprite_loadAnimationData
  reproduce: python3 tools/asmcat.py 0x080BFF88
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code uses `bl sub_80BFFC0` followed by `pop {r7,pc}`, which is a regular call-and-return, not
    a tail-call; the proposal''s ''tail-calls'' claim is wrong. Everything else checks out: sprite_load(0x80,4,0x19),
    sprite_noShadow, reading oBattleObject_RelatedObject1Ptr into sprite_getPalette then sprite_setPalette,
    sprite_setAnimation(6), a second sprite_loadAnimationData, sprite_update, and writing CUR_STATE_UPDATE
    all match. The name slightly overemphasizes the palette-copy from the related object; the primary
    purpose is full sprite initialization for a battle object.; run wf investigate investigate-20261018-155607;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
