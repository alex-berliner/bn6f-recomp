name: sub_813236C
address: '0x0813236C'
kind: function
status: confirmed
summary: Copies a 16-bit value looked up from a small table using a u8 field index into a destination struct.
interface: void sub_813236C(void *dst /* r2 */, void *src /* r5 */);
details: 'Reads a u8 index from src+0x12 (r5+0x12), doubles it to form a u16 offset,

  and looks up the corresponding 16-bit entry in the 4-entry table at byte_813237C.

  The looked-up u16 is then stored at dst+0xa (r2+0xa). The table at byte_813237C

  contains 8 bytes laid out as u16s: 0x0100, 0x0110 (entries: 0x0001, 0x0010, 0x0001).

  Likely a small state/flag remapping helper used by callers that need to translate

  a one-byte enum into a u16 field on a destination object.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
