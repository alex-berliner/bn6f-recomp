name: bg_copyTilesIfRequested
address: '0x0802BA24'
kind: function
status: probable
summary: 'Conditionally performs a pending background tile copy: if the flag byte at 0x2036667 is set,
  falls through to CopyBackgroundTiles, otherwise does nothing.'
interface: '(r0-r3 = pass-through args for CopyBackgroundTiles: i, j, which_tile_block_32x32, tile_ids*,
  plus stack args j_size, i_size) -> r0 = undefined; calls CopyBackgroundTiles only when byte_2036667
  != 0'
details: The function is a guard wrapper around CopyBackgroundTiles. It loads word_2036660, reads the
  byte at offset +7 (byte_2036667), and only if that byte is nonzero does it branch to the call; r0-r3
  are never touched, so all six CopyBackgroundTiles arguments (i, j, tile-block index, tile_ids pointer,
  and the two sizes) must be prepared by the caller and pass straight through, including any stack arguments.
  The flag byte therefore acts as a 'tile copy pending/enabled' switch stored in the work area at 0x2036660,
  letting callers stage arguments and defer or cancel the actual VRAM/background update.
