name: sprite_setUnk2cToE000000_80A93D8
address: '0x080A93D8'
kind: function
status: confirmed
summary: Trivial sprite helper that writes the fixed value 0xE000000 into the sprite record's field 0x2C
  for the object passed in r5.
interface: void sub_80A93D8(r5 = object/sprite state pointer) -> void
details: 'A one-call thunk: it loads the constant 0xE000000 and tail-calls sprite_setUnk0x2c, which takes
  the value in r0 and the object state pointer in r5. The target is a sprite subsystem setter for the
  field at offset 0x2C of the sprite record; this wrapper hardcodes that field to 0xE000000 (0xE0 in the
  top byte, likely a packed field such as a palette/alpha/OAM-style attribute rather than a plain counter).
  The caller''s r5 is passed straight through, so callers invoke this with the object pointer already
  in r5 rather than r0. Flags are clobbered (nzcv) via the callee; lr is used for the call.

  '
