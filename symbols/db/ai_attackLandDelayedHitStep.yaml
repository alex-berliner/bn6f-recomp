name: ai_attackLandDelayedHitStep
address: '0x0802D738'
kind: function
status: probable
summary: AI attack step that finalizes the object's landing panel on first call (commits FuturePanelX/Y,
  releases panel reserve, recomputes coords/collision, plays anim 4, clears related pointers, sets collision
  region 1) and then after a 4-frame delay activates the hit element.
interface: (r5 = battle object ptr, r7 = AI attack vars ptr) -> r0 = 1 (object_setCollisionRegion arg);
  updates object state fields.
details: 'On the first call (AttackElement==0) it finalizes the attack''s landing: commits FuturePanelX/Y
  to the object''s panel coords, releases the reserved panel, recomputes coordinates/Z/collision panels,
  sets DirectionFlip from the emerge-flip check, refreshes sprite/arm, clears collision flag bits 0x1C41
  (Flags1) and 0x10 (Flags2), plays animation 4, clears RelatedObject1Ptr and the AI data''s TempAttackObjectPtr,
  sets collision region 1, then loads StepTimer=4 and sets AttackElement=4 so landing runs only once.
  On later calls it just decrements StepTimer each frame; when it reaches 0 it writes HitElement=4, activating
  the hit after the 4-frame delay.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: First-call branch commits FuturePanelX/Y and calls object_removePanelReserve + setCoordinatesFromPanels
    (landing); Guards via ldrb [r7,#oAIAttackVars_AttackElement]; tst; bne skip-landing, and writes AttackElement=4
    to lock the branch; StepTimer=4 then per-frame decrement; on expiry stores 4 to oAIAttackVars_HitElement
    (delayed hit activation); Callee set battleObject_refreshSpriteAndArm_800F2C6 and battle_checkEmergeDirectionFlip
    match panel-emerge visual setup; Clears TempAttackObjectPtr in AIData and RelatedObject1Ptr, detaching
    the attack from its launcher object
  refs:
  - bn6f/asm/asm03_0.s:15923
  - 0x0800F2C6 battleObject_refreshSpriteAndArm_800F2C6
  - 0x0800F46C battle_checkEmergeDirectionFlip
  - 0x0801A15C object_clearFlag
  reproduce: python3 tools/asmcat.py 0x0802D738
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is mostly accurate but the interface description is wrong: `object_setCollisionRegion`
    is called with `r0=#1` (immediate 1), but `r0` is set to 1 by `mov r0,#1` and consumed in the call
    — the callee returns nothing, not r0=1. Also the function is called from unknown callers (no callers
    known), so the ''later calls'' path may never run in practice. The summary''s ''HitElement=4'' is
    correct per the final `strh r0,[r7,#oAIAttackVars_HitElement]` writing 4 when StepTimer hits 0.; run
    wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
