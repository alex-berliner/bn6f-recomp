name: aiAttack_stepElementTimer
address: '0x081043C8'
kind: function
status: probable
summary: 'AI attack step: if no element armed, set AttackElement=4 and seed StepTimer from AttackBoost2;
  otherwise tick StepTimer down and write 0xC to HitElement on expiry (no deliberate return value).'
interface: (r0 = ignored/overwritten) -> r0 = 0 if the timer expired (hit fired), nonzero otherwise; no
  flags relied on
details: Operates on an object struct at r7 using oAIAttackVars fields. If AttackElement is 0 (none),
  it sets AttackElement = 4, copies AttackBoost2 into StepTimer as the countdown length, and returns.
  Otherwise it decrements the 16-bit StepTimer; while it stays >0 it returns, and on expiry it writes
  HitElement = 0xC and returns 0. The return value is just the final timer/count state, not a deliberate
  result.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne branches between arm and countdown paths;
    strb #4 into AttackElement and strh AttackBoost2 into StepTimer arms the attack; ldrh StepTimer /
    sub #1 / bgt keeps counting while timer positive; on expiry strh #0xc into oAIAttackVars_HitElement
    fires the hit; no callees and no known callers; only oAIAttackVars fields are touched'
  refs:
  - bn6f/asm/asm31.s:165767
  reproduce: python3 tools/asmcat.py 0x081043C8
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s logic: if AttackElement==0 it sets it to 4, copies AttackBoost2
    into StepTimer (strh, not StepTimer used as countdown initially); otherwise it decrements StepTimer
    and on <=0 writes 0xc to HitElement. Naming nit: ''stepElementTimer'' is fine, but the return is the
    raw StepTimer after decrement (not ''final timer/count state''), and the summary''s ''returns 0 if
    timer expired'' is backwards — it returns the decremented value which is 0 on expiry. Otherwise accurate.;
    run wf investigate investigate-20261019-052112; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
