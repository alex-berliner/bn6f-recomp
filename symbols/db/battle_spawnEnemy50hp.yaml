name: battle_spawnEnemy50hp
address: '0x080D46D8'
kind: function
status: probable
summary: 'Initializes a battle enemy/object: loads its sprite and animation, sets its name/HP/element
  and collision data, then switches it to the update state.'
interface: (r5 = battle object header, implicit) -> r0 = destroyed; sets oBattleObject_CurState = CUR_STATE_UPDATE
  on success
details: This is a spawn/init routine for a battle object reached via r5. It sets the object-flags bit
  1, loads sprite resource (0x80, 0xc, 0x34), plays animation 1 (also copied into the anim-copy field),
  loads animation data, updates the sprite, and applies the object's effective flip from object_getFlip.
  It writes name ID 0xE2, HP and MaxHP both 0x32 (50), element 0 (none), and a 0x1E0 (480-frame) timer.
  It allocates a collision-data slot via object_createCollisionData; if allocation fails it frees the
  object and returns. On success it configures the collision box (0xc, 0xd, 1), clears its collision region,
  sets hit-effect type 0, runs object_presentCollisionData for the first frame, sets the state to CUR_STATE_UPDATE,
  and calls sub_80D4754 (presumably the update/state handler).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sprite_load with r0=0x80, r1=0xc, r2=0x34 followed by sprite_hasShadow/setAnimation/loadAnimationData/update/setFlip
    is standard battle-object sprite bring-up; strh 0xE2 -> oBattleObject_NameID and 0x32 -> both oBattleObject_HP
    and oBattleObject_MaxHP identify it as an enemy initializer; bl object_createCollisionData; tst r0,r0;
    bne ... else bl object_freeMemory is the standard 'abort spawn if no collision slot' pattern; mov
    r0,#CUR_STATE_UPDATE; strb [r5,#oBattleObject_CurState]; bl sub_80D4754 hands the object to its per-frame
    update handler; Callees object_getFlip/object_setPanelsFromCoordinates/object_setCollisionHitEffect
    are all battle-object helpers
