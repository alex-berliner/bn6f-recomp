name: battle_waitCrossNetReadyStep
address: '0x08008B2E'
kind: function
status: probable
summary: 'Battle-object state step: starts effect kind 0x58 once, then waits until the cross-net (linked)
  battle is ready, setting a 0xC state/timer while waiting.'
interface: (r0 = ? unused; r5 = object/eStruct-like state block) -> r0 = clobbered by calls; updates r5+3
  (state byte), r5+8 halfword, r5+2 halfword
details: Reads the state byte at [r5,#3]; when it is 0 it calls battle_dispatchKindEffect with kind 0x58
  (allocating the effect via the guarded dispatch path), stores 0 to halfword [r5,#8], and writes state
  4 to [r5,#3]. Every invocation then calls comm_checkCrossNetBattleReady_801E754; if it returns 0 (linked
  partner not in expected mode yet), halfword [r5,#2] is set to 0xC — likely a retry delay or state code
  — and the routine returns. If ready, it returns without changing state, letting the caller proceed.
  r5 is preserved, so this is a step handler operating on the caller's object struct, not a standalone
  routine.
