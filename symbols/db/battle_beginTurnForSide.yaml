name: battle_beginTurnForSide
address: '0x08014216'
kind: function
status: probable
summary: 'Per-side turn-start: clears an AIData flag, zeroes 12 halfwords of the side''s hand region,
  optionally frees the opposing player from a 6-slot table when battle-effects bit 0x8 matches, then dispatches
  via a 12-entry jump table keyed by NaviStats byte 0x29.'
interface: (r5 = battle object whose alliance byte selects the side) -> r0 = result of dispatched handler;
  flags clobbered
details: 'Called with the battle object in r5 (reads oBattleObject_Alliance from it). It first clears
  bit 0x20 of AIData+0x48 via ClearAIDataUnk0x48Flag, then zeroes 0xC halfwords at the side''s hand slot
  + 0x26 (the hand array at 0x20349C0, 0x50-byte strides), wiping some per-turn hand region. If GetBattleEffects
  has bit 0x8 set, it XORs the alliance value against a battle-state byte via battle_networkInvert; when
  they match, it finds the opposing player object (alliance^1) and frees its matching entry in a six-entry
  slot table via releaseSlotByValue_801DC36. Finally it reads NaviStats byte 0x29 for this side, doubles-as-index
  (lsl #2) into a 12-entry jump table at off_801426C, and dispatches to it with lr=pc — only entry 0 (sub_801429C)
  is non-trivial, all others are nullsubs.'
