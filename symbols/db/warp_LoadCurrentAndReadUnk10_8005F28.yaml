name: warp_LoadCurrentAndReadUnk10_8005F28
address: '0x08005F28'
kind: function
status: confirmed
summary: Loads the current area's warp helper struct from the toolkit and returns it plus its byte at offset 0x10,
  setting flags on that byte so callers can test it for zero.
interface: int warp_LoadCurrentAndReadUnk10_ADDRESS(Toolkit* toolkit /* r10 */, out Warp2011bb0** warpOut /* r0
  */, out u8* unk10 /* r1 */) /* sets NZCV on (unk10 - 0) */
details: 'Reads the warp struct pointer from the toolkit at oToolkit_Warp2011bb0_Ptr (r10 is the toolkit base, not
  a pointer to it), then reads the u8 at oWarp2011bb0_Unk_10 of that struct. r0 returns the warp struct pointer,
  r1 returns the byte, and the compare against 0 leaves NZCV set so a caller can branch directly on the byte being
  zero/nonzero. Tail-call style: it only does mov pc, lr and never touches the stack, so lr must hold the true return
  address (callers cannot use a plain BL chain without care). Quirk: the pointer is dereferenced before the byte
  check with no null guard, so the toolkit field must already be initialized when this runs.'
