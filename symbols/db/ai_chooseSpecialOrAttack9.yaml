name: ai_chooseSpecialOrAttack9
address: '0x08110ED8'
kind: function
status: probable
summary: 'AI tick for an enemy/boss: if a check passes, runs a special action and switches AI script state
  to 4, otherwise queues attack 9 with an 80-frame step timer.'
interface: (r6 = enemy object, r7 = its AI attack vars) -> sets r6->AIState_ScriptId = 4 or r7->StepTimer
  = 0x50 with attack 9; r0 = condition result from sub_8110F8C
details: The routine first calls sub_8110F8C, whose return value acts as a boolean condition (tst r0,r0
  / beq). On the true path it calls sub_8111030 (likely starting a special move or spawning something)
  and writes 4 into the object's AI state/script field at r6+oAIState_ScriptId. On the false path it stores
  0x50 into r7+oAIAttackVars_StepTimer and calls object_setAttack0 with r0=9, arming attack id 9 with
  an 80-frame delay. It is a standard per-frame AI state handler reached from the recorded beastsp/battlesweep
  routes, so the condition and special action likely relate to that boss's behavior.
