name: logoScreen_loadLogoTiles_803D2B8
address: '0x0803D2B8'
kind: function
status: confirmed
summary: Loads and arranges the tiles, tilemaps, and palettes for the Capcom logo and license-message intro screen.
interface: void logoScreen_loadLogoTiles_803D2B8(void) // preserves r4-r7
details: "Initializes the title/intro \"Capcom logo\" screen by clearing VRAM and the\nGFX scratch buffer (zeroFillVRAM,\
  \ ZeroFillGFX30025c0), then walking the\ninitRefs803D2F0 table via decompAndCopyData. That table drives the LZ77\n\
  decompression/transfer of the Capcom logo tileset, tilemap, both palettes\n(Capcom logo + license message), and\
  \ the license-message tileset into\ntheir respective VRAM/palette destinations:\n\n  0x00 CompCapcomLogoTileset\
  \   -> 0x06000020 (decomp to eDecompBuffer2014A00)\n  0x01 CompCapcomLogoTilemap   -> NULL     (no secondary dest)\n\
  \  0x02 CapcomLogoPalette       -> palette_3001960       (0x20 bytes; 0x10 -> glitchy blue palette)\n  0x03 CapcomLogoLicenseTileset->\
  \ 0x06001000 (0x1C0 bytes; 0xC0 -> only \"LICENSE\" portion loads)\n  0x04 CapcomLogoLicensePalette-> palette_3001980\
  \       (0x20 bytes; 0x05 -> red shadow on license text)\n  0x05 NULL terminator\n\nAfter the table is processed,\
  \ the Capcom logo tilemap is blitted into BG\ntile block 1 at (j=0, i=0, 0x20x0x14 tiles) using the decompressed\
  \ tile-id\ntable at eDecompBuffer2013A00+4, then the license-message tilemap\n(CapcomLogoLicenseTilemap_86C41B4)\
  \ is blitted into tile block 2 at\n(j=8, i=0x11, 0xEx1 tiles). Comments in the source note that disabling\neither\
  \ CopyBackgroundTiles call removes the corresponding on-screen\nelement (\"Capcom\" wordmark or license text).\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
