name: ow_freeMapObjectTrio
address: '0x08089D0E'
kind: function
status: probable
summary: Frees up to three overworld map objects whose pointers are stored consecutively in a caller-provided
  array.
interface: (r7 = base of array of 3 object pointers) -> r0 = last FreeOverworldMapObject result; frees
  each non-null entry, leaving the array contents unchanged
details: Iterates i = 0..2 over 4-byte slots at [r7], [r7+4], [r7+8]; for each nonzero pointer it calls
  FreeOverworldMapObject, which clears the object's active bit in the global allocation bitfield, marks
  its slot free, and unmarks it in the sprite system. r7 is used as an implicit argument rather than r0,
  and r4/r5 are scratch counters/holders; the pointer slots themselves are not nulled after freeing, so
  the caller must clear them to avoid double frees. The fixed count of 3 suggests the owner struct embeds
  exactly three sub-object pointers (e.g. an object with up to three attached map entities).
