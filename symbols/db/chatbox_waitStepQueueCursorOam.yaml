name: chatbox_waitStepQueueCursorOam
address: '0x0803BBA4'
kind: function
status: probable
summary: Queues one OAM entry for the chatbox's blinking wait-cursor, cycling its tile through three animation
  frames on an 18-frame loop.
interface: (r0 = visibility/done flag, r1 = base id/index, r2 = frame step amount, r3/r5 = cursor state
  struct) -> r0 = next frame counter stored at [r5+7]; no meaningful return value
details: The function builds a packed OAM attribute pair 0x40001000 | (r0<<16) | r1 and queues it through
  sprite_queueOamEntry with attribute argument 0x0800 | tableValue, where tableValue comes from the 18-entry
  halfword table byte_803BBDC indexed by the state byte at [r5+7] (doubled). The table holds values 1,
  5 and 9 — tile indices three frames apart — six frames each, so the sprite's tile steps 1→5→9 across
  an 18-frame cycle. The state byte is advanced by r2 (saved in r4) and wraps to 0 once it reaches 0x12
  (18), giving a continuous looping animation. r0 appears to be a show/hide or done flag folded into the
  high attribute halfword, consistent with the caller passing a done/not-done flag.
