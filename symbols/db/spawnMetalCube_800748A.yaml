name: spawnMetalCube_800748A
address: '0x0800748A'
kind: function
status: confirmed
summary: Conditionally spawns a MetalCube object into the EnemySetup's spawn slot table when the target panel is
  a metal-cube hole.
interface: void spawnMetalCube_800748A(u32 spawnSlotTable /* r5 */, const EnemySetup* setup /* r6 */); // returns
  void; clobbers r0,r1,r2,r3,lr,nzcv; preserves r4,r5,r6,r7
details: 'R5 points at a spawn-slot table whose primary slot lives at offset 0xB8 and secondary at 0xBC. R6 points
  at an EnemySetup whose byte at +1 is a packed coordinate (high nibble = column, low 3 bits = row). The routine
  first checks the primary slot: if it is empty, R7 is set to it; if it is occupied, the secondary slot is checked,
  and the function returns when both are filled, otherwise R7 advances to the empty secondary slot. With R7 = the
  slot pointer, it then reads the (col, row) from the EnemySetup, calls object_getPanelParameters to retrieve the
  panel parameter, and tests bit 5 of that word; this bit is the "metal cube hole" tile flag. The (row, col) are
  repacked into R0/R1 (R0 = row, R1 = col, per object_getPanelParameters convention), R2 is cleared, R6 is forced
  to 0x64 (likely a MetalCube object ID), and sub_80D85F0 is called to allocate/construct the cube. The returned
  handle is stored into the slot pointed at by R7. The function effectively says "if there is a free slot and the
  EnemySetup''s panel is a metal-cube hole, spawn a MetalCube there."


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
