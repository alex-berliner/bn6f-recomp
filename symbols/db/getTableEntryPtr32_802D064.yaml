name: getTableEntryPtr32_802D064
address: '0x0802D064'
kind: function
status: confirmed
summary: Returns the address of one 0x20-byte entry (selected by index) within the IWRAM array at byte_203C4A0.
interface: 'struct20* getTableEntryPtr32_802D064(u32 index); // in: r0 = entry index, lr = return address; out:
  r0 = &base[index*0x20]; flags NZCV set from the final address addition'
details: 'Pure address-of helper: multiplies r0 (an entry index) by 0x20 and adds the

  result to the base address byte_203C4A0 (an IWRAM array of 0x20-byte records),

  returning the pointer to that record in r0. It touches no memory and writes

  only r0/r1, preserving nothing else and needing no stack. Notable quirk: in

  Thumb the low-register "add r0, r0, r1" is always ADDS, so this helper sets

  N/Z/C/V from the pointer arithmetic itself (N/Z from the computed address,

  C from carry-out, V from signed overflow of product+base) — callers evidently

  may branch on those flags after the call, so any refactor must keep the flags

  (e.g. an ARM-mode plain ADD would break them).

  '
