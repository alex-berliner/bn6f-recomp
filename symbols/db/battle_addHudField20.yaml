summary: Adds a signed delta (r0) to the halfword at eStruct2035280+0x20, saturating the result to a maximum
  of 0x4000 before storing it back.
interface: (r0 = signed delta to add) -> writes gauge halfword at eStruct2035280+0x20; no return value,
  flags from cmp set but unused by caller
details: 'Loads the battle HUD state pointer (eStruct2035280) and reads the halfword at +0x20 (word_20352A0).
  It adds the caller-supplied signed value in r0, and if the result exceeds 0x4000 it saturates to 0x4000
  before storing back. The 0x4000 ceiling matches a gauge that fills in fixed-point steps; the field sits
  next to the HP box data (+0x24 shown HP) in the HUD struct. Only one caller is known: battle_dispatchNextPhase,
  the per-frame turn-state machine, which would call it each frame (or on gauge-related phase transitions)
  to advance or adjust the custom gauge toward full.'
