name: MrWeatherComp_SpawnMapObjectsForMap
address: '0x0806A1DE'
kind: function
previous_names: []
status: probable
summary: 'Mr. Weather comp (map group 0x83): spawns the current map''s map objects by passing its spawn list (off_806A1F8[MapNumber])
  to SpawnObjectsFromList.'
interface: (r10 = toolkit) -> r0 = the number of objects spawned (SpawnObjectsFromList's result); no register arguments;
  r4-r7 preserved
details: "Body (maps/MrWeatherComp/loader.s:204-215): r0 = GameState.MapNumber (through oToolkit_GameStatePtr),\n\
  r0 = off_806A1F8[MapNumber], bl SpawnObjectsFromList, return. off_806A1F8 has one list per comp map\n(MR_WEATHER_COMP_NUM_MAPS\
  \ = 3), each a map_object_spawn_data_struct list (type 5 = OBJECT_SPAWN_TYPE_OVERWORLD_MAP,\nso SpawnOverworldMapObject)\
  \ ended by a 0xFF word (maps/MrWeatherComp/data.s:2-37):\n  map 0 byte_806A204: Index 0x03, ObjectID 0x1D at (-0x2A,\
  \ -0xB6, -0xC) px\n  map 1 byte_806A21C: Index 0x03, ObjectID 0x1E at (0x182, 0xE, 0) px\n  map 2 byte_806A234:\
  \ Index 0x03, ObjectID 0x1F at (0x1C2, 0xE, 0) px; Index 0x00, ObjectID 0x2E at (0x1D4, -0x32, -0x40) px\n(Index\
  \ is the map object's header byte +1, which picks its update routine in OverworldMapObjectUpdateJumptable;\nObjectID\
  \ goes to +4.) The Weather comp's tornadoes (type 0x1A) and orbs (0x1B) are not in these lists.\nTwo callers:\
  \ MrWeatherComp_EnterMapGroup calls it directly when a comp map is entered (loader.s:35), and\nmapObject_spawnMapObjectsForMap\
  \ reaches it through InternetSpawnMapObjectJumptable[0x83 - 0x80] (the respawn\npath a script command and sub_80893F4\
  \ use). vidsync's BN6F_SYMBOLS.md lists it (level A) as the example of\nthat table's entries; vidsync never reads\
  \ or writes anything of it.\n"
