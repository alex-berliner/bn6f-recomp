  reproduce: 'awk ''/^MrWeatherComp_SpawnMapObjectsForMap:/{f=1} f{print FILENAME":"FNR": "$0} f&&/thumb_func_end/{exit}''
    bn6f/maps/MrWeatherComp/loader.s

    sed -n ''216,221p'' bn6f/maps/MrWeatherComp/loader.s; sed -n ''1,37p'' bn6f/maps/MrWeatherComp/data.s

