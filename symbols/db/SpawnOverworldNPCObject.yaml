name: SpawnOverworldNPCObject
address: '0x080045C0'
kind: function
status: confirmed
summary: Claims the first free slot in the overworld NPC object table and initialises it with the caller's index,
  position, and movement word.
interface: void SpawnOverworldNPCObject(u32 r0_index, u32 r1_x, u32 r2_y, u32 r3_z, u32 r4_movement); r5 = new object
  address (0 if full); r0-r4 preserved; C/V clobbered (Z set on full table, cleared on success).
details: 'Walks the 32-bit bitfield `eActiveOverworldNPCObjectsBitfield` from the top bit down,

  using `0x80000000` as slot 0, advancing `r5` by `oOverworldNPCObject_Size` each step

  until it finds a free bit. The walk range is bounded by `byte_2006530`, the

  one-past-the-last entry of `eOverworldNPCObjects`. If `r5` reaches `byte_2006530`

  the table is full and the function returns 0 (r5 cleared) without touching the

  caller''s registers.

  On a free slot it sets the bit, then calls `ZeroFillByWord` to wipe

  `[newObj + 0x06..+0xA2)` (0x9C bytes from

  `oOverworldNPCObject_MovementSpeed_MovementTimer_Undetected_06_Unk_07` onward), writes

  `OBJECT_FLAG_ACTIVE | OBJECT_FLAG_STOP_SPRITE_UPDATE` into byte 0, the caller''s

  index at `oOverworldNPCObject_Index`, x at `oOverworldNPCObject_X`, y at

  `oOverworldNPCObject_Y`, z at `oOverworldNPCObject_Z`, and the movement word at

  `oOverworldNPCObject_MovementSpeed_MovementTimer_Undetected_06_Unk_07`. r5

  (new object address) and all inputs (r0-r4) are returned to the caller.


  Register form kept (C call semantics could not work): (r0: u32 index, r1: u32 x, r2: u32 y, r3: u32 z, r4: u32
  movement) -> (r5: *mut OverworldNPCObject)'
