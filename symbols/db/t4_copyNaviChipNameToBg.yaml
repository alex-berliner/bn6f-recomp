    wf investigate investigate-20261021-004112'
open_questions:
- Why r0=2 is passed when it is only the start j-offset for CopyBackgroundTiles — is there a meaning inherited
  from the drawNaviChipNameTiles tile-grid convention?
- Which BG layer (which of the four BGs) the resulting tilemap belongs to, not inferable from this routine
  alone
