name: t4_copyNaviChipNameToBg
address: '0x08137DA4'
kind: function
status: probable
summary: copies a prepared navi/chip name tile-id buffer into BG tile block 2 at offset (2,4)
interface: (r0 = src_tile_j_offset_or_unused=2, r1 = dst_tile_i_offset=4, r2 = tile_ids_ptr) ->
details: 'Wraps CopyBackgroundTiles. The caller first fills byte_2017A00 with zeros, then runs t4_drawNaviChipNameTiles
  to bake the navi''s chip-name character tiles into that buffer using unk_201CF00 as the tile-data source,
  then forwards the buffer to this routine. Hardcoded: tile block 2, j_size=8 (columns), i_size=0xe (rows).
  CopyBackgroundTiles only uses r0/r1 as the BG tile-grid insertion offset, so the fact the caller''s
  r0=2 is forwarded is incidental — only r1=4 is meaningful as the destination tile row. Likely unused
  r0 parameter mirrors the project''s drawNaviChipNameTiles convention; this is effectively a helper that
  writes the tiles into BG.'
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: callee CopyBackgroundTiles uses r3 as *tile_ids -> fed from the caller's zero-filled/pre-populated
    byte_2017A00 buffer; call site at 0x08137D40 immediately follows t4_drawNaviChipNameTiles writing
    name tiles into byte_2017A00; hardcoded tile block 2 and dimensions 8x0xe match a left-side navi-name
    plate (8 columns wide, 14 rows tall) at vertical offset 4; caller's r1=4 forwarded as the i (destination
    tile-row) start for CopyBackgroundTiles
