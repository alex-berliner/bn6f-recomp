name: sub_811B48C
address: '0x0811B48C'
kind: function
status: hypothesis
summary: Looks up an entry by id in the table at 0x2008450 and sets its state byte to 0x23 when a flag is set, otherwise
  to 1.
interface: u32 sub_811B48C(u32 flag /*r0*/, u32 tableId /*r1*/); /* returns the lookup result (nonzero if the entry
  exists) in r0; also leaves the original flag in r2 for the caller; clobbers r2, NZCV */
details: Saves the flag argument (r0) on the stack, then calls getStructFrom2008450 with the table id in r0. That
  helper leaves the found entry's pointer in r0 and the address of a single byte field of that entry in r1. If the
  lookup failed (r0 == 0), the function does nothing and just returns. If it succeeded, the byte at r1 is written
  with 0x23 when the incoming flag was nonzero, or 1 when it was zero. Before the store the original flag is copied
  into r2, so callers can still see both the lookup result (r0) and the flag (r2) on return. The table at 0x2008450
  and the meaning of the magic value 0x23 (versus 1) are not identified from this function alone; the pattern of
  a per-id byte toggled between a "special" value and 1 suggests an object/NPC state or visibility-style field,
  but that is inference, not evidence.
