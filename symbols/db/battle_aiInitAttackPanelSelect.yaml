- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] after bl battle_getAiDifficultyTier_800FE36 stores
    the tier in the AI attack state struct; bl battle_findPlayer with alliance eor 1 and str into oAIAttackVars_TargetObjectPtr
    targets the opposing player; ldr r0,=sub_81038A4+1; str into oAIAttackVars_PanelChooseCallback installs
    the per-attack panel chooser; mov r0,#0xa; bl object_setAttack0 launches the attack as the final step;
