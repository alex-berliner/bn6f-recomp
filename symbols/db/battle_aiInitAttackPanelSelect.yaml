name: battle_aiInitAttackPanelSelect
address: '0x08101652'
kind: function
status: probable
summary: 'Initializes one AI-driven enemy attack state: per-difficulty timing, a panel-choose callback,
  and the opposing player as target.'
interface: (r7 = AI attack state struct, r5 = attacker BattleObject) -> r0 = clobbered; initializes oAIAttackVars
  fields and starts attack 0xA
details: Sets oAIAttackVars_AttackBoost2 to 4 and stores the enemy's AI difficulty tier (battle_getAiDifficultyTier)
  into oAIAttackVars_AiDifficultyTier, then clears the InitFlag. Calls sub_810176E with 1 (likely phase/mode
  select), then sub_81014C0 and sub_81014D4 whose results are stored as AttackDuration and TimerOrCycles
  (difficulty-dependent timing). Installs sub_81038A4 as the PanelChooseCallback, resolves the target
  by calling battle_findPlayer with the attacker's Alliance XOR 1 (i.e., the opposing player object),
  and finally invokes object_setAttack0 with id 0xA to kick off the attack.
