name: battle_subtractLookupValue
address: '0x0802B5B0'
kind: function
status: probable
summary: Looks up a value from a double-indexed table and subtracts it from a byte field at r5+0x12 of
  a struct.
interface: (r0 = index into unk_2031000, r5 = struct pointer) -> r5+0x12 decremented by table byte; flags
  from strb
details: The index r0 is doubled and used to read a halfword from the unk_2031000 array. That halfword
  is shifted left by 3 (×8) and 4 is added, so it is an offset into the byte_802B5FC table, whose entries
  appear to be 8 bytes apart with a halfword at offset +4 — i.e. unk_2031000 holds an intermediate index/ID
  and byte_802B5FC is the real data table. The halfword read there is truncated to a byte and subtracted
  from the byte at r5+0x12, which is written back. No other registers or memory are touched and no branches
  occur; r5 must be set up by the caller. Without knowing what unk_2031000, byte_802B5FC, or the r5 struct
  represent, the game meaning of the subtraction (HP, gauge, counter, etc.) is not established.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r1,r0] with r1=unk_2031000 and r0*2: array of halfword indices; lsl r0,#3; add #4;
    ldrh from byte_802B5FC: 8-byte entries, halfword at +4; ldrb r1,[r5,#0x12]; sub r1,r1,r0; strb r1,[r5,#0x12]:
    subtracts lookup value from struct byte 0x12; leaf function, mov pc,lr, only two literal pools — pure
    lookup-and-subtract helper'
