name: object_initCollisionSelfDamage
address: '0x080FFA22'
kind: function
status: confirmed
summary: 'Initialises a battle object''s collision-data block for self-damage: clears flag 0x40, resets internal
  state, sets collision region to 1, then writes the object''s DamageAndStaminaDamageCounterDisabler field (low
  halfword → SelfDamage, low byte → StaminaDamageCounterDisabler) into its CollisionData.'
interface: object_initCollisionSelfDamage(r5 = battleObject, r10 = ?, lr) -> r0 (low16 of damage field) r1 (high16
  of damage field) r2 (CollisionData ptr) r3 r4 r6 r7 flags {n z c v} lr; r4 r6 r7 preserved across the call
details: "Touches the following structures and fields via r5 (battle object) and its CollisionData pointer:\n- oBattleObject_DamageAndStaminaDamageCounterDisabler\
  \ (u32 at r5): a packed field where the low 16 bits hold the self-damage value and the low byte additionally serves\
  \ as the stamina-damage-counter disabler; the high 16 bits are retained in r1.\n- oBattleObject_CollisionDataPtr\
  \ (u32 at r5): pointer to the CollisionData record.\n- oCollisionData_SelfDamage (u16 at colPtr): written from\
  \ low16 of the packed field.\n- oCollisionData_StaminaDamageCounterDisabler (u8 at colPtr): written from low byte\
  \ of low16 (i.e. field & 0xFF).\nInternal sequence:\n1. object_clearFlag(0x40) – clears bit 6 of the object's\
  \ flag byte.\n2. sub_801DC7C(0, 0) – resets an unnamed collision/spawn state; preserves r4 r6 r7.\n3. object_updateCollisionData(r1=1,\
  \ r2=2, r3=3) – updates collision data with mode parameters 1/2/3; modifies r2 r3 r4 r6 r7 and carry/overflow.\n\
  4. object_setCollisionRegion(1) – assigns the object to collision region 1 (likely the active-playfield region).\n\
  The final lsr r1, r1, #16 sets N/Z/C/V on the high-16 portion, which the caller may inspect.\nThe lsl/lsr pair\
  \ on r0 isolates the low halfword without a sign-extension, confirming a pure unsigned split.\nopen_questions:\n\
  \  - \"What does sub_801DC7C actually reset? The name is unknown and its effect on the collision pipeline is not\
  \ traced.\"\n  - \"What is the semantic of the 0x40 flag cleared by object_clearFlag – does it gate a 'self-damage\
  \ disabled' state?\"\n  - \"Are r10 and the exact mode triple (1,2,3) for object_updateCollisionData meaningful\
  \ constants or caller-specific parameters?\"\n"
