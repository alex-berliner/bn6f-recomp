name: battle_objectPlayAnimAndDelay
address: '0x080BF94E'
kind: function
status: probable
summary: 'Battle object phase handler: plays animation 3 for 30 frames, then advances the object to CurAction
  8.'
interface: (r0 unused on entry; r5 = battle object pointer) -> r0 = 0 on completion path; updates oBattleObject_Timer,
  animation, PhaseInitialized, CurAction, CurPhaseAndPhaseInitialized
details: On first invocation (PhaseInitialized == 0) it stores 0x1E (30) into oBattleObject_Timer, calls
  battle_setObjectAnim with r1 = 3 to switch the object's animation to index 3 (which also invalidates
  the animation-copy byte so the anim engine restarts it), and marks the phase initialized with value
  4. On every call it decrements oBattleObject_Timer; while it stays positive the handler returns. When
  the timer reaches 0 it writes 8 into oBattleObject_CurAction and clears oBattleObject_CurPhaseAndPhaseInitialized,
  handing control back to the object's action dispatcher. The trailing .word 0x10032 is data after the
  function, not code.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized]; bne loc_80BF966 — one-time init guarded by the
    phase-initialized flag; mov r1,#3; bl battle_setObjectAnim — switches object to animation 3 during
    init; mov r0,#0x1e; strh r0,[r5,#oBattleObject_Timer] — arms a 30-frame countdown; ldrh r0,[r5,#oBattleObject_Timer];
    sub r0,#1; bgt locret — waits until timer expires; mov r0,#8; strb r0,[r5,#oBattleObject_CurAction];
    mov r0,#0; strh ... CurPhaseAndPhaseInitialized — advances to next action when done
