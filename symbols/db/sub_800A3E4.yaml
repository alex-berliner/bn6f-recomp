name: sub_800A3E4
address: '0x0800A3E4'
kind: function
previous_names: []
status: probable
summary: 'Loads the battle folder into eBattleFolder and triggers shuffleFolder_800A570: source is the saved folder
  (oToolkit_S_Chip_2002178_Ptr = 0x02002178), a battle-mode table (dword_802137C) or unk_2039AA0 with effects bit
  0x200000; Navi offset = GetCurPETNaviStatsByte(0x2D) * 0x3C; tag pairs land at +0x38/+0x3A.'
details: 'Body (asm00_1.s:16049-16180): picks the source folder (GetBattleEffects 0x200000 -> unk_2039AA0; else
  dword_802137C[GetBattleMode] if nonzero; else oToolkit_S_Chip_2002178_Ptr), adds GetCurPETNaviStatsByte(0x2D)
  * 0x3C when the source is the saved folder. With effects bit 0x80 it looks up the two tag chips (pet_getCurNaviChainedLookup_800A4E0
  / pet_getCurNaviStatusPair_800A506) and sets BattleState +0x17 / +0x44; the 30-halfword copy skips those two slots
  (they are written to eBattleFolder +0x38 / +0x3A instead). Then encryption_decryptPackTable30_800a7ea (unless
  the 0x200000 source), and with effects bit 0x80: shuffleFolder_800A570(eBattleFolder, BattleState+0x17, BattleState+0x44).
  Called from battle_RevealFieldColumnsStep_80079F0 on the frame after the seed restore.'
