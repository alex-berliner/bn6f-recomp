name: battleObject_initBeastOut_8117130
address: '0x08117130'
kind: function
status: confirmed
summary: 'Initializes the Beast Out sprite: selects the beast template, configures animation, palette, priority,
  and slot linkage, then triggers the transformation animation.'
interface: 'void battleObject_initBeastOutSprite(u32 *r5 /*in out: sprite ptr*/); /* out: r2 = anim slot idx, r3
  = anim sub-frame, r5 = possibly reassigned sprite ptr */'
details: 'r5 points to a battle-object/sprite record. The routine:

  1. Writes a visibility/state byte at [r5+0]: 0x23 if bit 1 of [r5+6] (status flags) is set, otherwise 1.

  2. Indexes a 2-entry template table off_81171AC with [r5+5] (beast variant 0 or 1) to pick the graphic template
  (unk_203526C or unk_201D884).

  3. Calls initGuiSprite_8002770(0xB, template) which may reallocate/reassign the sprite pointer (returned in r5).

  4. Sets the animation track from [r5+4] (beast type index), loads animation data, disables the sprite shadow.

  5. Sets palette bank 0 and render priority 2.

  6. Indexes a 4-entry slot table off_8117198 ({0x180,0x198,0x1B0,0x1C8}) by [r5+4] and stores the halfword into
  the slot-list record via slotList_storeHalfwordAndClearField_800306C.

  7. Chooses a sub-entry palette bank: 4 for beast types >= 2, 0xA otherwise (setSubEntryPaletteBank_800304A).

  8. Sets sub-record field A to 3 (setSubRecordFieldA_8003060) and writes 4 to [r5+8] marking the object as initialized.

  9. Delegates to battleObject_setBeastOutAnim (r5 passed as sprite); its r2/r3/r5 become this function''s caller-visible
  outputs.

  '
