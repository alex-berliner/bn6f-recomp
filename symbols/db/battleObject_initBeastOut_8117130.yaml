open_questions:
- Whether this initializer is exclusively the "beast out / cross mega" sprite setup or also handles the
  regular mega navi — the per-beast table only has two real entries, and the other BeastOut helper (sub_81171B4)
  is right next to it, so the file looks beast-out specific, but the actual context (beast-out UI vs in-battle
  transform) needs the caller of sub_81171B4 to disambiguate.
- 'Why `cmp r1,#2; blt` was used instead of `bge loc_811717E` (the comment "blt loc" looks inverted in
  the disasm): confirmed by inspection that the assembly path that sets r0=4 is taken when r1>=2.'
