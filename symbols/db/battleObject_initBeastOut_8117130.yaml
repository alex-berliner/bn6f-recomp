name: battleObject_initBeastOut_8117130
address: '0x08117130'
kind: function
previous_names:
- sub_8117130
status: probable
summary: 'Initializes a beast-out battle object: sets object flags, picks a sprite/animation setup based
  on the beast-out index, configures palette, priority, animation, sub-entry bank, and chains to sub_81171B4'
interface: (r5 = ptr to BattleObject) -> r2/r3/r5 preserved by callee-save ; no meaningful return; stack
  pop {pc}
details: '- Entry: r5 points at the BattleObject (matches the project''s `r5 = object` convention for
  sprite helpers).

  - Byte at r5+6 holds params; bit 1 (`&2`) selects between two base flag values: 0x23 when bit1 is clear,
  0x01 when set. The chosen flag byte is written to r5+0 (OBJECT_FLAG_ACTIVE area / `Flags`) at `strb
  r0, [r5]` after `tst r1, r2`.

  - Picks a per-beast animation-resource descriptor: r5+5 (`Param2`, used as `lsl r2,#2`) indexes `off_81171A8
  -> off_81171AC`, a word table of 2 entries (`unk_203526C` / `unk_201D884`), then `initGuiSprite_8002770`
  is called with r0=0x0B and r1=that pointer to install the GUI sprite block. (0x0B is the init opcode,
  not the field byte at r5+4.)

  - Reads `r5+4` (`Param1`) into r0 and calls `sprite_setAnimation`, then `sprite_loadAnimationData` (tail-calls
  via the same r5 object), then `sprite_noShadow` to drop the shadow.

  - `sprite_setPalette(0)` zero-fills the palette field.

  - `sprite_setPriority_8002E14(2)` sets OAM priority 2 via bits 2-3 of `+0x15`.

  - Uses `r5+4` again to pick one of 4 word entries from `off_8117194 -> off_8117198` (values 0x180, 0x198,
  0x1B0, 0x1C8) and forwards it via `slotList_storeHalfwordAndClearField_800306C`.

  - Computes palette bank for the sprite sub-entry: defaults to 0xA but is overridden to 4 when `r5+4
  >= 2` (note the `blt loc_811717E` is wrong-branch; with signed `cmp #2` and `blt`, this triggers when
  r1>=2, so `mov r0,#4` then falls through), so bank=4 for the larger beast indices.

  - `sprite_setSubRecordFieldA_8003060(3)` writes field 0xA of the selected sub-record to 3.

  - `mov r0,#4; strb r0,[r5,#8]` writes 4 directly into the CurState byte (offset 0x8 in the BattleObject
  header), pushing the object into the normal update state right after init.

  - Finally tail-calls `sub_81171B4` and `pop {pc}` returns.

  - Two captured call-site contexts (snap_beastsp_0000000_*) both enter with r0=08117131 (so they were
  called from the +1 Thumb code), r1=0, and the function leaves r0=0x67c with Z set — r0 is a trashed
  scratch value at exit, callers don''t depend on it. The `lr` they saved (0811711c) belongs to the callsite
  two instructions above.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- "tst r1, r2 / bne / mov r0,#1 / mov r0,#0x23 / strb r0,[r5]" — selects base flag 0x23 vs
    0x01 by bit 1 of the params byte and stores it as the object flag byte at offset 0. - "ldrb r2,[r5,#5];
    lsl r2,r2,#2; ldr r1,[r1,r2]; ldr r1, off_81171A8 / off_81171AC" — uses Param2 (offset 5) as a 2-entry
    table index, picking one of `unk_203526C` / `unk_201D884` as the sprite description fed to `initGuiSprite_8002770`
    with r0=0xB. - "ldrb r0,[r5,#4]; bl sprite_setAnimation / sprite_loadAnimationData / sprite_noShadow
    / sprite_setPalette(0) / sprite_setPriority_8002E14(2)" — Param1 (offset 4) drives animation index,
    the rest is a fixed sprite config block. - "ldr r0, off_8117194 / off_8117198 (.word 0x180,0x198,0x1B0,0x1C8)
    ; ldrb r1,[r5,#4]; lsl r1,r1,#2; ldr r0,[r0,r1]; bl slotList_storeHalfwordAndClearField_800306C" —
    Param1 selects one of four 16-bit slot-list headers (0x180/0x198/0x1B0/0x1C8) and stores a halfword
    from r0 into it. - "mov r0,#0xa; ldrb r1,[r5,#4]; cmp r1,#2; blt loc_811717E; mov r0,#4" — palette
    bank 0xA or 4 depending on Param1 sign-of-`>=2`. - "mov r0,#3; bl sprite_setSubRecordFieldA_8003060"
    — sets sub-record field +0xA to 3. - "mov r0,#4; strb r0,[r5,#8]" — writes CurState=4 (CUR_STATE_UPDATE
    per the BattleObject struct) before chaining. - Two captured callers both come from lr=0811711c with
    the very same r0/r1 pair, consistent with one generated callsite invoking this initializer for two
    different beasts at offset 0 and 1.'
