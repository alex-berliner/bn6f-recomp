name: sprite_clearScaleAndMakeUnscalable_80468E0
address: '0x080468E0'
kind: function
status: confirmed
summary: Zeroes a byte at the head of a sprite object and then marks that sprite unscalable via sprite_makeUnscalable.
interface: void sub_80468E0(r5 sprite_ptr); passes r5 through to sprite_makeUnscalable and returns its
  r0-r3 and NZCV flags unchanged
details: 'Tiny wrapper: the sprite/object pointer arrives in r5. The first byte at [r5] is stored with
  0 (strb r0=[r5] with r0=0), then sprite_makeUnscalable is called with the same r5. Everything the caller
  sees afterwards — r0-r3, the NZCV flags and lr — is exactly what sprite_makeUnscalable leaves behind,
  so this function is effectively a two-step "reset + unscalable" operation on one sprite. r4-r7 (and
  the saved r5) are preserved. The cleared byte is very likely a scale/resize state byte or scale counter
  belonging to the same sprite record sprite_makeUnscalable operates on, but the struct layout is not
  confirmed from this function alone.

  '
