open_questions:
- The exact meaning of the `r4` index (0..0x18 = the 24 jack-in spots per area) and the semantics of `GameStatePtr->Unk_64[r4]`
  (probably a "destination/jack-in variant" selector). Knowing what each of the 24 entries of `dword_8034D6C`
  maps to in story terms would let us confirm this is the "press L to jack in/out" overworld trigger rather
  than, say, an area-specific event. The `>=0x80` MapGroup branch and `CutsceneScriptAskJackOut_80988E4`
  strongly suggest this is the BN6 jack-out prompt, but the precise cutscene param packing deserves a
  check against story scripts.
