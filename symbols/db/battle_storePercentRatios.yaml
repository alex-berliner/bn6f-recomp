- What fields 0x24/0x26 of a BattleObject mean (current/total of HP or some gauge) — a known summary of
  battle_findPlayer's struct would confirm
- Which enemy/object type ID 0x17F is (why exactly this object is sampled on the opposite side)
- Meaning of battle-state byte 0x0D used as the side selector
- Purpose of the 0x20-byte records at 0x203C4A0 and what consumes bytes 0xC/0xE
