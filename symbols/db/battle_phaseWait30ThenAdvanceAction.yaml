name: battle_phaseWait30ThenAdvanceAction
address: '0x080E90CE'
kind: function
status: probable
summary: 'Battle-object phase handler: optionally clears a related object, waits 30 frames, then advances
  to action 0xC.'
interface: (r5 = battle object ptr, implicit) -> void; updates object fields only
details: 'Runs as a per-object state/phase step for a battle object held in r5. On first entry (PhaseInitialized
  == 0): unless Param1 == 2, it calls sub_80E1332(RelatedObject1Ptr, 0), which tail-calls sub_80C0F52
  — likely a clear/remove/inactivate of the linked object, though that callee is undocumented. It then
  sets Timer = 30 and writes PhaseInitialized = 4 so the wait only starts once. Each subsequent call decrements
  Timer; while it is still >= 0 it returns. When the timer runs out it sets CurAction = 0xC and clears
  CurPhaseAndPhaseInitialized = 0, letting the object''s dispatcher pick the next phase.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized]; tst/bne — one-shot setup guarded on first entry;
    ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]; mov r1,#0; bl sub_80E1332 — acts on the linked object,
    skipped when Param1==2; mov r0,#0x1e; strh [r5,#oBattleObject_Timer] — wait length is 30 frames; ldrh/sub
    #1/strh/bge — per-frame countdown of Timer; mov r0,#0xc; strb [r5,#oBattleObject_CurAction]; strh
    #0 CurPhaseAndPhaseInitialized — transitions to action 12 when timer expires'
