name: sub_8134138
address: '0x08134138'
kind: function
status: confirmed
summary: Updates a battle sprite's x position from a per-side base table and flips its side flag (0 or 1) once the
  sprite crosses the target-x threshold.
interface: void sprite_battleUpdatePosAndFlipSide_8134138(u8 *obj); // obj = r7, modifies +0xE/+0xF/+0x18-derived
  fields; no return
details: 'Reads the side sub-id from obj+0xE (0 or 1), indexes a 16-bit base-x table at dword_813418C (values {0x030,
  0x1B6} → 48 and 438 px) to get the starting x for that side. Reads the sprite''s current x (s16 at obj+0x18),
  multiplies by 8, subtracts from the base, and passes the resulting offset plus y=0x58 and z=0 to sprite_setPositionForIdRange3_8119854,
  which moves a battle-range-3 sprite. Then copies obj+0xE to obj+0xF (previous-side bookkeeping). Finally re-derives
  obj+0xE: if the old side was 0, it stays 0 unless current-x > target-x (obj+0x1A) AND current-x >= 11 (0xB), in
  which case it flips to 1; if the old side was 1, it stays 1 unless current-x < target-x AND current-x <= 19 (0x13),
  in which case it flips to 0. The thresholds 11 and 19 likely correspond to grid-cell boundaries in the battle
  field. The single call target sprite_setPositionForIdRange3_8119854 restricts the move to sprites whose ID falls
  in a "range 3" bucket (battle NPCs / enemy sprites).

  '
