name: custMenuMainMaybe_8026A88
address: '0x08026A88'
kind: function
status: confirmed
summary: 'One-frame step of the custom-menu state machine: dispatches the handler for the current state, then runs
  the shared per-frame update.'
interface: 'void custMenuStep_8026A88(void) /* out: r0 = 0 (Z set, N clear); r5 preserved; other regs per callees
  */'
details: 'Loads the menu work-area pointer from the fixed address 0x020364C0 (eS20364C0)

  into r5, reads the current state byte at oS20364C0_JumpOffset01, and uses it

  as a word offset into the handler table at off_8026AA4 to bx into the

  selected state handler. After the handler returns, calls the shared

  per-frame update sub_802A2B0 with r5 still pointing at the work area, then

  returns 0. Handlers receive r0 = table offset, r1 = table entry, r5 = work

  area (as left by the original''s mov lr,pc / bx sequence). The 24-entry

  table covers states 0x00..0x5C in 4-byte steps and includes

  custMenuUpdateWaitSelectionState_8026CCC,

  chatbox_stateMaybeFinishText_8026E4C,

  battle_updateObjectByKind_8026E98 and

  chatbox_resetTextStateIfHidden_80273EC alongside the unnamed handlers.

  '
