name: battle_breakPanelExpireUpdate
address: '0x080DC484'
kind: function
status: probable
summary: Battle-object handler that spawns a break-panel effect on the object's tile, plays sound 0x12E,
  waits 16 frames, then destroys the object.
interface: (r5 = battle object) -> updates object phase/timer/state; r0 clobbered
details: Uses the standard battle-object layout (oBattleObject_CurPhase, _PanelX, _PanelY, _Timer, _CurStateActionPhaseAndPhaseInitialized).
  On CurPhase==0 it stores phase 4, calls sub_80DC4DE once, then calls object_breakPanel_dup2 with the
  object's panel X/Y to spawn the break-panel animation there, plays sound effect 0x2F+0xFF = 0x12E via
  PlaySoundEffect, and sets Timer=0x10. On later calls it decrements Timer each frame; when it hits zero
  it writes CUR_STATE_DESTROY into the combined state/phase field so the engine destroys the object. Effectively
  a one-shot timed effect tied to a panel break.
