- method: assembly-reading
  date: '2026-10-19'
  detail: 'strb #4,[r5,#oBattleObject_CurPhase] then bl sub_80DC4DE runs only when CurPhase==0; ldrb PanelX/PanelY
    + bl object_breakPanel_dup2 spawns the break-panel effect at the object''s tile; mov r0,#0x2f; add
    r0,#0xff; bl PlaySoundEffect plays SFX 0x12E once at startup; Timer set to 0x10 then decremented with
    sub r0,#1; bgt, otherwise CUR_STATE_DESTROY is stored'
