name: sub_81283A0
address: '0x081283A0'
kind: function
status: confirmed
summary: Builds the per-encounter battle object list by zeroing the 0x1000-byte object buffer and appending one
  0x20-byte entry per arena participant whose table flag matches the object's team bit, then hands the populated
  list to the finalization stage.
interface: void sub_81283A0(u32 r5 /* battle-object struct */); // reads r5+0xD (team bit) and r5+0x1E (entry counter);
  writes back r5+0x1E; clobbers r0-r3, r9-r12, lr; preserves r4-r7
details: "- Stack frame: 0xC bytes; saves r5 at [sp+4].\n- Calls ZeroFillByEightWords(dword_2027590, 0x1000) to\
  \ clear the object buffer.\n- Calls sub_81284B4 to obtain a primary counter (r0) and alternate counter (r1); selects\
  \ primary if object.bit==0, alternate if object.bit==1 (test of r2=r5+0xD with mask 1).\n- Skips all work if dword_2001140\
  \ byte == 0; otherwise zeros r5+0x1E as the written-entry count.\n- Iterates byte_2006530[0..count-1], using each\
  \ id to index a 4-byte descriptor at byte_812851C+id*4.\n- Bit 0x80 of descriptor[0] acts as an \"include for\
  \ opposing team\" flag: entry is written only when this flag's polarity matches the object bit (in_team XOR flag==0).\
  \ The C text inverts the sense; the assembly tsts bit 0x80 and branches, achieving the same membership filter.\n\
  - Per entry written to buf (dword_2027590) at 0x20 stride:\n    +0x00: (flag_byte<<16) | ~counter[hi16|lo16]\n\
  \    +0x04: tbl[1]\n    +0x08: (tbl[2]<<16) | ~counter\n    +0x0C: (tbl[3]<<16) | ~counter\n    +0x10: id*2 (low\
  \ byte)\n    +0x14: id*2+1 (low byte)\n    +0x18: (id<<16) | id\n    +0x1C: (counter<<16) | counter\n  Counter\
  \ decrements after each write; r5+0x1E entry-count is incremented.\n- After the loop, if r5+0x1E != 0, calls sub_8120018(dword_2027590,\
  \ entries, byte_2000FE0, byte_2000FE1).\n- Constants: byte_812851C is the static descriptor table; byte_2006530\
  \ is the encounter participant id list; dword_2027590 is the 0x1000-byte object buffer.\n"
