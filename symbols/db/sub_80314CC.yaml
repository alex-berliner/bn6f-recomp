  detail: '- The two hit-test callees (sub_8030E14 "line-vs-point", sub_8030F7C "line-vs-wedge") are called with
    r0..r6 set up as line/segment parameters; this is exactly the geometry test pair. - `cmp r3, #1; beq locret_803151E`
    is the only branch back to the function epilogue and matches the documented return semantics of the hit-test
    helpers ("returns the segment/line crossing offset, or (0,0) on no-cross"). - `lsl r1, r3, #0` then `orr r0,
    r1` (and `lsl r1, r3, #1` after the wedge call) shows r12 (passed in r12, kept via push/pop) is being used as
    a 2-bit packed result accumulator across both hit tests. - Both arms of the function push {r0-r2,r5} before
    calling helpers that clobber those registers (push {r0-r2,r5}; pop; then re-push before the next helper) — that
    is the ABI convention for keeping scratch regs across helper calls. - Captured calls all share `lr=08030bfc`,
    indicating a single caller invoking this per battle frame in story mode. - The captured r0=0x02009f5c object
    has a 16-bit pair at +0 and +4 that changes between captures (e.g. 0x00c0e0ff/0x00c0f800 vs 0x00c07800/0x00c0e7ff),
    consistent with the "point relative to reference" geometry the hit-test helpers use.'
