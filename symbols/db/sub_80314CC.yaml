- What r12 represents in the caller (it's threaded across calls but its semantic meaning is not shown in this function's
  body — would settle by examining the code at 0x08030bfc).
- Which precise field at r0+0 / r0+4 is the "reference point" vs the "moving point" used by the hit tests (would
  settle by looking at how sub_8030E14/sub_8030F7C interpret their r0 input).
- 'The role of r1/r2 on entry: they are saved+restored but not read by this function''s body before being passed
  to the first helper; likely the helper interprets them as additional segment endpoints or as filter masks.'
- Whether `camera_moveByDelta_80310B0` is called with r1=0 to *apply* a movement that was already partially offset
  by the shake/projection calls, or whether the zero is a "no-op this frame" marker — would settle by reading camera_moveByDelta_80310B0's
  contract more carefully.
