name: sub_80314CC
address: '0x080314CC'
kind: function
previous_names: []
status: hypothesis
summary: Advances the battle camera/scroll by one collision-resolving step using line/wedge hit helpers
interface: '(r0 = someObjOrStatePtr, r1 = someDeltaOrParam, r2 = something, r5 = something, r12 = someAccum, lr
  = ret) -> r0 = sameObjPtr, r12 updated with collision bits, flags ZC set/cleared by `cmp r3,#1` ; side effects:
  pushes/pops {r0-r2,r5,lr}, calls two camera-move helpers and two hit-test helpers'
details: "- Saves {lr} and {r0-r2,r5}, then calls battleObject_applyShakeOffsetAndProject_8031136 with r0..r2 still\
  \ in their entry positions (r5 also survives the push) to apply shake/projection before testing movement.\n  -\
  \ Sets r2=-1 (and r4=0x20, r3=-1, r5=0, r6=0) and calls sub_8030E14 (line-vs-point hit test) to check whether\
  \ a tiny segment (delta encoded in those registers) crosses something relative to (r0).\n  - On a hit (r3 != 0?\
  \ actually the test below checks `cmp r3,#1` so r3 is the hit-code), it calls camera_moveByDelta_80310B0 with\
  \ r1=0 (zero motion) and then ORs r3<<0 into r12, leaving r12 as a small-bit accumulator of hit results.\n  -\
  \ If `cmp r3, #1; beq locret_803151E` returns early (the only \"matched\" case), so most calls will fall through\
  \ to the second branch where r3 was not equal to 1.\n  - The fallthrough re-pushes {r0-r2,r5}, calls battle_scrollAccumulateStep_8031176,\
  \ then sets r2=0, r4/r3/r5=0x20 and r6=0 and calls sub_8030F7C (line-vs-wedge hit test) which returns a hit in\
  \ r3.\n  - After that it does camera_moveByDelta_80310B0 with r0=0 (zero motion again) and ORs r3<<1 (lsl r1,r3,#1;\
  \ orr) into r12 — so r12 packs a bit-0 result from the first test and a bit-1 result from the wedge test before\
  \ returning.\n  - The captured-call memory at r0=0x02009f5c is a battle-object-ish record whose offset+0..0x7\
  \ form a packed point/velocity pair (e.g. snap_story2_0 has `00 c0 e0 ff 00 c0 f8 00`), matching the \"(rx,ry)\
  \ returned relative to a reference point\" pattern that sub_8030E14/sub_8030F7C are described as writing back;\
  \ r12 is used as a tiny packed-result return that the caller threads across calls (lr=0x08030bfc, the same caller\
  \ for all 21 captures).\n  - The function is clearly a per-frame battle camera/scroll collision-resolving step\
  \ that probes for collisions with two geometries (a line and a wedge) and accumulates the result in r12, but the\
  \ exact camera layout it writes to is via camera_moveByDelta_80310B0 and battleObject_applyShakeOffsetAndProject_8031136/battle_scrollAccumulateStep_8031176,\
  \ not directly here.\n"
