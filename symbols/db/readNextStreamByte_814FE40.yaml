name: readNextStreamByte_814FE40
address: '0x0814FE40'
kind: function
status: confirmed
summary: Reads one byte from the data stream pointed to by [r1+0x40], stores it into the byte field at [r1+0x1F],
  and advances the stream pointer.
interface: 'u8 readNextStreamByte(void* rec /* r1 */); // out: r0 = advanced stream pointer, r2 = byte read, nz/c/v
  from pointer increment'
details: 'Very small stream-reading helper. The struct passed in r1 holds a pointer at +0x40 into

  some byte stream (script/command/data blob). The function loads that pointer, reads one

  byte from it, writes the byte into the record''s byte-sized field at +0x1F, then stores the

  incremented pointer back to +0x40. Returns the byte in r2 and the new pointer in r0; the

  flags come from the ADDS r0,#1 pointer increment (so callers could branch on carry, though

  it is likely incidental). No bounds checks, no other struct fields touched. Likely one of a

  family of "read next value from stream into field X" routines used by an interpreter or

  record parser; which subsystem owns the r1 struct is not evident from this function alone.

  '
