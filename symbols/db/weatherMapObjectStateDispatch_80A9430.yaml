name: weatherMapObjectStateDispatch_80A9430
address: '0x080A9430'
kind: function
status: confirmed
summary: Dispatcher for the Mr. Weather overworld map object; runs the per-state handler selected by the
  object's state byte.
interface: void sub_80A9430(r5=weather map object, r10=pass-through arg); caller-visible outputs are whatever
  the selected handler leaves in r2-r5/r8-r12
details: "Reads the state machine number from offset 8 of the map object passed in r5, uses it as an\n\
  index into the jump table at off_80A9444 (4 entries), and tail-calls the handler with\nr0 = handler\
  \ address, r1 = state number, r5 = object, r6 = &eWeatherCompState, r10 passed\nthrough from the caller.\
  \ States:\n  0: owMapObject_mrWeatherInit_80A9458 (spawn/init)\n  1: object_mrWeatherStep_80A94DC (per-frame\
  \ step)\n  2: sub_80A94F8 (extra state; labeled object_fadeSpriteToWhiteStep in the table comment)\n\
  \  3: owMapObject_freeThunk (despawn/free)\nThe dispatch is done via mov lr,pc; bx r0, so the handler\
  \ returns directly to this\nfunction's caller and everything left in r2-r5/r8-r12 becomes this routine's\
  \ output —\nregister results are effectively forwarded from the handler. The handler is given the\n\
  address of eWeatherCompState, the weather component's shared state block, as an argument.\n"
