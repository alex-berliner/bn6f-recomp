name: sub_8134F78
address: '0x08134F78'
kind: function
status: hypothesis
summary: Writes 0xFF into bytes 0 and 2 of the toolkit's S2001c04 work buffer and returns 0xFF, apparently flagging
  a "no result / done" state for whatever subsystem reads that buffer.
interface: 'void s2001c04_markResultNone(void); /* in: r10 = toolkit; out: r1 = 0xFF; clobbers r0, NZ flags */'
details: Loads the S2001c04 pointer from the toolkit struct (oToolkit_S2001c04_Ptr at +offset from r10), then stores
  0xFF to byte 0 and byte 2 of that buffer, leaving bytes 1 and 3+ untouched. Sets r1 = 0xFF as its return value,
  which is also the value just written, so the caller can test the same "none/terminated" sentinel directly. The
  buffer at S2001c04 is a small result/continuation record (at least 3 bytes); 0xFF at offset 0 plausibly marks
  an end-of-list / no-selection / finished state, with offset 2 carrying a matching status byte. The function is
  a trivial tail-like helper (push {lr} ... pop {pc}) whose only observable effects are the two byte stores and
  the fixed r1 return.
