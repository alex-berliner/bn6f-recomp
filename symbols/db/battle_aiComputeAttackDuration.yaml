name: battle_aiComputeAttackDuration
address: '0x081004C8'
kind: function
status: probable
summary: Returns a randomized attack duration (frames) for an AI attack, with a +60 boost when the target
  object has flag 0xA000 set.
interface: () -> r0 = u16 attack duration (frames)
details: Loads pointer dword_81004E8 = {0x28, 0x24, 0x20, 0x1C} into r0 and calls sub_800FE28, presumably
  a random-in-range helper that returns one of those values. It then queries object_getFlag on the current
  object and tests mask 0xA000 (the high bits of the first object flag word). When the test is non-zero,
  0x3C (60) is added to the random value before returning. The caller stores this result as the AI attack's
  AttackDuration field, in line with the surrounding AI attack initialization sequence (loading versioned
  attacks, choosing target, setting object attack register).
