name: oBattleState_StatePhase
address: '0x2'
kind: struct-field
status: probable
summary: Index into a per-state phase jump table that selects which phase handler runs each frame/tick
  of the battle state machine.
details: This byte is loaded as an index into an off_XXXX jump-table base in 8 separate dispatcher functions
  (battle_dispatchPhase_8007978, battle_runFrame_8007B9C, sub_8007F4E, battle_dispatchStatePhase_80092A0,
  battle_DispatchStatePhase_800945C, sub_8009734, sub_80098BC, sub_8009A88, sub_8009BAC, sub_8009D78,
  sub_8009E10, sub_8009EE2) — i.e. the canonical dispatch idiom `ldrb r0,[r5,#+2]; ldr r1,[r1,r0]; bx
  r1`. Other writers set it to small phase constants (4, 8, 0xc) and other readers branch on it being
  zero, all consistent with a state-machine phase selector stored in the high byte of the Unk_02_03 halfword.
