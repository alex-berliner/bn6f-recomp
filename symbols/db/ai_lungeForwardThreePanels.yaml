name: ai_lungeForwardThreePanels
address: '0x080F162C'
kind: function
status: confirmed
summary: 'AI action: lunge a battle object 3 panels straight ahead, reserving target and origin, then lock it in
  place.'
interface: ai_lungeForwardThreePanels(r5 = battleObject*, r7 = aiVars*) -> r1 = panelY or setFlag result; preserves
  r5, r4
details: "Gate-1: calls object_canMove; if Z is set (cannot move this tick) the function writes StepTimer=2, HitElement=0x0C\
  \ to the AI-attack-vars block at r7 and returns.\nGate-2: reads object_getFrontDirection(r5)*3 and adds it to\
  \ oBattleObject_PanelX to produce a candidate target panel (PanelY unchanged). Validates via object_checkPanelParameters\
  \ with constants 0x10 and 0xF880080 (panel-parameter table at 0x080F1688); a zero return means the panel is illegal\
  \ -> same stall path (StepTimer=2, HitElement=0x0C).\nSuccess path (r7 = oAIAttackVars):\n  - Stores target X/Y\
  \ into oAIAttackVars_TargetPanelX / TargetPanelY.\n  - Calls object_reservePanel for the target, then writes current\
  \ PanelX/PanelY into oBattleObject_FuturePanelX/Y and calls object_reservePanel again for the origin (reserving\
  \ both cells of the lunge).\n  - Calls object_clearCollisionRegion to drop the old hitbox.\n  - Calls object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE)\
  \ to prevent the engine from repositioning the object mid-animation.\n  - Writes StepTimer=2 and HitElement=8\
  \ (the \"lunge\" hit-id the animation handler reads next tick).\nOutput r1: on the can't-move path it comes from\
  \ object_canMove; on the invalid-panel path it is the saved PanelY; on success it is whatever setFlag1 left in\
  \ r1. r5 and r4 are preserved for the caller's loop.\nQuirks: two separate reservePanel calls for a single lunge\
  \ (target + origin) suggests the engine tracks occupancy per-panel and the object must vacate its own cell before\
  \ moving. The constants 0x10 / 0xF880080 in the panel-parameter table encode a bitmask or region check (likely\
  \ \"walkable, not on a hazard, within field bounds\"). HitElement 0x0C appears to be a shared \"idle/stall\" code;\
  \ 8 is the lunge-specific code.\n"
