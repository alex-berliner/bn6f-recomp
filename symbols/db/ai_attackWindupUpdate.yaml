name: ai_attackWindupUpdate
address: '0x080FEDCC'
kind: function
status: probable
summary: 'Per-frame update of an AI attack''s wind-up: starts the attack pose and counts down until the
  attack resolves.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = clobbered; flags not meaningful
details: 'If oAIAttackVars_AttackElement is still 0, the attack begins: AttackElement is set to 4, the
  object''s CurAnim (r5, oBattleObject_CurAnim) is set to 5, and oAIAttackVars_StepTimer is loaded with
  0x11 frames. On subsequent calls it decrements StepTimer each frame; when it reaches zero it writes
  0xC into oAIAttackVars_HitElement. It is a leaf state-machine step (push/pop pc only) operating entirely
  on the AI attack vars and object animation fields.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — zero means the wind-up has not been initialized
    yet; strb #4 AttackElement, strb #5 CurAnim, strh #0x11 StepTimer — the initial attack pose and frame
    count; sub r0,#1 / strh StepTimer / bgt — a simple frame countdown loop; strh #0xc [r7,#oAIAttackVars_HitElement]
    when the timer expires — the wind-up hands off to the hit phase; no known callers or callees, so the
    trigger and meaning of the constants (element 4, anim 5, hit element 0xC) are unverified'
  refs:
  - bn6f/asm/asm31.s:154242
  reproduce: python3 tools/asmcat.py 0x080FEDCC
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- no callers known — which enemy AI selects this attack and what element 4 / anim 5 / hit element 0xC
  mean in game terms
- whether the 0xC in HitElement is an element code, a state, or an attack id
