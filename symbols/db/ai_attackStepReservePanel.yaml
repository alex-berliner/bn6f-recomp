name: ai_attackStepReservePanel
address: '0x080FFBA8'
kind: function
status: probable
summary: 'AI attack state step: on first entry sets AttackElement to state 4 and (if movable) invokes
  the object''s PanelChooseCallback with per-alliance params from byte_80FFC08 to pick a FuturePanelX/Y,
  reserves it, sets flag CANNOT_SLIDE, plays CurAnim 4, and arms StepTimer=2; on timer expiry sets HitElement=4
  (attack landed), or if blocked sets AttackDuration=60 and HitElement=8 (abort path).'
interface: (r7 = battle object's AI attack vars, r5 = battle object) -> void; writes AttackElement/StepTimer/HitElement/AttackDuration
  in r7, FuturePanelX/Y, CurAnim and ObjectFlags1 on r5
details: On first entry (AttackElement==0) it stores 4 into AttackElement, checks object_canMove, and
  if movable looks up a per-alliance 8-byte table at byte_80FFC08 (alliance*8) whose two words are passed
  in r2/r3 to the object's PanelChooseCallback along with the target object pointer; the callback returns
  target panel x in r0 and y in r1, which are stored into FuturePanelX/Y. It then claims the panel with
  object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE, sets CurAnim to 4 and StepTimer to 2. On subsequent
  calls it counts StepTimer down; at zero it sets HitElement to 4 (the actual attack). If it cannot move
  or the callback rejects, it sets AttackDuration=60 and HitElement=8 (failure path). The table entries
  (0x10,0x0F8800A0 / 0x30,0x0F880080) look like chooser direction/side parameters per ally/enemy alliance.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne loc_80FFBEA — two-phase state keyed on AttackElement;
    ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; mov lr,pc; bx r1 with r0=target ptr, r2/r3 from byte_80FFC08[alliance]
    — callback picks the panel, returning x/y; strb r0/r1,[r5,#FuturePanelX/Y]; bl object_reservePanel;
    OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1 — claims and locks the panel; StepTimer=2 then decrement
    path sets HitElement=4; blocked path sets AttackDuration=0x3C and HitElement=8
  refs:
  - bn6f/asm/asm31.s:152266
  - 0x0800E5E2 object_canMove
  - 0x0801BB1C object_reservePanel
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080FFBA8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The state-machine, StepTimer countdown, AttackElement=4 trigger, HitElement=8 abort, and table-driven
    panel chooser (byte_80FFC08) all match the code. However, on first entry the code stores 4 into AttackElement,
    not StepTimer, and HitElement (not AttackElement) is set to 4 at expiration; HitElement and AttackDuration
    are stored via strh, consistent with halfword fields. The name ''ai_attackStepReservePanel'' is fine,
    but the summary should clarify that 4 is stored in AttackElement (state id), not ''anim 4''.; run
    wf investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
