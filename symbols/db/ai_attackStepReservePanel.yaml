name: ai_attackStepReservePanel
address: '0x080FFBA8'
kind: function
status: confirmed
summary: 'AI attack step: pick and reserve a battle-grid panel for a fire-element attack, then countdown to trigger
  the hitbox.'
interface: void ai_attackStep_reservePanel_80FFBA8(/*r5:BattleObject*/, /*r7:AIAttackVars*/); // r4, r6, lr passed
  but unused; nzcv and r0-r12 clobbered; no meaningful register return
details: 'Part of an AI attack state-machine. On the first invocation (AIAttackVars.AttackElement==0) it sets AttackElement
  to 4 (fire), queries object_canMove on the attacker (r5). If the attacker cannot slide, it abandons the step by
  writing AttackDuration=0x3C (60 frames) and HitElement=8 into r7 and returns. Otherwise it indexes a 2-entry-per-alliance
  lookup table (byte_80FFC08, offset alliance*8) for panel-search bounds, loads the target pointer and the PanelChooseCallback
  function-pointer from r7, and calls the callback to obtain a (X,Y) panel coordinate. If the callback returns X==0
  (no valid panel found) the step abandons identically. On success it writes FuturePanelX/FuturePanelY into r5,
  calls object_reservePanel(X,Y,r5), sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, starts attack animation
  CurAnim=4, and loads StepTimer=2. On subsequent invocations (AttackElement!=0) it decrements StepTimer; once it
  reaches zero it writes HitElement=4 into r7, signalling the next state to spawn the actual fire-attack hitbox.
  Fields touched: AIAttackVars.{AttackElement,StepTimer,HitElement,AttackDuration, TargetObjectPtr,PanelChooseCallback};
  BattleObject.{Alliance,FuturePanelX,FuturePanelY, CurAnim,object-flags}.

  '
