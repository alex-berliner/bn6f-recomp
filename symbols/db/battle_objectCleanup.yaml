  reproduce: python3 tools/asmcat.py 0x080E1352
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The name and per-bit descriptions match the lsr/bcs chain correctly (bit0→sub_80E0DCA, bits1/2→clear
    flag0x2 on hit-object/CollisionData+0x4C, bit3→dispatch_801DACC(2) when networkInvert≠1, bit4→sub_80E0F22,
    bit5→sub_80C4C46). However, the proposal claims SetAIDataUnk0x48Flag with value 0 ''clears a flag
    in AIData+0x48'', but that callee ORs flags in (read-modify-write OR); passing 0 is a no-op. Also,
    the interface says ''r0 = destroyed'' but the function never sets r0 before pop, so there is no return
    value. The bitmask is more accurately a ''skip'' mask: a CLEAR bit enables the step, not a set bit.;
    run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
