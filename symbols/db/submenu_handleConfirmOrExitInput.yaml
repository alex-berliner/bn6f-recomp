name: submenu_handleConfirmOrExitInput
address: '0x08133564'
kind: function
status: probable
summary: 'Per-frame input handler for an open submenu: adjusts its cursor on D-pad input, advances to
  state 4 on A, and on B plays the exit sound, runs a closing text script, and closes itself.'
interface: (r5 = submenu state struct, r10 = toolkit) -> void; also uses global event flag word and joypad
details: First bails out if event flag bit 0x80 (chatbox_mask_eFlags2009F38) is set, then feeds the low-sensitivity
  held joypad value to menu_adjustCursorOrValue_811F7F8 with mask 7 to move the menu's cursor index; if
  the cursor changed, it returns. On newly-pressed A it stores 4 into [r5+0x68], which looks like the
  struct's next-phase/state word, and returns. On newly-pressed B it plays SOUND_EXIT_SUBMENU, runs script
  0xA (or 0x1B if submenu_isOpen_81355D8 says another submenu besides state 0x20 is open) from the eTextScript2028A20
  archive, clears the byte flag at [r5+3], and zeroes [r5+0x68]. The A and B branches are mutually exclusive
  with the cursor-adjust branch via early returns.
