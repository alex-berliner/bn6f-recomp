name: submenu_handleConfirmOrExitInput
address: '0x08133564'
kind: function
status: confirmed
summary: 'Processes A/B button presses on an open submenu: A queues a confirm action, B plays the exit sound and
  runs the appropriate closing chatbox script, clearing the submenu input state.'
interface: void submenu_handleConfirmOrExitInput_8133564(SubmenuState *r5, Toolkit *r10)
details: "r5 points to the active submenu's state structure; r10 points to the global toolkit.\n1. Calls chatbox_mask_eFlags2009F38(0x80);\
  \ if the chatbox is displaying text\n   (flag set, Z clear after the call) the function returns immediately, blocking\n\
  \   all submenu input while dialogue is on screen.\n2. Loads the toolkit joypad pointer (offset oToolkit_JoypadPtr)\
  \ and reads the\n   16-bit low-sensitivity held-button mask (offset oJoypad_LowSensitivityHeld).\n3. Passes that\
  \ mask together with literals 7, 0, 0 and the submenu-state pointer r5\n   to menu_adjustCursorOrValue_811F7F8.\
  \  A non-zero return signals a cursor/value\n   movement was consumed this frame, so the function returns without\
  \ touching\n   confirm/exit logic.\n4. Checks IsButtonPressed(JOYPAD_A).  If A was pressed (Z clear), stores the\n\
  \   deferred-action code 4 at state offset 0x68 so the main menu loop can process\n   the confirmation on a later\
  \ frame, then returns.\n5. Checks IsButtonPressed(JOYPAD_B).  If B was NOT pressed (Z set), returns.\n   If B\
  \ WAS pressed:\n   - Plays SOUND_EXIT_SUBMENU.\n   - Queries submenu_isOpen_81355D8() to pick the closing chatbox\
  \ script:\n     0x1B if the submenu is still open (multi-level), 0x0A otherwise (single-level).\n   - Invokes\
  \ chatbox_runScript_803FD9C_on_eTextScript2028A20 with that script id.\n   - Clears the byte at state+3 (input-pending\
  \ flag) to 0 and the u32 at\n     state+0x68 (deferred-action word) to 0, fully resetting the submenu's\n    \
  \ input-handling state.\nRegister contract note: the declared outputs r8/r9/r10/r12 are incidental side-\neffects\
  \ of the callees; the function itself only modifies memory via r5 and r10\nand clobbers r0–r3.  r4 is saved/restored\
  \ across the prologue.\n"
