name: object_fallIntoHoleDestroy
address: '0x080D688C'
kind: function
status: probable
summary: 'Object self-destruct: if it ends up on a hole/broken panel it spawns a dimming collision region,
  a fall/crash effect and a sound, then clears its owner''s flag and destroys itself.'
interface: (r0 = object, r5 = battle object struct) -> r0 = ?; sets owner flags byte to 0 and object state
  to CUR_STATE_DESTROY
details: First calls object_isCurrentPanelSolid; if the panel is NOT solid it skips straight to teardown.
  Otherwise it picks one of two packed constants (0x0A050001 or, if oBattleObject_Param3 != 0, 0x2B050001)
  passed in r4 to object_spawnDimmingCollisionRegion along with panel X/Y, element, and a cleared r3,
  so the region keeps ticking during timestop. It then copies three words from object+0x34 into a type-0/0x21
  effect spawned via spawn_t1_0x0_EffectObject (r4=0x21) and plays sound effect 0xB9, matching a 'falling
  into a hole' crash. Finally it zeroes RelatedObject1Ptr's oObjectHeader_Flags and stores CUR_STATE_DESTROY
  into the object's state/phase word. The table lookup byte_80D68D8 indexed by Param3<<2 loads into r7
  but the value is never used (dead code).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_isCurrentPanelSolid; tst/beq skips spawn block when panel is not a hole/broken tile;
    bl object_spawnDimmingCollisionRegion with r0-r3 from PanelX/PanelY/Element and r4 = 0x0A050001 or
    0x2B050001 chosen by Param3; ldmia from object+0x34 then mov r4,#0x21 and bl spawn_t1_0x0_EffectObject
    spawns the effect; mov r0,#0xB9; bl PlaySoundEffect plays the associated sound; strb 0 into [RelatedObject1Ptr,#oObjectHeader_Flags]
    and CUR_STATE_DESTROY into state word then pop — unconditional teardown on both paths
