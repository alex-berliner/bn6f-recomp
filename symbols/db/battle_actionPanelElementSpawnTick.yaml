name: battle_actionPanelElementSpawnTick
address: '0x080BA56C'
kind: function
status: probable
summary: 'Per-frame action handler for a battle object: initializes CurPhase/CurAnim/Timer/Timer2 on first
  call, then every ~12 frames calls battle_spawnPanelElementCollisionRegion (element-based collision region
  over own panel) and spawn_effectAtObjectPanelWithRandomOffset (effect 0x21 near the panel) until Timer
  (0x48) expires, at which point CurAction=0x18 and CurPhase is cleared.'
interface: (r0 = unused/scratch, r5 = battle object pointer) -> r0 = 0; updates object CurPhase, CurAnim,
  Timer, Timer2, CurAction
details: Runs as a per-frame state handler using r5 as the battle object. On phase 0 it sets CurPhase=4,
  CurAnim=0x10, Timer=0x48 (72 frames), Timer2=0. Afterwards it decrements Timer2; when it expires it
  calls battle_spawnPanelElementCollisionRegion (element-based collision object over the object's own
  panel) and spawn_effectAtObjectPanelWithRandomOffset (effect 0x21 near the panel), then reloads Timer2=0xc,
  so a spawn happens every 12 frames. Meanwhile the main Timer counts down; on expiry it sets CurAction=0x18
  and clears CurPhaseAndPhaseInitialized, handing control back to the object's action dispatcher.
