    — The code matches the proposal well: phase 0 init sets CurPhase=4, CurAnim=0x10, Timer=0x48, Timer2=0;
    Timer2 is decremented and when <=0 calls battle_spawnPanelElementCollisionRegion then reloads Timer2=0xc,
    then spawn_effectAtObjectPanelWithRandomOffset; on Timer expiry it sets CurAction=0x18 and clears
