name: battleObject_updateSprite_80C464C
address: '0x080C464C'
kind: function
status: confirmed
summary: Per-frame sprite update for a battle object, applying the related object's mosaic/alpha effects and choosing
  between normal, timestop-aware, or animation-only sprite updates.
interface: void battleObject_updateSpriteWithEffects_80C464C(BattleObject* object /* r5 */, void* battleState /*
  r10 */); returns r5 = object unchanged; flags clobbered
details: 'Takes the battle object in r5 (r10 appears to be battle state passed through to callees; this function
  does not read it itself). First it fetches object->RelatedObject1Ptr and calls sprite_getMosaicScalingParameters
  on it, feeding the result into sprite_setAlpha together with the object, so the object''s sprite blend/alpha (e.g.
  mosaic scaling effects from the related object) is refreshed each frame. If object->ExtraVars+0xC is nonzero,
  it reads the related object''s CollisionDataPtr->ObjectFlags1 and aborts (leaving the sprite untouched) when any
  of the flags 0x100800 are set — a "do not draw/update sprite" style state guard. Otherwise it dispatches on the
  object''s Param3 byte: 1 -> object_updateSpriteTimestop (sprite keeps updating during time stop), 2 -> battleObject_updateSpriteAnimIfChanged_801BCD0
  (only advance the animation when it changed), any other value -> normal object_updateSprite, but skipped while
  battle_isTimeStop reports time stopped (Z flag clear = time stopped). r5 is preserved and passed through unchanged
  to the callee and caller.

  '
