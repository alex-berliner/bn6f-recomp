name: chip_previewShowSelectedChip
address: '0x0802B920'
kind: function
status: probable
summary: 'Per-frame update of a chip-preview UI task: after a 16-frame delay it draws the selected chip''s
  art, name and sound, and after ~96 frames moves the task to its next state.'
interface: '(r0 = task object in r5 on entry, fields: +4 chip id, +6 slot/offset index, +0x10 frame counter)
  -> r0 = clobbered; no meaningful return'
details: 'Treats r5 as a UI task/state object and increments a frame counter at +0x10. On frame 16 it
  calls sub_802B8B0 with 0xA0AB + index*0x12 (per-slot chip-art/tile resource) and renders the chip name:
  chip_SelectNameTextTable splits the chip id at [r5,#4] into table+index, renderTextGfx writes glyphs
  into the byte_203C4E0 text buffer with VRAM destination 0x6009560 + index*0x240 and glyph source dword_86B7AE0,
  then PlaySoundEffect(0x92) plays a UI sound. Once the counter reaches 0x60 it sets the state byte [r5,#1]
  to 0x14, clears [r5,#2], calls sub_801E780/sub_802BA18, and invokes sub_802BA34(5,3,0,9,0xE), which
  looks like a palette-fade/transition into the next state. The pool also holds 0xD0AB, 0x160 and byte_203C6E0
  used by sibling functions in the same state machine.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: counter at [r5,#0x10] incremented and compared to 0x10 and 0x60 gates the two behaviours; chip_SelectNameTextTable_8027D10
    called with ldrh [r5,#4] identifies the value there as a battle chip id; VRAM base 0x6009560 plus
    0x48*(index<<3)=0x240 per slot and text buffer byte_203C4E0 show chip-name tiles rendered into a per-slot
    VRAM region; PlaySoundEffect(0x92) fires once when the preview appears, typical of a UI reveal sound;
    at 0x60 frames state [r5,#1]=0x14 and a parameterised call to sub_802BA34 acts as the exit transition
  refs:
  - bn6f/asm/asm03_0.s:11690
  - 0x080005CC PlaySoundEffect
  - 0x08027D10 chip_SelectNameTextTable_8027D10
  - 0x08045F8C renderTextGfx_8045F8C
  reproduce: python3 tools/asmcat.py 0x0802B920
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-235109'
open_questions:
- no caller is known, so the exact screen (folder select, chip library, battle chip shuffle/trader) is
  unconfirmed
- sub_802B8B0, sub_801E780, sub_802BA18 and sub_802BA34 are undocumented, so what resource 0xA0AB/0xD0AB
  select and what the transition (5,3,0,9,0xE) means is unknown
