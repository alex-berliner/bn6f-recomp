  - 0x08134ADC sub_8134ADC
  - 0x080005CC PlaySoundEffect
  - 0x08134190 chatbox_runScript_803FD9C_on_eTextScript2028A20
  reproduce: python3 tools/asmcat.py 0x081351F4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and behavior are accurate per the asm: when r0==0 and r2==5 it picks script 8, else
    the byte at byte_813523C[r3]; when r0!=0 and r2==5 it picks 9, r2==1 picks 6, else 7; then stores
    r1 at chatbox+0x4C, runs the script, plays SOUND_CANT_JACK_IN, and copies [r5+3] to [r5+0xD] with
    0x10 written to [r5+2]. The summary incorrectly says "writes 8 to [r5+2]" — the code uses mov r0,#8
    then strb r0,[r5,#2], so 8 is correct, but the proposed name `folder_showMoveError` is a reasonable
    fit. A slightly more accurate name is `folder_chipMoveError`.; run wf investigate investigate-20261018-182231;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
