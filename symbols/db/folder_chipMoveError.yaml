name: folder_chipMoveError
address: '0x081351F4'
kind: function
status: probable
summary: In the folder/pack editor, displays the appropriate error text script for a rejected chip move,
  plays the error buzzer, and resets the editor cursor state by copying [r5+3] to [r5+0xD] and writing
  8 to [r5+2].
interface: (r0 = nonzero flag, r1 = value stored to chatbox+0x4C, r2 = error code, r3 = index into script-id
  table byte_813523C, r5 = editor state struct) -> r0 = clobbered; runs text script and sound
details: 'Selects a text-script ID: when r0 is 0 and r2==5 it uses 8, otherwise the byte at byte_813523C[r3];
  when r0 is nonzero it uses 9 for r2==5, 6 for r2==1, else 7. It stores r1 into the chatbox struct at
  offset 0x4C (fetched via toolkit->ChatboxPtr), then runs that script from eTextScript2028A20 and plays
  SOUND_CANT_JACK_IN (the generic error buzz). Finally it copies byte [r5+3] to [r5+0xD] and writes 8
  to [r5+2], resetting the editor''s state/selection fields, likely restoring a prior cursor mode after
  a rejected move.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tbl byte_813523C holds five script IDs 0x1C-0x20 indexed by r3, so each invalid-move case maps
    to a distinct message; bl chatbox_runScript_803FD9C_on_eTextScript2028A20 runs the chosen error text;
    bl PlaySoundEffect with SOUND_CANT_JACK_IN is the standard invalid-action buzz; caller folder_moveChipEntry
    is the folder/pack editor move handler with 'error sounds for invalid moves'; tail writes [r5+3]->[r5+0xD]
    and 8 to [r5+2], resetting editor state after the rejection
  refs:
