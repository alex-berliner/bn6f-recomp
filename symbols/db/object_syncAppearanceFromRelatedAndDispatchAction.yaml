name: object_syncAppearanceFromRelatedAndDispatchAction
address: '0x080C0FE8'
kind: function
status: probable
summary: Copies sprite appearance (color shader, palette, render info, facing, alpha/mosaic) from RelatedObject1Ptr
  onto the object, with a hidden-marker early-out that blanks rendering, then dispatches to one of three
  action handlers indexed by CurAction.
interface: (r5 = battle object header, r10 = toolkit) -> r0 = result of the dispatched action handler;
  clobbers r0-r3, lr
details: Runs each frame for a battle object whose appearance is derived from oBattleObject_RelatedObject1Ptr.
  If the current action is not 8 and the related object has ExtraVars+0x10 set (an 'invalid/hidden' marker),
  it zeroes the color shader and clears the final palette so the clone renders blank; otherwise it copies
  color shader, final palette, render-info high byte/flag10, DirectionFlip (combined with alliance via
  object_getFlip), and the mosaic/alpha scaling parameters from the related object. In battle mode 6 with
  battle index 0xC, it additionally clears flag bit 4 on the object header before syncing. Finally it
  calls an action-specific handler selected from a 3-entry table indexed by oBattleObject_CurAction (actions
  0-2), invoked via 'mov lr, pc; bx r1' so the handler returns back here.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_80C1024: sprite_getColorShader/sprite_setColorShader and sprite_getFinalPalette/sprite_setFinalPalette
    all use [r5,#oBattleObject_RelatedObject1Ptr] as source, r5 as target; loc_80C1014: tst of RelatedObject1''s
    ExtraVars+0x10 selects sprite_zeroColorShader+sprite_clearFinalPalette instead of the copy; DirectionFlip
    is loaded from the related object and passed through object_getFlip before sprite_setFlip, and sprite_getMosaicScalingParameters
    feeds sprite_setAlpha; GetBattleMode==6 && battle index 0xC gates clearing flag bit 4 of oObjectHeader_Flags;
    off_80C106C jump table indexed by oBattleObject_CurAction dispatches to one of three action handlers'
