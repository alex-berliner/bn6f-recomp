name: ai_scriptResetTimerTick
address: '0x08115654'
kind: function
status: probable
summary: Counts up a frame counter and, after 60 frames, resets an AI state's script ID to 0.
interface: (r5 = object/struct holding u16 timer at +0x6C, r6 = AI state struct) -> void; flags from cmp
  r1,#0x3C
details: Increments the halfword counter at [r5+0x6C] each call (presumably once per frame). When the
  count reaches 0x3C (60, i.e. one second), it stores 0 into the byte at [r6+oAIState_ScriptId], restarting
  the AI's script. The counter itself is never cleared here, so it keeps incrementing past 60 unless reset
  elsewhere; r5 and r6 are not set inside the function, so they must be prepared by the caller or be fixed
  registers across calls. No branches or other fields are touched.
