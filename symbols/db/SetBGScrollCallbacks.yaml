name: SetBGScrollCallbacks
address: '0x0800195C'
kind: function
status: confirmed
summary: Installs a set of BG scroll/HBlank callback pointers and hooks the HBlank callback into IRQ 4.
interface: void SetBGScrollCallbacks(void (*callback0)(void), void (*callback1)(void), void (*hblankCallback)(void));
  /* only acts when callback0 != NULL; returns r2 = hblankCallback, r3 = callbacks table (when installed), NZ from
  the tst on r0 */
details: 'Takes three callback function pointers in r0/r1/r2. If r0 (callback 0) is NULL the function

  returns immediately without touching anything; otherwise it stores all three pointers into

  the eBGScrollCallbacks struct: Callback0 at +0, HBlankCallback at +4, Callback1 at +8, then

  calls SetInterruptCallback(4, hblankCallback) to register the HBlank callback as the handler

  for interrupt line 4 (HBlank). On return r2 still holds the HBlank callback and r3 holds the

  callbacks table base address (only meaningful when the install path ran); r4 is preserved.

  Flags: NZ reflect the tst r0,r0 early-out check (or the mov r1,r2 / adds r2,#0 alias inside

  the install path before the call); C and V are never set by this function itself.

  '
