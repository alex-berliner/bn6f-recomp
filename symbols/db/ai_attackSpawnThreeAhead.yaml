name: ai_attackSpawnThreeAhead
address: '0x0810007C'
kind: function
status: confirmed
summary: AI attack action that spawns a 3-panel-long collision region line on the one, two and three panels directly
  in front of the acting battle object.
interface: (u8* battleObj in r5, AIAttackVars* attackVars in r7) -> r1 r2 = result regs of the final object_spawnCollisionRegion
  call; r4 r5 r6 r7 preserved (r4/r6 restored to entry values); clobbers r0 r3 lr and flags
details: 'Three times this helper reads the acting object''s facing direction via object_getFrontDirection (using
  r5 = the battle object as its argument), then calls object_spawnCollisionRegion to lay a collision region with
  length 3 panels whose near edge is 1, 2, then 3 panels ahead of the object: x = frontDirection*step + oBattleObject_PanelX,
  y = oBattleObject_PanelY. Each spawn is configured from the AI attack vars struct (r7): r2 = oAIAttackVars_InitFlag
  (byte), r6 = oAIAttackVars_Damage (word), r3 = 0, r4 = constant attribute word 0x4050301, and r7 = 3 (region length
  in panels; note r7 is temporarily reloaded with this constant and restored via push/pop). The facing direction
  is re-read before every spawn, so the three calls are independent rather than incremental. Only the r1/r2 results
  of the last (3-panels-ahead) spawn survive to the caller. The attribute word 0x4050301 is the shared constant
  for this attack family (bitfields, likely element/flag packing for the collision region).

  '
