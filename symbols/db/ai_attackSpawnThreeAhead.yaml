name: ai_attackSpawnThreeAhead
address: '0x0810007C'
kind: function
status: probable
summary: AI attack routine that spawns collision regions on the three panels directly in front of the
  attacker, using the AI attack vars for element and damage.
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = undefined; spawns 3 hit regions via object_spawnCollisionRegion
details: Three times in a row it calls object_getFrontDirection to get the +1/-1 facing multiplier, then
  spawns a collision region at PanelX + dir*k for k = 1, 2, 3, all at the object's PanelY. Every spawn
  passes r2 = oAIAttackVars_InitFlag, r3 = 0, r4 = 0x04050301 (attack attribute/element flags), r6 = oAIAttackVars_Damage,
  and r7 = 3 (likely panel height/extent of each region), so the attack fills the row segment ahead of
  the object. The attribute constant and the InitFlag/Damage fields come entirely from the AI attack variable
  block at r7. This matches AI chip/attack scripts executed during battle (routes battlesweep/beastsp/chips).
