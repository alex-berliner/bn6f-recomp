name: battle_objectClearPendingHitIfCollisionProcessed_8010198
address: '0x08010198'
kind: function
status: confirmed
summary: Consumes a battle object's pending hit counter from its collision data, but only when the collision actually
  produced effect flags.
interface: void sub_8010198(battle_object *obj /* r5 */); returns r3 = obj->collisionDataPtr; clobbers r0, r1 and
  NZ flags; caller passes lr
details: 'Reads the object''s collision data pointer from the battle object struct

  (oBattleObject_CollisionDataPtr) and keeps it in r3 for the caller. If the

  halfword at oCollisionData_Unk_26 (a pending hit / hit-frame counter) is

  nonzero AND the word at oCollisionData_FlagsFromCollision is nonzero, the

  counter is reset to 0. In effect, a registered hit is "used up" once the

  collision system has processed it into actual effect flags; a hit with no

  resulting flags is left pending. Note the counter is cleared only when both

  fields are nonzero - if flags are 0 the pending value is intentionally left

  for a later frame. Returns the collision data pointer in r3, which callers

  presumably use for follow-up checks.

  '
