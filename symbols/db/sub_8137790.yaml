name: sub_8137790
address: '0x08137790'
kind: function
status: probable
summary: When a new Beast chip is registered, shifts the currently equipped S-chip record from slot 1 to slot 2
  and loads the caller's record into slot 1, updating the beast-chip state bytes and a NaviStats flag.
interface: (r0-r3 = sChip_loadRecordIntoSlot args with the record for slot 1, r4 = record pointer, r7 = unused input)
  -> r0 = 1 if the shift ran, else 0
details: 'Reads byte_20018EE (unk_20018EC+2); if its high nibble is 1 it sets the return flag, swaps byte_20018ED
  and byte_20018EE (the two beast-chip slot state bytes), then shifts S-chip records: copies the 60-byte record
  at slot index 1 (S_Chip ptr + 0x3C) to slot index 2 (ptr + 0x78) via CopyWords, and calls sChip_loadRecordIntoSlot
  with the record passed in r4 into slot 1. Finally, if GetCurPETNaviStatsByte(0, 0x2D) reads 1, it writes 2 there
  — likely advancing the beast-overheat/usage state so a previously used Beast chip cannot be reused immediately.
  Returns 0 without touching anything if the high nibble check fails.'
