- method: assembly-reading
  date: '2026-10-18'
  detail: 'lsr r1, r0, #4; cmp r1, #1 gates the whole body and supplies the return value in r7; strb r0/[r3,#1]
    + strb r2/[r3,#2] swap the two state bytes at unk_20018EC+1/+2; mul r0, r2 / mul r1, r2 with 0x3C compute 60-byte
    record offsets 1 and 2 into the oToolkit_S_Chip_2002178_Ptr table before CopyWords; bl sChip_loadRecordIntoSlot_8021AB4
    with r0=r4, r1=1 loads the incoming record into slot 1; GetCurPETNaviStatsByte(0,0x2D)==1 followed by SetCurPETNaviStatsByte(0,0x2D,2)
    mutates one NaviStats byte'
