name: ai_attackCleanSubObjects
address: '0x080DA424'
kind: function
status: probable
summary: 'Battle-object cleanup: if ExtraVars is set, calls ai_attackHitClearState8 on it; then iterates six consecutive
  sub-object pointers at offsets 0x64-0x78 and frees each non-null one via sub_80D9532.'
interface: (r5 = battle object pointer, no register args) -> r0 clobbered by calls; no meaningful return
details: Takes the object in r5 (callers set it up). First loads [r5+oBattleObject_ExtraVars]; if non-null, calls
  ai_attackHitClearState8, which per its known summary clears the flag pointed to by the +0x60 pointer and resets
  the +8 state to 8. Then walks six consecutive pointer slots at r5+0x64..r5+0x78, and for each non-null pointer
  calls sub_80D9532 — almost certainly a free/despawn helper, since null slots are skipped and each is passed as
  r0. This is a destructor-style cleanup run when an attack object (chip-related, per the recorded route) is removed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0,[r5,#oBattleObject_ExtraVars]; bl ai_attackHitClearState8 — matches that callee's documented use
    of the +0x60 extra-vars pointer; mov r4,#0x64; add r4,r4,r5 then a 6-iteration loop over [r4] skipping nulls
    — a fixed array of 6 attached pointers; bl sub_80D9532 once per non-null pointer with the pointer in r0 — pattern
    of a per-entry free/remove call; Both callers (sub_80DA070, sub_80DA37A) run on the 'chips' route, consistent
    with chip-attack object teardown
  refs:
  - bn6f/asm/asm31.s:74103
  - 0x080DA070 sub_80DA070
  - 0x080DA37A sub_80DA37A
  - 0x080D9284 ai_attackHitClearState8
