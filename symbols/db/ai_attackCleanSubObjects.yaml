  reproduce: python3 tools/asmcat.py 0x080DA424
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise — The function
    loads ExtraVars and conditionally calls ai_attackHitClearState8, then walks six 4-byte pointer slots starting
    at r5+0x64 (r4 = 0x64, increments by 4 each loop with counter r6 = 5, i.e. 6 iterations covering offsets 0x64..0x78),
    freeing each non-null one via sub_80D9532. The summary is correct in describing cleanup of six sub-object pointers,
    but ''FreeExtraObjects'' already has the ''Free'' verb duplicated with the action; also the prefix should reflect
    this is on a battle object, and the ExtraVars block is more than just ''clearing a hit flag'' - it calls a dedicated
    clear function on the whole ExtraVars structure.; run wf investigate investigate-20261018-222121; proposed by
    Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
