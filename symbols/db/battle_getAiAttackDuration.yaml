name: battle_getAiAttackDuration
address: '0x080F6592'
kind: function
status: probable
summary: Returns the frame duration for an AI attack, used to initialize the AI attack-vars block
interface: (r0 = pointer to duration data, here dword_80F65A0) -> r0 = duration value stored into oAIAttackVars_AttackDuration
details: 'Thin wrapper: it loads the address of dword_80F65A0 (contents 0x3C3C3C3C, i.e. four bytes of
  0x3C = 60) into r0 and tail-calls sub_800FE28, returning its result. Its only caller, the AI attack-vars
  initializer sub_80F65EE, calls it right after loading AI attack params (with difficulty tier already
  fetched) and stores the return value halfword into oAIAttackVars_AttackDuration, then installs a panel-choose
  callback and finds the target object. The 0x3C3C3C3C table suggests per-tier (or otherwise indexed)
  duration entries of 60 frames each; sub_800FE28 presumably indexes/selects from the table passed in
  r0, possibly at random or by the current difficulty tier. The function itself has no logic beyond delegating
  to that selector with the data pointer.'
