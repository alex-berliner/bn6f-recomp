name: ow_dealDamageToCurrentNavi
address: '0x08142C46'
kind: function
status: probable
summary: Subtracts the given damage from the currently selected navi's HP and plays hit feedback (effect
  at player coords, camera shake, hit SFX).
interface: (r0 = damage amount) -> r0 = sound-effect id from last PlaySoundEffect call; writes new HP
  via sub_80010EC
details: 'Reads the PET''s current navi and its max/cur HP, computes curHP - r0 clamped to a minimum of
  0, and stores the result through sub_80010EC (which clamps stat 0x40 against the cap in stat 0x42).
  It then fetches the overworld player object''s X/Y/Z and calls sub_8004822 with effect id 0x13 and arg
  4 at those coords — likely a hit/damage flash effect on the player. camera_initShakeEffect_80302a8 is
  called with magnitude 1 and duration 0x14. Two sound effects play: 0x6B (a hit sound) and 0x10A (0xd
  + 0xff). byte_2006670 appears in the literal pool but is not referenced by any shown instruction, so
  its role is unclear.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub r4, r0, r4 / bge / mov r4,#0: computes curHP minus r0 and clamps to zero; bl sub_80010EC
    with (r0 = navi id, r1 = new HP) stores the clamped HP; ReadOWPlayerObjectCoords + sub_8004822(0x13,
    x, y, z, 4): spawns effect 0x13 at the player''s overworld position; camera_initShakeEffect_80302a8(1,
    0x14) and PlaySoundEffect(0x6B) then (0x10A) are standard hit feedback; Sole caller sub_808999C is
    unnamed, so call context is unconfirmed'
