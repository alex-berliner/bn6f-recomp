name: battle_panelTargetCursorUpdate
address: '0x0802AC6E'
kind: function
status: probable
summary: 'D-pad input handler for a battle object: moves a 1..3 / 1..3 panel-target cursor (redrawing
  via sub_802B5D0), selects up to two panels (rejecting panels with hole/broken flags 0xF800000 or flag
  0x10, playing a reject sound), reads a halfword from unk_2031000 at the object''s index after the first
  pick, and runs chatbox_runScript(TextScript8736D74) entering state 0x14 after the second pick, with
  B unselecting to state 0x10.'
interface: (r5 = battle object, joypad via toolkit r10) -> updates object fields; no return value
details: 'r5 is an object struct: fields #8 (cursor x, clamped 1..3), #9 (cursor y, clamped 1..3), #5
  (selection count), #7 (chosen value), #0x11 (index), #1 (state), #2 (timer). Each D-pad press shifts
  the cursor one cell, redraws via sub_802B5D0, and the end of the routine recomputes a cursor sprite
  offset (x*5-3, y*3+7) passed to sub_802AF0E. On A, it reads panel flags at the cursor via object_getPanelParameters:
  if flags & 0x0F800000 (hole/broken-style mask) or flags & 0x10, it plays a ''can''t select'' sound and
  aborts; otherwise it calls sub_802AF38/sub_802AF28, plays a select sound, and increments the selection
  count. On the first selection (count < 2) it loads a halfword from table unk_2031000 at [obj+0x11]*2
  into field #7 and enters state 0xC, unless the index is 0xFF, in which case it runs TextScript8736 via
  chatbox_runScript and enters state 0x14; after the second selection (count >= 2) it always runs that
  text script and enters state 0x14. On B it plays an unselect sound and enters state 0x10.'
