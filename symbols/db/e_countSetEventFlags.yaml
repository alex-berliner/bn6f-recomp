name: e_countSetEventFlags
address: '0x08143198'
kind: function
status: probable
summary: Counts the number of set event flags in a fixed group (size from sub_81433CA, base id from sub_81430B6)
  and returns the count in r0 with Z set when every flag in the group is set, used by ow_crowLessonInteraction
  to gate cutscene stages.
interface: () -> r0 = number of set flags; flags Z set iff r0 == total flags in group (r1 = total), N/C
  per cmp
details: The routine first calls sub_81433CA to get the group's flag count (r6), then sub_81430B6 with
  0 to get the group's base flag id (r7). It loops r6 times calling TestEventFlag on each successive flag
  id, incrementing r4 for each set flag. It re-fetches the total via sub_81433CA into r1, then executes
  cmp r0, r1 before returning r0 = count of set flags, leaving the equality flags so the caller can branch
  on 'all flags set'. It takes no arguments; the flag range is fixed by the two helpers.
