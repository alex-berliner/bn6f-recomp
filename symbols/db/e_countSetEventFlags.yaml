- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl sub_81433CA twice, once before the loop and once after — result used as loop bound r6 and
    as cmp operand r1 (group size); loop body: bl TestEventFlag on r7 then add r4,#1 when Z clear — counts
    consecutive flag ids starting at sub_81430B6(0); final cmp r0, r1 before pop — returns count while
    leaving ''count == total'' comparison for the caller; caller ow_crowLessonInteraction at 0x08142FC8
    is a flag-staged cutscene handler, consistent with ''are all stage flags done?'' checks'
