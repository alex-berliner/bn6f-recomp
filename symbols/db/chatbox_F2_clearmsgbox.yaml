name: chatbox_F2_clearmsgbox
address: '0x08041BD8'
kind: function
status: confirmed
summary: Text-script opcode F2 handler — clears the currently-printing message, resets the chatbox print state,
  and resumes the text script at the next opcode.
interface: 'void chatbox_op_F2_clearMsgBox(u32 r4_scriptPtr, u32 r5_chatbox); flags: NZ set (r0=1)'
details: "Handler for text-script opcode 0xF2 (\"clear message box\").\n- Sets event flag 0x200 via chatbox_set_eFlags2009F38.\n\
  - If oChatbox_TextScriptPrintSpeed is nonzero, mirrors it into the 3E flag word by\n  setting FLAGS_3E_UNK_0001\
  \ and clearing FLAGS_3E_UNK_0040.\n- Clears FLAGS_3E_UNK_0400 and FLAGS_3E_UNK_0800 (text-finished / wait-for-input\
  \ bits).\n- Advances the text-script pointer (oChatbox_CurrTextScriptPtr) past this opcode.\n- Zeros the print\
  \ state: oChatbox_TextScriptState_04=0, oChatbox_Unk_64=0,\n  oChatbox_Unk_12=0, oChatbox_CurrLine=0, oChatbox_Unk_17=0,\n\
  \  oChatbox_Unk_3D=0, oChatbox_Unk_80=0, oChatbox_Unk_78=4,\n  oChatbox_JumpTableOffset_11=1, oChatbox_Unk_74=1.\n\
  - Copies the current TextScriptCharIdx into oChatbox_Unk_94, then calls\n  chatbox_resetAndClearBuffers_8045F60\
  \ (passes that char index and a pointer to\n  the newly-stored byte at oChatbox_Unk_94).\n- Zeroes two halfword\
  \ scratch fields whose offsets are taken from the table at\n  off_8041C48 (entries 0x1D4 and 0x1D6).\nReturns\
  \ r0=1 (NZ) to indicate the opcode was handled.\nr5 (chatbox) is preserved; r1/r2 leak the table pointer/offset\
  \ to callers.\n"
