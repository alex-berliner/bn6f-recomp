open_questions:
- constants/enums/GameAreas.inc disagrees with this table after group 0x85; its enum has three unused groups between
  PAVILION_COMP and HOMEPAGES and one between COMPS_2 and CENTRAL_AREA (counting one group per new_group, HOMEPAGES
  would be 0x89), while its comments, this table and InternetLoadBGAnimJumptable put HomePages at 0x88 and Comps1/Comps2
  at 0x8C/0x8D; the GROUP_ constants are not used elsewhere.
- Whether anything stops the respawn command from running in a NULL group (0x84, 0x86, 0x87, 0x89-0x8B, 0x8E, 0x8F),
  or those groups have no maps it could run in (not read).
