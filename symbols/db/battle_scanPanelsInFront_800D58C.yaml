name: battle_scanPanelsInFront_800D58C
address: '0x0800D58C'
kind: function
status: confirmed
summary: 'Walks the panels one by one in the direction a battle object is facing, stopping at the first panel that
  holds something relevant to the object''s alliance, or at the first panel past the edge of the field.

  '
interface: 'Next sub_800D58C(void); takes the battle object pointer in r5 (inputs per contract also list r4, r6,
  r7, lr, but the code only reads r5 and the pushed r4/r6/r7 are popped unchanged). Returns the stopping panel index
  in r0 with N/Z set from it ("mov r0, r6"); r1-r3 are scratch after the calls and C/V are clobbered.

  '
details: 'Starts by calling sub_800D5BA (presumably object_getPanel) to get the panel index of the battle object
  passed in r5, then reads the object''s team from oBattleObject_Alliance and calls object_getFrontDirection to
  learn which way it faces (the per-step panel delta, e.g. +1/-1 or +/-6 for forward/back). It then loops: at each
  panel it calls sub_800D5F0(panel, alliance); if that reports a hit (non-zero), the loop stops and that panel index
  is returned. Otherwise the panel index is advanced by the facing direction and object_isValidPanel(panel, 1) checks
  whether the next panel is still on the 6x3 field; if it is not, the invalid panel index returned by object_isValidPanel
  becomes the result, so callers can detect "nothing in front, ran off the field". r6 is reused as the running panel
  index and r4/r7 hold the step/alliance; all three are saved and restored by the push/pop, so only r0 and flags
  escape. Useful for targeting moves that affect the nearest thing in front of an object.

  '
