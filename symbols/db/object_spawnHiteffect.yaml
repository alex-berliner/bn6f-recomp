name: object_spawnHiteffect
address: '0x0800EB9E'
kind: function
status: confirmed
summary: Plays the hit sound and spawns a hit-spark effect (effect type 8) over a battle object when it takes a
  collision carrying the hit-effect flag.
interface: void object_spawnHiteffect(BattleObject* obj /* r5, object just hit */); preserves r4-r7,r10; returns
  nothing meaningful (r0/r1 clobbered by calls)
details: 'Early-outs while the battle is paused (battle_isPaused). Reads the object''s collision data via oBattleObject_CollisionDataPtr
  (+ collision data pointer field) and tests oCollisionData_FlagsFromCollision against bit 0x20000 (the "spawn hit
  effect" flag); if clear, returns without doing anything. Otherwise plays sound effect 0x6E (object hit SFX), then
  builds an effect position from the object''s three fixed-point coordinate words at obj+0x34: the third coordinate
  (z/vertical) is raised by 0x100000 (=16.0 in fixed point) so the spark floats above the object. Calls AddRandomVarianceToTwoCoords
  with r0=15 to jitter two of the coordinates by up to 15 units, then calls sub_80E08C4 with r4=8 to spawn effect
  type 8 (the hit spark). r4 is used as scratch for the effect type and restored on exit (pushed/popped with r6,lr).

  '
