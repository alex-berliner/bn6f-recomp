name: bg_CopyTileBlock2At2_6_8x12_81245BC
address: '0x081245BC'
kind: function
status: confirmed
summary: Copies an 8x12 block of background tiles from tile block 2's table (unk_201EC2C) to position (j=2, i=6)
  in the background tilemap.
interface: void sub_81245BC(void) — no meaningful inputs or outputs; preserves r4-r7, exits with whatever r1/r2/flags
  CopyBackgroundTiles left behind
details: Trivial wrapper that hardcodes the six arguments of CopyBackgroundTiles and tail-calls it after saving/restoring
  r4-r7 (CopyBackgroundTiles may clobber them). Fixed arguments - j (dest column) = 2, i (dest row) = 6, which_tile_block_32x32
  = 2, tile_ids = unk_201EC2C, j_size = 8, i_size = 0xC - so it always repaints the same 8-wide by 12-tall region
  of the background with the same tile-id table. Which scene/menu this background belongs to isn't identifiable
  from the code alone; the source table unk_201EC2C lives in EWRAM/IRAM region 0x201EC2C. The odd r4/r7 preservation
  is only needed because the callee may trash the low registers, not because this routine uses them itself.
