name: clear_tableEntryFields
address: '0x0802D0BA'
kind: function
status: probable
summary: Fetches one entry from the IWRAM table at byte_203C4A0 and zeroes its first two words.
interface: () -> r0 = pointer to the entry's first word (return value of getTableEntryPtr32); flags clobbered
  by bl
details: Calls getTableEntryPtr32_802D064, which returns the address of a 0x20-byte entry within the IWRAM
  array at byte_203C4A0. It then stores 0 into offset 0 and offset 4 of that entry (two consecutive 32-bit
  fields), leaving the remaining 0x18 bytes untouched. The function returns that pointer in r0 (left over
  from the callee), which callers could use to fill in the rest of the entry. With no known callers, the
  meaning of these two fields and which index/bool the callee is invoked with cannot be determined from
  this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl getTableEntryPtr32_802D064 fetches a pointer into the byte_203C4A0 entry array; str r1,[r0]
    and str r1,[r0,#4] with r1=0 clear the entry's first two words; function is only 7 instructions and
    stores nothing else, so it is purely an initializer/clearer
  refs:
  - bn6f/asm/asm03_0.s:14975
  - 0x0802D064 getTableEntryPtr32_802D064
  reproduce: python3 tools/asmcat.py 0x0802D0BA
