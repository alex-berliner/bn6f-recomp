name: battle_tickChipLockout_8089CB4
address: '0x08089CB4'
kind: function
previous_names:
- sub_8089CB4
status: probable
summary: decrements ChipLockoutTimer (AIData+0x18) and returns whether it hit/exceeded zero this frame
interface: (r5 = *AIData) -> r0 = 0 if timer remained >0 after decrement, 1 if it reached 0 or was already
  <=0; r0 holds the new timer value on the 0 path
details: "Loads the u16 at r5+0x18 (AIData.ChipLockoutTimer per AIData.inc loc=0x19... actually struct\
  \ shows 0x18 as `Unk_18`; callers use it as a u16 halfword here) into r0, does `sub r0, #1`, and on\
  \ BLT (i.e. the result was negative, meaning the timer was 0 and underflowed) sets r0=1. Otherwise stores\
  \ the decremented value back to [r5,#0x18] with `strh r0,[r5,#0x18]` and returns r0=0. Uses Thumb `mov\
  \ pc, lr`, so it is a non-save leaf. r1/r2/r3/r4 are not touched.\n  Equivalent to: `return val = (uint16)(AIData->field_0x18\
  \ - 1); AIData->field_0x18 = (val & 0x8000) ? val : (uint16)val; return (val & 0x8000) ? 1 : 0;` — i.e.,\
  \ a saturating-decision test for \"did the timer expire this frame\".\n  18 distinct in-function callers\
  \ in the `sub_80897xx..sub_8089Cx` cluster all live in the same function (`sub_80897E8`'s jump-table\
  \ driven AI/beastout step), so this is a per-frame AI timer tick helper.\n"
