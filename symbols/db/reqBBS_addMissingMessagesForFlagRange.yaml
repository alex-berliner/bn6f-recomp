name: reqBBS_addMissingMessagesForFlagRange
address: '0x08000FE6'
kind: function
status: probable
summary: For a consecutive range of event-flag IDs, posts a BBS message for each flag that is not yet
  set, unlocking any board posts the player hasn't received.
interface: (r0 = first event flag id, r1 = number of flags) -> r0 = clobbered; loops from flag r0 while
  count r1 > 0, decrementing after each
details: Iterates over flag IDs starting at r0 for r1 iterations. Each pass calls TestEventFlag on the
  current ID; if the flag is clear (Z set), it calls reqBBS_addBBSMessage_813e5dc, which sets that flag,
  sets a mirror flag, and appends the message number to the board's circular message table. Flags already
  set are skipped, so the BBS system can back-fill several consecutive messages (e.g. on load or after
  a story jump) without duplicating entries. The two loop counters live in r6/r4; no other state is touched.
