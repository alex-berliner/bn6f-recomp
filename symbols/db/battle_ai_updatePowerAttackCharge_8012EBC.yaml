open_questions:
- Why r10 is in the in-register contract (no AIData access uses it; presumably callers pass
- BattleStatePtr in r10 and battle_isTimeStop reads it).
- The exact mapping between the 0x20000/0x40000 bits and the B vs A button halves is inferred
- from the strb r1,#1 / strb r1,#2 writes; matching these against the AIData PwrAtkButton enum
- would settle it.
