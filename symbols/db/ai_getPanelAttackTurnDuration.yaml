name: ai_getPanelAttackTurnDuration
address: '0x080F9EA4'
kind: function
status: probable
summary: Returns the enemy panel-attack turn duration for the current difficulty tier (30/40/50/60 frames),
  with 60 frames added if the battle object's flag word has any of mask 0xA000 set.
interface: () -> r0 = turn duration in frames (30/40/50/60 by tier, +60 if flag 0xA000 set); no flags
details: Loads the literal table at dword_80F9EC4 whose little-endian bytes are 3C,32,28,1E = 60,50,40,30
  frames — one entry per difficulty tier — and calls sub_800FE28 with that table to pick the entry matching
  the current tier. It then reads the battle object's first flag word via object_getFlag and, if any of
  mask 0xA000 (bits 15/13) is set, adds 0x3C (60 frames) before returning. The caller ai_initPanelAttackTurn
  uses this value as the attack turn's duration and boost, matching its 'fetches duration and boost' description.
  The flag check likely detects an enraged/buffed enemy state granting longer attack turns.
