name: SetBattleNaviStatsByte_AllianceFromBattleObject
address: '0x08013754'
kind: function
status: confirmed
summary: Writes one byte into the NaviStats record of the navi a battle object represents, selecting the real record
  or its ghost copy based on the object's alliance flag.
interface: 'void SetBattleNaviStatsByte_AllianceFromBattleObject(u8* stats_offset = r1, u8 value = r2, BattleObject*
  obj = r5); // calls GetBattleNaviStatsAddr(alliance = [r5+oBattleObject_Alliance]) to get &NaviStats, then stores
  value at statsOffset within it

  '
details: 'Reads the battle object''s Alliance byte (0 = player''s own navi, nonzero = linked/ghost side) and passes
  it to GetBattleNaviStatsAddr, which returns the address of the corresponding NaviStats record (real record vs.
  the ghost/duplicate copy used for the linked side during battle). Then stores the single byte in r2 at offset
  r1 within that record. So this is a generic "set one byte of the current battle navi''s stats" helper, parameterized
  by the offset into NaviStats and the value. r5 is used as-is (caller-owned pointer, not listed as an input/outputs
  contract entry but clearly an input). Preserves r6/r7; r1, r6, r7 are corrupted/returned per contract (r6/r7 restored
  by pop before the caller sees them, since the bl happens while they hold saved copies). Flags NZCV pass through
  from the STRB (and the popped PC restore path).

  '
