details: 'Switches on entity->state at offset 7. State 0 -> action 5 only if detail==1 else 0.

  State 1 -> action 0xA if detail==2, action 6 if detail<2, else 0. State 0xA -> action 0xF.

  Any other state -> action 7 if detail<2 else 0. Touches the entity struct at r5 (offsets 7 and 8).


