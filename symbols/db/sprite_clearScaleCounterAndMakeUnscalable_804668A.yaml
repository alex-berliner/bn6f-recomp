name: sprite_clearScaleCounterAndMakeUnscalable_804668A
address: '0x0804668A'
kind: function
status: confirmed
summary: Zeros a sprite's scale/cycle counter byte and rebuilds the sprite as unscalable.
interface: void sprite_clearScaleCounterAndMakeUnscalable(/* r5 */ u8* scaleCounter)
details: 'Tiny wrapper: stores 0 into the byte pointed to by r5 (the sprite''s scale/cycle counter field), then
  tail-calls sprite_makeUnscalable with r0 = 0 so the sprite''s scaling state is recomputed from the cleared counter.
  The caller''s r4-r7 are preserved by the push/pop; r0-r3 and the flags are clobbered by the call. Only r5 is meaningfully
  used from the caller''s register set despite the contract listing r4-r7 and lr as inputs.

  '
