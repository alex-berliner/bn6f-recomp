name: Clear_eStruct2000780
address: '0x08003908'
kind: function
status: confirmed
summary: Zeroes the 0x48-byte scenario effect state block at 2000780, resetting all scenario/effect state fields
  to their defaults.
interface: 'void Clear_eScenarioEffectState(void); /* inputs: none; outputs: none; preserves r2-r7, clobbers r0-r1
  and flags */'
details: 'Loads the address of the eScenarioEffectState2000780 work area into r0 and a size of 0x48 bytes into r1,
  then calls ZeroFillByWord, which word-fills (writes zero words to) the entire block. The function takes no arguments
  of its own and returns nothing; it only clobbers r0, r1, lr, and the condition flags. The 0x48-byte block presumably
  holds per-scenario effect/cutscene state (flags, timers, counters) used by scenario scripting, and clearing it
  is a reset/init operation, likely called when a scenario or game segment starts or restarts. The "e" prefix and
  2000780 naming indicate it is EWRAM data.

  '
