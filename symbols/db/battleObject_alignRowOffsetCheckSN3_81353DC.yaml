  date: '2026-10-14'
  detail: '- `mov r0, #0x24 ; mov r1, #0xa5 ; mov r2, #0x28 ; mov r3, #4` at 0x081353E2..EE shows the
    four literal args fed to `battle_alignRowCheck_81348DC`. - `mov r4, #6` immediately before the bl
    is the fifth arg (r4) the callee reads. - `push {r4,lr}` / `pop {r4,pc}` plus single `bl battle_alignRowCheck_81348DC`
    show this is a leaf trampoline, not a sequence. - All six captured `snap_battles1_*` entries show
    identical r0=0x1c, r1=0x12, r2=0x478, r3=0 and identical exit r0=1, confirming the helper runs once
    with fixed inputs and reports aligned. - The callee''s contract (`battle_alignRowCheck_81348DC`) is
    described as "Verifies a battle object''s column position against its expected row offset; if aligned,
    repositions the object and clears a misalignment flag, otherwise sets the flag." — directly explains
    the r0=1 / -ZC- exit on success.'
