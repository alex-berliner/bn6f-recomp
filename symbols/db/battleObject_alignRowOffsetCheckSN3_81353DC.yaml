status: probable
summary: Hard-coded row-alignment check for the BattleObject at panel column 6, used as a one-shot reposition
  helper.
interface: '() -> r0 = "offset delta result" (1); side effects: clobbers r0-r3, may invoke `battle_alignRowCheck_81348DC`.'
details: "This is a tiny trampoline that loads four literal arguments into r0-r3 and forwards\n  them\
  \ to `battle_alignRowCheck_81348DC`, then returns its r0 to the caller. The\n  arguments are:\n    r0\
  \ = 0x24, r1 = 0xa5, r2 = 0x28, r3 = 4, r4 (passed via r4) = 6.\n  Mapping onto `battle_alignRowCheck_81348DC`'s\
  \ expected BattleObject fields, these\n  are panel/column targets, not just register noise: 0x24 is\
  \ the BattleObject's\n  HP offset and 0x28 the NameID/Chip offset, but the helper only consumes them\
  \ as\n  raw word inputs, so they likely encode panel-coordinate offsets encoded into\n  byte pairs.\
  \ The fifth argument, 6, is the panel column the caller is gating on.\n  The function is leaf-like:\
  \ it pushes {r4,lr}, sets up r4=#6, bl's the helper,\n  and pops to pc. Two trailing `.byte 0, 0` are\
  \ alignment padding for the next\n  thumb symbol.\n  All 6 captured calls share identical inputs and\
  \ the same r0=1, -ZC- exit, meaning\n  the alignment always succeeds for this caller. It is reached\
  \ from the\n  submenu/scene-update dispatchers in the battle_objectUpdate / sub_8133484 /\n  sub_81337E8\
  \ / sub_81338D4 / sub_8133944 / sub_8133C9C cluster, suggesting it\n  fires every frame for the same\
  \ fixed panel slot (likely a \"is the slot-6 enemy\n  sitting on its row?\" probe used by SN3 enemy\
  \ formation).\n"
