- '`battle_alignRowCheck_81348DC` is not resolvable from this function alone —'
- reading that helper's body is needed to map them to BattleObject fields. The
- 'reason this dedicated trampoline exists (vs. inlining) is also unclear: it'
- may simply be a shrink-table slot.
- Determining the precise battle-object/panel slot it targets would require
- cross-referencing its six callers' r5/BattleObject setup.
