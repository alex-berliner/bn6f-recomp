name: object_countdownTimer
address: '0x081386F0'
kind: function
status: probable
summary: Counts down a frame timer on an object's work area and clears a state/active byte flag when it
  reaches zero.
interface: (r5 = object work struct) -> void; sets flags via the countdown compare
details: 'Loads the halfword at r5+6, decrements it, and stores it back; if it is now nonzero the function
  returns, otherwise it writes 0 to the byte at r5+3. This is a classic wait-N-frames pattern on an object/work
  struct: field +6 is a countdown counter and field +3 is a byte flag (likely an active/state/phase byte)
  that is cleared once the timer expires. No other registers or memory are touched, and it tail-returns
  with pop {pc}. The caller sub_81386CC presumably invokes this as one step of a state machine for that
  object.'
