- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r5,#6]/sub r0,#1/strh r0,[r5,#6] — decrement of a halfword timer field; bne locret
    — early return while the timer is still counting; mov r0,#0; strb r0,[r5,#3] — clears a byte flag
    only when the timer hits zero; 8-instruction tail-call leaf (pop {pc}) — pure per-frame tick handler,
    no other side effects
