name: t3_setStateAndFadeScreen
address: '0x081311F0'
kind: function
status: probable
summary: Switches a state/context variable to 0x14 (20) and starts a screen fade with parameters (12,
  16).
interface: (r0 = unused by body, caller context) with r5 = global state/context struct pointer -> r0 =
  SetScreenFade return (void); no flags meaningful
details: Stores 0x14 into byte r5+2, which looks like a state/phase selector for the surrounding engine
  (r5 is a struct base set up by the caller, not an argument). It clears the halfword at r5+0x26 and writes
  0xFEDB to the halfword at r5+0x2a, likely a parameter or id consumed by the new state (0xFEDB is negative
  as s16, possibly a sentinel/special id). It then calls sub_8131EE4 (unknown helper, likely initializing
  the new state) and finishes with SetScreenFade(0xc, 0x10), a screen fade transition. The whole routine
  is a 'enter next phase and fade the screen' step.
