name: zeroFill_80007B2
address: '0x080007B2'
kind: function
status: confirmed
summary: Zero-fills the 0x20C-byte work memBlock pointed to by dword_200A490.
interface: void zeroFillWorkMemBlock(void) — takes nothing meaningful (r2/r3 preserved for callers); c/v flags are
  whatever ZeroFillByWord leaves.
details: 'A fixed-size initializer: loads the pointer stored at dword_200A490 into r0, loads the constant 0x20C
  (numWords) into r1, and calls ZeroFillByWord to clear that region word-by-word. The destination address is not
  an argument — it always targets the single global "memBlock" whose pointer lives at 0x200A490, so this is a reset/initialization
  routine for that work buffer. r2 and r3 are explicitly preserved across the call (the zeroFiller itself uses r0/r1
  only). No return value; lr is popped straight to pc, so callers only see the flags left by ZeroFillByWord.

  '
