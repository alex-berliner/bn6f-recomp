name: sub_801BE04
address: '0x0801BE04'
kind: function
status: confirmed
summary: Computes an 8-way direction bitmask describing which of the 8 grid directions point B lies in relative
  to point A (i.e. the step needed to go from A toward B).
interface: u32 calc8DirBitmaskTowardsPoint(s32 x_a /*r0*/, s32 y_a /*r1*/, s32 x_b /*r2*/, s32 y_b /*r3*/); returns
  direction bits in r0; leaves C/V set from the final SUBS r1, r1, r3 (callers may rely on this)
details: "Pure arithmetic helper with no memory access. It compares the two points\ncoordinate-wise with exact signed\
  \ comparisons (sub/bgt/blt pairs, relying on\nthe overflow flag, so callers get C/V reflecting the last subtraction):\n\
  \  x: (x_a > x_b) -> 8, (x_a < x_b) -> 4, equal -> 0\n  y: (y_a > y_b) -> 2, (y_a < y_b) -> 1, equal -> 0\nand\
  \ returns the OR of the two parts. Values are single-bit flags per axis\n(2 bits of x in bits 3-2, 1 bit of y\
  \ in bits 1-0), so each axis independently\nencodes negative / zero / positive direction; e.g. B up-and-right\
  \ of A gives\n8 | 2 = 0xA. The verified C notes the y example \"A up-and-right of B yields\n8 | 2 = 0xA\", which\
  \ implies the y axis convention matches the game's grid\ndirection (the inline comment's \"above/below\" wording\
  \ is inconsistent with\nits own example, so treat bit 2 as the \"positive y\" direction). No memory,\nstructures,\
  \ or globals are touched; only r0 is returned and r1 is scratch.\nLikely used to pick a facing direction or one-tile\
  \ step toward a target\n(NPC movement, cursor, or battle grid navigation).\n"
