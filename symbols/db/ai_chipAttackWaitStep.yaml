name: ai_chipAttackWaitStep
address: '0x080EE604'
kind: function
status: probable
summary: 'AI chip-attack state step: on first run decrements a counter on the temp attack object and starts
  a 6-frame wait timer, then clears the attack links and exits the attack state when the timer expires.'
interface: (r7 = AI attack vars struct, r5 = battle object) -> updates StepTimer, AttackElement, TempAttackObjectPtr->0x10;
  on expiry clears RelatedObject1Ptr and AIData TempAttackObjectPtr and calls object_exitAttackState;
  no return value
details: 'Uses oAIAttackVars_AttackElement as a phase flag: when it is 0, the function reads AIData_TempAttackObjectPtr
  from the battle object, decrements byte 0x10 of that temp attack object (likely remaining shots/uses),
  sets StepTimer to 6, and sets AttackElement to 4 so the init runs only once. Every call then decrements
  StepTimer; while it stays >= 0 the function just returns. Once the timer goes negative, it nulls oBattleObject_RelatedObject1Ptr
  and AIData_TempAttackObjectPtr and calls object_exitAttackState to end the attack. This matches an AI-driven
  chip attack that fires (count tracked in the temp object) then waits briefly before releasing the spawned
  attack object.'
