name: battle_commitPanelMove
address: '0x080EADDC'
kind: function
status: probable
summary: 'Commits a battle object''s planned panel move: copies the future panel coordinates into its
  current panel slot, re-reserves the panel, clears movement flags, and initializes a follow-up state
  struct.'
interface: (r1/r5 = battle object, r3/r6 = state struct) -> r0 = clobbered; writes state struct {h0=4,
  b4=0, b5=0xC} and mutates the object's panel/reserve/flag fields
details: 'Operating on the object in r5, it first clears ObjectFlags1 bit 0x400000, then copies FuturePanelX/Y
  into PanelX/Y so the planned move becomes the object''s actual position. It releases the object''s previous
  panel reservation (object_removePanelReserve), recomputes pixel coordinates from the new panel (object_setCoordinatesFromPanels),
  and updates collision panels. It then clears ObjectFlags1 bits 0x1040 and ObjectFlags2 bit 0x10, copies
  the now-current PanelX/Y back into FuturePanelX/Y, and re-reserves the panel via object_reservePanel.
  Finally it sets the OBJECT_FLAGS_CANNOT_SLIDE bit in ObjectFlags1, preventing further sliding, and initializes
  the struct passed in r3: halfword at +0 = 4, byte at +4 = 0, byte at +5 = 0xC, which looks like a new
  action/movement phase with its counters (state 4, timer 0, duration 12).'
