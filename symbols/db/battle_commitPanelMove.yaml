name: battle_commitPanelMove
address: '0x080EADDC'
kind: function
status: confirmed
summary: Commits a battle object's queued panel move — the target panel becomes its current panel, reservations
  are swapped, position/collision data refresh, and the move-request state resets.
interface: void battle_commitPanelMove(moveRequest r3, BattleObject *r5) — outputs r1/r4 (stale values left by callees,
  read by callers); clobbers r0-r3, flags, lr; preserves r4(as passed? no—r4 output)/r6
details: 'r3 points to a small move-request/step struct and r5 to a battle object. Clears the "panel move pending"
  flag (bit 22, 1<<22) on the object, copies oBattleObject_FuturePanelX/Y into oBattleObject_PanelX/Y, releases
  the reservation on the old panel (object_removePanelReserve), recomputes pixel coordinates (object_setCoordinatesFromPanels)
  and collision panel data (object_updateCollisionPanels), then clears the step/slide bookkeeping flags via pool
  literal dword_80EB03C = 0x1040 and flag 0x10 through object_clearFlag2. It reserves the newly occupied panel (object_reservePanel)
  after syncing FuturePanelX/Y back to PanelX/Y, and sets OBJECT_FLAGS_CANNOT_SLIDE so the object cannot slide again
  until the move animation finishes (object_setFlag1). Finally it resets the move-request struct at r3: byte+4 =
  0 (step index), byte+5 = 0xC (wait timer, 12 frames), halfword+0 = 4 (state/phase). r6 is saved/restored around
  the calls because object_updateCollisionPanels clobbers it. r1 and r4 outputs come from object_setFlag1 and object_updateCollisionPanels
  respectively; callers read them, so the values are whatever those callees leave.

  '
