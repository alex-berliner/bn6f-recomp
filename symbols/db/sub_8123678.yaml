name: sub_8123678
address: '0x08123678'
kind: function
status: hypothesis
summary: Runs a check (sub_81190F8 with argument 0); on success sets the object's state byte to 4 and advances the
  object via sub_8123D70, otherwise does nothing.
interface: void sub_8123678(r5 = object pointer); outputs r0 and flags from the last callee; preserves r4-r7
details: Tail-call-style state handler for an object (likely an NPC or interactable) whose state machine byte lives
  at offset +3. It calls sub_81190F8 with r0 = 0, which appears to be a shared check/routine whose nonzero result
  means 'condition met'. If the check fails the function returns immediately without touching the object. If it
  succeeds it stores the constant 4 (the next state ID) into the object's state byte at +3 and calls sub_8123D70,
  presumably the per-state dispatcher/advance routine for this object family. Note that the 'if' in the verified
  C is written as R0 != 0 while the assembly branches on EQ after the call, so the branch polarity relies on sub_81190F8
  returning its result in the flags rather than only r0.
