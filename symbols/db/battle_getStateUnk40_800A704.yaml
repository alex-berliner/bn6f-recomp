name: battle_getStateUnk40_800A704
address: '0x0800A704'
kind: function
status: confirmed
summary: Returns the value of field oBattleState_Unk_40 from the current battle state.
interface: uint32 battle_getStateUnk40_800A704(void) — reads r10 (toolkit pointer); returns r0
details: 'Tiny leaf getter. Follows the toolkit pointer at r10 (oToolkit_BattleStatePtr) to get the

  current battle state pointer, then loads and returns the word at offset oBattleState_Unk_40.

  Uses `mov pc, lr` to return, so it never touches the stack and preserves all registers

  except r0. Callers pass r10 in (the global toolkit base, always live in this game) and lr

  is the return address. The meaning of oBattleState_Unk_40 is not yet identified, so the

  name is placeholder-quality until that field is named.

  '
