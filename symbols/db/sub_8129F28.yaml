name: sub_8129F28
address: '0x08129F28'
kind: function
status: confirmed
summary: Draws one battle/sprite object by dispatching on the record's kind byte, then commits the sprite to OAM
  if its visibility flag is set.
interface: '// r5 = record pointer; other live regs (r2,r3,r4,r6,r8,r9,r10,r11,r12) passed

  // through to the per-kind handler.

  // clobbers r0-r9,lr; flags nzcv; preserves nothing explicitly.

  // returns updated state in r5, r6, r10, r11.

  void drawBattleObject_8120400(void /* via r2..r12, record in r5 */);

  '
details: 'Reads the kind byte at record+2 (rdr5, r1), ldrs off_8129F3C (-> [0x08129F40])

  to obtain a 2-entry jump table, then loads the handler address

  [table + kind] into r0 and tail-calls it with mov lr, pc / bx r0.

  Two handlers are registered so far: sub_8129F48 and sub_8129F88.

  After the kind-specific draw returns, control falls into

  sprite_drawIfFlagSet_812B504 which commits the sprite to OAM if the

  record''s visibility flag is set (returns updated r5/r6 and leaves r10,

  r11 alone).

  Per-kind handler outputs: r5/r6/r10/r11; OAM-commit outputs: r5/r6.

  pop {pc} is used to return to the caller, so lr is the saved caller.

  Note: the address label is 0x08129F28 but the proposed address suffix is

  8120400 to match the disassembly''s naming style for low-address functions

  in this module — original 8129F28 is kept in the name via the symbol''s

  existing address.

  '
