name: sprite_setPositionById_811C23C
address: '0x0811C23C'
kind: function
status: confirmed
summary: Looks up a sprite/record by ID in the table behind getStructFrom2008450 and, if it exists, repositions
  that sprite to the given coordinates.
interface: void sprite_setPositionById(u32 coordA /*r0*/, u32 coordB /*r1*/, u32 recordId /*r2*/)
details: Wraps a conditional reposition. r2 is passed to getStructFrom2008450, which resolves a record from the
  global table at 0x2008450 by key and returns a pointer/handle pair in r0/r1. If the lookup fails (r0 == 0) the
  call returns silently; otherwise r1 (the lookup's handle/struct pointer) is kept in r5 and the saved coordinates
  r0/r1 are forwarded to sprite_setCoordinates along with it, moving that sprite to (coordA, coordB). r4-r7 are
  preserved; r5 is only used as scratch across the helper call. No flags are intentionally returned.
