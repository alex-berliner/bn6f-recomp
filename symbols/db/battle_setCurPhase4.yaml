details: 'Writes the immediate value 4 as a halfword into the caller''s battle object at oBattleObject_CurPhaseAndPhaseInitialized
  (the field combining current phase and phase-initialized flag), then returns. This is a phase-advance
  step: callers in this engine typically strh a phase constant into this field at the end of each phase''s
  handler, so this is the handler tail that moves the object into phase 4. It is a tiny shared ''goto
  next phase'' helper rather than anything game-specific. No argument setup or result use is visible because
  no callers are recorded.'
