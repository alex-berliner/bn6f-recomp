name: ai_attackStrikeStep
address: '0x080FFC18'
kind: function
status: probable
summary: 'AI attack step: commits the enemy onto its targeted panel (with move animation and flags) and,
  after a 2-frame timer, arms the attack hit as element 8.'
interface: (r0 = unused/scratch, r5 = battle object, r7 = oAIAttackVars) -> r0 = clobbered; flags from
  subs
details: This is one step of an enemy AI attack state machine keyed off oAIAttackVars_AttackElement. On
  first entry (element 0) it sets element to 4, plays animation 3, copies FuturePanelX/Y into PanelX/Y,
  releases the panel reserve, recomputes pixel coordinates and collision panels, clears flag 0x40, and
  sets the 'currently moving' ObjectFlags1 bit, with StepTimer = 2. On later calls it decrements StepTimer
  and, when it reaches 0, writes HitElement = 8, which presumably triggers the actual hit/effect on the
  following step. The r5/r7 registers are inherited from the caller's AI attack context rather than passed
  explicitly.
