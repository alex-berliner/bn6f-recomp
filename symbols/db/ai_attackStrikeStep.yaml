- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] / bne loc_80FFC50 — state machine keyed on attack element;
    strb FuturePanelX/Y -> PanelX/Y + object_removePanelReserve + object_setCoordinatesFromPanels — commits
    the planned move; object_setFlag1 with bit (1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) — marks the object
    as moving; strh #2 -> StepTimer then decrement-until-zero branch — short timed delay; strh #8 -> oAIAttackVars_HitElement
    at timer expiry — final hit setup'
