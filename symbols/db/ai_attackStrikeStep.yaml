name: ai_attackStrikeStep
address: '0x080FFC18'
kind: function
status: confirmed
summary: One AI step of a melee "strike" attack — on the first call it steps the battle object onto its reserved
  panel and starts the attack animation, then counts down a short timer before flagging that the strike's hit should
  connect.
interface: void ai_attackStrikeStep(battleObject* obj /* r5 */, aiAttackVars* vars /* r7 */); outputs r1 only as
  a leftover from object_setFlag1 on the start path; no flags guaranteed
details: "r5 is the battle object and r7 points into that object's AI attack variables\n(oAIAttackVars). Behavior\
  \ is split on vars->AttackElement:\n\nStart path (AttackElement == 0, strike not yet begun):\n  - Sets vars->AttackElement\
  \ = 4 (strike-in-progress marker).\n  - Sets obj->CurAnim = 3 (attack animation).\n  - Copies obj->FuturePanelX/FuturePanelY\
  \ (the panel reserved on earlier\n    AI frames) into obj->PanelX/PanelY, i.e. the object lunges onto the\n  \
  \  pre-reserved target panel.\n  - Calls object_removePanelReserve(x, y, obj) to free that reservation,\n    object_setCoordinatesFromPanels(obj)\
  \ to sync pixel coordinates,\n    object_updateCollisionPanels(obj) to refresh hitboxes,\n    object_clearFlag(0x40,\
  \ obj), and\n    object_setFlag1(1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT, obj) to mark\n    the object as currently\
  \ moving.\n  - Sets vars->StepTimer = 2.\n\nCountdown path (AttackElement != 0):\n  - Decrements vars->StepTimer\
  \ (halfword). While the result is > 0 it just\n    returns (bgt). When the timer reaches 0 it stores HitElement\
  \ = 8, which\n    a later damage/hit step reads to actually apply the strike's damage.\n\nConstants: strike AttackElement\
  \ = 4, initial StepTimer = 2, HitElement\nwritten = 8. Quirk: on the start path r1 on return is whatever\nobject_setFlag1\
  \ left there (the function never computes its own r1\nresult); on countdown frames r1 is untouched.\n"
