    run wf investigate investigate-20261019-033611'
open_questions:
- who sets r5 and what structure [r5+1] belongs to (state byte? timer? menu index?)
- meaning of RFU flag bits 0x40, 0x20, 0x10, 0x8 in the shared state at 0x200BC50
- what sub_803C330/sub_803C2A0/sub_803A104/sub_8049BC0 do; no callers of this routine are known
