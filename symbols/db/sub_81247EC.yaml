name: sub_81247EC
address: '0x081247EC'
kind: function
status: confirmed
summary: Renders the six fixed help/library entry description lines (text ids 0x80-0x85 of TextScript873D9FC) into
  RAM text buffers and pre-generates their 8x1-tile VRAM tiles.
interface: void sub_81247EC(void); /* inputs r10, lr (passed through to the renderer, r10 not used here); clobbers
  r0-r3, lr, flags; r4-r9 preserved; r5/r8-r12 left as renderTextGfx_8045F8C leaves them */
details: 'Fixed six-iteration loop (i = 0..5) that calls renderTextGfx_8045F8C once per line. Per iteration it loads:
  the text id (halfword) from byte_8124864[i] (values 0x80..0x85, i.e. six consecutive entries of text script bank
  TextScript873D9FC), the destination RAM text buffer off_812482C[i] (unk_201C4DC, unk_201CB5C, unk_201D1DC, unk_201D85C,
  unk_201DEDC, unk_201E55C — evenly spaced 0x680 apart, so each is one preallocated text line block), and the VRAM
  tile destination byte_8124848[i*4 as halfword pair] = 0x06004000 + i*0x200 (VRAM character blocks, one tile row
  per entry). renderTextGfx_8045F8C is called with width=8 tiles, height=1 tile, graphics source dword_86B7AE0 (font/gfx
  bank), and flag r7=0. The loop counter is kept on the stack at [sp]. Each entry therefore gets an 8x1-tile strip
  of generated text tiles at a fixed VRAM slot, presumably blitted later by the help-library screen when an entry
  is displayed. The six buffers/tile rows strongly suggest one screen showing six description lines at once (e.g.
  the help/info library page rendering the descriptions for the current page''s six entries).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
