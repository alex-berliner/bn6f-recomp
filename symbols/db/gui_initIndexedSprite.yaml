open_questions:
- No callers are known, so the object struct layout (fields at +0, +5, +7) and what gameplay system owns
  it are unconfirmed
- The meaning of the 0x300-based halfword written into the slot list is unknown
- Which screen or menu these five variants appear on (byte_811D940 currently all 0x53, so the disable
  path never triggers with shipped data)
