name: battle_pickPanelNearClosestEnemy
address: '0x08116090'
kind: function
status: probable
summary: 'Battle AI helper: finds the enemy closest to the acting object (opposite team), reads its panel
  coords, and picks a random nearby panel from a relative-offset list using alliance-dependent panel-effect
  parameters.'
interface: (r5 = battle object) -> r0 = result of panelFlagCheck_8015D80 (chosen panel/param word); r4/r7
  clobbered as callee-saved restored
details: 'Reads the acting object''s oBattleObject_Alliance byte and XORs it with 1 to get the opposing
  team, then calls battleObject_findClosestEnemyBattleObject_80103F8 to get the nearest enemy of that
  team. From that enemy it loads the two panel-coordinate bytes at offsets 0x12 and 0x13 and passes them
  with table pointer byte_8116190 to GetAllianceDependentPanelParamArgs, which selects an 8-byte alliance-indexed
  panel-effect parameter entry (param word + args pointer). Finally it calls the AI''s filtered random
  relative-panel picker panelFlagCheck_8015D80 with candidate list byte_8116180, which transforms the
  relative offsets by facing and checks panel flags. Net effect: select a panel in the vicinity of the
  closest enemy, parameterized by team, presumably for an attack/panel effect in the battlesweep route.'
