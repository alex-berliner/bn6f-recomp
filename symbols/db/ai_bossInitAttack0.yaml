name: ai_bossInitAttack0
address: '0x081005DE'
kind: function
status: probable
summary: 'Initializes one boss AI attack step: sets difficulty tier, attack duration/boost values, a step
  callback, target = player, and attack mode 0.'
interface: (r0 unused/this-state) -> r0 = attack-mode result from object_setAttack0; fields written in
  oAIAttackVars on r7
details: Stores the difficulty tier from battle_getAiDifficultyTier into oAIAttackVars_AiDifficultyTier
  and sets InitFlag=2 (step in progress). sub_810067E(1) is called, then sub_8100480/sub_810046C supply
  the AttackDuration (halfword) and AttackBoost2 (byte). It installs sub_8100F8A as oAIAttackVars_PanelChooseCallback
  and stores battle_findPlayer(alliance ^ 1) as TargetObjectPtr, i.e. always targets the opposing side
  (the player). Finally object_setAttack0(0xC) switches the object to attack mode 0.
