name: battle_forEachAliveActor
address: '0x080085FE'
kind: function
status: probable
summary: Runs the same routine (sub_8008622) over the alive player-actor list and the alive opponent-actor
  list during battle phase dispatch.
interface: (r0 = battleState via r10) -> r0 = result of last sub_8008622 call; calls sub_8008622(listHead,
  listHead+4, index) twice
details: Fetches the battle state from toolkit+oToolkit_BattleStatePtr, then for the player side loads
  the AlivePlayerActors list head and its +4 field plus oBattleState_AliveActorTurnIndex, and calls sub_8008622
  with those. It then repeats the identical pattern for the opponent side using AliveOpponentActors, its
  +4 field, and oBattleState_OpponentAliveCount. The function itself contains no loops or field writes
  — it is purely a two-sided driver whose behavior depends entirely on sub_8008622. The differing third
  argument (player turn index vs opponent alive count) hints sub_8008622 picks or updates an actor by
  index, possibly for turn rotation, but that is not visible here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loads battle state via 'ldr r5,[r10,#oToolkit_BattleStatePtr]' then reads AlivePlayerActors
    head and +4 (asm lines 3-7); passes oBattleState_AliveActorTurnIndex as r2 for the player call to
    sub_8008622; repeats the exact same load/call pattern with AliveOpponentActors and oBattleState_OpponentAliveCount;
    only caller is battle_dispatchNextPhase, the per-frame phase state machine, so it runs as part of
    phase stepping
