open_questions:
- the entire behavior hinges on sub_8008622, which is undocumented; its body would show whether it iterates
  the alive-actor linked list, selects an actor by r2, and what it writes
- unclear what oBattleState_AliveActorTurnIndex counts (actor slot, turn rotation) versus oBattleState_OpponentAliveCount,
  and why the two sides use different third arguments
