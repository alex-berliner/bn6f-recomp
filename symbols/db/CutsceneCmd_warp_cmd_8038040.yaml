open_questions:
- What does oCutsceneState_Unk_34 semantically represent (pending warp ID? map ID? area index?) - only 0x34 offset
  is documented.
- Where/how is r5 (cutscene state pointer) initialized by the script dispatcher; is it the same struct across all
  cutscene commands?
- What subsystem does setSubsystemIndexTo0x14 configure vs. 0x10 (different map engine mode? overworld vs. battle?
  net area?).
- What does r4 ("keep running") vs. r0=0 (halt) mean to the cutscene runner; is 1 the only success return, and what
  failure cases exist?
- Are the warp_setSubsystemIndex* callers ever expected to fail and how would that be reported (through r3? flags?).
