name: CutsceneCmd_warp_cmd_8038040
address: '0x08038040'
kind: function
status: confirmed
summary: 'Handles the cutscene script "warp" command: dispatches to immediate warp, pending-warp storage, or re-warp
  based on the parameter byte''s bits 0x20/0x40 and bit 0 picking between subsystem-index 0x10 and 0x14 flavors.'
interface: void cutsceneCmd_warp_8038040(u32 r5=cutscene state, u32 r7=script cursor) -> nz cv r0 (1=keep running),
  r1, r2, r4, r5, r7 advanced; clobbers r0, r3, r6, lr
details: "Reads a 1-byte parameter via ReadMapScriptByte (preserved in r3 for the duration). Branches on param bits:\n\
  \  bit 0x40: calls warp_getCurrentWarpEntry_8005f32 then warp_setSubsystemIndexTo0x10AndOthers_8005f00 and advances\
  \ the cursor by 2.\n  bit 0x20: reads a halfword via ReadMapScriptWord and stores it into cutscene state at offset\
  \ oCutsceneState_Unk_34 (pending warp argument); advances cursor by 6.\n  otherwise: reads a halfword warp argument\
  \ via ReadMapScriptWord (or pulls the pending one from oCutsceneState_Unk_34 when bit 0x80 is set), then reads\
  \ one more byte, then calls either warp_setSubsystemIndexTo0x10AndOthers_8005f00 (bit 0 clear) or warp_setSubsystemIndexTo0x14AndOthers_8005f14\
  \ (bit 0 set) with r0=warp_arg, r1=0, r2=screen byte; advances cursor by 7.\nAlways returns r0=1 (\"keep running\
  \ the script\"). The n/z flags come from the final `mov r0,#1`, c/v from the cursor `adds`. r3 flows through unchanged\
  \ from the caller's first read only because ReadMapScriptByte/Word preserve it; the warp_setSubsystemIndex* callees\
  \ do NOT preserve r3, so the command's exit r3 is whatever the last warp callee left there.\n"
