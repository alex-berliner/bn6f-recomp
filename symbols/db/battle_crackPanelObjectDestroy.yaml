name: battle_crackPanelObjectDestroy
address: '0x080C87DC'
kind: function
status: probable
summary: Battle object teardown that cracks the panel it occupies if conditions on its params and the
  panel state hold, then destroys itself.
interface: (r5 = battle object pointer) -> r0 = 0 from object_genericDestroy; destroys the object
details: Reads the object's PanelX/PanelY and fetches the panel status word via object_getPanelParameters.
  If panel flag 0x10 (cracked/broken panel) is set, and the object's Param1 >= 2 and Param2 != 0, it calls
  object_crackPanel on its own coordinates before tearing itself down with object_genericDestroy. Param2
  looks like an enable/charge flag and Param1 a state/threshold field. If the panel is not flagged 0x10
  or either param check fails, it skips straight to the destructor. r5 is the standard battle-object base
  pointer, so the function takes no explicit arguments.
