- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0/r1 from oBattleObject_PanelX/PanelY then bl object_getPanelParameters reads own panel
    status; tst r0,#0x10 gates the crack on a panel-status bit; Param1 >= 2 and Param2 != 0 checks use
    oBattleObject_Param1/Param2; bl object_crackPanel with the same PanelX/PanelY cracks the occupied
    panel; tail bl object_genericDestroy releases panel tiles, collision data and object memory
