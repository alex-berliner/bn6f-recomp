name: battle_aiAttackWindupStepWood_80F17E4
address: '0x080F17E4'
kind: function
status: confirmed
summary: AI attack step handler that starts an element-4 (wood) attack on its first call — sets the attack
  element, plays animation 0xF on the battle object, and loads the wind-up timer from AttackBoost2 — then
  ticks that timer until it expires, at which point it writes element 4 into HitElement to trigger the
  attack's hit phase.
interface: 'void battle_aiAttackWindupStepWood_80F17E4(u32 obj /*r5: battle object*/, u32 atk /*r7: AI
  attack vars*/); // clobbers r0 and nzcv, preserves r4/r6'
details: 'Per-call state machine over the AI attack vars block (r7). If oAIAttackVars_AttackElement is
  still 0, the attack is initialized: AttackElement is set to 4, oBattleObject_CurAnim on the battle object
  (r5) is set to animation 0xF (wind-up pose), and oAIAttackVars_StepTimer is seeded (as a halfword) from
  the single byte oAIAttackVars_AttackBoost2, which thus acts as the wind-up delay in frames. On every
  later call the StepTimer is decremented; when it counts down to 0 (subtraction sets Z or the borrow
  flag; the bgt uses the signed comparison), oAIAttackVars_HitElement is written with 4, which downstream
  code reads as the signal that the attack now connects. Element 4 corresponds to the wood element in
  the battle engine''s element numbering. The handler is a pure step function: it returns immediately
  after either initializing or ticking, and the hit flag is polled by the caller rather than returned.'
