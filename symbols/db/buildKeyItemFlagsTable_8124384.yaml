name: buildKeyItemFlagsTable_8124384
address: '0x08124384'
kind: function
status: confirmed
summary: Snapshots ownership of key items 0x80–0x85 into a 16-byte status table at unk_201C400.
interface: void buildKeyItemFlagsTable_8124384(void)
details: Zeroes the 16-byte buffer at unk_201C400 via ZeroFillByByte, then loops item IDs 0x80 through
  0x85 (inclusive). For each, calls CheckKeyItem to query whether the player owns that key item, and writes
  a (id_byte, owned_byte) pair sequentially into the buffer. The result is six (item_id, 0/1) byte pairs
  laid out contiguously. No meaningful register inputs are consumed; r2–r7 are pushed/popped to preserve
  the caller's state. The function touches only the global buffer at unk_201C400 and the CheckKeyItem
  lookup (likely a script or flag table elsewhere).
