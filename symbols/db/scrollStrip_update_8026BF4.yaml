name: scrollStrip_update_8026BF4
address: '0x08026BF4'
kind: function
status: confirmed
summary: Per-frame scroll-strip update — init gate, copy zero-tile columns, advance scroll, shift camera,
  and notify the scroll subsystem.
interface: void sub_8026BF4(struct S20364C0 *self /* r5 */, struct Toolkit *toolkit /* r10 */); /* clobbers
  r0-r3,r6-r9,r11-r12,nzcv; preserves r5-r7 */
details: 'Operates on a strip-scroll object at r5 (''S20364C0'') using toolkit at r10.

  First-call init gated by self->Unk_02: zeros the two extra pointers

  (offset 0x40 and 0x44), sets Unk_02=TRUE, dispatches a BG tile-stream

  update via dispatch_801DACC(0x2000), calls sub_8029D80, and clears

  BATTLE_STATE_UNK_11_FLAG_UNK_BIT_02 (0x4) through

  clearBattleStateUnk11Flag_800A9D6.

  Per frame: loads self->Extra_Unk_40, adds 0xC, derives an iteration

  count (2 when bit 2 of scroll_pos is clear, 1 otherwise); loops that

  many times incrementing self->Extra_Unk_44 and calling

  CopyBackgroundTiles(j, i=0, tileBlock32x32=3,

  tileIds=&byte_8026C88 (64 zeros), j_size=1, i_size=0x14).

  Outside battle mode 1 (GetBattleMode()!=1), shifts camera+0x34 by

  0x18000 (one tile block) using r10''s oToolkit_CameraPtr.

  Writes the new scroll_pos back to self->Extra_Unk_40 and stores its

  low half at render_info+0x18. Calls sub_801E71C(0x78 - scroll_pos,

  scroll_pos). When scroll_pos reaches 0x78, copies self->B (offset 0xB)

  into self->0x1 and zeros self->0x2 (strip wrap / loop reset).

  Always tails in sub_8029C08(self) as the per-frame callback.

  Quirks: r2/r3 must thread the camera pointer and 0x18000 constant

  through to sub_8029C08 in mode 1 they hold CopyBackgroundTiles output;

  a non-standard mixed ARM/Thumb-style argument pass.

  '
