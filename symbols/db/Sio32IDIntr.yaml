name: Sio32IDIntr
address: '0x0814CE64'
kind: function
status: confirmed
summary: 'SIO32 multiplayer link interrupt: advance ID-exchange handshake and reload SIODATA0 with the next expected
  partner ID and RX mask; parent re-arms the start bit after a settle delay.'
interface: 'void Sio32IDIntr(void);  // inputs: lr; outputs: nz,c,v,r4,r5; clobbers: r0,r1,r2,r3; preserves: r4,r5'
details: "Operates on the GBA SIO32 (multiplayer) registers and a small RAM state\nblock anchored at byte_2010CD0\
  \ (r4). Field offsets used:\n  +0   : u8 slot id (0..3) -- which half of SIODATA0 is \"ours\"\n  +2   : u16 handshake\
  \ state counter\n  +4   : u16 our outgoing 16-bit word (next ID/mask to send)\n  +6   : u16 expected incoming\
  \ 16-bit word (this-turn partner mask)\n  +0xA : u16 \"done\" latch (last partner value when handshake completes)\n\
  \nAlgorithm each interrupt:\n  1. Non-parent slot: write SIOControlRegister |= 0x80 to drop the START\n     bit\
  \ (it owns transfer initiation, not us).\n  2. Unpack SIODATA0: r1 = our half, r5 = partner half, indexed by slot<<4.\n\
  \     (LSL-by-register is used, so large shifts yield 0.)\n  3. If done_flag == 0:\n       - If partner value\
  \ != expected_rx, reset state counter to 0.\n       - Else if state > 3, mark done by storing the partner value.\n\
  \       - Else (state in 0..3) require our incoming to equal ~mask_tx AND\n         partner to equal ~expected_rx\
  \ to advance state to state+1.\n  4. Pick next_outgoing from LibInfoText_aNintendosio32i[state] for\n     state<=3,\
  \ else 0x8001; store complement of r5 as the new expected\n     partner mask.\n  5. Repack the two 16-bit halves\
  \ into SIOData0_Parent__Multi_PlayerMode_\n     (TX shifted to our slot's position, RX shifted to partner's slot).\n\
  \  6. Parent (slot==1) path: optionally busy-wait up to ~0x257 ticks if\n     state==0 or partner sent \"NI\"\
  \ (0x494E), then if done_flag is still\n     0, set SIOControlRegister bit 0x80 to re-arm the START bit.\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
