name: sub_80C9726
address: '0x080C9726'
kind: function
status: confirmed
summary: Dispatches a battle object's current-action handler via a small jump table, then clears the object's "busy"
  flag unless the action should keep running (alliance check or related object's 0x100000 AI flag).
interface: void battle_runObjectActionHandler_80C9726(BattleObject* obj /* r5 */); // r10 passed in by callers per
  contract but unused here; r5 preserved, many caller regs clobbered (r0-r4, r6-r7, r8-r12, flags)
details: "Takes the battle object in r5, reads its oBattleObject_CurAction byte, and calls one of two\naction handlers\
  \ through off_80C976C (action 0 -> sub_80C9774, action 1 -> sub_80C97B4);\nthe handler is invoked with r0 = action\
  \ index and r1 = its own table entry (self pointer,\na common trampoline idiom). After the handler returns, bit\
  \ 0x02 of oObjectHeader_Flags is\nset, marking the object as busy/acting. The busy bit is then cleared again when\
  \ either:\n  - sub_800EB6C(alliance) returns 0 (alliance check fails), or\n  - the object pointed to by oBattleObject_RelatedObject1Ptr\
  \ reports flag 0x100000 from\n    GetAIDataUnk0x48Flag (checked via tst with dword_80C9808 = 0x100000).\nSo the\
  \ busy flag only survives when the object passes the alliance test AND the related\nobject's AI data lacks flag\
  \ 0x100000. r5 is saved/restored around the related-object lookup,\nsince the call clobbers it. Works on the standard\
  \ battle object layout (oObjectHeader_Flags,\noBattleObject_CurAction, oBattleObject_Alliance, oBattleObject_RelatedObject1Ptr).\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
