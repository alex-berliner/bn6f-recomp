name: battle_objectDispatchAction
address: '0x080BF7BC'
kind: function
status: probable
summary: Dispatches a battle object's per-action handler by indexing a Param1-selected jump table (4 entries
  each) with CurAction, using a Thumb long-call (mov lr,pc; bx r1).
interface: (r5 = battle object ptr) -> calls handler via mov lr,pc; bx r1; returns handler's r0; no flags
  used by caller
details: 'Reads oBattleObject_Param1 from the object at r5; if it is 0 it uses table off_80BF7E4, otherwise
  off_80BF7F4. It then reads oBattleObject_CurAction and indexes the chosen table to get a function pointer,
  and calls it with the Thumb ''mov lr, pc; bx r1'' long-call idiom, passing CurAction in r0. Each table
  has exactly 4 entries, so only CurAction values 0-3 are valid. This is a two-variant action dispatcher:
  the same action indices map to different handler sets (sub_80BF800/888/97C/9B0 vs sub_80BFA1C/AD8/BC28)
  depending on the object''s Param1 type. Called from battle_setupObjectSpriteAtRelated, which places
  the object''s sprite from a resource table indexed by Param1, suggesting this drives the sprite''s ongoing
  action behavior after placement.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Param1]; cmp #0; bne selects between off_80BF7E4 and off_80BF7F4
    tables; ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0] indexes the table by current action;
    mov lr, pc; bx r1; pop {pc} performs the call with CurAction in r0 and returns to caller; both tables
    hold 4 thumb pointers (sub_80BF800..sub_80BF9B0, sub_80BFA1C..sub_80BFC28), limiting CurAction to
    0-3; sole caller battle_setupObjectSpriteAtRelated places the object''s sprite using Param1, tying
    this to object sprite behavior'
  refs:
  - bn6f/asm/asm31.s:16320
  - 0x080BF710 battle_setupObjectSpriteAtRelated
  reproduce: python3 tools/asmcat.py 0x080BF7BC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary accurately describes the dispatch logic: two jump tables indexed by CurAction, chosen
    by Param1, called via mov lr,pc/bx r1, with 4 entries each. However, the caller''s role is misstated:
    battle_setupObjectSpriteAtRelated sets up the sprite before this dispatcher runs, not that this function
    ''drives ongoing action behavior'' from there - actually it''s called once after sprite placement
    to set up something specific to the action. The callees listed also appear truncated/wrong (sub_80BFC28
    is the last in table 2, not sub_80BF...). Name ''battle_objectDispatchActionHandler'' is reasonable
    but a bit verbose; ''battle_objectDispatchAction'' would be tighter.; run wf investigate investigate-20261019-030611;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
