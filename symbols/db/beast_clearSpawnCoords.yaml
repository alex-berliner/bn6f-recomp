name: beast_clearSpawnCoords
address: '0x08142072'
kind: function
status: probable
summary: Resets the Cybeast spread-attack spawn coordinates in eStruct2001010 to a default/off-screen
  pair (0, 15).
interface: (no args used) -> r0 = 0; flags clobbered by bl
details: This tiny routine simply calls beast_setSpawnCoords with r0=0 and r1=0xf, so the pair of bytes
  at offsets 0x14/0x15 of the beast-spread struct (which the callee fills with x/y spawn coordinates)
  is set to (0, 15) — plausibly a neutral or out-of-grid default that disables/initializes the spawn point.
  It then returns 0 in r0. The push/pop of r4-r7 is vestigial since nothing else uses them. It runs during
  the recorded beastsp (beast-spread) route, so it likely runs before/around the Cybeast spread attack
  sequence to reset the spawn position.
