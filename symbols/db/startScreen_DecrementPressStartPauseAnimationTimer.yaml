name: startScreen_DecrementPressStartPauseAnimationTimer
address: '0x0803E964'
kind: function
status: confirmed
summary: Ticks down the "PRESS START" title-screen animation frame delay; when the timer hits zero, sets a flag
  so the animation advances to the next frame.
interface: 'Next startScreen_DecrementPressStartFrameTimer(void)

  // in: nothing meaningful (r4-r7 preserved, unused)

  // out: r0 = 1 when the timer just expired (0 otherwise reports the raw decremented value),

  //      NZ/C/V reflect the final ''sub r0,#1'' or ''mov r0,#1'' — NZ set iff r0 != 0'
details: 'Operates on the title-screen animation control struct at 0x200B1A0 (eStartScreenAnimationControl200B1A0).
  Reads byte +3 (the frame-hold timer that keeps the "PRESS START" banner on its current animation frame for N frames),
  decrements it, and stores it back. If the decremented value is nonzero (NZ from the subtraction), it returns with
  r0 = the new timer value. If the timer reached zero (was 1 before the call), it writes 1 to byte 0 of the control
  struct — evidently an ''advance animation'' trigger consumed by the title-screen animation handler — and returns
  r0 = 1 with NZ set from ''mov r0,#1''. No other state is touched; r4-r7 are dead loads preserved from the frame.
  Quirk: on expiry r0 is 1 (the mov), not 0, so callers reading r0 see ''1'' in both the still-ticking and just-expired
  cases and must branch on flags instead.'
