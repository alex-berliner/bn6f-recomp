name: battleObject_decrementChipHeldAndClearChip_800F322
address: '0x0800F322'
kind: function
previous_names:
- sub_800F322
status: probable
summary: Consume one chip from the battle object's queue and clear the current chip ID when the queue
  empties
interface: '(r5 = BattleObject*) -> ; side effects: writes r5->ChipsHeld, conditionally writes r5->Chip;
  clobbers r0 and NZCV'
details: "Reads `BattleObject.ChipsHeld` (offset 0x1a) via `ldrb r0, [r5, #oBattleObject_ChipsHeld]`.\n\
  \  If it is already 0, returns immediately. Otherwise decrements it by 1 (`sub r0,#1` / `strb r0,[r5,#oBattleObject_ChipsHeld]`).\n\
  \  If after the decrement the count is still non-zero (BNE), the chip ID is left intact.\n  When the\
  \ post-decrement count is zero (falls through), the function decrements r0 once more (so r0 = 0xFF as\
  \ u8 = -1), then stores that 16-bit value into `BattleObject.Chip` (`strh r0, [r5, #oBattleObject_Chip]`,\
  \ offset 0x2a), effectively clearing the selected chip entry once no chips remain queued.\n  Caller\
  \ contract: in=r5 (BattleObject*), out=void-like (only r0 scratch and flags).\n  Used inside the CustomGauge\
  \ / chip-selection flow: every frame the cursor is on a chip this routine spends one; once the queue\
  \ is fully used the currently-selected chip ID slot is reset to 0xFFFF.\n"
