name: battleObject_decrementChipHeldAndClearChip_800F322
address: '0x0800F322'
kind: function
status: confirmed
summary: Decrements a battle object's held-chip count, and when the last held chip is dropped, clears the selected-chip
  slot to the "no chip" marker (0xFFFF).
interface: void battleObject_decrementChipsHeldAndClearChipIfEmpty_800F322(struct BattleObject* obj /* r5 */)
details: 'Reads obj->ChipsHeld (byte at oBattleObject_ChipsHeld). If it is 0, returns without

  touching anything. Otherwise decrements the count and stores it back. If the count

  reached exactly 0 (meaning it was 1 before the call), it writes 0xFFFF (via a second

  sub r0,#1 on the now-zero value) to obj->Chip (halfword at oBattleObject_Chip),

  marking that no chip is currently held/selected by the object. The object pointer is

  taken in r5 rather than r0, matching the battle-object helper convention. r0 and all

  flags are clobbered; nothing is returned.

  '
