name: pack_sortAndReinitChipAuxData
address: '0x080AADA6'
kind: function
status: probable
summary: Sorts the chip pack by removing and re-adding all chips, then reinitializes the 320-entry per-chip
  auxiliary array from a template, zeroing excluded/special chips' entries.
interface: (r10 = toolkit) -> r0 = none; destroys r4, r6, r7
details: Reads oToolkit_S2001c04_Ptr byte 5 (multiplied by 30) to get the pack-entry count, and for each
  2-byte pack entry (id = bits 0-8, count = bits 9-15) calls TakeChips to empty the pack, then pack_addChipByIdSetLibraryFlag_8021B2A
  to re-add every chip, which repacks them into their code-ordered slots (a pack sort). It then CopyWords'es
  0xF00 bytes from the template dword_2033000 into toolkit->oToolkit_Unk2002230_Ptr (320 chips × 12 bytes).
  Finally it loops chip IDs 0..0x13F calling getChip8021DA8, and stores 0 into the corresponding 12-byte
  aux entry for chips whose ChipData byte 7 == 2, whose byte 9 has flag 0x20, or whose ID is 0x137/0x138/0x139.
