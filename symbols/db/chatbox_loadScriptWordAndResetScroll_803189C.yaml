name: chatbox_loadScriptWordAndResetScroll_803189C
address: '0x0803189C'
kind: function
status: confirmed
summary: Latches the halfword at the current text-script pointer into the chatbox state (word_2013944), advances
  the script pointer by 4, and resets two per-line counters/positions to 0xFE.
interface: 'void sub_803189C(u32* scriptPtr) // r0 in: pointer to a word in the script stream; no outputs; clobbers
  r0, r1, r5 and flags'
details: 'Loads the global script-pointer variable dword_2013940, reads the halfword pointed to by r0 into word_2013944
  (offset +4 in the same block), then stores r0+4 back into dword_2013940, consuming one word (halfword payload
  + padding/halfword) from the script stream. Finally writes 0xFE into both byte_2013946 and byte_2013947. The 0xFE
  value looks like a sentinel or an "off-screen/just reset" position for the two text lines'' scroll/character counters
  in the chatbox (text box) engine, so this is very likely the routine that begins a new piece of text or a new
  line: it takes the parameter word following a script command and primes the two-line renderer state. The block
  at 0x2013940 (pointer at +0, latched halfword at +4, two counters at +6/+7) is the shared textbox working state.'
