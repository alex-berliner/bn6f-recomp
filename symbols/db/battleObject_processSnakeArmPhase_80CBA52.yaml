    the contract) — matches a per-object routine addressed via a dispatch table. - The block at loc_80CBA6A tests
    oBattleObject_CurPhase; first entry sets it to 1 and initialises Timer from Timer2 — clear "phase-0 kickoff"
    behaviour. - object_clearCollisionRegion + CUR_STATE_DESTROY write at oBattleObject_CurStateActionPhaseAndPhaseInitialized
    identifies the off-panel branch as object self-removal. - Locals add YVelocity = XVelocity-stored-into-YVelocity
    * ExtraVars[0] while zeroing XVelocity — directional kick consistent with a snake-arm thrust. - X += XVelocity
    / Y += YVelocity / object_setPanelsFromCoordinates / object_updateCollisionPanels chain is the standard per-frame
    object integrator. - Timer countdown with CurPhase reset to 0 only after the timer expires is a phase-driven
    state machine. - Captured calls all show the same r5/r10 prologue and r0 containing a packed "object/cmd" value
    returned to the caller.'
