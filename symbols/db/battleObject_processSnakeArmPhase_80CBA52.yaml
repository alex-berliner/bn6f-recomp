name: battleObject_processSnakeArmPhase_80CBA52
address: '0x080CBA52'
kind: function
previous_names:
- sub_80CBA52
status: probable
summary: 'Per-frame battle object driver: drives a "snake-arm" style phase by moving the object along its current
  X/Y velocities, syncing panel/collision state, and self-destructing if the object drifts off the battlefield.'
interface: '(r5 = obj, r10 = toolkit) -> r0 = 0; side effects: clobbers r0..r7, lr; writes oBattleObject_X, oBattleObject_Y,
  oBattleObject_XVelocity, oBattleObject_YVelocity, oBattleObject_CurPhase, oBattleObject_CurAction, oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  oBattleObject_Timer; clears the object''s collision region; recurses into sub_80CBAFA.'
details: "• First calls object_isCurrentPanelValid; if the object's currently occupied panel is not valid (test\
  \ fails, r0 == 0), the object is removed from its collision region (object_clearCollisionRegion), its CurStateActionPhaseAndPhaseInitialized\
  \ is set to CUR_STATE_DESTROY (0x8), and CurAction is set to 2 — the object is destroyed.\n  • Otherwise the per-phase\
  \ tick begins. If CurPhase is 0 (not yet running), CurPhase is bumped to 1. The code then checks ExtraVars+4 (offset\
  \ 0x64): when zero it copies Timer2 into Timer and resyncs pixel coordinates from the current panels (object_setCoordinatesFromPanels);\
  \ when non-zero it loads ExtraVars+0 (offset 0x60) into r1, multiplies r0 (= r0, i.e. a kind of fixed-point velocity\
  \ seed left in r0) by r1 (mul r0, r1) and stores the product into YVelocity, while XVelocity is zeroed — a one-shot\
  \ velocity kick for the first sub-tick.\n  • Each tick integrates X += XVelocity and Y += YVelocity (16.16 fixed-point\
  \ fields at oBattleObject_X = 0x34 and oBattleObject_Y = 0x38), then calls object_setPanelsFromCoordinates and\
  \ object_updateCollisionPanels so the panel/facing state stays in sync, then recurses into sub_80CBAFA (probably\
  \ the animation/animation handling hook for this same object).\n  • Finally Timer is decremented; as long as it\
  \ stays > 0 the loop continues implicitly on the next frame, otherwise CurPhase is reset to 0 so a fresh phase\
  \ may be (re)initialised.\n  • Captured callers all run with the same prologue (object r5, toolkit r10), exit\
  \ with the carry flag clear and r0 in [0x10..0x1D], suggesting the function is called repeatedly by some per-object\
  \ dispatcher that inspects r0.\n"
