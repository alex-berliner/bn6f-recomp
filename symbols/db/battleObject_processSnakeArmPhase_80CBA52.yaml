open_questions:
- The exact role of `sub_80CBAFA` (animation/animation-update hook?); it shares the r5/r10 contract and is called
  once per tick.
- The semantics of `ExtraVars[0]` (multiplier) and the r0 left in r0 before the mul — likely a base speed/velocity
  component from the action script.
- What the caller's r0 exit value (0x10..0x1D, all carry-clear) actually encodes; possibly a packed object/cmd index
  used by an outer dispatcher.
- Which battle action invokes this function (the captured calls are tagged `snap_beastsp_0050000`, suggesting a
  BeastOut/sp-out style behaviour, but the assembly has no obvious element selection).
