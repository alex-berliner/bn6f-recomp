open_questions:
- Exact semantic of tier thresholds 0/4/8 and the bytes they index into `off_8027014`. The chosen `r3`
  of 0/4/8 is added to the table base to pick one of three tier arrays, then `[r3, r0]` reads the per-frame
  threshold; presumably this controls how often the cursor auto-OK's or moves. Settling it requires either
  renames of `off_8027014` (table of three threshold arrays) or a comparison against a known RNG-driven
  custom-screen event in a public trace. Also unsure what the 0x20 written at `[r5+0xb]` controls - might
  be a counter/timer slot in S20364C0 that the cursor handler reads next frame.
