status: probable
summary: Advances the chip-select/customize sub-menu cursor one beat, with a chance to swap player element
  via Puppeteer
interface: (r2 = curBeat counter?, r5 = S20364C0 state ptr, r10 = Toolkit) -> void ; writes to S20364C0
  fields, Puppeteer element, byte_20366C0
details: "1. Checks chatbox flag 0x80; if set, defers to `battleObject_computePuppeteerSwitchElement_802A220`\
  \ and applies that element.\n   If that helper returns 0xFF (no swap), it bails out.\n   Otherwise it\
  \ calls `chatbox_8040818` and continues to the \"advance cursor\" branch.\n2. Otherwise reads chatbox\
  \ state via `chatbox_GetState_8045F4C`; if state == 1, goes straight to\n   `loc_8026FA0` (writes CurAction=4,\
  \ timer=0).\n3. Otherwise writes 0xFF to `byte_20366C0` (clears last-frame puppeteer element latch),\
  \ then loads\n   `GetBattleSettingsUnk01` into r4 and computes `GetBattleNaviStatsHword(r0=tk->BattleState->0xd,\
  \ r1=0x3e)+4`\n   into r0 — that's `MaxBaseHP + 4`.\n4. `svc 6` (RNG) with cap 5 produces a small random\
  \ offset; this and r4 (the Unk01 setting) feed\n   a tiered compare (8 → 4 → 0) that picks an index\
  \ into the table at `off_8027014`.\n5. Bumps a counter at `dword_20349A8`, looks up `ldrb r4, [r3, r0]`\
  \ for the picked index/tier,\n   calls `GetRNGSecondary`, ANDs result with 0xF, and compares against\
  \ r4 (threshold). If RNG < r4,\n   jumps to `loc_8026F8E` which writes `2` to `[r5+4]` (S20364C0.JumpOffset01\
  \ selection); otherwise\n   leaves that path and writes 0x20 to `[r5+0xb]`, 8 to `[r5+1]` (CurAction=8\
  \ = ?), 0 to `[r5+2]` (timer).\n6. The `loc_8026FA0` branch (used when chatbox state==1 or after puppeteer\
  \ switch) writes 4 to\n   `[r5+1]` and 0 to `[r5+2]` — \"park\" the cursor handler.\nThis is the per-frame\
  \ tick for the custom-screen menu (S20364C0), which is the cursor/UI for\npicking chips and the \"OK\"\
  \ button; it doubles as a hook to perform the rare Puppeteer (L+R element swap).\n"
