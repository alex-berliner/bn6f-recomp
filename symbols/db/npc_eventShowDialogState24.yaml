name: npc_eventShowDialogState24
address: '0x081313C0'
kind: function
status: probable
summary: NPC/talk-event handler that saves the current state, switches the object to state 0x24, and opens
  a chatbox text script chosen by game context.
interface: (no args; r5 = object/npc struct preloaded by caller) -> void; also may force screen fade to
  mode 8, level 0x10
details: 'First queries the screen-fade controller; if its mode is 0xC it resets the fade via SetScreenFade(8,
  0x10), suggesting entry during a fade transition. It backs up the byte at [r5+2] into [r5+0x16] (previous-state
  save), then writes 0x24 as the new state byte at [r5+2] and clears [r5+0xC] and [r5+3] (counters/timers).
  If bit 1 of the flag byte [r5+0x1B] is set, the chatbox call is skipped entirely. Otherwise it fetches
  eStruct200BC30 (arg 0x40) and reads its byte at 0x0E: if that equals 2 the script index is changed from
  0x40 to 0x30, then chatbox_runScript_803FD9C_on_eTextScript201BA20 is invoked with that index, i.e.
  it opens one of two variants of the same text archive''s dialog.'
