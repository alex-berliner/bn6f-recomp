name: HalfwordFill
address: '0x0800096C'
kind: function
status: confirmed
summary: Fills a byte range in memory with a 16-bit value using a halfword-mode CpuSet fill.
interface: void HalfwordFill(void *dest /* r0 */, u32 byteCount /* r1 */, u16 value /* r2 */); // preserves r0-r3,
  returns NZCV of "mov r1, r0" (i.e. dest as-if added to 0)
details: 'Small wrapper around SWI_CpuSet. Takes a destination address in r0, a byte count in r1, and the fill halfword
  in r2. Converts the byte count to the halfword unit count (r1 >>= 1) and ORs in the CpuSet "fill, 16-bit" mode
  flag 0x1000000, giving mode = 0x1000000 | (byteCount/2). Because CpuSet''s fill mode expects the source to be
  a pointer to the fill value, the value is pushed onto a 4-byte stack slot and r0 is pointed at it; CpuSet is then
  called as CpuSet(&value, dest, mode) to fill byteCount bytes with the halfword (trailing byte undefined if the
  count is odd). The stack slot is reclaimed and r0-r3 are restored via push/pop, so the only visible side effects
  are the memory fill and the flags left over from "mov r1, r0" (N/Z from the destination address, C/V clear). r3
  is shuffled through (saved on entry, parked, restored) purely to keep it available as the CpuSet value argument;
  the caller''s r3 is preserved.

  '
