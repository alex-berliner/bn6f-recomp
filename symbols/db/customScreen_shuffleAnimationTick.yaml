name: customScreen_shuffleAnimationTick
address: '0x0802723A'
kind: function
status: probable
summary: 'Per-frame tick for the battle Custom screen''s shuffle animation: every 4th frame performs one
  shuffle step (or finishes the shuffle and flags the selected chip), advances the exit animation, and
  plays a tick sound.'
interface: () -> void; uses r5 = battle/custom-screen state struct; no return value
details: Increments the frame counter at [r5,#0x40] and only acts every 4th frame (counter & 3 == 0).
  If counter>>2 < 8, calls sub_8029688 to perform one shuffle step of the eligible hand chips. Once 8
  steps have elapsed, it calls sub_802983C to write the final shuffled snapshot back into eBattleFolder,
  bumps the state byte [r5,#0x16], then fetches active-chip slot 8 via getLocOfActiveChips (12-byte entries),
  decrements its count byte at +4, and stores 1 at byte +7 if that count reached 0 (else 0), before calling
  the chip-picker effect dispatcher 8028476. It then sets [r5,#1] = 4 and [r5,#2] = 0 to move to the next
  screen state with a fresh timer. On every 4th frame it also ticks customScreen_ExitSequence_8028E32
  and plays sound effect 0x13 (the shuffle tick/cursor sound).
