name: text_setupTextboxAndStartPrint_8031BB2
address: '0x08031BB2'
kind: function
status: confirmed
summary: Standard three-step textbox setup — initialise textbox state, open the message window box, then begin printing
  the text.
interface: void text_setupTextboxAndStartPrint(r0 arg0, r5 arg5); // returns to caller with r0/r2/r3/r4/r5/r6/r7/flags
  as left by sub_8031B7C
details: 'Thin wrapper that runs the standard message-box startup sequence: 1) calls sub_803172E to initialise the
  textbox state, passing r0 and r5 straight through; 2) loads the window-geometry constants r2=8, r3=8, r4=0, r5=0x10
  and calls sub_80315B8 to open the message window box at that size/position; 3) calls sub_8031B7C to kick off the
  actual text printing. No register results are produced of its own — r0, r2-r7, the nzcv flags and the return path
  are simply whatever the final helper (sub_8031B7C) leaves behind. lr is saved because all three helpers are bl-called;
  the routine itself only chains them.

  '
