name: sub_80C97B4
address: '0x080C97B4'
kind: function
status: confirmed
summary: 'Battle object phase: one-shot init that copies an animation + timer from its extra-vars init blob, then
  ticks the timer down and queues the object for destruction when it expires.'
interface: 'void sub_80C97B4(void); /* in: r5 = battle object, lr = return; clobbers r0, r1, NZCV */'
details: 'Reads the battle object pointed to by r5. On first entry (oBattleObject_PhaseInitialized == 0) it sets
  bit 1 (0x02) of the generic oObjectHeader_Flags, then reads a pointer out of oBattleObject_ExtraVars+4 (the init
  blob for this object) and copies byte[3] into oBattleObject_CurAnim and byte[4] into oBattleObject_Timer, marking
  the phase initialized with value 4 so it only fires the init once. Every entry it decrements oBattleObject_Timer;
  when the timer would go negative (underflow), it writes the constant CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object is scheduled for teardown on the next state pass. Returns via `pop {pc}` (tail-pop).

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
