name: menu_moveCursorLeftRight_811FA0C
address: '0x0811FA0C'
kind: function
status: confirmed
summary: Horizontal-only cursor movement handler that tail-jumps into the shared cursor mover after clearing the
  vertical-move bit.
interface: void menu_moveCursorLeftRight_811FA0C(void); /* pass-through wrapper — r0, r1, r2, r3, r5, r6, r7, r10
  flow into menu_moveCursor_811FA36; r2 bit 1 cleared in-register */
details: 'Thin glue function for menu cursor movement. It pushes {r4-r7,lr} and subtracts 0x10 from SP, forming
  the combined frame the shared mover menu_moveCursor_811FA36 expects to pop in its epilogue (5 saved words on top
  of a 0x10-byte argument block). The argument block is filled with fixed auto-repeat parameters — 0x20 frames initial
  delay at +0x00 and 0x10 frames repeat rate at +0x04 — followed by the caller''s r3 at +0x08 and r2 at +0x0C. It
  then clears bit 1 of the r2 copy (removing the vertical direction bit so only left/right movement can result),
  sets r4 = 2 (the horizontal selector read by the shared body), and branches to menu_moveCursor_811FA36. Because
  the shared mover pops the whole frame built here, control returns directly from it to this wrapper''s caller with
  r4-r7 restored; r0, r1, r5, r6, r7 and r10 pass through untouched. This is why the register contract shows this
  routine as a pure relay whose outputs match the mover''s.

  '
