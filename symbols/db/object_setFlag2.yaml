name: object_setFlag2
address: '0x0801A16C'
kind: function
status: confirmed
summary: Sets the given bits in a battle object's "flags 2" word inside its collision data.
interface: void object_setFlag2(u32 flagBits r0, BattleObject *obj r5); returns collision-data pointer in r1 and
  the new flags in r2, with NZ set from the updated flags.
details: Loads the object's collision-data pointer from oBattleObject_CollisionDataPtr (r5), ORs r0 into the oCollisionData_ObjectFlags2
  field, and stores it back. Leaves r1 = collision data pointer and r2 = resulting flag word, and lets the ORR set
  N/Z so callers can branch on the result. "Flags 2" is a secondary collision-state bitmask (e.g. status/hit properties)
  distinct from the primary object flags; callers are expected to pass a precomputed bit mask in r0.
