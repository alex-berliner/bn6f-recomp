summary: 'From the overworld tick: on a fresh START press, with every blocker clear, boots or resumes
  the PET menu subsystem by switching the game state to subsystem 0x18.'
interface: 'void gamestate_openPetMenuOnStartPress(void) : r10 (toolkit) -> [r10]'
details: 'Reads GameState from the toolkit and acts only when oGameState_SubsystemIndex == 4 (the overworld).
  Guards, each bailing out: EVENT_1717_PLAYER_ADVANCE_FORWARD set, EVENT_IN_SLIPRUN_STATE set, sub_809E462''s
  flag (oGameState_Unk_10) nonzero, warp_LoadCurrentAndReadUnk10_8005F28''s byte 0x10 nonzero. If TestPETMenuDataFlag(1)
  is set (PET menu already initialised), it skips straight to the subsystem switch. Otherwise additionally
  requires: a screen fade active (IsScreenFadeActive), no cutscene script loaded (IsCutsceneScriptNonNull),
  chatbox event-flag bit 0x80 clear (chatbox_mask_eFlags2009F38), START newly pressed (IsButtonPressed(JOYPAD_START))
  and EVENT_PET_DISABLED clear. Then PlaySoundEffect(SOUND_SELECT_79), updatePlayerGameState_800107A (snapshot
  of the player''s position/facing), pet_initMenu_811EC10, scenario_initEffectState_8003962, zeroFill_8003AB2
  (the 0x48-byte work struct at 0x2001010), and stores 0x18 into oGameState_SubsystemIndex (the cbGameState_80050EC
  dispatch enters the PET menu next frame; its main state handler is sub_8005462).

  '
