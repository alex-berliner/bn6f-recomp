name: object_stepColorFadeIn
address: '0x0811E558'
kind: function
status: probable
summary: 'Per-frame step of a color tint effect: applies an increasingly bright uniform color shader to
  the object''s sprite and advances a saturating frame counter.'
interface: (r0 = unused, r5 = object struct; field 0x1C = effect counter) -> r0 = packed color passed
  to sprite_setColorShader; counter [r5,#0x1C] incremented, saturating at 0x1F
details: Reads the counter at [r5+0x1C], builds an RGB555-style color by replicating the 5-bit value into
  red (<<10), green (<<5) and blue channels and OR-ing 0x8000 (color-shader flag), then calls sprite_setColorShader
  to store it on the object's sprite block. Afterwards it increments the counter, storing the new value
  only if it is below 0x20, so the tint saturates at full brightness (0x1F per channel) after 31 calls
  instead of wrapping. Called repeatedly by sub_811E490 and sub_811E510, presumably once per frame while
  the fade is active.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: lsl r1,#5 / lsl r2,#10 / orr r0,r1 / orr r0,0x8000 packs counter into R,G,B with shader flag
    (asm lines 3-8); bl sprite_setColorShader applies the packed color to the object's sprite block; add
    r0,#1; cmp r0,#0x20; bge skip-store makes [r5+0x1C] a saturating per-frame counter; two callers sub_811E490
    and sub_811E510 suggest this is one step of a multi-frame effect
  refs:
  - bn6f/asm/asm32.s:33616
  - 0x0811E490 sub_811E490
  - 0x0811E510 sub_811E510
