name: ZeroFillByEightWords
address: '0x08000900'
kind: function
status: confirmed
summary: Zeroes a byte-length buffer using a BIOS CpuFastSet fill (the BIOS moves eight words per burst, hence the
  original name).
interface: void zeroFillWords(void* dest, u32 lengthBytes); // preserves r0-r3 and lr; returns N=0 Z=1 C=0 V=0
details: 'A small wrapper around SWI_CpuFastSet in fill mode (bit 24 of the mode word set, 0x1000000). The caller
  passes the destination pointer in r0 and the buffer length in bytes in r1; the length is converted to words (lsr
  #2), OR''d with the fill-mode flag, and passed as the mode argument in r2. The fill source is a single zero word
  placed on the stack for the duration of the call (sub sp,#4 / str 0 / mov r0,sp), so no static zero constant is
  needed. Because CpuFastSet clobbers r0-r3, the routine pushes r0-r3 and lr up front and pops them back, making
  the call transparent to callers. Length should be a multiple of 4 and ideally a multiple of 32 bytes for the BIOS
  burst behaviour; the routine does no alignment or zero-length checks (a zero length would still trigger a BIOS
  call). On exit the flags are N=0, Z=1, C=0, V=0 (the last flag-setting instruction before the untouched-by-BIOS
  call is `mov r0, #0`). Likely a general-purpose memory-clearing helper used throughout the codebase, equivalent
  to a memset(dest, 0, len) for word-aligned buffers.

  '
