name: sub_8116A44
address: '0x08116A44'
kind: function
status: hypothesis
summary: On initialization, drives sub_802FE28 over three small packed (a1,a2) tables (3+3+2 entries) with notUsed=0
  and a4=1.
interface: void sub_8116A44(void);  // no inputs; clobbers r0-r3, lr, N/Z/C/V; preserves r4-r7, r5 is reported output
  by caller analysis but not set here
details: "Three loops walk packed 8-byte-pair tables embedded in the rodata immediately after each pointer:\n  *\
  \ dword_8116A94 .. 3 entries (terminated by the second loop at offset 0x18)\n  * dword_8116AB0 .. 3 entries\n\
  \  * dword_8116ACC .. 2 entries\nEach entry is read as (r0=[base+0], r1=[base+4]) and passed to sub_802FE28 with\
  \ r2=0, r3=1.\nThe tabular data is inline ARM-style opcodes/words (e.g. \"0x80904022\", \"0x80E20000\", \"0x2240B080\"\
  ,\n\"0x88E20000\", \"0x2280D000\", \"0x90E20000\") suggesting the pairs are small \"task\" or \"command\"\ndescriptors\
  \ whose exact meaning depends on sub_802FE28's contract (still untyped). The\nrepeating pattern across the three\
  \ tables and the fixed (0,1) trailing args suggest this is\none-shot setup work (hence no r4/r5/r6/r7 inputs from\
  \ callers).\n"
