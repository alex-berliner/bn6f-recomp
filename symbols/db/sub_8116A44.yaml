open_questions:
- What does sub_802FE28 actually do with (a1, a2, 0, 1)? Without its typed interface the semantic of these tables
  (task init? callback registration? sound/SE config?) is unknown.
- Why three separate tables with distinct counts (3,3,2) and slightly different constant prefixes (0x80..., 0x80A0...,
  0x80A8...)? Likely they index three subsystems or banks.
- Why is r5 listed as an output by the caller contract if this function neither reads nor writes r5? Likely an artifact
  of the lifter's caller analysis rather than real output.
