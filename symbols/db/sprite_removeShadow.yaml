name: sprite_removeShadow
address: '0x08002E52'
kind: function
status: confirmed
summary: Clears the shadow flag (and the bit-2 flag) in an object's sprite status byte, making the object's shadow
  stop rendering.
interface: void sprite_removeShadow(void *header /* r5 */) — returns r0 = updated sprite status byte, r1 = 4, r3
  = sprite struct address; clobbers NZCV flags
details: 'Reads the object header''s type/sprite byte at header+2 and takes its high nibble as the sprite struct
  index (multiply-by-16 via lsr/lsl), giving the sprite struct address = header + (type&0xF0). From that struct''s
  status byte at offset 3 it clears bit 0 (the shadow flag) and bit 2 using BIC, then stores the byte back. Returns
  r0 = the new status byte, r1 = 4 (leftover from the BIC immediate), and r3 = the sprite struct address; NZ come
  from the stored status byte, C/V from the sprite-struct ADD. No memory outside the object''s own header/sprite
  struct is touched. The bit-2 flag''s meaning is unknown but is cleared alongside the shadow bit by every caller.

  '
