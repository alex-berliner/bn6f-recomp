name: menu_handleStartAndDpad_8125594
address: '0x08125594'
kind: function
status: probable
summary: 'Joypad handler for a menu/state screen: Start/B triggers a confirm-exit/fade prompt, held-Up
  sets a flag and plays a sound, and held/pressed side d-pad directions (when state+0x12 is non-zero)
  feed into sub_8125820 while caching the joypad pointer in the state object.'
interface: '/* caller-supplied: R0 saved into R8 (unused), R5 = state object, R10 = toolkit */

  void menu_handleStartAndDpad_8125594(u32 r0_scratch, u8 *state_obj /* r5*/, void *toolkit /* r10*/);

  /* clobbers nzcv + r0-r3, r5, r8, r9, r10, r12, lr; preserves r4, r5, r6, r7, r10 */

  '
details: "- Resolves the current joypad struct via the toolkit's oToolkit_JoypadPtr (offset 0x4 in the\
  \ toolkit).\n- Joypad fields used are oJoypad_Pressed (offset 0x2) and oJoypad_Held (offset 0x4) as\
  \ 16-bit reads.\n- Behaviour tree (in order, first match wins):\n  1. If Pressed has bits JOYPAD_START\
  \ (0x08) or JOYPAD_B (0x02) -> calls menu_confirmExitAndFade_812580C with R0=0x34 (sound id) and returns.\n\
  \  2. Else if Held has bit 0x10 (Up) -> writes the byte 4 to state_obj+2 (oState_Flags2) and calls playSoundEffect_7A_81258E8,\
  \ then returns.\n  3. Else, only if state_obj+0x12 (oState_Something12) is non-zero, the d-pad branch\
  \ is consulted:\n     - If Held has 0x0300 (Left+Right): clears bits 0xC0 from Held, passes the result\
  \ as R0 to sub_8125820 with R1=7, R2=0, then stores the joypad pointer at state_obj+0x70 (oState_LastJoypadPtr).\n\
  \     - If Pressed has 0x0300: returns (no-op).\n     - If Held has 0x00C0 (Up+Down): calls sub_8125820\
  \ with the raw Held value, R1=7, R2=0, and again stores the joypad pointer at state_obj+0x70.\n- State-object\
  \ fields touched:\n  * +0x02 (oState_Flags2) — written with 4 on held-Up.\n  * +0x12 (oState_Something12)\
  \ — read as a 16-bit guard; only when non-zero does the d-pad branch run.\n  * +0x70 (oState_LastJoypadPtr)\
  \ — written with the joypad struct pointer when a d-pad branch fires.\n- Calls three external helpers\
  \ (all in this file's vicinity, not yet typed):\n  * menu_confirmExitAndFade_812580C — Start/B exit-and-fade\
  \ prompt; passed 0x34 (likely a sound id, \"SOUND_MENU_EXIT\").\n  * playSoundEffect_7A_81258E8 — plays\
  \ sound 0x7A on held-Up.\n  * sub_8125820 — receives the d-pad bit pattern (sometimes with 0xC0 cleared)\
  \ plus constant args (7, 0); semantics unknown.\n- R8 is set from the caller's R0 at entry but never\
  \ read in this function; treated as scratch space.\n"
