- What is state_obj+0x12 (oState_Something12) gating? Likely a "menu list populated / cursor active" flag.
- What does state_obj+0x70 (oState_LastJoypadPtr) caching achieve downstream? Probably so a follow-up
  handler can re-examine the joypad snapshot that triggered the navigation.
- Why is the 0xC0 clear applied only on the Left+Right branch but not on the Up+Down branch?
