name: battle_ResetObjectActionState_80165B8
address: '0x080165B8'
kind: function
status: confirmed
summary: Sets a battle object's current action to 8 and clears its current phase (and phase-initialized flag), returning
  0.
interface: void battle_ResetObjectActionState(BattleObject* obj /* passed in r5 */); also returns r0 = 0 and sets
  NZ flags from that zero
details: 'Tiny state-reset helper for a battle object (r5 pointer). It writes 8 to the

  byte at oBattleObject_CurAction (offset 9), then stores a halfword zero to

  oBattleObject_CurPhaseAndPhaseInitialized, clearing both the current phase

  counter and its "phase initialized" flag in one store. It ends with r0 = 0

  loaded so the NZ flags describe zero — likely so callers can test the return

  (always false/zero) without extra setup. The meaning of action id 8 is not

  determined here; callers in r5-passing battle code use this to force an

  object into that action and restart its phase sequence from the beginning.

  Note the unusual calling convention: the object pointer arrives in r5, not

  r0, matching the surrounding battle-script helpers.

  '
