  reproduce: python3 tools/asmcat.py 0x08102F5C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code does match the described control flow: it reads [r0,#0x13] and [r5,#0x16], computes [r5,#0x16]*5+1
    pushed with r0,r1, calls object_getFrontDirection into r4, loads an 8-byte record from byte_8102F84
    via [r5,#0x16]*8 into r2/r3, restores r0/r1, and tail-calls object_getFirstPanelInDirectionFiltered(r0,r1,r2,r3,r4).
    However the proposed name ''object_getFirstFrontPanelFiltered'' is reasonable but omits ''InDirection''
    that appears in the callee; a closer fit is ''object_getFirstFrontPanelInDirectionFiltered''. The
    summary''s ''choosing between two hardcoded filter parameter sets based on the object''s type field''
    matches the 2-entry table indexed by [r5,#0x16].; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
