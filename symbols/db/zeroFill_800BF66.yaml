name: zeroFill_800BF66
address: '0x0800BF66'
kind: function
status: confirmed
summary: Clears the fixed 0xA0-byte work buffer at byte_203CF00 by zero-filling it via ZeroFillByWord.
interface: void zeroFill_800BF66(void) — takes nothing; clobbers r0-r1 and flags (delegated to ZeroFillByWord's
  return contract); r2/r3 and lr (as pc) are preserved/returned per contract
details: 'Leaf-ish wrapper with no parameters of its own: it hardcodes the destination address

  byte_203CF00 (0x203CF00, an IWRM work-area variable) and a size of 0xA0 bytes, then tail-calls

  into ZeroFillByWord(mut_mem=r0, num_bytes=r1). Only lr is pushed so it can return via

  ''pop {pc}'' after the call. It ignores r2/r3 on entry, and the contract lists them (plus

  r0/r1 and flags) as outputs only because callers observed whatever ZeroFillByWord leaves

  behind; the wrapper itself treats everything as pass-through except its hardcoded arguments.

  The neighboring constants at dword_800BF74..off_800BF84 (0x10000, 0x171, 0x100, and the two

  copies of &byte_203CF00) belong to the same data cluster; the second pointer at off_800BF84

  is the one actually loaded here.

  '
