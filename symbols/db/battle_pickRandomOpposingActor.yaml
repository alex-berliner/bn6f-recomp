name: battle_pickRandomOpposingActor
address: '0x080E5A8A'
kind: function
status: probable
summary: Picks a random surviving actor on the opposite alliance from the battle state's alive-actor lists.
interface: (r5 = battle object) -> r0 = pointer to a random enemy-side battle object, or 0 if none qualify;
  no flags guaranteed
details: Reads the caller object's oBattleObject_Alliance, XORs it with 1 to get the opposing alliance,
  and scales it by 0x10 (4 entries x 4 bytes) to index into the oBattleState_AliveBattleActors array from
  the toolkit's battle state. It then scans that side's 4 slots, collecting up to 4 non-null entries whose
  halfword at +0x24 is nonzero into a stack array. If any were collected, it calls GetPositiveSignedRNG
  and uses SWI 6 divide to take the random value modulo the count, returning stack[random % count]; otherwise
  it returns 0. This is a random-target selection among live opponents that still have a nonzero field
  at 0x24.
