  date: '2026-10-19'
  detail: eor with 1 and *0x10 offsets the AliveBattleActors list of the opposite alliance from the toolkit
    battle state; loop filters list entries for non-null and halfword [entry+0x24] != 0 into a stack array,
    counting them; GetPositiveSignedRNG followed by svc 6 (divide) computes random % count for the return
    index; returns a list entry pointer, or 0 when the count is zero (beq to epilogue)
