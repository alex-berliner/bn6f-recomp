name: EnterMap_RunMapGroupAsmFunction_8030A00
address: '0x08030A00'
kind: function
status: confirmed
summary: Dispatches to the per-map-group EnterMap handler from one of three jumptables (real-world, internet, unknown)
  based on the map group number in r0.
interface: void EnterMap_RunMapGroupAsmFunction_8030A00(u32 group /*r0*/); behaves as a tail call — handler's register
  outputs (r2, r4-r12) pass through to the caller; r0/r1/r3/lr and NZCV clobbered
details: "Trampoline that routes map-group entry setup to the right handler. The map group\nnumber in r0 selects\
  \ a jumptable:\n  - r0 >= 0xF0 (UNKNOWN_MAP_GROUP_START): \"unknown\" group table, index r0-0xF0\n  - r0 >= INTERNET_MAP_GROUP_START:\
  \ internet table, index r0-base\n  - otherwise: real-world table, index r0 as-is\nEach table holds word-sized\
  \ handler addresses. The chosen handler is invoked with\nr0 = its own jumptable entry address and r1 = its jumptable\
  \ base; any further\narguments the caller had staged in r2-r12 remain untouched and reach the handler\ndirectly,\
  \ since the dispatch is a `mov lr, pc; bx r0` call whose return path\n(`pop {pc}`) goes straight back to this\
  \ function's caller — effectively a tail\ncall that clobbers only r0/r1/r3/lr and the flags.\n"
