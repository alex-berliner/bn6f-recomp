- method: assembly-reading
  date: '2026-10-18'
  detail: bl TestEventFlagFromImmediate (EVENT_BFB); bne skip -> conditional re-init tied to story progress;
    ZeroFillByWord(r5=struct, 0x60) only when flag clear -> persistent work buffer; str 0xFF,[r5,#0x20]
    -> sentinel/init write into the same struct; bl ow_spawnMapObject1b -> spawns map object 0x1B, identified
    as the bus; returns mov r0,#0 with no flag use -> plain setup routine
