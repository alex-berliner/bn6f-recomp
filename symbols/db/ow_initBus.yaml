name: ow_initBus
address: '0x0808FE34'
kind: function
status: probable
summary: Initializes the bus map object and its 0x60-byte work buffer when entering the area, preserving
  the buffer once EVENT_BFB is set.
interface: () -> r0 = 0; no flags meaningful
details: Loads the pointer at off_808FDB8 to a work structure (dword_2000330 is offset 0x20 within it).
  If story flag EVENT_BFB is clear, zero-fills 0x60 bytes of the structure via ZeroFillByWord, so state
  persists across calls once the flag is set. Writes 0xFF to the word at +0x20, likely an 'invalid/unused'
  sentinel. Then calls ow_spawnMapObject1b to create the type-0x1B bus entity and two further helpers
  (sub_809003C, sub_809032C) that presumably set up its state/behavior. Always returns 0; no caller known,
  so it is likely invoked from map-init or script dispatch tables.
