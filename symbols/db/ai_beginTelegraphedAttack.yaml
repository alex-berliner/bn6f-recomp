    r0, frontDirection, PanelX then sub_80D8F98(r0,r1=PanelY,r2=InitFlag,r3=-4*AiDifficultyTier,r6=Damage)
    looks like spawning the attack toward the panel ahead; PlaySoundEffect 0x111 and StepTimer=0x46, HitElement=4
    store the attack's frame counter and element in oAIAttackVars
