name: ai_beginTelegraphedAttack
address: '0x080EE7EC'
kind: function
status: probable
summary: 'AI routine that begins a telegraphed enemy attack: starts animation 0xF on the battle object,
  locks it in place, spawns the attack via sub_80D8F98 using difficulty-tier and damage from oAIAttackVars,
  plays sound 0x111, and arms StepTimer=0x46 and HitElement=4 in oAIAttackVars.'
interface: (r0 = working battle object, r1/r2/r3/r7 = context with r7 = oAIAttackVars) -> r0 = clobbered;
  sets ObjectFlags1 bit 22 and CANNOT_SLIDE, animation 0xF, StepTimer 0x46, HitElement 4
details: Early-outs if the object already has ObjectFlags bits 0x1040 set, so it only fires in the right
  state. It starts animation 0xF and resets the counter timer, then sets flag bit (1<<22) and OBJECT_FLAGS_CANNOT_SLIDE
  on the object so it cannot move during the attack. It reads the object's PanelX/PanelY, adds object_getFrontDirection
  to the X to target the panel in front of it, and calls sub_80D8F98 with (targetX, targetY, oAIAttackVars_InitFlag,
  -4*oAIAttackVars_AiDifficultyTier, damage=oAIAttackVars_Damage) — the difficulty tier scales one argument,
  so sub_80D8F98 likely spawns/registers the attack with difficulty-dependent speed or count. Finally
  it plays sound 0x111, stores 0x46 (70 frames) into oAIAttackVars_StepTimer and element 4 into oAIAttackVars_HitElement.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst r0, 0x1040 early return gates the routine to a specific object-flag state; object_setAnimation
