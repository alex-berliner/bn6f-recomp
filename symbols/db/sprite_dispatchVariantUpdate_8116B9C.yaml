name: sprite_dispatchVariantUpdate_8116B9C
address: '0x08116B9C'
kind: function
status: confirmed
summary: Runs the variant-specific update routine selected by the sprite object's type byte (r5+9), then advances
  the sprite's animation.
interface: void sprite_dispatchVariantUpdate_8116B9C(void *obj /* in r5 */)
details: 'Expects the sprite/object pointer in r5 (the readable C treats r5 as the object; it is not set inside
  this function, so callers set it up before entry). Reads the byte at [r5+9] and uses it directly as a byte offset
  into a 3-entry word table at off_8116BB4, so the selector only ever holds 0, 4, or 8 (i.e. variant index 0/1/2).
  The selected handler (sub_8116BC0 / sub_8116BFC / sub_8116C14) is invoked with a mov lr, pc / bx r0 style tail-dispatch,
  so handlers return straight to this function; r0 and r1 are clobbered by the dispatch (r1 holds the selector byte,
  r0 the handler address). Afterwards it falls into sprite_update with lr pointing at the pop {pc}, so sprite_update
  returns directly to this function''s caller. All other registers pass through untouched.

  '
