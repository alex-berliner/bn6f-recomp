summary: 'Init handler of a fast lunging attack object: starts 9 px behind its panel and 13 px up, charges
  forward at 0.75 px/frame for 12 frames while rising, plays SFX 0xB3, and hands off to its updater sub_80CE5F0.'
interface: 'void battleObject_initFastLunge(u32 r5 /* battle object */) : r5 -> [r5 r8 r10]'
details: 'Frees the object when object_isCurrentPanelValid fails. sprite_load(0x80, 0x10, 0x17) + sprite_noShadow,
  ObjectFlags |= 2 (visible), palette = oBattleObject_Param1 * 4 (colour variants), recomputes pixel coords.
  XVelocity = object_getFrontDirection() * 0xC0000 (0.75 px/frame, 16.16 fixed point), Timer = 0xC, and
  X -= XVelocity * 12 (starts 9 px behind). ZVelocity = 0xC0000 and Z = 0xC0000*12 + 0x40000 (about 13.25
  px up): an arcing, rising lunge. Allocates collision data (frees the object on failure), object_setupCollisionData(0xA,
  5, 3), hit effect 2, clears the collision region, object_presentCollisionData once, CurAnim = CurAnimCopy
  = 4, sprite_setAnimation(4) + sprite_loadAnimationData, PlaySoundEffect(0xB3), CurState = CUR_STATE_UPDATE,
  tail-call sub_80CE5F0.

  '
