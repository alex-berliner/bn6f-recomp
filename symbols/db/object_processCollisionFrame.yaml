open_questions:
- No known caller, so it is unconfirmed where in the object-update loop this runs and what r0-r4 must
  hold on entry
- The jump table has a single visible entry (sub_80D6E70); its purpose and whether other CurAction handlers
  exist elsewhere is unknown
- The exact meaning of oBattleObject_Param3 (force collision processing during time stop?) is inferred
  only from the branch
