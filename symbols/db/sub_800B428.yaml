name: sub_800B428
address: '0x0800B428'
kind: function
status: hypothesis
summary: Reinitializes some global work structure, stamps a magic word next to it, and issues a mode-4 request to
  the state/screen manager at sub_80200A4.
interface: void sub_800B428(void); // r1-r3 out are whatever sub_80200A4 left in them (passed straight through);
  c/v out come from that call
details: "Tiny orchestrator, three steps:\n1. Loads the pointer stored at dword_203CBE4 and calls sub_802C8FA on\
  \ it. Given the\n   \"then reinit everything\" shape, this is most plausibly a clear/release/reset of the\n  \
  \ structure that pointer refers to (its exact semantics live in sub_802C8FA).\n2. Stores the constant word 0x1F2F3F4F\
  \ to dword_203CBE0, the word immediately before the\n   pointer slot. Writing a fixed magic next to a reset structure\
  \ looks like a state marker /\n   \"this area is now in state X\" stamp (e.g. an initialized/valid tag or a mode\
  \ selector\n   read elsewhere), not data.\n3. Sets r0 = 4 and tail-calls sub_80200A4, which by its call shape\
  \ (r1-r3 results flowing\n   straight back to this function's caller) acts as a mode/operation dispatcher; mode\
  \ 4 is\n   one of its switch cases. Note the magic word and mode 4 are adjacent concerns here and\n   probably\
  \ describe the same requested state from two sides.\nTouches only the two IWRAM words dword_203CBE0 / dword_203CBE4\
  \ plus the two callees;\npreserves r5-r7 (caller's r4/r10 inputs are simply not touched).\n"
