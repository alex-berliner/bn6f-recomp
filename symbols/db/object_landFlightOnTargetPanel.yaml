name: object_landFlightOnTargetPanel
address: '0x080D9E94'
kind: function
status: probable
summary: 'Update for a battle object flying through the air toward a target panel: integrates its velocity,
  then on landing either sets it down (solid panel) or destroys it (hole).'
interface: (r5 = battle object, no args) -> void; sets object CurState/CurAction/flags, collision region,
  coordinates
details: With r5 as a battle object, it first decrements oBattleObject_Timer; while the timer is still
  positive it integrates the object's velocity triple at 0x34/0x38/0x3C, adding the constant 0xFFFFD800
  (-0x2800, gravity-like) to the Z velocity at 0x40+8, and returns. Once the timer expires (or Z position
  <= 0), it copies Param3/Param4 into PanelX/PanelY and into the collision data, converts the panel coords
  to pixel coords and stores them as X/Y/Z (Z gets 0xA<<16 = 0xA0000). If the landing panel is solid,
  it sets collision region 1, sets object flag 0x10, plays sound 0x15 (0x16-1), sets CurAction=4 and resets
  the phase, so the object continues in a new action. If the panel is not solid (hole/broken tile), it
  recomputes coordinates, calls sub_80E1D7A (likely a fall/splash effect spawned with the object's X/Y
  and 0,0), clears the collision region, clears flag 0x2, and sets CurState to DESTROY.
