    run wf investigate investigate-20261019-033611'
open_questions:
- What sub_813D978 does (would tell whether the nonzero-flag path is a reset or a timeout fallback)
- What handlers sub_803CA64 and sub_803CA90 do (would reveal the two link states, e.g. open/closed)
- What byte_200AF85 means and who sets it
- No callers known, so the calling convention (r7 as self, args ignored) is unconfirmed
