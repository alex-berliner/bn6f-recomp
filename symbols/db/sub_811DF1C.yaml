name: sub_811DF1C
address: '0x0811DF1C'
kind: function
previous_names: []
status: hypothesis
summary: weather composition dispatcher that reads eWeatherCompState and jumps to one of three weather composition
  handlers, passing a BattleObject* derived from r5 in r0 and a byte from the object at r5+8 in r1
interface: (r0 = ???, r5 = BattleObject*) -> r0 = ???, r1 = ??? ; branches via r0-derived function pointer; reads
  eWeatherCompState global
details: "Pushes {lr} then loads off_811DF30 into r0 (via literal pool at off_811DF2C). Loads a\n  byte from [r5+8]\
  \ into r1 (BattleObject header byte at offset 8 = CurState, per\n  BattleObject.inc; with size 0x10 linked list\
  \ + 0x8 ObjectHeader this is offset 0x8 into the\n  body, i.e. CurState). Uses r1 as an index into the jump table\
  \ at off_811DF30 which holds three\n  Thumb targets: sub_811DF40, sub_811DF94, sub_811DFCC (each +1 to switch\
  \ to Thumb mode).\n  Loads eWeatherCompState into r6 (read but not otherwise used in this stub — likely scratch).\n\
  \  Sets lr = pc then bx r0, so the dispatch is a tail call. `pop {pc}` returns if r0 happened to\n  be 0 / null.\
  \ With only three entries the index is masked implicitly (any value >=3 will read\n  past the table; ldrb means\
  \ max 255). The \"weather\" framing fits battle scene composition\n  switching tied to CurState.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, off_811DF2C // =off_811DF30` followed by `ldrb r1, [r5,#8]` shows the function reads the CurState
    of the battle object at r5 and indexes a 3-entry table of Thumb function pointers at off_811DF30. - The jump
    table at off_811DF30 contains `sub_811DF40+1`, `sub_811DF94+1`, `sub_811DFCC+1` — three targets with Thumb bit
    set, confirming a small state machine. - `ldr r6, off_811DF3C // =eWeatherCompState` loads a global with the
    conventional naming pattern for a composition/state word used elsewhere in the battle engine; it isn''t used
    in this body, so the actual state value lives in the table index via r1. - `mov lr, pc` / `bx r0` is a Thumb
    interworking tail call. - `pop {pc}` at the end is a defensive fallback for a null/missing handler.'
