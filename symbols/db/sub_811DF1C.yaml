open_questions:
- The exact semantics of each of the three handlers (sub_811DF40/DF94/DFCC) are unknown; they
- presumably render or transition between weather compositions.
- Whether r0 passed in by the caller is the function pointer table base (likely r10-derived
- toolkit) or just scratch isn't visible from this stub — the contract shows r0 as in, but
- the stub immediately overwrites r0 from off_811DF2C. So callers must not depend on r0 here;
- the meaningful argument in is the object pointer in r5 and the global eWeatherCompState.
- Confirming the BattleObject layout assumption (r5+8 == CurState) would require checking
- sub_811DF40/DF94/DFCC.
