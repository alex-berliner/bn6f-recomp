name: writeByteToWorkSlots0And1_800B8AC
address: '0x0800B8AC'
kind: function
status: confirmed
summary: Writes the same byte value into two single-byte state/work slots (slot 0 and slot 1) obtained from sub_800BF5C.
interface: void writeByteToWorkSlots0And1(u8 value /* r0 */); preserves r4, clobbers r0-r1, lr and flags
details: 'Saves r4, copies the incoming r0 (a byte-sized value) into r4, then calls sub_800BF5C

  with r0 = 0 and stores the value byte at the pointer it returns; repeats with r0 = 1

  to store the same byte at the second slot. sub_800BF5C evidently returns the address

  of one slot of a small byte array (index passed in r0), so the effect is that slots 0

  and 1 of that work area both end up holding the caller''s value. This "same byte into

  two adjacent slots" pattern usually mirrors a value into a second buffer (e.g. a

  current/previous copy, or a value needed by two consumers), but the owning subsystem

  is not identifiable from this function alone. No return value; flags and r0/r1 are

  scratch. r4 is pushed/popped purely as a scratch hold for the value, so the caller''s

  r4 is preserved even though its incoming value is never read.

  '
