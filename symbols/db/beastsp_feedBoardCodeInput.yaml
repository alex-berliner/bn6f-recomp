name: beastsp_feedBoardCodeInput
address: '0x08136804'
kind: function
status: probable
summary: On A/B/L/R presses during the Navi Customizer board, converts the selected cell's content into
  a code input and feeds it to the BeastSP secret-code checker.
interface: (r0 = new key bitmask, r5 = board state) -> void; [r5+0x17] code-progress index updated in
  place
details: r0 is a held/pressed key bitmask tested against 0x303 (A|B|L|R); if none pressed it returns immediately.
  Otherwise it sums the two cursor coordinate fields at [r5+0x20] and [r5+0x24] and calls sub_8136290,
  which returns a pointer whose halfword is the selected cell's value; subtracting 0x90 maps that cell
  value onto a code-button id. That id and the running progress index [r5+0x17] go to beastsp_checkSecretCode,
  which validates one step of the 10-input code (toggling 4 event flags on completion) and returns the
  updated index, stored back to [r5+0x17]. The trailing byte tables (0x14,0xA... and repeated 0x30/0x32...
  0x34... 0x38 patterns) look like neighboring cell/palette layout data rather than code data.
