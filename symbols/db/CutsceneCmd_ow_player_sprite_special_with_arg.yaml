name: CutsceneCmd_ow_player_sprite_special_with_arg
address: '0x08037B6C'
kind: function
status: confirmed
summary: Overworld map-script command that sets a single player-sprite property (layer index, facing direction,
  palette, alpha, Navi palette or S2000AA0 +0x4 param) using a literal byte or a script-variable byte as the value.
interface: '/* Inputs from caller (via r5/r7/r10/lr and r3 implicit): */

  /*   r5 = script variable table base */

  /*   r7 = current map-script byte pointer (advanced past this command) */

  /*   r10, lr = preserved by convention */

  /*   r3 = untouched on entry (ReadMapScriptByte receives no typed arg there) */

  /* Outputs to caller: */

  /*   r0 = 1 (always: command succeeded) */

  /*   r1, r2, r4, r5, r7, r8, r9, r10, r11, r12 = unchanged from each handler */

  /*   r7 += 4 (the whole 4-byte command is consumed) */

  /* Flags: */

  /*   N/Z from the final "movs r0, #1" (so N=0, Z=0) */

  /*   C/V from the "adds r7, #4" before that (depends on prior r7 low byte) */

  /* Clobbered by this function internally: r0, r3, r4, r6, lr */

  '
details: "Command layout at the script byte the caller pointed r7 at (4 bytes total):\n  +0  byte 1 read by ReadMapScriptByte\
  \ (r6=1): used as an *unscaled* word\n      offset into the handler table off_8037B9C. The original does\n   \
  \   `ldr r3, [r3, r4]` (no LSL #2), so scripts store 0, 4, 8, 0xC, 0x10,\n      0x14 here, not a plain 0..5 index.\n\
  \  +1  byte 2 read by ReadMapScriptByte (r6=2): value-source code.\n      0xFF -> byte 3 is a literal; anything\
  \ else -> byte 3 is an index\n      into the variable table at r5.\n  +2  byte 3 read by ReadMapScriptByte (r6=3,\
  \ only when byte 2 == 0xFF):\n      the literal value.\n\nHandler table off_8037B9C (each entry is a Thumb +1,\
  \ so each callable is\nentered with `mov lr, pc; bx r3` and gets +1 dropped for Thumb):\n  offset 0x00  WriteOWPlayerLayerIndexOverride\n\
  \  offset 0x04  SetOWPlayerFacingDirection\n  offset 0x08  owPlayer_setPalette_809e2a0\n  offset 0x0C  owPlayer_setAlpha_8002c7a_809e4a0\n\
  \  offset 0x10  SetOWPlayerNaviPaletteIndex\n  offset 0x14  owPlayer_setS2000AA0Param0x4_809e314\n\nThe resolved\
  \ value is passed in r0 *and* r4 into the handler. The script\npointer r7 is given to the handler to advance,\
  \ then the function itself\nunconditionally adds 4 with `adds r7, #4` (this 4-byte skip is *not* done\nby the\
  \ handlers). r0 is then forced to 1 regardless of the handler's\nreturn, so the cutscene machinery always sees\
  \ the command as successful.\n\nQuirks:\n- Lookup is unscaled; a malformed selector byte would load a misaligned\n\
  \  word and `bx r3` into it, treating script data as code.\n- The \"+1\" Thumb trick in the table means the handler\
  \ entries are Thumb\n  function pointers offset by 1, which the `bx r3` consumes.\n- When byte 2 != 0xFF, byte\
  \ 3 is *not* read from the script stream; the\n  variable lookup uses the raw byte as an index into r5.\n"
