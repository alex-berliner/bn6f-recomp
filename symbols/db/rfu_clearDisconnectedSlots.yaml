name: rfu_clearDisconnectedSlots
address: '0x08146D98'
kind: function
status: probable
summary: Scans the four wireless link slots for peers whose connection has ended (state 0x46/0x47/0x48),
  clears those slots, and when every tracked slot is finished resets the player's block in the shared
  wireless data buffer.
interface: '(r0 = work struct ptr: +0x01 status byte out, +0x0C buffer ptr, +0x14 byte size, r1 unused)
  -> r0 = ?; destroys r-r7 saved'
details: 'Loops i = 0..3, testing bitmask byte_2010292 against (2<<i) to see which slots are active; for
  each active slot it loads dword_2010CB0[i] (a link-slot state struct) and checks the halfword at +0x34.
  States 0x46, 0x47 and 0x48 are treated as ''peer gone'': rfu_clearSlot(8, i) frees that slot, and slot
  0x47/0x48 additionally sets [r6+1] = 2. It accumulates the checked mask bits in r7; if all bits of byte_2010292
  were consumed (r7 == mask), it sets [r6+1] = 1, computes r9 = unk_2009480 + byte_2010328 * ((size>>2)*4)
  (i.e. base + playerIndex * blockStride), zero-fills the buffer at [r6+0xC] for [r6+0x14] bytes, and
  calls sub_8146E48 with (r6, r9) — presumably to rebuild/prime that block for continued reception.'
