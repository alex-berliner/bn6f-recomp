name: battle_objectPhase4DelayWait
address: '0x080B9A96'
kind: function
status: probable
summary: Battle-object state step that waits 30 frames in phase 4, then switches the object to action
  8
interface: (r5 = battle object ptr, no args) -> r0 = scratch only; updates oBattleObject_CurPhase, oBattleObject_TimerAndTimer2,
  oBattleObject_Timer, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: Reads oBattleObject_CurPhase from the object in r5. If it is 0, sets CurPhase = 4 and loads oBattleObject_TimerAndTimer2
  with 30 (0x1E). Otherwise it decrements the 16-bit oBattleObject_Timer each frame; when it hits 0 it
  writes CurAction = 8 and clears CurPhaseAndPhaseInitialized to 0, moving the object to its next behavior.
  No other registers or structures are touched, and there is no return value.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst r0,r0; bne — branch on current phase (sub_80B9A96
    prologue); strb r1(4),[r5,#oBattleObject_CurPhase]; mov r0,#0x1e; str r0,[r5,#oBattleObject_TimerAndTimer2]
    — phase 0 arms a 30-frame wait in phase 4; ldrh/strh on oBattleObject_Timer with sub #1; bgt — per-frame
    countdown of the armed timer; mov r0,#8; strb r0,[r5,#oBattleObject_CurAction]; strh r0(0),[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    — on timer expiry the object advances to action 8 with phase reset'
  refs:
  - bn6f/asm/asm31.s:3409
  reproduce: python3 tools/asmcat.py 0x080B9A96
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
