name: battle_regenSpawnEffectObject
address: '0x0810EB42'
kind: function
status: probable
summary: Lazily spawns the tethered regen-effect battle object 0x54 for a regenerating enemy and stores
  its handle.
interface: (r5 = owner battle object, r4/r6/r7 preserved) -> r0 = spawned object handle or existing handle;
  no meaningful flags
details: Reads the owner's ExtraVars+4; if it already holds a spawned-object handle the function does
  nothing. Otherwise it calls battle_spawnOwnedObject54 with arguments r0=0, r1=0, r2=7, r3=0, creating
  auxiliary battle object 0x54 tethered to the owner (inheriting position and alliance), and stores the
  returned handle in the owner's ExtraVars+4. The parameter 7 passed as the third argument presumably
  selects the effect's animation/behavior. This is a one-time lazy initialization, so the effect object
  persists for the object's lifetime and is presumably freed with the owner.
