open_questions:
- What exactly dword_20349A0 represents (chip-use/animation counter? a beast-form timer?) and which caller reads
  it back via the r1 handle.
- The semantic meaning of r5_obj[0x10] vs [0x15] (seems to gate which emotion getter is used); unclear which entity
  role owns this object.
- Why emotion values 5 and 0x11 specifically; presumably hostile/roar states that feed an "enemy is enraged enough
  to beast-out" gate elsewhere.
