- date: '2026-10-11'
  what: 'readable C taken out of cport/src/game/asm03_0_80299B6.c after review against the assembly (the lifted original runs again); status confirmed -> probable, as the checks that confirmed it ran code that differs from the original: Clamp done in 8 bits. Asm: `ldrb r0,[r1,#0x11]; add r0,#1; cmp r0,#3; ble; mov r0,#3; strb r0,...` does the add in 32 bits, so a byte of 0xFF gives 0x100, which is clamped to 3 and stored as 3. C: `u8 counter = LD8(base + 0x11) + 1; if (counter > 3) counter = 3;` wraps 0x100 to 0, so it stores 0. Input: byte_20349B1 = 0xFF on the increment path (mode not 2/3/4/5/8, [r5+0x10]=0, emotion 5 or 0x11):...'
  tool: review (Claude, workstream J)
