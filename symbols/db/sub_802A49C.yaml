name: sub_802A49C
address: '0x0802A49C'
kind: function
status: probable
summary: Per-frame tick that increments a beast-out counter (clamped to 3) when the current battle emotion reads
  5 or 0x11 under non-boss battle modes, and resets it otherwise.
interface: 'void tickBeastOutCounter_802A49C(void);

  // inputs:  r5 (battle entity object), r10 (toolkit/BTL state wrapper), r4/r6 preserved

  // outputs: r1 = dword_20349A0 (address of the counter struct, left in r1 for caller)

  // clobbers: r0, r2, r3, lr, flags N/Z/C/V

  '
details: 'Reads the current battle mode via GetBattleMode(); if the mode is 2, 3, 4, 5 or 8

  (i.e. dialogue/communication/etc. screens rather than real battle), the counter is

  reset to 0 and the function returns.

  Also resets when r5_obj[0x10] (a per-entity emotion/state byte) is non-zero or when

  that byte differs from r5_obj[0x15].

  Otherwise queries the enemy''s alliance byte (toolkit->battleState->unk_0d) through

  either callPossiblyGetBattleEmotion_8015B54 (r5_10 == r5_15 branch) or sub_8015B5C

  (mismatched-branch variant) and inspects the returned emotion in r1. Only emotions

  5 and 0x11 cause the counter to advance.

  The counter lives at dword_20349A0 + 0x11 (byte_20349B1): it is incremented each

  call in qualifying states, saturated at 3. The pointer to dword_20349A0 is returned

  in r1 so callers can read the (now possibly advanced) counter via their own

  +0x11 offset.

  '
