    run wf investigate investigate-20261019-022109'
open_questions:
- What kind of battle object ID 0x3a is (only one caller sub_80F8914, itself undocumented, would tell)
- Why the caller passes arguments in r5/r6/r7 — likely sub_80F8914 already holds these values in registers
  and this is a hand-written wrapper convention
- Whether object_spawnType3 really returns the object pointer in r5 or in r0 as well
