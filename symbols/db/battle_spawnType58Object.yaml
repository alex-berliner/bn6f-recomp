name: battle_spawnType58Object
address: '0x080CB410'
kind: function
status: probable
summary: Spawns a battle object of type-3 kind with ID 0x3a and initializes its panel position, element,
  related-object link, damage field and extra-vars back-pointer from the caller's arguments.
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = related battle object, r6 = damage/stamina value,
  r7 = extra-vars pointer) -> r0 = spawned object or 0
details: Pushes r0-r2 and r5 so object_spawnType3 can read them as its four stack arguments (type id 0x3a
  in r0 makes five caller-supplied args), then takes the new object pointer (returned in r5) into r0.
  On success it stores the original r0/r1/r2 into oBattleObject_PanelX/PanelY/Element, the original r5
  into oBattleObject_RelatedObject1Ptr, r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler and
  r7 into oBattleObject_ExtraVars, and writes the new object pointer back through r7 (*extraVars = object).
  It also copies AllianceAndDirectionFlip from the related object (r5) to the new one, so the spawned
  object inherits the linked object's alliance/direction. On spawn failure (r5 == 0) it returns immediately
  without touching any object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x3a; bl object_spawnType3 with pushed r0-r2,r5 supplying the remaining four spawn
    arguments; mov r0,r5 then beq locret: flags/r0 come from the pointer spawnType3 leaves in r5, zero
    means spawn failed; pop {r1-r3,r5} restores the original r0,r1,r2 into r1-r3 for the strb to PanelX/PanelY/Element;
    str r5,[r0,#RelatedObject1Ptr] plus ldrh/strh of AllianceAndDirectionFlip from that same r5 links
    the new object to the related one and copies its alliance; str r0,[r7] alongside str r7,[r0,#ExtraVars]
    registers the new object through the caller''s extra-vars pointer'
