name: get_lookupEntryField15Ptr
address: '0x081466C4'
kind: function
status: probable
summary: Returns the address of the 8-byte field (offset 0x15) of the 0x20-byte list record selected via
  the unk_2010330 index table, used as a copy destination by list-building callers.
interface: (r0 = record index (byte)) -> r0 = dword_2010CC0 + 0x14 + unk_2010330[index]*0x20 + 0x15; no
  flags set meaningfully
details: 'Pure address computation: clamps r0 to a byte, reads a selector byte from unk_2010330[index],
  scales it by the 0x20 record stride, and adds it to dword_2010CC0 plus 0x14 (entries appear to start
  at base+0x14) plus 0x15 (field offset within the entry). Both callers use the result as the destination
  of an 8-byte sub_81469F0 copy, right after a 13-byte copy to the entry base returned by sub_81466F4
  — consistent with entries laid out as [13-byte field][...][8-byte field][...][pad] in 0x20-byte records.
  byte_2010288 supplies the number of entries to process. No writes, no flags; a thin offset-of-field
  accessor.'
