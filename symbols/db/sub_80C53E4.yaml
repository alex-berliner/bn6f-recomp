kind: function
status: confirmed
summary: BattleObject destructor that optionally cracks the panel beneath it before generic teardown.
interface: void object_destroyWithPanelCrack_80C53E4(BattleObject* r5)
details: 'A custom destroy hook for a BattleObject (r5). Reads a per-object flag at

  oBattleObject_Param3 (the oBattleObject_ struct is the standard battle-object

  overlay used throughout BN6); if the flag is non-zero, the routine calls

  object_crackPanel with the object''s current panel coordinates

  (oBattleObject_PanelX, oBattleObject_PanelY), so destruction of the object

  leaves the panel underneath in a Cracked state. Regardless of the flag,

  control falls through to object_genericDestroy to perform the usual

  teardown. Preserves r4, r5, r6, r7, r10 across the call.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
