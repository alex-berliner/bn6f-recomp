name: ai_guardAttackStep
address: '0x080FC3E2'
kind: function
status: probable
summary: AI attack-state step that turns the enemy into a guard object on its panel for a timed duration,
  then removes it.
interface: (r7 = AI attack-state struct oAIAttackVars) -> r0 = undefined; calls object_setFlag1/object_clearFlag,
  PlaySoundEffect(0xA0)
details: On first invocation (AttackElement==0) sets AttackElement=4, ORs OBJECT_FLAGS_GUARD into the
  battle object's ObjectFlags1, copies TimerOrCycles into StepTimer, calls sub_80D1BF4(AiAttackParam,
  TimerOrCycles) to spawn the attack object, plays SFX 0xA0, and stores sub_80E7A88's return (a panel-object
  handle) into PanelParamFlags2. On later steps it decrements StepTimer; on expiry it clears ObjectFlags1
  bit 1 (the guard flag), calls object_exitAttackState, and if a panel handle exists cleans it up via
  sub_80E7AA0. If AiAttackParam's first word is nonzero, it instead sets HitElement=0x10 and cleans up
  the panel object immediately. The struct fields used are AttackElement, TimerOrCycles, StepTimer, AiAttackParam,
  HitElement, PanelParamFlags2.
