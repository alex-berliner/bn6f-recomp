- method: assembly-reading
  date: '2026-10-18'
  detail: 'entry branch: ldrb AttackElement; tst; sets it to 4 and calls object_setFlag1 with OBJECT_FLAGS_GUARD;
    PlaySoundEffect 0xA0 right after spawning via sub_80D1BF4(AiAttackParam, TimerOrCycles); timer branch:
    decrements StepTimer, then object_clearFlag(1) + object_exitAttackState — symmetric teardown of the
    entry setup; PanelParamFlags2 stored from sub_80E7A88 and freed via sub_80E7AA0 — panel-object create/cleanup
    pair; loc_80FC434 writes HitElement=0x10 and frees the panel object when AiAttackParam[0] != 0'
