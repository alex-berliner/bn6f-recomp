name: battle_updateEnemyObjectFrame
address: '0x080CF18C'
kind: function
status: probable
summary: 'Per-frame update routine for a battle enemy object: marks it active, clears its palette flag,
  winds up collision/hit state, ticks its lifetime timer, dispatches its CurAction handler through a fixed
  table, then refreshes collision and sprite.'
interface: (r5 = battle object pointer, no register args) -> r0 clobbered by calls; sets object Flags
  bit 0x2
details: 'The object is passed in r5, the codebase''s battle-object convention. First it ORs flag bit
  0x2 into oObjectHeader_Flags (marking the object as active/updated this frame), then calls sprite_clearFinalPalette
  to drop the final-palette high nibble. It then runs the standard per-frame teardown/update chain shared
  by battle objects: finishCollisionHitReaction (hit wind-down + spark), objectTimerCountdown (lifetime/expiry),
  dispatchActionHandler with a fixed 9-entry CurAction table (reset action state, initAndRunAI, and custom
  handlers like sub_80CF250/sub_80CF1DC/sub_80CF2B4), object_presentCollisionData, and object_updateSprite.
  The custom dispatch table and custom handlers indicate this is the update for one specific enemy/object
  type rather than the generic shared update.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/orr #2/strb on [r5,#oObjectHeader_Flags] marks the object active before the update chain;
    sequence of object_finishCollisionHitReaction, battle_objectTimerCountdown, object_presentCollisionData,
    object_updateSprite is exactly the standard per-frame battle object update chain; ldr off_80CF1B4
    + bl battleObject_dispatchActionHandler_801B394 dispatches CurAction through a fixed 9-entry handler
    table; table includes battle_ResetObjectActionState_80165B8 and battleObject_initAndRunAI_8016B02,
    the standard enemy action-state and AI entries; bl sprite_clearFinalPalette clears the object''s final-palette
    high nibble each frame'
