open_questions:
- Whether the trailing fifth `lsl r4,#1; bcc locret` is meaningful (DAMAGE_NOTHING case) or pure padding.
- What sub_801A4D0 does with r0=0xf7/0xf8 — the contract lists r1 and r5 as in but no memory ptr, so it
  likely reads the same CollisionData via a different routing path.
