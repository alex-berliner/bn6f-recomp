name: playGameOver_803FB9C
address: '0x0803FB9C'
kind: function
status: confirmed
summary: 'Per-frame tick of the game-over sequence state: decrements DownCounter, plays the game-over jingle when
  the counter reaches 0xAF, and on expiry starts a screen fade and advances Index to 8.'
interface: void playGameOver_803FB9C(struct S200F348 *self /* r5 */); /* passes r2/r5/r10/lr in, leaves r0/r1/r10
  out (r2/r3/lr/flags clobbered; r4/r5/r6/r7/r10 preserved) */
details: "Operates on a state struct pointed to by r5 with the documented offsets\noS200F348_DownCounter and oS200F348_Index_00.\
  \ Each call decrements the 16-bit\nDownCounter (LD16/ST16). Two specific countdown milestones trigger work:\n\
  \  - counter == 0xAF: PlayMusic(SONG_GAME_OVER) is queued.\n  - counter == 0 (after decrement): SetScreenFade(0xC,\
  \ 8) is called and\n    Index_00 is set to 8, which routes the next frame through the\n    sub_803FBC2 / cb_803FB3C\
  \ cutscene handler.\nOutside those two milestones the function simply decrements and returns.\nThe function is\
  \ on the per-frame dispatcher chain for the game-over\nstate object (S200F348).\n"
