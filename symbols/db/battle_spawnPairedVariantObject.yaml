open_questions:
- What battle entity object ID 0x4B is in game terms (no known caller summary or data naming for byte_80CD8AC)
- Meaning of the 8 bytes in each byte_80CD8AC record beyond offset 5 passed to setFieldBattleObject
- What r4 contributes to the spawn and what r6's value represents
- Why the partner link only applies when Param1 > 1 (which two-object setup this models)
