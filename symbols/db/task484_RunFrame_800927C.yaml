details: "No-argument Thumb routine that services the task whose ID is 0x484 (the literal is\nloaded from off_800929C\
  \ and passed in r0). Sequence:\n  1. eStruct2035280_SetRequestBits_801BECC(0x484) - sets this task's request bits\
  \ in the\n     task-manager structure at 0x2035280, marking it as ready to run.\n  2. dispatch_801DA48(0x484)\
  \ - dispatches/runs the task for this frame.\n  3. sub_801E5F8 and sub_801DA24 - shared post-dispatch bookkeeping\
  \ (task-runner\n     housekeeping common to all task frame handlers).\n  4. sub_801E0A0(0, 0) - clears the active\
  \ task state with r0 = r1 = 0.\nThe function itself takes no real parameters and returns nothing; the \"Next\"\
  \ return type\nin the C version just reflects falling through to the caller. It is essentially a thin\nper-frame\
  \ wrapper around the task system; all actual game logic for task 0x484 lives\nbehind dispatch_801DA48. What task\
  \ 0x484 corresponds to in game terms (a cutscene,\nmenu, battle step, etc.) is not determined from this body alone.\n"
