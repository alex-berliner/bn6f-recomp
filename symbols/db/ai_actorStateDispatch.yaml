name: ai_actorStateDispatch
address: '0x0810FDD0'
kind: function
status: probable
summary: 'AI-state dispatcher for an enemy actor: indexes a 3-entry handler table by the actor''s script/state
  id and calls that handler.'
interface: (r6 = actor object, field oAIState_ScriptId = state index) -> r0 = whatever the dispatched
  handler returns; returns to this function's caller
details: Loads the actor's current state id from [r6,#oAIState_ScriptId], uses it to index a jump table
  at off_810FDE4 containing three thumb handlers (ai_checkActorNearbyOrTimeoutScript, ai_dashAttackInit,
  sub_810FF1C), and calls the selected one via the lr=pc/bx trick so control returns here, then pops back
  to the caller. The table has exactly 3 entries, so this actor's behavior is a 3-state machine (e.g.
  idle/check, dash-attack setup, sub_810FF1C state). No bounds check on the state id. Note the pushed
  r4 and r6 are unused except r6 as the actor pointer, suggesting a shared signature for actor AI update
  steps.
