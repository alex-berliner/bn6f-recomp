summary: Flags a battle object's current state so its update step will run next.
interface: void battle_object_SetStateUpdatePhase(battle_object* r5); // returns r0 = 4 (CUR_STATE_UPDATE), N/Z
  set from it
details: 'Stores the constant CUR_STATE_UPDATE (4) into r5''s CurStateActionPhaseAndPhaseInitialized field (oBattleObject_CurStateActionPhaseAndPhaseInitialized),
  telling the battle object state machine that the current state should perform its update action on the next processing
  pass. Trivial thumb routine: push {lr}, store constant, pop {pc}. Quirk: r0 is left holding 4 and the N/Z flags
  reflect that value, so callers may (accidentally or deliberately) observe it; no other registers or memory are
  touched.'
