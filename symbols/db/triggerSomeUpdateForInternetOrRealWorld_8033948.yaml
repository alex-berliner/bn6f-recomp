name: triggerSomeUpdateForInternetOrRealWorld_8033948
address: '0x08033948'
kind: function
status: confirmed
summary: Resets the eS2011E30 work block and queues the per-area update (internet vs real-world handler) plus its
  graphics transfer.
interface: void triggerSomeUpdateForInternetOrRealWorld_8033948(void); // reads r10 (toolkit)->gameState; preserves
  r4-r7; r0,r1,lr clobbered; returns with flags from gfxTransfer_8033978
details: Zero-fills the 16-byte work block at eS2011E30 (r5), then reads the current map group from the game state
  pointed at by the toolkit's oToolkit_GameStatePtr (r10-relative, mapGroup at +4). If mapGroup < INTERNET_MAP_GROUP_START
  (real world), it writes 1 to the block's selector byte at +4 so dispatch_80339CC runs onUpdateInRealWorld_8033A96;
  if mapGroup >= INTERNET_MAP_GROUP_START (internet), it calls GetCurPETNavi, then GetMaxAndCurHPForCurPETNavi_80010D4
  and stores the returned max HP halfword at block+8 before writing 1 to the selector, making dispatch run onUpdateInInternet_8033B1E
  instead. Both paths then call gfxTransfer_8033978 (block kept live in r5, game state in r7) to perform the work
  block's graphics transfer. r2/r3 pass through untouched from callers to the contract's read-back, and r4-r7 are
  pushed/popped so they are preserved at return even though callees may clobber the function's own copies.
