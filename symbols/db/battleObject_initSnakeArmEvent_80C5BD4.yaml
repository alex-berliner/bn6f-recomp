    - `cmp r1, #2 ; bne loc_80C5BFA` chooses oBattleObject_CurAnim=3 when Param1==2, else 1; final `str
    r0, [r5,#oBattleObject_CurAnim]` shows this - `ldrb r0, [r4,#3] ; bl sprite_setPalette` proves byte+3
