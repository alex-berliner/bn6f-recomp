status: probable
summary: 'Initializes a battle object used by the SnakeArm scripted event after spawn: loads its sprite/animation,
  picks a starting anim index from Param1 (3 when Param1==2 else 1), sets up a small per-variant config
  table as ExtraVars, allocates/initializes collision data, sets hit effect 0xFF, and dispatches into
  the standard initial collision-event handler.'
interface: 'in (r5 = oBattleObject in toolkit''s standard battle-object convention, r10 = toolkit base,
  r7/r8/lr = extra callers'' preserved state) -> void ; side effects: writes oBattleObject_Params, oObjectHeader_Flags,
  oBattleObject_CurAnim/CurAnimCopy, oBattleObject_ExtraVars, CollisionDataPtr (via object_createCollisionData),
  and the object''s CollisionData fields; on allocation failure calls object_freeMemory and tail-returns'
details: '1. Calls sprite_load(0x80/0x0C, 0x02) and sprite_loadAnimationData() to mount the placeholder
  sprite attached to the battle-object header, then sprite_hasShadow().

  2. Sets OBJECT_FLAG_VISIBLE (bit 1) in oObjectHeader_Flags.

  3. Selects CurAnim: if oBattleObject_Param1 == 2 then CurAnim = 3, else CurAnim = 1; clears CurAnimCopy
  to 0xFF as a sentinel ("no override").

  4. Looks up a 4-byte per-variant config record at byte_80C5BA0 + (Param1*4) via off_80C5C3C, stores
  its pointer in oBattleObject_ExtraVars, and reads byte+3 from it as the palette index to pass to sprite_setPalette.

  5. Allocates a CollisionData slot via object_createCollisionData; if it returns NULL, frees the whole
  battle object via object_freeMemory and returns.

  6. Loads three config bytes (offset 0/1/2 of the record) into r1/r2/r3 and calls object_setupCollisionData
  to fill the new CollisionData (region/element/flags etc.).

  7. Sets the hit-effect byte to 0xFF via object_setCollisionHitEffect, then calls object_presentCollisionData
  so the next-frame handler is enqueued.

  8. Writes CUR_STATE_UPDATE (0x4) into oBattleObject_CurStateActionPhaseAndPhaseInitialized and tail-calls
  battle_processCollisionEvent_80C5C40, which uses the table record at oBattleObject_ExtraVars as the
  per-action handler table for the "SnakeArm" scripted-event lifecycle.

  Captured-call context (snap_story2_*.bin) shows the function reached via a tail-call from r5=080c5bbc,
  with r2=02036778 (likely a free-list / cur-battle-data ptr in EWRAM); at exit r0 points into EWRAM (020386e8
  / 02038790), the heap-allocated CollisionData pointer installed in the new object.

  '
