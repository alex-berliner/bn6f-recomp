open_questions:
- The exact layout of the 4-byte records at byte_80C5BA0 (which fields are which, beyond the use of byte[3]
  as palette and bytes[0..2] as collision-config triple) — would be settled by inspecting the records
  or by callers passing Param1 to identify the variant
- 'Whether the function name "SnakeArm" is appropriate: SNAKEARM_EV_* constants (1/2/3/0x20) exist in
  BattleObject.inc but the only visible tie is the constant naming convention. A second event-object init
  at the same call site (likely also here or in the same area) might be the other SNAKEARM event that
  should share the helper. A more cautious working name might be battleObject_initCollisionEventObject_80C5BD4
  until the SnakeArm attribution is confirmed.'
- 'Whether `r0` is actually unused: the captured calls always show r0=0; harmless at the assembly level
  since the function doesn''t read it.'
