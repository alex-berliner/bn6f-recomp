  offset 0x13 for the current navi. Four callers (sub_813CD14/CD22/CD30 at 0x0813CD14-0x0813CD30 and sub_813CEF8)
  invoke it, but their code is not shown, so the game meaning of byte 0x13 (a flag being cleared, a counter
  reset, etc.) cannot be determined from this function alone.'
