name: sub_80C0840
address: '0x080C0840'
kind: function
status: confirmed
summary: Dispatches a battle object's per-action update via a jump table, then refreshes its sprite and runs shared
  end-of-update processing.
interface: '/* arm: takes/returns the battle object in r5 */

  u32 sub_80C0840(u32 r5 /*battle object*/); /* returns object in r5 */

  '
details: "- Indexed jump table at off_80C0858, five entries keyed by the raw byte\n  at object + oBattleObject_CurAction\
  \ (no scaling: 'ldr r1, [r1, r0]').\n- The five targets are sub_80C0870+1, sub_80C0912+1, sub_80C0A4C+1,\n  sub_80C0B76+1,\
  \ sub_80C0C04+1: the per-action state handlers of a\n  battle object. The dispatched handler runs in guest register\
  \ state\n  (mov lr, pc; bx r1) and may advance r5 to a different object.\n- After the handler, object_updateSprite\
  \ is called for sprite refresh\n  and may further advance r5.\n- sub_80C0DB0 is then called for shared end-of-update\
  \ processing on\n  whatever object r5 ends up pointing at.\n- The object current at the end is the one returned\
  \ to the caller in r5.\n- Function saves only lr and returns by popping into pc.\n"
