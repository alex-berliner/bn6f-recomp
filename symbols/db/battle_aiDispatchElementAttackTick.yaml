name: battle_aiDispatchElementAttackTick
address: '0x080F094C'
kind: function
status: probable
summary: Dispatches the per-element AI attack tick handler for the element stored in the AI attack vars
interface: (r7 = oAIAttackVars context) -> r0 = HitElement value passed to callee; tail-calls table[element]
details: 'Loads the HitElement byte from the AI attack-vars struct at [r7,#oAIAttackVars_HitElement],
  indexes off_80F0960 with it, and does mov lr,pc; bx r1 to tail-call the selected handler (Thumb addresses
  with +1). The table has only two entries: sub_80F0968 (element 0, not yet identified, likely the neutral/default
  attack tick) and battle_aiWoodAttackTick (element 1, Wood). The element value remains in r0 for the
  callee.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0]; bx r1 — index-selects a handler by the
    HitElement field; off_80F0960 contains battle_aiWoodAttackTick+1, tying the dispatch to AI attack
    ticking; mov lr,pc; bx r1 is a tail-call, so this is a pure dispatcher with no post-processing
