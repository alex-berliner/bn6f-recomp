name: triggerScreenFadeOut
address: '0x08027134'
kind: function
status: probable
summary: Script/state step that starts a screen fade-out (mode 4, rate 0x20) if none is running, stores
  20 into a context field, then calls the next handler.
interface: (r5 = state/context struct, not passed in r0-r3) -> r0 = result of sub_80298D8; no meaningful
  flags
details: The routine checks IsScreenFadeActive; if no fade is active it calls SetScreenFade(4, 0x20),
  which per the engine API begins a fade (mode 4 with parameter 0x20, most likely a fade-to-black over
  0x20 frames). It then stores halfword 0x14 (20) at [r5+2], apparently a timer or next-step value in
  a per-entity or cutscene context struct pointed to by r5 (r5 is set up by the caller, since the function
  never writes r5). Finally it unconditionally tail-calls sub_80298D8, likely the continuation/next step
  of the same script state. With no known callers, the exact context (cutscene step table vs. object update)
  is unconfirmed, but the fade-triggering behavior is clear from the calls.
