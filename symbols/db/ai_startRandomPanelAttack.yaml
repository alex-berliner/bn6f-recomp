name: ai_startRandomPanelAttack
address: '0x080F4AB2'
kind: function
status: probable
summary: Begins an AI attack (id 9) whose target panel is chosen by the ai_pickRandomFreePanelExcludingNeighbors
  callback, with a duration taken from sub_80F49A2.
interface: (r7 = object AI attack vars) -> r0 = 9 passed to object_setAttack4; no return value
details: Writes the address of ai_pickRandomFreePanelExcludingNeighbors into oAIAttackVars_PanelChooseCallback
  at [r7, offset], so the later attack logic will use that callback to select the target panel. Calls
  sub_80F49A2, whose result is stored halfword-wise into oAIAttackVars_AttackDuration as the attack's
  timer/length. Finally calls object_setAttack4 with r0 = 9, switching the object into attack mode/state
  4 with attack id 9. This is a standard 'configure then launch attack' helper used by the battle AI.
