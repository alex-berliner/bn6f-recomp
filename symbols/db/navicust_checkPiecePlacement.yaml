name: navicust_checkPiecePlacement
address: '0x08137378'
kind: function
status: probable
summary: 'Navi Customizer screen: validates placing the held part at the cursor''s grid cell, showing
  the appropriate dialog on each failure type, and advances the state machine on success.'
interface: (r5 = screen state struct, r7 = cursor/held-part struct; r0 momentarily 0x3f8 to sub_8137670)
  -> r0 = status from last call; writes next-state byte [r5] (0x68 = stay, 0x6c = proceed) and halfword
  [r5+0xe] = 0 on success
details: 'Reads a flag at [r7+0xd] (bails if set), then uses sub_8137648(0,0xa) as a gate. Checks the
  cursor cell [r7+0x28]=x, [r7+0x2c]=y against the NaviCust grid via sub_813BB68 (base in oToolkit_Unk2004190_Ptr);
  occupied -> dialog 0x20, sub_813BFB8 failure -> 0x22, sub_813BF60 failure -> 0x1f, each ending in state
  0x68 and sub_8137670(0). Then examines the four neighboring cells (x±1, y±1): if a neighbor is occupied
  and its 8-byte entry''s first halfword (via toolkit_getUnk2004190EntryPtr_813B9FC) equals 0x34, dialog
  0x21 plays and placement is rejected — 0x34 marks a part type that cannot be adjacent. If all checks
  pass it calls sub_8137670(1), clears [r5+0xe], and sets state 0x6c. sub_8137670 with 0x3f8/0/1 looks
  like a sound/flag setter tied to the attempt result.'
