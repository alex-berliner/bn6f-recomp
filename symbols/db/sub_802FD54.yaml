name: sub_802FD54
address: '0x0802FD54'
kind: function
status: confirmed
summary: Refreshes the StartScreen object's state byte based on a precondition test and a mode flag.
interface: void sub_802FD54(u32 /*r5*/ self); // preserves r4-r7; clobbers r0,r1,lr,nz
details: 'Operates on the StartScreen struct at r5. Calls startScreen_TstZero(); if its Z flag comes back

  set (test failed) the function returns without writing anything. On success it picks a new state

  byte to store at (self, oStartScreen_State) = oStartScreen_State-relative offset #9: defaults to 2,

  but becomes 3 when the mode byte at (self, oStartScreen_Mode) = offset #2 is nonzero. Function

  follows the standard "push {r4-r7,lr} ... pop {r4-r7,pc}" prologue/epilogue and is named for its

  side effect of refreshing offset #9.

  '
