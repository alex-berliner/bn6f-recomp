name: ai_attackHitTarget
address: '0x0811393A'
kind: function
status: probable
summary: 'AI enemy attack resolution: if the attack check passes, plays the attack animation and damage
  sound and marks the target as hit (element 0x14); otherwise marks a miss (element 0x20).'
interface: (r5 = attacker battle object, r7 = AI attack vars) -> r0 = clobbered; writes HitElement/AttackElement
  in r7's attack vars and anim/state fields in the attacker object
details: First calls sub_8113B20 as a success/land check; on failure (beq) it only stores HitElement=0x20
  and AttackElement=0 into the AI attack vars and returns. On success it stores the check's r0/r1 results
  into object fields 0x6C/0x6D, sets oBattleObject_CurAnim to 4, calls sub_80C00C2 with the object's ExtraVars+8
  pointer and 0xA (likely starting a 10-frame timer/state), clears bytes 0x6E and 0x6F, calls sub_8113CC8,
  then loads oAIAttackVars_TargetObjectPtr and passes it to sub_8113C84 (probably applying the hit to
  the target), plays sound effect 0xBD, and sets HitElement=0x14 with AttackElement=0 (normal element).
  The 0x14 vs 0x20 HitElement values look like hit-type codes consumed later by damage/effect processing.
