open_questions:
- Exact semantics of sub_80030BA's 16.16 return aren't fully visible here; the (dx,dy) consumed looks
  like a per-frame velocity/delta from the related object.
- Whether the unreachable `bl object_freeMemory` is dead code or a relocated tail (compiler artifact)
  is unclear from this snippet alone.
