name: battle_spawnOwnerHelperPair_8010FD8
address: '0x08010FD8'
kind: function
status: confirmed
summary: Spawns the two companion battle objects (kind 0x14 slot 6 and kind 0x28 slot 7) attached to a
  battle object and stores their pointers in the owner's RelatedObject2Ptr and ExtraVars fields.
interface: battle_spawnOwnerHelperPair_8010FD8(u32 r1 spawn_arg, u32 r2 parent_tag, u32 r3 spawn_arg,
  u32 r5 owner) -> u32 r0 (second spawned object pointer, the value stored in owner->ExtraVars); r3/r5/r6/r7
  left as the last spawn leaves them; r4 preserved; flags clobbered
details: Wrapper around two calls to battle_spawnObject56LinkedToOwner_80C44A8. The caller passes a parent
  id in r2, which the function shifts left 16 and packs into bits 16-23 of the layout word built in r4.
  First spawn uses layout "0x14000000 + (tag << 16) + 6" (kind 0x14, slot 6) with r5 = owner; its r0 result
  is stored at owner+oBattleObject_RelatedObject2Ptr. The second spawn reuses whatever the first left
  in r1/r3/r5 and uses layout "0x28000000 + (tag << 16) + 7" (kind 0x28, slot 7); its r0 result is stored
  at owner+oBattleObject_ExtraVars and returned in r0. r2 is saved on the stack so it survives the first
  spawn's clobber, and r4 is pushed/popped so the caller's r4 passes through unchanged. The two spawned
  objects appear to be per-owner helper/state objects (RelatedObject2Ptr / ExtraVars slots of the battle
  object struct), so this is likely part of battle object initialization.
