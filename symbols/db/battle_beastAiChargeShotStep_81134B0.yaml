name: battle_beastAiChargeShotStep_81134B0
address: '0x081134B0'
kind: function
status: confirmed
summary: 'Per-frame AI step for the beast-type enemy''s charged shot: winds up 30 frames, walks its facing direction
  to a panel bordering all three enemy rows, then spawns the charge shot.'
interface: u32 sub_81134B0(r5=battle object, r7=oAIAttackVars, r10=pass-through, r1=pass-through); returns r1 (caller's
  r1 while still charging, spawn helper's r1 once the shot exists); r0/r2/r3/lr and NZCV clobbered, r4/r6 preserved
  via push/pop
details: 'Runs each frame during the enemy''s charge attack. On the first frame (oAIAttackVars_AttackElement ==
  0) it sets AttackElement=1, switches the battle object to animation 1 (wind-up) and loads a 30-frame StepTimer.
  While that timer is still positive it only decrements and returns. When it expires: oBattleObject_CurAnim=2 (charge
  pose), oAIAttackVars_ChargeCycles=9, oAIAttackVars_TargetPanelY=1. It then reads object_getFrontDirection(r5)
  for the facing step (+1/-1), starts at PanelX+dir, and repeatedly steps forward until battle_countAdjacentPanelsOfOtherAlliance_800D5F0(candidateX,
  oBattleObject_Alliance) returns 3, i.e. the candidate column borders all three rows of the opposing alliance;
  that X is stored to oAIAttackVars_TargetPanelX (no bounds check on the scan). It calls object_setCounterTime(0x1E)
  to arm the shot''s counter, spawns the charge shot via battle_spawnOwnedObject54(r0=0, r1=0, r2=1, r3=0, r4=0x12810,
  r5=owner=battle object) and records its handle in oBattleObject_ExtraVars+8, then sets oAIAttackVars_HitElement=4.
  r10 is carried through unchanged into object_setCounterTime.

  '
