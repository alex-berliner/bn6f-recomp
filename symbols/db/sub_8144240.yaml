summary: Tiny driver routine that runs two back-to-back update steps (sub_8144158 then sub_81440D8) for its subsystem,
  likely once per frame.
interface: void sub_8144240(void); // no meaningful inputs or outputs; caller-saved r0-r3 and flags are clobbered,
  r4-r7 preserved
details: 'A leaf-of-leaves wrapper: it only pushes lr, calls sub_8144158, then calls sub_81440D8 (which the contract
  records as a static no-arg, no-return routine), then pops the saved lr into r0 and bx''s back. Neither callee
  is passed arguments, and any values the first callee leaves in r2/r3 are simply still live when the second one
  runs and afterwards leak back to the caller, so no data flows through this function itself. Without knowing what
  the two callees do, this looks like a standard "run phase A, then phase B" tick entry point for whatever subsystem
  lives around 0x08144xxx (e.g. an update hook invoked from a scheduler or main loop).'
