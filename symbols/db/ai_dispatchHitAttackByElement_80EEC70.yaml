name: ai_dispatchHitAttackByElement_80EEC70
address: '0x080EEC70'
kind: function
status: confirmed
summary: Dispatches the AI's pending attack routine based on the hit element recorded in the AI attack-vars struct,
  via a small jump table.
interface: void sub_80EEC70(void) — reads r2, r5, r6, r7 (AIAttackVars ptr), r10; returns whatever the selected
  handler leaves in r1, r5, r8-r12; clobbers r0-r4, r6, r7, lr and NZCV
details: "Thin trampoline for the AI attack state machine. Loads the byte at\nr7+oAIAttackVars_HitElement (the element\
  \ of the hit that triggered this\nattack), then indexes the word table at off_80EEC84 with that raw byte —\n`ldr\
  \ r1, [r1, r0]` with no shift, so the element value is used directly\nas a byte offset (valid entries land at\
  \ offsets 0/4/8). The selected\nhandler is invoked with `mov lr, pc; bx r1`, which hands it r0 = hit\nelement\
  \ and r1 = its own table entry (the loaded code address), plus\nr2, r5, r6, r7 and r10 untouched from the caller;\
  \ lr is set so the\nhandler returns to the instruction after the bx (the pop {pc}).\n\nTable entries:\n  0 ->\
  \ sub_80EEC90 (default/unset case)\n  1 -> ai_frontPanelSlashAttack\n  2 -> ai_attackWaitThenCleanup\n\nEverything\
  \ the handler leaves in r1, r5, r8-r12 propagates to this\nfunction's caller, since the trampoline only pushes/pops\
  \ lr. The tail\n`.byte 0,0` pads to keep the following data word-aligned.\n"
