open_questions:
- Exact meaning of the 0x9F chip-id and which chip family it represents (boss move?) -- needs a chip-id
  table lookup.
- Why the 0x12C threshold for BattleState.Unk_40 gates chip use; what that counter actually counts (turn
  counter, turn-into-battle frames?) isn't deducible here.
- The version tables at byte_8109F40 / byte_8109F28 contents (per AIData.Version_16) and what damage values
  they encode.
