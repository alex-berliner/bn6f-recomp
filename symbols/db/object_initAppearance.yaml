name: object_initAppearance
address: '0x080DB6D4'
kind: function
status: probable
summary: State-handler step that (re)places a battle object on its panel, loads its sprite/shadow/animation,
  and hands control to the update state.
interface: (r5 = battle object) -> r0 = next state (CUR_STATE_UPDATE stored to oBattleObject_CurStateActionPhaseAndPhaseInitialized);
  no meaningful return
details: The routine recomputes the object's pixel position from its panel coordinates, zeroes the Z height,
  then nudges X by 18 pixels times the object's facing direction (object_getFrontDirection), i.e. it stands
  the object slightly behind/in front of its panel center depending on which side it is on. It loads sprite
  resources via sprite_load(0x80, 8, 10), enables the shadow, sets oObjectHeader_Flags bit 1 (0x2), selects
  animation 0x19 (also copied to CurAnimCopy) through sprite_setAnimation, loads the animation data, sets
  palette 0, and mirrors the object's horizontal flip onto the sprite via object_getFlip/sprite_setFlip.
  Finally it writes CUR_STATE_UPDATE into the state/phase field, so this is one step of an object's state
  machine (an init/appear handler) rather than a standalone utility. With no known caller it is presumably
  referenced from an object's state-handler table.
