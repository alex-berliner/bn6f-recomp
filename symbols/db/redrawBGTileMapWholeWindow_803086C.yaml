  at the given camera tile.'
interface: 'static void redraw_from_tilemap(u32 tiles, u32 window_x, u32 window_y); adapter: in r0/r1 = camera tile,
  r5 = eMapTilesState200be70; out r8/r9 = the window origin, r4-r7 restored, Z set (cmp 32, 32); r0-r3 and lr keep
  the last row call''s leftovers'
details: Reads the decompressed tilemap (+0xc) and its two layer tables (+4/+8), copying layer 1 then layer 2; moves
  the window origin into r8/r9 exactly as the original does, where set_row_callee_context keeps it.
