name: battle_clearGroundmanMinigameEntries3and4
address: '0x0809322A'
kind: function
status: probable
summary: Clears battle array entries 3 and 4 (their flag bytes and sprite-scalable bits) used by the groundman
  minigame.
interface: () -> ; no args or return, operates on fixed entries 3 and 4
details: 'Calls battle_clearEntryFlagAndMakeUnscalable_80468EC twice with the hardcoded entry indices
  3 then 4. Each callee call clears the entry''s flag byte in the 0x58-byte battle array at byte_2011860
  and clears the sprite-scalable bit. Because both indices are constants and there is no parameter, the
  function is dedicated to wiping the two specific groundman-minigame battle entries (likely the shovel
  and the target/hole). It is called when the minigame ends: sub_8092F76 fires when the player finishes
  digging (bit flags 1/2 set), and sub_8092FD2 fires when the countdown timer expires.'
