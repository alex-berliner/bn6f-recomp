name: ai_attackStepTimerClearHitElement
address: '0x081074C4'
kind: function
status: probable
summary: 'AI attack-step handler: counts down a per-attack timer and, when it expires, clears the battle
  object''s current animation and sets the AI hit element to 0xC.'
interface: (r5 = battle object, r7 = AI attack vars, r0 = scratch) -> void; sets flags via the bgt on
  the decremented counter
details: Each call decrements oAIAttackVars_StepTimer at [r7] and returns early while it is still positive.
  Once the counter reaches zero, it stores 0 into oBattleObject_CurAnim at [r5] (back to default/idle
  animation) and stores 0xC into oAIAttackVars_HitElement at [r7], presumably resetting the pending hit
  element to a 'none/neutral' value after an attack resolves. No calls are made and no other state is
  touched; it is a leaf routine typical of the per-frame attack-script steps.
