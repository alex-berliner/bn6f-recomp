name: rfu_stopOrFadeScene
address: '0x08130F1C'
kind: function
status: probable
summary: 'Scene-exit dispatcher: if eStruct200BC30[0xE]==2, sets scene state 0xC and tears down RFU; otherwise,
  when permitted by r5[0x1B] bit 1 or chatbox flags 0x80|0x8, clears/restores the eStruct200BC30 work
  record and starts a screen fade (SetScreenFade 8,0x10).'
interface: (r5 = scene state struct, eStruct200BC30 as shared work area) -> void; no meaningful return
  value
details: 'Reads byte 0xE of the eStruct200BC30 record: if it equals 2 it stores 0xC into r5[0xC] (the
  scene''s state/next-step byte) and shuts the wireless adapter down with rfu_REQ_stopMode + rfu_waitREQComplete,
  then returns. Otherwise, unless r5[0x1B] has bit 1 set, it requires chatbox event flags 0x80 and 0x8
  to both be set before proceeding, and simply returns otherwise. When it proceeds it saves the ''jump
  offset 00'' byte of eStruct200BC30, zero-fills the whole 0x20-byte struct, restores the saved offset,
  and sets r5[0xC] = 8, then calls SetScreenFade(8, 0x10) to start a screen fade. r5 is not set up inside
  the function, so it is supplied by the (unknown) caller''s context. The flag-0x80 && flag-0x8 gate suggests
  exiting is only allowed once some event/transfer has completed.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc path 1: ldrb r0,[r0,#0xE]; cmp r0,#2; strb 0xC -> [r5,#0xC]; bl rfu_REQ_stopMode; bl rfu_waitREQComplete;
    gate: ldrb r1,[r5,#0x1B]; tst bit2, then chatbox_mask_eFlags2009F38(0x80) and (8) both must be nonzero;
    reset: bl eStruct200BC30_getJumpOffset00; bl clearStruct200BC30_803EBAC; bl eStruct200BC30_setJumpOffset00
    (offset preserved across clear); exit state: mov r0,#8; strb r0,[r5,#0xC]; mov r0,#8; mov r1,#0x10;
    bl SetScreenFade'
  refs:
  - bn6f/asm/asm36.s:1921
  - 0x08045F3C chatbox_mask_eFlags2009F38
  - 0x0803EBAC clearStruct200BC30_803EBAC
  - 0x0803EA60 eStruct200BC30_getJumpOffset00
  reproduce: python3 tools/asmcat.py 0x08130F1C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The core control flow matches: byte at offset 0xE == 2 → set r5[0xC]=0xC and stop RFU, else gate
    on r5[0x1B] bit 1 then chatbox flags 0x80 and 0x8, then clear/restore the struct and fade with SetScreenFade(8,
    0x10). However the proposal misses that after clearing the struct the code calls two more helpers
    (sub_803EA50 / sub_803EA58) to save/restore an additional field, not just the jump offset. Also r5
    is not in the saved register list — it must be loaded before push (likely via ldr r5, [sp,...] before
    push), so r5 is not supplied by an ''unknown caller'' but set up here. The summary is otherwise accurate.;
    run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
