open_questions:
- What AIData+0x15/0x17 conditions actually represent (Unk_15 is 0/non-zero; Version_17 0xff).
- Why exactly 0x14 is written to AIData+0x38 and what consumer reads it. The semantic mapping
- from "presses queued" to what gets executed by an attack selector — a wider trace of the
- caller at 0x0801cadc would settle this.
