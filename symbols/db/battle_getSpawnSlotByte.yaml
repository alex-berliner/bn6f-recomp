name: battle_getSpawnSlotByte
address: '0x0802D652'
kind: function
status: probable
summary: Returns a per-index byte from a small EWRAM table at 0x2000070, used when the battle checks a
  version-specific boss spawn.
interface: (r0 = index into table) -> r0 = byte_2000070[index]; flags from LDRB (N/Z from value, C unchanged)
details: 'Trivial indexed getter: loads the table base (byte_2000070, EWRAM at 0x2000070) into r1, reads
  an unsigned byte at [r1,r0], and returns it in r0. The table is small (the thunk pool sits just below
  at 0x802D694, implying only a few entries before nearby data), so it looks like a per-slot flag/count
  for the battle''s enemy spawn slots. The sole known caller, battle_checkVersionBossSpawn, scans the
  spawn list for a version-specific boss and consults this byte for that slot, so the byte plausibly records
  whether that slot has spawned/is occupied. No writes happen here; callers must maintain the table elsewhere.'
