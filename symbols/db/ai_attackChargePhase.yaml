name: ai_attackChargePhase
address: '0x080F94A2'
kind: function
status: probable
summary: 'AI attack charge-phase handler: on first call sets AttackElement=4, CurAnim=0x15, loads duration
  from AttackBoost2 into StepTimer; each tick increments ChargeCycles and when bit 3 carries calls sub_80F99FC;
  when StepTimer reaches 0 writes 0xC to HitElement.'
interface: (r7 = object's oAIAttackVars, r5 = battle object) -> r0 clobbered; writes AttackElement, CurAnim,
  StepTimer, ChargeCycles, HitElement
details: 'First invocation (AttackElement == 0) performs setup: AttackElement = 4, sets the object''s
  CurAnim to 0x15, loads the attack duration from oAIAttackVars_AttackBoost2 into StepTimer, and clears
  ChargeCycles. Each later call increments ChargeCycles and, when bit 3 carries (every 8 frames), calls
  sub_80F99FC, presumably a charge effect or sound. Meanwhile StepTimer counts down each frame; when it
  hits 0 the handler stores 0xC into oAIAttackVars_HitElement, which the surrounding AI state machine
  presumably reads to transition to the attack-hit step. Uses r7 (attack-vars base) and r5 (battle object)
  from caller-set registers; no arguments in r0. The meaning of element constant 4 and hit element 0xC
  depends on the element enum used by oAIAttackVars.'
