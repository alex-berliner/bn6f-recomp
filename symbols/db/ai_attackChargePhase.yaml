  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] / bne: nonzero means attack already started, so zero
    branch is the init path; init stores element 4, anim 0x15 to oBattleObject_CurAnim, AttackBoost2 to
    StepTimer, 0 to ChargeCycles; lsr r0,r0,#3 / bcs ... bl sub_80F99FC: effect callback fires every 8
    charge frames; StepTimer decrement with bgt loop and final strh #0xc to oAIAttackVars_HitElement marks
    the attack firing; runs in recorded battlesweep route, matching a battle AI attack-state handler'
