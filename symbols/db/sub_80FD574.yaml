name: sub_80FD574
address: '0x080FD574'
kind: function
status: confirmed
summary: Ticks an AI attack object's per-frame timer; when it expires, either resets to a follow-up state (state
  4) or exits the attack.
interface: 'void sub_80FD574(void);  /* in: r5=battle object, r7=oAIAttackVars, lr=return; out: r1=; clobbers r0,r2,r3,r6,r7,lr,NZCV
  */'
details: 'Reads oAIAttackVars_Unk_01 to pick a branch. Branch 0 (winding down): decrements oAIAttackVars_Unk_10
  each call; on expiry clears ST8(oBattleObject_CurAnim)=0, calls object_clearFlag(0x40) and object_setFlag1(OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT),
  reloads the timer from oAIAttackVars_Unk_18 into oAIAttackVars_Unk_10, and writes 4 to oAIAttackVars_Unk_01 (next
  state). Branch 1 (state 4 already): decrements oAIAttackVars_Unk_10; on expiry calls object_exitAttackState to
  hand control back to the normal AI state machine. BGT skip uses the N flag produced by the sub #1 (since the value
  is treated as signed against 0).

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
