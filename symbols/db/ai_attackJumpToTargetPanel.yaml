name: ai_attackJumpToTargetPanel
address: '0x08105CEC'
kind: function
status: probable
summary: 'AI attack step: on first run picks a panel relative to the target via the attack''s panel-choose
  callback, reserves it and plays an approach anim, then after a short timer delivers the hit.'
interface: () -> void; operates on the current battle object (r5) and its AIAttackVars (r7); sets oAIAttackVars_AttackElement,
  StepTimer, HitElement, oBattleObject_FuturePanelX/Y, CurAnim and ObjectFlags1
details: Two-phase attack state machine keyed on oAIAttackVars_AttackElement (0 = not started). First
  invocation stores element=4, and if object_canMove fails (blocked), plays anim 0x14 and tears the attack
  down via object_exitAttackState_801171C. Otherwise it indexes byte_8105D4C by Alliance*8 to get dx/dy
  offsets (0 or 0x20 depending on alliance), long-bl's the oAIAttackVars_PanelChooseCallback with TargetObjectPtr
  and the offsets; the callback returns the chosen panel in r0/r1, which are stored into FuturePanelX/Y.
  It then claims the panel with object_reservePanel, sets ObjectFlags1 bit 0x20 (cannot be slid off the
  reserved panel), plays anim 0x15 and sets StepTimer=4. On later calls it just decrements StepTimer,
  and on expiry writes HitElement=8, presumably triggering the damage/check-hit phase of this attack.
