    and reserved for this object; mov lr,pc; bx r1 with r1=[r7,#oAIAttackVars_PanelChooseCallback] and
    r2/r3 from byte_8105D4C[Alliance*8] — per-alliance dx/dy passed to the panel chooser; mov r0,#0x15;
    strb r0,[r5,#oBattleObject_CurAnim] and StepTimer=4 on success, anim 0x14 + exitAttackState on failure;
    tail: sub StepTimer; bgt done; mov r0,#8; strh r0,[r7,#oAIAttackVars_HitElement] — timed transition
    to the hit phase'
