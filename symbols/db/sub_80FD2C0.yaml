summary: Returns the base pointer of the calling object's handler table, with a +0x3C variant when the object flag
  mask 0xA000 is set.
interface: '// r5 = current object; returns r0 = pointer into the object''s handler table

  void* sub_80FD2C0(void);

  '
details: 'Loads a constant selector (dword_80FD2E0 = 0x323C4650) and calls sub_800FE28 to resolve

  a base pointer into the caller object''s handler/state table for that selector. Then

  calls object_getFlag() and tests the bitmask 0xA000; when any of those bits are set,

  0x3C is added to the base, yielding an alternate table entry. Preserves r4 only.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
