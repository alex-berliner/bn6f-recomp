name: battle_spawnLinkedPanelObject
address: '0x080E3976'
kind: function
status: probable
summary: Spawns and initializes a battle object of type 0x2D at a given panel, linking it to a parent
  object, copying the parent's alliance, and marking it with flag 0x10.
interface: (r0 = panel X, r1 = panel Y; r5 = parent battle object, r7 = ptr to slot receiving the new
  object) -> r0 = spawned object (NULL on failure); flags from spawn result (beq skips stores)
details: Calls object_spawnType4 with type 0x2D, then fills the new object's oBattleObject_PanelX/PanelY
  from the two arguments. It stores r5 (the caller's battle object) into oBattleObject_RelatedObject1Ptr
  and r7 into oBattleObject_ExtraVars, then writes the new object pointer back through r7 (*r7 = new object),
  giving both a parent link and an out-param link. It copies oBattleObject_AllianceAndDirectionFlip from
  the parent so the new object shares the parent's side/direction. Finally it sets bit 0x10 in oObjectHeader_Flags
  of the new object, likely marking it as a spawned/linked entity. If the spawn fails (r0 == 0), everything
  is skipped.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0, #0x2d + bl object_spawnType4: spawns battle object type 0x2D; strb r1/r2 [r0,#oBattleObject_PanelX/Y]:
    arguments are panel coordinates; str r5,[r0,#oBattleObject_RelatedObject1Ptr] + ldrh/strh of AllianceAndDirectionFlip
    from r5: inherits parent''s team and links back; ldrb flags; orr #0x10; strb: sets flag 0x10 on the
    new object''s header; beq locret right after the spawn call: NULL return aborts all initialization'
