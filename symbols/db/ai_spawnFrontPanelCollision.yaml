name: ai_spawnFrontPanelCollision
address: '0x080F207C'
kind: function
status: probable
summary: Spawns a battle collision region on the panel directly in front of an AI-controlled object, using
  its attack parameters.
interface: (r0 = ?) -> r0 = object_spawnCollisionRegion result; uses r5 = battle object, r7 = oAIAttackVars
  struct
details: Calls object_getFrontDirection to get the +1/-1 facing multiplier and adds it to oBattleObject_PanelX
  of the object in r5, yielding the adjacent panel in front. It then loads oBattleObject_PanelY from r5
  and oAIAttackVars_InitFlag and oAIAttackVars_Damage from the attack-vars struct in r7, and calls object_spawnCollisionRegion
  with panel X/Y, that init flag, 0 in r3, the constant 0x6050A01 in r4, the damage in r6, and the constant
  3 in r7. The literal 0x6050A01 likely packs region size/type parameters, and 3 is likely a duration
  or element/type code passed through to the collision region. Register-parameter layout of object_spawnCollisionRegion
  is not documented, so the exact meaning of r2-r7 fields is inferred from the oAIAttackVars field names.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_getFrontDirection then add r0, r0, r1 with oBattleObject_PanelX => target panel is
    one panel in front; ldrb r2, [r7,#oAIAttackVars_InitFlag] and ldr r6, [r7,#oAIAttackVars_Damage] feed
    attack-struct fields into the spawn call; bl object_spawnCollisionRegion with panel X/Y in r0/r1 confirms
    it creates a panel hitbox; dword_80F2098 = 0x6050A01 and dword_80F209C = 3 are fixed constants passed
    to the spawn call; r7 fields use the oAIAttackVars prefix, tying the function to the AI attack subsystem
  refs:
