name: sub_80178B6
address: '0x080178B6'
kind: function
status: confirmed
summary: Tail-call dispatch on a battle object's oBattleObject_Unk_0d selector to one of three handlers (sub_80178D4
  / sub_8017992 / sub_8017A38).
interface: "void dispatchBattleObjectHandler_80178B6(\n    /* r5 */ battleObject* obj,\n    /* r10 */ unused,\n\
  \    /* lr */ return_addr\n);\n"
details: 'Reads a single byte (oBattleObject_Unk_0d) from the battle object (r5) and

  uses it as an index (0, 4, or 8) into a 3-entry jump table at off_80178C8.

  Loads the table entry into r1 and tail-calls it via `mov lr, pc; bx r1`

  after pushing lr, so control returns directly to this function''s caller.

  Indices other than 0/4/8 are unused in-game and would jump into garbage;

  only the three listed handlers exist. The object is a battle object

  ("battleObject") with an "oBattleObject_Unk_0d" byte field holding a

  tiny discriminator (effectively an enum {0,1,2}). The handler is passed

  r0 = selector index and r1 = loaded table entry; whatever the callee

  returns to r1/r5/r8-r12 becomes this function''s output registers.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
