name: drawChipListFiveRows_8047594
address: '0x08047594'
kind: function
status: confirmed
summary: draws five rows of a chip list (name, code letter, value strip) from an array of 8-byte entries
interface: 'static u32 draw_chip_list_rows(u32 first, u32 entries, u32 menu, u32 toolkit) returns the entry pointer
  one past the last row; adapter: in r0 = index of the first entry to show, r1 = entry array, r5 = screen state,
  r10 = toolkit, r6 saved; out r0 = 5, r5 = screen state, r6 restored, r7 = one past the last entry, r2/r4 keep
  the last render''s leftovers'
details: 'Loops screen slots 0..4 over entries[first + i]. The entry''s kind byte (+0) picks the path: 1 plain (name
  from the fixed script text_873D9FC, blank tile in the code column), 2 coded (name from the banked name tables
  TextScriptChipNames0/1, then the code letter), 3 secret (name row by sub_8047708, which is outside this file and
  stays lifted), any other kind 16 blank tiles and no strip. Kinds 2 and 3 are first dimmed by dim_unowned_chip_strip
  when the player owns none of the chip; kinds 1-3 then get their strip through draw_chip_row_strip, which also
  publishes the entry''s value halfword (+6) via sub_8047CDC. The screen state (r5) supplies the view word at +0x1C
  (double deref: 1 = dim strips, 2 = library view) and the symbol script at +0x24. As the original, the adapter
  leaves r0 = 5 (its row counter run out) and r7 one entry past the last row drawn.

  '
