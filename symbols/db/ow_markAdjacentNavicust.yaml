name: ow_markAdjacentNavicust
address: '0x08142BFA'
kind: function
status: probable
summary: Marks active overworld Navicust entries adjacent to the player.
interface: (r0 = unused, r1 = unused) -> r0 = unused; flags = caller-saved/condition flags clobbered
details: Scans 20 eight-byte Navicust-state records starting at byte_2006670. For each entry whose word
  at offset +4 is nonzero, it compares the overworld player's current tile with that stored position and
  writes 0x0C to byte +6 when they are equal or orthogonally adjacent. The function returns no meaningful
  value; battle_processChipLockout calls it when chip lockout expires.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The loop iterates 20 records of 8 bytes each from byte_2006670.; ldrh r0, [r5,#4] skips inactive
    or unset-position entries.; ow_getPlayerTileMapIndex_8142990 supplies the player's current map tile,
    and get_isAdjacentPos compares it with [entry+4].; strb r7, [r5,#6] stores 0x0C only for adjacent
    entries.; battle_processChipLockout invokes it before setting its own result byte to 0x40.
  refs:
  - bn6f/asm/asm37_1.s:2206
  - 0x080898E8 battle_processChipLockout
  - 0x0814299C get_isAdjacentPos
  - 0x08142990 ow_getPlayerTileMapIndex_8142990
  reproduce: python3 tools/asmcat.py 0x08142BFA
