name: ai_clearAttackVars
address: '0x08011ADA'
kind: function
status: confirmed
summary: Zeroes the AI opponent's per-battle attack state variables and returns the AI module's "done" status (0x33).
interface: u32 ai_resetAttackVars(AIAttackVars* vars /* r7 */); sets NZ flags from the returned value
details: 'Takes r7 pointing at an AI attack-vars block and clears all of its fields with zero stores: InitFlag,
  AiDifficultyTier, ChargeReadyFlag and ChipUseDelay as bytes, AttackBoost, ExtraDamage and Damage as halfwords,
  and AttackBoost2 (a 4-byte field) as a word. It then returns 0x33, which callers treat as the AI script module''s
  success/done status (the final MOV #0x33 into r0 also sets the N/Z flags for the caller). Called during AI initialization/reset
  so an enemy starts a battle (or new AI state) with no pending attack, charge, damage bonuses or chip-use delay.

  '
