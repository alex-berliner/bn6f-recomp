name: object_destroyPhase_80D4A98
address: '0x080D4A98'
kind: function
status: confirmed
summary: 'Per-tick handler for a battle object in its destroy/hit state: strips collision, spawns spark FX, advances
  projectile motion, and presents the hitbox.'
interface: void object_destroyPhaseTick(u32 r4, u32 r5, u32 r7, u32 r8, u32 r10)
details: 'Called once per game-frame while a battle object (r5) is in a destroying or post-hit state. Sequence:
  (1) removeCollisionData unregisters the object from the collision table; (2) spawnCollisionEffect draws the impact-spark
  FX at the object''s position; (3) if oCollisionData_FlagsFromCollision is non-zero, the current oBattleObject_PanelXY
  is stashed into oBattleObject_ExtraVars and clearCollisionRegion frees the grid tile; (4) a jump table keyed on
  oBattleObject_CurAction dispatches either projectileAdvanceXTick (action 0, the common path that steps the projectile
  one panel) or an effect-spawn-and-clear path (action 1, constructs a 0x14-byte EffectObject at offset 0x34 from
  the battle object and clears the region); (5) after the tick, if oCollisionData_Region is still 0 and PanelXY
  differs from the stashed value, setCollisionRegion(1) reclaims the tile; (6) updateSprite advances the sprite-sheet
  frame; (7) presentCollisionData renders the hitbox for the frame. r5 may be updated by callee side-effects but
  r4 and r7 are preserved across the function. The single-entry jump table at off_80D4AFC is padded to one 32-bit
  word, suggesting additional action indices were planned but unused.'
