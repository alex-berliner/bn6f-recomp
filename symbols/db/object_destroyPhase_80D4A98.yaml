status: probable
summary: 'Destroy-phase handler for a battle object: tears down collision, spawns a death/hit effect,
  optionally restores the panel it left, dispatches via CurAction table, then ticks sprite/collision.'
interface: '(r5 = objectPtr) -> void ; side effects: collision data for r5 reset, effect sprite spawned
  at r5+0x34..0x40, jumps via CurAction jumptable at 0x80D4AFC'
details: "Opens with push {r4,r7,lr} and immediately calls object_removeCollisionData (bl at 0x080d4a9c)\
  \ then object_spawnCollisionEffect (bl at 0x080d4aa0); r5 is the live BattleObject per the convention\
  \ used by every callee.\n  Reloads r7 = [r5+0x54] (CollisionDataPtr) and tests [r7+0x70] (FlagsFromCollision).\
  \ If any bit is set it stashes the current PanelXY ([r5+0x12]) into ExtraVars ([r5+0x60]) before calling\
  \ object_clearCollisionRegion — so the panel the object died on gets remembered for a possible restore.\n\
  \  Reaches the CurAction dispatch at 0x080d4ab2: r1 = *(0x80D4AF8)[r5+0x9] (CurAction), then mov lr,pc\
  \ / bx r1 jumps to the action-specific code (the single entry in 0x80D4AFC currently points at sub_80D4B00+1,\
  \ so the only implemented action is the immediate-destroy path).\n  After the action returns, the post-action\
  \ block refreshes the per-frame collision: it rechecks CollisionDataPtr->Region (0x54->0x1). If region==0\
  \ AND current PanelXY != remembered ExtraVars, it calls object_setCollisionRegion with r0=1 — i.e. it\
  \ puts a \"body\"/grave one panel over.\n  Then the standard end-of-frame pair runs: object_updateSprite\
  \ (bl at 0x080d4ad4) and object_presentCollisionData (bl at 0x080d4ad6).\n  The chunk after the second\
  \ pop {pc} is the real body of sub_80D4B00 (the CurAction 0 case): it loads 12 bytes from r5+0x34 (Coords.x/y/z),\
  \ bumps z by 0x100000 (mov r4,#0x10 ; lsl r4,r4,#0x10 ; add r3,r3,r4 — adds 0x100000 to the 16.16 Z\
  \ at r5+0x3c), then calls spawn_t1_0x0_EffectObject with r4=0x14 to drop a death-effect sprite, calls\
  \ object_clearCollisionRegion (clearing the remembered restore panel), writes 8 to [r5+0x8] (CurState=8\
  \ = CUR_STATE_DESTROY completion), and pops {r4,r7,pc}.\n  In short: it is the destroy-phase update\
  \ for a battle object that has already entered CurState=0x8, and the action-table slot 0 implements\
  \ \"spawn a death puff sprite, clear collision region, finish destroy\".\n"
