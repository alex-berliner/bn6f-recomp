open_questions:
- The names of the action-table slots beyond entry 0 are unknown; only entry 0 (immediate destroy) is
  currently implemented per the dispatch at 0x80D4AFC.
- Whether the PanelXY/ExtraVars snapshot then re-set-Region path is really a "drop a grave marker" or
  a generic "object leaves a panel claim when destroyed" is not provable from assembly alone — settle
  by finding a caller that triggers it and reading AI/object lifetimes.
