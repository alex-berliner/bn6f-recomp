  date: '2026-10-14'
  detail: '- The function is reached from sub_80D4A48 right after CurState==0x8 destroy entry, and runs
    the standard object_* helper triplet (removeCollisionData / updateSprite / presentCollisionData) used
    by every state phase. - CurAction dispatch via mov lr,pc / bx r1 with table off_80D4AFC and the only
    entry being sub_80D4B00+1 matches the project''s CurAction-table pattern. - The sub-function path
    (after the stray pop): `add r0,r0,r5` producing r5+0x34, `ldmia r0!,{r1-r3}` loads X/Y/Z (Coords at
    oBattleObject_Coords), then `add r3,r3,r4` with r4=0x100000 bumps Z, and `bl spawn_t1_0x0_EffectObject`
    spawns a t1 effect — consistent with a death/explosion effect at the object''s position with raised
    Z. - `str r0,[r5,#8]` with r0=8 at the end of the sub-path writes CurState=8 (CUR_STATE_DESTROY) confirming
    the function is the terminal step of the destroy phase. - `bl object_clearCollisionRegion` and `str
    r0,[r5,#8]` clearing the prior collision/data close-out, exactly mirroring a destroy completion.'
