name: battleObject_beastSpInit_8117EE8
address: '0x08117EE8'
kind: function
status: confirmed
summary: Initialises a beast-slot battle-cursor sprite (type 0x23), loads its GUI animation, sets priority/shadow,
  writes per-slot table fields, positions it from a hardcoded X/Y table, then chains to the dispatch action routine.
interface: void battle_beastSpCursorInit_8117EE8(void *r5 /* sprite record */); /* clobbers all; outputs r2,r3,r5,r10,r11
  via beastSpDispatchAction tail-call */
details: 'Operates on a sprite record whose base pointer is in r5. Sequence:

  • Writes 0x23 to byte 0 (slot-type tag for beast-special cursor).

  • Calls initGuiSprite with id 0x11 and palette-table pointer unk_201DD70 to load the sprite''s visual.

  • Sets animation index 0, loads animation data, clears shadow flag, sets render priority to 3.

  • Reads slot number from byte +4 (0–6). Indexes a 7-entry u32 row-pointer table (0x180,0x140,0x100,0xC0,0x80,0x40,0x0
  – descending by 0x40) and calls slotList_storeHalfwordAndClearField to write a halfword tag and zero a companion
  field.

  • Sets sub-record field A to 3 via sprite_setSubRecordFieldA.

  • Writes fixed bytes: +8=4 (state/mode), +9=0, +0xA=0.

  • Reads an s16 X-offset from byte_8117F68 indexed by slot_num*2 (values ≈ -10, 8, 26, 44, 62, 80, 98, 0), stores
  it at +0x14, and calls sprite_setCoordinates with Y=0xB8 (184) and that X.

  • Tail-calls battleObject_beastSpDispatchAction_8117F78(r5), which populates r2, r3, r10, r11 for the caller.

  '
