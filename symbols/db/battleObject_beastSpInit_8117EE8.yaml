open_questions:
- What does sub-record field A = 3 select in the sprite's rendering pipeline?
- The Y coordinate 0xB8 is fixed for all slots; is vertical spacing handled entirely by the row-pointer table or
  by the dispatch routine?
- byte_8117F68 has a trailing 0x0000 entry (index 7); is slot number ever ≥ 7 in practice?
- Does slotList_storeHalfwordAndClearField encode the row-pointer value (0x180..0x0) as a halfword tag, or is it
  a separate constant?
