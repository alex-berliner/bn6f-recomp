status: probable
summary: 'Initialise a BeastSP battle object: set type, load GUI sprite/animation, set priority 3, pick
  a slot/halfword, write the initial coords, then dispatch the action.'
interface: (r5 = BattleObject*) -> void ; sets r5+0x0..r5+0x14 from in-RAM table byte_8117F68 and off_8117F44,
  side effects on r0..r4,r6..r9 via callees
details: '1. Writes 0x23 into the object header byte at r5+0 (object_header_struct.Flags, the high bits
  index into the header type - 0x23 is the BeastSP object type).

  2. Calls initGuiSprite_8002770 with the GUI sprite resource pointer unk_201DD70 and r0=0x11, attaching
  the BeastSP GUI sprite to the object.

  3. sprite_setAnimation(0), sprite_loadAnimationData(), sprite_noShadow() to install anim 0 with no shadow.

  4. sprite_setPriority_8002E14(3) to set OAM priority to 3.

  5. Reads r5+4 (the object''s ListIndex/Index byte) as a 2-bit selector into off_8117F44, getting a halfword
  {0x180,0x140,0x100,0xC0,0x80,0x40,0x0} and calling slotList_storeHalfwordAndClearField_800306C to write
  it into the corresponding slot - this is the beast-SP charge/time budget that the action state will
  consume.

  6. sprite_setSubRecordFieldA_8003060(3) to set the sprite sub-record field +0xA = 3.

  7. Sets r5+0x8 (CurState) = 4, r5+0x9 (CurAction) = 0, r5+0xA (CurPhase) = 0, so CurStateActionPhaseAndPhaseInitialized
  is 0x00000004.

  8. Reads r5+4 again as a 1-bit index into byte_8117F68 (16-bit halfwords {0xFFF6, 0x0008, 0x001A, 0x002C,
  0x003E, 0x0050, 0x0062, 0x0000}) and stores it to r5+0x14 (FuturePanelX/FuturePanelY) - this places
  each BeastSP variant on a fixed panel column on the enemy side.

  9. sprite_setCoordinates(0xB8, panelY) places the sprite at x=0xB8 with the panel-derived y.

  10. Finally bl battleObject_beastSpDispatchAction_8117F78 to enter the per-frame action dispatcher;
  the function returns into the caller''s lr.

  '
