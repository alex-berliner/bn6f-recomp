    unk_201DD70 (the BeastSP SP-gauge overlay). - The halfword table off_8117F44 holds 0x180 down to 0x0
    in 0x40 steps and is indexed by r5+4 (the object''s panel column byte) - matches the per-column SP
    gauge size pattern. - byte_8117F68 halfwords 0xFFF6, 0x0008, 0x001A, 0x002C, 0x003E, 0x0050, 0x0062
    are written into r5+0x14 which is the packed FuturePanelXY field per the BattleObject struct, so the
    variant''s enemy-side starting column is fixed. - mov r0,#4; strb r0,[r5,#8] and the following strb
    0/0 to r5+9/r5+0xA match CurState=4 (UPDATE), CurAction=0, CurPhase=0. - Final bl battleObject_beastSpDispatchAction_8117F78
    and pop {pc} make this a one-shot init that hands control to the dispatcher; the function''s captured-call
    contract (in r5/r10/lr, out r2/r3/r5) matches the dispatcher''s contract exactly. - sprite_setCoordinates(0xB8,
    panelY) places BeastSP at x=0xB8 which is the fixed left/right slot for the SP gauge in the HUD.'
