name: unk_808F5C4
address: '0x0808F5C4'
kind: data
previous_names: []
status: probable
summary: 'Warp data entry (WarpData, 0x10 bytes) for the Mr. Weather comp cleanup cutscene''s jack-out warp: map
  0x00:0x00, warp type 0, facing 4, X/Y/Z 0; with transition type 1 the destination comes from GameState''s saved
  real-world place instead.'
details: 'dat24.s:3066-3067: `.word 0x04000000, 0, 0, 0`. Read as include/rom_structs/WarpData.inc: +0 MapGroup
  0x00,

  +1 MapNumber 0x00, +2 warpType_02 0x00, +3 FacingDirection 0x04, +4/+8/+0xC X/Y/Z = 0. Its one reference is

  cutscenescript_808F594''s `cs_warp_cmd_8038040_2 byte1=0x1 byte2=0x01 ptr3=unk_808F5C4` (dat24.s:3055).

  CutsceneCmd_warp_cmd_8038040 (map_script_cutscene.s:5675) with byte1 bit 0 set calls

  warp_setSubsystemIndexTo0x14AndOthers_8005f14 with r0 = this pointer, r1 = 0, r2 = byte2 = 1;

  warp_ArmPendingTransition_8005EEC stores it as Warp2011bb0.WarpDataPtr with WarpIndex 1 and

  MapGroupTransitionType 1. map_triggerEnterMapOnWarp_8005C04 then copies entry WarpIndex - 1 (this one) into

  Warp2011bb0 (asm00_1.s:5793-5799), but for MapGroupTransitionType 1 (MAP_GROUP_TRANSITION_TYPE_INTERNET_TO_REAL_WORLD)

  takes the destination from GameState.SavedRealWorldX/Y/Z, FacingDirection and MapId (asm00_1.s:5870, 5886), so

  this entry''s map and coordinates do not pick where MegaMan lands: the warp jacks him out to the real-world

  place he jacked in from. unk_8088FDC (asm23.s:302) and unk_808C188 (asm24.s:248) hold the same words and are

  used with the same byte1=1, byte2=1. The word after it, off_808F5D4 (`.word eWeatherCompState`), is a separate

  label that routines in asm25.s read eWeatherCompState through (via literals pointing at it); the warp reads only

  0x10 bytes. vidsync''s BN6F_SYMBOLS.md lists it (level A) as the warp of cutscenescript_808F594; vidsync never
  reads or writes it.

  '
