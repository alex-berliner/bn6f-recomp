name: ai_chipAttackTick
address: '0x080FFDF8'
kind: function
status: probable
summary: 'Per-frame tick of the AI''s chip/element-4 attack state: sets up the attack on the first frame,
  counts a 40-frame timer, then exits the attack state.'
interface: (r7 = battle object AI attack vars, r5 = same object base) -> r0 = leftover; sets attack element/anim/timer
  fields, flags from tst/sub
details: Runs as the AI attack-state update for one battle object. On the initial frame (oAIAttackVars_AttackElement
  == 0) it stamps element 4 into oAIAttackVars_AttackElement, sets oBattleObject_CurAnim to 0, and loads
  oAIAttackVars_StepTimer with 0x28 (40 frames). If oAIAttackVars_ScratchVar is nonzero it also calls
  sub_80E71B8 once (likely firing the attack's projectile/effect). On later frames it just decrements
  StepTimer, and when it hits zero calls object_exitAttackState to return to the normal AI state. Timer-based
  one-shot attack pattern with an optional first-frame action.
