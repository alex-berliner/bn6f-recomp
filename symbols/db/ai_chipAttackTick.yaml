name: ai_chipAttackTick
address: '0x080FFDF8'
kind: function
status: confirmed
summary: One tick of an AI enemy's chip-attack state — arms the attack on the first tick (element, wind-up anim,
  40-tick timer) then counts down and exits the attack state when the timer expires.
interface: 'void ai_chipAttackTick(r5 battleObject, r6 ctx, r7 aiAttackVars); // out: r1 passed through from callee
  / caller value; clobbers r0-r3, r6, r7, lr, flags'
details: 'Per-tick handler for the AI''s chip-attack phase, operating on r5 = battle

  object, r6 = context passed through to the exit routine, r7 = AI attack vars.


  First tick (oAIAttackVars_AttackElement == 0): stores element 4, sets

  oBattleObject_CurAnim to 0 (wind-up/idle animation), and loads

  oAIAttackVars_StepTimer with 0x28 (40 ticks). If oAIAttackVars_ScratchVar is

  nonzero, calls sub_80E71B8 with it in r0 (r1 is then the live output);

  otherwise returns with r1 untouched.


  Later ticks: decrements oAIAttackVars_StepTimer each tick (16-bit). While

  the timer stays > 0, nothing else happens. When it reaches 0, calls

  object_exitAttackState(r5, r6, r7) to leave the attack state; its r1 becomes

  the output.


  Quirk: the element byte is only set when it was zero, so element 4 doubles

  as the "attack armed" flag; the element is hardcoded to 4 regardless of the

  actual chip, with the ScratchVar path (sub_80E71B8) presumably applying the

  real per-chip setup.

  '
