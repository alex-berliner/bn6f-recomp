open_questions:
- which battle object(s) use this handler — the single caller sub_80C9848 and the action-table handler
  sub_80C9964 are unknown
- meaning of oBattleObject_Param4 (set when the object stands on a differently-allied panel)
- what the effect spawned on battle end (r4=0x14, coords at r5+0x34) looks like
- why CurState==8 skips collision-region re-registration
