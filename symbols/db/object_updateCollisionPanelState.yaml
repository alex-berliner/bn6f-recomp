name: object_updateCollisionPanelState
address: '0x080C98DC'
kind: function
status: probable
summary: Per-frame battle-object tick that rebuilds the object's collision on its current panel, dispatches
  its action handler, flags standing on a foreign-alliance panel, and despawns via an effect when the
  battle ends.
interface: (r5 = battle object) -> r0 = ?; sets oBattleObject_Param4 and possibly CurState to CUR_STATE_DESTROY
details: 'Runs each frame for a battle object (this-pointer in r5): it first tears down and respawns the
  object''s collision data, then exits early if the battle is over, in which case it spawns an effect
  using the coordinates at r5+0x34 with r4=0x14, clears the collision region, and writes CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized. Otherwise it reads the collision data pointer,
  clears the collision region if collision flags are set, and dispatches via oBattleObject_CurAction through
  table off_80C9960 (branch to handler sub_80C9964). If oBattleObject_Param4 is 0 and the panel''s oPanelData_Alliance
  XORs to differ from the object''s oBattleObject_Alliance, it sets Param4=1. Finally, if CurState !=
  8 and the object moved to a new panel (panel XY changed since entry), it re-registers the collision
  region with object_setCollisionRegion(1), then refreshes collision via object_presentCollisionData and
  marks the occupied panel with object_highlightPanel.'
