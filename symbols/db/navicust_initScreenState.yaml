name: navicust_initScreenState
address: '0x08135968'
kind: function
status: probable
summary: One-time initialization of the Navi Customizer screen state (board, key-item list, counters)
  guarded by an init flag; unconditionally clears a per-entry latch byte at state+0x13 on return.
interface: (r5 = navi-customizer screen state struct; r0 unused on entry) -> r0 = 0; writes state bytes
  in the struct, calls rebuild/draw helpers
details: Reads the flag at state+0xD; if it is already set, only state+0x13 is cleared and the function
  returns, so the setup runs exactly once. The setup sets state+2 = 8 (likely a phase/mode), calls sub_813BA80,
  rebuilds the key-item list via submenu_rebuildKeyItemList, sets state+0xC = 0x10, calls sub_813660C(1),
  redraws the 49-cell customizer board via navicust_drawBoardTilemap(1), zeroes state+0xE, 0x14 and 0x10,
  and calls sub_813B920. Finally it always clears state+0x13, likely a per-frame or per-transition latch
  consumed elsewhere.
