    mov r0,#1; bl navicust_drawBoardTilemap — draws the customizer board tilemap; strb of 0 into 0xE,
    0x14, 0x10 and bl sub_813B920 — resets screen-state counters and runs another setup helper; loc_813599A:
    strb 0 into 0x13; pop — clears a latch unconditionally on every call'
