open_questions:
- Whether r4 holds the half-extent in fixed-point pixels or a pixel count (the low 16 bits are not observable
  in caller contexts). The `2*r4` doubling suggests r4 is half; if r4 is already the full extent, the
  comparison is off by 2x. A captured caller trace with r0/r1 separating signs from magnitudes would settle
  this.
- Why r3 is a Y1 in the captured calls but the function never tests it against r4 itself — it only feeds
  the subtraction. Looks like a coincidental extra argument; could also be intended for an implicit Z
  compare the caller folded in.
