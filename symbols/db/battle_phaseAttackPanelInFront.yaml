  - bn6f/asm/asm31.s:10197
  - 0x080005CC PlaySoundEffect
  - 0x0800E2CA object_getFrontDirection
  - 0x080B8E30 spawn_t1_0x5_tempAttackObject_80B8E30
  reproduce: python3 tools/asmcat.py 0x080BCC2C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposed name and summary are very close to the code. The windup to 10, the temp-attack spawn
    at offset 0x64, the front-panel X computation, sub_80DAB9C call, hit-counter increment at [ExtraVars+4]+0x10,
    and PlaySoundEffect(0x80) all match. Two small fixes: the sound ID is 0x80, not ''0x81-0xFF encoding''
    (mov r0,#0x81; add r0,#0xff → 0x80), and the phase word is written via strh of 4, not strb — both
    match what the proposal captured in the interface. The ''ExtraVars+4'' wording is fine; renaming for
    clarity is optional.; run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
