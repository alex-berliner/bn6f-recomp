name: battle_phaseAttackPanelInFront
address: '0x080BCC2C'
kind: function
status: probable
summary: 'Battle-object phase handler: spawns a type-1/5 temp attack object on first entry, waits 10 frames,
  then strikes the panel directly in front of the object with its element/damage via sub_80DAB9C, increments
  a hit counter at ExtraVars+4+0x10, plays sound 0x80, and advances to phase 4.'
interface: (r5 = battle object) -> none; sets oBattleObject_CurPhaseAndPhaseInitialized = 4 when the attack
  fires
details: On the first invocation (PhaseInitialized clear) it sets CurAnim to 0xA, spawns a type-1 subtype-5
  temp attack object linked to this object (stored via the pointer at r5+0x64), zeroes Timer, and marks
  the phase initialized. Each frame Timer is incremented; once it reaches 10, the handler computes the
  target panel X as object_getFrontDirection(this) + PanelX at the object's PanelY, and calls sub_80DAB9C
  with Element, damage/stamina fields from the object and Param4 pointer — evidently applying an attack
  to that panel. It then increments a hit counter at [ExtraVars+4]+0x10 and plays sound effect 0x80 (0x81-0xFF
  encoding), finally setting the phase word to 4 (phase 4, initialized) so control passes to the next
  phase.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'first-run block sets CurAnim=0xA, calls spawn_t1_0x5_tempAttackObject and strb #4 to PhaseInitialized
    (init step); Timer counts to 10 before any attack work happens, i.e. a windup delay; object_getFrontDirection
    result is added to PanelX and passed with PanelY/Element/Damage fields to sub_80DAB9C, so the target
    is the facing panel; PlaySoundEffect(0x80) fires at the same point and phase is then set to 4, ending
    this attack step; counter at [ExtraVars+4]+0x10 increments per attack, tracking how many strikes have
    been made'
