name: battleObject_panelToPixelOffset_80FE5C0
address: '0x080FE5C0'
kind: function
status: confirmed
summary: Computes a battle object's sub-pixel (X or Y) movement offset by scaling a panel delta, using
  BIOS SVC 6.
interface: "void sub_80FE5C0(u32 inX /*r0*/, u32 inY /*r1*/, u32 multiplier /*r2*/, struct BattleObject*\
  \ obj /*r5*/)\n  -> u32 outX /*r0*/, u32 outY /*r1*/, u32 scaledDelta /*r2*/, u32 scale /*r3*/;\nclobbers\
  \ nz c v; preserves none.\n"
details: "Reads obj->PanelX (oBattleObject_PanelX) and obj->PanelY (oBattleObject_PanelY) from the\nBattleObject\
  \ struct pointed to by r5. Two branches:\n  * If the requested X (r0) does not match the stored panel\
  \ X, computes\n    (r0 - PanelX) * r2 as the X offset, leaves Y as 0, and uses a fixed-point\n    scale\
  \ of 0x00280000.\n  * Otherwise (X already matches) computes (r1 - PanelY) * r2 as the Y offset,\n \
  \   leaves X as 0, and uses a fixed-point scale of 0x00180000.\nThe chosen scale is then fed to GBA\
  \ BIOS SVC 6 (Div / scale helper) along with\nthe caller-supplied multiplier (r2); the BIOS return value\
  \ becomes the new r2.\nThe pre-multiplication X or Y value, the zeroed counterpart, and the scale\n\
  are returned in r0/r1/r3 respectively. The two constant scales (0x28 and 0x18\nshifted left by 16) are\
  \ sub-pixel sizes (40 and 24) of a battle panel in\npixels, suggesting the X path produces the per-frame\
  \ X pixel displacement\nand the Y path produces the per-frame Y pixel displacement of a panel\ntransition\
  \ animation. The function is a leaf (push lr / pop pc) and uses a\nBIOS SVC call directly.\n"
