name: battle_getLoadedNaviId
address: '0x0802DCCC'
kind: function
status: probable
summary: Returns a byte (likely the currently loaded/active navi id) from the alliance's 16-byte record
  in the table at unk_203A980.
interface: (r0 = alliance/entry index) -> r0 = byte at [unk_203A980 + r0*0x10 + 4]; flags not meaningful.
details: Multiplies r0 by 0x10, indexes the 16-byte-record table at unk_203A980, and reads the byte at
  offset +4. The only caller compares this byte against GetBattleNaviStats2034A60Byte(alliance, 0x29)
  (NaviStats byte 0x29) and takes a different path when they differ, suggesting it reports which navi
  is currently loaded/active for that alliance and the caller detects a mismatch with the navi-stats record.
  The table at unk_203A980 appears to hold one 16-byte entry per alliance (at least entries 0 and 1),
  with offset +4 holding an id-like byte.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_802DCCC: mul r0 by 0x10, ldr base unk_203A980, ldrb [r1,#4] — a getter for byte 4 of a
    16-byte-stride table; sub_802D7A0 @0x802D7F6: passes ldrb [r5,#oBattleObject_Alliance] and compares
    result (cmp r0,r1) with NaviStats byte 0x29 for the same alliance; sub_802D7A0 also uses per-alliance
    NaviStats (GetBattleNaviStatsAddr, eBattleNaviStats2034A60 with alliance*0x64 stride), so r0 is an
    alliance selector'
  refs:
  - bn6f/asm/asm03_0.s:16703
  - 0x0802D7A0 sub_802D7A0
  reproduce: python3 tools/asmcat.py 0x0802DCCC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-045129'
open_questions:
- What the 16-byte records at unk_203A980 represent (which subsystem owns them) and what exactly byte
  +4 means
- What NaviStats field 0x29 is, to confirm the compare is a 'navi changed' check
- Who else writes unk_203A980 records
