- method: assembly-reading
  date: '2026-10-19'
  detail: caller battle_breakFrontPanels marks front panels as type 7 and 'spawns a panel effect on them'
    at 0x080BAE7A; bl object_spawnType3 with mov r0,#0x8e selects the effect object type; stores to oBattleObject_PanelX/PanelY/Element
    and Damage field right after the spawn-success branch; orr with 0x10 into oObjectHeader_Flags marks
    the spawned object's header flag; beq locret_80D6ED4 skips all field writes when the spawn failed
