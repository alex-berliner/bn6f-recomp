name: battle_spawnPanelBreakEffect
address: '0x080D6EB0'
kind: function
status: probable
summary: Spawns the panel-break battle effect object (type 0x8E) on a panel and initializes its position,
  element, damage and effect flag.
interface: (r0..r3 = args copied to fields, r6 = damage value) -> r0 = spawned object or 0 on failure;
  flags from object_spawnType3 used for the success branch
details: 'Calls object_spawnType3 with spawn type 0x8E, and if the spawn succeeded fills the new battle
  object: PanelX, PanelY and Element bytes from the caller''s arguments, the DamageAndStaminaDamageCounterDisabler
  field from r6, and copies AllianceAndDirectionFlip from another object (r5). It then sets bit 0x10 in
  oObjectHeader_Flags, likely marking this as a non-attacking effect/one-shot object. A small constant
  table (2,0,4,0,6,0,0xA,0) follows the function, plausibly animation or frame data for the effect.'
