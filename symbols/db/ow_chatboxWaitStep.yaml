name: ow_chatboxWaitStep
address: '0x0802AE14'
kind: function
status: probable
summary: State-machine step for some overworld-side object that waits on the chatbox and transitions its
  state/timer when a dialog is (or stops being) active.
interface: (r5 = object/state struct pointer, r0 = flag mask) -> mutates [r5+0..9]; calls chatbox_8040818;
  no return value used
details: 'First tests bit 0x20 of the chatbox flag word eFlags2009F38 and returns immediately if it is
  clear, so this only runs during a specific chatbox/cutscene condition. It then reads the chatbox state
  selector (low 3 bits of eFlags2009F38): if nonzero, it writes state byte 0x10 and clears the halfword
  timer at r5+2, decrements the byte at r5+5, calls sub_802AF38, copies the two bytes at [r0+0x12]/[r0+0x13]
  of its result into r5+8/r5+9 while zeroing the source, calls sub_802AF28, then sets state 0xC and timer
  4 before invoking chatbox_8040818 (the per-frame chatbox routine). If the chatbox state is zero it instead
  stores the word 8 at [r5+0], likely a next-state/ID field. The byte+halfword pairs at r5+1/r5+2 look
  like the standard overworld object state/timer fields, and the decrement of r5+5 suggests a countdown
  of pending items.'
