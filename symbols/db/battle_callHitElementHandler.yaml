name: battle_callHitElementHandler
address: '0x080F2274'
kind: function
status: probable
summary: Dispatches to one of two element-specific handlers based on the AI attack's hit element byte.
interface: (r7 = battle AI attack vars struct) -> r0 = passthrough return of the selected handler; no
  flags set by caller frame
details: Loads off_80F2288, a 2-entry branch table, indexes it with [r7,#oAIAttackVars_HitElement], and
  calls the selected thumb handler with lr=pc so control returns to the pop {r7,pc}. No arguments are
  set up, so the handler presumably reads the same r7 structure. With only two entries, HitElement is
  treated here as a binary choice (0 or 1), not the full element enum. Nothing else is touched; the function
  is a pure trampoline.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0, [r7,#oAIAttackVars_HitElement] then ldr r1, [r1,r0] selects the handler by element
    byte; off_80F2288 holds exactly two thumb pointers (sub_80F2290+1, sub_80F22C2+1), implying a two-way
    element split; mov lr, pc; bx r1 is the long-call idiom, letting the callee return straight into pop
    {r7,pc}; Runs on recorded battle routes, consistent with an attack/hit-time hook in oAIAttackVars
    context
