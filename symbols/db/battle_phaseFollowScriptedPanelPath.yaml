open_questions:
- What sub_80BF160 does with the packed (Timer2, entry[0..2]) argument and the object+0x6C+index pointer
  (movement tween setup vs data copy) is unknown
- Meaning of entry bytes [2] and [4] (frames/delay vs animation id) and whether byte 0x20 is truly alliance
  or another side flag
- No caller known, so which battle object/phase script uses this path (and whether phase 8 is 'done')
  is unconfirmed
