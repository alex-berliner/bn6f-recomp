name: battle_phaseFollowScriptedPanelPath
address: '0x080BE8AE'
kind: function
status: probable
summary: Battle-object phase handler that advances the object along a hardcoded sequence of panel waypoints
  (mirror tables for each alliance side), setting its future panel and facing, until the path ends (phase
  8).
interface: (r5 = battle object) -> r0 = 0/next state; writes object FuturePanelX/Y, DirectionAngle, Timer2,
  CurPhase
details: r5 is a battle object; Timer2 (oBattleObject_Timer2) is used as the current step index into a
  5-byte-per-step path table. Byte 0x20 of the object's NaviStats (alliance/side) selects between two
  tables at byte_80BE91C (target X 5,1,2,3,4) and byte_80BE936 (target X 10,6,7,8,9), i.e. mirrored paths
  for the two field halves. Each entry is [targetX, targetY, param, facingDir, extra]; the entry's target
  panel and facing are applied via sub_80BF160/sub_80BF192 (r0 packed as Timer2<<24|[2]<<16|[1]<<8|[0],
  r2 = &object[0x6C+Timer2], r3=0, r6 = object DamageAndStamina... field), storing FuturePanelX, FuturePanelY
  and DirectionAngle = dir eor 1 (flipped facing). Timer2 is then incremented to advance to the next waypoint;
  when the table's 0xFF terminator is reached the object's CurPhase is set to 8 and the routine returns.
  Likely a scripted crossing/patrol movement for an enemy or field object.
