    panel X per step); r0 packed as Timer2<<24|e2<<16|e1<<8|e0 passed to sub_80BF160; result stores FuturePanelX/Y
    and DirectionAngle = entry[3] eor 1; 0xFF entry terminator -> strh #8 into oBattleObject_CurPhaseAndPhaseInitialized,
