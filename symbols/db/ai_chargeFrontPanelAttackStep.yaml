name: ai_chargeFrontPanelAttackStep
address: '0x081085C2'
kind: function
status: probable
summary: 'AI attack routine: initializes a charged strike, periodically highlights the panel in front
  of the user as a telegraph, and after a countdown sets the hit element to trigger the attack.'
interface: (r7 = AI attack vars struct, r5 = battle object) -> void; updates oAIAttackVars_AttackElement/ChargeCycles/StepTimer/HitElement
details: 'On first entry (AttackElement == 0) it arms the attack: sets AttackElement = 4, copies AttackBoost2
  into StepTimer as the strike countdown, and clears ChargeCycles. Each subsequent tick increments ChargeCycles;
  every 8th cycle (lsr #3 carry) it calls object_getFrontDirection and object_highlightPanelRegion to
  flash the adjacent panel at (PanelX + dir, PanelY) with highlight type 2, telegraphing the attack. The
  StepTimer counts down each tick and, when it reaches 0, sets HitElement = 0x14, presumably making the
  pending strike hit that element/panel next.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne + mov #4 store: one-time attack init branch;
    strh AttackBoost2 -> StepTimer, mov #0 -> ChargeCycles: countdown sourced from a per-AI tuning field;
    lsr r0,#3 / bcs: highlightPanelRegion fires only every 8 charge cycles, a pulsing telegraph; bl object_getFrontDirection
    + PanelX/PanelY/AllianceAndDirectionFlip into object_highlightPanelRegion: targets the panel facing
    the user; sub StepTimer; bgt; mov #0x14 -> HitElement: when the countdown ends the attack resolves
    with element 0x14'
