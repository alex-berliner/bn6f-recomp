name: battleObject_clampCurAnim_80B8810
address: '0x080B8810'
kind: function
previous_names:
- sub_80B8810
status: probable
summary: Clamps the related-object's CurAnim to <=3 and stores the result back into the calling BattleObject's
  CurAnim.
interface: (r5 = battleObject *) -> r0 = clamped value, NZ/C/V flags reflect the final value ; no side
  effects beyond the store
details: "Loads the first related object pointer from offset oBattleObject_RelatedObject1Ptr (0x4c) into\
  \ r0,\n  reads the byte at oBattleObject_CurAnim (0x10) on that related object, and clamps it to a maximum\n\
  \  of 3 via a signed compare against immediate 3 plus a `mov r0,#3` fallback. The clamped byte is\n\
  \  then written back into the calling BattleObject's own oBattleObject_CurAnim field (r5+0x10).\n  Likely\
  \ used to mirror/restrict an animation state from a \"primary\" related BattleObject onto\n  its partner\
  \ (e.g. counter-hit, formation, or sync animation). No other registers touched;\n  returns through `mov\
  \ pc, lr`.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, [r5,#oBattleObject_RelatedObject1Ptr]` then `ldrb r0, [r0,#oBattleObject_CurAnim]`
    reads CurAnim of the object pointed at by RelatedObject1Ptr (struct offsets 0x4c and 0x10). - `cmp
    r0, #3` / `ble loc_80B881A` / `mov r0, #3` performs a signed clamp to max 3. - `strb r0, [r5,#oBattleObject_CurAnim]`
    writes the clamped value into the caller''s CurAnim. - Contract `in=[''r5'',''lr'']` confirms r5 is
    the BattleObject pointer, no other args used. - No callees (no `bl` instructions); two callers both
    pass a BattleObject in r5.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080B8810

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: battlesweep, beastsp'
  reproduce: 'grep -l ''^080b8810 '' tools/traces/coverage/*.prof

    '
