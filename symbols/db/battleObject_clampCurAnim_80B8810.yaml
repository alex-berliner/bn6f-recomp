name: battleObject_clampCurAnim_80B8810
address: '0x080B8810'
kind: function
status: confirmed
summary: Copies the related battle object's current animation index into this object's CurAnim field, clamped to
  a maximum of 3.
interface: void battleObject_copyClampedAnimFromRelated_80B8810(battleObject *self /* r5 */)
details: 'Loads the pointer at self+oBattleObject_RelatedObject1Ptr, reads the byte

  oBattleObject_CurAnim from that related object, clamps it to at most 3

  (values 0-3 pass through, anything above becomes 3), and stores the result

  into this object''s own oBattleObject_CurAnim byte. No other registers,

  memory, or flags are touched; it is a trivial tail (returns via mov pc, lr).

  Note the asymmetry: the source value comes from the related object while

  the clamped value is written to the object passed in r5, so the two objects''

  animation indices are synced with a cap of 3 (likely a 4-frame/pose anim set).

  Callsite analysis shows r5 is the only meaningful argument and nothing is

  returned; nzcv are clobbered by the cmp but callers ignore them.

  '
