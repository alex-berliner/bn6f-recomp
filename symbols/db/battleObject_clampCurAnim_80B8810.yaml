open_questions:
- What "RelatedObject1Ptr" semantically represents for the calling sites (the two callers share
- the same contract, suggesting both operate on a battle-object pair); whether the clamp is also
- applied to negative values (signed BLE means values <=3 pass through, including negatives),
- and what animation values 0..3 mean here. Inspecting the callers' context would settle it.
