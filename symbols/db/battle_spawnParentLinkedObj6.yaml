name: battle_spawnParentLinkedObj6
address: '0x080E09EE'
kind: function
status: probable
summary: 'Spawns a type-4 battle object with id 6 and links the fresh object to its spawner: inherits
  the parent''s alliance/flip field, stores the parent pointer and a caller pointer in it, and records
  the new object at *r7.'
interface: (r0 unused by caller - set to 6 here; r1-r3 = pass-through params for object_spawnType4, r5
  = parent battle object, r7 = ptr to slot receiving new object) -> r0 = new battle object or unchanged/0
  on failure; flags from spawn result (beq skips linking on failure)
details: 'Thin spawn wrapper: sets the first spawn parameter to 6 and calls object_spawnType4, letting
  the caller''s r1-r3 supply the rest. On success it copies oBattleObject_AllianceAndDirectionFlip from
  the parent (caller''s r5) into the new object, since the type-4 initializer already ran before this
  fixup. It writes the parent into the new object''s oBattleObject_RelatedObject1Ptr and the caller''s
  r7 into oBattleObject_ExtraVars+4, then stores the new object pointer to *r7 so the caller keeps a handle.
  The child thus acts as an attachment/companion of the spawning battle object, sharing its alliance and
  flip state. Note the listed ''mov r0, r5'' is inconsistent with the stores (which use r0 as destination
  object, r5 as source parent); the coherent reading is mov r5, r0 followed by pop {r5} restoring the
  parent, with beq testing the spawn''s NULL/success result. r7 is used without being saved, so it relies
  on a caller-provided context pointer.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0,#6 + bl object_spawnType4: only the first spawn parameter is fixed here, rest pass through
