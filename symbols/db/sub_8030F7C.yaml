name: sub_8030F7C
address: '0x08030F7C'
kind: function
status: confirmed
summary: Tests whether a line segment crosses a two-edge wedge (stored in an object) and returns the intersection
  coordinates, or (0,0) on no-cross.
interface: seg_result col_segEdgeIntersect(u32 obj, u32 xA, u32 yA, u32 xB, u32 yB, u32 mode)
details: "obj (r0) points to a structure with two directed edge endpoints:\n  edge0 normal component  (obj+0x00)\n\
  \  edge0 normal component  (obj+0x04)\n  edge1 normal component  (obj+0x0C)\n  edge1 normal component  (obj+0x10)\n\
  The caller supplies a segment (xA,yA)->(xB,yB) in r2-r5 and a mode in r6\n(r8 is saved from r6).  mode==1 checks\
  \ only edge 0; otherwise both edges\nmust yield the correct sign of the 2-D cross product, confirming the\nsegment\
  \ straddles the wedge between the two edges.\nOn sign-test failure the function returns r0=r1=0 and leaves r4\
  \ (the last\nnormal-component product), r6/r7 (direction deltas), r8 (mode), r9\n(caller's r9) in registers for\
  \ the caller's use.\nOn success it calls sub_8031048 (a signed-division / parametric-t helper)\ntwice to obtain\
  \ the actual intersection point on each edge, then returns\nthe X coordinate in r0 and the Y coordinate in r1.\n\
  A debug string table (DebugStrings8030FF4) sits immediately after the\nfunction body with entries \"00 X:%8X Y:%8X\"\
  \ .. \"03 X:%8X Y:%8X\",\nsuggesting callers log the four result registers (r0/r1 and the two edge\nhit points)\
  \ during development.\nQuirk: the variable naming in the C wrapper mixes up dx/dy because the\nassembly reuses\
  \ r6/r7 as direction-vector components after the\ncross-product in r2; the sign logic is what matters, not the\
  \ axis labels.\n"
