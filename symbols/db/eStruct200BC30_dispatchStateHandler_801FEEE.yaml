name: eStruct200BC30_dispatchStateHandler_801FEEE
address: '0x0801FEEE'
kind: function
status: confirmed
summary: State-machine dispatcher for eStruct200BC30 that calls one of two handlers selected by the struct's current
  jump-table slot, passing the original argument through in r0.
interface: void eStruct200BC30_dispatchStateHandler_801FEEE(void* arg /*r0*/); preserves r4-r7; returns with c/v
  (and everything else except r0-r3) as left by the invoked handler
details: "Tail-of-a-dispatcher style routine: saves r4-r7/lr, stashes the caller's r0 in r7, then\nasks eStruct200BC30_getJumpOffset00\
  \ for the struct's current state slot (return in r0).\nIt loads the base of the 4-entry thumb handler table off_801FF08\
  \ into r1, reads the\nselected entry into r2, restores the argument into r0, and does a bx r2 call via\n\"mov\
  \ lr, pc\". The table only contains two distinct targets, arranged A,B,B,A:\n  slot 0 and slot 3 -> sub_801FF18\n\
  \  slot 1 and slot 2 -> sub_801FFD6\nso the dispatch effectively reduces to a two-way branch on the state. r8-r12\
  \ and lr\nare not saved by this routine and flow through to the handler untouched (lr is\noverwritten by the mov\
  \ lr,pc trick for the callee's return, but the original lr value\nis on the stack and restored by pop {r4-r7,pc}).\
  \ Flags c and v are simply whatever\nthe invoked handler leaves behind; nz are clobbered by the dispatch itself.\n\
  Touches only the jump-offset/query helper and the static table at 0x0801FF08; the\nhandler argument is opaque\
  \ and passed through unmodified.\n"
