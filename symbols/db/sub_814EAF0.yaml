details: "Reads a 4-byte type tag at offset 0x34 of the object and compares against the constant\n0x68736D53 (\"\
  SmSh\" in ASCII, treated as a FourCC magic). Only then does it write:\n  - the masked input value (16-bit via\
  \ lsl #16 / lsr #16) into offset 0x24 and 0x26\n    (treated as a low/high pair forming a 32-bit sequence/step\
  \ pointer),\n  - state word at offset 0x28 set to 2,\n  - clears bit 31 of the status word at offset 0x04 (a \"\
  done/finished\" flag).\nThe skip path leaves the object untouched and returns the masked input. The match path\n\
  returns the 0x7FFFFFFF mask constant loaded from dword_814EB18. Magic constant \"0x68736D53\"\nused as the tag\
  \ check.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
