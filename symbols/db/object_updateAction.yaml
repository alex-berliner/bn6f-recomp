  reproduce: python3 tools/asmcat.py 0x0801B610
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The summary and name capture the dispatch and most flag handling correctly: hit processing at loc_801B638-0x656,
    sub_8018002/801813A/801823C alternate paths at 0x801B6A4/C4/DC, and the final mov lr,pc/bx r0 dispatch
    at 0x801B72A. However the name ''object_dispatchCurAction'' undersells the substantial pre-dispatch
    state machine (hit/HP/dead, hit-react to action 2, idle restore), which is closer to a per-frame ''update''.
    Suggested name object_updateAction better reflects both halves.; run wf investigate investigate-20261018-222121;
