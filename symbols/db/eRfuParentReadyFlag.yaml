name: eRfuParentReadyFlag
address: '0x02010408'
kind: data
status: probable
summary: 'Proposed name: eRfuParentReadyFlag. EWRAM byte acting as a ready/active flag for the parent
  side of an RFU multiplayer link transfer, alongside sibling flags byte_2010270 and byte_2010368 and
  timeout word dword_2010418. (u8)'
details: Sits in the cluster of RFU link-state globals at 0x020103F4..0x02010458. rfu_startLinkTransfer
  zeroes it on init. sub_8148738 sets it to 1 when issuing link command 0xF, then reads it back in sub_8148884
  as a busy/ready gate that must clear before continuing, with byte_2010270 consulted as a second condition.
  It is a single byte, never indexed. The tbl off_80F1188 entries suggest a 'flag,target value' pair used
  by some generic flag-check helper.
evidence:
- method: caller-analysis
  date: '2026-10-20'
  detail: asm/libs.s:9522 rfu_startLinkTransfer writes 0 (strb r4,[r0]) to initialize the flag.; asm/libs.s:9816
    sub_8148738 sets the byte to 1 after rfu_setLinkCommand(0xF).; asm/libs.s:9943 sub_8148884 reads the
    byte (ldrb r0,[r3]) and branches on ==0 as a readiness check.; asm/asm31.s:129172 off_80F1188 pairs
    the flag with target value 0x4, fitting a 'wait until flag == N' helper.
