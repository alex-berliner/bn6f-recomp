name: battle_updateIntroState
address: '0x08124F30'
kind: function
status: probable
summary: 'Per-frame handler of a timed pre-battle/intro state: ticks a 2-step frame counter, pumps the
  battle transition and arena tiles, and conditionally writes halfword pairs into pool structs.'
interface: (r5 = battle-state struct, no register args) -> void; writes r5+0x70=0xff each frame, advances
  r5+0x74 by 2 (clamped to 0x7c), and stores next state id 0x18 into r5+0x2 when the cap is hit
details: 'Each call adds 2 to the counter at r5+0x74; once it reaches 0x7c the counter is clamped and
  r5+0x2 is set to 0x18, i.e. the state machine moves to the next phase, so this runs for a fixed window
  (~57 frames at step 2). r5+0x70 is forced to 0xff every frame, likely a ''keep running'' / frame-budget
  marker the state loop consumes. It then calls the one-shot transition pump (player/enemy row sprites,
  tilemap reload), the arena floor tile renderer, and sub_8125F5C. Finally it invokes sprite_setStructHalfwordPairOnThree
  twice: for struct index [r5+0x64] with pair (0 normally; [r5+0x30] if [r5+0x64]==0xf; [r5+0x1c] once
  counter>=0x72 and [r5+0x5c]==0x27, else 0) and value 7, and for struct index [r5+0x60] with pair ([r5+0x26]
  if [r5+0x60]==5, else 0) and value 4. The [r5+0x60]==5 check mirrors the Dark-Chip-team (alliance==5)
  selection in bg_drawArenaTiles, so the second write is team-conditional, and 0x27/0x0f look like special
  battle/scenario ids gating extra sprite placement near the end of the window.'
