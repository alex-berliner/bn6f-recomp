    run wf investigate investigate-20261019-003606'
open_questions:
- What sub_8011044 does with the unpacked {version, actorType, AIIdx} and the r2=1 argument (respawn/actor
  re-registration/AI reset?)
- The semantic meaning of flag bit 0x2 in oObjectHeader_Flags and of the ExtraVars byte cleared here
- No known caller, so the object type and game context (e.g. delayed self-destruct / timed removal) are
  unconfirmed
