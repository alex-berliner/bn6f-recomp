name: sub_802BE36
address: '0x0802BE36'
kind: function
status: confirmed
summary: 'Per-frame tick for a battle object: bumps its progress counter, transitions it to the follow-up state
  when the animation tops out, and (unless the object is in mode 2) refreshes its component and display.'
interface: 'void sub_802BE36(struct BattleObject *r5 /* r5 in/out */);

  inputs:  r5 = object pointer

  outputs: r5 preserved; r6, r7 as left by sub_802C6EC (last callee)

  clobbers: r0, r1, r2, r3, r4, lr; flags NZCV

  '
details: "Bumps the object's progress counter (object+0x06, s8) by 2; when it\nreaches/passes 3 the counter is clamped\
  \ at 3 and the object transitions\ninto state 4 (object+0x01 = 4) with timer (object+0x02, u16) zeroed.\nAfter\
  \ that, if object+0x04 (mode) is not 2 it calls:\n  sub_802C4E8(object+0x1c /*component ptr*/, object+0x0e /*frame*/)\n\
  \  sub_802C6EC(object+0x08 /*id*/)\nBypasses both callees entirely when mode == 2. Pool byte_802BE6C sits\nimmediately\
  \ after the function and is reachable via the literal pool if\nneeded (not referenced here).\n"
