name: battle_spawnMirrorFacingHelper_80280E0
address: '0x080280E0'
kind: function
status: confirmed
summary: When a trigger condition passes, initializes a helper object entry (kind 4) in the battle object array
  that mirrors the source object's left/right facing.
interface: void sub_80280E0(battlework* r4, sourceobj* r5 /* +0x10 state, +0x16 facing */); /* r6, r10 ambient inputs
  per callers; returns r2 = r5->facing on the setup path; Z set if dir==0 path taken */
details: 'Reads the state byte at r5+0x10 and returns immediately if it is nonzero (object already active or finished).
  Otherwise calls sub_802A5DA to test a trigger/visibility condition and bails out if it returns 0. On success it
  initializes the entry at r4+0x60 (an object slot within the battle work structure, 0x10-byte stride suggested
  by the field offsets): +0x00 = 4 (object kind), +0x0C = 5, +0x03 = 0x0B (behaviour/table id), +0x0E = 7. It then
  reads the source object''s facing byte at r5+0x16 and writes the mirrored value (1 - facing) into entry+0x04;
  when the source faces right (facing==1, so dir computes to 0) it additionally stores 1 at entry+0x07. r2 is left
  holding the raw facing byte when the setup path runs, which callers reportedly observe. The data label off_8028118
  (dword_20349A0) immediately after the function suggests this routine is reached via a function-pointer table.'
