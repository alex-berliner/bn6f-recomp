name: shop_copyItemTableToShopData_8048C98
address: '0x08048C98'
kind: function
status: confirmed
summary: Copies the 464-entry shop item table (byte_8047DA0) into the current shop's data buffer, skipping empty
  slots while keeping slot alignment.
interface: void copy_8048C98(r10=toolkit, lr=return); writes r2, r3; clobbers r0, r1, nzcv flags
details: 'Reads the shop data pointer from toolkit->shopDataPtr (r10 + oToolkit_ShopDataPtr) as the destination
  and always uses the fixed source table byte_8047DA0. Copies exactly 0xE80 bytes, i.e. 464 entries of 8 bytes each,
  one entry per iteration: +0 item id (byte), +2 price (halfword), +4 extra byte, +6 count/flags halfword. Entries
  whose byte at offset +1 is zero are treated as empty slots and not copied, but the destination pointer still advances
  by 8 so empty and occupied slots stay aligned in the destination buffer. The loop counter r2 counts down by 8
  and exits after the copy that makes it negative, so it returns 0xFFFFFFF8 and r3 holds the last loaded value (on
  a skipped entry, the empty-slot check byte itself) — the caller apparently relies only on the memory side effect.
  Called before opening shops so the shop''s stock/price list matches the canonical item table.

  '
