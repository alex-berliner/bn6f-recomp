name: sprite_repackAndQueueTiles_811F5DC
address: '0x0811F5DC'
kind: function
status: confirmed
summary: Repacks strided tile rows from a source into a contiguous destination buffer, then queues an
  8-word-aligned GFX DMA transfer.
interface: void sprite_repackAndQueueTiles_811F5DC(u32 src /*r0*/, u32 dst /*r1*/, u32 width /*r2*/, u32
  height /*r3*/) -> flags:c,v; r0,r1,r2,r3 from DMA-queue callee; clobbers N,Z,lr; preserves r4-r7.
details: Decomposes tile height into 4-row blocks (source stride 0x100), 2-row blocks (stride 0x80), and
  a trailing 1-row block (0x40 bytes contiguous). Each row copies 8 words (0x20 bytes) with a 0x20-byte
  inter-row gap in the source. Packed output is written sequentially to dst. Once all rows are exhausted
  the original width/height are passed to QueueEightWordAlignedGFXTransfer (dst, width, height*0x40) to
  initiate the actual VRAM/OAM DMA. Height is treated as signed for the >= comparisons, so height=0 jumps
  directly to the queue call.
