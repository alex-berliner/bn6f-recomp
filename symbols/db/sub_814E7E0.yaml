name: sub_814E7E0
address: '0x0814E7E0'
kind: function
status: hypothesis
summary: Tiny wrapper that calls sub_814E7C0, writes its byte result to [r1+0x17], and runs a follow-up call (sub_814E7A4)
  only when that result is zero.
interface: unknown /* inputs include r0, r1 (r1 points to a struct whose +0x17 byte field is written) and lr; returns
  via the saved lr in r12; clobbers r0-r3 and flags per the callees */
details: 'Tail-style wrapper rather than a leaf: on entry it parks the return address in r12 (mov r12, lr) so it
  can make further calls and still return directly to its own caller with bx r12, skipping any link-register fixup.
  It first calls sub_814E7C0, which leaves a byte result in r3 and (apparently) a pointer in r1; the wrapper stores
  that byte at [r1+0x17], one byte-sized field of whatever structure r1 points at. If the byte is zero (cmp r3,
  #0 / bne skips it), it makes a second call to sub_814E7A4 — likely some fixup, fallback, or state-refresh path
  taken only when the first call "failed" (result 0). Because the register contract shows nearly everything both
  read and written, the real argument/return set is dominated by whatever sub_814E7C0 and sub_814E7A4 do; this function
  itself only adds the store and the conditional call. Game meaning cannot be pinned down until the two callees
  are identified; the [r1+0x17] byte field is the one concrete structure touch to look for when naming those.

  '
