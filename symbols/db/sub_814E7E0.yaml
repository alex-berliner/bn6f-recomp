open_questions:
- Whether the `strb r3, [r1,#0x17]` is intentional (writing into the AI slot's own version counter) or whether the
  original intent was `[r0,#0x17]` and the disassembly is being misread; semantics are consistent with writing the
  read byte into AIData.Version_17 either way (offset 0x17 maps to AIData.Version_17).
- The exact role of the function (script opcode dispatch vs. simple setter) is unclear from 8 instructions; a wider
  view of caller 0814e36d would settle whether this is part of an AI script byte-stream interpreter.
