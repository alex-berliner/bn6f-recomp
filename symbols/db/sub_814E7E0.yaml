name: sub_814E7E0
address: '0x0814E7E0'
kind: function
previous_names: []
status: hypothesis
summary: Reads one byte from a battle byte stream (via r1) into AIData.Version_17 (r0+0x17), and resets Version_16/charge
  flags via sub_814E7A4 when the byte is 0.
interface: (r0 = AIData*, r1 = byte stream ptr) -> r0 = AIData* ; writes byte to [r0+0x17], conditionally tail-calls
  sub_814E7A4(r1)
details: "- Thumb tail-call thunk: saves lr into r12, bl streamReadNextByte_814E7C0 which returns the next byte\
  \ in r3 (r1 stream advances), then `strb r3, [r1,#0x17]` is odd - the byte is written into the stream struct at\
  \ offset 0x17, not into r0+0x17; this is consistent with the AIData struct placed at the stream object (or the\
  \ offset is meant for the AIData; given the struct has `Version_17` at 0x17, the lifter may be mis-attributing\
  \ r0/r1 - the actual target is the AIData passed via some convention).\n  - If the read byte is 0, falls through\
  \ to `bl battle_aiData_resetVersionAndChargeFlags_814E7A4` which takes r1 (stream/ai-data) and resets Version_16\
  \ and PwrAtk charge flags.\n  - Returns to caller using saved lr in r12 (`bx r12`).\n  - 40 captured calls all\
  \ show r0 = 02010890 (likely an AIData-like object) and r1 pointing to per-AI slots (02007ee8/02007f38/02007f88...),\
  \ with r3 = 0814e7e1 (address+1, Thumb bit set) preloaded, indicating it is invoked via a trampoline at 0814e7e1.\n\
  \  - All captured exits return r0 = 02010890 unchanged; carry flag set on exit (likely from `strb`/`bne`/`bl`\
  \ semantics), suggesting a void-like return in the AI script dispatch path.\n"
