name: get_bg2ScrollXTile
address: '0x0802BA18'
kind: function
status: probable
summary: Small getter returning the chip-preview background's BG2 X scroll converted to tile units plus
  one.
interface: () -> r0 = (RenderInfo->BG2ScrollX >> 3) + 1; no flags meaningful
details: Leaf routine that loads the toolkit pointer from r10, dereferences oToolkit_RenderInfoPtr, reads
  the 16-bit BG2ScrollX field, arithmetic-shifts right by 3 (divide by 8, i.e. pixels to tile column),
  and adds 1 before returning. It takes no arguments and clobbers only r0. Used by the chip-preview task
  code (chip_previewShowSelectedChip and two helpers) to translate the current BG2 horizontal scroll into
  a tile-space coordinate, presumably for positioning the preview screen background.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r0, [r0,#oToolkit_RenderInfoPtr] then ldrh r0,[r0,#oRenderInfo_BG2ScrollX] reads the BG2
    scroll from the toolkit''s render info; asr r0, r0, #3; add r0, #1 converts scroll pixels to tile
    index with +1 offset and returns it; called only from chip_previewShowSelectedChip (chip-preview UI
    task) and its two sibling helpers sub_802B8B0/sub_802B8E0'
