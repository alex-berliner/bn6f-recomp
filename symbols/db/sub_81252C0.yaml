kind: function
status: confirmed
summary: Loads the static and scene-specific background tilemaps into VRAM, blanking target tile-block slots first.
interface: void scene_loadBackgrounds(u32 scene_ptr /*r5*/);
details: "Called with a per-scene state pointer in r5. Procedure:\n1. Calls sub_3005EBA twice to blank 32x32 tile-block\
  \ slots 2 and 3 in VRAM\n   (tileset region 0, block indices 2/3, size 0x1E wide, heights 0x11 and 2),\n   clearing\
  \ stale data before new tilemaps are copied.\n2. Calls CopyBackgroundTiles to paste the fixed (scripted) background\
  \ tilemap\n   from eTextScript201BA20 into tile-block slot 1 (region 0), 0x1E x 0x14 tiles.\n3. Reads [scene_ptr\
  \ + 0x74], subtracts 0x95 to derive the scene-specific tileset\n   index, then calls CopyBackgroundTiles to paste\
  \ the per-scene tilemap from\n   eTextScript201BF20 into tile-block slot 2 at offset (tileset_idx, 2),\n   covering\
  \ 0x5B x 0x11 tiles.\nPreserves r4-r7 (push/pop) so the tile-block indices and sizes survive across\nthe two helper\
  \ calls that clobber them.\n"
