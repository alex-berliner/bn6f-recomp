name: sub_80F0608
address: '0x080F0608'
kind: function
previous_names: []
status: hypothesis
summary: 'Per-frame AI/element-charge tick: charges an element based on the navi''s alliance/team chip held, and
  resolves a Navi custom-bug Z transition for certain battles'
interface: side-effecting on the battle object in r5 and its AIDataPtr/Z; no return value (out only restores r4/r6)
details: "Two logical halves run sequentially when battle is not paused (battle_isPaused -> bne exits).\n\n  HALF\
  \ A — element-charge / chip-bug tick for the navi's currently held chip:\n  1. Read NaviStats byte 0x29 (ElementCharge?)\
  \ via GetBattleNaviStatsByte_AllianceFromBattleObject(r5, 0x29).\n  2. If that byte == 5 (count of distinct chips\
  \ held?), pull the object's alliance team index from battle_getObjectAllianceTeam_800F49E. Skip if 0xFF or below\
  \ the allianceTeams base. Otherwise index into the table at byte_802136D and fall through to apply charge.\n \
  \ 3. Otherwise (initial != 5), re-read the same field with offset 0x2c to get Formation/ChosenElement. Only the\
  \ ==5 or ==0x11 (\"Elec\") cases fall through; everything else bails to half B.\n  4. Use getBattleHandAddr_8010018\
  \ with the object's Alliance byte to find the hand struct for this side, pull current chip slot count, the chip\
  \ id at slot*2+2, and resolve it through getChip8021DA8. Examine chip-property bytes: bit 1 of byte+9 (Element)\
  \ and ==1 at byte+4 (Element type = Fire). Non-Fire/non-matching chips bail.\n  5. Get the charge counter at hand+0x26+slot*2\
  \ (cur charge). If it has already reached 0x64, bail.\n  6. If AIData->PwrAtkButton == 1 (button-B), check PwrAtkCurChargeTime\
  \ against 0x0f; if it has reached that threshold, force PwrAtkCurChargeTime = 0x0a. Then post-increment the halfword\
  \ charge counter at hand+0x26+slot*2 (or set r1=1 path stores +1).\n\n  HALF B — Z-resolve for the battle object\
  \ running custom bug Z-floors:\n  After half A completes, the function ALWAYS proceeds to half B and tail-pops.\n\
  \  1. Read NaviStats byte 0x29 again; if non-zero, return.\n  2. Read NaviStats byte 0x2c. If it equals 0x18,\
  \ set battle object Z = 0x140000 (BattleObject Z value, height 20 panels up).\n  3. Else, look at CurAction (BattleObject+0x9).\
  \ If CurAction == 0x50, return. Otherwise clear object flag-bit 0x80000000 (BUBBLED) mask test and set Z = 0.\n"
