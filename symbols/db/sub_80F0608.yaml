- What NaviStats offsets 0x29 / 0x2c really mean (commented "ElementCharge?" / "ChosenElement?"; constants 5 and
  0x11 are guesses from context, not from documented struct fields)
- The exact role of byte_8021300 / byte_802136D (alliance-team gating table of unknown size)
- Whether the "Bubbled"/Z-resolve path corresponds to a Navi-specific attack like TomahawkMan's "Beast Out" Z-rise
  or a turn-end guard; the captured calls show this fires during story2 sub-battles only
