name: object_blinkPanelHighlight
address: '0x08112D84'
kind: function
status: probable
summary: 'Blinking panel highlight: increments a halfword counter at object+0x12 and, when bit 2 is clear,
  calls object_highlightPanel with the panel coordinates stored at object+0x16 (x) and object+0x17 (y).'
interface: (r0 unused incoming; r7 = object pointer) -> r0 = panel flag byte value from highlightPanel;
  flags from tst/bl
details: 'Increments the halfword counter at object+0x12 each call. When (counter & 4) == 0 it loads the
  panel coordinates from object+0x16 (x) and object+0x17 (y) and calls object_highlightPanel to set that
  panel''s highlight flag byte to 1; when bit 2 is set it returns without highlighting. This yields a
  blinking highlight: 4 consecutive calls highlight, the next 4 do nothing. r7 is used without being set
  in this function, so the caller must provide the object pointer in r7 (or the compiler kept it live
  from earlier code). The counter is never reset here, so it free-runs mod 65536.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r7,#0x12]; add #1; strh — free-running counter in object struct; mov r1,#4; tst r0,r1;
    bne skip — highlight gated on (counter&4)==0, a 4-on/4-off blink; ldrb r0,[r7,#0x16]; ldrb r1,[r7,#0x17];
    bl object_highlightPanel — panel coords from object fields passed to known highlight callee'
  refs:
  - bn6f/asm/asm32.s:10226
  - 0x0800CBD8 object_highlightPanel
  reproduce: python3 tools/asmcat.py 0x08112D84
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and behavior are accurate: the halfword at +0x12 is incremented, masked with 4, and
    when zero, highlightPanel is called with x at +0x16 and y at +0x17 (loaded as ldrb, not ldrh as summarized).
    The proposed name ''object_periodicPanelHighlight'' is fine but ''object_blinkPanelHighlight'' more
    directly conveys the on/off blinking semantics. Also, r7 is read but never set within the function,
    so caller must provide it, which is correctly noted.; run wf investigate investigate-20261019-015108;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- No callers known, so the object struct fields 0x12/0x16/0x17 semantics and when this runs (per-frame
  tick?) are inferred, not confirmed
- Whether the counter is shared with other behaviors of the same object is unknown
