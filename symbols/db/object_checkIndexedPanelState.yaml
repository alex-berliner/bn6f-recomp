    run wf investigate investigate-20261019-022109'
open_questions:
- object_checkPanelParameters appears to need mask arguments but only two values are passed, so whether
  r2/r3 hold stale-but-valid masks or the callee takes only (x,y) is unclear
- which structure r5 is (entity? custom-window state?) and what field 0x16 counts; a caller would disambiguate
  and reveal what the two coordinate sets select between
