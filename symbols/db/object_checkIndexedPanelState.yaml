name: object_checkIndexedPanelState
address: '0x080FAAAC'
kind: function
status: probable
summary: Uses a value in an entity's 0x16 field to pick a (x,y) pair from a small table and reports whether
  that battle-field panel matches the required panel-flag state.
interface: (r5 = entity/work struct, reads [r5+0x16]) -> r0 = 1 if panel state matches, 0 otherwise
details: 'Loads a byte at [r5+0x16], doubles it as an index into byte_80FAAD0, and fetches a two-byte
  entry (table: {1,2} and {6,2}, which read like panel x,y coordinates within the 6x3 battle field). It
  pushes those two bytes as r0/r1 and calls object_checkPanelParameters, which tests the panel at those
  coordinates against a required flag mask. Returns the checker''s 1/0 result unchanged if nonzero, otherwise
  forces 0. The r5 object and field 0x16 are not otherwise identified here; no caller is known, so how
  the index is set and which mask state is required remain unstated.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#0x16]; lsl r0,#1; ldr r1,off_80FAACC — table lookup indexed by the struct field;
    byte_80FAAD0: 0x1,0x2,0x6,0x2 — two 2-byte entries fitting battle-field (x,y) coordinates; bl object_checkPanelParameters;
    tst r0,r0 — result comes straight from the panel-flag checker; bne locret / mov r0,#0 — returns the
    check''s verdict, normalizing false to 0'
  refs:
  - bn6f/asm/asm31.s:144376
  - 0x0800CC86 object_checkPanelParameters
  reproduce: python3 tools/asmcat.py 0x080FAAAC
