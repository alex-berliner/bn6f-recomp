name: battleObject_beastOutUpdate_80C5654
address: '0x080C5654'
kind: function
status: confirmed
summary: 'Per-frame update for a battle object (toss/bomb-fuse style): refreshes its collision data, dispatches
  the current action''s handler, and destroys the object with an effect when the battle is over.'
interface: battleObject_beastOutUpdate_80C5654(r4, r5=obj, r7, r8, r10) -> r5=obj, r8; clobbers r0-r4,r6,r7,lr and
  NZCV
details: "Battle-object update step (r5 = battle object). Sequence:\n1. object_removeCollisionData drops last frame's\
  \ collision region data, then\n   object_spawnCollisionEffect spawns the hit flash effect for the object.\n2.\
  \ If battle_isBattleOver() is nonzero, the object is torn down: three effect\n   parameters are copied from obj+0x34..0x3C\
  \ into r1-r3 (r4 = 0x14, effect\n   type parameter) and spawn_t1_0x0_EffectObject spawns a destruction effect;\n\
  \   the \"active\" bit (bit 1) of oObjectHeader_Flags is cleared;\n   object_clearCollisionRegion frees the collision\
  \ region; and the object's\n   combined state/action/phase word (oBattleObject_CurStateActionPhaseAndPhaseInitialized)\n\
  \   is set to CUR_STATE_DESTROY.\n3. Otherwise, if battle_isTimeStop() reports Z=0 (time stopped), the object's\n\
  \   action handler is skipped this frame and only object_presentCollisionData runs.\n4. While time runs: if the\
  \ collision data at oBattleObject_CollisionDataPtr has a\n   nonzero oCollisionData_FlagsFromCollision, object_clearCollisionRegion\
  \ is called\n   before the update; then the per-action handler is dispatched via the jump table\n   at off_80C56AC\
  \ indexed by oBattleObject_CurAction:\n   entry 0 = battleObject_tossUpdate_80C56B4, entry 1 = object_bombFuseUpdate.\n\
  \   Handlers are entered with the mov lr,pc; bx r1 idiom (r0 = CurAction,\n   r1 = own jump-table entry) and return\
  \ r1/r5/r8, which are passed straight to\n   object_presentCollisionData to publish this frame's collision region.\n\
  Callers pass r4/r5/r7/r8/r10; r5 (object) and r8 (collision work pointer) are the\nmeaningful results handed back.\
  \ The two jump-table targets suggest this shared\nupdate serves a tossed object whose actions are \"toss\" and\
  \ \"bomb fuse\".\n"
