name: sub_8047800
address: '0x08047800'
kind: function
status: confirmed
summary: Redraws the two background layers (tile graphics + tile map) for the area whose id is stored in the background
  state struct.
interface: void sub_8047800(void *state /* r5 */) ; clobbers r0-r3, r12(?), flags; preserves r4-r7 per the ABI,
  callers supply state in r5
details: "Takes a background state struct in r5 and reads the area id from byte at state+8.\nThe id is an index\
  \ into an area table that starts at 0x15, so the function subtracts\n0x15 to get the local index. Two calls to\
  \ CopyBackgroundTiles:\n  1. Layer 1: copies 0x15 x 0xC tile ids from the shared table eTileIds2018A04 into\n\
  \     tile block 2 at offset (j=0, i=areaId-0x15) — the tile graphics source table.\n  2. Layer 2: copies 0x12\
  \ x 0xA tile ids from byte_202F800 into tile block 0 at\n     offset (j=1, i=(areaId-0x15)+2) — the tile map layer;\
  \ note its index is the\n     graphics index plus 2, and the byte at state+8 is re-read rather than reused.\n\
  r5 is reloaded into r7 around each call, and r4-r7 are preserved across the whole\nfunction. Purely a helper that\
  \ composes two CopyBackgroundTiles calls for one area.\n"
