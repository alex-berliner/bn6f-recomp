name: sub_8120348
address: '0x08120348'
kind: function
status: confirmed
summary: Fills two spans of a tilemap with the blank text-box tile ((palette<<12)|0x200), then hands the leftover
  run to a continuation filler.
interface: void sub_8120348(u32 passthrough, u16 *tilemapDest, u32 palette, s32 runLength, s32 secondRunOffset /*
  in r4 */) — all registers r0-r7 preserved except that the two helper calls are invoked; contract lists r7 as an
  output because callers rely on it surviving unchanged.
details: 'Builds the halfword (palette << 12) | 0x200 — tile 0x200 is the blank text-box tile, so the palette argument
  just recolors it. Writes that value to two parallel runs of the BG tilemap: runLength (r3) halfwords starting
  at tilemapDest (r1), and the same count starting at tilemapDest + 2*secondRunOffset (r1 + 2*r4). This is the classic
  two-halves-of-a-row layout of a text window that wraps around the tilemap. The loop is a do/while (sub/bgt), so
  even a count of 0 or negative still writes one halfword per run. After the loop it calls sub_804A24C with r0 passthrough,
  r1 = fill value, r2/r3 = the two end cursors, r4 = the (normally 0) remaining counter, r6 = 0; then calls sub_81202B4
  with r1 as left by that call, r2/r3 = end cursors, r4 = fill value, r5 = (r4_input - r3_input) remaining length,
  r6 = 0 — i.e. the continuation filler keeps painting the same blank tile from where the inline loop stopped. Stack
  slots: [sp]=fill value, [sp+4]=remaining, [sp+8]=original dest, [sp+0xC]=second-run cursor, [sp+0x10]=saved r3.
  Contains a dead pool literal .word byte_20065C0 (unused leftover), and off_812038C is a literal pool holding 0x200.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
