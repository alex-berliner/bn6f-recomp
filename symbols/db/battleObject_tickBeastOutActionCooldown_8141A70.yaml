summary: Ticks and gates a BattleObject's "Beast Out" Power-Atk-charge state machine (cooldown/charge
  timer and rearm logic)
interface: (r5 = BattleObject*) -> (none returned; flags may_write); side effects on the object's fields
details: "- Entry reads `r5->Unk_0d` (object[0x0d]); if non-zero the function returns immediately\n  \
  \  (`ldrb r0,[r5,#0xd] ; tst r0,r0 ; bne locret_8141AA6`), so 0x0d is an \"in Beast Out?\" guard bit.\n\
  \  - When not in Beast Out, it clears `Unk_0x13` (`strb r0,[r5,#0x13]`, r0=0), clears `Unk_0x17`,\n\
  \    and parks a soft timer of 0x1E in `Unk_0c` (`mov r0,#0x1e ; strb r0,[r5,#0xc]`).\n  - Decrements\
  \ `Unk_0b` by one (`ldrb r0,[r5,#0xb] ; sub r0,#1 ; strb r0,[r5,#0xb]`); if still >0 it returns.\n \
  \ - Otherwise, while `Unk_0x11` is non-negative (`blt loc_8141A92`) it is decremented; this matches\n\
  \    the AIData field `BeastOutAPwrAtk` (loc=0x11), i.e. the A-button Power-Atk charge-timer slot\n\
  \    the beast transformation reuses.\n  - `Unk_0x10` is incremented and capped against 0x50 (`cmp r0,#0x50\
  \ ; bgt loc_8141AA2`); if it\n    overflows, `Unk_0x11` is cleared to 0. While still under the cap,\
  \ `Unk_0xb` is reset to 2\n    (so the next decrement fires two frames later) and the function returns.\n\
  \  - Net effect: a frame-by-frame \"charge\" tick that fills a small byte counter up to 0x50 while\n\
  \    counting down a parallel charge-timer, only enabled while the actor is in Beast Out form\n    (object[0x0d]==0).\
  \ Field map in this object: 0x0d gate, 0x0c fixed delay (0x1E),\n    0x0b sub-tick (set to 2 between\
  \ bursts), 0x10 charge counter capped at 0x50,\n    0x11 charge-timer (matches `AIData.BeastOutAPwrAtk`),\
  \ 0x13/0x17 cleared state scratch.\n  - Has no callees, no out-registers beyond NZCV (caller restores\
  \ r4-r7).\n"
