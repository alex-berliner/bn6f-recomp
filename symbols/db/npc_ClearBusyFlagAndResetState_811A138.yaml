name: npc_ClearBusyFlagAndResetState_811A138
address: '0x0811A138'
kind: function
status: confirmed
summary: Clears bit 1 of an object's status byte and resets its byte at offset 9 to 0xC, likely ending a busy/waiting
  state and restarting its state timer.
interface: void sub_811A138(void *obj /* r5 */); // returns r0=0xC, r1=2, NZ flags from "mov r0,#0xC"
details: 'Takes a single object pointer in r5 (callers always pass a state/npc object base). Reads the byte at [r5]
  (status/flags byte), clears bit 1 (mask 0x2), and writes it back; then stores 0xC into the byte at [r5,#9], which
  in this object layout looks like a state/timer/counter field being reset to a fixed value (0xC). No other fields
  or external memory are touched. Quirk: the function leaves r0=0xC and r1=2 in the registers and sets the NZ flags
  from r0, but the verified callers do not appear to use these values — it is effectively a void function whose
  tail register state is incidental. r5 is not saved; callers must already hold the object pointer there.

  '
