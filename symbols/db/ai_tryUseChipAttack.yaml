name: ai_tryUseChipAttack
address: '0x0800FC30'
kind: function
status: probable
summary: 'AI-side check-and-fire: validates the object''s state and held chip, then triggers the object''s
  chip attack and reports chip ID/damage/boost, or 0xFFFF if the attack is not allowed.'
interface: (r5 = battle object ptr) -> r0 = chip ID (or 0xFFFF on refusal); r1/r2 also loaded with Damage/AttackBoost
  on success; flags from final ldrh
details: Queries the object's state via getBattleObjectStateInfo_800EDD0(obj, 0); 0xFFFF and states 0x52/0x53
  abort with 0xFFFF. Otherwise the state value is used as a chip ID into getChip8021DA8, and bit 0 of
  chip data byte 9 blocks the attack (also returning 0xFFFF). On the allowed path it takes the object's
  AI struct at AIDataPtr+0xA0, calls useChipRelated_80127C0(0), bails if it returns byte_800FCD5, then
  calls object_setAttack2 and sets oAIAttackVars_PwrAtkState = 1. It finishes by loading oAIAttackVars_ChipID/Damage/AttackBoost
  into r0-r2, which look like intended return values (odd, since they are not consumed before pop — possibly
  tail-shared code with the next function).
