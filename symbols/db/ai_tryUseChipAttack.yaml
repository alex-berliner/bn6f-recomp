open_questions:
- What do states 0x52 and 0x53 represent (idle? stunned? a specific non-chip action)?
- The tail loads Damage and AttackBoost into r1/r2 but does not use them before the return; are they read by a subsequent
  instruction at the call site?
- The comparison against off_800FCB8 (= byte_800FCD5) looks like a pointer-vs-value mismatch; confirm the intended
  sentinel semantics.
- Does r7 (the saved AI-vars base) persist for the caller, or is it purely local?
