name: ai_tryUseChipAttack
address: '0x0800FC30'
kind: function
status: confirmed
summary: AI routine that attempts to have a net navi use a chip attack during its action selection
interface: ai_tryUseChipAttack(r4, r5=battleObject, r6, r7, r8, r9, r10, r11, r12) -> r0=chipID|0xFFFF, r4..r12
  updated
details: 'Queries the battle object''s current action state via getBattleObjectStateInfo_800EDD0(r5, 0). Rejects
  if the state is 0xFFFF (no valid action), 0x52, or 0x53 (special non-attack states). Fetches ChipData via getChip8021DA8
  and rejects if byte[9] bit 0 is set (chip not usable). Loads the AI attack-variables block at offset 0xA0 from
  the battle object''s AIDataPtr field. Calls useChipRelated_80127C0(0, …) to select and begin the chip; bails on
  the failure sentinel at byte_800FCD5. On success, configures the attack via object_setAttack2, writes 1 into oAIAttackVars_PwrAtkState,
  then reads oAIAttackVars_ChipID, oAIAttackVars_Damage, and oAIAttackVars_AttackBoost from the AI vars block (the
  latter two are loaded into r1/r2 at the tail but the function returns only r0=chipID to the caller).

  '
