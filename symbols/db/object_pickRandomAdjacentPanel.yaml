name: object_pickRandomAdjacentPanel
address: '0x080F811A'
kind: function
status: confirmed
summary: Randomly selects a valid panel adjacent to a battle object, preferring off-row neighbours over same-row
  ones.
interface: 'object_pickRandomAdjacentPanel(u8 descriptor, u32 checkP2, u32 checkP3, u8 obj) -> (r0: u8 panelColumn,
  r1: u8 panelRow)'
details: "Iterates the four cardinal neighbours (down, up, left, right via a 2-byte signed (dx,dy) lookup table\
  \ at 0x80F81B8) of the battle object whose panel coordinates live at oBattleObject_PanelX/Y (r5). Each candidate\
  \ column/row is validated by object_checkPanelParameters(col, row, r2, r3).\nValid panels are packed into a byte\
  \ as (row<<4 | col) and sorted into two on-stack lists (frame offsets 0x0C and 0x10):\n  * off-row list – neighbour\
  \ row ≠ descriptor byte 0x13 (the object's own row)\n  * same-row list – neighbour row == own row\nSelection priority:\
  \ if the off-row list is non-empty, draw uniformly from it via GetPositiveSignedRNG + swi 6 (modulo); otherwise\
  \ draw from the same-row list. If both are empty, returns column 0 and leaves row at the last-tested value (a\
  \ quirk callers must tolerate).\nOn a successful pick, unpacks the byte: r0 = low nibble (column, extracted with\
  \ lsl #0x1d / lsr #0x1d to mask to 4 bits… actually it's the full low byte minus the shifted row), r1 = high nibble\
  \ (row).\nStack frame is 0x14 bytes; r0, r2, r3 saved at offsets 0x00/0x04/0x08; candidate bytes at 0x0C–0x0F\
  \ (off-row) and 0x10–0x13 (same-row). r4 (loop index), r6, r7 are pushed/popped and preserved.\n"
