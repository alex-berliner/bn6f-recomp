open_questions:
- When no adjacent panel is valid the return is (0, last-row-tested); do callers treat r0==0 as 'no move available'
  or could column 0 be a legitimate panel?
- The packed byte uses row in the high nibble, limiting row to 0–15; confirm the battle grid never exceeds 15 rows.
- Why is the off-row list preferred? Likely to encourage movement across rows (vertical repositioning) while still
  allowing lateral steps.
