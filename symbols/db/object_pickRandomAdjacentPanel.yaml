name: object_pickRandomAdjacentPanel
address: '0x080F811A'
kind: function
status: probable
summary: Picks a random panel adjacent to a battle object's current panel that matches a required/forbidden
  panel-flag mask, preferring neighbors not in the row stored at object+0x13; returns 0 in r0 if no neighbors
  match.
interface: (r0 = battle object ptr (r5 preserved input too), r2 = panel flag mask to require, r3 = panel
  flag mask to forbid) -> r0 = chosen panel x (low 3 bits, 0 if none), r1 = chosen panel y (high nibble
  of the packed byte)
details: 'Iterates the four cardinal offsets in the table at 0x80F81B8 ((0,+1),(0,-1),(-1,0),(+1,0)) added
  to the object''s PanelX/PanelY, calling object_checkPanelParameters on each neighbor with the caller''s
  flag masks. Each hit is packed as (y<<4)|x into one of two on-stack buffers: sp+0xC when the neighbor''s
  y differs from byte [obj+0x13] (preferred), sp+0x10 when it matches (fallback). If any preferred hits
  exist it picks one with GetPositiveSignedRNG divided by the count (SWI 6 Div remainder), else falls
  back to the same-row buffer, else returns r0=0 (with r1 left stale). The chosen byte is unpacked to
  x = value & 7 in r0 and y = value >> 4 in r1. Note the returned x is truncated to 3 bits, so this only
  works for x <= 7.'
