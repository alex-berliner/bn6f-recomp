    neighbors are collected; cmp r1, [r2,#0x13] splits matches into preferred (sp+0xC, count r6) vs same-row
    (sp+0x10, count r7) buffers, stored as strb (y<<4)|x; bl GetPositiveSignedRNG; svc 6 (Div) uses remainder
    r1 to index the non-empty buffer, then lsr #4 / lsl 0x1d unpack y and x; byte_80F81B8: 0,1, 0,-1,
    -1,0, 1,0 — exactly the four cardinal neighbor offsets'
