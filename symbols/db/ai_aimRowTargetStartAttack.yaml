name: ai_aimRowTargetStartAttack
address: '0x0811072C'
kind: function
status: confirmed
summary: AI attack aiming step — locks onto the closest enemy on the AI's own row directly in front of it and starts
  the attack script (script 8), otherwise resets the timer and falls back to attack 0.
interface: void ai_aimRowTargetStartAttack(BattleObject* r5 obj, AIState* r6 aiState, AIAttackVars* r7 attackVars);
  returns r1 left by the final state-change call, r5 preserved
details: 'r5 = battle object, r6 = AI state block, r7 = AI attack vars (all three preserved). Finds the closest
  battle object on the opposite alliance (battleObject_findClosestEnemyBattleObject_80103F8 with alliance^1). The
  candidate must pass three checks or the routine bails: alive (halfword at +0x24 nonzero), same row (target PanelY
  at +0x13 == obj PanelY), and in front of the AI (object_getFrontDirection(obj) * (targetPanelX +0x12 - objPanelX)
  > 0, signed 32-bit). If a target passes, it is stored in attackVars->TargetObjectPtr, but the lock is aborted
  if FindBattleActorsWithNonzeroParam_ReturnCountAndSum(0x6C, 0x67, 0x6C, obj) returns a nonzero count (another
  actor already matching the 0x6C/0x67 param criteria). On success: sets obj->ExtraVars+0xC = 1 (locked-on flag),
  calls sub_8110D18(obj), copies the target''s panel X/Y (+0x12/+0x13) into obj +0x80/+0x81, sets aiState->ScriptId
  = 8 and aiState->SubState = 0, and commits via object_exitAttackState_801171C. On any failure (shared bail-out
  path): reloads attackVars->AttackDuration into StepTimer and switches to attack 0 with value 9 via object_setAttack0.
  Note the assembly computes (targetX - ourX) but the product uses the value in r2 before the mul (sub r2, r3, r2;
  mul r1, r2 — r1=facing, r2=xDiff), matching the C.

  '
