name: ai_aimRowTargetStartAttack
address: '0x0811072C'
kind: function
status: probable
summary: 'AI attack step: lock the closest enemy standing on this object''s row ahead of it, copy its
  coords, and switch the AI to attack script 8; otherwise advance to attack step 9.'
interface: '(r0-r4 = AI attack context: r5 = BattleObject, r6 = AIState, r7 = AIAttackVars) -> r0 = 1
  if a target was locked, else 0; on success AIState_ScriptId = 8, SubState = 0, target X/Y stored at
  r5+0x80/0x81, ExtraVars+0xC = 1; on failure AIAttackVars_StepTimer = AttackDuration and setAttack0(9).'
details: This is one step of a battle AI attack routine. It searches with alliance flipped (r5's Alliance
  XOR 1) for the closest enemy object, requires it to be alive (field 0x24 != 0) and on the same panel
  row as r5 (enemy 0x13 == r5.PanelY). It then computes (enemyX - selfX) * frontDirection and aborts unless
  positive, i.e. the enemy must be in front. The target pointer is saved in AIAttackVars_TargetObjectPtr;
  if FindBattleActorsWithNonzeroParam(0x6c, 0x67, 0x6c) reports none (path clear of some actor type),
  it sets a 'target locked' flag at r5.ExtraVars+0xC, calls sub_8110D18 (unknown, likely pre-attack setup),
  copies the target's panel X/Y into r5+0x80/0x81, and switches the AI state to script 8, substate 0,
  tearing down the current attack via object_exitAttackState. If any check fails, it reloads the attack
  duration into the step timer and calls object_setAttack0(9), moving to the next attack step.
