name: battle_aiAttackFormationTick_80F7FC2
address: '0x080F7FC2'
kind: function
status: confirmed
summary: 'One tick of the AI attack formation-to-hit timer: first call sets up the attack formation and
  computes a step-count duration; subsequent calls decrement that counter and, once it expires, transition
  the attack into its hit phase.'
interface: battle_aiAttackFormationTick_80F7FC2(r5 /*battleObject*/, r7 /*aiAttackVars*/, r1 /*pass-through*/)
  -> r1, r5; r4 r5 r6 r7 preserved; clobbers r0 r2 r3 lr NZCV
details: 'Branches on aiAttackVars.AttackElement (u8). If 0 (initialization pass): writes AttackElement
  = 4 to mark the attack active, reads battleObject.PanelX/PanelY and aiAttackVars.InitFlag, looks up
  aiAttackVars.AiDifficultyTier in a 32-bit table at 0x080F8010 (entry byte at offset tier), packs tier|lookup<<16|boost2<<8
  into r4 and boost2<<8 into r3, passes damage (aiAttackVars.Damage, u32) in r6, then calls sub_80C92CC
  to place/scale the attack formation. Computes StepTimer (u16) as 4*lookup[tier]*AttackBoost2 + lookup[tier]
  and stores it. Returns without touching r1. If AttackElement is already non-zero (timer pass): decrements
  StepTimer (u16) using 32-bit arithmetic with sign compare; when the result is <= 0, writes HitElement
  (u16) = 0x14 to signal the hit phase. r1 is passed through untouched in both branches. The table at
  0x080F8010 is read byte-per-tier-index and currently holds the dword 0x0C0E1012 (tiers 0–3 map to 0x12,
  0x10, 0x0E, 0x0C).

  '
