name: sprite_setCoordinatesIfActive
address: '0x0811AE5C'
kind: function
status: probable
summary: Sets a sprite's x/y coordinates only if the struct-array entry selected by an index is currently
  in use.
interface: (r0 = sprite/object for sprite_setCoordinates, r1 = its second arg, r2 = index into eStructArr2008450)
  -> r0 = from sprite_setCoordinates; flags from getStructFrom2008450's byte
details: Saves r0/r1 on the stack, then calls getStructFrom2008450 with r2 to read the in-use/status byte
  of the indexed 0x58-byte entry. If that byte is zero the function returns immediately; otherwise it
  keeps the returned struct pointer in r5 (unused afterward) and tail-calls sprite_setCoordinates with
  the original r0/r1 to write the object's x/y in the sprite sub-entry chosen by the resource's byte-2
  high nibble. Essentially a guarded wrapper around sprite_setCoordinates keyed on slot activity. The
  saved r5 value and the caller context (gui_initSpriteWithPosition) suggest coordinates are set for an
  active GUI sprite slot only.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl getStructFrom2008450 with r2 = index; beq loc_811AE76 skips when the entry''s status byte
    is zero; on nonzero entry: ldr r0/[sp], ldr r1/[sp] then bl sprite_setCoordinates, so r0/r1 are forwarded
    untouched; sole non-trivial callees are the slot-status getter and the coordinate setter, defining
    the whole behavior; caller gui_initSpriteWithPosition places GUI sprite 0x68 at a table-chosen x,y,
    matching a guarded position set'
