name: ow_dispatchObjectHandler_80A77A8
address: '0x080A77A8'
kind: function
status: confirmed
summary: Tail-dispatches an overworld object's per-type routine (setup sprite / type handler / free map
  object) based on the type byte at object+8.
interface: void sub_80A77A8(u32 object /* r5 */); outputs r2-r5 and r8-r12 as returned by the dispatched
  handler; flags clobbered
details: 'Takes an object pointer in r5, loads the type byte from object+8 (ldrb [r5,#8]), and indexes
  the jump table at off_80A77BC with it, then performs a computed call via `mov lr, pc; bx r0` (Thumb,
  so +1 offsets on each entry). The three entries are "sprite_setupObjectSprite+1", "sub_80A77FC+1", and
  "ow_freeMapObject+1", i.e. the dispatch appears to handle per-type object setup/teardown for overworld
  map objects. Each handler is entered with r0 = the table base address (off_80A77BC) and r1 = the type
  byte, which is an artifact of the dispatch idiom, not the object pointer. Because the call goes through
  the real register file, whatever the handler leaves in r2-r5 and r8-r12 flows straight back to this
  function''s caller; r5 is also listed as an output, meaning at least one handler overwrites it. This
  looks like a helper used by object lifecycle code rather than a per-frame update.

  '
