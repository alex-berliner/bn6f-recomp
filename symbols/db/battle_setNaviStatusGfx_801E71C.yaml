open_questions:
- The semantic meaning of byte 0x12 in eStruct2035280 — the struct definition lists it as `Unk_12` (next
- to `Unk_13`) and the named `NaviStatusGfxIdx` is actually at 0x17. Settling whether 0x12 is the "index
- used by the status GFX slot", a sub-index, or an animation-related byte requires tracing readers of
- byte_2035292 in the consumer functions.
- Whether the r0 argument is the GFX index directly, or an enum the consumer translates before calling,
- is not deducible from this function alone.
