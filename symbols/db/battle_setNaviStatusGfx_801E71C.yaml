summary: Writes a one-byte value into oStruct2035280 + 0x12 (the Navi status GFX index slot) and returns
  the input untouched.
interface: '(r0 = new GFX index byte, lr = return) -> r0 = unchanged ; side effect: strb r0 to (off_801E77C
  + 0x12) [byte_2035292]'
details: "- Single instruction in the body: `strb r0, [r1, #0x12]` where r1 = `off_801E77C` = &eStruct2035280\n\
  \    (the project symbol resolves this to 0x02035280, so the write target is 0x02035292 = byte_2035292).\n\
  \  - The struct comment hints `NaviStatusGfxIdx` lives at offset 0x17 in eStruct2035280, but the assembly\n\
  \    clearly writes to offset 0x12 (one of the `Unk_12`/`Unk_13` bytes), so this is NOT updating that\
  \ field\n    — likely an \"index into the navi status GFX palette/animation slot\" or a sibling control\
  \ byte. The 0x17\n    field is named by `RetrieveAndRenderEnemyVirusNamesInBattle_801E574`, while 0x12\
  \ is unnamed, so the\n    name should not over-commit.\n  - `push {r1, lr}` / `pop {r1, pc}` is the\
  \ common Thumb one-instruction tail-call form: r1 is saved only\n    because the function immediately\
  \ overwrites it with the global pointer, and lr is rewritten to pc on\n    return so the caller's lr\
  \ stays live. No actual outgoing r1 is preserved for the caller; the contract's\n    `may_write=['r1']`\
  \ reflects that.\n  - r0 is untouched: every captured call exits with r0 equal to the entry value (0x00,\
  \ 0x0c, 0x78, 0x6c,\n    0x60, 0x54 in the samples), and the body never reads from or writes to r0.\n\
  \  - The captured-call r0 values are small (< 0x80), consistent with a GFX/index code passed in by the\n\
  \    Custom Gauge / scroll strip machinery (e.g., the selected Navi icon or a status-gfx enum).\n  -\
  \ The `off_801E77C` constant in the disassembly is resolved to `eStruct2035280` by the project; the\n\
  \    computed address 0x02035280 + 0x12 = 0x02035292, which the source labels `byte_2035292`.\n"
