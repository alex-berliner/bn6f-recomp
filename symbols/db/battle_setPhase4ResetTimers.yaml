name: battle_setPhase4ResetTimers
address: '0x080BE8A0'
kind: function
status: probable
summary: resets a battle object's two timers and advances it to phase 4
interface: (r5 = battle object, set by caller) -> r0 = 0; no flags meaningful
details: 'Treats r5 as a battle object: zeroes oBattleObject_Timer and oBattleObject_Timer2 as halfwords,
  then stores 4 into oBattleObject_CurPhaseAndPhaseInitialized, which both selects phase 4 and marks the
  phase as initialized. It is a pure state-transition helper with no other reads or writes, so everything
  it does is the phase change plus timer reset.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strh r0,[r5,#oBattleObject_Timer] / [Timer2] with r0=0 clears both timers; mov r0,#4; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    sets the phase field to 4; no other memory access in the function, so its only effect is these three
    field writes
  refs:
  - bn6f/asm/asm31.s:14363
  reproduce: python3 tools/asmcat.py 0x080BE8A0
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-045129'
open_questions:
- no callers are known, so what battle object r5 points to and when phase 4 is entered is unverified
- the exact encoding of oBattleObject_CurPhaseAndPhaseInitialized (phase bits vs initialized flag) needs
  confirmation from phase-dispatch code
- whether callers expect a particular return value in r0 (it returns 0)
