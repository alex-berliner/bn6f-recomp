name: ai_waitAttackDuration
address: '0x080FA18A'
kind: function
status: probable
summary: 'AI attack state: runs the current attack for AttackDuration frames, then exits the attack state'
interface: (uses r7 = oAIAttackVars, r5 = battle object) -> void; no meaningful return value
details: 'Entry-phase handler keyed on oAIAttackVars_AttackElement: if it is 0, the attack hasn''t started,
  so it stores 4 into AttackElement (likely a neutral/none element marker), zeroes oBattleObject_CurAnim
  (switch to idle/attack anim 0), and copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer.
  On every later call it decrements StepTimer; when it reaches 0 it calls object_exitAttackState to return
  the object to normal AI control. Quirk: the decrement happens before the bgt, so the attack lasts exactly
  AttackDuration ticks; an AttackDuration of 0 underflows harmlessly only on that path because bgt exits
  for positives but a pre-existing 0 would fall through — callers presumably always set a positive duration.'
