- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/tst on [r7,#oAIAttackVars_AttackElement] branches between one-time init and per-frame
    tick; init stores #4 into AttackElement and #0 into [r5,#oBattleObject_CurAnim]; ldrh AttackDuration
    -> strh StepTimer copies the configured length into the countdown; decrement + bgt loop on StepTimer,
    then bl object_exitAttackState ends the attack'
