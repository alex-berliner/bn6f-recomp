summary: 'Scene step: handles joypad cursor input for the menu (gated by state checks) then runs a fixed tail of
  scene/anim updates and palette/OBJ bank setups.'
interface: void sub_8133944(void);  /* uses toolkit via R10, menu state object via R5; no explicit returns; clobbers
  r0-r3,r9-r12,lr; flags NZCV clobbered; preserves r4-r8,r10 */
details: "Conditional cursor-input block:\n  - sub_8133C0C / sub_81347A4 gate the input pass; both must return zero\
  \ (state matches) to take it.\n  - When taken, reads Toolkit.JoypadPtr->LowSensitivityHeld and feeds it with mask\
  \ 7 / step 1 to menu_moveCursorUpDown_811FA22 along with the cursor word at state+0x34; result stored back to\
  \ state+0x34.\n  - Followed by sub_813471C / sub_8134740 (likely cursor clamping and commit/redraw).\n\nAlways-run\
  \ tail (regardless of the gate):\n  - sub_8134594, sub_81345B0, sub_8134538, sub_8134548, sub_81341A0, sub_8134310,\
  \ sub_81353DC.\n  - Then two calls to sub_81353F0 with (slot=5, bank=0) and (slot=6, bank=1), i.e. low-bank palette/OBJ\
  \ setup for slot 5 and high-bank for slot 6 — typical of a menu/scene with two sprite layers or BG banks.\n\n\
  Register convention: scene toolkit pointer arrives in r10, per-scene menu state struct in r5 (cursor index at\
  \ offset 0x34, a u16). The function is a per-frame \"tick\" of a menu/scene whose state machine is owned by the\
  \ called helpers.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
