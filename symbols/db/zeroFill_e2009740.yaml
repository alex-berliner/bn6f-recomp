name: zeroFill_e2009740
address: '0x08001820'
kind: function
status: confirmed
summary: Zero-fills the 8-byte scratch struct at toolkit->Unk2009740 before it is reused.
interface: void clearToolkitUnk2009740(void) — takes the toolkit pointer in r10 (custom convention), preserves r3;
  clobbers r0-r2 and flags
details: Loads the toolkit base pointer from r10 (the caller is expected to have set r10 to the toolkit struct),
  then reads the field at offset oToolkit_Unk2009740_Ptr, which is a pointer to an 8-byte scratch/work struct (the
  "Unk2009740" area). It calls ZeroFillByWord with that pointer and size 8 bytes, clearing the whole struct to zero.
  Nothing else is touched; r3 passes through unchanged per the caller analysis. Likely a reset of per-frame or per-use
  scratch state so stale values from a previous user of the struct are not seen.
