name: sub_8049DDC
address: '0x08049DDC'
kind: function
status: confirmed
summary: Zeroes the 0x1B0-byte work block at eS200A290, advances the toolkit's main jumptable to state 0x4C, and
  seeds the block's +0x22/+0x24/+0x26 fields.
interface: void sub_8049DDC(u16 fieldValue /* r0 */, struct Toolkit *toolkit /* r10 */); preserves r2-r7; clobbers
  r0, r1, lr, NZCV
details: "Targets the global/eS200A290 scratch/control block (size 0x1B0), clearing it via ZeroFillByWord.\nThen\
  \ writes a new state index (0x4C) into the toolkit's main jumptable selector\n(toolkit->oToolkit_MainJumptableIndexPtr,\
  \ a single byte), which effectively hands off\nthe next update tick to whatever handler is registered for state\
  \ 0x4C.\nSeeds the block with:\n  * +0x22 (u16) = caller-supplied value (r0)\n  * +0x24 (u16) = 8\n  * +0x26 (u16)\
  \ = 1\nUsed as a \"switch-to-state-0x4C with this parameter\" trampoline. The chosen state (0x4C)\nand the seed\
  \ values (8 and 1) strongly suggest this is the entry that hands control\nto the Link/Turn/result screen flow\
  \ (Link battle / link-nav screen transition) where\nstate 0x4C corresponds to a known link-battle sub-state in\
  \ BN6, but the exact\nmeaning of +0x24=8 and +0x26=1 is not yet tied to a named field.\nPreserves r5 (the block\
  \ pointer) for the caller, matching the push/pop.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
