name: sub_8049E84
address: '0x08049E84'
kind: function
status: confirmed
summary: Dispatches a chatbox/scene/fade sub-state step by jumping to one of nine Thumb handlers selected by the
  sub-state byte at `r5+1`.
interface: 'void sub_8049E84(void);  // inputs: r2 r4 r5 r10 lr; outputs: r8 r9 r10 r11 r12; clobbers nz c v r0
  r1 r2 r3 lr; preserved r4 r5 r6 r7'
details: 'A 20-byte trampoline that pushes {r4-r7,lr}, loads a function pointer from `off_8049E98` (a 9-entry Thumb
  dispatch table) indexed by the byte at `r5+1`, sets lr to the return address and tail-calls the chosen handler
  via `bx`. Handlers include `screenFadeUpdateTick_8049F32`, `chatbox_stateStep_804A024` and `sceneUpdate_804A078`,
  indicating this dispatches among chatbox/fade/scene per-frame ticks. Entry pointers carry +1 so the low bit acts
  as the Thumb bit for `bx`. Caller stores the sub-state byte at `r5+1` (where r5 points to a state/context struct)
  and must preserve r4..r7 themselves since the dispatcher only saves/restores them around the call.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
