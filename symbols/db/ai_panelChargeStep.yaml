name: ai_panelChargeStep
address: '0x081108E4'
kind: function
status: confirmed
summary: 'AI charge-then-lunge step: counts down a charge timer, then picks a destination panel (target''s or home)
  and initiates the lunge attack'
interface: ai_panelChargeStep(r4 = user_obj, r5 = ai_obj, r7 = AIAttackVars*) -> r5 (ai_obj unchanged); reads/writes
  AIAttackVars_StepTimer, AttackElement, AiAttackParam, TargetObjectPtr, HitElement; reads/writes ai_obj+0x7A/0x7B
  (lunge dest panel), ai_obj+0x80/0x81, ai_obj+0x82/0x83 (latched home panel); calls object_getFrontDirection, object_isValidPanel,
  ai_lungeAttackInit, object_setFlag1
details: 'Two-phase step function. Phase 1 (first invocation, AttackElement==0): latches the AI''s current PanelX/PanelY
  into scratch offsets 0x82/0x83, loads the charge countdown from AiAttackParam into StepTimer, sets AttackElement=1
  as a ''charging'' latch. Phase 2 (every invocation): decrements StepTimer; if nonzero, returns (AI stands still
  charging). When StepTimer hits 0: computes a destination panel by subtracting the AI''s facing-direction offset
  from the target''s PanelX (offset 0x12) and reading PanelY (offset 0x13), then validates via object_isValidPanel.
  If valid, uses target''s panel as lunge destination; otherwise falls back to the AI''s own panel at offsets 0x80/0x81
  (offset by facing direction). Stores dest_x/dest_y into ai_obj+0x7A/+0x7B, calls ai_lungeAttackInit (which may
  swap r5/r7 to a new object/vars), zeroes CurAnim, applies OBJECT_FLAGS_GUARD, sets HitElement=4 (likely a contact-damage
  element), clears AttackElement to end the attack state. The guard flag and CurAnim=0 suggest the AI enters a brief
  invulnerable pose during the lunge.'
