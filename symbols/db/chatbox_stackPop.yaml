name: chatbox_stackPop
address: '0x0803C068'
kind: function
status: probable
summary: Pops the top entry from a 2-byte-per-entry stack backed by a struct at r5, freeing it (writes
  0x00,0xE5) and compacting trailing free slots via sub_803C0BE; returns 1 on success or 0 if the top
  slot is empty/free/terminator (0xE5, 0x00, or 0xE6).
interface: (r0 = offset of the stack-count byte within the struct at r5, r1 = offset of the 2-byte entry
  array within the struct) -> r0 = 1 if an occupied entry was popped/freed, 0 if the stack was already
  empty; uses r5 as a global struct base.
details: 'The function reads the count byte at [r5+r0] and indexes the entry table at r5+r1 with count*2.
  If the entry''s low byte is 0xE5 (free marker) or 0x00, the pop fails: the count is decremented (saturating
  at 0) and 0 is returned. Otherwise the entry is freed by writing 0x00,0xE5 into its two bytes, sub_803C0BE
  compacts the table (rewrites trailing 0x00/0xE5 slots to canonical 0xE5 0xE5 pairs up to the 0xE6 terminator),
  the count is decremented, and 1 is returned. The count byte is a top-of-stack cursor and the 0xE6 byte
  acts as the end-of-stack terminator.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,r6]; lsl #1 + add r7 indexes a 2-byte entry array — entries are 2 bytes wide, count
    is a cursor; cmp r1,#0xe5 / #0 / #0xe6 with bne — 0xE5/0x00 mean free slot, anything else is an occupied
    entry; strb 0x00/[r0] + strb 0xE5 [r0,#1] — occupied entry is overwritten with the free marker 0x00E5;
    count decremented with saturating ''sub #1; bge; mov #0'' and returned as r4 success/fail flag; callee
    sub_803C0BE normalizes trailing free slots to 0xE5 0xE5 up to the 0xE6 terminator, matching a stack-compaction
    helper'
