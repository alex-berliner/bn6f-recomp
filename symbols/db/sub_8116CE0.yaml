name: sub_8116CE0
address: '0x08116CE0'
kind: function
status: confirmed
summary: Battle object dispatcher that runs the current behavior-step handler chosen from a 3-entry table.
interface: void sub_8116CE0(uint32_t r5_battleObject, uint32_t unused lr_in); r2 r3 r5 r10 r11 preserved for caller
details: 'Reads byte at r5+8 (oBattleObject_BehaviorStep = 8), uses it as an index into the

  3-entry jump table at off_8116CF4, and tail-calls the matching handler in Thumb mode

  (table entries are pre-incremented to set the Thumb bit: +1). The three targets are

  battle_initSpriteType23_8116D00, battle_objectRunBehaviorStep_8116D6C, and

  sub_8116E08. The behavior-step byte is forwarded in r1; the loaded handler address

  in r0; r2..r12 (except r4/r6..r9 which the handler may clobber) flow through to the

  handler. `push {lr} / pop {pc}` is a standard GCC-style tail return.

  '
