name: battle_initStateAndModule
address: '0x0803AC78'
kind: function
status: probable
summary: Tests bit 0x80 of the chatbox event flag word; if clear, zeroes [r5+0x13], repairs a halfword
  table's free slots with sub_803C0BE, counts entries with sub_803C132 into [r5+0x10], and writes 0xC
  to [r5+1]; then unconditionally calls battle_moduleInit_803A820.
interface: (r0 = flag bit to test = 0x80; r4-r5/r6/r7 = caller context, r5 = state struct ptr) -> r0 =
  result of battle_moduleInit_803A820; flags NZ from flag test
details: 'Tests bit 0x80 of the chatbox/cutscene event flag word via chatbox_mask_eFlags2009F38. If the
  bit is clear, it zeroed a byte at [r5+0x13], calls sub_803C0BE(0x10,0x30) which repairs trailing free
  slots of a halfword table into 0xE5 0xE5 pairs, then sub_803C132(0x10,0x30) to count entries up to the
  end marker, storing the count at [r5+0x10], and writes 0xC to [r5+1] (likely a state/mode field). Whether
  the flag is set or not, it finishes by calling battle_moduleInit_803A820, which registers battle module
  entries (IDs 10/0x26 and 11/0x27) and starts the main init. So this is a pre-init wrapper: skip the
  state reset when some cutscene/flag is active, but always launch the battle module.'
