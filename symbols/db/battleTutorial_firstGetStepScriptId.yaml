name: battleTutorial_firstGetStepScriptId
address: '0x08029BD6'
kind: function
status: probable
summary: 'Returns the chatbox script ID for the current first-battle tutorial step: 0x27 when the state
  byte at [r5,#8] is 1, otherwise 0 (no text).'
interface: (r5 = tutorial state struct, no args) -> r0 = chatbox script id (0x27 if state==1, else 0);
  flags clobbered by cmp/movs
details: 'A tiny helper for the first-battle tutorial: it reads the step/state byte at offset 8 of the
  global tutorial struct held in r5 and maps it to a text-script number. State 1 yields 0x27 (39), any
  other value yields 0, which the caller treats as ''no script''. The caller (battleTutorial_first_checkTextStep)
  uses per-step checkers like this to decide whether to open a chatbox and then advances its own state
  machine into the post-text wait state. r5 is not a parameter passed on the stack but a fixed global
  register convention shared across the tutorial task''s functions. The value 0x27 is almost certainly
  a script/text bank index for the tutorial''s battle text.'
