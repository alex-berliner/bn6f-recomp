name: sub_809FADE
address: '0x0809FADE'
kind: function
status: hypothesis
summary: Returns the address of a halfword-sized entry inside the toolkit's 0x02004xxx buffer, given an offset measured
  relative to 0x1400.
interface: u16* sub_809FADE(u32 offset /* r0, toolkit in r10 */); also returns the buffer base in r2
details: 'Loads the pointer stored in the toolkit at oToolkit_Unk2004348_Ptr (a buffer in the

  0x02004xxx region, per the field name) and computes base + (r0 - 0x1400) * 2.

  The incoming offset is relative to the 0x1400 byte mark of the buffer, and the *2

  scaling means entries addressed are halfwords, so callers presumably pass an index

  or byte offset into a second region of that buffer. Pure address arithmetic helper:

  no memory is read or written beyond the toolkit pointer load. r2 is returned holding

  the buffer base address as a secondary output, and flags are clobbered by the mul/add.

  What the buffer holds (BG map tilemap, textbox tile buffer, battle UI layer, etc.)

  is not determinable from this function alone.

  '
