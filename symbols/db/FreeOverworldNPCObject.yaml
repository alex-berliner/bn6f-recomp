name: FreeOverworldNPCObject
address: '0x08004602'
kind: function
status: confirmed
summary: Frees an overworld NPC's object slot by clearing its bit in the active-NPC bitfield, marking the header
  unused, and removing its sprite scaling.
interface: void overworld_freeNPCObject(ObjectHeader* npc /* r5 */); clobbers r0-r3 and flags (tail work done by
  sprite_makeUnscalable), preserves r5, returns to lr
details: Takes the NPC's object header in r5. Reads oObjectHeader_ListIndex (offset 3) and builds a slot mask 0x80000000
  >> listIndex, i.e. bit (31 - listIndex) of the shared word at eActiveOverworldNPCObjectsBitfield; bic clears that
  bit and stores the word back. Because ARM LSR by a register value >= 32 yields 0, an out-of-range listIndex leaves
  the bitfield untouched. Then writes 0 to oObjectHeader_Flags (offset 0) to mark the object header unused, and
  tail-calls sprite_makeUnscalable to release the NPC sprite's scaler state; r0-r3 and NZCV on return are whatever
  that callee leaves, with r0 holding the slot mask, r1 = 0, r2 = the updated bitfield at the call.
