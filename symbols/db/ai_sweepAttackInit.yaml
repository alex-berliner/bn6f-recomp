name: ai_sweepAttackInit
address: '0x08111438'
kind: function
status: probable
summary: 'Enemy-AI attack routine: counts ticks, picks a move target and closest enemy, then queues attack
  0xB with per-version parameters.'
interface: (r4 = AI data (oAIData_Version_16 read), r5 = battle object, r6 = AI state, r7 = oAIAttackVars)
  -> r0 = 0; sets AI state ScriptId to 0
details: Increments a counter at object+0x67; once it reaches 4 it calls ai_pickMoveTargetFromClosestEnemy,
  otherwise sub_81114C8, and on failure aborts by resetting the AI script id. Whichever check succeeded,
  its thumb pointer is stored as oAIAttackVars_PanelChooseCallback. It then finds the closest BattleObject
  of the opposite alliance (Alliance eor 1) and stores it as oAIAttackVars_TargetObjectPtr, sets AttackDuration
  from byte_811136C[version], AiDifficultyTier=3, AttackBoost2=0x14, TimerOrCycles=0x15, and SubStepIndex/AttackStepIndex
  (3/3 if byte object+0x68 set, else 0/4). Finally it loads ScratchVar/AiAttackParam from byte_8111364[version],
  invokes object_setAttack0(0xB) and sub_8109974, and clears the AI state script.
