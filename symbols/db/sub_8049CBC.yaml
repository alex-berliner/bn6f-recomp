name: sub_8049CBC
address: '0x08049CBC'
kind: function
status: hypothesis
summary: Loads a small block of data (two 0x20-byte chunks + two palette-mapped bytes) from the global ROM table
  at 0x02001800 into a caller-provided structure in r5, mapping two indices through sub_803C132 to select which
  0x10/0x11 byte gets stored.
interface: 'void sub_8049CBC(struct * r5 /* slot to fill */);

  // clobbers r0, lr; preserves r4-r7, r5; flags NZ affected, CV readable

  '
details: "- base pointer is the global word_2001800 (held in r7), a pointer/slot table used as a\n  source for per-frame/per-sprite\
  \ charset or palette data.\n- Copies two 0x20-byte source blocks from offsets +0x08 and +0x28 of that table into\n\
  \  destination offsets +0x30 and +0x90 of the r5 struct (likely a charset tile pointer and a\n  palette pointer,\
  \ given typical Battle Network sprite layout).\n- Calls sub_803C132 with r0 = 0x10, r1 = 0x30 and stores the returned\
  \ byte at r5+0x10;\n  similarly r0 = 0x11, r1 = 0x90 -> r5+0x11. sub_803C132 is elsewhere documented as\n  a palette/color\
  \ mapper (Pallet-/palette-index lookup), so these two bytes are probably\n  chosen palette indices rather than\
  \ direct tile indices.\n- The function never reads r5, only writes to it; r5 is preserved by the call convention\n\
  \  so the caller's struct lives across the call.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
