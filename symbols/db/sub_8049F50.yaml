details: "Tail of a guest/multi-CPU bring-up sequence in bn6f. Calls:\n  - sub_803BA64: no-arg init/shutdown of\
  \ guest subsystem.\n  - sub_803BAE2(0): clears/initializes the guest's work queue or mail box to slot 0.\n  -\
  \ sub_803B522(0x0A): likely configures an IRQ/priority or buffer slot id 10.\n  - sub_803B674(0x28 = 40): guest\
  \ stack/buffer size in words or bytes.\n  - sub_803A8B4(1): enables the guest with flag/mode 1.\nPure setup; no\
  \ inputs/outputs preserved across the call. The \"0x28\" stack size and 0x0A id are\nhard-coded constants typical\
  \ of BN's guest (program editor) bring-up prologue.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
