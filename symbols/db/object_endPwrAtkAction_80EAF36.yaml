open_questions:
- r6 (AIState) and r7 (queue base) roles are inferred from offset 0x5 (`oAIState_Unk_05`) and from the
  0x1e-indexed queue; the project comments note ai_state_struct vs ai_attack_vars_struct ordering may
  be swapped, so the precise struct mapping for r6 is not certain.
- 'The `GetBattleMode`/compare pair is dead code as written (cmp #1, beq to the very next instruction);
  the intent of that comparison is unclear - perhaps an unfinished guard for a special battle type.'
- The exact AI attack sub-action jumped to via off_80EB044 is not visible here; naming it would need seeing
  the table entries and the other CurAction>=0x10 handlers.
