kind: function
status: confirmed
summary: Boot/init helper that clears VRAM and a secondary GFX buffer, decompresses/copies the scene's tiles/palette/tilemap
  init refs, shrinks the Toolkit render viewport inward by a few pixels on each side, and triggers transition effect
interface: void sceneBootCopyAndShrinkViewport_8049A18(u32 *r10 /* Toolkit */, u32 lr)
details: "Calls in order:\n  1) zeroFillVRAM() — clear video RAM.\n  2) ZeroFillGFX30025c0() — clear a secondary\
  \ GFX buffer at 0x030025C0.\n  3) copyMemory_8001850() — flush/stream any pending packed graphics still in the\
  \ copy queue.\n  4) decompAndCopyData(initRefs_8049A54) — walk the embedded initRefs table whose entries are\n\
  \     (src, dst, size) triples. Entries whose src has the COMPRESSED_PTR_FLAG bit set are\n     LZ-decompressed\
  \ into dst; plain entries are raw-copied. Sources and sizes observed:\n       - comp_87E50D4 -> 0x06004000 (tiles/screen\
  \ base)\n       - comp_87E5550 -> unk_2028200 (RAM, NULL dst implies skip?)\n       - comp_87E56A0 -> 0x0600D600\
  \ (more tiles)\n       - dword_87F25B4 -> palette_3001980, 0xA0 bytes (palette)\n       - byte_86A4D40 -> 0x06010020,\
  \ 0x240 bytes (tilemap block A)\n       - dword_86A4A40 -> 0x06010300, 0x100 bytes (tilemap block B)\n       -\
  \ dword_86A5500 -> byte_3001550, 0x20 bytes (small RAM block)\n       - terminating NULL.\nThen loads the Toolkit\
  \ render-info struct via r10->oToolkit_RenderInfoPtr and mutates its\n16-bit viewport fields (offsets inside the\
  \ render-info struct):\n  0x16 (bottom) -= 4, 0x14 (top) -= 2, 0x1A (right) -= 2, 0x18 (left) -= 4.\nResult: a\
  \ 2-pixel inset on top/right and a 4-pixel inset on bottom/left (units appear to be\npixels). Finally calls sub_803B91C(3)\
  \ — transition effect index 3, presumably a fade/wipe that\nreveals the freshly loaded scene plus its newly inset\
  \ border.\nClobbers r0/r2/r3 (r1 is the implicit work reg of the callees); preserved r4, r6, r7.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
