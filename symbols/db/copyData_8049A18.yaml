open_questions:
- Which scene/boot path actually invokes this? The combination of "clear VRAM + reload tiles + shrink viewport +
  start transition 3" suggests a title-screen or major scene-swap boot, but there is no caller symbol attached to
  confirm.
- The entry at comp_87E5550 -> NULL looks malformed for a (src,dst,size) triple — is the terminating NULL drawn
  from the middle, or does decompAndCopyData interpret NULL dst as "decompress-only, keep result in a scratch buffer"?
- Units of the viewport fields (pixels vs. tiles) are inferred from the small integer adjustments; the render-info
  struct field semantics at 0x14/0x16/0x18/0x1A are not labeled.
- sub_803B91C's argument 3 — is 3 a transition ID or a flag bitmask? Should be checked against its own callers.
