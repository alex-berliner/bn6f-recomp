name: battle_getChipElementData_80281A8
address: '0x080281A8'
kind: function
status: confirmed
summary: Returns the element/attribute data pointer for a battle chip, falling back to a default blob for the "no
  chip" sentinel id 0x1FF.
interface: void* battle_getChipElementData(i32 which_chip /* r0 */); preserves r1/r2; clobbers flags
details: 'Takes a chip id in r0, masks it to its 9-bit chip number (and 0x1FF). If the result equals 0x1FF — the
  placeholder/invalid chip id — the function returns the address of the fallback data blob byte_86E601C (0x086E601C
  in ROM) without performing any lookup. Otherwise it resolves the chip''s ChipData record via getChip8021DA8(which_chip)
  and returns the pointer stored at offset 0x20 of that record, i.e. the chip''s element/attribute data used by
  battle code. r1 and r2 are pushed/popped so both survive the call; the function is a pure accessor with no side
  effects. Quirk: ids whose masked 9-bit value is 0x1FF are treated identically to the plain sentinel id, since
  the mask is applied before the comparison.

  '
