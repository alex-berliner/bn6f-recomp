name: compactEntryWords_800AA64
address: '0x0800AA64'
kind: function
status: confirmed
summary: Compacts the 7-word (0x1C-byte) entry produced by getNextEntryAddress_800AAAE, sliding all non-zero words
  to the front and zero-filling the tail so the entry has no holes.
interface: void compactEntryWords_800AA64(u32 r0 /* forwarded to getNextEntryAddress_800AAAE */, u32 r4 /* preserved,
  unread */); returns nothing meaningful (R0 = 0)
details: 'Calls getNextEntryAddress_800AAAE (forwarding the incoming R0) to obtain the address of a

  7-word / 0x1C-byte entry, then performs an in-place compaction: src and dst pointers walk

  over the 7 words, and every non-zero word is copied to the next free slot at the front;

  after the scan, the remaining slots are zero-filled. The entry is left contiguous with no

  zero holes in the middle. The entry is modified in place at whatever buffer

  getNextEntryAddress_800AAAE points to (likely a fixed-size record such as a message,

  mailbox, or chatbox queue entry). No memory outside the 7 words is touched.

  Quirks: preserves incoming R4 (which is never read), returns R0 = 0, and leaves

  R1/R3 pointing one word past the entry end (R1 = R3 = entry + 0x1C); flags come from

  the final `cmp r1, r4` of the fill loop (compare against entry end), not from the return

  value. Callers per the register contract appear to rely on R0 being zero.

  '
