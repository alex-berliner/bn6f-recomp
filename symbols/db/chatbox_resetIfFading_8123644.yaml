name: chatbox_resetIfFading_8123644
address: '0x08123644'
kind: function
status: confirmed
summary: If a screen fade is active, reset the chatbox state (call chatbox_8040818) and clear three status bytes
  at the passed struct (0x20, 0x00, 0x00); otherwise return the value IsScreenFadeActive left in R0 unchanged.
interface: '/* sub_8123644(r5 = chatbox_status_ptr) -> r0; preserves r2, r5; clobbers r0,r1,r3,lr; nzcv from IsScreenFadeActive
  or chatbox_8040818 */

  '
details: 'Tail of a chatbox/message-window update. R5 points to a small 3-byte status struct owned by

  the caller (likely chatbox state machine flags): byte 0 is set to 0x20 (a "hidden/clearing"

  flag), bytes 1 and 2 are zeroed. The reset path also calls chatbox_8040818, which is the

  chatbox subsystem''s teardown/init helper, so this is the routine that scrubs the chatbox when

  a screen fade starts so it doesn''t bleed across the transition. The "no fade" branch is a

  passthrough that hands IsScreenFadeActive''s return value back to the caller unchanged and

  skips all stores — it never touches R0 itself on that path. Note the mov r0,#0 after the

  stores does NOT update flags, so on the reset path nzcv still reflect chatbox_8040818''s exit

  state.

  '
