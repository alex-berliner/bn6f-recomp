name: battle_initAIChipQueueList
address: '0x080467FC'
kind: function
status: probable
summary: Walks a 0xFF-terminated table of 4-byte entries and initializes one AI chip-queue slot per entry
  via battleObject_initAIChipQueueSlot.
interface: (r0 = pointer to entry table) -> r0 = clobbered (advanced past table); no meaningful return
  value
details: Each entry is {u8 actorSlot; u8 b; u16 hw} and the list is terminated by a first byte of 0xFF.
  For every entry it reloads r0 from the entry base (actor slot index), sets r1 = byte at +1 and r2 =
  halfword at +2, calls battleObject_initAIChipQueueSlot_80468C6 (which sets up a 0x58-byte queue slot
  at 0x02011860), then restores the saved entry pointer and advances it by 4. The callee's r0-r3 are clobbered
  each iteration, so the table pointer is preserved on the stack across each call. r4-r6 are pushed but
  never used. Called once from battle_initReturnSceneGfx during battle scene (re)initialization, so the
  table presumably comes from battle setup data describing initial chip-queue state per actor.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r7,[r0]; cmp #0xff; beq — 0xFF-terminated array of fixed-size entries; ldrh r2,[r0,#2]/ldrb
    r1,[r0,#1]/ldrb r0,[r0] then bl battleObject_initAIChipQueueSlot_80468C6 — passes entry fields as
    (slot, b, hw) args; push {r0}/pop {r0} around the call keeps the table pointer alive across the clobbering
    callee; add r0,#4 before looping — stride of 4 bytes per entry; Caller battle_initReturnSceneGfx reinitializes
    the battle scene, matching one-time setup of AI queue slots'
  refs:
  - bn6f/asm/asm03_2.s:1145
  - 0x08038B04 battle_initReturnSceneGfx
