    run wf investigate investigate-20261019-003606'
open_questions:
- Exact meaning of entry fields +1 and +2 (likely chip IDs/counts passed into the queue slot) depends
  on battleObject_initAIChipQueueSlot_80468C6's parameter semantics
- Where the table pointer comes from in battle_initReturnSceneGfx (ROM data vs EWRAM) not shown
