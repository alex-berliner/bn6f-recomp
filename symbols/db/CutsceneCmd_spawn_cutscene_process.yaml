name: CutsceneCmd_spawn_cutscene_process
address: '0x080378C2'
kind: function
status: confirmed
summary: 'Map-script command "spawn cutscene process": writes a byte value into a chosen cutscene-state script-position
  field, unpausing that script slot, then continues the script.'
interface: "u32 CutsceneCmd_spawn_cutscene_process(\n    /* r1 */ preserved scratch,\n    /* r4 */ struct CutsceneState*\
  \ cutsceneState,\n    /* r5 */ cutsceneState base pointer,\n    /* r7 */ u8* scriptPtr /* current command cursor\
  \ */,\n    /* lr */ return address)\n-> /* r0 */ u32 continueResult /* 1 = keep running script */,\n   /* r7 */\
  \ advanced scriptPtr, flags NZ from r0=1 and CV from r7+=6\n"
details: 'Implements one cutscene/map-script opcode handler in the cutscene command dispatcher. It reads a word
  parameter from the script stream via ReadMapScriptWord (r6=2 selects the width): that word is the offset of the
  target field within the cutscene state, relative to oCutsceneState_CutsceneScriptPos. It then reads a byte parameter
  (ReadMapScriptByte with r6=1) and stores it as a 32-bit value at cutsceneState + offset (str r0,[r5,r4]), which
  (re)starts that cutscene script slot''s process. The field offset is turned into a slot index: (offset - oCutsceneState_CutsceneScriptPos)
  >> 2, i.e. one of the per-slot "script position" entries, each 4 bytes apart. For that slot it clears both pause
  flags in the cutscene flag array: slot index + CUTSCENE_FLAG_SCRIPT_1_PAUSED (slots 0-3) and slot index + CUTSCENE_FLAG_SCRIPT_1_PAUSED_LONG
  (slots 4-7), so the spawned script runs unpaused regardless of which pause mechanism held it. Finally it advances
  the script cursor r7 by 6 (the full command word + word param + byte param) and returns r0 = 1 to signal "continue
  executing the script". r1 is preserved across the call; r6 is used internally as the width selector for the script-read
  helpers.

  '
