details: 'Trivial wrapper: pushes lr, sets r0 = 1 (the `lsl r0, r0, #0` is an

  identity shift, so the value stays 1), then tail-calls sub_801BEB8 and

  returns via `pop {pc}` with the callee''s r0-r2 and flag results intact.

  No game-meaning can be assigned until sub_801BEB8 is identified; the

  constant 1 is the only "argument" and may select a mode, index, or

  boolean (e.g. enable/true) for that callee. Touches no memory or

  structures of its own.

  '
