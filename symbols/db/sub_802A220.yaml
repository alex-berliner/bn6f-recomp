name: sub_802A220
address: '0x0802A220'
kind: function
status: hypothesis
summary: Returns a panel-slot candidate for an automated/navi selection in battle, or 0xFF when no candidate qualifies.
interface: "u8 battle_pickPanelCandidate_802A220(\n    r2  /* unused (legacy scratch) */,\n    r5  /* in: caller\
  \ struct; reads +0x3A word as a slot id to skip */,\n    r10 /* in: Toolkit/Task pointer; reads +oToolkit_BattleStatePtr\
  \ */,\n    lr) -> u8 (r0, also returned in r4); flags: nz/v/c set per callees\n"
details: "Default return is 0xFF (no candidate). Early-out conditions, in order:\n  1. Event flag 0x163 (99) is\
  \ set: skip.\n  2. GetBattleEffects() has the 0x200000 bit: skip.\n  3. GetBattleMode() is not 0, 0xA, or 0xB:\
  \ skip.\n  4. Battle state byte 0x0D selects the navi; GetBattleNaviStatsByte(navi_id, 0x29) must\n     fall outside\
  \ [1, 0xB] (i.e. effectively == 0): skip.\n  5. Reads the panel/queue state at dword_20349A0; if +0x5 == 0xFF:\
  \ skip.\n  6. Calls sub_8120B54() to get a candidate slot id; if 0xFF: skip.\n  7. If slot == r5->word_3a: skip.\n\
  \  8. If dword_20349A0 +0xE word has the slot's bit set: skip.\nIf GetBattleEffects() bit 0x8 is clear: accept\
  \ the slot unconditionally.\nIf bit 0x8 is set: only accept when dword_20349A0 +0x5 < 2.\nOn accept, r4 = slot;\
  \ on every early out r4 keeps its initial 0xFF.\nTouches toolkit's battle state pointer (oToolkit_BattleStatePtr\
  \ via r10), the\nnavi-stats table (byte 0x29), and the panel/queue struct at dword_20349A0\n(fields +5, +0xE).\
  \ Same caller's r5 struct's +0x3A slot guard.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
