    Param1==9; ldr/str [r5,#oBattleObject_ExtraVars+4], sub #1, bgt — countdown timer stored in the object''s
    extra var; mov r0,#5; str — reloads the same counter with interval 5 before spawning; bl spawn_flippedIllusion
    with r5 still holding the object pointer — spawns the copy'
