name: ai_spawnFlippedIllusionOnTimer
address: '0x080CB6B0'
kind: function
status: probable
summary: If the battle object's Param1 is 9, counts down a timer in ExtraVars+4; on expiry resets it to
  5 and spawns a flipped illusion copy of the object.
interface: (r5 = battle object pointer; r0 unused on entry) -> r0 = spawn_flippedIllusion result or trashed;
  flags from the counter decrement
details: Acts as a periodic re-spawn hook for an illusion-spawning enemy. It early-outs unless oBattleObject_Param1
  equals 9, then decrements the 32-bit counter at oBattleObject_ExtraVars+4. When the counter drops to
  zero or below, it reloads the counter with 5 (so a new illusion is queued roughly every 5 timer ticks)
  and calls spawn_flippedIllusion, which creates a copy object of r5 with facing folded into the spawn
  parameter. The 9 in Param1 presumably marks this enemy's illusion phase/state.
