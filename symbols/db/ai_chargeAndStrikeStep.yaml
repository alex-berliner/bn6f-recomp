name: ai_chargeAndStrikeStep
address: '0x080F3230'
kind: function
status: probable
summary: 'Per-frame step of an AI enemy attack: charges while lifting the object, then on the last tick
  slams down, cracks the panel under it and registers the damage hit.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no meaningful return
details: On the first pass (AttackElement == 0) it arms the attack by setting AttackElement = 4 and StepTimer
  = 10, then exits. During the charge it moves the object's Z up by 0x100000 per frame, increments ChargeCycles
  and every 8 cycles calls sub_80F38D0 (charge visual), decrementing StepTimer each frame. When StepTimer
  runs out it zeroes Z (slam), calls sub_8109794 to crack the panel at the object's PanelX/PanelY, writes
  oAIAttackVars_Damage into the collision record (low 16 bits to SelfDamage, upper 16 to the StaminaDamageCounterDisabler
  byte), sets collision region 1, clears flag 0x40 and sets the CURRENTLY_MOVING bit, plays animation
  0x13 with counter time 0x12, plays sound effect 0xC0, and sets HitElement = 0x10.
