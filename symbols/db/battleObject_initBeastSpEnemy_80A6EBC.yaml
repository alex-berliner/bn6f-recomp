name: battleObject_initBeastSpEnemy_80A6EBC
address: '0x080A6EBC'
kind: function
status: confirmed
summary: 'Initializes a Beast-type overworld enemy sprite: loads graphics and animation, sets layer effect/priority/palette,
  copies position from a parameter table, optionally loads battle stats (flag 0x5E5), then spawns via animation
  update.'
interface: void battleObject_initBeastOverworldSprite(u32 r4, u32 r5 /*sprite object ptr*/, u32 r6, u32 r7, u32
  r10, lr)
details: 'Sets sprite state byte at (r5+0) to 3 (loading). Calls sprite_load with args (0x80, 0x1C, 0x2F) to load
  Beast graphics into VRAM, then animation frame 0, animation data, no-shadow, layer-effect at (r5+0xC), priority,
  palette 1. sub_80A70C0 returns a beast-parameter block pointer; if null the function exits early without spawning.
  When non-null it reads two u16 position values from the block, stores them shifted left 16 into (r5+0xC) and (r5+0x10)
  (fixed-point 16.16), zeros (r5+0x14), (r5+0x2C), (r5+0x34), (r5+6), and writes behavior code 0x11 to (r5+0x38).
  Event flag 0x5E5 is set and tested; if set, battle_loadBeastSpEnemyStats loads HP/attack/etc. Finally state byte
  at (r5+8) is set to 4 and battleObject_updateAnimation_80A6F2C is called to activate the sprite on the overworld
  map.

  '
