summary: 'Initialize a Beast+ SP-form enemy battle object: load its sprite/animation, set draw layer/priority/palette,
  optionally patch coords from sub_80A70C0, optionally run sub_80A7208 when event 0x5E5 is set, then transition
  CurState to UPDATE (0x4).'
interface: '(r5 = BattleObject*) -> r0 = 0x26 ; side effects: writes many BattleObject fields, may patch
  coords from a returned table, may run a one-shot story-gated helper'
details: 'Entry contract (r4-r7, r10 saved) treats r5 as the enemy BattleObject and r10 as the Toolkit.

  - strb r0=#3 -> [r5] (object header Flags, set ACTIVE | VISIBLE | PAUSE_UPDATE and clear others; also
  the header byte at offset 0 is a flags byte).

  - sprite_load(r0=0x80, r1=0x1c, r2=0x2f) loads sprite data into the slot, with a placeholder if missing.

  - sprite_setAnimation(0), sprite_loadAnimationData() and sprite_noShadow() set up the visuals.

  - applyLayerEffectToOWObject_8035694 on r5+0xc sets the draw layer/priority based on map regions.

  - sprite_setPriority_8002E14 (r0 unspecified in the listing but called right after the layer-appender)
  and sprite_setPalette(1) finish sprite config.

  - sub_80A70C0 returns a pointer/handle; if non-NULL, its first u32 (shifts left by 16) is stored at
  r5+0xc (Z?) and second u32 at r5+0x10 (timer?), then zero writes to r5+0x14, r5+0x2c, r5+0x34 clear
  pending damage/timers/coords. strb r5,#6 = 0; str r5,[#0x38] = 0x11 sets a flag/state.

  - If event flag 0x5E5 is set (TestEventFlagFromImmediate), sub_80A7208 is called once to apply its story-specific
  setup.

  - strb r5,#8 = 0x4 sets CurState = CUR_STATE_UPDATE, then battleObject_updateAnimation_80A6F2C runs
  the per-frame logic and returns.

  Returns r0 = 0x26 (a common battle-object init "I initialized" return code seen on captured exits).

  '
