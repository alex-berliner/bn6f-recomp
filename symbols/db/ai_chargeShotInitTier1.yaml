name: ai_chargeShotInitTier1
address: '0x08012612'
kind: function
status: probable
summary: AI attack initializer that runs MegaMan's charge-shot init and then sets the AI difficulty tier
  to 1.
interface: (r7 = AI attack vars struct) -> void; no return value
details: The routine first calls the known MegaMan charge-shot primary-power-attack initializer at 0x08011A26,
  which per its summary burns one primary RNG draw and may route through a weighted 1/2 pick consuming
  further RNG. It then writes the constant 1 as a byte to oAIAttackVars_AiDifficultyTier in the struct
  held in r7, so the follow-up attack behavior runs at difficulty tier 1. With no known callers and only
  six instructions, it looks like one entry in a table of per-difficulty AI attack init wrappers differing
  only in the tier byte they store.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl megamanChargeShotBPwrAtk_init_8011A26 reuses the charge-shot init (RNG draw + weighted pick)
    as its whole action; mov r1,#1; strb r1,[r7,#oAIAttackVars_AiDifficultyTier] hardcodes tier 1 into
    the AI attack vars; push {lr}/pop {pc} with no other logic indicates a tiny wrapper, likely one of
    a family differing only in the stored tier
  refs:
  - bn6f/asm/asm00_2.s:8322
  - 0x08011A26 megamanChargeShotBPwrAtk_init_8011A26
  reproduce: python3 tools/asmcat.py 0x08012612
