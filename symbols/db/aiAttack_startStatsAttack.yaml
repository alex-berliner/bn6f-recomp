open_questions:
- Why the NaviStats byte 0x29 is read at all — its result (r3) is dead; a caller or the callee's side
  effects would clarify (stat cache refresh? unlock check?)
- Meaning of the three stored parameter bytes at +0x16..+0x18 (likely damage/element/target, needs the
  attack-runner to confirm)
- What attack id 0x10 (and the alternate 0x3F) maps to, and how the second block is reached
- No known callers — entry conditions and the meaning of the +0x3=2 mode are unconfirmed
