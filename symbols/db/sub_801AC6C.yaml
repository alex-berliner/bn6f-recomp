name: sub_801AC6C
address: '0x0801AC6C'
kind: function
status: confirmed
summary: Per-frame collision resolution pipeline for the active battle object
interface: void sub_801AC6C(u32 r4, u32 r5, u32 r6, u32 r8, u32 r9, u32 r10, u32 r11, u32 r12) -> r5, r8, r9, r10,
  r11, r12; flags NZCV clobbered; r4 and r7 preserved
details: "Runs the full hit-response pipeline for the battle object passed in r5 (a\nBattleObject*). Steps, in order:\n\
  1. sprite_clearFinalPalette on the object's sprite.\n2. Load oBattleObject_CollisionDataPtr into local scratch\
  \ r7.\n3. Bail early if battle flag bit 0 is clear, after removing the collision\n   record via object_removeCollisionData.\n\
  4. Also bail if battle_isBattleOver() is true, or if the object's own flag\n   bit 8 (object_getFlag mask \"1:8\"\
  , likely the Ignore/Invuln flag) is set.\n5. Impact/stat stage: sub_801A802, sub_801A186, sub_801A36A,\n   battle_tickAiSelfDrain_8010230,\
  \ battleObject_handleImpact_802CFF8, and\n   hiveBlockHappensHere_802CEF4 (the latter two are the standard impact\
  \ and\n   hive-protection handlers).\n6. Alliance bookkeeping: battle_incrementAllianceStatOnCollisionHit_801A6B4\n\
  \   and battle_buffTwoStatsPlus2OnEventF6_801A720.\n7. Sub-screen collision processing via sub_80139F6, then sub_801AEB0\
  \ and\n   battle_applyFlattenHitStatus_800EB26, then handlePanelDamage_8013F1E for\n   elemental/panel chip damage.\n\
  8. Status-effect guard: queries three Navi-stat bytes at offsets \"0x29\",\n   \"0x2c\", and \"0x52\" via GetBattleNaviStatsByte_AllianceFromBattleObject.\n\
  \   battleObject_applyStatusEffect_801A554 is skipped when the first offset\n   is 7, the second offset is 7 or\
  \ \"0x13\", or the third offset is nonzero\n   (the object is status-immune / not status-vulnerable).\n9. Final\
  \ damage tail: sub_801A2CC, sub_801A324, object_calculateFinalDamage1,\n   sub_801A420, battle_runObjectAI_80143FC,\
  \ sub_80142DC, then\n   battle_objectClearPendingHitIfCollisionProcessed_8010198,\n   battle_clearInvisFlashTimer_801A648,\
  \ and object_spawnHiteffect to spawn\n   the visible hit sprite.\nr4 and r7 are pure scratch here and are preserved\
  \ across the call for the\ncaller; the function does not read a return value itself.\n"
