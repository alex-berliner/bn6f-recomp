name: textScript_loadAndRunEmbeddedArchive_812AF84
address: '0x0812AF84'
kind: function
status: confirmed
summary: Decompresses an embedded text-data blob into work RAM and hands the resulting script to the text-script
  engine to run.
interface: void sub_812AF84(void); // no meaningful inputs; r1-r7 on return are whatever sub_8123300 leaves, NZCV
  clobbered
details: 'Entry point for a packaged text/scene script. First it passes the pointer to a compressed embedded blob
  (byte_812B168) to decompAndCopyData, which decompresses it into the shared decomp work buffer (eDecompBuffer2013A00
  at 0x02013A00). It then loads the script''s descriptor/metadata table (off_812AFE4) into r0, the decompressed
  script data (eTextScript201BA20 at 0x0201BA20) into r1, and the decomp buffer into r2, and calls the text-script
  engine (sub_8123300) to start executing it. This function tail-ends by branching to that call, so all observable
  register outputs and flag clobbers are just sub_8123300''s contract relayed back; r4-r7 are listed as both inputs
  and preserved because they pass through untouched to the callee''s own expectations.

  '
