name: npc_lotteryTalkStep
address: '0x0809AC88'
kind: function
status: probable
summary: Runs the lottery NPC's current dialogue script and resets (or, for script 15, sets to 28) the
  byte at r5+8, likely a re-talk cooldown/state field.
interface: (r0 = TextScriptArchive (TextScriptLottery86C67E4), r1 = script_idx from [r5+0x74]) -> r0 =
  0; [r5+8] = 0 (or 0x1C if idx == 15)
details: Loads the fixed lottery text archive and invokes chatbox_runScript with the script index already
  stored at [r5+0x74], so the caller (or a prior step) picks which line of the lottery exchange is spoken.
  Afterwards it clears the object's byte at offset 8, except when the script index is exactly 0xF, in
  which case it writes 0x1C (28) instead — plausibly a frame-count cooldown before the next interaction
  or a state id. The function always returns 0 in r0. r5 is the NPC/object context whose fields 0x74 (script
  selector) and 0x8 (post-talk counter/state) are manipulated. The special-casing of script 15 suggests
  it is the final/different branch of the lottery dialogue that needs the 28-unit delay.
