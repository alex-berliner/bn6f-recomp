open_questions:
- The exact semantics of `[r5+1] = 8` — without confirming the struct held in r5 here the most we can
  say is "the PET sub-screen jumptable index byte is set to 8"; a labeled struct definition for the PET-subscreen
  scratch would settle this.
- The captured-call exit `r0 = 0xFFFFFFE0` is not a real return value; a small callee (likely `ClearPETMenuDataFlag`
  returning previous-bits, `0xE0`) trickles through the many `bl` calls that aren't fully audited. The
  function itself does not produce a meaningful r0.
