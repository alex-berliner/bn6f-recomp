name: text_renderListEntry
address: '0x0811B7D4'
kind: function
status: probable
summary: Draws one visible row of a text list via the toolkit text renderer, using a per-row entry from
  word_2023FA0.
interface: (r0 unused, r5 = row struct with u8 rowIndex at +0x4) -> r0 = renderTextGfx result; touches
  toolkit->Unk200a220->field8; no flag contract shown
details: Reads a scroll/first-visible-index halfword from unk_2037780+0x24 and a row-count halfword from
  +0x1E, forms index = scroll + [r5+4] - 2, and returns without drawing if the index is negative or >=
  count (so only in-window rows render). It then loads the halfword at word_2023FA0[index*4+2] and stores
  it into toolkit->field_200a220_ptr+8, likely the text/glyph id for this row. Finally it calls renderTextGfx_8045F8C
  with r0=eTextScript201BA20, r1=0x46, r2=off_811B878[rowIndex] and r3=byte_811B8A4[rowIndex] (per-row
  callback/data tables, stride 4), r4=r5=1, r6=dword_86B7AE0, r7=0. unk_2037780 appears to be the list/menu
  window state struct; word_2023FA0 an array of 4-byte row entries.
