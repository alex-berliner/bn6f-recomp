name: battle_hideRelatedObjectPhase
address: '0x080E7518'
kind: function
status: probable
summary: Phase handler that makes the object's related object invisible (with SFX 0x93), waits 30 frames,
  then advances the owner's action state.
interface: (r0 = battle object ptr in r5-style register (this), reads oBattleObject_Param1 and oBattleObject_RelatedObject1Ptr)
  -> r0 = 1 or 0 (timer sign); no meaningful flags
details: Runs as one phase of a battle object's action state machine, using the object struct fields oBattleObject_PhaseInitialized,
  oBattleObject_Param1, oBattleObject_RelatedObject1Ptr, oBattleObject_Timer, oBattleObject_CurAction
  and oBattleObject_CurPhaseAndPhaseInitialized. On first entry (PhaseInitialized == 0) it loads Param1
  into r4 and the RelatedObject1Ptr into r5 and calls battle_startObjectInvisible, which hides that object,
  sets its flashing countdown and plays SFX 0x93; it then sets its own Timer to 30 (0x1E) and marks the
  phase as 4. On every subsequent call it decrements Timer; once the counter underflows below zero it
  sets CurAction = 0xC and clears CurPhaseAndPhaseInitialized, handing control back to the object's action
  dispatcher. The one-shot guard plus Timer countdown is the standard phase pattern in this engine. What
  Param1 means for battle_startObjectInvisible (likely a duration/countdown argument passed in r4) is
  not visible here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r5,[r5,#oBattleObject_RelatedObject1Ptr]; bl battle_startObjectInvisible — hides the linked
    object with SFX 0x93; strh r0(0x1e),[r5,#oBattleObject_Timer] followed by a per-frame 'sub r0,#1;
    bge' loop is a 30-frame delay; tst on oBattleObject_PhaseInitialized with 'mov r0,#4; strb' guard
    makes the invisibility setup run only once per phase; On timer expiry it writes oBattleObject_CurAction=0xC
    and clears CurPhaseAndPhaseInitialized, i.e. transitions to the next action; Phase/value pattern (init
    flag, Timer, CurAction) matches other battle object phase handlers in the same struct
