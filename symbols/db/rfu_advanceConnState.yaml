name: rfu_advanceConnState
address: '0x0814610C'
kind: function
status: probable
summary: Advances the wireless-link state machine at eStruct200FE00 from state 1 to 2, saving the old
  timer/counter bytes and loading new values (0x10/0x11).
interface: () -> void; no return value, flags clobbered
details: Operates on the global RFU struct eStruct200FE00. If byte +0x6 is 0 (some gate/enable flag) and
  the state byte at +0xA equals 1, it backs up the two bytes at +0x4/+0x5 into +0x11/+0x12, writes 0x10
  and 0x11 into +0x4/+0x5, and sets the state byte +0xA to 2. Called immediately after rfu_handleConnTimeout
  when the link watchdog poll succeeded, so it looks like the next step of the connection (or retry) sequence
  in the RFU link state machine.
