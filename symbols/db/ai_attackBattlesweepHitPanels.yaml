name: ai_attackBattlesweepHitPanels
address: '0x08102E74'
kind: function
status: probable
summary: AI attack routine that sweeps a list of battle panels, spawning a damaging collision region and
  an effect object on each one.
interface: (r0 = pointer to null-terminated panel list) -> void; r4 advanced past list, PlaySoundEffect(0xB9)
  fired once
details: 'First plays sound effect 0xB9, then walks a byte list pointed to by r0/r4: each nonzero byte
  encodes a panel position (low 3 bits = column, bits 4-7 = row). For each entry it calls object_spawnCollisionRegion
  with damage taken from [r7,oAIAttackVars_Damage] and an init flag from [r7,oAIAttackVars_InitFlag] (r7
  preserved across the call), then reads the effective facing with object_getFlip (shifted left 8 and
  offset 0x54) and converts column/row to pixel coordinates via object_getCoordinatesForPanels to spawn
  a type-1 effect object (spawn_t1_0x0_EffectObject). The loop increments the list pointer until it reads
  a 0 terminator. The caller sub_8102428 supplies both the list pointer in r0 and the AI attack-vars context
  in r7.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl PlaySoundEffect with r0=0xB9 at entry, before the panel loop; loop reads ldrb [r4] with
    terminator test tst/beq and ''add r4,#1'' — a null-terminated panel-position list; lsr r1,#4 / lsl
    #0x1d,lsr #0x1d split the byte into row (high nibble) and column (low 3 bits) fed to object_getCoordinatesForPanels;
    ldr [r7,#oAIAttackVars_Damage] passed alongside object_spawnCollisionRegion shows the hit deals the
    attack''s configured damage; recorded route ''battlesweep'' matches a panel-sweeping AI attack'
  refs:
  - bn6f/asm/asm31.s:158421
  - 0x08102428 sub_8102428
  - 0x080005CC PlaySoundEffect
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x0800E456 object_getFlip
  reproduce: python3 tools/asmcat.py 0x08102E74
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-155607'
