name: owMapObject_weatherTornado_moveOrPause_80A8F48
address: '0x080A8F48'
kind: function
status: confirmed
summary: 'Per-frame tick of a weather-tornado map object: advances one step of movement, re-picks direction when
  blocked, and manages a short inter-move pause via a two-phase countdown.'
interface: void owMapObject_weatherTornado_moveOrPause_80A8F48(u32 r5 /* tornado object ptr */, u32 r6 /* scene/map
  ptr */, u32 r10 /* context, consumed by callees */);
details: "Reads a 1-byte phase field at [r5+9].\nPhase != 0 (pause branch): decrements the pause timer at [r5+0x25];\
  \ when it\nhits zero, resets phase to 0 so the tornado resumes moving next frame.\nPhase == 0 (move branch):\n\
  \  - Decrements move timer [r5+0x24].\n  - If timer still > 0: calls step (advance one pixel/frame), then\n  \
  \  isBlocked. If blocked (Z flag clear), restores timer from move-init\n    [r5+0x26] and calls repickDirection.\n\
  \  - If timer == 0: restores timer from move-init [r5+0x26], calls\n    pickDirection to choose a new heading,\
  \ then isPauseDue.\n    If a pause is due (Z flag clear): sets phase to 1, loads pause\n    countdown from pause-init\
  \ [r5+0x27] into [r5+0x25], and immediately\n    ticks the countdown once.\nFields used:\n  0x09  phase (0 = moving,\
  \ 1 = pausing)\n  0x24  move-along timer (frames until next direction re-pick)\n  0x26  move-along timer initial\
  \ value\n  0x25  pause countdown timer\n  0x27  pause countdown initial value\nCallees that mutate r5/r6 or set\
  \ Z/N flags: step, isBlocked, repickDirection,\npickDirection, isPauseDue. Outputs r5 r6 r8-r12 are pass-through\
  \ from callees.\n"
