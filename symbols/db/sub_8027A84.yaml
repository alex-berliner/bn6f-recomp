name: sub_8027A84
address: '0x08027A84'
kind: function
status: hypothesis
summary: Resets a battle-actor work counter to 0 and writes 4 into its halfword field at +2, likely a phase/state
  marker.
interface: void sub_8027A84(void)  /* r5 = actor struct pointer; no return value, flags clobbered */
details: 'Trivial two-store routine taking the actor/entity struct in r5 (not on the stack, so it is effectively
  a caller-arranged "this" pointer). It stores 0 as a word at r5+0x40 — most likely a countdown/timer or repeated-action
  counter used by the battle actor''s logic — and stores the halfword value 4 at r5+2, which in the battle entity
  layout is typically a state/phase or step field; 4 therefore advances (or resets) the actor into a specific phase.
  No other fields are touched and nothing is returned; callers only need r5 preserved, and nz flags plus r0 are
  clobbered. The function immediately returns to the caller''s saved lr.

  '
