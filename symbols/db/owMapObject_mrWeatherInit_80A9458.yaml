summary: 'Initialize the Mr. Weather overworld NPC object (r5): set up sprite 0x80/anim 0, compute a position from
  sub_80A9570, clear event 0xBFC, and jump to either the "active" sub-init or the normal step fn depending on event
  0xBFB and the per-instance 0xBF4 flag.'
interface: (r5 = owMapObject self, r10 = ToolkitPtr, lr) -> void
details: "Sets CurState = 3 (`strb r0,[r5]` with r0=3) — but note that r5 starts out pointing at `object_header`,\
  \ so offset 0 refers to `Flags`; combined with `owMapObject_updateLayerPriorityForPlayerZ` later this looks like\
  \ a Mr. Weather standard init.\n  Calls `sprite_load(0x80, 0x1c, 0x6b)` then `sprite_setAnimation(0)`, `sprite_loadAnimationData`,\
  \ `sprite_noShadow` (so the default render starts with no shadow), then `sprite_setPriority_8002E14(2)`.\n  Calls\
  \ `sub_80A9570` (returns a pointer in r4) and copies X/Y/Z (16.16 fixed-point: each loaded as u16 then shifted\
  \ left by 16) from r4+0/+2/+4 into `[r5+0xc]/[r5+0x10]/[r5+0x14]` (Coords.X/Y/Z on an OverworldMapObject). Also\
  \ copies a u8 from r4+7 → `[r5+4]` (probably ZReach / height), then calls `sprite_setPalette` with that byte,\
  \ then sets `[r5+7]` (= npc/object magic) from r4+6. If `[r5+7]` is non-zero it enables shadow via `sprite_hasShadow`\
  \ and applies `owMapObject_updateLayerPriorityForPlayerZ_80A95EC` so the sprite composites correctly against the\
  \ player.\n  Always clears story event 0xBFC (`ClearEventFlagFromImmediate`) and zeroes `[r5+0x24]` (Coords/related\
  \ timer slot).\n  Branches on event 0xBFB: if set AND `sub_80A9628` (the per-instance 0xBF4 flag test, checks\
  \ flag 0xBF4 + index byte) returns non-zero, sets `[r5+8] = 0xc` (special CurState value) and calls `sub_80A9568`.\
  \ Otherwise sets `[r5+8] = 4` (the standard CUR_STATE_UPDATE value) and tail-calls `object_mrWeatherStep_80A94DC`.\
  \ The 0xc branch appears to be a \"weather already triggered this visit\" branch; 0x4 enters the normal step loop.\
  \ Notably 0xBF4+instance is the per-NPC Mr.-Weather \"visited/done\" flag (same family as 0xBF4..0xBFF likely\
  \ used for the Green Town/Cyber Town/Beach Comp weather monitors in BN6).\n"
