    sprite_load` with `r0=0x80,r1=0x1c,r2=0x6b` is the Mr. Weather sprite load. - `lsl r0,r0,#0x10` after a `ldrh`
    then `str r0,[r5,#0xc]` etc. is the 16.16 fixed-point X/Y/Z write pattern. - `movflag EVENT_BFC` → `ClearEventFlagFromImmediate`
    is invoked unconditional. - `movflag EVENT_BFB` → `TestEventFlagFromImmediate` + `beq` chooses between `sub_80A9568`
    path and `object_mrWeatherStep_80A94DC` path; the additional `bl sub_80A9628` corresponds to `TestEventFlag(byte_80A9648[[r5+4]])`
    per its description ("flag 0x0BF4 + instance index"). - Field offsets r4+6 → `[r5+7]` and r4+7 → `[r5+4]` then
    `bl sprite_setPalette` matches an `OverworldMapObject` init pattern: `LayerIndexOverride`-ish or shadow toggle
    byte → sprite palette/shadow config.'
