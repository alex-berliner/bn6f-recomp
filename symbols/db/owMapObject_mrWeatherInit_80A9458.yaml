open_questions:
- What offset 0x7 of r5 is exactly (no equivalent field in `overworld_map_object_struct` between header end and
  Coords start at 0xc; OWMapObject is 0x78 with sprite data at 0x40). r5+0x24 also doesn't line up with anything
  in the published struct; this function may actually be operating on an `OverworldNPCObject` rather than `OverworldMapObject`,
  since `OverworldNPCObject` has CurState at +8, palette at +0x16, sprite-data at +0xa1, and more room between header
  and Coords (0x24). Cross-checking the caller/callee contracts (`owMapObject_updateLayerPriorityForPlayerZ_80A95EC`)
  actually expects an `OverworldMapObject`, so the r5+0xc/r5+0x10/r5+0x14 writes are probably `Coords.X/Y/Z` of
  `overworld_map_object_struct` — but r5+0x24 and r5+7 don't have matching fields. Need to confirm struct layout
  and which struct type Mr. Weather really uses.
- Whether the "0xc" CurState is "show forecast briefly then hand off" or "already-claimed" — only decompiling `sub_80A9568`
  and `object_mrWeatherStep_80A94DC` would settle it.
