name: battle_objectAnimSoundPhase
address: '0x080D27A0'
kind: function
status: probable
summary: 'Battle-object phase handler: plays animation 15 plus sound effect 0x85, waits 24 frames, then
  switches the object to action 0x10.'
interface: (r5 = battle object) -> updates object fields; no return value
details: This is a per-phase state routine for a battle object reached with the object pointer in r5.
  On first entry (PhaseInitialized == 0) it marks the phase started (PhaseInitialized = 4), sets CurAnim
  to 0xF and CurAnimCopy to 0xFF (typically forcing the animation to restart), plays sound effect 0x85,
  advances CurPhase by 4 clamped to at most 8, and loads the timer with 0x18 (24 frames). On subsequent
  calls it just decrements Timer; when it hits zero it clears Param2, sets CurAction to 0x10 and clears
  PhaseInitialized so the next phase re-initializes. The structure is the standard battle object layout
  (PhaseInitialized, CurAnim/CurAnimCopy, CurPhase, Timer, Param2, CurAction offsets). Which specific
  animation/behaviour 0xF corresponds to depends on the object's animation table, not visible here.
