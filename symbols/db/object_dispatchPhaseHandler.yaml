name: object_dispatchPhaseHandler
address: '0x080E5296'
kind: function
status: confirmed
summary: Dispatches a battle object to the handler for its current phase via a two-entry jump table indexed by the
  object's CurPhase byte.
interface: void object_dispatchPhaseHandler(r5=battleObject, r10=context, lr=return) -> results in r5, r8-r12 as
  left by the phase handler; clobbers r0-r4, r6, r7, lr and nzcv
details: 'Trampoline-style dispatcher: reads the object''s CurPhase byte at [r5 + oBattleObject_CurPhase],

  uses it as an index into the two-entry handler table at off_80E52A8 (entries:

  battle_scanPanelRunEnd+1 and battle_phaseWaitTimer2+1, thumb addresses), then calls the

  selected handler with mov lr, pc; bx r1 — passing r0 = phase byte and r1 = handler address,

  with r5 (object pointer) and r10 (context) still holding the caller''s values. The dispatcher

  itself does no real work; everything the phase handler leaves in r5 and r8-r12 passes

  straight through to the dispatcher''s caller via pop {pc}. Phase indices beyond the table''s

  two entries would read garbage out of the table, so callers are expected to keep CurPhase

  in {0,1} while using this path.

  '
