name: object_dispatchPhaseHandler
address: '0x080E5296'
kind: function
status: probable
summary: Calls the current-phase handler of the battle object in r5, dispatching through a two-entry jump
  table indexed by oBattleObject_CurPhase.
interface: (r5 = battle object) -> r0 = phase index passed through to handler; returns handler's r0; lr
  clobbered by manual call
details: 'Loads the address of a jump table (off_80E52A8), reads the object''s current phase byte at oBattleObject_CurPhase,
  fetches the handler address table[phase], and tail-calls it via the mov lr,pc/bx r1 Thumb interwork
  trick, so handlers are ARM/Thumb-safe and lr must be preserved by them. The table has exactly two entries:
  phase 0 -> sub_80E52B0, phase 1 -> sub_80E5304. The callee receives r0 = the raw phase byte (r0 is reloaded
  with it after being used to index), and r5 still points at the object. Any phase value >= 2 would fetch
  garbage, so the object''s phase is expected to stay within {0,1}. It is a generic state-machine stepper
  for this object type, invoked from sub_80E527A in battle routes.'
