name: object_panelHighlightUpdate
address: '0x080DA58C'
kind: function
status: probable
summary: Battle object script that, after a Param2-set delay, repeatedly clears its collision region while
  non-empty and highlights its panel (style from byte_80DA5D0 indexed by Param1), then destroys the object
  when Timer reaches 0.
interface: (r5 = battle object) -> void; destroys object via state when timer expires
details: 'On phase 0 it initializes: sets CurPhase to 4, copies Param2 into the object''s Timer, and returns.
  In phase 4 each frame, it first clears the object''s collision region if CollisionDataPtr reports any
  collision flags, then calls object_highlightPanelRegion with PanelX/PanelY, a highlight type read from
  byte_80DA5D0 indexed by Param1 (table holds 0x8 and 0x2E, so Param1 selects between two highlight styles),
  and AllianceAndDirectionFlip for the side/orientation. It decrements the Timer; when it hits zero it
  clears the collision region again and sets the object''s state field to CUR_STATE_DESTROY. Effectively
  a timed panel-highlight marker object (e.g. showing an affected area before an effect), with no panel-conversion
  work done here.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase] / mov r1,#4 strb: one-time init phase setting Timer from
    Param2; bl object_highlightPanelRegion with PanelX, PanelY, byte_80DA5D0[Param1], AllianceAndDirectionFlip
    shows the highlight purpose; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1 ... bgt: countdown over
    Param2 frames; mov r0,#CUR_STATE_DESTROY str [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]:
    self-destruct when timer ends; byte_80DA5D0: .byte 0x8,0x2E — exactly two highlight types selectable
    via Param1'
  refs:
  - bn6f/asm/asm31.s:74833
  - 0x0801A074 object_clearCollisionRegion
  - 0x0800CCD4 object_highlightPanelRegion
  reproduce: python3 tools/asmcat.py 0x080DA58C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior: phase 0 initializes CurPhase=4 and copies Param2 into
    Timer; phase 4 clears it via object_clearCollisionRegion if CollisionDataPtr flags are set, calls
    object_highlightPanelRegion with PanelX/PanelY, a Param1-indexed byte (0x8/0x2E from byte_80DA5D0),
    and AllianceAndDirectionFlip, then decrements Timer and on 0 clears collision again and sets CurStateActionPhaseAndPhaseInitialized=CUR_STATE_DESTROY.
    However, the proposed name ''battle_panelHighlightUpdate'' starts with ''battle_'' which isn''t an
    accepted prefix; the standard prefix here is ''object'' (as used by the two callees object_*), so
    a more fitting name is ''object_panelHighlightUpdate''.; run wf investigate investigate-20261019-010606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
