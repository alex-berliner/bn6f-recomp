name: battle_getNaviStatWithBonusSaturated
address: '0x0802A11C'
kind: function
status: probable
summary: Returns a navi's signed stat byte at navi-stats offset 0x32 plus a fixed bonus from a 4-byte
  word table indexed by r0 (nonzero entries are 1 at index 0 and 3 at index 4), saturated to the range
  1..9.
interface: '(r0 = table index, word-granular: 0 or 4) -> r0 = clamped stat value (0..9); flags from the
  final cmp/ble/bge are not meaningful to callers'
details: 'r0 is scaled by 4 and used to load a word from byte_802A148, whose only nonzero entries are
  1 (index 0) and 3 (index 4). It loads the battle state from the toolkit (r10) and reads the byte at
  battlestate+0xD (likely the active navi/slot index), then calls GetBattleNaviStatsSignedByte with r1=0x32
  to fetch that navi''s stat at offset 0x32 as a signed byte. The table value is added, then the result
  is saturated: anything above 9 becomes 9, anything below 0 becomes 0 (note the clamp writes 1, not 0).
  The result is returned in r0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: lsl r0,#2 + ldr r4,[r1,r0] with off_802A144 -> word-indexed lookup into byte_802A148 giving
    bonus 1 or 3; ldr r0,[r10,#oToolkit_BattleStatePtr]; ldrb r0,[r0,#0xd]; mov r1,#0x32; bl GetBattleNaviStatsSignedByte
    -> reads navi stat byte 0x32 for battlestate+0xD; cmp r0,#9 / ble ... / cmp r0,#0 / bge ... with mov
    r0,#9 and mov r0,#1 -> saturating clamp to [0,9]; both callers sub_8029344 (0x8029344) and sub_802937A
    (0x802937A) call it, and the beastsp route exercises it, suggesting a battle/beastout-related stat
  refs:
  - bn6f/asm/asm03_0.s:8743
  - 0x08029344 sub_8029344
  - 0x0802937A sub_802937A
  - 0x080136D8 GetBattleNaviStatsSignedByte
  reproduce: python3 tools/asmcat.py 0x0802A11C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code does clamp the result, but the lower branch writes 1, not 0 (line ''mov r0, #1'' at loc_802A13A).
    The proposal correctly notes this, but its summary ''clamped to the range 0..9'' is misleading since
    the floor is 1, not 0. Also, the input is treated as a word-granular index (shifted by 2), not byte-granular;
    the proposal already gets this right but the summary should reflect that it indexes 4-byte slots in
    a 4-byte word table. The callee GetBattleNaviStatsSignedByte is correctly identified, and r10 used
    as the toolkit pointer is plausible.; run wf investigate investigate-20261018-212108; proposed by
    Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
