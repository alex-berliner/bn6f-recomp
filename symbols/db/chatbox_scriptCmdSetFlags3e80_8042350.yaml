name: chatbox_scriptCmdSetFlags3e80_8042350
address: '0x08042350'
kind: function
status: confirmed
summary: Chatbox script opcode handler that sets flag bit 0x80 in the chatbox flags field (0x3E) and steps the script
  cursor past the 1-halfword command.
interface: Next chatbox_scriptCmdSetFlags3e80(void) — called with r4 = script cursor pointer, r1 must be preserved;
  returns r0 = 1 (script continue/advance status), updates N/Z from r0 and C/V from the cursor increment.
details: 'Part of the chatbox script interpreter''s opcode dispatch: each handler receives the script cursor in
  r4 and returns a status in r0 (here 1). This one performs chatbox_setflags_3e(FLAGS_3E_UNK_0080) — OR-ing bit
  0x80 into the chatbox''s flags field at offset 0x3E — then advances the cursor by 2 bytes, i.e. the command takes
  no inline operands (opcode halfword only). r1 is live across the call and preserved; the returned N/Z flags come
  from "movs r0, #1" and C/V from "adds r4, #2", so the dispatch loop apparently inspects flags after each opcode.
  The tail of the function is padded with 2 bytes of 0x00 before the next func.

  '
