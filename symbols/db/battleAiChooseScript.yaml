name: battleAiChooseScript
address: '0x081113C4'
kind: function
status: probable
summary: Chooses the next battle AI script from a countdown value.
interface: (r0 = unused, r1 = unused, r5 = AI data, r6 = battle AI state) -> r0 = selected script ID;
  flags unchanged
details: 'Treats the byte at AI data offset 0x67 as a countdown: values at least 4 are cleared to zero
  and select AI script 4, while lower values select script 8 without modifying the countdown. It writes
  the selected ID to `oAIState_ScriptId` in the AI state structure and returns the same ID. The lack of
  callers leaves the precise countdown semantics and relationship to `battlesweep` uncertain.'
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The function reads `[r5,#0x67]` and branches on whether it is below 4.; It clears `[r5,#0x67]`
    only when that value is at least 4.; It stores either 4 or 8 at `[r6,#oAIState_ScriptId]` and returns
    that value.; Execution on the `battlesweep` route supports a battle-AI role, but no caller is known.
