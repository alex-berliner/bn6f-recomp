name: groundmanMinigameFindActiveEntry
address: '0x08143EDC'
kind: function
status: probable
summary: Looks up the Groundman minigame's per-map entry table and returns the list index of the first
  entry whose event flag is still unset and whose u16 field matches the given value.
interface: (r0 = value to match against entry halfword, e.g. an id/position in the current minigame map)
  -> r0 = 1 if a match found else 0, r1 = matching list index or 0xFF if none; flags clobbered by bl calls
details: 'Calls GetGroundmanMinigameMapIndex to pick one of several entry lists from off_8143804 (indexed
  *4). Each entry is 4 bytes: byte at +0 is 0xFF for the terminator, halfword at +2 is compared against
  the caller''s r6. For entry i it calls sub_8143B5E(i) whose result is fed to TestEventFlag, so that
  callee converts the list index into a global event/story-flag id; entries whose flag is already set
  are skipped. Returns (1, index) for the first unflagged entry matching r6, else (0, 0xFF).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl GetGroundmanMinigameMapIndex then ldr r7,[r7,r0] selects the per-map entry list (asm lines
    3-6); ldrb r0,[r7]; cmp r0,#0xff; beq shows 0xFF-terminated 4-byte-stride entries (loc_8143EEC); bl
    sub_8143B5E with r4 then bl TestEventFlag shows index-to-eventflag mapping and set-flag entries being
    skipped; ldrh r0,[r7,#2]; cmp r0,r6; ... mov r0,#1; pop matches caller value against entry field and
    returns its index; mov r1,#0xff; mov r0,#0 fallback return when all entries are flagged or no match
