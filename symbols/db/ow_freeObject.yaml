  object''s active bit in the global allocation bitfield, marking its slot free, and unmarking it in the
  sprite system. Its shape (save/restore lr around a bl) suggests it exists to be used as a function pointer,
  e.g. a per-object destructor or cleanup callback, rather than being called directly.'
