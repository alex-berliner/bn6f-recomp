name: battle_incrementNaviStatsByte18Saturating
address: '0x0800B7E8'
kind: function
status: probable
summary: Increments the battle navi's NaviStats byte 0x18 by one, clamped to a maximum of 7.
interface: (r0 = battle object pointer) -> r0 = new byte value; flags from the cmp/set
details: Reads byte 0x18 of the NaviStats record for the navi the battle object represents, via GetBattleNaviStatsByte_AllianceFromBattleObject
  (r1 = 0x18 selects the field, alliance flag picks the real record vs its ghost copy). It adds 1 to the
  value and caps it at 7 (cmp r2,#7; ble; mov r2,#7), then writes the result back with SetBattleNaviStatsByte_AllianceFromBattleObject
  using the same field selector. The returned r0 is the clamped new value. No callers are known, so which
  gameplay counter lives at byte 0x18 (e.g. a turn/charge counter capped at 7) is not determinable from
  this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r1,#0x18; bl GetBattleNaviStatsByte_AllianceFromBattleObject — field 0x18 of the object's
    navi stats is read; add r2,r0,#1; cmp r2,#7; ble loc_800B7F8; mov r2,#7 — increment saturated at 7;
    mov r1,#0x18; bl SetBattleNaviStatsByte_AllianceFromBattleObject — same byte written back, honoring
    the alliance-selected record; no caller references — purpose in the battle flow (which counter byte
    0x18 is) is unconfirmed
