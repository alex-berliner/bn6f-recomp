name: t1_0x1b_80BC650
address: '0x080BC650'
kind: function
status: confirmed
summary: State dispatcher for a battle object template (t1 0x1b, the beast-over leap/change object) that jumps to
  the handler selected by the object's CurState byte.
interface: void battle_beastLeapStateDispatch(u32 r2, BattleObject* r5, u32 r10); /* tail-results in r5, r8-r12;
  flags clobbered; calls handler with its own return address so incoming lr is unused */
details: 'Reads BattleObject.CurState (byte at oBattleObject_CurState) from r5 and indexes the jump table off_80BC664
  with it directly (states are already stored as word offsets, e.g. 0, 4, 8). Three states exist: 0 -> battleObject_beastSpecial_init_80BC670,
  4 -> battleObject_beastChangeLeapUpdate_80BC78C, 8 -> object_freeMemory. The handler is invoked with lr = current
  pc (mov lr, pc; bx r1) so it receives this dispatcher''s return address and the dispatcher''s saved lr is only
  used for pop {pc}; the handler effectively tail-returns to the original caller. Arguments r2 and r10 are passed
  straight through to each handler, and handler results come back in r5 and r8-r12. The dispatcher itself touches
  no other object fields or globals. Template id 0x1b corresponds to the beast/Beast-Out transformation leap object
  given the handler names.'
