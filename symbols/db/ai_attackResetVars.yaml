name: ai_attackResetVars
address: '0x08012526'
kind: function
status: probable
summary: AI attack-routine setup that forces easy-tier behavior (no chip use, zero damage) and returns
  0x1c.
interface: (r7 = oAIAttackVars struct, no args) -> r0 = 0x1c; no flags meaningful
details: 'The function writes into the AI attack vars block addressed by r7: it stores 9 into oAIAttackVars_AiDifficultyTier
  (tier 9), 0x78 (120) into oAIAttackVars_ChipUseDelay, and zeroes oAIAttackVars_Damage, then returns
  the constant 0x1c in r0. Writing damage = 0 and a long chip-use delay suggests this is an attack routine
  for a non-damaging/idle enemy behavior, with 0x1c likely a frame duration or next-state value consumed
  by the AI attack dispatcher. The r7 struct is the standard battle AI attack variable block (same fields
  as oAIAttackVars_* in other AI routines).'
