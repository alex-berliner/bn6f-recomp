name: sub_803DCE8
address: '0x0803DCE8'
kind: function
status: hypothesis
summary: Initialise the camera/screen state block (linked from eLinkState) with a layout record and zero-fill the
  two destination buffers.
interface: void camera_init_803DCE8(void *ptr /*r0*/, u32 layout_ix /*r1*/, u8 unk_53 /*r2*/, u8 unk_52 /*r3*/)
  -> (preserves r2,r4-r7; clobbers r0,r1,lr,nzcv)
details: "Operates on a camera state struct anchored at eLinkState (loaded via off_803DD5C = eLinkState); comment\n\
  in disassembly labels the surrounding offsets \"eCamera.unk_*\".\n- Stores r0 to eCamera.unk_70 and eCamera.unk_74\
  \ (the destination pointer / zero-fill byte count).\n- Stores low bytes of r2 and r3 to eCamera.unk_53 and eCamera.unk_52\
  \ respectively.\n- Uses layout_ix << 4 as an index into a 16-byte config table at off_803DC78:\n    cfg[0x0] ->\
  \ eCamera.unk_84\n    cfg[0x4] -> eCamera.unk_88  (zero-fill target #1)\n    cfg[0x8] -> eCamera.unk_8C  (zero-fill\
  \ target #2)\n    cfg[0xC] -> eCamera.unk_50 / .unk_51 (single byte written to both)\n- Then clears a small set\
  \ of fields to 0: eCamera.unk_55, .unk_58, .unk_68.\n- Sets four halfword fields (eCamera.unk_60, .unk_62, .unk_64,\
  \ .unk_66) to 0xFFFF via MVN of #0.\n- Finally calls ZeroFillByByte twice with (eCamera.unk_88, eCamera.unk_74)\
  \ and (eCamera.unk_8C, eCamera.unk_74),\n  i.e. clears the two destination buffers in ptr-sized chunks.\nBehaviour\
  \ is consistent with a \"set up the screen/camera buffer state and clear the visible layer buffers\"\nhelper used\
  \ during scene / link-state initialisation.\n"
