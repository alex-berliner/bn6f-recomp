name: npc_dispatchStateHandler_811979C
address: '0x0811979C'
kind: function
status: confirmed
summary: Trampoline that dispatches an object's state handler, calling the routine selected by the object's state
  byte (r5+9) from a jump table and passing the handler its own address and the state index.
interface: void npc_dispatchStateHandler(Object *obj /* r5 */); clobbers everything, since the handler's register/flag
  results pass straight through to sub_811979C's caller.
details: 'Reads the state byte at [r5,#9], uses it as an index into the word table at off_81197B0

  (referenced via off_81197AC), loads the handler address, then performs

  "mov lr, pc; bx r0" so the handler returns to the pop {pc} epilogue.

  Before branching it sets r0 = handler address (Thumb, table entries are +1) and

  r1 = state index, so the handler receives both. The table currently contains a

  single entry, sub_81197B4+1, so only state 0 is valid; any other state byte

  would fetch garbage from past the table and jump to it. Because all registers

  and NZCV flags the handler leaves are returned unchanged to the caller of

  sub_811979C, this acts as a tail-call-style state machine dispatcher for the

  object held in r5 — the standard pattern for per-NPC/per-object update routines

  in this codebase.

  '
