name: NPCCommand_wait_anim_frame
address: '0x0809F0EC'
kind: function
status: confirmed
summary: Overworld NPC script command that makes an NPC idle until a specified number of animation frames elapse.
interface: void NPCCommand_wait_anim_frame(u32* r5 /*npc_obj*/, const u8* r6 /*cmd_stream*/) -> r0 (npc_disable_script
  result), r6 (cmd_stream+2); clobbers nz,cv r0,r7,lr
details: "Opcode handler dispatched by the overworld NPC script interpreter. Reads the second byte\nof the 2-byte\
  \ command (r6+1) as an unsigned frame count, then:\n  * stores the count at oOverworldNPCObject_Unk_80 on the\
  \ NPC object (R5),\n  * sets the NPC's current action byte to MOVEMENT_FLAG_WAIT_ANIM_FRAME,\n  * clears the 16-bit\
  \ sub-flag at oOverworldNPCObject_MovementFlag_0a_Unk_0b to 0,\n  * calls npc_disableScript0x19_809f51e to disable\
  \ script 0x19 on this NPC.\nAdvances the script pointer by 2 bytes and returns the disable-script result in R0.\n\
  R7 is loaded with the offset of the wait-frame field (oOverworldNPCObject_Unk_80) so the\ninterpreter can address\
  \ it later.\n"
