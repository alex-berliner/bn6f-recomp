name: battle_input_tick_8125784
address: '0x08125784'
kind: function
status: confirmed
summary: 'Per-frame battle-menu input dispatcher: Start+B exits, bit-0 hands off, Select switches state with cue
  7A, otherwise routes cursor navigation to sub_8125820.'
interface: void battle_input_tick_8125784(u32 r0=u8 held, u32 r2=code_param, u32 r5=obj, u32 r10=toolkit); clobbers
  nzcv r0 r1 r2 r3 lr; preserves r4 r5 r6 r7 r10
details: "Reads the joypad via r10->oToolkit_JoypadPtr (r7) and dispatches on\n`pressed` (joy+JOYPAD_PRESSED) and\
  \ `held` (joy+4):\n  1. pressed & (START|B) -> calls menu_confirmExitAndFade_812580C(r0=0x44).\n  2. pressed &\
  \ 1         -> calls sub_81266E0 (dedicated handler).\n  3. held & 0x20 (Select) writes a state byte to obj+2:\
  \ 0x4C if obj+0x64==0,\n     else 0x2C, then plays sound cue 0x7A via playSoundEffect_7A_81258E8.\n  4. Otherwise,\
  \ only if obj+0x68 (cursor ptr) is non-null, the cursor value\n     is temporarily written into the u16 at obj+0x3A\
  \ (old value saved on\n     stack), and sub_8125820(held_without_0xC0_or_full_held, 7, 0, obj, r8)\n     is invoked\
  \ when D-pad held (held & 0x300) OR (D-pad not pressed but\n     held & 0xC0 i.e. A/B held). After the call the\
  \ previous u16 at obj+0x3A\n     is restored and obj+0x70 is updated with the joypad pointer the callee\n    \
  \ returned in r7. No-op when neither D-pad nor A/B is active.\nOff_8125808 holds mask 0x300 (D-pad direction bits).\
  \ Function is the\nper-frame tick of the battle-style menu (chip select / folder menu flow)\nwired into the toolkit\
  \ input pump; subsidiary 0x8125820 performs actual\ncursor/state mutation.\n"
