open_questions:
- What AI data word 0x44 bit 0x800 means exactly (only the "use a chip now" request bit is
- evident).
- The two dispatch case IDs (0x15 and 0x1b) -- these are `useChipRelated_80127C0` return
- values; their precise chip-class meaning isn't directly named.
- Whether `loc_800BF30` is a hit-application call or a sprite-state setter.
- The 0x50 byte stack frame contains 0x10 bytes of "extra" data the dispatch sites read
- (r7+0..0x14), presumably AI attack vars or chip launch context pushed in by
- '`useChipRelated_80127C0`.'
