name: chatbox_advanceNextState_8040C9C
address: '0x08040C9C'
kind: function
status: confirmed
summary: Advances the chatbox's next-state byte at work+0x1F0 — states 0 and 3 hold, any other (interrupted) state
  clears the sub-state at +0x1F2 and restarts at 1.
interface: void chatbox_advanceNextState_8040C9C(Chatbox *work /* r5 */); // preserves r0/r1, returns with r0/r1
  = caller's values, flags c/v left from the final CMP (vs 0 when state was 0, vs 3 otherwise)
details: "Operates on the chatbox work area passed in r5. Reads the state byte at +0x1F0:\n- 0: stays 0 (fresh/inactive\
  \ chatbox).\n- 3: stays 3 (already fully advanced / done).\n- anything else: stores 0 to +0x1F2 (a sub-state/progress\
  \ byte, likely a text-draw or\n  typewriter counter) and reads +0x1F1 (result discarded — kept for parity with\
  \ the\n  original, possibly a dummy read of a hardware-ish or queued byte), then the state\n  becomes 1. The new\
  \ state is written back to +0x1F0 in all cases.\nQuirk: the function pushes r0/r1/lr and pops r0/r1 (plus pc),\
  \ so r0 and r1 are\npreserved for the caller even though they're used as scratch internally. The\ncondition flags'\
  \ c/v outputs depend on which branch was taken (CMP #0 vs CMP #3).\nOffsets used: 0x1F0 (state), 0x1F1 (read,\
  \ unused), 0x1F2 (cleared sub-state).\n"
