name: cb_8049E04
address: '0x08049E04'
kind: function
status: confirmed
summary: Dispatches E-Reader chatbox handling by indexing the current phase byte in eS200A290 into a 3-entry jump
  table to call the matching per-phase handler.
interface: 'void Next(void /* guest regs */); /* inputs: r2 r4 r10 lr; outputs: r4 r5 r6 r7 r8 r9 r10 r11 r12; clobbers:
  nz c v r0 r1 r2 r3 lr; preserved: r4 r5 r6 r7 */'
details: 'Reads the phase byte from eS200A290 (r5 = &phase, r1 = *phase) and uses it to index a fixed 3-entry jump
  table at off_8049E18 whose entries point to chatbox_initNewScreen_8049E28, sub_8049E5C, and sub_8049E84 (each
  stored as thumb address +1). Performs an indirect tail call via `ldr r0,[table,phase]; mov lr,pc; bx r0`, so the
  handler runs with the live guest register file: r0 holds its own table entry word (with thumb bit set), r1 the
  phase byte, r5 the address of the phase byte, and r2/r4/r10 plus any other caller registers flow through unchanged.
  The trailing `pop {r4-r7,pc}` restores r4-r7 to their incoming values, meaning they are NOT visible results in
  spite of the contract listing r4-r7 as outputs (they''re the saved frame). Net register outputs the caller sees
  are r8-r12 as the handler left them. The address suffix 8049E04 is preserved; the cb_ prefix marks a callback
  dispatch site in the disassembly.'
