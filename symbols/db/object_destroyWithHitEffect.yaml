  date: '2026-10-18'
  detail: bl object_spawnCollisionEffect at 0x080D19C6 spawns the hit effect for r5's object before teardown;
    bl object_genericDestroy at end frees reserves/collision/memory, confirming full object destruction;
    bl object_clearCollisionRegion removes the object from its collision region before the destructor;
    ordering effect-then-destroy matches a death/impact cleanup, not a plain despawn
