name: object_destroyWithHitEffect
address: '0x080D19C0'
kind: function
status: probable
summary: 'Battle object teardown: removes collision data, spawns the collision hit effect, clears the
  collision region, then frees the object via the generic destructor.'
interface: (r5 = battle object pointer) -> r0 = destroyed/free object or status; no flags of note
details: 'This is a battle-object teardown sequence run on r5: it first tears down the object''s collision
  data (object_removeCollisionData), then spawns the standard hit-effect object at the object''s last
  collision position with the usual RNG jitter (object_spawnCollisionEffect), clears the object''s collision-region
  byte so it leaves its region (object_clearCollisionRegion), and finally releases panel tile reserves,
  collision data and the object memory via the generic destructor (object_genericDestroy). It is the shared
  ''die and show hit effect'' epilogue for battle objects; the object pointer is passed implicitly in
  r5 by the callees'' convention rather than in r0. No caller is known, so which entities invoke it is
  unresolved.'
