name: scenario_initEffectState_8003962
address: '0x08003962'
kind: function
status: confirmed
summary: Initializes the scenario effect state block at 0x2000780, clearing it on first use and marking it active.
interface: void scenario_initEffectState(void)
details: 'Operates on the 0x48-byte scenario effect state block at 0x2000780 (eScenarioEffectState2000780). Byte
  +2 acts as an "already initialized" flag: if it is zero, the whole 0x48-byte block is cleared word-by-word via
  ZeroFillByWord. After the (optional) clear, byte +3 is unconditionally set to 1 on every call, likely an "effect
  running/enabled" flag. Byte +2 is never written here, so something else must set it to mark the block as initialized
  after the scenario effect data is filled in. Only r0/r1 are disturbed besides the call itself; r2-r7 are preserved.

  '
