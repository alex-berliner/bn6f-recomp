name: battle_objectUpdateFlagBit30Handler
address: '0x0810FDF0'
kind: function
status: probable
summary: 'Battle object per-frame update wrapper: on phase 0, if collision flag bit 0x40000000 is set,
  runs a one-shot helper on the object''s ExtraVars+8 pointer and clears it, then dispatches the normal
  phase update.'
interface: (r5 = battle object) -> r0 = result of phase dispatch; clobbered lr/r0-r3
details: This is an object update entry point (r5 = battle object, no r0 input). It reads oBattleObject_CurPhase;
  only when the phase is 0 does it call object_getFlag and test the flag word against 0x40000000. If that
  bit is set, it loads the pointer at oBattleObject_ExtraVars+8, passes it to sub_80C10E8, and then writes
  0 back to ExtraVars+8, making the action one-shot until something re-stores a pointer there. Control
  then always falls into battle_objectUpdateDispatchPhase_80165C2, so the flagged action is an extra step
  performed before the regular phase-handler dispatch, not a replacement for it. sub_80C10E8 is opaque
  here, so the exact effect of the triggered action is unknown.
