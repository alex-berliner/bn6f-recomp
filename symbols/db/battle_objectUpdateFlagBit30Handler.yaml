- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; cmp r0,#0; bne skip - action gated on phase 0; bl object_getFlag;
    ldr r1,=0x40000000; tst r0,r1; beq skip - tests collision flag bit 30; ldr r0,[r5,#oBattleObject_ExtraVars+8];
    bl sub_80C10E8; mov r0,#0; str r0,[...] - one-shot call using and clearing the ExtraVars+8 field;
    loc_810FE0C: bl battle_objectUpdateDispatchPhase_80165C2; pop {pc} - standard update dispatcher always
    runs afterwards'
