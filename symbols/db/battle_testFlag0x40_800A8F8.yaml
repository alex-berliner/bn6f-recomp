kind: function
status: confirmed
summary: Returns 1 if battle flag 0x40 is set, otherwise 0.
interface: int sub_800A8F8(void); // r4/lr preserved internally; r0 = flag (0 or 1)
details: 'Thin wrapper around TestBattleFlag_0x40: calls the flag test, normalizes the result to a clean 0/1 in
  r4, then returns it in r0. No other registers, memory, or structures are touched. The final `mov r0, r4` is encoded
  as `adds r0, r4, #0`, so the NZ flags reflect the returned value and C/V are cleared on exit — callers reading
  flags see them as the result of the return value, not of the flag test itself.

  '
