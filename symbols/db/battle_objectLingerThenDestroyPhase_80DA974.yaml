name: battle_objectLingerThenDestroyPhase_80DA974
address: '0x080DA974'
kind: function
status: confirmed
summary: 'Death-linger phase for a battle object: publish a parameter to the battle state, play animation 1 for
  90 frames with collision disabled, then switch the object to the DESTROY state.'
interface: void sub_80DA974(r5 = BattleObject*, r10 = Toolkit*) ; returns in r0 the decremented timer (or CUR_STATE_DESTROY=8
  on the destroy path), in r1 the object's Param1 on the setup path, and NZ(+C,V) from the timer decrement / destroy-state
  load
details: "Standard per-frame state-action handler for a battle object in some \"dying/lingering\" phase,\nusing\
  \ the common phase-initialized pattern (PhaseInitialized at +? equals 4 once set up).\n\nOne-time setup (PhaseInitialized\
  \ == 0):\n  - loads the toolkit's battle state pointer (r10 + oToolkit_BattleStatePtr) and stores the\n    object's\
  \ halfword Param1 (+4) into battle state halfword field oBattleState_Unk_36 (+0x36),\n    i.e. it communicates\
  \ some value (id/param) to the battle state for this object;\n  - sets CurAnim (+?) = 1 (switches the object to\
  \ animation 1, presumably a death/fade pose);\n  - loads Timer (+?) = 0x5A (90 frames, ~1.5 s);\n  - calls object_clearCollisionRegion(r5),\
  \ so the lingering object no longer collides;\n  - stores PhaseInitialized = 4.\n\nEvery frame afterwards:\n \
  \ - decrements Timer; if it is still > 0 the object just keeps animating;\n  - when the timer reaches <= 0, stores\
  \ CUR_STATE_DESTROY (8) into\n    oBattleObject_CurStateActionPhaseAndPhaseInitialized (+8), sending the object\
  \ through the\n    usual destroy state next frame.\n\nQuirk: the low byte of the destroy store doubles as writing\
  \ PhaseInitialized = 8 (destroy),\nwhich is what actually prevents the setup block from running again.\n"
