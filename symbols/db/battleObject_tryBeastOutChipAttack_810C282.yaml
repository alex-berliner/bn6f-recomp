open_questions:
- The exact semantics of `0x12c` (turns vs frames vs an internal counter) — comparing
- it with a sibling beast-out handler in another BN6 version would settle it.
- Whether the chip id mask drops element bits intentionally or is just defensive;
- a higher-level view of the chip id format would confirm.
