  date: '2026-10-14'
  detail: '- `bl battle_getSelectedChipForUse_800ED90` at the head reads the selected chip and a count;
    `tst r3, r3; beq loc_810C2AE` short-circuits when no chip is selected. - `ldr r1, off_810C34C // =0x12c;
    cmp r0, r1; blt loc_810C2AE` enforces the 0x12c threshold on `oBattleState_Unk_40`. - Sequence `bl
    somethingWriteChipParams_80126E4` then `bl object_setAttack0` then `bl battleObject_decrementChipHeldAndClearChip_800F322`
    is exactly the "execute chip attack" pipeline, with `mov r6, #1` confirming success is reported via
    r6. - Only caller is `sub_810C212`; captured calls land from snap_beastsp_* which are beast-SP related
    traces, supporting the beast-out interpretation. - Register contract `out=[''r0'',''r1'',''r4'',''r5'',''r7'']`
    with r6 used internally matches a small bool-returning helper.'
