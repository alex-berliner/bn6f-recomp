name: ai_resetAnimOnFrameFlag
address: '0x08111BC8'
kind: function
status: confirmed
summary: When a battle object's current animation reaches its reset frame (bit 7 of the frame parameters), restarts
  the animation and clears the AI attack's hit element.
interface: void ai_resetAnimOnFrameFlag(BattleObject *object /* r5 */, AIAttackVars *aiVars /* r7 */); returns r1
  = 0x80
details: 'Calls sprite_getFrameParameters with the battle object in r5 and tests bit 0x80 of the returned frame
  parameters (the "animation finished / reset on this frame" flag). If set, it writes 0 to object+oBattleObject_CurAnim
  (forcing the object''s current animation back to 0, i.e. restarting/resetting the animation) and stores 0x10 into
  aiVars+oAIAttackVars_HitElement (16-bit store), presumably clearing the element of a pending/enqueued AI attack
  hit to the "none/neutral" value 0x10. If the flag is clear, nothing is modified. Quirk: r1 is left holding 0x80
  on return (the mask used for the tst), so callers apparently receive that fixed value in r1; r0/r2/r3, the flags
  and lr are clobbered, no other registers are preserved.

  '
