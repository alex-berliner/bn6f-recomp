name: ai_resetAnimOnFrameFlag
address: '0x08111BC8'
kind: function
status: probable
summary: Checks the current sprite frame's attribute flag (bit 0x80); when set, rewinds the object's animation
  to frame 0 and writes 0x10 into a second object's field.
interface: (r5 = battle object, r7 = second object/vars struct) -> r0 = clobbered by call; no meaningful
  return, flags clobbered
details: Calls sprite_getFrameParameters for r5's current animation frame and tests bit 0x80 of the returned
  attribute byte. If the bit is clear the routine does nothing; if set, it stores 0 into r5's oBattleObject_CurAnim
  (rewinding the animation to its first frame) and stores 0x10 into the halfword field oAIAttackVars_HitElement
  of r7. Both r5 and r7 are supplied by the (unknown) caller. The meaning of the 0x10 write is unclear
  — the HitElement naming may be a mislabel of r7's struct. Likely a per-frame animation handler enforcing
  a one-shot/loop-reset behavior plus a state change when the marked frame plays.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_getFrameParameters; tst r0,#0x80 — reads frame attribute byte and tests its top bit;
    strb r0(=0),[r5,#oBattleObject_CurAnim] — resets the object''s animation frame counter to 0; strh
    #0x10,[r7,#oAIAttackVars_HitElement] — writes constant 0x10 into a field of a second struct; beq locret
    skips both writes when flag clear — the whole body is conditional on that one bit; no known callers;
    r5/r7 are never set inside, so their roles are inferred from field names only'
  refs:
  - bn6f/asm/asm32.s:7876
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x08111BC8
