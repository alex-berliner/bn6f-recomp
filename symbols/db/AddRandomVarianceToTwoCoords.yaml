name: AddRandomVarianceToTwoCoords
address: '0x0801BDDE'
kind: function
status: confirmed
summary: Jitters two coordinates by a centered random offset (range set by a mask), applied in the high half of
  a fixed-point value, using one GetRNG roll for both.
interface: void AddRandomVarianceToTwoCoords(u32 mask in r0, s32* coordA in r1, s32* coordB in r3); returns updated
  r1 and r3; r2, r4, r6, r7 preserved; clobbers r0 and the NZCV flags
details: 'Calls GetRNG once, saving r0-r3 around the call so the mask and both input coordinates survive GetRNG''s
  register use (r4/r6/r7 are saved at entry for the same reason). The random offset for each coordinate is ((rng
  & mask) - (mask >> 1)), i.e. centered on zero and spanning roughly -mask/2 .. +mask/2. Coord A (r1) uses the low
  16 bits of the RNG roll, coord B (r3) uses the high 16 bits, so a single RNG call yields two independent-looking
  jitter values. The offset is shifted left by 16 (lsl #0x10) before being added, meaning the coordinates are treated
  as 16.16-style fixed point with the jitter applied to the integer/high half; callers pass pre-shifted coordinates.
  No memory or game structures are touched - it is a pure math helper, most plausibly used to add slight positional
  scatter to sprites/effects spawned at a point (e.g. random spread on projectiles or particles).

  '
