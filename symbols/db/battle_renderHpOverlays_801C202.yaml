open_questions:
- Whether byte_203EB50 is an array of "HP overlay state" structs or holds AIData pointers; the +0xC slot
  loaded as a pointer into projectObjectToScreen suggests AIData ptrs, but the +4/+5 signed byte offsets
  feel more like a local per-overlay layout.
- What the "0x4" branch (bit2) actually represents — likely "use absolute on-panel coords (cursor/HUD
  variant)" vs the normal "project battle object" path; no symbol hints at this.
- Exact meaning of [sp,#4] when zeroed — probably a "hide this slot" / "force skip this tile group" flag
  for single-enemy or first-turn-no-portrait cases; needs caller context to confirm.
