  date: '2026-10-19'
  detail: bl object_getFlip then lsl r0,#24; add r4,r4,r0 folds facing into r4 = 0x10010|(flip<<24); add
    r0,#0x34 + r5; ldmia r0!,{r1-r3} loads three fields of the battle object as spawn args; r6=0xC3FF,
    r7=0x14 set right before bl spawnIllusionObject_80E33FA; sole caller sub_80CB6B0 sits immediately
