name: spawn_flippedIllusion
address: '0x080CB6CA'
kind: function
status: probable
summary: Spawns an illusion/copy object of battle object r5, folding the object's facing into the spawn
  parameter word.
interface: (r5 = battle object) -> r0 = spawn result; r4-r7 and 0xC3FF mask passed to spawnIllusionObject_80E33FA
details: 'Reads the object''s effective facing with object_getFlip, sign-shifts it into the top byte of
  a parameter word (0x10010 + flip<<24), copies three consecutive fields at r5+0x34 (likely position/coordinates)
  into r1-r3, sets r6 = 0xC3FF and r7 = 0x14, and calls spawnIllusionObject_80E33FA. The 0xC3FF value
  looks like a flag/mask word and 0x14 the illusion object kind. Trailing byte table (4,5,0x4B / 4,5,0x63)
  looks like separate constant data, not part of the routine. The lone lsl #24 (without a matching asr)
  is the flip byte placed in the parameter''s high byte.'
