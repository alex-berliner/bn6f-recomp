name: ai_attackDelayedElementDispatch
address: '0x081027A4'
kind: function
status: probable
summary: Dispatcher that jumps to the per-state handler for a delayed-element AI attack, indexed by the
  attack's hit element/state field.
interface: (r7 = attack/object struct, r0 clobbered = element index read from oAIAttackVars_HitElement)
  -> jumps to one of three handlers with r0 = element value, r7 preserved; returns via handler to caller's
  lr
details: 'Reads the byte oAIAttackVars_HitElement at [r7, #offset], uses it to index the three-entry table
  off_81027B8, and calls the selected handler via `mov lr, pc; bx r1` so the handler returns to this function''s
  caller. The three targets are ai_attackDelayedElementInit, sub_81027F4, and ai_attackWaitForObjectTimer,
  suggesting a small state machine (init / interim state / wait-for-object-timer) for an elemental attack
  that spawns an object after a delay. r0 is overwritten with the element index before the call, so handlers
  receive the element as an argument; r7 serves as the context pointer throughout. Since lr is set to
  the current pc (thumb, so bit 0 set via +1 entries), handlers are thumb and tail-return to the original
  caller.'
