kind: function
status: probable
summary: AI step that loops (up to 3 attempts) calling a row-object picker using the actor's PanelY and
  returns 0 to retry or 2 after resetting the attempt counter.
interface: (r0 = unused, r5 = battle object, r6 = AI work struct) -> r0 = 0 if an object was picked, 2
  if the attempts were exhausted; no flags of interest
details: 'This is an AI/state-machine step: it first stores 8 (a frame delay or next-state id) into the
  work struct at [r6], then reads the attempt counter at [r6,#4]. While the counter is <= 2 it calls battle_pickRandomRowObjectFields_810971A
  with the object''s PanelY field, letting the callee choose a row from alliance-dependent panel parameters
  and return an id/attribute pair. If the callee reports no pick (r0 == 0) the function returns 0 so the
  caller can retry or proceed; otherwise it resets the counter at [r6,#4] to 0 and returns 2, signalling
  the AI to move on (probably after 3 failed attempts).'
