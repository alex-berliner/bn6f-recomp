name: NPCCommand_init_hop
address: '0x0809EE82'
kind: function
status: confirmed
summary: Overworld NPC script "hop" command — reads speed/distance operands and starts the NPC on a hop/leap action.
interface: void NPCCommand_init_hop(NPC* r5, const u8* r6 /* script ptr */, ...); returns r0 = result of the script-disable
  call, r6 advanced by 3, NZC set from ADD r6,#3
details: 'Handler for the "hop" NPC script command (opcode at [r6], operands follow). Copies operand byte 1 into
  oOverworldNPCObject_MovementSpeed (+4) and operand byte 2 into oOverworldNPCObject_MovementDistance (+5), sets
  CurAction (+9) to MOVEMENT_FLAG_HOP_OR_LEAP (8) so the object''s movement routine starts hopping, and zeroes the
  16-bit movement-flag field at +0x0a/0x0b. Then calls npc_disableScript0x19_809f51e, which stops further script
  execution for this NPC until the hop finishes (the 0x19 script channel). Finally the command pointer is advanced
  by 3 (opcode + 2 operands); because this handler family returns via flags, the ADDS to r6 leaves NZ,C,V set from
  that addition and r0 holds whatever the disable call returned. Callers are expected to store r6 back as the (now
  disabled) script cursor.

  '
