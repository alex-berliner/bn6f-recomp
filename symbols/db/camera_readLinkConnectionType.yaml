open_questions:
- Exact layout/meaning of the 0x10-byte link-camera structure beyond the u16 at +8 (whether +8 alone is
  the connection type or also covers state bits).
- Whether the second read at original+0x18 is truly the 'remote' side or an extended/echo field of the
  same slot.
