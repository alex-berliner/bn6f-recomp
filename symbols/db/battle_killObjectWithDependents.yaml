name: battle_killObjectWithDependents
address: '0x080E13DC'
kind: function
status: probable
summary: 'Tears down a battle object: conditionally sets the delete flag on itself, flags its last-hit
  and linked objects for deletion, resets its AI state, and dispatches an event.'
interface: (r0 = battle object) -> r0 = clobbered; sets oObjectHeader_Flags bit 1 on self/related objects,
  dispatches event 2
details: Takes the object's collision-data flag word and, only if bit 0x4 is clear AND the opposing alliance's
  player is not blind (battle_findPlayerByAlliance_800EB6C returns 0 for blind), sets bit 0x2 in the object's
  own header flags — the same bit it then forces onto the collision data's LastHitObjectPtr and the object
  at collision+0x4C unconditionally. It clears an AIData 0x48 flag (value from byte_80E1518 = 0), deletes
  the AI subordinate object via sub_80E0DD0, and sets the subordinate AI object's active flag (sub_80E0F28).
  If the object's network-inverted alliance check yields != 1 it calls dispatch_801DA48 with event 2.
  Finally, if AIData_AIScriptOffset is nonzero, it calls sub_80C4C4C, presumably to reset/restart the
  AI script. The blind-conditional self-flag suggests the flag relates to visibility/erase semantics rather
  than plain free-list deletion.
