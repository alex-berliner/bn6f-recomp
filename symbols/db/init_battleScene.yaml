name: init_battleScene
address: '0x08038630'
kind: function
status: probable
summary: 'Initializes a battle scene: clears chatbox, applies palette 0xd, sets DISPCNT 0x1340, resets
  graphics/fade state, starts BGM 0x63 and a (8,8) screen fade, then writes 4 to a scene-state byte.'
interface: (r0 = palette index 0xd, r5 = pointer to scene-state byte) -> r0 = clobbered; sets [r5] = 4
details: This is a whole-scene graphics/music bring-up routine. It first calls chatbox_8040818 (clearing/resetting
  chatbox state), applies overlay palette 0xd, and writes DISPCNT value 0x1340 (BG0+BG1+BG3 on, OBJ 1D
  mapping) via SetRenderInfoLCDControl. It then zeroes the render-info sprite counters (renderInfo_8001788/_80017A0),
  does a full graphics reset (resetAllGraphicsState_8005F40), runs a setup step with work-area clear,
  initializes the battle-fade gfx state and initGfx_80386CC. Finally it queues music 0x63, sets SetScreenFade(8,8)
  to start a fade, and stores 4 into a byte at [r5] (preserved from entry, likely a scene/phase state
  field in a caller-owned struct).
