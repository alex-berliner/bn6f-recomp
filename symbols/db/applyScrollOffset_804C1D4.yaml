name: applyScrollOffset_804C1D4
address: '0x0804C1D4'
kind: function
status: confirmed
summary: Applies an indexed scroll delta (from parallel X/Y addend tables) to an object's local X/Y offsets and
  to the toolkit RenderInfo scroll registers.
interface: 'void sub_804C1D4(void);  // in: r5 = caller object (offsets at +0x15, +0x16), r10 = toolkit (RenderInfoPtr
  at oToolkit_RenderInfoPtr); out: r5 unchanged; clobbers nz c v r0 r1 r2 r3; preserves r4 r5 r6 r7'
details: "Reads a screen/menu index byte from the absolute address 0x2013965 (the\ntable at byte_804C20C begins\
  \ with 0x04, so the loader offsets into it by\n5 to land on the 0x60 entry). Uses that index to fetch an 8-bit\
  \ X addend\nfrom dword_804C208 (interpreted as a byte table) and an 8-bit Y addend\nfrom byte_804C20C.\n\nThen:\n\
  \  * Adds the X addend to the caller's object byte at r5+0x15 (stored back\n    as a byte) and to the RenderInfo\
  \ 16-bit scroll register at\n    render+0x14, where 'render' = [r10 + oToolkit_RenderInfoPtr].\n  * Adds the Y\
  \ addend to r5+0x16 and to render+0x16, same pattern.\n\nBecause the ARM `add r0, r0, r3` uses the full 32-bit\
  \ sum before\ntruncation, the low byte of the sum is what is written to the object\nwhile the full 32-bit sum\
  \ is added to the RenderInfo scroll - so a\ncarry out of the object byte propagates into the scroll register.\n\
  The X addend table is stored as a dword (0x0404FCFC) but is actually\nread byte-wise, so on little-endian GBA\
  \ the bytes come out as\n{0xFC, 0xFC, 0x04, 0x00}. Indexing into byte_804C20C with the\nsame index yields the\
  \ matching Y values {0x04, 0xFC, 0xFC, 0x04, ...}.\n\nLikely used by a scrollable UI/menu object that needs both\
  \ its own\noffset bookkeeping and the toolkit's BG scroll to move in lockstep.\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
