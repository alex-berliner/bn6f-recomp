status: confirmed
summary: Overworld player per-frame dispatcher; bypasses the real handler when the player's substate jumptable index
  is 0x10 (locked/skip-this-tick), otherwise falls through into the real per-frame handler at eStruct200ace0.
interface: void sub_809DF28(struct OWPlayerObject* r5) -> uint8_t r0; clobbers r7, nz, c, v
details: 'Pushes lr, loads R7 with off_809DF40 (=eStruct200ace0, the fall-through target). Reads the byte at R5+oOWPlayerObject_JumptableIndex_09
  and compares to 0x10 (this is the locked/skip substate). Equality returns 0 immediately via pop {pc}. Inequality
  falls through to the real per-frame handler at eStruct200ace0 (tail-call style: pop {pc} into the handler). R7
  is preserved across the call so callers can detect which path was taken. Stack frame is the standard push/pop
  lr pair (4 bytes), not 32 as the lifted pseudocode shows.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
