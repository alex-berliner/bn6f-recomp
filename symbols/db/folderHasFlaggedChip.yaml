name: folderHasFlaggedChip
address: '0x08130780'
kind: function
status: probable
summary: Returns 1 if any chip in the active folder's 30-chip list has chipdata[0x16]&0x10 set, else 0;
  r1 = list pointer past header.
interface: () -> r0 = 1 if a chip with chipdata[0x16]&0x10 was found (checked in loop order), else 0;
  r1 = pointer to the scanned list (base+0x20); no flags
details: 'sub_803DD60 decides which of the two lists at unk_202714C/unk_20270EC is scanned (some game-state
  switch, e.g. which folder is active). Each halfword entry is unpacked by split9BitsFromBitfield_8021AE0
  and the 9-bit chip ID is looked up in the static 206-entry chip database via getChip8021DA8. Only the
  low 9-bit half is actually used for the lookup; the high half is discarded. The test is ldrb [chipdata,#0x16],
  tst #0x10: any chip with that attribute bit ends the scan with r0=1. If all 30 halfwords fail the test,
  r0=0. The returned r1 always points at the list start, so callers can re-walk the list to find the matching
  entry.'
