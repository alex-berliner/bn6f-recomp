name: ai_dispatchAttackStepByElement
address: '0x0810478C'
kind: function
status: probable
summary: Runs the AI attack step handler selected by the current attack's element, dispatching into a
  per-element jump table.
interface: (r7 = AI attack vars struct, r0 = oAIAttackVars_HitElement element id) -> returns whatever
  the selected element handler returns; flags clobbered
details: Reads the byte element id at [r7,#oAIAttackVars_HitElement], uses it to index the 8-entry thumb
  function-pointer table off_81047A0, and calls the handler with LR trickery (mov lr, pc; bx r1) so control
  returns to this function which then pops {r7,pc} — effectively a tail call. r7 is left untouched so
  the element handlers inherit the AI attack-vars struct pointer. Handlers include per-element routines
  like ai_chargeDashAttackStep (charge/dash attacks, e.g. Fire/Elec style) and ai_attackHoldOnPanel. The
  table has exactly 8 entries matching the game's element count; no bounds check is performed, so element
  ids must be pre-validated.
