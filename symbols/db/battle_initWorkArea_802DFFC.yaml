name: battle_initWorkArea_802DFFC
address: '0x0802DFFC'
kind: function
status: confirmed
summary: Clears the battle work buffer and hooks up the battle object table at the start of battle setup.
interface: void battle_initWorkArea(void) /* preserves and returns r2/r3/r4 untouched */
details: 'Part of battle initialization: it zero-fills the 0x3A0-byte battle work buffer at 0x2036120 (0xE8 words
  via ZeroFillByWord), then stores the address of battle object 0 (eT1BattleObject0) into the battle state structure
  at 0x20362F0 field +0x44 (0x2036334), establishing the pointer to the battle object table. Finally it calls zeroFill_802E544,
  which zeroes an additional structure (described as an allied/related block). r2, r3 and r4 are never read or written,
  so callers'' values pass through unchanged; only r0/r1, flags and lr are clobbered.

  '
