name: background_drawPresetTileBlock_801C9C8
address: '0x0801C9C8'
kind: function
status: confirmed
summary: Copies one entry (a 4x2 block of 8x8 tile ids) from a preset background table into tile block 3 of the
  background layer at column r0, fixed row 2.
interface: void background_drawPresetTileBlock(u32 j /* dest column */, u32 backgroundId /* entry index */)
details: 'Takes a destination column j in r0 and a background id in r1. Indexes the table byte_801D964 with (backgroundId
  << 4), so each entry is 16 bytes / 8 halfword tile ids... actually the copy uses CopyBackgroundTiles with j_size=4
  and i_size=2, i.e. a 4x2 tile block of halfword ids (32 bytes per entry, consistent with the 0x10 halfword stride
  only if entries overlap the table differently — see open questions). Calls CopyBackgroundTiles(j=r0, i=2, which_tile_block_32x32=3,
  tile_ids=byte_801D964 + id*16, j_size=4, i_size=2), so the block always lands at row i=2 in tile block 3, with
  only the column varying. r4/r5 (caller''s, also used as scratch for j_size/i_size) are saved and restored around
  the call, so caller r4/r5 are preserved. The table at byte_801D964 holds the premade tile-id patterns; the id
  selects which pattern is drawn. This looks like stamping a fixed decorative chunk (e.g. a section of a background
  strip) at a caller-chosen horizontal position of the BG map.

  '
