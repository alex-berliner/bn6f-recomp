name: battle_object_postAction4CheckClearFlags_801BA92
address: '0x0801BA92'
kind: function
status: confirmed
summary: After a battle object finishes action 4, clears its flag2 bits and collision counter once its "done" condition
  is met.
interface: int battle_object_postAction4CheckClearFlags_801BA92(struct BattleObject* obj /* r5 */); returns 0 (not
  action 4), 1 (action 4 but still flagged/waiting), or 2 (flags just cleared); r4 preserved, r0-r3 clobbered, flags
  clobbered
details: 'Reads the battle object''s current action (oBattleObject_CurAction at offset 9 in the object struct pointed
  to by r5). If the action is not 4, returns 0 without touching anything. If it is 4, calls object_getFlag2 and
  tests bit 14 (0x4000): if that bit is set, the object is left alone and 1 is returned. Otherwise the same getter
  is called again and bit 1 (0x2) is tested; if it is clear, the object is left alone and 1 is returned. If bit
  1 is set, it calls battle_object_clearFlagsAndCollisionCounter_801A284, wiping the object''s flag state and its
  collision counter, and returns 2. So action 4 looks like a transient state (hit/flinch/teleport- style one-shot
  action) that stays pending until bit 14 of flag2 drops, then requires bit 1 to still be pending before the flags
  and collision counter are reset to let the object resume. r1 leaks the last mask value used (1<<14 or 2) on the
  flag-testing paths.

  '
