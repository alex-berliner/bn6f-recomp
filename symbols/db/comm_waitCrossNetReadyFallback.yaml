name: comm_waitCrossNetReadyFallback
address: '0x0802B9B8'
kind: function
status: probable
summary: 'State handler for the link/cross-net battle wait: if the linked partner isn''t ready yet, transitions
  to a fallback state (0x18) with a screen fade.'
interface: (r5 = task/state struct, fields +1 byte and +2 halfword) -> void; reads comm_checkCrossNetBattleReady_801E754
  result
details: Calls comm_checkCrossNetBattleReady_801E754; if it returns nonzero (partner/session ready) the
  function does nothing and just returns, keeping the current state. If it returns 0, it writes 0x18 to
  the byte at r5+1 (apparently a next-state/mode selector in the task struct), zeroes the halfword at
  r5+2 (likely a frame timer/substate), and starts a screen fade via SetScreenFade(0x10, 8) — 0x10 presumably
  a fade-out mode with 8 as its speed/duration. The struct in r5 is set up by the caller, which is not
  yet identified. No other fields or globals are touched.
