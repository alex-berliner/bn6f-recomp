open_questions:
- Exact identity of `Barrier` values 8/0xa/0x10 in the broader battle script vocabulary (Wood panel, Aqua
  panel, broken?); only the numeric discriminators are visible.
- What `oCollisionData_Unk_6c & 0xa20` and byte +0x77 bit 0x20 represent (probably elemental/status flags);
  the function only checks them as a guard.
- Whether `oCollisionData_Unk_17` is a fixed HP-style value or a counter captured elsewhere — the comparison
  `cmp r0, r1; blt` then `sub`/`strb` then `bgt loc_801A96E` is consistent with "deal damage each frame,
  but never less than zero remaining".
