name: chatbox_selectCompTextByMap_80407C8
address: '0x080407C8'
kind: function
status: confirmed
summary: Resolves the LZ77-compressed chat/dialogue script for the current (mapGroup, mapNumber) at story progress
  stage 4, branching on real-world vs. internet maps.
interface: "/* chatbox_selectCompTextByMap (r10 = toolkit ptr) -> *const LZ77Compressed<TextScriptArchive> */\n\
  void chatbox_selectCompTextByMap(uint32_t toolkit);   /* in: r10=toolkit, out: r0=text, r2=16, r3=slotAddress\
  \ */\n                                                    /* clobbers: r1, N/Z/C/V (from final ldr addr calc)\
  \ */\n                                                    /* preserved: r4-r7, lr */\n"
details: 'Reads the current map group/number from the GameState block reached via oToolkit_GameStatePtr

  (fields oGameState_MapGroup, oGameState_MapNumber). Uses the group to pick a world table:

  real-world for group < 0x80 (index 0 -> off_realWorld_8044470) and internet for group >= 0x80

  (index 1 -> off_internet_80444C4), subtracting 0x80 (INTERNET_MAP_GROUP_START) so the internet

  table is indexed from 0.


  The selected world table is a pointer to a per-map-group array; each group entry is a pointer

  to a per-map-number array; each of those maps to 5 (LZ77Compressed<TextScriptArchive> *) slots

  indexed by story progress. The function always reads index 4 (the last/script slot), so it

  effectively returns the "stage-4" compressed text archive for the current map.


  The returned r3 is the address of that slot within the table (kept so callers can branch on

  the flags from the final ldr address-add to detect presence/completion), and r2 holds 0x10

  (4*sizeof(u32), the stage-4 offset added). The "byte_8040808" blob after the pointer tables

  is unreferenced dead data.

  '
