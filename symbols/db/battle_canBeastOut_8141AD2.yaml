open_questions:
- The exact meaning of the 4-entry whitelist (0x91, 0x191, 0x291, 0x388) is not verified — could be a
  packed MapGroup,MapNumber or some other field; the comparison only uses MapGroup so the low byte is
  effectively unused.
- Whether EVENT_701 being set is "beast-out already unlocked but disabled here" vs. "story too far / wrong
  chapter" is unknown.
