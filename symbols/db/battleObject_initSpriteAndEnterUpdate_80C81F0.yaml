name: battleObject_initSpriteAndEnterUpdate_80C81F0
address: '0x080C81F0'
kind: function
status: confirmed
summary: Initialize a battle object's sprite (position via panels, Z, tiles, anim 0xD, palette, flip)
  and set its state-action phase to CUR_STATE_UPDATE.
interface: void sub_80C81F0(BattleObject *r5 /* in/out */); clobbers r0–r3, lr, N Z C V
details: 'Repositions the object using object_setCoordinatesFromPanels so its screen coords match its
  panel grid slot. Clears oBattleObject_Z16 to 0 (normal depth plane). Loads 8 tiles and 0xC palette entries
  with sprite_load using tileBase 0x80, then calls sprite_noShadow so no drop-shadow sprite is attached.
  ORs 0x02 into oObjectHeader_Flags (likely a "sprite ready" / "visible" flag). Sets oBattleObject_CurAnim
  and oBattleObject_CurAnimCopy to 0xD, then runs sprite_setAnimation and sprite_loadAnimationData to
  bring the corresponding anim frames into VRAM. Applies palette index 0 via sprite_setPalette. Mirrors
  the sprite to the object''s facing with object_getFlip + sprite_setFlip. Finally writes CUR_STATE_UPDATE
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the dispatcher enters the Update sub-phase
  on the next tick. r5 (the BattleObject pointer) is the only preserved register; all other arg registers
  and lr are clobbered.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
