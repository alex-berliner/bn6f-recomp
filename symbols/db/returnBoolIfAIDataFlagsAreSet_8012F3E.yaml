name: returnBoolIfAIDataFlagsAreSet_8012F3E
address: '0x08012F3E'
kind: function
status: confirmed
summary: Returns 1 when the current AI data reports the A button held (0x44 flag word free of 0x1000002F bits, 0x48
  word with 0x200 clear and 0x10 set), else 0.
interface: 'bool checkAIData(void); // in: r5 = AI data pointer (passed through to the flag getters); out: r0 =
  0/1, NZ flags set from r0; r3 left over from the last callee'
details: 'Wraps two flag-word reads on the AI data struct pointed to by r5. First calls GetAIData_Unk_44_Flag and
  fails (returns 0) if any bit of mask 0x1000002F is set in the 0x44 flag word. Then calls GetAIDataUnk0x48Flag:
  returns 0 if bit 0x200 is set, and returns 1 only if bit 0x10 is set. So the "A held" condition is 0x44 & 0x1000002F
  == 0 AND 0x48 & 0x200 == 0 AND 0x48 & 0x10 != 0. The individual bit meanings of the 0x44/0x48 words are not known
  from this function alone; the 0x10 bit is the one treated as "A button held". NZ flags are written from the boolean
  result so callers can branch directly on it without re-testing r0.'
