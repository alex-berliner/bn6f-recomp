name: clear_gameStateForNewScene
address: '0x08005DF0'
kind: function
status: probable
summary: Full reset of game state, objects, graphics and global work structs when transitioning into a
  new scene/area, ending with reloading the PET navi's HP.
interface: () -> r0 = ...; no meaningful return, clobbers r4-r7
details: Reads the toolkit's GameState pointer and stores NULL into its field at +0x20, then frees all
  objects of type 0x25 via FreeAllObjectsOfSpecifiedTypes. Calls resetAllGraphicsState_8005F40 (VRAM/WRAmbuffers,
  palettes, render info, dummy BG scroll callbacks) and runSetupStepAndClearWorkArea_8005F6C (sub_802FDB0
  + cleareMemory_802FF2C). Reinitializes the battle-fade gfx state struct, zero-fills the fixed 0x50-byte
  global at eStruct200a6a0, initializes the scenario effect state block at 0x2000780, and zero-fills via
  zeroFill_8003AB2. Calls sub_8138294 (purpose unknown) and finally reloadCurNaviStatBoosts_813c3ac, which
  clamps/heals the current PET navi's HP to MaxHP. The whole sequence matches a scene/area load or reload
  rather than a single subsystem init.
