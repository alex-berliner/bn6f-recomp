    reset rendering and fade state for a fresh scene; zeroFill_80024A2 / scenario_initEffectState_8003962
    / zeroFill_8003AB2 clear the global work structs used across scenes; reloadCurNaviStatBoosts_813c3ac
    restores the PET navi's HP to MaxHP, consistent with entering a new map/scene
