name: battle_setupMessageWindow_80313B0
address: '0x080313B0'
kind: function
status: confirmed
summary: Runs the full battle message-window setup sequence (prepare, 32x32 layout, finalize) and flags the request
  as handled in r12.
interface: void sub_80313B0(void); /* args in r0, r1, r2, r5 passed through to sub_8031176; r12 = flag word in/out;
  preserves r0, r1, r2, r5; NZCV on exit reflect (r12|1) */
details: 'Wraps the three battle text/message-window passes into one call. Step 1 (sub_8031176) prepares the window
  state using the caller''s r0-r2 and reads the r12 flag word. Step 2 (sub_8030E8C) lays the window out with fixed
  parameters: width/height 0x20 (32x32 tile region), origin r4=0, r5=0x20, and style/option r6=1. Step 3 (sub_80310B0)
  finalizes with r1=0. Finally it sets bit 0 (0x1) of the r12 flag word to mark the request as handled. The caller''s
  r0, r1, r2 and r5 are saved on the stack and restored, so the sequence is transparent to those registers; r3,
  r4, r6, r7 etc. are clobbered by the guest calls. r12 being used as an inout flag/scratch word by both the caller
  and the guest calls is unusual and suggests these functions are dispatched through a table/r12-state pattern rather
  than a normal C ABI.

  '
