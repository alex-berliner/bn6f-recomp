name: ai_tieredAttackStep
address: '0x080EB644'
kind: function
status: probable
summary: 'Enemy AI attack step: on first tick plays anim 6 and spawns a t1-s5 temp attack at r5+0x4C with
  a tier-indexed halfword (top byte = 3 for tier 0x0F, AttackBoost2*3 for tier 0x0E, else 0); on tick
  9 dispatches off_80EB6F8[tier] passing X+4*dir, Y, Z+0x300000, AttackBoost2, Damage+AttackBoost; clears
  related-object ptrs; at tick 0x15 sets HitElement=4.'
interface: (r5 = battle object, r7 = AI attack vars struct) -> void; spawns temp attack object, sets object
  flags and HitElement
details: On first entry (AttackElement == 0) it plays animation 6, resets the counter timer, reads a per-difficulty-tier
  halfword from byte_80EB738 (indexed tier*2), merges the tier's AttackBoost2*3 (or 3 for tier 0x1e) into
  the low byte, and spawns a type-1 subtype-5 temp attack object at [r7,#0x4C] via spawn_t1_0x5_tempAttackObject_80B8E30,
  playing sound 0xB2 and setting object flag bit 22; it then zeroes StepTimer and sets AttackElement to
  4. On the StepTimer == 9 pass it calls the tier-indexed handler from off_80EB6F8 with the object's X/Y/Z
  shifted 4px toward the facing direction and Z raised by 0x300000, plus Damage+AttackBoost and AttackBoost2,
  then clears RelatedObject1Ptr and AIData_TempAttackObjectPtr. StepTimer increments each frame; once
  it reaches 0x15 the HitElement field is set to 4 (normal/non-element).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne guards a one-time setup block that ends by
    setting AttackElement = 4; ldrh r4,[r4,r0] off byte_80EB738 merged with AttackBoost2*3 then passed
    to spawn_t1_0x5_tempAttackObject_80B8E30; PlaySoundEffect(0xB2) and object_setFlag1(1 << OBJECT_FLAGS_UNK_BIT_22_BIT)
    right after the spawn; off_80EB6F8 table of 16 tier handlers indexed by AiDifficultyTier*4, called
    with computed front-offset X/Y/Z and Damage+AttackBoost; StepTimer increment with 'cmp r0,#0x15; strh
    4 -> HitElement' tail
