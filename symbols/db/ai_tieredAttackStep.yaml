  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The name and overall flow match: AttackElement==0 gate at loc_80EB69A, animation 6, tier-indexed
    halfword from byte_80EB738, spawn at r5+0x4C, StepTimer==9 dispatch via off_80EB6F8, HitElement=4
    at 0x15. However the proposal says ''X/Y/Z shifted 4px toward the facing direction''—only X gets 4*dir<<0x10;
    Y is passed unchanged; Z gets a fixed +0x30<<0x10 raise. The tier comparison is on tier*2 (0x1e→tier
