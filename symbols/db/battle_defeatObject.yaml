name: battle_defeatObject
address: '0x08016EE0'
kind: function
status: probable
summary: 'Fully resets the current battle object as defeated: clears all collision/AI state, releases
  its slot, updates alliance counts, dispatches destroy events, and sets HP to 0 with phase 4 (dead).'
interface: (r5 = battle object pointer, no args) -> r0 = 4 (phase value written); no meaningful return
details: 'Operates on the battle object at r5. It first wipes the object''s interaction state: clears
  its collision region, collision result, collision state, and releases its tile/slot via releaseSlotByValue_801DC36.
  It then clears chip-related fields (ChipsHeld = 0, Chip = -1) and the RelatedObject1Ptr, plus AI data
  and barrier flag. If Param2 < 1 it calls relatedToIsBattleOver_800A11C to decrement the actor''s alliance
  member count and remove it from alive-actor lists, then dispatches the object''s destroy sub-events
  via battle_dispatchDestroyEvents_802EF5C. Finally it writes HP = 0 and phase 4 into oBattleObject_CurPhaseAndPhaseInitialized,
  which is presumably the ''dead/defeated'' phase the object''s state machine then handles.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Sequence of clears (collision region, result, state, slot) matches stripping a live actor of
    all battlefield presence; strh #0 to oBattleObject_HP and #4 to oBattleObject_CurPhaseAndPhaseInitialized
    marks the object dead in its phase state machine; relatedToIsBattleOver_800A11C ''actor leaves/is
    deleted'' decrement confirms this removes an actor from battle; battle_dispatchDestroyEvents_802EF5C
    fires the object''s destroy sub-event handler before the phase is set'
