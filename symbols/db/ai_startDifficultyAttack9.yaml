open_questions:
- No known callers, so the AI opcode table entry and what r5/r7 structures are remain unconfirmed
- Whether object_setAttack4's argument is an attack id or an object id, and the exact meaning of attack
  9, is unknown
- The role of the callback at sub_80F6FD0 (state update handler) is unverified
