name: battle_subEffectFadeOutDispatch
address: '0x0802B7A0'
kind: function
status: probable
summary: Battle sub-effect step that fades the screen out (SetScreenFade 0x14,8), waits for the fade to
  finish, then dispatches a follow-up effect kind (0x24, or 0x34 if a flag byte is set) and advances its
  state machine.
interface: '(r5 = effect work struct: +1 state byte, +2 init byte/halfword counter, +7 variant byte, +0x10
  word) -> void'
details: This is a per-kind battle sub-effect handler (invoked via the handler table of battle_dispatchKindEffect,
  hence no direct callers). On the first invocation it sets the init byte at r5+2, calls sub_802B9FE(0),
  and starts a screen fade with SetScreenFade(0x14, 8). On subsequent steps it polls IsScreenFadeActive;
  once the fade completes it dispatches effect kind 0x24, or 0x34 when the byte at r5+7 is non-zero, so
  +7 selects a variant of the follow-up effect. It then writes state 4 into r5+1, clears the halfword
  at r5+2 and the word at r5+0x10, handing control back to the effect state machine.
