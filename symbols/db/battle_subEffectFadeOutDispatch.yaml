    r0=0x24, or 0x34 when ldrb r1,[r5,#7] is nonzero; state advance: mov r0,#4; strb r0,[r5,#1]; clears
    halfword [r5,#2] and word [r5,#0x10]; no direct callers and a kind-byte dispatch callee mark it as
