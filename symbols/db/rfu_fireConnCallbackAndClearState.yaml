name: rfu_fireConnCallbackAndClearState
address: '0x081461B0'
kind: function
status: probable
summary: Invokes the RFU connection callback registered in eStruct200FE00+0x40 (if any) with the two byte
  arguments, then zeroes the connection-state halfwords at +0x14 and +0x16.
interface: (r0 = byte arg A, r1 = byte arg B) -> r0 = 0; calls [eStruct200FE00+0x40](argA, argB) if non-NULL;
  no flags meaningful
details: Both arguments are masked to bytes and passed through unchanged. It loads the link-connection
  struct at 200FE00; if the dword at +0x40 is non-zero it is treated as a function pointer and tail-called
  via the r2-dispatch trampoline with r0/r1 forwarded as parameters. Afterwards it stores 0 to halfwords
  at +0x14 and +0x16 of the same struct, resetting the tracked connection-state fields. The caller (rfu_handleConnectionEvent)
  invokes it from six different branches of the link-event state machine, consistent with a shared 'report
  event via callback, then reset state' step. The return value written (mov r0,#0 after the call) is the
  cleared state, not the callback's result. Fields +0x14/+0x16 look like state/phase or result trackers
  of the search-and-connect state machine.
