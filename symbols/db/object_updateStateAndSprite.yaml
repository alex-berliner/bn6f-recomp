name: object_updateStateAndSprite
address: '0x0811BA58'
kind: function
status: probable
summary: 'Per-frame object update: runs a state handler from a jump table keyed by the object''s state
  byte, then re-applies the state''s animation and updates the sprite, unless the state is 4.'
interface: '(r5 = object struct, byte #9 = state/animation id; r0/r1 scratch) -> r0 = undefined; called
  as thunk via bl, no meaningful return'
details: 'Reads the state byte at [r5,#9], indexes a two-entry handler table (off_811BA80: sub_811BA88,
  sub_811BAC4) and dispatches with mov lr,pc/bx. After the handler returns it re-reads the state byte;
  if it is not 4 it calls sub_811BAF4 (unknown helper), sprite_setAnimation with the state byte as the
  animation index, and sprite_loadAnimationData to (re)load the animation, so the state value doubles
  as the animation id. Finally it always calls sprite_update to advance/draw the sprite. State 4 appears
  to be a terminal/idle state that skips animation reassignment. This matches the common BN6 object pattern
  where one update routine drives both state logic and the object''s sprite.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r5,#9]; ldr r0,[r0,r1]; mov lr,pc; bx r0 — state-indexed handler dispatch (asm lines
    3-6); cmp r1,#4; beq loc_811BA76 — state 4 skips the animation-reload block; bl sprite_setAnimation
    right after ldrb r1,[r5,#9] — state byte passed as animation index; bl sprite_loadAnimationData then
    bl sprite_update — animation data refreshed each frame, then sprite updated; callees sprite_setAnimation/sprite_loadAnimationData/sprite_update
    summaries match an object sprite update role
