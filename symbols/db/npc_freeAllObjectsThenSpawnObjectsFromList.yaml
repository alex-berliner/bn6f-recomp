name: npc_freeAllObjectsThenSpawnObjectsFromList
address: '0x08030A60'
kind: function
status: confirmed
summary: Switches the overworld's active NPC spawn list — frees all existing overworld NPC objects, stores the new
  list pointer in the game state, and spawns one NPC per entry until a 0xFF terminator.
interface: 'void npc_freeAllObjectsThenSpawnObjectsFromList(const NPCScript *const *list /* r0 */); returns with
  r0 = pointer to the terminator entry, r1 = number of objects spawned (early exit: r1 = previous list pointer),
  r2 = 0xFF; flags from the last compare (list vs. current on early exit, terminator vs. 0xFF otherwise); r4-r6
  preserved'
details: 'Reads the toolkit''s GameState pointer (oToolkit_GameStatePtr via r10) and its current

  NPC list pointer at oGameState_Ptr_20. If the caller''s list pointer already equals

  the current one, returns immediately without side effects. Otherwise stores the new

  list pointer into oGameState_Ptr_20, calls FreeAllObjectsOfSpecifiedTypes with

  object type 4 (OVERWORLD_NPC_OBJECT_F) to despawn every overworld NPC, then walks

  the list: each entry is a script pointer, passed with the entry index to

  npc_spawnObjectThenSetUnk10_TempAnimScriptPtr_8030a8c to spawn the NPC. A 0xFF

  entry terminates the list. r1 accumulates the spawned-object count; r2 holds the

  current entry''s script pointer for the spawn call.

  '
