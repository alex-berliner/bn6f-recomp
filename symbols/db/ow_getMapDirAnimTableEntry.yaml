name: ow_getMapDirAnimTableEntry
address: '0x080A7528'
kind: function
status: probable
summary: Returns a pointer into the current map's per-direction animation table for an overworld object,
  used by the face-player/set-anim helpers.
interface: (implicit r5 = overworld object) -> r0 = pointer to tableBase + [r5+0x30]*8; clobbers r1-r3
details: Reads GameState's MapGroup; for map group 0x81 the table index comes from the byte at GameState+5
  (a sub-area selector), otherwise index 3 is used. The index selects one of four base pointers in the
  table at off_80A754C (byte_8140D6C, byte_8140E6C, byte_8140FBC, byte_814122C). It then adds the caller
  object's field at +0x30 shifted left by 3 (8-byte entries) to the selected base and returns that address
  in r0. Callers ow_facePlayerSetAnim and ow_setAnimFromDirTable use the result as the per-direction animation
  table from which they pick a facing animation.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r3,#oGameState_MapGroup]; cmp r0,#0x81 selects sub-index from gameState+5 else #3;
    ldr r2,[off_80A754C,r3] picks one of 4 map-keyed table bases; r1=[r5,#0x30] lsl 3; add r0,r1 -> returns
    base + objectField*8; both callers (ow_facePlayerSetAnim, ow_setAnimFromDirTable) pick direction animations
    from the returned table'
