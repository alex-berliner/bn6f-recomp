name: sub_8128AB0
address: '0x08128AB0'
kind: function
status: hypothesis
summary: Builds an interleaved two-buffer tile-ID lookup table in the sprite staging area (unk_201C040), filling
  0x170 halfwords with blank tile 0x7200 and overlaying 0x7201+ tile pairs whose row count is gated by the sprite's
  row/skip fields.
interface: void sub_8128AB0(struct sprite *r5 /* in/out, preserved */);
details: "Operates on a sprite (or similarly-shaped object) at r5; reads:\n  - [r5+0x1E] u16 total_rows (zero short-circuits\
  \ the entire overlay pass)\n  - [r5+0x24] u16 skip_rows (shifted left by 1)\nComputes `remaining = total_rows\
  \ - (skip_rows << 1)` on the stack and uses it as a decrementing counter per sub-row pair until exhaustion or\
  \ 4 outer iterations.\nCalls HalfwordFill(base=unk_201C040, len=0x170 halfwords, value=0x7200) to clear the buffer\
  \ to a blank tile.\nThen walks the buffer in two interleaved half-rows per outer step, writing paired (u16) tile\
  \ IDs to two parallel sub-buffers separated by 0x2E halfwords (buf_a = unk_201C040, buf_b = unk_201C040+0x2E),\
  \ incrementing from 0x7201. Each half-row spans 0x14 bytes (10 u16 pairs); the second half-row starts 6 bytes\
  \ past the first.\nAfter each outer step both buffer pointers advance by 0x5C (2 × 0x2E) halfwords. The outer\
  \ loop is a do-while of 4.\nThe interleaved two-buffer layout and per-row tile ID sequence is consistent with\
  \ the OBJ tile-attribute-pair rendering pattern Mega Man Battle Network uses to produce animated frame counts\
  \ and palette-varied tiles for a character sprite.\n\nRegister form kept (C call semantics could not work): r5\
  \ in/out, r5 preserved; clobbers r0 r1 r2 r3 r7 r4 r6; calls HalfwordFill"
