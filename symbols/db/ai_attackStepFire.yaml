name: ai_attackStepFire
address: '0x080ED5BE'
kind: function
status: probable
summary: AI attack-state step that fires a single shot one panel in front of the object every 14 ticks,
  loading a per-shot delay from a 4-entry table, until ChargeCycles is exhausted, then sets HitElement=8
  to end the attack.
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = result of sub_80CB686; no meaningful
  return to caller (state kept in r7 fields)
details: Each call decrements oAIAttackVars_StepTimer; when it reaches 0 it is reloaded with 0xE, so an
  action fires every 14 frames. On the first invocation (AttackElement==0) it bumps a counter at TempAttackObject+0x10
  and latches AttackElement=4. Each shot indexes dword_80ED618 by ChargeCycles to load a byte into TimerOrCycles,
  then calls object_getFrontDirection to get +1/-1 facing and adds it to oBattleObject_PanelX, targeting
  the panel in front. It passes panelY in r1, InitFlag in r2, a constant 0x10<<16 in r3, AttackBoost2
  in r4, and Damage+AttackBoost in r6 to sub_80CB686, which evidently spawns the attack/projectile at
  that panel. ChargeCycles counts down per shot; when it hits 0, HitElement is set to 8, ending the volley.
  dword_80ED618 = bytes 00 03 10 10, likely per-shot timer/delay values for the last four shots.
