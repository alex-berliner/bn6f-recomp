- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r5,#0x10] then ldrb r0,[r5,#0x10] reloaded for both chatbox stores — r0 is an id kept
    in the state object; ldr r0,[r4,#0x24]; tst r0,r0; bne — selects between the two script variants;
    mov r0,#7 / mov r0,#0xb followed by bl chatbox_runScript201C100_812474C — the two chatbox texts; ldr
