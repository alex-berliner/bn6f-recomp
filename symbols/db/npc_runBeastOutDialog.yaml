name: npc_runBeastOutDialog
address: '0x08124660'
kind: function
status: probable
summary: Displays one of two chatbox texts (script 7 or 11) depending on a Beast-out scenario flag, storing
  the chosen text id in a state object and the chatbox.
interface: (r0 = text/dialog id byte, r5 = dialog state object) -> r0 = chatbox_runScript result; sets
  [r5+0x10]=id, [r5+2]/[r5+3] state bytes, chatbox+0x4C=id
details: The byte in r0 is saved to [r5+0x10] and later copied into chatbox+0x4C, which the chatbox script
  runner presumably uses as the current text id. It reads oToolkit_S2001c04_Ptr (Beast-out scenario state);
  a nonzero word at +0x24 selects the second branch ([r5+2]=8, script 0xB) over the first ([r5+2]=0xC,
  [r5+3]=8, script 7). Both branches then fetch oToolkit_ChatboxPtr, store the id at +0x4C, and call chatbox_runScript201C100
  with index 7 or 0xB. r5 is not set up here, so it must be an object/NPC struct supplied by an unseen
  caller.
