name: battle_aiActorCountByFieldSide
address: '0x08031A46'
kind: function
status: probable
summary: Battle-AI helper that returns 3 or 2 actors depending on which side of the field diagonal the
  entity is relative to its target.
interface: (r0 = entity struct passed to calcRelPosToTarget) -> r0 = actor count for the AI sub-state
  (3 if the relative point is left of the (0,16)->(16,0) diagonal, else 2); flags set by callees
details: 'First calls battle_calcRelPosToTarget_803172E, which stores the entity''s coordinates (and next-position
  coordinates) relative to a doubled target reference point in a scratch buffer; r0 presumably then points
  at that buffer. It configures math_pointLeftOfLineTest_80315DC with a fixed directed line from (r2,r4)=(0,0x10)
  to (r3,r5)=(0x10,0) — a diagonal across the battle field — and feeds the relative position as the test
  point. The 0/1 result of the line test is used directly as an ''AI index'' argument to battle_aiIndexToActorCount_8031980,
  which maps AIIndex 1 to 3 and anything else to 2. So the geometric half-plane test acts as a selector:
  entities on one side of the diagonal get a 3-actor arrangement, the others a 2-actor one. This looks
  like AI spawn/formation logic choosing how many actors to use based on player/enemy relative position.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_calcRelPosToTarget_803172E then r0 fed as the point to the line test — relative position
    is the tested point; line endpoints hardcoded: r2=0,r4=0x10,r3=0x10,r5=0 — a fixed diagonal, no caller
    data; bl math_pointLeftOfLineTest_80315DC returns 0/1 which is passed unchanged (r0) to the next call;
    bl battle_aiIndexToActorCount_8031980 maps the 0/1 test result to 3-vs-2 actors per its known summary;
    no other computation or stores in the 12-instruction body — it is purely select-and-return'
