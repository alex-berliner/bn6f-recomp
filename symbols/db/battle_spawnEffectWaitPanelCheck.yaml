name: battle_spawnEffectWaitPanelCheck
address: '0x080C2B8C'
kind: function
status: probable
summary: 'Battle-object state handler: on first entry spawns a type-0 effect above the object (Z+0x14<<16,
  r4=3), plays SFX 0x77, arms a 60-frame timer, and marks itself initialized; then waits the timer out,
  validates the object''s panel has flag 0x10, and either destroys the object or writes Alliance^DirectionFlip
  to [r7,#0xC] and advances CurAction to 4 with phase 0.'
interface: (r5 = battle object, r7 = work/out struct) -> r0 = 0/1 from panel check path; on success [r7,#0xC]
  = Alliance^DirectionFlip and object moves to CurAction 4, phase 0
details: On first entry (PhaseInitialized == 0) it sets oBattleObject_Timer = 0x3C (60 frames), calls
  spawn_t1_0x0_EffectObject with the object's X/Y and Z + 0x14<<16 (r4 = 3 selects the type-1/effect-0
  spawn variant), plays sound 0x77 (SOUND_LOG_IN_77), and stores 4 into oBattleObject_PhaseInitialized
  so the init branch never runs again. On later calls it decrements the timer and returns until it hits
  zero. It then validates the tile under the object (PanelX/PanelY) with object_checkPanelParameters(mask
  0x10, mask 0), i.e. the panel must currently have flag 0x10; if not, the object is torn down via CUR_STATE_DESTROY
  written to the packed state field. If the panel still qualifies, it computes Alliance EOR DirectionFlip,
  stores it at [r7,#0xC] (a parameter for the next state/action), and sets CurAction = 4 with phase 0
  to advance the object's state machine. Being a state handler, it is reached through the object's state
  dispatch rather than a direct BL, which is why no direct caller is listed.
