name: battle_barrierLatchPlayAnim
address: '0x0810ABD0'
kind: function
status: probable
summary: 'Per-frame battle object behavior: when not barriered and an internal counter is active, latch
  a one-shot flag and switch the object to animation 2.'
interface: (r0 = unused/garbage on entry, r5 = battle object) -> r0 = clobbered; sets obj +0x7C halfword
  = 1 and obj CurAnim = 2 when triggered; no return value used
details: 'Reads the object''s collision data pointer and returns immediately if oCollisionData_Barrier
  is nonzero, so the effect is suppressed while the object is barriered/shielded. Otherwise it tests the
  halfword at obj+0x7E (some countdown or condition value) and the halfword at obj+0x7C, which acts as
  a latch: if the counter is nonzero and the latch is still 0, it stores 1 into +0x7C and sets oBattleObject_CurAnim
  to 2. Because the latch is set on first trigger, the animation change happens only once per activation
  of the counter; subsequent frames do nothing. Once +0x7E reaches 0 the routine also does nothing. The
  barrier check suggests this animates a hit/flash/reaction that only applies to unshielded targets.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r0,#oCollisionData_Barrier]; tst/bne — early-out when barrier active (asm lines 2-5);
    ldrh r0,[r5,#0x7E]; tst/beq — triggers only while counter at +0x7E nonzero; ldrh r0,[r5,#0x7C]; tst/bne
    — +0x7C is a once-only latch, skipped if already set; strh #1,[r5,#0x7C] then strb #2,[r5,#oBattleObject_CurAnim]
    — latches flag and starts animation 2'
