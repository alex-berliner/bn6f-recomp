name: battle_waitHitOrTimeoutUpdate
address: '0x080D1B9A'
kind: function
status: probable
summary: Per-frame update that decrements a lifetime timer, signals RelatedObject1 when a qualifying collision
  hit occurs, and destroys the object on either timer expiry or qualifying hit, removing its collision
  data each frame.
interface: (r5 = battle object pointer) -> r0 = destroyed (via object_clearCollisionRegion) or void; sets
  oObjectHeader_Flags=1 on RelatedObject1 when hit
details: 'Decrements oBattleObject_Param1 as a frame-lifetime counter. While the counter is nonzero, it
  reads oCollisionData_FlagsFromCollision and tests it against an alliance-indexed bitmask table (byte_80D1BE8:
  alliances 3 and 7 use masks 0x50 and 0xA0; others match nothing); if the hit-flag matches and bit 0x4000
  is not set, it writes 1 to the RelatedObject1''s oObjectHeader_Flags, presumably to notify it of the
  hit, and skips collision processing. With no qualifying hit it returns early if the battle is over,
  otherwise refreshes the object''s collision state via object_presentCollisionData. When Param1 reaches
  0 it removes the object from its collision region and sets the state field to CUR_STATE_DESTROY, tearing
  down the object.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_Param1]; sub r0,#1; beq destroy path — Param1 is a countdown timer;
    byte_80D1BE8 indexed by oBattleObject_Alliance*4 gives per-alliance collision-flag masks (0x50/0xA0)
    used to detect a qualifying hit; strb r0,[r3,#oObjectHeader_Flags] with r3=RelatedObject1Ptr — signals
    the linked object on hit; loc_80D1BD8: object_clearCollisionRegion + mov r0,#CUR_STATE_DESTROY — timer
    expiry destroys the object; callees battle_isBattleOver and object_presentCollisionData confirm this
    is a battle-scene per-frame object update'
  refs:
  - bn6f/asm/asm31.s:55437
  - 0x080D1B68 sub_80D1B68
  - 0x0800A18E battle_isBattleOver
  - 0x0801A074 object_clearCollisionRegion
  - 0x0801A018 object_presentCollisionData
  reproduce: python3 tools/asmcat.py 0x080D1B9A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The alliance-mask table byte_80D1BE8 is 8 bytes read as two 32-bit words via ldr with lsl r1,r1,#2,
    so alliances 0 and 1 get masks 0x50000000 and 0xA0000000, not ''alliances 3 and 7 with masks 0x50
    and 0xA0''. More critically, the qualified-hit branch (strb r0,[r3,#oObjectHeader_Flags]) jumps to
    loc_80D1BD8 which is the DESTROY path (object_clearCollisionRegion + CUR_STATE_DESTROY), so the hit
    also destroys the object; the proposal says it merely ''skips collision processing.'' The function
    also calls object_removeCollisionData at the very top before decrementing Param1, which the summary
    omits. The name fits but the summary should note both timer-expiry AND qualifying hit lead to destruction.;
    run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
coverage:
- battlesweep
open_questions:
- What object type uses this (Param1 initial value and RelatedObject1's role come from the caller sub_80D1B68,
  which is undocumented)
- Meaning of collision flag bit 0x4000 and the exact semantics of the 0x50/0xA0 alliance masks
- The alliance-mask table byte_80D1BE8 is 8 bytes read as two 32-bit words via ldr with lsl r1,r1,#2,
  so alliances 0 and 1 get masks 0x50000000 and 0xA0000000, not 'alliances 3 and 7 with masks 0x50 and
  0xA0'. More critically, the qualified-hit branch (strb r0,[r3,#oObjectHeader_Flags]) jumps to loc_80D1BD8
  which is the DESTROY path (object_clearCollisionRegion + CUR_STATE_DESTROY), so the hit also destroys
  the object; the proposal says it merely 'skips collision processing.' The function also calls object_removeCollisionData
  at the very top before decrementing Param1, which the summary omits. The name fits but the summary should
  note both timer-expiry AND qualifying hit lead to destruction.
