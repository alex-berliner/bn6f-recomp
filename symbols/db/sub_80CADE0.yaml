name: sub_80CADE0
address: '0x080CADE0'
kind: function
status: confirmed
summary: 'Per-frame collision-update step for a battle object: clears/respawns its collision data, then either destroys
  the object (battle over or collision flags set), freezes it during time stop, or runs its current action''s movement
  handler.'
interface: void battle_objectUpdateCollision_80CADE0(BattleObject* obj /* r5 */); callers pass the object in r5
  (plus r4/r7/r8/r10 live context), and the routine clobbers r0-r4, r6, r7 and flags while r5/r8-r12 survive to
  the caller.
details: "Battle-object step routine operating on the object pointer in r5. Sequence:\n1. object_removeCollisionData\
  \ removes the object's old collision data, then\n   object_spawnCollisionEffect spawns whatever effect is tied\
  \ to that collision.\n2. If battle_isBattleOver says the battle ended, or the collision data's\n   oCollisionData_FlagsFromCollision\
  \ field is nonzero (the object was hit/collided),\n   it calls object_clearCollisionRegion, writes CUR_STATE_DESTROY\
  \ into\n   oBattleObject_CurStateActionPhaseAndPhaseInitialized, and returns.\n3. Otherwise, if battle_isTimeStop\
  \ signals time stop (the bne relies on flags left by\n   the callee), it skips movement and just calls object_presentCollisionData\
  \ so the\n   collision data stays visible for this frame.\n4. Otherwise it dispatches through the two-entry table\
  \ at off_80CAE20 indexed by\n   oBattleObject_CurAction: action 0 -> sub_80CAE28, action 1 ->\n   battle_applyXMoveAndCheckDestroy_80CAE94.\
  \ The dispatch sets lr = 0x080CAE0A before\n   the bx, so both handlers return straight into the object_presentCollisionData\
  \ call.\nThe jump table has only two entries, so any CurAction value other than 0 also lands on\nbattle_applyXMoveAndCheckDestroy_80CAE94\
  \ (a value >= 2 would read past the table).\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
