name: sub_801FE24
address: '0x0801FE24'
kind: function
status: confirmed
summary: Start or restart the battle-effects overlay (0x10) — reset link state when the slot is free and start it
  in mode 5, otherwise restart in mode 0 — and flag the overlay as active in the battle-effects struct.
interface: 'void sub_801FE24(void);

  // inputs:  none meaningful (r10/lr inherited)

  // outputs: r5 r6 r7 set; preserves r4 r5 r6 r7; clobbers r0 r1 r2 r3 lr, N Z C V

  '
details: "Calls GetBattleEffects() and tests bit 0x8 of the returned bitmap.\n- Bit 0x8 set (effects already in\
  \ use): calls sub_803DCE8 with\n  (id=0x10, arg1=0, arg2=2, arg3=0) — restarts the standard overlay in mode 0.\n\
  - Bit 0x8 clear: first checks notZero_eByte200AD04 and bails out early (returns\n  to caller) if it is zero —\
  \ guarding against starting the overlay when its\n  backing slot is unavailable. Otherwise resets link-state slot\
  \ 0 via\n  eLinkState_ResetForNewUse_803DE88(arg=0) and starts the overlay with\n  (id=0x10, arg1=0, arg2=2, arg3=5).\n\
  - On the path that actually starts the overlay, writes byte 1 to\n  A_eStruct203F7D8 (eStruct203F7D8) to mark\
  \ the overlay active.\nNote: the active-flag write is reached only after a successful start; the\nearly-return\
  \ on the zero check at 0x200AD04 skips it, so the flag stays\nwhatever it was.\nSubsystems touched: battle effects\
  \ / overlay engine, link-state slot 0,\neStruct203F7D8 active flag, byte at 0x0200AD04.\n\nRegister form, old\
  \ prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
