name: sub_803C132
address: '0x0803C132'
kind: function
status: confirmed
summary: Counts halfword-strided table entries until hitting an end marker (0xE5 or 0xE6).
interface: u32 sub_803C132(u32 entryIndex r0, u32 byteOffset r1, const u8* tableBase r5) -> r0 = count, r3 = marker
  address, flags N/Z from count (C=V=0)
details: 'Scans the table at (r5 + r1) stepping 2 bytes at a time, counting entries

  until it encounters a marker byte 0xE5 or 0xE6. Returns the count in r0

  and the address of the marker entry in r3. The initial ldrb r6,[r5,r0]

  followed by lsl r6,#1 is dead code: r6 is in the preserved set so the

  loaded/shifted value is never consumed and is restored unchanged. Because

  r6 is preserved, this function is safe to call without saving r6. The

  exit sets flags via the ADDS form of "mov r0, r4", so N/Z reflect the

  count and C/V are cleared.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
