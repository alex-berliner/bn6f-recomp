name: sprite_queueTwoOamEntries_81205C0
address: '0x081205C0'
kind: function
previous_names:
- sub_81205C0
status: probable
summary: Queues two sprite OAM entries (a top tile and a bottom tile) with overlapping/blended vertical
  extents, returning a packed status value.
interface: (r0 = ?, r1 = base tile id low16, r2 = packed y/coord, r3 = flag, lr = ?) -> r0 = packed result
  ; also clobbers r1, r2, r3, r4-r7
details: "Allocates 8 bytes on the stack (sp,#8). Saves r1=base tile, r2=packed Y, r3=flag into the two\
  \ stack slots and r4/r5.\n  Runs divmod via SVC 6 (BiosDivide) with r1=#0xa — the divisor 10 hints it\
  \ is splitting a value into a 10-entry column list (e.g. panel columns on a 10-column battlefield, or\
  \ 10 sprite rows for two vertical halves of one object).\n  Iterates from r6=0..7 stepping +4: reads\
  \ the precomputed per-row offset from the stack (`ldr r1, [r2]` where r2 = sp+r6), LSLs by r5 (the flag/multiplier),\
  \ adds r4 (base), and calls sprite_queueOamEntryThunk_802FE28 with a4=1 to enqueue an OAM entry whose\
  \ Y comes from the just-advanced r7.\n  On each pass it sign-extends r7 (the Y coord) via `lsl/lsr #0x10`\
  \ and `asr #0x10`, then advances r7 by +7 or +8 depending on r5 (so rows are 8px tall with a 1px overlap).\
  \ The Y for the next row is repacked into the high half of r7 by `orr r7,r1`.\n  Returns the final packed\
  \ Y-value (low16 = row-subpixel, high16 = cumulative row Y) in r0. Called with r0=00000004 across snapshots\
  \ — likely an OAM OBJ index/slot.\n  Note: r2=00ba0037 in capture corresponds to Y=0xba and X/sub-coord=0x0037\
  \ (panel X within 3x3 grid: 0x37 = 5 columns, 7 rows typical).\n"
