name: sub_8118F24
address: '0x08118F24'
kind: function
status: confirmed
summary: Sprite update trampoline; dispatches to one of three handlers based on the state byte at [r5+8] via a ROM
  jump table, preserving LR.
interface: 'void sub_8118F24(u32* r5) /* reads r5->state @ +8, clobbers nz c v r0 r1 r4 r6 r7 r8 r9 r12 lr, returns
  via lr_save; preserved: none */'
details: "This is a thin dispatcher sitting in front of the per-state sprite logic. It loads a pointer\nfrom off_8118F38\
  \ (which points to off_8118F38 itself), reads the state byte at r5+0x8,\nindexes that pointer table with the state\
  \ byte, then performs an indirect jump to the\nresulting Thumb handler (low bit set, hence the +1 trick to switch\
  \ into Thumb mode).\n\nThe three targets listed in the jump table are:\n  - off_8118F38[0] = sprite_initBattle_8118F44+1\n\
  \  - off_8118F38[1] = sprite_dispatchUpdate_8118FC0+1\n  - off_8118F38[2] = sub_81190D8+1\n\nLR is saved/restored\
  \ around the call so the callee returns to the trampoline, which then\npops PC from the stack and returns to the\
  \ original caller. This means the caller sees this\nas a single subroutine boundary even though internally it\
  \ fans out into per-state behavior.\n\nInputs/outputs: r5 is the only meaningful input (a battle-sprite struct;\
  \ the state byte at\noffset 8 selects the handler). All other output registers (r2, r3, r5, r10, r11) are produced\n\
  by the dispatched handler and bubble through unchanged.\n"
