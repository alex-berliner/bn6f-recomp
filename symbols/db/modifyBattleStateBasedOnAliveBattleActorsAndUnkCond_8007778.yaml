name: modifyBattleStateBasedOnAliveBattleActorsAndUnkCond_8007778
address: '0x08007778'
kind: function
status: confirmed
summary: Registers a battle object in its alliance's "alive battle actors" list in the battle state, taking the
  first free slot of four and bumping the alliance's alive-actor count.
interface: bool battle_claimAliveActorSlot(void *battleObject /* r5 */, void *toolkit /* r10 */); returns 1 in r0
  if a slot was claimed, 0 if the alliance's list was full; r2/r3 left as scratch from the last slot examined
details: 'Reads the battle object''s Alliance byte (r5+oBattleObject_Alliance), then indexes the battle

  state (fetched via toolkit+oToolkit_BattleStatePtr) at oBattleState_AliveBattleActors plus

  alliance*0x10, i.e. four 4-byte actor-pointer slots per alliance. Scans up to four slots for

  a zero entry; on the first free one it stores the battle-object pointer there, then checks the

  object''s AIData byte at oAIData_Unk_02 — if it is not 1, it increments the byte at

  battleState + alliance + 4 (the per-alliance alive-actor counter stored right after the four

  lists). Objects flagged with AIData byte 2 == 1 claim a slot but are not counted alive.

  Returns 1 on success, 0 if all four slots were occupied (counter not touched in that case).

  r2/r3 carry leftover scratch from the loop''s final iteration, and flags reflect whichever

  comparison/add was last on the taken path — presumably incidental, not part of the contract.

  '
