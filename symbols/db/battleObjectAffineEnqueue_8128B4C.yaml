name: battleObjectAffineEnqueue_8128B4C
address: '0x08128B4C'
kind: function
status: confirmed
summary: Enqueues a battle object's affine-OBJ descriptor (skipping when not visible) and stores the returned
  tile-attribute byte into the object.
interface: 'void sub_8128B4C(void);

  // inputs:  r5 (battle-object ptr), r10, lr

  // outputs: r5 (preserved)

  // clobbers: nz, c, v, r0, r1, r2, r3, lr

  // preserved: r4, r5, r6, r7

  '
details: 'Guards on the object''s visibility flag at +0x1E (u16); returns immediately if 0.

  Builds an affine OBJ attribute1 word: base = 0x0100000 (affine OBJ group 1); when

  bit 0 of the object flags at +0xD is set, also ORs 0x680000 (double-size + large

  affine bits). The layer index at +0x20 (u16) is multiplied by 0x10 and added to

  0x18, then OR''d into the attribute word.

  Submits the descriptor by calling sub_811FAF4 with r0 = attr01, r1 = 0x20002,

  r2 = byte from +0xC (current tile attr), r3 = pointer to the affine matrix entry

  at byte_8128678, r4 = 0x40000000 (status/control dword).

  The tile-attribute byte returned by sub_811FAF4 is written back at +0xC.

  Touched fields on the battle object (r5): +0xC (tile attr byte), +0xD (flags),

  +0x1E (visibility u16), +0x20 (layer index u16).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
