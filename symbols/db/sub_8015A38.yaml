open_questions:
- What game concept each stat actually represents - 0x29/0x17/0x2C are inferred from their gating roles and need
  cross-referencing against the navi/battle struct.
- Why the count is only ticked while status-kind is in 0x0B..0x18; that band likely corresponds to a specific battle
  phase or effect window that should be confirmed.
- Why the function always returns 0 - is it an action-tick callback that just needs a 'not-done' sentinel, or a
  real hook into a per-Navi per-frame update?
