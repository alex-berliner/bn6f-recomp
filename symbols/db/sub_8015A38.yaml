name: sub_8015A38
address: '0x08015A38'
kind: function
status: confirmed
summary: Ticks the Navi's stat 0x21 countdown timer down by one if the gate flag is clear, the navi isn't paused,
  and the status-kind is in range.
interface: u32 sub_8015A38(u32 battleObject /* r0 */); // -> r0 = 0; r2 trashed; r5/r6/r7 preserved; NZCV clobbered
details: 'Operates entirely through Get/SetBattleNaviStatsByte_AllianceFromBattleObject against a

  battle-object handle cached in r5. The four stat indices it touches are 0x29 (gate flag,

  must be 0), 0x17 (navi state, must be neither 0x0B nor 0x0C - the two paused states),

  0x2C (status kind, must be in 0x0B..0x18 for the countdown to run), and 0x21 itself

  (the countdown timer, decremented by one). A NULL handle short-circuits to the

  constant 0 return; likewise, if the timer is already 0 it is left at 0 rather than

  wrapped. The original never reloads r0 between stat calls, so each successive

  Get/Set sees the previous callee''s r0 - this is faithfully threaded through the

  helpers so the call sequence is bit-identical to the ROM.

  '
