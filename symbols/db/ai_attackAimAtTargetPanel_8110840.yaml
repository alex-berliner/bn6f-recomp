name: ai_attackAimAtTargetPanel_8110840
address: '0x08110840'
kind: function
status: confirmed
summary: Aims an AI-controlled battle object at its target panel by setting its velocity along the panel
  axis toward the target, then derives the attack's step timer and charge cycles from the distance.
interface: void sub_8110840(BattleObject *obj /* r5 */, AIAttackVars *ai /* r7 */)
details: 'Part of the enemy AI attack pipeline: given the AIAttackVars block''s TargetPanelX/Y and a

  per-attack ScratchVar speed multiplier, it computes the panel-space delta between the object

  (oBattleObject_PanelY / oBattleObject_PanelX) and the target panel and sets the object''s

  oBattleObject_YVelocity / oBattleObject_XVelocity to delta * scratch.


  Axis selection: it first tries Y (delta Y * scratch); if that is nonzero the object moves

  purely vertically (X velocity forced to 0) and uses step base 0x00180000. Otherwise it tries

  X; if that is also zero the object is already on the target panel, so both velocities are

  zeroed and StepTimer/ChargeCycles are both set to 1 (immediately restart/advance the attack),

  and the function returns without dividing. If X is nonzero, the object moves purely

  horizontally (Y velocity forced to 0) and uses step base 0x00280000.


  When moving, it performs a BIOS signed divide (svc 6) of the step base by ScratchVar,

  storing the quotient as the halfword oAIAttackVars_StepTimer and half of it as

  oAIAttackVars_ChargeCycles, so ChargeCycles is the point at which the object charges while

  stepping to the target panel. The different step bases (0x18 vs 0x28) make horizontal

  attacks take longer per step than vertical ones for the same speed.

  Quirk: ScratchVar == 0 falls into BIOS div-by-zero (which returns ~UINT_MAX on GBA), and

  the mul results are treated as 32-bit signed values, so a negative delta yields negative

  velocity (moving in the opposite direction is expected, since it walks toward the target).

  '
