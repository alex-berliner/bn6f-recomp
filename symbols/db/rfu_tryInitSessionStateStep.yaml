    — state transition on session start; bl test0x200bc50_0x5_813D60C; bne; mov r0,#0x18; strb r0,[r5,#0xC] — alternate-branch
    state write gated on the 0x200BC50 flag; callees sub_803EA78 (mode dispatcher) and sub_803EA50 gate which branch
    runs before the rfu call; bl sub_81469A0; bl sub_81469E8 run unconditionally at the end of the 0x10 path each
    invocation'
