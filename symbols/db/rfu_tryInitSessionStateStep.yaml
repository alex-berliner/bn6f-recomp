name: rfu_tryInitSessionStateStep
address: '0x0812A6F8'
kind: function
status: probable
summary: 'Per-frame link-state step dispatched from sub_803EA78/sub_803EA50: on gate pass calls sub_8147B24; otherwise
  calls rfu_initWirelessSession, incrementing the halfword retry counter at +0x28 on failure, and on success sets
  state +0x1=0x10, clears +0x2 and the counter, then runs sub_8132398. The pair sub_81469A0/sub_81469E8 runs every
  pass through the 0x10 branch. The alternate branch writes 0x18 to +0xC when test0x200bc50_0x5_813D60C is clear.'
interface: (r5 = link connection state struct, set by caller) -> r0 = clobbered; updates struct fields +0x1 (state=0x10),
  +0x2 (sub-state=0), +0x28 (retry count), +0xC (state=0x18 in alternate branch)
details: Calls sub_803CB18 with 0x10 and aborts to the alternate branch if it fails; otherwise dispatches via sub_803EA78
  and gates on sub_803EA50's return. When the gate passes it calls rfu_initWirelessSession; a nonzero (failure)
  return increments the halfword retry counter at +0x28 so the attempt is retried next frame, while success (or
  gate failure) sets state byte +0x1 to 0x10, clears +0x2 and the counter, and calls sub_8132398. The pair sub_81469A0/sub_81469E8
  runs every pass through the 0x10 branch. In the alternate branch, if the boolean at 0x200BC50+5 (per test0x200bc50_0x5_813D60C)
  is clear, it writes 0x18 to state field +0xC. r5 is never initialized here, so the struct pointer comes from the
  caller.
