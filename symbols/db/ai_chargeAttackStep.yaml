name: ai_chargeAttackStep
address: '0x080FC444'
kind: function
status: probable
summary: AI attack state that continuously slides the attacking object toward a reserved target panel,
  hitting whatever it reaches
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = scratch from helper; sets HitElement when
  attack resolves
details: On first entry (AttackElement==0) it marks the attack as element 4, clears an ObjectFlags1 bit,
  asks sub_80FCE5C for a target panel; if none it exits the attack state. It stores the target in TargetPanelX/Y,
  copies the current panel into FuturePanelX/Y, reserves the target panel via object_reservePanel, sets
  OBJECT_FLAGS_CANNOT_SLIDE, and calls sub_80D4C0A(object+9, -1) to set up movement (result saved in ScratchPointerOrPanel).
  Every tick it adds YVelocity/Y and XVelocity/X to the object's position, recomputes PanelX/PanelY from
  coordinates via object_setPanelsFromCoordinates and object_updateCollisionPanels, and calls sub_80FCFA8
  when the panel column changed (likely facing/animation update). It decrements StepTimer and, when the
  timer runs out or the object's panel equals the target panel, stores 0x14 into HitElement, ending the
  move. This is a per-frame step function of a dash/rush body attack, not an instantaneous strike.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: element 4 written to oAIAttackVars_AttackElement and guarded by bne, so the block is once-per-attack
    setup (sub_80FC444 start); object_reservePanel called right after storing TargetPanelX/Y from sub_80FCE5C,
    plus OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1; per-tick X += XVelocity, Y += YVelocity then object_setPanelsFromCoordinates/object_updateCollisionPanels
    sync the collision panels; timer expiry and arrival at the target panel both funnel to 'mov r0,#0x14;
    strh r0,[r7,#oAIAttackVars_HitElement]'; sub_80FCE5C returning 0 leads to object_exitAttackState,
    so it is an optional target acquisition that can fail
