summary: Read a map cell's tile ids from the decompressed tilemap's two layers (cell (0, 0) when off the map).
interface: (r0 = map x, r1 = map y, r5 = eMapTilesState200be70) -> r0 = id in the layer at +4, r1 = id in the layer
  at +8; r2 = r0, r3 = tilemap, r4 = 0, r6 = y * row bytes, r7 = row bytes; flags from cmp r4,#0
details: The tilemap (eMapTilesState200be70 +0xc) has u16 entries, MapWidth per row; the words at +4 and +8 are
  offsets of its two layers. The bounds checks are signed.
