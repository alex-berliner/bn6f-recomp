name: battle_highlightSweepPanel
address: '0x081039D8'
kind: function
status: probable
summary: Highlights one battle panel chosen by a column index and the object's alliance, for the battlesweep
  attack.
interface: (r0 = 1-based column/step index 1..4, r5 = battle object) -> r0 = result of object_highlightPanelRegion;
  no flags relied on
details: 'r0 is decremented to a 0-based index used two ways: it selects a byte from dword_81039FC (0x12,0x13,0x1F,0x22)
  passed as r2, and the object''s oBattleObject_Alliance (doubled) selects a coordinate pair from dword_8103A04
  — alliance 0 gets (0x05,0x20), alliance 1 gets (0x20,0x20) — passed as r0/r1. r3 is loaded from oBattleObject_AllianceAndDirectionFlip
  of the object, so the highlight mirrors with the object''s side/facing. It then tail-calls object_highlightPanelRegion,
  which presumably draws a panel highlight. The four indexed bytes increasing with r0 suggest a per-step
  panel target for a multi-tile sweep.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sub r0,#1 then ldrb r2,[r2,r6] with dword_81039FC=0x221F1312 gives per-index bytes 0x12/0x13/0x1F/0x22;
    ldrb r0,[r5,#oBattleObject_Alliance] lsl 1 indexes dword_8103A04 bytes (0x05,0x20 / 0x20,0x20) as
    the r0,r1 arguments; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip] passes the object's side/flip
    to the highlight callee; tail call bl object_highlightPanelRegion with the four prepared arguments
  refs:
  - bn6f/asm/asm31.s:160835
  - 0x0810324E sub_810324E
