open_questions:
- Is the owner struct in r5 a battle entity (e.g. the player's battle state) or a generic chip-battle subsystem
  object? The +0x28 slot table and the 0xFF sentinel strongly suggest a custom-chip slot array, but no struct definition
  has been matched yet.
- What does call_sub_3005EBA actually do, and why is each slot invoked twice (modes 0 then 3)? Mode 0 may be "spawn/select"
  and mode 3 may be "run/resolve", but the meaning of modes is unknown.
- What does the flag bit at "0x2000" in 0x20352C4 gate? Clearing it here suggests it was set when the chip queue
  was built and is cleared once the queue has been drained.
- r10 is preserved across the call but the function neither reads nor writes it; it is likely just a callee-preserved
  scratch the caller happens to keep live.
