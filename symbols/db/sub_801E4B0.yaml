name: sub_801E4B0
address: '0x0801E4B0'
kind: function
status: hypothesis
summary: Walks the custom-chip slot table on a struct and dispatches each filled slot to the IWRAM chip handler
  twice (modes 0 and 3), then clears the "0x2000" bit of the global state flag word.
interface: 'void sub_801E4B0(void);  /* in: r5 = owner struct, r10 and lr pass through; clobbers r0-r3, r4-r7, NZCV
  */'
details: 'Walks four u16 slots at +0x28 of the struct whose address is in r5. A slot

  value of 0xFF marks the first unused slot and ends the scan; any value >=9

  is clamped to 8 (so the slot level lives in 0..8). For each used slot the

  function stages a 6-word parameter block on the guest stack (the offset

  word saved on top, then r0=pos, r1=slot_offset, r2=0, r3=0, r4=level+1,

  r5=2, r6=slot_addr) and calls call_sub_3005EBA with mode 0, then pops the

  5-word block (leaving the saved offset on top) and calls the same routine

  again with mode 3. The r0 of the first call is hard-coded to 0x1D minus the

  clamped level, so the "pos" handed to the chip handler decreases as the

  slot level increases. After all four slots are processed, the function

  clears bit 13 (1<<13, value "0x2000") of the u32 at 0x20352C4 via

  flags_clearBits_20352C4_801BEC2. The 0x1D constant, the +0x28 slot table,

  the "level+1 / 2" registers, and the 0xFF / level-9 sentinel scheme match

  the Battle Network custom-chip "select/activate" slot layout, so this is

  most likely the routine that fires the queued custom-chip effects during

  a battle turn.

  '
