name: ow_swapMapEventFlags
address: '0x080A8324'
kind: function
status: confirmed
summary: Swaps a pair of overworld map event flags (sets one iff the other is clear), gated on flag EVENT_9D6, used
  to toggle a map's event state.
interface: (u32* workObj@r5, u32 toolkit@r10) -> u32 workObj@r5 (returned unchanged); clobbers r0-r3, lr, flags
details: 'Early-outs unless event flag EVENT_9D6 is set. Reads the current map via

  toolkit->oToolkit_GameStatePtr->oGameState_MapGroup/oGameState_MapNumber: if the map

  group is 0x85 (a special map) it forces table index 3, otherwise it uses the map number

  as the table index. The caller-supplied work object''s byte at +4 selects a halfword slot

  (byte*2) within two parallel per-map flag tables (off_80A8374 = "current/condition" flag

  table, off_80A8384 = "target" flag table). If the current flag is set it clears the target

  flag via ClearEventFlag, otherwise it sets the target flag via SetEventFlag — a two-flag

  toggle where one of the pair is always kept set. Typical use is swapping a map between two

  mutually exclusive event states (e.g. NPC/obstacle layout A vs B) once scenario flag

  EVENT_9D6 is active. r5 passes through untouched, so it is safe as an in/out work pointer.

  '
