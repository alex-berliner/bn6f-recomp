name: ai_stepAttackSpawnNext
address: '0x080FE2A8'
kind: function
status: probable
summary: AI attack step handler that, after a wind-up delay, spawns a successor attack object next to
  the target (with sound) and repeats a set number of times before handing control back.
interface: (r7 = attacker's oAIAttackVars, r5 = attacker battle object) -> r0 = 0/void; updates StepTimer,
  AttackElement, AttackBoost2, HitElement in oAIAttackVars
details: 'State machine driven by oAIAttackVars_StepTimer. On first entry (AttackElement==0) it arms the
  attack: sets AttackElement=4, plays object anim 6 (CurAnimCopy=0xFF so it takes), sets counter time
  0x12 via object_setCounterTime, and loads StepTimer=0x1A. While the timer counts down, at 0x10 remaining
  it calls nav_pickAdjacentPanel_80FE5EE with the target object''s panel coords to choose a neighboring
  tile, then calls battle_spawnAndConfigureNextObject_80CB080 (type-0x38 ''next'' object) with InitFlag,
  AiDifficultyTier and Damage, and plays sound effect 0xAE. When the timer expires it decrements AttackBoost2
  (repeat count); if repetitions remain it clears AttackElement to re-run the cycle, otherwise it writes
  HitElement=0xC to signal the attack sequence is finished.'
