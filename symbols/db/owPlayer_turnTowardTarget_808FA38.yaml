name: owPlayer_turnTowardTarget_808FA38
address: '0x0808FA38'
kind: function
status: confirmed
summary: Turns the overworld player sprite toward the map's target position by picking the walk animation matching
  the angle octant to that target.
interface: 'void sub_808FA38(void)  // in: r10 (context/base), lr; out: r4, r5 returned unchanged; clobbers r0-r3,
  flags'
details: 'Loads the overworld player object pointer from off_808F5D4 (object base 0x2000310), calls ReadOWPlayerObjectCoords
  to get the player''s current x/y in r0/r1, then computes dx = (targetX at +0x12 << 16) - playerX and dy = (targetY
  at +0x14 << 16) - playerY (target fields scaled to 16.16 fixed point to match the coordinate units). Feeds (dx,
  dy) into battle_calcAngleOctant_800118A, which yields an octant 0-7 of the direction to the target. Octant 0 means
  "no direction / already there" and exits without changing anything. Otherwise it indexes the ROM table byte_808FA74
  { 0xB, 0xB, 0x9, 0xF, 0xD, 0x0, 0x0, 0x0 } to map the octant to a walk animation id, and if that id differs from
  the current animation byte at object +0x11, calls owPlayer_setS200ace0_fixedAnimationSelect_809e13c to switch
  the player''s fixed animation and stores the new id at +0x11. So the player is visibly turned to walk toward a
  scripted destination (used when the game steers MegaMan to a spot on the map). Quirks: table entries 5-7 are 0
  (octants the game never steers into, presumably the backward-facing directions); the +0x11 comparison against
  the current animation prevents restarting the same walk animation every frame.

  '
