name: clear_renderBlendEffect
address: '0x0804CBC0'
kind: function
status: probable
summary: 'Tears down an active render/blend effect: clears the render-info flag and resets its state fields,
  then zeroes the effect scratch struct.'
interface: () -> r0 = zeroFill return; flags from zeroFill_e2009740
details: Reads the toolkit RenderInfo pointer and clears bit 0x800 in its flags halfword (likely an 'effect/blending
  active' marker). It then stores the constant 0x3F0B into the halfword at RenderInfo+0xA, which looks
  like a reset/default value for the effect's parameters (blend or fade state kept inside RenderInfo).
  Finally it calls the known helper zeroFill_e2009740, which zero-fills the 8-byte scratch struct at toolkit->Unk2009740,
  presumably the per-frame effect working state. No arguments are taken and no return value is produced.
  With no callers captured, the exact trigger context (which effect is being ended) is unconfirmed.
