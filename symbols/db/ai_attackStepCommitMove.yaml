name: ai_attackStepCommitMove
address: '0x080FB494'
kind: function
status: probable
summary: 'AI attack state step: commits the enemy to its target panel (moving-in attack pose), waits 10
  frames, then arms the hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets AttackElement/HitElement, StepTimer
  in the AI vars
details: This is one step of an AI-driven attack routine. On first entry (AttackElement==0) it tags the
  attack as element 4, sets the object's current animation to 3, copies FuturePanelX/Y into PanelX/Y,
  releases the reserved panel, recomputes pixel coordinates and collision panels, clears flag 0x40, and
  sets the ObjectFlags1 'currently moving' bit (bit 1<<1), then loads StepTimer with 10. On subsequent
  calls it just decrements StepTimer; when it reaches 0 it writes 8 into oAIAttackVars_HitElement, i.e.
  the attack's hit detection element becomes active after the move-in delay.
