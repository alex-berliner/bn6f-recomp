name: battleObject_applyStatusEffect_801A554
address: '0x0801A554'
kind: function
status: confirmed
summary: Applies the battle object's current status effect to itself by patching a collision-data field and setting
  an object flag from a status-effect table.
interface: void sub_801A554(r5=battle object) -> r2 (left over from last flag helper); clobbers r0,r1,r2,r3,lr and
  flags
details: 'Reads the object''s collision data pointer (oBattleObject_CollisionDataPtr, r5) and its status effect
  byte (oCollisionData_StatusEffectFinal). If zero, returns immediately doing nothing. Otherwise the status byte
  indexes a two-level table at off_80209EC: the high nibble minus one selects a sub-table pointer, the low 4 bits
  select an 8-byte entry within it (entry address = subtable + (status & 0xF) * 8). Each entry encodes one patch:
  +0 word is a flag value passed to object_setFlag2 on the object; +4 halfword is the value; +6 byte is the offset
  in the collision data where that halfword is stored (strh). After the patch, statuses 0x50-0x55 (in the given
  table''s numbering, e.g. panel-status range) additionally call object_clearFlag2 with value 6 on the object. Note
  the cmp pair uses signed-style blt/bgt on the status byte, so values >= 0x80 would fall outside the 0x50-0x55
  range check even though they''d otherwise be "between". The table lookup covers only sub-tables 1..15 (high nibble);
  a high nibble of 0 would index before the table base.

  '
