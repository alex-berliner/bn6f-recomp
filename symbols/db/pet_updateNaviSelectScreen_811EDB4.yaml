summary: 'Per-frame update of the PET navi-select screen: refreshes both background layers and the sprite
  frame table, handles A/B/START/d-pad input to pick a navi slot (or back out), and refreshes the PET
  comm-save state.'
details: 'CopyBackgroundTiles_PET_811EF70, CopyBackgroundTiles_onNaviSelect_811F54C, replaySpriteFrames_811F24C.
  Input ignored while GFX anim slot 0x10 is active, while the r5+9 cooldown counter is nonzero, or while
  a screen fade is active. B or START (or A when r5+4 >= 8) ends the screen: r5[0] = 8, r5[0xD] = 1, LoadGFXAnim(byte_811EB04)
  and LoadGFXAnim(byte_811EB5C). A on a slot with r5+4 < 8 selects it: PlaySoundEffect(SOUND_MENU_SELECT),
  r5[0] = 0x10, r5[1] = 4 - unless EVENT_PET_COMM_SAVE_DISABLED is set and the slot is 6 or 7, then SOUND_CANT_JACK_IN
  plays instead. RIGHT (r5+4 < 8) enters substate 8 (slot remembered in r5+3, r5+4=8, r5+6/r5+7 cleared);
  in substate >= 8, LEFT/UP/DOWN restores r5+3 into r5+4 with a 3-frame cooldown. Otherwise the d-pad
  moves the cursor via menu_moveCursorUpDown_811FA22 (LowSensitivityHeld, r5+4). Always calls sub_811F1B8,
  sub_811F0C8 and petCommSaveInit_811F11C.

  '
