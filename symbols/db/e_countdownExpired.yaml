name: e_countdownExpired
address: '0x08093202'
kind: function
status: probable
summary: Decrements the halfword frame counter at [r5,#0x18] and returns 1 when it underflows (timer expired),
  else 0; used by Groundman minigame callers to gate per-frame sequencing.
interface: (r5 = minigame state struct) -> r0 = 1 once the halfword counter at [r5,#0x18] underflows,
  else 0 (and the counter is decremented); flags clobbered by bl/branch usage
details: 'Decrements the halfword at [r5,#0x18]; while the result is >= 0 it stores it back and returns
  0, and only when the value would go negative returns 1 without decrementing further (it saturates at
  0xFFFF/underflow side). Callers treat a nonzero return as ''timer finished'': sub_8092FBE sets a done
  flag at [r5,#8] and returns 0, while sub_8092F1E and sub_8092FD2 only advance the minigame (move the
  player along grid coordinates, animate, spawn effects) when it has expired. So it acts as a wait/delay
  countdown gating the minigame sequence, one call per frame.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8093202: ldrh r0,[r5,#0x18]; sub r0,#1; strh back unless negative, returns 0/1 accordingly;
    sub_8092FBE: beq skips the [r5,#8]=1 done-flag write only when the return is 0 (still counting); sub_8092F1E:
    only on nonzero return does it move the player via ConvertGroundmanMinigameGridCoordsToMapCoords and
    set an animation; sub_8092FD2: on expiry converts grid coords and calls effect helpers sub_809323A/sub_80931FA
    with 0x40/8, i.e. expiry triggers the next step'
