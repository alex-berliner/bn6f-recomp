name: copyMemory_8001850
address: '0x08001850'
kind: function
status: confirmed
summary: Loads a fixed 0x800-byte graphics block into VRAM at 0x600D400 and a 32-byte block into IWRAM at 0x3001B40.
interface: void loadScreenGfx_8001850(void)
details: 'Parameterless routine that issues two fixed CopyByEightWords calls. The first copies 0x800 bytes from
  the ROM/data blob dword_86A5520 into VRAM at 0x600D400 (a tile/character block region). The second copies 0x20
  bytes from byte_86BEC80 into IWRAM at unk_3001B40, likely a small palette or attribute table used together with
  the VRAM data. Takes no arguments and returns nothing meaningful; R1/R2/NZC end up as left by the last CopyByEightWords
  call, and R3 happens to be preserved by the callee. The source addresses are fixed constants, so this is a one-shot
  asset load for a specific screen or state, not a general-purpose copy helper (the current name is misleading).

  '
