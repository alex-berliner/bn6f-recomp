name: sub_801E006
address: '0x0801E006'
kind: function
status: hypothesis
summary: Tiny wrapper that tail-invokes sub_801BEB8 with the hardcoded argument 0x40.
interface: void sub_801E006(void); /* no meaningful inputs besides lr; r0-r2 and nz/c flags returned from sub_801BEB8,
  whose results callers inspect */
details: 'Sets r0 = 1 << 6 = 0x40 (built as "mov r0,#1; lsl r0,r0,#6") and calls sub_801BEB8, returning whatever
  that callee leaves in r0-r2. The lsl is the last flag-setting instruction before the call and the callee leaves
  NZC untouched, so callers branch on the flags right after this function returns: 0x40 gives N=0, Z=0, C=0 (shifted-out
  bit). Nothing else is known about the purpose; the meaning of the 0x40 argument to sub_801BEB8 (mode? object id?
  screen?) is unidentified, so no game-term name can be justified yet.'
