name: battle_objectPhase4WaitStep
address: '0x080BB6E8'
kind: function
status: probable
summary: 'Battle-object state step: on first run sets phase 4, anim 0 and a 30-frame timer, then when
  the timer expires switches the object to CurAction 8 with phase 0.'
interface: (r0 unused; r5 = battle object) -> r0 clobbered; no return value
details: 'Uses r5 as a battle object (oBattleObject_* fields), no arguments. If CurPhase is 0 it initializes:
  phase = 4, CurAnim = 0, Timer = 30 frames, and returns for this frame. On later calls it decrements
  the shared Timer word (strh, so only the low halfword is the countdown); when it reaches 0 it sets CurAction
  = 8 and clears CurPhaseAndPhaseInitialized, handing control back to the action dispatcher. The 30-frame
  delay with anim 0 reads like a scripted pause/wait state before the object transitions to action 8 (whose
  meaning is not shown here). No callees, no callers known.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase] / bne: only phase 0 takes the init branch (0x080BB6EA-EC);
    init branch stores phase=4, CurAnim=0, Timer=0x1e (30 frames) at 0x080BB6F0-FC; ldrh r0,[r5,#oBattleObject_Timer];
    sub r0,#1; strh; bgt: frame countdown until zero (0x080BB6FE-704); on expiry stores CurAction=8 and
    clears CurPhaseAndPhaseInitialized (0x080BB706-70C); no bl instructions and no callers known; behavior
    defined entirely by the object struct writes'
