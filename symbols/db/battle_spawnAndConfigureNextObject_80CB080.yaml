name: battle_spawnAndConfigureNextObject_80CB080
address: '0x080CB080'
kind: function
status: confirmed
summary: Spawns a type-0x38 battle object (the "next" successor) and initializes its panel coordinates,
  element, alliance, and damage-disabler from a source object, then marks it active.
interface: void battle_spawnAndConfigureNextObject(u8 futurePanelX /*r0*/, u8 futurePanelY /*r1*/, u8
  element /*r2*/, BattleObject *source /*r5*/, u32 damageDisabler /*r6*/) — outputs r1/r2/r3 (leftover
  flags/alliance), clobbers r0 and nzcv, preserves r4-r7
details: Pushes lr and r0-r2/r5, then calls object_spawnType3(0x38). If the spawn returns null (r0==0),
  the popped r1 is already the new object's pointer and the function exits immediately (locret). On success
  it writes futurePanelX/Y from the pushed r1/r2 into oBattleObject_FuturePanelX/Y, copies the current
  PanelX/Y from the source (r5) into the new object, stores element from pushed r3, stores damageDisabler
  from r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler, copies the 16-bit AllianceAndDirectionFlip
  field from source, and ORs 0x10 into oObjectHeader_Flags to activate the object. The function's caller
  is named Next, indicating it spawns the successor object in a chip-effect or nav sequence.
