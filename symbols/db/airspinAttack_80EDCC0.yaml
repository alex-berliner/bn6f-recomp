name: airspinAttack_80EDCC0
address: '0x080EDCC0'
kind: function
status: confirmed
summary: 'Dispatcher for the AI''s "air spin" attack: reads the element of the last hit from the AI attack variable
  block and tail-calls the matching per-element handler.'
interface: void aiAirspinAttackDispatch(AIAttackVars* r7 /* attack var block */, pass-through r5, r6, r10; handler
  outputs r1, r5, r8-r12)
details: 'r7 points at the AI attack variable block used by the AI''s attack routines. The byte at

  oAIAttackVars_HitElement (the element of the hit being processed) indexes the two-entry

  table at off_80EDCD4: element 0 dispatches to ai_beastSpAttackStep (the shared

  beast-over/special-attack step handler), any other element value dispatches to

  sub_80EDD5C. The handler address is loaded into r1 and invoked with

  "mov lr, pc; bx r1" followed by "pop {pc}", so this is a plain call that returns here

  (the +1 Thumb bit is present on both table entries). The element value is also passed to

  the handler in r0, and r1 must still hold the handler address on entry — the handlers

  are expected to preserve r1 (or use it as their own input), which is why r1 shows up in

  this function''s outputs. r5, r6 and r10 from the callers are simply forwarded to the

  handler, and the handler''s register results (r1, r5, r8-r12) flow straight back out.

  There is a 2-byte .byte 0,0 padding before the literal pool.

  '
