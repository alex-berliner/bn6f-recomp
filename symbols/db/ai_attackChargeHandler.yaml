name: ai_attackChargeHandler
address: '0x080FF174'
kind: function
status: confirmed
summary: Drives the charge-up phase of an enemy AI attack, then releases it into the attack step with a counter
  delay and hit element.
interface: void ai_attackChargeHandler(BattleObject* r5 object, AIAttackVars* r7 ai /*, r10 in, unused by the code
  shown; r1 returned as-is except after the counter call */)
details: 'Part of the enemy AI attack state machine. r5 is a battle object and r7 points at that object''s oAIAttackVars
  block. If oAIAttackVars_AttackElement is still 0 (charge not started), it sets AttackElement to 4, switches the
  object''s animation (oBattleObject_CurAnim) to 10 - the charging pose - and arms oAIAttackVars_StepTimer with
  the byte value of oAIAttackVars_AttackBoost2 (so the boost stat scales how long the charge lasts). On subsequent
  calls it decrements StepTimer each frame; while it is still positive the handler just returns. When the timer
  runs out it resets oAIAttackVars_StepIndex to 0, calls object_setCounterTime(0x12 /* 18 frames */, r5) to request
  an 18-frame counter window from the object layer, and stores HitElement = 0xC (12) as a halfword. r1 is only defined
  after the object_setCounterTime call (whatever that callee returns in r1); on every other path the function leaves
  the incoming r1 untouched, so callers effectively get r1 passed through. r10 is listed in the contract but never
  referenced by the code. Flags nz/c/v are clobbered by the tst/sub and inside the callee.

  '
