open_questions:
- Which structure r5 points to (and which subsystem owns [r5+7]) - the 0x68/0x80 output offsets fit no identified
  struct yet
- What distinguishes IDs 0-4 from IDs 5+ in game terms (form variants? types? element IDs?)
- How callers use byte_80288B0 (r6) and what the table's 4-byte groups (0xE/0x10/0x30/0xC/0x20/0x01 values) encode
- Whether the NZCV output is intentionally consumed by callers or just an artifact of the Thumb add encoding
