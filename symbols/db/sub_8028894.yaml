name: sub_8028894
address: '0x08028894'
kind: function
previous_names: []
status: hypothesis
summary: Returns a pointer into a small per-BPwrAtk lookup table for the current actor
interface: (r5 = AIData*) -> r0 = pointer into byte_80288B0 ; r1 = 0x68 or 0x80 ; side effects none
details: "Loads the address of a small lookup table (byte_80288B0) into r6, then reads r5->BPwrAtk\n  (offset 0x7\
  \ in AIData). If that B-power-attack value is >= 5 it subtracts 5 from it and\n  picks the \"B\" branch (r1 =\
  \ 0x18 base); otherwise the \"A\" branch (r1 starts at 0). It then\n  left-shifts the index by 4 and adds 8 (so\
  \ each entry is 16 bytes, the first 8 are skipped\n  header padding), giving r0 the byte offset within byte_80288B0.\
  \ r1 is then biased by +0x68\n  (or +0x80 on the B branch). Returns via `pop {pc}` (tail-call). The 0x68/0x80\
  \ values look\n  like the slot size, with byte_80288B0 indexing panel-placement rows for chip select / attack\n\
  \  targeting given the B-button BPwrAtk.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#7]` reads AIData+0x7 which is `BPwrAtk`. - `cmp r0,#5` / `blt loc_80288A4` branch chooses
    between A-path (r1=0) and B-path (r1=0x18). - `lsl r0,r0,#4` then `add r0,#8` builds index*16 + 8 into a 32-byte
    table at byte_80288B0. - `add r1,#0x68` (or `#0x80`) shifts base by 0x68/0x80 to give the result register pairs
    that the callers (per contract r0/r1 out) consume as coordinates/placements. - Inline data byte_80288B0 is 32
    bytes; fits a 2-row × 16-byte chip-placement lookup. - Contract says only r0/r1 are out (no writeback to r5);
    this is a pure getter.'
