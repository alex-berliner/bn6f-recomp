name: sub_8028894
address: '0x08028894'
kind: function
previous_names: []
status: hypothesis
summary: Computes a (x, y) pair for selecting a B-button attack entry from AIData BPwrAtk and BLeftAbility, returning
  coords in (r0, r1)
interface: (r5 = AIData*) -> r0 = x, r1 = y ; no side effects
details: "Pushes lr, loads r6 with the address of a small 30-byte table at byte_80288B0 (a `bpwr_table` of u16\n\
  \  triples: panel-col/col-element/y), and reads the B-button power byte at AIData+0x7 (BPwrAtk).\n  If BPwrAtk\
  \ < 5, r1 = 0 (use base table columns); else r1 = 0x18 (use offset 0x18 block) and r0 -= 5.\n  Then r0 = (r0 *\
  \ 16) + 8 and r1 += 0x68, producing an (x, y) pixel position pair.\n  Pops PC to return. r6 is preserved only\
  \ as a working pointer.\n  Likely used by the AI subsystem to position a chip-select / B-button cursor based on\
  \ BPwrAtk and\n  BLeftAbility rows; matches the BLeftAbility selector in AIData.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#7]` reads BPwrAtk (AIData offset 0x7) per AIData.inc - `cmp r0, #5; blt loc_80288A4`
    chooses between two regions of byte_80288B0 (offset 0 vs 0x18) - `lsl r0, r0, #4; add r0, #8; add r1, #0x68`
    produces a packed (x*16+8, y+0x68) pair - `ldr r6, off_80288AC` and the embedded bytes form a 5-row x 2-block
    lookup table - Captured calls show lr=0x08028834 (a nearby caller in the AI battle story2 path) and consistent
    entry/exit register shapes across all 40 samples.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08028894

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: battle, battles1, battles2, battlesweep, beastsp, chips, fuzz, maps, menus2, menus3, story2,
    story4, story5, story6, story7, story8, story9'
  reproduce: 'grep -l ''^08028894 '' tools/traces/coverage/*.prof

