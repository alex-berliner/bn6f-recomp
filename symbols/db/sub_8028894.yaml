name: sub_8028894
address: '0x08028894'
kind: function
status: hypothesis
summary: Reads an ID byte from a work area and returns a pair of structure offsets (r0 = id*16+8, r1 = 0x68 or 0x80)
  plus the address of a small lookup table in r6.
interface: 'int sub_8028894(void* r5) // in: r5 = struct pointer whose +7 byte is the ID, lr = return; out: r0 =
  (id % group)*16 + 8, r1 = 0x68 or 0x68+0x18, r6 = &byte_80288B0, NZCV set from the final add'
details: "Pure selector/mapping helper with no memory writes. It reads an ID byte at [r5+7] and\nsplits it into\
  \ two groups: IDs 0-4 use the first half of byte_80288B0 with r1 base 0,\nIDs 5+ are decremented by 5 and use\
  \ the second half with r1 base 0x18. The returned\nvalues are:\n  r0 = groupIndex * 16 + 8   (a 16-byte-stride\
  \ entry offset, +8 into the entry)\n  r1 = r1Base + 0x68         (so 0x68 for IDs 0-4, 0x80 for IDs 5+)\n  r6\
  \ = address of byte_80288B0 (32-byte table, left in r6 for the caller to index)\nNZCV are set as a side effect\
  \ of the final 'add r1, #0x68' ( Thumb 'add' flag variant),\nand the register contract shows callers actually\
  \ observe them, so callers appear to\nbranch on this result. The table bytes (00/0E/10/30/20/01/0C patterns, arranged\
  \ in\n4-byte groups) are not referenced by this function itself beyond passing the pointer,\nso their meaning\
  \ is determined by the callers. Given the ID-split at 5, the 16-byte\nstride and the 0x68/0x80 destination offsets,\
  \ this most plausibly selects between two\nlayouts/variants of some entity or effect structure (e.g. two visual/state\
  \ variants\nkeyed by an ID stored at +7), but the owning subsystem is not identifiable from this\nfunction alone.\n"
