summary: 'Battle reward 1 (chip) roll: branches on NaviStats+0x26 bits 0/1 — bit 0: zenny-only path (sub_80AAA3C
  mode 0 + sub_80AAE98 + sub_80AAB04); bit 1 set: enemy-id chip path (sub_80AAA3C mode 1); else the normal path:
  sub_80AAA3C mode 0 picks the enemy id and damage_jitter_80AAA98 picks the column, the result halfword read from
  the id''s byte_80AAEA8 row.'
details: 'Body (asm29.s:11085-11145+): GetBattleNaviStatsByte(0x26); bit 0 set -> sub_80AAA3C(table, count, 0),
  sub_80AAE98(enemy id) then sub_80AAB04 (zenny-only drop: filters packed u16s with v>>14 == 1). Bit 1 set -> sub_80AAA3C(...,
  1) (filters entries through sub_80AAA1C before the roll) then damage_jitter_80AAA98 with last arg 2 (fixed column
  2 + the +0x14 / HP bonus path). Otherwise sub_80AAA3C(..., 0) and damage_jitter_80AAA98(..., 0): col = (r>>16)&0xF,
  pair = byte_8020B9C[bust*16+col], +2 if (r>>8)&1, +0x14 when HP <= 3*(MaxHP>>3); the halfword at row + 2*pair
  is the packed reward.'
