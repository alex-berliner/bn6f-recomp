name: SetCutsceneCameraScript
address: '0x08036F98'
kind: function
status: confirmed
summary: Points the cutscene camera engine at a new camera script and resets its command timer so playback
  starts from the beginning.
interface: void SetCutsceneCameraScript(void* cameraScript /* r0 */); clobbers r0, NZ flags; r1/r2 left
  as set by camera_writeUnk03_14_80301b2
details: Stores the given script pointer into eCutsceneCameraInfo (struct at 0x2011BD0) at offset 0 (CutsceneCameraScriptPtr)
  and clears offset 4 (Timer_CommandInitialized, the command timer/initialization flag) to 0, so the next
  camera update begins the new script from its first command. Then calls camera_writeUnk03_14_80301b2(0)
  with r0=0 (and r1 = &eCutsceneCameraInfo left over from the stores), which resets the camera's pending
  write/state fields (offsets 3 and 14 per its name). Final r1/r2 register values seen by callers are
  whatever that callee leaves behind. No return value is meaningful.
