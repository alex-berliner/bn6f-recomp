name: sub_80C5F2C
address: '0x080C5F2C'
kind: function
status: confirmed
summary: Spawns a battle object of spawn type 3 subtype 9 at the given panel with the given element, inheriting
  the source object's alliance and direction-flip.
interface: "u32 sub_80C5F2C(u32 panel_x, u32 panel_y, u32 element, ..., u32 src_obj /* r5 */, u32 dmg_counter_disabler\
  \ /* r6 */)\nreturns r0 = new object pointer (0 on failure), r1 = panel_x, r2 = panel_y,\n        r3 = element\
  \ (failure) or copied alliance/flip word (success), r5 = src_obj,\n        flags: N/Z set from new_obj, C=0, V=0\n"
details: "Registers r0..r3 and r5/r6 are pushed for the call. Uses object_spawnType3 with\nargument 9 to allocate\
  \ the new battle object. On success, writes:\n  - panel position (PanelX/PanelY bytes)\n  - element byte\n  -\
  \ oBattleObject_DamageAndStaminaDamageCounterDisabler (32-bit) from r6\n  - oBattleObject_AllianceAndDirectionFlip\
  \ (16-bit) copied from the source object r5\nThe \"mov r0, r5\" between the call and the pop doubles as a flag-setting\
  \ pseudo-add\n(sets N/Z from the pointer, clears C/V) so the subsequent `beq` is a null-pointer\ncheck on the\
  \ spawned object. On failure, r0 is cleared and the function bails;\nnothing is written.\n\nRegister form, old\
  \ prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
