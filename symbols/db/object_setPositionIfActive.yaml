name: object_setPositionIfActive
address: '0x0811A8F4'
kind: function
status: probable
summary: Wrapper that moves an object's sprite to (x,y) only if its 2008450-struct entry is still active.
interface: (r0 = x, r1 = y, r2 = index into eStructArr2008450) -> void; flags set from entry's in-use
  byte (used by caller via BEQ)
details: Saves r0/r1 (a coordinate pair), then calls getStructFrom2008450 with r2 to fetch the in-use/status
  byte and pointer of the 0x58-byte struct entry. If the byte is zero (entry inactive/free), it returns
  without doing anything. Otherwise it calls sprite_setCoordinates with the saved x/y on the struct pointer,
  letting sprite_setCoordinates pick the 0x10-byte sprite sub-entry via the resource byte 2 high nibble.
  Note it relies on getStructFrom2008450 returning the struct pointer in r1 while r0 holds the flag byte
  checked by the conditional branch.
