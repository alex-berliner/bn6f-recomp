  date: '2026-10-19'
  detail: getStructFrom2008450 call with r2, BEQ skips the rest when the entry's in-use byte is zero (asm
    loc before 0x811A90E); sprite_setCoordinates called with original r0/r1 restored from stack and r1
    = struct pointer from the getter; caller sub_811A878 is the sole user, so behavior is only seen in
