open_questions:
- which panel type 0xF6 actually is (grass/poison/dark etc.) and what the 0x8-flag status with timer 0x96
  does in-game
- what objects 0x173-0x17E are and why they are immune to the blind effect
- semantics of flags2 bits 0x8 and 0x20 and oCollisionData_BlindTimer elsewhere in the codebase
