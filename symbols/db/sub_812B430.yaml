name: sub_812B430
address: '0x0812B430'
kind: function
status: hypothesis
summary: Renders two eTextScript201BA20 text GFX panels into VRAM slots 0x20/0x21, propagates a source panel's tile
  dimensions to its destination, and copies two background tile blocks.
interface: 'void sub_812B430(void);

  // inputs: r10 (pointer to a panel struct containing sub-pointers at +0x38 and +0x40), lr

  // outputs/clobbers: r0, r1, r2, r3, r8, r9, r10, r11, r12, lr; NZCV flags

  // preserved: r4, r5, r6, r7 (saved via push/pop)

  '
details: 'Calls renderTextGfx_8045F8C twice with the same script (eTextScript201BA20) but

  different parameters: first writes to VRAM 0x06007200 using palette/tile data at

  byte_2017A00 with tile slot 0x20; second writes to VRAM 0x06007480 using

  unk_2017C80 with tile slot 0x21. Both passes use dword_86B7AE0 and args

  r4=0xA, r5=1, r7=0.


  Between the two text renders, reads the panel pointer at r10+0x40, loads its

  u16 width at +0x8 and u16 height at +0xA, then stores them as u32s into the

  destination panel at r10+0x38 (width to +0x8, height to +0xC). This

  propagates the source panel''s tile dimensions to the destination so the

  upcoming tile-block copies align correctly.


  Then calls CopyBackgroundTiles twice to copy 2x2-tile blocks of tile-id

  tables from byte_8129188 and byte_81291B0 onto the background grid at

  column 4 row 0x10 and column 6 row 0x11 respectively (r4=0xA, r5=2 tile area

  each).


  r4-r7 are push/pop''d so the function formally preserves them across the

  helper calls, even though the helpers (renderTextGfx, CopyBackgroundTiles)

  clobber them; this matches the register contract (preserved: r4 r5 r6 r7).


  Likely a chatbox/text-panel setup step in a non-battle UI scene (the

  `eTextScript201BA20` prefix suggests a text-script asset, and the use of

  VRAM tile slots 0x20/0x21 with CopyBackgroundTiles suggests menu/UI tile

  staging). Without a confirmed caller the exact scene (title, save, link, etc.)

  is unknown.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
