name: sub_80174BE
address: '0x080174BE'
kind: function
status: confirmed
summary: Tick a battle object's intro timer, ramping sprite mosaic and alpha until they clear and the state action
  phase is marked initialized.
interface: "void sub_80174BE(void);\n  // in:  r5 = battle object pointer (object header + battle fields)\n  //\
  \ out: r0 = return value (timer half while ramping, 8 when intro finishes);\n  //      r1/r5/r8/r9/r10/r11/r12\
  \ clobbered\n  // flags: NZCV clobbered; outgoing flags equal CMP(0, half - 0x10) mid-ramp,\n  //        CMP(0x20,\
  \ 0x20) (Z=1, C=1) on the terminal branch\n  // uses:  sprite_setMosaicSize, sprite_setAlpha_8002c7a, sprite_clearMosaic,\n\
  \  //        sprite_disableAlpha, battle_ClearAllianceTargetSlotIfSelf_802CDD0,\n  //        battle_getObjectNameID_8011020\n"
details: 'Increments oBattleObject_Timer on the object pointed to by r5; while the timer is below

  0x20 the object is fading in - mosaic size is set to timer>>1 (via sprite_setMosaicSize)

  and alpha is set to 0x10 - (timer>>1) (via sprite_setAlpha_8002c7a, whose return is

  discarded). When the timer reaches 0x20 the intro completes: sprite_clearMosaic and

  sprite_disableAlpha clear the effects, battle_ClearAllianceTargetSlotIfSelf_802CDD0

  removes this object''s slot from an alliance target list if it pointed at itself, bit 1 of

  oObjectHeader_Flags is cleared (dropping what looks like an "alive"/intro flag), the

  object''s name is refreshed via battle_getObjectNameID_8011020, and

  oBattleObject_CurStateActionPhaseAndPhaseInitialized is set to 8 to mark the state

  action phase as initialized. Function is only ever called from one site (see register

  contract: inputs r5/r10/lr), suggesting it is the per-frame tick of a state-driven

  intro handler.

  '
