open_questions:
- Which state/battle-action-phase installer drives this tick? The fixed "8" written to oBattleObject_CurStateActionPhaseAndPhaseInitialized
  implies a specific state id that isn't matched to a constant here.
- What does the cleared flag (bit 1) of oObjectHeader_Flags represent? Looks like an "intro complete" or "alive"
  bit but the field name only gives the address.
- The "CurStateActionPhaseAndPhaseInitialized" field name suggests a packed state/phase/initialized triple; only
  the value 8 is ever written, so the meaning of bits within it isn't fully nailed down.
- sprite_setMosaicSize is invoked with r0==r1 set to half - the readable C notes the external has no typed interface
  yet, so whether r1 is a second sprite index, a layer selector, or simply ignored is unknown.
