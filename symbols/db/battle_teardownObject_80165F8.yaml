name: battle_teardownObject_80165F8
address: '0x080165F8'
kind: function
status: confirmed
summary: 'Teardown routine for a single battle object: clears its collision region and result, releases
  its slot, blanks chip/related-object state, clears AI/barrier data, dispatches a version-specific actor
  init based on the enemy record, optionally signals the battle is over, and sets the object''s phase
  to 4.'
interface: "void battle_teardownObject_80165F8(void);\n  // r5 = oBattleObject * (input; not written through)\n\
  \  // lr = return address (preserved across the call, popped as pc at end)\n  // returns in r0 the value\
  \ 4 (0x4) and sets nz/c/v\n"
details: "Operates on a battle object whose pointer lives in r5 throughout. Calls, in order:\n  object_clearCollisionRegion,\
  \ battle_ClearObjectCollisionResult_801A5E2,\n  battle_resetCollisionState_80101C4, releaseSlotByValue_801DC36,\n\
  \  then writes 0 to oBattleObject_ChipsHeld, -1 (0xFFFF) to oBattleObject_Chip,\n  and 0 to oBattleObject_RelatedObject1Ptr.\
  \ Calls battle_clearAIDataAndBarrier_801A7F4.\nReads oBattleObject_NameID and uses GetVerActorTyAndAIIdx_80182B4\
  \ to fetch a\n3-byte record {version, actor_type, ai_index}. Only when actor_type == 0\ndoes it dispatch\
  \ on version: if version < 4 it calls sub_802D644(ai_index),\nelse sub_802D65E(ai_index) (presumably\
  \ the low/high two entries of the same\nactor-init dispatcher family).\nIf oBattleObject_Param2 < 1,\
  \ calls relatedToIsBattleOver_800A11C\n(used to signal the battle is over to its related object).\n\
  Always calls sub_802EF5C and finally stores 4 into\noBattleObject_CurPhaseAndPhaseInitialized, then\
  \ returns 4 in r0.\nQuirks: r4/r6/r7 are callee-preserved across the call; the function tail\npops {pc}\
  \ directly from {lr}, so it is a leaf-style jump-out rather than a\nbx lr. The \"battle is over\" notification\
  \ is gated on Param2 < 1, not <=.\nCurPhaseAndPhaseInitialized field is the same 16-bit field used elsewhere\
  \ to\nencode both the current phase and a \"phase initialized\" flag; here only the\nconstant 4 is written,\
  \ which (in the project's encoding for this struct)\nrepresents the \"ObjectHiddenDone\" / released\
  \ state.\n"
