details: 'The body is push {lr}; bl battle_getPlayerEmotionPriority; pop {pc} — a two-instruction tail-call
  wrapper around sub_8015BA8, which the disassembly has already identified as battle_getPlayerEmotionPriority
  (player/emotion priority lookup used by battle UI or emotion-face selection). No work of its own: r0
  is forwarded as the callee''s argument, r10 is untouched by this stub (whatever role it plays is entirely
  in the callee), and the callee''s r0-r6 outputs stand as this function''s outputs. Flags are clobbered
  by the callee''s execution as normal for a bl/pop pair; r4-r6 are listed as preserved at this level
  but appear among the callee''s outputs per the register contract, so callers reading them back are really
  seeing the callee''s return values. Exists purely as an ABI veneer — likely a distinct caller-site entry
  point or a compiler-generated thunk for the same underlying routine.

