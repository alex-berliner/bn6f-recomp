name: battleObject_setupSprite_80C4368
address: '0x080C4368'
kind: function
status: confirmed
summary: Initializes a battle object's sprite (collision data, tile/anim tables, palette, initial animation)
  and primes its state machine for update.
interface: void sub_80C4368(u32 battleObjectPtr /* r5 */); preserves r4; clobbers r0-r3, r5-r12, lr, nzcv
details: 'Operates on the caller''s battle object in r5. Reads oBattleObject_Param1 to index

  two lookup tables: off_80C42D4 (4-byte entries, stored into oBattleObject_CollisionDataPtr)

  and byte_80C4320 (2-byte entries: tile_id, anim_raw). Then calls sprite_load(0x80, tile_id, anim_raw),

  sprite_loadAnimationData, and sprite_noShadow. Palette selection: if Param2 == 0,

  reads oBattleObject_RelatedObject1Ptr and resolves it via sprite_getPalette to mirror

  a partner''s palette; otherwise uses palette 0. Sets oBattleObject_CurAnimAndCurAnimCopy

  to oBattleObject_Param4, then sprite_setAnimation, sprite_loadAnimationData, sprite_update.

  Finally writes CUR_STATE_UPDATE (constant value 4) to oBattleObject_CurStateActionPhaseAndPhaseInitialized

  and tails into sub_80C43C4 (likely the per-object init that pulls what was just primed).

  Prefixed push {lr} / pop {pc} – leaf-ish tail call into sub_80C43C4.

  '
