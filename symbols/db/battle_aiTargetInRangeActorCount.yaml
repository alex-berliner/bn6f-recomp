    mov r2,#0 / mov r4,#0x10 / mov r3,#0x10 / mov r5,#0 before the hit test: fixed 0x10x0x10 rect at origin;
    hit result in r0 is passed unchanged as AI index to battle_aiIndexToActorCount_8031980 (3 for 1, else
