name: battle_aiTargetInRangeActorCount
address: '0x080319FE'
kind: function
status: probable
summary: Checks whether a target-relative position falls within a fixed half-panel rectangle and returns
  3 if it does, else 2, for AI use.
interface: (r0 = entity ptr, r1 = target ref?) -> r0 = 3 if the rectangle test hits, else 2; flags from
  last call
details: First calls battle_calcRelPosToTarget_803172E to fill the scratch buffer with the entity's (and
  next-position's) coordinates relative to a doubled target point. It then sets up a fixed rectangle of
  0x10 x 0x10 at offset (0,0) and calls battleObject_isHitByPanelRectangle_8031570 with it. The hit flag
  (0/1) is fed directly as the AI-index argument to battle_aiIndexToActorCount_8031980, so the function's
  return value is 3 (AI index 1 = hit) or 2 (otherwise). Effectively this maps 'target within a 16x16-pixel
  box ahead' to a per-actor count used by an AI sub-state. The hit test result is otherwise discarded;
  only the mapped count escapes.
