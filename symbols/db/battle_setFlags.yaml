name: battle_setFlags
address: '0x0800A2D8'
kind: function
status: confirmed
summary: ORs the given flag bits into the current battle state's flags halfword.
interface: void battle_stateSetFlags(u32 flags /* r0 */) using r10 (toolkit); leaves r1 = BattleState*, r2 = new
  flags value; clobbers N/Z flags
details: Reads the BattleState pointer from the toolkit at oToolkit_BattleStatePtr (r10 is the global toolkit register),
  loads the flags halfword at BattleState + oBattleState_Unk_32, ORs in the bits passed in r0, and stores it back.
  Side-effect register returns are r1 (battle state pointer) and r2 (resulting flags value), which callers may rely
  on for chained operations. clobbers the NZ condition flags via the ORR. Trivial read-modify-write with no bounds
  or duplicate-write guard; callers elsewhere in battle code presumably use it to set state markers such as custom-screen-opened,
  turn events, or battle-phase bits, but the exact bit meanings live at oBattleState_Unk_32's other users.
