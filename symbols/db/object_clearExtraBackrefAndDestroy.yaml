name: object_clearExtraBackrefAndDestroy
address: '0x080CC472'
kind: function
status: probable
summary: Clears a back-reference stored via the object's ExtraVars pointer, then destroys the battle object.
interface: (r5 = battle object) -> r0 = destroyed; r1/r0 clobbered by callee
details: Reads the object's oBattleObject_ExtraVars pointer into r1; if the word at [r1] (the pointed-to
  structure's first field) equals r5, i.e. it points back at this object, it is cleared to 0. It then
  tail-calls object_genericDestroy, which releases panel tile reserves, collision data, and the object's
  memory. The back-reference clear must happen before destruction so the external structure never references
  freed memory. Uses r5 as the implicit object pointer rather than r0, matching the project's object-method
  calling convention.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1,[r5,#oBattleObject_ExtraVars]; ldr r0,[r1]; cmp r0,r5 — compares external record's first
    word against the object itself; str r0(=0),[r1] — nulls the back-reference only when it matched the
    object; bl object_genericDestroy — known destructor that frees panel tiles, collision data, and the
    object; pop {pc} without restoring r5 — r5 is the caller-preserved object pointer, standard for object
    routines
  refs:
  - bn6f/asm/asm31.s:43983
  - 0x08016C8A object_genericDestroy
  reproduce: python3 tools/asmcat.py 0x080CC472
