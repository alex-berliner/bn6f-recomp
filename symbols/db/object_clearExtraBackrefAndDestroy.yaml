name: object_clearExtraBackrefAndDestroy
address: '0x080CC472'
kind: function
status: confirmed
summary: Clears a battle object's extra-var slot if it back-references the object itself, then destroys the object
  via the generic destroyer.
interface: void object_clearExtraBackrefAndDestroy(u32 r5 /* object */); returns r5 (destroyer's result object)
  in r5
details: 'Small wrapper over object_genericDestroy called with r5 = battle object pointer.

  Reads the object''s ExtraVars pointer (r1 = [r5 + oBattleObject_ExtraVars]); if that

  slot is valid and its first word points back at the object itself ([r1] == r5),

  stores 0 there, dropping the stale self back-reference (e.g. a handle the object

  published in some shared slot that would otherwise dangle after deletion).

  If the extra-var slot points elsewhere (or is null), it is left untouched.

  Then tail-calls object_genericDestroy, which performs the actual teardown and

  whose r5 result becomes this function''s r5 output. Flags are whatever

  object_genericDestroy leaves (nz c v clobbered). Only r5 is touched by this

  function itself besides lr; r6-r7 preserved throughout.

  '
