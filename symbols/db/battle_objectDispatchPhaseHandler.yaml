name: battle_objectDispatchPhaseHandler
address: '0x080C32D8'
kind: function
status: probable
summary: Calls the current battle phase's handler for the battle object in r5, dispatching on oBattleObject_CurPhase.
interface: (r5 = battle object) -> tail-calls handler table[curPhase] (thumb); no return value of its
  own
details: 'Loads the object''s CurPhase byte at [r5,#oBattleObject_CurPhase], indexes off_80C32EC with
  it, and does a bx-to-lr thumb call into the selected handler. The table has two entries: phase 0 ->
  battle_onFrameFlagStartNextPhase, phase 1 -> sub_80C330E. It is a bare dispatcher with no state of its
  own; the callee receives lr already set for a return through pop {pc}. The +1 on table entries confirms
  THUMB callee addresses.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase] selects the index (sub_80C32D8 line 3); ldr r1,[r1,r0];
    mov lr,pc; bx r1 is an indexed thumb call through off_80C32EC (lines 4-6); off_80C32EC contains exactly
    battle_onFrameFlagStartNextPhase+1 and sub_80C330E+1, one per phase
  refs:
  - bn6f/asm/asm31.s:24922
  reproduce: python3 tools/asmcat.py 0x080C32D8
