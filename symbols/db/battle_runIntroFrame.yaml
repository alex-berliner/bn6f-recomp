name: battle_runIntroFrame
address: '0x081251F4'
kind: function
status: probable
summary: 'Per-frame battle-intro step: initialises chip-sprite slot buffer (r0=1), increments the intro
  frame counter at r5+0x74 (saturating at 0x7C and switching r5+2 to 0x18), forces r5+0x70=0xFF, pumps
  battle transition/arena tiles/sub_8126184, then sets halfword pair +0xC/+0xE on three pooled sprite
  structs with values (4,y) and (7,y), ending with sub_81267F0.'
interface: (r5 = battle-scene state struct) -> r0 clobbered; sets r5+0x70 = 0xFF, increments r5+0x74 (saturating
  at 0x7C), sets state byte r5+2 = 0x18 when counter reaches 0x7C
details: 'Called once per frame during battle scene setup: it first re-initialises the chip-sprite slot
  staging buffer at oToolkit_Unk200f3a0, then increments the counter at r5+0x74, clamping it to 0x7C and
  switching the scene state byte at r5+2 to 0x18 (advancing to the next phase) once that cap is reached
  (~2 seconds at 60fps). It forces r5+0x70 to 0xFF, runs battle_runTransition_8125444 (the one-shot transition
  pump) and bg_drawArenaTiles_8125E78 each frame. It then calls sprite_setStructHalfwordPairOnThree_8117084
  twice with value pairs (4, x) and (7, y), where the y value is normally 0 but becomes a halfword from
  the state struct (r5+0x26 when r5+0x60==5, the Dark-Chip alliance field; r5+0x1c when r5+0x5C==0x27;
  r5+0x3a when counter<=0x72 and r5+0x68==0x1D), suggesting sprite positions/params driven by special
  battle setups. The three-struct pool at 0x2008450 plus rows 4 and 7 hint at arena-edge or row-decoration
  sprites. Ends with sub_81267F0 whose role is unknown.'
