  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary misorders operations and mislabels sub_8126184. Asm shows initChipSpriteSlotBuffer is
    called first (with r0=1), then counter increment/saturate, then setting r5+0x70=0xFF and calling battle_runTransition,
    bg_drawArenaTiles, sub_8126184 in that order, before the sprite writes. The callee ''bg_drawArenaTiles_8125E78''
    actually distinguishes alliance==5 (Dark-Chip), and the sprite-setStructHalfwordPairOnThree calls
    use +0xC/+0xE on three structs at 0x2008450, not rows 4/7 of any struct. Also the halfword-pair values
    are (4, y) for first call and (7, y) for second, not (4,x)/(7,y). Functionally it is a per-frame battle-intro
    step, but the proposed name ''battle_stepIntroFrame'' and summary mix up the sequence and callee roles.;
    run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
