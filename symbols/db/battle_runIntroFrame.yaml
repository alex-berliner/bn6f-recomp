    area); calls battle_runTransition_8125444 and bg_drawArenaTiles_8125E78 unconditionally every call;
    r5+0x60 compared to 5, matching the Dark-Chip alliance team check documented in bg_drawArenaTiles_8125E78;
    two calls to sprite_setStructHalfwordPairOnThree_8117084 with rows 4 and 7 and conditional values
