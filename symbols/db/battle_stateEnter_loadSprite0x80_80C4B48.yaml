name: battle_stateEnter_loadSprite0x80_80C4B48
address: '0x080C4B48'
kind: function
status: confirmed
summary: State-entry handler for a battle object that loads its sprite resources (sprite 0x80, anim 0x14, palette
  0x16), picks the state's starting animation, switches to the "update" phase, and runs the state's per-frame update.
interface: void sub_80C4B48(void); // r5 = battle object (BattleObject*), r4/r6/r10 inputs passed through untouched
  to callees; returns with r0-r3 caller-clobbered, nzcv undefined
details: 'Entry handler for one state of a battle object''s state machine. Loads sprite resources via sprite_load(0x80,
  0x14, 0x16), then sprite_loadAnimationData and sprite_noShadow (this object casts no shadow). Sets bit 1 (value
  2) in oObjectHeader_Flags of the object at r5. Calls sub_80C4C52 which returns the starting animation id for this
  state in r1; stores it into both oBattleObject_CurAnim and oBattleObject_CurAnimCopy and applies it with sprite_setAnimation,
  followed by another sprite_loadAnimationData and sprite_update so the first frame is drawn. Writes CUR_STATE_UPDATE
  (4) into oBattleObject_CurStateActionPhaseAndPhaseInitialized to advance the state action to its update phase,
  then tail-calls the state''s update hook sub_80C4B84. The hard-coded sprite/animation/palette ids suggest this
  is the entry for one specific enemy/obstacle type rather than a shared generic handler. r4 is saved/restored only
  because the callees clobber it.

  '
