name: ow_playerAdvanceForwardStep
address: '0x0809D9A0'
kind: function
status: probable
summary: 'Overworld player ''advance forward'' step: if the player is on a 0x4C..0x4F trigger tile, add
  stored X/Y deltas to the player''s position; otherwise clear EVENT_1717_PLAYER_ADVANCE_FORWARD and reset
  the player''s action/jumptable state.'
interface: (r5 = OW player object, r0 unused) -> r0 = trigger id or 0; touches X/Y and state fields
details: Runs checkCoordinateTrigger_8031a7a on the object's coords at r5+0x1C and keeps the trigger id
  in r0. If the id is 0x4C..0x4F (four adjacent trigger/tile values, presumably 'can advance forward'),
  it adds r5+0x38 to the player's X and r5+0x3C to the Y — i.e. per-step movement deltas stored on the
  object — and returns without changing state. Otherwise it clears EVENT_1717_PLAYER_ADVANCE_FORWARD and
  zeroes the jumptable index (r5+0x09), ActionSubState, and r5+0x0B, ending the forward-walk action. The
  trailing off_809D9DC -> byte_809D07C points at an animation/state table used elsewhere. Note the object
  pointer arrives in r5, not r0, so callers must set it up specially.
