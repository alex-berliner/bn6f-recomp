open_questions:
- What structure backs the halfword event-flag table at r5? (Likely the save/event flag bit-array used by the rest
  of the game.)
- Why does the skip path add 8 when only 1 (selector) + 2 (immediate flag) bytes have actually been consumed? Probably
  to keep the layout uniform with the non-immediate path, but worth confirming against other mapScriptCutsceneCmd_*
  siblings.
- Are r6's tag values (1/2/4) consumed by ReadMapScriptByte/Halfword/Word as a "byte-width" indicator, or are they
  used elsewhere too?
