name: MapScriptCutsceneCmd_jump_if_flag_set
address: '0x08035962'
kind: function
status: confirmed
summary: Map-script cutscene command that branches the script cursor to a stored 32-bit offset when the selected
  16-bit event flag is set, otherwise skips past the 8-byte target slot.
interface: "/* r5 = flag_table (base of 16-bit event-flag table),\n * r7 = position (current script cursor),\n *\
  \ lr = return address */\nvoid MapScriptCutsceneCmd_jump_if_flag_set(u32 flag_table /* r5 */, u32 position /*\
  \ r7 */);\n/* -> r0 = 1 (always),\n *    r4 = jump-target word when flag set, else the resolved event flag value,\n\
  \ *    r7 = new script cursor (jump target when set, position+8 when clear),\n *    flags NZ (NZ set), C/V undefined\
  \ from pop {pc} */\n/* clobbers r0, r1, r3, r4, r6, r7, lr */\n"
details: "Implements one opcode of the map/cutscene script interpreter's conditional-jump handler.\n\n- Reads a\
  \ flag-selector byte from the script stream via ReadMapScriptByte (sentinel\n  value R6 = 1 marks the call). If\
  \ the byte is 0xFF (the .immediateEventFlag\n  branch), it instead reads a halfword (R6 = 2) that is the event\
  \ flag itself.\n- Otherwise treats the byte as an index into the halfword event-flag table\n  pointed to by r5\
  \ and loads the 16-bit flag with ldrh r4, [r5, r4].\n- Calls TestEventFlag (u16 flag in r0 -> !ZF) to test the\
  \ flag.\n- If the flag is set: reads a 32-bit jump offset from the script\n  (ReadMapScriptWord, R6 = 4), stores\
  \ it in both r4 and r7 so the script\n  cursor jumps to that absolute address.\n- If the flag is clear: skips\
  \ the 8-byte (32-bit word) jump-target slot by\n  adding 8 to r7; r4 keeps the resolved flag value.\n- Returns\
  \ r0 = 1 in both branches (opcode \"consumed one instruction\"), uses\n  pop {pc} for tail return so lr is clobbered.\n\
  \nQuirks:\n- The \"skip ahead\" amount is 8 bytes, not 4, even though the immediate\n  halfword flag path consumes\
  \ only 2 bytes after the 0xFF byte -- this\n  suggests the script layout reserves a fixed-size jump slot (1 byte\
  \ cmd +\n  1 byte selector + 2 bytes flag-or-pad + 4 bytes target = 8).\n- r1 is clobbered but never written by\
  \ the visible code; likely set inside\n  ReadMapScriptByte/Halfword/Word which is not in this snippet.\n"
