name: sub_81337C4
address: '0x081337C4'
kind: function
status: confirmed
summary: Folder-edit menu state machine dispatcher - reads the current step from [r5+3] and tail-jumps to the matching
  handler from a 4-entry table.
interface: 'void sub_81337C4(void) /* in: r2,r4,r5(struct ptr),r6,r7,r8,r10; out: r5,r8,r9,r10,r11,r12; clobbers
  r0-r4,r6,r7,lr,NZCV */'
details: 'Pure trampoline for the folder-edit menu. Loads the current state byte from offset +3 of the menu context
  struct in r5, indexes the jump table at off_81337D8 with it, and performs an indirect Thumb tail-call ("mov lr,pc;
  bx r0") so the chosen handler runs with the caller''s return address pushed on the stack and returns directly
  to sub_81337C4''s caller via "pop {pc}". The table has exactly four states: sub_81337E8 (step 0, apparently the
  init/idle step), folderEdit_step_813388C (step 1, already named as a folder-edit step handler), sub_81338D4 (step
  2), and sub_8133944 (step 3). All other registers (r2, r4, r6-r8, r10) pass through untouched to the handler,
  and the handler''s final r5 and r8-r12 become this function''s outputs; only r0/r1 and the flags are scratch.
  Because the handler executes inside the push {lr}/pop {pc} window, SP is 4 bytes below the entry SP during the
  call.

  '
