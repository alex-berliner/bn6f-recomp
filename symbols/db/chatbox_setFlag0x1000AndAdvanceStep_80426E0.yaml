name: chatbox_setFlag0x1000AndAdvanceStep_80426E0
address: '0x080426E0'
kind: function
status: confirmed
summary: Chatbox step handler that raises chatbox flag 0x1000 and advances the current chatbox state's step pointer
  by 2, returning 1 to continue.
interface: int chatbox_setFlag0x1000AndAdvanceStep(ChatboxState* state /*r4*/) -> r0 = 1; also clobbers r0/r1 via
  call, advances r4 by 2, sets NZ (r0=1) and C/V (from the add)
details: 'Very small step/opcode handler for the chatbox system. It calls

  chatbox_setflags_3e with mask 0x1000, so 0x1000 is one of the chatbox

  state''s flag bits (likely a "wait for input / page break"-style flag,

  exact meaning unconfirmed). It then does r4 += 2 on the pointer the caller

  passed in r4, i.e. it walks the chatbox state''s step/script counter

  forward by one 2-byte entry, and returns r0 = 1 (presumably "keep

  running" to the step dispatcher). r1 is preserved across the call and

  r5 is untouched; the callers only seem to rely on r0 and the updated r4.

  '
