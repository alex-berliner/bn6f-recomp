name: object_waitTimerThenSetAction4
address: '0x080D1AB0'
kind: function
status: probable
summary: 'Battle-object phase handler: waits Param1 frames (once), then ends the object''s action by setting
  CurAction to 4.'
interface: (r5 = battle object) -> r0 = remaining timer (or 0 when finished); flags from the timer decrement,
  r5 untouched
details: On first entry (CurPhase == 0) it stores phase 4 and seeds oBattleObject_Timer from the byte
  oBattleObject_Param1, so Param1 is the wait duration in frames. Every subsequent call decrements Timer
  and returns while it is still positive (bgt). When the timer expires it writes 4 to oBattleObject_CurAction
  and clears oBattleObject_CurPhaseAndPhaseInitialized to 0, handing control back to the object's action
  dispatcher. It uses r5 without saving it, so it is meant to be called from a dispatcher that already
  keeps the object pointer in r5. Phase 4 with a countdown suggests a generic delay/linger step before
  the object moves to action 4.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst; mov r1,#4; strb — one-time phase setup on first entry;
    ldrb r0,[r5,#oBattleObject_Param1]; strh r0,[r5,#oBattleObject_Timer] — Param1 is copied into the
    frame countdown; sub r0,#1; strh; bgt locret — returns each frame while the timer is still counting;
    mov r0,#4; strb r0,[r5,#oBattleObject_CurAction]; strh 0 to CurPhaseAndPhaseInitialized — terminates
    the action with CurAction=4; r5 is used with no push, so the caller supplies the object pointer in
    r5 (dispatcher-style call)
  refs:
  - bn6f/asm/asm31.s:56785
  reproduce: python3 tools/asmcat.py 0x080D1AB0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- No callers are known, so which battle objects use this and what action 4 means for them is unconfirmed
- Whether CurAction=4 is a generic 'done/idle' action or something object-specific
