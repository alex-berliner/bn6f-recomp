summary: The enemy setup of battle-settings entry 0x080B7254 (two Piranha2 and a mystery-data crystal); shows the setup format of 4-byte records.
details: |
  Read from the bytes (00 22 00 00 | 11 14 08 00 | 11 36 08 00 | 20 25 5A 00 ...) and the battle it gives:
  a 4-byte header, then records of 4 bytes: a kind (0x11 an enemy, 0x20 battle-start mystery data, 0xF0
  the end), a panel (the high and low nibbles: column and row, as the two Piranha2 stand), and a u16 (the
  enemy id: 0x08 = Piranha2, the Piranha family's second version; for 0x20 the mystery data's contents
  row). The other setups behind byte_80B7214's entries have the same shape.
