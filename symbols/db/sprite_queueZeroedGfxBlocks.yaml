    run wf investigate investigate-20261019-030611'
open_questions:
- caller sub_801D344 is unknown, so it is not confirmed whether the destination r1 is palette RAM (0x05000000)
  or OBJ/BG tile memory
- why the caller passes an ignored r0 (possibly ABI alignment of a 4-arg call)
