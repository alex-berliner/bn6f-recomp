name: library_rebuildCollectedChipList_8125B3C
address: '0x08125B3C'
kind: function
status: confirmed
summary: Rebuilds the chip library's collected-chip list from each standard chip's ownership/registration
  bytes and per-chip "how obtained" event flags, compacting gaps and returning the number of collected
  chips.
interface: (void) -> u32 collected_count (r0); r2 left as scratch leftover; r3 left as the last event-flag
  probe left it; nzcv clobbered
details: 'Zeros the chip collection list at dword_201F420 (0x578 bytes, ending at unk_201F998; one u32
  per library slot). For every standard chip id 1..0x13F, fetches its ChipData via getChip8021DA8 and
  uses field +0x15 as a 1-based library slot index. A chip is recorded only if it is owned (byte +9 bit
  0x40) and registered (byte +0x16 bit 1). Each recorded entry stores the chip id in the low halfword
  and a "how obtained" byte at +2, chosen from which event flag answers: flag 0x1E20+chip_id -> 0, flag
  0x2220+chip_id -> 1, flag 0x2020+chip_id -> 1 or 2 depending on event flag 0x1711 (tested via the immediate
  page/bit form). Counted entries fill slots at (lib_slot-1)*4; owned-but-unregistered or flagless chips
  leave their slot zero. After the scan, a compaction pass slides every non-zero entry down over empty
  slots so the list has no gaps. Returns the collected count in r0 (accumulated in r5 during the scan).
  Quirk: callers see stale register values in r2 (last bit-test immediate / moved pointer) and r3 (last
  flag argument handed to TestEventFlag) — the contract''s "outputs r2 r3" are leftovers, not data.

  '
