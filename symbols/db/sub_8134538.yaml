details: 'Trivial thunk: pushes lr, loads r0=0xE2 (226), r1=0x1C (28), r2=0x1E (30), r3=0x24 (36), tail-calls sub_8134558
  via bl, and returns with the callee''s result and condition flags. r4-r7 are untouched pass-throughs. The constants
  look like the kind of parameter bundle sub_8134558 expects for spawning/initializing something (e.g. entity/ID/coordinates
  or timing values), but the callee''s meaning is not established here, so no game-level name can be justified yet.'
