name: owPlayer_setS2000AA0Param0x4_809e314
address: '0x0809E314'
kind: function
status: confirmed
summary: Stores the given sprite id into the overworld player struct's sprite-id byte (eStruct2000aa0 field 4).
interface: void owPlayer_setSpriteId_809e314(u8 spriteId /* r0 */); // returns struct pointer in r3, lr used as
  return
details: 'One-line setter for the overworld player state held in eStruct2000aa0 (the struct at

  0x2000aa0). It loads the struct''s fixed address into r3 and writes the byte passed in

  r0 to offset 4 (byte_2000AA4), which the field name marks as the player''s current

  sprite id (Sprite_04). Callers pass the sprite id in r0 and call with lr so the

  function returns via "mov pc, lr"; because r3 holds the struct address on return,

  callers also get the eStruct2000aa0 pointer back in r3 as a side effect. Thumb, no

  other registers or flags touched.

  '
