name: screenFade_StopAndFreePalettes_8006330
address: '0x08006330'
kind: function
status: confirmed
summary: Stops a screen fade effect and frees the two palettes (base+0x12, base+0x13) the fade slot was using.
interface: 'void screenFade_StopAndFreePalettes(u8 fadeSlot); // in: r0 = eScreenFade slot index; out: r0-r2, nzcv
  from last callee; preserves r5'
details: 'Indexes the eScreenFade control-block array with r0 (r5 = eScreenFade + r0), then calls sub_800634C to
  stop/reset the fade for that slot. It then reads the fade block''s palette base id at offset +0xC and calls Terminate_ePalette20097a0_Transform
  twice, once for base+0x12 and once for base+0x13, releasing the two hardware palettes owned by the fade effect
  (likely the white/black overlay palettes used during screen fades). r5 is used as scratch but pushed/popped so
  it is preserved for callers. The palette offsets are fixed relative to the slot''s base, so all fade slots occupy
  the same two adjacent palette slots per fade instance.

  '
