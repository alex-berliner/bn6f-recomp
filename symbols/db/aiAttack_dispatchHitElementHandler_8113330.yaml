name: aiAttack_dispatchHitElementHandler_8113330
address: '0x08113330'
kind: function
status: confirmed
summary: Dispatches the AI attack-state post-hit handler via a small jump table indexed by the AI attack vars' HitElement
  byte.
interface: void sub_8113330(r5=workA, r6=workB, r7=AI attack vars, lr=return); tail-jumps through handler table,
  so r0=element and r1=table entry pass to the handler and its r1/r5/r8-r12 and nzcv results become this function's
  outputs
details: "Reads the byte at [r7 + oAIAttackVars_HitElement] (r7 holds the AI attack vars struct)\nand uses it directly\
  \ as a word offset into the table at off_8113344, i.e. the stored\nvalues are 0/4/8, not plain 0/1/2. It then\
  \ does the classic ARM/THUMB trampoline\n\"mov lr, pc; bx r1\" so the selected handler returns via pop {pc} here.\n\
  \nTable entries (thumb+1):\n  index 0 -> sub_8113350 (element 0 case; unknown, likely the default/none handler)\n\
  \  index 4 -> battleObject_advanceMoveStep_811339A (continue stepping through the attack)\n  index 8 -> genericAI_exitAttackStateAffterDelay_81097B4\
  \ (end the attack after its delay)\n\nThe handler is entered with r0 = HitElement and r1 = its own table entry;\
  \ everything\nelse it leaves in r1/r5/r8-r12 and the NZCV flags propagate outward unchanged.\nr5 and r6 are only\
  \ carried through to the handler; this routine itself only touches\nr0, r1 and lr.\n"
