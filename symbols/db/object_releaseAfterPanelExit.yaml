name: object_releaseAfterPanelExit
address: '0x080D9210'
kind: function
status: probable
summary: Releases a battle object from its panel after a short timer and clears its panel state.
interface: (r5 = battle object pointer) -> void; flags undefined
details: If CurPhase is zero, sets CurPhase to 4 and Timer to 8, then returns. Otherwise decrements Timer
  and ends once it reaches zero, subject to sub_80D9298. If that check succeeds, copies panel coordinates
  from object offsets 0x64/0x65 into PanelX/PanelY, refreshes pixel coordinates, clears Z16, and resets
  CurPhase to 0.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The function directly reads and writes oBattleObject_CurPhase and oBattleObject_Timer (lines
    3-8).; On timer expiry it calls sub_80D9298 and branches based on its Boolean result (lines 10-15).;
    Its successful path copies object panel data and calls object_setCoordinatesFromPanels (lines 16-21).;
    The zeroed CurPhase and cleared Z16 indicate an object exit/release transition (lines 20-23).
