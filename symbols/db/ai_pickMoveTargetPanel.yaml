name: ai_pickMoveTargetPanel
address: '0x08113F94'
kind: function
status: probable
summary: Battle AI helper that selects a destination panel for the object in r5 — trying a random effect-checked
  panel, then a random alliance-parameter panel, falling back to the object's own panel — and clears the
  panel reservation on the chosen tile.
interface: (r5 = battle object) -> r0 = chosen panel X, r1 = chosen panel Y; flags clobbered by calls
details: 'Reads the object''s PanelX/PanelY from the battle-object struct (r5) and first reserves that
  panel via object_reservePanel, likely so the random pickers won''t (re)select the tile it already occupies.
  It then calls ai_pickRandomPanelEffectCheck; if it returns nonzero, its r0/r1 panel coords are kept,
  otherwise battle_pickAllianceParamPanel is tried as a second candidate source, and if that also fails
  the object''s own panel coords are used. The chosen coords are pushed, and object_removePanelReserve
  is called with them (and r5) to release the reservation on the final panel before returning the coords
  in r0/r1. Quirk: the release is applied to the chosen panel, which exactly undoes the initial reserve
  only in the own-panel fallback case, suggesting the pickers or the caller rely on reservation bookkeeping
  being cleared for the selected tile. Runs only in battle (battlesweep routes), consistent with enemy
  movement/positioning AI.'
