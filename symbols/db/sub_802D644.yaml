name: sub_802D644
address: '0x0802D644'
kind: function
status: hypothesis
summary: Increments one byte-sized counter in an IWRAM array (byte_2000070) selected by index, saturating at 255
  instead of wrapping.
interface: void sub_802D644(u32 index /* r0 */); returns r2 = incremented (possibly clamped) value, flags from cmp
  against 0xFF
details: Loads a byte from byte_2000070[r0], adds 1, and stores it back only if the result is <= 0xFF, so counters
  saturate at 0xFF rather than wrapping to 0. The computed value is left in r2 and the NZCV flags reflect the comparison
  with 0xFF, which callers could use to test for saturation. byte_2000070 is an IWRAM array of byte counters; without
  callers identified, the exact game meaning of each slot (timer, hold/repeat counter, step counter, etc.) is unknown.
  lr is used as the return register (the routine returns via 'mov pc, lr') and only r0, r1, r2 and flags are touched.
