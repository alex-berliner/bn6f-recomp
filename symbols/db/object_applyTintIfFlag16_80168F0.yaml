name: object_applyTintIfFlag16_80168F0
address: '0x080168F0'
kind: function
status: confirmed
summary: If the object's state flags have bit 16 set, re-tints the object's sprites with the fixed palette shader
  0x7E94.
interface: void object_applyTintIfFlag16(object in r0 /* passed through to object_getFlag; r5 also live-in per caller
  analysis */) -> returns r3 from object_getFlag; clears carry (c=0)
details: 'Thin conditional wrapper around a sprite tint: calls object_getFlag on the object pointer, builds the
  mask 1<<16 with "mov r1,#1; lsl r1,#16" (which unconditionally clears the carry flag — callers read c after this,
  and v is preserved through the routine), and if flag bit 16 is set, calls sprite_setColorShader to apply color
  shader id 0x7E94 to the object''s sprites. Quirk: the shader id is fetched with a 32-bit literal-pool load (word_8016908),
  so sprite_setColorShader actually receives 0xB5007E94 — the upper half is the next function''s "push {lr}" opcode
  bytes, not part of the id. Appears to be a per-object "apply status/condition tint" hook, bit 16 presumably marking
  the state that warrants the tint (e.g. a status effect or highlight color).

  '
