name: object_saveStateAndSetState8_8133E7C
address: '0x08133E7C'
kind: function
status: confirmed
summary: Saves an object's current state byte into a backup slot and switches its state machine to state 8.
interface: void object_saveStateAndSetState8(void /* r5 = object struct */)
details: Operates on an object/entity struct passed in r5. Reads the state byte at offset 0x3, stores a copy of
  it into offset 0xD (a "previous state" slot used to remember where to return or resume), then writes the constant
  8 to offset 0x3 to advance the object's state machine to state 8. Clobbers only r0 and flags; nothing is returned.
  Callers presumably invoke this when the object reaches a transition point into state 8 while needing its old state
  preserved.
