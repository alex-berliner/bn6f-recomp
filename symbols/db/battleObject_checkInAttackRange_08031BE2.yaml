summary: Tests whether a battle object is within attack range of its target by computing position relative
  to a doubled target reference point and performing a half-plane intersection test.
interface: '(r0 = BattleObjectPtr, r5 = saved, lr = ret) -> r0 = 0 or 1 (boolean result) ; side effects:
  may read/write structure fields via the called helpers'
details: "The function tail-calls three helpers:\n\n  1. `battle_calcRelPosToTarget_803172E` is invoked\
  \ first with the incoming BattleObject pointer. Per its contract, it computes the entity's and its next-position\
  \ coordinates relative to a doubled target reference, storing results in a scratch buffer.\n\n  2. Immediately\
  \ afterward, the function sets r2=0, r4=0xc, r3=0x10, r5=0xc. These are the parameters consumed by `math_pointCrossHalfPlaneTest_8031594`,\
  \ which is a cross-product / half-plane test used as the inner step of polygon or attack-area overlap\
  \ checks.\n\n  3. The return value from the cross test is passed (still in r0) to `sub_8031B7C`, which\
  \ returns either the value or 0 depending on some condition (byte at [[dword_2013920] + 0x14]). The\
  \ final return value is the boolean 0 or 1 returned by this chain.\n\n  The leaf assembly (`push {lr}`\
  \ / `pop {pc}`, no own stack frame) shows this is a pure dispatcher wrapper that strings three existing\
  \ helpers together to implement a single check. The Tail-call pattern (`bl` followed by `pop {pc}`)\
  \ means each callee returns directly into the caller's caller.\n\n  Caller (lr=0x08031ad0 in all captured\
  \ samples) drives this in story2 battle contexts with the same BattleObject pointer and a uniform r1=0x7687\
  \ (likely a panel/AI-AttackVar index or field ID).\n"
