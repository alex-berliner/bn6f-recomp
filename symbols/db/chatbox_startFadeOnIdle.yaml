  reproduce: python3 tools/asmcat.py 0x0804A4D4
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The proposed summary and name are reasonable but not quite right. The function checks bits 0x80
    and 0x20 of eFlags2009F38, reads the chatbox state, and branches: if chatbox is busy it stores mode
    4 and calls sub_804AF20; if chatbox is idle it stores mode 0x10 and calls SetScreenFade(0xC, 0x10)
    — i.e. starts a fade, not fades out after close. So the name should reflect it starts a fade, not
