  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst r0,r0; bne skip-setup: one-shot init when element
    unset; strb r0(=4),[r7,#oAIAttackVars_AttackElement] and strh 0x13 into StepTimer set up the timed
    wind-up; mov r0,#5; strb r0,[r5,#oBattleObject_CurAnim] switches the object to attack animation 5;
    loop path decrements StepTimer and on expiry does strh 4,[r7,#oAIAttackVars_HitElement], delivering
