name: ai_attackChargeElem4
address: '0x08100870'
kind: function
status: probable
summary: 'AI attack state: on first run picks element 4, plays anim 5 and starts a 19-frame timer; when
  the timer runs out the hit is tagged with element 4.'
interface: (r7 = battle object AI vars, r5 = battle object) -> r0 = scratch; no meaningful return
details: Acts as an AI attack sub-state on oAIAttackVars. If AttackElement is still 0 (unset), it writes
  element 4 into AttackElement, sets the object's CurAnim to 5 (attack wind-up/charge anim) and loads
  StepTimer with 0x13. On subsequent calls it decrements StepTimer each frame; once it reaches zero it
  writes element 4 into HitElement, marking the attack as ready to connect. The element is hardcoded (4)
  rather than derived from the enemy's data, so this routine belongs to one specific enemy attack.
