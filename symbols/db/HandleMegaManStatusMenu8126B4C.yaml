name: HandleMegaManStatusMenu8126B4C
address: '0x08126B4C'
kind: function
status: confirmed
summary: Top-level state-machine dispatcher for the MegaMan status menu, tail-calling one of three state handlers
  based on the menu object's state byte.
interface: void statusMenu_dispatchState(void* menu /* r5 */) — reads menu->state (u8 at r5+1, values 0/4/8 as byte
  offsets), tail-dispatches to sub_8126B6C / sub_8126CC0 / sub_8126FF0; no outputs of its own, the handler returns
  directly to this function's caller.
details: 'Tiny thunk: loads the menu object pointer from R5, reads the state byte at [R5+1], and indexes the jump
  table at off_8126B60 with the raw byte (unscaled LDR, so the byte must already be a 0/4/8 word offset — the handlers
  keep it normalized that way). The dispatch is a tail-call via `mov lr, pc; bx r0`, so the selected handler''s
  return goes straight back to this function''s caller. Quirks for callers/lifters: on entry to the handler, R0
  still holds the dispatched table entry (Thumb address) and R1 holds the raw state byte; LR holds this function''s
  own epilogue address (pop {pc}), not a normal return address. The state byte is never bounds-checked — an out-of-range
  value would branch through garbage (unreachable in the shipped game).'
