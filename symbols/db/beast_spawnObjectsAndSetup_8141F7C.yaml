summary: Looks up a per-MapGroup beast-spread config; if the matching flag set hasn't been processed yet
  (or coords don't match), zeros a battle object buffer, spawns a set of scriptable overworld map objects
  (MapGroup-indexed) flagged by per-slot story flags, optionally drives a "beast spread" cutscene, then
  locks the elevator/jack-out state and clears setup flags.
interface: '(no args; uses r5 + r10 + lr from the caller) -> r0 = 0 or 0x10 (post-test Carry/non-carry
  result); side effects: clears/loads `unk_2000BE0` (0x140 bytes), clears flag 0x700/0x702, may start
  cutscene `byte_8089DF4` and call `gameState_setUnk09_8001172(0x54)`.'
details: '1. Pulls the Toolkit (r10) and follows GameStatePtr (+0x3c) into a SavedRealWorld... struct.
  Reads fields r2=byte[+4], r3=byte[+0xc], r0=byte[+5]<<2, r1=byte[+0xd]<<2 then pushes them — these are
  stored 16-bit coords/IDs for the "previous location" comparison.

  2. Tests flag 0x700 via `TestEventFlagFromImmediate`. If set, OR if r2 != r3 OR r0 != r1 (location mismatch),
  it zeroes 0x140 bytes at `unk_2000BE0` (via `ZeroFillByWord`) and runs `sub_814189A` to repopulate that
  buffer. Comparison is *signed/unsigned-on-bytes with shifted operands*: `r2==r3 && r0==r1` is the "already
  initialized for this location" branch.

  3. Calls `battle_getEnemyIndexFromMapGroup_8142080` (returns MapGroup-indexed slot 0..2 or 0xff), uses
  that index to look up a per-MapGroup table at `off_8141B18` (offsetted by `lsl r0,#2`). Walks that table,
  calling `sub_81420F0(r4)` → `TestEventFlag(r0)` per slot; for each unset slot it spawns `0x0d` (an overworld
  MapObject id) via `SpawnOverworldMapObject` and increments r4.

  4. Calls `sub_81418DA` with `(ldrb [dword_8142044+r0], 0x0f)` and `battle_getEnemyIndexFromMapGroup_8142080`
  again, then indexes `off_8141B24` and runs `SpawnObjectsFromList` with the matching script list to physically
  place the beasts on the map.

  5. If flag 0x702 is set: starts cutscene `byte_8089DF4` (per asm: `ldr r0, off_8142048 // =byte_8089DF4
  // CutsceneScript`) with param 0 and immediately clears 0x702 (so it only runs once per trigger).

  6. If the OW player Navi is "hovering elevator" (per `owMapObject_isHoveringElevator_0809E3A2`), sets
  `GameState.Unk_09 = 0x54` (custom cannot-jack-out state) and runs `reqBBS_setFlag_e17b0f7_8140A00` (sets
  event flag 0x7 in event byte 0x17 — the standard BBS-beast-related flag).

  7. Always clears flag 0x700 at exit (`ClearEventFlagFromImmediate`). Function is `void`-like — only
  r4/r5/r7/r3/r2 are restored, no real return value to callers (captured r0 differs across runs because
  the last `TestEventFlag` chain leaves residue; per contract out=`r2,r3,r5,r7`).

  '
