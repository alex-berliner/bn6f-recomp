open_questions:
- What bytes r2/r3/r0/r1 represent (the four reads at +4/+5/+0xc/+0xd of a Toolkit-followed struct); the
  offsets are consistent with a "previous MapGroup/Number + previous facing/identity" but the exact struct
  identity of the indirection via `[r10,#0x3c]` (GameStatePtr) → `+0x3c` would normally be the GameState
  tail, so likely a SavedRealWorldX/Y byte index into something custom rather than GameState itself.
- The meaning of `dword_8142044 = 0xFF050505` and why that byte is read into r0 to pass to `sub_81418DA(_,
  _, 0x0f)` is opaque.
- Whether `sub_814189A` is the actual beast-spread buffer initializer or merely one of several state initializations.
