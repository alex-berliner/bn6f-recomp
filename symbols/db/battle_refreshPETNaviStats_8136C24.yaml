name: battle_refreshPETNaviStats_8136C24
address: '0x08136C24'
kind: function
status: confirmed
summary: Reapplies the current PET Navi's stat initialization while preserving its in-battle stat values (HP, level,
  etc.).
interface: void sub_8136C24(void);  /* takes no arguments, returns nothing; r1, r2, flags c/v left from SetCurPETNaviStatsByte
  */
details: "Targets navi index 0 (the current PET Navi) via GetCurPETNaviStatsByte/Hword and their Set*\ncounterparts.\
  \ Snapshots 17 fields onto the stack (one slot is a padding/unused 0x0C gap),\ncalls GetNaviStatsIndexGivenCurPETNavi(0)\
  \ and init_8013B4E(stats_index, 0) to reinitialize the\nstats block, then writes every saved field back so the\
  \ navi's battle progress is not clobbered.\nStat ids touched (bytes unless noted):\n  0x0E, 0x21, 0x22, 0x2C,\
  \ 0x2D, 0x2E, 0x2F, 0x30, 0x09,\n  0x3E (hword), oNaviStats_CurHP (hword, read),\n  0x40 (hword, write — CurHP\
  \ restored here),\n  0x56, 0x57, 0x58, 0x59, 0x5A, 0x5B.\nQuirks: CurHP is read from oNaviStats_CurHP but written\
  \ back to stat 0x40; one stack slot\n(offset 0x08) is never read or written. The function does not consume its\
  \ own inputs, so\ncallers' r4/r6/r7/r10 are unused and r6/r7 outputs in the contract reflect end-of-function\n\
  register state inherited from the last SetCurPETNaviStatsByte.\n"
