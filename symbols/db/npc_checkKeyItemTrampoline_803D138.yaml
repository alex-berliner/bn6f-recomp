name: npc_checkKeyItemTrampoline_803D138
address: '0x0803D138'
kind: function
status: confirmed
summary: Thin trampoline that stashes a pointer in r4, then sequences sub_803D148 followed by CheckKeyItem
  to test whether the player holds a given key item.
interface: u32 r0 = keyItemId, u32 r1 = param, u32 r2 = ptrStashedToR4, r10 = toolkit; -> u32 r0 = checkResult,
  u32 r2 = data; clobbers r1, condition flags
details: push {r4,lr}; mov r4, r2 saves the caller's pointer argument into r4 so the two callees (sub_803D148,
  CheckKeyItem) can read it via the r4 register. sub_803D148 receives (r0, r1) unchanged and returns a
  value in r0 that is then fed as the sole input to CheckKeyItem. CheckKeyItem's r0 and r2 are the final
  outputs. All of r3–r7 pass through unmodified (sub_803D148 and CheckKeyItem preserve them, and pop {r4,pc}
  restores r4). The function contains no logic of its own beyond the register shuffling.
