name: ai_attackStateTick
address: '0x080FEDF0'
kind: function
status: probable
summary: Initializes and counts down an AI attack's step timer, then leaves the attack state when it expires
interface: (r0 = unused/preserved, r5 = battle object, r7 = oAIAttackVars) -> r0 = clobbered by calls;
  no meaningful return
details: On first call, when oAIAttackVars_AttackElement is 0, it sets AttackElement to 4, stores 0 into
  oBattleObject_CurAnim (r5), and copies AttackDuration into oAIAttackVars_StepTimer. On every later call
  it decrements StepTimer; when it reaches 0 it calls object_exitAttackState to end the attack. Element
  value 4 presumably denotes a specific attack type chosen here. The r0 argument is ignored, so parameters
  come via the r5/r7 object registers.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on oAIAttackVars_AttackElement with mov #4 store is the init-once branch (asm lines
    2-8); strh AttackDuration -> StepTimer copies the configured length into the countdown timer; StepTimer
    decrement with bgt loop is a standard tick timer pattern; bl object_exitAttackState on timer expiry
    ends the attack state'
