name: battle_pickAllianceParamPanel
address: '0x08114060'
kind: function
status: probable
summary: Picks a random candidate panel for a battle object, using an alliance-dependent parameter table
  and a fixed relative-offset panel list.
interface: (r5 = battle object) -> r0 = result of panelFlagCheck (panel pick / success); no flags documented
details: Reads the object's PanelX/PanelY and passes them with the table byte_8114160 to GetAllianceDependentPanelParamArgs,
  which resolves an 8-byte entry indexed by the object's alliance (team) field, yielding a param word
  and args pointer. It then calls panelFlagCheck_8015D80 with the candidate list byte_8114150, which walks
  relative panel offsets (0x7F-terminated), transforms them by the object's facing, and applies a filter
  (the param/args just fetched) to pick a random valid panel. The object pointer is taken from r5 rather
  than r0, so r0 is consumed as PanelX immediately. The result is whatever panelFlagCheck_8015D80 returns,
  presumably the chosen panel coords or a success flag for the caller at 0x08113F94.
