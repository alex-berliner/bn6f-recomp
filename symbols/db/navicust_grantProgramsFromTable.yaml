name: navicust_grantProgramsFromTable
address: '0x0813C030'
kind: function
status: probable
summary: Grants a range of NaviCust programs to the player, reading which ones/quantities from a lookup
  table.
interface: (no args) -> none; r0-r7 clobbered; calls GiveNaviCustPrograms(r0 = program id 0x94..0x148,
  r1 = table byte, r2 = 9)
details: Iterates r6 = 1,2,3... over StructArr_813944C using stride 0x40 (base = table + 0x40*r6 + 3),
  and within each 0x40-byte block reads bytes at 16-byte strides. For every nonzero byte it calls GiveNaviCustPrograms
  with r0 = a program counter starting at 0x94 and rising by 4 per block (up to < 0x14C), r1 = the table
  byte, and a constant r2 = 9. Since the caller is the chatbox routine chatbox_80426D4, this is a script-triggered
  event that unlocks a batch of NaviCust programs at once, with the table selecting which programs and
  how much of each.
