  sprite refresh; however the summary incorrectly claims object_presentCollisionData runs after the highlight
  while the code shows object_removeCollisionData/object_spawnCollisionData run first, and it omits object_updateSprite.
  The routine is correctly a per-frame tick of a battle object.
