  - bn6f/asm/asm03_2.s:8979
  - 0x0804AAA4 pet_menuCancel
  - 0x0804A4D4 sub_804A4D4
  - 0x080005CC PlaySoundEffect
  - 0x0804AB4C sub_804AB4C
  - 0x0804AB6C sub_804AB6C
