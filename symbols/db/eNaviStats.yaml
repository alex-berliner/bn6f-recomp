  date: '2026-10-18'
  detail: 'On the map after a battle, eNaviStats[0] +0x3E/+0x40/+0x42 read 620/620/620 (MegaMan, HP box 620) and
    eNaviStats[1] 800/800/800. The same (MaxHP, CurHP, MaxHP) triplet sits in six more places: eBattleNaviStats
    (0x203CE00) +0x3E, and unnamed blocks at 0x0203C9E4, 0x0203CB10, 0x0203CC34, 0x0203F4F4, 0x0203F5F4 (+0x3E each),
    so these look like NaviStats copies too. Writing CurHP in all seven plus eStruct2035280+0x24 with its redraw
    bit did not change the map''s HP box (box error 18.8 -> 17.1 at best), so the map box draws from elsewhere.'
