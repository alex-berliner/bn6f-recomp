summary: 'The navis'' NaviStats blocks (include/structs/NaviStats.inc, 0x64 each, MegaMan''s first): +0x3E MaxBaseHP,
  +0x40 CurHP, +0x42 MaxHP. MegaMan''s HP carries over between battles here.'
