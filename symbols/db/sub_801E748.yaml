summary: One-line wrapper that tail-calls sub_801BEB8 with argument 0x8000 (bit 15 set).
interface: void sub_801E748(void); /* tail-calls sub_801BEB8(0x8000); r0-r2, NZC and LR returned through from the
  callee */
details: 'Sets r0 = 1 << 15 = 0x8000 (via "mov r0,#1; lsl r0,r0,#15") and immediately tail-calls

  sub_801BEB8 (pop {pc}), so all of the callee''s return values (r0-r2, NZC flags) pass

  straight through to this function''s caller. The literal load also sets flags before the

  call: 0x8000 -> N=0, Z=0, and the shift of the value 1 produces C=0, which the callee

  preserves on exit. No other registers are touched and nothing is read from memory, so

  the function''s meaning is entirely determined by what sub_801BEB8 does with the 0x8000

  (single bit 15) argument — likely a bitfield selector or mode flag in whatever subsystem

  sub_801BEB8 belongs to.

  '
