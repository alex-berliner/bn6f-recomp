  date: '2026-10-19'
  detail: bl object_getFrontDirection then add r0, PanelX gives the front column (80F0E3A-80F0E40); three
    object_isValidPanel guards wrap three identical calls with r6 = [r7,#oAIAttackVars_Damage]; second/third
    blocks use PanelY-1 and PanelY+1 with unchanged PanelX (80F0E5C, 80F0E78); callee object_getFrontDirection
    summary matches use as facing +/-1 multiplier; sole caller sub_80F0C64 is an AI attack context (oAIAttackVars
