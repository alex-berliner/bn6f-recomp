name: ai_attackFrontAndVertical
address: '0x080F0E3A'
kind: function
status: probable
summary: AI attack step that deals the attack's damage to the panel in front of the object and to the
  panels directly above and below the object.
interface: (r0 = object ptr in r5?, r5 = battle object, r7 = AI attack vars) -> void; r0 = validity flag
  from last panel check
details: Using object_getFrontDirection (+1/-1 from alliance/DirectionFlip), it computes the panel one
  step ahead of oBattleObject_PanelX and, if object_isValidPanel accepts it, calls sub_80D0996 with r6
  = oAIAttackVars_Damage, r2 = 0, r4 = 0. It then repeats the same damage call for (PanelX, PanelY-1)
  and (PanelX, PanelY+1), each guarded by object_isValidPanel, so out-of-grid rows/columns are skipped.
  sub_80D0996 presumably applies damage/effect to one grid panel; r2 and r4 are zeroed constants (likely
  element/type/flags). The caller sub_80F0C64 is an AI attack routine that sets up oAIAttackVars_Damage
  beforehand.
