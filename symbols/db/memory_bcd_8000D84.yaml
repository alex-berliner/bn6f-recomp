open_questions:
- Why does the function expose minutes<<16 in r2 and seconds<<8 in r3 separately from the packed r0 result — is
  there a caller that reads them individually?
- Is the 0x1499727 frame cap exactly 100 hours of frames (i.e. ~99:56:39.95 of real play time), and is the 0x99595999
  sentinel a fixed game-side constant or a coincidence of the BCD saturation?
- Does memory_bcdConvert clamp inputs to two decimal digits, and does it handle values >= 100 by itself?
