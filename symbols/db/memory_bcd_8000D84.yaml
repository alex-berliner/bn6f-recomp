name: memory_bcd_8000D84
address: '0x08000D84'
kind: function
status: confirmed
summary: Converts the save/play-time frame counter into a packed-BCD HH:MM:SS.cc value used by the play-time display,
  capping at 99:59:59.99.
interface: u32 playtime_framesToPackedBcd(u32 frames /*r0*/); /* returns packed BCD in r0; r2 = minutes<<16, r3
  = seconds<<8 on normal path (preserved on overflow); clobbers nzcv/r1; preserves r4,r7 */
details: 'Saturates inputs above 0x1499727 frames to the BCD sentinel 0x99595999

  (== 99:59:59.99). Otherwise calls clock_breakPlayTimeIntoHMSF_8000DE0 to get

  hours/minutes/seconds/frames, BCD-encodes each via memory_bcdConvert, converts

  the sub-second "frames" (1/60 s) into hundredths with swi 6 Div (frames*100/60,

  signed), then packs the four BCD fields into one word as

  (hours<<24)|(minutes<<16)|(seconds<<8)|centis. Leaves minutes<<16 in r2 and

  seconds<<8 in r3 so callers that only need those fields can skip unpacking.

  '
