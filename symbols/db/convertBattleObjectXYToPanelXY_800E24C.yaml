name: convertBattleObjectXYToPanelXY_800E24C
address: '0x0800E24C'
kind: function
status: confirmed
summary: Reads a battle object's pixel-space X/Y position and converts it to panel (grid) coordinates.
interface: Next convertBattleObjectXYToPanelXY_800E24C(BattleObject* r5 obj); returns panel X in r0 and panel Y
  in r1 (set by convertXYToPanelXY_800E258); clobbers flags and lr
details: Thin wrapper around convertXYToPanelXY_800E258. Takes the battle object in r5 (preserved by the callee
  per the contract), loads its pixel-space position from oBattleObject_X and oBattleObject_Y, and passes them as
  r0/r1 to the coordinate converter, branching to it with bl and returning immediately after with pop {pc}, so the
  converter's return values flow straight back to the caller. r5 and r6 are preserved throughout (r6 untouched here
  but listed in the contract since callers see it preserved). No other object fields are touched.
