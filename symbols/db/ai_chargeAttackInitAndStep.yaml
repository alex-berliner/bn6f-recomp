name: ai_chargeAttackInitAndStep
address: '0x081151CC'
kind: function
status: probable
summary: 'Runs an AI battle object''s charging/ramming attack across the panels: initializes it on the
  first call, then advances its scripted move each frame.'
interface: (r7 = AI attack vars, r5 = battle object) -> void; branch into runMoveStep once AttackElement
  is set
details: 'Acts as the per-frame driver of one AI attack. If oAIAttackVars_AttackElement is 0 it initializes:
  sets AttackElement = 1 as a ''started'' marker (later calls tail-branch into ai_attackVars_runMoveStep_8115272
  at loc_81152CA instead). If object_canMove reports the object blocked, it bails out via object_exitAttackState.
  Otherwise it sets up collision via object_updateCollisionData (modifier 0x35, args 2 and 3), ORs OBJECT_FLAGS_CANNOT_SLIDE
  and the bit-22 flag with object_setFlag1, and — unless GetBattleMode returns 6 — arms a counter window
  of 0x10 via object_setCounterTime. It then picks oAIAttackVars_AiAttackParam from table off_8115234
  (1,1,2,6,7,0x20,8,8) indexed by AttackBoost2, sets the object''s current animation to 2, StepTimer to
  0xC, TimerOrCycles and SubStepIndex to 1, HitElement to 4, and calls sub_8115492 to finish setup/start
  the first step.'
