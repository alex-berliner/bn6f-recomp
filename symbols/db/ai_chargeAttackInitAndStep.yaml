    cannot act; bl object_updateCollisionData (r1=0x35, r2=2, r3=3) + object_setFlag1(CANNOT_SLIDE, bit22)
    — arms collision for a body charge; bl GetBattleMode; cmp r0,#6; mov r0,#0x10; bl object_setCounterTime
