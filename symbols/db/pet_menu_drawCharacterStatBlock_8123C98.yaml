status: probable
summary: 'PET status sub-screen: clears the status tilemap area, fills it with the pre-loaded char stat
  tiles, and renders the status icon for the active PET navi.'
interface: '(r5 = SubMenu* / runtime state, r10 = Toolkit*, lr = ret) -> void ; side effects: clobbers
  r0–r7/lr, writes tilemap at unk_20347D8 and the status block bg tiles via CopyBackgroundTiles.'
details: "1. call_sub_3005EBA(3,6,2,0,0x17,2) at the start books a 3x6 blank-tilemap run over rows 0x17\
  \ and width 2 (acts as a clear/erase before drawing).\n  2. Reads r7 = r5 (submenu pointer); loads byte\
  \ at [r7+0xc] twice (the redundant pair suggests cache priming), pushes it through sub_8137884, and\
  \ shifts right 4 to obtain a high nibble -> selects one of four 0xB-long blank-tile rows in unk_20347D8\
  \ (the IWRAM tilemap scratch).\n  3. sub_8120348(unk_20347D8, 0xb, 2, 1, 0xf) fills 0xB u16s of the\
  \ tilemap with the \"blank text-box tile\" by sub_8120348's contract.\n  4. CopyBackgroundTiles(j=0xb,\
  \ i=6, tile_block=2, tiles=unk_20347D8, j_size=0xf, i_size=2) commits those 0xB*6 tile IDs into bg tile\
  \ block 2 starting at row 6.\n  5. Reads [r7+0x14] (FuturePanelX-style field on the submenu/pet context)\
  \ and GetCurPETNaviStatsByte(value, 9) -> returns byte 9 of the navi stats (RegUP per NaviStats.inc).\n\
  \  6. battleObject_drawIndicatorOrStatusIcon_812053C(value, 0x8160, 0x37) draws the per-status icon\
  \ at slot 0x37 with palette arg 0x8160; runs entirely in r0/r1/r2 -> nothing returned (void).\n"
