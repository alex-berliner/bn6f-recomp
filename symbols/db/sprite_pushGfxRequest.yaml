name: sprite_pushGfxRequest
address: '0x030061C8'
kind: function
status: probable
summary: Appends an 8-byte sprite resource request record {r7, r6} to a work queue, bumping the queue
  count.
interface: (r7 = request field A, r6 = request field B) -> r0 = none; appends to dword_200A890[count],
  increments dword_20093A8
details: Reads the count from dword_20093A8, increments it, and writes an 8-byte entry {r7 at +0, r6 at
  +4} into the array at dword_200A890 at index (count-1)*8 — a push onto a record queue. Values come from
  the caller's registers, not arguments, so it relies on sprite_ensureGfxResident keeping r6/r7 live (the
  two fields are almost certainly a resource id/handle pair). dword_20093A8 is a shared counter, so this
  queue is consumed elsewhere by sprite-resident/dma-handling code.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r3,[dword_20093A8]; add r3,#1; str back — queue count is incremented before use; lsl r3,r3,#3
    then add to dword_200A890 — 8-byte-stride record array indexed by count; str r7,[r2]; str r6,[r2,#4]
    — writes caller's r6/r7 pair as one record; sole caller sprite_ensureGfxResident 'Make sure an object's
    sprite tiles are in OBJ VRAM' — entries are sprite-gfx requests
