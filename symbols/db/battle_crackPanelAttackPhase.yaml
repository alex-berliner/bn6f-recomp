name: battle_crackPanelAttackPhase
address: '0x080D2904'
kind: function
status: probable
summary: Phase handler for an attack object that highlights a target panel and cracks it after a timed
  windup.
interface: (r0 = unused/discarded, r5 = battle object ptr) -> r0 = object_crackPanel result at end; sets
  oBattleObject_Param2=1 when phase finishes
details: On the first run (PhaseInitialized==0) it stores 4 into PhaseInitialized, sets CurAnim=0x12,
  copies ExtraVars[0x12]/[0x13] (target panel column/row) into Param3/Param4, sets Timer=60 and Timer2=0.
  Each frame it increments Timer2 and every 8 frames calls object_highlightPanelRegion(col,row,4,AllianceAndDirectionFlip)
  to pulse a highlight over the target area. When Timer hits 30 it validates the panel with object_isValidPanel,
  calls sub_80D2A14 (probably fetches the panel/object state) and sub_80E4FCA with args (col,row,0x10,0x100),
  likely spawning a crack effect object. When Timer hits 20 it calls object_crackPanel(col,row), converting
  the panel to cracked. When Timer reaches 0 it writes 1 to Param2, the phase-complete flag.
