name: toolkit_resetToolState_813B768
address: '0x0813B768'
kind: function
status: confirmed
summary: Clears the toolkit's Unk2004334 halfword and zeroes the 16 bytes behind its Unk200431c pointer, resetting
  some subsystem's per-frame/per-session state.
interface: void sub_813B768(r2 passthrough) // reads r10 (toolkit), writes r2 through unchanged; clobbers r0, r1,
  lr and flags
details: Loads the toolkit pointer from r10, reads the pointer field oToolkit_Unk2004334_Ptr and stores 0 as a halfword
  at its target (a state/counter/flag), then reads oToolkit_Unk200431c_Ptr and calls ZeroFillByByte with 0x10 to
  wipe 16 bytes at its target. r2 is preserved untouched and returned, so callers use this as an inlined-thunk-style
  pass-through while the reset happens as a side effect. The 0x10-byte region and the cleared halfword are likely
  a small work structure plus a mode/active flag for the same feature; which feature owns Unk200431c/Unk2004334
  is not determinable from this function alone.
