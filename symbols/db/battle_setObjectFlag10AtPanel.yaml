name: battle_setObjectFlag10AtPanel
address: '0x080DD5B4'
kind: function
status: probable
summary: Looks up a battle object at the given panel coordinates and sets flag bit 0x10 in its header
  flags.
interface: (r0 = panelX, r1 = panelY, r2 = 0, r3 = 0) -> r0 = object header ptr or 0; no flags of note
details: The function first calls sub_80DD594 with the four arguments unchanged; that callee evidently
  resolves a panel position (and two zero parameters) to an object header pointer, returning 0 if none
  is found. If a header is returned, the function reads oObjectHeader_Flags, ORs in 0x10, and writes it
  back, leaving r0 holding the header pointer. The only caller computes r4 = 0x0203xx03 from its DamageAndStaminaDamageCounterDisabler
  field but the callee under review never uses r4, so that value is incidental leftover (or passed through
  to a deeper callee conventionally). Bit 0x10 in oObjectHeader_Flags is presumably a state bit such as
  'hidden/inactive', but its meaning is not shown here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80DD5B4: bl sub_80DD594; beq locret skips when no object found; sub_80DD5B4: ldrb r1,[r0,#oObjectHeader_Flags];
    orr r1,#0x10; strb back — sets one flag bit; caller 0x080C3EDA: ldrb r0,[r5,#oBattleObject_PanelX];
    ldrb r1,[r5,#oBattleObject_PanelY]; mov r2,#0; mov r3,#0 — args are panel coords plus two zeros; caller
    ignores the return value and immediately pops/returns, so the call''s effect is the flag write'
