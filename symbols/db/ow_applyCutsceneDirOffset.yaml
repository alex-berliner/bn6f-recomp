name: ow_applyCutsceneDirOffset
address: '0x0809C890'
kind: function
status: confirmed
summary: Computes a position next to the player for a cutscene actor by adding a per-facing-direction offset (selected
  from a table by the cutscene state's direction byte and an actor slot byte) to the player's tile coordinates.
interface: "u32 ow_getPlayerPosPlusFacingOffset(u32 actor /* r5, byte +4 used */);\n/* r10: overworld context, passed\
  \ through to ow_getPlayerPosition;\n   returns r1 = (playerX + offX) << 16, r2 = (playerY + offY) << 16,\n   r3\
  \ = (playerZ + offZ) << 16, r5 = actor unchanged, r0 = 0;\n   clobbers r0, flags, lr; preserves r4-r7 */\n"
details: 'Calls ow_getPlayerPosition (which consumes the r10 context) and takes the high halfwords of r1/r2/r3 as
  the player''s tile-space x/y/z. Reads the cutscene state pointer from eCutsceneState+0x70 and its facing-direction
  byte at +0xC (values 0-3: down/right?/left?/up? — the four rows are +x, +y, -x, -y offsets respectively). Indexes
  off_809C8CC[dir] to pick one of four 24-byte tables (byte_809C8DC/F4/90C/924), each holding three 8-byte slots
  of three halfword deltas: 0x20/0x40/0x60 pixels forward, or -0x20/-0x40/-0x60 (0xFFE0/0xFFC0/0xFFA0) for the opposite
  direction, with the other two axes always 0. The byte at actor+4 selects the slot (slot<<3), i.e. which of three
  positions relative to the player (near / mid / far, or front / beside / behind) the actor takes. Adds each delta
  to the corresponding coordinate and shifts each sum back left 16 bits so the result is returned in the same packed
  halfword-high format the position came in. r5 (the actor pointer/handle) is passed through untouched so callers
  can chain. Effectively "where should this cutscene character stand relative to the player, given where the player
  is facing".

  '
