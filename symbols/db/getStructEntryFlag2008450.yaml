name: getStructEntryFlag2008450
address: '0x080466C4'
kind: function
status: confirmed
summary: Returns the first byte (an in-use/status flag) of entry `index` of the fixed 0x58-byte struct array at
  eStructArr2008450, with NZ flags set from that byte.
interface: 'u8 getStructFrom2008450(u32 index); /* r0 in: entry index; r0 out: flag byte, NZ set from it; r1 out:
  entry address, r2 out: 0x58*index; C/V left from the base+offset ADDS */'
details: 'Pure addressing helper: multiplies r0 by 0x58, adds it to the base of eStructArr2008450 (a fixed array
  of 0x58-byte records), and loads the byte at offset 0 of the selected entry — apparently that record''s "in use"/state
  flag. The loaded value is returned in r0 with NZ flags set via `tst r0, r0`, so callers can branch directly on
  zero/nonzero. As a documented quirk, callers rely on r1 holding the entry''s address and r2 holding the byte offset
  after the call, and on C/V reflecting the ADDS (base + 0x58*index) rather than the trailing TST — the lifter reproduces
  both. No memory is written and no other fields of the record are touched. What the records at eStructArr2008450
  represent in gameplay (NPCs, objects, entities, ...) is not established from this function alone; the name stays
  mechanical until the array''s consumers are identified.

  '
