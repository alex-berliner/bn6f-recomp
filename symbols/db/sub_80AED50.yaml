name: sub_80AED50
address: '0x080AED50'
kind: function
status: confirmed
summary: Resolves an enemy index to a per-version AI data record via a two-level (actor_type → ai_index) table.
interface: 'u32 resolveEnemyAiRecord_80AED50(u16 enemy_idx); // in: r0 = enemy_idx; out: r0 = AI record pointer,
  r2 = ai_index*4, r3 = version*0x20'
details: "Calls GetVerActorTyAndAIIdx_80182B4 to map enemy_idx → { version(u8), actor_type(u8), ai_index(u8) }.\n\
  Uses the two-level table rooted at off_80AED74:\n  - actor_type * 4 indexes off_80AED74 to pick a sub-table (off_80AED80\
  \ for actor_type 0;\n    off_80AEE0C for actor_types 1 and 2).\n  - ai_index * 4 indexes that sub-table to pick\
  \ a record.\n  - version * 0x20 (records are 0x20-byte versioned copies) is added to reach the\n    version-specific\
  \ record, which is returned in r0.\nThe side outputs r2 = ai_index*4 and r3 = version*0x20 are convenient for\
  \ the caller\n(likely so the caller can re-derive sub-table offsets without redoing the math).\nTouches global\
  \ table off_80AED74 and its sub-tables off_80AED80 / off_80AEE0C.\nCaller is expected to pass a valid enemy index;\
  \ no bounds checks are performed.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
