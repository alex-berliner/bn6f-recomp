name: DecompressTextArchiveForCutscene
address: '0x08037AD0'
kind: function
status: confirmed
summary: Returns a TextScriptArchive* for a cutscene text reference, LZ77-decompressing it into the shared buffer
  if the pointer's top bit marks it as compressed.
interface: TextScriptArchive* text_resolveCutsceneArchivePtr(CompText* archive /* r0; bit31 set = LZ77-compressed
  */)
details: 'Cutscene scripts reference text archives as a signed value in r0. If r0 >= 0 the

  value is already a plain pointer and is returned unchanged. If r0 is negative, bit 31

  is a "compressed" tag: it is stripped via lsl #1 / lsr #1, the resulting address is

  treated as LZ77-compressed data and expanded with SWI_LZ77UnCompReadNormalWrite8bit

  into the global decompression buffer at eDecompressionBuf2034A00 (0x02034A00).

  The return value is then buffer + 4, i.e. just past the 4-byte LZ77 header, pointing

  at the script data proper. r1-r3 are treated as outputs because the SWI call clobbers

  them; the outgoing flags come from the final Thumb ADD (buffer+4) and the earlier CMP.

  Quirk: callers that keep the result around must copy it out quickly, since all

  compressed archives in a scene share the single 0x02034A00 buffer.

  '
