name: npc_inChatbox_curAction_init_809EB20
address: '0x0809EB20'
kind: function
status: confirmed
summary: 'Initializes the NPC''s "in chatbox" interaction state: optionally turns the NPC sprite to face the player,
  picks and runs the appropriate text script (NPC-owned / in-memory "mystery" / map-loaded, with an HP-memory navi
  check), locks movement, and hands off to the wait-close state.'
interface: "void npc_inChatbox_curAction_init_809EB20(\n    u32 npc_ptr /* r5 */,\n    u32 toolkit_ptr /* r10 */,\n\
  \    u32 r3 /* script type from previous state, fed into HP-mem check */);\n// outputs: r5, NZCV (all from tail\
  \ call to npc_inChatbox_curAction_waitClose_809EBBC)\n"
details: "- Reads the NPC's UnkFlags_60 (oOverworldNPCObject_UnkFlags_60) to decide behavior.\n- If OW_NPC_UNK_FLAGS_60_FACE_PLAYER_WHEN_INTERACTED\
  \ is clear, computes dy/dx between the overworld player object (read via oToolkit_GameStatePtr -> oGameState_OverworldPlayerObjectPtr)\
  \ and the NPC, calls calcAngle_800117C, then sets a 4-direction sprite animation index = (((angle+0x20) & 0xC0)>>6)*2\
  \ + 1 (values 1/3/5/7) via sprite_setAnimation, followed by sprite_loadAnimationData. The face-player block also\
  \ resets r3 (presumably for the HP-mem check below).\n- Chatbox script dispatch on UnkFlags_60:\n  * If CHATBOX_FLAG_0x400\
  \ is clear -> run map-loaded script: chatbox_runScript_202da04 with NPC's TextScriptIndex byte.\n  * If 0x400\
  \ set and 0x800 clear -> run normal NPC script: chatbox_runScript with NPC's TextScriptPtr archive and TextScriptIndex\
  \ byte.\n  * If 0x400 and 0x800 set (\"mystery data\" path): copies oOverworldNPCObject_Chatbox_90 into oChatbox_Unk_4C,\
  \ calls sub_809FC96 (passing chatbox_ptr in r7 and the data in r0), stores the returned r0/r1 into chatbox+0x54/+0x58,\
  \ and the returned r2 (low byte) into NPC's TextScriptIndex. The returned r3 then participates in the HP-memory\
  \ check. Comment notes the fall-through into the HP-memory test from the 0x800-clear branch is suspect because\
  \ sprite_loadAnimationData's r3 clobber is the only writer visible.\n- HP-memory special case (looks like an HP\
  \ chip pickup): if r3==8 and r0==0x70 and GetCurPETNavi() returns non-zero, runs the \"navi can't use this\" script\
  \ via chatbox_runScript with script index 0x78 instead of the normal index.\n- Writes 4 to oOverworldNPCObject_MovementFlag_0a\
  \ (movement locked while talking).\n- Tail-calls npc_inChatbox_curAction_waitClose_809EBBC; its r0/r1/r2/r3/r7\
  \ and flag outputs are the function's outputs.\n"
