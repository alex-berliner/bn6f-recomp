name: battle_pickRandomPanelAndTarget
address: '0x080C758E'
kind: function
status: probable
summary: Battle-object step that, when its RelatedObject1's flag lacks 0xA000, runs a fixed (mask,forbid)
  pair through sub_80C7632/sub_80C76B8; otherwise selects a panel (filtered by an alliance-indexed mask
  pair) via object_getPanelsExceptCurrentFiltered and a random pick, then invokes sub_80C761C with the
  panel coordinates.
interface: (r5 = battle object ptr, nonstandard arg register) -> r0 = 1 if a panel was picked and action
  taken, else 0; r0-r3, flags clobbered
details: Loads the object's oBattleObject_RelatedObject1Ptr and reads its object flag; if flag & 0xA000
  is clear it instead runs the fixed pair (0x10, 0xF880080) through sub_80C7632 and, on success, sub_80C76B8,
  returning 0/1 accordingly. Otherwise it uses the object's Alliance field (<<3) to index a two-entry
  table at 0x80C760C of {requiredMask, forbiddenMask} pairs (entry0 {0x30,0x0F880080}, entry1 {0x10,0x0F8800A0})
  and calls object_getPanelsExceptCurrentFiltered to fill a stack list (sp+8) with matching panels. It
  draws a random number with GetPositiveSignedRNG, takes the modulo of the panel count via SWI 6 (Div),
  reads the selected panel byte, splits it into high nibble and low 3 bits (x and y), and calls sub_80C761C(x,
  y, 0) — presumably to place/move the object on that panel. Returns 0 if no panel matched.
