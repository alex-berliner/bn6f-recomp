name: battle_spawnEnemyAndDestroy
address: '0x080BE0FA'
kind: function
status: probable
summary: Battle-object phase that waits ~10 frames, spawns an enemy actor from the object's NameID, then
  destroys itself.
interface: (r5 = battle object) -> sets object state to CUR_STATE_DESTROY; r0 clobbered
details: On first entry (PhaseInitialized clear) it loads the object timer with 10 and sets PhaseInitialized=4,
  so it acts as a one-frame-delay/counter setup. Each frame it decrements oBattleObject_Timer and returns
  until it hits 0. When the timer expires it calls unpackVerActorTyAndAIIdx_800F29C with the object's
  oBattleObject_NameID to get {version, actor type, AI index}, then calls sub_8011044 with those values
  plus r2=1, evidently spawning the enemy actor. It then clears bit 1 of oObjectHeader_Flags and writes
  CUR_STATE_DESTROY into the combined state/phase field, ending the object. This is the phase body of
  a one-shot enemy-spawner object in the battle engine.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oBattleObject_PhaseInitialized with timer=0xa, PhaseInitialized=4 is standard first-run
    init (sub_80BE0FA lines 2-8); timer decrement with 'bgt locret' gates the whole spawn block until
    the 10-frame delay elapses; ldrh r0,[r5,#oBattleObject_NameID]; bl unpackVerActorTyAndAIIdx_800F29C
    feeds spawn parameters from the object's ID; bl sub_8011044 with r2=1 right after unpacking is the
    spawn call; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    marks the object for destruction after spawning
  refs:
