name: battle_objectTimerWaitStep
address: '0x080C9DE0'
kind: function
status: probable
summary: 'Per-frame handler for a battle object''s timed wait action: counts the object timer down, fires
  a one-time flag/sound/collision-clear event at 30 frames, then advances to the next scripted action.'
interface: (r0 = unused dummy arg 1 passed to callees; r5 = battle object header pointer, engine convention)
  -> r0 = clobbered; updates oBattleObject_Timer, Flags, CurAnim, Timer2, CurAction, CurPhaseAndPhaseInitialized
details: 'Runs with the current object in r5. While oBattleObject_Timer > 1 it just decrements and returns.
  On the frame where the timer equals 0x1E it sets bit 1 of oObjectHeader_Flags (likely hiding/disabling
  the object), resets CurAnim to 0 with CurAnimCopy = 0xFF (force animation reload), calls object_clearCollisionRegion(1)
  to drop it out of its collision region, and plays sound effect 0x44 (0x45 - 1). When the countdown reaches
  0 it moves to the next state: CurAnim = 1, Timer2 = 3, CurAction = 4, and phase fields cleared, so it
  is one case of a larger object action/state machine.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r5,#oBattleObject_Timer]; cmp r0,#0x1e — one-shot event keyed to timer hitting 30
    frames; strb r0,[r5,#oObjectHeader_Flags] after orr r0,#2 — sets a per-object flag once; bl object_clearCollisionRegion
    with r0=1 — removes the object from collision; bl PlaySoundEffect with r0 = 0x45-1 = 0x44 — plays
    a fixed sound effect; trailing block: sub r0,#1 / bgt, then sets CurAction=4 and phase=0 — timer countdown
    advancing the state machine'
  refs:
  - bn6f/asm/asm31.s:39150
  - 0x080005CC PlaySoundEffect
  - 0x0801A074 object_clearCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080C9DE0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-003606'
open_questions:
- Which battle object uses this step (no callers known), so the meaning of flag bit 1 and of the 30-frame
  event (appearance, disappearance, explosion?) is unconfirmed
- What CurAction = 4 means in the owning object's action table
- Initial Timer value set by the spawner, needed to know total wait length
