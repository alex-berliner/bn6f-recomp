name: object_updateWithExtras
address: '0x080C004C'
kind: function
status: probable
summary: 'Per-frame update for a battle object: runs its condition gate and main logic, then ticks its
  ExtraVars and advances its sprite.'
interface: (r5 = battle object pointer) -> r0 = whether the sprite was advanced; no meaningful flags
details: This is a small update routine for a battle object held in r5. It first calls sub_80C0116 as
  a gate; if it returns zero the function returns without doing anything. Otherwise it runs the object's
  main logic via sub_80C00CE, then loads oBattleObject_ExtraVars from the object and, if non-null, calls
  sub_80C0144 to process that extra-vars structure. Finally it calls sprite_updateRelatedObjectIfActive
  to advance the object's sprite this frame. This fits the shape of an object's step handler dispatched
  from battle object update sweeps.
