name: battle_beastSpRefreshAIDataFromBattleObject_8087184
address: '0x08087184'
kind: function
previous_names:
- sub_8087184
status: probable
summary: Refreshes the Beast/SP (Beast-form Navi) AI's per-state attack vars from a copy of the actor's
  BattleObject position/velocity fields.
interface: (r5 = AIData*, r10 = toolkit via r5) -> side effects only ; copies [r5+0x70..0x7c] -> [r5+0x7c..0x88],
  copies overworld player X/Y/Z into [r5+0x10..0x18]
details: "- Pushes {r4-r7,lr}; sets r3=0x70 (source base on the AIData struct) and r4=0x7c (destination\
  \ base).\n  - Runs a 9-iteration unrolled copy loop (`r6=0..9`, `r7=9`). Each iteration loads three\
  \ u32 words\n    from [r5, r3] (r3 advancing by 4 each load) and stores them to [r5, r4] (r4 likewise),\
  \ with r3\n    and r4 each stepping +0xC per iter and a `sub r3,#0x14` / `sub r4,#0x14` to reset back\
  \ to the\n    0x70/0x7c base for the next triplet. This is a 3-words-at-a-time copy.\n  - Source range\
  \ [0x70..0x9C) of AIData (Unk_70, Unk_74, plus AIState block at 0x80-0x9F) is copied\n    to [0x7C..0xA8)\
  \ — i.e. it is shifted down 0xC, landing in the Unk_7c/AIState/AIAttackVars area.\n  - After the loop,\
  \ calls ReadOWPlayerObjectCoords which returns the OW player X/Y/Z in r0/r1/r2.\n    Those are stored\
  \ at [r5+0x10..0x18]: r0->+0x10, r1->+0x14, r2->+0x18. The struct comment for\n    AIData marks +0x10\
  \ as `Unk_10` and +0x11 as `BeastOutAPwrAtk`, so the player's full X/Y/Z\n    (16.16 fixed point) replaces\
  \ those three u32s in the AIData for this Beast/SP enemy.\n  - r5 is preserved (callee-saved) and used\
  \ as both the source and destination pointer throughout\n    — this is a self-copy within a single AIData\
  \ struct, not a copy between two structs.\n  - Tail is `pop {r4-r7,pc}`, so r2/r5 are the only \"out\"\
  \ values per the contract (r2 is the\n    last word written from ReadOWPlayerObjectCoords and happens\
  \ to survive to exit; the routine\n    itself returns nothing of substance to its caller).\n  - No side\
  \ effects on EWRAM other than writing the AIData fields noted above. Joypad/AI timers\n    are not touched;\
  \ this is a one-shot data refresh called from the Beast/SP AI tick.\n"
