open_questions:
- 'Exact meaning of the [0x70..0x7c) -> [0x7c..0x88) copy: it looks like a snapshot of the'
- AIData "AIState / AttackVars" region (offsets 0x80-0x9F per the struct) being copied into
- the Unk_78/Unk_7c area. Determining whether it is a "previous-state" buffer, a lag/hysteresis
- snapshot, or simply a layout-specific padding fill would require looking at how sub_8086EA8
- uses the destination fields after the call.
- The per-iteration pointer arithmetic (net effect on r3/r4) is unusual; the loop may actually
- be an unrolled 9x3-u32 copy from a different base. Verifying the exact stride against the
- AIData struct layout would settle it.
