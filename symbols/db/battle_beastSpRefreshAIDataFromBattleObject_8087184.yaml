  date: '2026-10-14'
  detail: '- `mov r3, #0x70` / `mov r4, #0x7c` set up the copy bases at AIData+0x70 (source) and AIData+0x7c
    (destination) per the AIData.inc struct (Unk_70/0x74 sit at 0x70/0x74, AIState at 0x80). - The loop
    counter `mov r7, #9` with three u32 loads/stores per iteration gives 9*12 = 108 = 0x6C bytes copied,
    i.e. [0x70..0xDC). The sub-back-#0x14 pattern (`+0xC` then `-0x14` net `-8`) keeps the window sliding
    by +0x4 between iterations? Re-reading: r3 is advanced by 4 three times (=+0xC) and then sub #0x14
    (=-0x14) yields a net -0x8 per iter, which would walk *backwards*. More likely the intent is per-iter
    `+0xC` (three 4-byte loads) minus `+0x14` (which equals -8) only because the dest also moves by 0xC
    then -0x14; the actual byte movement is +4 per iteration on each pointer (3 reads into a 4-iter step).
    See below for the correction. - `bl ReadOWPlayerObjectCoords` is the only direct call; it returns
    the OW player X/Y/Z in'
