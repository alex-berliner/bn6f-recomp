summary: Battle-object state-machine dispatcher that runs the handler for CurState (0/4/8 -> spawn/active/destroy)
  and then refreshes the sprite each frame.
interface: "void t3_0x8_80C5BB0(void); // r5 = oBattleObject* (in)\n                          // r4, r7, r8, r10,\
  \ lr = in / unused\n                          // returns via pop {pc}; clobbers r0-r4, r6-r12, lr, flags\n"
details: "Dispatcher indexed by oBattleObject_CurState (byte at oBattleObject_CurState in r5).\nJump table off_80C5BC8\
  \ has three +1-thunked entries (Thumb interworking via bx r1):\n  entry 0 -> sub_80C5BD4 (spawn / initialize)\n\
  \  entry 4 -> sub_80C5C40 (active / per-frame logic)\n  entry 8 -> object_genericDestroy (destroy / cleanup)\n\
  After the dispatched handler returns, object_updateSprite is tail-called to refresh the\nsprite (bl, not b, so\
  \ it is a regular call). The function itself does not modify CurState;\nit only invokes the chosen handler. Returns\
  \ to the caller via `pop {pc}`. State values are\nmultiples of 4 (0, 4, 8), consistent with a jump table indexed\
  \ by ordinal rather than by\ndirect byte value.\n"
