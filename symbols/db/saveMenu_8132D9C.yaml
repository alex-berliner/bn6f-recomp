name: saveMenu_8132D9C
address: '0x08132D9C'
kind: function
status: confirmed
summary: 'Renders the save-menu UI: tile-name headers, three save-file name rows, an info line, and footer text
  into VRAM tilemap 0x6004000–0x6005400.'
interface: 'void saveMenu_8132D9C(struct SaveMenuCtx *r10 /* save-menu state, base saved by caller */);

  // input: r10 = save-menu context pointer (fields +0x34 = slot data, +0x38 = status-block pointer)

  // output: clobbers nz,c,v,r0,r1,r2,r3,r10,r11,r12,lr; preserves r4,r5,r6,r7,r8,r9

  '
details: "Top-level driver that paints every text tile of the save menu in one pass. Calls:\n  - renderTextGfx_8045F8C\
  \ eleven times (text index 0–8 from eTextScript201BF00),\n    writing into destination buffers 0x2017A00–0x201A200\
  \ and VRAM tilemap blocks\n    at 0x6004000, 0x6004200, 0x6004400, 0x6004600, 0x6004A00, 0x6004C00, 0x6004E00,\n\
  \    0x6005000, 0x6005200, 0x6005400. Font comes from dword_86B7AE0.\n  - sub_8132FB8 three times with values\
  \ 0x0C, 0x0E, 0x10 paired with\n    menu_ctx->+0x34 (per-slot state) — refreshes the three save-slot name rows.\n\
  \  - storeTableEntryIntoUnk200a220Field8_8132FC4(0x14, menu_ctx->+0x34) —\n    records the current slot's table\
  \ entry.\n  - sub_803D06C → result written to menu_ctx->+0x38->+8 (save-state query stored\n    into the status\
  \ block).\nLayout: 4 column headers (index 0–3, 8×1), 3 slot name rows (index 7 with prior\nslot_update, 3×1),\
  \ a table-entry snapshot (0x14), an info line (index 8, 7×1),\nthen two footer lines (indices 6 and 5, 7×1 and\
  \ 5×1). Render order: top-to-bottom,\nleft-to-right.\nQuirks: addressed every 0x200 bytes in tile memory (consistent\
  \ with BG tilemap\nstride 0x800 tiles × 2 bytes). R4–R7 are saved/restored because renderTextGfx_8045F8C\ntakes\
  \ them as parameters (width, height, font, flag) per call.\n"
