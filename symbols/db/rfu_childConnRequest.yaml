name: rfu_childConnRequest
address: '0x08144FD0'
kind: function
status: probable
summary: 'Child-side wireless connection request: validates the RFU state, finds the chosen parent slot
  in the scan list, and arms the connection request state or reports failure via the 0xF3 callback.'
interface: (r0 = target slot/pid from the scan list, r1 = value stored to eStruct200FE00+0x1A) -> r0 =
  0 on success, else failure reason 1/2/3; on failure fires the +0x40 callback with code 0xF3 and clears
  eStruct200FE00+0x14/+0x16
details: Reads the RFU state byte at eStruct200FE00+4; if a connection is already active or being set
  up (state != 0 and not 9..11) it sets +0x14=1 and fires the callback (0xF3,1). It then calls rfu_getMasterSlave
  and aborts with reason 2 if the device is master. It scans the list behind dword_2010CC0 (count at +8,
  0x20-byte entries, entry id halfword at +0x14) for r0; if not found (or list empty) it reports reason
  3. On success it picks the transition 0xC/0xD (from state 0 or 9) or 0xB/0xC (otherwise), writes the
  new state to +4, sub-state to +5, stores r0 at +0x1E and r1 at +0x1A, forces +7 to 7 if nonzero, and
  returns 0. All failure paths funnel through rfu_fireConnCallbackAndClearState, which also resets the
  two halfwords at +0x14/+0x16.
