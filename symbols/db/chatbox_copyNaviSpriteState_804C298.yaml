summary: Copies OW navi sprite state (animation/palette/transform/coord shader) into unk_2000AC0 for chatbox
  rendering
interface: '(r5 = OWPlayerObject*, r10 = Toolkit*) -> r2 = RenderInfo/unk_2009740 derived pointer ; side
  effects: writes 14 bytes to unk_2000AC0 + 0x0F..0x1D'
details: "Reads scattered fields from the OW player object pointed to by r5 (offsets 0x10, 0x11,\n  0x13,\
  \ 0x15, 0x17, 0x18) and stores them at fixed offsets inside a global EWRAM struct at\n  unk_2000AC0\
  \ (offsets 0x0F, 0x11, 0x13, 0x15, 0x16, 0x17). The source offsets correspond\n  to the AnimationSelect/PaletteIndex\
  \ area of OverworldPlayerObject / OverworldNPCObject.\n  Then loads RenderInfoPtr via Toolkit->oToolkit_RenderInfoPtr\
  \ (r10->0x8) and copies two u16\n  fields at +0x14 and +0x16 (mosaic / OBJ-affine-related) into unk_2000AC0\
  \ +0x1A, +0x1C.\n  Finally loads Toolkit->oToolkit_Unk2009740_Ptr (r10->0x20) and copies bytes +2, +3\
  \ into\n  unk_2000AC0 +0x18, +0x19 (palette/color filter bytes).\n  Called from chatbox_stepIfGatesOpen_804C11C\
  \ after a setup helper, so the per-frame \"render\n  the PET navi next to the chatbox\" data refresh\
  \ is its role.\ndetails_quirk: The destination struct (unk_2000AC0) is not defined in the provided headers;\n\
  \  it's the chatbox-adjacent navi-sprite state buffer.\n"
