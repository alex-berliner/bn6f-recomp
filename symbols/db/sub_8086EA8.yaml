open_questions:
- The actual body is missing (no asm extracted), so the exact role of r2 in/out and the meaning of r3/r5/r7 at exit
  can only be guessed from the contract.
- Which story event flag is queried (the immediate operand to TestEventFlagFromImmediate) is unknown; a constant
  scan of the disassembly would settle it.
- The mapping from r5 / sub-state value to which of sub_8086FD8 / 808711C / 8087184 / 80871F4 runs is unknown; tracing
  r5 in the missing body or a coverage diff of the four sub-handlers would settle it.
- Whether the "sp" in "beastsp" refers to "special" (cross mega / SP) vs. "spawn" cannot be decided from the captures
  alone; the AIData field BeastOutAPwrAtk + the r3=0x02001d44 pointer argue for SP/Beast, but assembly would confirm.
