name: sub_8086EA8
address: '0x08086EA8'
kind: function
previous_names: []
status: hypothesis
summary: Battle beast-out / cross-mega handler that checks a story event flag and dispatches into per-state sub-handlers
  for the beast transformation.
interface: '(r2 = event flag index/handle, r10 = Toolkit ptr) -> r2/r3/r5/r7 (state result / out params) ; side
  effects: updates battle/AIData state via the sub-handlers it calls, clobbers many caller-saved regs'
details: "- No assembly was available for this function (the lifter reports \"sub_8086EA8 not found in bn6f/asm\"\
  ), so the proposal is driven entirely by the caller/callee graph and capture metadata.\n  - It is called only\
  \ from a site at lr=0x08035e88, invoked with r0=0, r1=2, r2=1, r3=0x02001d44 across 40 recorded snapshots (snap_beastsp_0100000_*)\
  \ - the snapshot prefix \"beastsp\" and the input shape (battle index 1, an EWRAM pointer 0x02001d44 that lies\
  \ in the battle state area, no extra params) strongly suggest this is the per-frame beast-mode / cross-mega update\
  \ hook in the battle AI subsystem.\n  - Callee graph lines up with a beast-state dispatcher: TestEventFlagFromImmediate\
  \ (story-progress gate, e.g. \"beast out unlocked\"), sub_8086FD8 (sub-handler 1, takes r2/r5/r10), sub_808711C\
  \ (sub-handler 2), sub_8087140 (returns a beast variant id in r0), sub_8087184 (sub-handler 3, takes r5), and\
  \ sub_80871F4 (leaf sub-handler 4, takes r5, returns r2/r3/r4) - this is the classic \"branch on r5 state, then\
  \ run a phase handler\" shape used elsewhere in battle AI.\n  - Contract reports in={r2,r10,lr}, out={r2,r3,r5,r7}\
  \ with many may_write regs, so it is a stateful void-ish handler that mutates a battle-actor state object (AIData\
  \ via the toolkit at r10) and reports back the next state/code in r2/r3.\n  - The function does not return a usable\
  \ value in r0 (every capture exits with r0=0, ZC flags) so callers use r2/r3/r5 as the actual out-of-band result;\
  \ the _ADDRESS suffix is kept because the exact beast-out / cross-mega semantics are inferred from the snapshot\
  \ name and callee set rather than from the body.\n"
