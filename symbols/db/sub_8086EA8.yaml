  \ form a small state/action table starting at 0x8086FD8, with sub_80871F4 handling a \"done\"/result branch.\n\
  \  - The capture set is from \"beastsp\" (Beast-SP / Beast Out) battle snapshots, and BeastOut-related fields\
  \ exist in AIData (`BeastOutAPwrAtk` at +0x11), so this likely runs once per actor per AI tick during a Beast-Out\
  \ battle to drive PowerAttack behaviour.\n  - r3/r5/r7 being live outputs but r0=0 on exit suggests the function\
  \ either does not change r0 (r0 was already 0 in all calls) or explicitly clears it; the captured inputs (lr=0x08035e88)\
  \ point back at a battle-tick caller.\n  - The struct used by the callees appears to be AIData (size 0x100) accessed\
  \ through the actor's BattleObject.\n"
