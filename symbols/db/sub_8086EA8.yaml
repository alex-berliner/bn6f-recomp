name: sub_8086EA8
address: '0x08086EA8'
kind: function
previous_names: []
status: hypothesis
summary: Per-frame Beast-Out AI dispatcher for a battle object (selects one of several beast-action paths based
  on event flags) — void
interface: (r2 = beast-mode-related context/param, r10 = Toolkit) -> r2,r3,r5,r7 ; side effects
details: "Body is missing from the disassembly, so the function's contents cannot be inspected\n  directly. The\
  \ contract marks only r2/r10/lr as inputs and only r2/r3/r5/r7 as outputs\n  (r3/r5/r7 are pure scratch; r2 is\
  \ passed back), so nothing is returned to callers in a\n  traditional sense — callers re-use r2. The callee list\
  \ is dominated by AI helpers:\n  TestEventFlagFromImmediate (reads a story-progress flag), sub_8086FD8 (in r2/r5),\n\
  \  sub_808711C (in r5), sub_8087140 (out r0), sub_8087184 (in r5, out r2/r5), and sub_80871F4\n  (in r5, out r2/r3/r4).\
  \ Several callees consume r5 and pass back r2, consistent with a\n  switch-style dispatch over beast-action variants\
  \ that each consume an AIData / action\n  blob. The captured calls are all `snap_beastsp_*` traces (entry r0=0,\
  \ r1=2, r2=1,\n  sp=03007dac, lr=08035e88) and exit with r0=0 and Z flag set, confirming the void-like\n  contract\
  \ and matching a per-frame \"tick\" rather than a query. Naming uses the `battleObject_`\n  prefix because r10\
  \ (Toolkit) is the typical battle-object entry convention and the callees\n  read/write AIData-shaped state.\n"
