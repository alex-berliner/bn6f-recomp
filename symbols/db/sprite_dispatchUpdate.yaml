- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#8]; ldr r0,[r0,r1]; bx r0 — indexed handler dispatch off a 3-entry table (off_811E7E8);
    Middle table entry is sprite_updateAtCenter, tying dispatch to sprite update behavior; r6 is preloaded
    with eStruct2001010 before the jump, so handlers receive that context; No callers known; 18-instruction
