name: sprite_dispatchUpdate
address: '0x0811E7D4'
kind: function
status: probable
summary: Dispatches an entity's per-mode update routine, picking one of three handlers from a jump table
  using the entity's mode byte.
interface: (r5 = entity struct, handler table indexed by [r5,#8]; r6 set = &eStruct2001010) -> tail-jumps
  to handler; r5, r6 passed through
details: 'Loads the eStruct2001010 pointer into r6, reads a byte at [r5,#8] as an index, fetches a Thumb
  handler pointer from the table off_811E7E8, and tail-calls it with r5 and r6 still live. The table has
  three entries: sub_811E7F8, sprite_updateAtCenter, and sub_811E850, so [r5,#8] is likely a sprite/update
  mode or state selector for an entity whose context block is eStruct2001010. The function is a pure trampoline:
  no flags set, no stack frame beyond lr.'
