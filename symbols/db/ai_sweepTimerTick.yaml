name: ai_sweepTimerTick
address: '0x08113910'
kind: function
status: probable
summary: 'Per-frame tick of an enemy AI attack: counts down a step timer and, on expiry, resets the animation,
  clears a status flag, and sets hit/attack elements.'
interface: (r7 = oAIAttackVars of active attack, r5 = battle object) -> void; decrements oAIAttackVars_StepTimer,
  runs body when it reaches 0
details: Decrements oAIAttackVars_StepTimer and returns immediately while it is nonzero, so this is one
  entry of an AI attack's per-frame step handler table. When the timer hits 0 it sets oBattleObject_CurAnim
  to 0, calls sub_80C00C2 on the object's ExtraVars+8 field with argument 6, then re-arms StepTimer to
  1 so the body re-fires every frame afterwards. It clears bit 0x40 of the object's ObjectFlags1 via object_clearFlag
  (likely an attack-active or invulnerable-style flag used while the attack runs). Finally it writes HitElement
  = 0x24 and AttackElement = 0 into the AI attack vars, configuring the damage/hit properties for the
  ongoing attack. The recorded 'battlesweep' route suggests this belongs to a sweeping-style enemy attack
  whose tail end keeps re-triggering.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh/strh on oAIAttackVars_StepTimer with 'bne locret' is the standard step-timer gate of AI
    attack handlers; strb r0 (0), [r5,#oBattleObject_CurAnim] resets the object's current animation on
    expiry; mov r0,#1; strh [StepTimer] re-arms the timer so the body runs every subsequent frame; bl
    object_clearFlag with r0=0x40 clears a bit in ObjectFlags1 via the known collision-data helper; writes
    of 0x24 to oAIAttackVars_HitElement and 0 to oAIAttackVars_AttackElement set the attack's element
    properties
  refs:
  - bn6f/asm/asm32.s:11335
  - 0x0801A15C object_clearFlag
  - 0x080C00C2 sub_80C00C2
