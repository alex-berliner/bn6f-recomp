name: MapScriptCmd_end
address: '0x08035920'
kind: function
status: confirmed
summary: Map script "end" command handler; signals script termination by returning 0.
interface: Next MapScriptCmd_end(void); returns r0 = 0 (flags N/Z set from the result)
details: 'One of the map script interpreter''s command handlers. Its only action is to set r0 = 0 and return; the
  map script executor reads this zero return value as the "script finished" signal and stops running the current
  script rather than dispatching the next command. No state is touched, no fields written, and no registers besides
  r0 are modified. The NZ flags are set as a side-effect of the mov, and callers may branch on them, though the
  primary contract is the zero in r0. Being the terminal command of a script, it is the conventional last entry
  in map script command tables.

  '
