name: battle_clearPanelsOfAlliance
address: '0x080CE0A4'
kind: function
status: probable
summary: On object destruction, finds all battle panels marked with the object's alliance-specific panel
  flag and resets each of them.
interface: (r0 = oBattleObject*, r5 implicit? reads [r5+oBattleObject_Alliance]) -> r0 destroyed; uses
  object_getPanelsFiltered(alliance*8, filter entry, r2/r3 = mask words, sp = output buffer) -> count,
  then sub_800ABC6(x, y) per panel; no return value used
details: 'Reads the object''s Alliance byte, scales it by 8 to index byte_80CE0DC, whose two 8-byte entries
  hold mask words 0x20 (alliance 0) and 0x40 (alliance 1). Calls object_getPanelsFiltered with that mask
  and a 0x28-byte stack buffer to collect matching panel indices, returning a count in r0. Iterates the
  buffer backwards: each byte encodes a panel position with column = byte>>4 and row = byte & 7 (lsl 0x1d/lsr
  0x1d keeps 3 bits). For each panel it calls sub_800ABC6(column, row), presumably restoring/clearing
  that panel''s state. Called only from battle_destroyObjectWithEffect, so this undoes panel changes (flags
  0x20/0x40 look like per-alliance modified-panel attributes) left behind by the destroyed object. The
  pre-call r0 = alliance*8 looks like a leftover rather than an argument.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Alliance]; lsl #3 selects one of two filter entries in byte_80CE0DC
    (0x20 vs 0x40 mask words); bl object_getPanelsFiltered with r7 = sp buffer, result r6 used as loop
    count; lsr r1,#4 / lsl 0x1d lsr 0x1d decode column/row nibbles from each returned index byte; bl sub_800ABC6
    per panel, then loops until all matched panels are processed; sole caller 0x080CE05E battle_destroyObjectWithEffect
    fits a teardown/cleanup role'
  refs:
  - bn6f/asm/asm31.s:48406
  - 0x080CE05E battle_destroyObjectWithEffect
  - 0x0800CEA0 object_getPanelsFiltered
