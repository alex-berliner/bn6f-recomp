name: CutsceneCmd_wait_screen_fade
address: '0x080377E4'
kind: function
status: confirmed
summary: Cutscene script command that blocks until an active screen fade finishes, reporting done/not-done and ticking
  the script pointer.
interface: 'void CutsceneCmd_wait_screen_fade(void)  /* in: r7=script ptr; out: r0=done flag, r7=script ptr; clobbers
  r0,r3,lr,c,v,n,z */ /* wait — r1 is also an output per the lifter contract */'
details: 'Polls IsScreenFadeActive(); while it returns nonzero (fade still running) the

  function advances the caller-supplied cutscene script pointer (r7 += 1) and

  returns r0 = 1 to keep the script engine looping. Once the fade finishes it

  leaves r7 untouched and returns r0 = 0 to mark the command complete. The Z flag

  is set from r0; the C/V flags come straight from IsScreenFadeActive (the second

  path is encoded as a synthetic ADDS just to thread those flags through the

  readable C — there is no real arithmetic on the "done" branch). Lives in the

  cutscene script-command dispatcher; r7 is the per-frame instruction pointer for

  the active cutscene, and the returned r0 is the standard "keep waiting" flag

  consumed by the script runner.

  '
