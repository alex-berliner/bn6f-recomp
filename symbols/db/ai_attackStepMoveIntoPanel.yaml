name: ai_attackStepMoveIntoPanel
address: '0x080F6052'
kind: function
status: probable
summary: 'AI attack-state step: slides the enemy into its target panel on the first call, then after 3
  frames marks the hit element as charged.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: 'State machine step keyed on oAIAttackVars_AttackElement in the r7 AI attack var block. If it
  is zero, this is the windup frame: writes element 4, sets the object''s CurAnim to 3, calls object_removePanelReserve
  for both PanelX/Y and FuturePanelX/Y, copies FuturePanel into Panel (committing the move), re-releases
  the reserve, recomputes pixel coordinates and collision panels, clears collision flag 0x40, sets the
  CURRENTLY_MOVING flag, and loads StepTimer with 3. Subsequent calls decrement StepTimer and, on expiry,
  write 0x30 to oAIAttackVars_HitElement, advancing the attack to its hit phase.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: reads/writes oAIAttackVars_AttackElement, StepTimer, HitElement via r7 offsets (first and last
    blocks); copies oBattleObject_FuturePanelX/Y into PanelX/Y then calls object_removePanelReserve twice;
    calls object_setCoordinatesFromPanels and object_updateCollisionPanels after the panel commit; sets
    CURRENTLY_MOVING flag via object_setFlag1(1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT); StepTimer countdown
    terminating in strh 0x30 -> HitElement
