open_questions:
- The exact role of Unk_08 in the player (offset 0x08 of OWPlayerObject) is not declared; the loaded
- 32-bit value from byte_809D89C may be a small per-action constant table. Settling it would need a
- full eStruct200ace0 layout cross-reference and the action jumptable consumers.
- The dispatch entry `sub_809D800+1` inside its own jumptable is unusual (recursive self-dispatch);
- a real disassembly of the action handlers should clarify whether that is reachable in practice.
