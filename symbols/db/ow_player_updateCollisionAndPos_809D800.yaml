  detail: '- r5 in/out contract plus usage of oOWPlayerObject_X/Y/Z/NextX/NextY/NextZ/AnimationSelect/Unk_0b/
    Unk_08/wallCollision_0c/InteractionLocked/LayerIndexOverride in the assembly is consistent with "operate
    on the overworld player object held in r5". - off_809D8AC -> eStruct200ace0; offsets 0x8/0xc/0x10
    are written/read using the oS200ace0_PlayerX/Y/Z symbol names, confirming the struct mirror. - The
    dispatch at 0x0809d828 uses off_809D8B0 with five entries (sub_809D470, sub_809D4DC, sub_809D61A,
    ow_player_processAction_809D75E, this function itself, sub_809D8F4), all of which are player action
    handlers, so the index is an action/state id of the player. - sub_809DF36 result is tested and only
    then byte_809D89C (animation/state table) is read into oOWPlayerObject_Unk_08, matching a "decide
    whether to update the per-action data" pattern. - sub_809E3A2 returns NZ for "use stored Z", and the
    EVENT_BE4/TestEventFlagFromImmediate guard makes the Z recompute via checkZCoordModifiers_8031612
    conditional on story progress.'
