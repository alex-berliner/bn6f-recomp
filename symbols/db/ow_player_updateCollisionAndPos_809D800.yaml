name: ow_player_updateCollisionAndPos_809D800
address: '0x0809D800'
kind: function
previous_names:
- sub_809D800
status: probable
summary: 'Per-frame update of the overworld player object: write back next-position into current XYZ,
  sync eStruct200ace0 mirror, choose animation/jumptable step, clamp into bbox, recompute Z, update layer
  and sprite priority.'
interface: '() -> void ; side effects: mutates OWPlayerObject in r5, eStruct200ace0, and calls into sprite/animation/collision
  routines'
details: "Function is called as part of the overworld player step (the captured calls all have lr=0x0809d376,\
  \ i.e. an\n  external caller that has already set up r5 = OWPlayerObject pointer). It first commits\
  \ the previously\n  computed NextX/NextY/NextZ (offsets 0x28/0x2c/0x30) into the live X/Y/Z (0x1c/0x20/0x24)\
  \ of the player\n  object. Then it mirrors those values into eStruct200ace0 at offsets 0x08/0x0c/0x10.\n\
  \  If eStruct200ace0+0x15 (fixOWPlayerAnim) is zero, it copies byte 0x02 of that struct\n  (owPlayerFixedAnimationSelect)\
  \ into AnimationSelect of the player; otherwise it dispatches through a\n  small jumptable off_809D8B0\
  \ (sub_809D470, sub_809D4DC, sub_809D61A, ow_player_processAction_809D75E,\n  self, sub_809D8F4) chosen\
  \ by Unk_0b. After that, sub_809DF36 decides whether to load a 32-bit value\n  from byte_809D89C indexed\
  \ by eStruct200ace0+0x01 into Unk_08 of the player. If the wallCollision_0c flag\n  is set, clampPlayerPosition_809E3D6\
  \ runs, then checkCollision_8030b6a is invoked with the 0x1c-base\n  collision chunk of the player.\
  \ The new X/Y/Z are written back into eStruct200ace0. If sub_809E3A2\n  returns Z=0 and the player is\
  \ InteractionLocked and event flag EVENT_BE4 is not set, Z is recomputed\n  via checkZCoordModifiers_8031612.\
  \ Finally, when LayerIndexOverride is zero, applyLayerEffectToOWObject_8035694\n  is called and the\
  \ sprite priority is updated via sprite_setPriority_8002E14.\n"
