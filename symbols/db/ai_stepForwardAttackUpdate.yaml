name: ai_stepForwardAttackUpdate
address: '0x08015040'
kind: function
status: probable
summary: 'Per-frame handler for an AI navi''s forward-charge/dash attack: on the first frame it flashes
  the sprite white, loads anim + sound + extra-vars spawn, updates alliance byte, and arms a custom-gauge
  panel with chip-class delta; subsequent frames decrement a step timer and, on expiry, reopen the turn,
  mark action used, set navi stats 0x0E, clear invuln, and store HitElement = 0xC.'
interface: (r5 = battle object actor, r7 = AI attack vars struct) -> r0 = void; sets oAIAttackVars_AttackElement
  = 4 when setup completes, HitElement = 0xC when the timer expires
details: On the first call (oAIAttackVars_AttackElement == 0) it reads NaviStats byte 0x2C for the actor's
  alliance, forces the sprite palette white, loads a sprite animation and flips/positions the object from
  its panels, sets StepTimer = 0xA, writes byte 0x2C (with actor info from battle_ai_getActorInfo), spawns
  an extra-vars object from dword 0x30E00, plays sound effect 0x100, and if byte 0x2C is between 1 and
  0x18 sets an object text id; it also flags a related object (Flags |= 0x14, CurAnim/Param3 = 0) and
  animates the custom gauge bar. It computes a forward X step via battleObject_computeAIStepForwardDeltaX(3)
  (negated, so it moves toward the enemy) and sets AttackElement = 4 so later calls skip setup. Subsequent
  calls just decrement StepTimer; when it reaches zero, it calls battle_beginTurnOpenProcess and battleObject_markUsedAction,
  sets NaviStats field 0x0E = 0x80, clears invulnerability time, and stores HitElement = 0xC.
