    (r0 = 0x100) and bl battle_spawnExtraVarsObject with dword_8015124 = 0x30E00; mov r0,#3; bl battleObject_computeAIStepForwardDeltaX_8018856;
    neg r1,r1 moves the actor toward the enemy; timer expiry branch calls battle_beginTurnOpenProcess_80144C0
