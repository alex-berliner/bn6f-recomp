open_questions:
- What writes oAIData_Unk_12 in the first place (i.e. which battle effect sets the poison period index)
  — no callee here does so. A poisoning routine elsewhere is the trigger.
- Why only the first table entry is 0 vs. the others; the 0 entry is used as a "no poison" sentinel.
