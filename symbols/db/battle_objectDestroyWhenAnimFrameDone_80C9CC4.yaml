name: battle_objectDestroyWhenAnimFrameDone_80C9CC4
address: '0x080C9CC4'
kind: function
status: confirmed
summary: Ends a battle object's death animation — once the current animation frame no longer carries the 0x80 flag,
  clears its collision region and moves it into the destroyed state.
interface: void battle_objectDestroyWhenAnimFrameDone(BattleObject* obj /* r5 */); clobbers r0-r3, lr; leaves NZ
  set (from TST or from writing CUR_STATE_DESTROY), C/V from last callee
details: 'Called with r5 pointing at a battle object. Calls sprite_getFrameParameters (which itself

  presumably reads r5/the object''s sprite state) and tests bit 0x80 of the returned frame

  parameters — the flag that marks a death/destruction animation frame still in progress.

  While that bit is set the function does nothing and simply returns, letting the animation

  keep playing. As soon as the bit is clear (animation finished), it calls

  object_clearCollisionRegion to drop the object''s hitbox and stores CUR_STATE_DESTROY (8)

  into the object''s combined CurState/ActionPhase/PhaseInitialized field at

  oBattleObject_CurStateActionPhaseAndPhaseInitialized, handing the object over to the

  battle-object state machine''s destroyed state for cleanup/removal. Quirks: r1 is left

  holding 0x80 (the TST operand) on both exit paths; on the destroy path NZ reflects the

  MOVSe''d state constant (nonzero), on the early-out path it reflects the tested bit.

  Typical use is as the per-frame "check if death anim is over" step for enemies/objects

  playing a vanish animation.

  '
