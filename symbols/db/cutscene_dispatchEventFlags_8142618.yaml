name: cutscene_dispatchEventFlags_8142618
address: '0x08142618'
kind: function
previous_names:
- sub_8142618
status: probable
summary: 'Overworld per-frame cutscene dispatcher: checks soul-weapon / beast / cross-progress event flags
  and fires the matching cutscene scripts, clearing them once handled.'
interface: (in r10 = *Toolkit, lr = return) -> no caller-visible result; side effects = sets/clears EVENT_742/743/746/747
  and may StartCutscene with one of three scripts
details: "Runs from the overworld main loop. First it bails out unless the player is allowed to auto-advance\n\
  \  forward (check_playerCanAdvanceForward_8034C36) and the current soul weapon is unlocked\n  (battle_getSoulWeaponBase_81427CE).\
  \ With that gate passed it tests EVENT_742 and EVENT_743 (a pair of\n  \"beast / cross-transform\" progress\
  \ flags) and reads the player AIData field at +0x11 (BeastOutAPwrAtk)\n  through GameStatePtr->CurBattleDataPtr\
  \ (r10->0x3c). If beast-out is active the matching flag is set and\n  StartCutscene fires byte_8089554;\
  \ otherwise the function clears both 742/743 and falls through.\n  Independently, EVENT_746 and EVENT_747\
  \ each trigger their own StartCutscene (byte_80893CC, dword_8089128)\n  if set, after which they are\
  \ cleared. The captured call site is the overworld script driver\n  (lr 0x08035e88, snap_beastsp_0180000),\
  \ repeatedly called per frame.\n"
