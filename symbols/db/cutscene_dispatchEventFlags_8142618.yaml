name: cutscene_dispatchEventFlags_8142618
address: '0x08142618'
kind: function
status: confirmed
summary: Starts one of several overworld cutscenes gated on event flags 742–747, using soul-weapon and advance-forward
  checks as prerequisites.
interface: void cutscene_dispatchEventFlags_8142618(u32 context_r10); /* modifies event flags and may call StartCutscene;
  no register outputs (r4–r7 restored, r0/r1/lr clobbered by subcalls) */
details: "Called during an overworld interaction with the NPC/player context in r10. Gate 1: check_playerCanAdvanceForward_8034C36\
  \ must succeed (not Z). Gate 2: battle_getSoulWeaponBase_81427CE returns a flag id passed to TestEventFlag; the\
  \ soul-weapon flag must be set. If both gates pass, the function enters a state machine on event flags in group\
  \ 7: - If EVENT_742 is already set: check EVENT_743. If 743 is clear, set it and return\n  (first-visit bookkeeping).\
  \ If 743 is also set, call sub_80357AE; on success start\n  the advance-forward cutscene script at byte_8089554,\
  \ then clear both 742 and 743.\n- If EVENT_742 is clear: read the byte at (r10+0x3C)+0x11 (a player/battle-state\n\
  \  sub-struct). If non-zero, set EVENT_742 for the next visit; skip clearing.\nIndependently of the 742/743 logic,\
  \ EVENT_746 and EVENT_747 are tested; if set, their respective cutscene scripts (byte_80893CC, dword_8089128)\
  \ are launched via StartCutscene(script, 0), and both flags are cleared unconditionally afterward. The three cutscene\
  \ script pointers live in a literal pool at the end of the function. The trailing .byte 0x82,0x4E,… is a call-table\
  \ entry (not code).\n"
