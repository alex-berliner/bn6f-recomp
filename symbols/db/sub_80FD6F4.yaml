summary: AI attack behaviour that snapshots a duration on first call and exits the attack state once it elapses.
interface: 'void aiAttackTimerState_80FD6F4(void);  // in: r5=battle object, r7=AI attack vars; preserves R1, clobbers
  R0/R2/R3/R6/R7/lr, NZCV'
details: 'Reads an "already-fired" flag at oAIAttackVars_Unk_01 (r7). On first call (flag==0),

  sets it to 4 and copies oAIAttackVars_Unk_18 into the countdown field

  oAIAttackVars_Unk_10. On later calls, decrements oAIAttackVars_Unk_10 once per

  invocation; when it goes non-positive, clears oBattleObject_CurAnim on the battle

  object (r5) and calls object_exitAttackState. R1 is not touched, so it flows through

  as the contract''s documented output.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
