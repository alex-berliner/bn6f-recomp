- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] / tst / bne: one-shot init guarded on element being
    unset; strb #4 -> oAIAttackVars_AttackElement and strb #7 -> oBattleObject_CurAnim: picks a fixed
    element and animation id; ldrh AttackDuration -> strh StepTimer then sub #1 / bgt: classic per-frame
    countdown pattern; bl object_exitAttackState when timer reaches 0: ends the attack state on completion'
