name: ai_attackCooldownTick
address: '0x080F8972'
kind: function
status: probable
summary: 'Per-frame AI attack upkeep: assigns the attack''s element and animation on entry, then counts
  down the attack timer and leaves the attack state when it expires'
interface: (r7 = AI attack vars struct, r5 = battle object) -> r0 clobbered; no return value, side effects
  on struct fields
details: On the first invocation (oAIAttackVars_AttackElement == 0) it stamps element 4 into oAIAttackVars_AttackElement,
  sets oBattleObject_CurAnim to 7, and copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer
  to start the countdown. On subsequent frames it decrements StepTimer and, once it hits zero, calls object_exitAttackState
  to leave the attack. It is a state-tick routine run every frame while the AI object is in this attack
  state. The element value 4 is a fixed element this attack belongs to, so this is likely one attack-specific
  handler rather than a generic one.
