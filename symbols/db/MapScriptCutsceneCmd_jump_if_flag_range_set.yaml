name: MapScriptCutsceneCmd_jump_if_flag_range_set
address: '0x08035992'
kind: function
status: confirmed
summary: In a map cutscene script, if every bit in an event-flag range is set, jump to an inline offset; otherwise
  skip past the 8-byte command.
interface: u32 MapScriptCutsceneCmd_jump_if_flag_range_set(void /* r7=script_pos in/out, r10=script base, lr=return
  */); // clobbers r0=1, r1,r3,r4=last read, r5,r6,r7=new pos; C/V from final adds, NZ from mov r0,#1
details: "Interpreter opcode stub for the \"jump if event-flag range set\" cutscene command. Reads three inline\
  \ operands from the script stream (currently pointed to by r7 with base in r10):\n  * byte at +0 (size/count of\
  \ the flag range) -- via ReadMapScriptByte with r6=1\n  * halfword at +1 (start event flag index) -- via ReadMapScriptHalfword\
  \ with r6=2; the previously read byte is kept live in r1 across this call\n  * word at +4 (relative jump target,\
  \ only consumed when the range is set) -- via ReadMapScriptWord with r6=4\nThen calls TestEventFlagRange(r0=halfword,\
  \ r1=byte, r2=byte) -- (a3, a2) in the disassembly's typedef, all three passed; the duplicated byte is exactly\
  \ how the original lays out the operands. The callee answers in flags (Z set => range NOT fully set).\nWhen the\
  \ range is fully set: r7 := inline word (r4 mirrors it as \"last value read\"); continue = r0=1.\nWhen the range\
  \ is not fully set: r7 += 8 (skips the byte + halfword + word + 1 byte of padding), r4 stays as the halfword just\
  \ read; continue = r0=1.\nr5 (flag range width) is preserved across the call. The routine always signals \"continue\"\
  \ (r0=1) to the script interpreter.\n"
