name: battle_objectSetAuxField8
address: '0x080C10E8'
kind: function
status: probable
summary: Null-safe one-shot helper that writes 8 into offset +8 of an object's auxiliary structure, invoked
  when the 0x40000000 collision flag fires.
interface: (r0 = pointer to auxiliary object struct, may be NULL) -> r0 = untouched; returns, no flags
  of interest
details: Tests r0 and returns immediately if NULL; otherwise stores the literal 8 at [r0+8] and returns.
  The caller (battle_objectUpdateFlagBit30Handler) calls it during phase 0 when collision flag bit 0x40000000
  is set, passing the object's ExtraVars+8 pointer, then clears that pointer, making this a one-shot action.
  The target structure is only reachable through ExtraVars+8, so it is an optional/allocated-on-demand
  sub-struct. Field +8 receiving 8 likely encodes a state, phase, or counter value, but its semantic meaning
  is not shown here. No other callees or flag interaction occur.
