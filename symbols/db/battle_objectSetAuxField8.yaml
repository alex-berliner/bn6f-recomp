  date: '2026-10-19'
  detail: 'asm: ''tst r0,r0 / beq'' + ''mov r1,#8 / str r1,[r0,#8]'' — pure null-checked store of constant
    8 at +8; caller battle_objectUpdateFlagBit30Handler: runs this one-shot on the object''s ExtraVars+8
    pointer when flag bit 0x40000000 is set, then clears the pointer; asm: ''mov pc, lr'' tail — no other
    side effects, r0 not modified'
