name: eOWPlayerObject_NextX
address: '0x02009F68'
kind: ram
previous_names: []
status: probable
summary: 'MegaMan''s overworld X at the start of the current move (eOWPlayerObject +0x28, s16.16): copied from X before
  each frame''s movement, put back into X when the move is cancelled; despite the name, his previous X, not a target.'
details: |
  Field NextX of overworld_player_object_struct (include/structs/OverworldPlayerObject.inc:32, loc 0x28; NextY and
  NextZ follow) in eOWPlayerObject = 0x02009F40. What the code does with it (bn6f/asm/ow_player.s):
    - owPlayer_update_809D348, MegaMan's per-frame state (state 1 of owPlayer_main), first copies X/Y/Z into
      NextX/Y/Z (273-278), then runs the movement handler, which adds the step to X/Y; the init state sub_809D270
      (231-236) and ow_player_updateCollisionAndPos_809D800 (911-916) do the same copy before they move him;
    - owPlayer_applyCountdownUpdate_809D5C4 (607-613) and owPlayer_ApplyKnockbackOrSnapToTarget_809D730 (781-787)
      copy NextX/Y/Z back into X/Y/Z on a frame where he does not move;
    - owPlayer_isMoving_809DFA0 (1921) reports a move when X/Y/Z differ from NextX/Y/Z;
    - owPlayer_copyCoordsToNextCoords..._809e188 (2288) and _809e1d8 (2356) save X into NextX before setting or
      offsetting X;
    - clampPlayerPosition_809E3D6 (2799) restores X from NextX when it clamps Y;
    - the collision sweep checkCollision_8030b6a -> owObject_lineDraw_8030CAC (asm03_0.s:23399) walks the tiles
      from (NextX, NextY) to (X, Y), reading the pixel halfwords oOWObjectCoords_NextX/NextY (Coords + 0xE/0x12).
  So it is the position the frame's move started from. vidsync's BN6F_SYMBOLS.md calls +0x28/+0x2C/+0x30 the
  "walk target" that "the game pulls him back towards", and its segments.py comment says "where he walks to";
  the code read here does not support that reading.
  vidsync (level R): try_relocate writes NextX = X (and NextY = Y) along with X/Y when it moves MegaMan; segment
  junctions restore it in the 0x30 bytes from +0x1C.
