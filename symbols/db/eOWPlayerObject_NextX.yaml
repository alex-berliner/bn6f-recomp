open_questions:
- 'Why a relocation needs NextX written at all: owPlayer_update_809D348 overwrites it with X at the start of every
  update, so a lone X write would not be pulled back by that copy. Something read before MegaMan''s next update
  (another object, the camera, the collision sweep in a state that skips the copy) may use the stale value; not
  tested (try_relocate always writes both).'
- 'suggested name: eOWPlayerObject_PrevX (the X the current move started from; "Next" reads as a target, which the
  code does not support). The struct field NextX (and oOWObjectCoords_NextX) would change with it.'
