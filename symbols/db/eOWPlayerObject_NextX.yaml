    grep -rn 'oOWPlayerObject_NextX\|oOWPlayerObject_NextY\|oOWObjectCoords_NextX\|oOWObjectCoords_NextY' bn6f/asm bn6f/maps
    sed -n '260,280p;605,614p;779,788p;1921,1940p' bn6f/asm/ow_player.s
    awk '/^clampPlayerPosition_809E3D6:/{f=1} f{print FNR": "$0} f&&/thumb_func_end/{exit}' bn6f/asm/ow_player.s
  result: '18 lines: ow_player.s 234/235, 276/277, 914/915, 2294/2296, 2363/2368 (stores: X copied in), 608/609,
    782/783 (loads put back into X/Y), 1925/1929 (owPlayer_isMoving compares), asm03_0.s:23402/23404 (the sweep''s
    start); clampPlayerPosition_809E3D6 loads +0x28 into +0x1C at 2835-2836 and 2844-2845'
- method: runtime
  date: '2026-10-17'
  detail: 'Written by the vidsync sync driver: try_relocate writes NextX at +0x28 of GameState.OverworldPlayerObjectPtr
    with the same value as X (and NextY = Y), and the game then goes on from the new place matching the video (the
    path must hold 150 frames past the loss); run run8j''s fixes wrote this field (build-vidsync/learned.md listed it
    as written without an entry). This shows that NextX = X is a consistent stationary state at a new place; no run
    wrote NextX alone or differently from X.'
  refs:
  - tools/vidsync/autosync.py:542
  - tools/vidsync/segments.py:150
  - docs/vidsync/BN6F_SYMBOLS.md
  reproduce: |
    grep -n '(0x1C, x), (0x20, y), (0x28, x), (0x2C, y)' tools/vidsync/autosync.py
    grep -n 'NextX/Y/Z\|po + 0x1C + k' tools/vidsync/segments.py
  result: 'autosync.py:542 and 546 (the same x at 0x1C and 0x28, y at 0x20 and 0x2C); segments.py:150-151'
