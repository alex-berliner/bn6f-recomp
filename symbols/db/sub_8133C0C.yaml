name: sub_8133C0C
address: '0x08133C0C'
kind: function
status: confirmed
summary: 'Handles START / B cancel input for a sub-menu screen: enters or exits the cancel state (0x0C), saving/restoring
  the prior state and playing the corresponding SFX.'
interface: void sub_8133C0C(u32 menu_ptr /* r5 in */); /* leaves r0 = 0, Z set, NZ clr */
details: "Operates on a menu state structure passed via r5 whose fields used here are:\n  +0x03  u8  current state\n\
  \  +0x0D  u8  saved-previous state\n  +0x34  u16 timer (cleared to 0 on entry)\n  +0x44  u8  lock flag (non-zero\
  \ = no-op)\nFlow:\n  - If JOYPAD_START is pressed, OR (current state == 0x0C and JOYPAD_B is pressed),\n    proceed;\
  \ otherwise return 0.\n  - If the lock byte at +0x44 is non-zero, return 0.\n  - If current state == 0x0C: copy\
  \ +0x0D back into +0x03 (restore previous state),\n    play SOUND_EXIT_SUBMENU.\n  - Otherwise: stash current\
  \ state into +0x0D, set state to 0x0C, clear the u16\n    timer at +0x34, play SOUND_MENU_SELECT.\nCalls out to\
  \ IsButtonPressed (in r0: button id, Z set when NOT pressed) and\nPlaySoundEffect (in r0: sound id). The trailing\
  \ `mov r0,#0; tst r0,r0` always\nyields Z so callers can branch on Z for \"did nothing\" vs. \"input handled\"\
  .\n"
