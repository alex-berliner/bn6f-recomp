name: object_breakPanel
address: '0x0800C9F8'
kind: function
status: confirmed
summary: Breaks the panel under the given object (turning a cracked panel into a hole), playing the panel-break
  sound, and returns 1 on success or 0 if there is no breakable panel there.
interface: int object_breakPanel(void *object /* r0 */); returns 1 if the panel was broken, 0 otherwise. Uses r0-r1
  on entry (object pointer passed through to object_getPanelDataOffset), clobbers r0-r3 and flags.
details: "Calls object_getPanelDataOffset(r0) to get the address of the panel data\nrecord for the tile the object\
  \ stands on. Returns 0 if there is no panel\ndata (r0 == 0). Reads the panel's 32-bit flags field (oPanelData_Flags)\n\
  and bails out with 0 if:\n  - flag 0x10 is not set (panel not yet in the cracked state, so it cannot\n    be broken),\
  \ or\n  - any bit of mask 0x0F880080 is set (unbreakable panel kinds such as\n    holes and holy panels).\nOtherwise\
  \ it breaks the panel: the old panel-state bits (mask 0x00003F5F)\nare cleared and 1 is added to the flags word,\
  \ then the byte fields at\noPanelData_Type (+2) and oPanelData_Animation (+6) are both set to 1\n(\"broken\" type/animation).\
  \ Finally plays sound effect 0x97 (panel break)\nvia PlaySoundEffect and returns 1.\nOnly c/v are observable on\
  \ return, and they are just whatever\nobject_getPanelDataOffset / PlaySoundEffect left behind.\nNote: the verified\
  \ C labels flag 0x10 \"already broken\", but since the\nfunction requires it to proceed, it more likely marks\
  \ a *cracked* panel;\nbreaking a panel in MMBN is the step after cracking it.\n"
