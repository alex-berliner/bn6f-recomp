name: sub_81204C4
address: '0x081204C4'
kind: function
status: confirmed
summary: Iterates a range of 32-byte chip slots, converting each occupied slot's chip type into an 8-byte output
  entry via sub_8120504, and zeroing entries for empty slots.
interface: void battle_processChipSlotArray(s32 startIdx /*r0*/, void* chipArrayBase /*r1*/, void* dest /*r2*/,
  void* extraParam /*r3*/, s32 count /*r5*/); /* writes 8*count bytes at dest; r0-r3,lr clobbered; r4-r7,preserved
  */
details: 'Base pointer is computed as r1 + r0*32 (32-byte chip-slot stride). For each of r5 iterations the slot
  pointer advances by 0x20 and the dest pointer by 8. The 16-bit field at slot+0x1C holds the chip selection; bits[15:7]
  (tested via lsr 7) are zero for an empty/invalid slot, in which case two u32 zeros are written to dest. When a
  chip is present the function calls getChip8021DA8(chipSel) and reads the type/category byte at offset +8 of the
  returned ChipData, then forwards (type, destEntry, extraParam) to sub_8120504 to encode the 8-byte output record.
  r5 (the count) is saved on the stack because it is a caller-supplied signed value used only as a loop bound. The
  function is a leaf-ish worker: it allocates no state of its own and purely transforms slot data into a type-code
  array.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
