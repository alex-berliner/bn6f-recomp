name: subsystem_launchMail
address: '0x08005EC0'
kind: function
status: confirmed
summary: Hands off the overworld player's position and facing to the game state, then requests the mail subsystem
  (0x34) and starts a screen fade.
interface: void subsystem_launchMail(int r0, void *r10); // returns 0 in r0; r10 is the toolkit pointer; clobbers
  r2 r3 r4 r5, NZCV, r0 r1, lr; preserves r4 r5
details: 'Mirrors X/Y/Z (offsets 0x1C/0x20/0x24) and the facing byte (offset 0x10)

  of oGameState_OverworldPlayerObjectPtr into the matching game-state fields

  (PlayerX, PlayerY, PlayerZ, FacingDirectionAfterWarp), then writes 0x34

  to oGameState_SubsystemIndex to ask the main loop to switch to the mail

  subsystem, and calls SetScreenFade(0xC, 0x10) to fade the screen out.

  Returns 0. R10 is the toolkit whose first field is the game-state pointer;

  the call to sub_8127990 is a guest-call helper invoked before reaching

  the toolkit/player lookup.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
