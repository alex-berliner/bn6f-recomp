name: t1_checkCustomChipMsg
address: '0x08029A36'
kind: function
status: probable
summary: 'Tutorial-state check for the first battle tutorial custMenu: decides whether to fire a hint
  message (returns message id 4) based on battle state and the tutorial''s tracked selection.'
interface: (r5 = tutorial state struct, r10 = toolkit) -> r0 = message id (4 = show message, 0 = none);
  flags clobbered
details: Reads the current battle state via [r10+oToolkit_BattleStatePtr] and tests its byte at offset
  7 for value 1 (likely the custom-screen/chip-select phase). It then requires the tutorial struct's byte
  at +0x19 to be 0 (a once-flag so the message only fires once) and the byte at +1 to be anything except
  0x54 (the tracked selection, probably a chip ID, not yet being 0x54). Only when all three hold does
  it return 4, the chatbox message index the caller plays; otherwise it returns 0. It has no side effects
  — purely a predicate for custMenu_80298F4's per-frame poll.
