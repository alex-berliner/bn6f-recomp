name: object_setCoordinatesFromPanels
address: '0x0800E29C'
kind: function
status: confirmed
summary: Recomputes a battle object's pixel X/Y from its current panel grid coordinates.
interface: void object_setCoordinatesFromPanels(BattleObject* object /* r5 */)
details: 'Takes the battle object in r5, reads its panel position from the byte fields oBattleObject_PanelX and
  oBattleObject_PanelY, calls object_getCoordinatesForPanels to convert the panel (column,row) pair into pixel coordinates,
  and writes the results into the object''s 32-bit oBattleObject_X and oBattleObject_Y fields. The converted coordinates
  are also left in r0 (X) and r1 (Y) for the caller, along with whatever NZCV flags and r2 the conversion helper
  produced. r5 and lr are the only true inputs; lr is popped as pc so the function returns directly to the caller
  of the tail-called helper''s contract.

  '
