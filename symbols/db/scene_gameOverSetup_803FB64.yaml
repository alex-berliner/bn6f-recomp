name: scene_gameOverSetup_803FB64
address: '0x0803FB64'
kind: function
status: confirmed
summary: 'Transitions to the game-over screen: renders a chatbox message, resets the display pipeline,
  tears down the active scene, fades to black, then marks state index 4 and starts a ~3 s countdown.'
interface: void scene_gameOverSetup(S200F348* self /*r5*/, u32 context /*r1*/) -> r0 = 0xB4 (down-counter
  value); flags nz reflect r0; r2-r4,r7,lr may change
details: 'Called when the player''s game ends. Sequence: (1) chatbox_8040818 displays the game-over dialogue
  (context passed in r1). (2) sub_80015FC(0xF) switches to text-mode display. (3) copyTileData_803FC64
  uploads background tiles. (4) SetRenderInfoLCDControl(0x1F40) reconfigures the LCD registers for the
  static game-over background. (5) renderInfo_8001788 and renderInfo_80017A0 flush the two render-info
  buffers to VRAM. (6) sub_803FBE8 tears down the active scene''s objects/state. (7) SetScreenFade(8,
  0x20) begins a fade-to-black at speed 8 with target 0x20. (8) S200F348.Index_00 (byte at offset 0) is
  set to 4, which the per-frame callback cb_803FB3C reads to dispatch playGameOver_803FB9C. (9) S200F348.DownCounter
  (halfword) is set to 0xB4 (180 frames ≈ 3 s at 60 Hz), gating the transition to the game-over menu.
  The function is a leaf that does not return meaningful data to the caller beyond leaving r0 = 0xB4.'
