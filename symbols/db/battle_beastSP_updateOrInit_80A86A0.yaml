    the BeastSP directory contains this function and its sibling initialiser `sub_80A86B4` (asm29.s:6588),
    and the captured `snap_beastsp_0180000_*` snapshots come from BeastSP runs - sprite_update returns
    r0 = 0x2f8 (visible in every captured exit r0); this matches the function''s last move-immediate -
    the only caller `sub_80A8674` has an identical in/out contract and lives in the same BeastSP module,
    so 80A8674 is the per-frame dispatcher that calls this trampoline - r10 is preserved through the function
    (in/out both list r10) which is consistent with the project-wide convention that r10 holds the Toolkit
    pointer'
