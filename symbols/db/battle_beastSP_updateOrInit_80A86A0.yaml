name: battle_beastSP_updateOrInit_80A86A0
address: '0x080A86A0'
kind: function
previous_names:
- sub_80A86A0
status: probable
summary: 'BeastSP secondary object tick: initialise/update the BeastSP object state, then drive its sprite.'
interface: '(no meaningful args passed via regs; the BeastSP object is reached through r10-derived pointers
  the callees know about) -> (no return; caller restores r4–r7); side effects: writes the BeastSP object
  and its sprite'
details: "This is a tiny trampoline: it pushes r4–r7 and lr, calls `sub_80A86B4` (initialise/update\n\
  \  the BeastSP object given the active secondary object), then calls `sprite_update` on the\n  resulting\
  \ sprite, then pops r4–r7 and pc.\n  The contract reads in `r2`, `r5`, `r10`, `lr` and writes back `r2`,\
  \ `r3`, `r8–r10`, `r12`;\n  r10 is the Toolkit pointer (per the project convention `r10 = &Toolkit`),\
  \ so the callees\n  walk `Toolkit` to reach the BeastSP-related object. `r5` and `r8/r9` are the secondary\n\
  \  ObjectHeader/BattleObject pair passed up from the caller (sub_80A8674). r2 is a flag/arg\n  that\
  \ the callees interpret (consistent with the recorded entry r2=08373234 or 02039368 –\n  EWRAM pointers\
  \ shared with the BeastSP subsystem).\n  Captured calls all show exit r0=0x2f8 with Z set, and the value\
  \ 0x2f8 is the constant\n  returned by `sprite_update` (it ends with `mov r0, #0x2f8`), confirming `sprite_update`\n\
  \  is reached on the BeastSP path. Recorded lr values 080a869f (= sub_80A86A0+1, i.e. the\n  return-after-bl)\
  \ and 080a8660 (return into the calling dispatcher sub_80A8674) confirm\n  this function is invoked\
  \ both directly and after its sibling initialiser.\n"
