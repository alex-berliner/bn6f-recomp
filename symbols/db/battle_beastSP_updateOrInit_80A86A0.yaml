open_questions:
- Whether `sub_80A86B4` is the "init" arm of the same pair versus another update step. The
- function name "initOrUpdate" is taken from the project's notes on the sibling; settled
- only by reading 80A86B4's body. The captured r2 values vary between 08373234 and 02039368,
- so r2 looks like an object/event pointer the callee walks – its meaning would be confirmed
- by 80A86B4.
