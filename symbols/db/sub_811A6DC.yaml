name: sub_811A6DC
address: '0x0811A6DC'
kind: function
status: hypothesis
summary: Picks the Custom Gauge button (L/R/A/B) for a navi based on the nav-list index and forwards it for recording.
interface: void navCustButtonFromIndex_811A6DC(u32 r1 /* nav_index */, void* r7 /* unit_block */, void* r10 /* set
  up for caller */); // clobbers r0,r1-r4,r12,lr; preserves r5-r9; returns via r10/r11
details: 'Inspects the unit block at offset 0x1B (a per-unit flag byte). When the requested

  nav-list index is 2 (the secondary action slot) and bit 1 of that flag is clear

  (no secondary action nav available for this unit), the index is bumped to 3 so

  the secondary slot is skipped. The (possibly adjusted) index is then used to

  fetch a byte from the constant table at 0x0811A700, which is the little-endian

  word 0x302F1A19 laid out as bytes {0x19, 0x1A, 0x2F, 0x30} — i.e. the four

  Custom Button IDs: Y (0x19), X (0x1A), L (0x2F), R (0x30), in that order.

  The chosen button byte (r0) is then handed to sub_811A718, which (per the

  sibling comment) "records the chosen nav button", and the result is delivered

  to the caller through r10/r11. Quirks: the bump-by-one logic implicitly means

  index 2 only ever resolves to the L or R button when the unit lacks a

  secondary action nav; otherwise index 2 is read directly.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
