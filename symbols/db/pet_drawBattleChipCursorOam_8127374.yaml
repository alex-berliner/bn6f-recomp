name: pet_drawBattleChipCursorOam_8127374
address: '0x08127374'
kind: function
previous_names:
- sub_8127374
status: probable
summary: For the PET menu cursor entity, queue one OAM entry of its battle-chip cursor sprite at its current
  position.
interface: (r5 = ptr to PET-menu cursor entity) -> side effects only; queues an OAM entry.
details: "- Reads entity's word at +0x1e (cmp #4; blt early-out): cursor is only drawn once a state threshold\
  \ is met.\n  - Loads signed bytes at +0x0d and +0x0e (PanelX/PanelY in BattleObject), subtracts them\
  \ and shifts left by 3 to derive a pixel delta to add into the halfword at +0x32 (object Y coord 16.16\
  \ high half).\n  - Then `lsl r0,#16; orr r1,#0x14` packs the new 16.16 coord (low 16 bits forced to\
  \ 0x14) for the OAM submitter.\n  - Calls object_computeAndQueueOamEntry_811FA98 with the OAM tile+attr\
  \ constant 0x20002, the entity's state at +0x1e, the joypad at +0x24, sprite size 4 and OAM slot 0x4c/0x34,\
  \ which queues a single OAM entry for the cursor.\n  - Touches only this entity; identical captured\
  \ arguments across 40 calls confirm it's the per-tick cursor redraw.\n"
