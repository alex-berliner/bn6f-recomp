- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r0,[r5,#0x1e]; cmp r0,#4; blt locret_81273A6` (state gate at 0x8127378-0x812737C).
    - `ldrsb r0,[r5,r1]; ldrsb r2,[r5,r3]` with r1=0xd, r3=0xe reads signed PanelX/PanelY (per BattleObject
    struct). - `sub r0,r0,r2; lsl r0,#3; ldrsh r1,[r5,r2]` with r2=0x32, then `strh r0,[r5,r2]` updates
    the Y half-coord using the panel delta. - `orr r0,r1; ldr r1,dword_81273A8` packs 0x14 into low bits
    and supplies the OAM attribute/tile constant 0x20002. - `bl object_computeAndQueueOamEntry_811FA98`
    with the standard OAM-submit signature. - Caller pet_menuScreenTick_8126FF0 runs each tick of the
    PET screen; this function is hit 40 times across snapshots, consistent with per-tick redraw.'
