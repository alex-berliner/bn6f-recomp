name: HandleKeyItemMenu8128730
address: '0x08128730'
kind: function
status: confirmed
summary: Dispatches the key-item menu to one of three step handlers based on the menu state byte at r5+1.
interface: void HandleKeyItemMenu8128730(void) // r5 in; r5, r8, r9, r10, r11, r12 out; clobbers nz,cv,r0-r4,r6,r7,lr
details: 'Thin jump-table dispatcher. Reads the menu''s current step byte from r5+1

  and uses it (as a 0/4/8 offset) to index a 3-entry table at off_8128744,

  then tail-calls (via bx through lr) the selected handler at +1 (Thumb).

  The chosen handler therefore runs with the caller''s full register state

  (notably r5, r8-r12 are read back) and on return this routine simply

  pops pc, propagating those values to the caller unchanged. The table

  currently points to sub_8128750, sub_81287B4 and sub_81288E4 — the three

  key-item menu step handlers. No memory is written by the dispatcher

  itself; all state lives in the menu struct pointed to by r5.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
