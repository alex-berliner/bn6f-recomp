name: battle_updateTimedDespawn
address: '0x080E792A'
kind: function
status: probable
summary: Battle-object update that despawns the object when its Timer expires or when the battle ends.
interface: (r5 = battle object) -> r0 = clobbered by calls; no meaningful return
details: Standard per-frame object update. It first checks battle_isBattleOver; if the battle is over
  it frees the object right away via object_freeMemory. Otherwise it decrements the object's oBattleObject_Timer
  field (halfword at r5) each frame, and when the decremented value reaches 0 (bgt fails) it also frees
  the object. The object pointer lives in r5, consistent with the battle-engine update-callback convention,
  and no other fields are touched.
