name: submenu_rebuildKeyItemList
address: '0x08135D9C'
kind: function
status: probable
summary: Rebuilds the key-item/chip list buffer for a list menu (Navi Customizer screen context), then
  re-clamps the menu's cursor and scroll offsets to the new entry count.
interface: (r5 = list-state struct, set by caller) -> r0 = entry count; list buffer word_201DA80 rewritten,
  struct fields +0x1e/+0x20/+0x24/+0x38/+0x3a updated
details: 'Zero-fills 0xBC<<2 = 752 bytes (188 word-sized entries) at word_201DA80, then fills that buffer
  with (id, count) entries via battle_collectKeyItemCounts, or via sub_8135E6C when the byte at [r5] equals
  0x28 (a different list mode). It stores the entry count ((end-base)>>2) at [r5+0x1e] and clamps a 4-row-visible
  list: if count >= 4 it caps [r5+0x24] (+ its copy at +0x3a) at count-4 (max scroll) and adjusts [r5+0x20]
  (+0x38) accordingly; otherwise it sets [r5+0x20]/+0x38 to min(count, old) and resets [r5+0x24]/+0x3a
  to 0. The paired fields (+0x20/+0x38, +0x24/+0x3a) look like current vs. saved cursor/scroll for the
  same list.'
