name: battle_chipMatchesHpFullRestoreAiBranch_8012B4E
address: '0x08012B4E'
kind: function
status: probable
summary: Decides whether the current chip is eligible for the AI's "HP-full restore" attack branch by
  checking the navi's alliance stat and chip flags.
interface: u32 battle_chipMatchesHpFullRestoreAiBranch_8012B4E(u32 chip_id, u32 arg1, u32 battle_object
  /* r5 */); // returns 0/1 in r0; r6, r7 preserved; clobbers nz,cv,r1,r4,lr
details: 'Reads two alliance-style bytes from the battle object via

  GetBattleNaviStatsByte_AllianceFromBattleObject at offsets 0x29 and 0x2C; short-circuits to the

  flag check when either equals 6, or when 0x2C equals 0x12. Resolves the chip descriptor via

  getChip8021DA8 and inspects chip+9 (bit 1 must be set, bit 0 must be clear) and chip+4 (must equal 2).

  If arg1 != 0 the function returns 1 immediately; otherwise it reads oBattleObject_AIDataPtr->PwrAtkState

  (must be 2) and PwrAtkButton (must be 1) from the battle object''s AI data block before returning 1.

  Otherwise returns 0. The chip-element check at +4==2 plus the alliance filter is consistent with

  selecting Recovery-family chips (element 2) used by a specific navi alliance under an HP-full

  condition for the AI''s power-attack path.

  '
