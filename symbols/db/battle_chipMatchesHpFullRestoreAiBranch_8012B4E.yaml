interface: u32 battle_chipMatchesHpFullRestoreAiBranch_8012B4E(u32 chip_id /*r0*/, u32 forceMatch /*r1*/,
details: "Decides whether a candidate chip is eligible for the AI's \"HP full\nrestore\" selection branch (apparently\
  \ reserved for regular-attack chips\nused while a charged power attack is queued, when the player/navi stats\n\
  map to a specific role value).\nInputs:\n  r0 = chip id, used via getChip8021DA8\n  r1 = a \"skip AI state\" force-flag;\
  \ non-zero matches without further checks\n  r5 = acting battleObject pointer (read for AIData and the two navi\
  \ stats\n       bytes via GetBattleNaviStatsByte_AllianceFromBattleObject)\nOutputs:\n  r0 = 0 no-match, 1 match\n\
  \  r2 = scratch/echo: 2 on the bit0 (chip_flags & 2) miss path, 1 otherwise\n  r6 = pass-through of the caller's\
  \ r6 (preserved through the two\n       GetBattleNaviStatsByte calls)\nClobbers: r1, r4, LR; flags NZCV.\nLogic:\n\
  \  1. Read navi stats byte at offset 0x29 via GetBattleNaviStatsByte.\n     If it equals 6, fall through to chip\
  \ test.\n     Else read navi stats byte at offset 0x2C: must be 6 or 0x12 to\n     continue; otherwise return\
  \ 0.\n  2. Look up the chip via getChip8021DA8(chip_id). The chip's byte +9\n     (chip_flags) must have bit 1\
  \ set (tst #2 == 0 fails branch), bit 0\n     clear (tst #1 != 0 bne exits with 0), and byte +4 must be exactly\n\
  \     2 (chip kind 2 = regular/attack chip). Any miss returns 0 with\n     r2 reflecting the last tst mask used.\n\
  \  3. If incoming r1 != 0, return 1 immediately (force-match shortcut).\n  4. Otherwise load AIData pointer at\
  \ oBattleObject_AIDataPtr from\n     battleObject and require:\n        oAIData_PwrAtkState  == 2  (charged power-attack\
  \ held)\n        oAIData_PwrAtkButton == 1  (queued on the \"correct\" button)\n     Both must hold; otherwise\
  \ return 0.\nField offsets seen:\n  oBattleObject_AIDataPtr    (offset used with ldr r1,[r5,#ofs])\n  oAIData_PwrAtkState\
  \        (ldrb r0,[r1,#ofs])\n  oAIData_PwrAtkButton       (ldrb r0,[r1,#ofs])\n  chip byte +9 = flags, chip byte\
  \ +4 = kind/sub-kind\nQuirks:\n  - The two GetBattleNaviStatsByte calls pass r1=0x29 then r1=0x2C,\n    using\
  \ R5 (battleObject) as a hidden 2nd arg.\n  - r6 is explicitly preserved (saved into the local and never\n   \
  \ overwritten; only the C-level call returns carry/overflow which\n    are clobbered by the wrapper).\n  - r2\
  \ is essentially a tag showing which tst mask was the last to be\n    inspected on the early-out path; on success\
  \ r2 ends as 1.\n"
