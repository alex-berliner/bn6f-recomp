name: battle_lungeSpawnHitRegion
address: '0x080DCDFA'
kind: function
status: probable
summary: Spawns the damaging collision region for the lunge attack at the object's current panel.
interface: (r5 = battle object) -> r0 = spawned collision region from object_spawnCollisionRegion; no
  flags meaningful
details: Reads oBattleObject_PanelX/PanelY as the target panel coordinates and oBattleObject_Element as
  the hit element, passing them as r0-r2 to object_spawnCollisionRegion with r3=0. r4 is a packed constants
  blob 0x15050601 (likely damage 0x15 plus hit type/flags bytes) and r7=3, both fixed literals for this
  attack. r6 is taken from oBattleObject_DamageAndStaminaDamageCounterDisabler, so the spawned region
  inherits the object's damage-related field. This is the 'deal damage' step complementing the caller's
  panel-highlighting dash.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element map straight onto spawnCollisionRegion's
    coordinate+element args; ldr r6, [r5,#oBattleObject_DamageAndStaminaDamageCounterDisabler] passes
    an object damage field through to the spawn call; constant r4=0x15050601 and r7=3 are fixed hit-property
    values for one specific attack; sole caller battle_lungeForwardState 'dashes forward ... highlighting
    the panels it passes, then destroys itself', matching a hitbox spawn at the lunged-to panel
  refs:
  - bn6f/asm/asm31.s:80347
