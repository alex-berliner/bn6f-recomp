summary: Thin wrapper that invokes sub_8123C20 with a fixed constant argument set; its game-level purpose is not
  yet identified.
interface: 'void sub_8123BC0(void); /* tail-style wrapper: r0-r4 loaded with constants before call, r4-r7 preserved
  across it */'
details: 'Pure pass-through helper. It loads the address of the word table dword_8123BDC

  (containing the bytes 0x2E, 0x2F, 0x30, 0x00) into r0, the address of the byte

  table byte_81233D8 into r2, and passes the fixed constants r1=1, r3=4 and

  r4=0x1C (likely an entry count of 28 for the byte table) to sub_8123C20, then

  returns immediately after the call. Although it is a leaf-style wrapper, it

  pushes/pops r4-r7 because it clobbers r4 with the 0x1C argument and must

  restore the caller''s value. No state is read or written beyond what

  sub_8123C20 itself does. The byte values 0x2E-0x30 look like consecutive

  small IDs (text, object or sound IDs of some kind), which suggests

  sub_8123C20 is a generic table-driven worker (lookup/iteration) that this

  call specializes to one particular table and range.

  '
