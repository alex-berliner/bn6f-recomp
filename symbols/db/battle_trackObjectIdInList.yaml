- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r5,#0x18]; bl battleObject_getByIndex_813B780; ldrb r4,[r0,#3] — ID comes from descriptor
    byte 3 of the indexed object; loop ldrb r0,[r7,r6]; cmp r0,r4; beq locret — early exit when ID already
    present (dedupe); strb r4,[r7,r6] at the first entry where r0==0 — insert into first free slot of
    the 6-entry array; cmp r6,#6; blt loc_81366DE — array length is exactly 6 bytes at unk_2022B70 (off_8136798);
