name: battle_trackObjectIdInList
address: '0x081366D0'
kind: function
status: probable
summary: Registers a battle object's ID into a 6-slot unique-ID list at unk_2022B70 if not already present.
interface: (r5 = current object ptr, reads [r5+0x18] as object index) -> r0 = descriptor byte 3 (leftover,
  not a real return); no flags meaningful
details: 'Loads the halfword at [r5+0x18] and resolves it via battleObject_getByIndex_813B780 to a 0x10-byte
  battle-object descriptor, taking byte offset 3 as an ID. It then scans unk_2022B70 (a 6-entry byte array):
  if any entry already equals the ID it returns early (dedupe); otherwise it writes the ID into the first
  zero entry and stops. If all 6 slots are non-zero and none match, the call is a no-op. So the array
  behaves as a set/list of at most 6 tracked battle-object IDs, insertion-ordered. Note the ID byte (offset
  3 of the descriptor) doubles as the list''s empty sentinel (0), so an object with ID 0 is never stored.'
