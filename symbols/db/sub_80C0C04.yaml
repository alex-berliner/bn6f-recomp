summary: Dispatches a battle object's current phase to its phase handler.
interface: void sub_80C0C04(u32 phase_in_r0) /* reads r5->CurPhase, r5/r8-r12 threaded */
details: "Reads the battle object's current phase byte at oBattleObject_CurPhase\n(relative to r5) and tail-calls\
  \ the matching handler from a 2-entry\nThumb-mode function pointer table at off_80C0C18:\n  phase 0 -> sub_80C0C20\
  \ (battleObject_tickPhase3_80C0C20)\n  phase 1/default -> sub_80C0C48\nThe phase value is loaded into r0 and the\
  \ handler is invoked via a\nldr/mov lr,pc; bx r1 sequence (Thumb switch idiom), so the caller's\nr2-r5 and lr\
  \ are consumed as inputs and the handler's r5, r8-r12\nare propagated back to the caller (LR is popped from the\
  \ stack\nafter the bx tail-call, never returning here).\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
