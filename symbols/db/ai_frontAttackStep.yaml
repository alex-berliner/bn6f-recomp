name: ai_frontAttackStep
address: '0x080F19F0'
kind: function
status: probable
summary: Init-and-tick handler for an AI attack that spawns a 3-panel attack region in front of the owner
  and applies its element to the hit after a 30-frame delay.
interface: (r7 = AI attack vars struct, r5 = battle object) -> r0 = 0; updates oAIAttackVars_AttackElement/StepTimer/HitElement
  and oBattleObject_CurAnim
details: 'Uses the attack''s own vars struct (oAIAttackVars_*): if AttackElement is still 0, it stamps
  it with element 4, sets the object''s current animation to 0x16, calls ai_spawnFrontAttackRegions to
  lay collision regions on the three panels ahead of the owner, plays sound 0xFB, and loads StepTimer
  with 30. On later calls it decrements StepTimer; once it reaches 0 it writes 4 to oAIAttackVars_HitElement,
  deferring the hit''s element/damage activation until the wind-up is over. No branch state is returned;
  r0 is just 0 on all paths.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne is an init-vs-tick state check on the attack's
    own vars; bl ai_spawnFrontAttackRegions matches the known callee 'spawns three collision regions on
    1st/2nd/3rd panels in front of the owner with the attack's damage'; mov r0,#0x16; strb r0,[r5,#oBattleObject_CurAnim]
    plays a wind-up animation on the battle object; strh 0x1e into StepTimer then a sub/strh/bgt countdown
    ending in strh 4 to HitElement is a delayed activation; bl PlaySoundEffect with 0xFB fires a one-shot
    attack sound on init only
