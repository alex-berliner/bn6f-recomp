name: battle_objectWaitTimerStep
address: '0x080BEE80'
kind: function
status: probable
summary: battle-object phase step that waits 10 frames then advances the object to phase 4
interface: (r5 = battle object, no args) -> r0 = return of phase-4 handler; clobbers r0, flags
details: On first invocation for the current phase (PhaseInitialized == 0) it stores 10 into oBattleObject_Timer
  and sets PhaseInitialized = 4. Every frame it decrements oBattleObject_Timer; while it is still >0 it
  returns. When the timer expires it writes 4 into oBattleObject_CurPhaseAndPhaseInitialized (phase 4
  with the initialized bit cleared) and tail-calls sub_80BEEA2, presumably the phase-4 handler. It is
  a generic 'delay then change phase' state step shared by battle object scripts.
