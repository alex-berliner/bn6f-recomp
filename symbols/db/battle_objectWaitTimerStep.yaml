- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb [r5,#oBattleObject_PhaseInitialized] / strh #0xa to Timer: first-run initialization of
    a 10-frame delay; ldrh Timer; sub #1; bgt: per-frame countdown gate; strh #4 to oBattleObject_CurPhaseAndPhaseInitialized
    then bl sub_80BEEA2: advance to phase 4 and run its handler; uses r5 object-pointer convention with
    oBattleObject_ fields, matching battle object step handlers'
  refs:
