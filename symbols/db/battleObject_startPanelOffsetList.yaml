name: battleObject_startPanelOffsetList
address: '0x08114074'
kind: function
status: probable
summary: Wrapper that picks a panel-offset list from PanelOffsetListsPointerTable by index and hands it (plus r6)
  to sub_8114088 to run.
interface: (r4 = index into PanelOffsetListsPointerTable, r6 = parameter passed through) -> tail-calls sub_8114088(r4
  = list pointer, r6); no direct return value used
details: Loads the PanelOffsetListsPointerTable base, scales r4 by 4, and reads the pointer at [table + r4*4], so
  r4 selects one of the offset lists (the caller passes r4 = 0x2c). It then tail-branches into sub_8114088, which
  receives the selected list pointer in r4 and the untouched r6. All other work (actually consuming the list) is
  done by the callee. The caller sets r6 from the battle object's field at +0x16, suggesting it is a per-object
  parameter such as a step count or variant selector.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8114074: ldr r7, off_8114084 (PanelOffsetListsPointerTable); lsl r4,r4,#2; ldr r4,[r7,r4] — r4 indexes
    the pointer table; sub_8114074 ends with bl sub_8114088, tail-calling with the loaded pointer in r4 and r6 unchanged;
    Caller 0x08113FC0 sets mov r4,#0x2c and ldrb r6,[r5,#0x16] immediately before bl sub_8114074; Caller first calls
    battleObject_findClosestEnemyBattleObject_80103F8 and GetAllianceDependentPanelParamArgs, so this runs as part
    of a battle-object panel effect'
