open_questions:
- What sub_8114088 does with the list pointer and r6 (apply offsets to panels, queue an animation, spawn tiles?)
- What list entry 0x2c of PanelOffsetListsPointerTable contains
- Exact meaning of r6 (index within the list, repetition count, or object field semantics)
