name: link_stateMachineRunStep_8144250
address: '0x08144250'
kind: function
previous_names:
- sub_8144250
status: probable
summary: Drives the e-Reader / link-cable state machine for one tick (state stored in eTimerEnable200F460+1),
  performs its action, then packs and returns a status bitfield.
interface: '(r0 = small struct ptr {byte 0 = lastMode}, r1 = ptr2, r2 = ptr3) -> r0 = packed status word
  ; side effects: IWRAM/EWRAM at eTimerEnable200F460+ (link-state, SIO control), call to link/teardown
  helpers'
details: "- Saves r4-r7/lr; r4=r0, r5=r1, r6=r2.\n  - Reads the current link sub-state from `byte_200F461`\
  \ (`eTimerEnable200F460+1`) and uses it as a 6-case jump table (`jpt_8144268`) selecting loc_814428C\
  \ (0), 814429C (1), 81442B4 (2), 81442F0 (3), 81442FA (4), 814430C (5).\n  - Case 0: calls `sub_81440D8`\
  \ (link teardown) and sets state=1.\n  - Case 1: if r0==1 calls `link_initAndClear_8144158` and sets\
  \ state=2.\n  - Case 2: branches on r0 (1 or 2) to handle e-Reader state, else calls `ereader_updateTimerEnable_8144380`.\n\
  \  - Case 3: calls `sub_81443AC`, sets state=4.\n  - Case 4/5: calls `sub_81443FC(r5)` and `sub_81444E4(r6)`\
  \ (case 5 also pre-sets `eTimerEnable200F460+0x15=2`).\n  - After the switch, clears `*r4=0`, then packs\
  \ a status word from eTimerEnable200F460 fields: low byte merges Unk_02/Unk_03 (with 0x20 if +0==8),\
  \ then ORs in shifted fields from +0xC,+0x11..+0x15 (8,9,16,17,18,20 bits), and additionally sets bit\
  \ 0x40 when state==4, and 0x400000 when Unk_02>3.\n  - Returns the packed word in r0.\n  - Caller sub_803DEB4\
  \ is the e-Reader/title-screen driver; called repeatedly while link/e-Reader state machine is active.\n"
