name: sub_80C8232
address: '0x080C8232'
kind: function
status: confirmed
summary: Per-frame update for a battle object tethered to a leader object's current action (0xB), dispatching the
  follower's phase-4 handler and self-destructing once the leader moves on.
interface: '// r5 = BattleObject*, r10 = battle context (preserved across call)

  // reads  r5, r10; clobbers r0-r4, r6-r7, r8-r12, lr, nzcv

  // no return value; jumps to phase-4 handler through a dispatch table

  '
details: 'Called as a BattleObject''s phase-4 handler. Checks battle_isBattleOver;

  if the battle is finished, sets CurStateActionPhaseAndPhaseInitialized

  to CUR_STATE_DESTROY (0x3E per offset naming) and returns. Otherwise

  reads the leader (oBattleObject_RelatedObject1Ptr, "RelatedObject1Ptr")

  and tears down the follower when the leader''s CurAction is no longer

  0xB ("follow/chain" action slot). With battle still running and the

  leader still on action 0xB, calls battle_isTimeStop; if time-stop is

  active the object idles for the frame. Otherwise it loads CurAction as

  an index into off_80C8264 (currently a single-entry table whose only

  slot is battleObject_runPhase4AndDestroy_80C8268) and tail-calls it.

  The table is indexed by the follower''s CurAction (not the leader''s),

  and the existing pointer is at offset 0x80 of the base, with the action

  byte driving the dispatch.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
