name: oAIData_BattleObjectPtr
address: '0x78'
kind: struct-field
status: probable
summary: Pointer back to the owning BattleObject, cached on the AI data so subroutines can resolve the
  source object without re-loading through AIDataPtr chains.
details: Every access loads the field as a full 32-bit word and immediately uses it as either an argument
  to a sub-AI routine (sub_810222C, sub_800FE28) or a source for downstream writes — never as a plain
  integer/flag. The single store (battle_SetObjectAIDataField78_800F318) takes a parameter from the caller,
  which fits a cached back-pointer initialized when AI data is attached. The downstream call sites also
  consistently pair AIDataPtr/unp_78 with the BattleObject in r5, and sub_810222C is invoked with (0,
  0, thisPtr, dataPtr) shape — strongly suggesting this is the BattleObject handle the AI passes around.
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: sub_800F2F0 dereferences AIDataPtr then loads Unk_78 as a pointer and hands it to sub_800F2FC
    — classic back-pointer passthrough.
  refs:
  - bn6f/asm/asm31.s:155750
  reproduce: grep -n 'oAIData_BattleObjectPtr' bn6f/asm/asm31.s | head
  result: '"ldr r0, [r0,#oAIData_BattleObjectPtr]\nbl sub_800F2FC"'
- method: assembly-reading
  date: '2026-10-15'
  detail: battle_SetObjectAIDataField78_800F318 stores the caller's r0 (a 32-bit value) into the field,
    consistent with caching an object pointer rather than a flag.
  refs:
  - bn6f/asm/asm31.s:155750
  reproduce: grep -n 'oAIData_BattleObjectPtr' bn6f/asm/asm31.s | head
  result: '"str r0, [r1,#oAIData_BattleObjectPtr]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Unk_78 is passed as the 3rd arg to sub_810222C alongside a function/data table pointer and zeroes
    — the standard calling shape this routine uses for "object + table" AI checks.
  refs:
  - bn6f/asm/asm31.s:155750
  reproduce: grep -n 'oAIData_BattleObjectPtr' bn6f/asm/asm31.s | head
  result: '"ldr r2, [r2,#oAIData_BattleObjectPtr]\nldr r3, off_8101DF8 // =byte_8101DBC\nbl sub_810222C"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Unk_78 is propagated into oAIAttackVars_Unk_2c, mirroring a BattleObject pointer being threaded
    into per-attack context.
  refs:
  - bn6f/asm/asm31.s:155750
  reproduce: grep -n 'oAIData_BattleObjectPtr' bn6f/asm/asm31.s | head
  result: '"ldr r0, [r0,#oAIData_BattleObjectPtr]\nstr r0, [r7,#oAIAttackVars_Unk_2c]"'
