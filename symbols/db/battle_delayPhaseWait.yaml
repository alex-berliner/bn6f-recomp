name: battle_delayPhaseWait
address: '0x080D0916'
kind: function
status: probable
summary: Battle object phase handler that initializes a short timed wait (10 or 15 frames, chosen by Param1)
  and then advances the object to action 8 when the timer expires.
interface: (r0 = battle object? passed via r5 convention, r5 = object pointer) -> r0 = clobbered; sets
  oBattleObject_CurPhase=4, CurAnim=1, collision region 1 on entry phase; on timer expiry sets CurAction=8
  and resets phase
details: This is a per-frame phase/state routine for a battle object whose pointer lives in r5. On phase
  0 (entry) it calls sub_80D0A80 once, sets CurPhase to 4 and CurAnim to 1, sets collision region index
  1 via object_setCollisionRegion, then loads oBattleObject_Timer from the 2-entry table byte_80D0950
  indexed by oBattleObject_Param1 ({0x0A,0x0F} = 10 or 15 frames). In subsequent frames it decrements
  Timer; when the subtraction goes negative (bge fails) it sets oBattleObject_CurAction to 8 and zeroes
  CurPhaseAndPhaseInitialized, moving the object to its next action. So Param1 selects between two wait
  durations before the state machine advances.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst/beq gates an init block that stores phase 4, anim
    1 and calls object_setCollisionRegion with region 1; ldrb r0,[r5,#oBattleObject_Param1]; ldrb r0,[r1,r0]
    with r1=byte_80D0950 loads the timer value {0xA,0xF} into oBattleObject_Timer; Non-init path decrements
    oBattleObject_Timer with sub/bge, i.e. a frame countdown; On timer underflow stores 8 to oBattleObject_CurAction
    and 0 to oBattleObject_CurPhaseAndPhaseInitialized, the standard phase-reset transition; Callee object_setCollisionRegion
    is the known helper that writes a collision region index into the object's collision data
