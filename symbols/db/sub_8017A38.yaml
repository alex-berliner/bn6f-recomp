name: sub_8017A38
address: '0x08017A38'
kind: function
status: confirmed
summary: 'Battle object timer tick: when the per-object timer expires, either flip to action 4 (clear stuck flag)
  or run the full knock-down/recovery sequence (action 8).'
interface: void battleObject_tickTimer_8017A38(void);  // r5 = object pointer in
details: "Decrements oBattleObject_Timer (u16) and returns while it remains >= 0.\nOn expiry, reads object flags\
  \ and tests bit 0x800 (object flag 11):\n  - If set: clear flag 0x100000, set CurAction=4, reset CurPhaseAndPhaseInitialized=0,\n\
  \    and exit (a \"short\" recovery / unstuck path).\n  - If clear: clear flag 0x501800, clear AI flag 0x1000043F\
  \ (via ClearAIData_Unk_44_Flag),\n    clear AI flag 0x200000 (via ClearAIDataUnk0x48Flag), clear object flag2\
  \ 0x10,\n    zero Unk_1f and CurAnim, set CurAnimCopy=0xFF, call sub_8011450, then set\n    CurAction=8 and reset\
  \ CurPhaseAndPhaseInitialized=0 (full knock-down/recovery).\nReads/writes many fields of the battle-object struct\
  \ (oBattleObject_Timer,\nCurAction, CurPhaseAndPhaseInitialized, Unk_1f, CurAnim, CurAnimCopy) and\ndispatches\
  \ into the AI/state flag helpers (object_getFlag/clearFlag,\nClearAIData_Unk_44_Flag, ClearAIDataUnk0x48Flag,\
  \ object_clearFlag2).\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
