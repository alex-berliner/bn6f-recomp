name: battle_objectPerFrameTick
address: '0x080D4144'
kind: function
status: probable
summary: 'Per-frame tick helper for a battle object: re-arms flag 0x2, clears the sprite final-palette
  high nibble, then runs the standard pipeline (finishCollisionHitReaction, timerCountdown, dispatchActionHandler
  via a 10-entry local table, updateSprite, presentCollisionData).'
interface: (r5 = object header pointer; no args passed) -> r0 = result of last call; flags set by callees
details: 'Uses r5 as a pre-set object pointer, so it is a frame-tick helper rather than a standalone entry
  point. It ORs bit 0x2 into oObjectHeader_Flags each frame and calls sprite_clearFinalPalette to wipe
  the high nibble of the sprite final-palette byte — together suggesting the object applies a per-frame
  palette effect (e.g. flash/shimmer) that must be re-established after each tick. It then runs the standard
  per-frame object pipeline: finishCollisionHitReaction, timerCountdown, dispatchActionHandler with its
  own 10-entry action table (custom handlers sub_80D4198/sub_80D42E8/sub_80D41B6/sub_80D41FC mixed with
  shared ones like battle_ResetObjectActionState and initAndRunAI), object_updateSprite, and object_presentCollisionData.
  The dispatch table being object-local means this tick belongs to one specific object type, not the generic
  engine path.'
