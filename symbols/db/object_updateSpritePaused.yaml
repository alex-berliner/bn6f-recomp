name: object_updateSpritePaused
address: '0x0801BCA6'
kind: function
status: confirmed
summary: Steps the sprite of a battle object whose logic is paused (time-stop immune), syncing its sprite animation
  state to the object's currently selected animation and advancing one frame.
interface: void object_updatePausedSprite_801BCA6(u32 obj /* r5 */, void *ctx /* r10 */); // uses lr; clobbers nzcv
  r0-r5 (no other clobber contract)
details: 'Operates on a battle object pointer passed in r5, with r10 carrying the encounter/ctx

  (preserved, not actually read here). Reads oObjectHeader_Flags (offset on the object

  header) and short-circuits with bit 0 clear — only objects flagged OBJ_FLAG_SPRITE_UPDATES

  (=0x01) get their sprite ticked while paused. Even those are skipped while

  battle_isTimeStop() reports an active time-stop, so chips like TimeStop/Navi-Cust freeze

  frames cleanly for these objects.


  When the object is unfrozen, it reads oBattleObject_CurAnim and compares it to the cached

  oBattleObject_CurAnimCopy. On a mismatch it calls sprite_setAnimation(u8 anim) and

  sprite_loadAnimationData(), then re-reads CurAnim (the callees can mutate it) before

  storing it into CurAnimCopy — this is the "adopt the new animation" sync step.


  Finally it calls sprite_update() to advance the sprite one frame. The early-out paths are

  unusual: the flag-skip explicitly leaves the function''s own r0 (flags byte), r1 (=1), and

  the Z flag from `tst` in place as "the result", while the time-stop path leaves the callee''s

  leftover registers/flags untouched. Both behaviors are preserved verbatim by the assembly

  (no auto-generated stub for either path), which is why the readable C has to hand-roll an

  adapter (set_skip_result) rather than fall through plain C return-value plumbing.


  Quirks: the function is the THUMB wrapper `object_updateSpritePaused` at 0x0801BCA6

  (push {lr} / pop {pc}) and ends right after `locret_801BCCE`; it cannot itself branch on

  the early-out conditions, so any rename must keep its two early-exit paths leaving their

  distinct register/flag leftovers intact for the caller. No oBattleObject_* offsets are

  known here beyond their identifiers; sprite_setAnimation / sprite_loadAnimationData /

  sprite_update / battle_isTimeStop live in other translation units.

  '
