name: object_setupCollisionData
address: '0x08019FB4'
kind: function
status: confirmed
summary: Initializes a battle object's collision-data block from its parent object, resolves self/target collision-type
  flag tables, applies a time-stop bit, and finalizes via sub_8019F44.
interface: void object_setupCollisionData(u32 outCollisionPtr, u32 selfTableIdx, u32 targetTableIdx, u8 hitModifierBase
  /* r3 */, u32 parentBattleObject /* r5 */, u32 unused_r10) -> {u32 r0, u32 r1, u32 r6} (clobbers r3, lr, flags
  NZCV)
details: "Writes through the oCollisionData_* fields of the struct pointed to by r0, sourcing most fields\nfrom\
  \ the parent battle object at r5:\n  - oCollisionData_ParentObjectPtr = parent (r5)\n  - oCollisionData_HitModifierBase\
  \ = low byte of r3\n  - oCollisionData_PrimaryElement = element low nibble\n  - oCollisionData_SecondaryElement\
  \ = element high nibble\n  - oCollisionData_AllianceAndDirectionFlip copied from parent\n  - oCollisionData_PanelXY\
  \ copied from parent\n  - oCollisionData_Region forced to 1\n  - oCollisionData_StaminaDamageCounterDisabler =\
  \ low byte of parent's 16-bit field\n  - oCollisionData_SelfDamage = parent's Damage\nThen calls object_getTableEntry_801A0BA\
  \ twice (alliance from r5 vs. r1 self-table idx, then\nr2 target-table idx) to populate oCollisionData_SelfCollisionTypeFlags\
  \ and\noCollisionData_TargetCollisionTypeFlags. If battle_isTimeStop returns nonzero, ORs bit 16\n(0x10000) into\
  \ SelfCollisionTypeFlags. Finishes by invoking sub_8019F44(collPtr, target.r1, parent).\nr10 input is ignored\
  \ inside this function.\n"
