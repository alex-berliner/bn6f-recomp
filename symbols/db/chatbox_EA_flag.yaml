name: chatbox_EA_flag
address: '0x08041160'
kind: function
status: confirmed
summary: 'Dispatcher for chatbox command 0xEA: selects an event-flag/entry-advance handler by index and executes
  it, returning success (r0=1).'
interface: 'void chatbox_EA_flag() /* in: r4 = ptr to chatbox command struct; out: r0 = 1, nz set from r0, all regs
  clobbered except r5 preserved */'
details: Reads byte 1 of the command struct at r4 as a handler index (0–10), multiplies by 4 to offset into the
  jump table at off_8041184, and branches there via bx. Bytes 2 and 3 are assembled into a 16-bit event flag value
  (low byte in r1, high byte shifted into r0). Before the indirect call, r5 is pushed/popped so the callee's clobbers
  do not destroy it. After the handler returns, r0 is forced to 1 (command-success signal) and the function returns.
  The jump table targets include chatbox_setEventFlagAndAdvanceEventCursor_80411B0, chatbox_ClearEntryWaitFlagAndAdvanceEntry_80411BC,
  chatbox_cmdSetEventFlag_8041218, and six other unnamed handlers. Entry 5 is a NULL placeholder (unreachable in
  practice). The table uses thumb-mode addresses (+1). Pad bytes 0,0 align the table pointer literal off_8041180.
