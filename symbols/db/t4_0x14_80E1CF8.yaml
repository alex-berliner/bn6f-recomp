kind: function
status: confirmed
summary: Per-frame battle-object dispatcher that reads CurState and jumps to the matching update/free handler.
interface: void battle_objectTick(BattleObject* r5);  // state passed in r0 to callee, all other regs pass through
details: "Pushes lr, then indexes a 3-entry jump table (off_80E1D0C) by the byte\nat r5+oBattleObject_CurState (offset\
  \ 0x08) and bx's into the selected\nhandler. The three known states are:\n  0 -> sub_80E1D18          (running\
  \ anim/state update)\n  4 -> battle_objectFlyAnimUpdateAndDestroy_80E1D54\n  8 -> battle_objectFreeWrapper_80E1D72\
  \  (teardown)\nThe pop {pc} epilogue matches the push {lr}; no registers are preserved.\nr0 is loaded with the\
  \ state index and r1 with the resolved handler\npointer (matching the bx r1 convention) before the tail call,\
  \ but the\ncallee's actual contract depends on which handler runs. Clobbers\neverything except r5/r8-r12 (callers\
  \ must save those).\n"
