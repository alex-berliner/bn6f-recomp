name: ai_attackDashToTarget
address: '0x080F5BA4'
kind: function
status: probable
summary: 'AI attack step: asks the alliance''s panel-choose callback for a panel adjacent toward the target,
  reserves it, and plays a dash/tackle animation while sliding is blocked.'
interface: (r5 = battle object ptr, r7 = AI attack vars) -> r0 = ?; sets object FuturePanelX/Y, anim,
  flags and attack-vars state
details: If object_canMove says the object is free, it indexes byte_80F5BF0 by Alliance*8 to fetch a two-word
  entry (a panel-choosing callback pointer per alliance) and calls it via mov lr,pc/bx with r0 = target
  object pointer and r1 = the callback stored in oAIAttackVars_PanelChooseCallback. The callback returns
  a panel position (x in r0, y in r1); a nonzero r0 means a panel was found, so the routine stores them
  into oBattleObject_FuturePanelX/Y, claims the panel with object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE
  via object_setFlag1, switches the object's CurAnim to 4, and sets oAIAttackVars_StepTimer=3 and HitElement=4
  to continue the attack. If the object can't move or the callback fails, it clears oAIAttackVars_HasMoved
  and exits the attack state via object_exitAttackState.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_80F5BE0: whole body gated on the object being free to act; ldr
    r1,[r7,#oAIAttackVars_PanelChooseCallback] + mov lr,pc; bx r1: invokes an alliance-indexed panel-selection
    callback (off_80F5BEC -> byte_80F5BF0); strb r0,[r5,#oBattleObject_FuturePanelX] / strb r1,...FuturePanelY
    followed by bl object_reservePanel: claims the chosen panel for this object; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE;
    bl object_setFlag1 and CurAnim=4: marks a committed, non-sliding move animation; failure path strb
    r0,[r7,#oAIAttackVars_HasMoved] + bl object_exitAttackState: aborts the attack step when no move is
    possible'
