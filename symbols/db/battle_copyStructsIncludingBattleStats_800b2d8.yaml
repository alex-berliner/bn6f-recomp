name: battle_copyStructsIncludingBattleStats_800b2d8
address: '0x0800B2D8'
kind: function
status: confirmed
summary: Propagates the working navi-stats buffer into the four battle navi slots (and a secondary buffer when battle-effect
  bit 3 is set), then snapshots RNG seed, four 0x28-byte auxiliary arrays, a counter, and three paired dwords into
  the battle-result/availability structures.
interface: 'void battle_propagateNaviStatsAndBattleData_800b2d8(void);

  // no explicit inputs/outputs beyond memory; uses r10/lr of caller as scratch; nzcv clobbered

  '
details: "- Always copies the working navi-stats struct at eBattleNaviStats203F4AC into four navi-stat destinations\
  \ of size oNaviStats_Size (slots corresponding to eBattleNaviStats0, eBattleNaviStats203CB10, eBattleNaviStats2034A60,\
  \ eBattleNaviStats203C9E4).\n- If GetBattleEffects()'s bit 0x8 is set, additionally propagates the secondary navi-stats\
  \ source at byte_203F5AC into the corresponding four slots (eBattleNaviStats0/203CB10/2034A60/203C9E4).\n- Snapshots\
  \ a u32 RNG seed from byte_203F4A4 into ePrimaryRngSeed.\n- Copies four 0x28-byte auxiliary arrays from the working\
  \ set (byte_203F510, byte_203F610, byte_203F538, byte_203F638) into the persistent battle-area mirrors (byte_203EB00,\
  \ byte_203EB28, unk_2036790, unk_20367B8).\n- Copies one counter dword (dword_203F568 -> byte_203CA50).\n- Calls\
  \ util_nandByteArray40_80AAB88 on three 40-byte arrays: byte_203F56C, byte_203F66C, unk_2036750, producing the\
  \ complement into one of them (NAND semantics).\n- Writes three pairs of u32s into battle-result record slots:\n\
  \    * dword_203CDF0 / +4  <- byte_203F594 / byte_203F694\n    * dword_203CFA0 / +4  <- dword_203F560 / dword_203F660\n\
  \    * dword_203F7E0 / +4  <- dword_203F564 / byte_203F664\n- The body's comment notes the final LDR pool reads\
  \ leave R2 at the address of dword_203F7E0 for the caller; this is the only register output of substance (r2 =\
  \ &dword_203F7E0).\n- Preserves r4-r7 per the contract; clobbers r0-r3 and lr; condition flags modified.\n"
