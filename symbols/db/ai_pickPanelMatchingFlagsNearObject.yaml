  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-230610'
open_questions:
- What r5 points to and what byte 0x16 means (it selects the 1 vs 6 first argument, but r5 is caller-established
  and no caller is known)
- Whether the 1/6 first argument is a panel-type flag value or a column index — this decides whether the
  result is (type,row) or (X,Y)
- Which behavior the 0xA000 object flag selects (it forces the column-search-only path)
- Any caller, which would pin down the argument structures and the exact return convention
