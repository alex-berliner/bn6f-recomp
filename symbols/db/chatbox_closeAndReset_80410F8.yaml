name: chatbox_closeAndReset_80410F8
address: '0x080410F8'
kind: function
status: confirmed
summary: Clears a chatbox's "window open" and "text finished" flags, resets its open state to fully closed (3),
  and returns 1.
interface: 'int chatbox_closeAndReset(Chatbox* r5) // inputs: r1, r5, lr; outputs: r0 = 1, NZ from r0, r1 preserved;
  C/V untouched'
details: 'Takes a chatbox object in r5 (caller-allocated, since r5 is callee-save normally preserved by

  callers'' convention here). Calls chatbox_clearFlags_3e with mask 0x101, which per the flag

  layout combines bit 0 ("text finished/done printing") and bit 8 ("window open") — i.e. the

  box is marked not-open and any pending text state is dropped. Then stores 3 into the

  chatbox''s OpenState field at offset oChatbox_OpenState_10; state 3 corresponds to the box

  being fully closed in the open/close animation state machine. Always returns 1 in r0; NZ

  flags are set from that 1 (so callers branching on the result see "nonzero/true"). r1 and

  the carry/overflow flags pass through untouched. Likely used when dismissing a message or

  force-closing the chatbox without playing through the normal close sequence.

  '
