name: battle_cycleEntryGroupIndex
address: '0x081266E0'
kind: function
status: probable
summary: Cycles a per-entry counter through the group of entries sharing the current entry's code in the
  battle-menu list, playing the cursor-move sound when it advances.
interface: (r5 = battle-menu work struct; r5+0x3C and r5+0x40 combine to an entry index) -> r0 = destroyed;
  updates byte at dword_201FC20[idx*4+3]
details: Computes idx = h[r5+0x40] + h[r5+0x3C] and indexes the 4-byte-stride array dword_201FC20. It
  reads the entry's group code (byte at idx*4), and if the byte at idx*4+2 is nonzero it does nothing.
  Otherwise it takes the counter at idx*4+3, increments it, and wraps it against byte_8124B1C[position],
  where position is found by scanning the halfword table byte_8124AA4 for the entry halfword equal to
  code+0x100 (scan limit 29 entries / 0x3A bytes). The new counter is stored back at idx*4+3, and if it
  changed the cursor-move sound effect (SOUND_CUR_MOVE_80) is played. The 0x100 offset on the table values
  suggests text/character-style codes, so the groups are likely entries whose names or codes share the
  same leading value.
