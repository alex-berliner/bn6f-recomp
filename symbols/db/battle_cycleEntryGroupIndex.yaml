- method: assembly-reading
  date: '2026-10-19'
  detail: idx from h[r5+0x40]+h[r5+0x3C] scaled by 4 indexes dword_201FC20 (sub_81266E0 first lines);
    counter at idx*4+3 is incremented, then wrapped with cmp r7,r3 / mov r7,#0 against byte_8124B1C[scan
    index]; byte_8124AA4 halfwords are compared as halfword-0x100 == code, scan bounded by cmp r3,#0x3A;
    byte at idx*4+2 nonzero causes early exit to loc_8126736 without updating; caller battle_input_tick_8125784
    is the battle-menu input dispatcher and PlaySoundEffect(SOUND_CUR_MOVE_80) plays the cursor sound
