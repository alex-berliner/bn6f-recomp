name: resetPetNaviSetup_8033FDC
address: '0x08033FDC'
kind: function
status: confirmed
summary: Fully resets the player's PET Navi setup — heals HP, reloads stat boosts, clears "active"/session
  event flags, zeroes navi stats/mood/BeastOut counter, and re-syncs beast & story flag groups based on
  EVENT_224 and EVENT_1008
interface: void sub_8033FDC(void) /* reads toolkit ptr from r10, no other inputs; clobbers nz */
details: "Performs a broad reset of the PET Navi state. Sequence:\n  1. reloadCurNaviStatBoosts_813c3ac\
  \ — refresh stat-boost cache.\n  2. Clears flags EVENT_PET_NAVI_ACTIVE, EVENT_1703, EVENT_127, EVENT_1721\
  \ (PET Navi \"active\" group).\n  3. Calls sub_809F9DC, then SetCurNaviHPToFull to heal the Navi.\n\
  \  4. Sets EVENT_1724; clears EVENT_5DF; sets EVENT_68E; clears EVENT_68F; sets EVENT_740; clears EVENT_225\
  \ (Navi-side toggle group).\n  5. Branches on EVENT_224: if set, SetEventFlagRange at EVENT_18E (9 bytes);\
  \ else ClearEventFlagRange at EVENT_12A (0xA bytes) AND EVENT_18E (9 bytes). Used to seed beast-flag\
  \ progression.\n  6. SetBeastOutCounterTo3, ZeroAllNaviStatsMood, sub_800A908 (counter + stats/mood\
  \ wipe).\n  7. Clears EVENT_1700.\n  8. Loads toolkit->S2001c04 pointer and zeroes halfwords at +0x12\
  \ and +0x14.\n  9. Calls sub_8001172(0) — generic reset hook.\n  10. Sets EVENT_79 (\"navi initialized\"\
  ), clears EVENT_1006, EVENT_1009, EVENT_100A, EVENT_101C.\n  11. Flag-range housekeeping: EVENT_1BC\
  \ range cleared (0xC bytes), EVENT_1C8 cleared (6), EVENT_1CE set (6).\n  12. If EVENT_1008 is set:\
  \ also set EVENT_101C, swap 1C8/1CE (set 1C8, clear 1CE) — branch control for which storyline/variant\
  \ the reset aligns with.\nTouches toolkit struct field oToolkit_S2001c04_Ptr (S2001c04 sub-struct, halfwords\
  \ at +0x12 and +0x14).\n"
