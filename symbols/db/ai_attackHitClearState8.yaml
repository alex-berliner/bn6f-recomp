name: ai_attackHitClearState8
address: '0x080D9284'
kind: function
status: probable
summary: Clears the flag pointed to by an AI attacker object's +0x60 pointer and sets its +8 state/timer
  field to 8, used when an AI attack resolves.
interface: (r0 = battle object/AI attacker struct, may be NULL) -> r0 = unchanged; no flags used (returns
  via pop {pc})
details: Null-guards r0 and does nothing if it is zero. Otherwise loads the pointer at [obj+0x60] and
  stores 0 into the word it references, then stores the constant 8 into [obj+8]. The +0x60 target is likely
  a hit-active flag or attack counter owned by the attack, and +8 looks like an attack-state or timer
  field; all six known callers sit inside AI attack code (including ai_attackUpdateHitDispatch, which
  calls it on the hit path), consistent with resetting the attack's active-hit marker and advancing the
  attacker to state 8 when a hit is dispatched. No other registers or memory are touched.
