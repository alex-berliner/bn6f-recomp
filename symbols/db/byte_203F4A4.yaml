name: byte_203F4A4
address: '0x0203F4A4'
kind: ram
previous_names: []
status: confirmed
summary: 'Payload of the received (loopback) battle link packet: the battle seed the primary RNG is restored from
  at battle phase 8; later the 12-byte battle result record (reward word at +8, 0x0203F4AC).'
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: dword_203F4A0 is the received packet's marker word, this its payload. sub_800B444 copies 12 bytes from
    here to unk_2035260 (the result record setupNaviDisplay_802C34E reads); transferBattleHandNaviStats_800B3D8
    copies 0x50 bytes from here when the first byte is not 0xFF.
  reproduce: grep -n -A12 '^sub_800B444:' bn6f/asm/asm00_1.s
  result: CopyWords(0xC) from byte_203F4A4 to unk_2035260 and from byte_203F5A4 to unk_203526C, then battle_syncEffectSlotBetweenBuffers_802C9EA
    (asm00_1.s:18668-18680).
- method: runtime
  date: '2026-10-13'
  detail: 'Primary-RNG fixes in a battle intro hold only when this word is written as well: the primary is restored
    from it at phase 8. The reward on its way to the result screen was read at 0x0203F4AC (+8) and its copy at dword_2035268
    (vidsync: a RAM fix is kept only when the sync then follows the video for hundreds of frames; writes land at
    main_awaitFrame''s entry, the end of a game frame).'
  reproduce: grep -n 'SEEDS' tools/vidsync/segments.py; grep -n 'def check_reward' tools/vidsync/autosync.py
  result: SEEDS = (rf.PRIMARY, syms.BATTLE_SEED_COPY_LINK, syms.BATTLE_SEED_COPY) at segments.py:42, compared after
    every segment junction (lines 109 and 140); check_reward at autosync.py:873.
- method: runtime
  date: '2026-10-13'
  detail: 'The loopback timing: the seed written at battle phase 4 (dword_203CBE4) arrives here about 61-62 frames
    later, one word per frame, highest index first - the window an RNG fix in a battle intro has to cover.'
  refs:
  - bn6f/asm/asm01.s
  reproduce: awk 'index($0,"sub_801FF18:")==1{f=1} f{print} f&&/thumb_func_end/{exit}' bn6f/asm/asm01.s | grep -nE
    'store|dword_203F4A0|str r1'; awk 'index($0,"sub_801FFD6:")==1{f=1} f{print} f&&/thumb_func_end/{exit}' bn6f/asm/asm01.s
    | grep -nE 'store 3|dword_203CBE0'
  result: sub_801FF18 loads dword_203F4A0 and, under the "transfer buffer store" comments, writes one slot's word
    per call at [r7,r0] (idx-scaled); sub_801FFD6's store 3 drains dword_203CBE0 with the index counting down one
    per call (sub r0,#1 before the store) - highest index first. The 61-62-frame arrival is the vidsync runtime
    observation.
