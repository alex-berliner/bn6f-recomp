summary: 'Payload of the received (loopback) battle link packet: the battle seed the primary RNG is restored from
  at battle phase 8; later the 12-byte battle result record (reward word at +8, 0x0203F4AC).'
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: dword_203F4A0 is the received packet's marker word, this its payload. sub_800B444 copies 12 bytes from
    here to unk_2035260 (the result record setupNaviDisplay_802C34E reads); transferBattleHandNaviStats_800B3D8
    copies 0x50 bytes from here when the first byte is not 0xFF.
  reproduce: grep -n -A12 '^sub_800B444:' bn6f/asm/asm00_1.s
- method: runtime
  date: '2026-10-13'
  detail: 'Primary-RNG fixes in a battle intro hold only when this word is written as well: the primary is restored
    from it at phase 8. The reward on its way to the result screen was read at 0x0203F4AC (+8) and its copy at dword_2035268
    (vidsync: a RAM fix is kept only when the sync then follows the video for hundreds of frames; writes land at
    main_awaitFrame''s entry, the end of a game frame).'
  reproduce: grep -n 'SEEDS' tools/vidsync/segments.py; grep -n 'def check_reward' tools/vidsync/autosync.py
