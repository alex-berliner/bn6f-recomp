name: owMapObject_weatherTornado_saveState_80A9218
address: '0x080A9218'
kind: function
status: confirmed
summary: Persist a weather-tornado overworld object's runtime fields into the per-slot save buffer.
interface: owMapObject_saveTornadoState(u32 *map_obj /*r5*/, u8 *save_buf /*r6*/) -> u32 r2 = slot*2
details: Reads slot index from map_obj+4, then copies five byte fields from map_obj offsets 9, 5, 0x24, 0x25, 0x28
  into save_buf at base offsets 0x28, 0x31, 0x37, 0x3A, 0x3D (each offset + slot). Two 32-bit fields at map_obj+0xC
  and map_obj+0x10 have their upper halfword extracted via arithmetic shift right 16 and stored as u16 at save_buf+0x40
  and save_buf+0x46 (offset + slot*2). The halfword-stride value slot*2 is left in r2 as an incidental output from
  the addressing computation and is read back by some callers.
