summary: Installs the default timing constants (30, 30, 30, 30) used by Colonel's panel-targeting attack.
interface: () -> r0 = undefined (return of sub_800FE28); no flags guaranteed
details: 'The function is a tiny wrapper: it loads r0 with the address of dword_81014BC, whose four bytes
  are each 0x1E (30 frames), and tail-calls sub_800FE28 with that pointer, so sub_800FE28 evidently copies
  or applies a small parameter/timer block pointed to by r0 into some AI state. It is only called from
  ai_colonelInitPanelAttack right after the oAIAttackVars block is reset, target/attack id are stored,
  and the object enters attack state 0xA, which fits four phase delays of 30 frames for the panel attack.
  The values are hardcoded, so this variant is difficulty-independent. The actual destination of the copy
  is inside sub_800FE28, which is not shown here.'
