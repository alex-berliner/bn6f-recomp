name: battle_spawnObject5FAtPanel_80D04DA
address: '0x080D04DA'
kind: function
status: confirmed
summary: Spawns a battle object of spawner kind 0x5F at a given panel/element and copies the parent's
  alliance/direction fields into it.
interface: (u32 panelX r0, u32 panelY r1, u32 element r2, u32 spawnArg3 r3, u32 spawnArg4 r4, BattleObject*
  parent r5) -> u32 r1 (0x10 on success, original panelX on spawn failure), BattleObject* parent r5
details: 'Battle-side spawner helper. It stacks r0/r1/r2/r5 around the call to object_spawnType3 and invokes
  it with r0 = 0x5F (the object kind constant), passing panelY/element/spawnArg3/spawnArg4 through as
  the spawner''s r1-r4; the parent pointer in r5 is preserved around the call and handed back to the caller.
  The spawner returns the new object in r5 and a damage-related word in r6. On success (object pointer
  non-null) the function writes to the new BattleObject: PanelX (byte, arg r0), PanelY (byte, arg r1),
  Element (byte, arg r2), DamageAndStaminaDamageCounterDisabler (word, from the spawner''s r6), and copies
  the parent''s AllianceAndDirectionFlip halfword into the child, giving the spawned object the parent''s
  side/direction. Finally it ORs flag bit 0x10 into the new object''s oObjectHeader_Flags byte (an init/just-spawned
  flag). Quirk: on the success path r1 ends up holding the 0x10 used for the flag OR (the mov is the last
  value live in r1), while on the failure path r1 holds the original panelX argument that was stacked
  around the spawner call; callers presumably ignore r1 in both cases. Nothing is written if the spawn
  fails.

  '
