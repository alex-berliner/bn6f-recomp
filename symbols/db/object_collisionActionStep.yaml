name: object_collisionActionStep
address: '0x080C32B6'
kind: function
status: probable
summary: 'Per-frame collision update for a battle object: tears down its collision data, runs a state-specific
  handler chosen by CurAction, then refreshes/re-presents the collision data.'
interface: (r0 = battle object ptr on entry, consumed by removeCollisionData) -> r0 = result of the dispatched
  CurAction handler passed on to presentCollisionData; r5 must hold the same battle object (CurAction
  read from [r5,#oBattleObject_CurAction])
details: 'This is a small wrapper around the object collision subsystem: it first calls object_removeCollisionData
  to tear down the object''s current collision state, then loads the object''s CurAction byte and uses
  a two-entry dispatch table at off_80C32D0 (indexed by CurAction: 0 -> sub_80C32D8, 1 -> sub_80C3322)
  called via the classic ''mov lr, pc; bx r1'' ARM-interwork trampoline, then calls object_presentCollisionData
  to re-establish/refresh collision for the frame. So the object''s collision behaviour is torn down,
  mutated by an action-specific routine, and rebuilt — the two handlers likely set up different collision
  shapes/flags per action state. r5 holding the object pointer is a quirk carried over from the caller
  sub_80C323C. The exact meaning of CurAction values 0 and 1 depends on the two handler bodies, which
  are not shown.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_removeCollisionData first line: collision data is torn down before the state handler
    runs; ldrb r0,[r5,#oBattleObject_CurAction] + ldr r1,[r1,r0] + bx r1: dispatch table indexed by the
    object''s CurAction; off_80C32D0 holds exactly two thumb entries (sub_80C32D8+1, sub_80C3322+1), so
    CurAction has two relevant states here; bl object_presentCollisionData after the dispatch: collision
    data is rebuilt/refreshed once the handler is done; callee summaries: removeCollisionData tears down
    collision data, presentCollisionData refreshes it for the current frame while present in a collision'
