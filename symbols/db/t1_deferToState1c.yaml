name: t1_deferToState1c
address: '0x08039F6A'
kind: function
status: probable
summary: Requests main-loop jumptable state 0x1C, deferring the call of sub_8039570 as that state's argument/callback.
interface: (no arguments) -> r0 = status from t1_setMainState1cWithArg; clobbers r4-r7 per ABI
details: 'This is a two-instruction wrapper: it loads the thumb pointer to sub_8039570 and immediately
  calls t1_setMainState1cWithArg, which zeroes the 8-byte state block for main-loop jumptable entry 0x1C
  and stores the pointer as that state''s argument. So the function''s whole purpose is to switch the
  main-loop state machine to state 0x1C while handing it sub_8039570 (presumably to be invoked or processed
  by that state later). It preserves nothing else and takes no inputs, so its meaning is entirely defined
  by what state 0x1C does with the pointer and what sub_8039570 is. No callers are known, so the triggering
  context is unobserved.'
