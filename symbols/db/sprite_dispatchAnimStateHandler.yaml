  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112'
open_questions:
- no callers known, so the exact struct at r5 and when this runs are unconfirmed
- whether [r5,#8] holds 0/4/8 directly or 0..2 (which would misalign the table) needs a caller or the
  other two handlers' code
- arguments the handlers expect (beyond r0/r1) unknown
