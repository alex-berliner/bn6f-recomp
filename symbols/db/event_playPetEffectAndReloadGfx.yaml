name: event_playPetEffectAndReloadGfx
address: '0x0809A260'
kind: function
status: probable
summary: Event-script routine that plays PET effect 1, reloads the map's graphics into VRAM, and clears
  the scenario/event flags to finish a scene
interface: () -> r0 = 0; flags not meaningful
details: 'The function takes no arguments and immediately triggers PET effect 1 via doPETEffect_8033fc0,
  then restores graphics: copyMemory_8001850 loads a 0x800-byte tile block to VRAM 0x600D400 plus a 32-byte
  block to IWRAM 0x3001B40, and gfxTransfer_8033978 re-queues the sprites/font tiles for the current map
  group. It then resets the scenario-effect machinery (scenario_initEffectState_8003962, zeroFill, scenario_ClearEffectActiveFlag_800399A
  clearing bit 7 of 0x2000780) and acks the event''s fresh flag by clearing bit 7 of the byte at eStruct2001010.
  This combination — effect + graphics reload + clearing ''effect active'' and ''new event'' flags — reads
  as the tail of a scripted scene or transition (e.g. a PET animation during a map/event change) that
  cleans up event state when it ends. The trailing data at byte_809A2AC and the small lookup sub_809A284
  (maps a 16-bit GameState value from the game-state block''s bytes 4-5 to a byte in a 6-entry table)
  belong to the next function, not this one.'
