name: CutsceneCmd_run_text_script
address: '0x08037A42'
kind: function
status: confirmed
summary: Map cutscene interpreter command that runs a text script from the cutscene's text archive in the chatbox.
interface: '(r5: CutsceneState*, r7: cursor into command stream, r10: map script base, lr) -> r0 = 1 (continue cutscene);
  clobbers r1-r4, r6, flags'
details: "Handler for the \"run text script\" opcode of the map cutscene/script interpreter.\nr5 points at the cutscene\
  \ state (oCutsceneState_TextArchivePtr holds the TextScriptArchive\nto pull the script from), r7 is the cursor\
  \ into the command stream, and r10 is the map\nscript base used by the ReadMapScriptByte helper (which returns\
  \ its byte in r4 and takes\na byte count in r6).\n\nCommand encoding:\n  <opcode> <slot>        -> script index\
  \ is the byte at r5+slot (a field of the cutscene state)\n  <opcode> 0xFF <lo hi>  -> script index given inline\
  \ as a 16-bit little-endian value\n\nIn both cases it loads the archive pointer from the cutscene state and calls\n\
  chatbox_runScript(archive, script_idx) to display the script in the chatbox, then advances\nthe r7 cursor by 2\
  \ or 3 bytes respectively and returns r0 = 1 so the interpreter keeps\nrunning the cutscene. The 0xFF form is\
  \ needed because the slot addressing is limited to\noffsets within the cutscene state struct (u8 offset).\n"
