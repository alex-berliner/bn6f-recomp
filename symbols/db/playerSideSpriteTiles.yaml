name: playerSideSpriteTiles
address: '0x086E98CC'
kind: data
status: probable
summary: 'Proposed name: playerSideSpriteTiles. ROM tile graphic (2 tiles, 2 frames) for the player-side
  battle entity sprite, indexed by entity flag bit 0 (table of u32 tile rows)'
details: The label is a small ROM table holding raw 4bpp tile data (32 8-byte rows = 128 bytes = 2 4bpp
  tiles x 2 frames). battle_drawPlayerSideSpriteSet reads the entity's field at offset 0x36, ANDs it with
  1 to pick a side (0 or 1), multiplies by 0x40, and adds that to the table base. The resulting pointer
  is queued via QueueEightWordAlignedGFXTransfer to OBJ VRAM at 0x6017900. The table is the player-side
  (MegaMan) sprite tile source.
