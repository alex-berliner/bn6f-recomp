name: writeCurPETNaviToS2001c04_Unk07_80010c6
address: '0x080010C6'
kind: function
status: confirmed
summary: Writes the currently selected PET navi ID (from GetCurPETNavi) into byte +7 of the toolkit's S2001c04 struct.
interface: 'void pet_writeCurNaviIdToS2001c04(r10 toolkitPtr); // in: r10 = toolkit pointer; out: r0 = navi ID (passthrough),
  r3 = S2001c04 pointer; clobbers lr'
details: Calls GetCurPETNavi to fetch the current PET navi ID as a byte, then loads the toolkit's S2001c04 struct
  pointer from r10+oToolkit_S2001c04_Ptr and stores the ID into the struct's Unk_07 byte (offset +7). R3 ends up
  holding the S2001c04 pointer and r0 the navi ID when returning, which callers appear to see but likely ignore;
  the name Unk_07 suggests the field's game meaning within S2001c04 is not yet pinned down beyond holding the navi
  ID.
