open_questions:
- What the dword_81331FC table actually indexes (chip IDs? element flags? status IDs?) — would settle by reading
  the table contents.
- Whether the offset into the r5 struct (r3 argument) is always 0x12/0x13 or could also be other related-object
  slots; no captured call uses anything else.
- What flag 0x40000000 vs 0x10000000 selects at sub_811FAF4 — that callee is still unnamed and the flag's meaning
  isn't visible here.
