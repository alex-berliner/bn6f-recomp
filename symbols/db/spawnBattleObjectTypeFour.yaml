name: spawnBattleObjectTypeFour
address: '0x080033E4'
kind: function
status: probable
summary: Spawns a battle object of pool type 4 from a five-word parameter record and runs its initializer.
interface: '(r0-r4 = five-word spawn record: type fields/position/params copied to stack) -> r0 = BattleObject
  pointer or NULL; flags untouched by caller contract'
details: Copies the five argument registers onto the stack to form a spawn record, then calls SpawnBattleObjectCommon
  with obj_type = 4, which allocates from the per-type pool and initializes the object header from the
  stack record. If allocation succeeds (r0 != NULL after tst/beq), it calls sub_8003440, which by position
  (right after the spawn helpers) is the type-4 object's constructor/initializer that consumes the record.
  On pool exhaustion it returns NULL and skips the initializer. The five-word record layout (likely x/y
  position and behavior params) is not decoded from this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'stmia r7!, {r0-r4} packs the five args into the stack record passed to the spawner; mov r0,
    #4 before bl SpawnBattleObjectCommon fixes the pool type; tst r5, r5 / beq skips the initializer call
    on NULL allocation; bl sub_8003440 runs immediately after a successful spawn, matching a constructor
    slot'
