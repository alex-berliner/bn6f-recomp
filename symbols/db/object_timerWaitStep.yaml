name: object_timerWaitStep
address: '0x080D141A'
kind: function
status: probable
summary: Battle-object state-machine step that counts down the object's timer and, on expiry, advances
  it to action 4 with a fresh phase.
interface: (r5 = battle object) -> r0 = 0/1 clobbered; flags from the final sub/strh sequence (bne uses
  timer decrement)
details: Each call decrements oBattleObject_Timer on the battle object in r5 and returns immediately while
  it is nonzero. When the timer reaches zero it writes 4 into oBattleObject_CurAction and clears oBattleObject_CurPhaseAndPhaseInitialized,
  so the object's AI state machine proceeds to action 4 on the next update with phases reset. This is
  the standard 'wait N frames then move to next action' handler pattern; r0 is used as scratch throughout
  and the function always returns via mov pc, lr.
