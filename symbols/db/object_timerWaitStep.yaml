  detail: 'ldrh/sub/strh on oBattleObject_Timer is a per-frame countdown (asm lines 1-3); bne locret keeps
    the object waiting until the timer hits zero; strb #4 to oBattleObject_CurAction selects the next
    action once the wait ends; strh #0 to oBattleObject_CurPhaseAndPhaseInitialized resets phase state
    for the new action; route: battlesweep — runs during battle object updates'
