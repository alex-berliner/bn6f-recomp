name: object_waitThenSetAnim
address: '0x080A7EA4'
kind: function
status: probable
summary: Object tick that counts down a delay, then switches the object's sprite to a stored animation
  and marks the object state as 8.
interface: () -> void; r5 = object (timer at +0x24, state byte at +9), r7 = struct whose +3 holds the
  animation index; no return value
details: Decrements the 32-bit frame timer at object+0x24 and returns early while it is still positive.
  On expiry (bgt not taken), it reads the animation index from [r7+3] and calls sprite_setAnimation to
  write it into the sprite slot's current-animation byte, then calls sprite_loadAnimationData to load
  that animation's frames. Finally it stores 8 into object+0x09, presumably a state/'animation started'
  flag consumed by the caller's step logic. Because sprite_loadAnimationData takes no arguments, the function
  relies on r5/r7 (object and sprite resource) already being set up in preserved registers by the enclosing
  routine, so it is only valid inside that context.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub r0,#1 / str [r5,#0x24] / bgt locret: 32-bit frame countdown at object+0x24 gates everything;
    ldrb r0,[r7,#3]; bl sprite_setAnimation: animation index comes from struct field +3; bl sprite_loadAnimationData
    with no args: reloads frames after the anim switch, using preserved registers; mov r0,#8; strb r0,[r5,#9]:
    sets object state byte +9 to 8 after the swap; callees'' known summaries (sprite_setAnimation writes
    slot byte, sprite_loadAnimationData tail-calls anim loader) match the write-then-load sequence'
