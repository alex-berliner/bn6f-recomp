name: battle_aiAttackStepDispatch_81128B2
address: '0x081128B2'
kind: function
status: confirmed
summary: AI attack-state step dispatcher - reads the HitElement byte from the AI attack vars and jumps
  to one of four per-step handlers chosen from a small jump table.
interface: void battle_aiAttackStepDispatch_81128B2(AiWork *r5, AiAttackVars *r7) // lr = return; outputs
  (r0/r1/r5/r8-r12) are whatever the dispatched handler leaves in the guest register file
details: "Trampoline/dispatcher used by the enemy AI while an attack is in progress. Reads the byte at\n\
  oAIAttackVars_HitElement (offset into the struct in r7) and uses it directly as a byte offset\ninto\
  \ the 4-entry jump table at off_81128C4, then does the classic \"mov lr, pc; bx r1\" Thumb\ntail-dispatch\
  \ so the selected handler runs with lr pointing back at this function's pop {pc}.\nEntries (Thumb addresses,\
  \ +1 bit set):\n  0: ai_attackStepTick - per-frame attack step ticker\n  1: ai_attackAnimHitStep - attack\
  \ animation/hit-frame step\n  2: ai_attackPhaseSubStep - attack phase sub-step advance\n  3: genericAI_exitAttackStateAfterDelay_81097BA\
  \ - end the attack state after a delay\nThe selected handler is called with r0 = the HitElement byte\
  \ value, r1 = its own table entry\naddress, r5 = AI work pointer and r7 = AI attack vars pointer unchanged\
  \ from the caller.\nBecause of the lr/pc dispatch, no registers are saved or restored here: the handler's\
  \ results\nin r0/r1/r5/r8-r12 land straight in the caller's register file, which is why the contract\
  \ lists\nthem as outputs of this function. HitElement here is really acting as an attack-step/state\n\
  selector, not a battle element - values outside 0-3 would index past the table (no bounds check).\n"
