summary: Thin Tail-call wrapper that just tail-calls battle_playObjectTripleSound_81176D0; used as a CurState=UPDATE
  phase entrypoint for one battle-object type.
interface: '(r5 = BattleObjectPtr, r10 = ToolkitPtr, lr = return) -> r0 = 0x80000 (set by callee) ; side
  effects: sound registers / SIO per callee, callee-saved r5 preserved'
details: "Three instructions: push {lr}; bl battle_playObjectTripleSound_81176D0; pop {pc}.\n  The push/pop\
  \ {lr}/{pc} is the standard Thumb \"jump-and-link\" trampoline: it preserves lr across the\n  call and\
  \ returns by popping PC, so the function effectively tail-transfers control to the callee with\n  the\
  \ same argument registers it received. There is no work added in this function; it exists to be\n  stored\
  \ as a CurState=UPDATE handler in a battle-object's jump table (the only direct caller\n  sub_81176B0\
  \ installs such a handler before calling it). Captured-call exit r0=0x80000 matches the\n  callee's\
  \ contract (its sound-ID base advances by 0x80000 each of three calls).\n"
