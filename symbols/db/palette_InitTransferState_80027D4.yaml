name: palette_InitTransferState_80027D4
address: '0x080027D4'
kind: function
status: confirmed
summary: Initializes the palette-DMA transfer task state at byte_20098A8, setting entry size 4, entry count 10,
  and a halfword transfer length of 0x2FF.
interface: void sub_80027D4(void)
details: 'Writes three fields of the small transfer-state struct at byte_20098A8: byte_20098A9 = 4 (per-entry size
  / stride), byte_20098A8 = 0xA (entry count), and word_20098AA = 0x2FF (halfword transfer length used by the pending
  palette DMA copy). No registers are read back; the function only primes this state so a later palette-copy routine
  can consume it. It touches nothing else and is a plain tail-call-free return via mov pc, lr.

  '
