name: sprite_loadTilesDuringFadeOrRun
address: '0x080495CE'
kind: function
status: probable
summary: Reloads an 0x800-byte OBJ tile block (and a 32-byte palette) and defers a follow-up callback until the
  screen fade ends, otherwise performs the immediate alternative.
interface: () -> r0 = undefined; calls copyMemory_8001850 then sub_803CB8C(callback=sub_8039570+1) when IsScreenFadeActive,
  else calls sub_803A1B0; no return value used
details: Branches on IsScreenFadeActive (ZF). While fading, it copies 0x800 bytes of graphics to VRAM 0x600D400
  and 32 bytes (16 colors, likely a palette) to IWRAM 0x3001B40, then queues thumb function sub_8039570 via sub_803CB8C
  so it runs after the fade completes. With no fade active it calls sub_803A1B0 instead, presumably the immediate-execution
  counterpart of the queued work. r4-r7 are pushed but unused; no arguments are passed to any callee, so the graphics
  blocks are fixed/hardcoded. The VRAM destination 0x600D400 sits in the OBJ tile area, suggesting a sprite sheet
  swap for a transition.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'beq on IsScreenFadeActive splits the queued path (copyMemory_8001850 + sub_803CB8C) from the immediate
    path (sub_803A1B0); copyMemory_8001850 summary: loads fixed 0x800-byte graphics block to VRAM 0x600D400 and
    32-byte block to IWRAM 0x3001B40; off_80495E8 holds sub_8039570+1, passed to sub_803CB8C, indicating a deferred
    thumb callback registration; no callee receives arguments from r0-r3, so the routine works on fixed, hardcoded
    destinations'
