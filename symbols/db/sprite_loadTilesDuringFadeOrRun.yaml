open_questions:
- Purpose of sub_8039570 (the queued callback) and sub_803A1B0 (the immediate branch) — knowing them would confirm
  what is being swapped in
- Whether 0x600D400 is an OBJ tile slot for a specific sprite sheet and which game state triggers this
- Semantics of sub_803CB8C's queue (run-after-fade vs. run-next-frame)
