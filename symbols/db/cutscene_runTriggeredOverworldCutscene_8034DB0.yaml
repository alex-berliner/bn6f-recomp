name: cutscene_runTriggeredOverworldCutscene_8034DB0
address: '0x08034DB0'
kind: function
previous_names:
- sub_8034DB0
status: probable
summary: Picks and starts one of four cutscene scripts based on the overworld player coord interaction
  value, when not slip-run and not in a cutscene
interface: '() -> r0 = 0 on cutscene-started, 1 on no-op ; side effects: may call IsNotSlipRunningAndNotInCutscene,
  sub_8034E3C, sub_8034E88, and StartCutscene to load eS200AC80+4 as script'
details: "Wrapped in push {r4-r7, lr}; no parameters passed in r0..r3 by callers (captures show\n  r0=1\
  \ on exit, --C-, i.e. on the \"no-op\" return path through loc_8034E22).\n\n  Reads Toolkit(r10) and\
  \ game-state fields via fixed addresses:\n    - eS200AC80+4 (off_8034E28) -> ldrh r0, [r7,#4] (a u16\
  \ cutscene-script id at word_200AC84)\n    - GameState.CoordInteractionValue loaded via r10->oToolkit_GameStatePtr\
  \ +\n      oGameState_CoordInteractionValue, then tst r4, r4 / beq loc_8034E22.\n  If [eS200AC80+4]\
  \ is non-zero it starts cutsceneScript1 (byte_809A8A8) via StartCutscene and returns 0.\n  Otherwise\
  \ it walks three (table_index, value) pairs:\n    - sub_8034E3C with r1 = 0, then sub_8034E88(r1=0);\
  \ both must succeed to start byte_8099EA0\n    - same with r1 = 1 for byte_809AA34\n    - same with\
  \ r1 = 2 for byte_809CAD8\n  Each sub_8034E3C/sub_8034E88 pair returns NZ iff there is a hit; on a complete\
  \ match StartCutscene is\n  called and r0=0 is returned.\n  Returns r0=1 on the \"no cutscene started\"\
  \ fall-through (loc_8034E22).\n  Sole caller is cutscene_8034BB8; uses r10/r9/r11/lr-save, so it is\
  \ a tick of the overworld cutscene\n  scheduler choosing one of three available overworld interaction-script\
  \ variants.\n"
