open_questions:
- Exact semantics of sub_8034E3C/sub_8034E88 (the contract hints they look up the 0xFFFF list and
- a related value, but the role in this "branch on coord interaction" context is guessed). Naming
- the table-id values as "interaction type 0/1/2" for overworld coord events is a hypothesis from
- the r1=0/1/2 repetition, not confirmed.
- Whether eS200AC80+4 being set bypasses the three case dispatch entirely (reading assembly it does
- skip everything else) and exactly what triggers that u16 from being non-zero is unknown.
