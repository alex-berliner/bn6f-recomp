- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r5, off_808FCE0 + ldr r5,[r5]: target struct comes from a global pointer table; bl camera_writeUnk03_80301b2
    with r0=0 initializes/resets camera 0 fields before positioning; ldrb r3,[r5,#0xc]; lsl r3,#1; ldrsh
    [r5,r1=0x40+r3] / 0x46+r3: X and Y read from a halfword table indexed by the +0xC byte; lsl r0/r1,#0x10
    and r2=0x40<<16 before bl SetCameraXYZ: fixed-point X/Y from struct, constant Z=0x40; No other math
    or branches: sole effect is positioning camera 0'
