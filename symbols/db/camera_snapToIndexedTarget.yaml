name: camera_snapToIndexedTarget
address: '0x0808FBC0'
kind: function
status: probable
summary: Snaps the camera to the X/Y position of the entry selected by a mode byte in a global struct,
  with Z fixed at 0x40.
interface: (no args) -> r0 = 0; sets camera 0 position and a byte/word in its struct
details: Loads a struct pointer from the global table at off_808FCE0 (-> off_808F5D4). First calls camera_writeUnk03_80301b2(0,
  ...) which writes byte 3 and word 0x14 into camera 0's struct. It then reads a byte at struct+0xC, doubles
  it (lsl r3,#1) to index a pair of signed halfwords at struct+0x40+2*idx (X) and struct+0x46+2*idx (Y),
  and calls SetCameraXYZ(x<<16, y<<16, 0x40<<16), so Z is always 0x40. Returns 0 in r0. The +0xC byte
  acts as a selector (likely an object/slot index or camera mode) into a per-slot coordinate table.
