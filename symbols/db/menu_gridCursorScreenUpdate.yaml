name: menu_gridCursorScreenUpdate
address: '0x08128800'
kind: function
status: probable
summary: 'Per-frame state handler for a cursor-driven menu screen: handles exit confirmation, horizontal
  cursor movement with a scroll/animation counter, and launching the selected entry''s text script.'
interface: (r0 = unused; r5 = screen/menu state struct, r10 = toolkit) -> void; r0 dead on return
details: The struct (r5) holds a cursor index at 0xD with a backup at 0xE, two coordinate/scroll fields
  at 0x20 and 0x24 backed up to 0x22/0x26, and an animation/page counter at 0x1E. It first snapshots the
  previous values, then if counter 0x1E is nonzero — or event-flag bit 8 (chatbox/cutscene eFlags2009F38)
  is set and B/START held — it exits, using submenu_ConfirmExitAndFade_811FB64 except when the flag forces
  a direct exit. Otherwise it computes a target 2*(field0x24 + field0x20) (or +1 for the inner variant)
  and moves the cursor horizontally via menu_moveCursorLeftRight using low-sensitivity held input; when
  the cursor actually changes it stores it and returns. When the cursor is unchanged, it temporarily halves
  0x1E, runs menu_adjustCursorOrValue_811F7F8, restores 0x1E, and on change recomputes the target (resetting
  the cursor to 0 if it overshot) and refreshes via sub_8128A44/sub_8128AB0; on no change, pressing A
  calls checkTextScriptEnd_8128BF0, which advances the entry's text script and fades out when it ends.
  Every frame it enqueues the affine OBJ (battleObjectAffineEnqueue_8128B4C) and calls sub_8128B98 before
  returning.
