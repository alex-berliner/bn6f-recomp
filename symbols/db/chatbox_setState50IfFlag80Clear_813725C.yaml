name: chatbox_setState50IfFlag80Clear_813725C
address: '0x0813725C'
kind: function
status: confirmed
summary: If chatbox flag 0x80 is not set, writes the state code 0x50 into a caller-supplied object byte.
interface: void sub_813725C(u8* obj /* r5 */); clobbers r0 and NZ flags, preserves r1; no return value
details: 'Calls chatbox_mask_eFlags2009F38 with 0x80 to test one bit of the global chatbox flags word at eFlags2009F38.
  If the flag is clear (mask result 0, so BNE falls through), stores the byte 0x50 at [r5]; if the flag is set,
  the store is skipped and the function returns immediately. r5 holds the address of a byte in the caller''s object/state
  block, and 0x50 looks like a state/phase code for that object rather than a chatbox value. The flag check acts
  as a guard, so the state write only happens while the chatbox condition encoded by bit 0x80 is inactive. Tiny
  leaf-style routine: pushes lr, calls the flag test, pops pc.

  '
