open_questions:
- The exact layout of the lottery record at r5 beyond offsets 5,6,8,0x74,0x78,0x7c,0x80,0x84 (which fields
  are state/dialog-id/timer vs. prize cache). A labelled `oLotteryState` macro would settle it.
- What `EVENT_1725` semantically represents ("lottery already claimed this visit", or a story-progress
  bit). Cross-referencing other 1725 tests in the battle overlay would clarify.
- The meaning of the r1 kind enum {1,2,3,other} returned by `sub_813D41C` (only inferred from the GiveItem
  x2 vs GiveNaviCustPrograms vs GiveChips split); the assembly hints at it but does not name it.
- Whether the "default" branch really is "any chip" or specifically "BattleChips from the result buffer".
  The two halfwords cleared at +5/+6 plus the `decompAndCopyData` table both point at it, but the call
  to `GiveChips` doesn't disambiguate by code.
