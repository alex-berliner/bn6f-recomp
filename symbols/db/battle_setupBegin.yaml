name: battle_setupBegin
address: '0x080499AE'
kind: function
status: probable
summary: 'Battle-start state handler: if the 0x80 cutscene/event flag is clear it resets two state bytes
  and runs a list-reset helper, then always launches the battle module init.'
interface: (r5 = task/state struct) -> r0 = battle module init result; no meaningful flags
details: r5 points to some battle/setup state struct. It first reads bit 0x80 of the chatbox/cutscene
  event flag word eFlags2009F38; if that bit is set, the middle block is skipped entirely. Otherwise it
  stores 0 to byte r5+0x13, calls sub_803C0BE(0x11, 0x90) — the helper that walks a 2-byte-per-entry list
  to its 0xE6 terminator and normalizes trailing free slots to 0xE5 0xE5 pairs, so this likely re-initializes
  a specific text/list buffer identified by (0x11, 0x90) — and finally stores 0x28 into byte r5+1, plausibly
  a next-state or frame counter. In all cases it then tail-calls battle_moduleInit_803A820 to kick off
  battle module setup (registering entries 10/0x26 and 11/0x27 and running the main init).
