open_questions:
- 'What `r5` actually points to: AIData (where offset 0x8 is `BLeftAbility`) or AIState (where offset
  0x8 is `Unk_08`) is unclear from this snippet alone. The byte being used as a 3-valued sub-state index
  argues it is a small state field, not BLeftAbility, so AIState is the better fit but not confirmed.'
- The role of `unk_2011A90` (loaded into r6 but untouched here) and what it carries into the callees.
- Whether index 0 (`sub_80A5AF8`) is the init phase and index 2 (`sub_80A5C6C`) is the cleanup/end phase,
  vs. some other ordering — would settle on reading the three callees.
