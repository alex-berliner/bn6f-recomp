name: sprite_noShadow
address: '0x08002F90'
kind: function
status: confirmed
summary: Sets an object's sprite attribute flags so the sprite renders without a shadow.
interface: void sprite_setNoShadow(ObjectHeader* obj /* r5 */); returns r0 = updated attribute byte, r1 = 1, r3
  = sprite record pointer; NZ set from the attribute byte, CV from the sprite address add
details: 'Takes the object in r5, reads its sprite offset byte (oObjectHeader_SpriteOffset, header +0x02), masks
  it to ~0xF and adds it to the object base, locating the 16-byte-aligned sprite record attached to the object.
  It then reads the attribute byte at sprite +3 (oObjectSprite_Unk_03), ORs in bit 2 (the no-shadow bit), clears
  bit 0, and stores it back. Quirk: the final MOV r1,#1 and the BIC on r0 produce the outgoing flag state, so the
  NZ flags callers see reflect (attrs & ~1) rather than a comparison; r1 is always returned as 1 and r3 as the sprite
  record address, likely incidental to callers.'
