- method: assembly-reading
  date: '2026-10-18'
  detail: beq locret only after 'movflag EVENT_EE / bl TestEventFlagFromImmediate' gates the whole routine
    on a story flag; bl sub_81375F4 with r0=0x48, r1=0x40, r2=0 followed by bl sub_8137618 prepares the
    dialog before the flag test; bl chatbox_mask_eFlags2009F38 with r0=8 checks a dialog-active bit before
    running the script; mov r0,#1 / bl RunTextScriptNaviCustDialog runs a NaviCust text script, then strb
    r0(=0xc),[r5] stores the new state
