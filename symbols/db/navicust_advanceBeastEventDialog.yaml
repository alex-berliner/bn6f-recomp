name: navicust_advanceBeastEventDialog
address: '0x08136F0C'
kind: function
status: probable
summary: If EVENT_EE is set, prepares dialog resources (sub_81375F4/618), and when bit 8 of eFlags2009F38
  is set, clears dialog state, runs NaviCust text script slot 1, and writes 0xC into the caller's state
  byte [r5].
interface: (r5 = pointer to dialog/state byte) -> none; sets [r5] = 0xC when the dialog starts; clobbers
  r0-r3, lr
details: First it tests event flag EVENT_EE; if clear, nothing happens. If set, it calls sub_81375F4(0x48,
  0x40, 0) and sub_8137618, apparently setting up some dialog-side resources, then reads bit 8 of the
  eFlags2009F38 flag word via chatbox_mask_eFlags2009F38. If that bit is set it calls sub_81375D8 (likely
  dialog cleanup/reset), runs text script slot 1 via RunTextScriptNaviCustDialog, and writes 0xC into
  the byte at r5, which is presumably a dialog/state-machine variable for the caller. The early-exit structure
  makes this a poll-style step that advances a NaviCust dialog only when both story and dialog conditions
  hold.
