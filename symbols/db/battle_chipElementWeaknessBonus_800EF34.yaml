open_questions:
- Exact meaning of r7's element IDs (2/6/7/8/9 do not match straight Elem enum) — might be BattleDamageElement
  indices rather than Element enums.
- Whether the first GetBattleNaviStatsByte(0x29) is "is in Hub/Custom" or "is Navi+chip equip state";
  the equality-with-0 then call-sub_800F09E pattern suggests sub_800F09E handles the non-custom path and
  returns the same (r0, r1) tuple, but its internals aren't known.
