name: MapScriptCutsceneCmd_set_enter_map_screen_fade
address: '0x08035D98'
kind: function
status: confirmed
summary: Map script cutscene command that sets the two enter-map screen fade parameters from the script stream and
  advances past the command.
interface: (u32* scriptPos r7, void* toolkit r10, u32 scriptState r0) -> u32 consumed r0; advances r7 by 3; writes
  GameState.EnterMapFadeParam1/2; NZ flags set from r0=1
details: 'Cutscene/map-script opcode handler for "set enter-map screen fade". Loads the

  GameState pointer from Toolkit+oToolkit_GameStatePtr (r10 is the toolkit base),

  then reads the command''s two byte operands via ReadMapScriptByte. For each read,

  r6 is set to the operand index (1 then 2) and r0 carries the script state through

  to the reader; the returned byte in r4 is stored to

  GameState+oGameState_EnterMapFadeParam1 and +oGameState_EnterMapFadeParam2

  respectively. These parameters presumably configure the fade-in effect (color

  and/or duration) used when the game enters a map area. Finally r7 (the script

  cursor) is advanced by 3 to skip the opcode byte plus the two operand bytes, and

  r0 is set to 1 to signal that one script step was consumed. Quirk: the C readable

  form writes the stored byte with R4 (the caller-visible ReadMapScriptByte result),

  so the function relies on ReadMapScriptByte returning its value in r4.

  '
