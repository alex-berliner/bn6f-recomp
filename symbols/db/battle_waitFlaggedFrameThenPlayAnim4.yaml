name: battle_waitFlaggedFrameThenPlayAnim4
address: '0x080C166A'
kind: function
status: probable
summary: 'Battle-object phase: waits until the current animation frame has attribute bit 0x80 set, then
  plays animation 4 for 30 frames before advancing to phase 8.'
interface: (r0/r5 = battle object) -> r0 = sprite_getFrameParameters result (frame attribute byte); updates
  oBattleObject_CurAnim, Timer, PhaseInitialized, CurPhaseAndPhaseInitialized.
details: 'If oBattleObject_PhaseInitialized is nonzero, the object is in its 30-frame wait: Timer is decremented
  each call and at zero the combined CurPhaseAndPhaseInitialized field is set to 8. Otherwise sprite_getFrameParameters
  is called for the object''s current frame and bit 0x80 of the returned attribute byte is tested; if
  clear the call returns immediately and retries next frame. When the bit is set, CurAnim is set to 4,
  Timer to 0x1E (30 frames), and PhaseInitialized to 4, so the wait only starts once the flagged frame
  is reached. This implements a sync point on a specific animation frame followed by a fixed-length animation
  before the object''s next phase.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl sprite_getFrameParameters then tst r0,#0x80 — tests the current frame''s attribute flag;
    strb #4,[r5,oBattleObject_CurAnim] and strh #0x1e,[r5,oBattleObject_Timer] — switches to anim 4 with
    a 30-frame timer; strb #4,[r5,oBattleObject_PhaseInitialized] — latches that the wait phase has started;
    sub r0,#1 / bne — timer countdown loop on subsequent frames; strh #8,[r5,oBattleObject_CurPhaseAndPhaseInitialized]
    — advances the phase state machine when the timer expires'
  refs:
  - bn6f/asm/asm31.s:20836
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x080C166A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No callers known, so which battle objects use this phase and what the flagged frame/anim 4 represent
  in gameplay is unclear
- Exact meaning of attribute bit 0x80 in the sprite frame table (signal frame vs. flash/hit frame) would
  be confirmed by the sprite data or sprite_getFrameParameters documentation
