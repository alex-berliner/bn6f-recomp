name: sub_80EC81E
address: '0x080EC81E'
kind: function
status: confirmed
summary: AI attack-state wind-up timer tick that initialises a 30-frame countdown on first entry and exits the attack
  state once it elapses.
interface: 'void sub_80EC81E(struct BattleObject* r5, struct AIAttackVars* r7); outputs: r1 (clobbered)'
details: 'On first entry when AIAttackVars+Unk_01 is zero, seeds the 16-bit countdown at AIAttackVars+Unk_10 with
  0x1E (30 frames) and marks Unk_01 as 4 (i.e. "wind-up phase active"). Each call decrements that timer; if it was
  >=1 before the decrement (BGE on the pre-decrement value), the routine simply returns. Once the timer underflows,
  it zeroes the BattleObject''s RelatedObject1Ptr (offset oBattleObject_RelatedObject1Ptr), zeroes the AI data''s
  Unk_68 field (offset oAIData_Unk_68) via the AIDataPtr, then calls object_exitAttackState to leave the attack
  state.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
