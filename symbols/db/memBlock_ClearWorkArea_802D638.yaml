summary: Zero-fills the 32-byte work buffer at byte_2000070 (IWRAM), leaving r2/r3 untouched so it can be called
  through a function pointer with context.
interface: 'void memBlock_ClearWorkArea(int passthrough_r2, int passthrough_r3) /* inputs: r2, r3, lr; outputs:
  r2, r3 (unchanged); clobbers r0, r1, lr, NZCV */'
details: 'The entire body is a tail-ish call to ZeroFillByWord with r0 = byte_2000070 (a 0x20-byte IWRAM block labelled
  memBlock) and r1 = 0x20, clearing 32 bytes word-wise. Nothing else is touched, so the buffer''s meaning is defined
  by whoever reads byte_2000070 afterwards. The interesting part is the calling convention implied by the lifter''s
  contract: r2 and r3 are passed in, never read, preserved, and returned unchanged. That strongly suggests this
  function is stored in a table/callback slot whose other entries use r2/r3 as context or state arguments, and this
  stub simply ignores them while keeping the contract. r0/r1 are naturally destroyed because they become ZeroFillByWord''s
  arguments. lr is pushed/popped only to keep the call to ZeroFillByWord intact.'
