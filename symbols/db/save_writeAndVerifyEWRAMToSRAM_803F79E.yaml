summary: Mirrors the 0x10-byte EWRAM work buffer (0x2000000..0x6710) to Game Pak SRAM, verifying the round-trip
  checksum before committing and toggling event flag 0x1704.
interface: (r0..r3 ignored) -> r0 = 1 on successful verify-write-clear, 0 on verify-fail-then-set-flag
  retry
details: "- Walks toolkit->S2001c04 via r10 (lifecycle handed in by the caller).\n- First call to save_BackupToGamePakWithRetry_803FAB4;\
  \ bne loc_803F808 means if the backup\n  succeeded (or returned a value indicating a non-fail), we jump\
  \ to the early-exit that\n  clears event flag 0x1704 via ClearEventFlagFromImmediate and returns r0=1.\n\
  - Otherwise (r4==1), does NOT copy player coords (the tst r4,r4 / bne loc_803F7C2 branch\n  is skipped,\
  \ so the player->GameState sync is bypassed).\n- Then: rollRngSeedIntoExtraToolkitPtrs_8006e26 (RNG\
  \ seed advance), info_copyTimestampToWorkArea_803F8B2\n  (stamp timestamp into S2001c04+0x6C), s2001c04_ComputeChecksumOfEwramRegion_803F894\
  \ (compute new\n  checksum into r0 of the 16 bytes at 0x2006700..0x6710 and store it in the S2001c04\
  \ work area's\n  +0x68 field), then save_CommitWorkBufferToGamePak_803FB04 (which the callee describes\
  \ as\n  \"writes the caller's value into the save work buffer at dword_20067C0 and flushes the 0x80-byte\n\
  \  buffer to the Game Pak save area at 0xE007F80\"). Note: that callee takes r0 as the byte to\n  embed;\
  \ here r0 is the freshly computed checksum, so the *checksum* is being committed to\n  dword_20067C0\
  \ along with the rest of the 0x80-byte save block.\n- encryption_xorBufferWithKey_8006df6 is called\
  \ on 0x2000000 / 0x6710 — the \"decrypt\" the EWRAM\n  work buffer that was written in obfuscated form\
  \ so the SRAM copy below transfers plaintext.\n- The loc_803F7DC loop (up to 3 times): libSave_CopyToGamePak\
  \ copies 0x6710 bytes from 0x2000000\n  to SRAM 0xE000100 (Game Pak save area), then sub_814D9C4 (likely\
  \ a verify/compare against the\n  expected write). r4 holds the per-iteration result; r7 counts 0..2.\
  \ If all 3 attempts report\n  non-zero (suspicious) it falls through to the encryption_save_memSetFlags_8006E0E\
  \ re-encrypt\n  branch and falls back to ClearEventFlagFromImmediate / r0=1 (treats persistent failure\
  \ as\n  \"clear flag, give up\").\n- If a sub_814D9C4 call returns 0, re-encrypt with the obfuscation\
  \ key, then re-read the\n  checksum at S2001c04->+0x68, recompute via s2001c04_ComputeChecksumOfEwramRegion_803F894,\n\
  \  and if equal SetEventFlagFromImmediate flag 0x1704 and return r0=0. The flag 0x1704 toggle\n  thus\
  \ encodes \"this run successfully wrote SRAM and verified\" vs. \"fell back to backup-only\".\n"
