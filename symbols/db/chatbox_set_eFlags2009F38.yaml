name: chatbox_set_eFlags2009F38
address: '0x08045F1C'
kind: function
status: confirmed
summary: ORs the given bits into the eFlags2009F38 event-flag word, leaving the new value in the NZ flags.
interface: void chatbox_set_eFlags2009F38(u32 bits /*r0*/); // sets flags NZ per the resulting word; preserves
  r1, r2
details: Loads the 32-bit flag word at eFlags2009F38, ORs in r0, and stores it back. Uses push {r1,r2}/pop
  {r1,r2} as a scratch-saving trick rather than a real callee-saved contract, so callers' r1/r2 pass through
  untouched. The final value is left in r2 with NZ flags set from it, and the function returns with mov
  pc, lr, meaning the trailing pop flags state (and r2) are observable to callers — the disassembly relies
  on the ORR/flags side effect rather than returning cleanly. Despite the chatbox_ prefix, this touches
  only the shared event/progress flag word at 0x2009F38, likely a "textbox/dialog event done" style flag
  set used by the event system.
