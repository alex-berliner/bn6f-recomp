name: battle_drawBattleBottomBar
address: '0x0803C604'
kind: function
status: probable
summary: 'Per-frame: draws the wireless/connected-player entries row and the chip-slot icons on the battle
  bottom HUD.'
interface: () -> void; clobbers r4-r7, lr
details: Loads the singleton eS200A290 then in order calls rfu_drawConnectedPlayerEntries (renders up
  to four RFU connection lines) and submenu_queueSlotIcons (loads four chip-slot icons into VRAM and queues
  their OAM). All three callers first gate the call on the chip-select screen state (eStruct200BC30_getJumpOffset00==8
  in battle_runCustomScreenFrame / battle_tutorialStepCheckChipSelection; state 0x14/4 in sub_812B80C),
  so it is the per-frame redraw of the custom-screen / chip-selection bottom bar that shows both the wireless
  link strip and the chip submenu slots.
