name: sub_8124588
address: '0x08124588'
kind: function
status: confirmed
summary: Refills a region of background tile block 2, either from a static tile-id table or by letting a helper
  pick the source, depending on a flag byte in the state struct.
interface: void sub_8124588(r5 = background state struct); reads r5+0xE flag; preserves r4-r7, returns with r5 unchanged
details: 'Entry point for redrawing a background area for whatever screen owns the struct passed in r5.

  It always targets tile block 2 (a 32x32-tile background block) with start coordinates j=0xF, i=0xC.

  If the byte at struct+0xE is nonzero, it calls CopyBackgroundTiles with a tile-id table at

  unk_201EBDC and region size 0xB x 6 tiles; if the flag is clear, it makes the same call shape but

  with tileIds = 0 routed through call_sub_3005EBA, which chooses the tile source itself (a

  "default/animated background" variant, likely for empty or standard background tiles).

  The struct at r5 is some per-scene background state; only the +0xE flag byte is touched here.

  No return value; clobbers r0-r3, flags and lr per the ABI of the tail-called helpers.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
