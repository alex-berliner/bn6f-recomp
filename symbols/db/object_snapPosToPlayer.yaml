name: object_snapPosToPlayer
address: '0x0808CC98'
kind: function
status: probable
summary: Copies the overworld player's X/Y position into two position field pairs of the object in r5.
interface: (r0 = unused by callee output, r5 = object pointer) -> r0/r1 = player X/Y (as side effect of
  callee); no meaningful return
details: Calls ReadOWPlayerObjectCoords, which yields the player's X and Y (likely in the high halves
  of r0/r1, since both are asr'd by 16) and a pointer to the player object (unused here). It then stores
  the X halfword to r5+0x1A and r5+0x16 and the Y halfword to r5+0x1C and r5+0x18, i.e. it writes both
  a 'current' and a second (likely target/previous) position pair in the object structure, snapping that
  object onto the player's tile/position. Typically used for objects or followers that track the player
  each frame.
