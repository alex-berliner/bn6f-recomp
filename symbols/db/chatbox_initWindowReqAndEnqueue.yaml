name: chatbox_initWindowReqAndEnqueue
address: '0x08006920'
kind: function
status: probable
summary: Zero-fills unk_20096A0, seeds its task state from a caller descriptor (9 words into +8..+0x2C plus a flag
  byte at +3, plus +4=0 and +0xC=0x20000), prepares the work buffer at unk_2008980 via sub_8006B94(0x500, 0xA0),
  then enqueues a background request via req_enqueueTask(unk_2008980, Window0HorizontalDimensions, 4, 0xA2600000).
interface: (r0 = pointer to an 11-field task descriptor) -> r0 = result of req_enqueueTask; r4-r7 clobbered (saved/restored)
details: The function zero-fills the fixed 0x30-byte control block at unk_20096A0 with ZeroFillByWord, clears the
  halfword at +4 (likely a progress/counter) and stores the constant 2 at +0xC (likely a state/step field). It then
  copies ten words from the caller's descriptor ([r4]..[r4+0x20]) into +8..+0x2C and a byte from [r4+0x24] into
  the flag byte at +3, so unk_20096A0 is a task-state struct seeded from a static descriptor. It calls sub_8006B94
  on unk_2008980 with size 0x500 and value 0xA0 (prepare/fill of the work buffer used by the queued job). Finally
  it calls req_enqueueTask(unk_2008980, Window0HorizontalDimensions, 4, 0xA2600000), which fills the queue control
  block at byte_20081B0 and sets its active flag; 0xA2600000 likely packs the command id and a VRAM-relative destination
  (0x6000000). This is a submit/init wrapper for the polled background-request queue, apparently related to the
  window (text-window) subsystem.
