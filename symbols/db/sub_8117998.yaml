name: sub_8117998
address: '0x08117998'
kind: function
status: hypothesis
summary: 'Computes a byte offset into a 2-byte-entry table: (table[0]-1)*2 plus an index byte at [r5+4], returning
  it in r0.'
interface: int getTableEntryOffsetForObject(u32 tableFromHelper /*r0 out of sub_8047D84*/, u8* obj /*r5, +4 = 1-based
  index*/); // result in r0; r4-r7 preserved
details: 'Thin wrapper that first calls sub_8047D84 to obtain a pointer (kept in r4, the call''s return is also
  used as the table base). It then reads the first byte of that table, treats it as a 1-based entry/row number (hence
  the -1), scales it by 2 (entries are 2 bytes), and adds the byte stored at [r5+4] of the caller-supplied object.
  The sum is returned in r0 and is presumably used as an offset into a word/halfword table elsewhere. The dead "mov
  r6, #0" in the original is discarded by the following pop, so r4-r7 are effectively preserved. Inputs r5 (object
  pointer with index at +4) and whatever context sub_8047D84 reads globally are what callers must set up.'
