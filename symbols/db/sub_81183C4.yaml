open_questions:
- The exact meaning of `r6[2]` as an index – is it `BattleObject.CurState` (offset 8)? No, offset 2 isn't a known
  BattleObject field; r6 may be the AI-side companion struct (the index is named in another tagged `r6` symbol).
  Needs cross-reference with `sub_8118368` and the AI struct layout to confirm.
- Why exactly 15 entries – the upper bound on `r6[2]` and what each handler does is opaque from this single function
  alone; reading any of sub_8118424 / sub_811847C / sub_81184A8 / sub_81184C0 / sub_81184EC / sub_8118510 / sub_8118550
  / sub_811857C / sub_81185A8 would settle the phase meaning.
- The contract claims `r6` is read-only but `r0`/`r1` may be clobbered; the dispatcher actually writes r0 first,
  so its pre-call value (other than the table-base load) is undefined.
