name: NPCCommand_set_transform
address: '0x0809F138'
kind: function
status: confirmed
summary: NPC script opcode that resets sprite scale and reapplies a new scale to an NPC sprite.
interface: void NPCCommand_set_transform(uint8 r6_opcode_and_args, uint8 r6_1, uint8 r6_2, uint8 r6_3); /* clobbers
  r0, r1, r2, r3, nz, c; preserves r4, r7; advances r6 by 4 */
details: 'Dispatched as an NPC command. The byte at r6+0 is the command opcode (skipped); the

  next three bytes (r6+1, r6+2, r6+3) are the scale parameter bytes (e.g. x-scale, y-scale,

  and an additional flag/mode byte) consumed by sprite_setScaleParameters. Before applying

  the new scale the function calls sprite_makeUnscalable then sprite_makeScalable to

  refresh the sprite''s scale state. After dispatch it advances the NPC script pointer r6

  by 4 (opcode + 3 argument bytes). The carry flag from this `add r6, #4` is preserved

  per the register contract; the interpreter relies on c reflecting the addition.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
