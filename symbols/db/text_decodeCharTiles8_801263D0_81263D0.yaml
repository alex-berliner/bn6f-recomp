name: text_decodeCharTiles8_801263D0_81263D0
address: '0x081263D0'
kind: function
status: confirmed
summary: Decodes a short run of character codes into pairs of tile-map halfword entries for an 8-wide text/tile
  strip
interface: void sub_81263D0(u8 *src /*r0*/, u16 *dstLo /*r2*/, u16 *dstHi /*r3*/, u16 baseTile /*r6*/); advances
  r2/r3 past the 8 written pairs; r4-r7 preserved
details: 'Walks a byte string at r0; each byte with value < 0xE5 is a character code that maps to two consecutive
  tiles: halfword (baseTile + code*2) stored to r2''s buffer and halfword (baseTile + code*2 + 1) stored to r3''s
  buffer, with both pointers advancing 2 bytes per character. Decoding stops at a 0xE5 terminator byte or after
  8 entries, whichever comes first; remaining slots up to 8 are zero-filled in both buffers. r6 is a caller-supplied
  base tile index (font/graphics sheet offset), so the same codes render differently depending on the selected tileset.
  Likely part of the name-entry / short-label rendering path (8 characters wide, terminator 0xE5).'
