name: battleObject_snakeArmStepAction
address: '0x080E7F58'
kind: function
status: probable
summary: 'Action-state dispatcher for a battle object: jumps to one of five per-CurAction handlers (screen
  dim/undim, unknown, snake-arm step, unknown).'
interface: (r5 = battle object pointer) -> r0 = value returned by the selected handler via tail-call;
  branches through off_80E7F6C[CurAction] with lr set for long-call
details: 'Standard battle-object step dispatcher: reads the object''s oBattleObject_CurAction byte from
  r5, indexes a 5-entry thumb handler table at off_80E7F6C, and does the mov lr,pc / bx r1 long-call idiom.
  State 0 dims the screen, state 2 steps a ''snake arm'' animation/behavior (battleObject_stepSnakeArm_800BA8A),
  state 4 undims the screen, while states 1 and 3 are still unnamed helpers (sub_800BDB2, sub_80E7F80).
  The dim/undim endpoints bracket the object''s main activity, so the object likely darkens the screen
  while its snake-arm attack plays out. No caller is known, so who owns r5 and when this runs is unconfirmed.'
