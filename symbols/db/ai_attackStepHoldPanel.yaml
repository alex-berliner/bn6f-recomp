name: ai_attackStepHoldPanel
address: '0x081047C0'
kind: function
status: probable
summary: 'One step of an enemy AI attack routine: the object plants itself on its current panel, plays
  a pose, waits 3 frames, then stamps its attack''s hit element.'
interface: (r5 = battle object, r7 = AI attack vars; no args) -> r0 = don't-care; no flags
details: 'Two-phase state machine keyed on oAIAttackVars_AttackElement: on entry (0) it stores 4 there,
  and if object_canMove passes it copies PanelX/Y into FuturePanelX/Y (stay in place), ORs OBJECT_FLAGS_CANNOT_SLIDE
  and the bit-22 flag into ObjectFlags1, sets CurAnim to 0x43 and StepTimer to 3. On later calls it just
  decrements StepTimer and, once it hits 0, writes 4 into oAIAttackVars_HitElement. If the object cannot
  move, it sets oAIAttackVars_HasMoved = 0 and aborts via object_exitAttackState_801171C. AttackElement
  doubles as a ''started'' marker (4), not an element here; the 4 in HitElement is presumably the element/state
  the surrounding attack routine consumes.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst AttackElement / mov #4 strb — two-phase entry vs countdown (loc_81047F2); PanelX/Y copied
    to FuturePanelX/Y plus OBJECT_FLAGS_CANNOT_SLIDE — object locks to its panel; CurAnim = 0x43 and StepTimer
    = 3 — short hold/pose of 3 frames; StepTimer countdown then HitElement = 4 — result handed to the
    attack''s hit logic; canMove failure path: HasMoved = 0 then object_exitAttackState_801171C — attack
    aborted when blocked'
