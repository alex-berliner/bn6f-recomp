open_questions:
- The exact role of sub_80011A0 and sub_800120E (they take the 0x2c000 / 0xffffd800 args and return velocity/timer;
  probably an AI/inertia helper) — would settle by examining those.
- What `oBattleObject_Unk_0c` stores (the calcAngle result byte, probably initial facing/direction for
  the actor's first hop) — would settle by tracing sub_80D774C.
- What damage-bit 0x8000 flip in the early branch actually means (parses/transforms the encoded Damage
  field — possibly "doubled" half) — would settle by tracing callers that set Damage before init.
