name: ai_getTargetObjectPos
address: '0x080E164A'
kind: function
status: probable
summary: AI helper returning two byte fields (likely coordinates) of the battle object currently targeted
  by the caller's AI data.
interface: (r5 = battle object) -> r0 = targetObject field 0x12, r1 = targetObject field 0x13; flags not
  meaningful
details: Reads the battle object's AIData pointer at oBattleObject_AIDataPtr, then the AIData's TargetObjectPtr
  at oAIData_TargetObjectPtr, and returns bytes 0x12 and 0x13 of that target object in r0/r1 (tail-call
  style via mov pc, lr, no stack use). It is a pure two-byte accessor with no side effects. Field pair
  0x12/0x13 in a battle object is plausibly an x/y position pair used by AI targeting logic, but the struct
  layout beyond the known AIData offsets is not confirmed. Callers at 0x0802D358, 0x0802D4F0 and 0x080EEFBC
  would need disassembly to confirm the fields' meaning.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1,[r5,#oBattleObject_AIDataPtr]; ldr r1,[r1,#oAIData_TargetObjectPtr] — navigates battle
    object -> AI data -> target object; ldrb r0,[r1,#0x12]; ldrb r1,[r1,#0x13] — returns two separate
    byte fields of the target object; mov pc, lr with no stack save — leaf accessor returning two values
    in registers; called from three sites (0x0802D358, 0x0802D4F0, 0x080EEFBC) and recorded on beastsp
    routes, matching AI-executed code
