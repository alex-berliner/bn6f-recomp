name: ai_getTargetObjectPos
address: '0x080E164A'
kind: function
status: confirmed
summary: Returns the x/y position bytes of the AI battle object's current target object.
interface: (r5 = battle object*) -> (r0 = target x, r1 = target y); lr is the return address, no flags read or written
details: 'Follows the battle object''s AI data pointer (oBattleObject_AIDataPtr at r5),

  then the AI data''s target object pointer (oAIData_TargetObjectPtr), and reads

  two bytes from the target: offset 0x12 into r0 (x) and offset 0x13 into r1 (y).

  These look like the target''s tile/byte-precision position coordinates. No

  null checks: if the target pointer is unset the result is garbage/crash.

  Pure read; preserves nothing but also clobbers nothing besides r0/r1.

  '
