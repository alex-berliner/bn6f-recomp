    back toward the object; loop calls object_getPanelParameters and tst r0, dword_80CD2E8 (0x800000),
    continuing only when the flag is set; bounds: add r0,r0,r6; beq -> return 0, and cmp r0,#7 / blt loop
    with fall-through returning 7; only caller is sub_80CD160 on chip routes, consistent with a chip-effect
