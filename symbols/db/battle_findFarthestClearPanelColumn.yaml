name: battle_findFarthestClearPanelColumn
address: '0x080CD236'
kind: function
status: probable
summary: Scans a row of the battle field from the far edge (column 6 for player, column 1 for enemy) toward
  the object and returns the x of the first panel whose status word does not have bit 0x800000 set; returns
  0 if none clear before x leaves the field.
interface: (r0 = battle object ptr (r5 base), r1 = row y) -> r0 = column x of first panel lacking flag
  0x800000, or 0/7 if none found; r4,r6,r7 clobbered
details: Start column is computed as (Alliance ^ DirectionFlip ^ 1) * 5 + 1, i.e. column 6 for the player
  side and column 1 for the enemy side (flip-aware), which is the far edge of the field relative to the
  object. r6 = -object_getFrontDirection(), so the scan walks from that far edge back toward the object's
  own side (decreasing x for the player, increasing for the enemy). Each iteration pushes the current
  x/y and calls object_getPanelParameters; if the panel status word has bit 0x800000 set, x is stepped
  by r6 and the loop continues; if the bit is clear, the current x is returned. If x reaches 0 (player-side
  scan) it returns 0; on the enemy-side scan running past column 6 it falls through returning 7, an asymmetric
  out-of-range sentinel. Used by sub_80CD160 on recorded chip routes, so it likely locates a placement
  column for a chip effect that must avoid hole-type panels.
