open_questions:
- The exact field semantics of the three dword fields (0x88/0x8c/0x90 — likely sprite X/Y/anchor or
- ExtraVars + offset). Settling it requires identifying the producer of those fields in sub_80A5B70.
- The "_ADDRESS" suffix is kept because the role ("AI slot init for one BattleObject") is inferred from
- scratch layout rather than a confirmed symbol name.
