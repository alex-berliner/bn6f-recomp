summary: 'Gathers three 10-halfword rows out of the shuffled 0x0202522C table into unk_20251A0, starting
  at a secondary-RNG-picked word offset; one draw per call.'
details: 'Companion of sub_8131C2C in asm36.s (which calls it last): zeroes unk_20251A0 (0x3C bytes),
  draws one GetRNGSecondary, starts at word (r & 0xF) of dword_202522C (wrapping every 16 words) and
  copies 3 rows x 10 halfwords from there into unk_20251A0.'
