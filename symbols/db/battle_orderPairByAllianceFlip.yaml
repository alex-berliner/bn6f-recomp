name: battle_orderPairByAllianceFlip
address: '0x080E5208'
kind: function
status: probable
summary: Reorders two input values in r0,r1 so their low nibbles are ascending when the caller's r5 object's
  Alliance XOR DirectionFlip is nonzero, or descending when zero (full-word tiebreak).
interface: (r0 = value A (low nibble = coordinate/index), r1 = value B) -> r0, r1 = pair ordered per r5
  object's alliance^flip (ascending if nonzero, descending if zero); r3 preserved via stack
details: Loads oBattleObject_Alliance and oBattleObject_DirectionFlip from the object in r5 (set up by
  the caller) and EORs them to pick a sort direction. If the EOR is zero, the low nibbles of r0 and r1
  are compared and the pair is returned so the low nibble of r0 is >= that of r1 (ties broken by full-word
  descending order). If the EOR is nonzero, the pair is instead normalized so r0's nibble is <= r1's (ties
  broken ascending). In other words it canonicalizes a coordinate pair (likely panel coordinates packed
  with other bits in the high nibble) relative to which way the acting object faces, so range/area calculations
  read left-to-right or right-to-left correctly.
