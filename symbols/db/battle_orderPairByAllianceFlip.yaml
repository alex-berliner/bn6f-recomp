- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r2,[r5,#oBattleObject_Alliance]; eor with DirectionFlip selects ascending vs descending
    ordering; mov r2,#0xf; and r2,r0 masks low nibbles of both args before comparing, implying packed
    coordinate bytes; loc_80E5234 swap block exchanges r0/r1 only when the direction-relative comparison
    fails; leaf routine, no calls; r5 is caller context (current battle object), typical of battle helper
    functions
  refs:
