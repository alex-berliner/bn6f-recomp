- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_HitElement] + ldr r1,[r1,r0] + bx r1: indexed dispatch on the hit-element
    field; off_802D72C holds exactly three code pointers (sub_802D738/802D7A0/802D8F0), one per element
    value; bl battleObject_updateSpriteAnimIfChanged_801BCD0 right after the call ties the effect to a
    sprite anim refresh; mov lr,pc / bx r1 is the standard thumb-call thunk, so the handlers are plain
