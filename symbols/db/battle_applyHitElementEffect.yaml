name: battle_applyHitElementEffect
address: '0x0802D714'
kind: function
status: probable
summary: Dispatches on the object's HitElement to one of three per-element effect handlers, then refreshes
  the sprite animation.
interface: (r7 = object whose oAIAttackVars_HitElement is set, r0/r1 scratch) -> r0 = handler return value;
  flags clobbered
details: Loads oAIAttackVars_HitElement from the object at r7 and uses it as an index into a 3-entry function-pointer
  table at off_802D72C, calling the selected routine via mov lr,pc/bx r1 (ARM-style call from Thumb).
  After the handler returns it calls battleObject_updateSpriteAnimIfChanged_801BCD0 so any animation change
  caused by the element effect (e.g. a hit/burn/freeze anim) is picked up and ticked one frame. The table
  has exactly three entries with no bounds check, so HitElement here is a small enum (0-2), not the full
  five-element list — likely a reduced value stored by the specific attack that hit the object. The three
  handlers at sub_802D738, sub_802D7A0 and sub_802D8F0 presumably implement the three variants but their
  bodies are not shown.
