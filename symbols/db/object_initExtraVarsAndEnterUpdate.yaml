details: Calls sub_80E5174 first (purpose unknown, likely per-object setup). Stores r5+0x64 into [r5,#oBattleObject_ExtraVars],
  making the embedded block at +0x64 the object's custom variable struct. Stores byte 3 into oBattleObject_Param2.
  Writes CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized, which both selects the update
  state and clears the phase-initialized flag. Finally calls sub_80E50FE, presumably the CUR_STATE_UPDATE handler,
  then returns. Which concrete object/attack uses this init is not visible from the snippet.
