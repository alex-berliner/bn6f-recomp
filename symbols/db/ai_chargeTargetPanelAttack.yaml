name: ai_chargeTargetPanelAttack
address: '0x080FB4FE'
kind: function
status: probable
summary: 'AI attack state handler: enemy aims at a target panel, blinks that panel''s highlight while
  charging, and signals the hit when the charge timer runs out'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; r0/r1 hold sub_80FB886's target panel X/Y
  on the init path; sets HitElement=0x10 when finished
details: 'On first entry (AttackElement==0) the attack initializes: element is set to 4, the object plays
  animation 0x11, sub_80FB886 supplies the target panel coordinates (TargetPanelX/Y), StepTimer is loaded
  from AttackBoost2, and ChargeCycles is cleared. Each subsequent tick increments ChargeCycles; every
  8th cycle (lsr r0,#3 carry) it calls object_highlightPanel on the stored target panel, producing a blinking
  aim marker on the panel. StepTimer counts down; when it reaches 0 the routine writes 0x10 to HitElement,
  which presumably triggers the attack''s damage phase elsewhere. This is a per-frame update called from
  the object''s AI state machine, not a one-shot routine.'
