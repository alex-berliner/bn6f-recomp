open_questions:
- What AIAttackVars.Unk_0d actually represents (timer-end vs. attack-anim vs. some attack sub-mode flag);
  and which specific bit 0x8000 of AIData.Unk_48 corresponds to in game terms (e.g., full Mystery Data,
  a per-attack flag, or a generic actor capability). Renaming to a more meaningful verb phrase needs callee
  `GetAIDataUnk0x48Flag` to be understood first.
