name: battleObject_resolveCollisionHit
address: '0x080CC800'
kind: function
status: probable
summary: 'Resolves a battle object''s collision: tears down collision data, spawns the hit effect, applies
  the collision''s damage, and either destroys the object or dispatches its per-action collision handler.'
interface: (r5 = battle object) -> r0 = 0 if the object survives with a handler dispatched, else clears
  collision region and sets oBattleObject_CurState = CUR_STATE_DESTROY; uses r0-r3, lr
details: The object in r5 first removes its collision data and spawns a hit-effect object at its position.
  It then checks battle-over/time-stop conditions; if the battle is over or object_applyDamage returns
  negative, the object is torn down (collision region cleared, CurState set to CUR_STATE_DESTROY). Otherwise
  the collision's flags word (oCollisionData_FlagsFromCollision via oBattleObject_CollisionDataPtr) is
  tested against a per-alliance flag mask table at byte_80CC860 (indexed by oBattleObject_Alliance <<
  2); a match also destroys the object. If time-stop is active it merely refreshes present-collision state,
  else it dispatches through off_80CC850 (3 entries) indexed by oBattleObject_CurAction to sub_80CC868/sub_80CC892/sub_80CC8BA
  which finish the collision response.
