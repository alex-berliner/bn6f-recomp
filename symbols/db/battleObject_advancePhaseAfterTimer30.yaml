name: battleObject_advancePhaseAfterTimer30
address: '0x080BDEF0'
kind: function
status: probable
summary: Battle object phase handler that waits 30 frames on first entry, then advances the object to
  phase 4 when the timer expires
interface: (r5 = battle object) -> r0 = 0/next phase written to object; flags preserved
details: This is a per-object phase update routine taking the battle object in r5. On the first run (PhaseInitialized
  flag byte at +PhaseInitialized is zero) it stores 0x1E (30) into the halfword Timer field and writes
  4 to the PhaseInitialized byte, marking init done. Every frame it decrements the Timer halfword; while
  the result is positive it returns. When the timer reaches zero it writes phase value 4 into the combined
  CurPhaseAndPhaseInitialized halfword, moving the object into its next state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized]; tst/bne shows first-run init guard; mov r0,#0x1e;
    strh r0,[r5,#oBattleObject_Timer] initializes a 30-frame countdown; ldrh r0,[r5,#oBattleObject_Timer];
    sub r0,#1; bgt loops the decrement each frame; mov r0,#4; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    sets the next phase to 4 on timeout
