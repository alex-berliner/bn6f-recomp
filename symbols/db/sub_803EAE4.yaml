name: sub_803EAE4
address: '0x0803EAE4'
kind: function
status: confirmed
summary: Dispatches based on the mode byte at the start of "eStruct200BC30" to one of three handlers (mode 0/1/2
  -> sub_803EB04/sub_803EB14/sub_803EB60), forwarding the handler's full register/flag result to the caller and
  only restoring r4-r7.
interface: 'void Next_sub_803EAE4(void /* r4,r5,r6,r7 caller-saved; r0,r1,r2,r3,r8,r9,r10,r11,r12,lr,N,Z,C,V from
  caller */);

  // Returns whatever the selected handler returns in r0-r3, r8-r12, lr and the flags.

  // On entry: r5 = eStruct200BC30 (reloaded inside), the chosen handler sees r5->mode struct, r1 = off_803EAF8
  table base, r0 = table[mode]. Only r4-r7 are popped back on exit.

  '
details: 'Reads a single byte from the start of the global struct eStruct200BC30 (off_803EBF8 -> "eStruct200BC30")
  and uses it as a byte offset into a 3-entry Thumb-ARM target table at off_803EAF8 (entries: sub_803EB04+1, sub_803EB14+1,
  sub_803EB60+1). The selected entry is invoked with "mov lr,pc; bx r0" — a Thumb switch with LR=PC — so the handler
  is entered in Thumb even though this function uses ARM "bx" with Thumb bit set. r1 is left holding the table base
  off_803EAF8 and r5 is left pointing at eStruct200BC30 for the handler. No bounds check on the mode byte (a value
  of 3+ would read past the 12-byte table). The trailing "pop {r4-r7,pc}" only restores r4-r7 from the saved set;
  r0-r3, r8-r12, lr and the NZCV flags flow straight through from the handler, so the handler''s "return value"
  is literally this function''s return value. Struct touched: eStruct200BC30 byte 0 (mode/state). Table offsets:
  off_803EAF8 (jump table), off_803EBF8 (eStruct200BC30 pointer). Caller/callee convention quirk: because the target
  was loaded with thumb bit set, the +1 offsets in the table are required so bx enters ARM — i.e. sub_803EB04/sub_803EB14/sub_803EB60
  are ARM functions despite the thumb_func_end label on this dispatcher.

  '
