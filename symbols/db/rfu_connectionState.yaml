summary: 'Proposed name: rfu_connectionState. RFU wireless connection state, with three meaning the link
  is connected (u16)'
details: A halfword holding the RFU connection state. rfu_isNotConnected compares it with three and reports
  that the link is not connected until that value is reached. The wireless event dispatcher and command
  handler copy eStruct200FE00.word_200FE14 into it when a session is not connected, while one command
  path explicitly sets it to three.
