name: ai_initBeastOutAttack
address: '0x0810C212'
kind: function
status: probable
summary: 'Enemy AI step that initializes a Beast Out-style attack: loads per-version difficulty parameters,
  picks a target/enemy, chooses a panel-callback, and sets attack0.'
interface: (r4 = AI data holder, r5 = self BattleObject, r7 = AIAttackVars) -> r0 = 0 if the beast-out
  chip attack already acted, else void after configuring attack vars; clobbers lr
details: First calls battleObject_tryBeastOutChipAttack_810C282 and returns immediately if it acted. Otherwise
  it reads oAIData_Version_16 from r4 and indexes five byte tables (byte_810C1D2/1BA/1C6/1CC/1C0) plus
  a word table (byte_810C19C, *4) to fill oAIAttackVars fields AiDifficultyTier, AttackBoost2, TimerOrCycles,
  SubStepIndex, AttackDuration, Damage and ScratchVar, hardcoding ExtraDamage=0xA. It XORs the object's
  Alliance with 1 and finds the closest enemy object; if one exists it stores it as TargetObjectPtr and
  callback sub_810C2B2, otherwise callback sub_8015C48 (a fallback panel chooser). If object_getFlag has
  bit 0xA000 set, AttackBoost2 is forced to 0x50 and the callback is replaced by sub_8015C48. Finally
  object_setAttack0(0xA) arms the attack slot; the beastsp/battlesweep routes and the beast-out callee
  tie this to boss Beast Out AI.
