open_questions:
- what sub_80C0F52 (reached via the sub_80E1332 wrapper) does with (RelatedObject1Ptr, 1)
- which battle object(s) use this as their phase-4 update handler and what the 30-frame wait represents
  in gameplay
- exact bit layout of CurPhaseAndPhaseInitialized (whether the final store sets phase 4, clears the init
  flag, or both)
