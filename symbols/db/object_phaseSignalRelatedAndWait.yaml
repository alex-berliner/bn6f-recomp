name: object_phaseSignalRelatedAndWait
address: '0x080E9378'
kind: function
status: probable
summary: 'Battle-object phase handler: signals the object''s related object once, waits 30 frames, then
  advances the phase state.'
interface: (r0,r1 = unused on entry; r5 = battle object) -> void; sets oBattleObject_PhaseInitialized,
  oBattleObject_Timer, oBattleObject_CurPhaseAndPhaseInitialized, calls helper on oBattleObject_RelatedObject1Ptr
details: Runs each frame with the object in r5. If oBattleObject_PhaseInitialized is zero, it stores 4
  there, calls sub_80E1332 (tail-wrapper for sub_80C0F52) with r0 = oBattleObject_RelatedObject1Ptr and
  r1 = 1, sets oBattleObject_Timer to 0x1E (30 frames) and returns. Otherwise it decrements oBattleObject_Timer
  each call and, once it reaches 0, stores 4 into the halfword oBattleObject_CurPhaseAndPhaseInitialized,
  which changes the object's current phase for the next dispatch. The meaning of the (ptr, 1) call depends
  on unknown sub_80C0F52, so the trigger's effect is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on oBattleObject_PhaseInitialized gates a one-time init branch; bl sub_80E1332 with
    r0 = [r5,#oBattleObject_RelatedObject1Ptr], r1 = #1 sends the one-time signal; mov r0,#0x1e; strh
    [r5,#oBattleObject_Timer] starts a 30-frame wait; timer decrement with bgt keeps waiting until it
    hits zero; strh #4 to oBattleObject_CurPhaseAndPhaseInitialized switches the object''s phase when
    the wait ends'
