name: ai_attackDispatchStep_80F7EA6
address: '0x080F7EA6'
kind: function
status: confirmed
summary: Battle AI attack dispatcher — reads the enemy's current attack-step slot from its AI variable
  block and tail-calls the matching attack handler from an 8-entry jump table.
interface: void sub_80F7EA6(r5, r6, r7 = AI attack vars ptr, r10) — tail-call; results (r1, r5, r8-r12,
  flags) are whatever the selected handler leaves behind; r7 is reloaded unchanged after the handler
details: 'Trampoline/jump-table dispatcher for the enemy AI''s attack routine. It loads a slot byte from

  the AI variable block at [r7 + oAIAttackVars_Unk_00] (labeled oAIAttackVars_HitElement in the

  readable C, but here it selects the attack step, not an element) and uses it directly as a

  BYTE offset into the handler table at off_80F7EB8 — no *4 scaling — then does the classic

  "mov lr, pc / bx r1" long-call into the handler. Handlers (one of 8: sub_80F7ED8,

  ai_attackTryClaimTargetPanel, sub_80F7F7C, sub_80F7FA2, sub_80F7FC2, sub_80F8014,

  sub_80F803E, sub_80F8094) receive r0 = slot byte, r1 = table entry, and r5/r6/r7/r10 passed

  through. Because the dispatcher only pushes {r7, lr} and pops immediately after the handler

  returns, the handler''s outputs ARE this function''s outputs; r7 alone is guaranteed preserved

  (saved/restored around the call). Quirk: indexing without *4 means the stored slot byte is

  effectively a byte offset into the table (0,4,8,... for the 8 handlers); any other value

  would land mid-entry.

  '
