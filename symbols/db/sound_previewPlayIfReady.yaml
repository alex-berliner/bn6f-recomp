open_questions:
- what call_sub_3005EBA (0x03005EBA in IWRAM) actually does — sound play vs sound engine tick — and whether
  it reads word_2036660 itself
- which function writes byte_2036667 (offset 7), and whether the flag means 'sound loaded' or 'one-shot
  pending'
- The code at 0x0802BA34 just checks byte_2036667 and conditionally calls call_sub_3005EBA; the rest of
  the function span (off_802BC60, off_802BCB0 and their byte records) is pure data, not part of the function.
  The proposal correctly identifies the logic and that it's a sound playback gate, but the name and summary
  should reflect a sound prefix and just describe the gate, not the unrelated adjacent data tables.
