name: ai_battleObjectStateDispatch
address: '0x08101A68'
kind: function
status: probable
summary: Runs the per-AI-state handler for a battle object by dispatching through a table indexed by the
  object's AI script id.
interface: (r5 = battle object) -> r0 = handler return value; calls handler with lr=pc (long-call)
details: 'Loads the battle object''s AIData pointer from oBattleObject_AIDataPtr and builds pointers to
  AIState (AIData+0x80) and AIData+0xA0. Reads oAIState_ScriptId from the AI state struct, uses it to
  index off_8101A84 — an 8-entry table of Thumb handlers (sub_8101AA0, sub_8101E24, sub_8101E4A, sub_8101E70,
  sub_8101E96, sub_8101EBC, sub_8101EE2, plus one more) — and calls it via the lr=pc/bx lr long-call idiom,
  which also keeps r5 (the owning battle object) intact for the handler. It is a pure dispatcher: no state
  is modified here and the script id is not bounds-checked, so ids above 7 read garbage from past the
  table.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r7,[r5,#oBattleObject_AIDataPtr]; add r6,r6,r7 reaches AIData+0x80 = AI state block; ldrb
    r0,[r6,#oAIState_ScriptId]; ldr r1,[r1,r0] indexes off_8101A84 handler table by script id; mov lr,pc;
    bx r1 is the standard Thumb long-call, preserving r5 as the object pointer for the callee; table at
    off_8101A84 holds 8 code pointers, matching the small set of AI state handlers at 0x8101AA0-0x8101EE2;
    executed by the battlesweep route with no other callers, consistent with a per-frame AI state dispatcher
  refs:
