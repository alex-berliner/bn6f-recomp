name: TryUpdateEachOWPlayerObject_8003BA2
address: '0x08003BA2'
kind: function
status: confirmed
summary: Per-frame dispatcher that walks every slot in the overworld player-object table and calls each active object's
  update routine through a jump table, gating non-pause-update objects while battle is paused.
interface: void battle_updateEachOWPlayerObject_8003BA2(/* R8 = pass-through to callees */, /* R9 = saved/restored
  only */, /* R10 = toolkit ptr */, /* R11 = pass-through */, /* R12 = pass-through to callees */) -> void
details: 'Loads the contiguous eOWPlayerObject … eOWPlayerObjectEnd array and the off_8003B48 jump-table base. For
  each slot of size oOWPlayerObject_Size: reads the OBJECT_FLAG_ACTIVE bit in the header flags byte; if set, checks
  gameState->BattlePaused and skips the slot unless OBJECT_FLAG_PAUSE_UPDATE is also set. Otherwise fetches the
  1-byte routine id at object+0x1, shifts it left by 2 to index into the word table, and dispatches via bx into
  the callee. The callee register-file convention is R0=funcPtr, R1=tableOffset, R4=caller-R8 (alliance/misc ptr),
  R5=current object ptr, R6=caller-R12 (misc ptr), R7=gameState ptr. R4/R6 are parked before the loop and survive
  through GUEST_CALL; R5 advances each iteration. All callee-saved regs and the caller''s R8/R9/R12 are restored
  on return (push/pop of r4-r6 plus mov pairs). R10 (toolkit) and R11 are passed through to callees unmodified by
  this function but may be clobbered by them per the register contract (outputs list R10/R11).'
