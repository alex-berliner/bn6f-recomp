    writes a phase constant through r5 with the project''s `oBattleState_Index_01` (offset 0x1), consistent
    with r5 being the battle-state pointer at this point. - The eight callees are all init/reset helpers
    (`clearBattleObjectLinkedLists_800318C`, the three `InitializeT*BattleObjectStructs`, `battle_setBeastLinkFlag_0802E112`,
    `camera_resetToOrigin_8007338`, `clearBattleCounters_800A0C6`, `resetBattleBuffers_801BE70`, `copy_8002668`).
    - All 8 captured calls were taken from `snap_story2` (post-fade-in battle kickoff), each with identical
    entry/exit state (r0=4 returned), consistent with an idempotent init function called on entering a
    battle. - The route note `// trigger battle_dispatchPhase_8007978 via battle_finishBattle_8007850`
    confirms the value 4 written to BattleState is the phase index that the dispatcher consumes next.'
