name: battle_updateActiveChipSlotId_8027F84
address: '0x08027F84'
kind: function
status: probable
summary: Looks up and stores the chip ID for the currently highlighted battle-chip slot, with a special
  swap for slots 5/9.
interface: "void sub_8027F84(u32 r6_slotIndex, void* r7_chipSlotStruct);\n  // in: r6 = slot index (0..11,\
  \ can be 0xA for out-of-range), r7 -> chip slot struct\n  //   r7[0] = slot byte (compared against 5\
  \ and 9)\n  //   r7[2] = chip ID field (read for getLocOfActiveChips lookup, written on exit)\n  //\
  \ out: r7[2] updated to either the looked-up chip ID or 0xFF clamp\n  // clobbers: r0, r1, r6, r7, LR,\
  \ flags N Z C V\n  // preserved: r4\n"
details: "Uses [r7+2] (chip pointer kind) to call getLocOfActiveChips_8027E1C and inspect\nthe active\
  \ chip kind byte. Only acts when kind is 0xA or 0xB; otherwise\nreturns without writing [r7+2].\n\n\
  Selects a pointer table:\n  - kind == 0xA: r6 == 0xA uses off_802A7FC (A-table). r6 in 5..9 uses\n \
  \   byte_802A804 (B-table) and may subtract 1 from r6 if [r7] == 5 or 9.\n    r6 < 5 still uses the\
  \ A-table.\n  - kind == 0xB: always uses byte_802A804, with the same [r7] == 5 or 9\n    -> r6 -= 1\
  \ swap.\n\nThe final index into chip_slot_table[12] (byte_8027FD0) is r6 (possibly\nswapped), added\
  \ to the chosen base, and passed to sub_8028034. If\nsub_8028034 returns the same slot index unchanged,\
  \ the ID is clamped to\n0xFF. Otherwise the returned byte is stored into [r7+2].\n\nTouched data:\n\
  \  - byte_8027FD0: 12-entry chip slot index table\n    (07 06 05 04 02 11 10 0F 07 01 00 00).\n  - off_802A7FC\
  \ / byte_802A804: chip-pointer tables (A and B variants).\n  - r7 structure: byte[0] = slot tag, byte[2]\
  \ = chip pointer index.\n\nQuirks: the B-table branch uses `sub r6, #1` before the lookup, so the\n\
  effective index fed into chip_slot_table is one less than the original\nslot when the swap applies.\
  \ Behavior for r6 >= 0xA (e.g. exactly 0xA is\nhandled via the A-table early-out; values above 0xA read\
  \ past\nchip_slot_table but are bounded by the chip-kind checks above).\n"
