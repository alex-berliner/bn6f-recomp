name: battle_getStateByteNibbles_800A832
address: '0x0800A832'
kind: function
status: confirmed
summary: Reads the battle state's Unk_1f byte and returns it split into a low nibble (r0) and a high nibble (r1).
interface: 'battle_getStateByteNibbles(void); /* in: r10 = toolkit, lr = return; out: r0 = Unk_1f & 0xF, r1 = Unk_1f
  >> 4, r2 = 0xF, nz = flags of r0, c = bit 3 of Unk_1f */'
details: 'Loads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), then reads the byte at
  oBattleState_Unk_1f from that state. It breaks the byte into two 4-bit values via LSR #4 (high nibble into r1)
  and AND 0xF (low nibble into r0), leaving 0xF in r2 as a scratch/constant for callers. Flags set from the low
  nibble''s value; the carry flag incidentally holds bit 3 of the original byte from the shift, so callers branching
  on carry are really testing that bit. Nothing is written back; purely a getter/decomposer. The meaning of Unk_1f''s
  two nibbles (e.g. some battle phase/mode pair packed into one byte) is not established from this function alone.'
