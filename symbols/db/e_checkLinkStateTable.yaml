open_questions:
- No callers are known, so the in-game feature that owns eLinkState (link multiplayer, e-Reader, or another system)
  is unconfirmed
- What unk_2009480's 8-byte records represent and what sub_803E78C/sub_803E8B4 select from it
- What sub_8144D04(i)==1 tests (per-slot connected/active condition) and why exactly 2 must pass
- The summary captures the broad flow reasonably well, but it misses that success returns 2 and failure returns
  4 via sub_803EA48 (the block at loc_803EE6A always calls sub_803EA48 with arg 2, not '2 or 8'). Also the initial
  count loop uses sub_8144D04 per iteration of r4, not sub_8144D04(i) — r4 is the loop counter. A better name reflects
  validation rather than verification of state.
