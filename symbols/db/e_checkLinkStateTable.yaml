    loc_803EDB8: combined u16 pair (field+0/+2) compared to eLinkState+0x1c each pass; mismatch exits via sub_803EA48;
    loc_803EE28: success stores record words to eLinkState+0x20/+0x40, eLinkState+1 += 4, sets jump offset 4 (e_setJumpOffset)
    and returns 2; dword_803EE8C/803EE94 = 0x800/0x1000 flags and the sSubmenu==0xC guard gate whether the success
    path is taken'
