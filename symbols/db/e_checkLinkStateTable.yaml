name: e_checkLinkStateTable
address: '0x0803ED4C'
kind: function
status: probable
summary: Iterates eLinkState+4 entries calling sub_8144D04, requires exactly two hits, then validates unk_2009480
  records (0x60 means fail, 0x62 marks found), copies matching fields into eLinkState+0x20/+0x40, bumps state by
  4, sets jump offset to 4, and returns 2 (or 4 via sub_803EA48 on failure).
interface: (no args used) -> r0 = 2 if table verified and eStruct/eLinkState advanced, 4 if validation failed or
  count != 2, 4/8 via sub_803EA48 on the exit paths; writes eLinkState[0], +1, +0xE, +0x20, +0x30, +0x40 and eStruct200BC30
  byte 5
details: 'Reads a count from eLinkState+4 and calls sub_8144D04(i) over that many slots, counting how many return
  1; if not exactly 2, it exits through sub_803EA48 and returns 4. It then walks 8-byte-strided records at unk_2009480:
  consecutive u16s must not be 0x60 (hard fail) while 0x62 sets eLinkState[0]=8 and calls sub_803E89C; a u16 pair
  (fields +0/+2) must equal eLinkState+0x1c for every entry or the routine fails out. On success it stores two record
  fields as 32-bit words into eLinkState+0x20 and +0x40, gates the 0x800 and 0x1000 record flags on sSubmenu ==
  0xC, bumps eLinkState+1 by 4 and copies it to eLinkState[0], sets halfword +0xE = 2 and +0x30 = 0, sets the eStruct
  jump offset to 4 via e_setJumpOffset, and returns 2. The failure exits call sub_803EA48 with 2 or 8 and still
  return 4, so the return value alone does not signal success.'
