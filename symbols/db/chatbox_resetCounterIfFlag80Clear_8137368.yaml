name: chatbox_resetCounterIfFlag80Clear_8137368
address: '0x08137368'
kind: function
status: confirmed
summary: If chatbox flag 0x80 in eFlags2009F38 is clear, resets the byte counter at *r5 to 100.
interface: void sub_8137368(u8* counter /* r5 */)
details: 'Tiny conditional-reset helper. Tests bit 0x80 of the shared flags word at

  0x0209F38 via chatbox_mask_eFlags2009F38 (non-zero result = flag set).

  When the flag is clear (test returns zero, Z set), it stores 0x64 (100) into

  the single byte pointed to by r5, presumably a frame/wait counter that the

  chatbox code decrements elsewhere. When the flag is set it returns immediately

  without touching the byte. Takes the target pointer in r5 (not r0), preserves

  r1, and produces no outputs; clobbers r0, lr and flags. The value 100 as a

  starting counter suggests a ~1.6-second delay at 60fps, e.g. a text-pause or

  auto-advance timer.

  '
