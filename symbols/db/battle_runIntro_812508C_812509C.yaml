summary: Runs the battle intro sequence on the battle object held in R5, copying pre-battle state, picking
  the intro branch, then kicking off the post-intro setup chain.
interface: void sub_812509C(void); /* inputs via r2 r5 r10 lr; outputs c v r1 r2 r3 r5 r7 r8 r9 r10 r11
  r12 lr; clobbers nz r4; preserves r5 r6 */
details: 'Operates on a battle state struct whose pointer arrives in R5 and is the same R5

  propagated by the caller.

  Sets field 0x0D = 4 (likely a phase/sub-state byte).

  Mirrors field 0x3C -> 0x3E and 0x40 -> 0x42, presumably snapshotting pre-battle

  values for HP/position/pose into "saved" slots.

  Calls sub_8126818 with r0=1, sub_8125784 with r0=0x28, then sub_8125444.

  Branches on the 32-bit flag at +0x64: nonzero -> sub_8126114, zero -> sub_8126184

  (two alternative intro/entry routines, e.g. first-time vs repeat battle).

  Finishes with the fixed post-intro chain sub_8126554, sub_812674C, sub_81267A8,

  sub_81267F0 before returning via pop {pc}.

  '
