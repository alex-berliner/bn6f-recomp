summary: 'Mr. Weather comp map object (type 0x1B) idle bob: alternates a phase byte at +0x06 every 0x18 frames and
  moves the object''s Z (s16.16 at +0x14) by ±0x4000 (±0.25 px) per frame.'
details: 'Body (asm29.s:8240-8281): the counter at [r5+7] counts to 0x18; when it wraps the phase byte [r5+6] flips
  0 <-> 1 and the counter resets. While the phase is 0 the Z at [r5+0x14] decreases by 0x4000 each frame, while
  it is 1 it increases — the orb bobs up and down.'
