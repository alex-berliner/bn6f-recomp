- What subsystem owns the three tables at "byte_80188C0:0x080188C0", "byte_801898C:0x0801898C", "byte_80191C8:0x080191C8"
  — these look like packed 68-byte sprite/animation descriptors (note byte_80188C0 spans into .word literals, suggesting
  it's a heterogeneous blob, not pure 0x44-stride records).
