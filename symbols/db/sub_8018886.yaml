name: sub_8018886
address: '0x08018886'
kind: function
status: hypothesis
summary: Returns a pointer to a 0x44-byte sprite/animation record from one of three tables, optionally remapping
  the sub-index through a 16-entry LUT when the table index is 0.
interface: const void *u8(u16 tableIdx, u16 subIdx); // r0=tableIdx, r1=subIdx -> r0=ptr; clobbers r1,r2,r3; flags
  NZCV clobbered; preserves nothing
details: 'Entry point at 0x8018886. If r0==0, r1 is replaced by an 8-bit load at byte_80188B0 + r1 (a 16-byte LUT
  that maps 0..15 to values in {0,1,2}, e.g. indices 0,13,14,15 -> 0; 1..5 -> 1; 6..10,12 -> 2). The (possibly remapped)
  r1 is then used as a record index and r0 is used to pick a base pointer from the 3-entry pointer table at off_80188A0
  -> {byte_80188C0, byte_801898C, byte_80191C8}. The final pointer returned is base + r1 * 0x44. Returns via mov
  pc,lr; r0 holds the result, r3=0x44 leftover. Function preserves nothing (r1,r2 clobbered).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
