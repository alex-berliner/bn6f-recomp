name: object_setPanelFlagFromOffsets
address: '0x080E8CC4'
kind: function
status: probable
summary: Marks the panel at column-plus-row in an object's panel flag table when the supplied panel-code
  offsets resolve to a valid 6-by-3 grid position.
interface: (r0 = panel code low 3 bits, r1 = panel code high nibble, r3 = stack panel-code list pointer,
  r4 = base of 0x2C-byte panel flag table) -> r0 = unspecified; flags clobbered
details: Adds the signed lookup-table values at byte_80E8D80 indexed by the two panel-code nibbles, treating
  the first as a column and the second as a row. It stores 1 at r4 + column + 6*row only when the resulting
  column is 1..5 and row is 1..2. Reads are interleaved through two shared bytes per iteration, and invalid
  coordinates are skipped without changing the table.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The sole caller extracts r0 as the low 3 bits and r1 as bits 4-7 of each byte returned by object_getPanelsFiltered.;
    The caller points r3 at that result buffer and r4 at object+0x64, its 0x2C-halfword panel flag table,
    before looping.; Lines 080E8CD0-080E8CD8 constrain the computed axes to 1..5 and 1..2.; Lines 080E8CDE-080E8CE2
    convert the coordinate to a six-column row-major index and store 1 there.; The lookup in byte_80E8D80
    is indexed by the caller-supplied nibbles as two signed offsets.
  refs:
  - bn6f/asm/asm31.s:111207
  - 0x080E8C84 object_collectFilteredPanelsToFlags
