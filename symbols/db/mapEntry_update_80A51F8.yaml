name: mapEntry_update_80A51F8
address: '0x080A51F8'
kind: function
status: confirmed
summary: 'Map-entry show/hide controller: when the entry''s trigger flag is set, load its sprite, clear
  its pair of flags and switch to state 3 (shown); when clear, set both flags, mark hidden (state 0x10)
  and tear down.'
interface: "void sub_80A51F8(void);                 // uses caller-provided r5 = control struct, r7 =\
  \ entry struct, r10 = bank base\n  in:  r5 (control struct), r7 (entry struct), r10 (bank/base), lr\
  \ (return)\n  out: r0/r2/r5/r10 (forwarded from tail call sub_80A5268 or sub_80A5350); NZ/CV reflect\
  \ that tail's flags\n  clobbers: r0, r1, r2, r3, lr; preserves r4, r5, r6, r7, r10\n"
details: "Entry struct (at r7) layout used:\n  +0x00 u16 triggerFlag    (tested with TestEventFlag)\n\
  \  +0x02 u16 flagA          (SetEventFlag on hide, ClearEventFlag on show)\n  +0x04 u16 flagB      \
  \    (same treatment as flagA)\n  +0x06 u8  spriteArg2     (passed to sprite_load as 2nd arg)\n  +0x07\
  \ u8  spriteArg3     (passed to sprite_load as 3rd arg)\n  +0x08 u8  animation      (sprite_setAnimation)\n\
  \  +0x0A u8  unk0x2cField   (shifted left 24, passed to sprite_setUnk0x2c)\n  +0x0B u8  palette    \
  \    (sprite_setPalette)\n  +0x0C u8  priority       (sprite_setPriority_8002E14)\n\nControl struct\
  \ (at r5):\n  +0x00 u8 state    (written: 3 when shown)\n  +0x08 u8 visState (written: 4 when shown,\
  \ 0x10 when hidden)\n\nBranch on TestEventFlag(triggerFlag):\n  * set (taken as \"show this entry\"\
  ):\n      - state = 3\n      - sprite_load(0x80, spriteArg2, spriteArg3)\n      - sprite_setPriority_8002E14(priority)\n\
  \      - sprite_setAnimation(animation)\n      - sprite_loadAnimationData()\n      - sprite_noShadow()\n\
  \      - sprite_setUnk0x2c(unk0x2cField << 24)\n      - sprite_setPalette(palette)\n      - ClearEventFlag(flagA);\
  \ ClearEventFlag(flagB)\n      - visState = 4\n      - tail call sub_80A5268 (return value flows into\
  \ r0)\n  * clear (taken as \"hide this entry\"):\n      - SetEventFlag(flagA); SetEventFlag(flagB)\n\
  \      - visState = 0x10\n      - tail call sub_80A5350 (return value flows into r0)\nThe function tail-calls\
  \ one of two subroutines and pops {pc}, so r0/NZCV at return come\nfrom sub_80A5268 or sub_80A5350 respectively.\n"
