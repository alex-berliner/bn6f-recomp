summary: Forwards fixed AI-attack parameter table plus per-frame params into battleObject_applyAIDataToAttackTable_8123C20
  for all battle objects on the field.
interface: '(r0 = dword_8123BDC = 0x0302F2E, r1 = 0x1, r2 = byte_81233D8, r3 = 0x4, r4 = 0x1c) -> void
  ; side effects: jumps into the per-battle-object loop in 8123C20'
details: "Thin trampoline (8 instructions of code + data pool). It hardcodes a constant\n  data bundle\
  \ `{0x0302F2E, 0x1, byte_81233D8, 0x4, 0x1c}` and forwards it via the\n  standard r0..r4 calling convention\
  \ to sub_8123BC0's sole callee\n  battleObject_applyAIDataToAttackTable_8123C20. The callee in/out contract\
  \ already\n  shows it loops over battle objects and pokes them; this wrapper enforces the\n  per-frame\
  \ parameters that drive one specific update pass.\n\n  r0 = 0x0302F2E points into the EWRAM \"Toolkit\"\
  -style area\n  ([oToolkit]+0x2e = 0x0302f2e - 0x3000000 ... actually the byte_20026e0/word area), but\n\
  \  concretely the callee treats r0 as a `Toolkit*`-like base that already encodes\n  the per-frame input\
  \ bundle (this is the same address dispatched from\n  battle_updateFrame_8123558, captured call data:\
  \ entry r0=0x08123559 which is the\n  tail of an inline expansion).\n\n  r1 = 0x1 selects the AI-update\
  \ sub-mode.\n  r2 = byte_81233D8 is the AIAttackVars/constant data table passed straight through.\n\
  \  r3 = 0x4 (the loop phase / count selector).\n  r4 = 0x1c (28-byte stride, matching `oAIAttackVars.Size`\
  \ = 0x50? No: 0x1c is the\n  element count / per-actor stride used by the callee and matches\n  `oT4BattleObject.ExtraVars`\
  \ extra_vars_size = 0x1c).\n"
