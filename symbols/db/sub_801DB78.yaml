name: sub_801DB78
address: '0x0801DB78'
kind: function
status: hypothesis
summary: One-line tail-call wrapper that invokes sub_801BEB8 with the constant argument 2.
interface: void sub_801DB78(void) -> returns whatever sub_801BEB8 returns in r0-r2, with N/Z/C as left by sub_801BEB8;
  callers read r0, r1, r2, NZ, C and lr, and pass no registers in.
details: 'Trivial thunk: pushes lr, builds the constant 2 in r0 (mov r0,#1; lsl r0,#1 —

  the LSL is flag-setting and must load C from bit 31 of 1, i.e. C=0), then

  branches to sub_801BEB8 (its return value/flags become this function''s

  outputs since the epilogue is pop {pc} after the bl — note the bl clobbers lr,

  so the pop {pc} actually returns to the caller of sub_801DB78 using the

  original pushed lr). No other registers are touched, so the function''s whole

  meaning is "call sub_801BEB8(2)". Without knowing sub_801BEB8''s semantics

  (it takes a small integer code, 2 here) the game-level purpose cannot be

  pinned down; possible meanings include selecting a mode/state/slot id.

  '
