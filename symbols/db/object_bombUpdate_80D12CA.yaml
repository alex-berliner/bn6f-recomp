open_questions:
- Exact chip/object ID this is (Bomb, Mine, or TimeBomb) isn't pinned down by anything in the function;
  only that it is a T1 battle object that explodes via spawn_t1_0x0_EffectObject, has HP, plays bomb-hit
  SFX, and uses Param1 (sub-type) / Param2 (delay). Knowing the attack-id used in the attack script that
  spawns this object would settle the name.
- The four phase handlers (sub_80D1394/13F6/141A/142C) are not seen here; the semantics of "0x10<<16 added
  to third word" inside the explode path is a guess (could be Y, Z, or precomputed delta).
