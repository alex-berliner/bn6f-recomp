name: battle_spawnCollisionRegionPreset
address: '0x080E5910'
kind: function
status: probable
summary: Thin wrapper that spawns a preset collision region (type 5) for a battle object with hard-coded
  size/flag parameters.
interface: (r0 = battle object ptr, r1 = ? passed through) -> calls object_spawnCollisionRegion with r2
  = 5, r3 = 0, r4 = 0x405FF01, r6 = 0, r7 = 0x1100
details: The function leaves r0 and r1 untouched and only loads fixed constants into r2-r7 before tail-calling
  object_spawnCollisionRegion, so it is a fixed-parameter preset for that spawner. The 0x405FF01 word
  likely packs several flag/offset fields, and 0x1100 packs two byte-sized parameters, since the callee
  consumes multiple register arguments at once. Being called from battle_objectInitPhaseWithSfx during
  a one-shot object init phase, it establishes the object's hitbox as part of its setup. The unused literals
  (cos/sin tables, 0x1000, 0x280000, etc.) are pool data shared with neighboring code, not this routine.
