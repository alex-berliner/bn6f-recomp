name: npc_conditionalChat
address: '0x0812471C'
kind: function
status: probable
summary: Runs one of two chatbox text scripts (7 with an argument, or 8) depending on the result of a
  check, and updates the caller task's state bytes accordingly.
interface: (r0 = byte argument, saved to [r5,#0x10]) -> none; r5 = task/object with state bytes at +2/+3,
  r10 = toolkit
details: Saves the byte argument at [r5,#0x10], calls sub_809F9BE whose boolean-style result arrives in
  r7. If nonzero, it sets state byte [r5,#2]=0x0C and [r5,#3]=0x14, fetches the chatbox pointer from the
  toolkit (oToolkit_ChatboxPtr), copies the argument into chatbox+0x4C (a script-variable slot consumed
  by the text), and runs text script 7 from the eTextScript201C100 archive. If the check fails, it sets
  [r5,#2]=0x08 instead and runs script 8 with no argument. So the function is a branch point that picks
  which of two canned messages to display and stores the numeric parameter used inside message 7.
