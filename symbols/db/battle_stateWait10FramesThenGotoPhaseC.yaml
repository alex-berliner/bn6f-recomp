name: battle_stateWait10FramesThenGotoPhaseC
address: '0x08009AFC'
kind: function
status: probable
summary: battle sub-phase handler that waits 10 frames on entry, then advances the battle state to sub-phase
  0xC
interface: (r5 = battle state struct) -> r0 = leftover value (0 when phase advances); flags from the timer
  decrement
details: This is a battle-state sub-phase step driven by the shared battle state struct in r5. On first
  invocation (oBattleState_SubPhaseInitFlag clear) it loads the countdown timer with 10 and sets the init
  flag to 4, marking this sub-phase as started. On subsequent frames it decrements oBattleState_CountdownTimer
  and returns while the timer is still >= 0. When the timer expires it writes 0xC into oBattleState_Index_01
  (the next battle sub-phase index) and clears oBattleState_StatePhaseAndInitFlag to 0, letting the battle
  state machine dispatch to the next phase with its own init step.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'init branch: mov r0,#0xa; strh r0,[r5,#oBattleState_CountdownTimer] — arms a 10-frame timer
    and sets SubPhaseInitFlag=4 (0x8009B02-0x8009B0A); loop branch: ldrh/sub#1/strh on oBattleState_CountdownTimer
    with bge — one frame per call until the timer underflows (0x8009B0E-0x8009B12); exit: strb #0xC to
    oBattleState_Index_01 and strh #0 to oBattleState_StatePhaseAndInitFlag — hands control to sub-phase
    12 via the standard state dispatcher; r5 field names (oBattleState_*) show r5 is the global battle
    state struct, so this is a battle state-machine handler, not an object script'
