open_questions:
- which battle flow reaches this handler (no callers known), so the in-game meaning of 'phase 0xC after
  a 10-frame wait' is unconfirmed
- whether the 10-frame delay corresponds to a specific on-screen pause (e.g., a banner or transformation
  pause)
