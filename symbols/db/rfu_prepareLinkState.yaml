name: rfu_prepareLinkState
address: '0x0803F334'
kind: function
status: probable
summary: Dispatches on sub_803F17C's returned mask to call sub_803F0A4 with one of two state/buffer pairs
  (possibly via sub_803F26C or after e_setFlagBits(2)), then clears a work flag; callee of wireless link
  setup right before rfu_queuePushEntry.
interface: (r0 = state/data pointer, r1 = 0x40 length/count) -> r0 = status flag from sub_803F17C path;
  clobbers work flag via testAndClearWorkFlag, may set event flag bit 2
details: 'First calls sub_803F17C and branches on its returned mask: mask==0 takes the plain path (two
  sub_803F0A4 calls with the state pairs byte_200AC20/byte_200BC70 and unk_200AC30/word_200A010, then
  testAndClearWorkFlag). If bits 0x1C are set it calls sub_803F26C(r0) before one sub_803F0A4 call; if
  bit 3 is set it pushes flag bit 2 via e_setFlagBits before the same call. The two parallel state structures
  look like RNG/generator states feeding a 64-byte (0x40) block. Both callers pass a game struct pointer
  (byte_20101E0 / unk_20103A0) plus the constant 0x40, and caller 2 follows with rfu_queuePushEntry of
  a 12-byte buffer, tying this to wireless adapter communication. The +0x3C byte of the caller struct
  acts as a count/limit checked before invoking it.'
