name: object_updateChipNameDisplay
address: '0x080E2B9C'
kind: function
status: probable
summary: State-handler dispatch for a battle UI object that dims the screen, draws the selected chip's
  name, and undims it, selected by the object's CurAction.
interface: (r5 = battle object ptr, r0 unused on entry) -> calls one of four action handlers via jump
  table; no return value used
details: 'Reads the object''s oBattleObject_CurAction byte at [r5, offset] and uses it to index a 4-entry
  jump table (off_80E2BB0), tail-calling (mov lr, pc; bx r1) one of: object_dimScreen, object_drawChipName,
  sub_80E2BC0, or object_undimScreen. r5 is left as the object pointer, so all handlers operate on this
  same battle object. The sequence dim -> draw chip name -> ... -> undim suggests a staged display (e.g.
  a chip-name popup overlay in battle that fades the screen in/out around it). sub_80E2BC0 is the unknown
  middle state. It is a small dispatcher typical of per-frame object update routines; with no known callers
  the exact object identity is inferred only from the handler names.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0]: dispatch keyed on the object''s
    current action/state field; jump table off_80E2BB0 contains object_dimScreen+1, object_drawChipName+1,
    sub_80E2BC0+1, object_undimScreen+1: four ordered display states; dim/draw/undim handler names indicate
    a screen-dimming chip-name overlay; mov lr,pc; bx r1 with Thumb-anchors (+1) is a standard state-handler
    dispatch returning to the single pop {pc}'
