name: sprite_setAlpha_8002c7a
address: '0x08002C7A'
kind: function
status: confirmed
summary: Trampoline that sets a sprite object to alpha-blend (effect mode 4) and programs the global blend coefficients
  from the given alpha level.
interface: void sprite_setAlpha_8002c7a(u8 alpha /*r0*/, sprite object in r5, toolkit in r10); tail-calls sprite_setAlpha(r0=alpha,
  r2=4, r5=object); returns r0=0x3f, r1/r2/r3 and nz/c/v from callee; r7 preserved
details: 'Wrapper for the shared sprite effect setter sprite_setAlpha: it loads r2 with 4 (the blend/alpha effect
  mode) and jumps to sprite_setAlpha. The shared routine reads the object header''s TypeAndSpriteOffset, masks off
  the low nibble to locate the object''s sprite record, and rewrites oObjectSprite_Unk_11 keeping the top nibble
  and storing mode 4 in the low bits. It then follows oToolkit_Unk2009740_Ptr to the global blend control block:
  clears the 0xc0 bits of byte 0 (blend target bank select), stores the alpha in byte 2 (coefficient A) and 0x10
  - alpha in byte 3 (coefficient B, i.e. a complementary fade so A+B = 0x10), zeroes byte 0 (first target bank empty)
  and writes 0x3f to byte 1 (second target bank fully selected). Callers therefore see the callee''s register/flag
  side effects; r5 and r10 are pass-through and r7 is preserved.

  '
