open_questions:
- Exact identity of the "wind" record (which record the Nth sub-record refers to) is not pinned down;
  only the +0xC 16-bit clamped-field behavior is clear.
- Whether the `r7[0] == 8` test is "already destroy-pending" or "wind finished" is inferred from naming,
  not proven — could be settled by looking at which other call site arms r7 to 8.
