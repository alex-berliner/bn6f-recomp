name: BGScrollCB_BG3UpScroll
address: '0x080019FE'
kind: function
status: confirmed
summary: BG3 vertical scroll callback that advances the shared BG-scroll counter0 up by 4 pixels each frame and
  pushes the per-tile value into the active render info.
interface: 'void BGScrollCB_BG3UpScroll(void) /* in: r10 = oToolkitPtr; clobbers r1, r3, N, Z, C, V */'
details: 'Treats the global eBGScrollCBCounters block as a small counter array and ticks

  counter0 down by 4 (i.e. scrolls BG3 up by 4 lines). The raw 32-bit value is

  right-shifted by 4 to obtain the per-tile scroll, and the low 4 bits are the

  sub-tile offset that the hardware layer keeps track of. The per-tile value is

  stored as a u16 into oRenderInfo_Unk_1a on the render info pointed to by

  oToolkit_RenderInfoPtr so the background render pass can read it cheaply.

  Register contract: only r10 is meaningful on entry (Toolkit pointer), the

  return value is unused, and r1/r3 plus the condition flags are clobbered.

  Pairs with the other BGScrollCB_* scroll callbacks that share the same

  counter array.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
