name: battle_loadEnemySprite
address: '0x0811DC88'
kind: function
status: probable
summary: Loads an enemy battle sprite from a table (optional LZ77 decompress to unk_20212F8) into a free
  eStructArr2008450 slot, then configures animation, palette, priority, no-shadow, slotList=0x80, sub-entry
  palette bank 1, and sub-record field A; if slot already occupied, aborts.
interface: (r0 = sprite table index, r1 = eStructArr2008450 entry index) -> r0 = 0/1 success; clobbers
  r4,r5
details: 'r1 indexes the fixed 0x58-byte struct array via getStructFrom2008450; on success the entry is
  marked in-use (byte 0 = 1) and later tagged 0x23. r0<<2 selects a pointer from the table at byte_811DD94;
  a null pointer aborts. If the pointer''s bit0 is set, LZ77 data is decompressed to unk_20212F8 and used
  from +4, otherwise the pointer is used directly. The chosen resource is handed to initGuiSprite_8002770
  together with a per-index byte from byte_811DD14 (values 0x6C-0x6D, 0x9D-0xA0), then the sprite is configured:
  animation index from off_811DE18, animation data loaded, no shadow, palette from byte_811DE54, priority
  0, slot halfword 0x80 stored via slotList, sub-entry palette bank 1, and sub-record field A from byte_811DE36
  (mostly 3). The table''s nonzero entries reference virusBattleSprite_8244164, sprite_8253F88 and sprite_837D8E0,
  indicating enemy/virus battle graphics.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl getStructFrom2008450 with r1, then ''strb #1'' and ''strb 0x23'' into the returned struct
    marks the entity as initialized; ldr r0,[byte_811DD94 + r4] with tst/beq: null table entry exits,
    bit0 selects LZ77 decompress to unk_20212F8 vs direct pointer; call chain sprite_setAnimation/loadAnimationData/noShadow/setPalette/setPriority/slotList_storeHalfwordAndClearField
    configures a fresh battle sprite object; resource table word_8244164 (virusBattleSprite_8244164),
    sprite_8253F88, sprite_837D8E0 show the loaded graphics are battle/enemy sprites; byte_811DD14 holds
    sparse per-index IDs (0x6C,0x6D,0x9D-0xA0) passed to initGuiSprite_8002770 as the object/resource
    id'
