name: startScreen_update_802F710
address: '0x0802F710'
kind: function
status: confirmed
summary: Per-frame update for the start/title screen; advances fade transition and triggers game-load
  via the render dispatch table once the fade counter is non-zero, otherwise tears down and resets visuals/animation
  when the fade has finished.
interface: void sub_802F710(void *self /* r5 */); clobbers r0-r3, lr, N/Z/C/V
details: "Operates on a *mut StartScreen passed in r5.  Offset 4 is a u16 fade-transition\ncounter; offset\
  \ 0 is the startscreen render-dispatch/jump-table offset\n(oStartScreen_JumpTableOff_00).\nLogic:\n\
  \  - While the counter at +4 is non-zero, calls sub_802F8D8 each frame to step the fade.\n  - Always\
  \ checks IsScreenFadeActive(); if the fade is no longer active the function returns.\n  - If the counter\
  \ is still non-zero (fade in progress), writes 0x0C to +0 to mark the\n    dispatch table index that\
  \ the next startscreen_render_802F544 call will pick up,\n    which routes execution to load_game_802F756.\n\
  \  - If the counter has reached 0 (fade just completed), performs a full visual/animation\n    reset:\
  \ zero-fills the jump table at e20094c0, clears the BG palette at 0x20097a0,\n    calls display-reset\
  \ call_803D1AC, resets the OBJ/OAM subsystem via sub_81440D8,\n    zero-fills OAM via zeroFill_813D960,\
  \ clears render state at 0x200AD04, sets the\n    screen mode to 0 via sub_803F6B0, resets the animation\
  \ runner via loc_803F512,\n    and re-initialises the eStartScreenAnimationControl200B1A0 animation\
  \ control.\n  - Saves only lr; preserves r4-r7.  Tail-clean tail-call to sub_802F8D8.\n"
