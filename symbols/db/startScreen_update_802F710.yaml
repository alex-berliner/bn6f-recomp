open_questions:
- Exact meaning of offset 4 — is it a "ticks remaining" countdown or a "frames pending" latch set by the
  previous state?
- Why the 0x0C dispatch offset only writes when fade is still active — does the renderer commit to load_game
  on the next frame regardless of fade end?
- sub_802F8D8's signature and what part of the fade it advances remain untyped.
- The negative branch (counter == 0 + fade still active) being the heavy reset path suggests this is the
  exit-out-of-fade transition; whether the same path runs on every "fade finished" or only on title-screen
  exit needs confirmation.
