- What object type the spawned records represent (depends on the caller's table contents)
- Which coordinate axis (x or y) 0x34/0x44 selects inside sprite_setCoordinates
- 'Code agrees: callees match, r2 is saved to stack and compared against 0x44, swapping to 0x34 when equal
  (and 0x44 otherwise). However, only the y coordinate (r1) is set while r0 (x) is loaded from stack without
  comparison, so the summary''s claim about y=0x34 or 0x44 ''the opposite'' is correct but overstates
