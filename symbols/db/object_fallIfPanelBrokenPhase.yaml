name: object_fallIfPanelBrokenPhase
address: '0x080B910C'
kind: function
status: probable
summary: 'Battle-object phase handler: plays a sound, waits 5 frames, then branches the object''s action
  depending on whether its panel is broken or a hole.'
interface: (r5 = battle object header, no args) -> sets CurAction + phase; no return value; flags from
  PlaySoundEffect/object_getPanelParameters clobbered
details: On phase 0 (phase handler first entry, r5 = battle object) it sets CurPhase=4, CurAnim=3, plays
  sound effect 0x94, sets oObjectHeader_Flags bit 1, and loads Timer with 5. On later phase ticks it decrements
  Timer; when it expires it reads the object's PanelX/PanelY and calls object_getPanelParameters, masking
  the status word with 0x10010 (panel-broken bit 0x10 plus 0x10000, likely the hole bit). If the masked
  result equals 0x10010 the object's CurAction is set to 4 (presumably a falling/disappearing action),
  otherwise to 0x10, and CurPhase is reset to 0 either way (CurPhaseAndPhaseInitialized zeroed as a halfword,
  clearing the phase-init flag).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: first-entry branch sets CurPhase=4, CurAnim=3 and PlaySoundEffect(0x94), typical of a one-shot
    phase startup; timer loop 'ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; bgt' gates the check for
    5 frames; object_getPanelParameters result AND 0x10010 compared to 0x10010 selects CurAction=4 vs
    CurAction=0x10; callees are only PlaySoundEffect and object_getPanelParameters, matching an object
    idle/fall decision step
