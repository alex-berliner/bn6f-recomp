name: battle_statePeriodicElementDamage
address: '0x080E82D4'
kind: function
status: probable
summary: Battle-object state that repeatedly deals element-based damage (with sound 0xB7) every 20 frames
  until the effect ends, then destroys the object.
interface: (r5 = battle object) -> void; sets oBattleObject_Timer=0x14 between ticks, on exit clears list
  entry and sets CurState=CUR_STATE_DESTROY
details: Runs while the battle is active (battle_isBattleOver) and while the object's HP field is nonzero;
  decrements Timer each frame, and only when Timer reaches 0 decrements Timer2. When Timer2 hits 0 it
  calls sub_80E8326 and aborts if the result is 0xFF, otherwise builds an argument pair on the stack and
  calls sub_80D006E with r2=oBattleObject_Element, r6=oBattleObject_DamageAndStaminaDamageCounterDisabler,
  r4=1 — applying a damage hit scaled by the element. It then plays sound effect 0xB7 and reloads Timer
  with 0x14 (20 frames) for the next tick. Any battle-over, zero HP, exhausted Timer2, or 0xFF return
  leads to clearEntryOfBattleStateBattleObjectList_800F656 and state DESTROY.
