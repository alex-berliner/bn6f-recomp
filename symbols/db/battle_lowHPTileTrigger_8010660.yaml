name: battle_lowHPTileTrigger_8010660
address: '0x08010660'
kind: function
status: probable
summary: When the battle-effects low-HP flag and navi stats low-HP bit are set and HP has dropped to 25%
  or less of max, clears the navi stats flag and fires a panel tile effect at the object's position.
interface: u32 battle_lowHPTileTrigger_8010660(u32 objPtr /*r5*/, u32 r2, u32 r3) -> r0..r3, C, V
details: "Gate 1: GetBattleEffects() must have bit 3 (0x08) set — the global battle-effects low-HP trigger\
  \ flag. Gate 2: GetBattleNaviStatsByte(0xD /*alliance*/) must return a valid byte (not 0xFF) with bit\
  \ 2 (LOW_HP_BIT=0x04) set. Gate 3: Current HP (r5->HP) must be <= maxHP>>2 (25% threshold); threshold\
  \ < hp fails the check. On success the function:\n  - clears LOW_HP_BIT from the navi stats byte via\
  \ SetBattleNaviStatsByte(0xD, ...);\n  - calls sub_80E90FE with panel-action code 0x17B at the object's\
  \ PanelX/PanelY (params r2=0,r3=0,r4=2,r6=0,r7=0x17B), returning the result in r2;\n  - calls sub_800BF16\
  \ to notify the alliance (r0=object's Alliance byte, r1=1, r2=panel result), returning extra state in\
  \ r1/r3/flags.\nReturns r0=1 on the success path, r0=0 on any early gate failure. r4/r6/r7 are pushed/popped\
  \ so they are preserved across the call despite appearing in the output contract.\n"
