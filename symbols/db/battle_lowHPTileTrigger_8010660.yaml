name: battle_lowHPTileTrigger_8010660
address: '0x08010660'
kind: function
status: confirmed
summary: One-shot handler that fires a special navi panel-tile effect when a battle object's HP drops to 25% or
  below.
interface: u32 battle_lowHPTileTrigger_8010660(BattleObject *obj /*r5*/, u32 callerCtx /*r10*/) → r0 = 1 if trigger
  fired / 0 if conditions unmet; clobbers nzcv, r1-r3; preserves r4-r6
details: 'Gates in sequence: (1) effect bit 3 (mask 0x8) must be set in the global battle-effects word (GetBattleEffects).  (2)
  The navi-alliance (0xD) stats byte obtained via GetBattleNaviStatsByte_AllianceFromBattleObject must exist (≠0xFF)
  and carry the low-HP flag (bit 2, mask 0x4). (3) oBattleObject_HP must be ≤ oBattleObject_MaxHP>>2 (≤25 %). If
  all three pass, the low-HP flag is cleared with SetBattleNaviStatsByte_AllianceFromBattleObject (one-shot), then
  the panel-action dispatcher sub_80E90FE is called at the object''s (PanelX,PanelY) tile with action code 0x17B
  and mode 2.  The return value of that dispatch is queued to the object''s alliance via battle_queueEffectRequest
  (r0=alliance, r1=1, r2=action).  Any gate failure returns 0.  r5 is the BattleObject* (fields oBattleObject_MaxHP,
  oBattleObject_HP, oBattleObject_PanelX, oBattleObject_PanelY, oBattleObject_Alliance).  r10 is a caller-passed
  context word not dereferenced inside this function; it may be consumed by the external calls or simply ignored.

  '
