  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-003606'
open_questions:
- exact meaning of the packed word 0xA05FF01 and the r7=3 argument (lifetime vs. type) inside object_spawnCollisionRegion
- whether the spawned region damages enemies, cracks the panel, or applies an elemental effect
