    and re-steps while r4 stays within 1..6 (loc_80F8DC4..loc_80F8DF8); svc 6 (GBA Div) with r1=count
    leaves the remainder in r1, used as buffer index: ldrb r0,[sp+0xC,r1]; lsr 4 / lsl 0x1d+lsr 0x1d split
