name: battle_pickRandomPanelInFrontColumn
address: '0x080F8DA8'
kind: function
status: probable
summary: Scans battle columns outward from the far edge toward the object until one contains qualifying
  panels, then returns one of those panels chosen at random.
interface: (r0 = object handle for getFrontDirection, r1 = unused, r2/r3 = args forwarded to object_getPanelsInColumnFiltered;
  r5 = battle object whose [0x16] side flag selects start column 1 or 6) -> r0 = 0 if no panels found,
  else encoded panel ID (low 3 bits = column, bits 4-7 = row); clobbers r4/r6/r7
details: Reads the object's side/flip flag at [r5+0x16] to pick a starting column (1 if set, else 6),
  and negates object_getFrontDirection to get a ±1 column step. It repeatedly calls object_getPanelsInColumnFiltered,
  keeping only the step bounds 1..6, until a column yields at least one panel whose object_checkPanelParameters
  passes; the panel IDs go into a 0xC-byte stack buffer. If found, GetPositiveSignedRNG is fed to BIOS
  SWI 6 (Div) with the panel count, and the remainder in r1 indexes the buffer. The selected byte's low
  3 bits and high nibble are kept as the returned panel coordinates. If the walk exhausts columns 1-6
  without a hit, it returns 0.
