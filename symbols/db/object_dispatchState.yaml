name: object_dispatchState
address: '0x081335EC'
kind: function
status: probable
summary: Dispatches to one of six handler routines selected by the object's state field at [r5,#0x68].
interface: (r5 = object struct, uses [r5,#0x68] as index) -> calls table handler, returns its result;
  clobbers lr
details: 'Reads a pointer from off_8133600 indexed by the value at [r5,#0x68] and tail-calls it in Thumb
  (handlers are +1 addresses: sub_8133618, sub_8133648, sub_81336A0, sub_81336C4, sub_8133740, sub_813375C).
  The object pointer is passed in r5, not r0, and the callee is invoked with ''mov lr, pc; bx r0'' so
  it returns directly to this function''s caller. Field 0x68 thus acts as a state/mode index into a per-state
  function table, a typical object state-machine dispatch. No bounds check is done on the index.'
