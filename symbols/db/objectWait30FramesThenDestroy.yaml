name: objectWait30FramesThenDestroy
address: '0x080BFC94'
kind: function
status: probable
summary: Object phase that on first call writes 30 to oBattleObject_Timer and 4 to oBattleObject_PhaseInitialized,
  then each tick decrements the timer and on expiry sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY.
interface: (r5 = battle object) -> void; destroys object when oBattleObject_Timer counts to 0
details: On first call (oBattleObject_PhaseInitialized == 0) it writes 0x1E to oBattleObject_Timer and
  4 to oBattleObject_PhaseInitialized, so the delay is set up exactly once. Each frame it decrements oBattleObject_Timer;
  while the result is still >0 it just returns. When the timer hits 0 it stores CUR_STATE_DESTROY into
  oBattleObject_CurStateActionPhaseAndPhaseInitialized, ending the object. It touches only the object's
  Timer/PhaseInitialized/State fields; no sprites, no other behavior.
