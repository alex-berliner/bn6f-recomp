name: object_updateSpriteObjA1
address: '0x0811E490'
kind: function
status: probable
summary: 'Per-frame update for the sprite-0xA1 object: when global counter byte_2011E42 >= 0x10 it forces
  state byte r5+9 to 2 and clears r5+0x1c (via sub_811E558); otherwise in non-state-1 it increments r5+0x14
  by 0x8000 and subtracts from r5+0xc, and when the (r5+0xc - r5+0x14)>>16 reaches 0x58 it calls sub_811E51C/sub_811E548
  and advances the state; state 1 decrements r5+7 and resets to 0 at zero; state 2 sets r5+8=8 and skips
  movement. Every frame it writes r5+0xe/r5+0x12 via sprite_setCoordinates then sprite_update.'
interface: (r0 = ignored on entry; object state in r5) -> r0 clobbered; updates r5 state fields, writes
  sprite coords, calls sprite_update
details: Reads the global counter byte_2011E42; once it reaches 0x10, forces state byte r5+9 to 2 and
  clears halfword r5+0x1c (unless already 2). In state 2 it just sets r5+8 = 8 and skips the movement
  block. Otherwise it adds 0x8000 (a 16.16 half-pixel step) to the accumulator r5+0x14 and subtracts it
  from the fixed-point position r5+0xc, so the object moves half a pixel per frame; when the displacement
  (r5+0xc - r5+0x14, >>16) reaches the signed threshold 0x58/-0x58 from byte_811E504, it calls sub_811E51C
  and sub_811E548 and increments the state. State 1 instead counts down r5+7 and, at zero, resets the
  state to 0. Every frame it copies r5+0xe / r5+0x12 into the sprite via sprite_setCoordinates and then
  runs sprite_update.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#9] / cmp/beq chain at 811E498-811E4AC branches on the object's state byte, a classic
    update handler pattern; add r0,r0,r2 with dword_811E500=0x8000 into r5+0x14 and str r1,[r5,#0xc] shows
    a fixed-point half-pixel-per-frame movement accumulator; ldr r2, byte_811E504 (=0x58) with cmp r1,r2
    bge loc_811E4F0 is a travel-limit check ending the movement phase; state 2 path sets strb r0,#8 to
    [r5,#8] and skips to loc_811E4F8, i.e. a terminal/kind byte, while other paths call sub_811E51C and
    sub_811E548 and advance r5+9; tail calls sprite_setCoordinates from [r5,#0xe]/[r5,#0x12] then sprite_update,
    matching the paired object_initSpriteObjA1 caller
  refs:
  - bn6f/asm/asm32.s:33336
  - 0x0811E438 object_initSpriteObjA1
  - 0x0800307C sprite_setCoordinates
