  reproduce: python3 tools/asmcat.py 0x0811E490
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior: at loc_811E4AC it branches on r5+9==1, otherwise adds
    0x8000 to r5+0x14 and subtracts from r5+0xc, comparing the displacement (r5+0xc - r5+0x14) >>16 to
    0x58 at byte_811E504. However, the summary says the threshold is signed (0x58/-0x58) from byte_811E504,
    but the code only compares with 0x58 via `cmp r1, r2; bge` without an underflow branch — if r1<0 it
    always falls through to call sub_811E51C/548. Also r0 is read from byte_2011E42, not byte_2011E40
    as stated. The naming prefix should follow convention; ''object_updateSpriteObjA1'' is fine but a
    shorter ''object_updateSpriteA1'' matches the caller''s ''initSpriteObjA1'' better.; run wf investigate
    investigate-20261018-235109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
