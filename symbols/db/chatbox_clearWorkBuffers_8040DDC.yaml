name: chatbox_clearWorkBuffers_8040DDC
address: '0x08040DDC'
kind: function
status: confirmed
summary: Zero-fills the chatbox script-engine work area at unk_200BEA0 (14 slots of 0x60 bytes), each
  fill sized from a caller-supplied value scaled x8.
interface: 'void chatbox_clearWorkBuffers_8040DDC(u32 sizeIndex) — in: r0 = size/index; out: r4, r5 recorded
  as read back by callers, but the function''s push {r0-r5,lr}/pop {r0-r5,pc} actually preserves r0-r5
  unchanged; clobbers flags only.'
details: 'Takes r0, computes fill_size = r0 * 0x10 / 2 (i.e. r0 * 8 via mul + lsr #1), then loops 14 times
  (r2 = 0..0xD inclusive) calling ZeroFillByWord on unk_200BEA0 + slot*0x60 with that same fill size every
  iteration. So the 14 slots of the chatbox work area (0x60 = 96 bytes each, 0x540 bytes total region)
  are zeroed, with the fill length controlled by the argument rather than fixed to 0x60 — smaller values
  clear only the head of each slot, larger values would overlap into the next slot. unk_200BEA0 is the
  chatbox/text-script work buffer; the adjacent TextScriptBytecodeJumptable (handlers chatbox_E5_nop through
  chatbox_FF_copytext, opcodes 0xE5-0xFF) operates on this same area, so this is the chatbox reset/init
  used before running a text script. The wrapper push/pop means all registers r0-r5 and lr come back exactly
  as passed in despite ZeroFillByWord clobbering r0/r1.

  '
