name: copyObjAttributesToIWRAM_802FE0C
address: '0x0802FE0C'
kind: function
status: confirmed
summary: Copies the entire shadow OAM (iOamShadow, 0x400 bytes) into hardware OAM at 0x7000000, an end-of-frame
  sprite buffer flush.
interface: 'void oam_FlushShadowOamToHardware_802FE0C(/* preserved passthrough in r3 */); registers: in r3 (ignored,
  passed through unchanged), out r3 (same value); clobbers r0-r2, lr, NZC flags'
details: A three-line wrapper that calls CopyByEightWords(iOamShadow, 0x7000000, 0x400), i.e. it flushes the game's
  shadow OAM buffer (iOamShadow, 1024 bytes = 128 sprite entries of attribute data) to the GBA's real OAM at 0x7000000
  during VBlank or the frame-end update. The "copyObjAttributes" name reflects that the copied data are the OAM
  attribute words. The caller passes a value in r3 which is neither used nor clobbered — it survives untouched through
  the call (CopyByEightWords preserves it), so r3 acts as an opaque passthrough, likely a continuation/state token
  in a task-style calling convention. r0-r2 are used as src/dest/size arguments to the copier.
