name: battle_spawnType5ObjectFromSource_80C579E
address: '0x080C579E'
kind: function
status: confirmed
summary: Spawns a type-5 battle object and initializes it from a source object, setting its element to
  4 and linking it to a related object
interface: u32 spawnType5FromSource(r1..r4 spawnParams, r5 sourceObject, r6 damageValue, r7 relatedObject)
  -> r1 elemOrError, r2 spawnerOut, r5 sourceObject
details: "Thin spawn wrapper. Calls object_spawnType3 with kind 5 (r0=5) and the four caller-supplied\
  \ spawn parameters in r1-r4. If the spawner returns a non-null object pointer in r5, the new object\
  \ is initialized from the source object (caller r5): - copies the source oBattleObject_AllianceAndDirectionFlip\
  \ halfword\n  (alliance id plus direction-flip flag),\n- writes 4 to oBattleObject_Element, - stores\
  \ r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler\n  (a damage value or stamina-damage counter\
  \ disabler field),\n- stores r7 into oBattleObject_RelatedObject1Ptr, linking the new object\n  to the\
  \ object that spawned or owns it.\nOn spawn failure (null pointer) the initialization is skipped and\
  \ r1 keeps whatever object_spawnType3 left in it; otherwise r1 is 4 (the element value written). r2\
  \ always passes through from the spawner, and r5 passes the source object back to the caller untouched.\
  \ Tail of the function shares a literal pool slot with dword_80C57BC = 0xFFFFA000. Registers r4-r7 and\
  \ the nzcv flags are irrelevant on entry beyond the documented inputs; the caller is expected to preserve\
  \ r4-r7 itself.\n"
