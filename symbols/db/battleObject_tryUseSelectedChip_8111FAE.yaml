open_questions:
- What BattleState+0x40 specifically counts (frames? an animation/state index?) and why 0x12C.
- Settling it requires reading nearby battle step code that writes that field.
- The 9-bit chip id mask could indicate the chip id is stored in a wider field with attribute
- bits; the exact encoding in battle_getSelectedChipForUse_800ED90's return is unknown here.
