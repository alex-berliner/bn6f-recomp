name: sub_8123D54
address: '0x08123D54'
kind: function
status: hypothesis
summary: Picks one of two fixed text/label tables based on r0 and passes it to the printer routine sub_80465A0.
interface: void sub_8123D54(u32 selection /* r0 */)
details: 'A two-way dispatcher: if r0 is 0 the pointer byte_81233F0 is loaded, otherwise byte_81233F8, and the chosen
  table address is passed to sub_80465A0, which takes a single pointer argument. The two tables sit side by side
  in the same pool (0x81233F0 and 0x81233F8, 8 bytes apart), suggesting a pair of short variants of the same kind
  of text or label data — e.g. a message string set or a two-entry lookup for some on-screen text whose wording
  differs by context. r0''s value is preserved into r1 across the call only incidentally (the callee leaves r1 untouched),
  so callers cannot rely on it. Flags (c, v, nz) from sub_80465A0 pass straight through to the caller. The dispatcher
  itself is a plain thumb tail-call wrapper with no state of its own.

  '
