name: battle_spawnCollisionHitRegion
address: '0x080D43C0'
kind: function
status: probable
summary: Spawns a size-5 collision region on the acting battle object's panel using object_spawnCollisionRegion
  with packed arg 0x3205FF83 and flag word 0x4300, then triggers a brief camera shake (magnitude 2, duration
  4).
interface: (r0..r3 = ignored, uses r5 = battle object) -> r0,r1 clobbered; no return value
details: Reads oBattleObject_PanelX and oBattleObject_PanelY from the object in r5 and calls object_spawnCollisionRegion
  with those coordinates, size 5, team 0, and the packed parameter word 0x3205FF83 (loaded as a literal).
  It then calls camera_initShakeEffect_80302a8 with magnitude 2 and duration 4, producing a short screen
  shake. r4 is loaded but never used beyond passing through the literal pool, and r6/r7 are zeroed around
  the call, suggesting the callee expects those registers clear. The 5-size region and shake strongly
  suggest an area-of-effect ground/quake attack.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PanelX] / ldrb r1,[r5,#oBattleObject_PanelY] feed the spawn call
    with the object's panel position; bl object_spawnCollisionRegion with r2=5, r3=0, r4=0x3205FF83 spawns
    the field collision region; bl camera_initShakeEffect_80302a8 with r0=2, r1=4 triggers a camera shake
    right after the region spawn; callee summary 'camera_initShakeEffect' confirms the shake parameters
    (magnitude 2, duration 4)
  refs:
  - bn6f/asm/asm31.s:61609
  - 0x080302A8 camera_initShakeEffect_80302a8
  - 0x080C536A object_spawnCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080D43C0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The name fit is okay but the summary is wrong on r6/r7: asm sets r6=0 but r7=0x4300, not zero, contradicting
    ''r6/r7 are zeroed''. Also r5 (battle object pointer) is implicitly passed to object_spawnCollisionRegion
    as an additional parameter beyond r0..r4, which the summary omits. The packed 0x3205FF83 and 0x4300
    suggest this is a collision-region spawn with region flags — that part matches. Name ''battle_spawnCollisionHit''
    or similar is more neutral since ''quake'' is interpretive.; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
