name: object_initBossHpAndReservePanels
address: '0x08103D4C'
kind: function
status: probable
summary: 'Initializes a large boss-type battle object: sets its HP from the AI difficulty tier, starts
  its animation, and reserves a set of panels for it.'
interface: (r4/r5 = battle object pointer, r0 = AI difficulty tier or read via battle_getAiDifficultyTier)
  -> r0 = clobbered; sets object HP/MaxHP, CurAnim, collision region, ExtraVars
details: 'Reads the AI difficulty tier and picks a halfword from byte_8103DB4 (2500/3000/4000) to store
  into both oBattleObject_HP and oBattleObject_MaxHP, so this enemy scales with difficulty. Sets CurAnim
  to 0x40, calls sprite_setAnimation and sprite_loadAnimationData, and sets collision region 2 via object_setCollisionRegion.
  Stores the result of sub_80E7D84 into oBattleObject_ExtraVars. Then, for the object''s alliance (Alliance*3
  indexes byte_8103DA8: {3,2,1} for one side, {4,5,6} for the other), it loops over 3 panel values and
  calls object_reservePanel(panel, n) for n=1,2,3 each, reserving 9 panel/claimant combinations — consistent
  with a wide multi-tile boss footprint. No caller is known, so which boss this belongs to is unidentified.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh from byte_8103DB4 after battle_getAiDifficultyTier -> HP/MaxHP = 2500/3000/4000 by difficulty;
    mov r0,#0x40; strb into oBattleObject_CurAnim then sprite_setAnimation/sprite_loadAnimationData; object_setCollisionRegion
    with r0=2 stores region 2 in the object; loop over byte_8103DA8[Alliance*3 + i] calling object_reservePanel(panel,1/2/3)
    three times each; str sub_80E7D84 result into oBattleObject_ExtraVars
