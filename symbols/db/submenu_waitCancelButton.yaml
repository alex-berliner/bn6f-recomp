name: submenu_waitCancelButton
address: '0x08129F88'
kind: function
status: probable
summary: Per-frame state handler for a submenu that waits for the B button, plays the exit sound and stores
  the previous selection to leave the submenu.
interface: (no args read; uses r5 = submenu work struct pointer) -> r0 clobbered; updates state bytes
  at r5+1..3, r5+0x28
details: 'First it queries sub_803EAE4 (the eStruct200BC30 mode dispatcher); a result of 4 clears the
  state byte at [r5,#2] to 0, and a result of 2 switches to state 0x10, zeroes [r5,#2] and the halfword
  at [r5,#0x28], and calls sub_8132398 before returning. Otherwise it polls IsButtonPressed for JOYPAD_B;
  if B is newly pressed it plays SOUND_EXIT_SUBMENU, writes state 8 to [r5,#1], then restores the selection:
  if the flag byte [r5,#0xe] is zero it converts the value at [r5,#0x12] through the 10-entry table in
  sub_81325F4 into [r5,#2], otherwise it takes sub_81325E4''s table lookup directly, and in both cases
  sets [r5,#3] to 4 to advance. The struct at r5 is clearly a menu/submenu state block with (state, substate,
  selection, ...) fields in its first bytes.'
