open_questions:
- Semantics of the four handler slots (0-3) are unknown until sub_800E4C0, sub_800E4C8, sub_800E500 and sub_800E548
  are analyzed (e.g. touch/hit/bump/none vs. per-side handlers).
- Encoding of the oCollisionData_Direction byte values is not yet documented.
- Whether callers ever pass an index outside 0..3 (no bounds check exists; out-of-range would load a garbage pointer
  from beyond the table).
