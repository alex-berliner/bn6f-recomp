name: sub_800E498
address: '0x0800E498'
kind: function
status: confirmed
summary: Tail-dispatch trampoline that calls one of four battle-object contact handlers selected by an index, passing
  the object's collision direction and returning the handler's results directly to the caller.
interface: int battle_dispatchObjectContactHandler_800E498(u32 handlerIndex /* r0 */, BattleObject* obj /* r5 */,
  ... /* r2, r3 passed through */); // returns whatever the selected handler returns in r0/r1
details: "Pure dispatcher (trampoline) for battle object contact/collision handling. r0 is a handler\nindex (0..3)\
  \ that selects an entry from the table at off_800E4B0:\n  0 -> sub_800E4C0, 1 -> sub_800E548, 2 -> sub_800E4C8,\
  \ 3 -> sub_800E500.\nr5 must point to a BattleObject; the function loads its CollisionDataPtr\n(oBattleObject_CollisionDataPtr)\
  \ and reads the byte field oCollisionData_Direction, which is\npassed to the handler in r0. r2 and r3 are forwarded\
  \ untouched so callers can pass extra\narguments through. The call is a tail call implemented with mov lr, pc\
  \ + bx r1, so the\nselected handler returns straight to sub_800E498's caller via the trailing pop {pc}; every\n\
  register the handler leaves (r0-r12, flags) is effectively the \"return value\" of this\nfunction, which is why\
  \ the contract shows nearly everything as outputs/clobbered. The\ndirection field presumably tells the handler\
  \ which side the collision came from (front/back/\ntop/bottom or attacker/defender orientation), letting one shared\
  \ handler table serve all\ncontact cases of an object.\n"
