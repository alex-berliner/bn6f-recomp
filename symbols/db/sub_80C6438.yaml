name: sub_80C6438
address: '0x080C6438'
kind: function
status: confirmed
summary: Initializes a battle object as an item pickup (sets active flag, loads sprite 0x80/0x0C/0x13, snaps to
  panel XYZ with a small upward hop velocity, plays SFX 0xA1) and hands off to its update state.
interface: 'void sub_80C6438(void);  // uses: r5=object pointer, r10/lr=callers''  ->  r5/r8/r9/r10/r11/r12'
details: 'Operates on the battle object pointed to by r5. Sets oObjectHeader_Flags |= 0x02 (active flag). Calls
  sprite_load(0x80, 0x0C, 0x13), then sprite_noShadow(). Clears oBattleObject_CurAnim to 0 and sets oBattleObject_CurAnimCopy
  to 0xFF (forces an anim restart on next tick). Writes 0x80000 to oBattleObject_ZVelocity (a fixed-point upward
  hop). Reads oBattleObject_PanelX/PanelY and converts to world XY via object_getCoordinatesForPanels, storing into
  oBattleObject_X/Y. Sets oBattleObject_Z to 0x1000000 (a fixed height above the panel). Plays SFX 0xA1 (item get
  jingle). Sets oBattleObject_CurState = CUR_STATE_UPDATE and tail-calls sub_80C647C, which is presumably the per-frame
  updater for this state. Effectively the "spawn/pop" reaction for a battle object appearing as an item on the field.

  '
