summary: 'Run-away (L button) attempt: t = (NaviStats+0x3E + 4) / 5 vs BattleSettings.Unk_01; if not an auto-win,
  a threshold byte from off_8027014 indexed by the attempt counter dword_20349A8 decides via one GetRNGSecondary
  ((r & 0xF) < threshold); writes the outcome (2 escaped) to S20364C0+4.'
details: 'Body (asm03_0.s:1491-1563): with chatbox flag 0x80 set it instead opens a chatbox; with the chatbox state
  1 it does nothing. Otherwise it clears byte_20366C0 to 0xFF, computes t = (GetBattleNaviStatsHword( navi, 0x3E)
  + 4) / 5 and compares against GetBattleSettingsUnk01(): t > lvl escapes immediately (outcome 2 at [r5+4]). Otherwise
  it picks the threshold row by how lvl compares to 1.5t and 2t (row 0 if lvl >= 2t, row 1 if lvl >= 1.5t, else
  row 2 — off_8027014 = { 4,8,15 }, { 8,12,15 }, { 12,14,15 }), reads threshold = row[dword_20349A8] while incrementing
  that attempt counter, draws one GetRNGSecondary and escapes iff (r & 0xF) < threshold. On any path it then sets
  [r5+0xB] = 0x20, [r5+1] = 8 and clears the halfword at +2.'
