name: NPCCommand_change_movement_direction
address: '0x0809F23E'
kind: function
status: confirmed
summary: NPC script command that turns an overworld NPC by a relative amount and starts it walking in the new direction.
interface: void NPCCommand_change_movement_direction(OverworldNPCObject* npc /* r5 */, ScriptPos* scriptPos /* r6
  */); caller-saved r0, r2, r4, r6 and NZCV returned clobbered (r6 advanced past the command, flags from add r6,#2)
details: 'NPC script opcode handler (r5 = overworld NPC object, r6 = script read cursor). Reads a one-byte operand
  at [r6+1] giving a relative turn amount in compass steps (0 = 0 deg, 2 = 90 deg, 4 = 180 deg, 6 = 270 deg), adds
  it to the NPC''s current MovementDirectionReload value, wraps modulo 8, and stores the result to oOverworldNPCObject_MovementDirection.
  Then copies the "reload" config fields into the live movement fields: MovementSpeedReload -> MovementSpeed and
  MovementDistanceReload -> MovementDistance. Sets CurAction to MOVEMENT_FLAG_DEFAULT_MOVING (4) to make the NPC
  walk, zeroes the 16-bit MovementFlag_0a_Unk_0b state field, and calls npc_disableScript0x19_809f51e (disables
  script state 0x19) before advancing r6 by 2 (command + operand). Quirk: odd direction values (1,3,5,7) are the
  ones that actually move the NPC; directions 0,2,4,6 have no movement offsets defined, so they don''t move. Quirk:
  returns with r2 = movement distance, r4 = MovementDistanceReload offset, r0 = whatever the disable-script helper
  left, and NZCV set from the r6 += 2 add.

  '
