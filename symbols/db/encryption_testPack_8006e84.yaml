name: encryption_testPack_8006e84
address: '0x08006E84'
kind: function
status: confirmed
summary: Integrity-checks one byte of pack data, comparing an obfuscated copy (XOR 0x81) in IWRAM against the live
  buffer in the toolkit; returns 1 on mismatch.
interface: 'int encryption_verifyPackByte(int index) /* in: r0 = pack slot index, r10 = toolkit pointer; out: r0
  = index on match, 1 on mismatch; flags always reflect the CMP for branching; preserves r1-r7 */'
details: 'Anti-tamper/verification routine over pack data. Loads toolkit->Unk2004c20 (via oToolkit_Unk2004c20_Ptr)
  to get the live pack buffer pointer, then reads byte_20008A0[index], XORs it with 0x81, and compares it against
  the byte at the same index in that buffer. If they differ, r0 is set to 1; if they match, r0 is left holding the
  original index argument. The NZ flags always come from the comparison (CMP on match, SET_FLAGS_NZ on the returned
  1 otherwise), so callers can branch on equality regardless of the returned value. byte_20008A0 appears to be a
  second (obfuscated) copy of the pack contents kept in IWRAM for tamper detection; the 0x81 XOR is the only deobfuscation
  step. Clobbers r0, preserves r1-r7.

  '
