name: sub_800A01C
address: '0x0800A01C'
kind: function
status: hypothesis
summary: Writes 0 to the 32-bit state word at IWRAM 0x3000EA8 and returns that pointer with flags set from zero.
interface: 'void clearFlagWord_3000EA8(void); // in: lr only; out: r0 = 0, r1 = &byte_3000EA8, NZ from r0'
details: Three-instruction routine. Loads the address byte_3000EA8 (IWRAM 0x3000EA8), stores 0 there as a word,
  and returns via mov pc, lr (no stack frame, no preserved registers). It conveniently leaves r0 = 0, r1 = the cleared
  pointer, and Z/N flags reflecting 0, so callers can both branch on the result and keep using the pointer. The
  field is a 32-bit word, but the symbol is typed as a byte array; it is most likely a multi-byte state/flag/counter
  structure that some subsystem resets wholesale. No other globals, hardware registers, or flags besides NZ are
  touched.
