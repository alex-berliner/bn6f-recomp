name: submenu_positionOptionSpriteByIndex
address: '0x0812B288'
kind: function
status: probable
summary: Moves the sub-menu's option sprite (ID 0x78) to the slot of an option index looked up from the
  submenu work area, unless the disable flag is set.
interface: (r0 = index into submenu work struct r5) -> r0 = result of submenu_positionOptionSprite; r5
  = submenu struct (not saved by callee), flags from callee
details: 'Reads the flag byte at [r5,#0x1b]; if bit 0 is set it returns immediately without moving the
  sprite. Otherwise it loads a byte from the submenu struct at offset given by r0 (r1 = [r5+r0]) and halves
  it with lsr #1 to form an option index, tail-calling submenu_positionOptionSprite with sprite ID 0x78
  in r0. So the struct holds a table of raw values whose upper bits (value/2) select the option slot.
  The caller must have set r5 to the submenu work area beforehand, since this function neither receives
  nor preserves it.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst r0,#1 / bne: early-out when the [r5,#0x1b] disable flag is set (sub_812B288+4..8); ldr
    r0, off_812B2BC loads the fixed sprite ID 0x78 passed to the callee; ldrb r1,[r5,r6] then lsr r1,#1
    builds the option index from a caller-chosen entry of struct r5; b loc_812B2AC is a tail jump into
    submenu_positionOptionSprite (0x812B2AC), reusing its call/flag logic; only caller sub_8129454 runs
    on recorded menus3 routes, consistent with sub-menu cursor/sprite positioning'
