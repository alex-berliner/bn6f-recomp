name: sub_813BC98
address: '0x0813BC98'
kind: function
status: confirmed
summary: Scans the 0x31 ally/battle entries, skipping the seven reserved partner IDs, and counts per-item-index
  ranks for usable items while flagging unusable ones in a global marker array.
interface: void sub_813BC98(u32 r0 /* rank counter array base */); // clobbers r0,r1,r2,r3,lr and N/Z/C/V flags;
  preserves r4,r5,r6,r7; R5 (r7) is the "outputs" the contract notes but is just the saved scratch
details: "Builds a 7-entry reserved-id table on the stack by calling sub_813B9B4(partner, 3) and subtracting 1.\n\
  For each entry id 0..0x30, bails out if the id appears in the reserved table (covers the seven fixed\npartner\
  \ slots). Otherwise resolves the record pointer via toolkit_getUnk2004190EntryPtr_813B9FC;\nrecords whose first\
  \ 16-bit word is 0 (unused) are skipped. Live records are mapped through sub_813B780\nto obtain an item descriptor;\
  \ the byte at offset +1 selects the branch:\n  - 0 (usable item): increment rank_array[ item->index_at_+4 ] (r0\
  \ is the array base supplied by caller).\n  - 2 or other (non-usable): write entry+1 into the marker byte array\
  \ at 0x2006C88 (offset off_813BD1C).\nThe stack scratch is purely a reserved-id scratch buffer (size 0x1C = 7\
  \ words), never handed to callees.\nNote: R5/R7 in the \"outputs\" line are the restored frame values, not fresh\
  \ outputs -- the function\nhas no return register, only side effects on the caller-supplied rank array and on\
  \ A_unk_2006C88.\n"
