name: battle_waitLinkResultsSyncPhase
address: '0x08009EFC'
kind: function
status: probable
summary: Battle-state handler that waits for link sync of post-battle results, then restores result records
  and advances to phase 4 (with a 180-frame timeout fallback).
interface: (r5 = battle state struct) -> r0 = 0/unused; flags from tst/cmp
details: Uses r5 as the battle state struct (no r0 args; caller presumably sets r5). On first entry (SubPhaseInitFlag==0)
  calls sub_800B428 to reinit link work, clears the CountdownTimer halfword, and sets SubPhaseInitFlag=4.
  On subsequent frames checks battle_doBothTrackedIdsMatch_800B46C against magic 0x1f2f3f4f; if both tracked
  id slots match, resets link sync flags via battle_resetLinkSyncFlags_800B460, calls sub_800B444 to restore
  the 12-byte battle result records from the received link payloads, and writes 4 into oBattleState_StatePhaseAndInitFlag
  to advance the phase. Otherwise increments CountdownTimer, and after 180 frames writes 0xC into oBattleState_Index_00,
  which the comment ties to battle_runFrame via battle_main_8007800.
