name: ai_chargeHitDispatchByElement
address: '0x080F1334'
kind: function
status: probable
summary: Dispatches charged-attack hit handling to an element-specific handler via a two-entry jump table
  indexed by oAIAttackVars_HitElement.
interface: (r7 = attack/AI vars struct, reads oAIAttackVars_HitElement) -> tail-dispatches to table[HitElement]
  handler (Thumb, LR set via mov lr,pc), no direct return value
details: 'Reads the HitElement byte from the struct in r7, indexes the table at off_80F1348 with it, and
  performs a long Thumb call (mov lr, pc; bx r1) to the selected handler, returning straight to the caller''s
  caller on the handler''s return. The table has two entries so far in the dump: ai_chargeAttackState+1
  for index 0 and sub_80F1390+1 for index 1. This is a standard branch-table dispatch pattern; the function
  itself holds no game logic beyond selecting and calling the handler.'
