summary: Returns nonzero when the crow-lesson event flag at eStruct2001010+0x9 is set
interface: (void) -> r0 = flag byte from eStruct2001010+0x9 (0 or nonzero); flags set by tst
details: Loads the pointer to eStruct2001010 (0x2001010) and reads the single byte at offset 0x9, then
  tst r0,r0 so r0 doubles as a boolean and Z reflects it. No writes, no branches — purely a predicate
  on that flag byte. Its known caller ow_crowLessonInteraction uses it to gate the staged crow cutscene,
  so the byte is that lesson's progress/started flag. Trivial 5-instruction accessor; the meaning of the
  flag comes only from the caller's context.
