name: object_genericDestroy
address: '0x08016C8A'
kind: function
status: confirmed
summary: Generic battle-object destructor that releases the object's panel tile reserves, its collision data, and
  the object's memory.
interface: void object_genericDestroy(void); // r5 = battle object pointer, clobbers r0-r3 and flags, preserves
  r5-r7
details: "Standard destroyer for battle objects (called via each object's destructor hook with r5\npointing at the\
  \ oBattleObject struct). Performs three teardown steps in order:\n1. RemoveBattleObjectPanelReserves() — frees\
  \ any panel tiles the object had reserved\n   (e.g. objects standing on / occupying panel slots).\n2. Loads oBattleObject_CollisionDataPtr\
  \ from the object and calls\n   object_freeCollisionData(r0) to release the object's collision data block.\n3.\
  \ object_freeMemory() — returns the object struct itself to the battle object pool.\nIt reads only the CollisionDataPtr\
  \ field of the object; the object pointer itself stays\nin r5 so the final free step can find it. All outputs\
  \ (r0-r3, flags) are just whatever\nobject_freeMemory happens to leave behind; callers never rely on them.\n"
