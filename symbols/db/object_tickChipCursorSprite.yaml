name: object_tickChipCursorSprite
address: '0x0812A8A4'
kind: function
status: probable
summary: 'Per-frame update for a chip-cursor/custom-screen sprite object: runs its state handler, keeps
  uploading cursor tiles while the subsystem is active, and either fires the 0xDA completion event or
  draws the sprite once finished.'
interface: (r0/r1 unused on entry; uses global object eS200A290 and state byte at 0x200BC30) -> no return
  value; r0/r1 consumed by callees
details: 'First reads the record byte at EWRAM 0x200BC30 via eStruct200BC30_getJumpOffset00; when it equals
  8 it calls cb_8048FD4 on eS200A290, which fires completion event 0xDA arg 2 when the subsystem is no
  longer in use. It then dispatches on the state byte [r5+2] of eS200A290 through a two-entry handler
  table (sub_812A8EC, sub_812AAC0) using a lr=pc bx tailcall so handlers can return straight out. After
  the handler, it re-checks the 0x200BC30 byte: nonzero means the chip cursor is still in use, so it calls
  battleObject_setupCustomChipCursorState_803C59C with (0xDA, 2) to append the OAM entry and upload the
  next cursor tile; zero means the subsystem is done, so it falls back to sprite_drawIfFlagSet_812B504,
  which only renders via sub_811FAF4 when bit 4 (0x10) of [r5+0x1B] is set. The dual dispatch pattern
  (state machine + active/done branch keyed on 0x200BC30) matches a sprite object that tracks the custom-screen
  chip cursor.'
