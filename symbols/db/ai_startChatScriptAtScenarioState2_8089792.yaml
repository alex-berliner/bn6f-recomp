name: ai_startChatScriptAtScenarioState2_8089792
address: '0x08089792'
kind: function
status: confirmed
summary: Fetches a scenario-effect state value, launches an AI chat script two entries into it, then marks the returned
  state object with the phase byte 0x14 and reports success.
interface: int sub_8089792(u8 *state /* r5 */, u32 ctx /* r10 */); // returns r0 = 1; r2/r3 leak through from the
  chat-script call; NZCV clobbered; r4-r7 preserved
details: 'Calls battle_getScenarioEffectStateField_81421D0, which yields a value in r0 and an object pointer in
  r5. It adds 2 to the r0 value (selecting an entry two slots into some scenario-effect/chat table) and passes that
  plus the helper''s r5 pointer to ai_runChatScript (sub_8089CA4). When the chat script call returns, it stores
  the byte 0x14 (20) at the address ai_runChatScript leaves in r5, i.e. it stamps that object with state/phase value
  20 after the script has been queued. Finally it returns 1 in r0, which the callers'' state-machine dispatcher
  presumably treats as "step handled/advance". r2 and r3 are not set by this function itself; they simply carry
  whatever ai_runChatScript left in them, so downstream callers reading r2/r3 are really reading that helper''s
  outputs. r4-r7 are saved/restored around the calls, so the function preserves them for its own callers even though
  the helpers clobber them internally.

  '
