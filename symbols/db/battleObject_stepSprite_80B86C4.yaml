name: battleObject_stepSprite_80B86C4
address: '0x080B86C4'
kind: function
status: confirmed
summary: Per-frame sprite update for a battle object — syncs its coordinates with its attached object, clamps the
  current animation, and steps the sprite if the object is alive and unfrozen.
interface: u32 battleObject_stepSprite_80B86C4(u32 obj /* r5 */, u32 r10); returns the (possibly updated) object
  pointer in r5
details: Thin three-call wrapper operating on a battle object passed in r5, with r10 forwarded as an extra context/global-ish
  argument. It first calls battleObject_copyCoordsFromRelatedObject_80B8800 to sync the object's coordinates with
  the related object it is attached to, then battleObject_clampCurAnim_80B8810 to clamp the current animation frame
  to valid range, then battleObject_stepSpriteIfAliveAndUnfrozen_80B881E, which advances the sprite only when the
  object is alive and not frozen. The r5 value returned by the last call is returned to the caller, so r5 doubles
  as the in/out object pointer. Preserves r4-r5 and r10; clobbers r0-r3, flags and lr. Likely called as the standard
  per-frame sprite tick for battle objects (enemies, panels' effects, etc.).
