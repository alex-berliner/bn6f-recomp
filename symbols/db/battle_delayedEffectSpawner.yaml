name: battle_delayedEffectSpawner
address: '0x080CCBF6'
kind: function
status: probable
summary: Battle object that counts down its Timer, then spawns one effect object and marks itself destroyed.
interface: (r5 = battle object, thiscall-style) -> r0 = spawned effect object (from callee) when Timer
  expires; no meaningful return otherwise
details: Each frame it decrements oBattleObject_Timer and returns until it hits zero. On expiry it clears
  the byte pointed to by oBattleObject_ExtraVars (a per-object flag/handle), copies three words starting
  at object+0x34 (r1=[r5+0x34], r2=[r5+0x38], r3=[r5+0x3C]) as spawn parameters, adds 0x100000 (0x10<<16)
  to the third parameter, and calls the effect-object spawner (type-4 object, effect type 0). Finally
  it writes CUR_STATE_DESTROY to oBattleObject_CurState so the object removes itself. It is a one-shot
  'wait N frames, then emit an effect at given params' helper object; the ExtraVars byte clear likely
  releases a shared flag used while the delay is pending.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh/strh on oBattleObject_Timer with sub #1 and bne exit: frame countdown gating all work;
    strb r0(=0), [r1] via oBattleObject_ExtraVars: clears a flag pointed to by the object on expiry; ldmia
    r0! from r5+0x34 into r1-r3 plus r3 += 0x10<<16: packs object+0x34..0x3C fields as spawn arguments;
    bl spawn_t1_0x0_EffectObject (known: spawns type-4 battle object, effect type 0): the action taken
    on expiry; mov r0,#CUR_STATE_DESTROY; strb into oBattleObject_CurState: object self-destructs right
    after spawning'
  refs:
  - bn6f/asm/asm31.s:45641
  - 0x080E05F6 spawn_t1_0x0_EffectObject
  reproduce: python3 tools/asmcat.py 0x080CCBF6
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No callers known, so what battle object type uses this and what the words at object+0x34..0x3C mean
  (position? effect params?) is unconfirmed; the r3 += 0x100000 offset needs a caller or the spawner's
  argument layout to interpret
- Exact meaning of the ExtraVars byte (flag vs. linked-object handle) would need the code that sets it
