name: ai_attackAdvanceStep
address: '0x08100CB8'
kind: function
status: probable
summary: 'Per-frame update for an AI (enemy) attack state: on first entry it commits the object to its
  target panel and starts the move, then counts down the step timer and signals the attack''s element
  when done.'
interface: (r5 = battle object ptr, r7 = AI attack vars struct) -> void; sets oAIAttackVars_AttackElement/StepTimer/HitElement
  and object panel/anim/flag state
details: This is a state-machine step for an AI-controlled battle object's attack. If AttackElement is
  still 0 (attack not yet committed), it stamps AttackElement = 4, switches the object to animation 3,
  copies FuturePanelX/FuturePanelY into PanelX/PanelY, releases the reserved target panel, recomputes
  pixel coordinates and collision/facing via object_removePanelReserve/object_setCoordinatesFromPanels/object_updateCollisionPanels,
  clears ObjectFlags1 bit 0x40, sets the 'currently moving' flag (bit 1<<1), and loads StepTimer = 2.
  On subsequent frames (AttackElement != 0) it just decrements StepTimer; when it reaches 0 it writes
  8 into oAIAttackVars_HitElement, presumably marking the attack ready to resolve/deal its hit. r5/r7
  are the standard battle object and AI-vars registers used by the surrounding AI code.
