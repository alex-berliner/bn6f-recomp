name: battle_checkAnyAdjacentTile
address: '0x08026726'
kind: function
status: probable
summary: Runs a tile checker on all eight tiles adjacent to a battle object and reports whether any of
  them passes.
interface: (r0 = battle object pointer, passed through to checker) -> r0 = nonzero if the checker succeeded
  on at least one adjacent tile, else 0
details: 'Loads the offset table byte_80267D5 and tail-delegates to battle_checkFacingOffsets, which walks
  the 0x7F-terminated list of signed (x, y) tile offsets, mirrors each offset by the object''s facing
  direction, and calls a checker on each resulting relative tile, returning early on the first success.
  The table enumerates every neighbor: (-1,0), (-1,-1), (-1,1), (0,-1), (0,1), (1,-1), (1,1), (1,0). So
  the function is simply ''does any tile adjacent to this object pass the check''. The many other tables
  and the pointer table off_80267E8 belong to sibling wrappers, each selecting a different neighbor set
  (e.g. straight lines, diagonals, long runs up to 5 tiles).'
