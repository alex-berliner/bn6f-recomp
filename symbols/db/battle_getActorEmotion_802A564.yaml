name: battle_getActorEmotion_802A564
address: '0x0802A564'
kind: function
status: confirmed
summary: Fetches the current battle emotion/mood state for a battle actor, dispatching between the normal emotion
  lookup and an alternate path based on a flag on the actor.
interface: (r10=toolkit, r5=battle object, r4/r6 unused) -> (r0=emotion enum8?, r1=transformation, r2=mood, r3=beast_out_counter)
details: Tiny trampoline used during battle processing. It reads the toolkit's battle state pointer (r10 + oToolkit_BattleStatePtr),
  then loads the battle state's byte at oBattleState_Unk_0d (an alliance/actor selector) into r0, and the acting
  object's byte at +0x15 from r5. If that object byte is zero it calls callPossiblyGetBattleEmotion_8015B54, the
  emotion resolver that also returns transformation, mood and beast-out counter in r1-r3; otherwise it calls sub_8015B5C,
  an alternate lookup (likely for a special object class or state, e.g. objects that report a fixed/different emotion).
  All returned values are simply whatever the callee leaves in r0-r3; this routine only sets up the alliance argument.
  r4-r6 are preserved. The nz/c flags from the cmp are clobbered by the callee.
