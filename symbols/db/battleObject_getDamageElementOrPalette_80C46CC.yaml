name: battleObject_getDamageElementOrPalette_80C46CC
address: '0x080C46CC'
kind: function
status: confirmed
summary: Resolves a battle object's damage-element/palette selector, deferring to a related object's sprite palette
  or a Navi's alliance stat when overrides apply.
interface: u32 battleObject_getDamageElementOrPalette_80C46CC(oBattleObject* r5) -> u32 r0
details: "Reads the object's ExtraVars+4 field as a base selector value (element or palette index used\nfor damage\
  \ handling). Three cases:\n\n1. If ExtraVars+4 == 0xFF, the object has no own value and instead delegates: it\
  \ loads\n   RelatedObject1Ptr and returns sprite_getPalette(relatedObject), i.e. the partner/linked\n   object's\
  \ current sprite palette index.\n\n2. Otherwise, if ExtraVars+8 (a Navi ID / related-Navi field) is 0, the base\
  \ value from\n   ExtraVars+4 is returned unchanged.\n\n3. If ExtraVars+8 is nonzero, the object is tied to a Navi:\
  \ it calls\n   GetBattleNaviStatsByte_AllianceFromBattleObject with selector byte 0x0E (r1 = 0x0E, r5 =\n   this\
  \ object preserved). If that returns 0xFF (entry not found / invalid Navi), the result\n   becomes 0x0C (a fallback\
  \ index, likely the \"neutral/unknown\" palette); otherwise the base\n   value from ExtraVars+4 is returned as-is.\n\
  \nUses r5 as the object pointer (caller-provided), preserves r4/r6 of the caller apart from\nusing r4 internally\
  \ as scratch. Flags clobbered. Returns in r0. Trailing dword constants\n(0x10000, 0x100800) belong to the next\
  \ function's pool, not this one.\n"
