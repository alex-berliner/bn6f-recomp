name: battleObject_getDamageElementOrPalette_80C46CC
address: '0x080C46CC'
kind: function
previous_names:
- sub_80C46CC
status: probable
summary: Returns the element/element-like damage code for an attacking battle object, or falls back to
  its sprite palette.
interface: (r5 = attacker BattleObject*) -> r0 = element byte (0xff when not applicable) ; reads attacker
  ExtraVars[4..8], no side effects on caller-visible state
details: "Entry: r5 holds the attacking BattleObject. Loads oBattleObject_ExtraVars+4 (= ExtraVars[4])\
  \ into r0 and compares with 0xff.\n  - If equal to 0xff: there is no attacker-side override, so it falls\
  \ back to reading oBattleObject_RelatedObject1Ptr and calls sprite_getPalette on that related object;\
  \ that palette byte is returned verbatim.\n  - Otherwise: ExtraVars[4] is the attacker's element slot,\
  \ and oBattleObject_ExtraVars+8 (ExtraVars[8]) must be non-zero; otherwise r0 (the previously loaded\
  \ ExtraVars[4]) is returned.\n  - When ExtraVars[8] != 0, the function calls GetBattleNaviStatsByte_AllianceFromBattleObject(r5,\
  \ 0x0e). The \"AllianceFromBattleObject\" wrapper indexes the NaviStats of the *attacker's side*; field\
  \ 0x0E is the byte that BN5/GNL expose at offset 0xE of NaviStats (which holds a value that, in this\
  \ caller, decides whether the attacker should use the visual-element code 0xff).\n  - If that call returns\
  \ 0xff the function returns 0xc (a fixed damage-element code held in r4), else the originally loaded\
  \ ExtraVars[4] byte is returned (after being stashed in r4).\n  The role for callers is therefore: \"\
  decide which element/element-like byte should drive the next damage calc - usually the attacker's pre-computed\
  \ element, but if the attacker's navi stats have a sentinel byte use 0xc instead, and if no element\
  \ slot was set use the related object's sprite palette\".\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, [r5,#oBattleObject_ExtraVars+4]` then `cmp r0, #0xff` / `bne loc_80C46DC` shows
    r0 is the "default element" read out of ExtraVars, with 0xff meaning "no element configured". - `ldr
    r0, [r5,#oBattleObject_RelatedObject1Ptr]` + `bl sprite_getPalette` on the ==0xff branch shows the
    "no element" fallback is the sprite palette of the related object (project confirms sprite_getPalette
    returns the palette-id byte). - `ldr r1, [r5,#oBattleObject_ExtraVars+8]` + `cmp r1, #0` + `beq locret_80C46F2`
    shows ExtraVars[8] is a "has-element" gate; if zero the function returns the default element verbatim.
    - `mov r1, #0xe` + `bl GetBattleNaviStatsByte_AllianceFromBattleObject` queries NaviStats offset 0xE
    on the attacker''s side; project confirms the helper takes `(r5, r1)`. - `cmp r0, #0xff` / `bne loc_80C46F0`
    and `mov r4, #0xc` / `mov r0, r4` shows the sentinel overrides the element to a fixed 0xc, otherwise
    the previously loaded default element is returned.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080C46CC

    '
  result: the body read as described above
