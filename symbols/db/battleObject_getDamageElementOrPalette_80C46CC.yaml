open_questions:
- The exact semantics of ExtraVars[4] (element vs damage-element code) is inferred from the surrounding
  code path being a damage setup; would settle by checking callers (sub_80C4550, sub_80C458C) and what
  they do with the returned byte.
- NaviStats offset 0xE semantics is not described by the project; whether 0xff means "use visual element"
  vs "force damage code 0xc" needs caller confirmation.
- Whether ExtraVars[8] is "set" bit, "counter", or "pointer that is non-null" is not clear from this function
  alone.
