name: sub_803B522
address: '0x0803B522'
kind: function
status: hypothesis
summary: Picks a 16-byte tutorial-step descriptor for the current state and dispatches to one of two tutorial-script
  players (<0xA vs ≥0xA).
interface: void sub_803B522(u32 state /* r0 */, u32 arg1 /* r1 */, u32 arg2 /* r2 */, u32 arg3 /* r3 */); uses toolkit
  pointer via r10; clobbers r0,r1,r2,r3,r4,r5,r6,r7,r8 and NZCV; preserves r4..r9,r12
details: "Stashes four context words (R1,R2,R3,R8) into the toolbox's script-context slot\n([r10 + oToolkit_Unk200a220_Ptr]\
  \ + offsets 0x8..0x14). Indexes a 16-byte-per-entry\ntable at `byte_803B574` by state*0x10 and unpacks its fields:\n\
  \  desc[0]|desc[3]<<16 → R1 (packed u16/u8 opcode-like field)\n  desc[1] → R4, desc[2] → R5\n  desc[4..7] → R2\
  \ (u32 ptr), desc[0xC..0xF] → R3 (u32 ptr)\n  desc[8..0xB] → R7\nLoads the script-text pointer `TextScript87E36F8`\
  \ and a font/string table pointer\n`byte_86ACD60` for the downstream player. Then branches on state: <10 calls\n\
  `sub_8045FC6`, otherwise `loc_8045FE4`. Callee-saved registers are pushed\n(r4-r7 then r8) and restored across\
  \ the call, matching the thumb prologue/epilogue.\nThe 14-table entries each end with the byte 0x06 followed by\
  \ an incrementing\ncounter (0x1E..0x39 step 1, with two 0x06-separated rows stepping by 1 and a\nthird row repeating\
  \ earlier counters), suggesting states 0x1E..0x25 plus\n0x32..0x39 of an in-battle tutorial sequence.\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
