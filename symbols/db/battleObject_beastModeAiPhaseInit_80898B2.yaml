name: battleObject_beastModeAiPhaseInit_80898B2
address: '0x080898B2'
kind: function
previous_names:
- sub_80898B2
status: probable
summary: Picks the next AI sub-phase for a Beast-mode battle object by picking one of three PwrAtk phase
  IDs (0x5C / 0x18 / 0x3C) into the AI's Unk_18 state byte.
interface: '(r5 = ...AIData) -> r0 = 1 ; side effect: stores a u8 to [r5+0x18], possibly calls init helpers'
details: "Entry r5 is a pointer to an AIData struct (AIDataPtr at +0x58 of a BattleObject, see struct_inc),\
  \ and the `mov r0, #0x80 ; bl chatbox_mask_eFlags2009F38` tests bit 0x80 of the chatbox event flag word.\n\
  \    * If that bit is set (`bne loc_80898E4`), the function just returns 1 with no state change (caller-driven\
  \ loop iteration result).\n    * Else, `battleScenarioEffect_isActive_814216E` is queried; if NZ (effect\
  \ active), control falls to `sub_8142ADA`. If that returns Z, it falls back to the default Beast phase\
  \ selection via `sub_8089CDC` and writes 0x18 to AIData.Unk_18.\n    * If `sub_8142ADA` returns NZ,\
  \ the fallback writes 0x3C.\n    * If the scenario effect was inactive, the function unconditionally\
  \ calls `ai_setAIDataUnk18_8089CB0(r0=0x1e)`, then writes 0x5C to AIData.Unk_18.\n  The three magic\
  \ bytes 0x5C / 0x18 / 0x3C align with the \"Unk_18\" byte of AIData (struct offset 0x18, sitting beside\
  \ PwrAtkButton at 0x1e and PwrAtkState at 0x1d); this looks like a per-turn Beast-mode PwrAtk pick whose\
  \ value [r5+0x18] is the new action/phase index the surrounding AI loop will dispatch on. `ai_setAIDataUnk18_8089CB0(0x1e)`\
  \ looks like \"set the PwrAtk button\" given the constant 0x1e matches PwrAtkButton's offset. Always\
  \ returns 1 at the end.\n  Note that r10 (ToolkitPtr) and r7 (BattleObjectPtr, presumably) are saved\
  \ across the call, used by callees that touch Toolkit/BattleState. The exact BattleObject field(s) used\
  \ by `sub_8142ADA`/`sub_8089CB0`/`sub_8089CDC` are out of scope here.\n"
