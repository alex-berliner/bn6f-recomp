open_questions:
- What offset [r5] refers to (likely AIData.Unk_18 = 0x18, but could be BattleObject.Timer if r5 isn't
  AIData).
- Which of the three branches is the "default" Beast path vs scenario-driven variants.
- The exact meaning of the 0x5C / 0x18 / 0x3C constant — possibly AIState/AIAttackVars phases, given AIData
  also has AIState at 0x80.
