name: battle_destroyActor
address: '0x0811648C'
kind: function
status: probable
summary: 'Battle-object cleanup: marks the battle-over/actor-leaving bookkeeping, removes the actor from
  the alive-actor list, and sets its state to DESTROY.'
interface: (r0 = argument forwarded to the battle-over/actor-leaving routine; r5 = battle actor object
  pointer) -> r0 = ...; actor's state field set to CUR_STATE_DESTROY
details: The routine first calls relatedToIsBattleOver_800A11C with r0 unchanged from entry (that callee
  decrements the actor's alliance member count and clears its slots in the alive-actor turn list when
  an actor leaves). It then moves the actor pointer from r5 into r0 and calls RemoveGivenAliveBattleActorFromList,
  which clears every entry of the 8-entry alive player actor list that points to this actor. Finally it
  stores CUR_STATE_DESTROY into the actor's combined current-state/action-phase field at offset oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  which is the standard way a battle object signals it should be deleted next frame. This looks like the
  shared 'kill/despawn this battle actor' epilogue used by many battle object death handlers; r5 must
  be set up by the caller before tail-style use.
