    run wf investigate investigate-20261018-235109'
open_questions:
- What sub_80EC490 actually fires (buster shot vs. other projectile) is not shown
- Meaning of NaviStats byte 0x2C == 0x17 (0x17 = 23) — likely a transform/BeastOut state id that disables
  this attack
- Purpose of sub_80B8E58 (assumed TempAttackObjectPtr cleanup) and the 0x20181008/0x606 table entries
