name: MapScriptCutsceneCmd_clear_event_flag_range
address: '0x08035E16'
kind: function
status: confirmed
summary: Cutscene/map-script command that clears a run of event flags, reading a count byte and a start-index halfword
  from the script stream.
interface: void MapScriptCutsceneCmd_clear_event_flag_range(u32 cursor /*r7*/, u32 scriptCtx /*r10*/); // returns
  updated cursor in r7, leftover r2/r5 from ClearEventFlagRange, always returns with N=0 Z=0 (r0=1)
details: 'Map script / cutscene command handler. Reads one byte operand (reader mode 1 in r6) via ReadMapScriptByte,
  which yields the number of flags to clear in r4, then one halfword operand (reader mode 2 in r6) via ReadMapScriptHalfword,
  which yields the first flag index in r1/r4. Calls ClearEventFlagRange(start, count) to clear the flag range start..start+count-1,
  using the r10 script context. Afterwards advances the script cursor r7 by 4 on top of whatever the two readers
  consumed, returns 1 ("keep running script") in r0, and leaves the flags set by `mov r0, #1` (always N=0, Z=0)
  for the dispatcher. r2 and r5 are pass-through leftovers from ClearEventFlagRange, not meaningful outputs.'
