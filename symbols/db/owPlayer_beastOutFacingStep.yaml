name: owPlayer_beastOutFacingStep
address: '0x0808964C'
kind: function
status: probable
summary: 'Overworld Beast-Out step: sets player facing then plays the matching fixed animation (facing
  value as id on the zero path, table-indexed 0x29–0x2C on the nonzero path), clears AIData+0x18 or runs
  a sub-chain, and writes the next state byte (0x74 or 4) into [r5].'
interface: (r0 = arg passed to sub_814219C, r5 = caller object whose first byte is the next state) ->
  r0 = 1 always; flags from sub_814219C branch
details: Entry first calls sub_814219C; on the zero path it forces facing via SetOWPlayerFacingDirection(4),
  reads it back, plays fixed overworld animation 0 through owPlayer_setS200ace0_fixedAnimationSelect,
  zeroes AIData+0x18, and stores state 0x74 into [r5]. On the nonzero path it computes a direction (sub_81428D4/8142990/8142896
  chain), sets the player to that facing, and indexes byte_80896A8 by the returned direction to pick animation
  0x29-0x2C (0xFF for even indices), then calls sub_8089D26, sub_81421C8(0), sub_8089CC4 and stores state
  4 into [r5]. Both paths return 1, consistent with a cutscene/AI step handler reporting continuation.
  The per-direction byte table ties the animation to the player's facing, and the recorded beastsp route
  supports a Beast-Out overworld context.
