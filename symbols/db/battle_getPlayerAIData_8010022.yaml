name: battle_getPlayerAIData_8010022
address: '0x08010022'
kind: function
status: confirmed
summary: Returns the AI data pointer of the player-side (or opponent-side, per argument) battle object.
interface: 'bool battle_getPlayerAIData(bool alliance) -> AIData* (r0 in: alliance flag, r0 out: BattleObject.AIDataPtr)'
details: Calls battle_findPlayer with r0 passed through as the "alliance" selector (false = the player's own side,
  true = the opponent side is treated as "the player"), then loads the 32-bit AIData pointer from the returned BattleObject
  at offset oBattleObject_AIDataPtr and returns it in r0. A tiny accessor giving AI code (or callers) a handle to
  the current AI state block of the relevant player object. Preserves r4-r6 per the register contract; clobbers
  r1 and flags.
