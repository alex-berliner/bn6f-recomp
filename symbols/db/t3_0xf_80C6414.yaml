name: t3_0xf_80C6414
address: '0x080C6414'
kind: function
status: confirmed
summary: Dispatches a battle object's CurState to one of three handlers via a ROM jump table, then refreshes the
  object's sprite for timestop visibility.
interface: "void battleObject_dispatchState_80C6414(\n    /* r5 = BattleObject* (in) */\n    /* r2, r10 = unused/trashed\
  \ callers? */\n    /* r5, r8-r12 out; nzcv + r0-r4, r6, r7, lr clobbered */\n);\n"
details: "Reads oBattleObject_CurState (byte) from the object in r5, indexes a 3-entry\nROM word table at off_80C642C\
  \ (handlers stored with +1 for Thumb), and\ntail-calls through the selected entry with the original r5 preserved:\n\
  \  - state 0 -> sub_80C6438 (init)\n  - state 4 -> sub_80C647C (active)\n  - else    -> object_genericDestroy\n\
  After the dispatched handler returns, calls object_updateSpriteTimestop\nso the sprite reflects timestop state,\
  \ then returns to the caller via\npop {pc}. Lives in the battle-object subsystem (see t3_* prefix and the\noBattleObject_*\
  \ field naming). The C-version's GUEST_CALL wrappers hide\nthat this is a single bx r1 dispatch, not three separate\
  \ calls; the\n\"if/else if/else\" decoding in dispatch_state is conceptual only.\n"
