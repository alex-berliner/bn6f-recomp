name: object_execCurActionState
address: '0x080E704C'
kind: function
status: probable
summary: Dispatches the battle object's current action state to its per-state handler (dim screen / draw
  chip name / ... / un-dim screen).
interface: (r5 = battle object) -> calls handler table[curAction] with r5 context; returns handler result
  in r0
details: 'Reads oBattleObject_CurAction from the object at r5, loads a function pointer from off_80E7060[curAction],
  and performs a thumb long-call (mov lr, pc; bx r1) so handlers return via pop {pc}. The table holds
  four entries: object_dimScreen, object_drawChipName, sub_80E7070, and object_undimScreen, suggesting
  a small state machine for a battle-screen overlay sequence (dim, chip-name display, transition, un-dim).
  CurAction acts as a state index and presumably must stay within 0-3; there is no bounds check. The object
  pointer is passed implicitly via r5, not r0.'
