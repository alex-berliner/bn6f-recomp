summary: Camera; +0x30/+0x34 the camera X/Y following MegaMan (s16.16), +0x3C/+0x40 the next-frame targets the shake
  and follow code writes them from.
details: The camera-shake code (camera_doShakeEffect_80301e8, asm03_0.s:21649-21665) reads +0x30 (oCamera_X) and
  +0x34 (oCamera_Y) and writes the shaken values to +0x3C (oCamera_nextX_3c) and +0x40 (oCamera_nextY_40), so the
  pairs are current value vs. next-frame target, both live.
