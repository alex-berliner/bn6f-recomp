name: chatbox_8041818
address: '0x08041818'
kind: function
status: confirmed
summary: Evaluates a chatbox chip-condition script record, optionally triggering a sub-script and stepping past
  it.
interface: 'void chatbox_evaluateChipScript_8041818(u32 /*r4*/ scriptRecordPtr); /* out: r0=1, r1=scriptId/0xFF,
  r2=offset, r4=advanced ptr; clobbers nz c v r1 lr */'
details: "Chatbox driver step for chip-count condition records. Reads a one-byte opcode at [ptr+1]\nand dispatches:\n\
  \  - opcode 0x09: code=[ptr+2..3], sub-param=[ptr+4], threshold=[ptr+5].\n    Compares (GetChipCountOfCode(code,sub)\
  \ - chipLimit(code,sub)) against [ptr+5] and picks\n    a 9-byte record layout starting at [ptr+6..].\n  - opcode\
  \ 0x2A: code=[ptr+2..3], threshold=[ptr+4].\n    Compares GetTotalChipCount(code) against [ptr+4] and picks an\
  \ 8-byte record layout\n    starting at [ptr+5..].\n  - other: same layout as opcode 9, but threshold is chip\
  \ count alone.\nThe byte at the chosen offset is the script ID to run (or 0xFF as terminator).\nIf non-0xFF, calls\
  \ chatbox_config_80408D0(count, scriptId, offset) and keeps its\nflags / R4 / r1 outputs.\nIf 0xFF, advances R4\
  \ by 9 bytes (or 8 for opcode 0x2A) and leaves r1=0xFF.\nR0 is always returned as 1 (with NZ flags set). Clobbers\
  \ r1, r2, r4 and C/V via ADD.\n"
