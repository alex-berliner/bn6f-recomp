name: folder_tallyChipsByClass_802A4FC
address: '0x0802A4FC'
kind: function
status: confirmed
summary: Counts the chips in the currently loaded folder by class (standard/mega/giga) into a per-class tally array.
interface: void sub_802A4FC(void); /* preserves r4/r6/r7; sets NZ and clears C/V on all exits via the final CMP
  */
details: 'Checks the folder-record flag at byte_20366C0; if it is 0xFF (no folder loaded) the routine returns without
  doing anything. Otherwise it walks a halfword list of chip IDs starting at byte_20366C0+0x32 (the folder contents),
  terminated by a 0xFFFF sentinel. For each entry the low 9 bits are used as the chip ID and looked up via getChip8021DA8
  to read the chip''s class byte at ChipData+7 (0 = standard, 1 = mega, 2 = giga); classes above 2 are skipped.
  Each valid entry increments the byte dword_20367E0[class], giving a 3-byte tally of standard/mega/giga chips in
  the folder. Note that entry values above 0x1FF have their upper bits masked off before the chip lookup. Exits
  leave flags reflecting the last CMP (0xFFFF vs entry, or 0xFF vs the loaded flag).

  '
