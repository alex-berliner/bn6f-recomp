name: sub_812AEFC
address: '0x0812AEFC'
kind: function
status: confirmed
summary: Polls two chatbox eFlags (0x80 and 0x8); calls sub_8132614 unless eFlag 0x80 is set and eFlag 0x8 is clear.
interface: void chatbox_checkMaskPollInputs_812AEFC(void)
details: 'Pushes {lr}, tests chatbox eFlag 0x80 via chatbox_mask_eFlags2009F38. If that flag is clear,

  it unconditionally calls sub_8132614. If 0x80 is set, it then tests eFlag 0x8; calls

  sub_8132614 only when 0x8 is set, otherwise returns. The combined predicate is roughly

  "(~0x80) | 0x8" of the chatbox eFlags, i.e. invoke the input handler whenever the

  0x80 "input disabled / busy" mask is not active, or when the 0x8 mask explicitly requests

  a poll anyway. No arguments or return values are passed; r5/r6/r10/r11 are reported as

  outputs but reflect caller-saved state of the callees (notably sub_8132614) rather than

  this trampoline itself.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
