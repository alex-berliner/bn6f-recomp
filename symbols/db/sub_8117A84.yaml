name: sub_8117A84
address: '0x08117A84'
kind: function
status: hypothesis
summary: Copies one 0x40-byte entry (selected by index) out of a fixed table at unk_2031344 into a caller-provided
  buffer, then steps the buffer pointer to the next slot.
interface: void loadIndexedRecord64_8117A84(int index /*r0*/, u32 *dst /*r6, in/out*/); // r3 passed through untouched;
  clobbers r0-r2, lr, flags; r6 += 0x40 on return
details: 'Takes a record index in r0 and a destination buffer pointer in r6. If the

  index is <= 0x1A (27 valid records, indices 0..0x1A), it computes

  unk_2031344 + index*0x40 and copies 0x40 bytes (64 bytes = 8 words) via

  CopyByEightWords into [r6]. Whether or not the copy ran, r6 is advanced by

  0x40, so callers can loop over a sequence of records and have this routine

  walk their output buffer automatically. Out-of-range indices leave the

  destination slot untouched but still advance it (effectively writing an

  empty/skipped slot). The source table lives in EWRAM/IWRAM at 0x2031344,

  27 records * 0x40 bytes = 0x6C0 bytes total. Quirk: the bounds check uses

  signed `bgt`, so a negative index passes the check and copies from memory

  before the table. No other state is touched; r3 is preserved verbatim

  (likely a live pointer for the caller).

  '
