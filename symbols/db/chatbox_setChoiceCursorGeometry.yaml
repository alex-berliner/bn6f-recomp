- method: assembly-reading
  date: '2026-10-18'
  detail: strb [r4+4] -> oChatbox_ChoiceCursorSource, then lsl r3,#3 indexes off_80428A0 pair table; table
    words 0x1E/0x08, 0x14/0x08, 0x1E/0x09 look like width/height in 16ths for three box sizes; strb [r4+2]/[r4+3]
    -> CurTileXBlockPos/CurTileYBlockPos, table words -> CurTileWidth16/CurTileHeight16; (pos+size-2)<<3
