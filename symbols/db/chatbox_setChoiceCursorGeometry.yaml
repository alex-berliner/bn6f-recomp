name: chatbox_setChoiceCursorGeometry
address: '0x0804286C'
kind: function
status: probable
summary: Chatbox script command that loads a choice-cursor size/type and writes cursor box geometry into
  the chatbox work struct.
interface: (r0 = word-size table base off_80428A0, r4 = script ptr {?, sizeType@+4, x@+2, y@+3}, r5 =
  chatbox struct) -> r0 = 1; r4 += 5 (script advance)
details: Reads a choice-cursor type from [r4+4], stores it as oChatbox_ChoiceCursorSource, and uses it
  (x8) to index a table of {width16, height16} word pairs (0x1E/8, 0x14/8, 0x1E/9 — three standard choice-box
  sizes). It copies x ([r4+2]) and y ([r4+3]) into oChatbox_CurTileXBlockPos/oChatbox_CurTileYBlockPos,
  the size words into oChatbox_CurTileWidth16/oChatbox_CurTileHeight16, and computes (pos + size - 2)
  << 3 into oChatbox_CursorIdx and oChatbox_CursorX — pixel offsets of the cursor near the box's inner
  edge. It then advances the script pointer by 5 bytes and returns 1, so the chatbox script interpreter
  continues.
