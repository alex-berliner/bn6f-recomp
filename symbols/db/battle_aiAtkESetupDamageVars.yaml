name: battle_aiAtkESetupDamageVars
address: '0x08012210'
kind: function
status: probable
summary: 'Sets up one AI attack''s damage numbers: damage from the beast-power table entry 0xE scaled
  by the attacker''s alliance, plus fixed extra damage 0x8A.'
interface: (r0 = table index 0xE hardcoded; r5 = battle object read for Alliance byte, r7 = AI attack
  vars struct) -> r0 = 9 (next AI step/state); no flags used
details: The function loads the Alliance byte from the battle object at r5, calls battle_beastPwrAtk_addScaledBaseFromIndex_8010D04
  with r0=0xE to get an attack power scaled from the beast power-Atk table (byte_80212D4 entry 14), and
  stores the result into oAIAttackVars_Damage at r7. It then writes a fixed 0x8A into oAIAttackVars_ExtraDamage
  and clears oAIAttackVars_InitFlag. It always returns 9, which callers of this attack-handler family
  presumably use as the next AI step. The hardcoded 0xE index means it serves one specific attack; the
  pattern matches sibling attack-setup handlers that differ only in index and constants.
