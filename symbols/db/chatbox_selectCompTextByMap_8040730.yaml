name: chatbox_selectCompTextByMap_8040730
address: '0x08040730'
kind: function
status: confirmed
summary: Looks up a per-map compressed chatbox / L-button text script for the player's current map group/number
  and slot.
interface: 'u8 chatbox_selectCompTextByMap_8040730(u8 idx, struct Toolkit* r10) -> r0 = LZ77-compressed text script
  pointer; r2 = 4 * oGameState_Unk_08; r3 = &table[oGameState_Unk_08]; NZCV set from ADD r3, r2 (i.e. LD32(slotTable)
  + 4 * Unk_08). Clobbers: r1, r2, r3, NZCV. Preserves r4-r7. Uses r10.'
details: 'Selects one of two rows in off_8040770 using idx (0 = normal per-map text,

  1 = L-button text), further split into a real-world half (offset 0) and an

  internet half (offset 4) depending on whether the current

  oGameState_MapGroup is at least INTERNET_MAP_GROUP_START (in which case it

  is also reduced by that constant). The chosen root points at a table

  indexed by [mapGroup] (real or internet); for idx == 0 it indexes one more

  level by oGameState_MapNumber to land at the per-map table, while for

  idx == 1 (the L-button tables) the pointer goes straight to the per-slot

  table. The final pointer in the slot table is selected by

  oGameState_Unk_08, which is the chatbox text-slot index. The comment in

  the source explicitly tags the second row as L-button textscripts.

  Both off_realWorld_8044470 and off_realWorld_80444A8 are tables of

  LZ77Compressed<TextScriptArchive> entries per map group/number; the

  internet halves off_internet_80444C4 / off_internet_804457C mirror the

  same shape and may contain NULL entries for unavailable areas.

  '
