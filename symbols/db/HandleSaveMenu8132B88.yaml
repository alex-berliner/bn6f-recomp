name: HandleSaveMenu8132B88
address: '0x08132B88'
kind: function
status: confirmed
summary: Dispatcher for the save-menu (save/erase save data screen) scene state machine; jumps to the open/update/exit
  handler selected by the state byte.
interface: void saveMenu_DispatchState(void* work /*r5*/) — state read from work+1; all registers and flags pass
  through the selected handler (tail-dispatch via mov lr,pc / bx, returning with pop {pc}).
details: "R5 points at the save-menu work area; byte offset +1 is the current scene\nstate. The byte is used directly\
  \ (no <<2) as a byte offset into\nSaveMenuJumpTable8132B9C, so the state values stored in the work area are\n\
  word offsets themselves:\n  0 = OpenSaveMenu8132BA8   (open the save menu)\n  4 = SaveMenuUpdate8132C34 (run/update\
  \ the save menu)\n  8 = ExitSaveMenu8132CA0   (leave the save menu; called repeatedly while\n                \
  \             the screen dims)\nThe handler pointer is loaded into R0 and R1 is set to the raw state byte\nbefore\
  \ the bx call (side effects the handlers don't use as arguments).\nLR is set with mov lr,pc so the handler returns\
  \ back here, which then\nreturns to this function's caller; clobbers and preserved registers are\nentirely determined\
  \ by whichever handler runs.\n"
