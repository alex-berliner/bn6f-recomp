name: object_800372A
address: '0x0800372A'
kind: function
status: confirmed
summary: Registers a freshly allocated battle object into the per-type object slot list, returning the bumped slot
  position and count pointer to the caller.
interface: 'void registerObjectInTypeSlot(u32 r5 /* object */, ??? out_r2 /* count_ptr */, ??? out_r3 /* slot_index
  */);

  '
details: 'Reads oBattleObject_Type from the object pointed to by r5, takes the low nibble

  (the object''s type, 0..0xF) and uses it as an index into object_PtrPairs_800374C.

  Each entry is a 8-byte pair: a 32-bit slot base pointer (where object pointers are

  stored contiguously as a u32 array) and a 32-bit pointer to the running count byte.

  The current count byte is loaded, the object pointer is written into the slot table

  at slot_base + (count << 2), and the count byte is incremented.

  Returns r2 = the count_ptr (so the caller can read/modify the count) and r3 = the

  slot_index (<<2, the offset within the slot table of the entry just written).

  Touched per-type tables include dword_2039A10/byte_2036778 (type 1),

  dword_203A010/dword_203CA7C (type 2), and byte_203F750/byte_2036830 (type 3);

  types 0 and 4 are zeroed (no table).

  Side effects: mutates the slot table and its count byte for the object''s type.

  Quirks: only the low nibble of Type is used, so it indexes up to 16 type slots,

  but only 3 are populated in object_PtrPairs_800374C.

  '
