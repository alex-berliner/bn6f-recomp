open_questions:
- The convention that +8 doubles as "size in bytes" for raw entries and as "scratch buffer pointer" for LZ77 entries
  is inferred from the code; whether the GFX_SOURCE_PACKED bit was ever used by the game's own asset lists (vs.
  only by overlays/tooling) is not checked here.
- Whether a non-zero +4 destination with an LZ77 source can legally receive data that the caller expects to be 32-byte-aligned
  (the unpacked size has had 4 subtracted from its header before alignment testing) is not verified.
