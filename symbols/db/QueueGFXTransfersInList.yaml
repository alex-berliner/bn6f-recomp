name: QueueGFXTransfersInList
address: '0x08000B8E'
kind: function
status: confirmed
summary: Walks a 12-byte-per-entry list of graphics transfer requests and queues each copy to VRAM at the widest
  alignment the size permits, transparently LZ77-unpacking any entry that has GFX_SOURCE_PACKED set in its source
  word.
interface: void queueGFXTransfersInList_8000B8E(const GfxTransferEntry *list /*r0*/);
details: 'Walks an array of 12-byte entries terminated by a zero source word (so the list is implicitly

  length-bounded). Each entry''s fields are at +0 (source), +4 (dest), +8 (size / scratch buffer),

  with the layout dictated by the disassembly: ldr r0,[r7]; ldr r1,[r7,#4]; ldr r2,[r7,#8];.


  If bit 31 of the source word is set (GFFX_SOURCE_PACKED = 0x80000000), the low 31 bits are

  treated as a pointer to LZ77-compressed data and SWI_LZ77UnCompReadNormalWrite8bit is invoked

  to unpack it into the buffer held at +8 (which is therefore a scratch destination, not a size).

  The decompressed payload is prefixed by a 32-bit little-endian size header that counts itself,

  so src = buffer+4 and size = (LD32(buffer)>>8)-4 strips it before queueing. If the entry''s +4

  destination is 0 after unpacking, the entry is a pure "decompress this" request and nothing is

  queued (b 8000BEA short-circuit).


  Otherwise the entry is a plain copy and src/dest/size come directly from +0/+4/+8.


  The transfer is dispatched to one of four queueing helpers based on the widest alignment its

  byte size divides by — the cascade (size&1, size&3, size&0x1F) selects, in order,

  QueueByteAlignedGFXTransfer, QueueHwordAlignedGFXTransfer, QueueWordAlignedGFXTransfer, and

  QueueEightWordAlignedGFXTransfer. This is the GBA DMA transfer-size selection pattern.


  Loop advance is add r7, #0xc (12). r4-r7 and lr are saved/restored with push/pop; the function

  has no explicit return value (return register values are the leftovers from the last queued

  transfer; r4-r7 are preserved per their push/pop contract).

  '
