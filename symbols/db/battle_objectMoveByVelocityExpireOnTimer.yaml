name: battle_objectMoveByVelocityExpireOnTimer
address: '0x080C84E0'
kind: function
status: probable
summary: 'Per-frame battle-object update: integrates X/Y velocity into position, refreshes panel/collision/facing,
  highlights the occupied panel, and clears collision + sets CUR_STATE_DESTROY once the lifetime timer
  reaches zero.'
interface: (r5 = battle object pointer; r0/r1 unused on entry) -> r0 = destroyed (returns with state CUR_STATE_DESTROY
  on timer expiry); no meaningful return otherwise
details: 'Uses r5 as the battle object: adds oBattleObject_XVelocity to oBattleObject_X and oBattleObject_YVelocity
  to oBattleObject_Y, then recomputes PanelX/PanelY via object_setPanelsFromCoordinates and syncs collision/facing
  via object_updateCollisionPanels. It calls object_highlightPanel with the object''s PanelX/PanelY to
  mark the tile it occupies. It decrements oBattleObject_Timer; while it stays positive the object lives
  for another frame, but once it hits 0 the collision region is cleared with object_clearCollisionRegion
  and the state word is set to CUR_STATE_DESTROY. This looks like the standard scripted movement routine
  for projectiles or moving hazards that fly across the field for a fixed number of frames. The register-based
  r5 ''this'' calling convention matches other battle-object update routines.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: adds oBattleObject_XVelocity/YVelocity to X/Y then calls object_setPanelsFromCoordinates and
    object_updateCollisionPanels (lines 2-15); loads PanelX/PanelY and calls object_highlightPanel to
    mark the current tile (lines 16-19); decrements oBattleObject_Timer and branches back while > 0 (lines
    20-22); on timer expiry calls object_clearCollisionRegion and stores CUR_STATE_DESTROY into the state
    field (lines 24-26)
