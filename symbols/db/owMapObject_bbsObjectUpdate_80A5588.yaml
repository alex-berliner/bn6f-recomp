- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` ... `pop {pc}` frame matches a void leaf dispatch entry. - Four sequential `bl`
    calls before the first `bne locret_80A55CA`: each followed by `bne` to the early return — assembly
    confirms these are independent guard conditions. - `movflag EVENT_4EA` / `movflag EVENT_4EB` macros
    followed by `TestEventFlagFromImmediate` show which flags gate the BBS request check. - `ldrb r0,
    [r6,#8]` with `cmp r0, #2` / `beq loc_80A55C6` proves r6 has a byte at offset 0x8 (likely CurAction
    or CurPhase) used to bypass the BBS request handling. - Caller summary for sub_80A5514: "advances
    the object''s sub-state to 4 and tail-dispatches to sub_80A5588" — consistent with this being the
    sub-state-4 handler.'
