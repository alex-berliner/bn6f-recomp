summary: 'Per-frame update for the BBS overworld object (spawned by sub_80A5514): poll cutscene/chatbox/player-busy
  gates, run sub-state 4 BBS request logic and sprite animation.'
interface: '(r5 = owMapObjectPtr, r6 = ???, r10 = toolkitPtr, lr) -> void ; side effects: events flags
  EVENT_4EA/EVENT_4EB tested/possibly set, sprite updated'
details: "- Bails out immediately if any of these conditions hold:\n    1. `cutscene_checkOriginalCutsceneScriptPos_8036F40`\
  \ returns TRUE (cutscene script not the L-Message sentinel)\n    2. `cutscene_checkOriginalCutsceneScriptPos_8036F58`\
  \ returns TRUE (cutscene script matches the \"AskJackOut\" sentinel)\n    3. `chatbox_mask_eFlags2009F38`\
  \ reports bit 0x80 is set\n    4. `owPlayer_isBusyOrCutsceneActive_809E462` returns TRUE (player is\
  \ busy or a cutscene is active)\n    If any holds, the function skips straight to `sprite_update` and\
  \ returns.\n  - Otherwise calls the sub-state helper `sub_80A55D4`, then runs `checkBbsReqFlag_80A5744`\
  \ only when neither `EVENT_4EA` nor `EVENT_4EB` is set *and* `r6` byte offset 0x8 is not equal to 2\
  \ (so a CurAction of 2 gates BBS flag checks).\n  - Always falls through to `sprite_update` once either\
  \ the conditional BBS block is left (loc_80A55C6) or after the bail-out (locret_80A55CA).\n  - Captured\
  \ entry R5/R6 are the standard overworld object callee-saved pair, matching how the caller (sub_80A5514)\
  \ tail-dispatches.\n"
