status: probable
summary: 'Per-frame update of the overworld player: resets the movement-step state, runs the movement-state
  jumptable handler, resolves collisions/slip-run, updates layer and sprite priority, and feeds the walk/encounter
  counters.'
interface: 'void owPlayer_update(u32 r5 /* OWPlayerObject */) : r5 -> [r4 r5 r8 r9 r10 r11 r12] (captured
  exits r0 = 0x80 is caller residue, not a return)'
details: 'Zeroes oGameState_Unk_11 (via toolkit) and oOWPlayerObject_Unk_13 (twice), shifts the step history
  Unk_0e->0x0f, Unk_0d->0x0e, clears Unk_0d, and copies X/Y/Z into NextX/NextY/NextZ. Then dispatches
  off_809D450[oOWPlayerObject_JumptableIndex_09] (the six movement handlers ending in ow_player_processAction_809D75E)
  via mov lr,pc / bx. When oOWPlayerObject_wallCollision_0c is set: clampPlayerPosition_809E3D6, checkCollision_8030b6a
  on the Coords block; on a collision with EVENT_1716 set it manages the SlipRun flags (sets EVENT_173F,
  clears EVENT_IN_SLIPRUN_STATE and EVENT_173E) and calls sub_809DE60. Always runs overworld_CheckPlayerAdvanceForwardTrigger_809E46E
  and owPlayerInputTick_809DB60. When sub_809E3A2''s byte_2000AA8 gate is clear and InteractionLocked
  is set and EVENT_BE4 clear: checkZCoordModifiers_8031612 on the Coords, result stored (shifted <<0x10)
  into Z. On EVENT_1718: clears it and syncs pos/facing into 0x200ACE0 (owPlayer_809E0C8). Unless oOWPlayerObject_LayerIndexOverride
  is set, applies applyLayerEffectToOWObject_8035694; always sprite_setPriority_8002E14. If owPlayer_isMoving_809DFA0
  and no cutscene script active: adds Unk_13 to the walk counter at S2001c04+0x12 and subtracts it, clamped
  at 0, from the counters at +0x24 and +0x28 (SneakRun / LocEnemy step counters). Finally sub_809DFC0
  and sub_809DE98.

  '
