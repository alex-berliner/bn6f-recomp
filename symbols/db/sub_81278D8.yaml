name: sub_81278D8
address: '0x081278D8'
kind: function
status: hypothesis
summary: Returns the address of the entry selected by the signed byte index at struct+0xD within the 8-byte-element
  array whose base pointer is stored at struct+0x40.
interface: 'Next sub_81278D8(void *structR5); /* in: r5 = struct pointer; out: r0 = &struct->field40[index] */'
details: 'Small helper that indexes into an array of 8-byte elements. It reads a signed byte at

  r5+0xD (offset 0xD within the struct pointed to by r5), multiplies it by 8 (element

  size), and adds that to the 32-bit base pointer loaded from r5+0x40, returning the

  resulting address in r0. Because the index is sign-extended (ldrsb) and shifted left

  by 3, a negative byte value would produce an address below the array base, which may

  be intentional (e.g. indexing from the end) or simply a case where the field is always

  non-negative in practice. The struct layout touched is: +0xD = s8 index, +0x40 = base

  pointer of an array with 8-byte elements. r5 is not saved/restored by this function

  itself; callers are expected to have it set up before the call.

  '
