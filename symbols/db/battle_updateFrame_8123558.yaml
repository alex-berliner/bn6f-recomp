name: battle_updateFrame_8123558
address: '0x08123558'
kind: function
status: confirmed
summary: 'Per-frame battle update: runs three battle sub-routines and, once the screen fade finishes,
  advances the battle-object state to phase 4'
interface: void battle_updateFrame_8123558(BattleObject* r5) -> r0 (4 on phase transition, else IsScreenFadeActive's
  r0); nz clobbered (Z set iff no transition written)
details: "Sequence:\n  1. Calls sub_8123BC0, sub_8123BE0, sub_8123C00 (three unnamed battle\n     sub-updates;\
  \ all external, no typed interface yet).\n  2. Calls IsScreenFadeActive(); if ZF=1 the fade is still\
  \ active\n     (or no fade running) and the function returns immediately with the\n     caller's prior\
  \ r5 and the fade call's flags.\n  3. If the fade is NOT active (Z clear), it writes the byte 4 to\n\
  \     [r5 + 2] - the \"state\"/\"phase\" field of the BattleObject pointed\n     to by r5 (r5 is read\
  \ but never written here; +2 is a single byte).\n  4. Sets r0 = 4 and returns.\n\nRegister contract:\
  \ r5 is the only meaningful input (preserved across\nthe whole call: the prologue preserves it via the\
  \ convention and it is\nnot on the push/pop list). r6, r10, lr are passed in by the caller but\nunused.\
  \ r0, r1, r2, r3 are scratch; NZ/C/V come from the last callee\n(IsScreenFadeActive) or, on the write\
  \ path, from `mov r0, #4`.\nTail-return (`pop {pc}`) rather than `bx lr`.\n\nGame terms: this is the\
  \ main per-VBlank tick of the battle engine\nlayer sitting at this address; the \"phase 4\" byte it\
  \ writes on\nfade-out completion matches the typical NAVI/Battle state machine\nprogression used across\
  \ the BN6 codebase.\n"
