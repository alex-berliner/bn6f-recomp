- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst r0,r0; bne — first-entry initialization guarded on
    phase 0; strb r1=4 to CurPhase, r0=2 to CurAnim, r0=2 to Timer — one-shot setup of a 2-frame anim;
    ldrh/sub/strh on oBattleObject_Timer with bgt — per-frame countdown; mov r0,#CUR_STATE_DESTROY; str
    r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] — terminal transition to destroy state;
