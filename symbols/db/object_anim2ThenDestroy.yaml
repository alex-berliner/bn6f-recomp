name: object_anim2ThenDestroy
address: '0x080C8DBC'
kind: function
status: probable
summary: Battle object state handler that starts animation 2 with a 2-frame timer, then destroys the object
  when the timer expires.
interface: (r5 = battle object pointer, passed implicitly) -> sets oBattleObject_CurPhase/CurAnim/Timer
  on first entry, then oBattleObject_CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY when the
  timer hits zero
details: On the first invocation (CurPhase == 0) it advances the phase to 4, sets CurAnim = 2 and Timer
  = 2, and returns, letting the object play animation 2 for two frames. On subsequent calls it decrements
  Timer each frame; once it reaches 0 it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object loop tears the object down. r5 is the object base pointer, so this is a per-object step
  function dispatched by state, not a standalone call with arguments. No other object fields are touched,
  so animation 2 presumably handles the visual (e.g. a short poof/shrink) entirely on the renderer's side.
