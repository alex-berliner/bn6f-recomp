  reproduce: python3 tools/asmcat.py 0x080D3770
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is mostly correct: sub_80D37F4 builds a list, r6 is the count, index from ExtraVars+8
    wraps at >=r6, RNG low bits 1/5 trigger the alliance-table path via GetAllianceDependentPanelParamArgs
    + GetRandomRelativePanelFiltered, and sub_80C5F2C spawns with r4=0x20600 and copies the counter into
    r6. The summary''s ''or at a random panel on the alliance-dependent side'' understates it: the fallback
    isn''t random, it''s the deterministic far-column x = (Alliance^1)*5+1, y = source PanelY. Also the
    packed byte decode is r0 low3=x, bits4-6=y (mask 0x7), not bits 4-6 only — the proposal''s ''y (>>4)''
    wording is imprecise.; run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
