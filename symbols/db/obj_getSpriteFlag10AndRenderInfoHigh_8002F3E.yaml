name: obj_getSpriteFlag10AndRenderInfoHigh_8002F3E
address: '0x08002F3E'
kind: function
status: confirmed
summary: 'Reads two sprite/object state values at once: bit 0x10 of the object''s sprite Unk_11 flag byte into r2,
  and the high byte of the toolkit render info halfword at +2 into r0.'
interface: void obj_getSpriteFlag10AndRenderInfoHigh(ObjectHeader* object /*r0*/, Toolkit* toolkit /*r10*/) -> u8
  renderInfoHigh /*r0*/ + u8 flag10 /*r2*/; clobbers r1, r3 and flags
details: 'Takes an object header pointer in r0 and the toolkit in r10. The header''s sprite

  offset byte at oObjectHeader_SpriteOffset (+2) encodes a sprite index in its low

  nibble and a page in bits 4-7; masking with 0xF0 (shift 4 right, 4 left) yields the

  offset to the object''s sprite struct, which is added to the object pointer. From that

  sprite struct it loads the flag byte at +0x11 (oObjectSprite_Unk_11) and keeps only

  bit 0x10, returned in r2 (values 0x00 or 0x10). Separately it fetches the toolkit''s

  render info pointer (oToolkit_RenderInfoPtr at r10+8), loads the halfword at

  oRenderInfo_Unk_02 (+2), masks off the low byte with BIC 0xFF and shifts the result

  down by 8, returning bits 8-15 of that halfword in r0. The function is a pure getter:

  no writes, no branches. The .hword 0x2000 padding after the return is dead data.

  A two-register return (r0 + r2) is unusual; the caller likely uses the pair as a

  combined attribute (e.g. a render/palette-related attribute plus a sprite flag).

  '
