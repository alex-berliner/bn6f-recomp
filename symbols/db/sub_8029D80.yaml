name: sub_8029D80
address: '0x08029D80'
kind: function
status: hypothesis
summary: Fixed-argument wrapper that invokes call_sub_3005EBA with the constant set (0xF, 4, 3, 0, 7, 2) and returns
  its r1-r3 results.
interface: 'void sub_8029D80(void); /* out: r1, r2, r3 = callee results passed through; r4-r7 preserved */'
details: 'Thin thumb wrapper around call_sub_3005EBA. Loads six hardcoded constants into r0-r5 (0xF, 4, 3, 0, 7,
  2), tail-calls nothing (uses bl then pop), and returns. r4 and r5 are saved by push and restored by pop, so despite
  the wrapper writing 7 and 2 into them, the caller''s r4/r5 values survive the call; r1-r3 hold whatever the callee
  leaves there and are effectively outputs passed through to the caller. The callee call_sub_3005EBA is a shared
  subroutine dispatcher reached via the 0x08029d80 trampoline; the exact meaning of the argument set (0xF, 4, 3,
  0, 7, 2) is not visible from this stub alone. In-game purpose depends on what the shared callee does with these
  parameters, so no subsystem prefix can be assigned yet.

  '
