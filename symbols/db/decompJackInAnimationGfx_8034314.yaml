name: decompJackInAnimationGfx_8034314
address: '0x08034314'
kind: function
status: confirmed
summary: Decompresses the jack-in animation GFX and primes the chip-select screen's animation state object (r5)
  for playback.
interface: void decompJackInAnimationGfx_8034314(u32 *animStateObj /* r5 */) -> /* r5 returned; r2/r3 + nz/c/v left
  by tail callee sub_80465A0 */ r4 r6 r7
details: "Called once (per game/cabinet init path) to set up the jack-in animation used on the\nchip-select screen.\n\
  Steps:\n  1. decompAndCopyData(initRefs_8034338): four slot entries:\n     - chip-use BG map (compFile_86C23A0)\
  \ -> 0x6000020\n     - tile gfx buffer A (comp_86C2E2C)       -> eDecompBuffer2013A00\n     - tile gfx buffer\
  \ B (comp_86C33B4)       -> eTextScript201BA00\n     - palette (byte_86C22C0)                 -> palette_3001960\
  \ (0x20 bytes)\n     Terminator slot = NULL.\n  2. Clears animStateObj->byte3 (= r5+3) to 0 and writes animStateObj->word6\n\
  \     (= r5+6) from dword_8034408 (the frame count read out of the animation\n     table header pointed at by\
  \ off_8034400).\n  3. sub_8046664(off_8034400): registers/initialises the animator using the\n     animation header\
  \ table.\n  4. sub_80465A0(byte_8034370): loads the per-tile frame list, which is a\n     repeating 0x39,dest,src\
  \ triple for tile slots 0..0xE terminated by\n     0xFFFFFFFF (0xFF,0xFF,0xFF,0xFF little-endian) — a typical\
  \ BG tile\n     copy-in list rather than a sprite frame list.\nThe function takes the animation state struct pointer\
  \ in r5 and returns it in\nr5; flags are not produced here, they are whatever call_sub_80465A0 leaves.\n"
