name: chatbox_centerTextX
address: '0x08042990'
kind: function
status: confirmed
summary: Compute the centered horizontal pixel offset for the current character in a chatbox text script and write
  it into the chatbox state.
interface: 'void chatbox_centerTextX_08042990(u32 *r4 /*in: script entry, out: next entry, +3*/, u32 r5 /*chatbox
  struct ptr*/); r0=1, r2=record byte-step (offset<<2), r3=centered x byte, flags clobbered.'
details: 'r4 points to the current text-script entry; byte at r4+2 is the line/paragraph index. The per-character
  cell offset is 11*lineIndex+8 (each entry is an 11-byte slot, offset 8 being the first glyph cell). A call to
  chatbox_maskFlags_3e(2, r5) selects the box width: Z-set means full body width 0xF0, Z-clear means reduced width
  0xB0 (e.g. when a portrait or side-panel narrows the text area). The centered offset is (width - cellOffset) >>
  1. A second maskFlags_3e(2, r5) call, when Z is clear (bne taken), subtracts the active character index at r5+oChatbox_TextScriptCharIdx
  so that multi-character lines shift the start position. The final x byte (offset + charIdx) is stored as a byte
  at r5+0x94 (chatbox+0x94). A 4-byte-per-glyph advance (offset<<2) is added to the dword record pointer at r5+oChatbox_Unk_7C
  (0x7C). r4 is advanced by 3 to point to the next script entry; r0 is set to 1 as a success/continue indicator.
  r6/r7 are pushed but restored, used only as scratch for width constants 0xF0 and 0xB0.

  '
