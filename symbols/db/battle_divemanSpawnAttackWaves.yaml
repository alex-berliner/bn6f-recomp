name: battle_divemanSpawnAttackWaves
address: '0x080B9B94'
kind: function
status: probable
summary: 'DiveMan''s attack routine: for columns 1-3, finds the enemy-side row closest to him whose panel
  passes the checks and spawns a Diveman wave object there.'
interface: (r5 = battle object whose alliance/element/damage fields are read) -> r0 = destroyed; spawns
  wave objects as side effect
details: r5 is a battle object. It loops a counter from 1 to 3 (a column index) and, using parameter tables
  indexed by the object's alliance (byte_80B9BF0 for the row search, byte_80B9C04 for the final check),
  calls object_getClosestPanelMatchingRowFiltered to find the first valid row on the side opposite the
  object's facing. It then calls object_checkPanelParameters on the found panel (mask 0x10 set, 0x803
  clear) and, on success, calls spawnDivemanWaveObject_80CB1E2 passing the object's oBattleObject_Element
  and its damage field from oBattleObject_DamageAndStaminaDamageCounterDisabler. The cmp r0,r2 mid-loop
  (target row 1 for alliance 0, 6 otherwise) sets flags that are never used, so it is dead code. One wave
  per qualifying column, up to three per invocation.
