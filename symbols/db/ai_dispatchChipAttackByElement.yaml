name: ai_dispatchChipAttackByElement
address: '0x080EEA3C'
kind: function
status: probable
summary: 'Dispatcher: picks an element-specific chip-attack handler from a 3-entry jump table based on the AI attack''s
  hit element.'
interface: (r0 = element index from oAIAttackVars_HitElement, r7 = AI attack vars) -> jumps to handler sub_80EEA5C/sub_80EEA78/sub_80EEB18
  with r0 = element; returns via lr to caller's pop
details: Loads the HitElement byte from the AI attack vars struct at r7 and uses it to index off_80EEA50, a table
  of three Thumb function pointers. It sets lr = pc and branches to the selected handler, so the callee returns
  here and the single pop {pc} returns to ai_useChipAttack; r0 still holds the element for the callee. Only elements
  0–2 are valid; other values index out of the table. It is a pure trampoline with no state of its own.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement] selects the jump-table entry (asm lines 2-3); off_80EEA50 holds
    exactly three code pointers, matching a 3-element dispatch (asm lines 10-13); mov lr,pc / bx r1 makes it a tail-call
    trampoline; pop {pc} returns to ai_useChipAttack (asm lines 4-6); sole caller 0x0801056A ai_useChipAttack matches
    the chip-attack setup context
  refs:
  - bn6f/asm/asm31.s:119516
  - 0x0801056A ai_useChipAttack
  reproduce: python3 tools/asmcat.py 0x080EEA3C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree; run wf investigate
    investigate-20261019-022109'
