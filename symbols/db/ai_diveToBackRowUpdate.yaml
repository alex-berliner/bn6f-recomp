name: ai_diveToBackRowUpdate
address: '0x0810F770'
kind: function
status: probable
summary: 'AI attack step: moves the attacker down by its Y velocity, syncs its panel position, highlights
  the occupied panel, and when it lands on the enemy back row decides hit element 0xC vs 0x10 based on
  lateral alignment.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: 'Adds oBattleObject_YVelocity to oBattleObject_Y each call, then recomputes PanelX/PanelY via
  object_setPanelsFromCoordinates and object_updateCollisionPanels, and highlights the panel at (PanelX
  * side sign from DirectionFlip^Alliance, PanelY) on the 6x3 grid. It reads flag at object+0x74 (attacker''s
  side: 0 -> row 3, 1 -> row 0) and only proceeds when PanelY equals that back row. If flag at object+0x67
  is nonzero AND PanelX differs from (Alliance^1)*5+1 (near-center column of the opposite side), it clears
  object+0x77, stores the current Y into ExtraVars+0x18, and sets HitElement 0xC / AttackElement 0 — the
  aligned-hit case. Otherwise it calls sub_810FCA2 (likely a landing/recovery setup) and sets HitElement
  0x10 / AttackElement 0. This matches a flying enemy that dives to the opponent''s back row and only
  connects when it lands on the player''s column.'
