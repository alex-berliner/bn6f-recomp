name: submenu_updateCursorLoop
address: '0x0804A514'
kind: function
status: probable
summary: 'Per-frame menu loop: skips work on two state conditions, else reads held d-pad via the toolkit
  joypad pointer and advances an 8-entry cursor index in [r5+0x34], then refreshes per-entry state and
  copies background tiles; always returns 0.'
interface: () -> r0 = 0 always; updates menu state at [r5+0x34] (cursor index) and background tiles
details: First checks two early-exit/state conditions via sub_804AAD0 and sub_804AE04; if neither triggers,
  it reads the toolkit's joypad pointer (r10 + oToolkit_JoypadPtr) and passes the low-sensitivity held
  keys to menu_moveCursorUpDown_811FA22 with max index 7 (r1=7, r2=1) and the current cursor from [r5,#0x34],
  storing the returned index back to [r5,#0x34]. After the cursor update it calls sub_804AE50 and sub_804AE68
  (likely per-entry redraw/cursor-icon updates), then sub_804AA58, sub_804A8F4, and menuCopyBackgroundTiles_804A7C0
  to rebuild the menu's VRAM. Returns 0 unconditionally, typical of a menu task/state handler that keeps
  running. The r5 menu-state structure and r10 = toolkit global are assumed from standard BN6 conventions.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0,[r10,#oToolkit_JoypadPtr]; ldrh r0,[r0,#oJoypad_LowSensitivityHeld] — input read each
    frame; bl menu_moveCursorUpDown_811FA22 with r1=7, r2=1, r3=[r5,#0x34]; strh r0,[r5,#0x34] — cursor
    over 8 entries stored back; bne branches around the cursor block via sub_804AAD0/sub_804AE04 — conditional
    state/key gating; bl menuCopyBackgroundTiles_804A7C0 at end of loop — menu background refresh; mov
    r0,#0; pop {pc} — returns 0 like a continuing menu task
  refs:
