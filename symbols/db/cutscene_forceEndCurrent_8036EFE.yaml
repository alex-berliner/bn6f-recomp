name: cutscene_forceEndCurrent_8036EFE
address: '0x08036EFE'
kind: function
status: confirmed
summary: Force-ends the currently running cutscene by jumping the cutscene script interpreter onto the dummy end
  script and clearing the cutscene-active event flag.
interface: void cutscene_forceEndCurrent_8036EFE(Toolkit *toolkit /* r10 */); preserves r4-r7, clobbers r0-r3 and
  flags (leaves the flags ClearEventFlagFromImmediate returned)
details: 'Loads the cutscene state (s_02011C50-style struct) via toolkit+oToolkit_CutsceneStatePtr, then writes
  the "end marker" script id 1 (CUTSCENE_SCRIPT_UNK_MAGIC_SCRIPT_VALUE_0x1) into oCutsceneState_CutsceneScriptPos
  (offset 0x1C) and points the three following script-pointer slots (0x20, 0x24, 0x28 — current/next/pending script
  positions) all at DummyCutsceneScript, whose only job is to immediately finish the cutscene. It NULLs oCutsceneState_CutsceneScriptAfterCutsceneSkip
  (offset 0x38), so a cutscene-skip has no scene to resume into, and clears event flag 0x1731 (EVENT_1731) via ClearEventFlagFromImmediate,
  which is the flag that marks a cutscene as active. Effectively a hard abort of whatever cutscene/scripted event
  is playing, e.g. when the game needs to cancel or clean up a scene.

  '
