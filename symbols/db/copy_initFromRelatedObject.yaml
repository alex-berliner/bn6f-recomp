name: copy_initFromRelatedObject
address: '0x080BC524'
kind: function
status: probable
summary: 'Initializes a battle effect object that mirrors a related object: loads its sprite, copies the
  related object''s animation (offset by Param1/Param2), flip and panel position, then enters its update
  state.'
interface: (r5 = object header of the effect) -> r0 = sub_80BC56E result; no meaningful return otherwise
details: Uses r5 (preserved by callers/callees convention) as the object header. Loads sprite resource
  8 with param 0x14 via sprite_load, then sprite_noShadow, and clears bit 1 of oObjectHeader_Flags (unhide/visible).
  Reads oBattleObject_RelatedObject1Ptr to fetch the source object, computes CurAnim = source.CurAnim
  - Param2 + Param1, writes it to both CurAnim and CurAnimCopy, and applies it through sprite_setAnimation
  plus sprite_loadAnimationData. Copies the source's effective flip (object_getFlip/sprite_setFlip) and
  pixel position (object_setCoordinatesFromPanels), so the effect tracks the source's tile. Sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_UPDATE, calls sprite_update, and tail-calls sub_80BC56E for further setup.
