  \ `object_setAttack0` to flag/record an attack slot (likely clearing/setting\n  the `attack 0` indicator\
  \ on the source object) — this is what links the AI decision\n  to the eventual object update that plays\
  \ out the chip.\n  Calls `somethingWriteChipParams_80126E4` to populate the chip use parameters\n  (element,\
  \ damage, etc.) onto the appropriate battle object so the chip actually\n  fires correctly when the\
  \ attack object is dispatched.\n  Calls `sub_800F322` as a small bookkeeping step (probably nudges a\
  \ related state\n  counter or pointer now that the attack is staged).\n\n  Saves/restores r4, r5, r6,\
  \ r7 around this work and returns through the lr saved\n  by the caller (r4..r7 in the in/out contract\
  \ are caller-saved callee-preserved\n  regs); r0/r1 return some pair of values used by the caller for\
  \ its next phase.\n  No assembly was available, so the precise split of work between these callees\n\
  \  (which one decides the panel, which one writes the attack params) is inferred\n  from the callee\
  \ names plus the caller context rather than observed.\nevidence: |\n  - Callee `battle_getSelectedChipForUse_800ED90`\
  \ shows the function reads back the chip the actor intends to use (confirmed in callee summaries).\n\
  \  - Callee `battle_getStateUnk40_800A704` reads `oBattleState_Unk_40`, the battle-state field that\
  \ drives AI targeting/panel selection (confirmed).\n  - Callee `object_setAttack0` is the project's\
  \ \"mark attack 0 on a battle object\" primitive (named in project callee summaries).\n  - Callee `somethingWriteChipParams_80126E4`\
  \ is the project's chip-params writer onto a battle object (named in project callee summaries).\n  -\
  \ Single caller `sub_810CE1A` is hypothesised to be the AI turn action that picks a row opponent and\
  \ a panel, and decides the chip use — so this function is its downstream \"actually stage the attack\"\
  \ step.\n  - Contract in=r4/r5/r7/r10/lr; out includes r0/r1, which is consistent with returning one\
  \ or two outputs the caller threads into its next decision (e.g., a status / next-stage pointer).\n\
  uncertain: |\n  - Exact mapping of \"row opponent + panel\" decision (done in caller?) vs \"set up the\
  \ attack on that panel\" (this function) — only the caller side is a hypothesis and no assembly exists\
  \ for this function to confirm.\n  - Whether r5 holds the source battle object pointer or a target panel/related-object\
  \ pointer — the project callee summaries for `object_setAttack0` and `somethingWriteChipParams_80126E4`\
  \ take r5, but which one is which is not nailed down without assembly.\n  - Role of `sub_800F322` (called\
  \ with only r5) — likely a small related-state nudge, but unverified.\n  - What r0/r1 outputs encode\
  \ for the caller.\n"
