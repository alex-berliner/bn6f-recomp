name: ai_initBeastPwrAttackVars
address: '0x08011D38'
kind: function
status: confirmed
summary: Resets an AI attack's per-attack state block and computes the base damage for a Beast Out power attack,
  returning the next AI state (0x4A).
interface: u32 ai_initBeastPwrAttackVars(BattleContext* r5 context, AIAttackVars* r7 vars, u32 r10 ignored); returns
  u32 r0 = 0x4A (next state)
details: 'Called from the enemy AI dispatcher when a Beast Out power attack begins. r7 points to the per-entity
  AIAttackVars block; the routine zeroes oAIAttackVars_ChargeReadyFlag, oAIAttackVars_ChipUseDelay, and oAIAttackVars_AttackBoost
  (u16), sets oAIAttackVars_ExtraDamage to the fixed value 0x9E (158), then computes the base damage by calling
  battle_beastPwrAtk_addScaledBase_8012642 with base=0x28 (40) and scale=0x14 (20), storing the result into oAIAttackVars_Damage
  (u16). Always returns 0x4A in r0, which the caller uses as the next AI state/step to dispatch. r5 (battle context)
  is passed through to the damage helper and preserved; r10 is an input but unused in this body. r4-r6 preserved.

  '
