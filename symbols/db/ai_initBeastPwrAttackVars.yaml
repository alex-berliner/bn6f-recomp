name: ai_initBeastPwrAttackVars
address: '0x08011D38'
kind: function
status: probable
summary: 'Initializes an AI attack''s variables for a Beast-Power-style strike: resets charge/delay/boost,
  sets fixed extra damage, and computes the attack damage via the scaled-base helper.'
interface: (r0-r3 unused) -> r0 = 0x4a; touches AIAttackVars fields via r7, clobbers r0-r1, lr
details: Zeroes oAIAttackVars_ChargeReadyFlag, oAIAttackVars_ChipUseDelay, and oAIAttackVars_AttackBoost,
  then writes a constant 0x9e into oAIAttackVars_ExtraDamage. It calls battle_beastPwrAtk_addScaledBase_8012642
  with baseDamage=0x28 (40) and multiplier=0x14 (20, below the clamp of 5? no — 0x14=20, so the clamp
  to 5 applies), storing the returned total into oAIAttackVars_Damage. It finally returns the constant
  0x4a, which looks like an attack/action ID consumed by the AI dispatcher. r7 is assumed to point at
  the AI's attack-variable struct, so a caller must set it up before calling.
