name: bg_ReloadBackgroundRegion_5_3_81281C0
address: '0x081281C0'
kind: function
status: confirmed
summary: If a flag in the caller's background/map struct is set, redraws one fixed 23x8-tile region of a background
  layer from the tile id table at unk_2026700; otherwise does nothing.
interface: void bg_ReloadBackgroundRegion_5_3(void)  /* r5 = background/map object (flag at +0x1E), r10 = context;
  r4-r7 preserved, r0-r3 and NZCV clobbered (values from CopyBackgroundTiles on the redraw path, tested halfword
  on the skip path) */
details: 'Reads a u16 enable flag from [r5+0x1E]. When nonzero it calls CopyBackgroundTiles with hardcoded arguments:
  map layer j=5, i=3, tile block 2 (a 32x32-tile block), tile id table pointer = unk_2026700 (IWRAM), and region
  size 0x17 (23) x 8 tiles. The fixed j/i/size arguments and the shared table at unk_2026700 suggest this redraws
  one specific chunk of a particular scene''s background (e.g. a sky/parallax band re-tiled after an effect), with
  the +0x1E halfword acting as a per-object "region is dirty/enabled" gate. r4 and r5 are saved across the call
  because CopyBackgroundTiles clobbers them; on the skip path the tested halfword is left in r0 and the NZ flags
  reflect it, matching the original''s behavior. The caller''s r10 and the meaning of the object behind r5 are not
  resolved here.'
