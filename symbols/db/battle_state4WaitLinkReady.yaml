name: battle_state4WaitLinkReady
address: '0x08009784'
kind: function
status: probable
summary: 'Battle main-state phase handler: kicks off the battle intro effect once, then waits for the
  linked/cross-net battle to be ready before advancing the phase to 8.'
interface: (r5 = battle state struct) -> void; advances oBattleState_StatePhaseAndInitFlag to 8 when link
  battle is ready
details: On first run (SubPhaseInitFlag == 0) it calls battle_dispatchKindEffect_801E792 with kind 0 and
  r1 = oBattleState_State4EventCount to start the intro/effect animation, then latches SubPhaseInitFlag
  to 4 so it fires only once. On subsequent runs it polls comm_checkCrossNetBattleReady_801E754; while
  that returns nonzero it just returns (stay in this phase), and when it returns 0 it writes 8 into the
  StatePhase field of oBattleState_StatePhaseAndInitFlag, moving to the next battle phase. r5 is the battle
  state struct used by the battle sweep loop.
