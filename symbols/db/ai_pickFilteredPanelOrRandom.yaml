name: ai_pickFilteredPanelOrRandom
address: '0x081124F2'
kind: function
status: probable
summary: 'Battle-AI panel selector: finds an alliance-dependent panel behind the opponent''s rows, re-validates
  it against panel flags, and falls back to a random nearby panel.'
interface: (r0 = battle object, r5 = context entity with panel/coord bytes at +0x16/+0x17) -> r0 = chosen
  panel or 0/kept value; uses object's alliance byte at +0x13
details: r0 (saved in r4) is a battle object whose +0x13 field selects the team-dependent entry of table
  byte_81125F0; the first lookup's param/args drive object_getClosestPanelMatchingRowFiltered, which scans
  rows opposite the facing side from six rows back. If no row qualifies (r0 == 0) the function returns
  immediately. Otherwise a second alliance-dependent lookup (byte_81125E0) feeds object_checkPanelParameters,
  whose r0-r3 are pushed/popped so the param/args survive for reuse; if the panel still passes the flag
  masks the function returns with it. Only when that check fails does it call GetRandomRelativePanelFiltered
  with r6 = [r5+0x16] ^ [r5+0x17] and r4 = 5, picking a random reachable panel as replacement. Overall
  this looks like target-panel (re)selection for an AI action, with the random pick as fallback when the
  preferred panel no longer matches.
