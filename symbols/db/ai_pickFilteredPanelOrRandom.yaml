name: ai_pickFilteredPanelOrRandom
address: '0x081124F2'
kind: function
status: confirmed
summary: 'AI helper that selects a grid panel for an NPC: tries closest row-matching panel, then checks params,
  then falls back to a random relative panel.'
interface: void ai_pickFilteredPanelOrRandom(u32 obj /*r0*/, u32 battleState /*r5*/) -> r0-r3; preserves r4-r7
details: 'Reads battle.panelX (offset 0x16) XOR battle.panelY (offset 0x17) as a column/row filter, and obj.row
  (offset 0x13) as the target row. Calls GetAllianceDependentPanelParamArgs with a row-matching parameter table
  (byte_81125F0) to obtain alliance-dependent panel params (r2, r3), then calls object_getClosestPanelMatchingRowFiltered.
  If that call returns with Z set (no match), it immediately returns the r0-r3 from that call. If a match IS found
  (Z clear), it looks up a second parameter table (byte_81125E0), pushes the current r0-r3, calls object_checkPanelParameters;
  if that returns non-zero it pops and returns the saved r0-r3 (the closest-match result). Otherwise it recomputes
  the filter, sets r4=5 (relative-panel mode), and calls GetRandomRelativePanelFiltered to pick a random panel in
  a direction relative to the NPC. r4-r7 are saved/restored across the callee calls via push/pop and manual save/restore
  in the C wrapper.

  '
