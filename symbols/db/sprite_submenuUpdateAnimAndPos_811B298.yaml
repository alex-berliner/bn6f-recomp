name: sprite_submenuUpdateAnimAndPos_811B298
address: '0x0811B298'
kind: function
status: confirmed
summary: Swaps a submenu sprite's animation index and repositions it on screen according to per-type lookup
  tables.
interface: void sprite_submenuUpdateAnimAndPos(u32 spritePtr /*r5*/) -> coordTableBase /*r2*/; r4, r7
  preserved; r0–r3, r5, flags clobbered
details: 'Reads sprite type from spritePtr+4 and looks up a per-type data struct via off_811B2E4

  (entries: sSubmenu for type 0, unk_2037780 for type 1).

  For non-zero types, compares the sprite''s animation index (spritePtr+0xC) against the

  data struct''s animation index (dataPtr+0xC).  When they differ, writes the new index

  into the sprite and calls sprite_setAnimation (mode 1 if new index is 0, else mode 2),

  sprite_loadAnimationData, and sprite_noShadow.

  After the animation step, indexes a second per-type coordinate table (off_811B2F0):

  type 0 uses off_811B2F8 {0x30, 0x78, 0xC0}; type 1 uses byte_811B304 {0xE, 0x3D, 0x84, 0xCB}.

  The chosen x-value is paired with a constant y of 0x20 and passed to sprite_setCoordinates.

  Leaves the coordinate-table base address in r2 for the caller.

  r4 is passed through unchanged (not read within the function body).

  '
