name: ai_objectThrowStep
address: '0x080F0798'
kind: function
status: probable
summary: 'AI attack step that hurls an object three panels in front of the user: it launches it with computed
  ballistic speed, simulates its arc with gravity each frame, and on landing sets the resulting hit element
  depending on whether the panel is broken/holey.'
interface: (r0 = object ptr in r5, r7 = AI attack vars; reads oAIAttackVars_AttackElement as phase flag)
  -> void; writes object velocities/position/anim and oAIAttackVars_HitElement/StepTimer
details: 'On first invocation (AttackElement == 0) it sets AttackElement = 4, clears the object''s collision
  region, copies its PanelX/Y to FuturePanelX/Y, reserves the panel, plays animation 0x12, and calls math_getThrowSpeeds
  with a target computed as the object''s panel shifted 3*facingDirection panels forward, storing the
  resulting X/Y/Z velocities and a 20-frame StepTimer. Subsequent calls decrement the timer and while
  it is negative integrate X/Y/Z positions from the velocities, applying gravity constant 0xfffe8000 (-6144)
  to ZVelocity each frame and refreshing the object''s panel from its coordinates. When the timer expires
  the object''s Z16 is zeroed (it has landed) and the landing panel''s status flags are checked: flag
  0x10 (hole/broken) sets oAIAttackVars_HitElement = 4, otherwise 8. r5 is the thrown battle object, r7
  its AI attack-state block.'
