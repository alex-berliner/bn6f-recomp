- Which battle object uses this handler — no caller or action-table reference is known
- Exact meaning of panel-flag mask 0x10010 (likely hole-related bits) and what actions 4 and 0x18 do for
  this object
- The phase-0 path matches (sets CurPhase=4, CurAnim=3, plays 0x94, ORs 0x2 into flags, stores 2 to Timer),
  and the panel branch correctly masks with 0x10010 and routes CurAction to 4 vs 0x18, resetting CurPhase/PhaseInitialized.
  The only nit is that r0 on entry is the CurPhase byte, not a 'phase 0 flag' — it's just read for the
  tst. Name 'battle_phaseWaitCheckPanel' is fine but slightly awkward; 'battle_phaseCheckPanel' better
