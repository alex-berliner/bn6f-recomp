name: battle_phaseCheckPanel
address: '0x080BA7A0'
kind: function
status: probable
summary: Per-object battle phase that on phase 0 sets up anim/sound/flags and arms a 2-tick wait, then
  on expiry reads the underlying panel status and branches CurAction to 4 or 0x18 based on a 0x10010 mask
  match.
interface: (r0 = phase 0 flag, ignored in asm; r5 = battle object pointer) -> r0 = clobbered; updates
  oBattleObject_CurPhase/CurAnim/CurAction/Timer and oObjectHeader_Flags
details: Standard per-object phase dispatcher. On phase 0 it sets CurPhase=4, plays sound effect 0x94,
  sets the animation to 3, ORs bit 1 into oObjectHeader_Flags (marks something active/visible), stores
  2 into the Timer word, and returns. On subsequent calls it decrements oBattleObject_Timer; when it hits
  0 it reads the panel status flags for the object's PanelX/PanelY via object_getPanelParameters and masks
  with 0x10010. If both bits match (panel is in that specific state, e.g. a hole/broken panel combination)
  it switches to CurAction=4, otherwise CurAction=0x18; both paths reset CurPhase/PhaseInitialized to
  0 so the new action starts fresh.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: Phase 0 branch writes CurPhase=4, CurAnim=3 and calls PlaySoundEffect(0x94) then sets a header
    flag bit; Timer word at oBattleObject_Timer is decremented and gates all later logic (bgt locret);
    object_getPanelParameters is called with the object's own PanelX/PanelY and result masked against
    0x10010; Branch on the masked panel state selects CurAction 4 vs 0x18, each resetting CurPhaseAndPhaseInitialized
    to 0; Callers unknown, so the object identity (and thus the meaning of sound 0x94 / actions 4 and
    0x18) is inferred only from structure
