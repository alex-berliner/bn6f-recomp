open_questions:
- What AIData_Unk_02 == 1 actually represents semantically (AI substate? "clean kill" mode?). Its value
  semantics come from elsewhere.
- Why the kill targets the object in oAIData_Unk_54 instead of the current r5 object (likely a parent/child
  or counter-attacker relationship, but unverified).
- Whether 0x100 here is genuinely OBJECT_FLAGS_BUBBLED or a co-incident constant (the BIT pattern matches
  but the comment in CollisionData.inc calls bit 8 OBJECT_FLAGS_UNK_8; bit 31 is BUBBLED). This needs
  cross-checking with how object_getFlag lays out the flags word.
