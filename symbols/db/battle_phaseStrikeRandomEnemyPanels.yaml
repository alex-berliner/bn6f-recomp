name: battle_phaseStrikeRandomEnemyPanels
address: '0x080BD156'
kind: function
status: probable
summary: Battle-object phase handler that plays a sound, spawns a temp attack object linked to the owner,
  then spawns effects on random enemy panels for a set duration before advancing to phase 8.
interface: (r5 = battle object, r0 = phase-init flag byte read from it) -> mutates battle object fields;
  sets CurPhaseAndPhaseInitialized=8 when done
details: On first entry (PhaseInitialized==0) it sets the object's animation to 5 (CurAnimCopy=0xFF so
  it sticks), reads ExtraVars+4 into r0 for sub_80B8E58, loads r4=0x10B03 and r7=r5+0x64, spawns a type-1
  subtype-5 temp attack object tied to this object, plays sound effect 0xB0, sets Timer=15, and spawns
  an effect on a random enemy-occupied panel via battle_spawnEffectOnRandomEnemyPanel, then marks the
  phase initialized (flag=4). While active it spawns another random-panel effect when Timer hits 10 and
  again when it hits 5, decrementing Timer each frame. When Timer expires it decrements Timer2; when Timer2
  also expires it moves the object to phase 8, otherwise it clears PhaseInitialized so the phase re-runs
  its init.
