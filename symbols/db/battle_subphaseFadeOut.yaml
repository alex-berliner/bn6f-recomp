name: battle_subphaseFadeOut
address: '0x08009C2A'
kind: function
status: confirmed
summary: 'Battle transition fade-out subphase: starts a screen fade once, then when it completes stops the battle
  music, frees the battle objects, and advances battle main to state 8.'
interface: void battle_subphaseFadeOut(void); // battle state ptr in r5; reads oBattleState_SubPhaseInitFlag (byte)
  and writes oBattleState_Index_00 (word); returns via caller trampoline preserving r4-r7
details: 'Runs once per frame while the battle main state machine is in this subphase. On first entry (SubPhaseInitFlag
  == 0) it calls SetScreenFade(0xC, 0x10) to start a fade-out (fade mode 0x0C, 0x10 frames) and stores 4 into the
  SubPhaseInitFlag byte at r5+oBattleState_SubPhaseInitFlag so setup is not repeated. On subsequent frames it polls
  IsScreenFadeActive via the Z flag: while the fade is still running (Z set) it returns immediately. Once the fade
  finishes it calls musicGameState_8000784 (stops/silences the battle music), then FreeAllObjectsOfSpecifiedTypes
  with r0 = 0x1A to release every battle object of type 0x1A, and finally stores 8 into the word at r5+oBattleState_Index_00
  so battle main (battle_main_8007800) advances to its next state (state 8, via sub_8007B80). r4/r6/r7 are preserved
  across the whole routine; the values passed to musicGameState_8000784 and FreeAllObjectsOfSpecifiedTypes in r2/r4-r7
  are just whatever the caller left / the previous callee left, matching the original''s register behavior rather
  than meaningful arguments.'
