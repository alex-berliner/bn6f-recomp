name: battle_subphaseFadeOut
address: '0x08009C2A'
kind: function
status: probable
summary: Battle sub-phase that fades the screen out, then on fade completion stops the music, frees object
  type 0x1A, and advances the battle state to 8.
interface: (r5 = battle state struct) -> void; sets oBattleState_SubPhaseInitFlag, oBattleState_Index_00
details: 'Standard init-then-poll sub-phase: first call starts a screen fade via SetScreenFade(0xC, 0x10)
  and sets oBattleState_SubPhaseInitFlag to 4. Later calls wait on IsScreenFadeActive; once the fade is
  finished they call musicGameState_8000784 to turn BGM off, free all objects of type 0x1A with FreeAllObjectsOfSpecifiedTypes,
  and store 8 into oBattleState_Index_00, which the battle main loop (sub_8007800) reads to dispatch sub_8007B80.
  Runs as a step of the battle-state machine on the battlesweep/beastsp routes.'
