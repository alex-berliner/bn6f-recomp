open_questions:
- The actual semantic of the dispatch (which of the many per-frame handlers
- each table slot points to) is hidden behind the BX target; only the off_
- value disassembly would name the slots.
- Whether eStruct2001010's first byte is exactly the `SubsystemIndex` (0x00
- field of GameState) or a separate object-subsystem selector needs the
- EWRAM map cross-referenced; both struct sets list a `u8 SubsystemIndex` /
- '`u8 Index_00` at offsets that fit.'
