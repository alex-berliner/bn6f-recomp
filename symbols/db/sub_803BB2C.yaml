name: sub_803BB2C
address: '0x0803BB2C'
kind: function
status: confirmed
summary: Selects and displays a network-related text script based on the current main jump table phase.
interface: void chatbox_dispatchNetworkScript_803BB2C(TextScriptArchive *archive /*r0*/, Toolkit *toolkit /*r10*/);
  // preserves r4-r7, clobbers r1-r3
details: 'Reads a byte at (toolkit + oToolkit_MainJumptableIndexPtr) to determine which network protocol state the
  player is in. Dispatches to one of three paths: (1) index 0x28 or 0x30 (connection-request phase): calls chatbox_runScript_803FD9C
  with the TextScriptNetworkRequestConnection archive; (2) index 0x4C (folder-entry phase): calls sub_8123360 which
  returns 0 or 1 (boolean variant selector), uses that as an index into a 2-entry pointer table (TextScriptNetworkEnterFolderNamePtrs:
  NetworkEnterFolderName0/1), then calls chatbox_runScript_803FD9C with the selected archive; (3) any other index:
  calls chatbox_runScriptAndSetWhiteDot803FE74 with TextScript87E36F8, which also sets the white-dot indicator on
  the chatbox cursor. The function pushes {r4-r7,lr} to guarantee preservation even though callees may clobber r4/r5.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
