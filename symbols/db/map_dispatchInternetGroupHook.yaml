name: map_dispatchInternetGroupHook
address: '0x08035028'
kind: function
status: probable
summary: At map load, dispatches to a per-internet-map-group hook routine, passing the saved real-world
  map id's two bytes as arguments.
interface: () -> tail-calls jumptable handler with r0 = savedRealWorldMapId & 0xFF, r1 = savedRealWorldMapId
  >> 8; no return value of its own
details: Reads oToolkit_GameStatePtr->oGameState_SavedRealWorldMapId and splits it into low (r0) and high
  (r1) bytes. If oGameState_MapGroup is below INTERNET_MAP_GROUP_START it returns immediately. Otherwise
  it subtracts INTERNET_MAP_GROUP_START, multiplies by 4, and loads a pointer from UnkInternetMapGroupJumptable_8034784;
  a null pointer also causes an immediate return. Non-null entries are invoked via the lr=pc thumb long-call
  trick, so the handler is a tail call that receives the split id bytes — meaning the hook can behave
  differently depending on the real-world map the player entered the internet area from. Only the map
  loader is seen calling it, right after clearing per-map work and before/around spawning the player and
  NPCs.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0,[r5,#oGameState_SavedRealWorldMapId]; lsr r1,r0,#8; and r0,0xff — splits saved real-world
    map id into two argument bytes; cmp r7,#INTERNET_MAP_GROUP_START / blt locret — hook only applies
    to internet map groups; lsl r7,#2; ldr r6,[off_8035050,r7]; tst/beq — 4-byte-per-group jumptable with
    null = skip; mov lr,pc; bx r6 — thumb long-call tail call, so r0/r1 are arguments to the group handler;
    Caller map_8034B4C (map loader, which installs on-init/on-update scripts) is the only observed call
    site
