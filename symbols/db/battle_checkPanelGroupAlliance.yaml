name: battle_checkPanelGroupAlliance
address: '0x0800D6CC'
kind: function
status: probable
summary: Verifies that all three panels of a battlefield panel-group still carry the alliance value recorded
  in the unk_2034010 entry for that group, returning 1 if they all match.
interface: (r0 = group/panel-area index into unk_2034010 (8-byte records), r1 = alliance value to confirm)
  -> r0 = 1 if group state byte equals r1 and all 3 panels' alliance byte equals it, else r0 = 0
details: Indexes unk_2034010 by r0*8 and loads the record's first byte as the group's current alliance
  value (r6). If that byte differs from the caller-supplied r1, it fails immediately. Otherwise it loops
  slots 1..3, calling object_getPanelDataOffset(group, slot) to get each panel's data pointer, and checks
  the oPanelData_Alliance byte against r6; any mismatch or null pointer fails. Only if all three panels
  match does it return 1. Neighboring callers sub_800D636/sub_800D668 in the same blob use the same table,
  suggesting a set of panel-state helpers (likely per-column panel conversion state used by battle effects).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mul r2,#8 / ldr r3,=unk_2034010 / ldrb r6,[r3] reads the group's stored state byte from an 8-byte
    record; cmp r6, r1 / bne loc_800D6FC returns 0 when the stored alliance differs from the expected
    r1; loop slots 1..3 calls object_getPanelDataOffset and compares ldrb [r0,#oPanelData_Alliance] with
    r6; returns 1 only after all three slots pass, else 0 at loc_800D6FC
  refs:
  - bn6f/asm/object.s:4413
