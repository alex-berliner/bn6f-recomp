name: t3_0x36_80CAB68
address: '0x080CAB68'
kind: function
status: confirmed
summary: Per-frame dispatcher that tail-calls a battle object's current-state phase handler based on its CurState
  byte.
interface: "void t3_0x36_80CAB68(u32 /*r5*/ object_addr);\n    // in:  r5 = battle object base pointer\n    // out:\
  \ r5/r8/r9/r10/r11/r12 (handler-defined)\n    // clobbers nz/c/v, r0-r4, r6-r7, lr\n"
details: 'Reads oBattleObject_CurState (a single byte at an offset into the battle-object

  record held in r5) and uses it as an index into a 3-entry Thumb dispatch table

  at 0x80CAB7C. Each entry stores (handler+1) so the Thumb bit is set, allowing

  a direct `bx r1` tail-call without an extra mode flip. The handlers in the

  table are: battle_object_SetStateUpdatePhase_80CAB88 (state 0),

  sub_80CAB90 (state 4), and battle_objectDestroyWithRelated2Unlink_80CAC44

  (state 8). The frame pops lr into pc on exit, so the function is a true

  tail-call dispatcher (no return path of its own). Struct field referenced:

  oBattleObject_CurState on the battle-object structure passed via r5.

  '
