name: blitTileBlockToRowBuffer_802C4B6
address: '0x0802C4B6'
kind: function
status: confirmed
summary: Blits a width x height block of halfwords (e.g. a tilemap slice) into the 24-halfword-wide buffer at unk_2034B30
  at a given x/y offset.
interface: void sub_802C4B6(u32 x /*r0*/, u32 y /*r1*/, const u16* src /*r2*/, u32 width /*r3*/, u32 height /*r4*/);
  clobbers r0-r2 (r0=width, r1=height, r2=one past src end), sets flags from final cmp r1, r4
details: 'Computes a destination pointer into unk_2034B30 as base + (x + y*0x18) halfwords, i.e. the buffer is 24
  halfwords (0x30 bytes) wide. For each of the height rows it copies width consecutive halfwords from the source
  to the row, then advances the destination row pointer by 0x30 bytes while the source stays consecutive — a classic
  rectangular blit with stride. The layout (24 halfwords wide) matches a small tilemap/text buffer; note r1 is multiplied
  by 0x18 via `mul r1, r5` before being doubled by the `add r0, r0, r0` (x*2) step, so the offset arithmetic is
  (x + y*24)*2 bytes. Return values in r0/r1 are just the exhausted loop counters (width/height), and flags reflect
  the last row comparison; callers that care only about the blit ignore them.

  '
