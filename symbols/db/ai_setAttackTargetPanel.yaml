name: ai_setAttackTargetPanel
address: '0x0810B13E'
kind: function
status: probable
summary: After a helper call, conditionally sets the AI attack's target panel X/Y from a packed coordinate
  byte and marks the hit element as 0xC.
interface: () -> void; sets oAIAttackVars_TargetPanelX/Y and oAIAttackVars_HitElement when oAIAttackVars_ScratchVar
  != 0
details: 'First calls sub_810AF30 (which presumably computes/updates the AI attack vars, including ScratchVar).
  If ScratchVar at r7+ScratchVar is nonzero, it unpacks the packed coordinate in Unk_40: the low 3 bits
  go to TargetPanelX and bits 4-7 (r0>>4) to TargetPanelY. It then writes 0xC to HitElement, indicating
  the attack''s element/hit-type is a fixed constant for this AI move. All state lives in the oAIAttackVars
  struct accessed via r7; the function returns without touching other state. Called only on recorded battle
  routes, so it is part of enemy/battle AI attack setup.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sub_810AF30 at entry runs the shared AI-attack setup before acting on its results; cmp r0,#0
    / beq skips everything, so ScratchVar gates whether the target is set; lsr/lsl #4 and lsl/lsr #0x1d
    split Unk_40 into y:4/x:3 stored as strb to TargetPanelX/Y; mov r0,#0xc / strh to HitElement assigns
    a fixed hit element constant 0xC'
  refs:
  - bn6f/asm/asm31.s:176447
  - 0x0810AF30 sub_810AF30
  reproduce: python3 tools/asmcat.py 0x0810B13E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-212108'
