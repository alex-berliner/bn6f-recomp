name: ai_setAttackTargetPanel
address: '0x0810B13E'
kind: function
status: confirmed
summary: Runs one AI attack-step dispatch then, if the dispatch set the scratch flag, unpacks the target panel (X,Y)
  and hit element into the attack variables.
interface: 'u32 ai_setAttackTargetPanel(u32 r2, u32 r5, u32 r7) /* outputs: r1, r5, r8-r12 via dispatch */'
details: "Calls ai_attackStepDispatchSubStep(r2, r5, r7) which may rewrite r7 (the AIAttackVars pointer).\nReads\
  \ oAIAttackVars_ScratchVar; if zero, returns with dispatch's r1 unchanged.\nIf non-zero, reads oAIAttackVars_Unk_40\
  \ (a packed 32-bit value):\n  - TargetPanelX = Unk_40 & 0x7  (lsl #29 / lsr #29 masks to 3 bits, range 0-7 for\
  \ 8 panels)\n  - TargetPanelY = Unk_40 >> 4   (stored as byte; r1 also receives this value)\n  - HitElement  \
  \ = 0xC (12) written as halfword to oAIAttackVars_HitElement\n0xC likely corresponds to a specific NetBattle element\
  \ index used for the enemy's attack.\nRegisters r5, r8-r12 are passthrough/clobber from the dispatch call; r0,\
  \ r2-r4, r6, r7, lr are fully clobbered.\n"
