name: battle_probePanelChainRows_8026622
address: '0x08026622'
kind: function
status: confirmed
summary: Probes a battle object's panel and a fixed list of nearby rows (via a signed offset table) with
  the panel-check routine, returning the first hit.
interface: int battle_probePanelChainRows(void* object /*r5*/, int probeX /*r6*/, int row /*r7*/) -> (int
  hit /*r0*/, int rowOrFlag /*r1*/); clobbers r2,r3,lr and NZCV; preserves r4-r7
details: 'Battles-side panel search helper. Takes a battle object pointer (r5, reads oBattleObject_PanelX
  and oBattleObject_PanelY), a candidate X (r6) and a row (r7). First probe: the object''s own PanelX
  on `row`, using the argument table at byte_802673A when the object already stands on that row (PanelY
  == row), otherwise the table at byte_802673C. Then it walks the signed-byte table at byte_8026730: each
  entry is a Y offset added to `row`; every subsequent probe is at X = probeX with table byte_802673C.
  Each candidate is tested by calling sub_8026450 (x=r0, y=r1, table=r2, object=r5, probeX=r6, row=r7).
  On the first nonzero result it returns immediately with that routine''s (r0, r1). If no candidate hits,
  it returns (0, 0x7F); 0x7F doubles as the table terminator and as the "nothing found" marker in r1.
  The choice between byte_802673A and byte_802673C for the initial probe suggests the check behaves differently
  when probing the object''s own row (probably ignoring itself or its own tile''s state). Note r5 is listed
  as both input and output in the caller contract: the routine preserves r5 (push/pop only covers r4,lr
  and r5 is never written), so callers see it unchanged.

  '
