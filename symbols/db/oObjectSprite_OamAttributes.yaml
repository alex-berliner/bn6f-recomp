name: oObjectSprite_OamAttributes
address: '0x15'
kind: struct-field
status: probable
summary: 'Packed OAM attribute byte: high nibble = OBJ palette slot (set via sprite_setFinalPalette, initialized
  to 8), bits 2-3 = OAM priority (set via sprite_setPriority_8002E14).'
details: Multiple sprite functions consistently use distinct bit-fields of this byte. sprite_getFinalPalette
  masks with 0xF0 to extract the palette index; sprite_setFinalPalette/sprite_forceWhitePalette clear-and-set
  the high nibble. sprite_setPriority_8002E14 uses mask 0x0C and shifts left by 2, isolating bits 2-3
  for OAM priority. asm38.s loads the byte, ANDs with 0xF0, and ORs in a shifted value from sub_3006108
  — the same palette-slot assignment idiom.
