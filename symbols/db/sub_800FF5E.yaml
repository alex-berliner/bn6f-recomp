name: sub_800FF5E
address: '0x0800FF5E'
kind: function
status: confirmed
summary: Refreshes the battling Navi's AI data block (B-button, attack powers, BeastOut power) from the alliance's
  navi-stats table each turn/setup.
interface: void sub_800FF5E(void /* battle object in r5 */); /* clobbers r0,r1,r2,lr; flags NZCV; preserves r4,r6
  */
details: "Operates on the live battle object passed in r5. Pulls oBattleObject_AIDataPtr and refills\nthe AI data\
  \ struct fields from GetBattleNaviStatsByte_AllianceFromBattleObject:\n  oAIData_Unk_04          <- stat 0x44\
  \ when GetBattleMode()==9, else 0xFF (\"none\")\n  oAIData_BButton         <- stat 4\n  oAIData_BeastOutPwrAtk\
  \  <- stat 5, via ai_setBeastOutPwrAtk_800FFAA(ai, stat5) which\n                             also takes the AI\
  \ data block in r4\n  oAIData_APwrAtk         <- stat 0x39\n  oAIData_BLeftAbility    <- stat 7\n  then overwrites\
  \ oAIData_BeastOutAPwrAtk with 0xFF so the BeastOut attack starts as \"none\".\nShort-circuits and returns without\
  \ touching AI data when stat 0x2C is non-zero: the\ncomment in the C says this means the navi manages its own\
  \ AI data. Battle mode 9 is the\nonly branch that pulls a real value into Unk_04; all other modes force 0xFF.\n"
