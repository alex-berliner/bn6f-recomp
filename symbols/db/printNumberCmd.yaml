  countHexDigits lookup, digit-by-digit rendering via sub_80461D0, and the layout byte branching at 0x80/0x40.
  However, the proposal says values >= 0x80 'emit in the opposite mode' — the asm (loc_8046402 path) instead
  draws padding zeros first (mov r1, r0 with r0=0, drawing glyph 0+1=1) then digits, while the <0x80 path
  (loc_80463F4) draws trailing glyph 1 with id=r0 after digits. The summary also misses that sub_80461D0
  is called with r1=glyph_id (digit+1) but r2/r3 presumably carry x-position from prior setup, and r0
  is a layout/position word passed through. The name 'printBcdNumberCmd' is acceptable but the function
