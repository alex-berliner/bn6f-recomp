name: t4_tickSubsystemE290
address: '0x0813201C'
kind: function
status: probable
summary: Update-callback wrapper that ticks the subsystem state at eS200A290, which fires event 0xDA(2)
  once the subsystem is no longer in use.
interface: () -> none; calls cb_8048FD4 with r0 = eS200A290; no return value used
details: Loads the pointer eS200A290 into r0 and tail-positions a call to cb_8048FD4, the generic subsystem
  tick dispatcher that reads a state byte in that structure and, on completion, fires event 0xDA with
  argument 2. It preserves only r5 and returns immediately after the callee finishes, so it is purely
  a callback adapter with no state of its own. The wrapper exists so the subsystem can be driven from
  a table or task slot that expects a nullary callback. Which gameplay feature owns eS200A290 is not determinable
  from these 8 instructions.
