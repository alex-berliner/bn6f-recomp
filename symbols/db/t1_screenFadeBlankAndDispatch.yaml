name: t1_screenFadeBlankAndDispatch
address: '0x0803CC40'
kind: function
status: probable
summary: While a screen fade is active, blanks the BG layers (LCD control 0x40), runs a chatbox update,
  then tail-jumps to a handler pointer stored in a struct at [r5+4].
interface: (r0 = unused on entry; r5 = pointer to a struct whose +4 field is a function pointer) -> does
  not return to caller normally; control passes to the [r5+4] handler, whose return reaches this function's
  caller; flags clobbered by calls.
details: First checks IsScreenFadeActive and exits immediately if no fade is running, so this is fade-gated
  transition code. On the fade path it calls chatbox_8040818, then writes DISPCNT-style value 0x40 (OBJ
  layer only, all BG layers off) into the current frame's render info via SetRenderInfoLCDControl, blanking
  the background. It then loads a function pointer from [r5+4] and does mov lr,pc / bx r0, i.e. an unconditional
  tail-call into that handler — the pointer likely switches to the next screen/mode during the fade-out.
  r5 and r4/r6/r7 are never set inside the function, so the caller must supply r5 as a context/mode struct;
  r0 on the final call is the leftover value loaded for the LCD write (0x40).
evidence:
