  date: '2026-10-18'
  detail: beq after bl IsScreenFadeActive gates the whole body on an active screen fade; ldr r0, off_803CC5C
    (=0x40) + bl SetRenderInfoLCDControl writes LCD control 0x40, disabling BG layers during the fade;
    ldr r0,[r5,#4]; mov lr,pc; bx r0 tail-calls a handler from the r5 struct instead of returning; bl
    chatbox_8040818 runs a chatbox-related step on the fade path; no known callers, so the r5 struct and
