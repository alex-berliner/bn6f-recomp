summary: Resolves a text-script index to a pointer in the text-script pool at EWRAM 0x02001850 via a 0x40-byte
  LUT at 0x0804a25c, returning a u8* into the pool.
interface: (r0 = textScriptIndex) -> r0 = u8* into unk_2001850 pool ; clobbers r0, r1; preserves r4-r7
details: "- Saves callee-saved r4-r7 and lr; tail-pops them as the function return (push {r4-r7,lr} /\
  \ pop {r4-r7,pc}).\n  - Loads r1 = dword_804A25C (the LUT constant 0x00402000), then ldrb r1, [r1, r0]\
  \ reads a byte at offset r0 into that LUT.\n  - Loads r0 = unk_2001850 (the EWRAM pool base at 0x02001850)\
  \ and returns r0 + byte.\n  - The 52-byte LUT at byte_804A264 contains pairs (high, low) of u16 values:\
  \ 0xC3B0..0xC3CB interleaved with 0xC24x/0xC25x entries, plus 0xFFFF terminators — these look like u16\
  \ tile/code IDs used to lookup script handles/strings.\n  - Captured entries show r0=0 on most paths;\
  \ many callers pass the text-script index from chatbox_state (TextScriptIdx at oChatbox+1). The function\
  \ is therefore an indexed access into a chatbox text-script table rather than anything battle-specific\
  \ despite the calling context.\n  - All 40 callers route through chatbox/battle script dispatchers (battle_dispatchEventScript_8119018,\
  \ the chatbox fill helper sub_8120348, etc.), all of which use it as `getTextScriptEntry(idx)`.\ndetails:\
  \ |\n  Status heuristic: probable for \"indexed text-script handle resolver\"; the surrounding 0xFFFF-terminated\
  \ byte pairs hint at a short list of script IDs.\n"
