    then bl unpackVerActorTyAndAIIdx_800F29C: resolves the linked object''s identity record; bl battle_killObjectWithDependents
    on RelatedObject1Ptr: deletes the partner object and its dependents; mov r0,#CUR_STATE_DESTROY; str
    r0,[r5,#...CurStateActionPhaseAndPhaseInitialized]: ends the object''s own lifecycle'
