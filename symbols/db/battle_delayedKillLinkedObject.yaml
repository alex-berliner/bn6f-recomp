name: battle_delayedKillLinkedObject
address: '0x080C49A4'
kind: function
status: probable
summary: Battle-object handler that waits 30 frames, clears its visible flag, notifies sub_8011044 about
  the linked enemy's version/actor/AI, kills the linked object (RelatedObject1) via battle_killObjectWithDependents,
  zeroes its ExtraVars byte, and destroys itself.
interface: (r5 = battle object, set up by caller) -> r0 = 0; object's CurState set to CUR_STATE_DESTROY
  on completion
details: On first invocation it seeds oBattleObject_Timer with 0x1E (30 frames) and marks the phase initialized
  (PhaseInitialized=4), so this is a one-shot timed state. Each frame it decrements the timer; when it
  expires it clears bit 1 of oObjectHeader_Flags (likely a visible/active bit, making the object vanish).
  It then reads oBattleObject_RelatedObject1Ptr, takes that object's oBattleObject_NameID, unpacks it
  via unpackVerActorTyAndAIIdx_800F29C into {version, actor type, AI index}, and passes the result (r2=1)
  to sub_8011044. It kills the linked object with battle_killObjectWithDependents, zeroes the first byte
  of its ExtraVars block (likely a counter/flag), and finally sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY. The pattern fits a mirage/clone-style enemy whose copy vanishes after a delay,
  notifying something about the linked enemy before both are removed.
evidence:
- method: assembly-reading
