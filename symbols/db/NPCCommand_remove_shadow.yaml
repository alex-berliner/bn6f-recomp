name: NPCCommand_remove_shadow
address: '0x0809EFD8'
kind: function
status: confirmed
summary: NPC command-list handler that clears an overworld NPC's shadow by toggling the UnkFlags_60 shadow bit pair
  (set 0x80, clear 0x100), calling sprite_removeShadow, and advancing the command cursor by one.
interface: "void NPCCommand_remove_shadow(void);\n  // inputs:  r5 = current OverworldNPCObject*, r6 = command-list\
  \ cursor\n  // outputs: r6 = cursor + 1; cpsr N/Z set from r6, V untouched\n  // otherwise:  r0/r3/lr clobbered;\
  \ r5/r6 overwritten by caller convention\n"
details: 'Runs as one entry in the overworld NPC command list. Reads the NPC''s

  oOverworldNPCObject_UnkFlags_60 word (offset 0x60 in the NPC object),

  ORs in the shadow bit OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x80, then BICs out

  OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x100 and stores the result back. The two

  bits are interpreted together as an NPC shadow control pair: 0x80 set,

  0x100 clear → "no shadow" state. Immediately afterwards it calls

  sprite_removeShadow (presumably to detach the shadow sprite child of the

  NPC''s main sprite), then increments the command-list cursor (r6) by one

  so the next NPC command is dispatched on the following tick. Tail-pops

  via `pop {pc}` and references an external pool entry at 809EFF4 holding

  the 0x100 shadow-flag mask.

  '
