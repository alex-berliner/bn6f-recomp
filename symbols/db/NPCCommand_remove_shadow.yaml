open_questions:
- Exact semantics of the (0x80 set, 0x100 clear) combination vs the other three combinations in UnkFlags_60; the
  function name only describes removing the shadow, not what the pair encodes.
- Whether sprite_removeShadow is passed the NPC's sprite handle in r0 or resolves it via the global sprite list;
  the assembly passes no argument, so likely the latter.
- Whether r5 is preserved across the sprite_removeShadow call by the caller or reloaded each tick by the NPC command
  dispatcher.
