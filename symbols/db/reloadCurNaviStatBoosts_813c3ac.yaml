name: reloadCurNaviStatBoosts_813c3ac
address: '0x0813C3AC'
kind: function
status: confirmed
summary: Heals/clamps the current PET navi's HP (and slot 0's HP) to MaxHP, branching on map group and the EVENT_PET_NAVI_ACTIVE
  flag, with a MegaMan-only side effect when no PET navi is set.
interface: void reloadCurNaviStatBoosts(u32 *toolkit /* r10 */); /* preserves r4-r7, returns NZCV + all caller-saved
  regs */
details: "Entry: reads the toolkit pointer from r10 (oToolkit_GameStatePtr -> oGameState_MapGroup).\n1. If GetCurPETNavi()\
  \ == 0 (no PET navi selected, i.e. MegaMan himself), calls\n   applyNaviStatsMaybe_813C458, then if flag EVENT_163\
  \ (\"1:0x63\") is set calls sub_8121154\n   before falling through.\n2. Map-group split (signed compare vs 0x80):\n\
  \   - Real world (map_group < 0x80): if EVENT_PET_NAVI_ACTIVE (\"0x17:0x1D\") is clear the\n     function returns\
  \ immediately; otherwise it copies MaxHP -> CurHP for slot 0 and again\n     for the navi returned by GetCurPETNavi\
  \ (a full heal of the active pet).\n   - Internet (map_group >= 0x80): clamps slot 0's CurHP down to MaxHP if\
  \ CurHP > MaxHP\n     (never heals up), then repeats the clamp for the active navi. The final `cmp`/branch\n \
  \    against the active navi's CurHP/MaxHP lives entirely in guest CPU flags (no GUEST_CALL\n     on the taken-false\
  \ path), so the returned NZCV is meaningful to the caller.\nTouches the PET navi stats table (navi index 0 + GetCurPETNavi),\
  \ offset pairs\noNaviStats_MaxHP / oNaviStats_CurHP, the toolkit/game-state chain, and event-flag\npages EVENT_PET_NAVI_ACTIVE\
  \ (0x17:0x1D) and EVENT_163 (1:0x63).\n"
