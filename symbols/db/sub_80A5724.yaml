name: sub_80A5724
address: '0x080A5724'
kind: function
status: hypothesis
summary: Returns two ROM-table bytes indexed by the selector byte at r6+5.
interface: "void lookupObjBytePair_80A5724(const void *r6 /*IN: object whose +5 byte is a selector*/,\n        \
  \                       u8 *r0 /*OUT: byte from table at 0x80A573C*/,\n                               u8 *r1 /*OUT:\
  \ byte from table at 0x80A5740*/);\nclobbers: r2, r3; preserved: r4; flags: not used.\n"
details: 'Reads the single byte at offset 5 of the structure pointed to by r6, uses it as a

  0-based index into two packed ROM tables and returns the selected bytes in r0 and

  r1 respectively. Table A lives at 0x80A573C and packs (0x18, 0x0C, 0x20, 0x0C) as

  four bytes in a u32; table B lives at 0x80A5740 and packs (0x0C, 0x20, 0x0C, 0x20)

  the same way. Because the selector is taken directly without bounds checks, the

  valid range is whatever the callers know it to be (0..3 based on the packed data).

  The callee is a thumb_func_end stub: it pushes/pops r4 and uses lr only to return,

  so it is clearly a helper called from one or two sites that already hold r6.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
