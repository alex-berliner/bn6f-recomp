    sed -n ''1,8p'' bn6f/asm/asm00_1.s; sed -n ''12,25p'' bn6f/include/rom_structs/ObjectSpawnData.inc

    '
  result: 'push {r4-r7,lr}; r7 = list, r4 = 0; loop: ldrb type, 0xFF -> done; r6 = table[type]; push {r4,r7}; r0
    = [r7+1] (byte), r1-r4 = [r7+4..+0x10]; mov lr, pc; bx r6; pop {r4,r7}; r5 != 0 -> r4 += 1; r7 += 0x14; done:
    r0 = r4; pop {r4-r7,pc}'
