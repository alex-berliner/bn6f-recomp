name: battle_aiTickAttackTimer_80FE1FE
address: '0x080FE1FE'
kind: function
status: confirmed
summary: Ticks one AI attack's countdown, arming it on first call and firing it (via sub_801171C) once the timer
  expires.
interface: 'void sub_80FE1FE(oAIAttackVars *attack /*r7*/); // caller-visible: r0-r3 clobbered, nz/c/v reflect last
  op, r5/r6/r7 pass through, lr popped'
details: 'State machine step for a single AI attack block pointed to by r7 (an oAIAttackVars-style struct used by
  the battle AI). Offset +1 (Unk_01) is the armed/started flag: if it is 0, the attack begins now — 4 is stored
  into Unk_01 and the halfword at offset 0x18 (Unk_18, the attack''s charge/ delay time) is copied into the countdown
  at offset 0x10 (Unk_10). If the flag is already nonzero, the countdown in Unk_10 is decremented each call; when
  it reaches 0 (or wraps below), sub_801171C is called to execute the attack. The countdown is only loaded once
  at arm time, so changing Unk_18 mid-count has no effect until the attack re-arms. The function returns with r0
  and the nz/c/v flags exactly as the final instruction stream left them (mov #4 / subs #1 / values from the sub_801171C
  call), which at least one caller inspects. r5, r6 and r7 are untouched; lr is popped to return. Quirk: the decrement
  uses subs/bgt, so a countdown of 0 when armed-with-flag-set wraps and fires immediately on that path''s next tick.

  '
