name: ai_attackDispatchByHitElement3
address: '0x08106DEC'
kind: function
status: probable
summary: Dispatches an AI attack handler based on the element recorded in the AI attack vars, jumping
  to one of three element-specific routines.
interface: (r7 = AI attack vars struct) -> tail-jump to table[HitElement]; no direct return value
details: 'Reads the HitElement byte at offset 0 of the AI attack vars struct (r7), uses it to index a
  3-entry function pointer table at off_8106E00, and tail-calls the selected routine via mov lr,pc / bx
  r1. Entry 0 is sub_8106E0C, entry 1 is the known ai_attackCommitStep, entry 2 is sub_8106E94, so the
  three cases correspond to three element classes of an AI-driven attack. The jump is a tail-call: the
  callee returns directly to this function''s caller via lr, making pop {r7,pc} a formality for the fallthrough
  case. The table is thumb pointers (+1), stored right after the code.'
