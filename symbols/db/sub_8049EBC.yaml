name: sub_8049EBC
address: '0x08049EBC'
kind: function
status: confirmed
summary: Scene/cutscene initializer that configures LCD rendering, starts a 0x10 screen fade-in, clears state flags,
  fires setup hooks twice (idx 0 and 1), and transitions the state machine to phase 4.
interface: void sceneInitFadeIn_8049EBC(struct State* r5); /* r10/lr input, r8/r9/r11/r12 preserved */
details: 'Configures LCD control via SetRenderInfoLCDControl with value 0x1F40, then runs

  renderInfo_8001788 and renderInfo_80017A0. Calls sub_80015FC with arg 0x13 (palette/bg slot),

  sub_8046664 (clear/draw helper), and copyData_804A0AC (VRAM/DMA copy helper). Starts a screen

  fade with SetScreenFade(8, 0x10). Clears a batch of state bytes at offsets 0x8, 0x12, 0x13,

  0x1C, 0x1D of the r5 struct, then fires scene prep hooks sub_803BEC0, sub_804A14C,

  sub_803A740, sub_803A752, sub_8049F20. Calls sub_803BE30 twice with indices 0 and 1

  (per-index setup pass), then chatbox_8040818. Writes 0x10:4 to state->field_1 (= 4) to

  advance the state machine phase.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
