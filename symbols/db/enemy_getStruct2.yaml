name: enemy_getStruct2
address: '0x0800F23C'
kind: function
status: confirmed
summary: Resolves an enemy index to a pointer into a per-version 6-byte data record, selected by actor type (virus/navi/player)
  and AI index.
interface: u8* enemy_getStruct2(u16 enemy_idx) -> r0 = pointer to 6-byte per-version record (r3 = 6 as a side effect,
  r1/r2 clobbered)
details: 'Calls GetVerActorTyAndAIIdx_80182B4(enemy_idx), which returns a pointer to a triple {version (u8), actor_type
  (u8), ai_index (u8)}. The actor_type byte indexes the group table at off_800F260, which holds one pointer per
  actor type: virus (off_8109150), navi (off_80F253C), player (off_80EA8D8). Each group is itself an array of tables
  indexed by ai_index; the chosen table is an array of 6-byte records indexed by the version byte. The returned
  r0 is recordTable + version*6, so callers treat the result as a base pointer into per-version enemy data (stats/params
  laid out one 6-byte entry per game version). Quirk: the multiply-by-6 constant is left sitting in r3 on return,
  matching the original binary; r1 and r2 are scratch. The "struct 2" name suggests this is one of several per-enemy
  record accessors.

  '
