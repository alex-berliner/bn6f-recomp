name: sub_813471C
address: '0x0813471C'
kind: function
status: confirmed
summary: Copies background tiles for an object, choosing a small (2x2) or large (0x15x2) source rectangle based
  on a flag at r5+0xD, into tile block 0 with a fixed 8x0x11 destination.
interface: void sub_813471C(void /* uses r5 */);
details: 'Selects source rectangle dimensions by testing a flag byte at the caller''s

  r5 + 0xD: if zero, uses (j=2, i=2); if non-zero, uses (j=0x15, i=2). Then

  calls CopyBackgroundTiles(j_size, i_size, which_tile_block_32x32=0,

  tile_ids=unk_203486C, j_size=8, i_size=0x11). The trailing two args (8, 0x11)

  are the destination j/i sizes in 8x8 tiles, so the function always copies

  an 8x0x11 (8 wide, 17 tall) block of tiles into tile block 0, drawing

  either from a 2x2 source or a 0x15x2 source. r4/r5 are pushed/popped

  because CopyBackgroundTiles clobbers them. Both unk_203486C (tile-id table)

  and the destination block index 0 are hard-coded.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
