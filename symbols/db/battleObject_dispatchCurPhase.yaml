name: battleObject_dispatchCurPhase
address: '0x080E6298'
kind: function
status: probable
summary: Dispatches a battle object's current-phase handler from a two-entry jump table
interface: (r5 = battle object) -> tail-calls handler for oBattleObject_CurPhase (0 or 1); no direct return
  value
details: Reads the byte at r5+oBattleObject_CurPhase and uses it to index off_80E62AC, a table of two
  Thumb function pointers (sub_80E62B4 for phase 0, sub_80E62D2 for phase 1), then performs a long-call
  tail jump (mov lr, pc; bx r1) so the handler's return goes straight to this function's caller. It is
  the phase tick/update entry for whatever battle object owns it; the object identity and what each phase
  does are unknown.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0, [r5,#oBattleObject_CurPhase] selects the table index (sub_80E6298 line 3); ldr r1,
    [r1,r0] off off_80E62AC fetches one of two Thumb pointers (sub_80E62B4+1, sub_80E62D2+1); mov lr,
    pc; bx r1 is a tail-call, so this is a dispatch trampoline, not a wrapper
  refs:
  - bn6f/asm/asm31.s:102015
  reproduce: python3 tools/asmcat.py 0x080E6298
  result: 'proposed by hyper/glm-5.3-flash, self_score 1; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112; the run''s proposed name battle_dispatchPhase was
    contested; tools/investigate_land.py dedupe gave this distinct name (hyper/glm-5.3-flash proposed,
    minimax/MiniMax-M3 agreed)'
open_questions:
- Which battle object uses this dispatcher (no callers known) and what its two phases do (sub_80E62B4,
  sub_80E62D2 unknown)
- Whether r5 is set by the caller or this is invoked with r5 as an implicit object pointer from a shared
  update loop
