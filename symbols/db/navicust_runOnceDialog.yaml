name: navicust_runOnceDialog
address: '0x08136F74'
kind: function
status: probable
summary: In the Navi Customizer, after story flag EVENT_EE, fires a one-time dialog (text script 3) and
  switches the menu state to 0x14.
interface: (r5 = ptr to NaviCust state byte) -> void; writes r5[0] = 0x14 when the dialog is queued, no
  return value
details: 'Guarded first by the story/event flag EVENT_EE (TestEventFlagFromImmediate): if clear, it returns
  immediately. It then calls sub_81375F4(0x48, 0x61, 0) and sub_8137618, branching out when sub_8137618
  returns ZF set, so some context check (likely cursor/selection in the customizer screen) must pass.
  Finally it tests bit 0x80 of the chatbox/cutscene flag word eFlags2009F38 — a ''this one-shot dialog
  already shown'' bit — and returns if set. If all checks pass it runs NaviCust text script #3 via RunTextScriptNaviCustDialog
  and stores 0x14 into [r5], presumably entering the state/handler that displays that dialog.'
