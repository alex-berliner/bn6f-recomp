name: object_destroyAfterClearRegion
address: '0x080CF76C'
kind: function
status: probable
summary: Battle-object routine that first removes the object from its collision region, then destroys
  it.
interface: (r0 = battle object pointer, passed through to both callees) -> r0 = object_genericDestroy
  result; no meaningful flags
details: 'This is a two-call wrapper: it calls object_clearCollisionRegion to zero the object''s collision-region
  byte so it stops registering in its current region, then calls object_genericDestroy, the standard battle-object
  destructor that releases panel tile reserves, collision data, and object memory. It looks like a destroy/on-destroy
  routine for an object that needs to leave its collision region explicitly before being freed, possibly
  because genericDestroy alone does not clear the region byte. It appears in recorded battle routes (battlesweep),
  so it runs during normal battle gameplay. With no known callers the exact object type that uses it as
  its destructor is unidentified.'
