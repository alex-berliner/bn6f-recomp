name: getIndexedSignedBytePair_8018842
address: '0x08018842'
kind: function
status: confirmed
summary: Fetches a two-byte table entry (two signed bytes) selected by an index, with the table base supplied by
  a helper call.
interface: int getIndexedSignedBytePair(int baseArg0, int baseArg1, int index) — returns entry byte0 in r0 and byte1
  in r1, both sign-extended (s8); r2-r4 not returned modified (r4 preserved)
details: 'Computes 2*index in r2, calls sub_8018886 with r0/r1 passed through unchanged (that helper

  evidently yields the base address of a table/record in r0), then reads the entry at

  base + 2*index as two sign-extended bytes: first byte -> r0, second byte -> r1. The 2-byte

  stride suggests an array of pairs (e.g. coordinates, dimensions, or s8 flags/ranges). The

  values are loaded with ldrsb, so the table data is intended as signed. r4 is used only as a

  scratch for the computed address and is preserved for the caller. No flags are meaningful on

  return beyond the usual clobber set (nz c v).

  '
