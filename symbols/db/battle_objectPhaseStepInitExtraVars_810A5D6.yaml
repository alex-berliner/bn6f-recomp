name: battle_objectPhaseStepInitExtraVars_810A5D6
address: '0x0810A5D6'
kind: function
status: confirmed
summary: 'Per-phase step for a battle object: clears the object''s two extra phase variables on first
  entry into the phase, then runs the shared init-and-run-AI handler.'
interface: void step(r4 = battle object, r5 = battle object, r8 = battle object); outputs r1/r5/r8/r9/r10/r11/r12
  are whatever battleObject_initAndRunAI_8016B02 leaves behind
details: 'This is a thin wrapper used as a phase step routine for a battle object. On the very first call
  of a phase (byte at obj_r5 + oBattleObject_PhaseInitialized == 0) it zero-initializes the 8-byte ExtraVars
  area (two u32 words at oBattleObject_ExtraVars and +4) before doing anything else; on subsequent calls
  within the same phase those variables persist. It then tail-dispatches (after saving lr only) to battleObject_initAndRunAI_8016B02
  with r4, r5 and r8 unchanged, letting that shared handler initialize the phase and run the object''s
  AI logic. The wrapper itself does not alter r10, which the callee preserves. All caller-visible outputs
  (r1, r5, r8, r9, r10, r11, r12) are simply whatever the shared handler leaves in the registers, so this
  acts as a pass-through with an extra first-entry variable reset. Note r4, r5 and r8 all appear to point
  at the same battle object in the observed calling convention; r5 is the one dereferenced here.

  '
