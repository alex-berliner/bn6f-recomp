name: battle_aiPickMovePanels_80CAC82
address: '0x080CAC82'
kind: function
status: confirmed
summary: Picks two random destination panels for an AI battle object's movement, using row and column filters looked
  up by alliance.
interface: Out5 sub_80CAC82(u32 r4_in, BattleObject* r5_obj, u32 r6_in, u32 r7_in) -> r0=panelA_col, r1=panelA_row,
  r2=panelB_col, r3=panelB_row, r5=obj (preserved); clobbers nz c v lr
details: 'Reads r5->oBattleObject_ExtraVars[0x13] as a u8 "extra" byte and r5->oBattleObject_Alliance as the

  alliance index. Looks up two 32-bit filter values (f0,f1) from a table at byte_80CAD04 indexed by

  (alliance<<3); the two rows of that table are {0x10,0x00000000,0x0F8800A0} and

  {0x30,0x00000000,0x0F880080} for the two alliances.


  First call: object_getPanelsInRowFiltered(extra, f0, f1, sp+4 buffer) writes candidate panels.

  If count != 0, picks one via GetPositiveSignedRNG modulo count (svc 6 is a modulo helper),

  decoding the byte as low 3 bits = column and bits[7:4] = row. Returns (0,0) on empty.


  Second call: object_getPanelsIgnoreColumnFiltered(extra, f0, f1, sp+4 buffer), same decode,

  returned in r2/r3 (0,0 on empty).


  Preserves r4, r5, r6, r7; clobbers nz/c/v/lr.

  '
