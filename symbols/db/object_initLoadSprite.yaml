name: object_initLoadSprite
address: '0x080D00C4'
kind: function
status: confirmed
summary: 'Initializes a battle object''s sprite: sets panel-derived position, loads tile graphics, enables shadow,
  assigns animation from a Param2-indexed lookup table, applies palette 0, sets flip, optionally nudges Y/Z up for
  idle animation, then transitions the object to the update state.'
interface: 'void object_initLoadSprite(void) /* in: r5 = battle object ptr; out: r5 unchanged; clobbers r0-r3, nzcv,
  lr; preserves r4 */'
details: 'Called with r5 pointing to a battle object. Sequence:

  1. object_setCoordinatesFromPanels – computes X/Y from the object''s tile panels.

  2. Clears the 16-bit fractional Z offset (oBattleObject_Z16).

  3. sprite_load(0x80, 8, 0xE) – loads an 8×14-tile sprite with type 0x80 (likely a battle character/robot sprite
  format).

  4. sprite_hasShadow – enables shadow for this sprite; then sets flag bit 2 in oObjectHeader_Flags as the shadow-enabled
  marker.

  5. Reads oBattleObject_Param2 as an index into a per-animation-ID table (word_80D0130, containing .hword 0x3D3C
  → byte 0 = 0x3C, byte 1 = 0x3D). Stores the result in both oBattleObject_CurAnim and oBattleObject_CurAnimCopy,
  then calls sprite_setAnimation and sprite_loadAnimationData.

  6. sprite_setPalette(0) – assigns the default palette.

  7. object_getFlip → sprite_setFlip – mirrors the sprite if the object''s flip state says so.

  8. Clears oBattleObject_Param3.

  9. If Param2 == 0 (idle/default animation index), subtracts 1 from both Y and Z in 32-bit fixed-point to nudge
  the sprite slightly upward.

  10. Writes CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized, transitioning the object
  to its per-frame update phase.

  Dead code after the unconditional b to locret: calls battle_clearExtraVarsOwnerRef and object_freeMemory, unreachable
  from the normal flow (likely a leftover from a cleanup path).

  '
