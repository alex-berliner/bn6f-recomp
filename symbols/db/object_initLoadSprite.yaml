open_questions:
- What sprite format does type 0x80 denote, and why 8×14 tiles specifically?
- The animation lookup table word_80D0130 holds only one .hword entry visible here; is the full table larger or
  is Param2 always 0/1 in practice?
- Is the dead-code block (battle_clearExtraVarsOwnerRef + object_freeMemory) a vestige of an error/cleanup path
  or was it meant to guard against a failed sprite load?
- Why does the idle-animation Y/Z nudge subtract exactly 1 from both Y and Z in 32-bit? Is this a fixed-point pixel
  offset to prevent the sprite from clipping into its shadow?
