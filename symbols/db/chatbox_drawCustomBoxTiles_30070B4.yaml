status: probable
summary: Stages chatbox box-graphic tile data (3 tile sets x 8 palettes) into the EWRAM staging buffer
  pointed to by r0, then DMA-copies 0xF00 bytes to OBJ VRAM at 0x06015700, and finally sets chatbox.Unk_3D
  = 2 if FLAGS_3E_UNK_0400 is set.
interface: '(r0 = mode selector: 0 -> stage buffer at dword_200CDA0+0x680; 1 -> stage buffer at dword_200CDA0+0x080;
  else -> stage buffer at dword_200CDA0+0x680) -> no meaningful return ; side effects: writes 0x20 bytes
  per palette group into the staging buffer, queues a 0xF00-byte DMA to OBJ VRAM 0x06015700, may set Chatbox+0x3D
  to 2'
details: '- `r0` is doubled as a small mode selector: `cmp r2,#0 / beq / cmp r2,#1 / beq / else` chooses
  the destination slot inside the staging buffer pointed to by `dword_200CDA0`. For mode 1, `r7 += 0x80`;
  otherwise (mode 0 and "default") `r7 += 0x680` (i.e. `0xd << 7`).

  - `r5` is loaded from `off_300720C` indexed by `r2*4`, holding a `(*PaletteTable, *PerPaletteWidths)`.
  The first word (`[r5]`) is a per-palette pointer array: while that pointer is non-null, eight u32 words
  are copied (`[src+0x00], [src+0x60]`) into the staging buffer at stride 0x20, repeated four times to
  fill 0x20 bytes per palette group. After each group, the next width byte (`ldrb r0,[r5, 4+r4]`) is added
  to `r7` to advance the staging pointer.

  - `r5 += 8` between iterations, so the per-palette pointer/width pair advances.

  - After the staging loop, `QueueEightWordAlignedGFXTransfer(dword_200CDA0, 0x06015700, 0xF00)` is called:
  this is the chatbox box-graphic OBJ tile area (the box tilemap lives in OBJ at 0x06015700).

  - Finally, if `chatbox_maskFlags_3e(FLAGS_3E_UNK_0400)` returns non-zero (i.e. that bit is set), `Chatbox+0x3D`
  is overwritten with `2`.

  - The two callers are the two chatbox dialog-print routines (`chatbox_interpreteAndDrawDialogChar_804005C`
  and the unnamed variant at 0x0803ff50); both call it once per character to upload new box-graphic tiles.

  - Naming reflects: it''s used during the dialog-char draw step (i.e. box tile upload, not the text tile
  upload which uses a separate buffer).

  '
