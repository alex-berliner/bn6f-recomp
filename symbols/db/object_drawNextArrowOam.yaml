name: object_drawNextArrowOam
address: '0x0802AE84'
kind: function
status: probable
summary: Object update that draws a two-tile 'next/advance' arrow OAM icon; when the chatbox is still
  active it either waits or starts a dialog script and stores a state value in the object.
interface: (r5 = object ptr, r0 clobbered) -> r0 = ?; sets object->state byte at [r5,#1], queues OAM entries
details: 'The function treats r5 as an object whose byte at offset 1 is a state/timer field. It first
  tests flag 0x80 of the chatbox/cutscene flag word eFlags2009F38; if that flag (presumably ''dialog finished'')
  is clear, it checks the chatbox state: nonzero means the message is still playing, so it writes 4 to
  [r5,#1] and waits; otherwise it runs battle text script 1 via RunTextScriptBattleRunDialog and writes
  0x20 to [r5,#1]. When flag 0x80 is already set (dialog done), it skips that block and falls through
  to the drawing path. It then queues OAM via sub_802B15C with tile indices 0x10 and 0x11 (likely the
  two halves/frames of an advance-arrow icon) and finally queues one more OAM entry for object r5 via
  object_queueOamEntryFromBase. So the routine is the per-frame update of a dialog-attached object that
  shows a ''next text'' arrow once the message ends.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl chatbox_mask_eFlags2009F38 with r0=0x80, bne loc_802AEA6 skips the dialog block when that
    flag is set (asm lines 2-4); bl chatbox_GetState_8045F4C then strb #4,[r5,#1] — waits with state 4
    while text is running; bl RunTextScriptBattleRunDialog with r0=1, then strb #0x20,[r5,#1] — launches
    dialog script 1 and marks state 0x20; bl sub_802B15C twice with r0=0x10 and 0x11, then bl object_queueOamEntryFromBase
    — queues the icon''s OAM tiles; Chatbox calls tie this to battle text display; the OAM queueing ties
    it to a visible object (r5)'
