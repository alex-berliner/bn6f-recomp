name: sub_811F0C8
address: '0x0811F0C8'
kind: function
status: hypothesis
summary: 'Dispatches on entity sub-state at r5+4: if 8, runs sub_811F184 with bytes r5+6/r5+7 and stores results
  back; otherwise loads a halfword from a constant table into the global ''word_3001B2C''.'
interface: void sub_811F0C8(void); // uses r5 as a struct pointer (r5+4 sub-state, r5+6/r5+7 scratch bytes)
details: "- Reads a byte at r5+4 as the sub-state selector.\n- Sub-state != 8 path: resolves the constant pool entry\
  \ off_811F0F8 (which points\n  to dword_811F10C, i.e. the base of a small ROM table), reads a u16 at offset +4\n\
  \  from that table, and stores it into the global word_3001B2C. This is effectively\n  a default/idle-step that\
  \ pushes a fixed value (0x019A) into the global timer/\n  chip-step slot at 0x03001B2C.\n- Sub-state == 8 path:\
  \ invokes sub_811F184 with (R0 = &word_3001B2C,\n  R1 = off_811F0F8 ptr, R2 = r5+6, R3 = r5+7), then writes the\
  \ returned r0/r1\n  back into r5+7/r5+6 respectively (note the swapped write order: r0 -> r5+7,\n  r1 -> r5+6).\n\
  - r5 is preserved across the call (per the lifter contract) and is the live\n  \"step/chip\" struct pointer the\
  \ dispatch is acting on.\n- Quirks: the dispatch is a tiny state machine using a constant pool double-word\n \
  \ (off_811F0F8 = 0x0811F0F8 holding dword_811F10C's address repeated) as an\n  indirection, and the global at\
  \ 'word_3001B2C' appears to be a shared scratch/\n  output used by sub_811F184.\n"
