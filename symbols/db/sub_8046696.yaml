name: sub_8046696
address: '0x08046696'
kind: function
status: hypothesis
summary: clears the first byte of an entry in the eStructArr2008450 array and marks its sprite unscalable.
interface: void sub_8046696(u32 r0 index, ... r4 r5 r6 r7 preserved, returns r2 r3 from sprite_makeUnscalable; clobbers
  nzcv r0 r1 lr)
details: 'Looks up an entry in the struct array at eStructArr2008450 (size 0x58) by `index = r0`,

  zeroes its byte 0, then calls sprite_makeUnscalable with the entry address in r5 (the standard

  sprite_API convention). r4-r7 are preserved verbatim across the call (so caller-supplied

  scratch registers survive). The zeroed byte is interpreted here as a "scalable"/scale-state

  flag, but no definitive name is known — could equally be an "active"/phase/anim byte that

  sprite_makeUnscalable happens to need cleared.

  '
