name: pet_exitToPetMenuReturnZero_809ADA8
address: '0x0809ADA8'
kind: function
status: confirmed
summary: A one-shot exit handler that delegates to pet_returnToPetMenu to leave the current PET screen
  back at the PET menu, then always reports 0 in r0.
interface: u32 sub_809ADA8(void)  // r4-r7, r9-r12 passed through to the callee; returns 0 in r0 with
  NZ set from it
details: 'The routine is just `push {r4-r7,lr}; bl pet_returnToPetMenu; mov r0,#0; pop {r4-r7,pc}`. It
  preserves r4-r7 across the call and unconditionally returns 0 as its result, so callers presumably use
  a nonzero return elsewhere to signal that some other transition happened and 0 here for the plain "went
  back to the PET menu" case. Immediately after the function body sit two 30-byte lookup tables (byte_809ADB4)
  of small records (kind/index/x/y byte triplets such as 2/0/0, 3/0/0x22, deltas like 0x46FF/0x64FF) and
  several cutscene scripts used by the copybot/MegaMan transfer flow (CutsceneScriptNotification_809AE68:
  lock player for dialogue, play the comm-error text TextScriptCommError873B9E0, fade to black, respawn
  overworld NPC objects, center the camera via owMapObject_loadSpawnAndCenterCameraOnEntry_809AF00, PET
  effects 4/5, sound 0x8D/0x8E, and a branch on EVENT_COPYBOT_ACTIVE); the proximity suggests this function
  is part of that PET/transfer screen logic, acting as its "cancel/back to PET menu" path.

  '
