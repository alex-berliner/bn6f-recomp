name: battle_markObjectDead_80E71B8
address: '0x080E71B8'
kind: function
status: confirmed
summary: Sets field +8 of a battle object to 8 (the standard "object destroyed/inactive" flag), doing
  nothing on a NULL pointer.
interface: void battle_markObjectDead_80E71B8(u32* obj /* r0 */) -> r1 = 8 on store, r1 unchanged if obj
  == NULL; clobbers NZ flags
details: 'Tiny battle-code helper: if the object pointer in r0 is non-NULL it loads r1 = 8 and

  stores it to [r0 + 0x8], then returns; with a NULL pointer it returns immediately without

  touching memory or r1. In MMBN battle object layouts, field +0x8 is the object''s

  active/life state, and the value 8 is the conventional "dead / cleared / inactive" marker

  written all over the battle engine when an entity (custom panel object, projectile,

  attack hitbox, etc.) is being torn down. Because r1 is assigned 8 before the store, it

  doubles as an output register: callers that read back r1 get 8 on success and the

  incoming value when the pointer was NULL. Flags NZ are clobbered by the tst/mov.

  '
