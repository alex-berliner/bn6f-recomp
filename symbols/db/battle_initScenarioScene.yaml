name: battle_initScenarioScene
address: '0x08130F78'
kind: function
status: probable
summary: 'Initializes one specific battle scene variant: leaves RFU mode if active, runs the full battle-scene
  init, loads entity GFX and a menu-style background, and spawns eStruct records from a fixed table.'
interface: () -> void; early-returns (via ZF from IsScreenFadeActive) while a screen fade is active; writes
  r5+3 = 0x20 and r5+0x1E = 0; no other args/returns
details: If no fade is in progress it first reads the jump-table offset byte of the record at EWRAM 0x200BC30
  and, when nonzero, stops and waits out the RFU (wireless adapter) request mode. It then closes the chatbox
  (chatbox_8040818) and runs battle_initScene_8129248, the full battle-scene init (VRAM/GFX clear, 0x1F40-byte
  render-info block, opening cutscene). It loads the current entity's jump-table-entry-0 graphics via
  loadEntityJumpOffset00Gfx_812B530, sets two bytes in the block pointed to by r5 (offset 3 = 0x20, offset
  0x1E = 0), zero-fills the 0x10-byte state buffer unk_20251A0, and finally copies a 30x20 background
  tilemap and spawns eStruct (type-9, 0x58-byte) records from the fixed table at byte_8129150. The rfu
  stop keyed on the dispatch byte suggests this scene can be entered from a wireless-connected state.
