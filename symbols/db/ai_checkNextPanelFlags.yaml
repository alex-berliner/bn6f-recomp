name: ai_checkNextPanelFlags
address: '0x08110D58'
kind: function
status: probable
summary: Tests whether the object's next vertical-movement position lands on a panel whose status flags
  match a fixed mask, returning 1/0.
interface: (r5 = battle object, reads oBattleObject_X/Y/YVelocity/Z) -> r0 = 1 if panel flags & byte_8110DB0
  nonzero, else 0; flags clobbered
details: Takes the object's current X/Y, adds YVelocity to Y (the next step of the motion), and uses the
  object's Z, converting that screen position to field panel coordinates with convertXYToPanelXY_800E258.
  It then fetches the panel status word via object_getPanelParameters and ANDs it with the constant mask
  byte_8110DB0. If any masked flag is set it returns 1, otherwise 0. This is a boolean 'is the panel I'm
  about to reach flagged' test used by attack AIs; the mask byte itself is data at 8110DB0 (snapshot shows
  0).
