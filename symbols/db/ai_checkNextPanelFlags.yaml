name: ai_checkNextPanelFlags
address: '0x08110D58'
kind: function
status: confirmed
summary: Returns 1 if the panel an AI battle object is about to move onto (position plus Y velocity) has occupied/blocked
  panel flags set, else 0.
interface: bool ai_checkNextPanelFlags(BattleObject* obj /* r5 */); returns r0 = 1 when blocked, 0 otherwise; r5
  and r7 preserved
details: 'Reads the object''s X, Y and YVelocity (oBattleObject_X/Y/YVelocity) from the battle object in r5, computes
  the next Y position as Y + YVelocity, converts that screen-space (X, Y) coordinate to a panel coordinate with
  convertXYToPanelXY_800E258, then fetches the panel''s parameter word with object_getPanelParameters. The parameter
  word is masked with the literal-pool value at 0x8110DB0 (0x03800000 - bits that mark a panel as occupied, e.g.
  holes/obstacles), and r0 is set to 1 if any of those bits are set, 0 if not. The object''s Z is loaded into r2
  before the convert call but the converter only consumes x/y, so the Z load is effectively dead in this routine.
  Note the panel is looked up at X unchanged and Y+YVelocity, so this predicts the panel after a one-frame movement
  along Y.

  '
