name: battle_slideXUpdate
address: '0x080D6364'
kind: function
status: probable
summary: Battle-object update that slides the object horizontally each frame at a table-driven XVelocity
  for a fixed Timer, re-registering its collision region (1) on panel crossings and destroying it on expiry
  or invalid/off-field panel.
interface: (r5 = battle object) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to
  CUR_STATE_DESTROY on expiry or invalid panel
details: 'On phase 0 it sets phase 4, looks up a byte via oBattleObject_Alliance from dword_80D63F8 (value
  7) and indexes byte_80D63E4 by oBattleObject_Param1<<2; the 32-bit entries (0x30000, 0x38000, 0x40000,
  0x48000, i.e. 3.0–4.5 in 16.16 fixed point) are fed to sub_80D6424 which returns an XVelocity and a
  frame Timer. Each frame it adds XVelocity to X, and via sub_80D650C detects a panel crossing: it clears
  the collision region, recomputes PanelX/PanelY from world coords (object_setPanelsFromCoordinates/object_updateCollisionPanels),
  and either re-registers in region 1 when the panel is valid and PanelX changed, or stays cleared when
  off-field/invalid. The Timer counts down each frame; when it expires (or sub_80D6544 signals stop),
  it clears its collision region and switches to CUR_STATE_DESTROY. This matches a short-lived horizontal
  projectile/hazard that damages via its collision region while crossing panels.'
