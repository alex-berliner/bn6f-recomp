  date: '2026-10-18'
  detail: 'sub_80D6364: phase-0 block stores Param1-table word into sub_80D6424, whose r0/r1 results are
    stored to oBattleObject_XVelocity and oBattleObject_Timer; loc_80D6386: X += XVelocity each frame,
    then panel-crossing branch clears region, calls object_setPanelsFromCoordinates/object_updateCollisionPanels/object_isCurrentPanelValid;
    loc_80D63BA: object_setCollisionRegion(1) only when PanelX changed and panel valid — collision active
    only on newly entered panels; loc_80D63D4: on timer expiry/stop, object_clearCollisionRegion then
    CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY; byte_80D63E4 entries 0x30000..0x48000
    are 16.16 fixed-point magnitudes, fitting a velocity/distance table selected by Param1'
