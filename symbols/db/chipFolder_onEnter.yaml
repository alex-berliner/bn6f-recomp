name: chipFolder_onEnter
address: '0x081234DC'
kind: function
status: probable
summary: 'Entry-state handler for the chip folder screen: initializes its graphics/windows, prints the
  initial label set, then advances the screen state to 0x18.'
interface: (r0-r3 = state-dispatch args, r5 = screen work struct) -> r0 = 0x18 stored to r5+2; no return
  value used
details: This is the 'on enter' step of a state-machine handler for the chip folder screen. It first calls
  chipFolder_init_812349C to set up the screen's GFX, handlers and window panels, then calls sub_8123D54
  with r0=0, which selects the first of two fixed label tables and renders it via the text printer sub_80465A0.
  Finally it stores 0x18 into byte r5+2, which is the next-state field of the screen work struct, handing
  control to the following state. The data pool around it (byte_81233D8/E0/E8 tables, off_81234FC) belongs
  to the same screen's label/state tables.
