name: battle_preUpdateAndGetPlayerObject_80103EC
address: '0x080103EC'
kind: function
status: confirmed
summary: Runs the standard pre-battle-update routine (sub_800A7E2) and then returns the player's battle object pointer.
interface: void sub_80103EC(void); /* preserves r4-r6, r10; returns player BattleObject* in r0 with c/v flags from
  battle_findPlayer's tail */
details: Tiny wrapper with no locals of its own. It first bl's sub_800A7E2, which per its placement acts as the
  shared pre-battle-update / state-refresh hook, then tails into battle_findPlayer (the "find player battle object
  by alliance" helper) whose result is left in r0 for the original caller. Because it falls through into battle_findPlayer
  rather than branching around it, the returned condition-code and overflow flags are whatever battle_findPlayer's
  tail leaves behind (c/v listed as outputs in the caller contract). Registers r4, r5, r6 and r10 are passed through
  untouched, so callers use them to carry context across the hook. r4-r6 are formally "outputs" only in the sense
  that they are preserved through both calls. No memory structures are touched directly by this function itself;
  all state effects come from the two callees.
