name: sub_801BCF4
address: '0x0801BCF4'
kind: function
status: confirmed
summary: Per-frame sprite update for a battle object (loads new anim if changed, then advances sprite), gated by
  pause/time-stop/freeze flags.
interface: u32 sub_801BCF4(u32 obj /* r5 */) -> r5 (obj unchanged); clobbers nz,c,v,r0-r3,lr; preserves r4,r5
details: 'Reads oObjectHeader_Flags bit 0x01 (HAS_SPRITE) -> must be set; bit 0x08 (FROZEN) -> must be clear; bit
  0x10 (IGNORE_TIMESTOP) -> if clear, bail when battle_isTimeStop returns nonzero.

  Early-outs when battle_isPaused() returns nonzero.

  If oBattleObject_CollisionDataPtr (off 0x10 into the battle object) is non-null AND oBattleObject_PreventAnim
  is nonzero, the animation is locked and the function returns without updating.

  Otherwise compares oBattleObject_CurAnim to oBattleObject_CurAnimCopy; on mismatch calls sprite_setAnimation(CurAnim),
  sprite_loadAnimationData(), then re-reads CurAnim into CurAnimCopy (the C re-read is because the sprite calls
  may have stomped CurAnim).

  Always (when not bailed) tails into sprite_update().

  Only r5 is used as an input/argument and only r5 is restored via push {lr}/pop {pc}; r4 is preserved by convention.

  Suspected caller: the per-frame object iteration in the battle dispatcher (one call per battle object each frame).

  '
