  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary correctly captures the scanning of 4 halfword slots in unk_2009480 via sub_803E78C,
    copying them into eLinkState offsets 0x38/0x3C (eCamera.unk_88/8C), the 0xFC control marker checks
    calling sub_803E828/850, and the held joypad + counter writes into eLinkState+0x34 fields. However,
    the interface description is wrong: it writes eLinkState.unk_88/8C buffers, not ''eCamera'' directly,
    and the ''row count'' is eLinkState+0x20 (unk_70), not ''unk_70/2 rows''. Also the interface line
    claims ''() -> void'' but the code is correct there. The function is link-cable input synchronization,
    so a clearer name is link_syncInputs.; run wf investigate investigate-20261019-010606; proposed by
    Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
