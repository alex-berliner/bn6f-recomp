name: spawnEnemy_80073E2
address: '0x080073E2'
kind: function
status: confirmed
summary: Spawns one enemy battle object from an EnemySetup record, reading its panel position, 12-bit enemy id,
  and alliance, optionally remapping the id per current battle effects.
interface: BattleObject *battle_spawnEnemyFromSetup(EnemySetup *setup /* r6 */); also reads r4, r7, r10 context
  from callers and passes r4/r6/r7 straight through; returns r0, r5 preserved, flags nzcv clobbered
details: 'Reads an EnemySetup record pointed to by r6: byte +0 bit 0 is the alliance flag (the remaining bits of
  that byte were consumed by whatever dispatched to this spawner); byte +1 holds the spawn panel, bits 0-2 = panel
  x and bits 4-7 = panel y, with panel y passed unmasked so a byte with bit 7 set spills into another row (kept
  as in the original); bytes +2/+3 form a 12-bit enemy id (low byte plus high nibble shifted up by 8) that can reference
  enemy navis, not just viruses, when > 0xFF. It then calls GetBattleEffects and tests bit 15 (0x8000, dword_8007420);
  if that bit is clear, the enemy id is first run through sub_800EC80, which may substitute a different id before
  spawning. Finally calls battle_spawnEnemyObject_800768C(enemy_idx, panel_x, panel_y, alliance, r5=0), whose BattleObject
  result in r0 plus the passthrough r4/r6/r7 values go back to the caller. r5 is used as a zero-valued 5th argument
  to the spawner and is restored before returning. r1-r3 and the id are briefly saved on the stack around the GetBattleEffects
  call.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
