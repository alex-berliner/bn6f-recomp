name: battle_aiGetAttackIndex
address: '0x080F85B2'
kind: function
status: confirmed
summary: Returns the attack index the battle AI should use, adding 60 to pick an alternate attack when the battle
  object carries one of two status flags.
interface: u32 battle_aiGetAttackIndex(u32 battle_object /* r5 */) -> r0
details: 'Takes the battle object in r5. Looks up a base attack index by calling sub_800FE28 with a static config
  pointer at dword_80F85D0 (0x0A141E28) and the object; then calls object_getFlag(r5) to read the object''s flag
  word. If either bit 15 or bit 13 is set (mask 0xA000), the returned index is offset by +0x3C (60), selecting an
  alternate attack variant. Preserves r4; clobbers r1-r2, lr and all flags. The base-index lookup helper (sub_800FE28)
  is undocumented, so the exact config structure it reads is not yet known.

  '
