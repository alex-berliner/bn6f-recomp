name: battle_aiGetAttackIndex
address: '0x080F85B2'
kind: function
status: probable
summary: Returns an AI attack/action index for the enemy AI handler, bumped by 0x3C when the queried battle
  object carries flag bits 0xA000.
interface: (r0 = constant 0xA141E28 passed through to sub_800FE28) -> r0 = base index from sub_800FE28,
  +0x3C if object_getFlag on that value has bits 0x8000|0x2000 set; flags preserved from tst.
details: Calls sub_800FE28 with a fixed literal (dword_80F85D0 = 0xA141E28) and keeps its return in r4
  while also feeding it to object_getFlag, so sub_800FE28 appears to resolve a battle object (or object
  reference) from that constant. It reads the object's first collision-flag word and tests bits 0xA000
  (0x8000 and 0x2000). If either bit is set it adds 0x3C (60) to the base value, otherwise returns it
  unchanged; the result is a small index/selector consumed by battle_aiEnemyAiActionHandler_80F8448 when
  picking an attack script. The +0x3C step looks like an offset into a parallel block of attack entries
  for a special enemy state (e.g. invisibility/stealth or a transformed state) keyed by those flag bits.
  The literal 0xA141E28 is not a valid GBA address, so it is likely an encoded object query key rather
  than a pointer.
