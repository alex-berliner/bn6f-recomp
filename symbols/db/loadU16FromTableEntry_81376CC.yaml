name: loadU16FromTableEntry_81376CC
address: '0x081376CC'
kind: function
status: confirmed
summary: Returns the u16 at [r0 + r1*2 + 4], i.e. entry r1 of the u16 array that begins 4 bytes into the table passed
  in r0.
interface: int loadU16FromTableEntry(const u16* table /*r0*/, int index /*r1*/) -> u16 value /*r0*/
details: 'Pure table lookup: computes r0 + r1*2 + 4 and loads a halfword from that

  address, so callers treat r0 as a pointer to a table whose first two

  halfwords (bytes 0-3) are skipped and whose payload is a u16 array indexed

  by r1 (index 0 -> base+4, index 1 -> base+6, ...). r1 is also used

  destructively (shifted left by 1) and r0 is overwritten with the loaded

  value, matching the caller contract where only r0 is read back. Tailcall

  via mov pc, lr; flags are set as a side effect of the sub/add but are not

  part of the contract (clobbered). Interestingly, the routine also loads

  the address of byte_20065B4 into r2 and the halfword at byte_20065B4 into

  r3, but never uses either value -- dead loads with no side effects,

  possibly remnants of a version of this routine that indexed or validated

  against that IWRAM counter. No structure fields are written anywhere.

  '
