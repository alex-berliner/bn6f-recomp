name: battle_spawnFlipIllusionAtObject
address: '0x08114192'
kind: function
status: probable
summary: Spawns an illusion object at a battle object's position, with the object's horizontal flip baked
  into the spawn descriptor.
interface: (r5 = battle object to spawn at) -> r0 = spawn result from spawnIllusionObject; no flag use
  shown
details: Reads the effective facing of the battle object in r5 via object_getFlip and shifts it into the
  top byte of a spawn-parameter word (flip << 24 | 0x41904), so the spawned illusion inherits the source
  object's side/flip. It then loads the object's X, Y and Z fields and passes them plus two constants
  (0x83E0 and 0x1010008) to spawnIllusionObject_80E33FA, which does the actual creation. The 0x41904 constant
  is likely the illusion/effect kind with embedded parameters, and 0x83E0 / 0x1010008 are sprite-related
  pointers or descriptor words. The whole function is just a parameter-packing wrapper; r5 is the only
  real input and is set up by the caller sub_8113984.
