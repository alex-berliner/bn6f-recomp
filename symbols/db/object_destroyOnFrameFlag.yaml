name: object_destroyOnFrameFlag
address: '0x080DD370'
kind: function
status: probable
summary: Destroys the calling battle object if its current animation frame has the delete flag (0x80)
  set in its attribute byte.
interface: (no args) -> r0 = destroyed or not; flags clobbered by calls
details: Calls sprite_getFrameParameters with the caller's object context to fetch the current animation
  frame's attribute byte, then tests bit 0x80 (tst r0,#0x80). If the bit is set, it calls object_genericDestroy,
  which releases panel tile reserves, collision data, and the object's memory; otherwise it returns immediately
  with the object intact. This implements the standard BN pattern where an animation frame marked 0x80
  signals one-shot objects to remove themselves. Note the return value of object_genericDestroy is left
  in r0, and no flags or registers beyond lr are preserved.
