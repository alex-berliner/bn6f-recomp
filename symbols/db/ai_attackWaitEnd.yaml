name: ai_attackWaitEnd
address: '0x080F15AA'
kind: function
status: probable
summary: 'AI attack-state handler: sets attack element 4 and a 30-frame timer on entry, then ends the
  attack when the timer runs out'
interface: (r0 = latched attack element read from oAIAttackVars_AttackElement, r7 = AI attack vars base,
  r5 = battle object) -> r0 clobbered; sets AttackElement=4, StepTimer=30, then CurAnim=0 and exits attack
  state
details: On first invocation (AttackElement == 0) it latches element 4 into oAIAttackVars_AttackElement
  and stores 30 into the StepTimer halfword, effectively arming a 30-frame delay. On subsequent runs it
  decrements StepTimer and keeps returning until it hits zero. Once the timer expires it writes animation
  0 to oBattleObject_CurAnim and tail-calls object_exitAttackState to leave the attack state. It is a
  stateful per-frame tick whose phase is remembered via AttackElement, a common pattern in the AI attack-var
  block.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — first-entry check on element field; strb
    #4 to AttackElement and strh #0x1e to StepTimer arm a 30-frame wait; decrement of StepTimer with bgt
    keeps it pending for exactly 30 frames; writes #0 to [r5,#oBattleObject_CurAnim] before object_exitAttackState,
    resetting the object''s animation at attack end; bl object_exitAttackState (0x08011714) — called only
    on timer expiry, ending the AI attack'
