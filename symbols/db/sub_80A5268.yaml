name: sub_80A5268
address: '0x080A5268'
kind: function
status: hypothesis
summary: Per-frame step for a sub-object that drives sprite animation/sound based on event flags and a screen-fade
  tick, transitioning the parent's sub-state machine.
interface: void sub_80A5268(u32 r2, u32 r4, parent* r5, u32 r6, sub_object* r7, u32 r10, lr); clobbers r0,r1,r3,lr;
  preserves r4,r5,r6,r7,r10; outputs r2,r5,r10
details: "Acts as a self-contained state-tick for a sub-object structure (pointed at by r7) attached to a parent\
  \ (r5).\nSub-object fields read:\n  +0x0 u16 flag_a (gate flag, checked first via TestEventFlag; if already set,\
  \ skip to sprite_update)\n  +0x7 u8  sub_state (must be 1 to take the \"done\" branch)\n  +0x8 u8  anim_a\n  +0x9\
  \ u8  anim_b\n  +0x2 u16 flag_b\n  +0x4 u16 flag_c\n  +0xE u16 sound_id (sentinel 0xFFFF = silent)\nParent fields\
  \ written:\n  +0x8 u8  next_sub_state (0x0C, 0x08, or 0x10 depending on branch)\n  +0x24 u32 zeroed in the sub_state==1\
  \ branch\nThe screenFade_80062C8 result is shifted right by 2 and bit 1 tested; when that bit is set the\nfunction\
  \ falls straight through to the shared tail (flag_c / anim branch), effectively skipping the\nsub_state-driven\
  \ play_sound_effect/sprite-set branch — i.e. the fade tick gates whether fresh\nanimation/sound work is queued\
  \ this frame.\nBranch summary:\n  * flag_a already set → no work, just sprite_update.\n  * sub_state == 1 → set\
  \ anim_b, reload anim data, set flag_c, zero parent+0x24, set next_sub_state=0x0C.\n  * sub_state != 1 → optionally\
  \ PlaySoundEffect(sound_id) if != 0xFFFF.\n  * Shared tail: set flag_c; if anim_b == anim_a → set flag_b and next_sub_state=0x10\
  \ (terminal);\n    otherwise set anim_b, reload anim data, next_sub_state=0x08.\nsprite_update is always called\
  \ last (via `pop {pc}`, i.e. tail call). 0xFFFF at 0x080a52e0 is the\nsentinel meaning \"no sound\".\n"
