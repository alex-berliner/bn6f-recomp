    reconcile)'
open_questions:
- No known caller, so which map object/NPC uses this and the meaning of the 0x23 state byte are unconfirmed
- sub_8118AB0 is unknown; its return decides the base animation index and may reveal the object type
- Whether [r5] (the 1/0x23 byte) is a dialogue-state or a separate sprite state needs caller context
- The summary direction is mostly correct, but several details are wrong. The new anim index is written
  to [r5+0xc] (matches), but the 'old index' is read from [r5+0xd] not [r6+0xd] — [r6+0xd] is where the
  normalized sub_8118AB0 result is stored as the comparison value, while the code does `cmp r0, r1` with
  r0=[r5+0xc] and r1=[r5+0xd], so the 'old index' is at r5+0xd. Also r7 starts as 0 and is set to 2 when
  [r6+0x10]!=0, else 1 if battle_checkItemFlagFor_813B9B4 returns nonzero — that is correct. The initial
  event-flag block writes 1 to [r5] when bit 0x80 is set and 0x23 when clear (mov r4,#1 / mov r4,#0x23).
  State struct is r5, object ptr is r6.
