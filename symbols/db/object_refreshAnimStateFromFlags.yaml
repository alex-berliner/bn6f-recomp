name: object_refreshAnimStateFromFlags
address: '0x0811891C'
kind: function
status: probable
summary: Reads an event-flag bit, an inline data flag and the item-flag table to compute a state byte
  and an animation index; updates the sprite only when the new index differs from the cached one.
interface: (r5 = state struct ptr, r6 = object data ptr) -> r0 = sprite_loadAnimationData result path;
  writes state byte to [r5], new anim index to [r5+0xc], old-index flag to [r6+0xd]; no return value used
details: 'First it tests event flag 0x80 via chatbox_mask_eFlags2009F38 and stores 1 (flag set) or 0x23
  (flag clear) to [r5], a state byte that likely drives a later dialogue/state machine. It then computes
  an animation selector r7: 2 if [r6+0x10] is nonzero, else 1 if battle_checkItemFlagFor_813B9B4([r6+0x28],
  [r6+0x2c]) finds a set entry in the 0x200414c item-flag array, else 0; the result is saved to [r5+0xc].
  It calls sub_8118AB0, normalizing its truthiness into 0/1 stored at [r6+0xd], which acts as the object''s
  current animation index. If the freshly chosen index differs from the current one, it calls sprite_setAnimation
  with the new index and sprite_loadAnimationData to apply the change; otherwise it returns without touching
  the sprite. The pattern is a per-frame/tick ''refresh my sprite from world state'' routine for one interactive
  map object.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'chatbox_mask_eFlags2009F38(0x80) selects between storing 1 and 0x23 into [r5] (loc_811892A);
    anim selector: [r6+0x10] -> 2, else battle_checkItemFlagFor([r6+0x28],[r6+0x2c]) -> 1, else 0, stored
    at [r5+0xc]; result of sub_8118AB0 normalized to 0/1 and written to [r6+0xd] as the current index;
    cmp [r5+0xc], [r5+0xd]; on mismatch calls sprite_setAnimation then sprite_loadAnimationData, i.e.
    anim change on state transition only'
