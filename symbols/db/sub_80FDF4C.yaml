name: sub_80FDF4C
address: '0x080FDF4C'
kind: function
status: hypothesis
summary: One-line thunk that hands the address of a static work area (dword_80FDF5C) to sub_800FE28 and returns
  its results.
interface: void sub_80FDF4C(void) -> returns r0 and r2 set by sub_800FE28; r5 is also live on entry and presumably
  consumed by the callee; flags clobbered
details: 'The function is a bare wrapper: it pushes lr, loads the fixed address

  dword_80FDF5C (a .word 0x0 work area in the same literal pool/rodata) into r0,

  tail-calls sub_800FE28 via bl, and pops pc. The callee''s outgoing registers

  (r0, r2) become this function''s outputs; r5 passes through untouched as an

  implied argument. Nothing else is touched here, so all gameplay meaning lives

  in sub_800FE28 and whatever reads/writes dword_80FDF5C.

  '
