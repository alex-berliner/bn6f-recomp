name: battle_checkEmergeDirectionFlip
address: '0x0800F46C'
kind: function
status: probable
summary: Returns a battle object's DirectionFlip for its panel-landing/emerge animation, forced to 0 when
  the battle's panel column pattern is one of three special layouts.
interface: (implicit r5 = battle object ptr) -> r0 = DirectionFlip byte, or 0 if panel pattern is 0x30/0x38/0x3c;
  flags not meaningful
details: Queries the active battle's panel column pattern via GetBattlePanelColumnPattern and compares
  it to 0x30, 0x38, and 0x3c (likely full-field/special panel layouts, e.g. from certain area or boss
  encounters). If none match, it returns the object's oBattleObject_DirectionFlip byte read from [r5,#oBattleObject_DirectionFlip];
  otherwise it returns 0, suppressing the flip. r5 is a high-register parameter set by the caller to the
  battle object being moved. All callers are AI move/landing handlers (ai_relocateToFuturePanel, battleObject_commitMoveLanding
  and related sub_8014Fxx/8015xxx helpers) that place an object on its reserved future panel with an emerge-style
  animation, so this is the flip lookup for that placement.
