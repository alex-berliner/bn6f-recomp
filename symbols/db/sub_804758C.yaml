details: 'The function is a two-instruction stub: it pushes {r5,lr}, then BLs into

  sub_80478D4, whose return becomes this function''s return via the POP {r5,pc}.

  It does not touch r5 itself (it is pushed/popped purely as a placeholder to

  keep the stack aligned for the BL), reads no globals, writes no memory, and

  takes no arguments of its own — everything meaningful happens inside

  sub_80478D4. Because it merely relays to the callee, it is most likely a

  veneer used for a cross-region call, a hook/patch site, or a separate

  entry point that used to hold its own code. Game behavior cannot be

  attributed to this routine independently; it is whatever sub_80478D4 does

  (that callee is not shown here, so no game-level meaning is claimed).

  '
