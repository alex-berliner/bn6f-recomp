name: t3_0x8c_80D6A20
address: '0x080D6A20'
kind: function
status: confirmed
summary: Per-frame update for the snake-arm battle object; dispatches a state handler from CurState and then runs
  the common sprite update.
interface: void t3_0x8c_80D6A20(r5 = battle object pointer); trashes r0-r4,r6,r7,r12,flags; returns via pop {pc}
  (state handlers are dispatched with mov lr,pc; bx r1 so they return through this epilogue)
details: 'Battle-object tick for what the state table names "snake arm" (likely the snake/SnakeArm chip attack entity).
  Reads oBattleObject_CurState from the object at r5, uses the raw byte as a byte-offset index into the jump table
  off_80D6A38 (so the valid state values are spaced 4 apart), and calls the handler with r0 = state index and r1
  = handler address via mov lr,pc; bx r1 — the handler''s "return" lands on the bl object_updateSprite that follows,
  so every state handler ends by falling into the shared sprite update with whatever r5 it left (handlers may retarget
  r5 to a different object). Table entries: state 0 -> battleObject_snakeArmSpawn_80D6A44 (spawn/ advance the arm
  segments), state 4 -> snakearm_hitUpdate (active arm, collision/damage handling), state 8 -> object_genericDestroy
  (kill the object). After the handler, object_updateSprite refreshes the entity''s sprite/animation from the object
  struct.

  '
