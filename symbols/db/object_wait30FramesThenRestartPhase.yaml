name: object_wait30FramesThenRestartPhase
address: '0x080C2300'
kind: function
status: probable
summary: 'Battle-object phase 4 handler: waits 30 frames, then switches the object to action 0x10 and
  resets its phase state.'
interface: (r5 = battle object) -> void; no return value, flags clobbered
details: If oBattleObject_PhaseInitialized is 0, writes 4 to it and 0x1E (30) to oBattleObject_Timer —
  phase 4 is a 30-frame wait. Otherwise it decrements oBattleObject_Timer each call and returns while
  it is still >0. When the timer reaches 0 it sets oBattleObject_CurAction to 0x10 and stores 0 into the
  halfword oBattleObject_CurPhaseAndPhaseInitialized, clearing both CurPhase and PhaseInitialized so the
  object's update loop starts the new action from phase 0. Uses r5 as the object pointer without setting
  it up itself, so it is a phase/update callback invoked with the object already in r5.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized]; mov r0,#4; strb + mov r0,#0x1E; strh Timer: initializes
    phase 4 with a 30-frame timer; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt exit: counts
    the timer down one frame per call; mov r0,#0x10; strb [r5,#oBattleObject_CurAction]: on timeout the
    object transitions to action 0x10; mov r0,#0; strh [r5,#oBattleObject_CurPhaseAndPhaseInitialized]:
    clears phase+initialized so the new action starts at phase 0'
  refs:
