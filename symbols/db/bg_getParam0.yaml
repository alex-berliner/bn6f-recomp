name: bg_getParam0
address: '0x0802E440'
kind: function
status: probable
summary: Returns the first halfword parameter of a background-table entry looked up from the given id,
  used when laying out background tiles.
interface: (r0 = background/table id, passed through to sub_802E490) -> r0 = halfword at [entry+0]; no
  flags relied on
details: 'The function just calls sub_802E490 (which turns r0 into a pointer, presumably indexing a background/data
  table) and loads the 16-bit value at offset 0 of the returned entry. Two sibling getters (sub_802E44A,
  sub_802E454) read further halfword fields of the same entry. In sub_802E86C the value is compared against
  0xFFFF together with the two siblings: if all three are 0xFFFF the caller treats the entry as unset
  and returns 0, so 0xFFFF acts as an ''invalid/none'' sentinel. In sub_801D2A4 the result is passed as
  the first argument to sub_801D344 right after CopyBackgroundTiles fills the tile block from byte_801D9B4,
  i.e. it feeds the background drawing routine.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_802E440: ''bl sub_802E490; ldrh r0,[r0]'' — pure getter of halfword field 0 of the entry
    returned by the lookup; call site 0x0801D2CA: result passed as r0 to sub_801D344 alongside a tile
    id from sub_802E066 after CopyBackgroundTiles, so it is a background-layout parameter; sub_802E86C:
    result compared to 0xFFFF with sub_802E44A/sub_802E454 results; all three 0xFFFF means ''no entry''
    (returns 0); call site reads the id from ''ldrb r0,[r0,#0x16]'' of a struct, so the getter is selected
    per-object/per-area id'
