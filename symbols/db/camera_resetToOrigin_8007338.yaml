name: camera_resetToOrigin_8007338
address: '0x08007338'
kind: function
status: confirmed
summary: Resets camera state and re-initializes it at the origin of map group 0xF0, map 0, then clears camera field
  unk03/14.
interface: void sub_8007338(void)
details: Thin wrapper around the camera subsystem. First calls sub_80303E8 (the camera's reset/reinit routine).
  Then calls camera_init_802FF4C with player_x = 0, player_y = 0, player_z = 0, map_group = 0xF0, map_number = 0
  — placing the camera at the world origin of a pseudo-map group (0xF0 is not a normal map id, suggesting a special/default
  context such as a menu or non-map scene). Finally calls camera_writeUnk03_14_80301b2 with r0 = 0 to clear the
  camera's unk03/14 field. No inputs are read from the caller beyond lr; all arguments are hardcoded constants,
  and r5-r9/r12 are incidentally preserved.
