open_questions:
- What the value at r6+2 represents (sprite-id/anim-id field) and which sub_ entry corresponds to which
  BeastSP sprite variant; also why r6 (not r5) is used for the dispatch index. A side-by-side map of sprite_id
  -> jump-table entry would settle the variant names.
