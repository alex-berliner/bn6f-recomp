name: subsystem_triggerTransition_800630A
address: '0x0800630A'
kind: function
status: confirmed
summary: Per-frame dispatcher that calls the active screen-fade handler for each of the two 0x20-byte screen-fade
  slots.
interface: void tickScreenFadeSlots_800630A(void);
details: 'Iterates over two 0x20-byte slots anchored at the global ''eScreenFade'' (one per fade channel,

  likely the in/out fades of a screen transition). For each slot whose state byte (offset 0)

  equals 1, reads the mode byte (offset 1) and uses it to index a 4-byte function-pointer table

  at off_8005FB4, then tail-calls the selected handler via ''mov lr,pc; bx r0''. The handler is

  entered with r0=handler, r1=1, r2=mode. Inactive slots are skipped by advancing to the next

  0x20-byte entry. No fade state is modified here; this routine is purely a poll-and-dispatch

  used to drive the transition each frame from whatever subsystem owns the fade slots.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
