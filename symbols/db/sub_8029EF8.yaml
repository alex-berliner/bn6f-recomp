name: sub_8029EF8
address: '0x08029EF8'
kind: function
status: confirmed
summary: Builds a list of selectable PET-Navi candidates in the caller's work area, skipping locked, masked, and
  currently-active ones.
interface: "u32 sub_8029EF8(void);\n  // inputs:  R5 = pointer to caller's work buffer\n  // outputs: R0 = number\
  \ of candidates listed (also written through R5)\n  // clobbers: R0..R3, LR; preserves R4, R5, R6; flags NZCV\
  \ trashed\n  // calls: TestEventFlag (R0 = flag id), GetCurPETNaviStatsByte (R0=0, R1=0x17)\n"
details: "Iterates i = 0..4 (CANDIDATE_COUNT = 5) over a ROM table at byte_8029F4C whose entries are\nu32 words\
  \ containing event-flag ids 0xE7..0xEB (one per candidate). A candidate i is appended\nto the list when ALL of\
  \ the following hold:\n  - TestEventFlag(flag_id) clears Z (i.e. its story flag is set);\n  - bit (5 + i) of the\
  \ mask word at dword_20349A0 is clear;\n  - GetCurPETNaviStatsByte(0, 0x17) != 6 + i (the active candidate itself\
  \ is excluded).\nFor each accepted candidate the function stores, through R5 (work base):\n  - work[0x50 + listed]\
  \ = (u8)i     (LISTED_ID_OFFSET)\n  - work[0x55 + listed] = 0         (LISTED_ZERO_OFFSET, cleared)\nand increments\
  \ `listed`. Returns `listed` in R0. R5 is preserved across the loop so the\ncaller can read the populated list\
  \ directly.\nQuirks:\n  - The skip test for \"active candidate\" compares the stats byte against 6+i, not against\n\
  \    a fixed id; the table at byte_8029F4C is treated as index-aligned (entry i -> id 6+i).\n  - The ROM table\
  \ is a u32-per-entry array; only the low u16 is used as the flag id.\n  - LISTED_ZERO_OFFSET writes 0 to a parallel\
  \ byte (0x55+n) whose meaning is unknown here.\n"
