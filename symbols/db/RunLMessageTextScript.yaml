name: RunLMessageTextScript
address: '0x08099218'
kind: function
status: confirmed
summary: Plays a chatbox line spoken by the player's PET Navi (humor joke or poem) when valid, otherwise falls back
  to the current map's train/text script.
interface: void chatbox_runPETNaviScript_08099218(void); // uses R10 (toolkit ptr), preserves r4-r7, returns NZ
  and 0 in r0
details: "Called when the player talks to their PET Navi. Branches via GetCurPETNavi() and, if no PET Navi is set,\
  \ runs the default map text script (chatbox_uncompMapTextArchives_803FD3C then chatbox_runTrainScript indexed\
  \ by oGameState_Unk_15).\n\nWhen a PET Navi exists and either the map group is in the Internet range (>= INTERNET_MAP_GROUP_START)\
  \ or the offline gate passes (none of EVENT_COPYBOT_ACTIVE / EVENT_PET_NAVI_ACTIVE / EVENT_172A in flag bank 0x17\
  \ are blocking), it consults NaviStats:\n  - Humor == 1 -> decompresses CompText8738B24 and runs chatbox_runScript\
  \ with index 0 (Megaman jokes).\n  - Poem == 1 -> decompresses CompText873A528 and runs chatbox_runScript with\
  \ index 0 (Navi poems).\n  - Otherwise -> default map/train script.\n\nTouches: GameState via toolkit (R10 + oToolkit_GameStatePtr)\
  \ -> oGameState_MapGroup, oGameState_Unk_15; PET Navi stats via GetNaviStatsByte at offsets oNaviStats_Humor /\
  \ oNaviStats_Poem. The output \"nz\" flag with r0=0 is the \"I handled it\" return contract for the chatbox script\
  \ dispatcher.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C\
  \ allowed; tools/abi/retype_queue.tsv)."
