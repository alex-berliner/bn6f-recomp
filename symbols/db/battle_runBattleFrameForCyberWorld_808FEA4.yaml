status: probable
summary: Per-frame battle update gated to a specific cyberworld map (0x83 or 0x85:0x02)
interface: '(r10 = toolkit) -> void ; side effects: dispatches AI and refreshes battle-object sprite gfx
  when the gate is open'
details: "Loads GameStatePtr from r10 (oToolkit_GameStatePtr) and reads MapGroup/MapNumber.\n  If MapGroup\
  \ == 0x83 the gate is unconditionally open. If MapGroup == 0x85 the gate\n  additionally requires MapNumber\
  \ == 0x02 (so the (0x85,0x02) cyberworld variant).\n  Outside those cases the function returns immediately\
  \ without touching battle state.\n  When the gate is open, fetches the pointer stored at off_808FDB8\
  \ into r5, calls\n  sub_808FF44 (which the contract marks as taking r5 in/out), then checks\n  (r5+0x5)\
  \ — likely a per-frame \"busy\"/\"frozen\" flag, since the\n  BattleObject struct's AIDataPtr + 0x5\
  \ maps to AIData.APwrAtk and the AIData offset\n  0x5 of the BattleObject AIData area.  Reading the\
  \ code's own comment,\n  \"(byte_2000315 - 0x2000310)\", it accesses r5+5 as a byte; if it is non-zero\
  \ the\n  routine bails out (no AI dispatch / no sprite refresh).\n  Only when r5+5 is zero does it call\
  \ sub_8046818 (battle_callAIDispatch_8046818)\n  and then sub_8046854 (battleObject_updateSpriteGfxForAll_8046854)\
  \ before\n  returning. Effectively a \"frame tick for the cyberworld battle scene\": if not\n  locked\
  \ by r5+5, run AI dispatch and refresh all battle-object sprite graphics.\ndetails-step-by-step:\n \
  \ 1. push {r4-r7,lr}; r0 = r10; r0 = [r0 + oToolkit_GameStatePtr]\n  2. r1 = GameState.MapGroup; r2\
  \ = GameState.MapNumber\n  3. if MapGroup==0x83 fall through; if MapGroup==0x85 require MapNumber==0x02,\n\
  \     else locret\n  4. r5 = *off_808FDB8 (a long-lived state pointer used by sub_808FF44)\n  5. bl\
  \ sub_808FF44 — sets up something using r5\n  6. if [r5+5] != 0, return (no AI / no sprite work)\n \
  \ 7. bl battle_callAIDispatch_8046818\n  8. bl battleObject_updateSpriteGfxForAll_8046854\n  9. pop;\
  \ return via pc\n"
