open_questions:
- Exact semantics of `[r5+5]` flag; the AIData offset 0x5 is APwrAtk, but here it is being read on the
  pointer loaded from off_808FDB8 (which may or may not be AIData). Deciding which struct r5 actually
  points to would require following off_808FDB8 and the writer of that pointer.
- Whether the gate condition really means "cyberworld" or just "these two specific maps" — only heuristic
  from map-id values.
