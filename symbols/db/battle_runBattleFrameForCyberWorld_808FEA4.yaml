name: battle_runBattleFrameForCyberWorld_808FEA4
address: '0x0808FEA4'
kind: function
status: confirmed
summary: Per-frame Cyber World battle update - checks the current map is a Cyber World map, then re-applies the
  player-ally lockout, dispatches enemy AI, and refreshes all battle-object sprite graphics.
interface: void battle_runBattleFrameForCyberWorld_808FEA4(u32 r10 /* toolkit */); preserves r4-r7,r8,r9,r12; leaves
  r8-r12 as left by battleObject_updateSpriteGfxForAll_8046854 on the full path; flags NZCV clobbered
details: 'Takes the GameState pointer from the toolkit at r10 (oToolkit_GameStatePtr) and reads oGameState_MapGroup
  / oGameState_MapNumber. Only proceeds when the map is group 0x83 (any map) or group 0x85 map 2 - i.e. the Cyber
  World battle maps; otherwise it returns immediately without touching anything. On the Cyber World path it loads
  the Cyber World state handle from the pointer table off_808FDB8, calls battleObject_togglePlayerAllyLockout_808FF44
  with that handle in r5 (the callee returns the state struct pointer it operated on in r5). If the byte at state+5
  (byte_2000315, presumably a "skip AI this frame" / lockout-set flag) is nonzero, it returns early. Otherwise it
  calls battle_callAIDispatch_8046818 to run enemy/ally AI dispatch, then battleObject_updateSpriteGfxForAll_8046854
  to refresh every battle object''s sprite graphics for the frame. Note the AI dispatch is skipped entirely when
  the flag is set, but the sprite update is also skipped on that early exit (both calls sit after the flag check),
  so a set flag freezes both AI and sprite-GFX updates for the frame.

  '
