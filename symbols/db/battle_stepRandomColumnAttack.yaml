name: battle_stepRandomColumnAttack
address: '0x080CEF90'
kind: function
status: probable
summary: Battle-object attack state handler that spawns three attack objects on random columns in front
  of the object (sound 0xB9), then moves to action 8.
interface: (r5 = battle object) -> r0 = 0 from last PlaySoundEffect path; r4/r6 clobbered as spawner args;
  flags from subs/cmp
details: On first entry (CurPhase==0) it sets CurPhase=4, CurAnim=1, Timer2=3, Timer=0 — a state transition
  for this attack. Every 10 frames (Timer reset to 0xA) it draws GetPositiveSignedRNG()&3 to index the
  table dword_80CEFF8, whose bytes are 0x08,0x10,0x18,0x20 (four horizontal offsets, likely pixels or
  tile sub-positions), and calls spawn_t3_0x12_80C6ADA with r0 = object_getFrontDirection() + PanelX,
  r1 = PanelY, r2 = Element, and the table byte pushed on the stack (shifted left 16, so read as a halfword/parameter
  by the spawner). Each spawn plays sound effect 0xB9. Timer2 counts the three spawns; when exhausted
  it sets CurAction=8 and clears CurPhase/PhaseInitialized, ending the attack.
