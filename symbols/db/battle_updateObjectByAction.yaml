name: battle_updateObjectByAction
address: '0x080DC160'
kind: function
status: probable
summary: Runs the action-specific routine for a battle object, then ticks its sprite animation.
interface: (r5 = battle object pointer) -> r0 = object_updateSprite result; no meaningful flags
details: Reads the object's oBattleObject_CurAction byte from r5 and uses it to index a two-entry table
  of thumb handlers (actions 0 and 1 at sub_80DC180 and sub_80DC1A2), calling the selected one via blx-style
  bx with lr set. After the handler returns it unconditionally calls object_updateSprite to advance the
  object's animation frame. The use of r5 as the object base matches the battle object loop convention,
  and only two actions are handled, so it is a narrow dispatcher rather than a general update.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0] indexes the table off_80DC178; table
    holds exactly two handlers, sub_80DC180+1 and sub_80DC1A2+1; tail calls object_updateSprite, the known
    per-object sprite ticker; caller sub_80DC108 invokes it in the object update path
  refs:
  - bn6f/asm/asm31.s:78954
