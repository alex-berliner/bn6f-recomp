    the hit lands (loc_80FE498); bl GetAIDataUnk0x48Flag / tst r0,#0x20 / bl ClearAIDataUnk0x48Flag —
    a one-shot trigger flag controls the telegraphed variant; strb #7 to oBattleObject_CurAnim and PlaySoundEffect(0xE1)
