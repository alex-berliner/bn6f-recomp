name: ai_stageWoodAttackHit
address: '0x080FE46C'
kind: function
status: probable
summary: 'Battle AI helper that stages a wood-element attack: plays a one-shot telegraph animation/sound
  with a 19-frame delay when triggered, then sets the hit element to wood.'
interface: (r0 = scratch/callee arg; r7 = oAIAttackVars, r5 = battle object) -> r0 = clobbered; updates
  oAIAttackVars_AttackElement/StepTimer/HitElement and object CurAnim
details: If oAIAttackVars_AttackElement (via r7) is nonzero, it decrements oAIAttackVars_StepTimer and
  returns until it reaches 0, then falls through to set oAIAttackVars_HitElement = 4 (wood). On the initial
  call it stores AttackElement = 4, then reads the AI data unk0x48 flag via GetAIDataUnk0x48Flag and tests
  bit 0x20. If the bit is set it clears it (ClearAIDataUnk0x48Flag), sets object CurAnim = 7, plays sound
  effect 0xE1, and loads StepTimer = 0x13 (19 frames) so the hit lands after the telegraph; if the bit
  is clear it skips straight to HitElement = 4, i.e. an immediate hit.
