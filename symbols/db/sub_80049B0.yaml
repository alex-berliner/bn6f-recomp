summary: One-line thunk that invokes sub_80028C0 with the constant 5 and returns.
interface: void sub_80049B0(void); /* result of the tail-called routine arrives in r2 */
details: Saves lr, loads r0 with the constant 5, calls sub_80028C0, and returns immediately with pop {pc}; the called
  routine's result is observed in r2 by callers. Because the call is not a tail call (lr was pushed, so r0's return
  value is discarded and control resumes after the bl), the call's effect is side-effect based from this wrapper's
  point of view. Without knowing what sub_80028C0(5) selects (e.g. a mode, page, or sound), no game-level meaning
  can be assigned yet.
