    via ExtraVars+8 countdown; bl spawn_t1_0x5_tempAttackObject_80B8E30 with r7=object+0x60 and r4=(object_getFlip()<<8)+0x5d;
    bl object_getCoordinatesForPanels then spawn_t1_0x0_EffectObject with +0x180000 offsets and Timer copied into
    the effect; on Timer expiry: CurAnim/CurAction/CurPhaseAndPhaseInitialized zeroed and sub_80B8E58(ExtraVars[0])
    called'
