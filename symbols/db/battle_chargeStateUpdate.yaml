  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The proposal
    is mostly accurate, but the summary exaggerates a ~2 second timescale (Timer=120 frames = 2.0s) and treats the
    spawn pattern as standard. The spawn_t1_0x5 call at 0x080DF76C spawns and links into r7 (not really ''passing
    (facing<<8)+0x5d'' — r4 holds the argument register but spawn_t1_0x5 doesn''t take it; r4 is loaded with dword_80DF904=0x1090b
    then overwritten by lsl r4,r0,#8 before being used only as offset 0x5d added later, so it''s dead before spawn).
    The 0x180000 is 24*4 panels in 16.16, and Final: ExtraVars[0] is just zeroed implicitly via strh at CurPhaseAndPhaseInitialized;
    the real ''next phase'' is sub_80B8E58 called with ExtraVars[0] (likely a class/state index).; run wf investigate
    investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
