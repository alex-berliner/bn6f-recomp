name: battle_chargeStateUpdate
address: '0x080DF742'
kind: function
status: probable
summary: 'Per-frame handler for an object''s 120-frame charge-up state: initializes PhaseInitialized=4/Timer=120/Timer2=10/CurAnim=4,
  plays sounds 0xF8 then 0xF9, spawns a linked subtype-5 temp attack object and a panel-anchored type-4 effect object,
  then beeps sound 0xF9 every 10 ticks until Timer expires, at which point it clears CurAnim/CurAction/CurPhaseAndPhaseInitialized
  and tail-calls sub_80B8E58(ExtraVars[0]) to hand control to the next phase.'
interface: (r5 = battle object pointer) -> r0 = destroyed; touches PhaseInitialized, Timer, Timer2, CurAnim, CurAction,
  ExtraVars
details: 'Standard phase-handler pattern: on first entry it sets PhaseInitialized=4, Timer=0x78 (120 frames), Timer2=0xA,
  CurAnim=4, plays sound 0xF8 followed by 0xF9, and stores 11 in ExtraVars+8 as a repeat counter. It spawns a subtype-5
  temp attack object linked to this object (link slot at object+0x60), passing parameter (facing<<8)+0x5d built
  from object_getFlip, then spawns a type-0 effect object at this object''s panel coordinates offset by +0x180000
  (24.0 in 16.16, likely a vertical pixel offset) and copies the 120-frame Timer into it so they run in parallel.
  Each subsequent frame it decrements ExtraVars+8 and replays sound 0xF9 every 11 ticks (a repeating telegraph beep),
  while counting down the main Timer. When the Timer expires it resets CurAnim, CurAction and CurPhaseAndPhaseInitialized
  to 0 and tail-calls sub_80B8E58(ExtraVars[0]), presumably handing control to the next phase. The load of dword_80DF904
  (=0x1090b) into r4 is dead — r4 is overwritten by lsl r4,r0,#8 before use.'
