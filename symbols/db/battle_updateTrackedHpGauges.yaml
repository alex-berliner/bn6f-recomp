name: battle_updateTrackedHpGauges
address: '0x080E73A2'
kind: function
status: probable
summary: Battle-object phase handler that draws HP gauges/markers over up to four tracked objects and
  syncs their shown HP to the owner's HP with a change sound.
interface: (r5 = battle object, no args) -> void; writes oBattleObject_Timer, oBattleObject_PhaseInitialized/phase,
  entry fields [entry+0x24]
details: On first run (PhaseInitialized==0) queues a 0x100-byte tile transfer to VRAM 0x06017940 and a
  0x20-byte (16-color palette) transfer to IWRAM 0x030016F0, sets Timer=0x3C and phase 4. Each frame it
  scans four pointers at r5+0x64; for each non-null entry it reads panel coords from [[entry+0x54]+0xA/0xB],
  converts them via object_getCoordinatesForPanels, projects them with projectObjectToScreen_800362C (input
  struct carries entry+0x3c at sp+8), and calls sub_800AE90 to draw. After 60 frames it reads its HP from
  ExtraVars+oBattleObject_HP; for each entry it compares the entry's halfword at +0x24, plays SFX 0x119
  if the old value is lower or 0x11A if it is >= the new HP, then stores the HP into +0x24. Finally it
  sets Timer=0x1E and switches CurPhaseAndPhaseInitialized to 0xC.
