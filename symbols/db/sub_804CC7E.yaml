name: sub_804CC7E
address: '0x0804CC7E'
kind: function
status: hypothesis
summary: Writes the constants 8 and 0x10 into byte fields +2 and +3 of the toolkit's 2009740 object, switching that
  object into a particular mode.
interface: 'void sub_804CC7E(void) // in: r10 = toolkit base (reads oToolkit_Unk2009740_Ptr), lr = return; no register
  outputs (r5 declared "output" by callers but is unchanged)'
details: 'Tiny three-instruction routine (plus prologue/epilogue) that loads the pointer stored at

  toolkit+oToolkit_Unk2009740_Ptr and stores 8 at byte +2 and 0x10 at byte +3 of that object,

  then returns. No other fields are read or written, and nothing else about the object is

  touched, so the meaning of these bytes is unknown. The object at 2009740 in BN6 appears to be

  some kind of mode/state or overlay controller; storing a small pair of constants here looks

  like entering a fixed mode (e.g. 8 = state/id, 0x10 = parameter/timer step). Note the unusual

  calling convention: the toolkit base is passed in r10 and the return address arrives in lr

  (this is reached via a tail-style/BLX-less path), and the lifter''s caller analysis claims r5

  is "returned" even though the function never modifies it, suggesting r5 is simply live across

  the call. The push/pop of r4-r7 is just to align and preserve registers across the sequence.

  '
