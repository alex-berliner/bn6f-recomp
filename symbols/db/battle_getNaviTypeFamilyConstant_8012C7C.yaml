name: battle_getNaviTypeFamilyConstant_8012C7C
address: '0x08012C7C'
kind: function
status: confirmed
summary: Reads a battle object's navi-type byte (alliance stats offset 0x2C) and maps the two navi-type families
  {2,0x0E} and {3,0x0F} to the constants 0x4000 and 0x28, returning 0 for anything else (or if the object pointer
  is null).
interface: u32 battle_getNaviTypeFamilyConstant_8012C7C(BattleObject* obj /* r0 */)
details: 'Calls GetBattleNaviStatsByte_AllianceFromBattleObject with r1=0x2C to fetch the battle object''s navi-type
  byte, then branches on it: types 2 and 0x0E yield 0x4000, types 3 and 0x0F yield 0x28 (40), all other types yield
  0. In every branch the returned constant is gated on the object pointer being non-NULL (tst r4,r4 after r4=r0),
  so a NULL object returns 0 even for matching types. The pairing of 2 with 0x0E and 3 with 0x0F (base value + 0x0C)
  suggests these are base-navi vs. beast-out/cross variant pairs of the same navi family. The two outputs look like
  different kinds of data: 0x4000 is set up as a single flag bit, while 0x28 (40) is a plain small value, so this
  is likely a per-navi-type attribute lookup (element/property flag or amount) consumed by battle damage/behaviour
  code. r4 is pushed/popped, so the caller''s r4 is preserved; flags nzcv are clobbered.

  '
