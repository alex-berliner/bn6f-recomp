name: ai_moveToChosenPanel
address: '0x08114238'
kind: function
status: probable
summary: 'AI attack sub-step: checks object_canMove, invokes PanelChooseCallback to get destination X/Y,
  reserves the panel, sets CANNOT_SLIDE, optionally writes SubStepIndex to CurAnim per difficulty bit
  0, loads StepTimer from ScratchVar, and sets HitElement to 4; on any failure clears HasMoved and calls
  object_exitAttackState.'
interface: (uses battle object r5 and oAIAttackVars frame r7) -> r0 = 1 if the move was queued, 0 if aborted;
  sets oAIAttackVars_HasMoved accordingly
details: First it checks via object_canMove that this object is free to act; if not, it exits the attack
  state. Otherwise it invokes the stored PanelChooseCallback, which returns a target panel id in r0 and
  a chosen animation/sub-step in r1; if the callback reports failure the attack state is exited too. On
  success it writes the target X/Y into oBattleObject_FuturePanelX/Y, claims the panel with object_reservePanel,
  and sets OBJECT_FLAGS_CANNOT_SLIDE so the object can't be pushed while moving. If the AI difficulty
  tier has bit 0 set, the callback's r1 is stored as the object's current animation (different move animation
  per difficulty). Finally it reloads the step timer from ScratchVar, sets HitElement to 4 (the 'moving'
  step id), and leaves HasMoved set; on any failure path HasMoved is cleared and object_exitAttackState
  is called.
evidence:
- method: assembly-reading
  date: '2026-10-18'
