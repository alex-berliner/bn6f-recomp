    callback returns the move destination; bl object_reservePanel then object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE)
    reserves the panel and blocks sliding during the move; ldrb r0,[r7,#oAIAttackVars_AiDifficultyTier];
    tst r0,#1 gates copying SubStepIndex into oBattleObject_CurAnim; strb r0,[r7,#oAIAttackVars_HasMoved]=0
    and bl object_exitAttackState on both failure paths; success leaves HasMoved set
