name: battleMenu_navigate_8047950
address: '0x08047950'
kind: function
status: probable
summary: 'Battle menu per-frame input handler: navigates a 2D cursor (column/page) over battle chips with D-pad/L/R,
  confirms with A, toggles selection with B or R, and marks the menu dirty when the cursor moves.'
interface: 'void sub_8047950(u32 /*r5*/ menu, u32 /*r10*/ toolkit /*r2,r3 also live but unused here*/);

  outputs: nothing returned; r10 preserved (toolkit ptr re-passed by callees)

  clobbers: NZCV (with `tst`) and r0,r1,r2,r3,lr

  preserved: r4,r5,r6,r7,r10

  '
details: "Operates on a \"menu\" object at offsets used as: +0x05 select-state (0xFF=on, 0x00=off),\n+0x0D dirty\
  \ flag (writes 0xFF), +0x12 u16 item count, +0x14 u16 cursor column,\n+0x16 u16 prev column, +0x18 u16 cursor\
  \ page, +0x1A u16 prev page, +0x1C ptr→u32 linked-mode\n(value 2 enables L/R shoulder paging, otherwise R becomes\
  \ a select toggle),\n+0x24 ptr to a TextScriptArchive. r10 is the toolkit; it reads +oToolkit_JoypadPtr\nand then\
  \ +oJoypad_Pressed (offset 2) and +oJoypad_Held (offset 4) from the Joypad.\n\nFrame flow: snapshot (page,column)\
  \ into the prev fields, then branch on Pressed:\n  • B (bit 0x2): if select-state≠0 → toggle_select (XOR +0x05\
  \ with 0xFF, when becoming 0\n    run chatbox_runScript with idx=1 and call sub_80478B8, then set dirty); else\
  \ show an\n    \"unselect\" dialog via menu_showDialogOnUnselect_8047A80.\n  • else, if item count is non-zero\
  \ and (linked==2 OR R not pressed): branch on A\n    (bit 0x1). A on an already-selected row → toggle_select;\
  \ A on an unselected row →\n    confirm via sub_8047A96.\n  • Else (held-only path): UP (0x40) decrements column\
  \ with underflow carrying into page;\n    L (0x200, only when linked==2 and items>5) decrements page by 5, clamped\
  \ to 0;\n    DOWN (0x80) increments column, clamping to min(items,5)−1 and carrying into page;\n    R (0x100,\
  \ only when linked==2 and items>5) jumps page forward by 5, clamped to\n    items−5. Pressed-R in the basic (non-extended)\
  \ layout is handled earlier as a\n    select-toggle. When linked==2 a Standby-style R press (bit 0x100 of Pressed)\
  \ also\n    triggers toggle_select.\n  • When the pressed-R (\"select-toggle\") path is taken while select-state\
  \ was already\n    non-zero, the code EORs again (re-entering toggle_select) — toggle_select plays\n    SOUND_UNK_66\
  \ each call.\n\nAfter input handling, compare current (page,column) to the snapshots; on any change,\nplay SOUND_UNK_66\
  \ and write 0xFF to the dirty flag (+0x0D) so the redraw routine\nrepaints next frame. Equivalence to the verified\
  \ C is exact, including the bit fields\n(BTN_A=1, BTN_B=2, BTN_UP=0x40, BTN_DOWN=0x80, BTN_L=0x200, BTN_R=0x100).\n\
  \nQuirks: PLAY_SOUND_UNK_66 fires both inside toggle_select and again on the dirty-move\npath, so a single A/B/R\
  \ action can produce two cue sounds. Clamping in the navigate\npath uses post-decrement bounds checks against\
  \ (s32) so items ≤ PAGE_SIZE keep the\npage field locked.\n\nRegister form kept (C call semantics could not work):\
  \ sub_8047950(u32 r5 /*menu*/, u32 r10 /*toolkit*/)"
