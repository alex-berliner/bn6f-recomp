name: oBattleObject_DirectionAngle
address: '0xc'
kind: struct-field
status: hypothesis
summary: Direction angle (0..255, calcAngle result) used to orient movement or sprite flips relative to
  a target; also reused as a phase/shader index in some t1 handlers.
details: ''
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: Initialised to 0x1F and then decremented by 2 each frame until <=0, behaving like a color-shader/fade
    countdown.
