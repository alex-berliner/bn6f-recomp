  - bn6f/asm/asm31.s
  reproduce: grep -n 'oBattleObject_Unk_0c' bn6f/asm/asm31.s | head
  result: 'mov r0, #0x1f ; strb r0, [r5,#oBattleObject_Unk_0c]'
- method: assembly-reading
  date: '2026-10-15'
  detail: Treated as a small index (0/1) selecting a panel-direction case in a step-movement state machine.
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: grep -n 'oBattleObject_Unk_0c' bn6f/asm/asm00_2.s | head
  result: 'strb r3, [r5,#oBattleObject_Unk_0c]  ; ... ldrb r2, [r5,#oBattleObject_Unk_0c] ; cmp r2, #1'
- method: assembly-reading
  date: '2026-10-15'
  detail: Used as an index into an 8-byte stride table (likely the alliance/team table or a related lookup),
    consistent with a sub-state value rather than a flag.
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: grep -n 'oBattleObject_Unk_0c' bn6f/asm/asm00_2.s | head
  result: 'ldrb r0, [r5,#oBattleObject_Unk_0c] ; sub r0, #1 ; lsl r0, r0, #3'
- method: assembly-reading
  date: '2026-10-15'
  detail: Set to 1 as a boolean "active/initialised" flag on the counter-ring child object right after
    spawning.
  refs:
  - bn6f/asm/asm31.s
  reproduce: grep -n 'oBattleObject_Unk_0c' bn6f/asm/asm31.s | head
  result: 'mov r1, #1 ; strb r1, [r0,#oBattleObject_Unk_0c]'
- method: assembly-reading
  date: '2026-10-15'
  detail: Initialised to 0xFF as an "uninitialised/awaiting-target" sentinel that is later overwritten
