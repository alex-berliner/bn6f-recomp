name: object_freeCollisionData
address: '0x080198CE'
kind: function
status: confirmed
summary: Disables a collision data slot and clears its index bit in the engine-wide active-collision bitfield (NULL-safe).
interface: void object_freeCollisionData(struct CollisionData *r0); // r0 = collision data slot (NULL allowed);
  clobbers r1, r2, r3 and N/Z flags
details: "Guards against a NULL r0 and returns immediately. Otherwise:\n  - Writes 0 to r0->oCollisionData_Enabled\
  \ (byte), marking the slot inactive.\n  - Reads a per-slot mask bit from r0->oCollisionData_CollisionIndexBit\
  \ (word).\n  - ANDs the global eActiveCollisionDataBitfield with the bitwise-NOT of that mask\n    and stores\
  \ the result back, releasing the slot's occupancy bit.\nTrailing the function are large static data tables (PanelOffsetListsPointerTable\
  \ and\nadjacency/mask tables like byte_8019C7C) used elsewhere for collision panel setup;\nobject_freeCollisionData\
  \ itself only touches the two fields above and the single\nglobal at off_80198E4.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
