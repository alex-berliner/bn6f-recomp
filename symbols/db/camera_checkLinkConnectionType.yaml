    r0,#1 means mode==4 falls into the final branch via beq to loc_812BC06 (not ''tail-call'' — it falls
    through to sub_812C24C), and only r0==1 returns immediately. The proposal''s ''bit 8'' framing is
    also inverted in presentation, though the control flow is correct. A clearer name reflecting the connection-type
