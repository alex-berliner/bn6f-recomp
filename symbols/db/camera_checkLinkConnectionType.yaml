name: camera_checkLinkConnectionType
address: '0x0812BB08'
kind: function
status: probable
summary: Camera/link helper that, after dispatching on eStruct200BC30 mode, validates the current eLinkState
  against a two-entry table and then enforces a two-sided connection-type match (0x10/0x10-or-0x08 mirrored,
  or both 0x20), writing 0x10/0/0 into camera state bytes on success or 2 on a single mismatch.
interface: (no register inputs; r5 must already point at the camera/link struct set up by the caller)
  -> r0/r1 clobbered; writes [r5+0x02]=0x10, [r5+0x0C]=0, [r5+0x03]=0 on success, or [r5+0x10]=2 on partial
  match, or copies [r5+0x26] into the camera end struct
details: 'It first dispatches via sub_803EAE4 over eStruct200BC30''s mode byte: result 4 tail-calls sub_812C24C,
  result 1 returns immediately. If bit 0x10 of the result is clear, it calls camera_copyLinkStateToEnd
  and stores [r5+0x26] at end+8, extending the link-state snapshot saved at camera end. If bit 8 is set
  it stops; otherwise it fetches eLinkState (sub_803E8F8) and a two-entry, 0x10-byte-stride table from
  sub_81323B0 (-1 means bail), checking each entry''s word at +4 against eLinkState+0x1C (mismatch aborts)
  and halfword at +2 against +0xA; a r3 bitmask counts how many of the four comparisons matched. Full
  match (r3==0) leads to a two-sided connection-type check: sub_803DD60 picks which side is ''local'',
  and sub_81325C0''s returned pair must be (0x10, 0x10-or-8) in the mirrored order, or both 0x20, depending
  on [r5+0x26]; only then are the camera state bytes [r5+0x02], [r5+0x0C], [r5+0x03] set/cleared. A partial
  match (r3==1, exactly one of four comparisons failed) instead stores 2 at [r5+0x10].'
