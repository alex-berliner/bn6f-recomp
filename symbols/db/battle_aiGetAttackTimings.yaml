name: battle_aiGetAttackTimings
address: '0x08105714'
kind: function
status: probable
summary: Looks up three timing values (duration, boost, cycles) for the currently loaded AI attack from
  a per-attack table.
interface: () -> r0 = duration, r1 = boost, r2 = cycles; no flags set
details: Calls sub_800FE28 three times to fetch 4-byte fields at offsets 0, 4, 8 of byte_8105740, returning
  them in r0/r1/r2. The 12-byte table appears to hold 3 entries per attack slot. The caller (sub_8105828,
  an AI attack init) stores these as AttackDuration, AttackBoost2, and TimerOrCycles of oAIAttackVars,
  suggesting the table index is set elsewhere (likely by battle_aiLoadAttackParams just called).
