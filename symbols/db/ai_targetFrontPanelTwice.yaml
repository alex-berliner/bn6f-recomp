name: ai_targetFrontPanelTwice
address: '0x081066C0'
kind: function
status: probable
summary: AI helper that, twice, calls sub_80DCEC6 with the panel column directly in front of the object
  (panelX + facing), while locally packing AttackBoost2*TimerOrCycles|0xC00 into r4 but not passing it.
interface: (r0/r5 = battle object, r7 = AI attack vars) -> r0 = result of sub_80DCEC6 on last iteration;
  no meaningful flags
details: Loops r6 = 1..2; each pass calls object_getFrontDirection to get +1/-1 facing, computes panelX
  + facing*1 in r0, and calls sub_80DCEC6(r0 = target column, r1 = loop index, r3 = 0xC00). It also computes
  r4 = (oAIAttackVars_AttackBoost2 * oAIAttackVars_TimerOrCycles) | 0xC00 from the AI attack-vars struct,
  a tagged word that is built but not passed in r0-r3, suggesting sub_80DCEC6 consumes r4 or the packing
  is meant for a different register. Both panel coordinate and the packed value are recomputed each iteration.
  The 0xC00 tag (bits 10-11 set) looks like a command/type field packed with a small numeric value.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_81066C4: bl object_getFrontDirection then add r0, panelX — target is the panel in front
    of the object; cmp r6, #3 / ble loc_81066C4 with add r6, #1 — exactly two iterations, loop index passed
    as r1 to the callee; ldrb r4/r3 from [r7, oAIAttackVars_*] and mul/orr 0xC00 — value derived from
    AI attack-var struct fields; sole caller sub_8105F66 and callee sub_80DCEC6 are both undocumented,
    so the effect of the call is unverified'
  refs:
  - bn6f/asm/asm31.s:169414
  - 0x08105F66 sub_8105F66
  - 0x0800E2CA object_getFrontDirection
  - 0x080DCEC6 sub_80DCEC6
  reproduce: python3 tools/asmcat.py 0x081066C0
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The loop runs r6 = 1..2 (cmp r6, #3; ble), targeting the panel in front twice. r0 passed to sub_80DCEC6
    is panelX + facing*1 (computed via mul r0,r1 where r1=1 — redundant but matches). r4 is built as (AttackBoost2
    * TimerOrCycles) | 0xC00 but never actually passed to sub_80DCEC6 in r0-r3 (r3 is hardcoded #0xc<<8),
    so the packing is local state the proposal wrongly attributes to the callee. Name is reasonable but
    ''attackStrike'' is speculative; a tighter name reflects the front-panel double-target pattern.; run
    wf investigate investigate-20261019-022109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
