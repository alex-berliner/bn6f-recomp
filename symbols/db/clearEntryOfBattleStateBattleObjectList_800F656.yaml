name: clearEntryOfBattleStateBattleObjectList_800F656
address: '0x0800F656'
kind: function
status: confirmed
summary: Scans the current battle state's six-slot BattleObjectList and nulls every slot still pointing at the given
  battle object.
interface: void battle_clearObjectFromObjectList_800F656(u32 object /*r5*/, Toolkit *toolkit /*r10*/); // returns
  r1=6 (loop count), r2=last slot value read, C/V set by cmp 6
details: 'Loads the current BattleState pointer from toolkit+oToolkit_BattleStatePtr, then walks the

  six words at BattleState+oBattleState_BattleObjectList. Any slot whose value equals the r5

  object pointer is written back as 0 (removed from the list). Slots holding other values are

  left untouched. r0 is scratch; r1 counts iterations 0..5 and ends at 6; r2 ends holding the

  last-compared slot''s value (or 0 if the last slot matched); flags C and V are the residue of

  the final cmp r1, #6. Callers ignore these side outputs per the contract. The list has fixed

  capacity 6 — an object referenced more than once is cleared from every slot it occupies.

  '
