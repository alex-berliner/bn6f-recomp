open_questions:
- The semantic role of GameState+0x68 (it doubles as a u32 here but is unnamed in GameState.inc);
- it could be a generic scratch timer reused for the post-enter-map countdown rather than a
- dedicated "wait before warp" field.
- Whether the call site is purely per-frame vs. only called while SubsystemIndex selects the
- overworld handler (callee summaries imply the latter, but no caller dump was provided).
- The exact meaning of the 0xE7/0xEC SSE ids (could be area-2/area-3 jingles rather than area
- '0/1). The fact that GameState[5]=MapNumber (1..) is compared with #1 only is unusual.'
