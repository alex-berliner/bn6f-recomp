name: overworld_owMap_renderAndTickSubsystems_800536E
address: '0x0800536E'
kind: function
previous_names:
- sub_800536E
status: probable
summary: 'Overworld per-frame tick: drives the PET-menu dispatcher, scenario/sprite/owMapObject/battle
  pipelines, runs the armed callback, and counts down a per-map post-enter-map jingle delay (plays 0x9E
  or 0x71 SSEs) before triggering a map warp.'
interface: (r5 = * GameState, r10 = * Toolkit) -> void (caller-saved r4-r7, r10; only branch flags and
  the screen-fade wait are observable side-effects on r5->Unk_68)
details: "Called once per overworld frame from cbGameState. Unconditional prologue runs the full subsystem\n\
  \  pipeline (PET menu dispatcher 80339CC, scenario/jump-table 80039AA, overworld object dispatcher\n\
  \  8003AFA, sprite flush 80027B4, palette count reset 800286C, sprite-render 8003BF4, battle object\n\
  \  teardown 8003E98, NPC sprites 800467C, queued sprite/group finalizers 8004298/8004590, sprite\n \
  \ enqueue 8004934) and the armed callback at 80024AE. Only then does it consult\n  IsScreenFadeActive;\
  \ the screen-fade branch is the post-enter-map countdown:\n    ldr r0,[r5,#oGameState_Unk_68] (offset\
  \ 0x68); sub r0,#1; blt -> finished (warp to map_80053D2)\n    str r0,[r5,#0x68]; cmp #0x29 -> PlaySoundEffect(0x71=0x72+0xff);\
  \ cmp #0x9E -> if MapGroup <=1:\n      PlaySoundEffect(hword_80053E0[MapGroup]) where the table holds\
  \ {0xE7,0xEC}. So while a screen\n      fade is in progress, decrement Unk_68 (acts as a \"busy-enter\"\
  \ tick counter); at 0x29 play\n      SSE 0x71; at 0x9E play the per-map-group jingle (Offensive/Neutral\
  \ routes in MMBN6). When\n      the counter underflows, call chatbox_8040818 then map_triggerEnterMapOnWarp_8005C04,\
  \ which\n      finalises the warp (per its callee docstring) and clears the warp animation event. Sub_68\
  \ is\n  the GameState field added beyond the SavedCoords block (Size 0x80); it is reused here as the\n\
  \  in-fade tick value. exit pops {pc}, no explicit return value.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- push {lr} / pop {pc}: leaf-like tick routine returning to caller via stored lr. - `bl IsScreenFadeActive
    ... beq locret_80053DA`: frames where fade is active skip the countdown block entirely, so the routine
    also runs on every non-fade frame without effect. - `ldr r0,[r5,#oGameState_Unk_68]` followed by `sub
    r0,#1; str r0,[r5,#0x68]`: GameState+0x68 is used as a down-counter that persists across frames. -
    `cmp r0,#0x29 ... mov r0,#0x72 add r0,#0xff ... bl PlaySoundEffect`: at tick 0x29, request SSE id
    0x71 (0x72+0xFF), the "door closing" jingle that conventionally plays when entering a map. - `cmp
    r0,#0x9E ... ldrb r0,[r5,#5] cmp r0,#1 ... ldrh r0,[r1,r0]` + table `hword_80053E0: 0xE7, 0xEC`: at
    tick 0x9E (mid-counter) play SSE 0xE7 or 0xEC depending on GameState.MapGroup at offset 0x5, matching
    the two-map-group per-area jingle pattern. - Underflow branch (`blt loc_80053D2`) calls `chatbox_8040818`
    then `map_triggerEnterMapOnWarp_8005C04`, which by callee docstring clears the warp animation and'
