details: 'Trivial two-instruction test: r3 is loaded with the address of eStruct2000aa0, then the byte at +0x8 (byte_2000AA8)
  is loaded into r0 and the NZ flags are set from it via tst r0, r0 before returning. It performs no writes and
  no branching itself; it exists purely to expose a "flag clear/set?" condition to a caller (likely a script interpreter
  or event handler that follows with a conditional branch). Touches only eStruct2000aa0 field +0x8. Note the odd
  contract: the struct base is left in r3 as a side output, and the result is conveyed through flags rather than
  a register value.'
