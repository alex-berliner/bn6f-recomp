name: sprite_CopyObjTilesToVramSlot_80281D4
address: '0x080281D4'
kind: function
status: confirmed
summary: Thin wrapper that targets one 0x80-byte OBJ tile slot in VRAM (0x0600A4A0 + 0x80*slot) and calls the tile-loading
  helper sub_80281C4 on it.
interface: void sprite_CopyObjTilesToVramSlot(u32 slot /* r1 */, ... /* r0 and r2..r7 pass through to sub_80281C4
  */)
details: 'Computes a destination address in OBJ VRAM as 0x0600A4A0 + 0x80 * r1, where r1 is a slot/tileset index,
  then calls sub_80281C4 with r0 unchanged (passthrough, likely a source pointer/handle), r1 set to the VRAM destination,
  and r2 set to the byte offset (0x80 * slot). r1 and r2 are pushed and popped so both the slot index and whatever
  the caller had in r2 survive the call unchanged for the caller. Each slot is 0x80 bytes, i.e. 64 halfword tiles''
  worth of OBJ tile memory. All the actual copy/(de)compression work lives in sub_80281C4; this function only does
  the address arithmetic and register save/restore. Flags and r0/lr are clobbered by the callee path.

  '
