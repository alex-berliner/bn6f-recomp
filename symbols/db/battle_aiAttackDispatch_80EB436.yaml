name: battle_aiAttackDispatch_80EB436
address: '0x080EB436'
kind: function
status: confirmed
summary: AI attack dispatcher that tail-calls one of two attack routines selected by the first byte of the AI attack-vars
  block.
interface: void battle_aiAttackDispatch(void /* r7 = &AIAttackVars */); tail-calls sub_80EB450/sub_80EB502, which
  return directly to this function's caller
details: 'Reads the selector byte at offset 0 of the AI attack-vars block pointed to by r7 (AIAttackVars_Unk_00)
  and indexes the jump table jt_80EB448 with it. Only two handlers exist: slot 0 -> sub_80EB450, slot 1 -> sub_80EB502
  (any value >1 reads past the table, though the C model treats all nonzero slots as slot 1). The function uses
  the classic mov lr, pc / bx r1 trick so LR points at the following pop {pc}: the chosen handler returns straight
  to this function''s caller, i.e. it is a tail call. Registers and condition flags therefore pass through to the
  caller untouched. On entry to the handler, r0 = selector byte and r1 = raw table entry (handler address | Thumb
  bit).

  '
