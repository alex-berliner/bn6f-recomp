name: ai_attackCommitMoveStep
address: '0x080F8890'
kind: function
status: probable
summary: 'Per-frame tick of an AI attack: when the step timer expires, commits the object''s move to its
  future panel, plays the move animation, and rearms timer and hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> void; no return value
details: Called each frame as part of an AI attack sequence. It decrements oAIAttackVars_StepTimer at
  [r7]; while it's still positive it returns immediately. On reaching zero it sets CurAnim = 3 (move/step
  animation), copies FuturePanelX/Y into PanelX/Y on the battle object, releases the previous panel reservation
  (object_removePanelReserve), recomputes pixel coordinates from the new panel (object_setCoordinatesFromPanels),
  and updates the collision record and facing direction (object_updateCollisionPanels). It then rearms
  StepTimer to 3 and sets oAIAttackVars_HitElement to 8, presumably the element applied on the attack's
  hit after this move step. No caller is known, so the owning attack state machine is unidentified.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r7,#oAIAttackVars_StepTimer]; sub #1; bgt locret: early-out until timer expires; strb
    #3,[r5,#oBattleObject_CurAnim] and FuturePanelX/Y -> PanelX/Y copy: commits planned move; bl object_removePanelReserve
    / object_setCoordinatesFromPanels / object_updateCollisionPanels: panel bookkeeping for the move;
    strh #3 into StepTimer and #8 into HitElement at the end: rearms the step and sets hit element'
  refs:
