name: e_requestPaletteLoad
address: '0x0801EC90'
kind: function
status: probable
summary: Queues a 32-byte palette for copy into an IWRAM buffer and sets a flag word bit to trigger the
  actual upload.
interface: () -> void; sets bit 0x400000 in the flag word at eStruct2035280+0x44
details: The function stages a transfer of 0x20 bytes (one 16-color palette) from the ROM asset dword_86E9A0C
  into byte_30016D0 in IWRAM via QueueEightWordAlignedGFXTransfer, then ORs 1<<22 into the flag word at
  eStruct2035280+0x44 via flagSetBits_eStruct2035280_801BEB8. The flag most plausibly tells a later (vblank
  or main-loop) handler that the palette staged in the buffer must be copied to hardware palette RAM.
  No arguments are taken and none of r4/r5 are actually used, despite being saved. Without the flag-word
  consumer or callers it is not certain what effect (flash, fade, chip palette swap) this palette is for.
