name: bg_copyTilePatchBlock2_81264E4
address: '0x081264E4'
kind: function
status: confirmed
summary: Thin wrapper that copies a fixed 3x14 patch of background tiles into 32x32 tile block
interface: void bg_copyTilePatchBlock2(u32 j, u32 i, const u16 *tile_ids); // returns CopyBackgroundTiles' leftover
  r3 value in r3
details: 'Sets up a fixed call to CopyBackgroundTiles with hardcoded constants:

  which_tile_block_32x32 = 2, j_size = 3, i_size = 0xE (14). The caller supplies the

  destination top-left coordinates (r0 = j, r1 = i) and a pointer to the source tile id

  array (r2, u16 per tile). So this always writes a 3-tile-tall, 14-tile-wide rectangle

  of tile ids into the 32x32 tile block #2 of the background — a size consistent with a

  fixed decorative frame/band (e.g. a header strip, message border or similar UI patch)

  rather than a full screen load. r4-r7 are pushed/popped only to satisfy the wrapper''s

  own preserved-register duty around the constants it loads (the callee-side r4-r7 use

  inside CopyBackgroundTiles is its own business); r0 is preserved through the call per

  the observed contract. r3 on return is just whatever CopyBackgroundTiles last left in

  r3 (here the tile_ids pointer before its internal use), not a meaningful result.

  '
