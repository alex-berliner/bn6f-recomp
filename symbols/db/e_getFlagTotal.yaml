  date: '2026-10-19'
  detail: 'body: ldr r5,=eStruct2001010; ldrb r0,[r5,#0x8]; returns that byte; caller 0x0814319A: mov
    r6,r0 uses the return as the loop bound for TestEventFlag iterations; caller 0x081431BA: second call''s
    result goes to r1, returned beside r4 = number of set flags (cmp r0,r1 left to the caller); loop base
    r7 comes from sub_81430B6, so the range is [base, base+count)'
