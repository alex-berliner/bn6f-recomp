name: e_getFlagTotal
address: '0x081433CA'
kind: function
status: probable
summary: returns the stored total flag count (byte at +8 of eStruct2001010) that callers compare against
  a counted number of set flags
interface: () -> r0 = u8 total count stored at eStruct2001010+8; preserves r4-r7
details: 'A trivial getter: loads the pointer to eStruct2001010 from a literal pool and returns the byte
  at offset 0x8. Its only caller, sub_8143198, calls it twice — first to get a loop count, then to return
  it in r1 alongside r4, the number of flags found set. The caller obtains a base flag index from sub_81430B6,
  then loops TestEventFlag over that many consecutive flags, counting set ones. So the byte at eStruct2001010+8
  is the length of a flag range, and the caller reports how many of them are set versus the total.'
