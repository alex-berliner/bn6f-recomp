open_questions:
- What game object owns the r5 overlay block (element icon strip, battle chip select cursor, status effect strip,
  or something else)? Without a caller listing the exact subsystem, the proposed name keeps a generic overlay prefix.
- The meaning of the r0 style flag (which variant chooses the +5 frame offset when frame >= 0x3C) is not visible
  from this function alone.
- sub_802FE28's typed interface is not yet known; it's only known to take (u32 tileAttr, u16 colOrDest, u32 zero,
  u32 zero).
- byte_803BD18's last 10 entries (0xB7,0x38 / 0x48 / 0x58 / 0x68 row group) appear to be a second descriptor pattern;
  whether they represent a different style/phase versus the leading 0x05/0x15/0x25/0x35/0x45 row group is unclear
  from this function alone.
