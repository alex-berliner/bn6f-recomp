name: sub_803BC7C
address: '0x0803BC7C'
kind: function
status: confirmed
summary: Draws the left/right half-tiles of a per-element overlay frame and advances the column counter (wraps at
  0x18).
interface: 'void sub_803BC7C(u32 style, void *overlayState);  // r0=style flag, r5->overlay block; out: r0=new column
  index, NZCV from final CMP'
details: 'r5 points to a per-element overlay state block: offset 0x08 holds the current base

  frame index (u8), offset 0x0A holds a column/row index (u8) used both as the lookup

  into the per-row table at byte_803BCE4 and as the in-block counter advanced each call.

  The function reads byte_803BD18[frame*4..frame*4+3] as a 4-byte tile descriptor

  (palette0, tileId_lo, tileId_hi, terminator) and ORs 0x9000 (VRAM BG tile-data

  attribute base) with the descriptor''s first two bytes to form the left-half tile

  attribute. The third byte (bits 16-23) is added to that attribute to form the

  right-half tile attribute. Both tiles are submitted through sub_802FE28, a tile

  blit routine, with the column offset from byte_803BCE4[row*2] (+0 for the left

  tile, +2 for the right). When r0 (style) is non-zero AND frame >= 0x3C, the

  frame is offset by +5 (an "extended" variant of the animation, gated by a

  style/phase flag). After blitting, the column index is incremented and wrapped

  to 0 when it reaches 0x18, so the index is modulo 24.

  '
