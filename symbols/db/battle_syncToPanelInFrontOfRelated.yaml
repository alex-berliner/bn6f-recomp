name: battle_syncToPanelInFrontOfRelated
address: '0x080D2BC0'
kind: function
status: confirmed
summary: Moves a battle object onto the panel directly in front of its related object (the tile that object is facing)
  and refreshes its derived position/collision data.
interface: void battle_syncToPanelInFrontOfRelated(void); // object in r5; returns r1/r4 passthrough from object_updateCollisionPanels,
  clobbers r0-r3, flags NZCV, lr
details: 'Takes the battle object in r5, calls object_getFrontDirection on it to get the horizontal direction its
  related object is facing (0 or +/-1), then reads RelatedObject1Ptr from the object. Copies the related object''s
  PanelY into the object''s PanelY, and sets the object''s PanelX to the related object''s PanelX plus the front
  direction — i.e. the tile the related object is facing. Finally calls object_setCoordinatesFromPanels to recompute
  pixel coordinates from the panel position, and object_updateCollisionPanels to rebuild the collision footprint.
  r1/r4 (and N/Z/C/V) are left exactly as object_updateCollisionPanels left them, since callers only want that callee''s
  results. r4-r6 are preserved. The "related object" is the oBattleObject_RelatedObject1Ptr link, so this is presumably
  used for things that shadow/track another entity (e.g. following tiles, cursor-like helpers, or attached effects).

  '
