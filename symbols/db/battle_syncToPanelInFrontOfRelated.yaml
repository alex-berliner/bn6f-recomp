name: battle_syncToPanelInFrontOfRelated
address: '0x080D2BC0'
kind: function
status: probable
summary: Repositions this battle object onto the panel directly in front of its related object (owner),
  then refreshes its pixel position and collision panels.
interface: (r0 unused? r5 = battle object ptr) -> void; no meaningful flags
details: 'Reads the object''s RelatedObject1Ptr (r5 is the object, so the caller sets it up before calling),
  takes that related object''s PanelX and PanelY, adds the +1/-1 facing multiplier from object_getFrontDirection
  to X, and stores both into this object''s own PanelX/PanelY. It then calls object_setCoordinatesFromPanels
  to convert the new panel coordinates into pixel X/Y, and object_updateCollisionPanels to sync the collision
  record/facing. Net effect: the object jumps to the single panel immediately ahead of its related object
  each time it runs, keeping PanelY identical to the related object''s. With the pulsing-attacker caller
  this makes the attack re-anchor itself one panel in front of its owner on every pulse.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r2,#oBattleObject_PanelX]; add r1,r1,r0 (front-direction); strb into [r5,#oBattleObject_PanelX]
    — moves object to related object's X + 1 facing step; ldrb/strb PanelY from r2 to r5 copies the related
    object's row; callees object_setCoordinatesFromPanels and object_updateCollisionPanels per their summaries
    recompute pixel pos and collision from the new panel coords; caller battle_objectUpdatePulsingAttacker
    (12-frame pulse, camera shake on collision) invokes this so the attack tracks a panel in front of
    its owner
