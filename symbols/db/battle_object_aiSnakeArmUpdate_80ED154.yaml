open_questions:
- What `Unk_03` values 0..2 vs 3 vs 4 mean for an actual chip/attack (scripted behaviour); the assembly
  only distinguishes <=2 (regular chip projectile), 3 (sub_802E032 wide effect), 4 (battle_SpawnAndInitObjectType3
  type-3 spawn).
- Whether the "Unk_30 == 0" guard is really a "did we fire this time" flag or a per-tick counter; callers
  show r0 values 0,1,10,11,12,13 across captured snaps, all with N set, hinting it's an attacker ID being
  computed each tick (probably not just Unk_30).
- Exact role of sub_80101D4 and the meaning of owner+0x4C as the slot for the spawned arm (probably RelatedObject1Ptr
  at oBattleObject_RelatedObject1Ptr, confirmed by teardown writing 0 to it).
