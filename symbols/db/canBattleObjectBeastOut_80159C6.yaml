open_questions:
- Exact meaning of oAIData_Unk_0f value 2 — likely a "transformation requested/locked" flag set on the
  AI helper; needs cross-references to callers/writers.
- Why the BeastOutCounter check is repeated after the transformation range check only in non-crossover
  mode; possibly guarding against a re-entrant beast-out request.
- Exact transformation mapping for IDs 0xB..0x18 (which forms these correspond to in Falzar version ordering).
- What sub_801443C initialises exactly — looks like it pre-loads cross-over / cross mega state but its
  body isn't part of this function.
