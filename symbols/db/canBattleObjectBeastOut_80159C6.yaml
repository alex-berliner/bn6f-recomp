name: canBattleObjectBeastOut_80159C6
address: '0x080159C6'
kind: function
status: probable
summary: Tests whether a battle object may currently beast-out / cross over (sets an AI state flag and
  validates the Navi's transformation state).
interface: u32 canBattleObjectBeastOut_80159C6(u32 battle_obj /* r0 */); /* returns 0/1 (flags NZ) */
details: 'Resolves whether the supplied battle object is currently eligible to start a Beast-Out

  / cross-over transformation. The function takes the alliance battle object in r0, returns 0

  when not allowed and 1 when all checks pass.


  For non-crossover battles (GetBattleMode() != 1) it first marks the AI side as

  transitioning: the AI data block is fetched via oBattleObject_AIDataPtr (likely the

  NAVI-side AI descriptor), and oAIData_Unk_0f is required to be 0 and is then written

  to 2 — i.e. this likely sets a "transformation in progress / requested" state on the AI

  helper so other logic doesn''t re-trigger. It also requires oNaviStats_BeastOutCounter

  to be 0 (the Navi isn''t already beast-out) and calls sub_801443C, which presumably

  pulls in cross-over battle setup data.


  For all modes it then reads oNaviStats_Transformation and requires the value to lie in

  the inclusive range 0xB..0x18 (the mid/late-game transformations — this is the loose

  numeric "form" ID, not a character index). In non-crossover mode it re-checks that

  oNaviStats_BeastOutCounter is still 0 before granting success.


  All queries go through GetBattleNaviStatsByte_AllianceFromBattleObject (battle obj + a

  stats byte offset) and GetBattleMode, the standard front-ends used by the alliance/

  battle mode plumbing. The function preserves r5/r6, clobbers r0/r1/lr, and sets the

  N/Z flags from the returned success value.

  '
