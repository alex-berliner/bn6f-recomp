name: battle_deactivateObject
address: '0x080F7140'
kind: function
status: probable
summary: 'Hides a battle object: drops it to Z=0xFF, removes its shadow and collision, and unregisters
  it from the active-record table.'
interface: (r5 = battle object, with its id/uid in the field read by sub_801DD34) -> r0 = 0 (success from
  sub_801DD34); no flags meaningful
details: Stores 0xFF into the object's Z coordinate (oBattleObject_Z16), effectively moving it out of
  view, then calls sprite_noShadow to strip the shadow sprite flag and object_clearCollisionRegion to
  detach it from its collision region. Finally sub_801DD34 scans the four-slot table at byte_203EB50 for
  the record whose id equals r5's value, clears its flag byte, and reports success. Together these fully
  deactivate the object on the battle field. The many callers at 0x080F6xxx all invoke it as the final
  teardown step for their objects.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_80F7140: mov r0,#0xff; strh r0,[r5,#oBattleObject_Z16] hides the object by Z position;
    bl sprite_noShadow then bl object_clearCollisionRegion disable rendering shadow and collision per
    known summaries; bl sub_801DD34 with r5 = object id clears the matching byte_203EB50 record flag (unregistration);
    six callers at 0x080F67B6-0x080F6DA0 call it last, consistent with teardown of spawned battle objects'
