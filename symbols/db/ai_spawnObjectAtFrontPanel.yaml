    run wf investigate investigate-20261019-010606'
open_questions:
- What object type/attack the spawned object is (depends on r2 set by caller sub_8107644)
- Meaning of the r3=0x100000 and r4=0x1C parameters in battle_SpawnAndInitObjectType3_80C4FFE
- Whether the scratch var passed in r6 is an object ID, timer, or data pointer
