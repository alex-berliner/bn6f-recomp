name: ai_spawnObjectAtFrontPanel
address: '0x08107B06'
kind: function
status: probable
summary: AI attack step that spawns a type-3 battle object on the panel directly in front of the acting
  object.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = spawned object or 0; r0-r3, r4, r6 set up
  for spawn call
details: Computes the spawn panel as oBattleObject_PanelX plus the object's facing multiplier from object_getFrontDirection,
  with oBattleObject_PanelY as the row, so the object appears on the adjacent panel in the direction the
  user faces. It then calls battle_SpawnAndInitObjectType3_80C4FFE with r3 = 0x100000 and r4 = 0x1C as
  spawn/configuration parameters, passing a value from the AI attack scratch variable (r6) along. The
  0xFF-filled byte_8107B50 and the phase-handler table off_8107C10 (flinch, paralyze, jump-land, etc.)
  are pool data for the surrounding attack/object code, not consumed by this function. The exact object
  kind depends on r2, which is set up by the caller before this routine runs.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection then add r0, r0, PanelX / ldrb r1 PanelY: spawn coordinates are
    the facing panel; ldr r6, [r7, oAIAttackVars_ScratchVar] before spawn: value comes from the AI attack
    scratch slot; bl battle_SpawnAndInitObjectType3_80C4FFE with r3=0x100000, r4=0x1C: creates and initializes
    a type-3 battle object; Caller sub_8107644 invokes this from an AI attack context sharing the oAIAttackVars
    layout'
  refs:
  - bn6f/asm/asm31.s:171490
  - 0x08107644 sub_8107644
  - 0x080C4FFE battle_SpawnAndInitObjectType3_80C4FFE
