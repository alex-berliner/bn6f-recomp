name: battle_spawnArmHitEffect_801A4A6
address: '0x0801A4A6'
kind: function
status: confirmed
summary: If a battle object was just hit by an arm-style attack (hit type 0xF4 or 0xF7), computes where the attacker's
  arm connects and spawns the corresponding battle effect there.
interface: void battle_spawnArmHitEffect_801A4A6(battleObject* obj /* r5 */); also reads r4/r6/r7 per the caller
  contract but does not use them; preserves r4-r7, returns r3 and the c/v flags as left by sub_80E8124
details: 'r5 points to a battle object. It loads the object''s collision data pointer (oBattleObject_CollisionDataPtr)
  and tests byte offset 0xA4 of that structure, the hit/contact type. Only values 0xF4 and 0xF7 proceed; any other
  type leaves immediately (with the flags still reflecting the CMP against 0xF7). For an arm contact it reads the
  object''s oBattleObject_NameID (halfword), sets r1 = 5, and loads oBattleObject_Alliance and oBattleObject_DirectionFlip
  (bytes) to call getBattleArmPositionMaybe_8018810, which returns an arm-attack contact position in r0 and a second
  value in r1. Those are shifted left by 16 (halfword-to-word lanes: r0 -> r1<<16, r1 -> r3<<16), r2 is set to 0
  and r4 to 3, and sub_80E8124 is called to spawn/apply the battle effect at that position. The hit types 0xF4/0xF7
  presumably identify MegaMan''s arm/glove melee contact (e.g. punch or charge-shot arm sweep); the effect drawn
  depends on the attacker''s name ID, alliance and facing. r4 is pushed/popped purely to satisfy the ABI; the function
  itself does not touch it.'
