  detail: 'AttackElement==0 branch: setFlag1 bit22, object_setAnimation(0xA), PlaySoundEffect(0xF8), spawn_t1_0x5_tempAttackObject(7+tier),
    sets StepTimer=6/AttackElement=4; Second branch decrements oAIAttackVars_StepTimer and reloads it
    from byte table dword_80EDBC8 indexed by AiDifficultyTier (0x3C,0x5A,0x78,0x78); ChargeCycles = StepTimer
    - 0x14 and TempAttackObjectPtr[0x10]++ show a charge-counter mechanic tied to the spawned attack object;
    byte_80EDBB8 halfword table indexed by tier*2 + (8 if NaviStats byte 0x22 nonzero) supplies the object
    parameter passed to sub_80E5D12; object_getFrontDirection()*0x50 and r7 offset 0x4C passed to sub_80E5D12,
    result stored to oBattleObject_RelatedObject1Ptr'
