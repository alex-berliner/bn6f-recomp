  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and interface are accurate, but the name ''ai_attackSpawnObject'' understates the per-call
    flow: it actually drives a multi-phase charged attack by setting flag bit 22, anim 0xA, sound 0xF8,
    spawning a temp attack object (ID 7+tier) via spawn_t1_0x5_tempAttackObject_80B8E30, ticking a StepTimer
    with per-difficulty reload, then spawning a child battle object. Also ''SpawnObject'' is misleading
    since the actual spawn is the temp attack object on the first call; the later spawn goes through sub_80E5D12
    into RelatedObject1Ptr.; run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
