name: ai_chargedAttackSpawnFollowup
address: '0x080EDB14'
kind: function
status: probable
summary: 'AI charged-attack driver: on first call sets ObjectFlags1 bit 22, plays anim 0xA and SFX 0xF8,
  spawns a temp attack object (ID 7+AiDifficultyTier), arms StepTimer=6 and marks AttackElement=4; on
  later calls counts down StepTimer, reloads it from a per-difficulty table (0x3C/0x5A/0x78/0x78), advances
  the temp object''s charge counter, then spawns a follow-up battle object via sub_80E5D12 (param from
  byte_80EDBB8[tier*2+alliance*8], facing*0x50, object+0x4C) into oBattleObject_RelatedObject1Ptr and
  sets HitElement=4.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = spawned/related object ptr stored to oBattleObject_RelatedObject1Ptr;
  r0..r4 clobbered
details: On the first invocation (oAIAttackVars_AttackElement == 0) it sets ObjectFlags1 bit 22, plays
  animation 0xA, resets the counter timer, plays sound effect 0xF8, spawns a temp attack object with ID
  7 + AiDifficultyTier via spawn_t1_0x5_tempAttackObject_80B8E30, sets StepTimer=6 and marks AttackElement=4
  as 'in progress'. On later calls it counts StepTimer down; when it expires it reloads StepTimer from
  a per-difficulty byte table (0x3C/0x5A/0x78/0x78 frames) and stores timer-0x14 as ChargeCycles, incrementing
  a counter at +0x10 of the temp attack object (its charge state). It then reads NaviStats byte 0x22 for
  the object's alliance, selecting r1=8 when nonzero, and loads a halfword parameter from byte_80EDBB8
  at tier*2+r1. That parameter is passed with facing-direction*0x50 and an object-relative offset of 0x4C
  to sub_80E5D12, whose result becomes oBattleObject_RelatedObject1Ptr, and oAIAttackVars_HitElement is
  set to 4.
