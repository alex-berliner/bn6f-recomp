name: battle_GetAllianceFactionFromBattleObject_80103A8
address: '0x080103A8'
kind: function
status: confirmed
summary: Reads the battle object's "alliance" stats byte (index 0x31) and normalizes it to a faction value, returning
  3 when set and 0 when not.
interface: int battle_GetAllianceFactionFromBattleObject(void* r5_battleObject /* object also passed in r6 and preserved
  */); returns r0 = 3 or 0, passes r6 through unchanged
details: 'Thin wrapper around GetBattleNaviStatsByte_AllianceFromBattleObject. Pushes lr, sets r1 = 0x31 (the stats-byte
  index the helper interprets as the "alliance" field) and calls the helper with the caller''s registers (r5/r6
  presumably identifying the battle object). It then collapses the returned byte to a boolean-style faction code:
  r1 = 3 if the byte was nonzero, r1 = 0 if it was zero, and returns that in r0. The result is likely one of the
  battle engine''s side/faction constants consumed by targeting or AI checks elsewhere. r6 is untouched and remains
  live for the caller; flags nz/c/v are clobbered by tst and the movs of the call sequence. Quirk: the nonzero case
  is hard-coded to 3 rather than returning the raw byte, so any alliance value other than 0 is reported as exactly
  3.'
