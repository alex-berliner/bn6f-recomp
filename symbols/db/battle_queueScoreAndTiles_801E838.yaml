name: battle_queueScoreAndTiles_801E838
address: '0x0801E838'
kind: function
status: confirmed
summary: Battle graphics helper that queues VRAM OBJ-tile transfers from a 5×4 source-tile list, optionally
  draws a 2-digit BCD score into the score-digit tile area, and always copies a fixed background tile.
interface: void sub_801E838(u32 tile_list /* r4 */, u32 battle_state /* r5 */); // preserves r4–r7; clobbers
  r0–r3, NZCV from final QueueEightWordAlignedGFXTransfer
details: 'Walks a u32 source-tile pointer list at r4 (treated as r4+4 cursor in r7), performing

  5 outer × 4 inner = 20 tile-pair transfers via QueueEightWordAlignedGFXTransfer

  into the OBJ tile region at 0x6016E00. Inner loop walks cursor r7; when the entry

  is the "null-tile" sentinel at byte_801FDC0, the cursor is NOT advanced and that

  tile is re-issued (i.e. repeats the last real entry). Each pair transfers 32 B

  (0x20) at the cursor source, then 32 B at src+0x20 → dest+0x80, giving the two

  8×8 rows of one OBJ tile slot, after which the OBJ dest advances 0x20; the outer

  loop then jumps 0x80 to skip to the next group. After the 5 groups, if

  battle_state[+8] (BS_DISPLAY_MODE) == 1, a 16-bit score-data word is read from

  the next list entry and written to battle_state[+4] (BS_SCORE_DATA), the BCD score

  byte at battle_state[+9] (BS_BCD_SCORE) is converted to binary by

  memory_bcdConvert, split into tens/ones, and four 0x20 transfers queue the two

  digit tiles (looked up by index into the u32 table at off_801FD64, with index 10

  used as a "0" for the tens place when score < 10) into the score-digit VRAM

  region 0x6017300; the tens==0 case also subtracts 4 from BS_SCORE_DATA to

  left-shift the digit graphics. Finally, a fixed 0x20-byte copy from

  byte_86F2900 → byte_30016B0 is always queued. QueueEightWordAlignedGFXTransfer

  is the only GFX-queue primitive used.

  '
