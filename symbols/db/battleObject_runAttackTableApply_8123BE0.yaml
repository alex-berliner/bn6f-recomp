details: "Sets up arguments and immediately tail-calls battleObject_applyAIDataToAttackTable_8123C20.\n\
  \  - r0 <- dword_8123BFC (constant 0x5A5856, looks like a packed mask/index pair)\n  - r1 = 0x20 (32,\
  \ matches AIData.Unk_40 struct_org in AIData.inc — the start of the AI input block)\n  - r2 = byte_81233E0\
  \ (likely a script/table byte stream)\n  - r3 = 5 (a small loop count / table index)\n  - r4 = 0x5c\
  \ (AIData.Unk_5c offset, a pointer field)\n  - r6 = 0\n  Then `bl battleObject_applyAIDataToAttackTable_8123C20`.\
  \ The wrapper only books these values into argument registers.\n  Captured calls show all 40 entry snapshots\
  \ with identical regs (r0=1, r1=0, r2=0x081233d8, r3=0x020047cc) and exit r0=0x20 — but those r0-r3\
  \ are never used here, only the wrapper's own immediates are. The `1` / `0` / `0x020047cc` is what r5\
  \ was preserved from the caller (r5 keeps game/AIData context). Snapshot consistency confirms this is\
  \ per-frame, called from the same place each tick.\n  All three callers are battle update hot-paths\
  \ (battle_updateFrame_8123558 and two mode-2 step drivers), which matches an \"evaluate AI / apply attack\
  \ table once per frame\" role.\n"
