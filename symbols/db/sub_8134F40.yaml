name: sub_8134F40
address: '0x08134F40'
kind: function
status: confirmed
summary: For the actor in r5, scans its hit-counter table and bumps the per-entry counter for every entry whose
  id matches r0, returning 1 if any entry was bumped.
interface: void battle_incHitCounter_8134F40(u16 id /*in r0*/, void *owner /*in r5*/) -> u8 found /*out r0*/; clobbers
  r1,r2,NZCV; preserves r4-r7,lr
details: 'Reads the table length from r5+0x28 and walks unk_202A3E0 (stride 0x20) while

  each entry''s active flag at +0x14 is non-zero. For each entry whose id at

  +0x1C matches the incoming r0, increments the per-entry counter at +0x16

  and then continues the scan using the freshly incremented value as the

  new comparison key (so the very same counter can match again on later

  passes). Returns 1 if at least one bump occurred, 0 otherwise. The

  active-flag-as-terminator pattern means empty/cleared slots stop the

  scan even when count is higher; r4 is used as the found flag.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
