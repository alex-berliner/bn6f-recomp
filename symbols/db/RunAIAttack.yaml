name: RunAIAttack
address: '0x0801B9E6'
kind: function
status: confirmed
summary: Runs one step of an enemy's "extra AI attack" script by dispatching through the caller's handler table
  or the shared AIAttackJumptable based on the object's CurAction.
interface: void battle_runAIAttackDispatcher_801b9e6(u32 **callerAttackTable /* r0 */, BattleObject *obj /* r5 */)
  — does not return to its own caller; the selected handler returns directly to RunAIAttack's caller. r4/r6/r7 are
  set to the object's aiData/aiState/attackVars for the handler, then restored. Flags NZC (and V) pass through to
  the handler.
details: "Reads the battle object's AIData pointer from R5+oBattleObject_AIDataPtr and builds pointers to its AI\
  \ state (oAIData_AIState) and attack-variable block (oAIData_AttackVars). Reads oBattleObject_CurAction (offset\
  \ 9) and dispatches on it: - CurAction 0x00-0x0F: handler table supplied by the caller in r0, indexed directly\n\
  \  (handler = table[CurAction]).\n- CurAction >= 0x10: index = CurAction - 0x10 into the shared AIAttackJumptable\n\
  \  (off_801BB10), except when attack variable oAIAttackVars_Unk_1d == 1, in which case\n  sub_80EAD9C is called\
  \ instead of a table handler — but it is still handed the table\n  address in r0 and the byte table offset (index*4)\
  \ in r1, so it can do its own dispatch.\nThe chosen handler is invoked via `mov lr, pc; bx r0`, so it returns\
  \ to RunAIAttack's caller (tail-dispatch pattern). Handler entry state: r0 = handler's own address, r1 = table\
  \ byte offset (index << 2, which also sets NZ from that value and C from bit 30 of the index — always 0 here),\
  \ r2 = attackVar 0x1d (only in the >=0x10 path), r3/r5/r8-r12 untouched pass-through, r4 = aiData, r6 = aiState,\
  \ r7 = attackVars. r1-r3 and r8-r12 reach the handler unchanged from the caller.\n"
