name: sub_809003C
address: '0x0809003C'
kind: function
status: probable
summary: 'Event-script side effect: once event flag BE4 is set, runs an unknown effect with arg 4, sets the GameState
  control byte to 3, and marks BBS request flag 0x7 in event byte 0x17.'
interface: () -> void; calls TestEventFlagFromImmediate(EVENT_BE4) and only proceeds when the flag is set (Z clear),
  clobbers r4/lr per ABI
details: 'The function is a guard-wrapped event action from the captured beastsp route. It tests story flag EVENT_BE4;
  if the flag is clear it returns immediately without touching anything. If the flag is set it calls sub_809E304
  with r0=4 (unknown effect, likely an event/scene command), writes 3 into GameState''s Unk_09 control byte (the
  ''can''t jack out'' / L-button-message style flag), and finally calls reqBBS_setFlag_e17b0f7_8140A00, which sets
  event flag 0x7 in event byte 0x17 at 0x2001F68 — the BBS-request flag byte. Order of side effects: effect, GameState
  control, BBS flag. Its only caller is sub_808FE34, so it is a leaf-ish event trigger body rather than a shared
  utility.'
