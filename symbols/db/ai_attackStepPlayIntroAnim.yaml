name: ai_attackStepPlayIntroAnim
address: '0x0810AF50'
kind: function
status: confirmed
summary: One step of an enemy AI attack state machine that plays the attack's intro animation, then waits for its
  last frame before arming a 30-frame counter and moving to sub-step 4.
interface: void ai_attackStepPlayIntroAnim(BattleObject* object /*r5*/, AIAttackVars* vars /*r7*/, int passThrough
  /*r10*/); clobbers r0-r3, flags; r10 passes through untouched
details: 'Called as one step of the AI attack state machine; r5 is the battle object,

  r7 is that attack''s variable block. First entry (vars->AttackStepIndex == 0):

  sets AttackStepIndex = 1, zeroes the ScratchVar word, sets object flag

  bit 22 via object_setFlag1, and selects the intro animation on the object:

  oBattleObject_CurAnim = AiDifficultyTier * 3 + 1 (so each AI difficulty tier

  has its own slot in the animation table). Subsequent calls: polls

  sprite_getFrameParameters for the current frame; if bit 7 (0x80, the

  "animation finished/end frame" flag) is not set, it just returns and waits.

  When the intro animation reaches its end frame, it advances

  oBattleObject_CurAnim by one (to the loop/hold animation), sets a 30-frame

  counter (0x1E) on the object with object_setCounterTime, and writes

  SubStepIndex = 4 into the vars block, moving the attack state machine to its

  next phase. Note the animation index stored is a byte but the finish-wait

  path re-reads it from the object, so changing anims externally mid-wait

  would still be picked up.

  '
