name: sub_800840C
address: '0x0800840C'
kind: function
status: confirmed
summary: Pre-battle intro step that copies intro graphics, waits for a busy flag, then runs both player BattleObjects
  through sub_8015A38 and marks the controller state as 4.
interface: 'void sub_800840C(struct IntroState *r5 /* clobbered as outputs: id, phase=+3, phase=+2 */)'
details: "Drive-by function operating on a small control struct in r5 (fields at +0, +2, +3).\nPhase byte at r5+3:\n\
  \  - 0 -> first call only: calls sub_80147E4(byte_203F558, byte_203F658) (a VRAM/buffer copy,\n    given the A_\
  \ prefix these are likely asset/VRAM upload buffers), then writes 4 to advance.\nThen polls sub_801483C(); if\
  \ non-zero (intro still busy) returns.\nLocal-tick byte at r5+2: if 0, calls timer_resetAndStart_801482C() and\
  \ writes 4, then returns.\n  (This implements a short wait-after-busy step, gated by the timer.)\nOnce the timer-elapsed\
  \ state is observed:\n  - battle_findPlayer(0) -> sub_8015A38 (process alliance 0's player)\n  - battle_findPlayer(1)\
  \ -> sub_8015A38 (process alliance 1's player)\n  - writes 4 into [r5] (the controller state / next-step tag),\
  \ then returns.\nInputs r10 are unused in this function but called by ABI; preserves r5-r7 per the contract.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
