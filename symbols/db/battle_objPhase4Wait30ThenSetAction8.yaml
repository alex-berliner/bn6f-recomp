name: battle_objPhase4Wait30ThenSetAction8
address: '0x080B9D12'
kind: function
status: probable
summary: 'Battle-object state handler: on phase 0 entry sets phase 4 with a 30-frame timer, then when
  the timer expires ends with CurAction = 8 and phase reset'
interface: (r0 = scratch/ldrb result, r5 = battle object pointer) -> void; sets oBattleObject_CurPhase,
  oBattleObject_TimerAndTimer2, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: A per-object phase/timer step typical of battle object update routines, using r5 as the object
  base. On first run (CurPhase == 0) it latches CurPhase = 4 and loads TimerAndTimer2 = 30 frames, then
  returns. On later runs it decrements oBattleObject_Timer; while positive it returns, and at zero it
  writes CurAction = 8 (the follow-on action/state) and clears CurPhaseAndPhaseInitialized so the next
  action starts fresh. The TimerAndTimer2 word vs Timer halfword distinction mirrors the standard battle-object
  timer layout where the write initializes both timers and the halfword read decrements the first.
