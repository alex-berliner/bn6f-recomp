name: ow_player_processAction_809D75E
address: '0x0809D75E'
kind: function
status: confirmed
summary: Dispatches one overworld player action via a jump table, consumes any pending animation requested
  by the handler, and initiates a scene transition if needed.
interface: void ow_player_processAction(u32 player_obj /*r5*/, u32 toolkit /*r10*/) -> r0, nz, c, v
details: "Phase 1 – Action dispatch: reads the action-type byte at oOWPlayerObject_Unk_0a in the player\
  \ object (r5), indexes a three-entry jump table (off_809D798: entries for indices 0, 4, 8) and branches\
  \ through it. The called handlers write into the pending-animation slot at offset 0x1C of the global\
  \ animation/event struct (eStruct200ace0 at 0x200ACE0).\nPhase 2 – Animation consume: loads byte_200ACFC\
  \ (offset 0x1C); if it is not 0xFF (PENDING_ANIM_NONE), copies it into oOWPlayerObject_AnimationSelect\
  \ on r5 and clears the source back to 0xFF, so the pending animation is consumed exactly once.\nPhase\
  \ 3 – Scene-transition check: calls sub_809DF28; if it returns zero the function exits. Otherwise:\n\
  \  • writes 0x02 into offset 0x01 (oAnimState_TransitionFlag) of\n    eStruct200ace0,\n  • loads the\
  \ GameState pointer from r10 (oToolkit_GameStatePtr)\n    and clears oGameState_Unk_10,\n  • clears\
  \ oOWPlayerObject_Unk_07 on r5,\n  • calls owPlayer_setJumptableIndex09AndOthers_809e004 with r0=0x10\n\
  \    to queue the overworld-leave transition step.\n\nThe function clobbers r0-r6 and r8-r12 (via the\
  \ guest-called handlers and helpers) but preserves r7 and r11/r12 across the transition path; callers\
  \ treat the entire register file as output.\n"
