name: sub_812365C
address: '0x0812365C'
kind: function
status: hypothesis
summary: Two-way tail dispatcher that reads a mode byte at [R5+3] and jumps to one of two handlers from a small
  table, passing the caller's register state straight through.
interface: 'void sub_812365C(void); // in: r5 = pointer to an object/struct whose byte at +3 selects the branch;
  all registers except r0/r1 plus nz/c/v are forwarded to the selected handler and its results flow back to the
  original caller'
details: 'Dispatcher stub only: it loads the selector byte at [R5+3], indexes the two-entry

  Thumb handler table at off_8123670 (entries: sub_8123678 for mode 0, sub_812368C

  for nonzero), sets lr = pc so the handler returns here, and bx to it; the stub then

  pops pc to return to the original caller. Side effects visible to the handler:

  r0 = handler address, r1 = selector byte. Because lr is overwritten with the return

  address and every other register (r2-r12) and the nz/c/v flags are untouched, the

  selected routine effectively runs in the original caller''s frame — the contract is

  whatever the two handlers collectively expose. The struct behind r5 is unknown from

  this stub alone; byte +3 acts as a mode/state selector, consistent with an object

  or task update pattern where +3 picks an update routine. Game-level meaning cannot

  be determined without reading sub_8123678 and sub_812368C.

  '
