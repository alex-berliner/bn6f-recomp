name: sub_8035756
address: '0x08035756'
kind: function
status: confirmed
summary: Scans a 32-entry request queue at dword_2000DC0 and claims the first pending request whose slot is free,
  clearing the slot; returns 0 if none available.
interface: uint32 sub_8035756(void) — takes no register inputs (r4-r7/lr preserved); returns the claimed request
  value in r0 (0 if none), with NZ flags set from r0. r3 is scratch (holds the last slot's current value on exit).
details: 'Iterates over 32 fixed 8-byte slots at dword_2000DC0 (IWRAM, ~0x100 bytes total

  per the trailing .word 0x100 literal). Each slot is {+0 current value, +4 pending request}.

  Per slot: if the pending field (+4) is 0, the slot is idle and its current field (+0) is

  cleared (note the code stores the just-read zero back to +0); if pending != 0 but current

  != 0, the slot is busy — both fields are left untouched; if pending != 0 and current == 0,

  the slot is free to claim: both fields are zeroed and the pending value is returned

  immediately. The loop exits early on a claim; otherwise, after all 32 slots, returns 0.

  Z/N flags always reflect the returned value, so callers can branch directly on the result.

  Values are opaque handles/requests — this function only moves them between the queue''s

  two fields; it never dereferences them.

  '
