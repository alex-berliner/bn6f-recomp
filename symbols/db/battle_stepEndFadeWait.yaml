name: battle_stepEndFadeWait
address: '0x08008FF0'
kind: function
status: probable
summary: Battle-loop state step that triggers the battle-end effect (kind 0x1C), waits out a 102-frame
  timer (and linked-battle partner readiness), then advances the battle-end sequence.
interface: (r5 = battle scene state struct, no register args) -> updates [r5]+3 phase byte, +8 timer,
  +4 and [r5] next-state; writes oGameState_BattleEndSubState; r0 clobbered
details: 'First pass (byte at r5+3 == 0) dispatches battle sub-effect kind 0x1C, clears flag 0x4C43 in
  dword_20352C0, sets timer r5+8 = 0x66 and phase r5+3 = 4. On subsequent frames it decrements the timer,
  and once comm_checkCrossNetBattleReady_801E754 reports ready (nonzero) it proceeds: if the current battle''s
  effects bitmask has bit 0x400, sub_800AF50''s result (1 -> state 8, anything else nonzero -> state 0xC)
  is stored into dword [r5]; otherwise it sets r5+4 = 3 and writes 3 to oToolkit_GameStatePtr->oGameState_BattleEndSubState,
  handing control to the next battle-end phase. Negative timer (after underflow) aborts the frame without
  action.'
