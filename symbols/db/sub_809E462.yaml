name: sub_809E462
address: '0x0809E462'
kind: function
status: hypothesis
summary: Tests a flag byte (oGameState_Unk_10) in the current game state and returns it with NZ flags set so callers
  can branch on zero/nonzero.
interface: 'bool gameState_checkFlagByteUnk10(Toolkit* toolkit) // in: r10 = toolkit, lr return; out: r0 = flag
  byte, r1 = GameState*, NZ flags from r0'
details: 'Tiny tail helper: takes the toolkit pointer in r10, follows oToolkit_GameStatePtr to the

  GameState struct, loads the single byte at oGameState_Unk_10, copies the GameState pointer

  into r1 as an extra output, and returns with NZ flags set from the byte value. The function

  itself is trivially understood, but the semantic meaning of oGameState_Unk_10 is unknown, so

  the in-game purpose (a story-progress flag, a mode toggle, etc.) is unconfirmed. It pushes/pops

  lr only to return, and preserves everything else.

  '
