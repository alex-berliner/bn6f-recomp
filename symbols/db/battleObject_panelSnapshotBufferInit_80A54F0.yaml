open_questions:
- The exact role of `unk_2013960` (r6) — loaded but unused inside this function; presumably for the callees
  that may read it.
- Whether the index byte at r5+8 is `CurState`, `CurAction`, or some other field of the object — struct
  offsets place state-like bytes at +0x8 but the precise meaning depends on what struct r5 is.
