name: battle_naviSpritePhaseUpdate
address: '0x080BCC0C'
kind: function
status: probable
summary: Dispatches the navi battle sprite object to one of three per-phase handlers based on its current
  phase field.
interface: (r0 = navi battle object in r5, r0 unused on entry) -> tail-calls handler sub_80BCC2C/sub_80BCC88/sub_80BCC96
  chosen by oBattleObject_CurPhase; no return value of its own
details: Reads the byte at oBattleObject_CurPhase from the object in r5 and uses it as an index into a
  3-entry thumb handler table at off_80BCC20, then tail-jumps to the selected handler via bx with lr held
  for a bl-style return (mov lr, pc). It is the state-machine step for a battle object spawned by battle_spawnNaviSprite,
  which initializes the sprite and then hands control here. Only phase values 0-2 are valid; a larger
  value would jump through garbage. The handler bodies themselves are not shown, so what each phase does
  is unknown.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase] then ldr r1,[r1,r0] selects handler by phase (asm lines
    3-5); off_80BCC20 table holds exactly three handler pointers sub_80BCC2C, sub_80BCC88, sub_80BCC96;
    mov lr, pc; bx r1; pop {pc} is a tail-call-with-return pattern, so this is a dispatcher wrapper; sole
    caller battle_spawnNaviSprite initializes the navi battle object then calls this, matching an initial
    state-machine step
  refs:
  - bn6f/asm/asm31.s:10286
  - 0x080BCB74 battle_spawnNaviSprite
  reproduce: python3 tools/asmcat.py 0x080BCC0C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- what each of the three handlers (sub_80BCC2C, sub_80BCC88, sub_80BCC96) does — needed to name the phases
- whether any caller ever enters with phase > 2 or whether the table is assumed exhaustive
