- Exact meaning of panel status bits 0x4000000/0x8000000/0x4050101 (owned-panel? occupied?) and why alliance
  2's mask differs in kind
- What sub_80CFE08 passes as the fixed coordinate and the forwarded arguments, which would confirm whether
  this is a row or column sweep
