summary: 'Init handler of a short-lived shadowless sprite object: appears on its panel for about two frames
  with a 0xFF (no-op) hit effect, then runs the standard update; no sound, no private updater.'
interface: 'void battleObject_initBriefCollisionObject(u32 r5 /* battle object */) : r5 -> [r5 r8 r10]'
details: 'Frees the object when object_isCurrentPanelValid fails. sprite_load(0x80, 0x14, 4) + sprite_noShadow,
  ObjectFlags |= 2 (visible), CurAnim = CurAnimCopy = 0, sprite_setAnimation(0) + sprite_loadAnimationData,
  oBattleObject_TimerAndTimer2 = 2 (a two-frame life), palette 0, flip per alliance, object_setCoordinatesFromPanels.
  Allocates collision data (kept in r7; frees the object on failure), object_setupCollisionData(4,5,0),
  object_setCollisionRegion(1), hit effect 0xFF, object_presentCollisionData once, CurState = CUR_STATE_UPDATE,
  return - unlike its siblings there is no tail-called per-tick handler and no PlaySoundEffect anywhere
  in the body.

  '
