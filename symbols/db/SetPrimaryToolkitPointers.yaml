name: SetPrimaryToolkitPointers
address: '0x08006BC0'
kind: function
status: confirmed
summary: Boot-time initializer that copies the 15-entry toolkit globals pointer table from ROM into eToolkit (the
  toolkit's working RAM) and sets r10 to eToolkit as the frame pointer base for subsequent toolkit code.
interface: 'sig: SetPrimaryToolkitPointers(void) -> (void); in: lr: return address (also handed back to caller in
  r0 via the unusual pop-into-r0 + bx r0 epilogue); out: r10: address of eToolkit; r0: function''s own return address
  (epilogue quirk); r1 r2: left as CopyWords left them; r3: preserved; nz c: left as CopyWords left them'
details: 'Calls CopyWords with src = ToolkitPointers (ROM), dest = eToolkit (the toolkit''s RAM region),

  size = 0x3C (15 * 4 bytes). The 15 pointers rebase every toolkit global: i_joGameSubsysSel,

  eJoypad, eRenderInfo, eCamera, eCutsceneState, eWarp2011bb0, eBattleState, unk_200F3A0,

  unk_2009740, iCurrFrame, iBGTileIdBlocks, eChatbox, eCollisionData, sSubmenu, byte_200A220.

  After the copy, r10 is initialized to eToolkit, which the rest of the toolkit uses as a

  frame pointer base (eToolkit-relative globals). The epilogue pops saved LR straight into

  r0 and bx''s through it, so r0 ends up holding the return address — the C wrapper surfaces

  this as the return value even though it is semantically meaningless.

  '
