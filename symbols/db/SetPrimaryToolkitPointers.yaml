open_questions:
- Why does the original pop LR into r0 and bx r0 instead of the usual pop {pc}? Likely a compiler/macro artifact
  rather than intentional; callers may simply not depend on r0.
- Two entries in the table (unk_200F3A0, unk_2009740, byte_200A220) are unnamed in the disassembly — their purposes
  remain unknown and would clarify what subsystems the toolkit actually owns.
