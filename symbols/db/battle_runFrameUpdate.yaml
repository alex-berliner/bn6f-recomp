name: battle_runFrameUpdate
address: '0x0812B25C'
kind: function
status: probable
summary: 'One per-frame battle-scene update step: first feeds the caller''s command/message id into sub_812B2C4,
  then advances all entity update handlers and the eStruct sprite pipeline.'
interface: (r0 = command/message id, e.g. 0x12 or 0x13) -> r0 = ?; no meaningful flags
details: A thin per-frame driver used by the battle AI/text-box state machines. It first passes r0 unchanged
  (as far as the visible code shows) to sub_812B2C4, which every caller pairs with a command byte like
  0x12/0x13 — likely queuing a battle message or text-box command. It then calls entity_runAllUpdateHandlers_80465BC,
  which walks the 15-entry 0x58-byte entity record array and runs each active record's update handler,
  and finally battle_updateEStructSprites_80465F8, the per-frame sprite refresh (hitboxes, palettes, anim
  tiles) over the same eStruct array. The fixed order (command step, entity step, sprite step) makes it
  the shared tail every battle dispatcher calls after selecting a sub-state handler.
