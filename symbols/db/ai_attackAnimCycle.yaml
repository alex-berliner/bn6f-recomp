name: ai_attackAnimCycle
address: '0x0810B9AA'
kind: function
status: probable
summary: 'Battle object attack-state update: while its flag matches off_810BB88 and current sprite frame
  attribute 0x80 is set, cycle CurAnim through dword_810B9E8 using oAIAttackVars_AttackElement mod 4;
  otherwise clear the element, run sub_810BDF4, then exit the attack state.'
interface: () -> r0 = destroyed; uses caller-set r5 = battle object struct and r7 = AI attack-vars block;
  flags from cmp
details: 'Reads the object''s collision flag via object_getFlag and tests it against a mask (literal pool
  at off_810BB88, currently shown as 0 — suspicious). If the flag matches, it reads the current animation
  frame parameters and only proceeds when attribute bit 0x80 is set: it takes oAIAttackVars_AttackElement
  from r7, looks up byte [table + element] in dword_810B9E8 (bytes 03 04 60 10, i.e. four animation IDs),
  stores it into oBattleObject_CurAnim at r5, then increments the element index mod 4. If the flag is
  clear, it zeroes AttackElement, calls the KillrEye attack-branch chooser sub_810BDF4, then tears the
  attack state down with object_exitAttackState_801171C.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'dword_810B9E8 = 0x1060403 gives four byte entries (03,04,60,10) indexed by AttackElement with
    wraparound at 4; strb r1,[r5,#oBattleObject_CurAnim] stores the looked-up animation ID into the object''s
    current-anim field; flag-clear path: mov r0,#0 / strb to AttackElement, then bl sub_810BDF4 (KillrEye
    attack chooser) and bl object_exitAttackState_801171C; sprite_getFrameParameters + tst r0,#0x80 gates
    the anim change on the frame''s attribute bit; ldrb r0,[r7,#oAIAttackVars_AttackElement] / strb r0,[r7,...]
    show r7 is the AI attack-vars struct, so this is boss-AI attack bookkeeping'
