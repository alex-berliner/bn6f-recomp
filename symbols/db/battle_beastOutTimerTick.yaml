name: battle_beastOutTimerTick
address: '0x08136A0C'
kind: function
status: probable
summary: Counts down the Beast Out timer each tick and, when it expires, tears down the beast-out state
  (scales, e-struct effects, screen registers) back to normal form.
interface: '(r0 = unused/ignored; r5 = beast-out state object: +0x12 countdown, +0x13 flag, +0x3 next
  state; r10 = toolkit) -> r0 = 0 written to r5+0x13; no meaningful return'
details: 'Each call it stores counter r5+0x12 >> 2 into the struct at toolkit->Unk2009740+2 (likely remaining-time
  for UI/logic) and decrements r5+0x12. While the counter is still >= 0 it calls sub_8136B10(3) each tick;
  when it underflows, it enters the end path: writes state 0x28 to r5+3, zeroes the counter and all four
  bytes of the 2009740 beast-out struct, zeroes render-info halfwords +0x18/+0x1a (sprite scale/offset),
  writes 0x2f/0x3f/0x3f to 200f3a0+9..0xb (screen blend/fade values), calls sub_8136B74, clears eStructArr2008450
  entries 0xA and 0xB via sub_8046696 (which also marks their sprites unscalable, undoing the beast-out
  enlargement), calls sub_8136BA0(0xB), and clears r5+0x13. The recorded ''beastsp'' route and the scale-clearing
  callee match the Beast Out mechanic in BN6.'
