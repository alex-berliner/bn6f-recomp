name: battle_render_startBlurEffect_804C43C
address: '0x0804C43C'
kind: function
status: confirmed
summary: Kicks off the battle "blur/afterimage" effect by queueing its GFX to VRAM, resetting the blend/fade
  state, and running the first blur update.
interface: (r5, r7, r10 = toolkit, lr) -> r2 r8 r9 set by battle_render_setBlurAndAnimUpdate_804C478;
  clobbers r0-r3, flags, lr; preserves r4-r9
details: 'Battle-render helper that starts the blur (afterimage/ghost) effect. Queues an 8-word-aligned
  GFX transfer of the effect tiles at byte_86A1480 to VRAM 0x600CB00, 0x4C0 bytes, via QueueEightWordAlignedGFXTransfer.
  The queuer leaves an object pointer in r5 (and r7) as outputs; this function''s r5/r7 inputs are actually
  dead - they are push/pop-preserved but overwritten by the queuer''s results before use. Then it reads
  the toolkit''s render-info pointer (oToolkit_RenderInfoPtr) and stores halfword 0x1F82 at +0xA (fade/blend
  counter reset), and reads the toolkit''s blur-state block pointer (oToolkit_Unk200f3a0_Ptr) writing
  0x3F to +9 (blend amount, i.e. full strength) and 0x17 (23) to +0xA (frame timer/duration). It stores
  state value 4 at +0x10 of the object returned by the GFX queuer, and finally tail-calls battle_render_setBlurAndAnimUpdate_804C478
  with r5 = that object and r7 = the queuer''s r7, leaving that callee''s r2/r8/r9 as its own outputs.

  '
