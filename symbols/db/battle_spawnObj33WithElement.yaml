name: battle_spawnObj33WithElement
address: '0x080C1EAC'
kind: function
status: probable
summary: 'Spawns battle object #33 and then customises it: element, extra vars, related object, alliance
  flags and a collision-data block.'
interface: (r0 = obj id? (overwritten with 0x33), r1 = x, r2 = y, r3 = element, r5 = related object ptr,
  r6 = extra vars, r7 = collision data ptr) -> r0 = spawned BattleObject or 0
details: Wrapper around object_spawnType1 that forces the object index to 0x33 while passing the caller's
  remaining spawn arguments through. If spawning succeeds (non-null check), it fills the new BattleObject's
  Element byte from r3, ExtraVars from r6, RelatedObject1Ptr from r5, copies AllianceAndDirectionFlip
  from r5's object into the new one, and points CollisionDataPtr at the caller-supplied buffer r7, writing
  1 to its first byte (likely an active-hitbox/entry count flag). On failure it returns immediately with
  the spawn result. Only one caller (0x080E93A0) is known, so the identity of object 0x33 is not confirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x33 + bl object_spawnType1: hard-coded spawn id 0x33 for a type-1 battle object; beq
    locret after spawn check: returns spawn result unchanged when null; strb r3,[r0,#oBattleObject_Element]
    and str r6,[r0,#oBattleObject_ExtraVars]: caller-supplied element and extra vars stored into the new
    object; str r5,[r0,#oBattleObject_RelatedObject1Ptr] + ldrh/strh of AllianceAndDirectionFlip from
    r5: links new object to a source object and copies its alliance flags; str r7,[r0,#oBattleObject_CollisionDataPtr];
    mov r1,#1; strb r1,[r7]: attaches caller-provided collision data and sets its first byte to 1'
