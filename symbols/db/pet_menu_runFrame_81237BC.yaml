name: pet_menu_runFrame_81237BC
address: '0x081237BC'
kind: function
status: confirmed
summary: 'Pet menu''s per-frame main loop: ticks menu helpers, runs entity updates, and exits to the field
  map once the screen fade finishes.'
interface: void sub_81237BC(void) /* no register I/O; pure orchestrator */
details: "Thin orchestrator for the pet menu (the in-game screen that lets the player interact\nwith their\
  \ NetNav / pet). Each frame it calls, in order:\n    sub_8123A50, sub_8123C98, sub_8123E58  -- the menu's\
  \ own update helpers (input,\n                                              cursor/sprite, layout),\
  \ all defined in\n                                              the same pet-menu TU.\n    entity_runAllUpdateHandlers_80465BC\
  \    -- generic entity update pass.\n    sub_80465F8                            -- render/animation\
  \ tick.\nThen it polls IsScreenFadeActive: if the fade-out is still running, the loop keeps\ngoing;\
  \ once it returns false (no fade active) it calls pet_menuExitToMap_811F708 to\nreturn the player to\
  \ the field map. This pattern (run helpers, check fade, then\ntransition) is the standard \"screen done\
  \ its exit animation -> hand back to caller\"\nidiom used across BN6 menus.\n\nThe function itself takes\
  \ no parameters and returns nothing useful: it `push {lr}` /\n`pop {pc}` (tail-equivalent) after its\
  \ last call, and the readable C notes that the\npushed LR is purely there to cross the helper calls\
  \ rather than to convey a return\nvalue. Register contract (r5/r10/lr in; r5/r8/r9/r10/r11/r12 out;\
  \ r4-r9/r12 preserved)\nis just whatever the leaf routines clobber.\n"
