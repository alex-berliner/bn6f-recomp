name: battle_objectDispatchPanelChange_80C6CFC
address: '0x080C6CFC'
kind: function
status: confirmed
summary: Dispatches a panel-state change requested by a battle object — break, crack, or set panel type based on
  an action code.
interface: void battle_objectDispatchPanelChange(int r0, int r1 /*panel coords*/, u8 action /*r2*/); tail-calls
  one of object_crackPanel / object_breakPanel_dup1 / object_setPanelType, forwarding all registers
details: 'Small dispatcher for panel changes issued by battle objects. The action code in r2 selects the handler:
  0xFF returns immediately without touching the panel (treated as "no change"), 3 tail-calls object_crackPanel,
  1 tail-calls object_breakPanel_dup1, and any other value tail-calls object_setPanelType. All arguments (r0-r2)
  and callee-saved registers r4-r7/r10 are passed through to the chosen handler unchanged, so the handler''s outputs
  become this function''s outputs. The extra preserved registers suggest the underlying panel handlers take more
  context (likely a battle-object pointer or work area) in r4-r7/r10 that the caller set up. Panel coordinates in
  r0/r1 are presumably (x, y) in the 6x3 battle grid.

  '
