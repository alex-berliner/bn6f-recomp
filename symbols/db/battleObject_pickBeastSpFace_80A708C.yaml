open_questions:
- The exact meaning of 0x1C000 and 0x0000 written at +0x30 (likely a variant ID / facing flag, but which
  flag bit pattern it encodes isn't pinned down from this function alone — checking nearby callers in
  the BeastSp animation table would settle it).
- Whether the second position ([r5,#0xC]/[r5,#0x10]) is "home/anchor" or "target" is unknown; captured
  calls don't include a dereferenced memory dump of the object, so we can't tell which struct fields those
  are.
