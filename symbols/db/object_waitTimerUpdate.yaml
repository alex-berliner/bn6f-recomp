name: object_waitTimerUpdate
address: '0x080AA2A8'
kind: function
status: probable
summary: Per-frame object update that counts down a delay timer, then on expiry resets the object's state,
  restarts its animation, and restores saved values before updating the sprite.
interface: (object in r5, no register args) -> void; decrements word at +0x24, on zero writes state byte
  [r5]=3, anim slot byte +8=4
details: This is a per-frame update routine for an object whose pointer lives in r5. Each call decrements
  the word timer at +0x24; while it is still positive it just falls through to sprite_update. When the
  timer reaches zero it sets the state byte at +0x00 to 3, calls sprite_setAnimation with index 0 followed
  by sprite_loadAnimationData to restart the sprite from animation 0, copies three consecutive words from
  +0x28/+0x2C/+0x30 into +0xC/+0x10/+0x14 (likely restoring position/velocity or other working fields
  snapshot before the wait), and sets byte +0x08 to 4, presumably a substate/flag consumed by other handlers.
  It always ends with sprite_update for the current frame.
