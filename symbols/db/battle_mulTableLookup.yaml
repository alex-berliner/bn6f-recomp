name: battle_mulTableLookup
address: '0x0800FCFC'
kind: function
status: probable
summary: Returns tableA[r0] multiplied by tableB[battle object's Param1], a lookup-and-scale helper.
interface: (r0 = index into byte_80212BB; r5 = battle object whose Param1 indexes byte_800FD5C) -> r0
  = byte_80212BB[r0] * byte_800FD5C[obj->Param1]; flags from mul
details: Loads a byte from table byte_80212BB indexed by r0, then loads a byte from table byte_800FD5C
  indexed by the calling battle object's oBattleObject_Param1 field, multiplies the two (16-bit result
  in r0), and returns. No branches, no memory writes; purely a two-table lookup product. The r5 object
  pointer is caller-held, so Param1 likely selects a per-object attribute (e.g. a rank/element factor)
  that scales the first table's value. Table contents are not shown here, so the game meaning of either
  table is unconfirmed.
