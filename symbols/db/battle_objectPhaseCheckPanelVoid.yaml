name: battle_objectPhaseCheckPanelVoid
address: '0x080BAB30'
kind: function
status: probable
summary: Per-frame phase handler for a battle object that waits 2 frames after initializing, then checks
  whether the panel it sits on is a hole/void and picks the next action accordingly.
interface: (r5 = battle object header) -> r0 clobbered; updates PhaseInitialized, CurAnim, Timer, Flags,
  and on timer expiry sets CurAction + CurPhaseAndPhaseInitialized; flags not meaningfully returned
details: This is a state-machine phase (uses oBattleObject_PhaseInitialized/CurPhaseAndPhaseInitialized)
  rather than an independent routine. On first entry it marks the phase initialized (4), sets CurAnim=3,
  plays sound effect 0x94, sets object flag bit 1 (0x2, likely 'visible/active'), and loads Timer=2. On
  subsequent frames it counts the timer down; once it hits zero it reads PanelX/PanelY and calls object_getPanelParameters,
  testing the status word against mask 0x10010. If both bits 4 and 16 are set (panel is a void/hole),
  it sets CurAction=4 (fall/disappear?) with phase 0; otherwise it sets CurAction=0x18 with phase 0, the
  normal continuation.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'init branch: mov r0,#3; strb [r5,PhaseInitialized-ish]; PlaySoundEffect(0x94); Timer=2 — one-shot
    setup of an appearing object; bl object_getPanelParameters with ldrb PanelX/[r5,PanelY] — checks the
    panel under the object; ldr r1,dword_80BAB80 (0x10010); and r0,r1; cmp r0,r1 — tests two panel status
    bits simultaneously; bne path sets CurAction=0x18, equal path sets CurAction=4, both with phase 0
    — two distinct follow-up behaviors; pattern (PhaseInitialized byte, Timer countdown, CurAction/CurPhaseAndPhaseInitialized)
    matches other battle object phase handlers'
