open_questions:
- No known caller, so which object/enemy uses this phase and what actions 4 and 0x18 mean for it are unknown
- Exact meaning of panel status bits 0x10 and 0x10000 (hole vs broken vs off-field variants) would confirm
  the branch semantics
- What sound 0x94 and animation 3 correspond to (spawn/transform cue) is unverified
