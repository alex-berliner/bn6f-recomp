name: battle_clearTempAttackObject
address: '0x080EE33A'
kind: function
status: probable
summary: 'Tears down an AI attack: clears the battle object''s related object and the AI data''s temp
  attack object pointer, then exits the attack state.'
interface: (r5 = battle object) -> r0 = 0; r5->RelatedObject1Ptr = NULL, r5->AIData->TempAttackObjectPtr
  = NULL; flags clobbered
details: Runs with the battle object in r5 (r4/r5-style object method). It zeroes oBattleObject_RelatedObject1Ptr
  on the object and oAIData_TempAttackObjectPtr inside the object's AIData struct, unlinking the temporary
  attack object from both sides, then tail-calls object_exitAttackState to leave the attacking state.
  r0 is left 0; no return value is used. No callers are known, so the exact trigger (attack end vs. interrupt)
  is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: str r0,[r5,#oBattleObject_RelatedObject1Ptr] with r0=0 clears the object-side pointer; ldr r1,[r5,#oBattleObject_AIDataPtr];
    str r0,[r1,#oAIData_TempAttackObjectPtr] clears the AI-side temp attack object; bl object_exitAttackState
    ends the attack state after unlinking; r5-based access with no r0 setup matches an object-method calling
    convention
