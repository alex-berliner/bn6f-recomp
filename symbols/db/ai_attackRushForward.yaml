name: ai_attackRushForward
address: '0x08015766'
kind: function
status: probable
summary: 'Enemy-AI navi melee/step-forward attack routine: initiates the attack (move to front panel,
  spawn effect, sound, chip-class setup), then busy-waits ~30 frames before returning done.'
interface: (r5 = battle object ptr) -> r0 = 1 while attack state active, 0 when finished; uses AIData+0xA0
  vars
details: 'On entry it reads the AI attack struct (AIData+0xA0): if AttackElement is nonzero the attack
  is already running, so it just decrements StepTimer and returns 1 until it hits 0. When AttackElement==0
  it starts the attack: sets battle flag 4, plays SFX 0x8E, copies FuturePanelX/Y into PanelX/Y, frees
  the reserved panel, recomputes coordinates/collision panels, sets CurAnim=2 (attack anim, CurAnimCopy=0xFF),
  checks emerge flip, and spawns an effect object at object x+0x14 (an impact/flash in front), flagging
  it via oObjectHeader_Flags|=4. It clears AIType, flags the related object (Param3=1, flags|=0x14), reads
  the navi-stats byte 0x2C to pick a chip class (0 if <=0x0A, 0xB if <=0x11, else 0xC), loads that sprite
  with a white-palette flash, rewrites the stats byte, sets a battle text id from the same value, sets
  player navi-stats field 0x0E, and runs turn-open processing. It then clears invulnerability and collision
  region, sets StepTimer=30 (0x1E) and AttackElement=4; on expiry it clears battle flag 4, restores collision
  region 1, zeroes HitElement and the related object''s Param3, and returns 0.'
