summary: Trivial helper that unconditionally returns 1 ("true") in R0.
interface: void alwaysTrue(void) -> r0 = 1 (NZ set for result 1)
details: 'Two-instruction leaf function: loads R0 with 1 and returns to LR. The MOV sets

  the NZ flags according to the value 1 (N clear, Z clear), so callers can also

  branch on the result directly after the call without inspecting R0.

  It touches no memory, no game structures, and no flags other than the ones

  naturally set by the MOV. Its meaning depends entirely on the callers — likely

  used as a "yes/true" callback or a stub predicate passed to a shared routine

  that expects a boolean-returning function pointer.

  '
