name: sub_801E1E4
address: '0x0801E1E4'
kind: function
status: confirmed
summary: Redraw the 2-row background strip of a window/dialog object, picking between a narrow and full-width tile
  layout, and mark the background dirty.
interface: void drawWindowBackdrop_801E1E4(void); // r5 in = window object; r4-r12 and lr are preserved; r0-r3 and
  lr return with the last callee's leftovers; NZCV clobbered.
details: 'r5 points at the owning window object; byte at +0xC selects the layout.

  If +0xC != 2 (the narrow case) the function first dispatches flag 0x400

  (1 << 10) via dispatch_801DACC, then uses the full-width tile table at

  word_801EE14; otherwise it uses the narrow tile table at word_801EE58 and

  skips the dispatcher. Tile region written via CopyBackgroundTiles: column

  j = 7 + tiles_cut/2, row i = 2, block 3, of size (17 - tiles_cut) x 2,

  where tiles_cut is 0 (full) or 9 (narrow). Finally sets bit 0x100 (1 << 8)

  in the flag word of the global struct at 0x2035280 via

  flagSetBits_eStruct2035280_801BEB8, marking the background as

  drawn/dirty. r4-r6 are preserved across each guest call by a single

  push/pop frame.

  '
