name: sound_dispatchTask_8000630
address: '0x08000630'
kind: function
status: confirmed
summary: Thin wrapper that submits a sound task to the sound engine, handing the engine's dispatcher sound_8000808
  the task callback sub_814EA58 and passing the caller's r10 through as an argument.
interface: void sound_dispatchTask_8000630(u32 r0, u32 r2); /* r4-r7, r10 preserved context; sets r1 = caller's
  r10, r3 = &sub_814EA58|1 before calling sound_8000808; returns nzcv and r10 from the callee */
details: 'Saves lr and the caller''s r10 on the stack, loads the Thumb entry point of sub_814EA58 (via off_8000870)
  into r3 as the callback for the sound engine''s dispatcher sound_8000808, and moves the caller''s r10 into r1
  as the dispatcher''s second argument. Arguments r0 and r2 are passed through untouched; r1 and r3 are the only
  registers this routine sets itself. After sound_8000808 returns, r10 is restored from the stack and control returns
  to the caller via pop {pc}. Flags (nzcv) and r10 therefore carry whatever the callee left. The preserved r4-r7
  and r10 suggest the caller keeps its overall context (likely a sound-task state block) in these registers across
  the call. Quirk: r10 is used both as data passed to the dispatcher and as a register that must survive the call,
  hence the manual save/restore.

  '
