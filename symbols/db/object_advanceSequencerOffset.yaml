open_questions:
- exact contents/format of the table indexed by [r5+0xC] (sub_81175C4 not shown), so the meaning of each
  stride (8/4/6) is inferred, not proven
- what structure r5 points to and which game system owns it (sprite animation vs scripted object movement)
