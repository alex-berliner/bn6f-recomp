name: battle_aiLoadAttackVarsFromTables
address: '0x080F865C'
kind: function
status: probable
summary: Loads two per-enemy AI table values (e.g. attack damage and a companion stat) into the battle
  object's AI attack variables.
interface: (r0 = battle object / enemy AI index) -> writes word to [AIDataPtr+0xA0] (oAIAttackVars_Damage);
  returns via popped regs
details: Takes the enemy/AI index in r0, multiplies by 8 (stride of the per-AI table rows), and reads
  a halfword entry from two tables (byte_80F86BC and byte_80F86E0) through battle_aiGetVersionedTableEntry_800FE12,
  which applies version-dependent scaling (notably for AI version 4). The first value is kept as the low
  halfword and the second, shifted left 16, becomes the high halfword; the combined word is stored at
  [r5+oBattleObject_AIDataPtr]+0xA0, the oAIAttackVars_Damage field. So each AI id has an 8-byte row whose
  first two halfwords seed the AI's attack parameters, adjusted per AI version. The function is a pure
  loader with no branching beyond the two lookups.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mul r0,r2,#8 then bl battle_aiGetVersionedTableEntry_800FE12 twice with different table bases
    (off_80F86B0, off_80F86D4); lsl r0,#16; orr r6 combines the two halfword reads into one value; str
    r6,[r3+0xA0] into oBattleObject_AIDataPtr+oAIAttackVars_Damage; sole caller battle_aiEnemyAiActionHandler_80F8448
    runs this during enemy AI tick when selecting an attack
