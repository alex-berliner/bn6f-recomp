name: battle_aiLoadAttackVarsFromTables
address: '0x080F865C'
kind: function
status: confirmed
summary: Looks up an AI attack's damage word in the versioned data tables and stores it into the battle object's
  AI attack-vars block.
interface: void battle_aiLoadAttackVarsFromTables(u32 entryIndex /*r0*/, u32 battleObject /*r5*/); returns nothing
  (no meaningful r0), clobbers r0-r3, lr and flags, preserves r4/r6
details: 'Takes an index into two parallel versioned data tables (byte_80F86BC and byte_80F86E0,

  entries 8 bytes apart) and resolves each through battle_aiGetVersionedTableEntry_800FE12,

  which presumably picks the low/high table for the current game version (Falzar/Gregar).

  The first call''s result is the low 16 bits; the second result is shifted left 16 and

  OR''d in, forming one 32-bit value. That value is written to

  battleObject->AIDataPtr + 0xA0 + oAIAttackVars_Damage, i.e. the damage field of the

  AIAttackVars struct embedded in the object''s AI data block. The 0xA0 offset is applied

  inline (add r3,#0xA0) before the struct field offset. No validation of entryIndex;

  callers are expected to pass a valid attack slot index.

  '
