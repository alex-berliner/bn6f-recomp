name: submenu_showScriptAndSetPhase2C
address: '0x0803ADB8'
kind: function
status: probable
summary: Plays SOUND_MENU_SELECT, displays text script 0x1B (or 0x19 when flag byte_2006772 is non-zero)
  via sub_803BB2C, then writes 0 to the r5 struct's +3 and 0x2C to its +1 menu-state field.
interface: (r5 = menu/task state struct, not passed in r0) -> r0 = 0; writes state+1 = 0x2C, state+3 =
  0
details: Plays SOUND_MENU_SELECT, then calls sub_803C3E0 to test byte_2006772; picks script 0x1B when
  the flag is zero and 0x19 otherwise, and displays it via sub_803BB2C. It then stores 0 at [r5,#3] and
  0x2C at [r5,#1] of a struct whose pointer lives only in r5, which is never loaded inside the function
  — the caller must set it up beforehand. The two script IDs likely correspond to a failure and a success
  message for the same network action. No return value is meaningful (r0 ends as the last store value
  0x2C).
