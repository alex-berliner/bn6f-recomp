name: owPlayer_80350a8
address: '0x080350A8'
kind: function
status: confirmed
summary: Spawns the player's overworld object for a map entry and points the camera at its coordinates.
interface: void owPlayer_80350a8(void) — no meaningful inputs; internally calls spawnOWPlayerObjectForEnterMap_809e064
  (returns object ptr in r5) and camera_writeUnk03_14_80301b2(mode=1, target=&object->Coords); r5 is preserved for
  the caller.
details: Entry hook for placing the player on the overworld when entering a map. First calls spawnOWPlayerObjectForEnterMap_809e064,
  which creates the player's overworld object and returns its pointer (in r5 per the lifter's caller analysis).
  It then calls camera_writeUnk03_14_80301b2 with r0 = 1 (a camera coordinate mode/"unk03" selector) and r1 = spawned
  object + oOWPlayerObject_Coords, i.e. it hands the camera the address of the new object's Coords field so the
  camera tracks/focuses the player. Only the Coords offset (oOWPlayerObject_Coords) of the object structure is referenced
  here. The spawn result is consumed immediately; the function pops r5 and returns, leaving the caller's r5 untouched
  despite it being used as the spawn destination internally. Flags nz/c/v are clobbered by the calls.
