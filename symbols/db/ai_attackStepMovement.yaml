name: ai_attackStepMovement
address: '0x080F41C0'
kind: function
status: probable
summary: 'Per-tick movement step for an AI attack/object: advances its position by velocity, and on timer
  expiry snaps it onto its reserved target panel and flags it as arrived.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets object X/Y += velocity, decrements StepTimer,
  on expiry copies FuturePanelX/Y to PanelX/Y and sets ObjectFlags1 bit 1 (currently moving) and HitElement
  = 0xC
details: Each call adds the object's XVelocity/YVelocity to its X/Y world position, then recomputes panel
  coordinates from the position (object_setPanelsFromCoordinates) and updates collision panels. It decrements
  the oAIAttackVars_StepTimer; while the timer is still >= 0 the function just returns. When the timer
  underflows, the object's PanelX/PanelY are set from FuturePanelX/FuturePanelY (the pre-reserved destination),
  the panel reservation is released (object_removePanelReserve), pixel coordinates and collision panels
  are synced to the new panel, flag 0x40 in the collision flags is cleared, ObjectFlags1 bit 1 (CURRENTLY_MOVING_1)
  is set, and oAIAttackVars_HitElement is written with 0xC (likely element NONE/neutral for the attack's
  hit). This is the movement phase of an AI-driven attack that flies to a target panel before its hit
  phase.
