name: sub_80EC960
address: '0x080EC960'
kind: function
status: confirmed
summary: Dispatches one step of an AI attack's state byte to its handler via a small jump table indexed by raw state.
interface: 'void sub_80EC960(void);  // in: r2 r5 r6 r7 r10 lr; out: r1 r5 r8 r9 r10 r11 r12 (from callee); clobbers:
  nz c v r0 r2 r3 r4 r6 r7 lr'
details: 'Reads byte at r7 + oAIAttackVars_Unk_00 as the current AI attack state. Uses that byte as a

  raw (non-scaled) byte offset into the 2-entry jump table at off_80EC974

  (entries are sub_80EC97C and aiAttack_tickTimerAndExitWhenDone_80ECA0C, stored as +1 so the

  Thumb bit clears on bx). Loads the handler word, then tail-calls it via `mov lr, pc; bx r1`

  with r0 set to the state byte. All non-clobber outputs the caller sees are simply what the

  selected handler returns, so this is a transparent dispatcher in the AI attack state machine.

  '
