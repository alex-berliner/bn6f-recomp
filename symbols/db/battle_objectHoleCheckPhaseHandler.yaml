- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst r0,r0 / bne splits phase 0 (setup: anim 3, sound 0x94, flags|=2, timer=3) from later phases;
    locret path decrements oBattleObject_Timer and returns while bgt holds, a frame countdown; bl object_getPanelParameters
    with PanelX/PanelY then and r0,0x10010 / cmp tests panel status bits; bne branches to CurAction=0x14
    vs CurAction=4, both resetting phase via CurPhaseAndPhaseInitialized=0; callee object_getPanelParameters
    is documented as returning panel status flags or 0 off-field'
