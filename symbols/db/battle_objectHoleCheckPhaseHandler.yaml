name: battle_objectHoleCheckPhaseHandler
address: '0x080BB694'
kind: function
status: probable
summary: 'Battle-object phase handler: plays a sound and animation, waits 3 frames, then dispatches to
  action 4 if the object''s panel is a hole/broken panel, else action 0x14.'
interface: (r0 = unused (object passed in r5), r5 = battle object pointer) -> r0 = clobbered; updates
  oBattleObject_CurPhase, CurAnim, CurAction, Flags, TimerAndTimer2
details: State-machine step indexed by oBattleObject_CurPhase. Phase 0 sets phase to 4, CurAnim to 3,
  plays sound effect 0x94, ORs bit 1 into oObjectHeader_Flags, and stores 3 into the TimerAndTimer2 word
  (arming the low 16-bit timer). Later phases decrement oBattleObject_Timer and return until it hits 0,
  then call object_getPanelParameters with the object's PanelX/PanelY and AND the result with 0x10010;
  an exact match sets CurAction 4, otherwise CurAction 0x14, and zeroes CurPhaseAndPhaseInitialized to
  restart the action. The meaning of actions 4 and 0x14 in the owning object's action table is not visible
  from this function.
