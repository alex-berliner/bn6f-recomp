kind: function
status: confirmed
summary: Zero-fills the 0x100-byte work buffer at IWRAM 0x2000DC0 word-wise.
interface: void sub_80356EC(void); /* no inputs, no meaningful outputs */
details: 'Tiny wrapper that immediately tail-calls ZeroFillByWord with the address of the IWRAM

  buffer dword_2000DC0 and a size of 0x100 bytes, clearing the whole area to zero.

  The register contract''s listed input/output registers are just caller-side state flowing

  through the tail call; the function itself reads no arguments and touches no registers

  beyond r0/r1 setup. The buffer at 0x2000DC0 is likely a scratch/work area for some

  subsystem; nothing in this function reveals which, since it only performs the clear.

  Runs in Thumb, preserves r4-r7 by the standard prologue/epilogue, and preserves flags

  only in the sense that it returns straight to its caller after the call.

  '
