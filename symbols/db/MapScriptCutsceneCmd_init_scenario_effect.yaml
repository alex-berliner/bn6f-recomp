name: MapScriptCutsceneCmd_init_scenario_effect
address: '0x0803827A'
kind: function
status: confirmed
summary: Map-script cutscene command handler that reads a one-byte scenario-effect id from the script and initializes
  that scenario effect.
interface: u32 MapScriptCutsceneCmd_init_scenario_effect(u32 script_pos /* r7 */); returns advanced script pointer
  in r7; sets flags NZ from "mov r0,
details: 'Handler for one cutscene command in the map script interpreter. It sets r6=1 (a read-mode

  flag the other cutscene command handlers also pass), calls ReadMapScriptByte to fetch the

  single operand byte of the command — the scenario effect id, returned in r4 with the script

  pointer tracked in r7 — then calls initScenarioEffect_8003914 with that id in r0. The callee

  inherits the script pointer in r7 and leaves r2/r3/r4/r5/r7 behind; r2, r3 and r5 pass through

  unchanged. Finally the handler does "add r7, #2" to skip past the 2-byte command (opcode byte

  plus effect id) in the script and returns "mov r0, #1", which leaves N and Z clear so the

  dispatcher sees a nonzero/success result. Touches only the map-script cursor (r7) and the

  scenario-effect state via initScenarioEffect_8003914.

  '
