name: sub_80E1830
address: '0x080E1830'
kind: function
status: confirmed
summary: Dispatches a battle object's per-phase handler by jumping through a table indexed by CurPhase.
interface: void sub_80E1830(u32 phase, u32 handler); in r2-r5, lr preserved; out r5, r8-r12; clobbers nzcv, r0,
  r1, r2, r3, lr
details: 'Reads byte at "oBattleObject_CurPhase" offset of an object pointed to by r5, then uses

  that byte as an index into the 4-entry jump table at off_80E1844 to fetch a handler

  address. The handler is called via a computed "mov lr, pc; bx r1" sequence, so r2-r5

  (including the object pointer in r5) pass through to the handler, the callee is

  expected to return with r5 updated and r8-r12 as its outputs, and r4, r6, r7 must

  be preserved. On return, control goes straight back to sub_80E1830''s caller via the

  matching pop {r4,r6,r7,pc}. The four table entries resolve to sub_80E1854 (phase 0),

  timefreezeObjectRunFunction_80E1880 (phase 1), sub_80E18DA (phase 2), and

  sub_80E18F8 (phase 3); each is stored with the low bit set to switch via bx. The

  "0,0" word between the pop and the off_80E1840 pointer is just alignment padding.

  '
