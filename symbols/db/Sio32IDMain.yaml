name: Sio32IDMain
address: '0x0814CD70'
kind: function
status: confirmed
summary: 'Multiplayer-link 32-bit ID handshake state machine: drives SIO/RCNT/IME/IE around the SIO interrupt to
  bring up the link, accept the partner ID, or tear it down.'
interface: "void Sio32IDMain(void);\n/* inputs: lr (return address); r0..r3, r6, flags are not used.\n   outputs:\
  \ r0 = result (partner ID word, or 0 on busy/control paths),\n            r12 = the byte_2010CD1 stage byte captured\
  \ at entry.\n   clobbers: \"r1, r2, r3; preserved: r4, r5, r6, r7; flags clobbered. */\"\n"
details: "Operates on the IWRAM block at byte_2010CD0, a small SIO-multiplayer\ncontrol struct with offsets:\n \
  \ +0x0  byte   active flag (set to 1 on first run)\n  +0x1  byte   stage (0=init, 1=handshake, 2=done)\n  +0x2\
  \  halfword pending-send counter / guard\n  +0x4  halfword mode word (compared against 0x8001 \"full session\"\
  )\n  +0xa  halfword partner ID / partner slot\nStage 0 (cold init): mark active, set RCNT start (bit 0) on\nSIOControlRegister,\
  \ bracket a single IE bit-7 write with IME=0 then IME=1,\nadvance the stage byte to 1, then pulse bit 7 into the\
  \ low byte of\nSIOControlRegister (force a start). Returns 0.\nStage 1 (handshake poll): if a non-zero partner\
  \ ID has appeared, flip the\nstage byte to 2 and return the partner ID. If active==1 and pending==0,\njust bracket\
  \ another SIO bit-7 pulse. Otherwise (full session path), tear\ndown by masking IE bit 7, push IME=state, drive\
  \ RCNT 0->0x1000 (32-bit\nparent clock), ack the SIO IRQ (write 0x80 to the IRQ ack register), set\nRCNT 0x4080\
  \ (multiplayer control packet), then re-enable IE bit 7 inside a\nfresh IME bracket. Skips teardown if mode==0x8001\
  \ or pending!=0. Returns 0.\nOther stage: just return the cached partner ID word.\nUses r12 (preserved across\
  \ the function) as a snapshot of the entry-stage\nbyte, written into IME around every bracket (the byte happens\
  \ to be 0 on\nthe init path, 1 on the handshake path, etc., so it doubles as the IME\nvalue). r4/r5/r6/r7 are\
  \ reserved for SIO register pointers and small\nimmediates; r1/r2/r3 are freely clobbered in the read-modify-write\n\
  sequences.\n"
