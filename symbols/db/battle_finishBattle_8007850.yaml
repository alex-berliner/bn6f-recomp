open_questions:
- Exact meaning of eStruct203F7D8 byte 0 (the "unk01" field) — case 2 vs case 4 split probably encodes
  a battle
- outcome kind (success vs comm error vs forfeit), but the struct definition isn't in scope.
- Why Unk_20 is incremented to 0xB4 only on the default path; the timeout value may be related to the
  "fade
- out / game over" timer.
- The jump table off_8007940 entries (sub_800794C, battle_dispatchPhase_8007978, battle_initEntry_8007A0C)
- may indicate a normal exit path when the outcome byte is non-zero but lower bits are clear.
