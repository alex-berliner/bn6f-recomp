name: snakearm_pickAllianceRandomPanel
address: '0x08114A64'
kind: function
status: probable
summary: Fetches the alliance-dependent panel parameter for SnakeArm and uses it to pick a random panel,
  returning that panel's coords.
interface: (r0 = battle object ptr) -> r0 = panel word (x in low 3 bits / y in high bits, or current panel
  on failure); clobbers r4-r7, lr
details: Calls GetAllianceDependentPanelParamArgs with byte_8114C30 as the panel-effect parameter table;
  that returns the entry's param word and args pointer based on the battle object's alliance/team field.
  Those return values are then passed straight through to sub_8015C94, the random panel picker, which
  draws GetPositiveSignedRNG % count over the filtered panel list (x = low 3 bits, y = high nibble of
  the result) and falls back to the current panel if no candidates exist. So the alliance-dependent table
  entry supplies the picker's count/filter arguments, meaning ally/enemy teams get different panel selections
  for SnakeArm's effect.
