name: battle_spawnFieldHitbox
address: '0x080DFB56'
kind: function
status: probable
summary: Battle-object step that spawns a collision region on the field and then invokes a second spawn/queue
  helper with the same packed object id.
interface: (r5 = battle object ptr set by caller) -> spawns collision region with r0=2, r1=2, r2=0, r3=0,
  r4=0x405FF81, r6=obj->DamageAndStaminaDamageCounterDisabler field, r7=2; then calls sub_80E2FE8(0x405FF81,
  0, 0(r2 kept), 1); no return value used.
details: 'This looks like an object step/script callback: it never initializes r5 itself but reads a flag
  word from [r5, oBattleObject_DamageAndStaminaDamageCounterDisabler], so the caller must set r5 to the
  owning battle object. It calls object_spawnCollisionRegion with grid-ish arguments (2, 2, 0, 0) plus
  the constant 0x405FF81 passed in r4 and the object field in r6, suggesting the custom spawn ABI passes
  type/behavior data beyond r0-r3. It then calls sub_80E2FE8 with the same 0x405FF81 constant in r0, zeroes
  in r1/r2/r3, and 1 in r4, plausibly queuing a second entity or effect tied to the same id. The meaning
  of 0x405FF81 (packed type/element/flags rather than a pointer, since it is not in ROM/RAM address space)
  and the exact semantics of the r0-r3 pair are not visible from this function alone.'
