name: t3_0x51_80CE70C
address: '0x080CE70C'
kind: function
status: confirmed
summary: 'Per-frame tick for battle object type 0x51 (the snake-arm/serpent attack part): dispatches on the object''s
  CurState via a small jump table, then runs the paused-aware sprite update.'
interface: void battleObject_tickType51_snakeArm_80CE70C(void); // object ptr in r5, battle context in r10
details: "Standard battle-object tick whose object pointer arrives in r5 and whose battle context\npointer arrives\
  \ in r10. It reads the object's CurState byte at [r5,#oBattleObject_CurState]\nand uses it (unscaled, as a word\
  \ index) into the jump table at off_80CE724:\n  state 0 -> battleObject_initSnakeArm_80CE730 (spawns/starts the\
  \ snake-arm attack)\n  state 1 -> object_destroyStep_80CE782 (play-out destroy step)\n  state 2 -> object_genericDestroy\
  \ (free the object)\nEach handler is called with r0 = state byte, r1 = its own address (the code leaves the\n\
  handler pointer in r1), and the object still in r5; the returned r0 is ignored.\nAfter the state handler returns,\
  \ it tail-calls into the shared object_updateSpritePaused\nwhich consumes r10 itself, then returns to the caller\
  \ via the pushed lr.\nThe jump-table word for state 0 is battleObject_initSnakeArm_80CE730+1 (Thumb), so the\n\
  table stores handler addresses with the Thumb bit already set.\n"
