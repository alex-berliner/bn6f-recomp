name: battle_highlightFrontAreaPanels
address: '0x080DC6D2'
kind: function
status: probable
summary: Marks the battle object's own panel plus a fixed pattern of panels in front of it (two columns
  wide, three tall) as highlighted.
interface: (r5 = battle object pointer, set by caller) -> r0 = destroyed; highlights panels via object_highlightPanel
details: Gets the object's facing multiplier from object_getFrontDirection (+1/-1, based on alliance and
  DirectionFlip), then walks a table of signed (dx,dy) pairs at byte_80DC6FC pointed to by off_80DC708.
  For each pair it computes panelX + dx*direction and panelY + dy and calls object_highlightPanel, which
  sets the panel flag byte (offset 1) to 1. The table is (0,0),(1,0),(2,0),(2,1),(2,-1), terminated by
  a pair whose first byte is 0x7F (ldrsb, signed compare). So it highlights the object's panel, the next
  two columns straight ahead, and the two panels diagonally ahead at column 2 — a typical attack telegraph
  / area-marking shape. Note r5 is not saved or set here, so the object pointer must come from the caller.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection then mul r0, r4 applies the ±1 facing multiplier to the dx of each
    entry; ldrsb r0,[r6]; cmp #0x7F; beq terminates the (dx,dy) pair table at byte_80DC6FC; add r0 with
    [r5,#oBattleObject_PanelX] and add r1 with [r5,#oBattleObject_PanelY] build target panel coords from
    the object''s position; bl object_highlightPanel per pair marks each panel in the pattern; table bytes
    0,0,1,0,2,0,2,1,2,0xFF,0x7F describe the highlighted shape (own panel, 2 columns ahead, ±1 row at
    column 2)'
