name: chatbox_uncompMapTextArchives_803FD3C
address: '0x0803FD3C'
kind: function
status: confirmed
summary: LZ77-decompresses the current map's compressed text archive (entry 1) into the shared decompression buffer.
interface: void chatbox_uncompMapTextArchive(void) /* always returns r0 = 0; r4-r7 preserved */
details: 'Takes no arguments. Calls chatbox_selectCompTextByMap_8040730 with idx = 1 to obtain a pointer to the
  compressed text archive selected for the current map, then passes that pointer as the LZ77 source to SWI_LZ77UnCompReadNormalWrite8bit,
  expanding it byte-by-byte into the fixed shared buffer at eDecompressionBuf2034A00. Always returns 0 in r0. The
  decompressed result lives in the global buffer, so callers must consume it (e.g. copy to VRAM or parse chat strings)
  before the next decompression overwrites it. r4-r7 are pushed/popped purely for ABI preservation; the function
  itself uses none of them.

  '
