name: oAIState_StepCounter
address: '0x6'
kind: struct-field
status: probable
summary: Per-turn AI substate counter incremented each step until reaching a phase threshold, then reset.
details: 'Across all 87 accesses the field is consistently treated as a small monotonic counter: loaded
  with `ldrb`, compared against a constant cap (1, 2, 3, or 4 depending on handler) via `cmp r0, #N /
  bge/bLt`, incremented via `add r0, #1 / strb r0`, or cleared via `mov r0, #0 / strb r0`. It advances
  under RNG-gated conditions (e.g. `GetPositiveSignedRNG & 0xf < threshold`) and resets when the cap is
  reached or when the parent state transitions, which is exactly the access shape of a phase/step counter
  nested under Unk_05.'
