    dispatch pattern - Function name `sub_814F2F0` lives in `asm/libs.s` (a library, not main game code) and is
    called by both MPlayMain and ply_note - exactly how m4a-lib per-voice handlers are wired - First branch: `ldrb
    r0, [r2]; mov r0,#1; and r0,r1; beq` is a "if (flags & 1) envelope" check; the multiplier `mul r0,r1; lsr r3,r0,#5`
    reads byte[0x12]*byte[0x13] which is "envelope step * envelope speed" - Clamp pattern `mov r0,#0x80; neg r0,r0;
    cmp r1,r0; bge; mov r1,r0; ... mov r1,#0x7f; ble; mov r1,#0x7f` is a saturate-to-sbyte - `and r0, r3, #0xfa;
    strb r0, [r2]` clears exactly bits 0 and 1 of the flag byte, matching a "consumed this tick" envelope/LFO handshake
    - r1 in snapshots points at distinct channel slots (02007ee8, 02007f38, 02007f88, 02007fd8 spaced 0x50 apart)
    consistent with an array of SoundChannel structs'
