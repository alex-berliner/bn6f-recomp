address: '0x0814F2F0'
kind: function
previous_names: []
status: hypothesis
summary: m4a sound channel envelope/LFO mixer step used by the music player (likely an xcmd/vcmd handler dispatching
  on voice flags)
interface: (r1 = SoundChannel* voice state) -> r0 = saved LR (tail-call return)
details: "Saves lr, copies r1 (channel struct ptr) into r2. Tests byte[0] flag 0x01 (\"envelope on\"). If set, reads\
  \ envelope increments at 0x12 (u8) and 0x13 (u8), multiplies them (mul), shifts right by 5 to get a magnitude\
  \ r3. Mode byte at 0x18 selects pan modifier source: mode 1 reads signed byte 0x16, adds 0x80 (bias to 0..255\
  \ range), multiplies by magnitude and >>7 to scale r3. Then pan = (signed[0x14] << 1) + signed[0x15]; mode 2 additionally\
  \ adds signed[0x16]. Pan is clamped to [-0x80, 0x7F]. Computes left = ((pan + 0x80) * magnitude) >> 8, right =\
  \ ((0x7F - pan) * magnitude) >> 8, stores at 0x10/0x11.\n\n  Then tests byte[0] flag 0x04 (\"LFO on\"). If set,\
  \ reads ldrsb[0x0e] * byte[0x0f] + ldrsb[0x0c], adds lsl<<2, then ldrsb[0x0a]<<8 + ldrsb[0x0b]<<8 + byte[0x0d].\
  \ Mode 0: adds signed[0x16]<<4. Stores (value>>8) at 0x08 and low byte at 0x09 (a u16 LFO target).\n\n  Finally\
  \ masks byte[0] with 0xfa (clears flags 0x01 and 0x04) and returns via `pop {r4}; pop {r0}; bx r0` (tail-call\
  \ to caller's lr; the `push {r4,lr}; ... pop {r4}; pop {r0}` pattern is how m4a track handlers trampoline).\n\n\
  \  Two callers: MPlayMain (sequencer tick) and ply_note (single note trigger) - both standard m4a-lib dispatch\
  \ paths.\n"
