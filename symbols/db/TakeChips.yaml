open_questions:
- The status is duplicated into both r0 and r3; the original ARM/Thumb routine would normally have to honour an
  "r0 = r3" push/pop pair, which looks deliberate but unusual.
- empty_value from the lookup (returned in r3 by getOffsetToQuantityOfChipCodeMaybe_8021c7c) is propagated as the
  count when the owned count reaches zero; it is unclear what that sentinel represents in the pack data structure
  (likely the "slot now empty" code).
- The push/pop {r2} around the lookup indicates the author considered r2 clobberable by the helper but still wanted
  to expose the original amount to callers; this is fragile if the helper ever stops preserving r2 across other
  call sites.
