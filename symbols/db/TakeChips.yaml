name: TakeChips
address: '0x08021B92'
kind: function
status: confirmed
summary: Removes a requested number of copies of a chip from the player's chip pack and reports the resulting owned
  count (or a sentinel "empty" value when it empties out) together with a status code.
interface: "u32 takeChipsFromPack_8021B92(u16 chip_idx /* r0 */, u8 chip_code /* r1 */,\n                      \
  \        u8 amount /* r2 */)\n  /* r0 returns STATUS (0 = taken, 1 = none owned, 2 = not enough) */\n  /* r1 returns\
  \ new owned count, or empty_value from lookup once 0 */\n  /* r2 returns amount echoed unchanged */\n  /* r3 returns\
  \ STATUS again */\n  /* clobbers: r0, NZCV */\n  /* preserved: r2 */\n"
