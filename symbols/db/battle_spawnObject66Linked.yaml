name: battle_spawnObject66Linked
address: '0x080D1442'
kind: function
status: probable
summary: Spawns battle object 0x66 at a given panel/element, inheriting alliance from a source object
  and linking it to another object.
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = source battle object, r6 = damage/stamina field
  value, r7 = related object ptr) -> r0 = new object ptr (or source ptr on spawn failure); Z from spawn
  success
details: Saves r0-r2/r5, calls object_spawnType3 with id 0x66 (other args already in place), then pops
  the saved values so r1/r2/r3 hold the original r0/r1/r2 and r5 the source object. On spawn failure (Z
  set) it returns immediately with r0 = the source object pointer, otherwise r0 = the new object. It writes
  oBattleObject_Element (from r3), PanelX/PanelY (from r1/r2), DamageAndStaminaDamageCounterDisabler (from
  caller's r6), copies AllianceAndDirectionFlip from the source object at r5, stores caller's r7 into
  RelatedObject1Ptr, and ORs 0x10 into oObjectHeader_Flags. The r6/r7 inputs mean callers must pre-load
  them, likely from the source object or its own state.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0,#0x66 then bl object_spawnType3 — the spawned entity is battle object type 3 id 0x66;
    pop {r1-r3,r5} then strb r3/r1/r2 to Element/PanelX/PanelY — spawn coordinates and element come from
    the caller''s first three args; ldrh r1,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh back into
    new object — alliance/direction inherited from the passed source object; orr with #0x10 into oObjectHeader_Flags
    — marks the new object with flag 0x10 after setup; called from sub_80EDA0E and sub_811219C on the
    battlesweep and beastsp routes — used by beast-related battle attack spawning'
