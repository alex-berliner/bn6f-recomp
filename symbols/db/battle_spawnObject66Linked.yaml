name: battle_spawnObject66Linked
address: '0x080D1442'
kind: function
status: confirmed
summary: Spawns battle object type 0x66 (via object_spawnType3), fills it in from the caller's arguments and the
  owner object, marks it linked, and returns the new object pointer.
interface: void battle_spawnObject66Linked(u32 panelX /*r0*/, u32 panelY /*r1*/, u32 element /*r2*/, u32 spawnArg3
  /*r3*/, u32 spawnArg4 /*r4*/, BattleObject* owner /*r5*/); r6/r7 (damage data, related-object ptr) forwarded through
  object_spawnType3; returns r5 = new object ptr (or r5 unchanged on failure), r1 = new flag byte | 0x10 (or entry
  r0 on failure), r2 = 0x10 (or entry r1), r3 = entry r2; clobbers r0, NZCV
details: 'Allocates a battle object of id 0x66 via object_spawnType3 (r0=0x66, with the caller''s r1-r4 forwarded
  as spawn parameters). The new object pointer comes back in r5 (NULL if the spawn failed). On success it copies:
  Element (byte) <- entry r2, PanelX <- entry r0, PanelY <- entry r1, DamageAndStaminaDamageCounterDisabler <- r6
  as passed through the spawner, AllianceAndDirectionFlip (halfword) copied from the owner object (r5), RelatedObject1Ptr
  <- r7 as passed through the spawner. Then it ORs 0x10 into the new object''s oObjectHeader_Flags, apparently the
  "linked to owner" flag. Quirk: the wrapper pushes {r0-r2,r5} before the spawn call and pops {r1-r3,r5} after it,
  so the popped values land shifted one slot (r1<-old r0, r2<-old r1, r3<-old r2) — which is why the field sources
  are shifted relative to the register names and why the caller sees leftover values in r1-r3 (r1 = updated flag
  byte, r2 = 0x10 mask on success). On spawn failure the new-object pointer (popped into r5) is 0 and the routine
  just returns, leaving the caller''s registers as the shifted stack values. The identity of object type 0x66 and
  who calls this helper still need tracing to name the spawned object precisely.'
