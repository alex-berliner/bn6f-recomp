name: ai_spawnAttackPanelPair
address: '0x080F742E'
kind: function
status: probable
summary: AI attack helper that spawns an attack (via sub_80F74A8) on two panels taken from a per-attack table, mirrored
  and shifted toward the enemy side.
interface: (r5 = battle object, r7 = AI attack-vars struct) -> r0 = return of sub_80F74A8; no flags used
details: Indexes table byte_80F7478 by oAIAttackVars_AttackBoost2*6 (8 rows of 6 bytes, so AttackBoost2 acts as
  an attack/variant selector). It loops twice (r4 = 0,1), each time reading a 3-byte triplet (column, row, third
  byte). If the object's oBattleObject_Alliance is nonzero (enemy side), the column is mirrored as 7-col, then -3*object_getFrontDirection()
  shifts the column 3 panels toward the front/opponent. Each triplet plus the loop index (r2) and the third byte
  (r3) is passed to sub_80F74A8, presumably to spawn/place the attack entity on that panel; all third bytes in the
  table are 0.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackBoost2]; mul by 6; add off_80F7474 selects a 6-byte row of byte_80F7478
    per attack id; tst r2,r2 on oBattleObject_Alliance with 7-col mirroring shows side-aware panel coordinates;
    bl object_getFrontDirection then neg/mul #3 shifts the column 3 panels by facing direction; loop runs exactly
    twice (cmp r4,#2) passing r2=r4 and r3=triplet[2] to sub_80F74A8; byte_80F7478 rows like 01 01 00,01 03 00 fit
    panel col/row pairs with a constant 0 third field'
