name: camera_initEndFromLinkState
address: '0x0812C11C'
kind: function
status: probable
summary: Refreshes the camera's end-state from eLinkState and writes a fixed end-camera pair (0x30 or
  0x48, then 0x4321) plus clears two fields of the caller's struct.
interface: (no args read; r5 = caller-provided struct with flag byte at +0x12, word at +0x40, halfword
  at +0x2E) -> r0 = eCamera end-struct base (from callee), clobbered; flags not meaningful
details: 'It first calls camera_copyLinkStateToEnd, which copies eLinkState+0x1C/+0x0A into the eCamera
  end struct at eCamera.unk_84+4/+2 and returns its base in r0. It then tests the byte at r5+0x12: nonzero
  picks constant 0x30, zero picks 0x48, and the value is stored as a halfword at end+0x8; constant 0x4321
  is stored at end+0xA. Finally it zeroes the word at r5+0x40 and the halfword at r5+0x2E. The pattern
  suggests programming the camera''s transition target (end position/mode) after a link-state change and
  clearing some pending-state fields, but the identity of r5''s struct and the meaning of 0x30/0x48 vs
  0x4321 are not shown by the code. With no known callers, the surrounding context cannot confirm this
  reading.'
