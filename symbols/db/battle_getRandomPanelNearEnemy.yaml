name: battle_getRandomPanelNearEnemy
address: '0x0810AD18'
kind: function
status: probable
summary: Picks a random enemy of the given battle object's team and returns packed panel coordinates of
  a random panel near it.
interface: (r5 = battle object; buffer on stack) -> r0 = packed panel coords (panelX<<4 | panelY&7) or
  failure value; flags from final masking
details: Collects the battle objects returned by object_getEnemyByNameRange (ID range 1..0xAE, alliance
  filter = r5's oBattleObject_Alliance) into a pointer list at sp. For each listed object that is not
  r5 itself, it looks up the alliance-dependent panel param entry (table byte_810AE08, indexed by that
  object's alliance) using its PanelX/PanelY, then calls GetRandomRelativePanelFiltered with r4=8 to get
  a random reachable panel near it; successful results are packed as (r1<<4)|r0 and queued in a byte array
  at sp+0x10, with the count at sp+0x1C. The inner loop uses push/pop of r3/r6 to preserve the list cursor
  and counter across the calls that clobber them. If any candidates were queued, GetPositiveSignedRNG
  + svc 6 (DivRem by count) picks one entry at random, and the low nibble's low 3 bits (panelY) and high
  nibble (panelX) are unpacked into r0/r1, with the packed byte ending in r0. If there are no enemies
  or no valid panels, it returns without queuing (r0 = 0/enemy-lookup result).
