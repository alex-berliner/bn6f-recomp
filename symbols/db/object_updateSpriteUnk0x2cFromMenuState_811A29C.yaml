summary: Per-frame object update pass that adjusts the object's sprite 0x2c flag bits from the active
  menu state and a per-index byte in byte_8124B1C.
interface: (r5 = Toolkit* or Object-like record) -> void ; may write r0..r7 (r0 contains intermediate
  flag word reused by callees)
details: "The function is called from object_runUpdateDispatch_811A190 as one of the shared update passes\
  \ after the type-specific handler.\n  1. Calls menu_getTableEntryForStateIndex_811A268 which packs the\
  \ menu state into r0 (pointer/?), r1, r2.\n  2. If r0 == 0 OR (r2 != 0 with r1 == 0) ... actually the\
  \ branch logic: if r0 != 0 AND (r2 == 0 AND r1 == 0) is FALSE → falls to loc_811A2CA (the \"clear most\
  \ bits, set 0x3e\" branch). Otherwise loc_811A2AE is taken when at least one of r0, r1, r2 is non-zero.\n\
  \  3. In the loc_811A2AE path: takes a byte from byte_8124B1C indexed by (r0 - 0x140), builds a mask\
  \ using that nibble with 0x7E ORed and 0x40 shifted by the byte, and stores into sprite Unk_0x2c via\
  \ sprite_setUnk0x2c. So bit 0x3e of sprite+0x2c is forced on and one other bit (selected by byte_8124B1C)\
  \ is forced off.\n  4. In the loc_811A2CA path: loads sprite Unk_0x2c via sprite_getUnk0x2c, masks out\
  \ 0x7E, sets 0x3E, and writes back via sprite_setUnk0x2c — i.e. \"no menu: clear bits 1..6 of the flag\
  \ byte, set bits 1..5\".\n  Net effect: this function maintains the bits 0x3E/0x7E of an object's sprite\
  \ state word based on the active menu state — used to drive a frame-level sprite flag (likely visibility/animation\
  \ flag for menu-affected objects during battle/custom screens).\n"
