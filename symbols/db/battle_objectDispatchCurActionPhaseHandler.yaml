name: battle_objectDispatchCurActionPhaseHandler
address: '0x080BB66A'
kind: function
status: probable
summary: Dispatches the phase handler routine matching a battle object's current action state.
interface: (r5 = battle object struct) -> jumps to handler from off_80BB67C[oBattleObject_CurAction];
  no direct return value
details: Reads oBattleObject_CurAction from the battle object in r5 and uses it as an index into the jump
  table off_80BB67C, then calls the selected handler with lr=pc so the handler returns to this function's
  pop {pc}. The six entries are all per-action phase handlers (hole check, three unnamed subs, play-anim-delay,
  and one more), so this function is the master phase dispatcher stepping one object through its action
  states.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0] indexes the table by the object's
    current action; mov lr, pc; bx r1 calls the selected handler and returns here after; table entries
    are named *PhaseHandler functions (battle_objectHoleCheckPhaseHandler, battle_objectPlayAnimDelayPhaseHandler);
    r5 is not set inside the function, so it operates on a battle object struct passed by the caller
  refs:
  - bn6f/asm/asm31.s:7395
  reproduce: python3 tools/asmcat.py 0x080BB66A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
