name: battle_phaseDispatchHandler
address: '0x080BE878'
kind: function
status: probable
summary: Runs the current phase's handler for a battle object, dispatching through a jump table indexed
  by oBattleObject_CurPhase.
interface: (r5 = battle object) -> no return value; jumps to phase handler via table off_80BE88C
details: 'Loads the object''s CurPhase byte, indexes the 5-entry table off_80BE88C with it, and tail-calls
  the handler with lr set so the handler returns straight to sub_80BE878''s caller. Known handlers include
  battle_setPhase4ResetTimers, battle_phaseFollowScriptedPanelPath, and three sub_80BE95x-A10 routines.
  The caller sub_80BE834 is the object''s per-frame update: when oBattleObject_Param1 is 0 it calls this
  phase dispatcher, otherwise it dispatches by CurAction through off_80BE854 instead, so this object has
  two update modes (phase-scripted vs. action-driven).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80BE878: ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0] with table off_80BE88C; bx
    via mov lr,pc — classic phase dispatch; off_80BE88C entries are battle_setPhase4ResetTimers and battle_phaseFollowScriptedPanelPath,
    matching existing battle phase-handler naming; caller sub_80BE834: when Param1==0 it calls sub_80BE878,
    else dispatches on CurAction via off_80BE854, showing a per-frame update split into phase vs action
    paths'
