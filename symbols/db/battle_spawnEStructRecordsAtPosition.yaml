name: battle_spawnEStructRecordsAtPosition
address: '0x081302D0'
kind: function
status: probable
summary: Spawns eStruct records from a caller-supplied table into a given slot and, if one was created,
  positions it on the battle field.
interface: (r0 = eStruct spawn table ptr, r1 = eStructArr2008450 slot index, r2 = coordinate/position
  value) -> r0 = undefined; flags from getStructFrom2008450's in-use byte
details: Passes r0 straight to the table-driven eStruct spawner, which creates 0x58-byte type-9 records
  from a 0xFF-terminated (id, slot, param) table. It then queries the caller-chosen slot of eStructArr2008450
  via getStructFrom2008450; if the entry's in-use/status byte is nonzero (something spawned), it calls
  sprite_setCoordinates with the caller's r2 as r0 and a hardcoded 0x44 as r1 to place the object. If
  the slot byte is zero, the coordinate call is skipped entirely. The struct pointer returned in r1 by
  getStructFrom2008450 is saved to r5 but not otherwise used here, suggesting sprite_setCoordinates works
  on data reachable from the spawned record itself. The two callers (sub_8130290, sub_81302B0) are thin
  wrappers that presumably fix the table and slot.
