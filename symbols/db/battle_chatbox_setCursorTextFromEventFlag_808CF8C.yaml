name: battle_chatbox_setCursorTextFromEventFlag_808CF8C
address: '0x0808CF8C'
kind: function
status: confirmed
summary: If event flag EVENT_9D9 is set, copies a text id from the caller's object into the battle chatbox's cursor-text
  field and plays sound 0x122; returns whether it did so.
interface: bool battle_chatbox_setCursorTextFromEventFlag(void *textSource /* r5 */, struct Toolkit *toolkit /*
  r10 */); result also carried out in N/Z
details: 'r5 points at an object whose halfword at +6 holds a text id; r10 is the toolkit, whose oToolkit_ChatboxPtr
  field points at the battle chatbox. First tests event flag EVENT_9D9 via TestEventFlagFromImmediate (flag id passed
  as page/index pair in r0/r1 via movflag); if the flag is clear the function returns 0 (Z set) without touching
  anything. If set, the halfword at [r5+6] is written as a word to chatbox+0x4C (the cursor text field, offset loaded
  as 0x4C into r2 and reused by the callee contract), then PlaySoundEffect(0x122) plays a cursor/text sound, and
  the function returns 1 (NZ clear). Quirk: the 0/1 result is computed in r4 but the epilogue pops the saved entry
  value back into r4, so r4 is effectively preserved and only the N/Z flags carry the result out; r2/r3/r6 on the
  taken path are whatever PlaySoundEffect leaves behind.'
