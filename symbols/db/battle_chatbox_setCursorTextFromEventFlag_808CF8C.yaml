- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl TestEventFlagFromImmediate` immediately after `movflag EVENT_9D9` is the explicit branch
    gate at 0x0808cf94. - Chatbox pointer is loaded from the toolkit''s `oToolkit_ChatboxPtr` (0x2C) field
    per the `toolkit_struct` definition. - Writing `ldrh r0, [r5,#6]` to `[chatbox+0x4C]` overwrites an
    as-yet unnamed chatbox word with the battle object''s `BButton`/`Param3` byte pair. - SFX id 0x122
    is read from `dword_808CFB4` (.word 0x122) and passed to the M4A wrapper at 0x080005cc. - Function
    returns a bool (`mov r4,#1` on success, `mov r4,#0` initially), and that bool is the only output the
    caller propagates.'
