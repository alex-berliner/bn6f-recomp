name: entity_resetTimerAndCounter_80E5410
address: '0x080E5410'
kind: function
status: confirmed
summary: Initializes two fields of an entity struct, setting the field at +8 to 8 and clearing the counter
  at +0x60.
interface: u32 entity_resetTimerAndCounter(u32 entity) // r0=entity ptr, returns 0 in r1; clobbers N/Z
  flags
details: 'Takes a pointer (or entity index/base) in r0 and writes two words into the structure it points
  at: stores 8 at offset +8 and stores 0 at offset +0x60. The value 0 written to +0x60 is the last value
  in r1, so the function returns 0 in r1 as a side effect of the store. No other registers are read or
  written; only the N/Z flags are clobbered by the immediate loads. Given the offsets and the "8 then
  0" pattern, this looks like a small state-reset helper for an entity/object: likely setting a timer/timeout
  or counter of 8 units at +8 and zeroing a longer-lived counter or charge/tick field at +0x60. Callers
  presumably use it when spawning or respawning an entity or entering a state that needs its timing fields
  restarted.

  '
