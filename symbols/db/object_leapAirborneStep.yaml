name: object_leapAirborneStep
address: '0x080D1394'
kind: function
status: confirmed
summary: 'Advance a leaping/airborne battle object one frame: integrate velocity, apply gravity on Z, and land onto
  the panel grid when the airborne timer expires'
interface: void object_leapAirborneStep(u32 r5 /*battle object ptr*/) -> r1 /*Z velocity if still airborne; multiplier
  or collision-region result on landing*/; clobbers nzcv r0 r2 r3 lr; preserves r4 r6
details: 'Reads oBattleObject_X/Y/Z and their corresponding velocity fields, adds velocity to position (fixed-point
  3D integration). If oBattleObject_Param4 (leap flag) is nonzero, subtracts 0x8000 from Z velocity each frame to
  simulate gravity. Decrements oBattleObject_Timer2 (16-bit airborne countdown). While timer > 0 the object stays
  airborne and r1 holds the (post-gravity) Z velocity. On timer expiry: calls object_setCoordinatesFromPanels and
  object_updateCollisionPanels to snap the object to the panel grid, zeroes oBattleObject_Z, picks collision-region
  size based on oBattleObject_Param1 (1 vs 0x18 for wide objects), sets oBattleObject_CurAction to 4 (idle), and
  clears oBattleObject_CurPhaseAndPhaseInitialized. If the leap flag (Param4) is set, also computes oBattleObject_XVelocity
  as object_getFrontDirection() * 0x30000 to give the object forward momentum on landing. The constant dword_80D1504
  = 0xFFFF8000 is the per-frame gravity delta; dword_80D1508 = 0x30000 is the post-land forward speed.'
