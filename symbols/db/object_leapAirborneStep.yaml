name: object_leapAirborneStep
address: '0x080D1394'
kind: function
status: probable
summary: 'Airborne phase of a leap attack: integrates velocities each frame with optional gravity, then
  on timer expiry snaps the object to its landing panel and switches to the landed action.'
interface: () -> void; r5 = battle object pointer, no args or return; flags not meaningful
details: Adds oBattleObject_XVelocity/YVelocity/ZVelocity into X/Y/Z each call. If Param4 != 0, subtracts
  0x8000 from ZVelocity every frame (gravity). Timer2 (16-bit) counts down airtime; on reaching 0 it calls
  object_setCoordinatesFromPanels and object_updateCollisionPanels to re-derive pixel position and collision
  from the panel grid, stores Z = 0, selects collision region 1 or 0x18 via object_setCollisionRegion
  depending on Param1, sets CurAction = 4 and clears CurPhaseAndPhaseInitialized. If Param4 != 0 it then
  calls object_getFrontDirection and sets XVelocity = direction * 0x30000, giving a forward slide after
  touchdown. Runs with the object in r5, so it is used as a per-frame state handler.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: X/Y/Z += respective Velocity fields each call, then ''add r0,r1,dword_80D1504(=0xffff8000)''
    stored back to ZVelocity when Param4 != 0 (gravity); asm: ldrh Timer2 / sub #1 / bne skip — landing
    sequence only fires when the airtime counter hits zero; asm: on expiry calls object_setCoordinatesFromPanels
    and object_updateCollisionPanels, then ''mov r0,#4; strb CurAction'' and clears CurPhaseAndPhaseInitialized;
    asm: mov r0,#1 / cmp Param1 / mov r0,#0x18 before bl object_setCollisionRegion — region depends on
    Param1; asm: tail calls object_getFrontDirection, multiplies by dword_80D1508(=0x30000) into XVelocity
    when Param4 != 0 (post-landing forward drift)'
