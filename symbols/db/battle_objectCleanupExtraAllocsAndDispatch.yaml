  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The phase-0 cleanup of three slots and the unconditional tail-dispatch to battle_objectUpdateDispatchPhase_80165C2
