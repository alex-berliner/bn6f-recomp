name: battle_objectCleanupExtraAllocsAndDispatch
address: '0x08112A1E'
kind: function
status: probable
summary: Battle object handler that, on phase 0, frees up to three non-null pointers in the object's extra
  vars via sub_80D1EE8, then tail-calls battle_objectUpdateDispatchPhase_80165C2 to continue per-frame
  phase dispatch.
interface: (r5 = battle object ptr, lr) -> void; runs battle_objectUpdateDispatchPhase_80165C2 as tail
  work
details: This is one of the object update-handler routines (object in r5). It reads oBattleObject_CurPhase;
  when the phase is 0, it checks oBattleObject_ExtraVars+8, +0xC and +0x10 and calls sub_80D1EE8 on each
  one that is nonzero — three separate pointer slots, each guarded independently. The guarded-free pattern
  suggests these are dynamically allocated resources (sprites/effects/heap blocks) attached to the object
  that must be released before phase-0 processing continues. Unconditionally, it then calls battle_objectUpdateDispatchPhase_80165C2,
  the standard per-frame phase dispatcher, so the routine is a wrapper handler adding cleanup to normal
  phase dispatch. The exact resource type freed depends on sub_80D1EE8, which is unexamined.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; cmp r0,#0; bne loc_8112A44 — cleanup only on phase 0;
    three ldr [r5,#oBattleObject_ExtraVars+8/0xC/0x10] + nonzero check + bl sub_80D1EE8 — guarded release
    of three attached pointers; bl battle_objectUpdateDispatchPhase_80165C2 — tail work is the standard
    object phase dispatcher, so r5 is a battle object; recorded route 'beastsp' executes it — it is live
    game code on a battle-object path
  refs:
