- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; mov r1,#5; mul; add off byte_80D9A20 → variant table indexed
    by Param1 with 5-byte entries; ldrb r0,[r0,#4] followed by bl sprite_setPalette → entry byte 4 is
    the palette; bl battleObject_initSpriteAndCollision_8011504 with constants 0x1001052/0xa050300, failure
    path bl object_freeMemory; str CUR_STATE_UPDATE,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized];
