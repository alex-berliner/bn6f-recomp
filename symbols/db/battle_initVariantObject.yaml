name: battle_initVariantObject
address: '0x080D9A74'
kind: function
status: probable
summary: 'Initializes a battle object: picks one of several 5-byte variants by Param1, loads its sprite/collision,
  applies the variant''s palette, then hands off to its per-frame update handler.'
interface: (r0 = oBattleObject_Param1 byte of object in r5) -> r0 = 1 on success / freed object on failure;
  sets object state to CUR_STATE_UPDATE
details: Uses r5 as the battle-object pointer (caller must set it). It reads Param1, multiplies by 5,
  and indexes table byte_80D9A20, storing the entry pointer in oBattleObject_ExtraVars; entry byte 4 is
  later passed to sprite_setPalette, so entries are 5-byte records ending in a palette index. It then
  calls battleObject_initSpriteAndCollision with fixed sprite data 0x1001052 / 0xa050300; on failure it
  frees the object and returns. On success it runs sub_801A146, clears the object's collision region,
  refreshes collision data, applies the variant palette, sets flag bit 2 in oObjectHeader_Flags, stores
  CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized, and calls the state handler
  sub_80D9ABA.
