name: sprite_updateSlideInCutscene
address: '0x0809AD0C'
kind: function
status: probable
summary: 'Per-frame cutscene step: when EVENT_F5 is set, decrements a byte counter at [r5,#4] and slides
  a 3-id sprite group leftward, then unconditionally ticks entity handlers and eStruct sprite pipeline,
  returning 1 if chatbox flag bit 0x80 is set.'
interface: (r5 = struct with u8 position counter at +4) -> r0 = 1 if chatbox flag 0x80 set else 0; flags
  destroyed by calls
details: Tests EVENT_F5; when set, it loads the byte at [r5,#4], subtracts 0x10 and clamps to 0 before
  storing it back, then calls the 3-consecutive-id sprite position setter with the clamped value minus
  0x30 (0xFFFFFFD0) and 0x58/0x as the other arguments — i.e. the counter drives a stepped slide of a
  small sprite group (fits the Beast Spirit transformation sprites of the beastsp route). It then unconditionally
  runs entity_runAllUpdateHandlers and battle_updateEStructSprites so all 15 eStruct records and their
  sprites advance a frame. Finally it reads the chatbox/cutscene event-flag word bit 0x80 and returns
  1 when that bit is set, 0 otherwise, which callers can use to know whether the scripted sequence is
  still active. r5 is callee-saved and never set here, so the counter struct is supplied by the caller.
  The exact meaning of the 0x58 and 0x arguments to sprite_setPositionForIdRange3 (id base vs y) isn't
  pinned down from this body alone.
