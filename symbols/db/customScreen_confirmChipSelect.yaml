name: customScreen_confirmChipSelect
address: '0x08028D6C'
kind: function
status: probable
summary: 'Custom screen chip-selection handler: commits the chip under the cursor as the next of up to
  5 selected chips, redraws its slot, and plays the select sound; bounces with an error sound if 5 chips
  are already selected.'
interface: (r4 = custom-screen state ptr, r5 = oS20364C0 cust-menu object) -> r0 = 0 if chip accepted,
  1 if selection full; no meaningful flags
details: 'Reads oS20364C0_NumChipsSelected; if >= 5 (or state byte [r4,#7] nonzero) it plays SOUND_CANT_JACK_IN
  and returns 1. Otherwise it increments NumChipsSelected, stores the ChipSelectCursorPos at offset 0x48+index
  (the selected-chips array), calls sub_802A034 on the chip id from [r4,#8] (likely fetches chip data
  for the slot), then redraws the slot: sprite_CopyObjTilesToVramSlot with slot id [r5,#8]-1 and customScreen_redrawChipSlot(row=[r5,#8]-1,
  r1=1, r2=0) against the IWRAM tile buffer at 0x2035000. It plays SOUND_MENU_SELECT, sets oS20364C0_JumpOffset01=0x48
  to trigger battleObject_chipSelectAnimTick via custMenuMainMaybe_8026A88, clears oS20364C0_StateHandled,
  and returns 0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/cmp #5 on oS20364C0_NumChipsSelected with bge error path enforces the 5-chip selection
    cap of the custom screen; add r0,#0x48 then strb ChipSelectCursorPos writes the cursor index into
    the per-slot selected-chip array at 0x48; calls customScreen_redrawChipSlot_8029CD4 and sprite_CopyObjTilesToVramSlot_80281D4
    with [r5,#8]-1 to draw the newly selected chip''s slot; sets oS20364C0_JumpOffset01=0x48 which the
    project notes triggers battleObject_chipSelectAnimTick via custMenuMainMaybe_8026A88; PlaySoundEffect(SOUND_MENU_SELECT)
    on success vs SOUND_CANT_JACK_IN on refusal matches select/deny UI feedback'
