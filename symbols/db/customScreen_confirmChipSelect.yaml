name: customScreen_confirmChipSelect
address: '0x08028D6C'
kind: function
status: confirmed
summary: Confirm the chip under the selection cursor, append it to the battle chip list (max 5), redraw its slot,
  and arm the jettison animation tick
interface: u32 customScreen_confirmChipSelect(u32 r2, u32 r4 /* toolkit struct ptr */, u32 r5 /* selection state
  block 0x20364C0 */, u32 r10) -> r0 (0=added, 1=rejected); clobbers r1 r2 r3; preserves r4 r5 r6 r7 r10; clobbers
  NZCV lr
details: 'Guarded by two rejection paths: (a) r4+7 is a pending-animation flag on the toolkit object – if nonzero
  the cursor chip cannot be taken yet (plays SOUND_CANT_JACK_IN, returns 1); (b) the 5-chip cap at r5[0S20364C0_NumChipsSelected].
  On accept it increments the count, writes the cursor position (r5[0S20364C0_ChipSelectCursorPos]) into the slot
  array at byte offset 0x48+index, loads the 16-bit chip ID via the pointer at r4+8, calls sub_802A034 to register
  the selection in internal structures (mutating r5/r6), copies the chip tile art into its VRAM sprite slot via
  sprite_CopyObjTilesToVramSlot, redraws the visible slot via customScreen_redrawChipSlot, and plays SOUND_MENU_SELECT.
  Finally it arms the per-frame chip-select animation by writing 0x48 into r5[0S20364C0_JumpOffset01] (the handler
  dispatch offset that triggers battleObject_chipSelectAnimTick) and zeroing r5[0S20364C0_StateHandled] so the main
  loop will process the new state.'
