name: battle_updateSceneFrame
address: '0x08124ED4'
kind: function
status: probable
summary: 'Per-frame battle-scene update: re-inits the chip-sprite slot buffer, scrolls a counter down,
  forces the transition pump to reload tilemaps, redraws the arena floor, and repositions two groups of
  pooled sprite structs.'
interface: (r0 = unused/0, r5 = battle-scene state struct) -> r0 = last sprite_setStructHalfwordPairOnThree
  result; updates [r5+0x74] counter, [r5+0x70] flag, [r5+0x2] byte, and sprite-struct +0xC/+0xE pairs
details: r5 points to a battle-scene state struct. It first calls the chip-sprite slot buffer init with
  r0=0 (idle chip-frame sprite in oToolkit_Unk200f3a0), then decrements the halfword at [r5+0x74] each
  call, clamping it at 0x6A and writing 0x24 to byte [r5+0x2] once clamped (a scroll/countdown that settles
  after a few frames). It stores 0xFF into [r5+0x70], the flag that battle_runTransition consumes to clear
  itself and reload the static+scene tilemaps, then redraws the arena floor tiles. Finally it computes
  one halfword from state fields — [r5+0x1C] if [r5+0x5C]==0x27, [r5+0x30] if [r5+0x64]==0xF and the counter
  is <=0x72, [r5+0x26] if [r5+0x60]==5, else 0 — and passes it twice to sprite_setStructHalfwordPairOnThree
  with r2=7 and r2=4, filling the +0xC/+0xE position pairs of structs from the 0x2008450 sprite pool,
  apparently for two sprite groups (7 and 4 slots).
