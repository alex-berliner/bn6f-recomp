name: battle_hazardPanelExtendTimer
address: '0x080D0CE0'
kind: function
status: probable
summary: Every 30 frames, if the panel element flags at [ExtraVars+8]+0x24 showed one of the four elemental
  bits at least 3 times, extends the hazard panel object's lifetime by 20 frames.
interface: (r5 = battle object) -> no return value; clobbers r0/r1, resets oBattleObject_Timer2 and ExtraVars+4
  each 30-frame cycle
details: Reads a pointer from ExtraVars+8, follows +0x58, and tests the halfword at +0x24 for bits 0x10/0x20/0x40/0x80
  (element/status flags of the panel or of the just-spawned hitbox). Each frame where any of those bits
  is set it increments a counter at ExtraVars+4. It also increments Timer2; when Timer2 reaches 0x1E (30
  frames), if the counter reached 3 and oBattleObject_Timer still exceeds 0x14, it subtracts 0x14 from
  Timer, i.e. keeps the timed hazard panel alive longer. It then clears Timer2 and the element counter,
  so each 30-frame window is judged independently.
