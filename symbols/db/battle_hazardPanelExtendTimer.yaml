    tests four bit flags (0x40/0x80/0x20/0x10) of ldrh r0,[r0,#0x24] via ExtraVars+8 -> +0x58 chain, counting
    hits in [r5,#oBattleObject_ExtraVars+4]; Timer2 compared to #0x1e and counter to #3 before `sub r0,#0x14;
