name: sub_8124C94
address: '0x08124C94'
kind: function
status: confirmed
summary: 'Per-frame update for a menu state: clears input flags, handles Start/D-Pad only when no screen fade is
  active, refreshes its two sprites, and runs the standard end-of-frame menu helpers.'
interface: void sub_8124C94(void /* r5 = menu state, r10 = ? */)
details: "Operates on a menu-state struct pointed to by R5 (offsets touched: 0xD byte cleared, 0x14 copied to 0x16,\
  \ 0x18 copied to 0x1A, 0x12 and 0x1C halfwords used as the source frame indices, 0x58 and 0x5C hold the two attached\
  \ OAM/sprite structs).\n\nSequence:\n  1. Calls sub_8126818(0) — likely an init/setup for the current menu state.\n\
  \  2. Calls sub_811983C(0, 1) — likely a button/input reset helper.\n  3. Snapshots the menu's cursor/selection\
  \ fields: ST8(+0xD)=0, ST16(+0x16)=LD16(+0x14), ST16(+0x1A)=LD16(+0x18) — appears to record the previous selection\
  \ before this frame updates it.\n  4. If IsScreenFadeActive returns false (no fade), forwards R0=0 to menu_handleStartAndDpad_8125594\
  \ so Start and D-Pad are accepted. During a fade, input is suppressed to avoid skipping past it.\n  5. Calls three\
  \ menu helpers sub_8125444, sub_8125D10, sub_81264F4 (cursor blink / list draw / scroll-window tick — names unknown).\n\
  \  7. Updates both attached sprites via sprite_setStructHalfwordPairOnThree_8117084 using the just-stored halfwords\
  \ (+0x12 and +0x1C) as the new frame, with palette banks 4 and 7 (the second/third \"color set\" for this menu).\n\
  \  8. Calls sub_812674C and sub_81267A8 — the menu's standard end-of-frame (likely queue OAM copy / vsync wait).\
  \ r5/r6 preserved; everything else (r0..r4,r7..r12,lr,c/v) is fair game.\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
