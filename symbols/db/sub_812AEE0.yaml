name: sub_812AEE0
address: '0x0812AEE0'
kind: function
status: confirmed
summary: Per-frame battle object update dispatcher that selects an update handler by the object's type byte and
  runs it, then chains a shared post-update routine.
interface: 'void battle_object_updateDispatcher_(void);

  // inputs: r5 = battle object ptr; r6, r10 = caller-set context (passed through unchanged)

  // indirect call: r0 = dispatch table entry for the selected handler, r1 = r5->byte 2 (selector)

  // outputs: r5, r8, r9, r10, r11, r12 = post-update routine (sub_812B26C) results

  // clobbers: nz c v r0 r1 r2 r3 r4 r6 r7 lr; preserved: -

  '
details: 'Pushes only lr (tail-call style: pops directly into pc). Loads the dispatch base

  (off_812AEF8 -> pointer-to-pointer, so r0 = *(off_812AEF8 + r5->byte2)), then runs

  the handler via `mov lr, pc; bx r0` (Thumb interworking bit set, entry is

  sub_812AEFC+1). After it returns, bl sub_812B26C is the shared post-update step

  that consumes whatever r5/r6 the handler left. r10 passes through the wrapper

  untouched. The selector indexing 0..k selects one of N battle object update

  routines (presumably type-tagged: navi, enemy, chip, panel, etc.) — the table

  layout (entry == handler_address itself) is what lets the entry also be used

  as a small parameter slot for the handler.

  '
