name: sub_803BF70
address: '0x0803BF70'
kind: function
status: hypothesis
summary: Appends one 16-bit script entry to an object's animation/frame queue, looking up the entry from a double-indexed
  pointer table at off_803C208.
interface: "void sub_803BF70(u8 indexOffset, u32 baseOffset, struct* obj);\n  // r0 = byte offset within obj of\
  \ the write-index counter (read/byte, incremented)\n  // r1 = extra base offset added to obj for the halfword\
  \ write target\n  // r5 = obj pointer (returned untouched)\n  // clobbers r0, r1, flags (NZCV); preserves r4,\
  \ r6, r7\n"
details: "The function performs a two-level table lookup driven by object fields:\n  - reads obj[0x12] (a script/anim\
  \ bank id), scales by 0x10, indexes the\n    pointer table at off_803C208 to fetch a per-bank sub-table.\n  -\
  \ reads obj[0x8] (an animation slot id), scales by 8, indexes that\n    sub-table; the 16-bit entry to queue is\
  \ at sub-table[+2].\nIt then writes that halfword at (obj + base) + (obj[indexOffset] << 1),\nand increments obj[indexOffset]\
  \ by 1 (wrapping implicitly via 8-bit\nsemantics since it uses ldrb/strb + add). The \"+1\" stored back suggests\n\
  the field doubles as a write cursor/index into the 16-bit queue.\nr0 thus encodes \"which index-counter field\
  \ on this object to use\" and\nr1 encodes \"where in the object's memory the queue lives\" — together\nthese let\
  \ the function push a frame/script word onto whichever of\npossibly several script buffers the object owns.\n\
  Flag clobbers and preserved-register set match a small leaf helper that\nis safe to call repeatedly to build a\
  \ script word-by-word. The table\noff_803C208 is likely the per-bank animation/frame data (e.g. cmd/dur\npairs)\
  \ used by the script dispatcher.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
