name: sub_814E7CC
address: '0x0814E7CC'
kind: function
status: hypothesis
summary: 'Tiny wrapper: stores a computed byte at [struct+0x19] and, when that byte is zero, runs an extra fixup
  call.'
interface: unknown inputs (r0..r11, lr as live on entry); returns flags (nz c v) and registers as left by callees;
  r0-r3,r12 clobbered
details: 'Saves lr into r12 on entry and returns via bx r12 (an ACC-style tail pattern). It calls sub_814E7C0, which
  produces a byte in r3 and some struct/base pointer in r1. The byte is written to offset 0x19 of that struct (strb
  r3,[r1,#0x19]). If the byte was zero, sub_814E7A4 is additionally called (likely a fixup or reset of related state,
  e.g. clearing a dependent field); if nonzero, only the flags from `cmp r3,#0` remain for the caller. Without reading
  the two callees it is impossible to tell which subsystem''s struct this is or what offset 0x19 means in game terms
  (flag, counter, timer?). The zero-case fixup suggests 0x19 is a field that needs companion state refreshed when
  it hits zero.

  '
