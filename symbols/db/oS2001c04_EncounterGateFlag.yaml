  date: '2026-10-18'
  detail: 'submenu_subchip_812427C (the LocEnemy subchip chosen) sets EVENT_170B, +0x28 = 0x1770 and +0x2C = +0x1C
    (the last battle''s settings). battle_tryEncounter_80AA4C0: once the encounter roll passes, if +0x28 is nonzero
    and a GetPositiveSignedRNG draw is even and +0x2C is a ROM pointer, +0x2C becomes GameState.CurBattleDataPtr
    and the routine returns it at once (no entry pick, no power check). Map changes clear +0x1C/+0x28/+0x2C (asm00_0.s:1920-1927).'
