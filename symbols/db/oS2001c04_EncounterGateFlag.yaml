summary: 'LocEnemy''s countdown (u32): while nonzero, a passing encounter roll takes oS2001c04_OptCurBattleDataPtr''s
  battle on an even RNG draw, without the entry pick or the power check.'
details: 'Set to 0x1770 when the LocEnemy subchip is used (submenu_subchip_812427C); counts down (every other frame
  in the probe); cleared with the preset on a map change and when the Navi is reset (asm03_1_0.s:1192-1195).

  '
