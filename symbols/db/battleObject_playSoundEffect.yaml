name: battleObject_playSoundEffect
address: '0x080A6E0C'
kind: function
status: probable
summary: Fetches a battle object from the current list node, plays the sound effect whose ID is stored in its +2
  halfword, then invokes sub_80A6E70 with 4.
interface: (none read; list node context via r5/r6 from caller) -> r0 = 1; calls PlaySoundEffect(object->seId) and
  sub_80A6E70(4)
details: The routine first calls battleObject_getFromListPair_80A6E78, which returns the 32-bit battle-object pointer
  held at the [r5,r6]-based list node, then loads the halfword at offset +2 of that object — a sound effect ID —
  and passes it straight to PlaySoundEffect. It then sets r0 to 4 and calls sub_80A6E70, an unknown callee, before
  always returning 1. The +2 field of this object structure is therefore a sound effect number, and the follow-up
  call with the constant 4 (and the unconditional return of 1) suggests this is one branch of a scripted/queued
  action handler, e.g. a step that plays a sound and then advances or queues state 4. No callers are known, so the
  meaning of the 4 and the exact node structure remain unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battleObject_getFromListPair_80A6E78 + ldrh r0,[r0,#2]: takes the object pointer from the list node
    and reads its halfword field at +2; bl PlaySoundEffect immediately after: that halfword is used as the sound
    effect ID; mov r0,#4; bl sub_80A6E70: passes constant 4 to an as-yet unknown helper; mov r0,#1; pop {pc}: returns
    success/true unconditionally, typical of a step/handler function'
  refs:
  - bn6f/asm/asm29.s:3418
  - 0x080005CC PlaySoundEffect
  - 0x080A6E78 battleObject_getFromListPair_80A6E78
  - 0x080A6E70 sub_80A6E70
  reproduce: python3 tools/asmcat.py 0x080A6E0C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree; run wf investigate
    investigate-20261018-235109; its name was fixed mechanically by tools/investigate_land.py style-fix (the run''s
