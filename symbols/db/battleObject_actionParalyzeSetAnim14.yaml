summary: 'Paralyze action variant: runs the standard paralysis handler, then forces the battle object''s
  current animation to 0x14.'
interface: (r5 = battle object pointer, r0-r3 passed through) -> r0 = result of battleObject_actionParalyze_80175B8;
  no flags of note
details: 'The routine is a thin wrapper: it preserves r4/lr, tail-calls the known Paralyze action handler
  (CurAction 4), and afterwards stores the byte 0x14 into the object''s oBattleObject_CurAnim field (r5
  base). Since the paralyze handler commits the pushed-back position and waits out the paralysis counter,
  this variant ends with the object switched to animation 0x14, presumably a dedicated paralyzed/stunned
  pose. The object pointer lives in r5 rather than r0, matching the calling convention of action handlers
  in this table. With no known callers, the exact meaning of animation 0x14 and which action table entry
  dispatches here remain unconfirmed.'
