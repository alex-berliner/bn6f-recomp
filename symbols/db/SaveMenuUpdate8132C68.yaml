name: SaveMenuUpdate8132C68
address: '0x08132C68'
kind: function
status: confirmed
summary: Per-frame update for a save-menu state; waits for the chatbox text (and confirmation flag) to finish, then
  stores the fade-out state, starts a screen fade, and refreshes the menu text graphics.
interface: void SaveMenuUpdate8132C68(void); /* uses R5 = menu state block pointer supplied by the caller; writes
  byte at [R5+1]; no return value, clobbers lr */
details: 'Reads the shared chatbox/engine flag word at 0x02009F38 via chatbox_mask_eFlags2009F38. If flag bit 8
  is already set, the menu has been dismissed and the fade may begin immediately. Otherwise the fade only starts
  once both bit 0x20 (chatbox text finished) and bit 0x110 (extra confirmation flag) are set. When starting the
  fade it: (1) stores 8 into byte offset 1 of the state block pointed to by R5, which is the next menu state in
  the caller''s state machine (the fade-out state); (2) calls SetScreenFade(0xC, 0xC) to fade both screens; (3)
  sets bit 0x40 in the 0x02009F38 flags to record that the fade was initiated. Unconditionally calls saveMenuTextGfx_8132F4C
  at the end to refresh the menu''s text graphics, whether or not the fade started. The R5 state-block pointer is
  arranged by the caller, so this function is a state-machine step, not self-contained.

  '
