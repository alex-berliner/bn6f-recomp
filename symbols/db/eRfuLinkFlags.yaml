name: eRfuLinkFlags
address: '0x02010430'
kind: data
status: probable
summary: 'Proposed name: eRfuLinkFlags. Single-byte RFU link state flag cleared on transfer start, set
  when connected-player count >1, and read as a transfer-active gate. (u8)'
details: Holds one byte in EWRAM at 0x02010430 used by the RFU multiplayer link layer. rfu_startLinkTransfer
  writes 1 to it as part of readying the link, sub_8148A80 writes 0 after preparing/un-preparing link
  state and writes 1 when the local connected-player count exceeds 1, and sub_8148B80 zeros it when a
  multiplayer-only flag is cleared. sub_8148884 reads it and, alongside a 0x30 readiness check, gates
  setting byte_2010368 to 1 (a related transfer/connection flag). The label is referenced solely through
  ldrb/strb, so the field is a single byte even though it sits inside a region with a 4-byte run to the
  next label.
