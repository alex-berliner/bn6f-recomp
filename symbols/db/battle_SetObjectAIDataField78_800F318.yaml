name: battle_SetObjectAIDataField78_800F318
address: '0x0800F318'
kind: function
status: confirmed
summary: Stores a value into a battle object's AI data at offset oAIData_Unk_78, if the object has AI data.
interface: void battle_SetObjectAIDataField78(u32 value /*r0*/, BattleObject* obj /*r5*/); // returns r1 = AI data
  pointer (or NULL), clobbers NZ
details: 'Reads the object''s AI data pointer from obj + oBattleObject_AIDataPtr. If it is

  non-NULL, writes r0 into aiData + oAIData_Unk_78. If the object has no AI data

  (pointer is NULL), nothing is stored. Always returns the AI data pointer (or 0)

  in r1, so callers can tell whether the write happened. Flags NZ are set by the

  tst but apparently not used by callers. The meaning of the oAIData_Unk_78 field

  is not yet known from this function alone.

  '
