name: battle_spawnTypeD3ObjectWithPanelElementAndDamageSettingFlag10
address: '0x080DFFA2'
kind: function
status: probable
summary: Thin wrapper that spawns a type-0xD3 battle object and, on success, sets bit 0x10 in its first
  (flags/status) byte.
interface: '(r0-r3 = args passed through to the spawn routine: panel position, element, damage word, source
  object for alliance/flip halfword) -> r0 = spawned object pointer or 0 if spawn failed; flags clobbered
  by BL/CMP'
details: Calls the type-0xD3 object spawner with its arguments unchanged, then if the returned object
  pointer is non-null reads byte 0 of the object (its flag/status byte in the battle object struct), ORs
  in 0x10, and writes it back. The 0x10 bit is presumably a state flag the D3 object checks on its first
  update; the exact meaning is unknown. If the spawn fails (returns 0) nothing is modified. With no known
  callers, the game context of this flag cannot be determined.
