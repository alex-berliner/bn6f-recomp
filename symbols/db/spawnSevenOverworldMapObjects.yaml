name: spawnSevenOverworldMapObjects
address: '0x0808FF70'
kind: function
status: confirmed
summary: Spawns seven copies of overworld map object type 0x1C, each at position (0,0,0), returning the last spawn's
  r2 result.
interface: 'void spawnSevenMapObjectsType1C_808FF70(void); /* in: lr only; out: r2 = r2 result of the final SpawnOverworldMapObject
  call; clobbers r0-r3, lr, flags; preserves r4-r6 */'
details: 'Simple loop (count in r4, 0..6) that calls SpawnOverworldMapObject seven times with the

  fixed arguments r0=0x1C (object type/ID), r1=0, r2=0, r3=0, plus the current loop count in

  r4. All seven objects use the same type 0x1C and the zeroed position/params, differing only

  in the r4 argument — most plausibly a slot index, instance index, or spawn ordinal passed

  through to the spawner. Each iteration push/pop {r5} around the call preserves the caller''s

  r5 because SpawnOverworldMapObject trashes it; the outer push {r4,lr} preserves the loop

  counter and return address. Quirk: the loop increments r4 with whatever value

  SpawnOverworldMapObject leaves in r4 (add r4,#1 applies to the callee''s r4), so the loop only

  behaves as a plain 0-6 counter if that callee returns its r4 argument unchanged; the

  register-lifted C models this exactly. The function''s own "return value" is just the r2 left

  by the last SpawnOverworldMapObject call — likely an object handle/status the spawner

  produces, not a computed result of this routine itself. No other state is touched here;

  all the work (object allocation, positioning, insertion into the map object list) happens

  inside SpawnOverworldMapObject.

  '
