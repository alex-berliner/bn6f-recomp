name: copyPalletesToIWRAM_8002650
address: '0x08002650'
kind: function
status: confirmed
summary: Copies the 0x200-byte BG palette buffered in IWRAM (iPallete3001750) into hardware BG palette RAM at 0x05000200.
interface: void copyPalletesToIWRAM_8002650(void) — no meaningful register inputs; r3 is passed through and preserved;
  no outputs (CPSR nz clobbered)
details: 'Tail-call wrapper: pushes lr, loads the source pointer iPallete3001750 (an IWRAM buffer holding the current
  palette data) and the fixed destination 0x05000200 (OBJ-side? No — 0x05000000 is BG palette RAM, so 0x05000200
  is the second half of the 1KB palette, i.e. the BG palettes beyond the first 256 entries / or the OBJ palette
  bank depending on how the project maps it; the readable C labels it "BG palette memory"), sets a size of 0x20
  << 4 = 0x200 bytes, and tail-calls CopyByEightWords(src, dst, size) to copy 512 bytes as 8-word (32-byte) chunks.
  This is the standard "upload the staged palette to VRAM palette memory" step after something writes new colors
  into iPallete3001750. No parameters are taken; source, destination, and size are all compile-time constants.

  '
