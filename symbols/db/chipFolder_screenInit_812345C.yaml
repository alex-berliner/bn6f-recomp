name: chipFolder_screenInit_812345C
address: '0x0812345C'
kind: function
status: confirmed
summary: 'One-time initialization of the chip folder screen: sets screen state, loads folder graphics and font/text
  tables, registers two on-screen windows, and runs the screen''s setup routine.'
interface: void sub_812345C(void); // no meaningful inputs; r0-r7, lr and nz/c/v on return are whatever the final
  callee (sub_8123D24) leaves
details: 'Pure setup sequence that only calls into other modules; it keeps no state of its own and passes nothing
  through. Order of operations: 1. sub_81237E0(1) — enters a screen state (arg 1). 2. chipFolder_initGfx_812386C
  — loads the chip folder screen graphics. 3. sub_8046664 — resets the text engine. 4. sub_80465A0(byte_8123400)
  — installs a text/font table from byte_8123400. 5. sub_8123A80 and sub_8123AB8 — additional screen/text setup.
  6. sub_81352A0(unk_201D220, byte_81233D8, 0x9D, 0x48, 4) — registers a window/box at coordinates (0x9D, 0x48)
  with parameter 4. 7. sub_8135314(unk_201D220, off_81234FC, 0x9D, 0x48, byte_8123508) — registers a second window
  at the same coordinates (0x9D, 0x48) using the pointer table off_81234FC and data byte_8123508. 8. sub_8123D24
  — the chip folder screen''s own per-screen setup routine, which is the last call; its register/flag state is returned
  to callers. Both window calls target the same buffer unk_201D220 and the same coordinates (0x9D, 0x48), suggesting
  they configure two layered boxes at the same screen position. The chipFolder_ prefix on the graphics loader callee
  and the folder-like layout strongly associate this with the chip folder screen; callers are expected to treat
  it as a state-entry hook.

  '
