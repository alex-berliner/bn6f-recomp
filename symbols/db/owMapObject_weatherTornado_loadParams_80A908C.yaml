name: owMapObject_weatherTornado_loadParams_80A908C
address: '0x080A908C'
kind: function
status: confirmed
summary: Loads the current weather-tornado parameters (countdown timer, half-timer, and two/three config bytes)
  from the weather param block into an overworld map object.
interface: void owMapObject_weatherTornado_loadParams_80A908C(r5=object, r10=weather state /* passed through to
  getParams */)
details: "Calls owMapObject_weatherTornado_getParams_80A916C (r5 passed through, r10 supplying the\nweather state)\
  \ to get a pointer to the tornado parameter block, then copies fields into\nthe map object at r5:\n  obj+0x2C\
  \ (word)  = params+0x00: countdown timer\n  obj+0x30 (word)  = timer >> 1: half of the countdown, likely used\
  \ as a second-phase timer\n  obj+0x26 (byte)  = params+0x04 low byte: halfword read, stored as byte (sprite/anim\
  \ id?)\n  obj+0x27 (byte)  = params+0x06 low byte: halfword read, stored as byte\n  obj+0x07 (byte)  = params+0x0C\
  \ low byte: halfword read, stored as byte\nUses r7 as the temp param pointer (pushed/popped, not part of the caller\
  \ contract).\nPadded with two zero bytes after pop {r7,pc}. The halfword->byte stores mean the upper\nbyte of\
  \ each source halfword is discarded; likely the params are really bytes at 4, 6, 0xC.\n"
