name: battle_objectUpdate_8133400
address: '0x08133400'
kind: function
status: confirmed
summary: 'Per-frame update tick for a battle object: guards against screen-fade transitions, then advances
  logic, animation, camera, and turn-reset subroutines.'
interface: "void battle_objectUpdate_8133400(\n    u32 r4 /* context */, u32 *r5 /* battle object ptr\
  \ */,\n    u32 r6 /* context */, u32 r7 /* context */, u32 r10, u32 lr\n);\n/* returns via lr; r0-r3,\
  \ nz, c, v carry the residue of the last sub_81353F0 call */\n"
details: 'If IsScreenFadeActive signals a fade is in progress, writes state byte 4 (idle) to [r5+2] and
  clears the timer byte at [r5+3] to 0, effectively pausing the object until the transition finishes.
  Then unconditionally calls four sub-utilities: sub_8134594 (advance battle logic), sub_8134538 (advance
  sprite/animation), sub_81341A0 (advance camera), and sub_81353DC (reset turn state). Finally it sets
  two sub-states in sequence via sub_81353F0: (5, 0) then (6, 1), which the readable C describes as the
  standard idle/ready transition pair. r4-r7 are preserved across the call; only r0-r3 and condition flags
  are modified as pass-through from the last callee.

  '
