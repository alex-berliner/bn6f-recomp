  calls battle_setupNoCustomPlusObjectCollision, which flags the object with 0x30 and refreshes collision
  with hit modifier 3 only while the NoCustom+ battle effect is active. This matches SuperArmor as a battle
  effect/NaviCust-style state: flinch immunity normally, with modified collision handling under NoCustom+.
  No arguments are taken; the target object is implicit (the callee operates on the current object). No
  callers are known, so the trigger context (effect activation vs script) is unconfirmed.'
