summary: Gives the current battle object the SuperArmor flag and sets up its collision behaviour for the
  NoCustom+ case.
interface: () -> void; calls object_setFlag1 with (1 << OBJECT_FLAGS_SUPERARMOR_BIT) on the current object,
  then battle_setupNoCustomPlusObjectCollision
