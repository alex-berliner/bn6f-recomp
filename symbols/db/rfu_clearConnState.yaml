name: rfu_clearConnState
address: '0x08144EA4'
kind: function
status: probable
summary: Clears the RFU link-connection state struct eStruct200FE00, resetting connection state fields
  and slot tables.
interface: () -> void; clobbers r0-r5, lr
details: 'Writes the global RFU struct eStruct200FE00: zeroes bytes at 0x04, 0x05, 0x07, 0x10, 0x0C, 0x24
  and 0x30, stores 0xFF at 0x06 (an invalid/slot marker), and clears two halfword tables of 4 entries
  each at offsets 0x28 and 0x34 (likely per-slot connection IDs / peer slot data). All six call sites
  are inside rfu_updateConnState, which uses this whenever the link state machine drops or resets a connection.
  No return value or flags are meaningful.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'Only caller is rfu_updateConnState at six sites (0x08145120-0x081451BA), all in the state machine''s
    reset/error paths; strb 0xFF,[r2,#0x6] stores a sentinel value into eStruct200FE00+0x06, typical for
    an invalid slot/index; Loop at loc_8144ECC clears 4 halfwords each at struct+0x28 and struct+0x34
    (r5/r2 bases, r3 counts 0..3); All other stores zero byte fields (0x04,0x05,0x07,0x0C,0x10,0x24,0x30),
    a wholesale state clear; Callees: none — pure inline clearing of one global struct'
  refs:
