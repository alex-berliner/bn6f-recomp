  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary''s byte-by-byte claim mostly matches, but it lists 0x24 and 0x30 as separate zero writes;
    asm shows a single strb [r1] where r1 = base+0x24, then add r1,#0xc → base+0x30, so both are indeed
    zeroed. The 0x06=0xFF and slot-table clears (halfwords at 0x28, 0x34, looped 4× with r3=0..3 bls)
    match. Name fits but ''reset'' is vague; ''rfu_clearConnState'' better mirrors init/clear convention
