name: sprite_loadAnimFrameTiles_8002874
address: '0x08002874'
kind: function
status: confirmed
summary: Ensures an object's current animation frame's tile graphics are loaded into its VRAM slot, queueing a transfer
  only when the frame changed.
interface: 'void sprite_loadAnimFrameTiles_8002874(r5: AnimState *state); // preserves r4-r7, clobbers r0-r2/r3/lr,
  returns flags C/V from the frame-equality compare (or from QueueEightWordAlignedGFXTransfer on the upload path)'
details: 'Takes r5 = per-object animation state struct. Fields used: +0x18 (u32 index of the current frame within
  the animation table), +0x1C (pointer to the animation table pointer, i.e. double indirection), +0x24 (u32 address
  of the frame descriptor currently resident in VRAM), +0x08 (u16 VRAM slot number, one 8-word tile block per slot,
  shifted left by 5 to byte offset). Computes the current frame descriptor as *(u32*)(state+0x1C) + *(u32*)(state+0x18).
  If it equals state+0x24, the frame is already in VRAM and the function returns immediately with flags set by that
  comparison. Otherwise it stores the new descriptor address into +0x24, reads the descriptor''s first word as the
  tile (word) count, and calls QueueEightWordAlignedGFXTransfer(src = descriptor+4, dest = 0x6010000 + (slot <<
  5) = vObjectTiles[slot], size = tile count) to DMA/queue-copy the frame''s tile data (tiles follow the 4-byte
  count header) into the object''s VRAM tile slot. Since the "already loaded" comparison is cached in +0x24, repeated
  calls per frame with no animation change are cheap.

  '
