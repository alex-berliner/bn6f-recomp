name: sub_811A434
address: '0x0811A434'
kind: function
status: confirmed
summary: Initialise a slot-list icon sprite in the submenu, picking sprite/animation art from the submenu mode and
  slot flag, then queue the next state step.
interface: void submenuSpriteSlot_init_811A434(u8* slot /* r5 */, void* scratch /* r10 */); clobbers r0-r3,r8,r9,r11,r12,lr;
  preserves r4,r6,r7; flags NZCV trashed
details: 'Writes sprite-id 0x23 into slot->kind (offset 0). Picks the sprite kind byte (0x24 or 0x23) and the GUI
  art descriptor (A_byte_20231A0 or A_eGuiSprite2022AA0) from a 2-level decision: submenu mode byte at sSubmenu+1
  == 0x1C and the slot''s flag byte (offset 4). Builds the GUI sprite via initGuiSprite_8002770, mirrors slot->anim
  (offset 5) into offset 0xC, then calls sprite_setAnimation, sprite_loadAnimationData and sprite_noShadow. Sets
  palette 0 and priority 2 (sprite_setPalette, sprite_setPriority_8002E14). Looks up a u32 in the ROM table at byte_811A4BC
  indexed by the slot flag byte and forwards it to slotList_storeHalfwordAndClearField_800306C. Looks up a byte
  in the ROM table at 0x100 (off_811A4D8) indexed by the slot flag byte and forwards it to sprite_setSubEntryPaletteBank_800304A.
  Calls sprite_setSubRecordFieldA_8003060 with 3, then sub_811A5BC, then sub_811A640 only when slot->flag != 0.
  Writes 4 into slot->flags2 (offset 8) and tail-calls sub_811A4DC as the next-state handler.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
