name: ai_attackChargedRepeatSpawner
address: '0x080EBF6E'
kind: function
status: probable
summary: Boss AI attack step that charges up and then repeatedly spawns a damage-dealing object on a random
  panel in front of the enemy.
interface: (r0 unused entry; r5 = battle object, r7 = oAIAttackVars) -> r0 clobbered by BL calls; updates
  oAIAttackVars fields and ends with HitElement = 8
details: On first entry (AttackElement == 0) it looks up a per-difficulty charge count from dword_80EBFEC
  (values 3,4,5,10 by AiDifficultyTier), stores it in ChargeCycles, increments a counter in the temp attack
  object, plays animation 0xD via object_setAnimation, clears StepTimer and sets AttackElement = 4. It
  then counts down StepTimer from 10; on expiry it re-arms to 10, rolls GetPositiveSignedRNG & 3 to pick
  an offset from dword_80EBFF0 (8/16/24/32), computes a spawn panel from the object's PanelX/Y plus object_getFrontDirection,
  and calls spawn_t3_0x12_80C6ADA with Damage + AttackBoost and the InitFlag, playing sound effect 0xB9.
  Each spawn consumes one ChargeCycle; when the last one fires it sets HitElement = 8 so the AI state
  machine moves on.
