    bl object_setAnimation with r0=0xD and StepTimer/AttackElement=4 setup marks the attack-start state;
    bl GetPositiveSignedRNG; and r0,#3; ldrb r3,[r1,r0] from dword_80EBFF0 = 0x20181008 picks random spawn
    offset; ldrb r0,[r5,#oBattleObject_PanelX]; add r0,r0,r1 after object_getFrontDirection computes target
    panel, then bl spawn_t3_0x12_80C6ADA; ChargeCycles decrement with bgt loop and final mov r0,#8; strh
    [r7,#HitElement] ends the attack
