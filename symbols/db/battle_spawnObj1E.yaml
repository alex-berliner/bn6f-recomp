name: battle_spawnObj1E
address: '0x080C8070'
kind: function
status: probable
summary: 'Spawns battle object #0x1E and fills in its panel position, element, related-object link, damage
  word and alliance, marking it with header flag 0x10.'
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = related battle object ptr, r6 = DamageAndStaminaDamageCounterDisabler
  word) -> r0 = new object ptr (untouched/0 path if spawn failed); flags reflect the spawn result
details: 'A thin spawn-and-configure wrapper: it calls object_spawnType3 with id 0x1E (30), and a push
  {r0-r2,r5}/pop {r1-r3,r5} register shuffle keeps the caller''s arguments available afterwards (old r0/r1/r2
  reappear in r1/r2/r3). If the spawn returned 0 it returns immediately without touching anything. On
  success it stores the arguments into the new object''s oBattleObject_PanelX, PanelY and Element, links
  the caller''s r5 pointer into oBattleObject_RelatedObject1Ptr, copies the related object''s oBattleObject_AllianceAndDirectionFlip
  into the new object (so it inherits team/facing), and writes r6 into the DamageAndStaminaDamageCounterDisabler
  field. Finally it sets bit 0x10 of the new object''s oObjectHeader_Flags. The exact register handoff
  is unusual (r5/r6 used as argument registers), so the caller''s register setup is what pins the argument
  roles.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#0x1e; bl object_spawnType3 — spawns battle object id 0x1E of type 3; push {r0-r2,r5}
    / pop {r1-r3,r5} — arg-preservation shuffle so caller's r0-r2 are in r1-r3 for the field stores; strb
    r1/r2,[r0,#oBattleObject_PanelX/PanelY] and strb r3,[r0,#oBattleObject_Element] — position and element
    come from the caller; str r5,[r0,#oBattleObject_RelatedObject1Ptr]; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip];
    strh r3,[r0,...] — inherits alliance/flip from the related object; beq locret_80C8096 right after
    the spawn call — all setup is skipped when the spawn fails
