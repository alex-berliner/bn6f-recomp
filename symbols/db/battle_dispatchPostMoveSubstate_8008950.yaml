open_questions:
- The exact semantics of byte 0x4 of `dword_203CA70` (return value / state). Confirming it
- represents a sub-phase counter or a small enum would settle whether r0 has game meaning or
- just mirrors an internal flag.
- The six still-anonymous handlers (`sub_800898C`, `sub_8008A7C`, `sub_8008B7C`, `sub_8008BF0`,
- '`sub_8008C58`, `sub_8008D18`) likely correspond to seven concrete post-move phases (e.g.'
- result flash, deletion anim, panel reward, etc.); identifying any of them would let us give
- them all fancier names than `sub_8008XXX`.
