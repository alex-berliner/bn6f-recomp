name: battle_initSpawnState
address: '0x080D124E'
kind: function
status: confirmed
summary: 'Initializes a battle object''s spawn state: places it on its panel, sets up sprite/collision, then either
  frees it (spawning a vanish effect) on failure or configures flags, animation, HP, palette, collision and spawn
  motion before handing it to the update state.

  '
interface: 'battle_initSpawnState(obj in r5, spriteInitData in r6, moreInitData in r7, collisionData in r8) -> r5
  (possibly updated object pointer), r8; r4 preserved; clobbers flags and r0-r3

  '
details: 'Called for battle objects entering their spawn/init state. First places the object on its panel coordinates
  (object_setCoordinatesFromPanels), then initializes sprite and collision via battleObject_initSpriteAndCollision_8011504
  with fixed arguments r0=0x1034 (sprite resource index) and r1=0xC0D0100 (tile/OAM attribute word). If that fails
  (r0==0), the object is aborted: the RelatedObject1 pointer, if set, gets its ObjectHeader field cleared to 0 (unlinking
  the related object), a type-1 type-0 effect object is spawned using the three words read from obj+0x34 (the third
  incremented by 0x100000, r4=0x14 as the effect kind), and the object''s own memory is released via object_freeMemory.
  On success the object is marked spawned: oObjectHeader_Flags |= 2; oBattleObject_Param1 is normalized to 0/1 (non-zero
  becomes 1) and oBattleObject_CurAnim is set to 2*Param1+1 (enemy/virus vs player side appearance variant); the
  collision hit effect is disabled (0xFF) via object_setCollisionHitEffect; oBattleObject_HP, oBattleObject_MaxHP
  and oBattleObject_ExtraVars+8 are all initialized from oBattleObject_Param3 (read as a byte); palette is reset
  to 0 (sprite_setPalette), the collision region is cleared, collision data is published (object_presentCollisionData),
  and spawn motion is started (battle_initSpawnMotion). Finally the related object''s ObjectHeader, if any, is set
  to 2 (active/linked), and oBattleObject_CurState is set to CUR_STATE_UPDATE so the per-frame update handler takes
  over next tick.

  '
