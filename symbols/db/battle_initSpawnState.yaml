name: battle_initSpawnState
address: '0x080D124E'
kind: function
status: probable
summary: 'Spawn-state handler for a battle object: loads its fixed sprite at its panel position and sets
  up HP/animation, or despawns with a poof effect if the sprite fails to load.'
interface: (r5 = battle object pointer; no register args read) -> r0 = garbage; advances oBattleObject_CurState
  to CUR_STATE_UPDATE on success, frees the object on failure
details: Reads the object from r5 (not saved — caller-dependent). Calls object_setCoordinatesFromPanels,
  then battleObject_initSpriteAndCollision with hard-coded resource ids 0x1034 and 0xc0d0100. On failure
  it nulls the related object's header, spawns a t1 effect at object+0x34 with y+0x100 (0x10 << 16) and
  calls object_freeMemory (despawn poof). On success it sets ObjectHeader flags |= 2, maps Param1 (0/1)
  into CurAnim = Param1*2+1 (two visual variants), sets hit effect 0xff (no hit effect), copies Param3
  into HP, MaxHP and ExtraVars+8, resets palette 0, clears and refreshes collision data, sets the related
  object's header to 2, and stores CUR_STATE_UPDATE in CurState.
