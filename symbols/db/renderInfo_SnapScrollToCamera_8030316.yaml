name: renderInfo_SnapScrollToCamera_8030316
address: '0x08030316'
kind: function
status: confirmed
summary: Copies the camera position into the render-info scroll offsets (masked to 8 bits) and zeroes two related
  offsets.
interface: void renderInfo_SnapScrollToCamera(Toolkit* toolkit /* r10 */); returns r1=0, r2=camY, r3=renderInfo,
  r4=0xFF, r5=camera, r7=toolkit; NZ flags set from 0
details: 'Reads the camera pointer from the toolkit (oToolkit_CameraPtr) and the render info pointer (oToolkit_RenderInfoPtr,
  toolkit+8). Takes the camera''s +04 (x) and +06 (y) halfword fields, masks each with 0xFF (only the low byte is
  kept, so the scroll values are 0..255), and writes the masked x to render info +0x10 and +0x14 and the masked
  y to +0x12 and +0x16 — two pairs of fields that apparently track the same scroll value for different consumers.
  It then stores 0 to render info +0x18 and +0x1A, clearing whatever secondary offset lives there. In game terms
  this snaps the drawing scroll to the camera''s current position at the start of a frame. It tail-calls back to
  lr and leaves several registers carrying intermediate values, so callers must not rely on r1-r5, r7 or flags surviving.

  '
