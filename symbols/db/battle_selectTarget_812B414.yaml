name: battle_selectTarget_812B414
address: '0x0812B414'
kind: function
status: confirmed
summary: Marks a battle object as the current selection target and runs chatbox script 0x23 ("Target selected"
  dialogue).
interface: "void battle_selectTarget_812B414(u8* battleObj, u32 r10_unused, u32 lr)\n    // inputs:  r5\
  \ = battle object pointer, r10 = unused, lr = return address\n    // outputs: r4 r5 r6 (preserved through\
  \ tail to caller)\n    // clobbers: r0 r1 r2 r3 lr, flags nz c v\n"
details: 'Writes 0x0C into battleObj[1] (a state/phase marker meaning the object is now the

  active target), zeros battleObj[2] and battleObj[3] (clear per-target counters

  like elapsed-turn ticks or hit counters), then ORs 0x01 into battleObj[0x1B]

  (bit 0 of a flags byte — presumably the "is currently selected/highlighted"

  flag). Finally calls chatbox_runScript_803FD9C_on_eTextScript201BA20 with

  script index 0x23, which plays the in-battle "target locked in" line and

  advances the battle state machine from the caller''s continuation point.

  The chatbox call uses the standard eTextScript table at 0x0201BA20.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
