name: ai_dispatchAttackStep_80F8996
address: '0x080F8996'
kind: function
status: confirmed
summary: Trampoline that dispatches the battle AI's current attack step to one of six per-element/state
  handlers chosen by a byte in the AI attack variable block.
interface: 'void ai_dispatchAttackStep(void); // in: r7 = pointer to AI attack variable block (plus r5,
  r6, r10 as live caller context); out: r0/r1/r5/r8-r12 = whatever the selected handler leaves; flags
  clobbered'
details: 'Pure dispatcher/trampoline for the battle AI attack state machine. Reads the selector byte at

  oAIAttackVars_HitElement from the variable block in r7, indexes the jump table at

  off_80F89A8 (six Thumb handler entries: sub_80F89C0, ai_attackStepLand, ai_attackTimerStep,

  sub_80F8A66, sub_80F8A9C, ai_updateAttackHoldState), then does the classic `mov lr, pc;

  bx r1` sequence to tail-call the handler in Thumb mode. Because the selector byte is not

  reloaded and lr is set from pc, the handler returns directly to this function''s caller

  (after the pop {r7,pc}), so the dispatch is transparent to callers: r0, r1 and every other

  clobbered register afterwards are simply whatever the chosen handler left behind. The

  handler is entered with r0 = selector value and r1 = handler address (a side effect of the

  bx sequence). No state is modified here itself; only r7 is preserved across the trampoline.

  The HitElement-named field is evidently being reused as a generic attack-state/step index

  for this AI, not literally the element of a hit.

  '
