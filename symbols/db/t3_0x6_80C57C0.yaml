name: t3_0x6_80C57C0
address: '0x080C57C0'
kind: function
status: confirmed
summary: Per-frame update for battle object type 3 (an aura/barrier-type object), dispatching on the object's current
  state to init, update/destroy, or a third state handler, then running the shared sprite update.
interface: u32 battle_type3AuraObjectUpdate_80C57C0(u32 object /* r5 */) -> r5 = updated object; r8, r10, r11, r12
  pass through untouched
details: 'r5 holds a battle object pointer. Reads the object''s oBattleObject_CurState byte and uses it as an index
  into the jump table at off_80C57D8, which holds three Thumb handlers: state 0 -> battleObject_auraInit_80C57F4,
  state 1 -> battleObject_auraUpdateOrDestroy_80C5886, state 2 -> sub_80C57E4 (unnamed). Dispatch is the classic
  "mov lr, pc; bx r1" trick, so each handler returns directly into the following bl object_updateSprite with r0
  = state and r1 = handler address still set. After the handler runs, the common battle-object sprite update (object_updateSprite)
  is invoked on the (possibly changed) r5 pointer, and that routine''s r5 result is passed back to the caller. Clobbers
  r0-r4, r6, r7, lr and the flags; preserves nothing explicitly, but r8 and r10-r12 flow through from callers unchanged.

  '
