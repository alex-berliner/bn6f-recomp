open_questions:
- Exact identity of the r5 struct (sprite render entry vs OAM builder record) and meaning of its fields
  0x13/0x16/0x3
- Which caller passes r4/r10 and when the mirror flag is set
- 'The code does world->screen projection with camera subtraction, shake offset, centering (+0x78 X, +0x50
  Y), conditional X negation + flip-bit mirroring, Z difference as depth. However the proposal''s interface
  is wrong: r4 holds the invert flag (proposal says r6), and r6 is repurposed for the Y value mid-function.
  r5+0x13/0x16 flip handling and r5+0xE/0xF depth outputs match. Camera projection + sprite flip is the
  core job, so ''sprite_applyCameraTransform'' is reasonable but the name should reflect it operates on
  a sprite entry.'
