name: ai_dispatchAttackStateHandler_811348E
address: '0x0811348E'
kind: function
status: confirmed
summary: Dispatches one step of an enemy AI attack state by tail-calling the handler selected from a 4-entry
  jump table indexed by the AI attack vars' HitElement byte.
interface: void ai_dispatchAttackStateHandler(u8* aiAttackVars in r7, context in r5/r6/r10); tail-calls
  handler(handler in r1, element in r0) which returns results to this function's caller in r1/r5/r8-r12
details: 'Reads the oAIAttackVars_HitElement byte from the AI attack-vars block pointed to by r7, uses
  it as an index into the table at off_81134A0 (entries 0-3: sub_81134B0, ai_stepTargetPanelRepeatAttack,
  ai_restartAttackAnimOnLoop, genericAI_exitAttackStateAffterDelay_81097B4, all +1 for Thumb), then performs
  a tail-call dispatch: sets lr = pc and bx to the handler, so the handler returns directly to sub_811348E''s
  caller rather than back here. The handler is invoked with r0 = the HitElement value and r1 = its own
  address (the standard dispatch idiom). r5, r6 and r10 pass through untouched and act as the handler''s
  own context. Results r1/r8-r12 seen at the caller come straight from the handler. HitElement here is
  really a small state/selector field (0-3), not a battle element, despite the field name.'
