name: easeStepTowardTarget_801C1D0
address: '0x0801C1D0'
kind: function
status: confirmed
summary: Eases a value toward a target by 1/8 of the remaining gap plus 2, clamping at the target, while
  setting a state/counter pair in the object at r4
interface: int easeStepTowardTarget(int value /*r0*/, int target /*r1*/, void *work /*r4*/); returns the
  adjusted value in r0
details: 'Writes two bytes into the caller-supplied object at r4: work+8 = 2 (likely an animation/behavior
  state) and work+9 = 0xA = 10 (likely a frame counter or timer for that state). Then performs an easing
  step: diff = target - value, result = value + (diff/8) + 2 (arithmetic shift, so it works for negative
  gaps), and clamps the result to target if it would overshoot. This is a classic "ease toward destination
  each frame" helper used for smooth movement or value interpolation (e.g. a sprite/number/scroll approaching
  a goal) with a minimum step of 2 so it always converges. Returns the clamped result; the caller compares/handles
  arrival at the target. r2, flags clobbered; r4 and lr preserved by convention of the call site.

  '
