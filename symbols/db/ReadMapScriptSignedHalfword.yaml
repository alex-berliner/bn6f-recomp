name: ReadMapScriptSignedHalfword
address: '0x080360B6'
kind: function
status: confirmed
summary: Reads a sign-extended 16-bit little-endian value out of the map script byte stream at a caller-supplied
  offset.
interface: int mapScript_ReadSignedHalfword(const u8 *script /* r7 */, u32 offset /* r6 */); returns value in r4,
  low byte also left in r6; clobbers NZCV
details: 'Adds the offset in r6 to the script base pointer in r7, then loads two bytes little-endian (low byte at
  [r7], high byte at [r7+1] after the pointer add). It assembles them into a halfword, sign-extends it via lsl #16
  / asr #16, and returns the value in r4 while leaving the raw low byte in r6 (useful when the caller needs the
  unextended operand, e.g. for further script-pointer math). r7 is modified internally but restored by the push/pop,
  so the script pointer itself is not advanced here - advancing it is the caller''s job (typically a subsequent
  add of 2 plus however many operand bytes were consumed). This is one of the map-script interpreter''s operand
  fetch helpers, the signed counterpart of the unsigned halfword/word readers.

  '
