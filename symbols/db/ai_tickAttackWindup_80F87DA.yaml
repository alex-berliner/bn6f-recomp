name: ai_tickAttackWindup_80F87DA
address: '0x080F87DA'
kind: function
status: confirmed
summary: AI attack-state tick handler that, on its first call, picks the attack element (4), resets the
  object's animation and starts the step timer, then counts it down until the attack state ends.
interface: void ai_tickAttackWindup(u32 r5=battleObject, u32 r6=passthrough, u32 r7=aiAttackVars); returns
  u32 r1 (passthrough, or the value set by object_exitAttackState)
details: "Per-frame tick for an enemy AI's attack state. r7 points at an AIAttackVars\nstructure and r5\
  \ at the owning battle object; r6 is only forwarded to\nobject_exitAttackState. Branches on AttackElement\
  \ (oAIAttackVars_AttackElement):\n- If it is 0 (attack just entered): writes element 4 into AttackElement,\n\
  \  sets oBattleObject_CurAnim to 0 (idle/wind-up animation), and copies\n  AttackDuration (halfword)\
  \ into StepTimer as the countdown length.\n- On every subsequent tick: decrements StepTimer (halfword,\
  \ signed bgt test\n  so the counter is treated as signed and a 0 start wraps negative and exits\n  immediately),\
  \ and while it is still positive simply returns.\n- When the timer reaches 0 (or underflows), calls\
  \ object_exitAttackState\n  (with r5 object, r6 passthrough, r7 attack vars) to hand control back to\n\
  \  the AI state machine; the outgoing r1 comes from that callee.\nr1 is never written by this routine\
  \ itself on the early paths, so callers\nsee their input r1 echoed back unless the exit routine runs.\n"
