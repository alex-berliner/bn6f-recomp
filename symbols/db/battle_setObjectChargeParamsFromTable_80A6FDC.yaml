open_questions:
- What the two stored values represent semantically (charge time vs. duration? attack parameters?) — assembly
  gives structure but no symbol. Naming them as "charge params" is a best guess from the beast-sp call
  site.
- Whether the object at +0x24/+0x28 is reused for HP in some objects; the function writes full u32s so
  the layout here may not match BattleObject verbatim and could be a different struct sized like one.
