name: mysteryData_processMapGroups_809F9DC
address: '0x0809F9DC'
kind: function
status: confirmed
summary: Walks the InternetMysteryDataMapGroupEntries table, resolving type-5 mystery-data entries, clearing
  their event flags, and recording per-group statistics; finalizes via sub_809FDE0 on the sentinel type-1
  group.
interface: 'void sub_809F9DC(void);

  // reads  r10, lr (caller)

  // writes r1, r2, r3, C/V/N/Z (all passed through from sub_809FDE0)

  // preserved r4-r7, r12

  '
details: "- Iterates the 8-byte group entries in `InternetMysteryDataMapGroupEntries`:\n  - group[0] ==\
  \ 1 is the sentinel: invokes `sub_809FDE0` and returns.\n  - group[0] == 0 is skipped (advance by 8).\n\
  \  - otherwise group[1] is a pointer to an array of 4-byte pointers to 12-byte entry blocks.\n- For\
  \ each non-null list pointer, walks 12-byte entries (`byte type, half flagBitfield, word off4, word\
  \ param`):\n  - type == 0 terminates the inner loop.\n  - type == 5 calls `mysteryData_resolveMapGroupEntry_809FBF2(type,\
  \ param)` then `sub_809FA68(off4, resolved, scratch)`, appends the returned id byte into a 16-byte 0xFF-filled\
  \ scratch buffer on the guest stack, calls `sub_809FACE(flagBitfield, sub_r0, sub_r1, writePos)`, then\
  \ `ClearEventFlag(flagBitfield)`, and bumps a per-group match counter (r12).\n- After the inner walk,\
  \ calls `record_writeU16IfIdMatches_809FDCE(group[0], (r6 - listBase) >> 2, matchCount)` with the slot\
  \ index, then advances r6 by 4 and continues.\n- r12 is initialized from the incoming r12 (preserved\
  \ across the call into `sub_809FD70`), suggesting the counter outlives this routine (probably a running\
  \ tally of resolved type-5 entries across groups).\n- Before the main loop it calls `sub_809FD70` with\
  \ the caller's r12 (moved into r4 and pushed onto the stack), hinting at caller-context setup.\n- Stacks\
  \ a 16-byte scratch buffer of 0xFF for resolved id bytes; the buffer's lifetime is per inner walk.\n\
  - Uses guest-stack `ByteFill` (sp passed in r0) rather than a static buffer.\n"
