name: battle_objEmitParticles
address: '0x080D5634'
kind: function
status: probable
summary: Battle object AI that periodically spawns three particle/effects objects at fixed timer intervals, or when
  its linked object's state matches.
interface: (r5 = battle object) -> spawns via sub_80D5684 from table off_80D56C4; r0 = descriptor pointer per call
details: Runs on a battle object (oBattleObject_ fields). If CurAction is 0 (idle) and the linked object's (RelatedObject1Ptr)
  CurAction differs from Param2, it switches to action 4 and sets Timer=4, i.e. it tracks a parent state. Otherwise
  it counts Timer and, when Param1==0, fires at Timer==0xF, 0x1E and 0x2D (every 15 frames); when Param1!=0 it fires
  once when Timer equals Param3. Each firing loads a pointer from a table at off_80D56C4 indexed by r1 (0,4,8,12)
  and calls sub_80D5684 three times, advancing r0 by 8 each time — so the table holds descriptors (likely object
  templates) that each spawn one effect, giving a triple emission like puffs/sparks around the object.
