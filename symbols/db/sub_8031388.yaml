name: sub_8031388
address: '0x08031388'
kind: function
previous_names: []
status: hypothesis
summary: Camera shake frame updater that does a 2D point-vs-line hit test to decide shake magnitude, then moves
  the camera.
interface: (r0 = camera?, r5 = shakestate?, r12 = flag/result word, lr = ret) -> r0 = camera?; sets a bit in r12
  (0x1 ORed in)
details: "1. The function saves incoming r0-r2, r5, lr via push so it can clobber them, then calls\n     `battleObject_applyShakeOffsetAndProject_8031136`\
  \ (a \"shake offset + project\" helper) with\n     the saved first three regs (effectively passing the BattleObject/Coordinate\
  \ triple that\n     was originally in r0..r2 plus the shake state in r5).\n  2. It loads constants into r2..r6\
  \ to build a point/line segment: r2=0xFFFFFFFF (line's\n     start.x), r4=0x20 (a small positive, possibly a \"\
  no-shake\" magnitude), r3=0xFFFFFFFF\n     (line's start.y), r5=0, r6=1 (line end y?).\n  3. `sub_8030E14` is\
  \ the line-vs-point hit test; the contract says it returns (rx,ry) on hit\n     in r0/r1. The 0x20 in r4 plus\
  \ r5/r6 are passed as the line/point parameters.\n  4. With r0=hit distance? and r1=0, `camera_moveByDelta_80310B0`\
  \ is invoked to nudge the\n     camera by the (scaled) delta from the hit test. That callee's contract says it\
  \ skips\n     the update when delta is zero, so this looks like a \"shake one tick if the projected\n     point\
  \ crossed a line this frame\" routine.\n  5. Back in this function, r12 (saved across the bl chain) is ORed with\
  \ 1 -- a \"shake\n     happened this frame\" flag is being recorded into a bitfield the caller owns.\n  6. Restores\
  \ r0-r2, r5 and returns via `pop {r0-r2,r5,pc}`, so r0/r1/r2/r3/r5/r12 are\n     caller's \"in\" values refreshed\
  \ from the stack (r5 is reloaded from the saved value).\n     Net output to caller: r0 preserved, r12 has bit0\
  \ set, r1/r2/r3 trashed.\n  r0..r2 going in look like a 3D coordinate triple; the captured EWRAM dump at r0=0x02009f5c\n\
  \  begins with two `00 80 e0 00` / `00 c0 e1 00` patterns that look like 16.16 fixed-point\n  XY pairs (e.g. 0xE0800000\
  \ = -32.0-ish, then 0xE1C00000 ~= -32.0 in the other example),\n  consistent with the camera/BattleObject coordinate\
  \ convention in this codebase.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r0-r2,r5,lr}` followed by the pop of the same set tells us r0-r2 are preserved outputs and r5
    is a saved/restored callee-style value (r5 is in `in` and `out`). - The single bl to `camera_moveByDelta_80310B0`
    is the only thing that mutates the camera; per its summary it "adds a delta plus the current scroll offsets,
    skipping the update when the delta is zero." - The bl to `sub_8030E14` matches that callee''s contract: line-vs-point
    hit test, with r0 (point), r2..r6 (line endpoints/dir) supplied exactly as required. - `mov r4, #0x20` is the
    only "magnitude" constant present; everything else is 0/-1/1, consistent with a "did the projection cross a
    screen-edge line" check that yields a small fixed-point pixel offset. - `orr r0, r1` after the call uses r1=1,
    then stores back to r12, the "shake active" bitfield held by the caller.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08031388

    '
  result: the body read as described above
- method: coverage
