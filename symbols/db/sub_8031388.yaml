open_questions:
- The precise meaning of the 0x20 constant and which r0..r2 register is the camera
- struct vs the BattleObject/coord triple (the push preserves them but we don't see any
- field access inside the function).
- Whether the bit set in r12 represents "shake this frame" or "this object was hit" --
- callers' use of r12 would settle it.
