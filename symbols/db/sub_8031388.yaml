name: sub_8031388
address: '0x08031388'
kind: function
status: hypothesis
summary: Runs the family's three-step helper sequence (prepare, draw/iterate over an unbounded 0x20-entry extent,
  finish) and then marks the r12 state flags as active by setting the low bit.
interface: void sub_8031388(u32 arg0 /*r0*/, u32 arg1 /*r1*/, u32 arg2 /*r2*/, u32 arg5 /*r5*/); returns with r0-r2/r5
  preserved (restored from stack), r12 |= 1, NZ set from the new r12 value, r3/r4/r6/r7-r9 whatever sub_80310B0
  left.
details: "A thin driver that chains three callees and never inspects their results except by threading step 1's\
  \ r0/r1 into step 2:\n  1. sub_8031136 is called with the caller's r0-r2 unchanged.\n  2. sub_8030E14 is called\
  \ with r2 = r3 = -1 (the \"unbounded\"/sentinel extent\n     markers), r4 = 0x20 (extent/entry count), r5 = 0,\
  \ r6 = 1, and r0/r1 carried\n     over from step 1.\n  3. sub_80310B0 is called with r1 = 0 to finalize.\nAfter\
  \ the sequence, it sets the low bit of r12 (the shared state-flags register used across this family of routines)\
  \ via ORR, so the NZ flags report the new r12 value; c/v are whatever sub_80310B0 last left. r0, r1, r2 and r5\
  \ are saved on entry (push {r0-r2,r5,lr}) and restored verbatim, so callers see their arguments untouched. The\
  \ -1/-1 extent arguments and the fixed 0x20 count suggest a bulk-copy or bulk-iterate operation over at most 32\
  \ entries with no explicit limit; the r12 bit-set pattern suggests this is one of several \"activate state\" wrappers\
  \ in the same subsystem.\n"
