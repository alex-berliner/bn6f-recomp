open_questions:
- Which subsystem sub_8031136/sub_8030E14/sub_80310B0 belong to (OAM/sprite batching, text, or effects) is not identifiable
  from this wrapper alone.
- Exact meaning of the r12 state-flags bit 0 ("active") and who clears or reads it.
- What the fixed extent count 0x20 counts (entries, tiles, pixels?) and why r2/r3 are both set to the -1 sentinel.
- Whether callers rely on r12 being returned, or only on the flag result.
