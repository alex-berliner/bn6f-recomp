kind: function
status: confirmed
summary: Empty do-nothing stub that only fills a slot in some function table.
interface: void sub_8118FE0(void)
details: Pushes LR and immediately pops it back into PC, returning to the caller without touching any registers,
  memory, or flags. It has no side effects at all; its only purpose is to occupy an entry in an indexed function-pointer
  table so that callers dispatching through that table have a valid target for the slot(s) where no real action
  is needed. Which subsystem owns the table is not visible from the stub itself, so no subsystem prefix is claimed.
