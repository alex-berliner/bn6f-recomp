name: ReadCutsceneCameraScriptWord
address: '0x08037480'
kind: function
status: confirmed
summary: Reads one little-endian 32-bit word out of a cutscene camera script byte stream.
interface: u32 cutscene_readCameraScriptWord(u32 offset, const u8 *base); // r0=offset, r1=base -> r0=word
details: 'Pure byte-fetch helper for cutscene/camera script interpretation: computes base+offset

  (r1 + r0) and assembles a 32-bit little-endian word from four LDRB reads at +0..+3,

  shifting and OR-ing each byte into place (byte at offset+0 is the LSB). Returns the

  word in r0. Used by script command decoders (the camera-script/jump-table machinery,

  e.g. CutsceneCommandJumptable handlers) to fetch operands and branch targets from the

  script stream. Quirk: r3 is used as a scratch pointer but is pushed/popped, so r1-r3

  and only the NZCV flags are clobbered; the value read is not bounds-checked against

  the script length.

  '
