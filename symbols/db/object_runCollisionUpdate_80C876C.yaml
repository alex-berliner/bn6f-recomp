open_questions:
- The exact meaning of `Param1 == 4` is not pinned down by the assembly; it may be a per-object "ignore
  timestop" flag set by spawn code. Reading all writers of offset 0x4 would settle it.
- '`sub_80C87B8`''s role (per-action collision routine) is inferred from the jump table being keyed on
  `CurAction`; that helper''s name/contract is not provided here.'
