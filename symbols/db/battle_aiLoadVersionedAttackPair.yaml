name: battle_aiLoadVersionedAttackPair
address: '0x0810067E'
kind: function
status: probable
summary: Loads two versioned AI table halfwords for an attack index, combines them into a word, and stores
  it into the battle object's AI attack vars.
interface: (r0 = attack/table index, r5 pre-set by caller = battle object ptr) -> r0 = loaded value; writes
  word to [oBattleObject_AIDataPtr+0xA0+oAIAttackVars_Damage]
details: Multiplies r0 by 8 and reads a halfword from table byte_81006E8 via battle_aiGetVersionedTableEntry_800FE12
  (which picks entries by the object's AI version, with scaled handling for version 4), then does the
  same against byte_8100724. The second halfword is shifted left 16 and OR'ed with the first, forming
  one word. That word is stored at [AIDataPtr+0xA0 + oAIAttackVars_Damage], i.e. damage in the low half
  and the second table value (likely element or type) in the high half. The battle object pointer arrives
  in r5 rather than r0/r1, so the callers must set r5 before the call. r6 is used as a scratch for the
  combined value.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mul r0,#8; add r0,byte_81006E8; bl battle_aiGetVersionedTableEntry_800FE12 — indexed versioned
    table read; second read from byte_8100724, lsl r0,#0x10, orr r6 — packs two halfwords into one word;
    ldr r3,[r5,#oBattleObject_AIDataPtr]; add r3,#0xa0; str r6,[r3,#oAIAttackVars_Damage] — writes into
    AI attack vars; r5 is never set inside the function, so callers (sub_8100580..sub_810064C) must pre-load
    the battle object into r5
