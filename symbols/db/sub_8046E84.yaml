name: sub_8046E84
address: '0x08046E84'
kind: function
status: confirmed
summary: Per-chatbox-tick handler that processes B-button cancel, busy-prompt scripts, and default exit scripts.
interface: void chatbox_tickBAndExit_8046E84(ChatboxState* r5, Toolkit* r10); /* r5 = chatbox state ptr; r10 = toolkit
  (preserved as r10,r11 out) */
details: Called once per tick for an active chatbox object (r5). First calls sub_8047134 (likely toolkit/scene refresh),
  then reads the pressed buttons from the toolkit's joypad pointer. If B (bit 1, value 2) is pressed, plays SOUND_UNSELECT_68
  and falls through to the default-exit path. Otherwise, checks chatbox flag 0x20 via chatbox_mask_eFlags2009F38;
  if set (chatbox is mid-prompt), queries chatbox_GetState_8045F4C. A non-idle state triggers chatbox_runScript
  with script index 1 (confirmation/busy prompt) and sets the chatbox state byte to 8. The default-exit path (B
  pressed, or idle-prompt) sets flag 0x40 via chatbox_set_eFlags2009F38, runs chatbox_runScript with script index
  3 (goodbye/closing dialogue), and sets state byte to 0xC. Script archive pointer is read from [r5 + 0x24]. State
  and flags are stored directly into the r5 structure.
