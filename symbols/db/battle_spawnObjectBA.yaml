open_questions:
- What game entity object ID 0xBA actually is (needs a lookup of other spawns of 0xBA or its initializer's
  behavior)
- Whether object_spawnType3 really returns the new object pointer in r5 (ABI-violating) or the mov r0,
  r5 reflects a decoding quirk
- What sub_8102BFC passes as arguments, which would pin down the object's spawn parameters and semantics
