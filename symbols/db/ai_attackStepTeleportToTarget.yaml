name: ai_attackStepTeleportToTarget
address: '0x08100ACC'
kind: function
status: probable
summary: AI attack step that instantly relocates the attacking object to the target panel, pauses 2 frames,
  then applies the hit element
interface: () -> void; reads r7 = AI attack vars struct, r5 = battle object; no args or return
details: This is a state-machine step for an AI-driven attack, keyed off oAIAttackVars_AttackElement in
  r7. On entry with AttackElement == 0 (first invocation), it latches element 4 into AttackElement, plays
  battle object animation 3, copies TargetPanelX/Y from the attack vars into the object's PanelX/PanelY,
  and calls object_setCoordinatesFromPanels and object_updateCollisionPanels so the object's pixels and
  collision data snap to that panel — i.e. the attack teleports/relocates the enemy onto its target. It
  sets StepTimer = 2 and returns. On subsequent invocations it decrements StepTimer; once it expires it
  restores CurAnim to 0 (idle) and writes 8 into oAIAttackVars_HitElement, which the following attack
  steps presumably consume to resolve the hit.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst+bne gates one-time setup vs countdown (asm 0x8100AD0-0x8100AD6);
    strb TargetPanelX/Y -> oBattleObject_PanelX/Y then bl object_setCoordinatesFromPanels / object_updateCollisionPanels
    (0x8100AE0-0x8100AEA); mov r0,#2; strh [r7,#oAIAttackVars_StepTimer] arms a 2-frame delay (0x8100AEC);
    timer expiry: strb #0 -> CurAnim, strh #8 -> oAIAttackVars_HitElement (0x8100AF2-0x8100B00); r5/r7
    pair and field names (oAIAttackVars_*, oBattleObject_*) match the battle AI attack-var pattern used
    by sibling attack steps'
