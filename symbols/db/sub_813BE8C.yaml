open_questions:
- Whether the function was originally meant to clear/write to each entry; the current binary never stores. Captured-call
  memory snapshots are all zero so they don't disambiguate.
- 'Settling it: look at callers that hand r6 to the helper and compare with other re-init paths that do write (e.g.
  the rest of battle_initState_813BBD4).'
- 'Naming the count of buffers (0x31 == 49) coincidental: 3 * 0x31 = 0x93, but loop uses 0x31 iterations — so the
  name "iterates 49 entries" matches the code, even if the original intent was per-buffer.'
