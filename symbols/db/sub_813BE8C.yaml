name: sub_813BE8C
address: '0x0813BE8C'
kind: function
previous_names: []
status: hypothesis
summary: Polls the 0x31-entry Unk2004190 array; returns void when all entries report idle (r7 holds last entry ptr).
interface: '(no args) -> void ; side effects: clobbers r0-r2 via 49 bls to toolkit_getUnk2004190EntryPtr_813B9FC'
details: "Loop runs r6 = 0..0x30 (inclusive), each iteration calling\n  toolkit_getUnk2004190EntryPtr_813B9FC(r0=r6)\
  \ to get an 8-byte-per-entry pointer\n  into the array at tk->Unk2004190_Ptr. Loads ldrh r0, [r7] (the entry's\
  \ first u16)\n  and tests via tst r0,r0 / beq. If the entry is non-zero it appears the loop body\n  is empty in\
  \ this disassembly (the branch target is the increment), so this looks\n  like a busy/wait poll that simply iterates\
  \ through all 0x31 entries every frame.\n  r7 holds the last fetched entry pointer across the loop so callers\
  \ can see it,\n  but no other value escapes (lr is restored via pop, out only lists r7 per the\n  contract).\n\
  \  Called once from battle_initState_813BBD4 alongside a longer battle init\n  sequence, suggesting it is a \"\
  make sure every per-battle sub-buffer reports\n  ready/inactive before starting\" check.\n"
