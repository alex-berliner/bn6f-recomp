name: sub_813BE8C
address: '0x0813BE8C'
kind: function
previous_names: []
status: hypothesis
summary: Clears (or tests) the 0x31-entry Unk2004190 scratch array by iterating indices 0..0x30 and reading each
  entry's halfword, leaving r7 as the last read pointer.
interface: '(r10 = Toolkit*) -> r0 = 0, NZC/V flags clobbered ; side effects: walks Toolkit->Unk2004190[0..0x30],
  reads each entry''s halfword, clobbers r0/r1/r2/r4/r5/r6/r7'
details: "- Sets r6 = 0 as the loop counter (the only \"write to a register\" before the branch).\n  - At each iteration\
  \ it computes the address of entry r6 in Toolkit->Unk2004190 via\n    toolkit_getUnk2004190EntryPtr_813B9FC, whose\
  \ summary tells us it returns r0 = base + 8*index.\n  - Loads a halfword from [r0] (ldrh r0, [r7]) and immediately\
  \ does `tst r0, r0; beq` to the\n    fall-through. The branch target is the same address as the tst itself (loc_813BE9E),\
  \ so the\n    `beq` is a no-op skip — the loaded halfword is dropped on the floor and no memory is written.\n\
  \  - Increments r6 by 1 and loops while r6 < 0x31, i.e. walks 49 entries (indices 0..48).\n  - The caller battle_initState_813BBD4\
  \ has the comment \"Initializes ... plus three 0x31-byte I/O\n    scratch buffers pulled from the toolkit\", which\
  \ lines up exactly with this routine clearing\n    the halfword flag/word of 0x31 entries. However, the assembly\
  \ never actually writes the\n    loaded value back, so this is effectively a read-walk; the clearing, if it happens\
  \ at all,\n    must be done by the toolkit helper or happen implicitly. Worth flagging.\n  - r7 carries the pointer\
  \ of the last visited entry out of the function (out=['r7']); callers\n    that need the entry address probably\
  \ recover it themselves with a fresh call to the helper.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r6, #0` then `add r6, #1; cmp r6, #0x31; blt` is the canonical 0..0x30 count loop (loc_813BE90..813BE9E
    in asm37_0.s:1147). - The sole callee toolkit_getUnk2004190EntryPtr_813B9FC is summarized as returning the entry
    pointer for the requested index — calling it with r0=r6 yields entry r6''s address. - `ldrh r0, [r7]` reads
    a u16 from each entry; `tst r0, r0; beq loc_813BE9E` branches to the very next instruction (the increment) so
    the test never alters control and no str/bh follows, i.e. nothing is actually stored. - The sole caller is battle_initState_813BBD4,
    whose description mentions "0x31-byte I/O scratch buffers" matching the 0x31-iteration count here. - Captured-call
    entry r1 = 0x02004190 (the EWRAM address pointed at by Toolkit+0x5c, i.e. Unk2004190) confirms the helper actually
    returns a pointer into that buffer.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0813BE8C

    '
  result: the body read as described above
