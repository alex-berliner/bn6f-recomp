  detail: '- Loop counter `r6` initialised to 0 and bounded by `cmp r6, #0x31` followed by `blt loc_813BE90` (loc_813BE90..loc_813BEA8
    in the listing). - Per-iteration pointer fetch via `bl toolkit_getUnk2004190EntryPtr_813B9FC` with `r0 = r6`,
    capturing the 8-byte stride is implied by the toolkit accessor contract. - `ldrh r0, [r7]` reads the first halfword
    of each 8-byte entry; `tst r0, r0; beq loc_813BE9E` shows only the non-zero case falls through (and even that
    falls through to the loop increment, leaving an empty conditional). - Caller summary "three 0x31-byte I/O scratch
    buffers pulled from the toolkit" matches the 0x31 iteration count; the dump `[r1 @02004190] 00..` zeros are
    consistent with the read-only pass not mutating the array in the captured frames. - Contract `out=[''r7'']`
    and `may_write` excluding r0..r3 from the caller''s view: the callee clobbers r0/r1/r2 through the bl but only
    r7 is listed as live-out (the caller''s save/restore of r4-r7 absorbs the rest).'
