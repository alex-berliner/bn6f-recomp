    returns r0/r1/r2 and the body immediately stores it in r7 and reads `[r7]` -> operates on the 8-byte entries
    of the Unk2004190 array. - `ldrh r0, [r7] ; tst r0, r0 ; beq loc_813BE9E` -> the only per-entry read is a halfword
    at the entry''s first word; zero is the "free" sentinel the caller summary implies. - Caller battle_initState_813BBD4
    names three 0x31-byte I/O scratch buffers pulled from the toolkit -> the iteration count matches those buffer
    sizes exactly, reinforcing the "poll every per-battle sub-buffer" reading.'
