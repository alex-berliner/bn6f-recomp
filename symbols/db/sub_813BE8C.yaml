name: sub_813BE8C
address: '0x0813BE8C'
kind: function
previous_names: []
status: hypothesis
summary: Iterates 0x31 entries in the toolkit's Unk2004190 array, loading each entry's pointer and discarding the
  first u16; appears to be a no-op clear/reset pass for those battle I/O scratch buffers during battle init.
interface: (no args) -> (no return; preserves r10)
details: "Function called only from battle_initState_813BBD4. Loop counter r6 runs 0..0x30 (inclusive, 0x31 iterations).\n\
  \  Each iteration calls toolkit_getUnk2004190EntryPtr_813B9FC(index=r6), which returns the address of the\n  8-byte\
  \ entry in the oToolkit_Unk2004190_Ptr table. The first halfword at [r7] is loaded into r0 and tested\n  with\
  \ `tst r0, r0; beq loc_813BE9E`, but loc_813BE9E is the fallthrough that simply does `add r6, #1;\n  cmp r6, #0x31;\
  \ blt` -- the conditional branch always targets it, so nothing is actually done with the\n  loaded value. No memory\
  \ writes occur, no callee-side effects beyond the pointer load. Looks like either\n  dead code or a vestigial\
  \ reset pass that was once clearing entries. The 0x31 count matches the three\n  0x31-byte I/O scratch buffers\
  \ mentioned in the caller's summary, and the array is 8 bytes/entry, so 0x31\n  entries = ~0x188 bytes which is\
  \ consistent with three such buffers. Keep the suffix because the function\n  has no observable effect.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r6, #0` then `cmp r6, #0x31; blt loc_813BE90` shows a 0x31-iteration loop over entry indices.
    - `bl toolkit_getUnk2004190EntryPtr_813B9FC` with r0=r6 yields the per-entry pointer in r7, per that callee''s
    contract: "Returns the address of entry `index` in the 8-byte-per-entry array whose base pointer is held in
    the toolkit struct at oToolkit_Unk2004190_Ptr." - `ldrh r0, [r7]; tst r0, r0; beq loc_813BE9E` reads the first
    u16 of each entry, but loc_813BE9E is the fallthrough to the next iteration (no store, no other use of r0),
    so the read is discarded. - Caller battle_initState_813BBD4 sets up "three 0x31-byte I/O scratch buffers pulled
    from the toolkit" and then calls this immediately after; 0x31 iterations of an 8-byte stride array is consistent.
    - No stores to memory; r0 is the only "may_write" candidate and is dead.'
