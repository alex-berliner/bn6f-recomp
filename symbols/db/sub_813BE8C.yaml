name: sub_813BE8C
address: '0x0813BE8C'
kind: function
previous_names: []
status: hypothesis
summary: iterates entries 0..0x30 of the oToolkit_Unk2004190_Ptr scratch table and early-exits each iteration as
  a no-op (looks intended to clear slot data on battle init).
interface: '() -> void ; side effects: reads halfword at each oToolkit_Unk2004190_Ptr[i] and branches on it'
details: "Pushes r4-r7+lr; r6 = 0; loop body calls toolkit_getUnk2004190EntryPtr_813B9FC(r6) -> r7,\n  ldrh r0,[r7],\
  \ tst r0,r0, beq loc_813BE9E. The 0x31 (49) iterations match the three 0x31-byte\n  scratch buffers the caller\
  \ (battle_initState_813BBD4) pulls from the toolkit via\n  oToolkit_Unk200431c_Ptr/oUnk2004330_Ptr/oUnk2004334_Ptr.\
  \ The chosen body is empty (no\n  store ever happens), so the function is effectively a probe-and-skip whose only\
  \ observable\n  effect is calling the entry-pointer helper and discarding r7. Return is via `pop {r4-r7,pc}`.\n\
  \  Note the function preserves lr with the standard leaf return, takes no arguments, returns\n  nothing visible\
  \ to callers (out is just r7, the count residue); may_write on r0/r1/r2/r4/r5/\n  r6/r7/lr comes purely from the\
  \ callee contract and saved register pushes.\n"
