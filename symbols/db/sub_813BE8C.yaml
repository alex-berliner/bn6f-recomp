name: sub_813BE8C
address: '0x0813BE8C'
kind: function
previous_names: []
status: hypothesis
summary: Walks the 0x31-entry 8-byte array pointed to by toolkit's oToolkit_Unk2004190_Ptr and reads the halfword
  at offset 0 of each entry, doing nothing meaningful with it; the captured-call memory is zero-filled.
interface: (r10 = toolkit) -> side effects only; no return value used by caller
details: "Saves {r4-r7, lr}. Sets r6 = 0 and loops while r6 < 0x31 (49 entries):\n    r0 = r6 (loop index)\n   \
  \ bl toolkit_getUnk2004190EntryPtr_813B9FC  -> returns entry pointer in r0 (plus r1/r2 maybe set/used)\n    r7\
  \ = r0   (entry ptr)\n    ldrh r0, [r7]      ; load first u16 of the 8-byte entry\n    tst r0, r0; beq loc_813BE9E\
  \   ; the branch target is the fallthrough at loc_813BE9E which is the loop increment\n    ; body of the if (r0\
  \ != 0) is empty (falls straight through to loc_813BE9E), so the conditional is currently a no-op\n  loc_813BE9E:\
  \ r6 += 1; if r6 < 0x31 keep looping; else pop {r4-r7, pc}.\n  Net effect today: a 49-iteration scan over the\
  \ Unk2004190 array that only reads each entry's first u16; the \"if non-zero\" branch body is empty, so this is\
  \ effectively a touch/read pass rather than a real initializer. Caller (battle_initState_813BBD4) treats the call\
  \ as void; the function restores all callee-saved regs and does not propagate a return.\n"
