name: sub_813BE8C
address: '0x0813BE8C'
kind: function
previous_names: []
status: hypothesis
summary: Iterates 0x31 entries in the toolkit's Unk2004190 8-byte-array and, for each, reads the first halfword
  (likely a "in-use" flag) into r0 each iteration.
interface: '(r10 = toolkit) -> no caller-visible return; side effects: only volatile (loop reads toolkit array).'
details: "Sets r6=0 and loops r6 in [0, 0x31). Each iteration: r0=r6, calls toolkit_getUnk2004190EntryPtr_813B9FC\n\
  \  which returns r7=&entry[r6]. Then ldrh r0,[r7] reads the entry's first u16, tst r0,r0 / beq loc_813BE9E\n \
  \ (the beq target is the increment), and falls through to the same increment either way. Body has no store,\n\
  \  so the function is effectively a no-op scan/poll over 49 slots of Unk2004190 (matches \"0x31-byte I/O scratch\n\
  \  buffers\" comment in the caller). Likely a debug/diagnostic or a placeholder for something that was compiled\n\
  \  out; the read+beq suggests it was originally checking entry flags.\n"
