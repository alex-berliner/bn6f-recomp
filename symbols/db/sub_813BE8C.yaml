open_questions:
- Whether this routine is meant to clear/write the entries or just to test/walk them; the
- assembly as shown has no store. Settling it requires confirming whether
- toolkit_getUnk2004190EntryPtr_813B9FC has a side-effect that zeros the slot, or whether a
- store was elided by the lifter.
- Why r7 is in `out` (the contract) but never explicitly used after the loop — possibly the
- lifter marks any callee-saved register that was written, even if no caller relies on it.
