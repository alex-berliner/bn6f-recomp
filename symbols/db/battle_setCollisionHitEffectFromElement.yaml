name: battle_setCollisionHitEffectFromElement
address: '0x0801A146'
kind: function
status: probable
summary: Copies the low nibble of a battle object's element field into its collision data's hit-effect
  byte.
interface: (r5 = battle object) -> r0 = element&0xF stored to collisionData.hitEffect; flags clobbered
details: Reads oBattleObject_Element from the object at r5, masks it with 0xF, and writes that nibble
  to oCollisionData_HitEffect in the struct pointed to by oBattleObject_CollisionDataPtr. In MMBN terms
  this makes the object's attack/panel interaction carry its element (e.g. elec/aqua hits) as the hit
  type used when its collision fires. r0 is reused as scratch, so the object pointer must live in r5,
  meaning this is a leaf helper called from code that already holds the object in r5 (as battle_initVariantObject's
  object init path does). No return value.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_Element]; and r0,#0xF reads and nibble-masks the element; ldr r3,[r5,#oBattleObject_CollisionDataPtr];
    strb r0,[r3,#oCollisionData_HitEffect] writes into the collision struct; called by battle_initVariantObject
    while setting up an object's sprite/collision
