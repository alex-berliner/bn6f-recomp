name: calc_hypotFixed12
address: '0x080014D4'
kind: function
status: probable
summary: computes sqrt(x²+y²) of a 2D vector in 20.12 fixed point via the BIOS Sqrt SWI
interface: (r0 = x in 20.12 fixed, r1 = y in 20.12 fixed) -> r0 = sqrt(x²+y²) in 20.12 fixed; flags from
  final lsl
details: Arithmetic-shifts r0 right by 12, squares it (mul r0,r2), does the same for r1, adds the squares,
  then issues SWI 8 (GBA BIOS Sqrt) and shifts the result left by 12. Inputs are therefore 20.12 fixed-point
  coordinates and the return value is the vector magnitude back in 20.12 fixed point. No memory access
  or state; a pure leaf utility for distance/radius math. The asr/mul/lsl pattern keeps only the integer
  parts of each square, so precision is limited to whole units.
