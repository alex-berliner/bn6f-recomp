  detail: 'asr r0,#12 + mov r2,r0 + mul r0,r2: squares the first fixed-point input (0x080014D6-0x080014DC);
    same pattern on r1 then add r0,r0,r1: sums x²+y²; svc 8 is the BIOS Sqrt call on GBA (BIOS_Sqrt);
    lsl r0,#12 before pop converts the integer sqrt result back to 20.12 fixed; many call sites across
    battle/field code (0x08089EBC, 0x081428D4, ...) consistent with a generic distance helper'
