name: object_updateCollisionStateOnRelatedDestroyed
address: '0x080DA53A'
kind: function
status: probable
summary: Per-frame update for a battle object that processes its collision state and reacts when its related
  object is destroyed
interface: (r5 = battle object) -> r0 = ?; flags from battle_isTimeStop/battle_isBattleOver tests used
  for control flow only
details: First removes the object's previous collision data and spawns a hit-effect object at the last
  collision's coordinates. If the battle is over (battle_isBattleOver != 0) it instead clears the collision
  region and sets the object's state word to CUR_STATE_DESTROY. Otherwise, if the collision's flags-from-collision
  field is nonzero it clears the collision region; then, if the related object's CurAction is 0xB (destroyed),
  and time is not stopped, it dispatches through a jump table at off_80DA588 indexed by the object's own
  CurAction (single entry = sub_80DA58C). In the normal path it calls object_presentCollisionData to refresh
  hit/status data and run shared collision processing for this frame.
