name: battle_clearObjectCollisionArea
address: '0x03007828'
kind: function
status: probable
summary: Frees (clears) the battle collision-index bits for every panel a battle object currently occupies,
  using its shape's panel-offset list and facing side.
interface: (r0 = battle object struct ptr) -> r0 = last test-and-clear result from object_testAndClearCollisionIndexBit;
  clobbers r4-r6, lr
details: Reads a shape id from object+1, uses it (<<2) to index PanelOffsetListsPointerTable to get a
  list of (x,y) signed-byte offset pairs terminated by a 0x7F byte. Calls object_getAllianceDirection
  with object+4/+5 to get +1/-1 depending on which side the object is on, which mirrors the offsets for
  enemies. For each pair it computes panel coords (offset_x * direction + object+0xA, offset_y * direction
  + object+0xB) and calls object_testAndClearCollisionIndexBit to clear that panel's occupancy bit for
  the object. Iterates until the 0x7F terminator; no check that the object side/direction is valid beyond
  the callee.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r2, off_3007864 =PanelOffsetListsPointerTable + lsl r1,#2 selects per-shape offset list
    from object+1; call to object_getAllianceDirection(r5+4,r5+5) in r6 multiplies x offsets, mirroring
    footprint for enemy side; ldrsb loop with cmp #0x7f terminator walks signed (x,y) pairs, add r4,#2;
    bl object_testAndClearCollisionIndexBit with r2=object ptr clears occupancy bit at computed panel
    coords; no known caller; callees are battle-object collision/panel helpers, consistent with freeing
    an occupied panel area'
