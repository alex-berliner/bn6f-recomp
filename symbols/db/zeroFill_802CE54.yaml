name: zeroFill_802CE54
address: '0x0802CE54'
kind: function
status: confirmed
summary: Zero-fills the fixed 0x20-byte work buffer at unk_2036720 (IWRAM), preserving r2/r3 for the caller.
interface: 'void clearWorkBuffer_2036720_32bytes(void); /* in: r2, r3 (forwarded untouched), lr; out: r2, r3 preserved,
  c/v per ZeroFillByWord */'
details: 'A tiny wrapper: calls ZeroFillByWord with memBlock = unk_2036720 (0x2036720, a fixed 0x20-byte scratch/work
  area in IWRAM) and size = 0x20. It only sets up r0/r1 itself; r2 and r3 are neither read nor written, so the wrapper
  effectively passes them through unchanged — the register contract shows them both as inputs and outputs, meaning
  callers use this as a call-through point while keeping values live in r2/r3. Exit flags (c, v) are whatever ZeroFillByWord
  leaves, and some callers branch on them, so the wrapper must not disturb them (it doesn''t — push/pop {lr} and
  no flag-setting instructions of its own). No other structures are touched; the buffer''s contents and purpose
  depend on the callers that read it after the clear.'
