name: chatbox_runScript_803FE08
address: '0x0803FE08'
kind: function
status: confirmed
summary: Entry thunk for the chatbox script runner — resets the runner's "done" flag and tail-jumps into the shared
  script-execution loop at loc_803FE14.
interface: chatbox_runScriptFromStart_803FE08(TextScriptArchive *archive /*r0*/, u8 scriptIdx /*r1*/); clobbers
  r0-r4,lr,NZCV; preserves r6,r7,r10; returns runner state in r5,r6,r7 (per contract)
details: 'This is the outer entry point of the chatbox text-script runner. It pushes {r4,r5,lr} to open a stack
  frame, sets r4 = FALSE (the runner''s "script finished" flag, here meaning "start/continue from the beginning
  of the script"), and then tail-branches to loc_803FE14, which contains the actual script interpreter loop for
  the given TextScriptArchive and script index. Because the branch is a tail call, the pushed frame is never popped
  here — the callee''s epilogue pops {r4,r5,pc}, so the stack slots for r4, r5 and lr must genuinely be written.
  The callee''s outputs (r5, r6, r7 — presumably the current script pointer/state) are therefore this function''s
  outputs as well. r4 is used as a boolean loop-terminator flag by the interpreter body; initializing it to FALSE
  makes the loop run at least one script command. Functionally this pairs with whatever variant entry resets or
  resumes the runner with r4 = TRUE (script done / skip-ahead).

  '
