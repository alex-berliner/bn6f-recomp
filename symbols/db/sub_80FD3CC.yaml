name: sub_80FD3CC
address: '0x080FD3CC'
kind: function
status: confirmed
summary: 'AI damage setup: packs a move''s base and bonus damage values (from two versioned tables) into the AI
  attack vars'' Damage field on the battle object.'
interface: void sub_80FD3CC(u32 r0 /*moveIndex*/, BattleObject* r5 /*battleObject*/); /* no return */
details: 'Uses battle_aiGetVersionedTableEntry_800FE12 twice with r2=8 (element stride) to fetch an 8-byte

  record (split across two tables: byte_80FD408 for base damage, byte_80FD42C for bonus damage).

  Each record is treated as four little-endian u16 entries indexed by moveIndex*8, so likely

  damage tiers per chip/move category (the base table holds the real per-tier values like

  10/50/90/140, while the bonus table is uniformly 10). The base value is kept in the low 16 bits

  and the bonus value is shifted into bits 16-31, ORed together, then written via

  oBattleObject_AIDataPtr + 0xA0 + oAIAttackVars_Damage on the supplied battle object (r5).

  Tables byte_80FD408/byte_80FD42C have three 8-byte variants each picked by

  battle_aiGetVersionedTableEntry_800FE12, presumably per game version (JP/US/EU or similar);

  only byte_80FD408 slot 2 differs (0x14,0x50,0x96,0x10E vs the identical 10/50/90/140 in the

  first two slots), while byte_80FD42C is constant 0xA across all versions and entries, so the

  "bonus" half currently contributes 10 in every case.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
