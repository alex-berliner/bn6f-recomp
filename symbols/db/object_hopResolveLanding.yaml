  reproduce: python3 tools/asmcat.py 0x080C9AAA
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The summary captures the bouncing/SFX/Alliance checks correctly. However, the interface is wrong:
    r0/r1 are not ''pixel coords of the landing panel'' — r0/r1 at the call site in `object_hopAcrossPanels`
    (0x080C9964) are passed in unchanged (they''re the current panel col/row), and the routine returns
    pixel coords in r0/r1 via `object_getCoordinatesForPanels`. The ''ok: r0/r1 = 16.16 pixel coords ...
    blocked: r2 = 0'' framing is backwards; on the normal success path the input panel coords are consumed
    and pixel coords are returned, while on the blocked path r2 is set to 0 to signal failure. The proposed_name
    `object_hopComputeLanding` is acceptable but `object_hopResolveLanding` better conveys the reflection/bounce
    resolution behavior.; run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- What oBattleObject_Param4 means (it enables the panel-blocking/bounce-back behaviour)
- Which object uses this hop movement and what SFX 0xB6 is (bounce/hit-wall sound?)
- Why the bounce-back retry reflects only dx and not dy, and whether oPanelData_Alliance is side ownership
  or occupancy
- 'The summary captures the bouncing/SFX/Alliance checks correctly. However, the interface is wrong: r0/r1
  are not ''pixel coords of the landing panel'' — r0/r1 at the call site in `object_hopAcrossPanels` (0x080C9964)
  are passed in unchanged (they''re the current panel col/row), and the routine returns pixel coords in
  r0/r1 via `object_getCoordinatesForPanels`. The ''ok: r0/r1 = 16.16 pixel coords ... blocked: r2 = 0''
  framing is backwards; on the normal success path the input panel coords are consumed and pixel coords
  are returned, while on the blocked path r2 is set to 0 to signal failure. The proposed_name `object_hopComputeLanding`
  is acceptable but `object_hopResolveLanding` better conveys the reflection/bounce resolution behavior.'
