name: object_hopResolveLanding
address: '0x080C9AAA'
kind: function
status: probable
summary: 'Resolves a battle-object''s hop target: reflects row/col deltas off the field edges while playing
  SFX 0xB6, checks the destination panel (via object_getPanelDataOffset), and on same-alliance/off-field
  panels bounces back one column and re-checks; returns 16.16 pixel coords of the final panel via object_getCoordinatesForPanels,
  or signals failure by writing 0 to r2.'
interface: '(r0 = panel col, r1 = panel row, r2 = col delta, r3 = row delta; r5 = battle object) -> ok:
  r0/r1 = 16.16 pixel coords of landing panel via object_getCoordinatesForPanels; blocked: r2 = 0'
details: 'Takes the object''s current panel (r0,r1) and a per-hop delta (r2,r3). It checks row r1+r3 stays
  in 1..3 and col r0+r2 stays in 1..6; when a delta leaves the field it is negated (reflected) and SFX
  0xB6 plays. If the object''s oBattleObject_Param4 flag is clear it just returns coords for (col+dx,
  row+dy). Otherwise it reads the panel via object_getPanelDataOffset: an off-field or same-alliance (Alliance
  eor equal) panel makes it retry with dx negated (bounce back one column); if that fallback panel is
  also off-field or same-alliance it fails with r2 = 0, and if it is opposite-alliance it plays SFX 0xB6
  and returns the fallback panel''s coords. Success returns pixel coords from object_getCoordinatesForPanels;
  quirks include registers being saved/restored around the SFX calls so the negations persist, and failure
  returning r2 = 0 rather than r0 = 0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_80C9AC2 checks r0+r2-1 <= 5 and loc_80C9AAA''s start checks r1+r3-1 <= 2, negating r2/r3
    and playing SFX 0xB6 on out-of-range — field-boundary reflection (cols 1..6, rows 1..3); ldrb r4,[r5,#oBattleObject_Param4];
    beq loc_80C9B28 gates the panel-blocking logic on an object flag; getPanelDataOffset + eor of oPanelData_Alliance
    with oBattleObject_Alliance decides landing: opposite alliance allowed, same alliance or null panel
    triggers a dx-negated retry, then r2 = 0 on failure; SFX 0xB6 plays again when the bounce-back panel
    is opposite-alliance before returning its coords; Caller object_hopAcrossPanels hops an object to
    a target panel and destroys it when it lands on a solid/off-grid panel, matching the r2 = 0 failure
    return'
