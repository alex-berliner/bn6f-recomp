name: battle_phaseWait30Frames
address: '0x0800BE0C'
kind: function
status: probable
summary: Battle object phase that waits 30 frames on first entry (initializing Timer=0x1E, PhaseInitialized=4)
  then advances CurPhaseAndPhaseInitialized to 8.
interface: (r5 = battle object) -> r0 = 1 if timer still running, 0 if phase advanced; writes oBattleObject_Timer,
  oBattleObject_PhaseInitialized, oBattleObject_CurPhaseAndPhaseInitialized
details: Standard battle-object phase-update routine taking the object in r5. On first invocation (oBattleObject_PhaseInitialized
  == 0) it sets oBattleObject_Timer to 0x1E (30 frames) and stores 4 into oBattleObject_PhaseInitialized.
  On subsequent frames it decrements oBattleObject_Timer and returns while it stays >= 0; when the counter
  goes negative it writes 8 into oBattleObject_CurPhaseAndPhaseInitialized (high byte = next phase 8,
  clearing the initialized flag), so the object's phase dispatcher moves on to the next state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized]; tst/bne skips init, so first call only sets up
    the timer; mov r0,#0x1e; strh r0,[r5,#oBattleObject_Timer] loads a 30-frame countdown; ldrh r0,[r5,#oBattleObject_Timer];
    sub r0,#1 ... bge keeps returning until the timer expires; mov r0,#8; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    transitions to phase 8 when the wait ends
  refs:
  - bn6f/asm/object.s:809
  reproduce: python3 tools/asmcat.py 0x0800BE0C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code sets PhaseInitialized to 4 (not 0→4; r0 was just compared), starts a 30-frame timer, decrements
    it, and on expiry writes 8 to CurPhaseAndPhaseInitialized, matching the proposal''s behavior. The
    PhaseInitialized stored value is actually 4 not ''stores 4'' — fine — but the summary/handle says
    r0 returns 1/0, while the code never sets r0 to 0 or 1 on return; r0 holds the timer value or 8/4.
    The name ''battle_phaseWait30Frames'' is reasonable but the interface description is wrong about the
    return value.; run wf investigate investigate-20261019-052112; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
