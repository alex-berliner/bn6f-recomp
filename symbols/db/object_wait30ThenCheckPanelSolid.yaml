  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized]; mov r0,#0x1e; strh r0,[r5,#oBattleObject_Timer]
    — one-time setup of a 30-frame delay (asm start); bl object_isCurrentPanelSolid after loading PanelX/PanelY
    — the sole branch condition for the next action; strb #0xc vs strb #4 into oBattleObject_CurAction
    — two mutually exclusive outcomes keyed on panel solidity; mov r0,#0; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
