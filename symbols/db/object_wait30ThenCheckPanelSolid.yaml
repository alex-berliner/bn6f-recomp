name: object_wait30ThenCheckPanelSolid
address: '0x080BD0DA'
kind: function
status: probable
summary: Battle-object phase handler that waits 30 frames, then picks the next action depending on whether
  the object's panel is solid.
interface: (r0 = unused scratch, r5 = battle object) -> r0 = clobbered by calls; sets oBattleObject_CurAction
  (0xC if panel not solid, 4 if solid) and resets PhaseInitialized/phase to 0
details: On first run (PhaseInitialized == 0) it sets oBattleObject_Timer to 0x1E (30 frames) and stores
  phase 4 into PhaseInitialized, then returns. On subsequent runs it decrements the Timer and returns
  until it hits zero. It then reads the object's PanelX/PanelY and calls object_isCurrentPanelSolid; if
  the panel is solid it sets CurAction = 4, otherwise CurAction = 0xC, and in both cases zeroes CurPhaseAndPhaseInitialized
  so the object's state machine re-enters from the start of the new action. This is a generic 'wait then
  branch on terrain' phase used by some battle object whose action IDs 4 and 0xC are defined by its action
  table.
