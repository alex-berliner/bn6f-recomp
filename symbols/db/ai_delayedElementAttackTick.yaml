name: ai_delayedElementAttackTick
address: '0x080F8C4C'
kind: function
status: probable
summary: 'Battle AI attack state handler: arms an element-4 attack on first tick, then counts a 30-frame
  timer and flags the hit element when it expires'
interface: (r5 = battle object, r7 = oAIAttackVars base) -> r0 = clobbered; updates oAIAttackVars_AttackElement/StepTimer/HitElement
  and oBattleObject_CurAnim
details: If oAIAttackVars_AttackElement (r7) is zero, sets it to 4, writes anim 0x11 to oBattleObject_CurAnim
  (r5), calls sub_80E40C2 with r4=0 and r6=r7+0x34 (an inner AI-var block at offset 0x34), and stores
  30 into oAIAttackVars_StepTimer. Otherwise it decrements StepTimer each call; when it reaches zero it
  writes 0x14 (bit 0x10 set, low nibble 4 = the armed element) into oAIAttackVars_HitElement. So the attack
  charges for ~30 frames after arming and then emits the hit-element marker. Called repeatedly (idempotent
  arming due to the element==0 check), typical of a per-frame AI state step.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on [r7,#oAIAttackVars_AttackElement] with strb #4 arms the element only once (sub_80F8C4C
    lines 3-6); strb #0x11 to [r5,#oBattleObject_CurAnim] switches the object''s animation when arming;
    StepTimer = 0x1e on arm, then ldrh/sub #1/strh with bgt is the frame countdown; strh #0x14 to [r7,#oAIAttackVars_HitElement]
    after the countdown encodes element 4 plus flag 0x10; r6 = r7+0x34 passed with r4=0 to sub_80E40C2,
    an undocumented helper on the AI var block'
