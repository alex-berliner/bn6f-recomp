open_questions:
- The "player outcome" values 1/2/7 returned by `someChipHandValidationHappensHere_800B090` likely encode
  "win/lose/draw" but the project doesn't yet have names for them; identifying what each value means in
  game terms would require the validator's code.
- What the substate selector 0x14 (and the r2 overrides from sub_800AF50) actually means in `oBattleState_Index_01`
  is unknown - it could be "battle ended, go to result", "play result animation", etc.
- The exact game-term for "battle step" vs "battle tick" vs "battle frame" is debatable; this is the routine
  called once per battle tick to advance post-action logic.
