status: probable
summary: 'Per-frame battle main loop step: dispatches sub-move handling, validates the chip hand, and
  resolves battle-result/turn-completion based on the player''s outcome.'
interface: '(r5 = &eBattleState, r10 = &eToolkit) -> r0 = 0 ; side effects: mutates oBattleState_Unk_03,
  oBattleState_Index_01, oBattleState_Unk_1e, oBattleState_Unk_02_03; calls sub_800B6F2 to fire pending
  event flags'
details: "On entry r5 is &eBattleState and r10 is &eToolkit. If the post-move flag oBattleState_Unk_03\
  \ is zero,\n  the function primes it by calling sub_8008D40 and writing 4 back into it (`strb r0, [r5,#oBattleState_Unk_03]`).\n\
  \  It then runs battle_dispatchPostMoveSubstate_8008950 and the chip-hand validator\n  someChipHandValidationHappensHere_800B090.\
  \ The validator's return (r0) selects an outcome:\n    - r0==1: store battle-result 1 via setTwoStructs_800A840,\
  \ recompute the player's animation pick\n      via sub_800AF84 (saving it to oBattleState_Unk_1e), write\
  \ the matching sprite-data byte via\n      eStruct200A008_setUnk00, and call sub_800B6F2 to drain pending\
  \ event flags. Note that\n      Unk_07 from eStruct200A008 is propagated into the OWPlayer trailing\
  \ struct's +3 byte via\n      eStruct200A008_setUnk03 before the drain.\n    - r0==2: same as above\
  \ but with battle-result 2; afterwards GetBattleEffects is checked and,\n      unless bits 0x8, 0x2\
  \ and 0x400 are all clear, sub_800AF50 may rewrite r2 to override the\n      default value 0x14 written\
  \ to oBattleState_Index_01.\n    - r0==7: just store battle-result 7.\n  In every case the function\
  \ finally writes r2 (default 0x14, see `mov r2, #0x14`) into\n  oBattleState_Index_01 and clears oBattleState_Unk_02_03\
  \ (16-bit) to 0, then returns 0 to the caller.\n  The contract's `out` register list is everything because\
  \ all caller-saved registers are reused by\n  the callees; the only meaningful value written back is\
  \ r0=0 (`mov r0, #0`).\n"
