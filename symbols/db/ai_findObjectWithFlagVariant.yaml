name: ai_findObjectWithFlagVariant
address: '0x080F7768'
kind: function
status: probable
summary: Searches the battle object list for an object whose id matches a fixed 4-entry list and, if its
  collision flags have bits 0xA000 set, returns a pointer 0x3C bytes into it instead of the object base.
interface: (void) -> r0 = battle object pointer (or base+0x3C if flag bits 0x8000|0x2000 set); flags preserved
  by tail of callee calls
details: 'Loads a pointer to a packed constant 0x1014181E (four bytes: 1E 18 14 10, plausibly four object
  ids/kinds) and passes it to sub_800FE28, which likely walks the battle object list and returns the first
  match. On that result it calls object_getFlag to read the first collision/flag word, and tests it against
  0xA000. If those bits are set, it adds 0x3C to the returned pointer before returning, i.e. it returns
  an alternate sub-struct of the same object. Called only by ai_initSpoutManAttack to set up attack variables,
  so it appears to fetch some helper/auxiliary object relevant to SpoutMan''s attack.'
