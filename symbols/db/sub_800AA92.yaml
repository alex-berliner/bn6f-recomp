name: sub_800AA92
address: '0x0800AA92'
kind: function
status: hypothesis
summary: Fetches a pointer to an eight-entry u32 table from sub_800AAAE and returns how many of the eight entries
  are nonzero.
interface: 'int countNonzeroTableEntries(void) — in: none meaningful (lr only); out: r0 = count of nonzero entries,
  r1 = last word read, r2 = 0x20, r3 = table pointer; c set / v clear from the final cmp r2,#0x20'
details: Calls sub_800AAAE (takes no visible arguments) and treats its return value as a pointer to an array of
  eight u32 values (0x20 bytes). It walks the array in a simple 0..0x20 step-4 loop, reading each word into r1,
  and increments a counter (r0) for every nonzero word. It does not stop at the first zero, so zeros anywhere in
  the table (not just at the end) are skipped but counting continues. No memory is written and no other registers
  are touched. Because sub_800AAAE is unidentified, the meaning of the table — e.g. active entity slots, loaded
  resource handles, task list — is unknown; the routine is a generic "count populated slots in an 8-entry u32 table"
  helper. Callers get r1-r3 and the c/v flags as side effects, which the register contract shows they may read.
