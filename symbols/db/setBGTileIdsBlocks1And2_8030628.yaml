summary: Write two tile ids into BG tile-id blocks 1 and 2 at the same (column, row).
interface: (r0 = tile id for block 1, r1 = tile id for block 2, r3 = column, r4 = row, r10 = toolkit) -> u16 stores
  at [toolkit+oToolkit_iBGTileIdBlocks_Ptr] + block*0x800 + row*0x40 + column*2; r0 = r1, r2 = 3, r6 = row<<6, r7
  = last block entry base; flags from cmp r2,#2
details: The original pushes r0/r1 and pops one per iteration of a two-pass loop over blocks 1 and 2. Which BG layers
  blocks 1/2 are is not established.
