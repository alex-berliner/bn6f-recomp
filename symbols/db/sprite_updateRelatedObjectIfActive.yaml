name: sprite_updateRelatedObjectIfActive
address: '0x080C00EA'
kind: function
status: probable
summary: Conditionally advances a battle object's sprite this frame, returning whether it ran.
interface: (r5 = battle object ptr) -> r0 = 1 if sprite updated, 0 if skipped; sets flags via callees
  only
details: A guarded wrapper around UpdateBattleObjectSprite that uses r5 (not r0) as the owning object
  pointer. It bails out (returns 0) when the battle is paused, when a time-stop is active, when the object's
  RelatedObject1 has HP 0, or when the related object's CollisionData ObjectFlags1 has any bit of mask
  0x80110c00 set (a table of flags that suppress sprite updates). Otherwise it calls UpdateBattleObjectSprite
  and returns 1. The result flag suggests callers need to know whether the update actually happened this
  frame.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_isPaused / battle_isTimeStop with bne to the return-0 path guards the whole update;
    ldr [r5,#oBattleObject_RelatedObject1Ptr]; ldrh HP; beq skip — sprite skipped when related object
    is dead; tst ObjectFlags1, dword_80C0170(=0x80110c00); bne skip — flag mask gates the update; bl UpdateBattleObjectSprite;
    mov r4,#1 — success path returns 1 via r4; input comes through r5 (object ptr), so callers at 0x80C004C/0x80C0072
    set r5 before the call
