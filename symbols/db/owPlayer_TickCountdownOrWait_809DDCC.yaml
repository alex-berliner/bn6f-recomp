name: owPlayer_TickCountdownOrWait_809DDCC
address: '0x0809DDCC'
kind: function
status: confirmed
summary: Ticks an overworld player object's 16-bit countdown in Unk_18, and once it expires only reports "not done"
  while the 0xC00000 status bits of Unk_50 are set.
interface: bool sub_809DDCC(OWPlayerObject *r5); // clobbers r1, r2; sets c/v from the SUBS on the countdown path,
  nz from the TST on the status path
details: 'Called with r5 = overworld player object. Reads the 16-bit countdown timer at

  Unk_18. If nonzero, decrements it (SUBS, which is why c/v reflect the

  decrement), stores it back, and returns 1 in r0. If the timer has already hit

  zero, it instead loads the 32-bit status word at Unk_50 and tests it against

  mask 0xC00000 (leaving r2 = 0xC00000 and nz set from the TST); if either of

  those two status bits is set it returns 0, otherwise it returns 1. So the

  function returns 1 in every case except "timer expired but still blocked by a

  0xC00000 status bit". Net effect: a fixed-length wait whose expiry can

  additionally be gated by the object''s status flags. The c/v outputs are

  side effects of the decrement rather than a deliberate return channel, but the

  register contract shows callers do observe them.

  '
