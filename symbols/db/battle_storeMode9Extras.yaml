name: battle_storeMode9Extras
address: '0x080F22F8'
kind: function
status: probable
summary: If the current battle mode is 9, calls two helper routines and stores their return values into
  the battle object's ExtraVars at offsets +0x10 and +0x18; otherwise does nothing.
interface: (r5 = battle object) -> void; r0 = battle mode clobbered, results of callees in r0
details: The function queries GetBattleMode and, only if the current battle mode equals 9, calls sub_80DFD74
  and sub_80C02A6, storing each result into the battle object held in r5 at oBattleObject_ExtraVars+0x10
  and +0x18 respectively. If the mode is anything else it does nothing. r4, r6, r7 are pushed/popped but
  unused, suggesting the register allocation was inherited from a larger original routine. The data blobs
  right after (off_2010A08/off_2010B08 with ids 0xA/0xB and byte tables) are not referenced by this function
  and likely belong to adjacent code. The purpose of mode 9 and what the two callees return are not visible
  here.
