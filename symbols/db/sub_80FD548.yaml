name: sub_80FD548
address: '0x080FD548'
kind: function
status: confirmed
summary: 'AI attack state: when the post-attack timer in `oAIAttackVars_Unk_10` reaches zero, play the recovery
  animation, commit the object to its future (panelX, panelY), refresh collision panels, and advance the AI state
  word to its next phase (`oAIAttackVars_Unk_10` = 4, `oAIAttackVars_Unk_00` = 8).'
interface: "void aiAttack_recoverCommit(r5 = BattleObject* this, r7 = AIAttackVars* vars, lr = return);\n  // clobbers\
  \ r0, r1, r2, r3, lr, N, Z, C, V\n  // preserves r4, r6\n  // no return value\n"
details: "Operates on the per-object battle struct (R5) and the per-attack AI vars struct (R7).\nDecrements the\
  \ halfword at offset `oAIAttackVars_Unk_10` once per call (the\n\"0x0B8010Unk_10\" and \"0x0B8010Unk_00\" offsets\
  \ denote offsets 0x10 and 0x00\ninside the AI attack vars struct, not the value 8/4 themselves).\nEarly-exits\
  \ via BGT (greater-than zero, treating the halfword as signed), so the\nfunction only takes effect on the frame\
  \ the timer transitions to ≤ 0.\nRecovery path:\n  - sets `oBattleObject_CurAnim` = 3 (recovery/slide animation),\n\
  \  - copies `oBattleObject_FuturePanelX`/`FuturePanelY` into the live\n    `oBattleObject_PanelX`/`PanelY`,\n\
  \  - calls `object_removePanelReserve`, `object_setCoordinatesFromPanels`,\n    `object_updateCollisionPanels`\
  \ (r1 is left as whatever\n    `object_updateCollisionPanels` returned on the not-taken path it is\n    unchanged\
  \ — on the taken path r1 holds the y panel used in the call),\n  - seeds the next AI state by writing 4 into `oAIAttackVars_Unk_10`\
  \ and 8 into\n    `oAIAttackVars_Unk_00` (4 = frames-until-NextPhase, 8 = next phase/state id).\nThe \"commit\"\
  \ semantics: the object's planned panel move (FuturePanelX/Y) is\npromoted to its current panel, releasing any\
  \ prior panel reservation and\nrebuilding the collision grid; this is the follow-through after an AI-driven\n\
  move or attack decision.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
