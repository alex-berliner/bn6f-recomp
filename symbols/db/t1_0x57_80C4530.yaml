name: t1_0x57_80C4530
address: '0x080C4530'
kind: function
status: confirmed
summary: Task/state-machine step for a battle object that dispatches to the handler selected by the object's CurState
  byte.
interface: void t1_0x57_80C4530(r5=battleObject, r10=forwarded_arg); effects in r5/r8-r12 come from the invoked
  handler, no registers preserved beyond what the callee leaves
details: 'Thin dispatcher (likely a task/tick callback, hence r5/r10 calling convention): reads [r5 + oBattleObject_CurState]
  and indexes the 3-entry table at off_80C4544 with the raw byte (no bounds clamp). The selected handler is tail-called
  via bx with r0 = object (mov lr, pc / bx r1 pattern, thumb bit set in table entries). Handlers: state 0 = battleObject_initFromRelatedAndLoadSprite_80C4550,
  state 1 = battleObject_copyStateAndSyncSpriteFromRelated_80C458C, state 2 = object_freeMemory. So the object appears
  to spawn from a related object, mirror its state/sprite, and then free itself - a short-lived derived/spawned-object
  lifecycle. r10 is passed through untouched for the handler''s use; r5/r8-r12 afterwards are whatever the handler
  left, so this wrapper imposes no contract of its own.

  '
