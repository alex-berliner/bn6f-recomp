summary: Handles a "story 7" on-touch BBS by clearing/storing event flags and then running the player NPC script-array
  trigger via reqBBS_81409E4.
interface: (r0 = unused, r1 = 0x40, r2 = 0, r3 = pointer/word 0x02001d25) -> r0 = 0, NZ+C+ flags cleared ; no other
  caller-visible state
details: 'Behaviour inferred from captured-call snapshots (r0=0, r1=0x40, r2=0, r3=0x02001d25 fixed across

  all 40 captures) plus the direct callees listed. The block reads/writes a few event/story flags

  using SetEventFlag / SetEventFlagFromImmediate / TestEventFlag / TestEventFlagFromImmediate

  (r10 is the toolkit, so flag IDs live in the EventFlags block) and ultimately tail/forward-calls

  reqBBS_81409E4 (which polls the OW player''s NPC script-array for a coord-touch trigger such as

  an on-touch BBS). The "snap_story7_*" capture names and the r1=0x40 story-tag word are the only

  hints at the story-7 chapter context.

  Because assembly was not produced (sub_8083C6C not found in bn6f/asm), the exact flag IDs,

  branch order and r4/r5 usage shown in the in/out contract cannot be re-checked. The contract''s

  `out` includes many caller-saved regs that are clobbered by the BBS helper, consistent with this

  being a thin wrapper that sets up r4/r5/r10/lr for reqBBS_81409E4.

  Return value is 0 with Z+C clear at exit (flags "-ZC-" / "----" at entry means NZ+C are *set*

  on exit of the captured snapshot frame, while a different snapshot shows "-ZC-"; treat as

  probable not certain).

  '
