name: spawn_panelObjectInitAndDispatch
address: '0x080DF34C'
kind: function
status: probable
summary: Initialization (sets Z, loads sprite 0x80 with animation 3 and palette 0, applies flip, advances
  to CUR_STATE_UPDATE) and per-frame CurAction dispatch over a five-entry handler table, with early returns
  to CUR_STATE_DESTROY when the battle ends or a time-stop is active.
interface: (r5 = battle object header) -> r0 = state (CUR_STATE_UPDATE on init, CUR_STATE_DESTROY when
  battle over); touches oBattleObject_Z, Flags, CurAnim(+Copy), CurAction, CurStateActionPhaseAndPhaseInitialized
details: 'The entry block is an object constructor: it recomputes the object''s pixel position from its
  panel coordinates, stores 0xFF0000 into oBattleObject_Z, loads sprite resource (0x80, 0x10, 0x1d) via
  sprite_load, removes the shadow with sprite_noShadow, sets object Flags bit 1, selects animation 3 (also
  mirrored into CurAnimCopy), loads the animation data, sets palette 0 and the flip from object_getFlip,
  then advances the state machine to CUR_STATE_UPDATE. The second block (loc_80DF390) is the update routine:
  it returns early doing nothing when the battle is over (transitioning the object to CUR_STATE_DESTROY)
  or when a time-stop freezes the battle, otherwise it reads oBattleObject_CurAction and calls the matching
  handler from the five-entry table at off_80DF3B8 via the bl lr; bx r1 dispatch idiom.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels then str 0xFF0000 -> [r5,#oBattleObject_Z] and bl sprite_load(0x80,0x10,0x1d):
    panel-spawned object setup; mov r0,#3; strb to CurAnim and CurAnimCopy, then sprite_setAnimation /
    sprite_loadAnimationData / sprite_setPalette(0) / sprite_setFlip(object_getFlip()): full sprite init;
    str CUR_STATE_UPDATE -> [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] hands control to
    the state machine; loc_80DF390: bl battle_isBattleOver / battle_isTimeStop guard, then ldrb CurAction;
    ldr r1,[r1,r0]; bl lr; bx r1 — per-frame action dispatch; off_80DF3B8 lists five handlers sub_80DF3CC..sub_80DF4B0,
    and battle-over path stores CUR_STATE_DESTROY'
