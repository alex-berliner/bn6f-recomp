open_questions:
- No callers are known, so which gameplay entity uses this routine (and thus what sprite 0x80/anim 3 depicts)
  is unidentified
- Meaning of the Z value 0xFF0000 (draw layer vs. world Z) is unconfirmed
- What the five action handlers at sub_80DF3CC..sub_80DF4B0 do, which would pin down the object's role
- The code confirms initialization (sprite 0x80, animation 3, palette 0, flip set, CUR_STATE_UPDATE) and
  the five-entry CurAction dispatch table at off_80DF3B8, plus the battle-over/time-stop guards. However,
  it never calls sprite_noShadow; the proposal cites an asm line that doesn't exist. Also 'spawn_panel'
