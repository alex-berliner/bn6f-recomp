name: ai_attackEmergeSetNaviStatsFlag
address: '0x080158CC'
kind: function
status: probable
summary: 'Called during the enemy attack-emerge step. Sets NaviStats byte 0xE to 0x80 for the object''s
  alliance, then if battle mode != 1 checks NaviStats byte 0x2C: values 0xB–0x16 clear the AI counter-hit
  chain, values > 0x16 call sub_8014466, values < 0xB do nothing.'
interface: (uses caller's r5 = battle object; no register args) -> r0/r1 clobbered, no return value
details: 'The function looks up the NaviStats table entry for the battle object''s alliance and stores
  0x80 into its byte at offset 0xE, presumably a per-side state/counter used while the enemy is emerging
  for an attack. It then re-reads the battle mode and returns immediately if mode == 1, so the follow-up
  only happens in the other modes. Otherwise it reads NaviStats byte 0x2C for the same side (via the byte
  getter that takes the object in r5) and range-checks it: values 0xB–0x16 lead to ai_clearCounterHitChainFlag
  (chain reset to the 0xFFFF ''none'' sentinel), values above 0x16 go to the unknown sub_8014466, and
  values below 0xB do nothing further. Byte 0x2C behaves like a character/enemy ID selector, with 0xB–0x16
  naming one class of fighters and higher values another, but the field meanings of both 0xE and 0x2C
  are not established by this snippet.'
