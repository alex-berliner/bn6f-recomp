open_questions:
- Meaning of NaviStats byte 0xE and why it is set to 0x80 here (invulnerability/cooldown/state flag?)
- Meaning of NaviStats byte 0x2C (character/enemy ID?) and what ID ranges 0xB–0x16 vs >0x16 denote
- What sub_8014466 does for IDs above 0x16 (presumably the non-counter-hit branch)
- Whether other callers besides the emerge step exist and confirm the 0xE=0x80 meaning
- The summary matches the code well, but the name should probably be revised. The function is called from
  ai_attackEmergeAtTargetPanel and uses battle-object context (r5), touching NaviStats fields after writing
  0x80 at offset 0xE. The proposal's prefix 'ai_' and 'attackEmerge' capture this, but a slightly more
  precise name reflecting the NaviStats write would be clearer.
