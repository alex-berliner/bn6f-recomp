summary: 'Proposed name: eOverworldMapTilemap. 508-byte (256-halfword) overworld tilemap buffer redrawn
  around the player by the camera (table of u16)'
details: Lives in EWRAM at 0x02026404 and spans 508 bytes, matching a 34-row × ~30-halfword-tile region
  of the overworld tilemap. ow_refreshMapTilemap passes the address straight to ow_blitTilemapBlockAndRedraw,
  and sub_8094720 zeroes the whole 0x1000/4-byte block before calling the same blit routine — strongly
  suggesting it is a tilemap scratch buffer the game re-fills each refresh. The neighbouring entry off_8094774
  points at unk_2025404 and off_809477C at eMapTilesState200be70, so this slot is one of several per-state
  overworld map buffers.
