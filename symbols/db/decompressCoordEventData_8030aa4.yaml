open_questions:
- Exact meaning of the four sections beyond the chatbox and object-55 stream (the names of sub_8030B0C and sub_8031600
  are still generic).
- Whether "INTERNET_MAP_GROUP_START" is a runtime constant or a build-time guard; the assembly comparison uses a
  literal.
- Whether pt_8033530 / pt_803354C also gate map existence (a null deref would indicate "no coordinate-event data
  for this map").
- Why this routine is called out separately rather than folded into map load — likely runs whenever the local event-data
  block needs refreshing, not only on map change.
