name: decompressCoordEventData_8030aa4
address: '0x08030AA4'
kind: function
status: confirmed
summary: Decompresses a map's LZ77-compressed coordinate-event record into the shared scratch buffer and dispatches
  its four sections (object table, map-script data, chatbox script, object-55 stream) to their respective loaders
  when the player enters a real-world or internet map.
interface: void decompressCoordEventData_8030aa4(s32 map_group /* r0 */, u32 map_number /* r1 */, u32 in_r4, u32
  in_r5, u32 in_r6, u32 in_r7, u32 in_r8, u32 in_r9, u32 in_r12) -> (r5, r6, r7, r8, r9, r12 restored to entry values);
  clobbers NZCV r0-r3, lr
details: "Picks the per-group record-pointer table based on whether the map is real-world (pt_8033530, indexed by\
  \ map_group) or internet (pt_803354C, indexed by map_group - INTERNET_MAP_GROUP_START), then walks table[group][map_number]\
  \ to obtain a compressed \"coordinate-event record\". The record layout is four u32 section offsets followed by\
  \ an LZ77 payload at +0x10; SWI_LZ77UnCompReadNormalWrite8bit expands the payload into the shared scratch buffer\
  \ DecompBuf_2027A00. The four offsets are then resolved against this buffer and each section handed to its consumer:\n\
  \  - offset +0x00 -> sub_8030B0C (likely object/coord-table loader)\n  - offset +0x04 -> sub_8031600 (map-script\
  \ or warp data)\n  - offset +0x08 -> chatbox_loadScriptWordAndResetScroll_803189C (map chatbox script)\n  - offset\
  \ +0x0C -> overworldObject55_ReadStreamEntry_8031A68 (object 0x55 stream)\nCallee-saved registers r4-r9 and r12\
  \ are pushed before the guest calls (which clobber them) and popped/restored into r8/r9/r12 and r4-r7 on return,\
  \ so callers observe their original values. lr is also pushed; the pop restores pc. The \"in_rN\" parameters in\
  \ the typed C form exist solely to model that round-trip.\n"
