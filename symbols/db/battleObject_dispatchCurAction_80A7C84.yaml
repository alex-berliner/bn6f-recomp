open_questions:
- The exact semantics of each of the three handlers (sub_80A7CA4/CEA/CF6) is not determined here; they
  would need to be analyzed to know what CurAction values 0/1/2 mean (probably CUR_STATE_INITIALIZE/UPDATE/DESTROY-style
  routing, but not confirmed).
- Whether r10 (Toolkit) is actually consumed by the callees or is just callee-saved here is not visible
  from this dispatcher alone.
