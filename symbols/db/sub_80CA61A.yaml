name: sub_80CA61A
address: '0x080CA61A'
kind: function
status: confirmed
summary: 'Per-tick physics update for a bouncing battle object: integrates vertical arc, resolves horizontal landing
  on the target panel, counts down bounces, and transitions to destroy when contact is lost or bounces are exhausted.'
interface: void battle_tickCollisionBounce(void); // inputs r4,r5,r7,r8; outputs r5,r8; preserves r4,r6,r7
details: "Called each tick for a battle object (r5) that is in a collision/bounce state.\n1. Calls object_removeCollisionData\
  \ (r4,r5,r7) then object_spawnCollisionEffect (r5) to\n   update the collision footprint and any visual spark.\n\
  2. Reads oBattleObject_CollisionDataPtr → oCollisionData_FlagsFromCollision; a nonzero\n   value means the object\
  \ is currently overlapping another entity, so it immediately\n   proceeds to the destroy path.\n3. Otherwise reads\
  \ oBattleObject_Z (16.16 fixed-point). If the high word (signed) is\n   below 0x14 the object is still in its\
  \ vertical arc: oBattleObject_ZVelocity is\n   integrated into oBattleObject_Z.\n4. At or above the threshold\
  \ the object has reached its target panel. It converts\n   (oBattleObject_PanelX, oBattleObject_PanelY) via object_getCoordinatesForPanels\
  \ to a\n   world X, integrates oBattleObject_XVelocity into oBattleObject_X, and uses\n   IsR2BetweenR0AndR1 to\
  \ detect whether X has crossed the target.\n   - Not yet crossed: refresh panels (setPanelsFromCoordinates, updateCollisionPanels)\n\
  \     and revalidate with object_isCurrentPanelValid.\n   - Crossed: decrement oBattleObject_Param1 (bounce counter,\
  \ signed 8-bit). If still\n     positive, revalidate; if zero or negative, proceed to destroy.\n5. Destroy path:\
  \ clears bit 1 of oObjectHeader_Flags, calls object_clearCollisionRegion,\n   writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized.\n\
  6. Always calls object_presentCollisionData (r1, r5, r8) at the end to refresh the\n   collision-region display;\
  \ returns r5 unchanged and r8 as written by that call.\n"
