name: battle_spawnOnLinkedObjectDefeat
address: '0x080C1492'
kind: function
status: probable
summary: 'AI handler step: if the object''s linked partner object is dead, spawn a follow-up battle object
  and put this object into a new timed action state.'
interface: (r5 = this battle object) -> r0 = 0 (or untouched value if partner alive); modifies this object's
  Timer and CurAction; uses r4 = 0x10000 and r7 = AIData+0x74 as spawn inputs
details: Loads the object's RelatedObject1Ptr and tests its HP field; if the partner is still alive the
  function returns immediately with r0 = 0. When the partner's HP has reached 0, it sets r7 = this object's
  AIDataPtr + 0x74 and r4 = 0x10000 and calls battle_spawnLinkedObject_80E1A6A to spawn a type-0x11 object
  cross-linked with this object. It then writes Timer = 0x20 and CurAction = 0x10 on the parent object,
  apparently entering a post-spawn/death-reaction state. Returns 0 in both paths. The AIData+0x74 slot
  likely holds the spawn descriptor for the follow-up object.
