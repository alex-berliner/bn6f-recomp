name: sub_80FD748
address: '0x080FD748'
kind: function
status: confirmed
summary: 'Enemy AI attack helper: if the object can move, ask the alliance''s panel-target routine for a destination,
  reserve that panel, lock sliding and start the slide anim; otherwise drop the AI flag and exit the attack state.'
interface: 'void sub_80FD748(struct BattleObject* r5, u32 r6, struct AIAttackVars* r7);

  // uses r5/r6/r7/lr in; clobbers r0,r1,r2,r3,r4,r6,r7,lr; flags NZCV

  '
details: "On entry the caller has r5 = the battle object, r6 = an AI/context pointer\nand r7 = the per-attack AI\
  \ vars struct.\n\n1. Calls object_canMove(r5). If it returns 0 (cannot move), clears\n   oAIAttackVars_Unk_1a\
  \ to 0 and calls object_exitAttackState; the AI\n   gives up the attack for this tick.\n\n2. Otherwise it indexes\
  \ a small table at byte_80FD798 by the object's\n   alliance byte (oBattleObject_Alliance << 3). Each entry is\
  \ a pair\n   of u32s used as extra arguments to the target-finder:\n     0x00,0x00, 0x01,0x00, 0x0A,0x00, 0x88,0x0F,\
  \ 0x20,0x00, 0x01,0x00, 0x80,0x00, 0x88,0x0F\n   (five 8-byte slots, indexed 0..4 by alliance).\n\n3. Reads the\
  \ target function pointer from oAIAttackVars_Unk_28 and an\n   argument from oAIAttackVars_Unk_2c, then tail-calls\
  \ (bx r1) the\n   function with r0=Unk_2c, r1=target_fn-as-arg, r2/r3=table pair.\n   The call's r0/r1 return\
  \ are the chosen future panel X/Y.\n\n4. If the target-finder returned 0 in r0 the AI again bails out\n   (clear\
  \ Unk_1a + object_exitAttackState). Otherwise it commits the\n   result: writes the panel X/Y to oBattleObject_FuturePanelX/Y,\n\
  \   calls object_reservePanel(panelX, panelY, obj), then\n   object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE, obj) to\
  \ lock sliding.\n\n5. Starts the slide animation: oBattleObject_CurAnim = 4,\n   oAIAttackVars_Unk_10 = 3, oAIAttackVars_Unk_1a\
  \ = 1,\n   oAIAttackVars_Unk_00 = 4.\n\nStructure fields touched:\n  r5: oBattleObject_Alliance, oBattleObject_FuturePanelX,\n\
  \      oBattleObject_FuturePanelY, oBattleObject_CurAnim\n  r7: oAIAttackVars_Unk_2c, oAIAttackVars_Unk_28, oAIAttackVars_Unk_10,\n\
  \      oAIAttackVars_Unk_1a, oAIAttackVars_Unk_00\n"
