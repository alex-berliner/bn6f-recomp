name: t4_0x12_80E1A90
address: '0x080E1A90'
kind: function
status: confirmed
summary: Per-state update dispatcher that runs the state-specific handler for a battle object (type 4) then refreshes
  its sprite.
interface: void t4_0x12_80E1A90(struct BattleObject* r5 /*battle object*/, void* r10 /*ctx?*/, lr);  // uses nz/c/v;
  clobbers r0-r4,r6-r7,r8,r9,r11,r12,lr; preserves nothing
details: 'Reads oBattleObject_CurState from the battle object in r5 and uses it as a byte

  index into a small jump table at off_80E1AA8 (entries at 0, 4, 8). Each entry is

  a Thumb handler entered with the standard `bx r1` thumb-call trick and r0 set to

  the CurState value; handlers are sub_80E1AB4, sub_80E1AFA, sub_80E1B0A. After

  the handler returns, control falls through to object_updateSpritePaused, so the

  sprite is always refreshed at the end of the tick regardless of state. The

  object-type tag "t4" (type 4) suggests this is one of several near-identical

  type-keyed dispatchers in the battle object table; r10 is forwarded into the

  called handler as a context pointer.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
