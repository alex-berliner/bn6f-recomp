summary: Queues a 0x600-byte tile/graphics chunk upload from the decomp buffer into VRAM at a per-object
  slot's offset.
interface: (r0 = unused by this routine; r5 = caller-set object struct whose byte at +0xD is the VRAM
  slot index) -> r0 = clobbered; no meaningful return
details: Computes a VRAM address as 0x6000000 + 0x600 * byte[r5+0xD], then calls QueueEightWordAlignedGFXTransfer
  to copy 0x600 bytes from eDecompBuffer2014A00 into that VRAM offset. The 0x600-byte chunk size and the
  decomp-buffer source suggest one decompressed sprite/graphics sheet bank per slot index. The function
  itself sets only r1/r2 from r5; r0 is loaded with the source pointer but the transfer routine takes
  its arguments in r0-r2 as set up here. Other literals in the pool (eDecompBuffer2013A00, unk_2014000,
  byte_2017A00) belong to sibling code around the caller, not this routine.
