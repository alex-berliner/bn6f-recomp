name: ai_attackDashMoveStep
address: '0x081107F2'
kind: function
status: probable
summary: 'Per-frame update for a dash/charge attack state: moves the object by its velocity, syncs panels
  mid-move, and on timer expiry commits it to the target panel and switches to the next attack state.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; object fields X/Y updated, AIAttackVars
  step/attack state mutated
details: Each call adds oBattleObject_XVelocity/YVelocity to the object's X/Y, so it flies along a straight
  path. When oAIAttackVars_StepTimer equals oAIAttackVars_ChargeCycles it syncs PanelX/Y and the collision
  record from the current position (object_setPanelsFromCoordinates + object_updateCollisionPanels). It
  decrements StepTimer every frame; when it goes negative, it copies FuturePanelX/Y into PanelX/Y (committing
  the pre-reserved destination), releases the panel reserve, snaps pixel coordinates to the panel grid,
  sets collision panels to current, sets HasMoved = 1, reloads StepTimer from oAIAttackVars_AttackDuration,
  and calls object_setAttack0(9) to enter attack state 9. So this is the travel phase of an AI attack
  that dashes from a reserved panel to a future panel before striking.
