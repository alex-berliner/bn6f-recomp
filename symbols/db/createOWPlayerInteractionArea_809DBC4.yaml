name: createOWPlayerInteractionArea_809DBC4
address: '0x0809DBC4'
kind: function
status: confirmed
summary: Builds an OW interaction area on the player object using a template struct's offsets plus the player's
  world position, then stores the new handle at the caller-supplied output pointer.
interface: "void sub_809DBC4(u32 area_struct /* r0: ptr to ow_player_interaction_area_struct template */,\n    \
  \             u32 out_handle_ptr /* r1: ptr to write the created area handle into */,\n                 u32 player_obj\
  \ /* r5: ptr to OW player object */);\n// flags clobbered; r4, r5 (preserved across callee) preserved on return\n"
details: 'Clears the caller''s handle word at *r1 to 0, then resolves a world-space interaction

  area by adding the player object''s X/Y/Z (offsets oOWPlayerObject_X/Y/Z) to the

  template struct''s local offsets (oOWPlayerInteractionArea_XOffset/YOffset/ZOffset).

  Pulls radius (oOWPlayerInteractionArea_Radius_ZReachAmount) and the flag pairs

  oOWPlayerInteractionArea_Flags_10 and _Flags_14 from the template, and tail-calls

  createOWObjectInteractionArea_80037ac with the standard r0=world_x, r1=world_y,

  r2=world_z, r3=radius, r4=flags_10, r5=flags_14, r6=out_handle_ptr, r7=area_struct

  convention. r5 (player pointer) is pushed/popped so it survives the tail call.

  Sits next to three arrays of 8 templates (off_809DC0C and off_809DCEC, plus the

  single byte_809DBF4) encoding directional interactions around the player: the first

  array uses 0x80000/0x5a826 offsets (radius 8, OW_OBJECT_INTERACTION_AREA_FLAG_0x1

  with 0x20000|0x40000), the third uses 0x40000/0x2d413 offsets (radius 4,

  0x200000 with 0x400000|0x800000) - the radii are sub-tile fractions (0x80000 =

  half a tile, 0x40000 = quarter tile, 0x5a826 ≈ cos(30°)/2, 0x2d413 ≈ cos(60°)/2),

  giving a ring of 8 neighbour cells at two distances for interaction lookups.

  '
