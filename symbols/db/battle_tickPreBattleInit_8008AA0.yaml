open_questions:
- What sub_800A84E's return value of 1 actually represents (e.g. some battle-type flag
- re-using ACDC town music); and whether the r5+8 u16 timer double-acts as a "music id"
- reused value (the strh uses the same slot for both song-id lookup and timer — likely
- the r4 assignment is for a different field than the song id played; only r4 is stored,
- while r2 is the actual song id passed to PlayMusic). Settling it would require seeing
- the consumer of r5+8.
