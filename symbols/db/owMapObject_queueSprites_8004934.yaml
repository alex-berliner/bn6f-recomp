summary: 'Per-frame draw step for the overworld map-object table: for each of the 56 entries projects/culls,
  ensures gfx resident, queues OAM pieces when visible (or clears the queued count when hidden), then
  records the sprite-group palette count in slot 5.'
details: 'Loops r0 = 0x38 (56) entries at eOverworldMapObjects, stride 0x78 (sizeof OverworldMapObject).
  Per entry, on the flags byte at +0: bit 0x02 (visible) -> sprite_projectAndCull(obj+0xC coords), sprite_ensureGfxResident(5,
  obj), then sprite_queueFramePieces(2, 0x60, obj+0x40 SpriteData); only bit 0x01 (active) -> zero the
  word at obj+0x40+0x24 (queued-piece count) and, when bit 0 is set, still run sprite_projectAndCull so
  culling stays fresh. All sprite calls use the mov lr,pc / bx long-call pattern. After the loop sub_80028C0(5)
  records dword_200F340''s palette count into slot 5 of byte_200F389 (the same bookkeeping as the player
  draw step''s slot 0).

  '
