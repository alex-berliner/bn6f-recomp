open_questions:
- What Param3==1 semantically represents (likely "force dispatch even if related object isn't doing action
  0xB", e.g. own-init or queued action) — would settle by reading oBattleObject for the Beast-SP type
  and any code that sets Param3=1 before this call.
- Whether the off_80E3A70 table is meant to grow with more CurAction handlers or whether sub_80E3A74 itself
  re-dispatches on CurAction is unknown without disassembling 0x80E3A74.
