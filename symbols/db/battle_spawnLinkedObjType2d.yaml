name: battle_spawnLinkedObjType2d
address: '0x080C0F52'
kind: function
status: probable
summary: Spawns battle object type 0x2D attached to a parent object, giving it a byte parameter and the
  parent's alliance/direction-flip setting.
interface: (r0 = parent BattleObject*, r1 = byte param, r2/r3 + stack forwarded to spawn) -> r0 = new
  BattleObject* or 0; flags from spawn's null-check branch
details: Saves r0/r1, calls object_spawnType1 with object index 0x2D and the remaining forwarded arguments,
  receiving the new object pointer in r5. If the spawn fails (pointer 0) it returns immediately. On success
  it stores the original r0 object pointer into the new object's RelatedObject1Ptr, stores the original
  r1 low byte into oBattleObject_Param4, and copies the 16-bit AllianceAndDirectionFlip field from the
  parent object to the spawned one so the child shares its alignment and facing. The parent link plus
  copied alliance/flip strongly suggests a helper-type entity (summon/attachment) that fights on its parent's
  side and mirrors its direction.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: mov r0,#0x2d; bl object_spawnType1 — spawns battle object type 0x2D with forwarded args;
    asm: pop {r1,r2,r5} restores original r0 into r1, which is then stored to oBattleObject_RelatedObject1Ptr;
    asm: strb r2,[r0,#oBattleObject_Param4] writes the original r1 byte argument into Param4; asm: ldrh/strh
    of oBattleObject_AllianceAndDirectionFlip copies alliance+flip from parent to child; callee summary:
    object_spawnType1 returns the BattleObject in r5, matching mov r0,r5 and the beq null-check'
