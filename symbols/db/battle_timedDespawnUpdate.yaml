name: battle_timedDespawnUpdate
address: '0x080BD1DA'
kind: function
status: probable
summary: Battle object update handler that plays animation 4 for 4 frames, then clears its active flag
  and destroys the object.
interface: (r5 = battle object ptr; r0 = scratch) -> r0 clobbered by callee; sets object state to CUR_STATE_DESTROY
  when timer expires
details: On first invocation (oBattleObject_PhaseInitialized == 0) it sets oBattleObject_CurAnim = 4,
  calls sub_80B8E58 with r0 = object->ExtraVars+4 (a pointer field, likely the object's data/aux pointer),
  sets oBattleObject_Timer = 4, and marks the phase initialized. Every tick it decrements oBattleObject_Timer;
  once it goes negative it clears bit 1 (0x2) of oObjectHeader_Flags (likely the 'active/visible' bit)
  and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized, so the object
  is removed after its 4-frame lifetime. This reads like a generic short-lived effect object handler rather
  than enemy logic.
