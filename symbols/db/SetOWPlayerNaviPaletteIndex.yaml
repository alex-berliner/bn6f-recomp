name: SetOWPlayerNaviPaletteIndex
address: '0x0809E2FE'
kind: function
status: confirmed
summary: Stores the chosen navi palette index for the overworld player sprite into the engine struct at 0x2000aa0
  (field byte_2000AA5).
interface: void SetOWPlayerNaviPaletteIndex(u8 paletteIndex /* r0 */); returns r3 = pointer to eStruct2000aa0
details: Loads the base address of eStruct2000aa0 (0x2000aa0) into r3 and stores the low byte of r0 at offset 5
  (byte_2000AA5), which the caller-side analysis identifies as the overworld player navi's palette index (the palette
  used to recolor MegaMan for whichever navi/LinkNavi color is selected in the overworld). No other fields are touched,
  no flags or other registers modified; r3 is left pointing at the struct base (clobbered as a pointer scratch by
  this two-instruction routine), so callers that read r3 back get the struct address. The lr is returned via mov
  pc, lr (plain thumb return, no stack frame).
