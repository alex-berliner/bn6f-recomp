name: ai_attackStepPanelMove
address: '0x08104586'
kind: function
status: probable
summary: 'AI attack step: once the step timer expires, asks the per-alliance panel-choose callback for
  an (x,y) panel, snaps the object there, updates coords/collision, marks z=0xFF, clears a matching entry
  from a four-slot id table, and arms the hit phase (HitElement=8); otherwise aborts the attack.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 0; moves object to chosen panel and sets
  oAIAttackVars_HitElement=8, or clears HasMoved and tears down the attack
details: Each invocation decrements oAIAttackVars_StepTimer and returns until it expires. It then indexes
  byte_81045D8 by oBattleObject_Alliance (stride 8) and calls the stored panel-choose callback (oAIAttackVars_PanelChooseCallback)
  with the two table words plus oAIAttackVars_TargetObjectPtr; the callback returns an x/y in r0/r1. On
  success it writes that panel to FuturePanelX/Y and PanelX/Y, recomputes pixel coordinates and collision
  panels, sets oBattleObject_Z16 to 0xFF (reappear/rise-from-ground height), clears the object's collision
  region, and clears a matching id record in the byte_203EB50 table (likely a reserved/warp marker). It
  then sets oAIAttackVars_HitElement to 8, handing off to the attack's hit phase. If no panel is returned
  it clears oAIAttackVars_HasMoved and calls object_exitAttackState_801171C to abort the attack.
