name: pickWeightedIndex_8000E3A
address: '0x08000E3A'
kind: function
status: confirmed
summary: Picks a weighted-random index from a u8 weight table, stirring the RNG and using the current
  frame counter.
interface: u32 sub_8000E3A(const u8* table /* r0 */, s32 count /* r1 */, void* toolkit /* r10 */) -> r0
  chosen index, r2 chosen index, r3 last table byte read; clobbers r1, nzcv
details: "Weighted random selection over an array of u8 weights. r0 is the table base,\nr1 the entry count,\
  \ and r10 the toolkit (used only for the current frame\ncounter via oToolkit_CurFramePtr, which is then\
  \ masked with 3 to contribute\na 0..3 stir count). The routine:\n  1. Calls GetRNG once to get a 32-bit\
  \ draw; the top 2 bits give 0..3.\n  2. Reads the toolkit's current frame counter (u16 via the pointer\
  \ at\n     oToolkit_CurFramePtr) and takes its low 2 bits (0..3).\n  3. Sums the two as the number of\
  \ extra GetRNG draws to consume, and\n     loops calling GetRNG that many times (a \"stir\" of the RNG);\
  \ the final\n     raw draw is kept and masked to 16 bits as the roll value.\n  4. Sums the weight table\
  \ back-to-front (LD8 from index count-1 down to 0)\n     into a running total; the do-while reads one\
  \ entry even for count<=0,\n     matching the original's do-while with no length guard.\n  5. Calls\
  \ BIOS Div (swi 6) with the roll in r0 and the total in r1, then\n     takes the remainder (r1) + 1\
  \ as the target in [1, total].\n  6. Walks the table from index 0, accumulating weights until the running\n\
  \     sum >= target; the first index that meets the target is returned in\n     both r0 and r2. If the\
  \ walk reaches count before the target is met,\n     it falls back to index 0.\nr3 is left holding the\
  \ last table byte loaded during the walk (on the\nnormal exit that is the byte at the chosen index;\
  \ on the fallback path it\nis the last entry of the table, not index 0's byte). r4-r7 and lr are\npreserved\
  \ across the call. GetRNG and oToolkit_CurFramePtr live in other\ntranslation units and are not typed\
  \ here.\n"
