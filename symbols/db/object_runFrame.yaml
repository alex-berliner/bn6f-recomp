name: object_runFrame
address: '0x080DBFC0'
kind: function
status: probable
summary: 'Per-frame tick for one battle object: tear down/refresh its collision data, spawn any hit effect,
  dispatch its current action handler, and update its sprite.'
interface: (r5 = battle object pointer; uses no argument registers) -> r0 = handler/last-call result;
  flags clobbered
details: 'Acts as the main update driver for a battle object: it first removes stale collision data, spawns
  the hit-effect object for the object''s last collision, then indexes a 3-entry jump table (off_80DBFF4)
  with oBattleObject_CurAction and tail-dispatches to that action handler using the mov lr,pc/bx r1 ARM-THUMB
  interwork trick so the handler returns into the remaining steps. After the handler returns it advances
  the object''s sprite animation and finally refreshes/present the object''s collision state for this
  frame. The code after the first pop {pc} (clearing the collision region, storing 8 to [r5,#8], and clearing
  bit 1 of the flags byte at [r5]) belongs to one of the action handlers (likely the shared tail of sub_80DC000/18/AC),
  resetting the object''s collision region and a state flag.'
