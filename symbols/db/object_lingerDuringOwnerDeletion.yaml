name: object_lingerDuringOwnerDeletion
address: '0x080D51E4'
kind: function
status: probable
summary: Per-frame update for a battle object that survives while its related object is in the deleted
  action (0xB), running its own sub-state handler, and destroys itself otherwise.
interface: (r5 = battle object) -> void; destroys object by setting oBattleObject_CurState = CUR_STATE_DESTROY
  when battle is over, PhaseInitialized is set, or the owner's CurAction != 0xB
details: Spawns the hit-effect object for r5's last collision (jittered by GetRNG), then keeps the object
  alive only while battle_isBattleOver is false, oBattleObject_PhaseInitialized is 0, and the related
  object's oBattleObject_CurAction equals 0xB. When time is stopped it only calls object_presentCollisionData
  to refresh collision state; otherwise it dispatches through off_80D5230, a 2-entry table indexed by
  the object's own oBattleObject_CurAction (0 -> sub_80D5240, 1 -> sub_80D5280), implying two sub-states
  in this state. On any exit path it calls object_clearCollisionRegion, then sub_80D5348 (unknown), and
  sets oBattleObject_CurState to CUR_STATE_DESTROY. dword_80D523C (0x281E140A) looks like packed parameters/flag
  data sitting next to the table, probably consumed by the sub-handlers.
