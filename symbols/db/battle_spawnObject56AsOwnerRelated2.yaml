name: battle_spawnObject56AsOwnerRelated2
address: '0x08010FAC'
kind: function
status: probable
summary: Spawns battle object type 0x56 tied to a owner object and stores the new object as the owner's
  RelatedObject2 pointer.
interface: (r0 = arg passed to spawner, r1 = arg passed to spawner, r2 = halfword param, r5 = owner battle
  object) -> r0 = spawned object ptr, also written to r5->oBattleObject_RelatedObject2Ptr
details: 'A thin wrapper around battle_spawnObject56LinkedToOwner_80C44A8: it widens r2 to a halfword,
  then builds r4 = (r2 << 16) + 0x0D000000, a packed word apparently consumed by the spawner (r4 is not
  a standard arg register, so the callee must read it directly or the low byte 0x0D is a fixed sub-parameter).
  It passes r0/r1 through unchanged, calls the type-0x56 spawner that links the new object to the owner
  (inheriting alliance/direction, setting header flags 0x04|0x10), then saves the returned object pointer
  into the owner''s oBattleObject_RelatedObject2Ptr field. r5 holding the owner is set by the caller before
  the call. The packed 0x0D000000 constant suggests a fixed mode/variant for this spawn site.'
