name: chatbox_flagResolve_8125254
address: '0x08125254'
kind: function
status: confirmed
summary: Resolves a pending chatbox-related event flag by closing the chatbox and clearing flag 0x1711,
  otherwise exits the pet menu back to the map.
interface: void chatbox_flagResolve_8125254(void) -> u32 r0 (nonzero if chatbox flag was set), flags nz
  set from r0, c/v/clobbered
details: "Reads event flag \"0x1711\" (EVENT_CHATBOX_FLAG). If set:\n  - calls chatbox_8040818 (close\
  \ chatbox)\n  - calls chatbox_clear_eFlags2009F38 with r0=0x40 to clear bit 0x40 of the chatbox eFlags\
  \ word at 0x02009F38\n  - clears event flag 0x1711\n  - returns 1\nIf the flag is clear:\n  - calls\
  \ pet_menuExitToMap_811F708 to leave the pet menu and return to the overworld map\n  - returns 0\nLikely\
  \ used as a per-frame or input-handler dispatcher that decides whether the current\noverlay (chatbox)\
  \ needs to be torn down or the pet menu needs to back out to the map.\n"
