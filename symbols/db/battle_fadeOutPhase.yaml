name: battle_fadeOutPhase
address: '0x08009F5E'
kind: function
status: probable
summary: Battle sub-phase that fades the screen out, then stops music, clears objects, and advances the
  battle state
interface: (r0-r4 unused, r5 = battleState struct) -> void; sets oBattleState_Index_00 = 8 when fade completes
details: A per-frame battle sub-phase handler using the battleState struct pointed to by r5. On first
  run (oBattleState_SubPhaseInitFlag == 0) it calls SetScreenFade(0xC, 0x10) and sets the init flag to
  4. On later frames it polls IsScreenFadeActive; once the fade is no longer active it calls musicGameState_8000784
  to stop BGM, frees all objects of type 0x1A via FreeAllObjectsOfSpecifiedTypes, and writes 8 to oBattleState_Index_00
  to move to the next battle state.
