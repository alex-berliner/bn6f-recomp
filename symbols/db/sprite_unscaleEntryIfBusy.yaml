open_questions:
- What state values the low 2 bits of entry+0x11 represent and which caller context (sub_812A424) sets
  them
- Why sprite_makeUnscalable is called with r0 still holding the state byte rather than the entry pointer
  — whether it takes the value or re-derives the object from context
