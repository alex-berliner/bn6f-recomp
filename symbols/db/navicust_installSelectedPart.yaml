name: navicust_installSelectedPart
address: '0x081364E8'
kind: function
status: probable
summary: 'Navi Customizer: commits the currently selected program placement onto the customization board
  and refreshes the affected UI state.'
interface: (r0 = program/flag id used with flag base 0x2660; r5 = NaviCust screen-state struct) -> r0
  = undefined; sets [r5+0xc]=0x10, [r5+2]=8, saves cursor [r5+0x24]->[r5+0x3a], [r5+0x20]->[r5+0x38]
details: Tests event flag 0x2660 + r0 (the flag range looks like per-program 'installed' state for the
  Navi Customizer), though the result (r4) is stored but never used — a likely leftover. It then calls
  sub_813BA08 with r0=id and the selected cell coordinates [r5+0x28]/[r5+0x2c] and byte [r5+0xe] (probably
  grid X/Y and part color or slot data), then sub_813B950 with the same struct and coordinates, both presumably
  updating the board/occupancy. It rebuilds the key-item/program list via submenu_rebuildKeyItemList,
  then sets state bytes [r5+0xc]=0x10 and [r5+2]=8 (screen/phase and cursor step), and stashes the list
  cursor and scroll offsets into [r5+0x3a]/[r5+0x38] so the redraw preserves position. Called from navicust_confirmPartPlacement,
  this is the branch that actually applies a confirmed placement.
