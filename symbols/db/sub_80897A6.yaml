name: sub_80897A6
address: '0x080897A6'
kind: function
previous_names: []
status: hypothesis
summary: Advances an actor (r5 = BattleObject) through one beast-out power-charge tick, kicking off a PwrAtk if
  the B-button is held and the chatbox isn't running.
interface: '(r5 = *BattleObject) -> r0 = 1 ; side effects: writes [r5,#0x00] = 0x0C, 0x0A or 0x20 and may write
  timer/state fields via callees'
details: "1. Reads the BattleObject+0x13 byte (in AIData this overlaps Unk_13 / BeastOutAPwrAtk area); `tst r0,r0`\
  \ short-circuits if it is non-zero, treating that as \"already firing\" — function returns 1 with no further work.\n\
  \  2. Otherwise tests chatbox bit 0x80 of eFlags2009F38 via `chatbox_mask_eFlags2009F38(0x80)`. If the chatbox\
  \ is mid-text, function also just returns 1 (no state change).\n  3. Calls `chatbox_GetState_8045F4C`. If state\
  \ != 0 it routes to `sub_8089D26` then writes 0x0C into `[r5,#0x00]` — i.e. an AIData/AIState sub-state 0x0C.\n\
  \  4. If chatbox state == 0 it instead calls `sub_8089D0E`, refreshes the beast-out PwrAtk setup through `battle_getScenarioEffectStateField_81421D0`\
  \ + `sub_81421B2`, clears the B-button with `sub_80468EC(1)`, queues an event with `sub_8089CB0(0x0A)`, and writes\
  \ 0x20 into `[r5,#0x00]` (likely a `PwrAtkCurChargeTime` reset / beast-out charge timeout).\n  5. Returns 1 in\
  \ r0 (constant).\n  The two terminal byte writes (0x0C and 0x20) hit byte 0 of `[r5]`, which for an AIData struct\
  \ is `ActorType` — that's suspicious; r5 may in fact be the AIData pointer rather than the BattleObject itself,\
  \ or the byte is being repurposed as an AI sub-state.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `[r5,#0x13]` then `tst r0,r0` / `bne loc_80897E4` (`ldrb r0,[r5,#0x13]`); that offset is the AIData
    `Unk_13` byte, used as a "beast-out charging?" sentinel. - `mov r0,#0x80` / `bl chatbox_mask_eFlags2009F38`
    followed by `bne loc_80897E4` guards on chatbox-running flag 0x80. - `bl chatbox_GetState_8045F4C` then `cmp
    r0,#0` / `beq loc_80897C8` — branches on chatbox state == 0 vs nonzero. - The "state != 0" branch ends with
    `strb r0,[r5]` after `mov r0,#0xc`; the "state == 0" branch ends with `strb r0,[r5]` after `mov r0,#0x20`. Both
    are the "next phase" written to the struct pointed at by r5. - `bl sub_8089D0E` and `bl sub_81421B2` paired
    with `battle_getScenarioEffectStateField_81421D0` suggest a beast-out / cross-version power-charge helper chain
    (the 0x1421xxx range is in the "scenario effect" battle helpers per callee names). - `bl sub_80468EC` is called
    with `mov r0,#1` then `bl sub_8089CB0` with `mov r0,#0xa`; this is consistent with clearing the B button and
    queueing a battle event id 0x0A. - 40 captured invocations, all with r5 ∈ IWRAM (0x02001f6f) and r1=0x080895c0
    / lr=0x080895b8 — caller is the same per-frame dispatcher at 0x080895b8, consistent with a per-frame battle
    step. - Final `mov r0,#1` / `pop {r4-r7,pc}` — always returns 1.'
