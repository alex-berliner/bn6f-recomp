open_questions:
- Whether r5 is `*BattleObject` or `*AIData`; the final `strb` lands on offset 0, which would be `ActorType` in
  AIData but `ObjectHeader.Flags` in BattleObject. The 0x13 read strongly suggests AIData, so the write at offset
  0 is likely an AI sub-state, not ActorType.
- The exact meaning of the two terminal values (0x0C vs 0x20) and of `sub_8089D0E` / `sub_8089D26` — knowing which
  other AI handlers read these states would settle the role.
