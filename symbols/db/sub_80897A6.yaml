name: sub_80897A6
address: '0x080897A6'
kind: function
previous_names: []
status: hypothesis
summary: Beast Out AI guard — if Unk_13 set or eFlags2009F38 bit 0x80, exit; otherwise branch on chatbox state to
  set beast-out phase 0x0C (else path) or 0x20 (default path)
interface: '(r5 = AIData ptr) -> r0 = 1 ; side effects: writes AIData+0x00, possibly +0x13'
details: "Tests `AIData.Unk_13` (r5+0x13). If non-zero or if `chatbox_mask_eFlags2009F38(0x80)` returns\n  set,\
  \ falls through to `loc_80897E4` and returns 1 with no other work.\n  Otherwise reads `chatbox_GetState_8045F4C()`.\
  \ On non-zero state, calls `sub_8089D26`,\n  sets `AIData.ActorType` field at r5+0 (write 0x0C) and returns 1.\n\
  \  On zero state: calls `sub_8089D0E`, `battle_getScenarioEffectStateField_81421D0`,\n  `sub_81421B2`, then `sub_80468EC(1)`,\
  \ `sub_8089CB0(0x0A)`, and finally writes 0x20\n  to r5+0, then returns 1.\n  Reads r5 (= AIData pointer) as the\
  \ sole input. Always returns 1 in r0; no other\n  caller-meaningful registers. Looks like the AI handler for the\
  \ beast-out mode's\n  gating condition (linked to chatbox state and a scenario-effect field).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#0x13]; tst r0, r0` reads AIData Unk_13. - `mov r0,#0x80; bl chatbox_mask_eFlags2009F38;
    bne loc_80897E4` early-exits when flag bit 0x80 of eFlags2009F38 is set. - `bl chatbox_GetState_8045F4C; cmp
    r0,#0; beq loc_80897C8` splits on chatbox state 0. - `mov r0,#0xc; strb r0,[r5]` writes 0x0C to AIData offset
    0 in the else branch. - `mov r0,#0x20; strb r0,[r5]` writes 0x20 to AIData offset 0 in the default branch. -
    `sub_8089D26` is the only call taken before writing 0x0C; default branch invokes the chain `sub_8089D0E` → `battle_getScenarioEffectStateField_81421D0`
    → `sub_81421B2` → `sub_80468EC(1)` → `sub_8089CB0(0x0A)` before writing 0x20. - All captured-call entries return
    r0=1 with flags ----, confirming the unconditional return-1 contract.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080897A6

