open_questions:
- Whether [r5] is the high-level state byte vs. [r5+0x13] being checked separately is unclear; this looks like the
  function may intentionally write a state that the early-out guard doesn't read.
- True semantic of `0xc` vs `0x20` state values (animation? sub-state of beast-out?) needs context from callers;
  tracing the surrounding dispatcher at 0x080895c0 would settle it.
