name: owMapObject_weatherTornado_getParams_80A916C
address: '0x080A916C'
kind: function
status: confirmed
summary: Returns the address of the 0x10-byte weather-tornado parameter record for the tornado instance stored in
  the given overworld map object, selected by current map.
interface: u32 *owMapObject_weatherTornado_getParams_80A916C(owMapObject *obj /*r5*/, Toolkit *toolkit /*r10*/);
  // r0 out; clobbers r1-r3 and flags
details: 'Reads the toolkit''s GameState pointer and picks a table index: if oGameState_MapGroup equals 0x85 (the
  underground group) the fixed index 3 is used regardless of map number, otherwise oGameState_MapNumber is used.
  The index selects one of four base pointers from the table at byte_81436B4 / byte_81436C4 / byte_81436E4 / byte_8143704
  (accessed indirectly through off_80A9190 -> off_80A9194, i.e. the table is an array of pointers to per-map record
  arrays). Each base points to an array of 0x10-byte records; the byte at [r5+4] of the map object selects the record,
  so the return value is base + obj[4]*0x10. The record presumably holds the tornado object''s per-instance parameters
  (e.g. position/timing) for that map. Map group 0x85 forcing entry 3 is a quirk: underground maps always share
  the last table entry.

  '
