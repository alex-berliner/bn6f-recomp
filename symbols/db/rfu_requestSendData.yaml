name: rfu_requestSendData
address: '0x081471D8'
kind: function
status: probable
summary: RFU wrapper that issues a 3-byte-offset sendData via rfu_NI_setSendData; on success stores 4
  (pending) at [r0], sets 0x80 in word_200BC58, writes 0x83 to byte_20101B4; on failure stores 2 and the
  result code at [r0+2].
interface: (r0 = status struct ptr, r1 = payload byte/count base (sent as r1+3 to setSendData)) -> r0
  = 0; writes status byte [r0] (4 = busy/sent, 2 = failed) and byte [r0+2] = result code
details: Loads the current link slot/ID from byte_2010280 and passes it as the first arg to rfu_NI_setSendData
  together with byte_20101E0 (send buffer) and (r1+3) as length. If setSendData returns nonzero (failure),
  it stores 2 at [r4] and the truncated result code at [r4+2], leaving the caller to retry. On success
  it stores 4 at [r4] (request pending), sets bit 0x80 in the halfword at eS200BC50+8 (a busy/requested
  flag in some RFU state block), and writes 0x83 to byte_20101B4 (a state/phase byte, likely 'send in
  progress'). The caller sub_81472F8 invokes it from many sites, consistent with a state machine that
  retries the send until it completes.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl rfu_NI_setSendData with (byte_2010280, byte_20101E0, r1+3) — it is a direct wrapper of the
    librfu NI send call; beq loc_814721C after testing the setSendData result splits success/failure paths;
    failure path: mov r0,#2; strb r0,[r4]; strb r1,[r4,#2] stores the error code for the caller; success
    path: sets 0x80 bit at word_200BC58 and byte 0x83 at byte_20101B4, marking send-busy state; six call
    sites in sub_81472F8 show it is polled repeatedly, i.e. part of a send state machine'
