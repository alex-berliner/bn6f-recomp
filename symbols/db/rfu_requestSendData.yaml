open_questions:
- exact meaning of byte_2010280 (slot ID vs. target bitmap) and the layout of the eS200BC50/byte_20101B4
  RFU state structures
- what data byte_20101E0 contains and what the r1 argument counts (payload type vs. size offset)
- The proposal's description of failure/success is inverted. The asm at 0x081471FC shows `beq loc_814721C`
  is taken on r1==0, and loc_814721C (0x0814721C) stores 2 (failed) and r1 (result) into [r4+2]. The fall-through
  path (cmp !=0) stores 4 (success/pending), sets 0x80 in word_200BC58, and writes 0x83 to byte_20101B4.
  So the body description needs flipping, but the name `rfu_requestSendData` and overall purpose are accurate.
