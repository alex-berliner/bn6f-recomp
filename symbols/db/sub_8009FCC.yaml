name: sub_8009FCC
address: '0x08009FCC'
kind: function
status: hypothesis
summary: Walks a queue of pending 16-byte entries at 0x3002180 and dispatches each one to the handler sub_802FE28
  until the count at 0x3000EA8 runs out.
interface: void processPendingQueue_8009FCC(void); /* reads count from byte_3000EA8, entries from dword_3002180;
  r4-r7 preserved, r0-r3/c/v left over from the last sub_802FE28 call */
details: 'Reads a count from byte_3000EA8 and steps through a queue of 16-byte records starting at dword_3002180.
  For each record it loads the four 32-bit fields at offsets 0x00, 0x04, 0x08, and 0x0C and passes them as r0-r3
  to sub_802FE28, whose signature per its callers is roughly (u32 a1, u16 a2, int notUsed, int a4). The count is
  decremented before the call, and r6/r7 (the loop''s running count and entry pointer) are pushed/popped around
  the call because sub_802FE28 does not preserve them — evidence that the callee follows a different/looser register
  convention. The entry pointer advances by 0x10 each iteration via an add that sets carry/overflow, which is why
  c and v appear as outputs on exit. r5 is pushed/popped but never actually used; its presence in the save list
  is just convention. Without knowing what sub_802FE28 does, the subsystem is unknown — it could be a deferred call/message
  queue (e.g. sprite, battle, or text tasks queued during a frame and flushed here).

  '
