name: t1_0x2d_80C0E04
address: '0x080C0E04'
kind: function
status: confirmed
summary: Dispatches a battle object's current-state byte through a 3-entry handler table (states 0/1/2), threading
  the caller's r5-r12 live into the handler via bx.
interface: 'void t1_0x2d_80C0E04(void /* via r5: battleObject, r6-r12 live */)

  in:  r5 = battleObject, r6-r12 (live, passed through unchanged)

  out: r5, r8-r12 (live through to caller)

  clobbers nz c v, r0-r4, r6, r7, lr

  '
details: "Loads oBattleObject_CurState from the battle object in r5, looks up a handler\npointer in the table at\
  \ off_80C0E18, and dispatches via the ARM-Thumb \"mov lr, pc;\nbx r1\" idiom (table entries stored as +1 to switch\
  \ to Thumb).\nTable layout at off_80C0E18:\n  [state 0] -> sub_80C0E24\n  [state 1] -> sub_80C0EE2\n  [state 2]\
  \ -> object_freeMemory   (terminal state: frees the object)\nOn entry to the handler, r0 holds the state byte\
  \ and r1 holds the table entry\nitself (the looked-up handler address); r5-r12 are not touched by the dispatcher\n\
  itself and are observed live by the handler. No physical return — \"pop {pc}\"\nrestores lr from the stacked caller's\
  \ lr, so the handler returns to whoever\ninvoked this dispatcher via a normal BL.\nQuirks: pure \"mov lr, pc;\
  \ bx r1\" tail dispatch with no local stack frame; r1\ncarries the handler address (not its first argument) into\
  \ the callee; uses\noff_80C0E14 as an indirection pointer to off_80C0E18.\n"
