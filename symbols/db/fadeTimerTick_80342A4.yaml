name: fadeTimerTick_80342A4
address: '0x080342A4'
kind: function
status: confirmed
summary: Advances the screen-fade countdown for one frame, kicking off the next fade phase when it expires,
  then runs the post-fade update step.
interface: 'void fadeTimerTick_80342A4(void /* r5 = fade state ptr */);  // inputs: r5, r10, lr; outputs:
  r5, r8, r9, r10, r11, r12; clobbers nzcv r0-r3 lr; preserves r4-r9 r12'
details: "Operates on a small fade-state struct in r5 with at least two fields:\n  - byte at +1 (\"FADE_PHASE\"\
  ) set to 8 once the timer expires.\n  - u16 at +4 (\"FADE_TIMER\") decremented each frame while a fade\
  \ is active.\nFlow:\n  1. Calls IsScreenFadeActive; if a fade is in progress, decrements the\n     u16\
  \ at [r5+4] by 1.\n  2. If the new timer is <= 0, calls SetScreenFade(4, 0x10) and writes\n     the\
  \ literal byte 8 to [r5+1] to record the new phase.\n  3. Unconditionally tail-calls sub_80343B0 (\"\
  post_fade_update\") via\n     bl + pop {pc}, which uses lr as a return so the frame's pc line is\n \
  \    effectively a tail call.\nQuirk: the post-update call is reached even when no fade is active, so\n\
  the function doubles as a per-frame tick for whatever sub_80343B0 owns.\n"
