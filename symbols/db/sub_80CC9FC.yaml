name: sub_80CC9FC
address: '0x080CC9FC'
kind: function
status: confirmed
summary: Spawn a battle sub-object of type 0x44 linked to a parent battle object, inheriting panel coords, element,
  damage/state, and packed extra vars.
interface: '// r0..r3 = seeds (panelX, panelY, element, scratch); r5 = parent battle object;

  // r6 = damage/stamina damage word to copy; r7 = 4 packed bytes for ExtraVars[0..3];

  // lr = return address.

  // Returns r3 (parent''s AllianceAndDirectionFlip half-word, then 0 on early return path).

  // Clobbers r0,r1,r2,lr; NZ/C/V from the spawn call; preserves r4,r5,r6,r7.

  void battle_spawnLinkedSubObject_80CC9FC(void);

  '
details: "Allocates a 16-byte {r0-r2,r5} scratch slot on the stack, then calls\nobject_spawnType3 with type 0x44\
  \ to create a child of the battle object passed\nin r5. On failure (R0 == 0 after spawn), restores seeds and returns\
  \ with R3\nundefined (early-exit branch). On success it copies:\n  - panel X (low byte of seed r1) -> oBattleObject_PanelX\n\
  \  - panel Y (low byte of seed r2) -> oBattleObject_PanelY\n  - element (low byte of seed r3) -> oBattleObject_Element\n\
  \  - damage/stamina-damage word from r6 -> oBattleObject_DamageAndStaminaDamageCounterDisabler\nPacked extras\
  \ from r7 are unpacked into the four 32-bit slots of\noBattleObject_ExtraVars (0x0..0xC) via successive lsr+&0xFF.\n\
  Alliance/direction-flip half-word is copied from parent (R5) at\noBattleObject_AllianceAndDirectionFlip into the\
  \ child; the parent pointer\nitself is stored at oBattleObject_RelatedObject1Ptr of the child. Finally the\noObjectHeader_Flags\
  \ byte is OR-ed with 0x10 (\"has parent / linked object\" flag).\nQuirks: the early-exit test reads R0 as the\
  \ parent pointer because the spawn\nfailure path does `mov r0, r5`, so NZ reflects \"spawn returned 0\" while\
  \ r0 is\nrestated as the parent. The function saves its 3 seed words + r5 onto the\nstack so the spawner can freely\
  \ clobber r0-r3; this requires the 16-byte\n{r0-r2,r5} push slot to be paired with a matching pop ordering.\n\n\
  Register form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
