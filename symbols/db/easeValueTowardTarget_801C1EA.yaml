name: easeValueTowardTarget_801C1EA
address: '0x0801C1EA'
kind: function
status: confirmed
summary: Marks a state object as active/animating and moves a value one ease-out step toward a target value, clamping
  so it never overshoots.
interface: int easeValueTowardTarget(int value /*r0*/, int target /*r1*/, StateObj *obj /*r4*/); returns new value
  in r0, step taken in r2; flags set by the cmp against target (then possibly overwritten by the clamp path)
details: 'Sets bytes at r4+8 and r4+9 to 1, marking the owning object as active/in-motion (a

  two-byte "moving"/"enabled" pair). Then computes the step as

  ((value - target) >> 3) + 2 — i.e. an eighth of the remaining signed gap plus a

  constant floor of 2 — giving a classic ease-out: large steps when far from the

  target, small steps as it closes in, never smaller than 2 per call. The step is

  subtracted from the value; if the signed comparison (cmp r0, r1 / bge) shows the

  result has passed the target, the value is clamped to land exactly on target.

  Returns the new value in r0 and the step that was taken in r2, so callers can

  detect arrival (e.g. step magnitude or zero-gap). The arithmetic is signed

  (asr, bge), so the value may approach a target from either direction. The

  destination object struct is only touched at offsets 8 and 9 here; its full

  layout is unknown. Typical use would be HUD counters, gauge/bar fills, or menu/

  camera scroll positions easing to a destination over successive frames.

  '
