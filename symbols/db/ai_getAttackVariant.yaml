name: ai_getAttackVariant
address: '0x080EC934'
kind: function
status: probable
summary: Returns a per-AI flag byte from a constant table indexed by the battle object's AIIndex, used
  by the AI attack routine to vary behavior.
interface: (r5 = battle object ptr) -> r0 = aiVariantTable[oAIData_AIIndex]; no flags used
details: Loads the object's AIData pointer from oBattleObject_AIDataPtr, reads the AIIndex byte, and indexes
  the table at off_80EC944 to return one byte in r0. The table is 0x100's low bytes making entries 0-2
  = 0,1,1 and all later entries 0, so only AI indices 1 and 2 return 1. It is a pure lookup with no side
  effects and returns via mov pc, lr. The caller, the AI attack routine (charge-then-spawn projectile
  phases), presumably branches on the returned value to select an attack variant.
