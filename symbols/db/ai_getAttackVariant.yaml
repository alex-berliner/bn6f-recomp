- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r0,#oAIData_AIIndex] then ldrb r0,[r1,r0] shows a table lookup keyed by AIIndex; table
    at off_80EC944 contains 0,1,1,0,0,... so only AIIndex 1 and 2 yield nonzero; only known caller sub_80EC8A0
    is the AI attack routine with charge/spawn phases
