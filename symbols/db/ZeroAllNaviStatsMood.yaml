name: ZeroAllNaviStatsMood
address: '0x08015C32'
kind: function
status: confirmed
summary: Resets the Mood byte of every one of the 7 navi stats entries to 0.
interface: 'void ZeroAllNaviStatsMood(void); // in: r10 (context base, passed through to SetNaviStatsByte), out:
  r0-r3 clobbered by last helper call, flags from final cmp'
details: 'Loops i = 0..6 and calls SetNaviStatsByte(i, oNaviStats_Mood, 0) for each,

  clearing the Mood field of every navi stats entry (7 entries, likely the

  selectable/usable navis). The navi index is passed in r0, the stats field

  offset oNaviStats_Mood in r1, and the new value 0 in r2; r10 (carried

  through from the caller) evidently holds the base of the navi stats data

  or a context pointer used by SetNaviStatsByte. r4 is used as the loop

  counter and is preserved via push/pop. Nothing else is touched.

  '
