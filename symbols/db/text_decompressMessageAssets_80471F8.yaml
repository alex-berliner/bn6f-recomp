name: text_decompressMessageAssets_80471F8
address: '0x080471F8'
kind: function
status: confirmed
summary: LZ77-decompresses the three compressed blobs the message/text-script system works from (a scene-dependent
  blob plus two fixed text data files) into their EWRAM buffers.
interface: void uncomp_80471F8(u32* r5 /*handle*/); inputs r2,r3,r5 (r5 = pointer to a struct whose [0x1C] is a
  pointer to a sub-struct whose [4] holds the compressed blob address), r4-r7 preserved; outputs r2,r3,r4-r7 preserved;
  no flags contract
details: "Performs three SWI LZ77UnCompReadNormalWrite8bit calls in sequence:\n1. src = *(*(r5+0x1C)+4) -> dest\
  \ unk_2029A00. The source address is fetched\n   through the caller's r5 handle, so this blob is context/scene\
  \ dependent\n   (likely the current message/chatter data for the active scene or NPC).\n2. src = CompText873DE4C\
  \ (fixed ROM data, referenced as TextScript873D9FC+0x135)\n   -> dest eDecomp202BA00.\n3. src = CompText873ECC8\
  \ (fixed ROM data) -> dest eDecompressedTextArchive202DA00.\nThe 0x10000-byte-apart EWRAM destinations (2029A00,\
  \ 202BA00, 202DA00) suggest\nthree fixed-size 0x2000-ish text buffers used by the text engine. r2 and r3\nappear\
  \ in the caller contract but are never read by this function — callers\nmerely tolerate them being clobbered by\
  \ the SWI calls. r4-r7 and lr are\nsaved/restored around the work.\n"
