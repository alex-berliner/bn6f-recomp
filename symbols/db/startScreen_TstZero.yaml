name: startScreen_TstZero
address: '0x0803E930'
kind: function
status: confirmed
summary: Trivial helper that unconditionally sets the CPU flags as "zero" (Z set, N clear), letting callers take
  a "zero/equal" branch on purpose.
interface: 'void startScreen_TstZero(void) // in: lr only; out: Z=1, N=0 (C, V unchanged); clobbers r0'
details: 'Sets r0 = 0 and executes "tst r0, r0", which always compares 0 against itself:

  the result is always equal, so the Z flag is set and N is cleared. C and V are

  untouched by TST. The return is a plain "mov pc, lr" (interworking-capable return

  in ARM7TDMI terms since it''s a BX-like PC write from THUMB... actually a plain

  THUMB-to-THUMB return). The register contract confirms it: callers pass nothing

  but lr and read back only the flags, so the function exists purely for its flag

  side effect. This is the idiomatic "branch-always-as-if-equal" idiom: a caller

  can do "bl startScreen_TstZero; beq/beq-like target" to force a jump, or use it

  to make flag-dependent code take the zero path deterministically. Despite the

  original name suggesting a test of some value, no register or memory input is

  read — it is constant. Lives in the start-screen (startScreen_) code region, so

  it is presumably used by the title/start-screen flow (e.g., to fall through or

  jump based on a fixed condition).

  '
