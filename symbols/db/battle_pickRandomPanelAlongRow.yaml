  a random panel N panels away) is unconfirmed
- Exact meaning of panel flag bits 0x01800000/0x02800000 (likely player/enemy area ownership) and of the
  stack-passed count limit
- Why r5 (the battle object) is inherited from the caller rather than passed in a register
