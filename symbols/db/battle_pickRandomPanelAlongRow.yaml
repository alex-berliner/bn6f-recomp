name: battle_pickRandomPanelAlongRow
address: '0x08015CC0'
kind: function
status: probable
summary: Walks along a battle object's row in the direction opposite its alliance, collects panels matching
  an alliance-specific area flag once a per-call limit is reached, and returns one of them chosen at random
  plus the farthest matching panel.
interface: (r0 = start column, r1 = start row, r2 = required panel-flag mask, r3 = forbidden panel-flag
  mask, stack arg = panel count limit; r5 = battle object providing oBattleObject_Alliance/oBattleObject_DirectionFlip)
  -> r0 = chosen column (low nibble), r1 = chosen row (high nibble), r2/r3 = column/row of last panel
  matching the alliance mask; flags clobbered.
details: It negates object_getAllianceDirection for the object's alliance to get a step (sp+0x10), then
  loops from the start panel while object_isValidPanel holds. A table at byte_8015D78 indexed by alliance*4
  gives a panel-flag mask (0x01800000 for alliance 1, 0x02800000 for alliance 2) which is tst'd against
  object_getPanelParameters; each matching panel updates the saved 'last match' coords (sp+0x2c/0x30)
  and increments a counter, aborting once the counter exceeds the stack limit. Whenever the counter equals
  the limit, object_checkPanelParameters(r2=required, r3=forbidden) gates whether the panel's coords,
  encoded as col | row<<4, are appended to a byte list on the stack. If the list is non-empty, GetPositiveSignedRNG
  divided by the list length (BIOS Div, remainder in r1) picks a random entry, which is split into column
  (3 bits) and row (high nibble) for the return; the last matching panel coords are always returned in
  r2/r3.
