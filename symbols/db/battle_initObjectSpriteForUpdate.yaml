    run wf investigate investigate-20261018-223614'
open_questions:
- No known caller, so the identity of the entity using sprite 0x42 and the meaning of the 0x80/flag-bit-2
  arguments are unconfirmed
- What r0 carries on entry is unclear since all callees operate on global r5
