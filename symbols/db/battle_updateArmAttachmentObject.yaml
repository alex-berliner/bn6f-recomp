name: battle_updateArmAttachmentObject
address: '0x080D7E7A'
kind: function
status: probable
summary: 'Per-frame update for a timed battle object: counts its Timer down and destroys it when it expires
  or the battle ends.'
interface: (r5 = battle object pointer) -> r0 = 0 or destroyed; sets oBattleObject state to CUR_STATE_DESTROY
  when Timer <= 0 or battle over
details: This is an object update/state routine using the usual r5 = object convention. It first checks
  battle_isBattleOver; if the battle is over it immediately transitions the object to CUR_STATE_DESTROY.
  Otherwise it decrements oBattleObject_Timer; when the counter reaches zero or below it also destroys
  the object. While the timer is still running, it calls sub_80D7E98 each frame, which presumably handles
  the object's per-frame behavior (e.g. animation or arm-attachment positioning). This matches the known
  caller battle_initArmAttachmentObject, which spawns a sprite attachment at its parent's arm position.
