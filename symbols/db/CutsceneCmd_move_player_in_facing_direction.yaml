name: CutsceneCmd_move_player_in_facing_direction
address: '0x08037C44'
kind: function
status: confirmed
summary: Cutscene opcode that glides the overworld player in its current facing direction for a fixed number of
  frames.
interface: 'void CutsceneCmd_move_player_in_facing_direction(u32 r5 cutsceneState, u32 r7 scriptPos, u32 r4 carryIn)
  /* out: r0 in NZ (1=finished/0 wait), r4 = step-table addr 0x8037CB4 while gliding; r1, r2 untouched */'
details: 'A 5-byte cutscene-script command: glide the overworld player along the

  direction it is currently facing. On the first frame the player''s facing

  is sampled via GetOWPlayerFacingDirection and cutscene flag 8

  (CUTSCENE_FLAG_8) is raised to mark the glide active. A duration is read

  as parameter 1: if it is 0xFF the duration comes from the immediate byte

  in parameter 2, otherwise it is a 1-based offset into the cutscene-state

  struct (ldrb r4, [r5, r4]) and is stored in

  oCutsceneState_OWPlayerCoordSpecialTimer. Every frame the per-frame

  signed speed (parameter 3, a halfword) is multiplied by the (dx, dy)

  pair for the current facing from the 16-byte step table at byte_8037CB4

  (0x10 = full step, 0x08 = diagonal half step, negatives go up/left) and

  added to the player''s special overworld coords via

  owPlayer_offsetS200ace0Coords_809e1fa (third arg hardcoded 0). After

  each frame the duration counter is decremented; while positive the

  command reports "waiting" (r0 = 0). When it reaches zero, cutscene flag

  8 is cleared, r7 is advanced by 5 to skip the entire command and r0 = 1

  reports completion. While idle (no cutscene script running, byte at

  +oCutsceneState_WhichCutsceneScript == 0) the command just returns 0

  without touching anything. Once the glide has started, r4 is

  overwritten with the step-table address 0x8037CB4 so the carry-through value

  no longer means what it meant on entry.

  '
