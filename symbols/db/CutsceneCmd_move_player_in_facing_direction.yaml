open_questions:
- Exact semantics of the per-step halfword speed units (the << 8 shift suggests the raw value is a sub-step fraction
  that gets promoted to a whole-pixel delta per frame).
- Why an immediate 0xFF byte is the sentinel for "use the next byte" rather than reading the parameter index from
  a different slot.
- Whether CUTSCENE_FLAG_8 / oCutsceneState_OWPlayerCoordSpecialTimer have broader uses outside the glide command
  or are dedicated to it.
