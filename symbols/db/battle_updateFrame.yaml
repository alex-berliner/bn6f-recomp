name: battle_updateFrame
address: '0x08130904'
kind: function
status: probable
summary: 'Per-frame battle tick: dispatches a sub-state handler from a 13-entry table, then runs entity
  update handlers and the eStruct sprite pipeline unless bit 0x8 of [r5,#0x1b] is set, and refreshes the
  custom-screen chip cursor OAM/tile upload when the 0x200BC30 jump offset is nonzero.'
interface: (r5 = scene/state context struct, preserved) -> r0 = result of dispatched handler or OAM-call
  result; no meaningful return
details: Indexes a 13-entry dispatch table (off_8130938) with the byte at [r5,#2] and long-calls the selected
  handler via mov lr,pc / bx. After it returns, tests bit 0x8 of [r5,#0x1b]; if clear it runs the per-frame
  entity update walk (entity_runAllUpdateHandlers) and the eStruct sprite pipeline (battle_updateEStructSprites),
  so that bit acts as a freeze/hide-entities gate. It then reads eStruct200BC30_getJumpOffset00 and, when
  nonzero, calls battleObject_setupCustomChipCursorState with (0,0) each frame so the chip-cursor OAM
  entry and cursor tile upload keep refreshing during battle. r5 is the caller's context and is never
  written, so the frame state lives in the caller.
