summary: Initializes the BattleNavi stats record for one navi index with the default stat set.
interface: void battle_InitNaviStatsByIndex(u32 naviIndex /* r0 */); returns r2 = eBattleNaviStats0 (array base)
details: 'Wrapper over initNaviStats_WithDefaultStatsMaybe_8013438. Computes the address of the requested navi''s
  stats record as eBattleNaviStats0 + naviIndex * 0x64 (each record is 0x64=100 bytes; the multiplier 100 is built
  with mov r1,#0x64 / mul r0,r1), then calls the initializer to fill that record with default stats. Leaves r2 =
  eBattleNaviStats0 (base of the stats array) on return; r0 is consumed by the callee. r3 and r4 are preserved (they
  appear in both inputs and outputs, likely caller-saved scratch the callers happen to reuse). Navi index is not
  bounds-checked here.

  '
