name: battle_dispatchModeAndRunUpdates
address: '0x08039658'
kind: function
status: probable
summary: 'Per-frame dispatcher: jumps to one of 8 mode handlers selected by a state byte, then unconditionally
  runs the entity update pass and the eStruct sprite pipeline.'
interface: (r5 = state struct; byte [r5,#1] = mode index 0-7) -> r0 = result of entity/sprite passes;
  does not return a meaningful value
details: 'Loads the byte at r5+1 as a mode/state selector and indexes a table of 8 ARM-stub targets (off_8039674)
  whose words point to thumb handlers at 0x8039694-0x8039846. The call uses the ARM idiom ''mov lr, pc;
  bx r0'', so the selected handler returns straight into the code after the bx. After the handler returns,
  it unconditionally calls entity_runAllUpdateHandlers_80465BC (walks the 15 x 0x58-byte entity records,
  invoking each active record''s update handler) and battle_updateEStructSprites_80465F8 (per-frame sprite/anim/palette
  refresh for visible eStructs). This is the frame body of a scene engine: mode handler does per-state
  logic, then the common entity and sprite updates run every frame regardless of mode. r5 is never set
  inside the function, so it relies on a caller-preserved context pointer.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r5,#1]; ldr r0,[r0,r1]; mov lr,pc; bx r0 — indexed dispatch over off_8039674 (8 entries)
    with the handler returning to the next instruction; table words are sub_8039694..sub_8039846+1, all
    thumb entries: 8 distinct mode/state handlers; bl entity_runAllUpdateHandlers_80465BC — the common
    per-frame entity pass runs after every mode handler; bl battle_updateEStructSprites_80465F8 — the
    common per-frame sprite/anim pass runs after the entity pass; both callees are known battle-side per-frame
    routines over the 15-entry entity array, matching a battle-scene frame loop'
