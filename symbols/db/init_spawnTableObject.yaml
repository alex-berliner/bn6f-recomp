name: init_spawnTableObject
address: '0x080CF974'
kind: function
status: probable
summary: Initializes a spawned battle object from a per-ID table entry (animation, HP, name), arms its
  collision and transitions it to its update state.
interface: (r5 = battle object, Param1 = variant ID, Param3 = anim override flag) -> r0 = 1 if fully initialized;
  object left in CUR_STATE_UPDATE
details: Indexing byte_80CF934 by Param1*8, it stores the entry pointer in oBattleObject_ExtraVars, sets
  flag bit 1, and loads sprite resource (0x80,0x10) with a fresh animation (from the table if Param3==3,
  else 0). It copies the object's PanelXY to FuturePanelXY, sets Z=0, sets Element to 0 for variants 0-2
  and 2 otherwise, sets HP/MaxHP to table[+2]<<1 (1 if that byte is 0), NameID from table[+6], and Timer
  to 0x1770 (6000). It then creates a 3x3-ish collision region (0xe,0xf,3) with hit effect 0xa, clears
  the collision region byte, refreshes present-collision state, and on allocation failure frees the object
  instead. Finally it sets CurState=CUR_STATE_UPDATE and jumps to the state handler sub_80CFA18.
