  detail: 'sub_80FBDE0: ldr r0,=dword_80FBDF0 (0x4040402); bl sub_800FE28; pop {pc} — pure parameter-table
    pass-through; caller 0x080FBF72: bl sub_80FBDE0; strb r0,[r7,#oAIAttackVars_TimerOrCycles] — result
    is the attack timer/cycles; siblings sub_80FBDB8/sub_80FBDC C fill AttackDuration/AttackBoost2 the
    same way, indicating a per-parameter roll family; caller context sets ai difficulty tier, versioned
