name: ai_rollAttackTimerCycles
address: '0x080FBDE0'
kind: function
status: probable
summary: Rolls/fetches the AI attack timer/cycle count from a constant parameter table for an AI attack
  variable.
interface: () -> r0 = timer/cycles byte stored to oAIAttackVars_TimerOrCycles; flags from callee
details: Loads the fixed word 0x4040402 (dword_80FBDF0) and calls sub_800FE28 with it in r0, returning
  that result unchanged. The word looks like a packed parameter block (bytes 02,04,04,40), likely min/max-style
  bounds for a random roll in sub_800FE28. It is one of a family of sibling wrappers (sub_80FBDB8 -> AttackDuration,
  sub_80FBDC C -> AttackBoost2) that each supply a different config word during AI attack-variable init
  in sub_80FBF54. The result is stored as the attack's timer/cycle count right after difficulty tier,
  init flag, and versioned attack params are set up.
