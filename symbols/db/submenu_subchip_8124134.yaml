name: submenu_subchip_8124134
address: '0x08124134'
kind: function
status: confirmed
summary: Sub-menu update hook that restores the sub-menu state byte (+2) to 4 whenever the chatbox is not open.
interface: void submenu_subchip_resetModeByteWhenChatboxClosed_8124134(struct UnkSubMenu* state /* r5 */); returns
  r0 = 0 (chatbox open) or 4 (byte reset), NZ flags set accordingly, r1 preserved
details: 'Called with r5 pointing at a sub-menu state struct. Reads the chatbox state mask via chatbox_mask_eFlags2009F38
  with flag 0x80 (chatbox-open bit); if set, the function returns immediately without touching anything. Otherwise
  it stores the constant 4 into the byte at state+2, effectively restoring that byte to its default (likely the
  sub-menu selection index or cursor/mode, so the SubChip menu snaps back after a chatbox dialog closes). r1 is
  passed through unchanged, and the NZ flags reflect either the chatbox mask test or the stored value 4. This looks
  like a per-frame callback in the sub-menu state table rather than a one-shot init.

  '
