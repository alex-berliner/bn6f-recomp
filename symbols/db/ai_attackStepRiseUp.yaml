name: ai_attackStepRiseUp
address: '0x08014FA8'
kind: function
status: probable
summary: 'One step of an enemy AI attack routine: on first run it plays a charge sound, spawns a ground
  effect, lifts the enemy upward and sets the attack element; when the step timer expires it sets the
  hit element to finish the attack.'
interface: (r5 = battle object, r7 = its oAIAttackVars) -> void; triggers via AttackElement state (0 =
  start attack, 4 = windup until HitElement set to 8)
details: This is a two-phase AI attack step driven by oAIAttackVars (r7). While AttackElement is 0 and
  StepTimer counts down past zero, it sets AIData+0x48 flag 0x80000, plays sound 0xF7, spawns an effect
  object (effect param 0x2E00 | Alliance<<8) with Timer=0x36 and flag 0x4, raises the object's Y by 0xC00000
  (upward), writes byte 1 to the alliance-indexed table at byte_203EAE0, plays sound 0x1CC or 0x1CD depending
  on the actor's type (>= 0x12 via battle_ai_getActorInfo), calls sub_80302B6(2, 0x3C), then sets StepTimer=0x36
  and AttackElement=4. In phase 2 it merely counts StepTimer down and, once it goes negative, writes HitElement=8,
  which presumably lets the shared AI attack code deal the actual hit. r4 is also loaded with 0x2E00 |
  Alliance but never used after, a leftover from the effect spawn.
