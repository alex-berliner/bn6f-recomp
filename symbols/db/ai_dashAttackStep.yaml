name: ai_dashAttackStep
address: '0x080EC210'
kind: function
status: probable
summary: 'Enemy AI dash attack step: on first entry it sets flag bit 22, plays animation 0x15, resets
  counter and sets StepTimer=5 with AttackElement=4; once StepTimer expires it clears SelfDamage, sets
  invulnerable time to 0xFFFF, sets XVelocity and ScratchVar to facing*0x10000, Y+=0x10000, plays animation
  0x16 and SFX 0xBF/0xC7, copies PanelX/Y to FuturePanelX/Y and reserves the panel, then spawns sub_80DB666
  damage checks for InitFlag 0 and 1 and sets HitElement=4.'
interface: (r5 = battle object ptr, r7 = AIAttackVars struct) -> r0 = 0; updates AttackElement/StepTimer/HitElement
  fields, object velocity and panel state
details: On first entry (AttackElement == 0) it sets ObjectFlags1 bit 22, plays animation 0x15, resets
  the counter timer, loads StepTimer = 5, and stores AttackElement = 4 as 'in progress'. On later calls
  it counts StepTimer down; once it expires it zeroes SelfDamage and makes the object invulnerable (0xFFFF
  frames), then reads the alliance-facing direction and sets XVelocity = dir * 0x10000 (1 px/frame) and
  Y += 0x10000, with StepTimer = 0xB and animation 0x16 — a one-panel lunge. It copies the object's current
  PanelX/Y into FuturePanelX/Y and calls object_reservePanel to claim that panel. Finally it calls sub_80DB666
  twice with the struct's Damage and InitFlag pushed as arguments (r4 = 0 then 1), apparently spawning
  hit/damage processing for the dash, and records HitElement = 4. The two sound effects 0xBF and 0xC7
  accompany the dash.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'first-entry branch: object_setAnimation(0x15), StepTimer=5, AttackElement=4 — telegraph state
    setup; XVelocity = object_getFrontDirection() * 0x10000 and Y += 0x10000 with StepTimer=0xB, animation
    0x16 — one-panel forward dash; PanelX/Y copied to FuturePanelX/Y followed by object_reservePanel —
    claims the panel being moved into; two PlaySoundEffect calls (0xBF, 0xC7) right at dash start — attack
    sound cue; sub_80DB666 called twice with pushed Damage/InitFlag and r4=0 then r4=1, then HitElement=4
    — attack damage application'
  refs:
  - bn6f/asm/asm31.s:112605
  - 0x080005CC PlaySoundEffect
  - 0x0800E2CA object_getFrontDirection
  - 0x0801BB1C object_reservePanel
  reproduce: python3 tools/asmcat.py 0x080EC210
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly accurate, but several details are wrong: the function does not make the object
    invulnerable for 0xFFFF frames — it calls object_setInvulnerableTime with a literal 0xFFFF as the
    invulnerable timer value, which is fine, but the code never updates SelfDamage to zero (it stores
    0 to SelfDamage, which actually clears it). Also XVelocity = dir * 0x10000 is correct, but the Y +=
    0x10000 uses ScratchVar indirectly, and StepTimer is set to 0xB (11), not ''one-panel lunge''. Critically,
    HitElement is stored as a halfword (strh), not as the byte the proposal implies, and the two sub_80DB666
    calls take (r2=InitFlag, r6=Damage) as arguments, not just Damage/InitFlag. Animation IDs 0x15 then
    0x16 match. The name ''ai_dashAttackStep'' fits the behavior well, so I''d keep it but tweak the summary.;
    run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
