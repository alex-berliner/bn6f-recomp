name: submenu_initChipTraderFolderNameBackground
address: '0x0804AFB8'
kind: function
status: probable
summary: Initializes and renders the current folder-name strip on the chip trader submenu background by
  expanding the folder name into the tile-index buffer at unk_2034814 and blitting it to BG map block
  2.
interface: () -> void; no return value, r0-r4 clobbered
details: Calls chatbox_initFolderNameDisplayBuffer_81202FC with base parameters (0xa, unk_2034814, 0xb,
  0xc, 0x14); that callee seeds back/front u16 tile-index buffers at unk_2034814 with base tile + VRAM
  offset and expands the TextScript folder name into both. It then calls CopyBackgroundTiles with j =
  0x1f-0x1e = 1, i = 2, tile block 2, tile_ids = unk_2034814, j_size = 0x14 (20 tiles wide), i_size =
  2 (2 tiles tall). unk_2034814 thus serves as a 20x2 tile-index staging buffer that is blitted into the
  BG map. This is a one-shot setup of the folder-name strip, presumably shown on the chip trader UI.
