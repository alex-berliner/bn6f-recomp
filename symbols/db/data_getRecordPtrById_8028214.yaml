name: data_getRecordPtrById_8028214
address: '0x08028214'
kind: function
status: confirmed
summary: Returns a pointer to a 64-byte data record selected by id, with ids 0x1B/0x1C rerouted to a special record
  and out-of-range ids clamped to the last table entry.
interface: 'void* data_getRecordPtrById(u32 id); // in: r0 = record id; r2 and lr preserved (lr is the return);
  out: r0 = record pointer; flags clobbered'
details: "Table lookup over a base table at dword_86E591C with fixed 64-byte (1<<6) stride.\nGiven id in r0:\n \
  \ - id 0x1B (27) or 0x1C (28): return pointer byte_802A700 instead of indexing the table,\n    so both of these\
  \ ids share one special/overflow record outside the main table.\n  - any id > 0x1C is clamped down to 0x1B, i.e.\
  \ callers indexing past the end of the\n    table get the last real entry (the clamp happens before the special-case\
  \ ids are\n    re-tested? no: the clamp only applies on the non-special path, so the clamp target\n    0x1B is\
  \ the last genuine table row, index 0x1A being the one before it).\n  - otherwise: pointer = dword_86E591C + (id\
  \ * 64).\nr2 is used as a scratch register for the table base and is pushed/popped so callers\nsee it preserved;\
  \ the compare chain sets flags freely (nzcv clobbered). Records are\n0x40 bytes each, so the table spans at least\
  \ 27*64 = 0x6C0 bytes at dword_86E591C.\nThe exact in-game meaning of the records (which system consumes these\
  \ 64-byte rows)\nis not established from this function alone.\n"
