name: battle_spawnType30Linked
address: '0x080E2712'
kind: function
status: probable
summary: 'Spawns battle object type 0x1E and ties it to the caller: copies the caller''s alliance into
  it and stores the caller-supplied related-object pointer.'
interface: (r0..r2 = spawn params passed to object_spawnType4, r3 = related object ptr, r5 = source object)
  -> r0 = spawned object ptr or 0
details: Thin wrapper over object_spawnType4 with hardcoded type id 0x1E. After the spawn call, if it
  returned non-null, it copies oBattleObject_Alliance from the object passed in r5 (the caller's own battle
  object) into the new object, and writes r3 into the new object's oBattleObject_RelatedObject1Ptr field.
  This makes the new object an ally/dependent of whatever spawned it, e.g. an effect or minion that fights
  on the same side. The bytes after locret are a data table, not code.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0x1e; bl object_spawnType4 — spawns fixed object type 0x1E; ldrb r1,[r5,#oBattleObject_Alliance];
    strb r1,[r0,#oBattleObject_Alliance] — inherits alliance from r5 object; str r3,[r0,#oBattleObject_RelatedObject1Ptr]
    — links spawned object to r3; beq locret skips copy when spawn failed (r0 = 0)
