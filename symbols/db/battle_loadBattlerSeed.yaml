name: battle_loadBattlerSeed
address: '0x0800B50E'
kind: function
status: probable
summary: Loads the primary RNG seed word and a related seed byte from byte_203F4A4 into unk_2036120 entry
  0's +0x44/+0xE fields (via sub_800B548), and conditionally does the same for entry 1 from byte_203F5A4
  when GetBattleEffects has bit 0x8 set.
interface: () -> void; reads byte_203F4A4 (and byte_203F5A4), writes entry+0x44 (word) and entry+0xE (byte)
  of unk_2036120 records 0/1
details: Fetches record 0 of the 0x1D0-stride array at unk_2036120, passes the first word of byte_203F4A4
  (the loopback packet holding the battle seed) to sub_800B548 with r3=0, then stores the returned word
  at +0x44 and byte_203F4A4+4 at +0xE. If GetBattleEffects reports bit 0x8, it repeats the whole sequence
  for record 1 using byte_203F5A4 (a second packet buffer 0x100 bytes later). The +0x44 field is presumably
  the battler's RNG seed and +0xE a related seed/status byte. No callers are known, so the trigger context
  (which battle phase invokes it) is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r1, off_800B68C (=byte_203F4A4); ldr r2,[r1] then str r2,[r0,#0x44] — seed word from packet
    written to record+0x44; bl sub_800B548 with r3=0/1 before each store, so it processes the seed per
    battler index; bl GetBattleEffects; tst r0,#8; beq — second record only filled when effect bit 0x8
    set; bl getEntryPtr_2036120_1D0_802E070 with r0=0 then 1 — writes go to battler records 0 and 1 of
    the fixed array; symdb: byte_203F4A4 holds ''the battle seed the primary RNG is restored from at battle
    phase 8'''
  refs:
  - bn6f/asm/asm00_1.s:19083
  - 0x0802D246 GetBattleEffects
  - 0x0802E070 getEntryPtr_2036120_1D0_802E070
  - 0x0800B548 sub_800B548
  reproduce: python3 tools/asmcat.py 0x0800B50E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code indeed reads byte_203F4A4/byte_203F5A4, stores sub_800B548''s return at entry+0x44 and
    a byte from +4 at entry+0xE, and gates the second record on GetBattleEffects & 0x8. However, the proposal
    overstates what sub_800B548 does: r2 comes in as the loaded word from the packet, not passed to sub_800B548
    as an argument; sub_800B548 takes r0 (entry ptr), r1 (packet ptr), r3 (index), and returns the seed
    in r2. The function name ''battle_loadBattlerSeedsFromLinkPacket'' is reasonable but ''linkPacket''
    is misleading — byte_203F4A4 is described as the loopback battle seed, not a link packet per se; ''battle_loadBattlerSeed''
    is cleaner.; run wf investigate investigate-20261019-003606; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- What sub_800B548 does with the seed word (it returns the value stored at +0x44, possibly re-rolled or
  XORed)
- Meaning of effect bit 0x8 that gates filling record 1 (likely a loopback/mirror-battle flag)
- Which caller/battle phase invokes this, and the exact meaning of the byte stored at record+0xE
- 'The code indeed reads byte_203F4A4/byte_203F5A4, stores sub_800B548''s return at entry+0x44 and a byte
  from +4 at entry+0xE, and gates the second record on GetBattleEffects & 0x8. However, the proposal overstates
  what sub_800B548 does: r2 comes in as the loaded word from the packet, not passed to sub_800B548 as
  an argument; sub_800B548 takes r0 (entry ptr), r1 (packet ptr), r3 (index), and returns the seed in
  r2. The function name ''battle_loadBattlerSeedsFromLinkPacket'' is reasonable but ''linkPacket'' is
  misleading — byte_203F4A4 is described as the loopback battle seed, not a link packet per se; ''battle_loadBattlerSeed''
  is cleaner.'
