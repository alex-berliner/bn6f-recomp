name: sub_8031420
address: '0x08031420'
kind: function
status: confirmed
summary: Drives the camera across a map edge into the adjacent map, in two half-scroll passes (first half via one
  delta provider, second half via another), folding each pass's completion status into the caller's r12 accumulator.
interface: void sub_8031420(u32 r0, u32 r1, u32 r2, u32 r5 /* camera anchor */, u32 r12 /* status accumulator */);
  leaves r0/r1/r2/r5 unchanged, returns r3 = status of the last camera move (0 = still scrolling, 1 = that pass
  finished) and r12 with bit0 = pass-1 status, bit1 = pass-2 status; clobbers r4/r6-r9, lr and the NZCV flags.
details: 'Two-pass edge scroll between map screens. Each pass calls sub_8031136 first to (re)anchor the camera state,
  then a per-pass scroll-delta provider to get the movement step, then camera_moveByDelta_80310B0 to apply it. Pass
  1 uses sub_8030E14 with extents (x = -1, y = -1, w = 0x20, h = 0, layer 0) and applies the delta with r1 = 0;
  pass 2 uses sub_8030F04 with the mirrored extents (x = 0x20, y = 0, w = -1, h = -1, layer 0) and applies it with
  r0 = 0, i.e. the two passes scroll along opposite axes/edges of the seam. The move routine reports progress in
  r3: if pass 1 reports 1 (edge scroll already complete) the routine returns early and pass 2 is skipped. Each pass''s
  r3 is OR-ed into r12 (pass 1 -> bit 0, pass 2 -> bit 1 << 1), letting the caller track both halves'' completion
  independently. r0/r1/r2/r5 are pushed and popped around each pass so the caller''s state survives both anchor
  calls; r4/r6 and condition flags are scratch. The 0x20 extent and the mirrored -1/0x20 pairs suggest 32px-half-screen
  edge zones on the map seam (typical for the outdoor overworld connections).'
