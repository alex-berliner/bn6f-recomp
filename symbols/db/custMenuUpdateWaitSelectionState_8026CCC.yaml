name: custMenuUpdateWaitSelectionState_8026CCC
address: '0x08026CCC'
kind: function
status: confirmed
summary: Per-frame update for a custom-menu object while the player hasn't confirmed a selection yet; once a selection
  is made it latches the result and switches the object to its next state handler.
interface: void custMenuUpdateWaitSelectionState_8026CCC(S20364C0 *self /* r5 */)
details: "Runs one frame of the S20364C0 custom-menu object (self passed in r5 by callers).\nCalls sub_802A220 to\
  \ get the menu's current selection result:\n- If the result is not 0xFF (0xFF = \"no selection yet\"), it stores\
  \ the halfword\n  result at self+0x38 (oS20364C0_Unk_38, the chosen item/selection), sets\n  self+1 (oS20364C0_JumpOffset01)\
  \ to 0x40 so the dispatcher\n  custMenuMainMaybe_8026A88 routes to sub_8027548 on subsequent frames,\n  clears\
  \ self+2 (oS20364C0_Unk_02), zeroes the frame counter at self+0x40,\n  and returns without ticking anything.\n\
  - If the result is 0xFF, the menu is still open: it loads the toolkit's joypad\n  pointer (R10 + oToolkit_JoypadPtr)\
  \ into r7, then calls the per-frame menu\n  update chain custMenuSomeHandler_8028B74 (with r7 = joypad pointer),\n\
  \  sub_8028820, sub_8029C08, sub_802899C and sub_8029D34, then increments the\n  frame counter at self+0x40.\n\
  r7 is used only as scratch (joypad pointer) and is popped back for the caller.\n"
