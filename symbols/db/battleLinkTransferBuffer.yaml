summary: 'Proposed name: battleLinkTransferBuffer. First half of the two-player battle link input-transfer
  buffer, tracked and synchronized by battle ID. (table of what)'
details: This label starts a 32-word transfer-buffer region that is cleared with chatbox state and also
  cleared explicitly between battle phases or link-sync waits. The battle-transfer builders write packed
  player input records beginning at this address, with the second slot beginning at 0x203F5A0. A helper
  compares the first word of both slots against a supplied tracked battle ID, showing that each slot begins
  with link-sync identification data. The address is also passed as the start of the 0x200-byte buffer
  to ZeroFillByEightWords.
