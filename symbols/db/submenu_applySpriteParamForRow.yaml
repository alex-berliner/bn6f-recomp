  date: '2026-10-18'
  detail: ldrh r0,[r6,#0x24]; ldrb r1,[r5,#4]; add/sub/blt/bge — visible-row + offset bounds check against
    sSubmenu.unk_1e count (asm lines 3-8); lsl r0,#2; ldr r1,=word_201DA80; ldrh r1,[r0,#2] — 4-byte entry
    array, u16 at +2 selects a preset; lsl r1,#2; ldr r0,=byte_811820C; ldr r0,[r0,r1] — preset word table
    indexed by that u16; bl sprite_setUnk0x2c — result stored into an object's sprite struct field 0x2c;
    byte_811820C words 0x7E00..0xFC00 (>>9 = 63..126) look like tile-index-like sprite values with a 0xFFFFFFFF
    sentinel
