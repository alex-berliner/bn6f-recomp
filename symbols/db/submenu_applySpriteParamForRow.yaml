name: submenu_applySpriteParamForRow
address: '0x081181DC'
kind: function
status: probable
summary: For the submenu row at sSubmenu.unk_24 + [r5+4] - 2 (bounds-checked against sSubmenu.unk_1e),
  reads word_201DA80[row].wordIndex, looks up the corresponding 32-bit sprite parameter in the table at
  byte_811820C, and writes it via sprite_setUnk0x2c.
interface: (r5 = context object, byte at r5+4 = row offset) -> r0 = preserved/void; sets no meaningful
  flags for callers (returns early via blt/bge on bounds check)
details: 'Computes a row index as sSubmenu.unk_24 (u16, likely first visible row) plus the u8 at [r5+4]
  (likely a cursor/selection offset passed via the caller''s r5), minus 2; returns immediately if negative
  or >= sSubmenu.unk_1e (entry count), so it only acts on valid list rows. It then indexes the array word_201DA80
  (4-byte entries) with that row and reads the u16 at entry+2, which serves as an index into the word
  table at byte_811820C (10 entries: 0xFFFFFFFF, 0x0003FE00, 0x0000FE00, 0x00017E00, 0x0001BE00, 0x0001DE00,
  0x0001EE00, 0x0001F600, 0x0001FA00, 0x0001FC00 — the later ones look like <<9-shifted tile indices converging
  on 127/511). The selected word is passed to sprite_setUnk0x2c, which writes it into field 0x2c of an
  object''s sprite struct. The 0xFFFFFFFF sentinel is presumably a ''no value / keep'' entry. Exact meaning
  of field 0x2c and of the word_201DA80 entry layout is not shown here.'
