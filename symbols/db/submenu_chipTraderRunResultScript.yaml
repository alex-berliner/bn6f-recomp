name: submenu_chipTraderRunResultScript
address: '0x0809A05C'
kind: function
status: probable
summary: Chip-trader menu handler that runs the result dialog script for the traded chip index, then performs
  a follow-up step and clears the menu's script-active flag.
interface: (r5 = chipTrader menu state object) -> r0 = 0; no meaningful flags
details: 'Reads the script index from state+0x08 and passes it with the TextScriptChipTrader archive (0x86C580C)
  to chatbox_runScript, so a text box shows the chip-trader dialog line for the selected index. It then
  calls sub_809A360 with the pointer at state+0x74, likely a follow-up update/reset for the trader state.
  Finally it stores 0 to the byte at state+0x09 — most plausibly a ''dialog active'' or state flag — and
  returns 0 in r0, consistent with a state-machine step handler returning a ''done'' status. The object
  layout is: +0x08 script index (u8/u32), +0x09 flag byte, +0x74 pointer to another routine or structure.'
