  \ /\n     0x86A5500. Decompression sink is DecompBuf_2027A00 / unk_2028200.\n  5. Reads r10 (toolkit, via oToolkit_RenderInfoPtr)\
  \ and shrinks the render-info\n     rectangle stored in r10->RenderInfo by 4 on left/right and 2 on top/bottom\n\
  \     (offsets 0x14/0x16/0x18/0x1a are left/right/top/bottom in toolkit's struct).\n  6. Calls sub_803B91C(3).\n\
  No struct names confirmed; render-info box fields are toolkit-relative offsets.\n\nRegister form, old prompt;\
