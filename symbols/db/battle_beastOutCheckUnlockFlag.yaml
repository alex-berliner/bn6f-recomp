name: battle_beastOutCheckUnlockFlag
address: '0x080A5F84'
kind: function
status: probable
summary: Checks a story flag selected by a form index to gate whether a Beast Out transformation may activate.
interface: (r5 = state struct ptr; field [r5,#6] = form/variant index) -> r0 = 1 if transformation not
  allowed (flag clear), 0 if allowed; on allow sets [r5]=1, calls sub_80A5E8C, clears [r5,#7]
details: 'Reads an index from the struct at r5+6; indices >= 0x32 are folded by subtracting 0x28 so 0x32-0x34
  map to table slots 10-12. The index selects a u16 event flag from byte_80A5FB4: flags 0x5F5-0x5FE for
  indices 0-9 and flags 0xFC2-0xFC4 for the high indices. If the flag is set (TestEventFlag says the story/feature
  is unlocked), it sets [r5]=1, calls sub_80A5E8C (likely to apply the form), zeroes [r5,#7] (a retry/pending
  counter), and returns 0; otherwise it returns 1 leaving state untouched. Called from battle_beastOutInit,
  so it is the per-attempt gate deciding whether Beast Out takes effect. The two flag ranges suggest normal
  forms vs. special/high-index forms (e.g. Falzar variants).'
