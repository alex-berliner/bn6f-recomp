- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/cmp AttackElement==0 + bl ai_DealQueuedAttackDamage_8112F34: fires the queued attack exactly
    once, then re-arms; strh #0xa to StepTimer plus per-tick sub/strh/bgt: enforces a 10-frame gap between
    repeats; SubStepIndex countdown with AttackElement=0 reset on nonzero: repeats the damage that many
    extra times; final branch calls battle_ResetObjectTimerTo8_80C4072 on ScratchVar and sets HitElement=0xC:
    cleanup/hit-state on completion; callees and captured routes (battles2, battlesweep, beastsp, fuzz)
