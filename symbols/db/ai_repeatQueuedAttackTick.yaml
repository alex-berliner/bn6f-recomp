name: ai_repeatQueuedAttackTick
address: '0x08113002'
kind: function
status: probable
summary: AI attack state-machine step that deals queued damage once, waits 10 frames per repeat, and finishes
  the attack after a set number of repeats.
interface: (r0/r1 unused; r7 = AI attack vars struct) -> mutates oAIAttackVars fields; r0 clobbered by
  bl calls
details: 'Runs one tick of a repeated AI attack. On the first call (AttackElement == 0) it sets AttackElement
  = 1 and fires ai_DealQueuedAttackDamage, then arms StepTimer = 10. Each later tick decrements StepTimer;
  while it''s still positive the tick just returns. When the timer expires it decrements SubStepIndex:
  if that doesn''t reach 0 it clears AttackElement so the next call deals damage again (another 10-frame
  wait), and if it does reach 0 it resets the battle object stored in ScratchVar''s timer to 8 via battle_ResetObjectTimerTo8
  and writes HitElement = 0xC, ending the sequence. The struct is an AI attack vars block (oAIAttackVars)
  hanging off r7, so the caller keeps the attacker state in the frame register rather than passing it
  in.'
