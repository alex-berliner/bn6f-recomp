summary: 'Per-frame tick of the "screens3" sub-menu: advances the entity update/sprite pipelines, then
  either toggles an in/out transition step on the active entity record or triggers a fade-in chatbox prompt.'
interface: '() -> r0 = 0x1 ; side effects: mutates entity record at [r5+0x1b..0x3], eFlags2009F38 |= 0x40,
  requests a screen fade(8,16) and a chatbox script 1'
details: 'Pushes lr, runs `entity_runAllUpdateHandlers_80465BC` then `battle_updateEStructSprites_80465F8`

  to tick entity logic + per-record sprite rebuild for every active record (battleObject pipeline).

  If `IsScreenFadeActive()` returns true (a fade is in flight) the function bails out early (returns 1).

  Otherwise it reads `eStruct200BC30_getJumpOffset00()`; if that offset > 0 (transitioning into a record),

  it asks `sub_8049D42` whether the transition has finished; if yes it clears bit 0x04 of [r5+0x1b],

  rewrites [r5+0x1]=4 and [r5+0x2]=0 (move record to state 4 / phase 0). If `sub_8049D42` says no, it

  calls `initSaveStateBlock_8048F9C` with r0=1 and sets bit 0x04 of [r5+0x1b].

  When the jump offset is <= 0 it does the "entrance" path: `sub_812AFC8`, `loadEntryPairTable_812B1DC`

  using the byte table at `byte_812913C`, `sub_812B2C4` with r0=0xE, sets [r5+0x2]=4, [r5+0x3]=0,

  loads the entity''s graphics slot via `loadEntityJumpOffset00Gfx_812B530`, runs chatbox script index
  1

  on archive eTextScript201BA20, ORs 0x40 into `eFlags2009F38`, and finally calls

  `SetScreenFade(8, 0x10)` to fade the new screen in.

  Always returns 1 in r0 (sets Z on exit).

  '
