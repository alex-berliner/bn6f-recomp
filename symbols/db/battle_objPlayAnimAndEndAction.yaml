- method: assembly-reading
  date: '2026-10-19'
  detail: phase-0 branch stores 4 to oBattleObject_CurPhase and 7 to oBattleObject_CurAnim before calling
    PlaySoundEffect(0xE1); same branch sets bit 1 of oObjectHeader_Flags and TimerAndTimer2 = 0x13; phase!=0
    branch decrements oBattleObject_Timer and exits with CurAction=4, CurPhase=0 when it hits zero; only
    callee is PlaySoundEffect, confirming r0 there is a sound ID; r5-based field layout matches the standard
    battle object struct (CurPhase/CurAnim/Timer/CurAction offsets)
