name: battle_objPlayAnimAndEndAction
address: '0x080B9A60'
kind: function
status: probable
summary: 'One-shot battle object state handler: plays animation 7 with sound effect 0xE1, waits ~19 frames,
  then finishes the object''s current action.'
interface: (r5 = battle object) -> void; r0 = scratch/return of callees
details: 'Runs on phase 0 of the object''s CurPhase: stores phase 4, sets CurAnim to 7, plays sound effect
  0xE1 via PlaySoundEffect, sets bit 1 of the object header flags, and loads TimerAndTimer2 with 0x13.
  On later calls (phase != 0) it decrements the 16-bit Timer and, when it reaches 0, sets CurAction to
  4 and clears CurPhaseAndPhaseInitialized to 0, handing control back to the object''s action dispatcher.
  The bit set in oObjectHeader_Flags likely marks the object as no longer interactive/intangible during
  this animation.'
