name: sub_812674C
address: '0x0812674C'
kind: function
status: confirmed
summary: Progressively blits a two-part tile graphic (left 15 tiles, right 16 tiles) into a buffer, revealing more
  of it as an animation step counter advances.
interface: void sub_812674C(void *state /* r5 */, void *unused /* r10 */) — returns sub_8126570's r3 passthrough
  value in r3; r4-r7 are restored, flags clobbered
details: 'Takes a state struct in r5 whose byte at +0xD is the reveal step counter and whose byte at +0xE is the
  reveal limit/total. On step 0 only the right part of the graphic is drawn: a blit via sub_8126570 with x=0xE2,
  y=0x14, 16 tiles, no attribute bits, tile source byte_8124A8C, destination buffer dword_8124A94. Once the step
  counter is non-zero the left part is drawn first (x=0x58, y=0x14, 15 tiles, attribute 0x10000000 set in r6), then
  the right part is drawn again only while the lookup table byte_81267A0[step] (values 0,1,2,3,4,0,0,0) is still
  below the limit at r5+0xE — i.e. the reveal stops once the counter''s mapped segment reaches the total. Both state
  bytes are re-read after the first sub_8126570 call, so that call may advance the animation. r3, whatever sub_8126570
  leaves there, is returned to the caller unchanged. The r10 input is never read in this function.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
