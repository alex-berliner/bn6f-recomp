name: NPCCommand_clear_event_flag
address: '0x0809EE00'
kind: function
status: confirmed
summary: NPC script opcode handler that clears every event flag named in a 16-bit bitfield embedded after the opcode,
  then advances the script pointer.
interface: void NPCCommand_clear_event_flag(u8** scriptPtr in r6, flagCtx in r10); updates r6 (script pointer) and
  sets NZ flags from the new r6; clobbers r0, r1, r3, lr
details: 'One of the NPC script interpreter''s opcode handlers (r6 is the script program

  counter, r10 the flag-work context passed through to ClearEventFlag).

  Reads a halfword at r6+1 (the operand following the 1-byte opcode) via

  ReadNPCScriptHalfword and passes it as a bitfield to ClearEventFlag, which

  clears every listed event flag (bits set = flags to clear). It then advances

  the script pointer by 3 (1 opcode byte + 2 operand bytes) in r6 and returns;

  the interpreter''s dispatch uses the NZ flags set from the new r6 value.

  No error handling: the operand is taken verbatim from the script stream.

  '
