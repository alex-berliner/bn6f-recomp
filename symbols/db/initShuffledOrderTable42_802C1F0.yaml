name: initShuffledOrderTable42_802C1F0
address: '0x0802C1F0'
kind: function
status: confirmed
summary: Fills the 0x2A-byte table at unk_2035320 with values 0..0x29, shuffles it into a random order with the
  primary RNG, and resets the progress fields of the associated state struct.
interface: void sub_802C1F0(State* state /* r5 */, void* r4, void* r6); // r4/r6 passed through by callers but unused
  here; returns NZ (and C/V) from the constant 4 written to state->field3
details: 'Builds an identity table at the fixed buffer unk_2035320 (IWRAM): bytes 0x00..0x29 are written in order
  (42 entries), then ShuffleByteList_PrimaryRNG is called with (table, count=0x2A, size=0x2A) to randomly permute
  the whole table using the game''s primary RNG, producing a random ordering of the indices 0..0x29. Afterwards
  it initializes a caller-provided state struct pointed to by r5: field at +0xB (progress / index counter) is cleared
  to 0 and the byte at +0x3 is set to 4 (likely a mode/phase value, and the source of the NZ flag return since 4
  is nonzero). The 42-entry shuffled table plus a progress counter and a phase value strongly suggests a system
  that walks through 42 items in random order without repeats (e.g. a random pool for encounters, prizes, or daily/randomized
  content); the entry/phase constants should be confirmed against the code that reads unk_2035320.

  '
