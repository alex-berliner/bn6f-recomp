name: sub_80A5350
address: '0x080A5350'
kind: function
status: hypothesis
summary: Thin trampoline that tail-calls FreeOverworldMapObject via a `push {lr}` / `pop {pc}` shim, used as the
  cleanup hook stored in the overworld map-object vtable slot it sits adjacent to.
interface: void freeOverworldMapObject_80A5350(void);  /* clobbers r0-r3, r5, lr; sets NZCV per FreeOverworldMapObject
  */
details: 'The function prologue pushes only lr and immediately BLs FreeOverworldMapObject,

  then returns by popping pc (so the branch is logically a tail-call). Because

  r5 is listed both as an input and as preserved across the call, callers expect

  r5 to survive; the BL itself does not preserve it, so this is either relied

  upon by FreeOverworldMapObject or by hidden convention in a single inlined

  caller. The bytes that immediately follow at 0x80A5358 onward are deliberately

  4-byte-aligned raw data tables (two identical 10-entry tables of 12-byte

  rows resembling (u16, u16, u16) triplets with value "1C 0C 00", and two more

  10-byte tables of (s8, s8) signed offsets), suggesting this label was placed

  at the start of an overworld-object data block that doubles as the

  "free" function pointer slot for the object type. Without a typed signature

  for FreeOverworldMapObject the relationship to those tables is inferred from

  layout only.

  '
