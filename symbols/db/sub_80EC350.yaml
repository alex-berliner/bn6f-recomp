name: sub_80EC350
address: '0x080EC350'
kind: function
status: confirmed
summary: 'AI battle attack resolver: computes the attack outcome from AI vars and, when the opposing alliance slot
  is empty, may invoke a follow-up effect before exiting the attack state.'
interface: "void aiAttack_resolveDamage_80EC350(\n    /* in */\n    u8  r5  panelX (unused directly here, forwarded),\n\
  \    u8  r5  panelY,\n    u8  r5  alliance,\n    u32 r7  aiAttackVars ptr (unk02, unk03, unk0c, damage, attackBoost(u16),\
  \ unk14(u16)),\n    /* modified */\n    r1, r5, r10\n);\nclobbers r0,r2,r3,r7,LR; preserves r4,r6,r10; flags nz/c/v\
  \ set on r2 vs 0x170 and on entry_obj\n"
details: '- Reads multiple fields from an AI attack-vars structure: oAIAttackVars_Unk_02, _Unk_03, _Unk_0c, _Damage,
  _AttackBoost (u16), and _Unk_14 (u16).

  - Builds a packed 32-bit argument for sub_80E192C: high half = AttackBoost << 16, low half = Unk_14; r4 = _Unk_0c,
  r6 = _Damage, r0/r1 = the battle object''s PanelX/PanelY, r2/r3 = _Unk_02/_Unk_03.

  - Calls sub_80E192C to compute the attack outcome; the returned r0 is the packed "result" preserved across the
  next calls.

  - Looks up the opposing alliance entry via byte_203CF00_getEntryPtr_800BF5C(alliance); if the slot''s stored object
  pointer (entry + 0x8) is non-zero the slot is occupied and the extra-effect call is bypassed.

  - When the slot is empty, compares Unk_14 against 0x170: r1 = 0 if < 0x170, r1 = 1 if >= 0x170. Calls sub_800BF16(alliance,
  r1, result) to apply the extra effect.

  - Calls object_exitAttackState unconditionally before returning.

  - Uses the standard {r4,r6,lr} + {r7} push/pop idiom; saves r0 across the entry lookup with an inner push {r0}/pop
  {r0} pair so flags from the entry lookup drive the bne.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
