name: battle_spawnChipSelectHeaderEntries_81340DC
address: '0x081340DC'
kind: function
previous_names:
- sub_81340DC
status: probable
summary: Loads the submenu-open chip-select header entries from a small per-view record table and positions
  the first eStruct sprite for the chip-select menu.
interface: () -> void
details: "1. Loads the address of `byte_813314C` (a 0xFF-terminated table of (id, slot, param) triples)\
  \ into r0 and calls `battle_spawnEStructRecordsFromTable_80465A0` to spawn type-9 eStruct records into\
  \ `eStructArr2008450`.\n  2. Calls `getStructFrom2008450(3)` and bails out (`beq locret_81340F6`) if\
  \ the freshly-created slot 3 record's in-use byte is zero.\n  3. Otherwise reads the returned pointer/slot\
  \ (r1) into r5 (likely the eStruct pointer).\n  4. Calls `sprite_setCoordinates(0xc0, 3)` to position\
  \ the chip-select screen's header sprite at (0xC0, 3).\n  5. Returns. No meaningful return value to\
  \ callers; only r5/r7 preserved per contract.\n  This is the chip-select \"load header entries and place\
  \ its sprite\" helper, called only from `battle_initChipSelectFromOverlay_8133228`'s \"submenu open\"\
  \ branch after the chip-pack and assets are set up.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, off_81340F8` and `bl battle_spawnEStructRecordsFromTable_80465A0` show it walks
    `byte_813314C` to spawn records. - `mov r0, #3` / `bl getStructFrom2008450` / `beq locret_81340F6`
    selects slot 3 and early-exits when absent. - `mov r0, #0xc0` / `mov r1, #3` / `bl sprite_setCoordinates`
    positions the resulting sprite at columns (0xc0, 3). - Sole caller `battle_initChipSelectFromOverlay_8133228`
    is the chip-select submenu-open init, matching the role. - Captured call site uses lr=0x08133341,
    firmly inside the chip-select overlay that owns `byte_813314C`.'
  refs:
  - bn6f/asm/asm36.s
  reproduce: 'python3 tools/asmcat.py 0x081340DC

    '
  result: the body read as described above
  note: 'Proposed name (pending rename): battle_spawnChipSelectHeaderEntries_81340DC

    '
