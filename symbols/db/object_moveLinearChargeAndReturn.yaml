  - 0x0800E2CE object_getFlipDirection
  - 0x0800E2CA object_getFrontDirection
  - 0x0800E29C object_setCoordinatesFromPanels
  reproduce: python3 tools/asmcat.py 0x080CA408
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The state machine, table values (0xFF9C0000/0xFFC40000/0xFFEC0000 left; 0x640000/0x3C0000/0x140000
    right), Y caps (0x40000/0x340000), Alliance^1 flip in phase 2, and collision-end handling all match
