name: owPlayer_unlockPlayerAfterNonNPCDialogue_809E122
address: '0x0809E122'
kind: function
status: confirmed
summary: Re-enables the player after a non-NPC overworld dialogue ends by clearing the dialogue-busy byte, re-enabling
  movement, and clearing story event flag 0x1719.
interface: void owPlayer_unlockPlayerAfterNonNPCDialogue_809E122(void)
details: 'Called after talking to an overworld character that is not an NPC-scripted interaction. Zeroes the byte
  at eStruct200ace0 (the "dialogue in progress" / busy flag for the overworld player state), calls SetPlayerCanMoveEventFlag
  to let the player walk again, and clears event flag 0x1719 (stored at 0x2001c88 bit/flag 0x2e3, address 0x2001f6b)
  via ClearEventFlagFromImmediate, which takes the flag id split as high byte in r0 (0x17) and low byte in r1 (0x19).
  No inputs; returns to caller via popped lr. Trashes r0, r1, r3 and flags.

  '
