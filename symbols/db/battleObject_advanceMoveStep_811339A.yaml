name: battleObject_advanceMoveStep_811339A
address: '0x0811339A'
kind: function
status: confirmed
summary: Processes one tick of an AI-controlled NavCom's planned movement during an attack sequence, handling velocity
  integration, boundary/obstacle collision, panel validation, step-timer countdown, and final position commit with
  state transition.
interface: static u32 battleObject_advanceMoveStep_811339A(BattleObject *r5, AIState *r6, AIAttackVars *r7) -> r1
  (last collision-region value or exit-attack state return)
details: "Operates on three structures passed in registers:\n  r5  BattleObject (arena participant: position, velocity,\
  \ panel coords, collision flags, AI data pointer)\n  r6  AIState (turn counter, overall AI phase)\n  r7  AIAttackVars\
  \ (step timer, hit element, target pointer, charge cycles, panel params, scratch panel)\n\nFlow:\n  1. If collisionData.flags\
  \ has bits 26-27 set (0x0C000000), stash current PanelXY into\n     attackVars.scratchPanel and call object_clearCollisionRegion;\
  \ on the next tick\n     when PanelXY differs from the stashed value, call object_setCollisionRegion to restore.\n\
  \  2. Advance BattleObject.X by XVelocity (fixed-point), then recompute PanelX/PanelY\n     from the new pixel\
  \ position via object_setPanelsFromCoordinates.\n  3. Boundary / obstacle check: if PanelX is 0 or 7 (arena edges)\
  \ skip further check.\n     Otherwise call object_checkPanelParameters; a zero result means the object ran into\n\
  \     an obstacle on the field. In that case spawn a type-1 impact effect at the object's\n     hitbox (offset\
  \ 0x34, with +0x100000 Y shift), set StepTimer=0x3C, clear TurnCounter,\n     set HitElement=8, and jump straight\
  \ to the commit/exit path.\n  4. Normal path: call object_updateCollisionPanels, decrement StepTimer. While timer\
  \ > 0\n     the step is incomplete and the function returns.\n  5. When timer hits 0, validate landing panel (object_isCurrentPanelValid).\
  \ If invalid,\n     nudge PanelX by -6 * facingDirection (snap back), then choose PanelY:\n       - If TurnCounter==1\
  \ and target exists and AI data supports it, adopt target's row\n         (offset 0x13 in target object).\n  \
  \     - Otherwise use FuturePanelY.\n  6. If FuturePanelX still differs from current PanelX after validation,\
  \ snap to\n     coordinates and reload StepTimer from ChargeCycles, returning early (another step needed).\n \
  \ 7. Commit: unless mid-turn (TurnCounter==1), copy FuturePanelX/Y into PanelX/Y and\n     release the panel reservation\
  \ (object_removePanelReserve).\n  8. Finalize: set coordinates, set collision panels to current, clear flag bit\
  \ 0x40,\n     set CURRENTLY_MOVING flag, call object_setCollisionRegion.\n  9. Exit attack state (object_exitAttackState_801171C)\
  \ unless HitElement is already 8\n     (which signals the movement was interrupted by an obstacle/hit).\n\nKey\
  \ struct fields touched:\n  oBattleObject_CollisionDataPtr, oBattleObject_PanelXY, oBattleObject_X, oBattleObject_XVelocity,\n\
  \  oBattleObject_PanelX, oBattleObject_PanelY, oBattleObject_FuturePanelX, oBattleObject_FuturePanelY,\n  oBattleObject_AIDataPtr,\
  \ oBattleObject hitbox at +0x34.\n  oAIAttackVars_ScratchPointerOrPanel, oAIAttackVars_StepTimer, oAIAttackVars_HitElement,\n\
  \  oAIAttackVars_ChargeCycles, oAIAttackVars_TargetObjectPtr, oAIAttackVars_AiAttackParam,\n  oAIAttackVars_PanelParamFlags2.\n\
  \  oAIState_TurnCounter.\n  oAIData_Version_16.\nQuirks:\n  - HitElement==8 acts as a sentinel for \"already hit\
  \ by obstacle, don't re-exit state.\"\n  - The 0x0C000000 mask on collision flags is an internal per-move attribute\
  \ controlling\n    whether the collision region is torn down and rebuilt across panel transitions.\n  - The 0x100000\
  \ additive on the effect spawn Y shifts the impact graphic above the object.\n  - r5 is listed as both an input\
  \ and an output in the contract, but the C form shows it\n    is never modified; the \"output\" is really just\
  \ \"preserved and readable after return.\"\n"
