open_questions:
- 'Exact meaning of FlagsFromCollision mask 0x0c000000 (bits 26,27). Not free lanes:'
- they intersect OBJECT_FLAGS_UNK_26 / OBJECT_FLAGS_UNAFFECTED_BY_POISON but those flags
- are stored in ObjectFlags1 at +0x3c, not +0x70. The match is by bit position, not the
- same field, so semantics are inferred (likely "ice/poison-hook before region swap").
- Why spawn_t1_0x0_EffectObject when object is on the off-target panel (panel not 0/7 and
- parameters ok) -- could be a dust/wind-skip effect mid-step; need a parent caller trace
- to know which AI uses this.
- 'Clearing 0x40 in ObjectFlags1: 0x40 = OBJECT_FLAGS_CANNOT_SLIDE; the function does NOT'
- set this bit back elsewhere in the routine, so the move-end may simply allow slide again.
- The two sub-branches (AIState.Unk_04==1 vs FuturePanel copy) suggest two different AI
- move modes (e.g. slide-keep-panel vs commit-FuturePanel); still need the parent
- attacker table to confirm.
