name: battleObject_advanceMoveStep_811339A
address: '0x0811339A'
kind: function
previous_names:
- sub_811339A
status: probable
summary: 'Advance a battle object one step of its AI-driven move: update collision/region, integrate X
  velocity into X, recompute panel coords and either spawn an effect (target reached) or continue moving,
  then mark "currently moving".'
interface: (r5 = obj, r6 = AIState, r7 = AIAttackVars) -> void ; side effects to obj (X, PanelX/Y, Region,
  ObjectFlags1), AIState (Unk_04), AIAttackVars (Unk_00/Unk_10/Unk_12/Unk_3c), spawns t1/effect object
  on arrival
details: "1. If CollisionData's FlagsFromCollision has any of bits 0x0c000000 set, write the\n     object's\
  \ current PanelXY into AIAttackVars.Unk_3c and clear the collision region.\n  2. Re-set the collision\
  \ region (object_setCollisionRegion) when PanelXY differs from\n     AIAttackVars.Unk_3c.\n  3. Integrate\
  \ velocity: add XVelocity (oBattleObject_XVelocity at 0x40) into X,\n     then object_setPanelsFromCoordinates\
  \ to derive PanelX/Y from world XYZ.\n  4. If PanelX is non-edge (not 0 or 7) and object_checkPanelParameters\
  \ passes\n     (Unk_34/Unk_38 panel masks), spawn a t1 effect object at the object's panel-XYZ\n   \
  \  using ExtraVars at r5+0x34..0x40 with Z += 0x100000 (ExtraVars.Z_3c += 0x1000_0000\n     half) via\
  \ spawn_t1_0x0_EffectObject, set AIAttackVars.Unk_10 = 0x3c,\n     AIState.Unk_04 = 0, AIAttackVars.Unk_00\
  \ = 8, then return (target panel reached).\n  5. Otherwise object_updateCollisionPanels, decrement AIAttackVars.Unk_10;\
  \ if still > 0,\n     return.\n  6. If current panel is invalid, snap the object backwards off-panel:\n\
  \     PanelX -= object_getFrontDirection()*6; if AIState.Unk_04 == 1 and\n     AIAttackVars.Unk_2c non-null\
  \ and AIData.Version_16 non-zero, copy AIAttackVars.Unk_2c\n     byte 0x13 into PanelY; else copy FuturePanelY\
  \ into PanelY.\n  7. If FuturePanelX differs from PanelX, snap to panel coords via\n     object_setCoordinatesFromPanels\
  \ and reset AIAttackVars.Unk_10 from Unk_12, returning.\n  8. (Hit the destination panel) If AIState.Unk_04\
  \ == 1, skip the Future* copy;\n     else copy FuturePanelX/FuturePanelY into PanelX/Y and object_removePanelReserve.\n\
  \     Then object_setCoordinatesFromPanels, object_setCollisionPanelsToCurrent,\n     clear ObjectFlags1\
  \ bit 0x40, set OBJECT_FLAGS_CURRENTLY_MOVING (1<<19), set region 1.\n     If AIAttackVars.Unk_00 !=\
  \ 8, calls sub_801171C (object_exitAttackState_801171C).\n"
