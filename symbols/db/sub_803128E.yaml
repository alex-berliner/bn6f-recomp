name: sub_803128E
address: '0x0803128E'
kind: function
status: confirmed
summary: Resolves the player/camera pose, optionally pans the camera by half the right-pose delta, and flags the
  result by ORing 3 into the r12 camera-state word.
interface: void sub_803128E(u32 r0, u32 r1, u32 r2, u32 r5, u32* r12 /* in/out */)
details: 'Saves the live inputs (r0, r1, r2, r5) and the camera-state word in r12 across callees.

  Calls sub_8031122 to obtain the player-facing pose, then runs math_pointLeftOfLineTest_80315DC

  against the fixed line (0x20,0)-(0,0x20) with test point (0,0). If the result is non-zero

  (point lies to the left), restores the saved inputs, calls sub_80311B6 to get the right-side

  pose, computes its delta from the same line via sub_8030F7C, halves the (r0, r1) delta and

  feeds it to camera_moveByDelta_80310B0. Finally ORs 3 into the saved r12 word to mark the

  resolved camera state and returns via pop {r0-r2,r5,pc}. The "OR 3" pattern sets the two low

  bits, suggesting r12 is a camera-state bitfield where bits 0-1 indicate which side/pose was

  selected.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
