name: ai_attackChargeUpdate
address: '0x080FF284'
kind: function
status: probable
summary: 'AI attack state-machine step: starts a charged attack, flashes the target panel while charging,
  and fires the element-4 hit when the timer expires.'
interface: (r0 = scratch only, reads oAIAttackVars from r7, battle object from r5) -> r0 = HitElement
  code written into oAIAttackVars; no return value used
details: 'On first entry (AttackElement == 0) it begins the attack: sets AttackElement = 4, copies the
  target object''s panel coords (offsets 0x12/0x13) into TargetPanelX/Y after validating them with object_isValidPanel,
  plays battle-object animation 0xC, sets counter time 6 via object_setCounterTime, loads StepTimer from
  AttackBoost2, and clears AttackStepIndex and ChargeCycles. While charging it increments ChargeCycles
  and every 8th cycle calls object_highlightPanel on the target panel (blinking aim marker), decrementing
  StepTimer each tick. When StepTimer reaches 0 it writes HitElement = 4, handing off to the attack''s
  damage step. If the target panel was invalid at start, it immediately writes HitElement = 0x24 (abort/fail
  code) without charging.'
