name: battle_dispatchAIAttackByElement
address: '0x08112D9C'
kind: function
status: probable
summary: Dispatches an AI attack handler selected by the current hit element byte, using a 4-entry jump
  table to element- or form-specific handlers (including battle_initBeastOutAttack_8112E34).
interface: (r0 = attack vars element index read from [r7+oAIAttackVars_HitElement]; r7 = battle/AI attack
  vars object) -> r0 = return of chosen handler; uses lr as return address (bl-style)
details: Loads the element byte from the battle object's AI attack vars (oAIAttackVars_HitElement), uses
  it to index a 4-entry jump table at off_8112DB0, and long-calls the selected handler with mov lr, pc;
  bx r1. Entry 0 is a default handler, and entry 1 is battle_initBeastOutAttack_8112E34, indicating the
  dispatch selects element- or form-specific attack initialization (likely normal vs beast-out/element
  variants). r0 is passed through to the callee, whose return becomes this function's return.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0, [r7,#oAIAttackVars_HitElement] then ldr r1, [r1,r0] indexes the table by element; jump
    table off_8112DB0 contains 4 handlers, including battle_initBeastOutAttack_8112E34; mov lr, pc; bx
    r1 is a Thumb long-call, so the subs are functions invoked with this as a dispatch trampoline; executed
    on recorded battlesweep/beastsp routes, consistent with battle attack handling
  refs:
  - bn6f/asm/asm32.s:10170
