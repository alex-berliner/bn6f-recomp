name: battle_checkRelayFlags
address: '0x080D9690'
kind: function
status: probable
summary: Returns whether the object's relay flags (ExtraVars[0] AND ExtraVars[1]) are non-zero, used to
  relay damage to a related object.
interface: '() -> r0: r0 = (ExtraVars[0] & ExtraVars[1]) != 0'
details: Reads oBattleObject_ExtraVars and oBattleObject_ExtraVars+4 from r5, ANDs them together, and
  returns r0=1 if any bits are set, r0=0 otherwise. It performs no side effects; r3 is used as a temporary
  return value via mov r0,r3. No callees are called.
