name: object_spawnPanelEffectInit
address: '0x080C5A58'
kind: function
status: probable
summary: 'Late half of a battle-object spawner: validates the panel, loads a sprite and collision data,
  then hands the object to its update state.'
interface: (r5 = battle object header, carried over from caller) -> r0 = destroyed; spawns object on current
  panel or frees it
details: Uses r5 (set by the preceding code — callers unknown, so this is likely a branch/fallthrough
  target inside a larger spawn routine). If object_isCurrentPanelValid fails it calls object_freeMemory
  and exits. Otherwise it loads sprite resource (0x80,0x10,0x24), clears the shadow, sets object flag
  bit 1, resets both animation fields to 0 and reloads animation/palette 0, then sets Param1 += 0x28 and
  Timer to that value (a frame lifetime/counter). It positions the object one unit above its panel (Y
  -= 0xffff0000 fixed-point, Z = -1.0) via object_setCoordinatesFromPanels, allocates a collision slot,
  and on failure frees the object. On success it configures the collision box to 0x48 x 0x2a with power
  1, sets hit effect 1, clears the collision region, refreshes collision state, switches CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_UPDATE, and calls sub_80C5AD4 (the object's update handler).
