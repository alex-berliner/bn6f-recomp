open_questions:
- Whether 0x200 in ObjectFlags2 is genuinely the "anger" status or some unrelated trigger; the field name
  OBJECT_FLAGS_2_UNK_BIT_21 is unconfirmed. Confirming this would require checking other producers/consumers
  of bit 21 or matching behaviour in BN6J/Bn5.
- What sub_801442C returns (the 0x78 threshold's units); it looks like an AI anger/aggro counter but no
  struct field is confidently tied to it.
- The exact meaning of the FinalDamage/2 < 0x96 test — possibly a "recently took heavy damage" anger trigger.
