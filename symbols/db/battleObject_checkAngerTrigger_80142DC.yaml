name: battleObject_checkAngerTrigger_80142DC
address: '0x080142DC'
kind: function
previous_names:
- sub_80142DC
status: probable
summary: Tests several hostility/anger-related criteria for a battle object and sets the "anger" ObjectFlag2
  bit if any condition triggers.
interface: '(r5 = battle object, r10 = toolkit) -> none ; side effects: may set OBJECT_FLAGS_2_UNK_BIT_21
  (0x200) on the object''s CollisionData.ObjectFlags2'
details: "1. Reads the current battle mode via GetBattleMode(); if the mode is 1 (e.g. a friendly/peaceful\
  \ battle mode) the routine immediately returns without doing anything.\n  2. Reads two NaviStats bytes\
  \ via GetBattleNaviStatsByte_AllianceFromBattleObject using offsets 0x29 (Mood) and 0x2c (Transformation);\
  \ if either is non-zero the routine returns (these are the early-out \"happy Navi\" cases).\n  3. Calls\
  \ object_getFlag() on the battle object's CollisionData to fetch ObjectFlags1; checks bit 0x15 (OBJECT_FLAGS_ANGER,\
  \ \"Anger\" = 0x00200000). If that bit is set the routine returns — i.e. anger flag is the \"already\
  \ set\" early-out.\n  4. Calls sub_801442C to obtain a numeric score (likely the AI's current \"anger\"\
  /aggro level for the object). If it is >= 0x78 the function takes the set-flag path; otherwise it does\
  \ a secondary check on the object's CollisionData+0x80 halfword (`FinalDamage`) shifted right by 1 —\
  \ if the result is < 0x96 the routine returns, and if it is >= 0x96 it takes the set-flag path.\n  5.\
  \ When any of the threshold conditions is met, it sets 0x200 (1<<9) in the object's CollisionData+0x40\
  \ (ObjectFlags2) via object_setFlag2, which is the OBJECT_FLAGS_2_UNK_BIT_21 bit.\n  6. The captured-call\
  \ entry state (r0 = a 0x40-byte struct at EWRAM 0x02034080, r1 = 0, r3 = 0x020384f0, sp around 0x03007d8c,\
  \ return into 0x0801ad05) is consistent with sub_80142DC being invoked from an object update caller\
  \ with a generic scratch/work area; the routine itself only uses r5 (battle object) and r10 (toolkit)\
  \ for its reads.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl GetBattleMode` / `cmp r0,#1` / `beq locret_8014324` shows the mode-1 early return. -
    `mov r1,#0x29` then `bl GetBattleNaviStatsByte_AllianceFromBattleObject` / `cmp r0,#0` / `bne locret_8014324`
    reads NaviStats offset 0x29 (Mood) and bails if set; the same pattern with `mov r1,#0x2c` reads offset
    0x2c (Transformation). - `bl object_getFlag` followed by `mov r1,#1; lsl r1,r1,#0x15; tst r0,r1` checks
    bit 0x15 = 0x00200000, matching OBJECT_FLAGS_ANGER in the CollisionData struct. - `bl sub_801442C`
    followed by `cmp r0,#0x78` / `bge loc_801431C` sets up an "anger threshold reached" branch. - `ldr
    r0,[r5,#oBattleObject_CollisionDataPtr]; add r0,#0x80; ldrh r0,[r0]; lsr r0,r0,#1; cmp r0,#0x96` reads
    the u16 FinalDamage field at CollisionData+0x80, divides by 2, and branches based on >= 0x96. - `mov
    r0,#1; lsl r0,r0,#9` produces the value 0x200, which is passed into `bl object_setFlag2` to set OBJECT_FLAGS_2_UNK_BIT_21.
    - The single caller sub_801AC6C takes r5/r10 among others, matching the function''s r5=object / r10=toolkit
    contract.'
