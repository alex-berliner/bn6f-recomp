status: probable
summary: 'Map-enter trigger: when the map actually changed (number or group) or EVENT_1703 is pending
  and no cutscene is running, starts the after-jack-in cutscene (or its EVENT_127 variant), then clears
  the trigger flags.'
interface: 'void cutscene_TryStartOnMapEnterAfterJackIn(void) : r10 (toolkit) -> [r0 r1 r2 r3] (captured
  exits r0 = 0x80, the last flag id handled)'
details: 'Reads GameState via the toolkit: if oGameState_MapNumber == oGameState_LastMapNumber it also
  compares oGameState_MapGroup with oGameState_LastMapGroup; equal means no map change. On a changed map
  (or when EVENT_1703 is set) and no cutscene script active (IsCutsceneScriptNonNull), it starts CutsceneScriptOnMapEnterAfterJackIn_809895C
  via StartCutscene(script, 0) - unless EVENT_127 is also set, in which case the alternate script byte_80989C1
  is started instead - then clears EVENT_1703 and EVENT_127. On the same-map / no-trigger / cutscene-busy
  path it clears EVENT_1703, EVENT_1724 and EVENT_127 without starting anything. Called by every region''s
  *_EnterMapGroup function right after the map is set up, so it runs once per map transition.

  '
