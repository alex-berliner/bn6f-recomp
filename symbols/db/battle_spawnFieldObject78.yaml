name: battle_spawnFieldObject78
address: '0x080D4408'
kind: function
status: probable
summary: Spawns battle object id 0x78 at a caller-given panel, copies the caller's alliance/facing onto
  it, and registers it as a field battle object.
interface: (r0 = panel X, r1 = panel Y; r5 = source battle object whose AllianceAndDirectionFlip is copied,
  r6 = value for DamageAndStaminaDamageCounterDisabler) -> r0 = spawned/new object pointer or failure
  result of setFieldBattleObject; Z from spawn success
details: Saves the caller's r0-r2/r5, calls object_spawnType3 with r0 = 0x78, and bails out if the spawn
  returned zero (the Thumb 'mov r0, r5' is an LSLS that sets flags for the beq). On success the new object
  gets PanelX/PanelY from the caller's r0/r1, the 32-bit DamageAndStaminaDamageCounterDisabler field from
  r6, and AllianceAndDirectionFlip copied from the caller's r5 object. It then sets bit 0x10 in oObjectHeader_Flags
  and calls setFieldBattleObject_800F614 with r1 = alliance & 0xFF and r2 = 1, apparently installing the
  object as an active field object facing that direction. The pushed r0-r2,r5 exist purely to carry the
  caller's arguments across the spawn call's clobbers.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_spawnType3 with r0 = 0x78 creates the battle object; 'mov r0, r5; beq' skips all writes
    when the spawn failed; strb r1/r2 to oBattleObject_PanelX/PanelY places the new object on the caller's
    panel; str r6 to oBattleObject_DamageAndStaminaDamageCounterDisabler and ldrh/strh of oBattleObject_AllianceAndDirectionFlip
    from the caller's r5 object copy caller state; oObjectHeader_Flags |= 0x10 then bl setFieldBattleObject_800F614(r0,
    alliance & 0xFF, 1) registers the spawned object; sole caller 0x080E5E44 and callee summaries (spawnType3,
    setFieldBattleObject) match a spawn-and-register wrapper
  refs:
  - bn6f/asm/asm31.s:61650
  - 0x080E5E44 sub_80E5E44
  - 0x08003358 object_spawnType3
  - 0x0800F614 setFieldBattleObject_800F614
