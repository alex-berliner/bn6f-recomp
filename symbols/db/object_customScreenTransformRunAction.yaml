name: object_customScreenTransformRunAction
address: '0x080E9590'
kind: function
status: probable
summary: 'Per-frame update for the custom-screen battle object: dispatches to dim, chip-name draw, or
  undim handlers based on the object''s current action state.'
interface: (r5 = battle object pointer; no args in r0-r3) -> r0 = value returned by the selected handler
details: 'Loads the object''s oBattleObject_CurAction byte from the object at r5, indexes off_80E95A4
  (4 entries) with it, and tail-calls the selected Thumb handler with lr set for a return-through-pop
  {pc}. The table''s handlers are object_dimScreen, object_drawChipName, sub_80E95B4, and object_undimScreen,
  so the object walks states: dim screen, draw chip names, an unknown intermediate state, then undim.
  This matches the battle Custom Screen sequence (dim battle, list chip names, restore) being driven as
  a battle object. The dispatch passes no arguments in r0-r3, so the handlers presumably also read the
  object from r5.'
