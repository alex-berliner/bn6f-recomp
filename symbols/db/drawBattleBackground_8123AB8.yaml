name: drawBattleBackground_8123AB8
address: '0x08123AB8'
kind: function
status: confirmed
summary: Decompresses and uploads the five tile regions (center, mid-strip, left/right panels, etc.) of the battle
  background into BG tile block 2 for the current field's tileset.
interface: void sub_8123AB8(u32 *battle_obj /* r5 */); preserves r4-r7, flags from last sub-call
details: "Called with r5 = pointer to a battle object whose byte at offset 0xC indexes a ROM\ntable (dword_8123BBC:\
  \ 0x382E24) of u8 offsets; the u16 at (battle_obj + offset)\nis the field's tileset ID. The function:\n  1. sub_81200EC\
  \ staging-buffer prep with width arg r3=0xB, count r5=5, source\n     unk_201D220, dest unk_201D6E0.\n  2. CopyBackgroundTiles\
  \ to bg (j=0xE,i=8,block=2) using unk_201D6E0, 8 cols x 10 rows.\n  3. sub_8120390 with VRAM dest 0x6007200, source\
  \ unk_201D7C0, pal byte_8123394, count 5\n     → upload at (j=0xC,i=8,2 cols x 10 rows, unk_201D7C0).\n  4. sub_81203E4\
  \ with palette slot (0xA<<12)|0x35C, VRAM dest 0x6006B80 → upload at\n     (j=0x16,i=8,2 cols x 10 rows, unk_201D7F8).\n\
  \  5. sub_8120458 with palette slot (0xB<<12)|0x216 → upload at\n     (j=0x18,i=8,1 col x 10 rows, unk_201D830).\n\
  \  6. sub_81204C4 with palette slot (9<<12)|0x34F → upload at\n     (j=0x19,i=8,2 cols x 10 rows, unk_201D84C).\n\
  All five sub-routines are passed the same tileset_id and battle_obj pointer; together\nthey compose the layered\
  \ battle background. Caller contract: r5 in, r5/r6/r7 out\n(r6/r7 actually preserved), r0-r3/r4/lr clobbered,\
  \ NZCV reflects last callee (CopyBackgroundTiles\nor sub_81204C4). push {r4-r7,lr} / pop {r4-r7,pc} — true return\
  \ in r15 via popped lr.\n"
