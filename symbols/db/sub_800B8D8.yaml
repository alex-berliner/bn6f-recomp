name: sub_800B8D8
address: '0x0800B8D8'
kind: function
status: hypothesis
summary: Fetches a record pointer via sub_800BF5C and reports (as a bool, plus flags) whether that record's kind
  byte equals the index passed in r0.
interface: 'bool sub_800B8D8(u32 index); // in: r0 = index; out: r0 = 1 if record kind == index else 0, r2 = index
  (clobbered), flags Z/C/V from CMP kind,index'
details: 'A tiny predicate wrapper. It saves the incoming r0 (the index) by pushing it, calls sub_800BF5C to obtain
  a pointer to some record (likely the "current" entry of a list/table that subsystem keeps in static state), then
  pops the saved index straight into r2 so it survives the call. It reads the byte at offset +3 of the record —
  evidently the entry''s type/kind field — and CMPs it against the index, so the caller can branch on the comparison
  flags directly. Returns r0 = 1 on equality, 0 otherwise. The push/pop-of-r0 trick is the only reason r2 is listed
  as an output; it is the input index handed back for the caller''s own use.

  '
