name: battle_refreshObjectSprite_8117E20
address: '0x08117E20'
kind: function
status: confirmed
summary: Per-frame sprite refresh for a battle object - picks the animation (with a +5 offset variant when the object's
  state changed), loads it if different, and advances the sprite one frame.
interface: void battle_refreshObjectSprite_8117E20(Object* obj /*r5*/, StateSrc* src /*r7*/)
details: 'r5 points to a battle object struct and r7 to a related struct whose byte at +0xD is the

  object''s current state. The desired animation is read from obj+4; if the state byte (r7+0xD)

  differs from the copy cached at obj+3 (i.e. the object changed state since the animation was

  last chosen), 5 is added to pick the alternate-state animation (e.g. damaged/other-pose

  variant). The chosen animation index is compared against the currently loaded one cached at

  obj+0xC; if different, obj+0xC is updated, sprite_setAnimation(wantedAnim) is called,

  sprite_loadAnimationData() loads the tiles, and sprite_noShadow() disables the shadow.

  Finally sprite_update() advances the sprite one frame. Only r4/r5 are preserved; the caller

  reads back r0-r3 and flags but they appear to be scratch.

  '
