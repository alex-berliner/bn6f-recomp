name: ow_animVariantToAnimId
address: '0x080A8038'
kind: function
status: probable
summary: Translates an overworld animation variant selector into an animation id via an 8-entry lookup
  table, returning 0xFF for invalid/none.
interface: (r0 = variant selector index) -> r0 = animation id (0xFF if the selector is an even/half-invalid
  entry); flags not meaningful
details: 'The whole routine is a table lookup: it loads a byte from byte_80A8044 at offset r0 and returns
  it. The table is pairs FF,00,FF,01,FF,02,FF,03 — every even index yields 0xFF (a likely ''none/invalid''
  sentinel used elsewhere in the engine) while indices 1,3,5,7 map to 0-3. This matches the caller ow_animWaitStep,
  which plays an animation variant before waiting ~30 frames, so the selector likely encodes an NPC facing/variant
  half that must be resolved to a concrete animation id before playback. The rest of the section (byte_80A804C
  onward) holds OAM-entry-style data and sprite/frame id lists, consistent with this being animation-support
  data for overworld NPCs.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Body is only ''ldrb r0, [r1,r0]'' with r1 = byte_80A8044 — a pure indexed lookup; byte_80A8044
    = FF,00,FF,01,FF,02,FF,03: even slots 0xFF, odd slots 0..3; Caller ow_animWaitStep ''plays an animation
    variant'' then waits, matching a variant-to-id resolution; 0xFF sentinel is a common ''no animation/invalid''
    value in this codebase''s overworld animation fields'
