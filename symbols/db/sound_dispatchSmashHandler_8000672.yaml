name: sound_dispatchSmashHandler_8000672
address: '0x08000672'
kind: function
status: confirmed
summary: Look up a sound-table entry by index and dispatch it to sound_8000808 with the object_setSmashFactor callback,
  preserving r10 across the call.
interface: void sound_8000672(u32 r0 /* sound-table index */, u32 r1, u32 r2) -> r3 (= saved r10), c/v from callee;
  r4-r7, r10, lr preserved; nz, r0 clobbered
details: Shifts r0 left by 2 (index * 4) to address a word-sized table at 0x08000704 (off_8000700 -> off_8000704).
  Loads the entry into r0. Saves r10 on the stack, sets r3 = object_setSmashFactor+1 (0x0800087C), and tail-calls
  sound_8000808(table_entry, caller_r1, caller_r2, &object_setSmashFactor). After the call, pops the saved r10 into
  r3 (so the caller sees the original r10 as a return value) and restores it to r10. The C and V flags set by sound_8000808
  propagate unchanged to the caller because no flag-modifying instruction follows. r4-r7 are pushed/popped for ABI
  compliance but never written in this wrapper.
