name: MapScriptCutsceneCmd_terminate_one_or_all_gfx_anims
address: '0x08035F6A'
kind: function
status: confirmed
summary: Map script/cutscene command that stops one GFX animation slot, or all of them when the argument byte is
  0xFF.
interface: void MapScriptCutsceneCmd_terminate_one_or_all_gfx_anims(u8 scriptByte /* via ReadMapScriptByte */, ...);
  returns 1 (Next) in r0, advances script pointer r7 by 2
details: 'Implements the map-script/cutscene opcode "stop GFX animation(s)". Sets r6 = 1 and calls ReadMapScriptByte,
  which deposits the byte it read into r4. If the byte is 0xFF, it loops r4 = 0..NUM_GFX_ANIMS-1 calling TerminateGFXAnim
  on every slot (r4 doubles as loop counter and argument; TerminateGFXAnim preserves r4). Otherwise it calls TerminateGFXAnim
  once with the byte as the slot number. In both cases it advances the script pointer (r7) by 2 — the command is
  a 1-byte opcode plus 1-byte argument — and returns 1 in r0 (the "continue script" result). Flags are left reflecting
  the r7 += 2 add and the final r0 = 1 (NZ set).

  '
