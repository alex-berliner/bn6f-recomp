name: pet_setCurNaviHp
address: '0x0813171C'
kind: function
status: probable
summary: Writes one of three HP values (800/1000/1200) into both max-HP and current-HP fields of the navi
  currently selected on the PET
interface: (entry point at 0x813171C/0x8131722/0x8131728 selects HP = 800/1000/1200; r0-r3 args unused)
  -> r0 = ?; sets stats[0x40] and stats[0x42] to the chosen halfword
details: 'Three shared-tail entry points each load a constant (0x320, 0x3E8, 0x4B0) into r4, then call
  GetCurPETNavi and pass its navi slot to SetNaviStats203CCE0Hword twice: once with field 0x42, once with
  field 0x40, both receiving the same r4 value. The struct at 0x203CCE0 is the per-navi stats block; 0x40/0x42
  being written as a pair suggests max and current HP halfwords. The values 800/1000/1200 are consistent
  with navi base HP totals in BN6. r0 is never read, so the caller''s only input is which entry point
  it branches to.'
