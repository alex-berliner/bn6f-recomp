name: object_runUpdateDispatch_811A190
address: '0x0811A190'
kind: function
status: confirmed
summary: Per-frame update dispatcher for one object — calls the object's type-specific handler chosen by the byte
  at object+9, then runs two shared update passes.
interface: void object_runUpdateDispatch(Object* r5 /* in only */); no meaningful return value (r0/r1 flow out of
  the last shared pass and are presumably ignored by callers)
details: 'Takes the object pointer in r5 (set up by the caller, likely a shared callee-saved

  register convention across this object system). Reads the type/state byte at

  [r5+9], indexes the handler table at off_811A1AC with it, and tail-jumps to that

  handler (the trampoline at off_811A1A8 loads the table base, and the handler is

  entered with the handler address still in r0 and the type byte in r1 — those two

  values are live inputs to the handler, see sub_811A1B0). The table currently has

  exactly one entry, sub_811A1B0, so every type value resolves to it (indices past

  the single entry would read garbage, so valid objects presumably always carry 0).

  After the per-type handler returns, two shared passes common to all objects run

  in fixed order: sub_811A29C then sub_811A2EC. This looks like the "object

  personality handler + common movement/animation passes" pattern typical of the

  game''s per-object update loop.

  '
