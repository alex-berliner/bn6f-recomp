name: sub_8031C7C
address: '0x08031C7C'
kind: function
status: hypothesis
summary: Thin battle-mode wrapper that calls sub_803172E with the caller's args, invokes sub_80315B8 with the fixed
  parameters (14, 14, 0, 16), then calls sub_8031B7C to finish a short setup sequence.
interface: 'void sub_8031C7C(int r0, int r5); /* tail-ish: returns whatever the last callee leaves in r0, r2-r7
  and NZCV */'
details: 'Pure sequencer: it does no work of its own. First it forwards the incoming r0 and r5

  unchanged to sub_803172E (lr is saved on the stack, so the calls are ordinary bl''s, not

  tail calls). It then loads a hardcoded parameter set for sub_80315B8:

  r2=0xE (14), r3=0xE (14), r4=0, r5=0x10 (16) — a symmetric 14/14 pair with an offset

  of 0 and a size/extent of 16, which looks like a small rectangle or row/column band

  (e.g. a message-window or HUD strip in battle), but the callee''s role is not confirmed.

  Finally it calls sub_8031B7C with no further arguments prepared, so that call sees the

  registers sub_80315B8 left behind. Nothing is preserved or normalized on the way out:

  r0, r2-r7 and NZCV are all just the residue of the last callee, and lr is popped with

  pop {pc} to return. No memory, no structures and no flags are touched by this function

  itself; everything depends on what the three callees do.

  '
