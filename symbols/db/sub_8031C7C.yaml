name: sub_8031C7C
address: '0x08031C7C'
kind: function
previous_names: []
status: hypothesis
summary: Advances the custom-screen cursor blink/animation tick and refreshes its position relative to a target.
interface: '(r0 = pointer to BattleObject / scratch buffer) -> r0 = result of sub_8031B7C (likely a counter/state
  value) ; side effects: writes via battle_calcRelPosToTarget_803172E, textbox_computeCursorBlinkAdvance_80315B8,
  and sub_8031B7C'
details: "1. Tail-call prologue: push {lr} then bl battle_calcRelPosToTarget_803172E — recomputes coordinates (and\
  \ next-position) for the entity pointed at by r0 against the doubled target reference (see `calcRelPosToTarget`\
  \ summary).\n  2. Sets r2 = 0xe, r4 = 0, r3 = 0xe, r5 = 0x10 in registers, then calls textbox_computeCursorBlinkAdvance_80315B8\
  \ — based on the callee’s contract, this advances a per-frame cursor blink/animation state for the chip-select\
  \ / \"Custom\" screen (constants 0x0e / 0x10 match common chip-row sizes, e.g. half-width / chip-count).\n  3.\
  \ Calls sub_8031B7C which, when its entry r0 is 1, returns byte 1 of [[dword_2013920] + 0x14]; here r0 inherits\
  \ whatever the previous calls left, so it acts as a state/effect dispatcher using that scratch byte.\n  4. `pop\
  \ {pc}` makes this a tail-call thunk: every external call is the real work, and the function itself only sequences\
  \ them.\n  5. All three callees also live in the 0x08031xxx range, and the captured-call lr=0x08031ad0 plus entry\
  \ r0=0x02009f5c (an EWRAM scratch buffer used in cutscene/cutscene-camera bookkeeping) are consistent with a per-frame\
  \ tick inside the BattleChip-select / \"Custom\" UI loop, where the cursor blink is driven from a battle cutscene-script\
  \ frame index.\ndetails: |\n  The captured-call r0=0x02009f5c buffer is rewritten between snapshots (the two middle\
  \ 16-bit halves at +4 and +0x10 cycle through 0xaf/0xb1, 0xab/0xad, 0xa9/0xab — descending pairs — i.e. a moving\
  \ target panel coordinate), exactly what `calcRelPosToTarget` produces. The constant `0x10` passed in r5 matches\
  \ `oPanelData_Size` and `0x0e` (14) is the per-row panel count visible in BN6’s 3×3/6-row grid. Together they\
  \ indicate a per-frame panel-target update.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Three sequential bl calls inside one short tail-call thunk (`asm03_0.s:25747`) — pure orchestration,
    no local computation, so naming has to come from the callees. - `mov r2,#0xe ; mov r4,#0 ; mov r3,#0xe ; mov
    r5,#0x10` immediately before `bl textbox_computeCursorBlinkAdvance_80315B8` provides the per-row/column counts
    the function needs to walk the cursor grid. - Captured entry r0=0x02009f5c is a 0x40-byte EWRAM buffer whose
    bytes at +0x04/+0x10 change between snapshots in a way consistent with a moving target reference point, which
    is exactly what `battle_calcRelPosToTarget_803172E` writes. - Caller list is empty in the dump but the function
    is reached with lr=0x08031ad0 in every snapshot — a sibling 0x08031xxx function calls it on every frame. - `pop
    {pc}` (not `pop {lr}; bx lr`) makes this a tail-call dispatch to sub_8031B7C, which then returns whatever the
    camera/cursor state was.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08031C7C

    '
  result: the body read as described above
