name: beastout_loadSelectionScreenChipUseGfx
address: '0x0802871C'
kind: function
status: confirmed
summary: Queues the chip-use tile art and the selected chip's icon sheet for the Beast-Out selection screen, then
  reloads its sprite sheets.
interface: 'void beastout_loadSelectionScreenChipUseGfx(void); (in: lr only; r2-r7 and flags clobbered by callees)'
details: "Part of the Beast-Out selection screen's graphics setup, called with no arguments. It performs\nthree\
  \ steps:\n  1. Calls loadOneSpriteTileRow_80287D2 to stage one tile row of chip-use art.\n  2. Queues a GFX transfer\
  \ of that staged data from byte_8723034 to VRAM 0x6009560,\n     0x540 bytes, via QueueEightWordAlignedGFXTransfer.\n\
  \  3. Calls getLocOfActiveChips_8027E1C with a1 = 0xB (active-chip list kind 11) and reads the\n     byte at offset\
  \ +6 of the entry, which is the selected chip's index. The chip's 0x20-byte\n     icon sheet is computed as dword_8725814\
  \ + index * 0x20 and queued as a second GFX\n     transfer into IWRAM buffer unk_3001AA0 (presumably staged for\
  \ a later copy to object\n     tile VRAM).\n  4. Finally calls beastout_LoadSelectionScreenSpriteSheets_802869E\
  \ to reload the\n     selection-screen sprite sheets on top of the new graphics.\nTouches: VRAM tile area at 0x6009560,\
  \ chip icon sheet table dword_8725814 (0x20 bytes per\nchip), IWRAM staging buffer unk_3001AA0, and the active-chip\
  \ list entry kind 0xB field +6.\nThe function itself returns nothing meaningful; r2-r7 are just leftover callee\
  \ registers.\n"
