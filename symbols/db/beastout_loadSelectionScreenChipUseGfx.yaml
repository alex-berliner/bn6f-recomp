name: beastout_loadSelectionScreenChipUseGfx
address: '0x0802871C'
kind: function
status: probable
summary: 'Custom-screen chip-use GFX loader: queues a fixed graphics block plus one per-chip tile into
  VRAM/buffer, then reloads the Beast Out selection sprite sheets.'
interface: () -> (); queues a 0x540-byte ROM block to VRAM 0x6009560 and a 0x20-byte per-chip tile to
  unk_3001AA0
details: First queues a fixed 0x540-byte ROM block (byte_8723034) into VRAM at 0x6009560 — 42 4bpp tiles
  of shared graphics. It then looks up active-chip entry 0xb via getLocOfActiveChips_8027E1C, reads the
  byte at offset +6 (per-entry chip/index field), multiplies it by 0x20, and indexes the per-chip table
  dword_8725814 with that offset, queuing one 32-byte (single 4bpp tile) entry into the EWRAM buffer unk_3001AA0.
  Finally it calls beastout_LoadSelectionScreenSpriteSheets_802869E to refresh the three Beast Out selection
  screen sheets in VRAM slots 1-3. Called only from the custom-screen chip-use dispatcher (battleObject_runCustomScreenChipPickerEffect_8028476),
  i.e. when a chip is used from the custom screen during routes that show the Beast Out selection UI.
