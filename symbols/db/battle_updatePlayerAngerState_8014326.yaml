summary: 'Per-frame anger-state maintenance for the player-side battle actor: on the anger trigger sets
  the anger flag and a 600-frame oAIData_Anger timer, counts it down, and clears anger on expiry or when
  the emotion already supersedes it.'
details: 'unpackVerActorTyAndAIIdx_800F29C on oBattleObject_NameID; runs only for actor type 2. Reads
  oAIData_AIIndex (unused result) and the alliance emotion via callPossiblyGetBattleEmotion_8015B54: emotion
  5 or 1 -> clear ObjectFlags2 bit 0x200 and ObjectFlags1 bit 0x200000, return. Otherwise: when ObjectFlags1
  bit 0x200000 is clear and ObjectFlags2 bit 0x200 is set (the anger trigger): clear ObjectFlags2 bit
  0x200, set ObjectFlags1 bit 0x200000, oAIData_Anger = 0x96<<2 = 600, and battle_setPlayerNaviStatsField0E_8015BEC(alliance,
  0x80). When the anger flag is already set: decrement oAIData_Anger each frame; on expiry (0) call sub_80143A6
  (clears the state).

  '
