name: battle_getObjectAllianceTeam_800F49E
address: '0x0800F49E'
kind: function
status: confirmed
summary: Returns the alliance-team entry for a battle object's Alliance field from the allianceTeams table.
interface: u32 battle_getObjectAllianceTeam(struct BattleObject* obj /* r5 */; returns r0 = allianceTeams[obj->Alliance],
  r1 = &allianceTeams; clobbers NZ flags)
details: 'Reads the byte at oBattleObject_Alliance of the battle object passed in r5, multiplies it by 4

  (each entry is a word), and loads the corresponding entry from the allianceTeams table whose

  base pointer lives in dword_203CFA0. Returns the entry in r0 and the table base pointer in r1,

  so callers can both use the team value and re-index the same table. The table appears to map

  each alliance ID to a team/faction pointer or value used by battle logic to decide which side

  objects are on. Trivial tail-call via mov pc, lr; NZ flags end up clobbered by the shifts/loads.

  '
