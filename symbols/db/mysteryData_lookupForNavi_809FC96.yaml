open_questions:
- What is the in-game meaning of mystery_type values 3 and 7 that the cyclic scanner matches on?
- Does mysteryData_resolveMapGroupEntry_809FBF2 return a base pointer into gold data, or some other table?
- What controls pet_info[1] (the skip index consumed by goldMysteryData_GetEntryDataIfIdMatches)?
- The branch at loc_809FCFC tests `mystery_type == 5` AND `tst r5,r5` but uses `bne` to fall through when
  EITHER condition fails, so the cyclic path runs only when both are true; confirm this is the intended
  game semantics and not an overlap with another type.
- What does the computed r2 value ((type-1)*10 + mystery_type - 1) actually mean in the request UI --
  an index, an item ID, or something else?
