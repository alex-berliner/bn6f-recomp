open_questions:
- What state values the three table slots really cover (the CurState constants are 0, 4, 8, but
- here r1 is masked/used as a 4-byte index into only 3 entries — so one of the slots must be hit
- by an odd value, or CurState is normalised before being passed in; verifying what r5->0x8 holds
- at each of the 40 call sites would settle it).
