name: ai_tenguStartPanelAttack
address: '0x080F9154'
kind: function
status: probable
summary: 'TenguMan AI: selects a target panel via a callback and starts his attack state with an RNG-chosen
  duration.'
interface: () -> r0 = destroyed; sets oAIAttackVars_PanelChooseCallback and oAIAttackVars_AttackDuration
  on the AI struct at r7, enters attack mode 4
details: Stores a pointer to the sub_80F993A callback into the AI attack vars at [r7,#oAIAttackVars_PanelChooseCallback],
  then calls sub_80F90BA (itself an RNG-gated TenguMan AI step) and stores its return value as oAIAttackVars_AttackDuration,
  i.e. how long the attack stays active. Finally sets attack mode 4 (with parameter 9) via object_setAttack4,
  making TenguMan enter this attack's active state; the callback presumably runs each frame to position/drop
  the tornado effect on the chosen panel. The caller (sub_80F9000) gates this behind GetPositiveSignedRNG&0xF<0xE,
  so it is a common AI move choice.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0, off_80F92C4 / str r0,[r7,#oAIAttackVars_PanelChooseCallback] sets the per-frame attack
    callback (sub_80F9154); bl sub_80F90BA then strh r0,[r7,#oAIAttackVars_AttackDuration] derives the
    attack length from the other AI step; mov r0,#9; bl object_setAttack4 switches the object into attack
    state 4; caller sub_80F9000 gates this branch with GetPositiveSignedRNG&0xF<0xE (a random AI move
    selection)
