status: probable
summary: Returns whether a given scenario effect slot is currently active.
interface: (r0 = slot index 0..N) -> r0 = non-zero if the slot is active, zero otherwise ; sets nz/cv
  via tst; no other side effects
details: "Loads the base pointer `eScenarioEffectState2000780` into r5, then loads a single byte at\n\
  \  `eScenarioEffectState2000780 + 0x10 + r0` (the `+0x10` past the pointer is added before the\n  load,\
  \ so the byte accessed is `[2000790 + r0]`). The byte is then `tst`'d against itself and\n  the result\
  \ (the byte itself) returned in r0 — non-zero means the scenario effect slot is\n  set, zero means inactive.\
  \ Function is a tight leaf (no callees), r4-r7/lr are pushed but\n  only lr is paired with r5 via the\
  \ single ldr; the rest of the callee-saves are noise from\n  the prologue/pop pattern. The naming `_ADDRESS`\
  \ suffix is kept because the exact purpose\n  of `eScenarioEffectState2000780`/scenario effects table\
  \ is not directly named in the\n  project, so the role is partly inferred from the constant.\n"
