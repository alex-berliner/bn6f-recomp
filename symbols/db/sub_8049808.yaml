name: sub_8049808
address: '0x08049808'
kind: function
status: hypothesis
summary: Thumb-side jump-table dispatcher that calls sub_803AFC2(0), tail-dispatches on its nonzero return through
  a 5-entry Thumb function table, and otherwise falls through to sub_803A7B8 + sub_803BC7C(0).
interface: void sub_8049808(void); // r2/r4/r5/r10/lr caller-saved; r4-r7 preserved; c/v out, n/z clobbered
details: 'r0 is forced to 0 before calling sub_803AFC2 (a guest-side query). On a nonzero index it is used as a
  1..5 dispatch into dword_804982C, whose entries are Thumb-function addresses stored as +1 (so `bx r0` correctly
  switches to Thumb). The `lsl r0, r0, #2` only exists to set flags for the switch; the table is actually loaded
  with `ldr r0, [r1, r0]` (note the missing shift). Before the bx, LR is set to 0x0804981C so the chosen handler
  returns via the cleanup tail (sub_803A7B8 + sub_803BC7C(0)). On a zero result, the cleanup is run directly. Entry
  0 of dword_804982C is NULL (no case 0). Callers must preserve r4-r7; the dispatcher clobbers r0-r3, r8-r12, lr
  and the c/v flags.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
