name: pet_setCurNaviStatsFlag31
address: '0x0813CCEC'
kind: function
status: probable
summary: Sets byte 0x31 of the currently selected PET navi's NaviStats record to 1, marking some per-navi
  flag/progress value.
interface: () -> void; calls SetCurPETNaviStatsByte(0, 0x31, 1)
details: 'The routine is a bare wrapper: it passes record index 0, field offset 0x31, and value 1 to SetCurPETNaviStatsByte,
  which writes one byte into the NaviStats record of the navi currently selected in the PET. It takes
  no arguments of its own and returns nothing. What byte 0x31 means in the NaviStats structure (a ''used'',
  ''beaten'', or unlock flag of some kind) is not shown here, and no callers are known to disambiguate
  the context.'
