name: ai_syncModeEventFlag_808CF50
address: '0x0808CF50'
kind: function
status: confirmed
summary: For the current map group's AI/story mode, sets the mode's paired event flag if its check flag isn't already
  set.
interface: void sub_808CF50(r10 /* map group / AI-mode context */, lr); returns r7 unchanged (restored from stack);
  clobbers r0, r1, r3, lr, flags
details: "Calls ai_getAIModeForMapGroup_808D084 (r10 carries whatever context that helper\nuses to pick the map\
  \ group/mode) and doubles the result to get a byte offset into\ntwo parallel u16 tables:\n  byte_808CF7C = \"\
  test\" flag IDs: 0x09F8, 0x09FB, 0x09FE, 0x0FFD\n  byte_808CF84 = \"set\" flag IDs: 0x09DA, 0x09DB, 0x09DC, 0x0FC5\n\
  It reads the test flag for the current mode and calls TestEventFlag; if the flag\nis already set (Z clear) it\
  \ returns immediately, otherwise it calls SetEventFlag\nwith the matching entry from the second table. So each\
  \ AI mode has a one-way\nsync: once the condition flag fires, a derived/permanent flag gets latched.\nDespite\
  \ the \"outputs: r7\" contract, r7 is only preserved via push/pop and comes\nback exactly as it entered — the\
  \ function has no real return value.\n"
