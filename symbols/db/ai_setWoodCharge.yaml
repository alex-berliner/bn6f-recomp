name: ai_setWoodCharge
address: '0x080EF990'
kind: function
status: probable
summary: Stores ChargeCycles=1 and HitElement=4 (Wood) into the AI attack vars struct at r7, with a dead
  AiDifficultyTier branch; returns 4 in r0.
interface: (r0 = unused despite being set, r7 = oAIAttackVars struct) -> stores ChargeCycles=1 and HitElement=4
  into [r7]; returns r0=4, clobbers r1
details: Loads the AI difficulty tier from [r7,#oAIAttackVars_AiDifficultyTier] and compares to 0, but
  both branch paths set r0=1, so the check is dead code and the stored charge is always 1. It stores 1
  as a halfword into oAIAttackVars_ChargeCycles and 4 into oAIAttackVars_HitElement (element id 4 = wood).
  Returns 4 in r0, likely incidental from the last immediate load. The AiDifficultyTier read hints an
  unfinished per-difficulty charge value. No callers known, so the choice of element/charge pairing (which
  attack this configures) is inferred only from the element table.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strh r0, [r7,#oAIAttackVars_ChargeCycles] with r0=1 on both paths sets charge to 1; mov r0,#4
    / strh r0,[r7,#oAIAttackVars_HitElement] sets element id 4 (wood); ldrb r1,[r7,#oAIAttackVars_AiDifficultyTier]
    / cmp/beq is a no-op branch, both paths yield r0=1; field offsets are already named oAIAttackVars_*,
    so r7 is the AI attack-vars struct
