summary: Returns the EWRAM pointer to the NaviCust program table
interface: () -> r7 = unk_2006C88 ; no side effects
details: "Two-instruction tail-call thunk. Loads the absolute EWRAM address unk_2006C88\n  (the navicust\
  \ programs data block used during ApplyNavicustPrograms) into r7\n  via `ldr r7, off_813BD1C`, then\
  \ jumps to the saved lr with `mov pc, lr`,\n  so the data pointer is delivered in r7 per the caller's\
  \ out contract. No\n  other registers are touched and no callees are invoked.\n  Caller `applyNavicustPrograms_813C684`\
  \ reads r10 + indexes through this r7\n  pointer while looping over NaviCust bonus entries; the function\
  \ name and\n  behaviour come directly from that caller's contract, not from any internal\n  logic in\
  \ this thunk.\n"
