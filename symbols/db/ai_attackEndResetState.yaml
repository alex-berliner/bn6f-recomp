name: ai_attackEndResetState
address: '0x0810A9AE'
kind: function
status: probable
summary: 'AI attack-state cleanup: resets the battle object''s animation, step timer, collision region,
  panel reservation and hit element so it returns to its neutral AI state.'
interface: (r5 = battle object ptr, r7 = AI attack vars ptr) -> r0 = clobbered; no return value
details: If the object's ExtraVars (oBattleObject_ExtraVars) is nonzero the whole body is skipped, letting
  a special state persist. Otherwise it reads a halfword at r5+0x7C, doubles it (<<2) as an index into
  the table at byte_810A9E4, and stores the fetched byte into oBattleObject_CurAnim, selecting the idle/post-attack
  animation per AI variant. It copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer to restart
  the step timer, calls object_setCollisionRegion with region 1, releases the object's reserved panel
  at PanelX/PanelY via object_removePanelReserve, clears bit 0x40 of ObjectFlags1 with object_clearFlag,
  and stores 8 into oAIAttackVars_HitElement, wiping any attack-specific element.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst ExtraVars / bne locret: body only runs for objects in normal state; ldrh r1,[r5,#0x7c];
    lsl r1,#2; ldr r0,[off_810A9E0,r1]; strb r0,[r5,#CurAnim] picks anim from variant table; strh AttackDuration->StepTimer
    restarts the AI step timer; bl object_setCollisionRegion with r0=1 plus object_removePanelReserve
    undoes attack-time collision/panel booking; object_clearFlag(0x40) and HitElement=8 reset attack flag
    and element in the AI attack vars'
