name: sub_8132330
address: '0x08132330'
kind: function
status: confirmed
summary: Reads src[0x13] as an index into a u16 lookup table at byte_8132340 and stores the result at dest+0xA.
interface: void sub_8132330(u16 *dest /* r2 */, struct *src /* r5, byte field at +0x13 */)
details: 'Simple shim used by the text/chatbox (likely) to translate a character''s

  flag/index byte (src+0x13) into a u16 word and write it into a destination

  object at offset 0xA. The lookup table at byte_8132340 contains four

  u16 entries (0x0000, 0x0000, 0x0001, 0x0000), so the result is effectively

  1 only when the index is 2, and 0 otherwise — strongly suggesting

  "is kana / is dakuten / is special" or similar per-character flag lookup

  consumed by the text/dialog renderer at offset +0xA.

  Touches only r0/r1 (table pointer + index) and the caller-supplied

  dest (r2) and src (r5). No side effects beyond the halfword store.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
