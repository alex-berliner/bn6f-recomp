name: sprite_queueBattleOamEntry
address: '0x081267A8'
kind: function
status: probable
summary: Queues a single OAM sprite entry for the battle-scene struct, but only when the selected sprite's
  counter/phase value has reached at least 7.
interface: (r5 = battle/menu sprite struct base) -> r0 = void; queues one OAM entry via object_computeAndQueueOamEntry_811FA98
details: 'Reads an index byte at [r5+0xD]: if it is 0, the sprite data is taken from r5 itself; otherwise
  r7 = r5 + 10*index points at a sub-record. A gate is applied first: with index 0 the halfword [r7+0x12]
  must be >= 7, otherwise the function returns without drawing; with a nonzero index the gate value is
  read from [r5 + 4*index + 0x58]. When the gate passes it calls the known OAM helper with a fixed packed
  parameter 0xE200001A, base tile 0, tile id from [r7+0x12], sub-index/attribute from [r7+0x18], argument
  7, constant 0xC24C (OAM attribute-style value) and 0x6A. Callers are all battle-scene sprite routines
  (battle intro, transition tick, stage-2 battle init, menu frame update), so this renders one gated overlay
  sprite of that scene.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: gate ''cmp r0,#7 / bge'' or ''cmp r0,#7 / blt locret'' skips queueing until value >= 7;
    asm: ''bl object_computeAndQueueOamEntry_811FA98'' with tile id [r7+0x12] and sub-index [r7+0x18];
    dword_81267EC = 0xC24C and literal 0x6A are fixed attribute/position arguments to the OAM helper;
    callers battle_runIntro_812508C/battle_transitionTick_8125170/sprite_stage2InitBattleState_8124E7C
