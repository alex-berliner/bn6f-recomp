name: battle_aiLoadAttackParams
address: '0x0810588E'
kind: function
status: probable
summary: Loads two AI-version-dependent parameter bytes from data tables and stores them as two halfwords
  into the battle object's AI attack-variable block.
interface: (r0 = AI version index, r5 = battle object) -> writes [AIDataPtr+0xA0] and [AIDataPtr+0xA2];
  r0-r3, r6 clobbered
details: Reads byte_81058F8[version*8] and byte_8105934[version*8] via battle_aiGetVersionedTableEntry_800FE12,
  which indexes per-AI-version parameter tables (8 bytes per version). The first byte is kept as-is and
  the second is shifted left 16 and OR'd in, then the word is stored at the battle object's AI data pointer
  + 0xA0 (oAIAttackVars_Damage), so the low halfword gets table1's byte and the halfword at +0xA2 gets
  table2's byte. r0 is treated as a small version index (multiplied by 8). Callers are five nearby sibling
  routines (0x8105784-0x810585C), consistent with per-version attack-setup handlers sharing this parameter-loading
  step.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'both table reads use battle_aiGetVersionedTableEntry_800FE12 with r0*8 as offset, the versioned-entry
    getter''s documented calling pattern; lsl r0, #0x10; orr r6, r0 packs the second table byte into the
    upper half of r6; str r6, [r3+0xA0] with r3 = [r5+oBattleObject_AIDataPtr]+0xA0 writes the packed
    value to oAIAttackVars_Damage; byte_81058F8 and byte_8105934 are adjacent 8-bytes-per-version tables,
    matching other AI parameter tables'
