name: battle_object_clearFlagsAndCollisionCounter_801A284
address: '0x0801A284'
kind: function
status: confirmed
summary: Clears a battle object's 0x800 status flag and secondary flag 8, then zeroes a halfword in its collision
  data (likely a hit/interaction counter).
interface: void battle_object_clearFlagsAndCollisionCounter(BattleObject* obj /* r5 */); returns collision pointer
  in r3
details: 'Takes the battle object in r5. Calls object_clearFlag with bit 0x800 to clear that status flag on the
  object, then object_clearFlag2 with bit 8 to clear the matching bit in the object''s secondary flag word. Loads
  the object''s oBattleObject_CollisionDataPtr and stores 0 to the halfword oCollisionData_Unk_1c of the collision
  data struct. r3 is left holding the collision data pointer on return; r1/r2 are clobbered by the calls but listed
  as outputs, so callers presumably ignore them. The exact game meaning of flag 0x800, flag2 bit 8, and oCollisionData_Unk_1c
  is not identified; the pairing of flag clears with resetting this collision field suggests it ends some transient
  per-hit or per-interaction state on the object.

  '
