status: probable
summary: 'Per-frame chip-slot pulse animation step: pushes an OAM affine-transform record to the render
  FIFO and walks the pulse phase byte of the chip-select object.'
interface: '(r5 = *S20364C0, r10 = *Toolkit) -> void ; side effect: writes one 16-byte FIFO record (command
  0xB782) and updates oS20364C0_Unk_0f pulse phase'
details: "Entry reads [r5+1] (oS20364C0_JumpOffset01); the values 0x44 and 0x48 short-circuit\n  and force\
  \ a render-info relative offset of 0, otherwise the base offset is taken\n  from `[r10->RenderInfoPtr\
  \ + 0x18]`, clamped to <=0x67 via bgt early-out.\n  The base `(0x57 - that_u16) & 0x1FF` is assembled\
  \ into the high half of a 32-bit\n  record and OR'd with `oS20364C0_Unk_0e << 25`, plus a fixed constant\
  \ 0x800001FC.\n  The byte at `oS20364C0_Unk_0f` then nudges that value (subtract 1 for 2..6,\n  extra\
  \ subtract 1 for 3..4, add 0x10000 for 5..11, subtract 0x10000 for 2..3).\n  The packed value plus a\
  \ 0xB782 command tag is pushed through `fifo_pushRecord16_8009FF8`.\n  After the push, `oS20364C0_Unk_0f`\
  \ is incremented (or wrapped to 0 when it\n  reaches 0x14) and the next affine-matrix pair is loaded\
  \ from `byte_8029CAC`\n  (a sequence of byte pairs at offsets 0,2,4,...,0x40) and applied to the\n \
  \ battle object's sprite via `sub_802FE7A(sprite_setAffineTransform_802FE7A)`.\n  Called as the trailing\
  \ step of many chip-select / custom-menu / shuffle states\n  (sub_80271F8, sub_802728C, sub_802790C,\
  \ sub_8027A58, scrollStrip_update_8026BF4, ...).\n  The captures call traces all show r5 pointing at\
  \ the chip-select object (r5 has\n  the same 0x6c/0x60/0x65 seen across the same call sites).\n"
