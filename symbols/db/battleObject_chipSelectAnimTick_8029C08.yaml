    `ldrh r1,[r1,#0x18]` is consistent with RenderInfo offset 0x18 in the Toolkit (BattleState R; sub_802FE7A).
    - Push through `fifo_pushRecord16_8009FF8` with arg r1 = 0xB782 marks this as the affine-transform
    FIFO command (confirmed callee summary). - The `byte_8029CAC` table is a 20-pair X/Y sequence (40
    bytes) consumed as `(index<<1) and (index<<1)+1` (visible at loc_8029C82). - oS20364C0_Unk_0f is a
    counter: it grows until 0x14 then resets to 0 (loc_8029C82..loc_8029C8E), matching a per-frame pulse
    phase counter. - The branch on JumpOffset01 being 0x44/0x48 selecting a "force identity" rendering
    path is the only special-case consumer of those values.'
