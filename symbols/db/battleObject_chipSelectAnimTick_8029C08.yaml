open_questions:
- Exact role of `oS20364C0_JumpOffset01` values 0x44 vs 0x48 (both go to the identity path; only a single-byte
  diff and no other distinguishing logic in this routine).
- What the rendered FIFO value's bottom bits encode (object index? tile id?) - the routine only computes
  and pushes it, not consumes it.
