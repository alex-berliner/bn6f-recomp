  reproduce: python3 tools/asmcat.py 0x080E1D18
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s details almost perfectly: flag bit 0x2 set, sprite_load(0x80,0x14,2),
    sprite_noShadow, anim 1 in CurAnim/CurAnimCopy, palette from Param1, ZVelocity=0x20000, CurState=2,
    then call to battle_objectFlyAnimUpdateAndDestroy. However, ''spawn'' in the name implies creating
    a new object, while the routine operates entirely on an already-existing object whose header is in
    r5 (it reads/writes offsets from r5 throughout). ''init'' is the correct prefix since this sets up
    the object''s properties. The summary''s ''upward Z velocity'' is a plausible but unconfirmed directional
    claim; the code only writes 0x20000 without specifying axis convention, though the callee''s description
    of integrating Z supports vertical motion.; run wf investigate investigate-20261018-155607; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
