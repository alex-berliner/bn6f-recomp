name: battle_initFlyAnimObject
address: '0x080E1D18'
kind: function
status: probable
summary: Initializes an existing battle object (in r5) as a shadowless flying sprite (id 0x80) with animation
  1, palette from Param1, and ZVelocity=0x20000, then transitions it into the fly-update-and-destroy state
  handler.
interface: (r5 = battle object header, with oBattleObject_Param1 preloaded as palette index; no register
  args) -> void; sets object flags, sprite, anim, palette, ZVelocity, CurState
details: Sets flag bit 0x2 in the object header, then loads sprite resource 0x80 with args (0x80, 0x14,
  2) via sprite_load and disables its shadow. It selects animation index 1 (stored in both CurAnim and
  CurAnimCopy), loads the animation data, and takes the palette index from oBattleObject_Param1 via sprite_setPalette
  — so callers customize color through that field. It writes ZVelocity = 0x20000 (2.0 in fixed point,
  rising motion), switches CurState to CUR_STATE_UPDATE (2), and calls battle_objectFlyAnimUpdateAndDestroy_80E1D54,
  which advances the anim, integrates Z, and moves the object to destroy state at the animation end-of-life
  flag. The routine is entirely r5-relative, so it acts as a per-object setup called with the object pointer
  already in r5.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'orr r0,#2 / strb into oObjectHeader_Flags then sprite_load(0x80,0x14,2) and sprite_noShadow:
    sprite resource setup; mov r0,#1 stored to oBattleObject_CurAnim and CurAnimCopy, then sprite_setAnimation
    and sprite_loadAnimationData; ldrb r0,[r5,#oBattleObject_Param1] passed to sprite_setPalette: palette
    comes from a caller-set field; str 0x20000 to oBattleObject_ZVelocity and CUR_STATE_UPDATE to oBattleObject_CurState:
    launch into the update state; tail call to battle_objectFlyAnimUpdateAndDestroy_80E1D54, whose summary
    matches the fly-up-then-destroy behavior'
