name: countUnmaskedEventFlags_8029EC8
address: '0x08029EC8'
kind: function
status: confirmed
summary: Returns the count of 5 listed event flags that are currently set in the save data and not yet masked off
  in the "0x20349A0" state word (bits 5..9).
interface: u32 countUnmaskedEventFlags_8029EC8(void); // r10/lr in; r0 = count out; NZCV clobbered; r4,r6 preserved
details: 'Iterates i = 0..4, reading a u32 event-flag id from a small table at

  byte_8029F4C (one entry per index, 4 bytes each). For each id it calls

  TestEventFlag (the standard event-flag tester; "Z=1 when clear"). If the

  flag is set, it then loads the state word pointed to by the pointer at

  dword_20349A0 and tests the bit (1 << i) << 5, i.e. bits 5..9 of that

  word. Only flags that are both set AND whose mask bit is still 0 are

  counted, so a flag whose mask bit has been latched is excluded. The

  final tally is returned in r0. r4 holds the loop index, r6 the running

  count.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
