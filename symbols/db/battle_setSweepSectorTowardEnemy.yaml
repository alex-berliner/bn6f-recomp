name: battle_setSweepSectorTowardEnemy
address: '0x08116210'
kind: function
status: probable
summary: Stores at battle object +0x68 one of six sector codes (0-5) describing where the closest enemy
  stands relative to the object (ahead/behind x above/below/same row), in facing-relative coordinates.
interface: (r0 = battle object, r5 must also hold the same battle object) -> no return value (r0/r1 restored);
  writes byte [obj+0x68] = 0..5
details: 'Gets the object''s facing step via object_getEnemyDirection (+1 player side, -1 enemy side),
  then flips the object''s alliance and calls battleObject_findClosestEnemyBattleObject_80103F8 to locate
  the nearest opposing object. It reads the enemy''s panel coords from bytes 0x12/0x13, computes dx =
  (obj.PanelX - enemy.x) * facingStep and dy = obj.PanelY - enemy.y, and classifies: same row ahead =
  4, same row behind = 5, and the four diagonal quadrants as 0 (ahead+up), 2 (ahead+down), 1 (behind+up),
  3 (behind+down), mirroring the six directions of a sweep/area attack. The result is stored with strb
  r0,[r5,#0x68]. Quirk: the object pointer is passed in r0 but used via caller-set r5, and r0/r1 are saved
  and restored across the whole body, so the function has no visible return value.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getEnemyDirection then pop {r2}; mul r0,r2 -> dx is mirrored by facing so 'ahead'
