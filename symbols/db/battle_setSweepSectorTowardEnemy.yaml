    selects the opposing alliance; ldrb r2,[r0,#0x12]/[r0,#0x13] read the found enemy's panel X/Y to compare
    with [r5,#oBattleObject_PanelX/Y]; the 0..5 strb to [r5,#0x68] exactly matches a 3x2 sector partition
    (cmp r1,#0 same-row split; cmp r0,#1 / cmp r1,#1 diagonal quadrants); executed by the 'battlesweep'
    route, consistent with a sweep-style attack direction chooser
