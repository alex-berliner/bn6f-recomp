name: sub_808985A
address: '0x0808985A'
kind: function
previous_names: []
status: hypothesis
summary: Per-frame beast-out chip-lockout tick for an AI actor in r5; advances timer/state and writes the resulting
  phase to AIData.Unk_0c
interface: '(r5 = AIData, r7 = ?, r10 = Toolkit) -> r0 = 1 ; side effects: r5->Unk_0c written (0x18/0x34/0x3c),
  r5->Unk_0b written'
details: "Called from a BeastSp actor (snap_beastsp_0180000_*.bin) with r5 holding the per-actor AIData (0x58-byte\n\
  \  AIData; r5 matches the struct base, with the actor's timer/apwr/bpwr/apwr-counters in the early bytes).\n \
  \ 1) Clears r0=0 then calls sub_8142C20 (chip-lockout store/return), stashing result in r4.\n  2) Calls sub_814216E\
  \ (timer or counter read) and bne-skips state writes when it equals r4 (idle path).\n  3) Calls battle_tickChipLockout_8089CB4;\
  \ if it returns false we drop straight through.\n  4) On re-entry, recomputes sub_814216E and compares against\
  \ AIData.Unk_0c (r7+0xc). If equal, jumps\n     to loc_8089882: calls sub_8142ADA, and on success chains to sub_8089CDC\
  \ and writes 0x18 to AIData.Unk_0c;\n     on failure of sub_8142ADA the function writes 0x3c to AIData.Unk_0c.\n\
  \  5) When the second sub_814216E result differs from Unk_0c, writes 0x34 to AIData.Unk_0c.\n  6) Also writes\
  \ r5[?]= 0x34/0x18/0x3c candidates in the divergent branches; in all paths returns r0=1.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- snap_beastsp_0180000 snapshots show the call is reached from 0x080895b8 in BeastSp AI code, with r5
    holding the per-actor AIData pointer. - "mov r0,#0 ; bl sub_8142C20 ; mov r4,r0 ; bl sub_814216E" gates the
    chip-lockout tick against the cached value in r4, matching a "tick if changed" idiom. - "bl battle_tickChipLockout_8089CB4
    ; beq loc_8089898" name and contract confirm this is the beast-out lockout tick (BN6-specific beast mode). -
    "ldr r1,[r7,#0xc]" / "cmp r0,r1" plus the strb writes of 0x18/0x34/0x3c into [r5] show the function tracks a
    small phase enum in AIData offset 0xc (cur lockout phase). - "bne loc_8089892 ; mov r0,#0x3c ; strb r0,[r5]"
    combined with the preceding "mov r0,#0x18 ; strb r0,[r5]" distinguishes the success/fail sub-state writes. -
    All paths land at loc_8089898 with "mov r0,#1 ; pop {r4-r7,pc}" confirming r0 is always set to 1.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0808985A

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
