open_questions:
- Exact semantics of 0x18/0x34/0x3c phase values in AIData.Unk_0c (likely "fully locked out", "ready
- to fire beast chip", "release" but not labeled as such).
- What sub_814216E and sub_8142C20 read from r7 (likely a Toolkit/BattleState pointer) to decide the
- beast-out eligibility check.
- The role of sub_8142ADA and sub_8089CDC in the "success" path; decompiling them would settle the
- exact phase meaning.
