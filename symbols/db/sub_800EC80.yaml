name: sub_800EC80
address: '0x0800EC80'
kind: function
status: hypothesis
summary: Bumps an enemy chip-drop index up by the navi's current stat tier (floored with a stubbed contribution),
  capped by the enemy's version for actor type 0 (boss-style enemies); other actor types pass through unchanged.
interface: u32 sub_800EC80(u32 enemy_idx /* r0 */) -> u32 /* r0 */ ; clobbers r1,r3; preserves r4-r7; flags clobbered
  (n/z/c/v)
details: 'Calls stub_returnZero_8000E30 (currently always returns 0) and getCurNaviStatTier_8014150 (player''s

  navi stat tier). Takes the max of the two into r7 as ''bonus''. Calls

  GetVerActorTyAndAIIdx_80182B4(enemy_idx) to fetch the enemy record (byte 0 = version, byte 1 =

  actor_type). For actor_type == 2 or non-zero non-1, returns enemy_idx unchanged. For

  actor_type == 0, computes cap = 5 - version (dead branch when cap <= 0 falls through to

  ''no adjustment''); caps doubled bonus at cap; returns enemy_idx + bonus. The actor_type == 1

  branch (cap = 2 - version) exists in the binary but is unreachable (the actor_type == 1 path is

  never taken because the prior compare branches to the bail-out first).

  '
