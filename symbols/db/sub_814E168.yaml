name: sub_814E168
address: '0x0814E168'
kind: function
status: hypothesis
summary: Refreshes two halfword fields of an object, storing a doubled value from a helper at +0x1C and an 8.8 fixed-point
  scaled copy of it at +0x20.
interface: void sub_814E168(void); /* no direct args of its own; returns the callee's r0/r2/r3 and flags from the
  final shift */
details: 'Wrapper around sub_814E0D0: it saves lr into r12 and tail-returns through r12 (bx r12), so it behaves
  as a plain call whose result state is whatever sub_814E0D0 left in r0-r3. sub_814E0D0 supplies an object pointer
  in r0 and a working value in r3. This routine doubles that value (lsl #1) and stores it as a halfword at obj+0x1C.
  It then reads the halfword at obj+0x1E, treats it as an 8.8 fixed-point scale, and stores ((doubled * scale) >>
  8) as a halfword at obj+0x20. So +0x20 is +0x1C scaled by the ratio kept in +0x1E. No other fields or memory are
  touched; the object''s meaning is not identified from this snippet alone. The final lsr sets nz from the result
  and c from bit 7 of the product (the last bit shifted out), which callers may or may not consume.

  '
