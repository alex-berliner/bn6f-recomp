name: object_reservePanel
address: '0x0801BB1C'
kind: function
status: confirmed
summary: Attempts to claim (reserve) the panel under one object for another object, marking the panel reserved and
  flagging the reserving object; fails if there is no panel or it is already reserved.
interface: bool object_reservePanel(ObjectHeader *targetObject /*r0*/, u32 unused /*r1*/, ObjectHeader *reserverObject
  /*r5*/); returns 1 on successful reservation, 0 if the target has no panel or the panel is already reserved; sets
  NZ flags from the return value, clobbers r1-r3 (r2 carries the prior reserver pointer on failure)
details: "Calls object_getPanelDataOffset with r0 to find the panel data for the panel under the\ngiven object.\
  \ If there is no panel (offset 0) the panel cannot be reserved, so it\nreturns 0. If the panel already has a reserver\
  \ (oPanelData_ReserverObjectPtr != 0) it\nalso returns 0 (the previous reserver pointer is left in r2, presumably\
  \ incidental).\nOn success it:\n  - stores r5 (the claiming object) into panel's oPanelData_ReserverObjectPtr,\n\
  \  - sets bit 0x80 in the panel's oPanelData_Flags word (the \"reserved\" flag),\n  - sets bit 0x20 in the reserving\
  \ object's oObjectHeader_Flags byte (offset 0 of the\n    object header, the \"standing on a reserved panel\"\
  \ flag),\n  - returns 1.\nThis is the panel-claiming mechanic used in battle (e.g. objects like panels/areas\n\
  reserving a tile so others can't take it); callers pass the object whose panel is\ntargeted in r0 and the claiming\
  \ object in r5, an unusual calling convention that\nsuggests r5 is already holding a relevant object pointer at\
  \ call sites.\n"
