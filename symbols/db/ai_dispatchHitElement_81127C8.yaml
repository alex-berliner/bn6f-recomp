name: ai_dispatchHitElement_81127C8
address: '0x081127C8'
kind: function
status: confirmed
summary: Dispatches an AI attack step based on the element byte stored in the attacker's AI attack vars, tail-calling
  the per-element handler from a small jump table.
interface: void sub_81127C8(r4, r5, r6, r7=&AI attack vars) — tail-dispatch; results in r1 r5 r8 r9 r10 r11 r12
  and NZCV are whatever the dispatched handler leaves.
details: 'Reads the hit element byte from the attacker''s AI attack vars struct at

  oAIAttackVars_HitElement (r7 + offset), then loads a handler pointer from the

  3-entry table at off_81127DC using the raw element value as a word index

  (ldr r1, [r1, r0]). The handler is entered with r0 = element byte and

  r1 = its own table entry, via mov lr, pc; bx r1 so the handler returns to the

  pop {pc} here and this routine acts as a trampoline: the caller sees the

  handler''s r1/r5/r8-r12 and flags directly. Table entries:

  0 -> sub_81127E8, 1 -> ai_teleportToPanelStep, 2 -> ai_attackStepWaitEnd

  (all +1 thumb pointers). The dispatcher itself is ARM code calling thumb

  handlers (lr set to the ARM return address, bit0 clear, so handlers return

  via bx lr back into ARM mode).

  '
