name: battle_pickPanel_80F8256
address: '0x080F8256'
kind: function
status: confirmed
summary: Picks a battle panel (column, row) for an object using its preference byte, validating and randomly
  selecting from filtered column candidates.
interface: void battle_pickPanel_80F8256(u32 r2_ctx, u32 r3_ctx, BattleObj *r5 /*[+0x16]=panelPrefIndex*/);
  // returns r0=col, r1=row; r4-r7 preserved
details: 'Reads object byte at [r5+0x16], indexes into a 2-byte-pair lookup table at

  0x080F82AC (single entry: 0x02,0x02 → col 2, row 2). Passes those coords

  plus r2/r3 to object_checkPanelParameters; a non-zero return means rejection,

  in which case the raw table bytes are returned unchanged in r0/r1.

  On acceptance, object_getPanelsInColumnFiltered is called (want_col as r0,

  r2/r3 as context, output buffer at sp+8) to enumerate valid panels in that

  column. If count==0 the function returns col=0. Otherwise GetPositiveSignedRNG

  supplies a random index, BIOS SWI 6 (Mod) maps it into [0,count), and the

  selected packed byte is split: lower nibble → r0 (column), upper nibble → r1 (row).

  The 0x20-byte stack frame also stashes r2/r3 across the checkPanel call and

  holds the filtered-panel list buffer (up to 0x18 entries at sp+8).

  '
