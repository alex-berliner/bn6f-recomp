summary: Reads a byte from a struct (r5+0x12), uses it to index a halfword lookup table at "0x0:0x2:0x10:0x2:0x20:0x2:0x0:0x0",
  and stores the resulting halfword into a destination (r2+0xA).
interface: void sub_8132380(u32* dest /* r2 */, const void* src /* r5 */)
details: 'This is a thin shim/trampoline — it indexes a 4-entry (8-byte) table by the lower 2 bits of a byte field
  and writes the halfword result into the caller''s struct. Table values are small flags/IDs (0x0000, 0x0002, 0x0010,
  0x0002, 0x0020, 0x0002, 0x0000, 0x0000). Without knowing what object owns +0x12 and what caller writes at +0xA,
  its meaning can''t be pinned down.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
