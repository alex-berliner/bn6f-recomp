name: ow_storyTriggerSpawnJackoutLockScene
address: '0x0808CAD4'
kind: function
status: probable
summary: 'Overworld story-progress trigger: marks one event flag, then if a guard flag is already set,
  sets another flag and launches a map cutscene object with a jack-out lock.'
interface: () -> r0 = 0; sets EVENT_9D6 (always) and, if EVENT_9D8 set, EVENT_9D7, EVENT_1700, BBS flag
  e17b0f7, GameState.Unk_09 = 3
details: Runs as a map/story script (recorded on beastsp and map routes). It first calls sub_8142C94 and
  sub_808CBA0 (both unknown), then unconditionally sets event flag EVENT_9D6. It tests EVENT_9D8; only
  when that flag is already set does it set EVENT_9D7, call sub_808CBD8 — which spawns overworld map object
  type 0x11, sets EVENT_1700, plays a sound (except in map group 0x85), and sets JackOutLockState = 3
  — marks BBS request flag 0x7 of event byte 0x17 via reqBBS_setFlag_e17b0f7_8140A00, and re-sets GameState.Unk_09
  to 3 via gameState_setUnk09_8001172. The TestEventFlagFromImmediate->beq structure means the cutscene
  block runs when EVENT_9D8 is set, so 9D8 acts as a one-time/progression guard. The unconditional flag-set
  plus guarded scene start is typical of map-entry story triggers.
