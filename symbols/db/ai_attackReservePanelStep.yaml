name: ai_attackReservePanelStep
address: '0x08105AF6'
kind: function
status: probable
summary: AI attack step that picks/reserves the target panel for an incoming strike and plays the windup
  animation
interface: () -> void; r5 = battle object, r7 = AI attack vars; r0/r1 from PanelChooseCallback stored
  as target panel and flags
details: On first entry (oAIAttackVars_AttackElement == 0) it writes 4 there, then calls object_canMove;
  if the object is blocked it plays anim 0x14 and calls object_exitAttackState_801171C to abort. Otherwise
  it calls the stored PanelChooseCallback (in lr=pc mode), whose r0/r1 results go to oAIAttackVars_AiAttackParam
  and oAIAttackVars_PanelParamFlags2, copies the object's PanelX/PanelY into FuturePanelX/FuturePanelY,
  claims the panel with object_reservePanel, and removes the object from collision via object_clearCollisionRegion.
  It sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, plays anim 0x15 (windup), and sets StepTimer=4.
  On subsequent calls it decrements oAIAttackVars_StepTimer, and at zero sets oAIAttackVars_HitElement=8,
  handing off to the attack's damage step.
