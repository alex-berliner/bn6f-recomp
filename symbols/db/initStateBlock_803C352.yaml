name: initStateBlock_803C352
address: '0x0803C352'
kind: function
status: confirmed
summary: Initialize the 0x48-byte state block at A_word_2006770 (zero it, fill two 0x20-byte halfword
  regions with 0xE5E5 plus a 0xE6 terminator) and then call sub_802D150.
interface: void initStateBlock_803C352(void);  // no inputs; clobbers r0-r3, lr, flags N Z C V
details: "Operates on the global block at A_word_2006770 (0x2006770). The block is 0x48 bytes.\n  * ZeroFillByWord\
  \ clears the entire 0x48-byte block.\n  * Region at +0x08 (0x20 bytes) is filled with the halfword 0xE5E5;\
  \ byte at +0x18 (relative to block) is written as 0xE6.\n  * Region at +0x28 (0x20 bytes) is filled\
  \ with the halfword 0xE5E5; byte at +0x3E (relative to block) is written as 0xE6.\n  * Then jumps to\
  \ sub_802D150 with no arguments; that function is expected to finish by returning directly to sub_803C352's\
  \ caller (pop {pc} tail-call pattern).\nThe two 0xE5E5-filled regions terminated by 0xE6 are characteristic\
  \ of BN-style string/object buffers (0xE5 fill byte used as padding, 0xE6 as a list terminator).\n"
