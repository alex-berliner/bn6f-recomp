name: battle_aiAttackStep_80F16E0
address: '0x080F16E0'
kind: function
status: confirmed
summary: 'Advances the AI attack state-machine by one frame: initializes element/damage and spawns a hit-effect
  on first activation, otherwise counts down the step timer and resets the hit element when it expires.'
interface: 'u32 battle_aiAttackStep_80F16E0(BattleObject *panel /* r5 */, AIAttackVars *attack /* r7 */);
  /* returns in r1: 0x5A on init, caller''s r1 otherwise; r5/r7 preserved; r4/r6 saved-and-restored around
  sub_80C92CC call; flags clobbered */'
details: 'Two branches keyed on AIAttackVars.AttackElement (offset oAIAttackVars_AttackElement, byte).
  Branch 1 (element==0, first activation): sets AttackElement to 4 (fire), adds AttackBoost into Damage
  (16-bit), then calls sub_80C92CC to spawn a hit visual-effect at the attacker''s panel (BattleObject.PanelX/Y
  passed as r0/r1, InitFlag as r2, type 0xA0000 packed with attr 0x000A0204 into r4/r3, panel pointer
  in r5, full Damage in r6). Sets StepTimer to 0x5A (90 frames). Returns that value in r1. Branch 2 (element!=0,
  countdown): decrements StepTimer (16-bit signed); if result > 0 returns caller''s r1 unchanged; if <=
  0 writes HitElement = 0x14 (neutral hit) to signal the effect is done. r4 and r6 are push/pop''d because
  sub_80C92CC clobbers them but the caller expects them preserved. Structures touched: AIAttackVars (AttackElement
  byte, Damage u16, AttackBoost u16, StepTimer u16, InitFlag byte, HitElement u16) and BattleObject (PanelX
  byte, PanelY byte).'
