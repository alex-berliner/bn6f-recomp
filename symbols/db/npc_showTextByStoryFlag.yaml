name: npc_showTextByStoryFlag
address: '0x0812469C'
kind: function
status: probable
summary: Saves r0 into the NPC struct at +0x10, then based on EVENT_1709 sets animation/state bytes at
  +2 and +3 and copies the byte into the chatbox at +0x4C, running text script 7 (flag clear) or 11 (flag
  set) from archive eTextScript201C100.
interface: (r0 = byte value (e.g. text/variant id), r5 = object struct, r10 = toolkit) -> r0 = script-runner
  result; sets struct fields and chatbox text
details: Saves r0 into the struct at r5+0x10, then branches on event flag EVENT_1709. If the flag is clear,
  it writes 12 into both struct fields at r5+0x2 and r5+0x3, copies the saved byte into the chatbox struct
  at +0x4C, and runs text script 7 from archive 201C100. If the flag is set, it writes only 8 to r5+0x2
  (leaving r5+0x3 unchanged) and runs script 11 instead. The chatbox pointer comes from the toolkit (r10)
  at oToolkit_ChatboxPtr, so this runs in an object/NPC update context.
