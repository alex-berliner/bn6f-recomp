name: getEventFlagList
address: '0x0802B2A0'
kind: function
status: probable
summary: Builds a halfword list (0xFF-filled) of which of 27 event flags (0x197..0x1B4 range) are set,
  storing flag-base+1 IDs and returning the count.
interface: (r0 = u16 out buffer[27]) -> r0 = number of set flags written; flags from cmp/blt loop
details: First ByteFills 0x1B*2 = 54 bytes of the caller-supplied buffer with 0xFF (empty-slot marker).
  It then loops over the 27-entry table at byte_802B2E0 of u16 event flags; for each flag that TestEventFlag
  reports set, it stores (flag - 0x197) + 1 as a halfword at the next slot. The written value is therefore
  a 1-based index into the flag range 0x197-0x1B4 (flags 0x1A0 and 0x1A3 are missing from the table),
  while unset slots stay 0xFF. Returns the number of entries written (r6/2). Callers presumably consume
  the list and count for a menu/log display.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl ByteFill with count 0x1b*2 and value 0xFF initializes the output array; loop calls TestEventFlag
    on table entries byte_802B2E0 (flags 0x197..0x1B4); strh r0,[r7,r6] stores flag-0x197+1 at halfword
    slots, advancing r6 by 2; return value lsr r0,r6,#1 is the count of written entries; callers sub_802A8A4
    / sub_8128CD8 receive buffer + count for further use
