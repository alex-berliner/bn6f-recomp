name: ow_drawOverworldHud
address: '0x08033B6E'
kind: function
status: probable
summary: 'Overworld HUD wrapper: draws the PET navi HP digits, then the battle-start overlay frame with
  flag=1, then the current map name.'
interface: (r0 = self *S2011E30, unused by body) -> r0 = return of RenderMapName_8033EE8; no meaningful
  flags
details: 'Sequences three known draw routines: internet_drawHpDigits_8033E0C renders the navi''s 4 HP
  OAM digits, battle_drawBattleStartOverlay_8033F80 is called with r0=1 (likely an enable/draw-frame flag
  selecting the overlay variant), and RenderMapName_8033EE8 draws the current area''s name plate. r0 is
  never reloaded between calls, so the passed pointer is forwarded to each callee, suggesting they share
  the same scene/state object. The function is a pure wrapper with no logic of its own.'
