name: ai_attackWaitState
address: '0x080FB594'
kind: function
status: probable
summary: AI attack state handler that waits AttackDuration frames (playing a fixed anim with element 4)
  then leaves the attack state
interface: (r7 = AI vars ptr, r5 = battle object ptr) -> void; no return value used
details: 'Per-frame update for one AI attack state. If oAIAttackVars_AttackElement is still 0 it performs
  setup: writes element 4 into AttackElement, clears oBattleObject_CurAnim to 0, and copies oAIAttackVars_AttackDuration
  into oAIAttackVars_StepTimer as the countdown. On later frames it decrements StepTimer each call and,
  once it hits zero, calls object_exitAttackState to return the AI object to normal behavior. The element
  value 4 is a fixed element assigned to this attack (likely a neutral/normal one). No other state or
  flags are touched.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'setup branch: writes #4 to oAIAttackVars_AttackElement and 0 to oBattleObject_CurAnim before
    starting the timer; timer init copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer; decrement
    branch: sub r0,#1 on StepTimer, bgt skips exit; only callee is object_exitAttackState at 80FB5AC,
    reached when the timer expires; state-machine shape (init-once then tick-down) matches other AI attack-state
    update handlers'
  refs:
