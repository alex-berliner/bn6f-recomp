summary: 'Per-frame battle runtime tick: runs every entity''s update handler, refreshes eStruct sprite
  render data, and on completion clears the chip/sub-menu run flag.'
interface: '() -> r0 = 1 if not done, 0 if IsScreenFadeActive ; side effects: writes battle run-state
  bytes at r5+1 and r5+2, calls entity update handlers and eStruct sprite refresh, queries IsScreenFadeActive.'
details: '- `push {lr}` then `bl entity_runAllUpdateHandlers_80465BC` which walks the 15-entry `BattleObject[15]`
  array (each 0x58 bytes) calling each active entry''s type-selected update handler; per-frame entity
  logic for battle actors.

  - `bl battle_updateEStructSprites_80465F8` rebuilds render data for the eStruct records whose flag byte
  has bit 0x2 (active/visible) — rescan hitboxes, palette, anim-frame tiles, then render-data rebuild.

  - `bl IsScreenFadeActive` (0x080062f8): returns zf cleared if a fade is running. If a fade IS active
  (`beq` not taken — wait, branch is on EQ which is ZF set, so when IsScreenFadeActive returns 0 it falls
  through; when fade is active the function returns nonzero and `beq` is not taken, executing the cleanup
  path), the routine sets `[r5,#1] = 4` and `[r5,#2] = 0`. Note: r5 is a callee-saved register loaded
  by the caller (likely the chip/sub-menu subsystem state pointer — the captured-call context `r5`, `r10`
  (=Toolkit) and the subsys jumptable return suggest this is the menu "done running" handler). The state
  bytes 4/0 indicate "subsystem finished / clear".

  - `pop {pc}` tail-return.

  - Net effect: a master tick for one frame of in-battle entity/sprite work plus a deferred "I''m done"
  signal to the sub-menu driver when the screen is fading out (battle end transition).

  '
