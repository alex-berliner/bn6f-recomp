name: StartBattle
address: '0x08005BC8'
kind: function
status: confirmed
summary: 'Starts a battle from the overworld: stores the battle data pointer, snapshots the current map group, switches
  the game state machine to the battle subsystem (index 8) and plays the battle-start jingle.'
interface: void StartBattle(void* battleData, int updatePlayerState /* toolkit in r10 */); clobbers r0,r1,r3,flags,lr;
  preserves r2,r4-r7,r10
details: 'Takes a pointer to the battle setup data (r0) and a flag (r1). Stores the battle data pointer into gameState->CurBattleDataPtr.
  Calls GetBattleEffectsFromBattleSettings and, if the effect mask has bit 0x4000 set, also copies the battle data
  pointer to S2001c04+0x1c (the work-area''s battle data slot). Snapshots gameState->MapGroup (halfword at offset
  4) into gameState->LastMapGroup so post-battle code can restore the right map context. If updatePlayerState !=
  0, calls updatePlayerGameState_800107A to refresh the player''s overworld state. Writes subsystem index 8 (battle
  init) into the game state''s first byte, which the game-state callback (cbGameState_80050EC) picks up to run battle_init_80052D8.
  Then calls musicGameState_8000784 with r0 = 8 to handle music for the state change, and finally plays SOUND_BATTLE_START
  via PlaySoundEffect. r4-r7 are pushed/popped as scratch (r4 unused, r5/r6 hold gameState/workArea pointers, r7
  holds the update flag). The 0x4000 effect bit likely marks battle data that must survive into the battle scene
  work area.

  '
