name: battle_checkTimerWindowSubstate_802C97E
address: '0x0802C97E'
kind: function
status: confirmed
summary: Classifies a battle object's timer at [r5+0x1C] against a per-battle-state time window and stores the resulting
  sub-state (0/1/2) into [r5+0x0E].
interface: int sub_802C97E(BattleObj *r5, BattleStateCtx *r10); // returns 0 = window done/absent, 1 = inside window,
  2 = window not started; also sets [r5+0x0E]=result, [r5+0x0F]=1 when before or inside the window; clobbers r0-r3,
  preserves r4; flags from adds r0,result
details: 'Reads the battle''s state byte 0x0D via battle_getStateByte0d_800A7E2, then maps it through sub_802CA1E
  to an index; 0xFF means this state has no timing window and the result is 0 (sub-state unchanged, [r5+0x0F] untouched).
  Otherwise the index is doubled and used to look up u16 bounds in two tables: unk_20018C0[i] is the window start
  and unk_2000260[i] is the window end. The object''s s32 timer at [r5+0x1C] is compared with signed comparisons:
  timer < start -> result 2 and [r5+0x0F]=1; start <= timer < end -> result 1 and [r5+0x0F]=1; timer >= end -> result
  0 with [r5+0x0F] left as-is. The result is stored to [r5+0x0E] (the object''s sub-state byte) and returned in
  r0. So [r5+0x0F] acts as a ''within or before window'' latch that is set in the two active-window cases but never
  cleared here, and the 0xFF case leaves both bytes untouched except [r5+0x0E]=0.

  '
