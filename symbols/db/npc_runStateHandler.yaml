name: npc_runStateHandler
address: '0x080A8394'
kind: function
status: probable
summary: Dispatches an NPC/actor handler by indexing a 3-entry thumb jump table at off_80A83A8 with a
  byte from [r5,#8], passing unk_2000B40 in r6 to the chosen handler.
interface: (r5 = actor object, [r5+8] = handler/state index) -> r0 = handler's return value; calls table
  entry with r6 = unk_2000B40 work area
details: Loads r6 with the fixed IWRAM buffer unk_2000B40, reads a byte index from [r5,#8] of the caller's
  object, and uses it to select one of three thumb pointers from the table at off_80A83A8. It performs
  a tail-style call (mov lr, pc; bx r0) so the chosen handler returns here, then pops pc to return to
  the caller. The three handlers are sub_80A83B8 (likely the setup/init state), npc_updateGuarded (per-frame
  update), and ow_cleanupNpcAfterCutscene (teardown), so index 0..2 maps to init/run/cleanup phases of
  an overworld NPC lifecycle.
