- method: assembly-reading
  date: '2026-10-18'
  detail: 'off_80A83A8: table of exactly 3 handlers: sub_80A83B8+1, npc_updateGuarded+1, ow_cleanupNpcAfterCutscene+1
    — a 3-phase lifecycle; ldrb r1,[r5,#8]; ldr r0,[off_80A83A8,r1] — state/handler id taken from offset
    8 of the passed object; ldr r6,=unk_2000B40 before bx — shared IWRAM work area handed to every handler;
    mov lr,pc; bx r0 ... pop {pc} — plain dispatcher that relays the handler''s return; callee ow_cleanupNpcAfterCutscene
    ties the lifecycle to cutscene-scoped overworld NPCs'
