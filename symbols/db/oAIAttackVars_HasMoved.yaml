name: oAIAttackVars_HasMoved
address: '0x1a'
kind: struct-field
status: probable
summary: Boolean flag indicating the battle object has completed its attack-step movement and reserved
  a target panel.
details: ">-\n  Out of 125 accesses, the field is overwhelmingly written as either `1` immediately after\
  \ `object_reservePanel` and animation setup (`mov r0, #1; strb r0, [r7,#oAIAttackVars_Unk_1a]`), or\
  \ `0` on the failure/exit path before `object_exitAttackState`. The few `ldrb` reads treat it as a boolean\
  \ (`tst r0, r0`) gating post-movement logic. After the movement completes (timer at 0, `object_removePanelReserve`\
  \ ran), the flag is set back to `1` to mark \"movement done\" — strong semantic match for a \"has finished\
  \ attack-step move\" latch."
