name: pet_incrementNaviStatsByte18By1
address: '0x0813CE08'
kind: function
status: probable
summary: Thin wrapper that adds 1 to the selected PET navi's NaviStats byte 0x18 and flags the record
  by setting byte 0x16 to 3.
interface: (r0 = PET/navi selection passed through to callee) -> r0 = callee return; r4 clobbered (set
  to 1 as the addend)
details: 'The function is a 5-instruction shim: it preserves r4-r7, sets r4 = 1 as the increment amount,
  and tail-delegates to pet_addNaviStatsByte18AndMarkField16, which adds r4 to byte 0x18 of the selected
  navi''s NaviStats record and writes 3 to byte 0x16 (likely a ''modified''/''needs update'' marker).
  r0 is not touched by this wrapper, so the navi selection comes from the caller''s argument. With no
  known callers, the in-game meaning of the counter at 0x18 (e.g. a stat, use count, or progress value)
  cannot be determined.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r4, #1 immediately before the bl shows the fixed increment of 1; bl pet_addNaviStatsByte18AndMarkField16
    is the sole work, matching that callee''s documented effect on NaviStats byte 0x18 and byte 0x16;
    no other logic or data access in the 5-instruction body; r0 is left as received; no known callers,
    so the trigger context in the game is unknown'
