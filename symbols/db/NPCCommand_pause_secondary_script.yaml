name: NPCCommand_pause_secondary_script
address: '0x0809F17C'
kind: function
status: confirmed
summary: Overworld NPC script opcode handler that pauses the NPC's script for a given number of frames before it
  (or the secondary script) resumes.
interface: Next NPCCommand_pause_secondary_script(OverworldNPCObject *npc /* r5 */, u8 *scriptPtr /* r6 */); returns
  r0 = 1, r6 = scriptPtr + 2, and nz/c/v set by the ADDS r6,
details: 'Implements the "pause" opcode of the overworld NPC script VM. It zeroes the byte at oOverworldNPCObject_Unk_0b
  (a pause/secondary-script-related state byte, likely clearing an active secondary-script pause), reads the 1-byte
  operand at scriptPtr+1 (the pause duration, 0-255) and stores it into the 16-bit timer field oOverworldNPCObject_Timer_22,
  then sets oOverworldNPCObject_TerminateScript_1f to 1 so the script interpreter stops executing for this object
  until the timer expires. Finally it advances the script pointer past the opcode+operand (r6 += 2) and returns;
  r0 ends as 1 from the flag-setting store value. Runs as a plain Thumb function called via an opcode dispatch table
  (lr is popped directly to pc).

  '
