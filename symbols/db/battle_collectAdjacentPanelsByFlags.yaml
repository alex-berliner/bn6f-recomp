name: battle_collectAdjacentPanelsByFlags
address: '0x0800D45C'
kind: function
status: confirmed
summary: Scans the ring of cells surrounding the player's 3×3 battle area, filters them by required/excluded flag
  bits from object_getPanelParameters, and writes matching (row<<4|col) pairs into a caller-supplied buffer.
interface: u8 battle_collectAdjacentPanelsByFlags(u32 requiredFlags /*r2*/, u32 excludeFlags /*r3*/, u32 battleObjPtr
  /*r5*/, u32 outputBuffer /*r7*/) -> u8 count /*r0*/; clobbers r1, preserves r2 r3 r4 r6 r7
details: Iterates y from 3 down to 1 (outer loop) and x from 6 down to 1 (inner loop), giving a 6×3 sweep of absolute
  grid positions. Computes relX = panelX - x + 1 and relY = panelY - y + 1 (0-based offsets into the player's own
  3×3 area); if both fall in [0,2] the cell is inside the player's footprint and is skipped. For each exterior cell
  the function calls object_getPanelParameters(x, y) which returns a flag word in r0; it then rejects the cell if
  (flags & excludeFlags) != 0 or (flags & requiredFlags) != requiredFlags. Accepted cells are packed as a single
  byte (y << 4 | x) and written sequentially to the outputBuffer pointed to by r7. The caller-provided r2 (requiredFlags)
  and r3 (excludeFlags) are preserved across the inner call by push/pop of r0–r3,r6,r7. r5 holds the battle-object
  pointer; oBattleObject_PanelX and oBattleObject_PanelY (u8 fields) give the anchor column and row. Return value
  in r0 is the number of bytes written (count of matching panels). The two dword constants at 0x0800D4A4/0x0800D4A8
  (0x01800000, 0x02800000) are unrelated padding.
