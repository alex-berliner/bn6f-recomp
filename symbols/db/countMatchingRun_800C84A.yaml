name: countMatchingRun_800C84A
address: '0x0800C84A'
kind: function
status: confirmed
summary: Counts a run of consecutive equal-valued byte entries (stride 8) starting next to a given row, walking
  in the given direction while the row stays within 1..6.
interface: int countMatchingRun(int row /*r0*/, int step /*r1*/); returns runLength in r0 and the shared run value
  in r1
details: Calls sub_800C8C2 with (row, step) to get the address of the entry adjacent to the start row in the direction
  given by step (+1 or -1). The byte stored there is taken as the run's value and the run length starts at 1. The
  scan then advances by a stride of 8*step bytes per entry, incrementing the length while two conditions hold. First,
  the row counter must satisfy (row - 1) <= 5, i.e. the row stays in the range 1..6, so the walk is bounded by rows
  1 through 6 of a column. Second, each next entry must still hold the same byte value as the first. As soon as
  either fails, the scan stops and the accumulated length and the shared value are returned in r0 and r1. r4 holds
  the row counter, r5 the step, r6 the running length; all three are restored before returning, so from the caller's
  view only r0/r1 are meaningful outputs. The 8-byte stride suggests the entries belong to some fixed-size record
  table (records with other fields beside the byte being compared), but the table itself lives behind sub_800C8C2
  and is not touched directly here.
