open_questions:
- exact meaning of the 0xC-sized buffer unk_20103A0 and of byte_2010390's full structure
- which game flow each of the five callers represents (e.g. trade vs. versus vs. wireless club)
- The assembly confirms it is a parameter-less shim that loads two static buffers and r2=0xC, then tail-calls
  rfu_initCommState. The name and summary are accurate, but `rfu_beginCommInit` is slightly misleading
  since it calls an init function and returns its result, not 'begins' an init in a distinct way. The
  summary's phrasing about 'push/pop lr dance' is correct but a better fit is just calling it the RFU
  comm-state init shim.
