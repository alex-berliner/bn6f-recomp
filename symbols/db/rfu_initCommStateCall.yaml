name: rfu_initCommStateCall
address: '0x08147B24'
kind: function
status: probable
summary: Parameter-less wrapper that loads byte_2010390 and unk_20103A0 as r0/r1, sets r2=0xC, and tail-calls
  rfu_initCommState, returning its result.
interface: (no args) -> r0 = return value of rfu_initCommState; no flags used
details: 'The function is only a parameter-less shim: it loads the two fixed addresses byte_2010390 and
  unk_20103A0 into r0/r1, sets r2 = 0xC, and tail-calls rfu_initCommState (after a push/pop lr dance).
  It therefore resets the wireless link state using the game''s statically allocated comm-state block
  and a 12-byte buffer, most likely invoked when entering or re-entering wireless comm menus. Its five
  callers (0x08039DB4, 0x08039F78, 0x0812A5F8, 0x0812A6F8, 0x08132104) presumably call it before attempting
  a wireless connection.'
