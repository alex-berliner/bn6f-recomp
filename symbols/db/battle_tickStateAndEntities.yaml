name: battle_tickStateAndEntities
address: '0x08128DCC'
kind: function
status: probable
summary: 'Per-frame tick: dispatches to a handler via a jump table indexed by the state byte at [r5+2],
  then unconditionally runs entity_runAllUpdateHandlers and battle_updateEStructSprites.'
interface: (r5 = task/object record; state byte at r5+2 selects handler) -> r0 = clobbered; calls into
  state handler, entity_runAllUpdateHandlers, battle_updateEStructSprites
details: 'Loads a jump table at off_8128DE4, indexes it with the byte at [r5,#2] (0-2, likely a phase/state
  field of the r5 record), and long-calls the selected handler (sub_8128DF4, sub_8128E2C, or sub_8128ED4)
  via mov lr,pc/bx. After the handler returns, it unconditionally runs the standard entity pipeline: entity_runAllUpdateHandlers_80465BC
  walks the 15-entry 0x58-byte entity records calling each active record''s update handler, and battle_updateEStructSprites_80465F8
  rescans hitboxes, reloads palettes and anim-frame tiles for visible records. The three-entry dispatch
  plus unconditional entity/sprite tick suggests a scripted/controlled battle-adjacent scene whose behavior
  is split across three states. No known callers, so what owns r5 (which task or scene) is unknown.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r0, off_8128DE4 / ldrb r1, [r5,#2] / ldr r0, [r0,r1] / mov lr, pc / bx r0 — state-indexed
    handler dispatch over a 3-entry table; off_8128DE8 holds exactly three handler pointers (sub_8128DF4+1,
    sub_8128E2C+1, sub_8128ED4+1), Thumb addresses; bl entity_runAllUpdateHandlers_80465BC — runs the
    15-entry eStruct update-handler walk every frame; bl battle_updateEStructSprites_80465F8 — refreshes
    entity sprites (hitbox rescan, palette, anim tiles) right after; No stack use and only lr pushed:
    pure sequencer with r5 as the sole context input'
  refs:
  - bn6f/asm/asm33.s:11837
  - 0x080465F8 battle_updateEStructSprites_80465F8
  - 0x080465BC entity_runAllUpdateHandlers_80465BC
  reproduce: python3 tools/asmcat.py 0x08128DCC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The structure of the code matches (state-byte dispatch + entity/sprite ticks), but several details
    in the proposal are wrong or fabricated: off_8128DE4 holds one word (off_8128DE8), not a jump table
    indexed at the base; the actual indirect dispatch goes through *off_8128DE8 + r1, not *off_8128DE4
    + r1. Also ''long-calls via mov lr,pc/bx'' are plain intra-function Thumb tailcalls (BX), not BLX.
    Finally the callee addresses 0x08128DF4/0x08128E2C/0x08128ED4 are not in the callee list, so claiming
    them as the three handlers is unsupported by the provided data.; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
