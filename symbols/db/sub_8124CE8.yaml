name: sub_8124CE8
address: '0x08124CE8'
kind: function
status: confirmed
summary: Per-frame "next" update that adjusts a sprite's two-frame counter, clamps it, marks completion when it
  bottoms out, and refreshes two sprite frame/duration halfword pairs.
interface: void sub_8124CE8(void);  // uses/discards R0,R1,R2,R3; clobbers NZ,CV; preserves R5,R6,R8,R9,R12
details: "Operates on a sprite-like struct pointed to by R5.\n  - Calls sub_8126818(R0=0) (likely the \"next state\"\
  \ tick routine).\n  - Decrements the u32 counter at o+0x74 by 2 (note: the asm uses `sub` — comment clarifies\
  \ it decrements, which the readable C also states).\n  - If the result is <= 0x8E: clamps o+0x74 to 0x8E and writes\
  \ state 0x0C at o+0x02 (finished/landed marker).\n  - Writes 0xFF to o+0x70.\n  - Chains sub_8125444 → sub_8125D10\
  \ → sub_8125D94 (animation/helper follow-ups).\n  - Calls sprite_setStructHalfwordPairOnThree_8117084 twice with\
  \ index 4 (using src halfword at o+0x12 and sprite o+0x58) and index 7 (using src halfword at o+0x1c and sprite\
  \ o+0x5c, but only when o+0x5c == 0x27 — the assembly explicitly loads the halfword from o+0x1c into R1 inside\
  \ that branch right before the call).\n\nThe 0x27 sentinel gating pair-7's source halfword suggests pair 7 is\
  \ only \"live\" for a specific sprite variant/anim slot. The state 0x0C + 0xFF-on-0x70 + clamp-at-0x8E pattern\
  \ is a classic \"anim finished → reset and idle\" bookend for MegaMan Battle Network sprite ticks.\n\nQuirks:\n\
  \  - The `bgt` branch into the clamp block means comparison is signed against 0x8E (counter as s32).\n  - Tail\
  \ `.byte 0,0` is data padding after the `thumb_func_end` (alignment).\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
