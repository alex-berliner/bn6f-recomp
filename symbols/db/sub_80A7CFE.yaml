name: sub_80A7CFE
address: '0x080A7CFE'
kind: function
previous_names: []
status: hypothesis
summary: Polls the "Beast SP gate" trigger — when the overworld player overlaps the gate rect, no flag/cutscene/fade
  is busy, sets EVENT_1731 and starts one of two cutscenes depending on the player's facing/param.
interface: '(r5 = this trigger struct, r10 = toolkit) -> r5 retained; r0 may be clobbered transitively ; side effects:
  writes event flag, starts a cutscene'
details: "- Loads a 4-word constant table at dword_80A7D78 (all 0xE0000 / 0x1C0000) — these are the in-frame delta\
  \ extents that define a square interaction box around an overworld NPC.\n  - Reads GameState→OverworldPlayerObjectPtr\
  \ (oToolkit_GameStatePtr + oGameState_OverworldPlayerObjectPtr) and grabs the player's screen coords from offsets\
  \ 0x1c/0x20 (the OW player Coords struct fields; 16.16 fixed-point).\n  - Computes (playerXY + boxMin) − triggerXY\
  \ (r5+0xc / r5+0x10) and returns early via locret_80A7D70 if the player isn't inside the box in either axis (BLT\
  \ or BGT against 0xE0000..0x1C0000).\n  - Bails out if any of these is busy: chatbox event flag bit 0x80, an active\
  \ cutscene script (IsCutsceneScriptNonNull), the OW-player busy routine at 0x0809e462, or an active screen fade\
  \ (must NOT be faded to start; `beq locret`).\n  - On a clean frame it raises EVENT_1731 via SetEventFlagFromImmediate\
  \ and branches on r5+0x14 (param/sub-id): if it matches the player's facing-related state at [r7+0x24] it starts\
  \ the byte_8089E44 cutscene with r5 as param, otherwise it computes a value via sub_81420B0 and, if it matches\
  \ the same [r7+0x24], starts the byte_8089FD8 cutscene instead.\n  - `r5` is the trigger's interaction-area-like\
  \ struct (offsets 0xc/0x10 used as X/Y, 0x14 as sub-id) and is passed as the cutscene param — the cutscript clearly\
  \ keys off the trigger's id.\n  - Caller sub_80A7CEA passes r5/r10/lr, matching exactly the BEast SP beast-gate\
  \ \"check each frame\" idiom found on the OW.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- r4 = dword_80A7D78 (constant 0xE0000/0xE0000/0x1C0000/0x1C0000) loads a 32x32 fixed-point box centred
    on the trigger (`ldr r4, off_80A7D74`). - Player fetch `ldr r7,[r10,#oToolkit_GameStatePtr]` then `ldr r7,[r7,#oGameState_OverworldPlayerObjectPtr]`
    matches the OW-player fetch pattern. - Player coords read at 0x1c/0x20 match OWPlayerObject.Coords X/Y in the
    OWPlayerObject struct (loc=0x1c/0x20). - All four bounds checks (`blt`/`bgt` against the constants) gate on
    the player being strictly inside the box. - Guard chain uses the four known "is the world quiet?" predicates:
    chatbox_mask_eFlags2009F38(0x80), IsCutsceneScriptNonNull, the unnamed 0x0809e462 ("owPlayer_isBusyOrCutsceneActive"),
    and IsScreenFadeActive — standard pre-cutscene guard. - EVENT_1731 set with `movflag` is the gate-up story flag
    for a Beast-SP unlock cutscene; outputs of SetEventFlagFromImmediate feed the EVENT_* domain. - Two `StartCutscene`
    calls dispatch on r5+0x14 vs `[r7+0x24]` (or its post-processed value via sub_81420B0), selecting between two
    distinct CutsceneScript blobs at 0x8089E44 and 0x8089FD8 — typical "variant per direction/version" split. -
    Caller sub_80A7CEA writes r2/r3 only, preserving r5/r10 for the gate check.'
