open_questions:
- The semantic of `[r5+0x14]` (which is "current Z" / "current map index"?) and OWPlayerObject+0x24 (Z coord per
  the struct) - the assembly shows only an equality check; the meaning of which script is picked per value is not
  visible here.
- The role of `sub_81420B0()` in the second branch is opaque; it is called and its return is compared, but the function
  summary only says it reads/writes a wide register range.
- Whether r5 holds a struct allocated by the caller or is one of the OWMapObject fields (e.g., an OverworldMapObject's
  interaction area struct) is not determinable from this function alone - the caller sub_80A7CEA would settle it.
