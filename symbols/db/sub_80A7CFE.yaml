open_questions:
- The exact map/area where this gate fires (multiple Beast SP gates exist; the capture trace `snap_beastsp_0140000_*`
  and the two different cutscene blobs suggest it's one of the conditional gates, possibly the early-game vs. post-game
  variant, but no map id is read in this function alone).
- Meaning of sub_81420B0's transformation of r5+0x14 vs the [r7+0x24] player state — likely a "is facing this way"
  helper but its body isn't provided here.
- Why `IsScreenFadeActive` is a `beq` (continue only when faded) rather than the inverse — probably the design wants
  the screen already darkened before this cutscene kicks in.
- The exact name of EVENT_1731 (the project uses numbered event flags); confirming it would need the flag-table
  symbol at 0x0802f110 or the EVENT_1731 macro.
