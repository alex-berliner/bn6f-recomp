name: sub_8003694
address: '0x08003694'
kind: function
status: confirmed
summary: Projects a world-space object's (x,y,z) into screen coordinates through the camera, returning screen_x,
  screen_y, in-viewport visibility, and a Z depth ready to be passed into an OAM-affine descriptor.
interface: ProjectionResult cameraProjectObject_8003694(u32 obj_ptr /* r0 */, u32 toolkit /* r10 */); /* returns
  r0=screen_x, r1=screen_y, r2=visibility 0/1, r3=depth+DRAW_Z_OFFSET, nzcv set by the depth+DRAW_Z_OFFSET add */
details: "Reads the camera pointer through r10 (r10 holds the toolkit base, then LD32 to +oToolkit_CameraPtr yields\
  \ the camera struct). The world->screen math uses camera fields at offsets 0x3C (X), 0x40 (Y), 0x44 (Z):\n  dx\
  \ = obj.x - cam.x;  dy = obj.y - cam.y;  cam_z = cam.z\n  ScreenX    = ((dx + dy) >> 16) + 0x78      /* centered\
  \ on 240px-wide screen */\n  half_diff  = (dy - dx) >> 1\n  depth_raw  = ((cam_z + 0x800000 + half_diff) >> 16)\n\
  \  ScreenY    = ((half_diff - obj.z + cam_z) >> 16) + 0x52\n  depth_out  = depth_raw + 0x60             /* DRAW_Z_OFFSET\
  \ bias for OAM */\nViewport clip uses signed compares against X in [-0x20, 0x110) and Y in [-0x20, 0xE0); the\
  \ \"visible\" flag is 1 when inside, 0 when outside.\nThe 0x60 depth offset addition is done last so that nzcv\
  \ are derived from depth_raw + 0x60, which the callers chain into another ADD (visible to subsequent flag-using\
  \ code as a fresh add's flags). The depth+0x60 also seems to match the affine parameter scaling format expected\
  \ by the affine-OAM slot setup, hinting this is a sprite/3D-object draw helper. Preserved regs: r4-r9.\n"
