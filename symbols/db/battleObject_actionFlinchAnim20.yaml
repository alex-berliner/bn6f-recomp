name: battleObject_actionFlinchAnim20
address: '0x08105618'
kind: function
status: probable
summary: 'Battle action handler: runs the flinch action logic, then forces the object''s animation to
  20.'
interface: (r0 = battle object, r5 = battle object) -> r0 = destroyed/unused; flags not meaningful
details: A tiny action handler wrapper. It first calls battleObject_actionFlinch_80174FE (the generic
  flinch dispatch, which commits the pushed-back FuturePanel and plays animation 1), then overwrites oBattleObject_CurAnim
  at [r5, CurAnim] with 0x14, replacing the flinch animation with animation 20. r5 must already hold the
  battle object pointer on entry, mirroring the flinch handler's own convention. Likely registered in
  a PlayerObject AI attack jumptable as an 'on flinch' entry for a form/state that flinches with a different
  pose. No caller is known, so the owning action and animation 20's meaning are unidentified.
