name: battle_stateAnim4ThenDestroy
address: '0x080BA8F6'
kind: function
status: probable
summary: Battle-object state handler that plays animation 4 for 2 frames, then disables the object's collision
  and moves it to the destroy state.
interface: (r5 = battle object ptr, no args) -> sets oBattleObject_CurPhase=4, CurAnim=4, Timer=2 on first
  entry; on timer expiry clears oCollisionData_Enabled and sets CurState to CUR_STATE_DESTROY; flags clobbered
details: A per-object state step reading the object from r5 (standard battle state-handler convention).
  On first call (CurPhase == 0) it switches to phase 4, selects animation 4, and loads a 2-frame timer.
  On subsequent calls it counts the timer down; when it reaches 0 it writes 0 to the enabled byte of the
  object's collision data (oBattleObject_CollisionDataPtr -> oCollisionData_Enabled) and stores CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, ending the object. The single 2-frame timer
  and immediate collision disable make it a short 'flash/fade then despawn' handler.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; beq path stores phase=4, anim=4, timer=2 (first-entry
    setup); timer decrement ''sub r0,#1; bgt return'' gates the teardown on a 2-frame delay; on expiry:
    ''strb r0,[r1,#oCollisionData_Enabled]'' with r1 = oBattleObject_CollisionDataPtr disables collision;
    ''mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]'' transitions
    the object to destruction'
