name: battle_beastSpStartCutscene
address: '0x0808711C'
kind: function
status: probable
summary: 'Starts a beast-SP cutscene by comparing a stored byte (r5 field 0xC) against a normalized counter
  (r5 field 6, with values >=0x32 reduced by 0x28) and dispatching StartCutscene with one of two scripts:
  byte_80868C8+0x20 on match, otherwise byte_8086678+0x20.'
interface: (r5 = *BeastSpState) -> void; no return value
details: 'Uses the caller''s r5 as a beast-SP state struct: reads field 0xC and the counter at field 6.
  The counter is normalized — if it is >= 50 (0x32) it has 0x28 subtracted, folding it into a lower range.
  The normalized value becomes the StartCutscene param. If the normalized value equals the field-0xC value,
  the script at byte_80868C8+0x20 is used; otherwise the script at byte_8086678+0x20 is used, so the two
  scripts likely correspond to ''phase unchanged'' vs ''phase changed'' (e.g. first transform vs subsequent/continued
  beast state).'
