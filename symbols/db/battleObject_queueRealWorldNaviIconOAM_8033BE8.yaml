open_questions:
- Exact OAM slot (tile-id 0xC79C -> needs the local OAM layout table).
- Whether EVENT_163 corresponds to "intro/dream-cutscene story flag" and what semantics flipping it has
  — only confirmed by name pattern, not by a flag-id list.
- Whether the icon shown is for the player's navi vs. the opponent — table repetition suggests partner/falcon
  variants but cross-naming would need a flag list.
