name: battle_aiAtkInitBeastPwrDamageVars
address: '0x080121DC'
kind: function
status: probable
summary: 'Battle-AI attack initializer: computes a beast-power-scaled damage value and sets up the AI
  attack vars, returning state 9'
interface: (r0 = 0, r5 = battle object, r7 = AI attack vars) -> r0 = 9 (next AI state); writes oAIAttackVars_Damage,
  _ExtraDamage, _InitFlag, _AttackBoost2
details: Passes index 0 and the battle object's Alliance byte (oBattleObject_Alliance) into battle_beastPwrAtk_addScaledBaseFromIndex_8010D04,
  which reads a 2-byte base entry from the beast power-Atk table at byte_80212D4 and forwards it to the
  damage scaler sub_8012642; the returned value is stored as oAIAttackVars_Damage. It then hardcodes oAIAttackVars_ExtraDamage
  = 0x8A (138), sets oAIAttackVars_InitFlag = 1 (initialization-done marker), and oAIAttackVars_AttackBoost2
  = 0x1E (30, likely a frame counter or multiplier). The fixed return of 9 suggests it is one entry in
  a jump-table-driven AI attack setup routine where each initializer returns the next state/step. The
  use of the Alliance field as the table index implies the damage scales per ally/beast alignment.
