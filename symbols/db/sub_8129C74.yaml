name: sub_8129C74
address: '0x08129C74'
kind: function
status: confirmed
summary: Reconciles a battle object's state byte (+0x20) against a lookup and either dispatches an event via sub_811A610
  or triggers sub_812B218 to repair it.
interface: void sub_8129C74(void *battleObj /* r5 */)
details: "Takes a battle object in r5. Reads byte at +0x1D and asks sub_812B318 to\nclassify it; that helper returns\
  \ a flag in r1 and a candidate state value\nin r2. Compares that value against the object's current state byte\
  \ at\n+0x20. Three branches:\n  * state==2 && flag==0 -> no-op (idle/spawn case).\n  * reported value != state\
  \ -> calls sub_812B218 to fix the object up\n    (the \"catch-up\" / repair path).\n  * value == state -> writes\
  \ 4 to +0x03 (object kind/sub-state = 4) and\n    calls sub_811A610 with a selector chosen from the id at +0x02:\n\
  \      id 0x14 -> selector 4\n      id 0x18 -> selector 5\n      otherwise -> selector 7\n    with r1 = 0.\nTouches\
  \ offsets +0x02, +0x03, +0x1D, +0x20 of the r5 battle object. The\nfunction is reentrant on its own stack frame:\
  \ it pushes only r4/lr, uses\nr4 as scratch for the value, but restores saved r4 on every exit so the\noutput\
  \ registers (r4, r5, r6) are preserved across the call per contract.\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
