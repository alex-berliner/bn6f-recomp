name: sub_8001890
address: '0x08001890'
kind: function
status: confirmed
summary: Blits a rectangle of 16-bit BG tile ids into one of the toolkit's BG tile-id blocks at the given tile (x,y)
  offset.
interface: 'void bgTileIdBlit_8001890(s32 tileX, s32 tileY, s32 bgBlockIdx, const u16* src, s32 tileWidth, s32 tileRows);

  // r0: tile-x offset (in tiles), doubled on exit

  // r1: tile-y offset (in tiles), on exit = ptr past the last row written

  // r2: BG tile-id-block index (0x800-byte block), cleared on exit

  // r3: source pointer (u16*); on exit = src + 2*tileWidth*tileRows

  // r4: tile width per row

  // r5: row count; note r5==0 still copies exactly one row

  // Out flags: from final `cmp r5,#0` on (rowsLeft-1)

  '
details: "Resolves the destination BG tile-id buffer through the toolkit's\niBGTileIdBlocks pointer table (r10 ->\
  \ LD32(R10+oToolkit_iBGTileIdBlocks_Ptr)).\nComputes the starting halfword pointer as:\n    base + (bgBlockIdx\
  \ << 11)   // 0x800 bytes per block\n          + (tileX   << 1)       // 2 bytes per tile-id entry\n         \
  \ + (tileY   << 6)       // 0x40 bytes = 32 tile-ids per tile-map row\nInner loop copies R4 tile ids (one row\
  \ of 16-bit entries) from R3 into the\nbuffer, advancing both pointers by 2 bytes per entry. Then advances the\n\
  row pointer by 0x40 to the next tile-map row, decrements R5, and repeats.\nThe row-count test happens only at\
  \ the bottom of the do/while, so R5==0\nstill performs a single row copy (consistent with the assembly's\n`cmp\
  \ r5,#0 / bgt`). On return, the lifter's outputs make this routine\nconvenient for callers that want to keep a\
  \ cursor: r1 points just past\nthe last row written, r3 points just past the last source halfword, r0\nis tileX*2,\
  \ r2=0.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
