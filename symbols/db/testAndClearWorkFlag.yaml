name: testAndClearWorkFlag
address: '0x0803F324'
kind: function
status: probable
summary: Reads a 1-byte flag in the work area at 0x200AC30+4, returns its old value, and clears it if
  it was set (test-and-clear).
interface: () -> r0 = previous flag value (nonzero if it was set); no flags meaningful
details: 'Loads the address of unk_200AC30 from a literal pool, reads byte_200AC34 (offset +4) into r0,
  and TSTs it against itself to set the Z flag. If the byte is zero it returns immediately with r0 = 0;
  otherwise it writes 0 back to the same byte before returning, leaving r0 holding the old nonzero value.
  So it atomically consumes a one-shot ''event happened'' flag: each call to it clears the flag, so a
  set flag is reported only once. The struct at 0x200AC30 is otherwise untouched here; only offset +4
  is used.'
