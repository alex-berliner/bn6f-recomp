open_questions:
- Why 0x15 is used as the "puzzle active" sentinel and what downstream state it gates.
- The semantics of returning the raw battle_settings byte (+4) when not 0xFF; what value of +4 makes the caller
  treat it specially.
- Whether pt_808139C is shared with other map-driven status lookups (it sits in the same data page as this function's
  table).
