name: ow_resetGroundmanMinigameProgress
address: '0x08143C30'
kind: function
status: probable
summary: Resets the Groundman minigame's event flags, progress state, and active effect.
interface: (r0 = unused, r1 = unused) -> r0 = unused; flags/condition codes unspecified
details: Resets global effect state to type 5, derives a starting event bit position through sub_8143B5E,
  and clears 0x30 consecutive flags there. It then marks the start of two 10-entry flag ranges with EVENT_D98,
  EVENT_DA2, and EVENT_DA8, clearing each range. Finally it calls sub_8143BFC and disables the global
  effect by storing 0 in effect field 0xC via e_setFieldC.
