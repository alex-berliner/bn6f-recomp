name: ow_perFrameUpdateAndRender
address: '0x08138848'
kind: function
status: probable
summary: 'Runs the overworld frame: updates player/NPC/map objects, resolves interactions, then queues
  and flushes all overworld sprites.'
interface: () -> (); no arguments or return value, r0-r3 clobbered by the calls
details: 'This is the overworld''s single per-frame entry point. It first zeroes the object interaction-area
  pool, then dispatches updates for the player object, NPC objects, and map objects (each gated by their
  own pause/battle conditions), and resolves pairwise interaction-area hits (snapping the player to touched
  objects). It then runs the camera and the render pipeline: set render-flush state and reset the palette
  count, render map objects, initialize per-frame palette-group records, draw NPC sprites, and finalize
  the battle-sprite-group queue, finish groups, and queue map-object sprites for OAM.'
