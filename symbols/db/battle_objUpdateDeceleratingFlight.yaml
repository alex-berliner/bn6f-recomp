name: battle_objUpdateDeceleratingFlight
address: '0x080BC2C8'
kind: function
status: probable
summary: 'Per-frame update for a battle object in flight: advances its X position by XVelocity each frame
  while XVelocity is linearly reduced by YVelocity until a timer at +0x68 expires, then transitions it
  to a landing state (CurAnim 3, CurAction 4, phase 0) and signals the paired RelatedObject1Ptr via its
  ExtraVars.'
interface: (r5 = battle object ptr, also passed as r0 to callees) -> r0 = object ptr; updates X, XVelocity,
  timer at +0x68, CurAnim, CurAction, phase, and RelatedObject1Ptr fields; no return value
details: Decrements the object's word/halfword timer at offset 0x68; while nonzero it integrates oBattleObject_X
  += oBattleObject_XVelocity and subtracts oBattleObject_YVelocity from XVelocity each frame, so horizontal
  speed decays at a constant rate. When the timer reaches 0 it calls sub_80BC424 (state-change helper),
  zeroes RelatedObject1Ptr's ExtraVars[0], sets its ExtraVars+0xC to 1 (likely a signal flag to the paired
  object), and sets the object to CurAnim 3, CurAction 4, phase 0 — a landing/stopped state. It then calls
  object_setPanelsFromCoordinates to recompute PanelX/PanelY from world X/Y/Z and sub_80BC468 for follow-up
  (likely collision or sprite handling). The exact identity of the entity (projectile vs. enemy) is not
  determinable from this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: ldrh/strh at +0x68 with cmp #0 / beq — countdown timer gating movement; asm: X += XVelocity
    then XVelocity -= YVelocity each frame — linearly decelerating horizontal motion; asm at loc_80BC2E8:
    sets RelatedObject1Ptr ExtraVars[0]=0, ExtraVars+0xC=1, CurAnim=3, CurAction=4 — state transition
    on timer expiry; callee object_setPanelsFromCoordinates known summary: recomputes PanelX/PanelY from
    world X/Y/Z; route ''battlesweep'' execution confirms battle-phase context'
  refs:
