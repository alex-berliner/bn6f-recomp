  reproduce: python3 tools/asmcat.py 0x080BC2C8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The integration line `add r0, r0, r1` uses XVelocity (r0) + X (r1) and stores back to X, so X advances
    by XVelocity (not XVelocity subtracted by YVelocity). The decay line `sub r0, r0, r1` uses XVelocity
    - YVelocity, meaning YVelocity is subtracted from XVelocity each frame (so XVelocity decays at rate
    YVelocity, not ''constant rate'' as summary says). Function still fits a decelerating flight update
    with landing transition, but the summary should reflect that X increases by XVelocity and XVelocity
    decreases by YVelocity.; run wf investigate investigate-20261018-212108; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
