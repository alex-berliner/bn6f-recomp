name: UnpauseBattle
address: '0x0800A032'
kind: function
status: confirmed
summary: Clears the game state's "battle paused" flag, resuming battle processing.
interface: void battle_unpause(void); // reads toolkit from r10
details: 'Loads the toolkit''s game state pointer (r10 + oToolkit_GameStatePtr, so the caller is

  expected to have the toolkit in r10), then writes 0 as a byte to

  gameState + oGameState_BattlePaused. Nothing else is touched: no flags or other state are

  modified, and the pause flag is simply reset to unblocked so battle updates resume. No

  return value.

  '
