name: sub_80FDFD0
address: '0x080FDFD0'
kind: function
status: hypothesis
summary: Tiny thunk that calls sub_800FE28 with a pointer to a one-word constant table (0x14141414) and passes r5
  through, returning the callee's r0.
interface: 'u32 sub_80FDFD0(u32 arg5 /* r5 */); // out: r0 = result of sub_800FE28'
details: 'Pushes lr, loads the address of dword_80FDFE0 into r0, then tail-calls sub_800FE28 via

  bl sub_800FE28 and pops pc. The only data it supplies is the pointer to the constant

  table at 0x080FDFFE0, whose single word is 0x14141414; the caller''s r5 is forwarded

  unchanged as the second argument. No state of its own is read or written, so its game

  meaning is entirely inherited from sub_800FE28 (unknown here). Note that despite the

  "dword" label, the callee is only ever handed the table''s address, so it may read a

  variable-length list starting at that word rather than a single value. Flags nz c v

  and r1/r2/lr are clobbered only as far as the callee''s own contract implies.

  '
