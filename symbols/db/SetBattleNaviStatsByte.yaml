name: SetBattleNaviStatsByte
address: '0x080136B0'
kind: function
status: confirmed
summary: Writes a single byte at a given offset into the NaviStats record of the requested Navi (alliance side),
  e.g. updating a netbattle stat.
interface: void SetBattleNaviStatsByte(bool alliance, u32 fieldOffset, u8 value)
details: 'r0 selects which side''s NaviStats record to touch (passed straight through to GetBattleNaviStatsAddr,
  which returns the base pointer for that alliance), r1 is the byte offset of a field within the NaviStats struct,
  and r2 is the value to store. The function is just a wrapper: resolve the record address, then STRB the value
  at [base + offset]. r1 and r2 are stashed in r6/r7 across the call because GetBattleNaviStatsAddr presumably uses
  r0-r3/lr, so the caller''s r6/r7 are preserved by push/pop. No return value. Since offset and value are caller-supplied,
  this is a generic field setter used (likely after netbattles) to update individual stat bytes without dedicated
  setters per field.

  '
