name: ai_initAttackVars
address: '0x08113F10'
kind: function
status: probable
summary: 'Initializes an enemy AI attack: picks the nearest enemy-of-the-owner target, loads per-version
  attack duration, and kicks off attack 0xB via the AI attack-variable struct.'
interface: (r5 = BattleObject whose alliance is flipped for targeting, r7 = AIAttackVars struct, r6 =
  AIState, r4 = AIData) -> r0 = 0; sets object attack 0xB, writes AIAttackVars fields
details: Clears oBattleObject_CurAnim on the object, installs sub_8113F94+1 as the oAIAttackVars_PanelChooseCallback,
  and calls battleObject_findClosestEnemyBattleObject with the object's alliance XOR 1 (i.e. the opposing
  side) to fill oAIAttackVars_TargetObjectPtr. It then loads a per-version byte from byte_8113D84 indexed
  by oAIData_Version_16 into oAIAttackVars_AttackDuration, and hardcodes AiDifficultyTier=2, AttackBoost2=0x14,
  TimerOrCycles=0x15, and ScratchVar=AiAttackParam=3. It invokes object_setAttack0 with attack id 0xB,
  calls sub_8114214 (unknown helper), and finally zeroes oAIState_ScriptId (with a second branch clearing
  the first byte of r6 as well). This reads as one step of a scripted enemy AI state machine preparing
  an attack.
