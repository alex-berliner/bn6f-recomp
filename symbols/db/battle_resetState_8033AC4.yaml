name: battle_resetState_8033AC4
address: '0x08033AC4'
kind: function
status: confirmed
summary: Runs the four battle-state (re)initialization routines in order, resetting the battle work area pointed
  to by r5.
interface: void battle_resetState(struct S2011E30 *self /* r5 */);  /* clobbers r0-r3, flags; preserves r5-r7, r10
  */
details: 'Thin sequencer over the battle-state initializers for the battle work struct S2011E30 whose pointer arrives
  in r5. It performs four steps with no arguments of its own: calls sub_8033B80 with r0 = 0, calls sub_8033F80 with
  r0 = 0, then calls sub_8033C68 and sub_8033BE8 with no arguments. The zeros passed to the first two callees look
  like a mode/flag argument (e.g. "reset" vs "init" or a phase index), but their meaning is only known from the
  callees. Return value and flag state on exit are whatever sub_8033BE8 happens to leave; the caller contract treats
  r0-r3 and nzcv as outputs, so nothing here is meaningful to callers. r5 (and r6, r7, r10) are preserved through
  the callees, so the battle work pointer survives the whole sequence.'
