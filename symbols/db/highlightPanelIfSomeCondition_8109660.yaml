name: highlightPanelIfSomeCondition_8109660
address: '0x08109660'
kind: function
status: hypothesis
summary: For each (dx,dy) entry in a panel-offset list, highlights the panel at (baseX + dx*sideSign, baseY + dy)
  when the coordinates fall on the 6x3 battle grid.
interface: void highlightPanelIfSomeCondition_8109660(s32 baseX /* r0 */, s32 baseY /* r1 */, u32 listIndex /* r2
  */, u32 side /* r3, +1 or -1 */); preserves r4-r7; NZ/C/V set per final dx compare (dx == 0x7F)
details: 'Indexed table fetch: ldr r4, [r4, r2<<2] where r4 holds PanelOffsetListsPointerTable (off_81096A0) and
  r2 selects one of several s8 (dx, dy) panel-offset lists.

  Each list is terminated by an entry whose dx byte equals 0x7F (signed); the loop runs until that sentinel is read.

  Horizontal mirroring: r3 (side) is converted to an x direction via xDir = 1 - 2*side, so callers flip the line
  to face left/right without supplying a separate list.

  Panel coords computed: panelX = dx * xDir + baseX; panelY = dy + baseY.

  Bound check is the 6x3 battle grid: panelX in [1..6], panelY in [1..3]. Only on-grid panels call object_highlightPanel;
  off-grid entries are silently skipped (falls through to loc_8109698).

  Side effects: invokes object_highlightPanel(R0=panelX, R1=panelY) once per in-bounds list entry. Tail of list
  returns with the 0x7F sentinel still in r0; preserved registers r4-r7.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
