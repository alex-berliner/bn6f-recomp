name: saveMenu_config_textscript_8132CB8
address: '0x08132CB8'
kind: function
status: confirmed
summary: Sets up the save menu's text-script assets (init-ref list, decompressed background blobs, network script,
  and background tile grid) before the menu is shown.
interface: void saveMenu_initTextScript_8132CB8(void);  /* r10/lr in; r4-r7 preserved */
details: "Builds a 5-entry (0x20 bytes / 16 bytes each) init-ref list at unk_20096E0 by walking\noff_8132D58; for\
  \ each entry it calls sub_811FB84 on the data/size pair (the comment\n\"register form: calls sub_811FB84 outside\
  \ this file\" suggests this is an asset\nreference resolver) and writes the result, then copies the remaining\
  \ two words\nof the entry verbatim, terminating the list with a zero word. It then:\n  1. decompresses the assembled\
  \ init-ref list via decompAndCopyData (required for\n     the menu's partial background),\n  2. decompresses the\
  \ comp_86C8054 blob listed at off_8132D80 into the\n     eDecompBuffer2013A00 region (also required for the background),\n\
  \  3. loads the network text script via sub_8123300 using TextScriptNetworkPtrs8132D18\n     (the table of 13\
  \ entries, mostly TextScriptNetworkSave86CF730 bracketed by two\n     CompTextScriptNetworkPlyTmSave86CF618 entries)\
  \ into eTextScript201BF00 (omitting\n     this crashes the save menu on entry),\n  4. copies a 30x20 (0x1e x 0x14)\
  \ background tile grid starting at (0,0) from\n     tile-block-1 source tiles at eTextScript201BA00.\nRegisters\
  \ r4-r7 are pushed and popped around the body; the assembly \"outputs r4 r5\"\nnoted in the contract are simply\
  \ the incoming values being restored (the same\nhelper-call adapter pattern used for CopyBackgroundTiles which\
  \ takes its 5th/6th\narguments in r4/r5).\n"
