open_questions:
- What is the exact semantics of sub_811FB84 (the "convert_init_ref" stub)?
- Are the "extra" two words per off_8132D58 entry a tile range / palette / flags consumed later by whatever reads
  unk_20096E0, or pure padding?
- Why are 11 of the 13 TextScriptNetworkPtrs8132D18 entries the same pointer (TextScriptNetworkSave86CF730) bracketed
  by two CompTextScriptNetworkPlyTmSave86CF618 entries -- is one a header/tail and the others repeated payload slots?
- Does this routine run once per menu open or once at boot (the "save menu" name suggests per-open, but unk_20096E0
  looks like a persistent EWRAM slot)?
