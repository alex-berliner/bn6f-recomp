name: ow_initObjectSprite
address: '0x080A9F78'
kind: function
status: probable
summary: 'Initializes an overworld object''s sprite from fields in its struct: loads the sprite resource,
  sets animation, priority and palette, then advances the object''s state.'
interface: () -> void; operates on the current object in r5, tail-calls sub_80A9FB8
details: 'The object struct in r5 is configured for sprite setup: state byte [r5] is set to 3 on entry.
  sprite_load is called with r0=0x80, r1=0x1c and the sprite id from [r5+5]; the animation index [r5+6],
  shadow-off flag, priority [r5+7] and palette 0 are then applied via the sprite_* helpers, which act
  on an implicit current-object pointer. sub_80AA04C is called with [r5+4] and its result stored as a
  word at [r5+0x14] (likely a computed sprite/dimension value). Field [r5+0x24] is cleared, [r5+8] is
  set to 4 (next state/mode), and sub_80A9FB8 is tail-called to finish the step.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r2,[r5,#5] then bl sprite_load — sprite id comes from the object struct; ldrb r0,[r5,#6]
    / bl sprite_setAnimation and ldrb r0,[r5,#7] / bl sprite_setPriority_8002E14 — animation and priority
    read from struct bytes 6/7; bl sprite_loadAnimationData and bl sprite_noShadow — full sprite attachment
    for a map object; bl sub_80AA04C with ldrb r0,[r5,#4]; str r0,[r5,#0x14] — derived value cached in
    the object; strb #4,[r5,#8] then bl sub_80A9FB8 — state byte advanced and a follow-up setup step run'
