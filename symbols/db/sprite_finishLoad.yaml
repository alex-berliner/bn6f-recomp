name: sprite_finishLoad
address: '0x080A8848'
kind: function
status: probable
summary: Finalises an OW sprite load once its first-frame flip flag is set, switching state to 8 then
  running a sprite update.
interface: () -> void; uses object in r5.
details: Called immediately after sub_80A8814 writes 4 into [r5,#8] (the OW-object state byte, indicating
  the sprite load is in progress). It calls sprite_getFrameParameters and tests the returned flag mask
  0x80 (the flip-disable / h-flip-cleared bit exposed by that callee). If that bit is set, it overwrites
  [r5,#8] with 8 (the loaded/idle state) and then always calls sprite_update. The .byte 0,0 tail is alignment
  padding for the next thumb literal pool.
