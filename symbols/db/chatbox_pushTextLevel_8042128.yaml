name: chatbox_pushTextLevel_8042128
address: '0x08042128'
kind: function
status: confirmed
summary: Open a nested text-display level in the chatbox, wiring its script pointer and saving the resume
  point for when it closes.
interface: void chatbox_pushTextLevel(u32 arg1 /* r1 */, u32 arg2 /* r2 */, u32 arg3 /* r3 */, const u8*
  cmdWord /* r4, points at a 4-byte chatbox text command */, struct Chatbox* chat /* r5 */); -> r0 = 1
  (always), r1 = historySlotOffset (0x140 + (depth-1)*4), r2 = 4 (mul scratch left in place), r4 = per-slot
  text buffer base (byte_200AFA0 + slot*64); NZ from r0=1, C/V cleared; r5, r10, lr clobbered.
details: 'Increments chat->unk_05 (the active text-level depth). r4 points at a 4-byte chatbox text

  command word in an outer script: byte 2 is a parameter passed to chatbox_8042A14, byte 3

  selects which of the chatbox''s saved text-buffer slots to resume from. If byte 3 != 0 the

  script pointer is taken from the chatbox''s per-slot saved-script table at chat+0x4C +

  (slot-1)*4; if 0 the script is built fresh by sub_803D06C (called with the caller''s r1..r3

  preserved via a push/pop sandwich). The chosen script plus the byte-2 parameter are handed

  to chatbox_8042A14 along with the per-slot text bank (byte_200AFA0 + slot*64). The slot''s

  text bank is then stored into chat->TextScriptCursorPtr (the engine''s current text cursor).

  The outer command pointer advances by 4 bytes and is recorded as the resume point in two

  places: chat->unk_44 (single-level resume) and the depth-indexed history table at chat+0x140

  +(depth-1)*4 (multi-level resume). The function returns r0=1 with the slot''s text-bank base

  left in r4 so the caller can chain into chatbox_8042A14''s already-prepared text state.

  '
