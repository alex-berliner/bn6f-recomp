name: battle_startIntro
address: '0x08008D9C'
kind: function
status: probable
summary: 'Per-frame battle-start state handler: polls both players'' virtual joypads, on first entry zeroes
  the custom gauge and kicks off the battle-intro effect, then holds the state until the link partner
  is ready.'
interface: '(r5 = battle state struct: +0 word state, +3 byte substate, +4 byte flag, +8 halfword timer)
  -> r0 = clobbered; may set state word to 4'
details: 'Runs each frame of the battlesweep route, first updating the virtual-joypad edge state for both
  the player navi (r0=0) and the partner navi (r0=1), which matters for linked/double battles. If the
  substate byte at r5+3 is still 0, it initializes: clears the byte at +4, loads a 30-frame timer into
  the halfword at +8, sets +3 to 4, calls sub_801DF0C, resets the custom gauge to 0 via SetCustGauge (typical
  at battle start), and dispatches kind-0 effect 0 through battle_dispatchKindEffect — almost certainly
  the battle-intro animation. Every frame it then calls comm_checkCrossNetBattleReady; while the cross-net
  partner has not reached the expected mode (returns 0), it writes state 4 into the word at r5+0, effectively
  waiting for the linked session before proceeding.'
