name: battle_whiteWaitPhaseUpdate
address: '0x080E6B36'
kind: function
status: probable
summary: Battle-object phase handler that holds a related object fully white for 10 frames, then runs
  a follow-up routine and advances the object to phase 8.
interface: (r0, r4 = scratch/unused, r5 = battle object ptr) -> void; no meaningful return value
details: Standard battle-object phase step. On first entry (oBattleObject_PhaseInitialized == 0) it stores
  4 into PhaseInitialized and 0xA into oBattleObject_Timer. On later frames it decrements oBattleObject_Timer
  each call; when it reaches 0 it calls sub_80E6BA6 and writes phase 8 into oBattleObject_CurPhaseAndPhaseInitialized.
  Every frame, regardless of branch, it loads oBattleObject_RelatedObject1Ptr from the object and calls
  sprite_forceWhitePalette on it, so the linked object is forced to the all-white palette for the whole
  10-frame wait — likely a white-silhouette/flash state (e.g. materialization or deletion effect) before
  the next phase takes over.
