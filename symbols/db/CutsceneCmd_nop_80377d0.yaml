name: CutsceneCmd_nop_80377d0
address: '0x080377D0'
kind: function
status: confirmed
summary: No-op cutscene script command that just skips itself and tells the script engine to keep running.
interface: 'Next cutsceneCmd_nop(u8** scriptCursor) // in: r7 = pointer into cutscene script; out: r0 = 1 to continue
  (0 would halt), r7 advanced past this command; N/Z from r0, C/V from the pointer increment'
details: 'A do-nothing cutscene script opcode. It calls returnZero_809E228 (a helper that always returns 0, likely
  a shared "no side effect" hook) and compares the result against 0. Since it is always 0, the normal path adds
  1 to the script pointer in r7 (stepping past this single command byte) and returns r0 = 1 so the cutscene interpreter
  continues with the next command. If the helper ever returned nonzero, the function would return r0 = 0 without
  advancing r7, halting the script — defensive behavior against a code path that can''t currently trigger. The command
  occupies a single byte in the script (only r7 += 1). No other structures or memory are touched. On the halt path
  the flags visible to the caller come from the cmp r0, #0; on the normal path C/V come from the r7 increment, since
  the subsequent movs r0 only rewrites N/Z.'
