name: sprite_updatePositionAndClamp_811A57C
address: '0x0811A57C'
kind: function
status: confirmed
summary: sprite update step — adds (0x10, 0) to the sprite's coordinates, then if the new X reaches 0x3C snaps Y
  to a per-state clamp table and clears a state flag, finally chaining into the next animation/phase step.
interface: void sub_811A57C(struct SpriteObj *r5); /* clobbers r0-r3, lr, N Z C V; preserves r4, r5, r6, r7 */
details: "Acts as a sprite update/phase handler: takes the sprite in r5 (a standard\nsprite struct whose byte 6\
  \ is a small state index and byte 7 a flag byte).\n- sprite_addCoordinates(0x10, 0) shifts the sprite by (+0x10,\
  \ 0).\n- sprite_getCoordinates() returns the new X in r0.\n- If X >= 0x3C, the per-state clamp is fetched from\
  \ a u16 table at\n  byte_811A5AC (entries: \"0x26, 0x39, 0x4C, 0x5F\" in word form, i.e.\n  states 0..3 give Y\
  \ clamps of 38, 57, 76, 95); the sprite is then\n  re-positioned with sprite_setCoordinates(0x3C, clamp) and r5+7\
  \ is\n  cleared to 0 (consuming the flag that presumably gated this branch).\n- Always chains into sub_811A51C\
  \ for the next stage.\nQuirks: the clamp table values are \"0x26, 0x39, 0x4C, 0x5F\" in their\nstorage words (little-endian\
  \ u16s: 0x0026, 0x0039, 0x004C, 0x005F);\nthe state byte at r5+6 indexes by *2 (so up to 4 valid entries fit before\n\
  walking off the 8-byte table).\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
