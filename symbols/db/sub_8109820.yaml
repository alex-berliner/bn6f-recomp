summary: 'Per-step AI attack panel selector: validate and reserve the AI''s chosen destination panel, set the cannot-slide
  flag, dispatch to one of two next-step routines, then advance the AI attack state.'
interface: "void aiAttackStep_panelSelect_8109820(\n    /* battle object */ void *r5,\n    /* unknown */      void\
  \ *r6,\n    /* AI attack vars */void *r7)\n/* preserves r4-r7; returns void; flags NZ/C/V left meaningful after\
  \ object_canMove */\n"
details: "Reads candidate panel X/Y (oAIAttackVars_Unk_16/17) and parameter pair\n(oAIAttackVars_Unk_34/38) and\
  \ calls object_checkPanelParameters. On success:\n  - writes the same X/Y into the battle object's future-panel\
  \ slot\n    (oBattleObject_FuturePanelX/Y on r5),\n  - calls object_reservePanel with X/Y in r0/r1,\n  - sets\
  \ flag OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1,\n  - sets oAIAttackVars_Unk_00 = 4 (likely the \"panel-reserved\"\
  \ / next-state\n    index for the AI attack state machine),\n  - dispatches to sub_81098C4 when Unk_03 != 0, else\
  \ sub_810990E,\n  - then runs sub_810986E (likely the AI-attack state machine step update).\nOn any failure path\
  \ (cannot move or parameter check fails), clears\noAIAttackVars_Unk_1a to 0 and calls sub_801171C, presumably\
  \ to abort /\nreset the AI attack. Uses standard AAPCS callee-preserved r4-r7.\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
