name: testSetClearFlags_803553c
address: '0x0803553C'
kind: function
status: confirmed
summary: Synchronizes five derived event flags to their source flags, then clears a trigger flag.
interface: propagateDerivedEventFlags_803553c(u32 r10) -> u32 r0 (= 0); clobbers r1 r3; preserves r4-r7
details: 'First calls clearSetFlags_80355a8 (an upstream helper that likely performs its own set/clear step). Then,
  for each of five source→derived event-flag pairs, it calls TestEventFlagFromImmediate on the source; if the source
  flag is set (ZF clear) it calls SetEventFlagFromImmediate on the derived flag: (6,0x7B)->(6,0x82), (8,0x56)->(8,0x5F),
  (0xA,0x44)->(0xA,0xBA), (0xC,0x6D)->(0xC,0xDC), (0xC,0xA7)->(0xC,0xE0). Finally it unconditionally clears (1,0x20)
  (EVENT_120) via ClearEventFlagFromImmediate and returns 0 in r0. The function touches no game object structures;
  all state is in the global event-flag table indexed by (page, bit). r10 is passed in by callers but not read by
  this body; r4-r7 are pushed/popped unchanged so their values after the call are whatever clearSetFlags_80355a8
  left them as.'
