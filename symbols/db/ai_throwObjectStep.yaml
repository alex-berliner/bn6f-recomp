name: ai_throwObjectStep
address: '0x08115340'
kind: function
status: probable
summary: AI attack state handler that throws a projectile toward the object's targeted future panel, launching
  it on a computed arc.
interface: (r5 = battle object, r7 = AI attack vars) -> void
details: 'Runs as an AI attack step: first clears the object''s collision region if the collision flags
  match 0xc000000, then ticks a step timer (oAIAttackVars_StepTimer); once the timer counts below zero
  it reads the object''s FuturePanelX/Y, converts them to pixel coordinates, computes throw velocities
  with math_getThrowSpeeds (range 0x1e), stores them into XVelocity/ZVelocity, clears the collision region
  again, clears ObjectFlags1 bit 1, sets the object''s current animation to 4 and oAIAttackVars_HitElement
  to 0x10, then calls sub_8115398 (likely spawn of the projectile). The use of FuturePanel targets, fixed-point
  coordinates and throw-speed math indicates an enemy lobbing a bomb-style object onto a panel, consistent
  with its use in battlesweep/beastsp routes.'
