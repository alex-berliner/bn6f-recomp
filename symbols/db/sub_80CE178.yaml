name: sub_80CE178
address: '0x080CE178'
kind: function
status: confirmed
summary: 'Per-frame action dispatcher for a battle object: jumps to the handler selected by the object''s current
  action, then refreshes its sprite animation.'
interface: 'void battleObject_runAction_80CE178(void);

  // inputs:  r2 (context, passed through to handler), r5 (battle object pointer), r10, lr

  // outputs: r5 (possibly updated object pointer), r8-r12 (as left by handler/sprite update)

  // clobbers: r0-r4, r6-r7, lr, nzcv

  '
details: 'Reads the object''s current action byte from r5+oBattleObject_CurAction, uses

  it directly (no shift) as a byte index into the two-entry Thumb jump table

  off_80CE190, and tail-calls the selected handler (sub_80CE198 or

  sub_80CE1D6) via a Thumb-mode bx. The handler runs with r0=action,

  r1=handler address, r2=the caller''s r2, and the (possibly new) object

  pointer is read back from r5. After the handler returns, calls

  object_updateSprite to advance the object''s sprite animation for the

  frame. The handler table entries point at sub_80CE198+1 and

  sub_80CE1D6+1 (Thumb bit pre-set).

  '
