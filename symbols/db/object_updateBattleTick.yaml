name: object_updateBattleTick
address: '0x080D390A'
kind: function
status: probable
summary: 'Per-frame update for a battle object: refresh its collision state, spawn hit effects, run its
  behavior hook and sprite, and self-destruct when the battle ends.'
interface: (r5 = battle object) -> void; sets the object's state to CUR_STATE_DESTROY when the battle
  is over
details: Takes the object in r5 (no args in r0-r3). First calls object_removeCollisionData to tear down
  previous-frame collision data and object_spawnCollisionEffect to spawn the hit-effect object for the
  last collision. If battle_isBattleOver says the battle is still running, it reads the object's CollisionDataPtr,
  and if FlagsFromCollision is nonzero calls object_clearCollisionRegion; then calls the behavior hook
  sub_80D3946, object_updateSprite, and object_presentCollisionData to rebuild this frame's collision
  state. If the battle is over it clears bit 0x2 of oObjectHeader_Flags, clears the collision region,
  and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized. The whole routine
  follows the standard battle-object update shape (remove -> effect -> behavior -> sprite -> present),
  so sub_80D3946 is the object-type-specific behavior callback.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'calls object_removeCollisionData at entry and object_presentCollisionData at the end of the
    alive path — the standard per-frame collision refresh pair; battle_isBattleOver branch: alive path
    runs sprite/collision updates, over path destroys the object; over path writes CUR_STATE_DESTROY to
    oBattleObject_CurStateActionPhaseAndPhaseInitialized and clears oObjectHeader_Flags bit 0x2; object_spawnCollisionEffect
    (per its doc, uses r5 as the battle object) implies r5 is the object pointer throughout; sub_80D3946
    is invoked with no visible setup between collision handling and object_updateSprite, fitting a per-object
    behavior callback'
