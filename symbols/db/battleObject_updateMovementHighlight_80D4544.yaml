    Timer being clear. - "ldrb r0, [r5,#oBattleObject_PanelX] / ldrb r1, [r5,#oBattleObject_PanelY] /
    bl object_highlightPanel" passes the object''s current panel to highlightPanel. - "ldrh r0, [r5,#oBattleObject_Timer]
    / sub r0,#1 / strh r0,[r5,#oBattleObject_Timer]" decrements the timer each call. - "bgt locret_80D456E"
    exits early if the timer remains > 0; otherwise the ORR-with-2 path arms the "finished" branch. -
    "strb r0, [r5,#oBattleObject_CurAction]" with r0=4 sets CurAction to 4 on completion. - "strh r0,
    [r5,#oBattleObject_CurPhaseAndPhaseInitialized]" with r0=0 clears CurPhase/PhaseInitialized.'
