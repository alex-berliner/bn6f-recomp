name: battleObject_updateMovementHighlight_80D4544
address: '0x080D4544'
kind: function
status: confirmed
summary: Counts down a battle object's movement-highlight timer, highlighting its panel each frame, and on expiry
  marks it ready to move (action 4).
interface: 'void battleObject_updateMovementHighlight_80D4544(obj /* r5 */) -> r1 (status value: 4 if highlight
  skipped, object_highlightPanel''s r1 otherwise, 2 once the timer expires)'
details: "Per-frame update for a battle object (r5) in its movement-highlight countdown state:\n1. Reads oBattleObject_Timer\
  \ (u16). If bit 2 (0x4) of the timer is clear, calls\n   object_highlightPanel with oBattleObject_PanelX / oBattleObject_PanelY\
  \ to mark the\n   panel the object stands on (the blinking target-area highlight shown while choosing\n   a move).\
  \ If bit 2 is set, the highlight call is skipped and r1 stays 4.\n2. Reloads Timer (the highlight call may have\
  \ modified it), decrements it, stores it back.\n   While the result is still > 0, returns early.\n3. When the\
  \ timer reaches 0 or below: sets bit 1 (0x2) of oObjectHeader_Flags (the\n   \"ready to move\" / input-accepted\
  \ flag), writes oBattleObject_CurAction = 4, and\n   clears oBattleObject_CurPhaseAndPhaseInitialized (u16 = 0)\
  \ so the action state\n   machine restarts at phase 0.\nOutput r1 is incidental: 4 on the skip path, the highlight\
  \ call's r1 on the highlight\npath, and 2 on the expiry path (left over from the orr immediate). Callers read\
  \ it, so\nit is effectively a small status return.\n"
