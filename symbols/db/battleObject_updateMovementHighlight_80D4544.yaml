open_questions:
- The ORR is with literal 2 (`mov r1,#2 ; orr r0,r1 ; strb r0,[r5,#oObjectHeader_Flags]`), but the project's
  ObjectHeader defines OBJECT_FLAG_PAUSE_UPDATE as 0x04, not 0x02. So either the constant 0x02 here is
  a different "done with movement" flag, or the struct constant is misnamed - the assembly itself clearly
  sets bit 0x02 (i.e. what the project calls OBJECT_FLAG_VISIBLE) in the header byte, not bit 0x02 of
  pause. Worth confirming against the real engine which bit means "movement finished, freeze this actor".
- The Timer bit 0x4 being "highlight only while this bit is unset" is a behaviour inferred from the test/invert
  branch, not labelled.
