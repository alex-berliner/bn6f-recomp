status: probable
summary: 'Per-frame battle object update: re-highlights the panel under the object while its movement
  timer has bit 0x4 clear, decrements the timer, and on expiry marks the object paused with CurAction=4
  and clears CurPhase/PhaseInitialized.'
interface: '(r5 = BattleObject*) -> void ; side effects: writes oBattleObject_Flags, oBattleObject_CurAction,
  oBattleObject_CurPhaseAndPhaseInitialized; may call object_highlightPanel'
details: "- Loads the 16-bit Timer at offset oBattleObject_Timer (0x20) and tests bit 0x4; if clear it\
  \ reads the object's current panel coordinates (PanelX 0x12, PanelY 0x13) and invokes object_highlightPanel(r0=PanelX,\
  \ r1=PanelY) to keep its panel marked as highlighted.\n  - Always decrements the Timer word by 1 (sub\
  \ r0,#1 / strh to oBattleObject_Timer 0x20). The decrement uses the halfword at 0x20; if the lower byte\
  \ of Timer2 (0x22) matters it is not touched here.\n  - If the decremented timer is still > 0 the function\
  \ returns (pop {pc}); otherwise it sets OBJECT_FLAG_PAUSE_UPDATE (0x04 -> bits 0x02 in the Flags byte\
  \ at oObjectHeader_Flags 0x00 via ORR with 2 - wait, see uncertainty) into oObjectHeader_Flags (0x00),\
  \ forces CurAction (0x09) = 4, and writes 0 to CurPhaseAndPhaseInitialized (0x0a) so the next update\
  \ starts at phase 0 with PhaseInitialized=false.\n  - The contract says callers see lr restored and\
  \ r0..r3 clobbered; only r5 is in. Callee object_highlightPanel uses the same r0/r1 contract (panelX,\
  \ panelY) and clobbers flags. No r4 is touched, so this is leaf-ish with one BL and one POP {pc}.\n"
