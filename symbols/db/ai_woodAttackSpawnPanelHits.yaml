    run wf investigate investigate-20261019-010606'
open_questions:
- what sub_80D07A0 does with r4=0x45A00 and r6=damage (hit-object spawn vs direct damage)
- exact meaning of the byte read from oAIAttackVars_InitFlag passed as r2
- which attack the pattern list at table+0x68 encodes (shape of the wood attack)
