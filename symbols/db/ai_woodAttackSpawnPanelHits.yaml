name: ai_woodAttackSpawnPanelHits
address: '0x080ED94E'
kind: function
status: probable
summary: Spawns the wood attack's hit at every panel of a facing-relative offset pattern around the attacker.
interface: (r5 = attacker battle object, r7 = AI attack vars) -> r0 = 0/void; extra args to callee in
  r4/r6
details: Loads a pointer list from PanelOffsetListsPointerTable entry +0x68 and walks it as (dx, dy) signed-byte
  pairs terminated by 0x7F. Each dx is multiplied by object_getFrontDirection() (+1/-1 by alliance/DirectionFlip)
  and added to the object's PanelX; dy is added to PanelY. If the resulting panel is inside the 6x3 battle
  area (x 1..6, y 1..3), it calls sub_80D07A0 with r0=x, r1=y, r2 = byte from oAIAttackVars_InitFlag,
  r3=0, r4=0x45A00 (constant hit/effect descriptor) and r6 = oAIAttackVars_Damage; r4/r6 are saved around
  the call, so they are callee arguments, not scratch. This is the panel-spreading step of the wood AI
  attack, run per pattern tile on the active frame.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r6, off_80EDCB8 / ldr r6,[r6,#0x68] loads the attack's panel-offset pattern list; bl object_getFrontDirection;
    mul r2,r4 mirrors dx by the object's facing; bounds cmp r0,#1/#6 and cmp r1,#1/#3 match the 6x3 battle
    grid; ldrb r2,[r7,#oAIAttackVars_InitFlag] and ldr r6,[r7,#oAIAttackVars_Damage] feed attack state
    into sub_80D07A0; sole caller ai_woodAttackHandler invokes this on the attack-active frame after arming
    hit data
  refs:
  - bn6f/asm/asm31.s:116644
  - 0x080ED8E0 ai_woodAttackHandler
  - 0x0800E2CA object_getFrontDirection
  - 0x080D07A0 sub_80D07A0
