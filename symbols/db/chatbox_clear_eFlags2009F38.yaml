name: chatbox_clear_eFlags2009F38
address: '0x08045F2C'
kind: function
status: confirmed
summary: Clears the selected bits of the chatbox/event flag word at 0x2009F38 (e.g. dismissing per-dialogue
  state).
interface: void chatbox_clear_eFlags2009F38(u32 mask /* r0 */); returns flags NZ = new flag word, r1-r2
  preserved
details: 'Tiny bit-clear helper over the event flag word at 0x2009F38 (symbol eFlags2009F38): r0 is a
  bitmask of flags to clear; the word is loaded, ANDed with ~r0 (bic), and stored back. r1 and r2 are
  used as scratch but pushed/popped so they are preserved for the caller. The NZ condition flags are left
  reflecting the new flag word value, which callers could branch on (e.g. branch if the word became zero
  after clearing). This is the clear-side counterpart to a corresponding set/test helper for the same
  flag word; such words typically track transient chatbox/message state during cutscene or dialogue scripts.
  Pure Thumb leaf routine, no other state touched.

  '
