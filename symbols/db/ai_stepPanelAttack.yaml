open_questions:
- What sub_80E3CF2 spawns (attack entity vs. effect) and the exact meaning of its 0xC0000 and AttackBoost2|0x100
  arguments
- Which caller invokes this and with which enemy/AI context, to confirm it is a generic step vs. a specific
  boss attack
- The two-phase logic matches (entry sets element=1, anim=1, PanelCleared=0; then waits for frame attr
  0x80, calls sub_80E3CF2 with PanelX/PanelY/ScratchVar/0xC0000/AttackBoost2|0x100 and stores the handle
  into PanelCleared, sets HitElement=4). However the proposal's summary misnames the field (PanelChooseCallback
  is actually PanelCleared, used to dedup 'already fired' on re-entry), and 'attack/effect handle stored
  to oAIAttackVars_PanelChooseCallback on fire' is wrong; the field is a cleared flag, not a handle. The
  returned r0 from sub_80E3CF2 is stored into the *post-pop* r7+PanelCleared (not into the pre-pop r7+r6-callers'
  setup), so callers also must not rely on r7 surviving the bl.
