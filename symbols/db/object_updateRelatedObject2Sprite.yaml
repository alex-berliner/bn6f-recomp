name: object_updateRelatedObject2Sprite
address: '0x080E5700'
kind: function
status: probable
summary: Advances the sprite animation of the object reachable via this->RelatedObject1Ptr->RelatedObject2Ptr
  by calling object_updateSpriteTimestop on it if non-null.
interface: (r5 = battle object) -> r0 = result of object_updateSpriteTimestop; flags from that call
details: Takes the battle object in r5 and reads its RelatedObject1Ptr (oBattleObject_RelatedObject1Ptr),
  then from that object reads RelatedObject2Ptr. If the resulting pointer is non-null, it calls object_updateSpriteTimestop
  on it, advancing that linked object's sprite animation one frame unless paused or time-stopped. It is
  essentially a sprite-tick helper that redirects the update from the current object to a dependent/attached
  object. The r5 'this' convention is the standard battle-object calling convention.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]; ldr r5,[r0,#oBattleObject_RelatedObject2Ptr] —
    chains two related-object pointers to find the target; tst r5,r5; beq locret — skips the update when
    the linked object pointer is NULL; bl object_updateSpriteTimestop — sole call, so the only action
    is animating the target object's sprite; Called from sub_80E566C/sub_80E569C, wrapper objects that
    own a secondary linked object needing sprite updates
