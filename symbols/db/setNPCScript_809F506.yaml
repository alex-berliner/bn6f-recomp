name: setNPCScript_809F506
address: '0x0809F506'
kind: function
status: confirmed
summary: Assigns a new script/animation to an overworld NPC and clears its script-run state so it starts fresh.
interface: void npc_setAnimationScript(OverworldNPCObject *npc /*r5*/, const NPCScript *script /*r0*/)
details: 'Stores the script pointer (r0) into npc->AnimationScriptPtr and resets the NPC''s script-related state:
  TerminateScript_19 = 0, ChatTriggered = 0, TerminateScript_1f = 0, and UnkNPCScriptPtr_5c = 0. Callers pass the
  NPC in r5 (a fixed callee-saved register convention used by overworld object code) and the script pointer in r0;
  only r0, the NZ flags and lr are clobbered. This lets a running interaction swap an NPC''s dialogue/animation
  script mid-scene while guaranteeing the script interpreter re-enters the new script cleanly (no pending termination
  or chat flags carried over).

  '
