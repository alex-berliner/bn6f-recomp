    loc_812117A: ldr r1,[r4]; cmp r1,#-1 terminator; ldr r1,[off_81211D0,r1*?] dispatch table; bx r1 with
    r0=[r4,#4]; add r4,#8 shows fixed 8-byte records of (id, argument) pairs; called by reloadCurNaviBaseStats_8120df0
    and reloadCurNaviStatBoosts_813c3ac, which then heals HP to MaxHP, consistent with rebuilding navi
