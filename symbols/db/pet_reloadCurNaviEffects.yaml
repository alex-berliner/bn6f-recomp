name: pet_reloadCurNaviEffects
address: '0x08121154'
kind: function
status: probable
summary: Rebuilds the current PET navi's effect/stat-modifier list into the work area at 200DCF0 by zeroing
  it, looking up a per-navi effect table via GetCurPETNavi and a state-derived index, dispatching each
  8-byte {handlerId, argument} record (terminated by -1) through off_81211D0, then calling sub_8123208
  to recompute derived stats.
interface: (no args) -> r0 destroyed; clears work area at 200DCF0 and invokes effect handlers from a table
  before returning
details: 'First zero-fills the 0x30-byte work area at 200DCF0. Reads a value from the game-state object
  ([r10+0x40] field 0x30), gets the currently selected PET navi via GetCurPETNavi, and subtracts a per-navi
  base halfword from table byte_81211B4 to compute an index. Uses that navi index and remaining value
  to pick an entry from a nested table (pt_8121200 -> [ptr] -> [index*4]) — the navi''s effect list. It
  then walks 8-byte records {handlerId, argument}: a handlerId of -1 terminates, otherwise the function
  pointer at off_81211D0[handlerId] is called with the record''s second word in r0, likely writing stat/effect
  data into the cleared work area. Finally calls sub_8123208 (probably recomputing derived stats) before
  returning.'
