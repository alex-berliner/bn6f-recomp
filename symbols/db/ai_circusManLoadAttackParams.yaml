name: ai_circusManLoadAttackParams
address: '0x080FEBE4'
kind: function
status: confirmed
summary: Loads a CircusMan AI attack's version-dependent damage and attack-id pair from data tables and stores the
  packed pair into the battle object's AI attack variables.
interface: void ai_circusManLoadAttackParams(u32 attackIndex /* r0 */, u32 battleObject /* r5 */)
details: 'Called with r0 = attack index and r5 = battle object. For each of two tables it computes

  entryPtr = table + attackIndex*8 and calls battle_aiGetVersionedTableEntry_800FE12 with

  r0 = entryPtr and r5 = battleObject; that callee returns the entry''s first halfword in r0

  (and the second in r2, ignored here). Table byte_80FEC44 supplies the damage value; table

  byte_80FEC68 supplies a second value which is shifted left by 16 and OR-ed with the damage,

  forming the packed u32 damage | (value2 << 16). The result is stored to

  [battleObject+oBattleObject_AIDataPtr] + 0xA0 + oAIAttackVars_Damage, i.e. the AI attack

  variables'' Damage field of the object''s AI data. The versioned-table call suggests the

  values differ between the Falzar/Gregar game versions. r4 and r6 are scratch here (r4

  holds attackIndex across the calls, r6 accumulates the packed pair) and r5 must remain

  intact because it is re-read by the callee on each call.

  '
