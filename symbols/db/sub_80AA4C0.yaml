name: sub_80AA4C0
address: '0x080AA4C0'
kind: function
status: confirmed
summary: Attempts to select and initiate an overworld random encounter battle, returning a BattleSettings pointer
  or NULL.
interface: battle_tryEncounter_80AA4C0(void) -> BattleSettings* r0 (nz); uses r10 as toolkit context pointer; preserves
  r4-r7; clobbers r0-r3, r8-r9, r11-r12, lr
details: 'Called each overworld step (via r10 toolkit context). Gates on map group >= 0x80 (overworld) and an encounter-credit
  check (Unk_12 - Unk_14 >= 0x40 at S2001c04). Updates Unk_14 to the current step counter. Looks up a per-area encounter
  type byte from byte_8020CE4 indexed by (area << 4 | mapNumber); type 7 means no encounter. PET Navi stat 0x28
  nonzero forces type to 0. Selects a difficulty row from (Unk_12 >> 6) capped at 0x10, then does an RNG threshold
  roll against byte_8020C5C[row*8 + type] & 0x1F. If the roll fails, checks S2001c04 Unk_28 for a preset-battle
  shortcut (top byte of OptCurBattleDataPtr == 8). Otherwise calls sub_80AA5F4 with a difficulty hint (0x40 for
  first-position special, 0x20 for 1/12 RNG, or PET Navi stat 0x27, fallback 0x1F) to obtain BattleSettings. Stores
  the pointer at GameState_CurBattleDataPtr. Finally performs a power check: (PET Navi hword stat 0x3E + 4) / 5
  must not exceed BattleSettings unk01; if the player is overpowered, resets Unk_12/Unk_14 to zero and returns NULL
  to suppress the encounter.'
