name: ai_attackWaitObjectExpiry
address: '0x080EE532'
kind: function
status: probable
summary: AI attack step that waits ~5 frames while an attack object is active, then unlinks it and leaves
  the attack state.
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets/clears AttackElement, StepTimer, RelatedObject1Ptr,
  AIData_TempAttackObjectPtr
details: On first invocation (AttackElement == 0) it clears ObjectFlags1 bit 0x40 on the object, sets
  StepTimer = 5, and writes element/state id 4 into AttackElement so the setup branch is skipped on later
  frames. Every frame it decrements StepTimer; once it goes negative it nulls oBattleObject_RelatedObject1Ptr
  and the AI data's TempAttackObjectPtr, detaching the spawned attack object from both the owner and the
  AI, then calls object_exitAttackState to return to normal AI control. The 5-frame delay lets the attack
  object persist briefly before cleanup. Element 4 is a marker state rather than a real element, since
  no further use of the value is visible here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oAIAttackVars_AttackElement gates one-time setup, then mov r0,#4 strb stores the
    done-marker (asm lines 2-9); mov r0,#0x40 bl object_clearFlag clears a battle object flag during setup;
    StepTimer set to 5 and decremented each call, cleanup only on bge not taken (counter underflow); cleanup
    writes 0 to oBattleObject_RelatedObject1Ptr and [oAIData_TempAttackObjectPtr] before bl object_exitAttackState
