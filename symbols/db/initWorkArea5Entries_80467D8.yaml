name: initWorkArea5Entries_80467D8
address: '0x080467D8'
kind: function
status: confirmed
summary: Initializes the 0x1B8-byte work area at 0x2011860, zeroing it and giving each of its five 0x58-byte entries
  a default state byte and an index.
interface: void sub_80467D8(void); // no meaningful inputs; clobbers r0, r1, flags (r0 = 0x20, r1 = 0x1B8 on return);
  preserves r2-r7
details: 'Zero-fills 0x1B8 bytes at byte_2011860 (EWRAM) via ZeroFillByWord — exactly five entries of 0x58 bytes
  each. Then, for each of the five entries, sets byte at offset +2 to 0x20 (a default/"active" value reused for
  every entry) and byte at offset +3 to the entry''s index (0..4). The rest of each entry stays zeroed from the
  clear, so fields at +0/+1 and the 0x54 remaining bytes per entry are left as 0. This is a one-shot initialization
  of some five-slot subsystem state; the 0x58-byte stride and the small state/index header at +2/+3 look like a
  slot record layout, but no readers were examined to confirm which subsystem owns it. Trivial quirk: the returned
  r0/r1 and NZCV flags are leftovers from the loop (CMP 5 vs 5 → Z set, C set), not meaningful outputs.

  '
