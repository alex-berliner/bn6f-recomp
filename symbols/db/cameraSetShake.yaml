name: cameraSetShake
address: '0x080302B6'
kind: function
status: probable
summary: Stores the shake pattern index (r0) and duration in frames (r1) into the camera struct as halfwords,
  priming a camera shake applied by later camera-tick code.
interface: (r0 = shake index/pattern, r1 = shake duration in frames) -> r0 = unchanged; flags unchanged
details: Loads the toolkit's camera pointer (oToolkit_CameraPtr) from the r10-based toolkit struct and
  writes r0 to oCamera_ShakeIndex and r1 to oCamera_ShakeFrames as halfwords. It only primes the shake
  parameters; the actual per-frame shake offset is applied elsewhere by whatever ticks the camera. r0
  likely selects which of several shake magnitudes/patterns to use. No callee or return value; it is a
  plain setter.
