  detail: ldr r2,[r10,#oToolkit_CameraPtr] then strh r0,[r2,#oCamera_ShakeIndex] — writes shake selection
    into camera; strh r1,[r2,#oCamera_ShakeFrames] — writes the frame count, i.e. duration, not a coordinate;
    called from many route contexts in beastsp at 0x08014D70/0x08027624 etc., consistent with event-triggered
    screen shake
