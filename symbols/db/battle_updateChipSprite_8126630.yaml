name: battle_updateChipSprite_8126630
address: '0x08126630'
kind: function
status: confirmed
summary: Updates battle sprite frame tables, slot fields, and sprite position (id 0x2F at y=0x58) for
  a battle object whose type byte at +0xD selects either a per-kind frame-table path (kinds 0–3) or a
  slot-frame path (kind 4).
interface: 'in: r5 = battle object pointer; out: r3 r4 r5 r6 r7 (preserved through r4–r7; return not used);
  clobbers: nz c v r0 r1 r2 lr'
details: 'Reads kind = byte [r5+0xD]; routes on kind == 4 vs. 0..3.

  Path A (kind 0..3): calls getStructFrom2008450(0); bails if null. If the returned struct''s byte+1 is
  not 0x16, calls sub_8046696(3) and sub_80465A0(byte_8124AE0). Then loads a per-kind frame table pointer
  from off_81266C4 indexed by kind, forms entry_addr = r5 + 0xA*kind, frame = u16 [entry_addr+0x14] +
  u16 [entry_addr+0x18], val = u16 [table + (frame<<2)*2], and calls setFieldsInThreeTableEntries_811980C(val,
  0xFF, 0, 0). Followed by sprite_setPositionForIdRange3_8119854(0x2F, 0x58, 0) and sub_8126818(0).

  Path B (kind 4): again calls getStructFrom2008450(0); bails if null. If struct+1 != 0x1A, calls sub_80465A0(byte_8124B08).
  Uses dword_201FC20 as a table; frame = u16 [r5+0x3C] + u16 [r5+0x40]; val = u16 [table + (frame<<2)],
  extra = u8 [table + (frame<<2) + 3]; calls setSlotFieldsFromStartTo3_811A1F4(val, extra, 0, 0) and sprite_moveSlotGroupXY_811A220(0x2F,
  0x58, 0).

  Sprite id 0x2F at y=0x58 is hardcoded; both branches land on the same display sprite. Word tables in
  0x201Dxxx/0x201Fxxx look like per-frame animation/position records.

  '
