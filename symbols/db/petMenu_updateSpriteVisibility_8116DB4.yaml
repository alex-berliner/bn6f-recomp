name: petMenu_updateSpriteVisibility_8116DB4
address: '0x08116DB4'
kind: function
status: confirmed
summary: Updates a sprite object linked to the PET menu, showing/hiding it from the menu's substate and marking
  it done when the menu state reaches 8.
interface: void sub_8116DB4(spriteobj *r5 /* in r5, also reads r4/r7/lr per callers */)
details: 'Takes a sprite object in r5 (likely the MegaMan sprite shown on the PET screen) and syncs it to ePETMenuData.
  Reads ePETMenuData+4 (menu substate): if it equals 8 the sprite should be visible, so 1 or 0 is stored to object+0xC
  (visible flag). The previous value kept at object+0xD is compared; when the flag changed it stores the new value
  to +0xD and calls sprite_setAnimation(flag), sprite_loadAnimationData() and sprite_noShadow() to (re)start the
  animation cleanly. Then sprite_update() is called for the object. Finally it reads ePETMenuData+0 (menu main state);
  when it has reached 8 it writes 8 to object+0x9 to mark this sprite object as finished. Preserves r4, r5 and incoming
  r7 (r7 is used to hold the ePETMenuData pointer). r0-r3 and the nz/c/v flags are left as sprite_update/the final
  comparison left them, so callers appear to consume r0 as the menu state and its comparison-to-8 flags.

  '
