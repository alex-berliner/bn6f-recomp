open_questions:
- The first CopyWords(0x38 bytes) using r3 (held across the loop untouched) is presumably a chip-slot/folder
  state block copy; its exact meaning depends on what r2 points to in the caller. Disambiguating whether
  the 7×8-byte region is a packed "slot state + offset" or just eight bytes of icon-state per chip would
  settle it.
- Why r3 is preserved but unused inside the loop (instead of just being consumed up front) is unclear;
  it may be that the compiler materialized a callee-save register from a caller-known constant.
