open_questions:
- The exact semantic meaning of the magic-value ladder (r6 ranges paired with element r4 and r1 bits
- 1/2) - those are element/element-counter rules per the AI's element that allow or block the chip. The
- table at byte_8021369 thresholds are also opaque (presumably per-element level gates). Settling either
- would need cross-referencing with a sibling game's AI routine or known battle-AI documentation.
