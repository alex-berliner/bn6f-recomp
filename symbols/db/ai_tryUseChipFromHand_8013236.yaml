    before touching the chip DB; out-of-range IDs always return 0 via `mov r0,#0 ... pop {..,pc}` at loc_8013360.
    - `bl getChip8021DA8` and `ldrb r4, [r7,#6]`, `ldrb r1, [r7,#9]` show fields 6 and 9 of the chip record
    are read into r4 (chip element/type) and r1 (chip targeting flags). - `mov r1,#0x2c; bl GetBattleNaviStatsByte_AllianceFromBattleObject`
    reads the 0x2c NaviStats byte for the battle object''s alliance (CustomLevel, see navi_stats_struct
    at 0x2c). - All branches ending in `b loc_8013366` then `mov r0,#1 ... pop {..,pc}` show "allowed"
    is r0=1. - `bl battle_getObjectAllianceTeam_800F49E` returns the team-slot index used in the late
    threshold comparison `ldrb r0,[r4]; cmp r6,r0; bge loc_8013366`. - `ldr r4, off_80133E8 // =byte_8021369`
    plus the chained `add r4,#1/#2/#3` show byte_8021369 is a per-element threshold table for the alliance-team
    gate. - Caller summary for aiTrySelectChipFromHand_801336C confirms it calls this after checking'
