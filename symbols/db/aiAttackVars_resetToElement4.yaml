name: aiAttackVars_resetToElement4
address: '0x08106380'
kind: function
status: probable
summary: Resets an AI attack's variables, defaulting the element to 4 when none is set, then waits StepTimer
  ticks and stamps HitElement to 0x18.
interface: () -> void; uses r5 (battle object) and r7 (AI attack vars) from caller frame
details: If oAIAttackVars_AttackElement is zero, the function sets it to 4, writes 0xFFFF to oBattleObject_Z16
  on the object in r5 (sending it off-screen), and initializes oAIAttackVars_StepTimer to 0x1E. On subsequent
  calls it decrements StepTimer; when it hits zero, it sets oAIAttackVars_HitElement to 0x18 (a wind/elemental
  hit marker) and returns. The leaf return (pop {pc}) and absence of any register arguments indicate a
  tail-called inline action invoked from an AI attack's per-step handler.
