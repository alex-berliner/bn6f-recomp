name: clear_flags32_20093A4
address: '0x080071A4'
kind: function
status: confirmed
summary: Clears bits selected by a mask in the game-wide flags32 word.
interface: void flags32_clear_20093A4(u32 mask /* r0 */); returns updated word in r2
details: Loads the single game-wide 32-bit flag word at flags32_20093A4 (pointer at off_80071C8), clears every bit
  that is set in r0 via BIC, and stores the result back. The updated word is also left in r2 as a side output. The
  flag word is shared with the sibling setter/or functions that touch flags32_20093A4; callers use it to clear one
  or more game/event flags at once. Tail call via mov pc, lr; clobbers r1, r2 and NZ flags.
