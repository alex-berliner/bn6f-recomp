name: battleObject_initAppearOrEntryFromSide_80D2480
address: '0x080D2480'
kind: function
status: confirmed
summary: 'Initializes a battle object''s appear/side-entry animation: loads its wide entry sprite, offsets it off-screen
  by direction, assigns slide-in velocity, and plays the flash sound before transitioning to the update phase.'
interface: void battleObject_initAppearOrEntryFromSide_80D2480(void) /* r5 = battle object pointer; outputs r5 r8
  r9 r10 r11 r12 via shared state-transition tail-call */
details: 'Sets bit 1 (mask 0x02) of oObjectHeader_Flags to mark the object as in an appear/side-entry state. Loads
  a 0x80x0xC sprite from palette bank 0x44 via sprite_load, then resets the animation to frame 0 (oBattleObject_CurAnimAndCurAnimCopy)
  and uploads animation data. Queries sprite_hasShadow (result discarded). Inverts the object''s horizontal flip
  (object_getFlip ^ 1) to mirror the entry pose. Converts panel coordinates to pixels, then adds an X offset of
  0x40 * object_getFrontDirection (64 px per direction step) to oBattleObject_X16, placing the sprite at the screen
  edge. Sets oBattleObject_XVelocity to -dir * 0x80000 (opposite-facing, 16.16 fixed-point, giving a one-pixel-per-frame
  slide). Recomputes panel occupancy from the shifted coordinates. Writes 8 to oBattleObject_Timer for the appearance
  duration. Picks palette slot 1 if oBattleObject_Param1 is non-zero, otherwise slot 0. Plays SFX 0xB0 (appear/flash
  sound). Sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE and tail-calls sub_80D24F0
  (shared state-transition dispatcher) which returns the live register set.

  '
