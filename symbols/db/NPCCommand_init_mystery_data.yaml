name: NPCCommand_init_mystery_data
address: '0x0809F058'
kind: function
status: confirmed
summary: NPC script opcode that converts the current NPC into a mystery-data orb (or retires it when the data is
  already collected).
interface: void npc_cmd_initMysteryData_809f058(struct OverworldNPCObject* r5 /* npc */, const u8* r6 /* npc script
  */) /* returns new r6 */
details: 'Sets the NPC''s UnkFlags_60 chatbox bits (0x400|0x800) and "face player when

  interacted" flag. Reads the opcode''s halfword argument as the mystery-data

  id and stores it in Chatbox_90. Calls sub_809FC1C (lookup_mystery_data)

  which returns r0 = variant, r1 = flag_scale, r2 = position (three s16s).

  If variant == 0 the data was already collected: marks the object ACTIVE,

  queues a sprite load (0x80, 0x1C, 0xA0) plus animation data, frees the NPC

  and disables script 0x19, then returns the original r6 unchanged. Otherwise

  picks the orb''s PaletteIndex from byte_809F0E4 = {0xFF,0,0,2,2,1,3,0xFF}

  indexed by variant, ORs 0x40 * flag_scale into UnkFlags_60 (a flag bit

  whose source field is always 0), points the NPC at the shared

  TextScript873D108 with TextScriptIndex = 0xFF, copies the s16 x/y/z from

  md.position into fixed-point X/Y/Z, sets CollisionRadius = 4,

  CenterOffsetX = 2, CenterOffsetY = -2, and returns r6 + 3 (past the

  opcode and its halfword argument). r5 and r2 are left exactly as the

  original found them.

  '
