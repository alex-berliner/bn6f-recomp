open_questions:
- What OW_NPC_UNK_FLAGS_60 bit the 'flag bit the lookup scales' (0x40 * flag_scale) actually represents; the source
  field is always 0 so the OR is effectively a no-op in practice.
- Why the despawn path forces OBJECT_FLAG_ACTIVE before freeing (visually toggling the orb on for one frame?) and
  which sprite/animation 0x80/0x1C/0xA0 corresponds to.
- Why byte_809F0E4 starts and ends with 0xFF and what variant indices 1..7 map to in-game (the readable C treats
  variant 0 as 'collected'; the script may use other slots).
- Whether sub_809FC1C's three return values are in fact guaranteed by every caller or whether r1/r2 can be garbage
  when r0 == 0.
