- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh/strh on [r5,#oBattleObject_Timer2] with add #1: frame counter increment; cmp r0,#0xf /
    blt locret: action fires only once, after 15 ticks; strb r0(=0xC),[r5,#oBattleObject_Param3]: writes
    the expected next state byte; no callees and no stack use: pure field-update handler on the r5 object'
