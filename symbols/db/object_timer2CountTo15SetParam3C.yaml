name: object_timer2CountTo15SetParam3C
address: '0x080BDB8C'
kind: function
status: probable
summary: 'Per-frame tick for a battle object: counts Timer2 up, and once 15 frames have passed writes
  state value 0xC to Param3.'
interface: (r0 unused/r5 = battle object pointer) -> r0 = new Timer2 value; flags from cmp
details: Increments the object's oBattleObject_Timer2 halfword each call, evidently once per frame, and
  compares it to 15. While the count is below 15 it does nothing more; on the 15th frame it stores the
  byte 0xC into oBattleObject_Param3, which given the naming pattern is likely a state/step selector consumed
  by the object's dispatcher. r5 is not set up inside, so the caller must have the object pointer already
  in r5 (typical for these in-place object handlers). It preserves everything except r0 and the two object
  fields it touches.
