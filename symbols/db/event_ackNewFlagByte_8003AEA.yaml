name: event_ackNewFlagByte_8003AEA
address: '0x08003AEA'
kind: function
status: confirmed
summary: Clears the "new event pending" bit (bit 7) of the flag byte at eStruct2001010 so the event no longer reads
  as fresh.
interface: void event_ackNewFlagByte(void); // reads/writes the byte at eStruct2001010; returns r1 = 0x7f and sets
  nz flags from the masked byte
details: 'Loads the byte at eStruct2001010, masks it with 0x7f (clearing bit 7), and stores it back. Bit 7 evidently
  marks an event/flag as "new" or pending; acknowledging it removes that marker while preserving the low 7 bits
  of the state. As a side effect r1 is left holding the mask 0x7f and the nz flags reflect the written value, but
  these are almost certainly incidental, not a real return value. r4-r7 are pushed and popped but never used, so
  callers need not pass anything meaningful in them.

  '
