name: npc_StateModeDispatcher_8119364
address: '0x08119364'
kind: function
status: confirmed
summary: Dispatches the state-machine object in r5 to one of three per-state handlers based on the mode byte at
  [r5+8], tail-chaining the handler's return straight back to the caller.
interface: Next sub_8119364(void)  // r5 = state object pointer; all registers/flags pass through to the selected
  handler and back out
details: 'Tail-dispatch wrapper for a small state machine. Reads the byte at [r5+8] and uses it directly (unmasked)
  as a byte offset into the handler table at off_8119378, so valid mode values are 0, 4 and 8 rather than 0..2.
  The chosen handler (sub_8119384 / sub_81196A0 / sub_8119804) is entered via `mov lr, pc; bx r0` with LR pointing
  at this function''s trailing `pop {pc}`, so when the handler returns it pops straight back to this function''s
  caller; the dispatcher itself is invisible on return. The handler receives r0 = its own table entry (Thumb address)
  and r1 = the mode byte, with r2..r12 and the NZCV flags untouched. Any other mode byte would jump through a garbage
  pointer — no bounds check exists.

  '
