name: battle_initBigEnemyHpAndHidePanels
address: '0x08105554'
kind: function
status: probable
summary: 'Battle enemy init: sets HP/MaxHP from a difficulty-tier table, sets animation 20, allocates
  extra vars, and reserves+hides a 3x3 block of panels on the object''s side.'
interface: (r0 = AI data ptr for battle_getAiDifficultyTier; r5 = battle object) -> r0 = ?; no meaningful
  return
details: 'Reads the enemy AI difficulty tier (0-2, AI data v4 only) and indexes byte_81055CC, writing
  the halfword HP (2000/2800/3200) into both oBattleObject_HP and oBattleObject_MaxHP. Sets oBattleObject_CurAnim
  to 0x14 and runs sprite_setAnimation + sprite_loadAnimationData. Calls sub_80E8F78 (allocator-like,
  returns a pointer) storing it in oBattleObject_ExtraVars. Then loops 3 times over byte_81055C0 + alliance*3,
  and for each byte (panel column: 3,2,1 for alliance 0; 4,5,6 for alliance 1) calls object_reservePanel
  and object_hidePanel for rows 1,2,3 — i.e. it occupies and hides a 3x3 panel area whose columns depend
  on which side the object is on.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_getAiDifficultyTier_800FE36 then ldrh from byte_81055CC writes oBattleObject_HP/MaxHP
    (tier-scaled HP: 0x7D0/0xAF0/0xC80); mov r0,#0x14; strb [r5,#oBattleObject_CurAnim]; bl sprite_setAnimation/sprite_loadAnimationData
    — sets anim 20 and loads sprite data; loop over byte_81055C0[alliance*3 + i] with rows r1=1..3 calling
    object_reservePanel then object_hidePanel — reserves/hides 3x3 panels; byte_81055C0 = {3,2,1, 4,5,6}
    — columns for alliance 0 vs 1, showing side-dependent 3-wide panel block; str r0,[r5,#oBattleObject_ExtraVars]
    after bl sub_80E8F78 — stores per-object state pointer'
