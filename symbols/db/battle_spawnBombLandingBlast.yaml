name: battle_spawnBombLandingBlast
address: '0x080D5EDE'
kind: function
status: probable
summary: Spawns the bomb's lingering explosion hitbox on the panel where the lobbed bomb lands.
interface: (r5 = battle object) -> r0 = spawned collision region (or 0); sets its oBattleObject_Timer
  to 5
details: Reads the bomb's PanelX, PanelY and Element and passes them to object_spawnCollisionRegion as
  the position/element of a new collision-region battle object. It forwards the bomb's DamageAndStaminaDamageCounterDisabler
  field (r6) as the new object's damage data, passes r4=0xA050101 (flag/damage descriptor constant) and
  r7=3 (likely team/owner side), and r3=0. If a region was successfully spawned, it initializes the new
  object's Timer field to 5, giving the blast a short lifetime on the panel; if spawning fails it just
  returns.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element then bl object_spawnCollisionRegion (asm
    lines 2-11); ldr r6, [r5,#oBattleObject_DamageAndStaminaDamageCounterDisabler] forwards the bomb's
    damage data to the spawned region; mov r1,#5; strh r1,[r0,#oBattleObject_Timer] gives the spawned
    blast a 5-frame lifetime; sole caller battle_lobbedBombUpdate is the lobbed-bomb state handler that
    arcs the bomb to a panel and explodes there
