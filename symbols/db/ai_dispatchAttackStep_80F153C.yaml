name: ai_dispatchAttackStep_80F153C
address: '0x080F153C'
kind: function
status: confirmed
summary: AI attack step dispatcher - reads the current attack-phase byte from the AI attack-vars block
  and jumps to the matching handler (start-attack or wait-for-attack-end).
interface: void ai_dispatchAttackStep(u32 passR3, u32 passR5, u32 passR6, AIAttackVars* vars /* r7 */);
  outputs r1 r5 r8-r12 come from the selected handler, flags and r0-r4/r6/lr clobbered
details: 'Tiny trampoline for the AI''s attack sequence. The pointer to the AI attack-vars block is expected
  in r7; the byte at offset oAIAttackVars_Unk_00 (named oAIAttackVars_HitElement in the asm listing) is
  used as a routine selector, not an element id, despite its field name. The selector indexes the 2-entry
  table at off_80F1550: entry 0 -> sub_80F1558 (begin/step the attack), entry 1 -> ai_attackWaitEnd (wait
  until the attack finishes). Before the branch, r0 is loaded with the selector byte and r1 with the table
  entry itself (the handler''s own address, thumb bit set), so handlers receive their address as an argument;
  the ''mov lr, pc / bx r1'' pair makes the handler return back into this stub. r3, r5 and r6 are passed
  through untouched to the handler. r7 is pushed before the call and popped after, so the vars pointer
  survives whatever the handler does to r7; the handler''s results stay in guest registers (r1, r5, r8-r12)
  and are returned as-is to sub_80F153C''s caller.

  '
