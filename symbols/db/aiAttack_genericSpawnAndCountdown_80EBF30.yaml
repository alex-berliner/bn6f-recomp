name: aiAttack_genericSpawnAndCountdown_80EBF30
address: '0x080EBF30'
kind: function
status: confirmed
summary: 'Per-tick update for an AI attack state: on the first tick plays an animation, spawns the attack object
  from the AI''s attack data, then counts a timer down and returns the AI to state 4 when it expires.'
interface: void sub_80EBF30(u32 r4_owner, u32 r5_ownerObj, u32 r7_state /* oAIAttackVars */); callers also pass
  r3, r6, r10, lr which are ignored/unused; returns flags nz/c/v and r0-r3 which callers ignore
details: "State handler for one step of an AI-controlled enemy attack. r7 points at the\noAIAttackVars state block\
  \ attached to the attacking battle object (r4/r5 hold the\nowning object; r5 is used to fetch oBattleObject_AIDataPtr).\n\
  \nOn the first tick (byte at Unk_01 == 0):\n  - sets the object's animation to id 10 and gives it its default\
  \ counter time\n    (object_setAnimation returns the object which is fed to object_setDefaultCounterTime);\n \
  \ - spawns the actual attack projectile via spawn_t1_0x5_tempAttackObject_80B8E30 with\n    attack id 0xD in r4\
  \ and r7 = AI data pointer + 0x68 as the parameter block (the\n    attack's stats live at offset 0x68 inside the\
  \ enemy's AI data);\n  - sets object flag bit 22 via object_setFlag1 (1 << OBJECT_FLAGS_UNK_BIT_22_BIT);\n  -\
  \ marks the attack as started by storing 4 into byte Unk_01;\n  - stores 1 into halfword Unk_10, giving the attack\
  \ a single remaining tick.\n\nOn every tick (including the first): decrements halfword Unk_10; when the value\n\
  goes negative (timer 1 - 1 = 0 is fine, only < 0 ends it), stores 4 into halfword\nUnk_00, switching the AI's\
  \ attack-state machine back to state 4.\n\nQuirks: with Unk_10 initialized to 1 the attack ends on the very next\
  \ tick after\nthe spawn tick. The flag-setting on bit 22 and the meaning of state value 4 are\nnot documented\
  \ by existing game.h macros. Only r4-r7 and lr are preserved; the\nreturn flags are left over from the decrement/state\
  \ store and callers ignore them.\n"
