name: table_findFirstOccupiedEntry_8028050
address: '0x08028050'
kind: function
status: confirmed
summary: Scans a table of 12-byte entries for the first one whose leading byte is not the empty marker 0x0A/0x0B,
  and stores its index (or 0x0A if none) into record+7.
interface: void sub_8028050(u8 *cursor /*r4*/, u8 *record /*r5*/); tailcalls r6, preserved r4/r6, clobbers flags
  and r0
details: 'Walks a fixed-size table pointed to by r4 whose entries are 12 bytes each (0xC stride). The first byte
  of an entry is a tag: 0x0A or 0x0B means the slot is free/unused, anything else marks an occupied slot and ends
  the scan. The index of the first occupied slot (0..0xB) is written to byte 7 of the record at r5; if all 12 slots
  (loop counter capped at 0xC) come back empty, the sentinel value 0x0A is written instead. Despite r4/r6 being
  listed as callee-saved inputs/outputs, the scratch cursor and slot counter live in the pushed locals, so r4 and
  r6 are unchanged across the call and only r5''s record field is a real output. No flags are returned. Likely used
  to allocate/locate a record slot (mail, chip, or similar small record list) elsewhere in the game''s save/UI data.

  '
