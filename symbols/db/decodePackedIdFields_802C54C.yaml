name: decodePackedIdFields_802C54C
address: '0x0802C54C'
kind: function
status: confirmed
summary: Decodes a packed 16-bit ID into a 2-bit group plus index/sub-index fields, treating 0xFFFF as a 'none'
  sentinel.
interface: 'Next sub_802C54C(u32 packedId) /* r0 in: packed id; r0 out: group (0-3, or 0xFF for sentinel), r1 out:
  low field, r2 out: middle field (group 0 only); clobbers nzcv */'
details: 'Splits a packed 16-bit value into fields. Top two bits (14-15) select a group: group 0 returns the low
  9 bits (r1) and bits 9-13 (r2, a five-bit middle field), groups 1-3 return the low 14 bits in r1 and leave r2
  untouched. Any group >= 3 collapses to 3, so the group value is effectively saturating. A packed value of 0xFFFF
  is a special sentinel: it returns 0xFF in r0 and passes 0xFFFF through in r1, with r2 untouched. Pure arithmetic/tailcall
  (mov pc, lr); no memory or game state is touched. The exact game meaning of the fields is not evident from the
  function itself; callers would show whether this unpacks e.g. item, flag, or object IDs (group 0 having an extra
  subfield suggests two ID classes sharing one 16-bit space).

  '
