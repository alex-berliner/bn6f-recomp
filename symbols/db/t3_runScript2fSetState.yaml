name: t3_runScript2fSetState
address: '0x0812B590'
kind: function
status: probable
summary: Plays text script 0x2f from archive eTextScript201BA20 in the chatbox, then advances the caller's
  state struct.
interface: (r0 = unused entry value, r5 = state struct pointer from caller) -> r0 = script-run result;
  writes [r5+1]=0x3C, [r5+2]=4, [r5+0x10]=5
details: 'The function first calls sub_812B574 (unknown, likely per-step setup/condition check), then
  invokes the known chatbox wrapper to run script index 0x2f of the eTextScript201BA20 archive. After
  the script runs it writes three constant bytes into the struct at r5: 0x3C (60) at offset 1, 4 at offset
  2, and 5 at offset 0x10. This pattern of ''run one script entry then stamp fixed bytes'' matches a dialog/cutscene
  state-machine step where the bytes set the next script index/step and a timer or mode. r5 is never set
  inside the function, so it is supplied by the caller sub_812A1D4, which likely is the surrounding sequencer.'
