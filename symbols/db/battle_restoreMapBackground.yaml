name: battle_restoreMapBackground
address: '0x0812ED94'
kind: function
status: probable
summary: Reloads the full-screen map background tilemap from unk_201E920 into tile block 1, zeroes the BG tile buffer,
  resets the battle-overlay scene record array, and invokes several overlay helpers using a value read from the
  caller's r5 struct.
interface: () -> void; caller's r5 preserved via r7 round-trip
details: 'Zero-fills the toolkit''s 0x2000-byte BG tile buffer, then re-runs the battle-overlay scene record reset
  (battle_resetEStructRecords_8046664). It copies a full 30x20 (i_size=0x1e, j_size=0x14) tilemap from unk_201E920
  into tile block 1 at (0,0) via CopyBackgroundTiles, covering the whole screen. It then calls several local helpers:
  sub_812EB92, sub_812EC2C twice with (value,0,4) — once with [r5,#0x2a] and once with 0x90 — plus sub_812EDFC(0),
  loc_812EE38(0) and sub_812EBB8. The value 0x2a read from the caller''s r5 struct is passed on, so the caller''s
  structure drives part of the reload. Quirk: r5 is never set locally — the entry ''mov r7,r5'' snapshots whatever
  r5 the caller left, so the function silently depends on caller state.'
