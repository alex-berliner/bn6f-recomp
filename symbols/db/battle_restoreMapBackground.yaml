    matches the proposal in most details: it zeroes the BG buffer, resets the scene records, copies the 30x20 tilemap
    from unk_201E920 into tile block 1 at (0,0), then calls sub_812EB92, sub_812EC2C (with [r5,#0x2a]), sub_812EDFC(0),
