- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_resetEStructRecords_8046664 re-inits the battle-overlay eStructArr2008450 scene records; CopyBackgroundTiles(0,0,1,unk_201E920,0x1e,0x14)
    writes a full-screen tilemap to BG tile block 1; ZeroFillGFX30025c0 clears the 0x2000-byte BG tile buffer before
    the copy; ldrh r0,[r5,#0x2a] then bl sub_812EC2C passes a caller-struct field into a local helper; only caller
    sub_812DD2C is itself undocumented, so no caller-side confirmation
