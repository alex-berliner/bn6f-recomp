name: ow_player_updateCoords_809C7FC
address: '0x0809C7FC'
kind: function
status: confirmed
summary: Per-frame overworld player-object callback that pushes the player's three coordinate words through the
  shared copy-to-next/write-back coordinate helper.
interface: void sub_809C7FC(u32 player /*r5*/, u32 r10, u32 lr); returns r0=0 (clobber, callers ignore), leaves
  r2-r4,r5,r7 as the callee helper's leftovers, sets flags NZ from 0; preserves r4-r7
details: 'A tiny overworld-object wrapper. r5 is the player object; the word at

  obj+0x70 is a pointer to the object''s coordinate block. It loads the

  block''s three words (offsets +0, +4, +8 — presumably x, y, and a

  height/layer or facing field) into r0-r2 and tail-calls

  owPlayer_copyCoordsToNextCoordsWritePlayerCoordsThenIndirectlySetPlayerCoordsMaybe_809e188,

  the shared helper that copies the current coords to the "next" coords,

  writes the player coords back, and re-applies them through its own

  indirection. On return it sets r0=0 and returns; the mov r0,#0 also

  clears N and sets Z, which is the only caller-visible effect the code

  itself produces (r2-r5/r7 leftovers come from the helper). Since

  push/pop {r4-r7} is only there to hold lr, r4-r7 are effectively

  preserved end-to-end.

  '
