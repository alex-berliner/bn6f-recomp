name: sub_80E1AB4
address: '0x080E1AB4'
kind: function
status: confirmed
summary: Initialize a battle object's sprite when it transitions into its action state (set position, load tile/animation
  0x0E, palette 0, sync flip, mark phase as update).
interface: void sub_80E1AB4(BattleObject *r5);  // r5 = battle object pointer (in/out, preserved)
details: "Called as the action-state initialization thunk for a battle object. Sequence:\n  1) Snap the object's\
  \ sprite position to its current panel coordinates via object_setCoordinatesFromPanels.\n  2) Clear the object's\
  \ Z16 (oBattleObject_Z16) to 0.\n  3) Load sprite tile data at offset 0x80 with sub-tile args (8, 0xC) via sprite_load,\
  \ then sprite_loadAnimationData and sprite_noShadow.\n  4) OR= 0x02 into oObjectHeader_Flags (presumably \"initialized/sprite-loaded\"\
  \ bit).\n  5) Set the current animation to 0x0E in both oBattleObject_CurAnim and the backing oBattleObject_CurAnimCopy\
  \ slot, then call sprite_setAnimation and sprite_loadAnimationData.\n  6) Apply palette 0 (sprite_setPalette 0),\
  \ then mirror the object's facing into the sprite via object_getFlip -> sprite_setFlip.\n  7) Write the CUR_STATE_UPDATE\
  \ marker into oBattleObject_CurStateActionPhaseAndPhaseInitialized so subsequent ticks take the update branch.\n\
  The CUR_STATE_UPDATE constant name follows the project's enum for battle-object state-action phases.\nTouched\
  \ fields: oBattleObject_Z16, oObjectHeader_Flags, oBattleObject_CurAnim, oBattleObject_CurAnimCopy, oBattleObject_CurStateActionPhaseAndPhaseInitialized.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
