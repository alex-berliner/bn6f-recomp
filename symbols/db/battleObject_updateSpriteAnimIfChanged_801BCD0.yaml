open_questions:
- Whether the CurAnim path (when different) is supposed to load animation data itself; the
- code clearly calls both sprite_setAnimation then sprite_loadAnimationData, so semantics look
- final, but a future caller wanting "set anim but don't reload yet" can't be expressed here.
- Settled already by callee contracts.
