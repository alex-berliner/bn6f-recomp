name: battleObject_updateSpriteAnimIfChanged_801BCD0
address: '0x0801BCD0'
kind: function
previous_names:
- sub_801BCD0
status: probable
summary: Refreshes a battle object's sprite animation index whenever CurAnim changes, then ticks the sprite
  one frame.
interface: (r5 = BattleObject* this, lr = return) -> (r0, r1, r2, r3 clobbered; r4, r5, lr preserved for
  tail-call; void return)
details: "Reads the object's ObjectHeader.Flags byte at oBattleObject+0 (well-known start of the\n  embedded\
  \ object_header_struct); if OBJECT_FLAG_STOP_SPRITE_UPDATE (bit 0x8) is set the\n  function returns\
  \ immediately without touching the sprite.\n  Otherwise it compares the object's current animation byte\
  \ (CurAnim at +0x10) with the\n  cached copy (CurAnimCopy at +0x11). If they differ, it calls sprite_setAnimation(r0=CurAnim),\n\
  \  then sprite_loadAnimationData() to (re)load frames for the new anim, and finally stores\n  CurAnim\
  \ back into CurAnimCopy to mark the change consumed.\n  When the animation does not change (or was just\
  \ changed), it tail-calls sprite_update() to\n  advance the active sprite one frame.\n  Notable: the\
  \ same sprite_update() runs unconditionally when not STOP_SPRITE_UPDATE, including\n  the equal-CurAnim\
  \ path; the flag check is the only early-out.\n  Called from battleObject_updateSprite_80C4484, battle_EndObjectCurrentAnim_80C44D2,\
  \ and\n  several generic per-object update loops (sub_8014A38, sub_802D714, sub_802D926, sub_80C464C,\n\
  \  t4_0x3c_80E4A1C); consistent with a per-frame battle-object sprite tick.\n"
