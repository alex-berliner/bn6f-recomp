name: battle_dispatchActorHandlerByType_800F35C
address: '0x0800F35C'
kind: function
status: confirmed
summary: Dispatches an actor to its type-specific AI/behavior handler table entry (virus, navi, or player) via a
  shared dispatch helper.
interface: void sub_800F35C(void); // r0-r1 in = passed through to dispatched handler, r2-r12 out = whatever the
  dispatched handler leaves
details: 'One-line thunk: loads the address of dispatch table off_800F36C into R0 and tail-calls indexByActorTypeAndAIIdxThenDispatch_800F420,
  which reads the actor''s type (and AI index) and jumps to the matching handler. The table has three entries: off_8109250
  (virus handlers), off_80F2604 (navi handlers), and off_80EA9A0 (player handlers). R0/R1 are consumed by the helper;
  everything else is passed through untouched, so the caller sees the dispatched handler''s results in R2-R12. The
  helper presumably takes the actor in R1 or reads it from globals - the caller contract here shows no meaningful
  inputs beyond the pass-through registers.

  '
