name: petNaviTryGiveElementFolder_8120D10
address: '0x08120D10'
kind: function
status: probable
summary: Decides whether to grant the folder with element 0x22 to the current PET Navi based on chip-count-vs-stat
  thresholds, manages folder-slot availability, and records the outcome in the Navi's stat byte 0x2D.
interface: u32 petNaviTryGiveElementFolder_8120D10(r0 = pendingRequestFlag, r10 = toolkitPtr) -> r1 =
  actionCode {nz}, clobbers r0 r2 r3; preserves r4-r7
details: "Gets the active PET Navi via GetCurPETNavi. Compares the count of Water-element (1)\nchips in\
  \ the Navi folder (via countNaviFolderChipsWithElement_8120AE8) against the\nNavi stat byte at index\
  \ 0x0B; if chips exceed stat, proceeds. Otherwise repeats for\nFire-element (2) chips vs stat byte 0x0C.\
  \ If neither threshold is exceeded the function\nreturns 0 (no action).\n\nWhen a threshold is exceeded,\
  \ field5 of the struct pointed to by toolkit S2001c04_Ptr\n(offset 0x05) is inspected as a folder-slot\
  \ usage counter for element 0x22:\n  - If usage == 1 (slot header only): folder 0x22 is given directly\
  \ via GiveFolder,\n    action = 0x10, and Navi stat 0x2D is set to usage-1.\n  - Else queries isFolderSlotInUse_81377EC\
  \ for folder 0x22:\n      - slot >= 3: give directly, action = 0x10.\n      - slot < 3 and pendingRequestFlag\
  \ (original r0) != 0: defer, set stat 0x2D to slot value, action stays 0xF.\n      - slot < 3 and pendingRequestFlag\
  \ == 0: attempt a folder-swap via sub_8137890\n        and sub_8120DAC; on success give the folder (action\
  \ = 0x11), on failure\n        record slot in stat 0x2D (action stays 0xF).\n\nAlways writes the final\
  \ stat byte at index 0x2D via SetCurPETNaviStatsByte before\nreturning. Action codes: 0 = skip, 0xF\
  \ = pending/deferred, 0x10 = given directly,\n0x11 = given after slot swap. r10 is read by the caller\
  \ but never written back;\nr4-r7 are saved/restored across the call.\n"
