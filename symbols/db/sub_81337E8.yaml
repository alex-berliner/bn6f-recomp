name: sub_81337E8
address: '0x081337E8'
kind: function
status: confirmed
summary: 'Per-frame update of the submenu scene object: dispatches flow handlers when open, triggers close-out dialog
  when closed, and refreshes layout and button groups.'
interface: void submenu_tick_81337E8(u32 r2, u32 r4, u32 objectPtr /*r5*/, u32 toolkit /*r10*/) -> modifies r5,
  r8, r9, r12; preserves r7, r10
details: "r5 is the submenu scene object (state bytes at +1, +2). r10 is the Toolkit pointer\n(used to read oToolkit_JoypadPtr\
  \ → oJoypad_LowSensitivityHeld).\n\nWhen the submenu is open (submenu_isOpen_81355D8 returns Z):\n  Chains three\
  \ flow-handler calls (sub_8133BB4, sub_8133C0C, sub_8134A3C); each\n  must return Z to fall through to the select-press\
  \ path. In select-press path:\n    1. chatbox_selectPress_8133C58 confirms the highlighted entry.\n    2. Probes\
  \ held Start/A/B via sub_811F7F8 (reads joypad low-sensitivity bits from\n       toolkit); if a button is held,\
  \ skips commit.\n    3. If no button held and submenu still open, checks folder-edit arrows via\n       checkLeftRightInputForFolderEdit_8133E3C(3).\
  \ On arrow press:\n       object_saveStateAndSetState8_8133E7C persists state, then\n       entity_setLookupEntryStateFromFlag_8117D10(1,\
  \ 3) updates the target entity.\n\nWhen the submenu is closed:\n  If sSubmenu.unk_02 != 0x24 and (sSubmenu.unk_1B\
  \ & 0x40) == 0, presses Start/B/A\n  set object state byte +1 = 0x10, +2 = 0, runs eTextScript2028A20 script 0x17\
  \ via\n  chatbox_runScript_803FD9C, and plays SOUND_UNSELECT_7B (0x7B).\n\nCommon tail (always reached): refreshes\
  \ submenu layout (sub_81341A0), clears BG if\nclosed (submenu_clearBgIfClosed_8134594), updates two windowed button\
  \ groups\n(sub_81353DC, sub_81353F0 with indices 5/0 and 6/1).\n\nsSubmenu (0x2009a30) is the global submenu state\
  \ block; fields unk_02 (mode) and\nunk_1B (flags, bit 6 gates close-out dialog).\n"
