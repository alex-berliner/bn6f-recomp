name: spawn_jitteredEffectAtPanel
address: '0x080E9FBC'
kind: function
status: probable
summary: Spawns a type-0 effect object at a random jittered pixel position around the caller object's
  panel coordinates.
interface: (r5 = battle object; reads oBattleObject_Param1/Param2 as panel col/row) -> r0 = spawned effect
  object pointer; destroys r0-r3
details: 'Reads the battle object''s Param1/Param2 panel column/row and converts them to 16.16 fixed-point
  screen coordinates via object_getCoordinatesForPanels. Draws two values from GetPositiveSignedRNG: the
  first masked to 0x1F and randomly negated is added to x, the second masked to 0xF and randomly negated
  is added to a base of 0x14<<16 (20.0) for y; both axes then get 0x100000 (1.0) added (the dword_80EA00C
  constant). It calls spawn_t1_0x0_EffectObject with r4 = 0x21 (z/height parameter) to spawn the effect.
  Net effect: a visual particle placed at panel x ±(0..31), y = panelY+16 ±(0..15) — a random scatter
  around the panel, typical of debris/spark effects from an area attack.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_Param1]/Param2 then bl object_getCoordinatesForPanels: source position
    is the object''s panel coords; two bl GetPositiveSignedRNG calls with and 0x1F / and 0xF and bcs-negate:
    random signed jitter for x and y; mov r3,#0x14 lsl 16 and ldr r4,dword_80EA00C=0x100000 add r2/r3:
    fixed 16.16 offsets (+20 base y, +1 both axes); mov r4,#0x21; bl spawn_t1_0x0_EffectObject: spawns
    effect object type 0 with arg 0x21 and returns its pointer'
