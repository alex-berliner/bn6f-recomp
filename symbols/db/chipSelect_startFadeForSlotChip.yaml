name: chipSelect_startFadeForSlotChip
address: '0x0802A33E'
kind: function
status: probable
summary: On the chip-select screen, starts a two-part screen fade transition unless the chip in the selected
  regular/custom slot has attribute bit 0x20, then resets the state struct's fade sequence index and writes
  0xC to JumpOffset12.
interface: (r0 = chipSelect state struct S20364C0 (r5 in caller, unused directly except via fields)) ->
  r0 = clobbered; writes FadeSeqIndex=0 and JumpOffset12=0xC when fade is started
details: 'Reads the chip pending in the currently selected slot via chipSelect_selectedSlotChipHasAttr20_802A394;
  if that chip has ChipData attribute bit 0x20 set, the routine exits immediately without touching anything.
  Otherwise it issues two SetScreenFade calls — color/index 0x50 and 0x58, both with parameter 0xA (likely
  duration or fade step) — which together perform the screen fade animation. It then resets the struct''s
  fade sequence index (oS20364C0_FadeSeqIndex) to 0 and stores 0xC into oS20364C0_JumpOffset12, presumably
  to advance the chip-select screen''s sequence/state machine into its fading state. The attr-0x20 check
  acts as a skip condition, so chips with that bit (likely special/Mega-class or fade-exempt chips) don''t
  trigger the transition. The struct comment (self: * S20364C0) indicates r5 holds the screen-state pointer
  in callers.'
