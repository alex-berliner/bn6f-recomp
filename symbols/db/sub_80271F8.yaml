summary: 'Shuffle-once state machine step: dispatches on S20364C0+2 to sub_802721C (state 0: initial shuffle) or
  sub_802723A (state 4: ticking shuffles + finish), then sub_8029C08 and sub_802899C.'
details: 'Body (asm03_0.s:1882-1900): r1 = off_8027214[[r5+2]] long-called, then sub_8029C08(self), sub_802899C.
  sub_802721C zeroes S20364C0+0x40, calls sub_8029788 (the snapshot shuffle into word_2036660), marks active chip
  8''s enabled byte 2, runs customScreen_ExitSequence_8028E32 and sets +2 = 4. sub_802723A increments +0x40; every
  4th tick (count>>2 < 8) calls sub_8029688 (another in-place secondary shuffle), else sub_802983C (write word_2036660
  back into eBattleFolder), decrements the slot-8 chip''s count (removing it at 0), calls sub_8028476 and ends with
  state 1.'
