name: sub_81339BC
address: '0x081339BC'
kind: function
status: confirmed
summary: Per-frame update for a PET/Navi state object that drives the entity pipeline, and during screen fades refreshes
  the current PET/Navi's stats from the state struct and resets its header.
interface: 'void petNavi_perFrameUpdate_81339BC(u32 state /* r5 */);

  // trashes r0-r4, r6, r8, r9, r10-r12, lr; flags nzcv; returns via pop {pc}

  '
details: "Called with the state-struct pointer in r5.\nAlways: calls sub_81340FC, entity_runAllUpdateHandlers_80465BC,\
  \ sub_80465F8,\nthen IsScreenFadeActive. If the fade is not active it jumps straight to the\ntail pipeline (sub_8134594,\
  \ sub_8134538, sub_81345B0, sub_8134548) and\nreturns.\n\nWhile the screen fade IS active:\n  - sub_8046664, zeroFill_e2002230,\
  \ timer_setNoTimeout_8137700 reset\n    rendering scratch and timers.\n  - sub_81206C4(unk_202A3E0), sub_8120740(state[0xC]),\n\
  \    sub_81206F8(word_202A020, state[0xC]) push the current navi index into\n    some render/config slots.\n \
  \ - If state[2] (a \"no sync\" flag) is zero:\n      * SetCurPETNaviStatsByte(state[0x14], state[0xC]+0x2E, state[0x1C])\n\
  \        copies a half-word stat to slot 0x2E + navi.\n      * Loop r4 = 0x5C..0x60 step 4, r6 = 0x56..0x57 step\
  \ 1, doing\n        SetCurPETNaviStatsByte(state[0x14], (state[0xC]<<1)+r6, state[r4])\n        to copy two word-sized\
  \ stats into byte slots 0x56/0x57 of the navi's\n        stats block (one stats byte per word, keyed by navi index).\n\
  \  - Finally resets the small header: state[0] = 0, state[1] = 0xC,\n    state[2] = 0, then runs the same tail\
  \ pipeline.\n\nStructures touched: an unnamed state struct (r5) with byte fields at +0,\n+2, +0xC, +0x14, a half-word\
  \ at +0x1C, and words at +0x5C..+0x60; the\ncurrent PET/Navi stats block via SetCurPETNaviStatsByte using offsets\n\
  0x2E+navi and 0x56+(navi<<1)/0x57+(navi<<1); globals unk_202A3E0 and\nword_202A020.\n\nQuirks: the loop runs one\
  \ extra iteration past 0x5C (inclusive up to\n0x60), so two stats bytes (0x56, 0x57) are written, not just one.\n\
  The function tail-call returns via `pop {pc}`.\n"
