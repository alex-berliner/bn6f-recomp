name: sprite_updateWrapper_8118F14
address: '0x08118F14'
kind: function
status: confirmed
summary: Trivial wrapper that tail-invokes sprite_update on the object pointer passed in r5 and returns
  its results unchanged.
interface: 'void sprite_updateWrapper(u32 object /* r5 */) — but it is a pure passthrough: r0-r5 and the
  NZCV flags as sprite_update leaves them are all returned to its caller.'
details: 'The function does nothing on its own: it pushes lr, BLs sprite_update (which receives the

  caller''s r5 untouched — an object/sprite pointer per the wrapper''s naming), then pops pc to

  return. Because sprite_update is called with BL and the wrapper returns via pop {pc}, every

  register and flag the callee leaves in place (r0-r3 outputs, clobbered r0/r1, NZCV) flows

  straight through to the wrapper''s own caller; r4 and r5 are preserved by the callee. This is

  effectively an adapter/thunk so some caller can indirect through this address to sprite_update.

  '
