name: battle_finishObjectPhase_80E3950
address: '0x080E3950'
kind: function
status: confirmed
summary: When a battle object's current phase has finished initializing, marks it with action 8 (phase
  done) and resets its phase counter for the next phase.
interface: void battle_finishObjectPhase_80E3950(BattleObject *obj /* r5 */)
details: 'Takes the battle object in r5 and checks oBattleObject_PhaseInitialized. If it is not 1 (i.e.
  the phase has not finished initializing), the function does nothing. Otherwise it writes 8 to oBattleObject_CurAction
  (an action id that presumably signals "current phase finished") and clears the oBattleObject_CurPhaseAndPhaseInitialized
  halfword to 0, resetting both the phase counter and the initialized flag in one store so the object''s
  next phase starts fresh. Pure state transition on the object; touches nothing else and returns no value.

  '
