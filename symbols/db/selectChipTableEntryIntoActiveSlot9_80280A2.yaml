name: selectChipTableEntryIntoActiveSlot9_80280A2
address: '0x080280A2'
kind: function
status: confirmed
summary: Registers one entry of an 11-entry halfword chip-selection table into the object at R5 and points active-chip
  slot 9 at it, skipping entries already flagged as taken.
interface: 'void selectChipTableEntryIntoActiveSlot9(R5Object* obj /* r5 */); // in: r4 (preserved), r5; out: r2
  = (1 << index) when index is in 1..11 (set even if the entry turns out to be taken); clobbers nzcv, r0, r1, lr'
details: 'Reads a selection index from obj+0x10 (R5+0x10). Index 0 or anything above 0xB is ignored. Checks the
  taken bitmask halfword at word_20349AC (dword_20349A0+0xC): bit (1<<index) set means the entry was already consumed,
  so nothing happens. Otherwise looks up the halfword entry (byte_802A828 + (index-1)*2) and stores it into obj+0x22,
  then calls getLocOfActiveChips_8027E1C with slot number 9; it zeroes the returned slot''s fields at +0 and +4
  and stores a pointer to obj+0x22 (the copied halfword) at slot+8, so active-chip slot 9 now references this object''s
  chip field. Quirk: the (1<<index) mask is computed and left in r2 before the taken-bit test, so callers get the
  bit even when the entry was already taken or (for out-of-range indices it is NOT set) — r2 only reflects in-range
  indices. R4 temporarily holds the table entry pointer but is saved/restored across the function.

  '
