name: sub_803BAE2
address: '0x0803BAE2'
kind: function
status: confirmed
summary: Advances a battle object's animation-phase counter (byte 0x13) and, during the low phase window [0,0x1F],
  rewrites the targeted sprite record to either an active {0x25, 0xE6} or idle {0x9F, 0xE5} two-byte state.
interface: "u32 animStep_803BAE2(u32 table_index /* r0 */, void *obj /* r5 */);\n    // r1 out: 0x3F when outside\
  \ the window; sub-index when record stays 0xE6;\n    //         record address when rewritten to idle.\n    //\
  \ clobbers r0, NZCV; preserves r4-r7.\n"
details: 'Indexes a 2-byte {base_offset, sub_index} table in RAM (dword_803BB28 holds the

  pointer it lives by, and dword_803BB28 is loaded as the base; entry = base +

  (table_index << 1)). Increments obj->phase (byte 0x13) and masks the result by

  0x3F. While masked < 0x20 (i.e. the lower half of the 64-phase cycle) the

  function performs the swap; otherwise it returns 0x3F without writing.


  The record addressed is obj + entry.base + (obj[entry.sub_index] << 1). If the

  record''s first byte is 0xE6 the object is treated as still active and the

  record is overwritten with {0x25, 0xE6}. Any other first byte (including the

  new 0x9F value itself) is overwritten with {0x9F, 0xE5}, putting the record

  into the "idle" sprite state. r1 is set to entry.sub_index in the active

  branch and to the record address in the idle branch.

  '
