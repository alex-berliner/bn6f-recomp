open_questions:
- Is the second navi_stats_byte read (field = 1) actually "Alliance" of the navi's slot, or a different field whose
  meaning is 1, e.g. the player's base attack / counter?
- Why does the beast-out branch short-circuit to a cap of 1 rather than going through the alliance + transformation
  bonus math?
- Should R2/R3 be promoted to a real "emotion + beast-out counter" return pair, or are they truly accidental survivors
  from the last guest call?
- The 28-byte transformation table is much larger than the known transformation enum; is the index actually Transformation,
  or another small enum that happens to alias the same offset?
