name: sub_801265A
address: '0x0801265A'
kind: function
status: probable
summary: Battle damage cap used while the player navi is beast-out / transformed; returns 1 in beast-out, otherwise
  alliance + navi bonus + transformation bonus, clamped to 0xa.
interface: u32 computeBeastDamageCap_801265A(u32 battle_object /* r5 */); /* clobbers r0-r3, r6, lr; preserves r4-r5;
  flags clobbered */
details: "Reads the player-side battle object (passed in r5 by callers):\n  - oNaviStats_NaviIndex  -> navi customization\
  \ index\n  - field 1 (Alliance?)   -> base alliance value\n  - oBattleObject_Alliance (byte at r5+oBattleObject_Alliance)\
  \ -> alliance for the emotion query\n\nBeast-out path: if callPossiblyGetBattleEmotion_8015B54 returns 5, the\
  \ damage cap is hard-coded to 1.\n\nNon-beast path: sums\n  alliance_idx\n  + byte_80126A4[navi_idx]      (12-byte\
  \ table, every entry 1: identity-like bonus)\n  + off_80126B0[transformation] (28-byte table, only index 9 is\
  \ 1)\nthen clamps the sum to a maximum of 0xa (10).\n\nR2/R3 are not real outputs: the function tails back into\
  \ the caller with whatever the last guest call produced\n(callPossiblyGetBattleEmotion on the beast branch, the\
  \ oNaviStats_Transformation lookup on the other branch).\nThis is almost certainly an \"Emotion returned separately\"\
  \ quirk rather than a real two-word result.\n\nTables:\n  byte_80126A4 at 0x080126A4 - 12 bytes of 0x01, indexed\
  \ by NaviIndex.\n  off_80126B0  at 0x080126B0 - 28-byte table indexed by Transformation; only entry 9 = 1, rest\
  \ 0.\n    The literal \"0x100\" at 0x80126B0 is the first word (little-endian of the 0x01 in entry 9 after 9 zero\n\
  \    bytes plus a 0x01 byte at offset 9).\n"
