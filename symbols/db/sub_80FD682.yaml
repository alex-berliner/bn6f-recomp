kind: function
status: confirmed
summary: Advances an AI attack object's internal state phase after a 30-frame cooldown.
interface: void sub_80FD682(void); /* r5 = battle object, r7 = AI attack vars; clobbers r0, NZCV */
details: 'Called from an AI attack step dispatcher with r5 pointing at the battle

  object and r7 at its companion AI attack variables struct (offsets 0x00,

  0x01, 0x10 visible). On entry, if the byte at +oAIAttackVars_Unk_01 is

  zero the function primes the wait: writes 4 back into that byte, clears

  the object''s current animation (oBattleObject_CurAnim = 0) and loads

  the halfword timer at +oAIAttackVars_Unk_10 with 0x1E (30 frames).

  On subsequent calls it decrements that timer; once it reaches 0 (or

  underflows since it''s a u16 used through a signed comparison), it

  writes 0x10 into the halfword at +oAIAttackVars_Unk_00 to hand off

  to the next substep/state.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
