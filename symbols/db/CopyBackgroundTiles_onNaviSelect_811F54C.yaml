open_questions:
- Which subsystem owns the work struct and when this is invoked (likely once per frame from the navi-select screen
  main loop).
- Whether index 8 is a true per-Navi table or a single navi-overlay strip; the `extraRowTable` flag here uses just
  one extra index, so either it's a generic overlay reused for any Navi or the per-Navi variations live elsewhere
  and the asm only flips the "show overlay" toggle here.
- r0-r2 / r3 outputs are best understood as caller-scratch; no caller contract is documented yet so any return value
  should be treated as ignored.
