name: GetOWPlayerFacingDirection
address: '0x0809E2B8'
kind: function
status: confirmed
summary: Returns which of the four directions the player's overworld sprite is currently facing.
interface: 'Next GetOWPlayerFacingDirection(void) — in: r10 (toolkit), lr; out: r0 = facing direction (0..3); clobbers:
  r0 only'
details: 'Follows the toolkit''s game-state pointer (r10 + oToolkit_GameStatePtr), then the overworld player object
  pointer stored in the game state (oGameState_OverworldPlayerObjectPtr), and reads a single byte field oOWPlayerObject_FacingDirection
  from that object. The returned value is the raw facing-direction enum of the overworld player sprite (0..3). Pure
  getter: reads memory only, has no side effects, and returns via mov pc, lr without touching any other registers,
  so it is safe to call anywhere the toolkit pointer is in r10. Note it reflects the sprite''s facing, not the direction
  of last input per se; if the player object pointer were null the call would fault.

  '
