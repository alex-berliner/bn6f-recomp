name: battle_spawnLinkedObj27AtOwnPanel
address: '0x08114170'
kind: function
status: probable
summary: Snapshots the battle object's panel position into spare fields, then spawns a linked object type
  0x27 there and stores its handle.
interface: (r5 = battle object pointer) -> r0 = spawned object handle (also stored at oBattleObject_ExtraVars+8);
  clobbers r0-r2, r4-r7
details: Zeroes the oBattleObject_ExtraVars area, copies oBattleObject_PanelX/oBattleObject_PanelY into
  fields 0x64/0x65 of the same object, clears field 0x66, then calls battle_spawnObj27LinkedToR5 which
  spawns a type-0x27 object inheriting this object's alignment/flip and linked flag; the returned object
  pointer is saved at ExtraVars+8 for later access. Field 0x66 being zeroed with the spawn suggests it
  tracks state of the spawned thing (e.g. charges/timer).
