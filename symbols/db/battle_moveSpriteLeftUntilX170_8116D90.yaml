name: battle_moveSpriteLeftUntilX170_8116D90
address: '0x08116D90'
kind: function
status: confirmed
summary: Drifts a battle object's sprite 16 px left per call and, once its x position reaches 0xAA (170), clamps
  it there and advances the object's state to 4.
interface: void sub_8116D90(battle object* r5)  /* lr clobbered; r0-r3 and NZCV flags return garbage from callees/last
  compare */
details: 'Battle-object step function taking the object pointer in r5. It first calls

  sprite_addCoordinates with (r0, r1) = (-0x10, 0), i.e. moves the object''s sprite

  16 pixels to the left on the x axis while leaving y unchanged. It then reads back

  the position with sprite_getCoordinates (x in r0, y in r1) and compares x against

  the boundary constant 0xAA (170). If x is still greater than 0xAA the function

  simply returns, leaving the object to keep drifting on later calls. Once x <= 0xAA,

  it calls sprite_setCoordinates to snap the sprite exactly to x = 0xAA and stores

  the byte 4 into the object struct at offset +9, apparently a state/phase field,

  which ends this movement phase. r2 happens to still hold 0xAA on both return paths

  (an artifact of the original, preserved in the C version). Flags on exit are the

  CMP result on the early-out path and the MOVS #4 / callee flags otherwise.

  '
