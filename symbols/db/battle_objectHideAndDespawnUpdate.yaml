name: battle_objectHideAndDespawnUpdate
address: '0x080C17B2'
kind: function
status: probable
summary: 'Battle-object update handler: spawns something at the object''s panel tile once, hides the object,
  then destroys it after a 16-frame delay.'
interface: (r5 = battle object, global context; no args) -> r0 = 0 on exit; updates object fields
details: This is a per-frame state handler for a battle object (r5 is the this-pointer held across calls).
  On the first run (oBattleObject_CurPhase == 0) it clears oBattleObject_RelatedObject1Ptr, sets oBattleObject_Timer
  to 0x10, calls sub_80C1820 with (r0 = oBattleObject_PanelX, r1 = oBattleObject_PanelY, r2 = 1) — presumably
  spawning/effect setup at that panel — and advances CurPhase to 4. Every frame thereafter it clears bit
  1 of oObjectHeader_Flags (likely the visible/enabled flag, hiding the object), decrements oBattleObject_Timer,
  and once the timer reaches 0 writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the engine despawns the object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]/tst/bne skips the one-time init block, which sets phase
    4 (sub_80C17B2 prologue); bl sub_80C1820 with r0=PanelX, r1=PanelY, r2=1 immediately after clearing
    RelatedObject1Ptr; bic r0,#2 on oObjectHeader_Flags each frame — clears the object''s visibility/active
    bit; ldrh/sub #1/strh on oBattleObject_Timer, bgt keeps waiting; on 0 stores CUR_STATE_DESTROY; r5-based
    oBattleObject_* fields and CUR_STATE_DESTROY match the standard battle object update-handler pattern'
  refs:
  - bn6f/asm/asm31.s:21243
  - 0x080C1820 sub_80C1820
  reproduce: python3 tools/asmcat.py 0x080C17B2
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- What sub_80C1820 spawns/does with (PanelX, PanelY, 1) — that would name the effect being placed
- Which object(s) use this handler (no callers known), i.e. what in-game entity hides itself and despawns
  after 16 frames
- Whether oObjectHeader_Flags bit 1 is definitively the visibility flag
