name: sprite_dirToAnimIndex
address: '0x080A8C7C'
kind: function
status: probable
summary: Converts an overworld object's facing-direction field into a sprite animation index (0-3) used
  with sprite_setAnimation/sprite_changeAnimation.
interface: (r7 = object struct ptr; reads halfword [r7,#4]) -> r0 = animation index 0-3 from table {2,3,0,1};
  no flags used
details: Takes bits 8-15 of the halfword at [r7,#4] (a direction/angle value), adds 0x20 (rounds when
  shifting by 6), shifts right 6, masks with 3, and indexes dword_80A8C94 (0x1000302 = bytes 02,03,00,01),
  returning a permutation of the 2-bit direction quadrant. Callers all immediately pass the result to
  sprite_setAnimation or sprite_changeAnimation after loading sprite (0x80,0x1C,0x66) with sprite_load,
  so it is a direction-to-animation-frame mapper. The +0x20 before >>6 means the direction is rounded
  to the nearest 1/4 turn rather than truncated. The table reorders raw quadrant values (0->2, 1->3, 2->0,
  3->1) to match the order of animation rows in that sprite's animation bank.
