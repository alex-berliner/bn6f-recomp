name: chatbox_renderTextEntry
address: '0x08137DB4'
kind: function
status: probable
summary: Clears a text work buffer, draws the message selected by the caller's text ID from table unk_201CF00
  into it, and places it at a fixed screen position.
interface: (r0-r3 = caller state; reads caller's r5 struct field +0x24 as a text/message ID) -> r0 = ?;
  renders into unk_2017AE0
details: First zeroes 0xE0 halfwords at unk_2017AE0 via ZeroFillByHalfword, suggesting a tilemap/tile-glyph
  scratch buffer of fixed window size. It then takes the halfword at [caller r5 + 0x24] as an index and
  calls sub_8137DE4(index, unk_201CF00, unk_2017AE0, 7, 0), which looks up text/data at unk_201CF00 and
  writes into the buffer — likely character/glyph expansion with 7 as a row-length or mode parameter.
  Finally sub_8137E3C(0xa, 4, unk_2017AE0) receives the buffer plus what look like X/Y coordinates (10,
  4), presumably copying the rendered text to the screen or a BG map. Both known callers show text windows
  (battle round start, submenu confirm), so this is a shared message-render helper. The function inherits
  r5 from its caller rather than setting it up, so it is an inner helper of a text-display flow, not a
  standalone API.
