name: battle_spawnType3Object99AtPanel
address: '0x080D876E'
kind: function
status: probable
summary: Spawns battle object kind 0x99 at a given panel with element and damage, copying alliance/flip
  from a source object and linking it to a caller-supplied struct whose flag byte is set to 1.
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = source battle object, r6 = damage value, r7 =
  link struct ptr) -> r0 = spawned object (0 on failure); flags set by spawn success
details: The function saves its first three arguments plus r5 with 'push {r0-r2,r5}', calls object_spawnType3
  with type 0x99, and pops them back shifted into r1-r3, so r0-r2 on entry are panelX, panelY and element.
  On success it writes panelX/panelY/element into the new object's oBattleObject fields, stores r6 into
  oBattleObject_DamageAndStaminaDamageCounterDisabler, and copies oBattleObject_AllianceAndDirectionFlip
  from the saved source object in r5. It stores r7 into the new object's oBattleObject_RelatedObject1Ptr
  and writes 1 to the byte at [r7], marking that the linked object now exists. Finally it ORs 0x10 into
  the new object's oObjectHeader_Flags, likely a 'has related object' marker. The push/pop-around-bl trick
  is just argument preservation across the spawn call, not a real stack frame.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x99 + bl object_spawnType3: spawns type-3 battle object of kind 0x99; pop {r1-r3,r5}
    then strb to PanelX/PanelY/Element: first three entry args are panel position and element; ldrh/strh
    of oBattleObject_AllianceAndDirectionFlip via saved r5: alliance and sprite flip inherited from a
    source object; str r7,[r0,#RelatedObject1Ptr]; mov r1,#1; strb r1,[r7]: two-way link with caller struct,
    flag byte set; beq locret right after spawn: fields are only filled when the spawn succeeded'
