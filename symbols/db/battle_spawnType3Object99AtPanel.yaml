open_questions:
- What battle object kind 0x99 actually is (its initializer/behavior) — the sole caller sub_80E83FC is
  undocumented, so the gameplay role (trap, attack entity, etc.) is unconfirmed
- What struct r7 points to and what the byte set to 1 means (spawned flag vs. slot index)
- Meaning of oObjectHeader_Flags bit 0x10
