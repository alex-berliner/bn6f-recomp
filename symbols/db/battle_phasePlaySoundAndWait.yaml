name: battle_phasePlaySoundAndWait
address: '0x080BDD40'
kind: function
status: probable
summary: 'Battle-object action-step handler: plays sound effect 0x94 once, then waits 60 frames before
  advancing the object''s action.'
interface: (r5 = battle object, not passed in r0) -> void; no meaningful return, flags from PlaySoundEffect
  call clobbered
details: On first entry (PhaseInitialized == 0) it plays sound effect 0x94, sets oBattleObject_Timer to
  0x3C (60 frames), sets oBattleObject_CurAnim to 3, and marks the phase initialized with 4. On subsequent
  calls it decrements Timer each frame until it reaches zero, then adds 4 to oBattleObject_CurAction and
  clears CurPhaseAndPhaseInitialized so the next action step begins. r5 is a battle object struct; only
  Timer, CurAnim, CurAction, CurPhaseAndPhaseInitialized and the init flag are touched. The state machine
  pattern (increment action by 4, reset phase) is the standard battle object action-step advance.
