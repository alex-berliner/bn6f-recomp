name: battleObject_updateHitboxPanelOverlap_804692C
address: '0x0804692C'
kind: function
status: confirmed
summary: Tests each sub-hitbox point in the object's current-frame panel list against the visible battle-panel grid
  rectangle, builds a 32-bit per-point overlap mask, and folds it into the object's control byte.
interface: u32 battleObject_updateHitboxPanelOverlap(u32 r5_obj); /* returns updated ctrl byte in r3; clobbers r0-r2,r4,r6-r9,r12
  */
details: 'Reads signed panel-center origin from obj+0x0C (x) and obj+0x0E (y). Reads mirror flags from obj+0x13:
  bit 4 (0x10) flips X deltas, bit 5 (0x20) flips Y deltas. Resolves a 5-byte-per-entry panel point list: frame
  byte at *(obj+0x20), offset table = *(obj+0x18) + *(*(obj+0x1C)+0xC), entry = *(table + frame*4) + table. Each
  entry is {kind:u8, dx:i8, dy:i8, pad, pad}; list ends at kind==0xFF. For each entry, computes px = (flip_x ? -dx
  : dx) + origin_x and tests -0x40 <= px < 0x131 (i.e. [-64,273)); if in range, computes py = (flip_y ? -dy : dy)
  + origin_y and tests -0x20 <= py < 0xC1 (i.e. [-32,193)). These bounds correspond to the 8x5 (256x160 px) battle-panel
  grid with a small margin. Sets bit (0x80000000 >> i) in a 32-bit hit_mask. Stores raw mask at obj+0x28. Folds
  mask into control byte obj+3: If ctrl bit 2 clear (normal): ctrl bit 3 ← (mask & ~0x80000000) != 0 (any hit except
  topmost); ctrl bit 1 ← mask != 0 (any hit at all). If ctrl bit 2 set (alternate): ctrl bits 1+3 ← mask != 0 (combined
  single check). Final ctrl byte written back to obj+3 and returned in r3.

  '
