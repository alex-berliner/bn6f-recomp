open_questions:
- Whether AIData+0x28 is actually named "overlap bitmap" in the project struct - the BN6 struct currently
  labels it `Unk_2a`-area but the function only writes to +0x28 and reads nothing else there. Also whether
  the "DirectionFlip" semantics (0x10/0x20 in AIData+0x13) match DirectionFlip from BattleObject+0x17
  or are AI-local - the function treats them as axis-flip toggles.
