open_questions:
- What is the semantic meaning of the two ctrl-bit-2 paths (normal vs. combined 0x0A)? Is it a per-object-type flag
  selecting between row/column overlap tests?
- The 32-bit mask has one bit per panel point but the list is variable-length; what is the maximum number of entries
  (up to 32?) and are all bits meaningful or only the lowest N?
- Why does the normal path distinguish 'any hit except the top bit' (bit 3) from 'any hit at all' (bit 1)? Does
  the top bit correspond to a specific row (e.g. the back row at y=-32) that is treated specially?
