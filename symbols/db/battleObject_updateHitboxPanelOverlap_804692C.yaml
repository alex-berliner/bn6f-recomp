name: battleObject_updateHitboxPanelOverlap_804692C
address: '0x0804692C'
kind: function
previous_names:
- sub_804692C
status: probable
summary: Tests each hitbox slot in the AIData's collision hitbox table against the panel grid and updates
  a per-direction-overlap bitfield plus a "hitbox touches any enemy/ally panel" object flag.
interface: '(r5 = AIData pointer) -> r3 written back to AIData+0x03 (battle-object Flags bits 1/3), r7
  (overlap bitmap) stored to AIData+0x28; side effects: mutates the caller''s AIData'
details: "- Pulls PanelX (r5+0x0C, signed half) and PanelY (r5+0x0E, signed half) as the object's current\
  \ panel coords.\n  - Reads two single-bit direction flags at AIData+0x13: bit 0x10 -> r8 (X-flip, used\
  \ to negate the dx slot delta) and bit 0x20 -> r9 (Y-flip, used to negate the dy slot delta).\n  - Resolves\
  \ the hitbox table base as `AIData->RelatedObject2Ptr (r5+0x1C) -> [0x0C] + AIData->AIDataPtr (r5+0x18)`,\
  \ then indexes by the object's Alliance byte (r5+0x20, ldrb -> lsl #2) to pick one of two hitbox tables\
  \ and adds it to the base. Each entry is 5 bytes: [id?, dx (signed byte), dy (signed byte), ...]. Iteration\
  \ is a sentinel scan: `ldrb [r2]; cmp #0xFF; beq done; add r2, #5`.\n  - For each entry, dx/dy are sign-extended\
  \ (`ldrsb`), optionally negated by r8/r9, then summed with PanelX/PanelY. The result is range-checked\
  \ against the visible panel window: X must be in `[-0x40, 0x130]` and Y in `[-0x20, 0xC0]`. These constants\
  \ are the off-screen GBA panel bounds (3..6 columns / 1..3 rows beyond the 6x3 visible grid, consistent\
  \ with BN panel geometry where a custom can hit 1-2 panels into a side column).\n  - For each slot that\
  \ passes, the running r7 bitmap is OR'd with a single bit that starts at 0x80000000 and is shifted right\
  \ per iteration (16 slots max). The result (r7) is the \"which hitbox slots currently overlap the visible\
  \ field\" mask.\n  - Afterwards, it writes that mask to AIData+0x28 and uses it to set/clear `OBJECT_FLAG_ACTIVE`\
  \ (bit 0x01) and `OBJECT_FLAG_VISIBLE` (bit 0x02) on AIData+0x03 via the object's existing flag byte\
  \ (the `tst r3, r4 / orr r3, r4` path with r4=4,8 then 2,0xA branches). Net effect: any overlap -> set\
  \ VISIBLE; at least one in-range -> set ACTIVE.\n  - Note: AIData+0x18 is named `AIDataPtr` in BattleObject.inc\
  \ but here it acts as a hitbox-table base, and the pointer at +0x1C + 0x0C is what holds the offset\
  \ to add. The \"hitbox table\" interpretation is consistent with the 5-byte stride and the panel-range\
  \ bounds.\n"
