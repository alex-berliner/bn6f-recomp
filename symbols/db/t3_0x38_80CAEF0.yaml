name: t3_0x38_80CAEF0
address: '0x080CAEF0'
kind: function
status: confirmed
summary: Per-frame update for a battle object — dispatches to one of three state handlers based on the object's
  CurState byte, then runs the shared sprite/pause update.
interface: void battle_objectStateDispatch_80CAEF0(r5 = battle object, r10 = passthrough to state handler); returns
  r5 r8 r9 r10 r11 r12 as left by the callees, clobbers flags and r0-r7, lr
details: 'Reads the object''s CurState byte at [r5 + oBattleObject_CurState] and indexes the three-entry jump table
  off_80CAF08 with it, then tail-enters the chosen handler using the "mov lr, pc; bx r1" idiom (so the handler is
  an ARM function entered with lr set to the return address). States: 0 = battle_initShipSprite_80CAF14 (initializes
  the ship sprite, i.e. the object''s first-state setup), 1 = sub_80CAF9C (idle/hold state), 2 = object_destroyWrapper_80CB078
  (self-destruction wrapper). Each handler receives the state byte in r0 and its own table entry in r1. When the
  handler returns, this function calls object_updateSpritePaused with r5 still holding the object pointer (the handler
  leaves the object in r5), which advances/updates the object''s sprite while respecting pause state. Because the
  handler is entered via the lr-set idiom and object_updateSpritePaused preserves r8-r12, whatever the handler left
  in r8-r12 survives to callers, which matches the register contract''s outputs r5 r8 r9 r10 r11 r12. r10 is passed
  straight through to the state handler untouched; it appears to carry extra per-call context the handlers use.

  '
