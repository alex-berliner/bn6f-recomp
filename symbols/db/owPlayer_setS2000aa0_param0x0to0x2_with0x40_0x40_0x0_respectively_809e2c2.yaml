name: owPlayer_setS2000aa0_param0x0to0x2_with0x40_0x40_0x0_respectively_809e2c2
address: '0x0809E2C2'
kind: function
status: confirmed
summary: Resets the overworld player navi's sprite transform (horizontal/vertical compress 0x40 each, rotation 0)
  into eStruct2000aa0.
interface: void owPlayer_resetNaviSpriteTransformDefaults_809e2c2(void); // writes r0=0x40, r1=0x40, r2=0 then tail-calls
  the generic setter; clobbers r0-r3 and nz flags
details: Thin wrapper that loads the three default sprite-transform values into r0-r2 — DEFAULT_OW_PLAYER_NAVI_HORIZONTAL_COMPRESS
  (0x40), DEFAULT_OW_PLAYER_NAVI_VERTICAL_COMPRESS (0x40), and DEFAULT_OW_PLAYER_NAVI_ROTATION (0) — then tail-calls
  owPlayer_setS2000aa0_param0x0to0x2_809e2c8. The inner function loads the eStruct2000aa0 pointer (0x2000aa0) into
  r3 and stores the three bytes at offsets +0x0, +0x1 and +0x2, i.e. oS2000aa0_OWPlayerNaviHorizontalCompress, oS2000aa0_OWPlayerNaviVerticalCompress
  and oS2000aa0_OWPlayerNaviRotation. A compress value of 0x40 (64) corresponds to 1.0x scale in fixed-point (256-based)
  terms, and rotation 0 means no sprite rotation, so this restores the navi's overworld sprite to its normal, untransformed
  appearance. No inputs are read from the caller other than lr.
