name: link_RequestDisconnect_813D8C4
address: '0x0813D8C4'
kind: function
status: confirmed
summary: Sets the link session state to 4, requesting teardown of the current wireless/cable link connection.
interface: void link_RequestDisconnect(void)
details: 'Stores the constant 4 into offset 0x58 of the link work area pointed to by eLinkState (the dword at 0x2009A28
  region). This acts as a one-line signal to the link state machine: state 4 is evidently the "disconnect/teardown
  requested" state, which the link task will observe and act on. The function touches nothing else and preserves
  all registers except r0/r1 and the NZ flags. Its effect is purely a state write, so callers rely on the link task
  polling eLinkState+0x58 to actually close the session.

  '
