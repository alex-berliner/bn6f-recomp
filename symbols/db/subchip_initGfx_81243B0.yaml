name: subchip_initGfx_81243B0
address: '0x081243B0'
kind: function
status: confirmed
summary: Sets up the graphics for the SubChip menu screen — builds a decompression "init refs" table, decompresses
  the screen's tiles/palettes/fonts, prepares its text script, and blits the background tilemap to the text layer.
interface: void subchip_initGfx_81243B0(void)
details: 'Builds a table of init refs at unk_20096E0 from a static template at off_8124450. The template holds three
  entries of {source ptr, size, word, word}: three compressed graphics blobs at dword_86C9108, dword_86C9AF4 and
  dword_86C9B54, each with size 2 (a compression-format id) followed by a destination (palette_3001960, unk_3001AC0,
  unk_3001A20) and value 0x20. For each entry the first pair is run through sub_811FB84(source, size) (presumably
  producing a decompression descriptor word) and the two trailing words are copied unchanged; the assembled table
  is NUL-terminated. The ref table is then fed to decompAndCopyData, which decompresses and copies the graphics
  into VRAM/palette/WRAM destinations; a second, hardcoded ref table at byte_8124488 is processed the same way,
  loading comp_86C8054 to 0x06000020 (the menu''s character/font tiles into the text-layer tile block) and comp_86CF82C
  into eDecompBuffer2013A00. sub_8123300 then prepares a text script: it gets a list of compressed text pointers
  at off_8124410 (13 entries, all CompText86CFAF8 except indices 0 and 11 which are CompText86CF994), the script
  buffer eTextScript201C100, and the scratch buffer eDecompBuffer2013A00. Finally CopyBackgroundTiles(0, 0, 1, eTextScript201BA00,
  0x1E, 0x14) writes a 30x20-tile background map (built from the descriptor list at off_8124498, which references
  tilemaps, tile images like comp_86C9BD4 at VRAM 0x6014840, comp_86C9148 at 0x6003C00, comp_86CFC64 at 0x6010000,
  and palettes byte_30016D0/byte_3001690) into BG tile block 1 — i.e. the full-screen SubChip menu backdrop. The
  scratch buffer eDecompBuffer2013A00 is shared by every decompression stage. Preserves r4-r7; only r0-r3 and flags
  are clobbered.

  '
