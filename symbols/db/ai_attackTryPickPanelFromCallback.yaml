name: ai_attackTryPickPanelFromCallback
address: '0x08108AE8'
kind: function
status: probable
summary: 'AI attack step: if the battle object can move, invokes a configured panel-choose callback (passing
  two data-table words) to obtain panel coordinates; on success reserves that panel, marks CANNOT_SLIDE,
  sets attack animation/timer/HasMoved/HitElement, otherwise clears HasMoved and exits the attack state.'
interface: (r0 = battle object (r5 via caller convention), r7 = oAIAttackVars state) -> r0 = destroyed;
  uses PanelChooseCallback(r2=0x10000, r3=0x0F880080 as fixed args) returning r0=panelX, r1=panelY (0
  = none)
details: First calls object_canMove; if blocked, clears oAIAttackVars_HasMoved and calls object_exitAttackState.
  Otherwise loads two words from a local data table (0x10000, 0x0F880080) and calls the callback stored
  in oAIAttackVars_PanelChooseCallback with lr=pc, which returns panel coordinates in r0/r1. If nonzero,
  it stores them into oBattleObject_FuturePanelX/Y, reserves that panel via object_reservePanel, sets
  OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, sets CurAnim=4, StepTimer=3, HasMoved=1 and HitElement=4.
  The fixed callback arguments likely parameterize which panel the AI picks (offset/direction encoded
  in the words). The object fields touched are the standard battle object CollisionData flags and future-panel
  coordinates.
