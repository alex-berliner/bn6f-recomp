name: battleObject_aiDispatchAttack_80F17C4
address: '0x080F17C4'
kind: function
status: confirmed
summary: Trampoline that dispatches a battle object's AI attack step to one of three handlers chosen by the object's
  HitElement byte.
interface: 'void battleObject_aiDispatchAttackByHitElement_80F17C4(void /* r7 = battle object, r2/r5/r6 = extra
  args passed through */); Reads oAIAttackVars_HitElement from the object, jumps table[HitElement] with r0 = HitElement,
  r1 = handler address, r2/r5/r6/r7 passed through unchanged; caller-visible outputs (r1, r5, r8-r12) and NZCV are
  whatever the chosen handler leaves.

  '
details: 'Reads the byte at object+oAIAttackVars_HitElement (object pointer in r7) and uses it unscaled as an index
  into the 3-entry handler table at off_80F17D8 (ldr r1, [table, element]), so element values step 4 bytes per unit:
  0 = sub_80F17E4, 1 = battleObject_aiSpawnSnakeArmAttack_80F1808, 2 = battleObject_attackVars_tickExitTimer_80F1888.
  The branch is via mov lr, pc + bx r1, so it is a plain call, not a tail call: the handler returns here and this
  routine then pop {r7,pc} restores the caller''s r7. Because the call goes through bx into thumb code, each table
  entry is stored +1 (Thumb address). Quirk: no bounds check on HitElement, and r1 doubles as both the table-load
  destination and the handler''s first-style argument (the handler''s own address), matching how the original game
  calls these attack handlers. The three targets suggest this object cycles AI states: element 0 does nothing yet
  (sub_80F17E4), element 1 spawns a snake-arm attack, element 2 ticks an exit timer to leave the attack state.

  '
