status: probable
summary: AI attack dispatch table for SnakeArm — branches on AIAttackVars[0] via ThumbBX
interface: (r7 = pointer to AIData, lr = return) -> r0..r3 overwritten by the chosen handler; tail-calls into sub_80F17E4
  / battleObject_aiSpawnSnakeArmAttack_80F1808 / sub_80F1888
details: "Reads r7 + oAIAttackVars (0xa0 within AIData) → AIAttackVars.Unk_00 byte used as an index into\n  the\
  \ 3-entry table at off_80F17D8 (= sub_80F17E4+1, battleObject_aiSpawnSnakeArmAttack_80F1808+1,\n  sub_80F1888+1).\
  \ Loads the entry, sets lr=pc and BXs into it; the routine never returns\n  itself — it tail-calls one of the\
  \ three handlers and the chosen handler does `pop {r7,pc}`\n  under the shared prologue/epilogue. So this is essentially\
  \ a three-way dispatch table for\n  AIAttackVars[0] within the SnakeArm family of attacks.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r7,#oAIAttackVars_Unk_00]` at the entry obtains the index byte from AIData - `ldr r1, off_80F17D4
    ; ldr r1, [r1,r0]` implements `[off_80F17D8][r0]` lookup - off_80F17D8 lists exactly three function pointers
    (+1 set for ThumbBX) - `mov lr, pc ; bx r1` is a Thumb tail-call; the chosen handler exits via the `pop {r7,pc}`
    shared with the prologue here, which is why both have the same push/pop pair'
