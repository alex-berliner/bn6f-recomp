name: chatbox_scriptStepSyncPlayerTextState_8041F44
address: '0x08041F44'
kind: function
status: confirmed
summary: Chatbox script opcode handler that sets chatbox flag 0x0001, copies the script counter into the overworld
  player's text-state field, then advances the script cursor by 2 bytes and reports success.
interface: 'int chatbox_8041F44(void); // called with r4 = chatbox script cursor (byte ptr, advanced by 2), // r5
  = chatbox state struct ptr (read [r5+0x3C] counter, [r5+0x3E] flags), // r10 = toolkit (follows oToolkit_GameStatePtr
  -> oGameState_OverworldPlayerObjectPtr); // returns r0 = 0, r4 advanced by 2, N/Z cleared, C/V from the cursor
  add. // r1, r3, r6, r7, lr are clobbered/scratch; r5, r6 preserved.

  '
details: 'This is one opcode step of the chatbox script interpreter (cursor in r4, chatbox state in r5). First it
  ORs bit FLAGS_3E_UNK_0001 (0x0001) into the chatbox state''s flag word at +0x3E via chatbox_setflags_3e, marking
  the script as active/started. It then reads the byte counter at [r5+0x3C]; while that value is still 7 or less
  (i.e. before the counter wraps into some higher state) it is stored into the overworld player object''s field
  0x10, the field holding the player''s current text/chat state — effectively syncing the player''s on-map dialog
  state with the chatbox''s script counter. It then calls sub_809E14C (passing the counter in r0 and the chatbox
  field address in r1, mirroring register state), advances the script cursor r4 by 2 (a 2-byte opcode), and returns
  0 to the interpreter. Flag quirk: N/Z come from "mov r0, #0" while C/V are left over from "adds r4, #2".

  '
