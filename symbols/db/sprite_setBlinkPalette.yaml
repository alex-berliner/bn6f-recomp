name: sprite_setBlinkPalette
address: '0x080BF402'
kind: function
status: probable
summary: Picks palette 4 or 0 for an object's sprite from a blink-pattern bit test of a frame/counter
  value.
interface: (r0 = blink counter/frame value) -> r0 = palette index passed to sprite_setPalette; flags clobbered
  by tst/cmp
details: 'The input is treated as a phase counter: values <=0x14 use mask 4, values >0x14 use mask 2 (values
  <=0xA would use mask 1 but that branch is unreachable for inputs >0x14, so effectively only masks 4
  and 2 are ever selected). It tests r0 against the selected mask (tst r0,r1) and passes 4 to sprite_setPalette
  if any bit matches, else 0. sprite_setPalette stores the value in byte 4 of the object''s sprite struct,
  i.e. this swaps the sprite between palette 0 and palette 4 on a repeating bit pattern — a classic blinking/flash
  toggle. The nested range/mask selection acts as a two-speed blink pattern table keyed on the counter.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_80BF40E..416: mask chosen by comparing r0 against 0x14 and 0xA (range-keyed blink pattern);
    tst r0, r1 / beq: palette result is the bit-test outcome, 4 or 0; bl sprite_setPalette: result is
    written as the sprite struct''s palette index (byte 4)'
