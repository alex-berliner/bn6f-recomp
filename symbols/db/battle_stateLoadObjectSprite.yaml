name: battle_stateLoadObjectSprite
address: '0x080BA72C'
kind: function
status: probable
summary: Battle object state step that freshly loads an object's sprite (coords, art, shadow, anim 0,
  palette, flip) then advances to the update state.
interface: (r0 = scratch, r5 = battle object ptr) -> r0 = destroyed; writes object Z, CurAnim/CurAnimCopy,
  state word = CUR_STATE_UPDATE
details: Called with r5 pointing at the battle object; first calls object_setCoordinatesFromPanels to
  sync pixel X/Y with panel coords and zeroes oBattleObject_Z16. Decompresses temp sprite data (params
  8, 0xf) then sprite_load(0x80, 8, 0xf) into sprite slot 0x80, followed by sprite_loadAnimationData.
  Turns the shadow on, sets CurAnim and CurAnimCopy to 0, applies animation 0, reloads animation data
  again, sets palette 0, and sets horizontal flip from object_getFlip. Finally stores CUR_STATE_UPDATE
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the object resumes normal updating next
  tick.
