- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_setCoordinatesFromPanels then strh r0,[r5,#oBattleObject_Z16] repositions the object;
    mov r0,#8 / mov r1,#0xf / bl sprite_decompressTemp; sprite_load(0x80,8,0xf) loads art resource 8 into
    slot 0x80; strb r0,[r5,#oBattleObject_CurAnim]/CurAnimCopy with r0=0 then sprite_setAnimation resets
    animation; bl object_getFlip / bl sprite_setFlip aligns sprite facing with alliance side; mov r0,#CUR_STATE_UPDATE;
    str r0,[r5,#oBattleObject_...] terminates the handler by advancing state
