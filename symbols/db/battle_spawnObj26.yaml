name: battle_spawnObj26
address: '0x080BFF00'
kind: function
status: probable
summary: Spawns a type-0x26 battle object at panel (r0,r1) linked to a related object (r2), copies AllianceAndDirectionFlip
  from the acting object in r5 into it, zeroes a counter, and ORs 0x14 into oObjectHeader_Flags.
interface: (r0 = panelX, r1 = panelY, r2 = related object ptr, r3,r4 = passthrough to type initializer;
  r5 = acting BattleObject, implicit) -> r0 = new BattleObject or null; Z flag from spawn indicates failure
  (beq taken)
details: Saves its args with push {r0-r2,r5}, sets r0=0x26 and calls object_spawnType1, which returns
  the new object in r5; r0-r2 are reloaded via pop {r1-r3,r5} into r1-r3 while r3,r4 pass straight through
  to the type-specific initialiser. On success it stores arg0/arg1 into oBattleObject_PanelX/PanelY and
  arg2 into oBattleObject_RelatedObject1Ptr, zeroes oBattleObject_DamageAndStaminaDamageCounterDisabler,
  and copies AllianceAndDirectionFlip from the object in the caller's r5 into the spawn — implying an
  r5=acting-object convention (likely the battle-script interpreter calling this as a native helper).
  Finally it sets oObjectHeader_Flags bits 0x04|0x10 on the new object and returns its pointer in r0.
  The beq after the pop relies on flags left by object_spawnType1 to skip all initialisation when the
  spawn failed.
evidence:
