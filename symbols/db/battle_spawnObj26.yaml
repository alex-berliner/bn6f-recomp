    str r3,[r0,#RelatedObject1Ptr] and str r1(=0),[DamageAndStaminaDamageCounterDisabler] — links related
    object, resets damage counter field; ldrh r3,[r5,#AllianceAndDirectionFlip] / strh into the new object
    after pop restored the caller''s r5 — alliance inherited from the acting object; ldrb/orr #0x14/strb
    on oObjectHeader_Flags sets flag bits 0x4|0x10 on the spawn'
