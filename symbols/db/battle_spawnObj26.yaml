- What battle entity object type 0x26 actually is (needs the type-1 spawn table / its type-specific initialiser)
- Meaning of oObjectHeader_Flags bits 0x04 and 0x10
- Confirmation that r5 is supplied by the battle-script interpreter rather than an ordinary caller — sub_80E8F00's
  context would show this
- The summary is accurate but the name 'battle_spawnObj26InheritAlliance' overstates 'inheritAlliance'
  since only the AllianceAndDirectionFlip byte is copied, and the oObjectHeader_Flags OR with 0x14 (bits
  0x04 and 0x10) is also a notable effect not captured. The interface description is correct, including
  the r5=acting-object convention implied by the ldrh from [r5, ...AllianceAndDirectionFlip] into r0 (the
  spawn) after pop.
