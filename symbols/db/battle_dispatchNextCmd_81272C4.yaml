name: battle_dispatchNextCmd_81272C4
address: '0x081272C4'
kind: function
status: confirmed
summary: Queues the next battle-object command for the object being updated, choosing between CMD_A and
  CMD_B based on the object's state bytes.
interface: void battle_dispatchNextCmd_81272C4(u32 obj_ptr /*r5*/); clobbers r0-r3,r6-r7,nzcv; preserves
  r4,r5
details: 'Called as a per-frame ''next'' handler for a battle object at r5. Reads obj+0x10 (active flag):
  if zero, queues CMD_B (source 0xE8, type 0x34, flag 0x12, pool offset 0) via helper sub_812730C. If
  non-zero, first queues CMD_A (source 4, type 0x34, flag 0x13, pool offset 0x10000000), then checks obj+0x0F
  (state): if state==2 the function returns early; if obj+0x10==1 (re-read) it falls through to also queue
  CMD_B, otherwise returns after CMD_A alone. The helper receives r4=A_byte_81268FC and r7=A_dword_81268F8
  as command-queue parameters. Both return paths after the helper leave a CMP in flags, so callers must
  not rely on flag state.'
