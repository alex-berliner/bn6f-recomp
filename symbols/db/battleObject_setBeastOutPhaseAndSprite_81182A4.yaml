open_questions:
- The exact semantic meaning of the sSubmenu Unk_0C values (0x10 vs 0x0C vs the indexed range) — they
  map to "teleport-copy", "scaled Cross sprite", and "Beast-Out panel offset" respectively by context,
  but the gameplay names are inferred.
- What sub_8118314 returns (the helper struct used at offsets +0x0C/+0x0E) is unknown; identifying it
  would settle which object's coordinates are being copied.
