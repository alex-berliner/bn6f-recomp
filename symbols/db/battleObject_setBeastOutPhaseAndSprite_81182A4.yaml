    — sSubmenu->Unk_0C controls the branch (assembly `bn6f/asm/asm32.s:20156`). - `cmp r4, #0x10` / `bne
    loc_81182C2` distinguishes the FuturePanelXY-copy path from the default. - `ldr r1, off_8118300 //
    =byte_8118304` followed by `ldr r1, [r1,r4]` is an indexed table lookup; the byte_8118304 contents
    (entries 4 = 0x12, 8 = 0xEE 0xFF 0xFF 0xFF i.e. -0x12) match the symmetric +0x12 / -0x12 panel shifts
    written to r5+0x16. - `bl sprite_makeScalable` + `bl sprite_setScaleParameters` with the only 0x40/0x40
