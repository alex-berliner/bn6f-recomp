name: battleObject_setBeastOutPhaseAndSprite_81182A4
address: '0x081182A4'
kind: function
previous_names:
- sub_81182A4
status: probable
summary: Sets the battle object's CurPhase (and related PanelXY/FuturePanelXY fields) for the Beast-Out
  / Cross-Megaman transformation, choosing different sprite-scaling/sprite-state setups based on the submenu's
  Unk_0C mode byte.
interface: (r5 = battle object, lr = return) -> r0 = sSubmenu (0x02009A30), no other caller-visible writes;
  side effects write to battle object fields 0x0A/0x10/0x12/0x14/0x16 and the sprite-data area, and call
  sprite_makeScalable/sprite_setScaleParameters/sprite_setUnk0x2c.
details: "- Calls sub_8118314 with r5 to obtain a per-object helper pointer (returned in r0), then reads\
  \ sSubmenu->Unk_0C (a mode byte at 0x02009A30 + 0x0C) into r4.\n  - If r4 == 0, falls through with r7\
  \ = 0 → writes CurPhase = 0 at r5+0x0A and returns.\n  - If r4 == 0x10: copies the helper's halfword\
  \ at +0x0E into the object's FuturePanelXY (r5+0x14) and sets CurPhase = 0x14.\n  - If r4 is something\
  \ else (the main beast-out branch): writes 0xB8 to helper+0x0C, then copies helper+0x0E into both PanelXY\
  \ (r5+0x10) and FuturePanelXY (r5+0x14); if r4 != 0x0C, it indexes byte_8118304 with r4 (table layout:\
  \ index 4 → +0x12, index 8 → -0x12) and writes the result to Alliance/AllianceAndDirectionFlip at r5+0x16,\
  \ with CurPhase = 4.\n  - For r4 == 0x0C specifically: runs sprite_makeScalable, sets PanelXY's high\
  \ byte to 0x40 at r5+0x12, then calls sprite_setScaleParameters(0, 0x40, 0x40) and sprite_setUnk0x2c(0xFFFFFFFC)\
  \ (computed via `mvn r0, r0` of 0xFC000000), with CurPhase = 0x0C. This is the Cross-Megaman scaled\
  \ sprite path.\n  - Final epilogue stores CurPhase into r5+0x0A and pops r4-r7,pc.\n  - Note: the function\
  \ is not \"void-like\" — it returns r0 = sSubmenu (0x02009A30), which the captured-call snapshots confirm.\n"
