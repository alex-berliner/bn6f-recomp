summary: Zero-argument wrapper that tail-calls sub_800AAFC with r0 = 0 and passes its r2/r3/r4 results straight
  back to the caller.
interface: void sub_800AAF2(void); // calls sub_800AAFC(0); returns callee's r2/r3/r4, preserves r3/r4 from the
  wrapper's perspective
details: 'Two-instruction thunk: pushes lr, sets r0 = 0, calls sub_800AAFC (which likely

  tail-returns with the r2/r3/r4 outputs attributed to this wrapper by the lifter),

  then pops pc. No other registers or memory are touched here, so the function''s

  game meaning is entirely inherited from sub_800AAFC, which has not been

  identified from this snippet. The fact that callers pass r3/r4 through and get

  them back unchanged suggests the real work and its arguments live one call deeper.

  '
