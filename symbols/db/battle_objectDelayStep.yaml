name: battle_objectDelayStep
address: '0x080B8F8E'
kind: function
status: probable
summary: 'Battle-object action step: on first entry starts anim 0xA with a 20-frame timer, then when the
  timer expires advances the object to action 0xC and resets its phase.'
interface: (r0 = unused/overwritten, r5 = battle object) -> r0 = scratch; no return value; updates oBattleObject
  fields in place
details: 'r5 points to a battle object. If oBattleObject_CurPhase is 0 it initializes a delay: sets CurPhase=4,
  CurAnim=0xA, and oBattleObject_Timer=0x14 (20 frames). On subsequent calls it decrements Timer; while
  it is still positive it returns. When the timer reaches 0 it sets oBattleObject_CurAction=0xC and clears
  CurPhaseAndPhaseInitialized=0, handing control back to the object''s action dispatcher. This is the
  classic phase/timer state-step pattern used by battle object handlers.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase] / tst r0,r0 — one-shot init branch on phase==0; strb #4
    CurPhase, strb #0xA CurAnim, strh #0x14 Timer — starts anim 0xA with a 20-frame wait; ldrh Timer /
    sub #1 / bgt — frame-countdown loop on later calls; strb #0xC CurAction and strh #0 CurPhaseAndPhaseInitialized
    — exits to action 0xC with fresh phase'
