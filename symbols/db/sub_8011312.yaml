name: sub_8011312
address: '0x08011312'
kind: function
status: hypothesis
summary: Trampoline that tail-calls the battle "spawn obj 56 / store related object" helper with the constant argument
  0x105.
interface: void sub_8011312(u32 r1, u32 r2, u32 r3, u32 r5) — pass-through call; all r0-r7 and NZCV results are
  whatever the callee (sub_8011344) leaves behind
details: 'Pure thunk: pushes lr, loads the immediate 0x105 into r0, then tail-calls battle_spawnObj56StoreRelatedObject2
  (sub_8011344) with r1, r2, r3 and r5 passed through untouched; pops pc directly so no return value is set up locally.
  The meaning of 0x105 is unknown from this site alone — plausibly an object/entity ID, a related-object kind, or
  a table index handed to the spawner. Whatever the callee returns in r0-r7 and the flags is effectively this routine''s
  return contract, matching the lifter''s caller analysis (callers see r4-r7 as outputs because the callee sets
  them; r4 is genuinely preserved by this stub itself).

  '
