    - `bl battle_getSelectedChipForUse_800ED90` then `tst r3, r3; beq loc_810DB1C` shows the gate is "selected
    chip present" (battle_enemyAI_preCheckChipUsage_810DAF0:8-10). - `bl battle_getStateUnk40_800A704` then `cmp r0, #0x12c; blt loc_810DB1C`
    shows the second gate is BattleState.oBattleState_Unk_40 >= 0x12C (battle_enemyAI_preCheckChipUsage_810DAF0:14-17). - The triple
    `bl somethingWriteChipParams_80126E4 / bl object_setAttack0 / bl sub_800F322` before `mov r6, #1`
    is the consumption sequence (battle_enemyAI_preCheckChipUsage_810DAF0:18-22). - Caller sub_810D998 comment confirms: nonzero return
    pauses AI, zero runs the state jump table (callers). - All six captured snap_story9_* invocations
    return r0=0 (flags -Z--), i.e. the threshold 0x12C has not been reached on those story9 frames, consistent
    with the pre-check semantics.'
