name: battle_enemyAI_preCheckChipUsage_810DAF0
address: '0x0810DAF0'
kind: function
previous_names:
- sub_810DAF0
status: probable
summary: 'Battle enemy AI pre-check: if the actor has a chip selected for use and the battle state''s
  Unk_40 has reached 0x12C, write chip params, set attack 0 and reset state, signalling the AI to pause
  its state handler.'
interface: '(r5 = BattleObject*, r10 = BattleState*) -> r0 = bool pauseAI ; side effects: writes AI params,
  sets attack index to 0, resets selected chip state, may advance BattleState-derived counters'
details: "- Saves r4/r6/lr, sets r6=0 (default \"do not pause AI\").\n  - Calls battle_getSelectedChipForUse_800ED90(r0=r5)\
  \ to fetch the chip the actor in r5 has queued for use. If the returned chip (r3) is nonzero, the function\
  \ takes the chip-low-byte path.\n  - Masks the returned chip id down to a byte (lsl #0x17 / lsr #0x17,\
  \ i.e. (r0 & 0xFF)) into r4.\n  - Calls battle_getStateUnk40_800A704() to read the current value of\
  \ BattleState.oBattleState_Unk_40 (r10). If it is < 0x12C (300), the AI is allowed to proceed (skip).\n\
  \  - Otherwise calls somethingWriteChipParams_80126E4(r0=r4) to write the chip params from the selected\
  \ chip id, then object_setAttack0() to push attack index 0 on the actor, then sub_800F322() to clear/reset\
  \ the chip-usage state on the actor.\n  - Sets r6=1 indicating \"AI should pause this tick\" and falls\
  \ through to the exit which returns r6 in r0.\n  - The caller sub_810D998 treats a nonzero return as\
  \ \"pause\", and a zero return as \"run the AI state's jump table entry\".\n  - Net effect: a one-shot\
  \ gate that, once the battle has advanced past frame/counter 0x12C and the actor has a chip selected,\
  \ consumes the chip (writes params, attack0, clears state) and pauses AI for this frame.\n"
