summary: Per-tick AI attack update that cancels the Beast Out spam (atkvars Unk_10) once elapsed and tears
  down its state.
interface: '(r5 = ActorBattleObjectPtr, r6 = ?, r7 = ActorAIDataPtr, r10 = ToolkitPtr, lr = caller) ->
  r0 = new Alliance value passed to sub_800AB2E ; side effects: edits ActorAIData->AttackVars offsets
  0x01 and 0x10, clears AIData bits 0x80 / 0x80000, AIData->Unk_44 bits 0x80008600, battle-state flags
  0x20, then calls object_exitAttackState'
details: "Initial guard: ldrb r0,[r7,#oAIAttackVars_Unk_01]; tst r0,r0; bne loc_8014CD0 — when AttackVars\
  \ byte 0x01 hasn't been primed yet, it seeds AttackVars_Unk_01 = 4 and AttackVars_Unk_10 = 0x14 (a 0x14-frame\
  \ window, matching the count-downs seen across consecutive captured snapshots: 0x13, 0x12, ..., 0x06).\n\
  \  Each call decrements AttackVars_Unk_10 (`sub r0,#1 / strh r0,... / bge locret_8014CFE`) and returns\
  \ while it is still >=0; the captured snapshots show the field decreasing monotonically through r0 in\
  \ r0={0x13,0x12,0x09,0x08,0x07,0x06}.\n  When the counter underflows: ldrb r0,[r5,#oBattleObject_Alliance],\
  \ mov r1,#0xb, mov r2,#1, bl sub_800AB2E (the captured-call r0=0x0c / r1/lr out of band match this same\
  \ template across calls, so sub_800AB2E is likely an \"object state/Alliance\" resolver). It then clears\
  \ bit 0x80 in AIData via ClearAIDataUnk0x48Flag, clears bit 0x20 in BattleState via battle_clearFlags,\
  \ clears bits 0x80000 in AIData, clears bits 0x80008600 in AIData->Unk_44 (where bit 0x8600 looks like\
  \ a BeastOut/transform flag pair), and finally bl object_exitAttackState to leave the attack state cleanly.\n\
  \  Callee ordering and the AttackVars prefix tell us this is the dedicated per-actor tick for the \"\
  beast spam\" / counterattack-style move that MMBN6 uses (the captured-call snapshot name `snap_beastsp_*`\
  \ corroborates).\n  The \"_ADDRESS\" suffix is kept: while the role is clearly \"end the beast-out counter\
  \ timer and clean up\", the exact bit meanings (0x80, 0x80000, 0x80008600, 0x20) are inferred from context.\n"
