name: aiAttackDispatch_8109DD2
address: '0x08109DD2'
kind: function
status: confirmed
summary: Dispatches an AI attack by selecting one of two handlers based on the attack-var type byte.
interface: 'void sub_8109DD2(void); // in: r2 r5 r6 r7 r10 lr; out: r1 r5 r8 r9 r10 r11 r12; clobbers
  nz c v r0 r2 r3 r4 r7 lr; preserves r6'
details: 'Acts as a thin trampoline that reads an 8-bit type/dispatch index at

  oAIAttackVars_Unk_00 of the AI attack vars struct pointed to by r7,

  uses it to load a Thumb handler address from a two-entry table at

  off_8109DE4, then tail-calls that handler (bx r1 with lr pre-loaded).

  The two handler slots are sub_8109DEC (idx 0) and sub_8109E4A (idx 1).

  Because both handlers use a full-register calling convention (all of

  r0-r12 and lr passed through), this is implemented as a virtual

  dispatch via a shared 1-byte dispatcher (off_8109DE4) rather than as

  a normal function call; r6 is preserved across the dispatcher frame

  but pushed/popped here so the callee''s r6-banked use is hidden from

  the caller. In game terms: chip/AI attack processing picks its

  sub-routine off the AIAttackVars struct''s leading type byte.


  Register form kept (C call semantics could not work): full-register virtual dispatch via a 2-entry Thumb
  jump table at off_8109DE4, with r6 callee-banked via push/pop.'
