name: object_spawnDestroyEffectAndDie
address: '0x080DA956'
kind: function
status: probable
summary: 'Kills the battle object at r5: spawns an effect (type 0) at its position offset 10 units, clears
  its collision region, and marks it destroyed.'
interface: (r5 = battle object, implicitly; no args in r0-r3) -> r0 = spawned effect object pointer (from
  spawn wrapper); sets object state to CUR_STATE_DESTROY
details: Loads three consecutive words from r5+0x34 (likely the object's position/coordinate triple) and
  adds 0xA<<16 (10.0 in fixed point) to the third word, presumably a y-offset so the effect appears lower
  on the sprite. It then calls spawn_t1_0x0_EffectObject, which spawns a type-4 battle object with effect
  type 0 (likely the standard destruction puff/explosion). After spawning, object_clearCollisionRegion
  removes the object from collision detection, and it stores CUR_STATE_DESTROY into r5's CurStateActionPhaseAndPhaseInitialized
  field, ending the object's normal behavior. The r5 usage means it is a per-object helper, not a standalone
  routine, and it uses no other fields.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldmia from r5+0x34 plus r3 += 0xA<<16 feeds position data into the effect spawn (asm lines 2-7);
