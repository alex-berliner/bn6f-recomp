name: eventflags_ClearTwoHalfwordsAt2DE_802F0D8
address: '0x0802F0D8'
kind: function
status: confirmed
summary: Clears a group of 2 event flag halfwords (32 flag bits) starting at offset 0x2DE in the toolkit's event
  flags buffer.
interface: void sub_802F0D8(void); /* reads r10 (toolkit ptr); r2/r3 preserved; clobbers r0,r1,lr,NZCV */
details: Loads the toolkit's event flags pointer via [r10 + oToolkit_EventFlagsPtr], adds offset 0x2DE, and calls
  ZeroFillByHalfword with a count of 2 halfwords, zeroing event flags 0x2DE-0x2E1 (32 flag bits). This looks like
  a bulk reset of a specific flag group; r2 and r3 are preserved through the call even though callers appear to
  pass values in them (they are listed as inputs but the function ignores them, and the contract lists them as outputs
  because they are preserved). No return value.
