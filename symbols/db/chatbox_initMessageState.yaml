name: chatbox_initMessageState
address: '0x08131864'
kind: function
status: probable
summary: Zeros the 0x80-byte chatbox message buffer at unk_2037700, resets byte 0xC to 0 and byte 0x70
  to 1, sets bit 3 of the owning object's status byte at r5+0x1B, then tail-calls chatbox_8040818 to set
  up a new message.
interface: (r5 set by caller = owning object/state pointer) -> r0 = clobbered by calls; [r5+0x1B] bit
  3 set
details: The routine zero-fills 0x80 bytes at unk_2037700 (the message/text buffer), then sets byte 203770C
  (offset 0xC in the buffer) to 0 and byte at offset 0x70 to 1, likely clearing a length/cursor and marking
  the buffer in use. It also ORs bit 0x8 into the byte at r5+0x1B of an object passed via r5 (never set
  inside, so the caller must preload it), presumably a 'text active/queued' status flag. Finally it calls
  chatbox_8040818, so this looks like setup before displaying or refreshing chatbox text.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl ZeroFillByWord with r1=0x80 over unk_2037700 zeroes the message buffer; strb r0,[r4,#0xC]
    and strb r0,[r4,#0x70] set buffer header fields 0/1; ldrb/orr/strb on [r5,#0x1B] with 0x8 toggles
    a status bit of the caller-provided object; trailing bl chatbox_8040818 ties it to the chatbox subsystem;
    sole caller sub_8130D40 must supply r5, implying per-object text state
  refs:
  - bn6f/asm/asm36.s:3213
  - 0x08130D40 sub_8130D40
