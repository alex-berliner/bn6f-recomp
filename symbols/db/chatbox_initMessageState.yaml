  - 0x08040818 chatbox_8040818
  reproduce: python3 tools/asmcat.py 0x08131864
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: it zero-fills 0x80 bytes at unk_2037700, writes 0 to offset 0xC,
    writes 1 to offset 0x70, OR-s bit 3 into r5+0x1B, and tail-calls chatbox_8040818. However, chatbox_8040818
    is a tail call (no pop between bl and ret), making this just initialization that resets state. The
    proposed name fits but a name reflecting state reset plus chatbox setup is fine; ''chatbox_initMessageState''
    conveys this adequately and the summary is accurate, though note r5 is never set by the function itself
    and r5+0x1B is the only object-state flag touched here.; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
