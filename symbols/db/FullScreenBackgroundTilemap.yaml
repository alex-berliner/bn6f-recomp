name: FullScreenBackgroundTilemap
address: '0x086A34E0'
kind: data
status: probable
summary: 'Proposed name: FullScreenBackgroundTilemap. 30x20 background tilemap (u16 tile IDs) loaded into
  BG tile block 3 for a full-screen background display. (table of u16)'
details: byte_86A34E0 is referenced exclusively by t3_showFullScreenBackground, which loads its address
  into r3 and passes it as the tile_ids parameter to CopyBackgroundTiles along with tile-block 3 and dimensions
  0x1e (30) by 0x14 (20), i.e. a full-screen 30x20 tilemap. The 564 bytes match a 30x20 array of u16 tile
  IDs. The repeated 0xD27F pattern is raw tile ID data. This is a standalone ROM tilemap table consumed
  by the BG copy routine.
