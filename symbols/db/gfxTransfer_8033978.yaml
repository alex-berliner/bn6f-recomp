name: gfxTransfer_8033978
address: '0x08033978'
kind: function
status: confirmed
summary: Queues graphics (sprites/font tiles) into VRAM appropriate to the current map group, then runs a follow-up
  transfer for non-Internet maps.
interface: "void loadMapGroupGFX_8033978(void)\n  // inputs:  r10 = caller's \"toolkit\"/game-state base ptr (read\
  \ via oToolkit_GameStatePtr -> oGameState_MapGroup); lr = return\n  // outputs: none directly; r0/r1/r2/r3/r5/r7\
  \ trashed by callees\n  // clobbers: r0, r1, lr, N/Z (and C/V as set by callers)\n  // preserved: r4, r5, r6,\
  \ r7 (note r5 clobbered by callees inside the call; only r7 spans the asm frame)\n"
details: "Inspects the current map group via r10 -> oToolkit_GameStatePtr -> oGameState_MapGroup.\n- If map_group\
  \ < INTERNET_MAP_GROUP_START (regular overworld map): queues one block,\n  dword_86C0D20 -> 0x6017200, 0x100 bytes,\
  \ then calls gfxTransfer_8033DA0(0).\n- Else (Internet map group): queues two blocks, byte_86C1F80 -> 0x6017200\
  \ (0x340 bytes)\n  and byte_86C1F20 -> byte_30016D0 (0x20 bytes). No follow-up call.\nAll transfers go through\
  \ QueueEightWordAlignedGFXTransfer; r5 is loaded with a pointer that\nis never used. The function only pushes/pops\
  \ {r4-r7,lr}; r7 holds the game-state pointer\ncarried from r10 for the duration of the frame.\n"
