name: battle_stepDispatchByEntityArg2
address: '0x0812ABEC'
kind: function
status: probable
summary: Battle entity step routine that calls one of four per-entity handlers selected by a byte at [r5,#2],
  then runs the standard wait-for-state battle update.
interface: (r5 = entity/work struct) -> r0 = result of battle_stepWaitForStateRunUpdate; no flags meaningful
details: Loads a table pointer at off_812AC00 (pointing at off_812AC04, a 4-entry table of Thumb handler
  addresses), reads a byte index from offset 2 of the struct in r5, and calls the selected handler (sub_812AC1A
  for index 0, sub_12ACF0 for index 3, sub_812AC80 shared for indices 1 and 2) via mov lr,pc / bx r0.
  After the handler returns it tail-calls battle_stepWaitForStateRunUpdate, which drives the common battle
  frame update (commands 0x12/0x13/0x1c depending on state). So this is a dispatcher wrapper, not logic
  itself; the actual behavior lives in the four unseen handlers. Indices 1 and 2 sharing a handler suggests
  the byte is a small subtype/state selector rather than an entity ID.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#2]; ldr r0,[r0,r1]; mov lr,pc; bx r0 — indexed call into a 4-entry handler table
    keyed by a struct byte; off_812AC04 holds sub_812AC1A+1, sub_812AC80+1 twice, sub_812ACF0+1 (Thumb
    addresses); bl battle_stepWaitForStateRunUpdate after the dispatch — standard per-frame battle state
    update always runs
