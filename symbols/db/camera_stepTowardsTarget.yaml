  reproduce: python3 tools/asmcat.py 0x080A58F4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior: sign-aware step toward [r5+0x24] for [r5+0xc], then [r5+0x28]
    for [r5+0x10], with checkZCoordModifiers_8031612 called on &r5+0xc and result lsl-extended into [r5+0x14]
    and [r5+0x20], and moved flag returned in r0. However, it does NOT set a ''moved'' byte at [r5+6]
    unconditionally — strb r4,[r5,#6] only runs when the corresponding coordinate is reached within step
    (loc_80A591A / loc_80A593E fall-through); also r0 is set to #1 by mov r4,#1, not by setting a field.
    Naming is fine but the summary''s ''reports whether anything moved'' and ''sets a moved byte'' phrasing
    is slightly off; callee name suggests camera-screen/Z, so ''camera'' prefix fits.; run wf investigate
