name: camera_stepTowardsTarget
address: '0x080A58F4'
kind: function
status: probable
summary: Steps a camera struct's x ([r5+0xc]→[r5+0x24]) and y ([r5+0x10]→[r5+0x28]) toward their targets
  by at most the given step, recomputing a derived z/screen value via checkZCoordModifiers_8031612 and
  storing it at [r5+0x14] and [r5+0x20]; returns 1 if any coordinate moved, else 0.
interface: (r0 = max step amount, r5 = camera/position struct from caller) -> r0 = 1 if any coordinate
  changed this call, else 0
details: 'For the pair current=[r5+0xc], target=[r5+0x24], it checks the distance; if the step r0 reaches
  the target it sets current equal within one step (sign-aware: adds when target>current, subtracts otherwise)
  and sets a ''moved'' byte at [r5+6]. The identical pattern runs for y: [r5+0x10] toward [r5+0x28]. If
  y moved (or even when only x path fell through at loc_80A594E), it calls checkZCoordModifiers_8031612
  with &r5+0xc and stores the halfword-extended result into both [r5+0x14] and [r5+0x20], keeping a derived
  field in sync with the position. Returns the moved flag in r0. Note r5 is not an argument register here
  — the caller must set r5 to the struct before the call.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_80A58FA-80A591E: sign-aware approach of [r5+0xc] toward [r5+0x24] by r0, sets [r5+6]=1
    on movement; loc_80A591E-80A594E: same approach pattern for [r5+0x10] toward [r5+0x28]; bl checkZCoordModifiers_8031612
    with r5+0xc, result stored to [r5+0x14] and [r5+0x20]; return value is the moved flag (mov r0, r4),
    typical of per-frame step functions polled by a caller'
  refs:
  - bn6f/asm/asm29.s:1502
