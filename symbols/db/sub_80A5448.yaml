summary: 'Initialize a battle cursor sprite: tag it as state type 3, load its graphics and idle animation, then
  enter the per-frame cursor handler.'
interface: void cursor_sprite_init_80A5448(struct sprite_state *r5 /* state */, void *r10 /* caller context */);
  clobbers r0-r3, r7, lr, N Z C V; r5 preserved; returns via tail-call to sub_80A5494
details: 'r5 points to a sprite state structure. Writes 3 to byte 0x00 (marks sprite

  state "type 3", likely a cursor flavor). Calls sub_80A54A4 to derive two

  pointers from r5: an 8-byte sprite_info blob (saved in r7) and an

  animation/frame data blob (saved in r4). Loads initial X (offset 0x0C) and

  Y (0x10) as halfwords shifted into fixed-point halves (`h << 16`), and

  zeroes a third fixed-point field at 0x14 (probably sub-pixel or scale).


  Then loads sprite tiles via sprite_load with tile-id 0x80 and palette/GFX

  bytes pulled from sprite_info[0..1]. Sets animation index from

  sprite_info[2] and runs the standard sprite setup trio:

  sprite_setAnimation, sprite_loadAnimationData, sprite_noShadow.

  Forces sprite priority 2 (renders above most backgrounds). Sets palette

  slot from sprite_info[3] at offset 0x05, and writes 4 to offset 0x08

  (likely a brightness/blend level or alpha flag).


  Ends with a tail call to sub_80A5494 — the per-frame cursor logic — so

  this function is effectively "spawn and enter loop".


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
