open_questions:
- What structure lives at 0x2036120 (save/shop/folder work area) and what its 0x1D0-byte records represent
- Meaning of ChipData field 0x1E (likely a max count or price-related quantity)
- What the callers (sub_800EE98, sub_802E2C4) use the return value for, and whether the r7 store-enable
  flag is ever cleared elsewhere in the family
- The caller's name 'getEntryPtr_2036120_1D0_802E070' and the pattern of having r0=index and r1=chip_id,
  with the chip-database lookup on r1, matches the proposal. The increment-and-cap logic against chipdata[0x1E]
  returning 0xFF on full is also correct. However, the prefix should reflect that this increments a counter,
  so 'increment' is not a valid registered prefix; better to use 'get' (e.g., getChipUseCount) or just
  'e' isn't appropriate either; 'req' or a game-action prefix fits, but 'increment' itself can be reframed
  as a getter/returner of remaining count.
