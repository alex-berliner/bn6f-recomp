name: ai_isPosInModeArea
address: '0x0808D098'
kind: function
status: probable
summary: Returns whether the (r0=x, r1=y) tile coordinate lies inside the AI mode's rectangular bounds
  in byte_808D0FC (true→1, false→0), with mode 1 having an L-shaped fallback and mode 3 testing y instead
  of x.
interface: (r0 = coord A, r1 = coord B) -> r0 = 1 if inside the mode's range, else 0; flags clobbered
details: 'Calls ai_getAIModeForMapGroup_808D084 to get the AI mode (3 for map group 0x85, else the MapNumber
  byte), then uses it*2 as an index into byte_808D0FC, an array of {min,max} byte pairs. It saves r0/r1
  on the stack (the callee presumably clobbers them), pops them back, and for non-3 modes tests r0 >=
  table[i] and r0 <= table[i+1], returning 1 only when in range. Mode index 1 has an extra fallback branch:
  if r0 < min, it instead passes when r0 >= table[8] (0x72) AND r1 >= table[9] (0x84), giving an L-shaped/second
  region. Mode 3 inverts the roles and range-tests r1 against table[0..1] instead. Result is returned
  in r0 via r6.'
