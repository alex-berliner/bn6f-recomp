name: ai_stepStrike
address: '0x080F9560'
kind: function
status: probable
summary: 'AI melee step: on first call, after canMove check, invokes AI''s panel-choose callback with
  Alliance-indexed args from byte_80F95C4, stores returned panel into FuturePanelX/Y, reserves it, sets
  CANNOT_SLIDE flag, plays anim 4 and starts a StepTimer of 3; once the timer expires, writes 4 to HitElement
  to hand off to the hit phase. Aborts via object_exitAttackState on failure.'
interface: (r0 = ignored, state in r5 = battle object, r7 = AI attack vars) -> r0 = clobbered; sets oBattleObject_FuturePanelX/Y,
  CurAnim, AI HasMoved/StepTimer/HitElement
details: On the first invocation (AttackElement == 0) it stores 4 into oAIAttackVars_AttackElement as
  a state marker and checks object_canMove. If free, it indexes byte_80F95C4 by Alliance*8 to get two
  words passed as deltas/args to the oAIAttackVars_PanelChooseCallback (called with r0 = oAIAttackVars_TargetObjectPtr);
  the callback returns the chosen panel X/Y in r0/r1, which are stored into oBattleObject_FuturePanelX/FuturePanelY.
  It then claims the panel with object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1,
  plays animation 4, sets HasMoved = 1 and StepTimer = 3. On later invocations (AttackElement == 4) it
  counts StepTimer down and, when it reaches 0, stores 4 into oAIAttackVars_HitElement (likely handing
  off to the damage phase). If movement or panel selection fails, it clears HasMoved and resets via object_exitAttackState.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst AttackElement / strb #4: two-phase state machine keyed on oAIAttackVars_AttackElement;
    bl object_reservePanel after storing FuturePanelX/Y from the callback return; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE;
    bl object_setFlag1 prevents sliding during the attack; ldr r2/[r0],r3/[r0,#4] from byte_80F95C4[Alliance*8]
    passed to PanelChooseCallback called via mov lr,pc; bx r1; StepTimer countdown ending in strh 4 to
    oAIAttackVars_HitElement matches AI attack-tick pattern'
  refs:
  - bn6f/asm/asm31.s:138703
  - 0x0800E5E2 object_canMove
  - 0x0801BB1C object_reservePanel
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080F9560
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly correct: first call stores 4 in AttackElement as state marker, checks object_canMove,
    indexes byte_80F95C4 by Alliance*8 to pass two words to PanelChooseCallback, stores returned r0/r1
    into FuturePanelX/Y, then reserves panel, sets CANNOT_SLIDE, plays anim 4, sets HasMoved=1 and StepTimer=3
    (via strh, so it''s a halfword). On later calls it decrements StepTimer and when 0 stores 4 into HitElement
    (note: the asm uses strh for HitElement, matching a halfword field, while HasMoved uses strb). The
    proposal''s small value error is calling StepTimer a byte and HitElement a byte field; the code uses
    strh for both StepTimer and HitElement. Otherwise the name and summary match well.; run wf investigate
    investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
