name: ai_attackRecoverState
address: '0x080F10CE'
kind: function
status: probable
summary: 'AI attack-state step handler: arms a 30-frame recovery timer for an attack flagged with element
  4, then ends the attack when it expires.'
interface: (r7 = battle object AI attack vars, r5 = battle object) -> r0 = 0; no meaningful flags
details: If oAIAttackVars_AttackElement on the object's AI attack vars is 0, it sets that field to 4 and
  loads oAIAttackVars_StepTimer with 0x1E (30 frames), keeping the attack active until the timer runs
  out. On subsequent calls it decrements StepTimer each frame and returns while it is still positive.
  When the counter reaches 0, it zeroes the object's oBattleObject_CurAnim (resetting the animation) and
  calls object_exitAttackState to leave the attacking state. The element value 4 is a constant baked into
  this handler, so it is specific to one enemy/AI attack kind.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] + strb #4 initializes the element and strh #0x1e
    starts a 30-frame oAIAttackVars_StepTimer (lines 2-6); loop at loc_80F10E0 decrements StepTimer and
    returns via bgt while counting down; on expiry: strb 0 to r5,#oBattleObject_CurAnim resets the animation;
    bl object_exitAttackState shows it terminates an AI attack state; no known callers, consistent with
    a state-handler reached via a dispatch table'
