name: battle_spawnType70LinkedObject
address: '0x080D2986'
kind: function
status: probable
summary: Spawns a battle object of type 0x70 at a given panel/element, links it two-way with an owner
  object, inherits the owner's alliance, and marks it with object flag 0x10.
interface: (r0 = panel X, r1 = panel Y, r2 = element, r3 = pass-through spawn arg, r5 = owner battle object,
  r6 = ptr to slot to receive new object ptr, r7 = extra value) -> r0 = new object or 0 on spawn failure
details: Saves the caller's r0-r2, calls object_spawnType3 with type 0x70 while passing the remaining
  args through, and bails out if the spawn failed (beq checks the spawn's return). On success it fills
  the new object's PanelX/PanelY/Element from the saved r0-r2, copies AllianceAndDirectionFlip from the
  owner object in r5, stores the owner in oBattleObject_RelatedObject1Ptr, and stores r7 in ExtraVars.
  It writes the new object's pointer into *r6 (ExtraVars+4 of the new object also holds r6), giving a
  two-way owner/child link. Finally it sets bit 0x10 in oObjectHeader_Flags, likely marking the object
  as spawned-from/attached-to-another. Note r5-r7 are read but r6/r7 are not saved, so the caller must
  set them up — a private calling convention, not the standard one.
