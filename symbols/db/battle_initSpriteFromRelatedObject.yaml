name: battle_initSpriteFromRelatedObject
address: '0x080C11CC'
kind: function
status: probable
summary: Initializes a battle object's sprite (ID 0x80, no shadow), copying the palette from its related
  object, then starts animation 7 and enters the update state.
interface: (r5 = battle object, args r0=0x80 sprite ID, r1=4, r2=0x10) -> r0 = result of sub_80C1204;
  object state word set to CUR_STATE_UPDATE
details: Runs entirely on the battle object held in r5. It loads sprite 0x80 with parameters 4 and 0x10,
  attaches animation data, and flags the sprite to render without a shadow. It then reads the related-object
  pointer at oBattleObject_RelatedObject1Ptr, fetches that object's sprite palette via sprite_getPalette,
  and writes it onto this object with sprite_setPalette. Animation index 7 is selected, animation data
  is (re)loaded, and sprite_update runs once. Finally the state/phase word oBattleObject_CurStateActionPhaseAndPhaseInitialized
  is set to CUR_STATE_UPDATE before tail-calling sub_80C1204. The palette copy suggests the sprite is
  meant to visually match the related object (e.g. a shared effect or clone).
