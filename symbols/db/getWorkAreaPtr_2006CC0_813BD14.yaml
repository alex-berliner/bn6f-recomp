summary: Tiny helper that loads the base address of the IWRAM data block at 0x2006CC0 into r7 (a work-area/global-struct
  pointer getter).
interface: 'void getWorkAreaPtr_2006CC0(void); // out: r7 = &unk_2006CC0'
details: 'Two-instruction thunk: ldr r7, =unk_2006CC0 then mov pc, lr, returning directly to the original caller
  (uses lr as return target, so it is meant to be called from code that will continue from lr, e.g. after a literal-load-style
  call). It hands back the address of the 0x2006CC0 work area in IWRAM so callers can access that structure; the
  neighboring literal pool also holds pointers to unk_2006CF8 and unk_2006C88, suggesting this tiny function sits
  among similar accessors for adjacent related blocks (possibly one struct split across the three addresses). No
  registers or flags other than r7 are touched. The actual meaning of the 0x2006CC0 block is not determined from
  this function alone.'
