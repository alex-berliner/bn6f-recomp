name: sub_8046154
address: '0x08046154'
kind: function
status: confirmed
summary: Dispatches an animation opcode stream against the Toolkit's animation state, decoding commands until a
  finalizer is run.
interface: "void sub_8046154(u32 r0 /* stream ptr */,\n                 u32 r2 /* src data */,\n               \
  \  u32 r3 /* finalizer arg */,\n                 u32 r4 /* stream ID */,\n                 u32 r5 /* bank */,\n\
  \                 u32 r6 /* base ptr */,\n                 u32 r7 /* dest buf */,\n                 u32 r10 /*\
  \ toolkit */);\n// preserves r4-r7; clobbers r0-r3, r8, r9, r11, r12, lr; flags nzcv\n"
details: 'Initializes the Toolkit''s per-animation state struct (byte ptr at toolkit + oToolkit_Unk200a220_Ptr):

  byte[0] = (stream_id<<3); byte[1] = 0; byte[2] = bank; word[0x18] = base ptr;

  word[0x1C] = 0; word[0x20] = src; word[0x24] = dest buf;

  word[0x30] = 0; word[0x34] = 0; word[0x38] = block table ptr (preserved across call);

  word[0x3C] = 0. Then fill (stream_id<<3) * (bank<<4) 8-word blocks from the block

  table via FillByEightWords, and zero an 8-word scratch buffer via ZeroFillByEightWords.


  The function then runs a decode loop keyed by the byte pointed to by r0: opcodes

  >= 0xE5 dispatch through a jump table anchored at off_80460F4; op == 0xE4 reads a

  two-byte argument (next byte + 0xE4) and calls sub_80461D0; any smaller value calls

  sub_80461D0 with the opcode byte itself. Handlers advance r0 by 1 or 2 bytes and

  maintain a continue flag in r3. When r3 clears, the original r3 is restored from

  the stack and sub_8046290 is called as a finalizer. Callee-saved r4-r7 are

  restored before return.

  '
