name: battle_drawHandEmptySlotMarker
address: '0x0801D65C'
kind: function
status: probable
summary: Draws a fixed two-tile OAM marker at the object's projected screen position when its battle hand
  slot is empty (0xFFFF) and the linked 0x2036120 record has either of two marker halfwords set.
interface: (r5 = context struct; uses [r5+0x48] object ptr) -> void; queues OAM entries via sprite_queueOamEntry
details: 'Reads the byte at object+0x16 as a hand index and fetches the hand slot from 0x20349C0 (0x50-byte
  strides); reads the u16 at offset 2*(slot.field0+1) and bails unless it is 0xFFFF. Then it fetches the
  same-indexed 0x1D0-stride record from the 0x2036120 array and requires halfwords at +0x36 and +0x38
  to be nonzero. It projects the position struct at object+0x34 to screen space (projectObjectToScreen)
  and skips if off-screen. sub_801D6D8 supplies a packed coordinate that is masked to y:9 bits / x:8 bits
  into r6. It queues two OAM entries: (0x40004000+r6, attr2=0xC7B4) and (x+9, attr2=0xC7B8), i.e. tiles
  0x3B4/0x3B8 in palette 0xC with 0x4000 shape/size bits, a fixed graphic rather than chip art.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[obj+0x16]; bl getBattleHandAddr_8010018; ldrh entry at (field0+1)*2; cmp r0,0xFFFF
    gates the whole draw; getEntryPtr_2036120_1D0 with the same index; halfwords [r0+0x36] and [r0+0x38]
    must be nonzero to continue; bl projectObjectToScreen_800362C on [r5+0x48]+0x34; visibility flag in
    r2 gates the OAM queueing; sub_801D6D8 result masked to 0x1FF<<16 | 0xFF and packed into r6 as y<<16|x;
    two sprite_queueOamEntryThunk calls with attrs 0xC7B4 then 0xC7B8 and packed coords 0x40004000+(y<<16|x),
    second at x+9
  refs:
  - bn6f/asm/asm00_2.s:30258
  - 0x08010018 getBattleHandAddr_8010018
  - 0x0802E070 getEntryPtr_2036120_1D0_802E070
