  reproduce: python3 tools/asmcat.py 0x0801D65C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code and callee behavior match the proposal: it checks hand slot for 0xFFFF, validates two halfwords
    in the 0x2036120 record, projects position, masks coordinates, and queues two OAM entries (0xC7B4,
    then 0xC7B8 with x+9). However, the function bails when EITHER halfword at +0x36 or +0x38 is zero
    (cmp/bne into a fallthrough), not requires both nonzero — the proposal overstates this. Also naming:
    this is clearly drawing an ''empty'' slot indicator on the battle hand UI, so the name fits, but the
    summary should drop the wrong ''requires nonzero'' clause.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
