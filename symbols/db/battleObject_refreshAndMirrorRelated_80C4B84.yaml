name: battleObject_refreshAndMirrorRelated_80C4B84
address: '0x080C4B84'
kind: function
status: confirmed
summary: Refreshes the current battle object's animation slot and active flag (alliance-gated), mirrors extra-variable
  state from its related object, syncs direction/sprite flip, handles an emotion data pointer, and frees its memory.
interface: "void sub_80C4B84(void); /* r5 = battle object in; r4 = related object out;\n                       \
  \   nz,c,v,r0,r1,r2,r3,lr clobbered; r5,r6 preserved */\n"
details: "Runs as an object update step for a battle object whose RelatedObject1Ptr\npoints to a partner/source\
  \ object.\n\n1. Calls sub_80C4C52 to compute the new animation index and stores the\n   result byte in oBattleObject_CurAnim.\n\
  \n2. Sets bit 0x02 of oObjectHeader_Flags (the \"ANIM_ACTIVE\" gate), then\n   checks oBattleObject_Alliance via\
  \ sub_800EB6C. If invalid, the same\n   bit is cleared. If valid, the bit is set again, but it is cleared a\n\
  \   second time when oBattleObject_Unk_0c is zero.\n\n3. Calls nullsub_10 (no-op wrapper).\n\n4. Loads oBattleObject_RelatedObject1Ptr\
  \ into r4 and queries\n   object_getFlag on it; if bit 0x04 is set, clears the active flag on\n   the main object.\n\
  \n5. Copies three words at offset 0x34 (oBattleObject_ExtraVars) from the\n   related object into the main object\
  \ (r4→r5 via ldmia/stmia), then\n   copies oBattleObject_DirectionFlip byte. Re-applies the sprite\n   horizontal\
  \ flip via object_getFlip + sprite_setFlip so the mirrored\n   state matches.\n\n6. If the pointer at oBattleObject_ExtraVars+4\
  \ (transitive: the u32 it\n   points to) is non-zero, calls\n   callPossiblyGetBattleEmotion_8015B54(alliance).\
  \ On result != 2 it\n   zeroes that pointed-to u32; on result == 2 it early-returns without\n   freeing memory.\n\
  \n7. On the fall-through path, calls object_freeMemory(r5).\n\nr4 (the related-object pointer) is returned to\
  \ the caller via the\npush/pop wrapper. Preserves r5 and r6 for the caller; everything else\nplus flags are clobbered\
  \ by the final callee chain.\n"
