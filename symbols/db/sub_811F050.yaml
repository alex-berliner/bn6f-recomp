name: sub_811F050
address: '0x0811F050'
kind: function
status: confirmed
summary: Renders the "map names" text screen (text script 0xF2) into a work buffer and uploads the resulting tiles/tilemap
  to VRAM.
interface: void drawMapNamesScreen_811F050(void); // no meaningful inputs; returns sub_803D0F4's result indirectly
  via the toolkit struct
details: "Screen-drawing routine for a map-name display (likely a menu/library map list).\n1) Calls sub_803D0F4\
  \ and stores its return value at +8 of the toolkit's\n   oToolkit_Unk200a220_Ptr struct (fetched via R10).\n2)\
  \ Calls renderTextGfx_8045F8C to render text script 0xF2 (TextScriptMapNames)\n   into the unk_200C2A0 text-render\
  \ buffer: 6 rows (R4=6) starting at row 0\n   (R3=0), with R5=1 and font/glyph data dword_86A5D60.\n3) Calls sub_811F5DC\
  \ to upload the rendered graphics from unk_200C2A0 to the\n   VRAM tile area at 0x6015400, using byte_200D220\
  \ as tilemap/destination\n   info and 6 (rows) as the height argument.\nOnly r4-r7 are preserved from the caller\
  \ (pushed/popped); all other registers\nand flags are clobbered. No inputs are actually read despite the broad\
  \ caller\ncontract — treat as void(void).\n"
