name: battle_stepVerticalPanelAttackWindup
address: '0x080BB0D2'
kind: function
status: probable
summary: Object attack-phase step that highlights a 1x2 vertical panel area for 16 frames as an attack
  windup, then advances the phase script.
interface: (r5 = battle object) -> r0 = 0; updates oBattleObject_Timer/Timer2/CurAnim/CurPhaseAndPhaseInitialized
details: State-machine step for a battle object. On first entry (PhaseInitialized==0) it stores Timer=0x10
  and PhaseInitialized=4, so the windup lasts 16 frames. Every frame it calls battle_highlightTwoVerticalPanels
  to flash a 1x2 area on the object's grid side, decrements Timer2 (an independent counter, likely for
  a sound/effect trigger elsewhere), and when Timer reaches 4 switches the object to animation 0xC (telegraph
  pose). When Timer underflows it calls sub_80BB1FE (presumably spawning/firing the actual attack), resets
  Timer to 0x3C and moves the phase script to phase 0xC, which is presumably the attack-execution phase.
