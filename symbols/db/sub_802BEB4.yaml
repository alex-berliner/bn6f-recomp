name: sub_802BEB4
address: '0x0802BEB4'
kind: function
status: confirmed
summary: Trampoline that reads a battle object's type byte and tail-calls the matching per-type handler (input-queue
  pop, tick countdown, or animation state picker) through the table at A_off_802BEC8.
interface: "void battle_objectDispatchByType_802BEB4(void /* r5 = object pointer */);\n  reads:   r5 (object base),\
  \ [r5+3] (type byte), table at A_off_802BEC8\n  writes:  none of its own; output registers r5–r12 plus r0–r4 and\
  \ flags are\n           whatever the dispatched handler returns\n  status:  nz c v clobbered by the handler; lr\
  \ pushed/popped, otherwise preserved\n"
details: "The body is essentially a jump-table dispatcher: it loads the object's type\nbyte from offset 3, indexes\
  \ the table at A_off_802BEC8 (an array of Thumb\nfunction pointers plus-1 for bx), and bx's into it. Only the\
  \ r0/r1 mapping\nis preserved for the new target (r0 = type byte, r1 = the freshly loaded\ntable entry), so any\
  \ arguments the caller wanted to pass must already be in\nthe guest register set. The three known targets are:\n\
  \  - custMenu_handleInputQueuePop_802BED4\n  - object_countdownTick_802BEFC\n  - battle_pickObjectAnimState_802BF0C\n\
  suggesting \"battle object\" is the right subsystem prefix. The push {lr} /\npop {pc} pair is a Thumb tr-call\
  \ trampoline; outputs of the callee are\npassed straight back, so this function does no work of its own.\n"
