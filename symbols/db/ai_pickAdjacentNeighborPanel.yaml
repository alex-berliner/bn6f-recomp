name: ai_pickAdjacentNeighborPanel
address: '0x08110FF4'
kind: function
status: probable
summary: AI helper that picks a random panel adjacent to the battle object's panel (up/down/left/right
  in facing-transformed coords), filtered by a flag check, using parameters indexed by the object's alliance.
interface: (r5 = battle object, read only) -> r0 = result from panelFlagCheck_8015D80 (chosen panel or
  0/none); r4-r7 preserved
details: 'Reads oBattleObject_PanelX/PanelY from the object in r5 and calls GetAllianceDependentPanelParamArgs
  with table byte_8111020, which holds one 8-byte entry per alliance: team 0 gives param 0x00000000/args-word
  bytes A0 00 88 0F, team 1 gives 20 00 00 00 / 80 00 88 0F, so the two teams pass different param/args
  values. The returned param word and args pointer are forwarded (along with r4 = byte_8111014) to panelFlagCheck_8015D80.
  byte_8111014 is a relative-offset candidate list: (0x00,0xFF), (0x00,0x01), terminated by the 0x7F marker,
  i.e. the two panels one row above and below the object''s panel in relative (facing-transformed) coordinates.
  panelFlagCheck transforms each offset by object_getEnemyDirection and randomly picks one passing the
  flag filter, so the function is a thin parameterized wrapper selecting a random vertical neighbor panel,
  differing per player/enemy side.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_PanelX] / ldrb r1,[r5,#oBattleObject_PanelY] feed the object''s
    panel coords to the param lookup (asm lines 2-4); off_8111120 -> byte_8111020 holds two distinct 8-byte
    alliance entries, matching GetAllianceDependentPanelParamArgs indexing by the alliance field; byte_8111014
    = 00 FF 00 01 00 7F: relative candidate list (0,-1),(0,+1) with 0x7F terminator passed as r4 to panelFlagCheck_8015D80;
    panelFlagCheck_8015D80 is documented as a filtered random relative panel picker that transforms offsets
    via object_getEnemyDirection; sole caller sub_8110F8C and the battlesweep route place this inside
    battle AI panel selection'
