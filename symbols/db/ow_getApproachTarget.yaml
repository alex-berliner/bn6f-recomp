name: ow_getApproachTarget
address: '0x080AA04C'
kind: function
status: probable
summary: Looks up an overworld object's approach target from a byte table and returns it as a 16.16 fixed-point
  value.
interface: (r0 = index into byte_2001130 table) -> r0 = signed byte value << 16 (16.16); flags clobbered
  by lsl
details: Reads a signed byte at byte_2001130[index] via ldrsb, then lsl r0,#0x10 to convert it to a 16.16
  fixed-point number, so table entries are small integers (likely -128..127 step/target values, e.g. pixels
  or distance). ow_updateApproachObject uses this as the target its object's +0x14 16.16 field counts
  toward one unit per frame, and for object kind 8 sets EVENT_1640 when the high word hits 0x20. ow_initObjectSprite
  also calls it, presumably to seed the initial +0x14 value. The table at 0x2001130 in IWRAM is likely
  filled per-map with per-object approach distances. r1 is used as scratch for the table pointer.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r1, off_80AA054 / ldrsb r0,[r1,r0]: signed-byte table lookup indexed by r0; lsl r0,#0x10:
    scales the byte to 16.16 fixed point; ow_updateApproachObject steps +0x14 by 1 toward the value returned
    here, so the return is a target; ow_initObjectSprite also calls it, consistent with initializing the
    same +0x14 field; target table byte_2001130 lives in IWRAM, so it is map/state-dependent data set
    elsewhere'
