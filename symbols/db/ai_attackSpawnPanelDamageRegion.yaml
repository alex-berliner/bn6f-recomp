name: ai_attackSpawnPanelDamageRegion
address: '0x080EEC08'
kind: function
status: probable
summary: 'AI attack step: places a damage-dealing collision region on the target panel and spawns the
  matching attack effect there, unless the panel has any bit of mask 0x1c00 set or AI difficulty is 0.'
interface: (r0 = battle object whose [0x54] points to target/attack data, r5 = battle object for alliance,
  r7 = AI attack-vars struct) -> r0 = spawned effect object or previous value; no meaningful flags
details: r0 is a battle object; it loads a pointer at [r0,#0x54] (r6) holding target panel coordinates
  at +0x12/+0x13. The routine bails unless AI difficulty tier is >= 1 or the word at [r6,#0x1c] is nonzero,
  and at difficulty 0 it does nothing at all; it also aborts if object_getPanelParameters for the target
  panel has any bit of mask 0x1c00 set (a group of terrain/status flags to avoid). It then computes damage
  as oAIAttackVars_Damage + oAIAttackVars_AttackBoost and calls object_spawnCollisionRegion with those
  coordinates, oAIAttackVars_InitFlag, element/hit data pointer 0x705FF04, and region kind 3. Finally
  it converts the panel coordinates to fixed-point screen coords and spawns a type-1 effect object there,
  packing difficultyTier+7<<16 plus the attacker's Alliance<<8 into the effect's parameter word.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb [r4,#0x12]/[#0x13] + object_getPanelParameters + tst 0x1c00 gates the attack on target
    panel terrain flags; ldr r6,[r7,#oAIAttackVars_Damage] / AttackBoost add then object_spawnCollisionRegion
    with data ptr 0x705FF04 and kind 3; object_getCoordinatesForPanels on the same 0x12/0x13 coords feeds
    spawn_t1_0x0_EffectObject with alliance/difficulty packed params; difficulty-tier checks (==0 bail,
    ==1 shortcut via [r6,#0x1c]) mark this as enemy-AI attack logic in oAIAttackVars
