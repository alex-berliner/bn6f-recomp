name: object_initParamVariant
address: '0x080D40A8'
kind: function
status: probable
summary: Initializes a battle object whose sprite, palette, HP, ExtraVars and timer are chosen by Param1
  (sprite 0x80 layer 0xa, NameID=0xdd+Param1, 60 HP, timer 0x960, ExtraVars=byte_80D4078+4*Param1), then
  sets up a 0x13x0x14 type-3 collision and enters CUR_STATE_UPDATE via sub_80D4144.
interface: (r5 = battle object) -> r0 = destroyed?; sets object fields, flags, state
details: Sets flag 0x2 on the object, loads sprite 0x80 layer 0xa, resets animation, applies flip and
  panel-based coordinates, zeroes Z, copies PanelXY to FuturePanelXY. NameID is set to 0xdd+Param1 and
  both HP and MaxHP come from a table (dword_80D4140, filled with 0x3C = 60 HP per variant). Timer is
  fixed at 0x960 = 2400 frames (~40s), ExtraVars points into byte_80D4078 at offset 4*Param1 (a per-variant
  data block whose byte 2 selects the palette). Allocates collision data (freeing the object on failure),
  sets up a 0x13x0x14-sized collision of type 3, runs presentCollisionData once, switches CurState to
  CUR_STATE_UPDATE, and calls sub_80D4144 (per-variant init).
