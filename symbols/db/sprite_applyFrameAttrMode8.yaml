name: sprite_applyFrameAttrMode8
address: '0x080A87D2'
kind: function
status: probable
summary: If the current sprite frame's attribute byte has bit 7 set, writes 8 to object field +8, then
  runs the sprite update.
interface: (r0 = object/sprite ptr passed to sprite_getFrameParameters; r5 = object ptr, pre-set by caller)
  -> r0 = result of sprite_update; no meaningful return
details: Calls sprite_getFrameParameters and tests bit 0x80 of the returned attribute byte; when set it
  stores the constant 8 into byte +8 of the object at r5, presumably selecting a render/blend mode or
  state for that frame. It then calls sprite_update on the same object, so the flag check is applied before
  the frame is drawn. Note the function never initializes r5 itself, so callers must set r5 to the object
  beforehand (a callee-saved-register convention rather than an argument). The route evidence only shows
  it under beastsp, suggesting it handles a Beast Out-specific frame attribute.
evidence:
