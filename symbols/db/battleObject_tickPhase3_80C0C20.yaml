name: battleObject_tickPhase3_80C0C20
address: '0x080C0C20'
kind: function
status: confirmed
summary: 'Battle-object phase-3 tick: on first entry, seed a 10-frame timer and mark initialized; once
  it expires, reset RelatedObject1 and advance the object''s phase to 4.'
interface: void battleObject_tickPhase3_80C0C20(struct BattleObject* r5 /* in/out */); // clobbers NZ/CV,
  r0, r1, r2, r3, lr; preserves r4, r5, r6, r7
details: 'Operates on a battle object held in r5, using offsets oBattleObject_PhaseInitialized,

  oBattleObject_Timer, oBattleObject_RelatedObject1Ptr, and oBattleObject_CurPhaseAndPhaseInitialized.

  First call into this phase: writes 0xA to the object''s timer field and sets the

  "phase initialized" byte to 4, then returns. Subsequent calls decrement the timer each

  tick; when it goes non-positive (i.e. counts down past 0 via BGT on a signed compare),

  it loads the RelatedObject1 pointer and calls sub_80E1332(obj, 0) to reset/initialize

  that linked object, then writes 4 to CurPhaseAndPhaseInitialized (likely storing the new

  phase number). Note the unusual signed comparison on a u16 timer field — the timer is

  treated as signed for the expiry check, so underflow into 0xFFFF keeps BGT true and

  delays expiry until it wraps back through 0.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
