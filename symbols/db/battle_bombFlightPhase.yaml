name: battle_bombFlightPhase
address: '0x080CEC7C'
kind: function
status: probable
summary: 'Phase handler for a thrown-bomb battle object: flies it forward at a per-type speed, highlights
  panels under it, and on landing cracks the panel, spawns an explosion effect, plays the bomb-hit sound
  and destroys itself.'
interface: (r5 = battle object; entry r0 ignored) -> mutates object X/Z velocity, Timer, CurPhase; on
  landing may crack panel and set CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY
details: 'On phase 0 it stores 4 into oBattleObject_CurPhase, reads the front direction, indexes byte_80CED18
  with Param1*8 to load an X/Z velocity pair (X multiplied by the +1/-1 front direction, Z negated — a
  forward-flying projectile), and sets Timer from byte_80CED3C[Param1] (20/18/16/14 frames). During flight
  it integrates X and Z, refreshes PanelX/PanelY via object_setPanelsFromCoordinates, and every 8 frames
  (Timer2>>3) highlights the panel it is over via object_highlightPanel using ExtraVars+4/+8. When the
  timer expires it checks the panel status word from object_getPanelParameters against an alliance-indexed
  mask (byte_80CED50: 0x15800010 for alliance 0, 0x2A800010 for alliance 1) and, if the panel matches,
  cracks it with object_crackPanel, spawns an effect object copying three words from object+0x34, plays
  SOUND_HIT_BOMB_1, calls sub_80CEE38, and always enters the destroy state afterwards. Param1 thus selects
  one of four bomb variants with different speeds and flight times.'
evidence:
