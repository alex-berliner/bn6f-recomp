name: sub_8016D08
address: '0x08016D08'
kind: function
status: confirmed
summary: 'Advances a single battle object one step through its panel-movement phase: promotes the future panel,
  dispatches the actor''s turn, resolves collisions, then queues the next panel displacement or resets the object
  to idle.'
interface: battleAdvanceObjectPhase_8016D08(r5 = BattleObject *obj) -> r0 = 4|8 (sub-phase state), r1/r2 = callee
  residue, nz from r0
details: 'Called with r5 pointing to a BattleObject. Sets MOVE_FLAG_BIT (1<<20) via object_setFlag1 to mark the
  object as in-motion, then calls battle_dispatchActorTurnByTypeAndAIIdx_800F404 to give the actor its turn. Clears
  RelatedObject1Ptr, promotes FuturePanelXY into PanelXY, then calls object_setCoordinatesFromPanels and object_updateCollisionPanels
  to sync pixel position and collision tiles. Clears the 0x1000 "phase-complete" flag and calls battle_resetCollisionState_800101C4.
  Releases the panel currently occupied by the object via object_removePanelReserve. Queries sub_800E45E which returns
  a signed dx (r0), signed dy (r1), and a phaseInitialized byte (r2); all three are stored into oBattleObject_Unk_1c,
  oBattleObject_Unk_1d, and oBattleObject_PhaseInitialized. If phaseInitialized != 0 the object has a pending step:
  XVelocity is set to 0xA0000 * dx and YVelocity to 0x60000 * dy (fixed-point per-panel movement speeds), FuturePanelX/Y
  are updated to current PanelX/Y + dx/dy, the new destination panel is reserved via object_reservePanel, and Unk_0d
  is set to 4 ("stepping" sub-state); r0 returns 4. If phaseInitialized == 0 the movement sequence is finished:
  CurPhase is set to 0x18 (idle), Unk_0d is set to 8 ("done" sub-state), and r0 returns 8. The nz flag is set from
  r0 by the caller adapter. Constants at 0x8016D80–0x8016D88 supply the flag values and velocity scalars. r6/r7
  are preserved across the call; all other registers are clobbered or read-back by the contract.'
