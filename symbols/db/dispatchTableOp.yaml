name: dispatchTableOp
address: '0x0803BFE8'
kind: function
status: probable
summary: 'Table-driven dispatcher: scans a 0xFF-terminated list of {matchFn, handlerFn} index pairs and
  runs the first handler whose match function accepts the halfword passed in r0.'
interface: (r0 = pointer to a halfword value, r1 = pointer to byte-pair list {matchIdx, handlerIdx}, 0xFF-terminated)
  -> void; may modify the halfword in place via the matched handler; caller detects change by comparing
  before/after
details: 'sub_803BFE8 holds r4 = off_803C208, a table of function pointers. It walks r1''s list two bytes
  at a time: byte0 indexes off_803C208 to pick a ''match'' function called as sub_803C018(fnPtr, [r0]
  halfword); a return of 0xFF means ''no match'' and it advances to the next pair (loc_803C00E). On the
  first non-0xFF match it stops scanning and calls sub_803C034(off_803C208[[r7+1]], ?, r0), passing the
  halfword pointer, which presumably reads/rewrites the halfword. Byte 0xFF terminates the list with no
  action. The sole caller (0x0803BFCC) selects one of two pair-tables (0x803C228 / 0x803C238) via r6,
  points r7 at a halfword entry, calls this, then re-reads the halfword and compares it to the pre-call
  value, so the interesting output is a possible mutation of the halfword (and the flags from that cmp).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_803BFF0: ldrb r0,[r7]; cmp r0,#0xff; beq locret_803C012 — list is 0xFF-terminated, entries
    are 2 bytes; bl sub_803C018 then cmp r0,#0xff; beq loc_803C00E — match fn returning 0xFF skips to
    next pair (add r7,#2); on match: ldrb r1,[r7,#1]; ldr r1,[r4,r1]; mov r2,r6; bl sub_803C034 then immediate
    return — handler dispatched and scan stops; off_803C208 is a pointer table; both bytes of each pair
    index into it, so pairs are {matchFn, handlerFn} indices; caller 0x0803BFCC: ldrh r4,[r7] before,
    ldrh r0,[r7]; cmp r0,r4 after — value may be rewritten by the handler'
  refs:
  - bn6f/asm/asm03_1_1.s:6499
  - 0x0803BFA0 sub_803BFA0
  - 0x0803C018 sub_803C018
  - 0x0803C034 sub_803C034
  reproduce: python3 tools/asmcat.py 0x0803BFE8
