name: sprite_setAnimation
address: '0x08002DA4'
kind: function
status: confirmed
summary: Sets the current animation index for an object's sprite slot by writing it into the slot's first byte.
interface: void sprite_setAnimation(u8 animIndex /*r0*/, ObjectHeader* obj /*r5*/)
details: 'Takes an animation index in r0 and an object header pointer in r5. The header''s TypeAndSpriteOffset byte
  (offset 2) encodes both the object type (low bits) and the sprite slot number (high nibble). The slot number (nibble
  << 4) is used as an offset from the object header itself, so each 16-byte sprite slot lives inline after the header.
  The animation index is stored at offset 0 of that slot (oObjectSprite_Unk_00), which downstream sprite rendering
  code presumably reads to select/advance the animation. Clobbers r3 and flags only; no memory beyond the one byte
  is touched. Trivial tail implemented with mov pc, lr.

  '
