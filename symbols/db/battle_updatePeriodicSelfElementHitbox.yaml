name: battle_updatePeriodicSelfElementHitbox
address: '0x080D0590'
kind: function
status: probable
summary: Battle object update that spawns an element-based hitbox on its own panel every 12 frames for
  a 30-frame lifetime, then destroys itself.
interface: (r0 = battle object, r5-relative oBattleObject struct) -> void; no meaningful return, sets
  oBattleObject_CurState to CUR_STATE_DESTROY on expiry
details: On first invocation (CurPhase == 0) it enters phase 4, sets oBattleObject_Timer to 30 and oBattleObject_Timer2
  to 12. Every frame it increments Timer2, and each time it reaches 12 it calls battle_spawnSelfElementCollisionRegion
  (which uses the object's stored element and damage data to place a hitbox on the object's own panel)
  and resets Timer2 to 0 — i.e. a hitbox refresh every 12 frames. Independently it decrements the 30-frame
  Timer; once it goes negative the object's CurState is set to CUR_STATE_DESTROY so the object engine
  removes it. The phase-4 guard makes the spawn intervals uniform rather than one leading edge, suggesting
  a damaging tile (e.g. a burning/elemental panel object) that ticks damage while active.
