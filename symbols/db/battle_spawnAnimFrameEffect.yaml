name: battle_spawnAnimFrameEffect
address: '0x080D4EBC'
kind: function
status: probable
summary: When the object's current animation frame is flagged 0x80, spawns the object's effect at its
  position and advances the object to phase 0xC.
interface: (r0 = battle object?/frame param attr via callee, r5 = battle object) -> r0 = spawned effect
  object or unchanged; sets oBattleObject_CurPhase = 0xC on spawn
details: Calls sprite_getFrameParameters and tests bit 0x80 of the returned attribute byte; if clear,
  the function does nothing. If set, it loads three halfword/word fields at r5+0x34..0x3C (likely screen
  x, y, and a parent/battler id), biases the third by 0x100000, and calls the wrapper that spawns a type-0
  effect object, passing the object pointer and r4=0x100000. It then writes 0xC to oBattleObject_CurPhase,
  so this is a phase-handler step in a battle object state machine that fires the effect on a marked animation
  frame (e.g. attack impact frame) and moves to the next phase. Bit 0x80 of the frame attribute byte thus
  appears to mean 'spawn effect / advance phase on this frame'.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst r0, #0x80 after sprite_getFrameParameters gates the whole body (attr bit selects frames
    that trigger the effect); ldmia r0!, {r1-r3} from r5+0x34 loads x/y/param fields of the battle object
    for the spawn call; bl spawn_t1_0x0_EffectObject spawns the effect object with those coordinates;
    strb 0xC, [r5,#oBattleObject_CurPhase] advances the object''s state-machine phase after spawning'
