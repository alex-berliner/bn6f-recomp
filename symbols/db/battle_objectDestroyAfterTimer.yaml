name: battle_objectDestroyAfterTimer
address: '0x080D033C'
kind: function
status: confirmed
summary: Battle-object state handler that counts down an object's timer and switches it to the DESTROY state when
  the timer runs out.
interface: void battle_objectDestroyAfterTimer(BattleObject* obj /* in r5 */); no return value; clobbers r0, r1
  and the nzcv flags; lr is popped to return
details: 'Per-frame state handler for a battle object, with the object pointer passed in r5 (caller-owned register).
  Uses the standard BattleObject fields oBattleObject_CurPhase, oBattleObject_Param1, oBattleObject_Timer and the
  packed oBattleObject_CurStateActionPhaseAndPhaseInitialized word. On the first invocation (CurPhase == 0) it writes
  phase 4 into CurPhase (marking the phase as started) and arms the Timer halfword to Param1 - 0xA, i.e. the configured
  lifetime minus a 10-frame lead-in. On every invocation it decrements Timer and, when the 32-bit decrement result
  is <= 0 (bgt), stores CUR_STATE_DESTROY into the CurState/Action/Phase packed field, letting the object system
  delete the object next update. Quirk: the "already zero" case is caught by the signed comparison of the decremented
  register (-1), not by the stored halfword, so a Timer preloaded with 0 (or Param1 <= 0xA) still gets one extra
  frame before destruction; a wrapped halfword of 0xFFFF only matters because the branch reads the 32-bit register,
  not the stored value.'
