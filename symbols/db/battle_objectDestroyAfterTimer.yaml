name: battle_objectDestroyAfterTimer
address: '0x080D033C'
kind: function
status: probable
summary: Battle object handler that despawns the object after a frame delay set by Param1.
interface: (r5 = battle object) -> updates oBattleObject_Timer, sets state CUR_STATE_DESTROY on expiry;
  flags n/a
details: On entry with oBattleObject_CurPhase==0 it stores phase 4 and writes Param1-10 to oBattleObject_Timer,
  so the effective lifetime is the Param1 value minus the frames spent in earlier setup. Every call afterwards
  decrements oBattleObject_Timer and branches out while it is still positive. When the timer reaches zero
  the word field oBattleObject_CurStateActionPhaseAndPhaseInitialized is set to CUR_STATE_DESTROY, making
  the engine delete the object. No other fields or callees are touched, so the object just lingers invisible/inert
  until it self-destructs.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst; bne skips one-time init that sets phase 4 and Timer=Param1-0xa;
    ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt locret — plain per-frame countdown; mov r0,#CUR_STATE_DESTROY;
    str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] on timeout; no callee calls and
    no other memory access — pure timer state machine on the object struct; recorded routes battlesweep/beastsp
    confirm it runs as a battle update handler
