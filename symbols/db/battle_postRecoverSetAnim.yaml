name: battle_postRecoverSetAnim
address: '0x08103E12'
kind: function
status: probable
summary: Battle-object action that snaps the object back onto its reserved panel and switches it to animation
  0x41.
interface: (r0 = battle object ptr, passed through to callee; r5 = battle object ptr) -> r0 = 0; no flags
  meaningful
details: It first calls battle_recoverToPanelPhase, which resets the object's stunned/pulled state and
  waits until the object is free on its reserved panel. Once that returns, it stores the immediate value
  0x41 into the object's oBattleObject_CurAnim byte via r5, changing the sprite animation. It is a self-contained
  behavior step, likely one phase/action handler in an object's state machine. With no callers visible,
  which enemy or object uses it, and what animation 0x41 depicts, is unknown.
