name: SetInterruptCallback
address: '0x0800024C'
kind: function
status: confirmed
summary: Installs a handler pointer into the BIOS/interrupt dispatch table slot selected by an interrupt index.
interface: void SetInterruptCallback(u8 interrupt_idx /* r0 */, void (*callback)() /* r1 */); clobbers r0, r2, r3,
  NZ; preserves r4
details: 'Thin ARM/THOM-like trampoline: it simply forwards control to the crt0 helper _SetInterruptCallback (address
  ''off_8000258'' holds ''_SetInterruptCallback+1'', i.e. its Thumb entry), which reads the interrupt index from
  r0 and the handler pointer from r1 and stores the pointer into the interrupt dispatch table entry for that index.
  The ''mov lr, pc / bx r2'' pair is only call linkage (lr gets the return address so the helper can return), and
  ''push {lr} / pop {r0} / bx r0'' returns to the original caller. No game state is touched here; the actual table
  write happens in the helper. This is the standard GBA crt0 ISR-installation service, not game logic.

  '
