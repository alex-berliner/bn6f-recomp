name: battle_spawnCollisionRegionAtObjectPanel_810C14A
address: '0x0810C14A'
kind: function
status: confirmed
summary: Spawns a standard collision-region battle object (width 5, kind word 0x4600) at the given battle object's
  current panel coordinates.
interface: void sub_810C14A(r5 = battle object ptr); out r5 = updated object ptr from object_spawnCollisionRegion,
  r7 = entry value (pass-through), r4/r6 preserved, lr clobbered
details: 'Thin wrapper around object_spawnCollisionRegion. Reads the object''s panel position

  (oBattleObject_PanelX / oBattleObject_PanelY bytes off the r5 battle object) and calls

  object_spawnCollisionRegion with r0=panelX, r1=panelY, r2=width 5, r3=0 (offset),

  r4=shape/extent word 0x3205FF83 (constant table byte_810C164: 83 FF 05 32),

  r5=object pointer, r6=0 (no extra object), r7=kind/mode word 0x4600.

  The callee returns the (possibly relocated/reallocated) object pointer in r5, which

  this wrapper passes through; r4/r6/r7 are restored to their entry values by the

  push/pop, so r7 is a pass-through rather than a real output value. No conditionals,

  no error paths - always spawns exactly one region centered on the object''s panel.

  Likely used for an attack or obstacle that places a hitbox on its owner''s tile.

  '
