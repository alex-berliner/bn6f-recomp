name: sub_809E4F8
address: '0x0809E4F8'
kind: function
status: confirmed
summary: Draws the overworld player sprite using its current animation frame.
interface: void sub_809E4F8(Toolkit* r10)
details: 'Walks Toolkit → GameState → Overworld player object pointer (R5 used as scratch).

  Calls sprite_load(0x80, 0x18, 0) to load the player sprite (tile 0x80, attr 0x18,

  flags 0). Reads the current animation index from offset 0x14 of the player object

  and passes it to sprite_setAnimation. Then sprite_loadAnimationData fetches the

  tile/palette data, sprite_noShadow suppresses the shadow, and sprite_update blits

  the sprite. R5 is preserved by pushing {r4-r7} / popping into pc. R10 is the

  incoming Toolkit* (not preserved on return per caller contract).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
