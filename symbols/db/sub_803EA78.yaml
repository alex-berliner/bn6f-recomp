name: sub_803EA78
address: '0x0803EA78'
kind: function
status: confirmed
summary: Dispatches to one of three mode handlers indexed by a byte in the engine struct eStruct200BC30, preserving
  r4-r7 for the caller.
interface: void next_sub_803EA78(void) /* reads eStruct200BC30[0]; r5 = eStruct200BC30, r1 = off_803EA8C table base;
  clobbers r0-r3, r8-r12, lr, nzcv; returns via lr */
details: 'Acts as a thunk: the first byte at eStruct200BC30 (byte offset 0) selects a handler

  from the three-entry table at off_803EA8C (entries at +0, +4, +8 point to

  sub_803EA98+1, sub_803EABC+1, sub_803EAD0+1). r5 is preloaded with eStruct200BC30

  and r1 with the table base so the callees can run with a consistent ABI; the

  handler is called via `mov lr, pc; bx r0` (i.e. a thumb call with the +1 thumb

  bit set). r4-r7 are explicitly pushed/popped so that the dispatcher''s caller

  survives the handler invocation; r0-r3 and r8-r12 are documented as outputs of

  the handler, not of this dispatcher.

  '
