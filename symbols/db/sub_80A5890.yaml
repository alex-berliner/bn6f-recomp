open_questions:
- Whether r5 holds the OWPlayerObject itself or a smaller render-info struct (e.g. oS2000aa0) — the +0xc..+0x14
  region is the X/Y/Z block in oOWPlayerObject (Coords at +0x1c) but overlaps the start of several other structs;
  resolving requires checking the two callers' setup of r5.
- The exact semantic meaning of the three copied words (e.g. target panel offset, animation-related parameters,
  or X/Y/Z delta) — only the named callee owPlayer_setDirectionAnimFromOffset_80A5974's body would confirm.
- Why r4 is preserved across this function but only in/r4-r6/r10 are used — suggests a small state-saving wrapper
  around a heavier operation performed by the callee.
