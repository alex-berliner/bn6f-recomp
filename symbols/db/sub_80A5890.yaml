name: sub_80A5890
address: '0x080A5890'
kind: function
previous_names: []
status: hypothesis
summary: Copies a 3-word offset (e.g. delta x/y/z) from r6+0x7c into r5+0xc and triggers the player direction/animation
  update.
interface: '(r5 = OWPlayerObject*, r6 = ? struct with data at +0x7c) -> r0 = 0 ; side effects: writes three u32s
  into [r5+0xc..0x14], clobbers r0-r3, calls owPlayer_setDirectionAnimFromOffset_80A5974'
details: "- r5 is the OWPlayerObject (see overworld_player_object_struct, which has Coords at +0x1c; +0xc..+0x14\
  \ here overlaps an earlier window, suggesting the consumer is something like the S2000aa0 player navi render info,\
  \ since oS2000aa0 is small (0x1c) and starts with horizontal/vertical compress bytes; r5 is more likely an OWPlayerObject\
  \ scratch/render slot in this caller context).\n  - r3 is initialised to 0x7c, then auto-incremented with `add\
  \ r3, #4` three times to walk 0x7c, 0x80, 0x84 in r6 — three consecutive u32 words are loaded into r0, r1, r2.\n\
  \  - Those three words are written to [r5+0xc], [r5+0x10], [r5+0x14] verbatim (str r0/r1/r2), forming a 12-byte\
  \ (3 x u32) block copied from r6+0x7c into r5+0xc.\n  - After the copy, owPlayer_setDirectionAnimFromOffset_80A5974\
  \ is invoked with the original argument register r5 (per its in=r4,r5,r10 contract).\n  - The function is a void\
  \ helper called from sub_80A57D0 and sub_80A5828 (both flagged as part of the \"beastsp\" beast-out/special pipeline\
  \ based on the snapshot name `snap_beastsp_…`).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r3, #0x7c; ldr r0, [r6,r3]` then `add r3, #4; ldr r1, [r6,r3]; add r3, #4; ldr r2, [r6,r3]` walks
    three u32 words starting at r6+0x7c (asm29.s:1417). - `str r0, [r5,#0xc]; str r1, [r5,#0x10]; str r2, [r5,#0x14]`
    writes the same three words contiguously at r5+0xc (asm29.s:1417). - `bl owPlayer_setDirectionAnimFromOffset_80A5974`
    is the only call taken, with callee contract `in=[''r4'',''r5'',''r10'',''lr'']` matching the live registers
    on entry here (r5 is preserved across the copy via r4-r6/r10 untouched until the bl). - 40 captured snapshots
    named `snap_beastsp_*` confirm this is in the beast-out / beast-special player pipeline, consistent with the
    only two named callers also living in that code range (0x80A57D0/0x80A5828, both in asm29.s). - Exit r0=0 and
    -ZC- flags in every snapshot indicate no meaningful return value to callers (void helper).'
