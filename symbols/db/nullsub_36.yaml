interface: void nullsub_36(void)
details: 'Does nothing but ''mov pc, lr''. No registers are read or written, no memory is

  touched, no flags are affected. Such nullsubs typically mark call sites in the

  original source where a function was disabled, stubbed out, or never

  implemented, while keeping the call target address valid for linking.

