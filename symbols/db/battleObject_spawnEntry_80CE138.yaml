name: battleObject_spawnEntry_80CE138
address: '0x080CE138'
kind: function
status: confirmed
summary: Spawn a battle object by setting its active flag, loading its sprite/animation, anchoring it
  to the panel grid, and handing it off to its update state.
interface: void sub_80CE138(void /* r5 = battleObject*, r10 = owner? */);
details: 'Operates on a battle object struct pointer passed in r5 (the GameObject/Guest header at the

  start of the BattleObject). Sets oObjectHeader_Flags bit 0x02 (active). Calls sprite_load

  with sprite id 0x80, tile slot 0x0C, palette slot 0x50. Sets CurAnimAndCurAnimCopy = 4

  (entry animation), then sprite_setAnimation, sprite_loadAnimationData, sprite_update,

  sprite_noShadow, object_setCoordinatesFromPanels. Sets oBattleObject_Z = 0x00A00000

  (foreground Z plane, in front of the field), resets oBattleObject_Timer = 0, and stores

  CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized to schedule the

  per-frame update phase. Tail-calls sub_80CE138''s local helper sub_80CE178 (likely the

  "perform update phase" routine); sub_80CE138 itself pops {pc} via the saved lr.

  At end-of-function r8, r9, r10 (and r5) are propagated to the caller per register contract,

  so the routine is meant to be inlined into a state machine that relies on r8-r10 being

  scratch/working state across the spawned object''s lifetime.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
