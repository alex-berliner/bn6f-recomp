    (=byte_80A8510); ldrb r0, [r2,r0] — indexes the 8-byte table with the roll and returns it; byte_80A8510:
    0x00,0x1F,0x3F,0x7F,0x9F,0xBF,0xDF,0xFF — a 0..255 ramp typical of fade/alpha step values'
