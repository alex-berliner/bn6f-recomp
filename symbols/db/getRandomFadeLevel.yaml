name: getRandomFadeLevel
address: '0x080A84FC'
kind: function
status: confirmed
summary: Returns one of eight pre-set fade/blend intensity levels (0x00..0xFF) chosen at random.
interface: (void) -> u8 fadeLevel in r0; clobbers r1-r3, lr, flags; calls reqBBS_81409D0(8) for the RNG draw
details: 'Asks the RNG helper reqBBS_81409D0 with the modulus value 8 to obtain a random index 0..7, then uses that
  index to read a byte from the LUT at byte_80A8510: {0x00, 0x1F, 0x3F, 0x7F, 0x9F, 0xBF, 0xDF, 0xFF}. These look
  like 8-bit fade / brightness steps for a GBA blend (BLDCNT/BLDY) effect, so the function hands back a randomly
  picked fade strength from fully black (0x00) to full (0xFF). Note the step values are non-uniform (0x1F, then
  0x20 increments), and that a roll of 0 yields 0x00. Only lr is a real caller input; r0 out is a single byte value
  in a u32 register.

  '
