name: getRandomFadeLevel
address: '0x080A84FC'
kind: function
status: probable
summary: Returns a random fade/brightness amount chosen from an 8-entry ramp table, for a screen or sprite
  fade effect.
interface: () -> r0 = byte from byte_80A8510[0..7] (one of 0x00,0x1F,0x3F,0x7F,0x9F,0xBF,0xDF,0xFF); flags
  not meaningful
details: Calls the shared RNG helper reqBBS_81409D0 with n=8 to get an index 0..7, moves that index to
  r1, then loads and returns the byte at byte_80A8510[index]. The table is a monotonic ramp of 8 values
  spanning 0..255 (0, 31, 63, 127, 159, 191, 223, 255), shaped like brightness/alpha fade steps rather
  than e.g. indices or IDs. The function is a trivial selector; all real semantics live in the caller
  sub_80A84C4 and how the returned value is applied (likely a fade or blend register/palette write).
