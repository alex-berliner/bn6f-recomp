name: sub_804A230
address: '0x0804A230'
kind: function
status: confirmed
summary: Copies 0x20 bytes of chip data into the chip queue slot, indexed by chip ID via a per-chip slot table.
interface: void sub_804A230(u8 chipId /* r0 */);
details: 'Looks up an 8-bit slot index in a per-chip table at dword_804A25C using the

  incoming chipId (r0). Treats that byte as an offset added to unk_2001850

  (chip data pool) to form the source address, then copies 0x20 bytes via

  CopyBytes into the chip-queue slot at eS200A290 + 0x70 (0x20-byte block,

  consistent with the chip-record size). r1/r2/r3 are clobbered as standard

  for CopyBytes. Restores r4-r7 and returns via lr. The "slot" byte is used

  directly as a byte offset into unk_2001850, so the lookup table is really

  a per-chip-id "where this chip lives in the data pool" index.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
