name: battle_getSignedDistanceToOpposingBattler_80F8610
address: '0x080F8610'
kind: function
status: confirmed
summary: Returns the signed horizontal panel distance between the battler on the opposite side of the
  field and the closest panel in that battler's row, 0 if no panel matches.
interface: u32 battle_getSignedDistanceToOpposingBattler_80F8610(BattleObject *self /* r5 */, BattleState
  *state /* r10 */)
details: 'Takes a BattleObject pointer in r5. Reads oBattleObject_Alliance, XORs it with 1 and calls

  battle_findPlayer to get the battler fighting for the opposite side; reads that battler''s

  oBattleObject_PanelX and oBattleObject_PanelY. Then looks up the caller''s own alliance again and

  indexes byte_80F864C with alliance<<3 (8-byte stride) to get per-side lookup parameters:

  side 0 uses {start=0, end/limit=0x20}, side 1 uses {start=0x20, end/limit=0} — i.e. the search

  direction across the field is reversed for the two sides. Calls

  object_getClosestPanelMatchingRowFiltered(alliance, foe_y, param0, param4) to find the closest

  panel in the foe''s row that matches the side''s filter. If no panel is found, returns the callee''s
  0.

  Otherwise returns a signed horizontal distance: for alliance 0, foe_x - found_panel_x (panel lies

  left of the foe); for alliance 1, found_panel_x - foe_x (panel lies right of the foe). The

  magnitude is how far from the foe the matching panel is, with the sign telling which side of the

  foe it sits on relative to that side''s forward direction. r5 is passed through unchanged; r10 is

  an unused/context input (battle state for the callee). Note: the "distance" is computed against

  the foe''s row but the search filter comes from the caller''s own side.

  '
