name: ai_attackCleanupWait
address: '0x080EC0C0'
kind: function
status: probable
summary: AI attack sub-state that waits a few frames while an attack object persists, then clears the
  object references and exits the attack state.
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no meaningful return, flags clobbered
details: 'Runs as a timed step of an AI attack state machine. On first entry (AttackElement == 0) it initializes
  the state: StepTimer = 5 and AttackElement = 4, marking the wait begun. Each call decrements StepTimer;
  while it is still >= 0 it returns, keeping the attack alive. When the timer expires it zeroes oBattleObject_RelatedObject1Ptr
  and oAIData_TempAttackObjectPtr — releasing the spawned attack object from both the battle object and
  the AI data — then calls object_exitAttackState to return the enemy to its normal state. The AttackElement==0
  init means the caller leaves this state entered repeatedly (every frame) while the attack runs.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/beq sets StepTimer=5, AttackElement=4 as one-time
    init (asm lines 2-7); ldrh/sub/strh on oAIAttackVars_StepTimer with bge skip implements a per-frame
    countdown gate (lines 8-10); str r0,[r5,#oBattleObject_RelatedObject1Ptr] and str r0,[r1+oAIData_TempAttackObjectPtr]
    zero both pointers to the spawned attack object; bl object_exitAttackState only runs after the timer
    expires, ending the attack (line 15); callee object_exitAttackState confirms this is the final cleanup
    step of an AI attack routine
  refs:
  - bn6f/asm/asm31.s:113704
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080EC0C0
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
