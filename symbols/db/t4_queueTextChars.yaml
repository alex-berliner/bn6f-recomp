- method: assembly-reading
  date: '2026-10-19'
  detail: bl ZeroFillByEightWords with word_2023FA0 and size 0x10 clears the 16-entry queue (asm); strh
    0x26,[r4] then strh 1,[r4,#2] writes a 4-byte entry {code,1} at queue start; loop ldrb r3,[r1,r2]
    / strh r3,[r4] copies unk_20018EC bytes, count = byte [toolkit S2001c04+5]; only caller is t4_sceneInit,
    which sets up the overlay cutscene before fading in; mov r0,#0; strb r0,[r5,#0xC] resets a field on
