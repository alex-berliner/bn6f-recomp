name: t4_queueTextChars
address: '0x08130194'
kind: function
status: probable
summary: Builds a queue of halfword text entries at word_2023FA0 from the text buffer unk_20018EC for
  the t4 overlay cutscene renderer.
interface: '() -> void; initializes word_2023FA0 entry queue (4 bytes per entry: halfword char code, halfword
  1) and clears [sub_8130404 result +0xC]'
details: First zeroes 0x10 words (64 bytes = 16 entries) of word_2023FA0, then writes a first entry with
  code 0x26 and flag 1. It then reads the toolkit (r10 -> S2001c04) byte at offset 5 as a character count
  and copies that many bytes from unk_20018EC, each stored as a halfword code followed by flag 1 in a
  4-byte-stride entry queue. Finally it stores 0 to byte 0xC of the struct returned by sub_8130404, likely
  clearing a 'dirty/active' counter for the scene's text state. The 0x26 code is probably a special marker/control
  glyph starting the message. Called once from t4_sceneInit when the cutscene scene starts.
