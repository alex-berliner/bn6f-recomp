name: battle_runCustomScreenPhase
address: '0x080E0730'
kind: function
status: probable
summary: Dispatches the battle custom-screen phase handler based on the object's CurAction (dim screen,
  draw chip name, spawn objects, undim).
interface: (r5 = battle object) -> returns from the dispatched handler; flags from handler
details: 'Reads oBattleObject_CurAction from the object in r5 and indexes a 4-entry branch table at off_80E0744,
  then tail-calls (mov lr, pc; bx r1) the selected handler. The table covers the four steps of the custom-screen
  transition: object_dimScreen (0), object_drawChipName (1), battle_spawnTypeFObjectsAhead (2), and object_undimScreen
  (3). This is the open/close sequence of the custom screen in battle: fade in, show the chip name, spawn
  pre-placed objects, fade back. Each step presumably advances CurAction to the next one, making this
  a small per-frame state machine.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0, [r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; bx r1 — table dispatch on CurAction;
    branch table off_80E0744 = dimScreen, drawChipName, spawnTypeFObjectsAhead, undimScreen; mov lr,pc;
    bx r1; pop {pc} — tail-call so the handler can return directly to this routine's caller
  refs:
