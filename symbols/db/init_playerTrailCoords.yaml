name: init_playerTrailCoords
address: '0x08087150'
kind: function
status: probable
summary: Initializes a 10-entry overworld player position trail, stamping the player's current X/Y/Z into
  every 12-byte record.
interface: (r5 = base of struct, from caller) -> writes player X at r5+0x10+0xC*i, Y at +0x14+0xC*i, Z
  at +0x18+0xC*i for i in 0..9; r0-r3, r6 clobbered
details: Fetches the overworld player object's X/Y/Z via ReadOWPlayerObjectCoords, then runs three identical
  10-iteration loops storing r0, r1, r2 respectively at stride 0xC starting at offsets 0x10, 0x14, 0x18.
  The target buffer pointer lives in r5 and is not set inside this function, so the caller (sub_8086DF8)
  must pre-load it. All ten records end up identical, so this is an init/fill of a position-history-like
  array, not a per-frame shift. Fields beyond offsets 0x00-0x0F and 0x38+ of the struct are untouched.
