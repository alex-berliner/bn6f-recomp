name: rfu_countPlayersByStatus
address: '0x0803F674'
kind: function
status: probable
summary: Counts linked-battle players whose sub_8144D04 status is 1 (r0) or 2 (r1), iterating i=0..(eLinkState+0x48
  bits 4:2)-1.
interface: () -> r0 = count of players with status 1, r1 = count of players with status 2; flags from final mov
  r1
details: Reads eLinkState+0x48, masks bits 0x1C and shifts right by 2 to get the number of connected players (a
  3-bit player count field). Loops index 0..count-1, calling sub_8144D04(i) which returns a per-player value of
  1 or 2, tallying status 1 in r4 and status 2 in r5. Returns the two tallies in r0/r1; indices with other return
  values are ignored. Reads no other state, so its meaning depends entirely on the unknown callee.
