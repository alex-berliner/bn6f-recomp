  date: '2026-10-19'
  detail: 'ldr r7, off_803F6AC / ldr r0,[r7,#0x48]; and 0x1C; lsr #2 extracts a player count from eLinkState; loop
    calls sub_8144D04(i) and branches on cmp r0,#2 / cmp r0,#1 to tally r5 or r4; returns r0=r4, r1=r5 with no other
    side effects (pop {r4-r7,pc}); eLinkState base indicates this runs in the link multiplayer subsystem'
