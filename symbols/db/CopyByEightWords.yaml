name: CopyByEightWords
address: '0x08000950'
kind: function
status: confirmed
summary: Wrapper around the BIOS CpuFastSet SWI that block-copies memory in eight-word bursts, taking the size in
  bytes.
interface: void CopyByEightWords(const u32* src, u32* dest, u32 sizeBytes); // clobbers flags (NZ from word count,
  C from the size>>2 shift), preserves r0-r3
details: 'Thin BIOS-call wrapper: converts the byte size in r2 to a word count with lsr r2, r2, #2, ORs in the copy-mode
  mask loaded from a literal pool (0 = copy mode, as opposed to fill mode), and invokes SWI_CpuFastSet with (src=r0,
  dest=r1, mode=r2). CpuFastSet internally transfers in eight-word bursts, which is where the name comes from. r0-r3
  and lr are saved with a real push and restored with pop {r0-r3,pc}, so the stack frame lives in guest memory:
  a copy whose destination overlaps this frame can rewrite the saved registers and even the return address, and
  the caller then sees those clobbered values. Flags are not restored; NZ reflect the word count (via the ORR with
  0) and C is the bit shifted out by the LSR #2. Size must be a multiple of 4 for an exact copy, and both src and
  dest must be word-aligned as CpuFastSet requires. No subsystem-specific work, so the current name is kept as-is.

  '
