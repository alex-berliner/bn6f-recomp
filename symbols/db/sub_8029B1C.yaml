name: sub_8029B1C
address: '0x08029B1C'
kind: function
status: confirmed
summary: First-battle tutorial text trigger — for the current tutorial step, asks a per-step checker if a chatbox
  script should play, runs it, and moves the task into its post-text wait state.
interface: u32 tutorialTextUpdate(void* work /* r5 */); returns 1 if a script started, 0 otherwise; reads r5=work,
  clobbers r0-r3 and flags
details: "Task-style update for the first-battle tutorial (MegaMan's first tutorial in the game, r5 = tutorial\n\
  work struct). Dispatches on the current step byte at work+0x0C:\n  0   -> sub_8029B86 (step 0 checker, returns\
  \ script index or 0)\n  1   -> sub_8029BAC (step 1 checker)\n  3,4 -> sub_8029BD6 (shared checker for steps 3\
  \ and 4)\n  6   -> sub_8029BE6 (step 6 checker)\n  0xFF (tutorial finished) and any other value -> return 0 with\
  \ no side effects.\nIf the checker returns a nonzero script index, the script from TextScriptFirstBattleTutorials\n\
  (a pointer table indexed by the step, each entry one text archive) is played via\nchatbox_runScript(archive, script_idx).\
  \ It then saves the task's current state byte\n(work+0x01) into work+0x0D, sets the state byte to 0x34 (post-text\
  \ wait state) and clears\nthe u16 timer at work+0x02, returning 1. Callers use the return value to know that text\n\
  has taken over. No registers beyond the standard caller-saved set are preserved; the\ncontract listing \"outputs\
  \ r0-r7 / preserved r4-r7\" reflects the compiler reusing the\ncallee's frame rather than meaningful extra outputs.\n"
