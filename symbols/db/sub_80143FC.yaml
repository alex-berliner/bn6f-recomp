name: sub_80143FC
address: '0x080143FC'
kind: function
status: confirmed
summary: Runs one battle object's AI update, doing nothing while time-stop or the pause menu is active.
interface: 'void sub_80143FC(object *r5, battleCtx *r10); /* preserved: none; clobbers r0, r1, lr, NZC, V (V only
  via the AI callee) */'
details: 'Per-object AI tick called from the battle object update loop. First checks the battle-level

  freeze conditions: if battle_isTimeStop reports time-stop active, or battle_isPaused reports

  the pause menu open, the function returns immediately and the object''s AI does not advance.

  Otherwise it queries the object''s flag word via object_getFlag and tests it against mask 0xC00

  (two "AI active / AI update requested" bits). If either bit is set, it dispatches to the AI

  handler sub_8014432, which does the actual per-object AI processing (and may set V per the

  contract). If neither bit is set, the object has no AI to run, so it calls

  battle_clearAIDataField4c_8014424, which zeroes/clears field 0x4C of the object''s AI data

  structure. Uses r5 as the current object and r10 as the battle context pointer; both are

  passed through to the callees. The register contract says callers read back r1, which is

  just whatever the last callee left in r1, and V, which is set only by the AI handler branch.

  '
