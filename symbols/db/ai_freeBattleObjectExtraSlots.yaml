name: ai_freeBattleObjectExtraSlots
address: '0x0810E0D4'
kind: function
status: probable
summary: Releases up to four auxiliary objects/buffers attached to a battle object's extra-vars block,
  zeroing each slot.
interface: (r5 = battle object) -> r0 = 0 preserved per slot; no flags meaningful on return
details: Reads four consecutive pointer fields at oBattleObject_ExtraVars+8, +0xC, +0x10 and +0x14 of
  the object (r5). For each non-null pointer it calls sub_80D842E with the pointer in r0 — presumably
  a delete/free/release routine — then stores 0 back into the slot. Slots that are already null are skipped.
  The four slots are cleared unconditionally and independently, so this is a bulk cleanup of attachments
  created earlier in the AI behavior. The trailing data (dispatch table off_810E120 with ai_updateBehavior
  and ai_finishAttackByElement, plus timing byte tables) confirms this lives in the generic-AI module
  and runs during attack-exit/behavior-update cleanup.
