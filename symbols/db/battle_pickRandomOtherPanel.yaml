name: battle_pickRandomOtherPanel
address: '0x0811592A'
kind: function
status: probable
summary: Resolves an alliance-dependent panel-effect parameter entry and uses it to pick a random panel
  other than the object's current one.
interface: (r0 = battle object, r1 = caller context/args) -> r0 = picked panel (x/y packed per sub_8015C94
  convention)
details: Loads r3 with the address of byte_8115938, a 16-byte table holding two 8-byte entries (one per
  alliance), each with param word 0x20 and a null args pointer, and passes it to GetAllianceDependentPanelParamArgs,
  which indexes by the battle object's alliance field. The returned param word and args pointer are then
  fed to sub_8015C94, the no-filter random panel picker, which computes GetPositiveSignedRNG % count over
  the filtered panel list excluding the object's current panel and decodes the result as x = low 3 bits
  / y = high nibble. The function is effectively a two-call wrapper with no local state; its return value
  is the chosen panel. The surrounding data (jump table off_8115950, timing tables byte_8115980/byte_8115998+)
  belongs to the enclosing boss AI routine, not this helper.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r3, off_811594C loads byte_8115938, the alliance-indexed 2x8-byte param table, before the
    GetAllianceDependentPanelParamArgs call; immediate bl sub_8015C94 follows, the known random-panel
    picker that excludes the current panel and decodes x/y; the function body is only two bl calls between
    push/pop, so it is a selection wrapper, not a state machine step; caller sub_811581C sits amid boss
    AI tables (off_8115950, byte_8115980) consistent with an attack/movement picking a random target panel
