summary: Initialize a 0x64-byte Navi battle-stats structure to its default values
interface: void battleNaviStatsInit_8013438(void *stats /* r0 */);
details: 'Zero-fills a 0x64-byte block at r0, then writes the canonical default state for a Navi

  battle-stats record: element type = 4, attack/defense patterns = 5/5, default attack power

  = 0x99, max/current/remaining HP halfwords at +0x3E/+0x40/+0x42 = 100 (0x64), alliance

  override sentinel 0xFF at +0x07, custom-chip slot count = 3 (re-written to +0x21 at the

  end), extra-chip count = 0 at +0x26, HP-cap-per-chip = 0x1F at +0x27, three ranged-element

  slots 0x2E..0x30 and six support-chip IDs 0x56..0x5B all set to 0xFF (empty), and various

  boolean flags (active=1 at +0x05, +0x0C; zeros at +0x08, +0x0D, +0x12, +0x18, +0x19, +0x2C,

  +0x2D, +0x28). The two tiny 3-iteration loops fill 0x2E..0x30 and 0x56..0x5B with 0xFF.

  Field meanings beyond element/pattern/HP are inferred from layout (chips, supports, ranged

  elements); the slot count write to +0x21 is deliberately performed after the prior

  initialization, matching the original ordering.

  '
