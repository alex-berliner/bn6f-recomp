name: eStruct2035280_SetRequestBits_801BECC
address: '0x0801BECC'
kind: function
status: confirmed
summary: ORs the given bit mask into the request/flag dword at eStruct2035280+0x40 (dword_20352C0).
interface: void eStruct2035280_SetRequestBits(u32 bits /* r0 */); // leaves struct ptr in r1 and updated dword in
  r2, sets/clears NZ from the OR result
details: 'Tiny flag-setter for the global struct eStruct2035280. Loads the struct base

  into r1, reads the dword at +0x40 (dword_20352C0), ORs in r0, and stores the

  result back. Callers get the struct pointer in r1 and the new value in r2;

  the OR sets/clears the NZ flags as a side effect (which callers may or may

  not use). No other fields are touched. Since the meaning of the bits in

  dword_20352C0 is unknown, the exact game purpose (a "something happened"

  request flag set, likely polled elsewhere) can only be guessed from usage of

  that dword.

  '
