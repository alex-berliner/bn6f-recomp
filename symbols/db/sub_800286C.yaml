name: sub_800286C
address: '0x0800286C'
kind: function
status: hypothesis
summary: Writes zero to the 32-bit global at 0x200F340 and returns; a one-liner reset of some global counter/flag.
interface: 'void sub_800286C(void) — inputs: lr only (return address); outputs: none; clobbers r0, r1, NZ flags.'
details: Loads the address dword_200F340 (a word-sized work/IRAM global at 0x200F340) into r0, clears r1 to 0, and
  stores it with a single STR. No other memory, registers, or flags are touched, and no value is returned. Because
  the target global's role is not yet identified from this function alone, the game-level meaning (counter reset,
  flag clear, state initializer, etc.) is unknown; the name should be revised once cross-references to dword_200F340
  reveal its purpose. Note the function uses "mov pc, lr" rather than a BX, which is fine since it never switches
  state.
