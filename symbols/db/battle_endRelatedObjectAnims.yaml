name: battle_endRelatedObjectAnims
address: '0x080FF668'
kind: function
status: confirmed
summary: Ends the current animation of a battle object's second related object and of its "extra vars" object, skipping
  either when NULL.
interface: void battle_endRelatedObjectAnims(battleObject *obj /* r5 */); also takes lr (return address); outputs
  r1-r5 are whatever battle_EndObjectCurrentAnim_80C44D2 last left in them (pass-through r1-r5 when no call runs);
  r4/r5 preserved; clobbers r0, lr, nzcv
details: 'Small helper run at battle teardown/cleanup time (caller named battle_end*). r5 holds a battle

  object. It loads obj+oBattleObject_RelatedObject2Ptr; if non-NULL it calls

  battle_EndObjectCurrentAnim_80C44D2 with that pointer in r0, which terminates whatever animation

  that related object is currently playing. It then loads obj+oBattleObject_ExtraVars and, if

  non-NULL, calls battle_EndObjectCurrentAnim_80C44D2 on that object as well. There is no other

  logic and no return value of its own. Quirk: it does not restore r1-r3, so the callee''s

  leftover register values (or the incoming values when a pointer is NULL and no call happens)

  are what callers observe in r1-r5; the register contract reflects this. r4 and r5 are

  preserved on every path (both by this routine and apparently by the callee).

  '
