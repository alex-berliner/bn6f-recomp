name: battle_endRelatedObjectAnims
address: '0x080FF668'
kind: function
status: probable
summary: Stops the current animations of a battle object's two associated objects (related object and
  extra-vars object), no-op when either is NULL.
interface: (r5 = battle object ptr; r0 unused) -> r0 = last callee result; no flags used by caller
details: 'Reads oBattleObject_RelatedObject2Ptr from the battle object at r5 and, if non-NULL, calls battle_EndObjectCurrentAnim_80C44D2
  to mark that object''s animation finished (0xFF) and refresh its anim state. Then it reads oBattleObject_ExtraVars
  and performs the same end-anim call on it if non-NULL. It is a cleanup/teardown helper: both pointers
  are optional, and NULL pointers are skipped. The use of two different fields suggests it clears animations
  on a secondary/attached entity pair owned by the object. No other state is touched.'
