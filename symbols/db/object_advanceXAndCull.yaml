    beq loc_80C5288 — culls when new panel invalid; loc_80C5288: mov r0,#CUR_STATE_DESTROY; str ... oBattleObject_CurStateActionPhaseAndPhaseInitialized
    — destroy path; bl object_presentCollisionData; bl object_updateSprite on the surviving path — normal
    per-frame object update'
