name: object_advanceXAndCull
address: '0x080C524C'
kind: function
status: probable
summary: Per-frame object update which adds XVelocity to X, refreshes panels/collision/sprite, and destroys
  the object if its collision flags are set, the battle is over, or its current panel is invalid.
interface: (r5 = battle object header) -> void; sets object state to CUR_STATE_DESTROY on cull
details: The routine first tears down the object's collision data (object_removeCollisionData) and spawns
  its collision effect, then checks the collision flags at oCollisionData_FlagsFromCollision — any nonzero
  flag short-circuits to the destroy path. It also destroys the object when battle_isBattleOver reports
  the battle has ended. Otherwise it adds oBattleObject_XVelocity to oBattleObject_X, recomputes PanelX/PanelY
  via object_setPanelsFromCoordinates and object_updateCollisionPanels, and only continues the normal
  update (object_presentCollisionData, object_updateSprite) if object_isCurrentPanelValid succeeds. The
  destroy path clears collision region, clears bit 2 of oObjectHeader_Flags, and stores CUR_STATE_DESTROY
  into the state field. Note r5 is used without setup, so the caller must place the object pointer in
  r5; no caller is known, so which entities use this (likely projectiles or hazards that fly off-field)
  is unconfirmed.
