name: ai_setupDash
address: '0x080F1E50'
kind: function
status: probable
summary: Sets an AI battle object's horizontal dash velocity and computes how many frames the dash lasts
  to cross to the far edge of the field.
interface: (r0 = speed in subpixels/frame, r5 = battle object, r7 = AI attack vars) -> void; writes oBattleObject_XVelocity
  and oAIAttackVars_StepTimer
details: Multiplies the r0 speed by object_getFrontDirection() so the object moves toward its enemy side,
  storing it into XVelocity. The dash target column is 6 for alliance 0 and 1 otherwise; distance = |target
  - PanelX| panels, converted to pixels by *0x28 (40 px per panel). BIOS Div (SWI 6) divides that pixel
  distance by the speed, giving the frame count until the object reaches the target edge. That count is
  stored as the AI attack step timer at [r7+oAIAttackVars_StepTimer], so the AI attack state ends exactly
  when the dash completes. Note it uses the raw speed value even if 0 (BIOS Div returns 0), and the timer
  assumes constant velocity.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection / mul r0,r4 / str [r5,#oBattleObject_XVelocity]: velocity = speed
    * facing toward enemy; ldrb Alliance; mov r0,#6 or #1; sub PanelX; neg if <0: distance to far-side
    column, absolute; mov r2,#0x28 lsl 16; mul r0,r2: distance converted to pixels (40 per panel); svc
    6 with r1=r4: BIOS signed division, distance/speed = frame count; strh r0,[r7,#oAIAttackVars_StepTimer]:
    result used as a countdown in the AI attack vars'
