name: object_stateDelayTick
address: '0x0802CC8C'
kind: function
status: probable
summary: 'state-machine tick for an object: runs its setup once, waits 30 frames, then switches the object
  to mode 8'
interface: (r5 = object/state struct pointer, no register args) -> void; sets [r5+2] state byte, [r5+5]
  frame timer, and [r5] mode word
details: Reads the phase byte at [r5+2]; if it is still 0, calls sub_801E780 (presumably the state's init/spawn),
  stores 0x1E (30) into the byte counter at [r5+5], and sets the phase to 4. On every call it then decrements
  [r5+5]; when the counter underflows to zero (SUB sets flags), it stores the word 8 into [r5], the object's
  main mode/state field. The 30-frame wait and one-shot init branch make this a timed transition handler
  within a larger per-frame object update.
