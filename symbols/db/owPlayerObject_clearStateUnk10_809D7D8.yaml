status: probable
summary: When chatbox event-flag bit 0x80 is clear, zero the OW player's Unk_10 game-state byte, the Unk_07/Unk_09/Unk_0a
  OWPlayerObject bytes, then return.
interface: '() -> void ; side effects: writes eGameState+0x10, writes r5+0x07/0x09/0x0a'
details: "Entry: push {lr}; r0 := 0x80. Calls chatbox_mask_eFlags2009F38 with r0=0x80; if the bit is set\
  \ (NZ after `bne locret_809D7F6`) the function returns immediately.\n  Otherwise it loads r7 := [r10,oToolkit_GameStatePtr]\
  \ (so r10 is the toolkit reg), then clears:\n    - r7+0x10 (`eGameState+0x10`, i.e. GameState.Unk_10)\
  \ -> 0\n    - r5+0x07 (`oOWPlayerObject_Unk_07`) -> 0\n    - r5+0x09 (`oOWPlayerObject_JumptableIndex_09`)\
  \ -> 0\n    - r5+0x0a (`oOWPlayerObject_Unk_0a`) -> 0\n  and pops PC. The captured-call pattern (entry\
  \ r0=8, r1=0x4e4000, r2=0, r3=0x020047cc, exit Z->----, r0=0x80) matches the \"flag clear\" path being\
  \ taken in every recorded snapshot.\n  Caller(s) of this short stub were not enumerated in the lift\
  \ dump, but its location under ow_player.s and usage of r5/r10 strongly suggest it is an OW-player reset/clear\
  \ hook executed when a chatbox/quest flag (0x80) is not set.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, #0x80` then `bl chatbox_mask_eFlags2009F38` gates the path on chatbox event-flag
    bit 0x80 (0x08045f3c returns NZ for set flag). - `bne locret_809D7F6` skips the work when the flag
    is set; `pop {pc}` confirms early-return void semantics. - `mov r7, r10; ldr r7, [r7,#oToolkit_GameStatePtr]`
    matches the project convention that r10 holds the Toolkit and offset 0x3c is GameStatePtr (Toolkit
    struct). - `strb r0,[r7,#oGameState_Unk_10]` writes offset 0x10 of GameState (matches `u8 Unk_10 //
    loc=0x10` in game_state_struct). - Three `strb r0,[r5,#oOWPlayerObject_*]` write 0x07/0x09/0x0a of
    OWPlayerObject (matches `Unk_07/JumptableIndex_09/Unk_0a` in overworld_player_object_struct). - r5
    is OWPlayerObject base (in reg contract `in=[''r5'']`) which fits the file src/asm/ow_player.s and
    a per-player reset stub.'
