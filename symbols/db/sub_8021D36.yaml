interface: void sub_8021D36(void) // clobbers r0,r1,r2,lr; preserves r3; no inputs/outputs
details: 'Clears a 0x40-byte region at unk_2000AF0 via ZeroFillByHalfword, then copies four 8-word (=32-byte)

  tables from ROM into WRAM slots: TextScriptJap8021D88 -> unk_2001184 and unk_200119C, and

  byte_8021D8A -> byte_20007D6 and byte_200083A. The destination layout in WRAM (0x20007D6,

  0x200083A, 0x2000AF0, 0x2001184, 0x200119C) is consistent with chat/text-script scratch buffers

  used by the dialogue system (spacing between the slots matches the small template sizes).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
