name: sub_80FDEFC
address: '0x080FDEFC'
kind: function
status: confirmed
summary: Per-AI-tick bookkeeping that raises the object's "about to act" flag when the AI state requests it and
  tracks the panel the object stands on versus its last recorded target panel.
interface: void sub_80FDEFC(battle_object *obj /* r5 */); no return value; clobbers r0-r3, flags, lr
details: 'Runs each AI tick for the battle object passed in r5. First it calls GetAIDataUnk0x48Flag and, if the
  returned state word has bit 5 (0x20) set, calls object_setFlag1 with OBJECT_FLAGS_UNK_4 to mark the object as
  "about to act". It then reads ExtraVars+8, which stores the previously recorded panel packed as (panelY << 4)
  | panelX: low 3 bits are X, bits 4+ are Y. If that stored panel differs from the object''s current PanelX/PanelY
  bytes, the stored value is moved to ExtraVars+4 (previous-slot backup) and the current panel (PanelX | (PanelY
  << 4)) is written into ExtraVars+8. If they already match, nothing is stored. Effectively lets the AI notice when
  the object has moved to a new panel since the last tick.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
