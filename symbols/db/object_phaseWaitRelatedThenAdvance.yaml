name: object_phaseWaitRelatedThenAdvance
address: '0x080E9048'
kind: function
status: probable
summary: 'Battle-object phase handler: on entry signals the related object with value 1, waits 30 frames
  (or skips if Param1==2), then moves the object to phase 4.'
interface: (r0 = unused on entry, r5 = battle object pointer is the real context) -> r0 = destroyed; sets
  oBattleObject_Timer, oBattleObject_PhaseInitialized, oBattleObject_CurPhaseAndPhaseInitialized
details: A per-object update routine using r5 as the battle object. If PhaseInitialized is clear and Param1
  != 2, it calls sub_80E1332 with r0 = oBattleObject_RelatedObject1Ptr and r1 = 1 (forwarded to sub_80C0F52),
  loads Timer with 30 (0x1E) frames, and sets PhaseInitialized = 4. On later calls it decrements Timer
  each frame; when the timer underflows below zero, or immediately if Param1 == 2, it writes phase 4 into
  CurPhaseAndPhaseInitialized, ending this wait step. The sub_80E1332 call looks like a one-shot message/state
  change sent to the partner object when the wait begins.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / tst/bne: standard one-time-init phase pattern;
    ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]; mov r1,#1; bl sub_80E1332: one-shot signal to related
    object; mov r0,#0x1e; strh r0,[r5,#oBattleObject_Timer]: 30-frame delay before advancing; cmp r0,#2
    / beq loc_80E906E: Param1==2 bypasses the wait and jumps straight to phase 4; mov r0,#4; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]:
    terminal transition to phase 4'
