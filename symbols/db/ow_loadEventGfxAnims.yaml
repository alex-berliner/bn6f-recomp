name: ow_loadEventGfxAnims
address: '0x080353DA'
kind: function
status: probable
summary: Called by the map loader, conditionally loads a fixed pair of GFX animation scripts once story
  flag EVENT_28 is set.
interface: (no args) -> r0 = 0 always; calls TestEventFlagFromImmediate and LoadGFXAnims
details: The function tests event flag 28; if unset it returns 0 immediately. If set, it passes a NULL-terminated
  array of two GFXAnimScript pointers (byte_80349CC, byte_8034A1C from off_80353FC) to LoadGFXAnims, then
  returns 0. It is invoked from the map-load routine map_8034B4C, so it layers extra overworld animation
  graphics onto the map once a certain story state is reached. The return value is a constant 0 in both
  paths and is likely ignored. The two anim script tables and the meaning of EVENT_28 are not identified
  here.
