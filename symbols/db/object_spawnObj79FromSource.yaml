name: object_spawnObj79FromSource
address: '0x080D464A'
kind: function
status: confirmed
summary: Spawns a type-0x79 battle object linked to a source object, transferring panel position, element, damage
  data, and alliance/direction.
interface: u32 object_spawnObj79FromSource(u32 panelX /*r0*/, u32 panelY /*r1*/, u32 element /*r2*/, u32 arg4 /*r3*/,
  u32 spawnExtra /*r4*/, u32 sourceObj /*r5*/) -> r5 (sourceObj unchanged); r6/r7 filled from spawnType3 outputs
  but contract says preserved; clobbers nzcv, r0-r3, lr
details: "Calls object_spawnType3 with type=0x79 and the first three arguments shifted by one\n(push {r0-r2,r5}\
  \ / pop {r1-r3,r5} register shuffle). On success:\n  • Writes original r0→PanelX, r1→PanelY, r2→Element as bytes.\n\
  \  • Writes spawnType3's r6→DamageAndStaminaDamageCounterDisabler,\n    r7→ExtraVars as dwords.\n  • Sets RelatedObject1Ptr\
  \ to sourceObj (r5), preserving the parent link.\n  • Copies AllianceAndDirectionFlip (halfword) from sourceObj\
  \ to new object.\n  • ORs 0x10 into the new object's ObjectHeader_Flags.\nIf spawnType3 returns 0 in r5 (no object\
  \ pool slot), the function skips all\nfield writes and returns sourceObj unchanged.\nThe register contract's \"\
  preserved r6 r7\" reflects caller expectation; internally\nr6/r7 are overwritten by spawnType3 and consumed here,\
  \ then the pop restores\nonly r0-r2/r5.\n"
