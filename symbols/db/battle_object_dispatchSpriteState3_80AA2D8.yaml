name: battle_object_dispatchSpriteState3_80AA2D8
address: '0x080AA2D8'
kind: function
status: confirmed
summary: 'Battle-object sprite-state-3 dispatcher: jumps to the init/update/done handler picked by the
  selector byte at [obj+8].'
interface: void sub_80AA2D8(void /* r5 = battle object */);
details: 'Loads a pointer to a 3-entry thumb jump-table (off_80AA2EC -> {object_initSpriteState3_80AA2F8+1,
  sub_80AA322+1, sub_80AA36C+1})

  via off_80AA2E8. The selector byte at [r5+8] is used as an index into that table to tail-call the matching
  handler

  (init/update/done for sprite-state-3). Effectively a tail-call dispatch: the routine does not return
  in the normal

  sense, it pops {r4-r7,pc} after the bx, so the dispatched function returns directly to sub_80AA2D8''s
  caller.

  Touches only the byte at battle object + 8 (the sprite-state-3 selector).

  '
