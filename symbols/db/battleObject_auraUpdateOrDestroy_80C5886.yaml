name: battleObject_auraUpdateOrDestroy_80C5886
address: '0x080C5886'
kind: function
previous_names:
- sub_80C5886
status: probable
summary: 'Aura-style battle object update: on battle over spawn the death effect, otherwise process collision
  (time-stop aware), and on collision resolution self-destroy.'
interface: '(r5 = oBattleObject self, r10 = oToolkit) -> void ; side effects: removes collision, spawns
  a type-4 effect on battle over, clears collision region and transitions CurState to CUR_STATE_DESTROY'
details: "Pushes lr and immediately calls object_removeCollisionData (tail via the THUMB trampoline at\
  \ 0x0801a00e) and object_spawnCollisionEffect, then polls battle_isBattleOver. If the battle is over\
  \ (r0 != 0), it builds an effect-object spawn from the 12 bytes at oBattleObject + 0x34 (X/Y/Z coords,\
  \ the `ldmia r0!, {r1-r3}` at loc_80C58B6) and calls spawn_t1_0x0_EffectObject (0x080e05f6, fixed r4\
  \ = 0x14, presumably an effect slot/index).\n\n  If the battle isn't over and battle_isTimeStop returns\
  \ 0, it reads the collision's `FlagsFromCollision` (oCollisionData + 0x70). If that word is zero it\
  \ falls through to a two-entry jump table indexed by `oBattleObject_CurAction` (off_80C58D8 -> sub_80C58E0+1\
  \ for action 0, sub_80C59B6+1 for action 1). If the flags word is non-zero (and time is not stopped),\
  \ it jumps directly to the destroy path at loc_80C58C2.\n\n  If time is stopped it instead calls object_presentCollisionData\
  \ and returns.\n\n  The destroy path (loc_80C58C2) clears bit 1 (OBJECT_FLAG_VISIBLE) from oObjectHeader_Flags\
  \ (`bic r0, r1` with r1=2), calls object_clearCollisionRegion, writes CUR_STATE_DESTROY (0x08) into\
  \ oBattleObject_CurStateActionPhaseAndPhaseInitialized, and returns via pop {pc}.\n\n  Behavior is consistent\
  \ with sub_80C57F4's caller comment (\"aura-style battle object ... two animation tables by adjacency\"\
  ), which suggests the two action handlers implement the aura's two adjacency-dependent animations; this\
  \ dispatcher either advances them or, on a collision hit, ends the aura.\n"
