  date: '2026-10-14'
  detail: '- push {lr} + pop {pc} shape and r5/r10 contract (r5 self, r10 toolkit) match an update handler
    called from sub_80C57F4''s "aura init handler" description. - `bl object_removeCollisionData` / `bl
    object_spawnCollisionEffect` at function head and the captured lr 0x080c57cc in the battle snapshots
    match the dispatch from sub_80C57F4. - `bl battle_isBattleOver` then `bne loc_80C58B6` shows the battle-over
    branch spawns the death effect; the `ldmia r0!, {r1-r3}` from oBattleObject+0x34 (Coords X/Y/Z) feeds
    spawn_t1_0x0_EffectObject. - `bl battle_isTimeStop` -> `bne loc_80C58B0` then `bl object_presentCollisionData`
    shows the time-stop branch re-runs the shared collision presenter. - `ldr r0, [r5,#oBattleObject_CollisionDataPtr]`
    then `ldr r0, [r0,#oCollisionData_FlagsFromCollision]` followed by `tst r0, r0` and `bne loc_80C58C2`
    shows a collision hit short-circuits the action handlers and goes straight to destroy. - The dispatch
    `ldrb r0, [r5,#oBattleObject_CurAction]` + `ldr r1, [r1,r0]` + `mov lr, pc; bx r1` and the off_80C58D8
    table with two entries (sub_80C58E0, sub_80C59B6) is a classic two-action jumptable dispatch keyed
    by CurAction. - Destroy writes `mov r0, #CUR_STATE_DESTROY` (=0x08) into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    and clears bit 1 of oObjectHeader_Flags via `bic r0, r1` with r1=2, matching OBJECT_FLAG_VISIBLE clearing.
    - The captured exit r0=0x02038790 is consistent with returning void (r5/r8/r10 preserved per out contract).'
