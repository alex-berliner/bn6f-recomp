name: zeroFill_8003AB2
address: '0x08003AB2'
kind: function
status: confirmed
summary: One-time initializer that zeroes the 0x48-byte work struct at 0x2001010 on first call, then sets an "initialized"
  flag so later calls skip the clear.
interface: void initWorkStruct2001010(void); // inputs r2-r7 ignored; returns r1 = 0x48, preserves r2-r7, c/v untouched,
  n/z clobbered
details: 'Touches a fixed work block (eStruct2001010 at IWRAM 0x2001010, 0x48 bytes). Byte at +0x02 acts as an "already
  cleared" guard: if it reads 0, the whole block is wiped via ZeroFillByWord(ptr, 0x48). Afterwards the byte at
  +0x03 is unconditionally set to 1, marking the block as initialized for other code. So the clear happens exactly
  once per boot (or until +0x02 is externally reset), while the +0x03 flag is set on every call. The register contract
  claims r4-r7 as inputs but the code never reads them - they are only preserved for the caller; r1 happens to hold
  0x48 on exit as a leftover from the size argument.'
