name: object_runPhaseHandler
address: '0x080D7928'
kind: function
status: probable
summary: Runs the current-phase handler of a battle object, or just marks its timer 'frozen' while time-stop
  is active.
interface: (r5 = battle object ptr, no register args) -> r0 = phase handler's return; when time-stop is
  active, sets Timer bit 0x20 and returns without dispatching
details: 'Reads oBattleObject_CurPhase from the object at r5 and indexes a 4-entry jump table (off_80D794C:
  battle_objectVanishFromField, sub_80D7996, sub_80D79AC, sub_80D7A0E), then tail-calls that handler via
  blx-style ''mov lr,pc; bx r1''. If battle_isTimeStop says the battle is frozen, it skips the dispatch
  and instead sets bit 0x20 in oBattleObject_Timer, deferring the phase step until unfreeze. Phase 0 routes
  to battle_objectVanishFromField, so the phase enum starts with the object leaving the field. The routine
  is a plain dispatcher: it holds no state of its own, everything lives in the object struct and handlers.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isTimeStop + tst r0,r0 / bne loc_80D793C gates dispatch on the battle freeze flag;
    ldr r1,[r1,r0] with r0 = [r5,#oBattleObject_CurPhase] is a phase-indexed handler table call (off_80D794C);
    loc_80D793C: ldrh/strh on [r5,#oBattleObject_Timer] ORRs 0x20 when time-stopped instead of advancing
    the phase; first table entry is battle_objectVanishFromField+1, tying phase 0 to the vanish/despawn
    step; caller sub_80D787C is the only known caller, invoked from recorded chip routes'
