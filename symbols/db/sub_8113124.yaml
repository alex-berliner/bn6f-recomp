open_questions:
- The exact semantic of dword_8113208 = 0xa000 (which two/three flag bits and what "guard" they represent) — settling
  it requires identifying the matching ObjectFlags1 bits used in the AI skip path.
- The full set of AI-state handlers behind off_8113148 (the table size is not visible here) and what each does.
- Whether r6 is the AIData pointer or a different per-object struct containing AIState at offset 0; only the AIData
  definition shows AIState.Unk_00, but a quick cross-check from the caller context would confirm.
