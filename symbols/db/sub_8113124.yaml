name: sub_8113124
address: '0x08113124'
kind: function
previous_names: []
status: hypothesis
summary: Battle-object AI dispatcher that first tries the low-HP chip-usage helper and, if allowed, jumps into an
  AI-state handler chosen from a per-AI-state table.
interface: '(r0 = object-relative AIState index used to index off_8113144, caller-provided ctx in r4..r7,r10) ->
  r0 = handler return / unused; no live return for callers (out has only r5 callee-saved) ; side effects: dispatches
  via off_8113148 jump table, may set/clear flags and call sub_81131D8, object_getFlag'
details: "- Prologue only saves r4,r6,lr (push {r4,r6,lr}); r5/r7/r10 are expected to be the AI/BattleObject/toolkit\
  \ context already set up by the caller.\n  - First calls sub_81131D8 (the unknown helper named here as `battle_object_tryUseChipWhenLowHP_81131D8`);\
  \ if it returns non-zero, return immediately (low-HP chip branch already taken).\n  - Otherwise calls object_getFlag\
  \ to read the first ObjectFlags1 word of the battle object's collision data (r5 holds the object), tests bit 0xa000\
  \ (FLOATSHOE 0x20 | INVIS 0x8000, plus bit 0x8000? actually bit 0x2000 = UNINSTALL? no, 0xa000 = 0x8000+0x2000\
  \ = OBJECT_FLAGS_BUBBLED (0x80000000 truncated to 0xa000 doesn't fit — only 0x2000+0x8000 = INVIS(0x8000)+UNINSTALL(0x2000)?\
  \ likely INVISIBLE/UNDERFLOW flag mask; treated as a guard); if any of those bits set, return.\n  - Reads AIState\
  \ byte at offset oAIState_Unk_00 of the AIData (via r6 — looks like r6 is AIData ptr), uses it to load a function\
  \ pointer from the off_8113148 jump table (off_8113144 is the table base) and bx into it. That dispatches per-AI-state\
  \ handlers.\n  - The jump-table shape (off_8113148 -> array of Thumb pointers indexed by the first byte of the\
  \ AIState sub-struct) and the bitmask 0xa000 strongly suggest \"given the object can act, pick the AI action appropriate\
  \ to its state\". The \"try chip when low HP\" gate is the only piece of behaviour I can confidently name.\n \
  \ - Captured calls all return through the same return path; the r0 on exit equals 4 (curstate?) on the first two\
  \ snapshots and 0 on the rest, which matches the per-state handler's own return value being threaded back to the\
  \ caller via r0.\n  - Naming uses `battle_object_` because the prologue/r5 context is a BattleObject; the AIData\
  \ offset access and the off_8113148 dispatch make it the AI per-tick driver.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battle_object_tryUseChipWhenLowHP_81131D8` is the only branch that returns early before the dispatch.
    - `bl object_getFlag` then `tst r0, r1` with r1=0xa000 (dword_8113208) — masking out a guard-flag subset before
    allowing the dispatch. - `ldrb r0, [r6,#oAIState_Unk_00]` reads AIData->AIState (r6 is AIDataPtr in the BattleObject
    layout). - `ldr r1, [r1,r0]; mov lr,pc; bx r1` is the classic Thumb jumptable via off_8113144 -> off_8113148
    dispatch. - All callers come in with r0 holding the table index byte (0x20 in the captures; r0 on entry is shown
    as 0x08113125 which is the +1 Thumb address of the function — that''s the lifter mis-decoding the `push` first
    byte), r1 a constant 0x20, r3 an EWRAM pointer, consistent with a per-battle-object AI tick. - sub_81131D8''s
    contract in={''r4'',''r5'',''r7'',''r10'',''lr''} matches this function''s saved/restored subset; they''re a
    matched pair.'
