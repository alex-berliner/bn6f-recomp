  date: '2026-10-18'
  detail: 'cmp r2,r3 on [r5+0x46] vs [r5+0x4A] splits the cross-list move path (loc_8134D0E) from the
    in-list swap path (loc_8134E36); cmp r0,r7 against the word_202A020 literal distinguishes which list
    the selected entry belongs to; CopyByEightWords(dst=unk_202A3E0+0x20*[r5+0x28], 0x20) then strh #1,[slot+0x16]
    and increment [r5+0x28] moves an entry into the second list; Scan loop over word_202A020 at 0x20 stride
    for a zero halfword finds a free slot; CopyByEightWords fills it and [r5+0x28] is decremented; Three
    CopyByEightWords calls via unk_2035C6C implement a swap of the two entries at base+0x20*r2 and base+0x20*r3'
