name: folder_moveChipEntry
address: '0x08134CF0'
kind: function
status: probable
summary: 'Folder/pack editor action handler: moves a 0x20-byte chip entry between the two chip lists,
  or swaps two entries within one list, with error sounds for invalid moves.'
interface: (r0..r3 unused; r5 = editor state struct) -> r0 = 0; writes entry tables word_202A020 / unk_202A3E0,
  state fields [r5+0x17,0x28,0x3c,0x44,0x46,0x48,0x4a]
details: 'r5 is a UI-state struct: [0x44] picks a list base pointer from the table at dword_8134E94 (one
  entry being word_202A020), [0x46] and [0x4A] are two 0x20-stride entry indices. Entries are 0x20 bytes;
  +0x14/+0x16 hold a flag and a dup-count word (count in the upper half). If the two indices are equal,
  the entry is moved across lists: from word_202A020 it is rejected with SOUND_CANT_JACK_IN if its +0x14
  flag is clear, otherwise copied (via sub_8134F40 duplicate check) into unk_202A3E0 + 0x20*[r5+0x28]
  with flag 1, the source slot zero-filled, and [r5+0x28] incremented; from the other list it is placed
  into the first free (zero) slot found by scanning word_202A020, decrementing the dup count at +0x14
  and compacting following slots via battle_copyStateSlotsAndZeroNext when the count reaches 1. If the
  indices differ, the two 0x20-byte entries are three-way swapped through the temp buffer unk_2035C6C,
  with sub_8135038/sub_8135054 bookkeeping when the list is word_202A020. Each success path plays SOUND_MENU_SELECT,
  refreshes state via sub_8134EA8/[r5+0x17] and sub_8134F78, and the exit sets [r5+0x3c]=0x7FFF and zeroes
  [r5+0x44]/[r5+0x48].'
