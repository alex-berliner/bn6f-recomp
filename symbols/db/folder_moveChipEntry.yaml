name: folder_moveChipEntry
address: '0x08134CF0'
kind: function
status: confirmed
summary: 'Handle a chip-move command in the folder UI: jack copies between folders or swap two slots within one
  folder'
interface: void folder_moveChipEntry(struct FolderState *state /*r5*/, u32 context /*r10*/) -> r2
details: "Reads the current folder index from state+0x44, resolves the folder's chip-data base via a jump table\
  \ at dword_8134E94 (indexed by folder_idx*4), then loads two slot indices from state+0x46 (source) and state+0x4A\
  \ (destination). If both indices are equal (the \"move\" path) it performs a jack-out/jack-in:\n  - Active folder\
  \ (chip_data == word_202A020): takes one copy out of the selected\n    entry, copies it into the pending-send\
  \ buffer at unk_202A3E0 (slot tracked by\n    state+0x28), zeros the source entry, recounts copies via e_recountChipCopies,\n\
  \    and refreshes the folder display.\n  - Side folder: checks remaining copy count (upper 16 bits of entry+0x14);\
  \ if zero\n    or no empty slot exists in the active folder, plays SOUND_CANT_JACK_IN.\n    Otherwise validates\
  \ the chip via sub_8135080, and on success either moves the\n    whole entry to the active folder (last copy)\
  \ or decrements the copy count and\n    still places a single copy there.  Triggers folder_chipMoveError on rejection.\n\
  If the two indices differ (the \"swap\" path) it exchanges two 0x20-byte chip entries within the same folder through\
  \ a 3-way copy using temp buffer unk_2035C6C.  For the active folder it first retargets and swaps cursor indices\
  \ (folder_retargetIndex, folder_swapCursorIndex on cursors 0 and 4). Epilogue writes 0x7FFF to state+0x3c and\
  \ clears state+0x44 / state+0x48 (the pending-move request slots), signalling the UI loop that the command is\
  \ done. Calls sub_8134F78 after every branch to refresh the folder scroll state. Each chip entry is 0x20 bytes;\
  \ key offsets: +0x00 chip-id, +0x14 flags+copy-count (upper 16 bits), +0x16 jack-out flag, +0x1C element/level\
  \ byte.\n"
