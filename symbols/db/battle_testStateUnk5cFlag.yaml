name: battle_testStateUnk5cFlag
address: '0x0800A754'
kind: function
status: probable
summary: Boolean check on a flag in the battle state's Unk_5c field.
interface: () -> r0 = 1 if battle state Unk_5c has the flag bit set, else 0
details: Calls battle_getStateUnk5c_800139A to load the battle state's Unk_5c field, then builds a mask
  of 4, or 8 if the field is nonzero, and tests the field against it. Returns 1 when the masked bit is
  set and 0 otherwise; in practice this reduces to (Unk_5c != 0) && (Unk_5c & 8). No other structures
  or fields are touched, and there are no known callers to reveal which game condition this flag represents.
