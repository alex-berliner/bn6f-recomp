name: battle_customGaugeResetForNewTurn
address: '0x0801DF0C'
kind: function
status: confirmed
summary: At the start of a new battle turn, empties the custom gauge, redraws its GUI, and resets the gauge's per-turn
  state.
interface: 'void battle_customGaugeResetForNewTurn(void); // in: r10 (unused, caller scratch); preserves r5-r7;
  r1-r12 and NZCV flags are whatever the callees leave behind (no meaningful typed outputs)'
details: 'Turn-boundary reset for the battle Custom gauge (the Custom Screen charge meter). 1) calls ClearCustGauge
  to empty the gauge counter. 2) queues the GFX transfer list at off_801DF60 via QueueGFXTransfersInList so the
  gauge GUI is redrawn (empty). 3) sets request bit 0x20000 (1<<17) on eStruct2035280 through eStruct2035280_SetRequestBits_801BECC,
  then dispatches the same bit 0x20000 again through dispatch_801DA48 - the request is effectively raised twice,
  once via the entity-struct request setter and once via the dispatcher. 4) zeroes the two gauge state bytes byte_2035298
  and byte_2035299 (fields 0x18/0x19 of eStruct2035280), which track gauge fill/turn state. No parameters of its
  own; the "outputs" r1-r12 and flags are just relayed callee residue, with r1 surviving from the SetRequestBits
  call and r2-r12 from dispatch_801DA48.

  '
