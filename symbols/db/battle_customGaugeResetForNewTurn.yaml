name: battle_customGaugeResetForNewTurn
address: '0x0801DF0C'
kind: function
status: probable
summary: 'Resets the in-battle custom gauge for the next turn: clears gauge state, reloads its tile graphics,
  and flags the HUD for redraw.'
interface: () -> void; no return value
details: Called at end of turn by battle_customGauge_EndTurn_8027D78. It first calls ClearCustGauge to
  zero the gauge progress and flags, then queues the graphics transfer list at off_801DF60 (presumably
  the empty-gauge tile data) to VRAM via QueueGFXTransfersInList. It ORs bit 0x20000 into the request
  dword at eStruct2035280+0x40 and dispatches via dispatch_801DA48 with the same mask, requesting the
  HUD redraw. Finally it zeroes bytes eStruct2035280+0x18 and +0x19, likely gauge animation/flash counters,
  so the gauge starts fresh.
