    reconcile)'
open_questions:
- which global/state the callees index (bitmask array not shown)
- what exactly sub_803B9C0 vs sub_803B814 draw (which menu/screen and why the two variants differ)
- whether the flag is a dirty/redraw marker or a visible selected-state
- 'The asm matches: 1<<r0 produces a bitmask, tst r1, r1 branches to set (sub_803C302) or clear (sub_803C30C),
  and both callees sit 0x0A apart. The callers do feed it row index and 1/0 as stated. However the proposal''s
  phrase ''last drawn'' is slightly off — the two draw styles at 0x0803A104/0x0803A1D8 are mutually exclusive
  per row (one branches to the other), so the bit stores the current style, not the last-draw tracking.
  A slightly cleaner name avoids ''drawn'' nuance.'
