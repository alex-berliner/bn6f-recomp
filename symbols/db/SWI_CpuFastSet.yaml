name: SWI_CpuFastSet
address: '0x0814D8B4'
kind: function
status: confirmed
summary: Trivial wrapper around the GBA BIOS CpuFastSet call (SWI 0xC) that copies or fills a block of words in
  fast 8-word bursts.
interface: void bios_CpuFastSet_814d8b4(const u32* src, u32* dest, u32 mode) /* r0=src, r1=dest, r2=mode; clobbers
  r0-r3, no return */
details: 'Immediate thumb wrapper: issues `svc 0xC` and returns via `bx lr`. This is BIOS call

  CpuFastSet. r0 is the source address and r1 the destination address, both required to be

  word (4-byte) aligned. r2 encodes length in bits 0-20 as a word count and a mode flag in

  bit 24: when bit 24 is set the destination is filled with the single word read from [src]

  (fill mode); when clear it is a src-to-dest copy. The BIOS processes data in 8-word

  (32-byte) bursts and rounds the word count up to a multiple of 8, so the destination buffer

  may be overwritten beyond the requested length. No return value; results land in the

  destination buffer. The wrapper itself preserves nothing (r0-r3 are free per the AAPCS

  caller-saved convention) and touches no game structures.

  '
