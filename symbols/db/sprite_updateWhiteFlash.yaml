name: sprite_updateWhiteFlash
address: '0x0811D020'
kind: function
status: probable
summary: Object update step that flashes the sprite white for a counted number of bursts, then switches
  to a post-flash state with a 60-frame timer.
interface: (r0 = ignored/unused, r5 = object/sprite block) -> r0 = clobbered by call; updates [r5+0xC]
  timer, [r5+0xE] flash counter, [r5+9] state
details: Each call decrements the 16-bit frame timer at r5+0xC; while it is nonzero it returns immediately.
  When it hits zero it decrements the flash counter at r5+0xE and reloads the timer with 3 frames for
  the next burst. When the flash counter also reaches zero, it sets the state byte at r5+9 to 0xC and
  reloads the timer with 0x3C (60 frames), ending the effect. Otherwise it calls sprite_setColorShader
  with r0 = r3 | r3<<5 | r3<<10 | 0x8000, where r3 is the remaining count — an RGB555 color with R=G=B=count,
  i.e. a grayscale/white shader whose intensity fades as the counter runs down. Fields 0xC and 0xE are
  per-object timer/counter slots and field 9 is the object's state/mode byte.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub r0,#1 / strh [r5,#0xC] with bne exit: 0xC is a per-object frame countdown; count r5+0xE
    decremented and reloaded: 0xE counts flash bursts; timer reload 3 vs 0x3C picks burst vs done interval;
    strb #0xC,[r5,#9] when counter expires: writes a new state id into the object''s state byte; orr chain
    r3| r3<<5| r3<<10| 0x8000 then bl sprite_setColorShader: equal RGB channels scaled by the remaining
    count = fading white color shader'
