name: bg_Draw8x8TileBlock3FromTable_81277E0
address: '0x081277E0'
kind: function
status: confirmed
summary: Redraws an 8x8-tile area of background tile block 3, copying tile ids from a table indexed by an object's
  signed byte field at offset 0x0D.
interface: void bg_Draw8x8TileBlock3FromTable(const struct Obj *r5 /* tileIndex at +0x0D */, u32 r4, u32 r6, u32
  r7, u32 r10) -> r2==3; preserves r4, r5, r6, r7; clobbers r0, r1, r3, lr and nzcv
details: 'Takes a pointer in r5 to some object/record whose signed byte at offset 0x0D holds a small tile index.
  That byte is sign-extended, then 0x31 is added, turning it into the index of the first entry in the tile-id table
  byte_8126A90. It then calls CopyBackgroundTiles with j = that computed first tile index, i = 3, tile block = 3,
  tileIds = byte_8126A90, and an 8x8 tile span, so an 8x8 patch of background tile block 3 (the BG at tile coordinate
  (j,3)) is refilled with the tile numbers from the table. r4-r7 are caller registers that must survive, so they
  are pushed/popped around the call; r6 and r7 are never actually used by this routine itself. Note the quirk that
  CopyBackgroundTiles leaves r2 = 3 (the tile block argument), which callers observe on return, so r2 is effectively
  a fixed output of value 3. Given the small signed tile index plus offset 0x31 (49), the object field looks like
  a per-state/per-frame variant selector into a run of 8x8 tile-id layouts in the table.

  '
