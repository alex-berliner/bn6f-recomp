name: ai_initAttack
address: '0x08106C6C'
kind: function
status: probable
summary: 'Initializes the per-attack oAIAttackVars struct for an enemy AI: loads difficulty tier (version
  4 only), clears InitFlag, runs setup helpers, installs a panel-choose callback, fetches duration/boost/timer,
  picks the opposing player via alliance XOR, and launches attack 0xD via object_setAttack0.'
interface: (r0 = battle object/enemy context, r5-r7 = object + oAIAttackVars struct pointers) -> r0 =
  destroyed; sets oAIAttackVars fields and attack id 0xD
details: Reads the enemy AI data difficulty byte and stores the mapped tier (0-2) in oAIAttackVars_AiDifficultyTier,
  then clears the InitFlag. Calls sub_8106CEA(3) and sub_8106D18(4), storing the latter's result in ScratchVar,
  and installs sub_8107970 as the PanelChooseCallback. Fetches attack duration, boost and timer values
  into AttackDuration/AttackBoost2/TimerOrCycles, then resolves the target by XORing the caller's Alliance
  with 1 and calling battle_findPlayer, storing the player pointer in TargetObjectPtr. Finally invokes
  object_setAttack0 with id 0xD to launch the attack. Clearly the per-attack setup step of an enemy AI
  attack routine.
