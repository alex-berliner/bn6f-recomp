- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_getAiDifficultyTier_800FE36 + strb r0,[r7,#oAIAttackVars_AiDifficultyTier] stores
    the AI tier; ldr r0,off_8106DE4 (=sub_8107970+1); str r0,[r7,#oAIAttackVars_PanelChooseCallback] installs
    a panel-choose callback; eor r0,r1 with battle_findPlayer gives the opposing-alliance object stored
    as TargetObjectPtr; mov r0,#0xd; bl object_setAttack0 starts attack id 0xD at the end; both callers
