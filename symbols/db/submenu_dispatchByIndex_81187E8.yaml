open_questions:
- The byte read is at offset `#8` (decimal), not `#0x8`. The SubMenu struct currently has `idx_00` documented
  at offset 0x00; the captured calls consistently show `r5` as a Submenu pointer, so the actual index
  field is at offset 8 of the SubMenu struct (not yet documented in `sub_menu_struct`). Identifying the
  SubMenu struct field at offset 8 would settle it; or perhaps `r5` here is a different struct whose index
  lives at 8 (e.g. a battle-object-like struct that this dispatcher happens to reuse). The presence of
  `battleObject_dispatchSpriteUpdate_8118874` as one of the targets makes a BattleObject-shaped r5 plausible
  too.
