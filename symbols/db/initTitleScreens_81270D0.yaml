name: initTitleScreens_81270D0
address: '0x081270D0'
kind: function
status: confirmed
summary: Initialize the unk_20096E0 dispatch table and the text-script/decompression tables used by the
  title-screen flow.
interface: 'void initTitleScreens_81270D0(void); // inputs: r10, lr; outputs: r5, r7; clobbers: nzcv,
  r0-r3, lr; preserved: r4-r7'
details: 'Walks the 0x20-byte `off_8127160` array (four entries of three u32 words:

  a compressed-source pointer, a deferred size 0x2, a target pointer, a deferred

  size 0x20). For each entry it calls sub_811FB84(src, size) and stores the returned

  pointer into `unk_20096E0` (the dispatch table), then copies the two trailing

  words verbatim into the next two slots. A trailing zero is written after the

  four entries (slot 12). Finally it dispatches decompAndCopyData twice — once

  with the freshly built `unk_20096E0` table, once with the `byte_8127188`

  initializer list — and calls sub_8123300 with the `off_8127120` script list,

  `eTextScript201BF20` and `eDecompBuffer2013A00`. The script list contains

  CompTextScript86D7578 etc., naming convention indicates navi-custom / folder

  menu text scripts for the title/folder-edit UI, consistent with the

  `eTextScript201BF20` / `eDecompBuffer2013A00` text-script engine.

  '
