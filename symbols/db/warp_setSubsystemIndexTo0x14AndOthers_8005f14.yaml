name: warp_setSubsystemIndexTo0x14AndOthers_8005f14
address: '0x08005F14'
kind: function
status: confirmed
summary: Warp-side hook that switches the main loop over to subsystem 0x14, bracketed by a pre-warp setup routine
  and a timer-table tick.
interface: 'void warp_handControlToSubsystem14_8005f14(void); // r0-r3,lr in: guest/scratch, clobbers r0-r3 and
  flags; r4-r7 preserved'
details: 'Runs sub_8005EEC (pre-warp setup, reached via the guest trampoline), then loads the current GameState
  pointer from Toolkit+oToolkit_GameStatePtr (fetched through r10, the toolkit base) and stores 0x14 into GameState+oGameState_SubsystemIndex
  (+0x00), the byte that tells the main loop which subsystem to run next. It then calls timer_tickCountdownTable_8035738,
  which advances the countdown-table timers, and its register values are what this function leaves in r0-r3. r4-r7
  are saved and restored; lr is popped directly into pc so the return is a plain return to the caller.

  '
