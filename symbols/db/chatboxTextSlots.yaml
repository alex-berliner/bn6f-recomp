name: chatboxTextSlots
address: '0x0200AFA0'
kind: data
status: probable
summary: 'Proposed name: chatboxTextSlots. Eight 64-byte chatbox text-buffer slots shared by script execution,
  nested text levels, and queued sprite animation data (u8)'
details: The label begins an eight-slot ring buffer, each slot selected by multiplying a slot index by
  64. Chatbox routines copy script strings or render formatted BCD numbers into these slots and store
  pointers into the chosen slot as the active text cursor. Other chatbox routines address the same array
  while opening nested levels, and sprite_queueAnimData copies a 64-byte animation block into a selected
  slot, showing that the buffer is shared rather than owned by one subsystem. Its exact ring-buffer cursor
  and initialization behavior are not present in the listed uses.
