name: owPlayer_zeroS2000AA0Param0x4_809e312
address: '0x0809E312'
kind: function
status: confirmed
summary: Clears the overworld player struct's byte at 0x2000AA4 (the eStruct2000aa0 Sprite_04 field) and returns
  0.
interface: void owPlayer_zeroS2000AA0Param0x4_809e312(void); // returns r0 = 0, r3 = &eStruct2000aa0, Z set / N
  clear
details: 'Two-entry tail pair: the outer label owPlayer_zeroS2000AA0Param0x4_809e312 does

  `mov r0, #0` (setting Z, clearing N) and falls through into the inner setter

  owPlayer_setS2000AA0Param0x4_809e314, which loads =eStruct2000aa0 into r3 and does

  `strb r0, [r3, #oS2000aa0_Sprite_04]` — i.e. stores 0 to byte_2000AA4, offset 4 of

  the overworld player state struct at IWRAM 0x2000AA0. The inner entry point can also

  be branched to directly by callers that want to write the value passed in r0.

  Quirks: the return contract is unusual — it leaves r0 = 0, r3 clobbered with the

  struct address, and the NZ flags set by the `mov r0, #0`, so callers may rely on the

  flags even though this is not a compare. The field at offset 4 is grouped as

  "Sprite_04" in the struct layout; its exact game meaning (a sprite state/flag byte)

  is not confirmed.

  '
