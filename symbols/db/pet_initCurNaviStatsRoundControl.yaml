open_questions:
- What mode values 2/3/4 of pet_clearCurNaviStatsByte19 mean and which battle/round state each represents.
- Why three separate wrappers exist rather than one parameterized function.
- Whether byte 0x14 (covered by the 3-byte write) carries independent meaning or is just zeroed as a side
  effect.
