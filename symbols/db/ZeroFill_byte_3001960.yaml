name: ZeroFill_byte_3001960
address: '0x080017E0'
kind: function
status: confirmed
summary: Zeroes the 4-byte palette buffer at IWRAM 0x3001960 by calling ZeroFillByHalfword with a count of 2 halfwords.
interface: void ZeroFill_byte_3001960(void); // trashes r0-r1, preserves r2/r3, passes ZeroFillByHalfword's r1/c/v
  through to callers
details: 'Tiny wrapper: pushes lr, loads the address of palette_3001960 (an IWRAM buffer at

  0x3001960, 4 bytes = 2 halfwords, matching one hardware palette''s worth of backup/scratch

  space), sets the halfword count r1 = 2, and tail-delegates to ZeroFillByHalfword, which

  performs the actual zero-fill. It ends with pop {pc} so the caller sees the callee''s

  return state: r0/r1 and the nzcv flags are whatever ZeroFillByHalfword leaves behind,

  except r2 and r3, which the lifter confirmed are preserved end-to-end. Callers therefore

  apparently read r1 and c/v out of this routine, mirroring the callee''s odd contract.

  No game logic beyond clearing this palette-sized scratch buffer.

  '
