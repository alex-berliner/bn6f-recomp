name: oBattleState_SubPhaseInitFlag
address: '0x3'
kind: struct-field
status: probable
summary: Per-substate init-done latch; 0 = run setup, 4 = setup done, awaiting continuation condition
details: 'Every read is `ldrb r0, [r5,#oBattleState_Unk_03]` immediately followed by `tst r0, r0` to branch
  on zero/non-zero. Every write stores the literal `4` (`mov r0, #4; strb r0, [r5,#oBattleState_Unk_03]`)
  right after a one-time setup call. The pattern recurs identically across 40+ sub-state handlers (countdown,
  intro spawn, fade-out, chip-select init, link-sync wait, chatbox tutorials, result-decide, etc.), so
  the field consistently marks "setup done, now poll the per-frame condition."'
