    — The code does exactly what the summary says: ldr r2,[r2,#oToolkit_BattleStatePtr] fetches the state,
    then lsl r0,#2 + add #oBattleState_Drop indexes into Drop, and ldr r0,[r2] / ldr r1,[r2,#8] returns
    two words. The note about stride is just hand-waving. The name ''battle_getDropEntry'' is reasonable,
