  date: '2026-10-18'
  detail: ldr r2,[r10,#oToolkit_BattleStatePtr] then add r2 + (r0<<2) + oBattleState_Drop — indexes battle-state
    drop data; ldr r0,[r2] / ldr r1,[r2,#8] — returns exactly the two fields at +0 and +8 of the indexed
    entry; 8-instruction leaf with no callees — pure accessor into the battle state; only caller sub_80E532C
    sits immediately before it, consistent with a small helper pair around drop handling
  refs:
