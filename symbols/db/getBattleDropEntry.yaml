name: getBattleDropEntry
address: '0x080E543C'
kind: function
status: probable
summary: 'Returns two words from drop[index] in the battle state: word at entry+0 in r0 and word at entry+8
  in r1; r0 is scaled by 4 and added to the Drop offset.'
interface: (r0 = drop index) -> r0 = word at drop[idx]+0, r1 = word at drop[idx]+8; flags not meaningful
  (last load sets them)
details: 'Fetches the current battle state via the toolkit''s oToolkit_BattleStatePtr (r10), then indexes
  the array/struct at oBattleState_Drop by r0*4 and loads two fields from the resulting address: [entry]
  and [entry+8]. It is a pure getter — no writes, no calls. The 12-byte-ish stride implied by reading
  +0 and +8 while indexing by 4 suggests r0 may actually be a byte/word offset or the entries overlap;
  the exact drop-record layout (likely item ID plus amount/count, given this is the post-battle drop table)
  needs the struct definition to confirm.'
