- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_80EC134: spawns t1 subtype-5 attack object and sets object_setFlag1 bit 22 before setting
    AttackElement=4 (wind-up state); loc_80EC15E: PlaySoundEffect(0xAE) at StepTimer==5, then panelX +
    object_getFrontDirection and damage+AttackBoost(+AttackBoost2) passed to sub_80C5176; byte_80EC1BC
    table indexed by ChargeCycles only when AiDifficultyTier == 3 (difficulty-dependent per-shot boost);
    tail: StepTimer cycles to 0xF, ChargeCycles-- ; <=0 sets HitElement=8 else resets AttackElement=0
    to repeat; callees object_setAnimation/object_setDefaultCounterTime/spawn_t1_0x5_tempAttackObject
    match a battle-object attack sequence'
