name: ai_stepMultishotAttack
address: '0x080EC11C'
kind: function
status: probable
summary: AI attack routine that winds up (animation 9 + charge effect object) and then fires a shot at
  the panel in front, repeating for ChargeCycles shots.
interface: (r0..r7 set up by AI attack dispatcher; r5 = battle object, r7 = oAIAttackVars) -> r0 = clobbered;
  updates oAIAttackVars (AttackElement, StepTimer, ChargeCycles, AttackBoost2, HitElement) and spawns
  attack objects
details: 'A state machine on oAIAttackVars_AttackElement. When AttackElement is 0 (wind-up): plays animation
  9 on the object, clears the related object''s current animation, resets the counter timer, spawns a
  type-1 subtype-5 temp attack object linked to this object, sets ObjectFlags1 bit 22, sets AttackElement
  = 4 and clears StepTimer. When AttackElement is nonzero (element 4, fired state): at StepTimer == 5
  it plays SFX 0xAE, and on difficulty tier 3 loads a per-shot damage bonus from byte_80EC1BC indexed
  by ChargeCycles into AttackBoost2; then it computes panel X + front-direction offset, total damage =
  Damage + AttackBoost + AttackBoost2, and calls sub_80C5176 with (x, y, InitFlag, 0x18<<16, AttackBoost2,
  damage) to place the attack. StepTimer counts to 0xF per cycle; then ChargeCycles is decremented — if
  shots remain, AttackElement resets to 0 for the next wind-up, otherwise HitElement is set to 8 to end
  the attack.'
