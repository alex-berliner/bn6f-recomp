name: sub_80A5C9C
address: '0x080A5C9C'
kind: function
previous_names: []
status: hypothesis
summary: Runs the one-shot intro text shown to the player's Beast during a PET/Beast-out sequence (player locked,
  script fired, chatbox closed on finish) and reports its result.
interface: '(r5 = ReqBBS state pointer, r10 = Toolkit) -> r0 = 0 done / 1 finished talking / 2 keep stepping ; side
  effects: locks/unlocks the OW player, drives a reqBBS text script, reads/writes chatbox state and a flag at [r5+0xa].'
details: "r5 holds some ReqBBS-related struct (offsets +0x6 = script index, +0xa = one-step frame/state byte used\
  \ as a 0/1 latch). On the very first call the byte at [r5+0xa] is 0: it falls through `bgt loc_80A5CBE`, runs\
  \ the unknown setup `sub_80A5CE4`, locks the OW player via `owPlayer_lockPlayerForNonNPCDialogue_809E0B0`, runs\
  \ `sub_80A5E44`, then calls `reqBBS_RunTextScriptWhoAmI` with r0=0 and r1=script index byte from [r5+6]; the latch\
  \ is incremented to 1 and the function returns 2 (the \"keep stepping\" sentinel that the caller 0x80A5B70 uses).\n\
  \  On subsequent calls the byte at [r5+0xa] is >0: it checks `eFlags2009F38` bit 0x80 (via `chatbox_mask_eFlags2009F38`);\
  \ if set, the chatbox is still busy and the function returns 2 again. Otherwise it reads the chatbox state with\
  \ `chatbox_GetState_8045F4C`; if state==0 it returns 1 (done talking) else returns 0 (still printing). It then\
  \ clears the latch byte, calls `owPlayer_unlockPlayerAfterNonNPCDialogue_809E122`, and returns the 0/1 result\
  \ (the caller uses this to advance the BBS state machine). `reqBBS_RunTextScriptWhoAmI`'s \"WhoAmI\" naming and\
  \ the presence of `eReqBBSGui`/`ReqBBS2001150` context make the strongest guess a Beast-out PET intro line (Rex/Roadrunner/etc.)\
  \ shown before the pet transforms, but the captured `r2`/`r3` values are pointers into PET data, not BBS GUI,\
  \ so the subsystem is Pet/Beast rather than BBS GUI itself.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r4, [r5,#0xa]` reads the per-frame latch at offset 0xa of an EWRAM struct in r5. - First-time
    branch (`bgt loc_80A5CBE` not taken) calls `sub_80A5CE4`, locks the OW player, runs `sub_80A5E44`, then `bl
    reqBBS_RunTextScriptWhoAmI` with r1 = byte at [r5+6], then increments the latch to 1 and returns 2 - classic
    "spawn dialogue and yield". - Subsequent branch polls `chatbox_mask_eFlags2009F38` with mask 0x80 (chatbox busy
    bit); if still busy returns 2; else checks `chatbox_GetState_8045F4C` and maps state==0 -> r4=1 (finished),
    state!=0 -> r4=0 (still printing). - Before returning the 0/1 result it calls `owPlayer_unlockPlayerAfterNonNPCDialogue_809E122`,
    confirming the script started under the lock above is being torn down. - Captured-call r2 values (0x084450dc/0x084450a0/0x084450b4)
    and r3 (0x08442240) point into the PET/NaviStats data area, not eReqBBSGui/ReqBBS2001150, so the underlying
    actor is the PET/Navi, not the BBS GUI - matches a Beast-out PET intro line.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080A5C9C

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080a5c9c '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- 'Exact identity of the line being printed: it''s only used in `snap_beastsp_*` captures (Beast/Spoutman spawn),
  but no text-archive pointer is captured in r2 - confirming the specific script would require tying the [r5+6]
  byte to a known reqBBS script index table.'
- Whether [r5] is `eReqBBSGui`, `eReqBBS2001150`, or a different EWRAM state struct - its offsets (+0x6 script index
  byte, +0xa 0/1 latch) are consistent with both, and the captured base pointer at r0/r1 in the snapshots lives
  in the 0x0844xxxx range that includes the ReqBBS pages, but not enough data is captured to be sure.
