name: battle_showCommError
address: '0x08007EB8'
kind: function
status: probable
summary: 'Aborts an ongoing battle as a link/communication error: pauses the battle, resets the link hardware,
  shows the appropriate comm-error message, and switches the battle state to 4.'
interface: () -> void; writes battle state byte (oBattleState_Index_01 = 4); clobbers r4
details: 'It pauses the battle (PauseBattle), resets SIO/link buffers, then clears flag bits 0x280000
  in the eStruct flags word and dispatches on the updated value. After some mode setup (setTwoStructs(5),
  sub_80062EC), it reads the current PET navi and the battle-effects bitmask. Message index selection:
  if effects bit 0x200000 is set the navi is forced to 0; if bit 0x8 is set the index is 0x5c + navi,
  otherwise it is navi*4, plus 3 when bit 0x20 is clear. That index is passed to chatbox_runScript with
  the TextScriptCommError87370C0 archive, and finally the battle-state byte is set to 4 to leave the battle
  into the error/exit flow.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl PauseBattle + bl link_resetHardwareAndClearLinkBuffers_81440D8 at entry: tear down an in-progress
    linked battle; ldr r0,=0x280000 / flags_clearBits / dispatch: clears battle-related flag bits; bl
    GetCurPETNavi + bl GetBattleEffects with tst against 0x200000/0x8/0x20 drives the message-index arithmetic;
    chatbox_runScript called with off_8008014 = TextScriptCommError87370C0, so the displayed script is
    a comm-error message; strb #4, [r5,#oBattleState_Index_01] at end: transitions the battle state machine
    to state 4'
