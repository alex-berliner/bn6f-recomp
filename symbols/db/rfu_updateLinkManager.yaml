details: The function operates on a struct at byte_200AF80 (r4). It first calls rfu_clearDisconnectedSlots, whose
  summary says it scans the four wireless slots for peers in finished states (0x46/0x47/0x48) and clears them. If
  the struct's state byte at +1 equals 1, it dereferences the pointer at +0xC and checks the byte it points to;
  if nonzero it calls sub_8146E5C(struct, 1), then sub_813D9A0(0x22) and sub_813D934(0) — likely a state transition/reset
  sequence. Finally it calls sub_803C90C every frame regardless. The 0x200AF80 block looks like the wireless link/session
  manager state struct, with the byte at +1 as the current mode and +0xC a pointer to some link status flag.
