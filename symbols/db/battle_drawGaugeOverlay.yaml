    full-flash drawing; ldrb r6,[r5]; add r6,#1; cmp r6,#0x70; svc 6 (div by 7); and r0,#3 — anim counter
    wraps at 112, 4 tiles at 0x9232 shown 7 frames each; call_sub_3005EBA(7,1,3,0x9222,0x10,1) then call_sub_3005EBA(7,1,3,0x922A,value>>10,1)
    — 16-tile background strip plus fill-length tiles; bgmap_WriteTileIdAtBlock_800187C(7+(value>>10),1,3,0x9222+((value>>7)&7))
    — single edge tile at the end of the filled portion
