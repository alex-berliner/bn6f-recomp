  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The branch logic inverts relative to the proposal: when r6 < 0x4000 (not full), it draws the base
    strip and fill (loc_801C5B2 path), and when r6 >= 0x4000 it increments [r5] and runs the flash animation.
    Also, the proposal misread the ''mod 7 then & 3'' as ''7 frames per tile''; `svc 6` returns remainder
    mod 7, then & 3 just selects one of 4 phases (0..3). The fill count comes from `(value>>10)+1` since
    both tiles 0x9222 and edge contribute, not just `>>10`. Name fits but summary needs correction.; run
    wf investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
