name: battle_drawGaugeOverlay
address: '0x0801C576'
kind: function
status: probable
summary: 'Redraws the on-screen battle gauge strip on the BG map each frame: when the gauge value at [r5+0x20]
  is below 0x4000 it draws a 0x10-wide base tile strip then a filled segment of up to 3 tiles; once the
  value reaches 0x4000 it instead increments an animation counter at [r5] (wrapped at 0x70) and uses (counter%7)&3
  to pick one of four full-gauge flash tiles at 0x9232. Skips drawing when battle_IsBattleEnding_800A97A
  reports end-of-battle.'
interface: (r5 = gauge state struct ptr, set by caller) -> r0 = clobbered; draws BG tiles
details: Reads a 16-bit value at [r5+0x20] (gauge value/spec) and a frame counter byte at [r5]. If the
  value has bit 14 set (>= 0x4000, i.e. full), it increments the counter byte, wraps it at 112, uses SWI
  6 (DivMod) by 7 and masks &3 to pick one of four tiles at 0x9232, and draws it via call_sub_3005EBA(7,1,3,tile,0x10,1)
  — a slow 7-frames-per-tile flash. Otherwise it draws a 16-tile strip of tile 0x9222 at fixed coords
  (7,1) in block 3, then fills (value>>10) tiles with 0x922A (the fill level, 1-15), and finally writes
  a single edge tile 0x9222+((value>>7)&7) at x = 7+(value>>10) via bgmap_WriteTileIdAtBlock_800187C.
  The whole update is skipped when battle_IsBattleEnding_800A97A reports the end-of-battle sequence. Note
  the state pointer arrives in r5, i.e. the caller passes it via a register convention rather than r0.
