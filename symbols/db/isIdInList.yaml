name: isIdInList
address: '0x08048F68'
kind: function
status: probable
summary: Scans a null-terminated halfword list at word_8048BE0 for a given ID and returns nonzero if it
  is present, which the caller uses to pick an alternate chatbox script.
interface: (r0 = id to search for) -> r0 = 1 if found in list, 0 if not; flags set by tst/cmp (result
  uses eq only)
details: Walks the halfword array word_8048BE0 (pointer loaded via off_8048F84), comparing each entry
  to r0; a 0 entry terminates the walk and returns 0, a match returns 1. It preserves nothing but the
  result, and only r0-r2/lr are clobbered-safe via push/pop. The caller sub_8047A96 passes r4 (an ID carried
  through its loop over flag 0x2420) and on success bumps the script index from 0x19/0x1b to 0x1a before
  chatbox_runScript, so the list marks IDs that get special dialogue. The function itself is a generic
  membership test; only the table at word_8048BE0 gives it game meaning.
