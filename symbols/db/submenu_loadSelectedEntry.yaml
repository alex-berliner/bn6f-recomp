name: submenu_loadSelectedEntry
address: '0x0812EC04'
kind: function
status: probable
summary: Loads the halfword at word_2023FA0 indexed by (cursor+scrollOffset)*4 into slot 9 via sub_811BC00,
  using submenu state at 0x2037780 fields +0x20 and +0x24.
interface: () -> r0 = destroyed; uses submenu state at 0x2037780 fields +0x20/+0x24; no return value used
  by callers
details: Fetches the submenu state struct via submenu_getStatePtr (global 0x2037780), reads the halfword
  cursor field at +0x20 and halfword at +0x24, adds them, and multiplies by 4 to index into the halfword
  array word_2023FA0. The loaded halfword is passed to sub_811BC00 with r1=0, r2=9, and r3 = the 4-byte-scaled
  table offset, which looks like a text/sprite loader with a destination slot or bank id. Callers run
  it when the submenu state is set to 4 (after IsScreenFadeActive) or unconditionally at the end of per-frame
  menu updates, right before sub_812EFD4. The combination with the neighboring sub_812ED58/sub_812E9AC
  calls suggests it refreshes the text shown for the highlighted entry as the menu closes or each frame.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'asm: ldrh r4,[r5,#0x20]; ldrh r1,[r5,#0x24]; add/mul-by-4 indexes word_2023FA0, so the entry
    is picked by state fields +0x20/+0x24; asm: ldrh r0,[r0]; ... bl sub_811BC00 with r2=#9, r3=r4 — the
    loaded halfword is handed to a loader-like callee; caller 0x0812DBD0: after IsScreenFadeActive sets
    state byte [r5,#2]=4, calls sub_812E9AC then this — a transition/close path; callers 0x0812DCEE and
    0x0812E8FA: call it (state==4 check in the latter) then sub_812EFD4, a paired update/refresh pattern;
    neighboring calls to sub_812ED58 in the same callers suggest menu redraw alongside this text load'
