name: rfu_setStateFlag10
address: '0x0803C4B0'
kind: function
status: probable
summary: Sets bit 0x10 in the flags word of the RFU/wireless shared state structure at 0x200BC50.
interface: () -> void; r0 = 0x10 passed to rfu_orFlags, no return value used
details: 'A one-call wrapper: it loads 0x10 into r0 and tail-calls rfu_orFlags, which ORs those bits into
  the flags field (offset 0xC) of the wireless shared state at 0x200BC50. The ''ldr r5, off_803C4BC''
  loading eS200A290 is dead code — r5 is never used and never restored to a meaningful value, likely a
  leftover from a build where the structure pointer came from that label. No caller is known, so the meaning
  of flag 0x10 (e.g. some wireless-connection state) cannot be determined from this function alone.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'asm: mov r0, #0x10; bl rfu_orFlags — the only action is ORing bit 0x10 via the known callee;
    callee rfu_orFlags: ''ORs the caller''s bits into the flags word (offset 0xC) of the RFU/wireless
    shared state structure at 0x200BC50''; asm: ldr r5, off_803C4BC // =eS200A290 with no subsequent use
    of r5 — dead load, noted as a quirk'
  refs:
  - bn6f/asm/asm03_1_1.s:7259
