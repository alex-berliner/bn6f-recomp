name: sub_8109CE6
address: '0x08109CE6'
kind: function
status: confirmed
summary: Dispatches the battle AI's attack step to one of four handlers based on the sub-state byte in the AIAttackVars
  struct.
interface: "/* in:  r5 r6 r7 r10 lr\n * out: r1 r5 r8 r9 r10 r11 r12\n * clobbers: N Z C V r0 r2 r3 r4 r6 r7 lr\n\
  \ * r7 -> AIAttackVars* (sub-state read from +0x00) */\n"
details: 'Reads the AI attack sub-state byte (oAIAttackVars_Unk_00, offset 0x00)

  from the AIAttackVars struct pointed to by r7, indexes the dispatch

  table at off_8109CF8 (0x00 -> sub_8109D08, 0x04 -> sub_8109D70,

  0x08 -> aiAttackVars_countdownSub_8109D98,

  0x0C -> ai_attackTickDown_timerEndExit_8109DBA), and tail-calls the

  selected handler via `mov lr, pc; bx r1`. Because the dispatch is done

  through `mov lr, pc; bx rN`, the live register file (including r7 and

  r10) is passed straight through to the handler with no save/restore

  and no C-callable wrapper. The selected handler''s outputs in

  r1/r5/r8-r12 are this routine''s outputs to its caller (the

  `pop {pc}` is a `return` rather than a real restore). The function is

  effectively a switch over the four sub-states of the battle AI''s

  attack phase, with no other work.

  '
