name: ai_panelAttackStep
address: '0x080F7BDE'
kind: function
status: probable
summary: 'Per-frame step of an AI attack state machine: first call winds the object up (charge anim +
  counters), then when the step timer expires it spawns the attack on the target panel and a visual/sound
  cue at the attacker.'
interface: (r5 = battle object, r7 = oAIAttackVars state struct) -> r0 = 0; updates oAIAttackVars fields,
  object CurAnim/counter, spawns effect object
details: 'If oAIAttackVars_AttackElement is 0, this is the wind-up pass: it sets AttackElement=4, sets
  oBattleObject_CurAnim=0x13, calls object_setCounterTime(0xC) and stores StepTimer=0x14, then returns.
  On later passes it decrements StepTimer each frame; when it reaches 0 it resets CurAnim to 0x14 and
  calls sub_80C86B0(panelX, panelY, InitFlag, AiDifficultyTier, Damage), which presumably spawns the actual
  attack at the target panel (r4=r6 are pushed/popped only to survive the call). It then reads object_getFlip,
  spawns a type-0 effect object with id 0x2A|flip<<8 at the object''s X/Y, plays sound effect 0x12D, and
  writes HitElement=0x14. The InitFlag/AiDifficultyTier/Damage fields are read straight from the AI state
  struct, so r7 is the per-attack AI work area and r5 the acting battle object.'
