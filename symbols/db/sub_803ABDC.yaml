name: sub_803ABDC
address: '0x0803ABDC'
kind: function
status: confirmed
summary: Marks a battle object as finished with its current action, playing the cur-move sound once.
interface: void sub_803ABDC(u32 r2; void *r5 /* battle object */; lr); clobbers r0, nz/c/v
details: 'Reads byte at r5+8 (an "action/step/state" counter). If it is not already 0x3F, plays

  SOUND_CUR_MOVE_80 via PlaySoundEffect, then writes 0 to r5+0x13 and 0x3F to r5+8.

  The 0x3F write is the "done" sentinel; this is the cur-move completion path called

  once per object so the sound does not replay on subsequent ticks. r5 is a battle

  object/actor struct (offsets +8 and +0x13 are small control/status bytes).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
