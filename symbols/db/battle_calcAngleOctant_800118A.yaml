open_questions:
- Whether callers really use this as a coarse octant for tile-distance checks
- versus e.g. an animation direction id is not pinned down by the snippet alone;
- seeing r0!=r1!=0 capture would settle it. The 0x20 bias choice suggests the
- goal is "snap to NSEW/octant grid" rather than "0..3 angle slice".
