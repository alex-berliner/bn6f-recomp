name: ai_attackPanelStrikes
address: '0x080EF3A0'
kind: function
status: probable
summary: Enemy AI attack state machine that repeatedly strikes the target object's current panel on a
  timed table, then flags the hit element when finished
interface: (r0 = ignored/attack state, r5 = target battle object, r7 = oAIAttackVars) -> r0 = clobbered;
  state fields in oAIAttackVars updated
details: On first entry (AttackElement == 0) it marks the attack as started (element = 1), calls sub_80EF3F4
  (likely a charge/setup effect), sets StepTimer = 4, ChargeCycles = 6, and plays animation 0x19. Each
  frame it decrements StepTimer; when it expires it resets it to 10, so the main logic runs every 10 frames.
  It indexes a table at oAIAttackVars+0x2F with the ChargeCycles countdown; if that entry is nonzero it
  calls sub_80DDDCC with the target object's PanelX, PanelY, Z, the attack's Damage, and an InitFlag byte,
  i.e. fires one strike at wherever the target currently stands. It then decrements ChargeCycles, giving
  up to six scheduled strikes at cycles selected by the table. When ChargeCycles reaches 0 it sets StepTimer
  = 30 (recovery/pause) and stores HitElement = 8, presumably advancing the attack to its next phase or
  signal.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'cmp r0,#0 / strb #1 AttackElement gates one-time setup: sub_80EF3F4, StepTimer=4, ChargeCycles=6,
    object_setAnimation(0x19); add r4,#0x2F; ldrb r4,[r7,r4] indexes a per-cycle table; nonzero entries
    gate bl sub_80DDDCC; sub_80DDDCC args ldrb [r5,#oBattleObject_PanelX/PanelY], ldr [r5,#oBattleObject_Z]
    plus Damage — strike is aimed at the target''s live panel position; StepTimer resets to 10 between
    cycles, so strikes are spaced 10 frames apart; ChargeCycles==0 ends the loop: StepTimer=0x1E and HitElement=8
    stored'
