details: 'Thumb entry point (0x0803FD9C) that is one of two alternate entries into the chatbox script runner whose
  shared body lives at loc_803FDA8 (routine at chatbox_runScript_803FDA4). It only does three things: pushes {r4,r5,lr}
  to build the stack frame the shared body expects (r4 lowest, lr highest; the body pops {r4,r5,pc} and reads r5
  and the return address from the frame), sets r4 = FALSE (0) meaning "no interrupted script to resume / start the
  script from the top", and branches into loc_803FDA8. The archive pointer (r0) and script index (r1) are simply
  carried through in registers for the body; this entry makes no decisions of its own. The sibling entry point sets
  r4 = TRUE to resume an in-progress script instead. Because the body returns with pop {r4,r5,pc}, control goes
  straight back to this function''s caller.

  '
