name: aiTrySelectChipFromHand_801336C
address: '0x0801336C'
kind: function
status: confirmed
summary: Checks whether the enemy AI may play the chip waiting in its battle hand this frame (no attack-power hint
  set, AI condition flags allow acting, hand not empty) and if so performs the chip selection via sub_8013236.
interface: bool sub_801336C(battleObject* obj /* r4, r5 = the battle object */, ...)
details: 'Takes the battle object in r5 (r4 also live on entry) and reads its AI data pointer at oBattleObject_AIDataPtr.
  First gate: the attack-power hint oAIData_APwrAtk must be 0xFF (unset); if it is set the function returns false
  without acting (the AI with an attack hint is handled elsewhere). If the plain hint is 0xFF it also checks the
  Beast-Out override oAIData_BeastOutAPwrAtk; only when both are 0xFF does it continue (i.e. during/with a Beast-Out
  hint present it still bails). Second gate: calls returnBoolIfAIDataFlagsAreSet_8012F3E to test the AI data''s
  condition flags; a false result returns false. Third gate: calls getCurChipInBattleHand_8010004 and compares against
  0xFFFF, the "hand empty" sentinel; an empty hand returns false. When all three checks pass it tail-calls sub_8013236
  with r0 = chip id from the hand and r1 = 0xFFFF to actually commit the chip selection, and returns that call''s
  results. Boolean false is returned as r0 = 0 with flags set accordingly; the caller reads the comparison flags
  (nz/c) of the return value.

  '
