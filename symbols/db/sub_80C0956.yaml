summary: 'Runs a battle object''s short intro delay: on first call sets anim 2, plays SFX 0xBE and arms a 5-frame
  timer; on expiry clears the object''s "busy" flag and advances its phase to 8.'
interface: void sub_80C0956(void);  // r5 = battle object pointer (in/out); r2, r10 preserved; r0, r1, lr clobbered;
  NZCV clobbered
details: "Operates on the battle object passed in r5.\n- First call (oBattleObject_PhaseInitialized == 0): sets\n\
  \  oBattleObject_CurAnimAndCurAnimCopy = 2, calls PlaySoundEffect with\n  sound ID 0xBE, sets oBattleObject_Timer\
  \ = 5, and marks the phase\n  initialized by writing 4 to oBattleObject_PhaseInitialized.\n- Subsequent calls:\
  \ decrements oBattleObject_Timer; when it goes\n  non-positive, clears bit 1 of oObjectHeader_Flags (the \"busy\"\
  \ flag)\n  and writes 8 to oBattleObject_CurPhaseAndPhaseInitialized to\n  transition to phase 8.\nField offsets\
  \ used: oBattleObject_PhaseInitialized, oBattleObject_CurAnimAndCurAnimCopy,\noBattleObject_Timer, oBattleObject_CurPhaseAndPhaseInitialized,\
  \ oObjectHeader_Flags.\nPhaseInitialized value 4 is the \"already ran intro\" sentinel; the\ntransition target\
  \ is hard-coded phase 8, suggesting this is the final\nbookkeeping/cleanup delay for a battle-object phase.\n\n\
  Register form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
