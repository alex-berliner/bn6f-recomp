    typical of a timed wait that also syncs with a link partner; GetBattleEffects result tested against
    0x400 and polled again via sub_800AF50 with outcomes 0/1/2 choosing steps 0xC/0x10 vs finishing; finish
    path calls setTwoStructs_800A840(3) (battle-result byte) and writes oGameState_BattleEndSubState =
