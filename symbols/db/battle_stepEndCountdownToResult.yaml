name: battle_stepEndCountdownToResult
address: '0x080082DC'
kind: function
status: probable
summary: Per-battle step that clears flags 0xE4C53, dispatches battle effect kind 0x1C, counts down 0x66
  frames while polling comm_checkCrossNetBattleReady, then either branches on battle-effects bit 0x400
  (sub_800AF50 result 1 → step 0xC, other nonzero → step 0x10) or records battle result 3 and writes 3
  to oGameState_BattleEndSubState and [r5,#4].
interface: '(r0 = unused; r5 = battle step/state struct: +0 = step dword, +3 = phase byte, +4 = result
  byte, +8 = frame counter halfword; r10 = toolkit) -> r0 = destroyed; writes [r5] step (0xC/0x10), [r5+4]
  = 3, oGameState_BattleEndSubState = 3'
details: 'On first entry (phase byte [r5,#3] == 0) it clears flag mask 0xE4C53 in the battle flags word
  via dispatch_801DACC and flags_clearBits_eStruct2035280, sets the halfword counter at +8 to 0x66, advances
  the phase byte to 4, and starts battle effect kind 0x1C via battle_dispatchKindEffect. Each subsequent
  call decrements the +8 counter and early-returns unless comm_checkCrossNetBattleReady reports 0 (partner/session
  not blocking). Once unblocked, it reads GetBattleEffects and tests bit 0x400: if set, sub_800AF50 is
  polled — result 1 stores step 0xC into [r5], any other nonzero result stores step 0x10, and 0/2 falls
  through. The fall-through (and the no-0x400-effect path) calls setTwoStructs_800A840(3) to record battle
  result 3, then writes 3 into oGameState_BattleEndSubState and [r5,#4]. The blt after decrementing the
  counter is odd since ldrh zero-extends, so it is likely a mis-aimed bne waiting for the count to hit
  zero.'
