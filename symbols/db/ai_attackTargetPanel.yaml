name: ai_attackTargetPanel
address: '0x0810108E'
kind: function
status: probable
summary: Dispatches an AI attack against the panel target stored in the AI attack-vars struct, passing panel X/Y,
  a flag and the damage value to the attack routine.
interface: (r0 = AI attack-vars struct in r7 on entry; reads oAIAttackVars) -> calls sub_80D6D18(x, y, initFlag,
  damage); r0 after return is that callee's return; flags from callee.
details: 'This is a thin wrapper over sub_80D6D18: it loads the target panel coordinates (oAIAttackVars_TargetPanelX/Y),
  the InitFlag field and the Damage field from the AI attack-vars struct addressed by r7, then tail-invokes sub_80D6D18
  with (x, y, flag, damage). r4 is zeroed (likely an unused/fifth argument slot kept at 0). It preserves only r4/r6,
  so it is a leaf-style dispatcher inside the battle AI attack machinery.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1 from oAIAttackVars_TargetPanelX/Y show the attack is panel-targeted; ldr r6 of oAIAttackVars_Damage
    and mov r4,#0 form the (x,y,flag,damage,0) argument set; single callee sub_80D6D18 receives exactly the struct
    fields, so the function only forwards AI attack-vars data; called from sub_81009E8, another AI attack-vars consumer,
    fitting an attack-execution step
  refs:
  - bn6f/asm/asm31.s:158558
  - 0x081009E8 sub_81009E8
