    investigate-20261019-033611'
open_questions:
- sub_80D6D18 is unknown, so whether this deals damage, cracks panels or schedules the hit is unconfirmed
- the meaning of oAIAttackVars_InitFlag as an argument (init/reset request vs attack id) is unclear
- role of the zeroed r4 (extra argument or padding) is unknown
