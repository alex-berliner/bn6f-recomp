  date: '2026-10-19'
  detail: 'bl ow_cybercrowGetCrowRecord; mov r5, r0 fetches the record struct; ldrb r0, [r5]; cmp r0,
    #3; beq locret skips the store when state == 3; strb r4, [r5] writes r1 into offset 0 of the record;
    caller sub_8143220 ''sets state byte to 1 unless it is 3 (sub_81432FA)'' matches exactly; callee summary
    confirms r0 indexes the eight 0x14-byte crow records'
