name: ow_cybercrowSetCrowRecordState
address: '0x081432FA'
kind: function
status: probable
summary: Writes a new state byte into one of the eight Cybercrow crow records unless it is locked at state
  3.
interface: (r0 = crow record index, r1 = new state value) -> r0 = record pointer (side-effect only); no
  meaningful flags
details: Calls ow_cybercrowGetCrowRecord to fetch the record at r0 (index * 0x14 into byte_2000D20), then
  checks the record's first byte (its state). If the state is 3, the write is skipped entirely; otherwise
  r1 is stored into offset 0 of the record. So state 3 acts as a locked/permanent flag that later countdown-reset
  callers cannot overwrite. r1 is stashed in r4 across the call; the return value is the record pointer
  from the callee, unused by callers.
