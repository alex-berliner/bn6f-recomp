name: objectStateDispatcher_8117D2C
address: '0x08117D2C'
kind: function
status: confirmed
summary: Dispatches an object's per-state update handler based on the state byte at [r5,#8] via a three-entry jump
  table.
interface: void objectStateDispatcher(/* r5 */ Object *obj /* and r2-r12, nzcv forwarded to the state handler; results
  = whatever the handler returns */)
details: 'Tiny tail-style dispatcher for the object whose pointer is in r5: it loads the byte at [r5,#8] (the object''s
  current state, stored as a raw *byte offset* into the table at off_8117D40, so valid values are 0, 4 and 8 - not
  word indices), reads the word at off_8117D40[state], and calls it as a Thumb pointer via bx with lr set to the
  return address. Quirks: before jumping, r0 is overwritten with the handler''s own table entry (Thumb address),
  so each state handler can locate data/entries that follow it in the table; r1 is loaded with the state byte itself.
  All other registers (r2-r12) and the condition flags pass straight through to the handler, and the handler''s
  register/flag results become this function''s results. The three handlers are sub_8117D4C (state 0), sub_8117DC8
  (state 4) and sub_8117EC0 (state 8). No other state value is expected; anything else would jump through an out-of-table
  word.

  '
