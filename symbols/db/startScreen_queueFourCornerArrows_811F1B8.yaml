status: probable
summary: Queues four corner-arrow OAM tiles (top-left + top-right + bottom-left + bottom-right) for the
  PET/Navi-select screen overlay.
interface: () -> void ; queues four 8x8 OAM sprites via sprite_queueOamEntryThunk_802FE28 using two paired
  descriptor tables (r0=tilePtr/u16 attr, r2=0, r3=1)
details: "Two near-identical loops, each iterating twice over a 4-entry table of {u32 tilePtr, u16 attr}\
  \ pairs.\n  First table starts at dword_811F1F0: entries 0x40044011/0xC385, 0x40000000/0xC311, then\
  \ pads 0x24.\n  Second table starts at dword_811F204: entries 0x4078406E/0xC380, 0x4000006E/0xC398,\
  \ then 0xC384/0.\n  Each call passes (tilePtr, attr, 0, 1) to sub_802FE28 (sprite_queueOamEntryThunk),\
  \ so it\n  hard-codes r3=1. The four OAM tiles correspond to the four triangular \"corner arrow\" sprites\n\
  \  used on the PET/Navi-select screen edge frame. Pure side-effect helper called from both\n  init/refresh\
  \ paths and the per-frame tick of that screen.\n"
