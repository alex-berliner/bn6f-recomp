name: sprite_chatbox_80026D6
address: '0x080026D6'
kind: function
status: confirmed
summary: Tiny thunk that tail-dispatches to the shared sprite update routine with r4 preset to that routine's own
  thumb address, preserving the caller's r4 across the call.
interface: 'void sprite_updateTrampoline_ADDRESS(void); // in: r5 forwarded untouched to _sprite_update, lr = return
  addr; out: r4 = caller''s original r4 (preserved), flags clobbered by the callee'
details: 'Pushes {r4,lr}, loads r4 with _sprite_update+1 (thumb bit set), then does mov lr, pc / bx r4 so _sprite_update
  runs with r4 pointing at its own entry address - the convention that routine uses to locate its data tables. On
  return, pop {r4,pc} restores the caller''s r4 and returns using the lr saved at entry, so the caller never sees
  the modified r4. r5 is neither saved nor restored: whatever the caller has in r5 simply passes through to _sprite_update,
  which presumably consumes it as an argument. Exists because _sprite_update is a common helper shared by multiple
  callers that would otherwise each have to clobber their own r4.

  '
