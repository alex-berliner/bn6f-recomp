name: spawn_initBattleObject
address: '0x080C471C'
kind: function
status: probable
summary: 'Spawn-time initializer for a battle object: places it on the field from its coordinates, loads
  its sprite and starting animation, copies palette/facing from its related object, and enters the update
  state.'
interface: (r0 = battle object ptr, r5 = same object/header ptr) -> r0 = sub_80C4766 result; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE
details: Recomputes PanelX/PanelY from the object's world position, then loads a fixed sprite (args 0x80/0x10/0x5A)
  plus its animation data and clears its shadow. Sets oObjectHeader_Flags bit 1 (likely 'initialized/active').
  The starting animation index is copied from oBattleObject_Param1 into CurAnim and CurAnimCopy, so the
  caller selects the initial pose via Param1. Palette and horizontal flip are inherited from oBattleObject_RelatedObject1Ptr,
  indicating this object is a palette/facing-mirrored counterpart of a parent entity. Finally marks the
  object's state as CUR_STATE_UPDATE and tail-calls sub_80C4766.
