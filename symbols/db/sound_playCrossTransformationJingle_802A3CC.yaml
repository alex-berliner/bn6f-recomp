name: sound_playCrossTransformationJingle_802A3CC
address: '0x0802A3CC'
kind: function
status: confirmed
summary: Fires the two-part sound effect for the start of a Cross/Beast transformation — a jingle (0x1F) immediately
  followed by a roar (0x16).
interface: void sub_802A3CC(void); // no meaningful inputs; r4-r7/r10 pass through untouched, C/V flags propagate
  from the sound dispatcher
details: 'Makes two back-to-back calls to sound_dispatchSoundRequest_8000642 (0x8000642) with

  hardcoded arguments: (idx=0x1F, 0xFFFF, 0x100) then (idx=0x16, 0xFFFF, 0x100).

  Sound 0x1F is the transformation jingle and 0x16 is the beast roar, matching the

  Cross/Beast transformation cutscene audio. The 0xFFFF and 0x100 (0x80+0x80) pair are

  the generic "no special parameters" arguments used by most one-shot sound requests.

  Nothing is read from the caller''s registers — the function is effectively a

  parameterless sound cue. clobbered r0-r2/lr and NZ flags per the dispatcher; C/V are

  whatever the last dispatch left.

  '
