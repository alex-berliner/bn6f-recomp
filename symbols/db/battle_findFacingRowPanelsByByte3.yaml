name: battle_findFacingRowPanelsByByte3
address: '0x0800D1F0'
kind: function
status: probable
summary: Scans rows 1-3 of the battle grid inward from the far column (chosen via two facing args), and
  writes one byte per row to the caller-provided r7 buffer for the first panel whose byte[3] equals r0
  and whose flags pass object_checkPanelParameters, returning the count.
interface: (r0 = facingA/value, r1 = facingB, r2 = flag mask set, r3 = flag mask clear; r7 = output byte
  buffer) -> r0 = number of panels written; flags clobbered
details: 'Computes start column as 6 - 5*(a1^a2) and step as -object_getFlipDirection(a1,a1b result),
  so it sweeps column 6→1 or 1→6 depending on whether the two facing values match. For each row 1..3 it
  resets to the start column and walks panels via object_getPanelDataOffset; a panel qualifies when byte
  [panel+3] equals a1 and object_checkPanelParameters(col,row,a3,a4) passes. Qualifying panels are stored
  as one byte (row<<4 | col) at r7[count] and the row scan stops at the first hit, so at most 3 bytes
  are written. Quirk: r7 is used as output pointer but never pushed or initialized — the caller (or some
  convention) must supply it. Returns the match count in r0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'start column 6 or 1 derived from `eor r0,r1; mov r0,#5; mul; neg; add #6` before the row loop;
    row loop counter sp+0x1c incremented and compared `cmp r0,#3; ble` — grid rows 1..3; `ldrb r1,[r0,#3];
    cmp r1, a1` plus object_checkPanelParameters call gate each panel; result packing `lsl r1,#4; orr
    r0,r1; strb r0,[r7,r6]` stores row<<4|col; object_getFlipDirection result negated into sp+0x10 and
    added on mismatch path `loc_800D252` as the column step'
  refs:
  - bn6f/asm/object.s:3715
  - 0x0800CC86 object_checkPanelParameters
  - 0x0800E2CE object_getFlipDirection
  - 0x0800C90A object_getPanelDataOffset
  reproduce: python3 tools/asmcat.py 0x0800D1F0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s mechanics: it computes start col = 6 - 5*(a1^a2), step = -object_getFlipDirection(a1,a2),
    scans rows 1..3 walking cols via object_getPanelDataOffset, stores (row<<4|col) at r7[count] when
    byte[panel+3]==a1 and object_checkPanelParameters passes, returns count in r0. However, r7 is never
    pushed/initialized and is read directly via `strb r0, [r7,r6]`, meaning r7 must be a caller''s register-passed
    pointer (not sp-allocated), so the interface description should reflect that. The name fits but could
    be more specific to the byte3-match purpose.; run wf investigate investigate-20261018-235109; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
