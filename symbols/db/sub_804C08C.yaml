name: sub_804C08C
address: '0x0804C08C'
kind: function
status: confirmed
summary: 'Initializes the battle toolkit/HUD for a request: queues palette/tilemap GFX transfers into VRAM, configures
  the toolkit''s render info and an internal palette blob, resets HUD fields on the r5 battle object, runs an optional
  extra setup gated by event flags EVENT_4FB/EVENT_4FE, then sets the HUD phase byte and the EVENT_4FE flag.'
interface: void battleToolkit_initHud_804C08C(void *r5_battleObj, void *r10_toolkit); // preserves r4 r5 r6 r7;
  clobbers r0 r1 r2 r3 lr + nz c v
details: "Two queued 8-word-aligned GFX transfers are kicked off:\n  - src=byte_869D76C, dst=0x0600CC00, size=0xC0\
  \ (a chunky tilemap/palette blob into VRAM bank 0).\n  - src=byte_869D74C, dst=byte_3001B00, size=0x20 (a small\
  \ palette/tile blob into WRAM mirror area).\nRender info pointed to by toolkit->RenderInfoPtr gets: +8 = 0x1E09\
  \ (a packed BG control word, likely BG size/priority bits), +0x14 and +0x16 zeroed.\ntoolkit->Unk2009740_Ptr (a\
  \ 4-byte palette setup blob) is filled with [0x44, 0x3B, 0x00, 0x10] — looks like an OBJ/BG palette index assignment\
  \ plus a flag byte.\nOn r5 (the HUD/battle object): +0x14 := 0x0A (initial value), +0x11, +0x13, +0x15, +0x16,\
  \ +0x17 cleared, +0x18 := 2.\nGated extra init: if neither EVENT_4FB nor EVENT_4FE is set, call sub_804C2D0 (the\
  \ \"first time\" path).\nThen unconditionally call sub_804C144, write +0x10 := 4 (HUD state phase = 4), set EVENT_4FE,\
  \ and call sub_804C11C (likely a final apply/commit step that uses the just-configured state).\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
