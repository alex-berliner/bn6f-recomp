name: sub_80A5E44
address: '0x080A5E44'
kind: function
status: probable
summary: Turns the overworld player's facing direction and animation toward the position of the object passed in
  r5.
interface: (r5 = target object with X at +0xC and Y at +0x10) -> r0 = undefined; r4 clobbered; sets player animation
  via eStruct200ace0 and player facing direction
details: Loads the player's overworld X/Y via ReadOWPlayerObjectCoords, subtracts them from the r5 object's X (+0xC)
  and Y (+0x10), and reduces the resulting vector to an octant 1..4 via battle_calcAngleOctant_800118A (octant 0,
  i.e. same position, aborts). The octant indexes byte_80A5E7C to pick an animation id for owPlayer_setS200ace0_fixedAnimationSelect_809e13c
  and byte_80A5E84 to pick a facing direction for SetOWPlayerFacingDirection. Both tables are identical (3,3,1,7,5,0,0,0),
  so octants 6-7 yield 0, which likely leaves facing untouched or is handled as a no-op by the setter. The function
  relies on the caller having placed the target object pointer in r5, so it is effectively a r5-based helper rather
  than a normal r0-argument routine.
