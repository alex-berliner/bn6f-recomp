name: sub_81154B8
address: '0x081154B8'
kind: function
status: probable
summary: When the AI object's step animation (anim 2) reaches its marked final frame, switch to anim 3 and set the
  object's GUARD flag.
interface: (r5 = battle object, r0 unused on entry) -> void; sets oBattleObject_CurAnim = 3 and ORs OBJECT_FLAGS_GUARD
  into ObjectFlags1
details: Reads oBattleObject_CurAnim from the object in r5; if it is not 2 the function does nothing. Calls sprite_getFrameParameters
  for the current frame and tests bit 0x80 of the returned attribute byte — an end/hold marker on the last frame.
  On that frame it writes 3 to CurAnim and calls object_setFlag1 with OBJECT_FLAGS_GUARD. Called every tick from
  ai_attackVars_runMoveStep_8115272 and ai_throwObjectStep, so it acts as the post-move transition into a guarded
  idle. Nothing is returned; state lives entirely in the object struct.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurAnim]; cmp r0,#2; bne locret — only acts during anim 2; bl sprite_getFrameParameters;
    mov r1,#0x80; tst r0,r1; beq locret — waits for end-frame marker; mov r0,#3; strb r0,[r5,#oBattleObject_CurAnim]
    — switches to the next (guard/idle) animation; mov r0,#OBJECT_FLAGS_GUARD; bl object_setFlag1 — grants the GUARD
    object flag on arrival; callers ai_attackVars_runMoveStep_8115272 and ai_throwObjectStep both invoke it per
    step of the scripted panel move
