open_questions:
- What the opcodes 0xB2, 0xE5 and 0xE6 mean in the chatbox script engine (needed for a semantic name)
- Which structure r5 points to (chatbox text buffer vs. generic script buffer) and who owns it
- Why sub_803BA74 is listed as a caller while it appears to call battle_80290 instead
- The code at loc_803BAAE walks backwards in 2-byte steps until r4 <= r6, and the same backward pass continues
  at loc_803BAC8 after the unconditional sub r4,#2 — so it is one backward scan from the 0xE6 marker,
  not two separate scans. CopyBytes is called with src=r0+r5, dest=r1+r5, so r0 is source offset and r1
  is dest offset (the proposal reverses them). The 0xE5 -> 0xB2,0xE5 rewrite is correct, but the destination-byte
  index argument is read via 'ldrb r6,[r5,r3]' where r3 was already pushed as [sp,#4], consistent with
  the proposal.
