name: battle_spawnLinkedType1b
address: '0x080BC844'
kind: function
status: probable
summary: Spawns a battle object of type 0x1b on the panel at (r1,r2), linked to the parent in r5, with
  Timer=6, parent alliance copied, and a 0x62 halfword set from r3.
interface: (r0 unused/spawn idx 0x1b, r1 = panel X, r2 = panel Y, r3 = value for +0x62 halfword, r5 =
  parent BattleObject) -> r0 = spawned object ptr or 0; flags unchanged
details: Calls object_spawnType1 with type 0x1b; if the spawn succeeds, it positions the new object at
  the panel coordinates given in r1/r2 (PanelX/PanelY bytes), writes r3 to the halfword at offset 0x62,
  copies AllianceAndDirectionFlip from the parent object in r5, stores the parent in RelatedObject1Ptr,
  and sets Timer to 6. It also ORs 0x14 (bits 0x10|0x04) into oObjectHeader_Flags. The parent-link and
  copied alliance suggest a short-lived effect tied to the spawning object. The trailing words 0x280000/0x180000/0x1A0
  look like per-type velocity/tile data used elsewhere for this object type. What the type-0x1b object
  actually does in game terms is not shown here.
