name: rng_FillSeedBuffer_803FAEE
address: '0x0803FAEE'
kind: function
status: confirmed
summary: Fills the 0x80-byte buffer at dword_20067C0 with 32 random 32-bit words from the hardware RNG.
interface: void sub_803FAEE(void)
details: 'Loops 0x20 times (byte counter r7 stepped by 4 up to the literal 0x80), calling GetRNG each iteration
  and storing the returned 32-bit value into dword_20067C0[r7/4]. This looks like an RNG state/seed pool refill:
  the destination is a fixed IWRAM word buffer (0x20067C0) and the fill size 0x80 matches a 32-entry pool of u32s.
  No arguments, no return value; r4-r7 are saved/restored purely as callee-saved registers, and flags are clobbered
  by the cmp/blt loop.

  '
