name: ai_attackFrontStrikeStep
address: '0x080ECBCC'
kind: function
status: confirmed
summary: 'Two-phase AI step for the ''Front Strike'' NetBattle attack: first call sets up the melee animation and
  spawns the temp hit-box object; subsequent calls spawn a damage projectile in the facing direction with a per-tier
  speed offset and hit-counter tracking.'
interface: "void ai_attackFrontStrikeStep_80ecbcc(\n    u32 r2_in, u32 r3_in,\n    BattleObject *obj /* r5 */,\n\
  \    AIAttackVars   *av /* r7 */,\n    u32 r10_in);\n/* returns: r1 = spawned projectile ref or flag; r5, r7,\
  \ r10 preserved */\n"
details: "Phase 1 (AttackElement field is zero – setup, runs once):\n  • Sets the object's animation to 0x0B (front-strike\
  \ swing) and resets the\n    default counter time.\n  • Computes a spawn parameter = (battle_getAIHandlerSlot(obj)\
  \ << 8) +\n    difficultyTable0[av->AiDifficultyTier] where difficultyTable0 lives at\n    dword_80ECC54 (.word\
  \ 0x152F1515).\n  • Resolves the slot address for the temp attack object pointer inside\n    obj->AIData (at oAIData_TempAttackObjectPtr)\
  \ and spawns it via\n    spawn_t1_0x5_tempAttackObject (type 1, sub-type 5).  r7 is saved and\n    restored around\
  \ the call because the spawn routine clobbers it.\n  • Sets OBJECT_FLAGS_UNK_BIT_22 on the battle object (marks\
  \ active\n    front-strike state).\n  • Writes AttackElement = 4 (ELEMENT_FRONT) and zeroes the 16-bit\n    StepTimer.\n\
  \nTimer gate (every call):\n  StepTimer is incremented; while it is <= 1 the function returns, giving a\n  one-frame\
  \ hold between setup and the first hit.\n\nPhase 2 (StepTimer > 1 – attack frames, repeat):\n  • Increments the\
  \ hit counter at offset 0x10 inside the temp attack object,\n    so the strike can register multiple contacts\
  \ over its lifetime.\n  • Plays sound effect 0xAF (front-strike impact).\n  • Reads obj's facing direction via\
  \ object_getFrontDirection, adds it to\n    obj->PanelX to get the target column (X), keeps PanelY unchanged –\
  \ the\n    projectile is spawned on the panel directly in front of the AI.\n  • Per-tier speed offset is read\
  \ from dword_80ECC5C\n    (.byte 0x10,0x10,0x00,0x10) and shifted into bits 16–31 before being\n    passed in\
  \ r3 to spawn_t3_0x12_80C6ADA (type 3, sub-type 12).\n  • Total damage = av->Damage + av->AttackBoost; av->AttackBoost2\
  \ and\n    av->InitFlag are forwarded unchanged.\n  • On return, writes HitElement = 4 (ELEMENT_FRONT) to the\
  \ AI vars.\n\nTables:\n  off_80ECC48 has two entries; only the first (dword_80ECC54) is used here.\n  dword_80ECC58\
  \ (0x10A0A01) sits at the second slot but is unreferenced by\n  this function – likely consumed by a sibling AI\
  \ step or is dead.\n"
