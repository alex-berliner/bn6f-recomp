open_questions:
- What is the semantic meaning of OBJECT_FLAGS_UNK_BIT_22 – does it gate collision checks, prevent re-entry, or
  signal a visual state to the battle HUD?
- The second table entry dword_80ECC58 (0x10A0A01) is unused in this step; which caller consumes it?
- Does the hit counter at temp-object offset 0x10 have a cap, or does the projectile naturally expire and stop incrementing?
- spawn_t3_0x12's sub-type 12 – is this a single-panel forward jab or can the speed offset make it travel further
  across panels?
- How does the 1-frame hold (timer <= 1 gate) interact with the object_setDefaultCounterTime call made during setup?
