name: ai_attackFrontStrikeStep
address: '0x080ECBCC'
kind: function
status: probable
summary: 'Per-frame step of an AI enemy melee-style attack: on first entry plays a swing animation and
  spawns its weapon object, then after a short delay spawns a hit at the panel in front and plays a strike
  sound.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; spawns temp attack object and t3 sub-0x12
  hit object, sets HitElement = 4
details: 'Runs while oAIAttackVars_AttackElement is 0: sets animation 0xB on the owner, resets its counter
  to default, computes a value from sub_80ECC86 plus an AiDifficultyTier-indexed byte (dword_80ECC54/58
  tables), spawns the type-1 subtype-5 temp attack object linked to it, sets ObjectFlags1 bit 22, then
  stores AttackElement = 4 and StepTimer = 0. On subsequent calls StepTimer counts up; once it exceeds
  1, it increments the temp attack object''s byte 0x10, plays sound 0xAF, computes the panel in front
  via object_getFrontDirection + oBattleObject_PanelX, and spawns a t3 sub-0x12 object there (params 0x10/0x10/0x0/0x10
  from dword_80ECC5C by difficulty tier) passing Damage+AttackBoost, AttackBoost2, PanelY and InitFlag,
  finally setting oAIAttackVars_HitElement = 4. Element 4 suggests a fixed hit element (likely normal
  or a placeholder) for the strike.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'init phase calls object_setAnimation(0xB), object_setDefaultCounterTime and spawn_t1_0x5_tempAttackObject_80B8E30
    (asm at 80ECBD2-80ECBE2); second phase reads StepTimer, bumps temp attack object byte 0x10, and only
    proceeds past cmp #1/ble after two frames (80ECC08-80ECC14); strike phase uses object_getFrontDirection
    + oBattleObject_PanelX to pick the target panel for spawn_t3_0x12_80C6ADA (80ECC26-80ECC3E); PlaySoundEffect(0xAF)
    right before spawning the hit marks the strike moment (80ECC1C); AiDifficultyTier indexes dword_80ECC54/dword_80ECC5C
    tables, so difficulty scales timing/damage parameters (80ECBDC-80ECBEC, 80ECC30-80ECC34)'
  refs:
  - bn6f/asm/asm31.s:112975
  - 0x080005CC PlaySoundEffect
  - 0x0800E2CA object_getFrontDirection
