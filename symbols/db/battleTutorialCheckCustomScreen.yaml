  reproduce: python3 tools/asmcat.py 0x0802996E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The role fits (phase-0xA battle-tutorial check routine producing a message id or 0), and the sort-pair-{0,2}
    completion logic matches the swap at lines 0x802999A–0x80299A4. However the proposal conflates bytes
    at +8 and +0x49: counter==0 returns 0xC, and counter<2 with +0x48==0 or ==2 returns 0xB; counter>=2
    then re-reads +0x48/+0x49 independently of +8. Also the claim that values below 2 yield 0xB ''or''
    0x17 is wrong — below 2 only yields 0xB or 0xC, and 0x17 only appears at counter>=2 in the nag branch.
    Better name: battleTutorialCheckCustomScreen.; run wf investigate investigate-20261018-212108; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
