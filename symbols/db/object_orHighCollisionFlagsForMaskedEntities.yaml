open_questions:
- exact meaning of unk_2034F60 entries (occupant bitmask per tile vs. per-side list)
- semantic of the high halfword of SelfCollisionTypeFlags vs. the low halfword ignored here
- which word index each of the two call sites passes and why two are needed
- The beq at locret_300799C exits when the shifted mask r2 equals zero (all bits shifted out), not when
  a trailing zero is encountered — the scan always runs to the highest set bit. The lsl/lsl isolation
  of upper 16 bits and OR accumulation are correct. The '8 words per entry' claim for unk_2034F60 is speculation;
  the address calc is (r0+r1*8)*4 bytes selecting one 32-bit word, but entry layout isn't established.
