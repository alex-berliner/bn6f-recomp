open_questions:
- What does the "flag" byte at +4 actually represent (e.g. enemy slot index, variant flag, enemy-vs-friendly
  distinction)? It is used as the only selector between 0x23 and 0xA3 sprite kinds and indexes most property
  tables.
- The team 2 slotList table (off_8116EC8[2] -> off_8116ED4) holds five entries while the flag byte is
  treated as a small index; the table size suggests flag is 0..4 for team 2 but only 0..2 for teams 0/1.
- Offsets into unk_2020500 / unk_2034B6C chosen as workspaces by team are not analyzed here.
