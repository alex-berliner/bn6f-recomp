name: battle_objectInit_8116E30
address: '0x08116E30'
kind: function
status: confirmed
summary: 'Initializes a battle object: picks sprite kind from its flag byte, sets up its GUI sprite using
  the team''s workspace, applies per-team/per-object sprite parameters (animation, palette, priority,
  slot-list value, sub-entry palette bank, sub-record field), marks the object ready, and runs its per-kind
  update.'
interface: void battle_objectInit_8116E30(struct BattleObject *obj /* r5 */);
details: "Operates on a battle object record at [r5] with byte fields:\n  +0  kind  (written)\n  +4  flag\
  \  (read; chooses 0x23 when zero, 0xa3 otherwise)\n  +5  team  (read; indexes several team-keyed pointer\
  \ tables)\n  +8  state (written to 4, the \"ready\" value)\nPicks sprite kind 0x23 normally or 0xA3\
  \ when the flag byte at +4 is non-zero, stores it at +0.\nInitializes the GUI sprite via initGuiSprite_8002770(sub-kind=6)\
  \ using the team-selected\nworkspace pointer at off_8116F0C[team] (gAddresses for teams 0/1 are unk_2020500,\
  \ for team 2\nunk_2034B6C).\nThen applies several sprite properties, each looked up by team (outer)\
  \ and by flag (inner):\n  sprite_setAnimation  = byte_8116F18[flag]\n  sprite_loadAnimationData()\n\
  \  sprite_noShadow()\n  sprite_setPalette    = byte_8116F1D[flag]\n  sprite_setPriority_8002E14 = off_8116EB8[team][flag]\
  \      (byte_8116F23 base, all 0x02)\n  slotList_storeHalfwordAndClearField_800306C = off_8116EC8[team][flag<<2]\n\
  \                          (entries: 0x140/0x150/0x160 for teams 0/1; team 2 ptr points to\n       \
  \                   off_8116ED4 table of {0x140,0x150,0x160,0x140,0x150})\n  sprite_setSubEntryPaletteBank_800304A\
  \ = off_8116EEC[team][flag]  (byte_8116F28, all 0x0A)\n  sprite_setSubRecordFieldA_8003060     = off_8116EFC[team][flag]\
  \  (byte_8116F2D)\nFinally sets [r5+8] = 4 (state = ready) and tail-calls battle_objectUpdateByKind_8116F34\
  \ to\ndispatch into the per-kind logic. Caller is responsible for placing the object pointer in r5;\n\
  only r5/lr are live on entry; all other registers are clobbered by the callees.\n"
