name: ai_attackStepMoveToTargetPanel
address: '0x08109998'
kind: function
status: probable
summary: 'AI attack state-machine step: pick a target panel via callback, reserve it, and mark the object
  as moving there, or abort the attack if it cannot move.'
interface: (uses oAIAttackVars frame at r7, object at r5) -> void; sets HasMoved=0 and exits attack state
  on failure
details: First checks object_canMove; if blocked, it clears oAIAttackVars_HasMoved and calls object_exitAttackState
  to bail out. Otherwise it invokes the PanelChooseCallback (called via bx with LR=PC, returning panel
  X in r0 and Y in r1); if the callback returns X==0 it also aborts the same way. On success it stores
  the chosen X/Y into oBattleObject_FuturePanelX/Y, calls object_reservePanel to claim the destination
  panel, and ORs OBJECT_FLAGS_CANNOT_SLIDE into the object's flags so it can't be pushed off course. If
  the low bit of AiDifficultyTier is set, it also sets the object's CurAnim from oAIAttackVars_SubStepIndex
  (a difficulty-gated animation, e.g. a wind-up or dash pose). Finally it copies ScratchVar into StepTimer
  and stores 4 into oAIAttackVars_HitElement before returning, keeping the attack state machine on this
  step until movement completes.
