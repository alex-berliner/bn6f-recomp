name: sio_linkStateUpdate
address: '0x081446AC'
kind: function
status: probable
summary: 'Per-frame SIO/link state machine: samples the SIO control register, advances a comm state, and
  periodically copies a status byte out of the comm struct.'
interface: () -> r0 undefined; updates struct eTimerEnable200F460 (state at +1, mode at +2, counter at
  +0xD, 4-byte field at +0x2A), writes byte_200F448 and byte_200F450
details: 'Reads SIOControlRegister, masks bits 4-5 (lsl #26/lsr #30) and stores them at struct+2. Dispatches
  on the state byte at +1: state 4 runs sub_8144920/sub_8144AFC/sub_8144BF0; state 2 calls sub_814475C
  — if it returns nonzero, transitions to state 3 with counter +0xD set to 8 (or state 4 when the byte
  at +0 is zero), and if it returns zero fills the 4-byte field at +0x2A with 0xFF (a clear/receive buffer
  reset). Every call it increments the counter at +0xD, zeroes byte_200F450, and when the counter wraps
  to 8 copies struct+0x995 into byte_200F448. This is a polling/tick handler for the link-comm task, not
  battle logic; it runs from both menus and battle routes, consistent with an always-on comm driver update.'
