name: object_periodicSoundTimerTick_804C818
address: '0x0804C818'
kind: function
status: confirmed
summary: Ticks an object's countdown timer; on expiry reloads it with a random 300-555 frame delay and
  plays the object's periodic sound effect.
interface: void object_periodicSoundTimerTick_804C818(Object *obj /* r5 */); returns r10 pass-through
  (or PlaySoundEffect's r10 when it fires)
details: 'Simple repeating-delay timer for an object (r5 = object pointer). Decrements the s32 timer at
  [obj+0x14]; while it is still >= 0 after the decrement the new value is stored and the function returns.
  Once the timer has expired (decrement went below 0), it calls GetRNG, stores (rng & 0xFF) + 0x12C as
  the new delay at [obj+0x14] (i.e. 300..555 frames, about 5-9.25 s), then indexes the byte_804C858 halfword
  table with the object''s type/variant byte at [obj+0xE]; if that entry is non-zero it is passed as the
  sound id to PlaySoundEffect (with r2 being whatever GetRNG happened to leave in r2). So this is an ambient/background
  sound played at randomized intervals, with the sound chosen per object type via the table. Quirks: r2
  to PlaySoundEffect is uncontrolled RNG garbage; the function returns through r10 (either the caller''s
  r10 preserved or PlaySoundEffect''s r10 out), and clobbers flags, r0-r3 and lr while preserving r4-r7
  and r10.

  '
