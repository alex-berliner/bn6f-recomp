name: chatbox_8040C44
address: '0x08040C44'
kind: function
status: confirmed
summary: 'Per-character chatbox dispatcher: classifies the current output byte via the 0x10 control-code mask and
  steps the text-advance state machine (auto-advance flag + next-state byte at +0x1F0).'
interface: 'void chatbox_advanceState_8040C44(u32 in_r0, u32 in_r1 /* unused */, u32 r4, u32 r5 /* chatbox state
  */)

  // returns: in_r0=in_r0, r1=in_r1, r2=0x1F0; r4 preserved; r3 = old [r5+0x1F0] on control path, else left from
  chatbox_maskFlags_3e call. Final flags: control path CMP([r5+0x1F0],#3); printable path C/V from CMP(r1,0x5D),
  N/Z from MOV r1,#1.

  '
details: "Calls chatbox_maskFlags_3e(r0=0x10, r5) to refresh the control-character\nmask state. The pending character\
  \ class comes from that call's Z and\nreturned r1:\n  * control (Z set; r1 == 0; r1 == 0x25; signed r1 in [0x40,0x59);\n\
  \    signed r1 >= 0x5D):\n    - CB_ADVANCE (+0x1F2) := 0\n    - old_next := [r5+0x1F0]; if old_next != 3 (still\
  \ running) then\n      [r5+0x1F0] := (cur == 2 ? 1 : cur); final CMP is on old_next vs 3.\n  * printable (signed\
  \ r1 < 0x40 excluding 0/0x25, or signed r1 in\n    [0x5A,0x5C]):\n    - CB_ADVANCE := 1; CB_NEXT_STATE := CB_CUR_STATE.\n\
  Touched struct fields on the chatbox state at r5:\n  +0x1F2 (CB_ADVANCE,  auto-advance flag)\n  +0x1F1 (CB_CUR_STATE,\
  \ current text-advance state)\n  +0x1F0 (CB_NEXT_STATE, next text-advance state)\nPreserves r0/r1/r4/r5 across\
  \ the call; r2 ends holding 0x1F0 (the final\nliteral loaded on both paths).\n"
