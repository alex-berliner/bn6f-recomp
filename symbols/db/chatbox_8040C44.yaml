open_questions:
- Who calls this and from where in the per-character pipeline - is it the text-output pump, the control-code dispatcher,
  or the auto-advance ticker?
- Exact semantics of CB_CUR_STATE (1/2/3 = ?, 3 = "finished") and how 1/2 are typically entered.
- Why mask 0x10 specifically (vs. other control-code bits handled by chatbox_maskFlags_3e).
- Significance of the signed-character range windows (0x40-0x58 control, 0x59 boundary, 0x5A-0x5C printable, 0x5D+
  control) - likely a JP character-set split but worth confirming.
