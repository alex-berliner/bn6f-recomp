name: playOamSeq_802F9EC
address: '0x0802F9EC'
kind: function
status: confirmed
summary: Plays one of a small set of 7-byte-per-frame OAM animation sequences by indexing into a 3-entry
  pointer table.
interface: void playOamSeq_802F9EC(u32 index /* r0 */);
details: 'Selects a guest pointer from a 3-slot dispatch table at A_off_802FA00 using `index << 2` and

  calls sub_8001158 with that pointer. The two distinct data blobs the pointers can yield are

  `byte_802FA0C` and `byte_802FA28` (the table is `byte_802FA28, byte_802FA0C, byte_802FA28`,

  so indices 0 and 2 share the same sequence). Each blob is 28 bytes laid out as four 7-byte

  OAM frames (7F 40 58 80 37 xx / 7F 40 78 80 3F xx / 7F 00 98 40 47 xx / padding zeros), with

  the differing byte (0x30 vs 0x40) being the Y-coordinate offset — the two sequences are

  vertically offset variants of the same 3-frame sprite animation. sub_8001158 is therefore

  treated here as the OAM/blob player that ingests these guest buffers. Callee-preserved

  registers r4-r7 are preserved across the call.

  '
