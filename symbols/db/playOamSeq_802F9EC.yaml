open_questions:
- The actual player invoked via sub_8001158 has no typed interface in this file; its exact semantics (free-buffer?
  stream? enqueue?) are unknown.
- Who supplies the "index" argument and which of the two Y variants is selected at which moment is not
  visible from this function alone.
- There is also a separately-listed `event_flag_set` helper whose body appears in the same C block but
  is not exercised by sub_802F9EC itself; unclear whether it is dead code here or a transcription artefact.
