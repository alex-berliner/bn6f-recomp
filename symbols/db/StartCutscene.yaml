name: StartCutscene
address: '0x08036E90'
kind: function
status: confirmed
summary: 'Initializes the cutscene state in the Toolkit: wipes it, sets the new cutscene script and its param, parks
  the three secondary script slots on a dummy script, and installs the cutscene text archive and the default Unk_34
  table.'
interface: void StartCutscene(const CutsceneScript *script /* r0 */, u32 param /* r1 */, Toolkit *toolkit /* r10
  */) -> u32 default_Unk_34_table /* r0 */; r1 preserved; r2/r3/flags from ZeroFillByWord
details: "Retrieves the CutsceneState pointer from the Toolkit (r10 + oToolkit_CutsceneStatePtr, the global at s_02011C50).\n\
  Zero-fills the entire CutsceneState struct via ZeroFillByWord(state, oCutsceneState_Size).\nThen lays in the new\
  \ cutscene:\n  - CutsceneScriptPos and originalCutsceneScriptPos_40 = the incoming script pointer.\n  - Unk_04\
  \ = the caller-supplied param.\n  - CutsceneScriptPos2 / CutsceneScriptPos3 / CutsceneScriptPos4 = DummyCutsceneScript\
  \ (the no-op/terminator script the runner falls back to when a slot is idle).\n  - TextArchivePtr = eTextScript202DA04,\
  \ the cutscene text script archive.\n  - Unk_34 = off_8036EC4, a small table that begins with 0x04000000 (VRAM/DISPCNT-shaped\
  \ value) followed by a run of zero bytes -- looks like a default display/blending control block.\nReturns off_8036EC4\
  \ in r0, matching the value just stored at Unk_34, so the caller can pick up the same table without re-reading\
  \ the state struct.\nr1 is preserved across the ZeroFillByWord call (pushed then popped), as observed in the original.\n"
