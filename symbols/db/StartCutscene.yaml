open_questions:
- What Unk_34 actually controls (its first word 0x04000000 looks DISPCNT-shaped but the rest is zero).
- What Unk_04 is consumed by inside the cutscene interpreter (param? script index? event id?).
- Whether the three "secondary script slots" (ptr_20/ptr_24/ptr_28) are the layered/parallel script streams the
  cutscene VM multiplexes.
- Why a dummy script is parked in all three idle slots rather than a single sentinel.
