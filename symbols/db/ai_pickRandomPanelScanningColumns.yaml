name: ai_pickRandomPanelScanningColumns
address: '0x081038A4'
kind: function
status: probable
summary: AI helper that scans battle columns from the far side inward, and once a column contains matching
  panels, picks one at random and returns its row (plus a nibble field in r1).
interface: (r0 = battle object, r2/r3 = filter args passed through, r5 = same/related object, hidden)
  -> r0 = row (low 3 bits of panel byte), r1 = high nibble of that byte; returns 0 if no column has panels
details: The function negates object_getFrontDirection to get a scan step, then walks columns starting
  at 6 (or 1 if the byte at [r5+0x16] is nonzero), staying within 1..6. For each column it calls object_getPanelsInColumnIgnoreRowFiltered
  with r1 = [r0+0x13] plus the passthrough r2/r3, which fills a buffer at sp+0x10 and returns the match
  count. If a column is non-empty, it calls GetPositiveSignedRNG and svc 6 (modulo) to pick a random buffer
  entry, returning the entry's low 3 bits (the row within the column) with the high nibble in r1. If every
  column is exhausted without a match, it returns 0. This is characteristic of an AI attack/target-selection
  routine that finds a random panel in the nearest occupied column starting from the enemy's back edge.
