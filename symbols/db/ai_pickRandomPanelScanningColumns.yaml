    mov r4,#1 vs mov r4,#6); object_getPanelsInColumnIgnoreRowFiltered fills sp+0x10 and its count r6
    gates the loop exit; GetPositiveSignedRNG + svc 6 (r0 % r6) indexes the buffer at sp+0x10 to pick
    a random panel byte; return value: lsr r1,#4 / lsl+lsr by 0x1d splits the byte into a high nibble
    (r1) and 3-bit row (r0); 0 when no match (loc_81038F8)'
