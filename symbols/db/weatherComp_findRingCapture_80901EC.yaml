name: weatherComp_findRingCapture_80901EC
address: '0x080901EC'
kind: function
status: confirmed
summary: Checks the three ring-capture event flags and reports which one (0-2) is set, or none.
interface: u32 weatherComp_findRingCapture(u8* state /* r5 */) -> u32 found (r0); writes found index (0..2, or 0
  when none) to state[0x0C]; N/Z set from r0
details: Scans the halfword table at byte_8090220 containing the three "ring captured" event flags (0xBEC, 0xBED,
  0xBEE). Clears state[0x0C] first, then loops i = 0..2 calling TestEventFlag on each halfword flag; the first set
  flag stores its index into state[0x0C] and sets the found result (r6 = 1), breaking out early. If no flag is set,
  state[0x0C] remains 0 and 0 is returned. Note that when none is set, index 0 is indistinguishable from "not found"
  in the state byte except via the return value. A second table at byte_8090226 (flags 0xBE9, 0xBEA, 0xBEB) is present
  in the literal pool data but is not referenced by this function (likely a sibling variant's table). Part of the
  weather computer (weatherComp) subsystem.
