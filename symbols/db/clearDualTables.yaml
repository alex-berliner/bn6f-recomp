name: clearDualTables
address: '0x08146854'
kind: function
status: probable
summary: Zero-fills two parallel 8-entry tables (16-byte and 8-byte entries), likely resetting per-entity
  state before a battle or scene.
interface: () -> r0 = clobbered; clears unk_20098B0[0..7] (0x10 bytes each) and unk_2009750[0..7] (8 bytes
  each)
details: The function loops a byte counter from 0 to 7. Each iteration zero-fills 0x10 bytes at unk_20098B0
  + i*0x10 and 8 bytes at unk_2009750 + i*8 via ZeroFillByWord (BIOS CpuSet with a zero source). The two
  arrays are advanced in lockstep, suggesting parallel records for the same 8 slots — a common slot count
  for battle entities/objects in this engine. It takes no arguments and returns nothing meaningful; it
  is purely a bulk clear, presumably an init/reset step invoked from sub_8148234 at several points.
