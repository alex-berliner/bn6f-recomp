name: object_mrWeatherStep_80A94DC
address: '0x080A94DC'
kind: function
status: confirmed
summary: 'Per-frame step for the Mr. Weather overworld object: tests the weather event flag, checks player proximity
  to trigger an event, recomputes draw-layer priority from the player''s world Z, and advances the object''s sprite
  animation.'
interface: 'object_mrWeatherStep_80A94DC(r5: object_ptr, r6: prox_data, r10: state) -> r2, r3, r4, r5, r8, r9, r10,
  r11, r12 (via sub-call side effects)'
details: Called each frame from the overworld object dispatch loop (Next chain). First checks event flag EVENT_BFC
  (page 0xB, offset 0xFC) via TestEventFlagFromImmediate; if the flag is set (Z=1) it calls object_mrWeatherProximityTrigger_80A95A8(r5,
  r6) to test whether the player has entered the weather-trigger proximity zone. Regardless of the flag, it then
  calls owMapObject_updateLayerPriorityForPlayerZ_80A95EC(r5) to set the map object's draw-layer priority so Mr.
  Weather renders correctly relative to the player's world Z, and finally calls sprite_update(r5) to tick the sprite
  frame/animation. The r5 pointer (object struct) is threaded through all three sub-calls; r6 and r10 are consumed
  by the proximity trigger and re-read afterward. The function preserves r4–r9 and r12 via push {r4-r7,lr} but exposes
  whatever the sub-calls leave in r2, r3, r10, r11 to the caller.
