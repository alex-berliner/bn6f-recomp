status: probable
summary: 'Per-frame step for the Mr. Weather comp map object: if story event 0xBFC is unset, hand it off
  to the proximity trigger; then run generic step and sprite update.'
interface: (r5 = OverworldMapObject*, r6/r10 preserved, lr = return) -> r0 = OverworldMapObject* ; no
  other outputs the caller relies on
details: "Entry contract keeps the toolkit in r10 and the per-instance object pointer in r5.\n  1. Loads\
  \ the immediate flag id 0xBFC and calls TestEventFlagFromImmediate; if the flag\n     is set (NZ, branch\
  \ taken) it skips the proximity path entirely.\n  2. If the flag is clear it falls through to `bl sub_80A95A8`\
  \ (the proximity/state-8\n     handler that sets the per-instance event flag, plays sound 0x1A4 and\
  \ removes the\n     shadow once MegaMan is within 12 px and at the same Z).\n  3. Unconditionally calls\
  \ `sub_80A95EC` (the generic per-instance step / cur-state\n     dispatcher).\n  4. Calls `sprite_update(r5)`\
  \ to advance the OAM.\n  5. Restores r4-r7 and returns via lr pop (so all callee-saved registers are\
  \ live\n     for the caller, matching sub_80A9458's contract).\n  Mirrors the structure of other comp\
  \ map-object step functions in this file region\n  (test story flag -> optional proximity handler ->\
  \ generic step -> sprite update).\n"
