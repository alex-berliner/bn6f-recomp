name: sub_811794C
address: '0x0811794C'
kind: function
status: confirmed
summary: 'Per-frame step for the in-battle HP/shield bar UI tile: picks the tile variant from the current battle-chip
  art, repositions the sprite, advances its frame animation, and commits the new frame.'
interface: void sub_811794C(u8* state /* r5 */, struct* chipOrPanelCtx /* r7 */);  /* uses lr; clobbers r0,r1,r2,r3,r4;
  preserved r5,r6,r7; flags NZCV */
details: "Variant selection: r4 starts as 0x23 (normal). Calls sub_8047D84 (battle-chip art resolver);\nif its first\
  \ byte == 1 and word at +2 == 0x70 (likely the \"FullCust\"/LongSword or shield-style\nchip-id sentinel), switches\
  \ to variant 0x21 (max-width shield bar). Variant is stored as a\nbyte at [r5].\n\nPlacement: reads palette index\
  \ from [r7+8], computes\n   x = 0x24 + ((0x1E - (palette - 0xC)) << 3)\n   y = 0x38\nand calls sprite_setCoordinates.\
  \ This aligns the bar tile with the row of the player's HP\npanel based on which palette slot the current chip\
  \ art lives in.\n\nAnimation: sub_8117998 returns the next frame index. If it differs from the previously\nwritten\
  \ frame at [r5+5], the new index is stored, then sprite_setAnimation and\nsprite_loadAnimationData are invoked.\
  \ Finally sprite_update is called.\n\nQuirks: returns via `pop {pc}`, not `bx lr`. Reads only a single field off\
  \ the r7 context\n(offset 0x8, palette/slot index).\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
