name: map_lookupMapIdByGroupAndNumber_8001708
address: '0x08001708'
kind: function
status: confirmed
summary: Given a map group and map number, fetches that map's byte entry from either the real-world or internet
  group table and passes it to sub_80015FC (likely the map loader/setup).
interface: void map_lookupMapIdByGroupAndNumber_8001708(u8 map_group /*r0*/, u8 map_number /*r1*/); tail-calls sub_80015FC(u8
  mapId /*r0*/), so r0 out is sub_80015FC's return value; also clobbers r1, lr and returns sub_80015FC's flags/r2/r3
details: 'Takes a map group in r0 and a map number in r1. If the group is >= INTERNET_MAP_GROUP_START, it uses the
  internet-area pointer table A_off_8033878 ([Nullable<*const [u8]>; REAL_WORLD_NUM_GROUPS]) and subtracts INTERNET_MAP_GROUP_START
  so the index fits; otherwise it uses the real-world table A_off_803385C ([*const [u8]; REAL_WORLD_NUM_GROUPS]).
  Each table slot is a pointer (u32) to an array of per-map-number bytes; it indexes group*4 into the table, adds
  the map number to the loaded pointer, and reads one byte (the map''s ID/identifier). That byte is placed in r0
  and the function tail-calls sub_80015FC, so all outgoing register/flag state is whatever sub_80015FC produces.
  Uses "ldr rX, =label" PC-relative pools at off_8001724/off_8001728. Note the caller contract lists r10 as an input
  even though the routine never reads it (callers apparently hold it live across the call).

  '
