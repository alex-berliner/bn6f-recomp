name: battle_applyAIVersionBarrier
address: '0x0810ABFE'
kind: function
status: probable
summary: On first encounter (AI Version != 0xFF), apply a version-keyed barrier and trigger a version
  reaction sound.
interface: (r5 = battle object) -> void
details: Reads the battle object's AI data version byte (oAIData_Version_16), uses it as an index into
  byte_810AC2C (a short version->barrier-id table ending in 0xFF sentinels), and if the looked-up barrier
  id is not 0xFF it calls battle_installBarrier with that id. It then sets a flag at r5+0x60 via sub_80E0D98
  and plays SOUND_UNK_89 (the version reaction sound). Executed by recorded route 'battlesweep', indicating
  it runs once per battle when the opponent is first encountered, marking the encounter.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: ldr r4, [r5,#oBattleObject_AIDataPtr] + ldrb r0,[r4,#oAIData_Version_16] reads the chip-version
    byte from AI data; ldrb r0,[r1,r0] with r1=byte_810AC2C indexes a per-version barrier table terminated
    by 0xFF; bl battle_installBarrier applies the barrier id from the table; bl sub_80E0D98 with r7 =
    r6+0x60 sets/initializes a flag at oBattleObject+0x60; bl PlaySoundEffect(SOUND_UNK_89) plays the
    version sound when a valid version is found
