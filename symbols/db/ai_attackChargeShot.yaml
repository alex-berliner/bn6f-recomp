- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/strb on oAIAttackVars_AttackElement with 'tst; bne' picks init vs ongoing path; init writes
    4 and plays SFX 0x2B; mov r0,#0x1a; strb r5,CurAnim; bl sub_81066C0 sets the object's charge/startup
    animation; ChargeCycles decremented and reloaded to 0x10 with sound 0x2B both at init and charge-expiry
    (charge loop); StepTimer expiry calls sub_81066EA then reloads from AttackBoost2 and counts TimerOrCycles
    down (repeated firing); TimerOrCycles == 0 writes 0x10 to oAIAttackVars_HitElement, ending the attack
    phase
