name: ai_attackChargeShot
address: '0x08105F66'
kind: function
status: probable
summary: 'AI enemy attack handler: charges up a shot (with charge sound), then repeatedly fires it on
  a timer until the burst count runs out.'
interface: (r7 = enemy AI attack vars, r5 = battle object; uses only globals/struct fields, no args) ->
  void
details: 'Runs as a per-frame AI attack step. On entry, if AttackElement is 0 it initializes the attack:
  sets AttackElement = 4, plays animation 0x1A on the battle object, calls sub_81066C0 (likely charge/start
  pose setup), plays sound effect 0x2B, copies AttackBoost2 into StepTimer, and loads ChargeCycles = 0x10.
  While charging, it decrements ChargeCycles each frame and replays sound 0x2B, resetting ChargeCycles
  to 0x10 when it expires. Once charging finishes, StepTimer counts down and sub_81066EA is called on
  each expiry (likely spawning/firing a projectile), reloading StepTimer from AttackBoost2; TimerOrCycles
  counts the shots fired, and when it reaches 0 the handler writes 0x10 to HitElement, which presumably
  signals the attack script/state machine that this attack phase is complete.'
