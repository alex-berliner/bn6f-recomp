name: rfu_checkEntryPairEmpty
address: '0x0803F3A8'
kind: function
status: probable
summary: Returns 0 if the first two 12-byte entries of the selected 0x40-byte block in word_200A010 both
  hold the 0xFE empty marker, else 1.
interface: () -> r0 = 0 if both entries are 0xFE (empty), else 1; r2-r4 clobbered
details: Reads the index byte at unk_200AC33+3 and takes word_200A010 + index*0x40 as a record base. Scans
  entries at stride 0xC for r7=0 and 1, comparing each entry's leading halfword against 0xFE; bails out
  returning 1 on the first non-matching entry, and only falls through to return 0 when both entries match.
  The 0xFE halfword (bytes FE 00) acts as an empty/unused marker. The caller treats a 0 result as 'nothing
  present', storing state 4 into a status byte.
