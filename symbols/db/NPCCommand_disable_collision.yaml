name: NPCCommand_disable_collision
address: '0x0809EF9A'
kind: function
status: confirmed
summary: NPC script opcode that sets the NPC's "no collision" flag so the player can walk through it, then advances
  the script program counter.
interface: '(r5 = OverworldNPCObject *, r6 = script PC (updated in place), lr = return address) -> r6 = r6 + 1;
  flags nz/c/v updated by the final "adds r6, #1" (as if "adds r6, r6, #1"); r0 and r1 are scratch outputs; no other
  registers are touched.

  '
details: 'One of the NPC script command handlers (dispatched with r5 = NPC object, r6 = script instruction pointer).
  It reads the NPC''s flags word at oOverworldNPCObject_UnkFlags_60, ORs in the bit defined by OW_NPC_UNK_FLAGS_60_DISABLE_COLLISION
  (= 0x4), and stores it back, making the NPC intangible to the player (no blocking). It then increments r6 by 1
  to advance to the next script opcode and returns via "mov pc, lr". The name "UnkFlags_60" is still an unknown-fields
  placeholder; only this bit 0x2? — actually bit value 0x4 — has a known meaning here. No memory other than the
  flags field is touched, and the handler itself is only 4 instructions.

  '
