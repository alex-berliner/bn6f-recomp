name: battle_busterSpreadPhase
address: '0x080DF6CE'
kind: function
status: probable
summary: Battle phase handler that spawns two type-1/sub-5 child attack objects, plays the buster sound,
  and every 10 frames pulses the buster animation while advancing both children, ending after 120 frames
  by cleaning them up.
interface: (r5 = battle object, no args) -> r0 = undefined; no meaningful return
details: On first entry (PhaseInitialized==0) it marks the phase initialized, sets CurAnim to 0xE, spawns
  two type-1 subtype-5 temp attack objects via spawn_t1_0x5_tempAttackObject with parameter words 0x10006
  and 0x10005 into the slots at object+0x60 and +0x64, plays SOUND_BUSTER, and sets Timer to 0x78 (120
  frames). Each frame after that it decrements Timer2; every 10 frames it sets CurAnimCopy to 0xFF and
  calls sub_80B8E7C on both spawned objects (likely triggering their fire/advance step) and replays SOUND_BUSTER,
  giving a machine-gun buster volley. When the 120-frame Timer runs out it resets CurAnim, CurAction,
  and the phase state to 0 and calls sub_80B8E58 on both spawned objects to clean them up. The two spawn
  slots are read back through oBattleObject_ExtraVars and ExtraVars+4.
