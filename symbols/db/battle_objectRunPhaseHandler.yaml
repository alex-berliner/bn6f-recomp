name: battle_objectRunPhaseHandler
address: '0x080BF4D0'
kind: function
status: probable
summary: Dispatches the battle object's current-phase handler (phase 0 or 1) for the object at r5
interface: (r5 = battle object) -> returns from the selected phase handler; r1 = handler address
details: Reads the byte at r5+oBattleObject_CurPhase and uses it to index off_80BF4E4, a two-entry Thumb
  handler table (entry 0 = sub_80BF4EC, entry 1 = sub_80BF548). It sets LR = PC and branches to the handler
  so control returns to pop {pc} on exit. The object pointer is not passed as an argument; the handlers
  presumably also receive/assume it in a register (likely r5). The table covers only phases 0 and 1, so
  higher phase values would call garbage — callers must guarantee the phase is in range.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0, [r5,#oBattleObject_CurPhase] then ldr r1, [r1,r0] indexes the handler table by the
    object's phase field; off_80BF4E4 holds exactly two Thumb entry points, sub_80BF4EC+1 and sub_80BF548+1,
    for phases 0 and 1; mov lr, pc; bx r1 plus pop {pc} makes each handler run and return straight back
    to this function's caller
  refs:
  - bn6f/asm/asm31.s:16073
  reproduce: python3 tools/asmcat.py 0x080BF4D0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- No callers known, so which object type and when it runs are unconfirmed
- sub_80BF4EC and sub_80BF548 are unnamed, so what phase 0 vs phase 1 actually do (e.g. init vs per-frame
  logic) is unknown
