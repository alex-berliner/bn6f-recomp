details: |
  Reached as pickBattleSettingsEntry_80AA5F4 does: root (off_8020170 and the three after it, all four
  give this same list here) [group >= 0x80][group & 0x7F][map]. Entry layout as these entries show it:
  +0 a byte that is 0x00 in most entries and 0xE9/0xB6/0xB7/0x8F in some (meaning not known; the two
  0xE9 entries are the poison/grass-field ones), +1 0x78 or 0x14, +2 0x15, +3 the battle mode
  (GetBattleModeFromBattleSettings), +6 0x38 the panel column pattern
  (GetBattlePanelColumnPatternFromBattleSettings), +7 a condition byte (0, 1, 7), +8 u32, +12 the enemy
  setup (byte_80B75E1 and on; e.g. byte_80B7621 for the entry at 0x080B7254).
  The entry at 0x080B7254 (two Piranha2, id 0x08, and a mystery-data crystal, on a field of poison and
  grass panels) is the battle of Komari's run at game frame ~498270: written over
  GameState.CurBattleDataPtr (0x02001B9C) on the trigger frame it gives the video's field and enemies,
  and the field is the same for every value of the primary RNG at the trigger and in the 60 frames
  after it (the RNG does not choose the field).
