name: aiAttackForwardToType5E_80FF7A4
address: '0x080FF7A4'
kind: function
status: confirmed
summary: Thin AI-attack wrapper that reads the attack's init flag and cycle timer from the attack-vars
  block and forwards them with the caller's arguments to the type-5E spawn/linked-object routine.
interface: int sub_80FF7A4(r0 attackCtx, r1 arg, r3 arg, r5 arg, r7 attackVarsPtr) -> r1 updatedField,
  r5 updatedField; clobbers r0, r2, r3, lr, flags NZCV
details: 'Preserves r4 and r7 (push {r4,lr} / pop {r4,pc}); r7 is only read, never written. Loads two
  bytes from the AI attack-vars struct pointed to by r7: oAIAttackVars_InitFlag (byte) and oAIAttackVars_TimerOrCycles
  (byte). Calls sub_80D036C (spawnType5ELinkedToObject) with r0/r1/r3/r5 passed through unchanged, init
  flag in r2, and the timer in r4 (which the callee clobbers, hence the save/restore). Returns the callee''s
  r1 and r5 outputs directly; these are presumably updated attack-state fields echoed back to the caller.
  The function itself has no logic beyond this marshalling, so its identity depends entirely on sub_80D036C''s
  semantics.

  '
