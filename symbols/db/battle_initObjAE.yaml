  spawn context is unknown
- Exact argument mapping passed through to object_spawnType3/BasicBattleObjectInitialize (which saved
  arg lands in which parameter slot)
- Whether the mov r0,r5 sequence passes the new object pointer or another field to BasicBattleObjectInitialize
