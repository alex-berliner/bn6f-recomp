name: clearSoulWeaponsMapState
address: '0x08142734'
kind: function
status: probable
summary: Clears the per-map Soul/Beast event-flag block via sub_814278C's count, zeroes the 0xA0-byte state buffer
  at byte_2006670, and conditionally re-invokes sub_814227A if the flag from sub_81427F2 is still set.
interface: (r0 = current map id) -> void; ZF from final TestEventFlag
details: GetSoulWeaponsMapIndex turns the map id into a table index; the halfword table at byte_8142774 maps each
  index to a base event-flag id (0x750, 0x764, ... 0x7DC, step 0x14, one per map). sub_814278C supplies a count,
  and the loop clears flags base+count-1 down to base with ClearEventFlag. It then ZeroFillByWord's 0xA0 bytes at
  byte_2006670, a per-map state buffer (same size passed by the caller). Finally sub_81427F2 yields a flag id that
  is tested with TestEventFlag; if set, sub_814227A is invoked (likely respawning/rebuilding the map's SoulWeapons-related
  state). Called only from soulWeapons_apply_8142510 when applying Beast Out/Soul Unleash map state.
