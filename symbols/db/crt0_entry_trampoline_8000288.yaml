name: crt0_entry_trampoline_8000288
address: '0x08000288'
kind: function
status: confirmed
summary: ROM entry-point stub at the cart header's entry address that tail-trampolines into the game's startup routine
  and then returns straight to its own caller.
interface: 'void crt0_entry_trampoline(void); // in: lr (return address), r4 preserved; out: r2/r3 pass through
  from the callee, r4 unchanged'
details: 'Classic GBA crt0-style trampoline at 0x08000288 (the header entry address).

  It pushes lr, loads the thumb address of sub_3005E2C (+1) from off_8000298,

  and performs a manual interworking call with "mov lr, pc; bx r1" so the

  callee''s return lands on the following "pop {r0}; bx r0", which restores the

  original caller''s return address and branches back to it. Nothing is set up

  here itself — no stack frame beyond the pushed lr, no registers written —

  it exists purely to hop from the fixed ROM entry address into the actual

  startup code at sub_3005E2C while keeping the call/return chain intact.

  Whatever sub_3005E2C leaves in r2/r3 is passed through unchanged to the

  caller; r4 is preserved across the whole stub.

  off_8000294 (holding sub_3005E18+1) sits right after the code but is not

  referenced by this function; it appears to be adjacent data or a leftover

  pointer for a sibling entry variant.

  Quirk: because "mov lr, pc" in THUMB copies pc+4, the return address is the

  pop instruction — the callee must not clobber r0 before returning, since

  pop {r0}; bx r0 relies on the popped value only.

  '
