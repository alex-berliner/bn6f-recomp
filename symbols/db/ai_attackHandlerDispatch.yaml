name: ai_attackHandlerDispatch
address: '0x080FB206'
kind: function
status: probable
summary: Thumb dispatcher that reads AI HitElement and jumps to one of six attack handlers from table
  off_80FB218, preserving r7 via pop {r7,pc}.
interface: (r7 = AI state struct) -> tail-calls handler from off_80FB218 indexed by [r7,#oAIAttackVars_HitElement];
  returns via callee's bx lr
details: Reads the HitElement byte from the AI struct at r7, uses it as an index into a 6-entry Thumb
  handler table at off_80FB218, and tail-jumps to the selected routine by setting lr to pc+4 and doing
  bx r1. Handlers include ai_attackCountdownTick and ai_attackHoldState plus four unnamed routines (sub_80FB230,
  sub_80FB2A4, sub_80FB2EA, sub_80FB366), all part of the AI attack system. r0 is passed through unmodified,
  so it likely carries whatever argument the handler expects. The mov lr, pc / bx r1 pattern is a standard
  Thumb dispatch, not a plain call.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0, [r7,#oAIAttackVars_HitElement]; ldr r1, [r1,r0] indexes off_80FB218 by the AI struct's
    element field; off_80FB218 lists six Thumb pointers, two already named ai_attackCountdownTick and
    ai_attackHoldState; mov lr, pc; bx r1 tail-dispatches to the selected handler, so this is a switch
    not a wrapper; Both known callees are AI attack-state routines, placing this inside the AI attack
    state machine
  refs:
  - bn6f/asm/asm31.s:146295
  reproduce: python3 tools/asmcat.py 0x080FB206
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code confirms a Thumb dispatch via a 6-entry handler table at off_80FB218, but the table has
    exactly 6 entries and r7 is not restored/popped until the final pop (so this is not a tail call in
    the standard sense — r7 is preserved across the bx). The pop {r7,pc} on the unusual return path means
    handlers may return here only in edge cases; calling it a pure tail-jump dispatcher is overstated.
    The ''ai_'' prefix fits and a slightly more accurate name is warranted.; run wf investigate investigate-20261019-055111;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- What argument r0 carries into the handlers (set by the caller, which is unknown)
- Whether oAIAttackVars_HitElement truly is an element or a generic attack-mode index whose 6 values map
  to the six handlers
- The code confirms a Thumb dispatch via a 6-entry handler table at off_80FB218, but the table has exactly
  6 entries and r7 is not restored/popped until the final pop (so this is not a tail call in the standard
  sense — r7 is preserved across the bx). The pop {r7,pc} on the unusual return path means handlers may
  return here only in edge cases; calling it a pure tail-jump dispatcher is overstated. The 'ai_' prefix
  fits and a slightly more accurate name is warranted.
