name: sub_8007B80
address: '0x08007B80'
kind: function
status: confirmed
summary: Dispatches to the current battle-state phase handler via the two-entry jump table at off_8007B94, selected
  by BattleState::index_01.
interface: 'void sub_8007B80(void);  // in: r5 = *BattleState; out: r5..r12 (clobbered by handler); clobbers r0..r4,
  lr, N Z C V'
details: 'Loads the phase index byte from BattleState::index_01 (offset 0x01) into r0,

  then reads a function pointer from a 2-entry table at off_8007B94 indexed by that

  byte and tail-calls it (mov lr, pc; bx r1).

  Entries: 0x00 -> sub_8007B9C, 0x04 -> battle_state_tick_8007CA0.

  Pure dispatcher: no fallback/default entry exists in the inline table, so any

  index outside {0, 4} would jump to whatever word sits there. r0 is intentionally

  set to the raw index byte so the handler can read it on entry (matches the

  original ldrb r0 / bx r1 sequence).

  '
