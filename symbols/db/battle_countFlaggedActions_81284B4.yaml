name: battle_countFlaggedActions_81284B4
address: '0x081284B4'
kind: function
status: confirmed
summary: Tallies battle tag-table entries by bit-7, returning matched and unmatched counts.
interface: void battle_countTagFlagStates_81284B4(void); /* returns set_count in r0, reset_count in r1; clobbers
  r2,r3,NZCV; preserves r4-r7 */
details: 'Reads the loop bound from dword_2001140 (treated as signed by the do-while).

  For each iteration it takes a byte tag index from byte_2006530, scales it by 4 and looks up

  the corresponding entry in the 4-byte-per-entry table at byte_812851C. If entry byte 0 has

  bit 0x80 set the iteration contributes to r0 ("flagged" count); otherwise it contributes

  to r1 ("unflagged" count). The pair is returned in (r0, r1). The function preserves r4-r7

  per the register contract, even though only r4 and r7 are actually used in the body; the

  pushed r5,r6 appear to be cover for caller expectation rather than local state.

  Note: the verified C treats the loop bound as signed and runs at least once (do-while),

  which only matters if dword_2001140 ever holds a non-positive value.

  '
