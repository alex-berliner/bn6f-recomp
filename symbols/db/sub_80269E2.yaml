name: sub_80269E2
address: '0x080269E2'
kind: function
status: hypothesis
summary: Tests two status bytes at RAM eS20364C0 against a set of "blocking" values and returns 1 if either matches,
  0 otherwise (preserving the final CMP flags).
interface: 'void sub_80269E2(void); /* in: lr; out: r0 (0 or 1); clobbers nz c v r1; preserves r5 */'
details: 'Reads a 2-byte status word at eS20364C0 (RAM pointer loaded into r5). Byte 0 is

  first; if it equals 0 or 8 the function returns 1. Otherwise byte 1 is checked

  against the set {0, 8, 4, 0xC, 0x2C, 0x30, 0x34, 0x10, 0x14, 0x18, 0x1C, 0x20};

  any match returns 1. If nothing matches, returns 0. The NZC/v flags are set by

  the last CMP executed (so callers can branch on the comparison itself, not just

  on the returned r0). The address 0x020364C0 sits in IWRAM near other E reader /

  PET link / mini-game state, and the values 0xC, 0x2C-0x34 etc are typical

  "busy/transferring" status codes, so this is likely a "PET/Link/Beast Link is

  currently in one of these states - bail out" guard rather than gameplay logic.

  '
