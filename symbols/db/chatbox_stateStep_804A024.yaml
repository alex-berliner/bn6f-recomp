name: chatbox_stateStep_804A024
address: '0x0804A024'
kind: function
status: confirmed
summary: Advances the script-runner state machine for a chatbox-related step, either marking "still busy"
  or fading and finalizing when the chatbox is idle, then runs the common post-step hook.
interface: void chatbox_stateStep_804A024(u32 /*r5*/ state, u32 /*r10*/ ctx) -> r8 r9 r10 r11 r12; clobbers
  nz c v r0 r1 r2 r3 lr; preserves r4 r5 r6 r7 r8 r9 r12
details: "- r5 points to a small script/state struct; this routine only writes byte at [r5,#1].\n- First\
  \ checks chatbox flag bit 0x80 via chatbox_mask_eFlags2009F38; if the bit is set the\n  state-update\
  \ block is skipped entirely and the routine falls through to sub_8049F70.\n- Otherwise queries chatbox_GetState_8045F4C:\n\
  \    * non-zero (chatbox still busy): writes 0x0C to [r5,#1] as a \"waiting on chatbox\" sentinel\n\
  \      and returns.\n    * zero (chatbox idle): calls SetScreenFade(0x0C, 0x10) and writes 0x20 to [r5,#1],\n\
  \      presumably the \"done\" / next-phase marker.\n- Always tail-runs sub_8049F70 before returning,\
  \ which is the shared per-step tail hook\n  that also consumes r10.\n- No direct RAM globals are touched\
  \ here beyond the [r5,#1] byte; the chatbox and fade\n  side effects are dispatched through the helper\
  \ calls.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
