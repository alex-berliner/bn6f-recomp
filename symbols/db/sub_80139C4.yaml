open_questions:
- The exact meaning of `Unk_5c` (likely a "this counter opportunity has been used" flag pointer or an enemy reference
  list) - confirming it would settle whether this is a one-shot flag or a per-enemy dedupe.
- Why the code passes r2=4 and r3=0x10 to a spawn function whose params are described as (x,y,z,params,obj,a7) -
  r2 is probably not actually y here; the comment in the assembly already flags the disagreement with what `SpawnCounterPinkRingMaybe_80C4C12`'s
  declared contract wants.
