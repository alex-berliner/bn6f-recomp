name: sub_80139C4
address: '0x080139C4'
kind: function
previous_names: []
status: hypothesis
summary: From a player BattleObject's update hook, spawns the pink counter-hit ring when the player is in BeastOut/FormChange
  state and has not yet spawned one this counter opportunity.
interface: (r5 = *BattleObject) -> void ; no explicit r0 return used; clobbers NZCV and many scratch regs
details: "- Loads r5's AIData pointer into r7 via `ldr r7, [r5,#oBattleObject_AIDataPtr]`.\n  - Early-exits if the\
  \ object's HP is zero (`ldrh r0,[r5,#oBattleObject_HP]; tst r0,r0`) or if the AIData ActorType is not ACTOR_TYPE_PLAYER\
  \ (`cmp r0,#2`).\n  - Also early-exits if AIIndex > 0xB (only certain player AIs are eligible for the counter\
  \ ring).\n  - Reads the player's alliance byte and tail-calls `callPossiblyGetBattleEmotion_8015B54` (with the\
  \ alliance as the u8 argument that function's contract expects); if the resulting emotion/res0 is not equal to\
  \ 2, early-exits.\n  - Adds 0x5C to r7 (offset of AIData `Unk_5c`, a u32 slot) and tests whether the pointer there\
  \ is non-zero; if non-zero, early-exits (so each player can only spawn the ring once per AIData lifetime until\
  \ that slot is cleared).\n  - Sets r1=4, r3=0x10 and tail-calls `SpawnCounterPinkRingMaybe_80C4C12` with the BattleObject\
  \ pointer in r5 and the AIData-derived slot pointer in r7; the spawned object's type 0x5E is the pink counter-hit\
  \ ring.\n  - The function tail-calls via `pop {r7,pc}` so the callee gets control of the return; r5 is preserved\
  \ as the calling convention requires (contract out=r5).\n  - Captured calls all show r0=0 on exit and the slot\
  \ at AIData+0x5C is still 0x00000000, indicating the spawn path was not taken in the captured snapshots (consistent\
  \ with the early-exit / never-triggered one-shot).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `cmp r0,#ACTOR_TYPE_PLAYER` and `cmp r0,#0xb` at 0x080139D2/0x080139DA narrow execution to player-side,
    low-AIIndex battle objects. - `bl callPossiblyGetBattleEmotion_8015B54` followed by `cmp r0,#2` is the gate;
    res0==2 corresponds to the "BeastOut / transformed" mood per the callee''s contract (`emotion/transformation:
    u8`). - `add r7,#oAIData_Unk_5c` plus `ldr r0,[r7]; tst r0,r0; bne locret` is a one-shot guard against re-spawning
    the ring. - The callee `SpawnCounterPinkRingMaybe_80C4C12` is described in the project as "Spawns the pink counter-hit
    ring (object type 0x5E) over the counterattacked enemy and links it to the object that scored the counter",
    matching the trigger role of this function. - Only caller is `playerObject_update_80EA484`, which fits a per-frame
    player-side hook that would want to react to the moment a BeastOut/FormChange counter succeeds. - All 40 captured
    calls show r0=0 and the AIData+0x5C slot zero, meaning the spawn branch never fired during the story2 snapshots
    - the early-exit/one-shot path dominated.'
  refs:
  - bn6f/asm/asm00_2.s
