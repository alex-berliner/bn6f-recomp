name: oChatbox_TileBufferOffset
address: '0x70'
kind: struct-field
status: probable
summary: Byte offset into the chatbox's tile/graphics buffer where the next text or option glyph tiles
  will be written.
details: The field is consistently read/written as a 32-bit pointer-like offset that is incremented by
  per-glyph or per-line sizes (e.g. `+= TextScriptCharIdx`, `+= BoxGfxLoadState_0F*14`, `+= optionDef[N]*8`),
  zeroed on `chatbox_E9_newline` and on `chatbox_resetAndClearBuffers_8045F60`, pushed onto option-stack
  entries, and restored when popping/scrolling the option list. Its companion field `Unk_7C` is updated
  in lockstep with the same delta (often `Unk_7C += delta*4`), strongly indicating it tracks the current
  write cursor in the GFX/tile buffer.
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: Offset is loaded and advanced by `TextScriptCharIdx` to address a tile slot for the next char.
  refs:
  - bn6f/asm/asm38.s:2954
  reproduce: grep -n 'oChatbox_TileBufferOffset' bn6f/asm/asm38.s | head
  result: '"ldr r0, [r5,#oChatbox_TileBufferOffset]  add r0, r0, r1  add r0, #4"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Offset is advanced by `BoxGfxLoadState_0F*0xE` and decremented by 6 — a tile-stride per line
    computation.
  refs:
  - bn6f/asm/asm38.s:2954
  reproduce: grep -n 'oChatbox_TileBufferOffset' bn6f/asm/asm38.s | head
  result: '"ldr r0, [r5,#oChatbox_TileBufferOffset]  add r0, r0, r1  sub r0, #6"'
- method: assembly-reading
  date: '2026-10-15'
  detail: '`chatbox_E9_newline` resets the buffer offset to 0 when a new line begins.'
  refs:
  - bn6f/asm/asm38.s:2954
  reproduce: grep -n 'oChatbox_TileBufferOffset' bn6f/asm/asm38.s | head
  result: '"mov r0, #0  str r0, [r5,#oChatbox_TileBufferOffset]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Current tile offset is pushed onto an option-entry slot so a later `select` can restore the
    cursor position.
  refs:
  - bn6f/asm/asm38.s:2954
  reproduce: grep -n 'oChatbox_TileBufferOffset' bn6f/asm/asm38.s | head
  result: '"ldr r3, [r5,#oChatbox_TileBufferOffset]  str r3, [r5,r2]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Restoring the saved offset from an option stack entry when navigating back up the choice list.
  refs:
  - bn6f/asm/asm38.s:2954
  reproduce: grep -n 'oChatbox_TileBufferOffset' bn6f/asm/asm38.s | head
  result: '"ldr r1, [r5,r7]  str r1, [r5,#oChatbox_TileBufferOffset]  ...  sub r3, #2"'
- method: assembly-reading
  date: '2026-10-15'
  detail: '`Unk_70` and its sibling `Unk_7C` are advanced by the same delta (8 * optionArg), with `Unk_7C`
    scaled by 4 — characteristic of a paired byte/word tile cursor.'
  refs:
  - bn6f/asm/asm38.s:2954
  reproduce: grep -n 'oChatbox_TileBufferOffset' bn6f/asm/asm38.s | head
  result: '"ldr r2, [r5,#oChatbox_TileBufferOffset]  add r2, r2, r0  str r2, [r5,#oChatbox_TileBufferOffset]  ldr r1, [r5,#oChatbox'
