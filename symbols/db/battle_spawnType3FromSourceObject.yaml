name: battle_spawnType3FromSourceObject
address: '0x080D52C4'
kind: function
status: probable
summary: Spawns a type-3 battle object with id 0x7F and copies panel position, element, related-object
  pointer, damage/extra vars, alliance/direction-flip and an extra var from the source object, then sets
  header flag 0x10 on the new object.
interface: (r0 = source battle object ptr (also passed through as spawn arg after mov r5,r0), r1 = PanelX,
  r2 = PanelY, r3 = Element) -> r0 = new object ptr, or 0 if spawn failed; Z from spawn result
details: 'The routine saves its arguments, calls object_spawnType3 with object id 0x7F (mov r0,#0x7f),
  and on success fills the new object''s fields from the caller-supplied source: PanelX, PanelY, Element
  byte fields, RelatedObject1Ptr, DamageAndStaminaDamageCounterDisabler, ExtraVars, and copies the AllianceAndDirectionFlip
  halfword. It writes the source pointer (r5) into [newObject+ExtraVars] and stores one popped word at
  ExtraVars+4, so the source object is linked back from the spawned one. It then ORs 0x10 into oObjectHeader_Flags
  of the new object — likely a state/behavior flag for this spawn kind. On spawn failure it just restores
  and returns 0/keeps flags clear. Essentially a tailored wrapper around object_spawnType3 that clones
  combat context from an existing object into the new one.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x7f; bl object_spawnType3 — spawns fixed battle object id 0x7F of type 3; strb r1/[r0,#oBattleObject_PanelX],
    r2->PanelY, r3->Element — caller args become panel pos and element; str r5,[r0,#RelatedObject1Ptr];
    str r0,[r7] — source object pointer stored as related object; ldrh/strh oBattleObject_AllianceAndDirectionFlip
    copied from source object; ldrb oObjectHeader_Flags; orr #0x10; strb — sets flag 0x10 on the new object
    only on spawn success'
