name: spawnOWPlayerObjectForEnterMap_809e064
address: '0x0809E064'
kind: function
status: confirmed
summary: Spawns the overworld player object when entering a map and initializes it with the saved player position
  and facing direction from the game state.
interface: void spawnOWPlayerObjectForEnterMap_809e064(u32 r1, u32 r2, u32 r3, u32 r4, u32 r6, u32 r7, Toolkit*
  r10) -> OverworldPlayerObject* r5 (r0-r1 clobbered, NZCV clobbered, r2/r3/r4/r6/r7 preserved)
details: 'Thin wrapper around SpawnOWPlayerObject called on map entry. It calls the spawner with r0 = 0 and r4 =
  0 (with r1-r3, r6, r7 passed through as spawner arguments), then, if the spawner returned a non-null object pointer
  in r5, hooks it into the game state: stores the object pointer at oGameState_OverworldPlayerObjectPtr (via the
  toolkit''s GameStatePtr at r10 + oToolkit_GameStatePtr), copies oGameState_PlayerX/Y/Z into the object''s oOWPlayerObject_X/Y/Z
  fields, and writes the byte at oGameState_FacingDirectionAfterWarp into oOWPlayerObject_FacingDirection as a byte
  store. If the spawner returns null, the function returns without touching game state. Register quirk: the returned
  object pointer lives in r5 (not r0); r6 is used transiently as the game-state scratch pointer but the caller''s
  r6 value is restored by the push/pop.

  '
