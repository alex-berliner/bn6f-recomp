name: soulWeapons_apply_8142510
address: '0x08142510'
kind: function
previous_names:
- sub_8142510
status: probable
summary: 'Applies the SoulWeapons (Beast Out / Soul Unleash) map state: clears per-weapon flags, spawns
  overworld objects, drives the BBS request flag and value, and starts the matching cutscene.'
interface: '(no args — uses r10 = Toolkit) -> void ; side effects: many event flags cleared/set, one OW
  map object spawned per unacquired slot, BBS flag e17b0f7 set, AIData.Unk_15 set from a per-map table,
  and possibly StartCutscene(byte_8089448, 0)'
details: "- The contract says in=['r10','lr'] and out has only callee-saved and live regs, so nothing\
  \ meaningful is returned to the caller — treat as void-like.\n  - Initialises the SoulWeapons bitmap:\
  \ SetEventFlagRangeFromImmediate(EVENT_1650, 24) clears bits EVENT_1650..EVENT_1671 to zero the per-area\
  \ SoulWeapons state.\n  - If the player's current weapon (battle_getSoulWeaponBase_81427CE) is not yet\
  \ flagged as collected (TestEventFlag), the function returns immediately — early-out at locret_81425FC.\n\
  \  - Walks the per-map entries table at off_814230C[r4] (each 4 bytes: [u16 flag, u8 unk, u8 pad]).\
  \ r6 is set to 0/1 based on EVENT_740 (set_flag_e_740). While r6==0, copies the first entry's flag into\
  \ the SoulWeapons state buffer at 0x2006670+0x4 and two byte fields (offsets +2/+3) — likely initialising\
  \ the \"active weapon\" mirror.\n  - For each entry, if the matching EVENT_(0x1650+r4) is not yet set,\
  \ spawns an OW map object 0x0F (SpawnOverworldMapObject(0xf)) and clears the event flag — i.e. spawning\
  \ the SoulWeapons shard/object and resetting the per-area flag.\n  - After the loop, calls reqBBS_setFlag_e17b0f7_8140A00\
  \ to flag the BBS quest tracker, and runs sub_8036E86(0x21) (BBS request state machine step).\n  - If\
  \ EVENT_28 is unset AND GetSoulWeaponsMapIndex() < 6, calls loc_80353EA — gating the first-time available-area\
  \ branch.\n  - Then unconditionally writes Toolkit.GameStatePtr[0x3c]->Unk_15 = byte_8142610[mapIdx]\
  \ (a per-map 0x2D/0x3C/0x96 init table) — appears to seed the player's default SoulUnleash state for\
  \ the area.\n  - If EVENT_744 is set, calls StartCutscene(byte_8089448, 0) — the SoulWeapons cutscene\
  \ intro.\n  - Finally clears EVENT_740, 742, 743, 746, 747 to clean up the area-local storage.\n"
