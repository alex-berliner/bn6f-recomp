    returns early when no weapon is equipped. - "ldr r7, off_8142600 // =off_814230C; lsl r0, r0, #2;
    ldr r7, [r7,r0]" picks a 4-byte stride row from the map-indexed table. - Inner loop "SpawnOverworldMapObject(0xf);
    ... ClearEventFlag(0x1650+r4)" — spawns the shard and clears the corresponding event flag. - "bl reqBBS_setFlag_e17b0f7_8140A00"
    sets BBS event flag and the matching BBS state "sub_8036E86(0x21)". - "ldr r0, [r10,#0x3c]; strb r1,
    [r0,#0x15]" writes a single-byte GameState/AIData field from the per-map byte_8142610 table (values
    0x2D/0x3C/0x96 visible in the data block). - "bl StartCutscene // script byte_8089448" after "TestEventFlagFromImmediate
    EVENT_744". - Five "ClearEventFlagFromImmediate" calls to EVENT_740/742/743/746/747 at the tail.'
