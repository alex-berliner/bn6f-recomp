name: camera_raiseYWithLimit
address: '0x080302C0'
kind: function
status: probable
summary: If the new Y candidate (r0) is >= the camera's current Y limit at +0xE, updates camera+0xE with
  r0 and camera+0xC with r1, allowing the Y bound to only increase.
interface: (r0 = new halfword value, r1 = companion halfword value) -> void; writes [camera+0xC], [camera+0xE]
  only if r0 >= [camera+0xE]; no flags returned
details: Reads the camera object pointer from toolkit+oToolkit_CameraPtr (via r10). If the passed r0 is
  less than the halfword at camera+0xE it does nothing; otherwise it stores r0 to camera+0xE and r1 to
  camera+0xC. Both fields are halfwords, suggesting x/y screen-scroll positions or bounds in pixels. The
  one-way comparison acts as a monotonic clamp — the camera's value at 0xE can only grow, never shrink,
  with 0xC updated in lockstep.
