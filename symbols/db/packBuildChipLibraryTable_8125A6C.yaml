name: packBuildChipLibraryTable_8125A6C
address: '0x08125A6C'
kind: function
status: confirmed
summary: Build and compact the chip-library availability table by scanning every chip and recording its
  readiness/used/unused slot.
interface: "void packBuildChipLibraryTable_8125A6C(void);\n    // inputs: none (lifts to: r10/lr only)\n\
  \    // outputs: r0 = number of accepted chip slots filled; r2 = 0 (scratch)\n    // clobbers: r1,r2,r3;\
  \ flags NZCV; preserved: r4,r5,r6,r7 (per push/pop)\n"
details: "Zero-fills a 0x578-byte buffer at A_dword_201EC20 (PACK_DATA_BASE) via\nZeroFillByWord, then\
  \ iterates chip indices 1..0x13F (CHIP_COUNT_MAX),\nfetching each ChipData via getChip8021DA8. A chip\
  \ qualifies when\nChipData+9 has bit 0x40 set and ChipData+7 equals 2; its target slot\nindex is (ChipData+0x15\
  \ - 1) << 2 (3-byte slot: u16 chipId, u8 state,\none padding byte). Three distinct event-flag bases\
  \ decide the state:\n  FLAG_READY_BASE  0x1E20 -> state 0  (\"ready\")\n  FLAG_USED_BASE   0x2220 ->\
  \ state 1  (\"used\")\n  FLAG_UNUSED_BASE 0x2020 -> state 1, or state 2 when event-flag pair\n     \
  \                          (page 0x17, offset 0x11) is set\nAfter the scan a compaction pass walks each\
  \ empty 4-byte slot and pulls\nthe next non-zero 4-byte entry forward, clearing the source. Returns\
  \ the\ntotal accepted count via r0 (also tracked in r5). Touches structures:\nChipData (offsets 0x07\
  \ type, 0x09 flags, 0x15 pack type),\nA_dword_201EC20 pack-slots array (ends at A_unk_201F198), event\
  \ flags at\npages 0x1E/0x22/0x20/0x17. The \"add r6, #4\" post-write advance for the\nstate-2 path is\
  \ unreachable in practice because the freshly written u16\nslot index (idx >= 1) is never zero.\n"
