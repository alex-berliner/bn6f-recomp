  date: '2026-10-19'
  detail: bl object_getFrontDirection; result multiplied into each dx at loc_80CA12A (mul r0, r2) — horizontal
    offsets flip with facing; ldr r4, off_80CA158 / ldr r4, [r7,r4] and off_80CA15C table select shape
    by the pre-set r7, clamped with cmp r7,#3 / ble; Terminators 0x7F in byte_80CA180..0x191 end the (dx,dy)
    pair loop (cmp r0,#0x7f; beq loc_80CA152); Shape tables list 1, 2, 4, then 6 panel offsets including
    (1,1)/(1,-1), i.e. growing field areas; Constant 0x00200002 from byte_80CA170 is loaded once and passed
    as r4 on every sub_80CA0E2 call, with r2/r3/r6 forwarded unchanged
