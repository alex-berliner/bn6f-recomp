name: battle_spawnAreaPanels
address: '0x080CA104'
kind: function
status: probable
summary: Spawns one sub_80CA0E2 sprite per panel of a battle-field area shape (clamped r7=0–3), iterating
  a signed-byte offset list (0x7F-terminated) and flipping horizontal offsets via object_getFrontDirection().
interface: (r0 = base x, r1 = base y, r2 = arg, r3 = arg, r7 = shape index 0–3, clamped) -> r0 = result
  of last sub_80CA0E2 call; r4, r7 preserved
details: 'Clamps the caller-passed r7 to 3 and uses it to index two tables: byte_80CA170 entries (all
  0x00200002, passed unchanged as r4 to the callee, likely packed sprite/OAM size+attribute) and off_80CA160,
  which points to signed-byte offset-pair lists terminated by 0x7F. Each list is a panel shape: 1 panel
  (0,0); 2 panels (0,0),(1,0); 4 panels plus up/down; 6 panels (2x3 forward block). For each (dx,dy) pair
  it computes x = base_x + dx*object_getFrontDirection() (flipping the shape left/right by alliance side)
  and y = base_y + dy, then calls sub_80CA0E2(x, y, r2, r3, 0x00200002, r6) with the saved r6 from the
  caller. The 0x7F byte acts as an end-of-list sentinel; r6 is passed through untouched, another implicit
  caller-owned argument.'
evidence:
