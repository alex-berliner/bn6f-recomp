name: battle_objectWait30FramesToPhase8
address: '0x080C0710'
kind: function
status: probable
summary: 'Battle-object phase step: on first run waits 30 frames (timer = 0x1E), then advances the object''s
  phase to 8.'
interface: (r5 = battle object) -> r0 = clobbered; sets oBattleObject_Timer, oBattleObject_PhaseInitialized,
  oBattleObject_CurPhaseAndPhaseInitialized on the object; flags from the timer decrement
details: Standard battle-object phase handler operating through r5. If oBattleObject_PhaseInitialized
  is 0 it stores 0x1E (30) into oBattleObject_Timer and sets PhaseInitialized to 4, so the wait only counts
  once. Each call then decrements oBattleObject_Timer (bgt keeps waiting while it is still positive);
  when the timer reaches 0 it writes 8 to oBattleObject_CurPhaseAndPhaseInitialized, moving the object's
  state machine to phase 8. No other structures or fields are touched.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized] / bne skips one-time setup of Timer=0x1E and PhaseInitialized=4;
    ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; bgt loops until the 30-frame wait expires; mov r0,#8;
    strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized] transitions the object to phase 8
  refs:
  - bn6f/asm/asm31.s:18740
  reproduce: python3 tools/asmcat.py 0x080C0710
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112'
open_questions:
