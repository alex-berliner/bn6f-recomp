name: battle_getPanelDataPtr_800C6E0
address: '0x0800C6E0'
kind: function
status: confirmed
summary: Returns the address of a battle panel's data entry in ePanelData for a given column/row.
interface: (u32 column r0, u32 row r1) -> u8* panelDataPtr r0; r2 left holding 8; clobbers r1 and flags
details: 'Computes the pointer to the 0x20-byte data entry of the panel at (column, row) on the

  battle field grid: it multiplies the row by 8 (panels per row), adds the column, scales

  the linear index by 0x20 (bytes per panel entry), and adds the base address ePanelData.

  So the field is a 6x3 grid laid out in ePanelData as 8 columns per row of fixed-size

  panel records; callers pass column in r0 and row in r1. r2 is a leftover scratch value

  (still holding 8 from the row multiplier) that the register contract shows callers read

  back as an output, so some callers rely on it (likely as a cheap PANELS_PER_ROW constant).

  r1 is clobbered with the ePanelData base address on the way out.

  '
