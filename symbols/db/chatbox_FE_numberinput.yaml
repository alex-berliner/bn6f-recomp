name: chatbox_FE_numberinput
address: '0x08042CF8'
kind: function
status: confirmed
summary: Dispatches a FE number-input operation according to the chatbox state byte.
interface: void chatbox_FE_numberinput(struct chatbox *chatbox /* r4 */); unspecified additional register inputs
  and outputs follow the original ARM call context; all r4-r12 and flags are preserved across the jump-table dispatch
details: Reads the chatbox state at byte offset 1, multiplies it by four, indexes the 32-entry pointer table at
  0x08042D0C, and tail-calls the selected handler. Implemented states include 0, 1, 2, 3, 4, 5, 14, 15, 18, 19,
  and 20; the remaining table entries are NULL. The indirect jump is performed with `mov lr, pc` followed by `bx
  r0`, so the selected handler continues at the caller of chatbox_FE_numberinput rather than returning through an
  ordinary BL/ BX link.
