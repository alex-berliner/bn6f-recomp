summary: 'Proposed name: pSTWIWork. Pointer to the shared STWI wireless-library work structure. (pointer)'
details: This EWRAM cell holds a pointer whose target is repeatedly accessed as the STWI driver work area.
  Its fields include the hardware-timer index at +0x0A, callback function pointers at +0x18 and +0x1C,
  a callback-ID value at +0x20, and a game-data pointer at +0x24. STWI timer initialization, callback
  setters, serial initialization, RFU stop handling, and RFU game-data configuration all use it; the shown
  code does not establish where the pointer itself is allocated or initialized.
