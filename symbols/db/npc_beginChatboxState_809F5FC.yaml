name: npc_beginChatboxState_809F5FC
address: '0x0809F5FC'
kind: function
status: confirmed
summary: Puts an overworld NPC into the "in chatbox" state, backing up its action and movement flags before the
  conversation starts.
interface: void npc_beginChatboxState(OverworldNPCObject *npc /* r5 */)
details: 'Called with the overworld NPC object in r5. Copies the NPC''s current action (oOverworldNPCObject_CurAction)
  to backup byte Unk_1d and its movement flag (oOverworldNPCObject_MovementFlag_0a) to backup byte Unk_1e, then
  sets CurState to NPC_CUR_STATE_IN_CHATBOX (8), clears CurAction to 0, and zero stores the halfword at MovementFlag_0a_Unk_0b.
  This freezes the NPC''s normal behavior while the player talks to it; the saved values are presumably restored
  by a matching "end chat" routine when the dialogue ends. No return value; lr is only pushed because it is a plain
  subroutine call.

  '
