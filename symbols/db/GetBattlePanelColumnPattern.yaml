name: GetBattlePanelColumnPattern
address: '0x0802D26A'
kind: function
status: confirmed
summary: Thin wrapper that returns the current battle panel column pattern from the active battle's settings.
interface: Next GetBattlePanelColumnPattern(Toolkit* toolkit @ r10) -> Next pattern @ r0 (return address passed
  through in lr as a tail call)
details: Reads the toolkit's battle-state pointer (r10 + oToolkit_BattleStatePtr), loads the BattleSettings pointer
  from the battle state (oBattleState_BattleSettings), and tail-calls GetBattlePanelColumnPatternFromBattleSettings
  with that pointer in r0. It is effectively a convenience accessor so callers only need the global toolkit to query
  the panel column layout currently in effect for the battle (the pattern governing which columns of panels are,
  e.g., broken/removed at battle start). No battle state or settings fields are modified; lr is the return and is
  consumed by the tail call.
