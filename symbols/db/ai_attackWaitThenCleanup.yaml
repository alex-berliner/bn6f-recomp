name: ai_attackWaitThenCleanup
address: '0x080EED30'
kind: function
status: probable
summary: AI attack step handler that waits 5 frames while an attack object runs, then clears its references
  and exits the attack state
interface: (r7 = oAIAttackVars of acting object, r5 = oBattleObject) -> r0 = 0 from object_exitAttackState;
  flags from decrement/compare
details: 'Runs once per frame as an attack-state step. On the first invocation, when oAIAttackVars_AttackElement
  is 0, it initializes the state: StepTimer = 5 and AttackElement = 4 (marking the step as started so
  the init branch doesn''t rerun). Each call it decrements StepTimer; while the result is >= 0 it returns
  and waits. Once the timer expires it nulls oBattleObject_RelatedObject1Ptr (r5) and oAIData_TempAttackObjectPtr
  (via the object''s AIDataPtr), dropping the reference to the spawned attack object, and calls object_exitAttackState
  to end the attack.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne skips an init block that sets StepTimer=5,
    AttackElement=4 (first-run guard); ldrh/sub/strh on oAIAttackVars_StepTimer with bge locret: waits
    until the 5-frame timer runs out; str r0 (0),[r5,#oBattleObject_RelatedObject1Ptr] and str r0,[r1,#oAIData_TempAttackObjectPtr]
    clear both pointers to the attack object; bl object_exitAttackState as the only callee, reached only
    after the timer expires'
  refs:
