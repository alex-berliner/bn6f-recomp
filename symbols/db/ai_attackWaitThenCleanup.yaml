name: ai_attackWaitThenCleanup
address: '0x080EED30'
kind: function
status: confirmed
summary: AI attack-state tail — counts down a short timer after an attack, then clears the temp attack object references
  and returns the battle object to its idle state.
interface: 'void ai_attackWaitThenCleanup(BattleObject* object /*r5*/, u32 auxParam /*r6*/, AIAttackVars* attackVars
  /*r7*/); out: r1 = AI data pointer on cleanup path; clobbers r0-r3, r6, r7, lr, flags'
details: 'Per-object AI attack cleanup state, driven each frame while the object is finishing an attack.

  On first entry (attackVars->AttackElement == 0) it seeds StepTimer to 5 frames and writes

  AttackElement = 4, marking the element as "already initialized" so the seed only happens once.

  Each call then decrements StepTimer; while it stays >= 0 the function just returns, giving the

  attack roughly 5 extra frames of wind-up/recovery before cleanup.

  When the timer underflows (goes negative), it nulls object->RelatedObject1Ptr (r5 + 0x...),

  fetches object->AIDataPtr, nulls aiData->TempAttackObjectPtr so the AI no longer holds the

  spawned attack entity, and calls object_exitAttackState (r5/r6/r7 passed through) to hand the

  object back to its normal state. The early-return path leaves the object references intact.

  r1 output is only meaningful on the cleanup path (the AI data pointer left by the callee chain);

  callers apparently only care about that one value.

  '
