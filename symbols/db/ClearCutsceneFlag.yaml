name: ClearCutsceneFlag
address: '0x080385D0'
kind: function
status: confirmed
summary: Clears a single bit in the cutscene-state object's cutscene flags word, marking that cutscene/event flag
  as no longer set.
interface: void ClearCutsceneFlag(u8 flagIndex in r0, CutsceneState* state in r5); preserves r1 and the carry flag;
  clobbers r0 and the nz flags; carry out of the caller-visible value comes from the flag-setting shift (carry =
  bit shifted out of 1 << n, untouched if n == 0).
details: 'Takes a bit index in r0 (masked to 0..0xFF), builds a mask (1 << index) in r1, loads the cutscene flags
  word from [r5 + oCutsceneState_CutsceneFlags], clears the selected bit with BIC, and stores it back. r5 points
  at the cutscene state object, so this clears one flag in that object''s 32-bit flag word. The push/pop of r1 is
  purely to preserve the caller''s r1 through the temporary use of r1 as the mask register, which the register contract
  confirms. The LSL that builds the mask is flag-setting, so the carry seen by the caller reflects the last bit
  shifted out of (1 << n): carry set for n == 32, clear for 1..31, untouched for n == 0, and the mask itself is
  0 for n >= 32 (no-op on the flags word).

  '
