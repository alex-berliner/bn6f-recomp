name: battle_leapForwardPhaseHandler
address: '0x080BA4BA'
kind: function
status: probable
summary: Action-phase handler that makes a battle object leap 3 panels forward through the air, then on
  landing branches to a follow-up action depending on the landing panel's status flags.
interface: (r5 = battle object, no args) -> void; sets oBattleObject fields PanelX, Z16, CurAnim, Timer,
  CurAction, CurPhase
details: 'Phase 0 starts the leap: sets phase 4, adds object_getFrontDirection()*3 to PanelX (moves 3
  panels toward the player/enemy side), recomputes pixel coordinates, raises Z16 to 0x1E (airborne), plays
  anim 0xE, and sets a 5-frame timer. Phase 4 descends 6 units per frame until the timer runs out, then
  reads the landing panel''s status via object_getPanelParameters and tests it against a per-alliance
  bit mask (alliance 0 -> 0x4000000, alliance 1 -> 0x8000000 from off_80BA520). If the landing panel has
  the bit, CurAction is set to 0x10, otherwise to 0x1C, and CurPhase is reset to 0; the caller''s action
  dispatcher presumably handles those next actions. The two-mask table keyed by Alliance suggests the
  flagged panel type matters only on the opposing side''s field, or the two bits mean different things
  per side.'
