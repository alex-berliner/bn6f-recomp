  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code at 0x08128FF0 matches: it reads flag halfword [r5,#0x1e] and, when nonzero, calls sub_8129018
    with the described args including r2=0x20 (32), r3=0xc (12). However, the function is also called
    from sub_8128ED4 (a pet-navicust flow referencing unk_2037780 and CopyWords) and from sub_8128E2C
