name: chatbox_drawWindow
address: '0x08128FF0'
kind: function
status: probable
summary: Per-frame redraw of the 32x12-tile chatbox window by calling sub_8129018 with a tilemap/data
  pointer while the active flag at [r5,#0x1e] is set; shared across multiple state-machine callers.
interface: (r5 = message-state struct; no args) -> void; reads flag halfword [r5,#0x1e]
details: 'If [r5,#0x1e] is nonzero, calls sub_8129018 with (r0=2, r1=0x12, r2=0x20, r3=0xC, r4=&byte_8128CA8,
  r6=0x40000000, r7=0x10002): r2/r3 look like box width/height in tiles (32x12), r4 points to static window
  graphics/tilemap data, and 0x10002/0x40000000 look like tile/vram parameters. No arguments are taken;
  all context lives in the r5 struct shared with callers, which store state bytes at [r5], [r5,#1..3]
  and run this each frame before sub_812907C.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8128FF0: tst of halfword [r5,#0x1e] gates a single draw call — an enable flag for the window;
    sub_8128FF0: fixed args 0x20 x 0xC with data pointer byte_8128CA8 — a 32x12-tile window drawn from
    static gfx; callers at 0x08128E1E/0x08128EB8/0x08128ED6 call it unconditionally each frame followed
    by sub_812907C — a per-frame render/update pair; sub_8128E2C references eTextScript201BA00 and eDecompBuffer2013A00
    and handles B-button/SetScreenFade — dialogue-text context; sub_8128DF4 stores state bytes ([r5,#2],[r5,#3])
    around fade checks — a cutscene/dialog state machine owning r5'
