name: getIndexed80hRecordPtr_8028164
address: '0x08028164'
kind: function
status: confirmed
summary: Maps an index through a lookup table and returns the pointer to that entry's 0x80-byte record in the dat38_86F5834
  data table.
interface: u8* getIndexed80hRecordPtr(u8 index)
details: 'Takes a small index in r0 and reads a byte from byte_802819C (a one-byte-per-entry

  indirection table, at 0x0802819C), so callers pass a logical ID and the table

  remaps it to the actual slot. The mapped value is multiplied by 0x80 and added to

  the base pointer byte_86F5834 (a data blob in the 0x86F5xxx ROM data area), and

  that address is returned in r0. No other registers are touched; r1 and the flags

  are clobbered. Effectively: recordPtr = dat38_86F5834 + lut[index] * 0x80.

  The 0x80-byte stride suggests fixed-size records such as a sprite/animation

  block, an AI/script page, or similar per-entity data; the exact meaning of the

  records isn''t determinable from this function alone.

  '
