name: ai_attackStepForward
address: '0x08108298'
kind: function
status: probable
summary: 'AI attack state tick: every 3rd frame the object takes one step — commits its reserved future
  panel, moves/re-collides, and marks a hit element for the attack.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = 8 (clobbered); updates object panel/coords/anim
  state
details: 'Decrement oAIAttackVars_StepTimer; while positive just return. When it hits zero: set CurAnim
  to 3, copy FuturePanelX/Y into PanelX/Y (the panel the object reserved/moved toward), release that panel
  reservation, recompute pixel coordinates from panels, and update collision panels + facing. Then restart
  StepTimer at 3 and set oAIAttackVars_HitElement to 8, which is presumably the element/type flag the
  attack registers on contact. This reads as the periodic ''advance one panel'' step of an AI attack (e.g.
  a hop or lunge) driven by the object''s AI attack vars.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r7,#oAIAttackVars_StepTimer]; sub/strh; bgt exit — frame-gated tick; copies FuturePanelX/Y
    to PanelX/Y before object_removePanelReserve — commits the reserved target panel; calls object_setCoordinatesFromPanels
    then object_updateCollisionPanels after the commit; mov r0,#3; strh [r7,#oAIAttackVars_StepTimer]
    — fixed 3-frame step cadence; strh #8 into oAIAttackVars_HitElement — attack''s hit element set each
    step'
