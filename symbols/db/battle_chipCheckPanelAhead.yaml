name: battle_chipCheckPanelAhead
address: '0x080E30E0'
kind: function
status: probable
summary: 'Chip phase handler: on first pass, checks the front panel for flag 0x10 (and absence of 0x0F880080);
  if valid, calls sub_80CD2B4 with object context, then sets Timer=0x1E and PhaseInitialized=4. After
  30 frames, sets CurAction=0xC and resets the phase field to 0.'
interface: (r5 = battle object) -> void; sets oBattleObject_Timer=0x1E and PhaseInitialized=4 on first
  run, then CurAction=0xC and phase 0 when the timer lapses
details: A per-phase routine for a battle object (r5 = object struct). On the first pass (PhaseInitialized
  == 0) it gets the object's facing multiplier via object_getFrontDirection, computes the neighboring
  panel x = PanelX + direction, and calls object_checkPanelParameters with y = PanelY, set-mask 0x10 and
  clear-mask 0x0F880080, i.e. the panel must have flag 0x10 and none of the masked flags. If the check
  passes, it calls sub_80CD2B4 passing the object (r5), AllianceAndDirectionFlip (r2), 0 (r3), Params
  (r4) and DamageAndStaminaDamageCounterDisabler (r6) — likely applying an effect or damage on that panel,
  but that callee is unnamed. Either way it loads the timer with 30 frames and marks the phase initialized
  (4); on subsequent frames it counts the timer down, and on expiry sets CurAction = 0xC and resets the
  phase field to 0, handing control back to the object's state machine.
