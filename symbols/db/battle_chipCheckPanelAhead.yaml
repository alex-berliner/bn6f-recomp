    on to gate the sub_80CD2B4 call (0x80E30F0-0x80E310A); sub_80CD2B4 receives the object's alliance,
    params and damage fields, so the panel check gates an in-battle effect (0x80E30FA); timer = 0x1E then
    decrement loop with transition to CurAction = 0xC / phase 0 is a standard phase-wait pattern (0x80E310E-0x80E3122)
