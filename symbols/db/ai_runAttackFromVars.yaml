name: ai_runAttackFromVars
address: '0x080FF7B0'
kind: function
status: confirmed
summary: Unpacks AI attack parameters (init flag, difficulty tier, damage) from the AIAttackVars struct at r7 and
  forwards them to battle_spawnObject5FAtPanel to launch the actual attack object.
interface: 'ai_runAttackFromVars(r0 /*arg0*/, r1 /*arg1*/, r3 /*arg3*/, r5 /*arg5*/, r7 /*&AIAttackVars*/) -> r1,
  r5; preserves r4, r5, r6, r7; clobbers r0, r2, r3, lr, flags

  '
details: "Thin adapter in the AI attack pipeline. Reads three fields from the struct at r7:\n  oAIAttackVars_InitFlag\
  \ (u8) → r2\n  oAIAttackVars_AiDifficultyTier (u8) → r4\n  oAIAttackVars_Damage (u32) → r6\nThen tail-calls battle_spawnObject5FAtPanel_80D04DA(r0,\
  \ r1, r2, r3, r4, r5, r6) which\ninstantiates a battle object of type 5F at a panel and returns updated turn-state\
  \ in r1/r5.\nr4 and r6 are saved/restored around the call (push/pop) to honour the caller's preserved-register\
  \ contract.\nNearby data (byte_80FF7C4, byte_80FF7CC, off_80FF8B0) is a jump-table / parameter blob for the\n\
  broader ai_attackDispatch / ai_dispatchElementAttackStep state machine, not directly touched here.\n"
