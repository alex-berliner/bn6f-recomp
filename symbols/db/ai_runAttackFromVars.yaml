name: ai_runAttackFromVars
address: '0x080FF7B0'
kind: function
status: probable
summary: Loads the AI attack vars (init flag, difficulty tier, damage) and tail-calls the AI attack executor sub_80D04DA.
interface: (r0 = context/object ptr, r7 = ptr to oAIAttackVars struct) -> r0 = result of sub_80D04DA; no flags used
  by caller
details: Reads oAIAttackVars_InitFlag into r2, oAIAttackVars_AiDifficultyTier into r4, and oAIAttackVars_Damage
  into r6 from the struct at r7, then tail-calls sub_80D04DA, preserving r4/r6 across the call. The registers r2/r4/r6
  are passed pre-loaded, so sub_80D04DA presumably consumes them as init flag, difficulty tier, and damage for an
  AI-controlled attack. The trailing data (byte tables and off_80FF8B0, a handler table of battleObject action routines
  like flinch/paralyze/jump) belongs to the surrounding AI attack module, not to this function. It is a straight-line
  wrapper with no branching of its own.
