name: object_spawnLinkedCopy
address: '0x080DB800'
kind: function
status: probable
summary: 'Spawns object kind 0xB0 via object_spawnType3, then initializes it as a linked copy of the source
  object (r5): same panel X/Y, element, RelatedObject1Ptr back to source, copies AllianceAndDirectionFlip,
  copies an extra field from r6, and sets flag 0x10 in oObjectHeader_Flags. On spawn failure, all field
  writes are skipped.'
interface: (r0 = panelX, r1 = panelY, r2 = element, r3-r4 = extra spawn args, r5 = source battle object)
  -> r0 = new battle object, or unchanged/zero if spawn failed; Z flag from spawn success
details: Uses a push {r0-r2,r5} / pop {r1-r3,r5} trick to shift the caller's first three arguments into
  r1-r3 so r0 can carry the object kind 0xB0 for object_spawnType3, which receives (0xB0, r1, r2, r3,
  r4). If the spawn succeeds, the new object gets PanelX = caller r0, PanelY = caller r1, Element = caller
  r2, RelatedObject1Ptr = the caller's source object (r5), and copies AllianceAndDirectionFlip from that
  source object. It then ORs 0x10 into the new object's oObjectHeader_Flags, apparently marking it as
  a linked/attached helper. The mov r0,r5 before the pop implies object_spawnType3 returns the spawned
  object pointer in r5 (and the pop restores the caller's original r5), leaving the new object pointer
  as this function's return value in r0. On spawn failure the beq skips all field writes entirely.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: push {r0-r2,r5} / pop {r1-r3,r5} shifts caller args so r1-r3 land in PanelX/PanelY/Element stores;
    bl object_spawnType3 with r0=0xB0 spawns the object and its beq-gated failure path skips all field
    writes; str r5,[r0,#oBattleObject_RelatedObject1Ptr] and the ldrh/strh of oBattleObject_AllianceAndDirectionFlip
    tie the new object to the source object in r5; oObjectHeader_Flags |= 0x10 marks the spawned object
    after initialization; mov r0,r5 before pop {r1-r3,r5} only coheres if object_spawnType3 returns the
    new object in r5
