  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: push/pop shifts args so r0=0xB0 goes to object_spawnType3, which
    returns the spawned pointer in r0 and the beq skips init. However, the source object is r5 (saved/restored
    via push/pop), and the RelatedObject1Ptr is set to r5 — not r5 in the sense described. Also DamageAndStaminaDamageCounterDisabler
    is set to r6, not alliance). The proposed summary is largely correct, but the name ''battle_spawnLinkedObject''
    is reasonable; ''object_spawnLinkedCopy'' may fit the ''object'' prefix better since this operates
    on object kind 0xB0 specifically.; run wf investigate investigate-20261019-022109; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
