- method: assembly-reading
  date: '2026-10-15'
  detail: Delta against Unk_14 (last-checkpoint value) compared to 0x40 (64 raw steps) gates whether the encounter
    roll is even allowed — the documented "0x400 lets the next roll start a battle" cycle.
  refs:
