  result: '"ldrh r1, [r6,#oS2001c04_EncounterStepAccumulator] / sub r1,r1,r2 / cmp r1,#0x40"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Counter >>6 used directly as the encounter-odds table index (clamped at 0x10 = 16 slots) — classic BN
    walk-step-to-odds sampler.
  refs:
  - bn6f/asm/map_script_cutscene.s:2618
  reproduce: grep -n 'oS2001c04_EncounterStepAccumulator' bn6f/asm/map_script_cutscene.s | head
  result: '"ldrh r3, [r6,#oS2001c04_EncounterStepAccumulator] / lsr r3,r3,#6 / cmp r3,#0x11"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Reset to 0 right after the encounter battle is initiated, beginning a new accumulation period until the
    0x400 threshold again.
