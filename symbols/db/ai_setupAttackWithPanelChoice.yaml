name: ai_setupAttackWithPanelChoice
address: '0x080F9F24'
kind: function
status: probable
summary: Installs a panel-choose callback on the AI object's oAIAttackVars, computes attack duration via
  sub_80F9E34, resolves the opposing player via battle_findPlayer with flipped alliance, stores it as
  the target, and enters object_setAttack4(9).
interface: (r0 = attacker object? in r5/r7 context) -> r0 = clobbered; stores callback, duration, and
  target into oAIAttackVars
details: Installs sub_80FAA04 as oAIAttackVars_PanelChooseCallback for the AI-controlled object at r7,
  then calls sub_80F9E34 whose return is stored as oAIAttackVars_AttackDuration (a halfword), so the duration
  likely depends on difficulty or a per-attack table. It reads oBattleObject_Alliance from the object
  at r5, XORs it with 1 to select the opposing side, and calls battle_findPlayer to store the enemy player
  pointer in oAIAttackVars_TargetObjectPtr. Finally it calls object_setAttack4(9), switching the object
  into attack state 4 with argument 9, presumably the 'aim at target panel' attack mode that the PanelChooseCallback
  will service. The attack seems to be one where the AI picks a panel and fires after the computed delay.
