name: t3_setupFullScreenBattleBackground
address: '0x0804CB0C'
kind: function
status: probable
summary: Queues the full-screen battle background graphics, configures rendering, and initializes the
  next chatbox/window state.
interface: (r0 = context/state pointer, r1 = unused, r2 = unused, r3 = unused, r4 = context/state pointer,
  r5 = state pointer, r6 = unused, r7 = argument for chatbox initialization, r10 = render context) ->
  void; flags unspecified
details: Queues a 0x20-byte 8-word-aligned graphics block from byte_86A34C0 to VRAM address 0x0600CFE0,
  then queues a selected 0x20-byte palette/graphics block from byte_86A3480 to VRAM address 0x03001B00.
  The selection uses the byte at state+0xD multiplied by 0x20. It writes render settings through the tool
  RenderInfo pointer, including value 0x1F09 at offset 0x0A and zero at offsets 0x18 and 0x1A, then tail-calls
  chatbox initialization. On return it stores state 4 at state+0x10 and calls t3_showFullScreenBackground,
  indicating a staged full-screen transition.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The two QueueEightWordAlignedGFXTransfer calls move 0x20-byte blocks into VRAM destinations
    0x0600CFE0 and 0x03001B00.; state+0xD selects a 0x20-byte source entry in byte_86A3480, showing indexed
    setup data.; RenderInfo is accessed through oToolkit_RenderInfoPtr and its fields are updated before
    the tail call.; The function tail-calls chatbox_initWindowReqAndEnqueue, then on return stores state
    4 and calls t3_showFullScreenBackground.
