name: sub_8007628
address: '0x08007628'
kind: function
status: confirmed
summary: Initializes display/rendering hardware registers and palette/BG-character data from two static (offset,
  value) tables.
interface: void battle_initDisplayTables_8007628(void); /* r10 = toolkit base; returns r0=palette ptr, r1=table
  cursor, r2=0xFF, r3=last written value, NZCV set from r2 vs 0xFF */
details: 'Reads two destination pointers from the toolkit structure (oToolkit_RenderInfoPtr and oToolkit_Unk200f3a0_Ptr).
  Iterates over two hardcoded halfword-pair tables (each entry: u16 byte-offset, u16 value) terminated by offset
  0xFF, writing each value as a halfword at dst+offset. The first table configures BG/render-control registers (offsets
  0x0–0xA and 0x60, values like 0x1C08, 0x7F60). The second table seeds a palette/BG-character region (offsets 0x0–0xA,
  values 0xF000, 0xA000, 0x3F3F typical of 15-bit RGB colors and tile indices). On return r0–r3 hold the last-iteration
  state of the second loop (r2=0xFF terminator, r3=last value written) and flags reflect the final CMP r2, #0xFF
  (Z set). r10 is read-only; no other registers are preserved beyond what the contract lists.'
