name: sub_80C82D0
address: '0x080C82D0'
kind: function
status: confirmed
summary: For a battle object, repeatedly spawns an ahead-pointing panel effect (via sub_80CC9FC) at the object's
  own panel shifted 1, 2, ... Param3 panels in its facing direction.
interface: void sub_80C82D0(void *battleObject /* r5 */, ... lr ); /* preserves r4, r5, r6, r7 */
details: "Walks the panel grid one step at a time in object_getFrontDirection() from the\nobject's own (PanelX,PanelY)\
  \ and calls sub_80CC9FC for each step up to\noBattleObject_Param3 (inclusive). Each call passes:\n  - x = PanelX\
  \ + frontDir * step\n  - y = PanelY\n  - r2 = oBattleObject_Element\n  - r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler\n\
  \  - r5 = oBattleObject_RelatedObject1Ptr\n  - packed flags r7 = 3 | (Param2 << 16) | (0xB << 24)\n  - r4 = 0x4050101\n\
  Likely used to lay down a straight line of \"ahead\" attack panels or movement\nmarkers in front of the object\
  \ (e.g., sword/line-area chips); the fixed\neffect kind 3 and id 0xB encode the animation/visualization. Uses\
  \ a do/while\nloop with step starting at 1 and incrementing before the bound check, so\nParam3 = 0 yields a single\
  \ panel.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
