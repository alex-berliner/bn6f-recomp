name: ai_battlesweepCycleScriptSelect
address: '0x08115EF4'
kind: function
status: probable
summary: 'Battlesweep AI tick: every table-specified frames it hands control to AI script 4 for one tick,
  otherwise runs script 8, and while object flag 0xA000 is set it never switches and resets the timer.'
interface: (r4 = battle object, r5 = byte counter field at +0x6B, r6 = AI state block) -> r0 preserved-ish;
  writes [r5+0x6B] counter and [r6+oAIState_ScriptId] = 4 or 8
details: Calls object_getFlag on the object and tests the result against mask 0xA000 (two object flags);
  if either is set it zeroes the byte counter at [r5+0x6B] and dispatches script 8. Otherwise it increments
  that counter and compares it against byte_8115E34[oAIData_Version_16] (per-variant threshold table);
  when the count exceeds the table value it wraps the counter to 0 and dispatches script 4 for that tick,
  else dispatches script 8. So script 4 fires once every threshold+1 frames while stationary/idle, and
  the 0xA000 flags (likely movement/action flags) suppress it and restart the timer. Ends with battleObject_refreshSpriteAndArm_800F2C6
  to update the sprite facing/arm as usual for AI ticks. Uses r4/r5/r6 from the caller's register state,
  so it is a leaf AI handler invoked with object pointers already loaded.
