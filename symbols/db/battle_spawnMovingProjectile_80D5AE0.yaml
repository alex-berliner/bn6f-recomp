open_questions:
- What `sub_80D5C26` computes and stores into `Timer` (an init-derived timer? a random number? a delay
  before next phase?), and what each Param1 entry of `byte_80D5B74` is semantically — table looks like
  packed speed * direction (5 / 0x80000500 could be "speed 5, left-facing signed high bit"). Settling
  it requires checking callers and matching Param1 values used to spawn this object type.
