name: sub_80C90DC
address: '0x080C90DC'
kind: function
status: confirmed
summary: State handler that mirrors a battle object's position toward its related object by an indexed (dx,dy) offset,
  ticking a timer and transitioning to state 0xC when it expires or the gate closes.
interface: void sub_80C90DC(struct BattleObject *self /* r5 */);
details: "Operates entirely on the caller-supplied `self` (r5) and the related object\npointed at by `oBattleObject_RelatedObject1Ptr`.\n\
  \n1. Copies bit 1 of the related object's `oObjectHeader_Flags` into the same\n   field on `self`, masking out\
  \ any prior value. This is the \"tag-along\" /\n   \"linked to partner\" flag.\n2. Asks `sub_802CE30` whether\
  \ motion sync is currently allowed; if not,\n   jumps straight to expiry.\n3. Reads the related object's `oBattleObject_NameID`,\
  \ runs it through\n   `sub_800F26C`, and fetches a signed (dx, dy) byte pair from the motion\n   table at index\
  \ 0x1B via `getIndexedSignedBytePair_8018842`.\n4. Sign-extends both bytes into Q16, then negates `dx` using\n\
  \   `object_getFrontDirection` so the offset points the same direction the\n   front-facer is facing (toward or\
  \ away from self, mirroring the related\n   object's velocity).\n5. Loads 12 bytes at self + 0x34 (x / mid / z)\
  \ from the related object, adds\n   `sx` to x and `sy` to z (mid untouched), and stores them back into\n   self\
  \ + 0x34. These three fields are the standard BattleObject sprite\n   position / depth triplet used elsewhere\
  \ in BN6.\n6. Decrements `oBattleObject_Timer`; if it has not reached zero, returns\n   with the existing NZ state.\n\
  7. Expiry path: calls `sub_802CDE6` to undo whatever `sub_802CE30` set up,\n   clears bit 1 of `oObjectHeader_Flags`,\
  \ and writes 0xC into\n   `oBattleObject_CurStateActionPhaseAndPhaseInitialized` to advance to\n   the next state\
  \ phase.\n\nThe .word 0x4050001 is the standard \"single-precision 1.25\" float and\nappears to be data for a\
  \ sibling label rather than executed here.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
