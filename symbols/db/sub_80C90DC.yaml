  / face" phase that ends this motion-sync behaviour.
- Why is `dx` scaled by `-dir` while `dy` (z) is not? Possibly because the motion table's x needs to flip with facing
  while z always pushes away.
- Is `oBattleObject_Timer` decremented every frame or only on a specific tick boundary? The code suggests every
  call.
