name: start_clearIrqEnableBits
address: '0x03005E02'
kind: function
status: probable
summary: C hardware helper that clears selected interrupt sources in the IE register without ever leaving
  interrupts globally disabled
interface: (r0 = bitmask of IE bits to clear) -> r0 = 0 (side effect on IE); flags from mov/bic, no meaningful
  return
details: Reads the Interrupt Master Enable register, stores 0 to it (globally disabling IRQs), then reads
  IE, clears (BIC) the bits selected by the r0 mask, writes IE back, and restores the saved IME value
  before returning. r4 is only used to hold the IME value across the IE update; r0 is used as a scratch
  mask register, so the caller's argument is consumed by the BIC and r0 ends up as 0 on return. This is
  a classic crt0/startup utility for shutting off specific IRQ sources (e.g. timers, VBlank) during boot
  or reset.
