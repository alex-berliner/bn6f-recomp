name: sub_81170C0
address: '0x081170C0'
kind: function
status: confirmed
summary: Builds a randomized sprite visibility mask via two BIOS PRNG draws and applies it to a sprite object through
  sprite_setUnk0x2c.
interface: void sprite_setRandomMask_81170C0(u32 seed /*r0*/, SpriteObj *sprite /*r5*/)
details: 'Calls GBA BIOS Random (svc 6) twice, chaining the state: first draw with (r0=seed, limit=100), second
  draw with (r0=first_state, limit=10). From the default 23-bit mask 0x7FFFFE00 it conditionally clears three bits
  selected by the random values: bit 31 shifted by first_draw, bit 28 shifted by second_draw (only when at least
  one draw is non-zero), and bit 18 shifted by second_state. The resulting mask is passed in r0 together with the
  sprite pointer still in r5 to sprite_setUnk0x2c, which writes the mask into offset 0x2C of the sprite structure.
  r5 is unchanged and readable by the caller. r4, r5, r6, r7 are saved/restored across the call.'
