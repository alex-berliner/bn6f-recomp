name: object_delete
address: '0x080E7BF0'
kind: function
status: probable
summary: Marks an object for deletion by writing the 'deleted/free' state (8) into its state field, skipping
  null pointers.
interface: (r0 = object pointer, may be null) -> r0 unchanged; no flags of interest
details: Takes an object pointer, returns immediately if null, otherwise stores the constant 8 into the
  object's field at offset +8. Given the sole caller is object_deleteIfNotNull ('deletes/frees the given
  object if non-null'), this is the actual delete routine, and offset +8 is the object's state/mode field
  with value 8 being the deleted (or free-pending) state that the object engine acts on. The null check
  here makes the wrapper's 'if not null' behavior; a bare call still needs a valid object to have any
  effect.
