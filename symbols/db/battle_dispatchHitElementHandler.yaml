name: battle_dispatchHitElementHandler
address: '0x080F3E2A'
kind: function
status: probable
summary: Dispatcher that reads the attack's hit element from the battle AI attack vars and calls one of
  three element-specific routines through a jump table.
interface: (r7 = battle context) -> calls handler off a 3-entry table indexed by [r7+oAIAttackVars_HitElement];
  no direct return value manipulation visible
details: Reads the byte at oAIAttackVars_HitElement from the battle context in r7, uses it as an index
  into a word table at off_80F3E3C (elements 0-2), and calls the selected thumb handler by loading its
  address into r1 and doing 'mov lr, pc; bx r1' (ARM-Thumb interwork call, preserving r7 across the call).
  The table points to sub_80F3E48, sub_80F3E7A, and sub_80F3EA2. The trick of setting lr = pc means the
  callee returns into the pop, so this is a plain call wrapper, not a tail call. Only three elements are
  handled; other values would index past the table.
