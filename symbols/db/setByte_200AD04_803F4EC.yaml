name: setByte_200AD04_803F4EC
address: '0x0803F4EC'
kind: function
status: confirmed
summary: Writes the byte passed in r0 to the global IWRAM variable word_200AD04 and returns that variable's address
  in r1.
interface: void setByte_200AD04(u8 value); /* r0 = value; returns r1 = &word_200AD04; lr clobbered (uses lr as return)
  */
details: 'One-line setter: it loads the fixed IWRAM address word_200AD04 (0x200AD04) and stores only the low byte
  of r0 there (strb, so upper bits of r0 are ignored). As a side effect of how it''s compiled, r1 is left holding
  the address of word_200AD04 — callers may deliberately chain off this (get-then-set pattern), which is why the
  lifter records r1 as an output. lr is pushed/popped solely so it can return via pop {pc}. The function touches
  nothing else and preserves nothing; the meaning of the byte at word_200AD04 is not determined by this function
  alone — it''s whatever global the callers use it for (a one-byte game-state/config/flag slot).

  '
