name: getSlashBeastWaveAttackLockonTypeMaybe_80EAF26
address: '0x080EAF26'
kind: function
status: confirmed
summary: If the battle object is performing the slash-beast wave attack (action 0x41), returns the wave's lock-on
  type for the current AI difficulty tier; otherwise returns 0.
interface: (r5 battleObject, r7 aiAttackVars) -> r0 lockonType (u8, 0 when not in action 0x41); flags clobbered
  (nzcv), r1 clobbered, lr used as return address (tail-jump style, no push)
details: 'Small helper, presumably called from an AI/attack setup routine with r5 = battle object

  and r7 = the AI attack variables block. It checks

  battleObject->oBattleObject_CurAction against 0x41 (the "slash beast wave attack"

  action, consistent with the Falzar beast-out wave attacks). If the action doesn''t

  match, it returns 0 immediately. Otherwise it loads the byte table at byte_80EB028

  (pointer stored at off_80EB024) and indexes it with

  aiAttackVars->oAIAttackVars_AiDifficultyTier, returning the per-difficulty lock-on

  type byte. The table has one entry per AI difficulty tier, so the wave''s targeting

  behavior (e.g. tracking vs. straight) scales with difficulty. Uses `mov pc, lr`

  (ARMv4T-style return), so it never touches the stack.

  '
