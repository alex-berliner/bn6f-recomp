open_questions:
- No caller is known, so the object type and gameplay context (e.g. clone/illusion spawn) are unconfirmed
- The meaning of sprite_load's arguments (0x80, 8, 0x14) and of the three words copied from RelatedObject1+0x34
  is not fully pinned down
- The code copies RelatedObject1+0x34's three words into this object+0x34, then calls sprite_load with
  (0x80, 8, 0x14), loads animation, sets noShadow, copies Param1 to CurAnim/CurAnimCopy, sets animation,
  reloads, sets palette 0x10, applies flip from object_getFlip, syncs flag bit 2 with related object,
  and writes CUR_STATE_UPDATE. The proposal's mechanics match, but the name implies 'inherit' as in inheriting
  class — this is really copying/overwriting its own sprite fields from the related object. A name like
  'object_copySpriteFromRelated' better reflects that the function overwrites this object's sprite fields
  rather than an OO-style inheritance.
