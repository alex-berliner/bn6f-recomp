details: The function gets the shared work/state struct via sub_812D6F8, then calls sub_812D600 with r0=2,
  r1=0x20, r2=0x2a, r3=0x13 plus r4 pointing at byte_8129178 and r6/r7 holding 0x40000000/0x20002 — a
  (index, x, y, param) + data-pointer shape typical of sprite/tilemap/text enqueuing — and finishes with
  a no-arg call to sub_812D9F0 (likely a flush/commit). All six callers invoke it unconditionally at the
  end of their state-handler bodies, right after other sub_812D3xx/D5xx draw or update steps, so it appears
  to be one fixed element of this screen's rendering. r5 (the work struct) is not passed explicitly, so
  sub_812D600/sub_812D9F0 likely read it via the shared pointer themselves.
