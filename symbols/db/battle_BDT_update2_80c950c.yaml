name: battle_BDT_update2_80c950c
address: '0x080C950C'
kind: function
status: confirmed
summary: 'Per-frame BDT object update: integrates XY velocity into position, refreshes panel/collision state, ticks
  a timer, then decrements Param2 each time the timer elapses; when Param2 hits zero it advances the animation,
  clears the collision region and queues destruction.'
interface: void battle_BDT_update2_80c950c(struct BattleObject* r5)
details: "Operates on a BattleObject pointed to by r5. Reads/writes oBattleObject_X, oBattleObject_XVelocity,\n\
  oBattleObject_Y, oBattleObject_YVelocity, oBattleObject_Timer (u16), oBattleObject_Param2 (u8),\noBattleObject_CurAnim\
  \ (u8), oBattleObject_CurStateActionPhaseAndPhaseInitialized. Each frame:\n  1. Adds XVelocity into X and YVelocity\
  \ into Y (s32 accumulation).\n  2. Calls object_setPanelsFromCoordinates and object_updateCollisionPanels to keep\
  \ the\n     object's occupied panels and collision map in sync with the new position.\n  3. Decrements oBattleObject_Timer;\
  \ if non-zero, the function returns for this frame.\n  4. When the timer expires, decrements oBattleObject_Param2\
  \ (\"remaining hits/phases\" counter);\n     if non-zero it calls battle_BDT_80c956c to kick off the next phase\
  \ and returns.\n  5. When Param2 reaches zero, increments oBattleObject_CurAnim, calls object_clearCollisionRegion\n\
  \     and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized so\n     the object\
  \ is torn down at the next state transition.\nClobbers r0-r3 and lr; preserves r4-r6,r7 (only r4 explicitly pushed\
  \ alongside lr). r5 stays live\nacross the call and is the implicit return of the object pointer to the caller.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
