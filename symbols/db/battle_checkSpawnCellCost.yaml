name: battle_checkSpawnCellCost
address: '0x081349E8'
kind: function
status: probable
summary: Looks up a 0x20-byte record in the spawn-panel table at word_202A020 and returns flag bits telling
  whether its stored cost value fits the remaining 60-unit budget and the navi's RegUp allowance.
interface: '(r5 = handler struct: cell indices at +0x20/+0x24, value at +0x64, navi byte at +0x14) ->
  r0 = 2-bit status (bit1 clear if 0x3C-[r5+0x64] >= value, bit0 clear if RegUP-or-0x1E >= value, 3 if
  record flag unset), r1 = record value; no flags'
details: It indexes word_202A020 by ([r5+0x20]+[r5+0x24])*0x20, giving a table of 0x20-byte records. If
  bit7 of the record's +0x1C halfword is clear it returns 3 immediately with r1 = 0. Otherwise it takes
  the high halfword of the record's +0x18 word as a cost r4. It clears return bit1 when the remaining
  amount 0x3C - [r5+0x64] covers the cost, and clears return bit0 when the allowance — 0x1E while a submenu
  is open, else the RegUP byte from the current PET navi's NaviStats — covers it. So a fully passing check
  returns 0 and any set bit marks a failed comparison; records without the bit7 flag are reported as failing
  both. The exact meaning of the 60 and 30 constants and of the record structure is inferred, not confirmed.
