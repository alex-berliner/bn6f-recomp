name: battle_updateQuakePanelAttackObject
address: '0x080BF07A'
kind: function
status: probable
summary: Update handler for a battle attack object that, 4 frames in, spawns an element-marked dimming
  collision region on its panel, shakes the camera, spawns an extra effect object, plays SFX 0xC3, and
  ends after 60 frames.
interface: (r5 = battle object) -> updates oBattleObject_CurAnim/Timer/PhaseInitialized; sets CurPhaseAndPhaseInitialized
  = 8 when done
details: On first invocation it sets the object's anim to 0xC, clears the timer, and flags itself initialized.
  Four frames later, if oBattleObject_Param4 is 0, it loads a per-alliance pointer from the two-entry
  table at byte_80BF0F0 (values 0x0405FF82 / 0x0405FF81) and passes it with r1=2, r3=0, r4=1 to sub_80E2FE8,
  whose returned byte it ORs with 0x10 (a dimming/darken flag). It then spawns a dimming collision region
  at the object's PanelX/PanelY carrying the object's Element and DamageAndStaminaDamageCounterDisabler
  fields, triggers a camera shake of magnitude 3 for 30 frames, spawns a kind-0xA ExtraVars object with
  ExtraVars=3 and constant 0x12300, and plays sound 0xC3. Afterwards it only increments oBattleObject_Timer
  and, once it exceeds 0x3C, sets the phase to 8 to terminate the object.
