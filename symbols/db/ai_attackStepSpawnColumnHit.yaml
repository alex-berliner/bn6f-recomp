name: ai_attackStepSpawnColumnHit
address: '0x080ED278'
kind: function
status: probable
summary: Per-frame AI attack step that on first run sets anim 0xC, default counter, ObjectFlags1 bit 22,
  StepTimer=0xF and AttackElement=4; when StepTimer hits 0xD it spawns hits via sub_80CA90E at the front
  panel (SubStepIndex==0) or at x=Alliance*5+1 as a 3-tall column (SubStepIndex!=0), then decrements;
  on -1 it resets StepTimer to 0xF and sets HitElement=4 to loop.
interface: () -> void; uses global working battle object (r5) and its AI attack vars block (r7); clobbers
  r0-r4, r6
details: 'When oAIAttackVars_AttackElement is 0 it initializes: object_setAnimation(0xC), object_setDefaultCounterTime,
  sets ObjectFlags1 bit 22 via object_setFlag1, then stores StepTimer=0xF and AttackElement=4. When StepTimer
  reaches 0xD it calls sub_80CA90E (hit/projectile spawner) with x,y target panel plus InitFlag, 0, AttackBoost2
  and Damage+AttackBoost as stack args; with SubStepIndex==0 the target is the front panel (object_getFrontDirection
  + PanelX, PanelY), otherwise x=Alliance*5+1 and it fires three times at y, y+1, y+2 (a full column).
  Each call decrements StepTimer; on reaching -1 it resets to 0xF and writes HitElement=4, so the attack
  loops every 16 frames.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'init block: object_setAnimation(0xC) + object_setDefaultCounterTime + object_setFlag1(bit22)
    when AttackElement==0; StepTimer==0xD gate then sub_80CA90E called with object_getFrontDirection+PanelX/PanelY
    when SubStepIndex==0; two extra sub_80CA90E calls with r1+1 cover y+1 and y+2: a 3-row column hit;
    stack args r6=Damage+AttackBoost, r2=InitFlag, r4=AttackBoost2 loaded from oAIAttackVars before pushing
    {r0-r4,r6}; tail: StepTimer wraps to 0xF and HitElement is set to 4, indicating a repeating timed
    attack'
  refs:
  - bn6f/asm/asm31.s:115058
  - 0x0800E2CA object_getFrontDirection
  - 0x0800F2B6 object_setAnimation
  - 0x0800FDB6 object_setDefaultCounterTime
  reproduce: python3 tools/asmcat.py 0x080ED278
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary mostly fits: init block sets anim 0xC, default counter, ObjectFlags1 bit 22, StepTimer=0xF,
    AttackElement=4; at StepTimer==0xD spawns via sub_80CA90E with front-panel coords when SubStepIndex==0
    or column (x=Alliance*5+1) when non-zero, looping 0xF..-1 and writing HitElement=4. However, the proposal
    says ''AttackElement=4'' is stored in the init but the asm shows strh to HitElement at end, not AttackElement
    (both store 4 but different fields). Also note HitElement is written with strh not strb. Minor: ''facing
    front panel'' is only the SubStepIndex==0 branch; non-zero shoots a fixed column independent of facing,
    so ''in front'' is misleading.; run wf investigate investigate-20261018-230610; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
