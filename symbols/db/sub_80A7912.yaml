open_questions:
- 'What r6 actually points to: the offsets 0x8/0xc/0x10 read from r6 don''t match any obvious AIData slot, and AIData
  fields at those offsets (Unk_40/44/48) are u32s that could hold scratch movement values but the symbols are unknown.'
- What r7 (script cursor) points to and where it is initialized in the caller (sub_80A78E0) — without seeing sub_80A78E0's
  body we can't tell if r7 is the script pointer itself or a cursor into a larger script table.
- The exact role of sub_8142050 and sub_80A7BC0; both are unknown and could meaningfully rename this function once
  their bodies are read.
