  detail: '- `mov r0, #0x5a ; mov r1, #0x20 ; mov r2, #0x20 ; mov r3, #0x12` (asm36.s:8863) fixes the call shape
    into the callee. - `ldr r4, off_81346F4 // =byte_81331F4` plus the named callee `battleObject_updateShieldOrStatusEffect_813468C`
    confirms the callee operates on byte_81331F4 at offset 0x5a. - `ldr r6, byte_81346FC // =0x0` provides the 5th
    argument that the callee''s contract marks as `in: r6`. - Captured exit r0 values are small distinct integers
    (0x50/0x40/0x11/0x62/0x52/0x42 …) consistent with a shield/effect-kind field being read back, not with HP/damage.
    - All four callers (sub_81333A0, sub_8133A68, sub_8133B18, sub_8133B74) live in the AI/turn-handling region
    around 0x08133xxx, implying this is part of per-turn reset of an effect slot.'
