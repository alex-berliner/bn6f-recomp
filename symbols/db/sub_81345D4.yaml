name: sub_81345D4
address: '0x081345D4'
kind: function
previous_names: []
status: hypothesis
summary: Thin caller that forwards fixed arguments to the per-actor shield/status-effect updater for one frame.
interface: '(r0 = ?, r1 = ?, r2 = ?, r3 = ?) -> r0 = updater return code (varies: 0x11/0x40/0x42/0x50/0x52/0x62);
  side effects: none of its own besides the call'
details: "Saves r4-r7 and lr, then loads five immediates into r0-r4,r6: r0=0x5a, r1=0x20, r2=0x20,\n  r3=0x12, r4\
  \ = address of byte_81331F4 (loaded via off_81346F4), r6 = 0. It then tails into\n  battleObject_updateShieldOrStatusEffect_813468C\
  \ and returns that callee's r0 to its own\n  caller (pop {r4-r7,pc}). All real work lives in the callee; this\
  \ is just a parameter-pack\n  wrapper with a hard-coded \"which effect\" / argument set (0x5a, 0x20, 0x20, 0x12,\
  \ table @\n  0x081331F4, 0). It is called from four sibling sub_8133xxx helpers (81333A0, 8133A68,\n  8133B18,\
  \ 8133B74), which suggests each picks a different effect variant by feeding\n  different immediates through their\
  \ own wrapper - this one being the 0x5a variant.\n  Return values seen across captured calls (0x11, 0x40, 0x42,\
  \ 0x50, 0x52, 0x62) come from\n  the callee, not from anything done here.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4-r7,lr}` / `pop {r4-r7,pc}` and the single `bl` show this is a thin trampoline (asm listing
    of sub_81345D4, bn6f/asm/asm36.s:8864). - The hard-coded `mov r0,#0x5a ; mov r1,#0x20 ; mov r2,#0x20 ; mov r3,#0x12`
    plus `ldr r4,off_81346F4` (=byte_81331F4) and `ldr r6,byte_81346FC` (=0) are the only meaningful instructions
    before the `bl battleObject_updateShieldOrStatusEffect_813468C`. - Exit r0 in the six captured calls (0x50,
    0x40, 0x11, 0x62, 0x52, 0x42) varies while entry arguments are constant, so the return value is computed entirely
    inside the callee and merely returned through this wrapper. - All four callers (sub_81333A0/8133A68/8133B18/8133B74)
    follow the same tail-call pattern (they share r5/r10/lr in-contracts), consistent with this being one of several
    sibling wrappers each selecting a different effect ID.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x081345D4

    '
  result: the body read as described above
