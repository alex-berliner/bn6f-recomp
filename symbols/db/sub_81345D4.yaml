name: sub_81345D4
address: '0x081345D4'
kind: function
status: hypothesis
summary: Parameterless wrapper that invokes sub_813468C with one hard-coded argument set (0x5A, 0x20, 0x20, 0x12,
  table byte_81331F4, flag 0x40000000) and passes the caller's r5/r7 through untouched.
interface: void sub_81345D4(void); // inputs r5, r7 forwarded to sub_813468C; no meaningful return value (r4-r7
  preserved)
details: 'Trivial thunk: sets r0=0x5A (90), r1=0x20 (32), r2=0x20 (32), r3=0x12 (18), loads r4 with the address
  of the data table byte_81331F4, loads r6 with the literal-pool word 0x40000000 (a single flag bit, likely a mode/option
  flag for the callee), leaves r5 and r7 exactly as the caller set them, then tail-calls sub_813468C. r4-r7 are
  pushed/popped around the call so all of them are preserved for the caller; only r0-r3, lr and the flags are clobbered.
  Since the callee''s behavior is not yet documented, the game-level meaning of the constants (dimensions 32x32
  with values 90 and 18? an index/count pair? a data table of 90+18 entries?) is unknown; the presence of a byte
  table pointer plus a 32/32 pair suggests some kind of resource or buffer description being handed to a general-purpose
  worker routine.

  '
