name: sub_81345D4
address: '0x081345D4'
kind: function
previous_names: []
status: hypothesis
summary: Reset a battle-object shield/status-effect slot using a table lookup and return its previous value.
interface: '(r5 = toolkit (held in callee), r10 = toolkit) -> r0 = previous content of byte_81331F4[0x5a] (shield/status-effect
  kind); side effects: writes byte_81331F4[0x5a] = 0 via the callee.'
details: "The function is a small wrapper. It hard-codes an index (0x5a) into a 0x20-byte structure pointed to by\
  \ the literal\n  byte_81331F4 (`ldr r4, off_81346F4 // =byte_81331F4`), passes (byte_81331F4 + 0x5a) as the actor\
  \ pointer, and\n  forwards to `battleObject_updateShieldOrStatusEffect_813468C` with the parameters (r0=actor,\
  \ r1=0x20,\n  r2=0x20, r3=0x12). r6 is preloaded with 0 (`ldr r6, byte_81346FC // =0x0`), which is the 5th argument\
  \ to the\n  callee (held in r6 in its contract). The callee reads byte_81331F4[0x5a] (a state/flag kind for an\
  \ in-flight\n  shield/status effect entry), clears or updates it, and returns the prior value in r0 — captured\
  \ exit values in\n  snapshots (0x50, 0x40, 0x11, 0x62, 0x52, 0x42, …) match distinct shield/effect kind IDs. Because\
  \ r0 is live on\n  exit, callers receive the cleared/effected kind back; r4–r7 are callee-saved and restored via\
  \ the matched\n  `push {r4-r7,lr}` / `pop {r4-r7,pc}`.\n"
