- which battle script opcode or chip triggers sub_810FF68
- 'The proposal correctly identifies the structure: loads table pointer, calls GetAllianceDependentPanelParamArgs,
  then tail-calls sub_8015C94. However, ''battle_randomPanelEffect'' is misleading because sub_8015C94
