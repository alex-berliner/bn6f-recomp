name: reqBBS_updateFrame_811C18C
address: '0x0811C18C'
kind: function
status: confirmed
summary: Per-frame update for the request BBS screen — refreshes the eReqBBSGui object and then runs the sprite
  update.
interface: void sub_811C18C(u32 r5 /* sprite update arg / GUI object list */); outputs r2, r3 (from sprite_update),
  r5 preserved; clobbers r0, r1, lr and nzcv
details: 'Thin two-call wrapper run every frame while the request BBS (the bulletin-board

  screen where the player takes requests) is open. It first calls reqBBS_81406FC

  with r5 = &eReqBBSGui (the GUI object''s address, loaded via a literal pool word),

  which presumably advances the BBS GUI''s internal state. The wrapper pushes lr and

  r5 on entry, and pops r5 specifically before branching to sprite_update so that

  sprite_update receives the caller''s original r5 rather than the GUI pointer — the

  two callees take different values in the same register. sprite_update''s results

  (r2, r3, flags) are passed straight through to the caller. r4 and r5 are preserved

  across the whole call; lr is clobbered by the callees.

  '
