name: ai_attackPhaseOut
address: '0x08102366'
kind: function
status: probable
summary: 'AI attack routine: halves a counter if the target is adjacent, then makes the object unable
  to slide and removes it from its collision region (goes intangible) before advancing its element/state
  field.'
interface: (no args; r5 = battle object, r7 = oAIAttackVars) -> r0 = result of sub_810990E; flags clobbered
  by calls
details: 'Reads the target''s panel X/Y from the AI attack vars and the object''s own PanelX/PanelY; if
  both differences (+1) land in 0..2 (target within the 3x3 around the object), it halves oAIAttackVars_ScratchVar
  via lsr #1, otherwise skips. It then ORs OBJECT_FLAGS_CANNOT_SLIDE into the object''s flags, adds 4
  to oAIAttackVars_HitElement, clears the object''s collision region via object_clearCollisionRegion (removing
  it from collision lookups), and finally calls sub_810990E. The combination of cannot-slide plus a cleared
  collision region strongly suggests the object entering an intangible/untargetable (e.g., phased-out
  or buried) state; halving ScratchVar when the player is nearby looks like adjusting a timer, but its
  meaning is unconfirmed.'
