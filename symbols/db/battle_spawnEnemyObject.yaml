name: battle_spawnEnemyObject
address: '0x080076A0'
kind: function
status: probable
summary: Spawns a battle enemy object at a panel position, initializes its AI data, stats and alliance,
  and returns the object pointer.
interface: '(r0 = enemy_index: u16, r1 = panel_x, r2 = panel_y, r3 = alliance, stack+0x14 = unk param
  stored to AIData+0x14/BattleObject_Param2) -> r0 = *BattleObject or NULL on allocation failure'
details: 'Looks up the enemy index via GetVerActorTyAndAIIdx_80182B4 to get version/actor_type/ai_index,
  converts panel coords to object coordinates and calls object_spawnType1. Allocates an AIData slot (object_createAIData),
  freeing the object and aborting if none is free; if modifyBattleStateBasedOnAliveBattleActorsAndUnkCond_8007778
  fails it also frees the AIData and returns NULL. Sets BattleObject.Alliance, sets flag bit 4 in the
  object header, stores the enemy index as NameID, copies version/actorType/AIIndex/variant into AIData,
  and reads enemy_getStruct2''s record: low 12 bits are HP (also MaxHP), bits 12+ are Element, halfword
  at +4 is Damage; sets StaminaDamageCounterDisabler to 10 and Chip to 0xFFFF. Stores panel x/y into current
  and future panel fields, writes the unk param into AIData_BubbleSourceObjectPtr and DisableCounterDecrement/Param2,
  sets AISubordinateSlot to 0xFF, and if the unk param is 0 appends the object to its alliance''s entry
  list via battle_addObjectToAllianceEntryList_80077D2. Returns the object pointer.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'object_spawnType1 + GetVerActorTyAndAIIdx_80182B4: creates the battle object from the enemy
    index''s version/actor-type/AI record; HP/element split of enemy_getStruct2 record (lsl/lsr 0x14)
    written to oBattleObject_HP/MaxHP and oBattleObject_Element; strh 0xFFFF to oBattleObject_Chip and
    0xFF to oAIData_AISubordinateSlot mark it as a non-chip enemy combatant; battle_addObjectToAllianceEntryList_80077D2
