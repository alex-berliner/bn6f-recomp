name: sub_8011420
address: '0x08011420'
kind: function
status: hypothesis
summary: 'Dispatches a menu/UI control value: if r0 is 0, forwards r1 to sub_8011268; otherwise forwards r0 to sub_8010DF6
  with selector 2.'
interface: void sub_8011420(u32 r0, u32 r1); // no return; clobbers r0-r4, flags
details: 'Two-way branch on the first argument. The zero case looks like a "no selection / close" path that just
  passes the second argument through to sub_8011268. The non-zero case rewrites r0 to the constant 2 and uses the
  caller''s r0 as the sub_8010DF6 argument, suggesting sub_8010DF6 is a handler that interprets its first argument
  as an opcode/selector (here forced to 2, e.g. "confirm/execute") and its second as the item id.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
