name: battle_updateRiseWhileTimerEndsAction
address: '0x080C3A50'
kind: function
status: probable
summary: 'Battle-object update step: floats the object upward (Z += 0x8000/frame) while its timer is still
  above 0x50, counts the timer down, and when it expires switches the object to action 4 with phase reset.'
interface: (r5 = battle object ptr, implicit; r0/r1 scratch) -> void; sets oBattleObject_Z, oBattleObject_Timer,
  oBattleObject_CurAction=4, oBattleObject_CurPhaseAndPhaseInitialized=0 on expiry
details: 'r5 is a battle object: it reads oBattleObject_Timer; while Timer > 0x50 it adds 0x8000 (fixed-point
  step, ~half a unit in the battle Z coordinate) to oBattleObject_Z each tick, making the object drift
  upward/away. It then decrements Timer unconditionally (strh after sub, flags set). Once the decrement
  underflows (Timer goes negative), it stores 4 into oBattleObject_CurAction and zeroes oBattleObject_CurPhaseAndPhaseInitialized,
  ending this behavior and handing the object to whatever action 4 is. No other state is touched, so it
  is a self-contained timed ''rise then end'' phase handler, typical of an object that departs the field
  (e.g. flies off) before returning to its next action.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r5,#oBattleObject_Timer]; cmp #0x50; ldr r1,=0x8000; add to [r5,#oBattleObject_Z]
    — upward drift gated by timer threshold; sub r0,#1; strh r0,[r5,#oBattleObject_Timer]; bge — timer
    counts down and ends behavior on underflow; mov r0,#4; strb [r5,#oBattleObject_CurAction]; strh 0
    to CurPhaseAndPhaseInitialized — expiry hands object to action 4, phase reset; uses only oBattleObject
    fields (Timer, Z, CurAction, CurPhase) — pattern of a battle object per-frame state handler'
  refs:
  - bn6f/asm/asm31.s:26027
  reproduce: python3 tools/asmcat.py 0x080C3A50
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- no callers known — which objects use this and what action 4 means (despawn vs. return to idle) is unconfirmed
- what fixed-point scale oBattleObject_Z uses (is 0x8000 half a tile or a full unit) and whether 'up'
  or 'away' is the visual direction
