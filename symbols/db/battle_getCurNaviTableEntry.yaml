name: battle_getCurNaviTableEntry
address: '0x081276E4'
kind: function
status: probable
summary: Returns a word from the currently selected PET navi's data table, indexed by an entry in the
  toolkit battle struct minus a per-navi base.
interface: () -> r0 = word from [ *[pt_8121200[navi]] + ([S2001c04+0x30] - byte_81211B4[navi])*4 ]; clobbers
  r1-r4, lr
details: Loads the toolkit's S2001c04 pointer and reads field +0x30 as an index. GetCurPETNavi supplies
  the current navi ID; byte_81211B4 (halfwords, indexed navi*2) holds a per-navi base that is subtracted
  from field +0x30, and pt_8121200 (indexed navi*4) holds a per-navi pointer whose first word is an array
  pointer. The adjusted index*4 selects the returned word. Offsets off_8127708/8127714 (byte_201D74C,
  unk_2024394) sit in the literal pool but are unused by this function.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl GetCurPETNavi supplies r2 = current navi ID used for both table lookups; ldrh r1,[off_8127710+r2*2];
    sub r4,r4,r1 converts field +0x30 into a per-navi index; ldr r1,[off_812770C+r2*4]; ldr r1,[r1] follows
    a per-navi pointer to its array base; ldr r0,[r1,r4*4]; pop returns the selected word to caller 0x08127638;
    caller battle_buildPetNaviList_8127638 works with PET navi IDs, consistent with a per-navi lookup
