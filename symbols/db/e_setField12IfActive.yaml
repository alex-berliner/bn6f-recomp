name: e_setField12IfActive
address: '0x0811C544'
kind: function
status: probable
summary: If the eStructArr2008450 entry for the given index is in use, sets its byte at offset 0x12 to
  1; otherwise does nothing.
interface: (r0 = index into eStructArr2008450, passed through to callee) -> r0 = 1 if entry was active
  and byte 0x12 written, 0 if entry inactive; flags consumed from getStructFrom2008450's NZ on the in-use
  byte
details: 'Passes r0 unchanged to getStructFrom2008450, which returns the entry''s in-use/status byte in
  r0 and the entry pointer in r1 with NZ set from that byte. If the byte is zero (BEQ) the function returns
  immediately with r0 = 0. Otherwise it stores 1 to [r1,#0x12], leaving r0 = 1. So it is a guarded one-byte
  setter: only active (non-zero status) entries of the fixed 0x58-byte struct array at 0x02008450 get
  their offset-0x12 byte set to 1. The meaning of offset 0x12 and the game-level purpose are not visible
  from this code, and no callers are known.'
