name: sub_8012C4A
address: '0x08012C4A'
kind: function
status: confirmed
summary: Looks up the chip in a given slot and, when it is a particular navi/cross-type chip whose battle navi's
  stats byte 0x2C reads 4 or 0x10, ORs the 0x1000 bit into the caller's flags word.
interface: 'u32 sub_8012C4A(u32 chipSlot, u32 flagsWord) -> u32 flagsWord (r0 in: chip slot index, r1 in: flags
  word, r0 out: flags word with possible 0x1000 bit added; r2 is scratch left holding 1 or 2; r1/lr clobbered, r4/r5/r6
  preserved, nzcv clobbered)'
details: 'Calls getChip8021DA8 with r0 (a chip slot index) to get a pointer to the chip''s ChipData. Reads the chip''s
  attribute byte at ChipData+9: the extra flag is only considered when bit 1 is set and bit 0 is clear. Under that
  condition it requires ChipData+6 (a kind/class byte) to equal 0x0A, then calls GetBattleNaviStatsByte_AllianceFromBattleObject
  with r1=0x2C to fetch byte 0x2C of the battle navi stats (the alliance/cross-state byte of the battle object''s
  navi). If that byte is 4 or 0x10, the caller''s flags word (r1 on entry, held in r4) gets bit 0x1000 ORed in.
  The flags word is returned in r0. Quirks: r2 is left holding 2 when the first attribute test fails and 1 otherwise,
  matching the original''s leftover scratch value; the check for "bit1 set, bit0 clear, kind==0x0A" looks like a
  test for a specific chip classification (likely a Cross/navi-related chip) and the 0x1000 flag presumably marks
  some battle behavior tied to that chip being active.'
