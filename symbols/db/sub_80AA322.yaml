name: sub_80AA322
address: '0x080AA322'
kind: function
status: confirmed
summary: Per-frame update for an overworld NPC sprite bound to a cutscene; picks mode 1 or 3 based on cutscene readiness,
  copies the NPC transform into the sprite, applies the layer effect, then runs priority + sprite update.
interface: void sub_80AA322(struct SpriteObj* r5 /* sprite to update */, ??? r10 /* caller-saved scratch */); returns
  nothing; r2/r10/r11 are clobbered outputs of sprite_update (r5 + 0x0C block is the position buffer; mode byte
  stored at r5[0]).
details: "Picks a 1-byte mode (default 1, promoted to 3) by:\n  - calling sub_81279A8 (must return Z set),\n  -\
  \ then cutscene_checkOriginalCutsceneScriptPos_8036F70 on byte_8088514,\n  - then cutscene_checkOriginalCutsceneScriptPos_8036F70\
  \ on byte_8088708.\nIf all three return Z, mode = 3; otherwise mode = 1. The chosen mode is stored as a byte at\
  \ r5[0] (the sprite's mode/animation slot).\nThen copies three 32-bit words from the overworld NPC table eOverworldNPCObjects\
  \ at offsets +0x24/+0x28/+0x2C (likely X, Y, layer/flags) into the sprite buffer at r5+0x0C/+0x10/+0x14.\nCalls\
  \ applyLayerEffectToOWObject_8035694 on r5+0x0C to convert the OW coords into sprite-space.\nCalls sprite_setPriority_8002E14\
  \ and sprite_update; the latter is what produces the r2/r10/r11 outputs the caller relies on.\nPreserves r4-r9\
  \ and r12; r0/r1/r3 are scratch. Uses lr to pop into pc (tail via pop {r4-r7,pc}).\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
