name: battle_ensureAuxObject54
address: '0x08112648'
kind: function
status: probable
summary: Anim/step helper for a battle object that spawns (once) its tethered auxiliary object 0x54 and
  remembers it.
interface: (r5 = self battle object) -> r0 = spawned object pointer (also stored at self+oBattleObject_ExtraVars+0x10);
  no flag semantics
details: 'Takes its subject in r5 rather than r0, setting the object''s current animation (oBattleObject_CurAnim)
  to 1. It then checks ExtraVars+0x10 as a lazy-init guard: if it already holds a pointer the function
  returns immediately, otherwise it spawns owned object 0x54 with args (0, 0, 5, 0) — 5 likely a sub-type/behavior
  id — via battle_spawnOwnedObject54, which ties the aux object''s position/alliance to the owner and
  passes the four args into its ExtraVars. The resulting pointer is cached in ExtraVars+0x10, so subsequent
  runs are no-ops. The write to CurAnim before the spawn suggests it runs as part of an animation/state
  transition of the owner.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r5,#oBattleObject_CurAnim] with r0=1 sets the owner's animation state; ldr r0,[r5,#oBattleObject_ExtraVars+0x10];
    bne locret — cached guard makes the spawn happen only once; bl battle_spawnOwnedObject54 with r2=5
    spawns tethered aux object 0x54 with params 0,0,5,0; str r0,[r5,#oBattleObject_ExtraVars+0x10] stores
    the spawned object as the owner's extra handle
