name: battle_ensureAuxObject54
address: '0x08112648'
kind: function
status: confirmed
summary: Sets a battle object to animation 1 and lazily spawns its owned aux/helper object (id 0x11504, kind 5),
  caching the helper's handle.
interface: void battle_ensureAuxObject54(battleObject* obj /*r5*/); clobbers r0-r3, lr and flags; preserves r4-r7
  (r4 returned unchanged)
details: 'Takes a battle object pointer in r5. First stores 1 into the object''s oBattleObject_CurAnim byte, switching
  the object to its idle/current animation. Then checks the cached helper handle at oBattleObject_ExtraVars+0x10;
  if it is nonzero the function returns immediately (helper already spawned). Otherwise it calls battle_spawnOwnedObject54
  with (r0=0, r1=0, r2=5 /*spawn kind*/, r3=0) and r4 = 0x11504 (the helper''s object id, loaded from dword_81126D8),
  stores the returned handle back into oBattleObject_ExtraVars+0x10 so the helper is only created once, and returns.
  The helper object is owned by the calling object (spawn is "owned", so the helper presumably follows/dies with
  the owner). r4 is pushed/popped purely as a scratch-saver for the call, so it comes back with whatever value the
  caller had; r5-r7 are whatever the spawn call leaves behind (it preserves r5).

  '
