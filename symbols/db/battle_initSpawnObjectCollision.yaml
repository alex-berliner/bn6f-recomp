    copies bit 0x10 from THIS object (r5) onto the FOUND object (r0), not from the found object onto this
    one. Additionally the proposal omits the ''bl sub_80D2BC0'' call that occurs between setting Timer/Timer2
    and calling object_setCollisionRegion. The name and overall structure (collision alloc/setup, state=CLEAR_STATE_UPDATE,
