name: battle_initSpawnObjectCollision
address: '0x080D2AB4'
kind: function
status: probable
summary: 'Shared init for a spawned battle object: if Param1==0 copies bit 0x10 of this object''s flags
  onto an object found via sub_80D2B8E(list at r5+0x68); allocates a collision slot (frees object and
  stores 0 in ExtraVars+8 on failure); calls object_setupCollisionData with width 6/0x4A, height 5, value
  0x61/3 from params; sets Timer2=Param2, Timer=0xC; calls sub_80D2BC0; marks region 1 and hit-effect
  0xA; enters CUR_STATE_UPDATE via sub_80D2B2C.'
interface: (r5 = battle object, not passed in registers) -> r0 clobbered; on collision-slot allocation
  failure the object is freed and r0=0 is stored in ExtraVars+8
details: 'Reads the object at r5. When Param1 is 0, it walks a list head at r5+0x68 via sub_80D2B8E and
  copies bit 0x10 of the found object''s header flags onto this object (clearing other bits of that mask).
  It then allocates a collision-data slot (object_createCollisionData); if none is free it zeroes ExtraVars+8
  and frees the object via object_freeMemory. Otherwise object_setupCollisionData is called with geometry
  taken from the spawn params: width 6 or 0x4A depending on Param1, height 5, and a value of 0x61 or 3
  depending on Param3. It sets Timer2 = Param2 and Timer = 0xC, marks collision region 1 and hit-effect
  type 0xA, stores CUR_STATE_UPDATE into the object''s state field, and calls sub_80D2B2C.'
