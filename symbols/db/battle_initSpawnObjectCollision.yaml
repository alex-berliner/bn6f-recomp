name: battle_initSpawnObjectCollision
address: '0x080D2AB4'
kind: function
status: confirmed
summary: 'Sets up the collision half of a freshly spawned battle attack object: spawns a companion object if needed,
  allocates collision data (freeing the object on failure), configures shape/hit behaviour and timers, moves it
  onto the panel in front of its related object, arms the collision region/hit effect and hands it to the pulsing-attacker
  update state.'
interface: void battle_initSpawnObjectCollision(u32 r1 spawnerArg, BattleObject* r5 obj, u32 r8 pulsingCtx) -> returns
  r5, r8 from battle_objectUpdatePulsingAttacker; preserves r4/r6/r7, clobbers r0-r3/lr and flags
details: 'r5 is a battle object. If oBattleObject_Param1 is 0, it first spawns a companion object via sub_80D2B8E
  using oBattleObject_Element, oBattleObject_Z, oBattleObject_Params+1 and oBattleObject_DamageAndStaminaDamageCounterDisabler,
  passing r1 through untouched and r5+0x68 as a context pointer; it then copies the caller''s 0x10 bit of oObjectHeader_Flags
  onto the companion (clearing that bit in the companion, ORing in the parent''s value). It always calls object_createCollisionData;
  if that fails (r0 == 0) it zeroes oBattleObject_ExtraVars+8, frees the object via object_freeMemory and returns,
  leaving r5/r8 as they came in. Otherwise it configures the collision: object_setupCollisionData with shape 0x4A
  when Param1 != 0 else 6, hit behaviour 3 when Param3 == 1 else 0x61, and r2 = 5 (element/size selector). Timers
  are initialised as oBattleObject_Timer2 = Param2 (frames until activation) and oBattleObject_Timer = 0xC (12-frame
  pulse period). It then calls battle_syncToPanelInFrontOfRelated to place the object on the panel in front of its
  related object, arms the collision with object_setCollisionRegion(1) and object_setCollisionHitEffect(0xA), stores
  CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized and finally enters battle_objectUpdatePulsingAttacker,
  whose returned r5/r8 become this function''s outputs (r4/r7 reaching that call are whatever the earlier helpers
  left).'
