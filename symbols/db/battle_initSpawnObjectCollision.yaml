    bit 0x10 merge); tst r0,r0 after object_createCollisionData; failure path stores 0 to ExtraVars+8
    and calls object_freeMemory; loc_80D2AF0: r1=6 vs 0x4A from Param1, r3=0x61 vs 3 from Param3, r2=5,
    then bl object_setupCollisionData; strh Param2 -> Timer2, strh 0xC -> Timer, then object_setCollisionRegion(1)
    and object_setCollisionHitEffect(0xA); str CUR_STATE_UPDATE -> oBattleObject_CurStateActionPhaseAndPhaseInitialized,
    then bl sub_80D2B2C before return'
