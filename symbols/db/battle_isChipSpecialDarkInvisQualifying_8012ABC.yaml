name: battle_isChipSpecialDarkInvisQualifying_8012ABC
address: '0x08012ABC'
kind: function
status: confirmed
summary: Checks whether a battle object's current chip qualifies for some special chip-related condition and returns
  1 or 0.
interface: bool sub_8012ABC(void* battleObject) — r0 in is the battle object; r0 out is 1 when qualified, 0 otherwise;
  r2 is scratch-clobbered (2 on early bail, 1 after flag tests); r6 and r7 preserved.
details: 'Loads a stat via GetBattleNaviStatsByte_AllianceFromBattleObject at offset 0x2C of the battle object and
  requires it to be exactly 0x17 or 0x18 (a narrow two-value window, likely specific navi/alliance states). Then
  fetches the object''s chip data through getChip8021DA8 and reads the flag byte at chip+9 and the element byte
  at chip+6. The chip must have flag bit 1 set, flag bit 0 clear, and element 0xA (0xA is likely a specific element
  such as Sword or a null/none value). Additionally GetBattleMode must not return 1, so the check is disabled in
  one particular battle mode. If all conditions hold the function returns 1, otherwise 0. Quirk: r2 is left holding
  2 if the check bailed before the flag tests and 1 afterwards, an artifact of scratch register usage rather than
  meaningful output.'
