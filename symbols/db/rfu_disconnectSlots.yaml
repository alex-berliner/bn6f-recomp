name: rfu_disconnectSlots
address: '0x081461FC'
kind: function
status: probable
summary: 'Tears down one or more wireless link slots: removes them as send targets, stops NI receive,
  and clears their entries in the link tables.'
interface: (r0 = bitmask of link slots (0-3) to disconnect) -> r0 = clobbered (never meaningful to callers);
  calls rfu_changeSendTarget(0x20, slot) and rfu_NI_stopReceivingData(slot)
details: Takes a bitmask r0 of link slots. First, if the control struct at dword_2010CC0 has byte[4] set,
  it scans the 4 pointers at dword_2010CB0; for each with word[0]&0x8000 set, if byte[0x1A] contains the
  slot bit it clears that bit and calls rfu_changeSendTarget(0x20, slotIndex) to drop it as a send target.
  Second, if byte[5] is set, it scans the same table via word[0x34]&0x8000 and byte[0x4E], clearing the
  slot's NI receive via rfu_NI_stopReceivingData(slot). Third, if byte[6] is set it clears the slot bits
  from that byte and from byte[3] of every entry in off_2010CA0 whose word[0] equals 0x8024. This is the
  per-slot disconnect/cleanup counterpart of connection setup, invoked from rfu_handleConnectionEvent
  when slots drop.
