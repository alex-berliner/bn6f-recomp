name: battle_callEnemyAiActionByScriptId
address: '0x080F8428'
kind: function
status: probable
summary: Dispatches the enemy AI action handler selected by the battle object's AI state ScriptId.
interface: (r5 = battle object) -> r0 = handler return; r6 = AIDataPtr+0x80 (AI state), r7 = AIDataPtr+0xA0
  passed through to handler
details: Reads oBattleObject_AIDataPtr from the object in r5, sets r6 to AIDataPtr+0x80 and r7 to AIDataPtr+0xA0
  (AI state / secondary AI structs), then loads oAIState_ScriptId from r6. It uses that id to index the
  handler pointer table at off_80F8444 and calls the selected thumb routine via `mov lr, pc; bx r1`, so
  the handler sees r0 = ScriptId, r5 = object, r6/r7 = AI sub-structs. Entry 0 of the table is battle_aiEnemyAiActionHandler_80F8448.
  The function only preserves r6/r7/lr, relying on the caller for r5 and leaving r0..r4 free for the handler.
  It is effectively a trampoline/dispatcher, not logic itself.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r6,#oAIState_ScriptId]; ldr r1,[r1,r0] indexes table off_80F8444 by the AI state's
    ScriptId; mov lr, pc; bx r1 performs a thumb tail-call into table[ScriptId]; off_80F8444 entry 0 =
    battle_aiEnemyAiActionHandler_80F8448, matching the enemy-AI handler naming; r6=AIDataPtr+0x80 and
    r7=AIDataPtr+0xA0 are prepared before the call, so callees expect these AI sub-structs
