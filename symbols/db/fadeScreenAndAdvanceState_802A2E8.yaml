name: fadeScreenAndAdvanceState_802A2E8
address: '0x0802A2E8'
kind: function
status: confirmed
summary: If a condition (sub_802A394) is met, starts a screen fade (0x54 and 0x5C with length 0xA) and advances
  this object's state machine to step 4.
interface: void sub_802A2E8(S20364C0 *self /* r5 */) -> void; flags NZ returned (from CMP r0,#0 or the final MOV
  r0,#4)
details: "State-machine step handler for a S20364C0 object (self in r5). First calls\nsub_802A394 as a predicate;\
  \ if it returns 0 the function does nothing and just\nreturns (Z set from CMP r0,#0). When the predicate is true\
  \ it:\n  - calls SetScreenFade(0x54, 0xA) — screen effect 0x54, 0xA ticks;\n  - calls loc_8006274(0x5C, 0xA) —\
  \ a companion screen effect (0x5C likely the\n    matching fade-in/palette counterpart of 0x54), same 0xA tick\
  \ length;\n  - clears the byte at oS20364C0_Unk_13 (state/sub-state byte = 0);\n  - writes 4 to oS20364C0_JumpOffset12,\
  \ moving this object's jump/dispatch\n    offset to step 4 for the next update.\nr4-r7 are preserved as per the\
  \ register contract. The two (0x54/0x5C, 0xA)\ncalls suggest the classic \"fade the scene out then in\" pair used\
  \ at\ncutscene/encounter transitions.\n"
