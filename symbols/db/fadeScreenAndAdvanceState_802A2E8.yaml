  \ moving this object's jump/dispatch\n    offset to step 4 for the next update.\nr4-r7 are preserved as per the\
  \ register contract. The two (0x54/0x5C, 0xA)\ncalls suggest the classic \"fade the scene out then in\" pair used\
  \ at\ncutscene/encounter transitions.\n"
