summary: Resets a fixed set of five story event flags and sets one other flag (EVENT_120), then returns 0 — likely
  a scenario-state reset/reinit helper.
interface: void clearSetFlags_80355a8(void); /* returns r0 = 0; r4-r7 and r10 are preserved; flags clobbered */
details: 'Takes no meaningful input (the listed r4-r7/r10/lr inputs are just caller context; the function never
  reads them and preserves r4-r7 via push/pop). Unconditionally clears five event flags via ClearEventFlagFromImmediate
  — EVENT_682 (word 6, bit 0x82), EVENT_85F (word 8, bit 0x5F), EVENT_ABA (word 10, bit 0xBA), EVENT_CDC (word 12,
  bit 0xDC) and EVENT_CE0 (word 12, bit 0xE0) — then sets EVENT_120 (word 1, bit 0x20) via SetEventFlagFromImmediate.
  Always returns 0 in r0. All operations are hard-coded immediates; there is no parameterization. The exact story
  meaning of each flag is not identifiable from this function alone; the grouping (four later-word flags cleared,
  one early flag set) suggests it marks some scenario/task as re-armed or completed.

  '
