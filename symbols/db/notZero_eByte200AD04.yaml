name: notZero_eByte200AD04
address: '0x0803F524'
kind: function
status: confirmed
summary: Loads the event/state byte at 0x200AD04 and returns it with NZ flags set, so callers can branch on "is
  this flag/counter non-zero".
interface: 'u8 event_checkByte200AD04(void) // in: lr; out: r0 = byte value, r1 = &0x200AD04, NZ flags from the
  byte'
details: 'Tiny predicate wrapper: pushes lr, loads the single byte at IWRAM 0x200AD04 into r0,

  and returns via TST r0, r0 so the caller branches directly on the value without a

  separate compare. r1 is left pointing at word_200AD04 and r0 holds the byte itself,

  so callers can also reuse the value or address after the test. No other registers or

  flags are touched; the two padding bytes after POP {pc} keep alignment. 0x200AD04 is

  a work-RAM byte, so it is most likely a story/event flag or progression state used by

  the same event/script subsystem as the other eByte200xxxx checks.

  '
