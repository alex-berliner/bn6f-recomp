name: chatbox_closeFadeHandler_80499CE
address: '0x080499CE'
kind: function
status: confirmed
summary: Chatbox cleanup/reset handler gated on the screen-fade state (resets fade flag, clears VRAM/GFX,
  reinitializes chatbox state machine when not fading; otherwise takes an alternate early-out path).
interface: void sub_80499CE(u16* fadeState_r5, ... r6 r7 r8 r9 r10 r11 r12 lr) -> clobbers nz cv r0 r1
  r2 r3 r8 r9 r10 r11 r12 lr; preserves r4 r5 r6 r7
details: "Tests IsScreenFadeActive(); ZF clear (fade not currently running) means the \"reset\" path.\n\
  On the reset path:\n  - Calls sub_8049D42 and stores its boolean result as a byte at r5+4 (a \"fade_state\"\
  \ or \"dirty\" flag\n    on the structure pointed to by r5, mirroring the r5+0/r5+4 layout common to\
  \ chatbox/battle objects).\n  - Then chains sub_8049D70 -> sub_8049D4A -> sub_8049D3A (clear/setup sequence\
  \ for chatbox-related\n    buffers), sub_803F79E (palette/OBJ clear), zeroFillVRAM, ZeroFillGFX30025c0,\
  \ copyMemory_8001850\n    (CPU->VRAM copy / DMA-style helper), SetRenderInfoLCDControl with 0x40 (DISPSTAT/forced\
  \ blank\n    bits), chatbox_8040818 (chatbox init/reinit), and sub_811F758 (scene/state teardown).\n\
  \  - r4 is used only as a local scratch for the boolean; r5 is the input struct pointer and survives.\n\
  If IsScreenFadeActive() returns true (ZF set), control falls through to sub_803A820 which is the\n\"\
  wait for fade to finish\" path; the saved r7 slot is overwritten by 0x20093b0 by that callee and\nsurfaces\
  \ on the epilogue pop (preserved-register quirk, not a real read).\nUses the chatbox_8040818 helper,\
  \ strongly suggesting a chatbox/state-machine subsystem role.\nLCDControl 0x40 = bit 6 (forced blank\
  \ in BG mode 1/2/3/4/5), used while clearing VRAM.\n\nRegister form, old prompt; queued for retype (the\
  \ farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
