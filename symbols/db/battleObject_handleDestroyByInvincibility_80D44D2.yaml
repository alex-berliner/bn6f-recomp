open_questions:
- What the four sub-action handlers (sub_80D4544/4570/45EC/4604) actually do
- per CurAction value, and whether the `0xf800000` mask is checked for a
- specific "death by status" condition versus a more general "ignore this
- object now" condition. Reading those four sub-handlers would settle it.
