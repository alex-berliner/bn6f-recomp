name: ai_diveManWaveAttackStep
address: '0x080FE3EC'
kind: function
status: probable
summary: 'Per-frame update for DiveMan''s wave attack: on entry spawns the wave, sets anim 5 and a 0x12
  counter, and arms a 0x1D-frame StepTimer; each subsequent frame it decrements StepTimer, fires a camera
  shake (mag 2, dur 0x1E) at 0xA, and writes 0xC into HitElement when the timer expires (or the initial
  spawn fails) to hand control back to the AI attack state machine.'
interface: (r0 ignored; r5 = battle object, r7 = oAIAttackVars state) -> r0 = oAIAttackVars_HitElement
  set to 0xC when the step finishes or spawn fails; no meaningful return otherwise
details: 'State machine keyed on oAIAttackVars_AttackElement: on entry (element 0) it sets element 4 (Aqua)
  and calls ai_diveManWaveAttackSpawn; if spawning succeeded it sets the object''s animation to 5, gives
  a 0x12-frame counter via object_setCounterTime, and loads StepTimer with 0x1D. Each subsequent frame
  it decrements StepTimer: when it reaches 0xA it triggers a camera shake (magnitude 2, duration 0x1E)
  — roughly when the wave reaches the far side — and when it reaches 0 (or if the spawn failed immediately)
  it writes 0xC into oAIAttackVars_HitElement, handing control back to the AI attack state machine. Uses
  the shared oAIAttackVars fields AttackElement, StepTimer, HitElement and the battle object''s CurAnim.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: calls ai_diveManWaveAttackSpawn only when oAIAttackVars_AttackElement == 0, then sets CurAnim
    5 and StepTimer 0x1D (asm near 80FE3EC); decrements oAIAttackVars_StepTimer and at value 0xA calls
    camera_initShakeEffect_80302a8(2, 0x1E); writes 0xC to oAIAttackVars_HitElement on spawn failure (beq
    loc_80FE41E) or when StepTimer <= 0; element field forced to 4 before spawning, matching an Aqua-element
    DiveMan attack
