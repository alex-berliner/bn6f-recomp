name: sub_8120AE8
address: '0x08120AE8'
kind: function
status: confirmed
summary: Counts how many chips in the current PET navi's folder have the element passed in r0.
interface: u8 countNaviFolderChipsWithElement(u8 element); // in r0 = element id, out r0 = match count
details: 'Looks up the currently equipped PET navi via GetCurPETNavi, reads that navi''s stats byte at offset 0x2D
  (which selects the navi''s personal folder), and indexes the chip list at oToolkit_S_Chip_2002178_Ptr by selector*0x3C
  (60 bytes = 30 u16 entries). It iterates all 30 packed folder entries, decoding each with split9BitsFromBitfield_8021AE0
  (9-bit chip id from a u16 bitfield) and fetching the ChipData via getChip8021DA8; ChipData field +7 is the element
  byte. Increments a counter whenever the element equals the r0 argument and returns the count. Quirk: r2/r3 are
  left holding whatever getChip8021DA8 left on its final call, and flags are clobbered as a side effect.'
