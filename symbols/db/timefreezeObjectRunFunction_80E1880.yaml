name: timefreezeObjectRunFunction_80E1880
address: '0x080E1880'
kind: function
status: confirmed
summary: Runs the next phase of a time-frozen battle object, dispatching its per-type handler and snapshotting it
  if left in the freeze frame.
interface: 'void timefreezeObjectRunPhase_80E1880(void);

  /* in:  r5 = oBattleObject pointer (live registers r5/lr used as inputs) */

  /* out: r5/r8-r12 returned (handler-dependent); no flags defined */

  /* clobbers: r0-r3, nz c v, lr */

  /* preserves: r4, r6, r7 */

  '
details: "On the first call for an object (oBattleObject_PhaseInitialized == 0), the function\nlooks up a per-type\
  \ handler in the jump table at off_802CD5C using\noBattleObject_Unk_19 as the index, then tail-calls it with:\n\
  \  r0 = oBattleObject_PanelX, r1 = oBattleObject_PanelY,\n  r2 = oBattleObject_Element, r4 = oBattleObject_Params,\n\
  \  r5 = oBattleObject_RelatedObject1Ptr,\n  r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler + oBattleObject_Unk_32,\n\
  \  r7 = obj + 0x18 (the object's state block).\nThe call is a register-direct computed tail-call (mov lr,pc /\
  \ bx r3), with r5\npushed/popped to preserve the object pointer around it.\n\nAfter the handler returns, if oBattleObject_Unk_30\
  \ (a phase counter) lies in\n[0xDD, 0x118] (i.e. `phase - 0xDD <= 0x3B`), the object's key fields are\nsnapshotted\
  \ into the global buffer at 0x203C960:\n  +0.0 = oBattleObject_Unk_19 (byte)\n  +0.1 = oBattleObject_Element (byte)\n\
  \  +0.2 = oBattleObject_Unk_32 (word)\n  +0.4 = oBattleObject_DamageAndStaminaDamageCounterDisabler (dword)\n\
  \  +0.8 = oBattleObject_Params (dword)\nThis snapshot is the \"freeze frame\" captured while a time-freeze object\
  \ is\nfrozen.\n\noBattleObject_PhaseInitialized is then set to 4 to mark the handler as having\nbeen run. If oBattleObject_PreventAnim\
  \ is clear, the object's\noBattleObject_CurPhaseAndPhaseInitialized is set to 0x08 to move it to the next\nphase.\n"
