name: loadGameProgressFromGameProgressBuffer_8035354
address: '0x08035354'
kind: function
status: confirmed
summary: Copies one byte of game-progress data from the save buffer (selected by index in r0) into the live GameState's
  GameProgress field.
interface: void loadGameProgressFromGameProgressBuffer(int slot /* r0 */, Toolkit* toolkit /* r10 */); reads gameProgressBuffer_20010f0[slot],
  writes gameState->GameProgress
details: Indexes gameProgressBuffer_20010f0 (the save/progress staging buffer in IWRAM) by the byte offset passed
  in r0, then resolves the current GameState via toolkit->oToolkit_GameStatePtr (r10 = toolkit pointer) and stores
  the single byte at GameState + oGameState_GameProgress. No bounds check on the slot index; only one byte is transferred
  per call, so callers presumably call it once per progress field. r4-r7 are pushed/popped purely to preserve them;
  lr is the return address. Flags are clobbered by the loads/stores but not used.
