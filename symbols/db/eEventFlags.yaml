name: eEventFlags
address: '0x02001C88'
kind: ram
previous_names: []
status: confirmed
summary: 'Event flag bit array: flag f is byte f >> 3, mask 0x80 >> (f & 7) (TestEventFlag).'
details: 'The label''s span runs up to unk_2002230; 0x02002178 (eEventFlags + 0x4F0) holds the saved folder (runtime,
  vidsync try_hand). Known flag areas (BN6F_SYMBOLS.md): 0x1400+n the mystery-data-taken flags (cleared together
  by clearMysteryDataEventFlags_809FB04, set on pickup, checked by the blue NPC sparkle); 0x1709 bit 7 a ''skip''
  switch the text opcode F0 honors (chatbox_F0_jump); 0x1708 the pending-event flag several loops poll; 0x214 a
  per-map ''interacted here'' flag used by a map object update (sub_80AA78C); 0xBE0..0xBFF the Mr. Weather comp''s
  flags (0xBE1/0xBE2/0xBE3 per-map via sub_80902DC, 0xBE4/0xBE6/0xBFC/0xBFD+ tornado and orb state, 0xBF4+i per
  orb instance via sub_80A9614, 0xBF2 the 0x6x-trigger cutscene''s done flag).'
evidence:
- method: runtime
  date: '2026-10-13'
  detail: The sync driver sets and clears flags at this address with that mapping (e.g. the tornado-caught flags
    0xBE9+i, SneakRun 0x170A at byte 0x02001F69 mask 0x20, LocEnemy 0x170B mask 0x10) and the game reacts as the
    flags say.
  reproduce: grep -n 'EVENT_FLAGS' tools/vidsync/autosync.py
- method: assembly-reading
