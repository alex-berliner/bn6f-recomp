name: owMap_getHotspotBoundaryForMapGroup_80A5724
address: '0x080A5724'
kind: function
previous_names:
- sub_80A5724
status: probable
summary: Returns a hotspot boundary byte pair for a given map group's hotspot region during overworld
  camera hotspot tests.
interface: (r6 = ptr to map group hotspot context, byte at r6+5 = region index) -> r0 = byte from dword_80A573C[region],
  r1 = byte from dword_80A5740[region]
details: "Pure lookup helper used by the rectangular-hotspot test in sub_80A5690.\n  Reads an index byte\
  \ at r6+5, then uses it to index two compressed 4-byte\n  tables (dword_80A573C = 0x180C200C, dword_80A5740\
  \ = 0x0C200C20). Each table\n  packs 4 one-byte values; the helper returns the nth entry of each as\
  \ a\n  parallel (lo, hi or min, max) pair. Callers combine the returned pair with\n  other context (r5/r10\
  \ per sub_80A5690) to decide whether the field camera\n  lies inside the map group's current hotspot\
  \ box. No memory writes; callee-saves\n  only r4, lr. The byte at r6+5 being the index matches the camera/hotspot\n\
  \  per-map-group context the caller iterates; the r6 base is treated as already\n  pointing at the matching\
  \ row, so this is just a per-region fetcher.\n"
