name: SetRenderInfoLCDControl
address: '0x08001778'
kind: function
status: confirmed
summary: Writes a halfword LCD control value (DISPCNT-style) into the current frame's render info struct.
interface: 'void SetRenderInfoLCDControl(u16 lcdControl /*r0*/, r10 = toolkit); out: r1 = toolkit->renderInfo pointer'
details: Loads the render info pointer from toolkit+0x08 (oToolkit_RenderInfoPtr) and stores the halfword from r0
  into renderInfo+0x00 (oRenderInfo_Unk_00), the LCD control field that later gets flushed to REG_DISPCNT during
  the frame update. As a side effect it leaves the render info pointer in r1, which callers appear to rely on (r1
  is a declared output, not just scratch). r10 holds the global toolkit/context pointer; r0 is the LCD control bits
  to apply (e.g. display enable, BG/OBJ layers, forced blank).
