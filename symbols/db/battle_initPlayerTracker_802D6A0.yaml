name: battle_initPlayerTracker_802D6A0
address: '0x0802D6A0'
kind: function
status: confirmed
summary: Initialises the battle's player-tracking block at the start of a battle, caching pointers to the player's
  and enemy's side objects.
interface: void sub_802D6A0(void)
details: 'Clears the global battle tracker block at dword_203C970 for a new battle: zeroes the counter field at
  +0x0, looks up the player''s-side BattleObject with battle_findPlayer(0) and stores it at +0x8 (dword_203C978),
  looks up the enemy''s-side BattleObject with battle_findPlayer(1) and stores it at +0xC (dword_203C97C), then
  sets the byte flag at +0x4 (byte_203C974) to 1. No inputs; only r0-r3 and flags are touched besides the stores.

  '
