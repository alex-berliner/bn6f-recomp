name: object_stepAfterHit
address: '0x080CEF0A'
kind: function
status: probable
summary: 'Shared per-frame tick for a battle object that has just been hit: removes its collision data,
  spawns the hit effect, applies damage, then dispatches to the object''s action handler or destroys it.'
interface: (r5 = battle object) -> void; sets object state to destroy (CUR_STATE_DESTROY) when the battle
  is over or damage application fails
details: Runs on the object in r5. First tears down its collision data (object_removeCollisionData) and
  spawns the jittered hit-effect object (object_spawnCollisionEffect). If the battle is over, or object_applyDamage(0)
  returns negative, it clears the object's collision region and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized.
  Otherwise, unless time-stop is active, it dispatches via a table in off_80CEF4C indexed by oBattleObject_CurAction
  (4 entries at 0x80CEF5C/0x80CEF90/0x80CEFFC/0x80CF030, called with lr=pc so handlers return here); under
  time-stop it instead calls object_presentCollisionData to keep collision state refreshed without acting.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData / object_spawnCollisionEffect at top matches the on-hit teardown+effect
    pattern; mov r0,#0 + bl object_applyDamage, blt loc_80CEF3C routes to destroy on failure; destroy
    path: bl object_clearCollisionRegion; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized];
    ldr r1,[r1,r0] with r0=[r5,#oBattleObject_CurAction] over off_80CEF4C is a 4-entry dispatch on the
    object''s current action; battle_isTimeStop branch falls into object_presentCollisionData, matching
    the callee''s time-stop-aware refresh behavior'
