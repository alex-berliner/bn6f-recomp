name: ai_attackPhaseSubStep
address: '0x08112928'
kind: function
status: probable
summary: 'Per-frame sub-step driver for an AI attack: initializes on first call (sets element=1, plays
  charge SFX 0x1A8, loads ChargeCycles into StepTimer), decrements StepTimer each tick, and on expiry
  either loops back to re-charge (while SubStepIndex < AttackStepIndex) or enters the hit phase by loading
  AttackDuration into StepTimer and setting HitElement=0xC.'
interface: (r0 = unused/scratch, object in r7) -> r0 = 0 or scratch; updates oAIAttackVars fields (AttackElement,
  StepTimer, SubStepIndex, HitElement)
details: 'Runs on an AI battle object whose attack vars are at [r7+oAIAttackVars_*]. When AttackElement==0
  it initializes the attack: element:=1, calls sub_8112968 (probably animation start), plays SFX 0x1A8,
  and copies ChargeCycles into StepTimer. Otherwise it decrements StepTimer; at zero it increments SubStepIndex.
  If SubStepIndex < AttackStepIndex it clears AttackElement so the whole charge (with sound) repeats;
  otherwise it sets StepTimer=AttackDuration and HitElement=0xC, signaling the attack''s damaging phase.
  The 0xC hit element and multi-step loop suggest a repeated charge-then-strike AI attack pattern.'
