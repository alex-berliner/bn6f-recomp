name: sub_80FD822
address: '0x080FD822'
kind: function
status: confirmed
summary: 'Per-frame AI tick: on the first call starts a charging attack (animation + 30-frame countdown), then fires
  the attack every 8 frames and resets when the timer expires.'
interface: void aiChargeTick_80FD822(BattleObject* r5, AIAttackVars* r7); // clobbers r0,r1,r2,r3,lr; preserves
  r4,r6
details: 'Walks the r7 "AIAttackVars" block on a r5 BattleObject. First entry seeds

  Unk_01=4 (charged/active phase), sets oBattleObject_CurAnim=7 (the

  charge pose), and arms Unk_10=0x1E as a 30-frame timer. On later frames

  it tests bit 2 of Unk_10 (carry of `lsr #3`) and, when clear, calls

  sub_80FDCA4 with r0 = Unk_0c — the repeated-attack fire path.

  Each frame decrements Unk_10; once it goes non-positive (BGT means

  decrement reaches 0 or below) it writes 0x14 into Unk_00 so the AI state

  machine returns to its "pick a new action" phase. Return address is

  restored via `pop {pc}` (tail-call pop), so lr is consumed.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
