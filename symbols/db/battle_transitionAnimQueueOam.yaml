summary: Queues the fixed animated OAM entry for the battle transition animation element.
interface: () -> r0 = result of battle_queueAnimatedOamEntry; flags clobbered by callee
details: 'A parameterless wrapper: it sets r0=0x5A, r1=0x20, r2=0x32, r3=0xC and loads the element state
  byte pointer byte_8124A84, OAM attribute word 0x40000000, and buffer pointer dword_8124A94 into r4/r6/r7,
  then calls battle_queueAnimatedOamEntry to queue one sprite for an animated overlay element. All arguments
  are compile-time constants, so the element identity, tile, palette, position and timing live entirely
  in the caller''s data. The 0x40000000 attribute suggests a fixed OBJ mode/flag setting on the transition
  sprite.'
