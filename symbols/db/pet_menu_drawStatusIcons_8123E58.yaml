name: pet_menu_drawStatusIcons_8123E58
address: '0x08123E58'
kind: function
status: confirmed
summary: Draws the PET menu's animated Navi emblem and status icon pair, advancing a frame counter that swaps between
  two frame-table sets every 6 steps.
interface: void pet_menu_drawStatusIcons_8123E58(PetMenuCtx* ctx /* r5 */); preserves r4-r7, returns r5 unchanged;
  clobbers r0-r3, lr, NZCV
details: 'ctx is the PET menu state block: byte +0x14 is a value fed to GetCurPETNaviStatsByte(r0, 0x2D) whose result<<2
  picks the frame word from the icon tables; byte +0x11 is a table-set toggle; byte +0x10 is a step counter counting
  0..5. Each call queues two OAM entries via battleObject_queueOamFromTableRow_811FAF4: first the emblem icon (attr
  mask 0x80004000, OAM table dword_81233BC/dword_81233C4), then the status icon (mask 0x8000, tables dword_81233C0/dword_81233C8);
  fixed args per call are row selector 0x20005 and 0. Two identical 3-frame tables of 4-byte packed row entries
  exist per set (byte_8123EC8/byte_8123EE4 normal, byte_8123F00/byte_8123F1C alternate, same frame values). After
  drawing, the step counter increments; when it reaches 6 the counter resets and the +0x11 toggle flips, swapping
  to the other OAM table set, so the icons animate with a 6-step period per table set. Note "nz c v" in the clobber
  list comes from tst/cmp/eor; the listed r4/r5/r6/r7 preservation is partly the caller''s adapter restoring callee-clobbered
  registers.

  '
