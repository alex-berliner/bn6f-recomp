open_questions:
- Which three NaviStats bytes map to indices 0/1/2 — GetCurPETNaviStatsByte is opaque but emotion/beast-out
  is the most likely byte; would settle by setting the captured r1 values for non-0xff r0 in different
  captured frames.
- Exact meaning of the OAM attr difference 0x80004000 vs 0x8000 (likely which of two stacked sprites is
  the foreground); would settle by tracing battleObject_queueOamFromTableRow_811FAF4.
- Whether SubMenu+0x10/0x11 are documented anywhere; the struct definition only reserves up to 0x50 but
  pet_menu_runFrame callers confirm the layout.
