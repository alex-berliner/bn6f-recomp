name: checkTextScriptEnd_8128BF0
address: '0x08128BF0'
kind: function
status: confirmed
summary: Polls a dialogue object's script byte and, when the "end of script" (0x40) sentinel is reached
  while still drawing, advances the object to state 8 and starts a fast screen fade-out.
interface: void checkTextScriptEnd_8128BF0(void *dialogueObj /* r5 */)  // returns void; preserves r5;
  clobbers r0-r3, lr, N/Z/C/V
details: "R5 points to a dialogue/script object. The function bails early if the\n\"still drawing\" flag\
  \ at +0x1E is zero. Otherwise it indexes the global\nscript table eTextScript201BF00 using:\n    idx\
  \ = ((textIdHi at +0x24) + (textIdLo at +0x20)) * 4 + (speaker at +0xD) * 2\nand reads the resulting\
  \ byte. If that byte is 0x40 (the end-of-script\nsentinel used by the eTextScript table) it writes state\
  \ 8 at +0x2 on the\nobject and calls SetScreenFade(0x0C, 0x10) to begin a fast fade-out so\nthe scene\
  \ can close. Plain \"pop {pc}\" return rather than bx lr.\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
