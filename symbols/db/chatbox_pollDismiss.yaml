open_questions:
- exact role of sub_803CB18(1) — presumably 'text finished / box idle' check on the chatbox
- why the dismiss key is R/L (0x300) rather than A/B — caller context or the game's dialog script would
  confirm
- meaning of the 0x200 status bit to other readers of 0x200BC5C
