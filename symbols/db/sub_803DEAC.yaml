summary: Trivial tail-call wrapper that immediately invokes sub_8144240 and returns its result to the caller.
interface: Next sub_803DEAC(void) — entry with lr as return address; r4-r7 are passed through and preserved by the
  callee; flags (nz c v) clobbered by the callee.
details: The routine pushes r4-r7 and lr, then tail-calls sub_8144240 (the push/pop exist only to satisfy the ABI;
  the call is effectively a jump with the original lr restored implicitly by the callee's contract). It holds no
  state of its own and touches no memory, structures, or game fields. Its purpose is entirely determined by sub_8144240,
  which is not identified here; the wrapper's existence suggests sub_8144240 was reached via a pointer table or
  cross-region call where a distinct entry point (or a future hook) was desired. Register contract confirms callers
  pass values in r4-r7 expecting them preserved across the call, matching sub_8144240's own contract.
