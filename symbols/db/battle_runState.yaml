summary: Dispatches the current battle scene state to one of four handler routines via a jump table.
interface: () -> none; uses byte_2011E40 as state index
details: 'Reads a 1-byte state index from byte_2011E40, indexes into a 4-entry table at off_8038620, and
  tail-calls the selected routine (with the +1 Thumb-bit trick on the stored addresses). The four targets
  are init_battleScene, sub_8038674, battle_waitTimerThenAdvanceState, and sub_80386B2. It is a classic
  state-machine trampoline: each handler is expected to update byte_2011E40 so the next call advances
  the state. The ''r4-r7,lr'' push and ''pop {r4-r7,pc}'' make it a tail call, so no return value or stack
  frame is involved.'
