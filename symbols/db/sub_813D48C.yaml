summary: 'Bug Frag trader tier roll: indexes a table, rolls GetRNG & 0xF and consults byte_813D500 (the tier table,
  all zero — so no special tier adjustment); costs are dword_813D4FC = {10, 20, 30, 50}.'
details: 'Body (asm37_0.s): ldr r4,[r4,r0] (table), bl GetRNG / mov r1,#0xF / and r0,r1, then byte_813D500. The
  item rolls are sub_813D510 / sub_813D568 / sub_813D598 (each GetRNG & 0xF for the item and, in sub_813D510, a
  second & 3 for the code; each re-rolls on a 0xFF result).'
