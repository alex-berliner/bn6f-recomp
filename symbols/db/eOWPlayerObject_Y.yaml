name: eOWPlayerObject_Y
address: '0x02009F60'
kind: ram
previous_names: []
status: confirmed
summary: 'MegaMan''s overworld Y position (eOWPlayerObject +0x20, s16.16: pixels in the high halfword).'
details: 'Field Y of overworld_player_object_struct (include/structs/OverworldPlayerObject.inc:30, loc 0x20) in

  eOWPlayerObject = 0x02009F40 (ewram.s:775), reached through GameState.OverworldPlayerObjectPtr. Integer pixels

  in the high halfword (oOWObjectCoords_Y = 6). Handled together with X everywhere: the movement handlers add the

  step (+0x3C) to it, set it back from NextY when a frame''s move is cancelled, clampPlayerPosition_809E3D6 clamps

  it (or restores it from NextY when it clamps X), and the readers are those of X (ReadOWPlayerObjectCoords,

  owPlayer_isMoving_809DFA0, the collision sweep from NextX/Y to X/Y, the warp''s save on a real-world/internet

  crossing). See eOWPlayerObject_X.

  vidsync (BN6F_SYMBOLS.md, level R): try_relocate writes it at +0x20 with X, NextX and NextY to move MegaMan where

  the video has him; segment junctions write it in the 0x30 bytes from +0x1C; try_position and probes read it.

  '
