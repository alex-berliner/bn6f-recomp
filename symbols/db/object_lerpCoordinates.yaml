name: object_lerpCoordinates
address: '0x080E0348'
kind: function
status: probable
summary: Linearly interpolates a battle object's X/Y between a start and target point by Timer/Duration,
  used for gliding across panels.
interface: (r0 = startX, r1 = startY, r2 = targetX, r3 = targetY, r6 = progress (timer), r7 = total duration)
  -> r0 = interpolated X, r1 = interpolated Y; clobbers r2-r3
details: Computes deltas r2=targetX-startX and r3=targetY-startY, multiplies each by r6 (the caller's
  oBattleObject_Timer), then performs two BIOS divisions (SWI 6, Div) by r7 (the movement duration), keeping
  only the quotients. It saves the original r0/r1 on the stack (push {r0,r1}) since SWI Div clobbers r0-r3,
  and returns startX+dx*timer/duration in r0 and startY+dy*timer/duration in r1. The remainders are discarded.
  The caller stores the results into oBattleObject_X/oBattleObject_Y and refreshes the panel occupancy
  via object_setPanelsFromCoordinates.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub r2,r2,r0 / sub r3,r3,r1 / mul r2,r6 / mul r3,r6: deltas scaled by caller''s ldrh r6,[r5,#oBattleObject_Timer];
    svc 6 twice with r1=r7: BIOS SWI Div (r0/r1), quotient kept, remainder dropped; pop {r0,r1}; add r0,r0,r2;
    add r1,r1,r3: result = start + scaled delta, i.e. lerp; caller 0x080E01C8: ldr target coords from
    ExtraVars+0/+4 and start from +8/+c, then str r0,[r5,#oBattleObject_X]; str r1,[r5,#oBattleObject_Y]
    followed by object_setPanelsFromCoordinates'
