name: rfu_setEntryFlagBit
address: '0x0813D78C'
kind: function
status: probable
summary: ORs the per-index bit mask from a lookup table into the flags word (+0x1C) of a wireless lobby
  entry
interface: (r0 = index into byte_813D7A0 bitmask table, r1 = entry struct ptr) -> r0 = destroyed; entry->0x1C
  |= table[index]
details: Reads a word from the table at byte_813D7A0 using index*4 (table holds single-bit values 1,1,4,0x10,0x40,0x100,...),
  then ORs it into word field +0x1C of the struct at r1. It never clears bits, so it is an accumulate/set-only
  flag setter. Callers invoke it right after rfu_clearSlot with an index byte read from a state struct
  at +1 and an entry pointer from getTableEntryPtr32(0), suggesting per-player/per-slot flags in a wireless
  multiplayer record.
