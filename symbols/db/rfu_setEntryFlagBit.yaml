  date: '2026-10-19'
  detail: 'sub_813D78C: ldr r0,[r2,r0*4] from byte_813D7A0 then orr into [r1,#0x1C] — set bit by index;
    byte_813D7A0 holds power-of-two masks (1,1,4,0x10,0x40,0x100) — one flag bit per index; sub_8147228
    @0x8147266: index from ldrb [r6,#1], ptr from getTableEntryPtr32(0), after rfu_clearSlot; sub_8147E98
    @0x8147ECC: identical pattern, index from [r5,#1], also after rfu_clearSlot'
