    a random index into the sp panel list (0x8102C5A-0x8102C66); lsr #4 / lsl #0x1d+lsr #0x1d split the
    picked panel byte into y (bits 4+) and x (low 3 bits) return values (0x8102C66-0x8102C70); empty list
    triggers sub_8102CC4 and a retry with the second filter entry; second failure returns object fields
