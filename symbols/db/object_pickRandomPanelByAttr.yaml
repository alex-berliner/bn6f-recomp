name: object_pickRandomPanelByAttr
address: '0x08102C38'
kind: function
status: probable
summary: Given an index from object+0x16 selecting one of two 8-byte (required-attr, forbidden-attr) filter
  pairs, scans field panels excluding the object's own and, if any match, returns a randomly chosen matching
  panel's x (low 3 bits) in r0 and y (high nibble) in r1; falls back to the object's stored coordinates
  at +0x12/+0x13 if no panel matches either filter.
interface: (r0 = object entity ptr; r5->0x16 selects filter entry) -> r0 = panel x (bits 0-2 of panel
  byte), r1 = panel y (bits 4+); no flags used
details: 'sub_8102CA0 prepares state, then the byte at object+0x16 indexes byte_8102C90 (8-byte entries:
  required attribute mask + forbidden attribute mask, e.g. req 0x10 / forbid 0x0F8800A0). It fills a stack
  list via object_getPanelsExceptCurrentFiltered with those masks; if any panels match, GetPositiveSignedRNG
  divided by the count (svc 6 = BIOS Div, remainder kept) selects one at random, and its byte is split
  into x (low 3 bits) and y (bits 4-7). If the first filter yields nothing, sub_8102CC4 runs and the second
  mask pair (req 0x30 / forbid 0x0F880080) is retried. If both fail, the object''s own stored coordinates
  at +0x12/+0x13 are returned instead. Likely used by battle AI/movement to choose a destination panel
  of a certain terrain.'
