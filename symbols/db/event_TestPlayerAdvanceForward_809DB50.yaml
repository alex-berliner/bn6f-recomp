    grep -n -A2 ''GUEST_CALL(TestEventFlag'' cport/src/game/*.c   # the sweep for the same mistake

    '
  result: 'before: story4 and story5 diverged (palette from game frame 32905 / 1120); after the fix (recomp 67673ff):
    every route identical, including story4 and story5'
