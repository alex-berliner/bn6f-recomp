name: event_TestPlayerAdvanceForward_809DB50
address: '0x0809DB50'
kind: function
status: confirmed
summary: Returns whether the queued "player advance forward" event request (EVENT_1717_PLAYER_ADVANCE_FORWARD) is
  set, passing the answer through the condition flags.
interface: 'bool sub_809DB50(void) // in: nothing (r10/lr unused); out: Z flag cleared = request pending (R0 nonzero),
  Z flag set = no request (R0 zeroed); R3 passes through untouched'
details: 'Thin wrapper around TestEventFlagFromImmediate for the single event flag EVENT_1717_PLAYER_ADVANCE_FORWARD
  (flag word 0x17, bit 0x17, staged via the movflag pseudo-op). The helper reports its result through the condition
  flags, and this routine does not touch them when the test succeeds, so the caller effectively sees the helper''s
  NZC/V state. If the flag is clear, it falls through and executes "movs r0,#0", which both zeroes R0 and recomputes
  NZ (C and V keep whatever the helper left). Net contract: Z clear means a player-advance-forward request is queued
  and pending; Z set means none. R0 is scratch here, but zeroing it gives callers a clean 0/1-style boolean read;
  R3 is preserved only incidentally (nothing writes it). No memory, structures, or other flags are touched.'
