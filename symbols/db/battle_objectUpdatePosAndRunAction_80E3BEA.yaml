name: battle_objectUpdatePosAndRunAction_80E3BEA
address: '0x080E3BEA'
kind: function
status: confirmed
summary: 'Updates a battle object''s position (once as-is, once after applying its X velocity) through sub_80E3D1A,
  then dispatches to one of two per-action handlers selected by the object''s CurAction byte.

  '
interface: 'void sub_80E3BEA(battle object in r5); clobbers r0-r3, lr (and flags); does not return to this function''s
  caller until the selected action handler returns; handler entered with r0 = CurAction, r1 = its jump-table entry
  (thumb address), r2 = whatever sub_80E3D1A last left there

  '
details: 'r5 is a battle object pointer used throughout. The routine loads oBattleObject_X and oBattleObject_Y and
  calls sub_80E3D1A with them (purpose not fully resolved here — likely a coordinate/transform or sprite-position
  helper whose r2 result passes through untouched). It then loads oBattleObject_XVelocity, adds it to the returned
  r0, and calls sub_80E3D1A a second time, so the position is processed both before and after the horizontal movement
  step. Finally it reads oBattleObject_CurAction (offset 9 in the battle object, a byte) and uses it as an index
  into the two-entry thumb-function table off_80E3C0C: action 0 -> sub_80E3C14, action 1 -> sub_80E3CC4. The dispatch
  uses the classic ARM/THUMB long-call idiom "mov lr, pc / bx r1", so the handler returns back into this function,
  which immediately pops pc and returns to its own caller — the handler effectively runs inline. Because the table
  has only two entries, a CurAction value above 1 would fetch a word past off_80E3C0C and jump to garbage; in practice
  the field is only ever 0/1. Everything except r0-r3/lr (and flags) passes through unchanged to the handler.

  '
