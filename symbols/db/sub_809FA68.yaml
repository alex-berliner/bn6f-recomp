open_questions:
- autosync.py's two-record candidates (the comment "positions are byte 1, one record per position; contents kept")
  vary byte 1 and keep byte 0, which by the code and the data is varying the contents, not the position. The exclusion
  list does make contents indexes unique per map, not positions.
- The meaning of placement bytes 2-5 (coordinates?) and of the contents kinds other than 3 (zenny) was not checked.
- suggested name mysteryData_rollPlacementAndContents_809FA68 (it returns the placement and the contents picks of
  a mystery data record)
