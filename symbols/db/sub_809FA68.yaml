name: sub_809FA68
address: '0x0809FA68'
kind: function
previous_names: []
status: confirmed
summary: Rolls one mystery data record, a weighted pick of its placement and a weighted pick of its contents (contents
  indexes in an exclusion list weigh 0); the green mystery data roll at every jack-in and New Game.
interface: (r0 = placement table or NULL, r1 = contents table, r2 = exclusion list of contents indexes, ended by
  0xFF) -> r0 = placement index (0 when r0 was NULL), r1 = contents index. Preserves r4-r7; r2, r3 and flags clobbered.
  Uses a 0x20-byte weight buffer on the stack. Each pick calls pickWeightedIndex_8000E3A, which advances the primary
  RNG 2 + (rng >> 30) + (iCurrFrame & 3) times.
details: "Both tables are lists of 8-byte entries; byte 0 = 0 ends the list, byte 1 is the entry's weight. For each\
  \ list\nthe weights are copied into the stack buffer (no bound check: more than 32 entries would overrun it) and\n\
  pickWeightedIndex_8000E3A(buffer, count) returns the index.\n- Placement pass, skipped when r0 is NULL (the result\
  \ is then 0). In the mystery data tables the entries are\n  `01 20 xx xx yy yy 00 00`: weight 0x20, and bytes\
  \ 2-5 look like two signed 16-bit coordinates\n  (e.g. 0xFF86, 0xFEFA).\n- Contents pass over r1's table: an entry\
  \ whose index appears in the r2 list gets weight 0, the others their\n  byte 1. In the contents tables byte 0\
  \ is the item kind (seen: 1, 3 with a zenny amount at +4, 5).\nCallers:\n- mysteryData_processMapGroups_809F9DC\
  \ (asm28_1.s:62), for each type-5 record (12 bytes: type, u16 id,\n  placement table at +4, contents table at\
  \ +8) of each internet map: r2 is a 16-byte 0xFF-filled list per map\n  to which each record's contents pick is\
  \ appended, so two records of one map never get the same contents\n  index. sub_809FACE then stores the pair at\
  \ eMysteryDataRolls + 2*(id - 0x1400): byte 0 = placement,\n  byte 1 = contents. That roll runs from initNewGameData_8004DF0\
  \ (asm00_1.s:4144) and\n  resetPetNaviSetup_8033FDC (asm03_1_0.s:1080), which vidsync observes at every jack-in.\n\
  - sub_809FD70 (asm28_1.s:622), the gold mystery data roll: r0 = 0 (no placement), r1 = the chosen gold\n  record's\
  \ table, r2 an all-0xFF list; it keeps only r1 (byte_2000210+2).\n"
