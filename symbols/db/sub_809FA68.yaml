- method: runtime
  date: '2026-10-13'
  detail: 'vidsync''s sync driver, mystery data handler (try_gmd): for each green record of the map it counts the
    record''s +4 and +8 tables the way this function walks them (8-byte entries until byte 0 is 0, gmd_records),
    and writes each pair x | y << 8 (x < count of the +4 table, y < count of the +8 table) to the record''s eMysteryDataRolls
    halfword just before the map is entered, keeping a write only when the sync then matches the video for hundreds
    of frames. Kept fixes (runs run7y, run8j, see eMysteryDataRolls) show that these two bytes, the picks this function
    returns, decide what the map shows. The driver does not re-run the weighted picks themselves.'
  refs:
  - tools/vidsync/autosync.py:383
  - tools/vidsync/autosync.py:407
  - tools/vidsync/autosync.py:830
  - tools/vidsync/autosync.py:868
  - eMysteryDataRolls
