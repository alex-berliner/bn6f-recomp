name: STWI_set_Callback_M
address: '0x0814C360'
kind: function
status: confirmed
summary: Registers the callback function the wireless (STWI) library calls when an incoming message/event arrives.
interface: void STWI_set_Callback_M(void (*callback)(void)) // r0 = callback pointer; returns nothing, clobbers
  r1
details: Loads the pointer to the STWI library work area from the global dword_2010CCC, then stores the caller-supplied
  function pointer at offset 0x18 of that struct (the message-arrival callback slot). Nothing else is touched; the
  previous callback is silently overwritten with no way to read it back. Part of the AGB wireless library's STWI
  API (same naming convention as STWI_set_Callback_S).
