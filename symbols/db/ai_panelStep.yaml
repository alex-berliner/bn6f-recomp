- which entities use this and what the alliance-indexed callbacks at byte_80F5090 choose
- The function does match the proposal's described logic — see AttackElement init at 0x080F5034, panel-choose
  callback dispatch at 0x080F504A, reservePanel/anim=4/HasMoved=1/sub_80F57DE/StepTimer=3 at 0x080F5056-0x080F5070,
  and StepTimer countdown + HitElement=4 at 0x080F5072-0x080F507C. However it is not specifically a leap;
  the ASCII pointer table byte_80F5090 (e.g. '0x88,0x0F' = 0x080F8810) holds two-word callback structs
  per alliance, and CurAnim=4 alone doesn't confirm 'leap'. The 'Step' prefix in the proposed name conflates
  with the StepTimer counter, so 'ai_panelStep' better fits the actual behavior.
