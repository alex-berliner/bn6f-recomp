  - 0x0800E5E2 object_canMove
  - 0x0801BB1C object_reservePanel
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080F5028
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function does match the proposal''s described logic — see AttackElement init at 0x080F5034,
    panel-choose callback dispatch at 0x080F504A, reservePanel/anim=4/HasMoved=1/sub_80F57DE/StepTimer=3
    at 0x080F5056-0x080F5070, and StepTimer countdown + HitElement=4 at 0x080F5072-0x080F507C. However
    it is not specifically a leap; the ASCII pointer table byte_80F5090 (e.g. ''0x88,0x0F'' = 0x080F8810)
