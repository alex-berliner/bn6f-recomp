name: ai_panelStep
address: '0x080F5028'
kind: function
status: probable
summary: AI attack step that, on first call, picks a target panel via an alliance-indexed callback (from
  byte_80F5090), reserves it, sets CurAnim=4 and CANNOT_SLIDE, calls sub_80F57DE, and arms StepTimer=3;
  on later calls decrements StepTimer and stores HitElement=4 when it reaches 0.
interface: (r0-r3 scratch; r5 = battle object ptr, r7 = oAIAttackVars block) -> r0 = undefined; sets HasMoved/StepTimer/HitElement
  in the AI vars
details: On the first invocation (AttackElement == 0) it marks the attack started by storing element 4,
  checks object_canMove, then indexes byte_80F5090 by alliance*8 to get a two-word callback pointer and
  calls it with the target object ptr and the panel-choose callback from oAIAttackVars_PanelChooseCallback.
  If the callback returns nonzero x/y panel coords (r0/r1), they are stored to oBattleObject_FuturePanelX/Y,
  object_reservePanel claims the panel, OBJECT_FLAGS_CANNOT_SLIDE is set on the object, the anim is set
  to 4, HasMoved=1, sub_80F57DE is called (probably to start the movement/effect), and StepTimer is set
  to 3. On subsequent frames it just decrements StepTimer, and when it reaches 0 sets oAIAttackVars_HitElement
  = 4 to apply the element on hit. If the object couldn't move or no panel was chosen, HasMoved=0 and
  object_exitAttackState aborts the attack.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: byte_80F5090 is a table of function pointers indexed by Alliance<<3, called via 'mov lr,pc;
    bx r1' with TargetObjectPtr and PanelChooseCallback; returned r0/r1 are stored straight into oBattleObject_FuturePanelX/Y
    and passed to object_reservePanel; OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1 and anim 4 indicate
    the object commits to a leap/lunge; StepTimer=3 then per-frame decrement ending in HitElement=4 is
    the standard AI-attack windup→hit pattern; failure paths call object_exitAttackState after clearing
    HasMoved
