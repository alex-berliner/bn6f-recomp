name: clearStatusBits
address: '0x0803CB0C'
kind: function
status: probable
summary: clears the caller-supplied bit mask in the status/flag word at 0x200BC5C
interface: (r0 = bit mask of flags to clear) -> r0 = clobbered? (not preserved, but not returned); no
  flags; writes [0x200BC5C] &= ~r0
details: Loads the pointer to the struct at 0x200BC50, reads the word at offset 0xC (dword_200BC5C), clears
  every bit set in r0 via BIC, and stores it back. It is a generic bit-clear helper for that flag word;
  the six callers around 0x8039xxx-0x803Cxxx each pass a mask, so 0x200BC5C is some shared status/flag
  register for that subsystem. r0's value is consumed, not returned. No other fields of the struct are
  touched.
