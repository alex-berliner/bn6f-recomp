name: battle_initJump
address: '0x080DBD10'
kind: function
status: probable
summary: Spawn-time initializer that re-anchors the battle object's panel position, sets up a jump arc
  (Y rise + Z/X velocities selected by Param2), loads its sprite/animation/palette, and enters the update
  state.
interface: (r5 = battle object) -> r0 = new state value stored; object placed on panel, velocities/animation/palette/flip
  set, SFX 0xC4 played
details: 'Recomputes the object''s pixel X/Y from its panel coordinates, then shifts X backward by facing*0x860000
  and Y up by 0x100000 (fixed-point). It reads oBattleObject_Param2 as a word offset into two tables:
  byte_80DBD8C for ZVelocity (entries 0x60000 and 0xE0000) and byte_80DBD98 for XVelocity multiplied by
  the front direction (entries 0xA0000 and 0x118000), giving two jump-strength variants. It loads sprite
  resource 0x80 with args 12/0x62, disables the shadow, sets object flag bit 1, resets CurAnim to 0 and
  reloads animation data, sets palette 0, applies the alliance/flip-facing to the sprite, plays SFX 0xC4,
  and finally writes CUR_STATE_UPDATE into the state field so the object starts its normal update loop.
  The jump tables imply Param2 must be 0 or 4 (word-aligned), selecting a weak vs. strong hop.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels then X -= front*0x860000, Y += 0x100000: spawn-time placement
    relative to its panel; ZVelocity = byte_80DBD8C[Param2] and XVelocity = front * byte_80DBD98[Param2]:
    sets an arcing jump from a two-entry variant table; sprite_load(0xc, 0x62, 0x80) + sprite_noShadow
    + anim/palette/flip setup: full spawn-time visual initialization; PlaySoundEffect(0xc4): a distinct
    spawn/launch sound effect; str #CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized:
    hands the object to its update phase'
  refs:
  - bn6f/asm/asm31.s:77472
  - 0x080005CC PlaySoundEffect
  - 0x0800E456 object_getFlip
  - 0x0800E2CA object_getFrontDirection
  reproduce: python3 tools/asmcat.py 0x080DBD10
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s mechanics match the code: object_setCoordinatesFromPanels, X shifted backward by
    0x860000*frontDir, Y raised by 0x100000, Param2 indexing into ZVelocity/XVelocity tables, sprite_load
    0x80 with args 0xC/0x62, sprite_noShadow, flag bit 1 set, anim 0 reloaded, palette 0, sprite_setFlip
    via object_getFlip, PlaySoundEffect 0xC4, CUR_STATE_UPDATE written. However ''battle_initHopper''
    is misleading: a ''hopper'' suggests hopping between panels, but this function places the object on
    its current panel and launches it into a jumping arc—it is an in-state spawn/initialize, not a panel-hopper.
    A simpler ''battle_initHop'' or ''battle_initJumpArc'' captures the intent without the wrong connotation.;
    run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
