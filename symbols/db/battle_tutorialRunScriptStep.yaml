name: battle_tutorialRunScriptStep
address: '0x080272D0'
kind: function
status: probable
summary: 'Executes one two-byte step of the first-battle tutorial script: run a tutorial chatbox script,
  wait a fixed timer, or write a byte into the player''s NaviStats.'
interface: (r4 = ptr to current tutorial opcode {u8 cmd, u8 arg}, r5 = tutorial controller struct) ->
  updates r5+0x40 instruction pointer / r5+0x2 next-state; r0 clobbered
details: This is one dispatch handler of the battle-tutorial state machine. The controller struct at r5
  holds the instruction pointer at +0x40 (advanced by 2 after non-terminal commands), a next-state/action
  code at +2 (8 after a script, 0xC after the wait, 0x10 for the unknown/default opcode which appears
  to end or abort the step), a tutorial-archive selector at +0xC used to index the TextScriptFirstBattleTutorials
  pointer array, and a countdown at +0x44 set to 0x50 (80 frames) for the wait command. Opcode 0 runs
  chatbox_runScript on the selected tutorial archive with the operand as script index; opcode 1 just sets
  the wait state and timer; opcode 2 passes its operand and the byte at BattleState+0xD to battle_setPlayerNaviStatsField0E,
  i.e. it patches a per-side player NaviStats byte mid-tutorial.
