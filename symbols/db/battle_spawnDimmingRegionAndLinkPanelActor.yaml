  << 8) | 2 = 0x2402 is correct, but the proposal describes r4=0x2402 as ''object type 0x24, subtype 2'',
  while battle_spawnLinkedObject_80E1A6A actually spawns a type-0x11 battle object per its signature,
  and 0x2402 here is the link/slot ID passed to that callee, not an object type. Also the y-coord extraction
