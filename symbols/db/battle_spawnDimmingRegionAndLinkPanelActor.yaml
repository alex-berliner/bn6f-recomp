name: battle_spawnDimmingRegionAndLinkPanelActor
address: '0x080E621C'
kind: function
status: probable
summary: Spawns a timestop-proof dimming collision region on a panel of the parent battle object inheriting
  its damage-counter-disabling flag, then if an alive opposing actor stands on that flagged panel, spawns
  a type-0x11 battle object linked (slot 0x2402) to that actor.
interface: (r0 = packed panel coords, x = r0&7, y = r0>>4; r5 = parent battle object) -> r0 = linked spawned
  object (or stale r0); no meaningful flags guaranteed
details: The input byte is split into a 3-bit x and the high bits as y. It calls object_spawnDimmingCollisionRegion
  with r2=r3=0, the literal 0x19050601 as region parameters, the parent object, and the parent's oBattleObject_DamageAndStaminaDamageCounterDisabler
  field, so the region inherits the parent's damage-counter-disabling behavior and keeps running during
  timestop. It then re-loads the split coords and the parent's oBattleObject_Alliance, and calls ifPanelFlagSetFindBattleActorWithCollisionOnPanelXY_80E7486
  to find an opposing/alive actor standing on that panel only when the panel has the required flag bit.
  If an actor is found (beq skips on no match), it sets r4=0x2402 (object type 0x24, subtype 2) and r7=0
  and calls battle_spawnLinkedObject_80E1A6A to spawn an object cross-linked to the found actor so the
  caller can track it. The function returns immediately otherwise.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: lsr/lsl of r0 splits input into x (r0&7) and y (r0>>4) panel coords, reused after the spawn
    call via pop {r0,r1}; bl object_spawnDimmingCollisionRegion with r4=dword_80E6250 (0x19050601) and
    r6=[r5,#oBattleObject_DamageAndStaminaDamageCounterDisabler] shows the region inherits parent's disabler
    state; ldr r2,[r5,#oBattleObject_Alliance] + bl ifPanelFlagSetFindBattleActorWithCollisionOnPanelXY_80E7486
    finds an actor on the flagged panel; mov r4,#0x24; add r4,#2; bl battle_spawnLinkedObject_80E1A6A
    spawns a type-0x24 subtype-2 object linked to the found actor; beq locret_80E624C skips the spawn
    when no actor is found on the panel
  refs:
  - bn6f/asm/asm31.s:100466
  - 0x080E619E sub_80E619E
  - 0x080E1A6A battle_spawnLinkedObject_80E1A6A
  - 0x080E7486 ifPanelFlagSetFindBattleActorWithCollisionOnPanelXY_80E7486
  - 0x080C53A6 object_spawnDimmingCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080E621C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The name and overall behavior are correct, but the r4=0x2402 in the proposal is wrong: it''s r4
    = (#0x24 << 8) | 2 = 0x2402 is correct, but the proposal describes r4=0x2402 as ''object type 0x24,
    subtype 2'', while battle_spawnLinkedObject_80E1A6A actually spawns a type-0x11 battle object per
    its signature, and 0x2402 here is the link/slot ID passed to that callee, not an object type. Also
    the y-coord extraction is r0>>4 then masked to 3 bits by lsr #0x1d after lsl #0x1d, so y is 0-7, matching
    panel coords.; run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
