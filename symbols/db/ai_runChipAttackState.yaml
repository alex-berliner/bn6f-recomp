name: ai_runChipAttackState
address: '0x080EBD9C'
kind: function
status: probable
summary: Enemy-AI attack state handler that fires the AI's chip attack (via a per-difficulty handler)
  and queues the chip's battle-effect spawn, then transitions to exiting the attack state.
interface: (r0 = unused on entry, r5 = battle object ptr, r7 = oAIAttackVars ptr) -> r0 = 1 stored to
  oAIAttackVars_AttackElement; no return value used
details: 'Two-phase state machine keyed on oAIAttackVars_AttackElement: while 0, it loads Damage/AttackBoost2/AiDifficultyTier/InitFlag/AttackBoost/ChipID
  from the AI attack vars and dispatches through off_80EBDF8 (= off_802CCB4 indexed by tier<<2), a per-difficulty
  AI routine, passing PanelX, PanelY, InitFlag and AttackBoost<<16 | ChipID with a long-call (lr=pc).
  After it returns, it looks up the alliance''s byte_203CF00 entry and, if the +8 field is zero, calls
  battle_queueEffectRequest(alliance, chipID>=0x170 ? 1 : 0, chipID) — the 0x170 threshold likely picks
  the version-exclusive chip effect variant — then sets AttackElement = 1. On later invocations (element
  nonzero) it calls object_exitAttackState to leave the attack. The entry+8 check prevents queueing a
  duplicate effect request.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; bne -> object_exitAttackState: nonzero element means
    attack already done, exit state; off_80EBDF8 table indexed by AiDifficultyTier<<2 with lr=pc long
    call: per-difficulty AI attack routine off_802CCB4; byte_203CF00_getEntryPtr_800BF5C on oBattleObject_Alliance
    + tst of entry+8: only queue effect when none active; cmp chipID with 0x170 selecting r1 for battle_queueEffectRequest:
    version-split chip effect choice; strb r0(1),[r7,#oAIAttackVars_AttackElement] after queueing: one-shot
    latch for the state'
