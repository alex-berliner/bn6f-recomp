name: FindOpponentPanelXYForThunderObject
address: '0x080C95EC'
kind: function
status: confirmed
summary: Finds the grid panel of an opponent reachable by a thunder-effect object's horizontal attack sweep, choosing
  the primary sweep direction based on the object's alliance/side and DirectionFlip flag with the opposite direction
  as a fallback.
interface: 'void* r5 /* oBattleObject */ in; uint8_t r5+oBattleObject_Alliance, r5+oBattleObject_DirectionFlip in;
  int* r6 /* out: panel x */, int* r7 /* out: panel y */ inout (0 = none); clobbers r0, r1, r2, r3, r4 (sides: 0x4000000
  vs 0x8000000 passed to helpers), lr'
details: "Reads the object's alliance byte and selects an attack-side mask (0x4000000 when alliance==0, otherwise\
  \ 0x8000000) that is handed to the helper routines in r4.\nDirection priority is determined by XOR of alliance\
  \ and DirectionFlip:\n  - (alliance ^ flip) == 0 -> sweep right first, then left\n  - (alliance ^ flip) != 0 ->\
  \ sweep left first, then right\nEach helper is CheckIfThunderObjectFindsOpponentByGoing{Right,Left}; they report\
  \ the discovered panel coordinates in r6 (x) / r7 (y), with r6 == 0 signalling \"no opponent found\".\nFunction\
  \ returns r0 = r6, r1 = r7; r4, r6, r7 are restored to caller-saved values on exit.\nTouched structures: oBattleObject\
  \ at fields oBattleObject_Alliance and oBattleObject_DirectionFlip.\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
