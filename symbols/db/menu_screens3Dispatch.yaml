name: menu_screens3Dispatch
address: '0x08129598'
kind: function
status: probable
summary: 'Dispatches the menus3 screen state machine: calls the conditional sprite draw for nonzero states,
  then jumps to the step handler selected by the state byte.'
interface: (no args; context in r5, state byte at [r5+2]) -> tail-calls handler for state; never returns
  to caller normally
details: Reads the state byte at [r5+2]; if nonzero, first calls sprite_drawIfFlagSet_812B504, which draws
  the screen's sprites only when bit 4 of [r5+0x1B] is set. It then indexes off_81295B4 with the same
  byte and does a thumb call (lr=pc; bx r0) to one of 9 handlers, so it effectively tail-jumps and never
  returns here. State 0 maps to menu_runScreens3Step_81295D8; states 5, 6 and 7 all map to the same sub_8129C28,
  so those states are equivalent or unused. The context struct (r5) thus has a state field at +2 and a
  sprite flag byte at +0x1B.
