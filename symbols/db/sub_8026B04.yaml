name: sub_8026B04
address: '0x08026B04'
kind: function
status: hypothesis
summary: Drives the tile-animation/wipe state of a battle custom-menu object, scrolling tiles and the camera, then
  transitions to either the wait-selection or trigger-selection phase.
interface: void sub_8026B04(u32 self /* r5 */, u32 toolkit /* r10 */, u32 r4, u32 r6 /* forwarded into sub_8029C08
  */); clobbers r0 r1 r2 r3 r8 r9 r11 r12 lr, flags
details: 'Operates on an object whose base is in r5 (referencing fields `0x40`, `0x44`, `oS20364C0_Unk_02`, `oS20364C0_Unk_0c`,
  `oS20364C0_JumpOffset01`); the toolkit `oToolkit_RenderInfoPtr`, `oToolkit_CameraPtr`, `oToolkit_BattleStatePtr`
  are read via r10. On the first entry with `Unk_02 == 0`, it plays sound `SOUND_SELECT_79`, writes 0x78 into `RenderInfo+0x18`
  and `self+0x40`, calls `sub_801E71C`, `dispatch_801DACC(0x80)`, `sub_801E0A0(0xF, 0)`, sets `self+0x44 = 0xF`,
  and stashes 0x78 in `self+oS20364C0_Unk_02`. The render loop walks `((4 & progress) >> 2) + 1` rows worth of a
  0x14-column tilemap (stride 0x1e) sourced from `unk_2035000`, writing each tile id via `bgmap_WriteTileIdAtBlock_800187C`.
  When battle mode is not 1, it subtracts 0x18000 from `Camera+0x34`. On completion (`progress == 0`), if `BattleState+0x07
  == 1` it calls `RetrieveAndRenderEnemyVirusNamesInBattle_801E574`, else it damages both players at 1 HP via `battle_damagePlayerLeave1HP_8013FD0`.
  It then picks the next state: `Unk_0c == 0xFF` -> JUMP_OFFSET_WAIT_SEL (4); `Unk_0c != 5` -> JUMP_OFFSET_TRIGGER
  (0x2C); `Unk_0c == 5` with `BattleState+7 >= 5` -> WAIT_SEL, otherwise TRIGGER. Ends by invoking `sub_8029C08`
  and returning. Sub_8029C08 consumes r4/r6 (caller-saved), which is reflected in the interface.'
