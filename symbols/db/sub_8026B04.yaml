summary: CustMenu tick that drives a per-frame tile animation downward from 0x78 across four chip slots, then either
  chains into an enemy-virus/player-damage side effect, sub_802728C or the custMenuUpdateWaitSelectionState_8026CCC
  waiting state.
interface: () -> () (void-ish; callee-saves preserved); only side effects are writing to S20364C0 (at oS20364C0_Extra_Unk_40/0x44
  and Unk_02), RenderInfo+0x18, Camera+0x34, eStruct2035280+0x17, IO regs via chatbox sub_POI/dispatch_801DACC,
  BG tile map via bgmap_WriteTileIdAtBlock_800187C, audio via PlaySoundEffect, S2035280+0x17 via sub_801E71C, and
  Sound via GetBattleMode.
details: "- Acts on the S20364C0 custMenu state pointed to by r5.\n  - First-time entry (Unk_02 == 0): plays SOUND_SELECT_79,\
  \ sets the render-info flag at +0x18 to 0x78, zeros eStruct2035280+0x17 via sub_801E71C, dispatches 0x80 via dispatch_801DACC,\
  \ sets chatbox pair (0xF, 0) via sub_801E0A0, seeds Unk_44 = 0xF and Unk_40 = 0x78, then writes 0x78 to Unk_02\
  \ so subsequent ticks skip the init.\n  - Each tick: recompute Unk_40 -= 0xC, then walk 1..4 blocks of 0x14 tile\
  \ rows for each of 3 columns, planting the (Unk_40 - 1) tile id at BG map coords using bgmap_WriteTileIdAtBlock_800187C;\
  \ r4 walks a 0x1E-stride table at unk_2035000 off of Unk_44 (treating it as a sequenced tile-set list).\n  - Calls\
  \ GetBattleMode; in non-mode-1, slides Camera+0x34 -= 0x18000 (camera pan).\n  - Stores updated Unk_40 back into\
  \ RenderInfo+0x18 and calls sub_801E71C(0x78 - Unk_40).\n  - When Unk_40 reaches 0x00: if BattleState+0x07 ==\
  \ 1, runs RetrieveAndRenderEnemyVirusNamesInBattle_801E574; otherwise calls battle_damagePlayerLeave1HP_8013FD0\
  \ twice (0 and 1), then branches on Unk_0c: 0xFF or Unk_0c == 5 and BattleState+7 < 5 → JumpOffset01 := 4 (custMenuUpdateWaitSelectionState_8026CCC\
  \ chain) with Unk_02 := 0; else JumpOffset01 := 0x2C (sub_802728C chain) with Unk_02 := 0.\n  - Always finishes\
  \ by tail-calling battleObject_chipSelectAnimTick_8029C08.\n  - Self rep is `* S20364C0 $r5`; toolkit via $r10.\n\
  evidence: |\n  - `ldrb r0, [r5,#oS20364C0_Unk_02]; cmp r0,#0; bne loc_8026B38` is the first-tick guard (asm asm03_0.s:911).\n\
  \  - `mov r0,#SOUND_SELECT_79; bl PlaySoundEffect` and `ldr r1,[r1,#oToolkit_RenderInfoPtr]; ... strh r0,[r1,#0x18]`\
  \ set the render flag.\n  - `mov r0,#0; bl sub_801E71C` followed later by `mov r0,#0x78; sub r0,r0,r1; bl sub_801E71C`\
  \ shows sub_801E71C is a one-byte sink at eStruct2035280+0x17 used as a chip-select countdown.\n  - `mov r0,#0x80;\
  \ bl dispatch_801DACC` and `mov r0,#0xf; mov r1,#0; bl sub_801E0A0` set up chatbox/0x80 dispatcher.\n  - `ldr\
  \ r0,[r5,#0x40]; sub r0,#0xc; ... and r6,r0,#4; lsr r6,r6,#2; add r6,#1` plus `mov r7,#0x14; loc_8026B5A:` loops\
  \ count = (Unk_40 & 4)>>2 + 1 and width 0x14, calling `bgmap_WriteTileIdAtBlock_800187C` with `r4` from `unk_2035000\
  \ + Unk_44*1` advancing by 0x1E per row.\n  - `ldr r4, off_8026DAC // =unk_2035000` and `sub r0,#1; ... lsl r0,#1;\
  \ add r4,r4,r0` indicate a halfword-indexed table of three-column x 0x1E stride.\n  - `bl GetBattleMode; cmp r0,#1;\
  \ beq loc_8026B8C` then `ldr r2,[r2,#oToolkit_CameraPtr]; ldr r1,[r2,#0x34]; ldr r3,dword_8026CC8 // =0x18000;\
  \ sub r1,r1,r3; str r1,[r2,#0x34]` — only the camera-Y is shifted in non-mode-1.\n  - `ldrb r0,[r0,#oBattleState_Unk_07];\
  \ cmp r0,#1; bne loc_8026BB6` branches between virus-names render vs double damagePlayerLeave1HP_8013FD0.\n  -\
  \ `ldrb r0,[r5,#oS20364C0_Unk_0c]; cmp r0,#0xff; beq loc_8026BE0` and `cmp r0,#5; bne loc_8026BD6` gate the post-countdown\
  \ terminal state to either sub_802728C (JumpOffset01=0x2c) or custMenuUpdateWaitSelectionState_8026CCC (JumpOffset01=4),\
  \ per the `// 0x00: trigger ...` comments in the disassembly.\n  - `bl battleObject_chipSelectAnimTick_8029C08\
  \ // (self: * S20364C0 $r5)` is the tail at loc_8026BE8.\n"
