  date: '2026-10-14'
  detail: '- `ldrb r0,[r5,#0x2]` (`oS20364C0_Unk_02`) `cmp r0,#0; bne loc_8026B38` -> the first block runs once,
    the rest is per-frame. - `mov r0,#SOUND_SELECT_79 ; bl PlaySoundEffect` (0x8026B12) and `strh 0x78,[r1,#oToolkit_RenderInfoPtr+0x18]`
    tie an audio cue to a render-info field write. - `sub_801E71C(0)` then `dispatch_801DACC(0x80)` then `sub_801E0A0(0xf,0)`
    is the standard reset-chatbox trio seen elsewhere in the cust menu flow. - `mov r0,#0xf ; str r0,[r5,#0x44]
    / mov r0,#0x78 ; str r0,[r5,#0x40] / strb r0,[r5,#0x2]` sets a 15-step inner counter and a 0x78 frame outer
    countdown. - Inner loop reads `ldrh r3,[r4]` from `off_8026DAC -> unk_2035000` plus `#0x1e` row stride, three
    columns (`r2=3`), `0x14` rows (`r7=0x14`), so it redraws a 3x20 tile slice of the HP/element bar. - `sub r0,#0xc
    ; push {r0,r4,r6,r7} ... bl GetBattleMode ; cmp r0,#1` -> non-battle-mode path adds `-0x18000` to camera Y (`ldr
    r3,dword_8026CC8 ; sub r1,r3`) producing the upward pull-back camera move during the countdown. - When the count
    expires the function consults `BattleState->Unk_07` (`ldrb r0,[r0,#7]`) to choose between rendering virus names
    (real battle) and dealing two 1-HP leave-one scratches (non-real battle). - The selection between transition
    to `0x2c`/state 0 and `4`/state 0 (`mov r0,#0x2c strb r0,[r5,#0x1] / mov r0,#4 strb r0,[r5,#0x1]` and `mov r0,#0
    strh r0,[r5,#0x2]`) is the dispatcher cue to `custMenuMainMaybe_8026A88` calling either sub_802728C or custMenuUpdateWaitSelectionState_8026CCC.
    - Final `bl battleObject_chipSelectAnimTick_8029C08` is shared with adjacent cust-menu update functions.'
