open_questions:
- Whether the 0x78/0xC countdown tracks HP pixels or just a generic fade; certainty would require unk_2035000's
  tile layout and its consumer in VRAM.
- What `self->Unk_0c` (0xff vs 5 vs other) really represents — likely "remaining battles in the row" or similar
  cust-screen counter — but the struct hint only labels it `Unk_0c`. Tracking how sub_802728C and custMenuUpdateWaitSelectionState_8026CCC
  handle Unk_JumpOffset01 would confirm which side of the branch is "you lost all HP" vs "OK to proceed".
