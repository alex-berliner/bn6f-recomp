address: '0x08026B04'
kind: function
previous_names: []
status: hypothesis
summary: Cust-menu animation tick that pulses the player's HP-bar/value and either finalises the chip-select or
  jumps to the next menu phase (Lose or WaitSelect) based on the player's HP remaining.
interface: '(r5 = *S20364C0 self) -> ; side effects: sounds, chatbox state, BG tile draws at unk_2035000, camera
  Y, render info, state writes into S20364C0 and the battle state'
details: "Walk-through of the only entry path (Unk_02 == 0):\n    * Plays SOUND_SELECT_79 and primes render-info+0x18\
  \ with 0x78.\n    * Clears the chatbox via sub_801E71C(0), runs dispatch_801DACC(0x80), then sub_801E0A0(0xf,0).\n\
  \    * Initialises self counters: Unk_44=0xf, Unk_40=0x78, Unk_02<-1.\n  Frame loop (loc_8026B38..loc_8026BC2):\n\
  \    * Computes countdown slot = (Unk_40-0xC) & 4 / 4 + 1 (so 1..4), iterates a small inner loop writing tile\
  \ ids taken from unk_2035000 via bgmap_WriteTileIdAtBlock_800187C three tiles wide, 0x14 rows tall.\n    * Decrements\
  \ Unk_44 each outer iter; the BG seems to be the HP/element bar at unk_2035000.\n    * Decrements Unk_40 by 0xC\
  \ each frame and, in non-battle-mode-1, slides camera Y by -0x18000.\n    * When Unk_40 reaches 0, refreshes render-info+0x18\
  \ and sub_801E71C(0x78-Unk_40_pre), i.e. tracks the new count.\n  Once the pull-back ends:\n    * If BattleState->Unk_07\
  \ == 1 (real battle): re-render virus names via RetrieveAndRenderEnemyVirusNamesInBattle_801E574.\n    * Else:\
  \ scratch two 1-HP damage hits to the player via battle_damagePlayerLeave1HP_8013FD0 (two calls, args 0 then 1).\n\
  \    * If self->Unk_0c != 0xff and Unk_0c != 5 (or BattleState->Unk_07 < 5), jump to Unk_JumpOffset01 = 0x2c with\
  \ state 0 (trigger sub_802728C). Otherwise jump to Unk_JumpOffset01 = 4 with state 0 (trigger custMenuUpdateWaitSelectionState_8026CCC).\n\
  \    * Finally runs battleObject_chipSelectAnimTick_8029C08.\n  Observable effect: a 0x78-tick countdown that\
  \ visually drains a HP bar (0x78/0xC frames spread across 4 tile rows from unk_2035000) and either ends in \"\
  you can still fight\" (jump to the redraw names path + selection state) or \"you're dead / reward lost\" path\
  \ (another jump + chip-menu damage ticks).\n"
