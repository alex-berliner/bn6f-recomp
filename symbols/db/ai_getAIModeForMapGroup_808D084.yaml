name: ai_getAIModeForMapGroup_808D084
address: '0x0808D084'
kind: function
status: confirmed
summary: Returns the AI mode to use for the current map group — 3 for special map group 0x85, otherwise the AI-mode
  byte stored in the game state.
interface: u32 ai_getAIModeForMapGroup(Toolkit* r10); reads r10, returns r0; clobbers r1 and NZCV flags
details: 'Follows the toolkit''s GameState pointer (r10 + oToolkit_GameStatePtr) and reads the current

  map group (oGameState_MapGroup). If the map group is 0x85 (a special/undernet-style area),

  the function returns the fixed AI mode 3; otherwise it returns the byte at gamestate+5,

  which callers treat as the current AI mode setting. r10 is used directly as the toolkit

  register (not r0 as is more common for toolkits), so callers pass the toolkit in r10.

  The game-state AI-mode byte at offset 5 is presumably written when the mode is changed

  elsewhere; this function only reads it.

  '
