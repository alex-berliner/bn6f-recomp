status: probable
summary: Returns the AI mode selector for the current map group (3 for map group 0x85, otherwise MapNumber
  byte).
interface: () -> r0 = AI mode index (3 if MapGroup==0x85, else oToolkit_GameStatePtr->MapNumber)
details: "Loads r10 (toolkit) and dereferences the GameStatePtr at oToolkit_GameStatePtr (offset 0x3c).\n\
  \  Reads the MapGroup byte at oGameState_MapGroup (offset 0x4).\n  If MapGroup == 0x85, returns 3 in\
  \ r0 (tail-call via `pop {pc}`).\n  Otherwise falls through to `ldrb r0, [r0,#5]`, returning the MapNumber\
  \ byte at oGameState_MapNumber (offset 0x5).\n  Pure thumb-leaf (push {lr} then pop {pc}), no callees,\
  \ no side effects beyond reading GameState.\n  Used heavily by surrounding sub_808CC.. range functions,\
  \ suggesting AI sub-mode dispatch by location.\n"
