- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, r10` then `ldr r0, [r0,#oToolkit_GameStatePtr]` (oToolkit_GameStatePtr = 0x3c) loads
    GameState. - `ldrb r1, [r0,#oGameState_MapGroup]` reads offset 0x4 of GameState (matches oGameState_MapGroup).
    - `cmp r1, #0x85` compared against immediate 0x85. - `mov r0, #3` taken on equality, then `pop {pc}`
    returns 3. - Fallthrough `ldrb r0, [r0,#5]` reads oGameState_MapNumber at offset 0x5. - Contract:
    only r10 and lr read on entry; only r0 returned; no callees, no memory writes.'
