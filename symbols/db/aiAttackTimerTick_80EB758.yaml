name: aiAttackTimerTick_80EB758
address: '0x080EB758'
kind: function
status: confirmed
summary: Runs a 5-frame countdown for an AI attack state and exits the attack state once the timer expires.
interface: void aiAttackTimerTick(oAIAttackVars* r7); /* returns r0 = timer-1 and flags from the decrement; callers
  treat r0 and flags as outputs */
details: r7 points to an AI attack-variables object. On the first tick (phase byte oAIAttackVars_Unk_01 at offset
  1 still 0) the frame counter at oAIAttackVars_Unk_10 (offset 0x10) is initialised to 5 and the phase byte is set
  to 4 to mark the state as started. Every call then decrements the 16-bit counter with SUBS so the NZCV flags reflect
  timer-1 vs 0, and stores the result back. When the counter goes negative the helper object_exitAttackState is
  called to leave the attack state. The function is frame-based (called once per frame from the AI attack update),
  is effectively a per-frame timer tick with the exit handled on expiry. Note the disassembly names the phase byte
  oAIAttackVars_Unk_01 although it is not in the shared header; the C stub defines it as offset 1.
