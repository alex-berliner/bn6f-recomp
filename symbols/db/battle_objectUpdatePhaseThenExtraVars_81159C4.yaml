name: battle_objectUpdatePhaseThenExtraVars_81159C4
address: '0x081159C4'
kind: function
status: confirmed
summary: Runs one update-dispatch phase for the selected battle object, then invokes the extra-var handler
  if the object ended at phase 8 with extra vars still pending.
interface: void battle_objectUpdatePhaseThenExtraVars(battleObject r5 /*object, updated in place*/, ...
  /*r2-r4, r6-r9, r11-r12 forwarded to the dispatch callee*/); outputs r1, r5, r8-r12 from callees; entry
  carry/overflow pass through untouched
details: 'Thin per-object step wrapper. It first calls battle_objectUpdateDispatchPhase_80165C2,

  which advances the battle object selected in r5 through its current state/action

  update phase; r5 comes back as the (possibly reallocated or next) object it worked on.

  It then reads oBattleObject_CurStateActionPhaseAndPhaseInitialized: when the low phase

  value is 8 (a specific late state-action phase) and oBattleObject_ExtraVars is nonzero,

  it calls sub_80B87A6 with that extra-var bitfield in r0 — the handler that resolves

  remaining pending extra variables before the phase-8 state finishes. All observable

  register outputs (r1, r5, r8-r12) are produced by the two callees; this routine itself

  computes nothing and only sequences the two calls behind the phase-8/extra-vars guard.

  Entry carry and overflow flags reach the dispatch callee untouched (push {lr} does not

  modify flags); r10 passes through the dispatch callee unmodified and so is effectively

  preserved end-to-end.

  '
