name: object_revealOnFlag
address: '0x080AA194'
kind: function
status: probable
summary: 'Object update: when its mapped event flag is set, plays a reveal sequence (animation 1, camera
  shake, SFX 0x17B) and sets state to 8; otherwise just runs sprite_update.'
interface: () -> void; uses r5 = object pointer; sets ZF from TestEventFlag internally
details: Reads the object's byte at +4 and maps it through sub_8143B5E to an event flag ID, then tests
  the flag. If the flag is set, it sets the sprite's current animation to index 1, reloads the animation
  data, triggers a camera shake (magnitude 2, duration 0x14), plays sound effect 0x17B, and writes 8 into
  the object's state byte at +8 (making this a one-shot transition since the flag branch then still runs
  each frame but the fx block re-triggers only per flag semantics — actually it re-runs every call while
  the flag is set, so +8 likely gates further behavior elsewhere). If the flag is clear, it only calls
  sprite_update. The sprite helpers (setAnimation/loadAnimationData/update) operate on a current-object
  context rather than an argument, matching the r5-based object layout.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#4]; bl sub_8143B5E; bl TestEventFlag — object field +4 selects the event flag being
