    new animation on flag set; mov r0,#2; mov r1,#0x14; bl camera_initShakeEffect — screen shake magnitude
    2, 20 frames; mov r0,#0x7c; add r0,#0xff; bl PlaySoundEffect — plays SFX 0x17B; mov r0,#8; strb r0,[r5,#8]
