name: isEventFlag213Set_80AA778
address: '0x080AA778'
kind: function
status: confirmed
summary: Returns 1 if event flag EVENT_213 (bank 2, index 0x13) is set, else 0.
interface: u32 isEventFlag213Set_80AA778(void) -> r0 = 1 if EVENT_213 set, 0 if clear; no inputs (r10
  in the contract is unused by the code)
details: 'Tiny boolean predicate: pushes r4/lr, zeroes r4, tests event flag EVENT_213 via

  TestEventFlagFromImmediate (the movflag pseudo-op encodes the flag as bank 2, index 0x13;

  that helper clears Z when the flag is set). If the flag is set, r4 := 1. Returns r0 = r4

  and pops r4/pc, so r4 is preserved. No other state is touched. What EVENT_213 means in

  game terms (a story progression beat, cutscene watched, etc.) is not known from this

  function alone; the name should be revisited once the flag''s use sites are identified.

  '
