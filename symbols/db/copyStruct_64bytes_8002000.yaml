name: copyStruct_64bytes_8002000
address: '0x08002000'
kind: function
status: confirmed
summary: Copies a 64-byte (16-word) structure from one buffer to another.
interface: void sub_8002000(u32 dst_ptr in r5, u32 src_ptr in r4); clobbers r0
details: A plain inline memcpy of 64 bytes (16 longwords at offsets 0x00..0x3C) from [r4] to [r5]. The
  readable C lifts it as returning the last word loaded (src[0x3C]), but the assembly never propagates
  that word; it is just left in r0 and overwritten by successive loads, so the function is effectively
  void. r4 and r5 are the only meaningful inputs, with lr holding the return address (function ends with
  `mov pc, lr`).
