open_questions:
- Whether any caller relies on r0 being the last word copied (the unrolled loop would set r0 to LD32(src+0x3C));
  in practice callers per the contract ignore r0.
- Why this routine exists at all when a standard memcpy would suffice - possibly an early-game convenience
  wrapper or hand-unrolled hot path for a frequently copied fixed-size struct (candidate sizes include
  object state, navi/entity header, or chatbox record at 64 bytes).
