name: object_lerpPos
address: '0x0801164C'
kind: function
status: probable
summary: 16-bit linear interpolation of an (x,y) point toward a target by fraction r6/r7, used to step
  objects along curved flight paths
interface: (r0 = x0, r1 = y0, r2 = x1, r3 = y1, r6 = numerator, r7 = denominator) -> r0 = x0 + (x1-x0)*r6/r7,
  r1 = y0 + (y1-y0)*r6/r7; flags from the last Div
details: Saves the caller's r0/r1 (the start point) on the stack, computes deltas r2-r0 and r3-r1, multiplies
  each by r6, then divides each by r7 via BIOS swi 6 (SWI Div, quotient in r0), and adds the scaled deltas
  back onto the saved start point. It is a pure two-dimensional lerp with no memory access; all state
  comes from registers. The denominator r7 is supplied by the caller (likely a constant like 100 or 0x100),
  and r6 acts as the interpolation weight, e.g. a frame counter over the path duration. Its only known
  caller, object_curveFlightUpdate, uses it to position a battle object along a parameterized 3D path
  over 15 frames before landing.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub r2,r2,r0 / sub r3,r3,r1 then mul r2,r6 / mul r3,r6: scales the deltas toward the target
    point; svc 6 twice with mov r1,r7: BIOS Div by r7 applied to each scaled delta; pop {r0,r1} then add
    r0,r0,r2 / add r1,r1,r3: adds the weighted deltas back to the original start point, so the function
    returns the interpolated point; caller object_curveFlightUpdate is documented as moving an object
    along a parameterized path for 15 frames, matching per-frame fractional interpolation'
