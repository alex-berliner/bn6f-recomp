name: init_resetGfxAndBranchState
address: '0x08039694'
kind: function
status: probable
summary: Resets all graphics state (render info, BG tile buffer, LCD control 0x1F40), clears shared scratch,
  applies overlay palette 0x11 and a screen fade, then re-inits battle eStruct records and chatbox; stores
  mode byte 3 at [r5+5] and branches to one of three next states via [r5+0x14]/[r5+0x17].
interface: (r5 = scene/task work struct, inherited from caller, not set here) -> r0 = clobbered; writes
  state byte [r5+1] (0x1C, 8, or 4) and mode byte [r5+5]=3; flags preserved
details: 'Runs a full reset sequence: resetAllGraphicsState, zero-fill of the 0x2000-byte BG tile buffer,
  LCD control set to 0x1F40 (BG0-3+OBJ, page flip), render-info counters cleared, shared 0x180-byte scratch
  cleared, overlay palette 0x11 applied, and a screen fade configured (8, 0x10). It then copies data (copyData_803B216),
  runs sub_803C2EC, re-inits the battle eStruct record array via battle_resetEStructRecords_8046664, and
  calls a chatbox reset. Finally it stores 3 into [r5,#5] and selects the next state: if [r5,#0x14] is
  nonzero it calls sub_803993A/sub_803BB2C with that byte and sets [r5,#1]=4; else if [r5,#0x17] is nonzero
  it does the same with [r5,#4] and sets [r5,#1]=8; otherwise [r5,#1]=0x1C with [r5,#2]=0. Notably r5
  is never assigned here, so the caller must supply the work struct in r5.'
