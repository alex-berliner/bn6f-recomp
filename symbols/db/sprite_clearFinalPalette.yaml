name: sprite_clearFinalPalette
address: '0x08002DD8'
kind: function
status: confirmed
summary: Clears the high nibble of an object's sprite final-palette byte, leaving only the low nibble.
interface: 'void sprite_clearFinalPalette(u32 objectHeader /* r5 */); returns: r1 = 0xf0, r3 = sprite pointer; flags:
  N,Z from BIC of masked byte (0..0xF), C,V preserved from header+offset ADD'
details: 'Takes an object header pointer in r5. Reads the type/sprite-offset byte at +oObjectHeader_TypeAndSpriteOffset,

  keeps its top nibble (type << 4) and adds it to the header to locate the sprite struct (r3).

  Reads the byte at +oObjectSprite_Unk_15 from that sprite, masks off the top nibble with 0xF0 BIC,

  and stores the low nibble back. The high nibble of that byte is treated as a "final palette" index

  that this function resets (clear), leaving the low nibble (some other attribute) untouched.

  Quirk: only the top nibble of the type byte is used as the sprite offset (bottom nibble ignored),

  which is how the object header points to one of up to 16 sprites stacked after it.

  The "oObjectSprite_Unk_15" field''s purpose is not fully known; based on this function the high nibble

  is palette-related (the "final" palette assignment).

  '
