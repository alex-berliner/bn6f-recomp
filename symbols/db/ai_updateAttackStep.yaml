name: ai_updateAttackStep
address: '0x08100E78'
kind: function
status: probable
summary: 'Per-frame AI attack tick: primes the attack element/timer on first call, counts down the step
  timer, and exits the attack state when it expires'
interface: (r0 = unused/garbage, r5 = battle object, r7 = object's oAIAttackVars) -> r0 = clobbered; updates
  AttackElement, StepTimer, CurAnim
details: If oAIAttackVars_AttackElement is 0, it writes 4 into it and copies oAIAttackVars_AttackDuration
  into oAIAttackVars_StepTimer, priming the attack. Otherwise it decrements StepTimer each frame while
  it stays positive. When the timer reaches 0, it sets the battle object's oBattleObject_CurAnim (r5)
  to 0 and calls object_exitAttackState to end the attack. Element value 4 is hardcoded, so this state
  is for a specific element's attack behavior. No other registers or fields are touched.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on [r7,#oAIAttackVars_AttackElement] with 'mov r0,#4; strb' primes the element when
    unset; ldrh AttackDuration / strh StepTimer copies the attack duration into the countdown timer; ldrh/sub/strh
    on StepTimer with bgt implements the per-frame countdown; mov r0,#0; strb [r5,#oBattleObject_CurAnim]
    resets the animation when the timer expires; bl object_exitAttackState ends the attack state on timer
    expiry
  refs:
  - bn6f/asm/asm31.s:157612
  - 0x08011714 object_exitAttackState
