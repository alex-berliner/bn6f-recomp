name: sub_81322E8
address: '0x081322E8'
kind: function
status: confirmed
summary: Looks up an object's runtime record and dispatches to one of its per-state thunks chosen by an index byte
  at state+0x0E.
interface: "void dispatchObjectMethod_81322E8(u32 state /* r5 */);\n  // reads  r5, byte at r5+0x0E (method index)\n\
  \  // calls  sub_803E8F8 -> u32 record (forwarded to handler in r2)\n  // jumps  to off_8132304[method_index]\
  \ (BX) with r0=thunk, r1=table_base, r2=record;\n  //       r3..r12 flow through from the caller (sub_803E8F8\
  \ preserves r1/r2/r5, so r5\n  //       still points at the caller's state block on entry to the handler)\n  //\
  \ clobbers nz,c,v,r0,r1,lr\n"
details: 'Tiny dispatcher stub. sub_803E8F8 returns a per-object runtime record (r2). The byte

  at state+0x0E is used as a method index into the 4-entry code table at off_8132304

  (currently a single entry: sub_8132310+1). Control is transferred by `mov lr, pc; bx r0`,

  so the handler runs in the caller''s guest frame and any registers it leaves in

  r2..r12 are what the original caller of this function observes. The function itself

  has no `pop {pc}` return; it relies on the dispatched thunk (or the chain after it)

  to return to the real caller. Effectively a vtable-style dispatch on a per-object

  state block where the table holds Thumb code pointers rather than data addresses.

  '
