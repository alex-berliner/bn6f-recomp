name: object_getFrontDirection
address: '0x0800E2CA'
kind: function
status: confirmed
summary: Returns the +1/-1 facing-direction multiplier for a battle object based on its alliance side and DirectionFlip
  flag.
interface: int object_getFrontDirection(struct BattleObject* obj /* r5 */); -> r0 = +1 or -1 direction, r1 = obj->DirectionFlip,
  returns via lr (tail call into object_getFlipDirection)
details: 'Reads the battle object''s Alliance byte (oBattleObject_Alliance) and DirectionFlip byte (oBattleObject_DirectionFlip)
  from the struct at r5, then tail-calls object_getFlipDirection(r0=alliance, r1=flip), which returns straight to
  the original caller. The helper computes r0 = -(((alliance ^ flip) << 1) - 1) = 1 - 2*(alliance ^ flip), i.e.
  +1 when alliance ^ flip == 0 and -1 when it is 1. In game terms this is the front-facing direction multiplier
  used to scale horizontal movement/targeting so objects face toward the enemy side they belong to; the DirectionFlip
  byte inverts it for objects whose sprite/facing is mirrored. As a side effect of the tail-call chain the caller
  also receives r1 = the raw DirectionFlip byte, and the NZCV flags reflect object_getFlipDirection''s final sub/neg
  (c, v observable; n, z clobbered).

  '
