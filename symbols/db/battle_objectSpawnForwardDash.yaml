name: battle_objectSpawnForwardDash
address: '0x080CE83C'
kind: function
status: probable
summary: 'Spawn/entry-state handler for a battle object: loads its sprite, positions it on its panel,
  gives it forward velocity with a sound effect, and switches it to the normal update state.'
interface: (no args; r5 = battle object header) -> r0 = 0 on success path (state set), object freed and
  returns if sprite init fails
details: Sets flag bit 1 in oObjectHeader_Flags, then initializes the object's sprite/collision via battleObject_initSpriteAndCollision
  with sprite resources 0x1000c0b and 0x7050100; on failure it frees the object and returns. On success
  it recomputes pixel coordinates from panel coordinates, reads the object's facing direction (object_getFrontDirection,
  +1/-1) and stores direction*0x50000 into oBattleObject_XVelocity, i.e. a fixed-point 5 px/frame dash
  in the facing direction. It refreshes collision state via object_presentCollisionData, plays sound effect
  0x120, and sets oBattleObject_CurState to CUR_STATE_UPDATE so the per-frame update handler takes over.
  The r5-based access and state-field write show this runs as a state/spawn handler with the object pointer
  held in r5 rather than passed in r0.
