name: sprite_setPositionForIdRange3_8119854
address: '0x08119854'
kind: function
status: confirmed
summary: Moves a group of three consecutive sprite-table entries (ids firstId..firstId+2) to the given (x, y) position,
  skipping any id with no entry.
interface: void sub_8119854(u32 x, u32 y, u32 firstId) — preserves r4-r7; returns with NZCV set by the final `cmp
  id, end` of the loop; clobbers r0-r3 and r5 (r5 is restored before return).
details: 'Takes a coordinate pair (x in r0, y in r1) and a starting sprite id in r2, then iterates

  over ids firstId, firstId+1, firstId+2 (loop runs while id < firstId+3). For each id it

  calls getStructFrom2008450(id) — a lookup in the sprite structure table rooted at

  0x2008450 — and if the entry exists (r0 != 0 after the call), calls

  sprite_setCoordinates(x, y, lookupResults...) to place that sprite at (x, y). The

  lookup''s r1 result is moved into r5 as the third argument of sprite_setCoordinates,

  while its r2/r3 results are forwarded untouched as the fourth/fifth arguments; ids

  with no table entry are silently skipped, so partial groups are fine. The three saved

  arguments are kept on the stack (sp+0, sp+4, sp+8) across the loop. On return the

  flags reflect the loop''s final `cmp id, end` comparison, and r5 (used as scratch for

  the argument pass) is restored to its entry value.

  '
