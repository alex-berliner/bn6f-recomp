name: entryRomInit_800023C
address: '0x0800023C'
kind: function
status: confirmed
summary: 'GBA ROM entry thunk: calls the main ROM/BIOS initialization routine sub_3005DA0, then returns control
  to the caller using the saved LR.'
interface: 'u32 start_800023C(void);  // called with: <none>; returns caller''s saved LR in r0; nz/c/v flags from
  the call; preserves r4-r7'
details: 'Lives at the ROM entry point and acts as a trampoline. Pushes LR onto the

  stack, loads sub_3005DA0+1 (Thumb bit set) into r0, switches LR to PC and

  bx''s into the called routine. After sub_3005DA0 returns, the original

  uses "pop {r0}" to load the saved caller LR into r0, then "bx r0" to

  dispatch back to it. So the meaningful "return value" is the original

  caller''s address, not whatever sub_3005DA0 left in the registers — the

  subsequent code tail is treated as a TAILCALL target using that LR.

  sub_3005DA0 itself is the real initializer (presumably the boot/IPC setup

  for the GBA BIOS + IRQ + cartridge bring-up path) but lives in another

  translation unit (has the +1 Thumb suffix in its address).

  Touches the stack and the banked LR; r4-r7 preserved by the contract.

  '
