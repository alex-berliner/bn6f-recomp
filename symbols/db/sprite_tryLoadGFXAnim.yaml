  reproduce: python3 tools/asmcat.py 0x0803C530
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary''s call flow matches: it gates on sub_803CB18(0x200) and only calls LoadGFXAnim(off_8039370)
    when that returns non-zero, then returns 1/0 in r0. However, ''tryLoadAnimState'' is vague about what
    is being tried; the function specifically requests loading GFX animation script off_8039370 after
    the gate, so a name like sprite_tryLoadGFXAnim better reflects what is loaded. The r0=tst/pop epilogue
    just normalizes the return into the Z flag, which the summary already captures.; run wf investigate
    investigate-20261019-022109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
