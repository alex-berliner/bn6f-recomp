name: sprite_tryLoadGFXAnim
address: '0x0803C530'
kind: function
status: probable
summary: Calls sub_803CB18(0x200) as a gate; if it returns nonzero, calls LoadGFXAnim with the GFXAnimScript
  at off_8039370 and returns 1, otherwise returns 0.
interface: () -> r0 = 1 if LoadGFXAnim ran, else 0; uses r5 = eS200A290 as implicit state pointer for
  callees
details: 'Loads the address of the EWRAM struct eS200A290 into r5 and keeps it live across both calls,
  so it is passed implicitly to sub_803CB18/LoadGFXAnim rather than in r0-r3. It first calls sub_803CB18
  with r0=0x200 and branches on the returned flags: if equal, it skips everything and returns 0. Otherwise
  it calls LoadGFXAnim with r0 = the GFXAnimScript at off_8039370 (which presumably writes into the r5
  struct) and returns 1. The 0x200 argument to the gate is unknown — likely a resource/slot id or capacity
  check.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r5, off_803C54C (=eS200A290) with no later use in this function: r5 is an implicit argument
    to the callees; bl sub_803CB18 with r0=0x200 followed by beq: a gate that skips the load when the
    check fails; bl LoadGFXAnim with r0=off_8039370 only on the pass path, then mov r4,#1: success returns
    1; mov r0,r4 / tst r0,r0: boolean success/failure return value'
  refs:
  - bn6f/asm/asm03_1_1.s:7312
  - 0x080399CE sub_80399CE
