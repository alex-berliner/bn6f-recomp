name: object_runFrameUpdate
address: '0x080CF488'
kind: function
status: probable
summary: 'Per-frame tick for a battle object: tear down/rebuild collision data, spawn its hit effect,
  dispatch one of three action-state handlers, then update its sprite.'
interface: (r5 = oBattleObject, no args in r0-r3) -> r0 = handler/last call result; uses r5 as the object
  pointer throughout
details: This is the per-frame update routine for a specific battle object held in r5. It first removes
  the object's collision data (clearing one-shot hit state), then spawns the hit-effect object at the
  object's jittered coordinates from its last collision. It then loads oBattleObject_CurAction and indexes
  the 3-entry jump table at off_80CF4BC, calling sub_80CF4C8, sub_80CF4E6, or sub_80CF554 via 'mov lr,
  pc; bx r1' so handlers return into the common tail. The tail runs object_updateSprite and object_presentCollisionData
  to refresh the animation and re-present collision state for the frame. One fall-through handler clears
  the collision region, writes 8 to [r5,#8], and clears bit 1 of the object's flag byte at [r5].
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData / object_spawnCollisionEffect at entry match the shared per-frame
    collision teardown/effect pattern; ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; mov lr,pc;
    bx r1 — dispatch on CurAction via 3-entry table off_80CF4BC; tail calls object_updateSprite then object_presentCollisionData
    before pop {pc}, the standard end-of-frame pair; fall-through after bx lr: bl object_clearCollisionRegion,
    str 8 to [r5,#8], bic bit1 of [r5] — one action state''s body; all callees are object_* battle-object
    helpers operating on r5, indicating a battle-object tick'
