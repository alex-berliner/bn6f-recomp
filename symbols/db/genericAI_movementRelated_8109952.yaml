open_questions:
- Is oAIAttackVars_HitElement truly a state enum (0-3) or is it a hit-element field that happens to double as the
  phase index in this AI variant?
- What happens if the byte exceeds 3?  The jump table has only 4 entries; an out-of-range index would read past
