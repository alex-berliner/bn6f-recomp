name: genericAI_movementRelated_8109952
address: '0x08109952'
kind: function
status: confirmed
summary: State-machine dispatcher that routes a generic-AI attack sequence through its four movement phases (approach
  target panel, finish move, step-expired timeout, exit-after-delay) via a jump table indexed by the state byte
  at oAIAttackVars_HitElement in the r7 attack-vars block.
interface: 'genericAI_dispatchAttackMoveState_8109952(r7=aiAttackVarsPtr) -> R0-R12, NZCV, LR : caller LR preserved;
  r4,r5,r6,r10 ambient in; everything else clobbered/forwarded from handler.'
details: 'push {lr} saves the caller''s return address.  LD8 r7+oAIAttackVars_HitElement reads the current attack-movement
  state byte (0-3).  A jump table at off_8109964 is indexed by that byte to obtain one of four handler addresses
  (all thumb): state 0 = ai_attackStepMoveToTargetPanel (advance toward the target panel), state 1 = ai_stepFinishMoveToPanel
  (arrival / transition-to-attack), state 2 = ai_attackStepExpired (move timed out mid-sequence), state 3 = genericAI_exitAttackStateAfterDelay_81097BA
  (cooldown / leave attack state). The "mov lr, pc; bx r1" idiom temporarily hijacks LR so the selected handler
  returns to the pop {pc} site at 0x0810995E, which then restores the *original* caller LR and returns.  No fields
  are written here; the function is a pure tail-call dispatcher. The register contract shows all outputs are transparently
  forwarded from the handler, meaning callers see the handler''s R0 and flags directly.

  '
