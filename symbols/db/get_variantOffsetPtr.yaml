name: get_variantOffsetPtr
address: '0x03006F48'
kind: function
status: probable
summary: Returns the input pointer advanced by a per-variant offset looked up from a small table, using
  a type byte in the structure as the index.
interface: (r0 = pointer to struct whose byte at +0x01 selects a layout variant) -> r0 = r0 + byte_3006F58[type];
  r1 and r7 clobbered, flags set by the add
details: Loads the byte at r0+1 and uses it as an index into the 4-entry table byte_3006F58 = {3,0,0,0},
  then returns r0 plus the table value. So variant 0 yields r0+3 while variants 1-3 yield r0 unchanged,
  i.e. it skips a 3-byte header that only one struct variant has. It touches no other fields and calls
  nothing; it is a tiny pointer-adjustment helper. The actual struct and the meaning of the type byte
  are unknown because no callers are on record. Its presence on routes across battles, maps, menus and
  story shows it is a widely shared utility.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r7, [r0,#1] reads the variant/type selector from offset 1 of the struct; ldrb r1, [r7,r1]
    with off_3006F54 = byte_3006F58 indexes the offset table {3,0,0,0}; add r0, r0, r1; mov pc, lr returns
    r0 advanced by the table value and nothing else
