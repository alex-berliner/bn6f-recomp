name: chatbox_threeChoiceMenuUpdate
address: '0x08131210'
kind: function
status: probable
summary: 'Update tick for a three-option chatbox menu: replay the current option''s script after the chatbox
  finishes, move the cursor (0–2) with the d-pad playing each option''s script, and confirm/cancel with
  A/B (B always exits, A re-runs script 0x69 first), setting status bit 0x2 and playing sound 0x83/0x81.'
interface: (r5 = dialog state struct, r4 = context struct with u16 at +0xA, r10 = toolkit) -> void; no
  meaningful return value
details: 'r5 points at a small dialog state: +0xC is the cursor index, +0x11 a flag, +0x1B a status byte,
  +0x26 a state halfword. When status bit 0x20 is set (chatbox finished, signalled by eFlags2009F38 bit
  8), it clears the bit and runs the text script selected by the saved cursor from table dword_81312D4,
  whose bytes are script indices 0x6B/0x6C/0x6D in archive eTextScript201BA20. Otherwise it checks a guard
  (halfword at [r4 or r4+0x10,+0xA] must be <= 0x8003) and, when state != 4, lets the cursor move over
  3 entries via menu_moveCursorUpDown, playing the option''s script and sub_81314E4 on change. At state
  4, A (re)runs script 0x69 while B is also accepted; on confirm/cancel it sets status bit 0x2, stores
  state 4 or 8, and plays sound 0x81 or 0x83. Inputs arrive in callee-saved r4/r5/r10, so this runs inside
  a caller-owned update loop.'
