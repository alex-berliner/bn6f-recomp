name: sprite_updateAnimFacingPlayer
address: '0x080A5CE4'
kind: function
status: probable
summary: Updates a sprite object's animation so it faces toward the overworld player's position.
interface: (r0 = object whose animation to update) -> r0 = animation-changed flag from sprite_updateAnimByAngleToTarget;
  no flags guaranteed
details: 'The routine fetches the overworld player object via ReadOWPlayerObjectCoords, which returns
  the player object pointer plus its X/Y/Z coordinates in registers, and immediately calls sprite_updateAnimByAngleToTarget
  with those coordinates as the target. sprite_updateAnimByAngleToTarget computes the octant of the angle
  from the animated object to the target and only reapplies sprite state when the selected animation actually
  changes. So the combined effect is: make r0''s sprite play the animation corresponding to the direction
  toward the player. The push/pop of r4-r7 suggests the full body copies the player coords into argument
  registers for the second call (the listing appears abbreviated). It is exercised on recorded beastsp
  routes, consistent with overworld NPCs/threats orienting toward the player.'
