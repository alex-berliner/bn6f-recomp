name: object_isCurrentPanelValid
address: '0x0800CC66'
kind: function
status: confirmed
summary: Checks whether the panel a battle object currently occupies is a valid battlefield position.
interface: bool object_isCurrentPanelValid(oBattleObject *obj /* r5 */); returns object_isValidPanel's result in
  r0/r1 with its NZCV flags; lr clobbered (tail-call style)
details: 'Thin wrapper over object_isValidPanel: loads the object''s current panel coordinates

  from its battle object struct (oBattleObject_PanelX at byte offset, oBattleObject_PanelY

  next) and tail-calls object_isValidPanel(x, y), returning its result and flags unchanged.

  r5 is the battle object pointer, passed through implicitly by only reading the two

  coordinate bytes before the call. Used wherever code needs to ask "is this object

  standing on a legal panel?" without duplicating the coordinate load.

  '
