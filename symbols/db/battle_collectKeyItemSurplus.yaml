name: battle_collectKeyItemSurplus
address: '0x08135E6C'
kind: function
status: probable
summary: Scans a 4-entry ID table and, for each ID, subtracts the number of toolkit-array references (entries
  whose first halfword + 0x90 matches the ID) from CheckKeyItem(id); if a surplus remains and the battle-object
  descriptor's byte 3 is nonzero, appends a {id, surplus} 4-byte record to the caller-provided buffer.
interface: (r6 = output buffer pointer) -> r0 = clobbered; writes 4-byte {id:halfword, count:halfword}
  records into buffer, advancing past the last one written
details: Iterates over an inline table of four IDs (0xC4, 0x11C, 0x120, 0x14C). For each, r7 = CheckKeyItem(id);
  it then walks the 25 8-byte entries of the array pointed to by oToolkit_Unk2004190_Ptr, decrementing
  r7 once for every entry whose first halfword + 0x90 equals the table ID. If the surplus r7 is nonzero,
  it looks up the battle-object descriptor at index (id - 0x90) via battleObject_getByIndex and requires
  byte 3 to be nonzero before appending the record {id, surplus} to the buffer whose pointer arrives in
  r6 (callee-saved, set by the caller) and is kept in [sp], advanced by 4 per record. The pools off_8135ECC/ED0/ED4
  referencing word_201DA80, 0x14C and 0xBC are unreferenced by this code. Returns no value.
