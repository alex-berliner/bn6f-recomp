- method: assembly-reading
  date: '2026-10-18'
  detail: 'off_8135EDC: .word 0xC4,0x11C,0x120,0x14C — fixed table looped r4=0..0x10 step 4; bl CheckKeyItem
    then ''sub r7,#1'' per matching Unk2004190 entry (ldrh r1,[r0]; add r1,#0x90; cmp r1,r2); sub r0,#0x90;
    bl battleObject_getByIndex_813B780; ldrb r1,[r0,#3] gates the write; ldr r0,[sp]; strh r6,[r0]; strh
    r7,[r0,#2]; add r0,#4 — appends {id,surplus} pair and advances buffer'
