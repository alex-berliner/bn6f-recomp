name: battle_collectKeyItemSurplus
address: '0x08135E6C'
kind: function
status: confirmed
summary: Builds a list of surplus key-item IDs (and their surplus counts) for the 4 battle-relevant key items, accounting
  for copies consumed by toolkit entries.
interface: u32 battle_collectKeyItemSurplus(u32 outList /* r6, output write cursor; returns advanced pointer in
  r6 */); /* r10 = toolkit base, read via callee; clobbers r0,r1,nzcv; r2,r3,r5 also set by callees */
details: "Iterates a hard-coded table of 4 key-item IDs at off_8135EDC: {0xC4, 0x11C, 0x120, 0x14C}.\nFor each ID:\n\
  \  1. Calls CheckKeyItem(id) -> r0 = surplus count; skips if zero.\n  2. Scans 0x19 toolkit entries via toolkit_getUnk2004190EntryPtr_813B9FC(e);\
  \ each entry whose halfword at offset 0 (reinterpreted as ID+0x90) equals the current key_id decrements surplus\
  \ by one. This accounts for copies already referenced by toolkit slots.\n  3. If surplus remains, calls battleObject_getByIndex_813B780(id\
  \ - 0x90) and requires byte +3 of that battle-object structure to be non-zero (likely an \"active/available\"\
  \ flag); skips otherwise.\n  4. Appends a 4-byte record {u16 key_id, u16 surplus} to the caller-provided output\
  \ list at r6 and advances r6 by 4.\nReturns the updated write cursor in r6 so callers can chain appends or check\
  \ termination.\nStack usage: 8 bytes (saved r6 at [sp], scratch [sp+4] for current key_id).\nThe 4 IDs in off_8135EDC\
  \ are the only ones checked; word_201DA80 at off_8135ECC is referenced in the literal pool but not used by this\
  \ function directly.\n"
