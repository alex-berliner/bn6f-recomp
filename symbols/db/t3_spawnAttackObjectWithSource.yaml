name: t3_spawnAttackObjectWithSource
address: '0x080C86B0'
kind: function
status: probable
summary: Wrapper around object_spawnType3 that spawns the type-3 battle object ID 0x22, copies the caller's
  panelX/panelY/element and a damage/stamina word from r6, inherits oBattleObject_AllianceAndDirectionFlip
  from the source object in r5, and sets flag 0x10 in oObjectHeader_Flags.
interface: (r0 = panelX, r1 = panelY, r2 = element, r3 = extra spawn arg, r5 = source object to inherit
  AllianceAndDirectionFlip from, r6 = damage/damage-counter word) -> r0 = spawned object or 0 on failure;
  flags from spawn success test
details: The wrapper pushes the caller's r0-r2 (and r5) so they ride the stack as extra arguments, then
  calls object_spawnType3 with r0 = 0x22 (object ID); the spawn result comes back in r5 and is moved to
  r0 before the pop restores r1-r3 (shifting the saved r0-r2 into r1-r3). On success it writes the caller's
  panelX, panelY and element into oBattleObject_PanelX/PanelY/Element of the new object, stores the caller's
  r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler, and copies oBattleObject_AllianceAndDirectionFlip
  from the object in r5 so the spawned attack fights on the source's side. It then ORs flag 0x10 into
  the new object's oObjectHeader_Flags. The trailing t3_0x23 state-machine code in the same region shows
  this family of type-3 objects runs init/collision/update handler tables. Failure path (beq) returns
  immediately leaving the object unconfigured.
