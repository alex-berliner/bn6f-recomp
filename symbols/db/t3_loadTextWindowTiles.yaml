name: t3_loadTextWindowTiles
address: '0x0804C3C4'
kind: function
status: probable
summary: Draws a fixed 12x6 tile window (tile data at byte_86A13F0) into background tile block 3 and sets
  a render-info flag, presumably making the text window visible.
interface: () -> r0 = destroyed; sets bit 0x800 of toolkit->RenderInfo->field0 (halfword)
details: Reads the toolkit's RenderInfo pointer, ORs 0x800 into its halfword field at offset 0, and stores
  it back — likely a 'text window shown' or layer-visible flag. Then calls CopyBackgroundTiles(j=0xC,
  i=0, tile_block=3, tile_ids=byte_86A13F0, j_size=0xC, i_size=6), copying a 12x6-tile rectangle of prebuilt
  tile IDs from ROM into tile block 3 starting at column 12, row 0 — the geometry of an on-screen window
  box. The trailing data (byte_804C3F0 with bytes like 0x4A,0xFF / 0x46,0xFF / 0xE0,0xFF and word 0x106060)
  looks like a sibling function's palette or tile data, not used here. No arguments are read, so the function
  is fully self-contained.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh/strh with orr 0x800 on [r4] where r4 = toolkit->RenderInfoPtr sets a visibility/flag halfword;
    bl CopyBackgroundTiles with r0=0xC, r1=0, r2=3, r3=byte_86A13F0, r4=6, r5=0xC writes a 12x6 tile region
    to block 3; tile_ids pointer byte_86A13F0 is ROM tile-index data for the drawn window; called from
    sub_804C348 and twice from sub_804C3BC (also at 0x804C3C2, i.e. a tail-call/adjacent path), suggesting
    a show-window helper used by multiple text routines
