name: sub_80CAEC8
address: '0x080CAEC8'
kind: function
status: confirmed
summary: Spawns a type-3 battle object (kind 0x37) on a given panel carrying an element and damage value, inheriting
  the source object's alliance/direction, e.g. an attack's lingering damage or hit-effect entity.
interface: 'BattleObject* battle_spawnDamageObjectOnPanel(u32 panelX /*r0*/, u32 panelY /*r1*/, u32 element /*r2*/,
  BattleObject* source /*r5*/, u32 damage /*r6*/); returns the new object pointer in r5, or the unchanged source
  pointer in r5 if spawning failed. Flags: Z from object_spawnType3 is consumed (BEQ on failure).'
details: 'Pushes r0-r2 and r5, sets r0 = 0x37 and calls object_spawnType3, which returns the new object in r5 (or
  NULL/0 on failure, flagged in Z). On success it fills the new object: PanelX and PanelY (bytes) from r0/r1, Element
  (byte) from r2, and the 32-bit DamageAndStaminaDamageCounterDisabler field from r6 (a damage value / damage-counter
  control word). It then copies the 16-bit AllianceAndDirectionFlip halfword from the source object (r5 at entry)
  so the spawned object faces the same side, and ORs 0x10 into oObjectHeader_Flags, the spawned-this-frame marker
  used by the object update loop. The popped r5 restores the caller''s source pointer, which doubles as the return
  value (unchanged on failure, so callers get a usable pointer either way). r4 appears in the caller contract but
  is never read by the function itself.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
