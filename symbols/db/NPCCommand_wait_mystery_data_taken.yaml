name: NPCCommand_wait_mystery_data_taken
address: '0x0809F338'
kind: function
status: confirmed
summary: NPC script command that suspends the NPC's script until the referenced mystery data (Cyberdata Block?)
  has been taken, then resumes.
interface: (r5 npcObj, r6 scriptPtr) -> r6 scriptPtr+3 (flags from that add); r0/r1 clobbered via callees
details: 'Script-command handler (opcode dispatch table member) for the overworld NPC interpreter.

  Sets the NPC object''s CurAction byte (offset 9) to MOVEMENT_FLAG_WAIT_MYSTERY_DATA_TAKEN so

  the NPC idles until the player takes the mystery data, and zeroes the halfword at

  oOverworldNPCObject_MovementFlag_0a_Unk_0b (clears movement flags). Reads a halfword operand

  (mystery data id) at scriptPtr+1 via ReadNPCScriptHalfword and stores it as a full word into

  oOverworldNPCObject_MysteryDataId. Calls npc_disableScript0x19_809f51e to stop normal script

  processing (the wait is handled by the movement/wait logic instead). Advances the script

  pointer by 3 (1 opcode byte + 2 id bytes), returning that as the new pointer; the ADDS flag

  side effects of that increment are part of the contract.

  r7 is pushed/popped purely as scratch for the oOverworldNPCObject_MysteryDataId offset.

  '
