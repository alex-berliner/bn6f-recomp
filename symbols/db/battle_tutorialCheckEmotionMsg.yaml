name: battle_tutorialCheckEmotionMsg
address: '0x08029A1E'
kind: function
status: probable
summary: 'Tutorial-check routine for the cust tutorial: in state 0xB, when the player''s emotion is clear,
  yields message id 0x26 to be played by the caller.'
interface: (r5 = tutorial state struct, reads [r5,#7]) -> r0 = message id (0x26) or 0; r3 flags from emotion
  call also inspected
details: Reads the tutorial state id at [r5,#7]; only state 0xB does anything, calling battle_getActorEmotion_802A564
  to fetch the actor's emotion/mood. If the emotion check comes back nonzero the routine reports 0 (no
  message); otherwise it returns 0x26, which the caller custMenu_80298F4 treats as a chatbox message to
  play while the menu parks. Any state other than 0xB immediately returns 0. This matches the caller's
  pattern of polling a per-state check routine that returns either 0 or a message id.
