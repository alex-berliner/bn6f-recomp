name: battle_tutorialCheckEmotionMsg
address: '0x08029A1E'
kind: function
status: confirmed
summary: Returns tutorial message id 0x26 for an actor only if it is in state/type 0x0B and currently shows no emotion,
  else 0.
interface: u32 battle_tutorialCheckEmotionMsg(u32 r5 /* actor object */); /* r10 = battle context, passed through
  unused by this function; r0 = 0x26 message id or 0 */
details: 'Small tutorial hook checked during battle. Reads byte +7 of the actor object (r5); if it is not 0x0B it
  immediately returns 0. Otherwise it calls battle_getActorEmotion_802A564(r5) and tests r3 (the current emotion
  value): if an emotion is already active it returns 0, otherwise it returns 0x26 — the id of the emotion/tutorial
  message to show. The caller presumably uses the nonzero result to trigger the corresponding tutorial text. The
  0x0B byte at +7 likely marks the actor kind / tutorial-relevant state (e.g. the tutorial opponent) for which emotion
  messages apply. r10 (battle context) is listed in the register contract but the function never reads it.

  '
