name: battleObject_copyPositionToStruct
address: '0x080A6CD4'
kind: function
status: probable
summary: Reads a battle object from a linked list and copies its x/y(/z) halfword fields into a struct
  as 16.16 fixed-point values.
interface: (r5 = destination struct + list base, r6 = list offset) -> r0 = 1; stores sign-extended (field<<16)
  to [r5+0xC], [r5+0x10], [r5+0x14]
details: Calls battleObject_getFromListPair_80A6E78 to obtain a battle-object pointer from a node addressed
  via r5/r6. Loads signed halfwords at object offsets 2, 4 and 6 (the object's position fields), shifts
  each left 16 to convert to fixed-point, and writes them to r5+0xC, r5+0x10, r5+0x14. Then calls sub_80A6E70
  with r0=8, whose effect is unknown, and always returns 1. No flags are meaningfully used; the caller-visible
  result is the constant 1 plus the three written fields.
