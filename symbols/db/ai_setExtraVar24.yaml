name: ai_setExtraVar24
address: '0x08115BB0'
kind: function
status: probable
summary: Trivial AI hook that writes 0x18 into oBattleObject_ExtraVars+4 of the battle object in r5 and
  returns 0x18 in r0.
interface: (r5 = battle object pointer, ignored as arg convention) -> r0 = 0x18 after `mov r0,#0x18`;
  no flags set meaningfully
details: The whole routine is `mov r0,#0x18; str r0,[r5,#oBattleObject_ExtraVars+4]; mov pc,lr`, so it
  is a trivial setter used as an AI hook. r5 is a battle object (uses the oBattleObject_ExtraVars field),
  and the write targets the second word of its extra-vars area, most plausibly a frame timer or counter
  reset to 24. The `mov r0,#0x18` before returning also leaves 0x18 in r0, which callers may ignore or
  use. It is referenced from an AI hook table (off_81091D0-style long-call hooks) reached from battle_8108F74,
  which dispatches by AIData.AIIndex. No other state is read or touched.
