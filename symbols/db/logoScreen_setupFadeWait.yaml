name: logoScreen_setupFadeWait
address: '0x0803D24C'
kind: function
status: probable
summary: 'Logo-screen state handler: enables the display, starts the screen fade (skipping it if a skip
  flag is set), and arms a 180-frame wait before the next logo-screen state.'
interface: (r0 = *mut LogoScreenState in r5, caller-set) -> r0 = clobbered; writes LCD control, sets fade
  (mode 8 or 0), stores timer 0xB4 at +4 and state 8 at +0
details: Writes DISPCNT-style value 0x1F40 (layers enabled) to the frame's render info via SetRenderInfoLCDControl.
  Checks LogoScreenState+5; if nonzero (a skip/finish flag) it uses fade mode 0 instead of 8, then calls
  SetScreenFade(mode, 8). Stores 0xB4 (180 frames = 3 s) into +4 as the hold duration, then writes state
  8 into the state-index byte at +0, which dispatches to tickLogoScreenFade_803D274 on the next tick.
  Part of the logo-screen state machine (e.g. the Capcom/logo splash before menus).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r0, =0x1F40; bl SetRenderInfoLCDControl — enables the display for the logo screen; ldrb
    r1,[r5,#5]; tst; r0 = 8 or 0 — skips fade when the flag at +5 is set; strb r0(=0xB4),[r5,#4] — 180-frame
    timer for the fade/wait state; strb #8,[r5,state] with comment routing to tickLogoScreenFade_803D274
    — advances the logo state machine; Runs on nearly every recorded route (menus, story, battle) — consistent
    with the boot logo state'
