name: chatbox_setTextParams_8045EFC
address: '0x08045EFC'
kind: function
status: confirmed
summary: Stores four caller-supplied text parameters into the active chatbox's struct for the chatbox task to read
  back later.
interface: void chatbox_setTextParams(u32 a, u32 b, u32 c, u32 d); // r0-r3 in, no meaningful outputs, flags untouched
details: 'Fetches the current chatbox pointer from the toolkit (R10 + oToolkit_ChatboxPtr), then writes the four
  raw arguments into consecutive chatbox fields at oChatbox_Unk_4C, oChatbox_Unk_50, oChatbox_Unk_54 and oChatbox_Unk_58.
  These offsets sit together in the chatbox object and are the data the chatbox task consumes when it next renders/advances
  text (likely the string pointer / print state set up when opening a textbox). The function is a pure store: no
  validation, no flag or register side effects; r4-r7 and the chatbox pointer are preserved (r4 is briefly used
  as scratch to hold the chatbox pointer and is restored by the epilogue).

  '
