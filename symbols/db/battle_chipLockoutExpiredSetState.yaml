name: battle_chipLockoutExpiredSetState
address: '0x08089826'
kind: function
status: probable
summary: 'Per-frame battle tick: when the chip-use lockout timer runs out, calls an unknown handler and
  writes state 0x2C to the battle work byte at r5.'
interface: () -> r0 = 1 always; r5 must already point to the battle-state struct; reads/writes ChipLockoutTimer
  (AIData+0x18) via callee
details: Calls battle_tickChipLockout_8089CB4, which decrements AIData+0x18 and flags when it reaches
  zero. If the timer has NOT expired this frame, the body is skipped and the function just returns 1.
  When the lockout does expire, it calls sub_8142BB6 (unknown) and then stores byte 0x2C at [r5], likely
  advancing a battle-state/mode field. r4-r7 are pushed but unused, suggesting compiler leftovers. The
  unconditional return of 1 suggests the caller only uses this as a 'keep running' return for a task/state
  callback. The exact meaning of state 0x2C and what sub_8142BB6 does are unknown.
