- what battle object kind 0x5B actually is in game terms (needs the kind table or more callers)
- what the caller keeps in r5 — whether it is the object the initializer fills or a battle-context pointer
- whether object_spawnType3 records the new object somewhere that BasicBattleObjectInitialize reads, since
