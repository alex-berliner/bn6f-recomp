name: battle_spawnObject5b
address: '0x080CFDF2'
kind: function
status: probable
summary: 'Spawn wrapper: creates battle object kind 0x5B via object_spawnType3 and, on success, runs the
  base battle-object initializer on the caller''s arguments.'
interface: (r0-r2 = init args, r1-r4 passed through to the spawner, r5 = target/context) -> r0 = result
  of the init call; flags from object_spawnType3 (beq skips init on failure)
details: It saves r0-r2 and r5, loads 0x5B into r0 and calls object_spawnType3, letting the caller's r1-r4
  flow through as the remaining spawn arguments. The push {r0-r2,r5} / pop {r1-r3,r5} pair shifts the
  three original arguments one register up (old r0->r1, r1->r2, r2->r3) so the post-spawn call can use
  r0 for something else. After the spawn, beq exits without doing anything if it failed; otherwise it
  calls BasicBattleObjectInitialize with r0 = the saved r5 and r1-r3 = the original r0-r2. So the flow
  is 'spawn kind-0x5B type-3 battle object, then fill the base object fields (position, element, related
  object, flags) from the caller-supplied data'. The one oddity is that the spawned object's returned
  pointer is not visibly forwarded; r5 must already hold the pointer/handle the initializer fills (or
  the spawn result is tracked elsewhere). It is one of the small per-object-kind spawn thunks around 0x080CFDF2.
