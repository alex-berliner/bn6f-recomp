  reproduce: python3 tools/asmcat.py 0x0811E744
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The structural reading matches: 13 iterations (loop r4=0..0x34 step 4), 10 stores per iter (r3=0..0x28
    step 4 = 10 words = 0x28 bytes, not 0x40), so each block is 0x28 bytes, total 13*0x28=0x340, matching
    the 0x34<<4 DMA size. The fill-level logic is correct: when r6<8 it masks off high bits so only the
    first r6 2-bit slots survive, then forces r6=8 to fall through. However, the byte patterns (0xAA→0xBB
    transitions, etc.) are pairs of identical nibbles, so palette indices 10-14 used as 4bpp tiles with
    each 2bpp slot occupying 2 bytes, and the destination 0x6014180 with 0x340 bytes strongly suggests
    a 13-tile gauge sprite strip. The name ''sprite_fillGaugeTiles'' is plausible; a clearer snake-case-fitting
    name is ''sprite_buildGaugeTiles''.; run wf investigate investigate-20261019-010606; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
