name: object_spawnFrontPanelEffect
address: '0x08107A30'
kind: function
status: probable
summary: Spawns a type-0 effect object on the panel directly in front of the given battle object, with
  the effect kind taken from a lookup table indexed by the argument.
interface: (r0 = effect-kind table index) -> r0 = spawned effect object pointer; uses r5 as battle object
  pointer
details: r0 indexes a small table (dword_8107A60) to get a base kind byte, which is combined with the
  object's horizontal flip shifted left 8 (kind | flip<<8). It then reads the object's PanelX, adds object_getFrontDirection
  (+1/-1) to get the adjacent front panel, converts that column/row to 16.16 screen pixel coordinates
  via object_getCoordinatesForPanels, and calls spawn_t1_0x0_EffectObject with the computed x, y, the
  packed kind, and a constant 0x100000 (16 << 16, likely a fixed-point z/height or param). Returns the
  spawned effect object pointer from the spawn wrapper.
