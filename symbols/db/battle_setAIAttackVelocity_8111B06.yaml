name: battle_setAIAttackVelocity_8111B06
address: '0x08111B06'
kind: function
status: confirmed
summary: Initializes AI enemy attack movement by zeroing velocities, setting step timer and charge cycles,
  then computing fixed-point per-axis velocity from panel deltas.
interface: void battle_setAIAttackVelocity(BattleObject *obj /* r5 */, AIAttackVars *atk /* r7 */);  //
  clobbers r0-r3, flags; preserves r5, r7, lr
details: 'Helper invoked by sub_8111B06 (the Next step of an AI attack routine). Writes obj->XVelocity
  = obj->YVelocity = 0. Sets atk->StepTimer = 0x10 and atk->ChargeCycles = 8 (0x10 >> 1). Then for Y:
  reads atk->TargetPanelY - obj->PanelY; if nonzero, computes fixed-point velocity (0x180000 / 0x10 =
  0x18000) * delta via BIOS divide (svc 6) and stores into obj->YVelocity. For X: reads atk->TargetPanelX
  - obj->PanelX; if nonzero, computes (0x280000 / 0x10 = 0x28000) * delta and stores into obj->XVelocity.
  The two speeds differ (0x18000 vs 0x28000), so horizontal traversal is faster than vertical, matching
  the 10×5 grid layout. The svc 6 divide is the standard GBA BIOS unsigned divide (result in r0, remainder
  in r1); the function saves the dividend on the stack to preserve it as the multiply operand.'
