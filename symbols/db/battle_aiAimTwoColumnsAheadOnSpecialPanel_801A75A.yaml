name: battle_aiAimTwoColumnsAheadOnSpecialPanel_801A75A
address: '0x0801A75A'
kind: function
status: confirmed
summary: Enemy AI hook that, when the battle object stands on a particular panel type (collision byte 0xF6), moves
  the AI's Unk_12 target marker two columns forward (capped at column 7) and runs the follow-up AI routine.
interface: void sub_801A75A(u32 column /*r2*/, BattleObject *obj /*r5*/) — r4 is caller state that is preserved;
  Z flag comes back from "collisionByte == 0xF6" when the panel check fails
details: 'Reads the battle object''s collision data pointer from oBattleObject_CollisionDataPtr on the object at
  r5, then checks byte +0xA4 of that collision data. If it is not 0xF6, the function returns immediately, leaving
  the compare flags (Z set by cmp against 0xF6) visible to the caller. If it is 0xF6, it fetches the object''s AI
  data via oBattleObject_AIDataPtr, computes column + 2, saturates at 7, and stores the result as a byte into oAIData_Unk_12
  — i.e. it retargets the AI two columns to the right, clamped to the far edge of the field. It then loads the collision
  data pointer into r4 (sub_801A77A expects it there), calls sub_801A77A with r4 = collision data, r5 = battle object,
  and r2/r3 carried over from the caller/this routine. Quirk: the ldrb of oAIData_Unk_12 into r0 is dead code —
  r0 is immediately overwritten by "add r0, r2, #2", so the old marker value is never used. r0, r1, r3 and lr are
  clobbered; r2 and r4 (and c/v when the callee runs) are effectively set by sub_801A77A''s return.'
