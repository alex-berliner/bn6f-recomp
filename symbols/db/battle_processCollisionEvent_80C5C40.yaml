name: battle_processCollisionEvent_80C5C40
address: '0x080C5C40'
kind: function
status: confirmed
summary: 'Processes a collision hit on a battle object: removes/respawns collision data, dispatches a
  per-action handler via a jump table, and destroys the object when the battle has ended or the collision
  is already resolved.'
interface: void battle_processCollisionEvent(u32 r5 /* battleObjectPtr *);  // uses r4 as scratch, clobbers
  r0-r3,r6-r12,lr,flags; r4 preserved
details: "Called with r5 pointing to a BattleObject header.  The function is a collision-resolution tick\
  \ for that object.\n1. Calls object_removeCollisionData then object_spawnCollisionEffect to\n   clear\
  \ the old hitbox and play the impact sound/visual.\n\n2. battle_isBattleOver – when the battle has finished\
  \ the object is\n   retired: three words at oBattleObject_CollisionSpawnParams (0x34) are\n   loaded\
  \ into r1-r3, r4 is set to 0x14 (effect type), and\n   spawn_t1_0x0_EffectObject is invoked for a \"\
  battle-end\" visual.  The\n   object is then destroyed (see step 5).\n\n3. battle_isTimeStop – during\
  \ a time-stop the collision is deferred:\n   object_presentCollisionData re-arms the hitbox and the\
  \ function\n   returns immediately.\n\n4. Reads CollisionData->FlagsFromCollision through\n   oBattleObject_CollisionDataPtr;\
  \ if non-zero the collision was already\n   resolved so the object is destroyed.  Otherwise the byte\
  \ at\n   oBattleObject_CurAction indexes the two-entry jump table at\n   COLLISION_ACTION_TABLE (0x080C5C94,\
  \ entries sub_80C5C9C+1 and\n   sub_80C5D84+1).  The selected handler is dispatched with\n   \"mov lr,pc;\
  \ bx r1\"; it receives r0 = CurAction and r5 = object ptr.\n\n5. The destroy path (loc_80C5C7C) clears\
  \ bit 1\n   (OBJ_FLAG_COLLIDING) in ObjectHeader_Flags, calls\n   object_clearCollisionRegion, then\
  \ sets\n   oBattleObject_CurStateActionPhaseAndPhaseInitialized to\n   CUR_STATE_DESTROY (8), effectively\
  \ removing the object from the\n   collision system.\n\n6. After a successful handler dispatch the function\
  \ falls through to\n   loc_80C5C6A where object_presentCollisionData re-arms the hitbox for\n   the\
  \ next frame.\n\noBattleObject fields touched: CollisionDataPtr, CurAction, CurStateActionPhaseAndPhaseInitialized,\
  \ CollisionSpawnParams (0x34). ObjectHeader field touched: Flags (bit 1). CollisionData field touched:\
  \ FlagsFromCollision.\n"
