open_questions:
- The exact meaning of the two return counts (r1 ready, r2 with-bit-set). The "fast" branch count vs the
  ready-empty count distinction is not used distinctively by every caller; checking how each caller consumes
  r2 vs r1 in the disassembly would settle it.
- Why r3 is unused inside the function. It almost always arrives as 4 (the active slot index) but the
  function reads slots via r4 only - is r3 purely a chip-slot index passed through for the caller's own
  use?
- Whether the unk_20251A0 array is the chip-select entry list or something else (e.g. an animation queue).
