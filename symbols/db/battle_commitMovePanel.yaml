name: battle_commitMovePanel
address: '0x080C72DC'
kind: function
status: probable
summary: Commits a battle object's planned future panel to its current panel coordinates, recomputes pixel
  position and collision/facing, resets its animation, plays sound 0x94, sets action state to 8, and resets
  the phase counter to 0.
interface: (r5 = battle object, implicit) -> void; no return value
details: Copies oBattleObject_FuturePanelX/Y into oBattleObject_PanelX/Y, then calls object_setCoordinatesFromPanels
  to recompute the object's pixel position and object_updateCollisionPanels to sync its collision record/facing
  to the new panel. It resets oBattleObject_CurAnim to 0 and writes 0xFF to oBattleObject_CurAnimCopy,
  which likely forces a sprite animation reload. It plays sound effect 0x94 (presumably the step/slide
  sound), sets oBattleObject_CurAction to 8, and clears oBattleObject_CurPhaseAndPhaseInitialized to 0
  so the new action starts at phase 0. Acts purely through the battle-object pointer in r5; this is the
  landing/commit step of a panel move.
