- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/strb pair copies oBattleObject_FuturePanelX/Y into oBattleObject_PanelX/Y before the two
    object calls; bl object_setCoordinatesFromPanels + object_updateCollisionPanels recompute pixel position
    and collision from the committed panel; anim set to 0 with CurAnimCopy 0xFF is the usual force-anim-restart
    pattern; bl PlaySoundEffect with r0 = 0x94 plays a fixed SFX tied to this transition; writes CurAction
    = 8 and clears CurPhaseAndPhaseInitialized, ending one action and starting another
