open_questions:
- The exact semantics of byte r5+0x14 (pointer deref then mask 0x2) is unclear — could be a "submenu slot
  dirty" flag the parent sets when the cursor moves over a new chip; would settle by walking the few callers
  that write that byte. The mapping in byte_81197F8 is also too sparse to decode without seeing which
  elements actually land in 3..7, but the call-site pattern (palette 0/1/2 are the only normal ones, 3
  is the override) is solid.
