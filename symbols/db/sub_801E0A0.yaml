name: sub_801E0A0
address: '0x0801E0A0'
kind: function
status: hypothesis
summary: Stores two byte parameters into the chatbox state struct, refreshes its counter halfword from the active
  entry, then runs the 0x80 chatbox update path.
interface: void chatbox_setStateAndRunUpdate(u8 r0, u8 r1) // no return value; trashes r0-r3 and c/v flags
details: 'Works on eStruct2035280, the top-level chatbox/text-system struct. It first copies

  the halfword at +0x24 of the struct pointed to by the +0x48 entry (dword_20352C8)

  into eStruct2035280+0x24 (word_20352A4), i.e. refreshes the state''s counter/timer

  field from the currently selected entry. It then stores the two byte arguments

  r0 and r1 at +0x1 and +0x2 of the struct, which look like a mode/state pair or a

  mode plus an argument for the chatbox. Finally it sets R0 = 0x80 and calls

  sub_801BECC (a per-mode setup/update routine) and then dispatch_801DA48

  (a dispatcher over handler IDs, 0x80 = text-box), letting the 0x80 text-box

  path take over with the freshly written state. The caller must pass r0/r1 in;

  r5-r7 are preserved but the routine''s other registers and the c/v flags take on

  whatever the dispatch leaves behind.

  '
