    panel-choosing callback with target object ptr and table words r2/r3; strb r0,[r5,#oBattleObject_FuturePanelX]
    / strb r1,[...Y] then bl object_reservePanel: chosen panel is stored and claimed; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE;
    bl object_setFlag1: object is flagged not to slide, consistent with committing to a panel; index ldrb
    [r5,#oBattleObject_Alliance]; lsl 3; table at byte_80F7CE0: per-alliance 8-byte entries feed the chooser'
