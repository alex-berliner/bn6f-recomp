name: ai_chooseAttackPanel
address: '0x080F7C8C'
kind: function
status: probable
summary: 'AI attack-state step: asks a per-alliance panel-choosing callback for a target panel, reserves
  it and sets up the move/attack, or falls back to a timed no-move wait.'
interface: (r0 = unused, r5 = battle object, r7 = AI attack vars) -> r0 = clobbered; on success sets FuturePanelX/Y,
  reserves panel, sets flag OBJECT_FLAGS_CANNOT_SLIDE, CurAnim=4, StepTimer=6, HasMoved=1, HitElement=4;
  on failure sets AttackDuration=0x1E, StepTimer=1, HitElement=0x18
details: 'First calls object_canMove; if blocked (or the panel choice fails), it takes the fallback branch:
  AttackDuration=30 frames, StepTimer=1, HitElement=0x18 (likely a ''normal/none'' element marker), and
  returns without moving. On the success path it reads the object''s Alliance, indexes byte_80F7CE0 at
  Alliance*8, and loads two words from that entry as extra arguments (r2, r3) for the callback stored
  in oAIAttackVars_PanelChooseCallback, called with lr=pc (long call) and the target object pointer in
  r0. The callback returns a panel coordinate in r0 (nonzero checked) plus r1; these are stored into oBattleObject_FuturePanelX/Y,
  then object_reservePanel claims the target panel so other objects avoid it, and object_setFlag1 sets
  OBJECT_FLAGS_CANNOT_SLIDE on the object. Finally CurAnim=4 (movement/charge animation), StepTimer=6,
  HasMoved=1 and HitElement=4 advance the AI state machine. The 8-byte-per-alliance table at byte_80F7CE0
  appears to hold per-alliance attack pattern data passed to the chooser.'
