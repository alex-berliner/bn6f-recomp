name: ai_chooseAttackPanel
address: '0x080F7C8C'
kind: function
status: confirmed
summary: AI per-turn step that picks a grid panel via an alliance-specific callback, reserves it, and starts the
  slide animation; falls back to a short idle wait if the object cannot move or the callback declines.
interface: '/* r5 = battle object, r7 = AIAttackVars; no meaningful return (r1 left by last callee) */

  void ai_chooseAttackPanel(BattleObject *obj /*r5*/, AIAttackVars *ai /*r7*/);

  '
details: 'Checks object_canMove on r5; if Z is set (cannot move), writes a 30-frame AttackDuration,

  1-frame StepTimer, and HitElement 0x18 as a stall. Otherwise indexes a two-entry per-alliance

  table at byte_80F7CE0 (stride 8: word at +0 = selector arg2, word at +4 = selector arg3) using

  obj->Alliance. Calls the function pointer stored in ai->PanelChooseCallback (indirect bx r1),

  passing r0 = ai->TargetObjectPtr, r1 = callback address, r2/r3 from the table. The callback

  returns r0 = chosen panel X, r1 = chosen panel Y; X == 0 means "decline". On success the

  function stamps obj->FuturePanelX/Y, calls object_reservePanel to lock the panel, sets

  OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, kicks the step animation (obj->CurAnim = 4),

  and advances AI state: StepTimer = 6, HasMoved = 1, HitElement = 4. The decline path mirrors

  the cannot-move fallback (AttackDuration = 0x1E, StepTimer = 1, HitElement = 0x18). The

  per-alliance table only holds two entries (alliance 0 and 1), so alliance values beyond 1

  would read past the array.

  '
