name: sprite_pushStrip_80289E4
address: '0x080289E4'
kind: function
status: confirmed
summary: Pushes an 18-sprite OAM strip (one animation frame) for the object pointed to by r5, computing
  XY origin from the object's column byte and selecting a tile bank from a flag bit.
interface: void sprite_pushStrip_80289E4(uint32_t objPtr); /* r5 in; writes OAM FIFO, clobbers r0-r6 */
details: r5 points to an object/actor state struct. Reads byte at offset 0x1B as a column index; base
  X = 8 + col*16 - 3, base Y = 5. Reads 32-bit flags at offset 0x40, extracts bit 3 to choose tile-bank
  base 0xE792 or 0xE794. Packs XY into a 32-bit value (Y in high half, X in low half). Iterates 18 entries
  (stride 4 bytes, table byte_8028A30 at off_8028A2C) of pre-packed sprite attribute words (X/Y sub-offsets
  + shape/size). Each attribute is combined with the base XY and pushed to the OAM FIFO via fifo_pushRecord16_8009FF8
  with r2=1, r3=0. After the 5th entry (i==0x10) the tile index is incremented by one row, giving two
  tile rows for the latter sprites. r4-r6 are saved on entry and restored, so only the FIFO side-effects
  and the caller-clobbered r0/r1 persist.
