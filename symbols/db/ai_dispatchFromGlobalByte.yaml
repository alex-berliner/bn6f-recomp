name: ai_dispatchFromGlobalByte
address: '0x0813B790'
kind: function
status: probable
summary: 'Thin AI-dispatch wrapper: reads a global byte at 20096D8 and passes it as the dispatch argument
  to the battle AI dispatcher, leaving r0 untouched.'
interface: (r0 = battle object/actor pointer, preserved) -> r0 = dispatcher's return; tail-calls battleObject_runAIDispatchTable_813B7A0
  with r1 = byte_20096D8 value
details: Loads the single byte at byte_20096D8 into r1 and tail-calls the AI dispatcher, which looks up
  the caller's battle object, selects an AIData field (0x8 or 0xc) based on event flag 0x2660+actorIndex,
  and tail-calls a 4-entry thunk table. r0 is forwarded unchanged, so this is a parameter-less wrapper
  whose only input is the global byte — likely an AI routine/variant index set elsewhere by the beast-sp
  AI scripts. All callers are in the same 813B7xx-813Bxxx block (beast sp route), consistent with several
  scripted AI entry points sharing this dispatch helper. No state is written by this function itself.
