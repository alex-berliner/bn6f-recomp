open_questions:
- Exact semantic of r5 (battle_object vs a dedicated submenu/battle-field UI struct) - the offsets 0x02/0x0f/0x10/0x11
  don't match oBattleObject fields cleanly, so it is more likely a small UI/submenu state struct that
  the caller's `r5` convention refers to.
- Why the handler is split into a "horizontal" branch and a "vertical" branch gated on `+0x10 == 1` (this
  likely corresponds to navigating between submenu columns vs adjusting a value, but exact column meaning
  is unknown).
- Whether the chatbox flag 0x40 is just "menu opened/changed" or also drives a submenu fade transition.
