name: sub_801FF18
address: '0x0801FF18'
kind: function
previous_names: []
status: probable
summary: 'Battle link-transfer builder (mode 2): packs each connected player''s input record into the transfer buffers
  dword_203F4A0 / dword_203F5A0, and when no link is connected drains one word of dword_203CBE0 per frame into slot
  eStruct2036780+8, counting down — the no-link loopback that carries the battle seed.'
details: 'Body (asm01.s:194-302): for players 0/1 it records the input state (input_recordStateChangeForEntry_800A0D6),
  copies the held-buttons byte into BattleState +0x14/+0x15 and a halfword into unk_2036120/unk_20362F0 +0x2C, and
  when the record''s signed byte at +4 is >= 0 stores one word into dword_203F4A0 / dword_203F5A0 at the word offset
  record[+4]*4 ("transfer buffer store 1/2"). For the local machine it fills eStruct2036780 (+2 joypad held, +6
  BattleState+0x11, +0xC link_getSlotState_803F740(4)); when net_isLinkConnected_803EA2C() is false it decrements
  eStruct203F7D8+3 and, while it stays >= 0, stores eStruct203F7D8+3 into 2036780+4 and dword_203CBE0[that index]
  into 2036780+8 ("transfer buffer store 3") — one word per frame, highest index first. sub_801FFD6 is the same
  builder for the other mode gate (arg bit 0x8 vs 0x2, bit 0x10 skip).'
