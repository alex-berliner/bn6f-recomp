name: battle_updateQuakePanelByPhase
address: '0x080BEFE2'
kind: function
status: probable
summary: Dispatches the current battle object's Quake Panel phase to its phase-specific update routine.
interface: (r5 = battle object with CurPhase) -> returns via selected handler; flags become those of the
  selected handler
details: Uses the battle object's CurPhase byte to index a three-entry function-pointer table and tail-jumps
  to the selected Thumb routine. The observed cases are sub_80BF000, battle_updateQuakePanelAttackObject,
  and sub_80BF0F8. The phase bounds and specific meanings of the first and third routines are not shown
  here.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly reads [r5,#oBattleObject_CurPhase] and uses it directly as the table index.; The table
    contains exactly three phase handlers at off_80BEFF4.; The selected address is installed into lr and
    executed with bx r1, making this a dispatcher rather than a worker.; One indexed target is the known
    battle_updateQuakePanelAttackObject routine.
  refs:
  - bn6f/asm/asm31.s:15922
  reproduce: python3 tools/asmcat.py 0x080BEFE2
  result: 'proposed by minimax/MiniMax-M3, self_score 4; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-004802'
open_questions:
- What phases and actions do sub_80BF000 and sub_80BF0F8 implement?
- Is the three-entry table a jump table embedded immediately after this function, or part of a larger
  phase-handler structure?
