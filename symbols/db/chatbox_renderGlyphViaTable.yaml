name: chatbox_renderGlyphViaTable
address: '0x08127578'
kind: function
status: probable
summary: Tail-call shim that preloads a fixed table pointer into r6 and jumps into the chatbox glyph renderer.
interface: (args as chatbox_renderGlyph_8127580) -> r6 = dword_86B7AE0, then tail-jumps to chatbox_renderGlyph_8127580;
  returns/flags as that callee.
details: The whole body is push {r4-r7,lr}; ldr r6,=dword_86B7AE0; b chatbox_renderGlyph_8127580. It exists
  only to supply r6 — presumably a glyph/bitmap lookup table or base pointer — before entering the shared
  glyph renderer, which otherwise must receive r6 from its caller. Because it pushes lr without ever popping,
  the branch is a tail call and the renderer returns directly to this function's caller. Callers are the
  event-163 chatbox progress handler and the PET Navi intro stat-line printer, both text-drawing contexts,
  so this variant selects a particular glyph source used by those texts. The pushed registers are saved
  for the callee's benefit, not used locally.
