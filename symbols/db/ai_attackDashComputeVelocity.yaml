name: ai_attackDashComputeVelocity
address: '0x080F146E'
kind: function
status: probable
summary: Sets the AI object's dash X-velocity to traverse |target_col - current_panel| * 40px / duration
  panels in |duration| frames facing-aware, and stores the duration as the advance-step timer.
interface: (r0 = dash duration in frames, r5 = battle object, r7 = AI attack vars) -> r0 = velocity (16.16
  fixed point) stored to oBattleObject_XVelocity; r0 also stored halfword to oAIAttackVars_StepTimer;
  flags from division
details: Gets the facing multiplier via object_getFrontDirection and multiplies it into the velocity,
  so the sign of the input frames (or front direction) picks slide direction. Target column is 7 for an
  Alliance==0 (player-side) object, else 0; the distance is |target - oBattleObject_PanelX|. That distance
  is scaled by 0x28<<16 (40 pixels per panel in 16.16 fixed point) and divided (SWI 6) by the input frame
  count, giving a per-frame velocity that reaches the far edge of the field exactly when the timer expires.
  The same frame count is saved into oAIAttackVars_StepTimer so the dash advance step knows when to stop
  sliding.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection then mul r0,r4 and str to oBattleObject_XVelocity sets signed per-frame
    velocity; ldrb Alliance; mov r0,#7 / #0 minus PanelX with abs computes distance to column 7 or 0;
    r2 = 0x28<<16; mul r0,r2 converts distance to 16.16 fixed-point pixels (40 px/panel); svc 6 with r1=r4
    divides scaled distance by the frame-count argument; strh r0,[r7,#oAIAttackVars_StepTimer] stores
    the duration used by ai_attackDashAdvanceStep'
