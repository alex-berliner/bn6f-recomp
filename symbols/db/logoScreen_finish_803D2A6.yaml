name: logoScreen_finish_803D2A6
address: '0x0803D2A6'
kind: function
status: confirmed
summary: Wraps up the logo screen by restoring the normal LCD render mode (0x40) and reinitializing the shared screen-start
  state.
interface: '(self: *const LogoScreenState in r5) -> void; callers pass r2, r3, r10, lr; r2/r3 preserved, r0/r1 and
  NZCV left as the last callee set them'
details: "Tear-down/transition callback for the logo screen state (self in r5, unused by the body).\nTwo calls only:\n\
  1. SetRenderInfoLCDControl(0x40) — writes 0x40 into the render-info LCD control field,\n   which is the normal\
  \ (non-transition) display mode; presumably undoing whatever special\n   LCD mode the logo screen used (e.g. for\
  \ fade/green-swap effects).\n2. startScreen_init_802F530() — reinitializes the shared start-screen state, setting\
  \ up\n   whatever screen follows the logo.\nSelf (r5) is passed through untouched by this function itself, so\
  \ the state pointer is\npresumably consumed by startScreen_init via a shared register convention. The listed\n\
  \"outputs\" (r0/r1, flags) are simply whatever the last callee left behind; no explicit\nreturn value.\n"
