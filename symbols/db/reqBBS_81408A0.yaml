name: reqBBS_81408A0
address: '0x081408A0'
kind: function
status: confirmed
summary: Marks a BBS (request board) request as accepted/completed by setting its event flag.
interface: u32 reqBBS_setRequestFlag(u32 requestIndex /* r0 */, u32 flagBase /* r10 */); returns r5 (pass-through)
details: 'Called with a request index in r0 and the event-flag word base in r10. It loads a fixed flag-ID offset
  from reqBBS_textualPointers+0x10 (pointing into byte_813F354+8) and adds it to the request index to get the actual
  event flag id, then tail-calls SetEventFlag(r0=flagId, r10=flagWordBase) to set the flag for that board request.
  r4-r7 are saved/restored; the returned r5 is just the caller''s saved value passed through untouched, so it is
  not a real result. Used by the request-board (BBS) system so completed request flags persist in the event-flag
  table.

  '
