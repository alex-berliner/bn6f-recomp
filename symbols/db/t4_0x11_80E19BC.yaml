name: t4_0x11_80E19BC
address: '0x080E19BC'
kind: function
status: confirmed
summary: Dispatches a battle object's current-state handler through a 3-entry jump table (called from t4_0x11, R5
  = battle object).
interface: 'void battle_object_dispatchCurState_80E19BC(void);

  // in:  r5 = battle object ptr (THUMB t4_0x11 caller)

  // out: r5, r8-r12 preserved by callee convention; NZCV + r0-r4,r6-r7,r11 clobbered

  // Reads: [r5 + oBattleObject_CurState] (u8 index into JumpTable80E19CC)

  //       JumpTable80E19CC[i] -> THUMB handler (+1 set in THUMB BX convention):

  //         0 -> battle_objectSetTimerFromParam1Table_80E19DC

  //         1 -> sub_80E19F4

  //         2 -> battle_object_freeWithPhaseReset_80E1A5E

  '
details: 'A trivial THUMB "case-dispatch" shim: pushes lr, loads the static jump-table base

  JumpTable80E19CC_p (stored immediately after the pop {pc} into .word JumpTable80E19CC),

  indexes it with the u8 battle-object state byte at r5+oBattleObject_CurState to fetch a

  raw 32-bit code address, sets lr = pc, and BX''s into it (the +1 bit selects THUMB mode).

  On return it pops pc to return to its THUMB t4_0x11 caller. Because the dispatcher is

  stored and dispatched as a raw code pointer rather than a function pointer through the

  usual FUNCPTR slot, this is a hand-rolled switch in the engine''s battle-object state

  machine; state 0 routes to a "set timer from param1" handler, state 1 to an inlined/

  local worker sub_80E19F4, and state 2 to a phase-reset free destructor

  battle_object_freeWithPhaseReset_80E1A5E. The "t4_0x11" prefix indicates it is reached

  only from the t4 caller slot index 0x11 in whatever owner vector calls into it.

  '
