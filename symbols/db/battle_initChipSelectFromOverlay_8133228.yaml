  detail: '- "bl ZeroFillGFX30025c0" right after function entry confirms BG tile ID block reset. - "mov
    r0, #0x10; bl toolkit_applyOverlayPalette_80015FC" loads palette/tile slot 0x10. - The halfword 0x1F40
    stored at RenderInfo+0 then six zero halfwords through +0x1A matches the render-info fade layout (RenderInfo
    struct has Unk_00..Unk_1a fields). - "bl battle_resetEStructRecords_8046664" matches its confirmed
    role of resetting the scene-record array. - The big unconditional zero block strh/strb/str r0,…,[r5,#off]
    zeroes everything consistent with a chip-select state init. - "bl sub_8120CC8" with r0=0, r1=off_813336C
    (= dword_81331FC) is the table-lookup-then-default helper. - The branch on submenu_isOpen_81355D8
    picks between "submenu open" (overlay) and "main menu / normal" flows: the open branch copies unk_20251A0
    -> unk_20376AC (0x3C bytes) then calls sub_811FCA4 (chip-pack builder variant that always succeeds
    or returns 1). - battle_buildChipPackFromFolderEntries_811FCB8 and sub_811FDB8 both fold in submenu_isOpen_81355D8
    == false path, and the success path goes through buildChipSearchTable_811FE7C + battle_fieldLockDispatch_8120018
    with mode 7. - "ldr r1, [r10,#0x40]; mov r0, #7; strb r0, [r1,#2]; mov r0, #0; strb r0, [r1,#3]" stores
    7 into a "command queue" style slot reachable through r10 (toolkit). - registerBattleStartScript_81355EC
    is invoked only in the no-submenu branch, matching its role. - Final "mov r0, #4; strb r0, [r5,#1];
    pop …" writes 4 into r5''s curSubscreen byte (BattleState+1 is the subsystem/jump-table index per
    struct definitions). - The struct being mutated is keyed off r5 (battle overlay state) with offsets
    0x1..0x64 consistent with a chip-select screen struct that lives just before/inside the chip-select
    subsystem state.'
