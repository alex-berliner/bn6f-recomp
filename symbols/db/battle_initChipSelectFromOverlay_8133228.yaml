name: battle_initChipSelectFromOverlay_8133228
address: '0x08133228'
kind: function
previous_names:
- sub_8133228
status: probable
summary: Initializes the chip-select screen state from the overlay's "submenu open" branch, building the
  chip pack, decompressing screen assets, and switching state to view 4.
interface: '(r5 = BattleState-like overlay state, r10 = Toolkit) -> r0 = 4 ; side effects: zeroes large
  IWRAM buffers, clears BG tile data, kicks off the chip-pack/chip-search table builds, runs a chatbox
  script, runs the "Battle Start" script, and sets r5->curSubscreen = 4.'
details: "- Calls ZeroFillGFX30025c0 to reset the toolkit's 0x2000-byte BG tile ID block.\n- Calls toolkit_applyOverlayPalette_80015FC\
  \ with palette slot 0x10, then writes 0x1F40 into RenderInfo+0 and zeroes RenderInfo+0x10..+0x1A (six\
  \ halfword fades/sizes).\n- Calls SetScreenFade(8, 0x10) and battle_resetEStructRecords_8046664 to reset\
  \ overlay scene records.\n- Zeroes a wide swath of the r5 \"battle-chip-select state\" struct: halfword\
  \ 0x18, 0x1A, 0x20, 0x22, 0x24, 0x26, 0x2A, 0x2C, 0x2E, 0x30, 0x34, 0x36, 0x38, 0x3A; byte 0xE, 0xF,\
  \ 0x10, 0x11; word 0x44, 0x48, 0x4C, 0x64.\n- Looks up an index into dword_81331FC via sub_8120CC8(0,\
  \ off_813336C), shifts the result left by 4, ORs with the index, and writes the byte into r5+0x12, 0x13,\
  \ 0x15, 0x16 (panel/packaging fields). Sets a halfword 0x1E = 0x1E, byte 0x17 = 0x1E, halfword 0x1C\
  \ = 0xFFFF, words 0x5C and 0x60 = 0xFFFF, word 0x64 = 0.\n- Branches on submenu_isOpen_81355D8:\n  *\
  \ If a submenu (other than 0x20) is open: CopyBytes(unk_20251A0 -> unk_20376AC, 0x3C), then sub_811FCA4(word_202A020,\
  \ 1, unk_20343E0). On non-zero result (or fallback) loads sub_8133EC0, runs chatbox script 0, clears\
  \ word_202A020 via battle_ClearBuffer_811FE34, zero-fills unk_202A3E0 with zeroFill_0xA000Words_811FF6C,\
  \ sets r5[2] = 8 (goto loc_8133338). Otherwise jumps to loc_81332D6 which falls into the same exit path.\n\
  \  * If no submenu: builds the chip pack with battle_buildChipPackFromFolderEntries_811FCB8(r5[0xC],\
  \ word_202A020, 0, unk_20343E0). If the build reports 0 chips, takes the loc_81332F2 branch (no submenu\
  \ again): sub_8133EC0, submenu_isOpen_81355D8 check, zeroFill_0xA000Words_811FF6C(unk_202A3E0, 0), and\
  \ r5[0x28] = 0 (skip search-table build).\n  * If the chip pack built successfully: sub_8133EC0, sub_811FDB8(r5[0xC]);\
  \ if it returns 0 build the search table via buildChipSearchTable_811FE7C(unk_202A3E0, 0) and store\
  \ the count at r5[0x28]; then call battle_fieldLockDispatch_8120018(unk_202A3E0, count, 7, 0); also\
  \ write 7 into a slot retrieved from [r10+0x40]+2 and 0 into that same slot+3 (probably an \"unprocessed\
  \ list\" sentinel in the toolkit queue). Otherwise fall back to loc_81332D6 (chatbox path).\n- Tail:\
  \ sub_81340AC, sub_81340DC; if no submenu, also runs battleObject_handleMoveAlignment_81352A0(word_202A020,\
  \ byte_8133154, 0xA5, 0x28, 4) and registerBattleStartScript_81355EC. Finally calls battle_setFieldsFromObj_81340FC\
  \ and writes 4 into r5[1] before popping.\n"
