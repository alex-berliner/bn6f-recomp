open_questions:
- Exact identity of the r5 struct (chip-select screen struct vs. a battle-overlay wrapper). The wide offset
  range 0xE..0x64 plus the writing of 0x4 into r5[1] strongly suggests a per-screen state whose top byte
  is a jump-table index.
- What unk_20376AC vs unk_20251A0 vs unk_202A3E0 vs unk_20343E0 actually represent (likely overlay scratch
  + chip-pack + chip-search tables).
- The role of sub_811FCA4 vs battle_buildChipPackFromFolderEntries_811FCB8 (the former likely skips VRAM
  compensation, hence the "submenu open" path that already has VRAM and just re-uses the existing pack).
- The semantics of the field "r5+0x12..0x16" being written with the same value (panel/row sentinel).
