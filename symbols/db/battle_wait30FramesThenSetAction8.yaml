    and 4 into PhaseInitialized (80BFBFC-80BFC09); ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh;
    bgt: frame-countdown loop until timer hits zero (80BFC0A-80BFC10); on expiry, mov r0,#8; strb r0,[r5,#oBattleObject_CurAction]
    and zeroing CurPhaseAndPhaseInitialized transitions the state machine (80BFC12-80BFC18); r5-based
    access with no r0 argument use matches the project''s battle-object phase-handler calling convention;
    no known callers or callees, so the owning entity and meaning of action 8 are unconfirmed'
