name: battle_wait30FramesThenSetAction8
address: '0x080BFBFA'
kind: function
status: probable
summary: Per-frame update for a battle object (r5) that initializes a 30-frame timer on first call, then
  transitions the object to action 8, phase 0 when the timer expires.
interface: (r5 = battle object ptr) -> void; no return value
details: Per-frame update for a battle object passed in r5. On the first call (oBattleObject_PhaseInitialized
  == 0) it initializes oBattleObject_Timer to 0x1E (30 frames) and sets PhaseInitialized to 4. Each call
  then decrements Timer; while Timer > 0 it returns. When the countdown expires it writes 8 to oBattleObject_CurAction
  and clears oBattleObject_CurPhaseAndPhaseInitialized to 0, moving the object's state machine to action
  8, phase 0. The trailing dword_ constants look like unrelated pool data for neighboring code.
