summary: 'Saves the game: copies the 0x6710-byte EWRAM block 0x02000000-0x0200670F (both RNG seeds, mystery
  data, event flags, chip pack, ...) to the save.'
details: 'The main save routine: sub_814D8F0 copies 0x6710 bytes from timer_2000000 to the save destination
  (0x0E001000 area), covering everything the game persists - both RNG seeds, mystery-data rolls, event
  flags, the chip pack and the rest of the 0x02000000-0x0200670F window. iCurrFrame (0x0200A210) lies
  outside the block and is not saved.'
