name: zeroFill_e2002230
address: '0x08021C68'
kind: function
status: confirmed
summary: Zero-fills the 0xF00-byte extra work-RAM block whose pointer is held in the toolkit struct.
interface: void zeroFillExtraWorkRam_e2002230(void); /* reads r10 (toolkit base), preserves r2/r3, returns caller's
  r3 unchanged */
details: Loads the toolkit pointer at r10+oToolkit_Unk2002230_Ptr, then calls ZeroFillByWord with that pointer as
  the destination and the constant 0xF00 (dword_8021C78) as the byte count, clearing the whole block to zero. r0
  and r1 are clobbered by the call setup; r2 and r3 are preserved and r3 is passed back unchanged, so callers can
  rely on it surviving the call. This is a scratch-memory reset, most likely used to wipe the game's secondary work
  area between frames or on scene transitions; the block's actual purpose is not yet identified (field named Unk2002230).
