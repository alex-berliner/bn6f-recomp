summary: Runs the battle object's update routine (r1->r0,r3) and stores the returned charge-time byte
  into AIData.PwrAtkCurChargeTime (r1+0x1b).
interface: (r0 = BattleObject*, r1 = AIData*) -> r0 = BattleObject*, flags untouched ; no side effects
  beyond the strb at r1+0x1b
details: "Thin trampoline: `mov r12, lr` / `bl battleObject_runUpdateRoutineAndAdvancePC_814E0D0` / `strb\
  \ r3, [r1, #0x1b]` / `bx r12`.\n  `sub_814E0D0` takes (r0=obj, r1=aiData) and returns r0=obj, r3=some\
  \ byte. This wrapper just persists r3 into AIData offset 0x1b, which the AIData struct labels as `PwrAtkCurChargeTime`.\n\
  \  All callers come from `sub_814E36D` (lr = 0814e36d in every captured snapshot) with r0 = 02010890\
  \ (a BattleObject), r1 = various AIData structs (02007ee8 / 02007f38 / 02007f88), r2 = a script/cursor\
  \ pointer (0818d97d / 0818dfe8 / ...), and r3 = 0814e211 (the +1 form of this function's address, i.e.\
  \ thumb switch via blx-on-lr).\n  Exit always restores r0 to the BattleObject pointer, so callers re-use\
  \ the same BattleObject afterward.\ndetails: |\n  The `bx r12` (not `bx lr`) is unusual; the function\
  \ saves lr into r12 up front and returns via r12 to avoid a Thumb/ARM veneer issue, since the routine\
  \ must tail-call back through the same path as the caller's lr (which is 0814e36d for every snapshot).\n"
