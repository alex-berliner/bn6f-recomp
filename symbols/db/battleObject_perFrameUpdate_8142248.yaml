summary: 'Per-frame battle object update: clears a one-shot scenario flag, dispatches AI, and refreshes
  sprites.'
interface: () -> r0 = 0 (always returns 0)
details: "Loads address eScenarioEffectState2000780 into r5. Calls sub_81422BE which returns Z in flags\n\
  \  indicating whether the scenario effect state is \"active\". If inactive (bne to loc_8142272),\n \
  \ jumps straight to the trailing call. If active, checks byte at +0x3 (eScenarioEffectState2000783);\n\
  \  when non-zero it writes 0 to that byte (one-shot clear) and then calls sub_80468BA (no-arg)\n  followed\
  \ by sub_80468C6(r0=3, r1=0, r2=0). It then falls through to call\n  battle_callAIDispatch_8046818 and\
  \ battleObject_updateSpriteGfxForAll_8046854. Always calls\n  sub_8142C90 and returns 0. Lives in bn6f/asm/asm37_1.s:988\
  \ with callee names that read\n  \"battle\" (AIDispatch, spriteGfx for all) and a sub_8142C90 helper.\
  \ Likely invoked once per\n  frame from the battle subsystem dispatcher.\n"
