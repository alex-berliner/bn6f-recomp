    - `strb r0, [r5,#0x3]` at 0x0814225A clears that flag (one-shot pattern). - `bl sub_80468BA` then
    `bl sub_80468C6` with r0=3,r1=0,r2=0 at 0x0814225E..0x08142266: a paired "set state then dispatch"
    pair used by the engine elsewhere. - `bl battle_callAIDispatch_8046818` and `bl battleObject_updateSpriteGfxForAll_8046854`
