summary: 'Proposed name: spriteWhiteSquareHole. ROM sprite image data for a navi-battle sprite (slot 0x59)
  that renders as a small white square/hole, used as a placeholder in off_8031FA4''s naviBattleSpritePtrs
  table. (struct)'
details: 'Sits in the sprite asset region of BN6F''s ROM and is one entry of the naviBattleSpritePtrs
  table off_8031FA4, indexed by sprite slot id (this label is the 0x59th entry). Its byte pattern is the
  standard 4bpp GBA sprite tile header shape: a small flag/variant word, a size field, and tile-data +
  palette pointers, so the assembler treats it as a sprite of a given tile-count and points OAM at it
  just like the sibling sprite_8395660 / sprite_8396650 entries. It is 3720 bytes long, far larger than
  spriteWhiteDot; this is the actual tile pixel data and a partial palette, not a placeholder sprite.
  Most rows are inside a contiguous block of binary sprite assets numbered slot 0x59; only this single
  label is referenced from the visible instruction sites (1 site).'
