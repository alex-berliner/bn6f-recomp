open_questions:
- What sub_80C46CC and the two CurAction handlers (sub_80C461C, sub_80C464C) actually do; whether the
  0x10000 subtraction is panel-grid compensation or a specific coordinate-space shift.
- Whether CurAction indices beyond the two in off_80C4614 ever reach this code, or if they're clamped
  upstream.
