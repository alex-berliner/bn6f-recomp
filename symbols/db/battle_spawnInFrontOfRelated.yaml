name: battle_spawnInFrontOfRelated
address: '0x080E7AB0'
kind: function
status: probable
summary: Places the battle object at its RelatedObject1's X/Y/Z, with X pushed 16 px toward the object's
  facing direction.
interface: (r5 = battle object) -> r0 = ...; no flags of note
details: Calls object_getFrontDirection to get +1/-1 based on the object's alliance side and DirectionFlip,
  multiplies it by 0x10 (16 px, half a panel), and adds it to the RelatedObject1 pointer's oBattleObject_X16,
  storing the result into this object's X. It then copies RelatedObject1's Y16 and Z16 fields verbatim
  into this object's position fields. So the object is spawned/placed one half-panel in front of its related
  object, aligned on the other axes. Called from battle_initSpriteEnterUpdate as part of placing a sprite-enter
  battle object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getFrontDirection then mul r0,#0x10 gives the signed 16-px facing offset (asm lines
    3-5); ldr r1,[r5,#oBattleObject_RelatedObject1Ptr] reads the related object whose position is copied;
    strh r2,[r5,#oBattleObject_X16/Y16/Z16] writes all three position fields on r5's object; caller battle_initSpriteEnterUpdate
    transitions the object to CUR_STATE_UPDATE after setup, fitting a placement helper
  refs:
  - bn6f/asm/asm31.s:102855
