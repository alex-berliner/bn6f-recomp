name: clock_breakPlayTimeIntoHMSF_8000DE0
address: '0x08000DE0'
kind: function
status: confirmed
summary: Splits the play-time frame counter into hours, minutes, seconds and leftover frames via three BIOS divisions.
interface: Next sub_8000DE0(u32 totalFrames /* r0 */) -> hours /* r0 */, minutes /* r1 */, seconds /* r2 */, frames
  /* r3 */
details: 'Takes a total frame count (the in-game play-time counter runs at 60 fps) and converts it to clock units
  using the BIOS division SWI (svc 6, quotient in r0, remainder in r1). First divides by 0x34BC0 (216000 = frames
  per hour) to get hours, then the remainder by 0xE10 (3600 = frames per minute) to get minutes, then that remainder
  by 0x3C (60 = frames per second) to get seconds, with the final remainder being leftover frames. Returns hours
  in r0, minutes in r1, seconds in r2, frames in r3. The r2/r3 values callers pass in are irrelevant since Div ignores
  them and the function overwrites both with the last division results. Uses a 0x10-byte stack scratch area to hold
  intermediates across SWI calls, which clobber registers.

  '
