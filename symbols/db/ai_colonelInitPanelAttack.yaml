name: ai_colonelInitPanelAttack
address: '0x0810161A'
kind: function
status: probable
summary: 'Initializes Colonel''s AI state for a panel-targeting attack: resets the oAIAttackVars block,
  picks difficulty tier, stores target and attack id, then switches the object to attack state 0xA.'
interface: (r0 = attack boost flag/param, stored into oAIAttackVars_AttackBoost2) -> void; no return value
  (r4,lr saved)
details: Writes the caller-supplied byte to oAIAttackVars_AttackBoost2, then calls battle_getAiDifficultyTier
  and stores the tier, clearing oAIAttackVars_InitFlag as 'not yet initialized'. It fills the remaining
  oAIAttackVars fields via sub_810176E (cleared with 0), sub_8101498 (AttackDuration), and sub_81014AC
  (TimerOrCycles), and stores sub_81038A4+1 as PanelChooseCallback, implying the attack needs panel selection
  logic. It resolves the target via battle_findPlayer with the object's Alliance EOR 1 (the opposing player)
  into oAIAttackVars_TargetObjectPtr, then calls object_setAttack0(0xA) to enter the attack state. Callers
  are the Colonel AI step, which guards states 1-3 and uses RNG&1+1 to pick 1-or-2 before calling this,
  consistent with entering one of Colonel's scripted attacks.
