name: object_startFlinchState
address: '0x08111846'
kind: function
status: probable
summary: 'Puts a battle object into its hit/flinch reaction: cancels its current action, commits its planned
  panel move, and switches to the flinch animation.'
interface: (r5 = battle object pointer, r0/r1/r2 unused on entry) -> void; sets byte[0x69]=1 while flinching
details: Runs only if the object is alive (HP != 0), lacks ObjectFlags1 bit 0x80000000, and its collision
  data reports incoming collision flags with bits 0xA00 set, gated by byte[0x69] which acts as a re-entry
  guard. It reads HitModifierFinal & 0x14 to pick r1=0/1 and calls sub_80BCB12 (likely hit-flash or reaction
  setup), then wipes ExtraVars, clears ObjectFlags2 bit 0xC, zeroes AIType, and copies FuturePanelX/Y
  into PanelX/Y so a queued step is completed, releasing the reserved panel and recomputing pixel coords
  and collision panels. It clears ObjectFlags1 bits 0x501040 (invulnerability/invisibility-type flags),
  tears down the current AI attack via object_exitAttackState, and cancels any PendingStateAction by replacing
  it with the current state/phase word. Finally it sets CurAnim = 3 (the flinch/hurt animation) and sets
  the byte[0x69] flag so the state isn't re-entered.
