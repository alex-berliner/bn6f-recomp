name: sub_811BD88
address: '0x0811BD88'
kind: function
status: confirmed
summary: PET-screen sprite state — picks which navi sprite bank to show (selected navi, or stats + optional progress
  offset) and hands control to its update phase.
interface: void sub_811BD88(void *petObjState /* r5 */)
details: "Object state (r5):\n  [r5+0x0] = 1   (state phase marker: state entered)\n  [r5+0xC] = chosen sprite slot\
  \ (u32)\n  [r5+0x8] = 4   (next handler/dispatch id, consumed by sprite_dispatchObjectUpdate_811BDCC)\nSlot selection\
  \ logic:\n    * If GetCurPETNavi() != 0 → slot = naviId + 0xB  (the \"selected navi\" bank).\n    * Otherwise\
  \ base slot = GetCurPETNaviStatsByte(0, 0x17);\n      and if the byte at 0x200AD04 is non-zero AND EVENT_163 has\
  \ NOT been\n      triggered yet, 0x17 is added to the base slot (the post-event alternate bank).\n  Internally\
  \ the candidate is built in r4/r0, then stored via ST32 at r5+0xC.\nCalls sub_811BE1C, then arms the object's\
  \ next update handler by writing 4\nto [r5+0x8] and tail-calling sprite_dispatchObjectUpdate_811BDCC.\nClobbers\
  \ r0,r1,r2,r3,r6,r7,r8,r9,r10,r11,r12; saves only r4 around the call.\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
