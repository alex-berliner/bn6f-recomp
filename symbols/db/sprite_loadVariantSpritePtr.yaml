- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#5] + lsl #2 + ldr r0,[r1,r0] indexes a per-variant pointer table; str r0,[r5,#0xc]
    writes the result into the sprite object header at +0xC; table pointer off_81175B8 = off_811735C,
    same area as other variant sprite data; caller sprite_initVariantObject uses the same [r5+5] variant
    byte for palette/tile-slot selection'
