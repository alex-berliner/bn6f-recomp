name: sprite_loadVariantSpritePtr
address: '0x081175AC'
kind: function
status: probable
summary: Loads the sprite-data pointer matching the entity's variant byte into the sprite object's field
  +0xC.
interface: (r5 = sprite object, byte [r5+5] = variant index) -> r0 = selected pointer, stored to [r5+0xC];
  no flags
details: Reads the variant index from byte [r5+5], scales it by 4 to index the pointer table at off_811735C,
  and stores the fetched word at [r5+0xC] of the sprite object. This mirrors sprite_initVariantObject,
  which uses the same byte [r5+5] to pick a palette bank and tile-slot offset, so +0xC presumably holds
  that variant's sprite/resource pointer. Trivially a two-load helper, inlined tail-call style (mov pc,
  lr). The table at 0x0811735C is shared with other variant-selection code.
