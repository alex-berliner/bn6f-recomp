name: battle_spawnType1BStrike
address: '0x080E85FA'
kind: function
status: probable
summary: Spawns and initializes the type-0x1B strike effect used by the enemy AI front-step attack.
interface: (r0 = parentBattleObjectPtr, r1 = x, r2 = y) -> r0 = spawnedBattleObjectPtr or 0
details: Calls the type-4 object-spawn wrapper with object type 0x1B and the supplied position. If allocation
  succeeds, initializes the new battle object, then stores the parent pointer at oBattleObject_ExtraVars+0xC.
  Its sole caller saves the returned effect in oBattleObject_RelatedObject1Ptr and waits for that pointer
  to become null. The exact meaning of ExtraVars+0xC is not identified independently, though the parent
  pointer is the consistent interpretation.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 0x080EC098-0x080EC0A4 loads type 0x1B and the parent object pointer in r7, calls this function,
    and stores its result in RelatedObject1Ptr.; The assembly loads object type 0x1B and calls object_spawnType4,
    matching a specialized type-0x1B spawn.; On successful allocation, BasicBattleObjectInitialize runs
    and the original r7 parent pointer is stored at ExtraVars+0xC.; Failure is propagated by returning
    the spawn wrapper's null result without initialization.
