open_questions:
- Why r1 is ever written with the XORed Unk_0d value when the documented sub_800AC20 contract
- treats r1 as the second category arg; the call site at 0x0800afb4 is "bl sub_800AC20" so r1 is
- passed verbatim. Need sub_800AC20's body to confirm it uses r1 in the bit-0x8 path.
