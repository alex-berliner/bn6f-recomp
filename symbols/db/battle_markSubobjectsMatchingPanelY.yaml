name: battle_markSubobjectsMatchingPanelY
address: '0x080C78F8'
kind: function
status: probable
summary: Iterates the 3 sub-entry slots at r5+0x64..+0x6C and, for each whose +0x13 panel Y matches RelatedObject1Ptr's
  oBattleObject_PanelY, writes 4 to the sub-entry's state byte at +0xB. Returns 4 in r0.
interface: (r5 = battle object pointer, no used args in r0-r3) -> r0 = 0; clobbers r0-r3, no flags relied
  on
details: Iterates three pointers at r5+0x64, +0x68, +0x6C (loop index *4 + 0x64). For each non-null pointer
  it loads the battle object's RelatedObject1Ptr, reads that object's oBattleObject_PanelY, and compares
  it with byte +0x13 of the sub-entry, which is evidently that entry's panel Y. On a match it writes 4
  to the sub-entry's state byte at +0xB. The entries look like a fixed-size (3-slot) list of tracked panels/entities
  owned by the object; state 4 likely activates or triggers them. The caller apparently invokes it with
  the object in r5 (dispatcher-style), since r0-r3 are never read.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1,[r5,r1] with index*4+0x64 loops exactly 3 slots (add r3,#1; cmp r3,#3; blt); ldr r0,[r5,#oBattleObject_RelatedObject1Ptr];
    ldrb r0,[r0,#oBattleObject_PanelY] takes the row from the linked battle object; ldrb r2,[r1,#0x13];
    cmp r0,r2 compares the sub-entry's stored panel Y with that row; mov r0,#4; strb r0,[r1,#0xb] writes
    state 4 into the matched sub-entry's status byte; caller sub_80C7484 and the 'battlesweep' route place
    it in battle-object update code
