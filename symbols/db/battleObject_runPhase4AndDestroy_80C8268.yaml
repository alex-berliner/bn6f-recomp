name: battleObject_runPhase4AndDestroy_80C8268
address: '0x080C8268'
kind: function
status: confirmed
summary: Battle-object phase-4 runner — seeds timers from Param2 on first entry, ticks down each frame,
  dispatches the Param3 sub-handler while it remains positive, then transitions the object to the destroy
  state.
interface: 'void sub_80C8268(void); /* in: r3 r5 lr (r5 = battle object) */ /* out: r5 */ /* clobbers:
  nz c v r0 r1 r2 r3 lr */ /* preserves: r4 r5 r6 r7 */'
details: 'Operates on the caller''s battle-object record at r5 using offsets oBattleObject_CurPhase,

  oBattleObject_Param2, oBattleObject_Param3, oBattleObject_Timer, oBattleObject_Timer2 and

  oBattleObject_CurStateActionPhaseAndPhaseInitialized. On first entry (CurPhase == 0) it sets

  CurPhase = 4, calls sub_80C832E(Param3), copies Param2 into Timer (16-bit), sets Timer2 = 1,

  and calls sub_80C82D0 as a one-shot setup. Each frame it decrements Timer by 1 and, using the

  original signed BLE, while the new value is > 0 it calls sub_80C8310(Param3); once it has

  expired it writes CUR_STATE_DESTROY into CurStateActionPhaseAndPhaseInitialized so the

  object is reaped.

  Quirks: the BLE that guards the destroy branch compares the pre-store (timer - 1) against

  1 with the carry/overflow flags, so expiry triggers when the decremented value falls to 0

  or below; Timer2 is initialised to 1 but never read in this function (likely consumed by

  one of the sub-handlers).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
