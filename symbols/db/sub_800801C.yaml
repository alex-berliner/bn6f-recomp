summary: Battle-object state dispatcher (per-frame tick of an object's state timer/handler).
interface: "void sub_800801C(void /* pass-through r2 r3 r4 r6 r7 r10 lr */);\n  returns nothing explicit; r0 = byte\
  \ at object+4 (0x203CA74); r2..r12 clobbered;\n  nz/c/v flags clobbered; r5 preserved (via push {r5,lr} / pop\
  \ {r5,pc}).\n"
details: 'Reads the state byte at dword_203CA70 (offset 0), uses it as a byte-scaled index

  into the jump table at off_8008038 (10 entries: sub_800840C, sub_8008064,

  sub_80080D2, sub_80081A4, sub_800825A, sub_80082DC, sub_800834A, sub_80083E4,

  sub_8008452, battle_objAdvanceStateTimer_8008492) and tail-bx''s through it,

  loading R0 with the state byte and R5 with the object base. After the handler

  returns, runs the shared helper sub_802DE5C (likely post-state housekeeping /

  timer advance), then loads the byte at object+4 (byte_203CA74) into R0 as the

  call''s return value. The base pointer dword_203CA70 names suggest this is a

  per-frame dispatch into one of ten "object state machine" phases for an entity

  in battle (possibly the current battle-object''s sub-state).

  '
