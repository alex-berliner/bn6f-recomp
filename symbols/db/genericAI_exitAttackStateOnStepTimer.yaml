name: genericAI_exitAttackStateOnStepTimer
address: '0x0810B2AE'
kind: function
status: probable
summary: AI attack-state handler that counts down the object's StepTimer and exits the attack state when
  it reaches zero
interface: (r7 = battle object, oAIAttackVars_StepTimer used) -> none; no return value used
details: Each call loads the halfword at r7+oAIAttackVars_StepTimer, subtracts 1, and stores it back.
  If the result is nonzero it returns immediately; when the timer hits zero it calls object_exitAttackState
  (via bl) to end the object's attack state. It touches only the StepTimer field of the object's AI attack
  variables. It is one entry in the nearby state-handler pointer table off_810B2D0, alongside the similar
  genericAI_exitAttackStateAfterDelay_81097BA.
