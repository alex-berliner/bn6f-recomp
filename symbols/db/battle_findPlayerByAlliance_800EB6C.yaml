name: battle_findPlayerByAlliance_800EB6C
address: '0x0800EB6C'
kind: function
previous_names:
- sub_800EB6C
status: probable
summary: Returns 0 if the opposing alliance of `r0` has a player who's been blinded; else 1 (treats r0
  as the requester's alliance bit, flips it, looks up that player, and tests for OBJECT_FLAGS_BLIND on
  the found player).
interface: '(r0 = requesterAlliance: bool) -> r0 = 0 when the opposing player is blind, 1 otherwise ;
  side effects: clobbers r4/r5, also calls battle_networkInvert/battle_findPlayer/object_getFlag'
details: "Reads Toolkit (via r10) to grab the BattleState pointer into r4 for the network-invert call.\n\
  \  Saves r0 across the call, calls `battle_networkInvert(r0)` and tests result; if it was 0 (invert\
  \ collapses), returns r0=1 (mov r0,#1 ; pop pc) without touching the player.\n  Otherwise XORs r0 with\
  \ 1 (`mov r1,#1 ; eor r0,r1`) to flip the alliance bit and calls `battle_findPlayer(alliance)` returning\
  \ a BattleObject* into r5.\n  If findPlayer returned NULL (`bne loc_800EB8C` is misread, actually `beq\
  \ loc_800EB9A` jumps when Z set, meaning findPlayer returned NULL — wait assembly shows `bne loc_800EB8C\
  \ ; b loc_800EB9A` so non-null goes to 8C, null jumps to 9A returning 1), it skips the flag check and\
  \ returns 1.\n  When the player exists, calls `object_getFlag()` on it and tests bit 0x2000 (`OBJECT_FLAGS_BLIND`).\
  \ If blind, returns r0=0; else falls through to r0=1.\n  Net return semantics: r0 = 0 iff (XORed alliance)\
  \ player exists AND is blinded, else r0 = 1. Captured calls show this function is invoked from action\
  \ dispatchers (chargeShotChargeObject_update, sub_80C9726 etc.) to decide whether the opposite-side\
  \ player can be targeted.\n"
