name: battle_setAIAttackDamage_80FDFE4
address: '0x080FDFE4'
kind: function
status: confirmed
summary: Computes a 32-bit AI damage value by combining a versioned damage-table entry (low 16) with a
  versioned constant-modifier entry (high 16, always 0x000A) and writes it into the BattleObject's AI
  attack-data block.
interface: void battle_setAIAttackDamage(u16 tableIndex /*r0*/, BattleObject *obj /*r5*/); /* clobbers
  r0-r3,r6; r4,r6 preserved; r3 returns damage-sub-block ptr; r2 from callee; NZCV destroyed */
details: 'r4 and r6 are push/pop scratch. r0 holds a row index into three per-version

  tables (selected by battle_aiGetVersionedTableEntry_800FE12).

  First lookup – damage table (byte_80FE020/28/30, stride 8, four 16-bit rows per

  version): values range from 0x0A (10) up to 0x114 (276), giving the low half-word.

  Second lookup – modifier table (byte_80FE044/4C/54): every entry is 0x000A, so

  the high half-word is always 0x000A in practice; the table still goes through the

  versioned accessor, leaving room for per-version modifiers.

  The two halves are combined as (hi << 16) | lo and stored via

  *(obj->AI_data_ptr + 0xA0 + oAIAttackVars_Damage) = combined.

  oAIAttackVars_Damage is the field inside the AI attack-variables sub-structure

  that the battle AI later reads to apply actual hit damage.

  '
