name: sub_8119880
address: '0x08119880'
kind: function
previous_names: []
status: hypothesis
summary: Returns whether the battle action menu is locked because a submenu is open, gated by an AIData lookup of
  the actor's APwrAtk
interface: '(r5 = ??? ptr) -> r0 = (r0==0: 0 if locked, 1 if unlocked) ; out: nz/c/v from comparison, side effects
  may write r6 (sSubmenu) via submenu_isOpen path'
details: "Loads byte r5+5 (AIData.APwrAtk) and uses it as an index into byte_811935C; if the result is\n  zero it\
  \ skips ahead and returns 1 via the `mov r0,#1; tst r0,r0; pop {pc}` epilogue (z set,\n  but r0 nonzero means\
  \ \"menu not locked / not blocked\").\n  Otherwise it loads sSubmenu into r6 and calls submenu_isOpen_81355D8;\
  \ if no submenu is open\n  it returns r6 unchanged, otherwise it calls sub_81312F4 to resolve the live submenu\
  \ pointer\n  into r6. Then it reads sSubmenu+0xE and sSubmenu+0xF and compares them with cmp r0,r1, so\n  the\
  \ result is the NZ flag from that compare (the caller sub_81196F0 uses it to gate a\n  branch). The structure\
  \ read is sSubmenu offsets 0xE/0xF (SubMenu struct, current\n  per-ewram block is only 0x50 / declared size 0x80).\n\
  \  The function is \"void-like\" in the sense that the meaningful return is the cmp flag\n  result; the r0 left\
  \ in the register is whatever the last load (sSubmenu+0xE) produced\n  except in the no-locked-APwrAtk early-out\
  \ where r0=1.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#5]` at 0x08119882 reads AIData.APwrAtk (offset 0x5 in AIData struct). - `ldrb r0, [r1,r0];
    beq locret_811989E` at 0x08119886/0x0811988A gates on a table lookup against byte_811935C; the beq is to the
    early-out that sets r0=1. - `bl submenu_isOpen_81355D8; beq loc_8119898` at 0x08119890/0x08119894: only updates
    r6 via sub_81312F4 when a submenu is open, otherwise leaves r6 = sSubmenu base. - `ldrb r0,[r6,#0xe]; ldrb r1,[r6,#0xf];
    cmp r0,r1` at 0x08119898-0x0811989C: produces the NZ-flag return consumed by the caller. - Early epilogue `mov
    r0,#1; tst r0,r0; pop {pc}` at 0x081198A0-0x081198A4 sets Z=0, so the caller''s "branch if NZ" treats this as
    "menu is usable". - Caller sub_81196F0 contracts show r0 in may_write and uses only NZ output, consistent with
    a predicate return.'
