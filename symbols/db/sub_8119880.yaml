open_questions:
- What the per-APwrAtk table at byte_811935C actually classifies (chip id mapping? charging-allowed mask?). What
  sub_81312F4 returns (the struct the comparison is run on vs sSubmenu). What r2 (0xb0/0xf0) and r3 IWRAM pointers
  mean to the upstream caller sub_81196F0. Without resolving those the function's game-level intent is inferred.
