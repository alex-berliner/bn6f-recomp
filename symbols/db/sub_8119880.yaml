open_questions:
- What the byte_811935C table encodes (likely a per-APwrAtk flag of which A-button power
- types disable the in-battle menu while a submenu is open). The semantic of the 0xE/0xF
- SubMenu pair is also unknown — likely a "current submenu index" and "previous submenu
- index" used to detect transitions, but that needs the SubMenu struct fully mapped.
- Settling either requires cross-referencing the SubMenu writer sites and the APwrAtk
- table at 0x0811935C.
