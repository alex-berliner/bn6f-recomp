name: sub_8119880
address: '0x08119880'
kind: function
previous_names: []
status: hypothesis
summary: Returns 1 (probably forcing AI skip/guard) only when the actor's APwrAtk slot lookup in a small byte table
  returns zero and the submenu state byte at sSubmenu+0xE differs from sSubmenu+0xF; otherwise falls through to
  the Z-set path.
interface: (r5 = actor/AIData, lr = unk) -> flags Z set when the submenu-byte pair matches, clear otherwise; r0/r1/r6/lr
  may be clobbered; no callee-saved registers used.
details: "- `ldrb r0, [r5,#5]` reads AIData.APwrAtk (offset 0x5 per AIData.inc) from the actor ptr in r5.\n  - `ldr\
  \ r1, off_81198AC` (= `byte_811935C`) loads the address of a small lookup table; `ldrb r0, [r1,r0]` indexes it\
  \ with the APwrAtk index. The branch follows the Z flag (`beq`) so the function falls through (to `locret_811989E`)\
  \ when the lookup byte is non-zero, and only enters the explicit-code path when that lookup byte is zero.\n  -\
  \ On the zero path, `r6` is loaded with `sSubmenu`. Then `bl submenu_isOpen_81355D8` checks whether any submenu\
  \ other than the main/no-submenu state is open. If the Z flag is set (i.e. no such submenu), control jumps to\
  \ `loc_8119898` directly.\n  - When a submenu is open, `bl sub_81312F4` is called and its return value moves into\
  \ r6 (so r6 becomes some submenu-derived pointer for the following load), then falls into `loc_8119898`.\n  -\
  \ `loc_8119898` is two `ldrb`s at offsets 0xE and 0xF of the r6 pointer (after the BL rejoin this is sSubmenu+0xE\
  \ / 0xF or whatever sub_81312F4 returned +0xE/+0xF), compared by `cmp`. The fall-through into `locret_811989E`\
  \ returns with the CMP-flags still live (Z set when the two bytes match).\n  - There is a stray `mov r0,#1 / tst\
  \ r0,r0 / pop {pc}` block immediately after `locret_811989E`; because the fall-through into `locret_811989E` actually\
  \ skips it (the `pop {pc}` sits BEFORE it in the listing), that \"mov r0,#1; tst r0,r0\" appears to be dead code\
  \ that the disassembler has linearized after the literal pool padding. The captured callers all return r0=0 with\
  \ Z set, consistent with the byte-compare path running, not the \"mov r0,#1\" path.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- r5 is preserved/read at `[r5,#5]` and AIData.offset 0x5 is `APwrAtk`, supporting r5 = actor AIData
    ptr (callers contract marks r5 as in-saved). - `byte_811935C` is read as `[r1,r0]` indexed by APwrAtk -> a small
    per-APwrAtk table; Z branch leaves fall-through path, so the table byte is a gate. - `submenu_isOpen_81355D8`
    plus `sSubmenu` reference tie this to the submenu state and the SubMenu struct (SubMenu.inc). - r6 read at offsets
    0xE and 0xF whose difference vs the global sSubmenu only diverges via `sub_81312F4`, indicating r6 is either
    sSubmenu or a submenu-related pointer that has structurally identical 0xE/0xF fields. - Captured exits all return
    r0=0 Z set; `cbnz`-style branch layout in the captured caller (`sub_81196F0`) only treats the Z vs NZ outcome
    as the discriminator (the contract''s `out=[''nz'']`). - The `beq locret_811989E` after the ldrb index byte
    is a Z-branch on that byte being 0; this lets the function skip the submenu block entirely when the APwrAtk
    table says "allowed".'
