name: sub_8119880
address: '0x08119880'
kind: function
status: hypothesis
summary: Compares two status bytes (+0xE, +0xF) on the active submenu struct, returning their difference with flags
  set NZ; only runs when the caller's incoming Z flag was clear.
interface: 'bool sub_8119880(u32 r5 /* ctx */, u32 *r6 /* in/out: submenu ptr */);

  // input also gates on caller-supplied Z flag (early-exit path)

  // returns the difference (field_E - field_F) with N/Z flags set

  '
details: 'Reads r5+5 as an index into the small lookup table byte_811935C. The actual

  value is unused — it is just loaded into r0/r1 which are then clobbered, and

  the beq tests the caller''s incoming Z flag (a Thumb ldrb does not set flags),

  so this is a flag-based gate, not a data test.


  When Z=1 (incoming): early return — r6 passes through, flags pass through

  (taken-branch path preserves N/Z; in practice this returns NZ=0 since Z=1).


  When Z=0: loads the global sSubmenu pointer into r6. If

  submenu_isOpen_81355D8 returns "not open" (Z=1 from that callee), keeps

  sSubmenu; otherwise calls sub_81312F4 to obtain the currently active submenu

  struct and stores that in r6 instead. Finally compares bytes at +0xE and +0xF

  of that struct and returns their difference (field_E - field_F) via SET_FLAGS_NZ.


  Appears to be a per-frame status check that decides whether the submenu has

  transitioned (e.g. one field becoming equal to/less than the other), gating

  some downstream behavior. The two bytes at +0xE/+0xF are not yet identified

  — likely selection index vs. item count, or current/previous state.

  '
