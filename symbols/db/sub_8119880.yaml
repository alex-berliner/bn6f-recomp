open_questions:
- Identity of `byte_811935C` table; whether it's an "AI wants to do something this turn" mask, a per-APwrAtk skill/flag
  table, or an APwrAtk-availability list.
- Identity of `sub_81312F4`; it returns a ptr that shares a 0xE/0xF two-byte field with sSubmenu, but what specific
  submenu state it returns is unknown.
- Whether the trailing `mov r0,#1 / tst r0,r0 / pop {pc}` is dead code or reachable via some other control flow
  the lifter linearized oddly; captured callers never hit it.
- Exact meaning of comparing sSubmenu+0xE vs +0xF; the SubMenu struct only documents an idx_00 at offset 0, so 0xE/0xF
  are undefined here and likely belong to a different structure that sub_81312F4 returns.
