name: sub_8119880
address: '0x08119880'
kind: function
previous_names: []
status: hypothesis
summary: Checks the B-attack slot's charge state to decide whether a submenu-driven B-button action should be allowed
  this frame.
interface: '(r5 = AIDataPtr) -> NZ = charge state allows a B-button submenu action ; side effects: clobbers r0,
  r1, r6, may set N/Z'
details: "Pushes lr, reads r5+0x5 (the APwrAtk byte of the AIData struct passed via r5).\n  Looks up that byte in\
  \ the byte_811935C table; if the indexed byte is zero it short-circuits straight to the return.\n  Otherwise loads\
  \ sSubmenu into r6 and calls submenu_isOpen_81355D8 to see if a non-main submenu (i.e. something\n  other than\
  \ the 0x20 closed state) is up. If so it also calls sub_81312F4 and overwrites r6 with its return.\n  Finally\
  \ it compares sSubmenu+0xe against sSubmenu+0xf and returns the result in the Z flag (NZ if they differ).\n  Net\
  \ behaviour: returns \"submenu's 0xe vs 0xf fields differ\" only when the AIData byte passes the table lookup\n\
  \  AND a submenu other than the default one is open. Caller uses this as a guard before letting an AI/player\n\
  \  B-attack slot auto-charge resolve through the submenu.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#5]` is the APwrAtk byte of struct AIData (per the AIData.inc offsets). - `ldr r1, off_81198AC
    // =byte_811935C` then `ldrb r0, [r1,r0]` is a per-APwrAtk-index table lookup; the `beq locret_811989E` skips
    everything when the looked-up byte is zero. - `ldr r6, off_81198A8 // =sSubmenu` plus `bl submenu_isOpen_81355D8`
    ties the path to the global SubMenu state. - The second branch `bl sub_81312F4 ; mov r6, r0` only runs when
    the submenu is open, replacing the sSubmenu pointer with whatever that helper returns (likely a menu subentry
    pointer). - Tail `ldrb r0, [r6,#0xe] ; ldrb r1, [r6,#0xf] ; cmp r0, r1` then `pop {pc}` returns the comparison''s
    Z/NZ in flags (the callee contract lists only `nz` in `out`). - All six captured callers in `snap_story2_*`
    are called from the same caller sub_81196F0 with r0=0x081196f1 (a small thunk/return address), r2=0xf0 then
    0xb0 (some count/timer argument), r3=0x02008470/0x02008520 (IWRAM buffers).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08119880

    '
  result: the body read as described above
