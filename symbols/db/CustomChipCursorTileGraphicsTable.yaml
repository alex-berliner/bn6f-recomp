details: battleObject_setupCustomChipCursorState selects an entry by scaling its cursor index left by
  seven, which identifies a 128-byte block. It passes the selected block to QueueEightWordAlignedGFXTransfer
  for upload to VRAM, with a fixed destination of 0x6017E80. The table therefore holds the graphics blocks
  for the custom chip cursor animation rather than a scalar value. Its size indicates 64 blocks.
