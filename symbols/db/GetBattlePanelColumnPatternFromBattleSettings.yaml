name: GetBattlePanelColumnPatternFromBattleSettings
address: '0x0802D278'
kind: function
status: confirmed
summary: Returns the battle panel column pattern byte stored at offset 6 of the battle settings struct.
interface: 'u8 GetBattlePanelColumnPatternFromBattleSettings(void* battleSettings); // in: r0 = battle settings
  ptr, out: r0 = byte at +6'
details: Trivial one-instruction getter. Loads an unsigned byte from battleSettings+6 (ldrb r0,[r0,#6]) and returns
  it; r0 is both input and output, no other registers touched and no flags intentionally set for callers. The field
  at offset 6 of the battle settings structure is a "panel column pattern" value, most likely an index/enum selecting
  which column-based panel layout variant (e.g. hole/column obstacle arrangement) the battle uses; the getter exists
  so callers need not hardcode the struct offset.
