name: object_clearFlag
address: '0x0801A15C'
kind: function
status: confirmed
summary: Clears the given bit(s) of a battle object's ObjectFlags1 in its collision data.
interface: void object_clearFlag(u32 flagMask r0, BattleObject *obj r5); returns r1 = collision data ptr, r2 = updated
  flags; NZ from updated flags; lr used as return address
details: Loads the object's collision data pointer from oBattleObject_CollisionDataPtr (r5 + offset), reads ObjectFlags1
  from the collision data, clears the bits set in r0 with BIC, stores the result back to oCollisionData_ObjectFlags1,
  and returns with mov pc, lr. Sets NZ flags on the updated flags value, so callers can branch on whether any bits
  remain set (e.g. loop while flags are nonzero). r1 and r2 are left live after return, which callers may reuse.
