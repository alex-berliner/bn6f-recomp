name: ai_swordyBeginAttack
address: '0x0810B5BE'
kind: function
status: probable
summary: 'Sets up the Swordy-family AI''s attack: stores the target panel, picks version-dependent params,
  sets attack id 0xA, and enters the attack handler.'
interface: (r0 = target panel X, r1 = target panel Y; r4 = battle object AIData, r7 = AI attack-vars block)
  -> tail-calls attack dispatcher, no return value
details: Stores r0/r1 into oAIAttackVars_TargetPanelX/Y and writes 1 to oAIAttackVars_AiDifficultyTier.
  It then indexes the table at byte_810B5F4 by oAIData_Version_16<<2 and stores the resulting word in
  oAIAttackVars_ScratchVar (values 0x50/0x70/0x90 look like timing/count params). It calls GetAllianceDependentPanelParamArgs
  with the byte_810B6E0 table to get a param word (stored to oAIAttackVars_AiAttackParam) and an args
  pointer (stored to oAIAttackVars_PanelParamFlags2). Finally it calls object_setAttack0 with attack id
  0xA and tail-calls sub_8109804, which dispatches to an AI-attack handler via the selector byte in the
  attack-vars block.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0/r1 into oAIAttackVars_TargetPanelX/Y at the start records the caller's chosen target
    panel; off_810B5F0 table indexed by oAIData_Version_16<<2 fills oAIAttackVars_ScratchVar with 0x50/0x70/0x90
    per version; bl GetAllianceDependentPanelParamArgs stores param/args into oAIAttackVars_AiAttackParam
    and oAIAttackVars_PanelParamFlags2; mov r0,#0xa; bl object_setAttack0 selects attack id 0xA on the
    battle object; bl sub_8109804 tail-call enters the AI-attack handler dispatcher, matching the Swordy
    attack flow of caller ai_swordyTryStartAttack
