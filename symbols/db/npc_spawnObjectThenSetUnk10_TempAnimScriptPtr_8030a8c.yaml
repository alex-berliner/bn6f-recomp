name: npc_spawnObjectThenSetUnk10_TempAnimScriptPtr_8030a8c
address: '0x08030A8C'
kind: function
status: confirmed
summary: Spawns an overworld NPC object with its initial script forced to 0, then stamps the caller's script selector
  and animation-script pointer onto the new object.
interface: void npc_spawnObjectThenSetUnk10_TempAnimScriptPtr_8030a8c(u32 arg0, u32 whichScript, const NPCScript
  *animScriptPtr, /* r3, r4 passed through as spawn args */); returns the new object pointer in r5 (NULL on failure);
  r0-r4 and flags are preserved
details: 'Thin wrapper around SpawnOverworldNPCObject. It saves r0-r2, calls the spawner with

  r0 forced to 0 (the "initial script" argument) while r1-r3/r4 pass through unchanged,

  so the spawner writes placeholder values into the new object''s xyz position and

  unk_04 fields — these are later overwritten by the NPC script anyway. If the spawn

  succeeded (r5 != 0), it stores the low byte of r1 into

  oOverworldNPCObject_WhichNPCScript and r2 into oOverworldNPCObject_UnkFlags_60.

  UnkFlags_60 is normally a flags word, but npc_init_809E590 repurposes it as temp

  storage for the animation script pointer before consuming it. Finally r0-r2 are

  restored from the stack (mirroring the original''s push/pop pair) and it returns.

  The new object pointer is handed back to the caller in r5, which the spawner set.

  '
