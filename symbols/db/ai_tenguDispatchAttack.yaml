name: ai_tenguDispatchAttack
address: '0x080F93C2'
kind: function
status: probable
summary: 'TenguMan attack dispatcher: tail-calls one of five handler routines selected by the HitElement
  byte in the AI attack-vars struct.'
interface: (r7 = AI attack vars struct) -> calls handler table[HitElement]; r0 passed through as first
  argument to handler
details: Loads the HitElement byte from the AI attack-vars struct at r7 (offset oAIAttackVars_HitElement),
  uses it to index a 5-entry table at off_80F93D4, then tail-invokes the selected Thumb handler with `mov
  lr, pc; bx r1`, which preserves the caller's r7 frame and returns here before popping {r7,pc}. The callee
  receives r7 unchanged and whatever r0 the caller had set. All five targets are Thumb (addresses stored
  +1). It is purely a jump-table dispatcher with no state of its own.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0] indexes the 5-entry handler table by
    element; off_80F93D4 holds five +1 Thumb addresses (sub_80F93E8..sub_80F9518), one per element value;
    mov lr,pc; bx r1 is the classic Thumb far-call idiom, so control returns to pop {r7,pc}; only known
    caller ai_tenguInitAttack (TenguMan attack init) sets up the attack vars before this dispatch
  refs:
