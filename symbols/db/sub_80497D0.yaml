name: sub_80497D0
address: '0x080497D0'
kind: function
status: confirmed
summary: Drives the per-frame screen-fade update during battle, finalising the fade counter when a fade is still
  in progress.
interface: void sub_80497D0(void);  /* r5 -> caller's fade state struct (byte at +1 is the counter); flags, r3,
  r8, r9, r10, r11, r12 returned from sub_803A820 */
details: 'Polls IsScreenFadeActive; while a fade is ongoing, calls sub_803BB2C(0x14)

  and sub_803BB7C(0xF) and stamps 8 into the caller''s state byte at [r5+1] (the

  "fade in progress / completed" counter, since 8 marks the fade done). Then,

  unconditionally, runs sub_803A820 (battle_moduleInit_803A820 - the per-frame

  fade/module processor). All output registers and flags are the verbatim return

  of sub_803A820, since the early branch falls through into it.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
