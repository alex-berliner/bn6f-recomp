name: ai_pickMoveTargetFromClosestEnemy
address: '0x08111674'
kind: function
status: probable
summary: 'Enemy-AI movement picker: reserves the object''s own panel, finds the closest enemy, computes
  a move target/direction via an alliance-dependent parameter table, and stores it into the object''s
  AI fields.'
interface: (r0 = battle object, r5 = battle object) -> r0 = ?; writes fields 0x64 (random 0-3), 0x65/0x66
  (computed target values) on the object; flags from tst r0,r0
details: Takes a BattleObject in r5. It reserves the panel at the object's own PanelX/PanelY (object_reservePanel),
  then finds the closest enemy of the opposite alliance via battleObject_findClosestEnemyBattleObject_80103F8.
  It reads an entry from the alliance-dependent panel parameter table byte_8111740 (index = Alliance*5+1,
  type 2) with GetAllianceDependentPanelParamArgs, then calls the adjacent helper sub_8111750 with r5
  = the enemy object, r6 = own Alliance and r4 = 0xF; r5 is swapped by push/pop tricks. If that helper
  returns nonzero, the two returned values are stored at object offsets 0x65 and 0x66, and a fresh GetRNG
  value &3 is stored at offset 0x64, before the panel reserve is released again. The reserve-then-release
  of the object's own panel suggests it holds its tile while planning a move, then frees it.
