name: sub_811FF80
address: '0x0811FF80'
kind: function
status: confirmed
summary: Classifies a chip into one of several categories based on its element flags (offset 9 of the chip data)
  and returns the category code along with a boolean flag.
interface: u32 classifyChipElement_811FF80(u32 which_chip, out u32 r1) -> u32 category
details: 'Looks up the chip via getChip8021DA8. If element flag 0x10 at chip+9 is set, returns category 1 with r1=1.
  If element flag 0x02 is set instead, takes the chip id (u16 at chip+0x1A), and if it exceeds 0x3E7 it calls sub_8010C76(which_chip)
  to remap it, returning that as the category with r1=0. If neither flag is set, returns category 5 with r1=0. Only
  r4 (the input which_chip) is preserved across the call to sub_8010C76; the rest of r0..r3 may be clobbered by
  that helper.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
