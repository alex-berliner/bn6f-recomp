name: battle_aiSetScriptByDifficulty
address: '0x080FBA0C'
kind: function
status: probable
summary: Picks an AI behavior script ID based on the enemy's AI difficulty and stores it in the AI state.
interface: (r0 = enemy AI data pointer?, r6 = AI state struct) -> r0 = script ID written to oAIState_ScriptId;
  flags clobbered by BL
details: Calls battle_getAiDifficultyTier_800FE36, which maps the enemy AI data's difficulty byte to a
  tier 0-2 (only for AI data version 4). The returned tier indexes the byte table dword_80FBA20 (04, 0C,
  C0, C0), yielding 0x04 for tier 0, 0x0C for tier 1, and 0xC0 for tier 2. The selected byte is written
  to field oAIState_ScriptId of the struct at r6, i.e. the AI state's current behavior script ID. Tier
  0 (weakest) gets script 4, tier 1 gets script 0xC, and tier 2 (hardest) gets 0xC0, which may be a special/default
  script ID. The function assumes the callee returns 0-2 and does not clamp, so a higher tier would read
  out of bounds of the 4-byte table.
