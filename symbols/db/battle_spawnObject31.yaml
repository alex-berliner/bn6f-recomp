name: battle_spawnObject31
address: '0x080CA0E2'
kind: function
status: probable
summary: Wrapper that spawns a type-3 battle object with ID 0x31 and fills in its element, panel position,
  timer, damage field and the parent's alliance.
interface: (r0 = panelX?, r1 = panelY?, r2 = element?, r3/r4 = spawn args, r5 = parent battle object)
  -> r0 = spawned object or 0; flags Z from spawn success
details: 'Saves the caller''s r0-r2 and r5 on the stack, sets r0 = 0x31 and tail-calls object_spawnType3,
  passing the remaining caller arguments straight through (the project summary says type-3 spawn takes
  five args and runs the new object''s initializer). After the call, the saved args are popped shifted
  by one (r1<-r0, r2<-r1, r3<-r2) and the branch on the spawn''s success flag skips all writes on failure.
  The new object gets Element and PanelX/PanelY byte-written, Timer is copied from its own oBattleObject_Param3
  halfword (set by the initializer), the DamageAndStaminaDamageCounterDisabler field is written from r6
  (left over from the spawn call, likely a damage/counter value), and Alliance is copied byte-for-byte
  from the parent object pointer the caller kept in r5. Quirk: r0 for the field writes comes from r5 as
  left by the spawn callee (mov r0,r5 before the pop), so object_spawnType3 must also expose the new object
  via r5 (or r5==r0), not just r0.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0x31 / bl object_spawnType3 — fixed type-3 object ID 0x31, other args passed through;
    push {r0-r2,r5} / pop {r1-r3,r5} — args preserved across the call and reused as field values; strb
    r3/r1/r2 to oBattleObject_Element/PanelX/PanelY and Timer<-Param3 — post-spawn field init of the new
    object; ldrb r1,[r5,#oBattleObject_Alliance] / strb r1,[new,#Alliance] — r5 is the parent object whose
    side the new object joins; beq locret_80CA102 right after the call — spawn-failure path skips every
    field write'
