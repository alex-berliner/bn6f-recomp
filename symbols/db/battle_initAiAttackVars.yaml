name: battle_initAiAttackVars
address: '0x080F65C4'
kind: function
status: probable
summary: 'Initializes the per-object AI attack state: stores the enemy difficulty tier, sets the init
  flag and panel-choose callback, targets the opposing player, and starts attack0 id 0xB.'
interface: (r0 = BattleObject r5/r7 attack state base, no args used) -> r0 = clobbered; writes oAIAttackVars
  fields on r7
details: This is an attack-setup routine for the battle AI. It reads the enemy AI data's difficulty byte
  via battle_getAiDifficultyTier_800FE36 and stores the tier (0-2) into oAIAttackVars_AiDifficultyTier,
  then sets oAIAttackVars_InitFlag to 1. It calls sub_80F663C with r0=1 (purpose unknown, likely clearing/arming
  attack vars), installs sub_80F6FD0+1 as oAIAttackVars_PanelChooseCallback, and resolves the target by
  XOR-ing the object's oBattleObject_Alliance with 1 and calling battle_findPlayer, storing the opposing
  player pointer in oAIAttackVars_TargetObjectPtr. Finally it invokes object_setAttack0 with 0xB, selecting
  the attack behaviour the callback will drive. The caller sub_80F64B0 appears to be a dispatch of such
  per-attack init routines.
