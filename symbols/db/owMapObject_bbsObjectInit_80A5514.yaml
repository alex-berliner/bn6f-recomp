open_questions:
- Exact object layout (the function indexes r5 byte 3, 4, 5, 6, 7, 8 as separate fields; the struct only
  documents up to byte 4 for OverworldMapObject). Settled by figuring out which OW object slot r5 actually
  points to.
- The true meaning of `str r0,[r5,#0x2c]` = 0x12 (looks like a short frame timer).
- Why the SE 0x17F + !-indicator branch gates on bit0 of `r5[4]` and on equality with 0 -- probably distinguishes
  "first time the BBS appears on this map" vs "still around".
