name: battle_spawnAndLinkTypeF_80E1620
address: '0x080E1620'
kind: function
status: confirmed
summary: Spawns a type-0xF battle object via object_spawnType4, links it to the caller's battle object,
  copies alliance/direction, and sets header flag bit 2.
interface: battle_spawnAndLinkTypeF(r1, r2, r3, r4, r5, r7) -> r0 (spawned object or 0), r1, r2, r3, r4,
  r5, r6, nzcv
details: 'Calls object_spawnType4 with type 0xF and pass-through params r1-r4; the spawned pointer returns
  in r5 of the callee which is then moved to r0. On success (r0 != 0): stores the caller''s original r5
  (parent battle object) into the new object''s oBattleObject_RelatedObject1Ptr; stores the callee''s
  r7 (extra-vars block) into oBattleObject_ExtraVars and writes a back-pointer (new object address) at
  the head of that extra-vars list; copies oBattleObject_AllianceAndDirectionFlip (halfword) from the
  caller object to the new object; ORs bit 2 (0x04) into oObjectHeader_Flags. On failure (spawn returned
  0), returns immediately with r0=0 and zero flags. r4-r7 are preserved across the call; r5 is restored
  from the caller''s stack after the spawner overwrites it.'
