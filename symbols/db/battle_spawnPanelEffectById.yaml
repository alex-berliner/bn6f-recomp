name: battle_spawnPanelEffectById
address: '0x080E6DFC'
kind: function
status: probable
summary: Spawns an effect object at a caller-given battle panel only when the id in r2 matches one of
  five entries in a lookup table, using the matched entry's byte as a spawn parameter.
interface: (r0 = panel column, r1 = panel row, r2 = id) -> r0 = spawned object ptr or unchanged if no
  match; destroys r4,r6
details: 'Loops over five 2-byte entries at byte_80E6E34: (2,0),(3,2),(7,3),(6,5),(8,6). Each iteration
  compares r2 with the entry''s first byte; on a match it calls object_getCoordinatesForPanels(r0,r1)
  to turn the caller''s panel column/row into 16.16 screen pixel coords, then calls spawn_t1_0x0_EffectObject
  with x/y in r0/r1, r3=8, and r4 = 2 | (entryByte2 << 16), i.e. the second table byte is packed into
  the high half of the spawn argument. If no entry matches after five tries, the function returns without
  spawning anything. The spawned object is the generic type-4 effect object with effect type 0, so the
  table byte likely differentiates animation/variant. The function clobbers r4 (loop counter) unconditionally,
  so callers must not rely on r4.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r3,[r6]; cmp r2,r3; bne — r2 is matched against table entry first bytes; bl object_getCoordinatesForPanels
    uses incoming r0/r1, so the panel position comes from the caller, not the table; lsl r6,#0x10; orr
    r4,r6 with r4=2 — second table byte packed into spawn arg; bl spawn_t1_0x0_EffectObject with r3=8
    — spawns effect-type-0 battle object at converted coords; byte_80E6E34 holds exactly five (id,param)
    pairs; loop bounded by cmp r4,#5
