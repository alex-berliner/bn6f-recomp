open_questions:
- The semantics of the 0xa000 bit; the struct field is off_BattleObject+0x7c, currently unnamed.
- Whether sub_810BDC4 returns bool (1=already attacking) or new state; the comparison `cmp r0,#0; bne
  locret_810BC8E` is consistent with "nonzero=in progress, abort this frame".
- What the three per-state handlers (sub_810BCA0 / sub_810BCBC / sub_810BCFC) actually do; not in the
  context block.
