name: battle_introStepDispatch
address: '0x08008840'
kind: function
status: probable
summary: Runs the next step of the battle intro/end state machine by dispatching the handler selected
  from a step table.
interface: (r0 = state struct in r5, step id at [r5,#2]) -> jumps to handler table entry (off_8008854[step])
  which returns to this function's caller; r0 = step id on entry to handler
details: 'Reads the byte at [r5,#2] as the current step id, indexes off_8008854 with it, sets lr = pc
  and bx to the handler so the handler''s pop {pc}/bx lr returns straight to sub_8008840''s caller. The
  table holds four Thumb handlers: battle_crossNetIntroStep (step 0), sub_8008894 (step 1), battle_introWaitCrossNetReady
  (step 2), battle_battleEndCountdownTick (step 3). r5 must be preserved by handlers since it is never
  reloaded; r0 is left holding the step index (possibly an accidental leftover rather than an intended
  argument).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0, [r5,#2]; ldr r1, [r1,r0]; bx r1 — step index selects a handler pointer from off_8008854;
    mov lr, pc; bx r1 makes the dispatched handler return to sub_8008840's caller (tail-dispatch); table
    entries battle_crossNetIntroStep/battle_introWaitCrossNetReady/battle_battleEndCountdownTick name
    the intro/end phases being stepped through; no callers known, but the handler names show a sequential
    battle intro/countdown state machine
