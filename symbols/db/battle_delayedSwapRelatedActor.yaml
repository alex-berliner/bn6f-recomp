name: battle_delayedSwapRelatedActor
address: '0x080BCC96'
kind: function
status: probable
summary: Waits 30 frames, then re-registers the related object's actor (with a new AI index via sub_8011044)
  and kills the related object, before self-destructing.
interface: (r0-r4 scratch; r5 = battle object) -> void; sets CUR_STATE_DESTROY and kills related object
details: On first invocation (PhaseInitialized==0) it initializes a 0x1E-frame Timer and marks phase 4.
  Each call decrements the timer and returns until it goes negative. At expiry it reads the related object's
  NameID, unpacks its {version, actorType, aiIndex} record via unpackVerActorTyAndAIIdx_800F29C, and passes
  those to sub_8011044 with r2=1 — apparently re-registering/respawning that actor with a new AI index.
  It then runs sub_80B8E58 on ExtraVars+4, clears object-header flag bit 0x2, sets CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY, tears down the related object with battle_killObjectWithDependents, and finally
  zeroes the byte at ExtraVars[0].
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb PhaseInitialized==0 -> timer=0x1E, phase=4 gives a one-shot 30-frame delay; unpackVerActorTyAndAIIdx_800F29C
    on [r4+oBattleObject_NameID] then sub_8011044(r2=1) reconfigures the related actor; mov r0,#CUR_STATE_DESTROY;
    str to CurStateActionPhaseAndPhaseInitialized then bl battle_killObjectWithDependents on RelatedObject1Ptr;
    bic flag bit 2 in oObjectHeader_Flags before destroy, and final strb 0 to [ExtraVars]
