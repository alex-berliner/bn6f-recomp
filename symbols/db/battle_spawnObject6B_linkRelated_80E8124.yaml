name: battle_spawnObject6B_linkRelated_80E8124
address: '0x080E8124'
kind: function
status: confirmed
summary: Spawns battle object type 0x6B via object_spawnType4 and, if one was created, stores the caller's
  battle object (r5) into the new object's RelatedObject1Ptr slot.
interface: void sub_80E8124(u32 r1, u32 r2, u32 r3, u32 r4, BattleObject* related /* r5 */); outputs r2,
  r3, r5 (restored related object), r6, r7 left as the spawner returned them; flags clobbered
details: 'Saves lr and r5, then calls object_spawnType4 with r0 = 0x6B (object type ID) and r1-r4 passed
  through untouched as spawner arguments. The spawner reports the newly created object in its r5 result.
  The wrapper moves that result back into r0 and branches over the store if it is 0, so on spawn failure
  nothing is written. On success it stores the caller''s original r5 value (an existing battle object)
  into the new object''s oBattleObject_RelatedObject1Ptr field, making it the "related object 1" of the
  freshly spawned 0x6B object. r5 is restored from the saved copy via the odd pop {r5} arrangement (r5
  was pushed above lr after the push {lr}), so the caller''s input r5 value is also what the caller sees
  afterwards; the spawner''s other results (r2, r3, r6, r7) are simply left in place. Which in-game object
  type 0x6B corresponds to (a helper/effect entity tied to a specific attack or NPC) is not determined
  from this function alone.

  '
