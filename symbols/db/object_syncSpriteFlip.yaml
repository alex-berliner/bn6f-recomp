name: object_syncSpriteFlip
address: '0x080BFF56'
kind: function
status: probable
summary: If the given battle object pointer is non-null, fetch its effective horizontal facing via object_getFlip
  and apply it to the object's sprite via sprite_setFlip.
interface: (r0 = battle object pointer) -> r0 = undefined; calls object_getFlip then sprite_setFlip with
  the resulting flip value
details: The function returns immediately when r0 is null (tst r0,r0 / beq), so r0 is an object pointer,
  not just a flag. Otherwise it saves the pointer, calls object_getFlip to get the object's effective
  horizontal facing (alliance XOR DirectionFlip override), and passes that value to sprite_setFlip, which
  stores the flip into mask 0x30 bits of sprite bytes 0x13 and 0x16. This keeps an object's rendered sprite
  mirrored in step with its battle facing. It is a tiny wrapper likely called whenever an object's direction
  changes.
