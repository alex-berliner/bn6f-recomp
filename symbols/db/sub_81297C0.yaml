summary: 'Per-frame cutscene controller: runs entity updates and queued effects, and forces state "4:0" while a
  screen fade is active.'
interface: "void cutscene_tick_81297C0(void)\n  /* inputs:  r5 = controller state struct ptr, r10 = ?, lr */\n \
  \ /* outputs: r4, r5, r6, r8, r9, r10, r11, r12 */\n  /* clobbers: r0, r1, r2, r3, lr; flags nz c v */\n"
details: "Invoked every tick while a cutscene/intro-style state is active.\n1. Calls entity_runAllUpdateHandlers_80465BC\
  \ to advance all scripted entity logic for the frame.\n2. Calls sub_80465F8 to drain the queued-effects / event\
  \ pass.\n3. Calls IsScreenFadeActive; if a fade is in progress (zf clear), it forces the\n   controller's state\
  \ byte to 4 (offset +1 from r5) and sub-state to 0 (offset +2),\n   effectively holding playback at \"playing\"\
  \ while the screen is fading.\nr5 is treated as a small controller struct of at least 3 bytes (offsets 1 and 2\n\
  are state and sub-state; offset 0 is presumably the active flag). r10's role is\nnot exercised by this function\
  \ beyond being preserved across the calls.\nNo stack frame (push {lr} / pop {pc}); nothing here allocates locals.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
