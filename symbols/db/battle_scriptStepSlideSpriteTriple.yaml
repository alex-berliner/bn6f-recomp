name: battle_scriptStepSlideSpriteTriple
address: '0x0809A98C'
kind: function
status: probable
summary: 'Script/battle-cutscene step: advances a counter, slides a group of three sprite-table entries
  to (0,0x58), pumps the per-frame entity and eStruct sprite updates, and returns 1 only once event flag
  EVENT_F5 is set.'
interface: (r5 = script/state struct, r10 = toolkit) -> r0 = 0 while step still running, 1 when EVENT_F5
  is set; flags clobbered by calls
details: Reads a byte at [r5,#4], adds 0x10, clamps it at 0x60 and stores it back; on overflow it also
  copies two fields (halfword at chatbox-struct+0x4C, byte at +0x50) into r5+6/r5+5. It then passes counter-0x30
  as a sprite id (0..0x30) with r1=0x58, r2=0 to sprite_setPositionForIdRange3_8119854, which moves three
  consecutive sprite-table entries (id..id+2) to a fixed position. It then calls entity_runAllUpdateHandlers_80465BC
  and battle_updateEStructSprites_80465F8 so the battle entity/sprite pipeline keeps animating during
  this step. Finally it tests EVENT_F5; while the flag is clear it returns 0 (caller should re-run this
  step next frame), returning 1 once set. The pattern — repeatable per-frame step returning a done flag
  driven by an event flag — matches a scripted battle cutscene command that animates sprites while waiting
  for a story condition.
