name: npc_inChatbox_curAction_waitClose_809EBBC
address: '0x0809EBBC'
kind: function
status: confirmed
summary: 'Overworld NPC chat-box close-wait action: returns early if the player direction-lock event is set or the
  game-state close-animation gate is non-zero, otherwise clears the NPC''s sub-state byte and resets the NPC to
  its standard state.'
interface: "void npc_inChatbox_curAction_waitClose_809EBBC(u32 /*r5*/ npc_ptr,\n                               \
  \               u32 /*r10*/ toolkit_ptr,\n                                              u32 /*r7*/ game_state_ptr_in)\
  \ -> u32 /*r7*/ game_state_ptr_out;\n// clobbers r0, r1, r2, r3, r7, lr; NZCV per path; preserves r4, r5.\n"
details: '- Reads the player direction-lock event via TestEventFlagFromImmediate(flag "0x17:0x15" = EVENT_CUR_DIR_LOCKED_PRIMARY/SUB).
  If the flag is set (bne taken on !ZF) it bails out without touching the NPC, leaving the prior game-state pointer
  in r7.

  - On the miss path, loads the game-state pointer from toolkit + oToolkit_GameStatePtr into r7 and reads byte oGameState_Unk_10
  from it. If that byte is non-zero (tst r0,r0 → bne) it returns the game-state pointer and emits the same NZ result
  through r0.

  - On the close-animation-complete path, writes 0 to NPC + oOverworldNPCObject_Unk_07 and calls npc_resetToStandardState_809F612
  (passing r0 = 0 and the game-state pointer in r7) before returning r7.

  - Quirks: r7 is both an input (caller''s game-state pointer) and the function''s output; r5 (npc_ptr) and r5 are
  preserved. The "return" value in r7 is the toolkit''s cached game-state pointer, not anything derived.

  '
