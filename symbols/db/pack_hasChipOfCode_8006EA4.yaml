  date: '2026-10-14'
  detail: "- `bl encryption_testPack_8006e84` + `bne loc_8006EE4` jumps to the r0=1 path on a mismatch,\n\
    \  showing the integrity check is a precondition.\n- `cmp r4, #0xff` / `beq loc_8006EE0` is the \"\
    any code\" shortcut that returns 0 (the\n  \"present\" answer).\n- The `ldrb r3,[r0]; cmp r3,r4` block\
    \ repeated for offsets 0,1,2,3 scans the four code\n  letters of the chip record returned by `getChip8021DA8`.\n\
    - `bl getOffsetToQuantityOfChipCodeMaybe_8021c7c` followed by `ldrb r0,[r0]; tst r0,r0;\n  beq loc_8006EE4`\
    \ reads the pack stock byte and uses zero as \"absent\".\n- `push {r1-r7,lr}` / `pop {r1-r7,pc}` and\
    \ the in/out contract show only r0 is returned. - All captured-call entries (r0 = small chip id, r1\
    \ = code letter or 0xFF) match this\n  interpretation; six samples shown all return r0=1 with flags=----."
