name: pack_hasChipOfCode_8006EA4
address: '0x08006EA4'
kind: function
previous_names:
- sub_8006EA4
status: probable
summary: Returns true if the player holds one or more of `chip_id` in the pack with the requested `code`
  letter (A/B/C/D… or any, 0xFF).
interface: '(r0 = chip_id, r1 = code letter, r10 = toolkit) -> r0 = 0 or 1 ; side effects: clobbers r2–r7'
details: 'This is the per-chip, per-code check behind GetChipCountOfCode. It first calls

  `encryption_testPack_8006e84`; if the toolkit pack fails integrity it returns 1 (i.e. treat as

  "no stock"). Otherwise it looks up the chip record via `getChip8021DA8(r7=chip_id)` and scans

  the four code-letter slots (offsets 0..3 of the 44-byte record). If none of them match the

  requested `code` (and `code != 0xFF`, which short-circuits to true/0), it returns 1. If the

  code matches, it calls `getOffsetToQuantityOfChipCodeMaybe_8021c7c(chip_id, code)` and

  dereferences the returned pack-stock byte: zero → return 1 (none in pack), non-zero → return 0

  (at least one present). The two early-exit paths (`encryption_testPack_8006e84` mismatch or

  `code == 0xFF`) both return 0 from loc_8006EE0. Note the inverted return convention: 0 means

  "yes, the chip+code exists in the pack", 1 means "no". Callers (`GetChipCountOfCode`,

  `sub_8021C02`) use this as a gate before they read the actual quantity byte themselves.

  '
