open_questions:
- The exact semantics of the inverted 0/1 return vs the caller's use (whether callers treat r0==1 as "not
  found" or as an error) is not visible from this function alone; reading the post-call branch in `GetChipCountOfCode`
  would confirm. Whether 0xFF is a sentinel for "any code" vs "no code" in the project's chip-code vocabulary
  also warrants a look at the callers.
