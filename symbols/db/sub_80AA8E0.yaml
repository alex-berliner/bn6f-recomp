name: sub_80AA8E0
address: '0x080AA8E0'
kind: function
status: hypothesis
summary: Wrapper that, when enabled by its second argument, invokes setup helper sub_80AA910 with a six-word parameter
  block and returns its result plus the current battle state's halfword field 0x36; otherwise returns (0, 0).
interface: 'u32x2 sub_80AA8E0(u32 arg0 /*r0*/, u32 enable /*r1*/, u32 arg2 /*r2*/, u32 arg3 /*r3*/, u32 arg4 /*r4*/,
  u32 arg5 /*r5*/, r10 = toolkit pointer); returns r0 = result of sub_80AA910, r1 = battleState->oBattleState_Unk_36
  (halfword, zero-extended); clobbers C/V.

  '
details: 'Thin trampoline in front of sub_80AA910. The six incoming words r0-r5 are stored at the bottom of a 0x2C-byte
  stack frame (offsets 0x00-0x14) and two more words (offsets 0x1C, 0x20) are zero-initialized; sub_80AA910 reads
  its arguments back out of the caller''s stack frame rather than from registers. The call is gated on r1 != 0:
  if r1 is zero the helper is skipped entirely and both outputs are 0. r7 is forced to 0 for the duration of the
  call (sub_80AA910 expects r7 == 0) while the caller''s r7 is saved and restored, so r7 appears preserved to outside
  callers. r4-r6 are pushed/popped as callee-saved. After the helper returns, the function loads the toolkit''s
  battle state pointer (r10 + oToolkit_BattleStatePtr), reads the halfword at oBattleState_Unk_36, and passes it
  back in r1 alongside the helper''s r0 result in r0. What sub_80AA910 actually does with the parameter block is
  not determined here, so the in-game meaning is only as specific as "setup/setup-like operation guarded by an enable
  flag, paired with a battle-state query". The C/V flag carry-through is incidental (the tst / ldr pair before the
  epilogue), not a designed output.

  '
