open_questions:
- Which battle object ID 0x8F actually is (object table lookup needed) to name it in game terms
- What caller sub_8101204 passes in r5 (source object) and r6 (damage/counter field) — needed to confirm
  the semantics of those two stores
- Meaning of oObjectHeader_Flags bit 0x10 set here
- Exact success/return convention of object_spawnType3 (the mov r0,r5 before the pop is ambiguous about
  which register carries the result)
