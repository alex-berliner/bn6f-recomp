summary: Dispatches the action selected by an AI attack variable's hit-element value.
interface: (implicit AI object/state in r7) -> r0 = ...; flags ...
details: The function reads `oAIAttackVars_HitElement` from the AI structure, indexes the two-entry table
  at `off_80F1A58`, and tail-calls the selected handler through Thumb. The first handler is the unlabeled
  `sub_80F1A60`; the second is `ai_timedAttackStepUpdate`. No argument is explicitly passed beyond the
  AI state pointer implicitly available in `r7`.
