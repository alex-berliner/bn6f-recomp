name: sub_800B6F2
address: '0x0800B6F2'
kind: function
status: confirmed
summary: In battle, scan the pending-event list from the active side of the battle state and fire any event flags
  whose entry value is >= 0x100 (mapped to flag index value+0x300), unless battle-effect bits 0x8 or 0x80000 are
  set.
interface: "void sub_800B6F2(void)\n  // inputs: r10 = toolkit base (BattleStatePtr derived), lr = return\n  //\
  \ outputs: r1, r3, r6, r7, lr (return); C, V flags set\n  // clobbers: r0, N, Z\n  // preserved: r4, r6, r7\n"
details: "Reads BattleStatePtr from the toolkit (oToolkit_BattleStatePtr), then calls\nGetBattleEffects and bails\
  \ out if bit 3 (0x8) or bit 19 (0x80000) is set —\nthese are \"do not process pending events\" guard bits.\n\n\
  Otherwise it reads a 1-byte side selector via battle_getStateByte0d_800A7E2\n(battle-state byte at offset 0x0D),\
  \ XORs it with 1 to choose the \"opposite\"\nside, and uses that index to locate two parallel fields on the battle\n\
  state struct:\n  - count:  1 byte at statePtr + 4 + side\n  - array:  u16[] at statePtr + 0x4C + 8*side\n\nFor\
  \ each of the `count` u16 entries in the array, it subtracts 0x100; if\nthe result is non-negative, it calls SetEventFlag\
  \ with flag index\n(entry - 0x100) + 0x300 (so a stored value of 0x100 sets flag 0x300).\n\nQuirks:\n  - The offset\
  \ arithmetic `add r1, r0, #4` after `eor r0, #1` selects\n    the count byte, while a separate `(side << 3) +\
  \ 0x4C` strides into\n    the table — two sides therefore sit 8 bytes apart, with 6 bytes of\n    unknown padding\
  \ between the count byte and the u16 array base.\n  - Uses `bgt` after a final SUBS, so count==0 also terminates\
  \ cleanly\n    (1-entry minimum count).\n  - Does not clear or update the pending-event list; it only fires\n\
  \    flags, presumably the caller handles consumption.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
