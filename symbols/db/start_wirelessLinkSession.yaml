name: start_wirelessLinkSession
address: '0x08039E2C'
kind: function
status: probable
summary: 'Wireless-connect state handler: gates on an event flag, initializes the wireless adapter for
  a new link session, and displays the success or failure message while setting the next state.'
interface: (r5 = network state/work struct, set by caller) -> r0 = 0 after sub_803A104; writes next state
  byte to [r5+1] (0x10 success / 0x18 failure); flags used internally from rfu_initLinkSession's return
details: The function first calls sub_803A58C and bails out (to the common sub_803A104 tail) if it signals
  failure, and also bails unless event-flag bit 8 of eFlags2009F38 is set (chatbox_mask_eFlags2009F38
  with r0=8). It then runs rfu-region helpers (sub_8146588, sub_814695C on r5+0xF0, sub_81469BC on r5+0x100
  with r1 = result of sub_803C418) before calling rfu_initLinkSession to tear down any current link and
  start a new session. If init returns 0 (success) it shows network text 0x13 via sub_803BB2C and stores
  state 0x10 into the struct's state byte at r5+1; on failure it shows text 0xA and stores 0x18. r5 is
  never set inside the function, so this is one handler of a dispatcher that keeps the state struct in
  r5. The whole flow matches the 'connecting to a wireless opponent' step of a network/comm menu.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl rfu_initLinkSession; tst r0,r0 / bne picks between text 0x13 (state 0x10) and text 0xA (state
    0x18) via sub_803BB2C; mov r0,#8; bl chatbox_mask_eFlags2009F38; beq skip gates the sequence on event-flag
    bit 8; strb r0,[r5,#1] writes 0x10/0x18 into the shared state struct's progress byte; callees rfu_initLinkSession
    (new link session) and sub_803BB2C (network text script) match a wireless-connect flow; early exits
    branch to the common tail bl sub_803A104, so it is one state in a jump-table handler chain (cf. sub_803BB2C's
    known role)
