name: battle_fallingObjectLand
address: '0x080D9788'
kind: function
status: probable
summary: 'Per-frame airborne update: drifts X by XVelocity and Z by -ZVelocity, decrements oBattleObject_Timer.
  On expiry reloads Timer to 10, sets CurAction=4 and phase=0. If the object''s panel has status bit 0x10
  set, shakes the camera (mag 2, dur 0x18); otherwise sets CUR_STATE_DESTROY and spawns a type-4 effect
  object copying fields from object+0x34. Either way, spawns an elemental damage collision region on the
  object''s panel.'
interface: (r5 = battle object pointer, no register args) -> r0 = clobbered; object Timer reset to 10,
  CurAction/phase/state updated, effect object and collision region spawned
details: Called with the object in r5 (caller sub_80D96C8 sets that up). Each tick it applies XVelocity
  to X and subtracts ZVelocity from Z, then decrements oBattleObject_Timer; while the timer is still >=0
  it just returns. When the timer goes negative it reloads it with 10, sets CurAction=4 and phase=0, reads
  the panel status of its PanelX/PanelY via object_getPanelParameters, and tests bit 0x10. If the bit
  is set it triggers a camera shake (magnitude 2, duration 0x18); otherwise it marks the object CUR_STATE_DESTROY
  and spawns a type-4 effect object, copying three fields starting at object+0x34 into it. Either way
  it finishes by spawning a collision region on its panel using its Element and Damage fields and constants
  0xb050001/0x1180003, so the landing tile becomes an elemental attack hitbox.
