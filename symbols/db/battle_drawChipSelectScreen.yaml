name: battle_drawChipSelectScreen
address: '0x08126030'
kind: function
status: probable
summary: Redraws the battle chip-selection screen (slot frame, chip icons, packed slot data) in one of
  two layouts depending on a mode field.
interface: (r5 = screen/work struct ptr) -> void; r7 = r5 internally
details: 'Takes the state struct in r5 (copied to r7). If [r7,#0x64] is 0 it does nothing; if it equals
  0xF it uses layout A (frame strips at base-0x4D +1/+4/+6/+0xE), otherwise layout B (+3/+1/+4/+0xB),
  suggesting two variants of the select screen (e.g. dark-chip / regular variant). Both layouts: draw
  a tile region via sub_812626C, blit an 8-wide tile strip (0xE rows) into tile block 2, load the hand''s
  chip icon GFX into VRAM 0x6007800 via battle_loadChipIconSprites (folder data at dword_201F420, scratch
  tile buffer byte_2017A00), pack the 7 chip-selection slot records via packSelectionSlots, then draw
  a 2x14 region and a 3x14 tile patch. [r7,#0x74] looks like a base tile/VW index (0x4D subtracted for
  the frame origin); [r7,#0x36] is a u16 passed to the icon loader and region draw. byte_2017A00 serves
  as scratch tile-id/working buffer for all the bg helpers.'
