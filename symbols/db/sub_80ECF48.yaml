name: sub_80ECF48
address: '0x080ECF48'
kind: function
status: confirmed
summary: Apply the staged AI attack's boost to its damage, set the attack animation, refresh the counter timer,
  spawn a temporary attack child object, and seed AI bookkeeping fields.
interface: 'void sub_80ECF48(void); // r3 r5 r7 r10 lr in -> r1 r5 out, r0 r2 r3 lr clobbered, r4 r6 r7 saved

  '
details: 'Operates on the AI-attack object pointed to by r7, with the parent battle object in r5. Adds

  oAIAttackVars_AttackBoost (u16) into oAIAttackVars_Damage (u32). Calls sub_80ED040 and stores

  the returned byte at oAIAttackVars_Unk_16. Writes 3 into oAIAttackVars_Unk_17, and writes

  animation index 0x0A into the parent''s oBattleObject_CurAnim. Calls object_setDefaultCounterTime

  to reset the hit-counter window. Then pushes r7, loads the parent object id / argument r4=0x1D,

  and runs r7 = R5->oBattleObject_AIDataPtr + 0x68 (per-object scratch passed to the spawner) before

  calling spawn_t1_0x5_tempAttackObject_80B8E30(r3,r4=0x1D,r5=parent,r7=aiScratch,r10=...), which

  manufactures a child attack object (type 1, param 5) reusing the parent''s AI memory region.

  Sets OBJECT_FLAGS_UNK_BIT_22_BIT on the parent via object_setFlag1. Finally stores 9 at

  oAIAttackVars_Unk_0e, 0xFFFFFFFF at oAIAttackVars_Unk_30, and 4 at oAIAttackVars_Unk_00, which

  look like AI state/timer scratch fields that drive subsequent AI phases.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
