open_questions:
- Is the "mov r0, r9" before the table-byte compare an intentional feature (using the hand address as a threshold)
  or a bug that survived into the final build? The readable C reflects the literal behavior but the comparison against
  the hand pointer is highly suspicious.
- Which elements correspond to elemIdx 1 and 2 here (Fire/Wood or Water/Elec) — depends on ChipData.elemIdx ordering
  that isn't visible in this function.
- What does battle flag 0x40 represent (tutorial/auto-battle/lockout state)? Not determined here.
- Is 0x185 (dword_800B10C) the canonical "blank/invalid" sentinel used elsewhere when invalidating a Custom Gauge
  entry?
