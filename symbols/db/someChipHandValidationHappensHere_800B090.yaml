name: someChipHandValidationHappensHere_800B090
address: '0x0800B090'
kind: function
status: confirmed
summary: Battle-start sanity check that blanks unusable chip entries in the player's Custom Gauge hand using the
  placeholder chip 0x185.
interface: "/* inputs: r0-r9 from caller (preserved), r10 = toolkit pointer, lr */\n/* outputs: r0-r9 returned unchanged\
  \ (rounded through push/pop); lr = return */\n/* clobbers flags NZCV */\nvoid validateBattleHandChip_800B090(u32\
  \ /*r0*/, u32 /*r1*/, u32 /*r2*/,\n                                    u32 /*r3*/, u32 /*r4*/, u32 /*r5*/,\n \
  \                                   u32 /*r6*/, u32 /*r7*/, u32 savedR8,\n                                   \
  \ u32 savedR9, void* toolkit);\n"
details: 'Reads toolkit->BattleStatePtr->Unk_0d (oBattleState_Unk_0d) as naviId to locate the per-Navi battle hand
  via getBattleHandAddr_8010018.; Hand layout: one leading byte (slot index) followed by 2-byte chip code entries
  from offset 2; the function targets the entry at hand + slotIndex*2 + 2.; Bails out (leaves the hand untouched)
  if battle flag 0x40 (TestBattleFlag_0x40) is set, or if the targeted entry already reads 0xFFFF (empty).; Calls
  validateChipCode_8006EE8 on the candidate chip code (with second arg 0xFF); on rejection, overwrites the entry
  with placeholder chip id 0x185 (dword_800B10C).; Otherwise looks up the chip via getChip8021DA8 and reads ChipData.elemIdx
  at offset 0x7. Only elements 1 and 2 (Fire/Wood by MegaMan Battle Network element ordering) trigger the second
  check.; Quirky step: for elemIdx 1/2 it calls GetBattleNaviStatsByte(naviId, 0xA + elemIdx), then immediately
  does "mov r0, r9" so the byte just returned is discarded and the comparison is really LD8(dword_20367E0 + elemIdx)
  vs the hand pointer. Despite the bug-shaped control flow the path ultimately writes 0x185 into the entry when
  tableByte >= hand (signed compare via blt).; The original push {r0-r7, lr} / push {r8, r9} prologue and matching
  epilogue mean all ten argument registers reach the caller untouched; only NZCV are clobbered.; Calls into: TestBattleFlag_0x40,
  getBattleHandAddr_8010018, validateChipCode_8006EE8, getChip8021DA8, GetBattleNaviStatsByte (all outside this
  file).; Touches globals: dword_20367E0 (elemIdx-keyed stat byte table referenced via off_800B108).'
