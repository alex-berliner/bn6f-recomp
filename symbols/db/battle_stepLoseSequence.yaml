name: battle_stepLoseSequence
address: '0x08008F7C'
kind: function
status: probable
summary: 'Per-frame handler for the defeat branch of the battle-end state machine: marks the losing side,
  plays the loss jingle, kicks off the lose effect, and after a countdown hands control back to the game
  state.'
interface: (r0 = battle-end state struct, fields at +3 step, +8 timer, +4 next step) -> r0 = garbage/struct
  ptr from last callee; sets oGameState_BattleEndSubState = 2 when done
details: r5 is a state struct driven once per frame; byte +3 is a step counter, halfword +8 a frame timer.
  On entry (step 0) it clears flags 0x4C43 in the eStruct2035280 word, writes (oBattleState_PlayerSide
  ^ 1) into oBattleState_LoserSide of the current battle state, plays SONG_LOSER when the battle-effects
  bitmask has bit 8, waits 0x41 or 0x66 frames depending on effects bit 2 (probably skipping a delay for
  some effect variant), dispatches battle sub-effect kind 0x18 (the lose/player-deletion animation), and
  advances to step 4. From then on it decrements the +8 timer; once it reaches 0 (or when a cross-net
  linked battle is ready via comm_checkCrossNetBattleReady), it sets +4 to 2, writes 2 into oGameState_BattleEndSubState,
  and marks byte 2 of the fixed overworld player struct at 0x200A008, ending the lose sequence.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetBattleEffects; tst bit 8 -> mov r0,#SONG_LOSER; bl PlayMusic (defeat jingle); ldrb r1,[r0,#oBattleState_PlayerSide];
    eor r1,#1; strb r1,[r0,#oBattleState_LoserSide] marks the loser; mov r0,#0x18; bl battle_dispatchKindEffect_801E792
    launches the lose effect animation; countdown on [r5,#8] then strb r0,[r1,#oGameState_BattleEndSubState]
    with r0=2 exits to post-battle handling; eStruct200A008_setUnk02(1) and flag clear of 0x4C43 tie it
    to battle cleanup, consistent with 'battlesweep' route
