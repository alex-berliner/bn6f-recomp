name: battle_networkInvert
address: '0x0800A9EC'
kind: function
status: confirmed
summary: XORs a caller-supplied value with a byte from the current battle state and returns the flipped result.
interface: 'u32 battle_invertValueWithStateByte(u32 value) /* in: r0=value, r10=toolkit; out: r0=result, NZ from
  result; also leaves battleState ptr in r1 and the state byte in r2 */'
details: 'Reads the toolkit''s battle state pointer (r10 + oToolkit_BattleStatePtr), loads the byte at

  battleState->Unk_0d, and returns r0 XOR that byte. The EOR is the last flag-setting instruction,

  so callers can branch directly on the result without a separate compare. Side effects beyond r0:

  r1 holds the battle state pointer and r2 holds the state byte on return. The meaning of

  Unk_0d is not yet identified; given the name battle_networkInvert it plausibly acts as a

  global toggle/mask used to invert values (e.g. a flag inversion helper for battle logic or

  network play), but only the mechanics are verified.

  '
