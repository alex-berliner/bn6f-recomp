name: object_spawnType17PanelHit
address: '0x080C68B0'
kind: function
status: probable
summary: Spawns a type-17 battle object (a panel-area sword/wind hit spawned on object destruction) that
  inherits the parent's panel position, element, alliance, damage and back-pointer.
interface: (r0 = panelX, r1 = panelY, r2 = element; r5 = parent battle object) -> r0 = new type-17 object
  or 0 on spawn failure
details: Saves its three arguments with push {r0-r2,r5} (reloaded shifted into r1-r3), calls object_spawnType3
  with type 0x11, and bails out if the spawn returned NULL. It then writes the passed panelX/panelY/element
  into the new object's oBattleObject_PanelX/PanelY/Element, copies oBattleObject_Alliance from the parent
  object in r5, and stores the parent's damage word (r6) into oBattleObject_DamageAndStaminaDamageCounterDisabler
  and the parent pointer into oBattleObject_RelatedObject1Ptr. This makes the spawned hit a child of the
  dying object, hitting the same panel with the same element/alliance/damage. The caller (sub_80C5D84,
  the battle-object destruction path) uses it for the sword-flavor (Param1==1) and wind-flavor (Param1==2)
  panel-area hits. The trailing data (dword_80C68D0, byte_80C68D4) looks like animation/behavior parameter
  tables for these hit types, not code.
