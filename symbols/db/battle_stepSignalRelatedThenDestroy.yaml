name: battle_stepSignalRelatedThenDestroy
address: '0x080D34EC'
kind: function
status: probable
summary: Battle-object step handler that pokes its linked object, resets a timer on an extra/child object,
  then destroys itself.
interface: (r5 = battle object this) -> r0 = destroyed; no meaningful return
details: 'Loads oBattleObject_RelatedObject1Ptr from the object at r5 and passes it to sub_80B8A0A (purpose
  unknown, likely a notification/trigger on the linked object). It then reads oBattleObject_ExtraVars+0xc,
  which must hold a pointer to another object, and uses the null-safe helper battle_ResetObjectTimerTo8
  to set that object''s +8 counter to 8, presumably arming a short delay (e.g. respawn/cooldown) on it.
  Finally it calls object_genericDestroy, releasing panel tile reserves, collision data and the object''s
  own memory. The whole routine looks like a terminal state of an object state machine: fire the link,
  set the linked timer, self-destruct. Without knowing sub_80B8A0A the exact game role (what kind of object
  and what the signal means) cannot be pinned down.'
