open_questions:
- The exact semantics of the low byte 0x80 passed to sprite_load (placeholder ID vs. robot sprite id)
  and which nibble of r1 ends up in which of r1/r2/r3 of object_setupCollisionData (the three bytes are
  extracted, but the order/role of each within setupCollisionData is hidden inside that callee). Whether
  the shadow-bit decode is `!=0` or specifically `bit7` cannot be told from `tst r0,r0` alone; observation
  of more callers' r0 high bytes vs. shadow usage would settle it.
