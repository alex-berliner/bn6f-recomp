  - bn6f/asm/asm31.s:22635
  - 0x080C2256 battle_phaseChargeSpawnAttack
  - 0x080C2324 battle_slideToPanelAction
  - 0x080C23F0 sub_80C23F0
  - 0x0800CC86 object_checkPanelParameters
