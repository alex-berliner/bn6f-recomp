name: battle_pickAttackPanel
address: '0x080C2518'
kind: function
status: probable
summary: Picks the panel to attack/occupy by scanning a per-id table of {tag,dx,dy} offsets around per-round
  base panel coords, mirroring dx by facing, returning the first panel with 0x10000 set and none of 0xF8800080,
  otherwise the related object's own panel (tag=0), otherwise none.
interface: (r0 = pattern table index (0-2), r5 = battle object) -> r0 = panel x (0 = none found), r1 =
  panel y, r2 = entry tag; advances oBattleObject_Param1 (wraps to 0 after oBattleObject_Param2)
details: r0 indexes off_80C25E4 into one of three pattern tables; each entry is 3 bytes {tag, signed dx,
  signed dy}, terminated by tag 0xFF, scanned up to 6 entries. For each round r4 from oBattleObject_Param1
  while r4 < oBattleObject_Param2, the packed byte at oBattleObject+0x6C+r4 is split into base x (low
  3 bits) and base y (bits 4-7); candidates are base + dx*object_getEnemyDirection(alliance) and base
  + dy. object_checkPanelParameters filters candidates by panel-flag masks (require 0x10000 set, none
  of 0x0F880080 set); the first pass returns immediately with r4+1 (or 0 on wrap) stored to Param1. If
  no candidate passes but one equals the related object's PanelX/PanelY, that panel is returned with r2=0;
  total failure returns r0=0. The tag byte is only forwarded in r2, likely telling the caller what kind
  of attack/effect to place there.
