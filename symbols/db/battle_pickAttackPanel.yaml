  reproduce: python3 tools/asmcat.py 0x080C2518
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The caller list and the candidates-first-fallback-to-own-panel behavior match the proposal, but
    the flag masks are swapped: dword_80C25F8 holds 0x10000 and dword_80C25FC holds 0xF880080, so the
    call requires 0x10000 set and forbids none of 0xF8800080 — actually the proposal states exactly that,
    so that part agrees. However, the proposal says ''target''s own panel as fallback'' returns r2=0;
    in the code the fallback stores 1 in [sp,#8] and returns r7=0 (loc_80C25A4 sets r7=0), so r2 is 0
    on the fallback. The summary''s wording ''first panel passing flag checks (target''s own panel as
    fallback)'' is fine. The bigger issue is the name: ''battle_pickPatternTargetPanel'' adds nothing
    and ''Pattern'' suggests a code pattern; a clearer convention is ''battle_pickAttackPanel''. Additionally,
    the proposal claims Param1 ''wraps to 0 after oBattleObject_Param2'' but the code wraps to 0 only
    when adding 1 makes it >= Param2, and only on the success path (loc_80C25B0) — accurate but the summary
    phrasing ''advances... wraps'' is just a restatement.; run wf investigate investigate-20261018-235109;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
