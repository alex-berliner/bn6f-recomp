- method: assembly-reading
  date: '2026-10-18'
  detail: 'off_80C25E4/byte_80C25B8-C0-D0: three 3-byte-entry tables, 0xFF tag terminator, signed dx/dy
    offsets; bl object_getEnemyDirection; mul r2,r3 mirrors dx by the object''s alliance-facing; ldrb
    r0,[r0,r4] at object+0x6C with lsr/lsl 0x1d splits base x (3 bits) and y (nibble); push {r0,r1} around
    bl object_checkPanelParameters with masks 0x10000/0x0F880080; first pass exits via loc_80C25A6 returning
    that panel; callers battle_phaseChargeSpawnAttack and battle_slideToPanelAction reserve/attack the
    panel this returns; Param1/Param2 loop with wraparound at loc_80C25B0'
