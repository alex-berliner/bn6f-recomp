name: ai_pickRandomPanel
address: '0x08114088'
kind: function
status: probable
summary: Picks a random valid panel from a caller-supplied list of {dx,dy} offsets around (r0,r1), requiring/forbidding
  panel flags via object_checkPanelParameters, skipping the object's own row, and mirroring dx by the
  caller's alliance direction.
interface: (r0 = base x, r1 = base y, r2 = required panel-flag mask, r3 = forbidden panel-flag mask; r4
  = list of signed-byte {dx,dy} pairs terminated by dx==0x7F, r5 = object ptr, r6 = alliance id) -> r0
  = x (low 3 bits), r1 = y of a random valid panel; r0 = 0 if none matched
details: Iterates the caller-supplied offset table (2-byte signed dx,dy entries, 0x7F terminator), computing
  each candidate panel as base + offset*getAllianceDirection(r6), so the search is mirrored for the enemy
  side. Each candidate is tested with object_checkPanelParameters(x, y, requiredMask, forbiddenMask) and
  skipped if the test fails or if y equals object byte [r5,0x13] (excludes the object's current row or
  a fixed row). Matching coords are packed (y<<4)|x into a stack buffer with count in r6. If any matched,
  GetPositiveSignedRNG and SVC 6 (Div) pick buffer[rand % count]; the byte is unpacked to x (low 3 bits)
  in r0 and y (>>4) in r1. If nothing matched, returns r0 = 0 with r1 unmodified/garbage, so callers must
  handle the empty case. The trailing tables (byte_8114140..) are such offset lists, all adjacent-step
  pairs like (1,0),(-1,0),(0,1),(0,-1).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: loop at loc_811409E reads ldrsb [r4]/[r4,1] pairs and breaks on 0x7F terminator; bl object_getAllianceDirection
    with mul r0,r2 applies side mirroring to dx before adding base coords; bl object_checkPanelParameters
    with r2/r3 from stack slots 0x24/0x28 gates each candidate; tst/beq skips failures; cmp r0,[r5,#0x13]
    with ldrb from r5 skips candidates whose y equals an object field byte; GetPositiveSignedRNG + svc
    6 (Divide) then ldrb [buffer+r1] selects a random packed entry; unpack yields x=&7 in r0, y=>>4 in
    r1
