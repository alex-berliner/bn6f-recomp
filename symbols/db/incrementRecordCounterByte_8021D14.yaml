name: incrementRecordCounterByte_8021D14
address: '0x08021D14'
kind: function
status: confirmed
summary: Increments one byte of a per-record counter table (record size 0x170 at 0x203A0A0), saturating at 0xFF,
  and returns the counter value.
interface: 'u8 incrementRecordCounterByte(u32 recordIndex /*r0*/, u32 fieldOffset /*r1*/); out: r2 = new (or saturated)
  counter byte, nzcv flags set (CMP count,0xFF on saturate path, ADDS on increment path); r0 clobbered'
details: Computes a record address as unk_203A0A0 + 0x170*recordIndex, reads the byte at record+fieldOffset (r1
  acts as a byte offset into the 0x170-byte record), and if it is below 0xFF adds 1 and stores it back; at 0xFF
  it is left unchanged (saturating counter, never wraps). The updated/saturated value is returned in r2. Flags are
  a side effect of the branch comparison or the increment; callers per the contract only consume r2 and flags. The
  0x170-byte record structure and the meaning of individual counter fields within it are not yet identified, so
  the table at unk_203A0A0 (0x02000000-region work RAM) needs mapping before a subsystem prefix can be assigned.
