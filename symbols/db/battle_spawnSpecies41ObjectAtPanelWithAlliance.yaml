name: battle_spawnSpecies41ObjectAtPanelWithAlliance
address: '0x080CC584'
kind: function
status: probable
summary: Spawns a type-3 battle object of hardcoded species 0x41 at a caller-given panel, copies the alliance
  from a source object in r5, and initializes its panel/sprite/collision via the standard helper.
interface: (r0 = panel X, r1 = panel Y, r5 = source battle object) -> r0/r5 = new oBattleObject or unchanged
  on spawn failure; flags Z from the spawn result
details: The wrapper pushes its three arguments (r0, r1, r5) as the stack argument block for object_spawnType3
  and calls it with species 0x41 in r0. If the spawn returns a null pointer (beq after the flag-setting
  Thumb 'mov r0,r5'), nothing else happens. Otherwise it stores the saved r0/r1 into oBattleObject_PanelX/PanelY
  of the new object, copies oBattleObject_Alliance from the caller-supplied source object in r5, then
  moves the new object into r5 and calls battleObject_initFromPanelSpriteAndCollision_80CC4EC to set up
  its panel position, sprite/animation and collision block and advance its state. r5 is saved/restored
  around that call, so r5 is used as the object pointer register by the callee.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#0x41; bl object_spawnType3 — spawns a type-3 battle object of species 0x41 using the
    pushed r0/r1/r5 as stack args; Thumb 'mov r0,r5' (LSLS alias) sets flags, and 'beq locret' skips everything
    when the spawn produced no object; strb r1/r2 to oBattleObject_PanelX/PanelY places the new object
    at the caller's panel coordinates; ldrb r3,[r5,#oBattleObject_Alliance]; strb r3,[r0,#oBattleObject_Alliance]
    inherits alliance from the third argument; mov r5,r0; bl battleObject_initFromPanelSpriteAndCollision_80CC4EC
    runs the standard initializer on the new object
  refs:
  - bn6f/asm/asm31.s:44089
