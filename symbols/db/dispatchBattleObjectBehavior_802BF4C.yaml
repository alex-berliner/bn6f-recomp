name: dispatchBattleObjectBehavior_802BF4C
address: '0x0802BF4C'
kind: function
status: confirmed
summary: Dispatches a battle-object behavior update to one of three handlers selected by a per-object
  state byte at [R5+3].
interface: 'void sub_802BF4C(void);   // in: R5=object pointer, R2/R4/R6/R7/R10=scratch; out: r0..r4,lr
  clobbered

  '
details: 'Reads the low byte at [R5+3] (a behavior/state selector) and uses it to index a

  three-entry Thumb function-pointer table at off_802BF60 (entries 0, 4, fallthrough),

  then tail-calls the chosen handler with R0=selector and R1=the function pointer itself.

  Handlers: sub_802BF6C, sub_802C044, sub_802C0A4. The push {lr}/pop {pc} bookend is a

  register-form artifact: it lets the callee build its stack frame relative to SP and

  pops the return into PC on return. R5 is presumed to point at a battle/object struct

  whose +3 byte is the behavior ID. No other structures are touched here directly;

  all real work is in the dispatched handlers.

  '
