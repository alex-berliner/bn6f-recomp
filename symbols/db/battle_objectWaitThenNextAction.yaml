name: battle_objectWaitThenNextAction
address: '0x080B8F66'
kind: function
status: probable
summary: 'Battle-object phase handler: starts a 30-frame wait (phase 4, anim 0), then sets CurAction=8
  and clears the phase when the timer expires.'
interface: (r5 = battle object) -> void; sets oBattleObject_CurPhase, CurAnim, TimerAndTimer2, and on
  timeout CurAction/phase
details: Reads oBattleObject_CurPhase from the object in r5; if it is 0, it stores phase=4, CurAnim=0,
  and a 30-frame timer into TimerAndTimer2, then returns. Otherwise it decrements the 16-bit oBattleObject_Timer;
  when it reaches zero it writes CurAction=8 and zeroes CurPhaseAndPhaseInitialized, letting the object's
  action dispatcher pick the next action. No other structures or callees are touched. Without callers
  it is unclear which object or which action 8 is, but the shape is a standard per-frame phase tick.
