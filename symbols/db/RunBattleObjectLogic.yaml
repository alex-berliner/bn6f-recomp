open_questions:
- Exact purpose of eUnkBattleObjectLinkedList (a "currently processed object" handle for other battle code to read;
  no reader has been identified in this function).
- Whether the per-type jumptable in off_800323C maps to debug-message printouts (the adjacent "P%02x" / "E%02x"
  / "M%02x" / "S%02x" / "F%02x" format strings) instead of update routines, since the original function is named
  for "logic" yet half the table points at format strings.
- Identity of the NULL entries in the outer jumptable (types 0 and 2 have NULL inner pointers, suggesting either
  unused types or types whose update path is established elsewhere).
- Whether the LSB `0x1B` bytes on each format word are an opcode prefix for a thumb helper that these strings are
  the operands of.
