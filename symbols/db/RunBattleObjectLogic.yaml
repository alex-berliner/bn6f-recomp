name: RunBattleObjectLogic
address: '0x080031AC'
kind: function
status: confirmed
summary: Walks the battle-object linked list once per frame and dispatches each non-sentinel node to its type/index-specific
  update routine, with pause and time-stop gating.
interface: void RunBattleObjectLogic(void); /* uses r10 = toolkit pointer on entry; NZCV clobbered, r0-r3 and lr
  clobbered, r4-r7 preserved, r2/r3/r8/r9/r10/r11/r12/lr read on entry */
details: "Clears a 3-byte per-frame object scratch area via object_Clear3RAMBytes_800371A (a comment in the\ndisassembly\
  \ notes that disabling this call causes sprites to glitch/blink, panel elements to\nturn to poison, MegaMan to\
  \ stop moving, and enemies to stop attacking). Then iterates the inner\nlinked list whose head is eBattleObjectsLinkedListStart\
  \ (field at +oBattleObject_LinkedList_Next),\nstopping at eBattleObjectsLinkedListSentinel. For each node it:\n\
  \  - stores the current node pointer into eUnkBattleObjectLinkedList (a \"currently processed\n    object\" slot\
  \ that is cleared back to 0 once the loop ends),\n  - reads the object \"core\" at node+0x10 (this is where the\
  \ per-object fields live),\n  - reads the flags byte at +oBattleObject_Flags and checks oGameState_BattlePaused\
  \ via the\n    toolkit's oToolkit_GameStatePtr; when the battle is paused (menus open, etc.) only objects\n  \
  \  with the PAUSE_UPDATE flag (defined elsewhere as 0x4) keep updating,\n  - calls battle_isTimeStop; when time\
  \ is stopped only objects whose flags have bit 0x10 set\n    (OBJECT_FLAG_UPDATE_WHILE_TIME_STOPPED, the \"update\
  \ while time is stopped\" flag) run,\n  - dispatches via a 2-level ROM jumptable: the outer index is the low 4\
  \ bits of\n    oBattleObject_Type, the inner index is oBattleObject_Index, and the leaf routine is\n    loaded\
  \ with `push {r7}; mov lr, pc; bx r0; pop {r7}` (r7 is the linked-list node and must\n    come back live),\n \
  \ - then calls object_800372A on the object core as a post-update step.\nThe outer jumptable at .BattleObjectFunctionJumptableTable\
  \ is sparse (NULL/NULL/T1/T3/T4/\noff_800323C), so most object types share the per-index jumptable in off_800323C,\
  \ while types\n2 and 4 use their own dedicated tables T3BattleObjectJumptable and T4BattleObjectJumptable.\nThe\
  \ trailing word/hword/.asciz records in the disassembly (0x1B + \"P%02x\" / \"E%02x\" / \"M%02x\"\n/ \"S%02x\"\
  \ / \"F%02x\" at word_8003250..word_8003270) are debug-format strings (Player/Enemy/\nMystery/Subchip/Field-style\
  \ prefixes) that live in the same ROM page as the jumptable; they\nare not read by this function but are reached\
  \ through off_800323C as a separate table.\nThe original zeroes a 4-byte stack slot at sp+0 that is never read,\
  \ so the C version omits it.\n"
