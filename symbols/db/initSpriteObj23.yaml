name: initSpriteObj23
address: '0x0811A878'
kind: function
status: probable
summary: 'Initializes GUI sprite object 0x23 using graphic eGuiSprite2022FA0 (sprite 0x2B): runs a sub-init
  (sub_811A940 with 0,6), then sets palette 0, OAM priority 2, slot halfword 0x1D0, sub-entry palette
  bank 0xA, sub-record +0xA=4, positions at (0x78,0x50,6), runs sub_811A914(0,6), writes state 4 to [r5+8],
  and finishes via sub_811A8D0.'
interface: () -> void; operates on a global object pointer in r5 (no args)
details: 'Writes 0x23 to byte [r5] (object type/state id) and 4 to [r5+8] (a phase/state counter) around
  a standard GUI-sprite setup sequence. It calls initGuiSprite_8002770 with sprite index 0x2B and the
  graphic data at eGuiSprite2022FA0, then configures rendering: palette 0, OAM priority 2, halfword 0x1D0
  stored into a sprite slot list (likely a tile/animation id), sub-entry palette bank 0xA, and sub-record
  field +0xA = 4. It then calls a position/pose routine with (x=0x78, y=0x50, 6) and a sub_811A914(0,6)
  pair, finishing with sub_811A8D0. The (120,80) coordinates sit near screen center, and the state byte
  4 written after setup suggests this object starts in a specific display state; which exact HUD element
  it is (e.g. a menu cursor or gauge) is not determinable from this function alone.'
