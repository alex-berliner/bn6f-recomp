  date: '2026-10-18'
  detail: bl IsScreenFadeActive; beq skip; mov r0,#8; strb r0,[r5]; mov r0,#0; strb r0,[r5,#1] — fade-gated
    reset of two state bytes; bl sub_80343B0 then pop {pc} — unconditional tail-call into the known world-map
    animation/queue drain step; r5 used without setup in a thumb routine — caller holds the map state
    struct in r5, indicating an inline frame-update role; callee sub_80343B0's known summary names the
