name: ow_worldMapTick
address: '0x080342C6'
kind: function
status: probable
summary: 'Per-frame update of the world-map screen: resets a state field to 8 while a screen fade is active,
  then advances the map''s animation table.'
interface: () -> void; reads caller's r5 as state struct ptr; sets bytes [r5]=8, [r5+1]=0 conditionally;
  flags clobbered by calls
details: Runs every frame of the world-map screen (seen in beastsp, maps, menus, story routes). It calls
  IsScreenFadeActive and, if a fade is in progress (beq skips the stores when not fading), writes 8 to
  byte 0 and 0 to byte 1 of the struct pointed to by r5 — most plausibly an animation/sub-mode selector
  being forced to a fixed frame during fades. It then tail-calls sub_80343B0, which per the project advances
  the world-map animation table, queues its row palette, restamps the 32x20 BG tile block, ticks entities,
  and drains queued GFX. r5 is used without being set, so the caller holds the world-map state pointer
  in r5 and this routine is a frame-step helper of that screen.
evidence:
