name: ai_circusmanCalcAttackParam
address: '0x080FEA74'
kind: function
status: probable
summary: Computes one of CircusMan's attack parameters by combining two difficulty-tier table values with
  a battle-object variable and a flag-conditioned +60 adjustment.
interface: (r5 = battle object, oBattleObject_ExtraVars+8 read) -> r0 = computed parameter; flags clobbered
details: Loads the table byte_80FEAA0 (per-tier values 0x16,0x10,0xA,0x8 followed by 0x10 x4) and calls
  sub_800FE28 twice, once with the table base and once with base+4, suggesting the callee indexes the
  table by the current difficulty tier to return two values. The first value becomes the base (r4); the
  second is multiplied by the object's ExtraVars+8 field and added. It then reads the object's flag word
  via object_getFlag and, if bits 0xA000 (bits 15 and 13) are set, adds 0x3C (60) to the result before
  returning it. Given the only caller (ai_circusmanInitAttackState) fills attack parameters from helpers
  before launching attack id 0xC, the return value is very likely a timing/distance parameter for that
  attack, with the +60 extending it under the flagged condition.
