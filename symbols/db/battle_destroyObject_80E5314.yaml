name: battle_destroyObject_80E5314
address: '0x080E5314'
kind: function
status: confirmed
summary: Tears down a battle object — releases its drop entry when needed, zeroes its extra-variable block,
  and returns its memory to the object pool.
interface: void battle_destroyObject_80E5314(r5 battleObject); // r5 = object, preserved on return; r10
  passed by callers but unused here
details: 'Common battle-object teardown path called with the object pointer in r5. First reads oBattleObject_Param3
  (a byte): if it is zero, the object never "used" its drop (Param3 appears to flag that a drop was taken/handled
  elsewhere), so battle_clearDropEntryById(r5) is called to release any drop slot registered for it. Then
  it stores 0 to the 32-bit field at oBattleObject_ExtraVars (clearing the extra-variable block) and finally
  calls object_freeMemory(r5) to return the object to the pool, which preserves r5, so the destructor
  itself ends with r5 unchanged. r10 comes in per the callers'' ABI but is never read in this body. Sets
  no meaningful outputs beyond the callee side effects; flags are clobbered by the callees.

  '
