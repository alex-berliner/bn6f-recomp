name: sub_80FDA62
address: '0x080FDA62'
kind: function
status: confirmed
summary: Chooses a random valid panel for a panel-targeting AI action, falling back from an ignore-column candidate
  list to a same-row list, then decodes its packed (column,row) byte into r0/r1 for the actor's action.
interface: "/* r0 = target object, r2/r3 = filter args, r5 = actor object,\n * lr = return address. clobbers nz/c/v\
  \ and r2/r3; preserves r4-r7. */\nvoid Next(object *targetObj /*r0*/,\n          u32 filterA /*r2*/, u32 filterB\
  \ /*r3*/,\n          object *actor /*r5*/);\n/* returns row in r0, column in r1; r5 passed through */\n"
details: 'Reserves the actor''s panel (actor->0x12 col, actor->0x13 row via

  object_reservePanel) and asks for candidate panels in the stack buffer

  at sp+0xC: first object_getPanelsIgnoreColumnFiltered(target->0x13, r2,

  r3, sp+0xC), and if that list is empty (r0==0), falls back to

  object_getPanelsInRowFiltered with the same args. The non-empty count

  is used as divisor for the BIOS Div (swi 6) modulo the value from

  GetPositiveSignedRNG, picking one byte from the panel list. The byte

  is unpacked as column = high nibble (>>4), row = low 3 bits (<<29>>

  29 / lsl #0x1d lsr #0x1d). object_removePanelReserve releases the

  reservation; r0/r1 are pushed/popped across that call to survive it.

  With no candidate, r0=0 and r1 retains whatever

  object_getPanelsInRowFiltered left in r1. Calls object_reservePanel /

  object_removePanelReserve with r0/r1 = actor''s col/row bytes and r5 =

  actor; calls the panel-list helpers with r0 = target->0x13, r2/r3 as

  passed in, r7 = stack buffer address. Output r0/r1 become (row, col)

  for the panel the action should target. Stack frame: 0x24 bytes of

  locals plus push {r6,r7,lr}.

  '
