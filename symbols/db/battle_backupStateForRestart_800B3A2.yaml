name: battle_backupStateForRestart_800B3A2
address: '0x0800B3A2'
kind: function
status: confirmed
summary: Snapshots the current battle state (work buffer, active Navi stats, and a small inventory block) into backup
  buffers and stamps a validity marker before the battle is restarted or restored.
interface: '(r10: Toolkit*, r3: unused) -> r2, r3 and c/v flags as left by sub_80200A4(0x32); clobbers r0, r1, lr,
  nz'
details: 'Creates a restore point of the live battle so the game can later fall back to it (e.g. the "restart battle
  / continue" path after a loss or a mid-battle restore). Steps: (1) CopyWords copies 0x50 words from byte_20366C0
  into the backup buffer dword_203CBE4 — this is the battle work area. (2) Writes the magic marker 0x56789123 to
  dword_203CBE0, which presumably flags "backup data is valid" for the matching restore routine. (3) Reads the battle
  state pointer from Toolkit+oToolkit_BattleStatePtr, takes byte at offset 0xD (which Navi/alliance slot is active),
  calls GetBattleNaviStatsAddr to get that Navi''s stats block, and CopyWords copies 0x64 words of it to the backup
  at byte_203CC34. (4) Copies a 0x10-word block from byte_203CED0 to backup byte_203CC98 (looks like a small bag/inventory
  or item snapshot). (5) Calls sub_80200A4 with r0 = 0x32 as a final post-processing step for the snapshot. Note
  the magic value 0x56789123 is stored at dword_203CBE0, distinct from the buffer at dword_203CBE4.

  '
