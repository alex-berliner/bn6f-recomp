open_questions:
- What fields in the unk_2036120 0x1D0-stride record correspond to AIData offsets 0x50 and 0x54; they're
  outside both the BattleObject and the AIData layouts declared in structs, which suggests the table entry
  is a wrapper struct not yet documented.
- The semantic meaning of timer_2000000 vs 0x20000000 (one looks like a per-frame elapsed-bit, the other
  is one-shot). The first writes 1 at +0x50 (counter?), the second writes 1 at +0x54 + grants invuln (looks
  like an "exit bubble" or "end of guard" handler).
- Whether sub_802E1EC and sub_802D310 are also player-AI tick helpers or generic AIData mutators.
