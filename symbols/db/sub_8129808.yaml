name: sub_8129808
address: '0x08129808'
kind: function
status: hypothesis
summary: Battle object hook that reads the +0x1D state index, queries sub_812B318 (with an optional sub_812B318-cleanup
  call when sub_812B318 returns non-zero in r1), and when the cached r2 result equals 3 sets the object's +3 state
  byte to 4 and invokes sub_811A610(1, 0).
interface: void sub_8129808(struct BattleObject* obj /* r5 */);  /* clobbers r0-r3, lr, N Z C V; preserves r4-r7
  */
details: "Called from outside (the save comment in the C is misleading; the actual callee is sub_812B318,\nnot sub_812B318).\n\
  - Reads byte at r5+0x1D (\"state index\") and passes it in r0 to sub_812B318.\n- sub_812B318 returns a result\
  \ in r2 (cached in r4) and a flag in r1; if r1 != 0,\n  sub_812B218 is invoked (presumably a paired cleanup/finalizer\
  \ keyed off the same index).\n- When the r4-cached result equals 3, the object's byte at +3 is overwritten with\
  \ 4 (next\n  animation/state step) and sub_811A610 is called with (1, 0) — likely a sound/SFX trigger\n  (\"play\
  \ SFX 1, channel 0\" or similar battle notifier).\n- The +0x1D index and +3 state fields, together with sub_812B318\
  \ and sub_812B218, identify\n  this as a battle-object animation/state tick function (e.g. chip/attack frame advance).\n\
  - Returns silently (pops {r4,pc}) after either branch; caller-supplied r4-r7 are preserved.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
