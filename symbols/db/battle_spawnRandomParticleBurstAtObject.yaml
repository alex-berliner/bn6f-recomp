name: battle_spawnRandomParticleBurstAtObject
address: '0x080C7EC8'
kind: function
status: probable
summary: Spawns 1-4 randomly-counted particles (twice) at a battle object's position from a parameter table, then
  plays sound effect 0xD9.
interface: (r5 = battle object ptr) -> void; clobbers r0-r7, lr; calls GetRNG, sub_80E1084(r0=2, r1=X, r2=Y, r3=0,
  r4=1-4), PlaySoundEffect(0xD9)
details: The function assumes r5 points to a battle object (reads oBattleObject_X and oBattleObject_Y directly from
  it). It loops twice (r3 = 0..1), and each iteration calls GetRNG, computes r4 = (rand & 3) + 1 (a random count
  of 1-4), and calls sub_80E1084 with r0 = 2 (particle/effect kind), the object's X and Y, r3 = 0, and r4 as the
  count. The two word-pairs passed to sub_80E1084 come from a table at dword_80C7F00 (entries walked with r6 +=
  8), values like 0x8000/0x00028000 and 0x00030000/0x00010000, likely per-iteration particle motion/appearance parameters.
  After both iterations it plays sound effect 0xD9 once. The exact meaning of sub_80E1084's args is not confirmed
  from this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_80C7ECE loop: bl GetRNG; mov r4,#3; and r4,r0; add r4,#1 — random 1-4 passed as 4th arg to sub_80E1084;
    ldr r1,[r5,#oBattleObject_X] / ldr r2,[r5,#oBattleObject_Y] — effect is positioned at a battle object; ldr r6,off_80C7EFC
    then ldr r7,[r6,#4]/ldr r6,[r6] with r6 += 8 per loop — two fixed word-pair parameter entries passed to sub_80E1084(r0=2,...);
    mov r0,#0xd9; bl PlaySoundEffect — one sound effect played after the particle spawns'
