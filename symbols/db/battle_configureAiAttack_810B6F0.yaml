name: battle_configureAiAttack_810B6F0
address: '0x0810B6F0'
kind: function
status: confirmed
summary: Selects AI attack difficulty tier (fixed or random coin-flip) and populates the AIAttackVars
  damage/timing fields from version-indexed tables, then signals readiness on the BattleObject.
interface: r0 = mode (0 random, 1 tier-0, 2 tier-1), r4 = AIData*, r5 = BattleObject*, r7 = AIAttackVars*;
  outputs r3 (RNG residue or passthrough), r7 preserved; clobbers r0-r2, flags, lr.
details: If mode==1 sets tier 0 and uses byte_810B740; if mode==2 sets tier 1 and uses byte_810B746 (both
  tables are identical six-byte damage arrays indexed by AIData_Version_16). Otherwise calls GetPositiveSignedRNG
  and tests bit 0 of r0 for a 50/50 coin-flip, selecting tier 0 or 1. Writes tier byte to AIAttackVars_AiDifficultyTier,
  sets ExtraDamage to 0x0A, loads Damage/StepTimer/AttackDuration from the version-indexed byte tables
  (byte_810B740/746 for damage, byte_810B74C for step timer, byte_810B752 for duration), and zeroes SubStepIndex.
  Finally writes 1 to BattleObject_ExtraVars+4 to mark attack configuration complete. The tier-0 and tier-1
  damage tables happen to be byte-identical, so difficulty only affects the stored tier value (used elsewhere)
  and not the raw damage number; timing tables also do not branch on tier in this function.
