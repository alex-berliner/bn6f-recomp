status: probable
summary: 'BattleObject stage-update: toggle a header flag from AIData Unk_0e, snap sprite to (0xCC, 0x1E)
  and refresh.'
interface: '(r5 = BattleObject*, r6 = AIData*) -> void ; side effects: mutates BattleObject header byte
  0 (bit1), calls into sub_811E202 / sprite_setCoordinates(0xCC, 0x1E) / sprite_update.'
details: "Loads the current value of the BattleObject header byte (r5, offset 0) into r4, then\n  reads\
  \ AIData Unk_0e at [r6 + 0xe]. If Unk_0e is zero, ORs 0x02 into the header\n  (`bic/orr` around `mov\
  \ r1, #2`); otherwise clears bit1 of the header. Stores the\n  patched header byte back at [r5].\n \
  \ Falls through to sub_811E202 (no args visible) which is described as\n  \"set sprite 0x2c flags from\
  \ AI version\".\n  Hard-codes r0 = 0xCC and r1 = 0x1E and calls sprite_setCoordinates(r5, 0xCC, 0x1E),\n\
  \  parking the sprite at panel-grid (0xCC, 0x1E).\n  Finishes with sprite_update(r5) to push the new\
  \ header flags/coords into the live sprite.\n  The fixed coords (0xCC, 0x1E) and the bit toggling on\
  \ Element (Unk_0e) line up with a\n  \"beast-out / row changed\" reset for BeastSp-style actors (the\
  \ captured call snapshot\n  for beastsp_0140000 matches this path repeatedly).\n"
