  detail: '- `ldrb r4, [r5]` then conditional `bic r4, r1` / `orr r4, r1` with r1=2 and `strb r4, [r5]`
    (asm32.s:32095 lines for battleObject_setCoordsAndUpdateSprite_811E1D4) show header bit1 being set/cleared based on a test. - `ldrb
    r0, [r6,#0xe]` followed by `tst r0, r0` / `beq loc_811E1E4` ties the toggle to AIData+0xe. - Captured
    calls: r5 is reused by all 40 snapshots (e.g. r5=020118d8, r6=0x0c in snap_beastsp_0140000_0), entry
    r1=0x04 / r1=0x0a4 in beastsp_0140000_1 etc., consistent with a BattleObject (r5) + AIData (r6) caller
    convention used elsewhere in sub_811E18C. - Caller sub_811E18C has the same `in=[''r1'',''r5'',''r6'',''lr'']`
    contract and routes through this function, so the toggle is a per-actor stage update. - `mov r0, #0xcc`
    / `mov r1, #0x1e` then `bl sprite_setCoordinates` is the literal coords handed to the sprite, and
    `bl sprite_update` finalizes it (sprite_setCoordinates/sprite_update confirmed callees).'
