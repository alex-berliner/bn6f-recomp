summary: 'Shuffle-once button handler (custom screen, active slot 8): a chip of type 4/5 whose enabled byte is 0
  starts the shuffle state machine (jump 0x28 -> sub_80271F8) with sound 0x82; a nonzero enabled byte plays SOUND_CANT_JACK_IN
  instead.'
details: 'Body (asm03_0.s:5766-5795): the chip record''s type byte [r4] == 5 is treated as 4 (sub r4,#0xC); [r4+7]
  != 0 (already used) -> SOUND_CANT_JACK_IN, return 1; otherwise S20364C0+1 = 0x28 and +2 = 0 route the custom screen''s
  state machine into sub_80271F8 (via custMenuMainMaybe_8026A88), sound 0x82 (0x83 + -1), return 0. The chip must
  also be enabled by NaviStats byte 0x60 == 1 (battle_checkActiveSlot8NaviStatReady_802A5DA).'
