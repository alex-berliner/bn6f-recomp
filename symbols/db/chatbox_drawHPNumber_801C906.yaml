  as entry 7 of off_801BF88 when bit 7 of +0x44 is set. It reads the u16 at +0x24 (the HP the box shows, copied
  from MegaMan''s object HP on hits and heals), converts it with memory_bcdConvert, builds a 4x2 tile-id patch (digit
  tiles from 0xD1A0, leading positions blank via the 0xAAAA mask and countHexDigits_8000C5C) and copies it with
  CopyBackgroundTiles at column +1 + 1, row +2 of tile block 3; then queues 0x20 bytes of digit graphics from dword_86E1C78
  + 0x20 * byte +3 to 0x03001B00.


  (Earlier reading, kept for reference:) Routine runs at 0x0801c906. r5 points at an AIData-like record (JoypadPressed
  at +0x24 is read as u16,

