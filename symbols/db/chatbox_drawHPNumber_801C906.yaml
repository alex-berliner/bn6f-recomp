- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r0,[r5,#0x24]` + `bl memory_bcdConvert` (JoypadPressed reinterpreted as HP/BCD source).
    - `bl countHexDigits_8000C5C` then `lsl r1,r0` xored with `0xAAAA` per nibble pairs => 2-digit-tile
    packing. - Stack frame `sub sp,#0x10` and the 4-pair strh loop at loc_801C92A building the u16 tile-id
    array. - `CopyBackgroundTiles(... j:r5+1 = AIIndex+1, i:r5+2 = Unk_02, tileBlock32x32:3, j_size:4,
    i_size:2)` - 4x2 layout for HP readout. - Final `ldr r0,[r5,#3]` (Unk_03) shifted by 5 (= *32) is
    the per-character offset into a 0x20-byte digit GFX blob; `QueueEightWordAlignedGFXTransfer(byte_3001B00,
    dword_86E1C78 + offset, 0x20)` reloads digit graphics into IWRAM/VRAM staging. - Caller origin `lr=0801bf7c`
    aligns with chatbox/battle update routines that own this AIData pointer.'
