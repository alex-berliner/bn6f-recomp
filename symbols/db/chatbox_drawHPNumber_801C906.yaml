status: probable
summary: Builds per-digit tile rows for an HP display in the chatbox, copies them to a BG tile block and
  queues the digit GFX source into VRAM.
interface: (r5 = AIData*, r10 = Toolkit*) -> r0 = pointer to digit-tile-id array (in stack temp / re-used);
  no callee-restore outputs
details: 'Routine runs at 0x0801c906. r5 points at an AIData-like record (JoypadPressed at +0x24 is read
  as u16,

  then split into per-digit BCD nibbles via memory_bcdConvert). It reads those four digits back from

  countHexDigits_8000C5C (number of hex digits needed) and weaves a "0xA" digit-set bitmask

  (`dword_801C980 = 0xAAAA << (digitCount*2)`) into the low nibbles so that each digit position

  also encodes its index into the digit-tile table at `0xD1A0` (entries are pairs: nibble 0 -> tile

  `0xD1A0 + 2*v`, +1 = top tile).

  It writes pairs into an 8-byte stack buffer at r6, then calls CopyBackgroundTiles with

  j = AIIndex+1, i = Unk_02, tileBlock = 3, j_size = 4, i_size = 2 (a 4x2 patch for the HP readout),

  where the tile-id pair list is the on-stack array. After that it pops r5 and reads Unk_03 of the

  AIData, multiplies by 32, adds a base pointer (loaded via `dword_86E1C78` at `off_801C970`) and

  QueueEightWordAlignedGFXTransfer-s 0x20 bytes from that address into IWRAM at 0x03001B00,

  presumably to refresh the small BG3/chatbox HP readout tile slab.

  Returns nothing meaningful in caller-visible registers; restores r4/r6/r7/lr and ends in `--/NZCV=----`.

  '
