status: probable
summary: 'Per-frame battle main routine: dispatches the current battle state''s handler, then runs the
  common sprite/panel/OAM render pipeline.'
interface: (r5 = * BattleState) -> r0 = clobbered; sets byte at eStruct203F7D8+1 to 2
details: 'Reads BattleState field oBattleState_Index_01 as an index into a 3-entry jump table (off_8007EAC:
  sub_8007EB8/F14/F2C) and tail-calls the selected state handler with LR=PC. On return it executes the
  fixed per-frame tail: sprite_setRenderFlushState, sprite_resetPaletteCount, project+queue all object
  sprites, render object sprites, update sprites, update panels, run flagged callbacks, refresh the custom
  gauge from AI, reset palette slot 0, gameMode_switchToMode2, finish the queued sprite group (recording
  palette count into slot 5 of byte_200F389), and drain the OAM queue. Finally it stores 2 into eStruct203F7D8+1,
  likely a frame/phase flag consumed elsewhere.'
