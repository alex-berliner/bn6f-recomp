name: battle_lungeForwardState
address: '0x080DCD74'
kind: function
status: probable
summary: Battle-object state handler that dashes the object forward off its side of the field for 6 frames
  while highlighting the panels it passes, then destroys itself.
interface: (r0 implicit = object ptr in r5, reads oBattleObject_CurPhase) -> updates X/Z position, velocities,
  timers; sets state to CUR_STATE_DESTROY when done
details: 'On phase 0 it plays sound effect 0x7F, sets CurPhase=4, computes the facing multiplier via object_getFrontDirection,
  stores XVelocity = dir*0x80000 and ZVelocity = dir (a fast forward dash of half a panel per frame in
  X plus one row step in Z), and sets Timer=6. Each later phase it applies X += XVelocity and Z -= ZVelocity,
  decrementing Timer; when it reaches 0 it calls sub_80DCDFA and sub_80DCE18 (likely end-of-dash/collision
  effects) and queues the object for destruction. Every 8 frames of Timer2 it calls object_highlightPanel
  on the object''s current PanelX/PanelY, marking the tiles it travels over as highlighted (attack-area)
  panels. Uses standard oBattleObject fields: CurPhase, CurStateActionPhaseAndPhaseInitialized, X, Z,
  XVelocity, ZVelocity, Timer, Timer2, PanelX, PanelY.'
