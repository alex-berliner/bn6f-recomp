summary: 'Fills the 12-byte battle-result record (target passed in r0, e.g. 0x0203CBE4): +0 mode (0, or 1/2 from
  GetBattleEffects bit 8 + state nibbles), +1 busting level (BattleState+0x1E), +3 the count of nonzero rewards,
  +4 battle time, +8 reward 1, +0xA reward 2 (BattleState+0x36).'
details: 'Body (asm03_0.s:13615-13681): mode byte from GetBattleEffects bit 8 (0 otherwise) refined by battle_getStateByteNibbles_800A832
  (1 -> 1, else 2); +4 = battle_getStateUnk40_800A704; +1 = BattleState.oBattleState_Unk_1e. Reward 1/r2 come from
  sub_80AA8E0 (the effects-bit-8 path, with HP/MaxHP and the enemy''s alliance XORed) or sub_80AAC8C otherwise;
  +0xA = that call''s r1 (BattleState+0x36, the reward-2 halfword); +3 counts the nonzero rewards. First frame of
  the result link-sync state (called from sub_800B428 with 0x0203CBE4).'
