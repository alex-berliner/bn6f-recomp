name: battle_phaseAnim3Sound94Wait
address: '0x080C21E0'
kind: function
status: probable
summary: 'Battle-object phase handler: plays anim 3 with sound effect 0x94 (148), waits 3 frames, then
  ends the phase returning CurAction 4.'
interface: (r0 = battle object, used via r5) -> r0 = clobbered; sets oBattleObject_PhaseInitialized=4,
  CurAnim=3, oObjectHeader_Flags|=2, Timer=3; on expiry sets CurAction=4 and clears CurPhaseAndPhaseInitialized.
details: Runs as a per-phase routine for a battle object, using r5 as the object pointer. On first entry
  (PhaseInitialized==0) it marks phase type 4, selects animation 3, sets object header flag bit 1 (probably
  an anim/visible control flag), plays sound effect 0x94 through the M4A wrapper, and loads a 3-frame
  timer into oBattleObject_Timer. On later entries it just decrements Timer; when it hits zero it writes
  CurAction=4 and clears CurPhaseAndPhaseInitialized so the object's script resumes at the next action.
  No pointer or return value is produced; all state lives in the object struct.
