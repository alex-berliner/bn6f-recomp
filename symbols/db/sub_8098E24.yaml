name: sub_8098E24
address: '0x08098E24'
kind: function
status: confirmed
summary: Resolves the current chip-use record's Navi index into the behaviour lookup table at off_8098CFC, copies
  overlay bytes and a conditional sprite flag into the battle object, then fires any encoded event-flag set/clear.
interface: void chipApplyNaviEntry_8098E24(chipUse_t *r5 /* chip-use record with navi index at +4 */, battleToolkit_t
  *r10 /* toolkit with inner battle object at +0x3C */)
details: 'Reads byte at chip_use+4 as a Navi index, multiplies by 0x1C (28-byte stride) to locate an entry in off_8098CFC,
  stores the resolved entry pointer at chip_use+0x34, copies entry+0x10/0x11 into chip_use+6/+7 as overlay/sprite
  bytes. Fetches the battle object via toolkit+0x3C; if entry+0x12 != 0xFF it writes that byte to inner+0x16 and
  resets inner+0x17 to 0xFF (likely a pending-animation or state-clear handshake). Reads 16-bit fields at entry+0x14
  and entry+0x16 as event-flag IDs: non-zero values are passed to SetEventFlag / ClearEventFlag respectively. Returns
  r0=0 (NZ zero), r4–r7 preserved via push/pop; r1/r2 left from the flag-call results per the verified C wrapper.'
