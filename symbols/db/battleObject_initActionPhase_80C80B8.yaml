name: battleObject_initActionPhase_80C80B8
address: '0x080C80B8'
kind: function
status: confirmed
summary: 'Initializes a battle object on entering its action phase: syncs panel position, zeros Z, builds
  collision box, plays entry VFX/SFX, and transitions state to CUR_STATE_UPDATE.'
interface: void battleObject_initActionPhase_80C80B8(void /* r5=oBattleObject, r8=?, r10=?, lr=ret */);
details: "Called when a battle object's action phase begins. Behavior in order:\n  1. Calls object_setCoordinatesFromPanans\
  \ to sync the object's grid-panel position into its X/Y.\n  2. Zeros the Z coordinate (r5->oBattleObject_Z)\
  \ so it sits flat on the panel plane.\n  3. Calls object_createCollisionData; on null return it frees\
  \ memory and returns.\n  4. Configures the collision box via object_setupCollisionData with width=4,\
  \ height=5, panel-step=3 and sets the hit effect to 1 via object_setCollisionHitEffect.\n  5. object_presentCollisionData\
  \ activates the collision data for this frame.\n  6. Spawns a type-1, id-0x0 EffectObject at (X, Y -\
  \ 0x20<<16) to render the entry/landing visual.\n  7. Plays sound effect index 0x106 (0x07 + 0xFF).\n\
  \  8. Writes CUR_STATE_UPDATE into r5->oBattleObject_CurStateActionPhaseAndPhaseInitialized to advance\
  \ the action-phase state machine.\nPreserves r4/r5/r6/r7/r10; r8 and r10 are passed in by callers as\
  \ context.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
