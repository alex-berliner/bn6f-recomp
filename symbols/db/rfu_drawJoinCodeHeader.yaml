name: rfu_drawJoinCodeHeader
address: '0x0803A214'
kind: function
status: probable
summary: 'Per-frame: draws the RFU wireless join-code header (title glyph string + 4-digit join code)
  onto the OAM sprite layer.'
interface: () -> void
details: Derives a pointer to a NUL-terminated title string from r5+0xF0, calls sprite_drawGlyphString
  at tile x=2, y=0x43 with width 0xa. Then calls sub_803C418 to obtain a value, passed as r3 to sub_803B9C0
  with r0=0x1a, r1=7, r2=4 to queue a 4-glyph numeric/hex field at x=7, y=0x1a — the join code. Both callers
  (battle_stepFrame, rfu_drawConnectedPlayerEntries) invoke it once per tick as the title/header for the
  wireless connect panel.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 'Both callers run this once per frame before per-entry loops: rfu_drawConnectedPlayerEntries
    then iterates 4 connect entries, battle_stepFrame steps entities; sprite_drawGlyphString with x=2,y=0x43,width=0xa
    queues a title string from r5+0xF0; sub_803B9C0 with r0=0x1a,r1=7,r2=4 queues a 4-glyph numeric field
    — the join code digits; sub_803C418 return feeds r3 of that numeric draw, providing the code value;
    rfu_drawConnectedPlayerEntries also calls sub_803B814 with codes 0x27/0x7b and sub_803B9C0 with 0x21
    for entries — same sprite-draw primitives, confirming this is the panel header'
