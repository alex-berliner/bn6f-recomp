name: battle_object_runPhaseHandler_8016396
address: '0x08016396'
kind: function
status: confirmed
summary: Dispatches the battle object in R5 to the handler for its current phase (0, 4 or 8), tail-calling it via
  a jump table.
interface: void battle_object_runPhaseHandler(void) — reads oBattleObject_CurPhase from the object in R5; passes
  the phase byte in R0 and the handler's own Thumb entry address in R1; all other registers and flags pass through
  to the handler and its return value to the caller.
details: 'Trampoline-style dispatcher for the battle object state machine. Reads the object''s CurPhase byte at
  R5+oBattleObject_CurPhase, uses it directly (unscaled) as a byte offset into the jump table at off_80163A8, and
  calls the selected handler with LR set to the return address (mov lr, pc; bx r1). Stored phase values therefore
  step by 4 rather than 1: phase 0 -> sub_80163B4, phase 4 -> sub_801641A, phase 8 -> sub_8016460. Quirk: the handler
  address is loaded into R1 and left there across the call, so every handler is entered with R1 holding its own
  entry address (the table word, e.g. sub_8016460+1); handlers preserve R1, so this must be reproduced. A phase
  value outside the table would branch to garbage, so it can never occur in practice. All other registers (R2-R12)
  and flags pass through untouched; it is effectively a tail call with a restored LR.

  '
