  reproduce: python3 tools/asmcat.py 0x080CF594
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The wrapper hardcodes type 0x56 to object_spawnType3, then on success stores PanelX/PanelY/Element
    from popped regs, DamageAndStamina… from r6, and copies AllianceAndDirectionFlip from [r5]. The save
    {r0-r2,r5} only preserves three data regs (r0-r2) and r5, so r3 must come from the caller''s original
    r3, not the stack. The summary''s ''r3/stack = remaining spawn args'' and ''flags from spawn result''
