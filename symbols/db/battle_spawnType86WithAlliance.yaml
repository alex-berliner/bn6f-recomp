open_questions:
- What game entity object type 0x56 is (the type-3 initializer table entry would identify it)
- Exactly how r5 and r6 are set by the callers (sub_80CF5B2, sub_80E5A22) — whether r5 is a template object
  pointer and r6 a damage argument or a disassembly artifact
- The wrapper hardcodes type 0x56 to object_spawnType3, then on success stores PanelX/PanelY/Element from
  popped regs, DamageAndStamina… from r6, and copies AllianceAndDirectionFlip from [r5]. The save {r0-r2,r5}
  only preserves three data regs (r0-r2) and r5, so r3 must come from the caller's original r3, not the
  stack. The summary's 'r3/stack = remaining spawn args' and 'flags from spawn result' are fine, but 'caller's
  arguments/source data' is vague. Also the name 'battle_spawnType86WithStats' misreads 'Stats'; the copied
  field is AllianceAndDirectionFlip, not stats — 'WithAlliance' would be more accurate.
