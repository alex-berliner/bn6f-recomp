name: battle_spawnType86WithAlliance
address: '0x080CF594'
kind: function
status: probable
summary: Pushes caller regs and r5, spawns a battle object of type 0x56 via object_spawnType3, and on
  success writes PanelX/PanelY/Element from popped regs, DamageAndStaminaDamageCounterDisabler from r6,
  and copies AllianceAndDirectionFlip from the word at [r5].
interface: (r0 = panel X, r1 = panel Y, r2 = element, r3/stack = remaining spawn args; r5 = source for
  alliance, r6 = damage value) -> r0 = spawned object or 0; flags from spawn result (beq skips init)
details: 'This is a thin wrapper around object_spawnType3 with the type constant hardcoded to 0x56 (86).
  It uses the common BN6 argument-spill idiom: push {r0-r2,r5} saves the incoming arguments, r0 is overwritten
  with the type ID before the spawn call, and pop {r1-r3,r5} reloads the saved args shifted into r1-r3
  so the new object can be filled in. On a successful spawn it writes oBattleObject_PanelX, oBattleObject_PanelY,
  oBattleObject_Element, oBattleObject_DamageAndStaminaDamageCounterDisabler (from r6), and copies oBattleObject_AllianceAndDirectionFlip
  from the word at [r5]. If the spawn fails it returns immediately without touching anything. The field
  set (panel position, element, damage, alliance) matches a fully parameterized battle entity spawn, likely
  a custom/extra enemy or effect object defined by the type-3 initializer at index 0x56.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0x56 followed by bl object_spawnType3 shows this spawns type-86 battle objects (asm
    lines 3-4); push {r0-r2,r5} / pop {r1-r3,r5} reloads original args shifted by one, the standard BN6
    spawn-wrapper arg-spill idiom; strb r1/r2/r3 to oBattleObject_PanelX/PanelY/Element fills position
    and element right after the spawn; ldrh/strh of oBattleObject_AllianceAndDirectionFlip via [r5] copies
    alliance data from a caller-provided source; beq locret_80CF5B0 skips all field writes when the spawn
    call reports failure'
  refs:
  - bn6f/asm/asm31.s:51167
  - 0x080CF5B2 sub_80CF5B2
  - 0x080E5A22 sub_80E5A22
