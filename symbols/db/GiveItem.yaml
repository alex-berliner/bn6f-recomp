open_questions:
- Exact semantics/identity of item ranges [0x80..0x85] and >=0x90 (key items vs. PET stats vs. Zenny/sub-chips).
- What the byte at `key_ptr + 0x75` represents (a per-item secondary cap reused across the 0x80..0x85 range).
- What pet_addCurNaviStat0x3ECapped_803CF3C and sub_803CFB0 actually track/notify (likely PET happiness and a "item
  received" script hook).
- Whether r10 is the standard toolkit save-block pointer used everywhere, or a caller-local one.
