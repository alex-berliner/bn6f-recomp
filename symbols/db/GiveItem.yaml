name: GiveItem
address: '0x0803CD98'
kind: function
status: confirmed
summary: Adds a quantity of a key item (or Navi/PET stat) to the toolkit's save buffer, clamping to the per-slot
  maximum, and returns whether the add was normal/already-max/capped.
interface: 'u32 GiveItem(u32 item_id /* r0 */, u32 quantity /* r1 */, void *toolkit /* r10 */); flags: nz,c,v clobbered'
details: "Pushes {r0,r1} and calls encryption_copyByteXor6fToToolkitBuffer_8006e3c as a side-effect decrypt/copy\
  \ of item data into a toolkit working buffer (r0/r1 restored via pop). Loads the key-items pointer from `*(r10\
  \ + oToolkit_KeyItemsPtr)` into r2.\n\nPicks a per-item maximum stack size in r6:\n  * item_id in [0x80..0x85]:\
  \ max = the byte at `key_ptr + 0x75` (i.e. a secondary max table slot).\n  * item_id == 0x71:         max = 2\
  \ (the player's Navi; only two are ever owned).\n  * item_id >= 0x90:         max = 9 (PET-related stat slots,\
  \ perhaps SoulWeapons/bugFrags range).\n  * otherwise:               max = 0xFF (treat as unbounded counter).\n\
  \nReads the current byte `key_ptr[item_id]` into r4, then in r3 sets a return code:\n  * 1 = already at max (no\
  \ write needed),\n  * 0 = current + quantity <= max,\n  * 2 = would overflow, so write is clamped to max.\n\n\
  Stores the (possibly clamped) new count back to `key_ptr[item_id]`. If item_id == 0x71 (the Navi changed), it\
  \ calls reloadCurNaviStatBoosts_813c3ac to refresh derived Navi stats/bonuses. Then unconditionally calls pet_addCurNaviStat0x3ECapped_803CF3C\
  \ (passes through the result code in r0) and the post-item hook sub_803CFB0. Final r0 = result code returned to\
  \ caller.\n\nPreserved across the call: r4/r5/r6/r7 (saved/restored manually on the guest stack around each callee);\
  \ clobbers nzcv, r0-r3, and lr.\n"
