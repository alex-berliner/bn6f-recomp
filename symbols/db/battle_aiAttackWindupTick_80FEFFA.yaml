name: battle_aiAttackWindupTick_80FEFFA
address: '0x080FEFFA'
kind: function
status: confirmed
summary: Runs one tick of an AI enemy's attack wind-up - starts the attack (element, charge animation,
  timer) on the first call, then counts the timer down and flags the strike element when it runs out.
interface: void sub_80FEFFA(r5 battle_object, r7 ai_attack_vars); no return value; clobbers r0 and flags
details: 'Called per battle object each frame (r5 = oBattleObject struct, r7 = its oAIAttackVars block).

  First call (AttackElement == 0): selects attack element 4, switches the object to animation 9

  (the wind-up/charge pose) via oBattleObject_CurAnim, and loads oAIAttackVars_StepTimer with

  0x17 (23) frames. On subsequent calls it decrements StepTimer; when it reaches 0 the branch''s

  BGT is not taken and HitElement is set to 0x18 (24) - presumably the element the incoming hit

  will use (or a "strike now" marker), which later code in the attack state machine reads.

  Note the element fields are byte-sized but HitElement is written with STRH, touching its

  neighbor in the struct as well.

  '
