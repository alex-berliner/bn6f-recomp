name: t4_waitThenFadeScreen
address: '0x08027624'
kind: function
status: probable
summary: 'Step handler: increments a 32-bit frame counter at [r5+0x40]; when it reaches 0x10, resets it,
  fades the screen out (SetScreenFade(0x64,8)), invokes sub_80302B6(1,0x28), plays sound effects 0x93
  then 0xBC, and writes 8 to the u16 state at [r5+0x02].'
interface: (r0 = unused/ignored, r5 = owner object with u16 state at +0x02 and frame counter at +0x40)
  -> r0 = clobbered; no meaningful return
details: On each call it increments the 32-bit counter at [r5,#0x40]; while it is below 0x10 the function
  does nothing else. When the count reaches 0x10 the counter is reset to 0, SetScreenFade(0x64, 8) is
  called (value 0x64 = 100, likely a full fade with speed 8), sub_80302B6(1, 0x28) is invoked for an unknown
  side effect, sound effects 0x93 and 0xBC are played in sequence, and the halfword at [r5,#0x02] is set
  to 8, evidently advancing the owner's state machine. The +0x02 field being a state and +0x40 a frame
  counter suggests r5 is a scripted task/step context rather than a battle object. The two sounds played
  back-to-back (0x93 then 0xBC) hint at a transition jingle or effect pair.
