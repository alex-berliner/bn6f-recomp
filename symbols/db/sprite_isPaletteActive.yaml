name: sprite_isPaletteActive
address: '0x080023B8'
kind: function
status: probable
summary: Returns whether the given palette slot in the ePalette20097a0 array is flagged active.
interface: (r0 = palette index) -> r0 = ActiveFlag byte of that palette entry, Z flag set from it
details: Computes ePalette20097a0 + r0*oPalette20097a0_Size and reads the oPalette20097a0_ActiveFlag byte.
  The value is returned in r0 and tested with tst so the caller gets the result in the Z/condition flags
  without a compare. It only reads state; it does not modify the palette table. Works per-slot, so r0
  is an index into the palette pool rather than a pointer.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mul r1, r0 after mov r1,#oPalette20097a0_Size indexes the array by slot; ldrb r0,[r2,#oPalette20097a0_ActiveFlag]
    reads the per-entry active flag; tst r0,r0 sets flags from the loaded flag before the bare return;
    base pointer is the labeled palette table ePalette20097a0
  refs:
  - bn6f/asm/asm00_0.s:5193
