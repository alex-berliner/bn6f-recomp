name: aiAttack_dispatchByHitElement
address: '0x080ED748'
kind: function
status: probable
summary: 'Dispatches an enemy attack behavior based on the attack''s hit element: normal element runs
  one routine, any elemental hit runs walk-forward-then-attack.'
interface: (r7 = AI attack vars struct) -> r0 = HitElement selects handler via table at off_80ED75C; tail-calls
  handler (lr set to return into pop {pc})
details: 'Loads oAIAttackVars_HitElement from the AI attack vars at r7 and uses it to index a two-entry
  table at off_80ED75C. Entry 0 (no/normal element) goes to sub_80ED764, entry 1 goes to aiAttack_walkForwardThenAttack_80ED7A2.
  The mov lr, pc / bx r1 pattern makes it a thunk: the handler returns straight to sub_80ED748''s pop
  {pc}, i.e. it tail-dispatches to the caller''s continuation. So this is a per-element branch point in
  the beastsp AI attack routine, splitting ''plain hit'' handling from ''elemental hit: step forward then
  attack''.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0] indexes table off_80ED75C by element;
    table has exactly two targets: sub_80ED764+1 and aiAttack_walkForwardThenAttack_80ED7A2+1; mov lr,
    pc / bx r1 makes the callee return into pop {pc}, a dispatch-thunk pattern; recorded execution on
    the beastsp route places it in the AI attack path'
