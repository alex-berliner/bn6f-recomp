name: aiAttack_dispatchByHitElement
address: '0x080ED748'
kind: function
status: confirmed
summary: Reads the AI attack vars' HitElement byte and tail-dispatches to the matching attack handler from a two-entry
  table (default telegraph step vs walk-forward-then-attack).
interface: 'void aiAttack_dispatchByHitElement(void); /* in: r2, r5, r6, r7=AI attack vars block, r10, lr; out:
  r1, r5, r8-r12 produced by the chosen handler; nz c v free to clobber */'
details: Dispatcher only. Loads the raw HitElement byte from the AI attack vars block at [r7 + oAIAttackVars_HitElement],
  indexes the two-entry table at off_80ED75C (entry 0 = ai_attackTelegraphStep, entry 1 = aiAttack_walkForwardThenAttack_80ED7A2),
  and calls the handler with mov lr, pc / bx r1 so the handler returns through the pop {pc} epilogue. All caller
  state (r2, r5, r6, r7, r10) passes through untouched; the handler's own register outputs (r1, r5, r8-r12) flow
  straight through to this function's caller. Because the index is the unmasked HitElement byte, any value >= 2
  would read past the table — in practice the byte is only ever 0 or 1 at this point. The table load leaves the
  handler address in r1 when the handler is entered.
