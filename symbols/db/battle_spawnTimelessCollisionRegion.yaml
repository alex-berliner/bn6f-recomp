  date: '2026-10-19'
  detail: 'loc_80DB8AC branches on oBattleObject_Param1 to pick object_spawnDimmingCollisionRegion vs
    object_spawnCollisionRegion; both paths pass [oBattleObject_Element] as r2 to the region spawn calls;
    both pass r4=0x15050A01 from dword_80DB8C0 and r7=3 from dword_80DB8C4; r6 copies [oBattleObject_DamageAndStaminaDamageCounterDisabler]
    into the region spawn call; callee summaries: both spawn collision-region objects, one marked to update
    during timestop'
