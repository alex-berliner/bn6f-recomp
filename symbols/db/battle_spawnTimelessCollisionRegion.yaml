name: battle_spawnTimelessCollisionRegion
address: '0x080DB890'
kind: function
status: probable
summary: Spawns a collision-region object at this battle object's panel using its element; when Param1
  is set it uses the dimming (timestop-visible) variant, otherwise the normal one.
interface: (r0 = element read from object, r5 = battle object ptr) -> r0 = spawned region object id; no
  flag semantics seen
details: Reads oBattleObject_Param1 from the owning object (r5); if zero it calls object_spawnCollisionRegion,
  otherwise object_spawnDimmingCollisionRegion, which is the variant that keeps updating during timestop.
  Either way it passes the object's PanelX, PanelY and Element as region position/element, r3=0, r4=0x15050A01
  (region config/lifetime word), r6 = the object's DamageAndStaminaDamageCounterDisabler (propagated to
  the region), and r7=3 (flags/count). The element argument indicates the region triggers on entities
  of a matching element, e.g. an elemental ground/trap tile.
