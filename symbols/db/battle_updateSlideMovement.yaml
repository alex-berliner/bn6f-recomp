name: battle_updateSlideMovement
address: '0x080DD1AC'
kind: function
status: probable
summary: Per-frame movement step for a battle object that slides horizontally and steers vertically toward
  a target row, ending the move when a condition clears.
interface: (r5 = battle object) -> void; sets oBattleObject_CurAction/CurPhase/X/YVelocity
details: First calls sub_80DD322; if true it finishes the move by setting CurAction=8, CurPhase=0 and
  clearing YVelocity. Otherwise, if sub_80DD2E0 returns true it sets CurAction=4 and, using ExtraVars
  (r0) as a per-object work area, reads a target offset at +0x24/+0x13 and compares it against PanelY,
  negating YVelocity when the object is past the target row (steering back). Otherwise it advances X by
  XVelocity and refreshes the object's panel position via object_setPanelsFromCoordinates and object_updateCollisionPanels.
  The ExtraVars +0x13 field looks like a destination row the object bounces back from.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sub_80DD322 then CurAction=8/CurPhase=0/YVelocity=0 on success = move-completion branch;
    bl sub_80DD2E0 then CurAction=4 with PanelY vs ExtraVars+0x13 comparison negating YVelocity = vertical
    correction branch; X += XVelocity then object_setPanelsFromCoordinates + object_updateCollisionPanels
    = straight-line slide branch; callee object_updateCollisionPanels 'recomputes facing direction for
