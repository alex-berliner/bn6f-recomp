status: probable
summary: Returns 1 only when the battle is not time-stopped, not over, and the current anim state == 0x4000;
  otherwise 0.
interface: '() -> r0 = 1 if condition met else 0 ; side effects: reads toolkit (r10) state and a word
  from sub_801DFE4; sets nz/c/v flags'
details: "1. Saves lr and calls battle_isTimeStop; if true, returns 0 (time-stop blocks death anim).\n\
  \  2. Calls battle_isBattleOver; if non-zero (battle over), returns 0.\n  3. Calls sub_801DFE4 which\
  \ returns some battle-mode/state value in r0.\n  4. Compares that value against the constant 0x4000\
  \ stored at dword_800A240.\n  5. If it does not match 0x4000, returns 0; otherwise returns 1.\n  6.\
  \ Tail-returns via `pop {pc}` in both branches; only r0/lr are trashed, no other callee-saved regs pushed,\
  \ matching the in/out contract.\n  The 0x4000 sentinel is read from a `.word 0x4000` data pool at the\
  \ function's tail (dword_800A240), giving the concrete comparison value.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battle_isTimeStop` then `bne loc_800A23A` → on time-stop, r0 = 0 is returned (time-stop
    case at 0x800A23A loads r0 with 0). - `bl battle_isBattleOver` then `tst r0, r0` + `bne loc_800A23A`
    → on non-zero r0 (battle over), returns 0. - `bl sub_801DFE4` then `ldr r1, dword_800A240 // =0x4000`
    and `cmp r0, r1` `bne loc_800A23A` → equality with 0x4000 is required. - Success path: `mov r0, #1`
    then `pop {pc}` returns 1; fall-through failure path at loc_800A23A `mov r0, #0` `pop {pc}` returns
    0. - dword_800A240 lives right after the function (`.word 0x4000`), used only by this cmp.'
