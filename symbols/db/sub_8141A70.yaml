name: sub_8141A70
address: '0x08141A70'
kind: function
previous_names: []
status: hypothesis
summary: per-frame Beast Out gauge driver for a battle object's AI state
interface: (r5 = AIDataPtr) -> no return; mutates AIData fields around the Beast Out timer
details: "Acts on the AIData struct pointed to by r5 (the \"in=r5,lr\" contract confirms this).\n  Reads AIData.Unk_0d\
  \ (r5+0xd). If non-zero, returns immediately (beast out already\n  active / flagged, gauge frozen). Otherwise\
  \ clears Unk_13 and Unk_17, sets\n  Unk_0c = 0x1e (a frame-delay/refresh value), and decrements Unk_0b; if it\
  \ stays\n  >0 returns. When it hits zero it consumes Unk_11 (\"BeastOutAPwrAtk\") — only when\n  Unk_11 was non-negative\
  \ (signed blt at 0x8141a8a → b loc_8141A92) — and then\n  bumps Unk_10, capping it at 0x50 (bgt at 0x8141a96).\
  \ When the cap is exceeded,\n  Unk_11 is reset to 0; otherwise Unk_10 is stored and Unk_11 is reset to 2\n  (a\
  \ 2-tick reload). The exit r0=0xff..0xf2/0xfe sequence across the captured\n  frames of one captured call site\
  \ matches Unk_10 counting down from 0x50 toward\n  0, characteristic of the Beast Out gauge filling animation.\n\
  \  Called only from sub_81419A0 (a Beast Out state handler).\ndetails: |\n  Captured-call entry r0=1, r1=0x40,\
  \ r2=0x140, r3=AIData pointer at 0x02001d68\n  across 40 frames; exit r0 decrements 0xfe,0xf5,0xf4,0xf3,0xf2 —\
  \ matching the\n  Unk_10 saturating countdown described.\n"
