name: battle_aiChargeAttackTick_80F8A66
address: '0x080F8A66'
kind: function
status: confirmed
summary: 'Per-tick handler for an AI/NPC enemy''s charge-up attack: starts the charge on the first tick,
  flashes the highlighted front panel while charging, and flags the hit element when the charge timer
  runs out.'
interface: void sub_80F8A66(battle_object *r5, ai_attack_vars *r7); /* r1 pass-through in/out (returned
  unchanged unless sub_80F8EAA runs, then its r1); clobbers r0-r3, lr, NZCV */
details: "State machine step for an enemy attack, working on a battle object (r5) and its\nAI attack vars\
  \ block (r7). Fields touched:\n  - oAIAttackVars_AttackElement (byte): if zero, this is the first tick\
  \ — sets it\n    to 4 (the attack's element), sets oBattleObject_CurAnim to 0xF (charge pose),\n   \
  \ loads oAIAttackVars_StepTimer with 0x18 (24 ticks) and clears\n    oAIAttackVars_ChargeCycles, then\
  \ returns.\n  - oAIAttackVars_ChargeCycles (halfword): incremented each tick while charging.\n    Its\
  \ bit 2 (tested via lsr #3 carry) decides whether battle_highlightFrontPanel\n    is called that tick\
  \ (called when bit 2 is clear, so the front-panel highlight\n    flashes on and off during the charge).\
  \ The call is sub_80F8EAA(r5), whose r1\n    is passed through to this function's caller.\n  - oAIAttackVars_StepTimer\
  \ (halfword): decremented each tick; when it reaches 0,\n    oAIAttackVars_HitElement is set to 0x10,\
  \ presumably telling the following\n    attack step which element the hit should use / that the attack\
  \ should fire.\nQuirks: r1 is only meaningful when the highlight call actually runs; otherwise the\n\
  incoming r1 is returned untouched. The timer countdown and cycle counting both\nhappen even on the same\
  \ tick cycle, and the element 4/anim 0xF/hit element 0x10\nvalues are hardcoded for this attack.\n"
