name: getTable12Record_800D730_800C6D6
address: '0x0800C6D6'
kind: function
status: confirmed
summary: Returns the address of record r0 in a 12-byte-per-entry table at byte_800D730.
interface: 'int getTable12Record_800D730(int index); // r0 in: record index; r0 out: pointer to that 12-byte record;
  flags clobbered, r1 clobbered, lr used as return'
details: 'Trivial table-indexing helper: multiplies r0 by 12 (record size 0xC bytes),

  adds the base address byte_800D730 (loaded via off_800C8D4 literal pool), and

  returns the result in r0. No bounds checking on the index; callers are expected

  to pass a valid record number. The table''s contents and which game system owns

  the 12-byte records at 0x0800D730 are not determined from this function alone;

  cross-references to byte_800D730 and its readers would identify the structure

  (candidate for enemy/attack/NPC-style fixed-size record tables).

  '
