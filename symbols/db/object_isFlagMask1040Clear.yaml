name: object_isFlagMask1040Clear
address: '0x0800E5FC'
kind: function
status: probable
summary: Returns 1 when the current battle object's first object-flag word has none of the bits in mask
  0x1040 set, else 0.
interface: () -> r0 = 1 if (object flag word & 0x1040) == 0, else 0; no flags meaningful
details: A thin predicate over object_getFlag, which reads the first object-flag word of the battle object's
  collision data. It ANDs the result with the constant 0x1040 (bits 4 and 10) loaded from off_800E614;
  if any of those bits is set it returns 0, otherwise it returns 1, so it tests the absence of this flag
  combination. It takes no arguments of its own — the object context comes from whatever object_getFlag
  uses. Its only labeled caller (aiAttackVars_updateIllusionSpawnState) is an AI illusion-spawn step,
  suggesting the mask flags mark objects/states in which the spawn behavior must not proceed. The semantic
  meaning of bits 4 and 10 of the flag word is not shown by this function itself.
