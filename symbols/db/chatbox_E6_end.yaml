open_questions:
- Identity of chatbox_8041090 — what "advance dialog to next message" actually checks.
- Meaning of "FLAGS_3E_UNK_0001" / "FLAGS_3E_UNK_0008" (pending-end markers vs. other state).
- Why the dequeue table lives at offset 0x140 with 4 bytes per slot — likely a cross-struct pointer table or absolute-script-entry
  list, layout unconfirmed.
- Whether the HIDE+bit2 path is reachable in normal play or only via debug/script edge cases.
