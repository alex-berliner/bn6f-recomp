name: chatbox_E6_end
address: '0x08040E98'
kind: function
status: confirmed
summary: Advances or closes the chatbox on script opcode 0xE6, dequeuing the next pending script entry or clearing/hiding
  the chatbox when nothing is queued.
interface: 'void chatbox_advanceOrHide_E6End_8040E98(Chatbox *self) -> u32 r0 (1 if a queued script was dequeued
  into r4, 0 otherwise);

  preserves: r3; clobbers: r0, r1, r2, r4, lr, nzcv

  '
details: "Triggered on chatbox script opcode 0xE6 (\"end\"). Reads the pending-queue counter at self+0x05.\nIf non-zero,\
  \ decrements it, indexes a 4-entry-per-slot table starting at offset 0x140 into the\nchatbox struct to pull the\
  \ next script pointer into r4, stores the decremented count back to\nself+0x05, and returns 1 (caller will then\
  \ jump into the dequeued script in r4).\nIf the counter is zero, sets flag \"FLAGS_3E_UNK_0001\" via chatbox_setflags_3e\
  \ to record that an\nend-of-script was hit. Then masks \"FLAGS_3E_HIDE_CHATBOX\":\n  - If HIDE was already set:\
  \ also masks bit 2. If bit 2 is set, sets \"FLAGS_3E_UNK_0008\"\n    (something is still pending — leave the chatbox\
  \ intact) and returns 0. If bit 2 is clear,\n    fall through to close the chatbox.\n  - If HIDE was not set:\
  \ calls chatbox_8041090 (advance-dialog check). If that returns\n    non-zero (cannot advance), fall through to\
  \ close the chatbox. If it returns 0, the chatbox\n    is already cleared by the callee and we simply return 0.\n\
  Closing path clears eflag 0x80 via chatbox_clear_eFlags2009F38, zeroes self+0x00\n(oChatbox_Visible) and self+0x04\
  \ (oChatbox_TextScriptState), then returns 0.\nQuirk: on the dequeue path the function writes r1/r2/r4 by hand\
  \ (no callee) — this matches\nthe register-form contract (outputs include r1, r2, r4 alongside r0).\n"
