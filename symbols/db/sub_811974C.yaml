name: sub_811974C
address: '0x0811974C'
kind: function
status: hypothesis
summary: Clears bit 1 of a state byte pointed to by r5 and writes 0xC to its offset-9 byte, likely advancing or
  resetting some object/NPC state.
interface: void state_ClearBit1AndSetFieldC(void *state /* r5 */) — trashes r0 (=0xC), r1 (=2), NZ flags; tail-calls
  back via popped lr
details: 'Two-byte-poke routine on a caller-provided struct in r5. It reads the byte at [r5], clears bit 1 (bic
  with r1=2 — probably an "active"/"busy" style flag in that state byte), stores it back, then writes the constant
  0xC to the byte at [r5,#9], which looks like a mode/animation/timer field of the same small state block. It is
  a leaf helper: pushes lr only and returns with pop {pc}. Return values are incidental — r0=0xC, r1=2 and the NZ
  flags from "mov r0,#0xC" are what callers see per the contract, so callers that read r0/r1 would see these constants
  rather than anything meaningful. Without caller context, the meaning of bit 1 and the 0xC value is unknown.'
