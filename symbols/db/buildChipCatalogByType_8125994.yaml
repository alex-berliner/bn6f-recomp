name: buildChipCatalogByType_8125994
address: '0x08125994'
kind: function
status: confirmed
summary: Scans chip IDs 1..0x13F, writes available chips into a per-usage-type slot list at dword_201E420
  with a category byte (0/1/2) derived from three event-flag ranges, compacts the buffer, and returns
  the chip count.
interface: 'void buildChipCatalogByType(void); /* r0 out: number of qualifying chips; r5 also holds count;
  r10 lr in */'
details: "Clears 0x578 (1400) bytes at dword_201E420 via ZeroFillByWord. For each chip id 1..0x13F,\n\
  fetches its ChipData via getChip8021DA8 (offsets into ChipData: 0x07 = kind, 0x09 bits,\n0x15 = usage\
  \ type index, 0x16 = hidden flags). A chip qualifies only when kind == 1,\nbit 0x40 of field 9 is set,\
  \ and bit 0 of field 0x16 is clear. Slot offset = (field_0x15 - 1) * 4.\nThree event-flag ranges then\
  \ gate the chip into one of three categories, written as:\n  halfword id, byte category at slot + 2.\
  \ Ranges (flag base + id):\n    0x1E20+id -> category 0; 0x2220+id -> category 1; 0x2020+id -> category\
  \ 1 or 2\n    (category 2 iff TestEventFlagFromImmediate(0x17, 0x11) is set, i.e. event 0x1711).\nAfter\
  \ the scan, the per-type sub-arrays are compacted by collapsing zero entries forward.\nOutput r0 = r5\
  \ = count of accepted chips. Preserves r4-r7; clobbers r1-r3, lr, nz/c/v.\n"
