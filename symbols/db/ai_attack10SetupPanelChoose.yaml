name: ai_attack10SetupPanelChoose
address: '0x08100570'
kind: function
status: probable
summary: 'AI attack step: points the actor''s panel-choose callback at object+0x60 and starts attack 0x0A.'
interface: (r0 = attack id constant 0x0A passed through, r5 = object ptr, r7 = oAIAttackVars struct ptr)
  -> r0 = result of object_setAttack0
details: Computes r5+0x60, i.e. an address inside the enemy object, and stores it into [r7+oAIAttackVars_PanelChooseCallback],
  registering that object offset as the callback/data used when the AI's panel-choose phase runs. It then
  calls object_setAttack0 with r0=0x0A to set the current attack index to 10, propagating its return value.
  r5 and r7 are callee-saved inputs set up by the caller (sub_8100308 calls it twice), so this reads as
  one entry of a switch/table of AI attack initializers. No flags of its own are meaningful; only the
  propagated result from object_setAttack0 matters.
