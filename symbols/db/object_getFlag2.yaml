summary: Returns the ObjectFlags2 word from a battle object's collision data.
interface: int object_getFlag2(void *obj /* r5 */)
details: Reads the collision data pointer from the battle object at oBattleObject_CollisionDataPtr, then returns
  the word at oCollisionData_ObjectFlags2 in r0. Pure two-load getter with no side effects or flag changes; r1 is
  scratch. "Flags2" appears to be a second bitmask/status word kept alongside the object's primary collision flags.
