name: ai_sweepHighlightTargetPanel
address: '0x0811590A'
kind: function
status: probable
summary: Counts down an AI attack timer and, on every other tick, highlights the stored target panel for
  the enemy's side of the grid
interface: (r0 = unused on entry, r5 = battle object, r7 = oAIAttackVars) -> r0 = new AttackBoost2 count;
  flags from tst
details: Increments oAIAttackVars_AttackBoost2 in the AI attack variable block; when the new count has
  bit 2 clear (i.e. on odd ticks) it loads oAIAttackVars_TargetPanelX/Y and calls highlightPanelIfSomeCondition_8109660
  with sideSign = Alliances XOR DirectionFlip and mode 4, so the marked panel flips to the attacker's
  column side. When the bit is set it skips the highlight and returns. It touches only the AI attack vars
  struct and the battle object's alliance/flip fields; no rendering is done directly, the callee performs
  the grid-clamped panel highlight.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/add/strb on [r7,#oAIAttackVars_AttackBoost2] is a simple tick counter; tst r0,#4 + bne
    skips the body on alternating ticks only; eor r3,r2 builds sideSign from Alliance XOR DirectionFlip,
    matching highlightPanelIfSomeCondition's dx*sideSign semantics; bl highlightPanelIfSomeCondition_8109660
    with r2=4 marks a single target panel; all three callers are nearby sub_81158xx attack-step routines
    on the battlesweep route
