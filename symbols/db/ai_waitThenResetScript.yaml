name: ai_waitThenResetScript
address: '0x0810B3CC'
kind: function
status: probable
summary: 'AI state-script step: idle for 60 frames, then reset the AI state script to script 0'
interface: (r5 = battle object, r6 = AI state struct) -> r0 clobbered; increments object+0x6C frame counter,
  on reaching 60 (0x3C) writes oAIState_ScriptId = 0
details: This looks like a per-frame handler of the battle AI state-script machine. Each call it clears
  the object's word at oBattleObject_ExtraVars+4 and increments the halfword counter at object+0x6C. Once
  the counter reaches 0x3C (60 frames = 1 second) it stores 0 into r6+oAIState_ScriptId, sending the AI
  state back to script 0; until then it returns and keeps counting. The 60-frame wait is probably an idle/pause
  behavior (e.g. enemy hesitating) before resuming the default script.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: counter at [r5,#0x6C] incremented and compared against 0x3C (60 frames) each call; on reaching
    0x3C, strb r0,[r6,#oAIState_ScriptId] resets the AI state script id to 0; clears [r5,#oBattleObject_ExtraVars+4]
    at entry, a per-step scratch/extra var reset; thumb_func_end naming and oAIState_/oBattleObject_ field
    offsets show it is a battle AI object handler
