    selection; bl sprite_noShadow plus orr flag bit 2 into oObjectHeader_Flags: non-interactive visual
    object setup; str CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized: one-shot
    init handing off to update state; callees are all object/sprite setup helpers (object_getFrontDirection,
    sprite_load, sprite_setFlip), consistent with spawn-time init'
