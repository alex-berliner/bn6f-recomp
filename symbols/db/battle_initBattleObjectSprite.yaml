open_questions:
- No caller known, so which attack/element spawns this object and what sprite 0x80 depicts is unidentified
- Exact meaning of sprite_load's r1=0xC/r2=0x67 arguments and of the oObjectHeader_Flags bit 0x2
- The proposal accurately captures the sprite init (0x80, noShadow, flag bit 2, anim 0, palette 0, flip),
  the X/Z 0xC00000 offset via object_getFrontDirection, and the CUR_STATE_UPDATE handoff (lines 19-40).
  The function's only role is one-time spawn setup, not 'spawning' a new object; it mutates r5's position/sprite.
  A cleaner name is battle_initBattleObjectSprite. object_setCoordinatesFromPanels (line 4) means X/Y
  are recomputed from panel coords before the offset is applied, so the description should note that.
