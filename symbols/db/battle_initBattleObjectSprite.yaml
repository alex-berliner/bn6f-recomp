name: battle_initBattleObjectSprite
address: '0x080DCB4C'
kind: function
status: probable
summary: 'One-time spawn setup for a battle object: refreshes X/Y from panel coords, offsets X behind
  its facing direction and sets Z to 0xC00000, loads sprite 0x80 without a shadow, sets the no-shadow/intangible
  flag, resets anims/palette/flip, then hands off to CUR_STATE_UPDATE.'
interface: (r5 = battle object) -> void; r0-r3/r4 clobbered
details: Uses the object-pointer-in-r5 calling convention shared by battle object handlers. It reads the
  object's front direction via object_getFrontDirection, negates it, and multiplies by 0xC00000 to shift
  oBattleObject_X backwards relative to where the object faces, while writing 0xC00000 to oBattleObject_Z.
  It then loads sprite resource 0x80 with arguments (0xC, 0x67) via sprite_load and marks it shadowless
  with sprite_noShadow. Sets bit 0x2 in oObjectHeader_Flags (likely a no-collision/intangible-style flag),
  resets CurAnim and CurAnimCopy to 0, runs sprite_setAnimation(0), sprite_loadAnimationData, sprite_setPalette(0),
  and sprite_setFlip(object_getFlip()). Finally stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object's per-frame update handler takes over. The 0xC00000 X/Z offset and fixed sprite id suggest
  a fixed decorative/effect object placed behind its owner.
