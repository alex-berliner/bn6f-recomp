name: object_lobbedObjectUpdate
address: '0x080DA68C'
kind: function
status: probable
summary: Per-frame update for an airborne battle object that integrates its velocity toward a target panel,
  then lands, reacting to the landing panel's type with an effect and camera shake before destroying itself.
interface: (r5 = battle object) -> void; destroys the object by setting CurState = CUR_STATE_DESTROY on
  landing
details: 'On the first frame (CurPhase 0) it sets CurPhase = 4 and calls sub_80DA736, presumably to compute
  launch velocity toward the target panel stored in Param2/Param3. While oBattleObject_Timer is positive
  it adds XVelocity/YVelocity/ZVelocity into X/Y/Z each frame and refreshes the object''s PanelX/PanelY
  via object_setPanelsFromCoordinates. When the timer expires it teleports the object to the target panel
  (PanelX/PanelY = Param2/Param3, object_setCoordinatesFromPanels) and reads that panel''s status word
  via object_getPanelParameters. It tests the panel flags against a per-alliance mask from byte_80DA708
  (alliance << 2 indexed: 0x15800010 for alliance 0, 0x2A800010 for alliance 1), and only if the panel
  matches — e.g. broken/hole-type panels — it spawns a type-4 effect object at (X, Y+0x40000, Z=4?), calls
  sub_80DA7EC, and triggers a camera shake (magnitude 1, duration 15). Either way it then sets CurState
  to destroy, so this is a one-shot projectile/hazard like a lobbed block or meteor whose landing behavior
  depends on the panel it hits.'
evidence:
