name: battle_spawnAndStoreLinkedObj3_8113626
address: '0x08113626'
kind: function
status: confirmed
summary: Spawns a linked Type-1 Obj3 child and records its pointer and a fixed Z-depth into the calling
  battle object's slot.
interface: "void battle_spawnAndStoreLinkedObj3(\n    u32 r1 /* parent or spawn parameter */,\n    u32\
  \ r2 /* sub-type / position index */,\n    u32 r4 /* additional spawn parameter */,\n    BattleObject\
  \ *r5 /* the battle object that receives the child */\n);\n/* returns r0 = 0; nz, c (cleared), v (from\
  \ callee) written back */\n"
details: "Thumb state-machine \"Next\" routine called from a battle-object update loop.\n1. Sets r3 =\
  \ 0 (unused slot for the callee) and calls\n   battle_spawnLinkedType1Obj3, which allocates / initialises\
  \ a Type-1 Obj3\n   child linked to the parameters in r1, r2, r4 and returns a pointer (or\n   index)\
  \ in r0.\n2. Stores that result into [r5 + oBattleObject_ExtraVars] – the field that\n   the parent\
  \ uses to track its spawned child object.\n3. Writes 0x00080000 (8 << 16) into [r5 + oBattleObject_Z],\
  \ pinning the\n   parent's Z-plane so the child renders at a fixed depth behind sprites.\n4. Clears\
  \ [r5 + oBattleObject_ExtraVars + 8] to 0 (a secondary spawn slot\n   or timer is reset).\n5. Returns\
  \ r0 = 0 (sets Z and N; C is cleared by the preceding LSL #16;\n   V is left as the carry-out from battle_spawnLinkedType1Obj3).\n\
  The function preserves r4-r7 and clobbers r0-r3, matching the \"Next\"\nconvention used throughout the\
  \ battle object state machine.\n"
