name: battle_objectTimedVanishUpdate
address: '0x080C8D8E'
kind: function
status: probable
summary: 'Battle-object phase handler: waits Param2-5 frames with anim 1, then drops the object''s collision
  region and advances to action 8.'
interface: (r5 = battle object) -> void; sets oBattleObject_CurPhase/CurAnim/Timer, later CurAction and
  phase
details: Reads oBattleObject_CurPhase from the object in r5; if 0, it sets phase 4, CurAnim 1, and loads
  oBattleObject_Timer with oBattleObject_Param2 - 5, returning until the delay ends. Each subsequent call
  decrements the timer; when it reaches 0 it calls object_clearCollisionRegion to remove the object from
  collision detection, sets oBattleObject_CurAction to 8, and zeroes CurPhaseAndPhaseInitialized to restart
  the phase machine. Behavior is a timed 'stay on field, then despawn/hand off' step for some battle object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; strb #4 sets phase 4 and CurAnim 1 on first entry; strh
    r0,[r5,#oBattleObject_Timer] with Param2-5 starts the countdown; bl object_clearCollisionRegion on
    timer expiry removes collision presence; mov r0,#8; strb r0,[r5,#oBattleObject_CurAction] transitions
    to action 8 after the delay'
