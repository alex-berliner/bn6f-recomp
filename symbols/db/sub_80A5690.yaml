name: sub_80A5690
address: '0x080A5690'
kind: function
status: confirmed
summary: Tests whether the field camera lies within any rectangular hotspot region defined for the current map group.
interface: "void sub_80A5690(u32 /*r5*/ camera, u32 /*r6*/ param,\n                 u32 /*r10*/ toolkit) -> u32\
  \ r0 /*1=inside,0=outside*/, u32 r2 /*last scaled X threshold*/;\nflags clobbered: nzcv\n"
details: 'Looks up the current map via the global Toolkit (r10 -> oToolkit_GameStatePtr ->

  oGameState_MapGroup byte). If MapGroup == 0x85 it forces region index 2, otherwise

  it reads index from gameState+5. The index selects one of three region tables

  (off_80A5714 -> byte_80A53B0 / byte_80A53DC / byte_80A5408) of 2D box centers

  (s16 x, s16 y) and an entry count from dword_80A5720 (values 1, 2, 3). The entry

  count is also written back to camera+6.


  Each entry is converted to 16.16 fixed point with an -8/+8 baked-in offset and

  compared against the camera position stored at camera+0xC (x) and camera+0x10 (y).

  sub_80A5724 is called with the absolute axis distances pushed on the stack and

  returns a per-axis radius threshold (r0=x, r1=y) also scaled by <<16. The camera

  is "inside" the region if |dx| <= thresholdX && |dy| <= thresholdY. The loop is

  do-while, so the body always runs at least once; the comparison is unsigned

  (bgt), and r2 is left holding the last computed scaled X threshold (visible to

  callers via the contract).


  r5/r6/r7 are preserved (r7 used as loop counter i).

  '
