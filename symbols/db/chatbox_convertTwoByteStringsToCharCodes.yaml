name: chatbox_convertTwoByteStringsToCharCodes
address: '0x08049DC4'
kind: function
status: probable
summary: Converts two 0-terminated byte-index strings into character-code text buffers for chatbox display.
interface: (r0 = src string 1, r1 = dest buffer 1, r2 = src string 2, r3 = dest buffer 2) -> void; clobbers
  r0-r3
details: Saves the incoming r2/r3 pair on the stack, then calls convertByteStringToCharCodes on (r0,r1)
  with max length 8 and buffer size 0x20; it then pops the saved r2/r3 into r0/r1 and calls the same converter
  on the second pair with max length 0xA, again with 0x20 buffer size. Both destinations (unk_201FD60,
  unk_201FD80) are fixed 0x20-byte work buffers, so the function is a convenience wrapper converting two
  number/string fields at once. The caller (sub_812A2EC) feeds it two strings obtained via sub_81468C8/sub_81468E0
  and afterwards queries the second string's struct (length halfword -> word_2023BB0, byte -> byte_2023BC8)
  before running chatbox script 0x2E, i.e. the converted text is shown in a dialog.
