name: navicust_hasBoardJackInKeyItem
address: '0x0813629C'
kind: function
status: probable
summary: Checks whether the Navi board cell has an occupied battle-object slot and whether the player
  owns that slot's key item.
interface: (r0 = board cell ID) -> r0 = 1 if the cell's object slot exists and its key item is held, otherwise
  0; flags are caller-saved
details: Subtracts 0x90 from the cell ID to obtain a battle-object index, then calls battleObject_getByIndex_813B780.
  It treats the object descriptor as 0x10 bytes and reads its key-item ID from offset +3. The key-item
  ID is passed to npc_checkKeyItemTrampoline_803D138, so the function reports both an occupied object
  slot and possession of the corresponding key item.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 'navicust_handleBoardConfirm passes the selected board cell ID in r0 at 0x08136218 before calling
    the function.; The function converts the cell ID with sub r0, #0x90 and passes the resulting index
    to battleObject_getByIndex_813B780.; It loads the key-item byte from the returned object descriptor
    at offset +3 and calls npc_checkKeyItemTrampoline_803D138.; The caller branches on the result: a zero
    result resets the battle-object records and plays SOUND_CANT_JACK_IN, while nonzero enables the cell
    interaction path.'
