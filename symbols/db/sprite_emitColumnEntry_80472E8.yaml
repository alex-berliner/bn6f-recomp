name: sprite_emitColumnEntry_80472E8
address: '0x080472E8'
kind: function
status: confirmed
summary: Feeds one column of a per-column sprite/attr table to the writer at sub_802FE28 and advances an 18-column
  counter that wraps to 0.
interface: void sub_80472E8(u16 upper /*r0*/, u16 lower /*r1*/, u32 column /*r2*/) — returns the column's table
  entry in r1, the next (wrapped) column counter in r2, and 0 in r3; r0 is scratch, r4-r7/lr preserved, flags clobbered.
details: 'Packs (upper<<16)|lower, ORs in the constant 0x40000000 (bit 30 — set inside what looks like a sprite
  attr0/attr1 packed pair, i.e. the attr0 window flag), looks up a halfword from byte_8047318 at offset column*2,
  then tail-calls sub_802FE28(r0=packed, r1=entry, r2=0, r3=0) with that signature''s a2/args-3-4 forced to 0. The
  table has 18 halfword entries in three groups of six: columns 0-5 give 0xE002, columns 6-11 give 0xE006, columns
  12-17 give 0xE00A — values shaped like OAM attr2 (tile indices 2/6/10, palette 14, priority 0), incrementing by
  4 tiles per 6-column group. sub_802FE28 preserves r1, so the table entry is handed back to the caller. The column
  counter is incremented after the call and reset to 0 when it reaches 0x12 (18); the wrap uses a signed blt, so
  a counter that is already negative is never reset and keeps counting up to 18. r4-r7 are pushed only to preserve
  them; the routine holds the original r2 in r7 across the call. Likely drives a column-by-column display strip
  (18 columns = three 6-wide rows, e.g. field/screen tiles) whose per-group entry selects the tile shown.'
