name: reqBBS_81409E4
address: '0x081409E4'
kind: function
status: confirmed
summary: Polls the overworld player's NPC script-array for a coordinate (touch) trigger such as an on-touch BBS.
interface: 'void checkPlayerBBSTrigger_81409E4(void);  // in: r10=Toolkit*, lr=ret; clobbers nz/c/v'
details: 'Resolves GameState->OverworldPlayerObject (a 0x1C offset into the NPC

  struct, conventionally the script-array base) and forwards it to

  checkCoordinateTrigger_8031a7a, which returns its result untouched in

  r0..r3. The "BBS" naming in the symbol is a holdover from the navi-cust

  BBS UI; here it appears to mean "Button/Script" trigger fired when the

  player steps on a marked coordinate. No fields beyond NPC+0x1C are

  touched in this function itself.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
