open_questions:
- The semantic meaning of Unk_5c bit 2 (a frame counter? an "animation slot done" flag?) is not derivable
  from this function alone; a label on battle_getStateUnk5c and review of its other consumers would clarify.
- Why Param3 controls flag clearing, and why the OBJECT_FLAG_STOP_SPRITE_UPDATE is unconditionally cleared
  in that case, is also unclear without seeing the callers and the specific chip/ObjectType this routine
  targets.
