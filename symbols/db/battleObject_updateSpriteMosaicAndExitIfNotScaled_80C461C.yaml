name: battleObject_updateSpriteMosaicAndExitIfNotScaled_80C461C
address: '0x080C461C'
kind: function
status: confirmed
summary: Refreshes a battle object's mosaic-scaled sprite alpha, then if the battle state's mosaic bit is set, ends
  the object's current action (CurAction = 4, phase cleared) and updates its sprite.
interface: u32 battleObject_updateMosaicAlphaAndFinishAction_80C461C(u32 self /* r5 */); r10 = battle state struct
  (passed through untouched); returns the object pointer left in r5 (unchanged on the early-exit path, or battleObject_updateSprite_80C464C's
  r5 otherwise). Clobbers r0-r3, flags, lr; preserves r4, r5, r7.
details: "Called with r5 = battle object, r10 = battle state (r10 is only needed by the callee\nbattle_getStateUnk5c_800139A,\
  \ which reads the state word at +0x5c).\n\n1. Loads oBattleObject_RelatedObject1Ptr (+RelatedObject1Ptr) from\
  \ the object and calls\n   sprite_getMosaicScalingParameters, then passes the results (r0, r2) plus the object\n\
  \   pointer to sprite_setAlpha — i.e. it re-applies the related sprite's current mosaic\n   scaling as an alpha/blending\
  \ setting each frame.\n2. Calls battle_getStateUnk5c_800139A to get the battle state word and tests bit 2\n  \
  \ (lsr #2 into carry): if the bit is CLEAR (bcc), the function returns immediately\n   without touching the object's\
  \ state — the mosaic transition is presumably still\n   running and the object keeps doing what it was doing.\n\
  3. If the bit is SET (mosaic effect finished), it finishes the object's action:\n   - If oBattleObject_Param3\
  \ == 0, clears bit 2 (value 4) of oObjectHeader_Flags\n     (an \"active/has-turn\" style flag).\n   - Sets oBattleObject_CurAction\
  \ = 4 (the \"done acting\" action id) and zeroes\n     oBattleObject_CurPhaseAndPhaseInitialized (halfword: current\
  \ phase + phase-init flag).\n   - Tail-calls battleObject_updateSprite_80C464C with r5 to refresh the object's\n\
  \     sprite for the new state, and propagates its r5 back to the caller.\n\nBit-2 of the state word acting as\
  \ \"mosaic over, wrap up the actor\" is inferred from the\ncode flow, not independently verified; the early-exit\
  \ case leaves the mosaic/alpha update\napplied but the object's action state untouched.\n"
