name: battleObject_updateSpriteMosaicAndExitIfNotScaled_80C461C
address: '0x080C461C'
kind: function
previous_names:
- sub_80C461C
status: probable
summary: Per-frame battle-object sprite hook that forces sprite mosaic/scale handling and exits the object
  on a state flag.
interface: '(r5 = BattleObject) -> r0 = updated sprite state ; side effects: writes CurAction/CurPhaseAndPhaseInitialized,
  clears an ObjectHeader bit, conditionally invokes sub_80C464C'
details: "Pushes only lr (one-shot leaf on r5/r10). Loads the related-object pointer at oBattleObject_RelatedObject1Ptr\
  \ and runs sprite_getMosaicScalingParameters, then sprite_setAlpha (passing r0/r2/r5/r10 from the prior\
  \ call). Calls battle_getStateUnk5c_800139A to fetch a state counter/timer word, shifts it right by\
  \ 2, and uses the carry bit (BCC after LSRS) as a \"not yet\" guard: only when bit 2 of Unk_5c has gone\
  \ low does it fall through to the body. In that body, if the object's Param3 is zero it clears the OBJECT_FLAG_STOP_SPRITE_UPDATE\
  \ (bit 0x04) of the ObjectHeader. Then it forces CurAction = 4, zeros CurPhaseAndPhaseInitialized, and\
  \ tail-calls sub_80C464C (an object sprite-update helper).\n  The early return via \"bcc locret_80C464A\"\
  \ when Unk_5c bit 2 is still set makes this look like a counter-gated routine: the object is only re-initialized\
  \ (and its sprite re-synced) once every few frames, or after a specific animation/state milestone. The\
  \ \"CurAction = 4\" + phase-clear pattern is the standard way Mega Man BCAT objects re-enter their \"\
  update\" phase.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` then `pop {pc}` confirms single-leaf, r5/r10 preserved by caller; matches contract
    `out=[''r4'',''r5'',''r7'',''lr'', ...]`. - `ldr r0, [r5,#oBattleObject_RelatedObject1Ptr]` then `bl
    sprite_getMosaicScalingParameters` shows this targets the related object''s sprite (likely an attachment/beast
    sprite). - `bl sprite_setAlpha` is called immediately after with no extra setup, using r0/r2/r5/r10
    from the previous call. - `bl battle_getStateUnk5c_800139A` + `lsr r0, r0, #2` + `bcc locret_80C464A`
    cleanly gates the body on Unk_5c bit 2 being 0 (carry clear after LSRS); this is a counter gate. -
    `ldrb r0, [r5,#oBattleObject_Param3]`, `cmp r0, #0`, `bne loc_80C463E`: skips the flag clear only
    when Param3 != 0. - `ldrb r0, [r5,#oObjectHeader_Flags]`, `bic r0, r1` with `mov r1, #4`, `strb r0,
    [r5,#oObjectHeader_Flags]`: clears OBJECT_FLAG_STOP_SPRITE_UPDATE (bit 2 of the flag byte, value 0x04)
    when Param3 is 0. - `mov r0, #4`, `strb r0, [r5,#oBattleObject_CurAction]`: forces CurAction = 4 (CUR_STATE_UPDATE
    enum value). - `mov r0, #0`, `strh r0, [r5,#oBattleObject_CurPhaseAndPhaseInitialized]`: resets phase
    + PhaseInitialized. - `bl battleObject_updateSprite_80C464C`: a sibling sprite-update routine that
    runs after re-initialization.'
