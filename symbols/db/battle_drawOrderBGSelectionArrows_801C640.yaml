    ending - Two calls to `call_sub_3005EBA` with `(r0=7,r1=1,r2=3,r3=0x9222)` and `(r0=7,r1=1,r2=3,r3=0x922a)`
    → queue a tile-id stream into BG block 7 at rows 1..3 - `ldrh r6,[r5,#0x20]` / `lsr r4,r6,#0xa` /
    `cmp r4,#0` / `beq loc_801C678` → uses bits 10+ of AIData Timer to gate second transfer - `cmp r0,#0x4000`
    / `beq loc_801C696` / `(timer>>7)&7` to choose tile id, `(timer>>7)>>3` for row → individual BG tile
    writes through `bgmap_WriteTileIdAtBlock_800187C` - `ldrb r3,[r5,#0x18]` / `cmp r3,#0` / `bne loc_801C69E`
    then `sub r3,#2` → index N= (r5[0x18] ?: r5[0x18]-2), used to index `byte_86E1CD8` in 0x20-byte steps
    - `bl QueueEightWordAlignedGFXTransfer` from `byte_86E1CD8 + N*0x20` to `unk_3001A80` → 0x20-byte
    GFX transfer - Embedded tile-id table at `byte_801C6C0` (0x9236..0x923d) confirms the script-strip
    data being placed in BG attribute area near 0x9230 - Stored constants `0x4000`, `0x9222`, `0x922a`,
    `0x9232` are BG tile-id base addresses for the BG-map area this hook targets'
