name: battle_drawOrderBGSelectionArrows_801C640
address: '0x0801C640'
kind: function
previous_names:
- sub_801C640
status: probable
summary: Renders the battle BG tile-id blocks and arrow indicators used by the turn-order selection BG
  overlay
interface: '(r5 = *Toolkit, r10 = ?, lr) -> r0 = ?, nz/c/v ; side effects: queue GFX transfers and write
  BG tile-ids'
details: "Walks an EWRAM pointer (r5) that holds a Toolkit-shaped or AIData-shaped block (fields read\n\
  \  at +0x18, +0x20). Bails out early if `battle_IsBattleEnding_800A97A` returns true. Otherwise:\n \
  \   1. Calls `call_sub_3005EBA` twice (with the second call only when `AIData.Timer(u16 @ +0x20)`\n\
  \       has bits 0x400 or higher): the first writes the tile block header info (tile base 0x9222)\n\
  \       to BG map block 7,1,3 with a 0x10-sized transfer; the second uses base 0x922a and\n       rewrite\
  \ r5=1 (an \"if any timer bit set above 0xa bits\" branch).\n    2. If the low 16 bits of the Timer\
  \ field are != 0x4000, picks a tile-id by `(timer >> 7) % 8`\n       and writes one entry through `bgmap_WriteTileIdAtBlock_800187C`,\
  \ picking the row from\n       `(timer >> 10)`.\n    3. Uses the u8 at `r5+0x18` (clamped `>= 2` first,\
  \ then `--`) to compute an offset into\n       `byte_86E1CD8`, multiplies by 0x20 (32 bytes), then queues\
  \ a 32-byte-aligned GFX copy\n       from that pointer to `unk_3001A80` via `QueueEightWordAlignedGFXTransfer`.\
  \ This is the\n       arrow/spinner strip animation data.\n  Net behaviour: refreshes the tiny arrow\
  \ strip tiles in the BG map based on `r5[+0x18]` index\n  and the current Timer value; typically called\
  \ once per frame from the battle subsystem.\n"
