open_questions:
- The exact meaning of `r5` (looks like a battle-context block that overlays onto the Toolkit
- battle_actors/turn-order table; one field is `Timer` at +0x20 — likely AIData-style) is not
- certain without a caller.
- Whether `r5[+0x18]` is "turn order cursor" vs "act-now actor index" vs a panel-data index —
- the code clamps to >=2 only when it's zero, suggesting row=0 is special-cased.
- Callers list is empty in the dump, so this needs to be matched against the battle-frame
- jumptable to confirm role.
