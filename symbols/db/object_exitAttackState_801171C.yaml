open_questions:
- Exact meaning of AIAttackVars.Unk_1c values 2 / 3 / 4 (chip / dark-chip / other) is not fully pinned;
  the values 0x1B/0x19/0x15 storage pattern strongly suggests a small state machine, but the precise mode
  semantics would need cross-referencing AIAttackVars callers (e.g. sub_8109820) to confirm.
- The 0x1000003F mask for Unk_44 is large; whether all those bits are the "attack active" bits or also
  include other state is not verifiable from this function alone.
