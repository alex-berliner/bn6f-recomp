name: oBattleState_PlayerSide
address: '0xd'
kind: struct-field
status: probable
summary: Boolean (0/1) flag indicating which side of the battle is currently active — 0 for player, 1
  for opponent (or vice versa); used to select per-side tables, branches, and actor-side tests.
details: 'The field is used in ~15+ sites as a "side" identifier: repeatedly XOR''d against oBattleObject_Alliance
  to test "is this actor on the current side?" (e.g. battleObject_joinAlly_80163B4, the visibility/emotion
  handlers at 8016964/80169CE/8018206, battleObject_applyEmotionShaderIfCounterReady_8016CA4), multiplied
  by 8/0x10/0xC to index per-side tables (battle_getStateTableEntryPtr_802C8EA, setupNaviDisplay_802C34E,
  drawPanelOverlay_800C0BA), XOR''d with inputs to swap between player/enemy data (battle_networkInvert,
  battle_getStoryFlagFromBattleState_802CE60, LoadVirusNameIDsForUpToFourSlots_800A998), and passed as
  the ''alliance'' parameter to callPossiblyGetBattleEmotion_8015B54. It is also propagated into oBattleState_Unk_10
  (sometimes XOR''d with 1) at turn boundaries (asm00_1.s:11174/11267/11845/11965/12408/12528/12952/13072),
  strongly suggesting Unk_10 is the next-side-to-act. All observed values are 0 or 1.'
