details: A 50-byte EWRAM block at 0x02010294 interpreted as an array of five 10-byte text-state records.
  The sole reference site, chatbox_getTextStateEntryPtr, takes a slot index in r0, multiplies by 10 (r0*4
  + r0, then <<1), and adds the base address to return a pointer to the matching record. No writes to
  the buffer are seen from the listed sites, so the field layout of the 10-byte struct is not yet determined
  from this code alone.
