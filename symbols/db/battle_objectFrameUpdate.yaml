  - 0x080CD50C sub_80CD50C
  - 0x0800F672 battle_objectTimerCountdown
  - 0x0801AD12 object_finishCollisionHitReaction_801AD12
  - 0x0801A018 object_presentCollisionData
  reproduce: python3 tools/asmcat.py 0x080CD5F8
