name: battle_objectFrameUpdate
address: '0x080CD5F8'
kind: function
status: probable
summary: 'Per-frame update for a battle object: marks a flag, resolves pending hit reactions/effects,
  ticks its lifetime timer, dispatches its state handler from a jump table, then updates sprite and collision
  presentation.'
interface: (r5 = battle object header pointer; r0/r1 scratch) -> r0 = result of object_presentCollisionData;
  flags clobbered by calls
details: Takes r5 as the object header (no other args are set up). First it ORs bit 0x02 into the object's
  Flags byte at offset oObjectHeader_Flags, then calls the hit-reaction teardown, effect spawner, and
  sub_80CD7A0 helpers. If oBattleObject_Param1 is zero it runs battle_objectTimerCountdown so the object's
  lifetime tick can destroy it. It then loads off_80CD628 into r0 and calls sub_801B750, which dispatches
  via the 10-entry table off_80CD62C (containing battle_ResetObjectActionState_80165B8, battleObject_initAndRunAI_8016B02,
  etc.), i.e. a per-state handler for this object's current action state. Finally it advances the sprite
  animation and refreshes collision presentation. The unconditional set of flag bit 0x02 every frame is
  likely a 'currently active/being processed' marker consumed by the collision helpers.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/orr/strb on [r5,#oObjectHeader_Flags] sets bit 0x02 before the collision helpers run; calls
    object_finishCollisionHitReaction_801AD12 and object_spawnCollisionEffect, which operate on r5's last
    collision; ldrb [r5,#oBattleObject_Param1]; beq battle_objectTimerCountdown — timer only ticks when
    Param1 is 0; ldr r0,=off_80CD628; bl sub_801B750 with table containing battle_ResetObjectActionState_80165B8
    and battleObject_initAndRunAI_8016B02 — state dispatch; ends with object_updateSprite and object_presentCollisionData,
    the standard per-frame object render/collision tail
  refs:
