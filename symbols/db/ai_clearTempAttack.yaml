name: ai_clearTempAttack
address: '0x080EC792'
kind: function
status: probable
summary: Clears the battle object's RelatedObject1Ptr, frees its AIData TempAttackObjectPtr via sub_80B8E58, then
  calls object_exitAttackState.
interface: (r5 = battle object) -> r0 = sub_80B8E58 result; clears oBattleObject_RelatedObject1Ptr
details: Zeroes the battle object's RelatedObject1Ptr, then fetches the AIData's TempAttackObjectPtr and passes
  it to sub_80B8E58 (likely despawn/free of the spawned attack object), then calls object_exitAttackState to return
  the object from its attacking state. Runs during beastsp routes, consistent with a boss/AI custom attack teardown.
  sub_80B8E58's exact behavior is unverified.
