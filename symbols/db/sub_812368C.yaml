name: sub_812368C
address: '0x0812368C'
kind: function
status: confirmed
summary: 'Per-frame handler for the PET navi sub-menu: routes B (back), A (confirm/send-to-PET), and cursor-movement
  input, writing the resulting menu state.'
interface: 'void NextSubMenu(void); /* in: r2 r3 r4 r5 r6 r7 r10 lr; out: r5 r10; clobbers nz c v r0 r1 r2 r3 lr
  r0 r1 r2 r3; preserved: r4 r5 r6 r7 r10 */'
details: "Drives one frame of the navi-selection sub-menu pointed to by r5 (sub-menu struct with\noMenu_State at\
  \ +2, oMenu_NaviIndex at +0xC, oMenu_PetSlot at +0x14, oMenu_Cursor at +0x20)\nusing the toolkit/global context\
  \ in r10.\n\n- B (IsButtonPressed(JOYPAD_B)): sets state to 4 (MSTATE_BACK), calls sub_811B314(1,0),\n  plays\
  \ SOUND_EXIT_SUBMENU, calls sub_8119118(0).\n- A (IsButtonPressed(JOYPAD_A)): plays SOUND_MENU_SELECT, then queries\
  \ mode via\n  sub_8123E08 and indexes the dword table at 0x8123768 to fetch a per-cursor byte that\n  becomes\
  \ the new oMenu_State. If the result equals 0xC (MSTATE_TRANSITION) the routine\n  attempts to send the highlighted\
  \ navi to the PET:\n    * saves PET stat byte index 0x2D via GetCurPETNaviStatsByte(oMenu_PetSlot, 0x2D),\n  \
  \  * writes oMenu_NaviIndex to that stat via SetCurPETNaviStatsByte,\n    * calls sub_8120D10(1); if it returns\
  \ zero the send is rejected (state 4, sub_811B314,\n      sound 0x182, sub_8119118), otherwise the saved byte\
  \ is restored and a status dialog\n      is chosen by upper nibble of sub_8137884(oMenu_NaviIndex) >> 4 (>=2 ->\
  \ dialog 9,\n      else dialog 8) via sub_8123A40, state is written to 0x10 (MSTATE_CONFIRMED), and\n      sub_8119118(0)\
  \ runs.\n  For any other non-transition state the routine triggers SetScreenFade(0xC, 0x10) and\n  calls sub_8123D70\
  \ before returning.\n- Default path: queries sub_8123E08 again to decide cursor step (1 vs 3), reads the\n  low-sensitivity\
  \ held bits through r10->oToolkit_JoypadPtr->oJoypad_LowSensitivityHeld,\n  and calls menu_moveCursorUpDown_811FA22(held,\
  \ step, 1, cursor) to update oMenu_Cursor,\n  finally invoking sub_8123D70.\n\nPreserves r4/r5/r6/r7/r10 across\
  \ the call. Sound constants observed: SOUND_EXIT_SUBMENU,\nSOUND_MENU_SELECT, and 0x182 (rejection). Fade constants:\
  \ 0xC/0x10. The two table entries\nat dword_8123774 (=0x140C08) and dword_8123778 (=0xC) hold mode-specific cursor->state\n\
  byte tables.\n"
