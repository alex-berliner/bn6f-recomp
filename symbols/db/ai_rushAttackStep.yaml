name: ai_rushAttackStep
address: '0x0810F6C4'
kind: function
status: probable
summary: 'Per-frame step of a telegraphed enemy rush/charge attack: pause, slide onto the target panel,
  then enable the hitbox and flag a hit or miss.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets oAIAttackVars_HitElement (8 = hit, 0x14
  = miss) and restarts the step when done
details: 'On first entry (AttackElement==0) it resets the target panel to (0,0), recomputes pixel coordinates,
  and latches AttackElement=1. It then clears the object''s collision region and clears flag bit 1 in
  oObjectHeader_Flags (making it intangible/invulnerable while charging), decrementing oAIAttackVars_StepTimer
  each frame. When the timer expires, it asks sub_810F9F6 for a target panel: on success it warps the
  object there, drops Z by 0x24, records the panel into bytes 0x6c/0x6d, sets the counter time to 0x10
  (skipped in battle mode 6), plays sound 0xF7, sets collision region 1, restores flag bit 1, and sets
  CurAnim=2 with HitElement=8 (hit landed). If the target lookup fails, it instead records HitElement=0x14
  (whiffed) and resets AttackElement so the sequence can restart.'
