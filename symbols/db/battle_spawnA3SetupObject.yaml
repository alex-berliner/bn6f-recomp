name: battle_spawnA3SetupObject
address: '0x080D99EC'
kind: function
status: probable
summary: 'Spawns a type-0xA3 battle object and, if the spawn succeeded, reconfigures the caller''s battle
  object (r5): panel position, element 2, damage word, alliance, and header flag 0x10.'
interface: (r0 = value stored to oBattleObject_PanelX (also pushed as a stack arg to the spawn), r1 =
  PanelY, r2 = Alliance, r3 = extra spawn arg, r5 = battle object to configure, r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler
  value) -> r0 = r5 (unchanged input); flags reflect object_spawnType3's success (beq skips setup)
details: The routine saves the caller's r0-r2/r5 with push {r0-r2,r5} — this also leaves the original
  r0 on the stack as an extra argument slot for object_spawnType3, which is called with r0 = 0xA3 (object
  type 163). The pop {r1-r3,r5} shifts the saved arguments down one (r1 = old r0, r2 = old r1, r3 = old
  r2), so after the beq on the spawn's success flag the code writes old-r0/r1 to oBattleObject_PanelX/PanelY
  of the object in r0 = caller's r5, hard-codes oBattleObject_Element = 2, stores caller's r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler,
  copies old r2 into oBattleObject_Alliance, and ORs 0x10 into oObjectHeader_Flags. If the spawn fails,
  nothing is written and r0 still equals the caller's r5. Note the literal listing does 'mov r0, r5' before
  the pop, so all field writes target the caller's r5 object, not the newly spawned one; the spawned object's
  pointer is never kept. Two data blobs follow the function (byte_80D9A14 starting with bytes 00 00 80
  0C, and byte_80D9A20, a table of small byte pairs/triples) whose role is unclear from this site alone.
