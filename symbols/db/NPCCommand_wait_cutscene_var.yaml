name: NPCCommand_wait_cutscene_var
address: '0x0809F2DE'
kind: function
status: confirmed
summary: NPC script command handler that pauses the NPC's script until a watched cutscene variable reaches a given
  value.
interface: void npc_cmdWaitForCutsceneVar(OverworldNPCObject* r5 npc, u8* r6 scriptCursor /* operands at +1/+2 */);
  returns updated cursor in r6 with nzcv flags from adds r6,#3, r0 from callee, lr preserved
details: 'One of the overworld NPC script (npcscript) command handlers. Writes MOVEMENT_FLAG_WAIT_CUTSCENE_VAR into
  the NPC object''s current-action byte (oOverworldNPCObject_CurAction, offset 9) so the per-frame NPC update suspends
  the script until the variable watch completes; also clears the halfword at oOverworldNPCObject_MovementFlag_0a_Unk_0b
  (offsets 0x0a/0x0b). The command''s two operand bytes are read from the script cursor: byte +1 is the cutscene
  variable index, stored to oOverworldNPCObject_CutsceneVarIndexToWaitFor, and byte +2 is the value the variable
  must reach, stored to oOverworldNPCObject_CutsceneVarValueToWaitFor (both as 32-bit fields). Calls npc_disableScript0x19_809f51e
  to mark the NPC''s script slot as suspended, then advances the cursor past the 3-byte command (opcode + 2 operands).
  r7 is used as scratch for the field offsets and is preserved; it is also pushed/popped around the helper call.

  '
