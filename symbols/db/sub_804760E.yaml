summary: 'draws a plain chip row: 8 name tiles plus one blank tile in the code column'
interface: 'static void draw_plain_chip_row(u32 slot, u32 chip, u32 menu); adapter: in r0 = screen row slot, r1
  = char index into the fixed script, r5 = screen state, r7 kept; out r0/r5/r7 restored, r6 keeps the last render''s
  leftover'
details: 'Eight tiles of char r1 of the fixed script text_873D9FC, decompressed through the row''s 0x400-byte slice
  of eDecompBuffer2013A00 into the BG map at 0x6008400, then one tile of char 0x10 (the blank) of the screen''s
  symbol script at menu+0x24 through the 0x2013C00 buffer into 0x6008600. Both renders go through renderTextGfx_8045F8C
  with mode 1, no flip and the fixed colour table dword_86A5D60. Plain rows show no code letter at all.

  '
