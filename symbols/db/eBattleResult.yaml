name: eBattleResult
address: '0x0200F3B0'
kind: data
status: probable
summary: 'Proposed name: eBattleResult. Byte written when a battle finishes; -1 (0xFF) on a comm-failure
  loss path and 0xEE after the LowHP-alert timer expires, consumed by the next-state dispatcher. (u8)'
details: It lives in EWRAM at 0x0200F3B0 and is only written by battle_finishBattle_8007850 — a known
  battle-state transition routine. The function writes 0xFF on the comm-failure path (return code 4 from
  eStruct203F7D8_getUnk01) and 0xEE after the LowHP-alert timer at oBattleState_LowHPAlertTimers crosses
  0xB4, then continues into the shared post-battle dispatcher at loc_8007862. It is referenced via off_800793C
  in the table that the dispatcher jumps through, so it acts as a stamped battle-result code for the following
  state.
