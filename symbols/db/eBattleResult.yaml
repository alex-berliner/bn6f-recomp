- method: caller-analysis
  date: '2026-10-20'
  detail: asm00_1.s:10031 writes 0xFF to dword_200F3B0 after eStruct203F7D8_getUnk01 returns 4 (the comm-failure
    branch) before falling into the common tail; asm00_1.s:10157 writes 0xEE to dword_200F3B0 once the
    LowHP-alert timer field exceeds 0xB4, again before the common tail; asm00_1.s:10168 dword_200F3B0
    is the target of off_800793C, a .word entry in the post-battle jump table that also contains battle_initForMatchStart
