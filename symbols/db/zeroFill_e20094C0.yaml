name: zeroFill_e20094C0
address: '0x08001AFC'
kind: function
status: confirmed
summary: Clears the entire eGFXAnimStates block (0x1B0 bytes) to zero, e.g. when (re)initializing the GFX animation-state
  pool.
interface: void gfx_zeroFillAnimStates(void) — takes no meaningful inputs (r2/r3 pass through untouched), returns
  via pop {pc}; no flags meaningful (NZCV clobbered by the fill call)
details: Loads the base pointer of the eGFXAnimStates array from off_8001C40 and a fixed size 0x1B0 from off_8001B08,
  then tail-calls ZeroFillByWord to word-fill that range with zero. The r2/r3 register contract is pure pass-through
  — callers rely on r2 and r3 surviving the call, so this behaves like a leaf wrapper around the fill routine. 0x1B0
  bytes suggests a fixed pool of animation state entries (e.g. several entries of 0x30 or similar stride); no other
  fields or structures are touched.
