name: battle_getTimerEnableFlag
address: '0x08144D04'
kind: function
status: probable
summary: Returns the byte at offset 0x2A + index within the engine timer-enable struct eTimerEnable200F460,
  used by link-battle state code to gate timer behavior.
interface: (r0 = index (byte)) -> r0 = byte at eTimerEnable200F460 + 0x2A + index; flags set by final
  LDRB
details: The routine zero-extends r0 to a byte, then loads eTimerEnable200F460, adds the fixed offset
  0x2A and the caller's index, and returns the single byte at that address. It is a pure indexed getter
  with no side effects; the LDRB sets condition flags which are irrelevant since it returns immediately
  via BX LR. The base symbol is the engine timer-enable/status block, so offset 0x2A is a sub-array of
  per-entity or per-mode flags/counters. All known callers are battle/link-battle state routines, suggesting
  the queried entries gate timer behavior in link battles.
