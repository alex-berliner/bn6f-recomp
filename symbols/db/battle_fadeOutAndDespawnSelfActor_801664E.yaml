open_questions:
- 'What type-0x11 child object spawns here: `battle_spawnLinkedObject_80E1A6A` is a type-0x11 link helper,
  but the role (e.g. deletion VFX, stat tweak) is not pinned down.'
- The exact semantic of `AIData+0x74` is unnamed in `AIData.inc` (just `u32 Unk_74`); we know it's a cross-link
  pointer from the code, not what it logically represents.
- Whether the captured-call exit `r0=0xf8` vs `r0=0x06` is caller-driven selection of a return code or
  this routine is itself returning multiple values via dispatcher outputs — no caller side seen.
