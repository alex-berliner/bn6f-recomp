summary: Initializes a battle object's wobble state from its saved coordinates and prevents animation.
interface: (r0 = battleObject pointer, implicitly r5) -> r0 = 0xC; flags unchanged
details: Copies the battle object's 16-bit field at offset 0x1E into its 8-bit wobble/effect timer. Copies
  X16 into ChipID and Z16 into Z16Save. Sets PreventAnim to 0x0C, giving this object a fixed 12-frame
  animation pause.
