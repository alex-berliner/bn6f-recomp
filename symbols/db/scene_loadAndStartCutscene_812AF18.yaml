name: scene_loadAndStartCutscene_812AF18
address: '0x0812AF18'
kind: function
status: confirmed
summary: Sets up a scripted scene/cutscene — runs its init routine, decompresses its asset reference table, loads
  its graphics, text script and sprites, then starts the chatbox dialogue.
interface: 'void scene_loadAndStartCutscene_812AF18(void) /* in: r4,r5,r6,r7,r10,lr; out: r4,r5,r6,r7 preserved;
  returns to caller */'
details: A scene bootstrap sequence that calls, in order — sub_812AF3C (scene-specific init), decompAndCopyData
  with the fixed reference table at off_812B08C (decompresses and copies the scene's asset reference data), loadDecompressedAsset_812AF78
  (tile/palette graphics), textScript_loadAndRunEmbeddedArchive_812AF84 (embedded text script archive), sprite_decompInitRefs_812AF98
  (sprite decomp tables), sub_812AFA4 (extra scene-specific setup), and chatbox_8040818 (opens the chatbox overlay
  to start the dialogue). All arguments are hardcoded for this one scene — every helper is a fixed sibling routine
  and the asset-ref pointer is a literal from the pool — so this function belongs to exactly one scene. r4-r7 are
  pushed/popped purely to preserve them for callers; r10 is listed in the contract but not explicitly saved, implying
  callers hold some state there that the callees preserve.
