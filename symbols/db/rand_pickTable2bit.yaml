name: rand_pickTable2bit
address: '0x080AAB68'
kind: function
status: probable
summary: Picks a random 2-bit result (0-3) for a given id from a 16x16 lookup table, using the global
  RNG.
interface: (r0 = table group id (0-15)) -> r0 = random 2-bit value (0-3); flags destroyed
details: Calls GetRNG, masks the result to 4 bits, and indexes byte_8020B9C at (id * 16) + (rand & 0xF),
  i.e. a 256-byte table of 16 groups of 16 random-outcome entries. It loads the selected byte, shifts
  it right by 2, and returns it, so the value used is bits 2-3 of the entry (0-3); the remaining 6 bits
  of each byte are ignored by this function. This looks like a weighted/encoded random outcome roll per
  id, but the game meaning of the ids and results is not shown here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl GetRNG followed by 'mov r1,#0xf; and r1,r0' shows a fresh RNG roll masked to 4 bits; ldr
    r2,off_80AAB84 with 'lsl r0,r0,#4; add r2,r2,r0; ldrb r1,[r2,r1]' indexes byte_8020B9C[id*16 + rand&0xF];
    lsr r0,r1,#2 before returning shows only bits 2-3 (value 0-3) of the table byte are used; both callers
    sub_80AABA4 and sub_80AAC8C are themselves unnamed, so no higher-level context confirms the purpose
  refs:
  - bn6f/asm/asm29.s:11948
  - 0x080AABA4 sub_80AABA4
  - 0x080AAC8C sub_80AAC8C
  - 0x0800151C GetRNG
