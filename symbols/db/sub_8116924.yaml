name: sub_8116924
address: '0x08116924'
kind: function
status: confirmed
summary: Per-frame dispatcher for a pet-menu object, calling one of three state handlers (init/update/other) based
  on the state byte at object+8.
interface: 'void sub_8116924(u32 /* r5 */ petMenu_object); // out: r2,r3,r5,r10,r11 from handler; flags from handler'
details: "Trampoline: pushes only lr, reads the state byte from [r5+8] (the\npet-menu object's state field), uses\
  \ it as an index into a 3-entry\nhandler table at off_8116938, loads the handler address, sets lr=pc\nand `bx\
  \ r0` into it. The handler therefore returns directly to\nsub_8116924's caller. Table entries (with Thumb bit\
  \ set, +1):\n  - 0: petMenu_initSprite_8116944\n  - 1: petMenu_updateObject_81169B0\n  - 2: sub_8116A3C\nThe handler\
  \ is entered with r0 = its own address (r0 still holds the\ntable entry at the time of `bx r0`) and r1 = the state\
  \ byte. Its\noutputs r2/r3/r5/r10/r11 and the condition codes are passed\nunfiltered to the caller — there is\
  \ no typed wrapper, so this is a\nraw jump-table dispatch through a code address. clobbers\nr0/r1/r4/r6/r7/r8/r9/r12\
  \ are entirely the handler's responsibility.\n"
