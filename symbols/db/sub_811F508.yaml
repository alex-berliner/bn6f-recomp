name: sub_811F508
address: '0x0811F508'
kind: function
status: confirmed
summary: 'Per-frame tick for a chip-use/custom-data controller: on flag, dispatches to sub_811FAF4 then reloads
  a per-instance timer via sub_8120CC8 when it expires.'
interface: 'void sub_811F508(void); /* inputs: r5,r10,lr; outputs: r7; clobbers nzcv,r0-r3,lr; preserves r4-r7 */'
details: "Reads a halfword flag at r5+0x10; if non-zero, returns immediately.\nBuilds r0 = 0x00100000 | (u16)r5+0x10\
  \ and calls sub_811FAF4 with:\n  R0 = 0x00100000 | r5->halfword_10,\n  R1 = 0 (dword_811F53C),\n  R2 = r5->byte_0A,\n\
  \  R3 = byte_811EBD0,\n  R4 = 0x40000000 (dword_811F544) -- caller-preserved scratch slot for the callee.\nDecrements\
  \ the u8 timer at r5+0xB; when it underflows to zero, stores sub_811FAF4's\nR0 result into r5->byte_0A, then calls\
  \ sub_8120CC8(r5, A_byte_811EBDA) and stores\nits R1 result back into r5->byte_0B (reloading the timer). r10 is\
  \ read but not used\nin this routine -- it is callee-saved context for the surrounding state machine.\nThe 0x00100000\
  \ prefix in arg0 plus the table pointers (byte_811EBD0, byte_811EBDA)\nand the 0x40000000 sentinel strongly suggest\
  \ an effect/animation state whose frame\nis advanced by sub_811FAF4 and whose period is a separate per-instance\
  \ table entry.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
