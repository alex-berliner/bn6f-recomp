interface: void noop_8033B08(void)
details: 'Pushes lr and pops it back into pc, i.e. a plain return with no effect on registers or flags. It is a
  placeholder/patch-point used where the game needs a callable address that performs no action (a common pattern
  for disabled hooks, padding callbacks, or region-specific stubs). No memory is read or written, so its register
  contract has no inputs beyond lr and no outputs or clobbers. Note: one caller is recorded as treating $r5 as a
  self/context pointer (type S2011E30) at the call site, but the function itself never touches it.

  '
