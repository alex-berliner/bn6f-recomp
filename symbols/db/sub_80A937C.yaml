summary: 'Mr. Weather comp map object (type 0x1B) fade-table stepper: [r5+0x24] >> 1 indexes byte_80A93C0 = { 4,
  6, 8, ..., 0x1E, 0x1F, 0xFF }; each entry is applied as a sprite color shader, 0xFF ends the fade (state 0xC,
  flag 0xBE7) and the counter increments each frame.'
details: 'Body (asm29.s:8182-8218): reads the counter at [r5+0x24], halves it for the table index; a 0xFF entry
  sets [r5+8] = 0xC, calls sub_80A93D0 and sets EVENT_BE7; otherwise sprite_setColorShader gets entry | entry <<
  5 | entry << 10 (the same 5-bit value in all three color channels). The table byte_80A93C0 runs 0x04,0x06,0x08,0x0A,0x0C,0x0E,0x10,0x12,0x14,0x16,0x18,0x1A,0x1C,0x1E,0x1F,0xFF.'
