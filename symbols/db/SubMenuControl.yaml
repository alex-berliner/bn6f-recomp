name: SubMenuControl
address: '0x0811F774'
kind: function
status: confirmed
summary: 'Per-frame dispatcher for the pause ("sub") menu: runs the active screen handler then steps the RNG, skipping
  the RNG tick on comm/save sub-screens.'
interface: "void submenuTick_811F774(void)\n  // r10 = toolkit pointer; r2/r3 forwarded to screen handler\n  //\
  \ uses r4-r9, r11, r12, lr as scratch; r4-r7 also clobbered by callee\n  // flags: clobbers N Z C V\n"
details: 'Reads oToolkit_SubmenuPtr via r10 (the toolkit pointer held in r10 by the caller).

  Uses the first byte of the submenu state (offset 0) as an index into JumpTable811F7A0,

  stepping by 4 (0x00 chip folder, 0x04 sub-chip, 0x08 library, 0x0C MegaMan,

  0x10 e-mail, 0x14 key items, 0x18 comm, 0x1C save, plus five more unidentified

  screens at 0x20/0x24/0x28/0x2C/0x30 and six unused NULL slots through 0x48).

  Dispatches to the selected handler with the submenu pointer in r5 and the caller''s

  r2/r3 forwarded untouched. After returning, if the (possibly-updated) screen is 0x18

  (comm) and the second byte is either 0x18 or 0x1C (comm or save), returns without

  calling GetRNG; otherwise calls GetRNG to advance the RNG stream. r4-r7 are

  preserved across the dispatch via push/pop.

  '
