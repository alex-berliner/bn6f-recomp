name: eStruct200A008_getUnk04
address: '0x0800B6D4'
kind: function
status: confirmed
summary: Returns the u16 "Unk04" field of the overworld player object struct at 0x200A008 (value at 0x200A00C).
interface: u32 eOWPlayerObject_getUnk04(void)
details: 'Trivial thumb getter: it loads the absolute address of the end of the eOWPlayerObject

  region (off_800B84C points at eOWPlayerObjectObjectEnd, i.e. 0x200A008), then reads

  the halfword at that address + 4 (0x200A00C) and returns it in r0. The readable C

  types the result as Next, so this field most likely holds a Next-style value/state

  id belonging to the player''s overworld object. Only r1 is used as scratch to hold

  the struct base; no flags are meaningful on return. The struct at 0x200A008 sits

  right before word_200A00C, and its "end" label is used simply as a convenient

  absolute pointer to the struct base.

  '
