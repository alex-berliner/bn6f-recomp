name: battle_customScreenChipUseAnimStep
address: '0x0802790C'
kind: function
status: probable
summary: 'Per-frame step for the custom screen ''chip selected'' animation: plays the select sound, waits
  5 frames while pulsing the slot, then clears selection and runs the chosen chip''s effect.'
interface: (r0 = self pointer to custom-screen state struct, also in r5) -> r0 = clobbered; updates state
  byte [+1]=4, phase byte [+2], counter [+0x40]
details: Self is the custom-screen state struct (comment S20364C0). If the phase byte at +2 is 0, it stores
  0 into the word counters at +0x40 and +0x44, sets phase=1, and plays sound 0x7D. Each call increments
  the +0x40 counter; once it exceeds 5 it calls sub_80279FC, battle_customScreen_clearSelection_80279C8
  and battleObject_runCustomScreenChipPickerEffect_8028476 (which reads the selected chip's kind and dispatches
  its panel/GFX effect), then sets state byte +1 to 4 and clears the phase byte. Every frame it also calls
  battleObject_chipSelectAnimTick_8029C08 (pushes an OAM affine record, walks the pulse phase) and sub_802899C
  (queues a 0x200-byte gfx block to VRAM 0x6016CC0 plus a FIFO record).
