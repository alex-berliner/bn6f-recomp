summary: Returns nz (= TRUE) if the cutscene state's originally-saved script pointer is the L-Message cutscript
  sentinel, otherwise FALSE.
interface: 'u32 cutscene_isOriginalScriptLMessage_8036F40(void) // in: R10=Toolkit; out: R2 bool, nz flags set from
  R2'
details: 'Reads Toolkit''s CutsceneState pointer (oToolkit_CutsceneStatePtr) via R10, then loads the

  "original cutscene script position" field (oCutsceneState_originalCutsceneScriptPos_40,

  which backs s_02011C50.unk_40). Compares that value against the address of the L-Message

  cutscript symbol (CutsceneScriptLMessage_80991F4). On match, R2 = TRUE; else R2 = FALSE.

  The final tst r2, r2 + mov pc, lr pattern is the standard "return bool via nz flags"

  convention used elsewhere in the codebase, so the caller''s test/branch is what consumes

  the result. No other state is modified; r0/r1 are clobbered as scratch.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
