name: battle_setupSceneTiles_8127CB8
address: '0x08127CB8'
kind: function
status: confirmed
summary: Builds tile-descriptor arrays, decompresses scene graphics, selects a tile-set variant from battle_state+0xD,
  and blits a 30×20 background grid into VRAM for the current battle encounter.
interface: void battle_setupSceneTiles(u32 *battle_state /* r5 */); // preserves r4-r7, clobbers r0-r3,
  flags
details: 'Reads bit 0 of the byte at battle_state+0xD as a variant selector. Loops over a 3-entry source
  table (off_8127DB8, 0x30 bytes): for each entry the first two words are passed to sub_811FB84 to compute
  a tile descriptor stored into unk_20096E0, and the next two words (destination pointer, size) are copied
  verbatim; the list is null-terminated at offset 0x24. Calls decompAndCopyData on the descriptor table
  (unk_20096E0) and on byte_8127DF0 (a compressed pointer referencing eTextScript201C700). Then selects
  between two initRefs blobs (off_8127D78 for variant 0, dword_8127D98 for variant 1—differing in their
  source compressed data dword_86C9108 vs dword_86C9128) and decompresses it. Calls sub_8123300 to decompress
  a 13-entry compressed-pointer table (byte_8127D38) into eTextScript201BA00 using eDecompBuffer2013A00.
  Finally calls CopyBackgroundTiles(0,0,1, tile_ids, 0x1E, 0x14) where tile_ids is unk_2028690 (variant
  1) or unk_201C200 (variant 0), loading a 30-wide by 20-tall tile block into VRAM screen block 1.'
