summary: 'Resets a battle object: enables it, clears its pending state byte, and forces anim step 4.'
interface: void resetObjectPose_803A85C(u8* r5) -> nz r0
details: "Operates on a battle object/struct pointer passed in R5. Writes three one-byte fields:\n  * [r5+0x1E]\
  \ = 1  (active/enabled flag)\n  * [r5+0x1C] = 0  (clears the pending action / sub-state byte at offset 0x1C)\n\
  \  * [r5+0x02] = 4  (forces animation/pose step to 4)\nReturns R0 = 4 with NZ flags set so callers can branch\
  \ on a truthy result via `mov r0, #4`\nfalling out of the final store. No registers beyond R0/R5/lr are touched,\
  \ and the function\ntail-returns via `mov pc, lr`.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
