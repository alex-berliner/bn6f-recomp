name: clearToolkitUnk2002230RecordFields_81376E8
address: '0x081376E8'
kind: function
status: confirmed
summary: Zeroes the four halfwords (offsets 4-0xA) of each 12-byte record in the 0x140-record array referenced by
  the toolkit's Unk2002230 pointer, leaving the first 4 bytes of each record intact.
interface: void clearToolkitUnk2002230RecordFields(void); /* reads r10 (toolkit), clobbers r0-r2 and NZCV */
details: Reads a pointer from the toolkit struct at oToolkit_Unk2002230_Ptr, then loops 0x140 times over 12-byte
  records. For each record it stores 0 into the halfwords at offsets 4, 6, 8 and 0xA; bytes 0-3 of every record
  are not touched, so some per-record field (likely an id/pointer/type) survives the clear. The loop is a simple
  counter countdown from 0x140 with no early exit. Clobbers r0-r2 and flags; returns with mov pc, lr. The exact
  game meaning of this structure (what entity or effect list it backs) is not determinable from this routine alone.
