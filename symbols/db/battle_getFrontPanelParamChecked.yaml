name: battle_getFrontPanelParamChecked
address: '0x0810B60C'
kind: function
status: confirmed
summary: Computes the panel in front of a battle object and returns its coordinates, forced to x=0 when the panel
  fails the front-panel parameter check.
interface: u32 battle_getFrontPanelParamChecked(u32 obj /* r5 */) -> r0 = panel x (0 if invalid), r1 = panel y;
  r4 and r5 are pass-through (returned unmodified); flags clobbered
details: 'Takes a battle object pointer in r5. Calls object_getFrontDirection(obj) to get the

  directional x-offset of the panel in front of the object, adds it to the object''s

  PanelX field (byte at oBattleObject_PanelX) to form the candidate x coordinate, and

  reads PanelY directly. Then calls GetAllianceDependentPanelParamArgs with r3 pointing

  at the table byte_810B6E0 and r5 = object to obtain, in r2/r3, the panel-parameter

  bounds/check data that depend on the object''s alliance (player vs. enemy side).

  Those results plus (x, y) are passed to object_checkPanelParameters, which validates

  the panel (bounds and/or panel state relevant to the alliance). If the check returns

  0, x is forced to 0 while y is still returned unchanged; otherwise both coordinates

  pass through. Quirk: on failure only x is zeroed, y is never validated independently,

  so callers get (0, y) rather than a distinct error marker. r4/r5 are untouched by the

  original and appear in the outputs only because the callee object_checkPanelParameters

  treats them as pass-through; a caller preserving r4/r5 across this call is safe.

  '
