name: battle_getFrontPanelParamChecked
address: '0x0810B60C'
kind: function
status: probable
summary: Looks up the alliance-dependent panel-effect entry for the panel in front of the battle object
  and returns it only if that panel's flag state passes the check, else 0.
interface: (r0 = battle object in r5? see quirks; uses r5 = object ptr) -> r0 = param word of matched
  table entry (r1 = args pointer) or 0; flags from cmp
details: 'Calls object_getFrontDirection to get the object''s facing multiplier (+1/-1), adds it to oBattleObject_PanelX
  (and takes oBattleObject_PanelY) to address the tile in front of the object. That coordinate indexes
  GetAllianceDependentPanelParamArgs, which fetches the 8-byte entry from the panel-effect parameter table
  selected by the object''s alliance field, yielding a param word (r0) and args pointer (r1). It saves
  {r0,r1}, calls object_checkPanelParameters (which consumes the args to test the panel''s required set/none
  flag masks), then restores the pair: on success it returns the param word (with args pointer in r1),
  otherwise 0. Note the object pointer appears to live in r5, set by the caller sub_810B3E4, not in an
  argument register — a caller-managed ''current object'' convention. Callees are used read-only; no state
  is written.'
