name: snakearm_hitUpdate
address: '0x080D6B28'
kind: function
status: probable
summary: 'SnakeArm projectile''s hit/lifetime state handler: resolves a collision (remove data, spawn
  hit effect), keeps the hit alive for a short timer, then destroys itself and marks its linked arm-segment
  objects for destruction.'
interface: (r5 = battle object) -> void; sets object state to CUR_STATE_DESTROY when done
details: 'Runs on the battle object in r5. First removes its collision data and spawns the hit-effect
  at the last collision coordinates (jittered, per object_spawnCollisionEffect). If the battle is not
  over, it reads the collision-data pointer at oBattleObject_CollisionDataPtr and clears the collision
  region if the collision flags are nonzero, decrements oBattleObject_Timer, and while the timer is still
  positive refreshes collision state and highlights the current collision panels. When the battle is over
  or the timer expires, it clears the collision region, sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY, and walks four pointers at r5+0x64..0x70 (the SnakeArm''s linked segment objects):
  each non-null one gets halfword at +0x20 set to 1, apparently a per-object destroy/hit flag.'
