name: snakearm_hitUpdate
address: '0x080D6B28'
kind: function
status: confirmed
summary: 'Per-frame state handler for the Snake-arm hit object: refreshes collision panels and a hit timer until
  expiry or battle end, then destroys the object and invalidates its panel references.'
interface: void battle_snakearmHitUpdate(u32 r4, BattleObject* r5, u32 r7, u32 r8)  /* outputs r5, r8; clobbers
  r0-r3, nzcv, lr; preserves r4-r7 */
details: "Called as a state-action phase handler for the Snake-arm (Serpent) hit object during battle.\nr5 points\
  \ to the oBattleObject for the hit; r7/r8 carry extra context used by the collision\npresentation helpers. Each\
  \ frame the handler:\n  1. Removes stale collision panel data and spawns a visual hit effect on the footprint.\n\
  \  2. Queries battle_isBattleOver; if the battle already ended, skips to the destroy path.\n  3. Reads oCollisionData_FlagsFromCollision\
  \ via oBattleObject_CollisionDataPtr; if non-zero\n     (collision registered), clears the collision region.\n\
  \  4. Decrements the u16 oBattleObject_Timer. While the timer is still positive the object\n     re-presents its\
  \ collision panels (oBattleObject_CollisionDataPtr) and highlights the\n     current collision tiles, then returns\
  \ for the next frame.\n  5. Destroy path (timer ≤ 0 or battle over): clears collision region, writes\n     CUR_STATE_DESTROY\
  \ into oBattleObject_CurStateActionPhaseAndPhaseInitialized, then walks\n     the three panel-pointer slots at\
  \ r5+0x64 .. r5+0x6C and, for each non-null pointer,\n     writes 0x0001 (validity flag) to offset +0x20 to release\
  \ those panel references.\nThe timer subtraction uses 32-bit SUB into a u16 store; if the timer was already 0\
  \ it wraps\nto 0xFFFF, but the signed BLE branch still routes to the destroy path because 0xFFFF is\npositive\
  \ in u16 yet negative as s16… actually the SUB result is kept in r0 (u32 = 0xFFFF)\nand compared with BLE against\
  \ 0 – since r0 is unsigned 0xFFFF > 0 the object would NOT\ndestroy on a zero-timer wrap; in practice the timer\
  \ is always set > 0 at spawn.\n"
