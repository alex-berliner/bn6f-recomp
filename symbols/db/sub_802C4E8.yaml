name: sub_802C4E8
address: '0x0802C4E8'
kind: function
status: confirmed
summary: draws a time value as a five-digit M'SS"CC timer on the battle BG using tiles starting at 0xA0 and palette
  (palette + 9), capped at 9'59"99
interface: u32 time in r0, u32 palette in r1; returns r5 preserved, r6/r7 left pointing at the digit x-table and
  a stack slot for callers
details: 'Converts r0 to BCD via memory_bcd_8000D84, clamps it with a signed compare against 0x95999

  (BCD 9''59"99, the largest representable timer value, so the function never draws a 6-digit

  overflow). The tile-map entry base is (palette + 9) << 12 | 0xA0, i.e. the digit glyphs

  start at VRAM tile 0xA0 and use palette (palette + 9); each BCD nibble selects a digit by

  adding nibble * 2 to that base. For each of five digits (index table at 0x802C538:

  {0x14, 0x13, 0x11, 0x10, 0x0E}) the two tile-map entries (top, bottom) are written into

  a 4-byte stack slot and passed by guest address to blitTileBlockToRowBuffer_802C4B6 with

  column = x, row = 4, width = 1 tile, height = 2 tiles, drawing the digit as a 1x2

  big-number glyph. The gaps in the x table (between 0x10 and 0x11 is no gap, between 0x13

  and 0x14 is none; the layout 0x0E, 0x10, 0x11, 0x13, 0x14 leaves columns 0x0F and 0x12

  free for the '' and " separator tiles, which this routine does not draw). Uses the r6

  stack slot as a two-entry tile-map buffer across the call and preserves the loop''s r6/r7

  so callers continue to see those scratch pointers.

  '
