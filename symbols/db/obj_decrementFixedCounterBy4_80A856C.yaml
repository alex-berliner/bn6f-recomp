name: obj_decrementFixedCounterBy4_80A856C
address: '0x080A856C'
kind: function
status: confirmed
summary: Subtracts 4.0 (4<<16, fixed-point) from a 32-bit counter field at [r5+0x14] of a struct pointed
  to by r5, storing the raw result but reporting success (Z set) once it has reached zero or below.
interface: 'u32 sub_80A856C(void *obj /* r5 */); inputs: r5 (object ptr), lr; outputs: NZ flags only (r0
  clobbered); no other registers preserved or read'
details: 'Treats r5 as the base of some object/entity struct and uses offset 0x14 as a signed 32-bit counter
  held in 16.16 fixed-point (decrement is 4 << 16 = 0x40000, i.e. 4.0 per call). The decremented value
  is stored back unclamped, but the return value used for the NZ flags is clamped: if the stored result
  is <= 0, r0 is set to 0 before pop {pc}, so callers observing flags see a non-negative value and Z=1
  exactly when the counter has run out (or gone negative). Callers per the contract only read flags, never
  r0''s value. lr is pushed/popped purely as a return address (pop {pc}). Quirk: because the stored field
  is not clamped, once the counter passes zero it keeps going more negative on subsequent calls while
  the flags continue to report "zero/finished"; the caller is expected to stop invoking it or reset the
  field once Z is seen. What the counter counts (timer, fill gauge, scroll amount, etc.) is not determinable
  from this function alone.'
