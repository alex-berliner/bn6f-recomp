name: sub_80FFAA0
address: '0x080FFAA0'
kind: function
status: hypothesis
summary: Looks up a byte value from a small 4-entry table via sub_800FE28 using the object at r5, then adds 60 (0x3C)
  if the object's 0xA000 status flag bits are set, returning the result.
interface: int sub_80FFAA0(void *obj /* r5 */); returns the computed value in r0; clobbers r1, r2, lr, flags; preserves
  r4
details: 'Takes the object/entity pointer (or index) in r5. First calls sub_800FE28 with the pointer to dword_80FFAC0,
  whose bytes form a 4-entry lookup table with values 0x24, 0x1E, 0x18, 0x12 (36, 30, 24, 18 - a strictly decreasing
  sequence), using r5 as the selection key; the returned r0 is the base value. It then calls object_getFlag on r5
  and tests the result against 0xA000 (bits 15 and 13); if either bit is set, 0x3C (60) is added to the base value.
  The final value is returned in r0. The table lives inline right after the function body. r4 is only used as a
  scratch copy of the lookup result. The exact game meaning of the table values and of the 0xA000 flag combination
  is not identifiable from this function alone.

  '
