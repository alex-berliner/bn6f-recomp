- what fields +0x24/+0x26 in the r5 struct actually are (cursor x/y vs. old/new position)
- what r1 selects (axis? input bit?) and why 0xC is the forced/invalid result
- why a delta of exactly 4 is treated as invalid — board width/wrap behavior
