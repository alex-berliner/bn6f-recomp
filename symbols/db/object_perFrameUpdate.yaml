name: object_perFrameUpdate
address: '0x080CA074'
kind: function
status: probable
summary: 'Generic per-frame update for a battle object: refresh its collision lifecycle, spawn hit effects,
  run its state handler and sprite, and self-destruct when the battle ends.'
interface: (r5 = battle object pointer) -> void; destroys the object (state CUR_STATE_DESTROY) if the
  battle is over
details: Uses r5 as the battle object pointer throughout, matching the callees' documented convention.
  Each frame it first tears down the previous frame's collision data (object_removeCollisionData), then
  spawns the hit-effect object for any new collision (object_spawnCollisionEffect). If the battle is still
  running it reads oBattleObject_CollisionDataPtr -> oCollisionData_FlagsFromCollision, clearing the object's
  collision region when flags are nonzero, then calls the object's state-specific handler sub_80CA0B0,
  advances the sprite (object_updateSprite), and refreshes present-collision state for this frame (object_presentCollisionData).
  When battle_isBattleOver reports the battle ended, it clears bit 1 of oObjectHeader_Flags, clears the
  collision region, and sets the object's state to CUR_STATE_DESTROY so the engine removes it. This is
  the standard per-frame wrapper pattern around an object-specific sub_80CA0B0.
