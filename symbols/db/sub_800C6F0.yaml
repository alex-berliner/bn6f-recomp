name: sub_800C6F0
address: '0x0800C6F0'
kind: function
status: confirmed
summary: For a battle object, count its allied (or non-matching-alliance) panels per column and return totals, clean
  counts, and bitmasks
interface: u32 object_countAllyPanels_800C6F0(void *object); // r0=object in; r0=total panels, r1=clean panels,
  r2=total mask, r3=clean mask out; clobbers nz,c,v
details: 'Iterates panel columns 1..3 for the given object via object_getPanelDataOffset.

  A panel contributes when present and its oPanelData_Alliance byte differs

  from oPanelData_Unk_04 (so this is comparing alliance vs. some teammate/own-id

  byte). Each contributing column bumps a counter and sets a bit in the total mask

  (1<<col). If the panel''s oPanelData_Flags & 0x00F880080 is zero, it is also

  counted in the second pair (clean count + clean mask). Two 32-bit bitmasks

  accumulate on the stack; results are returned in r0..r3. r4..r7 are preserved.

  Likely used by battle logic to decide which of an object''s panels can be

  targeted/aliased based on the 0x00F880080 flag mask (e.g., panels in special

  states like broken, hidden, or virus-only).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
