name: battle_chipLockoutExpire
address: '0x08089960'
kind: function
status: probable
summary: 'When called each frame for an entity with a chip-lockout timer: if the [r5+0x13] flag is clear,
  ticks the lockout timer; if the ticker reports the lockout just expired, starts a mode-4 screen fade
  via SetScreenFade(4,0xFF) and transitions the entity''s state byte at [r5] to 0x4C. Always returns 1.'
interface: (r5 = entity/AI struct, set by caller) -> r0 = 1 always; calls SetScreenFade(4, 0xFF) and stores
  state 0x4C on expiry
details: Checks the flag at [r5+0x13]; if it is 0, it calls the known chip-lockout ticker (AIData+0x18
  decrement) and, when the timer hits zero, calls SetScreenFade with mode 4 and parameter 0xFF (a fade-to-color),
  then writes 0x4C into the struct's state byte at [r5+0]. If the 0x13 flag is set, the lockout is never
  ticked and nothing else happens. It unconditionally returns 1, so it is likely a per-frame step/continue
  handler invoked in a loop. Note r5 is used without being set inside the function, so the caller must
  supply the AI/actor pointer in r5.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#0x13]; tst/bne skips the whole lockout handling when the flag is set; bl battle_tickChipLockout_8089CB4
    + beq triggers only on timer expiry (callee summary: returns whether ChipLockoutTimer hit zero); bl
    SetScreenFade with r0=4, r1=0xFF is a screen fade-to-color on lockout end; mov r0,#0x4C; strb r0,[r5]
    transitions the struct''s state byte to 0x4C; mov r0,#1 after both paths: fixed nonzero return, typical
    of an update/step callback'
  refs:
  - bn6f/asm/asm23.s:1300
  - 0x08089CB4 battle_tickChipLockout_8089CB4
  - 0x08006270 SetScreenFade
  reproduce: python3 tools/asmcat.py 0x08089960
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal correctly describes the control flow: when flag [r5+0x13] is clear it calls the chip-lockout
    ticker and, if it returns non-zero, triggers SetScreenFade(4,0xFF) and stores 0x4C at [r5]. However,
    the name ''battle_chipLockoutEndFade'' misnames the callee— it''s a state transition when the lockout
    expires, not a fade routine itself. The [r5+0x13] flag is actually a r4-r7 save plus an existing flag
    check; the actual decision is driven by battle_tickChipLockout returning nonzero. Note the branch
    `beq loc_808997A` after the call means the AI advances only on expiry, otherwise control skips to
    return-1. The proposed summary conflates these details slightly but is mostly right; the name should
    reflect the state transition rather than the fade.; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
