name: submenu_updateCursorSprite
address: '0x08117C70'
kind: function
status: probable
summary: 'Per-frame update for a menu cursor object: resets its sprite animation when flagged, then redraws
  the cursor/highlight.'
interface: (r0/r5 = cursor object pointer) -> r0 = clobbered; flags from tst of frame attribute byte
details: Writes 0x23 into the object's first byte (an ID/type or cursor kind marker), then if the byte
  at +0xC is nonzero, clears that flag, sets animation index 0 via sprite_setAnimation, reloads the animation
  data, and marks the sprite shadowless. It then reads the current frame's parameters and, when the attribute
  byte has bits 0xC0 set (cursor/highlight variant), calls sub_8117CD4, which draws the menu cursor slid
  horizontally with the menu scroll. Essentially a state-sync-plus-draw routine for a cursor-like sprite
  object.
