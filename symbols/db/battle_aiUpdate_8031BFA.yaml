summary: 'Advances one battle AI tick: computes the entity''s relative position to its target, then runs a small
  AI helper that returns a value to a flag-check callee.'
interface: (r0 = entity pointer, r5 = AI state-ish struct) -> r0 = 0/3 from sub_8031B7C (cached-AI-active flag);
  tail call via pop {pc}.
details: "- Saves lr, calls battle_calcRelPosToTarget_803172E (r0=entity, r5=carry-over; result scratch written\
  \ for entity + next-position).\n  - Sets r2=0, r4=0x10, r3=0x10, r5=0 and calls sub_8031570. The four arguments\
  \ (r2..r5) form the 0x10/0x10/0/0 quad typical of the AI's \"find/stage an action\" helpers; 0x10,0x10 is a panel-area\
  \ window, 0 is the \"no override\" pair.\n  - Then calls sub_8031B7C(r0) which (per its probable summary) returns\
  \ 1 of [[dword_2013920]+0x14] when called with r0==1, else 0; here r0 is the result of sub_8031570 (a small int),\
  \ so the function ends by reporting a boolean to the caller.\n  - The function pops {pc} rather than {lr}, so\
  \ it is itself a tail call: the caller at 0x08031ad0 frames this as one step in a per-turn AI loop.\n  - Inputs\
  \ r0/r5 are preserved by the contract; everything else is caller-saved.\n"
