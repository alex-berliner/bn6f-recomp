name: battleObject_chipSelectUpdate
address: '0x08027548'
kind: function
status: probable
summary: 'Per-frame state-machine update for the battle chip-select object: dispatches a state handler,
  then runs the chip-slot pulse animation and queues its graphics block to VRAM/FIFO.'
interface: (self = r5 = *S20364C0, chip-select object) -> r0 = destroyedsucc; no meaningful return; called
  for its side effects
details: The function reads the state byte at [r5,#2] of the object at S20364C0 and indexes a 4-entry
  jump table (off_8027564) of thumb handlers (sub_8027574/80/9E/D8), calling the selected one via 'mov
  lr,pc; bx r1'. Unconditionally afterwards it calls battleObject_chipSelectAnimTick_8029C08, which advances
  the chip-select pulse phase and pushes an OAM affine record, and sub_802899C, which uploads the object's
  0x200-byte gfx bank to VRAM 0x6016CC0 and pushes a cartridge FIFO record. So this is the tick/update
  entry for the chip-select GUI object, with the state byte selecting which per-state behavior runs before
  the common render/gfx work.
