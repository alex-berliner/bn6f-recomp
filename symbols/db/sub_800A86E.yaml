name: sub_800A86E
address: '0x0800A86E'
kind: function
status: hypothesis
summary: Iterates the battle state's 8 "alive battle actor" slots, reading each occupied actor's AI-data unk_0e
  byte and HP, but writes nothing back — an apparent leftover/stub whose only visible effect is the last slot's
  values left in registers.
interface: 'in: r10 = toolkit (battle state read via oToolkit_BattleStatePtr), r2 = fallback AI-data pointer (kept
  if no slot is occupied); out: r0 = oAIData_Unk_0e of the last occupied slot''s actor, r1 = its HP (skipped when
  unk_0e == 0xFF), r2 = AI-data pointer of last occupied slot (or incoming r2), r3 = raw contents of the last slot
  (0 if empty); c/v set by the final cmp r4, #8 (equal, so Z set per the C note, c/v reflect 8 vs 8); r4, r7 preserved'
details: Reads the toolkit's battle-state pointer at oToolkit_BattleStatePtr, adds oBattleState_AliveBattleActors,
  and walks the 8 four-byte slots of the alive-actor array. For each non-null actor pointer it loads the actor's
  AI-data pointer (oBattleObject_AIDataPtr), reads the byte at oAIData_Unk_0e, and, unless that byte is 0xFF (an
  "unset/invalid" marker), also reads the actor's HP halfword at oBattleObject_HP. No memory is written, no branches
  are taken on the values, and the loop counter r4 always ends at 8, so the function is side-effect-free apart from
  its register outputs; it looks like a scan or per-actor update whose body was reduced to reads (possibly a stubbed-out
  routine), or a probe whose result was meant to be consumed via registers/flags by a specific caller.
