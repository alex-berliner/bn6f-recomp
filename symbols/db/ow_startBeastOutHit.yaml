name: ow_startBeastOutHit
address: '0x0808FCF0'
kind: function
status: confirmed
summary: Kicks off the overworld "Beast Out knocked back by a hit" reaction on the player, setting a hit direction
  and a 15-frame timer and playing the hit sound.
interface: void ow_startBeastOutHit(u32 r2_soundArg2); returns r0 = 0 (NZ cleared by the movs), r2 pass-through
  to PlaySoundEffect, c/v from PlaySoundEffect
details: Loads the overworld player object pointer from off_808F5D4 (object base 0x2000310). Calls GetOWPlayerFacingDirection
  and maps the facing value through the table byte_808FD14 (5,5,7,7,1,1,3,3 - each facing pairs to a hit direction,
  so left/right and up/down facings collapse to their pair partner), storing the result at byte 0x18 of the player
  object (byte_2000328), the direction the knockback/hit pose uses. Stores 0xF (15 frames) at byte 0x17 (dword_2000324+3),
  a countdown that presumably drives the hit animation before control returns. Plays SOUND_HIT_6B via PlaySoundEffect;
  r2 is untouched by this function before the call, so it is forwarded verbatim as PlaySoundEffect's second argument
  (its meaning is defined by PlaySoundEffect, not here). Always returns 0 in r0; the Thumb mov r0,#0 sets Z=1/N=0
  on the caller side. Note the function ignores its own r2/r10 inputs except for that pass-through, and pushes/pops
  r5 so it leaves as entered.
