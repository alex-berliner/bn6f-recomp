name: ow_startBeastOutHit
address: '0x0808FCF0'
kind: function
status: probable
summary: 'Starts the player''s Beast Out overworld strike: records the facing-derived hit direction and
  a 15-frame counter in the player''s beast-attack struct and plays the hit sound.'
interface: (no args) -> r0 = 0; clobbers r0-r1, r5, lr
details: Loads a struct pointer from off_808F5D4 (an OW player/beast state singleton at 0x2000310+), calls
  GetOWPlayerFacingDirection, and maps the direction through byte_808FD14 {5,5,7,7,1,1,3,3} into field
  +0x18 — the doubled values (1,3,5,7) look like a per-facing parameter, likely a hitbox/tile offset or
  animation variant per direction. It writes 0xF into field +0x17, plausibly a countdown/timer or animation
  phase for the attack, then plays SOUND_HIT_6B (the hit sound) via PlaySoundEffect and returns 0. The
  table covering 8 indices suggests GetOWPlayerFacingDirection's raw value is shifted or the mapping intentionally
  pairs directions. No caller is known, so which gameplay event triggers it (likely the Beast Out overworld
  attack in the 'beastsp' route) is inferred from the route and the sound effect.
