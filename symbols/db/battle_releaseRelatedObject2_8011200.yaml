name: battle_releaseRelatedObject2_8011200
address: '0x08011200'
kind: function
status: confirmed
summary: Clears a battle object's RelatedObject2 link, sending the linked object to cleanup state 8 first
  if one was set.
interface: u32 battle_releaseRelatedObject2_8011200(battle_object *obj /* r5 */, u32 r1_passthrough) ->
  u32 (r1 out from cleanup call, or passthrough)
details: 'Reads obj->RelatedObject2Ptr (oBattleObject_RelatedObject2Ptr). If non-null, calls sub_80C44C8
  (= battle_objectSetStateActionPhase8) with the related object in r0, which puts that object into action
  phase 8 (its cleanup/teardown state), then stores 0 into obj->RelatedObject2Ptr to detach it. If the
  pointer is already null, does nothing. r1 is a pure passthrough: it is returned unchanged when no object
  was linked, and otherwise holds whatever r1 value sub_80C44C8 left behind, so callers can chain a value
  through this call. Flags nz are clobbered by the tst; lr is preserved via push/pop on the non-tail path
  (the pop {pc} return after the bl). r5 is untouched, only used as the object base.

  '
