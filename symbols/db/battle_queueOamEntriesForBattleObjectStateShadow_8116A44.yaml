name: battle_queueOamEntriesForBattleObjectStateShadow_8116A44
address: '0x08116A44'
kind: function
previous_names:
- sub_8116A44
status: probable
summary: Queues a fixed set of sprite/OAM entries (3 + 3 + 2 entries) into OAM using sprite_queueOamEntryThunk_802FE28,
  presumably redrawing/rehiding battle object/shadow tiles when an object's state transitions to 8.
interface: '() -> r0 = 0xFF (NZ-C-) ; side effects: writes OAM via sub_802FE28'
details: "- No inputs from r0-r3 are read; the function ignores entry arguments and only consults three\n\
  \    embedded ROM data tables (dword_8116A94, dword_8116AB0, dword_8116ACC), each consisting of 8-byte\n\
  \    records (u32 tile/attr, u16 oam-related halfword).\n  - Loop 1 (loc_8116A4A) walks the first table\
  \ for 3 iterations (cmp r6, #3 / blt), calling\n    sub_802FE28 with r0=[r7], r1=[r7+4], r2=0, r3=1.\n\
  \  - Loop 2 (loc_8116A62) walks the second table for 3 iterations.\n  - Loop 3 (loc_8116A7A) walks the\
  \ third table for 2 iterations (cmp r6, #2 / blt).\n  - Total 8 sprite_queueOamEntryThunk calls queued\
  \ per invocation. The signature for r0/r1 (the two\n    args passed to 802FE28) matches sprite_queueOamEntryThunk_802FE28\
  \ which is described as\n    \"(u32 a1, u16 a2, int notUsed, int a4) -> void\".\n  - Callee sub_8116A28\
  \ tail-calls in once a battle object has reached state 8 (CUR_STATE_DESTROY);\n    caller battle_reloadObjectSprite_8116A04\
  \ invokes it after a sprite (re)load has been triggered\n    (after hiding the shadow and running follow-up\
  \ setup). So this function is the \"redraw queue\"\n    step that fires during/around state-8 transitions\
  \ for an object whose animation was just reset.\n  - Return r0=0xFF in every captured call; the contract\
  \ says no caller-visible return is meaningful\n    (out is r5), so callers treat it as void-like.\n"
