    r7, #8`). - asm: r2=#0 and r3=#1 are the documented "notUsed/a4" args of sub_802FE28 on every call.
    - asm: third loop uses `cmp r6, #2` while the first two use `cmp r6, #3`, confirming 3+3+2 entries.
    - callers: sub_8116A28 (hypothesis) keeps two bytes in sync once a counter reaches 8 and then tail-calls
    into this function with the same r5 (battle object pointer); battle_reloadObjectSprite_8116A04 calls
