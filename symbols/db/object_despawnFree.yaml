summary: Clears the first byte of the battle object's extra-vars block, then frees the object's slot.
interface: (r5 = battle object pointer, no register args) -> r0 = result of object_freeMemory
details: Loads oBattleObject_ExtraVars from the object at r5, stores 0 into that extra-vars pointer's
  first byte (likely an 'active/alive' flag the object's own update logic checks), then calls object_freeMemory
  to clear flags, free the bitmap slot, unlink from the active list, and reset sprite scaling. Because
  it only reads r5 and no argument registers, it is almost certainly an object callback (update/despawn
  handler) invoked with the object in r5. The freed object's type comes from the object struct itself
  inside object_freeMemory. No loops, no other fields touched.
