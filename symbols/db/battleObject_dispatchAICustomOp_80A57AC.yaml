open_questions:
- Which AIData field corresponds to offset 8 — AIData struct layout puts `AIIndex` at 0x1 and `Unk_02..Unk_07`
  near 0x2..0x7; nothing obvious is named at 0x8. The struct has `Unk_08` at 0x8, so this is likely a
  per-AIData "B-button custom op selector".
- The semantic role of the three targets (sub_80A57D0/828/888) is not yet known.
