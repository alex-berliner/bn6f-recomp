name: sprite_setStructHalfwordPairOnThree_8117084
address: '0x08117084'
kind: function
status: confirmed
summary: Fills the halfword pair at +0xC/+0xE with the two given values on up to three consecutive structs from
  the pool at 0x2008450, stopping at the first index with no struct.
interface: void sub_8117084(u16 valueA r0, u16 valueB r1, s32 startIndex r2); also returns last lookup's r0/r1 and
  final cmp flags as side effects; r4-r7 preserved
details: 'Takes two halfword-sized values (r0, r1) and a starting index (r2), and walks the three consecutive indices
  r2..r2+2. Each index is passed to getStructFrom2008450, which resolves it to a struct pointer (r1) from the pool/array
  anchored at 0x2008450 (or returns 0 if there is no struct for that index). While a struct is found, its halfwords
  at +0xC and +0xE are overwritten with valueA and valueB respectively, then the loop advances to the next index.
  The loop aborts early on the first index whose lookup returns NULL, leaving that call''s registers/flags in place;
  a full run ends with the flags of the final index comparison. Only ever touches the two halfword fields; the meaning
  of +0xC/+0xE depends on the struct type served by 0x2008450 (likely per-entity/sprite state shared by a small
  group, since exactly three consecutive indices are processed). Quirks: r1 and r2 do not survive as inputs — they
  end up holding the last lookup''s returned pointer/value, and the return value/flags are unspecified side effects
  rather than a designed result.

  '
