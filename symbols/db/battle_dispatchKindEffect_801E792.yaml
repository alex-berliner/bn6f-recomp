open_questions:
- The exact meaning of "kind" (intro vs. side-effect vs. ending vs. victory) — the choice of 0x24 special-case
  plus the many callers from sub_8008064/sub_80081A4/sub_800825A (post-battle wait) hint these are battle-phase
  sub-effects, but no symbol at off_801E944 is in the provided snippets. Decompiling off_801E944 (the
  fn table) and pt_801EF84 (the kind records) would name each kind unambiguously.
- Whether r1 (when non-zero) is an alternate kind code or a "force sub-id" override — the assembly uses
  it as a kind but the conditions (`cmp r0,#0; cmp r1,#0; beq loc_801E7D8`) suggest r1 only takes effect
  when r0 is zero, possibly "no specified kind, force this one"
