    and the early-exit to loc_801E81C that returns r0=1 - Busy-byte block: `mov r2,#0; strb r2,[r5]; strb
    r2,[r5,#7]` zeroes two state bytes at byte_2036840/byte_2036847 - Slot allocation: `bl sub_802FE48`
    returns the slot in r0 which is `strb r0,[r5,#6]` (=byte_2036846) and is then passed as the first
    arg of `sprite_setAffineTransform_802FE7A(r0=slot, r1=0, r2=0x40, r3=0xe0)` - Kind picking: explicit
    `cmp r0,#0` / `cmp r1,#0` with the fallback `mov r0,#0x30; str r0,[sp]` shows r0/r1 are OR''d into
    a single kick-off kind; the chosen kind is written to `strb r0,[r5,#1]` - Per-kind handler dispatch:
    `ldr r1,=pt_801EF84; ldr r4,[r1,r0]; ldrh r0,[r4]; strh r0,[r5,#2]; ldrb r0,[r4,#2]; strb r0,[r5,#8];
    lsl r0,r0,#2; ldr r6,=off_801E944; ldr r6,[r6,r0]` followed by `mov lr,pc; bx r6` with r0..r3 restored
    from the stack — clearly a tail-call into a function-pointer table indexed by per-kind code - Arms
    request bit: `mov r0,#1; lsl r0,r0,#0xf; bl eStruct2035280_SetRequestBits_801BECC` then `bl dispatch_801DA48`
    - Special case: `ldrb r0,[r5,#1]; cmp r0,#0x24; bne ...; mov r0,#1; lsl r0,r0,#8; bl dispatch_801DACC`
    shows kind 0x24 uniquely triggers a second dispatch with mask 0x100 - Caller `object_drawChipName`
