name: battle_dispatchKindEffect_801E792
address: '0x0801E792'
kind: function
previous_names:
- sub_801E792
status: probable
summary: 'Kicks off a battle sub-effect (intro/effect animation) identified by a kind byte: guards re-entry
  via eStruct2035280+0x40 bit 0x8000, allocates a sprite slot, picks the per-kind handler from off_801E944,
  runs it, then arms the eStruct request bit.'
interface: '(r0 = kind, r1 = aux/param1, r2 = aux/param2, r3 = aux/param3) -> r0 = 0 on success, 1 if
  the effect is already busy or no slot was free; side effects: writes 9 bytes at byte_2036840, sets eStruct2035280+0x40
  bit 0x8000, calls dispatch_801DA48(0x8000) and dispatch_801DACC(0x100) when kind==0x24'
details: "1. Saves r0..r3 on stack and tests dword at eStruct2035280+0x40 against 0x8000; if already set,\
  \ returns r0=1 (busy).\n  2. Loads the per-effect scratch struct at `byte_2036840` and zeroes offset\
  \ 0 and offset 7 (an in-progress byte and a state byte).\n  3. Calls `sub_802FE48` to claim one of 16\
  \ ID slots; if it returns 0xFF (all taken) returns r0=1. The chosen slot is stored at +6.\n  4. Calls\
  \ `sprite_setAffineTransform_802FE7A(slot, 0, 0x40, 0xe0)` to initialise the associated sprite.\n  5.\
  \ Picks the \"kind\": if (r0==0 && r1!=0) the kind comes from r1, otherwise from the original r0; if\
  \ still zero defaults to 0x30. The chosen kind is stored at byte_2036841.\n  6. Indexes the kind table\
  \ at `pt_801EF84` (an array of {u16 data; u8 func_index} sized by kind) — loads `data` into word_2036842\
  \ and `func_index` into byte_2036848.\n  7. Uses func_index*4 to read a function pointer from `off_801E944`\
  \ and tail-calls (`mov lr,pc; bx r6`) into it, passing the four original stack-saved arguments verbatim.\
  \ Each per-kind handler is expected to do its own teardown and clear the eStruct2035280+0x40 0x8000\
  \ bit.\n  8. After the handler returns, ORs 0x8000 into eStruct2035280+0x40 via `eStruct2035280_SetRequestBits_801BECC`,\
  \ dispatches 0x8000 through `dispatch_801DA48`, and additionally calls `dispatch_801DACC(0x100)` when\
  \ kind==0x24 (an extra second-stage dispatch for that one kind).\n  9. Returns r0=0 on the success path;\
  \ the r0=1 path also returns 1.\n"
