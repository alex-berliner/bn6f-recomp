name: replaySpriteFrames_811F24C
address: '0x0811F24C'
kind: function
status: confirmed
summary: Replays a sequence of sprite/animation frames from a small table, advancing a clamped tick counter each
  call
interface: 'void sub_811F24C(void);  // in: r5 = base of caller state struct (writes r5+0xC counter); clobbers r0,r1,r2,r3,r6,r7,lr;
  preserves r4-r7 (caller-saved by push/pop); NZCV clobbered'
details: 'Increments a byte counter at offset 0xC on a caller-supplied state struct (held in r5),

  clamping the new value so it never exceeds 3 (i.e. legal values 0..3). It then iterates

  over the (count+1) entries of the 8-byte-pair table at dword_811F278, invoking

  sub_802FE28(lo32, hi32, 0, 1) for each pair. Each 8-byte entry therefore feeds two

  u32 arguments (likely tile/map pointers or sprite descriptors) into sub_802FE28 with

  fixed a3=0, a4=1, suggesting a "replay/restart this animation frame" primitive.

  Loop bound = post-bump counter; loop is skipped entirely if counter is already at 3

  (cmp r0,#3 / bgt: when count+1 > 3, the increment is discarded and loop bound stays 3,

  so a fourth call also iterates only 3 times). Index type is treated as signed (cmp/blt).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
