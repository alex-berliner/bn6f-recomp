- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; writes #4 and #0x3c only when element==0 (first-run
    init); decrements StepTimer each frame and falls through to bl object_exitAttackState when it underflows;
    only callee is object_exitAttackState, matching a terminal attack-script step; fields touched are
    the project-known oAIAttackVars_AttackElement / StepTimer of the battle object AI attack state'
