name: ai_attackSetElement4AndWait60
address: '0x080F6704'
kind: function
status: probable
summary: AI attack script step that assigns attack element 4, waits 60 frames, then exits the attack state
interface: (r0-r3 unused; r7 = object with oAIAttackVars) -> r0 clobbered by call; sets AttackElement/StepTimer,
  decrements StepTimer
details: The function operates on the object's oAIAttackVars fields reached through r7. If oAIAttackVars_AttackElement
  is 0 (step not yet initialized), it stores 4 into AttackElement and 0x3C (60 frames) into the halfword
  StepTimer and returns, leaving the state active. On every later invocation it decrements StepTimer;
  when the value goes negative it calls object_exitAttackState to terminate the attack. It performs no
  hitbox, sprite, or damage work itself, so element 4 with a plain 1-second delay looks like a placeholder/wait
  attack step or one whose effect is driven elsewhere by the element value. Element 4's game meaning (e.g.
  a specific boss attack slot) is not shown here.
