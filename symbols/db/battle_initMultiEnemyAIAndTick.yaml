name: battle_initMultiEnemyAIAndTick
address: '0x08144048'
kind: function
status: probable
summary: On a one-shot flag, initializes three AI chip-queue slots for the multi-enemy actors 0xE/0xC/0xD, then
  each frame runs AI dispatch, sprite gfx updates, a sub_804691A(3)/sub_811E744 step, and a fade+subsystem-4 cleanup
  before the common tail.
interface: () -> r0 = 0; flags clobbered
details: Loads the battle struct at 0x2001010; sub_81440AE apparently gates the whole routine (if its result is
  nonzero it only runs sub_8143F1C and returns 0). When byte_2001013 is set it clears it and initializes three 0x58-byte
  AI chip-queue slots (slot 0xE -> queue index 0, slot 0xC -> index 1, slot 0xD -> index 2, arg2=0) via battleObject_initAIChipQueueSlot_80468C6,
  a one-shot setup for a specific multi-enemy encounter. Each frame it then calls battle_callAIDispatch_8046818
  and battleObject_updateSpriteGfxForAll_8046854, calls sub_804691A(3) and, if nonzero, sub_811E744. It then checks
  IsScreenFadeActive and, when fading and the gamestate subsystem index equals 4, calls sub_8143F7C before the common
  tail sub_8143F1C. Always returns 0, suggesting it is a state-machine/mode handler step.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/strb on [r5,#0x3] with tst/beq wraps one-shot init of AI chip slots (sub_8144048+6..+2C); three
    battleObject_initAIChipQueueSlot_80468C6 calls with fixed slot ids 0xE,0xC,0xD and indices 0,1,2; back-to-back
    battle_callAIDispatch_8046818 and battleObject_updateSpriteGfxForAll_8046854 = per-frame battle update; IsScreenFadeActive
    followed by oToolkit_GameStatePtr/oGameState_SubsystemIndex == #4 check before sub_8143F7C; returns 0 always
    (mov r0,#0 before pop), typical of a mode-update handler'
