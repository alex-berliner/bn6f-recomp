summary: 'Two-axis camera scroll during battle transitions: horizontal pass with object nudge, then optional vertical
  pass; accumulates scroll-state bits in r12.'
interface: void battle_camScrollTwoPass_8031478(u32 r0, u32 r5, u32 *r12_inout); /* returns modified r3, r12; preserves
  r0-r2, r5 */
details: 'Pass 1: calls sub_8031176 (battle-object setup), then sub_8030E8C with a 0x20-step

  delta (r2=0x20, r3=0x20, r4=0, r5=0x20, r6=0) to shift battle sprites/objects,

  then camera_moveByDelta_80310B0 with dy=0 for a horizontal nudge. The resulting

  horizontal delta is ORed into r12 (bit 0).


  Early-exit guard: if the horizontal delta equals exactly 1 (camera already at target

  in one step), the function returns without a vertical pass.


  Pass 2: calls sub_8031136 (reverse object setup), then sub_8030F04 with deltas

  (r4=-1, r5=-1, r3=0, r2=0x20, r6=0) to undo/reverse the object shift, then

  camera_moveByDelta_80310B0 with dx=0 for a vertical nudge. The vertical delta is

  shifted left by 1 and ORed into r12 (bit 1).


  r0, r1, r2, r5 are saved/restored across the entire sequence (pushed before the

  first call, popped at each exit). r12 is both an input (initial mask from caller)

  and an output (accumulated scroll bits). The 0x20 step size and the -1 reverse

  deltas suggest frame-count or sub-pixel units for battle camera panning.

  '
