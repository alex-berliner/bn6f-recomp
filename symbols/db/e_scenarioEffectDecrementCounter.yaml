name: e_scenarioEffectDecrementCounter
address: '0x08142184'
kind: function
status: probable
summary: Decrements by one the counter byte at offset 0x0E of the scenario-effect state structure when
  an overworld event finishes.
interface: (no args used) -> r0 = decremented value; no flags returned (popped with pc)
details: Loads the pointer to eScenarioEffectState2000780, reads byte 200078E (offset 0x0E of the scenario-effect
  state), subtracts 1, and stores it back. It is a one-byte decrement of a counter/timer field inside
  that struct, called from ow_objectFinishEventAndFree as an overworld map object's event ends. The other
  fields of the struct are untouched here, and no other callees or consumers of the decremented value
  are visible, so what the counter counts (steps, frames, remaining triggers) is unknown. Only the decrement
  side is shown; a reader/consumer of byte 200078E would confirm the field's meaning.
