name: chatbox_scriptWaitPlayerFrameStep_8041F1C
address: '0x08041F1C'
kind: function
status: confirmed
summary: Text-script opcode that waits until the player's overworld sprite animation step finishes before advancing
  the script cursor.
interface: int chatbox_waitPlayerFrameStep(int* scriptCursor /*r4*/); returns 1 to advance, 0 to retry; sets NZ
  from result, C/V from the cursor += 2 add on the advance path
details: 'Script command handler for the chatbox/text engine. First it calls chatbox_setflags_3e with mask FLAGS_3E
  bit 1 (0x0001), marking the chatbox as "waiting" so the script stalls on this word. It then loads the toolkit''s
  game state (r10 + oToolkit_GameStatePtr), fetches the overworld player object (oGameState_OverworldPlayerObjectPtr)
  into r5, and calls sprite_getFrameParameters on it. Bit 0x80 of the returned frame parameters indicates the current
  frame-sequence step has completed. While the bit is clear it returns 0 (NZ cleared) and the caller re-executes
  this word; once set it advances the script cursor r4 by 2 (one script word) and returns 1, with C/V set from that
  addition. r5 is preserved across the call (saved and restored around sprite_getFrameParameters); r1 is left holding
  frameParams & 0x80 as a side effect.

  '
