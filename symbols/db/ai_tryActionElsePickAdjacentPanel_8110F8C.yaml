name: ai_tryActionElsePickAdjacentPanel_8110F8C
address: '0x08110F8C'
kind: function
status: confirmed
summary: AI update step that tries one behavior first and, if it did nothing, falls back to picking an adjacent
  neighbor panel for the object at r5.
interface: void sub_8110F8C(u32 r5 /* object/entity pointer */) -> r0 = success/result flag of whichever callee
  ran last; clobbers r2 r3 lr and flags; preserves r4-r7
details: "Tiny dispatcher, almost certainly an AI-state update step for an enemy/custom\nobject whose pointer lives\
  \ in r5 (the callees also take and update r5).\n\nOrder of operations:\n  1. Call sub_8110FA2(r5). If it returns\
  \ nonzero in r0 (it \"handled\" the\n     update), return immediately with that result in r0/r1.\n  2. Otherwise\
  \ call ai_pickAdjacentNeighborPanel(r5) with the r5 value the\n     first callee left behind (the callees may\
  \ update the object pointer\n     they were given). Its r0/r1 become the function's result.\n\nThe function itself\
  \ sets no return value: r0/r1 are simply whatever the last\ncallee left. The tst/bne and the trailing unconditional\
  \ branch mean both\nexits converge on the same pop, so the branch structure is effectively\n\"run A, else run\
  \ B\".\n\nsub_8110FA2 is not identified yet; only the fallback\n(ai_pickAdjacentNeighborPanel) has a known game\
  \ meaning, hence the\n\"try something, else move to a neighboring panel\" reading. This matches the\ncommon BN6\
  \ enemy-AI pattern of attempting an attack/special action each\nturn and falling back to repositioning.\n"
