name: sub_800B8C2
address: '0x0800B8C2'
kind: function
status: hypothesis
summary: Looks up some per-slot/state structure for the given index and returns whether its first byte equals that
  index.
interface: 'int sub_800B8C2(u32 slot); // in: r0=slot/index; out: r0=1 if *ptr==slot else 0, r2=slot (copy of the
  argument); clobbers r1, flags'
details: 'Saves r0 on the stack, calls sub_800BF5C(r0) (which returns a pointer in r0),

  then pops the saved argument into r2 and loads the byte at the returned pointer

  (ldrb r1, [r0]). Returns 1 in r0 if that byte equals the original slot argument,

  otherwise 0. The pop-into-r2 is not just spill cleanup: r2 is live on return and

  holds the original argument, so at least one caller apparently relies on getting

  the slot back in r2 alongside the boolean. The byte compared is the first field

  of whatever structure sub_800BF5C indexes, and the comparison against the index

  itself suggests the byte is a back-reference/id field or a "slot contents match

  requested slot" check. Without knowing what sub_800BF5C resolves (task, NPC,

  battle object, chatbox slot, ...), no game-level meaning can be pinned down.

  '
