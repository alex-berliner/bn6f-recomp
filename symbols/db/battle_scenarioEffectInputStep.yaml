name: battle_scenarioEffectInputStep
address: '0x080896D4'
kind: function
status: probable
summary: 'State-machine step for the scenario effect screen: polls the chip-select input handler and either
  starts the camera script or advances the state byte to 0x10/0x18 depending on which button was pressed.'
interface: (no args; r5 = caller-set pointer to a state/state-machine byte) -> r0 = 1 always; no flags
  used by caller
details: Calls battleObject_scenarioEffectInputHandler_8089704, which maps A/B/L/R joypad input over the
  active scenario-effect slot, and dispatches on its return code. Code 1 leads to cutscene_startCameraScript
  (advancing to the scripted camera part). Code 2 writes 0x10 into the byte at [r5], and any other nonzero
  code runs sub_8089CDC then sub_80468EC(1) and writes 0x18 to [r5], i.e. distinct follow-up states. Code
  0 (no input) does nothing. It always returns 1, typical of a 'still running / handled' step result in
  this state-machine style. r4-r7 are saved but r5 is only read here, so the caller must have loaded the
  context pointer before calling.
