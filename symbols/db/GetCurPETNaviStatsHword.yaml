name: GetCurPETNaviStatsHword
address: '0x080137FE'
kind: function
status: confirmed
summary: Reads one u16 stat field of the navi currently selected on the PET from the toolkit's navi stats table.
interface: u16 GetCurPETNaviStatsHword(u8 which_navi, u8 which_stat); also sets r3 = address read from, c/v from
  the base+offset addition, and nz from the load
details: 'Computes the navi''s stats-slot index via GetNaviStatsIndexGivenCurPETNavi(which_navi)

  (r0 = 100*index after the call — the helper returns the index and this function

  multiplies it by oNaviStats_Size via mov r3,#size / mul). Base pointer is read from

  R10 + oToolkit_NaviStatsPtr (the toolkit''s navi stats array), the halfword at

  base + index*oNaviStats_Size + which_stat is loaded into r0, and r3 is left holding

  the slot''s base address (not the exact address of the field read). r1 (which_stat) is

  saved/restored across the helper call. Flags are set from the ADDS that forms the

  slot base address (c/v), and nz from the final LDRH value. which_stat is a byte offset

  into the NaviStats struct, so callers index fields like HP, attack, etc. by raw offset.

  '
