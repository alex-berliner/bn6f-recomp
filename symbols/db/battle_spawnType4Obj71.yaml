name: battle_spawnType4Obj71
address: '0x080E5B62'
kind: function
status: probable
summary: Thin wrapper that spawns battle object type 4 with fixed object id 0x47 and returns its r5 input
  unchanged.
interface: (r1-r3 + stack = remaining spawn args, r5 = passthrough value) -> spawns object type 4, id
  0x47; returns r0 = incoming r5, flags clobbered by callee
details: The function pushes r5/lr, loads r0 with the constant 0x47, calls object_spawnType4, then copies
  r5 back into r0 and returns. It contributes no arguments of its own beyond the fixed id 0x47, so the
  other four spawn parameters (type, x, y, etc.) must come from the caller's r1-r3/stack state. It never
  modifies r5, so the return value is just the caller's r5 passed through, suggesting the spawn result
  in r0 is intentionally discarded. With only a hardcoded id and no other logic, it is a one-object spawn
  stub for a specific battle effect/entity (id 0x47 = 71).
