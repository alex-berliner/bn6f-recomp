name: owPlayer_809E0C8
address: '0x0809E0C8'
kind: function
status: confirmed
summary: Syncs the overworld player's X/Y/Z position (always) and facing direction (only before event flag 0x1719
  is set) into the shared state struct at 0x200ACE0.
interface: 'void owPlayer_809E0C8(struct oToolkit *toolkit /* r10 */);

  clobbers: r0, r1, r2, r3, lr; flags N Z C V

  '
details: 'Walks toolkit → gameState → overworld player object and mirrors its X/Y/Z

  coordinates into the eStruct200ace0 shared struct fields oS200ace0_PlayerX/Y/Z.

  Then, when event flag 0x1719 ("EVENT_1719") is still clear (first-pass

  guard), it also stores the player''s facing direction (low 3 bits of

  oOWPlayerObject_FacingDirection) into

  oS200ace0_owPlayerFixedAnimationSelect_02 — i.e. it pins the "fixed"

  overworld-player animation slot to the player''s current facing. Once

  event 0x1719 is set, the facing-direction write is skipped, so the

  previously chosen animation selection stays in place. Calls

  TestEventFlagFromImmediate via a flag-page helper.

  '
