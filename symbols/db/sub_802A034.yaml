name: sub_802A034
address: '0x0802A034'
kind: function
status: hypothesis
summary: Trivial getter that always returns the fixed constant 0x13F (319).
interface: 'u32 sub_802A034(void); // in: lr only; out: r0 = 0x13F; all other registers preserved'
details: 'Pushes r1-r7 and lr (so every low register is saved), loads a single literal pool word 0x13F (=319) into
  r0, pops r1-r7 and pc to return. Nothing else is read or written; it touches no memory besides its own literal
  pool. The value 0x13F is likely a table size or limit constant (319 entries) shared by callers, but the code alone
  gives no clue what it counts. Callers are analyzed as reading r0 and treating r5/r6 as outputs, but since r5/r6
  are saved and restored, those are just values passed through unchanged.

  '
