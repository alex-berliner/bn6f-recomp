name: object_findPlacementPanelAhead
address: '0x080BE434'
kind: function
status: probable
summary: Scans forward from a battle object's panel to find an alliance-flagged anchor panel, then validates
  the panel one step past it as a landing/placement spot, falling back to a fixed column (6 or 1) at the
  object's row.
interface: (implicit r5 = battle object; no args) -> r0,r1 = target panel x,y; r2,r3 = matched anchor
  panel x,y; 0,0/0,0 on total failure
details: Reads oBattleObject_PanelY, oBattleObject_PanelX and oBattleObject_Alliance from the global object
  in r5, and gets a +1/-1 step via object_getFrontDirection. It walks x by that step, calling object_getPanelParameters,
  stopping at the first panel whose status word matches a per-alliance mask from off_80BE4C8 (0x4000000
  for alliance 0, 0x8000000 for alliance 1), or resetting to (0,0) if it runs off the field. It then proposes
  the panel one step past the anchor and validates it (and conceptually the anchor row) with object_checkPanelParameters
  using r2=0x10 and mask 0xF800000 (panel status bits 19-23). If that validation fails, it retries the
  same validation at a fixed column (6 when facing +, 1 when facing -) at the object's original y, and
  finally falls back to (0,0). The four return registers hand both the anchor panel and the chosen target
  to the caller, which likely spawns/moves something there.
