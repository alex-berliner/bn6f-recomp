open_questions:
- Exact meaning of panel flag bits 0x4000000/0x8000000 (per-side occupancy vs. terrain) and of the 0xF800000
  / 0x10 check semantics in object_checkPanelParameters
- Which gameplay feature calls this (via sub_80BDBC8) — e.g. a teleporting/digging object or an attack
  that spawns behind an obstacle — needs caller-side analysis to confirm the name and the 6/1 fallback
  column semantics
- 'The flow matches: scans forward using object_getFrontDirection (line ~str r0,[sp]) stepping x until
  object_getPanelParameters returns a panel whose flags AND the per-alliance mask (0x4000000/0x8000000
  from off_80BE4C8) is nonzero, then proposes target = anchor_x + 2*step, y = anchor_y, validating with
  checkPanelParameters(r2=0x10, mask=0xF800000). If that fails, it falls back to column 6/1 at original
  y (mov r0,#6 / mov r0,#1), then (0,0). The proposal correctly describes this. However, naming ''battle_findLandingPanelAhead''
  is acceptable but ''object'' prefix fits since it operates on a battle object via r5.'
