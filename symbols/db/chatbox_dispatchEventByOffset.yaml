name: chatbox_dispatchEventByOffset
address: '0x0812AE3C'
kind: function
status: probable
summary: Tests eFlags2009F38 bits 0x80 then 0x8; if neither is set, or if the offset byte of the 0x200BC30
  record is 0, calls sub_8132614 to advance the menu-choice handler; otherwise writes 8/0 into r5+2/r5+3
  and triggers SetScreenFade(0xC, 0x10).
interface: (r4/r5 = state record pointer) -> r0 = 0 or sub_8132614/SetScreenFade result; writes r5+2,
  r5+3 when fading
details: First tests event flag bit 0x80 then bit 0x8 of eFlags2009F38 via chatbox_mask_eFlags2009F38;
  if either is set it reads the first byte of the EWRAM record at 0x200BC30 (eStruct200BC30_getJumpOffset00).
  If that byte is 0, it stores 8 to [r5,#2] and 0 to [r5,#3] — advancing a state/handler index in the
  record r5 points to — and calls SetScreenFade(0xC, 0x10), a fade-out transition to the next scene. If
  the offset byte is nonzero (or neither flag is set), it instead calls sub_8132614, which dispatches
  on the player's menu choice in sub_8132290 and writes the next handler index into the menu record. No
  callers are known, so whether r5 is the 0x200BC30 record or a related event struct is inferred from
  the parallel field writes.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: two chatbox_mask_eFlags2009F38 calls with 0x80 then 0x8 branch the whole function (loc_812AE4E
    reached when either is set); eStruct200BC30_getJumpOffset00 returning 0 selects the fade path; nonzero
    falls to bl sub_8132614; strb r0,[r5,#2]/strb r0,[r5,#3] with 8 and 0 followed by SetScreenFade(0xC,0x10)
    is the fade-and-advance-state path; callee sub_8132614's known summary (menu choice dispatch, writes
    next handler index) matches the alternative path
  refs:
