  reproduce: python3 tools/asmcat.py 0x0812AE3C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal correctly identifies the flag tests, offset-byte check, fade trigger, and fallback
    dispatch to sub_8132614. However the branch targets are swapped in the summary: when the offset is
    nonzero the code falls through to strb/SetScreenFade (loc_812AE50..loc_812AE64), and when it is zero
    (beq loc_812AE68) it calls sub_8132614. The summary says the opposite — it says ''If that byte is
    0, it stores 8/0 and calls SetScreenFade'' and ''If the offset byte is nonzero it calls sub_8132614'',
    which is inverted. A revised name should drop the ''step'' verb and the speculative ''OrFade'' tail
    since the code clearly has two distinct branches; the meaningful prefix here is ''chatbox'' and it
    dispatches based on a jump-offset byte of an event/cutscene record.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
