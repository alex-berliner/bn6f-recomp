name: battle_SetStateUnk5c_80013A2
address: '0x080013A2'
kind: function
status: confirmed
summary: Stores a caller-supplied word into the current battle state's field at offset 0x5c and hands back the battle
  state pointer.
interface: 'void battle_SetStateUnk5c(u32 value); /* in: r0=value, r10=toolkit; out: r1=battle state ptr */'
details: 'Reads the toolkit''s battle-state pointer (oToolkit_BattleStatePtr at r10+off), writes r0 into the battle
  state struct at oBattleState_Unk_5c (offset 0x5c), and returns that battle state pointer in r1 (an artifact of
  using r1 as the load scratch register — callers may or may not consume it). No other registers or flags are touched.
  The field''s game meaning is unknown; it is a plain 32-bit store with no validation, so value semantics (counter,
  timer, flag word, pointer) are undetermined.

  '
