name: get_groundmanMinigameSkipCondition
address: '0x081440AE'
kind: function
status: probable
summary: 'Boolean gate for the Groundman minigame: returns 1 (skip/do nothing) once a PET-menu flag or
  event flag is set or the player isn''t on a minigame map, else 0.'
interface: () -> r0 = 1 if any completion/skip condition holds (PET menu flag set, map index 0xFF, event
  flag set), else r0 = 0
details: First tests a bit in the PET menu flags byte via TestPETMenuDataFlag; if set it returns 1 immediately.
  Otherwise it calls GetGroundmanMinigameMapIndex and returns 1 if the index is 0xFF (player not on one
  of the minigame maps). It then calls sub_8143C18 (purpose unknown, takes no visible args) and tests
  an event flag whose id likely comes from that call; a set flag also yields 1. Only when all three checks
  fail does it return 0, so the caller treats 0 as 'the minigame interaction should still happen'. The
  .word eStruct2001010 after the function is just the next data pool entry, not read by this code.
