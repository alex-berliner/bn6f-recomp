name: battle_loadObjTableEntryAndSetState4_80272B8
address: '0x080272B8'
kind: function
status: confirmed
summary: Loads a word from a lookup table (indexed by the object's +0xC id) into the object's +0x40 field and switches
  the object to state 4.
interface: void battle_loadObjTableEntryAndSetState4(Obj* r5); // writes obj->field40 (u32) and obj->state2 (u16=4);
  returns r0=4, r1=table base; nz/c set by "mov r0,#4" and the shifted-out bit of (r5+0xC)<<2 (never set for byte
  values)
details: 'Treats r5 as a pointer to a battle/engine object structure. Reads the byte

  at +0xC (an id/type/state selector), multiplies it by 4, and indexes the

  word table whose base is off_8027BEC. The selected 32-bit entry is stored

  to the object''s field at +0x40 (likely a behavior/AI pointer or per-id data

  pointer used later by the object''s update code). Finally stores halfword 4

  into the object''s +0x2 field, which by BN6 object conventions is the

  state/step counter, effectively advancing the object to its next phase.

  Trashes lr (uses it as the return address via pop {pc}); r5 is the only

  real input. The ldrb/lsl#2 means indices above 63 would read past the

  table; carry out of the shift is architecturally impossible for a byte

  value but the contract records it for exactness.

  '
