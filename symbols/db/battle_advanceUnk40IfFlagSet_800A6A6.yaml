name: battle_advanceUnk40IfFlagSet_800A6A6
address: '0x0800A6A6'
kind: function
previous_names:
- sub_800A6A6
status: probable
summary: Each frame, if battle isn't paused/over/time-stopped and `oBattleState_Unk_32` bit 0 is set,
  increment `oBattleState_Unk_40` (clamped to 0x8c9f).
interface: (no args; r10 = Toolkit ptr) -> r0/r1/r2/r3 clobbered as temporaries, no meaningful return
details: "- Saves lr, calls battle_isTimeStop/jumps to epilogue if non-zero (battle-time-stopped frames\
  \ don't tick the counter).\n  - Calls battle_isPaused and battle_isBattleOver, bailing on either (so\
  \ paused/over battles also don't tick).\n  - Calls battle_getFlags (returns the halfword at oBattleState_Unk_32),\
  \ tests bit 0 (`tst r0, #1`); if cleared, bails.\n  - Loads the BattleStatePtr via the toolkit (`ldr\
  \ r0, [r10, #oToolkit_BattleStatePtr]`), then loads the u32 at offset `oBattleState_Unk_40`, increments\
  \ it, compares to constant `0x8c9f` (loaded from `dword_800A93C`); if it reaches/exceeds the cap, replaces\
  \ with `0x8c9f`; otherwise stores the incremented value.\n  - Str r1, [r0, #oBattleState_Unk_40] then\
  \ pop {pc}. No caller-readable result.\n  - The four sibling callers (sub_80080D2/855E/89CC/8DDC) all\
  \ look like per-frame battle subsystems; this is one of the per-frame tickers that gates on a specific\
  \ battle-state bit.\n"
