open_questions:
- The semantic meaning of `oBattleState_Unk_40` and of flag bit 0 at `oBattleState_Unk_32` — both are
  unnamed in the headers. The structural role (per-frame increment, capped at 0x8c9f, gated on Unk_32
  bit 0) is clear, but the in-game purpose (counter for turns? panel turns? time-limit for a mode?) cannot
  be derived from this function alone — comparing against a sibling function that resets it on match end
  would settle it.
