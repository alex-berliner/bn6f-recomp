name: ai_commitStepMove
address: '0x08109D70'
kind: function
status: probable
summary: 'AI attack helper: on a 3-frame step timer, commits an object''s staged future panel position
  as its real one and refreshes panel state and collision.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 8 (HitElement value written); no meaningful
  return
details: 'Each call decrements oAIAttackVars_StepTimer; when it reaches zero the staged oBattleObject_FuturePanelX/Y
  are copied into oBattleObject_PanelX/Y, the panel reserve held by the object is released (object_removePanelReserve),
  pixel coordinates are recomputed from the new panels (object_setCoordinatesFromPanels), and the collision
  record plus facing are synced (object_updateCollisionPanels). The timer is then reloaded with 3 so the
  move commits every 3rd frame, and oAIAttackVars_HitElement is set to 8, presumably the element/damage
  type applied when this step attack lands. Runs inside AI attack routines during battles. Quirk: HitElement
  is written after the commit, so it likely parameterizes the next commit rather than the one just performed.'
