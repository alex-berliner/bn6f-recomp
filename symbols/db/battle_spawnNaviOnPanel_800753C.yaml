name: battle_spawnNaviOnPanel_800753C
address: '0x0800753C'
kind: function
status: confirmed
summary: Spawns and fully initialises a Navi battle object at a given panel, derives its NameID from alliance
  stats, allocates AI data, and registers it in the alliance entry list.
interface: 'battle_spawnNaviOnPanel_800753C(r0: u8 panel_x, r1: u8 panel_y, r2: bool alliance) -> void;
  clobbers r0 r1 r2 r3 r10 lr, preserves r4 r5 r6 r7, sets nzcv flags'
details: 'Calls object_spawnType1 with obj_idx=0 to request a free battle-object slot. Stamps PanelX/PanelY
  (and the Future* mirror) and Alliance onto the new BattleObject. Converts panel indices to pixel coordinates
  via object_getCoordinatesForPanels and writes X/Y/Z fields. Sets the OBJECT_FLAG_PAUSE_UPDATE bit so
  the object does not tick until fully ready. Allocates AI data with object_createAIData; on failure the
  slot is freed via object_freeMemory and the function returns. AI data word-0 is written as 2 (standard
  Navi behaviour). The NameID is derived by reading GetBattleNaviStatsByte(alliance, 0x29), then computing
  (val+0xFF+0xA1)&0xFFFF; for the normal player alliance (0) this yields 0x1A0 (MegaMan). If modifyBattleStateBasedOnAliveBattleActorsAndUnkCond_8007778
  returns 0 (no living actors under a special condition) the AI data is torn down and the slot freed but
  execution continues. Populates AI fields from GetVerActorTyAndAIIdx_80182B4 (version at ai+0x16/0x17,
  actor_type at ai+0, ai_index at ai+1) and from enemy_getStruct1 (category byte at ai+3). Writes 0xFF
  to ai+0xE (slot-assignment sentinel). Finally calls battle_addObjectToAllianceEntryList_80077D2 to insert
  the object into the correct alliance''s entry list. r5 (object ptr) and r4 (AI ptr) are kept across
  calls via push {r4,r5,lr}.

  '
