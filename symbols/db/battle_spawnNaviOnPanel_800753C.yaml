open_questions:
- What exactly does stat index 0x29 represent in GetBattleNaviStatsByte, and does it differ per version?
- The +0xFF/+0xA1 arithmetic maps raw stat to NameID; confirm the full range of values and which Navis
  beyond MegaMan (0x1A0) it covers.
- What is the 'special condition' checked by modifyBattleStateBasedOnAliveBattleActorsAndUnkCond_8007778
  that can cause early teardown?
- sub_800ED80 tears down AI data; what resources does it release beyond the allocation from object_createAIData?
- ai+0x16 and ai+0x17 both receive the same version byte; is one used for current frame and the other
  for next frame, or is this redundant?
