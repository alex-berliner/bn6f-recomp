name: sub_80FFAC4
address: '0x080FFAC4'
kind: function
status: hypothesis
summary: Passes a packed list of four event/flag IDs (0x12, 0x18, 0x1E, 0x24) to the flag-check helper sub_800FE28
  and returns its result.
interface: 'u32 checkEventFlagList_80FFAC4(u32 r5) // in: r5 (argument forwarded to sub_800FE28), lr; out: r0 =
  result of sub_800FE28; clobbers r1, r2, flags'
details: Thin wrapper. It loads the address of dword_80FFAD4, a 4-byte constant containing the packed value "0x12181E24"
  (four bytes 0x12, 0x18, 0x1E, 0x24, which look like event/flag or scenario-step IDs), puts that pointer in r0,
  forwards the caller's r5 unchanged, and tail-calls sub_800FE28, returning that call's r0 (r2 is also produced
  by the callee but discarded here). sub_800FE28 is presumably the generic "check a list of flags" routine used
  by scene/script code; this instance is a hardcoded flag-list check specific to one scene or trigger. No state
  is modified in this function itself.
