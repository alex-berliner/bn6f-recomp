name: battle_calcPredecessorSlotBonus_810F040
address: '0x0810F040'
kind: function
status: confirmed
summary: Snapshots the object's HP, then counts allied battle-slot entries of kinds 0x4F–0x54 that precede
  this object in list order, storing a 0x14-per-count bonus into the object's field at offset 0x6C.
interface: battle_calcPredecessorSlotBonus_810F040(r5 = BattleObject*, r10 = Toolkit*) -> r0=bonus, r1=0x6C,
  r3=count, nzcv set; preserves r4-r7,r5
details: '1. Reads the object''s 16-bit HP (oBattleObject_HP) and stores it as a 32-bit snapshot in oBattleObject_ExtraVars+8.
  2. Determines the object''s alliance (oBattleObject_Alliance), uses it as an index into a two-entry
  table (0x80 for alliance 0, 0x90 for alliance 1) to locate a 4-slot pointer array inside the BattleState
  (resolved via oToolkit_BattleStatePtr). 3. Iterates the 4 slot pointers; for each non-null entry reads
  kind at offset 0x28 (u16) and entry-index at offset 3 (u8). If kind is in [0x4F,0x54] AND entry-index
  < this object''s oObjectHeader_ListIndex (signed compare), increments a counter. 4. Multiplies the count
  by 0x14 (20) and writes the result as a 16-bit value into oBattleObject field 0x6C. The kinds 0x4F–0x54
  likely correspond to a contiguous block of battle-entity types (possibly NPC allies or custom objects).
  The bonus at 0x6C may feed a damage or effect calculation elsewhere.

  '
