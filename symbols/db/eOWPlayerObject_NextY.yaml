name: eOWPlayerObject_NextY
address: '0x02009F6C'
kind: ram
previous_names: []
status: probable
summary: 'MegaMan''s overworld Y at the start of the current move (eOWPlayerObject +0x2C, s16.16): copied from Y
  before each frame''s movement, put back into Y when the move is cancelled; despite the name, his previous Y, not
  a target.'
details: 'Field NextY of overworld_player_object_struct (include/structs/OverworldPlayerObject.inc:33, loc 0x2C)
  in

  eOWPlayerObject = 0x02009F40. Handled together with NextX at every site (bn6f/asm/ow_player.s): copied from Y

  at the start of owPlayer_update_809D348 (277), in sub_809D270 (235) and ow_player_updateCollisionAndPos_809D800

  (915) and by owPlayer_copyCoordsToNextCoords..._809e188/_809e1d8 (2296, 2368); copied back into Y on a frame

  without a move (609, 783); compared with Y by owPlayer_isMoving_809DFA0 (1929); clampPlayerPosition_809E3D6

  restores Y from it when it clamps X (2817-2818, 2826-2827); the collision sweep owObject_lineDraw_8030CAC starts

  at its pixel halfword (oOWObjectCoords_NextY, asm03_0.s:23404). See eOWPlayerObject_NextX for the reading and

  for vidsync''s differing "walk target" description.

  vidsync (level R): try_relocate writes NextY = Y along with X/Y/NextX when it moves MegaMan; segment junctions

  restore it in the 0x30 bytes from +0x1C.

  '
