name: ai_8113038
address: '0x08113038'
kind: function
status: confirmed
summary: 'Advances a battle object''s attack state one frame: kicks off the attack anim/duration on the first tick,
  clears the current anim when its frame parameters show the end marker, and calls object_exitAttackState once the
  per-attack countdown reaches zero.'
interface: void ai_stepAttackState_8113038(u32 r5 /* battle object */, u32 r6 /* unused */, u32 r7 /* its AIAttackVars
  */, u32 r1_in) -> r1; clobbers r0,r2,r3,r6,r7,lr,flags NZCV; preserves r4.
details: 'Operates on the AIAttackVars block attached to a battle object (r7) alongside the object itself (r5).
  First-frame init writes 1 into oAIAttackVars_Unk_01, sets oBattleObject_CurAnim to 3, and copies the duration
  from oAIAttackVars_Unk_18 into the running countdown at oAIAttackVars_Unk_10. Each call, if oBattleObject_CurAnim
  is non-zero it queries sprite_getFrameParameters; when that returns with bit 0x80 set the animation is finished
  and the function clears oBattleObject_CurAnim to 0. The countdown at oAIAttackVars_Unk_10 is then decremented
  and, when it goes <= 0, object_exitAttackState is invoked (called with the just-decremented frames value, and
  the 0x80 mask that this function kept in r1). The value returned to the caller in r1 is essentially the 0x80 end-marker
  mask once the anim check has run, or whatever object_exitAttackState produced on the final tick.

  '
