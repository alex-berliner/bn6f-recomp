name: battleObject_chipSelectOverlayTick
address: '0x08026D06'
kind: function
status: probable
summary: Per-frame state machine (states 0/1/2) for the chip-select object that opens a 15x20 tile overlay
  in tile block 3, holds while polling joypad/L+R swap, then closes by restoring background tiles and
  finalizing the parent state.
interface: '(self: *S20364C0 in r5, toolkit in r10) -> void; advances self+0x02 substate (0=enter, 1=wait,
  2=close) and writes self+0x01=4 on close; preserves r4-r5'
details: 'A three-state machine keyed on the byte at self+0x02. On entry it writes the render-info halfword
  at +0x18 = 0x78, sets the Navi status GFX index to 0 via battle_setNaviStatusGfx, dispatches event 0x2000
  through dispatch_801DACC, draws a 15x20 block of tiles into tile block 3 via the call_sub_3005EBA wrapper,
  and plays the cursor-move sound. In the wait state it polls the joypad: any pressed key, or a non-0xFF
  result from battleObject_computePuppeteerSwitchElement (L+R element-swap check), advances to close.
  The close state restores GFX index 0x78, copies the background tiles back from unk_2035000 with CopyBackgroundTiles,
  runs battleObject_chipSelectAnimTick, plays the cursor sound, dispatches 0x2000 via dispatch_801DA48,
  and finally sets the parent state byte self+0x01 to 4 and clears the substate.'
