open_questions:
- What overlay/menu exactly this represents (the semantic meaning of the 0x2000 dispatch and the 0x78
  GFX index is unconfirmed)
- What unk_2035000 contains (default battle background tile map vs. a specific overlay tilemap)
- No callers known, so the parent state machine that invokes it with self in r5 is unidentified
- The summary conflates the 'close transition' code at loc_8026D5C with the 'finalize' block at loc_8026D9A.
  State 0 dispatches via dispatch_801DACC, while the close path dispatches via dispatch_801DA48 only conditionally
  on BattleStatePtr[7]==1 (lines dispatching 0x2000). CopyBackgroundTiles, battle_setNaviStatusGfx(0x78),
  and battleObject_chipSelectAnimTick all run in the state-1→2 transition, not the loc_8026D9A block.
  The name is acceptable.
