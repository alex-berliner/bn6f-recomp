name: get_sChipEntryAt
address: '0x08137890'
kind: function
status: probable
summary: Returns the address of the 0x3C-byte chip entry at index r0 in the toolkit's S_Chip array.
interface: (r0 = chip entry index) -> r0 = pointer to that 60-byte chip entry in (*toolkit->oToolkit_S_Chip_2002178_Ptr);
  no flags matter
details: Computes r0*0x3C, reads the base pointer from the toolkit field oToolkit_S_Chip_2002178_Ptr,
  and returns base + offset, i.e. an in-place accessor for a fixed 60-byte chip record (a folder/pack
  slot entry). It performs no bounds checking, so callers supply valid indices. No other registers are
  touched besides r0-r3 and lr.
