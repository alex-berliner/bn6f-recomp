name: sprite_loadAnimationData_spritePtrProvidedDirectly
address: '0x080026B6'
kind: function
status: confirmed
summary: Tiny trampoline that tail-calls _sprite_loadAnimationData while preserving the caller's r4 around the branch.
interface: 'sprite_loadAnimationData_trampoline_r4Preserved(void); // in: r4, r5, lr; out: r2, r3, r4, lr (NZCV
  clobbered, r4 preserved)'
details: 'Wrapper with no logic of its own: it pushes r4/lr, loads the address of _sprite_loadAnimationData+1 from
  a nearby literal pool (off_80026C0), moves the caller''s lr into pc and branches to the callee with r4/r5 passed
  through untouched. The callee''s results come back in r2/r3 and r4 is popped restored before returning to the
  original caller. It exists purely so that r4 survives the call for callers that keep a live value (e.g. a sprite
  struct pointer) in r4 across the loadAnimationData call. All real work (parsing the sprite''s animation table
  into r2/r3) happens in _sprite_loadAnimationData; nothing here touches game state directly.

  '
