kind: function
status: confirmed
summary: Initializes a battle work structure (clears byte at +8, writes 0x24 marker at +1) before handing it to
  battle_moduleInit_803A820 to fill in.
interface: 'void battle_workInit_80498D4(u32 r5 /* work struct */); out: r3, r8-r12, C, V (preserved by caller convention:
  r4-r7, r12; clobbered: r0-r2, lr, N, Z)'
details: 'Takes a battle work structure pointer in r5 (r10 also passed through unchanged). Clears the state/flags
  byte at offset +8 and writes the init-marker byte 0x24 at offset +1, then tail-calls battle_moduleInit_803A820
  with the same pointer. The function is a thin reset wrapper: battle_moduleInit_803A820 is responsible for filling
  in the rest of the structure and its returned register state (r3, r8-r12, C, V) is propagated directly to the
  caller.'
