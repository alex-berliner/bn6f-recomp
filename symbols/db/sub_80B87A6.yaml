name: sub_80B87A6
address: '0x080B87A6'
kind: function
status: hypothesis
summary: Writes the constant 8 into offset +0x8 of the object/struct passed in r0 (a state or ID field reset to
  8).
interface: void sub_80B87A6(u32 *obj) /* r0 = object pointer; returns value 8 in r1; sets N/Z flags from 8 */
details: 'Three-instruction setter: stores the immediate value 8 at [r0,#0x8] of the structure addressed by r0,
  leaves that same value in r1, and returns via mov pc, lr without touching any other registers. Because the value
  8 ends up in r1 and the N/Z flags are set from it, callers can branch on the stored value immediately after the
  call. The structure and the meaning of the +0x8 field are not identifiable from the function body alone; it is
  presumably a state/mode/ID field of an engine object (sprite, NPC, or battle entity) that callers initialize or
  reset to 8. No other fields, globals, or flags are read or written.

  '
