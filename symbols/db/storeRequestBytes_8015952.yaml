name: storeRequestBytes_8015952
address: '0x08015952'
kind: function
status: confirmed
summary: Writes three argument bytes into the work buffer at byte_203CED0 (offsets 0, 1 and 3) as some
  kind of request/parameter record.
interface: void storeRequestBytes_8015952(u8 a, u8 b, u8 c)  // r0, r1, r2 in; nothing returned
details: 'Trivial setter: pushes r4/lr, loads the pointer byte_203CED0 (0x0203CED0) from off_8015B38,

  then stores r0 at +0, r1 at +1, and r2 at +3 of that buffer. The byte at offset 2

  (0x0203CED2) is deliberately left untouched, so the buffer is a small struct with a gap

  at offset 2 (or offset 2 belongs to a different subsystem and this routine only fills

  three of its fields). No other memory is touched, no flags are meaningful on return,

  and r4 is preserved. The buffer at 0x0203CED0 is presumably a shared "pending request"

  or parameter block that other code reads back later; without caller analysis the actual

  game meaning (menu request, network/trade request, battle setup, etc.) is unknown.

  '
