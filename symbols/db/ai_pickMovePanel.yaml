name: ai_pickMovePanel
address: '0x08103320'
kind: function
status: probable
summary: 'AI attack-state step: checks object_canMove, calls a per-alliance PanelChooseCallback (via bx)
  to obtain X/Y, reserves the panel, sets CANNOT_SLIDE flag, CurAnim=4, StepTimer=3, HasMoved=1, HitElement=4;
  returns r0=4 on success or r0=0 on failure.'
interface: (r0 = battle object, r5 = same object's battle struct?, r7 = oAIAttackVars) -> r0 = 1 if a
  panel was claimed, else 0; also writes HasMoved into r7 state
details: Runs as a step of the AI attack state machine. If object_canMove says the object is blocked,
  it clears oAIAttackVars_HasMoved and calls object_exitAttackState. Otherwise it indexes byte_8103370
  with Alliances*8 and passes the two table words plus the target object pointer to the callback in oAIAttackVars_PanelChooseCallback
  (called via blx-style mov lr,pc/bx), which returns r0 = panel X (0 = failure) and r1 = panel Y. On success
  it stores FuturePanelX/FuturePanelY in the battle object, reserves the panel with object_reservePanel,
  sets OBJECT_FLAGS_CANNOT_SLIDE, sets CurAnim = 4 and StepTimer = 3, marks HasMoved = 1 and writes 4
  into oAIAttackVars_HitElement. The table has two 8-byte entries (for alliances 0 and 1), differing only
  in the first word (0x10 vs 0x30), the second word (0xA0 vs 0x80) both sharing high half 0x0F88.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove + beq loc_8103360: blocked objects just clear HasMoved and exit the attack
    state; ldr r1, off_810336C table indexed by Alliances<<3, two words passed in r2/r3 to oAIAttackVars_PanelChooseCallback
    called with TargetObjectPtr; strb r0/r1 to oBattleObject_FuturePanelX/Y after callback''s r0 nonzero
    test: callback returns chosen panel coords; bl object_reservePanel then object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE):
    claims the panel and pins the object to it; CurAnim=4, StepTimer=3, HasMoved=1, HitElement=4 written
    into oAIAttackVars on success, mirroring other AI move steps'
  refs:
  - bn6f/asm/asm31.s:159033
  - 0x0800E5E2 object_canMove
  - 0x0801BB1C object_reservePanel
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x08103320
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — Name and summary fit: bl object_canMove → beq exit path, alliance*8 index into byte_8103370, bx
    r1 callback returning r0=X/r1=Y, then object_reservePanel, setFlag1(CANNOT_SLIDE), CurAnim=4, StepTimer=3,
    HasMoved=1, HitElement=4 all match lines. However the interface is wrong on two points: (1) the return
    register on success is r0=4 (leftover from the final mov r0,#4; strh to HitElement before pop {pc}
    at locret_8103368), not 1; (2) the battle object is in r5, not r0—r0 is repurposed as scratch throughout.
    The ''r0 = battle object'' caller convention claim is contradicted by the absence of any r0 parameter
    usage at entry.; run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
