    (overworld per-frame) and `battle_update_8007A44` (battle per-frame) matches a sprite/render pipeline
    request fired every frame. - All 40 captured entries show the same lr=0x080052a7, i.e. one specific
    per-frame dispatcher invoking this helper once per frame, consistent with a "request a render flush
