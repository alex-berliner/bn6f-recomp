summary: Writes 0x1 to the render-flush latch at EWRAM 0x0200F350, signalling that the next render-flush
  pass should execute.
interface: (lr = caller's return address) -> r0 = 0x0200F350, r1 = 0x1 (trashed); no other side effects
details: "The function is a tiny three-instruction helper: load the EWRAM pointer\n  `dword_200F350` (0x0200F350)\
  \ into r0, load the literal 0x1 into r1, then\n  `str r1, [r0]`, which stores 0x1 at 0x0200F350. It\
  \ then returns via\n  `mov pc, lr`. 0x0200F350 is part of the render / sprite state area used by\n \
  \ the engine — comment on `render_info_struct` notes \"look at\n  render_flushDisplayRegisters_800172C\
  \ for how data is transferred\", and\n  `S200F348` is the immediately preceding struct at 0x0200F348,\
  \ so this word\n  almost certainly is the \"Index/control\" tail of that struct (or a sibling\n  sprite-render\
  \ latch at the same address) and the store here requests a\n  flush. Because the address is in EWRAM\
  \ the write persists across frames\n  until cleared by the renderer. The captured calls all show entry\
  \ r0=0x16,\n  r1=0x1, r2=0x03005ffb, r3=any, lr=0x080052a7 — i.e. the same caller in\n  every scenario\
  \ snapshot, repeatedly asking for a flush at every per-frame\n  call site. The \"out\" contract is empty\
  \ of caller-saved regs because r0/r1\n  are clobbered to the loaded constants; callee-saved regs are\
  \ untouched.\n"
