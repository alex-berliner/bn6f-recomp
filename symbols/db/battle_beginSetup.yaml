name: battle_beginSetup
address: '0x0804996A'
kind: function
status: probable
summary: 'Entry into battle setup: if the screen is currently fading, loads battle background/tile data
  and sets a two-byte state (4,0), then kicks off the battle module''s main init.'
interface: (r5 = destination battle-state struct, set by caller; no args in r0-r3) -> r0 = 0 after battle_moduleInit
  call; no meaningful return value
details: First checks IsScreenFadeActive; only when a fade is in progress does it call sub_8049CBC, which
  fills the struct pointed to by r5 with two 0x20-byte chunks and two palette-mapped bytes, then writes
  byte 4 to offset 0 and byte 0 to offset 1 of that struct — an initial state for a battle phase/step
  counter. Unconditionally afterwards it calls battle_moduleInit_803A820, which registers battle entries
  (IDs 10/0x26 and 11/0x27) and starts the main init with argument 0. Since r5 is never set inside this
  function, it must hold a battle-context pointer established by the caller, so the struct it writes is
  a battle-context/state area, not a local. The fade gate suggests this runs at the moment the scene transitions
  into battle (fade-out to the battle screen).
