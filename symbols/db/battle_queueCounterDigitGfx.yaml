    — source value comes from the player battle entity; cmp on entity +0x36/+0x36==0/+0x38 selects between
    tile sets 86E958C (0x80 bytes) and 86E960C (0x60+0x20 bytes) queued to 0x6017680; push {r1} / ...
    / pop {r0}; bl memory_bcdConvert — the pushed entity halfword is the number rendered; and 0xF / lsr
    4 thrice, then three sub_801D61A calls with r1 starting 0x6017720 and +0x20 per digit — draws up to
    3 digit tiles; cmp r4,#0 / bne; then QueueEightWordAlignedGFXTransfer 86A5D60 -> 0x6017760 (0x20)
    — filler tile only when hundreds digit absent
