name: battle_queueCounterDigitGfx
address: '0x0801D590'
kind: function
status: probable
summary: Queues VRAM tile graphics rendering a 3-digit BCD counter from the player's battle entity into
  the battle UI tile area.
interface: (r10 = battle toolkit) -> r0 = clobbered; queues GFX transfers to VRAM 0x6017680-0x6017780
details: Reads the player-side battle entry (0x1D0-stride array via getEntryPtr) and takes halfword at
  +0x36 if nonzero, else +0x38; that value is pushed and later BCD-converted. Depending on which field
  was used, it queues a different tile set to 0x6017680 (0x80 bytes from 86E958C, or 0x60 bytes from 86E960C
  plus a 0x20 tile 86A5D60 at 0x60176E0) and a 0x20-byte tile from 86E966C at 0x6017700. It then extracts
  the hundreds/tens/ones BCD nibbles and calls sub_801D61A (r0 = digit, r1 = dest tile, +0x20 per call)
  starting at 0x6017720, drawing hundreds only when nonzero. If the hundreds digit was zero, a filler/blank-or-zero
  tile (86A5D60) is queued at the remaining third slot 0x6017760. All transfers use QueueEightWordAlignedGFXTransfer,
  so this updates the battle-side UI during the frame-build phase.
