name: battle_spawnRelatedType4Object
address: '0x080E71A0'
kind: function
status: probable
summary: Spawns a type-4 battle object of kind 0x5A via object_spawnType4 and links it to the caller-supplied
  parent (held in r5), copying the parent's alliance/flip into the child.
interface: (r0 = parent battle object (plus spawn params passed through)) -> r0 = spawned oBattleObject
  pointer, or 0 if spawn failed; flags set by null check
details: The routine saves lr, calls object_spawnType4 with one parameter fixed to 0x5A (object kind 90),
  and takes the returned oBattleObject pointer. If the spawn returned NULL it returns immediately. Otherwise
  it stores the caller's object pointer into the new object's oBattleObject_RelatedObject1Ptr and copies
  the 16-bit oBattleObject_AllianceAndDirectionFlip field from the caller's object to the spawned one,
  so the child shares the parent's team and horizontal flip. It effectively creates a type-0x5A battle
  entity that is tethered to and aligned with its spawner.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0, #0x5a; bl object_spawnType4 — hardcodes spawn kind 0x5A through the known type-4 spawner;
    beq locret after the call — bails out when the spawned-object pointer is NULL; str r5, [r0,#oBattleObject_RelatedObject1Ptr]
    — links the spawned object back to the source object; ldrh/strh around oBattleObject_AllianceAndDirectionFlip
    — inherits alliance and direction-flip from the source; callers on recorded battlesweep/beastsp/chips
    routes all need a spawned companion object tied to an existing one'
  refs:
  - bn6f/asm/asm31.s:101694
  - 0x080BA81C sub_80BA81C
  - 0x080FFDAC sub_80FFDAC
  - 0x080033AC object_spawnType4
  reproduce: python3 tools/asmcat.py 0x080E71A0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The spawn type passed to object_spawnType4 is 0x5A (type 4 kind 90, i.e. battle kind 0x5A), but
    r0 at entry is loaded as #0x5a which object_spawnType4 will treat as its type arg, so the caller''s
    r0 is not the parent object. The callee object_spawnType4 expects more than one parameter, yet this
    wrapper only pushes 0x5A; the rest come from spawn-config globals or registers. The result pointer
    r0 is stored as the child''s parent via oBattleObject_RelatedObject1Ptr, but the parent''s pointer
    is actually in r5 (pushed as {r5}), not the caller-provided r0 — the parent is loaded into r0 at locret
    only after the pop. The naming/interface is right conceptually, but the summary says ''r0 = parent''
    which is wrong.; run wf investigate investigate-20261018-203615; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
coverage:
- battlesweep
- beastsp
- chips
