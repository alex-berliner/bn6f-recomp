name: e_setupE5rbSceneAfterFade
address: '0x08131FC4'
kind: function
status: probable
summary: 'Event phase that waits for the screen fade to finish (ZF set), then sets up the E5RB scene:
  initialises camera/screen block, writes tag ''E5RB''/0x2000 into eLinkState, dispatches via sub_81322E8,
  advances state to phase 4, and sets the main jumptable index to 0x28.'
interface: (r5 = event state record) -> r0 = 0; writes state+0x03 = 4, state+0x0C = 0, sets *mainJumptableIndexPtr
  = 0x28
details: 'Gate is IsScreenFadeActive: with ZF set (no fade) it returns immediately, so this phase only
  proceeds once a fade is running. It then calls sub_813D90C(1)/sub_8147F98, initializes a camera/screen
  layout block via sub_803DCE8(0xC,3,2,0), and stores the 4-byte tag ''E5RB'' (0x42523545) plus value
  0x2000 into the global eLinkState via sub_803DCD8, followed by a sub_81322E8 dispatch and a zero-filled
  0x100 work buffer from sub_803EF60. It advances its own state record: byte +0x03 = 4 (next phase), byte
  +0x0C = 0 (phase counter). sub_803CB00(1) re-enables something, initSaveStateBlock(0) zeroes the E-Save
  block (eS200A290) as a checkpoint, and the main jumptable index is set to 0x28 (0x30 from the init call
  is immediately overwritten). No known callers; r5 must be set up by whoever branches here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'beq locret after bl IsScreenFadeActive: whole body only runs while a screen fade is active;
    bl sub_803DCD8 with r0=''E5RB'' (0x42523545), r1=0x2000: writes a tagged link-state configuration
    into eLinkState; strb #4,[r5,#3] / strb #0,[r5,#0xC]: advances the event state record to the next
    phase; bl initSaveStateBlock_8048F9C with r0=0 zeroes the E-Save block before handoff; strb #0x28,[mainJumptableIndexPtr]:
    switches the main loop to jumptable entry 0x28 after setup'
