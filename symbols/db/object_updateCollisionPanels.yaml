name: object_updateCollisionPanels
address: '0x0801A04C'
kind: function
status: confirmed
summary: Syncs a battle object's panel position into its collision record and recomputes its facing direction for
  the move.
interface: void object_updateCollisionPanels(/* r5 */ BattleObject* obj)
details: 'Takes the battle object in r5, follows oBattleObject_CollisionDataPtr to its collision data struct, and
  copies the object''s current oBattleObject_PanelX/PanelY into oCollisionData_PanelX/PanelY. The previous panel
  coordinates held in the collision record are kept before the overwrite and passed, together with the new coordinates,
  to sub_800E994 along with the object''s oBattleObject_Alliance in r4; the helper returns the facing/direction
  for the step (prevX,prevY) -> (panelX,panelY), which is stored in oCollisionData_Direction. The helper''s r0 (direction)
  is left live for the caller, and the helper''s NZCV flags survive (this function does not clear them), so callers
  can branch on them. Only r4 and r6 are saved; r5 is treated as an input and left intact. Note: despite the name,
  this does not resolve collisions - it only updates the collision record''s panel coordinates and direction.

  '
