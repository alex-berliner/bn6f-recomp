name: chatboxTileRowScratchBuf
address: '0x03001710'
kind: data
status: probable
summary: 'Proposed name: chatboxTileRowScratchBuf. A 32-byte IWRAM scratch buffer that receives the chatbox''s
  per-row text tilemap row (8 tiles) from the chatbox script / text-color paths, then gets queued for
  transfer to VRAM with the rest of the chatbox GFX. (u8)'
details: Every site passes byte_3001710 as the destination of a CopyByEightWords call with size 0x20,
  in functions that build the chatbox tilemap/text GFX (chatbox_runScript, chatbox_reqBBS_80404C0, dead_80405F8,
  chatbox_F6_textcolor, copy_8002668). The same address also appears as a source/dest entry in the GFX-transfer
  table off_811ECB4 inside queueGFXTransfersFromTable_811EC68 (size 0x20), so the bytes written by CopyByEightWords
  are then DMA'd into the chatbox's per-row VRAM tilemap window at 0x600D340. It is sized 0x20 (32 bytes
  = 8 tiles worth), matching the chatbox row's tile count, and is being copied freshly each call rather
  than preserved across calls, so it is a scratch/reload buffer rather than persistent chatbox state.
