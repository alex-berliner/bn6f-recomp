name: ai_hasActiveAttackTarget
address: '0x0810BA94'
kind: function
status: probable
summary: Checks whether the battle AI currently has an active attack target.
interface: (implicit r5 = battle AI state) -> r0 = 1 if target exists, otherwise 0; flags are not reliably
  used
details: The function reads the AI state's field at offset 0x64 and returns true only when that pointer
  is nonzero and the pointed-to object's field at offset 0x66 is nonzero. The caller uses the result as
  a gate for decrementing its attack step timer, indicating that this tests whether an attack-related
  target is still present. It does not modify memory or call other functions.
