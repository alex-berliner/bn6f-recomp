name: battle_updateEntitiesAndStartFadeOut
address: '0x0812952C'
kind: function
status: probable
summary: 'Battle-frame tick: updates all entities and sprites, then when no screen fade is running kicks
  off a fade-out and marks the battle state 0xC.'
interface: (no args; r5 = battle state struct) -> r0 = SetScreenFade result/void; flags from IsScreenFadeActive
  branch used internally
details: Runs the per-frame entity update pass (entity_runAllUpdateHandlers over the 15-record eStruct
  array) and the sprite pipeline (battle_updateEStructSprites), then polls IsScreenFadeActive. If no fade
  is active, it stores state byte 0xC into r5+2 (a phase/state counter) and calls SetScreenFade(8, 0x10)
  to begin a fade. The fade likely leads into some battle transition (e.g. fade-out to end/result); the
  r5+2 state byte makes the surrounding state machine act on the next phase. Nothing is returned; the
  only outputs are the state write and the fade request.
