name: ai_attackStepWindupAnim3Hit8
address: '0x080F8794'
kind: function
status: confirmed
summary: AI attack step handler that starts a wind-up (animation 3, moves onto the planned panel) and counts a 3-frame
  timer before switching to the hit phase (element 8).
interface: void ai_attackStepWindupAnim3Hit8(r5 battleObject, r7 attackVars); /* outputs r1 (garbage from object_setFlag1
  on first-entry path, untouched otherwise), clobbers nzcv, r0, r2, r3, lr */
details: 'Step function of the per-attack AI variable block (r7 = oAIAttackVars). On first call (AttackElement ==
  0) it sets AttackElement = 4 to mark the wind-up started, plays battle-object animation 3, commits the planned
  panel by copying FuturePanelX/Y into PanelX/PanelY, refreshes the panel reservation (object_removePanelReserve
  with the future panel coords in r0/r1), recomputes pixel coordinates (object_setCoordinatesFromPanels) and collision
  panels (object_updateCollisionPanels), clears object flag 0x40, sets the OBJECT_FLAGS_CURRENTLY_MOVING_1 flag,
  and reloads StepTimer = 3. On subsequent calls (AttackElement != 0) it decrements the halfword StepTimer; while
  still positive it just returns, and when it reaches 0 it stores HitElement = 8, handing control to the hit phase
  of the same step table. Quirk: the "hit element" write uses strh on oAIAttackVars_HitElement. r1 on exit is only
  meaningful via the object_setFlag1 leftover on the first-entry path; callers apparently treat r1 as ignored/scratch.

  '
