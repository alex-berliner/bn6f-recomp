name: ai_attackStepWindupAnim3Hit8
address: '0x080F8794'
kind: function
status: probable
summary: 'Per-frame tick of an enemy AI step/advance attack: commits the target panel and plays the wind-up
  anim on first call, then after a 3-frame delay activates the attack''s hit element.'
interface: (r7 = AI attack vars struct, r5 = battle object) -> void; sets oAIAttackVars_HitElement when
  done
details: Runs off oAIAttackVars_AttackElement in r7 as a phase flag. On the initial call (element 0) it
  writes element 4, switches the object to animation 3, copies FuturePanelX/Y into PanelX/Y, releases
  the reserved panel, recomputes pixel coordinates and collision panels, clears collision flag 0x40, sets
  ObjectFlags1 'currently moving' (bit 1<<? = 0x... value 1 shifted), and stores a 3-frame StepTimer.
  On subsequent calls it simply decrements StepTimer and, on reaching 0, writes HitElement = 8 so the
  attack's damage/effect phase begins. It is a state-machine tick rather than a one-shot setup.
