name: battle_setObjectAnim
address: '0x080B8E70'
kind: function
status: confirmed
summary: Sets a battle object's current animation index and invalidates its cached copy so the renderer picks up
  the change.
interface: void battle_setObjectAnim(BattleObject* object, u8 anim)  /* r0 = object ptr, r1 = anim; returns byte
  in r1 (0xFF on success, anim on null ptr); clobbers NZ flags */
details: 'Guarded setter used by the battle engine to switch an object''s animation.

  If r0 is null the function returns immediately without touching memory (the

  original falls straight through, leaving r1 = anim as the "return value").

  Otherwise it stores the anim byte at oBattleObject_CurAnim and then writes

  0xFF into oBattleObject_CurAnimCopy, a shadow field the per-frame animation

  update uses as a dirty marker: when it differs from CurAnim the engine

  re-resets the frame/step state for the new animation. Returns the last

  value written to r1 (0xFF after a successful store), which callers appear

  to ignore. Thumb, 8 bytes, no flags other than NZ (from tst) are meaningful.

  '
