name: streamReadNextByte_814E7C0
address: '0x0814E7C0'
kind: function
status: confirmed
summary: Reads the next byte from a byte stream (script/message or data reader), advancing the stream's cursor.
interface: int streamReadNextByte(void* stream /* r1 */); // returns byte in r3, address of the byte in r2
details: 'The stream object at r1 keeps its current read position in the u32 field at offset 0x40. This routine
  loads that position, stores position+1 back into [r1+0x40], then loads the byte at the old position. It returns
  two values through registers without touching the stack: r2 = address the byte was read from (position before
  increment) and r3 = the byte value. This is the classic "get next byte of a command/message stream" primitive
  used by stream interpreters; the byte in r3 and the pointer in r2 let callers both dispatch on the value and re-read/branch
  on the same address. No flags are set deliberately (the add sets NZCV as a side effect, so callers must not rely
  on flag state across this call).

  '
