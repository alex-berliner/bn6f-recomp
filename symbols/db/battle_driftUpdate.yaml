name: battle_driftUpdate
address: '0x080E213C'
kind: function
status: probable
summary: Per-frame update that drifts a battle object by its XVelocity/ZVelocity until Timer expires,
  then re-anchors it behind the owner; frees the object if the battle ends or the owner's CurAction no
  longer matches the value in dword_80E21A8 indexed by Param2.
interface: (r0 = battle object ptr, stashed in r5 by caller convention) -> void; no return value, may
  call object_freeMemory on the object
details: If the battle is over the object is freed. Otherwise, unless Param2==2, it compares the related
  object's CurAction against an expected-action table at dword_80E21A8 indexed by Param2 (bytes 0x0D,
  0x0E, 0x5E for states 0,1,3) and frees the object on mismatch; battle time-stop pauses the countdown.
  Each frame it decrements Timer2 and, while positive, applies XVelocity to X and ZVelocity to Z. When
  Timer reaches 0 it calls object_setCoordinatesFromPanels, then sets X to panel-X minus frontDirection*0x140000
  (i.e. 20.0 fixed-point units behind the facing) and Z to 0x800000 (8.0), and reloads Timer with 0xF
  to start the next drift cycle.
