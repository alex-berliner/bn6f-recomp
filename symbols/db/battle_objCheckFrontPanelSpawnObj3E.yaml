- method: assembly-reading
  date: '2026-10-19'
  detail: 'beq loc_80E7E28 after object_checkFrontPanelFlag: spawn only happens when front panel flag
    0x10 is set; bl battle_spawnObject3E with r4=Params, r2=Element, r6=Damage+Z16Save: spawns object
    type 0x3E using this object''s attack fields; strh r0 (#0x1e), [Timer] and strb #4 into PhaseInitialized:
    arms a 30-frame timer and enters phase 4; timer countdown then CurAction=0xC, CurPhaseAndPhaseInitialized=0:
    state ends after the wait, handing control to action 0xC'
