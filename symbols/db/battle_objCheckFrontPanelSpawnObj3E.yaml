name: battle_objCheckFrontPanelSpawnObj3E
address: '0x080E7E08'
kind: function
status: probable
summary: 'Battle object state update: on entry checks the panel in front for flag 0x10, spawning object
  0x3E there if set, then waits 30 frames before advancing to the next action.'
interface: '(r5 = battle object) -> r0 = 0; side effects: possibly spawns object 0x3E, updates object
  Timer/PhaseInitialized/CurAction/CurPhase'
details: 'Runs once per object while PhaseInitialized is 0: if object_checkFrontPanelFlag reports the
  front panel has flag 0x10, it calls battle_spawnObject3E passing Params (r4), Element (r2), Damage plus
  Z16Save as the damage value (r6), Z16Save in r3 and the check result in r0. It then sets Timer = 0x1E
  (30 frames) and PhaseInitialized = 4. Each subsequent frame decrements Timer; on reaching 0 it sets
  CurAction = 0xC and clears CurPhaseAndPhaseInitialized, ending this state. The spawning is skipped silently
  if the front panel flag is absent, but the 30-frame wait still occurs.'
