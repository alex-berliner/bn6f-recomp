name: battle_releaseRelatedObject2_80111DC
address: '0x080111DC'
kind: function
status: confirmed
summary: Detaches a battle object's secondary linked object, running that object's cleanup routine and clearing
  the link pointer.
interface: void sub_80111DC(u32 battleObject /* r5 */); — returns r1 (left over from sub_80C4204's return when the
  link was non-null), clobbers r0 and NZ flags
details: 'Reads the pointer at oBattleObject_RelatedObject2Ptr from the battle object passed in r5. If it is non-null,
  calls sub_80C4204 on it (that callee''s r1 return value passes through to this function''s callers) and then stores
  0 back into oBattleObject_RelatedObject2Ptr. If the pointer is already null, it returns immediately without touching
  anything, so the r1 output is only meaningful on the call path. The callee is presumably the related object''s
  own detach/cleanup handler (setActionPhase8-style teardown). Callers ignore flags and r0.

  '
