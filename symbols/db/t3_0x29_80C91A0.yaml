name: t3_0x29_80C91A0
address: '0x080C91A0'
kind: function
status: confirmed
summary: Per-frame state dispatcher for a battle object — runs the handler for the object's CurState via a 3-entry
  jump table, then updates its sprite animation.
interface: u32 battleObject_runStateHandler_80C91A0(u32 r2, u32 r4, BattleObject* r5, u32 r6, u32 r7); /* also reads
  r10; returns object ptr in r5, clobbers r8-r12 and flags */
details: 'Standard battle-object update thunk (naming suggests object type 3 / task 0x29). Loads the object''s CurState
  byte at [r5,#oBattleObject_CurState] and indexes the jump table at off_80C91B8 with the raw state value (ldr r1,[r1,r0],
  so state >= 3 would read garbage — states are assumed bounded at 2). Uses the classic "mov lr, pc; bx r1" long-call
  dispatch, so the handler runs as guest code with the object pointer still in r5 and may modify r5 (the follow-up
  call must see the updated pointer). Handlers: state 0 -> sub_80C91C4 (likely init/idle for this object type),
  state 1 -> battleObject_dispatchActionByParam1_80C91FE (dispatches based on a parameter field), state 2 -> object_genericDestroy
  (frees/removes the object). When the handler returns, calls object_updateSpritePaused to advance the object''s
  sprite animation, which does nothing while the battle is paused. Returns with the object pointer in r5 as the
  handler left it.

  '
