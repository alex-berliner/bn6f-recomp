name: ow_storePlayerPosDup
address: '0x0808CC84'
kind: function
status: confirmed
summary: Reads the player's overworld position and stores it (as integer halves) into both position pairs of the
  object at r5.
interface: void ow_storePlayerPosDup(void* obj /*r5*/, coordsSource /*r10*/)
details: 'Calls ReadOWPlayerObjectCoords (r10 appears to be the source selector/context passed through to that callee)
  and receives packed fixed-point coordinates in r0 (x) and r1 (y). Each value is arithmetic-shifted right by 16
  to extract the integer part, then stored as 16-bit halves into four fields of the structure at r5: x at +0x16
  and again at +0x1A, y at +0x18 and again at +0x1C. The second pair duplicates the first, so the function both
  sets the object''s position and refreshes its saved/backup copy of the same position. No return value; only r0-r3
  and flags are clobbered besides the calls.

  '
