name: battle_scanForwardColumnTargets
address: '0x080E42AA'
kind: function
status: probable
summary: Walks battle columns from the caller's side toward the enemy until reaching a column next to
  enemy panels, then records the panels of rows 1-3 in that column that do not belong to the caller's
  alliance.
interface: (r0 = u8 out buffer, r1 = alliance side, r2 = direction-flip flag) -> r0 = number of packed
  panel entries written (col | row<<4); flags clobbered
details: Computes the starting column as (r1^r2)*-5+6, giving column 6 for one side (enters from the right
  edge) or column 1 for the other, and the step as the negated facing multiplier from object_getFrontDirection.
  It loops calling battle_countAdjacentPanelsOfOtherAlliance_800D5F0(column, alliance); while the count
  is 0 it steps one column in the travel direction, keeping within columns 0-5. Once a column adjacent
  to other-alliance panels is found, it iterates rows 1..3, calls object_getPanelDataOffset(column,row),
  and for each panel whose oPanelData_Alliance byte differs from r1 stores the packed byte (offset | row<<4)
  into the caller's buffer at r0, incrementing the returned count. The inner row loop repeats for further
  columns only while at least one enemy panel was found in the previous column; otherwise it stops. The
  caller supplies the output buffer; nothing else in the snippet shows its size or who reads the entries.
