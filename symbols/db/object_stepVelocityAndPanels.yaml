name: object_stepVelocityAndPanels
address: '0x080DD538'
kind: function
status: probable
summary: 'Per-frame battle object update: adds XVelocity/YVelocity to X/Y, then when Timer hits zero advances
  PanelX by object_getFrontDirection and PanelY by ±1 chosen from the sign of YVelocity, syncs collision
  panels, and reloads Timer to 10-2*Param1.'
interface: (r0..r4 = battle object, r5 = object pointer) -> r0 = result of sub_80DD5C8; no meaningful
  flags out
details: Each call adds oBattleObject_XVelocity to X and YVelocity to Y, then decrements Timer. When Timer
  reaches 0, it advances PanelX by object_getFrontDirection (facing/alliance-based ±1) and PanelY by ±1
  chosen from the sign of YVelocity (carry from `lsl r1,#1` on bit31), then calls object_updateCollisionPanels
  to sync the collision record. Timer is reloaded with 10 - 2*Param1, so Param1 controls how fast the
  object crosses panels (higher Param1 = faster). Every frame it also calls sub_80DD5C8, likely animation/visual
  upkeep. The object appears to be a free-moving entity that also snaps to the panel grid periodically.
