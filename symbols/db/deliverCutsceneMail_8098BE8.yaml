name: deliverCutsceneMail_8098BE8
address: '0x08098BE8'
kind: function
status: confirmed
summary: Delivers a cutscene-driven mail (inbox message + delivery/completion event flags) for the active script
  record.
interface: void deliverCutsceneMail_8098BE8(u32 *scriptRecord in R5, void* viaR10/zero r2 pass-through); returns
  R0, R1, R2; clobbers NZ CARRY/OVERFLOW.
details: "Reads mailId from scriptRecord[6] (offset 0x06) and completion byte from scriptRecord[7] (offset 0x07).\n\
  - If mailId == 0xFF: returns R0=0 with R1/r2 pass-through; no side effects.\n- Otherwise calls addMail_802f238\
  \ with the address (0x1CA0 + mailId) to add the corresponding\n  mailbox message.\n- If scriptRecord[7] is non-zero\
  \ (TST r0,r0): calls ClearEventFlag on the entry in the\n  \"0x1D20 + mailId\" block and SetEventFlag on the \"\
  0x1DA0 + mailId\" block — i.e. flips the\n  per-mail \"unseen\" flag off and the \"delivered/seen\" flag on once\
  \ the player has read it.\nReturns R0=0, with R1/R2 preserved from the most recent event-flag or addMail result.\n\
  Constants: 0x1CA0 (mail slot base), 0x1D20 (not-seen flag base), 0x1DA0 (delivered flag base).\n"
