name: battle_refreshObjectCollisionFromExtraVars_80C6AB8
address: '0x080C6AB8'
kind: function
status: confirmed
summary: Refreshes a battle object's hitbox from its extra-vars data, reapplies the panel element effect on it,
  and optionally flags a collision status effect.
interface: battle_refreshObjectCollisionFromExtraVars(r5 = battle object; r4, r6, r7, r10 also live on entry and
  r4/r6/r7 are preserved; returns with r2 set by the element update)
details: 'Takes a battle object pointer in r5. Loads the object''s ExtraVars pointer

  (oBattleObject_ExtraVars) and reads byte 1 as a shape/box selector, then calls

  object_updateCollisionData with width 4 and height 5 (r1=4, r2=5, r3=shapeId),

  i.e. it refreshes the object''s collision box to a fixed 4x5 hitbox of the chosen

  shape. Next it reads the object''s Element field (oBattleObject_Element) and calls

  sub_8019F8C to reapply whatever effect the panel element under the object has on it.

  Finally it re-loads ExtraVars and reads byte 3: if non-zero it is passed in r0 to

  object_setCollisionStatusEffect1, flagging a collision status effect on the object;

  if zero that call is skipped. ExtraVars byte layout touched: byte 1 = hitbox shape

  selector, byte 3 = collision status effect id (0 = none). Quirk: r0 is left as-is

  before the collision call and the callee does not read it. The element update''s

  r2 result is visible to the caller on return.

  '
