name: oowExitSlipRun_809DDF0
address: '0x0809DDF0'
kind: function
status: confirmed
summary: 'Overworld: exits the player''s slip-run state when the slip-run event is no longer active.'
interface: void sub_809DDF0(void) /* r5=OWPlayerObject*, r10=?, lr=ret; trashes r0-r3, r6, r7, nz/c/v,
  lr */
details: "Guarded by three checks before doing any state change:\n  1) event flag \"0x1716\" must be set\
  \ (TestEventFlagFromImmediate).\n  2) event flag \"0x173D\" (EVENT_IN_SLIPRUN_STATE) must be set.\n\
  \  3) the 0xC00000 bit pair in OWPlayerObject+0x50 must be non-zero.\nIf all three hold, it clears flag\
  \ 0x173D and flag 0x173E, sets flag 0x173F, and calls\nsub_809DE60 (the slip-run transition handler).\
  \ Any failed guard returns immediately\nvia pop {pc}. r5 holds the overworld player object; r10 is caller-saved\
  \ but unused here.\nThe 0xC00000 mask against OWPlayerObject+0x50 is what represents \"slip-run is still\n\
  active in the object's runtime state\" — once that clears, the state machine exits.\n"
