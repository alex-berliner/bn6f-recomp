name: battle_objectIsOnStoredPanel
address: '0x080D7DC0'
kind: function
status: probable
summary: Returns 1 if the battle object's current X/Y position converts to the panel coordinates stored
  in its ExtraVars, else 0.
interface: (r5 = battle object pointer) -> r0 = 1 if object's panel == stored panel (ExtraVars+4 col,
  ExtraVars+8 row), else 0
details: Reads the object's pixel X/Y fields, converts them to panel column/row via convertXYToPanelXY_800E258,
  then compares the result against two values kept in the object's ExtraVars (offsets +4 and +8), which
  appear to hold a remembered panel position. Returns 1 only when both column and row match. Note the
  object pointer arrives in r5 (not saved/restored), so the caller convention treats r5 as a reserved
  register for the current battle object.
