name: battle_stepMainState
address: '0x08008D60'
kind: function
status: probable
summary: 'Runs one step of the battle''s main state machine: dispatches the current phase handler, then
  advances AI script steps.'
interface: () -> r0 = byte at dword_203CA74 (updated battle state/next-phase byte); flags from battleObject_runAIScript_802DE5C
details: Reads the battle state index from byte [dword_203CA70] and calls the matching handler from a
  7-entry table at off_8008D7C (battle_startIntro, sub_8008DDC, sub_8008E7C, battle_stepLoseSequence,
  sub_8008FF0, sub_8009058, sub_8009118). After the handler returns, it unconditionally calls battleObject_runAIScript_802DE5C,
  which runs two consecutive AI-script sub-steps when battle flag 0x40 is clear, so the AI step is part
  of every state tick. Finally it loads byte [dword_203CA74] into r0 as the return value; the handlers
  presumably write the next state there (the tail-branch trick with mov lr,pc lets handlers return directly
  to this code).
