open_questions:
- Only one caller (sub_80EFE7C) is known and undocumented — its context would confirm whether this is
  specifically a chip-use vs plain attack start
- Meaning of the arg0 flag bits other than 0x200 is unknown
- What sub_801EB18 does when actually reached (only reachable if the sequence changes ChipID later)
