name: story_checkEntryAlliance_8034E88
address: '0x08034E88'
kind: function
status: confirmed
summary: Determines whether a menu/story entry is accessible given the player's current alliance and relevant
  event flags.
interface: u32 story_checkEntryAlliance_8034E88(u32 r0=entry, u32 r1=category, u32 r4=alliance) -> r1=result(1=selectable,
  0=not, or mismatched byte), r2=byte-table pointer; nz flags reflect cmp of r1 against alliance
details: 'Looks up a category-specific byte table (off_8034EDC has three entries: byte_8034EE8 for cat
  0, byte_8034EEE for cat 1, byte_8034EEF for cat 2). For category 0, special shortcuts apply: entry 6
  is selectable iff event flag 0xE00 is not set; entry 10 is always selectable. Otherwise reads table_byte
  = *(table + (entry>>1)) and compares to r4 (current alliance). On mismatch the raw table_byte is returned
  in r1 with nz flags reflecting the inequality. On match, entry 8 is selectable only if flag 0x0084 is
  clear; all other matched entries return r1=0 (caller must handle). r7 is saved/restored; r10 is accepted
  per caller contract but unused here.'
