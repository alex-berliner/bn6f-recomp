name: battle_hopActionHandler
address: '0x080E4EB8'
kind: function
status: probable
summary: Battle-object AI step that runs an unknown check, commits the object to action 4 (the repeated
  forward hop), and advances the hop.
interface: (r0 = battle object, r5 = same object pointer) -> r0 = battle_hopUpdate return; no meaningful
  flags
details: This looks like a per-frame action handler for a battle object. It first calls the unknown sub_80E4FFC
  (possibly a condition check or shared pre-step), then writes 4 to oBattleObject_CurAction at [r5+CurAction],
  committing the object to the hop action, and immediately calls battle_hopUpdate to apply that frame's
  hop movement. Since battle_hopUpdate's known behavior repositions, resets velocities/anim/action every
  2 ticks, writing CurAction=4 here likely (re)enters or locks in the hop state each frame while it runs.
  r4, r6, r7 are pushed but unused in this stub, suggesting it is a thin dispatcher. With no known callers
  and an unknown callee, the exact trigger condition for entering this state is not visible.
