name: spawnMegaMan_80073CC
address: '0x080073CC'
kind: function
status: confirmed
summary: Spawns Mega Man from an EnemySetup entry at the panel encoded in its position byte, on the side given by
  its alliance bit.
interface: Next spawnMegaManFromSetup(EnemySetup *self /* r6 */); tail-calls sub_800753C(panel_x r0, panel_y r1,
  alliance r2, charId=1 r3) and returns its flags/registers
details: 'Reads a 2-byte setup record at r6: byte +0 bit 0 is the alliance flag

  (which side of the field the character stands on), byte +1 packs the

  panel coordinates as low 3 bits = panel_x, bits 4+ = panel_y. It then

  calls sub_800753C with (panel_x, panel_y, alliance) and a hard-coded

  4th argument of 1 in r3 -- evidently a character/species id, 1 being

  Mega Man. The call appears to be a tail call from the function''s point

  of view (pop {pc} after the bl returns), so the caller sees whatever

  sub_800753C leaves in r0-r3 and the NZCV flags. r4-r7 are preserved

  because the extracted values are passed forward unchanged.

  In game terms this is the battle-init path that places the player

  character onto the field from an EnemySetup structure (the same layout

  is used for enemies, hence the name EnemySetup in the analysis).

  '
