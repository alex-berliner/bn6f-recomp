status: confirmed
summary: 'NPC state 4, every frame: run the script and current action, then update the sprite, interaction areas
  and layer.'
interface: '(r5 = NPC) -> if ChatTriggered: sub_809F5FC; else npc_runPrimaryScript_809ebdc, NPCCurActionJumptable[CurAction],
  sprite_setFlip(mirrored), on a new NPCSprite: sprite_load(0x80, category, sprite) + shadow mode (UnkFlags_60 0x80/0x100),
  on a new AnimationSelect: sprite_setAnimation; then sprite_update, sprite_setPalette, sprite_setUnk0x2c on new
  hidden pieces, copy the shown values to the Update fields, npc_createInteractionAreas_809F526, layer = LayerPriorityOverride
  or applyLayerEffectToOWObject_8035694, sub_8002E14(layer), sub_809F922 if UnkFlags_60 0x40'
details: 'Shadow modes: 0x80 clear = shadow attached; 0x80 set + 0x100 clear = shadow ignores Z (sprite_removeShadow);
  both set = no shadow (sprite_hasShadow). Actions (byte offsets): wait timer, non-cutscene movement, hop, wait
  anim frame, native callback, wait cutscene var, wait mystery data taken.'
