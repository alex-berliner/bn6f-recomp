status: confirmed
summary: 'State-dispatch trampoline for the timefreeze battle object: reads r5''s CurState, jumps through the 3-entry
  table at off_80E0724 to Begin/sub_80E0730/End, and returns.'
interface: void object_timefreezeDispatch_80E0710(u32 r3, u32 r4, u32 r5, u32 r6, u32 r7, u32 r10, u32 lr); /* r5
  = timefreeze battle object; returns via {pop pc} */
details: "r5 is a battle object whose oBattleObject_CurState byte (offset read via LD8) indexes a 3-entry jump table\
  \ at off_80E0724:\n  0 -> object_timefreezeBegin\n  1 -> sub_80E0730 (middle/update handler, not renamed)\n  2\
  \ -> object_timefreezeEnd\nThe handler pointer is loaded into r1, copied to lr, and the routine is entered via\
  \ `bx r1`, so the\nchosen handler is tail-called and returns directly to the caller (pop {pc}). Every caller-visible\n\
  register (r3..r12, lr) is forwarded verbatim, matching the register contract documented for each\nhandler. No\
  \ flags are consumed. This is a pure dispatcher; the Begin/End pair brackets a \"timefreeze\"\nwindow in the battle\
  \ and sub_80E0730 services it while active.\n"
