name: sub_811CA94
address: '0x0811CA94'
kind: function
status: confirmed
summary: Drives a battle object's 7-state dispatch loop, then sets flag bit 1 based on a 0x1150 timer threshold
  and refreshes the sprite.
interface: void sub_811CA94(void *r5 /* battle object */); // uses nz flags from sub_811CC68 each step, loops while
  handler leaves NZ, then returns
details: 'Acts as the per-tick state-machine runner for a battle object. Each iteration calls sub_811CC68 to fetch
  a pointer whose low halfword is an index into a 7-entry jump table at 0x0811CAC4 (thumb-bit-set offsets pointing
  to sub_811CAEC, timerCountdown_step_811CBA0, battle_matchTrackedSpriteAndShrink_811CBD0, sub_811CC02, battle_initObjectSpriteAndStartAnimation_811CC0C,
  sub_811CC26, sub_811CC3A). It dispatches through a register-routine call (bx through r0) and keeps stepping while
  the handler returns NZ (Z=1 means done). Once done, it reads byte [r5] as flags, clears bit 1 (mask 2), compares
  the halfword at [r5+0x1A] against the literal 0x1150, and re-sets bit 1 if the timer has reached/exceeded that
  threshold. Finally calls sprite_update and returns. The struct fields touched on r5 are at offsets 0x00 (flags
  byte) and 0x1A (timer halfword). Note: r5 is passed in but not preserved across sub_811CC68''s clobbers, so the
  dispatcher''s prologue/spush implicit here is a real caller contract. r5 in the readable C comment means ''r5
  on entry'' and is reloaded after sub_811CC68 since it is caller-saved by ARM ABI.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
