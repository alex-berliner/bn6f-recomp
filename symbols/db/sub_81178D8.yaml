name: sub_81178D8
address: '0x081178D8'
kind: function
status: confirmed
summary: Trampoline-style mode dispatcher that tail-invokes one of three mode handlers for the object pointed to
  by R5, based on the mode byte at [R5+8].
interface: 'void object_dispatchModeHandler_81178D8(void); /* in: r5 = object pointer (mode byte at +8), r2-r6,
  r8-r12 = pass-through args/pointers, nzcv = pass-through; out: r0/r1 + flags = whatever the selected handler returned,
  r7 = work-area pointer byte_2011C10, r2-r6/r8-r12 preserved through to the handler */'
details: 'Reads the object''s mode byte from [R5+8]; it is already stored pre-scaled (only 0, 4 or 8 occur in practice),
  so it indexes the three-entry Thumb handler table at off_81178EC directly via ldr r0, [r0, r1] without any shift.
  The loaded word is a halfword-set (odd) Thumb address and is used twice: as the branch target (mov lr, pc; bx
  r0) and as the first argument in R0 to the callee. The callee receives R0 = its own address, R1 = mode byte, R7
  = address of the shared work area byte_2011C10 (an IWRAM buffer, likely a per-object/per-scene state struct),
  and everything else untouched, so R2-R6/R8-R12 act as extra implicit arguments. Handlers are sub_81178FC (mode
  0), sub_811794C (mode 4) and sub_8117990 (mode 8). Because the mode byte indexes bytes, not entries, a mode >=
  12 would read past the table; real game states never produce that, and the stray word would just stay in R0 with
  the bx still branching to it. Returns to the original caller via pop {pc} from the handler''s lr chain (handler
  returns with the dispatcher''s pushed lr effectively consumed by the pop {pc} after the callee''s own return path
  — the dispatcher''s lr is handed off, so the handler returns straight to the dispatcher''s caller).

  '
