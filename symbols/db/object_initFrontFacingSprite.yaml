name: object_initFrontFacingSprite
address: '0x080D87C0'
kind: function
status: probable
summary: Loads sprite (0x80/0xC/0) with animation CurAnim=Param2*2 and no shadow, marks visible (flags|=2), recomputes
  pixel coords from panel, offsets X by frontDirection*60, clears Param4, sets state to CUR_STATE_UPDATE, then tail-calls
  sub_80D881C.
interface: (r0/r5 = battle object ptr) -> r0 = result of callee sub_80D881C; sets object state to CUR_STATE_UPDATE
details: Loads sprite resource (0x80,0xC,0) and its animation data, marks it shadowless, and sets CurAnim to Param2*2
  (Param2 picks an animation variant) with CurAnimCopy=0xFF, then applies it via sprite_setAnimation and sprite_update.
  It sets oObjectHeader_Flags bit 1 (value 2, likely 'active/visible'). It applies the object's horizontal flip
  and recomputes pixel coordinates from panel coords, then offsets oBattleObject_X by frontDirection * 0x3C (60
  px) so it sits in front of the facing direction. Param4 is cleared to 0 and CurStateActionPhaseAndPhaseInitialized
  is set to CUR_STATE_UPDATE before tail-calling sub_80D881C.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_load(0x80,0xC,0) + sprite_loadAnimationData + sprite_noShadow set up the object's visual at asm
    start; ldrb Param2; add r0,r0,r0; strb CurAnim; mov r0,#0xFF; strb CurAnimCopy — animation index = Param2*2;
    object_getFrontDirection()*0x3C added to oBattleObject_X — forward offset of 60 px; str CUR_STATE_UPDATE into
    oBattleObject_CurStateActionPhaseAndPhaseInitialized before bl sub_80D881C; callees object_getFlip/object_setCoordinatesFromPanels
