name: battle_spawnLinkedObjectA0
address: '0x080D94F2'
kind: function
status: probable
summary: Spawns a type-3 battle object with id 0xA0 and, on success, initializes its panel position, element,
  alliance, and damage counter from caller arguments, links its ExtraVars to a caller struct, and records
  battle_isPaused() into ExtraVars+8.
interface: (r0 = object id arg overwritten with 0xA0, r1 = panel X, r2 = panel Y, r3 = element, r4 = state
  struct ptr, r5/r6 = source object data) -> r0 = new battle object (or original r5 on failure); flags
  from spawn result
details: Saves the caller's arguments, calls object_spawnType3 with id 0xA0 (160), and on success fills
  the new battle object's PanelX/PanelY/Element and DamageAndStaminaDamageCounterDisabler fields. It copies
  oBattleObject_AllianceAndDirectionFlip from the source object r5 and copies oBattleObject_Param3 to
  offset 0x64 of the new object. It sets oObjectHeader_Flags bits 0x14, cross-links the new object's oBattleObject_ExtraVars
  with the caller's r4 struct (each stores a pointer to the other), and finally stores battle_isPaused()'s
  result into ExtraVars+8 so the object can react to a paused battle. The listing is partially garbled
  (push/pop imbalance), so register roles are inferred from the store targets.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0, #0xa0; bl object_spawnType3 — spawns type-3 battle object 0xA0; strb r1/r2/r3 to oBattleObject_PanelX/PanelY/Element
    — caller args become spawn placement/element; str r4,[r0,#oBattleObject_ExtraVars]; str r0,[r4] —
    bidirectional link with an external struct; orr r2, #0x14 into oObjectHeader_Flags — sets a fixed
    behavior-flag pair on the new object; bl battle_isPaused; str r1,[r0,#oBattleObject_ExtraVars+8] —
    caches pause state in the object''s extra vars'
