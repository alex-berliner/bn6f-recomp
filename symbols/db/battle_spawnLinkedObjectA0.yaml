    After object_spawnType3, r0 is moved from r5 (original id), then r1/r2/r3/r5 are restored — meaning
    r0 holds r5''s original id, r1=panelX, r2=panelY, r3=element, r4=state ptr, r5=original id (not source
    object), r6=source object. The panel/element fields and ExtraVars linking match. However, it copies
    oBattleObject_Param3 to offset 0x64 and ORs 0x14 into oObjectHeader_Flags. Note ''mov r0, r5'' before
    the beq suggests on failure r0 returns the original r5 (the spawn target id), not a spawned object.
