status: probable
summary: Per-frame update loop that drives the 4 battle HP/Damage meter UI bars (read actor HP, dispatch
  into one of two update paths, store current HP back)
interface: '() -> r0 = 1 ; side effects: writes 4 * 0x14-byte meter entries at `byte_203EB50`'
details: "- Saves r4, r6, lr; r4 = `byte_203EB50` (a table of 4 meter entries, 0x14 bytes each, see `r6\
  \ = 4` and `add r4, #0x14`); r6 = iteration counter.\n  - For each entry: tests `byte_00 & 1`; if clear,\
  \ just advance and continue.\n  - If active: r2 = `[r4+0xC]` (pointer to a battle object — offsets match\
  \ `BattleObject.HP` at 0x24, `CurState` at 0x8, etc.); r0 = `[r4+2]` (last sampled HP, u16); r1 = `object->HP`\
  \ (ldrh [r2,#0x24]).\n  - If HP == 0: clear active flag (`[r4] = 0`) and store r0 back at `[r4+2]`,\
  \ then advance.\n  - Else compare last sampled HP r0 to current HP r1: pick branch index 0 (r0<r1, \"\
  gained HP\" — would play a \"heal\" effect), index 2 (r0>r1, \"lost HP\" — damage path), or index 4\
  \ (equal) and `bx [pc,r2]` via the `off_801C33C` thunk table at `dword_801C338`.\n  - On the equal branch\
  \ (`loc_801C19E`): if `object->AIDataPtr+0x54 -> [byte] + 8` is non-zero, mark a 2-frame \"flash\" via\
  \ `[r4+8]=1`, `[r4+9]=2` and exit; otherwise if `[r4+9]>0` decrement it, and when it hits 0 clear `[r4+8]`\
  \ and write `0x0B0B0B0B` (gray) to `[r4+0x10]`.\n  - The `off_801C33C` table dispatches the \"HP changed\"\
  \ cases into dedicated update functions; the captured-call `r0=0801c169` (the function's own Thumb bit-set\
  \ address) strongly suggests `r0` on entry is ignored and only the `lr`/`pc` thunk dispatch matters.\n\
  \  - Constant `0x0B0B0B0B` is the gray \"no-change\" tint written into a colour field at offset 0x10\
  \ of the meter entry.\n  - Always exits with r0 = 1 and ZC flags set (the contract's \"out\" is just\
  \ r4/r6 restoration; r0 happens to be 1, but the contract is otherwise void-like — keep `_ADDRESS` suffix).\n"
