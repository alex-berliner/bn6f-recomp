open_questions:
- The two dispatch functions (HP-rose vs HP-fell) and what UI element `byte_203EB50` actually backs (HP
  bars, Custom Gauge, damage numbers?) — would be settled by reading the thunk table at `off_801C33C`
  and looking at one entry's 0x14 layout in `byte_203EB50`.
- Why a captured call's `r0` is the function's own address +1 — looks like a Thumb-bit artifact from the
  calling convention, not a real argument.
