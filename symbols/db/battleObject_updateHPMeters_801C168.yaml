  detail: '- `ldr r4, off_801C334 // byte_203EB50` and `add r4, #0x14` with `r6 = 4` iteration count establishes
    4 x 0x14-byte entries. - `ldrb r1, [r4]` / `tst r1, #1` / `beq loc_801C1C8` is the standard "active
    flag in byte 0" pattern. - `ldr r2, [r4,#0xc]` followed by `ldrh r1, [r2,#0x24]` matches `BattleObject.HP`
    exactly. - `ldrh r0, [r4,#2]` (last HP) vs current HP; `cmp r0, r1; bgt/blt/beq` drives the 3-way
    branch into a thunk table (`ldr r3, off_801C338; ldr r2, [r3,r2]; bx r2`). - `strh r0, [r4,#2]` at
    the bottom stores the new last-HP value. - The "0x0B0B0B0B" tint at `[r4+0x10]` plus the 2-frame counter
    at `[r4+8]/[r4+9]` is consistent with a UI meter "flash" that decays back to grey. - `r0 = 1` on exit
    across all 40 captured calls is the function''s return value (caller-discardable per the contract).'
