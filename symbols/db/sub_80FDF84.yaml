name: sub_80FDF84
address: '0x080FDF84'
kind: function
status: hypothesis
summary: Trivial wrapper that invokes helper sub_800FE28 with a pointer to a constant one-word table (0x02020202),
  passing the helper's results straight through.
interface: void sub_80FDF84(void /* r5 passed in per caller contract, not read here */) -> returns helper results
  in r0 and r2
details: Pushes lr, loads the address of dword_80FDF94 (a single aligned word containing 0x02020202, i.e. four bytes
  of 0x02) into r0, calls sub_800FE28, and returns to the caller immediately with the helper's r0/r2 untouched.
  The function itself never reads r5, so the recorded r5 input must be consumed by the helper (or is simply part
  of the callers' calling convention). No memory is written by this function; the only data is the literal table
  at 0x080FDF94. Without knowing sub_800FE28's purpose (the 0x02,0x02,0x02,0x02 payload could be a parameter list,
  a small request/argument block, or default values), no game-level meaning can be pinned down.
