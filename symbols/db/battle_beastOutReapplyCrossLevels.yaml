name: battle_beastOutReapplyCrossLevels
address: '0x08136B10'
kind: function
status: probable
summary: Subtracts r0 from toolkit RenderInfo+0x18, then for each of min(level_byte>>2, 7) cross levels
  calls battle_beastOutApplyCrossChanges_813C06C(level, 3, (frame&8)>>3) to refresh beast-out chip/anim
  swaps, with r5 as an implicit caller-supplied context pointer.
interface: (r0 = value subtracted from toolkit RenderInfo+0x18 halfword, r5 = implicit ptr to struct whose
  byte+3 holds level count) -> r0 = callee result of last call; no meaningful return
details: Takes r0 from a nearby cutscene-step caller and subtracts it from the halfword at [toolkit RenderInfo+0x18],
  apparently undoing or counting down some offset/timer set earlier in the scene. It then computes r7
  = (current global frame & 8) >> 3, i.e. a value alternating 0/1 every 8 frames, likely an animation/variant
  selector. It reads a byte at [r5+3], shifts right by 2, clamps it to 7, and loops that many times calling
  battle_beastOutApplyCrossChanges_813C06C(r6, 3, r7) with r6 counting 0..N-1; the callee swaps matched
  chip/animation pairs into unk_30019E0 for the beast-out forms the navi owns. r5 is never set inside
  the function, so it is an implicit context argument supplied by the caller. The constant 3 as the callee's
  second argument likely selects the beast-out (vs cross) slot class. Used by pet_naviHealCutsceneStep
  and three sibling step functions in the same 0x81369xx block, all reached from the beastsp scripted
  route.
