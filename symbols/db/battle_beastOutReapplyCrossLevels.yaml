open_questions:
- Exact meaning of the RenderInfo+0x18 halfword being decremented and what r0 represents (offset? timer?)
- What structure r5 points to and what the byte at +3 encodes (cross level count? form ID?)
- Meaning of the callee's constant argument 3 and of the r7 0/1 selector (animation bank vs form variant)
