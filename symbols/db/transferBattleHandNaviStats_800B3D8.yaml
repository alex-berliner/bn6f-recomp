name: transferBattleHandNaviStats_800B3D8
address: '0x0800B3D8'
kind: function
status: confirmed
summary: Transfers the current battle's hand/Navi stat blocks from their input buffers into the active battle state,
  swapping in the AI variants when battle effect flag 0x08 is set.
interface: void transferBattleHandNaviStats(void); // no parameters, no return value
details: "Called once per turn to publish hand and Navi stat data into the structures the\nbattle engine reads.\n\
  Uses GetBattleEffects to test bit 0x8; if set, the secondary (AI-side) buffers\nare used instead of the primary\
  \ ones for both the hand (0x50-byte) record pair\nand the full Navi stats (0x64-byte) record pair.\n\nConditional\
  \ primary hand/navi copy (0x50 bytes, CopyWords):\n  src  = byte_203F4A4  (per-slot marker byte tested against\
  \ 0xFF)\n  dst  = byte_20349C0\n\nConditional secondary hand/navi copy under effect 0x8 (0x50 bytes):\n  src \
  \ = byte_203F5A4  (marker byte tested against 0xFF)\n  dst  = byte_2034A10\n\nUnconditional primary Navi stats\
  \ copy (0x64 bytes):\n  src  = byte_203F4F4\n  dst  = eBattleNaviStats0\n\nUnconditional secondary Navi stats\
  \ copy under effect 0x8 (0x64 bytes):\n  src  = byte_203F5F4\n  dst  = eBattleNaviStats1\n\nPer-slot guard: a\
  \ 0xFF marker byte skips that copy entirely; only non-0xFF slots\nhave their record transferred. The two unconditional\
  \ Navi-stats copies have no\nsuch guard. r4 holds the marker pointer across the call to CopyWords; r3/r4\nare\
  \ preserved across the function.\n"
