name: SWI_CpuSet
address: '0x0814D8B8'
kind: function
status: confirmed
summary: BIOS software-interrupt wrapper that invokes the GBIOS CpuSet routine (svc 0xB) to copy or fill memory
  in 16- or 32-bit units.
interface: void SWI_CpuSet(const void* src /*r0*/, void* dest /*r1*/, int lengthMode /*r2*/) — r0/r1/r2 in, no return
  value; r1-r3 pass through unchanged, r0 clobbered by the BIOS call
details: 'Two-instruction thunk: issues `svc 0xB` and returns via `bx lr`. All work is done by the BIOS CpuSet handler.
  Parameters: r0 = source address (must be aligned to 4 bytes for 32-bit transfers, 2 bytes for 16-bit), r1 = destination
  address (same alignment rules), r2 = length/mode bitfield — bits 0-20 give the element count (words when 32-bit
  mode, halfwords when 16-bit mode), bit 24 (0x1000000) selects fixed-source "fill" mode where every destination
  unit is written with the single {half}word at r0 instead of copying sequentially, bit 26 (0x4000000) selects 32-bit
  transfers when set, 16-bit otherwise. No value is returned; the effect is the data written to the destination
  buffer. The BIOS clobbers r0, so callers must not expect the source pointer to survive; r1-r3 are preserved through
  the call. This is a generic utility wrapper, not tied to any one subsystem — callers throughout the game use it
  for DMA-less bulk copies and fills (e.g. clearing OAM/VRAM-style buffers or copying lookup tables).

  '
