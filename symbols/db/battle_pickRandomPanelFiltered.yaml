name: battle_pickRandomPanelFiltered
address: '0x080CDF18'
kind: function
status: probable
summary: Collects all field panels (excluding the actor's own) matching a per-alliance attribute filter,
  shuffles them with the RNG, stores the count, and returns one random panel's packed coordinates.
interface: (r0 = battle object, r5 = same object pointer) -> r0 = random panel byte (column<<4 | row&7),
  r1 = column (byte>>4); r0 = 0 if no panel matched; count saved to object+ExtraVars+0x14
details: 'Reads oBattleObject_Alliance, shifts it by 3 to index an 8-byte-per-alliance table at byte_80CDF50,
  and loads two words (required and forbidden panel-attribute bitmasks) into r2/r3 for object_getPanelsExceptCurrentFiltered.
  That callee fills a caller-supplied list with matching panels and returns the count; the count is stored
  at object+ExtraVars+0x14. ShuffleByteList_PrimaryRNG randomizes the list in place, then the first entry
  is read: high nibble = column, low 3 bits = row. Alliance 0 requires bits 0x30 with forbidden mask 0x0F8C0080;
  alliance 1 requires 0x10 with 0x0F8C00A0, so each alliance targets a different panel type. Returns 0
  when no panel qualifies.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Alliance]; lsl r0,#3; add r4,r4,r0 — per-alliance 8-byte filter table
    at byte_80CDF50; bl object_getPanelsExceptCurrentFiltered with r2/r3 = required/forbidden masks from
    the table; str r1,[r5,#oBattleObject_ExtraVars+0x14] — stores matched-panel count in the object; bl
    ShuffleByteList_PrimaryRNG then ldrb r0,[list] with lsr#4 / lsl#1d+lsr#1d — random entry split into
    column and 3-bit row; beq loc_80CDF46 returning r0=0 when the filtered panel list is empty
