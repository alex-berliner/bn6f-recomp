name: startScreen_playFlaggedSfx_802FC70
address: '0x0802FC70'
kind: function
status: confirmed
summary: Start-screen per-frame helper that, when bit 0x100 of the screen state halfword is set, triggers the sound/effect
  described by the parameter table byte_802FC88.
interface: void startScreen_playFlaggedSfx_802FC70(const StartScreen *self /*r5*/) — reads r5; calls into sub_8001158
  with r0 = &byte_802FC88; returns with r4-r7 preserved (caller must reload them per the contract, the callee preserves
  them); C is cleared by the mask-setup shift on the early-out path, N/Z reflect (state & 0x100), V untouched.
details: 'r5 points to the StartScreen state block; the halfword at +0x0A holds screen state flags. Bit 0x100 (0x10
  << 4 test mask) gates the action: when set, r0 is loaded with the address of byte_802FC88 — a 20-byte table (0x14,
  0x40, 0x40, 0x80, 0x72, ... and a second 10-byte entry 0x24, 0x40, 0x40, 0x40, 0x8, 0x72, ...) that looks like
  two packed SFX/EW parameter records — and sub_8001158 is called to execute it (almost certainly a sound/SE player
  given the parameter shape). When the bit is clear the function returns immediately without doing anything. r0-r3/lr
  are scratch; r4-r7 are preserved. Quirk: building the mask with "mov r1,#0x10; lsl r1,#4" means the Thumb shifted-move
  always clears the carry flag, so the early-out return has C=0 regardless of input — callers relying on flags across
  this call see that.'
