    — The code matches the proposal''s structure (push/pop {r0}, store to eS200AC80+0x30, save MapGroup
    into LastMapGroup, call battle_resetEStructRecords_8046664). However, the function is called from
    subsystem_launchChipTrader, so ''chipTrader_initScene'' is reasonable, though the prefix list doesn''t
