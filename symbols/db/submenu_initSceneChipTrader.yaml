name: submenu_initSceneChipTrader
address: '0x0804A2CC'
kind: function
status: probable
summary: 'Initializes the chip trader sub-scene: stores the launch argument at dword_200ACB0 (eS200AC80+0x30),
  saves the current MapGroup into LastMapGroup so the overworld can be restored, and clears the eStruct
  scene record array via battle_resetEStructRecords_8046664.'
interface: (r0 = value/pointer stored to dword_200ACB0) -> void; no return value
details: Uses the push/pop {r0} trick to preserve its argument across the call to sub_804A2E8, then stores
  that argument at eS200AC80+0x30 (dword_200ACB0), so sub_804A2E8's return value is discarded and r0 is
  caller-supplied state. It then reads the game state via the toolkit (r10) and copies oGameState_MapGroup
  into oGameState_LastMapGroup, the standard save-of-location done when entering an overlay scene so the
  overworld can be restored afterwards. Finally it calls battle_resetEStructRecords_8046664 to re-init
  the eStructArr2008450 record array, clearing leftover battle-overlay scene records before the trader
  scene runs. The exact meaning of the stored r0 depends on sub_804A2E8, which is still unnamed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sole caller 0x08005D48 subsystem_launchChipTrader identifies the subsystem; push {r0}/pop {r0}
    around 'bl sub_804A2E8' keeps the argument, whose value is then 'str r0,[r5,#0x30]' into dword_200ACB0;
    'ldrh r0,[r1,#oGameState_MapGroup]; strh r0,[r1,#oGameState_LastMapGroup]' saves the current map for
    returning from the sub-scene; 'bl battle_resetEStructRecords_8046664' clears eStructArr2008450 as
    done when entering an overlay scene
