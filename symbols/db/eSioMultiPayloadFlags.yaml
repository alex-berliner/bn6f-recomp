name: eSioMultiPayloadFlags
address: '0x0200F489'
kind: data
status: probable
summary: 'Proposed name: eSioMultiPayloadFlags. A single-byte flag scratch used by sio_processMultiPayloads
  when broadcasting per-player SIO payloads (cleared or OR''d across a 30-slot window). (u8)'
details: byte_200F489 is a one-byte variable in EWRAM, referenced only by sio_processMultiPayloads. It
  sits in a small table of SIO state pointers (off_81449A4..off_81449AC) that the function loads via a
  literal pool. The function reads it with ldrb [r5] each loop iteration and passes the value (together
  with the current player index) to copy_storeHalfwordRecord. The function's summary states mode 0 clears/flags
  this state while non-zero modes OR/sum per-slot values across a 30-entry frame window, indicating this
  byte is a per-frame flag accumulator for the multi-player SIO payload processing.
