name: pet_prepareMenuOnReturn_811F6C0
address: '0x0811F6C0'
kind: function
status: confirmed
summary: Re-enters the PET menu by clearing its submenu work area, restoring the last selected page as the cursor,
  and recording the current map group as the last one visited.
interface: void pet_prepareMenuOnReturn(toolkit /* r10 */); preserves r2-r5, sets C from selection<<2 (always clear
  for a byte selection), preserves V
details: Takes the toolkit in r10. Loads oToolkit_SubmenuPtr and zeroes 0x80 bytes of the submenu's work area via
  ZeroFillByWord (word-wise fill, byte count argument). Reads the saved page/selection byte at ePETMenuData+4 (byte_200DF24),
  shifts it left by 2, and stores it as the submenu's first byte, which acts as the byte offset of the selected
  menu page; the LSL also emits carry from bit 30, which is always 0 for a byte-sized selection but is visible to
  callers (the contract lists C as an output). Then loads oToolkit_GameStatePtr, copies the 16-bit map group at
  GameState+4 into oGameState_LastMapGroup, so later code knows which area the player came from when leaving the
  PET. r2-r5 pass through unchanged; r0, r1 and LR are clobbered by the call and epilogue.
