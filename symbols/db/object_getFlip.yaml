name: object_getFlip
address: '0x0800E456'
kind: function
status: confirmed
summary: Returns a battle object's effective horizontal facing — its alliance side XORed with its DirectionFlip
  override.
interface: u32 object_getFlip(void* r5_object, /* out */ u32* r1_rawFlip)
details: 'Reads oBattleObject_Alliance (the object''s side bit, player vs enemy) and oBattleObject_DirectionFlip
  (a per-object flip override byte) from the battle object struct pointed to by r5. The effective sprite-facing
  flag is alliance XOR directionFlip, returned in r0; the raw DirectionFlip byte is also left live in r1 for callers.
  This lets objects on the enemy side render mirrored relative to their logical facing so both sides appear facing
  each other. Flag clobber: N/Z from the eor, but callers only use the registers. Pure getter — no writes, no other
  state touched.

  '
