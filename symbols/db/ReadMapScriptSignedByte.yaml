name: ReadMapScriptSignedByte
address: '0x0803609C'
kind: function
status: confirmed
summary: Map script interpreter helper — reads one signed byte operand from the current script position (r7 + offset
  in r6) and returns it in r4.
interface: int ReadMapScriptSignedByte(s32 offset /*r6*/, u8 *script /*r7*/); // returns value in r4, r7 preserved,
  flags clobbered
details: 'Tiny helper of the map/town script interpreter: computes script pointer + offset

  (add r7, r7, r6), loads one byte, sign-extends it (lsl #24 / asr #24) and returns

  it in r4. r7 (the script cursor/pointer) is preserved so the interpreter can keep

  reading further operands from the same position; the caller advances the cursor

  itself. Used for signed script operands (e.g. negative values, signed jump deltas).

  Clobbers condition flags; trashes r4 as its return register.

  '
