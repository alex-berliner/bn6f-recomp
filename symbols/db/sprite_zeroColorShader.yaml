name: sprite_zeroColorShader
address: '0x08002EE8'
kind: function
status: confirmed
summary: Resets an object's sprite color-shader/palette-effect halfword to zero, returning the sprite data pointer.
interface: void sprite_clearObjectColorShader(oObjectHeader* header /* r5 */); returns oObjectSprite* in r3, flags
  c/v set by the final ADD
details: 'Takes r5 pointing at an object header. Reads the byte at oObjectHeader_TypeAndSpriteOffset (+2), masks
  off the low nibble (high nibble = sprite index within the header block), and multiplies it by 16 (the oObjectSprite
  struct stride) via lsr/lsl #4, adding it to the header pointer to get the address of the object''s oObjectSprite
  struct. Stores 0 as a halfword into that struct at oObjectSprite_Unk_06, which the verified C labels as the sprite''s
  color shader / palette effect field, effectively clearing any palette effect on that sprite. Quirk: the computed
  sprite address is returned in r3, and the c/v flags come from the address-computing ADD rather than being meaningful
  results; r0 is used as a scratch zero.

  '
