name: rollRngSeedIntoExtraToolkitPtrs_8006e26
address: '0x08006E26'
kind: function
status: confirmed
summary: Repeatedly draws the hardware RNG until it is not 0xFFFFFFFF, then stores the bitwise-complemented value
  as a random seed at eUnusedExtraToolkitPtrsOffset+4.
interface: void encryption_8006e26(void)
details: 'Loops calling GetRNG, complementing the result with MVN, and re-rolling while the

  complement is 0 — i.e. it only accepts an RNG draw that is anything other than

  0xFFFFFFFF, guaranteeing a nonzero stored value. The accepted value is stored as a

  32-bit word at eUnusedExtraToolkitPtrsOffset + 4 (the field backing dword_2001064,

  the second entry of that pointer/offset table). Nothing is read back from the field;

  the function has no inputs and returns no value. Despite the "encryption_" name and

  r4-r7 being listed as preserved in the contract, the code never touches r4-r6 —

  only r7 is used, as a scratch pointer loaded from the literal pool. Flags are

  clobbered by the TST/bl sequence. The nonzero guarantee suggests the stored value

  is used as a seed or counter where 0 would be degenerate.

  '
