name: ai_initAttackVars93
address: '0x08012124'
kind: function
status: probable
summary: Initializes an AI attack's parameter block on a battle object, scaling base damage by the attacker's
  side and returning attack id 0x5d.
interface: (r0 = battle object ptr) -> r0 = 0x5d attack id; writes oAIAttackVars fields of the object's
  AI struct (via r7 in caller frame)
details: Calls GetBattleNaviStatsByte_AllianceFromBattleObject with r1=1 to read the object's side (alliance)
  byte, then computes damage as (side+1)*5, so red-team/white-team objects get 5 or 10 damage. It stores
  that into oAIAttackVars_Damage, 0x85 into oAIAttackVars_ExtraDamage, 6 into oAIAttackVars_AttackBoost2,
  and clears oAIAttackVars_ChargeCycles to 0. The constant return of 0x5d is almost certainly the attack
  index/id that a dispatcher (see caller sub_8012632) uses to select this initializer from a table of
  AI attack setups. r7 in the caller is the battle object/AI-attack-vars pointer the strh/str targets
  are relative to.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r1,#1; bl GetBattleNaviStatsByte_AllianceFromBattleObject reads the object''s alliance/side
    byte; add r0,#1; mov r1,#5; mul r0,r1; strh r0,[r7,#oAIAttackVars_Damage] → damage = (side+1)*5; strh
    #0x85 to oAIAttackVars_ExtraDamage and str #6 to oAIAttackVars_AttackBoost2 set fixed attack properties;
    strh #0 to oAIAttackVars_ChargeCycles resets charge counter; constant mov r0,#0x5d return suggests
    a per-attack id consumed by the caller''s dispatch'
