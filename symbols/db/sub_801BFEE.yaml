name: sub_801BFEE
address: '0x0801BFEE'
kind: function
status: hypothesis
summary: Tiny wrapper that tail-calls sub_801C002 with a fixed argument of 1 (some "enable"/mode-1 flag); all outputs
  come from the callee.
interface: void sub_801BFEE(void) -> results (r0-r3, nzcv flags) inherited from sub_801C002(r0=1, r4-r7/r10 passthrough)
details: Pushes lr, sets r0 = 1, and calls sub_801C002, then pops pc, so execution resumes directly from where sub_801C002
  returned. r4-r7 and r10 are only "inputs" because they are forwarded unmodified to the callee; r4-r7 are preserved
  across this wrapper since the callee preserves them. No state is touched here beyond the argument constant. Game
  meaning cannot be determined from the wrapper itself — it depends entirely on what sub_801C002's argument 1 selects
  (likely a boolean "on" value for whatever subsystem that routine drives).
