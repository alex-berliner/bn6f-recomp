name: rfu_endSlotConnections
address: '0x081450B4'
kind: function
status: probable
summary: 'RFU teardown helper: clears per-slot flags for the given player-slot mask, zeroes those slots''
  state, force-disconnects any of them that are linked, and reports the result via the connection callback
  with event 0x33.'
interface: (r0 = u8 bitfield of player slots) -> r0 = callback result; no meaningful flags
details: r0 is masked (8-bit) against a pending/request flag byte at eStruct200FE00+0x30; if no bits overlap
  it returns without doing anything, otherwise those bits are cleared in the flag byte. For each set bit
  i (0..3) it clears the halfword at eStruct200FE00+0x34+i*2 (four per-slot state entries). It then tests
  the slot mask against byte [dword_2010CC0]+3 (connected-slot byte of the link struct); any overlapping
  bits are passed to rfu_forceDisconnect, and the resulting masked value is stored to eStruct200FE00+0x14.
  Finally it fires the connection callback (eStruct200FE00+0x40) with event id 0x33 and that masked value,
  which also clears the +0x14/+0x16 state halfwords per the callee.
