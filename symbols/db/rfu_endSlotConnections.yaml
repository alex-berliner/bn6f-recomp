  date: '2026-10-19'
  detail: ldrb from eStruct200FE00+0x30, bic/strb clears exactly the caller's bits before any action;
    loop `asr r0,r4 / and r0,r5` over bits 0..3 zeroes halfwords at +0x34+bit*2 (four slot entries); mask
    & [dword_2010CC0+3] gates a call to rfu_forceDisconnect with that mask; result masked value stored
    to eStruct200FE00+0x14, then rfu_fireConnCallbackAndClearState(0x33, mask); callees' known summaries
