name: sub_800536E
address: '0x0800536E'
kind: function
status: hypothesis
summary: 'Overworld per-frame tick: runs all overworld subsystem updates, then if a screen fade is active drives
  the warp-landing countdown, playing cue sounds at fixed steps and finally triggering the chatbox and the map''s
  on-warp-enter event when the timer expires.'
interface: 'void sub_800536E(struct GameState *self /* r5 */);

  // preserves r4..r7; clobbers r0..r3, lr, N Z C V; returns none

  // (callees leave r8..r12 untouched on exit)

  '
details: "Self pointer comes in r5 and is a struct GameState.\n\n1) Calls a long, fixed sequence of overworld frame-update/draw\
  \ routines:\n   dispatch_80339CC, sub_80039AA, sub_8003AFA, sub_80027B4, sub_800286C,\n   sub_8003BF4, sub_8003E98,\
  \ npc_drawSprites_800467C, sub_8004298,\n   sub_8004590, sub_8004934, event_runArmedCallback_80024AE.\n   This\
  \ is plainly the \"tick everything\" body of a main game loop.\n\n2) Calls IsScreenFadeActive; if Z is set (no\
  \ fade in progress), bails out\n   with nothing else done.\n\n3) Otherwise treats GameState.oGameState_Unk_68\
  \ (at +0x68) as an s32\n   countdown for the warp-arrival sequence:\n     - decrement it by 1,\n     - if it just\
  \ went negative (field was 0 on disk), complete the warp\n       by calling chatbox_8040818() and then map_triggerEnterMapOnWarp_8005C04(),\n\
  \       which fires the map's \"on warp enter\" script,\n     - at countdown == 0x29 (41) plays sound id 0x171,\n\
  \     - at countdown == 0x9E (158) reads GameState byte +5 as a 0..1 index\n       into a small ROM table at hword_80053E0\
  \ = { 0xE7, 0xEC } and plays\n       that as a sound effect (early warp cue); if the index byte is > 1\n     \
  \  nothing is played at this step.\n\nQuirks:\n  - The countdown only goes negative when the field is already\
  \ 0; the\n    function only subtracts once per tick, so the \"complete the warp\"\n    branch is taken exactly\
  \ once on the tick after the timer expires.\n  - The sound choice for the late step (0x29) is hard-coded (0x171),\
  \ and\n    for the early step (0x9E) is selected by GameState+5 from a 2-entry\n    table; the choice variable\
  \ is documented as &le;1 and higher values\n    are silently skipped.\n  - The two sound effect sites correspond\
  \ to a layered warp-arrival cue\n    (early + late) using the game's regular SFX table.\n"
