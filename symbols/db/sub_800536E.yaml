open_questions:
- What exactly is GameState.oGameState_Unk_68? It looks like a "warp landing countdown in frames/ticks", but the
  field's semantic name and who initializes it (presumably a warp-start routine) are unknown.
- What does GameState byte +5 encode? It looks like a "warp cue variant" flag (0 or 1), but its full meaning is
  unknown.
- Are the called subroutines (dispatch_80339CC, sub_80039AA, ..., the chatbox/mappers) the canonical MegaMan Battle
  Network 6 overworld frame dispatcher components, or are they split out by some per-mode flag?
