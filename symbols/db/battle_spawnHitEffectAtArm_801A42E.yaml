name: battle_spawnHitEffectAtArm_801A42E
address: '0x0801A42E'
kind: function
status: confirmed
summary: While a battle object is being hit, computes its arm position and spawns the hit/damage effect there.
interface: void sub_801A42E(battleObject* obj /* r5 */, void* r4 /* preserved only */, ...); no meaningful return
  (r0-r3 clobbered, r4-r7 preserved)
details: 'Takes the battle object whose base pointer callers leave in r5 (self-ish "this" convention

  shared by battle object code) and reads its collision data pointer at

  oBattleObject_CollisionDataPtr. The effect is only spawned while the object is actually in a

  hit state: the collision timer byte at collisionData+0x74 and the hit-flash/hitstun counter

  halfword at collisionData+0x80 must both be non-zero; otherwise the routine returns without

  doing anything (note the early path leaves incoming r0-r3 untouched, so the "outputs r3"

  in the contract is just whatever flows through on the early exit).

  When active, it loads the object''s oBattleObject_NameID (halfword), passes literal 5 in r1

  (an attachment-point/hardpoint index, presumably "arm"), the oBattleObject_Alliance byte in

  r2 and oBattleObject_DirectionFlip in r3 to getBattleArmPositionMaybe_8018810, which returns

  an (x, y) position in r0/r1. It then calls sub_80E8124 with r0 = x, r1 = x<<16, r2 = 0,

  r3 = y<<16, r4 = 0 — the <<16 fixed-point packing suggests sub_80E8124 takes a fixed-point

  position effect spawner (hit spark / damage flash). r4 is saved/restored around the call and

  flags nzcv are all clobbered.

  Quirk: the x coordinate is passed both raw (r0) and shifted (r1), so sub_80E8124''s parameter

  convention is unusual or one of the two is a secondary use (e.g. scale/variant); the odd

  call signature is worth double-checking against other callers of sub_80E8124.

  '
