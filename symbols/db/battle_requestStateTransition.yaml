name: battle_requestStateTransition
address: '0x08007FD2'
kind: function
status: probable
summary: Requests the battle engine to switch to battle state 8 (resetting the phase counter), unless
  a global flag in the 0x200BC50 IWRAM struct is set.
interface: (r5 = *BattleState) -> void; no meaningful return value
details: Calls the test helper for IWRAM struct 0x200BC50 flag byte offset 5; if the flag bit is set the
  function returns without touching the battle state (early exit). Otherwise it writes 8 to BattleState
  field oBattleState_Index_00 (the pending/next state id consumed by battle_main_8007800 -> sub_8007B80),
  writes 4 to oBattleState_Index_01 (tick selector read by battle_state_tick_8007CA0), and clears the
  oBattleState_StatePhaseAndInitFlag halfword so the new state starts at phase 0/init. It is a pure state-transition
  request with no other side effects. The data words after it (bit masks, off_8008008 pointing at eStruct203F7D8)
  belong to neighboring functions, not this one.
