summary: Plays the cursor/grid-slide sound effect (SFX SOUND_CUR_MOVE_80) and writes 0x3F to the panel-slot byte
  at r5+8 to mark it filled.
interface: 'void sub_803ABF4(void); // inputs: r5 (panel-slot pointer), r2, lr; outputs: r5, r10; clobbers NZCV,
  r0, lr'
details: 'Calls PlaySoundEffect with sound ID 0x80 (SOUND_CUR_MOVE_80) - the cursor/grid-cell move SFX

  used when the player slides the highlighting panel across the grid. Immediately after, writes

  the byte 0x3F to offset 8 of the panel-slot structure pointed to by r5, flagging that slot as

  occupied (likely the "active panel" / filled-marker byte within the panel struct). Very short

  tail-call (pops PC from the saved r4-r7,lr frame), so it is a one-shot helper invoked from the

  caller once the panel position has been resolved.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
