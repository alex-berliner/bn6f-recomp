name: object_isPanelSolid
address: '0x0800CCB2'
kind: function
status: confirmed
summary: Tests whether the panel at an object's position is solid (solid-panel flag 0x10 of the panel parameters).
interface: u32 object_isPanelSolid(object*, u32 side); returns nonzero (0x10) if the panel is solid, 0 otherwise;
  NZ flags set from result for direct branching
details: Wraps object_getPanelParameters (r0 = object, r1 = side, e.g. which occupant's position to test) and ANDs
  the returned panel parameter byte with 0x10, the "solid panel" bit. The mask value 0x10 is left in r1 on return
  and the NZ flags are set from the masked result, so callers can both read the flag and branch on it immediately
  without retesting. Typical uses would be collision/blocking checks for objects standing on or moving to a panel.
