name: copyTwoDigitNumberTiles_8117B94
address: '0x08117B94'
kind: function
status: confirmed
summary: Decomposes an index (0-99) into tens and ones digits and copies the two matching 32-byte glyph/tile entries
  from a digit table into a caller-supplied buffer.
interface: void sub_8117B94(u32 index /* r0 */, void* dest /* r6 */); returns r6 advanced past both copied 0x20-byte
  entries; r7 preserved
details: 'Uses BIOS Div (svc 6) with r1 = 10 to split r0 into quotient (tens digit) and

  remainder (ones digit). The quotient selects an entry in the table at

  unk_2031204 (entries are 0x20 = 32 bytes, presumably digit glyphs/tiles);

  if the quotient is 0 (single-digit number) the tens copy is skipped, so no

  leading zero is emitted. The remainder entry is always copied. Each copy is

  a CopyByEightWords of 0x20 bytes from table + digit*0x20 into the r6 buffer,

  which is advanced by 0x20 between the two copies and ends 0x40 bytes past

  the start. Register contract: reads r0 (index) and r6 (dest pointer),

  returns updated r6 in r2/r6 slots per caller usage; r7 is saved/restored.

  Quirk: the buffer must hold 0x40 bytes even for single-digit values, where

  the first 0x20 bytes are left untouched rather than zeroed.

  '
