name: reqBBS_initRequestWorkArea_8046CC8
address: '0x08046CC8'
kind: function
status: confirmed
summary: Initializes the BBS request-board work area for the selected request board entry, zeroing its 0x34-byte
  buffer and recording the current map group for the return trip.
interface: void reqBBS_initRequestWorkArea_8046CC8(u32 slot /* r0 */, u32 toolkit /* r10 */); sets r2 = dword_8046B98
  (request data table base); clobbers r0, r1, lr, nzcv; preserves r3-r7
details: "Called when the player opens/picks an entry on the BBS request board (job requests).\nTakes the request\
  \ slot index in r0 (used later as \"byte_2011C14\") and the toolkit in r10.\n1) Zero-fills the 0x34-byte work\
  \ area at byte_2011C10 with ZeroFillByWord.\n2) Stores the slot index at byte_2011C10+4.\n3) Computes &dword_8046B98[slot\
  \ * 0x10] — the per-request data record (0x10-byte stride) —\n   and stores it at byte_2011C10+0x1C (dword_2011C2C);\
  \ also leaves the table base in r2.\n4) Stores reqBBS_requestInfo_textOffsets (per-request description/text offset\
  \ table) at\n   byte_2011C10+0x24 (dword_2011C34).\n5) Reads the toolkit's GameState pointer, copies the current\
  \ MapGroup (offset 4 of the game\n   state, halfword) into oGameState_LastMapGroup, so leaving the board can restore\
  \ the map.\nQuirk: despite the lifter listing r4/r6/r7 as outputs, the code only pushes/pops r4-r7 and\nwrites\
  \ nothing through them; only r2 is meaningfully returned. The r10 (toolkit) input is\nunusual — most callers here\
  \ pass it in a low register or via a global.\n"
