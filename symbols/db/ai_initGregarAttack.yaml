name: ai_initGregarAttack
address: '0x08104050'
kind: function
status: probable
summary: 'Initializes one of Gregar''s AI attacks: records the difficulty tier, fetches per-difficulty
  attack boost/timer values, locks on to the opposing player, and switches the enemy object into attack
  state 0xE.'
interface: (r0 = unused/ignored, r7 = enemy AIAttackVars struct, r5 = enemy battle object) -> r0 = destroyed;
  sets AiDifficultyTier, InitFlag=0, AttackBoost2, TimerOrCycles, TargetObjectPtr; starts attack id 0xE
details: Reads the enemy's AI-data difficulty via battle_getAiDifficultyTier_800FE36 and stores it at
  oAIAttackVars_AiDifficultyTier, then clears the InitFlag byte. Calls sub_810407E with argument 6 (likely
  an attack/state selector for the shared AI attack helper) and sub_8103F30, whose two return values are
  stored as AttackBoost2 and TimerOrCycles — the pair looks like a power multiplier and duration/cycle
  count scaled by difficulty. It derives the player's object by battle_findPlayer on the inverted Alliance
  bit and caches it in oAIAttackVars_TargetObjectPtr. Finally object_setAttack0(0xE) kicks the enemy object
  into the attack, mirroring the caller's RNG-gated attack selection in the Gregar AI state machine.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] right after battle_getAiDifficultyTier_800FE36
    shows per-difficulty setup; strb r0,[r7,#oAIAttackVars_AttackBoost2] / strb r1,[r7,#oAIAttackVars_TimerOrCycles]
    from sub_8103F30 look like power+duration parameters; eor with Alliance bit then battle_findPlayer
    and str [r7,#oAIAttackVars_TargetObjectPtr] caches the player as target; mov r0,#0xe; bl object_setAttack0
    switches the enemy object into an attack state; caller sub_8103CD0 is the Gregar AI step whose RNG<8
    gate selects this attack branch
