name: battle_waitParam2FramesThenAction4
address: '0x080D1094'
kind: function
status: probable
summary: Battle object step that arms a Param2-frame timer on first call (phase 0->4) and decrements it
  each tick; when the timer underflows it requests action 4 and resets CurPhaseAndPhaseInitialized to
  0.
interface: (r5 = battle object) -> updates oBattleObject_CurPhase, Timer, CurAction, CurPhaseAndPhaseInitialized;
  no return value
details: On phase 0 it stores 4 into oBattleObject_CurPhase, copies oBattleObject_Param2 into oBattleObject_Timer,
  and returns. On later phases it decrements oBattleObject_Timer each call; while the timer is still >=
  0 it does nothing further. When the timer underflows it writes 4 to oBattleObject_CurAction (requesting
  the next action) and zeroes CurPhaseAndPhaseInitialized so the next action restarts at phase 0. It is
  a per-frame step invoked with the object in r5, typical of battle object update dispatch.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst; strb #4 sets phase 4 on first run (80D1096-80D109E);
    strh r0,[r5,#oBattleObject_Timer] after ldrb from oBattleObject_Param2: Param2 seeds the wait timer;
    ldrh/sub #1/strh on Timer with bge: per-frame countdown while phase 4; strb #4 into oBattleObject_CurAction
    and strh 0 into CurPhaseAndPhaseInitialized on timer expiry: transition to action 4'
