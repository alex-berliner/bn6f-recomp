open_questions:
- The real meaning of the four dword values `0x03030306` indices, what the four installed callbacks at 0x80F8CF8
  / 0x80F8D3E / 0x80F8DA8 / 0x80F8DFE actually execute, and whether `oAIState_Unk_04` is a "ramp-up counter" that
  drives the AI to gradually escalate when HP is dropping (since it increments then resets), or an attack-script
  slot pointer. Renaming has a `_ADDRESS` suffix because the role of these state vars is inferred from offset names
  only.
