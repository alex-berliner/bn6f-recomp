status: probable
summary: 'Beast-SP entry dispatcher: jumps to one of six sub-handlers based on the actor''s CurPhase,
  then copies the actor''s Timer into the returned object''s FuturePanelRef-style field at offset 0xE.'
interface: (r5 = BattleObject*) -> r0 = new struct ptr (EWRAM/heap object) ; side effects writes a u16
  from r5+0x14 into r0+0xE
details: "- `push {lr}` / `pop {pc}` Tail-call style: save lr, do an indirect jump-table dispatch with\
  \ no stack frame preserved.\n  - `ldrb r1, [r5,#0xa]` reads `CurPhase` (offset 0xA in `BattleObject`,\
  \ the `CurPhase` field).\n  - `ldr r0, [r0,r1]` indexes a 6-entry function table at `off_8117FE0` by\
  \ `CurPhase` (values 0..5) -> `sub_8117FF8`, `sub_811800C`, `sub_8118030`, `sub_811805C`, `loc_8118098`,\
  \ `sub_81180E0`.\n  - `mov lr, pc ; bx r0` is a Thumb-to-Thumb call; after the bx, control returns to\
  \ `bl sub_8118314`. The callee (handler) leaves r0 = pointer to a per-phase state struct in EWRAM (e.g.\
  \ 0x02008470, 0x020084C8, ..., stepping by 0x58/0xA8).\n  - `sub_8118314` is called with (r5 = BattleObject*,\
  \ lr = site of return here). It returns something in r0 (contract: out = r0).\n  - `ldrh r1, [r5,#0x14]`\
  \ reads `FuturePanelXY` (offset 0x14) of the BattleObject, then `strh r1, [r0,#0xe]` writes that u16\
  \ into the returned object's +0xE (e.g. one of the per-beast EWRAM objects 0x02008470..0x02008xxx, which\
  \ from offsets look like an attack-vars-like struct). Note r0 here is *not* the BattleObject but the\
  \ heap/EWRAM struct returned by `sub_8118314` — the captured-call exit r0 values confirm that.\n  -\
  \ The whole function is the Beast-SP beast-specific phase dispatch wrapper, copying the actor's queued\
  \ panel coords into the SP beast object for the current phase.\n"
