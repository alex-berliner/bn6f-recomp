    explicit copy of the BattleObject''s FuturePanelXY (offset 0x14) into the per-phase EWRAM object''s
    0xE field. - The two captured entries (snap_0 with r1=0x04 and others with r1=0x04) confirm the `ldrb
    [r5,#0xa]` always reads the same phase for these BeastSP frames (r1=4 is just a constant in this call
