open_questions:
- The exact role of `sub_8118314` (the immediate callee after the table-jump) is not visible here — whether
  it allocates the EWRAM object, fills it, or merely fetches a cached pointer. Examining sub_8118314 would
  settle whether the EWRAM object is per-phase-static or per-frame allocated.
- Why this function then writes FuturePanelXY into r0+0xE (vs. some other field) is unclear without seeing
  the consumer struct.
