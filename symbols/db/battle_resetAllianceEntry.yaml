    The same alliance index is passed to battle_initAllianceEntryDefaults at 0x0802F0A0.; timer_2000000
    is passed to ClearAIData_Unk_44_Flag at 0x0802F0A4, clearing a battle-object AI condition/state flag.;
    sub_802F068 calls this function when its alliance-entry counter becomes zero or starts inactive at
