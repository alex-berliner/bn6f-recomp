name: battle_resetAllianceEntry
address: '0x0802F084'
kind: function
status: probable
summary: Resets the current battle object's alliance entry and clears its pending AI-data flag.
interface: '(r5 = battle object) -> void; flags: r0 is read from the object''s alliance index, and r1
  is used as a temporary byte/word value.'
details: The function obtains the battle object's alliance entry via its alliance index, optionally clears
  the entry's 16-bit field at offset 0x28 when byte 3 is nonzero, and then calls battle_initAllianceEntryDefaults
  on that entry. It finally clears the AI-data flag represented by timer_2000000 in the battle object's
  offset-Unk_44 flags. Its caller invokes it when the alliance entry's byte 2 counter reaches zero or
  when the entry is otherwise inactive, indicating entry cleanup/reset behavior.
