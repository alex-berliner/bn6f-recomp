name: battle_highlightCrossPanels
address: '0x080C7030'
kind: function
status: probable
summary: 'Marks a T/cross-shaped attack area on the battle grid: a 3-panel-tall column at the object''s
  own column plus a 4-panel horizontal ray forward from its row.'
interface: (r0 = column x of the object/area) -> r0 = clobbered; r5 must already hold the battle object
  pointer (read, not saved); no return value
details: First loop (r6 = 0..2) validates and highlights panels (r0, [PanelY]-1..+1), i.e. the vertical
  column of 3 at x = r0. Second loop (r6 = 1..4) computes x = object_getFrontDirection()*r6 + [PanelX]
  at y = [PanelY], skips the panel when it equals r0 (already highlighted), and highlights the rest —
  a one-row ray 4 panels in the object's facing direction, so the shape is a cross/T opening forward.
  Uses oBattleObject_PanelX/PanelY of the object in r5, which the function never sets itself, so the caller
  must have loaded it. Panel coordinates are 1-based and checked with object_isValidPanel before each
  object_highlightPanel call, so edge panels are safely clipped.
