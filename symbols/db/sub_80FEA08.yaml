name: sub_80FEA08
address: '0x080FEA08'
kind: function
status: hypothesis
summary: Computes a frame-count-like value for a battle object from two lookup-table entries (the second scaled
  by an ExtraVars counter), plus 60 frames if certain object flags are set.
interface: 'int battle_calcObjectTimer_80FEA08(BattleObject* obj)  // in: r5=obj; out: r0=computed value; clobbers
  r1,r2,lr,NZCV; preserves r4'
details: 'Takes a battle object pointer in r5. Looks up two entries through sub_800FE28 using

  indices from byte_80FEA34 (table bytes at +0 and +4 are both 0xE, so likely a

  per-object/element lookup rather than constants). The second lookup result is

  multiplied by the object''s counter at oBattleObject_ExtraVars+0xC, then added to the

  first. If object_getFlag(obj) & 0xA000 (both flag bits 0x8000 and 0x2000 set), an

  extra 0x3C (60, likely frames) is added. Returns the total in r0. The constant 60

  and the counter scaling suggest a duration (e.g. a status/flinch/timer length) that

  grows with the counter and is extended when the object is in a particular flagged

  state. Touches: byte_80FEA34 (lookup table), oBattleObject_ExtraVars+0xC, object

  flag word bits 0xA000.

  '
