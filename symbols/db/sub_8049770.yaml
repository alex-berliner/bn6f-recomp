summary: Scene/transition entry that configures LCD/palette/fade, zeroes several state bytes in the r5 struct, and
  enables chatbox layers 0 and 1 with state 4.
interface: void sceneEnter_8049770(struct *r5) -> *r0 [c/v set, *r3 *r8 *r9 *r10 *r11 *r12 written, r4 r5 r6 r7
  r8 r9 r12 preserved, r0 r1 r2 lr clobbered]
details: 'Sets the render-info LCD control to 0x1F40, runs the renderInfo_8001788 / renderInfo_80017A0 refresh pair,
  applies overlay palette index 0x13 via sub_80015FC, then runs sub_8046664 and copyData_8049A18. Starts a screen
  fade via SetScreenFade with fade frame count 8 and step 0x10. Clears state bytes in the r5 struct at offsets 0x08,
  0x12, 0x1C, 0x1D, 0x13. Calls sub_803BEC0, sub_8049CBC, and the object-link trio sub_803A740 / sub_803A752 / sub_803A764.
  Enables chatbox layers 0 and 1 via sub_803BE30, then calls chatbox_8040818, and finally writes state value 4 to
  byte +1 of the r5 struct (leaving nz flags set).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
