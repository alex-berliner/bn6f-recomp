name: sub_8034E3C
address: '0x08034E3C'
kind: function
status: confirmed
summary: Searches one of three hardcoded u16 lists for the halfword at [r7,#4] and returns the byte offset of the
  match (or of the 0xFFFF terminator if absent), with the Z flag marking "not found".
interface: 'u32 sub_8034E3C(u32 listIndex /*r1*/, /*r7*/ struct with u16 field at +4); out: r0 = r2 = byte offset
  of match or terminator, Z set when NOT found (NZ from notFound flag); r1/r3 clobbered, r4/r6 preserved despite
  r4 being written locally'
details: 'Selects a u16 array from the pointer table at off_8034E64 (entries byte_8034E74, dword_8034E80, dword_8034E84
  — lists such as {1,4,5,1,0,0,4,0,0x93,0x91}) using r1<<2 as an index into off_8034E64. The lists are terminated
  by 0xFFFF. It scans with a byte offset counter (stepping 2 per entry) until a halfword equals the value stored
  at [r7,#4] of the caller''s struct. On match or terminator it returns the byte offset; the caller is expected
  to use that offset as an index (offset/2) into a parallel table, or to branch on the flag to handle "not in list".
  Note the terminator''s offset is also a valid return, so callers using the result as a zero-based index into parallel
  data rely on the Z flag to distinguish the miss case.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
