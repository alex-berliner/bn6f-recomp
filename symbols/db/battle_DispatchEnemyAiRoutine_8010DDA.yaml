name: battle_DispatchEnemyAiRoutine_8010DDA
address: '0x08010DDA'
kind: function
status: confirmed
summary: Battle AI dispatcher — looks up an enemy's AI routine by actor type and AI index and tail-calls it.
interface: 'battle_DispatchEnemyAiRoutine(u16 enemy_idx /* r0 */); mostly pass-through: r3-r12 are forwarded untouched,
  r0-r2 and flags carry the AI routine''s entry state (r0 = routine address, r1 = actor_type*4, r2 = 0, Z=1/N=0/C=0);
  LR set to 0x8010DF4 for the AI routine, which returns through "pop {pc}" to this function''s caller'
details: 'Called with r0 = enemy index. First calls GetVerActorTyAndAIIdx_80182B4(enemy_idx), which returns a pointer
  to a per-enemy record whose byte at +1 is the actor_type (e.g. virus/enemy category) and byte at +2 is the ai_index.
  It then walks a two-level dispatch table at off_8010E0C: [actor_type*4] selects a table of AI routines, and [ai_index*4]
  within that table selects the routine. Finally it branches to the routine with the entry state the AI expects:
  r0 = routine address, r1 = actor_type << 2, r2 = 0, and the flags left by "lsl r2,#2" plus "mov r2,#0" (Z=1, N=0,
  C=0 — the shift''s carry is always 0 for a byte value). The AI routine''s return address is set to 0x8010DF4 (the
  "pop {pc}" inside this function), so when it returns, control flows back to sub_8010DDA''s own caller, making
  this effectively a parameterized tail-call into the AI system.'
