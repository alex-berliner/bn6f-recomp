name: mail_drawSelectedEntry_80478D4
address: '0x080478D4'
kind: function
status: confirmed
summary: Redraws the currently highlighted mail-list entry — its icon tiles, name strip, and the text shown in the
  mail reader.
interface: 'void sub_80478D4(u32 entry /* r5: mail list entry object */, void* toolkit /* r10: toolkit struct */)
  — no return value; clobbers r0-r3, lr and flags; preserves r4-r9 per its own push/pop'
details: 'Takes the mail list entry object in r5 and the toolkit in r10. Reads the highlighted row index from entry+0x08
  and a value from entry+0x1C''s pointee (entry info record). If that value is 1, an alternate tile-id table (unk_2019404)
  and alternate text style (0xD) are used instead of the default ones (unk_2019204, style 0xE) — likely a "read/unread"
  or special-mail variant. First call CopyBackgroundTiles(j = 0x1E - (cursor - 0xC), i = 0, tile block 2, icon tiles,
  9x5) to draw the entry''s icon, positioned one background row higher per list row. Then CopyBackgroundTiles(j
  = 0x1E - (cursor - 0xD), i = 2, tile block 0, byte_8046B58, 7x2) to draw the name strip just below the icon. Finally
  it stores entry+0x28 (the entry id) into slot 8 of the struct at toolkit+oToolkit_Unk200a220_Ptr (shared menu
  state), so the reader knows which mail is selected, and calls renderTextGfx_8045F8C with the reader text pointer
  from entry+0x24, style 0xD/0xE, source gfx unk_2015A00, destination VRAM 0x600A400, params 7 and 1, lookup table
  dword_86A5D60, and 0. Quirk: r5 (the entry) is read by the callee but the caller inlines its save/restore of r4-r7
  only; r5 is listed as an input the callee reads but the routine never modifies it beyond the push/pop.

  '
