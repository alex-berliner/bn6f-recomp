    run wf investigate investigate-20261019-015108'
open_questions:
- sub_80158CC is undocumented, so the triggering context (which chip/AI event calls this) is unknown
- the meaning of the value 0x3C0 in oAIData_PoisonDamagePerTick (raw damage per tick vs. encoded) is not
  confirmed
- exact meaning of NaviStats+0x0E byte (poisoned flag vs. counter) rests on the callee's summary
