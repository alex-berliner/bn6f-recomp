name: record_getNthSubRecordPtr_8116CD4
address: '0x08116CD4'
kind: function
status: confirmed
summary: Returns a pointer to one of sixteen 16-byte sub-records inside a record, chosen by the high nibble of the
  record's byte at offset 2.
interface: Next record_getNthSubRecordPtr(void /* r5 = record pointer */); returns r0 = record + 16 * (byte[2] >>
  4)
details: 'Takes a record pointer in r5 and reads the byte at r5+2, whose high nibble (0..15) selects which of sixteen
  16-byte sub-records to use. It masks the nibble (lsr 4, lsl 4) and returns r5 + 16*nibble in r0, i.e. the base
  address of the selected 16-byte entry. No other state is touched; the caller presumably keeps r5 valid. The tail-call
  via mov pc, lr means flags are clobbered only by the shifts. The layout strongly suggests an array of 16 fixed-size
  entries embedded in a header record, with a type/index field at offset 2 doubling as the selector (e.g. a category
  byte where the low nibble holds other flags/data).

  '
