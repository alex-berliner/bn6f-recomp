name: rfu_linkDispatch
address: '0x0803C8E8'
kind: function
status: probable
summary: 'Per-frame wireless link dispatch: clears finished peer slots, then routes execution to one of
  two sub-handlers based on the link-state byte at +0x1 and a sub-structure flag at +0xC.'
interface: () -> r0 = clobbered; no meaningful return; flags set by the cmp/tst of the state bytes
details: Loads the base pointer byte_200AF80 (a wireless adapter state block) and first calls rfu_clearDisconnectedSlots
  on it, which scans the four peer slots for finished connections and resets the player block when all
  are done. It then reads the state byte at +0x1; if it equals 1 and the byte pointed to by the dword
  at +0xC is nonzero, it calls sub_813D978, otherwise sub_803C90C. This is a top-level per-frame tick
  of the wireless communication task, branching between two sub-modes of the state machine. The dword
  at 0x200AF8C acts as a pointer into a sub-structure whose first byte is tested as a condition/flag.
  No return value is produced; the function is purely control-flow dispatch over the shared link state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrs off_803C944 = byte_200AF80 and passes it to rfu_clearDisconnectedSlots, tying this to the
    wireless slot bookkeeping; cmp state byte at [r4,#1] to 1 selects between two handler calls, a classic
    state-machine dispatch; test of *(dword at +0xC) gates the sub_813D978 branch, so +0xC is a pointer
    to a sub-state structure; no callers known and no return value used, consistent with an externally
    scheduled per-frame tick
