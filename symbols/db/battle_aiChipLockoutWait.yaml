name: battle_aiChipLockoutWait
address: '0x08089BE4'
kind: function
status: probable
summary: AI routine that waits until the chip lockout timer expires, then issues action 0xE and stores
  state 0x88 before returning 1.
interface: (implicit r5 = byte state field pointer) -> r0 = 1 always; flags from battle_tickChipLockout
  result inside
details: First calls battle_tickChipLockout_8089CB4, which decrements AIData+0x18 (ChipLockoutTimer) and
  flags when it reaches/exceeds zero. If the timer has not expired, the function skips the body and just
  returns 1. When the lockout expires, it calls sub_8089CA4 with r0=0xE (meaning unknown, possibly an
  AI action/command code) and then stores the byte 0x88 to [r5]. r5 is never loaded in this function,
  so the caller must have it pointing at some per-entity state byte (likely an AI step/state field). The
  function unconditionally returns 1, suggesting it is one step of a larger AI dispatcher loop that keeps
  running until told otherwise.
