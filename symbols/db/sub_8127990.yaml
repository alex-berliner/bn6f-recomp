name: sub_8127990
address: '0x08127990'
kind: function
status: hypothesis
summary: 'Pet-submenu completion handler: preps the pet menu to be redrawn on return, and if the caller''s pointer
  is non-NULL, flags sSubmenu.unk_0D = 1 to actually draw it.'
interface: void sub_8127990(u32 somePtr /* r0 */, u32 unused /* r10 */, u32 ret /* lr */); /* r2 preserved */
details: 'Pushes r4/lr; saves r0 in r4. Calls pet_prepareMenuOnReturn_811F6C0 to ready

  the pet/navi-cust menu state for when the caller resumes. If the saved r4

  pointer is non-zero, writes 1 to sSubmenu.unk_0D (sSubmenu base 0x02009A30),

  the "show submenu on return" flag. R2 is intentionally preserved across the

  call (not pushed), so callers can rely on its value across this routine.

  No other globals/structures are written.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
