summary: Setter that stores a halfword argument into the submenu state struct field at offset 0x26.
interface: (r0 = value to store) -> void; writes halfword to sSubmenu+0x26
details: The function loads the address of sSubmenu and stores r0 as a 16-bit value at offset 0x26 of
  that struct, then returns. It has no other logic, no branches, and calls nothing, so it is purely a
  field setter for the submenu state. The meaning of the field (selection index, cursor, mode flag, etc.)
  is not determinable from this function alone. Both callers, sub_8133A68 and sub_8133B18, would need
  analysis to learn what value is being recorded.
