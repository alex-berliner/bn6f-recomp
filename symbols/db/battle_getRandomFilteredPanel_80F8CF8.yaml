name: battle_getRandomFilteredPanel_80F8CF8
address: '0x080F8CF8'
kind: function
status: confirmed
summary: Picks a random 3x3 battle-grid panel matching column/row filters, falling back to an except-current
  list, then to raw battle-state coordinates.
interface: u32 battle_getRandomFilteredPanel_80F8CF8(u32 col_filter /*r2*/, u32 row_filter /*r3*/, BattleState*
  bstate /*r5*/); -> r0=panel index (0-7), r1=row/type nibble; r5,r7 preserved; nzcv,r2,r3,lr clobbered.
details: 'Reads a mode byte from bstate+0x13 and uses it (with col_filter=r2, row_filter=r3) to query
  object_getPanelsIgnoreColumnFiltered into a 32-byte stack buffer at sp+8. If that returns zero panels,
  retries via object_getPanelsExceptCurrentFiltered (passing bstate directly). If both lists are empty,
  outputs the raw row byte (bstate+0x12) and column byte (bstate+0x13) as r1 and r0 respectively. Otherwise,
  calls GetPositiveSignedRNG, takes the result modulo the panel count via SWI 6 (ARM divide), indexes
  the buffer, and decodes the selected panel byte: bits 0-2 give the panel index within the column (r0),
  bits 4-7 give the row/type nibble (r1). The 0x20-byte stack frame holds the filter args and the panel-list
  buffer.'
