name: object_getClosestPanelMatchingRowFiltered
address: '0x0800D086'
kind: function
status: confirmed
summary: Scans rows opposite to this object's facing side from a panel six rows behind, returning the first row
  whose panel passes the parameter and validity checks, or 0 if none qualify.
interface: u32 object_getClosestPanelMatchingRowFiltered(u32 r0 /* row */, u32 r1, u32 r2, u32 r3) -> u32 r0 /*
  row or 0 */; preserves r1-r5; flags nz/c/v set from r0 on return
details: 'Saves r0-r3 on entry, then calls object_getAllianceDirection(r0) to get the alliance-facing step direction
  and negates it (r5 = -result), so iteration walks away from the alliance side.

  Computes the starting row as r0 = -5 * saved_row + 6 (= 6 - 5*row), placing the scan start six rows behind the
  object''s row in alliance steps.

  Loops: at each candidate row restores r1-r3, calls object_checkPanelParameters; on success returns the row in
  r0 with r1-r3 restored. Otherwise advances row by step, restores r1-r3, calls object_isValidPanel; if valid re-runs
  the parameter check at the new row, and if invalid returns 0.

  r1-r5 are preserved across the whole call (saved/restored around each helper); only r0 and lr are clobbered.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
