name: bg_drawTileStripTileBlock2_8126404
address: '0x08126404'
kind: function
status: confirmed
summary: Blits a horizontal strip of background tiles, 8 tiles wide, into tile block 2, either from a caller-supplied
  tile id table or as a plain fill depending on a flag.
interface: void bg_drawTileStripTileBlock2_8126404(u32 j /*r0*/, u32 i /*r1*/, const u16 *tileIds /*r2*/, u32 iSize
  /*r3*/)
details: 'Wrapper around the two background-drawing routines. The destination strip is at background coordinates
  (j, i) in tile block 2 (one of the 32x32 tile blocks) and is always j_size = 8 tiles wide; iSize (r3) gives the
  strip''s length along i. Uses r7 as a base pointer to a caller frame/context and tests bit 0 of the word at [r7+0x7C]:
  when the flag is clear it forwards (j, i, tileIds, tileBlock=2, j_size=8, i_size) to CopyBackgroundTiles to blit
  the caller''s tile id table; when the flag is set it instead calls sub_3005EBA with tileIds = NULL, which fills
  the same strip without a tile id table. r0/r1 pass straight through unchanged, r2/r3 are consumed as arguments
  (r3 doubles as both tileIds and iSize on the alternate path, which is why the pointer is kept in r6 first). r4-r7
  are saved and restored around the call since both drawing routines clobber them; on return r3 holds whatever the
  drawing routine left there. Flags nzcv are clobbered.

  '
