name: MapScriptCutsceneCmd_jump_if_current_navi_not_equal
address: '0x080379A0'
kind: function
status: confirmed
summary: Cutscene script command that jumps to a script address if the navi currently installed in the PET differs
  from a given navi id operand.
interface: u32 MapScriptCutsceneCmd_jump_if_current_navi_not_equal(u32 cursor /* r7 */, u32 r10, lr); returns new
  script cursor in r7; sets NZ from constant 1; clobbers r0 r3 r4 r6 lr, C/V
details: 'Map script cutscene command handler. The script cursor in r7 points at a

  1-byte navi id operand followed by a 4-byte jump target word. It calls

  ReadMapScriptByte (with a mode byte 1 in r6 and the cursor in r7) to read

  the navi id; the callee returns the byte''s value in r4 and the post-byte

  cursor in r7. It then calls GetCurPETNavi (using r10 as context) to get the

  navi currently installed in the PET, returned in r0. If the two ids differ,

  it sets r6=2 and calls ReadMapScriptWord to read the 4-byte jump target

  (target in r4, updated cursor in r6/r7), then returns with r7 = target,

  i.e. script execution continues at the target address. If the ids are

  equal, it falls through by advancing the cursor past the id byte and the

  word: r7 += 6. Both paths load r0 = 1 before returning (NZ flags reflect

  that constant), and the return is a plain pop {pc} back into the script

  interpreter dispatch. The cursor/return-value passing through r7 matches

  the other cutscene script command handlers.

  '
