name: battle_destroyObjectReleasePanel_80D035C
address: '0x080D035C'
kind: function
status: confirmed
summary: Destroys a battle object and releases the panel area it had reserved.
interface: void sub_80D035C(void) with the object in r5; returns the same object pointer in r5
details: Takes a battle object pointer in r5, reads its oBattleObject_PanelX and oBattleObject_PanelY bytes, calls
  object_removePanelReserve with (panelX, panelY) to free the panel area the object was occupying/reserving, then
  calls object_genericDestroy to run the standard object teardown (which frees the object slot). The object pointer
  is preserved through both calls and handed back in r5, so callers can keep the (now-dead) pointer in r5 afterwards.
  r5-r7 are preserved; nzcv and r0-r3/lr are clobbered.
