name: spawn_panelObjectRowOffset
address: '0x080E1DAC'
kind: function
status: probable
summary: 'Battle object spawn/initialization routine: places the object on its panel, loads sprite resource
  0x80 with animation data, disables its shadow, starts animation 2 with palette 0, and switches it to
  the update state.'
interface: (r5 = battle object pointer, no register args) -> r0 = CUR_STATE_UPDATE stored into object
  state field; no return value
details: This is a spawn-handler-style routine that operates on the object in r5 rather than via arguments.
  It first calls object_setCoordinatesFromPanels to derive pixel X/Y from the object's panel grid position,
  zeroes the Z field, and then, unless the object sits on PanelY==3, pushes it 0x30 pixels down in both
  Y16 and Z16 — so all rows except the back/last row render 48px lower. It loads sprite resource r0=0x80
  with arguments 0x10/0x13 via sprite_load plus sprite_loadAnimationData, and calls sprite_noShadow so
  the entity draws without a battle shadow. It sets flag bit 2 in oObjectHeader_Flags, selects animation
  index 2 (written to CurAnim, CurAnimCopy, and via sprite_setAnimation), reloads animation data, sets
  palette 0, and finally stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object begins normal per-frame updates.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels immediately at entry, then Y16/Z16 += 0x30 guarded by ''ldrb
    r0,[r5,#oBattleObject_PanelY]; cmp r0,#3; beq'' — row-dependent placement of a spawned object; mov
    r1,#0x10 / mov r2,#0x13 / mov r0,#0x80 / bl sprite_load followed by sprite_loadAnimationData and sprite_noShadow
    — sprite setup for the new entity; orr flag bit 2 into oObjectHeader_Flags and animation index 2 written
    to CurAnim/CurAnimCopy before sprite_setAnimation; tail state store: ''mov r0,#CUR_STATE_UPDATE; str
    r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]'' — classic end-of-spawn transition
    to the update state; listed in the battlesweep recorded route with callees all battle-object sprite/state
    helpers, matching a spawn handler'
