name: object_countdownTimer_801CA0C
address: '0x0801CA0C'
kind: function
status: confirmed
summary: Decrements an 8-bit countdown timer on an object each call and dispatches event 0x100 once it reaches zero.
interface: void sub_801CA0C(struct Object* r5)  /* r5 preserved; returns flags and r0 of "SUBS timer,#1" while counting,
  r0=timer value; on expiry r0-r3/flags are those left by the two callees */
details: 'r5 points to some game object/struct whose byte field at +0x0B is a per-frame (or per-tick) countdown
  timer. Each call loads the byte, subtracts 1, and stores it back; as long as the result is nonzero the call ends
  there (r0 = new timer value, flags from the decrement). When the counter reaches 0, the value 0x100 is loaded
  into r0 and passed first to sub_801BED6 and then to dispatch_801DACC (both treat r0=a0); presumably the first
  is a setter/lookup helper and the dispatcher actually fires whatever event/flag/script 0x100 corresponds to. Quirk:
  the check is only "result != 0", so if the timer field is already 0 the decrement wraps to 0xFF and no event is
  fired — the timer must be preloaded with a value >= 1 by whoever owns the object. The timer is not reloaded after
  expiry, so the event fires exactly once (subsequent ticks wrap through 0xFF..1 silently until the field is rewritten
  elsewhere).

  '
