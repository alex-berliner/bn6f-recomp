name: battleObject_syncSpriteFromOwner_80B8DA6
address: '0x080B8DA6'
kind: function
previous_names:
- sub_80B8DA6
status: probable
summary: 'Per-frame: copy the navi sprite''s X/Y/Z pos into this battle object''s coords, then mirror
  the related object''s color shader/palette/alpha/flip onto this object, and tick the sprite unless paused/timestopped;
  destroys this object if its extra-vars length is zero.'
interface: '(r5 = this battle object, r10 = toolkit, lr) -> r5 preserved ; side effects: writes object
  header flag bits 0x02, mutates r5+oCoords (0x34..0x40), r5+oBattleObject_RelatedObject1Ptr->sprite fields,
  and on a zero length, clears OBJECT_FLAG_VISIBLE and forces CUR_STATE_DESTROY.'
details: '1. Loads r4 = this object''s RelatedObject1Ptr (offset 0x4c), the sprite owner whose palette/shader/flip/alpha/mosaic
  this object copies.

  2. Reads its X/Y/Z (offsets 0x34/0x38/0x3c), adds this object''s XVelocity/ZVelocity (offsets 0x40/0x48),
  subtracts this object''s byte-0xC sign-extended << 16 (an X-offset tweak of the related object''s coords),
  and stores the result back to the related object''s coord block (writes to r4+0x34..+0x40). So the "navi"
  sits relative to this battle object plus its own velocity.

  3. Merges this object''s header flag byte 0x02 (OBJECT_FLAG_VISIBLE) with the related object''s flag
  byte 0x02 (`and r0, !2; and r1, 2; orr`): this object''s visibility follows the related object''s.

  4. Mirrors sprite state from RelatedObject1Ptr onto this object via the four paired getter/setter pairs:
  ColorShader (0x08002edc → 0x08002ed0), FinalPalette (0x08002dc8 → 0x08002db4), MosaicScalingParameters
  (0x08002ce0 → 0x08002c7e), Flip (0x08002f7e → 0x08002f5c). Each set call uses r5 (this object) as the
  destination sprite owner.

  5. If the dword at *this.oBattleObject_ExtraVars is 0 (length sentinel/array-empty), it clears OBJECT_FLAG_VISIBLE
  on this object and writes CUR_STATE_DESTROY (0x08) into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  (offset 0x8), bypassing the rest.

  6. Otherwise: if Param3 (offset 0x6) is non-zero, only check `battle_isTimeStop`; if it is zero, check
  `battle_isTimeStop` first and bail out on either being true by reading from related object schedule
  check, then call `battle_isPaused`. If neither paused nor time-stopped, calls `object_updateSprite(r5,
  r10, lr)` to actually tick the animation.

  '
