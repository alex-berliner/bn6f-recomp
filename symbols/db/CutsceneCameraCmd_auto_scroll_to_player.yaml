name: CutsceneCameraCmd_auto_scroll_to_player
address: '0x08037104'
kind: function
status: confirmed
summary: Cutscene-camera command that auto-scrolls the overworld camera toward the player on X, Y and Z each tick,
  returning 1 while it has not yet arrived; on arrival it clears the command's wait fields and advances the cutscene
  counter.
interface: void CutsceneCameraCmd_autoScrollToPlayer_8037104(u32 r1_counter, u32 r5_cmdState, u32 r10_toolkit);
  returns r0=1; live-out r1 (counter, +1 on arrival), r2 (first differing player coord, 0 on arrival), r3 (camera
  Z), r6 (camera obj ptr), r7 (player obj ptr); flags = CMP(camera, player-X) for axis 0, else CMP(camera, player)
  on the first still-differing axis, else CMP(0, ~counter) from the ADDS-counter+1 path; clobbers nz,c,v,r2-r4,r6-r7,lr.
details: 'Pulls camera object from toolkit+oToolkit_CameraPtr (r6) and the overworld

  player object from toolkit->oGameState_OverworldPlayerObjectPtr (r7). For

  each of X/Y/Z it reads camera+oCamera_{X,Y,Z} and player+oOWPlayerObject_

  {X,Y,Z}, computes (target - camera), and adds the result of

  CutsceneCamera_GetAutoScrollDeltaForCoord into the camera coord, storing

  it back. Then it compares the new camera X/Y/Z to the player''s X/Y/Z in

  order; if all three match the command finishes, otherwise it keeps

  returning 1. On finish it writes 0 to cmdState+6 (byte) and cmdState+4

  (halfword) - clearing the cutscene command''s wait/active fields - and

  returns r1 incremented by 1 so the cutscene dispatcher advances to the

  next script step. r0 is hard-coded to 1 either way (command consumed).

  Quirks: the per-axis order matters because the loop exits at the first

  differing axis and the original assembly only sets r0/r1 once after that

  single CMP, so the exit flags are always the compare of the first

  non-matching (camera, player) pair (or the final ADDS of counter+1 when

  the camera is already on the player).

  '
