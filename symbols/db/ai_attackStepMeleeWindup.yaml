name: ai_attackStepMeleeWindup
address: '0x080FC26A'
kind: function
status: probable
summary: 'AI attack step handler: winds up for 30 frames, marks the panel in front as the hit area at
  frame 20, spawns its effect sprite, and resolves the attack when the timer expires.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = clobbered; updates oAIAttackVars_AttackElement,
  CurAnim, StepTimer, HitElement
details: 'A per-frame AI attack state machine keyed off oAIAttackVars_AttackElement: on entry (element
  0) it sets element 4, switches the object to animation 5, plays sound 0xB0, calls sub_80FCF90 with oAIAttackVars_ScratchVar,
  sets object counter time to 12, and loads StepTimer with 0x1E. While the timer runs it decrements StepTimer;
  when it reaches 0x14 it calls sub_80FCE40(x+frontDir, y, 6) to register the attack on the panel directly
  in front of the object, then calls object_getFrontDirection/object_getFlip and object_getCoordinatesForPanels
  to spawn effect object 0x25 (+0x100*flip) at that panel''s pixel position. When the timer hits 0 it
  writes 0x14 into oAIAttackVars_HitElement and returns, leaving the attack armed for the damage-resolution
  path.'
