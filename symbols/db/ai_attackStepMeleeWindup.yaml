- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne guards a first-entry init block setting
    element 4, anim 5, timer 0x1E; PlaySoundEffect(0xb0) and object_setCounterTime(0xc) in the init block;
    at timer==0x14: object_getFrontDirection + PanelX/PanelY feed sub_80FCE40(x+dir, y, 6); object_getFlip<<8
    + 0x25 passed as effect kind to spawn_t1_0x0_EffectObject at the front panel''s screen coords; timer
    0 path stores 0x14 to oAIAttackVars_HitElement and returns without further work'
