name: pet_addNaviStatsByte18AndMarkField16
address: '0x0813CE26'
kind: function
status: probable
summary: Adds r4 to byte 0x18 of the selected PET navi's NaviStats record and then sets byte 0x16 to 3.
interface: (r0, r1 unused) r4 = amount to add -> r0 = 0 (from SetCurPETNaviStatsByte); no flags
details: 'The function performs a read-modify-write on field 0x18 of the NaviStats struct of the navi
  currently selected on the PET: it reads the byte, adds r4 (passed in by the caller, not as an argument),
  and stores it back via SetCurPETNaviStatsByte. It then unconditionally writes the constant 3 into byte
  0x16 of the same struct, suggesting a state/level/type field that must follow a change to 0x18. All
  arguments to the getters/setters (slot 0, offsets) are hardcoded; only the delta comes from the caller.
  The three callers at 0x0813CE08/12/1C appear to be tiny wrappers that each pre-load r4 with a different
  value.'
