name: logoScreen_init_803D1FC
address: '0x0803D1FC'
kind: function
status: confirmed
summary: 'Initialises the title/logo screen: configures LCD and fade mode, resets graphics, loads logo
  tiles, starts logo BGM, and advances the state machine to index 4.'
interface: logoScreen_init(*mut LogoScreenState r5) -> r0 = 4, r4 = fade_mode (4 or 0xC); flags nz/c/v
  clobbered; r5-r7/r10 preserved
details: 'Checks bit/byte at LogoScreenState + offset 5 (Unk_05): if non-zero uses fade mode 4 and LCD
  control 0xC0 (fast/short fade, extra LCD bits), otherwise fade mode 0xC and LCD control 0x40. Calls
  sub_80015FC(0xE) as a preliminary step (purpose unknown). Sets render-info LCD control, flushes render
  info (0x8001788, 0x80017A0), starts a full-brightness screen fade (SetScreenFade(mode, 0xFF)), resets
  all graphics state, runs a one-shot setup step and clears the work area, calls sub_80027C4, loads the
  logo tile data (logoScreen_loadLogoTiles_803D2B8), starts logo-screen BGM track 0x63 (music_80005F2),
  and writes state index 4 to LogoScreenState + offset 0 so that logoScreen_dispatch_803D1CA will execute
  the next sub-step (sub_803D24C) on the following frame. Returns 4 in r0 and the fade mode in r4.'
