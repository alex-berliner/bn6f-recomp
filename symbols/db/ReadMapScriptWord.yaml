name: ReadMapScriptWord
address: '0x080360C8'
kind: function
status: confirmed
summary: Reads a 32-bit big-endian word from the map script stream and advances the cursor.
interface: "u32 mapScript_ReadWord(void);\n  // inputs:  r6 = byte offset into script, r7 = script base pointer\n\
  \  // outputs: r4 = 32-bit big-endian word read from [base+offset]\n  //          r7 = restored base pointer (r7\
  \ += r6, then restored on return)\n  //          r6 = trashed (last byte of the word)\n  // flags:    N/Z set\
  \ per the result value; C/V clobbered\n"
details: 'Computes the effective address by adding the caller-provided offset (r6) to

  the script base pointer (r7), then reads four bytes in big-endian order at

  [base+3], [base+2], [base+1], [base+0], accumulating them into r4 via

  shift/or. The routine is paired with the r7=base/r6=offset convention used

  throughout the map script interpreter: r7 points at the current command,

  and r6 holds the size of that command''s arguments, so the same r7 value

  returned by the caller plus r6 will land on the start of the next script

  word. r7 is restored on pop (the base pointer is preserved across the

  call), while r6 is left holding the last byte read -- callers must reload

  their offset before the next call. Only the final LSL in the chain updates

  flags (N/Z reflect the assembled 32-bit result); C/V are clobbered by the

  shifts/orrs. The body comment notes this flag behavior but it does not

  appear to be relied on by any documented caller.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
