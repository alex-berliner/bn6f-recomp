name: scanFrontPanels_800FAF6
address: '0x0800FAF6'
kind: function
status: confirmed
summary: Walks an object forward panel-by-panel up to 5 panels and returns a per-column result byte (e.g.
  free panel range) used by battle panel/state logic.
interface: u8 scanFrontPanels_800FAF6(u32 x, u32 y, u32 column, struct BattleObject* object /* r5 */)
  -> r0=tableByte, r1=index, r2=6, flags from col*6 + steps
details: "- Reads the object's facing direction via object_getFrontDirection and uses it as the\n  per-panel\
  \ step delta added to x.\n- Loop: calls object_getPanelParameters(x, y); if it returns 0 the walk has\
  \ left the\n  field and stops; otherwise the panel's type word is tested against a per-alliance\n  stop\
  \ mask at byte_800FB4C (4-byte entries at indices {0x80,0,0x88,0xD, 0x80,0,0x88,0xE})\n  selected by\
  \ oBattleObject_Alliance << 2; any matching bit terminates the walk.\n- Otherwise increments the step\
  \ counter and adds the facing delta to x.\n- Caps the count at 5 (FRONT_SCAN_MAX_STEPS).\n- Final index\
  \ = column * 6 + steps (clamped), used to read a byte from the per-column\n  result table at byte_80209CC;\
  \ that byte is returned in r0.\n- r2 is left holding the literal 6 (the mul operand), and flags come\
  \ from the final\n  add.\n- Stack frame holds the running step counter at [sp] and the original r2 (column)\
  \ at\n  [sp+4].\n"
