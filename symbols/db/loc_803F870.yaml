summary: Failure path inside toolkit_initAndVerifyWorkArea_0803F838, taken when the work area's checksum or the
  info-text timestamp check fails - result TRUE, EVENT_1704 cleared, primary RNG seed reset to 0xA338244F (SeedRNG).
interface: A branch target, not a function (reached by bne from two places in toolkit_initAndVerifyWorkArea_0803F838).
  Sets r4 = TRUE, clears EVENT_1704, calls SeedRNG, then joins the shared tail at loc_803F87E (RandomizeExtraToolkitPointers,
  r0 = r4, tst r0, r0, pop {r1-r7,pc}), so the function returns r0 = TRUE with Z clear.
details: 'toolkit_initAndVerifyWorkArea_0803F838 (asm03_1_1.s:13806) runs sub_814D8F0 and encryption_save_memSetFlags_8006E0E

  over the 0x6710-byte work area at timer_2000000, then SetExtraToolkitPointers, and checks two things in order:

  verifyEwramWorkAreaChecksum_803F8C4 (bne at asm03_1_1.s:13823) and infoText_IsTimestampUnchanged_803F8F4 (bne
  at

  13825). Either failure branches here. When both pass it sets r4 = FALSE and sets EVENT_1704 instead, and does
  not

  touch the RNG seed.


  So SeedRNG (ePrimaryRngSeed = 0xA338244F) runs again on this path only. RandomizeExtraToolkitPointers, on both
  paths,

  draws one GetRNG. Callers of the function: sub_8000F86 (asm00_0.s:1878) and the start screen (asm03_0.s:19904),

  each continuing only when it returns FALSE (bne past the follow-up).


  vidsync (docs/vidsync/BN6F_SYMBOLS.md section 1, level A) notes the same: SeedRNG runs on load only if the save

  checksum or timestamp check fails. Its line reference there (asm03_1_1.s:13567) is stale; the label is at 13830.

  '
