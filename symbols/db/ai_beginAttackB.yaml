name: ai_beginAttackB
address: '0x08112666'
kind: function
status: probable
summary: Initializes an enemy AI's attack-state variables and starts attack id 0xB via object_setAttack0.
interface: (r7 = enemy object, called as tail/leaf with no args) -> r0 = result of object_setAttack0;
  no flags meaningful
details: 'Writes the object''s oAIAttackVars block: AiDifficultyTier=2, AttackBoost2=0x12, TimerOrCycles=0x13,
  ScratchVar=3 and AiAttackParam=3 (word stores of 3), then calls object_setAttack0 with r0=0xB to begin
  the attack. The pattern matches the other small per-attack setup stubs whose pointers (byte_81122xx
  tables, ai_pickFilteredPanelOrRandom, sub_81123EC) are gathered in the data right after the function,
  i.e. this is one entry of that enemy''s AI attack routine table. No caller is known directly, but the
  recorded routes (battlesweep, beastsp) run it during battle AI updates. The trailing data is unrelated
  neighboring tables, not used by this stub.'
