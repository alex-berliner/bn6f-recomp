name: object_updateAirborneFall
address: '0x080CE64C'
kind: function
status: probable
summary: 'Per-frame update for an airborne battle object: moves it via velocities, counts down its air
  timer, highlights its target panel, and on touchdown resets Z, syncs collision, and switches to action
  4.'
interface: (r5 = battle object) -> void; sets CurAction=4 and phase=0 when Timer expires
details: Reads the object's XVelocity/ZVelocity and integrates them into its X and Z (Z decreases by ZVelocity,
  i.e. falling/rising in air). The Timer is decremented each frame; while it is still counting, every
  8th frame (bit 3 of Timer) it calls object_highlightPanel on the object's PanelX/PanelY, drawing a landing-marker
  on the target panel. When the timer underflows, it forces Z back to 0x40000, recomputes pixel coordinates
  from panel coords, refreshes the collision record and sets collision region 1, then sets CurAction=4
  and clears the phase state so the next action step can run.
