name: battleObject_updateSpriteAndMaybeReloadAnim_80A827C
address: '0x080A827C'
kind: function
status: confirmed
summary: Advances a battle object's sprite each frame; if the event-flag-driven animation priority differs from
  the stored animation ID (byte at offset 5), reloads the sprite's animation data and clears its shadow before ticking.
interface: void battleObject_updateSpriteAndMaybeReloadAnim(u32 r5 /*battleObject*/, u32 r10 /*toolkit*/, lr); /*->
  r2 r3 r4 r5 clobbered, nzcv clobbered*/
details: 'Calls battleObject_checkSetPriorityByEventFlag_80A82DC(r5) to obtain the animation ID that current event
  flags dictate. Reads the desired ID from battleObject+5 (u8). If they match, skips straight to sprite_update.
  If they differ, calls sprite_setAnimation with the new ID, sprite_loadAnimationData (which returns updated r4/r5
  pointers into the object), and sprite_noShadow to clear the shadow sprite. Finally sprite_update advances position,
  frame index, and collision. Registers r4 and r5 are threaded through the reload path: on skip, caller''s r4 is
  returned unchanged; on reload, r4/r5 come from sprite_loadAnimationData. r10 (toolkit pointer) is passed implicitly
  to callees that expect it.'
