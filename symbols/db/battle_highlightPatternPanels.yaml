name: battle_highlightPatternPanels
address: '0x080F9BDC'
kind: function
status: probable
summary: Highlights a fixed pattern of battle panels for an object's attack, mirroring the x column when
  the object is on the enemy side.
interface: (r0 = pattern index 0-3, r5 = battle object) -> void; calls object_highlightPanelRegion(x,
  y, effectWord, flip<<8|alliance)
details: 'Uses r0 as an index into a byte-pair table at byte_80F9C0C giving (x, y) grid coordinates: (1,1),(4,2),(4,2),(1,3).
  If the object''s Alliance field is nonzero (enemy side), x is flipped to 7-x so the pattern lands on
  the player''s side. It then loads a 32-bit value from byte_80F9C18 indexed by r0*4 (0x23, 0x24, 0x25,
  0x23), likely the panel-highlight effect/type, and combines the object''s DirectionFlip (<<8) with its
  Alliance into the flags argument. Finally it calls object_highlightPanelRegion to mark those panels,
  matching the standard pre-attack panel-tell pattern used by enemy attacks.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1 from byte_80F9C0C pairs (1,1),(4,2),(4,2),(1,3) are small grid coordinates 0-7; sub
    r0, r2, r0 with r2=7 under Alliance!=0 flips the column for the enemy side; ldr r2, [r2,r3] with r3=index*4
    picks effect word 0x23/0x24/0x25 from byte_80F9C18; orr r3, r4 packs DirectionFlip<<8 | Alliance as
    flags for object_highlightPanelRegion; tail call to object_highlightPanelRegion, the known panel-highlight
    routine
  refs:
  - bn6f/asm/asm31.s:142695
  - 0x080F975A sub_80F975A
  - 0x0800CCD4 object_highlightPanelRegion
  reproduce: python3 tools/asmcat.py 0x080F9BDC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-030611'
