name: sub_800B892
address: '0x0800B892'
kind: function
status: hypothesis
summary: Resolves an object pointer via sub_800BF5C and returns byte 1 of the resolved structure, likely a type/flag
  field.
interface: u8 sub_800B892(void* obj /* r0 */); reads r0, lr; returns r0 (and r1 per contract, untouched by this
  wrapper); clobbers nzcv
details: Trivial one-line wrapper. It tail-calls sub_800BF5C with the caller's r0 (an object pointer) and then loads
  the byte at offset +1 of whatever pointer that resolver returns (LDRB r0,[r0,#1]). Nothing else is touched, so
  the only thing known about this function is the field it reads; the contract shows r1 as an output, which must
  come from the callee sub_800BF5C rather than this wrapper itself. Until sub_800BF5C's resolution semantics are
  understood (what kind of object/handle it maps and what its offset-1 byte means — type, subtype, or an enabled/state
  flag), the game-level meaning stays open.
