summary: 'Proposed name: beastoutSelectionScreenTileGfxA. ROM tile graphics (0x540 bytes) for the Beast-Out
  selection screen, DMA''d to BG VRAM at 0x6009560 (table of 4bpp tiles)'
details: Holds 4bpp GBA tile data, queued as the source pointer in QueueEightWordAlignedGFXTransfer with
  size 0x540 and destination 0x6009560 (BG VRAM). Also referenced as the source for a single 0x20-byte
  sprite tile row in loadOneSpriteTileRow_80287D2. Paired with dword_87225B4 in the off_8028708 dispatch
  table, which selects between the two campaign variants (Gregar/Falzar) based on the player state. Owned
  by the Beast-Out selection screen loading path; pure ROM graphics resource.
