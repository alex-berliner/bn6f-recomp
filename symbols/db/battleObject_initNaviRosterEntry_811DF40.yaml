name: battleObject_initNaviRosterEntry_811DF40
address: '0x0811DF40'
kind: function
status: confirmed
summary: Initializes a battle object as a navi-type sprite (offscreen staging position), then hands it to a roster-filling
  helper identified by r6.
interface: void battleObject_initNaviRosterEntry(r1 param, r5 obj, r6 rosterEntry) -> r2, r3, r5 (results of sub_811DF94);
  clobbers r0, r1, flags
details: 'Takes a battle object in r5 and marks it as kind 0x23 (navi) by storing 0x23 to

  [r5+0]. Calls the shared sprite helper at loc_8002774 with r0=0x3B (sprite

  sheet id) and the caller''s r1 forwarded unchanged, then configures the sprite:

  animation 0, load animation data, no shadow, sub-entry palette bank 0xB,

  palette 0, sub-record field A = 0, and stores halfword 0x270 (624) through

  slotList_storeHalfwordAndClearField_800306C. Sets sprite priority 1 and

  coordinates (x=0xD2=210, y=0xA=10) — an offscreen staging spot typical for

  objects waiting to enter the battle. Finally clears the flag byte at [r5+9],

  sets [r5+8] = 4 (state byte), and tail-calls sub_811DF94 with r5 (object) and

  r6 (roster entry selector/index) forwarded; the r2/r3/r5 triple that helper

  leaves is this function''s result, so its exact effect on the object is not

  visible here.

  '
