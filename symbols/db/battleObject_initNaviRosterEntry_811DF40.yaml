- method: assembly-reading
  date: '2026-10-14'
  detail: '- `strb r0, [r5]` with r0=0x23 right at the start sets the ObjectHeader first byte to a fixed
    value (asm32.s:31860). - The chain `sprite_setAnimation(0) -> sprite_loadAnimationData() -> sprite_noShadow()`
    (asm32.s:31864-31866) shows a brand-new sprite with default anim and no shadow. - Palette configuration
    uses three palette calls in sequence (asm32.s:31867-31872), all to zero or to the same sub-entry.
    - `slotList_storeHalfwordAndClearField_800306C` is given constant 0x270 (off_811DF90 = 0x270), a roster-tag-like
    value (asm32.s:31874-31876). - `sprite_setCoordinates(0xD2, 0x0A)` (asm32.s:31879-31880) hard-codes
    the position; 0xD2 is well off the right side of the battle panel grid, consistent with the roster
    strip in the NetBattle pre-battle screen. - `strb r0, [r5,#9]` (CurAction = 0) and `strb r0, [r5,#8]`
    with r0=4 set CurState = CUR_STATE_UPDATE (asm32.s:31882-31883) before tail-calling sub_811DF94.'
