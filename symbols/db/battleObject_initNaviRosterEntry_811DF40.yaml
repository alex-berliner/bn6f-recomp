name: battleObject_initNaviRosterEntry_811DF40
address: '0x0811DF40'
kind: function
previous_names:
- sub_811DF40
status: probable
summary: Initialise a battle object's sprite + position for one of the pre-battle Navi roster tiles (e.g.
  the lineup icon shown at the start of a NetBattle).
interface: '(r5 = BattleObject*, r10 = is the Toolkit) -> void ; side effects: clobbers r0-r6, sprite
  sub-state and sprite slot fields, then tail-calls sub_811DF94.'
details: '1. Sets [r5+0] = 0x23 (ObjectHeader byte 0; matches CurState 0x20 | INITIALIZE pattern but the
  value 0x23 looks like a direct opcode/state for an init entry).

  2. Calls loc_8002774 with r0=0x3B (probably a sprite/animation resource ID) to populate the sprite sub-record.

  3. Loads animation 0 into the sprite (sprite_setAnimation), then loads its animation-data tables (sprite_loadAnimationData),
  and clears the shadow (sprite_noShadow).

  4. Configures palette: sub-entry palette bank = 0xB (sprite_setSubEntryPaletteBank_800304A), palette
  index = 0 (sprite_setPalette), sprite +0xA field = 0 (sprite_setSubRecordFieldA_8003060).

  5. Stores halfword 0x270 into the slot (slotList_storeHalfwordAndClearField_800306C) — likely a "kind"
  tag such as roster icon / sub-marker.

  6. Sets OAM priority = 1 (sprite_setPriority_8002E14), then places the sprite at (x=0xD2, y=0x0A) via
  sprite_setCoordinates.

  7. Writes [r5+9] = 0 (CurAction) and [r5+8] = 4 (CurState = CUR_STATE_UPDATE); CurPhase byte untouched.

  8. Tail-calls sub_811DF94 to continue the per-object init for the roster tile.

  This is a thin constructor used during battle init for one of the lineup/roster objects; the position
  0xD2,0x0A is the far-right roster slot.

  '
