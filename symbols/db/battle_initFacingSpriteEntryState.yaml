name: battle_initFacingSpriteEntryState
address: '0x080DC61C'
kind: function
status: probable
summary: 'Entry/state-init handler for a battle object: loads its sprite, applies facing flip and a facing-direction
  X offset, sets collision region and a sound, then hands off to the update state.'
interface: (r0/r1 unused; r5 = battle object header) -> r0 = sub_80DC668 result; no meaningful flags
details: Calls battleObject_initSpriteAndCollision_8011504 with sprite id 0x1044 and palette/data pointer
  0x56050300; on failure it frees the object slot and returns. On success it sets bit 1 of oObjectHeader_Flags,
  applies object_getFlip via sprite_setFlip, positions via object_setCoordinatesFromPanels, then offsets
  oBattleObject_X by frontDirection * 0x280000 (a half-panel shift in facing direction). It stores collision
  region 0x28 via object_setCollisionRegion, plays sound effect 0xF3, writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  and calls sub_80DC668 (presumably the update-state handler or a state-queue helper). The shape is a
  classic per-object state entry function for one specific object type.
