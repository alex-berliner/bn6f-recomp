name: sub_80F2330
address: '0x080F2330'
kind: function
status: confirmed
summary: Runs one battle object's per-state update (dispatching on its CurState byte) and then updates its sprite.
interface: void battle_object_updateByState_80F2330() // battle object in r5; returns updated object pointer in
  r5 and pass-through r8-r12
details: 'Reads the object''s CurState byte (oBattleObject_CurState) from the battle

  object in r5 and uses it as a byte index into the jump table at off_80F2348

  (ldr r1, [r1, r0], unmasked, so CurState values beyond the 3 entries would

  read past the table). It then calls the selected handler with the original''s

  `mov lr, pc; bx r1` idiom, passing r0 = CurState and r1 = table entry/handler

  pointer, with r5 still holding the battle object. Three handlers are

  registered: state 0 -> sub_8016F56, state 1 -> sub_80F2354 (a local handler

  just after this function), state 2 -> sub_8016C4E; these are shared

  object-state routines, suggesting a common CurState scheme across object

  types. After the handler returns, object_updateSprite is called with the

  object pointer the handler left in r5, applying the shared sprite animation/

  position update. The handler''s r8-r12 values are preserved by

  object_updateSprite and pass through as this function''s outputs; r5 out is

  whatever object pointer the sprite update leaves. Flags are clobbered.

  Note: the dispatch is not a tailcall - lr is reloaded for the sprite call,

  so the handler is an ordinary (long-lived, register-convention) call.

  '
