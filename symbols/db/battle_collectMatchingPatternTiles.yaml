name: battle_collectMatchingPatternTiles
address: '0x080E3038'
kind: function
status: probable
summary: Walks a panel-offset pattern list, testing each offset tile against panel-flag conditions and
  writing matching tile coordinates to a buffer, returning the match count.
interface: (r0 = base x, r1 = base y, r2 = panel flag mask that must be set, r3 = mask that must be clear;
  r4 = pattern index into PanelOffsetListsPointerTable, r6 = alliance id, r7 = output byte buffer) ->
  r0 = number of matching tiles written
details: Loads a pointer from PanelOffsetListsPointerTable at entry r4*4, giving a list of (dx, dy) signed
  byte pairs terminated by a 0x7F dx sentinel. Converts r6 via object_getAllianceDirection to +1/-1 and
  multiplies each dx by it, so enemy-side entities mirror the pattern horizontally. For each offset it
  calls object_checkPanelParameters on (baseX + dx*dir, baseY + dy) with the two masks from r2/r3; on
  success it packs the tile as x | (y<<4) into r7[count] and increments the count. Returns the number
  of matched tiles; the buffer contents are ordered by list order. Used by battle object/entity code to
  test shaped panel areas (e.g. patterns of holes, grass, or other panel states) around an entity.
