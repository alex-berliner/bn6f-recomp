status: confirmed
summary: Dispatches the player's battle-object state machine by CurState, then runs the shared post-state hook.
interface: void playerObject_main_80EA460(void); /* r5 = player battle-object pointer (BattleObject*) */
details: "Reads the CurState byte at oBattleObject_CurState on the battle-object pointed to by r5,\nindexes into\
  \ a 3-entry thumb jump table at off_80EA478, and bx-jumps to the matching\nhandler with the byte value in r0:\n\
  \  state 0 -> playerObject_init_80172F0   (init)\n  state 4 -> playerObject_update_80EA484 (per-frame update)\n\
  \  state 8 -> sub_8016C4E                 (likely teardown/exit)\nAfter the dispatched handler returns, control\
  \ falls through to sub_801BCF4, the shared\npost-state hook called for every state. The function only preserves\
  \ lr across the whole\ndispatch (push {lr}; ... pop {pc}); the per-handler tail call reuses lr as a temp for\n\
  the bx, so caller-saved regs (r0-r3, r12) are implicitly clobbered across the dispatch.\nReturn values to the\
  \ caller come from r5/r8/r9/r10/r11/r12 as per the lifter contract,\nwhich means sub_801BCF4 (and possibly handlers)\
  \ populate those registers as outputs.\n"
