name: GetRenderInfoLCDControl
address: '0x08001780'
kind: function
status: confirmed
summary: Returns the u16 LCD control value (DISPCNT) recorded in the current frame's render info block.
interface: u16 GetRenderInfoLCDControl(void) — reads toolkit via r10 (frame pointer), returns value in r0; clobbers
  r1
details: 'Trivial accessor: copies r10 (toolkit/frame register) into r1, loads the toolkit''s RenderInfo pointer
  from offset 8 (oToolkit_RenderInfoPtr), then loads the halfword at offset 0 of the RenderInfo struct (oRenderInfo_Unk_00)
  and returns it in r0. In game terms this reads the LCD control halfword (the DISPCNT value the renderer tracks
  for the current frame, controlling which display layers/backgrounds are enabled) so callers can inspect or replicate
  the active video configuration. Nothing else is touched; r1 is used as scratch and clobbered.

  '
