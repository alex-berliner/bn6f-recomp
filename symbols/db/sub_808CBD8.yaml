name: sub_808CBD8
address: '0x0808CBD8'
kind: function
previous_names: []
status: probable
summary: Spawns overworld map object type 0x11 (sub_80A8394), sets EVENT_1700 and GameState.JackOutLockState = 3,
  and plays sound_8000672(0x1F, 0x13B) except in map group 0x85; returns 0. Used in the JudgeTree and Pavilion comps.
interface: (r10 = toolkit, r4 = passed on as the new object's ObjectID +4) -> r0 = 0 with Z set (a cutscene native
  that does not wait); r5 preserved (the new object's pointer is dropped), r4-r7 preserved; r1-r3, lr clobbered
details: "Body (asm24.s:1274-1300): push {r5}; SpawnOverworldMapObject(r0 = 0x11, r1 = r2 = r3 = 0, r4 as it came);\n\
  pop {r5}; reqBBS_setFlag_e17b0f7_8140A00 (which sets EVENT_1700, reqBBS.s:4800); gameState_setUnk09_8001172(3)\n\
  (stores GameState.JackOutLockState, \"03 = can't jack out\" in include/structs/GameState.inc); if GameState.MapGroup\n\
  != 0x85 (PAVILION_COMP), sound_8000672(0x1F, 0x13B); r0 = 0.\nSpawnOverworldMapObject stores r0 at the object's\
  \ +1 (the type that OverworldMapObjectUpdateJumptable dispatches\non; entry 0x11 is sub_80A8394) and r4 at +4\
  \ (ObjectID). This routine never sets r4, so +4 gets the caller's r4:\nthrough the cutscene command it is the\
  \ command's own function pointer (CutsceneCmd_call_native_with_return_value\nreads ptr1 into r4 and does bx r4,\
  \ so r4 = 0x0808CBD9).\nThe type-0x11 object, in its state 0 (sub_80A83B8 -> sub_80A84C4), puts itself at one\
  \ of 8 angles around\nMegaMan (angle byte_80A8510[reqBBS_81409D0(8)]; X/Y = his (ReadOWPlayerObjectCoords) plus\
  \ cos/sin times 0x6000;\nZ + 0x80 px): one RNG draw\nper spawn, made by the object and not by this routine. Its\
  \ state 8 (sub_80A8484) undoes this routine's work:\nJackOutLockState = 0, EVENT_9D8, EVENT_9FF and EVENT_9D9\
  \ cleared, reqBBS_clearFlag_8140A0C, object freed.\nTwo callers (asm24.s):\n  1095 cutscene byte_808CA48 (text\
  \ archive TextScript87DBE98, EVENT_1731 and EVENT_9D8 set, then\n       cs_call_native_with_return_value ptr1=sub_808CBD8+1);\
  \ battle_pickBattleStateInitPtr_808CC34 picks it\n  1158 sub_808CAD4 when EVENT_9D8 is set (after which it calls\
  \ reqBBS_setFlag_e17b0f7_8140A00 and\n       gameState_setUnk09_8001172(3) again); sub_808CAD4 is a map-script\
  \ native of the JudgeTree comp\n       (maps/JudgeTreeComp/data.s:110, 145) and the Pavilion comp (maps/PavilionComp/data.s:172),\
  \ run on\n       entering a map of the same group\nvidsync's BN6F_SYMBOLS.md and RANDOM_EVENTS.md call this the\
  \ JudgeMan \"trial\" (map object type 0x11) among the\nusers of reqBBS_81409D0 (level A); vidsync never reads\
  \ or writes anything of it.\n"
