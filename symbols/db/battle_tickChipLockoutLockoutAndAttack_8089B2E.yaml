name: battle_tickChipLockoutLockoutAndAttack_8089B2E
address: '0x08089B2E'
kind: function
previous_names:
- sub_8089B2E
status: probable
summary: AI handler that locks the chip queue and queues a PwrAtk chip when the chip lockout timer is
  active.
interface: '(r5 = AIData*, r7 = ?, r10 = Toolkit*) -> r0 = 1 ; side effects: writes AIData[0x18]=0x70,
  calls chatbox_8045EDC with r1=Toolkit+0x10, calls sub_8089CA4(0x11), calls sub_8089CB0(0x1e).'
details: "1. Probes a chip-lockout condition via battle_tickChipLockout_8089CB4 which returns the\n  \
  \   AIData.ChipLockoutTimer (offset 0x19) in r0 and sets flags. If the result is zero the\n     function\
  \ returns 1 immediately.\n  2. On a non-zero chip lockout value it sets r0=2 and loads the BattleObject-related\n\
  \     pointer at r7+0x10 into r1, then calls chatbox_8045EDC (the chatbox controller) so\n     that\
  \ the lockout message / state is pushed through the chatbox using the toolkit.\n  3. Calls sub_8089CA4(r0=0x11)\
  \ which (from the surrounding 0x89C.. code) arms the\n     \"chip lockout active\" tick/state in the\
  \ AI data.\n  4. Calls sub_8089CB0(r0=0x1e) which writes 0x1e into AIData.Unk_18 (offset 0x18 in\n \
  \    AIData), i.e. ai_setAIDataUnk18_8089CB0.\n  5. Stores 0x70 into AIData.Unk_19 (ChipLockoutTimer,\
  \ loc=0x19) via r5 (the AIData ptr\n     that is in r5 on entry - notice strb r0,[r5] after r0=0x70).\
  \ This appears to be a\n     longer-than-typical reload of the lockout countdown.\n  6. Always returns\
  \ r0=1 (constant tail via loc_8089B50).\n  Overall: when the AI attempts a chip selection while still\
  \ locked out, this routine\n  forces the lockout timer high and queues the standard \"chips locked\"\
  \ response via the\n  chatbox plus the PwrAtk-button (0x1e) state write.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battle_tickChipLockout_8089CB4` followed by `beq loc_8089B50` (returns 1 when lockout
    == 0). - `mov r0,#2` / `ldr r1,[r7,#0x10]` / `bl chatbox_8045EDC`: arms chatbox using r10 (toolkit)
    and r1 as a battleobject-related pointer. - `mov r0,#0x11` / `bl sub_8089CA4`: r10 is preserved across
    the call (in its contract), so sub_8089CA4 uses Toolkit+0x10 (BattleState) path. - `mov r0,#0x1e`
    / `bl sub_8089CB0`: matches the callee''s contract in={r0,r5},out={}; writes 0x1e to AIData+0x18.
    - `mov r0,#0x70` / `strb r0,[r5]`: directly stores 0x70 into AIData[r5], i.e. AIData.ChipLockoutTimer
    at offset 0x19. - `mov r0,#1` / `pop {r4-r7,pc}`: unconditional r0=1 return. - Caller snapshots show
    AIData (r5) and the battleobject pointer (r7) carried over from an AI tick driver at 0x080895B8.'
