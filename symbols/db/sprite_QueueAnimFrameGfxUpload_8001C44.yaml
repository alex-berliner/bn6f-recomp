name: sprite_QueueAnimFrameGfxUpload_8001C44
address: '0x08001C44'
kind: function
status: confirmed
summary: Queues an 8-word-aligned VRAM upload of an animation frame's graphics using the frame data linked from
  the anim state.
interface: void sprite_QueueAnimFrameGfxUpload(void* gfxDataNext /* r0 */, GFXAnimState* animState /* r7 */)
details: 'r0 points to a GFXAnimDataNext entry whose ParamNext field holds the address of the frame''s graphics
  data; r7 is a GFXAnimState whose Param0 slot holds the VRAM destination and whose Param1 slot holds the transfer
  size. The function reads those three values and calls QueueEightWordAlignedGFXTransfer(src=(*r0).ParamNext, dest=animState.Param0,
  size=animState.Param1) to enqueue the tiled graphics upload for this animation frame. r4-r7 are preserved across
  the call; r0-r3 are scratch.

  '
