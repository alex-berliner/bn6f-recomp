open_questions:
- Exact semantics of object_applyDamage's r0=0 argument (apply stored collision damage vs. add 0) and
  where the damage amount is stored
- Meaning of the alliance flag masks 0x05800000/0x0A800000 in byte_80D3B00 (which collision flags force
  destruction)
- What sub_80D3F32 does in the destroy path, and which callers invoke this routine (none known)
