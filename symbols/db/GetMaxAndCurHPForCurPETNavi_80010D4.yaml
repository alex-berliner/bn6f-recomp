name: GetMaxAndCurHPForCurPETNavi_80010D4
address: '0x080010D4'
kind: function
status: confirmed
summary: Reads the max HP and current HP of the navi currently equipped in the PET and returns them as a pair.
interface: u16 pet_GetMaxAndCurHPForCurNavi(u8 which_navi); /* returns curHP in r0, maxHP in r1; c=v=0, nz from
  the adds-encoded "mov r1, r6" (i.e. from maxHP) */
details: 'Wrapper around GetCurPETNaviStatsHword: saves which_navi (r0) into r4, first requests stat offset oNaviStats_MaxHP
  (result kept in r6), then requests stat offset oNaviStats_CurHP for the same navi, and returns with r0 = current
  HP and r1 = max HP. which_navi selects which navi slot in the PET/navi stats structure to read; all actual field
  access happens inside GetCurPETNaviStatsHword. r4-r7 are preserved (pushed/popped). The final "mov r1, r6" is
  encoded as "adds r1, r6, #0", so the carry/overflow flags are always cleared and the n/z flags reflect the max
  HP value — callers reading flags get them from maxHP, not a meaningful comparison.

  '
