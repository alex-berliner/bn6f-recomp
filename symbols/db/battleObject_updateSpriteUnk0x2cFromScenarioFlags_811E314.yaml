status: probable
summary: Builds a per-battle-object sprite-Unk0x2c bitmask by clearing scenario-effect bits, then stores
  it on the object's sprite
interface: '(r5 = object pointer in r5 per caller convention) -> r0 = updated Unk0x2c value, r5 preserved
  ; side effects: writes to r5''s ObjectSprite Unk_2c; clobbers r0,r2,r3,r4,r6,r7'
details: "Loads the constant mask 0x0FFFFFFF into r7 (note: the source literal `0xFFFFFFF` has 7 hex digits\
  \ -> 0x0FFFFFFF, see dword_811E358). For each of effect indices 0,1,2,3 it calls `battle_checkScenarioEffectActive_8142190`\
  \ with that index, then computes `1 << (27,20,13,6)` shifted right by r0 (the boolean return) so the\
  \ bit is 0 when the effect is active. Each computed word is AND-cleared out of r7 with `bic r7, r2`.\
  \ The resulting 28-bit value (bits 27,20,13,6 conditionally cleared) is stored into the object's sprite\
  \ field via `sprite_setUnk0x2c(r5, r0)`. The caller at 0x0811e2b4 passes r5 holding a battle/object\
  \ pointer and r10 a related object; this routine uses only r5, suggesting r5 is the target object whose\
  \ sprite Unk0x2c is being configured, likely to suppress certain sprite effects (mushroom / invisibility\
  \ / flashing / dust-style animations) tied to active scenario effects.\n  Quirks: the constant stored\
  \ as `0xFFFFFFF` is only 7 hex digits (high nibble 0), so r7 starts as 0x0FFFFFFF; only the low 28 bits\
  \ matter for the four AND-clears (bits 27,20,13,6). The function is `void`-like from the caller's perspective\
  \ (callee-saved r5 is preserved, and the returned r0 is purely the value handed to `sprite_setUnk0x2c`).\n"
