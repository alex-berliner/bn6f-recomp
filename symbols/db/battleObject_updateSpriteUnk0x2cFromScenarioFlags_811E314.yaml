  date: '2026-10-14'
  detail: '- `ldr r7, dword_811E358 // =0xfffffff` (`dword_811E358` literal in source) seeds an all-ones
    low-28-bit mask. - Four sequential `bl battle_checkScenarioEffectActive_8142190` calls with r0=0..3
    (`mov r0, #0/1/2/3`, then `bl`). - Each branch builds `mov r2,#1; lsl r2,r2,#0x1b/#0x14/#0xd/#6` then
    `lsr r2,r0` — `1<<N` masked down to 0 if the boolean returns 1, producing a per-index "clear-if-active"
    mask. - `bic r7, r2` accumulates cleared bits across the four indices. - `mov r0,r7` followed by `bl
    sprite_setUnk0x2c` is the documented "stores a 32-bit value into field 0x2c" path. - Caller sub_811E2B4
    lists r5 in its in contract, confirming object-in-r5 convention here too. - captured-call snapshots
    (snap_beastsp_0180000_*) all show r0=0x000000dc, r1=0x24, r2=0, r3=0x02011880 at entry — consistent
    with this being called from one battle-object update routine for Beast SP effects.'
