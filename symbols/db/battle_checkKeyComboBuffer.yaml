name: battle_checkKeyComboBuffer
address: '0x08012956'
kind: function
status: probable
summary: Sliding 3-frame key-history buffer that reports when two specific buttons (mask 0x22) have both
  been pressed within the window, used by the charge-attack step.
interface: '(r0 = state struct: +0 done flag, +1 slot idx, +2 frame timer, +4/+6/+8 key history halfwords;
  r1 = current key input) -> r0 = 1 if both keys seen within 3 frames, else 0'
details: Each frame while the done flag (+0) is clear, it stores r1 (raw key input) into a rotating slot
  at +4 + 2*index (index cycles 0-2 via +1) and increments the frame counter at +2; after 12 frames it
  sets the done flag and returns 0. It then ORs the three history halfwords and ANDs with 0x22 — if both
  bits (B and Left on GBA key mapping) appear in any of the last 3 frames, it sets the done flag and returns
  1. This detects a quick two-button input combo (e.g. both keys tapped within ~3 frames) rather than
  an exact sequence. The timeout path also latches the flag, so the caller presumably reinitializes or
  abandons the struct afterwards.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'strh r1,[r0,r2] with r2 = 2*idx+4 stores input into one of three halfword history slots (loc_801296C);
