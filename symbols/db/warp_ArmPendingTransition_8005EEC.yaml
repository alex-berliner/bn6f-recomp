name: warp_ArmPendingTransition_8005EEC
address: '0x08005EEC'
kind: function
status: confirmed
summary: Arms the warp state machine to move the player to a chosen warp, storing its data pointer, warp index,
  and map-group transition type.
interface: void sub_8005EEC(void* warpDataPtr /*r0*/, u8 warpIndex /*r1*/, u8 transitionType /*r2*/); // r10 = toolkit
details: 'Reads the toolkit''s pointer to the warp state struct (oToolkit_Warp2011bb0_Ptr) and writes four fields:
  sets byte oWarp2011bb0_Unk_10 to 1 (marks a pending/active warp request), stores (warpIndex + 1) into oWarp2011bb0_WarpIndex
  (1-based warp index within the group), stores the warp data pointer r0 into oWarp2011bb0_WarpDataPtr (pointer
  to the target warp''s entry in the warp table), and stores r2 into oWarp2011bb0_MapGroupTransitionType (the kind
  of map-group transition to play). Pure state-setting routine; the actual warp presumably happens later when the
  state machine sees Unk_10 set. Trivial size, no calls, preserves r4-r7 per the prologue (which is only there to
  keep the leaf stack frame convention).

  '
