summary: 'Initializes a damage-number (and related) counter battle object: sets its type/id, builds its
  sprite from a GUI template, then dispatches into the per-mode update handler.'
interface: '(r5 = BattleObject*) -> r0/r2/r3 caller-saved ; side effects: writes many fields of *r5 (mode/type
  byte 0x23, Unk_0c, CurState=0x04) and configures its sprite/animation/palette/priority/slot/palette-bank/coordinates.'
details: 'Sets the battle object''s mode/type byte at [r5+0] to 0x23 (the "dmg/score number counter" object
  type). Builds the sprite by `initGuiSprite(0x61, unk_20251B0)`. Then [r5+0xc] = [r5+4]+5, after which
  `sprite_setAnimation`/`sprite_loadAnimationData`/`sprite_noShadow` are called. Palette 0, OAM priority
  2, then `slotList_storeHalfwordAndClearField_800306C` writes a halfword into a slot selected by the
  object''s ListIndex [r5+3] from the table at `off_8117DB4` ({0x90, 0xC0}). `sprite_setSubEntryPaletteBank`
  uses `byte_8117DC4[[r5+3]]` (entries 2/3/4/0). `sprite_setSubRecordFieldA` gets 3. Coordinates: x =
  0x78, y = 0x28 + [r5+3]*0x20. Finally CurState [r5+8] is set to 4 (CUR_STATE_UPDATE) and `sub_8117DC8`
  (the mode-handler tail dispatcher) is called.

  '
