name: t4_loadScreenBackgroundTiles
address: '0x0804CCF0'
kind: function
status: probable
summary: Clears BG scroll and loads a full 30x20-screen tile block (block 3) from a ROM tile-id table,
  then flags the background for redraw.
interface: () -> void; sets bit 0x800 of toolkit RenderInfo word at [r10+oToolkit_RenderInfoPtr], zeroes
  its +0x18/+0x1a scroll fields
details: Takes no arguments. It reads the toolkit's RenderInfo pointer, ORs 0x800 into its first halfword
  (a dirty/redraw or enable-BG flag), and zeroes the two halfword fields at +0x18 and +0x1a, which are
  background scroll offsets. It then calls CopyBackgroundTiles with (j=0, i=0, tile_block=3, tile_ids=byte_86A39D0,
  j_size=0x1e, i_size=0x14), i.e. it fills the entire 30x20-tile (240x160) screen of background block
  3 from a static tile-id table in ROM. The 0x800 bit most likely forces the background layer to be re-uploaded/re-rendered
  after the new tiles are written. The caller sub_804CBDC runs on the beastsp route, suggesting this swaps
  in a full-screen background (e.g. for a Beast-Out/scene overlay) while resetting camera scroll to origin.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'orr r0, #0x800 into [RenderInfo] then strh 0 to +0x1a and +0x18: sets a BG flag and clears
    scroll offsets; bl CopyBackgroundTiles with r2=3, r4=0x1e, r5=0x14: fills block 3 with a 30x20 tile
    map = whole GBA screen; ldr r3, =byte_86A39D0: tile-id data comes from a fixed ROM table, not game
    state; no inputs read from r0: parameterless scene-setup routine; sole caller sub_804CBDC on beastsp
    route: runs when a specific full-screen scene/background is shown'
