name: chatbox_store40IfFlag80Clear_81371A0
address: '0x081371A0'
kind: function
status: confirmed
summary: Tests chatbox eFlags bit 0x80 and writes 0x40 to a caller-supplied byte only when that flag is
  clear.
interface: void chatbox_store40IfFlag80Clear_81371A0(u8* dest /* r5 */)
details: 'Calls chatbox_mask_eFlags2009F38(0x80) to test the chatbox extended-flags word against bit 0x80
  (likely a "textbox already open/pending" state). If the masked value is zero (Z set, i.e. the flag is
  clear), the byte pointed to by r5 is set to 0x40 — a chatbox-style state/phase value. If the flag is
  set, the function returns without touching *r5. Always writes to r5''s target on the store path via
  strb, so r5 must be a valid byte pointer. No return value is meaningful: r0 and the NZ flags are clobbered
  either way (r0 ends as the mask-test result on the early-return path and as 0x40 on the store path),
  and only r1 is preserved among scratch registers. This looks like a small helper that primes a per-context
  state byte for the chatbox unless the chatbox is already in the 0x80-flagged condition.'
