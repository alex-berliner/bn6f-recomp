open_questions:
- Why is the tag bumped by +1 and restored, instead of e.g. written to 0? The bump value appears unused
  elsewhere.
- What are the channel-pattern bytes (0x01, 0x11, 0x02, 0x22, 0x03, 0x44, 0x04, 0x88) — channel index
  plus a flag nibble, or sample-rate prescale + loop?
- Which of sub_814FBFC, sub_814E7CC, sub_814E7E0, sub_814FD54, sub_814E758, SampleFreqSet_814EDC0, sub_814E4DC,
  sub_814F228, sub_814F2F0 correspond to which sound operation (play SFX, BGM command, stop, fade, etc.)
  in the off_3005570 dispatch table?
- Is sound_buf always 256 bytes? CpuSet count 0x40 (×4) = 0x100 implies yes, but the buffer size is implicit
  in the routine, not stored anywhere visible here.
