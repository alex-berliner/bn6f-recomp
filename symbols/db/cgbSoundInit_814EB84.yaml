name: cgbSoundInit_814EB84
address: '0x0814EB84'
kind: function
status: confirmed
summary: 'Initialize the CGB sound driver: reset the GBA sound hardware, install the game''s patched sound
  handlers into the function-pointer table at off_3005570, zero the caller-supplied sound buffer, and
  stamp channel-pattern identification bytes.'
interface: void sub_814EB84(u32 sound_buf /* r0 */); /* returns to lr; clobbers r0-r3, lr, flags nzc;
  preserves r4-r6 */
details: "Takes the caller-supplied sound buffer address in r0 (preserved in r5). Performs an\nidempotency\
  \ check against the magic tag 0x68736D53 (\"Shms\") stored in the CGB sound\nstate struct pointed to\
  \ by [byte_3007FF0]; if the tag is missing, the function returns\nwithout touching anything (loc_814EC44\
  \ path).\n\nDirect hardware poke phase (always runs):\n  - NR52 (ControlSoundon_off_NR52_) = 0x008F:\
  \ power on all 4 channels, set A on\n  - NR50/NR51 (ControlStereo_Volume_Enable_NR50_NR51_) = 0x0000,\
  \ then NR50 byte\n    = 0x77 (master volume)\n  - NR12, NR22, NR42 length envelope bytes = 0x08\n  -\
  \ NR14, NR24, NR44 trigger bytes = 0x80\n  - NR34 = 0 (channel 3 off)\n\nPatching phase (only on magic-tag\
  \ match): the original tag value is bumped by +1 to\nguard against re-entry while the table at off_3005570\
  \ is being overwritten, then\nrestored at the end (back to the original \"Shms\").\n\nFunction-pointer\
  \ table at off_3005570 receives Thumb-encoded (+1) pointers to:\n  +0x20 sub_814FBFC, +0x44 sub_814E7CC,\
  \ +0x4C sub_814E7E0, +0x70 sub_814FD54,\n  +0x74 sub_814E758, +0x78 SampleFreqSet_814EDC0, +0x7C sub_814E4DC,\n\
  \  +0x80 sub_814F228, +0x84 sub_814F2F0.\n\nCGB sound state struct (at *[byte_3007FF0]):\n  [+0x00]\
  \ magic tag (read, temporarily bumped, restored)\n  [+0x0C] = 0x00\n  [+0x1C] = sound_buf (caller buffer)\n\
  \  [+0x28] = CgbSound+1\n  [+0x2C] = sub_814F44C+1\n  [+0x30] = sub_814F3A4+1\n\nBuffer fill: SWI_CpuSet\
  \ in 32-bit fixed-source fill mode (mode = 0x05000040: 64 words,\nfill source = 0 on the stack) zeroes\
  \ 256 bytes of the sound buffer.\n\nChannel-pattern identification bytes stamped into the buffer (likely\
  \ the wave/loop\npattern slots for the four channels): [+0x01]=1, [+0x1C]=0x11, [+0x41]=2,\n[+0x5C]=0x22,\
  \ [+0x81]=3, [+0x9C]=0x44, [+0xC1]=4, [+0xDC]=0x88 — each pair at offsets\n+0x1B apart (0x1B, 0x1B,\
  \ 0x1B, 0x1B) appears to be channel header + flag.\n\nQuirks:\n  - Stores Thumb-encoded function pointers\
  \ (+1 LSB) into the table, matching the GBA\n    convention for BX targets.\n  - The magic-tag bump\
  \ pattern is a re-entry guard: if the same routine ran twice\n    concurrently the second caller would\
  \ see a non-magic tag and bail.\n  - r2/r3 are clobbered as a side effect of the SWI_CpuSet return values\
  \ on the\n    successful path, and set to 0 / NR50 address on the early-out path — see\n    register_form\
  \ note in the readable C.\n"
