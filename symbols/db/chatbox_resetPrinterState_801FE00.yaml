name: chatbox_resetPrinterState_801FE00
address: '0x0801FE00'
kind: function
status: confirmed
summary: Resets the text-printer/chatbox state, clearing its pending word, flags, character slot and both text buffers.
interface: void chatbox_resetPrinterState_801FE00(void); /* preserves incoming r2; returns r3 = ptr to printer state
  at 0x2036780; clobbers r0, r1, lr and flags */
details: "Clears the global text-printer state used by message boxes/chatboxes:\n- zeroes the 32-bit pending-word/state\
  \ field at eStruct203F7D8 (0x203F7D8),\n- clears the halfword flags at eFlags2036782 (0x2036780+2),\n- stores\
  \ 0xFF into byte_2036784 (0x2036780+4), marking the current character slot as unused/none,\n- zero-fills the 0x200-byte\
  \ main text buffer at 0x203F4A0 and the 0x100-byte secondary buffer at 0x203CBE0\n  via ZeroFillByEightWords (word-wise\
  \ zero fill).\nCalled when a message box is torn down/reinitialized so the next message starts from a clean state.\n\
  Quirk: keeps the printer-state pointer live in r3 across the calls and returns it in r3; also preserves\nwhatever\
  \ value the caller passed in r2 (the contract notes r2 as both input and preserved).\n"
