name: damage_jitter_80AAA98
address: '0x080AAA98'
kind: function
previous_names:
- sub_80AAA98
status: confirmed
summary: 'Picks the battle reward: returns a byte offset into the enemy''s 20-entry reward table (byte_80AAEA8 +
  id * 0x28) from a base table byte_8020B9C[r0 * 16 + RNG nibble], an RNG bit * 2 and +0x14 (the table''s second
  half) when r1 <= (r2 >> 3) * 3. Not a damage jitter.'
interface: 'u32 sub_80AAA98(u32 param1 /*r0*/, s32 bonus /*r1*/, u32 raw_mag /*r2*/, u32 mode /*r3*/) -> u32 (NZCV
  flags from final ADD r0, r0, #0; r4 preserved)'
details: "Stores r0..r2 on stack and keeps r3 as the mode selector in r4.\n\nCap derivation (lines 0x6..0xE):\n\
  \  cap = 0x14\n  mag_shifted = r2 >> 3\n  cmp_value = (mag_shifted + mag_shifted + mag_shifted)  // i.e. (r2/8)*3\n\
  \  if (signed r1 > (signed) cmp_value) cap = 0\n\nRNG (calls GetPositiveSignedRNG outside this file):\n  rng =\
  \ RNG()\n  step = ((rng >> 8) & 1) << 1     -> values 0 or 2\n  lookup = (rng >> 16) & 0xF       -> 0..15\n\n\
  Mode dispatch:\n  mode 0: result = byte_8020B9C[param1 * 16 + lookup] + step + cap\n  mode 1: result = step +\
  \ cap\n  mode 2: force step = 2, then fall back through mode 0\n  any other mode: infinite loop at loc_80AAAFA\
  \ (deliberate \"should never happen\")\n\nFlag note: every exit path's final flag-setting op is `ADD(S) r0, r0,\
  \ r1`,\nbut by that point r1 has been folded into the running sum and r1 holds 0\nwhen control reaches the tail,\
  \ so NZCV effectively equal `ADDS r0, r0, #0`.\n\nReads: byte_8020B9C (16-byte stride table at 0x8020B9C).\nCalls:\
  \ GetPositiveSignedRNG.\nPreserved: r4.\nClobbered: r0 (return), r1, r2, r3, lr, NZ, C, V.\n\n\nCorrection (2026-10-13):\
  \ the mechanics above are right, the meaning was not. Both call sites (in sub_80AA910, reached from sub_80AA8E0,\
  \ which the battle-end code at loc_802C91A calls with the opponents' list, MegaMan's HP and MaxHP) use the result\
  \ as `ldrh r0, [r4, r0]` with r4 = sub_80AAE98(id) = byte_80AAEA8 + id * 0x28, the reward table: the value is\
  \ the offset of the reward entry. Modes: 0 = base + bit * 2 + bonus; 1 = bit * 2 + bonus only; 2 = base + 2 +\
  \ bonus (the caller then moves to the second half when the result is >= 0x14); others hang. Proposed name battle_pickRewardEntryOffset_80AAA98.\
  \ The rename waits in symbols/pending_renames.txt: the subsystem farm's worktrees share bn6f and still hold copies\
  \ of the C that names this symbol, so renaming now would break their builds."
