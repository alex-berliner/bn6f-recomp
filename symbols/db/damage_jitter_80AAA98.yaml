name: damage_jitter_80AAA98
address: '0x080AAA98'
kind: function
status: confirmed
summary: 'Rolls per-hit damage jitter: picks a base byte from a 16-entry table indexed by (param1, low-nibble
  of RNG), adds a ±2-style step, then adds a bonus capped by an attack-raw/8*3 threshold.'
interface: 'u32 sub_80AAA98(u32 param1 /*r0*/, s32 bonus /*r1*/, u32 raw_mag /*r2*/, u32 mode /*r3*/)
  -> u32 (NZCV flags from final ADD r0, r0, #0; r4 preserved)'
details: "Stores r0..r2 on stack and keeps r3 as the mode selector in r4.\n\nCap derivation (lines 0x6..0xE):\n\
  \  cap = 0x14\n  mag_shifted = r2 >> 3\n  cmp_value = (mag_shifted + mag_shifted + mag_shifted)  //\
  \ i.e. (r2/8)*3\n  if (signed r1 > (signed) cmp_value) cap = 0\n\nRNG (calls GetPositiveSignedRNG outside\
  \ this file):\n  rng = RNG()\n  step = ((rng >> 8) & 1) << 1     -> values 0 or 2\n  lookup = (rng >>\
  \ 16) & 0xF       -> 0..15\n\nMode dispatch:\n  mode 0: result = byte_8020B9C[param1 * 16 + lookup]\
  \ + step + cap\n  mode 1: result = step + cap\n  mode 2: force step = 2, then fall back through mode\
  \ 0\n  any other mode: infinite loop at loc_80AAAFA (deliberate \"should never happen\")\n\nFlag note:\
  \ every exit path's final flag-setting op is `ADD(S) r0, r0, r1`,\nbut by that point r1 has been folded\
  \ into the running sum and r1 holds 0\nwhen control reaches the tail, so NZCV effectively equal `ADDS\
  \ r0, r0, #0`.\n\nReads: byte_8020B9C (16-byte stride table at 0x8020B9C).\nCalls: GetPositiveSignedRNG.\n\
  Preserved: r4.\nClobbered: r0 (return), r1, r2, r3, lr, NZ, C, V.\n"
