open_questions:
- What is byte_8020B9C indexed by param1? Looks like a per-base/move variability table (multiplied-by-16
  stride suggests 16 entries per param1 bucket), but its meaning (e.g. base hit damage, status magnitude,
  panel radius) is unverified.
- Is "raw_mag" an attack's raw magnitude stat whose /8*3 cap represents the bonus ceiling the bonus value
  is allowed to cancel out (cap->0)? The signed branch on r1 vs the cap is consistent with that, but in-game
  semantics are not confirmed.
- Mode 2 forcing step=2 then re-running mode 0 looks like an "ensure minimum 2 units of jitter" path;
  which battle caller uses it is unknown.
