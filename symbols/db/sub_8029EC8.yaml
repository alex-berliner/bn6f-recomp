open_questions:
- Which subsystem owns byte_8029F4C? (5-entry flag table; likely a per-area / per-NPC list.)
- Is the pointer at dword_20349A0 a global state word (e.g. "completed jobs", "earned rewards") and which subsystem
  updates its bits 5..9?
- Is the count in r0 used as a "how many of N" tally (e.g. all 5 = fully unlocked), or is it indexed against by
  the caller?
- Why is the AND shifted by 5 instead of using raw indices 0..4? (bits 5..9 may overlap another subsystem's bitmap
  and the shift keeps them disjoint.)
