name: sub_8029EC8
address: '0x08029EC8'
kind: function
status: confirmed
summary: Scans 5 event-flag indices from a small table and counts how many of those flags are currently set in-game
  yet have their (index + 5) bit clear in a runtime mask word, returning the count in r0.
interface: "void countUnmaskedEventFlags_8029EC8(void);\n  inputs:  none (caller must ensure global state for TestEventFlag\
  \ and *(dword_20349A0))\n  outputs: r0 = count of set flags whose (idx+5) bit is clear in the mask\n  clobbers:\
  \ r0, r1, r3, lr, flags NZCV\n  preserved: r4, r6\n  (note: r3 at exit is either the last successful AND result\
  \ or the r3 left by TestEventFlag\n   on the final iteration if it was not set; the function contract only promises\
  \ r0)\n"
details: "Walks the 5-entry u32 table at byte_8029F4C (each entry is a flag id). For each entry\nit calls the global\
  \ TestEventFlag(u16 flagId) helper; the assembly relies on TestEventFlag\nreturning Z clear when the flag is set\
  \ and on TestEventFlag preserving the r3 it left from\nthe lookup (the beq path jumps straight to the loop tail\
  \ without reloading r3). When a flag\nis set, it dereferences the pointer at dword_20349A0 (a pointer-to-pointer;\
  \ the inner word\nis read each iteration) and ANDs it against (1u << idx) << 5, i.e. bits 5..9 of that mask\n\
  word. If the bit is absent the counter r6 is incremented. The mask word at *dword_20349A0\nis therefore treated\
  \ as a 32-bit bitfield where event-flag-table indices 0..4 map to bits\n5..9. The final r3 left in r3 is the leftover\
  \ AND (or TestEventFlag's r3 on the not-set\nfinal iteration) and is not otherwise used; only r0 (the count) is\
  \ the meaningful return.\nQuirks:\n  - r3 is intentionally re-used as a \"leftover\" across iterations; not a\
  \ real return.\n  - r10 is listed as an input by the lifter but the function itself never reads r10;\n    this\
  \ is an artifact of the caller-saving convention used by the prologue epilogue\n    matcher, not an actual contract\
  \ requirement.\n  - The inner dword_20349A0 is reloaded every loop iteration (no caching), so the mask\n    word\
  \ may be live-modified by TestEventFlag or another callee between checks.\n"
