name: chipTraderRollReward
address: '0x0804BD00'
kind: function
status: probable
summary: 'Picks the chip the chip trader will award: chooses a reward-list entry and a rarity tier, then
  resolves or redraws the final chip.'
interface: () -> r0 = ? (result of last callee); writes trader state at eS200AC80 (+0x4c list ptr, +0x50
  count, +0x34 pick state)
details: Calls selectChipTraderRewardList_804BFF0 and stores the returned candidate list pointer and count
  into the trader's static state (eS200AC80 +0x4c/+0x50). A weighted random over table dword_804B008 (r1=2)
  branches between two candidate-selection helpers (sub_804BDB4 / sub_804BE1C), each receiving the state
  +0x34 as an output/context pointer. A second weighted random over the 5-entry rarity table off_804B018
  picks a rarity tier, passed with the list to sub_804BE88 which selects a chip; getChip8021DA8 then fetches
  its ChipData rarity byte. chipTraderRedrawChance_804BEEC decides whether the roll is redrawn via sub_804BF18
  or finalized through chipTraderGetRewardFromRedraw_804BF94.
