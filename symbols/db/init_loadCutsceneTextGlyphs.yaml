name: init_loadCutsceneTextGlyphs
address: '0x081314E4'
kind: function
status: probable
summary: During cutscene scene setup, renders one of three sets of four glyphs from the text font into
  the text-layer VRAM tiles.
interface: (r0 = unused/ignored) -> r0 = destroyed; calls sub_81312EC to get cutscene state, reads state+0xC
  to select a glyph set.
details: Calls sub_81312EC and reads byte [r5+0xC] as a selector (0..2) into a table of three arrays of
  four u16 character codes (off_813154C). For each of four entries (loop counter in [sp]), it takes the
  u16 code, subtracts 0x90 and shifts right by 2 to get a glyph index, then calls renderTextGfx_8045F8C
  with the font base TextScript873EA50, that index, scratch/stride 0x200 over byte_2019A00, VRAM destination
  0x600A000 + i*0x200, tile count 0xB, color mode 2, and glyph table dword_86A5D60. This uploads four
  16-tile (0x200-byte) glyph blocks to the BG text tile area. The three variants suggest version/scenario-dependent
  text (e.g. a title or episode label) drawn while init_cutsceneSceneState starts chatbox script 0x68.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loop of 4 iterations calling renderTextGfx_8045F8C with dest 0x600A000+i*0x200 and font TextScript873EA50;
