name: sprite_getUnk0x2c
address: '0x08002FB2'
kind: function
status: confirmed
summary: Returns the word at offset 0x2c of an object's sprite record, locating the record via the sprite offset
  packed in the object header.
interface: word sprite_getUnk0x2c(ObjectHeader *r5); also sets carry (side effect of the address add), clobbers
  r3
details: 'Reads the object header byte at offset 2 (TypeAndSprite) and masks off the low nibble,

  leaving the high nibble which encodes the sprite''s offset within the object structure

  in units of 0x10 bytes. It adds this offset to the object pointer to reach the object''s

  sprite record, then loads and returns the 32-bit word at oObjectSprite_Unk_2c (0x2c).

  Quirk: the ADD r3, r3, r5 is the last flag-setting instruction, so the carry flag on

  return reflects (spriteOffset + object) overflow; the register contract shows carry as

  an output, so at least one caller may rely on it.

  '
