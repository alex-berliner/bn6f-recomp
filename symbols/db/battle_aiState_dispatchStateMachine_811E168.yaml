status: probable
summary: AI state-machine dispatcher that jumps (ARM-mode BX) to one of three handlers based on a sub-state byte
  in the AIData pointed to by r5
interface: '(r5 = AIData*, lr = return addr) -> r0 = AIData+0x8 byte used as index into 3-entry handler table ;
  side effects: tail-bx into one of sub_811E18C / sub_811E1D4 / sub_811E1FA (Thumb), preserves r5 (callee-saved)'
details: "The function saves lr to pc on the stack (`push {lr}` / `pop {pc}`), reads the byte at\n  `(r5)+8` (BLeftAbility\
  \ in AIData, loc=0x8) into r1, loads the base of `off_811E17C`\n  (a 3-entry Thumb-handler table) into r0, indexes\
  \ it with that byte, sets `lr = pc`,\n  and BXes to the resulting Thumb address (note the `+1` on every entry\
  \ to switch to\n  Thumb). There is no r6 use despite r6 being loaded with `eStruct2001010`; it is dead in\n  this\
  \ stub and looks like an artifact of an earlier inlined version. r5 is preserved by\n  the call convention and\
  \ points at the AIData struct. The three handlers\n  (sub_811E18C, sub_811E1D4, sub_811E1FA) almost certainly\
  \ correspond to AI sub-states\n  (init/update/idle or similar). The captured-call snapshots show r5 tied to EWRAM\n\
  \  AIData (~0x087dc5a4 range, r2) with r1 == 8 (the byte index) and consistent r0/r3\n  inputs across the 40 samples;\
  \ exit r0 = 0x78c and Z flag set, suggesting the handler\n  writes a small word (likely \"done / frame counter\"\
  ) into AIData before returning.\n"
