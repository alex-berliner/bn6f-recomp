  date: '2026-10-14'
  detail: '- `ldrb r1, [r5,#8]` at asm32.s:32045 reads BLeftAbility (offset 0x8 in AIData struct) as the dispatch
    index - `ldr r0, off_811E178` and `ldr r0, [r0,r1]` at 32043-32046 perform a 3-entry table lookup (`off_811E17C`
    lists 3 handler addresses) - `mov lr, pc` + `bx r0` at 32047-32048 perform a Thumb-state-preserving tail call
    to the chosen handler - All three table entries have `+1` (`sub_811E18C+1`, `sub_811E1D4+1`, `sub_811E1FA+1`)
    confirming BX-to-Thumb semantics - Captured entry consistently shows r1 = 8 and r5 → ~0x087d... (EWRAM AIData
    area), r2/r3 points at same struct, matching the [r5,#8] read - `push {lr}` / `pop {pc}` make this a leaf dispatcher
    with no local stack frame - r6 loaded with `eStruct2001010` but never referenced afterward → dead load, likely
    artifact'
