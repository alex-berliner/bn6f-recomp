summary: Per-frame action dispatcher for a battle object's update state (r5), jumping into one of 19 sub-action
  handlers via a jumptable indexed on word returned from sub_80A6E78; then recomputes Z priority, layer,
  sprite priority and runs sprite_update.
interface: '(r5 = battle object, plus inherited r2/r3/r8/r9/r10/r11/r12/lr) -> no out value, void-like
  ; side effects: clobbers r0-r4/r6/r7, sets [r5+0x14], updates sprite priority + sprite OAM'
details: "- push {lr}; init r4=9, r6=0x24, r7=0x3c (constants used by callees).\n  - First loop at loc_80A6A6A:\
  \ calls sub_80A6E78(r5, r6, r7) which returns a pointer in r0, loads halfword [r0], uses JumpTable_80A6ABC\
  \ (19 entries) to BX into one of sub_80A6B10 / 80A6CA4 / 80A6CD4 / 80A6CFC / 80A6D38 / 80A6D42 / 80A6D5C\
  \ / 80A6D7A / 80A6D8A / 80A6DAC / 80A6BD8 / 80A6DC6 / 80A6DDC / 80A6DEC / 80A6DFC / 80A6E0C / 80A6E22\
  \ / 80A6E3A / 80A6E4A. Loop continues while BNE; exits on fall-through (the dispatched handler returned\
  \ Z=1 or returned to a sentinel address that doesn't re-branch).\n  - Second loop at loc_80A6A80 with\
  \ r4=0xa, r6=0x28, r7=0x3e: same dispatch via sub_80A6E78 but only calls the jumptable handler when\
  \ sub_80A6E78 returned non-NULL (`tst r0,r0; beq loc_80A6A94`).\n  - After both loops: ldr r4,[r5,#0x14]\
  \ (save Z-modifier scratch word), call checkZCoordModifiers_8031612(r5+0x0c), write 16.16 result back\
  \ to [r5,#0x14] (BattleObject+0x14 = FuturePanelXY in the schema, but here it is being used as the Z\
  \ priority word slot), then restore r4 (previous value) back into [r5,#0x14] afterwards (so the slot\
  \ is actually a temporary Z-priority scratch, not the FuturePanelXY).\n  - Wait — re-reading: `ldr r4,[r5,#0x14];\
  \ ... ; str r4,[r5,#0x14]` — r4 was saved before the call and written back after applyLayerEffectToOWObject.\
  \ So the Z-modifier word is stored at [r5,#0x14] only during applyLayerEffectToOWObject_8035694(r5+0x0c).\
  \ BattleObject+0x0c is `Unk_0c` per the struct (right next to CurState); the call sites pass `r5+0x0c`,\
  \ so [r5,#0x14] is a local scratch on the object used as the Z-modifier input/output for applyLayerEffectToOWObject.\n\
  \  - Then `bl sprite_setPriority_8002E14` (priority value comes from r0 leftover from applyLayerEffectToOWObject),\
  \ `bl sprite_update`, `pop {pc}` (tail-pop idiom, returns to whoever pushed lr).\n  - Inherits r5 as\
  \ battle object pointer (ObjectHeader at r5+0, header byte 2 & 0xF0 used as sprite struct offset, plus\
  \ [r5,#0x14] as Z scratch).\n  - Called from sub_80A6A34 (the per-frame update wrapper) in a context\
  \ matching battle_object state CUR_STATE_UPDATE (0x4).\n"
