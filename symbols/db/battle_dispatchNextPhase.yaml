name: battle_dispatchNextPhase
address: '0x0800855E'
kind: function
status: probable
summary: Per-frame battle turn-state machine step that unpauses the battle, updates AI input, and routes
  to the next phase state (cust gauge, phase advance, BeastOut intro, or death anim) based on the current
  phase mode.
interface: (r5 = pointer to battle flow state struct with u32 state id at +0 and u8 flag at +5; r10 =
  toolkit with battle state ptr) -> r0 = varies from callees; sets [r5+0] to the next state id (8, 0xc,
  0x14 or 0x18)
details: 'This is one handler of the battle flow state machine: on entry it unpauses the battle, runs
  the navi-AI joypad update for both players (0 then 1), sets a flag via battle_setFlags, and advances
  the phase state and the Unk_40 counter. It then reads battle_getPhaseMode: mode 1 increments oBattleState_PhaseStepIndex
  and jumps to state 8, mode 2 increments oBattleState_CustGaugeChargeLevel (cust gauge rising) and jumps
  to state 0xc, mode 7 jumps to state 0x14. Otherwise it calls battle_checkFlowAdvanceFlags: if the battle
  is over/time-stopped (0xFF) it checks battle_shouldPlayDeathAnim and on result 1 pauses and enters state
  0x14; if a ready-flag is set it stores the flag byte, pauses the battle, enters state 0x18 and starts
  the BeastOut transformation sequence. The state ids written to [r5] are indices of sibling handlers
  in the same state machine.'
