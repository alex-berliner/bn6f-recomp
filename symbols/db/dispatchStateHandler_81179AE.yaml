name: dispatchStateHandler_81179AE
address: '0x081179AE'
kind: function
status: confirmed
summary: Per-frame state dispatcher that fetches the active work area and tail-calls one of four state handlers
  based on its leading state byte.
interface: void sub_81179AE(void); // no meaningful register inputs — everything is read from the work area; r4-r7
  preserved, r0/r1 and flags clobbered; r0 out depends on the invoked handler
details: 'Obtains a work-area pointer by calling sub_8047D84 with r7 preloaded from the singleton byte byte_2011C10
  (sub_8047D84 apparently locates the object via that singleton). Reads the state byte at offset 0 of the work area,
  scales it by 4 (r1 = state * 4), keeps the work pointer in r4, and long-calls (lr = pc, bx) the matching entry
  of off_81179CC: state 0 -> sub_81179E0, state 1 -> sub_81179E4, state 2 -> sub_8117A14, state 3 (and any larger
  value, which is unreachable in practice) -> sub_8117AB4. The handlers thus see r1 = state*4 and r4 = work area,
  with all other registers passing straight through. Because the call is a long call rather than a tail call, the
  dispatcher itself returns to its caller after the handler returns, restoring r4-r7 from the stack. The switch
  dispatch pattern (state byte x 4 into a jump table) is a typical scripted/NPC or battle-event state machine; the
  owning subsystem is not yet identified beyond the singleton at byte_2011C10.

  '
