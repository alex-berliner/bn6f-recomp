name: object_phaseTeleportBehindTarget
address: '0x080BD67E'
kind: function
status: probable
summary: 'Battle-object phase: warp the object one panel behind its target panel (anim 4), wait, then
  advance to phase 0xC.'
interface: (r5 = battle object) -> void; sets PanelX/PanelY, CurAnim, Timer, PhaseInitialized, then CurPhaseAndPhaseInitialized
  = 0xC
details: First call (PhaseInitialized == 0) stores CurAnim = 4, clears oBattleObject_Timer, computes PanelX
  = FuturePanelX - object_getFrontDirection() (i.e., one panel opposite the object's facing side), copies
  FuturePanelY into PanelY, calls object_setCoordinatesFromPanels to derive pixel X/Y, and sets PhaseInitialized
  = 4. Subsequent calls decrement the Timer; when it expires the phase word is set to 0xC. Because Timer
  is initialized to 0, the decrement wraps to 0xFFFF and the bgt falls through, so the wait lasts effectively
  one update unless something else rewrites Timer. It is a state-machine step of some enemy/object AI,
  r5 being the standard battle-object struct.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / bne: standard two-stage phase handler pattern;
    neg r0,frontDirection; add FuturePanelX; strb to PanelX: teleports one panel behind facing direction;
    bl object_setCoordinatesFromPanels after storing PanelX/Y: recompute pixel position; Timer countdown
    with bgt and ''mov r0,#0xc; strh CurPhaseAndPhaseInitialized'': on expiry jumps to phase 0xC; mov
    r0,#4; strb CurAnim: plays animation 4 while waiting'
