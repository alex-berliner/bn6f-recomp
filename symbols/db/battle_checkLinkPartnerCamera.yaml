name: battle_checkLinkPartnerCamera
address: '0x0809CE14'
kind: function
status: probable
summary: Checks the link-battle state and partner slot; on success stores the partner's eCamera-related
  value into [r5+0x74] and returns 0, otherwise returns 1.
interface: (uses caller's r5 as destination struct, r7/r12 saved around the call) -> r0 = 0 on success
  (value stored) or 1 if link state is nonzero or slot 4 is active
details: First calls battle_getLinkStateCode_803F560; a nonzero link state code aborts with return 1.
  If the state is 0, it calls sub_803F644, branching to the return-1 path only when that returns nonzero,
  so it must report 'no issue' for the check to continue. It then queries link slot 4 via link_getSlotState_803F740,
  which also yields eCamera fields; if the slot's state (r1) is nonzero it bails with 1, otherwise it
  stores r2 (a camera-related value for that slot) into [r5+0x74] and returns 0. r5 is not set up inside,
  so the destination structure belongs to the caller sub_809CC60.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_getLinkStateCode_803F560 followed by tst/bne returning 1 aborts on any active link-battle
    state; link_getSlotState_803F740 is called with slot id 4 and tst r1,r1/bne treats an active slot
    as failure; str r2,[r5,#0x74] stores the eCamera-related r2 from link_getSlotState into a caller struct
    field; r4 starts at 1 and is only cleared to 0 on the success path, so 0 = check passed; sole caller
    sub_809CC60 supplies r5; callee summaries confirm link-state and slot/eCamera semantics
