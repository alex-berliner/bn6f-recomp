name: chipFolder_ClearTilemapArea_802C59C
address: '0x0802C59C'
kind: function
status: confirmed
summary: Fills a 42-halfword tilemap region (e.g. the chip folder screen) with the blank tile entry 0x90C6.
interface: void sub_802C59C(u16 *dst /* r0 */); clobbers r0-r2 and NZCV flags, returns via lr
details: Writes the halfword 0x90C6 to 0x2A (42) consecutive halfword slots starting at r0, advancing the pointer
  by 2 each iteration, i.e. clears an 84-byte tilemap strip. 0x90C6 is a BG map entry (tile index 0xC6 with high
  attribute bits 0x90), used as the "blank" fill for the chip folder screen's VRAM tilemap area per the verified
  C note. Callers pass the destination address in r0 and nothing is returned.
