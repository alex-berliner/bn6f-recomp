name: owMapObject_weatherTornado_loadHome_80A90B0
address: '0x080A90B0'
kind: function
status: confirmed
summary: Initializes a weather-tornado overworld object's home position and initial counter from its map params.
interface: void owMapObject_weatherTornado_loadHome_80A90B0(mapObject r5, ctx r10)
details: "Calls owMapObject_weatherTornado_getParams_80A916C (passing r5, and r10 through to it,\npresumably an\
  \ overworld/context register) to obtain the tornado's parameter block, then:\n- reads the 16-bit home X at params+0x8\
  \ and stores it at object+0xC widened to 16.16\n  fixed point (value << 16),\n- reads the 16-bit home Y at params+0xA\
  \ and stores it at object+0x10, also 16.16,\n- stores 0x40 << 16 (0x400000) at object+0x14, seeding a timer/counter\
  \ or state field\n  at the fixed-point \"home\" scale.\nThe object pointer is only in r5 (r10 is forwarded for\
  \ the params lookup); the function\nreturns nothing and clobbers r0-r3, lr and flags. r7 is used as a scratch\
  \ for the params\npointer and preserved per ABI. This looks like a per-spawn/per-reset setup step for the\ntornado\
  \ map object so later update code can move it relative to its home and count down\nfrom 0x40.0.\n"
