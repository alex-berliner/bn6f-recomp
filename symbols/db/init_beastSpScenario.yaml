name: init_beastSpScenario
address: '0x0808CA68'
kind: function
status: confirmed
summary: 'Initializes a Beast Spirit encounter scenario on the overworld: zeroes the encounter buffer, clears start
  event flags, snapshots player position, queues graphics, and plays the encounter-start sound.'
interface: void ow_initBeastSpScenario(void); /* r10,lr in; clobbers r0,r1,lr,nzcv; preserves r4-r8,r10 */
details: 'Loads a scenario buffer pointer from global dword_808CA44 and zero-fills 0x98 bytes

  of per-encounter state via ZeroFillByWord. Marks byte offset 3 with sentinel 0x20

  to signal the buffer is initialized. Calls ow_storePlayerPosDup to snapshot the

  player''s overworld position into a duplicate slot within the buffer.


  Clears event flags group-9 offset-0xD8 and offset-0xD9 (beast-sp encounter-start

  flags) via ClearEventFlagFromImmediate. Resets game-state sub-mode field 09 to 0

  via gameState_setUnk09_8001172.


  Tests flag group-9 offset-0xD3: if it is absent (Z set after TestEventFlag),

  calls ai_syncModeEventFlag_808CF50 to re-sync mode/event state. Regardless,

  flag 0xD3 is then cleared unconditionally.


  Queues beast-sp graphics via init_queueBeastSpGfx and spawns overworld map

  objects via spawnOverworldMapObjects_808CBA0. If ai_testMapGroupEventFlag

  returns != 1 (indicating a genuinely new encounter, not a re-entry), applies

  scenario event flags via init_applyBeastSpScenarioEventFlags.


  Clears the beast-sp event-flag table via init_clearBeastSpEventFlagTable (whose

  r2 output feeds the final sound call). Plays SFX 0x1F at volume 0x100 via

  sound_8000672. Returns with original r5 restored from the stack.

  '
