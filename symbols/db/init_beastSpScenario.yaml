name: init_beastSpScenario
address: '0x0808CA68'
kind: function
status: probable
summary: 'Initializer for the Beast+ special-scenario mode: wipes its work buffer, clears related story
  flags, restores player control, and starts the scene''s sound.'
interface: () -> r0 = 0; flags clobbered; zeroes 0x98 bytes at [dword_808CA44], sets state byte 0x3 =
  0x20, sets GameState Unk_09 = 0
details: Reads a pointer from dword_808CA44 into r5 and zero-fills 0x98 bytes of the pointed-to work struct
  via ZeroFillByWord, then writes 0x20 to that struct's byte at offset 0x3 (byte_2000B43 area). Calls
  sub_808CC84, then clears event flags EVENT_9D8 and EVENT_9D9, and calls gameState_setUnk09(0), which
  removes the 'can't jack out'/control-lock flag — i.e. normal player control resumes in this mode. If
  story flag EVENT_9D3 is set it calls sub_808CF50 first, then unconditionally clears EVENT_9D3 (one-time
  setup for that flag). It then runs sub_8142C94, sub_808CBA0, sub_808CF34, calls sub_808CE70 unless sub_808CF34
  returned 1, calls sub_808CE28, and plays sound 0x1F with argument 0x100 via sound_8000672 before returning
  0.
