name: menu_clampListScrollAfterCountChange_8047CB6
address: '0x08047CB6'
kind: function
status: confirmed
summary: After a list's entry count (u16 at object+0x12) shrinks, pulls the two list indices at +0x14 and +0x18
  back down so they stay within the shortened list, only lowering them, never raising.
interface: void menu_clampListScrollAfterCountChange(Object* r5); /* r5 in, lr in (return address); returns with
  only the V flag meaningful to callers; clobbers r0, r1 and NZC */
details: 'Operates on an object passed in r5. It reads a u16 count/size field at +0x12 and re-clamps two u16 fields
  against it. If the count is > 4, it treats the field at +0x18 as a base/scroll index with a 5-entry window: when
  count < (+0x18)+5 it stores count-5 into +0x18, so the window''s last visible entry stays within the list. Otherwise
  (count 1..4) it treats the field at +0x14 as a cursor/selected index: when nonzero it computes count-1 and stores
  it into +0x14 only if the current value exceeds that, so the selection is lowered but never raised; a count of
  0 leaves both fields untouched. Both updates are one-directional (only decrease), so the routine is safe to call
  repeatedly. Callers only inspect the V flag, which reflects whichever comparison was executed last (the window
  check for the >4 path, the count-vs-4 compare when returning early in the small path, or the final reduced-vs-index
  compare when the cursor was actually lowered).

  '
