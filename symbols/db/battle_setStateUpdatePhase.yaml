name: battle_setStateUpdatePhase
address: '0x080EA030'
kind: function
status: probable
summary: Marks a battle object's current state as entering its update phase, then performs a follow-up step via
  a helper.
interface: (r0 = ???, r5 = battle object) -> r0 = result of sub_80EA03C; flags from callee
details: Stores the constant CUR_STATE_UPDATE into the battle object's oBattleObject_CurStateActionPhaseAndPhaseInitialized
  field, which the battle object state machine uses to track which action phase of the current state is running
  and whether the phase was initialized. It then tail-calls into sub_80EA03C with whatever r0 held on entry, whose
  effect is unknown from this snippet. r5 is used as the object pointer rather than r0, so r0 is presumably an argument
  passed through to the callee.
