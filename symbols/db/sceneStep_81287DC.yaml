name: sceneStep_81287DC
address: '0x081287DC'
kind: function
status: confirmed
summary: 'Per-frame scene step: cancel the scene during a screen fade, run the two scene helpers, and
  snapshot the live position/animation fields into the previous-frame slots.'
interface: 'void sceneStep_81287DC(void); /* in: r5 = scene object, r10 = caller-saved scene context;
  out: r5 preserved; clobbers r0-r3, lr, flags */'
details: "Called as part of a per-frame scene/dispatch loop. Operates on a scene state\nobject pointed\
  \ to by r5 (fields are byte-offset, reminiscent of EXE/scene\nstructs shared with sibling routines sub_8128B4C\
  \ / sub_8128B98):\n  - field_0x02 : u8 cancel/request flag; set to 4 to request cancellation\n     \
  \            while IsScreenFadeActive() returns true (i.e. abort the\n                 current scene\
  \ if a global fade is in progress).\n  - field_0x0D : current animation/sprite byte, copied into field_0x0E\n\
  \                 (previous animation byte).\n  - field_0x20 : current X, copied into field_0x22 (previous\
  \ X).\n  - field_0x24 : current Y, copied into field_0x26 (previous Y).\nThe \"previous\" snapshot pattern\
  \ (offset pairs 0x20/0x22 and 0x24/0x26)\nlets the helpers or a later interpolation step compare the\
  \ last frame's\nposition/animation against the live one. The function pushes {lr} but\npops {pc}, so\
  \ it is a tail-called step with no real stack frame.\nr5/r10 are preserved across the two helper calls\
  \ per the contract.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
