name: battle_spawnType51Object
address: '0x080E6720'
kind: function
status: probable
summary: Spawns a battle object of kind 0x51 at a given panel/element, inheriting alliance from a source
  object, and initializes its Damage, RelatedObject1ptr byte, and the 0x10 flag.
interface: (r0 = panelX, r1 = panelY, r2 = element, r3 = unused/?, r5 = source battle object ptr) -> r0
  = new object ptr (or bail on null); r6/r7 = damage word / side-struct ptr returned by the spawn initializer
details: The function stashes its arguments (r0-r2) and a source-object pointer (r5) on the stack, calls
  object_spawnType4 with kind 0x51, and returns early if the spawn yields null. On the new object it stores
  PanelX/PanelY/Element from the arguments, copies AllianceAndDirectionFlip from the source object at
  r5, and stores r6 into the DamageAndStaminaDamageCounterDisabler word. r6 and r7 are not set in this
  routine, so they must be outputs of object_spawnType4's initializer; the code writes byte 1 through
  r7 (RelatedObject1Ptr target) to activate something, and sets oObjectHeader_Flags |= 0x10 on the new
  object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x51; bl object_spawnType4 — spawns battle object kind 0x51 via the type-4 spawn wrapper;
    strb r1/r2/r3 to oBattleObject_PanelX/PanelY/Element — arguments become panel position and element;
    ldrh r1,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh into new object — allegiance copied from
    source object in r5; ldrb r1,[r0,#oObjectHeader_Flags]; orr #0x10; strb — marks the object with flag
    0x10; beq locret after the bl — exits without touching fields if spawn failed (null)'
  refs:
  - bn6f/asm/asm31.s:102120
  - 0x080E650A sub_80E650A
  - 0x080033AC object_spawnType4
  reproduce: python3 tools/asmcat.py 0x080E6720
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The assembly confirms spawning kind 0x51 via object_spawnType4, copying PanelX/PanelY/Element from
    r1-r3, inheriting AllianceAndDirectionFlip from the source object at r5, storing r6 into DamageAndStaminaDamageCounterDisabler,
    writing byte 1 to [r7], and setting oObjectHeader_Flags |= 0x10. The summary and name are adequate,
    though r3 is clearly used (PanelY? — wait, actually r1→PanelX, r2→PanelY, r3→Element, so the interface
    description of r2=element is wrong). Better: battle_spawnType51Object fits the naming rules and summary
    is essentially correct aside from the arg mapping slip.; run wf investigate investigate-20261019-030611;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
