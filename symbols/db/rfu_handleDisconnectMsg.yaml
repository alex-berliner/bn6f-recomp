- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r0]; cmp r0,#0x26 / #0x27: two message IDs trigger disconnect handling; bl rfu_clearSlot
    with r0=4, r1=slot index from byte_20103E0 in both branches; state 3 + zeroed [r4+2] on 0x26 vs state
    4 on 0x27: distinct follow-up states per message; slot pointer fetched from dword_2010CB0[slotIndex<<2],
    halfword at [slot] is the message field'
