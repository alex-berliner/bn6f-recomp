name: rfu_handleDisconnectMsg
address: '0x08146C9C'
kind: function
status: probable
summary: 'Step of the wireless (RFU) state machine: when the peer slot reports a disconnect-related message
  (0x26/0x27), frees the RFU slot and advances the state.'
interface: (r0 = state-machine struct ptr) -> r0 = undefined; writes state byte to [r0] and [r0+2], calls
  rfu_clearSlot(4, slotIndex)
details: Reads the active slot index from byte_20103E0, looks up the per-slot structure in the dword_2010CB0
  table, and inspects the halfword at offset 0 of that structure (an RFU message/request ID). If it is
  0x26, it calls rfu_clearSlot(4, slotIndex), stores state 3 into [r4] and 0 into [r4+2]. If it is 0x27,
  it also clears slot 4 but stores state 4 into [r4]. Otherwise it falls through without changing state.
  The struct at r4 is a small state context whose first byte is the next state and offset 2 a sub-state/counter
  byte.
