name: ai_swoopAttackUpdate
address: '0x0810F898'
kind: function
status: probable
summary: 'AI attack state handler: flies the enemy along its Y velocity while highlighting the panel beneath
  it, then on expiry returns it to its home panel and resets the attack state.'
interface: (no args; r5 = battle object, r7 = oAIAttackVars) -> void; r0 clobbered
details: While the timer byte at r5+0x6E is nonzero it is decremented, oBattleObject_Y is advanced by
  oBattleObject_YVelocity, panels/collision are refreshed, and the panel at (PanelX, PanelY^DirectionFlip)
  is highlighted, plus calls to sub_810FBD8(0) and sub_810FC30. On the first tick after expiry it sets
  AttackElement=1 and calls sub_810FC0C with byte r5+0x74, then clears the collision region and ObjectFlags1
  bit 1 (object inactive). The landing path restores PanelX/PanelY from saved home-panel bytes r5+0x64/0x65
  (also written to TargetPanelX/Y), recomputes pixel coordinates, zeroes Z, sets collision region 1, restores
  ObjectFlags1 bit 1, clears flag 0x40, and calls sub_811013C(homeX, homeY, dword_810FCCC=0x200000) —
  likely spawning a landing effect at the home panel — then object_removePanelReserve on that panel. Finally
  it resets CurAnim=0, copies oAIAttackVars_AttackDuration into StepTimer, sets HitElement=0x18, AttackElement=0,
  and clears flag 0x40 again.
