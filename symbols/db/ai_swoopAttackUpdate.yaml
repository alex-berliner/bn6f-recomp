    oBattleObject_Y each frame; 810F8BC: highlightPanelIfSomeCondition_8109660 called with PanelX/PanelY^DirectionFlip
    marks the panel under the airborne object; 810F8F4-810F938: landing path reads saved bytes 0x64/0x65
    into PanelX/PanelY and TargetPanelX/Y, then object_setCoordinatesFromPanels and object_setCollisionRegion(1);
    810F948: sub_811013C(homeX, homeY, dword_810FCCC=0x200000) followed by object_removePanelReserve —
    frees the panel and spawns an effect there; 810F95A: StepTimer = AttackDuration, HitElement=0x18,
    AttackElement=0 — standard AI attack-state teardown'
