name: battle_initFullCutscene_81292D8
address: '0x081292D8'
kind: function
status: confirmed
summary: 'Sets up a full-screen battle cutscene: loads background tiles, initializes the chatbox, starts
  a screen fade, then selects and runs the appropriate e-text script based on progress flags.'
interface: void battle_initFullCutscene_81292D8(int r2, int r4, BattleState *r5, int r6, int r7, int r10,
  int lr); preserves r4 r6 r7; r0-r3 and flags left by final callee
details: 'Called during battle to transition into a scripted full-screen cutscene. Steps: (1) draws the
  current battle sprite if its visibility flag is set via sprite_drawIfFlagSet_812B504; (2) early-returns
  if IsScreenFadeActive is still in progress (ZF set); (3) initializes the cutscene scene via sub_8046664
  and marks r5->state as 4; (4) clears the BG struct at 0x200BC30, processes tile data pointed to by off_8129158
  (byte_8129158), and loads full-screen tiles via bg_LoadFullScreenTilesAndSetup_812AFB0; (5) initializes
  the chatbox display (chatbox_8040818) which reads ambient r1/r4/r5; (6) starts a screen fade-out (speed
  8, duration 0x10) and clears r5->0xE; (7) computes a base e-text script ID as 0x5A + r5->0xD (a selector
  byte); (8) queries gameState_GetUnk74_8006DEC with that script ID for a progress bitmask; (9) remaps
  the script ID based on flags—bit 0 set promotes 0x5A to 0x5F, bit 1 set promotes 0x5B to 0x60—and passes
  r1_val=1 or 2 accordingly; (10) runs the selected script via chatbox_runScript_803FD9C_on_eTextScript201BA20.
  Touches: BattleState+0x02 (scene state byte), BattleState+0x0D (script selector), BattleState+0x0E (sub-state
  flag).'
