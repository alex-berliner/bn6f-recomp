name: ai_falzarAttackRandomPanelStep
address: '0x08105BBE'
kind: function
status: probable
summary: Per-frame state step of a Falzar boss attack that repeatedly picks a random target panel, highlights
  it while charging, then fires multiple hits.
interface: (r0 unused; r7 = object with oAIAttackVars) -> r0 = scratch; updates oAIAttackVars fields
details: 'Runs one step of an attack state machine on the object in r7. If AttackElement==0 it initializes:
  sets AttackElement=4, calls sub_81064F4 (Falzar random-panel picker) and stores the returned panel X/Y,
  copies TimerOrCycles to StepTimer and clears ChargeCycles. While active it increments ChargeCycles and
  every 8th tick calls object_highlightPanel on the stored target panel (a charge-up telegraph); when
  StepTimer counts to 0 it calls sub_8106590 to execute the hit, decrements SubStepIndex, and either resets
  AttackElement to 0 to pick a new panel or, on the final hit, sets HitElement=0x14 (0x20 decimal) to
  signal completion.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne loc_8105BDC — state entry vs. ongoing attack;
    bl sub_81064F4; strb r0 TargetPanelX; strb r1 TargetPanelY — random target panel chosen via Falzar
    picker; lsr r0,#3; bcs skip object_highlightPanel — highlights target panel every 8 charge cycles;
    bl sub_8106590 then dec SubStepIndex; beq sets HitElement=0x14 else resets AttackElement=0 — multi-hit
    loop with finish flag
  refs:
  - bn6f/asm/asm31.s:167208
