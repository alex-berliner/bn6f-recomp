name: eStruct200BC30_dispatchByFirstByte
address: '0x08131F80'
kind: function
status: probable
summary: Dispatcher that indexes a handler table with the first byte of the EWRAM 0x200BC30 record and
  jumps to the selected handler.
interface: (no args) -> r0 = value from eStruct200BC30_getJumpOffset00; returns to this function's caller
  via handler's lr
details: Calls eStruct200BC30_getJumpOffset00 to read the first byte of the record at EWRAM 0x200BC30,
  then loads a word from the table at 0x08131F94 using that byte as a byte offset. It performs a linked
  tail-jump (mov lr, pc; bx r1), so the chosen handler's return lands on the pop {pc} and control goes
  back to this function's caller. The visible table is eight null entries followed by one handler word
  (sub_8131FA0+1) at offset 8, meaning only state value 8 currently dispatches anywhere; values 0-7 would
  jump to address 0 and crash. This is a state-machine/per-state dispatch stub, presumably with more handlers
  patched in elsewhere or the record only ever holding 8 in the flows that reach it.
