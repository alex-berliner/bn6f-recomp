name: battle_objectCountdownFireAttackTick_80C9CA2
address: '0x080C9CA2'
kind: function
status: confirmed
summary: Ticks a battle object's countdown timer and, when it hits zero, fires its attack on the panel toward the
  player and moves the object to action 4.
interface: void sub_80C9CA2(void) /* r5 = battle object; preserves r4-r7, clobbers r0-r3, returns NZCV from timer-1
  and final action store */
details: 'Per-frame update for a battle object held in r5. Decrements the halfword

  oBattleObject_Timer; if the result is nonzero the tick ends there. When the

  timer reaches zero the object "fires": object_getFrontDirection() returns the

  direction (panel offset) from the object toward the player, which is added to

  oBattleObject_PanelX to get the target panel; together with

  oBattleObject_PanelY, oBattleObject_Z, and

  oBattleObject_DamageAndStaminaDamageCounterDisabler these are passed to

  sub_80C9CDA, which spawns/places the attack. The object then writes 4 to

  its CurAction byte (struct offset 9, no named macro in the headers),

  switching it to its post-attack state. r4 and r6 are pushed/popped even

  though this code does not use them: sub_80C9CDA clobbers r6 while callers

  expect r4-r7 preserved, so the save covers the firing path. Likely used for

  countdown-style obstacles/enemy objects (e.g. a trap or bomb that detonates

  on the facing panel after a delay).

  '
