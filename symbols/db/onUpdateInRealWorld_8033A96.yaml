name: onUpdateInRealWorld_8033A96
address: '0x08033A96'
kind: function
status: confirmed
summary: Per-frame update handler for the scene/entity while in the real world — resets two per-frame state flags,
  runs the real-world update logic, then queues a graphics transfer.
interface: void realWorld_onUpdate_8033A96(S2011E30* self /* in r5 */)
details: 'Called with the subject object in r5 (struct type S2011E30); r5, r6, r7 are preserved. The function is
  a fixed four-step sequence, each step invoked with r0 = 0 (a flag/selector that is always zero from this caller):
  1) sub_8033B80(0) and 2) sub_8033F80(0) — presumably clearing "action taken / state changed this frame" style
  per-frame flags on the object; 3) sub_8033BE8() with no arguments — the actual real-world update logic; 4) gfxTransfer_8033DA0(0)
  — queues/requests a graphics (OAM/tile) transfer so any visual changes from this frame take effect. The name suggests
  this is the real-world counterpart of a cyber-world update path; the object''s mode/location presumably selects
  between the two elsewhere. Return value: none; NZCV are left as side effects of the last call, callers treat this
  as void.

  '
