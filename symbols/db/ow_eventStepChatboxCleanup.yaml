status: probable
summary: 'Event-script step gated on IsScreenFadeActive: zero-fills unk_2037780 (0x80 bytes), calls chatbox_8040818,
  sets story flag EVENT_1711, and writes 4 to [r5+3].'
interface: (r5 = event/step state struct) -> void; sets EVENT_1711 via SetEventFlagFromImmediate, returns
  with no flags defined
details: First checks IsScreenFadeActive and returns immediately if a fade is still running (beq to the
  return), so this work is deferred until fading completes. It then zero-fills 0x80 bytes at unk_2037780
  (a fixed buffer, cleared via CpuFastSet), calls chatbox_8040818 which presumably tears down or resets
  the dialogue box, and sets event flag EVENT_1711. Finally it stores 4 to byte [r5+3], which looks like
  a step/state counter in an overworld event control struct advanced to its next value. The structure
  at r5 and unk_2037780's exact role are not visible from this function alone.
