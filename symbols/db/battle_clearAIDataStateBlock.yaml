name: battle_clearAIDataStateBlock
address: '0x0802D310'
kind: function
status: probable
summary: Zeroes a 16-byte block at offset 0xF0 of the battle object's AIData, resetting part of its AI
  state.
interface: (r5 = battle object; no args in r0-r3) -> r0 clobbered (holds AIData+0xF0); no flags meaningful,
  returns via mov pc, lr
details: 'Loads oBattleObject_AIDataPtr from the battle object in r5, computes AIData + 0xF0 via the sub
  #0xF / add #0xFF pair, then writes zero to offsets 0, 4, 8 and 0xC of that address, clearing 16 bytes
  (AIData+0xF0..0xFF). It takes no arguments and returns nothing else. Given the callers (AI timer flag
  polling and the super-armor/permanent-invulnerability setter), the block is most plausibly AI state/counters
  that must be reset when the object''s defensive or timer state is reinitialized. The two-instruction
  offset arithmetic makes the exact target offset worth confirming against the AIData struct layout.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r0, [r5,#oBattleObject_AIDataPtr]: operates on the current battle object''s AI data; sub
    r0,#0xF + add r0,#0xFF: net offset +0xF0 from the AIData pointer; four str r1,[r0,#0/4/8/0xC] with
    r1=0: zeroes 16 consecutive bytes; caller battle_applySuperArmorInvulnerability: clearing runs when
    granting armor + invulnerability; caller battleObject_tickAITimerFlags_802E4E4: clearing runs alongside
    AI timer-flag handling'
  refs:
  - bn6f/asm/asm03_0.s:15400
