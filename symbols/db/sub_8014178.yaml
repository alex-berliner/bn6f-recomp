name: sub_8014178
address: '0x08014178'
kind: function
status: confirmed
summary: Reads two stat slots (kind 8) of the current navi, indexes a 12-byte table with stat1*3+stat0, and hands
  the looked-up value (0x10/0x20/0x40) to sub_801DF8C.
interface: 'void sub_8014178(void); // in: r4, r6 preserved across call, lr; out: byte passed to sub_801DF8C in
  r0; clobbers r0, r1, lr, NZ flags; C/V reflect the final index add'
details: Takes two per-navi stat bytes via GetBattleNaviStatsByte — slot 0 and slot 1 of stat kind 8 — and combines
  them as index = stat1*3 + stat0, i.e. slot 1 selects a group of three entries and slot 0 picks one within it.
  The table byte_80141A0 has 12 bytes (0x20, 0x40, 0x10, 0x40, 0x40, 0x20, 0x10, 0x20, 0x10, 0, 0, 0), so the first
  three groups each cover three values and the last group is three zero entries. The selected byte is passed to
  sub_801DF8C, whose effect (and therefore the game meaning of 0x10/0x20/0x40 — likely a timer/counter or gain value)
  is not yet known. r4 is used as scratch for the table pointer but restored before return; r6 is simply preserved
  for the caller. C and V at exit come from the ADD that builds the index, not from anything meaningful.
