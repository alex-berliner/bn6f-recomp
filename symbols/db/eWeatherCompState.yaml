name: eWeatherCompState
address: '0x02000310'
kind: ram
previous_names:
- unk_2000310
status: probable
summary: 'Mr. Weather comp puzzle state (0x60 bytes): reset routine, trigger index, the tornadoes'' saved state
  (they rebuild from it on a map reload).'
details: 'Fields: +0x02 step of the reset routine weatherComp_putPlayerBack_808F810; +0x06 (u16) count of map objects
  0x1D spawned by weatherComp_spawnObject1DNearPlayer_80900C8 near MegaMan; +0x0E trigger index (code - 0x70 or
  - 0x60, weatherComp_checkTrigger70_8090004 / weatherComp_checkTrigger60_8090020); +0x0F / +0x10 animation and
  facing the reset gives MegaMan; +0x12 / +0x14 (u16) the point the reset puts MegaMan back at; +0x16 (byte) starts
  at 3 and is decremented by weatherComp_pickScript_8090104 each time flag 0xBE6 (tornado hit) is seen, the palette
  index +0x1C = 3 - it; +0x19+i the direction before last (owMapObject_weatherTornado_repickDirection_80A90E4);
  +0x28.. +0x47 the tornadoes'' saved state (above). Orb ring (2026-10-16): +0x06 (u16) the orbs laid (weatherComp_layOrbTrail_809005C;
  dropped to 0 when A is released), +0x08 the moving frames to the next orb (5, 1 while A is up), +0x0A the comp
  map''s tornado count (dword_808FF2C: 1, 2, 2, 2 for maps 0-3), +0x0B the tornadoes left (weatherComp_checkRingCapture_809019C
  counts it down; at 0 weatherComp_pickScript_8090104 starts byte_808F788, the comp won: "...The rain''s stopped!"),
  +0x0C the tornado being captured (weatherComp_findRingCapture_80901EC); the ring''s points are at 0x2011B30.'
evidence:
- method: runtime
  date: '2026-10-13'
  detail: 'One-off emulator probe: +0x06 rises by 1 every 6 frames while MegaMan''s rainbow-orb trail grows (0x08
    -> 0x10); the run''s loss at 432736 is the frame it reaches 0x10.'
  reproduce: 'python3 tools/vidsync/probes/trig.py RESULT STATE G   # on the PC with the vidsync data: RESULT/STATE
    from build-vidsync/data/auto/, run there through tools/vidsync/remote/py.sh; see docs/vidsync/SYMBOL_DOSSIER.md'
- method: runtime
  date: '2026-10-13'
  detail: 'One-off emulator probe: +0x40/+0x46 hold tornado 0''s X/Y; writing +0x38 does not change the tornado.'
  reproduce: 'python3 tools/vidsync/probes/dump300.py RESULT STATE G   # on the PC with the vidsync data: RESULT/STATE
    from build-vidsync/data/auto/, run there through tools/vidsync/remote/py.sh; see docs/vidsync/SYMBOL_DOSSIER.md'
- method: assembly-reading
  date: '2026-10-13'
  detail: 'weatherComp_init_808FDC0 zero-fills 0x60 bytes here while flag 0xBFB is clear and sets +4 = 0xFF, +0x20
    = 0xFF (word), +8 = 1, +0x16 = 3. The tornado (owMapObject_weatherTornado_80A8E74, r6 = this block) saves its
    state every active frame (owMapObject_weatherTornado_saveState_80A9218) and restores it on init when flag 0xBFB
    is set (owMapObject_weatherTornado_restoreState_80A9268), per instance i: +0x28+i mode, +0x31+i direction, +0x37+i
    move countdown, +0x3A+i pause countdown, +0x3D+i moves since the last pause, +0x40+2i / +0x46+2i X / Y (s16
    pixels). That explains the probe: +0x38 is tornado 1''s saved move countdown, a copy only read on a reload,
    and +0x40/+0x46 are tornado 0''s current X/Y.'
  reproduce: grep -n -A50 '^owMapObject_weatherTornado_saveState_80A9218:' bn6f/asm/asm29.s; grep -n -A30 '^weatherComp_init_808FDC0:'
    bn6f/asm/asm25.s
- method: runtime
  date: '2026-10-16'
  detail: 'Comp 2 (map 0x83:0x01): +0x0A = 2 and +0x0B = 2 (tornadoes / left) before the first capture; +0x06 counts
    the orbs as MegaMan lays them.'
  reproduce: 'python3 tools/vidsync/probes/tornstate.py data/auto/run7x.0/loss_435876.json data/auto/run7x.0/w_435564.state
    435880 10   # on 192.168.1.175 through tools/vidsync/remote/py.sh'
  result: '435564: ... orbs 0 c8 1 tor 2/2 strikes 3 ...; 435854: ... orbs 2 c8 1 tor 2/2 strikes 2'
- method: runtime
  date: '2026-10-16'
  detail: +0x0B (tornadoes left) drops from 2 to 1 at the ring capture of tornado 1 (435932), with tornado 1 written
    onto the video's track at 435769.
  reproduce: 'mkdir -p build/repro; echo ''[[435769, "0x2011f61=0x0/1,0x2011f5d=0x3/1,0x2011f7c=0xc/1,0x2011f80=0x0/1"]]'' > build/repro/t1.json;
    bash tools/vidsync/remote/py.sh probes/replaycost.py data/auto/test-tstate-1/loss_435876.json data/auto/test-tstate-1/w_435756.state
    435900 436060 build/repro/t1.json   # on 192.168.1.175'
  result: '435930 ... left 2 | 435932 ... left 1'
- method: assembly-reading
