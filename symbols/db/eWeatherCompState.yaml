    decrements +0xB per capture; weatherComp_pickScript_8090104 starts byte_808F788 when +0xB is 0.
  reproduce: grep -n -A20 '^sub_808FF00:' bn6f/asm/asm25.s; grep -n -A50 '^weatherComp_pickScript_8090104:' bn6f/asm/asm25.s
