open_questions:
- Which three AI/CurAction values map to the three handlers (we only know the table has 3 entries and the index
  is the live byte at [r5+9]).
- Whether the handlers are class-specific AI behaviors (initiative, counter-attack, dodge) versus animation/event
  steps; both fit the byte ranges seen in exit r0.
- Whether r5 really points to a BattleObject or to an AIData struct (offset 0x9 in AIData is `Unk_09`, less semantically
  meaningful than CurAction on BattleObject); settling this would require the r5 value at the call site at 0x80a7e20.
