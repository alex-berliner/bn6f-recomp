name: battle_dispatchAIActionByAction_80A7E4C
address: '0x080A7E4C'
kind: function
status: confirmed
summary: Jump-table dispatcher that routes an in-battle AI object to one of three per-frame action handlers based
  on the byte at [object+9].
interface: battle_dispatchAIActionByAction_80A7E4C(r5 = object, r7 = ?, r10 = ?) -> r5, r8-r12; clobbers r0-r3,
  nzcv, lr; preserves r4-r7
details: "Loads the address of a 3-entry jump table (off_80A7E60, at 0x080A7E60).\nReads a single byte from [r5+9];\
  \ that byte is a literal table byte-offset\n(0, 4, or 8), not a divided index.  Uses it to fetch a Thumb handler\n\
  address and branches with \"mov lr, pc / bx r0\".\n\nThe three dispatch slots (entry 0 / 1 / 2) point to:\n  0\
  \  ow_animWaitStep+1          – animation wait-step tick\n  1  object_waitThenSetAnim+1   – countdown then set\
  \ a new animation\n  2  sub_80A7EBE+1             – (unidentified third action handler)\n\nr4-r7 are saved/restored\
  \ by the push/pop prologue-epilogue; r5 is both an\ninput (object pointer) and an output (unchanged).  The handler's\
  \ live\nregister side-effects land in r8-r12, which the caller must read back.\nr6 is saved because the push covers\
  \ r4-r7 but a raw guest-call wrapper\nwould not protect it; the readable-C form explicitly saves/restores r4\n\
  and r6 around the GUEST_CALL_ADDR.\n"
