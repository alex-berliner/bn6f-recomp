name: battle_objectPhaseDispatch
address: '0x080DA172'
kind: function
status: probable
summary: Runs one step of a battle object's phase state machine (five handlers), skipping entirely while
  time-stop is active.
interface: (r5 = battle object) -> r0 = handler return value; flags preserved per handler
details: First checks battle_isTimeStop; if the battle is frozen (flags bit 2) it returns immediately
  without doing anything. Otherwise it calls sub_80DA448 (per-step setup, details unknown), then loads
  the object's current phase from oBattleObject_CurPhase and uses it as an index into a five-entry jump
  table at off_80DA190, dispatching via `mov lr, pc; bx r1` so each handler returns straight back to the
  caller of this function. The five handlers (0x80DA1A4, 0x80DA1AE, 0x80DA1C6, 0x80DA1F8, 0x80DA248) form
  the phases of this object's behaviour; the phase field is not advanced here, so handlers are responsible
  for their own transitions.
