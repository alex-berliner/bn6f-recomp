- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isTimeStop; tst r0,r0; bne locret: whole update suppressed during time-stop; ldrb
    r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0]: phase indexes a 5-entry table; off_80DA190 holds
    five thumb handlers sub_80DA1A4..sub_80DA248 dispatched via mov lr,pc; bx r1; bl sub_80DA448 runs
    before the dispatch, suggesting per-frame pre-step for the phase; recorded route ''chips'' places
