name: ai_beginNewTurn
address: '0x08111DF0'
kind: function
status: confirmed
summary: Starts a new AI turn for a battle object, resetting its AI turn counter to 1 and clearing its current action
  state.
interface: void ai_beginNewTurn(AIState* r6 ai_state, BattleObject* r5 battle_object)
details: 'Called at the start of an AI-controlled object''s turn. Writes 1 (halfword) to

  ai_state->TurnCounter (oAIState_TurnCounter, offset in the AI state struct addressed via r6),

  then calls battle_ResetObjectActionState_80165B8 with the battle object pointer in r5, which

  clears the object''s queued/current action so the AI can decide a fresh action this turn.

  Only r6 (AI state) and r5 (battle object) are used; return value and flags are ignored by callers.

  '
