name: ai_beginNewTurn
address: '0x08111DF0'
kind: function
status: probable
summary: 'AI turn-start handler: restarts the object''s turn counter and clears its current action/phase.'
interface: (no args read; r6 = battle object/AI state pointer) -> r0 = 0 (from callee); r6->oAIState_TurnCounter
  = 1
details: 'Stores the halfword 1 into r6''s oAIState_TurnCounter field, then tail-calls battle_ResetObjectActionState_80165B8,
  which sets the object''s action to 8 (idle/none) and clears its current phase and phase-initialized
  flag, returning 0. Together this re-initializes the enemy AI for a fresh turn: counter back at 1, no
  action queued. r6 must be set up by the caller (typical AI dispatch keeps the object in r6), since the
  function never sets it itself. Runs in battle AI context per the recorded battlesweep/beastsp routes.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_8111DF0: ''mov r0, #1; strh r0, [r6,#oAIState_TurnCounter]'' resets the turn counter to
    1; sub_8111DF0: ''bl battle_ResetObjectActionState_80165B8'' — callee sets action to 8 and clears
    current phase/phase-initialized flag; callee returns 0 in r0 and sub_8111DF0 just pops {pc}, so the
    function effectively returns 0; r6 is the only struct pointer used and is caller-provided, matching
    an AI dispatcher keeping the object in r6'
