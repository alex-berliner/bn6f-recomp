name: ai_resetAIDataSlots_800ED00
address: '0x0800ED00'
kind: function
status: confirmed
summary: Resets the eight-slot AI data pool, tagging each slot's owner field at +0x7C with a unique one-hot mask
  and clearing the "AI data in use" bitfield.
interface: void sub_800ED00(void); // returns r0=0, r1=&eUsedAIDataBitfield, r2=8, r3=0x100; flags from final cmp
  r2,#8 (Z=1, C=1, V=0)
details: 'Iterates the eight entries of eAIData (stride 0x100) and writes a one-hot marker word at offset 0x7C of
  each slot: slot i receives 0x80000000 >> i, so slot 0 gets 0x80000000, slot 1 gets 0x40000000, and so on down
  to 0x00000001 for slot 7. This field appears to act as the slot''s free/owner bitmask, letting later code find
  or claim an AI slot by testing these bits. After the loop it zeroes eUsedAIDataBitfield, marking all AI data slots
  as unused. Register side effects leak to callers: r0=0, r1=&eUsedAIDataBitfield, r2=8, r3=0x100 (the doubled #0x80
  slot stride), plus flags from the last cmp. Likely called when entering battle or otherwise rebuilding the enemy/chip
  AI state.

  '
