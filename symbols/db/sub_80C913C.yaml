name: sub_80C913C
address: '0x080C913C'
kind: function
status: hypothesis
summary: Looks up another battle object sharing the panel using a derived alliance and stores it in RelatedObject1Ptr
  plus a state slot in the 0x203CFB0 globals.
interface: void sub_80C913C(void);  /* reads panel (X,Y) and Alliance from R5; returns the found object pointer
  in R0 (0 on no-match). Clobbers R1-R3,LR,NZCV. */
details: 'Operates on the battle object passed in R5. Reads oBattleObject_PanelX,

  oBattleObject_PanelY and oBattleObject_Alliance. Calls object_getPanelParameters

  with the panel coordinates; only proceeds if the returned panel-state mask has

  any of bits 0x600000 set. Then calls sub_800AE54(panel_x, panel_y, 1 - alliance)

  to find an opposing-side object on the same panel; on success writes that pointer

  to oBattleObject_RelatedObject1Ptr and into a 3-word slot at A_dword_203CFB0

  (Alliance 0 -> +0xC offset): slot[0]=0, slot[1]=caller object, slot[2]=found object.

  Returns 0 if either the panel mask or sub_800AE54 check fails.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
