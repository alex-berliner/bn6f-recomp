name: battle_initObjectSpriteAndStartAnimation_811CC0C
address: '0x0811CC0C'
kind: function
status: confirmed
summary: Restarts a battle object's sprite — reads the object's sprite info, starts the animation stored in it,
  loads frame data, and switches the object to state 4.
interface: int battle_initObjectSpriteAndStartAnimation_ADDRESS(void); /* reads r4, r5 (passed through to callees),
  returns r0 = 1 with NZ set */
details: 'Entry point of a battle-object sprite (re)initialization routine. Calls sub_811CC68,

  which returns (in r0) a pointer to the object''s sprite-info structure; the halfword at

  offset +2 of that structure is the animation index to play. That index is passed to

  sprite_setAnimation (truncated to u8), then sprite_loadAnimationData loads the

  corresponding animation/frame data. Finally sub_811CC60 is called with r0 = 4, which

  presumably sets the object''s state/mode to 4 (a "running" or "active" state). The

  function always returns 1 (r0 = 1), with NZ flags reflecting that value; r4 and r5

  are untouched and pass through to the callees, so callers may rely on them surviving.

  The return of 1 likely signals success to a state-machine dispatcher.

  '
