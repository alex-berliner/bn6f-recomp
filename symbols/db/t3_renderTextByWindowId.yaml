name: t3_renderTextByWindowId
address: '0x0812EDFC'
kind: function
status: probable
summary: Renders the indexed text associated with a menu window or scene element.
interface: (r0 = window id, r1 = text variant index) -> r0 = rendered tile width/result from t3_renderIndexedText;
  flags clobbered
details: Converts window IDs in the 0x90-and-up range into an index by subtracting 0x90 and dividing by
  4, then scales the variant argument by 4 to select a table entry. It passes that entry to t3_renderIndexedText
  with the 0x90 tile base and mode/value 0x0A. The selected text script pointer is then rendered into
  the BG text tile region. Its return value is stored in menu state by known callers.
