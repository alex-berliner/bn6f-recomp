  date: '2026-10-21'
  detail: submenu_renderSelectedWindow passes a looked-up window id and variant 0 at 0x0812EF48, then
    stores the returned value at [r5,#0x30].; sub_812E08C passes window id 0x90 and variant 1 at 0x0812E1BC
    before similarly storing the result at [r5,#0x30].; The arithmetic at 0x0812EDFC-0x0812EE0C maps ids
    0x90, 0x94, ... to indices and indexes off_812EE18 using variant * 4.; The final arguments to t3_renderIndexedText
    are tile base 0x90 and 0x0A at 0x0812EE0E.
