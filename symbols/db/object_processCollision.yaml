name: object_processCollision
address: '0x080D6F74'
kind: function
status: probable
summary: 'Per-frame collision update for a battle object: tears down/rebuilds collision data, spawns hit
  effects, applies damage, and dispatches a per-action collision handler.'
interface: (r5 = battle object) -> void; r0 = scratch/result, flags used after battle_isBattleOver/isTimeStop/object_applyDamage
details: 'This is the shared collision step run for a battle object each frame (routes: battlesweep).
  It first removes stale collision data, then spawns the hit-effect object for the last collision. It
  aborts (clearing the collision region and setting oBattleObject_CurState = CUR_STATE_DESTROY) if the
  battle is over or if object_applyDamage(0) returns negative (fatal damage). Otherwise it tests the object''s
  alliance (indexed *4 into byte_80D6FD4, giving masks 0x05008000 and 0x0A008000) against oCollisionData_FlagsFromCollision
  and clears its collision region when bits match. When time is stopped it calls object_presentCollisionData
  directly; otherwise it tail-dispatches through off_80D6FC8 indexed by oBattleObject_CurAction (two handlers,
  sub_80D6FDC/sub_7008) — presumably custom per-action collision behavior.'
