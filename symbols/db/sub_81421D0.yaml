details: "The function is a 4-instruction getter: it loads the pointer constant eScenarioEffectState2000780\n  into\
  \ r5 via ldr from off_8142308, then performs a byte read at offset +0xb (i.e. r5[0xb]) into\n  r0, and immediately\
  \ pops the saved frame and returns. There are no other register touches\n  beyond r0/r5 and the saved lr/r4-r7.\n\
  \  The label eScenarioEffectState2000780 (a global EWRAM state struct) plus the offset 0xb is the\n  only state\
  \ the function consults. None of the eight callers pass arguments, and the contract\n  lists only lr as `in`,\
  \ which matches this being a pure leaf getter. The captured calls confirm\n  it: every entry has arbitrary r0-r3/sp\
  \ values that the function ignores, and r0 on exit\n  carries the read byte (the snapshots show post-conditions\
  \ and flags, but the assembly is a\n  plain `ldrb ...; pop {pc}` so the byte is exactly the live value).\n  The\
  \ semantic role of byte 0xb inside eScenarioEffectState2000780 is not derivable from the\n  function itself; the\
  \ eight callers (sub_8089704/89792/897A6, sub_80A86B4/A8748, sub_811E2B4/\n  E3CC, sub_81429CA) are unnamed battle\
  \ helpers, so this is most likely a small flag/byte used\n  by the battle AI/scenario system. The closest struct\
  \ field semantics known in this region\n  live in AIData (Unk_0b at +0xb in the AI data) and BattleState, but\
  \ the EWRAM address\n  0x2000780 corresponds to a different EWRAM block (\"eScenarioEffectState2000780\"), so\
  \ we\n  cannot tie it to a known field name without seeing the struct definition.\ndetails: |\n  Naming: \"battle_\"\
  \ because all 8 callers live in the battle subsystem (sub_8089xxx, sub_80A8xxx\n  battle handlers, sub_811Exxx\
  \ battle AI/handlers, sub_81429CA battle scenario) and the only\n  state consulted is an EWRAM scenario-effects\
  \ block. \"_getScenarioEffectStateUnk0b\" reflects\n  the exact behaviour: byte at +0xb. The `_ADDRESS` suffix\
  \ is kept because the role of byte\n  0xb is not pinned to a domain concept.\n"
