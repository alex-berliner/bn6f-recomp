name: sub_8135244
address: '0x08135244'
kind: function
status: confirmed
summary: Decrements a two-stage frame timer on a per-tick basis, ticking the primary counter at +0x2A first and
  falling through to the secondary counter at +0x2E once it expires.
interface: void tickDualTimer_8135244(void *timerObj) /* r5 in; r0-r2 preserved */
details: 'Operates on a small timer object whose pointer is supplied in r5. Each call loads

  the 16-bit primary countdown at offset 0x2A; if non-zero it is decremented and

  written back, and the secondary counter at +0x2E is left untouched. When the

  primary counter is already zero, the routine instead decrements the secondary

  16-bit counter at offset 0x2E (again only if it is non-zero). The function

  preserves r0-r2 and pushes them along with lr, restoring via pop {r0-r2, pc},

  so it is a leaf-style helper that must not disturb the first three caller-saved

  regs. Clobbers NZCV as a side effect of the ldrh/sub/strh sequence.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
