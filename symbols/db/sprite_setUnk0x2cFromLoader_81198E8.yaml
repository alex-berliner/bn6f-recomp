name: sprite_setUnk0x2cFromLoader_81198E8
address: '0x081198E8'
kind: function
status: confirmed
summary: Writes the sprite's unk0x2c field via sprite_setUnk0x2c, choosing base 0x40000000 when oSprite+0xC
  is 0xFF, otherwise 0.
interface: 'void sub_81198E8(u32 *oSprite)  /* in: r5=oSprite; out: none; clobbers r0,r1,r3,lr,NZCV */'
details: 'Reads the byte at oSprite+0xC. If it equals 0xFF, loads r0 = 0x40000000 (a

  hardware/IO base in the GBA memory map); otherwise loads r0 = 0. The byte

  itself is forwarded in r1. It then tail-calls (bl) sprite_setUnk0x2c and

  returns via `pop {pc}`. The function does not read the oSprite pointer

  itself from memory - r5 is supplied by the caller, so this is a per-entity

  helper invoked from an existing sprite loop. The 0x40000000 constant

  suggests the 0xFF sentinel selects a VRAM/PALETTE-style base address for

  the unk0x2c field write.

  '
