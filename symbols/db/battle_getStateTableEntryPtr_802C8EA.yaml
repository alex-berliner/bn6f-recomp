name: battle_getStateTableEntryPtr_802C8EA
address: '0x0802C8EA'
kind: function
status: confirmed
summary: Returns a pointer to the 8-byte entry of the table at dword_2036820 selected by the current battle state's
  Unk_0d field.
interface: battle_getStateTableEntryPtr(toolkit in r10) -> entryPtr out r0, index*8 out r2; clobbers r1; NZCV set
  by the final address add
details: 'Reads the toolkit''s battle state pointer (oToolkit_BattleStatePtr, [r10+off]),

  loads the byte at oBattleState_Unk_0d from the battle state struct, multiplies it

  by 8 (entry size 8 bytes), and returns dword_2036820 + index*8 in r0. r2 carries

  the byte offset of the selected entry (index*8), which callers can reuse for

  further indexing. Notably this is a pure "return address" helper: no bounds check

  on the Unk_0d index, and the flags left behind are just those of the pointer

  addition, not a deliberate result. The table at 0x2036820 holds 8-byte records

  whose meaning is not established from this function alone; Unk_0d reads like a

  current phase/slot selector into that table.

  '
