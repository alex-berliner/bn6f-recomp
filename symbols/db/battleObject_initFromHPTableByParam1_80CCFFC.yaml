open_questions:
- The actual semantics of the object type (what `byte_80CCFD4` describes — looks like per-Param1 extra-vars
  pointer + HP), and the meaning of `NameID = 0xD6 + Param1`, are inferred from the indexing pattern only;
  the data table contents at `0x80CCFD4` would settle what kind of battle object this initializes.
