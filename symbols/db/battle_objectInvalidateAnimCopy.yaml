    [r0,#oBattleObject_CurAnimCopy]: only action is storing sentinel 0xFF into the animation-copy byte;
    field name oBattleObject_CurAnimCopy ties r0 to the battle object struct; callers 0x08107E66, 0x08108688,
    0x081089A6 are battle-side object routines, matching the battle-object struct; 5-instruction leaf
