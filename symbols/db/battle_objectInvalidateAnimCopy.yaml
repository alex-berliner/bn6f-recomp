name: battle_objectInvalidateAnimCopy
address: '0x080C46B6'
kind: function
status: probable
summary: Marks a battle object's current-animation copy field as invalid (0xFF) so its animation is re-copied
interface: (r0 = battle object ptr, may be NULL) -> r0 = untouched; flags set by tst
details: Tests r0 and, only if non-null, writes 0xFF to byte field oBattleObject_CurAnimCopy (offset 0x4A
  of the battle object struct). 0xFF acts as a sentinel animation id meaning 'none/needs refresh', so
  downstream animation-copy code re-syncs the object's sprite animation on the next update. Does not touch
  any other field and returns via mov pc, lr without altering registers. Safe to call with a NULL object
  pointer.
