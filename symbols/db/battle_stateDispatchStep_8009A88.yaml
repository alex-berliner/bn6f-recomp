name: battle_stateDispatchStep_8009A88
address: '0x08009A88'
kind: function
status: confirmed
summary: Battle main-loop state dispatcher — reads the battle state's phase byte and tail-jumps to that phase's
  step handler via a 3-entry table.
interface: void sub_8009A88(r5=battle state ptr, lr=return) — dispatches to handler(r0=phase, r1=handler addr);
  handler's r2-r12 pass through to caller, NZCV and r0-r1, r7, lr clobbered
details: "Reads byte at [r5 + oBattleState_StatePhase] (r5 = current battle state object) and uses it\ndirectly\
  \ as a word offset into the phase table at off_8009A9C (no <<2 scaling, so phase\nvalues are stored pre-multiplied:\
  \ 0, 4, 8):\n  phase 0 -> battleState4EventWaitOrSkip (labeled battleState4EventWaitOrSkip+1, Thumb)\n  phase\
  \ 4 -> battle_stateCrossNetBattleIntroStep\n  phase 8 -> battle_stateWait10FramesThenGotoPhaseC\nSets lr = pc\
  \ and does bx to the handler, so the handler returns straight back to this\nfunction's caller (pop {pc} after\
  \ the handler returns to lr... actually the handler's bx lr\nlands back here only if it doesn't overwrite lr —\
  \ effectively a tail-call pattern; the\ntrailing pop {pc} executes on return). Handlers receive r0 = phase byte\
  \ value, r1 = their\nown handler address. Whatever the handler leaves in r2-r12 is propagated unchanged to the\n\
  outer caller, which is why the contract lists them as outputs.\n"
