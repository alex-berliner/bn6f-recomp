name: battle_initObjectDefaultSprite
address: '0x080B88F0'
kind: function
status: confirmed
summary: Resets a battle object to its default sprite setup — reloads the standard sprite, clears animation state,
  reapplies flip/palette, and enters the normal update state.
interface: 'void battle_initObjectDefaultSprite(Object* obj /* r5 */)  /* in: r5, lr; out: r5; clobbers r0-r3, lr,
  nzcv */'
details: 'Takes the battle object in r5 and (re)initializes its sprite. First

  object_setPanelsFromCoordinates recomputes the object''s panel position from

  its x/y coordinates. Then sprite_load is called with the constant resource

  triple (0x80, 0x10, 0x3D) — the object''s default sprite resource set —

  followed by sprite_loadAnimationData and sprite_noShadow, so the object has

  no shadow sprite. Bit 1 (0x2) of oObjectHeader_Flags is OR-ed in, marking the

  object as sprite-initialized. Animation state is reset: oBattleObject_CurAnim

  and oBattleObject_CurAnimCopy are both set to 0, sprite_setAnimation(0) is

  called and sprite_loadAnimationData is run again for animation 0. The palette

  is set to index 0 and the flip state is read from the object via

  object_getFlip and pushed back through sprite_setFlip, preserving the

  object''s current facing. Finally the state machine word

  oBattleObject_CurStateActionPhaseAndPhaseInitialized is set to CUR_STATE_UPDATE,

  handing the object to the standard per-frame update logic. r5 (the object

  pointer) is returned unchanged; r4 and r6 are preserved.

  '
