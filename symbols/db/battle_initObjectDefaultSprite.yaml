name: battle_initObjectDefaultSprite
address: '0x080B88F0'
kind: function
status: probable
summary: Reinitializes a battle object with a fixed default sprite (no shadow), resets its animation and
  flip, and switches it into the normal update state.
interface: (r0 = battle object pointer, passed through to callees; r5 = same object) -> r0 = CUR_STATE_UPDATE
  stored to object state field; no meaningful return
details: The function takes a battle object, recomputes its PanelX/PanelY from world position via object_setPanelsFromCoordinates,
  then loads a hard-coded sprite resource (arguments 0x10, 0x3D, 0x80) with sprite_load followed by sprite_loadAnimationData.
  It marks the sprite shadowless via sprite_noShadow, sets a flags bit 0x2 in the object header flags
  byte, zeroes both CurAnim and CurAnimCopy and applies animation 0 with sprite_setAnimation, reloads
  animation data, and sets palette 0 and the object's effective facing via object_getFlip/sprite_setFlip.
  Finally it writes CUR_STATE_UPDATE into the CurStateActionPhaseAndPhaseInitialized field, so the object
  begins executing its normal per-frame update on the next tick. The fixed resource arguments and full
  reset suggest it swaps an object onto a generic/default sprite while keeping its position, rather than
  a per-entity graphics init.
