name: object_dimScreen
address: '0x0800B94C'
kind: function
status: confirmed
summary: Battle-scene phase that fades the screen to dark (e.g. when the round is decided) and waits for the fade
  to finish before advancing the object's action state.
interface: 'void object_dimScreen(BattleObject *obj /* r5 */);  // returns flags/r0-r3 as side effects of the original:
  r0 = IsScreenFadeActive result on early return, 0 otherwise'
details: 'State-machine step for a battle object (r5 = oBattleObject). On first entry (PhaseInitialized == 0) it
  calls SetScreenFade(0x3C, 4) — a fade parameter of 0x3C (60, presumably frames to full dark) with mode/type 4
  — resets the object''s Timer (u16) to 0, and stores 4 into PhaseInitialized to mark the phase as set up. Every
  call afterwards increments the u16 Timer field. It then polls IsScreenFadeActive; while the fade is still running
  it simply returns. Once the fade completes it advances the object''s action state by storing CurAction + 4 into
  the byte at offset 9 (named oBattleObject_CurAnim in the shared header but used here as the current action), and
  clears the u16 CurPhaseAndPhaseInitialized field to 0 so the next phase re-runs its one-time setup. Purely a sequencing
  helper: touches only the object''s own Timer/CurAction/PhaseInitialized fields plus the global screen-fade system.

  '
