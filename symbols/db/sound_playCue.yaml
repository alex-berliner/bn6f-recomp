name: sound_playCue
address: '0x080FBD2C'
kind: function
status: probable
summary: Plays a hardcoded sound/voice cue (used when the ProtoMan AI starts its panel attack).
interface: () -> r0 = result of sub_800FE28 (cue handle/status); no flags
details: Loads r0 with a pointer to the 4-byte constant dword_80FBD3C (0xC0E1014) and tail-calls sub_800FE28,
  doing nothing else. The pointed-to data looks like an inline sound-cue descriptor whose low half (0x0114)
  is likely the sound/voice id and high half (0xC0E1) a bank or player parameter. Its only caller is ai_initProtoManPanelAttack,
  which sets up a ProtoMan AI attack, so the cue is presumably ProtoMan's voice or attack SFX played at
  attack start. The function is a thin wrapper existing only to bundle one cue with its data.
