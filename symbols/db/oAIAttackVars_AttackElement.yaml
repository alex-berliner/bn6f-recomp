name: oAIAttackVars_AttackElement
address: '0x1'
kind: struct-field
status: hypothesis
summary: One-shot "step has been initialized" flag set to 4 on entry and tested as a boolean to gate first-tick
  setup work.
details: 'Across virtually every accessor, the field is read with `tst r0, r0` (boolean test against zero)
  and, when zero, a block of init code runs that always concludes with `strb r0, [r7,#oAIAttackVars_Unk_01]`
  after `mov r0, #4`. The two branches then read Unk_10 as a live timer until it expires, after which
  the flag is either reused (e.g. cleared back to 0 in `sub_80EC7C0`/decrement/restart in `sub_80ECEBC`)
  or the routine exits. The values stored are almost always exactly 4 (with isolated 1/2 cases driving
  state machines like `sub_80ECEBC` and `sub_80ECF8E`), strongly consistent with a phase/init flag rather
  than data. This "read=0 then strb #4 then run" pattern repeats identically across the AI attack step
  table, transformation intros, charge counters, delay timers, and the `*TimerAndExitWhenDone` family
  — every caller is gating first-entry initialization, which is precisely what a 1-byte init flag expresses.'
