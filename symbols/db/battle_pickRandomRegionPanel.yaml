- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb Alliance + bl GetAllianceDependentPanelParamArgs with off_810DD00 -> byte_810DBF0 selects
    per-team region params; bl object_getPanelRegion then cmp r0,#0/#1 branches: 0 exits with r0=0, 1
    skips to return with r7=r0=1; loop loc_810DBAE compares list bytes to [r5,#oBattleObject_ExtraVars+0x10]
    and shifts the tail left to delete the match; bl GetPositiveSignedRNG; svc 6 (Div: r0/r1) then ldrb
    r0,[sp,r1] indexes a random surviving entry; lsr r1,r0,#4 + lsl/lsr 0x1d splits the chosen byte into
    high nibble and low 3 bits for the return'
