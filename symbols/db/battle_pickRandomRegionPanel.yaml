name: battle_pickRandomRegionPanel
address: '0x0810DB88'
kind: function
status: probable
summary: Picks a random panel from an alliance-dependent panel region (excluding one recorded on the object)
  and returns its packed panel data split into two fields.
interface: (r5 = battle object; uses oBattleObject_PanelX/Y, _Alliance, _ExtraVars+0x10) -> r0 = panel
  byte low 3 bits, r1 = panel byte high nibble; r0 = 0 if region lookup failed, r1 = 1 if the region is
  a single panel
details: 'Looks up the 8-byte panel-param entry for the object''s alliance in byte_810DBF0 (team 0: param
  0x10, args 0x0F8800A0; team 1: param 0x30, args 0x0F880080) and passes it to object_getPanelRegion along
  with the object''s panel X/Y; the region routine fills a byte list at sp and returns 0 (fail), 1 (single
  panel), or the list length. For lists longer than 1, it scans the list for a byte equal to [obj+ExtraVars+0x10]
  (likely the previously chosen panel) and, if found, removes it by shifting the remaining bytes left.
  It then rolls GetPositiveSignedRNG and uses BIOS SWI 6 (Div) to take RNG modulo the remaining count,
  yielding a random index. The selected byte is split: r1 = high nibble, r0 = low 3 bits (lsl 29/lsr 29),
  so each byte packs two fields (e.g. coordinate/index plus a type or counter).'
