name: object_createAIData
address: '0x0800ED2C'
kind: function
status: confirmed
summary: Allocates one of the 8 battle AI data slots (AIData + AIState + AIAttackVars) for an object, zero-fills
  it, and returns its pointer or NULL if all slots are in use.
interface: 'void object_createAIData() -> r0: eAIData slot base (or NULL), r2: updated eUsedAIDataBitfield value,
  r3: address of eUsedAIDataBitfield; r4/r5 preserved; clobbers r1, lr, flags'
details: "Finds the first free AI data slot by scanning the top byte (bits 31..0) of the global\neUsedAIDataBitfield,\
  \ with bit 31 = slot 0 and the test mask shifting right each iteration.\nThe 8 slots live back to back at eAIData\
  \ with a 0x100-byte stride (oAIData_Size), laid out as:\n  +0x00 AIData (0x7C bytes zero-filled),\n  +0x80 AIState\
  \ (0x20 bytes zero-filled),\n  +0xA0 AIAttackVars (0x50 bytes zero-filled),\nall cleared via ZeroFillByWord in\
  \ word units. On success the slot's bit is set in\neUsedAIDataBitfield and the slot base is returned in r0. If\
  \ all 8 slots are taken, r0 = NULL\nis returned and the bitfield is left untouched. Quirks: r2/r3 hand back the\
  \ bitfield value and\nits address so callers can update/read it without reloading; r5 is passed through unchanged\n\
  (popped as pushed); the \"no slot\" path is checked before the bit index is exhausted, and the\nloop caps at 8\
  \ slots.\n"
