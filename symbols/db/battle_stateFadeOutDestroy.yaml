name: battle_stateFadeOutDestroy
address: '0x080E1C66'
kind: function
status: probable
summary: Per-frame state handler that, on first run, sets OAM priority 2 and timer to 8; each frame decrements
  the timer and calls sprite_setAlpha with timer*2 (16→2 over 8 frames); when it underflows, disables
  alpha, clears bit 1 of oObjectHeader_Flags, calls sub_8011044(1, Param1), and transitions the object
  to CUR_STATE_DESTROY.
interface: (r0-r3 unused; r5 = battle object) -> void; writes oBattleObject_Timer, PhaseInitialized, ObjectHeader_Flags,
  CurStateActionPhaseAndPhaseInitialized
details: This is a per-frame state handler for a battle object. On the first invocation (PhaseInitialized==0)
  it calls sub_80E1CB0 with r0=r1=0 (likely resetting blend setup), sets OAM priority 2, loads the timer
  with 8, and marks the phase initialized (4). Each subsequent frame it decrements the timer and, while
  still >= 0, programs the sprite's alpha to timer*2, ramping 16 down to 0 so the sprite fades to fully
  transparent. When the timer underflows it calls sprite_disableAlpha, clears bit 1 of oObjectHeader_Flags
  (active/alive bit), calls sub_8011044(1, oBattleObject_Param1) — plausibly a sound or cleanup keyed
  by Param1 — and sets the object's state word to CUR_STATE_DESTROY to despawn it.
