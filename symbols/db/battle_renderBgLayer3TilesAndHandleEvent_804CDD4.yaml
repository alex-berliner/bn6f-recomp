open_questions:
- The exact meaning of bit 0x800 in eRenderInfo.Unk_00 (the contract labels it "Unk_00" with no semantics).
  Checking render_flushDisplayRegisters_800172C or other places that read RenderInfo offset 0 would settle
  it.
- Which story branch sub_804CE3C corresponds to (i.e. what EVENT_BF0 actually gates in-game) - needs an
  EVENT_BF0 reference in the event-flag table.
- What sub_804CE0C does specifically (palette upload? tilemap? VRAM fill?). Its callees/assembly would
  tell.
