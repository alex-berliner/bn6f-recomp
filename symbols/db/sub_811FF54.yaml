name: sub_811FF54
address: '0x0811FF54'
kind: function
status: hypothesis
summary: Maps a small index (0..11) through a fixed 12-byte ROM table, returning a permuted ID byte (indices 4 and
  8 are swapped; index 11 clamps to 0).
interface: int sub_811FF54(int index) -> int (r0 in = index, r0 out = byte at byte_811FF60[index]; clobbers r1)
details: 'Tiny read-only lookup: pushes lr, loads byte_811FF60[index] (no bounds check in the original code), and
  returns. The table is 0,1,2,3,8,4,6,7,5,9,10,0 — the identity for indices 0-3 and 6-7 and 9-10, but with entries
  4 and 8 swapped (4->8, 8->5 is actually 4->8 and 8->5, so indices 4,5,8 map to 8,4,5, a 3-cycle) and index 11
  reading past the intended range as 0 (the 12th table entry acts as an implicit out-of-range clamp back to 0).
  Because the only caller-visible effect is this permutation, it is almost certainly an ID remap used to translate
  one game''s numbering (e.g. Gregar vs Falzar variant ordering, or a scene/NPC/order numbering) into another, but
  the caller context in this snippet alone does not reveal which subsystem owns it.'
