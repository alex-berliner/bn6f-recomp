name: battle_dealChipsOnFadeIn
address: '0x08129A28'
kind: function
status: probable
summary: Per-tick handler that advances chip-deal animations, allocates the next chip entry while a slot
  is free, and once three chips are dealt writes state 0x14 to the record, triggers entity animation 3,
  and starts the screen fade.
interface: (r0 = [r5,#0x1d] record/object id; r5 = battle record) -> void; r1 out of the advance call
  = slot-free flag, r2 = count of dealt chips; writes state 0x14 to [r5,#3] and starts a screen fade when
  count reaches 3.
details: Each tick it calls battleObject_advanceChipAnimFrames_812B318 on the record id in [r5,#0x1d];
  that callee increments the +0x1C frame counter over the chip-select entries in unk_20251A0 and returns
  both a 'slot empty, can deal next' flag (r1) and the number of ready/dealt entries (r2, saved to r4).
  While r1 is set it calls sub_812B218 to allocate the next chip entry into the record's slot, i.e. keep
  dealing cards. Once the dealt count equals 3, it stores state byte 0x14 into the record's +3 state-machine
  field, sets the entity's sprite animation to 3, and calls SetScreenFade(8, 0x10) to begin the transition
  to the next phase. It is a leaf-style state handler invoked with r5 pointing at a battle record; no
  callers are known in the shown context.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battleObject_advanceChipAnimFrames_812B318 with r0=[r5,#0x1d]; r1 = deal-next flag, r2 =
    dealt count (mov r4,r2); tst r1,r1 / beq then bl sub_812B218: allocates the next chip entry only when
    the advance call reports a free slot; cmp r4,#3 / bne locret: the whole epilogue block runs only when
    all 3 chip entries are done; mov r0,#0x14 / strb r0,[r5,#3]: advances the battle record''s state byte
    to 0x14; bl sprite_setEntityAnimation(3,0) then bl SetScreenFade(8,0x10): plays the animation and
    kicks off the screen fade on completion'
