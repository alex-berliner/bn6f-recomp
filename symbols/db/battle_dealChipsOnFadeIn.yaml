  meaning of state byte 0x14 in the record's +3 field would confirm it
- 'Exact semantics of SetScreenFade''s arguments (8, 0x10): fade direction/color vs. duration'
- Whether r0 passed to sprite_setEntityAnimation is an entity id or an animation index
- 'The proposal is largely accurate: r4 holds the dealt count returned in r2, and when it equals 3 the
  code stores 0x14 to [r5,#3], sets sprite animation 3, and calls SetScreenFade(8,0x10). However, the
  proposed name embeds an address fragment (''DealTick_fadeInWhenDealt'') and mixes concerns; a cleaner
