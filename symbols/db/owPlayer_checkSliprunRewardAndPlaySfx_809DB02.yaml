open_questions:
- The exact player-side field semantics for halfword at +0x4C (the OWPlayer struct reserves 0x4C as `u16
  Unk_4c`); it plausibly overlaps JoypadHeld or a state copy, but the absolute fields touched on r5 are
  not directly pinned to a named member.
- The semantic meaning of EVENT_173E / EVENT_173F / EVENT_1716 (i.e. what slip-run progression they encode)
  is not derivable from this function alone; cross-referencing the story script/event-flag table would
  settle it.
- Why a halfword rather than a u8 is read for a single bit is unclear — could be a misalignment artifact
  in the calling struct, or the halfword is genuinely a small flag field that happens to be u16.
