name: battle_dispatchObjectPhaseHandler_80D1DEE
address: '0x080D1DEE'
kind: function
status: confirmed
summary: Trampoline that reads a battle object's CurPhase byte and jumps to the matching per-phase handler
  via a two-entry table.
interface: void battle_dispatchObjectPhaseHandler(r5 = battle object ptr, r10 = battle context ptr, lr
  = return); returns whatever the phase handler leaves in r1/r5/r8-r12 (r0 return value is discarded here);
  flags NZCV clobbered
details: 'Tiny dispatcher/trampoline for battle objects (the same struct family touched by the drag-and-drop
  object handlers). Loads oBattleObject_CurPhase (byte) from [r5], uses it as an index into the word table
  off_80D1E00, and calls the selected handler with the classic ARM->Thumb long-call trick: mov lr, pc
  + bx r1, so the handler returns into this function, which then does pop {pc} straight back to the original
  caller. Table contents: phase 0 -> battle_draggedObjectCheckTargetPanel+1, phase 1 -> battle_objectDraggedPhaseHandler+1.
  On entry the handler sees r0 = phase byte, r5 = object pointer, r10 = battle context; r1/r5/r8-r12 as
  left by the handler are this function''s effective outputs (contract derived from callers), so no state
  is copied back. No other registers are preserved. Only phases 0 and 1 are defined; any other CurPhase
  value would read a garbage entry out of the table (no bounds check).

  '
