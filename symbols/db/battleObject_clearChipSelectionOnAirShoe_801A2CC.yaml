open_questions:
- Whether bit 0x10 of FlagsFromCollision really is the "air-shoe stride hit" trigger or some other collision-derived
  flag; the function naming I picked follows ObjectFlags1.OBJECT_FLAGS_AIRSHOE but those constants live
  in a different field, so verify by tracing callers (sub_801A9B8/AA48/AAC0/AB40/ABB8/AC6C) and seeing
  when they fire. Drop the suffix if the bit ends up meaning something else.
- The exact caller context (whose BattleObject is r5) — these six sibling callers live near each other
  and likely run inside the per-actor battle update on some event. Naming could change to `battleObject_handleQueueChipCancellation_801A2CC`
  if the trigger isn't air-shoe-specific.
