name: battleObject_clearChipSelectionOnAirShoe_801A2CC
address: '0x0801A2CC'
kind: function
previous_names:
- sub_801A2CC
status: probable
summary: Clears the queue/Chip field of a BattleObject when its CollisionData FlagsFromCollision has bit
  0x10 set; if the actor is a PLAYER it also pops a slot back into the hand.
interface: (r5 = *BattleObject) -> ; side effects — writes r5->Chip = 0xFFFF and ChipsHeld = 0, and on
  the PLAYER branch increments the hand slot's count, popping the chip back to the battle hand.
details: "1. Loads CollisionDataPtr->FlagsFromCollision (offset 0x70 of CollisionData) into r0 via `ldr\
  \ r3,[r5,#oBattleObject_CollisionDataPtr]` + `ldr r0,[r3,#oCollisionData_FlagsFromCollision]`.\n  2.\
  \ Tests bit 0x10 of those flags with `tst r0,#0x10`; if clear, exits without modifying anything.\n \
  \ 3. Loads AIDataPtr->ActorType at offset 0x0; if ActorType != ACTOR_TYPE_PLAYER (=2), goes into the\
  \ short branch: just clears `r5->Chip` (offset 0x2a, halfword) to 0xFFFF and resets `r5->ChipsHeld`\
  \ (offset 0x1a) to 0, then returns.\n  4. If ActorType == ACTOR_TYPE_PLAYER, also stores 0xFFFF to `Chip`,\
  \ then calls `getBattleHandAddr_8010018(Alliance)` to get a pointer to the player's battle hand slot.\n\
  \  5. Loads the chip-count byte at [r0] (offset 0 of a hand slot, holding the live chip count), and\
  \ the chip entry id at [r0, r1*2 + 2] (slot index 1..n for queued chips).\n  6. Compares the chip id\
  \ with 0xFFFF; if equal there is no queued chip and we just return.\n  7. Otherwise the live count byte\
  \ is incremented by 1 (`add r1,#1 ; strb r1,[r0]`), i.e. the queued chip is \"returned\" to the hand\
  \ so the actor can re-queue it. The Chip field itself is left at 0xFFFF in this branch because we already\
  \ wrote it above.\n  The 0x10 bit of FlagsFromCollision being set strongly suggests this is an AIRSHOE-related\
  \ condition (OBJECT_FLAGS_AIRSHOE = 0x10 in ObjectFlags1, though the field here is FlagsFromCollision\
  \ not ObjectFlags1 — they collide by value), so on air-shoe step the current/queued chip must be discarded.\n"
