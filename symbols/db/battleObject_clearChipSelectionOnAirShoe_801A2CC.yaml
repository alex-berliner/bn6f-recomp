    (offset 0x70) at asm00_2.s:22587-22588. - `tst r0,#0x10` immediately tests bit 4 of the flag word
    — matches OBJECT_FLAGS_AIRSHOE. - `cmp r1,#2 ; beq loc_801A2EA` distinguishes ACTOR_TYPE_PLAYER (=2)
    from virus/navi per AIData.ActorType. - `strh r0,[r5,#oBattleObject_Chip]` with r0=0xFFFF writes the
    0xFFFF sentinel (no chip) to oBattleObject_Chip (offset 0x2a). - `strb r0,[r5,#oBattleObject_ChipsHeld]`
    clears ChipsHeld at offset 0x1a. - `bl getBattleHandAddr_8010018` is the only callee, returning a
