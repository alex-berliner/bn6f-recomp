name: chatbox_printNumber
address: '0x03006CD0'
kind: function
status: probable
summary: Text-engine formatter that prints a 16-bit game value as a decimal number with width, alignment
  and zero/space padding.
interface: '(r0 = text-state struct: +1 = source selector, +2 = format flags) -> r0 = small code (pad-flag
  + 3); digits emitted via sub_3006C18'
details: 'Byte [r0+1] picks the value: if bit7 clear, index*8 reads a word from the array at [r10,#0x38]
  (a per-scene variable table); if bit7 set, index*4 reads a halfword from table off_8043C8C. The value
  is converted to 8-digit packed BCD with memory_bcdConvert and countHexDigits gives the shift of the
  top decimal digit. Byte [r0+2] encodes the format: low 6 bits = minimum width, bit 0x40 = pad with ''0''
  (char code 1) instead of blank (char code 0), bit 0x80 = right-align (pad before digits, loop 3006D5C)
  vs left-align (pad after, loop 3006D3E). Each decimal digit is emitted most-significant-first as code
  digit+1 through sub_3006C18, and r9 counts characters written. The final return value is the pad flag
  plus 3, whose meaning for callers is unclear. Runs on every recorded route, consistent with being part
  of the shared text/chatbox drawing engine in IWRAM.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: '3006CF2-C00: calls memory_bcdConvert then countHexDigits_8000C5C on the fetched value — classic
    decimal-print preparation; 3006CE8-EF2: [r0+1] bit7 selects table off_8043C8C halfword vs word at
    [r10,#0x38]+idx*8 — a variable/operand selector; 3006D0A-D30: digit chars passed as value+1 (0 reserved)
    to sub_3006C18, width = [r0+2]&0x3F; 3006D10-D14 and D52-D58: 0x40 flag switches pad char (r7/r0 =
    0 blank vs 1 zero), 0x80 switches pad-before (D5C) vs pad-after (D3E) loops; executed on all routes
    (menus, battles, story) — shared text-output routine, not scene-specific'
