open_questions:
- What sub_80FCF90 (called with ScratchVar) and sub_80FCE40 (called with target panel + 4) actually do
  — likely attack/panel-effect spawners
- Which enemy/attack this step belongs to (element 4, sound 0xB0, anim 5) and what HitElement = 0x14 means
  downstream
- Why r4 = flip*0x100 + 0x27 is computed but never passed to the spawn call
- The first-entry branch (lines 4–14) and countdown/timer logic (lines 15–23) match the proposal exactly.
  However the proposal repeatedly says 'strikes the panel 4 ahead' but the code computes PanelX + facing
  (1 panel ahead) and passes 4 as the third argument to sub_80FCE40; the effect spawn at lines 24–35 also
  uses PanelX + facing with no +4 offset. The r4 = flip*0x100 + 0x27 is indeed computed but never consumed—correctly
  noted as a quirk. No known callers, so 'per-frame state-machine step' is an inference, though reasonable
  given the AttackElement/StepTimer/HitElement state flow. The name and core logic are fine; only the
  '4 ahead' characterization is wrong.
