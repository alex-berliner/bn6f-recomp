name: ai_attackStrikeAheadStep
address: '0x080FC700'
kind: function
status: probable
summary: 'AI attack step: first call sets element/anim/sound/timer; on subsequent frames counts StepTimer
  down, and at 0x14 calls sub_80FCE40 on the adjacent panel (PanelX+facing, PanelY, 4) and spawns an effect
  object at that panel''s pixel coords; when timer hits 0 writes 0x14 to HitElement.'
interface: (r0 = unused on entry; r5 = battle object, r7 = oAIAttackVars state) -> r0 = spawned effect
  object pointer or garbage when early-returning; no meaningful flags
details: 'On the first invocation (AttackElement == 0) it commits to the attack: AttackElement = 4, CurAnim
  = 5, calls sub_80FCF90 with the ScratchVar, plays sound effect 0xB0, sets the object counter time to
  12, and loads StepTimer with 30. On later invocations it counts StepTimer down; when it hits 0x14 it
  calls sub_80FCE40 with (front-panel X = PanelX + facing, PanelY, 4), i.e. the panel four columns in
  front of the object — likely spawning/arming the attack there. When the timer expires (<= 0) it writes
  0x14 into HitElement, apparently reusing the field as a post-hit marker, and stops. At StepTimer ==
  0x14 it also computes the same front panel''s pixel coordinates via object_getCoordinatesForPanels and
  spawns a type-1/type-4 effect object (effect type 0) there; r4 = object_getFlip()*0x100 + 0x27 is computed
  before that call but never passed, a leftover quirk. This is a per-frame state-machine step of the battle
  AI attack handler.'
