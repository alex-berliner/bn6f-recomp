name: loadOneSpriteTileRow_80287D2
address: '0x080287D2'
kind: function
status: confirmed
summary: Prime the engine's sprite descriptor slot from the local descriptor table and queue a 0x20-byte
  tile row of sprite graphics from ROM into VRAM.
interface: void sub_80287D2(/* r2 r4 r5 r6 r7 preserved, lr preserved */)
details: "Pushes lr, then performs two helper-style operations before returning to caller:\n\n1. Calls\
  \ sub_802868C with\n     r0 = *byte_802A6C0 (local 8-byte sprite descriptor table, see the .pool entry\
  \ at off_802880C),\n     r1 = 0x6009360 (the engine's 8-byte OAM/sprite descriptor slot in IWRAM),\n\
  \     r3 = 8 (byte count).\n   That fills the IWRAM sprite descriptor slot from the local table — see\
  \ also off_80287EC/dword_8722AF4 and off_8028808 dword_8028808 (0x6009360) referenced in the same .pool.\n\
  2. Calls QueueEightWordAlignedGFXTransfer with\n     r0 = *byte_86E587C (ROM source tile data),\n  \
  \   r1 = *unk_3001A80 (VRAM destination buffer, 8-word aligned),\n     r2 = 0x20 (32 bytes = one 8x8-tile\
  \ row, 16bpp tile of 32 bytes).\n   Queues one tile row of sprite graphics for DMA upload.\n\nThe nearby\
  \ dword_80287F4 (=0x540, the negative NybbleRAM tile-load magic-like constant) and the\npaired entries\
  \ (off_80287F8 -> dword_8725854 / unk_3001AA0 / 0x6009AA0 / off_8028818 -> byte_86E587C\n/ off_802881C\
  \ -> unk_3001A80) suggest this routine is the \"load tile row + descriptor\" helper\ninvoked from a\
  \ sibling function (likely the routine that first loads the descriptor-table half at\n0x6009AA0 from\
  \ dword_8725854 and then jumps here for the tile-half).\n\nclobbers r0-r3 and lr per the lifted contract;\
  \ r4-r7 are preserved; pop {pc} returns.\nThe function takes no working arguments (only callee-preserved\
  \ r2/r4/r5/r6/r7 are listed as\npreserved on input, but they aren't actually used).\n"
