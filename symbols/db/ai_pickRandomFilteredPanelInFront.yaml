name: ai_pickRandomFilteredPanelInFront
address: '0x080F60C4'
kind: function
status: probable
summary: 'AI helper that picks a random filtered panel for a battle object: it scans forward to the first
  relevant panel, gathers filtered panels from the columns in between, and returns a randomly chosen panel
  coordinate.'
interface: (r0 = battle object ptr, r2/r3 = required/forbidden panel-attribute masks passed through to
  the panel scanners) -> r0 = low 3 bits (x) of the chosen panel-list byte, r1 = high nibble (y); list
  buffer built on the caller's stack
details: Checks the object's first flag word against 0xa000; if any of those bits are set it skips straight
  to the fallback path. Otherwise battle_scanPanelsInFront_800D58C finds the first panel ahead holding
  something relevant to the object's alliance, and a target column is computed one step back from it (using
  negated object_getEnemyDirection). Starting from column 1 (or column 6 when byte [r5+0x16] is nonzero),
  it walks columns in the object's facing direction, calling object_getPanelsInColumnIgnoreRowFiltered
  with the r5+0x13 filter byte and r2/r3 masks, appending results to a list at sp+0x10 and summing counts
  until the target column is reached. If no panels were collected it retries on the target column alone;
  if still none it falls back to object_getPanelsExceptCurrentFiltered over the whole field. It then draws
  GetPositiveSignedRNG, reduces it with the Div swi (svc 6) modulo the entry count, and returns the selected
  entry's byte split into y (high nibble, left in r1) and x (low 3 bits, returned in r0). r5 is not set
  up inside the function, so it relies on state left by the caller.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst r0, 0xa000 on object_getFlag result gates the fast/fallback split (loc_80F612C); loop calls
    object_getPanelsInColumnIgnoreRowFiltered per column, accumulating r6 and appending bytes at sp+0x10+r6
    until r4 equals the scanPanelsInFront-derived target; svc 6 (Div) with GetPositiveSignedRNG in r0
    and count in r1, then ldrb [sp+0x10+r1] selects a random list entry; lsr r1,#4 / lsl+lsr #0x1d split
    the entry byte into y (r1) and x (r0) panel coordinates; fallbacks reuse the same sp+0x10 list buffer
    with object_getPanelsExceptCurrentFiltered when no in-between panels exist'
