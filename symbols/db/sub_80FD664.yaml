name: sub_80FD664
address: '0x080FD664'
kind: function
status: confirmed
summary: 'AI attack vars tick: when the AI attack timer (Unk_10) hits zero, clear flag 0x40 on the object, set the
  currently-moving flag, and reset Unk_00 to 0xC.'
interface: void sub_80FD664(void);  /* r7 = AI attack vars object; clobbers r0,r1,r2,lr and nz c v flags */
details: "Reads `oAIAttackVars_Unk_10` as a u16, decrements it, and stores it back. While\nthe result is > 0 (tested\
  \ on the zero-extended halfword), the routine returns\nimmediately. When the timer reaches 0:\n    - Calls object_clearFlag(0x40)\
  \ to drop bit 0x40 on the object.\n    - Calls object_setFlag1(1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) (i.e.\
  \ 1 << 19).\n    - Sets `oAIAttackVars_Unk_00` back to 0xC.\nThe two halves (timer tick + state transition) make\
  \ this look like the per-frame\nstate timeout of an AI attack controller object: it lets the move play out for\n\
  a counted number of frames, then snaps the object into its moving/post-attack\nstate with the cooldown/follow-up\
  \ timer Unk_00 = 0xC.\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
