name: ai_chargePanelAttackStep
address: '0x080FA22A'
kind: function
status: probable
summary: 'AI attack state: on first tick locks the target panel and charges, periodically highlighting
  it, then fires the attack when the timer expires.'
interface: (r0 unused; r7 = attack vars struct) -> updates oAIAttackVars fields, sets HitElement = 8 (fired)
  or 0x10 (invalid target); flags clobbered by calls
details: On entry, if oAIAttackVars_AttackElement is 0 it is initialized to 4 (attack kind), and the target
  object's panel coords (offsets 0x12/0x13) are validated with object_isValidPanel; if valid they're copied
  into TargetPanelX/Y, StepTimer is loaded from AttackBoost2 and ChargeCycles zeroed. On subsequent ticks
  ChargeCycles increments and every 8th tick (bit 3 carry) the target panel is re-highlighted via object_highlightPanel
  while StepTimer counts down. When StepTimer reaches 0 the attack itself is launched by calling sub_80FAB2C
  with the stored panel coords and HitElement is set to 8. If the target panel was out of the 6x3 grid,
  HitElement is set to 0x10 instead, aborting without attacking.
