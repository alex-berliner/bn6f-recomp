name: battle_aiAttackDispatch_810ED70
address: '0x0810ED70'
kind: function
previous_names:
- sub_810ED70
status: probable
summary: 'AI attack-vars dispatcher: exits the current attack state under battle-over / enemy-friendly conditions,
  otherwise jumps through a sub_810EDB8/EE04/EE3E table indexed by AIAttackVars.Unk_00.'
interface: (r5 = *BattleObject, r6..r7 = scratch, r10 = *Toolkit, lr = ret) -> r0 = 0 ; side effects may transition
  BattleObject out of attack state via object_exitAttackState_801171C, or tail-call a sub-handler with r0 = AIAttackVars.Unk_00
details: "1. Reads AIAttackVars.Unk_28 (offset 0x28 into the AttackVars array at AIDat+0xa0) and bails out of the\
  \ dispatch if that pointer is NULL (beq loc_810ED9C).\n  2. Calls battle_isBattleOver; if it returns nonzero,\
  \ also falls through to the dispatch tail (beq loc_810ED9C).\n  3. Reads BattleObject.Alliance (offset 0x16 in\
  \ the struct) into r0 and XORs with 1 (flips friend/enemy), then calls sub_80103F8. If that helper returns nonzero,\
  \ bails to dispatch.\n  4. Otherwise dereferences [r0+0x24] (likely AIData+0x24 = JoypadPressed) and bails if\
  \ any bit is set (bne loc_810ED9C).\n  5. When none of those bail conditions fire, calls object_exitAttackState_801171C(r5,\
  \ r6, r7, lr) and returns via pop {pc}.\n  6. The loc_810ED9C epilogue indexes off_810EDAC (3-entry table) by\
  \ AIAttackVars.Unk_00 and bx-jumps to sub_810EDB8+1, sub_810EE04+1, or sub_810EE3E+1, preserving r0=Unk_00 as\
  \ the input to the selected handler.\n  7. Lives inside an AI attack-step routine (snap_beastsp_* capture names\
  \ suggest this path runs while a Beast Out style attack is processing); r7 is the AIAttackVars pointer and r5\
  \ is the controlling BattleObject.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- ldr r0, [r7,#oAIAttackVars_Unk_28] then ldr r0, [r0]; cmp r0,#0; beq loc_810ED9C – guarded NULL-pointer
    branch. - bl battle_isBattleOver; tst r0,r0; beq loc_810ED9C – ends the attack when the battle itself is over.
    - ldrb r0, [r5,#oBattleObject_Alliance]; eor r0,#1; bl sub_80103F8; tst r0,r0; bne loc_810ED9C – checks the
    opposite-side (or self-side) helper against an unknown predicate. - ldrh r0, [r0,#0x24]; tst r0,r0; bne loc_810ED9C
    – JoypadPressed check (AIData+0x24 is JoypadPressed per the struct) aborts the AI step. - bl object_exitAttackState_801171C
    – when all checks pass, the AI cleanly leaves its attack state before returning. - loc_810ED9C reads AIAttackVars.Unk_00
    (ldrb r0,[r7,#oAIAttackVars_Unk_00]) and does `ldr r1,[r1,r0]; mov lr,pc; bx r1` via off_810EDAC which holds
    sub_810EDB8+1, sub_810EE04+1, sub_810EE3E+1 – the dispatcher itself only chooses between the three. - The capture
    names "snap_beastsp_*" and exit r0=0 with -Z flag confirm the routine’s standard return value when it falls
    off the end via locret_810EDA6 is r0=0.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0810ED70

    '
