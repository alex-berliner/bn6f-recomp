open_questions:
- What the three sub-handlers (sub_810EDB8/EE04/EE3E) actually do, what Unk_28 holds, and what sub_80103F8 is testing
  for. Naming the entry sub-handlers (and recognizing Unk_00 as a sub-step / animation ID rather than alliance or
  joypad bit) would let the dispatcher be renamed more specifically.
