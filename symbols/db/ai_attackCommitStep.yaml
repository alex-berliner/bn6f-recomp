name: ai_attackCommitStep
address: '0x08106E68'
kind: function
status: probable
summary: 'Per-frame tick of an AI attack step: once its timer expires, commits the object''s reserved
  future panel and re-arms the next step.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: Called every frame while this attack step is active; it decrements oAIAttackVars_StepTimer and
  returns until it hits zero. On expiry it switches the object to anim 3 (oBattleObject_CurAnim), copies
  oBattleObject_FuturePanelX/Y into oBattleObject_PanelX/Y, then releases the panel reserve and recomputes
  pixel coordinates and collision/facing via object_removePanelReserve, object_setCoordinatesFromPanels,
  and object_updateCollisionPanels. It then reloads StepTimer with 3 and sets oAIAttackVars_HitElement
  to 8, so the next step ticks in 3 frames and future hits carry element 8. This is the 'land on the reserved
  panel' moment of a scripted boss movement attack (routed via battlesweep).
