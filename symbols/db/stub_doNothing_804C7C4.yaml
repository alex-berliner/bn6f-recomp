kind: function
status: confirmed
summary: Empty placeholder routine that does nothing and returns immediately, most likely a stubbed-out
  callback or unimplemented hook.
interface: 'void stub_doNothing_804C7C4(void) // in: lr (return address); out: r5 passes through unchanged;
  all r4-r7 preserved'
details: 'The function body is only "push {r4-r7,lr}" immediately followed by "pop {r4-r7,pc}", so it
  performs no work at all and returns straight to its caller. Every register, including the lifter''s
  reported output r5, is passed through untouched (push/pop round-trip preserves r4-r7, and the pop loads
  pc from lr''s slot). Nothing in the game''s data or state is read or written. It exists purely so other
  code can call it as a no-op — the typical shape of a disabled/unimplemented callback, an empty event
  handler, or a placeholder for a function that was never finished. The "outputs: r5" in the register
  contract is just an artifact of callers reading r5 after the call; since the body doesn''t touch r5,
  callers effectively receive back whatever they passed in.

  '
