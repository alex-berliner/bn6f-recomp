name: battleObject_dyingTickDespawn_80C6CBA
address: '0x080C6CBA'
kind: function
status: confirmed
summary: Per-frame "dying" tick for a battle object — despawns it once its death animation finishes (or after a
  Timer2 linger), parking it offscreen and marking it destroyed.
interface: void battleObject_dyingTickDespawn(BattleObject* obj /* r5 */); clobbers r0-r3, lr; caller ignores flags
  and registers on return (returns via pop {pc})
details: "Runs one frame of a battle object's death sequence (r5 = battle object).\nTwo despawn triggers, selected\
  \ by the object's Param1 byte (+0x04):\n  - Param1 < 12: calls sprite_getFrameParameters and checks the\n    end-of-animation\
  \ bit 0x80 in the result; while it is clear the object\n    stays alive and the function returns.\n  - Param1\
  \ >= 12: decrements the 16-bit Timer2 field (+0x12 per the\n    listing's oBattleObject_Timer2); until it hits\
  \ zero the object lingers.\nOnce the trigger fires: writes 0xF0 (offscreen park position) to the\n16-bit X field\
  \ (oBattleObject_X16), calls object_clearCollisionRegion to\ndrop the hitbox, and stores CUR_STATE_DESTROY (=8)\
  \ into the object's\ncurrent-state word (oBattleObject_CurStateActionPhaseAndPhaseInitialized),\nwhich the engine\
  \ treats as \"object is dead / ready for cleanup\".\n"
