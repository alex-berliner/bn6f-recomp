name: battle_copyWorkBlockToBattleWork_813676C
address: '0x0813676C'
kind: function
status: confirmed
summary: Copies an 8-byte block from the work/save buffer at 0x2000090 into the battle work area at 0x2022B70.
interface: void sub_813676C(void)
details: 'A tiny leaf helper: pushes lr, then calls CopyBytes(src = 0x2000090, dest = 0x2022B70,

  count = 8) and returns. So it always copies exactly 8 bytes from the fixed EWRAM

  buffer unk_2000090 into the fixed battle-work buffer unk_2022B70, refreshing a small

  mirrored block (likely a sub-record/flag/status field used by battle logic). No

  arguments are read and no results are returned; the caller supplies only lr.

  Clobbers r0-r3 and lr via the CopyBytes call; no memory beyond the two fixed

  addresses is touched.

  '
