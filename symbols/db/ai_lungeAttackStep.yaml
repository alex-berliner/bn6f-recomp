  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal well: it sets AttackElement=4, checks object_canMove, indexes byte_80FA134
    by Alliance<<3 (0x10/0x0F8800A0 vs 0x30/0x0F880080), reserves panel, sets CANNOT_SLIDE, CurAnim=4,
    HasMoved=1, StepTimer=4, then decrements StepTimer and on 0 writes HitElement=4. However the proposal
    says ''oAIAttackVars_PanelChooseCallback'' but the code calls the function indirectly via r1 which
    is loaded from r7,#oAIAttackVars_PanelChooseCallback, and the summary saying ''lunges onto a panel''
    is okay. Name ''ai_lungeAttackStep'' is reasonable; ''ai_attackStep_lunge'' or just ''ai_attackStep''
    might be cleaner, but ''ai_lungeAttackStep'' fits. Minor: the summary implies ''element-4 hit'' which
    is correct (HitElement=4). Slight nit that the function aborts via object_exitAttackState when canMove
    or callback returns 0.; run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
