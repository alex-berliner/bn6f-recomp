name: ai_lungeAttackStep
address: '0x080FA0D0'
kind: function
status: probable
summary: 'AI attack step: on first call sets AttackElement=4, picks a panel near the target via the stored
  PanelChooseCallback (indexing byte_80FA134 by Alliance<<3), reserves it, sets CANNOT_SLIDE and CurAnim=4,
  then waits StepTimer=4 frames before writing HitElement=4; aborts via object_exitAttackState if canMove
  or the panel choose fails.'
interface: (uses r5 = battle object, r7 = oAIAttackVars) -> void; sets AttackElement/FuturePanelX/Y/HasMoved/StepTimer/HitElement
details: First entry sets oAIAttackVars_AttackElement=4 and checks object_canMove; if blocked (or the
  panel-choose callback returns 0) it clears HasMoved and calls object_exitAttackState to abort. Otherwise
  it indexes byte_80FA134 by Alliance<<3 to get two word-sized parameters per side and calls the stored
  oAIAttackVars_PanelChooseCallback with (targetObjectPtr, callbackSelf, param1, param2); the callback
  returns the chosen panel in r0/r1, which are stored into FuturePanelX/Y, after which object_reservePanel
  claims the panel and object_setFlag1 applies OBJECT_FLAGS_CANNOT_SLIDE. The object then plays CurAnim=4,
  sets HasMoved=1 and StepTimer=4. On subsequent calls it counts StepTimer down, and on reaching 0 writes
  HitElement=4, delivering the attack. The two offset pairs (0x10/0 and 0x30/0 with 0x0F8800A0-style payloads)
  encode side-dependent targeting data for the callback.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub_80FA0D0+8: writes 4 to oAIAttackVars_AttackElement, so 4 identifies this attack''s element/phase;
    calls object_canMove and on failure branches to loc_80FA124 which clears HasMoved and calls object_exitAttackState
    (abort path); ldr r1,[r7,#oAIAttackVars_PanelChooseCallback] then bx r1 with target ptr and alliance-indexed
    table data; result stored to FuturePanelX/Y followed by object_reservePanel; sets oBattleObject_CurAnim=4,
    HasMoved=1, StepTimer=4; later branch decrements StepTimer and on zero stores HitElement=4 (delayed
    hit); byte_80FA134 has two 8-byte entries indexed by oBattleObject_Alliance<<3, i.e. player/enemy-side
    variants of the same attack'
