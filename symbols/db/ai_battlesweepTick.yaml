name: ai_battlesweepTick
address: '0x080F306C'
kind: function
status: probable
summary: 'AI attack step timer tick: when the timer expires, ends the attack pose and tags the object
  with hit element 0xC.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 clobbered; flags set by comparison after decrement
details: Decrements oAIAttackVars_StepTimer and returns immediately while it is still positive. On reaching
  zero it resets oBattleObject_CurAnim to 0, clears flag 0x40 in the object's ObjectFlags1 via object_clearFlag,
  and ORs in bit 0x40 (1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) via object_setFlag1, marking the object
  as currently moving again. It then writes 0xC to oAIAttackVars_HitElement, presumably selecting the
  element/type of the sweep's hitbox. Each call is a one-frame step of an attack animation/hold period
  driven by an external scheduler.
