  detail: 'ldrh r0,[r7,#oAIAttackVars_StepTimer]; sub #1; strh; bgt locret — a countdown that gates the
    body (sub_80F306C+2); strb r0(0),[r5,#oBattleObject_CurAnim] — animation reset on expiry (sub_80F306C+0xC);
    bl object_clearFlag with 0x40 then object_setFlag1 with 0x40<<CURRENTLY_MOVING_1_BIT — flag bookkeeping
    via known callees (sub_80F306C+0x10..0x18); mov r0,#0xC; strh [r7,#oAIAttackVars_HitElement] — sets
