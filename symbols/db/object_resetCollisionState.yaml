  - 0x0801BB46 object_removePanelReserve
  - 0x0801A07C object_setCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080F4964
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
