name: chatbox_cmdRunScriptByGameProgress_8041748
address: '0x08041748'
kind: function
status: confirmed
summary: Chatbox script command that starts one of two sub-scripts depending on whether the current game progress
  value lies within a given range.
interface: chatbox_8041748(r4=cmdPtr, r5=?, r10=toolkitPtr, lr=ret) -> r0=1, r1..r3=scratch, r4=maybe advanced,
  flags NZCV set
details: "Handles a 6-byte chatbox script command of the form:\n  [2] = min game-progress value (inclusive) that\
  \ satisfies the condition\n  [3] = max game-progress value (inclusive) that satisfies the condition\n  [4] = sub-script\
  \ ID to run when progress is within [min,max] (0xFF = none)\n  [5] = sub-script ID to run when progress is outside\
  \ the range (0xFF = none)\nReads the game state pointer from the toolkit at r10+oToolkit_GameStatePtr,\nthen the\
  \ current progress byte at GameState+oGameState_GameProgress (offset 6).\nCompares progress against min/max as\
  \ signed bytes; picks offset 4 when\nmin <= progress <= max, otherwise offset 5. If the chosen ID is not 0xFF,\n\
  calls chatbox_config_80408D0(notUsed, scriptID) to start that sub-script\n(the first argument is unused by the\
  \ callee). Quirk: in that branch r4 is NOT\nadvanced past the command - starting a new script replaces the chatbox's\n\
  script context, so the old pointer is simply abandoned. If the chosen ID is\n0xFF (no sub-script for this branch),\
  \ r4 is advanced by 6 to skip the whole\ncommand and execution continues in the current script. Always returns\
  \ r0 = 1\n(and flags reflect that value / the r4+6 add in the skip path).\n"
