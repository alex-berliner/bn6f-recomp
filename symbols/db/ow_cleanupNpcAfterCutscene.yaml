name: ow_cleanupNpcAfterCutscene
address: '0x080A8484'
kind: function
status: confirmed
summary: After a cutscene's script returns to its start, counts down a short delay on an overworld NPC map object,
  then clears the scene's event flags and frees the object.
interface: void ow_cleanupNpcAfterCutscene(r5 npc, r10 ctx); caller-facing r2/r3/r4 are callee garbage, r5 preserved
  on the early-return paths, flags clobbered
details: 'First calls cutscene_checkOriginalCutsceneScriptPos_8036F70 with the byte at byte_808C74C (a global cutscene/script
  position or current scene id); if the script position is not back at its original spot (Z clear) it returns immediately,
  leaving the NPC in place. Otherwise it decrements the byte at npc+7 (r5+7), a frame countdown the object uses
  to linger after the scene ends; while nonzero it returns. When the counter reaches zero it calls gameState_setUnk09_8001172(0),
  clears event flags EVENT_9D8, EVENT_9FF and EVENT_9D9 (the flags the cutscene raised), calls reqBBS_clearFlag_8140A0C
  (clears the BBS/reqBBS state flag, clobbers r4), and finally frees the map object with FreeOverworldMapObject,
  which trashes r0-r3 and r5. All caller-visible register outputs (r2-r5) are whatever the callees leave behind;
  the routine itself writes no registers except the npc+7 countdown byte. r10 is passed through untouched as context
  for the callees (the typed wrapper forwards it).

  '
