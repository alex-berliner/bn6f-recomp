name: MapScriptCutsceneCmd_give_or_take_item
address: '0x0803813E'
kind: function
status: confirmed
summary: Map cutscene script command that gives the player an item (counted) or takes one based on a mode byte.
interface: 'void Next(void);  // script cmd dispatcher entry

  inputs:  r4 (script reader handle), r5, r7 (script byte stream cursor), r8, r9, r10, r11, r12, lr

  outputs: r0 = 1, nz flag set; clobbers r1, r2, r4, r6, r8, r9, r10, r11, r12; preserves r5

  '
details: 'Reads three script bytes (item id, count, mode) from the map cutscene

  command stream (r7). When the mode byte equals 1, calls TakeItem;

  otherwise calls GiveItem. Both calls receive the item id in r0 and the

  count in r1, matching the standard GiveItem/TakeItem ABI. Advances the

  script cursor by 4 to skip the opcode plus its three-byte payload, and

  returns r0 = 1 (nz) so the dispatcher knows the command was handled.

  Mode semantics: "1" = take, anything else = give.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
