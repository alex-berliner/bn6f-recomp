name: e_beastLinkGateFrameHandler
address: '0x0812B5C8'
kind: function
status: probable
summary: 'Per-frame driver of the Beast Link gate sequence: refreshes a mode byte, dispatches the current
  step handler from a 5-entry jump table, and runs the standard entity/sprite update once the sequence
  reports completion (0x1C).'
interface: () -> void; uses r5 as pointer to the sequence state whose byte at +2 is the step index; writes
  sub_803EAE4's return to eStruct203F7D8+1; r0 = menu_dispatchStateHandler's return
details: 'First calls sub_803EAE4, which dispatches on the mode byte at eStruct200BC30, and stores its
  result byte at eStruct203F7D8+1, so this record mirrors the current eStruct mode/state. It then reads
  a step byte from [r5,#2] (r5 holds a sequence-state pointer set up outside this function) and tail-calls
  the matching entry of JumpTable812B5F4: step handlers sub_812B608, ow_postBattleResetState, e_endBeastLinkGateSequence,
  sub_812B708, sub_812B758. After the step handler returns it calls menu_dispatchStateHandler; if that
  returns 0x1C (a ''done/finished'' code), it runs the normal per-frame entity pipeline entity_runAllUpdateHandlers_80465BC
  followed by battle_updateEStructSprites_80465F8. Otherwise it returns without touching entities/sprites,
  so world objects only animate once the gate sequence reaches its end state. The use of ow_postBattleResetState
  and e_endBeastLinkGateSequence ties the state machine to the post-battle Beast Link gate flow.'
