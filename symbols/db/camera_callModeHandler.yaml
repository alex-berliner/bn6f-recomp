name: camera_callModeHandler
address: '0x080302D0'
kind: function
status: probable
summary: Dispatches the camera's per-mode update routine based on the camera struct's mode field.
interface: (r5 = camera struct, mode at oCamera_Mode selects handler) -> calls handler with r5 intact;
  r0/r1 clobbered by the dispatch; returns handler's result
details: 'Loads a handler table address (off_80302E4), reads the byte oCamera_Mode from the camera struct
  in r5, indexes the table, and tail-calls the selected routine via the mov lr,pc/bx trick so the callee''s
  return reaches the pop {pc}. The five entries are: copy scroll to render layers, snap scroll to camera
  position, clear scroll offsets, sub_803035E, and a nullsub — one per camera mode. r5 is deliberately
  kept as the callee''s argument; this function itself takes no register arguments.'
