name: HandleLibraryMenu8124B3C
address: '0x08124B3C'
kind: function
status: confirmed
summary: Trampoline that dispatches the Library Menu's per-frame/state handler via a 3-entry jump table.
interface: 'void HandleLibraryMenu8124B3C(void); /* inputs: r2, r5, r10, lr preserved on entry; reads [R5+1] as
  state index; clobbers c,v and most scratch regs; returns via pop {pc} */'
details: 'Thin dispatcher living in the Library Menu (library/data) code. Loads a pointer from

  off_8124B4C (= off_8124B50) into r0, then uses byte [R5+1] (a state byte inside the

  menu''s R5-tagged object/struct) to index a 3-entry thumb table at off_8124B50. The

  table holds three thumb entry points compiled with the +1 thumb-bit trick:

  sub_8124B5C+1, sub_8124C30+1, sub_8125254+1 (state values 0, 4, 8). Before the

  tail-call it puts the chosen target into r0 (so the callee sees its own entry

  address in r0, matching GUEST_CALL convention) and the state byte into r1. Ends

  with `pop {pc}`, so it does not return normally; caller-supplied lr is used to

  resume the caller''s loop. Callers must therefore keep r5 (and the structure

  behind it) alive and set [R5+1] to 0/4/8 to select a phase. No registers are

  preserved across the dispatch.

  '
