open_questions:
- whether sub_800FE28 indexes the table by the AI difficulty tier or some other global selector; its body
  is unknown
- what AttackBoost2 and TimerOrCycles control later in the attack behavior
- The function returns fixed bytes (2 and 30) from offsets 0 and 4 of byte_80FAEE0, with no difficulty
  tier passed to sub_800FE28 (r0 is just the table address each time, see the two `ldr r0, off_80FAEDC`
  lines). The proposal's tier-indexing claim contradicts this. The fields stored (AttackBoost2, TimerOrCycles)
  match, so the fields are right but the indexing-by-tier rationale is wrong.
