name: object_initType23Sprite
address: '0x0811B35C'
kind: function
status: probable
summary: 'Initializer for an object of type 0x23: loads sprite resource 0x14 from unk_2026A00 via initGuiSprite_8002770,
  sets animation 0 with no shadow and priority 0, claims slot 0x210, writes sub-record field A=2 and sub-entry palette
  bank 0xA with palette 0, then sets coordinates to (0x20, 0x50) and tail-calls sub_811B3B0. Finally stores state
  byte 4 at [r5,#8].'
interface: (r5 = object state struct) -> void; r0/r1 clobbered
details: Writes the object type byte 0x23 to [r5] and state byte 4 to [r5,#8], then initializes the object's sprite
  from resource 0x14 in the table at unk_2026A00 via initGuiSprite_8002770. It sets animation 0, disables the shadow,
  sets sprite priority 0, claims sprite slot 0x210 through slotList_storeHalfwordAndClearField_800306C, sets sub-record
  field A to 2 and sub-entry palette bank to 0xA, and selects palette 0. Finally it sets the sprite coordinates
  to x=0x20, y=0x50 and tail-calls sub_811B3B0 for the remainder of setup. All sprite setters operate on the sprite
  struct implied by r5, so r5 is the per-object control block established by the caller.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0 (#0x23) -> [r5] and (#4) -> [r5,#8] tag the object's type and state fields; initGuiSprite_8002770
    with 0x14 and unk_2026A00 loads sprite resource 0x14 for the object; sequence of sprite_setAnimation/noShadow/setPriority_8002E14/slotList(0x210)/setPalette
    calls fully configures the object's render slot; sprite_setCoordinates(0x20, 0x50) gives a fixed screen position,
    suggesting a GUI/menu or scripted-effect object rather than an entity; callers unknown, so the identity of r5
    and the purpose of trailing sub_811B3B0 rest on callee context alone
  refs:
  - bn6f/asm/asm32.s:27439
  - 0x0800306C slotList_storeHalfwordAndClearField_800306C
  - 0x080026A4 sprite_loadAnimationData
  - 0x08002F90 sprite_noShadow
  reproduce: python3 tools/asmcat.py 0x0811B35C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The proposal
    correctly identifies the type 0x23 init flow and matches the asm lines (strb 0x23 at [r5], initGuiSprite at
    unk_2026A00/0x14, shadow off, priority 0, slot 0x210, palette bank 0xA, setCoordinates 0x20/0x50, tail-call
    sub_811B3B0). However it misstates priority as ''sprite priority 0'' via setPriority_8002E14 (line `bl sprite_setPriority_8002E14`),
    and omits state byte 4 being written AFTER palette/coords rather than at the start. Also, r5 is the per-object
    control block as the proposal notes. The name fits as object_initType23Sprite but the r0/r1 note is inaccurate:
    r0 is the resource/data word, not ''(32,80)'' directly — coordinates are passed after sprite init. Minor inaccuracies
    warrant a revise, not a full disagree.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
