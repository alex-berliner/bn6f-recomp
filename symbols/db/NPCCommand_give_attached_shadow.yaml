name: NPCCommand_give_attached_shadow
address: '0x0809EFB4'
kind: function
status: confirmed
summary: NPC script command that removes the NPC's attached shadow sprite and advances the script.
interface: void npcCmd_detachShadow(OverworldNPCObject* npc (r5), u32* scriptPtr (r6)); sets nz/c/v from scriptPtr+1
details: 'NPC script command handler run with r5 = overworld NPC object and r6 = the NPC''s script

  instruction pointer. It clears bit OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x80 in the NPC''s

  UnkFlags_60 word (oOverworldNPCObject_UnkFlags_60), stopping the object from being marked

  as owning an attached shadow, then calls sprite_noShadow() to make the sprite layer stop

  drawing a shadow for it. Finally it advances the script pointer (r6 += 1) so execution

  continues at the next script command; the ADDS sets nz/c/v which callers observe.

  r0/r1/r3 are left as sprite_noShadow left them and are also listed as outputs, so the

  caller either ignores or consumes whatever that helper returns in them.

  '
