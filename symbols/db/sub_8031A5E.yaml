summary: Initializes an AI sub-state for an enemy/virus battle actor by calling the type-3 init helper with selector
  1
interface: () -> r0 = state word returned by sub_8031980
details: "Tail-calls sub_8031980 with r0=1 and returns its result. The wrapper is a 3-instruction\n  function (push\
  \ {lr}; mov r0,#1; bl sub_8031980; pop {pc}) used to forward selector 1\n  into the battle-AI init helper. sub_8031980\
  \ returns 3 when r0==1, 2 otherwise (per its\n  hypothesis), so this wrapper always returns 3. The contract lists\
  \ only lr as input and\n  r0 as output, matching the \"void-like\" wrapper that simply forwards a constant. The\n\
  \  captured calls all show the function being invoked from 0x08031902 (story2 dispatch\n  context) with pointer\
  \ args in r0/r1/r2 (likely BattleObject + AIDataPtr layouts) and\n  always returning r0=3 with carry set; r0 is\
  \ not the \"answer\" itself but rather the\n  state word the caller stores into AIData+0x80 (AIState) or similar.\
  \ The single callee\n  is the central battle-AI state-init dispatcher that this wrapper just hard-codes to\n \
  \ selector 1 (a specific AI type/strategy among the choices the dispatcher handles).\n  Without a caller list,\
  \ the exact strategy this represents (e.g., \"stand and attack\",\n  \"support\", \"flee\") is unknown; it is\
  \ one of the AI sub-initializers the dispatcher\n  exposes.\n"
