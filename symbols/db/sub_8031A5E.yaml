open_questions:
- What "selector 1 vs otherwise" semantically means (the 3 vs 2 distinction is owned by
- sub_8031980); we only know this wrapper pins the selector to 1.
- Whether there exists a sibling wrapper that hard-codes selector 0 to return 2 — would be
- 'confirmed by finding a literal `mov r0, #0` followed by the same `bl sub_8031980` shape'
- nearby in bn6f/asm.
