name: sub_8031A5E
address: '0x08031A5E'
kind: function
previous_names: []
status: hypothesis
summary: Tail-call wrapper that asks sub_8031980 to look up a state word for selector 1 and forwards the result
  back as its own return value.
interface: '() -> r0 = (3 if selector 1 matches, otherwise 2) ; side effects: same as sub_8031980'
details: "The function body is three instructions. It first pushes lr, loads immediate 1 into r0,\n  then bl sub_8031980.\
  \  Per the callee's contract, sub_8031980 reads the `r0` selector as\n  an index into some EWRAM word, loads that\
  \ word, and returns 3 in r0 when the value is 1\n  and 2 otherwise.  This wrapper hard-codes the selector to 1,\
  \ so callers always get the\n  \"selector == 1\" branch's classification.\n\n  The epilogue is `pop {pc}` rather\
  \ than `pop {lr}` followed by `bx lr`, which means control\n  transfers straight back to this function's caller\
  \ with sub_8031980's r0 in place - so the\n  wrapper is genuinely just a tail call.  The captured-call snapshots\
  \ consistently show\n  r0=0x020058ac/0x02005984/0x02005ce4 pointers into a region that begins with the 0x68 /\
  \ 0x18\n  byte prefix the callee documents, and exits always carry r0=3 (C flag set), matching the\n  \"selector\
  \ 1 matches\" path of sub_8031980.\n\n  Because the only behaviour comes from sub_8031980, the naming only reflects\
  \ the fixed\n  selector; the meaning of \"selector 1 / 3 vs 2\" still belongs to the callee and is not\n  decipherable\
  \ here.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, #1` at the function entry sets the selector argument to 1. - `bl sub_8031980` is the sole
    external call; the callee''s contract documents that it returns 3 for selector 1 and 2 otherwise. - `pop {pc}`
    (instead of `pop {lr}` + `bx lr`) makes this a pure tail call, so r0 and flags fall straight through to the
    caller. - All 40 captured exit snapshots set r0=3 with the C flag set (---- -> --C-), which is what sub_8031980
    produces for the selector-1 branch. - lr on entry (0x08031902) is the documented return address back into the
    wrapping story-2 code, and 40 callers all share that single source, so this is reached from exactly one site
    within the story2 helper.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08031A5E

    '
  result: the body read as described above
