name: spawn_t1_0x5_tempAttackObject_80B8E30
address: '0x080B8E30'
kind: function
status: confirmed
summary: Spawns a type-1 attack object (subtype 5), links it to a related battle object, inherits panel XY and alliance/direction,
  sets header flag 0x14, and stores the result pointer.
interface: "/* r0: caller's original r0 (restored into r1 on failure)\n   r1: x\n   r2: y\n   r3: z\n   r4: params\n\
  \   r5: related BattleObject* (parent)\n   r6: preserved across call\n   r7: result output pointer (BattleObject**)\n\
  \   returns r0: spawned object ptr (0 on failure)\n           r1: 0x14 on success, caller's orig r0 on failure\n\
  \           r2: header flags on success, leftover on failure\n           NZ flag set from r0\n           C/V cleared\
  \ */\nvoid spawn_t1_0x5_tempAttackObject_80B8E30(u32 r0, u32 x, u32 y, u32 z, u32 params,\n                  \
  \                          BattleObject *related, u32 r6_unused,\n                                           \
  \ BattleObject **out);\n"
details: "- Saves lr then pushes r0 plus callee-saved r5-r7 so r5 (related object), r6, r7\n  (result slot) all\
  \ survive a call.\n- Calls the well-known spawner object_spawnType1 with kind index 5; on return\n  r0/r1/r2/r3\
  \ are clobbered and r5 holds the new object pointer.\n- Restores r1 from the saved r0 and re-reads r5 into r0\
  \ for the success branch.\n- On success: writes related pointer to new+oBattleObject_RelatedObject1Ptr,\n  stores\
  \ the result slot pointer at new+oBattleObject_ExtraVars, copies\n  oBattleObject_PanelXY (2 bytes) and oBattleObject_AllianceAndDirectionFlip\n\
  \  (2 bytes) from related into the new object, and ORs 0x14 into\n  oObjectHeader_Flags.\n- Always falls through\
  \ to loc_80B8E54 which writes the spawned pointer\n  (or 0) to *r7 regardless of success.\n- The \"mov r0, r5\"\
  \ uses an ADDS encoding (clears C/V); the final ORRS then\n  only sets N/Z, so C and V end up cleared on either\
  \ path.\n"
