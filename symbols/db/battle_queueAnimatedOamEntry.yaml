name: battle_queueAnimatedOamEntry
address: '0x08126570'
kind: function
status: probable
summary: Queues one sprite OAM entry for an animated overlay element, using an animation-state byte in
  a per-element buffer and advancing its 0xFF-terminated animation table when the frame count expires.
interface: (r0 = tile/attr word (u16), r1 = tile base offset, r2 = offset of u16 frame selector in state
  buffer or 0, r3 = offset of anim-state byte, r4 = u16 OAM table ptr, r6 = position/flags word; r5 =
  state buffer, r7 = animation table) -> r0 = queued; updates state byte at [r5+r3]; flags from callee
details: Reads a u16 at [r5+r2] (or 0 if r2==0), multiplies it by 16 and folds it into the tile word passed
  to battleObject_queueOamFromTableRow (r1=2, row = stateByte&0xF, r3 = table ptr, plus the caller's 0x40000000-style
  flag word). The state byte at [r5+r3] packs low nibble = current table row, high nibble = frame counter;
  when the high nibble equals 1 it calls battleObject_advanceAnimTableBy0xFF on the r7 table and stores
  the next entry back into the byte, otherwise it decrements the high nibble and rewrites (low | (high-1)<<4).
  Wrappers feed it fixed screen rects (e.g. x=90,y=32, 60x12/40x12/30x12) with byte_8124A84/dword_8124A84
  tables and constant flag 0x40000000, so it drives a small fixed-position animated graphic on screen.
