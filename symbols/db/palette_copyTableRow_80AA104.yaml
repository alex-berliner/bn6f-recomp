name: palette_copyTableRow_80AA104
address: '0x080AA104'
kind: function
status: confirmed
summary: Copies one 8-byte palette-row entry (selected by index 0..2) from a fixed ROM table into the work buffer
  byte_20018B0 and returns 0.
interface: int palette_copyTableRow(int row /* r0 = entry index, expected 0..2 */);
details: 'Uses r0*8 to index into the 24-byte table byte_80AA11C, which holds three

  8-byte entries laid out as four BGR555 halfwords (colors plus 0xFFFF

  terminator/padding): row 0 and row 2 are {0x6878, 0x7050, 0xFFFF, 0xFFFF}

  and row 1 is {0x2020, 0x2020, 0xFFFF, 0xFFFF}. It calls CopyBytes with

  (src = table entry, dest = byte_20018B0, count = 8) — i.e. the caller''s

  selected palette row lands in the shared IWRAM scratch buffer at

  0x20018B0, presumably for subsequent palette/hardware upload by the

  caller. Always returns 0; the "mov r0, #0" also clears N/Z, leaving C/V

  as the callee left them. r0 is not bounds-checked: an index above 2 reads

  past the table into whatever follows at 0x080aa134. r4-r7 and lr are only

  pushed/popped for the call, not otherwise used; CopyBytes preserves

  r4-r7.

  '
