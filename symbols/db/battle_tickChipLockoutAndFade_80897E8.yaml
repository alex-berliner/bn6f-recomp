  date: '2026-10-14'
  detail: '- `mov r0, #0x80; bl chatbox_mask_eFlags2009F38` (asm23.s:1078) — gate on the 0x80 flag bit.
    - `bne loc_8089804` branches when the flag bit is set, skipping the body — chatbox_mask sets NZ to
    indicate bits matched. - `bl battle_tickChipLockout_8089CB4` then `beq loc_8089804` — only act when
    the helper reports work done. - `mov r0, #4; mov r1, #0xff; bl SetScreenFade` — standard "fade-out
    to white" parameters in BN6. - `mov r0, #0x24; strb r0, [r5]` — literal write 0x24 into the r5 struct.
    - `mov r0, #1; pop {r4-r7,pc}` — unconditional return 1; callee-saved r4-r7 restored. - Captured entry
    r0=0x080897e9 (return-PC+1 thumb), r1=0x080895c0 (a helper address), r5 carries an IWRAM state pointer.
    - Caller lr=0x080895b8 in every snap; consistent with a battle per-frame tick dispatcher.'
