status: probable
summary: 'Per-frame handler: if eFlags2009F38 bit 0x80 is unset, tick chip lockout via sub_8089CB4 and
  on its non-zero return trigger a screen fade (0x4 / 0xff) and write 0x24 to the r5-pointed state''s
  byte; always returns 1'
interface: '(r5 = battle state pointer) -> r0 = 1 ; side effects: may call SetScreenFade(4, 0xff) and
  store 0x24 to [r5]'
details: "The function reads a global chatbox/cutscene flag word (eFlags2009F38) masked with 0x80 (bit\
  \ 7) via `chatbox_mask_eFlags2009F38`. If that bit is clear (`bne loc_8089804` taken when NZ from the\
  \ mask means \"set\"), execution falls through to `sub_8089CB4` (`battle_tickChipLockout_8089CB4`, contract\
  \ in={r5,lr} out={nz,c,v}). When that helper returns non-zero (`beq loc_8089804` not taken), the routine\
  \ forces a screen fade: `SetScreenFade(4, 0xff)`, then `strb r0, [r5]` with r0 = 0x24. So r5 is treated\
  \ as a state pointer whose byte 0 (or a field at a fixed small offset — the asm writes a literal u8\
  \ into [r5]) is set to 0x24 (interpreted as a \"screen fade requested / chip-lockout consumed\" marker;\
  \ 0x24 = 36).\n  The wrapper unconditionally returns 1 (`mov r0, #1`) so callers can chain or test completion.\
  \ r5 is preserved by the push/pop. The captured-call snapshots show lr=0x080895b8 (caller) and r5 points\
  \ at a struct in IWRAM whose bytes include 0x3def/0x1f6f patterns consistent with battle-state scratch\
  \ — these are the 11 snap_beastsp frames.\n  Naming follows the registered callee name `battle_tickChipLockout_8089CB4`;\
  \ the wrapper adds the screen-fade side effect that the bare callee doesn't perform, hence the combined\
  \ name.\n"
