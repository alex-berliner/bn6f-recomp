name: t3_timerElapsed
address: '0x0803BB94'
kind: function
status: probable
summary: Ticks down a frame-count timer in the state struct at [r5,#0x2c] and returns 1 once it has expired.
interface: () -> r0 = 1 when countdown [r5+0x2c] reached below 0 after decrement, 0 otherwise; no flags
details: 'Decrements the 32-bit field at [r5,#0x2c]; if the decremented value is still >= 0 it stores
  it back and returns 0, otherwise it returns 1 without storing. This is a once-per-call countdown check:
  the caller is expected to prime the field (likely via sub_803BB90, which is called with r0=0x1e = 30
  frames right after this in both call sites) and poll until it returns nonzero. Uses r5 as a context/state
  pointer, matching the surrounding timer/flag helpers in the same address cluster.'
