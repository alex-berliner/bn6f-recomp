- method: assembly-reading
  date: '2026-10-19'
  detail: 'body: ldr r0,[r5,#0x2c]; sub r0,#1; blt -> mov r0,#1 else str back and return 0 (countdown
    semantics); both callers call it immediately after chatbox_mask_eFlags2009F38(8) and skip their setup
    when it returns 0, i.e. it gates a delayed action; after a nonzero return both callers call sub_803BB90(0x1e)
    and set state byte [r5,#1]=0x20, consistent with priming/using the same timer field; 0x1e (=30 frames,
    half a second) passed to the sibling setter matches a frame-count timer'
