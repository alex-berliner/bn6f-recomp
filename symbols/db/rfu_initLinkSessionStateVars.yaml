  result: 'proposed by minimax/MiniMax-M3, self_score 3; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-023329'
open_questions:
- What each of the five EWRAM fields (byte_200FE80, byte_2010160, byte_200FFE4, byte_2010164, word_200FE50)
  specifically represents in the RFU link session struct.
- Why 0x20 is the chosen initial value for byte_2010160 rather than 0 or 1.
