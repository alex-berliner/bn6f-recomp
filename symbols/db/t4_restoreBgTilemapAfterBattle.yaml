  reproduce: python3 tools/asmcat.py 0x0812D8C8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The callees (ZeroFillGFX30025c0, battle_resetEStructRecords_8046664, CopyBackgroundTiles rewriting
    a full 30x20 screen from dword_201E420) all match the proposal. However, the proposal''s mention of
    sub_812D934/sub_812D954/sub_812D91C is wrong: the asm shows only one call to sub_812D934 (with r1=0),
    one to sub_812D954 (with r0=0), and no sub_812D91C call at all. Also r5 is restored from r7 before
    ldrh r0,[r5,#0x2a], confirming r5 is a scene pointer carrying a layer/scroll index. The summary''s
    ''restoring the map view after a battle'' fits, but the helper list is inaccurate.; run wf investigate
    investigate-20261018-235109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
