name: t4_restoreBgTilemapAfterBattle
address: '0x0812D8C8'
kind: function
status: probable
summary: Refills the BG tile buffer, reinitializes the battle-overlay eStruct record array, then redraws
  a full 30x20 screen of tile IDs from the snapshot at dword_201E420 and reapplies the saved layer/scroll
  parameter to the overlay helpers.
interface: () -> void; no return value, r5 (caller's scene pointer) preserved via r7
details: 'Zero-fills the toolkit''s 0x2000-byte BG tile buffer, then re-runs the eStruct record-array
  init (battle_resetEStructRecords_8046664) so battle-overlay scene ticks resume cleanly. CopyBackgroundTiles
  is called with j=0, i=0, tile block 1, source dword_201E420, and 30x20 extents — exactly one full 240x160
  screen of tile IDs, i.e. the entire layer is rewritten from a snapshot. Afterward it calls local helpers:
  sub_812D52E, sub_812D5D0 with the value at [r5+0x2a] (likely a scroll/layer parameter) and args (0,0),
  then (0,3,0) after sub_812D54C, plus sub_812D934(0)/sub_812D954(0)/sub_812D91C which appear to clear
  or re-enable per-layer or effect state. The literal pool also holds byte_812C278, suggesting nearby
  code shares this tile snapshot.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl ZeroFillGFX30025c0 then bl battle_resetEStructRecords_8046664 — clear GFX buffer and reset
    battle scene records first; CopyBackgroundTiles(0,0,1,dword_201E420,0x1e,0x14) — full 30x20 screen
    of tiles restored from saved buffer into block 1; battle_resetEStructRecords_8046664's known summary
    ties it to returning from a battle, matching this restore flow; sub_812D5D0 called twice — once with
    [r5+0x2a] and (0,0), once with (0,3,0) — reconfiguring layer state after the copy
  refs:
  - bn6f/asm/asm34.s:759
