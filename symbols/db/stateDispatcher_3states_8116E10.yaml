name: stateDispatcher_3states_8116E10
address: '0x08116E10'
kind: function
status: confirmed
summary: 'Generic state-machine dispatcher: reads the current state index from the object at R5+8 and tail-calls
  one of three state handlers.'
interface: void stateDispatcher_3states(void); // all registers and flags pass through to the selected handler and
  back to the original caller; r1 = word offset (state*4), r0 = handler address on entry to handler
details: 'Trampoline/tail-call dispatcher. Loads the byte at [R5+8] (an index into a table of word-sized handler
  addresses), then fetches the Thumb handler pointer from the table at off_8116E24 and jumps to it with `mov lr,
  pc; bx r0` immediately followed by `pop {pc}`. Because of the interleaved push/pop, the handler''s return goes
  straight to sub_8116E10''s own caller, so this function is invisible on the call stack. The handler is entered
  with R0 = its own table entry (the loaded target address is left in R0) and R1 = the table offset (state index
  * 4); every other register and the flags pass through untouched, and the handler''s outputs are this function''s
  outputs. Table contents: offset 0 -> sub_8116E30, offset 4 -> sub_8116F34, offset 8 -> sub_8116FD4, so the object
  has exactly three states. R5 must be set up by the caller as a pointer to the owning object/state struct. The
  2 bytes of padding after `pop {pc}` are alignment only.

  '
