name: sub_8127FE4
address: '0x08127FE4'
kind: function
status: hypothesis
summary: Thin wrapper that sets up registers (object pointer fields, table base, count) and forwards an object's
  initialization/dispatch to the large sub_811FA98 helper.
interface: 'void sub_8127FE4(struct Object *obj /* r5 */);

  // inputs:  r5 = object pointer, r4/r6/r7 carried in by caller and not consumed

  // outputs: r5 preserved

  // clobbers: r0,r1,r2,r3,lr; NZCV

  // preserves: r4,r5,r6,r7

  '
details: 'Loads the 16-bit field at obj->0x1E into r2 and obj->0x24 into r3, then hands them

  to sub_811FA98 along with r0 = 0xE10014 (high half 0xE1, low half 0x14) and

  r1 = 0x20002. Sets r4 = 4, r6 = 0x30CA4C (a table/sprite array pointer), and

  r7 = 0x35 (likely an ID or max-count). r5 (the object pointer) is the only thing

  threaded through; r4/r6/r7 are pushed and popped around the call, so callers must

  pre-load them but this routine does not consume them. The pattern matches other

  "prepare args, jump to a mega-dispatcher" wrappers used to build objects on the

  battle field.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
