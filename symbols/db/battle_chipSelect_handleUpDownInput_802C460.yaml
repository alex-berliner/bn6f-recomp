open_questions:
- Which exact struct r5 points to (AIData vs S20364C0 vs something else); the offsets 6/7 are byte-wide
  and signed, which fits both APwrAtk/BPwrAtk and a chip-slot pair.
- Whether the "moving by 0x18" is a stride into a chip table or a panel index — would settle by reading
  sub_802C490.
