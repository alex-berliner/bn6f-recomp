name: battle_chipSelect_handleUpDownInput_802C460
address: '0x0802C460'
kind: function
previous_names:
- sub_802C460
status: probable
summary: handles up/down arrow D-pad input on the chip-select screen, advancing/retreating a cursor row
  and animating the chip icon when it changes column
interface: (r5 = s_20364C0_struct*, r6 = joypad/AI flags, r10 = Toolkit*) -> side effects on s_20364C0_struct
  and chip-select UI state
details: "Reads two signed bytes from s_20364C0_struct+0x6 and +0x7 (APwrAtk row vs B-button row indices,\
  \ \"BLeftAbility\" and friends) as r0/r1.\n    If they are equal, the function returns immediately.\n\
  \    Otherwise computes r4 = |r0 - r1| and picks the larger of the two into r0, then bumps it by 0x18\
  \ (looks like a stride/index into a chip-select row table) before calling sub_802C490 (r5 = 0x12 constant,\
  \ r1 = 2). The callee's return in r2 is tested; if zero, return.\n    If non-zero, r2 = 3, r3 = 0 are\
  \ loaded and a render/animation kicker (call_sub_3005EBA, likely a battle-state enqueue or sprite-loader\
  \ thunk) is called.\n    The constant 0x18 is a chip-slot row stride, 0x12 is the chip count visible\
  \ on screen, and 2 is the cursor \"Up\" or \"Down\" delta — this is the row-jump handler in the chip-select\
  \ UI invoked from battle_initChipSelect_802BD60.\n    Caller sub_802BD60 has the same contract shape\
  \ (r5/r6/r10 in, no r0 return value) which fits a UI tick.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrsb r0, [r5,#6]` / `ldrsb r1, [r5,#7]` map to AIData offset 6/7 (APwrAtk/BPwrAtk indices)
    but more likely S20364C0 fields given the caller''s "chip select" naming; s_20364C0_struct has fields
    at 0x06/0x07 area covering chip-slot bookkeeping (ChipSelectCursorPos at 0x07, surrounding bytes used
    by chip-select). - `cmp r0, r1; beq locret_802C48E` short-circuits when the two row indices match
    — classic "no change, exit" early-out for D-pad nav. - `add r0, #0x18` is a 24-byte row stride typical
    of a chip-row descriptor layout. - `mov r5, #0x12` (18) is the visible chip count, and `mov r1, #2`
    is a ±2 row step consistent with vertical D-pad row jumping. - `bl call_sub_3005EBA` with `mov r2,
    #3; mov r3, #0` is the only post-validation action, indicating an animation/event enqueue when the
    cursor does move. - Only one caller (battle_initChipSelect_802BD60), contract symmetric on r5/r6/r10.'
