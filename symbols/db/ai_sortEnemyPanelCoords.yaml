name: ai_sortEnemyPanelCoords
address: '0x080E5174'
kind: function
status: probable
summary: Collects opposing-side enemies via two object_getEnemyByNameRange calls (IDs 0..0xAE and 0x100..0x1C3);
  if two are found, picks the lower-HP one (RNG-tied) for the third slot, and if fewer are found duplicates
  the first slot, then packs PanelX|(PanelY<<4) into three bytes at r5+0x64..0x66 and bubble-sorts them
  ascending via sub_80E5208.
interface: (r0 = owner battle object, passed in r5 by caller) -> no return; writes 3 packed panel-coord
  bytes to [r5+0x64..0x66], clobbers r4/r6/r7
details: Builds a 4-pointer array on stack via two object_getEnemyByNameRange calls with the owner's alliance
  XOR 1 (opposing side) and ID ranges 0..0xAE and 0x100..0x1C3, appending the second batch after the first's
  returned count. With exactly two hits it compares oBattleObject_HP and keeps the weaker one, using GetPositiveSignedRNG
  bit 2 to break ties; with fewer it copies the first hit into the empty slots. It then packs each of
  the first three slots' oBattleObject_PanelX | PanelY<<4 into one byte at r5+0x64 and runs a 3-element
  ascending pairwise sort through sub_80E5208. Behavior when zero enemies are found looks unsafe (uninitialized/NULL
  slots would be dereferenced), so callers presumably guarantee at least one opposing enemy.
