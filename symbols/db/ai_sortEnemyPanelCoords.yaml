    ldr r0,[r7,r0]' selects lower-HP enemy on tie; loop 'ldrb [r2,#oBattleObject_PanelX] / PanelY<<4 /
    orr / strb [r4,r3]' writes 3 bytes at r5+0x64; nested loop calling sub_80E5208 on adjacent bytes is
    a 3-element ascending sort of those packed coords; caller sub_80E50E4 runs on the recorded beastsp
    route and supplies r5 as the acting battle object
