name: ai_sortEnemyPanelCoords
address: '0x080E5174'
kind: function
status: confirmed
summary: Gathers up to three enemy battle objects on the opposing alliance, packs their panel (X,Y) coordinates
  into the caller's battle-object byte array at offset 0x64, and sorts the three entries ascending using an alliance-aware
  comparator.
interface: ai_sortEnemyPanelCoords(r5=battleObj*) -> r5 preserved; clobbers r0-r3, flags; preserves r4,r6,r7
details: Computes allianceFlip = LD8(battleObj->Alliance) ^ 1, then calls object_getEnemyByNameRange twice to collect
  pointers to enemies whose name IDs fall in [0,0xAE) and [0x100,0x1C3) respectively, writing them into a 3-slot
  stack buffer. If exactly 2 enemies are found the third slot is filled with the higher-HP one (ties broken by GetPositiveSignedRNG
  masked with 4 selecting buf[0] or buf[1]); if fewer than 2 are found the single entry is duplicated into all three
  slots. Each enemy's oBattleObject_PanelX and oBattleObject_PanelY are combined into a packed byte (Y<<4 | X) stored
  at battleObj+0x64 through 0x66. A simple nested selection/bubble sort (outer loop 2..1, inner loop of length outer)
  reorders the three bytes ascending via battle_orderPairByAllianceFlip, which accounts for whether the panel is
  on the player's or enemy's half of the 3x3 grid. Stack frame is 0x10 bytes; callee-saved regs r4,r6,r7 are pushed/popped
  so callers see no clobbering.
