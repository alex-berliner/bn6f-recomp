name: battle_runCurActionHandler
address: '0x080B9822'
kind: function
status: probable
summary: Dispatches a battle object's per-action state handler via a jump table indexed by its CurAction
  field.
interface: (r5 = battle object, field oBattleObject_CurAction used) -> calls one of five handlers at off_80B9834[CurAction]
  via mov lr,pc/bx r1; returns to caller after handler returns
details: 'Reads the object''s CurAction byte from the battle object struct at r5, indexes the table off_80B9834
  (5 entries, Thumb addresses +1), and jumps to the selected handler with lr set so control returns through
  pop {pc}. It is a state-machine dispatcher: each action value maps to one routine (sub_80B9848, sub_80B989C,
  sub_80B98C4, sub_80B98EC, sub_80B9970), none of which are documented here. Only action values 0-4 are
  valid; there is no bounds check, so a larger CurAction would jump through garbage. The r5 base suggests
  it is called with the current battle object kept in a register by the caller loop.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction] selects the table index from the object's current action;
    off_80B9834 holds five Thumb handler pointers (+1), the classic switch dispatch pattern; mov lr,pc;
    bx r1 makes the selected handler return into pop {pc}, i.e. a tail-call dispatch back to this routine's
    caller
  refs:
  - bn6f/asm/asm31.s:3061
  reproduce: python3 tools/asmcat.py 0x080B9822
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111; the run''s proposed name battle_dispatchCurActionHandler
    was contested; tools/investigate_land.py dedupe gave this distinct name (hyper/glm-5.3-flash proposed,
    minimax/MiniMax-M3 agreed)'
open_questions:
- No callers are known, so the object type behind r5 and when this runs in the battle loop are unconfirmed
- The five handlers (sub_80B9848 etc.) are undocumented, so what the five action states do is unknown
- Confirming would need a caller showing r5 = a battle object being stepped each frame, or documented
  summaries of the handlers
