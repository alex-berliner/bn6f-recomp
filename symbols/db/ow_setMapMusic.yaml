name: ow_setMapMusic
address: '0x08036E86'
kind: function
status: probable
summary: Sets the current map/overworld music track id in the S2001c04 state struct.
interface: (r0 = music track id byte) -> void; flags clobbered by pop context only
details: Loads the S2001c04 pointer from the toolkit's oToolkit_S2001c04_Ptr field (r10-relative) and
  stores the byte r0 into oS2001c04_MapMusic, the field the overworld music engine reads to pick the map
  BGM. No validation or side effects; it just updates the pending map music id. Called by soulWeapons_apply_8142510
  to set the music when applying Beast Out / Soul Unleash overworld state.
