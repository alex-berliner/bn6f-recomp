name: map_onMapWarpCutscene_80059B4
address: '0x080059B4'
kind: function
status: confirmed
summary: Handler for warping on a map — resets two event flags and starts the "on-map warp" cutscene that makes
  the warp interactable.
interface: void map_onMapWarpCutscene(GameState* self /* in r5 */)
details: 'Called with the GameState in r5 (unused directly here). First clears event flag 0x1703 (ClearEventFlagFromImmediate
  with the id split bank:high, index:low), then sets event flag 0x1738, then calls StartCutscene(CutsceneScriptOnMapWarp_8098a02,
  0) to run the cutscene script for warping on a map with parameter 0. The cutscene call is essential: with it disabled,
  map warps (e.g. the one in Lan''s HP) stop reacting to interaction, though they still animate. The effect appears
  tied to HomePages — the same disable does not reproduce in RoboDogComp — and may be the warp''s "interactable"
  state being granted by the cutscene session rather than by the flag changes.

  '
