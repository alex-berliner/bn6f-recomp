name: camera_SavePosition_803011A
address: '0x0803011A'
kind: function
status: confirmed
summary: Copies the camera's current x/y position into its saved-position fields (Unk_04->Unk_08, Unk_06->Unk_0a).
interface: void camera_SavePosition(Camera* cam /* r5 */) /* returns r1 = saved y; lr = return */
details: 'Takes a camera object pointer in r5 (fields addressed via oCamera_Unk_* offsets). Reads the halfword at
  Unk_04 (current x) and stores it to Unk_08, then reads the halfword at Unk_06 (current y) and stores it to Unk_0a,
  leaving the "saved position" pair in sync with the live position. No flags are used or set; r5 and lr are the
  only registers touched. r1 ends up holding the y value that was just copied (a side effect of the last load, not
  an intended result). 4 instructions, tail-calls back via mov pc, lr. Likely called before camera movement/shake/scroll
  so something can compare against or restore the prior camera position later.

  '
