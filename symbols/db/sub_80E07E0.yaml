name: sub_80E07E0
address: '0x080E07E0'
kind: function
status: confirmed
summary: Spawns a type-3 child BattleObject inheriting the caller's panel coordinates, element, alliance/direction,
  and extra fields from a parent BattleObject passed in r5.
interface: '// r0-r3 = panelX, panelY, element (byte each) for the new object

  // r4,r5 = parent object pointer / scratch (r5 is the parent; r4 preserved)

  // r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler value to copy

  // r7 = oBattleObject_Unk_30 value to copy

  // returns: r0 = spawned object pointer (or 0 if spawn failed)

  // clobbers: r0,r1,r2,r3, NZCV

  '
details: 'Saves r0..r2 and r5 on the stack, then calls object_spawnType4 with

  r0=3 to allocate a new type-3 BattleObject. The original places r0=r5

  right after the call (i.e. before popping), then unpacks the saved

  registers back into r1..r3,r5 so the parent''s panelX/panelY/element and

  its oBattleObject_AllianceAndDirectionFlip word are propagated to the

  freshly spawned child. R6 and R7 are copied verbatim into the child''s

  oBattleObject_DamageAndStaminaDamageCounterDisabler and oBattleObject_Unk_30

  fields. If the spawn fails (r0==0), the body is skipped and 0 is returned.


  Note: the stack-slot shuffling means that the post-pop r3 holds what was

  saved_r2 (element), so the C semantics for elements rely on this reordering;

  the readable C above has been verified against the original binary.


  The literal pool at off_80E0804 (starting at word 0x514) and the trailing

  byte_80E083F data sit immediately after the function and are referenced by

  adjacent code, not by this routine.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
