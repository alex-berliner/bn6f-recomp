name: object_destroyClearRelatedAlways
address: '0x080CBB64'
kind: function
status: probable
summary: Battle-object destructor that nulls its related object's header (killing it) before destroying
  itself.
interface: (r0 = battle object) -> r0 = object_genericDestroy result; destroys the object.
details: Destructor for a battle object that has a linked object stored at oBattleObject_RelatedObject1Ptr.
  If that pointer is non-null, it writes 0 into the related object's oBattleObject_ObjectHeader field,
  which marks that object inactive/destroyed. It then falls through to object_genericDestroy to release
  its own panel tile reserves, collision data, and memory. This is the pattern of a paired-object relationship,
  e.g. an effect or child object tied to a parent, so both die together.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r3,[r5,#oBattleObject_RelatedObject1Ptr] / cmp #0 — only acts when a related object exists;
    str r0(=0),[r3,#oBattleObject_ObjectHeader] — zeroes the related object''s header, the usual kill
    marker; tail-call to object_genericDestroy, the documented generic battle-object destructor; no other
    logic: 9 instructions, purely a destructor wrapper with the related-object clear added'
  refs:
  - bn6f/asm/asm31.s:43329
  - 0x08016C8A object_genericDestroy
  reproduce: python3 tools/asmcat.py 0x080CBB64
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108; the run''s proposed name object_destroyClearingRelated
    was contested; tools/investigate_land.py dedupe gave this distinct name (hyper/glm-5.3-flash proposed,
    minimax/MiniMax-M3 agreed)'
open_questions:
- No callers known, so which object type uses this destructor (and what RelatedObject1 points to — parent,
  child, or owner) is unconfirmed
- Whether writing 0 to ObjectHeader fully despawns the related object or only clears its header/type field
