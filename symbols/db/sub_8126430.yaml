name: sub_8126430
address: '0x08126430'
kind: function
status: hypothesis
summary: Loads one row of 7 chip slots from a chip-id table into a chip-data block, copying the chip's data record
  (0x80 bytes from offset 0x20) per slot and zeroing 8-byte output pairs for empty or flagged slots; this is part
  of a chip-select / folder rendering pipeline.
interface: void sub_8126430(u32 r0_slot_scale, u32 r1_chip_id_table, u32 r2_out8, u32 r3_src_for_initial_copy, u32
  r4_chip_data_dest); returns r4 preserved; clobbers r0,r1,r2,r7,lr,NZCV; preserves r3,r4,r5,r6,r7.
details: 'Stage 1: CopyWords from r3 into r2 for 0x38 bytes (an initial 14-word record header prepended to the per-slot
  data).

  Stage 2: Iterate 7 times. Each iteration walks a 4-byte chip-id entry at r1 + (r0<<2) + 4*idx:

  - low u16 chip_id, high u8 unused, low u8 flag at offset+2

  - If chip_id == 0 or flag != 0: write {0,0} to the 8-byte slot at r2 + 8*idx (zero the result pair).

  - Else: getChip8021DA8(chip_id)->field_0x20, then CopyWords 0x80 bytes into r4 + 0x80*idx.

  r5/r6/r7 are loop-local in the assembly (r5=table walker, r6=chip-data dest walker, r7=idx 0..6).

  r0 is used as a left-shift-2 base offset into the chip-id table (likely row/column scale).

  '
