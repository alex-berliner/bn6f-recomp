name: submenu_runPromptFrameUpdate
address: '0x08137964'
kind: function
status: probable
summary: 'Per-frame update for a menu/prompt state machine: dispatches a handler chosen by the state byte
  in the r5 context, then ticks battle entities and sprites, always returning 0.'
interface: (r5 = context struct; state id = byte [r5,#2]) -> r0 = 0; updates entity records and sprites
  each frame
details: Reads a state byte at [r5,#2] and indexes the 3-entry table at off_8137984, calling the selected
  Thumb handler with lr=pc (state 0 -> sub_8137990, state 1 -> submenu_handleConfirmCancelCursorInput,
  state 2 -> sub_8137A1C). It then calls entity_runAllUpdateHandlers_80465BC to run the 15-entity record
  array update handlers, battle_updateEStructSprites_80465F8 to redraw those entities' sprites, and finally
  sub_81380E0. It unconditionally returns 0 in r0, so the return value likely isn't a status. The presence
  of the confirm/cancel cursor-input handler as state 1 strongly suggests this is a yes/no-style submenu
  prompt whose other states handle init/teardown. The context struct's layout beyond the state byte at
  offset 2 is unknown, and no caller is known to identify which screen owns it.
