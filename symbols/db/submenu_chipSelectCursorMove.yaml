name: submenu_chipSelectCursorMove
address: '0x0803AFC2'
kind: function
status: probable
summary: Moves the chip-select/folder grid cursor in response to the D-pad and returns which button (B/A/Start/L/R)
  was pressed for the caller's state dispatcher.
interface: '(r0 = cursor-table index (0..1, callers pass 0); r5 = menu-state object: cursor slot at +8,
  previous slot at +9; joypad via toolkit at r10) -> r0 = 0 if no action, else 1=B, 2=A, 3=Start, 4=L,
  5=R; flags clobbered'
details: Saves the current cursor slot (byte r5+8) into the previous-slot field (r5+9), then reads the
  joypad. L/R/A/B and held Start map to action codes 1-5 which the caller (sub_8049808) uses to tail-dispatch
  into a 5-entry handler table; if a D-pad key was pressed, it picks a direction index (Up=0, Down=1,
  Left=2, Right=3) and loads the new slot from a per-slot 4-byte neighbor table at byte_803B05C, selected
  via off_803B054[r0] with r6=r0*4. Slot values run 0x00-0x40, with 0x37,0x37 as no-move edges and 0x3D-0x40
  as wrap/special targets, matching the chip-select screen's grid plus its special slots. If the slot
  changed it plays SOUND_MENU_CUR_MOVE, then returns the action code.
