name: ai_spawnPatternObjects
address: '0x080EC97C'
kind: function
status: probable
summary: AI attack step that plays a startup animation/sound, then on a countdown spawns a difficulty-dependent
  pattern of type-0x33 attack objects on the panels in front of the user.
interface: (r7 = working AI attack vars (oAIAttackVars), r5 = owner battle object) -> void; runs over
  multiple frames, sets HitElement=4 when the timer expires
details: Per-frame AI attack handler. On the first call (AttackElement==0) it starts animation 0xC, plays
  SFX 0xD8, sets ObjectFlags1 bit 22, sets StepTimer=15 and AttackElement=4. Each frame decrements StepTimer;
  when it hits 0xD it looks up an offset-list index from dword_80ECA08 using AiDifficultyTier (values
  1,2,4 — higher tiers pick bigger patterns), gets the front-direction (+1/-1), and walks a table of signed
  (dx,dy) byte pairs terminated by 0x7F, spawning object type 0x33 at panelX + dir*dx, panelY + dy with
  power = Damage + AttackBoost and element from InitFlag. When StepTimer reaches 0 it resets it to 5 and
  sets HitElement=4, presumably ending the attack and enabling the hit check.
