name: HandleCoordinateInteractionCutscene
address: '0x08034EF0'
kind: function
status: confirmed
summary: Starts the "object interaction" cutscene (TalkObject script) for the coordinate interaction tile the player
  is currently standing on, if applicable.
interface: "void HandleCoordinateInteractionCutscene(u32 toolkit /* r10 */);\n    // outputs: r2 unchanged; clobbers\
  \ r0/r1/r3, lr, nzcv\n"
details: "Reads GameState via toolkit->GameStatePtr. Field oGameState_CoordInteractionValue is the\ncurrent tile's\
  \ interaction tag. 0 means no interaction. Tag layout:\n  - 0x60-0x6F on Graveyard 2 (map group GROUP_GRAVEYARD_IMMORTAL_AREA\
  \ / map MAP_GRAVEYARD2)\n    are sixteen extra slots mapped onto internet table slots 0x10-0x1F\n    (table off_8034728,\
  \ internet-indexed: groupIndex = mapGroup - INTERNET_MAP_GROUP_START).\n  - 0xF0-0xFF are the sixteen ordinary\
  \ per-map slots on every other map. Each is guarded by a\n    one-shot flag at EVENT_16C0+slot (0x16C0..0x16CF);\
  \ if TestEventFlag says set, the interaction\n    has already fired and the function returns. Slot index = tag\
  \ - 0xF0.\nTwo index tables:\n  - off_803461C: per-group tables of per-map 16-byte text-index tables for ordinary\
  \ map groups.\n  - off_8034728: same layout, used both for Graveyard 2's extra slots and for any map group\n \
  \   >= INTERNET_MAP_GROUP_START (groupIndex = group - INTERNET_MAP_GROUP_START).\nThe final byte lookup is groupTables[groupIndex][mapNumber][slot].\
  \ 0xFF means \"no entry\";\notherwise that byte is the param for StartCutscene(CutsceneScriptObjectInteract_8098358,\
  \ param).\nGuarded up-front by IsNotSlipRunningAndNotInCutscene: bail if the player is slipping or already\nin\
  \ a cutscene. Touches oToolkit_GameStatePtr, oGameState_CoordInteractionValue,\noGameState_MapGroup, oGameState_MapNumber.\n"
