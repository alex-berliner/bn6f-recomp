name: battle_randTierFromParam1Table_81167D2
address: '0x081167D2'
kind: function
status: confirmed
summary: Rolls a random 0-15 value, combines it with a battle object's Param1 to index a 4x16 tier table
  (values 0-4), used to pick a randomized effect strength for that object.
interface: int battle_randTierFromParam1Table_81167D2(BattleObject* object /*r5*/); // returns tier value
  in r0; r7 is passed through from the RNG callees to the caller
details: 'Takes a battle object pointer in r5. First calls battle_conditionalRngRoll(object);

  if it returns 4, that value is returned unchanged (the table is never consulted) — 4

  evidently means "no roll / no effect" in this context. Otherwise it calls

  GetPositiveSignedRNG, takes the low 4 bits (0-15) as the column, shifts the object''s

  oBattleObject_Param1 left by 4 as the row offset, and reads byte_81167F4[row*16 + col].

  The table has 4 rows of 16 bytes: row 0 is all 0; row 1 is 0x1 x8 then 0x0 x8; row 2 is

  0x2 x8, 0x1 x4, 0x0 x4; row 3 is 0x3 x8, 0x2 x4, 0x1 x3, 0x0. So higher Param1 gives a

  higher base tier, and the random roll decides how much the tier decays from that base

  (a "strength fades over the roll" shape rather than a plain d16). Values are 0-4, which

  looks like a tier/level selector (e.g. attack power step, panel-break tier, or similar

  graded effect) consumed by the caller. r7 is not used by this routine itself but both

  callees leave a value in it, and the caller apparently expects it passed through.

  Preserves r4, r6; clobbers r1-r3, lr and flags.

  '
