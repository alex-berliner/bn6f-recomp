name: ai_attackCommitStepMove
address: '0x080F34EC'
kind: function
status: probable
summary: 'AI attack state: when the step timer expires, commits the pending panel move (anim 3) and arms
  a hit element'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets r0=HitElement=0xC on commit, otherwise
  only decrements StepTimer
details: Decrets oAIAttackVars_StepTimer and returns until it reaches 0. On expiry it switches the object
  to animation 3, copies FuturePanelX/FuturePanelY into PanelX/PanelY, releases the object's reserved
  panel, recomputes its pixel coordinates from the new panels, and refreshes collision panels/facing.
  It then reloads the timer with 5 (presumably for the next step of the same attack) and stores 0xC into
  oAIAttackVars_HitElement, so the move's damaging/hit step is now pending. Part of the per-tick AI attack
  driver executed during battlesweep.
