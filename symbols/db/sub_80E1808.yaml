name: sub_80E1808
address: '0x080E1808'
kind: function
status: confirmed
summary: Dispatches a battle object's current action (CurAction) through a 5-handler table (dim screen, two generic
  object routines, the dim-battle handler, undim screen), tail-calling the chosen handler with the caller's live
  register file intact.
interface: "void battleObject_dispatchAction_80E1808(u32 r2, u32 r3, u32 r4, void* r5_obj,\n    u32 r6, u32 r7,\
  \ u32 r10);\n// r0 passed in = r5_obj->CurAction, r1 = handler addr from table\n// returns in r5/r8-r12; clobbers\
  \ nzcv, r0-r4, r6-r7, lr\n"
details: "r5 is treated as a \"battle object\" struct; its byte at offset oBattleObject_CurAction is read\nas an\
  \ index into a 5-entry dispatch table at 0x080E181C:\n  [0] object_dimScreen\n  [1] sub_800BDB2        (generic\
  \ object routine #1)\n  [2] sub_800BA8A        (generic object routine #2)\n  [3] sub_80E1830        (custom /\
  \ dim-battle handler)\n  [4] object_undimScreen\nThe selected handler is invoked via `bx r1` with the guest register\
  \ file left untouched by the\ndispatcher (r0 still = CurAction, r1 still = handler address, r2-r7/r10 passed through),\
  \ and\nthe handler's results in r5 and r8-r12 flow straight back to the caller's caller, making this\neffectively\
  \ a tail call through an action table. The two +1 offsets on each table entry are\nthe standard Thumb interworking\
  \ marker (BX to odd address = Thumb).\n"
