name: chatbox_showCantJackInMsg
address: '0x0813367C'
kind: function
status: probable
summary: Runs one of three canned text scripts from eTextScript2028A20 and plays the 'can't jack in' error
  sound, i.e. shows a connection-denied message.
interface: (r0 = selector, 4..6) -> r0 = chatbox_runScript result; plays sound SOUND_CANT_JACK_IN
details: Subtracts 4 from r0 and uses it as a byte offset into the word table at byte_8133694, whose entries
  are script IDs 1, 14, 15; the fetched word is passed to chatbox_runScript_803FD9C_on_eTextScript2028A20
  to display the message, then PlaySoundEffect is called with SOUND_CANT_JACK_IN. So the caller's small
  integer (4/5/6) picks which of three related denial texts is shown, always accompanied by the same error
  sound. The table lives directly after the function, confirming the lookup is intentional and bounded
  to three entries.
