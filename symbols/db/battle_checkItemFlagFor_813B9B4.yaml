summary: Reads one byte from the toolkit's 0x200414c array at offset (r0 + r1*7) and returns its value/zero-flag
  through r0.
interface: '(r0 = item index, r1 = some other index/argument, r10 = toolkit ptr) -> r0 = byte at that
  offset ; side effects: none (pure load via tail-return)'
details: "- `mov r3, r10` then `ldr r3, [r3,#oToolkit_Unk200414c_Ptr]` (offset 0x58) loads the\n    pointer\
  \ to whatever array/structure is anchored at EWRAM 0x200414c.\n  - `mov r2,#7; mul r1,r2` multiplies\
  \ r1 by 7 (a stride of 7 bytes per r1-unit).\n  - `add r0,r0,r1` adds the r0 term to that scaled r1;\
  \ together this addresses\n    `(r0 + 7*r1)` within the pointed array.\n  - `ldrb r0,[r3,r0]` returns\
  \ the byte there in r0.\n  - `tst r0,r0` then `mov pc,lr` tail-returns, leaving r0 holding that byte\
  \ and\n    the Z flag set iff it was zero.\n  - Naming reflects the indexed probe into the toolkit's\
  \ 0x200414c array; the\n    callers (per-item-type tallies, ID categorisation, ally/entry scans) all\n\
  \    treat the byte as a boolean flag (\"has/is\"), so this is a small lookup,\n    not a full struct\
  \ read. The 0x7 stride hints each r1-bucket holds 7\n    contiguous items (or 7 categories), with r0\
  \ selecting within the bucket.\n"
