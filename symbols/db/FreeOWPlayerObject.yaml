name: FreeOWPlayerObject
address: '0x08003B86'
kind: function
status: confirmed
summary: Releases an overworld player object, clearing its slot in the active-player bitmask and resetting its sprite.
interface: void FreeOWPlayerObject(ObjectHeader* obj /* r5 */)
details: 'Takes the player object header in r5. Reads the object''s list index (oObjectHeader_ListIndex, offset
  3) and computes the mask bit 0x80000000 >> listIndex, then clears that bit in the shared u32 bitmask at eActiveOWPlayerObjectBitfield
  (read-modify-write: ldr/bic/str). This marks the player slot as no longer in use. It then zeroes the object''s
  flags byte (oObjectHeader_Flags, offset 0) and calls sprite_makeUnscalable on the object before returning. Tail
  behavior: r0-r3 and flags at return match whatever sprite_makeUnscalable leaves; r5 is preserved. Note that if
  the list index were >= 32, the LSR-by-register shift would yield 0 (ARM semantics), clearing nothing.

  '
