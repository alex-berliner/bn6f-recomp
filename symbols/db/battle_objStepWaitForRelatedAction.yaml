name: battle_objStepWaitForRelatedAction
address: '0x080DAF2A'
kind: function
status: probable
summary: 'Per-frame step for a battle object: if the battle is over or the related object''s CurAction
  doesn''t match Param4 (0xff = any), call sub_80DB0D0 and set CurState=DESTROY; otherwise render the
  blind effect and dispatch through a table indexed by this object''s own CurAction, unless a time-stop
  is active and Param1 is zero.'
interface: (r5 = battle object) -> r0 = clobbered; sets oBattleObject_CurState = CUR_STATE_DESTROY when
  battle is over or action mismatch
details: Acts as a per-frame update for a battle object (r5 = this). If the battle is over it calls sub_80DB0D0
  (cleanup) and sets CurState to CUR_STATE_DESTROY. Otherwise it renders the blind effect via handleRenderBlindForSpecificObjectsMaybe_80169BE,
  loads the related object (oBattleObject_RelatedObject1Ptr) and reads its oBattleObject_CurAction; if
  Param4 is 0xff the check passes for any action, otherwise it requires equality. When Param1 is nonzero
  it skips the time-stop check; if Param1 is zero it returns early while battle_isTimeStop is active.
  Finally it jumps through a two-entry table (off_80DAF6C) indexed by the related object's CurAction (entries
  sub_80DAF74 and sub_80DAF98), using the mov lr,pc/bx long-blip pattern.
