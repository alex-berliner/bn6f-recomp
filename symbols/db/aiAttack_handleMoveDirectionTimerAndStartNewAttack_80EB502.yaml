open_questions:
- The exact meaning of AIAttackVars Unk_01 = 4 (state sentinel) and Unk_12 (initial duration) - inferred
  from the one-shot latch pattern, not named elsewhere.
- The captured r0 = 4 in every call may be an enum/state value passed through; the function itself never
  uses r0 before writing it back as 0 on the exit paths, so r0 is treated as scratch.
- Which AI-attack script index uses this routine - the only known caller is sub_80EB442 (the dispatcher)
  which we don't have full assembly for.
