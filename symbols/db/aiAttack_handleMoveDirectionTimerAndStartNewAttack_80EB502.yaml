name: aiAttack_handleMoveDirectionTimerAndStartNewAttack_80EB502
address: '0x080EB502'
kind: function
previous_names:
- sub_80EB502
status: probable
summary: AI tick that counts down a "wait for direction input" timer, then on expiry/exit kicks off a
  new attack via aiAttack_initVarsAndStart_80116AE using the held D-pad direction and the equipped cross
  navi.
interface: '(r5 = BattleObject, r6 = ?, r7 = AIAttackVars, r10 = Toolkit) -> void ; side effects: writes
  to AIAttackVars (Unk_01, Unk_10, Unk_12), clears BattleObject.RelatedObject1Ptr and AIData.Unk_68, calls
  object_exitAttackState, and may dispatch aiAttack_initVarsAndStart_80116AE'
details: "1. On entry, reads AIAttackVars byte 0x01 (Unk_01). If it is zero, copies the halfword at offset\
  \ 0x12 into offset 0x10 (a duration latch) and sets Unk_01 = 4 (mark as \"armed/ticking\"). This is\
  \ the first-frame init for this state.\n  2. Decrements the halfword at AIAttackVars+0x10 by 1. If it\
  \ underflows (<0, BGE not taken), this state is done: clears BattleObject.RelatedObject1Ptr (r5+0x4C)\
  \ and AIData.Unk_68 (r5->AIDataPtr + 0x68), calls object_exitAttackState to terminate, and returns.\n\
  \  3. Otherwise the object must still be free: object_canMove must return non-zero AND playerObject_checkDirectionButtons_800FA54\
  \ must return a non-zero direction (saved in r6). If either check fails, the function returns without\
  \ changing state (the timer keeps ticking next frame).\n  4. battleObject_tryGetNextPanelInFacingDirection_800F964\
  \ must also succeed (return non-zero). If the panel in the held direction is not available, return (timer\
  \ continues).\n  5. On all conditions met: clears RelatedObject1Ptr and AIData.Unk_68, calls object_exitAttackState\
  \ (same as the timeout path), then queries battle_getCrossNaviTableByte_8010332 (in r4) and battle_GetAllianceFactionFromBattleObject_80103A8\
  \ (in r2), and finally calls aiAttack_initVarsAndStart_80116AE(r6=heldDirection, r4=crossNaviByte, r2=faction)\
  \ to launch the actual attack.\n  The duplicate \"exitAttackState then launch\" pattern around offset\
  \ 0x80EB528/0x80EB546 plus the use of r4/r2 being passed to aiAttack_initVarsAndStart_80116AE makes\
  \ this clearly the \"wait for player D-pad, then start the chosen chip/PwrAtk\" bridge state for AI-attack\
  \ style scripts.\n"
