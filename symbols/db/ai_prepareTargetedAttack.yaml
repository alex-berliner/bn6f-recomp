name: ai_prepareTargetedAttack
address: '0x08112340'
kind: function
status: confirmed
summary: 'Executes one AI battle turn: picks a target panel, computes attack geometry and panel parameters, attaches
  attack code 0x0C, and finalises the targeted attack.'
interface: 'void ai_prepareTargetedAttack(AIData *ai_data, BattleObject *obj, AIState *state, AIAttackVars *vars);

  /* In:  r4=ai_data, r5=obj, r6=state, r7=vars, plus pass-through r1, r8–r12 */

  /* Out: r1, r5 (possibly remapped by pickTargetObjectFromRow), r8–r12 */

  '
details: 'Decrements the u8 TurnCounter in AIState; if it underflows below zero the script

  ID is cleared to 0 and the function returns early (AI turn skipped).

  Calls ai_pickTargetObjectFromRow(r5) which returns target panel X/Y in r0/r1 and

  may remap r5/r6/r7. If r0==0 (no target) the script ID is zeroed via the returned

  r6 pointer and control exits.

  On success the chosen panel coordinates are stored into AIAttackVars_TargetPanelX/Y.

  Computes a directional-alliance value (BattleObject_Alliance XOR

  BattleObject_DirectionFlip), saves the source panel X/Y into the object''s

  ExtraVars[0] and ExtraVars[4], and calls sub_800E994 with (targetX, targetY,

  sourceX, sourceY, allianceDir) to derive a geometry/offset encoding stored in

  ExtraVars[8].

  Sets AiDifficultyTier to 1 (tier-one AI attack). Indexes a per-version attack

  table (AIState_Unk_0c as base, offset = AIData_Version_16 << 2) and stores the

  result in AIAttackVars_ScratchVar.

  Calls GetAllianceDependentPanelParamArgs with the static byte array at

  0x81125E0 and the battle object to fill AiAttackParam and PanelParamFlags2.

  Attaches attack object 0x0C via object_setAttack0 (a specific chip/attack code).

  Finishes by calling sub_8109804 (final attack setup / script dispatch) which

  produces the outgoing r1, r5, r8–r12 register state consumed by the caller.

  '
