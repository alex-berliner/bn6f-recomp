name: ai_prepareTargetedAttack
address: '0x08112340'
kind: function
status: probable
summary: 'AI attack-script step: decrements a turn counter and, while it is still positive, selects a
  target panel, records direction/panel params, and starts attack state 0xC; when the counter runs out
  it resets the script id.'
interface: (r5 = battle object, r6 = AI state block, r7 = AI attack-vars block) -> r0 = 1 after setup
  or via callees; also writes script id (oAIState_ScriptId) and many oAIAttackVars_* fields
details: It pre-decrements oAIState_TurnCounter; if the result is negative (counter was 0) it clears oAIState_ScriptId
  and returns without acting. Otherwise it calls sub_811252C to obtain a target panel; if that returns
  0 it also aborts the same way. On success it stores the target x/y into oAIAttackVars_TargetPanelX/Y,
  XORs oBattleObject_Alliance with oBattleObject_DirectionFlip to select a parameter-table side, saves
  the object's own panel x/y into oBattleObject_ExtraVars/ExtraVars+4, classifies the delta to the target
  via sub_800E994 into ExtraVars+8, sets oAIAttackVars_AiDifficultyTier to 1, loads a version-dependent
  word (oAIData_Version_16 << 2 indexed off oAIState_Unk_0c) into oAIAttackVars_ScratchVar, fetches an
  alliance-dependent panel param entry with GetAllianceDependentPanelParamArgs (byte_81125E0 table) storing
  param/flags into oAIAttackVars_AiAttackParam and oAIAttackVars_PanelParamFlags2, sets attack 0xC via
  object_setAttack0, and tail-dispatches the attack handler sub_8109804.
