name: clearRenderFlags
address: '0x0804C42C'
kind: function
status: probable
summary: Clears bits 0x4800 in the halfword at offset 0 of the toolkit RenderInfo pointer and writes it
  back, with no other observable side effects.
interface: () -> nothing; writes back to [toolkit->renderInfoPtr]
details: Reads the toolkit from r10, dereferences its RenderInfo pointer (offset 0), loads the 16-bit
  flag word at offset 0, clears every bit matching 0x4800 with BIC, and stores the halfword back. It takes
  no arguments and returns nothing; the only effect is that flag update. The constant 0x4800 looks like
  a pair of enable bits (e.g. an OBJ-related enable and a mode/blank bit) in whatever display-state mirror
  RenderInfo keeps at offset 0, so this is a small 'hide/disable rendering' helper. Without seeing callers
  or the RenderInfo layout, the in-game meaning of those two bits is not confirmed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1,[r4,#oToolkit_RenderInfoPtr] then ldrh/strh on [r1] — operates on RenderInfo+0 halfword;
    bic r0,r2 with dword_804C4AC=0x4800 — exactly two flag bits cleared, nothing else touched; recorded
    route 'beastsp' calls it with no visible argument setup — a parameterless disable/enable toggle; 8
    instructions, no branches or callees — pure flag update
  refs:
  - bn6f/asm/asm03_2.s:10432
