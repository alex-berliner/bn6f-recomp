name: battle_updateHitSelfFrontPanelObj
address: '0x080C85C0'
kind: function
status: probable
summary: Per-frame update for a battle object whose actions are dispatched via a 2-entry table (an idle/unknown
  handler and battle_hitSelfAndFrontPanel); destroys the object when the battle is over.
interface: (r5 = battle object) -> r0 = 0; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to
  CUR_STATE_DESTROY when battle is over, otherwise dispatches CurAction through the jump table
details: 'Standard battle-object main routine: if battle_isBattleOver returns true it forces the object''s
  state word to CUR_STATE_DESTROY (battle ends). Otherwise it normally checks battle_isTimeStop and skips
  the update while time is frozen, except when oBattleObject_Param1 equals 4, which bypasses the time-stop
  gate. It then indexes a jump table at off_80C85EC with oBattleObject_CurAction (two entries) and calls
  the handler via mov lr,pc; bx r1, returning to the common epilogue afterwards. Entry 1 is battle_hitSelfAndFrontPanel,
  suggesting this object is an enemy/obstacle whose attack damages its own panel tile.'
