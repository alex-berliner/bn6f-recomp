name: battle_beastOutScrollStep
address: '0x081186A8'
kind: function
status: probable
summary: Advances the beast-out transformation's two scrolling sprite strips one step toward their target
  positions and reports how many have arrived.
interface: (r0 unused, r6 = beast-out state object, r7 via sub_81187DC = scroll-state object) -> r0 =
  count (0-2) of scroll fields that reached their target; flags from final compare
details: Reads a selector byte at r6+0xF, doubles it to index a pair of base bytes at byte_811873C. For
  two halfword fields of the state object (r6+0x28 and r6+0x2C, an entry index each) it computes a target
  position = index*0x14 + base - 1 (0x14 = stride per entry, e.g. 20 px/frame per icon in a strip). It
  calls sub_8118320 with (target, currentValue) for the scroll object's halfword fields r7+0xC and r7+0xE,
  storing the result back — so sub_8118320 moves/updates the current scroll value toward the given target.
  Each time the returned value equals the target, a counter on the stack is incremented; the function
  returns that counter, so 2 means both scroll fields have finished moving. Called repeatedly (from several
  sub_81184xx wrappers and battle_initBeastOutForm) until it returns 2, i.e. a per-frame step of the beast-out
  scroll animation.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: target = ldrh [r6,#0x28]*0x14 + byte_811873C[sel*2] - 1 stored on stack before each sub_8118320
    call; result of sub_8118320 is stored back to r7+0xC / r7+0xE and compared to the target; match increments
    stack counter; return value is the counter capped by 'cmp r0,#2' — a completion count, typical of
    per-frame animation step functions; caller battle_initBeastOutForm and its wrappers suggest a state
    machine driving the beast-out transform animation; stride 0x14 plus table-selected base implies a
    scrolling strip of fixed-size entries whose target cell is chosen by r6 fields
