name: renderTextGfx_8045F8C
address: '0x08045F8C'
kind: function
status: confirmed
summary: Publishes a text-graphics base pointer into the toolkit's text-renderer state, then hands the glyph chunk
  selected by an index to the renderer at sub_3006B94.
interface: void renderTextGfxChunk(u32* gfx, int entryIndex /* r0, r1; r9 = second arg to sub_3006B94 */)
details: 'r0 is the base of a text graphics blob and r1 an entry index into the u16 offset table at its start (r1<<1,
  ldrh, add). The base pointer is stashed at +0x40 of the object pointed to by toolkit field oToolkit_Unk200a220_Ptr
  (r10-relative load), i.e. the current text-renderer/work state, so later steps can find the graphics again. The
  resolved chunk pointer gfx + offsetTable[index] goes in r0 and r9 is passed as r1 to sub_3006B94 (called via a
  literal-pool long call with the mov lr,pc / bx Thumb trick). r8 and r9 are saved/restored around the call with
  push/pop pairs since Thumb cannot push high registers directly; as a side effect the final pop {r1}; mov r8,r1
  sequence leaves r1 holding the caller''s r8 value on return. Effectively a small dispatcher/wrapper: pick which
  chunk of the text graphics to render and delegate.

  '
