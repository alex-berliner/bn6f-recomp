name: object_wait60ThenDestroy
address: '0x080BF67E'
kind: function
status: probable
summary: 'battle object phase: idle for 60 frames, then destroy the object'
interface: (r5 = battle object, not passed in r0) -> r0 = scratch; sets oBattleObject_Timer, oBattleObject_PhaseInitialized,
  oBattleObject_CurStateActionPhaseAndPhaseInitialized
details: On first run of the phase (oBattleObject_PhaseInitialized == 0) it stores 0x3C (60) into oBattleObject_Timer
  and writes 4 to oBattleObject_PhaseInitialized. Every subsequent run decrements oBattleObject_Timer;
  while the result is > 0 it does nothing. When the timer reaches 0 it stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  telling the object framework to delete the object. The unused r0 result and use of r5 match the standard
  battle-object phase-update calling convention.
