name: ai_attackStepCommit
address: '0x080FC0EC'
kind: function
status: probable
summary: Per-frame step handler of an AI attack that commits the object onto its next panel once the step
  timer expires.
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no return value
details: Decrements oAIAttackVars_StepTimer and returns early while it is still >0. When it hits zero,
  sets oBattleObject_CurAnim to 3, copies FuturePanelX/Y into PanelX/Y, calls object_removePanelReserve,
  object_setCoordinatesFromPanels, and object_updateCollisionPanels to finalize the panel move, then reloads
  StepTimer with 3 and writes 8 to oAIAttackVars_HitElement. This makes the swept panel position active
  (hit/damage) for the next timer window. Part of the battlesweep attack sequence; the surrounding code
  presumably picks future panels and checks for the player hit elsewhere.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh/sub/strh on oAIAttackVars_StepTimer with bgt skip implements the per-step countdown gate;
    strb FuturePanelX/Y -> PanelX/Y followed by object_removePanelReserve commits the reserved move; object_setCoordinatesFromPanels
    and object_updateCollisionPanels sync pixel position and collision after the move; mov r0,#8; strh
    [r7,#oAIAttackVars_HitElement] arms the hit element for this step; reset of StepTimer to 3 and anim
    set to 3 show a repeating multi-step attack pattern
