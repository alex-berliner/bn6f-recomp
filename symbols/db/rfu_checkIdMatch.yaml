name: rfu_checkIdMatch
address: '0x0813D648'
kind: function
status: probable
summary: Wrapper that runs the RFU soft-reset/game-ID check and returns TRUE when the IDs match.
interface: () -> r0 = 1 if rfu_REQBN_softReset_and_checkID returned 1 (ID check passed), else 0
details: Calls rfu_REQBN_softReset_and_checkID with no arguments of its own, then compares the return
  value against the constant 1 (loaded from a nearby literal pool) and returns the comparison result as
  r0, making it a boolean predicate over the raw RFU result. It preserves no registers besides lr and
  relies on the callee for all real work, so it is purely a convenience/normalization wrapper. Used broadly
  across battle, menu, story, and wander routes, consistent with connection-ID checking being done wherever
  wireless link state is polled.
