name: IsButtonPressed
address: '0x0811F7EC'
kind: function
status: confirmed
summary: Returns whether any of the buttons given in the mask were newly pressed this frame, for menu/UI input checks.
interface: bool IsButtonPressed(u16 buttonMask /* r0 */, Toolkit *toolkit /* r10 */); sets NZ flags from (mask &
  pressed), returns pressed word in r1
details: 'Reads the toolkit''s joypad pointer (r10 + oToolkit_JoypadPtr) and loads the "pressed this frame" halfword
  (oJoypad_Pressed, offset +2 in the joypad struct - the edge-triggered word, not the held word). TSTs the caller''s
  button mask against it, leaving NZ flags set so callers branch directly on the result. The pressed word is also
  copied to r1, letting callers reuse it. Tiny leaf helper; no clobbers. Note the odd ABI: the boolean is conveyed
  via flags (and r1''s mask), not via a return register.

  '
