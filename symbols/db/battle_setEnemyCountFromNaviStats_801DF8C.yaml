status: probable
summary: Stores the looked-up enemy-virus count (0x10/0x20/0x40) into eStruct2035280.NaviStatusGfxIdx
  (offset 0x22).
interface: '(r0 = u16 enemyVirusCount) -> void ; side effect: writes r0 as a u16 to eStruct2035280+0x22'
details: "Loads the base address `eStruct2035280` (0x02035280) from the literal pool at off_801E0D8 into\
  \ r1.\n  Stores the low 16 bits of r0 into r1+0x22 via `strh r0, [r1, #0x22]`.\n  Returns immediately\
  \ (`mov pc, lr`), so it preserves nothing for the caller and returns nothing.\n  The caller `battle_applyNaviStatTableEntry_8014178`\
  \ computes the count as 0x10/0x20/0x40 from the\n  current navi's two stat-slot kind-8 values via a\
  \ 12-byte table, then hands it here so the battle\n  subsystem knows how many enemy viruses are present.\
  \ The destination field 0x22 sits two bytes\n  past the known `NaviStatusGfxIdx` byte (0x17); the `s_2035280_struct`\
  \ only documents up to 0x60\n  with the closest named field at 0x17, so the exact semantic name of the\
  \ halfword at 0x22 is not\n  pinned down (likely an enemy count or related counter, consistent with\
  \ the caller's 0x10/0x20/0x40\n  values).\n"
