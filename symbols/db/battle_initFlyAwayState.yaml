name: battle_initFlyAwayState
address: '0x080DC730'
kind: function
status: probable
summary: State-entry handler that launches a battle object up and backward off the field (flying away),
  removing it from collision and switching to a fly-away update state.
interface: (r5 = battle object pointer, set by caller; r0/r1 unused on entry) -> r0 = destroyed/cleared;
  no meaningful return; side effects on the object at r5
details: Copies oBattleObject_PanelX/Y into the FuturePanelX/Y fields and calls object_setCoordinatesFromPanels
  to sync pixel coordinates. Then it adds -frontDirection * 0x50 (80 px, 16.16 fixed point) to oBattleObject_X,
  so the object retreats opposite its facing side, and sets oBattleObject_Z to 0xA0<<16 (160), lifting
  it high above the field. It initializes sprite resource 0x100d via battleObject_initSpriteAndCollision_8011504
  (which also sets the shadow flag and collision slot), sets bit 2 of oObjectHeader_Flags, calls object_clearCollisionRegion
  so the object no longer occupies any panel, and refreshes collision state via object_presentCollisionData.
  Finally it stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized and calls
  sub_80DC778, the per-frame update for this state.
