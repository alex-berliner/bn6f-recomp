status: probable
summary: Builds the 30-chip battle folder (eBattleFolder) from a navi stat block, applying Beast-Out/dark-chip
  overrides from battle state and optionally shuffling it
interface: '(r0..r3 ignored on entry) -> no return value ; side effects: writes eBattleFolder (30 halfwords),
  may set BattleState.Unk_17 / Unk_44, may shuffle folder'
details: '1. Reserves three local byte slots initialized to 0xFF (chip-position sentinels) for the "fixed"
  slots.

  2. Calls GetBattleEffects; if the 0x200000 (Beast-Out) bit is set, uses the per-navi beast-out source
  pointer at 0x02039AA0 directly; otherwise picks the current battle-mode source pointer from dword_802137C
  (falling back to tk->S_Chip_2002178_Ptr when that table is zero).

  3. If the resolved chip source equals the live S_Chip_2002178_Ptr, indexes a navi-stats record (battle_getNaviStatsByte_800A540
  with index 0x2D, stride 0x3C) so a folder-tied navi gets its own battle folder; r7=1 marks "already
  plaintext".

  4. If the 0x80 (dark/darkInvincible) battle-effect bit is set, looks up the current navi via pet_getCurNaviChainedLookup_800A4E0;
  if not 0xFF, forces slot 0 to that chip and sets BattleState+0x17 = 1 (tells shuffleFolder to preserve
  a slot). pet_getCurNaviStatusPair_800A506 then forces slots 1 and 2 to the current navi''s chip pair
  and sets BattleState+0x44 = 1.

  5. Walks the 30 halfwords of the source chip block: for each offset r2, the first matching sentinel
  slot in [sp, sp+4, sp+8] gets the chip; otherwise it is appended sequentially to eBattleFolder (offset
  r3, starting at 2 since slot 0/1 are reserved for dark-chip + status pair).

  6. If the source was not the live PET navi stats (r7 == 0), runs encryption_decryptPackTable30_800a7ea
  in place to unpack the 9/7-bit packed chip IDs.

  7. When the 0x80 effect bit is set, calls shuffleFolder_800A570 with the precomputed BattleState+0x17
  / +0x44 flags so Giga chips are isolated and any fixed slot is preserved.

  8. Called from battle_RevealFieldColumnsStep_80079F0 after the field pattern is applied, between steps
  7 and 8 of the battle-intro script.

  '
