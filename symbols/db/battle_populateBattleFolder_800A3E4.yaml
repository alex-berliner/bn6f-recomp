open_questions:
- The exact semantics of BattleState+0x17 and +0x44 (passed as r1/r2 into shuffleFolder_800A570) are not
  directly visible here; their values of 1 likely mean "this slot must survive the shuffle as a Giga-paired
  slot" but the precise contract is owned by the shuffle routine.
- Why the live tk->S_Chip_2002178_Ptr comparison (0x0800A414) gates NaviStats indexing is unclear; it
  probably distinguishes an out-of-battle vs in-battle navi stats block (the 0x2D index is the folder
  pointer within NaviStats, so the offset 0x3C points at the per-navi folder data).
