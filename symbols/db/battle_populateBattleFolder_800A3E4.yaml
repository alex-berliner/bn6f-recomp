    the trailing `r3` for ordinary chips, matching a 30-chip folder layout. - `tst r7, r7` at 0x0800A4AC
    and `bl encryption_decryptPackTable30_800a7ea` at 0x0800A4B2 skip the decryption when the source was
    already a NaviStats record. - `mov r0, #0x80; tst r0, r4` then `bl shuffleFolder_800A570` at 0x0800A4B6-0x0800A4D0
    shuffle the folder with the previously stashed BattleState flags (Unk_17, Unk_44) as parameters. -
    The lone caller `battle_RevealFieldColumnsStep_80079F0` is documented as the script step that finishes
    the column-reveal animation; populating the battle folder fits between that step and the script''s
