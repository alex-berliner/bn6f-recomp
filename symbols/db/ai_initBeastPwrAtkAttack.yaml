name: ai_initBeastPwrAtkAttack
address: '0x08011C00'
kind: function
status: probable
summary: Initializes an AI attack's damage values for the beast-power attack (40 base scaled by the beast-out
  multiplier) plus a flat extra damage of 138, and returns 60.
interface: (r7 = enemy/AI object with oAIAttackVars fields) -> r0 = 60 (likely attack duration/frame count);
  no flags meaningful
details: Sets r0=0x28 (40) and r1=0x1e (30) and calls battle_beastPwrAtk_addScaledBase_8012642, which
  computes base * beastOutMulti with the multiplier clamped to 5, so the result is a scaled base damage
  for the current beast-out level. The result is stored into oAIAttackVars_Damage (strh [r7,#oAIAttackVars_Damage]).
  It then hardcodes oAIAttackVars_ExtraDamage = 0x8a (138) and oAIAttackVars_InitFlag = 3, marking this
  attack as initialized/configured. Finally it returns 0x3c (60), most plausibly a timer or duration the
  caller uses for the attack. The r7-based oAIAttackVars fields show this runs in the enemy AI attack-execution
  context.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_beastPwrAtk_addScaledBase_8012642 with r0=0x28, r1=0x1e computes the scaled damage
    (multiplier clamped to 5 per callee summary); strh r0,[r7,#oAIAttackVars_Damage] stores the computed
    damage into the AI attack var struct; strh 0x8a into oAIAttackVars_ExtraDamage sets a fixed secondary
    damage value; strb 3 into oAIAttackVars_InitFlag marks the attack setup as done; returns 0x3c (60),
    a plausible frame count/period for an AI attack step
