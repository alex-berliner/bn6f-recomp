name: chatbox_initFromScriptEntry_80428C0
address: '0x080428C0'
kind: function
status: confirmed
summary: Initializes a chatbox's display state (char index, cursor, row, derived row, text-pointer slot)
  from a 5-byte script entry and advances the script pointer by 5.
interface: void chatbox_initFromScriptEntry_80428C0(const u8 *entry /* r4 */, struct Chatbox *chatbox
  /* r5 */) -> returns 1 in r0; clobbers r1, r2, r3, r4, NZCV.
details: 'Reads entry[2] -> chatbox->TextScriptCharIdx (and also writes to chatbox+0x94, the text-pointer
  slot).

  Sets chatbox->CursorIdx = charIdx + 0xAF.

  Reads entry[3] -> chatbox->Unk_19 (row).

  Reads entry[4] (stride), then writes chatbox->Unk_1B = row + 0xC * stride (a derived row index, wrap-by-u8).

  Returns 1 in r0 and bumps the caller-provided r4 by +5 so the caller''s entry pointer advances past
  this 5-byte record.

  Used by the chatbox/script dispatcher to load a line description; returns 1 to signal "entry consumed,
  keep going".


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
