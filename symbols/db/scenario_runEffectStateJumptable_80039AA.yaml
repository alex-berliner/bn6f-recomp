status: probable
summary: 'Per-frame scenario effect dispatch: indexes `jt_80038E8` by `eScenarioEffectState2000780.Index`
  and tail-calls the resulting handler.'
interface: (no args passed by callee — caller-set r10 toolkit + lr drive behaviour) -> r0 from the dispatched
  handler ; no side effects on r4-r9/r12 when no handler runs
details: 'At entry, reads a byte from `eScenarioEffectState2000780` (`ldr r5, off_80039F0`). If that byte
  is zero, or has bit 0x80 set, returns immediately (`tst r0,r0 / beq locret` and `tst r0,#0x80 / bne
  locret`). Otherwise reads `eScenarioEffectState2000780.Index` (offset +1), multiplies by 0x10, adds
  that to `jt_80038E8` (`ldr r7, off_80039F4`), loads the function pointer at `jt_80038E8[Index]`, and
  `bx r0`s into it. The function therefore acts as a 16-byte-stride scenario-effect dispatcher; its result
  comes from the called handler (its r0/flags appear in the captured exits as 0/-ZC- across all 40 calls).
  No other memory or registers are touched beyond r5/r7; r4-r9/r12 are preserved for the caller via the
  `push {r4-r7,lr} / pop {r4-r7,pc}` epilogue. The dispatch gate at 0x00 and 0x80 makes this match the
  standard "state inactive or terminal-bit-set → bail" idiom used by the per-frame state handlers it sits
  beside (every caller in the callee list is a per-frame state handler that also gates itself on the screen
  fade).

  '
