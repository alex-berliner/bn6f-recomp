name: sub_811F214
address: '0x0811F214'
kind: function
status: hypothesis
summary: Iterates a built-in three-entry table and passes each (word0, word1) pair to sub_802FE28 with fixed arguments
  (0, 1), most likely registering three related display/animation entries.
interface: void runEntryTableTriple_811F214(void)
details: 'No-argument, no-result helper. It walks a three-entry, eight-bytes-per-entry table stored right after
  the function''s literal pool (dword_811F234). Every entry shares the same word0 (0x80804076) while word1 steps
  by 8 each time (0x0000E2BC, 0x0000E2C4, 0x0000E2CC), which reads like three instances of the same resource with
  successive offsets/ids. Each entry is handed to sub_802FE28 as (u32 a1 = word0, u16 a2 = low half of word1, notUsed
  = 0, a4 = 1). The loop counter is kept in r6 and the table cursor in r7; r4 and r5 are pushed and popped but never
  touched, matching the original''s register discipline. The function preserves r4-r7 and only clobbers r0-r3, lr
  and flags, so it is safe to call from any context that keeps those. Because the table data is embedded with the
  function rather than referenced from a data structure, this looks like a fixed one-shot setup call (e.g. three
  sprites/texts/objects of the same kind spawned or registered at once), but the purpose of sub_802FE28''s arguments
  is not confirmed from this function alone.

  '
