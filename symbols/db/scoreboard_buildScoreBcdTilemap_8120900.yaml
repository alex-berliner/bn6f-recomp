name: scoreboard_buildScoreBcdTilemap_8120900
address: '0x08120900'
kind: function
status: confirmed
summary: Builds an 11x2 background tilemap displaying two 4-digit BCD scores separated by a dash (e.g.
  "1234-5678"), with leading zeros blanked and a priority-set terminator, then blits it via CopyBackgroundTiles.
interface: "void sub_8120900(u16* tile_map, u32 val1, u32 val2, u32 base_tile_id, u32 bg_j, u32 bg_i,\
  \ u32 lr)\n  inputs:  r0=tile_map, r1=val1, r2=val2, r3=base_tile_id, r4=bg_j, r6=bg_i, r10=lr\n  outputs:\
  \ r5, r7\n  clobbers: N Z C V r0 r1 r2 r3 lr\n  preserved: r4 r5 r6 r7\n"
details: "Writes 22 halfwords (11 normal + 11 shadow entries at tile_map + 22) representing a\n\"score:\
  \ score\" string tile-by-tile. Layout, in pairs of u16 (normal, shadow):\n  col 0:  base_tile_id + 0\
  \  (alignment blank)\n  cols 1-4: BCD digits of val1, nibbles 12..0, left-padded with blank (base+0x18)\
  \ until\n            a non-zero digit is seen or only the units column remains\n  col 5:  base_tile_id\
  \ + 0x16 (dash separator)\n  cols 6-9: BCD digits of val2, same left-padding rule\n  col 10: (base_tile_id\
  \ | 0x400) terminator with BG-priority bit set\nEach digit tile is at base_tile_id + digit*2 + 2 (even=fg,\
  \ +1=shadow). Val1 and val2\nare first passed through memory_bcdConvert. Finally calls\nCopyBackgroundTiles(bg_j,\
  \ bg_i, 2, tile_map, 0xB, 2) to copy an 11x2 block to BG.\nNo flags or global state are returned; the\
  \ result is purely the side-effecting tile\nupload.\n"
