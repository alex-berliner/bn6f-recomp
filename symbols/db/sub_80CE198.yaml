name: sub_80CE198
address: '0x080CE198'
kind: function
status: confirmed
summary: 'Per-tick update for a battle object that is dropping toward the ground: spawns dust every 10 ticks at
  jittered position, lowers height by 3, and on landing clears the airborne flag, switches to action 4, and resets
  its phase.'
interface: 'void sub_80CE198(void);  // in: r5 = battle object pointer, lr = return; out: r5 preserved, r0-r4/lr
  clobbered; flags clobbered (NZCV)'
details: 'Reads/writes a battle object via the r5 pointer. Increments `oBattleObject_Timer` each call.

  Uses BIOS Div (swi 6) with divisor 10; the remainder in r1 acts as an "every 10 ticks" gate

  (remainder 0 -> spawn). When due, calls `AddRandomVarianceToTwoCoords` to jitter `oBattleObject_X`

  and `oBattleObject_Z`, then spawns an effect with id 0x10 via `spawn_t1_0x0_EffectObject`

  (R4 = 0x26 likely the effect subtype/arg). Each tick decreases `oBattleObject_Z16` by 3; when

  it would fall below 3 (i.e. z-3 < 0 on a signed compare), the object is considered landed:

  clears bit 1 of `oObjectHeader_Flags` (the airborne flag), sets `oBattleObject_CurAction = 4`,

  and zeroes `oBattleObject_CurPhaseAndPhaseInitialized` to start the next action at phase 0.

  The swi 6 remainder check uses r1 == 0, not the quotient, so this is "tick % 10 == 0", not

  "tick / 10 == 0". Inputs to the effect spawn appear to be r0 = effect id (0x10), r1 = jittered

  X, r2 = Y (unmodified), r3 = jittered Z, r4 = 0x26. Typical "object falls and lands" handler,

  e.g. for a meteor / falling rock / item drop in battle.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
