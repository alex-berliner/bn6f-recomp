name: object_updateFrame
address: '0x080D8CF0'
kind: function
status: probable
summary: 'Per-frame update for a battle object: returns early (nullsub_10) if battle flag bit 0 is clear;
  clears bit 0x02 and sets bit 0x04 of oObjectHeader_Flags, drops collision data, then if sub_80D8D7E(0)
  >= 0 dispatches the CurAction jump table slot, object_updateSprite and object_presentCollisionData;
  otherwise plays sound 0x6F, calls sub_80D8DEE, clears collision region, and writes CUR_STATE_DESTROY.'
interface: (r0-r3 args unused here; r5 = pointer to the object's header/oBattleObject struct) -> r0 =
  destroyed/updated object state via struct fields; no meaningful return value
details: First it tests bit 0 of the battle state flags (oBattleState_Unk_32) and does nothing (nullsub_10)
  if that bit is clear, so updates only run while that battle condition holds. It then clears bit 0x04
  and sets bit 0x02 of oObjectHeader_Flags, calls object_removeCollisionData to drop stale per-frame collision
  info, and, unless the battle is over, calls sub_80D8D7E(0); if that returns non-negative, it dispatches
  oBattleObject_CurAction through a jump table (which currently holds only nullsub_97), then runs object_updateSprite
  and object_presentCollisionData. If the battle is over or sub_80D8D7E returns negative, it plays sound
  effect 0x6F, calls sub_80D8DEE, clears the object's collision region, and stores CUR_STATE_DESTROY into
  oBattleObject_CurStateActionPhaseAndPhaseInitialized, i.e. the object is torn down. The r5-based struct
  is the standard battle object header (oObjectHeader_Flags, oBattleObject_CurAction, oBattleObject_CurStateActionPhaseAndPhaseInitialized),
  set up by the caller sub_80D8C7C.
