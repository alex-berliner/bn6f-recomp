    state/collision refresh; ldr r1,[r1,r0] off off_80D8D54 indexed by oBattleObject_CurAction: action-handler
    dispatch table; bl object_updateSprite / object_presentCollisionData after dispatch: normal frame
    update path; PlaySoundEffect(0x6F) + object_clearCollisionRegion + CUR_STATE_DESTROY store: teardown
    path when battle over or sub_80D8D7E < 0'
