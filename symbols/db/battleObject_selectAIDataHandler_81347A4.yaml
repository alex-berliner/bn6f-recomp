status: probable
summary: 'A-button confirm step for the custom-style AI/anger menu: stores the picked slot index, plays
  the select SFX, flips a state byte through a 2-byte cursor pair, then dispatches a per-mode handler
  via `battle_fieldLockDispatch_8120018` and rewrites the three tracked target slots so they no longer
  match their stored enemy references.'
interface: '(r2 = scene ctx, r5 = AI menu state, r8 = ?, r10 = Toolkit, lr) -> r0 = 1 if A was newly pressed,
  else 0; side effects: PlaySoundEffect(SOUND_MENU_SELECT), writes AIData-related fields on r5 and the
  cursor pair at s_2001c04, calls battle_fieldLockDispatch_8120018'
details: "- On entry r5 is treated as the menu-state struct (AIData-like): the code reads `r5+0xd` as\
  \ a 0/1 mode byte, `r5+0x4c` as a feature mask (bits 0x1 and 0x20 enable two tracking sections), `r5+0x1c/0x5c/0x60`\
  \ as slot indices, and `r5+0x34` as `Anger` (per the AIData struct). r10 is the Toolkit, used to dereference\
  \ `oToolkit_S2001c04_Ptr` into r0 for the cursor pair.\n  - `IsButtonPressed(JOYPAD_A)` is checked first;\
  \ if not pressed the function returns 0 immediately (the `b loc_81348C4` path sets r0=0 and `tst r0,r0`\
  \ for the return-NZ convention).\n  - When A is pressed, up to three \"saved\" ptrs are cached on the\
  \ stack: `[sp]` from the slot index at `r5+0x1c` (only if `r5+0x4c & 1`), `[sp+8]` from `r5+0x5c` and\
  \ `[sp+0xc]` from `r5+0x60` (only if `r5+0x4c & 0x20`). Each lookup multiplies the index by 0x20 (size\
  \ of the per-element record) and reads the first 4 bytes at the address table rooted at `off_81348D4\
  \ -> word_202A020`.\n  - `PlaySoundEffect(SOUND_MENU_SELECT)` is then called.\n  - `Anger` (u16 at `r5+0x34`)\
  \ is written into the low byte of the 2-byte cursor pair at `[s_2001c04+0]`; the other byte (at `[s_2001c04+1]`\
  \ or `+3`, picked by mode) is XOR'd with 4 to toggle a state bit. The choice of pair offset and \"other\"\
  \ offset is `0/1` for `r5+0xd == 0` and `2/3` for `r5+0xd != 0`, with the previous-value comparison\
  \ routed through `byte_30069A0[Anger]`.\n  - `battle_fieldLockDispatch_8120018(r0=table, r1=anger per\
  \ state 0x1e or 0x28, r7=mode)` is called to walk every battle object and apply the mode's handler under\
  \ a per-field lock/unlock.\n  - A loop (r7 = 0..0x1d) re-scans the same per-record table; whenever a\
  \ record's first 4 bytes match one of the cached saved ptrs, the corresponding slot in r5 is rewritten\
  \ with the current loop index and the matching bit is latched in r6 so each section can only rewrite\
  \ once. Only the section for `r5+0xd == 0` runs (the `tst r0,r0; bne loc_81348BE` path skips it for\
  \ mode 1).\n  - Always returns 1 (`r0=1; tst r0,r0` sets Z=0, matching the caller's \"result in nz\"\
  \ contract).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0,#JOYPAD_A; bl IsButtonPressed; bne ... ; b loc_81348C4` shows the function gates
    everything on a fresh A press and the `loc_81348C4` arm sets r0=0 with `tst r0,r0` (per the caller
    `sub_8133944` which expects an nz flag). - `ldrb r0,[r5,#0xd]; tst r0,r0` followed by the `beq loc_81347F8`
    and the two-tone `mov r1,#0; mov r4,#1` vs `mov r1,#2; mov r4,#3` shows r5+0xd selects between two
    2-byte cursor sub-pairs in s_2001c04. - `ldrh r2,[r5,#0x34]; ... strb r2,[r0,r1]` plus the `mov r1,#4;
    eor r3,r1; strb r3,[r0,r4]` pattern shows Anger is shoved into one byte and the partner byte gets
    bit 0x4 flipped, exactly the "select confirm toggles a flag" idiom. - `ldr r1,[r10,#oToolkit_S2001c04_Ptr]`
    is the canonical way this codebase reaches the S2001c04 struct. - `ldr r1,off_81348D0 / ldr r1,[r1]`
    twice with constants `0x202A020`/`0x202A3E0` (off_81348D4) shows a two-section per-record table of
    0x20-byte entries; the saved `r5+0x1c` (u16, then later `ldrh r0,[r5,#0x1c]; mul r0,r2,#0x20`) and
    the u32-style indices at `r5+0x5c`/`r5+0x60` index into it. - `ldr r1,[r5,#0x4c]; tst r1,#1 / #0x20`
    gates the three saved-ptr slots independently, exactly matching the three cache slots on the stack
    `[sp]`, `[sp+8]`, `[sp+0xc]`. - `bl battle_fieldLockDispatch_8120018` with the anger value loaded
    into r1 (0x1e for mode 0, 0x28 for mode 1) and the table pointer in r0 is the only side-effecting
    callee that touches battle objects here; the contract "wraps a mode-dispatched battle handler with
    two-pass lock/unlock" fits the post-rally "rewrite all matching enemy slots" tail. - The tail loop
    `mov r7,#0 ... cmp r7,#0x1e; blt loc_813484A` walks all 30 entries of the section-0 table and, on
    hit, stores the loop index back into `r5+0x1c`/`+0x5c`/`+0x60`, with r6 acting as a one-shot per-section
    mask (1, 2, 4). - `SOUND_MENU_SELECT` constant in `PlaySoundEffect(SOUND_MENU_SELECT)` is the standard
    menu-confirm chirp used across the codebase.'
