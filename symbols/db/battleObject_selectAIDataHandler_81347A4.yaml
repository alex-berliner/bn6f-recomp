name: battleObject_selectAIDataHandler_81347A4
address: '0x081347A4'
kind: function
status: confirmed
summary: 'Handles the A-button confirm in the battle-object (AI/Navon) selection menu: saves the current slot indices,
  plays the select sound, updates toolkit navigation state, dispatches a field-lock change, then rescans the 30-entry
  selection table to remap saved indices to loop positions.'
interface: u32 battleObject_selectAIDataHandler_81347A4(void *battleCtx /*r5*/, void *toolkitPtr /*r10*/, u32 soundParam
  /*r2*/, u32 r8) -> nz(1=confirmed / 0=no A press), r8-r12 updated via field-lock dispatch
details: "Early-exits with Z set (r0=0) when JOYPAD_A is not pressed; otherwise proceeds\nwith the confirm path\
  \ and returns NZ (r0=1).\n\nr5 is the battle-object context struct:\n  +0x0D  alliance flag (0 = solo/standard\
  \ table via off_81348D4[0], non-zero = alliance table via off_81348D4[1])\n  +0x1C  u16 slot-A index into the\
  \ 32-byte-stride selection table\n  +0x34  u16 navigation value (menu page/cursor position)\n  +0x4C  u32 flags:\
  \ bit 0 gates slot-A tracking, bit 5 (0x20) gates slot-B and slot-C tracking\n  +0x5C  u32 slot-B index\n  +0x60\
  \  u32 slot-C index\n  +0x1E / +0x28  field-lock identifier read depending on alliance\n\nThe selection table\
  \ is a 30-entry array of 32-byte structs pointed to by\nword_202A020 (solo) or unk_202A3E0 (alliance); only the\
  \ first u32 of each\nentry is compared during the index-rescan loop.\n\nToolkit (r10 + oToolkit_S2001c04_Ptr)\
  \ holds four navigation bytes at offsets\n0–3; offsets 0/1 are used when alliance==0, offsets 2/3 when alliance!=0.\n\
  The byte is XOR'd with 4 (lock toggle) via a lookup through byte_30069A0.\n\nAfter the field-lock dispatch call,\
  \ the function iterates 0..29 over the\ntable entries, matching the saved stack-buffered values back to their\
  \ loop\nindex and writing that index into the respective slot field (only for the\nsolo/alliance==0 case).\n"
