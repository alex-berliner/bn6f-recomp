open_questions:
- The exact meaning of the two `r5+0xd` modes (0 vs non-zero) and of the `Anger` field is unclear; the
  assembly only shows it routes into different sub-pairs of the S2001c04 cursor pair and a different handler
  value (0x1e vs 0x28). Cross-referencing the AIData struct's `Anger // loc=0x34` with BN6 enemy-conflict
  UI would settle whether this is a real in-battle enemy-conflict UI or some other A-press confirm in
  a non-battle subsystem.
- What `off_81348D4 -> {word_202A020, unk_202A3E0}` actually describes (two distinct per-record tables
  or one table split by mode) is not deducible from this function alone.
- Whether the saved target slots are battle-object pointers or something narrower (e.g., player IDs) depends
  on the table layout at 0x202A020.
