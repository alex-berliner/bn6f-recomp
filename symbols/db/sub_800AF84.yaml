name: sub_800AF84
address: '0x0800AF84'
kind: function
status: hypothesis
summary: Selects a battle "mode pair" from the current battle effect flags (special-casing effect bit 0x8 against
  the battle state) and tail-dispatches into sub_800AC20 with the chosen parameters.
interface: 'void sub_800AF84(void); // in: r4-r7 (passthrough args), r10 = toolkit; out: r0-r2 plus whatever sub_800AC20
  leaves in r0-r7/c/v; r5-r7 preserved through this frame'
details: 'Thin parameter-preparation shim in front of sub_800AC20. Reads the battle effect flags via GetBattleEffects()
  (r10 toolkit context). If effect bit 3 (0x8) is clear, it maps effect bit 0 to a 0/1 mode selector and calls sub_800AC20
  with r0 = (effects & 1), r1 = 0, r2 = raw effects value, r3 = 1. If bit 0x8 is set, it instead takes mode = 2
  and loads toolkit->BattleStatePtr->oBattleState_Unk_0d (byte) as r1; normally the byte''s low bit is XOR-flipped
  first, but when battle_getStateByteNibbles_800A832() returns 1 the byte is passed unmodified — a special case
  that likely corresponds to one side''s state already being in the expected polarity. r4-r7 and r10 are never touched,
  so whatever extra arguments the caller staged in r4-r7 flow straight through this frame into sub_800AC20, which
  the tail `pop {pc}` returns from directly. The three r0 modes (0, 1, 2) suggest sub_800AC20 switches on a battle-variant
  kind (e.g. normal vs an effects-driven variant vs the 0x8-flagged variant).

  '
