name: battle_calcDamageTakenRamp
address: '0x08010B78'
kind: function
status: probable
summary: 'Returns a ramp value: if battle flag 0x40 is set, returns (entry at unk_2036120[r1])[0x28] +
  0x1500; otherwise maps the actor''s TotalDamageTaken (r0) >>7 through piecewise-linear segments (≤0x40:
  10+22*t/64; ≤0x70: 32+96*(t-64)/48; <0x80: 128+128*(t-112)/15), or 0xa as fallback. r1 is the unk_2036120
  record index, r0 is the actor pointer.'
interface: (r0 = actor index/param, r1 = index into the 0x1D0-stride array at 2036120) -> r0 = computed
  value; r1 clobbered by BIOS Div.
details: 'The function preserves r0/r1 around a battle-testFlag0x40 call. If flag 0x40 is clear, it fetches
  the actor''s TotalDamageTaken counter, shifts it right by 7 (units of 128 damage), and maps it through
  three piecewise-linear segments using BIOS Div (SWI 6): t<=0x40 gives 10+(22*t)/64, t<=0x70 gives 32+(0x60*(t-0x40))/0x30,
  and t<0x80 gives 128+(0x80*(t-0x70))/0xF, saturating near 256. For t>=0x80 it returns 0xA, so the value
  wraps/drops rather than saturating, hinting at a cycling counter (animation timing, flash, or gauge
  step). If flag 0x40 is set, it instead reads the halfword at +0x28 of the record at unk_2036120[index]
  (0x1D0-byte entries) and returns that plus 0x1500, a far larger magnitude. No caller is known, so the
  consumer and game meaning of the return value are unconfirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'locret path: total damage counter >>7 drives cmp against 0x40/0x70/0x80 branches, each a linear
    ramp via svc 6 (BIOS Div); add r0,#0xa / #0x20 / #0x80 base offsets give a 10-256 output range that
    drops back to 10 for t>=0x80; flag-0x40 branch: getEntryPtr_2036120_1D0 then ldrh [r0,#0x28]; add
    r0,#0x1500 returns the stored field plus 0x1500 instead; callees battle_getTotalDamageTakenForActor_801DFE4
    and battle_testFlag0x40_800A8F8 place it in the battle subsystem'
  refs:
  - bn6f/asm/asm00_2.s:4445
  - 0x0801DFE4 battle_getTotalDamageTakenForActor_801DFE4
  - 0x0800A8F8 battle_testFlag0x40_800A8F8
  - 0x0802E070 getEntryPtr_2036120_1D0_802E070
  reproduce: python3 tools/asmcat.py 0x08010B78
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The piecewise linear ramp and the 0x1500-add branch both match the proposal. However, the model
    says ''For t>=0x80 it returns 0xA'' — the assembly (loc_8010B96: mov r0,#0xa) shows r0 is preloaded
    with 0xa and all three branches that fall through exit at locret_8010BCE with r0 modified, so the
    bge at 8010BAE actually skips ALL three branches and returns the literal 0xa for the wrap case. Also
    the interface claim ''r1 = index into the 0x1D0-stride array'' is backwards: r0=actor, r1=index. The
    flag-set branch returns 0x1500+halfword, used in two registers r0/r1 then overwritten — fine. The
    name ''battle_calcDamageTakenRamp'' is reasonable.; run wf investigate investigate-20261018-235109;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
