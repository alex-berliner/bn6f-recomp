name: battle_settleCollisionCounters
address: '0x0800EAC4'
kind: function
status: probable
summary: Transfers a pending value stored at collision-data +0x84 into the counter at +0x80 and clears
  the pending slot.
interface: (r0 = battle object, r5 also points to it) -> r0 = clobbered; flags from the final strh/pop
  path (not meaningful)
details: Loads the battle object's CollisionDataPtr from oBattleObject_CollisionDataPtr, reads the halfword
  at +0x84, writes 0 back to +0x84, then reads the halfword at +0x80, subtracts the saved +0x84 value
  from it, and stores the result back at +0x80. So +0x84 acts as a one-shot delta that is applied to the
  running counter at +0x80 exactly once and then reset. Called from the enemy per-frame update (battle_8108F74),
  so it settles a queued collision/counter adjustment each frame for that object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r2,[r5,#oBattleObject_CollisionDataPtr] then ldrh r0,[r2,#0x84] / strh r1(0),[r2,#0x84]
    reads and clears the pending slot; ldrh r1,[r2,#0x80]; sub r1,r1,r0; strh r1,[r2,#0x80] applies the
    cleared value to the counter at +0x80; only caller battle_8108F74 is the virus/enemy per-frame update,
    so this runs once per frame per enemy object
