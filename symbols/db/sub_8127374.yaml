open_questions:
- What exact struct r5 points at (substruct of SubMenu / chatbox / row entry?) — would settle it by inspecting nearby
  struct definitions and the parent `sub_8126CC0` to see how it builds the array of `r5` pointers.
- The meaning of offset 0xd/0xe (likely shadow row offsets) and of halfword 0x24 (`JoypadPressed` field of AIData
  suggests this is *not* an AIData, but probably a small PET-menu row struct we don't have in the provided headers).
- Whether the 0x34 constant is a size/stride or an OAM layer parameter.
