name: battle_spawnObjectB3
address: '0x080DBC90'
kind: function
status: probable
summary: Wrapper that spawns battle object type 0xB3 and fills its panel position, element, linked-object
  pointer and extra fields, copying the linked object's alliance.
interface: (r0 = panel X, r1 = panel Y, r2 = element, r5 = related/source object ptr, r6 = damage/stamina-counter
  value, r7 = extra-vars value) -> r0 = spawned battle object pointer (0 on failure); flags from spawn
  success check
details: Saves r0-r2 and r5 with `push {r0-r2,r5}` so they double as the stack arguments for object_spawnType3,
  called with the object id 0xB3 in r0. If the spawn fails (Z set by the callee) it returns immediately.
  On success the new object (returned in r5/r0 by the callee's non-standard convention) gets PanelX =
  old r0, PanelY = old r1, Element = old r2, RelatedObject1Ptr = old r5, DamageAndStaminaDamageCounterDisabler
  = old r6, and ExtraVars = old r7. It then copies the AllianceAndDirectionFlip halfword from the related
  object in r5 into the new object, so the spawned entity shares the source's side/flip. Finally it sets
  bit 0x10 in the new object's oObjectHeader_Flags. Note r6/r7 are inputs the caller must set, an unusual
  register-argument convention.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: push {r0-r2,r5} before `mov r0,#0xb3; bl object_spawnType3` passes the caller's r0-r2/r5 as
    the spawn's stack arguments; pop {r1-r3,r5} recovers the saved args and the stores map them one-to-one
    onto oBattleObject_PanelX/PanelY/Element/RelatedObject1Ptr; str r6/r7 into oBattleObject_DamageAndStaminaDamageCounterDisabler/oBattleObject_ExtraVars
    shows r6/r7 are caller-supplied inputs; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh
    r3,[r0,...] copies the source object's alliance to the spawned object; orr with 0x10 into oObjectHeader_Flags
    marks the new object with that flag after a successful spawn
