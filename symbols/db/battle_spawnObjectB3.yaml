open_questions:
- What battle object id 0xB3 actually is (a caller-side context or the spawn table would identify it)
- The meaning of ObjectHeader_Flags bit 0x10
- Why object_spawnType3 appears to hand back the object pointer in r5 (mov r0,r5 before the pop) — confirming
  its return convention would firm this up
- What sub_80BC160 does with the spawned object
