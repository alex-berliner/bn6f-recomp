name: battle_objectDelayThenDestroyUpdate
address: '0x080DF4B0'
kind: function
status: probable
summary: 'Battle-object state step: plays anim 2 for 13 frames, then marks the object for destruction'
interface: (r0 = unused/scratch, r5 = battle object pointer, implicit) -> r0 = clobbered; updates oBattleObject_CurPhase,
  CurAnim, Timer, CurStateActionPhaseAndPhaseInitialized
details: 'This is a per-object update handler reading r5 as a battle object. On entry with CurPhase ==
  0 it initializes: sets CurPhase to 4, sets CurAnim to 2, and loads Timer with 0x0D (13). On subsequent
  calls (CurPhase != 0) it decrements Timer each frame; once the timer reaches 0 it stores CUR_STATE_DESTROY
  into CurStateActionPhaseAndPhaseInitialized, telling the object framework to destroy the object. No
  argument registers are used; behavior is driven entirely by the object''s fields.'
