name: ReadOWPlayerObjectCoords
address: '0x0809E1AE'
kind: function
status: confirmed
summary: Loads the overworld player object's X/Y/Z position into registers and returns a pointer to the object itself.
interface: GetOverworldPlayerObjectPosition(toolkit in r10) -> (out r0 = X, r1 = Y, r2 = Z, r3 = overworld player
  object pointer); lr is the return address
details: 'Follows the toolkit pointer at r10 to the game state (oToolkit_GameStatePtr), then to the current overworld
  player object (oGameState_OverworldPlayerObjectPtr). Reads three 32-bit coordinates from the object: X (oOWPlayerObject_X),
  Y (oOWPlayerObject_Y), and Z (oOWPlayerObject_Z). Returns the coordinates in r0-r2 and the object pointer itself
  in r3, so callers can access the player object without re-traversing the toolkit. No memory is written; the function
  only reads existing game state, so it is safe to call anytime an overworld player object exists. Trivial tail:
  the final mov pc, lr is a bare return with no stack frame.'
