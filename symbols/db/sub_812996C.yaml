name: sub_812996C
address: '0x0812996C'
kind: function
status: confirmed
summary: Walks a 3-slot pointer table in unk_20251A0; if all entries have a clear byte at offset +7, strips the
  high bit from every slot, marks the object state byte to 8, calls sub_812B3CC, and clears bit 0 of the object's
  0x1B status byte.
interface: void sub_812996C(u32 r4 /*preserved table base*/, u32 r5 obj, u32 r10 /*carry in*/) -> r4=r4, r5=obj,
  r6=loop offset (0..0xC)
details: 'Operates on the 3-slot pointer table at unk_20251A0 (three u32s, total 0xC bytes).

  Pass 1: for each slot, masks off bit 31 of the pointer, then reads byte at +7 from

  that pointer; if any is non-zero, returns early with r6 holding the failing slot''s

  byte offset (0, 4, or 8).

  Pass 2: if all three passed, strips bit 31 from each slot''s u32 in place.

  Then writes 8 to obj+3 (a state byte), calls sub_812B3CC(r4=table_base, r5=obj)

  passing the table and object through r4/r5, and clears bit 0 of obj+0x1B.

  r7 is preserved; r10 flows in unused. The flag byte at ptr+7 looks like an

  "in-use"/"valid" sentinel for whatever entities those pointers reference.

  '
