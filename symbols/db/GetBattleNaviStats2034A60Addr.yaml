name: GetBattleNaviStats2034A60Addr
address: '0x080136A0'
kind: function
status: confirmed
summary: Returns the address of the NaviStats record at the given index in the battle-side navi-stats table.
interface: u32 battle_getNaviStatsEntryAddr(u32 index); // r0 = index, returns r0 = base + index * oNaviStats_Size
details: 'Trivial array-indexing helper: multiplies r0 (a record index) by oNaviStats_Size

  (the per-record stride, loaded into r1 via mov, then mul r0, r1), adds the fixed

  base pointer eBattleNaviStats2034A60 from off_80136AC, and returns the result.

  Pure address computation - it reads nothing from the table and writes nothing.

  r1 is clobbered; flags (nzcv) are clobbered as a side effect of the mov/mul/add

  sequence. Thumb, tail-jumps via mov pc, lr.

  '
