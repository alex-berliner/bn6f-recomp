name: battle_resetCollisionState_80101C4
address: '0x080101C4'
kind: function
status: confirmed
summary: Resets a battle object's collision state, zeroing a collision counter and clearing its "in collision" flag
  bit.
interface: void battle_resetCollisionState(void) // r5 = battle object; returns r1/r2 from object_clearFlag; no
  flags guaranteed
details: 'Takes the battle object in r5, loads its CollisionDataPtr (oBattleObject_CollisionDataPtr),

  zeroes the halfword at oCollisionData_Unk_26 of that collision data (likely a timer/counter

  associated with the current collision), then calls object_clearFlag with bit 2 (r0 = 4) on the

  collision data pointer (r1), i.e. it clears the collision-data flag with mask 0x4 — plausibly a

  "currently colliding" or "collision processed" marker. Execution then returns straight to the

  function''s own caller via pop {pc}; the reported r1/r2 outputs are whatever object_clearFlag

  leaves behind, so callers that read r1/r2 are really reading object_clearFlag''s side effects.

  r5 (the object) is used as an implicit this pointer and is preserved by this routine.

  '
