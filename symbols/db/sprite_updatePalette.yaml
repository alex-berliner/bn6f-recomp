name: sprite_updatePalette
address: '0x08117872'
kind: function
status: probable
summary: Computes a sprite palette index (0, or a battle object's byte-3 field minus 1) and stores it
  into the sprite struct.
interface: () -> void; calls sprite_setPalette with the resolved palette index
details: Calls sub_81178AC to get a selector value; if it is nonzero, the value minus 0x90 is used as
  an index into the global battle-object array StructArr_813944C, and byte 3 of that 0x10-byte descriptor
  minus 1 becomes the palette index. If the selector is zero, palette 0 is used. The result is passed
  to sprite_setPalette, which writes it to byte 4 of the object's sprite struct. Called every frame by
  object_updateSpriteAnimState, so the palette is re-applied alongside the animation update.
