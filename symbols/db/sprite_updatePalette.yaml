  date: '2026-10-19'
  detail: 'tst r0,r0 / beq: selector 0 falls through with r0=0, i.e. default palette 0; sub r0,#0x90 +
    bl battleObject_getByIndex_813B780: uses the value as a battle-object index offset by 0x90; ldrb r0,[r0,#3];
    sub r0,#1: palette index taken from descriptor byte 3 minus 1; bl sprite_setPalette: final value is
    stored as the sprite''s palette index; caller object_updateSpriteAnimState invokes it each frame for
