open_questions:
- Why 0x29 (NaviIndex) must be non-zero to reach the Z branch (likely "only real players/navis, not enemies/objects").
- What NaviIndex 5 / Transformation 5/0x11/0x18 mean semantically (BeastOut vs Link/Beast modes) — the
  constants line up with documented Mega/Mega/Giga transformation values, but the table at 0x802136D is
  per-team and not yet identified.
- Why the routine is run while battle_isPaused returns true for the chip portion but not for the Z portion
  (it just falls through).
