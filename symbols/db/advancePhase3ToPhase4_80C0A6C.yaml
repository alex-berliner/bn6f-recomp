name: advancePhase3ToPhase4_80C0A6C
address: '0x080C0A6C'
kind: function
status: confirmed
summary: Drives a battle object's sub-phase transition from phase 3 into phase 4 (plays anim 3 with a
  9-frame countdown, then flips the phase byte to 4).
interface: void sub_80C0A6C(struct BattleObject* r5 /* in */);
details: 'Acts on a battle object passed in r5, using the battle-object struct

  layout (oBattleObject_PhaseInitialized, oBattleObject_CurAnim,

  oBattleObject_Timer, oBattleObject_CurPhaseAndPhaseInitialized).


  On first entry (PhaseInitialized == 0) it seeds the transition: sets

  CurAnim = 3, Timer = 9, and PhaseInitialized = 4 (marking this sub-phase

  as having been entered). On subsequent entries it decrements the

  16-bit Timer (sign-extended via 32-bit math matching `sub r0,#1`/`bgt`);

  once the timer is <= 0 it writes 4 into the combined phase/state field

  oBattleObject_CurPhaseAndPhaseInitialized, moving the object into

  phase 4. Otherwise the function just returns, letting the engine

  call it again next frame to keep counting down.


  The preserved/clobber contract in the form (no other registers listed

  as inputs or preserved, clobbers nz/c/v/r0, lr is pushed) is consistent

  with this being a small per-frame state step run from the object''s

  phase dispatcher.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
