name: enemy_applyVersionChange_81095D0
address: '0x081095D0'
kind: function
status: confirmed
summary: 'Swaps an enemy to a different version (form/tier): recolours the sprite, spawns a transition puff, shifts
  the model name-ID, and reloads HP, damage, and element from the new version''s data table.'
interface: void enemy_applyVersionChange(u32 r5 /* battle object ptr */); // reads+writes AI data, sprite palette,
  effect objects, battle-object name/HP/damage/element, collision data; preserves r4-r7
details: "Reads oAIData_Version_16 (desired version) and oAIData_Version_17 (currently-active version) from the\
  \ AI data block at oBattleObject_AIDataPtr. If they already match the function returns immediately. Otherwise\
  \ it: (1) stores the desired version into Version_17 so the change is recorded; (2) computes a palette index as\
  \ Version_16 * oAIData_VersionVariant and calls\n    sprite_setPalette to recolour the enemy;\n(3) loads three\
  \ consecutive words from battle_obj+0x34/0x38/0x3C (transition-effect\n    position/params), calls spawn_t1_0x0_EffectObject\
  \ with type 0x26, then ORs flag bit 4\n    (invisible / not-drawn) into the spawned effect's oObjectHeader_Flags;\n\
  (4) shifts oBattleObject_NameID by (Version_16 - Version_17) to select the new model\n    entry;\n(5) calls enemy_getStruct2\
  \ with the new NameID and copies:\n    - u16 at struct+4  -> oBattleObject_Damage and oCollisionData_SelfDamage;\n\
  \    - u16 at struct+0: low 12 bits -> oBattleObject_HP and oBattleObject_MaxHP;\n      high 4 bits (bits 12-15)\
  \ -> oBattleObject_Element and\n      oCollisionData_PrimaryElement.\nRegister contract: r5 is the battle-object\
  \ pointer in, r4/r5 are the only outputs the callers read; r6/r7 are pushed/popped around the effect-spawn call\
  \ so they survive clobbering by spawn_t1_0x0_EffectObject. Flags are fully clobbered.\n"
