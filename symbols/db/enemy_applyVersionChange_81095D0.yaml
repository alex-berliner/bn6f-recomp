name: enemy_applyVersionChange_81095D0
address: '0x081095D0'
kind: function
status: probable
summary: 'Applies a pending version/form change to a battle object: swaps its palette, spawns the version-change
  effect, retargets its name ID, and reloads HP, damage and element from the enemy data table.

  '
interface: "void enemy_applyVersionChange_81095D0(BattleObject* obj /* r5 */;\n  r4/r6/r7 preserved; r2\
  \ is returned as obj's collisionDataPtr, or passed\n  through untouched if no change was pending)\n"
details: 'Reads the object''s AIData (obj->AIDataPtr). AIData byte 0x16 holds the new version, byte 0x17
  the currently applied version; if they are equal the function does nothing. Otherwise it stores the
  new version into 0x17 and calls sprite_setPalette with palette = newVersion * AIData byte 0x03 (a per-version
  palette stride). It then loads three words at obj+0x34..0x3C and spawns a kind-0x26 effect object via
  spawn_t1_0x0_EffectObject, ORing flag bit 0x4 into the new effect''s header flags (effect spawning uses
  obj+0x40 as a further argument; the ldmia writeback in the original leaves r0 at obj+0x40). Next it
  shifts the object''s BattleObject.NameID by (newVersion - appliedVersion), so name IDs of the different
  versions are laid out consecutively in the enemy table. With the updated name ID it calls enemy_getStruct2
  to fetch the new version''s entry: halfword +4 is stored into BattleObject.Damage and CollisionData.SelfDamage;
  halfword +0 has the low 12 bits as HP/MaxHP and bits 12-15 as the element, written to BattleObject.HP,
  BattleObject.MaxHP, BattleObject.Element and CollisionData.PrimaryElement. On the early-exit path r2
  is untouched, matching the caller-side contract.

  '
