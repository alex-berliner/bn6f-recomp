name: QueueWordAlignedGFXTransfer
address: '0x08000AC4'
kind: function
status: confirmed
summary: Queues a word-aligned GFX DMA copy into the global GFX transfer ring buffer (handler slot 3, copy_type
  3).
interface: void queueWordAlignedGfxTransfer_8000AC4(u32 src /* r0 */, u32 dest /* r1 */, u32 size /* r2 */, lr /*
  lr */) -> (r3, nz/c/v)
details: 'Pushes a 0x14-byte entry into a GFX DMA queue stored in IWRAM. The queue count lives at 0x200AC1C and
  is

  a monotonically increasing u32 compared *signed* against 0x60 (CMP r4,#0x60 / BGE) — once the count is >= 0x60

  the entry is dropped (queue full). Each entry is laid out as: [src@+0, dest@+4, size@+8, handler@+0xC,

  copy_type@+0x10] and is stored at 0x200B4B0 + count*0x14. The handler word is looked up from a 4-entry table

  at 0x08000AFC indexed by copy_type*4; only slot 3 (the default) is used here and contains 0x84000000

  (the other three entries are 0xFFFFFFFF, presumably dispatched by sibling QueueHwordAlignedGFXTransfer

  copy_type 0/1/2 — see QueueHwordAlignedGFXTransfer at 0x08000AC8, QueueByteAlignedGFXTransfer at

  0x08000ACE, QueueUnk00GFXTransfer at 0x08000AD0, QueueEightWordAlignedGFXTransfer at 0x08000AC8 with

  copy_type 4). Preserves r0–r2; returns r3 (on the full path r3 keeps the 0x200AC1C address; on success

  r3 holds the handler word 0x84000000) and the last flag-setting op is LSL copy_type,#2, which for

  copy_type=3 yields NZCV=0,0,0,0. The thunk at 0x08000AC0 (B loc_8000ACA with r3=#3) and

  0x08000AC8 (mov r3,#4 / QueueEightWordAlignedGFXTransfer) share the same body, just selecting a different

  copy_type; the C version''s adapter-style flag restoration is a decompiler artifact and does not represent

  real GBA semantics.

  '
