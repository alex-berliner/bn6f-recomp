open_questions:
- Who drains the queue and what does handler 0x84000000 correspond to (channel control word, source of 0x84)?
- Are the table entries 0xFFFFFFFF placeholders for unused copy_type slots 0/1/2, or do they encode different DMA
  control words (e.g. halfword/byte) used by QueueHwordAlignedGFXTransfer / QueueByteAlignedGFXTransfer?
- Is the queue count truly intended to saturate (drop on full) or is the missing wrap/uninit path a bug?
