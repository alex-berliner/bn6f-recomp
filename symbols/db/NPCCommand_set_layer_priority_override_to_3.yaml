name: NPCCommand_set_layer_priority_override_to_3
address: '0x0809EF58'
kind: function
status: confirmed
summary: NPC script opcode handler that sets the NPC's layer-priority override to 3 and advances the script cursor.
interface: void NPCCommand_set_layer_priority_override_to_3(void); /* r5=overworld NPC object, r6=script cursor;
  returns r6+1; clobbers nz c v r0 */
details: 'Treats r5 as a pointer to the current overworld NPC object and writes the immediate value 3 into the field
  at offset oOverworldNPCObject_LayerPriorityOverride, forcing that NPC to render at layer priority 3 (front of
  layer 3). r6 holds the byte pointer into the active NPC command stream; it is incremented by 1 to advance past
  this opcode. r0 is used as a scratch register and is not preserved. No other fields are touched and no other side
  effects occur.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
