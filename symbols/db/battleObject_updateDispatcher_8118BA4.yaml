status: probable
summary: Battle object per-frame dispatcher that selects one of three update routines by the object's
  type byte at [r5+8] (BattleObject.CurState).
interface: (r5 = BattleObjectPtr) -> side effects via the called routine; no value returned (void-like;
  r0..r4, r6, lr clobbered transitively, pc popped from stack)
details: "- Reads the global EWRAM pointer sSubmenu via `ldr r6, off_8118BC4` but never actually uses\
  \ r6 before the indirect jump; it exists only as a stray load that\n    sets up r6 for whatever caller-style\
  \ ABI expectation was inherited (often seen as a sentinel \"toolkit\" register held across the call).\n\
  \  - Loads the dispatch table base `off_8118BB8` then indexes by `ldrb r1, [r5,#8]` — offset 0x8 in\
  \ `struct BattleObject` is the `CurState` union\n    (CUR_STATE_INITIALIZE=0, CUR_STATE_UPDATE=4, CUR_STATE_DESTROY=8),\
  \ so the table entry chosen is `table[CurState >> 2]`.\n  - Loads the selected function pointer with\
  \ `ldr r0, [r0,r1]` where `r1 = CurState`, which is then jumped to via `mov lr, pc; bx r0` (ARM/Thumb\n\
  \    interworking, hence the low bit set in each table entry like `+1`).\n  - The three callees are:\
  \ index 0 -> `sub_8118BC8` (initialize handler for CurState=CUR_STATE_INITIALIZE), index 1 -> `battleObject_updateByType_8118C2C`\n\
  \    (update handler for CurState=CUR_STATE_UPDATE), index 2 -> `sub_8118CEC` (destroy handler for CurState=CUR_STATE_DESTROY).\n\
  \  - Returns to the saved LR via `pop {pc}`, preserving r5 (callee-saved) so the caller can keep using\
  \ its BattleObject pointer after the call.\n  - The matching `r0=0x8118ba5` (with Thumb bit) plus `r1=0x48`,\
  \ `r2=0x02021358`, `r3=0x20`, `sp=0x03007dac`, `lr=0x080465e0` snapshot identifies this as\n    part\
  \ of a tight per-object loop indexed at offset 0x48, scanning 0x20 entries — the classic iteration across\
  \ the battle object pool\n    (`oBattleObjectsLinkedListStart` / `oT*BattleObject` indices).\n"
