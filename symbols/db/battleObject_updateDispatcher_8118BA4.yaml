- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r1, [r5,#8]` indexes exactly the `CurState` field of `struct BattleObject` (declared
    at loc=0x8 in BattleObject.inc). - `off_8118BB8` table contains exactly three pointers +1 for Thumb:
    `sub_8118BC8+1`, `battleObject_updateByType_8118C2C+1`, `sub_8118CEC+1`, aligned with the three `CUR_STATE_*`
    values (`0x00`, `0x04`, `0x08`) which become 0/1/2 after `>> 2`. - `mov lr, pc; bx r0` is the canonical
    ARM-Thumb interwork dispatcher pattern; the `+1` Thumb bits in the table entries require it. - All
    40 captured snapshots share the identical entry frame (`r0=0x8118ba5`, `r1=0x48`, `r2=0x02021358`,
    `r3=0x20`, same `sp` and `lr`), consistent with this being invoked from a single loop site that walks
    an array of objects at index stride 0x48 over 0x20 slots. - Naming helpers in the project explicitly
    call `battleObject_updateByType_8118C2C` the "update by type" function, fitting the CUR_STATE_UPDATE
    entry.'
