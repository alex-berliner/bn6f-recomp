status: confirmed
summary: Reads a 32-bit entry (likely a handler/function pointer) from the two-dimensional lookup table at byte_8019C7C
  using a row/column index pair.
interface: u32 object_getTableEntry(u32 column /*r0*/, u32 row /*r1*/); returns the table entry in r0; also leaves
  r1 = byte offset of the entry within the table, r3 = table base, and C/V set as if by ADD r1, r1, r0
details: 'Computes r1 = row*8 + column*4 and loads a word from base byte_8019C7C, i.e. the table

  has 8-byte rows holding two 32-bit entries each (column index 0 or 1). The loaded value

  is returned in r0 without interpretation here. Literal pool references to

  _object_removeCollisionData and sub_300777C in this file suggest the surrounding object

  subsystem stores callable addresses in such tables, so the fetched word is most likely a

  function pointer or handler that the caller dispatches on; byte_8019C7C itself sits in

  the same object-data region just below this routine. Quirk: r1 and r3 are live outputs,

  and the C/V flags leaking from the offset-addition ADD are part of the observable

  contract (c and v are listed as outputs by the lifter).

  '
