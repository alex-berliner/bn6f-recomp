name: battle_findNearestFlaggedPanelAhead
address: '0x080D2D40'
kind: function
status: probable
summary: Scans the panels straight ahead of a battle object for panels whose status flags match an alliance-specific
  mask, returning the one closest to a given reference (column,row).
interface: (r0 = ref column, r1 = ref row, r5 = battle object) -> r2 = column or 0xFF if none, r3 = row;
  flags clobbered
details: Using object_getFrontDirection, it walks columns outward from the object's front panel (sp+0x28
  starts at refColumn+dir and advances by dir) while an inner loop covers rows 1-3, until object_isValidPanel
  fails. For each on-grid panel, object_getPanelParameters' status word is ANDed with a mask from byte_80D2E28
  selected by the object's Alliance field (alliance*8; 0x05800000 for side 0, 0x0A800000 for side 1);
  matching panels are packed into a stack buffer as (row<<4)|column. It then scans the collected list,
  keeping the panel minimizing |row-refRow| first, then |col-refCol|, preferring the lower row on full
  ties. The second table word per alliance is loaded but never used. If no panel matched, r2 = 0xFF.
