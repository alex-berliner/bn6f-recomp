open_questions:
- The real identities of `sub_804C43C` and `sub_804C478` (only their offsets are known); classifying the dispatcher
  more precisely needs those two bodies and confirmation that `byte_804C3F0` is actually an AIData-derived 0x14-byte
  table.
- The exact r5 role (AIData base vs. some other per-actor struct) is inferred from the AIData struct having `Unk_0c`
  (0xc) and a u8 at 0x10 that fits "action selector", but the contract's r5-in is the strongest evidence that r5
  itself is the dispatch key.
