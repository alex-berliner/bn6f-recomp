name: battle_dispatchJumpByActorSlotAndAction_804C404
address: '0x0804C404'
kind: function
status: confirmed
summary: 'Per-actor battle jump/blink dispatcher: reads the actor''s slot and current action, and tail-invokes the
  matching handler from a two-entry action table.

  '
interface: 'void battle_dispatchJumpByActorSlotAndAction_804C404(actorBlock in r5, battleCtx in r10); passes r0=handler
  addr, r1=action byte, r5=actor block, r7=slot record, r10=battle context into the chosen handler; returns the
  handler''s live results (r2, r8-r12) to its own caller; preserves r4-r7, clobbers flags and r0/r1/r3/lr.

  '
details: 'Small dispatcher that keeps r4-r7 alive across an indirect call. It reads the actor block''s slot id at
  +0x0C, multiplies by 0x14 to index the 0x14-byte-per-slot record table byte_804C3F0, and passes that record in
  r7. It then reads the actor''s action byte at +0x10 and indexes off_804C420 by the RAW byte offset (not word index),
  so action values are effectively limited to 0..7; two handlers exist: sub_804C43C and battle_render_setBlurAndAnimUpdate_804C478.
  The call is made with lr=pc / bx so the handler can return either to this function or onward; the push/pop {r4-r7}
  wrapping means the handlers may clobber r4-r7 even though this function must preserve them (it restores saved
  copies). Outputs r2 and r8-r12 are simply whatever the chosen handler leaves live.

  '
