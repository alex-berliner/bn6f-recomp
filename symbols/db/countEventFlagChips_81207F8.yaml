open_questions:
- Exact in-game meaning of categories 0..3 vs 5/6 — which category value corresponds to which chip class (Standard,
  Mega, Giga, Dark, etc.)? The matching against chip byte 7 (element) for categories 0..3 suggests each category
  is an element id (Fire/Aqua/Elec/Wood or similar).
- Why does category 4 (support) reuse the same 0x40 attribute filter as general chips, instead of getting a dedicated
  branch? Likely because support chips all have the 0x40 bit set, so the test is redundant for that category.
- Are the three flag bases (per entry) really three independent flags that all must be clear for the chip to NOT
  qualify? Original branches suggest "any one set" qualifies — semantically these look like "chip obtained / chip
  seen / chip used" style markers, but their identity is unconfirmed.
