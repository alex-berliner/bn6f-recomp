name: sub_80FE240
address: '0x080FE240'
kind: function
status: confirmed
summary: Advance the per-attack AI timer by one frame; initialise the attack, optionally wait a gate-flag-controlled
  delay, then set the trigger field to 4 ('fire now').
interface: void aiAttackTimerTick(BattleObject* r5, AIAttackVars* r7) — reads/writes fields via r5 and r7; no meaningful
  register outputs beyond preserving the pointers (contract lists r1/r5/r10 as outputs but the code only uses them
  as temps or leaves them unchanged).
details: 'Field oAIAttackVars_Unk_01 acts as a per-attack state flag: 0 = uninitialised, 4 = initialised/active.  On
  the first tick the routine sets Unk_01 to 4, zeroes Unk_16 and Unk_17, then queries bit 5 (0x20) of the AI-data
  0x48 gate via GetAIDataUnk0x48Flag.  If the bit is clear the trigger field Unk_00 is written with 4 immediately,
  causing the outer AI loop to fire the attack on the next iteration.  If the bit is set, ClearAIDataUnk0x48Flag
  removes the gate, the battle object''s CurAnim (oBattleObject_CurAnim) is set to 7 (an attack-windup animation),
  sound effect 0xE1 is played, and a 19-frame delay countdown is stored in Unk_10 (word-sized, decremented as a
  signed value).  On subsequent ticks Unk_10 is decremented; once it reaches 0 or below, Unk_00 is set to 4 to trigger
  the attack.  Constants touched: 4 (trigger value and state flag), 7 (CurAnim windup), 0xE1 (sound), 0x20 (gate
  bit), 0x13=19 (initial delay).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
