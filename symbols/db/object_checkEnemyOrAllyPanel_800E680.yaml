name: object_checkEnemyOrAllyPanel_800E680
address: '0x0800E680'
kind: function
status: confirmed
summary: Validates a panel position for a battle object and forwards it to object_checkPanelParameters with the
  panel-kind/attribute pair selected from a small table by the object's alliance and whether its own panel is solid.
interface: u32 object_checkPanelKindByAlliance_800E680(u32 x /*r0*/, u32 y /*r1*/, r5 = battleObject*); returns
  r0 from object_checkPanelParameters (0 immediately if (x,y) is not a valid panel); clobbers r1, r2, r3, NZCV;
  r4 preserved, r6/r7 used as scratch and restored.
details: 'Returns 0 right away if object_isValidPanel fails for the (x, y) the caller passed in r0/r1. Otherwise
  it picks one of four 8-byte entries in the table at byte_800E6C8, indexed as base + (obj->Alliance << 3), where
  base is 0x10 if the object''s flag word has bit 0x10 set (object_getFlag) OR the object''s own panel (obj->PanelX,
  obj->PanelY) reads as non-solid via object_isPanelSolid, and base is 0 otherwise. The chosen entry supplies the
  two arguments object_checkPanelParameters expects in r2 (panel kind) and r3 (attributes): base 0x00 gives {kind
  0x10, attrs 0x07800000} for alliance 0 and {kind 0x10, attrs 0x0B800000} for alliance 1; base 0x10 gives {kind
  0x00, attrs 0x07800000} / {kind 0x00, attrs 0x0B800000}. The attrs pair differs only in bit 0x04000000, which
  evidently encodes enemy vs ally side, so the table swaps "solid-panel check on own side" for "no kind restriction"
  depending on the object''s flag/solidity state. r6/r7 hold the original x/y across the calls and are re-loaded
  into r0/r1 before the tail call into object_checkPanelParameters, whose r0 return value is this function''s result
  (r2/r3 leftovers from that call leak through).

  '
