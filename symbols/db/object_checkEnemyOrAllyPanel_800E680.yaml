open_questions:
- Why the AirShoe path skips the isPanelSolid check (perhaps AirShoe lets the object be treated as standing
  on a solid panel even when its recorded panel is empty/non-solid). Without seeing the call sites that
  interpret the return value in game terms, the semantic label ("ally panel" vs "valid placement panel")
  is a best guess.
