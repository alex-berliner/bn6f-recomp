name: owMapObject_freeThunk
address: '0x080A9568'
kind: function
status: confirmed
summary: Tail-call thunk that frees the overworld map object whose pointer is passed in r5.
interface: void owMapObject_freeThunk(void /* r5 = overworld map object pointer */); returns whatever FreeOverworldMapObject
  leaves in r0-r3 and the nzcv flags; r5 preserved
details: 'A two-instruction wrapper: push {lr}, bl FreeOverworldMapObject, pop {pc}. The object pointer to free
  travels in r5, which the callee preserves, so callers can hand it straight through. All caller-visible outputs
  (r0-r3, nz/c/v) are just the callee''s outputs; lr is only the return channel. Exists presumably as a fixed-address
  entry point so code that needs a "free this map object" callback/trampoline has one stable target instead of calling
  FreeOverworldMapObject directly.

  '
