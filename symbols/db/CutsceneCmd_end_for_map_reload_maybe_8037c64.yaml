name: CutsceneCmd_end_for_map_reload_maybe_8037c64
address: '0x080376C4'
kind: function
status: confirmed
summary: 'Cutscene command wrapper: if event flag 0x1741 is unset, reload the current Navi''s stat boosts, then
  force-end the active cutscene; always returns 0.'
interface: void CutsceneCmd_end_for_map_reload_maybe_8037c64(void) /* clobbers r0,r1,r2,r3,r12,lr; sets N/Z from
  r0=0 */
details: 'Invoked as a cutscene command (likely dispatched by the cutscene/seq interpreter from

  map_script_cutscene.s). It tests event flag 0x1741 via TestEventFlagFromImmediate

  (encoded inline as R0=0x17, R1=0x41 from the movflag pseudo-op) and only when that flag is

  clear does it call reloadCurNaviStatBoosts_813c3ac to refresh the controlled Navi''s stat-boost

  counters/state. Regardless of the flag, it then calls cutscene_forceEndCurrent_8036EFE to

  terminate the running cutscene and pops {pc} with r0=0, so the interpreter sees a successful

  command with N/Z flags reflecting r0==0. The ''maybe'' in the name reflects uncertainty about

  why the Navi-boost reload is gated on a specific event flag (likely ''has the player changed

  Navi / not'' / similar).

  '
