name: submenu_getWork
address: '0x0812D6F8'
kind: function
status: probable
summary: Returns the pointer to the shared work/state struct for the submenu screen cluster at 0x02037780.
interface: () -> r0 = pointer to menu work struct (0x02037780); flags unaffected (returns via mov pc,
  lr)
details: 'A four-instruction thunk whose literal pool holds the constant address unk_2037780, so it always
  returns that same pointer without dereferencing anything. Callers stash the result in r7 and use it
  as the base of a per-screen work structure: submenu_updateCursorAndTiles reads the cursor/menu field
  at +0x34 and passes it to menu_moveCursorUpDown_811FA22, and sub_812D3E4 reads a halfword at +0x2e.
  The other callers use it at the start of screen-setup routines (zeroFillVRAM, palette overlay, chatbox_8040818,
  battle_resetEStructRecords), consistent with this being the state block for a whole menu screen rather
  than a local variable.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sub_812D6F8 body is only `ldr r0, =unk_2037780; mov pc, lr`, returning a constant pointer; submenu_updateCursorAndTiles
    does `bl sub_812D6F8; mov r7, r0` then reads [r7,#0x34] as cursor data for menu_moveCursorUpDown_811FA22;
    sub_812D3E4 reads [r7,#0x2e] from the result before building a tile/GFX block from word_2023FA0/unk_202DFA0;
    sub_812D298 calls it first, then does zeroFillVRAM/ZeroFillGFX/palette overlay/chatbox_8040818 — screen
    init keyed off this work area; five sibling routines in 0x812D298–0x812D5EC all begin with this same
    call, tying the cluster to one shared struct
