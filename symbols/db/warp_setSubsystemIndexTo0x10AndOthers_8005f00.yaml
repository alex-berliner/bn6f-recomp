name: warp_setSubsystemIndexTo0x10AndOthers_8005f00
address: '0x08005F00'
kind: function
status: confirmed
summary: Kicks off the warp sequence by running the pre-warp helper, switching the game state to the warp subsystem
  (0x10), and invoking the subsystem runner.
interface: void warp_enterWarpSubsystem_8005f00(u32 arg0 /*r0, passed through to the pre-warp helper*/, u32 arg1
  /*r1*/, u32 arg2 /*r2*/, Toolkit* toolkit /*r10*/); tail-calls into sub_8035738 with r0 = 0x10 and r4 = GameState*
details: 'Wraps two calls around a one-byte state change. First it calls sub_8005EEC with the

  caller''s r0/r1/r2 untouched - per the readable-C note this is the pre-warp processing

  (fade-out etc.) - then it loads the toolkit from r10 (offset oToolkit_GameStatePtr),

  follows it to the GameState struct, and stores 0x10 as a byte at offset 0

  (oGameState_SubsystemIndex), which selects the warp subsystem. Finally it calls

  sub_8035738, the subsystem runner, with r0 = 0x10 and r4 = GameState so the newly

  selected subsystem executes immediately. r4-r7 are pushed/popped so the caller''s

  copies survive; r3 and flags are clobbered by the callees. The register contract

  lists r4-r7 as outputs as well, reflecting the tail-call chain''s effects, but this

  function itself restores them before returning.

  '
