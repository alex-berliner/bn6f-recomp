name: ai_setHitElementIfScratchClear
address: '0x080F8962'
kind: function
status: probable
summary: 'AI attack setup: sets the attack''s hit element to 0x18 only when a scratch variable still holds
  0'
interface: (no args; r7 = AI attack vars struct) -> no return; r0 clobbered
details: Loads the pointer at oAIAttackVars_ScratchVar from the r7 struct, dereferences it, and tests
  it. If the value is nonzero the function returns without changing anything; if it is zero it stores
  the halfword 0x18 into oAIAttackVars_HitElement, a likely element/attribute constant in the AI attack
  variables struct. It is a guarded setter, so the element value is only applied when the scratch variable
  hasn't been set to something else.
