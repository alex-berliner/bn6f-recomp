name: sub_811F6E0
address: '0x0811F6E0'
kind: function
status: confirmed
summary: Opens the PET submenu by zeroing its 0x80-byte buffer, writing default entries, and stashing the current
  map group for later restoration.
interface: 'void sub_811F6E0(void);  // inputs: r10 (toolkit pointer), lr (return); outputs: r4, r5 (preserved);
  clobbers: nz,c,v, r0, r1, lr; preserved: r2, r3'
details: 'Reads the PET submenu buffer pointer from the toolkit struct at oToolkit_SubmenuPtr,

  then ZeroFillByWord()s 0x80 (128) bytes of it. Loads the PET menu data asset from

  off_811F704 (ePETMenuData) into r5 (callers use this through R5 as the data ptr).

  Seeds the freshly-zeroed buffer with two default fields: byte[0] = 0x10 (entry id

  0x10, option index 1), byte[0xD] = 1. Then snapshots the live

  oGameState_MapGroup into oGameState_LastMapGroup so the submenu (or its close

  code) can return the player to the same map group when dismissed. Pure initializer

  of the PET submenu state struct; no rendering or input handling here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
