name: sprite_setPositionByStructIndex_811BDFC
address: '0x0811BDFC'
kind: function
status: confirmed
summary: Looks up a live entry by index in the struct table at 0x2008450 and, if found, sets that sprite's coordinates
  to the given (x, y).
interface: void sprite_setPositionByStructIndex(int x /*r0*/, int y /*r1*/, int structIndex /*r2*/); clobbers r0-r2,lr
  and flags; preserves r4-r7 (r5 is borrowed for the callee but restored)
details: 'Thin wrapper over two existing routines. The x/y arguments and the struct-table index are

  spilled to a small stack frame, then getStructFrom2008450 is called with the index; it

  returns success in r0 and the entry pointer in r1. If there is no live entry for the index

  (r0 == 0) the function does nothing and just returns. Otherwise the entry pointer is placed

  in r5 and sprite_setCoordinates is called with the saved x in r0 and y in r1, so the entry

  carries the sprite object whose position fields are updated. The 0x2008450 table is the

  shared registry of live game objects/sprites (entities, NPCs, battle sprites, etc.).

  Quirk: r5 is used as the argument register for sprite_setCoordinates even though it is a

  callee-saved register in this function''s own contract, so the original value is saved and

  restored around the call via the push/pop of r4-r7.

  '
