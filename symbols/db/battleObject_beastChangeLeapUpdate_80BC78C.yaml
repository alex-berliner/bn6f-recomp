open_questions:
- The exact value stored at oBattleObject+0x62 and the precise meaning of ExtraVars[0x4..0x14] are not
  named in the struct (they sit inside the t1 ExtraVars region). Knowing what initialized them in the
  spawn-time constructor would confirm "hop steps remaining" vs "arc duration". Tracing the caller at
  0x080bc65c would settle it.
