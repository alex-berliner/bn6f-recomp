name: battle_highlightTargetColumns
address: '0x080FE72C'
kind: function
status: probable
summary: 'AI action handler: for rows 1..3, finds the closest matching panel via getClosestPanelMatchingRowFiltered,
  checks panel parameters (must-have 0x10, must-not 0x0B80/0x0780), and highlights a 6-panel column region
  for each valid hit. Dispatched from the boss action jump table at off_80FE890.'
interface: no args in registers; r5 = battle object (caller-set, not saved) -> r0 = last checkPanelParameters
  result; clobbers r0-r3; flags from final tst
details: Loops a counter 1..3, calling object_getClosestPanelMatchingRowFiltered(alliance, counter) with
  per-side filter words from byte_80FE780[alliance*8] (alliance 0 = {0,0}, alliance 1 = {0x20,0x20}).
  For each found (row,col) in r0/r1 it calls object_checkPanelParameters with per-side masks from byte_80FE794[alliance*8]
  (must-have 0x10, must-not-have 0x0B80 for player side / 0x0780 for enemy side), and if the panel passes
  calls object_highlightPanelRegion(row, col, 6, allianceAndDirectionFlip), the height 6 marking a whole
  column. The loop does not break early, so up to three columns can be highlighted. It is part of a boss/object
  action table (off_80FE890 jump table of battle action handlers), so this is an attack-telegraph/tell
  routine rather than movement logic.
