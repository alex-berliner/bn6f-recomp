name: object_chipNameDisplayUpdate
address: '0x080E7C1C'
kind: function
status: probable
summary: State-machine update for a battle object that dims the screen, shows a chip name, waits, then
  restores the screen.
interface: (r5 = battle object, r0 unused on entry) -> dispatches to handler for [r5,#oBattleObject_CurAction];
  no r0 return
details: Reads the object's current action (oBattleObject_CurAction from r5) and tail-jumps through a
  4-entry dispatch table at off_80E7C30 using the computed-call trick (mov lr, pc; bx r1). State 0 calls
  object_dimScreen (darken the battle screen), state 1 calls object_drawChipName, state 2 runs sub_80E7C40
  (likely a delay/wait state), and state 3 calls object_undimScreen. The sequence dim -> draw name ->
  pause -> undim matches a short cinematic overlay, e.g. announcing a special/dark chip in battle.
