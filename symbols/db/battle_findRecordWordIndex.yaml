name: battle_findRecordWordIndex
address: '0x080E5BDE'
kind: function
status: probable
summary: Scans the first three words of the current battle object's Param2 table record for a value and
  returns its index (or 3 if absent).
interface: (r0 = unused, r5 = value to find) -> r0 = index 0-2 of first matching word in the record, or
  3 if no match; flags from final cmp
details: Calls battle_getParam2RecordPtr to obtain in r6 the address of the 12-byte record selected by
  the current battle object's Param2. It then linearly compares r5 against the record's words at offsets
  0, 4, and 8, incrementing r0 per word, and falls out with r0=3 when none match. The early `beq` exits
  immediately with the current index, so on match r0 equals the slot number. r0 is also passed as 0 to
  the callee initially (likely ignored or a dummy argument). No known callers, so the game-level meaning
  of the three slots and of r5 is unconfirmed.
