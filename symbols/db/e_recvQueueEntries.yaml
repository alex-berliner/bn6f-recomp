name: e_recvQueueEntries
address: '0x0812B97C'
kind: function
status: probable
summary: 'State-machine step that dispatches via sub_803EAE4 (mode 4 -> sub_812C24C, mode 1 -> exit),
  sets state r5+0x10=6, calls sub_812C0CC on bit 0x10, then drains a queue entry via get_eLinkStateUnk38/sub_81323B0:
  on a tag match (halfword at entry+2 == 0x8888 + r5+0x2e) CopyWords moves 8 words into unk_2033C00 +
  r5+0x3c, advances the cursor, and calls sub_812C160; when the cursor reaches r5+0x34 it sets r5+0x2=8.'
interface: (r0-r3 unused; r5 = global transfer-state struct) -> r0 clobbered; writes state byte r5+0x10=6,
  cursor r5+0x3c, completion byte r5+0x2=8, buffer unk_2033C00
details: 'First dispatches via sub_803EAE4 on the eStruct200BC30 mode byte: mode 4 goes to sub_812C24C,
  mode 1 exits, otherwise it stores 6 into the state byte at r5+0x10 and tests state bits 0x10/8 (bit
  0x10 calls sub_812C0CC, bit 8 aborts). It then fetches eLinkState+0x38 via get_eLinkStateUnk38, passes
  it to sub_81323B0, and exits if the result is -1 (no pending data). Otherwise sub_803DD60 validates
  the entry; on failure the entry pointer is advanced by 0x10. A valid entry is identified by the halfword
  at entry+2 equaling 0x8888 + [r5+0x2e], after which CopyWords copies 8 words from entry+4 into unk_2033C00
  + [r5+0x3c] and advances the write cursor by 8 words; sub_812C160 is called after each copy. When the
  cursor [r5+0x3c] reaches [r5+0x34] (expected total), the completion byte r5+0x2 is set to 8. Entry header
  is 4 bytes (halfword tag at +2), payload 32 bytes, so entries are 0x14 bytes in a queue.'
