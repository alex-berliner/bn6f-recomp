name: ai_initGregarAttackVars
address: '0x08103FB4'
kind: function
status: probable
summary: Initializes the AI attack variable block (difficulty tier, duration, callback, target) and launches
  attack 0x0B for the Gregar enemy AI.
interface: (r0 = battle object r7 implied) -> r0 = destroyed; writes oAIAttackVars fields and starts attack
  0xB
details: Reads the enemy's AI data difficulty via battle_getAiDifficultyTier and stores it in oAIAttackVars_AiDifficultyTier,
  sets InitFlag=3 to mark the attack step initialized, and calls sub_810407E with 2 (likely panel/row
  selection mode). sub_8103EAC returns the attack duration, stored in AttackDuration with TimerOrCycles
  and AttackBoost2 cleared from its r1. It queues sub_8104EF8+1 as PanelChooseCallback, resolves the opposite-alliance
  player object via battle_findPlayer (alliance bit inverted) into TargetObjectPtr, and finally invokes
  object_setAttack0 with id 0xB to begin the attack.
