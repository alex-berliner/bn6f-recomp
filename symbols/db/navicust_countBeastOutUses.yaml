name: navicust_countBeastOutUses
address: '0x08137618'
kind: function
status: probable
summary: Counts Beast Out uses in a NaviCust state struct and sets story flag EVENT_EF (returning 1) once
  the count passes a threshold while a condition holds.
interface: (r0 = task state struct in r5, no args used) -> r0 = 1 if flag EVENT_EF was set this call,
  else 0; counter byte at [r5+3] incremented and clamped to 0x4F
details: Reads the counter byte at [r5+3], increments it, then calls sub_8137648(2, 8) whose boolean result
  gates the threshold check. If the gate is true and count >= 0x20, or if the count exceeds 0x4F, it sets
  the one-time story flag EVENT_EF, saturates the counter at 0x4F, and returns 1; otherwise it just stores
  the incremented count and returns 0. The callers use the return value to decide whether to queue MegaMan's
  Beast Out dialog and advance the menu/task state. The 0x4F clamp plus the flag-once semantics mean the
  trigger fires at most once. The gate sub_8137648's meaning (likely a Beast Out / NaviCust state check
  via args 2 and 8) is not visible here.
