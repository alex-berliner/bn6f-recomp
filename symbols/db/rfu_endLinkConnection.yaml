name: rfu_endLinkConnection
address: '0x0803CA90'
kind: function
status: probable
summary: 'Tears down the wireless link: resets the connection work struct at 0x200AF80 and, unless a status
  byte says otherwise, marks the RFU session as ended and sets RFU flag 8.'
interface: (r0 = none, uses connection struct pointer byte_200AF80) -> r0 = clobbered; updates RFU shared
  state at 0x200BC50
details: The function first calls sub_8146C20 with the connection struct at 0x200AF80, then reads its
  status byte at +0x2. If that byte is nonzero it returns immediately without doing anything; otherwise
  it calls rfu_setStateEnded, which records state 9 in the wireless work struct and invokes the lower
  RFU state routine, then ORs bit 8 into the RFU flags word at 0x200BC50+0xC. Its only caller, sub_803CA64,
  zeroes a 16-byte buffer, stores the struct pointer and a type byte 4 into the shared table at 0x200AF80,
  calls sub_8146D20 as a condition test, and calls this on the success path. This pattern fits a conditional
  finalization/cleanup of a wireless connection established through that struct.
