name: init_cutsceneSceneState
address: '0x081312FC'
kind: function
status: probable
summary: 'Scene-state init: wipes VRAM/palette/tile buffers, resets battle scene records, starts a fade
  and chatbox script 0x68, and marks the event state advanced.'
interface: (r5 = event/scene state struct pointer; r10 = toolkit) -> void; sets bit 0x20 of byte at [r5+0x1B]
details: Calls zeroFillVRAM, zeroes the IWRAM palette buffer 0x3001960 and the 0x2000-byte BG tile buffer,
  and applies overlay palette 0x10. It resets the battle-overlay eStruct record array (battle_resetEStructRecords_8046664)
  and chatbox_8040818, then writes 0x1F40 to the toolkit render-info halfword at offset 0 and clears offsets
  0x10-0x1A. A byte saved from [r7+0xC] is preserved only if [r5+2] is nonzero while a 0x80-byte block
  at r7+0xC is zero-filled. It packs an animation-table lookup (dword_8129180 table) into [r7+0x12], sets
  a screen fade (8, 0x10), runs text script index 0x68 from eTextScript201BA20 via the chatbox, and ORs
  0x20 into the state byte [r5+0x1B] to signal the state has been started/advanced.
