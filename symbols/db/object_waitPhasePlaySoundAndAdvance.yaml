name: object_waitPhasePlaySoundAndAdvance
address: '0x080BE144'
kind: function
status: probable
summary: 'Battle-object phase handler: plays SFX 0x94 and runs animation 1 for 60 frames, then advances
  the object to its next action.'
interface: (r5 = battle object ptr) -> mutates oBattleObject_Timer, oBattleObject_CurAnim, oBattleObject_PhaseInitialized;
  on timer expiry advances oBattleObject_CurAction by 4 and clears CurPhaseAndPhaseInitialized; no return
  value
details: On first entry (oBattleObject_PhaseInitialized == 0) it plays sound effect 0x94 via PlaySoundEffect,
  stores 0x3C (60 frames) into oBattleObject_Timer, sets oBattleObject_CurAnim to 1, and writes 4 to oBattleObject_PhaseInitialized
  to mark the phase as started. On subsequent calls it decrements oBattleObject_Timer and returns while
  it is still positive. When the timer reaches zero it adds 4 to oBattleObject_CurAction and clears oBattleObject_CurPhaseAndPhaseInitialized
  (both phase and initialized byte), handing control back to the object's action state machine. It is
  a self-contained 'delay then move to next action' step; the +4 action stride suggests actions are 4-byte/4-step
  records in the object's script.
