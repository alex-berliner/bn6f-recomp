name: battle_dispatchObjectActionUpdate
address: '0x080BF2D0'
kind: function
status: probable
summary: 'State-update dispatcher for a battle object: jumps to the handler for the object''s current
  action.'
interface: (r5 = battle object, r0 unused) -> void; returns via handler, pop {pc}
details: 'Reads oBattleObject_CurAction from the battle object in r5 and uses it to index the jump table
  at off_80BF2E4 (six handlers: sub_80BF2FC..sub_80BF56A), calling the selected handler with lr set so
  it returns here. It takes no arguments; like its caller it operates on the battle object held in the
  global r5 register. The caller sets the object''s state phase to CUR_STATE_UPDATE and then invokes this,
  so it is the per-frame update entry for the object''s current action. The dispatch table is per-function
  data (off_80BF2E4), and the handlers themselves are undocumented.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80BF2D0: ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; mov lr,pc; bx r1 — action-indexed
    jump table dispatch; off_80BF2E4 holds six code pointers (sub_80BF2FC..sub_80BF56A) indexed by CurAction;
    caller sub_80BF284 stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    immediately before calling it; caller and callee both operate on the battle object via the r5 register,
    not parameters'
