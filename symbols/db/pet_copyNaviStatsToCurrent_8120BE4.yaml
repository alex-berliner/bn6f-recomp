name: pet_copyNaviStatsToCurrent_8120BE4
address: '0x08120BE4'
kind: function
status: confirmed
summary: Copies five PET navi stat bytes (offsets 0x09, 0x2D-0x30) from the default PET slot 0 to the
  currently active navi slot.
interface: void pet_copyNaviStatsToCurrent_8120BE4(void) /* r10, lr in; r2, r3 out (artifacts of last
  callee); clobbers r0,r1,flags,lr; preserves r6,r7 */
details: 'Allocates 20 bytes of stack (five u32 slots). Reads five stat bytes from PET slot 0 via GetCurPETNaviStatsByte
  at offsets 0x09, 0x2D, 0x2E, 0x2F, 0x30 and saves them to the stack. Calls GetCurPETNavi to obtain the
  target navi slot (stored in r6). Then writes each saved byte back via SetCurPETNaviStatsByte at the
  same five offsets into the target slot. The five offsets likely correspond to specific navi attributes
  (e.g. 0x09 may be a power level or element affinity; 0x2D-0x30 may be a block of related sub-stat bytes),
  but their exact meaning is not documented here. Outputs r2/r3 are leftover values from the final SetCurPETNaviStatsByte
  call and carry no meaning to callers.

  '
