name: sub_8046E48
address: '0x08046E48'
kind: function
status: confirmed
summary: Overworld dialogue-end handler that applies a counter update and unlocks the player when the screen isn't
  fading and the counter validates.
interface: u32 sub_8046E48(u32 dialogue_ptr /* r5 */) -> r0 (0/1 in nz)
details: 'Reads r5 as a pointer to a dialogue/state struct. Calls an init/setup routine (sub_8047134), then bails
  out with 0 if IsScreenFadeActive is true or if checkScrambledCounter_8047366 fails on the counter at [r5+0x28].
  Otherwise reads a sub-state word at [[r5+0x1C]]: when it equals 1 it calls sub_803D0B4 with r0=r1=counter, else
  it calls sub_803D02C. Finally it runs owPlayer_unlockPlayerAfterNonNPCDialogue_809E122 and sub_8005F84, then returns
  1; the fade-active / scramble-fail path returns 0 with no follow-up calls. Preserves r4-r7; clobbers r0-r3, r8,
  r9, r12, lr and NZCV.

  '
