name: t3_0xd3_80DFE40
address: '0x080DFE40'
kind: function
status: confirmed
summary: 'Per-frame update for a battle object: dispatches to one of three state handlers based on the object''s
  state byte, then refreshes its sprite.'
interface: void battle_objectUpdateByStateTable_80DFE40(struct BattleObject* obj /* r5 */)
details: "Small battle-object ticker whose caller passes the object pointer in r5 (not r0).\nIt reads the object's\
  \ CurState byte at r5+oBattleObject_CurState (offset 8) and uses it\ndirectly as a byte offset into a three-entry\
  \ handler table (off_80DFE58) — states are\nstored pre-multiplied by 4 (0/4/8), so no shift is done before indexing.\n\
  \  state 0 (offset 0) -> sub_80DFE64  (alive/normal behaviour)\n  state 4 (offset 4) -> sub_80DFEA8  (second phase/alternate\
  \ behaviour)\n  state 8 (offset 8) -> object_genericDestroy\nEach handler is entered via a long-blip trick: lr\
  \ is set to pc (so lr holds the address of\nthe bx-mode dispatch site +4 within ARM/Thumb interplay) and the table\
  \ entry is a\nThumb pointer (entry+1) invoked with bx r1, making the handler return straight back into\nthis function\
  \ right before the object_updateSprite call.\nOn entry to a handler, r0 holds the raw state byte and r1 holds\
  \ the handler's own table\nentry (handler address +1) — an artifact of the dispatch sequence that the handlers\
  \ may\nor may not use.\nAfter the handler returns, object_updateSprite is called (presumably with r5 still the\n\
  object) to sync the object's sprite with its state, then the function returns via\npop {pc}. r0/r1 on exit are\
  \ whatever object_updateSprite leaves; flags are scratch.\nOnly the state byte and the shared per-frame update\
  \ are hardcoded here; the three\nbehaviours themselves live in the separate handler functions.\n"
