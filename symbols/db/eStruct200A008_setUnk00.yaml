name: eStruct200A008_setUnk00
address: '0x0800B6B6'
kind: function
status: confirmed
summary: Sets a single byte field (SpriteData_Size) at the start of the eOWPlayer object struct to the value in
  r0.
interface: void eOWPlayer_setSpriteDataSize(u8 size /* r0 */)
details: 'One-instruction setter: writes the low byte of r0 into the byte at eOWPlayerObject_SpriteData_Size, which
  is the first field (offset 0) of the overworld player object structure pointed to by the fixed pointer eOWPlayerObjectEnd.
  No other registers, memory, or flags are touched; it simply returns with mov pc, lr. Likely used to configure
  the player''s sprite/tile footprint size before or during overworld sprite setup.

  '
