name: battle_IsNoCustomPlusActive_80107C0
address: '0x080107C0'
kind: function
status: confirmed
summary: Tests the battle-effects bitmask's bit 3 and returns 3 when that flag is set (Custom+ disabled), otherwise
  0.
interface: int battle_IsNoCustomPlusActive(void) // r10 in (ignored by body), r3 out = 3 if effect bit set else
  0
details: Pushes lr, calls GetBattleEffects to fetch the current battle-effects bitmask, masks it with 8 (bit 3),
  and returns 3 in r3 when the bit is set or 0 in r3 otherwise. No memory is touched; the function is a pure two-outcome
  predicate on the effects byte. r10 appears in the register contract from callers but is never read by the code
  itself. The comment on the verified C identifies bit 3 as the "no Custom+" style flag, so the return value 3 is
  presumably consumed by a caller as an effect-state/index selector rather than a boolean.
