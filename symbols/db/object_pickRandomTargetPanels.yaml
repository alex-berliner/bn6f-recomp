  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code agrees with the broad structure: it reads Param2, picks a count from byte_80C7B50, uses
    object_getPanelsExceptCurrentFiltered with Alliance-keyed bitmasks, shuffles/copies panel indices
    into object+0x60, increments the counter at object+0x79, and writes r7 to object+0x74+Param3. However,
    the Param2==1 branch only copies one panel (r7=1, no shuffle, no loop), and uses byte_80C7B78 not
    byte_80C7B64. The default branch (Param2 !=1, !=3) hits r4=8 -> byte_80C7B50 indices 8..15 (2-4 panels),
    not 2-4 as in the summary; 3 uses 0..7 (1-3). The naming should reflect it''s a per-Param3 target-list
    builder rather than ''pickRandom'' specifically.; run wf investigate investigate-20261018-182231;
