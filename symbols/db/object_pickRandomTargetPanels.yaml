name: object_pickRandomTargetPanels
address: '0x080C7A94'
kind: function
status: probable
summary: Battle helper that gathers alliance-filtered panels (excluding self), then appends 1–4 randomly
  chosen panel indices to the object's Param3-indexed target list at object+0x60, storing the count at
  object+0x74+Param3.
interface: (r5 = battle object; Param2 = mode, Param3 = slot) -> writes panel list at object+0x60, list
  length at object+0x79, count at object+0x74+Param3; no r0 return
details: 'Param2 selects behavior: 1 = pick exactly one random panel, 3 = use the low half of byte_80C7B50
  (1–3 panels), anything else uses the high half (2–4 panels) with count = table[(RNG&7)+base]. object_getPanelsExceptCurrentFiltered
  is called with two bitmask words read from a per-Alliance table (byte_80C7B64 for modes 0/3, byte_80C7B78
  for mode 1), so the panel type filter differs by mode and by whether the object is player/allied or
  enemy side. Matching panel indices are stored on the stack, shuffled with the primary RNG, then appended
  one by one to the array at object+0x60 using the running counter at object+0x79; the final count is
  stored at object+0x74+Param3, implying multiple named target lists per object. If no panels match the
  filter, nothing is queued and nothing is written. This is the classic random-panel-target setup used
  by enemies/bosses that crack, judge, or strike scattered panels.'
evidence:
