    indexed by (RNG&7)+base where base is 0 for Param2==3 else 8; loop stores each shuffled panel id into
    [obj+0x60 + [obj+0x79]] and increments obj+0x79 — appending to a target queue; final count stored
    to obj+0x74+Param3; Param2==1 path picks exactly one entry via svc 6 (modulo) after shuffle; callees
