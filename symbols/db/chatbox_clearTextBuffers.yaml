name: chatbox_clearTextBuffers
address: '0x0803C558'
kind: function
status: probable
summary: Clears the two 16-byte text-related buffers of the current chatbox/dialog struct and calls a
  companion chatbox routine, used when a dialog is dismissed before starting a jack-in sequence.
interface: () -> void; no args passed — relies on the caller's r5 (dialog/struct pointer) which flows
  through untouched to clearStructBufferPair; r4-r7 preserved
details: 'The body is just two calls: clearStructBufferPair, which zeroes the 16-byte fields at struct+0x130
  and struct+0x150 of the struct the caller holds in r5 (sub_803C558 never touches r5, so it passes the
  caller''s pointer straight through), and sub_81467A0, a far-ROM routine taking no arguments. Both call
  sites are nearly identical overworld/dialog state machines: after chatbox_mask_eFlags2009F38(8) confirms
  a chatbox-related flag and sub_803BB94 returns nonzero, they call this, then sub_803BB90(0x1E) (sets
  a 30-frame wait), ow_checkJackInFlag, sub_803BB2C(0xB) (likely a sound/id setter), and advance the state
  byte at [r5,#1] to 0x20. This placement fits wiping the dialog''s text buffers when a message window
  closes. The buffers'' exact contents and sub_81467A0''s behavior are not visible from this call sites.'
