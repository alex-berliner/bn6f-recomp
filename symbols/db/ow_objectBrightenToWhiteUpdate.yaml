name: ow_objectBrightenToWhiteUpdate
address: '0x080A796C'
kind: function
status: probable
summary: Overworld object update handler that fades the object's sprite color from dark gray to white
  over ~30 frames and then frees the object.
interface: (r5 = overworld object ptr; no args) -> void; updates object fields 0x14 and 0x24
details: This looks like a per-frame update callback for a temporary overworld effect object. It reads
  the object's frame counter at [r5+0x24] and uses counter>>1 as an index into two 16-byte tables. The
  first table (byte_80A79B0) yields an amount added to [r5+0x14] each frame (4,4,4,3,2,1, then 0 — a decaying
  accumulator, likely a rising/offset or blend coordinate). The second table (byte_80A79C4) yields a gray
  level b, which is expanded to b | b<<5 | b<<10 — the same 5-bit value in all three RGB channels — and
  passed to sprite_setColorShader, so the sprite is tinted a uniform gray that brightens from 4 toward
  31 (white). When the first table yields 0xFF (index 15, i.e. frame 30), the object is released via FreeOverworldMapObject
  instead. sprite_update is called every frame regardless. The pattern is the classic 'dissolve into light
  / burn away' vanish effect.
