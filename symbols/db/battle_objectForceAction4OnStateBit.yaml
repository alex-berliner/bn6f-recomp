name: battle_objectForceAction4OnStateBit
address: '0x080DA8EC'
kind: function
status: probable
summary: When battle state Unk_5c bit 2 is set, clears the object's flag bit 2 and forces its action to
  4 with a fresh phase.
interface: (r0 = unused, r5 = battle object header) -> r0 = clobbered; flags set by lsr/bcc test of state
  Unk_5c bit 2
details: 'Reads battle state field Unk_5c via the known getter and tests bit 2 (lsr #2 + bcc); if clear
  it returns without touching anything. When the bit is set, it clears bit 2 (mask 4) of the object header''s
  Flags byte at [r5,#oObjectHeader_Flags], stores 4 into oBattleObject_CurAction, and zero-writes oBattleObject_CurPhaseAndPhaseInitialized
  to restart the phase state. This looks like an object-level AI/state handler that forces the object
  into action 4 (an idle/finished-style action) while a global battle-state condition holds, resetting
  its phase bookkeeping so the action runs from step 0. Uses r5 as the object pointer rather than a passed
  argument, so it is likely called as part of an object routine table. No callers are captured, so the
  exact trigger for the Unk_5c bit is unknown.'
