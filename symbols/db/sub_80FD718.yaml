name: sub_80FD718
address: '0x080FD718'
kind: function
status: confirmed
summary: Dispatches the current AI attack-script step (indexed by `AIAttackVars+0x00`) to one of seven thumb handlers.
interface: 'void aiAttackStepDispatch(void); // sets r0 from r7->field_0x00 and tail-calls handler from off_80FD72C[step]

  // register-form: caller passes r3, r5, r6, r10; handler runs with that and r1=table entry; clobbers r0,r2,r3,r4,r5,r6,r8-r12,lr
  and nzcv; r7 restored from stack; nothing returned to caller beyond caller-provided regs

  '
details: 'Pushes {r7,lr}, reads a byte at oAIAttackVars_Unk_00 of the caller''s `AIAttackVars` struct

  (r7 points to it). Loads the corresponding word from the 7-entry table at off_80FD72C

  (entries are `+1` so they target Thumb handlers sub_80FD748, sub_80FD7A8, sub_80FD7D4,

  sub_80FD7F2, sub_80FD822, sub_80FD852, sub_80FD8B0) and tail-calls it via `mov lr,pc; bx r1`.

  Pops {r7,pc} on return, so the saved r7 (the AIAttackVars pointer) is also the restored PC

  of the caller — i.e. the convention is to return by re-entering this trampoline, since

  r7 of the caller is preserved across the handler. All other registers are passthrough to

  and from the handler. Pure dispatcher: no logic of its own.

  '
