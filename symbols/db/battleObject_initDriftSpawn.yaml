  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The drift direction is set by object_getFrontDirection (alliance-based), so ''DriftEnemy'' suggests
    a generic wandering enemy but this is specifically a front-aligned (player or enemy side) drifting
    object spawned from a template (object ptr via r5). The code matches the summary''s mechanics: Param1
    selects speed from byte_80CC65C, sprite 0x100040f is loaded, fallback spawns effect 0x14 and frees.
    However the proposal''s ''abs(random % 0x500000) (unused locally)'' is wrong — svc 6 is the random
    intrinsic returning r0, and the result is stored into ExtraVars+8, not derived from the prior random
    call; the +0x500000 constant only seeds/limits the first svc 6 call and that value is never stored.
    Also ExtraVars+0xc stores the panel''s Y coordinate, used as a lane reference for later drift, consistent
    with summary.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
