name: battleObject_initDriftSpawn
address: '0x080CC5C8'
kind: function
status: probable
summary: 'Initializes a drifting battle object (drift hazard/projectile): loads sprite 0x100040f, picks
  speed from a Param1-indexed table, sets front-direction XVelocity, stores random seed in ExtraVars+8
  and panel-Y lane in ExtraVars+0xc, configures collision (effect 2, status 0x60), sets CurState to update
  and dispatches to sub_80CC668.'
interface: (r0 = object ptr (this, in r5 convention)) -> r0 = destroyed; sets XVelocity, Timer2, ExtraVars+8/+0xc,
  CurState = CUR_STATE_UPDATE
details: Sets the object's screen coords from its panel and aborts (spawn effect kind 0x14 using data
  at r5+0x34 with +0x100000 added, then object_freeMemory) if the panel is invalid or sprite 0x100040f
  fails to load via battleObject_initSpriteAndCollision. On success it sets oObjectHeader_Flags bit 2,
  sets the sprite palette from oBattleObject_Param1, and writes XVelocity = object_getFrontDirection *
  speedTable[Param1] with speedTable = {0x18000, 0x24000, 0x30000} at byte_80CC65C — Param1 thus selects
  one of three variants. It stores abs(random % 0x500000) (unused locally) and random % 0x10000 into oBattleObject_ExtraVars+8,
  sets oBattleObject_Timer2 = 0x8000, and stores the panel's pixel Y (object_getCoordinatesForPanels)
  into ExtraVars+0xc as a lane reference. It configures collision hit effect 2 and status effect 0x60,
  refreshes collision via object_presentCollisionData, sets CurState to CUR_STATE_UPDATE, and tail-calls
  sub_80CC668 as the next state's handler.
