name: battle_swoopAcrossFieldUpdate
address: '0x080CEBBE'
kind: function
status: probable
summary: Per-frame battle-object action handler that launches an enemy on a 20-frame diagonal flight across
  the field by displacing it to its side's edge and applying fixed X/Z velocities, then hands control
  back to action 8.
interface: (r0 = ? discarded; r5 = battle object) -> void; sets oBattleObject fields only
details: Runs on r5, a battle object. On phase 0 it sets CurPhase=4 and CurAnim=0x1f, teleports the object
  to X = getFrontDirection()*0x260000 (its own side's edge) with Z=0x540000, gives it XVelocity = dir*0x60000
  and ZVelocity = 0x60000, and sets Timer=0x14. On later frames it integrates X/Y by the velocities, calls
  object_setPanelsFromCoordinates to keep PanelX/PanelY in sync with world position, and decrements Timer;
  when it hits zero it sets CurAction=8 and clears CurPhaseAndPhaseInitialized, handing control back to
  the normal action dispatch. Fixed-point coordinates suggest a flying/swooping enemy maneuver rather
  than a grounded move.
