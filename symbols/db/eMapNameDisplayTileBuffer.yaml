name: eMapNameDisplayTileBuffer
address: '0x0200C0E0'
kind: data
status: probable
summary: 'Proposed name: eMapNameDisplayTileBuffer. EWRAM tile-gfx scratch buffer (192 bytes) that updateMapNameDisplay
  feeds into renderTextGfx and then sprite_repackAndQueueTiles to draw the current map''s name into BG
  VRAM. (u8)'
details: Lives in EWRAM, 192 bytes long. updateMapNameDisplay_811F014 loads its address from the local
  literal pool at off_811F044 and passes it as the destination tile buffer to renderTextGfx_8045F8C (rendering
  map-name string 0xf1, width 7) and again to sprite_repackAndQueueTiles_811F5DC, which repacks 4bpp tiles
  for DMA into BG VRAM at 0x6015240. The buffer is purely a temporary render target; nothing else in the
  project's known code reads it, and it is rewritten each time the map-name display refreshes.
