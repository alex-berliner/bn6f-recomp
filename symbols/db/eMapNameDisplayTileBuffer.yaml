  detail: asm32.s:35848 updateMapNameDisplay_811F014 loads r2 = unk_200C0E0 and calls renderTextGfx_8045F8C
    with it as the render destination.; asm32.s:35855 updateMapNameDisplay_811F014 passes unk_200C0E0
    in r0 to sprite_repackAndQueueTiles_811F5DC alongside VRAM dest 0x6015240 and width 7.; asm32.s:35863
    updateMapNameDisplay_811F014 ends with the literal-pool entry off_811F044 -> unk_200C0E0, confirming
    it is a load-address constant for this function.; Neighbor byte_200CF20 is paired with unk_200C0E0
