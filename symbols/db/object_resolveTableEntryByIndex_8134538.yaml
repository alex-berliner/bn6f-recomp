details: "The function is a single-call tail: it pushes lr, loads four small immediates into r0-r3\n \
  \ (r0=0xE2, r1=0x1C, r2=0x1E, r3=0x24, per `mov r0,#0xe2; mov r1,#0x1c; mov r2,#0x1e; mov r3,#0x24`),\n\
  \  branches into object_resolveTableEntry_8134558, then returns via `pop {pc}` reusing that saved lr.\n\
  \  The chosen indices correspond to a particular row/sub-column inside the object table; by\n  inlining\
  \ different constants the engine reuses 8134558 to look up distinct object archetypes\n  (compare sibling\
  \ wrappers elsewhere in this subsystem). Captured calls show entry r0..r3 are\n  ignored (the function\
  \ overwrites them with 0xE2/0x1C/0x1E/0x24) and exit r0 carries the resolved\n  attribute byte (concretely\
  \ 0xFF in the snapshots), while the caller-visible saved registers\n  (r4..r7, per the contract `out=['r4','r5','r6','r7']`)\
  \ are clobbered inside 8134558 and must\n  not be assumed live across the call.\n"
