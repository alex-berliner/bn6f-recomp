name: ai_beginWoodStrikeAttack
address: '0x08100DF8'
kind: function
status: probable
summary: 'Enemy-AI attack handler: charges with anim 5 for ~0x13 frames then switches to strike anim 6
  with wood-element hit'
interface: (no args; r5 = battle object, r7 = oAIAttackVars) -> void; r0 clobbered via object_setCounterTime
  call
details: 'Reads oAIAttackVars_AttackElement: if 0, it initializes the attack — stores element 4 (wood)
  into AttackElement, sets oBattleObject_CurAnim to 5 (charge/wind-up anim), calls object_setCounterTime
  with 0x12, and loads StepTimer (halfword) with 0x13. On later calls it decrements StepTimer; when it
  reaches 0 it sets CurAnim to 6 (strike) and stores HitElement = 4, making the pending hit wood-element.
  Element 0 acts as ''attack not started''. Quirk: the object pointer and AI vars come from registers
  r5/r7 set up by the caller, not arguments.'
