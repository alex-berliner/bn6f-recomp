name: object_updatePanelParameters
address: '0x0800C928'
kind: function
status: confirmed
summary: Trampoline that long-calls the real panel-parameter update routine for an object, passing all context registers
  straight through.
interface: void object_updatePanelParameters(object_ctx /*r0,r1*/, panel_ctx /*r4-r7,r10*/); r0-r7 results and NZC
  flags are those of the real body
details: 'This entry at 0x0800C928 is not the actual worker: it is a two-instruction trampoline. It loads the thumb
  address of _object_updatePanelParameters (off_800C934 holds that address with the Thumb bit set) into r2, then
  performs the classic ROM long-call idiom "mov lr, pc; bx r2" so that LR captures the return address in this (different)
  code region while control jumps into the real body. Everything the caller passed — r0, r1, the frame-ish registers
  r4-r7, and r10 (object/panel context per the verified C) — reaches the body unmodified, and the body''s r0-r7
  results plus NZC flags become this routine''s results. The "pop {pc}" returns to the original caller. No registers
  are saved or restored here beyond what the long-call idiom itself does; r2 is set to the body address | 1 and
  not restored. Game-wise the wrapped routine maintains an object''s panel-related parameters (position/tile data),
  but that logic lives in the body at _object_updatePanelParameters, not in this wrapper.

  '
