summary: 'Proposed name: eInfoTextSavedTimestamp. A 0x14-byte EWRAM buffer holding a copy of the EXE6_InfoText_timestamp
  used as the source/destination when saving the info-text block to SRAM. (struct)'
details: Holds a 0x14-byte timestamp mirror of EXE6_InfoText_timestamp. saveInfoTextBlockToSram reads
  0x14 bytes from EXE6_InfoText_timestamp into it via CopyBytes before composing the 0x28-byte save block
  (timestamp + checksum) written to SRAM at 0x0E007E00. sub_803F976 byte-compares EXE6_InfoText_timestamp
  against it after the save to verify the block round-tripped correctly.
