- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_spawnOnLinkedObjectDefeat + tst/beq: only proceeds when the linked partner was defeated
    and a follow-up spawned; ldrb/strb [r5,#0x61] with sub #1 and tst r1,r1: counts down a byte counter,
    exits while nonzero; on counter==0: orr flag bit 2, bl sub_80C1514 with r0=1, strb #4 -> oBattleObject_CurAction,
    #0 -> oBattleObject_CurPhase (state transition); bic bit 2 from oObjectHeader_Flags on entry path:
    toggles an object flag only when the countdown is running'
