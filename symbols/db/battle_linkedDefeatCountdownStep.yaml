name: battle_linkedDefeatCountdownStep
address: '0x080C1268'
kind: function
status: probable
summary: 'AI step for an object whose linked partner died: spawns the follow-up object, decrements a repeat
  counter, and switches to action 4 when the counter runs out.'
interface: (r5 = battle object header pointer) -> r0 = clobbered by sub_80C1514 result; flags set by tst
  of spawn/count results
details: First calls battle_spawnOnLinkedObjectDefeat; if it reports nothing to do (r0==0) or sub_80C1466
  fails, the step exits without changing state. Otherwise it clears bit 0x2 of oObjectHeader_Flags, then
  decrements the byte at offset 0x61 (a repeat/life counter). When that counter reaches 0, it sets flag
  bit 0x2 again, calls sub_80C1514(1), and sets oBattleObject_CurAction = 4 with oBattleObject_CurPhase
  = 0, ending the object's current behavior. Offset 0x61 is not a standard object header field here but
  a per-object counter reused by this AI handler.
