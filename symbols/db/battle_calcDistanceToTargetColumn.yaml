name: battle_calcDistanceToTargetColumn
address: '0x080D5C26'
kind: function
status: probable
summary: Computes the absolute horizontal pixel distance from a battle object to the far side of the field
  (or a target column), divided by a per-object step value.
interface: (r5 = battle object ptr) -> r0 = abs(pixelX(target column, obj.PanelY) - obj.X) / obj->ExtraVars;
  flags from svc Div
details: 'Loads the object''s Alliance byte: allied/zero keeps target column 7, non-zero (enemy) uses
  column 0, i.e. the opposite side of the 0-6 panel grid. Calls object_getCoordinatesForPanels(column,
  PanelY) to convert that panel into 16.16 fixed-point screen pixels, takes the object''s X field, and
  computes the absolute difference. SWI 6 is the BIOS Div routine, so the final r0 is that difference
  divided (signed) by the word at oBattleObject_ExtraVars — likely a per-step pixel stride, yielding a
  step/frame count. The callee only needs the object pointer in a register (r5 is set by the caller).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#7 / tst alliance / mov r0,#0 picks target column from oBattleObject_Alliance; bl object_getCoordinatesForPanels
    with r1 = oBattleObject_PanelY converts panel to pixel coords; sub r0,r0 - [obj_X] + neg gives absolute
    horizontal pixel delta; ldr r1,[obj_ExtraVars]; svc 6 = BIOS Div, quotient returned in r0; sole caller
    battle_spawnMovingProjectile (CUR_STATE_UPDATE spawn path) fits computing travel distance/steps for
    a moving projectile
  refs:
