name: battle_checkPanelAction
address: '0x080BA414'
kind: function
status: probable
summary: 'Battle-object update that waits 10 frames after spawn, then checks the panel under the object:
  if the panel matches mask 0x10010 it transitions to CurAction 4, otherwise CurAction 0x24, resetting
  phase.'
interface: (r5 = battle object) -> void; sets object's CurAction/CurPhase, plays SFX, no return value
details: On phase 0 the object sets phase 4, animation 0x13, plays sound effect 0x94, ORs flag bit 0x02
  into oObjectHeader_Flags, and arms oBattleObject_TimerAndTimer2 to 10 frames. In phase 4 it counts the
  timer down; when it expires it reads the panel at the object's PanelX/PanelY via object_getPanelParameters
  and tests against mask 0x10010 (0x10000 = hole/broken-panel status bit, 0x10 = panel-type bit). If the
  panel matches the mask it enters CurAction 4, otherwise CurAction 0x24, resetting CurPhaseAndPhaseInitialized
  to 0 in both cases. The 10-frame delay prevents instantly reacting to the panel it spawns on. The flag
  0x02 set at spawn likely marks the object as blocking/solid or as needing collision checks.
