name: init_loadSceneBackground
address: '0x08131440'
kind: function
status: probable
summary: Copies a full 30x20 background tilemap from unk_2021DA0 into background tile block 1 during cutscene
  scene setup.
interface: () -> void
details: Takes no arguments; it calls CopyBackgroundTiles with j=0, i=0, tileBlock32x32=1, tile source
  pointer unk_2021DA0, and dimensions 0x1e x 0x14 (30x20 tiles = one full GBA screen of 8x8 tiles). It
  therefore blits the entire pre-built tilemap buffer at unk_2021DA0 onto BG tile block 1, i.e. it renders
  the scene's background image as part of scene init. No registers are returned and no other state is
  touched.
