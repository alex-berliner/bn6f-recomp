  detail: 'asm: mov r0,#0; mov r1,#0; mov r2,#1; ldr r3,=unk_2021DA0; mov r4,#0x1e; mov r5,#0x14 before
    bl CopyBackgroundTiles; 0x1e x 0x14 = 30x20 tiles, exactly the full GBA 240x160 screen; called from
    init_cutsceneSceneState, which wipes VRAM/tile buffers before starting a cutscene'
