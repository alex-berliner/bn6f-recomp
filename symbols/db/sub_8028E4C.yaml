open_questions:
- Exact meaning of the "0x1B-0x1C" and "0x1A" element-code ranges (which in-game elements they correspond to, e.g.
  Null/Elementless vs. specific elements).
- Which struct type r5 points to (battle chip-tray / folder / cursor state) and what the offset 0x48 chip-index
  list represents.
- How [r5+0xA], [r5+9] and [r5+0x20] are consumed downstream (UI highlight? valid-battle guard?).
- Whether chipIDIs13f_8029FF4 corresponds to Navi chips being excluded from element classification.
- The semantic difference between the r6 sentinels -1 vs -2 vs a stored low byte.
