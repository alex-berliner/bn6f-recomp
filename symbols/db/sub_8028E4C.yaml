name: sub_8028E4C
address: '0x08028E4C'
kind: function
status: confirmed
summary: Walks r5's chip list, classifying chips by element/ID and writing element code and ID sentinel back to
  r5.
interface: 'void sub_8028E4C(void);  /* inputs: r2 r4 r5 r6 r7 r10 lr; outputs: r2 r3 r4 r5 r6 r7; clobbers r0 r1
  r3 lr */'
details: "Operates on a caller-supplied struct in r5. Reads [r5+8] as a count of active chips, then\niterates chip\
  \ indices starting at offset 0x48 in the struct. For each chip it calls\ngetLocOfActiveChips_8027E1C to obtain\
  \ a chip pointer; if [ptr] is non-zero the chip is\nskipped. Otherwise it calls getChipID_802A54E on the chip's\
  \ id and splits it:\n  - bits >>9 become the element code (r1)\n  - low byte becomes a chip-id discriminator (r0,\
  \ after the masked shift)\nSkips chips for which chipIDIs13f_8029FF4 returns true. Writes back into r5:\n  - [r5+0xA]\
  \ = element code if it falls in range \"0x1B-0x1C\" (else left at 0)\n  - [r5+9]   = element-code candidate from\
  \ the 0x1A-family classifier (initialised to 0x1A,\n               overwritten with the first non-0x1A code, or\
  \ set to 0xFF if two different\n               codes are seen)\n  - [r5+0x20] = u16 sentinel built from r0 (low-byte\
  \ chip id): -1 sentinel until the first\n               chip sets r6 to its low byte; matching low bytes leave\
  \ it, mismatches set\n               it to -2. Initial value is \"0:\" style sentinel -1 (no match).\nr4 is the\
  \ per-chip offset counter (starts at 0x48, increments by 1). r3 is the loop counter\nread from [r5+8]. All loop\
  \ branches and sentinels are derived purely from the decoded\nchip id, no other r5 fields are touched.\n"
