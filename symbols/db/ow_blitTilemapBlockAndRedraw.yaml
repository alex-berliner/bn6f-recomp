name: ow_blitTilemapBlockAndRedraw
address: '0x08094738'
kind: function
status: probable
summary: Copies a 34-row x 100-halfword block into the overworld map tilemap buffer at an offset, then
  redraws the tilemap around the camera.
interface: (r0 = source buffer of 34 rows x 0x64 halfwords) -> r0 = 0; no meaningful flags
details: 'Reads the map-state struct at eMapTilesState200be70: byte [state] is doubled to form a row stride
  (r6), and dword [state+0xC] is a pointer whose +8 field is added to it, then +0x42 and +0x2B*r6 give
  the destination start inside the tilemap data. It then loops 0x22 (34) times, each iteration CopyHalfwords-ing
  0x64 (100) halfwords from the r0 source (advancing 0x64 halfwords per row) into the destination (advancing
  r6 = 2*byte halfwords per row). Finally it calls ow_redrawTilemapAtCamera to refresh both tilemap layers
  and returns 0. The three tiny callers at 0x08094708/4714/4720 pass different source buffers (the pool
  references unk_2025404 and unk_2026404), so this is a generic blit of a prepared tile block onto the
  map. The meaning of the stride byte and the +0x42/+0x2B offsets within the tilemap struct is not fully
  resolved.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r5, off_809477C / ldr r7,[r5,#0xc]: destination comes from the map-state struct''s pointer
    field; loop copies 0x22 rows of 0x64 halfwords via CopyHalfwords with stride r6 = byte[state]*2; bl
    ow_redrawTilemapAtCamera immediately after the loop: the copy is meant to become visible map tiles;
    callers 0x08094708/4714/4720 are thunks supplying different source buffers (unk_2025404, unk_2026404)'
  refs:
