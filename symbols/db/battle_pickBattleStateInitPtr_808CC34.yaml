name: battle_pickBattleStateInitPtr_808CC34
address: '0x0808CC34'
kind: function
previous_names:
- sub_808CC34
status: probable
summary: Picks one of four BattleState-related init/data pointer pairs based on event flag 9D4 and three sub-checks,
  returning (ptr0, ptr1) to its caller.
interface: '() -> r0 = chosen byte_* pointer (4-way switch result), r1 = secondary chosen word (0 or sub-call return);
  side effects: may read EVENT_9D4, may call sub_808CC10/sub_808CF8C/sub_808D084/sub_808CDC4'
details: "At entry, r4 and r6 are zeroed to serve as the (r0,r1) return pair.\n  Tests EVENT_9D4 via TestEventFlagFromImmediate;\
  \ if set, r0 = byte_808C930 and falls through (r6 stays 0).\n  Otherwise calls sub_808CC10; on non-zero (likely\
  \ \"is X true?\" branch), r0 = byte_808CA48 and falls through.\n  Else calls sub_808CF8C; on non-zero, r0 = byte_808C428,\
  \ then calls sub_808D084 and stores its r0 into r1 (r6).\n  Else calls sub_808CDC4; on non-zero, r0 = byte_808C74C\
  \ and stores its r1 into r1 (r6).\n  Final epilogue moves r4 -> r0 and r6 -> r1, then pops. The four byte_* blobs\
  \ (0x808C930, 0x808CA48, 0x808C428, 0x808C74C) are different BattleState init/data tables used at battle entry;\
  \ sub_808D084 and sub_808CDC4 contribute the second word (likely a count or sibling table).\n  Lives in sub_808CB0C's\
  \ call chain, which appears to initialise BattleState for a new battle.\n"
