    and `bl sub_808CDC4` / `mov r6, r1` at 0x808CC68-0x808CC6A: r6 picks up either r0 or r1 from those subroutines,
    suggesting those calls yield a matching second table value. - `mov r0, r4` / `mov r1, r6` / `pop {r4,r6,pc}`
    at 0x808CC6C-0x808CC70: explicit (r0, r1) return pair. - Caller contract (sub_808CB0C): in only r10/lr, so this
    helper takes no input parameters.'
