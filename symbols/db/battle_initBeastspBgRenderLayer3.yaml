name: battle_initBeastspBgRenderLayer3
address: '0x0804CDCC'
kind: function
status: probable
summary: Thin wrapper that renders the battle background's BG layer-3 tile map and handles its story-flag
  event during beastsp background init.
interface: () -> r0 = return value of battle_renderBgLayer3TilesAndHandleEvent_804CDD4; preserves r4-r7
details: 'The routine is a pure trampoline: it pushes r4-r7/lr, bl''s battle_renderBgLayer3TilesAndHandleEvent_804CDD4
  (0x0804CDD4), and pops r4-r7/pc, adding no logic itself. The callee sets a BG layer-3 flag in RenderInfo,
  branches on the EVENT_BF0 story flag to pick a layout helper, then copies a 32x32 tile block from ROM
  into BG tile block 3 at (0,0). Its sole caller is battle_initBeastspBackground (0x0804CD5C), which initializes
  the static beastsp battle background (tiles, palette, scroll/render state) before this render step.
  Because it only forwards, its identity is entirely determined by the callee; the separate label likely
  exists for historical or call-site organization reasons. No state of its own is touched.'
