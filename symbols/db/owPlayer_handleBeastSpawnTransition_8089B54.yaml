open_questions:
- Exact meaning of byte 0x18 written to [r5] — could be `CurAnim`, an AI state enum, or a `CurState`;
  identifying the struct that r5 points to in this BeastSp context would settle it.
- The role of sub_8089CB4's predicate (it only has condition codes in its contract).
