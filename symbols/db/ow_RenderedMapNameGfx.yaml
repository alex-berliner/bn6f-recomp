name: ow_RenderedMapNameGfx
address: '0x0200CC20'
kind: data
status: probable
summary: 'Proposed name: ow_RenderedMapNameGfx. A 384-byte EWRAM buffer holding the 4bpp tile graphics
  the overworld map-name HUD repacks and queues to VRAM each frame. (u8)'
details: Lives in EWRAM at 0x0200CC20, 384 bytes, filled at runtime by renderTextGfx_8045F8C and then
  handed to sprite_repackAndQueueTiles_811F5DC as the tile source. Its size is 384 bytes, exactly 9 8x8
  tiles at 4bpp, matching the 9 glyphs of the area name rendered in ow_renderMapNameHudGfx. The label
  is therefore the per-frame rendered bitmap for the area-name HUD, not a structured field; it is a standalone
  tile buffer.
