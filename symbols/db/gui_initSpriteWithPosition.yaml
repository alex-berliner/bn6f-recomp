name: gui_initSpriteWithPosition
address: '0x0811AD58'
kind: function
status: probable
summary: 'Initializes a GUI sprite object (sprite 0x68): configures animation/palette/priority and places
  it at a table-chosen x,y position based on the object''s selector byte.'
interface: (r5 = object struct) -> void; sets object state [r5]=0x23, [r5,#8]=4
details: 'Writes state byte 0x23 into the object at r5, then calls initGuiSprite_8002770 with id 0x68
  and resource eGuiSprite2022FA0. Configures the resulting sprite: animation 0, load animation data, no
  shadow, palette 0, priority 2, plus sub-entry palette bank 2 and sub-record field A 3. Stores halfword
  0xA0 into a slot via slotList_storeHalfwordAndClearField_800306C. Writes 4 to object+8, then uses the
  byte at r5+3 as an index into byte_811ADB8, a table of two (x,y) halfword pairs — (0x7E,0x24) and (0x7E,0x48)
  — passing the chosen pair to sub_811AE5C (presumably a position setter) and finally calls sub_811ADC0.
  The selector-dependent placement suggests a GUI element that can appear in one of two vertical slots.'
