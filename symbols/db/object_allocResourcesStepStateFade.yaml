name: object_allocResourcesStepStateFade
address: '0x08129D78'
kind: function
status: probable
summary: Loops [r5+0x20] times calling sub_812B218 to allocate pooled resources per slot, then transitions
  the state byte at [r5+3] (0x2c→0x30, 0x20→0x24, else→0x14), selects animation 4/5/7 based on [r5+2]
  and calls sprite_setEntityAnimation(r0,0), ORs 0x10 into flags at [r5+0x1b], and starts SetScreenFade(8,0x10).
interface: '(r5 = entity/record pointer, fields: +0x02 anim selector, +0x03 state byte, +0x1b flags, +0x20
  resource count) -> r0 destroyed; no meaningful return'
details: Reads a count from [r5+0x20] and calls sub_812B218 that many times, each call allocating one
  entry from the shared pool at unk_20251A0 for this record's slot. It then advances the state byte at
  [r5+3] by +4, mapping 0x2c→0x30 and 0x20→0x24 specially. Animation index is 4 when [r5+2]==0x14, 5 when
  ==0x18, otherwise 7, passed with r1=0 to sprite_setEntityAnimation. It ORs 0x10 into the flag byte [r5+0x1b]
  and finally calls SetScreenFade(8, 0x10). Note r5 is never set inside — the caller must establish the
  record pointer.
