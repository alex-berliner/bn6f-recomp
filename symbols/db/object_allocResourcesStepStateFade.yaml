- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_8129D7E loop: ldrb r4,[r5,#0x20] then bl sub_812B218 with sub r4,#1 / bgt — batch allocation
    of pooled entries; state byte [r5,#3] compared to 0x2c/0x20 and rewritten 0x30/0x24 — a +4 state-machine
    advance; branch table on [r5,#2] (0x14/0x18) selecting r0=4/5/7 before bl sprite_setEntityAnimation;
    ldrb [r5,#0x1b]; orr 0x10; strb — sets a flag bit on the entity; tail: mov r0,#8; mov r1,#0x10; bl
    SetScreenFade — starts a screen fade'
