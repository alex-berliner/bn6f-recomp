- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` / `pop {pc}` at 0x0802de5c and 0x0802de70 -> trivial leaf wrapper. - `bl TestBattleFlag_0x40`
    immediately followed by `beq locret_802DE70` -> when the test returns 0 (Z set, meaning bit 0x40 is
    set), function returns without side effects. - Fallthrough: `mov r0, #0` / `bl sub_802E2C4` then `mov
    r0, #1` / `bl sub_802E2C4` -> two sequential sub_802E2C4 invocations with arg 0 then 1. - Callee sub_802E2C4
    contract reads r0 and r10 and clobbers many regs, matching the may_write list; r10 is read from the
