summary: Runs two consecutive sub-steps of an AI script step when battle flag 0x40 is clear
interface: () -> void ; tests battle flag 0x40 via r10
details: "Leaf with no inputs/outputs of its own. Pushes lr; calls TestBattleFlag_0x40 which returns\n\
  \  r0==0 when the 0x40 bit of the current battle flags word is set (per the callee's summary);\n  if\
  \ bit is set (Z==1 from bl/contrary), it branches to locret_802DE70 and pops pc without\n  doing anything.\
  \ If bit is clear, it loads r0=0 and calls sub_802E2C4, then loads r0=1 and\n  calls sub_802E2C4 again,\
  \ then pops pc. So when the test fails the function fires two\n  sub-steps of sub_802E2C4 in sequence\
  \ with arg values 0 and 1, otherwise it's a no-op.\n"
