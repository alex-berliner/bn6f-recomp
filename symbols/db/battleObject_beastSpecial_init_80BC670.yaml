name: battleObject_beastSpecial_init_80BC670
address: '0x080BC670'
kind: function
status: confirmed
summary: 'Initializes the visual popup sprite for a BeastLink special chip on the battle field: loads its chip-class
  sprite and animation, sets a randomly-jittered panel position with a pop-in lift, creates the name popup, and
  enters the update phase.'
interface: void battleObject_beastSpecialPopup_init_80BC670(BattleObject *obj /* r5 */); // clobbers r0-r3,r6-r7,lr;
  reads/writes obj, may reassign obj to popup child in r5; r8-r12 passed through
details: 'r5 is the BeastLink-special battle object. The function reads oBattleObject_Param1 (chip-class index)
  to compute the sprite name-table ID (index + 0x1A0) stored at oBattleObject_NameID, then calls chip_class_lookup_800FC9E
  to get tile/animation offsets and loads sprite tiles via sprite_load (subclass 0x80). It sets flag bit 1 on oObjectHeader_Flags,
  resets CurAnim/CurAnimCopy to 0, selects animation 0 with palette 4, and copies facing from the parent object.
  A GBA BIOS Random call (SVC 6, range 0x280000, seed = panelCol at +0x62) produces a jitter value stored at ExtraVars+4;
  the resulting X offset is jitter*panelCol*frontDir added to oBattleObject_X after anchoring to the panel grid.
  Y and Z receive a pop-in lift of (4 - panelY)*0x180000, and a per-chip Z bias is looked up from the table at byte_80BC758
  (indexed by Param1*4) and added to Z. battle_objectNameIdToPopupHandler_8010DD0 creates the name-popup child object;
  if Param1==6 (a specific chip class), the popup''s ExtraVars[0] is set to 1. Finally the sprite is forced to a
  white palette (flash/entry effect), ExtraVars+0x14 is zeroed, and the state machine is advanced to CUR_STATE_UPDATE.

  '
