status: probable
summary: CUR_STATE_INITIALIZE handler for a beast's Special-type Attack object — loads chip sprite/palette,
  computes spawn X/Y from panel and a per-kind Y-offset table, kicks the name popup and a SpecialUse flag,
  then transitions to CUR_STATE_UPDATE.
interface: (r5 = ptr BattleObject) -> r0 = 0 ; writes object fields (NameID, sprite, anim, palette, coords,
  ExtraVars[0..0x14]) and sets CurState = CUR_STATE_UPDATE
details: '1. NameID = Param1 + 0x1A0 (battle_objectNameIdToPopupHandler_8010DD0 will resolve the popup
  against this base).

  2. Looks up the chip class via chip_class_lookup_800FC9E(Param1, 0) and, ignoring that return, loads
  the chip frame sprite at palette index 0x80 with sprite_load, then sprite_loadAnimationData. sprite_removeShadow
  and OR''ing flag bit 0x02 in oObjectHeader_Flags makes the chip sprite visible without shadow.

  3. CurAnim/CurAnimCopy cleared, then sprite_setAnimation(0); another sprite_loadAnimationData ensures
  frame 0 is current.

  4. sprite_setPalette(4) recolors the chip; object_getFlip + sprite_setFlip apply alliance-based mirroring.

  5. A "no-clip" sentinel 0xFFFFFFFF is stored at ExtraVars[0x68-...] and a "coordinate helper" initialized
  via svc 6 (random?): ExtraVars[0x64] = 0x280000 + (0x62 field * something) is rolled into ExtraVars+4
  as a per-instance spawn offset.

  6. object_setCoordinatesFromPanels repositions X/Y on grid; then object_getFrontDirection × X-offset
  × grid-step is added to X, and (4 - PanelY) × 0x180000 is added to Y, with the same delta written into
  Z (so the chip hovers above its panel by the offset). ExtraVars[0xC] remembers the per-frame Y lift.

  7. A 7-entry u32 dispatch table (byte_80BC758 at 0x80BC758, "off_80BC754") indexed by Param1 provides
  a per-kind base Z-lift in 16.16 fixed point; that value is stored into ExtraVars[0x10] and added to
  Z. The table is small (entries 6..6 with the only meaningful values: 0, 8, 4, 0, 0, -8) — matching Beast-parameterized
  Special chips whose Z lift varies with the chip class.

  8. battle_objectNameIdToPopupHandler_8010DD0 pops up the chip name. If Param1 == 6 a flag = 1 is written
  into ExtraVars[0] of the popup handler''s returned object — looks like "this is the Beast-Out Special"
  flag.

  9. sprite_forceWhitePalette, then ExtraVars[0x14] = 0 and CurStateActionPhaseAndPhaseInitialized = CUR_STATE_UPDATE
  (0x04), so the per-frame updater takes over.

  '
