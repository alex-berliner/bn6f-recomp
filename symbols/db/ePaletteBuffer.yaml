summary: 'Proposed name: ePaletteBuffer. A 64-byte (0x3C halfwords = 0x78 bytes destination of a palette
  copy) EWRAM buffer used as the destination for a copied palette. (u16)'
details: The label is referenced as the destination pointer of a halfword copy (CopyHalfwords with halfwordCount=0x3C,
  i.e. 60 halfwords = 120 bytes — larger than the 64 bytes up to the next label, suggesting the next label
  lies further than 64 bytes or the count is in a different unit). loadIndexedPaletteToBuffer_802E240
  selects one entry from a pointer table off_802E25C and copies 0x3C halfwords into unk_2008170. The second
  site is a .word entry of an unrelated table (off_802E280) that just happens to have unk_2008170 listed
  as one of its words, indicating it is a known address rather than a field of that table. As a palette
  destination buffer it is consistent with the project's EWRAM struct convention for buffers that live
  for the duration of a screen/effect.
