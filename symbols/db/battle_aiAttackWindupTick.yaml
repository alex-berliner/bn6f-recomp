name: battle_aiAttackWindupTick
address: '0x080EBE20'
kind: function
status: probable
summary: 'Per-tick windup step of an enemy AI attack: marks the panel in front once, counts a 5-tick timer,
  then triggers the buster attack tick.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no return value
details: 'Uses the oAIAttackVars struct at r7: while AttackElement is 0 it initializes StepTimer to 5,
  computes the front panel with object_getFrontDirection (+1/-1 by alliance/DirectionFlip), adds it to
  oBattleObject_PanelX at r5, and passes (panelX, panelY, 0xA, 8) to a now-empty nullsub_12 — likely a
  removed target-marker/effect spawn at a pixel offset on that panel — then sets AttackElement=4 as a
  ''phase done'' latch. Every subsequent tick it decrements StepTimer; once it reaches 0 it writes HitElement=4
  and calls battle_aiBusterAttackTick_80EBE54 to play the charge-up animation and fire the shot. The AttackElement
  field is reused here as a phase flag, not an element ID.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; bne loc_80EBE42 — state runs its init phase only
    when the field is 0, then latches 4; bl object_getFrontDirection + add r0, PanelX — computes the panel
    in front of the enemy as the attack target; mov r0,#5; strh r0,[r7,#oAIAttackVars_StepTimer] then
    ldrh/sub/strh/bgt — 5-tick countdown gating the attack; mov r0,#4; strh r0,[r7,#oAIAttackVars_HitElement];
    bl battle_aiBusterAttackTick_80EBE54 — on timer expiry sets hit element and fires the buster attack;
    bl nullsub_12 with (frontPanelX, panelY, 0xA, 8) — placeholder call originally spawned an effect on
    the target panel
