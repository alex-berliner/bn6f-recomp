name: getTable2036720EntryFields_802CE78
address: '0x0802CE78'
kind: function
status: confirmed
summary: Reads the 16-byte record at index r0 of the table at 0x2036720 and returns its four fields in r0-r3.
interface: u32 entryIndex -> (r0 = u16 field0, r1 = u32 field1, r2 = u16 field2, r3 = u32 field3); c/v set by the
  address ADDS
details: 'Computes table + entryIndex*0x10 (16 bytes per entry) into the array at unk_2036720 (0x02036720,

  a fixed IWRAM table). Loads four fields out of the 16-byte record and returns them in registers:

  halfword at +0 in r0, halfword at +2 in r2, word at +4 in r1, word at +8 in r3 (12 of the 16

  bytes used; +0xC..+0xF untouched). The multiply/add use flag-setting forms, so c and v are

  side effects of the address computation (c = carry out of the ADDS, v = signed overflow) and

  callers must tolerate both. Returns via mov pc, lr, so it works from both ARM/Thumb state

  depending on the caller''s bit-0 convention. Field widths (u16,u16,u32,u32) suggest a

  struct-of-two-ids-plus-two-pointers/values record; which game system the table belongs to is

  not identifiable from this function alone.

  '
