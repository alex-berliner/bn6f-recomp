name: battle_petNaviDisplayInit_8126B6C
address: '0x08126B6C'
kind: function
status: confirmed
summary: 'Initializes the PET Navi visual display scene: clears VRAM/GFX, populates the scene-control
  struct with the current Navi''s HP and stat bytes, runs the intro chat script, draws background tile
  layers, and triggers a fade-in.'
interface: void battle_petNaviDisplayInit_8126B6C(void *r5 /* sceneCtrl */ , void *r10 /* toolkit */)
details: 'Clears VRAM, byte buffer at 0x3001960, and GFX at 0x30025C0; calls sub_80015FC(0x1A). Writes
  tile ID 0x1F40 to the toolkit''s RenderInfo header and zeroes the following six half-words. Sets scene
  display mode byte (r5+1)=4, sub-state (r5+2)=0. Runs three setup callees (sub_8046664 via R7, sub_81270D0,
  sub_8127800). Zero-clears numerous scene fields (0x0C-0x3A). Loads defaults: sprite-ID 0xFF (r5+0x26),
  tile-set 0x1DA (r5+0x32), active flag 1 (r5+0x38), palette 3 (r5+0x28). Computes a packed tile-attribute
  byte from sub_8120CC8(0, dword_81268F8) and stores it at r5+0x12/0x13/0x48. Reads GetCurPETNavi/GetCurPETNaviStatsHword
  to fill CurHP (r5+0x34) and MaxHP (r5+0x36); reads three byte stats (IDs 9, 0xB, 0xC) into r5+0x14/0x15/0x16.
  For navi==0, tests EVENT_163 via TestEventFlagFromImmediate, but both branches unconditionally write
  2 to r5+0xF (dead code path). Calls sub_8120D10(0, 2) to get a script index and a Z flag; if Z is clear
  stores 0x14 to r5+2 and runs chatbox_runScript_803FD9C(eTextScript201BF20, idx), otherwise runs script
  0 if r5+0x10 != 2. Sets chatbox eFlags to 0x40. Draws background via ten sub-calls (sub_812741C, background_drawSceneSection_81275A8,
  etc.). Gets tile-set base pointers from sub_8119C94, stores ptr+0x38 and ptr+0x50 into r5+0x40/+0x44.
  Calls sub_80465A0(byte_8126B1C) then SetScreenFade(8, 0x10). Preserves r4-r9 across the call; clobbers
  r0-r3, r10-r12, lr, and NZCV.'
