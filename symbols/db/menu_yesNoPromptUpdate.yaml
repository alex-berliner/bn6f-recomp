  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by hyper/qwen3.8-flash: revise
    — The code''s very first line is `bl IsScreenFadeActive` / `beq loc_8129514`, meaning input handling
    (cursor move, A/B) only executes while a screen fade is active; without a fade the function falls
    through to only entity/sprite updates and sub_812B288(0xD). The proposal omits this gate entirely,
    calling it a plain ''per-frame update''. Additionally, the cursor has three states (0,1,2) with left/right
    for 0↔1 and up/down for the 2↔0/2 pair, so ''two-choice'' understates the navigation topology; cursor==2
    on A selects the ''leave'' branch (0x14), not a third yes/no option. The rest (joypad read, table
    0x5C5D5D→chatbox_runScript, zeroFill/eStruct200BC30_setJumpOffset00, SetScreenFade(0xC,0x10) on all
    three exits) matches the asm precisely.; run wf investigate investigate-20261018-145652; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
