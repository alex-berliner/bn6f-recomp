name: battle_countAliveActorsOnTeam_8142C20
address: '0x08142C20'
kind: function
previous_names:
- sub_8142C20
status: probable
summary: counts active battle entries whose team byte matches the given team id
interface: '(r0 = team id) -> r0 = count ; side effects: none (clobbers nzcv, r4-r7)'
details: "Loads the EWRAM array at byte_2006670 (off_8142C8C) into r5. Iterates 0x14 (20) entries,\n \
  \ walking 8 bytes at a time via `add r5, #8`. Each iteration first reads a u16 at offset\n  +4 (Unk_04\
  \ of the entry); if it is non-zero it then reads a u8 at +6 and compares it\n  against the caller's\
  \ team id (r0, preserved in r7). When both tests pass, r6 is\n  incremented. After the loop, r6 (the\
  \ match count) is moved to r0 and the function\n  returns via `pop {r4-r7, pc}`, leaving Z set when\
  \ the count is zero (also preserved\n  through the final `tst r0, r0`). The exact layout of each 8-byte\
  \ slot is unclear, but\n  the byte at +6 acts as a team/alliance field; this is consistent with the\
  \ table being\n  a small per-side roster (max 20 actors) used to derive a live-actor count.\n  All three\
  \ direct callers (sub_808985A, sub_80898FC, sub_80899F2) are inside the same\n  battle/AI tick routine\
  \ and use the returned count to gate chip-lockout or action\n  selection logic. Captured-call exit r0=6\
  \ in the shown frames shows the live count\n  was 6 on that side.\n"
