name: battle_slot_spawnNavPic_811677A
address: '0x0811677A'
kind: function
status: confirmed
summary: Finds the first empty slot in the battle NavPic table (up to 8), selects a NavPic type via a
  tier/param table, computes its HP and level from lookup arrays, and spawns object 79 (a NavPic) in that
  slot.
interface: u32 r5 = battleSlotBase; outputs r5 (post-spawn base), r6 unchanged; preserves r4, r7
details: 'Scans 8 u32 entries at (r5+0x60) for the first zero (empty slot).

  Calls battle_randTierFromParam1Table_81167D2 with the slot pointer in r7 to pick a NavPic type index
  (0-4) in r0.

  Looks up HP from byte_81167C8 = {0x78,0x64,0x5A,0x3C,0x5A} and level from byte_81167CD = {0x1E,0x32,0x46,0x5A,0x0}.

  Builds r4 = (hp<<8)|typeID, sets r6 = level, then calls sub_8015C94 (r2=0x10000, r3=0xF880080, r5=slotBase)
  which presumably initialises the NavPic data structure.

  On success (r0 != 0) calls object_spawnObj79FromSource with the computed parameters to actually place
  the NavPic.

  Returns the possibly-advanced slot-base pointer in r5. If no empty slot is found or sub_8015C94 fails,
  r5 is returned unchanged.

  '
