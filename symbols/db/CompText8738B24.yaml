name: CompText8738B24
address: '0x08738B24'
kind: data
previous_names: []
status: probable
summary: LZ-compressed text archive of MegaMan's Humor-program jokes, shown on an L press while Humor is installed;
  each area's script picks its joke with the random-branch text opcode F0.
details: 'Data, not code: dat38_87.s includes it as an .incbin of data/textscript/compressed/CompText8738B24.s.lz,
  built

  from the readable source data/textscript/compressed/CompText8738B24.s (a size word 0x2D7C00, then the text

  archive).


  Use: the only reference is the literal MegamanJokesCompText8099294 (= CompText8738B24 + COMPRESSED_PTR_FLAG,

  asm28_0.s:509), loaded at asm28_0.s:475 in RunLMessageTextScript (the L-button message). That function shows

  it only when the current PET navi is 0 (MegaMan) and NaviStats.Humor == 1; in the real world it also needs

  EVENT_PET_NAVI_ACTIVE set and EVENT_COPYBOT_ACTIVE and EVENT_172A clear. Otherwise it tries

  NaviStats.Poem == 1 (CompText873A528, the Poem program''s poems), else the map''s normal L message. The archive

  is decompressed (DecompressTextArchiveForCutscene2) and script 0 is run.


  Contents: script 0 is a dispatcher of ts_check_area tests (real-world areas 0-6 and internet groups

  0x80-0x96) that jumps to a per-area script; scripts 1-4 split some of those by sub-area. Seven per-area

  scripts (unk10, unk20, ... unk70) open with

  `ts_jump_random 0x47, 0x20 x6, 0, 0, 0xFF, N+1 .. N+5, 0xFF, 0xFF`, i.e. text opcode F0 0x47: eight weights

  and eight target scripts (0xFF = go on with the current script), six of them weighted 0x20. So each L press

  tells one of six jokes for the area: the one written inline after the opcode or scripts N+1..N+5. The opcode''s

  handler chatbox_F0_jump draws (iCurrFrame & 3) + 2 GetRNG values and takes (r & 0x3FF) % 192; with r uniform

  the first two outcomes get 192/1024 each and the other four 160/1024 (1024 = 5*192 + 64). Bit 7 of 0x47 is

  clear, so EVENT_1709 does not matter here. The jokes are MegaMan (mugshot 0x37) talking to Lan (mugshot 0),

  e.g. "Lan,c''mon... Buy a chip..." in unk10.

  '
