summary: Attempts to put a battle object into its attack/selected pose, guarded by sub_812B318.
interface: void sub_81298F8(uint32_t r5 /*battle object ptr*/, uint32_t lr); clobbers r0-r3, lr, flags (nz,c,v);
  preserves r4,r5,r6,r7
details: 'Calls sub_812B318(r0=3) as a gate; if it returns non-zero the object (r5) is left untouched.

  On success, writes the object''s animation/visual state slots: byte 0x1D = 3 (sub-state),

  byte 0x02 = 4 (pose/state id), byte 0x03 = 0x10 (frame/timer), and clears bytes

  0x12 and 0x13 (likely counter or coordinate fields). The struct offsets and the pose id 4

  are consistent with initializing a battle entity into an attack-ready frame.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
