name: battleObject_setupBeastSprite
address: '0x080A822C'
kind: function
status: confirmed
summary: 'Initialises a Beast Linker battle object''s sprite: loads its tileset, resolves animation and draw priority
  from map-event flags, packs three attribute words, transitions to ready state, and performs the final sprite update.'
interface: battleObject_setupBeastSprite(r5 *object, r10 *gameState) -> r2, r3 (from update routine); r4, r5 preserved
details: 'r5 points to the Beast battle-object struct. The function writes: type=3 at offset 0 (SPRITE_TYPE_BEAST,
  identifying Regal/Full-Metal-type Beast sprites), event-resolved priority byte at offset 5, state=4 ("ready")
  at offset 8, and three 16-bit attribute fields shifted into the upper half of u32 slots at offsets 0xC, 0x10,
  0x14 (read from a per-Beast attribute table returned by getMapAreaDataTableEntry_80A82A4). Graphics are loaded
  via sprite_load(0x80 tileset, 0x1C palette, 0x56 base tile). ow_swapMapEventFlags is called to flush pending map-event
  changes. battleObject_checkSetPriorityByEventFlag_80A82DC returns a priority value which is stored at offset 5
  AND passed as the animation-id to sprite_setAnimation (i.e. the Beast''s idle animation index is tied to its event-flag
  priority). sprite_loadAnimationData, sprite_noShadow (Beasts render without a shadow), and sprite_setPriority_8002E14(2)
  set draw-layer to mid-ground. The tail call to battleObject_updateSpriteAndMaybeReloadAnim_80A827C finalises the
  OAM entry and its leftover r2/r3 are the function''s visible outputs. Quirk: the three attributes are stored with
  the 16-bit value in the UPPER half of a 32-bit word (lsl #16), matching the game''s tile-index/position packing
  convention for sprite OAM entries.

  '
