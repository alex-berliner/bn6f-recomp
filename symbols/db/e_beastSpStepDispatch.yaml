name: e_beastSpStepDispatch
address: '0x081368D4'
kind: function
status: probable
summary: Dispatches one step of the beast-SP cutscene state machine by tail-calling the handler selected
  from off_81368E8 by the step index at [r5+3]; entries 0-6 idle in sub_813691C, then run battle_beginInit,
  pet_naviHealCutsceneStep, battle_beastOutTimerTick, sub_8136A74, e_waitChatboxThenFadeOut, and sub_8136AE8.
interface: (r5 = cutscene/object state struct, r5+3 = step index) -> calls handler via lr, returns handler's
  r0; no flags guaranteed
details: 'Loads the byte at r5+3 (a step/phase counter) and uses it to index a 13-entry table of thumb
  handler addresses at off_81368E8, then performs a tail-call (mov lr, pc; bx r0) so each handler returns
  straight to this function''s caller. Entries 0-6 all point to sub_813691C, apparently an idle/wait step
  reused for several phases; the later entries branch into real work: battle_beginInit, pet_naviHealCutsceneStep,
  sub_8136A0C, sub_8136A74, e_waitChatboxThenFadeOut, and sub_8136AE8. The mix of battle init, pet navi
  heal cutscene, and chatbox-then-fade handlers suggests this drives a multi-phase cutscene object rather
  than a generic script VM.'
