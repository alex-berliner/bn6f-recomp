name: battle_dispatchObjectByType_80A8728
address: '0x080A8728'
kind: function
status: confirmed
summary: Reads a type index from an object at r5+8 and tail-calls that type's handler from a small jump table, passing
  the handler address, the type byte and r10 straight through.
interface: 'void sub_80A8728(void *obj /* r5 */, u32 r10); // lr = return; outputs r2,r3,r4?? no: r2,r3,r8-r12 pass
  through from the handler, r4-r7 preserved via push/pop, flags clobbered'
details: 'Trampoline/dispatcher for per-type object handlers. r5 points to an object structure whose byte at +8
  is a type index. The index selects an entry from the table at off_80A873C (three entries: overworldObject_spawnFromScenarioEffectIndex_80A8748,
  sprite_applyFrameAttrMode8, ow_freeMapObjectThunk), and the handler is invoked as an ordinary subroutine with
  "mov lr, pc; bx r0" so the Thumb bit in the table entry (+1) is required. Unusual calling convention: the handler
  receives the jump-table entry itself in r0 (not the object), the type byte in r1, keeps r5 as the object pointer,
  and r10 is passed through untouched. The push {r4-r7} before the call and pop after it mean r4-r7 are preserved
  to this function''s caller regardless of what the handler does, while r2, r3 and r8-r12 set by the handler flow
  straight through to sub_80A8728''s caller. Only three type indices are valid; anything >= 3 reads garbage from
  beyond the table.

  '
