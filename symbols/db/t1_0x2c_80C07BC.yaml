name: t1_0x2c_80C07BC
address: '0x080C07BC'
kind: function
status: confirmed
summary: Jump-table dispatcher that calls a battle-object update function based on its current state byte.
interface: "void dispatchBattleObjectState_80C07BC(void /* r5 = battle object */)\n  /* clobbers nzcv, r0-r4, r6,\
  \ r7, lr */\n  /* outputs: r5, r8, r9, r10, r11, r12 */\n"
details: 'Thin trampoline (16 bytes). Reads oBattleObject_CurState (a byte field at offset `oBattleObject_CurState`
  from the r5 object pointer) and uses it as an index into JumpTable80C07CC, which contains three Thumb entries
  (sub_80C07DC, sub_80C0840, sub_80C0C8C). The chosen handler is invoked by loading its address, setting lr = pc,
  and bx-ing into it; control comes back via the matching `pop {pc}`.

  Quirks: jump-table entries are stored as `sub_xxx+1` to flip into Thumb mode (the low bit is set). The object
  pointer in r5 is preserved into the call (callers pass r5 and it appears in the outputs), so each handler receives
  the same battle-object base pointer. The tr prefix likely denotes the per-state tick/update phase `0x2c`. Naming
  follows the project''s table-with-1 (phase 0x2c) table-dispatch idiom; sibling tables in the same area presumably
  serve other phases.

  '
