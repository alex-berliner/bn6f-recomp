name: sub_802C218
address: '0x0802C218'
kind: function
status: confirmed
summary: 'Chip Folder screen opening: wipe the row buffer, draw the 7x6 folder window, then advance the screen object
  to its next state and seed its frame timer.'
interface: void sub_802C218(struct ChipFolderScreen* r5); // returns r5 unchanged; preserves r5, r7; clobbers r0-r4,
  r6, nzcv, lr
details: 'Allocates a 0x74-byte frame on the stack (plus the pushed lr) holding a tilemap row buffer

  at frame+4; the frame''s guest address is exported in r6 and the original callers read it

  back. Calls chipFolder_ClearTilemapArea_802C59C on the row buffer, then

  blitTileBlockToRowBuffer_802C4B6 to stamp the 7x6 folder window at tile coordinates (14,

  10). Writes the screen object''s next state (u16 = +2 <- 4) and a 30-frame timer

  (u8 +0xB = 30). The dead path at 0x802C226 (per-call tile reveal while +0xB < 42 using a

  tile source byte from `off_802C27C` -> unk_2035320) is bypassed by the unconditional branch

  at 0x802C224 and never executes. Screen-object offsets touched: state field at +2

  (u16), timer/animation counter at +0xB (u8).


  Register form kept (C call semantics could not work): r5'
