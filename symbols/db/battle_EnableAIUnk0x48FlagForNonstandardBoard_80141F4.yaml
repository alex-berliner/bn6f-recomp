name: battle_EnableAIUnk0x48FlagForNonstandardBoard_80141F4
address: '0x080141F4'
kind: function
status: confirmed
summary: Raises a flag (0x400) in the battle AI data's 0x48 field unless the board uses a standard column pattern
  or the battle is the Dustman mini game.
interface: void sub_80141F4(void); // no meaningful inputs/outputs; r1/r3 pass through from callees, only flags
  clobbered
details: 'Calls GetBattlePanelColumnPattern and bails out when the result is one of the standard column layouts
  (0x38 = default, 0x30 = disadvantaged, 0x3C = advantaged). Otherwise calls GetBattleMode and also bails out when
  the mode is BATTLE_MODE_DUSTMAN_MINI_GAME (9). In every other case it calls SetAIDataUnk0x48Flag with the value
  0x400. Presumably the AI data field at offset 0x48 is a bitmask of AI behaviour toggles, and 0x400 enables some
  behaviour only needed when the arena layout is nonstandard (custom/forced panel patterns); the Dustman mini game
  is excluded explicitly, suggesting its own layout handling is incompatible with that behaviour. No caller outputs
  are read back, so the routine is used purely for its side effect.

  '
