name: ai_bossTurnThink
address: '0x08100308'
kind: function
status: probable
summary: 'Per-frame boss AI state machine: waits a difficulty-based number of turns, then cycles through
  attack steps, dispatching one of several action routines.'
interface: (r5 = battle object, r6 = AI state struct) -> r0 = ?; no meaningful flags
details: Looks up a turn threshold byte from dword_810039C indexed by the AI difficulty tier (values 3,2,2,0x20
  for tiers 0-3). If TurnCounter < threshold, it increments TurnCounter and calls sub_810055C (the waiting/idle
  action). Otherwise it resets TurnCounter, increments AttackCounter up to 3 (after which all counters
  reset and sub_8100570 runs), toggles StepCounter, and if StepCounter was 0 also toggles AggressionFlag
  and adds 3 to TurnCounter. When stepping, it dispatches on battle object ExtraVars (1..4) to sub_81005A6
  / sub_81005DE / sub_8100614 / sub_810064C, with default falling to sub_8100580 — these are presumably
  distinct attack/move routines.
