name: ai_decideAttackPattern
address: '0x080F594C'
kind: function
status: probable
summary: 'Boss AI per-turn attack chooser: after a difficulty-scaled number of turns (or on a random 50%
  roll) it switches the enemy between two attack routines and sets the corresponding panel-choose callback
  and attack id.'
interface: (r5 = this BattleObject, r6 = AI state struct, r7 = AI attack-vars struct) -> r0 = 0/void;
  sets oAIAttackVars fields and issues object_setAttack0/4
details: 'Reads the enemy''s difficulty tier via battle_getAiDifficultyTier_800FE36 and indexes dword_80F59E4
  (bytes 05,40,40,30) for a turn threshold in oAIState_TurnCounter. While under the threshold it increments
  the turn counter, stores the tier into oAIAttackVars_AiDifficultyTier, loads the sub_80F60C4 panel-choose
  callback, gets a duration from sub_80F5A58, targets battle_findPlayer(alliance^1), and starts attack
  id 9 via object_setAttack4. Once the threshold is reached it resets oAIState_TurnCounter, rolls GetPositiveSignedRNG
  & 1 plus 3 (3 or 4) against oAIState_AttackCounter: if below, it increments the counter, clears oAIAttackVars_InitFlag,
  loads the sub_80F6154 callback, duration from sub_80F5A8C, sets oAIState_ScriptId=4 and starts attack
  id 0xa via object_setAttack0; otherwise it resets oAIState_AttackCounter and calls sub_80F5AA0. r6/r7
  appear to be per-enemy AI state and scratch structures laid out at fixed field offsets.'
