name: sprite_frameTickMarkState8_80A9F30
address: '0x080A9F30'
kind: function
status: confirmed
summary: Per-frame sprite tick for an object at r5 that reads the current frame's parameters, marks the
  object's +8 state byte with 8 when frame bit 0x80 is set, then advances the sprite animator.
interface: void sub_80A9F30(r5 = object pointer); returns r2/r3 as left by sprite_update, preserves r4-r8
  and r5 pointer, clobbers flags (nzcv), r0, r1, lr
details: 'Wrapper-style sprite handler: saves r4-r7 and lr plus r8 (stashed via r4), then calls sprite_getFrameParameters
  with the object pointer in r5. The returned r0 is treated as a frame-parameters bitmask; when bit 0x80
  is set it stores the immediate value 8 into the byte at object+0x8 (likely a state/action byte of the
  object struct), effectively tagging the object for this frame. It then unconditionally calls sprite_update
  on the same object to advance its animation, restores r8, and returns. The r2/r3 outputs and all condition
  flags on exit are simply sprite_update''s leftovers, and callers per the contract read r2/r3 back —
  so callers likely consume results of the inner sprite_update call through this wrapper. r8 is passed
  through unchanged (explicitly saved/restored).

  '
