name: fifo_pushRecord16_8009FF8
address: '0x08009FF8'
kind: function
status: confirmed
summary: Appends one 16-byte record to a FIFO ring buffer at dword_3002180, advancing the write counter at byte_3000EA8.
interface: void fifo_pushRecord16(u32 w0, u32 w1, u32 w2, u32 w3) /* r0..r3 in; NZCV set from the counter increment;
  r4/r6/r7 preserved */
details: 'Pushes a 16-byte record (four words passed in r0-r3) onto a queue whose storage base is dword_3002180.
  The write slot index comes from the 32-bit counter at byte_3000EA8; the record is written at dword_3002180 + (count
  << 4), and the counter is then incremented. The counter is masked to its low 28 bits by the original''s lsl/lsr
  pair before the increment (the shift pair also sets NZCV on the new count, which the contract shows callers read).
  The function saves/restores r4, r6 and r7. No overflow or wrap check on the queue length is performed here, so
  either the caller guarantees space or the queue is bounded by the counter''s 28-bit range. 16-byte records of
  four words look like a message/packet/command queue; which subsystem owns dword_3002180 is not determined from
  this function.

  '
