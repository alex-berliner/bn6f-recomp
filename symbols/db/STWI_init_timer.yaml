name: STWI_init_timer
address: '0x0814C1E4'
kind: function
status: confirmed
summary: Hooks the wireless library's timer interrupt handler into a caller-supplied callback slot and enables the
  chosen hardware timer's IRQ.
interface: void STWI_init_timer(u32* callbackSlot /*r0*/, u8 timerId /*r1*/); returns r2 = saved REG_IME, r3 = &REG_IME
details: 'Part of the Nintendo STWI (wireless adapter / Union/Trade helper) library used by the

  Crossover/Union network battles. r0 points to a function-pointer slot (e.g. in the caller''s

  IRQ dispatch table) which receives the thumb address of STWI_intr_timer (+1). The timer id

  (r1, 0..3) is stored at offset 0xA of the STWI work area pointed to by dword_2010CCC.

  It then reads REG_IME (InterruptMasterEnableRegister), zeroes it to block interrupts during

  the update, sets the REG_IE (InterruptEnableRegister) bit for the timer — bit (8 << timerId),

  i.e. timer 0 = bit 3, timer 1 = bit 4, ... since the code computes 8 << id — ORing in any

  previously enabled bits, restores the saved REG_IME, and returns. r2 gets the pre-update

  REG_IME value and r3 the REG_IME address, presumably as vestigial outputs from the library''s

  build; r4/r5 are used internally but pushed/popped so they are preserved. Note the id byte is

  re-read from the work area rather than reused from r1, and no validation of the id is done

  (an id > 3 would set wrong/out-of-range IE bits).

  '
