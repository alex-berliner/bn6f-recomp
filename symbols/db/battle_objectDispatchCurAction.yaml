name: battle_objectDispatchCurAction
address: '0x080BFE6E'
kind: function
status: probable
summary: Runs the battle object's current action by calling the CurAction-indexed handler from its action
  table.
interface: (r5 = battle object) -> dispatches to table[CurAction] via long call; on normal return control
  reaches the epilogue; a fallback path writes 8 to oBattleObject+8
details: Loads off_80BFE84 (pointer to the action-handler table off_80BFE88), reads the object's CurAction
  byte at oBattleObject_CurAction, and long-calls table[CurAction] using mov lr,pc/bx r1 so the thumb
  handler returns to the pop {pc} epilogue. The known table entry is sprite_syncFromRelatedObject+1, i.e.
  action handlers are full thumb functions. The mov r0,#8/strb r0,[r5,#8] after the bx is skipped on a
  normal lr return, so it is only reachable if a handler returns to that address — likely a fallback that
  sets field +8 (state/substate) to 8. r5 is preserved as the object pointer since the function only reads
  r5-based fields.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0] indexes the handler table by the object's
    current action; mov lr,pc; bx r1 is the standard thumb long-call dispatch into table handler sprite_syncFromRelatedObject+1;
    strb r0,[r5,#8] after the call writes a state value into the object but is bypassed by the lr return
    target (b locret_80BFE80); caller sub_80BFE24 at 0x080BFE24 wraps this as the object's updater, consistent
    with battlesweep route execution
  refs:
