name: chatbox_E9_newline
address: '0x08041134'
kind: function
status: confirmed
summary: Advances the chatbox text-box graphics loader to the next state after a printed newline, raising the "box
  ready" flag once loading completes.
interface: void chatbox_E9_newline(Chatbox* r5 box, u32* r4 cursor) — clobbers r0, r2, r3; always increments r4
  by 1 and returns r0 = 0 (with N/Z cleared); C/V reflect the r4 increment (NZCV written); r5 and lr are not preserved
  (lr holds the return address).
details: "Called as part of the chatbox text-script interpreter when a newline is printed\n(the \"E9\" of the name\
  \ is presumably the textbox opcode). r5 points to the chatbox\nobject; r4 is the script/cursor position used by\
  \ the interpreter loop.\n\nSteps:\n- Reads the box's graphics-load state byte at oChatbox_BoxGfxLoadState_0F,\n\
  \  increments it, and stores it back.\n- Clears the 32-bit scratch field oChatbox_Unk_70 (per-line/per-state work\
  \ field).\n- If the new state is 3 (box graphics fully loaded): stores 1 (a \"ready/done\"\n  flag) into the word\
  \ at box+0x8C and skips the table lookup.\n- Otherwise (states 1..2): computes (newState-1)*4 and loads a word\
  \ from a\n  pointer/state table at byte_803FCE4 (off_804115C holds its address), storing\n  the result into oChatbox_Unk_7C.\
  \ This appears to be the next chunk pointer or\n  parameters for the box-gfx DMA/OAM load for that state.\n- Always\
  \ does r4 += 1 (advancing the interpreter cursor) and returns 0 in r0.\n\nQuirks: the \"done\" write uses mov\
  \ r2,#0x8c followed by str r0,[r5,r2] rather than\na named offset field. The state counter is allowed to increment\
  \ past 3; on states\n>3 the table read indexes off the end of byte_803FCE4 (state-1 >= 3 reads beyond\nthe three\
  \ entries), so the interpreter presumably switches away from this handler\nonce the ready flag at +0x8C is set.\
  \ The flag outputs (NZ/C/V) come from the r4\nincrement and the final mov r0,#0, matching how callers use flags.\n"
