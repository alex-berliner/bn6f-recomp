name: ai_setAttackParamCooldown
address: '0x080E8788'
kind: function
status: probable
summary: After an AI attack finishes, stores 8 into field 0x8 of the attack's parameter/scratch structure,
  rearming some delay timer.
interface: (r0 = pointer to AI attack param/scratch struct, may be NULL) -> r0 clobbered; no return value
details: 'The routine is a guarded field write: if r0 is non-NULL it stores the constant 8 at offset 0x8
  of the pointed-to structure, otherwise it does nothing. Both callers invoke it at the very end of an
  attack state, after the step timer hits zero, the object''s animation is reset to 0, and object_exitAttackState
  has been called — and only if the attack''s parameter/scratch pointer (oAIAttackVars field, e.g. ScratchPointerOrPanel
  or AiAttackParam) is non-zero. Field 0x8 of that struct is likely a delay/cooldown or repeat counter
  the AI logic re-reads when planning the next attack; the value 8 suggests a fixed tick count.'
