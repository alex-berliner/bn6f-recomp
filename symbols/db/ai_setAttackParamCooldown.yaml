- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80E8788: ''tst r0,r0; beq'' then ''mov r1,#8; str r1,[r0,#8]'' — pure guarded store of
    8 to +0x8; ai_attackHoldState 0x080FB3F2: loads oAIAttackVars_ScratchPointerOrPanel, ''tst/beq'' skips
    call when NULL, then bl sub_80E8788; sub_80F204E 0x080F2076: identical pattern with oAIAttackVars_AiAttackParam,
    called only after object_exitAttackState and anim reset; Both call sites are in the timer-expiry branch
    (strh StepTimer / bgt) of attack-hold state handlers'
