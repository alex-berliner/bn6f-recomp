open_questions:
- Exact attack(s) this belongs to (routes battlesweep/beastsp/chips suggest an advancing sweep attack
  but the caller sub_80F7D34 is unnamed)
- whether the region highlight width 4 is centered or anchored at TargetPanelX
- The summary states 'from the actor up to the target column, then the target region', but the code first
  calls object_highlightPanelRegion on the target column (line at 0x80F82B4-0x80F82C0), then loops over
  the actor's row toward the target. Also r0 and r1 are not unused — they hold TargetPanelX and PanelY
  at entry for the first callee. The overall behavior matches (highlights target region plus intermediate
  row panels), but the order is reversed in the summary.
