name: weatherComp_layOrbTrail_809005C
address: '0x0809005C'
kind: function
status: confirmed
summary: Weather-component per-frame step that spawns a 5-frame orb-trail particle stream when the player holds
  A during the BE4 trail-ready event, then resets the associated event flags and countdown timer.
interface: 'u32 weatherComp_layOrbTrail_809005C(void *battleObj /*r5*/, void *toolkit /*r10*/); /* sets NZ on r0:
  nonzero = trail fully completed or sub_8090308 partial result, zero = not applicable / early-out */'
details: "Operates as a tick inside the weather-component system. Key fields on the object at r5:\n  +6 (u16) –\
  \ countdown timer; >=0xFA triggers the reset path.\n  +8 (u8)  – trail state / remaining-frame counter; set to\
  \ 1 on activation, decremented each\n             frame the A-button is held, reset to 5 on completion.\n\nFlow:\n\
  \  1. Bail if event flag BE4 (bank 0xB off 0xE4) is not set, or if sub_808FF8C (object-field-20\n     zero gate)\
  \ returns zero.\n  2. If the timer has expired (>=250) or A is not pressed: mark state byte 8 = 1, and if the\n\
  \     timer was nonzero, clear it (offset 6), clear flags BE5, PET_DISABLED (bank 0x17 off 7),\n     and 0x1739\
  \ (bank 0x17 off 0x39), then call clearWorkArea_808FE64.  Return 0.\n  3. Otherwise (A held while timer active):\
  \ call sub_8090308 (orb-trail particle spawner /\n     visual update).  If that call returns zero-flag, bail with\
  \ 0.  Decrement the frame counter\n     at +8.  When the counter hits 0, reset it to 5 and return 1 to signal\
  \ the trail sequence\n     is complete; otherwise return sub_8090308's r4 value.\nRegister r4 is saved/restored;\
  \ r10 (toolkit) provides the joypad state via\noToolkit_JoypadPtr for the A-button check."
