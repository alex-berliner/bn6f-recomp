    collision while vanished; strh 0xFF -> [r5,#oBattleObject_Z16]: moves the object to an offscreen/hide
    Z position; StepTimer loaded with 0x1E then decremented each call with bgt: 30-frame delay before
    the strike; HitElement=0xC stored when the timer expires: the delayed payoff of the attack'
