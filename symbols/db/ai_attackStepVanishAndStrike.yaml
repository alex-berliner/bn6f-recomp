name: ai_attackStepVanishAndStrike
address: '0x08106274'
kind: function
status: probable
summary: 'AI attack step: if no attack element is set yet, claims element 4, drops the object offscreen
  (Z=0xFF) clearing its collision region and starts a 30-frame wait; once the timer expires it sets hit
  element 0xC to deliver the strike.'
interface: () -> void; reads r7 = AI attack vars struct, r5 = battle object; uses oAIAttackVars_AttackElement,
  StepTimer, HitElement and oBattleObject_Z16
details: This is one step of an enemy AI attack routine, presumably dispatched via a jump table with r5/r7
  preloaded to the object and its AI attack vars. On the first invocation (AttackElement == 0) it claims
  the attack by setting AttackElement to 4, calls object_clearCollisionRegion so the (now hidden) body
  no longer occupies a collision region, writes 0xFF to the object's Z (hiding it or sending it underground/offscreen),
  and arms StepTimer to 30 frames. On later invocations it merely counts the timer down; when it reaches
  zero it writes HitElement = 0xC, which some other part of the AI/battle code presumably reads to apply
  the attack. It returns without otherwise touching the object.
