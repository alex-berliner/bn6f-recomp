name: bg_writeTileIdRow_80018E0
address: '0x080018E0'
kind: function
status: confirmed
summary: Copies a horizontal run of BG tile ids from a source buffer into one 32x32 tile-id map block,
  wrapping columns at 32.
interface: void bg_writeTileIdRow(u32 x /*r0*/, u32 y /*r1*/, u32 block /*r2*/, const u16* src /*r3*/,
  s32 count /*r4*/, Toolkit* toolkit /*r10*/) -> leaves r0 = next x (wrapped), r1 = 0x1F, r2 = block<<11,
  r3 = src past the copy, r4 = remaining count, flags set by final "CMP r4,#0"
details: 'Reads the toolkit''s iBGTileIdBlocks pointer via r10 (oToolkit_iBGTileIdBlocks_Ptr), selects
  a

  0x800-byte block (32x32 u16 entries) with r2<<11 and a row with y<<6, then writes `count`

  halfwords from src into consecutive columns starting at x & 0x1F. Columns wrap modulo 32

  (mask 0x1F), so a run longer than a row continues on the same row from its left edge. The

  loop is a do-while: it always writes at least one tile, and a non-positive count just

  decrements once and stops. Preserves r6/r7; trashes r1 with the mask constant and returns

  the advanced source pointer in r3 (handy for callers that stream tile ids).

  Note: the blob labelled sub_80018E0 also contains a second routine at loc_800191A

  (~0x08001912) that is the vertical counterpart: dst = block + (r2<<11) + (r0<<1), rows from

  r1 & 0x1F advancing by 1<<6 per tile, i.e. a column writer with the same do-while/wrap

  behaviour; it should probably get its own symbol (e.g. bg_writeTileIdColumn).

  '
