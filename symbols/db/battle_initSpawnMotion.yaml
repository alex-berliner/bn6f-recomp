name: battle_initSpawnMotion
address: '0x080D149E'
kind: function
status: confirmed
summary: Initialises the spawn-trajectory velocities and timer for a battle object, choosing between a thrown arc
  (Param4 != 0) and a straight vertical drop (Param4 == 0).
interface: void battle_initSpawnMotion(u32 r5 /* battle-object ptr */); preserves r4-r7, clobbers r0-r3, lr, nzcv
details: 'Reads oBattleObject_Param4 as a mode flag. When Param4 is nonzero the object is thrown forward one panel
  in its facing direction (oBattleObject_PanelX += front_dir), screen coordinates are obtained via object_getCoordinatesForPanels,
  Timer2 is set to 0x0D (13-frame throw), and math_getThrowSpeeds (called with the spawn-struct pointer at obj+0x34,
  the target coords, a throw-height constant 0xFFFF8000, and the timer value) returns parabolic X/Y/Z velocities
  that are stored into oBattleObject_XVelocity / _YVelocity / _ZVelocity. When Param4 is zero the object drops in
  place: Y-velocity is set to 0, X-velocity is front_dir * 0x1C000, Z-velocity is 0xFFFE0000 (negative, i.e. falling).
  The fall duration is computed as current Z divided by 0x00020000 (the per-frame gravity step, via the QuickDivide
  BIOS svc), stored in Timer2, and the starting X is shifted backward by fall_time * X_velocity so the object lands
  on its intended panel. R4/R5/R6 must be saved across the math_getThrowSpeeds call per the caller contract.

  '
