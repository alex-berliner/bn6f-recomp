open_questions:
- The exact meaning of the byte at r5+0x44 (which the struct doc shows as part of AIData, not BattleObject directly)
  is unclear;
- the table referenced at byte_813470C is unknown without live captures of the full table.
- Whether the Y window (0..6) corresponds to a per-frame Y scroll position or to attack animation state cannot be
  confirmed
- from the assembly alone. Capturing a battle with a known Animate would settle this.
- The full contents of dword_81331FC (the table fed to sub_8120CC8 when the high nibble == 0) is not visible here.
