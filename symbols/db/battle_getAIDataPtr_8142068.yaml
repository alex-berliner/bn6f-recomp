status: probable
summary: Returns a pointer to one of up to four AIData slots stored at unk_2000BE0, indexed by r0.
interface: (r0 = actor index 0..3) -> r0 = &unk_2000BE0 + r0 * 0x28 ; no side effects
details: "Loads a base address from off_8142130 (resolves to unk_2000BE0 in EWRAM) into r6, computes\n\
  \  r6 + r0 * 0x28 with `mul r0, #0x28`, and returns the resulting pointer in r6 (caller-visible\n  out\
  \ register). Function is a single-instruction tail jump (`mov pc, lr`), so it is a pure\n  leaf accessor\
  \ with no callees.\n  The 0x28-byte stride matches the size of a single AIData slot (oAIData_Size ==\
  \ 0x100, so this\n  is not AIData itself; rather, this looks like a smaller per-actor AI control block\
  \ of 0x28\n  bytes, possibly an AIState or a compact per-battle-actor wrapper). The captured-call pattern\n\
  \  (r0 = 0..3 yielding 0x00, 0x28, 0x50, 0x78) is consistent with a 4-entry array indexed by\n  per-battle-actor\
  \ index. Caller sub_80A78B8 returns the result in r6 and feeds it into a wider\n  battle-actor iteration\
  \ loop (r5/r10 loop counters), strongly suggesting this is the per-actor\n  AI scratch/state pointer\
  \ table used during battle AI updates.\n"
