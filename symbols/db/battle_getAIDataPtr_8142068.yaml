open_questions:
- Whether unk_2000BE0 really is an AIData array or a smaller AI scratch struct (the 0x28 stride
- is too small for the full AIData of 0x100 bytes). Settling it needs the struct layout of
- unk_2000BE0 / its surrounding EWRAM region, or a writer that fills one of these slots.
