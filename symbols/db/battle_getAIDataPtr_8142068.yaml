- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r6, off_8142130 // =unk_2000BE0` at 0x0814206C loads the EWRAM table base. - `mov r1,
    #0x28; mul r0, r1; add r6, r6, r0` computes `base + index * 0x28`. - Captured calls with r0 = 0,1,2,3
    give r0 = 0x00, 0x28, 0x50, 0x78 — pure linear addressing with stride 0x28, exactly matching the assembly.
    - Caller sub_80A78B8 has in=[r5,r10,lr] and out=[r2,r3,r4,r5,r10] with may_write r6 — it preserves
    r5/r10 as loop bounds and uses r6 as the AI-block pointer it threads through its loop body, consistent
    with a per-actor pointer accessor. - No `bl` calls inside, only `mov pc, lr` — leaf getter.'
