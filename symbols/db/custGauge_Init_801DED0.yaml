name: custGauge_Init_801DED0
address: '0x0801DED0'
kind: function
status: confirmed
summary: Resets the custom gauge state, reloads its tile graphics from ROM into VRAM, and starts the custom gauge's
  init/dispatch routine.
interface: void custGauge_Init(void)
details: 'Entry point for (re)starting the custom gauge UI. First calls ClearCustGauge to wipe the gauge''s state,
  then queues a graphics transfer with QueueEightWordAlignedGFXTransfer: source is the pointer at dword_86E489C
  (custom gauge tile data in ROM), destination 0x600C440 is an offset in VRAM, and the size 0x380 covers the gauge''s
  tile graphics. It then calls sub_801BECC with r0=0x10 and dispatch_801DA48 with r0=0x10, where 0x10 appears to
  be the task/state index for the custom gauge, so the gauge''s init routine runs and control is handed to the gauge''s
  handler via the dispatcher. Presumably called whenever the custom gauge needs to be reset and re-shown (e.g. on
  battle start or returning from the custom menu).

  '
