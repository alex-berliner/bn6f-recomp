name: object_dispatchChipNameAction
address: '0x080E30BC'
kind: function
status: probable
summary: 'Per-frame state handler for the battle chip-name display object: jumps to the routine for the object''s
  current action (dim screen, draw chip name, sub_80E30E0, undim screen).'
interface: (r5 = battle object) -> r0 = handler return; flags per handler
details: Reads the object's current action from [r5,#oBattleObject_CurAction], indexes a 4-entry dispatch table
  at off_80E30D0, and tail-calls the selected handler via a mov lr,pc / bx r1 thunk so each handler can set the
  next action in r0. The table entries are dimScreen, drawChipName, an internal state (sub_80E30E0), and undimScreen,
  i.e. the lifecycle of the chip-selection overlay that dims the screen, shows the selected chip's name, waits,
  then undims. Runs on recorded 'chips' routes, matching the chip menu in battle.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0] indexes the table by current action; table off_80E30D0
    contains object_dimScreen+1, object_drawChipName+1, sub_80E30E0+1, object_undimScreen+1; mov lr,pc / bx r1 is
    a Thumb tail-call dispatch to the chosen action handler; route tag 'chips' matches the chip-selection overlay
    this state machine drives
