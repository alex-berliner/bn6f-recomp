name: navicust_exitBoardScreen
address: '0x081360DC'
kind: function
status: probable
summary: 'Exit routine for the Navi Customizer board screen: resets state, unhighlights the cursor cell,
  redraws the board, and plays the exit sound.'
interface: () -> void; r0 and r5 clobbered via calls
details: Writes 0xC to byte [r5,#2], which is the screen/task state or mode field of the Navi Cust context
  object, then calls sub_81362F8 (likely a state/fade handler). It calls navicust_getCellProgramId so
  the handler for the currently hovered cell sees the cursor leaving, then calls sub_813660C with r0=0
  (likely clearing a selection/position) and redraws the whole 49-cell board via navicust_drawBoardTilemap.
  Finally it plays SOUND_EXIT_SUBMENU, matching a 'leaving the submenu' transition. The padding after
  the epilogue shows it is a leaf-like state handler invoked from the Navi Cust input/state dispatcher
  sub_8135FDC.
