name: sub_8035640
address: '0x08035640'
kind: function
status: hypothesis
summary: Scans an id/event-flag table; if the current target id matches an entry whose flag is set, loads a GFX+animations
  bundle.
interface: void sub_8035640(u32* someStruct, ...); // r10 = ptr to a struct whose +0x3c points to a {u16 id, ...}
  blob; r2,r5,r7-r12 out; flags NZ/C/V clobbered
details: 'Walks the table at byte_8035670 which is an array of {u16 id, u16 event_flag} pairs terminated

  by an entry with id == 0. For each entry it compares the entry id against *(u16*)(r10+0x3c+4)

  (r7 is loaded from r10+0x3c, so the comparison is actually against the u16 at offset 4 of that

  pointed-to object). When an id matches and TestEventFlag(entry.event_flag) returns nonzero, it

  calls LoadGFXAnims(off_8035688) once and then returns. Used to conditionally preload character/

  sprite graphics when a particular game event has been triggered.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
