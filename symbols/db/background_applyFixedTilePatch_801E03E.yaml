name: background_applyFixedTilePatch_801E03E
address: '0x0801E03E'
kind: function
status: confirmed
summary: Writes a fixed 6x2-tile patch of tile IDs into background tile block 3 at coordinates stored in eStruct2035280,
  then flags the background update.
interface: void sub_801E03E(void); // no meaningful register inputs; r4/r5 preserved, clobbers r0-r3, sets NZCV
  (Z clear, N set, C clear from the 1<<7 shift)
details: 'Loads tile coordinates from the eStruct2035280 state struct: byte_2035281 (j) and

  byte_2035282 (i). Calls CopyBackgroundTiles with which_tile_block_32x32 = 3, a pointer

  to the tile-ID table at byte_801EDFC, j_size = 6 and i_size = 2, so a 6-wide by 2-tall

  patch of tiles from the ROM table is stamped into that 32x32 tile block at the stored

  (j, i) position. Then calls flagSetBits_eStruct2035280_801BEB8 with r0 = 0x80, which

  sets bit 0x80 in the struct''s flags — most likely marking the background/tilemap as

  dirty so the engine re-uploads or redraws it. The patch data itself is a fixed table,

  so this looks like a scripted screen effect, such as erasing/redrawing a specific

  section of a background after an event (e.g. opening a path or reverting a tile change).

  Quirk: r6/r7 are listed in the caller contract but unused by this function; the

  flag-setting `lsl r0,r0,#7` before the flag-set call leaves N/Z/C as side effects.

  '
