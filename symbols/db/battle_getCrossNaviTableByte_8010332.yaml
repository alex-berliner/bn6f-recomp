name: battle_getCrossNaviTableByte_8010332
address: '0x08010332'
kind: function
status: confirmed
summary: Picks a byte from a per-navi lookup table for the currently equipped cross/beast navi, returning fixed
  values 1 (special battle mode) or 4 (no navi) as fallbacks.
interface: 'u8 battle_getCrossNaviTableByte_8010332(void); /* in: r5, r6, r10 passed by callers but ignored here;
  r4 must be preserved; out: r0 = table byte or 1/4 sentinel; clobbers r1, lr, NZCV */'
details: 'Calls GetBattleMode and returns 1 immediately when the mode is 9 (a special battle mode, likely a scenario/tutorial
  battle where the normal navi selection does not apply). Otherwise it reads byte 0x29 of the battle-navi stats
  (the selected cross/beast navi slot) via GetBattleNaviStatsByte_AllianceFromBattleObject; if that is 0 (no navi
  registered) it returns 4. Otherwise it treats the value as a table row (row stride 11 bytes, computed as r0*11
  with MUL), reads stats byte 0x2B as the column/variant index within the row, and returns the byte at byte_8020FE0
  + row*11 + column. So byte_8020FE0 is an 11-byte-per-entry table indexed by the current navi slot and a per-slot
  variant byte. r4 is pushed/popped only to satisfy the callers'' preservation contract; r5, r6 and r10 are listed
  as caller inputs but never read.

  '
