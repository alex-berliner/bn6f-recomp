name: navicust_runObjectDialogScript
address: '0x08136FB8'
kind: function
status: probable
summary: 'Per-frame dialog handler for a NaviCust-related overworld object: waits for a trigger, then runs NaviCust
  text script 0xA/0xB depending on an object field and updates the object state.'
interface: (r0 = unused/0 context, r7 = object struct, r5 = object state byte pointer via caller setup) -> r0 =
  clobbered; sets [r5] = 0x1C when a dialog script is launched, 0x20 in the fallback path; flags from sub_8137648
  (beq on zero return = keep waiting)
details: 'First calls sub_8137670(0x3F8) (likely arming/initializing something with id 0x3F8=1016), then polls sub_8137648(0,
  0xA); if it returns zero the routine exits immediately (beq to return), so this looks like a wait/trigger poll.
  Once triggered, it requires byte [r7,#2] == 4 (object kind/state gate) and switches on halfword [r7,#0x20]: values
  1 or 2 run RunTextScriptNaviCustDialog with script 0xA after sub_8137670(0); value 3 runs script 0xB; any other
  value calls sub_8137670(1) and writes 0x20 to [r5] instead. In the script-running paths [r5] is set to 0x1C, which
  reads as advancing a small per-object state machine (0x1C = dialog running, 0x20 = default/idle). r7 is an object/entity
  struct and [r7,#0x20] appears to select which NaviCust dialog variant to show.'
