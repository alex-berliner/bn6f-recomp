- method: assembly-reading
  date: '2026-10-18'
  detail: 'callee 0x08137670 RunTextScriptNaviCustDialog invoked with 0xA and 0xB shows the function''s job is launching
    NaviCust dialog text; bl sub_8137648 with r0=0,r1=0xA followed by ''beq locret'' shows a poll that exits while
    the trigger condition is false; switch on ldrh r0,[r7,#0x20] (1/2 vs 3) selecting script 0xA vs 0xB shows an
    object field picking dialog content; strb #0x1C / #0x20 to [r5] after each branch shows it writes a state-machine
    byte for the owning object; gate ''ldrb r0,[r7,#2]; cmp r0,#4; bne return'' shows it only acts for objects whose
    byte 2 is 4'
