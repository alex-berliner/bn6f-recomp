name: ai_attackStepChoosePanel
address: '0x080F7A10'
kind: function
status: probable
summary: 'AI attack step: asks a per-alliance callback to pick a destination panel near the target, reserves
  it, and sets the object up to move into its attack pose.'
interface: (r0 = attack vars? unused on entry, r5 = battle object, r7 = AIAttackVars) -> r0 = destroyed;
  sets object FuturePanelX/Y, panel reservation, ObjectFlags1 CANNOT_SLIDE, CurAnim, AIAttackVars StepTimer/HitElement/HasMoved
details: First checks object_canMove; if the object can't act it clears AIAttackVars.HasMoved and calls
  object_exitAttackState. Otherwise it indexes byte_80F7A5C by Alliance*8 to fetch a pair of words (0x10/0x30
  and a code pointer) passed as args r2/r3, then calls the PanelChooseCallback stored in r7 with the target
  object pointer; the callback returns panel coords in r0/r1. If the callback succeeded (nonzero r0),
  the coords are stored to oBattleObject_FuturePanelX/Y, the panel is claimed via object_reservePanel,
  and CANNOT_SLIDE is ORed into ObjectFlags1 so nothing else takes the panel. It then sets CurAnim to
  4, StepTimer to 6, and HitElement to 4, leaving HasMoved untouched so the AI state machine proceeds
  to the movement/attack phase. The two-entry table suggests only two alliance values (e.g. player-side
  vs enemy) with different chooser parameters/functions.
