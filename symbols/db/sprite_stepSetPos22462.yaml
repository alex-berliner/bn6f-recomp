summary: Sprite-object step that runs an unknown action, snaps the object's sprite to the fixed position
  (224, 62) and refreshes it.
interface: (no args, operates on current sprite object) -> void
details: 'This is a leaf ''step''-style routine typical of the engine''s sprite object scripting: it first
  calls the adjacent unknown helper sub_811E8E0 (likely a one-shot effect or state change), then hard-codes
  the object''s sprite coordinates to x=0xE0 (224), y=0x3E (62) via sprite_setCoordinates, and finally
  calls sprite_update so the new position takes effect immediately. The constants are absolute screen-space
  values, so the object is teleported to a fixed anchor point rather than moved relatively. Only the current
  object''s sprite struct is touched; no return value is produced. The sibling caller sub_811E87C and
  neighbor sub_811E8E0 suggest a block of similar single-purpose steps.'
