name: rfu_drawConnectedPlayerEntries
address: '0x0803A104'
kind: function
status: probable
summary: Each frame, draws up to 4 lines of wireless-connect info (codes 0x27, 0x7b via sub_803B814 and
  0x21 via sub_803B9C0) indexed by [r5,#0xb]+i and stride 0x20, marks entries active, then ticks sprite/entity
  updates; may early-return if sub_803A2A4 signals done.
interface: '(r5 = connection-state struct: +0xb base index, +0x24/+0x26 draw params, +0x18 flag) -> r0
  destroyed; draws text per entry via sub_803B814/sub_803B9C0.'
details: 'If [r5,#0x18] is nonzero it first runs sub_803A2A4, then clears/prepares via sub_803A214. It
  loops i=0..3 while i < sub_813D638() (apparently the number of connected players); each iteration calls
  sub_803C440([r5,#0xb]+i), which returns a value/handle pair used as draw data. Three text-draw calls
  follow with per-entry destination stride 0x20: code 0x27 at offset 0x23+i*0x20 with count 6 using [r5,#0x24],
  code 0x7b at the same row with count 7 using [r5,#0x26], and after sub_8146728 a call to sub_803B9C0
  with code 0x21 at offset 0x1a+i*0x20, count 4. sub_803A238(i,1) marks the entry active, and chatbox_waitStepUpdateEntities
  ticks entity/sprite updates for the frame.'
