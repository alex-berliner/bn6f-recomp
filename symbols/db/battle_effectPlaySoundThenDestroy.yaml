name: battle_effectPlaySoundThenDestroy
address: '0x080CB924'
kind: function
status: probable
summary: 'One-shot battle-effect update: on first tick plays a sound, then waits for the object''s animation
  to finish and destroys the object.'
interface: (r5 = battle object, no args in r0-r3) -> r0 = clobbered; destroys the object via object_genericDestroy
  when done
details: 'Reads oBattleObject_CurAction: if it is neither 1 nor 2, it starts the ''acting'' state (CurAction
  = CurAnim = 1) and plays sound ID 0x124 (0x25+0xff). While CurAction == 1 it polls sprite_getFrameParameters
  each tick; when the frame parameter''s 0x80 bit is set (animation finished) it falls into the teardown
  path, also reached directly when CurAction == 2. Teardown decrements the word pointed to by ExtraVars+8
  (likely a parent/spawn counter), zeroes the word at ExtraVars+0xc (a timer), calls sub_80E5BA2 with
  the pointer at ExtraVars+0x10, and finally calls object_genericDestroy to free the object. Typical BN6
  pattern for ephemeral effect/visual objects that exist only for the length of one animation.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'cmp r0,#1 / #2 on oBattleObject_CurAction with fallthrough to destruction mirrors the standard
    battle-object action state machine; bl sprite_getFrameParameters then tst r0,#0x80 / beq return: keeps
    the object alive until the animation''s end-of-anim flag is seen; mov r0,#0x25; add r0,#0xff; bl PlaySoundEffect
    plays fixed sound 0x124 exactly once when entering action 1; ldr r1,[r0]; sub r1,#1 via pointer at
    ExtraVars+8 decrements an external counter before teardown; bl object_genericDestroy is the last call:
    the routine''s only exit besides waiting is self-destruction'
