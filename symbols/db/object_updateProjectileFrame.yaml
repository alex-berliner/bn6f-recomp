name: object_updateProjectileFrame
address: '0x080D4BC0'
kind: function
status: probable
summary: 'Per-frame update for a battle object that has just collided: spawns its hit effect, then either
  destroys it or advances it one step (move + collision refresh).'
interface: '(r5 = battle object) -> r0 = destroyed (side effects: object state field); flags from tst'
details: 'Runs for the object in r5 (registers are expected set up by the caller). It first tears down
  the object''s collision data via object_removeCollisionData and spawns the jittered hit-effect object
  for the last collision via object_spawnCollisionEffect. If the battle is over (battle_isBattleOver)
  or sub_80D4C6C reports some end condition (likely lifetime expired/off-field, since its result ORs into
  the destroy path), it clears the collision region byte and stores CUR_STATE_DESTROY into the object''s
  combined state/phase field. Otherwise it calls sub_80D4C3A (likely advancing the object along its trajectory),
  recomputes pixel coordinates from panel coords (object_setCoordinatesFromPanels), updates its collision
  panel set, and refreshes per-frame collision state (object_presentCollisionData). Effectively a ''collided
  projectile tick'': pop the collision, show the impact, then continue flying or die.'
