name: ai_attackNextStep_80F8A9C
address: '0x080F8A9C'
kind: function
status: confirmed
summary: Per-frame step of a single-panel melee AI attack; on the impact tick spawns a damage collision
  region on the target panel and a spark effect object.
interface: void ai_attackNextStep(battleObject *r5, AIAttackVars *r7, uint32 r10) -> {r1, r5, r10}
details: "Called each frame as the \"Next\" handler for one AI attack state. On the first call (AttackElement\
  \ == 0) it initialises the attack: sets AttackElement to 4 (default), writes CurAnim 0x10 on the battle\
  \ object, calls object_setCounterTime with 12, plays sound effect 0x10A, and loads StepTimer with 30\
  \ (0x1E). On subsequent calls it decrements StepTimer. If the decremented value is not 0x14 and is still\
  \ positive it returns immediately. If it reaches zero or below without hitting 0x14 it stores HitElement\
  \ = 0x14 (likely a whiff/miss marker). When the timer equals 0x14 (the impact tick) it: (1) computes\
  \ the target panel as (frontDirection + PanelX, PanelY), (2) spawns a collision region of type 0x700FF11,\
  \ category 3, at that panel,\n    carrying InitFlag and the 32-bit Damage field from the AI vars,\n\
  (3) queries getCoordinatesForPanels for the world position, (4) spawns a type-1 effect object (spark)\
  \ at those coordinates with flags 0x100000\n    and sprite attribute (flip << 8) + 0x33.\nFields touched:\
  \ oAIAttackVars_AttackElement, oAIAttackVars_StepTimer, oAIAttackVars_HitElement, oAIAttackVars_Damage,\
  \ oAIAttackVars_InitFlag, oBattleObject_CurAnim, oBattleObject_PanelX, oBattleObject_PanelY. Quirk:\
  \ the impact block pushes r7 around the spawnCollisionRegion call because that helper uses r7 as an\
  \ argument register (category), then restores it before the subsequent getFlip call.\n"
