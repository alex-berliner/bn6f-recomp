name: battle_testEntityStateFlag
address: '0x0804691A'
kind: function
status: probable
summary: Returns the first byte (a state/active flag) of the 0x58-byte entry indexed by r0 in the array
  at byte_2011860, as a Z-flag boolean test
interface: (r0 = index into byte_2011860 array) -> r0 = byte value; Z set if byte == 0 (mov pc, lr preserves
  flags)
details: Loads the base byte_2011860, computes base + r0*0x58 with a multiply, and reads the entry's byte
  at offset 0. It returns via 'mov pc, lr' after 'tst r0, r0', deliberately keeping the Z flag so callers
  branch on whether the flag byte is zero. The 0x58-byte stride suggests a table of fixed-size records
  (one per battle entity or task slot) whose first byte is a status/active flag. The caller (a battle
  main-loop function that also dispatches AI and updates sprite graphics) tests entry 3 and, if the flag
  is nonzero, calls sub_811E744. No writes are performed; it is a pure read-and-test helper.
