name: sub_801486C
address: '0x0801486C'
kind: function
status: confirmed
summary: Steps the action timer in two BattleObject slots, triggers beast-out when eligible, and reports whether
  either slot holds a pending (type-assigned-but-idle) entry.
interface: void battle_stepSlotsAndCheckBeastGate_801486C(BattleSlot *slotA /* r6 */, BattleSlot *slotB /* r7 */,
  u32 *result /* r5 */)
details: 'Each slot is read as: byte[0] = type/entry marker (0xFF = empty), byte[4] = action-running flag (0xFF
  = idle), dword[8] = object pointer. For a slot whose action is running (byte[4] != 0xFF) the function calls sub_802DCDE
  to tick the action, then queries canBattleObjectBeastOut on the object pointer; if the gate returns Z clear it
  calls sub_8015994 to initiate the beast-out. For a slot that is idle but carries a type (byte[4] == 0xFF, byte[0]
  != 0xFF) it sets an internal has_pending flag. For a fully empty slot (both 0xFF) it only queries the beast-out
  gate. The same three-branch logic is applied identically to slotB. Finally it writes 4 to *result when any pending
  transition was detected, or 8 otherwise. r10 and lr are taken as inputs (part of the caller''s register context)
  but are not used in the function body.'
