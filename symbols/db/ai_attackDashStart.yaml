    commits the object to the target panel; strh #4 into oAIAttackVars_HitElement: tags the attack''s
    hit element; beq path: mov #0 -> strb HasMoved, bl object_exitAttackState_801171C: aborts attack state
    on panel mismatch; bl ai_attackDashMoveStep on the success path: delegates the actual per-frame dash
