    the per-frame driver. The failure branch clears HasMoved and tears down via object_exitAttackState_801171C,
    implying the panel no longer matches and the attack aborts before moving. A better name reflects the
    setup role.; run wf investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash, revised
