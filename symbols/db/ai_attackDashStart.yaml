  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The control flow is not what the proposal says. The success branch first reserves the panel and
    sets HitElement, then calls sub_8110840, then *calls* ai_attackDashMoveStep which already handles
