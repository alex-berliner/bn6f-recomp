name: ai_attackDashStart
address: '0x081107BC'
kind: function
status: probable
summary: 'Setup handler for an AI dash attack: validates the target panel, and if it still matches reserves
  the panel, records the future coords, sets HitElement=4, finalizes via sub_8110840, and launches the
  per-frame dash move; otherwise clears HasMoved and exits the attack state.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = ...; sets oBattleObject_FuturePanelX/Y, oAIAttackVars_HitElement,
  oAIAttackVars_HasMoved
details: Reads the target panel X/Y and panel-param flag masks from the oAIAttackVars scratch block and
  calls object_checkPanelParameters on that panel. If the panel still matches, it copies the target coords
  into the battle object's FuturePanelX/Y fields, reserves the panel via object_reservePanel, stores HitElement
  = 4, calls sub_8110840 (unexamined), and advances the attack with ai_attackDashMoveStep (moves by velocity,
  commits on timer). If the panel check fails, it clears HasMoved and tears the attack down via object_exitAttackState_801171C,
  implying the attack was interrupted (e.g. panel changed state under it). It is the outer per-frame driver;
  the dash-move logic itself lives in ai_attackDashMoveStep.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#TargetPanelX]/ldrb r1,[r7,#TargetPanelY] + bl object_checkPanelParameters: validates
