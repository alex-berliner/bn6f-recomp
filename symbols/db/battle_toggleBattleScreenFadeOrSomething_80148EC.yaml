open_questions:
- What the two `dispatch_801DACC` payloads (0x4000, 0x20080, plus the battle-mode-driven `0xa0` / `0x90`)
  actually trigger isn't visible from this routine alone; understanding the `0x4000` bitmask in `dispatch_801DACC`
  is needed to name the phase (start-of-beast-sp vs. cleanup) precisely.
