name: battle_objectSetExtraVar3_80E341E
address: '0x080E341E'
kind: function
status: confirmed
summary: Stores a 32-bit value into slot 3 (offset 0xC) of a battle object's extra-vars block used by the AI as
  scratch memory.
interface: void sub_80E341E(struct BattleObject* object, u32 value)
details: Two-instruction setter. r0 is a battle object pointer; r1 is the value to store. Writes r1 to [r0 + oBattleObject_ExtraVars
  + 0xC], i.e. the fourth word of the object's ExtraVars array. The extra-vars block serves the battle AI as general-purpose
  memory cells (counters, state flags, remembered targets), so this is the "set AI scratch variable
