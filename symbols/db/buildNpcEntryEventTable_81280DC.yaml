name: buildNpcEntryEventTable_81280DC
address: '0x081280DC'
kind: function
status: probable
summary: Initializes the NPC entry-event table at unk_2026700 (zero-fills 0x170 bytes) and stamps sequential
  16-bit event numbers into each NPC's two u16 arrays, using three sub-runs with flag masks 0x7000, 0x9000,
  and 0x7000, with per-entry event/flag derived from npc_checkEntryEventFlagOrHidden.
interface: "void buildNpcEntryEventTable_81280DC(u32 start_event /* r0 */, u32 count /* r1 */);\n  //\
  \ out: r2 = 0x7000, r3 = count (event-loop return)\n  // clobbers r0, r2, r3, lr; preserves r1, r4,\
  \ r5, r6, r7; NZCV set by final r3 vs r1 compare\n"
details: "- Zero-fills the table at unk_2026700 with size 0x170 via ZeroFillByByte.\n- Each NPC entry\
  \ occupies 0x5C bytes; the \"high\" half sits at offset 0x2E (= 0x17 << 1) within the entry, mirroring\
  \ the low half.\n- For each of `count` entries, calls npc_checkEntryEventFlagOrHidden with args (event,\
  \ byte_off, 0x7000, idx), returning an adjusted event number in r0 and a (possibly-modified) flag mask\
  \ in r2.\n- Three per-entry sub-runs write paired u16s into the low and high halves:\n    * run 1: 11\
  \ pairs (offsets 0..0x14), mask = callee r2\n    * run 2: 8 pairs (offsets 0x18..0x26), mask = 0x9000\n\
  \    * run 3: 3 pairs (offsets 0x2A..0x2E), mask = 0x7000\n- Each pair stores `event | mask` into the\
  \ low half and `event | mask + 1` into the high half; event then advances by 2 (plus 2 padding between\
  \ runs), and the global event counter carries across entries (never reloaded from the stack).\n- When\
  \ count == 0, the function returns early without any per-entry work.\n- Output r2 = 0x7000 (the run-3\
  \ mask); r3 echoes the loop-end `count`; the final `cmp r3, r1` therefore leaves NZCV reflecting \"\
  count == count\" (ZF set, others cleared).\n"
