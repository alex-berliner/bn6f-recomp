  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/beq branch: element 0 -> strb #4 sets element
    to 4 and loads charge time from tier table into StepTimer; dword_80F7E64 = 0x06060606: every AiDifficultyTier
    yields a 6-frame StepTimer; ldr r0,[r7,#oAIAttackVars_ScratchVar]; ldr r0,[r0]; strb #1,[r0,#0xb]:
    flags a pointer held in ScratchVar when non-null; loophalf: dec StepTimer, ''bgt'' exit, then strh
