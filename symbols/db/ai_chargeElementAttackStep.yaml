name: ai_chargeElementAttackStep
address: '0x080F7E30'
kind: function
status: probable
summary: Enemy AI attack state that starts a charge for element 4 (wood) with a per-difficulty delay,
  then fires by setting hit element 0xC when the timer runs out.
interface: (r7 = object's oAIAttackVars) -> void; no return value
details: Uses r7 as a battle object's AI attack state struct. On entry, if AttackElement is 0 it stores
  4 (wood) into AttackElement, indexes dword_80F7E64 by AiDifficultyTier (all four bytes are 6, so every
  difficulty charges 6 frames) into StepTimer, and if the pointer in ScratchVar dereferences to non-null
  sets byte 0xB of the pointed-to object to 1 (likely marking it/its target as charging or triggering
  it). Once the element is set, subsequent calls just decrement StepTimer; when it reaches zero they write
  0xC into HitElement, which a later step presumably consumes as the attack hit. Runs as one step of the
  battle enemy-AI attack state machine (routes battlesweep/beastsp/chips).
