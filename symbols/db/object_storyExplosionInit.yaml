summary: 'Initializes a story-explosion map object: sets its state byte and copies two params into counters,
  then runs one update step.'
interface: (r0 unused, r5 = map object struct) -> r0 from callee; writes obj+8, obj+0x24, obj+0x28
details: Stores 4 into byte field +8 of the map object at r5 (likely mode/state), reads byte +5 into word
  +0x24 and byte +6 into word +0x28 (params re-widened as counters), then calls the story-explosion update
  routine at 0x080A9908, which burns RNG draws for explosion puffs. Bytes 5/6 in map-object structs are
  typically the spawn parameters, so +0x24/+0x28 are probably timer/duration fields seeded from them.
  Since the update runs immediately after setup, this is an init-and-first-update entry point.
