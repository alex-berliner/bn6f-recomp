name: bgScroll_ResetScrollCBCounters_8080D90
address: '0x08080D90'
kind: function
status: confirmed
summary: Zeroes the eight BG scroll callback counters used by the map/BG scroll system.
interface: void sub_8080D90(void)  // r2 passed in and preserved but unused; clobbers r0, r1, lr, flags
details: 'A tiny reset routine: it loads the address of eBGScrollCBCounters (an 8-byte array, evidently one counter
  per BG scroll callback slot/direction) and calls ZeroFillByByte with length 8 to clear it. Callers invoke this
  with r2 still live (it is preserved across the call), which suggests this is called from inside a larger routine
  that keeps r2 as a scratch/base pointer; r2 plays no role here. Likely run on map/BG state transitions (scene
  load, screen change, or scroll restart) so stale scroll callback counters do not carry over. The counter array
  is the only data touched.

  '
