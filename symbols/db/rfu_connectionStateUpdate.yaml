name: rfu_connectionStateUpdate
address: '0x081475D4'
kind: function
status: probable
summary: 'Per-frame update for the RFU wireless state machine: spin-waits on a busy flag, optionally issues rfu_REQ_disconnect,
  then dispatches on the 16-bit state at eS200BC50+8 across cases 1/3/4/9/0xB/0x22/0x34/0x40 to drive rfu_clearAllSlot,
  sub_8144EF8, sub_8145120, sub_813D934, etc.'
interface: (r0 = context/handle passed through to sub_8144EF8, saved in r5) -> r0 = none; updates state word [eS200BC50+8],
  flags byte_2010368/byte_2010340/byte_2010284
details: 'First it spin-waits on byte_2010368 until it reads non-1, samples Timer2Counter_Reload into sub_81453F0,
  and if byte_2010340 is set issues rfu_REQ_disconnect + rfu_waitREQComplete and clears the flag. If the work struct
  at dword_2010CC0 has byte [0]==1 it sets byte_2010368=1 and calls sub_8144DB0(1). It then runs sub_8147834/sub_8147A84
  and switches on the 16-bit state at eS200BC50+8 (values 1,3,4,9,0xB,0x22,0x34,0x40 are handled; others fall through):
  case 3 runs sub_8144EF8(1,0,0x78,r5) and on failure sets state 4 and clears byte_2010284; case 4 compares byte_2010280
  against the struct''s byte [2] and calls sub_813D934(0xB or 0xC); case 0xB calls eStruct200FE00_setUnk04To15h
  then sets state 0xC; case 0x34 clears all RFU slots via rfu_clearAllSlot plus sub_813D760; cases 9 and 0x40 call
  sub_8145120(0/1) and set state 0xA; case 1 sets state 2 after sub_8144E70(unk_2010350). Case 0x22 checks byte_201028C
  bit 0x80 and byte_200AF85, calling sub_813D98C/sub_813D978 or sub_813D8D0 then sub_813D934(0).'
