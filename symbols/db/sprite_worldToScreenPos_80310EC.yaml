name: sprite_worldToScreenPos_80310EC
address: '0x080310EC'
kind: function
status: confirmed
summary: Converts a sprite object's fixed-point world coordinates into screen coordinates by subtracting the camera
  scroll offsets.
interface: void sprite_worldToScreenPos(struct SpritePos *pos /*r0*/, struct ParentObj *parent /*r5*/, const struct
  WorldCoords *world /*r6*/)
details: 'Reads a camera/screen struct pointer from parent+0x10 and fetches its scroll offsets at +4 (X) and +8
  (Y), shifting each left by 2 (<<2) to get pixel scroll. From the world-coords struct in r6 it takes the base fixed-point
  X/Y at +0x00/+0x04 (1/16384, i.e. asr #14) plus per-object offsets at r0+0x18 / r0+0x1C to produce screen X/Y
  stored to r0+0x00 / r0+0x04; it also takes pre-scaled X/Y at +0x0C/+0x10 (asr #14, no added offset) and stores
  screen results to r0+0x0C / r0+0x10. All subtraction of scroll is applied identically to both the base and scaled
  pairs. No return value; only arithmetic flags are clobbered by the asr/sub sequences.

  '
