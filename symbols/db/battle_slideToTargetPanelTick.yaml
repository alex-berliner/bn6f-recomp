    run wf investigate investigate-20261018-223614'
open_questions:
- What sub_80D1700 (arrival/trigger check), sub_80D172C and sub_80D1784 do, to confirm the arrival behavior
- Which attack/object this is (what linked object id 0x31 renders as) and what ExtraVars bit0, +4, +8
  are set to by the spawner
- No caller known, so the spawn context and the meaning of Param2 are unconfirmed
