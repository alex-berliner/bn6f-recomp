name: ai_swordyTryStepOrFlipDir
address: '0x0810B62E'
kind: function
status: confirmed
summary: Swordy AI step helper — tries the panel ahead via its stored step offset, flipping the direction and retrying
  once if blocked, and reports 0 in r0 when neither direction is open.
interface: 'int ai_swordyTryStepOrFlipDir(BattleObject* obj /* r5 */) — out: r0 (0 when both directions blocked,
  otherwise the last battle_checkAlliancePanelAtObjectPos result), r1/r4 (last check''s values; r4 preserved), r5
  preserved; clobbers r2, r3, flags'
details: 'Battle AI helper (Swordy-type enemy movement). The object''s step offset for the

  direction it wants to move is stored at oBattleObject_ExtraVars+8; it reads that

  value. Calls battle_checkAlliancePanelAtObjectPos(r5), which inspects the panel

  the object would step onto (based on that offset) and returns nonzero with Z

  clear if the panel is open to the object''s alliance. If the check passes, the

  callee''s registers are passed straight through and the function returns.

  If the panel is blocked (Z set), it negates the value at oBattleObject_ExtraVars+8

  (0 - offset), i.e. flips the movement direction, and calls

  battle_checkAlliancePanelAtObjectPos again with the same object pointer. If the

  second check passes, its result is returned; if it also fails, r0 is set to 0

  (no step possible in either direction) and the function returns.

  Quirks: on failure paths the flags and r1 from the last check are still live in

  r1 per the register contract; lr is pushed/popped only to allow the bl calls.

  r4 is clobbered/returned by the callee chain but preserved from this function''s

  own callers'' point of view.

  '
