name: ai_swordyTryStepOrFlipDir
address: '0x0810B62E'
kind: function
status: probable
summary: 'Swordy AI movement probe: validates the panel in the object''s current direction; if blocked,
  flips the stored direction and revalidates, returning 0 if both fail.'
interface: (r5 = battle object) -> r0 = nonzero if a valid panel exists (direction left flipped if it
  was reversed), 0 if blocked in both directions
details: Calls battle_checkAlliancePanelAtObjectPos to test the panel one step ahead per the object's
  stored direction field (oBattleObject_ExtraVars+8, a signed step/direction value). If the check succeeds
  the function returns that nonzero result immediately. On failure it negates ExtraVars+8 — flipping the
  object's horizontal direction — and calls the panel check again. If the second check also fails it returns
  0, leaving the direction flipped. The caller (Swordy attack step at 0x0810B436) uses the result to decide
  whether to advance toward the target or fall back to other move logic.
