name: getKeyedTableEntry_811FB84
address: '0x0811FB84'
kind: function
status: confirmed
summary: Looks up a key ID in one of five key/pointer-list table pairs and returns the pointer for the
  slot indexed by toolkit S2001c04 byte 6.
interface: u32 getKeyedTableEntry(u32 key /* r0 */, u32 tableIndex /* r1 */, Toolkit* toolkit /* r10 */);
  // returns pointer or 0xFFFFFFFF in r0; r2 = key the scan ended on, r3 = slot-list table entry used;
  r4-r7 pushed/popped pass-through; NZCV clobbered
details: 'Generic keyed lookup. tableIndex (r1<<2) selects a pair of parallel pointer tables at off_811FBBC
  (key lists) and off_811FBD4 (slot-list tables). The key list is a word-sized ID array terminated by
  0xFFFFFFFF; each entry walks until its key matches r0. On a match, the slot-list pointer at the same
  index is loaded, indexed by (byte at toolkit->S2001c04_Ptr + 6) * 4, and that word is returned in r0.
  If the requested key is itself 0xFFFFFFFF the scan immediately fails and returns 0xFFFFFFFF. The five
  table pairs hold game data pointers (e.g. byte_86C9D8C/byte_86C9DAC pairs, the 8-entry group around
  dword_86C9108/dword_86C9B54 including comp_86C9AA4 with COMPRESSED_PTR_FLAG, and byte_86DAC40), so different
  tableIndex values pick different data families (two 2-entry lists, one 8-entry list, and two single-entry
  lists). Note some slot lists contain compressed-data pointers (off_811FC20 entry 2: comp_86C9AA4 + COMPRESSED_PTR_FLAG;
  off_811FC84), so callers likely need to decompress the result. r2/r3 leak scan state and are part of
  the observed return contract; r4-r7 are only saved and restored.

  '
