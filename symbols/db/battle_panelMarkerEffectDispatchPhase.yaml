name: battle_panelMarkerEffectDispatchPhase
address: '0x080E60CC'
kind: function
status: probable
summary: 'Phase dispatcher for the panel marker effect battle object: calls the handler matching the object''s
  current phase.'
interface: (r5 = battle object ptr) -> tail-dispatch into off_80E60E0[CurPhase]; returns whatever the
  phase handler returns
details: 'Reads oBattleObject_CurPhase from the battle object in r5, loads a function pointer from off_80E60E0
  at that index, and calls it with mov lr, pc; bx r1 (ARM-mode return via pop {pc}). The table has three
  entries: battle_panelMarkerEffect (phase 0), sub_80E6180 (phase 1), and sub_80E619E (phase 2), so the
  object has exactly three phases. r1 is clobbered as scratch for the table lookup, so handlers receive
  no prepared arguments beyond whatever r5 already holds.'
