    field; off_80E60E0 entry 0 is battle_panelMarkerEffect+1, tying the table to that known object; mov
    lr, pc; bx r1 is the standard Thumb-to-ARM call, so the target is a normal subroutine call, not a
    jump; table has exactly 3 word entries, bounding the object's phase state machine to phases 0-2
