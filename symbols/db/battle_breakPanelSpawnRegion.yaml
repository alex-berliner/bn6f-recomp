name: battle_breakPanelSpawnRegion
address: '0x080DC4DE'
kind: function
status: probable
summary: Spawns a dimming collision region at the break-panel object's tile, using the panel's stored
  parameters, as part of the break-panel object's behavior.
interface: (r5 = battle object) -> r0 = result of object_spawnDimmingCollisionRegion; reads oBattleObject_PanelX,
  PanelY, Element, DamageAndStaminaDamageCounterDisabler
details: 'Reads the object''s panel X/Y and Element, then calls object_spawnDimmingCollisionRegion with
  r3=0, a fixed word 0x00A050301 in r4, a word loaded from the object''s DamageAndStaminaDamageCounterDisabler
  field in r6, and 3 in r7. It sits immediately after battle_breakPanelExpireUpdate (0x080DC484) in the
  same handler, so it is almost certainly a second state/mode of the same break-panel object type. Given
  the caller spawns the break effect, plays sound 0x12E and destroys the object, this variant likely handles
  the persistent side: the dimmed/darkened region marking the affected tile(s) while the broken panel
  state is active. The packed constant 0xA050301 and the value 3 are likely region/visual parameters (the
  3 plausibly a panel or region kind). It is a thin wrapper: no state writes of its own besides argument
  marshalling from the object struct.'
