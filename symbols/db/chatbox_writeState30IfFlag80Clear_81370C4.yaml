name: chatbox_writeState30IfFlag80Clear_81370C4
address: '0x081370C4'
kind: function
status: confirmed
summary: Stores state byte 0x30 at *r5, but only while chatbox flag eFlags2009F38 bit 0x80 is still clear.
interface: void sub_81370C4(u8* dest /* r5 */)  // reads no other inputs, returns nothing, no flags read back
details: 'Tiny conditional store. Calls chatbox_mask_eFlags2009F38 with mask 0x80 to test

  bit 0x80 of eFlags2009F38 (Z set = bit clear). If the bit is clear, it stores the

  byte value 0x30 at the address passed in r5 and returns; if the bit is already set,

  the destination is left untouched. r5 is never reloaded here, so callers set it up

  beforehand; likely points at a per-entity or chatbox state/state-phase byte where

  0x30 is a state value. r1 is preserved across the helper call; r0, lr and NZ flags

  are clobbered.

  '
