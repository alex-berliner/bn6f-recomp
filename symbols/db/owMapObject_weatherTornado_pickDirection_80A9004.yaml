name: owMapObject_weatherTornado_pickDirection_80A9004
address: '0x080A9004'
kind: function
status: confirmed
summary: Picks a new random blowing direction (0-7) for a tornado weather map object, avoiding a repeat of the previous
  direction.
interface: void owMapObject_weatherTornado_pickNewDirection(u8* obj /*r5*/, u8* weatherState /*r6*/) — no return
  value, N/Z/C/V clobbered; preserves r6/r7
details: 'Called for the tornado weather map object when it needs a fresh direction of travel. Requests one random
  value in the range 0..7 from reqBBS_81409D0(8). The tornado object (r5) has a component selector at +4 and stores
  the chosen direction at +5; it also increments a re-pick counter at +0x28 (byte). The weather component state
  (r6) is indexed by obj+4: the entry at 0x31+slot holds the previously used direction, and the entry at 0x19+slot
  is overwritten with its own index (0x19+slot) — this looks like a "slot in use / direction recorded here" marker
  for the weather engine. If the random direction equals the previous one, it is nudged one step on with 7 wrapping
  to 0, so the tornado never keeps blowing the same way twice in a row. The final direction is written both to the
  weather state''s 0x31+slot entry and to obj+5.

  '
