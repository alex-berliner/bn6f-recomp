name: battle_initProjectileAttack
address: '0x080D7420'
kind: function
status: probable
summary: 'First-state routine for a battle attack object: loads its sprite on the current panel, sets
  a table-driven velocity toward the enemy side, computes how long it should fly, plays a sound, and hands
  control to the update state.'
interface: (r5 = battle object) -> r0 = destroyed?(never read); sets oBattleObject velocities, Timer,
  CurState
details: Converts panel position to pixel coordinates, then tries to load sprite 0x6050300 or 0x6050100
  (chosen by Param3) plus collision data; if the panel is invalid or the load fails, it spawns an effect
  object at oBattleObject+0x34 and frees itself via object_freeMemory. On success it sets flag bit1, applies
  palette Param1 via sprite_setPalette, and takes YVelocity from word table byte_80D74D4[Param2] (0xC0000),
  XVelocity = YVelocity * object_getFrontDirection(), nudging X by 2*facing. It requests hit-effect 0xA
  and computes Timer = (0x280000*dist - 2*YVelocity)/YVelocity + 1 via SWI div, where dist is 3 by default
  or, when Param4 != 0, the panel distance from the opposite side's back column (7*(alliance^1) - PanelX)
  — i.e. it flies a fixed panel distance at its current speed. Finally it plays SFX 0x120, sets CurState
  = CUR_STATE_UPDATE, and calls sub_80D74DC.
