name: get_eventFlag215AsBool
address: '0x080AA7AC'
kind: function
status: confirmed
summary: Reads the event flag EVENT_215 (bank 0xD6, index 0x00) from the event flag table and returns it as a 0/1
  boolean.
interface: 'bool get_eventFlag215AsBool(void); // in: none (r10/lr per lifter are incidental), out: r0 = 1 if EVENT_215
  is set, else 0; r4 preserved'
details: Trivial wrapper around TestEventFlagFromImmediate. Saves r4, clears it, calls TestEventFlagFromImmediate
  with the immediate event flag id EVENT_215 (a bank/index pair encoded in one value), and on the nonzero result
  sets r4 = 1. Returns r4 in r0, so the result is strictly 0 or 1 rather than the raw flag word. Z is set by TestEventFlagFromImmediate
  when the flag is clear, hence the beq to the return with 0. Which story/scene event flag id 215 corresponds to
  in game terms is not determined from this function alone.
