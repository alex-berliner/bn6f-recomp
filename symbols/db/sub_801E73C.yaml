name: sub_801E73C
address: '0x0801E73C'
kind: function
status: confirmed
summary: Two-instruction wrapper that invokes sub_801BEC2 with the constant 0x8000 (1 << 15); nothing better than
  "argument-8000 thunk to sub_801BEC2" can be said until the callee is identified.
interface: 'void sub_801E73C(void); // in: lr (return address); out: r0 = 0x8000 (argument forwarded into sub_801BEC2),
  r1/r2 = whatever sub_801BEC2 leaves, nz/c = flags from the final ''lsl r0, r0, #0xf'', lr = 0x0801E747 (BL return
  address)'
details: 'Pure trampoline: pushes lr, builds the otherwise-unencodable Thumb constant 0x8000 as mov r0,#1 / lsl
  r0,#15, then bl sub_801BEC2 and pops pc. The callee itself does not touch the condition flags, so the flags observed
  by this function''s callers are the leftover results of the LSL (N=0, Z=0, C=0), not anything the callee produced
  — any caller reading NZ/C is effectively reading the constant construction, not real status. LR on return holds
  the BL''s own return address (0x801E747), which the GUEST_CALL return trampoline reproduces. The game-level meaning
  of the 0x8000 argument to sub_801BEC2 is unknown; it may be a flag/opcode (bit 15 set) for whatever subsystem
  the callee serves (sound, text, sprite engine, etc.), which should be settled once sub_801BEC2 is named.'
