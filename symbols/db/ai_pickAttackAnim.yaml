    off_810BA10; cmp r0,#0xff; beq ...: 0xFF in the table means ''keep current animation'', other values
    stored to oBattleObject_CurAnim; strb r0,[r5,#0x63] at end stores AttackBoost2 back, making byte 0x63
    the persistent table-slot selector; dword_810BA1C/20/24 data (0xFFFF03FF, 0xFF04FF01, 0xFFFF06FF)
    are rows of anim ids with 0xFF gaps; caller ai_startAttack ''begins a version-dependent enemy attack
    ... selects attack 10'', matching a per-version animation pick'
