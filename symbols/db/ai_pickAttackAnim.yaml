name: ai_pickAttackAnim
address: '0x0810B9EC'
kind: function
status: probable
summary: Looks up a per-version animation id for the enemy's attack by indexing one of three small tables
  selected via a state byte at oBattleObject+0x63, using oAIAttackVars_AttackBoost2 as the version offset,
  writing the result to oBattleObject_CurAnim and stashing the version byte at +0x63.
interface: (r5 = battle object, r7 = AI attack vars) -> sets oBattleObject_CurAnim and byte 0x63 of r5;
  no return value
details: Reads a slot index from [r5+0x63], scales it by 4, and indexes the pointer table at off_810BA10
  to get one of three byte tables (0x810BA1C/20/24, each 4 bytes). It then reads a byte from the selected
  table using oAIAttackVars_AttackBoost2 (likely a version/form byte) as offset; if the value is 0xFF
  the animation is left unchanged, otherwise the value is written to oBattleObject_CurAnim. Finally the
  AttackBoost2 byte is saved back to [r5+0x63], so the next call reads a different row of the table —
  cycling through up to 3 animation variants. The 0xFF padding bytes show each table row holds at most
  two usable anim ids (e.g. row 0 gives 0x03 for one version and none/skip for the other). It is a helper
  of ai_startAttack, which sets up version-dependent enemy attacks.
