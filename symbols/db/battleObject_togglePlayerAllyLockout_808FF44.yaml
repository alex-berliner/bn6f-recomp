name: battleObject_togglePlayerAllyLockout_808FF44
address: '0x0808FF44'
kind: function
status: confirmed
summary: 'Toggles the player battle object''s ally-lockout byte (+5): locks the ally out when the PET menu data
  flag is set, otherwise clears the ally''s AI chip queue and unlocks it.'
interface: void battleObject_togglePlayerAllyLockout_808FF44(u32 object /* r5 */) /* returns r5 = object unchanged
  */
details: "Takes the player battle object pointer in r5 and passes it through unchanged (r5 is\nboth input and output).\
  \ Behavior branches on TestPETMenuDataFlag(1):\n- If the flag is set (Z clear): store 1 to the byte at object+5,\
  \ locking the ally out.\n- If the flag is clear and object+5 is nonzero (currently locked out): call sub_80468BA\n\
  \  (presumably resetting ally AI state), then battleObject_initAIChipQueueSlot_80468C6(0,0,0)\n  to clear the\
  \ ally's AI chip queue slot, then store 0 to object+5 to unlock the ally.\n- If the flag is clear and object+5\
  \ is already 0: do nothing (fall through to return).\nOnly the byte at object+5 is written; no other fields of\
  \ the object are touched.\nClobbers r0-r3 and flags; preserves r4-r7. lr is the return address and r5 is the sole\n\
  meaningful caller register.\n"
