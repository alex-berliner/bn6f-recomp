open_questions:
- Why are r0-r2 saved to the frame at all if every called function takes them in registers? Possibly a defensive
  snapshot for an interruptible callee, or leftover from a register-allocation change in the compiler.
- Which higher-level routine owns the r12 "control word" — is it a per-entity flags field on a map/sprite struct,
  or a global mode register? The ORR 0x3 likely flips two view/camera state bits (e.g. "centered" + "layer 1").
- The r2=0 / r3=0x20 / r5=0x20 / r6=1 / r4=0x40 quadruple is the standard "rect + layer" argument pattern for sub_8030F7C;
  without sub_8030F7C's body we can't say if (0x20,0x20) is a fixed map anchor or a per-call parameter that just
  happens to be the recenter target.
- 'Retype: register form, old prompt; queued for retype (tools/abi/retype_queue.tsv), to be converted again as typed
  C (stages S3/S4)'
