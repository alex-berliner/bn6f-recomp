name: sub_803135E
address: '0x0803135E'
kind: function
status: confirmed
summary: Recenter the overworld/map camera to a fixed 64x32 anchor box and OR 0x3 into the r12 control word
interface: 'void camera_recenterAndSetCtrlBits_803135E(void); /* in: implicit r0/r1/r2/r5/r12/lr snapshot; out:
  r0,r1,r2,r3,r5,r12; clobbers nz,cv,r4,r6-r9,lr; preserves r0,r1,r2,r5 for caller via push/pop */'
details: 'Tail-style thunk that seeds the view via sub_80311B6, asks sub_8030F7C for a

  delta against a 64x32 (0x20 + 0x20 wide, 0x20 tall) box anchored at (0x20, 0x20)

  on layer 1 (r2=0, r4=0x40, r3=0x20, r5=0x20, r6=1), halves the returned dx/dy

  with logical right shifts (lsr r0,r0,#1; lsr r1,r1,#1), and applies the halved

  delta through camera_moveByDelta_80310B0. It then merges bits 0 and 1

  (mask 0x3) into the r12 control word via ORR and returns to the caller with

  the original r0, r1, r2, r5, and lr preserved by the push/pop

  ({r0-r2,r5,lr}/{r0-r2,r5,pc}). The push of r0-r2 is unusual — it gives the

  callee a snapshot frame at SP+0..SP+8 so any callee that reads its incoming

  args off the stack (rather than the live regs) sees the caller''s values.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
