name: sub_802FE48
address: '0x0802FE48'
kind: function
status: hypothesis
summary: Allocates one of 16 ID slots tracked in a bitfield at dword_2009A2C, returning the slot index (or 0xFF
  when all are taken).
interface: 'u32 allocSlotFromBitmap16(void); // in: lr only; out: r0 = slot index 0..15 or 0xFF if full, r1 = updated
  bitmap word, r2 = mask of the bit claimed, r3 = &dword_2009A2C; clobbers NZCV'
details: 'Reads the 32-bit allocation bitmap at dword_2009A2C (EWRAM) and scans it from the top down: mask starts
  at 0x80000000 and is shifted right once per set bit, with the slot counter in r0 incrementing each step. Note
  that although the word is 32 bits, the loop gives up after 16 iterations (slot >= 0x10), so only bits 31..16 —
  the upper half of the word — are ever allocated; the low 16 bits are untouched by this routine and may belong
  to a separate free/deallocate path or another allocator. When it finds a clear bit, it sets it with ORR and stores
  the word back, claiming that slot, and returns the slot index. If all 16 upper-half bits are set it returns 0xFF
  as an "out of slots" error without modifying memory. Per the lifter''s caller analysis, all four return registers
  (r0..r3) are part of the observable contract, so callers apparently reuse r1/r2/r3 (the bitmap value, the claimed
  bit''s mask, and the bitmap address) rather than re-deriving them — which suggests slot deallocation or bookkeeping
  happens inline in the caller. The routine itself is subsystem-agnostic; what the 16 slots identify (objects, effects,
  sound voices, tasks, etc.) is not visible from this function alone.

  '
