name: battle_pickRandomPanelByAllianceParam
address: '0x08114BF0'
kind: function
status: probable
summary: Looks up the panel-effect parameter entry for the battle object's alliance, then returns a random
  panel chosen from that effect's panel list.
interface: (r0 = battle object pointer) -> r0 = picked panel coordinate/pointer; flags set by callees
details: The function passes the battle object (and the table at byte_8114C70) to GetAllianceDependentPanelParamArgs,
  which selects an 8-byte panel-effect parameter entry indexed by the object's alliance field and yields
  a param word plus an args pointer. It then immediately calls the random panel picker sub_8015C94 with
  those results (registers carried over), which applies 'GetPositiveSignedRNG % count' over the filtered
  panel list described by the args and decodes the result into x (low 3 bits) and y (high nibble). The
  return value of sub_8015C94 is passed straight through as this function's return. It is effectively
  a thin wrapper binding an alliance-dependent panel-effect table to random panel selection.
