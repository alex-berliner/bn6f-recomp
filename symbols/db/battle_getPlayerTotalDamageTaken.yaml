name: battle_getPlayerTotalDamageTaken
address: '0x0801055E'
kind: function
status: probable
summary: returns the total damage the player has taken in the current battle
interface: (r0 = alliance flag passed through to battle_findPlayer) -> r0 = player BattleObject's AIData.TotalDamageTaken
details: Calls battle_findPlayer to get the player BattleObject, follows its AIData pointer field (oBattleObject_AIDataPtr),
  and reads the halfword at oAIData_TotalDamageTaken, returning it unchanged. No flags are meaningfully
  set by the function itself; it is a pure accessor. The alliance flag argument is simply forwarded to
  battle_findPlayer to select which side's player to look up.
