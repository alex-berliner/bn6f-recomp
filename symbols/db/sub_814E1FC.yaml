name: sub_814E1FC
address: '0x0814E1FC'
kind: function
status: hypothesis
summary: Recomputes a status byte for the object/state structure in r1 via sub_814E0D0, stores it at +0xF, and sets
  the 0xC flag bits in the control byte at +0.
interface: void sub_814E1FC(u8* state /* r1 */); // calls sub_814E0D0 (result in r3); flags NZ updated from the
  ORed byte
details: 'Wrapper-style tail of a larger state update. It saves LR into r12 (so the callee can be called with the
  original return address preserved), then calls sub_814E0D0, which computes some derived status byte in r3. That
  byte is written to offset 0xF of the structure pointed to by r1. Finally it reads the byte at offset 0 of the
  same structure, ORs in 0xC (two flag bits, likely "active/enabled"-style bits given they are set unconditionally),
  and writes it back. The structure layout (control byte at +0, status byte at +0xF) suggests an object/task/sprite
  state block, but the exact subsystem (sprite, NPC, battle object) is not identifiable from this snippet alone.
  Quirk: r2 is loaded with 0xC purely as a scratch copy after the ORR; the NZ flags are set from the OR result even
  though they appear unused.

  '
