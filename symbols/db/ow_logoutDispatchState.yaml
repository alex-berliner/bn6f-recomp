name: ow_logoutDispatchState
address: '0x080A9ECC'
kind: function
status: probable
summary: Dispatches the logout sequence's current state (0=start effect, 1=middle step, 2=release map
  object) by tail-calling its handler.
interface: (r5 = logout state-machine object; state byte at [r5,#8] selects handler) -> tail-jump to handler;
  returns to this function's caller
details: Loads a handler table at off_80A9EE0, indexes it with the object's state byte [r5,#8], and performs
  a Thumb tail-call via 'mov lr, pc; bx r0', so the chosen handler returns straight to whoever called
  this dispatcher. State 0 = ow_startLogoutEffect, state 1 = sub_80A9F30 (likely the actual logout processing),
  state 2 = ow_releaseMapObject. The object pointer arrives in r5 rather than r0, so callers keep it in
  a callee-saved register. The state byte is presumably advanced by the handlers themselves; the dispatcher
  does not clamp the index.
