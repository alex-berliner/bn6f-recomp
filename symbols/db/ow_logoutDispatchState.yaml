name: ow_logoutDispatchState
address: '0x080A9ECC'
kind: function
status: confirmed
summary: Dispatches a 3-step overworld object logout state machine (start effect, frame tick, release) selected
  by a byte field in the object.
interface: 'void ow_logoutDispatchState(u32 r5 /*object_ptr*/, u32 r10, u32 lr);

  // reads: [r5+8] (u8 state index), jump table at 0x080A9EE0

  // preserves r4-r7 across the indirect call; clobbers r0, r1, nzcv

  // returns via pop {r4-r7, pc}

  '
details: "A thin indirect-call dispatcher for the per-object \"logout\" lifecycle\nthat runs when the player leaves\
  \ an overworld area. The state index is a\nbyte at object+8 (valid values 0, 4, 8) and selects one of three handlers\n\
  from a 3-entry table:\n  0 → ow_startLogoutEffect   – begins the visual/audio logout transition\n  4 → sprite_frameTickMarkState8_80A9F30\
  \ – ticks one animation frame and\n      marks an internal state counter (frame-pipeline for the effect)\n  8\
  \ → ow_releaseMapObject    – frees the map-object slot, final cleanup\nThe function pushes r4-r7 and lr, performs\
  \ mov lr,pc / bx r0 to call the\nhandler, then pops and returns. Because the handlers may clobber r4-r7,\nthe\
  \ push/pop acts as a caller-save guard so that the overworld object-loop\ncode calling this dispatcher sees its\
  \ own saved registers intact.\n"
