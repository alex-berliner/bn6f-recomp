name: object_countdownTimerUntilDestroy
address: '0x080D8EB0'
kind: function
status: probable
summary: 'per-frame update for a timed battle object: runs its update step, decrements its lifetime timer,
  and marks it destroyed when the timer runs out'
interface: (r5 = battle object) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to
  CUR_STATE_DESTROY when the timer expires
details: Calls sub_80D8EC6 first (unknown, likely the object's movement/animation step), then reads oBattleObject_Timer,
  subtracts 1, and writes it back. If the decremented timer is <= 0 (ble), the object's state field is
  set to CUR_STATE_DESTROY so the object is removed next state pass; otherwise it stays in its current
  state. The caller had just set the state to CUR_STATE_UPDATE and moved the object by a direction-indexed
  offset table (values 0x3C/0x46) added to oBattleObject_X, so this looks like a short-lived moving object
  (e.g. a projectile or effect) with a fixed frame lifetime stored in Timer.
