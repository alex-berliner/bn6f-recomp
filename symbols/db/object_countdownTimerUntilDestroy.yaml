    — destroys object when timer expires; caller 0x80D8E90: sets state to CUR_STATE_UPDATE then bl sub_80D8EB0
    — this is the UPDATE-state handler for the object; caller adds off_80D8EA4[frontDir] (0x3C/0x46) to
