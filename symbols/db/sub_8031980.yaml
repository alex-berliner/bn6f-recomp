name: sub_8031980
address: '0x08031980'
kind: function
status: hypothesis
summary: Loads the address of a state/word from RAM into r5 and returns a small mode id (3 for selector 1, otherwise
  2) for the caller to act on.
interface: 'int sub_8031980(int selector); /* returns 3 if selector==1 else 2; also sets r5 = &dword_2013940; flags:
  nz from result, c/v from cmp with 1 */'
details: 'Takes a selector in r0 and compares it against 1 (the CMP result is left in the c/v flags). If the selector
  is 1 it returns 3 in r0; any other value returns 2. Before the comparison it loads dword_2013940 (an IWRAM word
  at 0x02013940) into r5, so the caller receives a pointer to that word in r5 alongside the mode id. The function
  is a tail-less thunk: it pushes lr and returns with pop {pc}, clobbering r0 and r5 but preserving r1-r4. The exact
  game meaning of the ids 2/3 and of dword_2013940 is not visible from this function alone; callers reading r5 and
  branching on the returned value would clarify it (possibly a battle mode or phase selector).

  '
