name: sub_8031980
address: '0x08031980'
kind: function
previous_names: []
status: hypothesis
summary: Returns the chip-lockout colour/state index for a battle object's chip-lockout timer (3 if some condition,
  else 2).
interface: '(r0 = ?) -> r0 = 2 or 3 ; side effects: r5 = dword_2013940 (read once)'
details: "Pure value-encoding helper. Loads the address dword_2013940 into r5 (kept as scratch but unused\n  past\
  \ the load), compares r0 against 1, returns 3 on equal, otherwise 2. Two immediate `pop {pc}`\n  tails, so it\
  \ is a leaf. The contract's `out` shows only r0 plus r5 (callee-saved r5 is also written\n  with the loaded address,\
  \ but no caller snapshots show r5 read afterwards). The captured calls all\n  enter with r0=1 and always exit\
  \ r0=3, which is consistent with r0 being the AIData pointer (the\n  AIData's ChipLockoutTimer / Unk_19 byte is\
  \ what is compared). The function is called from a tight\n  cluster of AIData helper thunks at 0x0803199E-0x08031A5E\
  \ and from sub_8031A5E, all of which pass\n  r5 (AIData pointer) plus a constant in r0; this function probably\
  \ tests `ChipLockoutTimer == 1`\n  to distinguish \"just locked\" from \"already locked\" and returns 3 vs 2 as\
  \ a colour/state code\n  used by the chip-lockout overlay renderer.\n  - r5 = &dword_2013940 (asm ldr r5,off_8031994)\n\
  \  - cmp r0,#1 / beq -> r0=3 / otherwise r0=2\n  - 6/40 captured calls all show r0=1 in, r0=3 out (C flag set),\
  \ confirming the eq path\n"
