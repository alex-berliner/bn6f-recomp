open_questions:
- Whether r0 carries the ChipLockoutTimer value or some other AIData byte; whether r5 is ever
- consumed by callers (it appears only as a scratch-load and the callers all set r5 themselves).
- Naming the return as "colour" assumes it's used by the chip-lockout palette/sprite selector;
- could equally be a state index (2 = locked, 3 = just-locked flash).
