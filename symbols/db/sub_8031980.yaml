name: sub_8031980
address: '0x08031980'
kind: function
previous_names: []
status: hypothesis
summary: Returns one of two hard-coded state word values (3 when r0==1, 2 otherwise) using dword_2013940 as scratch;
  appears to be a battle-AI helper queried with a selector.
interface: '(r0 = selector) -> r0 = 2 or 3; side effects: loads dword_2013940 into r5 (no write observed)'
details: "Prologue: `push {lr}`; loads address `dword_2013940` into r5.\n  `cmp r0, #1` / `beq loc_803198A`: when\
  \ selector==1, sets r0=3 and returns via `pop {pc}`.\n  Otherwise falls through to `loc_803198E`: sets r0=2 and\
  \ returns.\n  Body never dereferences r5, so the loaded global is unused in this function (likely scratch or\n\
  \  referenced by a callee/caller convention for a related family of helpers). Exit flags are --C-\n  (C set) on\
  \ the r0=3 branch (because of the mov r0,#3 in Thumb sets CY=1) and clear on the r0=2\n  branch; all 40 captured\
  \ calls hit the ==1 branch (r0=1 in, r0=3 out), consistent with every\n  caller being a state/lookup helper that\
  \ asks for selector 1.\n  The function is part of a tight dispatcher (9 contiguous sibling wrappers at 0x0803199E,\n\
  \  0x080319B6, 0x080319CE, 0x080319E6, 0x080319FE, 0x08031A16, 0x08031A2E, 0x08031A46,\n  0x08031A5E) all funneling\
  \ into this routine with r0=1, so it likely returns a small enum\n  identifying a battle state (e.g. \"which AI/substate\
  \ word to index\"). Without seeing the\n  dispatcher siblings' code, the exact role (lookup vs constant) is inferred.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `cmp r0, #1` then `beq loc_803198A` (sub_8031980, lines 25245..) shows selector==1 branch. - `mov r0,
    #3` followed by `pop {pc}` is the r0==1 path (asm at loc_803198A). - `mov r0, #2` followed by `pop {pc}` is
    the default path (asm at loc_803198E). - All 6 (of 40) captured entry r0 values are 1 and exit r0 is always
    3 → callers always pass selector 1 and get back 3. - `r2`/`r3` are passed in as (02029f44, 8), (02029e1c, 8),
    (02029f68, 8) — three different EWRAM bases plus count 8 — but r2/r3 are not consumed by this function, so callers
    pass through other context. - `dword_2013940` is loaded into r5 but never read; suggests this is a shim that
    reuses the convention of an adjacent helper family (or the parent caller reloads r5 itself).'
