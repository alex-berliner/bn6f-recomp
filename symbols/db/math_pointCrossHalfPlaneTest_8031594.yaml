name: math_pointCrossHalfPlaneTest_8031594
address: '0x08031594'
kind: function
status: confirmed
summary: Evaluates the cross product of a point against a directed edge and returns 1 when the point falls on the
  negative (clockwise) side, used as the inner test of a polygon/hit-area fill routine.
interface: int math_pointCrossHalfPlaneTest(Point* pt /* r0 = {x, y} */, int ax /* r2 */, int bx /* r3 */, int ay
  /* r4 */, int by /* r5 */); returns 1 if the point is strictly on the negative side of the edge, 0 if on the edge
  or positive side
details: 'Computes dy = by - ay (left in r6), dx = ax - bx (left in r7), and the base term bx*ay - ax*by (left in
  r2), then reads the 32-bit point coordinates from the struct at r0 and accumulates (by-ay)*point.x + (ax-bx)*point.y
  (partially left in r3/r4 for reuse by the caller). The signed sum base + accumulated is compared against zero
  via cmp/bge: a negative result yields r0 = 1, otherwise r0 = 0. This is the standard edge-function half-plane
  test used while rasterizing a polygon (likely a hit/interaction area); the unusual number of live side-effect
  registers (r2, r3, r4, r6, r7) shows the surrounding fill routine reuses these partial cross-product terms instead
  of recomputing them. Uses umull-less 32-bit mul instructions, so intermediate products wrap at 32 bits; the final
  compare treats the sum as signed.'
