name: findFirstEntryWithId_8030B1E
address: '0x08030B1E'
kind: function
previous_names:
- sub_8030B1E
status: probable
summary: Binary-search a sorted {u16 id, u16 offset} table for an id and return its first entry.
interface: (r1 = id, r5 = table header {u32 base; u16 count at +4}) -> r2 = address of the first entry with that
  id, or 0; r8 = base, r3 = final upper bound, r7 = last compared id
details: After a hit it steps back over equal ids to the first one. Used by checkLayerPriority_80318b0 with the
  cell index from sub_80316F8.
