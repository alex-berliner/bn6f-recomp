name: t3_waitForAnyKeyStartFade
address: '0x08038EDC'
kind: function
status: probable
summary: Scene-state updater that waits for any button press, then starts a screen fade and moves to the
  next state.
interface: '(r5 = t3 state struct: +0 = state byte, +4 = frame countdown, r10 = toolkit) -> void; no return
  value'
details: 'Runs once per frame for a t3 cutscene/scene state object. It decrements the halfword timer at
  [r5+4] while it is still positive (clamping at 0). It reads the joypad pressed-edge bitmask via the
  toolkit pointer in r10 and tests it against 0x3FF — every standard button — so any key press triggers
  the branch: SetScreenFade(12, 8) starts a fade with those parameters and the state byte at [r5] is set
  to 8 to switch to the next state handler. Every frame it also refreshes the BG tile strip via t3_loadBackgroundTiles
  and calls sub_8039198 (unknown, likely more per-frame scene drawing/updating). The 0x3FF mask means
  the timer and drawing merely delay until the player presses anything.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r5,#4]; sub r0,#1; strh r0,[r5,#4] — per-frame countdown in the state struct; ldrh
    r0,[r0,#oJoypad_Pressed]; tst against dword_8038F08 = 0x3FF — reacts to any pressed button; bl SetScreenFade
    with r0=0xc, r1=8 then strb #8,[r5] — start fade and advance state byte; bl t3_loadBackgroundTiles
    every call — keeps the scene background tiles loaded; bl sub_8039198 every call — second per-frame
    scene update helper'
