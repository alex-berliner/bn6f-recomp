status: hypothesis
summary: Returns a small-table byte indexed by byte at offset 0x12 of an object pointed to by r5 (also exposes the
  table pointer in r1).
interface: "u32 lookupByteFromField12_81322B8(const void* obj /* r5 */)\n  // in:  r5 = object pointer\n  // out:\
  \ r0 = byte_81322C4[ obj->byte_0x12 ]\n  //      r1 = &byte_81322C4 (base of lookup table)\n"
details: 'Thumb function at 0x081322B8. Loads the byte at offset 0x12 from the object in r5 as an

  unsigned 8-bit index, then returns byte_81322C4[index] in r0. The table address is also

  materialised in r1 (via the literal pool at off_81322C0 -> byte_81322C4), so callers receive

  both the looked-up value and the table base. The table itself contains four entries:

  0x18, 0x18, 0x1C, 0x00. Function is a tail with `mov pc, lr` and has no stack usage; r5 and

  lr are the only inputs consumed, no other registers are clobbered. Likely a property/dispatch

  helper where the small range of possible values at field 0x12 maps to a few constants (size,

  state, or sprite variant).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
