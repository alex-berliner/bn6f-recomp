name: sub_80C829C
address: '0x080C829C'
kind: function
status: confirmed
summary: Run one frame of battle object logic for the object in r5, then call its generic destructor.
interface: 'u32 battle_stepAndDestroyObject_80C829C(void);

  // in:  r5 = object pointer (carried over from caller)

  // out: r5 = returned from object_genericDestroy (state left in r5 by the destructor)

  // clobbers: r0-r3, lr, n, z, c, v

  // preserves: r4, r6, r7

  '
details: 'Thin adapter/stub that forwards the in-register object handle (r5) through two

  sequential calls: battle_runObjects_80C8368 ticks the object''s per-frame logic

  (the standard "run" pass used by the battle object framework, matching the

  sub_80C8244/sub_80C826C/etc. family of battle object helpers), then

  object_genericDestroy is invoked to tear it down. Register-form calls because

  object lifetime in this engine is threaded through r5 rather than a fixed ABI.

  No other object fields are touched directly; everything goes through the two

  callees, and r5 is preserved only as the destructor''s return value rather

  than re-loaded.

  '
