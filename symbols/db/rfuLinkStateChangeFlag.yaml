summary: 'Proposed name: rfuLinkStateChangeFlag. RFU wireless-state change synchronization flag (u8)'
details: A one-byte flag used by the RFU link layer to coordinate wireless-state changes. rfu_connectionStateUpdate
  spin-waits while it equals one before proceeding with connection-state processing. The flag is also
  set to one before sending link state and cleared during link-event dispatch, indicating a pending synchronization
  or transition.
