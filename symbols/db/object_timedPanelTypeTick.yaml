name: object_timedPanelTypeTick
address: '0x080D6E70'
kind: function
status: probable
summary: Battle-object tick handler that turns the object's panel into panel type 7 for Param2 frames,
  dropping it from collision (hole-like) and destroying itself when time runs out.
interface: (r0 = unused/phase scratch, r5 = battle object ptr) -> void; sets object phase, collision region,
  panel type, timer; destroys object at end
details: On phase 0 it sets CurPhase to 4, puts the object in collision region 1, calls object_setPanelType
  with r2=7 at the object's PanelX/PanelY, and loads Timer from Param2. While running (phase 4) it reads
  CollisionDataPtr's flags; if the object has been collided with it calls object_clearCollisionRegion.
  It decrements Timer each frame; when it hits zero it clears the collision region again and writes CUR_STATE_DESTROY
  into CurStateActionPhaseAndPhaseInitialized, despawning the object. The pattern (temporary panel override
  + object removed from its region) matches a panel-removal/hole style effect where things standing on
  it stop being collidable.
