name: battle_attackUpdateOnHitFrame_8111A72
address: '0x08111A72'
kind: function
status: confirmed
summary: On the sprite frame flagged as the attack frame, switches a battle object to its attack animation, sets
  the hit element, and advances its movement step.
interface: void sub_8111A72(r5=battleObject*, r7=aiAttackVars*) -> r1 (movement-step result, or 0x80 if frame bit
  clear), r5 (object ptr passthrough)
details: 'Checks the object''s current sprite frame via sprite_getFrameParameters; bit 0x80 of the returned frame
  parameters marks "attack" frames. If the bit is clear the function does nothing and returns (r1 ends up holding
  the 0x80 mask, r5 untouched). If set: writes animation id 2 to oBattleObject_CurAnim, writes element 8 to oAIAttackVars_HitElement
  (halfword), then calls battleObject_performMovementStep_8111A8C to execute the attack''s movement step, propagating
  its r1/r5 outputs. Preserves r4 and r6. Likely a per-frame update handler for one specific AI attack (element
  8) whose attack pose is animation 2.

  '
