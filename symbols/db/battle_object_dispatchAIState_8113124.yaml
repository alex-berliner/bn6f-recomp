open_questions:
- The exact meaning of AIState byte index 0 (r6 + oAIState_Unk_00 = 0x60) is unknown; the actual `AIState`
  struct (oAIState=0x80 in AIData) is not accessed here. The 0xa000 flag mask meaning is also unverified
  — could be OBJECT_FLAGS_AIRSHOE|FLOATSHOE if read elsewhere, but those are 0x10|0x20 not 0xa000. Settling
  this would require reading the full `object_getFlag` helper.
