name: battle_stateFallToGround
address: '0x080D5482'
kind: function
status: probable
summary: Battle-object action state that descends the object to the ground over ~25 frames, then lands
  it and switches to action 8.
interface: (r5 = battle object; r0 = phase on entry) -> r0 = collision data pointer on landing; flags
  from timer decrement
details: 'This is a per-frame phase handler for a battle object in r5. On phase 0 it initializes: writes
  phase 4, enables the sprite shadow via sprite_hasShadow, loads a fall-speed constant from a literal
  pool word into oBattleObject_ZVelocity, and sets oBattleObject_Timer to 0x19 (25 frames). In the falling
  phase it subtracts ZVelocity from oBattleObject_Z each frame and counts the timer down; when it reaches
  zero the object lands: Z is clamped to 0, object_setCollisionRegion is called with region 1 (occupying
  its panel), oBattleObject_CurAction is set to 8, and the phase/phase-initialized halfword is cleared.
  The shadow being turned on suggests the object starts airborne with its shadow hidden and this state
  brings it down onto a panel.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb [r5,#oBattleObject_CurPhase] + tst splits init (phase 0) vs. ongoing fall (phase 4); init
    block: bl sprite_hasShadow, ZVelocity = byte_80D5574, Timer = 0x19; fall block: Z -= ZVelocity each
    frame, timer decremented with bgt keeping state active; landing block: Z = 0, mov r0,#1 then bl object_setCollisionRegion,
    CurAction = 8, phase cleared; uses only battle-object struct fields (CurPhase, ZVelocity, Z, Timer,
    CurAction), confirming a battle subsystem handler'
  refs:
  - bn6f/asm/asm31.s:63877
  - 0x0801A07C object_setCollisionRegion
  - 0x08002E3C sprite_hasShadow
