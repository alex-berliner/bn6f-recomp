name: battleObject_setSpriteCoordsFromEStructEntryIfActive_81171D4
address: '0x081171D4'
kind: function
previous_names:
- sub_81171D4
status: probable
summary: If the eStructArr2008450 entry `r2` is in use, copies the saved (r0, r1) position into the object's
  sprite sub-entry X/Y fields via sprite_setCoordinates.
interface: '(r0 = posX/u16, r1 = posY/u16, r2 = eStructArr2008450 index, lr = return) -> r0 = r0 (unchanged),
  flags unknown; side effects: writes object sprite X/Y for object at eStructArr2008450[r2] when its in-use
  flag is non-zero'
details: "Pushes r4-r7/lr, allocates 8 bytes of stack scratch, saves r0 at [sp+0] and r1 at [sp+4].\n\
  \  Loads r2 into r0 and calls getStructFrom2008450(r0=r2), which returns the in-use/status byte of\n\
  \  eStructArr2008450[r2] in r0 with NZ flags set from that byte.\n  `beq loc_81171EE` skips the sprite\
  \ write when that byte is 0 (entry not in use).\n  When non-zero, it restores r0/r1 from the stack (the\
  \ original entry r0/r1) and calls\n  sprite_setCoordinates(r0=posX, r1=posY, r5=in-use byte saved earlier).\
  \ The save of r1 into r5\n  before the call (`mov r5, r1`) is the only preserved callee-saved reg used;\
  \ the r5 live-out is\n  why the contract lists r5 as an output. Restores stack, pops r4-r7/pc.\n  Net\
  \ effect: gate sprite X/Y assignment on whether the eStruct entry is currently active.\n  Caller `battle_alignRowCheck_81348DC`\
  \ passes the desired panel/screen coordinates and the\n  object's eStructArr index after a row-alignment\
  \ check.\n"
