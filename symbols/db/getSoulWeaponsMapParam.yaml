name: getSoulWeaponsMapParam
address: '0x0814278C'
kind: function
status: probable
summary: Returns a per-map parameter byte (0x7,0xB,0xC,0xD,0xE,0x10,0x14,0x14) for the current SoulWeapons
  map, using GetSoulWeaponsMapIndex as the lookup index.
interface: (takes args passed through to GetSoulWeaponsMapIndex, likely r0 = map or weapon id) -> r0 =
  byte_814279C[index]; flags from the ldrb
details: Calls GetSoulWeaponsMapIndex to compute an index (0-7), then returns byte_814279C[index], an
  8-entry table with values 0x7,0xB,0xC,0xD,0xE,0x10,0x14,0x14. The table likely holds an event/cutscene
  or BBS-request parameter associated with each SoulWeapons map. It is a trivial lookup wrapper used by
  soulWeapons_apply_8142510 and two small helpers at 0x814270A/0x8142734. No state is modified; it is
  a pure getter.
