name: sub_8129B90
address: '0x08129B90'
kind: function
status: confirmed
summary: Requests chip-use state 2 and, on success, initialises the chip-selection counter slots on the given control
  struct.
interface: 'void chipSelectInit_8129B90(void /* r5 = control struct* */);

  // in:  r5 (struct ptr), lr

  // out: r4, r5, r6 (preserved)

  // clobbers: r0-r3, lr; flags nz, c, v

  '
details: "Calls sub_812B318 with argument 2 to request chip-use state 2; bails out if the\ncall returns nonzero.\
  \ On success it sets several byte fields on the struct\npointed to by r5:\n  [+0x1D] = 3   (chip-selection slot\
  \ / selected index)\n  [+0x02] = 4\n  [+0x03] = 0x10\n  [+0x12] = 0   (counter low)\n  [+0x13] = 0   (counter\
  \ high)\nThe zeroing of +0x12 and +0x13 (plus the `mov r0,#0` that precedes them) is a\nchip-select counter reset;\
  \ +0x1D is the slot index used during chip selection.\nFunction only writes, never reads, the struct, consistent\
  \ with an initialiser.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
