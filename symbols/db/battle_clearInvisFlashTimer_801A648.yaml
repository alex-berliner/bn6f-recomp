name: battle_clearInvisFlashTimer_801A648
address: '0x0801A648'
kind: function
status: confirmed
summary: Ends a fighter's post-hit flashing-invisibility by clearing the flash countdown in its collision data,
  once the hit flag is set and no persistent invisibility remains.
interface: battle_clearInvisFlashTimer(battleObj r5, battleState r10) -> collisionData r3
details: 'Called per battle object with r5 = battle object and r10 = the battle state that

  battle_isPaused examines. First bails out if the battle is paused. Loads the object''s

  collision data via oBattleObject_CollisionDataPtr, then reads

  oCollisionData_FlashingInvisTimer (halfword). If the timer is nonzero, checks

  oCollisionData_FlagsFromCollision: requires the got-hit flag (0x4) to be set and the

  persistent-invisibility flag (0x1000, from off_801A7BC) to be clear; then writes 0 to

  oCollisionData_FlashingInvisTimer, stopping the flicker. In all early-exit paths r3 is

  simply left holding the collision data pointer from the load (or the incoming value if

  the paused check returned before it, per the lifter contract).

  '
