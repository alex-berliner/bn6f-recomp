name: e_compareLinkStates
address: '0x08132430'
kind: function
status: probable
summary: Compares two eLinkState records' state halfwords at offset +8; returns 0xFF if neither exceeds
  2, else uses sub_803DD60's result to pick priority and returns 1-4 ranking (8 on priority side = 1,
  8 on other = 2, 4 on other = 3, 4 on both = 4).
interface: (r0 = pointer to two consecutive 16-byte state records, state halfword at +8 in each) -> r0
  = 0xFF if both states <= 2, else 1..4 ranking the two states (8 beats 4); calls sub_803DD60 to pick
  which record is checked first
details: 'Scans exactly two 16-byte entries (r0 and r0+0x10), counting entries whose halfword at +8 exceeds
  2; if the count is 0 it returns 0xFF immediately. Otherwise it calls sub_803DD60 and, depending on its
  nonzero/zero result, evaluates the first record''s state before or after the second''s — so sub_803DD60
  decides priority when both sides qualify. The ranking is: state 8 on a side yields 1 or 2 (that side
  first), state 4 on the second yields 3, and 4 on both yields 4. Values other than 4/8 (but >2) fall
  through to 0xFF. The struct layout matches eLinkState records used by the link-comm callers.'
