name: ai_attackHitFrontPanel
address: '0x0810BA58'
kind: function
status: probable
summary: AI enemy attack handler that strikes the battle panel directly in front of the attacker with
  the attack's damage, element and boost values.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = result of sub_80D924E; no flags kept
details: Reads a packed damage value (oAIAttackVars_Damage | ExtraDamage<<16) from the AI attack-var struct
  in r7 and computes the target panel as PanelX + object_getFrontDirection()'s ±1 facing offset. A 4-byte
  table (dword_810BA90, signed bytes -1/0/1/0) indexed by oAIAttackVars_AttackBoost2 supplies the Y offset
  added to PanelY, so the boost field here doubles as a row selector. It then calls sub_80D924E with r0
  = target X, r1 = target Y, r2 = oBattleObject_Element, r3 = object+0x64, r4 = AttackBoost2, r5 = object,
  r6 = packed damage — i.e. extra args beyond the four registers. dword_810BA88 (0xFF050002) sits in the
  trailing literal/data pool and likely belongs to a neighboring attack-definition table rather than this
  routine.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r7,#oAIAttackVars_Damage]/ExtraDamage loads the attack's packed damage from the AI
    attack vars; bl object_getFrontDirection then add r0,r0,r1 targets the panel one step in the object's
    facing direction; ldrsb r1,[r1,r2] on dword_810BA90 indexed by oAIAttackVars_AttackBoost2 yields a
    Y offset of -1/0/1 added to PanelY; r2 = oBattleObject_Element and r3 = object+0x64 plus r6 = damage
    are passed to sub_80D924E as the hit parameters
