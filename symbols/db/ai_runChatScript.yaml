name: ai_runChatScript
address: '0x08089CA4'
kind: function
status: probable
summary: Wrapper that forwards r0 (script index) and the TextScriptArchive* at [r5+0x30] to chatbox_runScript,
  queuing the AI-controlled entity's dialogue script.
interface: (r0 = script index u8; r5 = AI/context struct whose +0x30 holds TextScriptArchive*) -> r0 =
  chatbox_runScript return; calls chatbox_runScript(archive=[r5+0x30], idx=r0)
details: 'Six-instruction wrapper: r0 (script index) is moved to r1, the archive base pointer is loaded
  from offset 0x30 of the r5 context structure, and chatbox_runScript is called to reset the chatbox and
  queue the text. All captured callers are AI state handlers (including ai_chipLockoutWaitState, which
  apparently makes the enemy speak once the chip lockout expires), so r5 is the shared AI/object context
  and +0x30 holds that character''s dialogue archive. No other state is touched. The r5 dependence makes
  it a context-relative helper rather than a general-purpose script runner.'
