name: battle_loadBgTileset_801DE82
address: '0x0801DE82'
kind: function
status: confirmed
summary: Loads the battle background tileset into VRAM and marks it as initialized.
interface: void battle_loadBgTileset_801DE82(SceneStruct *scene /*r5*/)
details: 'Reads the tileset page selector (byte at scene+0x18). A value of 0 is remapped

  by subtracting 2 so the subsequent (page-1)*32 arithmetic wraps into a

  negative index into the page table at byte_86E1CD8, effectively selecting a

  special/offset entry. The selected 32-byte row (likely tile-format/VRAM

  metadata) is queued via QueueEightWordAlignedGFXTransfer into the tile

  transfer buffer at unk_3001A80. CopyBackgroundTiles is then called with

  (j=6, i=0, block=3, tileIds=word_801EDB4, jSize=0x12, iSize=2) to blit a

  6×2 grid of 32×32 tile blocks into BG VRAM block 3. Finally, bit 0x11 is

  set in the loaded-flag structure (via flagSetBits_eStruct2035280_801BEB8),

  preventing this tileset from being reloaded. The function preserves r4, r5,

  r6, r7 (pushed/popped) but leaves r0–r3 and flag bits in the clobbered

  state from its callees.

  '
