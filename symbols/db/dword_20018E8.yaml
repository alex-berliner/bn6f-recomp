name: dword_20018E8
address: '0x020018E8'
kind: ram
status: probable
summary: Third RNG state (u32), stepped by the same recurrence as the primary; only dead_rng_800157C touches
  it and nothing calls that, so it never advances in play.
details: Holds a 32-bit state stepped exactly like ePrimaryRngSeed (x' = (rotl(x,1) + 1) ^ 0x873CA9E5).
  Its only reader/writer is dead_rng_800157C, which has no caller in bn6f, so the third generator stays
  at its boot value during play.
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: dead_rng_800157C is the only code that reads or writes it (the recurrence loads/stores it),
    and a grep over bn6f/asm finds no call to that routine.
  refs:
  - bn6f/asm/asm00_0.s
  - vidsync docs/vidsync/BN6F_SYMBOLS.md
  reproduce: grep -n -A10 '^dead_rng_800157C:' bn6f/asm/asm00_0.s; grep -rn 'bl dead_rng_800157C' bn6f/asm
  result: the routine's only memory access is dword_20018E8; no calls found
