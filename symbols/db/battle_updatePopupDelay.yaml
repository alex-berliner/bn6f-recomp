name: battle_updatePopupDelay
address: '0x0811B620'
kind: function
status: probable
summary: 'Per-frame update for a battle object''s number/text popup: counts down a delay, and when it
  expires copies the base delay and runs the queued glyph load, text-row render, and sprite setup.'
interface: (r5 = battle object/popup state struct) -> void; flags from the timer decrement (bgt)
details: Decrements the halfword countdown at struct+0x12 each call and returns early while it is still
  positive (bgt). On expiry it reloads the delay from the signed halfword at +0x10 into +0x14 (likely
  resetting/extending the timer field used elsewhere), clears the byte flag at +0xA, then calls sub_811B6E0,
  battle_loadQueuedTextGlyph, text_renderListEntry, and battle_setupObjectSpriteFromEntry in sequence.
  The callees all operate on the entry selected from the word_2023FA0 table for the current battle object,
  so the struct is the object's popup/state record. This is the 'delay elapsed' branch of a popup state
  machine; the +0x12 field is re-armed from +0x10 rather than zeroed, suggesting repeating or chained
  pops.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r5,#0x12]; sub r0,#1; strh; bgt locret — gated on a per-object countdown; ldrsh r0,[r5,#0x10];
    strh r0,[r5,#0x14] — copies base delay into active timer field on expiry; strb r0(=0),[r5,#0xa] —
    clears a state/active byte in the same struct; calls battle_loadQueuedTextGlyph + text_renderListEntry
    + battle_setupObjectSpriteFromEntry — all documented as acting on the current battle object via the
    word_2023FA0 entry
  refs:
