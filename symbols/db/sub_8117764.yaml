name: sub_8117764
address: '0x08117764'
kind: function
status: hypothesis
summary: Trivial thunk that always returns the constant 9 (with flags set from it), likely one of a family of hardcoded
  value getters.
interface: int battle_returnConstant9_ADDRESS(void) /* returns 9; also sets N/Z from the returned value */
details: 'Two-instruction function: loads r0 = 9 and returns to the caller via lr, so N and Z are updated from the
  value 9 (negative clear, zero clear) as a side effect. Nothing else is touched - no memory, no other registers.
  Given the tiny size and the flag side effect, this looks like a hardcoded getter / constant-return stub, the kind
  of thing used where callers branch on the result (e.g. a mode/stage/element/count value that is fixed for this
  variant, possibly version-specific behavior in the Falzar ROM). Without caller context the meaning of the value
  9 cannot be pinned down.

  '
