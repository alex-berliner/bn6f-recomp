name: ai_testMapGroupEventFlag
address: '0x0808CF34'
kind: function
status: probable
summary: Returns whether the event flag associated with the current map group's AI mode is set.
interface: () -> r0 = 1 if event flag table[aiMode] is set, else 0; ZF clobbered by TestEventFlag
details: Calls ai_getAIModeForMapGroup_808D084 to get the current map group's AI mode selector, shifts
  it left once (u16 stride), and indexes the halfword table at byte_808CF84 to obtain a flag ID. Passes
  that ID to TestEventFlag and returns 1 in r0 if the flag is set, otherwise 0; r4-r7 are preserved. The
  table at 0x808CF84 maps AI modes/map groups to story-flag IDs, so this is a per-map conditional check.
  Its only known caller, init_beastSpScenario, uses it as part of deciding how to initialize the Beast+
  special-scenario mode.
