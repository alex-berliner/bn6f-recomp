name: ai_testMapGroupEventFlag
address: '0x0808CF34'
kind: function
status: confirmed
summary: Tests the event flag assigned to the current map group's AI mode and returns 1 if it is set, 0 otherwise.
interface: 'int ai_testMapGroupEventFlag(void); /* in: r10 = map group context used by ai_getAIModeForMapGroup_808D084,
  lr = return; out: r0 = 1 if the group''s event flag is set else 0; r7 passed through unchanged; clobbers r1, r3,
  flags */'
details: 'Calls ai_getAIModeForMapGroup_808D084 to get an AI mode index (doubled via lsl #1 to index u16 entries),
  loads a u16 flag id from a table at byte_808CF84 selected by that index, then calls TestEventFlag with that flag
  id. Sets the result to 1 when TestEventFlag returns with Z clear (flag set), 0 otherwise. The flag table byte_808CF84
  holds one event flag per AI mode, so this answers "has this map group''s AI-mode event happened yet?". r4-r7 are
  saved; r4 is the result accumulator, r7 is untouched and effectively a passthrough for callers that keep a value
  there. No error handling for out-of-range mode indices.'
