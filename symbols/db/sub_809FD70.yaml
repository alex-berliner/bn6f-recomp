name: sub_809FD70
address: '0x0809FD70'
kind: function
previous_names: []
status: probable
summary: Rolls the gold mystery data at the start of each mystery data roll, picking a GoldMysteryDataEntries record
  (map) by weight and a contents index from its table, into byte_2000210+2..+5, and clearing +6.
interface: '() -> nothing meaningful. Writes byte_2000210 +2 (u8 contents index), +3 (u8 record index), +4 (u16
  map: group in +4, map number in +5) and clears +6 (u16). Preserves r4-r7; r0-r3 and flags clobbered. Uses 0x30
  bytes of stack. Two weighted picks (pickWeightedIndex_8000E3A, the second through sub_809FA68), each advancing
  the primary RNG 2 + (rng >> 30) + (iCurrFrame & 3) times.'
details: "- Clears byte_2000210+2 (strb) and +6, +4 (strh); +3 is not cleared, only written.\n- Walks GoldMysteryDataEntries,\
  \ 12-byte records {u32 map, table pointer, u32 weight}, until a record whose first\n  word is 0, copying the low\
  \ byte of +8 into a stack weight buffer, and calls pickWeightedIndex_8000E3A. The index\n  goes to +3 and the\
  \ low halfword of the record's first word to +4.\n- Calls sub_809FA68(r0 = 0, r1 = the record's table at +4, r2\
  \ = a 16-byte 0xFF-filled list): no placement pick,\n  a contents pick over the table with nothing excluded. The\
  \ contents index (r1) goes to +2.\nThe fields after this roll, from the code that reads them:\n- mysteryData_processMapGroups_809F9DC\
  \ calls this first, then for each internet map calls\n  record_writeU16IfIdMatches_809FDCE(group, map number,\
  \ count of type-5 records on that map), which writes the\n  count to +6 when group | map << 8 equals +4. Then\
  \ rollInternetMysteryData_809FDE0 (if +6 is not 0) picks one of\n  those records uniformly and replaces +6 with\
  \ its mystery data id, or 0.\n- goldMysteryData_GetEntryDataIfIdMatches_809FE44: for the id in +6, returns the\
  \ table of record +3 (r4) and\n  the contents index +2 (r3). sub_809FE5E and sub_809FE7A read +4/+5 (and +2).\n\
  So +4/+5 is the map holding the gold mystery data, +6 which of its green records becomes gold, +3 the gold\nrecord\
  \ and +2 what the gold one contains.\nGoldMysteryDataEntries has 27 records: 18 for maps (groups 0x90-0x96, weight\
  \ 0x20 each) and 9 with map 0x0001\n(weight 0xC0, table byte_80A3570). Map 0x0001 is group 0x01, a real-world\
  \ group, which never matches the\ninternet groups record_writeU16IfIdMatches_809FDCE is called with, so +6 stays\
  \ 0 for those and no gold\nmystery data appears: with weights 18*0x20 = 576 and 9*0xC0 = 1728, no gold in 3 rolls\
  \ out of 4 (reading of\nthe data, not observed).\n"
