open_questions:
- The exact meaning of state byte 0xd (4 = "closing", 3 = "fully closed"?). I infer 4 from the close-branch
  write, but the post-clamp value 0x1e vs the AnimOpenCounter interpretation is not directly visible.
- Whether r7 is the submenu state struct (oSubMenu is only 0x50 bytes) or a sub-struct (the offsets used
  here are 0x18/0x1a/0xd which fit). The captured calls don't decode the 0x40 bytes at r0/r1, so the struct
  identity is inferred from the call sites (sub_81341A0, sub_8134310 are submenu renderers).
