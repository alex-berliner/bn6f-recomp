name: battleObject_submenuFolderEditTick_81338D4
address: '0x081338D4'
kind: function
status: confirmed
summary: Per-frame tick of the in-battle folder-edit submenu object, animating the panel's slide-in/slide-out and
  driving the submenu render/update pipeline each frame.
interface: u32 battle_submenuFolderEditAnimateTick_81338D4(u32 r5 /* battle/submenu object, updated by callees */,
  u32 r10); // returns r5 unchanged (r7 copy is clobbered by callees; caller's r5 restored via pop {r4-r7}); clobbers
  nzcv, r0-r3, lr; preserves r4-r7
details: 'Treats r5 as the submenu/battle object (r7 = r5 work copy). First copies the slide value at halfword +0x18
  into +0x1A (previous-frame snapshot). Then a small two-way slide state machine keyed on the state byte at +0xD:
  when +0xD != 4 (opening), the signed slide value is incremented by 2 each frame and clamped at 0x1E, at which
  point byte +0x3 is set to 4 (fully-open state); when +0xD == 4 (closing), the slide value is decremented by 2
  each frame, and once it goes below 0 it calls entity_setLookupEntryStateFromFlag_8117D10(0,3) (releasing the lookup-entry
  slot / notifying the entity machinery with state 3) and resets halfword +0x18 and byte +0x3 to 0. After the state
  machine, it runs the standard submenu update pipeline with r5 threaded through (each callee may update it): sub_8133E88,
  submenu_clearBgIfClosed_8134594, battleObject_runBeastStatusEffect_81345B0, object_resolveTableEntryByIndex_8134538,
  object_resolveTableEntryWrapper_8134548, battleObject_submenuRenderFolderAndChips_81341A0, battleObject_drawFolderEditScreenGfx_8134310,
  battleObject_alignRowOffsetCheckSN3_81353DC, and finally pokes the AI turn handler twice with battle_aiRunTurnHandler_81353F0(5,0)
  then (6,1). Fields touched: object +0x18/+0x1A (slide current/previous), +0xD (open/closing state), +0x3 (submenu
  state byte).

  '
