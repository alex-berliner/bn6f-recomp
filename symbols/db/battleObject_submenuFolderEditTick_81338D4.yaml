name: battleObject_submenuFolderEditTick_81338D4
address: '0x081338D4'
kind: function
previous_names:
- sub_81338D4
status: probable
summary: 'Per-frame tick for the in-battle submenu folder-edit screen: animates the folder panel, then
  redraws the scrolling background, submenu bg, folder/chip graphics and dispatches chip-select AI ticks
  for slots 5/6.'
interface: (r5 = submenu state ptr, r10 = toolkit ptr, lr = return) -> no meaningful return; side effects
  mutate submenu state, BG, submenu GFX, dispatch chip-select AI updates
details: "- At entry r5 is the submenu struct; r10 is the toolkit (r5 is moved to r7 right away to preserve\
  \ r5 across the bl calls at the bottom).\n  - Copies the current animation/animation-state field (r7+0x18)\
  \ into r7+0x1a, then inspects r7+0xd (state byte). State 4 means \"closing\" and the function walks\
  \ the animation counter from current toward 0 by 2 per frame, then calls entity_setLookupEntryStateFromFlag_8117D10(r0=0,\
  \ r1=0) to clear the linked entity when it underflows; any other state walks the counter toward 0x1e\
  \ by +2 per frame and clamps at 0x1e (with state byte 4 written on clamp).\n  - After the animation\
  \ tick, calls sub_8133E88 (two-layer scrolling BG redraw into tile block 1) and the per-frame \"if not\
  \ open, clear submenu BG\" routine submenu_clearBgIfClosed_8134594, then sub_81345B0 (which the project's\
  \ hypothesis describes as a fixed-arg sprite/effect init, ID 0xF3 type 0x16).\n  - Then object_resolveTableEntryByIndex_8134538,\
  \ the 0x182/0x1C/0x28/0x2E thunk sub_8134548, the folder+chip render battleObject_submenuRenderFolderAndChips_81341A0,\
  \ the folder-edit screen GFX draw battleObject_drawFolderEditScreenGfx_8134310, and the wrapper sub_81353DC\
  \ (a 0x24/0xA5/0x28/4/6 fixed-arg call).\n  - Finally it dispatches two battle_aiRunTurnHandler_81353F0\
  \ calls with (5,0) and (6,1) — those (r0=5, r0=6) values are the AI/jumptable indices, and the two r1\
  \ values are sub-state flags (0/1). This is the chip-select Custom-screen \"tick 5 then 6\" pattern.\n\
  \  - Out contract only lists r5 restored; the function is effectively void from the caller's perspective\
  \ (it just runs the screen frame).\n  - The state machine at the top plus the final (5,0)/(6,1) chip-select\
  \ handler calls strongly suggest this is the screen's per-frame updater for the folder-edit (Custom\
  \ Gauge / chip select) submenu state, which is why I picked `battleObject_submenu...` even though the\
  \ contract and naming don't strictly require it.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r0,[r7,#0x18]; strh r0,[r7,#0x1a]` is a shadow/animation latch on the submenu struct.
    - `ldrb r0,[r7,#0xd]; cmp r0,#4; beq loc_81338F4` selects between closing and opening animation. -
    The opening branch does `add r0,#2; cmp r0,#0x1e; ble ...; mov r0,#0x1e; mov r1,#4` — clamps to 0x1e
    and sets state 4. - The closing branch does `sub r0,#2; bge ...; mov r0,#0; mov r1,#3; bl entity_setLookupEntryStateFromFlag_8117D10`
    — clears an entity when the animation finishes. - The 40 captured calls all show the same entry r0..r3
    and the same return r0=0x40 (just the high bit of a flag word, incidental) so this is a hot per-frame
    routine, not a one-shot. - Final two `bl battle_aiRunTurnHandler_81353F0` with r0=5,r1=0 then r0=6,r1=1
    match the "tick AI handler 5 then 6 with sub-state 0 then 1" pattern used by chip-select screens.
    - Folder/chip submenu rendering functions (sub_81341A0 named `battleObject_submenuRenderFolderAndChips_81341A0`,
    sub_8134310 named `battleObject_drawFolderEditScreenGfx_8134310`) are called only here, fitting the
    per-frame screen tick.'
