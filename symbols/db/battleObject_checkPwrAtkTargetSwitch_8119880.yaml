status: probable
summary: Battle-object helper that returns 0/1 based on whether the current "select" / "switch" submenu
  slots differ while a submenu other than 0x20 is open, using the B-press data at r5+5.
interface: (r5 = AIDataPtr-in-BattleObject?) -> r0 = 0/1 in Z ; sets Z on the return path; clobbers r0,
  r1, r6
details: "Loads r0 = byte [r5+5] (AIData.BButton, the button-trigger byte) and indexes a small\n  table\
  \ at byte_811935C to derive a comparison value. If the table lookup is zero the\n  function returns\
  \ 0 immediately (locret_811989E, leaving Z set).\n  Otherwise it loads sSubmenu (the SubMenu struct\
  \ pointer), calls submenu_isOpen_81355D8,\n  and if a non-0x20 submenu is open, calls sub_81312F4 to\
  \ obtain a second submenu pointer\n  into r6. The active submenu pointer is then sSubmenu (r6 stays\
  \ as-is when no secondary\n  call happened). It compares bytes at r6+0xe and r6+0xf and returns 0 (Z)\
  \ if equal, 1\n  (NZ, with r0=1 and a tst r0,r0) if they differ.\n  The caller is sub_81196F0 (the AI/joypad\
  \ dispatcher during BattleObject action\n  updates). r5 is the AIData pointer (offset 0x5 is the BButton\
  \ / B-press trigger).\n  Returned r0 acts as a boolean \"should we switch targeting?\" flag the caller\
  \ consumes.\ndetails-step:\n  1. push {lr}; r0 = AIData.BButton (r5+5); r1 = byte_811935C\n  2. ldrb\
  \ r0, [r1,r0]; beq locret_811989E -- if table[idx]==0, return 0\n  3. r6 = sSubmenu; submenu_isOpen_81355D8\
  \ -> if not open, skip\n  4. if open: r6 = sub_81312F4()  (a different submenu slot/pointer)\n  5. cmp\
  \ r6[0xe], r6[0xf]; pop {pc}  (Z=1 means equal, return 0)\n  6. fallthrough: r0=1; tst r0,r0; pop {pc}\
  \  (return 1)\n"
