name: battle_recoverFromHit
address: '0x0800EADA'
kind: function
status: probable
summary: Ends the object's hit/stun/status state by clearing the 0x301FE ObjectFlags2 collision bits,
  zeroing the 14-byte status block at CollisionDataPtr+0x80, and resetting HitStunTimer and StatusEffectTimer1
  to 0.
interface: (r0 = scratch; uses r5 = battle object pointer from caller) -> r0 = destroyed; flags clobbered
details: Clears a fixed mask of ObjectFlags2 bits (0x301FE, i.e. all collision-related flag bits except
  bit 0) on the battle object in r5, then zeroes 0xE halfwords at CollisionDataPtr+0x80 (a scratch/status
  block of the collision data). Finally it stores 0 to oCollisionData_HitStunTimer and oCollisionData_StatusEffectTimer1.
  This collectively resets everything that tracks being hit or status-afflicted, so the object is no longer
  stunned or status-effected and its hit-related collision flags are reset. Called from the virus/enemy
  per-frame update, so it runs as part of the enemy AI frame step.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_clearFlag2 with r0=0x301FE clears ObjectFlags2 collision bits on the r5 object; ZeroFillByHalfword(CollisionDataPtr+0x80,
    0xE) wipes a 28-byte block of the collision struct; strh 0 to oCollisionData_HitStunTimer and oCollisionData_StatusEffectTimer1
    directly resets the hit timers; caller 0x08108F74 is the per-frame virus/enemy update that special-cases
    NameIDs before AI table dispatch
