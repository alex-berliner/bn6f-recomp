    to object_clearFlag2. The function zeros 0xE bytes (7 halfwords), not 0xE halfwords; the mov r1, #0xe
    sets a byte size. Everything else matches: clears ObjectFlags2 bits, zeros a block at CollisionDataPtr+0x80,
