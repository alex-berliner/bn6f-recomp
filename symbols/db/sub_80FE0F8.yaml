name: sub_80FE0F8
address: '0x080FE0F8'
kind: function
status: confirmed
summary: Enemy AI attack windup handler — starts the pre-fire animation/timer on first call, then counts it down
  each frame until handing off to the firing state.
interface: void sub_80FE0F8(battle object *obj /*r5*/, AIAttackVars *atk /*r7*/); returns next-state value 4 in
  r1 (callers read r1)
details: 'Per-call AI attack state machine step for one enemy battle object. r7 points at the

  attack''s AI attack vars block (oAIAttackVars: Unk_00 = current state/next-state,

  Unk_01 = windup-started flag, Unk_10 = windup frame timer).

  If Unk_01 != 0 the windup is already running: decrement the halfword timer Unk_10;

  once it reaches 0, write state 4 (fire) into Unk_00 to hand control to the firing

  handler. Note the in-progress path stores the decrement with strh (halfword) while

  the started flag is stored as a byte.

  On the first call (Unk_01 == 0) it stores 4 into Unk_01 to mark the windup begun,

  then queries the AI data word at offset 0x48 via GetAIDataUnk0x48Flag. If bit 0x20

  is already set (this attack already fired its shot), it skips straight to state 4 in

  Unk_00 without any animation. Otherwise it sets bit 0x20 via SetAIDataUnk0x48Flag

  (presumably the "shot fired this attack" latch so the windup only plays once),

  plays battle object animation 8 (obj->CurAnim = 8, r5), and loads the windup timer

  Unk_10 with 14 frames (0xE).

  Always returns with r1 = 4 (loaded from dword_80FE12C = 0x20 and reused by tst;

  after the mov r0,#4 path r1 is still the literal 4... actually r1 retains 0x20 from

  the literal pool load on paths through loc_80FE126 — callers'' contract lists r1 as

  the only meaningful output either way).

  No flags/registers other than r0, r1, r3, lr and NZCV are clobbered; nothing is

  preserved beyond what the callee ABI guarantees.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
