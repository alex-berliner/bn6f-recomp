name: ai_colonelQueueRandomPanelAttack
address: '0x08101606'
kind: function
status: probable
summary: 'Colonel AI attack step: arms a random-filtered-panel chooser callback, fetches the attack duration,
  and switches the enemy into attack state 4/id 9.'
interface: (r0 = enemy object (unused here), r7 = object struct) -> r0 = 9 (return of object_setAttack4);
  sets oAIAttackVars_PanelChooseCallback and oAIAttackVars_AttackDuration
details: Stores the pointer to object_pickRandomFilteredPanel into the AI attack vars' PanelChooseCallback
  field at [r7], so a later AI step uses it to select a target panel. Calls sub_8101484 to get a duration
  and writes it as a halfword into oAIAttackVars_AttackDuration. Finally calls object_setAttack4 with
  r0 = 9 to put the enemy into attack mode 4 with attack id 9. Called from the Colonel AI state machine
  (sub_81013AA) after state guards and a random 1-or-2 pick, i.e. one of Colonel's randomly chosen panel-targeting
  attacks. The panel selection itself is deferred to the callback, so this function only queues it.
