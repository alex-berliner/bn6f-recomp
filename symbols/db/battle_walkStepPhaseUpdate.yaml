name: battle_walkStepPhaseUpdate
address: '0x080CB628'
kind: function
status: probable
summary: Per-frame phase handler for a battle object that steps one panel toward its facing side, then
  either pauses 15 frames per step or switches to continuous X-velocity movement.
interface: (r5 = battle object pointer; no args in r0-r3) -> r0 = clobbered; updates object fields, no
  return value
details: 'Uses r5 as the battle object, so the caller must set it up (common pattern for shared object
  routines). Phase 0: reads the current animation frame''s attribute via sprite_getFrameParameters and
  waits until bit 0x80 is set, then sets CurAnim=1, advances PanelX by one panel in the object''s front
  direction (object_getFrontDirection), recomputes pixel coords, sets collision region 4; if Param1 <
  3 it sets Timer=15 and goes to phase 1, otherwise it goes straight to phase 2. Phase 1 just counts Timer
  down to 0 and moves to phase 2. Phase 2 adds XVelocity to X each frame and converts the position back
  to panel coordinates via object_setPanelsFromCoordinates. Every non-early-exit path ends by syncing
  the collision record with object_updateCollisionPanels. Param1 appears to control the movement style
  (stepped vs. continuous), and XVelocity must be initialized elsewhere.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: phase 0 gates on sprite_getFrameParameters bit 0x80 before acting (bl sprite_getFrameParameters;
    tst r0,#0x80); phase 0 does 'PanelX += object_getFrontDirection()' then object_setCoordinatesFromPanels
    and object_setCollisionRegion(4); phase 1 decrements oBattleObject_Timer set to 15 before moving to
    phase 2; phase 2 does 'X += XVelocity' then object_setPanelsFromCoordinates; all callees are documented
    battle-object helpers, confirming r5 is a battle object
  refs:
  - bn6f/asm/asm31.s:42241
  - 0x0800E2CA object_getFrontDirection
  - 0x0801A07C object_setCollisionRegion
  - 0x0800E29C object_setCoordinatesFromPanels
