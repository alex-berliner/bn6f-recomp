name: object_initSpriteObjA1
address: '0x0811E438'
kind: function
status: probable
summary: 'Initializer for a sprite-based object: assigns sprite 0xA1, animation 1, no shadow, palette
  0, priority 2, position halfword 0x280, and sets the object''s kind/state bytes.'
interface: (r5 = object struct pointer, r1 passthrough to initGuiSprite) -> r0 = sub_811E490's return;
  no meaningful flags
details: 'The function configures a freshly created object pointed to by r5: it writes kind/type byte
  0x23 to [r5], creates the sprite via initGuiSprite with id 0xA1, then applies animation 1, loads animation
  data, disables the shadow, stores halfword 0x280 through the slot-list helper (likely a screen position/coordinate),
  sets sub-entry palette bank 0xC, palette 0, sub-record field A 0, and OAM priority 2. It then calls
  two unknown helpers (sub_811E51C, sub_811E548), writes state bytes 4 and 1 to [r5+8] and [r5+9], and
  finishes by calling sub_811E490 before returning. The whole shape is a standard object-constructor:
  type byte, sprite setup, position, then initial state.'
