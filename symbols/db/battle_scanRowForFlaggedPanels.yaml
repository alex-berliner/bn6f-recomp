name: battle_scanRowForFlaggedPanels
address: '0x080E2A30'
kind: function
status: probable
summary: Scans the six panels of the object's current row, collecting the x coordinates of panels whose
  tile flags match a per-alliance required/forbidden mask pair.
interface: (r0 = battle object in r5-style this-call, no args) -> r0 = 0; writes packed (PanelY<<4 | x)
  bytes to obj+0x68 and match count to obj+ExtraVars+4
details: 'Uses r5 as the battle object. It reads oBattleObject_PanelY and oBattleObject_Alliance, then
  indexes an array at oBattleObject_ExtraVars by Alliance*12: word +4 is the ''all flags set'' mask and
  word +8 the ''no flags set'' mask passed to object_checkPanelParameters. The loop calls object_checkPanelParameters
  with x = 6,5,4,3,2,1 (r0 counting down) and the fixed PanelY, and for each hit stores one byte (PanelY<<4
  | x) into a buffer at obj+0x68, bumping a counter. The final count is stored to the object at offset
  oBattleObject_ExtraVars+4 (a field after the pointer, not into the mask array). The buffer holds at
  most 6 entries since only six x values are tested.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#oBattleObject_PanelY] and ldrb r0,[r5,#oBattleObject_Alliance] feed the scan coordinates
    and mask index (lines 2-3); ldr r2,[r0,#4] / ldr r3,[r0,#8] after add r0,Alliance*3 pick the two flag
    masks passed to object_checkPanelParameters; loop runs r0 = 6 down to 1 (mov r0,#6 / sub r0,#1 / bne),
    i.e. six panel x positions on one row; on a hit, lsl r4,r1,#4; orr r4,r0 packs y<<4|x and strb r4,[r7,r6]
    appends it to the obj+0x68 buffer; str r6,[r5,#oBattleObject_ExtraVars+4] stores the hit count; object_checkPanelParameters'
    known 1/0 return drives the tst/beq
  refs:
  - bn6f/asm/asm31.s:93308
  - 0x0800CC86 object_checkPanelParameters
  reproduce: python3 tools/asmcat.py 0x080E2A30
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-030611'
open_questions:
- No caller is known, so the gameplay purpose (which object/attack uses the collected panel list at obj+0x68)
  is unknown
- Whether panel x coordinates are 1-based (loop tests 6..1) or the value 6 is a special column is unconfirmed
- The exact meaning of the per-alliance mask array (three 12-byte records per alliance) needs its initializer
  to confirm field roles
