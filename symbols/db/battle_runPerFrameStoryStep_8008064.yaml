open_questions:
- Exact meanings of r5[0..0xa] (size and layout of this story-step state struct); only inferred from byte/halfword
  stores.
- What `0x293` KindEffect encodes ("story-end" effect vs. story-battle-specific effect).
- Why state `4` is written to r5[3] when the dispatch fires, and what value/test this corresponds to.
- Whether the `(0,0)` dispatch is truly a no-op or registers a pending kind-effect to act on later.
