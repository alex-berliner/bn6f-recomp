name: owPlayer_copyPositionOffset
address: '0x080A5954'
kind: function
status: probable
summary: Copies a three-word overworld player position/coordinate vector from an offset structure into
  the active player state.
interface: (implicit r6 = source player/offset context, r5 = destination player context) -> r0-r2 unchanged;
  flags unaffected
details: The routine loads three consecutive 32-bit values beginning at offset 0x7C from the structure
  pointed to by r6 and stores them at offsets 0x24, 0x28, and 0x2C of the structure pointed to by r5.
  It is called during overworld-player setup and while updating a copied player/position record, indicating
  synchronization or initialization of coordinate data. The function has no explicit arguments in the
  ABI listing because both structures are supplied through preserved caller registers.
