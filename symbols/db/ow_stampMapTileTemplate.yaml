name: ow_stampMapTileTemplate
address: '0x08142CC8'
kind: function
status: confirmed
summary: Stamps a fixed tile-pattern template onto an overworld map-tile buffer, remapping rows by the current map
  width.
interface: 'void ow_stampMapTileTemplate(u32 dest /* r0 */, u32 tile_type /* r1: 0 or 1 */)'
details: "Reads the destination row stride (in u16 units) from the global byte at eMapTilesState200be70, then selects\
  \ one of two template tables via the pointer array at off_8142D44 (tile_type 0 → dword_8619B50, tile_type 1 →\
  \ byte_8619B90). Each template row has a stride of 8 u16 units. Copies two u16 header fields (byte offsets 6 and\
  \ 8) verbatim into the destination, then copies three groups of column data:\n  Row 1 (source row index 1): columns\
  \ 1–6 → destination row 1 at the caller's stride.\n  Row 2 (source row index 2): columns 1–6 → destination row\
  \ 2.\n  Row 3 (source row index 3): columns 3–4 → destination row 3 (only two columns, forming a narrower middle\
  \ band).\nAll stores are u16. The function preserves r4–r7 and r5,r6,r7 are listed as caller-preserved outputs\
  \ (saved via push/pop), so no external registers are modified beyond the memory write."
