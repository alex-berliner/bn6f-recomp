name: encryption_bugfrags_8006fac
address: '0x08006FAC'
kind: function
status: confirmed
summary: Recomputes the obfuscated/encrypted BugFrag count values in the game state (checksum complement plus XOR-scrambled
  copy).
interface: void encryption_refreshBugfragCount(void) /* no args, no return value; r0-r7 and flags outside nz are
  preserved, caller-saved r0-r7 are restored via push/pop */
details: 'Takes no meaningful arguments - the push {r0-r7,lr} at entry is purely to free r0-r7 as

  scratch; all eight are restored on return and the function returns to the popped lr.

  Loads the game state pointer from the toolkit (R10 + oToolkit_GameStatePtr) and reads

  oGameState_ProtectedBugfrags (the "protected"/plain BugFrag count). Unless bit 1 of

  oGameState_Unk_74 is set, it stores the bitwise complement of the count into

  oGameState_Unk_70, which acts as a checksum/validation slot paired with the count

  (anti-cheat for the BugFrag total). It then XORs the count with the 32-bit key read

  through off_8007000 (=dword_20018B8, a fixed scramble key in EWRAM/IWRAM) and writes the

  result to the buffer pointed to by toolkit + oToolkit_Unk2005030_Ptr, i.e. keeps an

  encrypted mirror of the BugFrag count in sync. In game terms this runs whenever the

  BugFrag total changes so both the complement "checksum" and the scrambled stored copy

  match the real count, defeating simple save edits. Quirk: when bit 1 of oGameState_Unk_74

  is already set, the complement slot is left untouched and only the XOR-scrambled copy is

  refreshed.

  '
