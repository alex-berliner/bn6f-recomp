name: ai_attackWaitTimerStep
address: '0x080F3104'
kind: function
status: probable
summary: AI attack step that loads the attack's duration as a timer on first tick, then counts it down
  and exits the attack state when it expires
interface: (r7 = object with oAIAttackVars) -> void; flags clobbered by tst/bl
details: 'Reads oAIAttackVars_AttackElement as an init flag: if 0, it sets AttackElement = 4 and copies
  oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, returning immediately. On subsequent calls
  it decrements StepTimer each frame; once the timer runs out it tail-calls object_exitAttackState to
  clear the object''s attack state. Element value 4 looks like a placeholder/no-element attack, making
  this the idle ''do nothing, then finish'' attack handler. r0-r3 are unused as arguments; the object
  pointer comes via r7, the standard AI attack-context register.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] / tst+bne: element field acts as ''already started''
    flag; mov r0,#4 / strb ...AttackElement: writes fixed element 4 on init; ldrh AttackDuration / strh
    StepTimer: initializes the countdown from the configured duration; sub r0,#1 / bgt: per-call countdown
    until timer reaches zero; bl object_exitAttackState: known callee that ends the object''s attack state
    when the timer expires'
  refs:
  - bn6f/asm/asm31.s:126575
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F3104
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-203615'
