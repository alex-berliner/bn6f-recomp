name: ai_endAttackIntoMove
address: '0x0810B15C'
kind: function
status: probable
summary: AI action callback that wraps up an attack and hands the battle object over to its moving state
interface: () -> void; operates on the current battle object via the object_* helpers' implicit self pointer
details: Clears bit 0x40 of the current object's CollisionData ObjectFlags1 (likely an attack-active/invulnerable-style
  flag set while attacking), then ORs in the 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT bit of the same word,
  marking the object as currently moving. Finally it calls object_exitAttackState to leave the attack
  state cleanly. The routine takes no arguments of its own; the object_* helpers act on the engine's current-object
  pointer. This end-attack-then-mark-moving sequence is the typical shape of an AI action/state transition
  step, e.g. a boss script stepping from an attack phase back into movement.
