- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r5,#0x20]/ldrh r1,[r5,#0x24]; add; lsl r0,#2 builds a word index from two coordinates
    of the board work struct; ldr r1, off_8135F70 (=word_201DA80); ldrh r1,[r1,r0] reads a halfword from
    the cell table; sub r1,#0x90; lsr r1,#2 normalizes the cell value into a small id before use; bl sub_8135F34
    passes that id as the sole argument; called by navicust_handleBoardInput and several subs in the 0x8135xxx-0x8136xxx
    navicust range
