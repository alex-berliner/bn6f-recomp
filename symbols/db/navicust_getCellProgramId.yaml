name: navicust_getCellProgramId
address: '0x08135F18'
kind: function
status: probable
summary: Reads the Navi Cust board cell under the cursor/work position, converts its table value to a
  program/index ID, and dispatches it to a handler.
interface: (r5 = navicust work struct; r0/r1 clobbered) -> r0 = id passed to sub_8135F34; returns that
  callee's result
details: The function combines two halfword coordinates from the work struct at r5+0x20 and r5+0x24, scaling
  the sum by 4 to form a byte offset into the per-cell array word_201DA80. It loads the halfword entry
  for that cell, subtracts a base value of 0x90, and divides by 4 (value>>2), yielding a small id that
  is passed to sub_8135F34. The 0x90 base suggests the board table stores tile/sprite IDs for occupied
  cells, with 4 IDs per program block. Being called from the board input handler and several neighbours
  of the navicust code, it likely runs whenever the selected cell changes or an action is confirmed, acting
  on the program occupying that cell.
