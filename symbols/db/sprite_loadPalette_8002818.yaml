name: sprite_loadPalette_8002818
address: '0x08002818'
kind: function
previous_names:
- sub_8002818
status: confirmed
summary: Copy the sprite's 16-colour palette into its slot of the sprite palette buffer byte_3001550 (slot = high
  nibble of byte 0x15), applying the colour effect in halfword 6.
interface: '(r5 = sprite) -> source = field 0x34, or [[0x1C] + 4] + 4 + [0x18]; skip (byte 4 + byte 5) * 0x20 bytes
  of tiles; copy 0x20 bytes to byte_3001550 + slot * 0x20; halfword 6 != 0: palette_addOrSubtractColor(colour =
  bits 0-14, add/subtract = bit 15, 0x20 bytes)'
details: Its registers after the tint call are what palette_addOrSubtractColor leaves, which now matches the original
  exactly (it only promised r5/r7 before).
