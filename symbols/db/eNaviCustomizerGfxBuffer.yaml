summary: 'Proposed name: eNaviCustomizerGfxBuffer. EWRAM tile/asset work buffer used as a source/destination
  for navi customizer screen graphics (decompressed tile data layer). (pointer)'
details: Holds a 688-byte block of navi-customizer-screen tile data, exchanged between decompressor and
  renderer. battle_loadNaviCustomizerGfx lists it next to eDecompBuffer2013A00 and a compressed palette/text
  blob, indicating it is one of the screen's tile layers. sub_8135F34 passes it as the source buffer (r1)
  to renderTextGfx_8045F8C alongside a 0x600B800 BG tile-base, an IWRAM palette buffer (byte_201B200),
  and a width/height of 10x3 — i.e., it tiles into BG 0xB at VRAM offset 0x800 over a 10x3 (30 tile) region.
  sub_8135F5C is a near-clone that just dereferences the same constant via off_8135F74.
