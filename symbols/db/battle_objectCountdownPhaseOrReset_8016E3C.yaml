name: battle_objectCountdownPhaseOrReset_8016E3C
address: '0x08016E3C'
kind: function
status: confirmed
summary: Decrements a battle object's phase counter each tick and, when it expires, resets the object's flags and
  hands its saved state word back to the state machine.
interface: void sub_8016E3C(battle object in r5); returns decremented phase in r0 (0 on the reset path), also sets
  r1/r2, NZCV and lr per caller contract
details: 'Works on the battle object whose address callers keep in r5. Reads the byte at oBattleObject_CurPhase,
  subtracts 1, and stores it back; if the result is still >= 0 the object simply continues its current phase and
  the function returns that new value. When the counter goes negative (phase expired), the object is fully reset:
  object_clearFlag(0x101000) clears the corresponding bits in the object''s main flag bitfield, object_clearFlag2(0x10)
  clears bit 0x10 of its second flag word, byte oBattleObject_Unk_1f is zeroed, the word at oBattleObject_Unk_5c
  is copied into oBattleObject_CurStateActionPhaseAndPhaseInitialized (returning the saved state/action word to
  the state machine), and Unk_5c itself is cleared to 0. Note the state restore also rewrites oBattleObject_CurPhase,
  since that byte is part of the CurStateActionPhaseAndPhaseInitialized word. The 0x101000 clear value (bits 0x100000
  and 0x1000) presumably ends whichever behavior the flags enabled, e.g. a timed state or animation; the exact meaning
  of the flags is unconfirmed.

  '
