name: object_spawnType55Linked
address: '0x080C41D8'
kind: function
status: probable
summary: Spawns battle object type 0x55 at a source object's position, on the same side, linked back to
  that source object.
interface: (r0 = source BattleObject ptr) -> r0 = new BattleObject ptr or null on spawn failure; flags
  not meaningful to caller
details: Calls object_spawnType1 with object index 0x55; if the spawn fails it returns immediately. On
  success it copies oBattleObject_X, oBattleObject_Y and oBattleObject_Z from the source object passed
  in r0 (kept in r5) into the new object, copies the byte oBattleObject_Alliance so the new object shares
  the source's side, stores the source pointer in oBattleObject_RelatedObject1Ptr so the new object can
  reference its owner, and ORs flag bit 0x14 into oObjectHeader_Flags. Returns the new object pointer.
  The flag 0x14 likely marks it as a linked/attached effect the battle engine should treat specially.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0, #0x55 + bl object_spawnType1 (sub_80C41D8+6): spawns fixed battle object type 0x55;
    ldr r1,[r5,#oBattleObject_X/Y/Z]; str to [r0,...]: new object starts at source object''s position;
    ldrb/strb oBattleObject_Alliance r5->r0: new object inherits the source''s alliance/side; str r5,[r0,#oBattleObject_RelatedObject1Ptr]:
    new object is linked back to the source object; orr r1,r2 with r2=0x14 into oObjectHeader_Flags: sets
    the linked-object flag bit on the spawn'
