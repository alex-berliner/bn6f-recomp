name: sprite_updateDestroyWhenAnimEnds_80E08A6
address: '0x080E08A6'
kind: function
status: confirmed
summary: Sprite update callback that destroys the battle object once its animation sequence finishes.
interface: 'void sprite_updateDestroyWhenAnimEnds(/*r4: unused/forwarded arg, */ r5 = ObjectHeader* obj)'
details: 'Per-frame update for a battle object (r5 = object header). Calls sprite_getFrameParameters

  for the object''s current animation frame; if the result has bit 0x80 set (the "animation

  sequence finished" signal), it clears bit 0x2 of oObjectHeader_Flags (byte at offset 0 of

  the header — likely an "active/alive" flag) and writes CUR_STATE_DESTROY (8) into

  oBattleObject_CurStateActionPhaseAndPhaseInitialized, handing the object to the shared

  battle-object state machine for teardown on the next state tick. It then calls sprite_update

  to advance the sprite to its next frame. Note the destroy happens before sprite_update, so

  the final animation frame still gets ticked after the DESTROY state is queued. r4 is listed

  as an input but is not read in this body; it is presumably consumed by sprite_update (e.g.

  a sprite/entity handle passed through from callers).

  '
