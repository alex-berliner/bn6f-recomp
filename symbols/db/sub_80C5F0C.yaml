name: sub_80C5F0C
address: '0x080C5F0C'
kind: function
status: confirmed
summary: 'Per-frame update that finalizes a battle object''s destruction: drops collision then waits for the current
  animation to finish before switching state to CUR_STATE_DESTROY.'
interface: 'void sub_80C5F0C(void); /* in: r5 = battle object; clobbers r0, r1, r2, r3, lr, nzc/v; returns r1 =
  0x80 */'
details: 'Operates on a battle object descriptor pointer in r5. On the first call (when

  oBattleObject_CurPhase is 0) it advances the phase to 1 and invokes

  object_clearCollisionRegion, so the object no longer participates in hit

  detection. Every call then queries sprite_getFrameParameters, sets r1 = 0x80

  (the end-of-animation flag bit in the returned frame-parameter word), and

  tests bit 7 (mask 0x80). When the animation has finished, it writes

  CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized

  to hand the object off to the next state. r1 being left at 0x80 looks like

  a residual return value for the caller rather than meaningful output.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
