name: battle_damagePlayerLeave1HP_8013FD0
address: '0x08013FD0'
kind: function
status: confirmed
summary: Deal a non-lethal hit to the player — subtract the damage amount from the player's HP but never below 1,
  then play the hit sound effect.
interface: void battle_damagePlayerLeave1HP(u32 damage /* r0 */); clobbers r0, r1, lr and NZCV; preserves r3-r7,
  r10
details: 'Takes the incoming damage amount in r0 (callers set it up before the call) and passes it to battle_findPlayer
  to locate the player''s BattleObject (same value doubles as the alliance flag for that lookup). If no player object
  exists, return. Reads the halfword at navi-stats offset 0x54 via GetBattleNaviStatsHword_AllianceFromBattleObject;
  if that value is 0, return (no damage). Then caps the subtraction so the hit can never kill: it loads the player''s
  current HP from BattleObject+0x24 and calls object_subtractHP with min(damage, hp - 1), guaranteeing at least
  1 HP remains. Finally plays SOUND_HIT_6B via PlaySoundEffect. The saved r5 in the prologue is only used to hold
  the player pointer across the stats call.

  '
