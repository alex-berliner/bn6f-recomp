name: battle_aiAttackCycle_810A648
address: '0x0810A648'
kind: function
status: confirmed
summary: Cycles a NetNavis AI attack-pattern counter and decides whether to arm the next attack or skip
  the turn.
interface: void battle_aiAttackCycle(u32 r5 obj, AIState *r6 ai, AIAttackVars *r7 vars) -> incidental
  r1; clobbers r0 r2 r3 lr and NZCV
details: 'Calls object_getFlag(r5) to read the owning object''s status flags. If bit 15 (0x8000) is set
  the function cycles AIState.AttackCounter modulo 3 and indexes a 6-byte pattern table (byte_810A6BA);
  if bit 13 (0x2000) is set instead it cycles AIState.TurnCounter modulo 2 and indexes a 2-byte table
  (byte_810A6B8). The table value selects an action: 0 = arm attack, 1 = skip, >1 = 33 % RNG gate (GetPositiveSignedRNG
  mod 3 == 0 forces skip). Arming writes 100 to AIAttackVars.StepTimer, calls object_setAttack0(9, obj),
  and clears AIState.ScriptId to 0. Skipping sets AIState.ScriptId to 8. If neither flag is set the function
  skips immediately.

  '
