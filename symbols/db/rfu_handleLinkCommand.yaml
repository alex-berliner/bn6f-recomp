name: rfu_handleLinkCommand
address: '0x0814801C'
kind: function
status: probable
summary: Dispatches a wireless link command/event byte to the matching RFU state-machine action for the
  wireless battle/trade session.
interface: (r0 = command/event ID byte) -> r0 clobbered; updates link state word_200BC58 of eS200BC50,
  sometimes calls sub_813D934 with a sub-state code; no return value.
details: Takes a byte-sized command ID and runs a switch over it (0x00, 0x20-0x25, 0x30-0x33, 0x42-0x44,
  0x50, 0xf0-0xf2, 0xff; unknown IDs fall through to loc_8148200 as no-ops). Most cases write a small
  state code into the halfword at eS200BC50+0x8 (word_200BC58) — e.g. 0x01, 0x05, 0x0b, 0x0d, 0x0e, 0x25,
  0x34, 0x3f — and call sub_813D934 with an argument (1,2,3,5,0x0d,0x0e,0x10,0x13), which looks like an
  RFU task/state setter. Case 0x20 copies a byte from eStruct200FE00+0x14 into byte_2010324, case 0x22
  also stores it into byte_200AF84 and calls rfu_setRecvBuffer(0x20,0x40) on byte_2010290, and case 0x43
  tears the connection down via rfu_clearAllSlot. Cases 0x31/0x32 and 0xf1/0x50 exchange a saved code
  through word_2010338, suggesting handshake/status round-trips between the two consoles.
