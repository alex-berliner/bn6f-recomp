name: e_setFlagBits
address: '0x0803EF48'
kind: function
status: probable
summary: ORs the given bits into the flags byte at offset 0xD of the eStruct200BC30 structure
interface: (r0 = bit mask to set) -> r0 clobbered (used as scratch); no return value
details: The function loads byte_200BC3D (eStruct200BC30 field +0xD), ORs the passed mask into it, and
  stores it back, so it only ever sets bits and never clears them. It pushes/pops r0-r2 purely to preserve
  the caller's registers, returning nothing. eStruct200BC30 is otherwise undocumented here, so the meaning
  of the +0xD byte's bits is unknown; both callers (sub_803F0A4, sub_803F334) are also unanalyzed, so
  which flags are being raised cannot be determined from this function alone.
