name: battle_crackPanelBlinkOutHandler
address: '0x080CE690'
kind: function
status: probable
summary: 'Battle object tick handler: on entry plays a sound effect and cracks the panel under the object,
  then blinks it out and destroys itself after a 12-frame timer.'
interface: (r5 = battle object ptr) -> void; sets oBattleObject_CurPhase, Timer, object flag bit 1, and
  CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY
details: On phase 0 it advances the object to phase 1, clears its collision region, loads Timer with 12,
  and plays sound effect 0x1D0 (0xD1+0xFF); if Param2 is nonzero it also calls sub_8109794 to crack the
  tile at the object's PanelX/PanelY. While Timer <= 8 it first clears flag bit 1 of oObjectHeader_Flags
  (visibility) and re-sets it on alternate frames (Timer bit 1), producing a blink. Timer is decremented
  each tick; when it underflows the object's state is set to CUR_STATE_DESTROY, removing it. r4/r6/r7
  are pushed but unused.
