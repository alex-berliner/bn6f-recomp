name: battle_crackPanelBlinkOutHandler
address: '0x080CE690'
kind: function
status: confirmed
summary: Per-frame handler for a battle "cracked panel" effect object during its blink-out phase; plays the crack
  sound, blinks the sprite flag, and destroys the object when the timer expires.
interface: void battle_crackPanelBlinkOutHandler(r5=battleObject, r2=soundArg /* passthrough to PlaySoundEffect
  */, r1=caller's r1); returns r1 (2 when the blink block ran, else last callee's / caller's r1); clobbers r0-r3,
  lr and NZCV flags, preserves r4-r7, r10
details: 'Runs as a battle-object state handler with r5 = battle object.

  First tick (oBattleObject_CurPhase == 0): sets CurPhase = 1, clears the

  object''s collision region via object_clearCollisionRegion, loads

  oBattleObject_Timer = 12, plays sound effect 0xD1 + 0xFF = 0x1D0 (passing

  r2 through as PlaySoundEffect''s second argument), and if

  oBattleObject_Param2 is nonzero fires sub_8109794 with the object''s

  oBattleObject_PanelX / oBattleObject_PanelY panel coordinates (likely a

  panel-crack particle/effect spawn).

  Every tick: while oBattleObject_Timer <= 8, oObjectHeader_Flags bit 1 is

  cleared and then re-set iff (timer & 2) != 0, giving a 2-on/2-off blink of

  the sprite/visibility flag for the last ~9 ticks. Finally the timer is

  decremented (u16); when it was already 0 the timer wraps to 0xFFFF and the

  object''s combined state word

  oBattleObject_CurStateActionPhaseAndPhaseInitialized is set to

  CUR_STATE_DESTROY, ending the effect. Note the u16 counter: expiry only

  triggers when the timer reads exactly 0 on entry.

  Quirk: r1 on output is 2 only on ticks where the blink block executed

  (timer <= 8); otherwise it is whatever the last callee (or the caller)

  left there — callers apparently ignore r1.

  '
