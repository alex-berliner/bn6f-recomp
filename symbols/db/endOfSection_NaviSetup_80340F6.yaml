name: endOfSection_NaviSetup_80340F6
address: '0x080340F6'
kind: function
status: confirmed
summary: 'End-of-section Navi setup: reloads the PET Navi (or just stat boosts if already loaded), ensures
  EVENT_PET_NAVI_ACTIVE is set, refills HP, clears a batch of transient event flags, enables the ghost
  Navi, zeroes scratch fields in the S2001c04 Navi struct, sets the beast-out counter to 3, zeros all
  Navi stat moods, and chains into sub_800A908.'
interface: 'void navi_80340F6(struct Toolkit *tk /* r10 */);

  // clobbers r0, r1, r2, r3, nz, c, v; preserves r4-r7

  // returns whatever sub_800A908 left in r0-r3 (and nz/c/v) per the adapter convention

  '
details: "- r10 holds the Toolkit pointer; loads GameStatePtr, and if GameProgress == 0x80 (post-game?\n\
  \  chapter-clear state) it reloads slot 0 via loadGameProgressFromGameProgressBuffer_8035354.\n- EVENT_163\
  \ (\"no PET navi currently bound\"?) gates a full PET-Navi swap: writes current PET\n  Navi to S2001c04,\
  \ calls SetCurPETNavi(0), then reloads base stats and stat boosts; else\n  just refreshes stat boosts.\n\
  - EVENT_172A: if clear, sets EVENT_PET_NAVI_ACTIVE (group 0x17, bit 0x1D).\n- SetCurNaviHPToFull is\
  \ called unconditionally.\n- S2001c04 Navi struct: ST32(navi+0x24, 0); ST32(navi+0x28, 0); STH(navi+0x12,\
  \ 0);\n  STH(navi+0x14, 0) -- zeroes unknown scratch fields and short counters at 0x12/0x14.\n- Event-flag\
  \ cleanup (transient battle/cross-section state):\n  clear EVENT_170A, EVENT_170B, EVENT_1709, EVENT_4E9,\
  \ EVENT_5F2; set EVENT_5DF.\n- enableGhostNavi_80351C8 is invoked, then EVENT_1721 and EVENT_1700 are\
  \ cleared.\n- SetBeastOutCounterTo3, ZeroAllNaviStatsMood, then sub_800A908 (the latter is reached\n\
  \  via the adapter's navi_tail, so its R0-R3 / flag state is what this function returns).\n"
