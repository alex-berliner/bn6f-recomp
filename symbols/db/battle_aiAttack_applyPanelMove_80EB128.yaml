open_questions:
- Exact semantics of AIAttackVars.Unk_2c (object/animation/SFX handle passed to sub_800F2FC) and AIAttackVars.Unk_00
  (which downstream AI state value 8 means).
- Why exactly the three column patterns 0x23, 0x31, 0x33 are singled out (one of the game's "holies" or
  rare boards); would be settled by reading what GetBattlePanelColumnPattern returns and matching against
  a board list.
