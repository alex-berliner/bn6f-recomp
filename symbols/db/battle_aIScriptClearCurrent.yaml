name: battle_aIScriptClearCurrent
address: '0x080C4C46'
kind: function
status: probable
summary: Clears the current-step/status byte (offset 0xC) of a battle object's AI script block, effectively
  ending/halting the script.
interface: (r0 = oAIData_AIScriptOffset script pointer) -> r0 preserved; sets byte at script+0xC to 0
details: Called only from battle_objectCleanup after the script-offset pointer is loaded from the AI data
  block. Writes a single zero byte at that script struct's offset 0xC, which is the 'current script step/state'
  byte in the AI script state structure; the function does not null the pointer itself, nor free the script,
  only resets its state so it won't continue. No side effects beyond this store.
