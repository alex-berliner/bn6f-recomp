name: sub_80092A0
address: '0x080092A0'
kind: function
status: confirmed
summary: Dispatches to one of three battle-state phase handlers based on the phase byte at +2 of the battle state
  struct.
interface: void battle_dispatchStatePhase(void) — r5 = battle state ptr in; calls handler with r0 = phase byte,
  r1 = handler address; all registers/flags pass through from the handler
details: 'A trampoline dispatcher over the battle state structure. Reads the phase

  selector byte at oBattleState_Unk_02 from r5 (the battle state object) and

  indexes the handler table at off_80092B4 with it. Three entries:

  0 -> sub_80092C0, 4 -> sub_80092F0, 8 -> sub_8009314.

  Uses the classic mov lr, pc; bx r1 tail-call idiom: the handler receives

  r0 = the phase byte value and r1 = its own Thumb entry address, and returns

  directly to this function''s caller (r5 is not reloaded, so the caller''s

  r5 is expected to still be the battle state pointer). All other registers

  and flags flow through untouched. Out-of-range phase values would jump to

  garbage, but no valid game state reaches that.

  '
