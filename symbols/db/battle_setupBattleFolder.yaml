name: battle_setupBattleFolder
address: '0x0800A318'
kind: function
status: probable
summary: 'Builds the battle''s shuffled folder: picks a source folder (preset, battle-mode table, or the
  player''s folder keyed by current navi), copies 30 packed chips into eBattleFolder, decrypts/inserts
  navi-chip swaps when special battle effects are active, then shuffles.'
interface: (no args; uses r10 toolkit) -> void; writes eBattleFolder (60 halfwords), BattleState+0x17
  and +0x44 flags; r4-r7 clobbered
details: 'Source selection: battle effect 0x200000 uses unk_2039AA0; otherwise a per-battle-mode pointer
  table (dword_802137C) is tried; otherwise the toolkit''s S_Chip (selected folder) pointer is used. When
  the source is the player''s own S_Chip, the source pointer is advanced by (naviStatsByte(0x2D))*0x3C
  — a per-navi 30-chip region — and r7=1 marks ''no decryption needed''; otherwise encryption_decryptPackTable30
  decrypts the copied 30 packed (id | code<<9) entries in place. Battle effect 0x80 then performs swaps
  in eBattleFolder: slot 0 is exchanged with the entry at an index from pet_getCurNaviChainedLookup, and
  slots at 0x38/0x3A (halfword indices 28/29) are exchanged with an index pair from pet_getCurNaviStatusPair,
  setting BattleState flags 0x17 and 0x44 respectively so the change can presumably be undone after battle.
  Finally it tail-calls shuffleFolder_800A570(eBattleFolder, flag1, flag2), passing the two ''slot was
  replaced'' markers, likely so the shuffle keeps those slots in place.'
