summary: Looks up one of a small hard-coded table of chatbox/script descriptors (12-byte stride) and dispatches
  it through sub_8001890.
interface: 'void sub_803B91C(u32 entryIndex /* r0 */); flags: NZCV clobbered'
details: 'Indexes a 12-byte-entry table anchored at 0x0803B93C (loaded via off_803B938/0x0803B938,

  stored in IWRAM as unk_2028204 plus an immediate offset). Each entry is 0xC bytes laid

  out as: +0 word (passed as r3), +4 byte (r2), +5 byte (r0), +6 byte (r1),

  +7 byte (r4), +8 byte (r5). Those six registers are forwarded verbatim to

  sub_8001890, which is a likely script/command dispatcher given the register

  shape (r0..r3 carry parameters, r4..r5 carry extra args, r3 also carries a

  pointer-like word). The 0x14 / 0x20 / 0x1E values in the +3..+6 columns and

  the 0xFF padding pattern are consistent with per-entry command/script tuples,

  but the meaning of each byte is not confirmed. The data block at 0x0803B93C

  is inlined as .byte immediates following the pointer, so it is not a normal

  word table.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
