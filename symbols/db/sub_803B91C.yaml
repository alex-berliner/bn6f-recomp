name: sub_803B91C
address: '0x0803B91C'
kind: function
previous_names: []
status: probable
summary: Copies one of a small palette/toolkit BG-tile-id entry (loaded from a 12-byte table) into the toolkit's
  iBGTileIdBlocks blit buffer via sub_8001890.
interface: '(r0 = table index) -> r0 = 0 ; side effects: writes to one of the toolkit''s BG tile-id block buffers
  through sub_8001890.'
details: '- The base of the table is at unk_2028204 (loaded via off_803B93C -> .word unk_2028204), each entry is
  12 bytes (0xc) as shown by `mov r1, #0xc` and `mul r0, r1`.

  - r0 is the byte index into this table of entries. The first u32 (r3 = [r3]) is a pointer; the next five bytes
  (offsets +4..+8) are loaded into r2,r4,r5,r0,r1 (reordered as the function sets up r2,r0,r1,r4,r5 from +4,+5,+6,+7,+8).

  - r1 is hardcoded to 0xc on entry — the captured call shows r1=0x20 on entry but the function immediately overwrites
  it with 0xc, so the caller''s r1 is ignored.

  - `bl sub_8001890` is the BG tile-id blit helper ("Blits a rectangle of 16-bit BG tile ids into one of the toolkit''s
  BG tile-id blocks").

  - Multiple call sites (copyData_803B216, copyData_803B2E4, copyData_803B3C8, copyData_803B45C, sub_803A25C, sub_803A334,
  sub_803B518) all push the toolkit in r10 — confirming r10 is the toolkit pointer used by sub_8001890.

  - copyData_8049A18 / copyData_8049AAC / copyData_804A0AC call it during scene init (e.g. `call sub_803B91C(3)`
  per the confirmed summary).

  '
