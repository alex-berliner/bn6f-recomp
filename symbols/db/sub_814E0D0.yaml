name: sub_814E0D0
address: '0x0814E0D0'
kind: function
previous_names: []
status: hypothesis
summary: Advances a battle object's script-position pointer by one byte, reads that byte, and feeds it to sub_814E0B6
  for validation as a RAM pointer (r2 is the script position, r1 is the object).
interface: (r0 = ptr-to-call-result-helper-buf, r1 = battle object/state ptr) -> r0 = r0, r2 = the validated byte
  stored at [r1+0x40]; tail-call into sub_814E0B6 which marks r3 as invalid when r2 is not in 0x02000000-0x03FFFFFF
details: "ldr r2, [r1,#0x40]           ; loads current script-cursor pointer from object/state struct at offset\
  \ 0x40\n  loc_814E0D2: add r3, r2, #1 ; compute next cursor = current+1\n              str r3, [r1,#0x40] ; write\
  \ the advanced cursor back to [r1+0x40]\n              ldrb r3, [r2]     ; read byte at the OLD cursor (post-increment\
  \ style store; byte read first then... actually\n                                 ; the str already wrote the\
  \ new cursor, so the read at [r2] is the byte BEFORE advancing\n                                 ; the caller's\
  \ view; but the canonical pattern here is \"read byte, then advance\", and the\n                             \
  \    ; advance was done first; r3 holds the script opcode byte)\n              b sub_814E0B6      ; tail-jump\
  \ to sub_814E0B6, which range-checks r2 in r2 against RAM mask (0x02000000..0x03FFFFFF)\n                    \
  \             ; and clears r3 to signal \"invalid pointer in script stream\" when it falls outside; otherwise\
  \ leaves r3 alone.\n\n  So this is a script-stream step: read next opcode at [r1+0x40], bump the script position,\
  \ then validate the opcode as a\n  RAM-pointer argument via sub_814E0B6. The caller chain (battle update + chatbox\
  \ + sprite setup + several local wrappers\n  at 0x814E15C..0x814E234) all consume r3 as the dispatched byte/status.\
  \ Offset 0x40 on r1 matches AIData.Unk_40 or a\n  per-record streaming cursor; the wrappers store that returned\
  \ byte at offsets like +0xF, +0x1B on the caller's record\n  and set 0xC flag bits to flag the record dirty.\n"
