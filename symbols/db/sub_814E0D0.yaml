open_questions:
- Exactly which battle-object sub-struct owns +0x40 (AIData and several state structs each reserve it as Unk_40);
  the wrappers' "record at r1" may not literally be a BattleObject but a small per-call stream/state record copy.
- The semantics of the byte returned in r3 (opcode? index? status?) — it is clearly consumed as a state flag byte
  by all callers, so naming it "_runScriptStep" / "advanceAndReadScriptByte" fits even though the exact script is
  unknown.
