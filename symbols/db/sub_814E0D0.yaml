name: sub_814E0D0
address: '0x0814E0D0'
kind: function
previous_names: []
status: hypothesis
summary: Reads the next script command byte from a battle-object script stream and advances the script pointer,
  validating the decoded opcode.
interface: '(r1 = script state / context object) -> r0 = r1 (unchanged), r3 = validated opcode byte; side effects:
  advances the script cursor at [r1+0x40] by one, may clear r0 in sub_814E0B6 when the address is out of RAM range.'
details: "The function begins with `ldr r2, [r1, #0x40]`, loading the current script-cursor word\n  from offset\
  \ 0x40 in the r1 object. `add r3, r2, #1` then computes the post-increment\n  cursor, which is stored back via\
  \ `str r3, [r1, #0x40]`. The pre-increment cursor r2 is\n  dereferenced as a byte (`ldrb r3, [r2]`) to fetch the\
  \ next opcode, and execution falls\n  through to `sub_814E0B6` (the lone direct callee) which validates the byte.\
  \ After the\n  range check in sub_814E0B6, r3 holds either the just-fetched opcode (when the cursor was\n  in\
  \ RAM, 0x02000000-0x03FFFFFF) or 0 when the cursor was invalid.\n  The assembly is aligned and ends with `thumb_func_end`,\
  \ suggesting this is a tiny shared\n  inline helper rather than a separately called function — the fall-through\
  \ into\n  sub_814E0B6 means it is essentially the prefix of that routine when invoked through the\n  `bl sub_814E0B6`\
  \ style callers. Captured-call snapshots show r1 pointing at battle-object\n  sized structures (around 0x58 bytes\
  \ visible at @0x02010890 with a script-pointer word\n  at offset 0x40), and the cursor stored at +0x40 advances\
  \ between captures\n  (0x0818ea69 -> 0x0818d971 -> ...), consistent with an in-progress script walk.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r2, [r1, #0x40]` at sub_814E0D0 loads the 32-bit script cursor from r1+0x40. - `add r3, r2, #1`
    / `str r3, [r1, #0x40]` advances and writes back the cursor. - `ldrb r3, [r2]` reads the byte at the pre-increment
    cursor into r3. - `b sub_814E0B6` falls through to the range-check helper; its contract says it clears r3 when
    r2 isn''t a RAM pointer. - Captured-call entry r1 (e.g. 0x020080c8, 0x02007ee8) shows the value at +0x40 changing
    across snapshots (0x0818ea69, 0x0818d971, 0x0818dfdc, 0x0818e205, 0x0818e4fd, 0x0818e862), showing the script
    pointer is consumed and advances per call. - Caller `sub_814E1FC` is hypothesised to store the r3 result at
    [r1+0xF] and `sub_814E21C` to use it as a state byte, both consistent with sub_814E0D0 returning a decoded opcode.'
