name: sub_814E0D0
address: '0x0814E0D0'
kind: function
previous_names: []
status: hypothesis
summary: Advances the routine pointer at [r1+0x40] and reads the byte it points to, returning it in r3 with a validity
  check on the original pointer.
interface: (r1 = object-like state struct) -> r0 = r1 (preserved by tail-call), r2 = old pointer, r3 = byte at *oldPointer
  ; side effects updates the script/routine pointer at [r1+0x40]
details: "Loads the current routine pointer from offset 0x40 of the structure in r1 (`ldr r2, [r1,#0x40]`),\n  advances\
  \ a local copy by one (`add r3, r2, #1`), stores the incremented value back to [r1+0x40] so the\n  next call advances\
  \ further, then loads the byte at the original r2 (`ldrb r3, [r2]`) and tail-calls\n  sub_814E0B6. The callee\
  \ range-checks r2 (RAM pointer test) and clears r3 if invalid, otherwise leaves\n  the byte in r3. r0 is preserved\
  \ across the tail-call (B rather than BL) because the caller is going\n  to overwrite it anyway. The +0x40 offset\
  \ in callers' state structs (e.g. BattleObject at oBattleObject+X,\n  Chatbox struct) holds a forward-iterating\
  \ script cursor — this is the classic MMBN \"fetch next\n  command byte\" idiom.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r2, [r1,#0x40]` at sub_814E0D0 reads an offset-0x40 routine cursor from r1 - `add r3, r2, #1`
    / `str r3, [r1,#0x40]` post-increments that cursor back into the struct - `ldrb r3, [r2]` then loads the byte
    the original r2 pointed to - `b sub_814E0B6` is a tail call (no lr save), so r0/r1/r2 are call-clobbered as
    documented - callee summary states sub_814E0B6 "range-checks the value in r2 ... clears r3 to signal invalid"
    - callers consistently pass (r1 = some struct) and consume r3 as a script byte, e.g. sub_814E210 "stores the
    byte result it leaves in r3 at [r1+0x1B]", and chatbox_PrintBuffer_WriteNextGlyph_814E234 "Fetches the next
    glyph code from the text stream ... flagging the record as holding a glyph"'
