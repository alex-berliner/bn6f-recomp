name: sprite_makeScalable
address: '0x08002D14'
kind: function
status: confirmed
summary: Adjusts an object's sprite pointer to the nearest 16-byte-aligned scalable sprite data offset, then tail-jumps
  to a continuation routine that uses the scaled pointer.
interface: 'void sprite_makeScalable(void); // in: r5 = object ptr; out/clobbers: r5, r7, r0-r3, lr; clobbers: N,Z,C,V
  flags'
details: 'Reads the object''s sprite offset byte (oObjectHeader_SpriteOffset), rounds it down to a multiple of 16

  via (x >> 4) << 4, adds this rounded offset back to the object base pointer in r5, then tail-jumps

  into loc_8002D22 via a push/pop pair (the function pushes {r5,lr} so loc_8002D22 can pop them and

  return directly to sprite_makeScalable''s caller). The result is that the caller sees this function

  as a small wrapper that prepares a "scalable" sprite pointer and hands control to another routine

  which finishes initializing/animating the scalable sprite.

  Quirks: r5 holds the object pointer both at entry and exit (preserved across the tail call);

  register contract notes that r7 is preserved while r0-r3 and the condition flags are freely

  clobbered.

  '
