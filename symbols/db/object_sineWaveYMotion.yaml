name: object_sineWaveYMotion
address: '0x080DE6D0'
kind: function
status: probable
summary: Updates a battle object's sine-wave Y bobbing by advancing its phase (+0x66 + +0x67), sampling
  math_sinTable, scaling by 0xC00, sign-flipping via byte_80DE704 based on the +0x64 flag, adding to ExtraVars+8
  and storing to oBattleObject_Y.
interface: (r0 ignored; r5 = battle object) -> updates r5 object's oBattleObject_Y and its phase counter;
  no meaningful return
details: Reads a phase counter at object+0x67 and increments it, then fetches a halfword from math_sinTable
  at index counter*2 (0..0xFF range). The sine value is scaled by 12<<8 (amplitude 0xC00) and multiplied
  by a sign byte from byte_80DE704 indexed by (object+0x64)*4, which holds +1 for flag 0 and -1 for flag
  1. The result is added to oBattleObject_ExtraVars+8 and stored to oBattleObject_Y, giving smooth up/down
  oscillation. The caller toggles the +0x64 flag and negates YVelocity when the object reaches a turning
  point, flipping the bob direction.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sub_80DE6D0 reads object+0x67, increments it, and indexes math_sinTable with ldrh [r2,r3] after
    lsl r3,#1; result scaled by 0xC<<8 then multiplied by byte_80DE704 entry (+1/-1) selected by flag
    at object+0x64; sum added to oBattleObject_ExtraVars+8 and stored to oBattleObject_Y; caller at 0x080DE5CA
    calls it right after applying XVelocity, then object_setPanelsFromCoordinates and object_updateOccupiedPanel;
    caller loc_80DE5D8 eors flag object+0x64 and negates oBattleObject_YVelocity, matching a bounce turn-around
  refs:
