    reconcile)'
open_questions:
- which object/entity uses this bobbing (no callee summaries or spawn site seen)
- what ExtraVars+8 represents exactly (raw Y before sine offset vs. other state)
- The code at 0x080DE6D0 does read+increment the phase at +0x67, fetch from math_sinTable, scale by 0xC<<8,
  multiply by the sign word from byte_80DE704 indexed by (object+0x64)*4, and add to ExtraVars+8 writing
  Y — matching the summary. However the phase increment uses add r3,r3,r1 where r1 is the byte at +0x66,
  so it's not a simple counter; the proposed name 'object_sineWaveYMotion' is fine but the description
  of byte_80DE704 as +1/-1 is wrong (it's 1,0,0,0 then 0xFF,0xFF,0xFF,0xFF — i.e. +1 for flag 0, -1 for
  flag 1 as signed 32-bit), which is essentially right but the per-byte breakdown is off. The name is
  acceptable but could be clearer.
