open_questions:
- exact meaning of the packed r0/r1 arguments (which field is X vs Y vs size flags) needs a caller analysis
- contents/format of byte_2027200 and byte_80391A8 tables not confirmed
- why the accumulated width is never used — possibly dead code or the callers use it separately
- The loop counter decrement happens before any use (sub r4,#1 / blt), but r4 is never initialized from
  any parameter; the caller-supplied r0..r3 don't include a count. So termination is purely on NUL byte
  (tst r0,r0 / beq), not a separate count. The proposal's '(r2 = extra attr bits (<<12 | 0x420))' matches
  the code (lsl r2,#0xc / orr r2,0x420). The chatbox call reads byte_2027200+2+idx*8 and adds it to the
  saved x (r1=stored r0), confirming horizontal advance accumulation. Both indexes use byte_80391A8, confirming
  it as the char→glyph map. However the proposal's 'loops until NUL or count exhausted' is wrong (no count
  is passed), and the sprite_queueOamEntry call uses r1 as a pointer (add r1,r1,r2 then mov r2,#2/mov
  r3,#7), not as a plain tile number.
