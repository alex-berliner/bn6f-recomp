name: sprite_drawGlyphString
address: '0x0803B814'
kind: function
status: probable
summary: Queues one OAM sprite per character of a NUL-terminated string, mapping each byte through byte_80391A8
  to a glyph index, advancing x via chatbox_8045ED0, and submitting each sprite to sprite_queueOamEntry
  with tile-pointer = 0x40001000 + idx*4 and high attr bits (arg2<<12)|0x420.
interface: (r0 = packed pos/attr A, r1 = packed pos/attr B, r2 = extra attr bits (<<12 | 0x420), r3 =
  null-terminated string ptr) -> r0 = void; loops until NUL or count exhausted
details: Iterates over the NUL-terminated string at r3; for each byte it indexes byte_80391A8 to get a
  glyph/slot index. It points chatbox_8045ED0 at byte_2027200 + 2 + idx*8 (8-byte stride table, likely
  per-glyph OAM/width data) and accumulates the returned advance into the saved r0, though the sum is
  never read back out. Each glyph is submitted to sprite_queueOamEntry with r0 = (arg0<<16)|arg1|0x40001000
  and r1 = 0x40001000 + glyphIdx*4 (tile index in the low bits, 0x40001000 constant attr flags), r2=2,
  r3=7. The initial r2 argument is shifted left 12 and OR'd with 0x420 before use. Same glyph index is
  reused for both the chatbox lookup and the tile number, confirming byte_80391A8 is a char-to-tile map.
