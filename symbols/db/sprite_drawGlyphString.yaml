    bl sprite_queueOamEntryThunk_802FE28 inside the loop queues one OAM entry per character; r1 for queueOamEntry
    = 0x40001000 + (glyphIdx<<2), tying the sprite tile to the char table; loop exits on `ldrb r0,[r7];
    tst; beq` — null-terminated string semantics'
