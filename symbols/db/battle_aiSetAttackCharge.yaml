name: battle_aiSetAttackCharge
address: '0x080EC104'
kind: function
status: probable
summary: Sets an enemy AI attack's charge cycles from a difficulty-tier byte lookup at off_80EC118 (values
  1,1,1,3) and writes 4 to the attack's hit type.
interface: (r7 = enemy AI attack vars struct) -> r0 clobbered; writes oAIAttackVars_ChargeCycles and oAIAttackVars_HitElement;
  no return value
details: Reads the enemy's difficulty tier (oAIAttackVars_AiDifficultyTier), indexes the 4-byte table
  off_80EC118 {1,1,0x10,0x30} with it, and stores the result halfword into oAIAttackVars_ChargeCycles,
  so higher tiers give much longer charge times. It then unconditionally writes 4 to oAIAttackVars_HitElement,
  tagging the attack with a fixed element/type. r7 is a struct base used with offset field access; the
  function has no callers or callees recorded.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AiDifficultyTier] then ldrb r0,[r1,r0] indexes off_80EC118 by difficulty
    tier (sub_80EC104 lines 1-3); strh r0,[r7,#oAIAttackVars_ChargeCycles] stores the table value as the
    attack's charge time; table bytes 01 01 10 30 at off_80EC118 give per-tier charge values 1,1,16,48;
    mov r0,#4; strh r0,[r7,#oAIAttackVars_HitElement] sets a fixed element on the attack
  refs:
  - bn6f/asm/asm31.s:114569
  reproduce: python3 tools/asmcat.py 0x080EC104
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly correct but the charge values come from `ldrb r0,[r1,r0]` which reads a single
    byte, not a 4-byte table entry; `off_80EC118` is a single word `0x03010101` giving byte indices 0/1/2/3
    = 1/1/1/3, not {1,1,0x10,0x30}. The name `battle_aiSetAttackCharge` is fine but `HitElement` is actually
    hit type, so a better summary clarifies that.; run wf investigate investigate-20261019-052112; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- no callers known, so which attack/enemy this initializes and when it runs is unknown
- what element/type value 4 in oAIAttackVars_HitElement means in game terms
- The summary is mostly correct but the charge values come from `ldrb r0,[r1,r0]` which reads a single
  byte, not a 4-byte table entry; `off_80EC118` is a single word `0x03010101` giving byte indices 0/1/2/3
  = 1/1/1/3, not {1,1,0x10,0x30}. The name `battle_aiSetAttackCharge` is fine but `HitElement` is actually
  hit type, so a better summary clarifies that.
