    count is 3 (`[off_811E384+1, battleObject_setCoordsFromCutsceneScript_811E3CC+1, sub_811E40C+1]`),
    exactly the three documented CurState values 0/4/8. - `mov lr, pc; bx r0` followed by `pop {pc}` shows
