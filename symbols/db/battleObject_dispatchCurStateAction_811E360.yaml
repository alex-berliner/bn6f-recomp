summary: Dispatches a BattleObject's CurState via a small jump table after reading offset 0x8
interface: (r5 = BattleObjectPtr, r10 = toolkit ptr, lr) → side effects only; clobbers r0-r4, r6, r7,
  lr; NZCV flags modified
details: "Reads `r5` (BattleObject) byte at offset +8 (CurState per battle_object_struct: CUR_STATE_INITIALIZE\
  \ 0x00,\n  CUR_STATE_UPDATE 0x04, CUR_STATE_DESTROY 0x08). Loads a base pointer from `off_811E370`,\
  \ indexes by that byte,\n  fetches a function pointer, sets `lr = pc` and `bx`s through it (so callee\
  \ runs in ARM mode if +1 set).\n  The dispatch table at `off_811E374` has exactly 3 entries:\n    [0]\
  \ -> sub_811E384        (state 0x00: CUR_STATE_INITIALIZE)\n    [1] -> battleObject_setCoordsFromCutsceneScript_811E3CC\
  \  (state 0x04: CUR_STATE_UPDATE)\n    [2] -> sub_811E40C        (state 0x08: CUR_STATE_DESTROY)\n \
  \ `r6` is also preloaded with `eScenarioEffectState2000780` (saturating 0x40 loads indicate this points\
  \ at a\n  state buffer rather than toolkit). Because the tail call is via `pop {pc}`, this trampoline\
  \ returns to\n  whichever caller invoked it (lr is saved at entry, restored at exit), and the chosen\
  \ callee's return\n  value/flags propagate to that outer caller unchanged.\n  Called from one of the\
  \ BeastSp frames; offsets into on-BigBlue entry r2 (`0x087dd840`/`0x087dd8e5`) look like\n  BattleObject\
  \ pointers whose offset 0x8 byte is the CurState.\n"
