name: ai_setBoostAttackVars
address: '0x08012326'
kind: function
status: probable
summary: Initializes an AI attack-vars struct (caller-supplied via r7) with an attack boost of 0x100 or
  0x300, base damage 30, extra damage 148, and returns 0x5c; selected by entering at the top for boost
  1x or at loc_801232A for boost 3x.
interface: (r7 = pointer to AI attack-vars struct; entered at top for boost=1, at loc_801232A for boost=3)
  -> r0 = 0x5c; no flags meaningful
details: Stores a small value (1 or 3, depending on which of the two entry points is reached) shifted
  left by 8 into oAIAttackVars_AttackBoost2, so the field holds 0x100 or 0x300. It then writes halfword
  constants 0x1e (30) into oAIAttackVars_Damage and 0x94 (148) into oAIAttackVars_Damage+2 (ExtraDamage).
  Finally it sets r0 = 0x5c and returns via mov pc, lr, so the caller receives 92, possibly a timer, state
  id, or next-step selector. The dual entry (falling into loc_801232A from preceding code) suggests a
  shared tail selecting a weak/strong variant of the same attack. The struct base is caller-supplied in
  r7, so this is a helper for the battle AI's attack setup.
