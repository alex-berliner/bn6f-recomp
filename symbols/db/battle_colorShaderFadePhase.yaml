name: battle_colorShaderFadePhase
address: '0x080BEA78'
kind: function
status: probable
summary: Battle-object phase handler that fades the object's palette via color shader for ~30 frames (playing
  sound 0x94 unless Param4 >= 3), then clears the shader and advances to phase 4.
interface: (r0 = unused, r5 = battle object pointer) -> r0 = 4 (next phase) on completion; sets oObjectHeader_Flags
  bit 1 and writes phase 4 to CurPhaseAndPhaseInitialized
details: On first entry (PhaseInitialized clear) it sets Timer = 0x1E, and if Param4 < 3 plays sound effect
  0x94 and sets object flag bit 0x2; it always sets Timer2 = 0x1F and marks phase 4 as initialized. Each
  frame it decrements Timer; when it expires it calls sprite_zeroColorShader to reset the palette effect
  and stores phase 4. Meanwhile Timer2 counts down 31..0 and is clamped at 0, and the value Timer2*1057
  (Timer2<<5 +Timer2, <<5, +Timer2) is passed to sprite_setColorShader as the shader id, so the palette
  effect index steps down over the fade. The shader id stride of 1057 suggests a table of 32-entry palette-transform
  blocks, giving a smooth fade/flash across 32 steps. Param4 likely selects a variant (skip the sound,
  or a different visual).
