name: reqBBS_renderRankStars
address: '0x0814024C'
kind: function
status: confirmed
summary: Draws rank-star tile indicators beside each completed request on the BBS screen.
interface: void reqBBS_renderRankStars(reqBBS_Gui *gui /* r5 */) -> r5 unchanged
details: "Iterates over 8 request slots on the currently visible BBS page (page position read from oReqBBSGui_PagePos).\
  \ For each slot, resolves the request entry ID via reqBBS_eRequestEntriesIDs[page_pos + slot], builds an event-flag\
  \ address from reqBBS_textualPointers+8 plus that ID, and tests the flag. If the flag is set (request completed/active),\
  \ it: (1) calls sub_3005EBA to prepare a 32×32 tile block at screen column 0x16,\n    row (2*slot+3), block 2,\
  \ size 5×2;\n(2) reads the earned rank count from byte_813F380[entry_id] (rank 0 = one star,\n    so star count\
  \ = value+1, minimum 1);\n(3) loops j = 0..stars-1, calling CopyBackgroundTiles with column (0x1a - j),\n    row\
  \ (2*slot+3), block 2, tile-id pointer dword_81402C8 = {0x60896088},\n    1×2 tile size — stamping a single 4×4-pixel\
  \ star tile (8×8 bg tile ×2 rows)\n    from right to left so the first star is closest to the text.\nThe tile\
  \ ID 0x60896088 encodes two copies of background tile 0x88/0x89 (the rank-star glyph) for the two vertical rows\
  \ of the 32×32 block. r4–r7 are saved/restored around the two callee wrappers because the ABI marks them as preserved\
  \ but the wrappers route arguments through them.\n"
