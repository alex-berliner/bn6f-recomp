summary: 'Battle link-transfer builder (variant): the same packing as sub_801FF18, gated on arg bits 0x8 and 0x10
  instead of arg == 2; drains dword_203CBE0 one word per frame (counting down) when no link is connected.'
details: 'Body (asm01.s:305-421): arg & 8 selects the record path, arg & 0x10 skips the local-machine block; otherwise
  identical stores into dword_203F4A0 / dword_203F5A0 ("transfer buffer store 1/2") and the countdown drain of dword_203CBE0
  into eStruct2036780 ("transfer buffer store 3", one word per frame, highest index first).'
