name: fillOamTileStripes_8001930
address: '0x08001930'
kind: function
status: confirmed
summary: Fills a stripe of OAM attribute pairs (two linked rows per row index) with consecutive tile IDs.
interface: "void sub_8001930(u32 tile_id_base /* r0, low 12b */,\n                 u32 high_bits /* r1,\
  \ placed into bits 12+ */,\n                 u32 stride_entries /* r2, multiplied by 4 to get byte stride\
  \ */,\n                 s32 strip_count /* r3, decremented; 0 loops again, <0 means loop again */,\n\
  \                 OamEntry* dst /* r4 */);\n// clobbers nz c v r0 r1 r2 r3; preserves r4 r5 r6 r7; returns\
  \ via lr.\n"
details: 'Builds an OAM-region tile-ID table where each "slot" is actually a pair

  of OAM entries (4 bytes each, i.e. attr0/attr1 or attr2/attr3 depending

  on the OAM table layout in use). For each step of the inner loop it

  advances four consecutive tile IDs and writes them as two

  halfword pairs: the first pair at the running row cursor, the second

  pair at the same cursor offset by `stride` (i.e. the partner row that

  shares this row index in the typical battle OAM pairing).


  The outer control is unusual: after the inner cursor finishes one

  "stride" of 4-byte entries (checked by `cmp r5, r2` -> `blt`), r3 is

  decremented and the code branches back to `loc_800193A` if r3 went

  negative (`sub r3,#1` / `blt`). The effect is that an r3 of 0 means

  "loop once more" (because 0-1 underflows to negative and re-branches),

  while r3 >= 1 (originally 1 -> 0 after decrement) falls through to

  the `pop`. Callers therefore pass r3 = 0 to fill a single strip and

  bail; passing 1 or more keeps looping.


  Inputs are split deliberately: tile_id_base is the low 12 bits of the

  tile ID, high_bits provides the upper bits (palette/bank/rot-scaling

  flag depending on OAM mode), so callers don''t have to assemble the

  full ID themselves. r4 is preserved across the call (used as the

  destination base only via push/pop), so it survives as the user''s

  pointer.


  No flags are meaningfully communicated to the caller; the only

  preserved register of interest is r4 (dst pointer).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
