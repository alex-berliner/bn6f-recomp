open_questions:
- Which OAM table (OBJ/affine) is the second-row offset (`row_cursor + stride`) intended for? It matches
  the battle/field "OAM doubled per row" layout used elsewhere in the engine, but the caller decides whether
  the second pair is attr0/1 or attr2/3.
- The `sub r3,#1` / `blt` pattern is awkward; is r3 really meant as a trip count (>=1 = loop N times)
  or was 0 a sentinel for "one strip"? Worth tagging whichever caller is the canonical invoker.
- high_bits is shifted by 12 but no mask is applied before OR; callers must have already cleared the low
  12 bits of r1. Confirm against call sites.
- 'Retype: register form, old prompt; queued for retype (tools/abi/retype_queue.tsv), to be converted
  again as typed C (stages S3/S4)'
