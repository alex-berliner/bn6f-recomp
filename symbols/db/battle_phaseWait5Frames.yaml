name: battle_phaseWait5Frames
address: '0x080BEFC0'
kind: function
status: probable
summary: 'Battle object phase handler: on first entry starts a 5-frame timer, then when it expires switches
  the object to CurAction 0x20 and clears its phase state.'
interface: (r0 = battle object? passed in r5, not r0) -> void; no return value, flags clobbered
details: Reads oBattleObject_PhaseInitialized; if 0, it stores Timer=5 (strh) and PhaseInitialized=4,
  marking the phase as initialized. Each call then decrements oBattleObject_Timer; while the result is
  >=0 it returns. Once the counter reaches -1, it writes 0x20 to oBattleObject_CurAction and zeroes oBattleObject_CurPhaseAndPhaseInitialized
  (phase id 0, initialized 0), advancing the object to the next action. Uses r5 as the object pointer,
  so the caller passes the battle object in r5 (typical of this game's phase-handler convention) rather
  than via arguments.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / mov r0,#5 strh -> [Timer] / mov r0,#4 strb ->
    [PhaseInitialized]: one-time 5-frame delay setup; ldrh r0,[Timer]; sub r0,#1; strh; bge return: counts
    down each invocation until negative; mov r0,#0x20 strb [CurAction]; mov r0,#0 strh [CurPhaseAndPhaseInitialized]:
    fires transition to action 0x20 when timer expires; no callees and pure object-field manipulation:
    consistent with a battle phase/timer handler invoked once per frame'
