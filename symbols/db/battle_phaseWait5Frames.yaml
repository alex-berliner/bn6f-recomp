    run wf investigate investigate-20261019-055111'
open_questions:
- which battle object / phase invokes this handler (no callers known), so the meaning of action 0x20 and
  where the 5-frame wait fits in the battle flow is unknown
- whether r5 is set by a shared dispatch routine that iterates battle objects
