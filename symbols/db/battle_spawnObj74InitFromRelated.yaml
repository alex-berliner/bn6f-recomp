open_questions:
- What battle object kind 0x4a actually is — needs the object type table or a named caller (none known)
  to give it a gameplay name
- Why the callee leaves the object pointer in r5 (or whether object_spawnType4's contract is return-by-r5)
  — verify in the callee's disassembly
- Which chip/attack code path calls this and what the related object normally is (parent attack entity?)
