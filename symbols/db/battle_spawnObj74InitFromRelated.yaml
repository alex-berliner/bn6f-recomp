name: battle_spawnObj74InitFromRelated
address: '0x080E5EA8'
kind: function
status: probable
summary: Spawns battle object kind 0x4a and fills it with panel position, element, chip ID and data copied
  from a related/parent object.
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = related object ptr, r6 = damage/stamina-counter
  word, r7 = chipID) -> r0 = new object (r5==0 skips init); sets flags, clobbers r6-r7
details: Saves the caller's r0-r2/r5 with push {r0-r2,r5}, which also plants the original r0 on the stack
  as the fifth argument to object_spawnType4, called with type 0x4a in r0 and r1-r3 passed through. After
  the call the new object pointer (left in r5 by the callee) is moved to r0 and null-checked via the flag-setting
  mov; the pop then shifts the saved args down one register (r1=old r0, r2=old r1, r3=old r2) and restores
  r5. If the spawn succeeded it stores PanelX/PanelY/Element bytes, copies the related object pointer
  into RelatedObject1Ptr, copies AllianceAndDirectionFlip by halfword out of the related object, and writes
  the damage-counter word and ChipID. Notably it never saves r6/r7, so callers must keep those values
  in registers and not need them preserved, suggesting it is a specialized helper for one call site pattern.
  The parent-object copy (alliance/flip field) means the new entity mirrors the alignment/facing of its
  related object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0x4a; bl object_spawnType4 — spawns battle object kind 0x4a using saved r0 as the
    stack-passed 5th param; pop {r1-r3,r5} shifts saved r0-r2 into r1-r3, matching the strb r1/r2/r3 ->
    PanelX/PanelY/Element stores; str r5,[r0,#oBattleObject_RelatedObject1Ptr] + ldrh from [r5,#AllianceAndDirectionFlip]
    copies parent object data; str r6/r7 into DamageAndStaminaDamageCounterDisabler and oBattleObject_ChipID
    with no prior save of r6/r7; beq locret right after the flag-setting mov on the spawned-object register
    skips all field writes on failure'
