name: sub_8046356
address: '0x08046356'
kind: function
status: confirmed
summary: Advances a per-step "column-reveal" bitmap effect (byte_200A220) one column, OR-ing a pixel pattern into
  12 row-words of a bitmap and bumping its step counter.
interface: void bitmapRevealStep_8046356(void); /* pushes caller r0, returns caller_r0+1 in r0; clobbers r1,r2,r3,r4,r6,r7;
  C/V set by the final ADD r0,#1, N/Z forced from r3=1 */
details: "Operates on a 5-field state block rooted at A_byte_200A220:\n  +0x00 u8   row stride (in bytes)\n  +0x01\
  \ u8   monotonic step counter (incremented every call)\n  +0x1C u32  packed cursor = stride * 112 * counter  (>>5\
  \ = word index, &0x1F = bit index)\n  +0x20 u32  base pointer of the bitmap row words\n  +0x38 u32  pixel mask\
  \ for the column being drawn\n\nPer call: splits the packed cursor into word index and bit offset; forms a mask\
  \ with its low `bit` bits cleared ((mask >> bit) << bit); ORs that mask into 12 row words spaced `stride` bytes\
  \ apart. Stores are skipped entirely when bit == 0 (the `tst r6,r6 / ble` path). Then bumps +0x01, and rewrites\
  \ +0x1C as `stride * 14 * 8 * counter` (= stride * 112 * counter), so the next call lands 7 columns further in\
  \ (14 bytes = 14*8 bits).\n\nQuirks: the prologue pushes caller r0 and the matching pop+`add r0,#1` just before\
  \ `mov pc,lr` makes the function appear to \"return caller_r0+1\" even though it has no real return value. r6\
  \ keeps the bit offset, r7 keeps the literal 14, r4 keeps the new counter for the caller. Used to animate a screen-wide\
  \ bitmap being revealed one column at a time (common transition graphic).\n"
