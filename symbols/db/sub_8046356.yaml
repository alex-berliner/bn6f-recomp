open_questions:
- Which bitmap (full screen vs. window) and which call site actually invokes this stepper — no caller evidence in
  this snippet.
- Why the stores are skipped when bit == 0 (intentional no-op on word boundaries vs. bug preserved from the original).
- 'Exact dimensions of the bitmap: stride is a byte from A_byte_200A220 and the row count is hard-coded to 12 —
  probably a 12-row tile-strip or 96-pixel-tall surface.'
- The factor 14*8 = 112 columns/step is not 32 (one full word per step), so the cursor advances two words per call;
  whether that 14 stride comes from another state field somewhere or is a fixed constant of this effect is unclear.
