name: ai_attackStepOntoPanel
address: '0x080EBB98'
kind: function
status: probable
summary: 'AI attack step: once the attack animation reaches its impact frame, the object moves from its
  reserved future panel onto the target panel and arms the hit with element 0x10.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 0x10 stored to oAIAttackVars_HitElement;
  no return value used
details: This is an AI attack-state step for a battle object. It reads NaviStats byte 0x2C for the object's
  alliance; if it is in range 0xB–0x18 the object skips the movement phase entirely and just sets HitElement=0x10
  (a ranged/special attack variant that hits without stepping). Otherwise it waits until sprite_getFrameParameters
  reports the 0x80 (impact) animation flag; when AiAttackParam==1 it toggles oBattleObject_DirectionFlip
  and refreshes the sprite/arm and tracked-arm position, then copies oBattleObject_FuturePanelX/Y into
  PanelX/Y, releases the reserved panel, updates collision panels, and recomputes pixel coordinates from
  the new panel. Finally it stores 0x10 into oAIAttackVars_HitElement so the attack proceeds to hit processing
  with that element. Pairs with ai_attackWaitForObject as the spawn/wait counterpart of the same attack
  sequence.
