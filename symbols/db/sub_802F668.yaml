name: sub_802F668
address: '0x0802F668'
kind: function
status: confirmed
summary: Initializes (or restarts) the title/start screen — clears counters, resets the menu cursor, starts the
  title music, loads background tiles, fades in, and advances to state 4.
interface: '(self: StartScreen * in r5) -> void; clobbers r0-r4, lr, flags; preserves r5-r7, r10'
details: 'Takes the start-screen state block in r5. Zeroes the two step/frame counters at +0xE and +0xF, and stores
  0xA46 into the halfword at +4 (comment in the C version says this resets the selected menu entry to the first
  row, though the value looks more like a tilemap/VRAM transfer word — see open questions). Calls music_80005F2(1)
  to start the title-screen BGM, calls sub_80015FC(0xA) (purpose unknown), programs the LCD control register via
  SetRenderInfoLCDControl(0x1340), zeroes the cursor index byte at +6, reloads the background tiles via copyBGTiles_802FD3C,
  and starts a screen fade with SetScreenFade(8, 0x10) (type 8 = fade-in, speed 0x10). Finally writes 4 into the
  state/jump-table index byte at offset 1 (oStartScreen_JumpTableOff_01), which makes the dispatcher at ho_802F63C
  invoke handler sub_802F6A4 next frame.

  '
