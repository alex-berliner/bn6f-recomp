name: object_spawnCollisionRegionAtBattleObject
address: '0x080DB078'
kind: function
status: probable
summary: Spawns a collision-region object at the battle object's panel (PanelX, PanelY, Element), using
  object_spawnDimmingCollisionRegion when Param1 is nonzero and object_spawnCollisionRegion otherwise.
interface: (r0 unused on entry; r5 = source battle object) -> r0 = spawned object pointer?; flags from
  callees
details: 'Reads PanelX, PanelY and Element from the battle object at r5 and passes them with r3=0, r4=0x6050A01
  (collision-region type/graphics constant) to object_spawnCollisionRegion or object_spawnDimmingCollisionRegion.
  The branch on oBattleObject_Param1 selects which spawner: nonzero Param1 uses the dimming variant that
  keeps running during timestop. r6 is copied from the object''s DamageAndStaminaDamageCounterDisabler
  field in both paths, and r7 is a per-instance value (1 or 3) fetched from a pointer table selected by
  the same data reference. Pure wrapper: no local state, no flags used directly.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element then bl object_spawnCollisionRegion (loc_80DB096
    branch mirrors it with object_spawnDimmingCollisionRegion); tst r0,r0 on oBattleObject_Param1 picks
    dimming vs normal spawn; r4 constant 0x6050A01 passed as the type/graphics argument in both paths;
    r6 loaded from oBattleObject_DamageAndStaminaDamageCounterDisabler and forwarded unchanged; only caller
    sub_80DAF98 and callee summaries match spawning a region object tied to an existing battle object
  refs:
  - bn6f/asm/asm31.s:76360
  - 0x080DAF98 sub_80DAF98
  - 0x080C53A6 object_spawnDimmingCollisionRegion
  - 0x080C536A object_spawnCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080DB078
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches: both paths read PanelX, PanelY, Element, set r3=0, r4=0x6050A01, copy r6 from
    oBattleObject_DamageAndStaminaDamageCounterDisabler, and select r7 from a pointer table (offset +0
    for normal, +4 for dimming). The branch on oBattleObject_Param1 picks between object_spawnCollisionRegion
    and object_spawnDimmingCollisionRegion. However, the proposed name object_spawnCollisionRegionForObject
    is slightly off; a wrapper that spawns either variant based on a flag is better named for the higher-level
    intent.; run wf investigate investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
