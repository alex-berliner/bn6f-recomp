name: battle_main_8007800
address: '0x08007800'
kind: function
status: confirmed
summary: 'Per-frame battle tick: runs pre-frame hooks, dispatches to the active state handler via jump table, then
  increments frame counter and returns state-byte nibbles plus active-effect count to the caller.'
interface: battle_tick_8007800(void) -> returns (r0 = stateByte@0x0A, r1 = stateByte_loNibble, r2 = stateByte_hiNibble,
  r3 = activeEffectsCount; flags N/Z from r0, C=0, V from callee); inputs r2 r4 r5 r6 r7 r8 r9 r10 r11 r12 lr; preserves
  r4 r5
details: 'Fetches the BattleState pointer from Toolkit (r10 + oToolkit_BattleStatePtr). Reads a byte at oBattleState_Index_00
  and uses it directly as a table offset into a 6-entry jump table at 0x08007838. Entries: 0x00 -> sub_8007850,
  0x04 -> battle_update_8007A44, 0x08 -> sub_8007B80, 0x0C -> sub_8007E62, 0x10 -> sub_8007F4E, 0x14 -> removed_8007FEA
  (stubbed out). After dispatch, increments the u32 counter at oBattleState_Unk_60 (per-frame tick counter), calls
  GetBattleEffects to get the count of currently active battle effects into r3, and calls battle_getStateByteNibbles_800A832
  to split the raw state byte into two nibbles (returned in r1/r2 after rearrangement). Finally loads the byte at
  oBattleState_Unk_0A into r0 and TSTs it to set flags for the caller. Pre-frame hooks sub_801FE6C and sub_8020140
  run unconditionally before dispatch. The handler for index 0x14 is marked ''removed'' in the ROM.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
