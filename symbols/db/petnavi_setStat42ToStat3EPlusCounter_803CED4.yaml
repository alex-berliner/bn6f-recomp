name: petnavi_setStat42ToStat3EPlusCounter_803CED4
address: '0x0803CED4'
kind: function
status: confirmed
summary: Computes stat 0x3E of the current PET navi plus a 16-bit counter held by the toolkit, and stores the result
  into stat 0x42 of that same navi.
interface: 'void sub_803CED4(r10: toolkit_ptr); /* reads r4/r6/r7 as live regs (preserved), r10 = toolkit base;
  returns sum in r2; clobbers r0,r1,r2,r3, flags, lr */'
details: 'Calls GetCurPETNavi() to learn which navi is currently equipped on the PET, then reads that navi''s 16-bit
  stat 0x3E via GetCurPETNaviStatsHword(navi, 0x3E). It loads the toolkit''s oToolkit_Unk2004334_Ptr pointer, dereferences
  it, and reads the 16-bit halfword at offset 0 of the pointed-to object — apparently a running counter or accumulation
  tracked elsewhere in the toolkit. It adds that counter to stat 0x3E and writes the sum back with SetCurPETNaviStatsHword(navi,
  0x42, sum). In effect, stat 0x42 is a derived value: base stat 0x3E plus the external counter. The function preserves
  r4/r6/r7 across its calls (pushed/popped), and leaves the computed sum in r2 on return, so callers may consume
  it. No early exits or bounds checks; the addition is plain 32-bit math on two 16-bit sources (can overflow the
  16-bit field when written back, if the setter truncates).

  '
