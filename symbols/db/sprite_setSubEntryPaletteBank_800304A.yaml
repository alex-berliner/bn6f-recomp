name: sprite_setSubEntryPaletteBank_800304A
address: '0x0800304A'
kind: function
status: confirmed
summary: Stores a 4-bit palette bank into the high nibble of byte +0x15 of one 0x10-byte sub-entry of an object,
  selected by the high nibble of the object's byte at +2.
interface: void sprite_setSubEntryPaletteBank(u32 paletteBank /* r0, 0-15 */, void *obj /* r5 */); sets NZ/C/V as
  side effects, returns r0 = paletteBank << 4, r1 = new byte value, r2 = 0xF0, r3 = sub-entry address
details: 'Reads the object''s byte at +2 and takes its high nibble (<<4 = high nibble shifted to bits 4-7, i.e.
  slot*0x10) as an offset into the object, selecting one 0x10-byte sub-entry. It then reads that sub-entry''s byte
  at +0x15, clears the top nibble with 0xF0 (bic), shifts the incoming palette bank left by 4, ORs it in, and stores
  the byte back. The low nibble of +0x15 is preserved. This byte''s high nibble is the palette bank/row used by
  the sub-entry''s graphics (typical MMBN object layout: sub-entries of 0x10 bytes holding sprite/palette metadata).
  No stack use, no callee-saved register preservation; r0-r3, NZCV are all clobbered. Callers are expected to ignore
  r0-r3 per the contract, though r0 does return bank<<4.

  '
