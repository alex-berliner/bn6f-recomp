name: battleObject_chipSelectTick
address: '0x08026E78'
kind: function
status: probable
summary: 'Per-frame tick for the chip-select object: when bit 0x80 of eFlags2009F38 is clear, plays sound
  0x9E, sets state byte to 0x54 and phase halfword to 0, then always calls battleObject_chipSelectAnimTick_8029C08.'
interface: (r0 = self, chip-select object at S20364C0) -> r0 = destroyed; calls PlaySoundEffect / chipSelectAnimTick,
  flags from flag test
details: Tests bit 0x80 of the event-flag word eFlags2009F38 via chatbox_mask_eFlags2009F38. If the bit
  is clear (menu not busy/gate not active), it plays sound effect 0x9E, stores 0x54 into byte self+1 (likely
  a state/animation id) and 0 into halfword self+2 (likely a phase/counter), then always calls battleObject_chipSelectAnimTick_8029C08,
  which pushes an OAM affine record and walks the pulse phase byte. The flag-gated sound+reset pair suggests
  this runs each frame while the chip-select object is active, re-arming the pulse state whenever the
  gate allows.
