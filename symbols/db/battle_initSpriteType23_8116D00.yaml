name: battle_initSpriteType23_8116D00
address: '0x08116D00'
kind: function
status: confirmed
summary: Initializes a battle sprite of type 0x23 (GUI-linked), loads its animation and palette, positions
  it on-screen, marks state as active (step 4), and tail-calls the next behavior step.
interface: void battle_initSpriteType23_8116D00(/* r1 = gui_arg */ u32 guiArg, /* r5 = obj */ u32 obj)
details: 'Operates on a battle sprite record at r5 (the current sprite being managed by the battle object
  dispatcher).

  Writes type ID 0x23 at obj+0, then calls initGuiSprite_8002770(2, r1) to associate the sprite with GUI

  slot 2. Copies the animation index from obj+4 into both animation slots at obj+0xC and obj+0xD, then

  calls sprite_setAnimation, sprite_loadAnimationData, sprite_noShadow, sprite_setSubEntryPaletteBank(0xC),

  sprite_setPalette(0), sprite_setPriority(0). Reserves an OAM slot via slotList_storeHalfwordAndClearField(0x38B)

  and clears the sub-record field A. Sets obj+8 (behavior state) to 4 (active). Chooses x-coordinate and

  y-offset based on the variant byte at obj+5: if non-zero, x=0xAA and y_offset=4; otherwise x=0x11A and

  y_offset=0; y-coordinate is always 0x97. Stores y_offset at obj+9. Finally tail-calls

  battle_objectRunBehaviorStep_8116D6C with r2 = y_offset, which continues the sprite''s state machine.

  The function does not return normally (pop {pc} after the tail call).

  '
