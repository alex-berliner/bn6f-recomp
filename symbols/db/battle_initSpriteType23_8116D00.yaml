open_questions:
- What does type 0x23 represent in game terms (which battle object/sprite class)?
- Is gui_arg (r1) a pointer to the GUI element the sprite is attached to, or an index?
- What is the significance of coordinate pair (0x11A,0x97) vs (0xAA,0x97) — are these fixed screen positions
  for two layout variants?
- Why is the same animation index written to both slots +0xC and +0xD; what differentiates the two slots
  downstream?
- Does battle_objectRunBehaviorStep_8116D6C at 0x08116D6C handle states 5+ or is 4 the terminal state?
