name: folder_ChipCodeCountTileBuffer
address: '0x02016300'
kind: data
status: probable
summary: 'Proposed name: folder_ChipCodeCountTileBuffer. 256-byte tile buffer used by the folder screen
  to render the selected chip''s four code letters plus per-code ''copies in folder'' tallies before queueing
  them to VRAM. (u8)'
details: Lives in EWRAM at 0x02016300, 256 bytes wide. folder_DrawSelectedChipCodeCounts_8117A14 zeroes
  it via ZeroFillByEightWords(0x80 words), then calls folder_CountChipsOfCodeOrSkipEntry_8117AA0 twice
  (once per chip code letter) to fill in the per-code 'copies in folder' counts, and finally hands it
  to QueueEightWordAlignedGFXTransfer to upload as a 0x200-byte block to VRAM at 0x6013B40. The buffer
  is cleared and rebuilt every call, so it is a scratch tile buffer rather than persistent state.
