    getChip8021DA8 right after clearing, using the buffer as the working tile area; asm32.s:20329 folder_DrawSelectedChipCodeCounts_8117A14
    writes per-code tallies via folder_CountChipsOfCodeOrSkipEntry_8117AA0 into the buffer; asm32.s:20329
