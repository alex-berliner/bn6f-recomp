name: object_waitTimerThenFree
address: '0x080E7756'
kind: function
status: probable
summary: Battle-object update step that waits a configured delay, then releases the object's memory when
  the timer expires.
interface: (r0 unused; r5 = battle object pointer) -> void; frees the object via object_freeMemory when
  Timer runs out
details: Standard per-object script step using r5 as the object. On first invocation (PhaseInitialized
  == 0) it copies Param1 into Timer as the lifetime and sets PhaseInitialized to 4 so initialization runs
  only once. Each call thereafter decrements Timer; while the result stays >= 0 the object keeps running.
  Once the countdown goes negative, it calls object_freeMemory to release the object's slot, flags, bitmap,
  and list linkage. Param1 thus acts as a frame-count delay before despawn.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb PhaseInitialized + tst/bne guard makes the Param1->Timer copy a one-time init (asm lines
    2-7); strh r0,[r5,#oBattleObject_Timer] seeds the countdown from oBattleObject_Param1; ldrh/sub/strh
    on oBattleObject_Timer with bge keeps the object alive while the countdown is non-negative; bl object_freeMemory
    fires only when the timer underflows, matching the callee's documented slot-release behavior
