name: sprite_clearSlot_8002BCC
address: '0x08002BCC'
kind: function
status: confirmed
summary: Reset a sprite slot by hiding its OAM attribute (0x7FFF) and marking its link field as free (-1).
interface: 'void sub_8002BCC(void /* r5 = sprite base */);  /* inputs: r5, lr; outputs: r0, r5; clobbers:
  nz, c, v; preserved: r0-r7 */'
details: 'Reads the low byte of the sprite base as a slot index. Writes 0x7FFF to the OAM

  attribute word at offset (index*2 + 4) (hides the sprite) and -1 (0xFFFFFFFF) to the

  slot''s link/extra u32 at offset (index*4 + 0x1C) to mark it free. Effectively the

  inverse of allocation; used to release/free a sprite entry in the OAM/OBJ buffer

  managed through the r5-passed base pointer. All other registers (including r0) are

  preserved by the symmetric push/pop of r0-r7+lr/pc, making it look-through from the

  caller''s perspective.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
