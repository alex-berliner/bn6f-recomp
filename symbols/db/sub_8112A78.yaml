name: sub_8112A78
address: '0x08112A78'
kind: function
previous_names: []
status: hypothesis
summary: AI counter-attack timer/state driver for a BattleObject's combat counter-throw state.
interface: '(r5 = BattleObject, r6 = AIState, r7 = AIAttackVars, r4 = AIData, r10 = Toolkit) -> void ; side effects:
  writes AIState, BattleObject ExtraVars, AIAttackVars, calls object_setAttack0 / object_getFlag / FindBattleActorsWithNonzeroParam_ReturnCountAndSum'
details: "On entry clears the ExtraVars+0x14 byte (used as a \"ready\" flag) and inspects AIState_Unk_08\n  (a halfword\
  \ timer): if 0xFF the state is inactive so it returns; otherwise it decrements the timer\n  and if it hits 0 it\
  \ parks the attack-vars state machine at sub_8112B06, sets CurAttack0 = 0x0a and\n  clears AIState_Unk_00 (idle).\n\
  \  When the timer is not expiring, it checks the long-lived counter flag at BattleObject.ExtraVars:\n  - If already\
  \ set, it requires none of two environmental checks (FindBattleActorsWithNonzeroParam\n    for param 0x74 then\
  \ 0x64, with alliance bits 0x84/0x7f) to return zero, AND the object must\n    not have the OBJECT_FLAGS_FROZEN\
  \ bit (0x8000) set. If both pass, the counter state is launched:\n    * copies AIData.Version_16 into AIAttackVars.Unk_03\
  \ and uses it to index 4 separate version-keyed\n      tables (byte_81129DC, byte_81129E2, byte_81129E8, byte_81129D0)\
  \ that fill Unk_10/Unk_12/Unk_18\n      and Damage.\n    * hardcodes Unk_0a = 0xa, Unk_0c = 0x64, Unk_0d = 0x68,\
  \ zeroes ExtraVars+8/0xc/0x10, sets the\n      ExtraVars+0x14 flag, and calls object_setAttack0(0x0b).\n"
