name: sub_80FFA78
address: '0x080FFA78'
kind: function
status: hypothesis
summary: Two-instruction thunk that hands a fixed constant table (first word "0x0C101216") and the caller's r5 to
  sub_800FE28 and returns its result.
interface: 'u32 sub_80FFA78(u32 r5); /* in: r5 passed through to sub_800FE28; out: r0 = sub_800FE28''s r0 */'
details: 'Pushes lr, loads r0 with the address of dword_80FFA88 (a literal pool right after the

  function whose single word is 0x0C101216), then bl''s sub_800FE28 and pops pc, so it is

  effectively a tail call. The pointer in r0 and the caller''s r5 are the only arguments

  forwarded; whatever sub_800FE28 returns in r0 is returned to this function''s caller

  (r2, which sub_800FE28 also sets, is discarded because every caller treats r2 as a

  clobber). So this is purely a wrapper: the actual behavior lives in sub_800FE28, and

  the only information added here is which constant table it is invoked on. The word

  0x0C101216 looks like an encoded header (packed size/dimension/count fields typical of

  sprite/graphics metadata packets), which suggests sub_800FE28 is a data-driven setup

  routine — e.g. a sprite or resource loader — but that is inference, not observation.

  Note that r0 at entry to this function is not part of the contract (callers do not set

  it); only r5 and lr are passed in.

  '
