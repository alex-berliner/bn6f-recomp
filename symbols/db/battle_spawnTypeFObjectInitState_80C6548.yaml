name: battle_spawnTypeFObjectInitState_80C6548
address: '0x080C6548'
kind: function
status: confirmed
summary: Spawns a battle object of spawn type 0xF and initialises its panel position, element, alliance (inherited
  from a source object) and damage/stamina counter disabler field.
interface: Next battle_spawnTypeFObjectInitState(u32 panelX /*r0*/, u32 panelY /*r1*/, u32 element /*r2*/, u32 spawnArg
  /*r3*/, BattleObject* srcObject /*r5*/, u32 damageDisabler /*r6*/); returns the new object pointer (or NULL) in
  r0; on success r1 holds the source object's alliance byte on the way out. Flags clobbered.
details: 'Thin wrapper around object_spawnType3: stashes the caller''s r0-r2 and r5 with push {r0-r2,r5}, sets r0
  = 0xF (the spawn type argument) while leaving the caller''s r1-r3 in place as further spawn arguments, and calls
  object_spawnType3. That callee delivers its result oddly: the new object pointer (NULL on failure) is left in
  r5. This wrapper then pops the stashed values back shifted by one slot (stashed r0 -> r1, r1 -> r2, r2 -> r3,
  stashed r5 -> r5), so the stores see the caller''s panel X / panel Y / element in r1-r3. The spawn''s success
  test is done by ''mov r0, r5'' (which sets flags) right after the pop. On success it writes the new object''s
  oBattleObject_PanelX, oBattleObject_PanelY and oBattleObject_Element bytes, copies the alliance byte from the
  source object given in r5 (oBattleObject_Alliance, also returned in r1), and stores the caller''s r6 word into
  oBattleObject_DamageAndStaminaDamageCounterDisabler. The caller''s r4-r7 are preserved across the whole routine
  (pushed/popped around the call). The original r3 input is only consumed by object_spawnType3 itself; it is not
  used for the field initialisation.'
