name: object_hitCountdownTick
address: '0x080D69B8'
kind: function
status: probable
summary: 'Per-frame update for a hit battle object: spawns its hit effect, counts down its timer, and
  destroys it (state DESTROY) when the timer runs out or collision flags demand it.'
interface: (r5 = battle object) -> r0 = 0 or ...; sets object state to CUR_STATE_DESTROY on expiry
details: 'This is the ''dying/hit'' state handler for a battle object kept in r5. It first tears down
  the object''s collision data (object_removeCollisionData) and spawns the jittered hit-effect object
  at its position (object_spawnCollisionEffect). It then reads oCollisionData_FlagsFromCollision from
  the object''s collision data: if any flag is set it jumps straight to destruction. Otherwise it decrements
  oBattleObject_Timer; while still positive it refreshes the object''s per-frame collision state via object_presentCollisionData
  and returns. When the timer expires (or flags were set), it clears the object''s collision region and
  writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized, removing the object
  from the battle.'
