    tst r0,r0 on oCollisionData_FlagsFromCollision forces immediate destruction branch; mov r0,#CUR_STATE_DESTROY;
    str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]: terminal state write; object_presentCollisionData
    called each surviving frame to keep collision bookkeeping updated'
