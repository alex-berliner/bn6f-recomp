name: sub_801DC7C
address: '0x0801DC7C'
kind: function
status: confirmed
summary: Claims a slot in the four-slot battle status list at 0x203EB50 for a battle object, caching its name ID
  and HP for the status UI.
interface: '/* r0=param0, r1=param1, r5=battle object -> r0; preserves r4,r6,r7 */

  u32 sub_801DC7C(u8 param0, u8 param1, struct BattleObject *obj);

  '
details: "Scans a 4-entry x 0x14-byte table at byte_203EB50 looking for a free slot (kind byte == 0).\nDuring the\
  \ scan, if it encounters a slot whose 0xC field already equals the passed-in\nbattle object pointer, the object\
  \ is treated as already-listed: returns r0=1 and leaves\nr2 (the existing slot's object pointer), r3 (remaining\
  \ slots, often 0), C=1, V=0.\nOn a fresh claim the slot is initialised:\n  +0x0  kind     = 0x1B if nameID ==\
  \ 0xEB or 0x49..0x4E, else 3\n  +0x2  HP       = obj->oBattleObject_HP (u16)\n  +0x4  param0   = caller's r0\n\
  \  +0x5  param1   = caller's r1\n  +0x6  nameID   = obj->oBattleObject_NameID (u16)\n  +0x8  zeroed\n  +0x9  zeroed\n\
  \  +0xC  object   = r5\n  +0x10 stamp    = 0x0B0B0B0B\nThen eStruct2035280_SetRequestBits_801BECC is called with\
  \ bits=4, which is the UI\nrefresh request that rebuilds the status readouts. r2/r3 are still live across that\n\
  call so the caller sees the callee's leftover r2 and the new kind in r3; the last\nflag-setters were the nameID\
  \ range compares against 0x4E.\n"
