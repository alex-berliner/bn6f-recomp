name: object_countPanelEntriesWithByte3
address: '0x0800D700'
kind: function
status: probable
summary: Counts how many of the three indexed entries (indices 1-3) in a structure rooted at r0 have the
  byte at offset 3 equal to r1, returning the count.
interface: (r0 = base pointer passed to object_getPanelDataOffset, r1 = value to match) -> r0 = count
  of matching entries; flags clobbered by callees
details: The function loops r7 from 1 to 3 inclusive, calling object_getPanelDataOffset(base, r7) to obtain
  a pointer to each indexed entry, then loads the byte at [ptr+3] and increments a counter when it equals
  r1 (the second argument, saved in r5). It returns the counter in r0. The data following the routine
  (unk_2034010 pointers and a large byte table of values like 0x22/0x32/0x33) appears to be neighboring
  data, not referenced by this loop. Since the project has no known callers, the meaning of the byte at
  offset 3 in the panel-data structure and what the match value r1 represents (e.g. a panel state, owner,
  or attribute) is inferred only from the callee's name and signature.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_800D700 loop at loc_800D70A: bl object_getPanelDataOffset with r0=r6 (arg0), r1=r7 (index
    1..3); ldrb r1,[r0,#3]; cmp r1,r5; add r4,#1 — counts entries whose byte at offset 3 equals arg1;
    add r7,#1; cmp r7,#3; ble loc_800D70A — exactly three indexed entries are examined; mov r0,r4; pop
    — the accumulated count is the return value'
