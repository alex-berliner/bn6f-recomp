name: battle_waitPhaseHandler
address: '0x080DF3F0'
kind: function
status: probable
summary: Battle-object phase handler that waits 20 frames, then hands the object to action 8 (first-frame
  init sets phase 4, anim 0, Z=0).
interface: (r5 = battle object) -> void; no return value
details: 'A per-phase update routine for a battle object whose pointer is kept in r5. On phase 0 it initializes:
  CurPhase=4, CurAnim=0, Z=0, Timer=0x14 (20 frames). On phase 4 it decrements oBattleObject_Timer each
  frame; when the timer hits zero it sets oBattleObject_CurAction=8 and clears oBattleObject_CurPhaseAndPhaseInitialized
  so the new action''s phase handler starts fresh. No callees, no callers known; behavior is entirely
  this state transition.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst/bne splits first-frame init from the wait phase;
    init block: CurPhase=4, CurAnim=0, Z=0, Timer=0x14; wait block: ldrh/sub/strh on oBattleObject_Timer
    with bgt keeps waiting until 0; on expiry: strb #8 into oBattleObject_CurAction and strh 0 into oBattleObject_CurPhaseAndPhaseInitialized;
    tail pop {pc} with no return value: it is a void state-machine step'
  refs:
  - bn6f/asm/asm31.s:86360
  reproduce: python3 tools/asmcat.py 0x080DF3F0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
