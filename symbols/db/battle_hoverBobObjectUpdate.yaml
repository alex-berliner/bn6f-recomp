name: battle_hoverBobObjectUpdate
address: '0x08016B72'
kind: function
status: probable
summary: Per-frame update that, on first call (PhaseInitialized==0), clears flag 0x100000, dispatches
  AI handlers (3-entry table), resets collision state, nulls RelatedObject1Ptr, plays SFX 0x2D, and sets
  PhaseInitialized=4. Each frame it computes a Z offset from byte_8016BDC (a 32-entry -6..+6 sine-like
  table indexed by ((collisionCounter>>2)&0x1F)) added to oAIData_SavedZ16, and stores it into object
  Z16. If object flag bit 31 is clear it plays SFX 0x24, copies PendingStateAction into CurStateActionPhaseAndPhaseInitialized,
  clears PendingStateAction, and restores Z16 to SavedZ16.
interface: (r5 = battle object, reads oBattleObject_AIDataPtr) -> r0 = void; flags not meaningful
details: 'On the first invocation (PhaseInitialized == 0) it initializes the object: clears collision
  flag 0x100000, runs battle_dispatchActorAIHandlers (3-entry behavior table), resets collision state,
  nulls RelatedObject1Ptr, plays SFX 0x2D, and sets PhaseInitialized = 4. Every frame afterwards it reads
  the collision data counter at offset 0x2C, takes ((counter >> 2) & 0x1F) as an index into byte_8016BDC
  — a 32-entry symmetric wave of +6..-6 — and writes object Z = oAIData_SavedZ16 + wave, giving a smooth
  vertical bob around the object''s saved Z. It then checks object flag bit 31 via object_getFlag; if
  set it just returns (object inactive/removed). Otherwise it plays SFX 0x24 each frame, copies PendingStateAction
  into CurStateActionPhaseAndPhaseInitialized, clears PendingStateAction, and restores Z to SavedZ16.'
