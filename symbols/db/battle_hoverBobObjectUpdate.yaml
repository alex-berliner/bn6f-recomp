open_questions:
- which enemy/object uses this update (callers sub_8109F96 etc. are unnamed) and what SFX 0x24/0x2D are,
  to give it a more specific name
- exact meaning of object flag bit 31 and of the collision counter at collision data offset 0x2C that
  drives the bob phase
- The bob table byte_8016BDC ranges -6..+6 not 'a 32-entry symmetric wave', and the SFX IDs are 0x2C not
  0x2D (`mov r0,#0x2e; add r0,#0xff` = 0x12C... wait, 0x2e + 0xff = 0x12D low byte = 0x2D; the AddNote-side
  gives 0x25+#0xff=0x24, confirming SFX 0x2D and 0x24 are right). Flag test checks bit 31 (0x80000000),
  not 'object inactive'. The 32-entry claim is correct but the values are -6..+6 not ±6 step. Also `lsr
  r1,r1,#2` on the signed-halfword counter, so '(counter>>2)&0x1F' is approximately right.
