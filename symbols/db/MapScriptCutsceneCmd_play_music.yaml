name: MapScriptCutsceneCmd_play_music
address: '0x080380C8'
kind: function
status: confirmed
summary: Map script "play music" command — plays the song id in its halfword operand, or the current event's theme
  if the id is negative, and advances the script.
interface: void MapScriptCutsceneCmd_play_music(void); /* reads via script pointer r7; sets r7 += 3 and returns
  r0 = 1 (continue script) */
details: 'Script-interpreter opcode handler for the map/cutscene "play music" command. Reads a signed

  halfword operand from the script stream (ReadMapScriptSignedHalfword, result delivered in r4).

  If the operand is negative (bit 15 set interpreted as signed), it instead calls

  playCertainMapMusicBasedOnEventByte_8036e44 followed by PlayMapMusic to pick the track

  associated with the currently running event/cutscene byte. If the operand is non-negative,

  it calls PlayMusic(song: u8) with the operand as the song id directly. Always advances the

  script pointer in r7 by 3 (opcode + halfword operand), and returns 1 in r0 so the script

  interpreter continues executing. r6 is set to 1 before the read (flag/argument for the

  reader). Preserves r3, r5, r10 across the call per the contract.

  '
