name: ai_runAttackByTimer
address: '0x08103452'
kind: function
status: probable
summary: 'Drives a timed attack: on first call assigns element 4 and arms StepTimer from AttackDuration;
  each subsequent tick decrements StepTimer, and when it expires clears CurAnim and calls object_exitAttackState.'
interface: (r0 = scratch/element check, r5 = battle object ptr, r7 = oAIAttackVars) -> r0 clobbered; updates
  AttackElement, StepTimer, object CurAnim
details: If oAIAttackVars_AttackElement is zero, it writes 4 into it and copies oAIAttackVars_AttackDuration
  into oAIAttackVars_StepTimer, arming the attack for its full duration. On subsequent calls it decrements
  StepTimer each frame until it reaches zero. When the timer expires it sets oBattleObject_CurAnim (r5)
  to 0 and calls object_exitAttackState to return the object to its normal state. Element value 4 is written
  directly rather than derived, suggesting a fixed placeholder element for this attack type. The double-use
  of r7 as the AI attack vars base and r5 as the object base implies the caller keeps these registers
  set up across the state-machine dispatch.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst r0,r0 / bne shows first-call init path writing #4 to AttackElement; ldrh AttackDuration
    -> strh StepTimer arms the countdown from the attack''s stored duration; sub r0,#1 / bgt loops the
    decrement each invocation; mov r0,#0; strb r0,[r5,#oBattleObject_CurAnim] resets animation on expiry;
    bl object_exitAttackState hands control back to the normal (non-attack) state'
  refs:
  - bn6f/asm/asm31.s:160032
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x08103452
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is accurate: on first call it writes 4 to AttackElement and arms StepTimer from AttackDuration;
    each subsequent tick decrements StepTimer; on expiry it clears CurAnim and calls object_exitAttackState.
    The name ''ai_tickElementAttack'' is misleading because the element 4 is hardcoded and not derived
    from this function—it is a placeholder, so the name shouldn''t emphasize ''Element''. A name like
    ''ai_runAttackByTimer'' better reflects that the function''s role is driving the timed attack lifecycle,
    with the element being incidental.; run wf investigate investigate-20261018-203615; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
