name: npc_tickDisappearTimer_81169D8
address: '0x081169D8'
kind: function
status: confirmed
summary: Counts an object's disappear timer down; when it expires, switches the object to state 4 with animation
  0x23 and resets its sprite (animation 1, no shadow).
interface: void sub_81169D8(Entity *r7 /* flag holder */, Obj *r5 /* object */); clobbers r0-r3, flags; preserves
  r4, r5
details: 'Per-frame step of an exit/vanish sequence for an object. If the signed 16-bit flag at r7+0x10 is nonzero,
  the routine returns immediately without touching r5 (some condition suppresses the sequence, e.g. the object is
  still active or paused). Otherwise it decrements the byte timer at r5+0xC; while it is still nonzero after the
  decrement nothing else happens. When the timer hits zero, the object is put into state 4 (r5+0x9 = 4) and its
  animation id is set to 0x23 (r5+0x0 = 0x23, presumably the vanish/exit animation), then sprite_setAnimation(1)
  is called and sprite_loadAnimationData / sprite_noShadow reload the sprite with animation 1 and no shadow. r7
  appears to be the entity/battle-object pointer (flag at +0x10) and r5 a per-object work struct holding state (+0x9),
  animation id (+0x0) and the countdown timer (+0xC). The early-exit paths leave stale values in r0/r1, which callers
  ignore.

  '
