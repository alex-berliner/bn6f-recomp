name: sub_803A8E2
address: '0x0803A8E2'
kind: function
status: confirmed
summary: Redraws the 2x2 background tile block for an object based on its current step animation.
interface: 'void sub_803A8E2(struct Object *r5, void *r10, uint32_t lr /* return */); flags out: NZ C V'
details: 'Advances the object''s step animation via objectStepTable_803A886(0x1F, 0x1D), then

  reads the resulting step index at obj+0x1F and uses it (shifted <<3) to index into a

  8-byte-per-entry pattern table that maps each step to a {u16 tileId[4], u32 pad}.

  The object''s flag byte at obj+2 selects between two mirror-variant tables (off_803A910

  vs off_803A960). The picked four tile ids (e.g. 0x42B0-0x42BF across byte_803A9AC/0xB4/

  0xBC/0xC4) are written as one 2x2 tile block into BG tile block 0 at local (j=1, i=4)

  through CopyBackgroundTiles(j=1, i=4, tileBlock32x32=0, tileIds, jSize=2, iSize=2).

  Clobbers r4/r5/r0-r3 for the CopyBackgroundTiles call but expects the caller to get r4-r7

  back unchanged (it manually restores them via the pop {r4-r7,pc}).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
