name: chatbox_initNewScreen_8049E28
address: '0x08049E28'
kind: function
status: confirmed
summary: 'Initialize the chatbox subsystem for a fresh screen: reset chatbox state, set LCD control 0x40,
  refresh render info, reset graphics and call screen-specific hooks, then write state=8/sub-state=0 to
  the chatbox object in R5.'
interface: void chatbox_initNewScreen_8049E28(struct chatbox_state *r5 /* state struct */);
details: "Called with R5 pointing to a small chatbox state struct (2 bytes: state + sub-state).\nSequence\
  \ of side-effects:\n  * chatbox_8040818()         — chatbox subsystem init/reset\n  * SetRenderInfoLCDControl(0x40)\
  \ — set LCD control register bits via render info (0x40 = BG layer enable bit)\n  * renderInfo_8001788(),\
  \ renderInfo_80017A0() — render info refresh helpers\n  * sub_80015FC(0x11) — task/message dispatch\
  \ with arg 0x11 (likely a \"screen setup\" command)\n  * resetAllGraphicsState_8005F40() — full graphics\
  \ reset\n  * sub_803BEC0() — screen/scene hook (unclear purpose)\n  * sub_804A14C() — screen/scene hook\
  \ (unclear purpose)\n  * state byte  = 8  (chatbox opening/animating-in phase)\n  * sub-state byte =\
  \ 0 (animation frame 0)\nThe value `0x40` is the LCD control bits being OR'd into render info; combined\
  \ with the\nresetAllGraphicsState call this is a full \"new screen\" entry point rather than just a\n\
  chatbox-only init.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
