name: aiAttack_windupTick_80EBD3C
address: '0x080EBD3C'
kind: function
status: confirmed
summary: Per-tick handler for an AI attack's wind-up phase; on first entry it detaches the linked object, plays
  animation 7, arms a 3-tick timer, then counts down and leaves the attack state when it expires.
interface: void aiAttack_windupTick_80EBD3C(BattleObject* obj /*r5*/, AIAttackVars* vars /*r7*/); sets NZCV from
  the timer countdown
details: "Called once per frame for an AI-controlled battle object's attack step.\nr7 points to the AI attack-vars\
  \ struct: byte +0x01 is the attack state,\nhalfword +0x10 is a countdown timer. On the first tick (state byte\
  \ 0) it\ndoes the attack setup:\n  - clears obj->RelatedObject1Ptr (oBattleObject_RelatedObject1Ptr, r5+...),\n\
  \    dropping whatever object the previous attack attached;\n  - clears field 0x68 of the object's AI data struct\
  \ (obj->AIDataPtr,\n    oAIData_Unk_68);\n  - runs object_setAnimation(aiData, 7) - animation 7 looks like the\n\
  \    wind-up/swing pose for this attack;\n  - stores timer = 3 and sets the state byte to 4 (\"attack in progress\"\
  ).\nOn every tick (including the first, since the code falls through) it loads\nthe timer into r0, subtracts 1\
  \ and stores it back; the flags come from that\nsubtraction. When the timer underflows below 0 it calls\nobject_exitAttackState()\
  \ to hand control back to the AI's normal state\nmachine. So the whole attack lasts 4 ticks total: 3 wind-up ticks\
  \ plus the\nentry tick. r5, r6, r7, r0-r3 are used freely per the contract; lr is the\nreturn address. r6 is listed\
  \ as an output but nothing in the body writes it,\nso it likely reflects values returned by the called helpers.\n"
