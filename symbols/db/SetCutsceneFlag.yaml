name: SetCutsceneFlag
address: '0x080385C0'
kind: function
status: confirmed
summary: Sets one bit in the current cutscene-state flag word, marking a cutscene event/step as done.
interface: u32 SetCutsceneFlag(u8 flagIndex in r0, CutsceneState* state in r5); returns updated flag word in r0,
  preserves r1; flags clobbered (nz c), carry is input
details: 'Builds the mask 1 << (r0 & 0xFF) and ORs it into the 32-bit flag word at CutsceneState + oCutsceneState_CutsceneFlags
  (r5 base), storing the result back. The updated word is left in r0 as a return value. r1 is saved/restored across
  the call since it is not an argument here. Quirk: because Thumb LSL-by-register treats shift counts >= 32 as 0,
  passing a flag index >= 32 (or anything whose low byte is >= 32) results in mask = 0 and the function is a harmless
  no-op that still returns the unchanged flags. Flag indices are therefore effectively 0-31, one bit per cutscene
  condition/step.

  '
