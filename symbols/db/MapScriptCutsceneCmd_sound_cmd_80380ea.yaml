open_questions:
- Exact semantics of param1 (r1) and param2 (r2) passed to sound_80006A2—channel vs. volume vs. pan not confirmed.
- What the 5-byte overhead that r7 is advanced by represents (likely the opcode byte plus padding/terminator consumed
