name: MapScriptCutsceneCmd_sound_cmd_80380ea
address: '0x080380EA'
kind: function
status: confirmed
summary: Map-script cutscene command handler that reads a 16-bit sound ID and two 8-bit parameters (channel, volume)
  from the script stream, plays the sound, and advances past the 5-byte command.
interface: u32 cutscenePlaySoundCmd(u32 *r7 /* script_ptr in, advanced ptr out */, u32 r12 /* channel/flag passthrough
  */); sets NZ from final mov r0,#1 (always N=0, Z=0). Preserves r5, r8, r9, r10, r12; clobbers r0, r1, r6, v, c,
  lr.
details: 'Reads three values from the map-script byte stream via ReadMapScriptHalfword/ReadMapScriptByte helpers
  (which use r6 as a read-size selector: 1=halfword, 3=byte, 4=byte, and r7 as the stream pointer, returning the
  fetched value in r4). The halfword is the sound ID passed as r0 to the sound driver (sound_80006A2); the first
  byte is param1 (r1, likely a channel or sub-ID) and the second byte is param2 (r2, likely volume or pan). r12
  is passed through to the sound driver unchanged. After the driver call, r7 is incremented by 5 to skip the command''s
  fixed overhead bytes, and r0=1 is loaded so the next-script-loop caller sees a non-terminating return. Flags N
  and Z are set from that final mov.'
