summary: Initializes a battle object's auxiliary entity and loads version-specific ExtraVars values.
interface: (r0 = battle object pointer, r5 = battle object pointer used implicitly) -> no return value;
  flags unspecified
details: Calls sub_810DCCE to lazily instantiate the type-4 auxiliary entity and cache its handle at ExtraVars+8.
  Reads the battle object's AI data pointer and version byte, then indexes the table at byte_810D964 using
  that version. Stores the selected first table byte at ExtraVars and the byte six positions later at
  ExtraVars+4. No callers are known, so the exact lifecycle role and broader initialization contract remain
  unclear.
