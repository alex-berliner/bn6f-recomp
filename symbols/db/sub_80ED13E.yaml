name: sub_80ED13E
address: '0x080ED13E'
kind: function
status: confirmed
summary: 'Battle AI: dispatches to the per-attack-type handler selected by an index byte in the AI''s attack-variables
  block.'
interface: "void sub_80ED13E(u32 r2, u32 r3, u32 r4, u32 r5, u32 r6,\n                 u32 ai_vars /* r7 */, u32\
  \ r8, u32 r9, u32 r10, u32 r11, u32 r12,\n                 u32 lr /* return */);\n// returns via [sp]; all caller-saved\
  \ regs/flags clobbered\n"
details: 'Reads the 8-bit attack-type index at oAIAttackVars_Unk_00 from the AI attack-variables

  object whose pointer callers pass in r7, scales it as a word index into the single-entry

  (one handler) jump table pointed to by off_80ED150, and tail-calls that handler

  (sub_80ED154) with the original register context preserved (r7 object pointer, plus

  r0=idx, r1=table entry, and r2..r6, r8..r12 forwarded unchanged). The "thumb_func_end" +

  "+1" form on the table entry indicates the target is invoked in Thumb mode. Because the

  table currently only has one entry it acts as a placeholder for the per-attack-type

  handler set; the handler lives outside this file and has no typed interface yet.

  '
