name: ReadNPCScriptHalfword
address: '0x0809F64C'
kind: function
status: confirmed
summary: Reads a little-endian 16-bit operand from an NPC script byte stream and returns it without advancing the
  caller's cursor.
interface: u16 ReadNPCScriptHalfword(const u8* script /* r0 */) -> r0 = halfword, r1 = low byte; carry = 0; N/Z
  set from r0
details: 'Loads the low byte from [r0] and the high byte from [r0+1], combines them as (hi << 8) | lo (little-endian),
  and returns the halfword in r0 with the low byte duplicated in r1. The pointer is not advanced; the caller owns
  the script cursor and must bump it by 2 itself. This is the standard operand fetch for NPC/event script opcodes
  (dialogue IDs, textbox parameters, script-var indices, etc.). Quirk: the LSL #8/ORR sequence leaves carry always
  clear (the shifted-out bit is bit 24 of the source, always 0), so the flag output is deterministic rather than
  meaningful data; N/Z reflect the returned value. Uses mov pc, lr to return, so it works from both ARM and Thumb
  callers via BLX-style interworking only if callers are Thumb (plain Thumb BL context).'
