summary: 'Per-frame update handler for the beast-out overworld GUI object: refreshes its ReqBBS GUI state, then
  updates its sprite.'
interface: (r0 = beast-out overworld GUI object ptr) -> r0 = sprite_update result; flags from sprite_update
details: This is an object update thunk invoked each frame for the beast-out overworld GUI set up by battleObject_initBeastOutOverworldGui_811C13C.
  It loads the eReqBBSGui pointer into r5 (likely dead or callee-visibility scratch) and tail-adjacently calls reqBBS_81406FC,
  which reads/writes eReqBBSGui — presumably refreshing the request-board-style GUI widget (text/layout) for this
  display. It then calls sprite_update on the same r0 object pointer to advance the sprite's animation from the
  sprite struct header + (byte 2 & 0xF0). Note it keeps r0 unmodified between the two calls, so reqBBS_81406FC must
  not clobber the object pointer needed by sprite_update — or it re-reads r0 after the bl. Only 12 instructions;
  a straightforward composite tick routine.
