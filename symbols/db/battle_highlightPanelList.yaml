name: battle_highlightPanelList
address: '0x08102EC0'
kind: function
status: probable
summary: When a battle-state condition bit is set, walks a null-terminated list of packed panel coordinates
  and highlights each panel.
interface: (r0 = pointer to byte list of packed panel coords, 0-terminated) -> void; corrupts r4 flags
details: 'First reads battle state field Unk_40 via battle_getStateUnk40_800A704 and tests bit 3 (lsr
  #3 into carry); if clear the whole routine does nothing. Otherwise it iterates bytes at r0 until a 0
  byte. Each byte is split: bits 0-2 (lsl 0x1d/lsr 0x1d) are passed as r0 and bits 4-7 (lsr #4) as r1
  to object_highlightPanel, which sets the panel data flag byte at offset 1 to 1, i.e. marks that panel
  highlighted. The 3-bit field suits an x coordinate (0-7) and the 4-bit field a y coordinate (0-5) of
  the 6x8 battle grid, though the exact argument meaning of highlightPanel is inferred from its single
  documented use. The list is presumably in the caller''s data or an object structure; the caller sub_8102428
  is itself undocumented.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_getStateUnk40_800A704 + lsr r0,#3 / bcc: whole loop gated on bit 3 of battle state
    Unk_40; ldrb r0,[r4]; tst/beq: walks a byte array terminated by 0; lsr r1,r0,#4 and lsl/lsr 0x1d:
    byte split into 4-bit and 3-bit fields passed as two args; bl object_highlightPanel: marks each addressed
    panel''s flag byte at offset 1, i.e. highlights it'
