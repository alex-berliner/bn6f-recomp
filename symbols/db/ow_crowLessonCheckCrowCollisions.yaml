name: ow_crowLessonCheckCrowCollisions
address: '0x08143248'
kind: function
status: probable
summary: 'Per-crow proximity check for the Cybercrow lesson: when an active crow''s position is within
  the collision threshold of another active crow (delta hypot < 6<<16), flag that crow into state 2 via
  sub_81432FA.'
interface: () -> void; for each active crow record whose position comes within 6.0 of another active crow,
  invokes sub_81432FA(crowIndex, 2) and moves on
details: Iterates the 8 crow records at byte_2000D20 (0x14 bytes each). Records with a nonzero state byte
  at +0 are treated as active; for each such crow it compares that record's X/Y at +8/+0xC against the
  X/Y of every following record with a nonzero state, calling calc_hypotFixed12 on the delta (20.12 fixed
  point). If the distance is less than 6<<16 (6.0 units), it calls sub_81432FA with the outer crow's index
  and value 2 — almost certainly a state transition, e.g. turning/retargeting — and skips the rest of
  that crow's inner loop. Inner comparisons only start at the outer index+1, so each pair is evaluated
  once. Per-record timers and Z (+2/+6/+0x10) are untouched here.
