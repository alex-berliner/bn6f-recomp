name: getBattleSideCounter
address: '0x0802D1BE'
kind: function
status: probable
summary: Returns the three-digit counter value for the selected battle side.
interface: (r0 = battle side index) -> r0 = counter value; flags unspecified
details: Resolves the selected index through a 0x20-byte table and reads the byte at offset 0x0F. The
  caller passes oBattleState_PlayerSide, then supplies the returned value to sprite_drawRightAligned3DigitNumber,
  establishing that it is the selected side's counter value. The same value is also passed to sub_801C3EE,
  which likely records it in the side-specific digit buffer.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 0x0801C38C loads oBattleState_PlayerSide from oToolkit_BattleStatePtr and calls the function.;
    0x0801C394 passes the return value to sprite_drawRightAligned3DigitNumber.; 0x0801C39C passes the
    same return value to sub_801C3EE with side index 1.; The implementation resolves a 0x20-byte table
    entry and returns its byte at offset 0x0F.
