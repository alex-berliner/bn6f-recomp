name: flags_clearWordSlicesTaskStep_801CED2
address: '0x0801CED2'
kind: function
status: confirmed
summary: One step of a multi-frame task that gradually clears a slice of an event flag word, finishing the task
  once all slices are done.
interface: void sub_801CED2(taskState in r5); clobbers r0-r3 and flags; r4-r7 preserved; returns with r0 = step
  counter (or 0xC when finished) and NZ/C/V from the cmp r0,#5 / final strb
details: 'Operates on a task state struct pointed to by r5 with fields +0 (task state byte), +6 (flag word index
  being cleared) and +7 (slice step counter). Each call clears a 0x20-bit-wide slice of that flag word via sub_802FE7A,
  with the slice''s start bit computed as 0x40 + step*0x20 and the "value" argument 0 (i.e. writing zeros) and width
  0x40 passed as r1. It then re-reads the counter at +7; once it reaches 5 the whole word region has been processed,
  so it calls flags_clearFlagWordBit_802FE6A to clear the task''s own trigger bit in that same flag word and stores
  0xC into state[0] to mark the task finished. While steps remain, the task keeps running (state[0] untouched) and
  subsequent frames clear further slices. The 0x40 start offset and 0x20-per-step stride suggest it only clears
  the upper portion of the flag word, leaving bits 0x00-0x3F intact. Quirk: the finished path leaves NZ flags set
  from r0=0xC, and r0-r3/flags on the "still working" path are whatever sub_802FE7A and the compare left behind
  — callers apparently rely on that contract.

  '
