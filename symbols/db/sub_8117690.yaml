name: sub_8117690
address: '0x08117690'
kind: function
status: confirmed
summary: Dispatches to one of three THUMB handlers based on a battle-context byte at offset 8.
interface: u32 sub_8117690(u32 r5_battleCtx, u32 r10_in, u32 lr); // reads ctx[8]; clobbers r0,r1,r2,r3,r4,r6,r7,r8,r9,r12,lr;
  preserves nothing
details: 'Thin jump-table dispatcher. Loads the table base (off_81176A4 -> table of three THUMB

  function pointers with low bit set), indexes it with byte at [r5 + 8] (a state byte

  of the per-frame / per-entity battle context structure held in r5), then performs

  `bx r0` to enter the chosen handler. The wrapper pushes {lr} and pops {pc} so the

  callee sees a normal guest return frame and the caller resumes on its saved lr.

  The three targets (sub_81176B0, sub_81176C0, sub_81176C8) are sequential in the

  same file, suggesting closely related phases of a battle state machine. r10 is

  an additional preserved-by-caller input register.

  '
