open_questions:
- The exact semantic of the returned `r1` is unclear - it is 0xC..0x12 (i.e. always non-zero when matched).
  Whether r1 is consumed by callers or only r0 is consumed remains to be confirmed; the contract marks
  r1 in `out` so something reads it.
- The two chip flag bits (0x1 and 0x2 at chip byte 9) - their gameplay meaning (likely MB / BG / etc.)
  needs cross-checking against the chip database.
- Whether the "team index" through `battle_getObjectAllianceTeam_800F49E` is the alliance (0=friendly,1=enemy)
  or a deeper per-Navi team ID, and how many teams the 8021300 table actually covers, is not visible here.
  Looking at a wider window of `byte_8021300` and the caller `sub_800EF34` would settle it.
