kind: function
status: confirmed
summary: Dispatches per-slot update to the 5 battle-object slots attached to the caller's object array.
interface: void sub_80C8368(void *r5 /* base of object table; objects live at +0x60, +0x64, +0x68, +0x6C,
  +0x70 */);
details: 'Loops slot = 0..4. For each slot, loads a 32-bit pointer from r5 + 0x60 + slot*4. If the pointer
  is

  non-NULL, calls sub_80E1B3C with that pointer as the single argument in r0. r4 (used as loop counter)

  is preserved across the loop body by the surrounding push/pop; the called sub_80E1B3C must therefore

  preserve r4 as well. r5 is implicitly preserved by the calling convention.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
