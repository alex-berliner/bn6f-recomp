name: getTimeTierFromSum
address: '0x0800B734'
kind: function
status: probable
summary: 'Sums 12 halfwords from word_2000FA0 and returns a tier: 0 if sum > 10800, 1 if sum > 7200, else
  2.'
interface: () -> r0 = 0 if sum > 10800, 1 if sum > 7200, else 2; flags clobbered
details: Loads word_2000FA0 and adds its 12 halfword entries (ldrh loop, r1 counting 1..12) into r3, then
  compares the sum against 0x2A30 (10800) and 0x1C20 (7200) seconds — i.e. 3 and 2 hours — returning 0,
  1, or 2 for the bracket the sum falls into. The two callers are MapScriptCmd handlers, so the return
  value is presumably stored into a script variable used as a branch condition. The 12-entry halfword
  array and the exact hour thresholds strongly suggest accumulated play time (possibly split across 12
  segments), with tier 0 meaning the most time played.
