  date: '2026-10-19'
  detail: 'bne loc_810358C after tst r0,r0: init branch only runs when AttackElement==0, storing #4 and
    copying AttackDuration into StepTimer; sub r0,#1 / strh on oAIAttackVars_StepTimer with bgt: counts
    the wait timer down across frames; mov r0,#0; strb [r5,#oBattleObject_CurAnim]: resets object animation
    on timer expiry; bl object_exitAttackState: known callee ends the attack state after the timer runs
