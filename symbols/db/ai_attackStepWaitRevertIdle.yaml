name: ai_attackStepWaitRevertIdle
address: '0x0810357A'
kind: function
status: probable
summary: 'Enemy-AI attack state step: on first run stamps attack element 4 and starts the step timer from
  AttackDuration; while it ticks, on expiry resets animation and exits the attack state.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> void; flags from tst/sub
details: Reads oAIAttackVars_AttackElement at [r7]. If it is zero, writes 4 into AttackElement and copies
  oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, initializing a one-shot wait. Otherwise decrements
  StepTimer each call; once it hits zero it writes 0 to [r5,#oBattleObject_CurAnim] (back to idle animation)
  and calls object_exitAttackState to leave the attack state. This looks like the 'wind-up/hesitation
  then revert' phase of an AI attack, with element 4 presumably denoting a generic/unassigned attack kind.
