name: sub_8129758
address: '0x08129758'
kind: function
status: hypothesis
summary: 'Dispatches on an entity''s 0x1D byte: consults sub_812B318 for an action and an optional follow-up, and
  on action 3 transitions the entity into state 0x14 then triggers sub_811A610(0, 0).'
interface: void sub_8129758(void *entity /* r5 */);
details: 'Reads a byte at entity+0x1D and passes it to sub_812B318. sub_812B318 returns

  a chosen action in r2 (saved into r4) and a follow-up flag in r1; if r1 is non-zero,

  sub_812B218 is invoked next.

  If the returned action equals 3, the entity''s state byte at offset 0x3 is set to 0x14

  (via a strb of 0x14) and sub_811A610 is called with (0, 0). The function then returns

  to the caller (pops PC). r5 (entity pointer) and r6 are preserved across the call.

  No other entity fields are read or written. The 0x14 state transition combined with the

  sub_811A610(0,0) call suggests this is an entity-step/think entry that may switch an

  actor into a "done/despawn" or scripted-event phase, but the exact role is not confirmed.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
