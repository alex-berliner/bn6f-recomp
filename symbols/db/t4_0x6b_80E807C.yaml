name: t4_0x6b_80E807C
address: '0x080E807C'
kind: function
status: confirmed
summary: Dispatches a battle object to its per-state handler (init/update/free) selected from a jump table by the
  object's current-state byte, as a tail call.
interface: void battle_objectDispatchState(battleObject *object /* r5 */); handler outputs (r5, r8-r12) pass through
  to caller
details: 'Entry point for the "type 4, state 0x6b" battle object. r5 holds the object pointer. Reads the object''s
  state byte at oBattleObject_CurState, uses it directly as a word offset into the jump table at off_80E8090 (three
  entries, no scaling since ldr r1,[r1,r0] uses the raw byte as the offset), and invokes the handler with the state
  byte in r0 while the object pointer stays in r5. States: 0 -> battle_initSpriteObj (spawn the object''s sprite),
  1 -> battle_updateAttachedSprite (per-frame sprite update), 2 -> object_freeMemory (release the object''s memory).
  The call is a classic ARM/Thumb trampoline: push {lr}, mov lr, pc / bx r1, so the handler''s own pop {pc} returns
  straight to this function''s caller; the handler''s results in r5 and r8-r12 therefore flow through as this function''s
  outputs (this routine itself only touches r0, r1 and lr). This is the "0x6b" update entry invoked from the battle
  object task table, giving this object class a simple init/step/despawn lifecycle.

  '
