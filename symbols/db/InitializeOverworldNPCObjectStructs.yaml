summary: Initializes all overworld NPC object structs by delegating to the generic struct initializer with object
  type 2 (NPC).
interface: void InitializeOverworldNPCObjectStructs(void) /* preserves r4, r7; r0-r3 and flags are scratch passed
  through to the callee */
details: 'A trivial one-line wrapper: loads the constant OVERWORLD_NPC_OBJECT (object type 2) into r0 and tail-logic
  calls InitializeStructsOfObjectType, which presumably iterates the overworld object struct array and resets/initializes
  each struct whose type field matches. This function itself touches no memory directly; all work is done in the
  callee. r4 and r7 are preserved across the call (callee contract), while r0-r3, lr, and the NZCV flags are clobbered.
  Being an init routine, it is most likely called once per area load (or on map setup) to make all overworld NPC
  objects ready for use.

  '
