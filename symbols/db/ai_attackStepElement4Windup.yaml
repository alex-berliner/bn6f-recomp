name: ai_attackStepElement4Windup
address: '0x080F1390'
kind: function
status: probable
summary: 'Per-frame tick of an AI attack state: on entry sets attack element 4 and a 30-frame timer, then
  when the timer expires resets the object animation and exits the attack state.'
interface: (r5 = battle object, r7 = oAIAttackVars; r0/r1 unused) -> r0 clobbered; no return value
details: Reads oAIAttackVars_AttackElement from r7; if zero, stores element 4 into AttackElement and 0x1E
  into oAIAttackVars_StepTimer (halfword) and returns. Otherwise decrements StepTimer each frame and keeps
  returning while it is still positive. When it reaches zero, stores 0 into oBattleObject_CurAnim (byte
  at r5) to restore the idle/neutral animation and tail-calls object_exitAttackState to clear the attack
  state. The two-phase structure (setup pass vs countdown pass) keyed off AttackElement==0 suggests this
  is a windup/charge step shared by attack routines with element 4.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst → element==0 arms the attack (element 4, StepTimer=0x1E);
    loc_80F13A2: decrement StepTimer, bgt keeps the state alive; expiry path: mov r0,#0; strb r0,[r5,#oBattleObject_CurAnim]
    resets the animation; tail call bl object_exitAttackState ends the attack state; no stack use and
    r5/r7 only — typical caller-supplied object/AI-context tick invoked from an AI attack dispatch table'
  refs:
  - bn6f/asm/asm31.s:125009
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F1390
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109; the run''s proposed name ai_attackTick was contested;
    tools/investigate_land.py dedupe gave this distinct name (hyper/glm-5.3-flash proposed, minimax/MiniMax-M3
    agreed)'
open_questions:
