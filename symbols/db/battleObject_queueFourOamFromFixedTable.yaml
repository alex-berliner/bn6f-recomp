name: battleObject_queueFourOamFromFixedTable
address: '0x0802B0EC'
kind: function
status: probable
summary: Queues a fixed set of four OAM sprite entries for an object, advancing its animation frame counter
  at object+0xF.
interface: (r0-r3 = don't care, r5 = object struct; frame index at [r5,#0xF]) -> r0 = next frame index
  stored to [r5,#0xF]; no meaningful flags
details: The function iterates four 16-byte entries in a hardcoded table at dword_802B11C (words 0x56,
  0x79, ...). For each entry it builds r0 = (word0 << 16) | word1 (packed OAM tile/attribute pair), passes
  r1 = 0x10002, r2 = current frame index read from [r5,#0xF], r3 = pointer to table byte_802A848, and
  r4 = the entry's third word (+8), then calls battleObject_queueOamFromTableRow_811FAF4, which queues
  one OAM entry and returns the next row index. The returned index is written back to [r5,#0xF], so r5
  is the owning object and +0xF is its animation/frame cursor into the byte_802A848 row table. Because
  the table address and count are hardcoded, this draws a specific 4-sprite composition (likely an object's
  full body from four parts).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loop runs exactly 4 times (mov r7,#4 / sub r7,#1 / bgt) over a table of 16-byte entries at dword_802B11C;
    r0 = (word0<<16)|word1 and r4 = word+8 are per-entry sprite parameters, matching the callee's OAM
    lookup contract; callee battleObject_queueOamFromTableRow_811FAF4 is documented as queueing one OAM
    entry from a u16 table (r3) by row index (r2); r2 is loaded from [r5,#0xF] and the callee's return
    value is stored back to [r5,#0xF], showing a persistent frame/row cursor on the object; hardcoded
    args r1=0x10002 and r3=byte_802A848 make this a specialized fixed-composition variant of the generic
    callee
