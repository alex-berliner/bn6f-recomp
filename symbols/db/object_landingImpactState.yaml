name: object_landingImpactState
address: '0x080D5994'
kind: function
status: probable
summary: Per-frame update for a battle object that plays a brief animation, then shakes the camera, plays
  a sound, and cracks the panel it lands on before destroying itself.
interface: (r5 = battle object, no register args) -> void; when the timer runs out, writes CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized
details: On first run (PhaseInitialized==0) it sets PhaseInitialized=4, selects animation 0x1A, and loads
  oBattleObject_Timer with 0x1E. Each later frame decrements the timer; when it reaches 0x19 (5 frames
  in, the 'landing' moment) it calls sub_80D5A9C, then only if object_isCurrentPanelSolid succeeds it
  triggers camera shake (magnitude 2, duration 0x14), plays sound effect 0xC0, and cracks the panel at
  the object's PanelX/PanelY. Once the timer reaches 0 the object is transitioned to CUR_STATE_DESTROY,
  making this a one-shot crash-and-vanish behavior for something that falls onto a panel.
