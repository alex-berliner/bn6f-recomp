- method: assembly-reading
  date: '2026-10-18'
  detail: init branch stores anim 0x1A and 0x1E-frame timer, typical one-shot object setup; impact branch
    calls camera_initShakeEffect_80302a8(2, 0x14) and PlaySoundEffect(0xC0) — landing impact feedback;
    object_crackPanel called with oBattleObject_PanelX/PanelY only when object_isCurrentPanelSolid says
    the panel is crackable; timer reaching 0 writes CUR_STATE_DESTROY, so the object exists only for this
    30-frame sequence; callees list (shake, sound, crackPanel, isCurrentPanelSolid) matches a falling-object
    landing handler
