name: object_updateSpriteTimestop
address: '0x0801BBF4'
kind: function
status: confirmed
summary: Advances one battle object's sprite animation unless the battle is paused, the object has no sprite, or
  a time stop has frozen its animation.
interface: void object_updateSpriteTimestop(battle_object *obj /* r5 */, void *unused /* r4 */, void *unused2 /*
  r10 */)
details: "Called per battle object with r5 = object header and r4/r10 unused but preserved\n(callers' contract lists\
  \ them as inputs; the function pushes only lr, so r4-r11 must\nalready be live from the caller loop). Behaviour:\n\
  \n* Calls battle_isPaused(); if the battle is paused, returns without touching anything\n  so all sprites hold\
  \ still.\n* Reads oObjectHeader_Flags (offset 0) from the object header:\n  - bit 0 clear: object has no sprite\
  \ (invisible/none) -> return early.\n  - bit 3 set: animation is frozen by a time stop (e.g. TimeStop/FullSynchro-style\n\
  \    effects) -> return early, sprite holds its current frame.\n* Compares oBattleObject_CurAnim with oBattleObject_CurAnimCopy\
  \ (the animation id the\n  sprite was last set up with). If they differ, calls sprite_setAnimation(newAnimId)\n\
  \  and sprite_loadAnimationData() to reapply the changed animation, then writes the new\n  id back to oBattleObject_CurAnimCopy.\n\
  * Always (when not skipped above) calls sprite_update() to advance the current frame.\n\nStructures: battle object\
  \ header at r5 with oObjectHeader_Flags (bit 0 = has sprite,\nbit 3 = time-stop-frozen) and oBattleObject_CurAnim\
  \ / oBattleObject_CurAnimCopy (current\nanimation id and last-applied copy).\nQuirk: the early-return path for\
  \ bit 0 executes SET_FLAGS_NZ on the masked value, so NZ\nflags leak out of this function (the contract marks\
  \ nz as an output); callers in the\nobject loop appear not to rely on them.\n"
