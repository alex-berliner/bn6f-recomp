name: chatbox_runScript_803FD78
address: '0x0803FD78'
kind: function
status: confirmed
summary: Runs a chatbox text script and seeds the chatbox's next-script jump block (Unk_68) with a fixed four-halfword
  descriptor
interface: void chatbox_runScript_803FD78(TextScriptArchive *archive, u8 script_idx)
details: "Thin wrapper that does two things in sequence:\n  1) Forwards the caller's (R0=archive, R1=script_idx)\
  \ straight to chatbox_runScript\n     to execute the selected text script entry.\n  2) Copies a 4-halfword (8-byte)\
  \ block from the in-code constant byte_803FD94\n     (the halfwords 0x7E, 0x83, 0x7F, 0x81) into\n     R10->oToolkit_ChatboxPtr->oChatbox_Unk_68\
  \ via CopyHalfwords(src=&byte_803FD94, dst=&chatbox->Unk_68, count=8).\nThe seeded block at Unk_68 acts as the\
  \ next-script jump descriptor so the chatbox\ninterpreter's following ticks continue into the queued command.\n\
  Register contract: in r0 (archive), r1 (script_idx), r10 (toolkit/chatbox), lr; clobbers r0,r1,r2,r3,r5,\nNZCV;\
  \ preserves r4-r7; returns via pop {r4,r5,pc}.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
