name: battleObject_runSnakeArmAttackPart_80EF550
address: '0x080EF550'
kind: function
previous_names:
- sub_80EF550
status: probable
summary: 'Drives the multi-frame SnakeArm wind-up/swing animation: plays SFX per segment, sets an UnkBit_22
  flag the first frame, and spawns the appropriate hit-effect + collision-region objects on the target
  panel each swing.'
interface: (inherits working object r5, AttackVars r7, toolkit r10) -> void ; plays SFX, mutates AttackVars,
  spawns 1-2 child objects, sets working object flag/anim.
details: '- Entry: r5 = current working battle object (the attacker whose AI is running this script),
  r7 = its AIAttackVars, r10 = toolkit. The function reads AttackVars_Unk_01 (`oAIAttackVars+0x01`).

  - If Unk_01 is 0 (initial call): sets OBJECT_FLAGS_UNK_BIT_22_BIT (0x00400000) on the battle object
  via object_setFlag1, stamps Unk_01 = 1, primes the Unk_10 frame counter to 3, asks object_setAnimation
  to start anim 0x0C; if r5->RelatedObject2Ptr (`oBattleObject+0x50`) is non-NULL, also writes 0x0C into
  *that object''s CurAnimAndCurAnimCopy (`oBattleObject+0x10`) so the linked partner mirrors the swing.

  - After that one-shot block (or always on subsequent calls), decrements the 16-bit Unk_10 counter; if
  it has not yet hit zero we bail out via `locret_80EF5E8`.

  - When Unk_10 reaches 0 (one frame past the wind-up): rewrites Unk_10 = 3, calls object_setDefaultCounterTime,
  writes 4 into AttackVars_Unk_00, picks SFX id 0x1C5 (or 0x1C6 when Unk_12==2) from `dword_80EF960/dword_80EF964`,
  and plays it via PlaySoundEffect.

  - Damage/event payload uses AttackVars_Unk_12: a `byte_80EF606` lookup supplies a Y/X aligned halfword
  per `2 - Unk_12`, ORed with the alliance side (`oBattleObject_Alliance<<8`) from `byte_80EF606` rows
  `{0x3A, 0x39}`. Then it gets the front-direction offset (`object_getFrontDirection`), the panel coords
  from the attacker''s PanelX/PanelY, converts to 16.16 with `object_getCoordinatesForPanels`, and spawns
  a t1 effect object (`spawn_t1_0x0_EffectObject`) at offset (0, 0x100000), which is the visual "lance/snake"
  beam 1 panel forward of the user.

  - Then it loads r6 with `oAIAttackVars_Damage` (AttackVars+0x08), indexes into `byte_80EF604` and `byte_80EF5FC`
  tables (`{0x1, 0x3}` / `{0x2,0xff,0x5,0x4,0x4,0xff,0x5,0x4}`) to get hit-region args, recomputes the
  same front-direction + PanelX+Y target panel (with r2/r3 = 0), and calls `object_spawnCollisionRegion`
  so the hit region lands on the targeted panel while the visual effect is in flight.

  - Pop {r4,r6,r7,pc}: pure tail-call style, no return value beyond callee-saved r4/r6/r7 restored; nothing
  in r0..r3 is contractually live for callers.

  - The whole routine is a per-frame AI tick (called from CUR_STATE_UPDATE), hence the frame counter at
  `oAIAttackVars_Unk_10` and the flag/anim one-shots.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl object_setFlag1` with `mov r0, #1; lsl r0, r0, #OBJECT_FLAGS_UNK_BIT_22_BIT` matches
    enum `OBJECT_FLAGS_UNK_BIT_22_BIT = 22`, so the bit set is 0x00400000 in `CollisionData.ObjectFlags1`.
    - First-frame branch is guarded by `ldrb r0, [r7,#oAIAttackVars_Unk_01]; cmp r0,#0; bne loc_80EF578`,
    after which the byte is set to 1, confirming it is a "first tick" latch. - `bl object_setAnimation`
    with r0=0x0C and the matching `strh r0, [r1,#oBattleObject_CurAnimAndCurAnimCopy]` for the partner
    object show the swing pose is anim 0x0C. - `dword_80EF960 = 0x1c5` / `dword_80EF964 = 0x1c6` selected
    via `ldrb r1,[r7,#oAIAttackVars_Unk_12]; cmp r1,#2` give the per-segment SFX variants. - `mov r3,#0x10;
    lsl r3,r3,#0x10` then `bl spawn_t1_0x0_EffectObject` places the visual one panel (0x10 = 1 row in
    16.16) in front of the attacker. - `bl object_spawnCollisionRegion` with r2=r3=0, panelX computed
    as `front_dir + PanelX`, panelY from `PanelY`, and the `byte_80EF604`/`byte_80EF5FC` tables providing
    the element/region-style parameters, lays the hit region on the same panel. - `bl object_setDefaultCounterTime`
    and the `strh r0, #4` into AttackVars_Unk_00 set the per-frame hit-rate/counter pacing for the multi-swing.
    - Function pushes only `{r4,r6,r7,lr}` and pops into pc, so it returns void per the contract.'
  refs:
  - bn6f/asm/asm31.s
  reproduce: 'python3 tools/asmcat.py 0x080EF550

    '
  result: the body read as described above
  note: 'Proposed name (pending rename): battleObject_runSnakeArmAttackPart_80EF550

    '
open_questions:
- The exact semantics of `oAIAttackVars_Unk_10` (is it an "anim phase timer" or a "frames per swing"?
  It is reset to 3 after firing, so it paces a 3-frame cadence).
- What `byte_80EF606`/`byte_80EF604`/`byte_80EF5FC` actually encode — their values look like packed (animation+region)
  pairs but only the chip/move data tables would confirm.
- The two table rows selected by `2 - Unk_12` plus the alliance-based OR suggest this handles two attack
  orientations; whether Unk_12 encodes length/stage or target side is not visible from this routine alone.
