name: ClearCustGauge
address: '0x0801DF92'
kind: function
status: confirmed
summary: Resets the in-battle custom gauge, zeroing its progress counter and clearing its gauge-related flag bits.
interface: void ClearCustGauge(in u32 r10 /* unused by body, passed through context */, out u32 r1, out u32 r2 /*
  results from battle_clearFlags */)
details: 'Stores 0 into the halfword at eStruct2035280+0x20 (absolute address word_20352A0), which is the custom
  gauge''s fill/progress counter, instantly emptying the gauge. It then calls battle_clearFlags with r0=0x12, a
  bitmask (0x12 = bits 1 and 4) selecting the gauge-related state flags to clear; the counter reset alone would
  not be enough because some gauge behavior is gated on those flag bits. The caller''s r1/r2 (and NZ flags) come
  back from battle_clearFlags; lr is used for the call and the routine tail-returns via pop {pc}. r10 is listed
  as an input in the contract but is not read by this body — it is likely part of the battle context the flag helper
  uses implicitly.

  '
