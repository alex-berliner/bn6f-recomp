name: battle_state_tick_8007CA0
address: '0x08007CA0'
kind: function
status: probable
summary: Per-frame tick for the battle game-state; routes battle-end cleanup, intro-frame counter, Navi
  emotion/mood/HP bookkeeping, and post-battle teardown.
interface: void sub_8007CA0(BattleState* r5, Toolkit* r10) -> void
details: 'Dispatches on the current battle state byte (via battle_getStateByteNibbles_800A832) and the

  global BattleEffects bitmask (GetBattleEffects). Effect ''0x400'' triggers the battle-end branch,

  which either tears down the visual (SetDummyBGScrollCallbacks, zeroFill_e20094C0,

  palette_clearEPalette20097a0_80023A8) and calls init_battle_display via loc_8007204

  (preserving BattleState+oBattleState_Unk_18 across the call), or selects one of three

  link/battle "modes" (1/2/3) via sub_800AF50 and setTwoStructs_800A840. State==1 in that

  branch also ticks a halfword counter at dword_2000B30 up to 0x11. State==5 checks effect 8

  and event flag EVENT_1733; if flag 1733 is set it clears the display, fetches

  BattleState+oBattleState_BattleSettings and calls loc_80071FE (used to restore the previous

  battle settings). Active states (not 5) snapshot player HP (battle_snapshotPlayerHP_800FAE0),

  and write Navi stats: effect 0x40 -> SetCurPETNaviStatsHword field 0x40 from

  BattleState+oBattleState_Unk_34 (defaulting to 1); effect 8 short-circuits the emotion/mood

  block; otherwise field 0xE is set from callPossiblyGetBattleEmotion_8015B54 (or 0x80 if

  effect 0x10000) and field 0x21 (mood) is computed as max(stats byte 0x21, 3) unless effect

  0x400000 is set. State==1 also calls battle_updateSlotBestRecords_802C9B8 and clears two

  halfword counters in the S2001C04 sub-struct (+0x12, +0x14). State==2 effects: 0x800000 ->

  SetCurNaviHPToFull, 0x1000 -> force mood=3, 0x40000 -> force emotion=0x80. Effect 0x10 also

  forces full HP. Always (post-state logic) runs eStruct200A008_redrawOnDirtyFlags_802CA82 and

  the cleanup tail: clears GameState_BattlePaused, zeroFill_e20097A0, SetRenderInfoLCDControl

  (0x40), battle_tickCustomScreenEffect_800A892, clear_flags32_20093A4(1), clear flag

  EVENT_1722_BEAST_LINK_GATE_RELATED, zeroes BattleState+oBattleState_Unk_0a, and finally

  SetPrimaryToolkitPointers. Self pointer lives in r5; r10 is the Toolkit; r4/r6/r7 cache the

  S2001c04 ptr, MainJumptableIndex ptr, and GameState ptr respectively, and are preserved across

  the body. Preserved regs: r4,r5,r6,r7.

  '
