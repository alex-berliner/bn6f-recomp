name: battle_markFilteredPanelFlags
address: '0x080E8CFA'
kind: function
status: probable
summary: Builds a boolean per-panel flag map (6x6 battle field) at struct+0x64 for all panels matching
  an alliance-dependent panel-param filter, returning whether any matched.
interface: (r5 = entity/struct base, fields via caller) -> r0 = 1 if at least one panel matched else 0;
  flags from cmp
details: Zeroes 0x28 flag entries at r5+0x64 via ZeroFillByHalfword, then uses byte_80E8D58 as the argument
  block for GetAllianceDependentPanelParamArgs2 (a filter descriptor whose variant tables byte_80E8D6C/byte_80E8D80
  exist nearby). object_getPanelsFiltered fills a 0x20-byte stack buffer with matching panel bytes; for
  each byte the index is computed as (high nibble)*6 + (low 3 bits), storing 1 at r5+0x64+index — one
  flag byte per panel of the 6-column battle field. Returns 1 only when the loop ran at least once; on
  empty result it returns 0 (fallthrough keeps r0=0 from the compare).
