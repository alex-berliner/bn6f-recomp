name: screenFadeWaitStep
address: '0x08027A90'
kind: function
status: probable
summary: Per-frame tick that counts 16 frames, then starts a screen fade and advances a cutscene state.
interface: () -> void; reads/writes state at [r5+0x40] (frame counter) and [r5+2] (next state)
details: Called once per frame for some scene/cutscene object in r5. It increments the 32-bit counter
  at [r5+0x40]; until it reaches 0x10 it does nothing else. On the 16th frame it clears the counter, calls
  SetScreenFade(4, 0x20) (fade mode 4, parameter 0x20, presumably a fade-out), and stores 8 into the halfword
  at [r5+2], which is very likely the object's state/mode field, moving the scene to its next step.
