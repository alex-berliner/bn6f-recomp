name: object_canMove
address: '0x0800E5E2'
kind: function
status: confirmed
summary: Returns whether the current object's flags allow it to move or act (1 = free, 0 = blocked).
interface: bool object_canMove(void); // reads object ptr from r4, returns r0 = 1/0, sets NZ flags, clobbers r1,
  preserves r4
details: 'Wrapper over object_getFlag: fetches the current object''s flag word (the object pointer is taken from
  r4 by object_getFlag itself), then tests it against the blocking mask 0x5040 (bits 6 and 14 plus the high halfword
  byte 0x50). If any of those "action forbidden" bits is set the function returns 0 in r0, otherwise 1. r4 is pushed/popped
  around the call so the object pointer survives; on return r1 still holds the mask 0x5040. The intermediate "mov
  r4, r0" is assembled as adds r4, r0, #0, so the C and V flags are cleared and the NZ flags at return reflect the
  boolean result. Typical gate before movement/action updates in the object loop.

  '
