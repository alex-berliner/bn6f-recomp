  date: '2026-10-19'
  detail: 'sub_80CCD42 body is only push {lr}; bl object_freeMemory; pop {pc} — no other work; callees
    list: object_freeMemory at 0x08003458 releases a battle object''s slot and unlinks it from the active-object
    list; r0 is untouched before the call, so the wrapper takes the same object-pointer argument as object_freeMemory'
  refs:
