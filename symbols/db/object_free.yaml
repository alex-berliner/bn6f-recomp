name: object_free
address: '0x080CCD42'
kind: function
status: probable
summary: Direct tail-call to object_freeMemory that just forwards r0; no setup, no post-processing.
interface: (r0 = battle object pointer) -> r0 = object_freeMemory return value; flags per callee
details: The entire function saves lr, branches to object_freeMemory, and returns with the same r0 passed
  through. object_freeMemory clears the object's flags, frees its type's bitmap slot, unlinks it from
  the active-object list, and resets sprite scaling, so this routine is simply the standard 'destroy/remove
  object' entry point. No argument setup or post-processing is done, so r0 (the object) is forwarded unchanged.
