name: chatbox_skipRows
address: '0x03006C72'
kind: function
status: probable
summary: Advances the caller's chatbox output pointer past a variable number of rows.
interface: (r0 = chatbox output pointer, r10+0x38 -> byte count of rows to skip) -> r0 = advanced pointer
  + 1; r4 cleared
details: Reads a row count from a pointer at r10+0x38, loops that many times calling chatbox_addOffsetToRow
  with r1=0 (no word shift), and finally increments r0 by 1 and returns with r4=0. The caller's r4 acts
  as the loop counter and r0 as the current row pointer that is advanced in-place. Used wherever the chatbox
  layout wants to leave vertical gaps.
