name: battle_objectTickTimerAndSetPhaseC_80174AA
address: '0x080174AA'
kind: function
status: confirmed
summary: Decrements a battle object's action timer each tick; when it expires, resets the timer to 0 and moves the
  object into phase 0xC.
interface: void battle_objectTickTimerAndSetPhaseC(BattleObject *obj /* r5 */); returns current timer value in r0,
  flags from the decrement
details: 'Tail-called worker for a battle object whose pointer is kept in r5 by the caller.

  Reads the 16-bit oBattleObject_Timer field, subtracts 1, and stores the result back.

  While the timer is still nonzero, nothing else happens. When the decrement yields 0

  (timer expired), the timer field is rewritten with 0 (redundant store, it is already 0)

  and oBattleObject_CurPhaseAndPhaseInitialized is set to 0xC, advancing the object''s

  state machine to phase 12 with the phase-initialized bit cleared by the same write.

  The final flags depend on the path taken: the non-expired path leaves the SUBS flags

  (nz set, c clear borrow for 0 result, v clear); the expired path''s last flag-setting

  op is the phase write, leaving nz from 0xC and c/v from the SUBS. r0 is 0 on the

  expired path, the remaining timer count otherwise.

  '
