name: ai_attackMoveStepUpdate
address: '0x081022E4'
kind: function
status: probable
summary: 'Per-frame AI attack movement: adds velocity to pixel coords, snaps to panels while StepTimer==ChargeCycles,
  ticks an effect when StepTimer matches ScratchVar*2/3 or ScratchVar/3 quotients, and on timer expiry
  commits FuturePanel to Panel, updates collision, clears 0x40, sets CURRENTLY_MOVING_1, reloads timer
  from AttackDuration, advances HitElement by 4.'
interface: (r5 = battle object, r7 = AIAttackVars) -> void; flags from comparisons/svc only
details: Each frame it adds the object's XVelocity/YVelocity to its X/Y pixel coordinates. While oAIAttackVars_StepTimer
  equals oAIAttackVars_ChargeCycles it snaps the object to panels (setPanelsFromCoordinates + updateCollisionPanels).
  It checks ScratchVar*2 and ScratchVar*2+1 (via svc 6 = DivRem by 3) against the step timer, and when
  matching calls sub_80BFD90(0) (likely a sound/effect tick). The step timer counts down; on hitting -1
  it commits FuturePanelX/Y into PanelX/Y, releases the panel reservation, recomputes pixel coords and
  collision panels, clears flag 0x40, sets the CURRENTLY_MOVING_1 flag, sets HasMoved, sets collision
  region 1, reloads the timer from oAIAttackVars_AttackDuration (the next attack phase length), and advances
  oAIAttackVars_HitElement by 4 to move to the next attack state.
