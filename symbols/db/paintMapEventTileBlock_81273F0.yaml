name: paintMapEventTileBlock_81273F0
address: '0x081273F0'
kind: function
status: confirmed
summary: If event flag "EVENT_163" is set, paints a 3x2 tile block (from byte_8126B10) at the calling map event
  object's position (column 9, row = object's +0x0D signed byte + 2) using tile block 3.
interface: void paintMapEventTileBlock_81273F0(const void *r5 /* map event object */);
details: 'Conditionally overlays a 3x2 block of BG tiles onto the map background when

  event flag "EVENT_163" is set. The destination column is hard-coded to 9;

  the destination row is the signed byte at offset 0x0D in the event object

  plus 2 (so the block starts two rows below the object''s anchor row).

  Tile block index 3 is used, with tile ids taken from byte_8126B10.

  No structures or fields beyond the single byte at +0x0D of the caller''s

  map event object (passed in r5 and forwarded to the callee in r7) are

  touched. Only the thinnest wrapper: a flag test, an immediate

  CopyBackgroundTiles call, and a return.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
