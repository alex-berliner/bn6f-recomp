name: paintMapEventTileBlock_81273F0
address: '0x081273F0'
kind: function
status: probable
summary: If event flag 0x163 is set, paints a 3x2 tile block into the BG at the column read from the map
  data's offset 0xD (shifted +2), using a row offset of 9.
interface: void paintMapEventTileBlock_81273F0(u32 map_data /* r5 */);
details: 'Guarded by event flag 0x163 (EVENT_163 / TestEventFlagFromImmediate); returns immediately if
  the flag is clear. When the flag is set, reads a signed byte from map_data+0xD (interpreted as a tile-column
  position) and adds 2 to it, then calls CopyBackgroundTiles with j = adjusted column, i = 9, which_tile_block_32x32
  = 3, tile_ids = byte_8126B10, j_size = 3, i_size = 2. Effectively copies a 3x2 block of tile IDs (3
  columns wide, 2 rows tall, row offset 9) into tile block 3 at a column derived from the map data''s
  per-row offset byte. r5 is the input map_data pointer and is preserved/clobbered per contract (saved
  into r7 for the call, restored on return). Behavior tied to a single event flag and a small constant
  tile-ID table in ROM (byte_8126B10).

  '
