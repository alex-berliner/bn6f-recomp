    0x00030000/0x00038000/0x00040000/0x00048000 = 3.0-4.5 in 16.16 fixed; mov r0,#9; r2=0x28<<16; mul;
    svc 6 implements (360<<16)/speed, so r1 is a travel-duration and r0 the signed speed; return sequence
    mov r1, r0; mov r0, r4 swaps quotient and product, returning speed in r0 and duration in r1'
