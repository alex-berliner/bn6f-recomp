name: ai_getDifficultySpeed
address: '0x080F710A'
kind: function
status: probable
summary: Computes a difficulty-scaled movement/attack speed (16.16 fixed-point) for an AI battle object,
  signed by facing side, and returns the matching 360-unit travel duration in r1.
interface: (r7 = battle object AI vars struct) -> r0 = frontDirection * speedByDifficulty (16.16 fixed,
  +3.0/+3.5/+4.0/+4.5), r1 = (360 << 16) / speed (frames to cross 360 units); flags from division
details: Calls object_getFrontDirection to get +1/-1 based on the object's alliance and DirectionFlip.
  Reads the AI difficulty tier from [r7, oAIAttackVars_AiDifficultyTier] and indexes a word table at 0x80F7130
  whose entries are 0x30000, 0x38000, 0x40000, 0x48000 — i.e. 3.0/3.5/4.0/4.5 in 16.16 fixed point, higher
  tier = faster. It computes 9 * (0x28 << 16) = 360 << 16 and uses SWI 6 (Div) to get r1 = (360 << 16)
  / speed, i.e. the time to traverse 360 units at that speed; the tier-1 (3.5) division truncates to 102.
  The function then swaps the results so r0 = frontDirection * speed (a signed per-frame velocity) and
  r1 = duration. The caller at 0x80F6EA6 presumably uses both to launch a timed attack whose projectile
  speed varies with difficulty tier.
