name: battle_initAllianceEntryDefaults
address: '0x0802E07C'
kind: function
status: probable
summary: Resets one 0x1D0-byte alliance-pool entry to its default state, zeroing status bytes and setting
  three word fields to -1.
interface: (r0 = entry index into unk_2036120 pool) -> r0 = entry pointer; no flags used
details: 'Fetches the entry pointer via the 0x1D0-stride helper, then writes defaults: byte+0x03 = 0,
  halfword+0x2A = 0, byte+0x50 = 0, and words +0x18, +0x1C, +0x20 = 0xFFFFFFFF (via mvn of 0, a typical
  ''invalid id/pointer'' sentinel). Finally byte+0x02 = 0xB4 (180, plausibly a frame timer or count default).
  It only writes fields, so it is an initializer/reset for a fresh or recycled entry in the shared alliance
  entry pool used by battle_setupAllianceEntryKind3_802DFC8.'
