name: sub_8127EF4
address: '0x08127EF4'
kind: function
status: confirmed
summary: Counts how many story event-flag pairs (both lo and hi set) also satisfy a bit-7 table condition matching
  bit-0 of the object's status byte at +0xD.
interface: u32 countMatchedStoryFlagGates(u16* event_flags, u8* object) -> count in r0
details: 'Iterates idx from 0x1CA0 to 0x1D1F (128 story event-flag indices).

  For each idx it calls TestEventFlag twice: on FLAG_LO_BASE+idx (0x1CA0+idx)

  and FLAG_HI_BASE+idx (0x1D20+idx). Both must be set (non-zero flag) to proceed.

  If both are set, reads byte_812851C + idx*4 and tests bit 7 (0x80), then

  compares against bit 0 of byte at [r5+0xD]. When the two bits are equal,

  the counter r4 is incremented.

  Returns the total count in r0.

  r10 is passed in by callers but never read inside the function.

  The function pushes/pops r4-r7 and lr, so those are fully preserved.

  '
