name: battle_advanceFade_802C328
address: '0x0802C328'
kind: function
status: confirmed
summary: 'Advances a battle state object''s screen-fade: kicks off the fade if not yet started, polls
  liveness, and parks the object in state 8 while the fade is still in progress.'
interface: "void Next(u32* battle_obj /* r5 */);\n  // kicks SetScreenFade(0xC, 0x10) on first entry (byte\
  \ @+3 == 0),\n  // then on every call reads IsScreenFadeActive(); while Z clear\n  // (still fading)\
  \ writes 8 to battle_obj[0] and yields 8, else\n  // yields whatever r0 the liveness check produced.\n"
details: "- Operates on a small battle-state struct held in r5: byte at offset 3 is a\n  \"fade-started\"\
  \ flag; word at offset 0 is the current state value.\n- First pass: byte @+3 == 0 -> call SetScreenFade(0xC,\
  \ 0x10) (duration +\n  mode/target mask), then stash 4 into byte @+3 so the kickoff only runs once.\n\
  - Every call: tail-calls IsScreenFadeActive and branches on its Z flag:\n    * Z clear -> fade still\
  \ in progress -> store 8 into the word at @+0 and\n      leave r0 = 8 (per the disassembly's `mov r0,#8\
  \ / str r0,[r5]` path).\n    * Z set   -> fade finished -> return IsScreenFadeActive's r0 unchanged\n\
  \      to the caller.\n- r5 is preserved across the function (it points at the caller-owned object),\n\
  \  and it is also the only input that survives into the epilogue; lr is saved\n  on entry for a tail-call\
  \ via `pop {pc}`.\n- SetScreenFade and IsScreenFadeActive are external (no in-file body), so\n  their\
  \ semantics (10=toward-black screen wipe, Z meaning \"fade complete\")\n  are inferred from the BN6\
  \ fade library rather than verified here.\n"
