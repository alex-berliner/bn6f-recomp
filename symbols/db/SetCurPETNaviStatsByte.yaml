name: SetCurPETNaviStatsByte
address: '0x0801379E'
kind: function
status: confirmed
summary: Writes one byte into the NaviStats record belonging to the navi currently selected in the PET.
interface: void SetCurPETNaviStatsByte(int statsSelector /*r0*/, int fieldOffset /*r1*/, u8 value /*r2*/); trashes
  r0, r3, flags(nzcv); preserves r1, r2
details: 'Resolves r0 through GetNaviStatsIndexGivenCurPETNavi, which converts a caller-supplied selector into the
  index of the NaviStats record for the navi currently active on the PET. The returned index is multiplied by oNaviStats_Size
  to get the record''s byte offset, then added to the toolkit''s NaviStats array base pointer (r10 -> oToolkit_NaviStatsPtr).
  The byte in r2 is stored at record + r1, so r1 is a plain byte offset within a single NaviStats struct rather
  than a field enum. r1 and r2 are explicitly preserved (the push/pop of {r1,r2} is only there to free them across
  the helper call), and r0 comes back as the record byte offset (index * oNaviStats_Size). Flags reflect the pointer
  add of statsBase + recordOffset, not the store.

  '
