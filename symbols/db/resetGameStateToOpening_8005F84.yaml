open_questions:
- Is r10 the toolkit pointer at every call site, or can it be a different struct at some callers (the
  contract only lists one caller)?
- What exactly is sub_809F68C (the readable C calls it generically "effect/chatbox state release"); does
  it actually belong to the chatbox, the effect subsystem, or both?
- What does chatbox_clear_eFlags2009F38 (named "clear 0x40 chatbox event-flag block" in the readable C)
  actually represent — a window-mask flag block, a script-event flag block, or something else? The flag
  0x40 matches the LCD-control value, which may be coincidental.
- Is "kind 0, phase 8" the genuine opening/title-screen game state, or a reset/loading state used by multiple
  call sites (e.g. soft reset, return to title, language select)?
- off_8005FB4 looks like a small jumptable of +1-thunks alternating between sub_8006366 and sub_800647C
  (with sub_80064BE and sub_80063C0 at two entries); is it actually associated with this function, or
  merely placed adjacent by the linker?
