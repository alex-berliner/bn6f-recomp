name: resetGameStateToOpening_8005F84
address: '0x08005F84'
kind: function
status: confirmed
summary: Tears down the current scene (LCD render defaults, effect/chatbox state, 0x40 chatbox flag block) and rewinds
  the main jumptable to step 4 with game state kind 0, phase 8, returning phase 8 in r1.
interface: void sub_8005F84(void /* r10 = toolkit, lr = return */); returns r1 = 8 (with r2/r3 and c/v left as chatbox_clear_eFlags2009F38
  leaves them); preserves r4-r7.
details: "Called with r10 holding the toolkit struct (an oToolkit*). Sequence:\n  1. SetRenderInfoLCDControl(0x40)\
  \ — restore the default LCD render-info control byte.\n  2. sub_809F68C — tear down/release whatever transient\
  \ effect state it owns.\n  3. chatbox_8040818 — release the chatbox subsystem state.\n  4. chatbox_clear_eFlags2009F38(0x40)\
  \ — clear the chatbox event-flag block tagged 0x40.\n  5. *oToolkit_MainJumptableIndexPtr (toolkit) = 4 — rewind\
  \ the main jumptable to step 4 (opening/title path).\n  7. *oToolkit_GameStatePtr (toolkit) = 0 — game state kind\
  \ reset to 0.\n  8. *(oToolkit_GameStatePtr + 0x16) (toolkit) = 8 — game state phase set to 8.\nThe byte 8 written\
  \ last is returned in r1 (consistent with the \"r1, not r0, carries the result\" convention this code uses). r2/r3\
  \ and c/v are whatever chatbox_clear_eFlags2009F38, the last callee, left in the flags; r4-r7 are preserved.\n"
