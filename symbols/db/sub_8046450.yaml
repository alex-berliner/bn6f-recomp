open_questions:
- Which state indices correspond to entity kinds whose handler slot is 0 (i.e. entries 0x00, and the 0x0 sentinels
  scattered through dword_8046464)? Calling one would fault via bx r1; are these indices never used, or is the higher
  layer expected to guard them?
- Some flagged handler entries like stateDispatcher_3states_8116E10 and battle_dispatchByClass_811C1AC look like
  inner dispatchers themselves; is byte 1 actually a packed "kind + state" field, where the top nibble is the kind
  and the bottom nibble routes within the kind?
- The `.byte 0x0` padding regions before sub_811C08C (47 bytes), sub_811DC34 (8 bytes), and inside the submenu run
  block look like null slots the game indexes into; their allowed index ranges need mapping to be safe to rename
  entry points near them.
