name: sub_8046450
address: '0x08046450'
kind: function
status: confirmed
summary: Dispatches an entity to its per-state handler by indexing a table at dword_8046464 with the entity's byte-1
  state field.
interface: "void entity_runStateHandler_8046450(void *entity /* r0 */);\n    input:  r0 = entity pointer\n    output:\
  \ r0, r3, r8, r10, r11, r12 from the dispatched handler\n    clobbered by dispatcher: r1, r2, r4, r5, r6, r9,\
  \ lr; flags N/Z reflect state<<2, C clear, V undefined\n    preserved: r3, r7 (pushed/popped across the bx dispatch)\n"
details: 'Loads the handler-table base dword_8046464 (via off_8046460), reads byte 1

  of the entity as the state index, shifts it left by 2, and fetches a

  function pointer from the table. Dispatches to it via `mov lr, pc; bx r1`

  (Thumb+1 entries are how bx expects Thumb code). The handler receives

  r0 = entity and r3 = state*4 (i.e. the table slot offset), with flags set

  by the lsl (N/Z of the shifted index, C always clear). After the handler

  returns, `pop {r3,r7,pc}` undoes the prologue `push {r3,r7,lr}`, so the

  caller''s r3 and r7 are preserved and lr is consumed.


  The giant table dword_8046464 is the global entity-kind-by-state dispatch

  table referenced throughout the game: it covers map/objects/NPCs/entities

  (e.g. npc_StateModeDispatcher_8119364, entity_RunStateHandler_8119E40,

  object_dispatchModeHandler_81178D8, objectStateDispatcher_8117D2C,

  submenu_runModeHandler_811BD64), the battle side

  (battle_runObjectStateHandler_811B1EC, battle_dispatchByClass_811C1AC),

  plus a number of zero entries used as sentinels. Because the handler

  address is read at runtime, the dispatch has to be a real call (mov

  lr,pc / bx); a normal BL would lose the dynamic target.

  '
