name: CutsceneCmd_call_native_with_return_value
address: '0x08038028'
kind: function
status: confirmed
summary: Map-script cutscene command dispatcher that reads the next script word and calls the native handler in
  r4, advancing or halting based on its return.
interface: 'void cutsceneCmd_callNativeWithRet_8038028(void);  // in: r2 r5 r7 r10 lr;  out: nz r1 r2 r4 r5 r7 r8
  r9 r10 r11 r12;  clobbers: c v r0 r3 r6 lr'
details: 'Sets r6 = 1 (flag consumed by ReadMapScriptWord), then calls ReadMapScriptWord to pull

  the next map-script word. The dispatcher''s earlier switch left the native command

  routine''s address in r4, which is invoked via a "mov lr, pc; bx r4" tail-call (a guest

  call into native ARM/Thumb code). The native returns a status in r0: 0 means the

  command finished normally, in which case the script cursor (r7) is advanced by 5

  bytes (the size of this 5-byte script command: opcode + 4-byte argument) and r0 is

  set to 1 to tell the caller to keep going; non-zero means the command requested the

  script halt, and r0 is set to 0. Exits by popping {pc} from the saved lr. Note that

  the read path uses bne .halt, so the "still running" branch is the zero-flag one

  (r0 == 0 returned -> falls through to advance).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
