name: ai_advanceTurnStateCounters
address: '0x08101C3A'
kind: function
status: probable
summary: Per-tick battle AI scheduler that advances an enemy's turn/attack/step counters with random skips and,
  on a new attack step, looks up action tables before tail-jumping into the shared AI continuation.
interface: (r5 = battle object, r6 = AI state block) -> r0 = result of tail-branch into sub_8101CC0; no meaningful
  return of its own, flags clobbered
details: 'The function ticks three counters in the AI state block: TurnCounter is incremented each call (with a
  ~50% RNG-gated double increment via lsr #6 carry); once it reaches 3 it is reset to 0, starting a new turn. AttackCounter
  then cycles 0..3 (again with an RNG-gated extra bump via lsr #4); when it exceeds 3 the attack cycle resets and
  control jumps into sub_8101CC0 without picking a new action. StepCounter cycles 0..2; when it wraps, the function
  calls sub_810222C twice with r0=0, r1=0, the battle object from oAIData_BattleObjectPtr, and two byte tables (byte_8101DBC,
  byte_8101DD0), branching into different sub_8101CC0 entries depending on which call returns nonzero — i.e. it
  consults AI action-decision tables when a new movement/attack step begins. Finally oAIState_Unk_0d is XOR-toggled
  each tick and selects between two continuation paths in sub_8101CC0, likely alternating behavior (e.g. side/direction
  of the next action).'
