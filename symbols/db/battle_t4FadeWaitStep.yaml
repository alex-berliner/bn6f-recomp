name: battle_t4FadeWaitStep
address: '0x0803A0D4'
kind: function
status: probable
summary: Advances the battle simulation while fading the screen for a T4 wait task.
interface: (r5 = T4 task pointer) -> r0 = t4_dispatchWaitStep result; flags preserved from t4_dispatchWaitStep
details: Waits for the T4 dispatcher while it reports busy; on a nonzero result, starts a 12-step fade
  over 16 units and stores 0x6C in the task's byte at offset 1. It then advances the battle frame regardless
  of whether the wait completed. The caller relationship is not present in the supplied data, but the
  T4 wait API, task byte write, fade call, and battle tick identify this as a battle-step wrapper.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Lines 2-3 call t4_dispatchWaitStep and branch when it returns zero.; Lines 4-6 call SetScreenFade(0xC,
    0x10) and then write 0x6C to [r5+1].; Line 8 always calls battle_stepFrame before returning.; The
    function is adjacent to battle_stepFrame at 0x0803A1B0, reinforcing its battle-loop role.
