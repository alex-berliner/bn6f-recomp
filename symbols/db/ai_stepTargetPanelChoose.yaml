name: ai_stepTargetPanelChoose
address: '0x0810CA4C'
kind: function
status: probable
summary: AI attack step that polls a panel-chooser callback and reserves the chosen panel.
interface: () -> void; r7 = AI attack vars struct
details: Runs each tick while the parent AI attack is in this step. Decrements the step timer (oAIAttackVars_StepTimer);
  when it expires, calls the function pointer stored at oAIAttackVars_PanelChooseCallback with a target
  object pointer (oAIAttackVars_TargetObjectPtr) as the argument. If the callback returns a non-zero panel
  coordinate, the function stores the X/Y in oAIAttackVars_TargetPanelX/TargetPanelY and reserves that
  panel via object_reservePanel. On success it advances to step 0xD and sets oAIAttackVars_HitElement
  = 8; on failure (or callback returning 0) it clears r5's current animation index (oBattleObject_CurAnim),
  sets the step timer back to 5 with oAIAttackVars_HitElement = 0x20, and falls through to clearing bit
  2 of r5's object header flags.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Field reads (ldrh StepTimer, ldr TargetObjectPtr, ldr PanelChooseCallback) identify the AI attack
    vars layout; When timer hits 0, callback pointer in r1 is invoked via `bx r1` with target object in
    r0; Returned (r0,r1) = (x,y) written to oAIAttackVars_TargetPanelX/Y when r0!=0; bl object_reservePanel
    is invoked only when a valid panel coordinate was returned; Both success and failure branches rewrite
    StepTimer (0xd / 0x5) and HitElement (8 / 0x20) to drive the next step; Tail clears bit 2 of oObjectHeader_Flags
    in r5, matching other AI step helpers' tail pattern
