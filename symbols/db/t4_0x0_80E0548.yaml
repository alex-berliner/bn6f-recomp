name: t4_0x0_80E0548
address: '0x080E0548'
kind: function
status: confirmed
summary: Battle-object per-state dispatcher that uses the object's current state byte to index a ROM jump table
  and tail-call the matching handler (init/draw at state 0, the heavy handler at state 4, or free memory at state
  8).
interface: "void dispatchBattleObjectState_80E0548(struct BattleObject *battle_obj /* r5 */);\n  /* in:  r5 = battle\
  \ object pointer (state byte read from r5+oBattleObject_CurState) */\n  /* out: r5 preserved (battle_obj); r0..r4/r6/r7\
  \ clobbered by tail-called handler */\n  /* clobbers: N Z C V (tail-called handler), r0 r1 r2 r3 r4 r6 r7 lr */\n"
details: 'Function reads a single byte state at offset oBattleObject_CurState on the

  passed-in BattleObject (r5), multiplies by 4 implicitly via the word-sized

  table, and loads the target address from ROM table off_80E055C (three

  entries: sub_80E0568, sub_80E05C4, object_freeMemory). It then performs

  a "mov lr,pc / bx r1" thumb-tail-call so the chosen handler runs with

  `pop {pc}` of this function as its return; effectively the dispatcher''s

  own `pop {pc}` becomes the return-to-caller for the handler, so the

  caller''s preserved register contract (r5, r8..r12 out) is what this

  dispatcher also produces. Pure dispatcher, no other memory access;

  no inputs beyond oBattleObject_CurState; defensively(?) the

  read-C is "r5 = battle_obj".

  '
