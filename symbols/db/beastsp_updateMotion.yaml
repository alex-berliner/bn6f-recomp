name: beastsp_updateMotion
address: '0x080A9DFE'
kind: function
status: probable
summary: 'Per-frame update for a beastsp object: advances position by velocity and subtracts drag each
  tick; at frame 12 (if byte@+4==0) plays SFX 0x135 then sets animation 2 + loads anim data + noShadow;
  at frame 30 resets the counter and stores 8 to +9.'
interface: (r5 = object/behavior struct, no args in r0-r3) -> r0 = scratch; mutates fields at +0x14, +0x28,
  +0x24 (u16), +9 (u8); no return value
details: 'Uses r5 as a structure pointer: adds the word at +0x28 (velocity) to the word at +0x14 (position),
  then subtracts the word at +0x2C from the velocity, so the motion decelerates each tick. Increments
  the halfword counter at +0x24; when it hits 12, and only if the byte at +4 is 0, it plays sound effect
  0x35, then unconditionally sets sprite animation 2, reloads the animation data and clears the sprite''s
  shadow flag. When the counter reaches 30 it wraps back to 0 and stores 8 into the byte at +9, which
  is very likely the next behavior/state step for this object. The function is a leaf-style update step
  (only engine calls: PlaySoundEffect, sprite_setAnimation/loadAnimationData/noShadow), consistent with
  an object behavior routine dispatched per frame.'
