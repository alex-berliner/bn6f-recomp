name: beastsp_updateMotion
address: '0x080A9DFE'
kind: function
status: confirmed
summary: Advances a beast sprite's motion timer, switching to a new animation at tick 12 (with optional sound and
  shadow removal) and resetting the cycle at tick 30.
interface: beastsp_updateMotion(r5 = beastSprite, r2 = soundParam, lr) -> r5, r10; clobbers r0 r1 r2 r3 lr and flags
  nzcv; preserves r4 r6 r7
details: 'Operates on a beast-sprite structure pointed to by r5. Each call accumulates a time delta (field +0x28)
  into a position counter (field +0x14) and decrements a duration field (+0x28) by a fixed value at +0x2C. A 16-bit
  tick counter at +0x24 is incremented. At tick 12 (BEASTSP_ANIM_SWITCH_TICK): if the byte at +4 is zero, plays
  sound effect ID 0x135 (0x36+0xff) via PlaySoundEffect (which may update r5/r10); then calls sprite_setAnimation(2),
  sprite_loadAnimationData, and sprite_noShadow to swap to animation index 2 without a shadow. At tick >= 30 (BEASTSP_TIMER_RESET_TICK):
  resets the tick counter to 0 and writes 8 to the state byte at +9, presumably signalling the next phase of the
  beast''s idle/transformation sequence. Fields touched: +0x04 (sound-flag byte), +0x09 (state byte), +0x14 (32-bit
  position), +0x24 (16-bit tick), +0x28 (32-bit time-delta/duration), +0x2C (32-bit per-frame subtraction).

  '
