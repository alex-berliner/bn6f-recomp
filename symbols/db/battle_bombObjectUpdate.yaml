name: battle_bombObjectUpdate
address: '0x080DA2EC'
kind: function
status: probable
summary: 'Update handler for a bomb chip battle object: waits on a timer, then plays the bomb hit sound,
  spawns an explosion effect, and destroys/cleans up the object.'
interface: (r0 = battle object, kept in r5) -> r0 = clobbered; object state set to CUR_STATE_DESTROY on
  explosion path
details: 'Reads ObjectFlags2; if bit 0x8000 is set it takes an early destruction path: with 0x300000 also
  set it plays sound 0xD, otherwise it queries sub_800F8CE (0 = wait, 1 = just destroy, else spawn effect).
  The effect spawn loads three words from object+0x34 into r1-r3, adds 0xC0000 or 0x140000 to r3, and
  passes 0x14 or 0 in r4 to spawn_t1_0x0_EffectObject. On the normal path it sets ExtraVars+0x18 = 1 once
  and calls sub_80DA3EC while a separate timer is still zero; once the timer (TimerAndTimer2 word) runs
  out it plays SOUND_HIT_BOMB_1, spawns the explosion effect, and falls through to teardown. Teardown
  dispatches destroy sub-events, removes the object from the battle object list, clears its collision
  region, releases its reserved panel (FuturePanelX/Y), clears ObjectHeader flag bit 1, and writes CUR_STATE_DESTROY
  into CurStateActionPhase.'
