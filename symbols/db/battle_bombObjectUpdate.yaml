    object_clearCollisionRegion, object_removePanelReserve, then sets CUR_STATE_DESTROY; both branches
    build effect args from object+0x34 (''add r0, r0, r5; ldmia r0!, {r1-r3}'') and call spawn_t1_0x0_EffectObject;
    recorded execution route is ''chips'', consistent with a chip-spawned projectile object; locret path
    returns without destroying while ExtraVars+0x18/timer are still zero, i.e. an idle pre-explosion wait'
