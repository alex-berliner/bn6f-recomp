  sub_80CB628 would identify it
- Exact meaning of oBattleObject_Param1 >= 6 (HP threshold vs. counter) and what sub_80CB6B0 does between
  the action dispatch and the region check
- 'The lethal-condition comparison is inverted in the proposal: `cmp r0, #6; blt loc_80CB614` destroys
  on Param1 < 6 (not >= 6). The PanelXY-to-ExtraVars save and `object_clearCollisionRegion` occur in the
  Param1 >= 6 path (continuing to loc_80CB5DC), not as part of destruction. Also, the function tail-pops
  without explicitly setting r0, so the ''r0 = destroyed flag'' interface is speculative. The name and
