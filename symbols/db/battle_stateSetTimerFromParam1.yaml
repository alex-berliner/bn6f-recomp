name: battle_stateSetTimerFromParam1
address: '0x080C742C'
kind: function
status: probable
summary: Battle object state handler that loads a frame-duration from a small table indexed by Param1,
  seeds both timers with it, and advances to the standard update state.
interface: (r5 = battle object, no args) -> sets Timer/Timer2 = table[Param1*2], Param3 = 0, CurState
  = CUR_STATE_UPDATE
details: This is one of the per-state handlers dispatched through oBattleObject_CurStateActionPhaseAndPhaseInitialized.
  It reads the object's Param1, doubles it as a halfword index into a 4-entry table at byte_80C7448 (90,
  80, 60, 50 frames — likely a difficulty- or type-scaled countdown), writes the value into both oBattleObject_Timer
  and oBattleObject_Timer2, clears Param3 (a sub-counter/flag used during the countdown), and stores CUR_STATE_UPDATE
  into the state word so the object proceeds to its update handler next tick. It takes no arguments and
  returns nothing; r5 is the implicit object pointer from the dispatcher. The doubling suggests Param1
  selects among four preset delays.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; lsl r0,r0,#1 — Param1 is used as a halfword table index;
    byte_80C7448 holds 0x5A,0x50,0x3C,0x32 — four plausible frame delays (90/80/60/50); same value strh
    into both oBattleObject_Timer and oBattleObject_Timer2 — classic countdown seed; mov r0,#0; strb into
    oBattleObject_Param3 — resets the countdown sub-state; str CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    — hands off to the standard update state
  refs:
  - bn6f/asm/asm31.s:33174
  reproduce: python3 tools/asmcat.py 0x080C742C
