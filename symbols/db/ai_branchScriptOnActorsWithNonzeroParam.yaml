name: ai_branchScriptOnActorsWithNonzeroParam
address: '0x0810EA70'
kind: function
status: probable
summary: AI state handler that periodically counts battle actors with a nonzero property and switches
  the AI script (12 with a flag set when none remain, else 8).
interface: (r4 = AI data ptr, r5 = battle object, r6 = AI state) -> writes oAIState_ScriptId, maybe oBattleObject_ExtraVars+0x1c
  = 1; r0 clobbered
details: 'First bails out if the AI data''s version byte (oAIData_Version_16) is zero. Keeps a counter
  at battle_object+0x74; while it is below 3 it does nothing except (fall-through) keep script 8, and
  once it reaches 3 it is reset to 0 — so the expensive scan runs every 4th invocation. The scan is delegated
  to FindBattleActorsWithNonzeroParam_ReturnCountAndSum with field offsets 0x7C, 0x49 and 0x4E. If the
  returned count is zero, it stores 1 at oBattleObject_ExtraVars+0x1c (a phase/done flag) and sets AI
  script 0xC (12); otherwise it sets script 8. So it is a conditional branch inside a boss/AI script:
  ''when no actor matching the criteria is left, advance to script 12''.'
