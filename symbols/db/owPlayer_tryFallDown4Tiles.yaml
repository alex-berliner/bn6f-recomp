name: owPlayer_tryFallDown4Tiles
address: '0x0808FB68'
kind: function
status: probable
summary: Attempts to move the overworld player down 4 tiles (into a pit/hole); if that would leave the
  area it instead plays a fall sound, locks input and resets related state, returning 0, otherwise returns
  1 after the move.
interface: () -> r0 = 1 if the player was moved down by 4, 0 if the fall-out sequence ran; no flags
details: Reads the overworld player object's coordinates via ReadOWPlayerObjectCoords and subtracts 4
  (in 20.12 fixed point, hence the <<16) from the coordinate in r2. If the result is still > 0 it simply
  relocates the player to the adjusted coordinates (backing the old position into the Next fields) and
  returns 1. If the adjusted coordinate is <= 0 it instead writes the player to that position, sets the
  player's InteractionLocked flag, clears the reqBBS flag at 0x8140A0C, zeroes the state struct at 0x2000AA0,
  plays sound effect 0x1AE and returns 0 — i.e. the player has fallen off/down and control is handed to
  a cutscene-style handler.
