- which coordinate axis (X vs Y vs Z) r2 holds and which direction the 4-tile step represents — needs
  the layout of ReadOWPlayerObjectCoords' return registers
- what sound 0x1AE is and what gameplay context (falling into a hole vs leaving an area edge) triggers
