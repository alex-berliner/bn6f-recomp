summary: 'Per-frame update step for the Beast-form/SP (Beast-out) Navi''s AI: refresh AIData from the
  actor''s BattleObject, run/queue the beast intro cutscene, and advance any pending beast sub-state.'
interface: (r2 = ? , r10 = Toolkit, lr = ret) -> void ; no return value other than the clobbered scratch
  registers
details: 'The function is a small top-level dispatcher for the Beast-SP path. It first loads a

  word from off_8086D18 (via off_8086ED4) into r5, which is then passed as a pointer-ish

  context to several callees (r5 is consumed by battle_beastSpRefreshAIDataFromBattleObject_8087184,

  sub_808711C, and sub_80871F4, all of which take `r5` as a documented in-register). r10 is

  the Toolkit, as usual for the project''s battle code.


  Step 1: battle_aiGetCurActionPanelY_8087140 reads PanelY (BattleObject+0x13) for the

  Toolkit''s current actor slot. If non-zero (the actor is on a non-default panel),

  battle_beastSpRefreshAIDataFromBattleObject_8087184 is called to copy the

  BattleObject''s position/velocity into the AIData. The beq over the refresh on PanelY==0

  means AIData refresh is skipped for the actor''s home panel.


  Step 2: startScreen_runBeastCutscene_8086FD8 is always called; per its summary it

  decides which beast-out / beast-sp intro cutscene to start (story flag + map + result

  code gated).


  Step 3: EVENT_5ED is tested via TestEventFlagFromImmediate; if set, sub_808711C is

  called. EVENT_5ED is one of the 0x5ED-range event/story flags in this slot range; the

  flag gates a beast-SP specific branch (sub_808711C takes r5, so it likely mutates

  the beast-SP state struct loaded earlier).


  Step 4: sub_80871F4 is called unconditionally to advance the beast-SP sub-state. It

  takes r5 and returns r2/r3/r4 (kept by the caller per the contract; the caller

  doesn''t appear to use them, so this is a tail-style call).


  The captured-call snapshots are all from "snap_beastsp_0100000_*.bin" which suggests

  the engine records traces specifically for this beast-SP code path, with entry

  r2=1 and r3=02001d44 (consistent r2/r3 across 40 frames) and exit r0=0 with Z+C

  set.

  '
