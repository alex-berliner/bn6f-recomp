name: timer_setNoTimeout_8137700
address: '0x08137700'
kind: function
status: confirmed
summary: Writes 0x7FFF to the halfword timer counter at byte_20065B4, effectively disabling/expiring the timer.
interface: 'void sub_8137700(void); /* in: lr only; out: r2 = 0xFF (incidental); clobbers r0, r1, nz,c flags */'
details: Stores the halfword 0x7FFF to byte_20065B4 in IWRAM. That address is evidently a 16-bit countdown/timeout
  counter used elsewhere (the neighboring literal pool holds 0x140, likely a related timer constant). 0x7FFF is
  the largest positive halfword, so as a down-counter it acts as a "practically infinite" / "no timeout" value,
  or as a sentinel meaning the timer is inactive. The 0x7FFF is built as 0x7F<<8 | 0xFF (a Thumb-instruction-friendly
  way to form the constant). r2 is loaded with 0xFF as part of building the constant and remains set on return,
  which callers appear to ignore.
