name: ai_dispatchElementAttackStep_80FFC82
address: '0x080FFC82'
kind: function
status: confirmed
summary: AI attack dispatcher that reads the AI's hit-element byte and jumps to the matching attack step
  routine from a 5-entry table.
interface: void ai_dispatchElementAttackStep(u32 r2, u32 r3, u32 r5, AIAttackVars *r7, u32 r6, u32 r10);
  // tail-calls step in r1; outputs (r1 r5 r8 r9 r10 r11 r12) are whatever the dispatched step leaves
details: "r7 points at an AIAttackVars struct; the byte at oAIAttackVars_HitElement selects one of\nfive\
  \ attack step routines from the jump table at off_80FFC94:\n  0 ai_panelTargetAttackStep\n  1 sub_80FFD20\n\
  \  2 sub_80FFD6A\n  3 ai_chargeShotAttackStep\n  4 ai_chipAttackTick\nThe element is loaded into r0\
  \ and the selected table entry into r1, then the step is\ninvoked via mov lr, pc; bx r1 so it runs in\
  \ ARM state (table entries are +1 Thumb\npointers) and returns straight back to this function's caller.\
  \ r7 is pushed before the\ncall and popped after, so the step can clobber r7 freely while the original\
  \ caller still\nsees its own r7. All other inputs (r2 r3 r5 r6 r10) are passed through untouched; the\n\
  function's \"outputs\" are entirely whatever the dispatched step leaves in the registers.\nFlags nzcv\
  \ are clobbered by the dispatched step.\n"
