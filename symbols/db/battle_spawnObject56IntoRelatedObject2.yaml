name: battle_spawnObject56IntoRelatedObject2
address: '0x08010F96'
kind: function
status: probable
summary: Spawns a linked type-0x56 battle object via battle_spawnObject56LinkedToOwner_80C44A8 with packed
  param (r2<<16)|0x0A000003, and stores the returned object pointer into owner's RelatedObject2Ptr.
interface: (r0, r1 = spawn args passed through, r2 = packed param, r5 = owner battle object) -> r0 = spawned
  object ptr; owner->RelatedObject2Ptr set
details: Computes a packed word r4 = (r2 << 16) + 0x0A000003 (the low half is a fixed 0x0A000003 param,
  the high half comes from the caller's r2) and passes it with r0/r1 to battle_spawnObject56LinkedToOwner_80C44A8,
  which spawns battle object type 0x56 linked to the owner with inherited alliance/direction and header
  flags 0x04|0x10. The returned object pointer is written to [r5 + oBattleObject_RelatedObject2Ptr]. r5
  is callee-saved and used as a scratch pointer, so callers must pre-load it with the owner object; this
  is the project's usual r5-object convention. No other fields are touched and the owner pointer itself
  is returned unchanged in r0 as the spawn result.
