name: sub_802DD1E
address: '0x0802DD1E'
kind: function
status: confirmed
summary: Vestigial stub that ignores its arguments and always returns 0 with Z set.
interface: 'int stub_802DD1E(void); // inputs: r0 (ignored), r5/r7 (preserved, never read); outputs: r0 = 0, N=0
  Z=1 C=0 V=0'
details: 'Pure stub: clears r7, performs "adds r0, r7, #0" (equivalently mov r5, r0 followed by

  mov r0, r7 in the listing, which also writes r5 with the ignored r0 argument), then returns.

  The result is always r0 = 0 with flags set as for adding 0+0 (N=0, Z=1, C=0, V=0), so callers

  that check Z after the call always see "equal/zero". The push/pop of r5 and r7 cancel out, so

  both registers are preserved untouched. No memory, structures, or game state are touched at all.

  This looks like the remnant of a feature that was disabled or not implemented on the retail

  build (a common pattern for stubbed-out calls such as vibration, wireless hooks, or debug

  switches), but which subsystem it belonged to cannot be determined from the function body alone.

  '
