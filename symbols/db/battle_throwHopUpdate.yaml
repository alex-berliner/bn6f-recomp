  and which caller/enemy chip sets it up
- Whether phase value 4 here is a generic 'done' state shared by other phase handlers
- 'The setup matches: PhaseInitialized latched to 4, facing step + PanelX/PanelY converted to pixel coords,
  r5+0x34 passed to math_getThrowSpeeds, Timer set to 0xa, and after countdown CurPhaseAndPhaseInitialized
  set to 4. However the summary says ''lobs toward a target point'' but the code only converts the object''s
  own panel+facing panel to coords (no separate target object), and ZVelocity is decayed but the initial
  Z target passed to math_getThrowSpeeds is 0, not a height — so it''s more of a short ground hop/dash
  than a parabolic lob. The timer check at the end uses bgt (strictly greater), so when Timer==0 after
  decrement, it sets phase 4 — this part is correct.'
