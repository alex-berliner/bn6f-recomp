open_questions:
- The exact semantics of r0's packed layout (which half is the "command id" vs "OAM id") and whether the
  0x10 stride table is the OAM row table or some object-list table.
- Whether r2 (when non-zero) is being used as a u16 index vs an absolute offset -- the `ldrh r2,[r5,r3]`
  could be either.
- The role of the constant 0x20002 (looks like a flag/bitmask for the OAM queue).
- What r7 actually contains -- the captured calls don't show it; it is presumably the OAM id used as the
  lookup-table index when hiNibble == 1.
- Settling these would require naming battleObject_queueOamFromTableRow_811FAF4 and inspecting sub_8127944.
