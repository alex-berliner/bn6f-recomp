name: battle_chaseTowardEnemyPanelPhase
address: '0x080BF588'
kind: function
status: probable
summary: Phase 3 handler that plays a 1-magnitude 10-frame camera shake, waits 10 frames, then over 16
  frames dashes the battle object 3 panels toward the enemy side (reaching Z=0) and advances to phase
  4.
interface: (r5 = battle object pointer) -> updates oBattleObject_XVelocity/ZVelocity, Timer, CurPhaseAndPhaseInitialized;
  no return value
details: On the first invocation (PhaseInitialized==0) it calls camera_initShakeEffect(magnitude 1, duration
  10), sets Timer=0xA and marks the phase initialized. It then counts the timer down; while >0 it returns
  without acting. On expiry it reloads Timer=0x10, computes a target panel at PanelX + 3*object_getEnemyDirection,
  PanelY via object_getCoordinatesForPanels, and derives XVelocity = (targetX − X)/16 and ZVelocity =
  (−Z)/16 using BIOS divide (svc 6), i.e. a fixed-speed 16-frame dash covering the distance and dropping
  to the ground (Z→0). It plays sound 0x17F and stores phase 4 into CurPhaseAndPhaseInitialized so the
  object's state machine advances. No callers are known, so the exact owner object is unidentified.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst PhaseInitialized / camera_initShakeEffect(1,10) + Timer=10: one-shot pre-attack camera
    shake and delay; target = PanelX + 3*object_getEnemyDirection, PanelY via object_getCoordinatesForPanels:
    dash lands 3 panels in the facing direction; svc 6 (BIOS Div) on (targetX−X) and (−Z) with divisor
    0x10: per-frame velocity for a 16-frame move; PlaySoundEffect(0x17F) right before storing CurPhase=4:
    launch sound then phase advance; Timer countdown with bgt early return: this is a periodic per-frame
    state-machine step, not a one-shot call'
