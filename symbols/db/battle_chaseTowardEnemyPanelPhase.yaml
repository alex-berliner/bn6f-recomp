  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — ... chaseTowardEnemyPanelPhase aligns better: it leaps 3 panels toward the enemy, sets velocity
    for a 16-frame arc, drops Z, and finishes phase 3. The proposal says ''shake camera, wait 10, then
    each 16 frames sets velocities'' but the code does a single dash: only one velocity set is performed
    before storing phase 4 in CurPhaseAndPhaseInitialized, no repeated 16-frame ticks. The camera shake
    (mag 1, dur 10) is just an intro effect. Also ''lungeTowardFacingPanelPhase'' is wrong because the
    direction uses object_getEnemyDirection (toward the enemy side), not the facing panel.; run wf investigate
    investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
