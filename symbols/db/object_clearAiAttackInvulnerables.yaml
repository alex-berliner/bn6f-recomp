name: object_clearAiAttackInvulnerables
address: '0x0810D4E8'
kind: function
status: probable
summary: Clears invulnerability on every object recorded in the current AI attack's param buffer.
interface: (no args; uses r7 = oAIAttackVars-like context) -> void
details: Reads a pointer at oAIAttackVars_AiAttackParam from r7. If non-null, zeros that pointer and calls
  sub_810D498 which fills a 0x20-byte stack buffer with a count and a list of oBattleObject pointers.
  It then iterates the list calling object_clearInvulnerableTime on each, ending their post-hit i-frames.
  Intended as a one-shot cleanup step at AI attack boundaries, after which the AiAttackParam slot is freed
  (callers reset ExtraVars or PanelParamFlags2).
