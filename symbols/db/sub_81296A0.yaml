status: hypothesis
summary: Chatbox phase-4 tick handler that advances the chatbox state on flag 0x8, otherwise triggers a screen fade
  when both flags 0x20 and 0x110 are set.
interface: void chatbox_tickPhase4_81296A0(void);  /* r4/r5/r10 in; r4/r5/r6 out; clobbers r0-r3, lr, flags; preserves
  r6, r7 */
details: 'Polls chatbox_mask_eFlags2009F38 with flag 0x8; if set, writes 0x08 to chatbox state byte at r5+3 and
  calls sub_812B3FC (next chatbox phase step).

  Otherwise tests flag 0x20, then flag 0x110 (constant loaded from off_81296D4 = 0x110); if both set, writes 0x20
  to r5+2 and invokes SetScreenFade(0xC, 0x10) to begin a fade-out.

  r5 is a chatbox-state struct pointer (state bytes at offsets 2 and 3). The two-branch structure suggests the function
  is driven by a chatbox flag mask that promotes the dialog through successive phases.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
