name: ai_attackObjectWaitAndCleanup
address: '0x080EDC78'
kind: function
status: probable
summary: AI attack step that, on first entry, bumps a counter on the spawned temp attack object and starts
  a 10-frame wait, then on expiry clears the attack's active flag, resets the animation, detaches the
  attack object and exits the attack state.
interface: (r5 = battle object ptr, r7 = AI attack vars ptr, implicit) -> r0 = 0; no meaningful return
details: 'Uses r7 as an AI attack-vars struct: when AttackElement is 0 (first run) it loads the object''s
  AIData, takes TempAttackObjectPtr, increments that object''s byte at 0x10 (a use/charge counter), sets
  StepTimer to 10 and AttackElement to 4 so the setup runs only once. Every call then decrements StepTimer
  while non-negative and returns. Once the timer goes negative, it clears ObjectFlags1 bit 0x400000 (bit
  22) on the battle object via object_clearFlag, plays animation 0 via object_setAnimation, nulls oBattleObject_RelatedObject1Ptr
  and oAIData_TempAttackObjectPtr, and calls object_exitAttackState. The trailing words (PanelOffsetListsPointerTable,
  0x45A00) are unrelated data, not referenced by this routine.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/tst on oAIAttackVars_AttackElement gates one-time setup; sets StepTimer=0xA and AttackElement=4
    (asm loc before loc_80EDC92); StepTimer countdown with 'sub r0,#1; bge locret' implements the frame
    delay; object_clearFlag with r0=1<<22, then object_setAnimation(0) on cleanup path; r0=0 stored to
    oBattleObject_RelatedObject1Ptr and AIData TempAttackObjectPtr before object_exitAttackState; callee
    summaries (object_setAnimation, object_exitAttackState, object_clearFlag) match a battle attack-object
    teardown
