name: zeroFill_802E544
address: '0x0802E544'
kind: function
status: confirmed
summary: Zero-fills the fixed 0x170-byte work buffer at IWRAM address unk_20000A0.
interface: 'void clearWorkBuffer_20000A0(uint32 r2_passthrough); /* r2 in: forwarded to ZeroFillByByte, must be
  preserved; returns r2 unchanged; clobbers r0, r1, lr, flags */'
details: 'Thin wrapper around ZeroFillByByte. Loads the fixed IWRAM address unk_20000A0 into r0, builds the byte
  count 0x170 (encoded in the original as mov r1,#0x71 followed by add r1,#0xFF, i.e. 0x71+0xFF = 0x170), and calls
  ZeroFillByByte to clear the buffer. The interesting quirk is the register contract: r2 is an incoming argument
  that is forwarded verbatim to ZeroFillByByte as a third argument, so this wrapper must not touch r2; callers rely
  on r2 both arriving intact and coming back out unchanged. Which caller context supplies r2, and what unk_20000A0
  is used for afterwards (a 0x170-byte scratch/work area), is not visible from this function alone.'
