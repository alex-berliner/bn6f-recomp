name: object_subtractHP
address: '0x0800E2D8'
kind: function
status: confirmed
summary: Subtracts a damage amount from a battle object's HP field, clamping the result at zero.
interface: void battleObject_subtractHP(u32 damage /* r0 */); /* object ptr in r5; returns new HP in r1, c/v from
  the SUBS */
details: 'Reads the 16-bit HP field (oBattleObject_HP) of the battle object whose pointer the caller leaves in r5,
  computes HP - r0 as a 32-bit subtraction (so the carry and overflow flags from that subtraction escape to the
  caller), and stores the result back as 16 bits. If the subtraction would go negative (oldHP < damage, checked
  with the bge on the SUBS flags), the stored HP is clamped to 0 instead. The resulting HP is left in r1 for the
  caller. r4 is pushed/popped and untouched despite appearing in the caller contract. The trailing .word 0x40000000
  is just literal-pool data, not executed code. No other fields or state are touched, so triggering hit-freeze,
  damage popups, or death handling is left to the caller.

  '
