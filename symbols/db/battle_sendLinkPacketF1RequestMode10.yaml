name: battle_sendLinkPacketF1RequestMode10
address: '0x0800B484'
kind: function
status: probable
summary: Queues an outgoing battle link packet tagged 0xF1F1F1F1 carrying 60 bytes from byte_203F6D0,
  then requests battle mode 0x10.
interface: () -> r0 = 1 (from battle_requestSetBattleMode); no flags used by caller visible
details: Writes the tag word 0xF1F1F1F1 into dword_203CBE0, the packet-type field of the outgoing battle
  link packet structure (same field that carries 0x12345678 for battle-start state and 0x1F2F3F4F for
  the result record). It then copies 60 bytes (0x3C) from byte_203F6D0 into the packet payload at dword_203CBE4
  via CopyWords (BIOS CpuSet). Finally it posts a battle-mode request of 0x10 into eStruct203F7D8 via
  battle_requestSetBattleMode_80200A4, which also sets the update flag, and returns that call's 1. The
  60-byte source block at 203F6D0 is filled in elsewhere; this routine only snapshots it into the packet.
  No caller is known, so the trigger context (probably a link/wireless battle setup step) is inferred
  from the packet structures alone.
