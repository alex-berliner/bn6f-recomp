name: ai_attackMoveToChosenPanel
address: '0x081035D8'
kind: function
status: probable
summary: 'AI attack step: validates movement, calls the panel-choose callback (params in r2/r3, returns
  x in r0 y in r1), reserves target and own panels, sets CANNOT_SLIDE/anim4/timer3/element4, or aborts
  via exitAttackState.'
interface: (r7 = AI attack vars, r5 = battle object; callback in oAIAttackVars_PanelChooseCallback receives
  dword_810362C params and returns panel x in r0, y in r1) -> r0 = HasMoved (1 moved, 0 not); flags from
  callees
details: If object_canMove fails, or the callback returns 0 in r0, it sets oAIAttackVars_HasMoved = 0
  and falls back via object_exitAttackState. Otherwise it stores the callback-returned panel x/y into
  TargetPanelX/Y and calls object_reservePanel to claim that panel. It then copies the object's current
  oBattleObject_PanelX/Y into its FuturePanelX/Y and calls object_reservePanel again (claiming the object's
  own panel), sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, starts animation 4 (oBattleObject_CurAnim),
  sets oAIAttackVars_StepTimer = 3 and HasMoved = 1, and writes HitElement = 4. off_8103628 points to
  a two-word parameter block (0x10 and 0x0F880080) passed through r1/r2 to the panel-choose callback,
  so this is a generic 'move to a chosen panel' attack/state driver shared by several enemies.
