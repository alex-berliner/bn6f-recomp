open_questions:
- Whether the high-byte set in +0x04 in the "stop" branch is 0x80000000 (the m4a completion flag) or some
  other high bit — the only evidence is the `orr r0, r1` where r1 = 0x80000000, and that this is consistent
  with m4a source but not 100% confirmed.
- 'The exact channel-record size (0x50) is inferred from the stride `add r4, #0x50`; m4a standard `SoundChannel`
  struct is 0x40 in size, so the stride here is larger — could be a megaman-custom record or a wrapping
  struct. Worth verifying with the SoundChannel struct definition if it lives elsewhere in the project.'
