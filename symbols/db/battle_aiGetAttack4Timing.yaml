name: battle_aiGetAttack4Timing
address: '0x0810574C'
kind: function
status: probable
summary: Returns the AI attack-type-4 timing parameters (duration and boost) selected from a per-difficulty
  table.
interface: () -> r0 = duration value, r1 = boost value; no inputs (r0 is scratch)
details: 'Takes no arguments; it calls sub_800FE28 twice with the pointer byte_8105768 and byte_8105768+4,
  returning the first result in r0 and the second in r1. The table holds two groups of four bytes: {0x1e,0x18,0x14,0x12}
  and {0x18,0x10,0x10,0x10}, so sub_800FE28 selects one byte from each 4-entry group, very likely indexing
  by the AI difficulty tier set just before (battle_getAiDifficultyTier result stored to oAIAttackVars_AiDifficultyTier).
  Its caller stores r0 as a halfword into oAIAttackVars_AttackDuration and r1 into oAIAttackVars_AttackBoost2,
  then proceeds to load attack params for id 4 and set attack 0xe, so the values parameterize that AI
  attack. The decreasing values with tier suggest faster/shorter attacks at higher difficulty.'
