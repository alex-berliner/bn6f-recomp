- which boss/enemy AI calls this (both callers are undocumented) and what graphic 0x8318 depicts
- 'The code matches the proposal''s mechanics: arg==5 branches into a path using sub_80B8E62(0x11) for
  tile coords and spawns with r7=0x1e, then unconditionally spawns a second via the saved arg with r7=0x101001e.
  However the r4 packing is (flip, y, x, param) since the asm builds flip<<24 | y<<16 | x<<8 | param,
