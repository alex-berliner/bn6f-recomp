summary: Spawns battle object id 0x47 and stores it in the caller object's ExtraVars+8 slot.
interface: (r0 = spawn argument for the type-4 object, r5 = owner battle object) -> r0 = spawned object
  pointer; flags clobbered by callee
details: Tail of the routine is a single bl to the type-4 spawner wrapper battle_spawnType4Obj71, which
  creates battle object id 0x47 and returns its pointer. The returned pointer is written to field oBattleObject_ExtraVars+8
  of r5, so the caller battle object keeps a handle on the spawned object for later use/cleanup. No other
  logic, no conditionals; it is a spawn-and-remember helper. Recorded usage comes only from battlesweep
  and beastsp routes, and no callers are known in the captured set.
