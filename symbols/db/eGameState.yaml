- method: runtime
  date: '2026-10-18'
  detail: An encounter sets SubsystemIndex 0x04 -> 0x08 (the transition into battle) on its trigger frame, then
    0x0C 16 frames later; after the battle 0x00 for 2 frames, then 0x04. When an encounter rolls the same entry
    as the last battle, CurBattleDataPtr keeps its value, so the pointer alone does not show the trigger (two encounters
    in a row on 0x80b4530); the 0x04 -> 0x08 switch does.
  reproduce: step data/auto/run8w.0/fix_0017 with loss_896157.json's keys (in ~/vidsync on the driver PC), reading
