summary: 'Battle-object state handler: arm a 40-frame timer, then switch the object into its UPDATE state.'
interface: (r5 = battle object) -> r0 = state; writes oBattleObject_Timer and oBattleObject_CurStateActionPhaseAndPhaseInitialized
details: Uses r5 (not an argument) as a battle object pointer, storing 0x28 (40) into oBattleObject_Timer
  as a frame delay and writing CUR_STATE_UPDATE into the combined state/phase word, so the object's per-frame
  update logic takes over after the wait. The 6-instruction body is a typical state-init handler in the
  battle object state machine. Which object or which prior state routes here is not visible from the code
  shown.
