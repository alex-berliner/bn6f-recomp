summary: Dispatches a battle object's per-type update handler, then runs common entity/pipeline updates and applies
  post-update effects based on the object's type/sub-type.
interface: void battle_runObjectUpdate_81333A0(void);  // uses globals; R5 = object ptr (in); NZ/C/V flags come
  from internal comparisons; r0-r3,r8-r10,lr are caller-visible scratch
details: "R5 points at a battle-object record; byte 2 is the type (values 0/4/8/0xC/0x10,\npre-scaled by 4 as a\
  \ word offset into a 5-entry handler table at off_81333EC),\nbyte 3 is a sub-type/flag. The function:\n  1. Reads\
  \ objType = [R5+2] and tail-calls the matching handler\n     (battle_objectUpdate_8133400 / sub_81337C4 / sub_8133434\
  \ / sub_8133484 /\n     sub_8133788) via the thumb-mode \"mov lr,pc; bx r0\" indirect jump.\n  2. Calls battle_setFieldsFromObj_81340FC\
  \ and sub_8134490 to sync battle\n     state from the object and finalize the handler invocation.\n  3. Runs the\
  \ generic entity update pipeline (entity_runAllUpdateHandlers_80465BC,\n     sub_80465F8).\n  4. Branches on objType\
  \ again for post-update effects:\n     - objType == 0xC: if sub-type ([R5+3]) is 0, return immediately;\n    \
  \   otherwise call sub_81345FC.\n     - objType == 4 and sub-type == 0xC: return immediately (no effects).\n \
  \    - All other cases: spawn fixed effects via sub_81345D4,\n       battle_spawnFixedArgEffect_wrapper_81345E8,\
  \ sub_8134610.\nTouches: object record at R5 (bytes +2 type, +3 sub-type), jump table\noff_81333EC, and the entity/battle\
  \ field-sync routines listed above.\nQuirks: handler dispatch is a thumb-to-thumb \"bx\" with lr set to pc (no\n\
  link save), so the caller's lr is used; off_81333E8 is just a single-word\nindirection to off_81333EC.\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
