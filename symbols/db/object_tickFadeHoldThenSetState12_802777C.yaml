name: object_tickFadeHoldThenSetState12_802777C
address: '0x0802777C'
kind: function
status: confirmed
summary: 'Per-tick wait handler for an object: counts up a hold timer at obj+0x40 and, after 50 ticks with no screen
  fade running, advances the object''s state field (obj+2) to 0xC.'
interface: 'void sub_802777C(Object* obj /* r5 */); // in: r5 = object work area, lr = return; out: r3 (from IsScreenFadeActive),
  r4/r6 preserved; clobbers r0, r1, lr, NZCV'
details: 'Reads the 32-bit counter at [r5+0x40], increments it, and stores it back. If the

  new count is >= 0x32 (50 ticks) it calls IsScreenFadeActive(); only when that

  returns r0 == 0 (no fade in progress) does it store 0xC into the halfword state

  field at [r5+2], which presumably switches the object to its next state/phase in

  a per-object state machine. While the counter is below 50, or while a screen

  fade is active, the function does nothing besides the increment, so the state

  transition waits for both a minimum hold time and the end of any fade. The

  state field at +2 is the common halfword state/phase selector used by these

  object update handlers; the counter at +0x40 is a per-object frame timer.

  r4/r6 are pushed/popped only to satisfy the caller''s preservation contract; on

  the calling path r3 comes back as whatever IsScreenFadeActive left in it.

  '
