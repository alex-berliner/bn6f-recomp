name: ai_attackChooseTargetPanel
address: '0x0810823C'
kind: function
status: probable
summary: 'AI attack step: asks a per-alliance callback to pick the target''s panel, reserves it and enters
  the wind-up animation, or aborts the attack.'
interface: (r0..r4 likely object/AI state in r5/r7) -> r0 = destroyed; on success sets FuturePanelX/Y,
  panel reservation and anim; on failure HasMoved=0
details: First checks object_canMove; if the object can't act it clears oAIAttackVars_HasMoved and calls
  object_exitAttackState. Otherwise it loads two words from byte_8108288 indexed by oBattleObject_Alliance*8
  and calls the stored oAIAttackVars_PanelChooseCallback with the target object pointer and those words
  as arguments (lr=pc so the callback can bl). If the callback returns nonzero, r0/r1 (panel X/Y from
  the callback) are stored to oBattleObject_FuturePanelX/Y, object_reservePanel claims that panel, OBJECT_FLAGS_CANNOT_SLIDE
  is set via object_setFlag1, the object's current animation is set to 4, the AI step timer is set to
  3, and HitElement is set to 4. If the callback rejects, control falls through to the failure path (HasMoved=0,
  exit attack state). The byte_8108288 table has one 8-byte entry per alliance, but its meaning depends
  on the (unseen) callback.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove + beq failure path gates the whole step on the object being free to act;
    ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; bx r1 with target ptr in r0 and table words in r2/r3
    = panel-picking callback; strb r0/r1 to oBattleObject_FuturePanelX/Y then bl object_reservePanel claims
    the chosen panel; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1 and strb #4 to oBattleObject_CurAnim
    = enter non-sliding wind-up state; failure path: strb #0 to oAIAttackVars_HasMoved; bl object_exitAttackState'
