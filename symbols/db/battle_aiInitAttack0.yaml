name: battle_aiInitAttack0
address: '0x08108014'
kind: function
status: probable
summary: 'Initializes an enemy AI''s attack routine: reads AI difficulty tier, sets up attack state, targets
  the opposing player, and starts attack 0.'
interface: (r0 = enemy BattleObject passed via callee convention, r5/r7 = object and AI attack vars) ->
  r0 = destroyed; sets oAIAttackVars fields
details: This is a per-object AI attack initializer. It calls battle_getAiDifficultyTier_800FE36 and stores
  the resulting tier (0-2) into oAIAttackVars_AiDifficultyTier, then writes 2 to oAIAttackVars_InitFlag.
  It calls sub_8108124 with r0=0 (some reset, argument 0), then sub_8107EE8/sub_8107EFC to fetch the attack
  duration and a boost value into oAIAttackVars_AttackDuration and oAIAttackVars_AttackBoost2. It computes
  the opposing alliance (Alliance EOR 1), resolves that object via battle_findPlayer, and stores it as
  oAIAttackVars_TargetObjectPtr. Finally it starts the object's attack 0 via object_setAttack0 with duration
  0xa (10 frames?). The four callers (sub_8107C94/CF0/D62/DD4) look like a jump-table of AI attack-case
  handlers all sharing this common init path.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] after bl battle_getAiDifficultyTier_800FE36 stores
    the AI tier; mov r0,#2; strb r0,[r7,#oAIAttackVars_InitFlag] marks the attack vars as initialized;
    eor r0,r1 with Alliance then bl battle_findPlayer; str r0,[r7,#oAIAttackVars_TargetObjectPtr] selects
    the opposing player as target; mov r0,#0xa; bl object_setAttack0 at the tail actually starts the attack;
