name: battle_objTickTimerAndRefreshSpritePairs_8124D30
address: '0x08124D30'
kind: function
status: confirmed
summary: Per-frame update for a battle object — advances a clamp-at-160 frame timer, resets a counter,
  runs three per-object update routines, and refreshes two sprite halfword pairs.
interface: void sub_8124D30(void);  // object/work pointer in r5; r0-r3 and flags out are whatever the
  last callee left
details: 'Reads the object/work pointer from r5 only; all other registers are pass-through. First calls
  sub_8126818 with r0=0 (purpose unknown from this site). Then ticks the word timer at obj+0x74 by +2
  each call; once it reaches 0xA0 (160) it is clamped to exactly 0xA0 and the state byte at obj+2 is cleared
  to 0 (i.e. the object finishes this phase after ~160 frames). Next stores 0xFF into the word counter
  at obj+0x70 every call (so +0x70 acts as a countdown refilled to 255 each frame). Calls three per-object
  routines in order: sub_8125444, sub_8125D10, sub_8125D94. Finally writes two sprite halfword pairs via
  sprite_setStructHalfwordPairOnThree_8117084: pair slot 4 gets halfword obj+0x12 with pointer obj+0x58;
  pair slot 7 gets halfword obj+0x1C if the word at obj+0x5C equals 0x27, otherwise 0, and in both cases
  R0 passed to the sprite setter is the raw value of obj+0x5C itself (not the obj+0x58 pointer used for
  slot 4) — so slot 7 normally receives 0x27 as its "pointer" argument unless +0x5C holds something else.
  The +2-per-frame timer with a 0xA0 cap and the phase byte clear at obj+2 suggest a timed effect/animation
  whose visible parameters are pushed to the sprite struct through the halfword-pair helper.

  '
