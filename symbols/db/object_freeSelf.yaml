name: object_freeSelf
address: '0x080CCC1E'
kind: function
status: probable
summary: Thin wrapper that frees the battle object passed in r0 (the object's own 'destroy me' helper).
interface: (r0 = object pointer) -> r0 = object_freeMemory result; flags from object_freeMemory
details: The entire routine is push {lr}; bl object_freeMemory; pop {pc}, so it forwards r0 unchanged
  to object_freeMemory, which clears the object's flags, frees its type's bitmap slot, unlinks it from
  the active-object list, and resets sprite scaling. It exists only so a caller can free an object with
  a plain bl (saving its own lr) instead of a branch-link to the free routine directly. No state of its
  own is touched and no result is computed beyond what object_freeMemory returns. Without a known caller
  it is impossible to tell which object type(s) route their teardown through this wrapper.
