    at two timer thresholds — telegraph/effect at the target panel; timer-zero branch: increments AttackStepIndex
    and resets AttackElement=0 until it reaches SubStepIndex — looping attack steps; no-target path (beq
    loc_80FF21A after sub_80FF6E0): sets HitElement=0x10, aborting the attack; fields used are all in
    the oAIAttackVars AI-attack struct; element/anim/timer semantics match the project''s battle-object
    field names'
