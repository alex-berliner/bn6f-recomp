name: ai_chargedPanelAttack
address: '0x080FF1A2'
kind: function
status: confirmed
summary: One AI tick of a charged panel-targeted attack (charge pose, panel boost at one milestone, fire at another,
  advance to next attack step when done).
interface: void ai_chargedPanelAttack(u32 aux /*r3*/, BattleObject *obj /*r5*/, AIAttackVars *vars /*r7*/, u32 ctx
  /*r10*/); returns r1 = substeps/scratch, r5 = obj, r10 = ctx; clobbers r0-r3, lr, nzcv
details: 'Multi-tick AI attack driver for a charge-up panel attack (e.g. a boss charge shot that targets a specific
  panel). State lives in the oAIAttackVars_* fields of the r7 AI attack struct. When AttackElement is 0 the attack
  begins: element is set to 4 (charging), battle_findForwardUsableAttackPanel picks a usable panel ahead of the
  object (r5 = battle object; r10 is passed through); if no panel is found, HitElement is set to 0x10 (plain hit
  flag) and the routine returns. Otherwise the panel coords are stored in TargetPanelX/Y, the object''s CurAnim
  is set to 0xB with CurAnimCopy 0xFF (charge pose), battle_endRelatedObjectAnims stops dependent animations, sound
  effect 0xBF plays, and StepTimer and ChargeCycles are both initialized to TimerOrCycles + 0xC. On subsequent ticks
  (AttackElement != 0) StepTimer counts down. Two milestones on the countdown: when timer == ChargeCycles - AttackBoost2
  the target panel is boosted/charged via sub_80FF7A4 (panel X in r0, Y in r1), and when timer == ChargeCycles -
  TimerOrCycles the attack actually fires via ai_runAttackFromVars with the target panel coords. If the timer runs
  out without any milestone firing, the AttackStepIndex is incremented; when it reaches SubStepIndex the attack
  ends (HitElement = 0x10), otherwise AttackElement is cleared to 0 so the next tick starts a fresh charge (multi-shot
  pattern). This is one of the ai_ attack step handlers, presumably dispatched through an AI attack table.

  '
