name: ai_chargedPanelAttack
address: '0x080FF1A2'
kind: function
status: probable
summary: 'AI attack routine: on first call sets AttackElement=4, fetches a target panel via sub_80FF6E0,
  sets anim 0xb/0xff, calls sub_80FF668 and plays sound 0xbf, and primes StepTimer/ChargeCycles to TimerOrCycles+12;
  each subsequent tick, fires sub_80FF7A4 at ChargeCycles-AttackBoost2 and sub_80FF7B0 at ChargeCycles-TimerOrCycles,
  then when timer hits 0 increments AttackStepIndex, resetting AttackElement if SubStepIndex not yet reached;
  sets HitElement=0x10 when the step completes or no target exists.'
interface: (no args; r5 = battle object, r7 = oAIAttackVars) -> r0 = next attack step index or nothing;
  HitElement set to 0x10 if no target found
details: If oAIAttackVars_AttackElement is 0, it is set to 4 (one element type), the target panel is fetched
  via sub_80FF6E0, the battle object's animation is set to 0xb (0xff mirrored into CurAnimCopy), sound
  0xbf plays, and StepTimer/ChargeCycles are primed to TimerOrCycles+12. While the timer counts down,
  hitting ChargeCycles-AttackBoost2 calls sub_80FF7A4(x,y) and hitting ChargeCycles-TimerOrCycles calls
  sub_80FF7B0(x,y), both given the stored target panel X/Y (likely ground-telegraph/impact effects). When
  the timer reaches 0, AttackStepIndex is incremented; if it has not reached SubStepIndex, AttackElement
  is reset to 0 so the charge repeats, otherwise the step loop ends. If the initial target lookup failed
  (r0==0), HitElement is set to 0x10 and no charge occurs.
