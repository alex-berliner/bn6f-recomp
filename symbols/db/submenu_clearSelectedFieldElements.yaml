name: submenu_clearSelectedFieldElements
address: '0x0812D5A0'
kind: function
status: probable
summary: Clears the three visual elements associated with the currently selected submenu field.
interface: (r0 = unused) -> r0 = unspecified; flags clobpered
details: The shared submenu work state supplies indices at +0x2A and +0x2E, whose sum selects a record
  in the table at word_2023FA0. The function then clears three consecutive table entries via setFieldsInThreeTableEntries_811980C,
  using the selected record's field at +0x1C both as a written value and as a bit-packed position/index
  argument. It is called after field-locking dispatch and during submenu screen-state transitions, before
  rendering. The exact rendering role of each of the three fields remains unresolved.
