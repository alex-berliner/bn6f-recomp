name: battle_setExtraVars
address: '0x080C4526'
kind: function
status: confirmed
summary: Stores a value into a battle object's ExtraVars field.
interface: void battle_setExtraVars(void *object, u32 extraVars)
details: 'Tiny two-instruction setter: writes r1 to object + oBattleObject_ExtraVars (the battle object''s "extra
  vars" scratch/state word) and returns. r0 is the battle object address. No flags are read or written; lr is returned
  directly via mov pc, lr. Trivially inlinable; likely used to set the generic per-object extra variable used by
  battle scripts/handlers. The trailing dword_80C452C (0x10000) is just data following the function, not part of
  it.

  '
