name: battle_setExtraVars
address: '0x080C4526'
kind: function
status: probable
summary: Setter that stores a value into the battle object's ExtraVars field during battle-object initialization.
interface: (r0 = battle object pointer, r1 = value for ExtraVars) -> r0 untouched; returns via mov pc,
  lr
details: 'The function is a single-instruction field setter: it writes r1 to [r0, #oBattleObject_ExtraVars],
  the ExtraVars pointer/word slot of a battle object, and returns with mov pc, lr. It is called from battleObject_initSpriteFromRelatedOrParam2_80E32D8,
  which sets up a mystery-data battle object (visibility, NameID, sprite, actor info), so it assigns that
  object''s ExtraVars as part of initialization. The trailing dword_80C452C (0x10000) is just aligned
  data, unrelated. No flags are meaningful to preserve. Because it is a generic setter, its only observable
  purpose is the field it writes.'
