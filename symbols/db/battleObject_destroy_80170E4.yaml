open_questions:
- Why the final phase is `CUR_STATE_UPDATE` (0x4) and not `CUR_STATE_DESTROY` (0x8); perhaps destroy is
  signalled earlier (the Param2<1 check) and the function re-enters the update phase on next tick.
- Whether the `releaseSlotByValue_801DC36` `r0` value passed by the caller is the object itself or its
  slot index — the assembly passes `value 32` per the captured call snapshot, which is unusual for an
  object pointer; this needs cross-referencing with `sub_80171CC`.
- The `0x80` value seen in captured-call r2 looks like a sub-state ID passed in by the caller (`sub_80171CC`'s
  jump-target sub-state index).
