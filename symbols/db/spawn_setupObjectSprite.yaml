name: spawn_setupObjectSprite
address: '0x080C8E2C'
kind: function
status: probable
summary: 'One-time setup of a battle object''s sprite: loads sprite 0x1b, strips the shadow, resets animation/palette/flip,
  then hands the object to its update state.'
interface: (r5 = battle object header, no register args) -> r0 = garbage; writes oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE
details: Uses the global current-object pointer in r5. First recomputes pixel X/Y from panel coordinates
  and zeroes oBattleObject_Z16, then calls sprite_load with (0x80, 0x10, 0x1b) and sprite_noShadow. It
  ORs bit 1 into oObjectHeader_Flags, zeroes CurAnim and CurAnimCopy, and calls sprite_setAnimation(0),
  sprite_loadAnimationData, sprite_setPalette(0), and finally sprite_setFlip with the object's effective
  facing from object_getFlip. It terminates by storing CUR_STATE_UPDATE into the state/phase field, so
  this is a spawn-time initializer, not per-frame logic. The constants 0x80/0x10/0x1b passed to sprite_load
  are not identified here.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels; strh r0,[r5,#oBattleObject_Z16] — positions a fresh battle
    object; mov r0,#0x80 / r1,#0x10 / r2,#0x1b; bl sprite_load followed by bl sprite_noShadow — assigns
    a specific shadowless sprite; ldrb r0,[r5,#oObjectHeader_Flags]; orr #2 — sets a header flag before
    animation setup; sprite_setAnimation(0), sprite_loadAnimationData, sprite_setPalette(0), sprite_setFlip(object_getFlip())
    — full default sprite state; str CUR_STATE_UPDATE,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    — transitions the object to its update state'
