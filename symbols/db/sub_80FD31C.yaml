open_questions:
- Identity of the 0xD2 attack object type and what +0x12/+0x13 represent on it (panel X / panel row) — no struct
  alias confirmed in the datil; only raw offsets are documented.
- Whether object_getEnemyDirection here is meant in the "player-facing-direction" sense used by the readable (giving
  +1/-1) or a different enemy-targeting variant; the readable's use of it matched the disassembly but the precise
  semantic (player facing vs. enemy facing vs. attack facing) is inferred from the bool result and is not independently
  verified.
- Caller chain and what r0==1 triggers (likely an AI/decision gate for the opposing side's BattleObject whose pointer
  lives in r5); the original game's callsite is not shown.
- Why only the player's row (panel Y match) is enforced and not a column match — possibly because the loop's spatial
  check is done entirely via the dx*dir product equalling 1, leaving a column match implicit in the 0x12 vs enemy_panel_x
  relationship already checked by the product.
