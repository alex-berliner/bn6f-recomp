name: sub_80FD31C
address: '0x080FD31C'
kind: function
status: confirmed
summary: Scans BattleState's Unk_a0 object slot array for a live 0xD2-type enemy attack on the opposing player's
  row whose horizontal offset (multiplied by the player's facing direction) equals 1 — returns 1 if the player is
  directly threatened by such an attack, 0 otherwise.
interface: bool sub_80FD31C(u32 player_obj /* r5 */, u32 toolkit /* r10 */); /* returns r0 = 0|1; clobbers r1,r2,r3,lr;
  flags NZcV; preserves r4,r5,r6 */
details: "- Inputs come in via the callee-saved registers r5 (player's BattleObject*) and r10 (Toolkit*), consistent\
  \ with the standard battle-frame leaf signature; r5/r6 are preserved across the call so the caller can keep using\
  \ them.\n- Reads oBattleObject_Alliance from the player object and XORs it with 1 to pick the opposing side, then\
  \ calls battle_findPlayer(alliance) to fetch the opposing player's BattleObject*; pulls that object's panel X/Y\
  \ (offsets oBattleObject_PanelX / oBattleObject_PanelY) into a stack frame of two words.\n- Walks BattleState->Unk_a0\
  \ (accessed via oToolkit_BattleStatePtr + oBattleState_Unk_a0), 7 entries of 4 bytes (index 0..0x1C step 4); each\
  \ entry is a non-null BattleObject* when live.\n- For each live entry, requires:\n    * halfword at +0x28 equals\
  \ 0xD2 (attack object type filter),\n    * byte at +0x13 (panel row) equals enemy_panel_y (must share the player's\
  \ row),\n    * (enemy_panel_x - obj[+0x12]) * object_getEnemyDirection(player_obj) == 1, i.e. the attack sits\
  \ one panel away on the side toward which the player is facing.\n- Sub-call sequence: battle_findPlayer once,\
  \ then a single object_getEnemyDirection per loop iteration (passing the player's BattleObject via R5).\n- Quirks:\
  \ the offset 0x12 is named here only by its raw index (not aliased in the header dump); loop bound \"ble 0x1C\"\
  \ is the inclusive 7-slot scan (0,4,8,...,0x1C); dx is computed as plain subtraction so it's effectively an unsigned\
  \ distance wrapping in 8-bit, but the equality test with 1 only succeeds when the geometry is one panel over in\
  \ the player's facing direction.\n"
