name: sub_8007C14
address: '0x08007C14'
kind: function
status: confirmed
summary: Runs one step of the current battle sub-state at R5 and, once it finishes (or reports idle), advances the
  battle state machine to state 4.
interface: void battle_stepSubstateToState4_8007C14(BattleState* state /*r5*/, Work* work /*r4*/); preserves r4-r7,
  clobbers r0-r3/lr, returns nz/cv from the final stored value
details: 'Battle-state machine worker. It first calls the current state''s handler

  sub_801FE5E; if that reports 0 (not busy) the state ends immediately. If

  still busy: on the very first step (byte at r5+0x03 == 0) it calls the

  init routine sub_803DDA4 and writes sub-state marker 4 to r5+0x03, then

  returns, leaving the state alive for later steps. On subsequent steps it

  polls sub_803DE24 for completion; if complete and the kind byte at

  r4+0x01 equals 2, it stops early (kind-2 objects hold the state open).

  Otherwise it tears the state down with sub_81440D8 and notifies the

  handler via sub_801FE64. Finally it sets the battle state index at

  r5+0x01 to 4 and clears the halfword at r5+0x02 (pending sub-state

  fields) to 0, handing control to battle state 4. r4 points at a work

  object whose byte +1 selects the completion behavior; r5 is the battle

  state block (fields Index_01, Unk_02_03, Unk_03).

  '
