name: object_setSpritePosition_8119BE8
address: '0x08119BE8'
kind: function
status: confirmed
summary: Looks up an object's struct by index in the table at 0x2008450 and, if found, moves its sprite to the given
  (x, y) coordinates.
interface: void object_setSpritePosition(u32 x /*r0*/, u32 y /*r1*/, u32 objectIndex /*r2*/); clobbers r0-r3, NZCV;
  preserves r4-r7
details: 'Takes an x coordinate (r0), a y coordinate (r1), and an object index (r2).

  It stores x and y on the stack, then calls getStructFrom2008450 with the

  object index to fetch that object''s struct pointer from the table rooted

  at 0x2008450. If the lookup fails (returns 0, setting Z for the

  beq), the function returns without doing anything. Otherwise the value

  returned in r1 (a sprite/bank id from the struct lookup) is moved into

  r5, and sprite_setCoordinates is called with (x, y) to reposition the

  object''s sprite. The stack slots for x/y are freed and r4-r7 are restored

  before returning. Note the caller''s r5 is effectively destroyed across

  sprite_setCoordinates but restored by the epilogue pop, matching the

  register contract''s "preserved r4-r7" behavior.

  '
