open_questions:
- exact meaning of ids 0x40-0x42 and what the cached words at [r10+0x38] are used for (likely glyph/tile
  indices consumed elsewhere)
- which higher-level system enqueues entries into byte_201D74C and why the queue is capped at 4 renders
  per call (per-frame VBlank budget presumed)
