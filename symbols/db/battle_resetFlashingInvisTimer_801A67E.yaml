name: battle_resetFlashingInvisTimer_801A67E
address: '0x0801A67E'
kind: function
status: confirmed
summary: Clears a battle object's "flashing while invisible" timer in its collision data and returns the collision
  data pointer.
interface: battle_resetFlashingInvisTimer(struct BattleObject* obj /* r5 */) -> struct CollisionData* /* r3 */;
  clobbers r0 and NZ flags
details: 'Reads the battle object''s collision data pointer from oBattleObject_CollisionDataPtr at r5,

  then stores 0 into the halfword oCollisionData_FlashingInvisTimer of that collision data,

  resetting the timer that presumably controls the flash-while-invisible blink effect.

  The collision data pointer is returned in r3 for the caller''s convenience. No other fields

  are touched and no flags are set intentionally (NZ is merely clobbered by the mov).

  '
