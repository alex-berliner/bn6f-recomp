name: sfx_playChipUseSound_8123A50
address: '0x08123A50'
kind: function
status: confirmed
summary: Plays the "battle chip use" SFX entry sample for the chip identified by the object at r5, dispatching
  it through the sound driver sub_811FA98.
interface: void sub_8123A50(u32 chipObject /* r5 */); // r5 in (preserved), r5 out (preserved); clobbers
  r0-r3, lr, N Z C V; preserves r4,r6,r7
details: 'Reads one state byte at offset 0xC from the chip object (r5), uses it to index a small ROM lookup
  table at 0x08123A7C (single dword = 0x382E24) to obtain a byte offset, then dereferences a u16 sample
  id at (r5 + offset). Forwards that sample id to sub_811FA98 (the sound driver / SFX dispatch) along
  with constants loaded from the literal pool (r0=0xDA003D, r1=0x20002, r2=0x1E, r4=5, r6=0xC24C, r7=0x46).
  The r5 pointer (chip object) itself is passed through to sub_811FA98 as well. The function is a thin
  wrapper around the sound call; its only game-specific work is the state-byte -> offset -> sample id
  lookup against the chip record.

  Quirk: the halfword offset used to fetch the sample id is relative to the chip-object base (r5), not
  to the table — so it indexes into the chip''s own record (probably the chip id / sound field at a fixed
  offset chosen per state byte).

  '
