name: battle_countFolderChips_8027D58
address: '0x08027D58'
kind: function
status: confirmed
summary: Counts how many chips (up to 30) are stored in the equipped battle folder before its 0xFFFF terminator
  entry.
interface: 'int battle_countFolderChips(void); // in: lr only; out: r0 = chip count, r2 = pointer to terminator
  entry (or one past slot 30 if none), r3 = entries left unscanned; preserves r4'
details: "Scans the halfword chip-ID list at eBattleFolder (the currently equipped/regular\nbattle folder, 30 =\
  \ 0x1E slots) looking for the 0xFFFF sentinel that marks the\nend of the packed chips. Each nonzero-match entry\
  \ advances a cursor by 2 bytes\nand decrements a 0x1E counter; the loop exits early on the terminator or after\n\
  30 entries. Returns:\n  r0 = number of chips found before the terminator (0x1E if the folder is full\n       with\
  \ no terminator),\n  r2 = address of the terminator halfword (or one past the final entry when the\n       scan\
  \ ran off the end),\n  r3 = number of entries not yet scanned at that point (0x1E - count).\nCallers can therefore\
  \ get both the folder size and a pointer to the first free/\nterminator slot in one call. r4 is used as scratch\
  \ for the loaded ID but is\npushed/popped, so it is preserved. No flags are meaningful on return.\n"
