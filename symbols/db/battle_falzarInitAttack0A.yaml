  reproduce: python3 tools/asmcat.py 0x08105784
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s name and summary are otherwise accurate, but it misstates the call to battle_aiLoadAttackParams:
    the code calls sub_810565C with r0=0 (and that function then calls battle_aiLoadAttackParams internally),
