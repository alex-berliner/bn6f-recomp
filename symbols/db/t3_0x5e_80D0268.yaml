name: t3_0x5e_80D0268
address: '0x080D0268'
kind: function
status: confirmed
summary: Dispatches a battle object to its per-state virtual handler (initialize, step-on-parent, or destroy/release-panel)
  via a 3-entry jump table indexed by oBattleObject_CurState, then calls object_updateSpritePaused on the (possibly
  re-pointed) object.
interface: void battle_dispatchStateAndSpriteUpdate(u32 r5 /*battleObj*/, u32 r2, u32 r10) -> modified r5, r8, r9,
  r10, r11, r12
details: 'Loads oBattleObject_CurState (byte) from the battle object in R5, uses it as an index into the 3-entry
  Thumb jump table at off_80D0280. The table entries are: [0] battleObject_initializeFromStateUpdate_80D028C, [1]
  object_stepDependentOnParent, [2] battle_destroyObjectReleasePanel_80D035C. Dispatch is performed with bx r1 (mov
  lr, pc trick to give the callee a valid return address). R0 holds the raw state byte for the callee; R2 and R10
  are passed through from the caller. The handler may swap R5 to a different object and mutate R8–R12. After the
  handler returns, object_updateSpritePaused is called with the (possibly updated) R5, which writes back to R5.
  R10 is effectively preserved across both calls. Clobbers r0-r4, r6, r7, lr and all condition flags. This is a
  tilemap (t3) dispatch slot, likely used as a vtable entry in a battle-object update loop.

  '
