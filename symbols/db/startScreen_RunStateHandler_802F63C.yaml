name: startScreen_RunStateHandler_802F63C
address: '0x0802F63C'
kind: function
status: confirmed
summary: Start-screen state dispatcher — reads the screen's state byte, calls the matching state handler from a
  5-entry jump table, then runs the common per-frame routine.
interface: void startScreen_RunStateHandler(StartScreen* self /* r5 */); clobbers r0-r3, r12, lr and flags; handlers
  are tail-style bx calls using lr-as-pc
details: 'Part of the title/start-screen (StartScreen object kept in r5 by callers). Reads the

  state byte at StartScreen+1 (oStartScreen_JumpTableOff_01) and uses it directly as a

  byte offset into jt_802F654 via ldr r0, [r0, r1] — no scaling, so the five states live

  at byte offsets 0, 4, 8, 12 and 16, i.e. the stored value is stateIndex*4, not 0..4.

  Before dispatch it sets lr = pc and calls the handler with bx r0, so the handler receives

  r0 = handler address | thumb bit and r1 = the raw state byte as arguments (quirky

  thumb-set-longcall convention); handlers return by popping into lr to land on the bl

  sub_802FB10 call. Handlers: state 0 sub_802F668, state 1 sub_802F6A4, state 2

  sub_802F6B2, state 3 startScreen_UpdateAndRenderFrame_802F704 (runs each frame once the

  screen is active), state 4 sub_802F710. After any handler, sub_802FB10 runs unconditionally

  (likely the common update/OAM-commit/step for the screen) and then the function returns.

  No other registers are saved; r5 is treated as caller-provided context, not restored.

  '
