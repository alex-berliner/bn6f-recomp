name: ai_attackTickDelayTimer_80EC90E
address: '0x080EC90E'
kind: function
status: confirmed
summary: Runs a 10-frame countdown for a delayed AI attack, then detaches the tracked object and exits the attack
  state when it expires.
interface: void sub_80EC90E(BattleObject *obj /* r5 */, AIAttackVars *vars /* r7 */) — r6, lr also live on entry;
  on early return r0 = remaining timer and nz/c reflect timer-1; on expiry calls object_exitAttackState and returns
  r0 = 0.
details: 'Part of the AI attack state machinery, operating on a BattleObject (r5) and its

  AI attack vars block (r7). First activation: oAIAttackVars_Unk_01 == 0, so it

  stores 10 into the halfword timer at oAIAttackVars_Unk_10 and writes state 4

  into oAIAttackVars_Unk_01 to mark the timer as started. Every tick it decrements

  the timer; while it is still >= 0 it returns early with r0 = remaining count

  (flags set by the decrement). When the timer reaches 0/-1 (underflow to negative),

  it clears oBattleObject_RelatedObject1Ptr (detaches whatever object was being

  held/tracked for this attack), writes 0 to oAIData_Unk_68 in the object''s

  AIData struct (-> r1 passed to the callee), and calls object_exitAttackState

  with r0 = 0 to leave the attack state. Note the timer is stored via strh but

  compared as a full word after decrement, so values >= 0x8000 would read negative.

  '
