name: battle_spawnVelocityParticle
address: '0x080E1084'
kind: function
status: probable
summary: Spawns a type-4 battle object (kind 9, particle/debris) and initializes its direction angle and
  X/Z velocity for effects like random particle bursts.
interface: (r0 = direction angle byte saved across the call; caller pre-sets r6 = X velocity, r7 = Z velocity,
  plus args for spawnType4) -> r0 = status/possibly new object pointer; writes oBattleObject_DirectionAngle/XVelocity/YVelocity/ZVelocity
  on the spawned object
details: 'The helper saves r0/r5 with a second push (8 bytes of stack, likely also feeding spawnType4''s
  5th stack argument), calls object_spawnType4 with r0 = 9 to spawn a type-4 battle object, and only if
  the spawn succeeded (beq skips the writes) fills the new object''s motion fields: DirectionAngle from
  the saved r0 byte, XVelocity from caller-set r6, YVelocity forced to 0, and ZVelocity from caller-set
  r7. This register-based parameter passing (r5-r7 set by the caller before the call) is a hand-written
  thunk convention rather than the standard AAPCS. Its only identified caller, battle_spawnRandomParticleBurstAtObject,
  invokes it to produce the individual particles of a burst and then plays SFX 0xD9, so kind 9 is almost
  certainly a flying particle/debris effect. The listed disassembly has suspicious ordering (pop {r0,r5}
  clobbering the callee''s return before beq/strb), so the field-write target is almost certainly the
  freshly spawned object pointer (r2), restored from the stack slot.'
