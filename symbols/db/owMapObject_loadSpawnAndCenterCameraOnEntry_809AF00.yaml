name: owMapObject_loadSpawnAndCenterCameraOnEntry_809AF00
address: '0x0809AF00'
kind: function
previous_names:
- sub_809AF00
status: probable
summary: Spawn the story-5 entry overworld map object and recenter the camera on the player at that spot
interface: '(r5 = GameState/JumpTable scratch, r10 = Toolkit) -> r0 = 0 ; side effects: sets player coords/facing/anim,
  raises an event flag, spawns a map object, recenters camera'
details: '1. Loads `off_809AFBC` (= `byte_809ADB4`) into r7 as a base of a per-map-object descriptor array
  of 0x3c-byte entries.

  2. Reads `toolkit->GameStatePtr->MapId` (r10->[0x3c]), takes the low byte, scales by 0x3c, and indexes
  r7 to get the entry for the current map.

  3. Reads entry+0x24/0x28 (X/Y) and writes them via `owPlayer_indirectlySetPlayerCoordsMaybe_809e1a4`
  into the eStruct200ace0 player coords.

  4. Reads entry+0x2c and uses it as both the player facing direction (`SetOWPlayerFacingDirection`) and
  a fixed overworld animation select (`owPlayer_setS200ace0_fixedAnimationSelect_809e13c`, which also
  raises EVENT_1719).

  5. Calls `ZeroOWPlayerNaviPaletteIndex` (resets the Navi''s palette index to default).

  6. Calls `sub_809E4F8` to draw the player sprite for the current animation frame.

  7. Pushes/pops r4-r7 around `SpawnOverworldMapObject(0x2e, entry+0x30, entry+0x34, 0, entry+0x38)` to
  safely pass the extra regs.

  8. If entry+0x20 is non-zero, calls `SetEventFlag` with it (story flag to set on entry).

  9. Default `r4 = 0x2d` (a fixed overworld player animation select). If `EVENT_COPYBOT_ACTIVE` is set,
  changes it to `0x2e`, then stores the chosen byte at `r5+4` (a sub-state field of the calling subsystem''s
  struct).

  10. Calls `camera_writeUnk03_14_80301b2(0)` to clear the camera shake/param fields.

  11. Computes the camera center: `camX = (entry[0x24] + entry[0x30]) >> 1`, `camY = (entry[0x28] + entry[0x34])
  >> 1` (midpoint of player and spawned object), z=0, and calls `SetCameraXYZ`.

  12. Returns 0.

  '
