name: camera_moveByDelta_80310B0
address: '0x080310B0'
kind: function
status: confirmed
summary: Adds a delta (scaled to fixed-point) plus the current scroll offsets to the camera position, skipping the
  update when the delta is zero.
interface: void camera_moveByDelta(int dx, int dy); // r0=delta x, r1=delta y (both shifted <<14 internally); returns
  r3=1 if camera updated, 0 if skipped, r4=scroll state base, r6=new y; c/v set from the final y add (update path)
  or the 'moved==0' compare (skip path)
details: 'Takes caller-supplied deltas in r0 (x) and r1 (y) and shifts each left by 14, converting

  coarse input units to the camera''s internal fixed-point scale. If both shifted deltas are

  zero the function returns immediately with r3=0 and the position is untouched. Otherwise

  it loads the camera position struct pointer from *dword_200F3D0 (a pointer cell; the

  position struct has x at +0 and y at +4) and the screen scroll state block base from

  dword_200F3E0. For x: pos.x += dx + *(scroll+0x18) (dword_200F3F8, scroll offset x), stored

  back at +0. For y: pos.y += dy + *(scroll+0x1C) (dword_200F3FC, scroll offset y), stored

  back at +4. Note the stored y value does not include the scroll offset for the flag

  computation order — the c/v flags come from the intermediate add of scrollY to

  (pos.y + dy) before the final store, so a caller reading flags sees carry/overflow from

  that add only. Scratches r0-r2, r5; leaves r3, r4, r6 set as side-channel outputs and

  n/z clobbered per the contract.

  '
