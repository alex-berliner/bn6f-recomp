name: battle_updateEStructSprites_80465F8
address: '0x080465F8'
kind: function
previous_names:
- sub_80465F8
status: probable
summary: 'Per-frame sprite pipeline over the eStruct record array: for each of the 15 records whose flag
  byte has bit 0x2 (active/visible), rescans hitboxes, reloads palette and the current anim frame''s tiles
  when flagged, and rebuilds its render data.'
interface: 'void battle_updateEStructSprites(void) : (nothing, only lr) -> [nz c v r0 r1 r2 r3 r4 r5 r6
  r7 r8 r9 r12] (callee-saved restored)'
details: 'Forces its saved argument to 0 (mov r0,#0 before the prologue; it is passed on to sub_8002694
  as r0, with r1 = 0), then walks the 15 records of eStructArr2008450 with a 0x58-byte stride. Each record:
  byte 0 is a flags byte, the ObjectSprite struct sits at +0x20. Records whose flags byte has bit 0x2
  get, in order: battleObject_scanHitboxesAndSetFlags_80466D8(sprite) (mirror flags, on-screen flag, active-hitbox
  mask); then the same flags byte gates the graphics work - bit 0x40 skips palette AND anim-frame tiles,
  bit 0x80 skips only the palette, otherwise sprite_loadPalette_8002818; bit 0x20 is required for sprite_loadAnimFrameTiles_8002874;
  finally sub_8002694(sprite, 0, 0) always runs (rebuilds the record''s render/OAM data). Called by essentially
  every per-frame scene tick (PET menus, chip folder, battle submenus, world map, shop).

  '
