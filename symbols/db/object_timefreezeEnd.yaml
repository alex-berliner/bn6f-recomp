name: object_timefreezeEnd
address: '0x0800BD34'
kind: function
status: probable
summary: End-of-turn cleanup for a time-freeze battle object, releasing its memory and resetting animations/counters
  on both sides.
interface: 'void object_timefreezeEnd(u32 r5 /* battle object */) : r5 -> [r0 r1 r2 r3 lr nz c v]'
details: Reads oBattleObject_PhaseInitialized; if non-zero the object simply frees its memory and returns. Otherwise
  reads oBattleObject_Alliance as team (0=own, 1=opponent), notifies the team-mode helper with arg 5, then queries
  the opposite side (team^1) via sub_800B884/sub_800B892 and only proceeds if that side's mode is 5 or 0. If sub_800B8D8(team)
  is non-zero, it looks up the opposite side's entry via byte_203CF00_getEntryPtr_800BF5C, optionally patches an
  attached sub-struct (offset +8 ptr, then sets +8=8, +0xB=4), zeroes the entry's +0xC counter, resets the opposite
  side's animation state, and clears battle flags with mask 4. Finally it resets this side's team mode to 0, resets
  its animation state, zeroes its entry +0xC counter, and calls object_freeMemory. r5 is preserved.
