  what: 'readable C taken out of cport/src/game/object.c after review against the assembly (the lifted original
    runs again); status confirmed -> probable, as the checks that confirmed it ran code that differs from the original:
    The C flag (a contract output: nz c v r0 r1 r2 r3 r5 lr) is wrong on the early-return path. asm: after `bl sub_800B892`
    it does `cmp r0, #5; beq; cmp r0, #0; beq; b locret_800BDB0; ... pop {pc}`, so when mode is not 0 or 5 it returns
    with the flags of `cmp r0, #0` (Z=0, N=0, C=1, V=0). C: `if (mode != 5 && mode != 0) return;` sets no flags,
    so it returns the flags sub_800B892 left. Those come from...'
