name: ai_loadBossAttackDamagePair
address: '0x080F5AD4'
kind: function
status: probable
summary: Looks up a boss attack's damage values from two versioned AI tables and stores them as a word
  pair in the boss AI's attack variables.
interface: (r0 = boss/enemy battle object or AI index) -> r0 = combined value stored; writes [AIDataPtr+0xA0]
  = oAIAttackVars_Damage
details: Given r0, it multiplies by 8 and indexes two 8-byte-per-entry tables (byte_80F5B34 and byte_80F5B58)
  via battle_aiGetVersionedTableEntry_800FE12, which selects the halfword by the battle object's AI version.
  The first read gives the low halfword; the second is shifted left 16 and OR'd in, forming a word of
  two damage values. That word is stored at [battleObject AIDataPtr + 0xA0] into the oAIAttackVars_Damage
  field. Called by ai_decideAttackPattern when the boss switches/rolls its attack routine, so this seeds
  the damage parameters of the chosen attack. The 8-byte stride and version-scaled entries mirror the
  standard BN6 AI parameter table layout.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mul r0,#8 + byte_80F5B34/byte_80F5B58 table lookups via battle_aiGetVersionedTableEntry_800FE12
    (asm lines 3-13); lsl r0,#0x10 ; orr r6 combines two versioned halfwords into one word (asm lines
    14-16); str r6,[AIDataPtr+0xA0] writes into oAIAttackVars_Damage of the battle object's AI data (asm
    lines 17-20); caller ai_decideAttackPattern chooses attack routines per turn, matching an attack-parameter
    loader
