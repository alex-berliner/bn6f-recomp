summary: Spawns battle object type 0x49 as a child of the caller's object and copies key fields plus an
  owner link into it.
interface: (r5 = source/owner object ptr, passed before the call) -> r0 = spawned object ptr (or 0 on
  failure); no flags used by caller
details: 'The function requests object type 0x49 (73) via object_spawnType4, returns early if the spawn
  failed (r0 == 0). On success it copies three words at +0x34/+0x38/+0x3C (likely position/velocity-type
  fields) and a byte at +0x16 (likely team/property) from the owner struct into the new object, then stores
  the owner''s pointer at offset 0x4C of the child, establishing a parent/back-reference link. Note the
  given listing is garbled: the pops must actually occur after the field copies, with r5 holding the caller''s
  object for the duration; otherwise the loads from r5 would read garbage. No callers are known, so the
  exact meaning of type 73 and the copied fields is unconfirmed.'
