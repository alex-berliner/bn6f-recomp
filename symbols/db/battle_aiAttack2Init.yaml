name: battle_aiAttack2Init
address: '0x080F661E'
kind: function
status: probable
summary: 'AI attack-init routine for attack index 2: caches difficulty tier, loads the attack''s params,
  installs its panel-choose callback, and enters attack state 0xC.'
interface: (r7 = enemy object) -> r0 = clobbered; stores oAIAttackVars fields, sets object attack state
details: Reads the enemy's AI data difficulty tier via battle_getAiDifficultyTier_800FE36 and stores it
  at oAIAttackVars_AiDifficultyTier, then zeroes oAIAttackVars_InitFlag. Calls battle_loadAiAttackParams
  with r0=2 to fetch the two per-version table halfwords for attack 2, packed into the AI attack-vars
  damage field. Installs sub_80F70A0 as oAIAttackVars_PanelChooseCallback, the callback that later picks
  target panels for this attack. Finally calls object_setAttack0 with r0=0xC, putting the object into
  the attack-0xC state whose step logic pairs with this init.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'strb r0,[r7,#oAIAttackVars_InitFlag] after mov r0,#0: clears the per-turn init latch for this
    attack-init step; bl battle_loadAiAttackParams with r0=#2: loads version-table params specifically
    for attack index 2; ldr r0,off_80F66E8 (sub_80F70A0) str into oAIAttackVars_PanelChooseCallback: installs
    this attack''s panel-selection handler; mov r0,#0xc; bl object_setAttack0: transitions the object
    into attack state 0xC; called from battle_aiTurnHandler, the AI turn handler that branches into per-attack
    init routines'
