name: submenu_refreshChipListLine
address: '0x0801EB18'
kind: function
status: probable
summary: Builds/updates unk_2036850 from pt_801EF84[0x50], calls chip_renderListEntry with the chip id,
  writes a 0x3C value, then sets request bit 0x10000 on eStruct2035280 and dispatches it via dispatch_801DA48(1).
interface: (r0 = chip id/index) -> r0 clobbered by calls; writes unk_2036850+0x2/+0x7/+0x8, ORs bit 0x1
  into eStruct2035280+0x40 request dword, then dispatch_801DA48(1); flags not meaningful
details: It indexes the pointer table pt_801EF84 at offset 0x50 to fetch a per-chip data pointer, copying
  its halfword at +0 into unk_2036850+0x2 and its byte at +2 into unk_2036850+0x8. It then calls chip_renderListEntry
  with r0 (the chip id from callers), r3 = that data pointer, and r4 = 1, which builds the name-plus-code
  display line into the same state block. Afterwards it stores 0x3C (60, likely a frame timer or line
  count) into unk_2036850+0x7. Finally it ORs request bit 1 into the eStruct2035280 request dword (dword_20352C0)
  and calls dispatch_801DA48 with 1, so the prepared popup gets rendered/handled on the next pass. Callers
  in playerAI and the chip-list routines (0x801056A/0x80105F2) fit showing a chip's info/description entry.
