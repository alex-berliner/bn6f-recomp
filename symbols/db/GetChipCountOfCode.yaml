name: GetChipCountOfCode
address: '0x08021BC0'
kind: function
status: confirmed
summary: Returns the quantity owned of a chip given its code index and search-bag index, or 0 if the code is not
  recognised.
interface: 'u8 GetChipCountOfCode(u32 chip_idx /*r0*/, u32 search_item /*r1*/, u32 off /*r2*/) -> r0

  '
details: 'Validates the (chip_idx, search_item) pair via sub_8006EA4; if that pair is not in the

  registry it returns 0 immediately. Otherwise it asks

  getOffsetToQuantityOfChipCodeMaybe_8021c7c for the address of the quantity byte for

  that code and returns the byte read there. Inputs r0=chip_idx, r1=search_item, r2=off

  are forwarded into both helpers; r0 holds the result (clobbering nz/cv from the

  first helper, then plain r0 read on return).

  '
