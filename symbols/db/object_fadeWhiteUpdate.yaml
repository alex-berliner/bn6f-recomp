name: object_fadeWhiteUpdate
address: '0x080A974C'
kind: function
status: probable
summary: Per-frame object state that fades the sprite's color to white via a gray color-shader ramp, then
  transitions to the next state.
interface: (r5 = object struct) -> void; increments object field 0x24; on completion sets object byte
  8 = 0xC and calls the follow-up handler sub_80A96FC
details: This is an object update step using the object pointer in r5. Each call it reads the frame counter
  at [r5,#0x24], halves it (so the palette step advances every other frame), and indexes byte_80A978C,
  a 15-entry ramp of gray shades (0x4,0x6,...,0x1F) terminated by 0xFF. Each shade v is expanded to BGR
  by or-ing v | v<<5 | v<<10 (equal red/green/blue = grayscale) and passed to sprite_setColorShader, brightening
  the sprite toward white each step. When the table's 0xFF terminator is hit, it stores 0xC into the object's
  byte at +8 (likely a new state/animation id) and calls sub_80A96FC to continue. It then increments the
  counter at +0x24 and always finishes with sprite_update so the sprite keeps animating during the fade.
  The two callers are the small wrappers that enter this fade state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
