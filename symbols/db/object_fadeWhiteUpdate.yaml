    r1 / orr r0, r2 with r1=v<<5, r2=v<<10 builds a BGR grayscale word passed to sprite_setColorShader;
    0xFF branch: mov r0,#0xC; strb r0,[r5,#8]; bl sub_80A96FC — state hand-off on fade completion; lsr
    r0,r0,#1 before table lookup and add r0,#1; str r0,[r5,#0x24] — halved frame counter stepped every
    call; tail bl sprite_update keeps the sprite animating each frame during the effect'
