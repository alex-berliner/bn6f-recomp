name: ai_attackWindupStepIdle20
address: '0x080F1DE4'
kind: function
status: probable
summary: AI attack-state step that starts a short 20-frame wind-up pause (resetting animation) before
  letting the attack proceed via object_exitAttackState.
interface: (r7 = battle object AI attack vars, r5 = battle object) -> r0 = scratch only; flags set by
  timer decrement test
details: 'On entry it reads oAIAttackVars_AttackElement; if it is 0 (attack not yet started), it stores
  element 4, zeroes oBattleObject_CurAnim, and loads 0x14 into oAIAttackVars_StepTimer, so the object
  plays its idle/neutral animation for 20 frames. On subsequent calls it decrements StepTimer each frame;
  while the timer is still positive it simply returns. When the counter reaches 0 it calls object_exitAttackState,
  which ends this attack step and returns the AI to its normal state. It is a two-phase step: one-time
  initialization guarded by AttackElement, then a countdown.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne skips init, showing element!=0 means already
    started; strb #4 -> oAIAttackVars_AttackElement and strh #0x14 -> StepTimer are the one-time setup
    branch; mov r0,#0; strb [r5,#oBattleObject_CurAnim] resets the object''s animation during the pause;
    timer decrement with bgt keeps it looping 20 frames before falling through to object_exitAttackState;
    callee object_exitAttackState confirms this is one step of the AI attack state machine'
