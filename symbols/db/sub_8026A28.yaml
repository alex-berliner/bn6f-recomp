summary: Dispatches one tick of the eS20364C0 state machine via its jump table
interface: void sub_8026A28(void); /* uses r5 for the state object; passes state byte in r0 and jump-table entry
  in r1 to the handler; whatever r0,r2-r4,r6,r8-r12 the handler returns is returned to the caller; r5 is preserved;
  clobbers r1,r7,lr and flags nzcv */
details: "Reads the state byte (oS20364C0_JumpOffset00) from the global object at eS20364C0 and\nindexes a 3-entry\
  \ handler table at off_8026A3C:\n  +0  sub_8026A50\n  +4  custMenuMainMaybe_8026A88 (custom menu main)\n  +8 \
  \ object_runFrameUpdate_8026A6C\nCalls the selected handler with r5 = eS20364C0 (self), r0 = state byte, r1 =\
  \ table\nentry (function pointer), using mov lr,pc / bx r1 (thumb switch via GUEST_CALL_ADDR).\nOnly r5 is preserved\
  \ across the call (push {r5,lr} / pop {r5,pc}); every other\nregister the handler leaves live is propagated to\
  \ the caller.\n"
