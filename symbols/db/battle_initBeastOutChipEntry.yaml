name: battle_initBeastOutChipEntry
address: '0x08027F10'
kind: function
status: probable
summary: Initializes the beast-out pseudo-chip entry of the chip-select turn state, skipping entirely
  when beast-out is unavailable.
interface: (r4 = base of a chip-select record block, r5 = chip-select turn state struct, r7 = beast-out
  chip id (0xA or 0x16)) -> r0 = clobbered; no return value
details: 'Reads the flag at [r5,#0x10]; if it is nonzero (beast-out unavailable/already handled) the function
  does nothing. When r7 is chip id 0xA or 0x16 (the two beast-out forms), it fills fields of the record
  at r4+0x60: byte+0x00 = 8, byte+0x0C = 9, byte+0x04 = 1 - [r5,#0x30] (inverting the beast-form selection
  flag, so the record mirrors which form is active), and byte+0x07 = 1. It then unconditionally (after
  those checks, still guarded by the +0x10 flag) writes byte+0x03 = 0xB and byte+0x0E = 0x7, which look
  like state/display codes for the entry. It is called exactly once from battle_initChipSelectTurn_8027E2C,
  which also updates the beast-out counter, supporting the beast-out interpretation.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#0x10]; bne locret — whole body skipped when the beast-out availability flag is
    set; cmp r7,#0xA / #0x16 — only the two beast-out chip ids receive the +0x00/+0x0C/+0x04/+0x07 fields;
    sub r0,#1,r2 with r2=[r5,#0x30] stored at +0x04 — mirrors the Gregar/Falzar form-selection flag; caller
    battle_initChipSelectTurn_8027E2C ''initializes chip-select active-state, updates beast-out counter''
    — matches scope; record written at r4+0x60 with fixed offsets 0,3,4,7,0xC,0xE, like one entry of the
    12 active-chip records'
