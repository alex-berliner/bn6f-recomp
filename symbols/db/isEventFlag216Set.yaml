name: isEventFlag216Set
address: '0x080AA7C0'
kind: function
status: confirmed
summary: Returns in r0 whether story/event flag 216 (bank 2, index 0x16) is currently set.
interface: void isEventFlag216Set(void) -> r0 = 1 if flag set else 0; r4 preserved (passed through); Z clear when
  the flag is set on return (from TestEventFlagFromImmediate)
details: Tiny wrapper around TestEventFlagFromImmediate for one specific story/event flag. The "movflag EVENT_216"
  pseudo-op resolves to flag bank 2, index 0x16 (event flag 216), which is loaded into r0/r1 before the call; TestEventFlagFromImmediate
  leaves Z clear when the flag is set, so the wrapper does beq on "not set", materializes r4 = 1 when set or 0 when
  not, and returns it in r0. r4 is only borrowed as scratch but is pushed/popped, so callers' r4 is preserved unchanged.
  Clobbers r1, r3, lr and the flags; the contract shows callers ignore r1/r3 and read r0. Typical of a small check
  used by event/NPC cutscene scripts or battle setup code gating progress on flag 216.
