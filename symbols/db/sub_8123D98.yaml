name: sub_8123D98
address: '0x08123D98'
kind: function
status: confirmed
summary: Refreshes one spawn slot in a battle-object array, decrementing its tier and looking up the next entry
  via sub_811FAF4 when the tier runs out.
interface: void battle_refreshSpawnSlot(u32 page /*r0*/, u32 offset /*r1*/, u32 table_idx /*r2*/, u32 slot_off /*r3*/,
  u32 fwd_r3 /*r4*/, void *base /*r5*/, u32 fwd_r4 /*r6*/); // preserves r4-r7, no register outputs, clobbers flags
details: 'Operates on a byte inside an object array at r5, addressed by slot_off (r3); the byte is packed as (tier
  << 4) | kind. Builds a 32-bit descriptor for sub_811FAF4 as (page << 16) | (offset + 16 * weight), where weight
  is a u16 read from base + table_idx (0 when table_idx is 0, i.e. "no shift"), and calls sub_811FAF4 with the constant
  argument pair 0x20005 (r1=0x20005) plus the slot''s kind nibble and two forwarded context values (r4 -> r3, r6
  -> r4). Afterwards: if the old tier nibble was 1, calls sub_8120CC8 with the lookup result and the table at dword_81233D4
  (off_8123E04) and stores the returned byte directly into the slot (refill), using its r1 as the new tier; otherwise
  the new tier is old_tier - 1. Finally the (possibly refilled) slot byte is re-read and rewritten as (existing
  low nibble) | (new_tier << 4). So each invocation drops the slot one tier, and tier 1 is the last level before
  an automatic refill from the follow-up table. The preserved r4 is passed through and restored by the adapter because
  the sub_811FAF4 call clobbers it internally.

  '
