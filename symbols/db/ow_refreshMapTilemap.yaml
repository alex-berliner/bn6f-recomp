details: 'A tiny wrapper: it loads the fixed pointer unk_2026404 into r0 and immediately calls ow_blitTilemapBlockAndRedraw,
  which copies a 34x100-halfword tile block into the overworld tilemap buffer at an offset and redraws
  the tilemap around the camera. unk_2026404 is therefore most likely a parameter/state struct holding
  the source data, destination offset, and blit dimensions. The function then returns 0 in r0. Its pushed
  r4-r7 are unused, suggesting a standard prologue kept for alignment or uniformity. With no known callers,
  whether this is an init-time full map load or a mid-game refresh (e.g. after a warp or map change) is
  not visible here.'
