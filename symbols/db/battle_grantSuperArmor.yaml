name: battle_grantSuperArmor
address: '0x08014746'
kind: function
status: probable
summary: Sets the Super Armor ObjectFlags1 bit on a battle object so it cannot be flinched/knocked back.
interface: (r0 = ignored, r1 = battle object ptr) -> r0 = void; sets bit OBJECT_FLAGS_SUPERARMOR_BIT in
  the object's ObjectFlags1
details: Discards the incoming r0, computes 1<<OBJECT_FLAGS_SUPERARMOR_BIT, and tail-calls object_setFlag1
  to OR that bit into the object's CollisionData ObjectFlags1 word; the object pointer is passed through
  in r1. Super Armor in MMBN means the object keeps acting through hit-stun/knockback. It is a one-flag
  wrapper over object_setFlag1 with the flag baked in, so callers need only pass the object. No callers
  are known, so its trigger context (custom power, battle chip effect, etc.) is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#1; lsl r0,#OBJECT_FLAGS_SUPERARMOR_BIT builds the Super Armor mask (sub_8014746); bl
    object_setFlag1, whose known behavior ORs flag bits into the object's ObjectFlags1; incoming r0 is
    overwritten before the call, so the object must arrive in r1
  refs:
  - bn6f/asm/asm00_2.s:13348
  - 0x0801A152 object_setFlag1
