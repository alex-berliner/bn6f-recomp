name: battle_setupBackgroundAssets
address: '0x08080DEA'
kind: function
status: probable
summary: 'Loads the battle background for the current battle-background id: installs BG scroll callbacks,
  ORs DISPCNT bits, and loads the BG anim data plus the GFX animation script set for that background.'
interface: (r0 = none) -> r0 = none; obtains bg id from sub_808137C, r4 = id
details: 'sub_808137C returns an index (likely the battle-background id) that selects into four parallel
  tables: off_8080E34 holds per-id scroll/HBlank callback triples passed to SetBGScrollCallbacks; entry
  #0xC of each record is ORed into the current frame''s DISPCNT via Get/SetRenderInfoLCDControl; off_8080F98
  holds per-id BGAnimData pointers (mostly targeting BG VRAM 0x6000020 with 0x800 size and shared palette_3001960,
  some with null palette); off_8081220 is a NULL-terminated array of GFXAnimScript pointers whose entries
  match the same 22 ids, passed to LoadGFXAnims. It then calls sub_803537C (re-arms event flag 0x28 by
  map group) and battle_loadDeathAnims_8035424 (loads the alternate ''Death'' GFX anim set at battle setup
  when the event flag is set). The 22-entry table size and the battle-setup death-anim loader strongly
  indicate this runs during battle initialization.'
