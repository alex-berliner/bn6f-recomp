name: battle_runStartAnimFrame
address: '0x08033AB0'
kind: function
status: probable
summary: 'Per-frame dispatcher called once per battle-start animation tick: queues one OAM entry, conditionally
  draws the battle-start overlay, and advances the chip-slot gfx/spin SFX.'
interface: (r0 = self object, passed through to callees; r1 = frame-index/0 flag per callee) -> r0 = last
  callee's return; no meaningful flags
details: A tiny dispatcher run once per frame (self at $r5, frame counter at [self+5] drives the OAM frame
  table). It first queues one OAM entry via sprite_queueOamByFrameIndex with r0=0, then conditionally
  draws the battle-start overlay tilemap/sprite, then advances the chip-slot animation (tile cycling through
  VRAM 0x06017400 with HBlank DMA and spin SFX 0x9A). All three callees receive the same self pointer
  (r0=0 here is actually reset before each call, so the callees likely read the object from a register
  or the comment's $r5). The combination — periodic OAM frames + start overlay + chip slot spin — matches
  the intro sequence shown when a battle begins, as seen in the beastop recorded route.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_queueOamByFrameIndex_8033B80 with r0=0: queues one OAM entry per call from a 0x18-entry
    frame table indexed by [r5+5]; bl battle_drawBattleStartOverlay_8033F80: DMA-loads battle-start overlay
    and queues its OAM on a game-state flag; bl updateChipSlotGfx_8033C68: cycles chip-slot tiles in VRAM
    0x06017400 and plays spin SFX 0x9A on cooldown; no branches of its own: pure sequence of three per-frame
    draw callees, consistent with an intro-animation frame tick; recorded route ''beastsp'' executes it,
    matching a battle-scene intro phase'
