open_questions:
- What subscribes to byte 1 of eStruct203F7D8 (the "step" / E_STEP_VALUE field) — which consumer treats values other
  than 2 and 4 specially?
- What is the meaning of the two 0x10-byte buffers copied from eStruct2036780 to unk_20399F0 / unk_2039A00 (animation
  tables? collision tables? per-step data?).
- Why does sub_8144D04 need to be polled twice with args 0 and then 3 — is this a "confirm-then-commit" handshake
  and what do 0 vs 3 mean to that routine?
- Is EVENT_172D a tutorial/story gate that unlocks the player-driven bus/deck selection path, with sub_803DEB4 picking
  the destination and 4 marking the "in transit" state?
- Why is byte 1 redundantly loaded back after being stored in two places (mirroring the GBA store-buffer behavior
  or a defensive flush)?
