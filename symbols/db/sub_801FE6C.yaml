name: sub_801FE6C
address: '0x0801FE6C'
kind: function
status: hypothesis
summary: Single step of the battle-effects transition driver that advances the per-step state byte at eStruct203F7D8+1,
  initializing two 0x10-byte buffers on first call and otherwise branching on EVENT flag 0x172D and bit 0x8 of the
  battle-effects word, optionally committing E_STEP_BUSY after a two-call handshake with sub_8144D04(0,3).
interface: void next_801FE6C(void); // uses r8 r9 r10 r11 r12 lr on input; clobbers nz, c, v, r0 r1 r2 r3 lr; preserves
  r4 r5 r6 r7
details: "Operates on a tiny 2-byte engine struct at eStruct203F7D8:\n  - byte 0: \"initialized\" flag (0 on first\
  \ entry triggers the two CopyWords init)\n  - byte 1: \"step\" byte (saved into r6 at entry, overwritten with\
  \ E_STEP_DEFAULT=2)\nTwo 0x10-byte default blobs are copied from eStruct2036780 to unk_20399F0 and unk_2039A00\n\
  on the first call only.\nOn subsequent calls the routine branches on EVENT_172D:\n  - Clear: if GetBattleEffects\
  \ bit 0x8 is set, restore the saved step (the original also\n    redundantly reloads it back); else write sub_803DEB4()\
  \ as the new step.\n  - Set:  restore the saved step first, then bail out unless it is still E_STEP_DEFAULT\n\
  \    AND GetBattleEffects bit 0x8 is set. If so, run a two-call handshake: sub_8144D04(0)\n    and sub_8144D04(3);\
  \ if both return 1 the step stays at E_STEP_DEFAULT, otherwise it\n    is committed to E_STEP_BUSY=4.\nThe eStruct203F7D8+1\
  \ byte therefore walks 2 (idle) -> either a sub_803DEB4-chosen value\nor 4 (busy), and is the state machine field\
  \ the surrounding battle/transition code polls.\nAll external callees (TestEventFlagFromImmediate, GetBattleEffects,\
  \ sub_8144D04,\nsub_803DEB4, CopyWords) are touched via raw register forms with no typed signatures yet.\n"
