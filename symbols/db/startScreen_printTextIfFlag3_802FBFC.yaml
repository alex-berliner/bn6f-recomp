name: startScreen_printTextIfFlag3_802FBFC
address: '0x0802FBFC'
kind: function
status: confirmed
summary: On the title/start screen, if the screen's state field has bit 3 set, hands a two-entry text/sprite descriptor
  table to the text printer helper sub_8001158.
interface: void startScreen_printTextIfFlag3_802FBFC(const StartScreen *screen /* r5 */)
details: 'Reads the halfword at screen+0xA (a state/flags field of the start screen object in r5) and tests bit
  3 (0x8). If the bit is clear the function returns immediately without doing anything. If the bit is set, it loads
  the address of byte_802FC14 (a table embedded right after the function) into r0 and tail-calls sub_8001158, a
  text-printing/drawing helper. The table at byte_802FC14 holds two 8-byte entries followed by zeros: entry 0 =
  {0x808E4014, 0x00007210}, entry 1 = {0x408E4024, 0x00007218}, then two zero words terminating the list. The 0x808Exxxx
  values look like pointers/tags into ROM-resident graphics or text data and 0x72xx like parameter words, so this
  is most likely "print the label/text image associated with the current start-screen state" — e.g. showing a menu
  caption or version text once the state machine reaches the phase marked by bit 3. r2/r3, the carry and overflow
  flags (and nominally r5-r7) are whatever sub_8001158 leaves behind when it actually runs; on the early-exit path
  r2/r3 and flags are simply the caller''s values passing through. The function is effectively a tail call (pop
  {pc} after the bl only executes on the early-exit path).

  '
