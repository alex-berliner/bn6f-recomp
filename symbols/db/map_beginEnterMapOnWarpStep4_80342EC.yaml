name: map_beginEnterMapOnWarpStep4_80342EC
address: '0x080342EC'
kind: function
status: confirmed
summary: Main-flow step 4 that kicks off the "enter map" transition after a warp — clears video, programs the fade-in,
  and triggers map entry.
interface: void sub_80342EC(void); // r10 = toolkit pointer on entry; calls into sub-steps with r0 = gameState,
  r1 = 0x10
details: 'Part of the main jumptable state machine: writes 4 to the byte pointed to by

  toolkit->MainJumptableIndexPtr so the flow resumes at step 4 (the enter-map step).

  Then resets the video state for the new scene: zeroFillVRAM() and ZeroFillGFX30025c0()

  (the tile GFX pool at 0x030025c0). On gameState it sets EnterMapFadeParam1 = 0 and

  EnterMapFadeParam2 = 0x10 — the fade-in parameters used when arriving on the new map.

  Calls map_triggerEnterMapOnWarp_8005C04(gameState, 0x10) to run the warp-entry logic

  (loading/entering the destination map), then navi_80340F6(gameState) as the navi update

  step. Quirk: the toolkit pointer is passed via r10; the function copies it to r7 and the

  callees read it from there (the code reloads r10 into r7 around each call). navi_80340F6

  is called with r0 explicitly reset to gameState in case the previous call clobbered it.

  '
