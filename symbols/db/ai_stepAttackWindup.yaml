name: ai_stepAttackWindup
address: '0x080F422C'
kind: function
status: probable
summary: 'Per-frame tick of an enemy AI attack: starts a windup (element, animation, counter window, 20-frame
  timer) on the first call, then counts down and flags the hit phase.'
interface: (r5 = battle object, r7 = oAIAttackVars; no meaningful r0 input) -> r0 = clobbered; sets oAIAttackVars_HitElement
  = 0x14 when the timer expires
details: 'State machine keyed on oAIAttackVars_AttackElement: if it is 0 (idle), the attack begins — AttackElement
  is set to 4 (wood), the object''s CurAnim is set to 0x12, object_setCounterTime(0xC) opens a 12-frame
  counter window, and StepTimer is seeded with 0x14 (20 frames). On later calls it decrements StepTimer
  each frame; once it reaches 0, HitElement is written with 0x14, presumably signaling another routine
  to resolve the attack''s hit. The idle-check/branch structure means the function is only safe to call
  while the attack vars belong to this object''s pending attack.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/tst on [r7,#oAIAttackVars_AttackElement] with bne splits idle-start vs countdown phases
    (0x80F4230-0x80F4248); start branch writes AttackElement=4, CurAnim=0x12, and calls object_setCounterTime(0xC);
    countdown branch decrements [r7,#oAIAttackVars_StepTimer] and bgt-loops until it hits zero; on expiry
    it stores 0x14 into [r7,#oAIAttackVars_HitElement], the only output consumed elsewhere
  refs:
  - bn6f/asm/asm31.s:128790
  - 0x0800E9DC object_setCounterTime
  reproduce: python3 tools/asmcat.py 0x080F422C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-203615'
coverage:
- battlesweep
open_questions:
- No callers are known, so which enemy/boss AI invokes this (and thus which attack anim 0x12 is) is unconfirmed
- The exact meaning of HitElement = 0x14 and which downstream code consumes it is unknown
- Whether element value 4 really means wood in this table needs the element enum confirmed
