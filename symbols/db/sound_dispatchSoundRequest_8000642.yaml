name: sound_dispatchSoundRequest_8000642
address: '0x08000642'
kind: function
status: confirmed
summary: Looks up a sound handler by sound id in a table and hands it, with its arguments, to the sound dispatcher
  sound_8000808 via the shared callback sub_814F9AC.
interface: void sound_dispatchSoundRequest(u8 idx /* r0 */, u32 a1 /* r1 */, u32 a2 /* r2 */); returns caller's
  r10 in r3, passes c/v through from sound_8000808
details: 'Entry point of the sound-request path. The sound id in r0 is scaled by 4 and used to index the handler
  pointer table at off_8000704 (thumb entry, so index 0 selects the word at 0x08000704). The fetched handler address
  goes in r0; r1 and r2 are forwarded untouched as the handler''s two parameters. r3 is loaded with the Thumb pointer
  sub_814F9AC|1, a shared sound routine that the dispatcher (sound_8000808) invokes with or alongside the handler.
  Before the call the function saves r4-r7 and lr, and it smuggles the caller''s r10 through the call: r10 is pushed,
  popped into r3 after the call, then re-copied into r10, so on return r3 holds the caller''s original r10 while
  r10 is restored too. The final register moves do not set flags, so c/v from sound_8000808 pass through to the
  caller. r4-r7 are preserved across the call despite sound_8000808 being able to clobber them. Only r0/r1/r2 (as
  inputs) and nz are consumed; r3 is written (returned) and r0/lr are clobbered internally.

  '
