name: object_stepUpdateByVelocity
address: '0x080D1EF2'
kind: function
status: confirmed
summary: Advances a battle object one step by its velocity, bouncing at the target column or steering toward the
  target panel depending on its X velocity.
interface: Next object_stepUpdateByVelocity(void) — object in r5, battle context in r10 (read-only); returns the
  (possibly changed) object in r5; clobbers r0-r3, lr and flags
details: 'Per-frame movement step for a battle object (r5, oBattleObject fields). First calls

  sub_80D1F0E, the common pre-step work; it may relocate the object and returns possibly

  different r0/r1 values plus an updated r5 object pointer, which are passed through to

  the movement helpers. It then reads oBattleObject_XVelocity: if zero, it calls

  object_bounceAtTargetColumn (bounce behavior at the object''s target column); otherwise

  object_stepRedirectTowardTargetPanel (steer the step toward the target panel). Finally

  sub_80D1FD8 finishes the step and returns the possibly changed object, and

  battleObject_updateDirectionFlip updates the object''s horizontal flip to match its

  movement direction. r10 (battle context) is untouched and only passed through to callees.

  The r0/r1 values produced by the pre-step are consumed by the movement helpers, so the

  pre-step and the branch helpers form one contract; their exact meaning is not yet typed.

  '
