name: object_stepUpdateByVelocity
address: '0x080D1EF2'
kind: function
status: probable
summary: 'Per-frame update for a moving battle object: runs a common step, then dispatches to one of two
  handlers based on the object''s XVelocity, then a final step.'
interface: (r0/r5 = battle object) -> r0 = ?; flags set by oBattleObject_XVelocity compare
details: 'Takes the current battle object (r5 holds it across the calls, matching the caller object_updateMoveStep).
  First calls sub_80D1F0E unconditionally. It then loads oBattleObject_XVelocity and compares to 0: if
  zero it calls sub_80D1F68, otherwise sub_80D1FA0, so the XVelocity field selects between two alternative
  per-frame behaviors (plausibly vertical vs. horizontal movement handling). Finally it always calls sub_80D1FD8
  before returning, a common tail step (likely collision/animation/cleanup). The function itself allocates
  nothing and touches no fields directly besides reading XVelocity; all work is delegated. It is a dispatcher
  layer of the object''s update chain, one frame of the slide-toward-target-panel behavior driven by Timer2
  in the caller.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r2,[r5,#oBattleObject_XVelocity]; cmp r2,#0; bne loc_80D1F04 — velocity field selects the
    branch; bl sub_80D1F0E before the branch — common per-frame preamble for the object; bne picks sub_80D1FA0
    else sub_80D1F68 — two mutually exclusive per-frame handlers; bl sub_80D1FD8 after both paths — unconditional
    common tail step; caller object_updateMoveStep 'slides a battle object toward a target panel over
    Timer2 frames' confirms per-frame object update context
