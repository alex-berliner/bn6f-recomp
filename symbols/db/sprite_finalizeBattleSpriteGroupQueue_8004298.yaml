summary: Flush the queued sprite group and record its palette count into the third slot of the sprite
  palette counter array.
interface: ()
details: "The function is a tiny leaf. It loads r0 = 3 and tail-calls sub_80028C0, whose contract\n  documents\
  \ it as \"Record the sprite palette count (dword_200F340) in slot r0 of\n  byte_200F389, after each\
  \ sprite group is queued.\" So this routine is the explicit\n  \"queue group 3\" / finalizer step: it\
  \ stamps the palette-count snapshot taken at\n  dword_200F340 into byte_200F389 + 3 (i.e. the third\
  \ group slot) and returns via\n  `pop {pc}`. The dead instructions after the pop (`mov r0, #0x30` /\
  \ `ldr r3,\n  off_80042BC` / `thumb_func_end`) are disassembler padding from a code-pool constant\n\
  \  pool / next routine and are not executed.\n\n  r0 carries the literal group index (3); r1..r3 are\
  \ passed through (in the captured\n  frames r1=4, r2=0x0200f389, r3=1, but those are caller-specific\
  \ and unused by this\n  routine — they belong to the parent queuing logic). No caller-visible return\
  \ value:\n  r0 is written (to 3 on entry, then clobbered by sub_80028C0), but the contract\n  lists\
  \ `out=[]`, meaning callers don't rely on what comes back. It's effectively a\n  void tail-call used\
  \ by the per-frame battle/object/scene tickers (see callers\n  list) at the point where the third batch\
  \ of sprites has been queued and the\n  palette counter should be sealed.\n"
