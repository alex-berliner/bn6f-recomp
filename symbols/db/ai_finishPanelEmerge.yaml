name: ai_finishPanelEmerge
address: '0x080153EC'
kind: function
status: probable
summary: 'Completes an AI-controlled object''s emergence onto its reserved target panel: commits panel
  coords, updates collision/sprite, clears invulnerability, and advances the AI attack state.'
interface: (r5 = battle object, r7 = oAIAttackVars of the AI attack state) -> void; r0 = 4 (HitElement)
  on return
details: Sets AIData 0x48 flag bits 0x80000 via SetAIDataUnk0x48Flag, then copies FuturePanelX/FuturePanelY
  into PanelX/PanelY, releasing the previously reserved panel (object_removePanelReserve). Recomputes
  the object's coordinates and collision panels, ends post-hit invulnerability, and stores battle_checkEmergeDirectionFlip's
  result into DirectionFlip, refreshing the sprite and arm position. Clears the charged/PwrAtk state and
  resets the animation frame from AIData_AIScriptOffset. If RelatedObject2Ptr is set, it writes Param3=1
  and ORs flag 0x14 into that object's header flags. Finally it writes step timer 6 and HitElement 4 into
  the oAIAttackVars at r7, advancing the attack sequence to its next step.
