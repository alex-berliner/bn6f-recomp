name: ai_woodAttackStep
address: '0x080F5208'
kind: function
status: probable
summary: 'AI attack step for a self-damaging wood-element attack: on first call it sets up the attack
  and commits the object to its future panel, then counts 15 frames before registering the hit element.'
interface: (r5 = battle object, r7 = object's oAIAttackVars; no register args) -> r0 clobbered; sets AttackElement=4,
  CurAnim=7, StepTimer, HitElement
details: 'If oAIAttackVars_AttackElement is still 0, it initializes the attack: sets AttackElement to
  4 (wood), plays animation 7, and calls object_updateCollisionData with damage params (1, 2, 3). It then
  copies the object''s DamageAndStaminaDamageCounterDisabler into its own CollisionData as SelfDamage
  and the StaminaDamageCounterDisabler byte, making the attack hurt the user as well. It commits the movement
  by copying FuturePanelX/Y into PanelX/Y, releases the reserved panel via object_removePanelReserve,
  recomputes pixel coordinates, syncs collision panels, clears ObjectFlags1 bit 0x40 (likely invulnerability/timed
  flag), and sets StepTimer to 15. On subsequent calls it decrements StepTimer, and when it reaches 0
  it writes HitElement = 0x14 (20) to trigger the hit phase.'
