  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — first-vs-repeat detection on the AI attack-vars
    struct; mov r0,#4; strb [r7,#oAIAttackVars_AttackElement] plus strb #0x14 to oBattleObject_CurAnim
    — fixed element/anim chosen at init; ldrh [r7,#oAIAttackVars_AttackDuration] strh [r7,#oAIAttackVars_StepTimer]
    then decrement-until-zero loop — frame-countdown behavior; bl object_exitAttackState_801171C on timer
