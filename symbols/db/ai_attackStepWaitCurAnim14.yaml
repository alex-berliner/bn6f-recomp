name: ai_attackStepWaitCurAnim14
address: '0x08105A72'
kind: function
status: probable
summary: AI attack step that initializes a timed pause (element 4, anim 0x14, timer = AttackDuration)
  and, once the timer expires, tears the battle object's attack state down via object_exitAttackState.
interface: (r7 = oAIAttackVars of active object, r5 = oBattleObject) -> r0 = unused; no flags
details: On first entry (oAIAttackVars_AttackElement == 0) it stamps the attack element to 4, switches
  the object's CurAnim to 0x14, and loads oAIAttackVars_StepTimer from oAIAttackVars_AttackDuration —
  the 'wait N frames' setup of an AI attack step. On subsequent calls it decrements StepTimer each frame;
  when it hits zero it calls object_exitAttackState_801171C to clear the attack vars, chip lockout, AI
  flags and power-atk state, ending the attack. r7 and r5 are inherited scratch registers from the enclosing
  AI attack-step dispatcher, so this is one case of that state machine.
