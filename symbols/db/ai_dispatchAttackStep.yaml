name: ai_dispatchAttackStep
address: '0x08111A00'
kind: function
status: confirmed
summary: Trampolines to the per-step handler for the AI's current attack state, chosen by the AI attack vars' HitElement
  field via a jump table.
interface: void ai_dispatchAttackStep(void); // r7 = pointer to AI attack vars (oAIAttackVars struct), r5/r6/r10
  forwarded to the handler; lr clobbered, tail-pops to the handler instead of returning to the caller
details: 'Reads the byte at [r7, oAIAttackVars_HitElement] and uses it as an index into the jump

  table at off_8111A14 (built from the pointer stored at off_8111A10), then branches to the

  selected handler with lr = pc so the handler''s own return goes straight back to

  ai_dispatchAttackStep''s caller (pop {pc} on the handler''s side, effectively). The five

  entries are: ai_commitMoveAttack, sub_8111A72,

  battleObject_performMovementStep_8111A8C, ai_animEndResetAttack, and

  aiAttack_tickAiAttackVarsTimer_81097DC - i.e. the states of an enemy AI attack

  (committing a move attack, an unknown step, a movement step, attack animation end/reset,

  and a timer tick for attack vars). Quirk: the handler is entered with r0 = HitElement and

  r1 = the handler''s own address (left over from the "ldr r1, [table, r0]" load), and with

  the caller''s r5/r6/r7/r10 still live; outputs r1/r5/r8-r12 are produced by the chosen

  handler, not by this function. The two padding bytes after pop {pc} keep the table aligned.

  Because it is an indirect dispatch, the register contract is really the union of the five

  targets'' contracts.

  '
