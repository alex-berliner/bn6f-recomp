  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_HitElement] then ldr r1,[r1,r0] with table off_8111A14: index-driven
    dispatch on the AI attack vars struct; jump table entries are all AI attack handlers (ai_commitMoveAttack,
    battleObject_performMovementStep, aiAttack_tickAiAttackVarsTimer); only caller ai_setupAttackPlan
    runs it each AI turn after filling the AI attack variables, consistent with kicking/ticking the attack
