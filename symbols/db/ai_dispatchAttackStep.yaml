name: ai_dispatchAttackStep
address: '0x08111A00'
kind: function
status: probable
summary: Dispatches the per-enemy AI attack state machine to one of five handlers based on the current
  attack-step byte in the AI attack vars.
interface: (r7 = AI attack vars struct) -> jumps to handler from off_8111A14[state]; no return value of
  its own
details: 'Loads the byte at oAIAttackVars_HitElement from the r7 AI attack vars struct and uses it as
  a table index (bounds implicitly limited to 0-4 by the writers). It then tail-calls the matching handler:
  0 = ai_commitMoveAttack, 1 = sub_8111A72, 2 = battleObject_performMovementStep, 3 = sub_8111AEC, 4 =
  aiAttack_tickAiAttackVarsTimer. It is a pure trampoline with no other state manipulation. The reused
  HitElement field here evidently serves as the attack sequence''s state/step counter.'
