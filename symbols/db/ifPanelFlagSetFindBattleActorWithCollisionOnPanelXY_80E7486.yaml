name: ifPanelFlagSetFindBattleActorWithCollisionOnPanelXY_80E7486
address: '0x080E7486'
kind: function
status: confirmed
summary: Find the battle actor standing on the given panel only if that panel carries a specified flag bit, scanning
  the eight alive-actor slots of the battle state.
interface: "u32 findAliveBattleActorOnPanelByFlag_80E7486(\n    u32 panelX,         // r0\n    u32 panelY,     \
  \    // r1\n    u32 flagSelector,   // r2, index into byte_80E74C4 (entry <<2, value 0x200000 / 0x400000)\n  \
  \  u32 *toolkitR10     // r10, hosts the battle state\n);\nreturns: r0 = matching BattleActor* (or NULL),\n  \
  \       r1 = flagMask on flag-clear path, else last-examined oCollisionData_PanelXY,\n         r3 = alive-actor\
  \ slot ptr (only on flag-set path; unchanged on flag-clear path)\nclobbers: nz, c, v; preserves r4, r6, lr.\n"
details: 'Packs (Y<<8)|X into a panel word, asks object_getPanelParameters for that panel''s

  parameter word and masks it with one of two panel-flag bits from byte_80E74C4

  (0x200000, 0x400000). If the flag is clear, returns NULL with r1 = the flag mask and

  leaves the toolkit/BattleState walk unstarted. Otherwise scans

  battleState->aliveBattleActors[8]; an empty slot is skipped; a non-empty slot that has

  a non-NULL oBattleObject->oCollisionData is read and its oCollisionData_PanelXY

  compared against the packed (Y<<8)|X. The first actor whose collision-panel matches

  is returned with r0 and r3 = the live-actor slot pointer. Returns NULL with

  r3 = one-past-the-end slot when no actor matches. Reads oToolkit_BattleStatePtr,

  oBattleState_AliveBattleActors (8 slots, 4 bytes each), oBattleObject_CollisionDataPtr,

  oCollisionData_PanelXY. Likely called by scripted "if an actor is on a panel of type

  X" battle-event conditions.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
