name: battleObject_throwArcingMoveUpdate_80FEEB8
address: '0x080FEEB8'
kind: function
previous_names:
- sub_80FEEB8
status: probable
summary: Advances one frame of an AI-launched throw/arc move (e.g. cannon/anchor) for the battle object
  in r5, integrating velocity, decaying Z velocity, and finishing by snapping the object to its destination
  panel and marking it currently-moving.
interface: '(r5 = battleObject, r7 = aiAttackVars) -> void ; side effects: writes r5 object X/Y/Z/Velocities,
  PanelX/Y, FuturePanelX/Y, Z16, CollisionData flags/region, and r7 Unk_01/Unk_00/Unk_10'
details: '- State byte at oAIAttackVars_Unk_01 gates a two-phase machine: 0 -> throw-init, non-zero ->
  per-frame integration.

  - Phase 0 (tst r0,r0 / bne): sets Unk_01=4, Unk_10=0x1e (30), reads r5->FuturePanelX/Y, calls object_getCoordinatesForPanels
  to get target pixel coords, then math_getThrowSpeeds(r0=panelX,r1=panelY,r2=0,r3=0,r4=Unk_10,r6=0xFFFF6000,
  accel/throw params) to compute initial XVelocity/YVelocity/ZVelocity which are stored back. r0 passed
  to math_getThrowSpeeds is r5+0x34 (X field), aligning the integrator origin to current X.

  - Phase 1 (loc_80FEEEA): adds XVelocity/YVelocity to X/Y and ZVelocity to Z, then subtracts 0xA000 (the
  0xFFFF6000 delta) from ZVelocity each frame, applying gravity-like decay via object_setPanelsFromCoordinates
  / object_updateCollisionPanels.

  - Each tick decrements Unk_10; once it underflows (bge not taken), the object is snapped: FuturePanelX/Y
  copied to PanelX/Y, object_removePanelReserve releases the destination, object_setCoordinatesFromPanels
  re-anchors pixels, Z16 cleared, collision refreshed, OBJECT_FLAGS_CANNOT_SLIDE (0x40) cleared, OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT
  (1<<19 = 0x80000) set via object_setFlag1, collision region set to 1, and Unk_00 set to 8 (probably
  next AI state index). The gravity constant 0xFFFF6000 == -0xA000 in 16.16, matching Mega Man Battle
  Network''s per-frame gravity for arc chips.

  - r7 is the AIAttackVars block (offset inside AIData+0xA0..+0xF0), used to drive the timer/state of
  the attack sub-phase.

  '
