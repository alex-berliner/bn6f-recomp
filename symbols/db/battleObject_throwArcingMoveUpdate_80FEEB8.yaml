- method: assembly-reading
  date: '2026-10-14'
  detail: '- ldrb/strb r0,[r7,#oAIAttackVars_Unk_01] and oAIAttackVars_Unk_10 at loc_80FEEE0 identify
    r7 as AIAttackVars. - ldrb FuturePanelX/Y then object_getCoordinatesForPanels shows the destination
    panel is the throw target. - bl math_getThrowSpeeds with r6=0xFFFF6000 (dword_80FEF4C) and r4=Unk_10=0x1e
    shows classic BN arc-throw init; storing r0/r1/r2 into XVelocity/YVelocity/ZVelocity confirms it.
    - loc_80FEEEA subtracts 0xFFFF6000 (i.e. adds 0xA000) from ZVelocity each frame, the canonical per-frame
    gravity for arc chips in BN. - Termination path: object_removePanelReserve, FuturePanel->Panel copy,
    setCoordinatesFromPanels, Z16=0, updateCollisionPanels, clearFlag(0x40)/setFlag1(1<<CURRENTLY_MOVING_1_BIT)
    and setCollisionRegion(1) match the standard "throw landed" finish. - OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT==19
    -> 1<<19==0x80000; "mov r0,#1; lsl r0,r0,#OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT" produces exactly 0x80000.'
