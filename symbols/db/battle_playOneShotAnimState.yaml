name: battle_playOneShotAnimState
address: '0x080C025C'
kind: function
status: probable
summary: 'Battle-object state handler: gated by sub_80C031E, on first entry sets CurPhase=4, Timer=0,
  CurAnim=0x21; on tick 2 plays SFX 0x17B; checks frame-end flag (0x80) via sprite_getFrameParameters
  and resets Timer/CurAction/CurPhase to 0.'
interface: (r5 = battle object) -> r0 = destroyed; no meaningful return; side effects on object fields
details: Reads the object at r5 (no argument register setup, so it is invoked with the object preloaded
  in r5, likely as a state-handler). First calls sub_80C031E and bails if it returns 0 (probably 'not
  this object's turn/active'). On first entry (CurPhase == 0) it sets CurPhase = 4, Timer = 0 and CurAnim
  = 0x21. Each tick it increments Timer and, when Timer hits 2, plays sound effect 0x17B (0x7C + 0xFF).
  It then calls sub_80C02F8 and sprite_getFrameParameters; if the frame's attribute byte has bit 0x80
  set (animation-end flag) it resets Timer, CurAction and CurPhase to 0, handing the object back to its
  idle/default behavior.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'entry block: CurPhase 0 -> phase 4, Timer 0, CurAnim 0x21 (one-shot state init); cmp r0,#2
    / PlaySoundEffect(0x7C+0xFF=0x17B) fires the sound exactly once two ticks in; sprite_getFrameParameters
    + tst bit 0x80 is the standard animation-finished test; on anim end: Timer/CurAction/CurPhase all
    cleared to 0, i.e. return to idle state; uses r5 without setup, so it is a state handler with the
    object pointer already in r5'
