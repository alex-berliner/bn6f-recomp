  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior (state handler gated by sub_80C031E, CurPhase init to
    4, Timer reset, CurAnim 0x21, sound 0x17B on tick 2, sub_80C02F8 + sprite_getFrameParameters end-frame
    check via 0x80 bit, reset Timer/CurAction/CurPhase to 0). However the prefix rules require a ''battle_''
    or ''object_'' style prefix; ''battle_playOneShotAnimState'' fits, but the sound ID is 0x17B, not
    0x7C+0xFF (the add is to 0xFF, giving 0x17B), and the name ''playOneShotAnimState'' is reasonable.
    Minor: the summary says ''idle state'' but the code returns to CurPhase 0 / CurAction 0 without explicit
    idle mention, which is fine.; run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
