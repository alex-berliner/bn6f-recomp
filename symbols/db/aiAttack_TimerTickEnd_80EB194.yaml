name: aiAttack_TimerTickEnd_80EB194
address: '0x080EB194'
kind: function
status: confirmed
summary: Per-frame tick of an AI attack action's countdown; when the timer expires it frees the object to move,
  reloads the timer, resets the animation if told to, and switches the AI state to 0xC.
interface: void aiAttack_TimerTickEnd_80EB194(void)  /* r7 = object's AI attack vars; returns flags in nz/c/v and
  the decremented/reloaded timer value in r0 */
details: "Part of the enemy AI attack state machine. r7 points at the object's AI attack\nvariable block (oAIAttackVars_*).\
  \ Each frame it decrements the halfword timer at\n+0x10 (Unk_10); while nonzero it returns immediately, leaving\
  \ the decremented\nvalue in r0 and the SUBS flags set. When the timer reaches zero:\n  - clears object flag 0x40\
  \ (a \"busy/blocking\" bit) via object_clearFlag,\n  - sets the CURRENTLY_MOVING bit (1 << 19) via object_setFlag1,\n\
  \  - reloads the +0x10 timer from the halfword at +0x18 (Unk_18), i.e. the\n    next cooldown/repeat delay for\
  \ this attack,\n  - calls the AI-layer check sub_80F02A2 and, if it returns nonzero, calls\n    object_setAnimation(0)\
  \ to reset the object's animation,\n  - stores 0xC into the AI attack state field at +0x00 (Unk_00), moving on\
  \ to\n    the next step state.\nQuirk: on the reset path the reloaded timer value is left in r0 when calling\n\
  sub_80F02A2 (and 0xC is left in r0 for the caller at return), matching the\noriginal binary; callers also see\
  \ the nz/c/v flags described above. r4 is\npreserved; r0-r3, r12 and lr are clobbered by the helper calls.\n"
