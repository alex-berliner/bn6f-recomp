open_questions:
- What RenderInfo+0x14 means in game terms (scroll offset, fade/brightness counter, or timer) — needs
  the code that reads that field
- Why the step is exactly 9 and whether callers elsewhere rely on it wrapping or reaching a threshold
- What scene/subsystem 't3' is, to give the field a proper name
