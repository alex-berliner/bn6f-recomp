name: sub_8123360
address: '0x08123360'
kind: function
status: confirmed
summary: Returns whether the currently selected PET navi counts as present for overworld HUD/dialogue behaviour.
interface: bool isPetNaviPresent(Toolkit* r10) -> r0; preserves r4; clobbers r0 r1 r3 lr and flags
details: 'Reads the currently selected navi via GetCurPETNavi() (r0). A navi counts as present when one is selected
  (result != 0) OR the "navi gone" story event EVENT_172A is not set — i.e. even with no navi selected the game
  treats the navi as around unless the story event that removed it has fired. If present, the function then loads
  the GameState pointer from toolkit + oToolkit_GameStatePtr and reads GameState + oGameState_MapGroup: on special
  areas with mapGroup >= 0x80 the result stays TRUE, but on normal maps (mapGroup < 0x80) the result is instead
  the state of event flag EVENT_PET_NAVI_ACTIVE, so the navi only counts as present while that flag is up. Result
  is returned in r0 (TRUE=1/FALSE=0 via r4 scratch). Flag ids are passed to TestEventFlagFromImmediate split as
  high byte in r0, low byte in r1, with "flag set" reported by the Z flag being clear.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
