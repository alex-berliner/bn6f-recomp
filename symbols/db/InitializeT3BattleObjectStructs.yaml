name: InitializeT3BattleObjectStructs
address: '0x08003548'
kind: function
status: confirmed
summary: Thin wrapper that resets/initializes every battle object struct of object type 3 (T3_BATTLE_OBJECT), forwarding
  the caller's arguments unchanged.
interface: void InitializeT3BattleObjectStructs(r2, r3, r4, r7) ; preserves r2, r3, r4, r7 (they are the arguments
  to the callee), clobbers r0, r1, lr, and NZCV flags; returns via the callee's return.
details: 'This function is a one-line trampoline: it loads the object-type constant 3 (T3_BATTLE_OBJECT) into r0
  and tail-calls InitializeStructsOfObjectType, so all structs of that battle-object type get (re)initialized for
  a new battle or battle-phase reset. The actual initialization loop and per-struct field setup live in InitializeStructsOfObjectType;
  this routine''s only job is to select the type-3 object list. Arguments r2/r3/r4 and the preserved r7 are passed
  through untouched, suggesting InitializeStructsOfObjectType takes a parameterized reset (e.g. init values or region
  pointers) supplied by the caller. Being a tail call (pop {pc} after the bl returns), it imposes no additional
  stack frame. The name "T3_BATTLE_OBJECT" type tag is taken from the disassembly''s constant naming.

  '
