name: sub_802BDB4
address: '0x0802BDB4'
kind: function
status: hypothesis
summary: Runs helper sub_802C97E, then stores 4 into the word at r5, likely advancing a battle state/phase counter
  to its next step.
interface: void sub_802BDB4(r4 context?, r5 outStatePtr, r10 work?); writes u32 4 to *r5; returns with NZCV set
  from r0==4 and r0-r3 clobbered (r4, r5 preserved)
details: 'Tiny tail routine: it calls sub_802C97E (which presumably does the real work of finishing the current
  step), then unconditionally writes the constant 4 into the 32-bit word pointed to by r5. The pattern of a shared
  work pointer (r5/r10) plus a small stored value strongly suggests r5 points at a state/step/phase field in a battle
  or task structure, and this function is the "advance to state 4" exit of a larger handler. The NZ flags are set
  as a side effect of loading 4 into r0, and callers'' contract lists them as outputs, so some caller may branch
  on the resulting Z flag, but the value is constant so the outcome is always "non-zero". r4 and r10 are passed
  in per the caller contract but are not referenced in this fragment, so they are most plausibly inputs consumed
  by the sub_802C97E call.

  '
