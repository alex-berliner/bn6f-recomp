summary: 'Initializes a battle object (mystery data variant): sets VISIBLE, copies NameID from its source
  object, loads sprite (using arm-position lookup when Param1==0xff, else Param2), unpacks actor info,
  finishes sprite plumbing (animation, animationData, palette, flip, color shader, Timer2, shadow), then
  transitions to UPDATE and runs the per-frame updater.'
interface: (r5 = this battleObject, r10 = toolkit) -> void (mutates r0..r12/lr, preserves nothing across
  call)
details: "1. Sets ObjectHeader_Flags bit 1 (VISIBLE) on `this` (r5). No callers listed—function appears\
  \ to be reached via an indirect/jump-table or by another function not yet linked.\n2. Branch on Param1:\
  \ 0xff => arm/extra path; otherwise the \"normal\" path.\n   - 0xff branch: copies NameID from RelatedObject1Ptr\
  \ into `this.NameID`, calls enemy_getArmPosition_800F26C to resolve (x,y,?,?,?) into r0/r1, then sprite_load(0x80,\
  \ r0, r1) using those coordinates; reads back NameID, calls unpackVerActorTyAndAIIdx_800F29C, then sub_8010DF6(part2=0)\
  \ and sub_80C4526(RelatedObject2Ptr, 1). Skips over the Param2-based sprite_load at loc_80E331A.\n \
  \  - non-0xff branch: sprite_load(0x80, Param2, Param3) at loc_80E3312.\n3. After sprite_load: Param3\
  \ is copied into both CurAnim and CurAnimCopy, then sprite_setAnimation, sprite_loadAnimationData, sprite_update\
  \ run in that order.\n4. Reads a 4-byte record at this+0x64 (relative to r5+0x64): word0 -> Timer2,\
  \ byte2 toggles shadow (0 => sprite_noShadow; nonzero => sprite_hasShadow, and byte3==0 triggers sprite_removeShadow).\n\
  5. ExtraVars[0x10] -> sprite_setPalette; Param4 -> sprite_setFlip; writes 0 to Timer; ExtraVars[0] ->\
  \ sprite_setColorShader.\n6. Sets CurStateActionPhaseAndPhaseInitialized = CUR_STATE_UPDATE (0x04 in\
  \ low byte, zeroing CurAction/Phase/PhaseInitialized), then falls into battleObject_updateMysteryData_80E336E.\n"
