name: battleObject_initSpriteFromRelatedOrParam2_80E32D8
address: '0x080E32D8'
kind: function
status: confirmed
summary: Initializes a battle object's sprite (from a related enemy or a direct index), sets up animation/shadow/palette/flip/shader,
  then transitions the object to the update phase.
interface: void battleObject_initSprite(u32 r5 /*battle object ptr*/); outputs r5 r8 r9 r10 r11 r12
details: 'r5 points to the battle object being initialized. Sets flag bit 2 on oObjectHeader_Flags to mark the sprite
  as loaded. Two code paths: (1) If oBattleObject_Param1 == 0xFF the sprite is inherited from oBattleObject_RelatedObject1Ptr''s
  oBattleObject_NameID; the arm position is looked up via enemy_getArmPosition_800F26C, the sprite is loaded via
  sprite_load(a1=0x80, a2=nameID, a3=armX), actor-type /AI-index are unpacked, sub_8010DF6 is called with r2=0,
  and extra-vars are set from oBattleObject_RelatedObject2Ptr. (2) Otherwise sprite_load is called directly with
  Param1 as the name ID and Param2 as the sub-index. In both paths the initial animation slot is read from Param3
  and stored to oBattleObject_CurAnim and CurAnimCopy; sprite_setAnimation, sprite_loadAnimationData and sprite_update
  are called. Shadow data at obj+0x64: a 16-bit timer is copied to Timer2, byte+2 selects hasShadow/noShadow, and
  if hasShadow is on but byte+3 is 0 the shadow is removed. Palette comes from ExtraVars+0x10, flip from Param4,
  color shader from ExtraVars[0]. Timer is zeroed and the state machine advances to CUR_STATE_UPDATE before calling
  battleObject_updateMysteryData_80E336E (the next phase).

  '
