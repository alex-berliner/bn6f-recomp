name: spawn_initGuiSpriteEntry
address: '0x08118D84'
kind: function
status: probable
summary: Initializes a type-0x23 sprite object from the GUI resource at unk_20222F0, configuring animation,
  priority, palette and a list-row position before a follow-up setup call.
interface: (r5 = object struct ptr, r6 = context whose +0x20 halfword is a row/list index) -> r0 = 0 via
  tail call to sub_8118DE0; object fields written
details: 'Writes object type 0x23 into [r5] and 4 into [r5+8], then builds the sprite via initGuiSprite_8002770(0x14,
  unk_20222F0). Configures the sprite: animation 0 plus animation data load, no shadow, priority 3, sub-record
  field A = 4, palette bank 5, palette 0, and stores halfword 0x200 into a slot list via slotList_storeHalfwordAndClearField_800306C.
  Positions the sprite with sprite_setCoordinates(0x80, 0x1B + [r6+0x20]*0x14), i.e. fixed x=128 with
  y stepping 20 pixels per index, suggesting one entry in a vertical list/menu. Finally tail-calls sub_8118DE0
  for further (unknown) setup.'
