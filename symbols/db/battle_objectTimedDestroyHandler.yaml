name: battle_objectTimedDestroyHandler
address: '0x080CFC5E'
kind: function
status: probable
summary: Per-frame handler that removes an object's collision data, runs sub_80CFCA8 every 8 frames via
  oBattleObject_Timer2, and when oBattleObject_Timer expires sets collision region 0x80, clears ExtraVars[0]
  if present, transitions to CUR_STATE_DESTROY, then refreshes present-frame collision state.
interface: (r5 = battle object pointer, no args) -> r0 = state on exit; updates oBattleObject_Timer/Timer2,
  collision region, and CurState.
details: First removes the object's collision data (object_removeCollisionData), then decrements oBattleObject_Timer2;
  when it reaches 0 it calls sub_80CFCA8 and reloads Timer2 with 8 frames. It then decrements oBattleObject_Timer;
  at expiry it sets collision region index 0x80 via object_setCollisionRegion, and if oBattleObject_ExtraVars
  points to anything, stores 0 to its first byte. Finally it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized.
  Each frame it ends by refreshing present-frame collision state (object_presentCollisionData). The removal-then-present
  pattern suggests collision data is disabled except for the final frame region 0x80.
evidence:
