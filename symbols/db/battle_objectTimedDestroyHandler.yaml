    handler; Timer expiry writes mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized];
    bl object_setCollisionRegion with r0=0x80 and zeroing *ExtraVars on expiry; Caller battle_objectInitSpawnState
    sets the 100/8-frame timers this function consumes and advances into this phase; bl object_removeCollisionData
    up front and bl object_presentCollisionData at the end bookend the frame's collision work
  refs:
