  reproduce: python3 tools/asmcat.py 0x0811368A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is broadly correct but the proposed name ai_turnChooseAttack is reasonable; however,
    the function flips the branches relative to the proposal: the ''non-attack'' housekeeping path (counter<2
    increment, target lookup, scratch var, attack 0xa, sub_8113330) is the loc_8113700 branch, while the
    counter>=2 branch is the action turn with object_getFlag checks and version-table attacks 9/0xb. The
    summary''s phrase ''sets attack 0xa and calls sub_8113330'' on the housekeeping path is correct, but
    calling it a ''charge-up'' attack 9/0xb oversimplifies—the 0x3c StepTimer path is actually a charge-up
    but the other branches are versioned damage scaling. The name is acceptable but ai_decideAttack or
    ai_pickTurnAttack better captures the per-turn decision logic.; run wf investigate investigate-20261018-155607;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
