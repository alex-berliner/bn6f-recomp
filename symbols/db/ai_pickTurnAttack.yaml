  date: '2026-10-18'
  detail: 'cmp r0,#2 / blt at top: attack logic only fires on every 3rd turn; bl battleObject_findClosestEnemyBattleObject_80103F8
    then str into oAIAttackVars_TargetObjectPtr and object_setAttack0 #0xa; tst r0,0x8000 / 0x2000 gates
    map the same turn into different object_setAttack0 calls (9); FindBattleActorsWithNonzeroParam(0x64,0x8b,0x90)==0
    path stores version-table Damage/AttackDuration/AttackBoost2 and ExtraDamage=0xa, attack 0xb; all
    table reads are indexed by [r4,#oAIData_Version_16], so values differ per boss version (Falzar-route
    SP variants)'
