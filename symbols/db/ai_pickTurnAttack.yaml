name: ai_pickTurnAttack
address: '0x0811368A'
kind: function
status: probable
summary: 'Boss AI turn chooser: on counter<2 it updates AiAttackParam, PanelParamFlags2, loads a version-indexed
  scratch, sets TargetObjectPtr to the closest enemy (alliance eor 1), and issues attack 0xa via sub_8113330;
  on counter==2 (after reset) it branches on object flags 0x8000/0x2000, then on FindBattleActorsWithNonzeroParam
  count, setting version-scaled StepTimer/Damage/AttackBoost2 and calling object_setAttack0 with 9 or
  0xb.'
interface: (no args; r4 = AI data ptr, r5 = battle object, r6 = AI state, r7 = AI attack vars) -> r0 =
  attack id passed to object_setAttack0; returns void
details: 'Keeps an oAIState_TurnCounter; until it reaches 2 it just increments it, then clears oAIAttackVars_AiAttackParam,
  sets PanelParamFlags2 = 0x3800000, loads a version-indexed scratch value from byte_81135FC, finds the
  closest enemy object (alliance eor 1), stores it as TargetObjectPtr, sets attack 0xa and calls sub_8113330.
  On the attack turn it resets the counter and reads object_getFlag: if flag 0x8000 is set it bails (leaves
  the counter reset to the version-table value read earlier in the same path — actually it reloads TurnCounter),
  if flag 0x2000 is set it sets StepTimer=0x3c and attack 9. Otherwise it counts battle actors with nonzero
  fields (0x64, 0x8b, 0x90); if none, it sets ExtraVars+4 = 1 and programs a version-scaled attack (Damage/AttackDuration/AttackBoost2
  from byte_8113614/811361A/8113620, ExtraDamage = 10) as attack 0xb, else sets StepTimer from byte_8113620
  and attack 9.'
evidence:
