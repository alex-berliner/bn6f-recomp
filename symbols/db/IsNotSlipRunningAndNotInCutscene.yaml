name: IsNotSlipRunningAndNotInCutscene
address: '0x08034C9C'
kind: function
status: confirmed
summary: Returns true when neither the slip-run state flag (EVENT_IN_SLIPRUN_STATE) is set nor a cutscene script
  is active
interface: bool IsNotSlipRunningAndNotInCutscene(void) -> r0 (1=TRUE, 0=FALSE), nz
details: 'Tests the event flag EVENT_IN_SLIPRUN_STATE (immediate 0x17) via TestEventFlagFromImmediate;

  if set, returns FALSE. Otherwise calls IsCutsceneScriptNonNull; if a cutscene script is

  active, returns FALSE. Otherwise returns TRUE. Preserves r4-r7, clobbers r0/r1/lr plus

  c/v (only nz documented as output). Used as a gate to allow player input/actions outside

  slip-run and cutscene contexts.

  '
