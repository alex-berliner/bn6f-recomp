open_questions:
- The exact semantics of the r5+0x70 flag (whether it is a "stage changed" latch or a counter) and whether
  r5 here is a BattleObject or a BattleState would be settled by reading the callers' contracts — they
  all keep r5 across many calls, but the struct layout for offset 0x70 is not declared in any of the provided
  struct defs.
