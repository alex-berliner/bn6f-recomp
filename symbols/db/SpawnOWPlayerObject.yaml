name: SpawnOWPlayerObject
address: '0x08003B4C'
kind: function
status: confirmed
summary: Allocates the first free slot in the overworld player object pool, initialises it from five register arguments,
  and returns the slot pointer (0 if the pool is full).
interface: "void SpawnOWPlayerObject(u32 r0_kindByte, u32 r1, u32 r2, u32 r3, u32 r4, /* lr clobbered */)\n  ->\
  \ returns r5 = slot pointer or NULL, r0 = 0 on success; r1-r4 pass through unchanged;\nflags: on success N=0/Z=1/C=0\
  \ (from the free-bit TST), on failure flags come from the final CMP slot >= poolEnd (C=1). Unusual ABI: result\
  \ in r5, not r0.\n"
details: 'Overworld (map-mode) player object allocator. The pool is a fixed array of 0xC8-byte slots at eOWPlayerObject,
  ending at eOWPlayerObjectEnd; the u32 at eActiveOWPlayerObjectBitfield holds one live/free bit per slot, scanned
  from bit 31 (first slot) downwards. For each set bit the candidate pointer advances by 0xC8 until it reaches the
  pool end, in which case r5 = 0 is returned (allocation failure). On finding a clear bit the function sets that
  bit in the bitfield, then fills the new slot: byte at +0x00 = 9 (object type/kind id, "overworld player"), byte
  at +0x01 = arg0 (r0), word at +0x04 = arg4 (r4), word at +0x08 = 0, words at +0x1C, +0x20 and +0x24 = arg1, arg2,
  arg3 (r1-r3) — likely coordinates/state/handler style fields of the 0xC8-byte overworld object structure. Note
  the pops are interleaved with stores (the popped r0 is stored to +0x01), and the success/failure paths return
  with different flag states.

  '
