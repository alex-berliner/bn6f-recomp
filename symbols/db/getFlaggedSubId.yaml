    depends on the matched object''s flag word; sub_80F7744+0x12: add r4, #0x3C — alternate value is exactly
    base + 60, implying paired id variants; Callee object_getFlag is documented as reading the first object-flag
    word of battle collision data, confirming a battle-object context'
