name: getFlaggedSubId
address: '0x080F7744'
kind: function
status: probable
summary: Reads a 4-byte id list from dword_80F7764 and calls sub_800FE28 to resolve a base id; if object_getFlag()
  & 0xA000, adds 0x3C and returns the id.
interface: (r0 = &dword_80F7764, id list) -> r0 = base id (from sub_800FE28) or base id + 0x3C if object_getFlag()
  & 0xA000; no meaningful flags
details: Stores r0 = pointer to the inline dword 0x1014181E (four byte-sized ids read as 0x1E,0x18,0x14,0x10)
  and calls sub_800FE28, keeping its return in r4. It then calls object_getFlag with no arguments, so
  sub_800FE28 presumably selects/sets a current battle object from that id list; object_getFlag returns
  that object's first collision-flag word. tst against 0xA000 checks bits 0x8000 and 0x2000; if either
  is set, r4 gains 0x3C (60), turning the returned id into a second variant slot (e.g. ids 0x10..0x1E
  vs 0x4C..0x5A). The dword_80F7764 literal doubles as the data table, a common inline-constant pattern.
  Without sub_800FE28's behavior the exact domain of the returned id (chip, animation, sound, etc.) is
  not provable from this file.
