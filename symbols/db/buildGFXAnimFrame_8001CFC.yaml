open_questions:
- 'Exact semantics of each of the four per-mode handlers (sub_8002000/2042/218C/21CE): compression formats,
  palette/vram banking, frame delta update.'
- Whether the table at off_8001AB8 is a fixed pool or grows; how Param3 range is bounded.
- Why the scratch pointer is reloaded after the loop instead of being kept from the last iteration (likely
  because each call may be re-entered with a different Param3 baseline).
- Role of the trailing push/pop of r4,r7,lr in the function prolog/epilog given r4 is also preserved by
  the handler ABI.
