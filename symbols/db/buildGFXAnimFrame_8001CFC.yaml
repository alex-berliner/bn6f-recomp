name: buildGFXAnimFrame_8001CFC
address: '0x08001CFC'
kind: function
status: probable
summary: Decodes one frame of a graphics animation stream into the object's per-tile scratch buffer and
  queues a single aligned DMA-style copy of the finished tiles to the object's destination.
interface: void sub_8001CFC(void *params /*r0*/, GFXAnimState *self /*r7*/) -> (r0..r3,r5,r6,flags clobbered;
  r4/r7 preserved via push/pop)
details: 'Decodes an animation frame described by a GFXAnimData/GFXAnimState pair. The

  code list (r0 -> first word pointer) is an array of u16 codes, one per tile;

  bits 0-9 pick a source tile (byte offset = tile * 0x40) and bits 10+ select

  one of four per-mode decoder handlers (sub_8002000, sub_8002042,

  sub_800218C, sub_80021CE) via the jump table at off_8001D54. Each handler

  writes 0x40 bytes into the object''s scratch slot taken from the pointer

  table at off_8001AB8, indexed by GFXAnimState.Param3, and the slot pointer

  is advanced 0x40 per tile between decodes. After the loop, the scratch base

  is re-fetched from the same table, and a single 8-word aligned transfer is

  queued (QueueEightWordAlignedGFXTransfer) of size GFXAnimState.Param2*0x40

  from scratch -> GFXAnimState.Param1. Self is held in r7 throughout; r4 is

  the running source pointer, r5 the scratch pointer, r6 the code-list base.

  Tile count (Param2) is re-read every iteration as in the original.

  '
