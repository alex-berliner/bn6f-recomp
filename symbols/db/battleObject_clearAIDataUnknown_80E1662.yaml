status: probable
summary: Clears AIData fields (Unk_40 → 0 at +0x64, Unk_10 = 0) on the AI block of the BattleObject pointed
  to by r5
interface: (r5 = BattleObject*) -> r0 = 0 ; r1 = AIData ptr ; sets Z flag
details: "1. `ldr r1, [r5,#oBattleObject_AIDataPtr]` — read the AIDataPtr field from the\n     BattleObject\
  \ header (offset 0x58 per the struct).\n  2. `ldr r1, [r1,#oAIData_Unk_40]` — follow AIData's `Unk_40`\
  \ (a `ptr` at +0x40)\n     to a secondary buffer.\n  3. `mov r0, #0; str r0, [r1,#0x64]` — zero a u32\
  \ at offset 0x64 inside that buffer\n     (likely a field on a sub-struct such as AIState or AIAttackVars).\n\
  \  4. `mov r0, #0; strb r0, [r1,#0x10]` — zero a single byte at offset 0x10 in the\n     same buffer\
  \ (AIData.Unk_10, the generic AI state slot).\n  5. Returns with r0=0, Z flag set.\n  No stack frame\
  \ is allocated (leaf function using `mov pc, lr`).\n"
