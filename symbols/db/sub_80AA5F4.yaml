name: sub_80AA5F4
address: '0x080AA5F4'
kind: function
status: confirmed
summary: Picks a random encounter's battle-settings entry for the current map, filtered by a caller-supplied bitmask
  and chosen via event-flag-bank-6 table selection plus iCurrFrame round-robin.
interface: u32 pickBattleSettingsEntry_80AA5F4(u32 filter /*r2*/, struct Toolkit *toolkit /*r10*/) -> u32 entry
  /*r0*/, plus r1/flags from callees
details: 'Selects one of four battle-settings tables by testing event flags 6:0x7F,

  6:0x80, 6:0x81 (falling through to a default at off_8020170). Reads the

  current map-group/map-number from the game state at oToolkit_GameStatePtr

  (fields oGameState_MapGroup, oGameState_MapNumber); if MapGroup >= 0x80 the

  alternate table column is used (table_addr += 4, map_group -= 0x80).

  Two-level indirection: table -> row by map_group -> entry-list pointer by

  map_number. Walks 0x10-byte records; a 0xFF first byte is the list terminator.

  Each candidate is gated by sub_80AA6A4 on its byte-7, then masked by

  sub_80AA824 against the caller''s r2 filter; matches are stashed on the

  stack up to SETTINGS_MAX (29) entries. The winner is picked by

  LD16(iCurrFrame) % match_count, giving simple round-robin cycling. Returns

  the selected record pointer in r0 (0 when no match). The C wrapper

  fabricates r1/flags from the last comparison in the original scan loop

  (BLT sets C=0,V=0 with r1=0xFFFFFFFF on hit; the no-match path exits via

  CMP #0xFF,#0xFF giving C=1,V=0) to match caller expectations, but the

  arm version encodes these in the actual instruction stream.

  '
