name: ai_attackGuardStrike
address: '0x08110EF8'
kind: function
status: confirmed
summary: AI attack handler for a guard-strike counterattack — raises the GUARD flag on the acting object, and if
  no strike target is lined up yet, arms the strike with version-specific timings and attack id 0xA before resetting
  the AI state.
interface: void ai_attackGuardStrike(r4=AIData*, r5=battleObject*, r6=AIState*, r7=AIAttackVars*, r10=passthrough)
  -> r1 (callee leftover), r5 (battleObject, preserved); flags nzcv clobbered
details: "Starts by zeroing the battle object's ExtraVars slot +0xC and setting the OBJECT_FLAGS_GUARD bit via object_setFlag1,\
  \ so the object visibly enters a guarding state this turn. It then scans the battle with FindBattleActorsWithNonzeroParam_ReturnCountAndSum\
  \ looking for actors whose field 0x6C equals 0x67 (an existing strike-target mark, 0x6C being the field and 0x67\
  \ the value searched). If any match is found (r0 != 0) the setup is skipped entirely and control falls through\
  \ to the state reset — a strike is already queued. Otherwise:\n  - reads AIData's version byte (oAIData_Version_16,\
  \ offset 0x10) and indexes two\n    per-game-version tables, byte_8110E40 -> StepTimer and byte_8110E48 ->\n \
  \   AttackDuration, stored as halfwords into the AIAttackVars block;\n  - stores battleObject + 0x74 (the object's\
  \ target-link field address) into\n    oAIAttackVars_TargetObjectPtr, i.e. the strike targets the guarded opponent;\n\
  \  - calls object_setAttack0 with attack id 0xA to queue the guard-strike attack.\nFinally it always resets the\
  \ AI state block: oAIState_ScriptId = 0 and oAIState_SubState = 0, ending this AI action. The returned r1/r5 pair\
  \ is just whatever the last callee happened to leave in those registers and carries no meaningful contract. Note\
  \ the two data tables are shared with sibling AI attack handlers (indexing is by AIData version byte, so Falzar/other-version\
  \ timings differ).\n"
