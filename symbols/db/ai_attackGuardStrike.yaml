name: ai_attackGuardStrike
address: '0x08110EF8'
kind: function
status: probable
summary: 'AI attack action: raises the object''s Guard flag, then (unless some actor already has the checked
  parameter) launches attack 0xA with per-version timing and resets the AI script state.'
interface: (r4 = AI data struct, r5 = battle object, r6 = AI state struct, r7 = AI attack-vars struct)
  -> r0 = 0; resets oAIState_ScriptId and oAIState_SubState to 0
details: Clears oBattleObject_ExtraVars+0xC on its own object (r5) and ORs OBJECT_FLAGS_GUARD into the
  object's ObjectFlags1, so the actor guards while this action runs. It then scans battle actors via FindBattleActorsWithNonzeroParam_ReturnCountAndSum
  with parameters (0x6C, 0x67, 0x6C), looking for actors whose field 0x6C equals 0x67; if any are found
  (count != 0) the attack setup is skipped entirely. Otherwise it indexes two byte tables (byte_8110E40,
  byte_8110E48) by oAIData_Version_16 to load a step timer and attack duration into oAIAttackVars_StepTimer
  / oAIAttackVars_AttackDuration, sets oAIAttackVars_TargetObjectPtr to r5+0x74 (a field inside its own
  object, likely a projectile/anchor slot), and starts attack id 0xA via object_setAttack0. Finally it
  zeroes the AI state's script id and substate, ending the AI script step. The guard-then-attack pattern
  and version-dependent timings suggest a scripted boss attack from the Beast+ AI scripts.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_setFlag1 with r0=OBJECT_FLAGS_GUARD sets the guard flag on the acting object; bl FindBattleActorsWithNonzeroParam_ReturnCountAndSum
    (0x6C,0x67,0x6C); 'bne loc_8110F2C' skips the attack when a matching actor exists; ldrb from byte_8110E40/byte_8110E48
    indexed by oAIData_Version_16 fill StepTimer/AttackDuration, showing version-specific attack timing;
    TargetObjectPtr = r5+0x74 and object_setAttack0(0xA) arm the attack on the object's own subfield;
    stores of 0 to oAIState_ScriptId and oAIState_SubState reset the AI script, typical of an AI attack
    action entry point
