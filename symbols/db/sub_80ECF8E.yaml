name: sub_80ECF8E
address: '0x080ECF8E'
kind: function
status: confirmed
summary: Per-frame AI attack state that bounces a target panel across the battlefield, spawning an effect object
  at each bounce until an iteration counter expires.
interface: "void sub_80ECF8E(u32 r5 /* BattleObject* */, u32 r6 /* scratch */, u32 r7 /* AIAttackVars* */)\n  //\
  \ r5/r6/r7/lr in; r1/r5 out; r4/r5/r6 preserved; nz/c/v/r0/r2/r3/r7/lr clobbered\n"
details: "Drives a \"bouncing panel\" attack from AI attack vars attached to a BattleObject.\nr5 = BattleObject,\
  \ r7 = AIAttackVars scratch struct.\n\nField map on AIAttackVars (r7):\n  +0x01 Unk_01  : state byte (0 = init,\
  \ 1 = tick, 2 = re-setup)\n  +0x02 Unk_02  : side\n  +0x0c Unk_0c  : 32-bit param (low16 OR'd with 0x10000) passed\
  \ to sub_80C5F2C\n  +0x0d Unk_0d  : per-bounce timer loaded into spawned effect object\n  +0x0e Unk_0e  : bounce\
  \ iteration counter (decremented each tick expiry)\n  +0x10 Unk_10  : per-frame tick counter (s16, starts at 8)\n\
  \  +0x16 Unk_16  : current target column (panel x)\n  +0x17 Unk_17  : current target row    (panel y)\n  +0x30\
  \ Unk_30  : column-direction step (signed, flipped on bounce)\n  +Damage        : damage value passed to sub_80C5F2C\n\
  \nOn first entry (state != 1, != 2): pokes BattleObject.AIDataPtr->Unk_68[+0x10] = 1,\nplays animation 0xD via\
  \ object_setAnimation, then on every setup pass:\n  - sets state = 1, tick = 8\n  - calls sub_80C5F2C(col, row,\
  \ side, 0, (Unk_0c & 0xFFFF) | 0x10000, Damage)\n  - resolves panel -> pixel via object_getCoordinatesForPanels\n\
  \  - calls spawn_t1_0x0_EffectObject(x, y, 0, 0x2F); if non-NULL writes\n    oBattleObject_Timer on it from Unk_0d.\n\
  \nEvery frame: ticks Unk_10 by 1; while >= 0 nothing else. When it goes negative:\n  - probe = row + direction\n\
  \  - if 1 <= probe <= 3, take the step (write row = probe).\n  - else flip direction (-dir), call sub_80ED040\
  \ for a row hint; if hint == current\n    col, write row = row - dir (bounce along row); otherwise nudge col by\
  \ +-1\n    toward the hint.\n  - decrement Unk_0e. If still > 0, set state = 2 (re-enter setup).\n  - If exhausted,\
  \ clear BattleObject.RelatedObject1Ptr and AIDataPtr->Unk_68, then\n    call object_exitAttackState.\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
