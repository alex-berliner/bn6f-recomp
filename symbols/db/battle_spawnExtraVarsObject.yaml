name: battle_spawnExtraVarsObject
address: '0x080E11E0'
kind: function
status: probable
summary: Spawns a battle object via object_spawnType4 with kind 0xA, then stores r7 into its ExtraVars
  field and sets header flag bits 0x04|0x10 on it.
interface: (r5 = spawn kind 0xA constant?, r7 = value for oBattleObject_ExtraVars) -> r0 = spawned battle
  object pointer (or untouched on failure); flags set by callee's return test
details: Calls object_spawnType4 with r0 = 0xA to create a battle object; on success it writes r7 into
  the new object's oBattleObject_ExtraVars word and ORs 0x14 (bits 2 and 4) into oObjectHeader_Flags.
  The beq after the call skips both stores when the spawn fails, so the callee's return/flags signal success.
  The disassembly shows mov r0, r5 reading r5 that was never written in this listing (push/pop pair also
  looks off), so the register setup likely comes from the caller or the listing is imperfect. Called from
  battle_objectCountdownAndDestroy, suggesting it spawns a helper/effect object tied to a dying object,
  carrying a pointer-like value in ExtraVars.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_spawnType4 with mov r0, #0xa shows it creates a battle object of the callee''s type
    with parameter 0xA; str r7, [r0,#oBattleObject_ExtraVars] stores the caller-supplied r7 into the new
    object''s extra-vars field; ldrb/orr #0x14/strb on oObjectHeader_Flags sets flag bits 0x04 and 0x10
    on the spawned object; beq locret skips the field writes, so the spawn routine''s success status gates
    them; caller battle_objectCountdownAndDestroy invokes it during object lifetime expiry, implying a
    destroy-related spawn'
