name: battle_pollSIOLinkIfActive_803DE72
address: '0x0803DE72'
kind: function
previous_names:
- sub_803DE72
status: probable
summary: Polls the SIO link library once per frame when SIO comms are enabled (battle)
interface: (no args) -> no return ; reads globals `unk_200A284` and calls `libSIOControlPoll_81445F8`
  when that word is non-zero
details: "Thumb wrapper used inside the battle main loop. On entry it loads the address of the\n  global\
  \ `unk_200A284` (an EWRAM byte/word flag set elsewhere when SIO/battle link\n  is active), reads it,\
  \ and tests it with `tst r0, r0`. If zero, it branches over the\n  callee and pops PC; if non-zero it\
  \ calls `libSIOControlPoll_81445F8` before\n  returning. There is no save/restore of r4..r7 aside from\
  \ the `push {lr}`/`pop {pc}`\n  pair shown in the assembly (the `r4` listed in `out` reflects the callee's\
  \ contract,\n  not this sub's). Captured call sites (snap_story2_*) come from a battle/story context\n\
  \  (entry lr=0x03005cec, sp=03007E region, sp/return addresses inside the egym's\n  battle main loop).\
  \ r2=0x00012004 and r3=0x0000001f/0x2000001f are unrelated caller\n  scratch; this function itself doesn't\
  \ touch them.\ndetails_quirks: |\n  The pool literal after the function resolves to the EWRAM address\
  \ 0x0200A284 (the\n  pointer `unk_200A284` referenced in this pool). Two captured samples return\n \
  \ r0=0 (skip branch) and two later samples return r0=0x0803DE81 (just past the `bl`,\n  i.e. the call\
  \ was taken). That is consistent with the `tst`/`beq` predicate.\n"
