name: battle_flagAiTarget_80E1654
address: '0x080E1654'
kind: function
status: confirmed
summary: Fetches the calling battle object's AI target and sets two "flagged" fields on it, returning
  the target pointer.
interface: u32 battle_flagAiTarget_80E1654(void); // r5 = battle object, r1 = returns target object pointer,
  clobbers r0 and NZ flags
details: 'Reads the battle object passed in r5 (not a stack argument, hence the odd contract), follows
  oBattleObject_AIDataPtr to the object''s AIData block, then follows oAIData_TargetObjectPtr to the object
  the AI is currently targeting. On that target it stores 1 to the word at +0x64 and 1 to the byte at
  +0x10, then returns the target pointer in r1. The two writes look like flag/marker fields rather than
  counters (both set to constant 1); likely used to mark the target for follow-up AI or battle processing
  (e.g. lock-on/retarget or a per-target state flag). No other fields are touched and the flags register
  is clobbered by the movs-style flag-setting writes.

  '
