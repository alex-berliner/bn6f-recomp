name: chatbox_inputHandler_8049888
address: '0x08049888'
kind: function
status: confirmed
summary: 'Chatbox input-handler dispatcher: advances the chatbox sub-state based on a flag check and the
  current chatbox sub-state, then ticks the chatbox state machine.'
interface: 'void chatbox_inputHandler_8049888(void); /* in: r5=chatbox state, r10, lr; out: c,v flags,
  r3,r8,r9,r10,r11,r12; clobbers nz,r0,r1,r2,lr; preserves r4-r9,r12 */'
details: 'Polls a global flag via chatbox_mask_eFlags2009F38 with bit 0x80. If that flag is clear, it
  queries the

  chatbox sub-state through chatbox_GetState_8045F4C; when non-zero it writes 0x0C into [r5+1],

  otherwise 0x20. If the flag is set, the chatbox sub-state byte is left untouched. After resolving the

  next sub-state, the routine calls sub_803A820 to advance the chatbox state machine. r5 points at the

  chatbox state struct whose byte at offset 1 is the sub-state slot driven here. The preserved register

  set plus the lr restore from the popped pc frame indicate this is a leaf-style event handler invoked

  from the chatbox update loop.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
