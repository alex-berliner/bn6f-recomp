name: battleObject_scenarioEffectInitPlayerOffsetMatrix_81429CA
address: '0x081429CA'
kind: function
status: confirmed
summary: Builds a 4-entry player-position offset matrix for a scenario-effect camera, selecting a per-effect table
  and per-facing sub-record, then packing signed (dx,dy) deltas onto a base word into the effect state buffer.
interface: 'void battleObject_scenarioEffectInitPlayerOffsetMatrix_81429CA(void); /* in: r10 (pass-through); out:
  r3 = dy byte of 0x7F sentinel; clobbers: nzcv r0-r2 lr; preserves: r4-r7 */'
details: 'Allocates/obtains a 16-byte scenario-effect state slot via battleObject_scenarioEffectStateAddr_81429CA''s
  callee and zero-fills it with ZeroFillByWord. Reads the player''s overworld tile-map index as a "mode word" whose
  low byte seeds the x-component and bits 8+ seed the y-component of each packed offset. A scenario-effect state
  field (0..3) selects one of four pointer entries in off_8142A1C (tables at byte_8142A2C, byte_8142A3C, byte_8142A54,
  byte_8142A74). The player''s facing direction is masked to an even value (0,2,4,6) to offset into the selected
  table. The routine then walks 8-byte records, reading the first two s8 bytes as (dx,dy); a dx of 0x7F terminates
  the walk. For each valid pair it computes ((mode_word & 0xFF) + dx) | (((mode_word >> 8) + dy) << 8) and stores
  the 32-bit packed result into successive 4-byte slots of the destination buffer. The four tables encode different
  scenario-effect camera patterns: a simple ±1 cross (table 0), ±1 cross plus ±2/±FE diamond (table 1), a 12-entry
  diagonal box (table 2), and a ±3/±FD cross (table 3). The final r3 value is the dy byte of the sentinel record
  (always 0x7F in the shipped tables).

  '
