open_questions:
- 'The exact semantic of r4 (returned by sub_8142990) — likely a base (camera or pivot) 16-bit X/Y pair;
  only the low and next byte are used, so it is probably a (low, high) = (x_lo, y_lo) or similar. - Which
  "scenario effect" this feeds — without seeing the callee sub_8142990 / sub_81421D0 / sub_81421D8 implementations
  we can''t be sure this is the *initial* setup vs a re-trigger. - The purpose of the intermediate ZeroFillByWord(r0,
  0x10) is opaque: r0 was the address returned by sub_81421D8 too? Looking again, r6 was the ZeroFillByWord
  destination''s caller return — actually r0 is set after the `mov r6, r0` from sub_81421D8 then `mov
  r1, #0x10; bl ZeroFillByWord` → so it zero-fills the *same* buffer that gets the entries written into.
  That may be how the trailing padding of the offset list is ensured. - Whether the four embedded tables
  map to specific scenarios (e.g. Falzar beast-out jump, warp, map-specific intro) is not derivable from
  this function alone; would need the caller sub_8089CC4 to disambiguate.'
