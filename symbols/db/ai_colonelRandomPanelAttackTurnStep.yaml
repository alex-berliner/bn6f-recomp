name: ai_colonelRandomPanelAttackTurnStep
address: '0x0810138C'
kind: function
status: probable
summary: 'Colonel AI attack-phase turn handler: queues the random-panel attack for the first two turns,
  then resets the counter and hands control to script 4.'
interface: (r0 = ?, r6 = AI state struct) -> r0 = ?; updates oAIState_TurnCounter and oAIState_ScriptId
details: Reads oAIState_TurnCounter from the AI state struct at r6. If it is below 2, it increments the
  counter and calls ai_colonelQueueRandomPanelAttack, staying in the attack phase for another turn. Once
  the counter reaches 2 (third entry), it stores 0 back into oAIState_TurnCounter and writes 4 into oAIState_ScriptId,
  switching the enemy to a different AI script/state. No return value is produced; only the two struct
  bytes are mutated.
