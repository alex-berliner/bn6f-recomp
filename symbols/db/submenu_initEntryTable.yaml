name: submenu_initEntryTable
address: '0x0812EB88'
kind: function
status: probable
summary: Initializes the 9-entry, 0x44-byte-per-entry submenu state table (byte_812DABC) via a shared
  loop, as part of setting up a submenu before rendering.
interface: '() -> void (arguments hardcoded inside: r1 = 9 entries, r2 = 0x44 bytes/entry, r4 = byte_812DABC;
  caller r0''s role in the shared loop is unknown)'
details: 'The stub is an alternate entry into sub_812EB92: it loads off_812EBB0 (= byte_812DABC), sets
  r1=9 and r2=0x44, and branches to loc_812EB9A, the loop body shared with sub_812EB92. It thus processes
  9 records of 0x44 bytes each at byte_812DABC. All three callers run it in a fixed init sequence after
  a fade (SetScreenFade(8,16)) alongside battle_resetEStructRecords_8046664, sub_812EB78 and submenu_renderSelectedWindow,
  then write a state byte to [r5,#2]/[r5,#3], so it appears to reset the submenu''s entry data before
  the window is drawn. Whether the shared loop zeroes or fills the records, and whether the incoming r0
  is used as a fill value or base, cannot be seen from the stub.'
