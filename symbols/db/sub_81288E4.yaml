name: sub_81288E4
address: '0x081288E4'
kind: function
status: confirmed
summary: 'PET menu close: run two post-menu cleanup updates and, once any screen fade has finished, return to the
  overworld map.'
interface: void sub_81288E4(void);  /* r5 in/out pass-through; clobbers r0-r3, lr, N Z C V */
details: "Likely called as the final frame/step of the PET menu (the blue-phone menu overlay\nthat sits on top of\
  \ the field map). On each invocation it:\n  1. Calls battleObjectAffineEnqueue_8128B4C -- enqueues an affine (rotation/scale)\n\
  \     transform update for battle/UI objects, presumably to settle the menu's\n     collapse animation.\n  2.\
  \ Calls battle_queueHpUpdate_8128C20 -- pushes an HP (HP/HP+ chip panel?) refresh\n     onto the battle/object\
  \ update queue so any HP bar touched by the menu is\n     redrawn correctly once the menu is gone.\n  3. Calls\
  \ IsScreenFadeActive; if the fade is still in progress it returns\n     immediately (the menu stays on screen\
  \ until the fade finishes). Once\n     IsScreenFadeActive reports no fade, it calls pet_menuExitToMap_811F708,\n\
  \     which tears the menu down and returns control to the map screen.\nr5 is the caller's object/struct pointer\
  \ and is preserved across the call so the\ndispatch loop can keep using it; the four caller's preserved regs (r4-r7)\
  \ are\nnot touched.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
