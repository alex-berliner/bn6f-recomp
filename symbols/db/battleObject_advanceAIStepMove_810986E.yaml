open_questions:
- Exact semantic of AIAttackVars.Unk_10 (sub-steps or pixel-tick counter) and Unk_12 (target) versus Unk_1a
  (post-move marker).
- r6's role is unused in this routine; the caller's contract just propagates it as a callee-saved register.
- Why Unk_10 == Unk_12 is the condition to resync panels, rather than e.g. Unk_10 == 0; could be a "first
  tick" check.
