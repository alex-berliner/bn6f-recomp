name: battle_isBeastOverEnabled_802A5A0
address: '0x0802A5A0'
kind: function
status: confirmed
summary: Returns 1 when the beast transformation (Beast Over) is active for this battle, 0 otherwise.
interface: bool battle_isBeastOverEnabled_802A5A0(/* r10 */ Toolkit *toolkit); -> r0 = 1/0; r4, r6 preserved; flags
  clobbered
details: 'Takes no real register arguments except the toolkit pointer in r10 (r4 is pushed but immediately overwritten,
  so its incoming value is irrelevant; it is only preserved as scratch). Computes a boolean "beast state applies"
  flag in r4 and returns it in r0. The check passes only when all three of these hold: (1) getLocOfActiveChips_8027E1C(8)
  -> the byte at active-chip slot 8 is NOT 8 (an empty/sentinel value for that slot, so some chip occupies that
  slot); (2) GetBattleMode() is none of the special battle modes 1, 6, 7 or 9 (those modes suppress the beast state);
  (3) GetBattleNaviStatsByte(battleState, 0x61) == 1, where battleState comes from toolkit+oToolkit_BattleStatePtr
  and the navi-index byte is read from battleState+oBattleState_Unk_0d; stats byte 0x61 evidently stores the current
  beast/cross-beast form (this being the Falzar version). Callers presumably use this to enable Falzar Beast Over
  visuals/behavior for the battle.

  '
