name: t3_0x49_80CD2EC
address: '0x080CD2EC'
kind: function
status: confirmed
summary: 'Task for battle object type 0x49 (snake-arm head): dispatches on the object''s CurState (init / step /
  destroy) and then refreshes its sprite.'
interface: 'void t3_0x49_80CD2EC(void); // in: r4,r5(object),r7,r8,r10,lr resident state; out: r5,r8-r12 updated
  state; clobbers nzcv,r0-r7,lr'
details: "Per-frame task for battle object type 0x49, the head of the snake-arm attack. It reads\nthe object's CurState\
  \ byte (oBattleObject_CurState at r5+off), indexes the jump table at\noff_80CD304 with it, and tail-jumps into\
  \ that handler with r0 = state byte and r1 = the\nhandler address (the table entry):\n  state 0 -> battleObject_initSnakeArmHead_80CD310\
  \ (spawn/init of the head)\n  state 1 -> snakearm_headStateHandler (advance/step the snake-arm head)\n  state\
  \ 2 -> object_genericDestroy (free the object)\nThe handlers keep the object's live state in the high registers\
  \ and return updated\nr5/r8-r12, so the trampoline uses mov lr, pc + bx r1 to return here. Afterwards it calls\n\
  object_updateSprite with the (possibly moved) object pointer in r5 so the sprite matches\nthe state the handler\
  \ left.\nQuirk: r1 still holds the table entry when the handler is entered; handlers receive the\nstate number\
  \ in r0. Unknown states beyond 2 would read garbage from past the table.\n"
