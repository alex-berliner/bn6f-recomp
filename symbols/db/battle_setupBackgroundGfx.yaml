name: battle_setupBackgroundGfx
address: '0x0804C72C'
kind: function
status: confirmed
summary: Queues the battle background GFX and palette transfers, sets the render-info blend word, advances the battle
  setup state to step 4, and initialises the battlefield tiles/SFX timer.
interface: void battle_setupBackgroundGfx(battleState* r5, toolkit* r10); // outputs r2, r8-r12 pass through from
  battleObject_initBattleFieldTilesAndSfxTimer_804C770; clobbers r0-r3, lr, flags
details: 'Part of the battle-scene setup sequence. r5 is a battle state object and r10 the toolkit. 1) Queues an
  8-word-aligned GFX transfer of 0x80 bytes of ROM tile data (byte_86A2C00) into VRAM at 0x0600CF40 (the battle
  background tiles). 2) Queues a second transfer of 0x20 bytes from ROM byte_86A2BE0 into the IWRAM buffer byte_3001B00
  (companion block, likely the matching palette). 3) Reads the toolkit''s render-info pointer (oToolkit_RenderInfoPtr)
  and stores the fixed halfword 0x1F09 at renderInfo+0xA, programming the blend/BLDALPHA-style control for the battle
  background. 4) Calls sub_804C844 with the battle state (updating it), then writes the byte 4 to battleState+0x10,
  marking setup step/phase 4. 5) Tail-calls battleObject_initBattleFieldTilesAndSfxTimer_804C770(battleState), whose
  register results (r2, r8-r12) are returned unchanged to this function''s caller. Preserves r4-r7; r5 is updated
  by sub_804C844 and used for the +0x10 store.

  '
