name: battle_setupBackgroundGfx
address: '0x0804C72C'
kind: function
status: probable
summary: Loads battle background tile data into VRAM and stage-related palette data into an EWRAM buffer
  as one step of the battle scene's graphics init sequence.
interface: (r0-r3 unused, relies on r5 = battle object, r10 = toolkit) -> r0 clobbered; r5+0x10 set to
  4 as a state/step marker
details: Queues a 0x80-byte block from ROM byte_86A2C00 into BG VRAM at 0x600CF40 (tile area) and a 0x20-byte
  block (one 16-color palette) from ROM byte_86A2BE0 into the EWRAM scratch buffer byte_3001B00, both
  via the deferred DMA queue so they take effect on vblank. It then writes 0x1F09 into the toolkit's RenderInfo
  at +0xA, calls sub_804C844 (not yet understood), stores 4 at r5+0x10 (likely advancing a battle-UI init
  step counter), and finishes by calling battleObject_initBattleFieldTilesAndSfxTimer_804C770, which sets
  the BG2/BG3 viewport, dispatches a post-init callback from r5+0xd, and rolls the ambient-SFX timer.
  The whole shape is a single stage of battle background setup in an init state machine.
