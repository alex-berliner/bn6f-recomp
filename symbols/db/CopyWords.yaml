name: CopyWords
address: '0x0800093C'
kind: function
status: confirmed
summary: Block memory operation via BIOS CpuSet (SWI 5), taking a byte count and converting it to a word count before
  the call.
interface: (u32 *src, u32 *dest, u32 size_bytes) -> void; clobbers flags (N,Z,C from the shift/ORR), preserves r0-r3
  and returns to lr via pop {pc}
details: 'Saves r0-r3 and lr on the stack, shifts the byte count right by 2 to get a word count (CpuSet takes a
  unit count, not bytes), ORs in the literal 0x4000000 and calls SWI_CpuSet with (src, dest, word_count | 0x4000000),
  then pops r0-r3 and returns. Bit 26 (0x4000000) of the CpuSet control word is the FIXED-SOURCE flag: the BIOS
  treats the source as a single word and repeats it across the destination, so despite the "Copy" name this routine
  actually performs a 32-bit word FILL of dest with *src for size/4 words, not a block copy of size_bytes from src.
  Quirk: the save area lives on the stack, so if dest overlaps the pushed registers the popped values (and the returned
  r0-r3) differ from what was saved; callers are analyzed as preserving r0-r3 because of the push/pop pairing. The
  lsr also sets the carry flag from bit 1 of the original size, and the ORR updates N/Z.

  '
