name: battle_spawnObject56LinkedToOwner_80C44A8
address: '0x080C44A8'
kind: function
status: confirmed
summary: Spawns battle object type 0x56 and links it to a owner object, inheriting its alliance/direction and setting
  header flag bits 0x04|0x10.
interface: BattleObject* battle_spawnObject56LinkedToOwner(u32 x /*r1*/, u32 y /*r2*/, u32 z /*r3*/, BattleObject*
  owner /*r5, also passed on stack as params*/); returns new object pointer in r0 (NULL on failure); N/Z set from
  the returned pointer (ADDS r0, r5,
details: "Wrapper around object_spawnType1 for object index 0x56. Before the call it pushes {lr, r5}; because the\
  \ callee reads its fifth argument (`params`) at [SP], the owner BattleObject pointer in r5 is effectively passed\
  \ as the params stack argument while r1-r3 supply the spawn x/y/z coordinates. If the spawn succeeds (non-NULL\
  \ pointer returned in r5 by the callee), the wrapper:\n  - stores the owner pointer into the new object's\n  \
  \  oBattleObject_RelatedObject1Ptr field, linking the two objects;\n  - copies the owner's oBattleObject_AllianceAndDirectionFlip\
  \ halfword\n    into the new object, so the spawned object shares the owner's\n    alliance/team and sprite direction-flip\
  \ state;\n  - ORs 0x14 (bits 0x04 and 0x10) into the new object's\n    oObjectHeader_Flags byte (offset 0 of the\
  \ object header).\nOn failure it simply returns with r0 = 0. The `mov r0, r5` is actually ADDS r0, r5, #0 in the\
  \ binary, so the NULL check doubles as a flag update (N/Z from the pointer, C/V cleared); callers could in principle\
  \ branch on the returned pointer via flags, though the normal contract is the r0 value. Because the linkage, alliance\
  \ copy, and flag bits are applied, this is most likely a helper for spawning an effect/attendant object that must\
  \ track and align with the object that created it.\n"
