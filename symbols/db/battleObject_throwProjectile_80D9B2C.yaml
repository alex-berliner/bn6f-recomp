open_questions:
- What flag combination 0x8000000 / 0x4000000 actually means on the panel param word (consistent with
  a "team-aligned panel" bit pattern but no symbol confirms which side is which).
- The exact significance of PhaseInitialized=4 (only "thrown" flag set, no other sub-state).
- Whether the source panel stored in Param3/Param4 is (col,row) or (row,col) — the code passes r0=Param3,
  r1=Param4 straight into object_getCoordinatesForPanels, whose semantics were inferred from other call
  sites.
