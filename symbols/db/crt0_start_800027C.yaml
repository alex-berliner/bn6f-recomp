name: crt0_start_800027C
address: '0x0800027C'
kind: function
status: confirmed
summary: ROM entry point; trampolines to the game's main boot routine that was copied into EWRAM at 0x3005E18 and
  then returns through the normal caller.
interface: void start(void) — no register inputs, no register outputs; r4 is preserved, all other scratch registers
  and flags are clobbered by the callee chain
details: 'This is the standard ARMv4 long-call trampoline used by the crt0/start module as the

  cart entry point (the ROM header entry jumps here). It pushes lr, loads the Thumb

  address "sub_3005E18+1" from the literal pool, sets lr = pc so the callee returns to

  the "pop {r0}", branches to the callee via bx (the ARM7TDMI has no BLX), then pops the

  saved address into r0 and bx''s back to the original caller. The target at 0x3005E18

  lives in EWRAM, i.e. the real start/main routine is copied from ROM to IWRAM/EWRAM at

  boot and this stub calls it in place. No arguments are set up and no return value is

  consumed; the callee is expected to honor the standard ABI (notably preserving r4,

  which the register contract shows every caller path relies on).

  '
