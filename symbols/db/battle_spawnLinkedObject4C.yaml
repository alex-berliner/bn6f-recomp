name: battle_spawnLinkedObject4C
address: '0x080C3710'
kind: function
status: probable
summary: 'Spawns battle object #0x4C, copies the source object''s alliance onto it, links it to a caller-provided
  state byte and marks that byte active.'
interface: (r0 = object id 0x4C, r1-r4 = spawnType1 args; r5 = source BattleObject, r7 = ptr to u8 link
  flag) -> r0 = new BattleObject or NULL; no flags meaningful
details: Tail-wraps object_spawnType1 with obj_idx 0x4C, keeping the caller's r1-r4 as x/y/z/params. If
  spawning fails it returns NULL unchanged. On success it copies the Alliance byte from the source BattleObject
  in r5 to the new object, stores r7 in the new object's RelatedObject1Ptr field, writes 1 to *(u8*)r7
  (so the caller learns the companion exists), and ORs flag 0x10 into the new object's ObjectHeader_Flags.
  Note r5 is reloaded by pop before use, so the source object must be passed in r5, not on the stack.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_spawnType1 with mov r0,#0x4C gives the spawned object id; ldrb r1,[r5,#oBattleObject_Alliance]/strb
    r1,[r0,...] copies alliance from r5 to the new object; str r7,[r0,#oBattleObject_RelatedObject1Ptr]
    links new object to r7; mov r1,#1; strb r1,[r7] sets the caller's byte at r7 to 1; orr with 0x10 on
    oObjectHeader_Flags sets header flag 0x10 on the spawn
  refs:
  - bn6f/asm/asm31.s:25295
  - 0x08003320 object_spawnType1
  reproduce: python3 tools/asmcat.py 0x080C3710
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- which battle object id 0x4C is and what it does in-game
- what structure r7 points into (likely a flag inside the caller's object) and which field
- which callers invoke this and in what battle situations
- the meaning of ObjectHeader flag 0x10
