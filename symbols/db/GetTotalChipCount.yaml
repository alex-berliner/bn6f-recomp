name: GetTotalChipCount
address: '0x08021BD8'
kind: function
status: confirmed
summary: Returns the total owned count of a chip (sum of its 4 count bytes) from the toolkit's chip table, after
  passing encryption_testPack validation.
interface: '/* in: r0 = chip_id, r10 = toolkit pointer */

  /* out: r0 = total count (sum of 4 bytes), r1 = last byte (4th) or 0 */

  /* clobbers: r1, lr; nz/c/v from encryption_testPack */

  u32 getChipCountSum_8021BD8(void);

  '
details: 'Validates the chip_id via encryption_testPack_8006e84 (Z set means valid).

  On failure, returns 0 in both r0 and r1.

  On success, loads the chip-entry base from oToolkit_Unk2002230_Ptr in the

  toolkit struct (r10-derived), indexes by chip_id * 12 (each entry is 12

  bytes), then sums bytes [0..3] of that entry as the total owned count

  (likely Normal/Paper/.../MB counts packed into the first four bytes).

  Only the first 4 bytes of the 12-byte entry are read; the remaining 8

  bytes are untouched. The 4th byte is left in r1 as a side effect

  (callers ignore it per the register contract).

  '
