name: NPCCommand_play_music
address: '0x0809F36E'
kind: function
status: confirmed
summary: NPC script command that starts playing the music track whose ID is embedded in the script.
interface: void NPCCommand_play_music(u8* scriptPtr /* r6 = current NPC script command pointer */); returns with
  r6 advanced by 3 and NZCV set from the pointer add
details: 'Handler for an NPC script opcode. r6 holds the current script command pointer.

  It reads a 16-bit halfword at r6+1 via ReadNPCScriptHalfword (byte-order bitfield

  of the two bytes), passes that value as the song ID to PlayMusic, then advances

  r6 by 3 (1 opcode byte + 2 song-ID bytes) to point at the next command. The

  pointer update uses ADDS, so NZCV reflect (old r6) + 3 — mostly irrelevant to

  callers, but the carry can be set when the script crosses a 4 GB... practically

  never; NZCV are effectively ignored by script dispatchers. No other state is

  touched; no registers besides r0/r1 (call clobbers) and r6 are modified.

  '
