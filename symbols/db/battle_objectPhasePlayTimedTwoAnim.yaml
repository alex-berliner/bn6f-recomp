name: battle_objectPhasePlayTimedTwoAnim
address: '0x080D3CB0'
kind: function
status: probable
summary: Battle object phase handler that plays anim 0x1D then 0x1E over 54 frames, then advances the
  object to phase 8.
interface: (r5 = battle object) -> updates oBattleObject_PhaseInitialized, CurAnim, Timer, CurPhaseAndPhaseInitialized;
  no return value
details: On first run (PhaseInitialized == 0) it sets the flag to 4, starts CurAnim 0x1D and sets Timer
  = 0x36 (54). Each subsequent call decrements Timer; at Timer == 0x1E it swaps CurAnim to 0x1E, and when
  Timer reaches 0 it stores phase 8 into CurPhaseAndPhaseInitialized, terminating the phase. The two animations
  back-to-back with a fixed timer look like a scripted boss/object animation beat before the next phase.
