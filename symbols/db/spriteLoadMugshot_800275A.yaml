name: spriteLoadMugshot_800275A
address: '0x0800275A'
kind: function
status: confirmed
summary: Initializes the mugshot sprite for a given portrait index and flags the target sprite struct as loaded
  (0x80 at +0x16).
interface: void sprite_loadMugshot_800275A(int mugshotIndex /* r0 */, struct *spriteState /* r5 */)
details: 'Takes a mugshot index in r0, scales it by 4, and indexes the mugshotSpritePtrs pointer table to fetch
  the sprite data pointer for that portrait. Passes that pointer to sprite_initialize, which sets up the sprite
  (presumably OAM/animation state) from its header. Afterwards, stores the halfword 0x80 at r5+0x16 in the caller-provided
  sprite/struct; this value likely acts as a "sprite loaded" / active flag the surrounding code checks. r0, r1 and
  lr are clobbered; the nzcv flags are also clobbered, so callers do not rely on flag state. No value is returned.
  Likely used when the game shows character dialogue portraits (mugshots) in chatboxes, or NPC portrait display
  code that owns the struct at r5.

  '
