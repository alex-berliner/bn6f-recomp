  reproduce: python3 tools/asmcat.py 0x080FE9E4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: ldr r0,=byte_80FEA00 + bl sub_800FE28 + push r0 + ldr r0,=byte_80FA00
    + add r0,#4 + bl sub_800FE28 then pop r0/mov r1,r0/pop pc clearly yields two table lookups returning
    into r0 and r1, and the table contents are 4+4 bytes consistent with per-difficulty values. The summary
    and name fit. A slightly better name reflecting it is a generic per-tier getter would be ''ai_getCircusManAttackParams''
    (prefix ai, lowerCamel).; run wf investigate investigate-20261018-203615; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
