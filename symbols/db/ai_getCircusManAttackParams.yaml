name: ai_getCircusManAttackParams
address: '0x080FE9E4'
kind: function
status: probable
summary: Looks up two per-difficulty CircusMan attack parameters from a fixed 8-byte table via sub_800FE28,
  returning them in r0 and r1.
interface: () -> r0 = param A (table[difficulty]), r1 = param B (table[4+difficulty]); flags from sub_800FE28
details: 'The function loads the address of an 8-byte table (byte_80FEA00: 14 10 0C 06 01 03 03 05) and
  calls sub_800FE28 twice, once with the table base and once with base+4, collecting both results in r0/r1.
  sub_800FE28 presumably indexes the table by the game''s current difficulty tier, so the first four bytes
  are one per-difficulty value (20/16/12/6 — plausibly damage) and the last four a second per-difficulty
  value (1/3/3/5 — plausibly a count or delay). It is a pure getter used by ai_circusManAttackInit when
  setting up a CircusMan attack. The pairing of one returned value in r0 and one in r1 via the push/pop
  around the second call confirms two simultaneous outputs.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: two sub_800FE28 calls with byte_80FEA00 and byte_80FEA00+4 yield r0/r1 pair (asm lines 3-13);
    table bytes 14 10 0C 06 | 01 03 03 05 form two per-difficulty 4-entry arrays; sole caller ai_circusManAttackInit
    sets up CircusMan attack state, matching an attack-parameter fetch
  refs:
  - bn6f/asm/asm31.s:150251
  - 0x080FEB20 ai_circusManAttackInit
