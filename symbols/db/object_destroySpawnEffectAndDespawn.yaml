name: object_destroySpawnEffectAndDespawn
address: '0x080C6A50'
kind: function
status: probable
summary: 'Common battle-object teardown: refreshes the hitbox, spawns a destruction/hit effect at the
  object''s panel (flip-aware for some object types), plays a sound if flagged, then moves the object
  to phase 4 (despawn).'
interface: (r5 = battle object pointer) -> r0 = ...; object's CurPhaseAndPhaseInitialized set to 4
details: First refreshes the object's collision data from its extra vars and copies extra-vars byte 0
  into the collision data's Region field. Then, depending on oBattleObject_Param1 (0xC, 0xE, 0x10, 0x11,
  0x12 take a special path), it either calls sub_801BD3C to place the effect at the object's current panel
  (panelX/panelY from collision data, alliance and Z from the object, effect id/offset from extra-vars
  byte 2) or computes a horizontally flipped position (object_getFlip() << 8 + extra-vars byte 2) and
  copies three halfword-ish fields from object+0x34 into a freshly spawned type-4 effect object via spawn_t1_0x0_EffectObject.
  If extra-vars halfword at +4 is nonzero its value is passed to PlaySoundEffect. Finally sets the object's
  phase to 4, which per callers/callees is the despawned/inactive phase.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: opens with ldr r7,[r5,#oBattleObject_CollisionDataPtr]; bl battle_refreshObjectCollisionFromExtraVars_80C6AB8
    and writes extra-vars byte 0 to oCollisionData_Region; branch table on oBattleObject_Param1 (0xC/0xE/0x10/0x11/0x12)
    chooses flip-based spawn via object_getFlip + spawn_t1_0x0_EffectObject vs panel-based spawn via sub_801BD3C;
    extra-vars halfword +4 is passed straight to PlaySoundEffect (bl PlaySoundEffect at loc after tst
    r0,r0); ends with mov r0,#4; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized] — the phase-4
    (despawn) transition; reads position/effect params from object+0x34 (ldmia r0!,{r1-r3}) as the effect
    spawn arguments
