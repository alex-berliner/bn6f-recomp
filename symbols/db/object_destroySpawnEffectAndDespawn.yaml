name: object_destroySpawnEffectAndDespawn
address: '0x080C6A50'
kind: function
status: confirmed
summary: 'Battle-object destruction handler: refreshes collision, spawns the death visual effect or resolves a tile-panel
  reaction, plays the queued sound, and advances the object to phase 4 (despawned).'
interface: void object_destroySpawnEffectAndDespawn(u32 obj /*r5*/, u32 toolkit /*r10*/) -> r1; clobbers r0,r2,r3,lr,nz,c,v
details: 'Reads obj''s CollisionDataPtr and ExtraVars. Calls battle_refreshObjectCollisionFromExtraVars to sync
  the live collision record, then copies ExtraVars[0] (region byte) into CollisionData.Region. Branches on Param1:
  for values 0x0C, 0x0E, 0x10, 0x11, 0x12 it builds a flip-encoded arg4 = (flip << 8) | ExtraVars[2], loads three
  u32 fields at obj+0x34/0x38/0x3C, and calls spawn_t1_0x0_EffectObject to create the death/despawn visual effect.
  For all other Param1 values it calls sub_801BD3C with (PanelX, PanelY, ExtraVars[2], region, Alliance, Z) to resolve
  a tile-panel reaction. After the effect path, checks ExtraVars u16 at +4; if non-zero, passes it as a sound ID
  to PlaySoundEffect. Finally writes 4 into CurPhaseAndPhaseInitialized, marking the object as fully despawned.

  '
