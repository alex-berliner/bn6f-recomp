name: npc_isPlayerNearPos
address: '0x080A9CAE'
kind: function
status: confirmed
summary: Returns 1 if the given NPC belongs to the player and is within a 1-pixel subpixel radius of the player's
  position on the field map, 0 otherwise.
interface: r5 in = NPC pointer; r0 out = 1 (near) or 0 (not near / not owned); r4, r5, r6, r7 preserved; r1-r3,
  nzcv clobbered
details: 'Checks NPC ownership by comparing the player object''s field at +0x24 against the NPC''s field at +0x14
  plus a fixed adjustment of 0x400000 stored in the config table at 0x80A9D00. If the NPC does not belong to the
  player, returns 0 immediately. If owned, reads the player''s subpixel position from eOWPlayerObject fields +0x1C
  (x) and +0x20 (y), then reads the NPC''s subpixel position from npc_ptr fields +0xC and +0x10, each adjusted by
  table entries (-0x400000 for x, +0x400000 for y). Computes the absolute difference on each axis and compares both
  against the proximity threshold 0x100000 (table entry at +0xC, i.e. one full pixel in the 16.16 subpixel coordinate
  space). Returns 1 only if both dx and dy are within that threshold. The config table (dword_80A9D00) thus holds
  four s24.8-style fixed-point constants controlling ownership, coordinate alignment, and the check radius.

  '
