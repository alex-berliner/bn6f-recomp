name: owPlayer_setupPrologue_80A58E0
address: '0x080A58E0'
kind: function
status: confirmed
summary: Setup prologue shared with the routine at loc_80A58FA - runs three init steps (counter reset, overworld
  player direction-anim setup) then branches into the shared body, which pops this function's saved frame to return
  to its caller.
interface: u32 sub_80A58E0(r4 counter_in, r5 arg5, r6 arg6, r7 arg7, r10 arg10); returns result in r0, with r5/r6
  and r8-r12 also live on exit per the caller contract; flags clobbered (nzcv)
details: "Pushes {r4-r7,lr} - a frame that the shared continuation at loc_80A58FA pops\nwhen it finishes, so this\
  \ function never returns to its own lr directly.\nThen performs three initialisation steps:\n  1. sub_80A5954\
  \ with the incoming r5/r6 unchanged,\n  2. sub_80A596C with its r4 counter argument cleared to 0; it updates\n\
  \     r4/r5, and step 3 continues from the r5 it leaves,\n  3. sub_80A59B8 (reached through owPlayer_setDirectionAnimThunk\
  \ in the\n     listing) with that r5, yielding the value the shared body receives\n     in r0 (copied to r2 with\
  \ \"mov r2, r0\") and leaving r4 live.\nFinally branches (tail-merge, not a call) into loc_80A58FA, which reads\n\
  the result pair r0/r2 plus counters r4/r5 and returns straight to this\nfunction's caller through the saved lr.\
  \ The presence of\nowPlayer_setDirectionAnimThunk indicates the overworld player subsystem,\nand this pair of\
  \ routines is a split prologue/body: callers of either\nentry see one logical call.\n"
