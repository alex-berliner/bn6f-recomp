name: sub_813399C
address: '0x0813399C'
kind: function
status: hypothesis
summary: Reads a state byte from an object at r5+2, calls its state handler through a two-entry dispatch table (both
  entries currently point to the same handler), then tail-calls a fixed follow-up routine.
interface: void sub_813399C(void) /* r5 = object pointer; corrupts r0/r1/r3+ and lr per called code */
details: 'Small trampoline-style dispatcher. It loads the byte at [r5+2] (a state/mode selector on the

  object whose pointer callers keep in r5), indexes the two-entry pointer table at off_81339B4

  with it, and calls the fetched handler using the classic ARM "mov lr, pc / bx r0" idiom, so the

  handler runs in ARM mode and returns back into this function. Notably both table entries hold

  sub_81339BC+1, so regardless of the selector value the same handler always runs; the handler is

  entered with r0 = its own address and r1 = the selector byte. After that call returns, the

  function unconditionally calls sub_8134490 (a fixed follow-up, likely a shared update/draw step

  for the same object) and then returns. r5 is not saved or set up here, so callers must have it

  pointing at the object already; the object layout field at +2 is the only field touched directly.

  The dispatch is effectively vestigial — either the two states were meant to diverge and don''t, or

  the table is a leftover from a shared template. The .byte 0,0 padding after pop {pc} keeps the

  literal pool aligned.

  '
