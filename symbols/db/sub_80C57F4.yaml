summary: 'Init handler of an aura-style battle object: fixed sprite (0x80/0x10/0x17) with palette from Param1*4,
  flip depends on which side of Param3''s column it sits on, two animation tables by adjacency, then hands off to
  sub_80C5886.'
details: 'sprite_load(0x80, 0x10, 0x17) + sprite_noShadow, oObjectHeader_Flags |= 2 (visible), palette = Param1*4,
  recomputes panel coords. Flip = Alliance XOR DirectionFlip, inverted when PanelX - Param3 is negative (which side
  of the reference column). Allocates collision data (frees the object via object_freeMemory on failure), object_setupCollisionData(0xA,
  5, 3), hit effect 2, object_clearCollisionRegion, object_presentCollisionData, Timer2 = 0xF. Animation table:
  |PanelX - Param3| <= 1 -> byte_80C5A12, else byte_80C5A18; the table pointer goes into oBattleObject_ExtraVars,
  its first byte into CurAnim/CurAnimCopy, applied via sprite_setAnimation + sprite_loadAnimationData. CurState
  = CUR_STATE_UPDATE, tail-call sub_80C5886.

  '
