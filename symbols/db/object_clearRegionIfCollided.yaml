    run wf investigate investigate-20261019-022109'
open_questions:
- What sub_8016B72 does (it runs on every path) — its behavior likely defines this routine's real role
- What collision states the 0x0C000000 flag bits represent
- Which callers invoke this and with what object types (r5-based access suggests a shared update loop)
