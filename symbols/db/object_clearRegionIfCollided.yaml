name: object_clearRegionIfCollided
address: '0x0810FDB0'
kind: function
status: probable
summary: Clears a battle object's collision region when its collision flags indicate a hit, then performs
  an unknown follow-up call.
interface: (r5 = battle object) -> r0 = return of sub_8016B72; no flags of interest
details: Reads the object's collision-data pointer at oBattleObject_CollisionDataPtr and its post-collision
  flags at oCollisionData_FlagsFromCollision. If the flags are nonzero AND contain any of the bits 0x0C000000
  (from dword_810FDCC), it calls object_clearCollisionRegion to remove the object from its current collision
  region. In all cases it then tail-calls sub_8016B72, whose purpose is unknown, so this routine is likely
  part of a per-frame object update that reacts to a specific class of collision (top/bottom or special-flag
  hits) by dropping the object out of its region. Uses r5 as the object pointer rather than r0, implying
  it is called as part of a loop over objects or with the object preloaded in r5. No callers are known,
  so its exact trigger context is unverified.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0,[r5,#oBattleObject_CollisionDataPtr]; ldr r0,[r0,#oCollisionData_FlagsFromCollision]
    then tst/beq — behavior keyed on collision result flags; ldr r1,=0xC000000; tst r0,r1 — only flags
    in the 0x0C000000 mask trigger the clear; bl object_clearCollisionRegion under that condition — the
    only side effect visible before the final call; bl sub_8016B72 executes unconditionally, so the clear
    is not the function's whole purpose
  refs:
  - bn6f/asm/asm32.s:4351
  - 0x0801A074 object_clearCollisionRegion
  - 0x08016B72 sub_8016B72
  reproduce: python3 tools/asmcat.py 0x0810FDB0
