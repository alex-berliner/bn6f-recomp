name: battle_objectUpdateFreeOwnedPtrs
address: '0x0810F402'
kind: function
status: probable
summary: Per-frame battle-object handler that, on phase 0, frees three owned pointers and passes a fourth
  to a cleanup routine before running the normal phase dispatcher.
interface: (r5 = battle object, uses r5 implicitly) -> tail-calls battle_objectUpdateDispatchPhase_80165C2;
  r0 = result of that dispatch
details: Takes the battle object in r5 (no r0 use, so r5-based like other phase handlers). If oBattleObject_CurPhase
  is 0, it walks three pointer fields at oBattleObject_ExtraVars+0xc, +0x10 and +0x14, and for each non-NULL
  one calls sub_80CBAF2 — the null-check-then-call pattern of a free/destructor. It then loads oBattleObject_ExtraVars+8
  unconditionally into r0 and calls sub_80E5B6E, presumably a fourth free or an owned-resource teardown.
  Finally it tail-jumps to the standard per-object phase dispatcher, so this is a wrapper update handler
  adding one-time (phase-0) resource cleanup on top of normal phase logic. The ExtraVars block of pointers
  suggests an object that owns several dynamically allocated sub-resources (e.g. sprites/effects).
