name: ZeroFillObjectInteractionAreas_800378C
address: '0x0800378C'
kind: function
status: confirmed
summary: Clears the overworld object interaction-area pool (0x280 bytes) and resets its entry count to zero.
interface: void ZeroFillObjectInteractionAreas_800378C(void); /* clobbers r0, r1, lr, NZC flags; preserves r2, r3
  */
details: 'Initialization/reset routine for the overworld "object interaction areas" system. It calls

  ZeroFillByWord on eOWObjectInteractionAreas with a size of 0x280 (640 bytes, 160 words),

  zeroing the entire pool of interaction-area records. It then stores 0 into

  eNumOWObjectInteractionAreas, the counter of how many entries the pool currently holds,

  so the pool is empty and ready to be repopulated. Return flags are whatever ZeroFillByWord

  leaves in NZC from its final flag-setting instruction. Inputs r2/r3 listed in the contract

  are only preserved, not read.

  '
