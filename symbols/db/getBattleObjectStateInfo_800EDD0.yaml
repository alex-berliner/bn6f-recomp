name: getBattleObjectStateInfo_800EDD0
address: '0x0800EDD0'
kind: function
status: probable
summary: Gather state/info fields for a battle object, branching on whether it is an actor (type 2) — actor path
  reads hand-slot data and calls sub_800EF34, otherwise returns chip metadata.
interface: '// In:  r0 = battle object ptr, r1 = caller-saved value forwarded to sub_800EF34,

  //      r4 = preserved-through value, r10 / lr used by caller

  // Out: r0..r4 = (see details); nz/c/v/lr clobbered; r5..r7 preserved

  SubEdd0Out getBattleObjectStateInfo_800EDD0(u32 obj, u32 callerR1, u32 r4_in);

  '
details: "Pulls the object's NameID (oBattleObject_NameID) and unpacks it via\nunpackVerActorTyAndAIIdx_800F29C;\
  \ if the actor type is 2 it takes the\n\"actor\" branch, otherwise the \"non-actor\" branch.\n\nActor branch (type\
  \ == 2):\n  - Reads oBattleObject_Alliance, passes to getBattleHandAddr_8010018 to\n    obtain a hand/team struct\
  \ pointer (R4 = hand).\n  - slot = hand + idx*2 + 2 (idx = (byte)hand[0]).\n  - Calls sub_800EF34(slot[0], r1)\
  \ -> r0=ret0, r1=ret1.\n  - Builds r2 = LD16(slot+0x18) + ret0 + LD16(slot+0x24).\n  - r3 = ret1.\n  - r0 = LD16(slot+0),\
  \ r1 = LD16(slot+0xC).\n  - r4 = (LD8(hand+idx+0x3E) << 8) | LD8(hand+0x44+idx).\n\nNon-actor branch:\n  - r0\
  \ = LD16(obj + oBattleObject_Chip).\n  - r1 = 0; r2 = 0; r3 = LD8(obj + oBattleObject_ChipsHeld).\n  - r4 is passed\
  \ through unchanged from the caller's r4.\n\nPush {r5-r7, lr} / sub sp,#4 / str r1,[sp] / pop preserves r5..r7\
  \ and lr;\nr0..r4 are returned, matching the contract.\n"
