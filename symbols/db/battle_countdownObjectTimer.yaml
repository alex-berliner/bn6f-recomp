name: battle_countdownObjectTimer
address: '0x080DEF1C'
kind: function
status: probable
summary: Decrements an object's halfword timer at +0x64 and, when it reaches zero, marks the object finished
  (sets flag bit 1, CurAction 4, CurPhase 0).
interface: (r5 = battle object header) -> r0 = 0/4 scratch; updates timer, flags, CurAction, CurPhase;
  flags not meaningfully set
details: Every call, the halfword counter at [r5,#0x64] is decremented and stored back. While the counter
  is nonzero the routine returns immediately. When it reaches zero, oObjectHeader_Flags gets bit 0x2 ORed
  in, the object's CurAction byte is set to 4 and CurPhase cleared to 0 — the standard way a battle object
  is told to terminate. r5 is the object pointer, so the function takes no register arguments and relies
  on the caller having r5 set up.
