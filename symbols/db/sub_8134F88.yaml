name: sub_8134F88
address: '0x08134F88'
kind: function
status: confirmed
summary: Consumes a pending battle chip ID match against a battle object, marks a slot release entry, and clears
  the object's chip-ID slot flag.
interface: void sub_8134F88(u32 chipIdOrToken /* r0 */, struct BattleObject* obj /* r5 */);
details: "Compares r0 against the halfword stored at r5+0x1C (which the project treats as a\npending chip/object\
  \ ID token for the battle object). If it does not match, the\nfunction returns immediately.\nOn a match:\n  -\
  \ Allocates entry #4 from the global struct pool at 0x02008450 via\n    getStructFrom2008450; if that returns\
  \ 0 (no free slot), the call is bailed out\n    without consuming.\n  - Writes the literal byte 8 into the returned\
  \ struct's offset 0x08 (a type/state\n    tag for that pooled object, likely \"chip slot release request\").\n\
  \  - Clears bit 0 of the long at r5+0x4C (an \"object flags\" word), presumably the\n    \"has-pending-chip-id\"\
  \ flag.\n  - Writes 0xFFFF into r5+0x1C, sentinel-marking the slot as consumed.\nTrashes r0/r1/r2 and NZCV; preserves\
  \ nothing beyond restoring PC via pop {pc}.\nFunctions keyed off this entry point appear to be the consumer side\
  \ of a\nchip-ID dispatched handler pair: a producer sets r5+0x1C and bit 0 of r5+0x4C,\nand this routine drains\
  \ it.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
