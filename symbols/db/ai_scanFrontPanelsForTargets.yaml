name: ai_scanFrontPanelsForTargets
address: '0x080F382C'
kind: function
status: probable
summary: AI helper that checks the three panels in a column directly in front of a battle object and records
  a per-row entry for each panel whose status flag 0x10 is set.
interface: (r0 = entry array base, r1 = value A (<<8), r2 = value B (<<16), r3 = value C, r5 = battle
  object ptr, r6 = extra word, r7 = AI attack vars ptr) -> r0 = sub_80C8C4C result of last call; no meaningful
  flags
details: Loops a counter from 0 to 2 and computes dy = counter-1, so it examines rows PanelY-1, PanelY,
  PanelY+1. For each row it computes x = object_getFrontDirection() + PanelX (i.e. the panel one column
  in front of the object, direction-aware via the alliance/DirectionFlip logic) and reads that panel's
  status word with object_getPanelParameters. If bit 0x10 of the panel status is set, it packs a word
  from the caller's arguments (r3 | r1<<8 | r2<<16), indexes the r0 array by counter*4 (one slot per row),
  and calls sub_80C8C4C(slotPtr, packedWord, r7->oAIAttackVars_InitFlag, savedR6). Bit 0x10 of the panel
  flags is likely an occupancy/blocking property (e.g. an object or hole on the panel). The per-row slot
  pointer and packed word suggest entries are queued for a later attack/damage step rather than executed
  here.
