name: e_copyHudTiles
address: '0x0801E07C'
kind: function
status: probable
summary: Copies a fixed 6x2 tile run into background tile block 3 at tile (24,0) and flags the HUD for
  redraw.
interface: () -> void; no return value, sets bit 0x800000 in eStruct2035280+0x44 via flagSetBits
details: 'Writes tiles from the table at byte_801EDFC into tile block 32x32 #3, starting at tile x=0x18
  (24), y=0, spanning 6 columns by 2 rows. r4=6 and r5=2 are loaded as the width/height pair for CopyBackgroundTiles.
  Afterwards it calls flagSetBits with 1<<23 (0x800000), ORing it into the flag/redraw word at eStruct2035280+0x44,
  marking that HUD region as needing a refresh. eStruct2035280 is the battle HUD state (HP box shown HP,
  tile position, redraw bits), so this is a HUD graphics update routine. The actual graphic depends on
  the tile IDs at byte_801EDFC, which are not documented here. No callers are known, so the game context
  that triggers it is unidentified.'
