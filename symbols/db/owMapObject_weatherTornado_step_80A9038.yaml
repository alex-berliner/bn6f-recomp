name: owMapObject_weatherTornado_step_80A9038
address: '0x080A9038'
kind: function
status: confirmed
summary: Advances the overworld weather-tornado object one tick along its current direction, updating its X/Y position
  by a fixed or diagonal step amount.
interface: void owMapObject_weatherTornado_step_80A9038(u32 r5 /* tornado object ptr */);
details: "Reads the tornado object's per-tick displacement at +0x2C (primary step) and a\n1-byte direction mode\
  \ at +0x05.  Modes 0-1, 3-5, and 7 use the primary step;\nmode 2 and the default fall-through (mode 6 or any unexpected\
  \ value) use an\nalternate diagonal step loaded from +0x30.  The resulting deltas are applied to\nthe 32-bit X\
  \ at +0x0C and Y at +0x10, which are then written back.\nDirection encoding (screen coords, Y-down):\n  0 = down-left\
  \ (x+ , y-)   1 = left  (x+ )\n  2 = down-right diagonal (x+diag, y+diag)\n  3 = up (y+ )   4 = up-left diagonal\
  \ (x-, y+)\n  5 = right (x-)  7 = down (y-)\n  6 / default = up-right diagonal (x-diag, y-diag)\nr4 is saved on\
  \ the stack (preserved across the call); r5 and lr are used as\ninputs but not modified.  Flags and r0-r2 are\
  \ clobbered.\n"
