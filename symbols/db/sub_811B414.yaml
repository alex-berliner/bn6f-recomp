name: sub_811B414
address: '0x0811B414'
kind: function
status: confirmed
summary: 'Initialize GUI sprite 0x2C (Navi-panel element): mark slot active, build sprite, configure animation/palette/priority/OAM,
  then update wrapper.'
interface: void gui_initSprite0x2C_811B414(u32 r1_guiArg, StateSlot* r5_state); /* r4,r6 preserved; returns r0 and
  NZCV from sprite_updateWrapper */
details: 'Writes byte 1 to state->active (offset 0) to claim the slot. Calls initGuiSprite_8002770 with sprite id
  0x2C and the r1 argument to allocate the GUI sprite. Retrieves an animation id via sub_80101F8 (which reads a
  global/sub-record value), then sets that animation and loads its frame data. Disables shadow, sets palette bank
  0, and priority 2. Stores the halfword 0xC0 into the OAM slot list via slotList_storeHalfwordAndClearField_800306C.
  Configures the sub-entry: palette bank 6 (sprite_setSubEntryPaletteBank_800304A) and sub-record field A = 4 (sprite_setSubRecordFieldA_8003060).
  Writes byte 4 to state->subType (offset 8) to tag this slot as a sub-entry sprite. Finally calls sprite_updateWrapper_811B414''s
  neighbour at 0x811B45C to flush the wrapper. r4 and r6 are untouched by the body and restored on pop; r5 is used
  throughout as the state pointer. The function is one of several per-sprite-id initializers invoked by a larger
  GUI/NavPanel setup dispatcher.'
