name: navicust_handlePlacementCancelInput
address: '0x0813640C'
kind: function
status: probable
summary: 'B-button handler for the Navi Cust part-placement screen: if a part is being held it puts it
  back, otherwise it cancels/exits the placement screen.'
interface: (r0 = scratch; r5 = placement-screen state struct) -> r0 = sound ID passed to PlaySoundEffect;
  updates state byte at +0x02 and position fields
details: Reads the 'part held' flag at state+0x10. If held, it copies the held part's coordinates from
  +0x3c/+0x3e into the current-cursor slot fields +0x28/+0x2c, sets the state byte +0x02 to 0x18 (drop/return
  part), and plays SOUND_MENU_SELECT. If nothing is held, it sets state +0x02 to 0xC (exit), clears the
  selected-part bytes at +0x0E and +0x14, calls sub_813B920, resets something via sub_813660C(0), redraws
  the whole board with navicust_drawBoardTilemap(0), calls sub_81362F8, and plays SOUND_EXIT_SUBMENU.
  This matches being invoked from navicust_handlePlacementCursorInput as the cancel branch.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst/beq on [r5,#0x10] picks between returning a held part and leaving the screen; held branch
    copies +0x3c/+0x3e to +0x28/+0x2c and sets state 0x18 with SOUND_MENU_SELECT; exit branch sets state
    0xC, clears +0x0E/+0x14, and plays SOUND_EXIT_SUBMENU; exit branch calls navicust_drawBoardTilemap
    to restore the board view; sole caller navicust_handlePlacementCursorInput is the placement screen
    input handler with confirm/cancel duties
