name: sub_803537C
address: '0x0803537C'
kind: function
status: confirmed
summary: Re-arms event flag 0x28 when the player enters a map whose group matches an entry in the built-in auto-increment
  table whose paired flag is currently set.
interface: 'void sub_803537C(void); // implicit input: r10 = toolkit pointer; no outputs'
details: 'Reads the current map group from the GameState pointed to by the toolkit (r10), then

  walks a packed table of {map_group:u16, event_flag:u16} pairs at word_80353B8 (terminated

  by a map_group of 0). EVENT_28 is cleared before the scan, so the routine doubles as the

  trigger and the re-arming site: when a table entry matches both the current map group and

  a currently-set paired flag, EVENT_28 is set again. Table entries observed:

  (0x90,0x29),(0x90,0x2A),(0x90,0x2B),(0x91,0x2C),(0x91,0x2D),(0x91,0x2E),(0x93,0x2F),

  (0x93,0x30). Touches oToolkit_GameStatePtr and oGameState_MapGroup; uses the standard

  ClearEventFlagFromImmediate / TestEventFlag / SetEventFlagFromImmediate helpers with

  flag id 0x28. r4-r7 preserved; r0/r1/r3 and flags clobbered.

  '
