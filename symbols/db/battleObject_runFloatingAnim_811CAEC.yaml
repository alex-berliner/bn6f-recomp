open_questions:
- The exact semantic of the effect (e.g. whether it represents floating bob, swoop-in, or outro for a
  particular battle object kind) cannot be determined from this function alone; the parent caller table
  and BattleObject type usage in callers would settle it. The 0xE advance via counter_addU32_r5Plus0C_811CC60
  strongly hints at a scripted "step" in a battle object's animation/script progression, but the specific
  event isn't labelled.
