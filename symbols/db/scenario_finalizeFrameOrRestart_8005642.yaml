name: scenario_finalizeFrameOrRestart_8005642
address: '0x08005642'
kind: function
status: confirmed
summary: Main-jumptable step that finalizes the current frame's effects/draws, and if the screen fade
  is no longer active tears the scenario down and advances the main jumptable to state 0x2C (scenario
  restart).
interface: void sub_8005642(void /* r10=toolkit, r5/r7 live, returns r0/r1/r5/r7 and sets N/Z */);
details: "Runs an unconditional tail block (dispatch_80339CC; sub_80039AA; sub_8003AFA; sub_80027B4; sub_800286C;\
  \ sub_8003BF4; sub_8003E98; npc_drawSprites_800467C; sub_8004298; sub_8004590; sub_8004934; event_runArmedCallback_80024AE)\
  \ that finishes pending effects and draws the final scene of the current frame.\n\nThen calls IsScreenFadeActive;\
  \ if it returns zero (Z set) the function returns immediately, leaving r5/r7 and r0/r1 from the fade\
  \ check otherwise unmodified.\n\nOtherwise it tears down and re-initialises the scenario:\n  - chatbox_8040818\
  \ (close/hide chatbox)\n  - FreeAllObjectsOfSpecifiedTypes(0x21)\n  - sub_8004702 (sprite/object reset)\n\
  \  - resetAllGraphicsState_8005F40\n  - runSetupStepAndClearWorkArea_8005F6C\n  - sub_80027C4, zeroFill_80024A2\n\
  \  - scenario_initEffectState_8003962, zeroFill_8003AB2\n  - RandomizeExtraToolkitPointers\n  - reloadCurNaviStatBoosts_813c3ac,\
  \ still with r0 = 0x21 (the same value left in r0 by FreeAllObjectsOfSpecifiedTypes is reused here as\
  \ a parameter)\n\nFinally reads r10->oToolkit_GameStatePtr into r5, r10->oToolkit_MainJumptableIndexPtr\
  \ into r0/r7, and stores the byte 0x2C (MAIN_STATE_SCENARIO_RESTART) at that index, advancing the main\
  \ jumptable.\n\nTouched offsets: oToolkit_GameStatePtr, oToolkit_MainJumptableIndexPtr on the toolkit\
  \ object pointed to by r10.\n"
