name: battle_setPhase4Timer40
address: '0x080DA1A4'
kind: function
status: probable
summary: Advances a battle object to phase 4 and arms its Timer2 with 40 frames.
interface: (r5 = battle object pointer; r0 scratch) -> void; r0 clobbered, LR returned to directly
details: 'Stores 0x28 (40) into the object''s Timer2 field at oBattleObject_Timer2 and 4 into oBattleObject_CurPhaseAndPhaseInitialized,
  marking phase 4 as the current (initialized) phase. This is the standard small phase-setter thunk pattern
  used by battle objects: a phase handler or init routine jumps here to schedule the next phase after
  a 40-frame delay. It touches no other fields and calls nothing, so all behavior (including which object
  and which phase-4 handler takes over) is determined by r5 set by the caller.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strh r0(0x28), [r5,#oBattleObject_Timer2] — sets a 40-frame timer on the object; strh r0(4),
    [r5,#oBattleObject_CurPhaseAndPhaseInitialized] — switches object to phase 4; 5-instruction body with
    no bl and direct mov pc, lr — pure field-setter thunk on caller-provided r5; Recorded routes list
    'chips', consistent with a battle/chip-related object's phase transition
  refs:
  - bn6f/asm/asm31.s:73464
  reproduce: python3 tools/asmcat.py 0x080DA1A4
