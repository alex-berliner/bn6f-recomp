name: battle_dispatchActorTurnByTypeAndAIIdx_800F404
address: '0x0800F404'
kind: function
status: confirmed
summary: Battle-side trampoline that hands the current actor's type/AI-index handler table to the shared actor dispatch
  routine and jumps to it.
interface: void battle_dispatchActorTurnByTypeAndAIIdx(void); // no register inputs of its own; tail-calls indexByActorTypeAndAIIdxThenDispatch_800F420
details: 'Loads the address of the version dispatch table at off_800F414 into r0 and tail-calls indexByActorTypeAndAIIdxThenDispatch_800F420,
  which indexes the table by the current battle actor''s type and AI index and dispatches that actor''s per-version
  handler (the three entries off_8109550, off_80F285C and off_80EABF8 are the per-version handler tables; the game
  is the Falzar version, so the relevant entry is whichever the dispatcher selects for this cartridge). The wrapper
  itself holds no state: it only supplies the table pointer and pops pc to return through the callee''s return.
  All argument passing and results are handled by the dispatcher; callers of this wrapper see the dispatcher''s
  effects (r0-r3 and flags clobbered, r4-r11 preserved by it).

  '
