name: ow_freeMapObjectThunk
address: '0x080A87E8'
kind: function
status: probable
summary: Thin wrapper that frees an overworld map object, preserving r4-r7 for its caller.
interface: (r0 = map object slot/pointer, as taken by FreeOverworldMapObject) -> r0 = FreeOverworldMapObject's
  return; r4-r7 preserved.
details: The function only saves r4-r7 and lr, calls FreeOverworldMapObject with the incoming arguments
  untouched, and restores the registers before returning. It changes nothing about the arguments, so r0
  (and any other register arguments) pass straight through to the free routine, which clears the object's
  allocation bit, marks its slot free, and unmarks it in the sprite system. The register save/restore
  and bl-and-pop structure indicate it exists as a callable stub, most likely so some table or callback
  can point at a 'free this map object' action without its caller needing to preserve r4-r7 itself. No
  caller is known, so why the extra wrapper layer is needed cannot be confirmed.
