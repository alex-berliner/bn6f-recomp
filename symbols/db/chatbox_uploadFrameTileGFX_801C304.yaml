open_questions:
- The exact chatbox field that lives at [r4+8] isn't pinned to a struct entry; in Chatbox the closest
  is `BoxGfxLoadState_0F` at 0x0F. The function being passed a pointer with a +8 field at offset 0x08
  implies the chatbox struct is not the canonical `Chatbox` but likely a small "chatbox GFX uploader"
  sub-struct (perhaps local to the loader routine). Confirming requires walking sub_801C202's setup code.
- Whether the 0x0B skip constant is a literal "skip" magic or a real slot index that happens to be unused
  needs to be confirmed by running the chatbox with that slot populated.
