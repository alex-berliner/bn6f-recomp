name: battle_initPanelMover
address: '0x080E5494'
kind: function
status: probable
summary: Initializes a battle object that spawns at a panel, loads its sprite/animation, and flies straight
  forward with speed set by its ExtraVars field.
interface: (r5 = battle object; no args) -> r0 = new state word; sets XVelocity, Timer2, flags, state
details: Recomputes the object's pixel position from its panel coords (object_setCoordinatesFromPanels),
  loads sprite resource (0x80, 4, 2), selects animation 9, loads its animation data, removes the shadow,
  and sets palette 0. It then reads the object's facing multiplier (object_getFrontDirection), multiplies
  it by [r5+oBattleObject_ExtraVars], and stores the product as XVelocity, so ExtraVars acts as a signed
  speed. It divides the constant 0x280000 by that same speed via SWI 6 (Div) and stores the 16-bit quotient
  into Timer2, making the travel time inversely proportional to speed. Finally it sets bit 2 of the object
  header flags, writes the object's pointer into the struct at [ExtraVars+0xC] (registering with some
  owner/target), and transitions to the CUR_STATE_UPDATE state.
