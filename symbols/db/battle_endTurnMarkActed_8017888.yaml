name: battle_endTurnMarkActed_8017888
address: '0x08017888'
kind: function
status: confirmed
summary: Turn-end handler for a battle object that optionally runs an enemy AI cleanup (sub_80E1620) and then marks
  the object as having acted (CurAction = 8, phase cleared).
interface: void sub_8017888(battle_object *obj /* r5 */); returns r0 = 0; clobbers r0-r3, r7 (scratch, restored),
  flags NZ set from "mov r0,#0"
details: "Reads a battle object pointer from r5 (no null check; callers always pass one).\n1. Calls battle_testFlag0x40_800A8F8;\
  \ if the global battle flag 0x40 is clear,\n   skips the AI-side branch entirely.\n2. Loads the object's NameID\
  \ (oBattleObject_NameID) and looks up its\n   (version, actor_type, ai_index) record via GetVerActorTyAndAIIdx_80182B4.\n\
  \   Only when actor_type (byte 1 of the record) == 2 does it continue.\n3. Computes the object's AI data block\
  \ pointer as\n   [obj + oBattleObject_AIDataPtr] + 0x40 and reads the first word there.\n   Only when that word\
  \ is still zero does it call sub_80E1620, passing\n   r1 = actor type (2) and r7 = AI data block pointer; this\
  \ looks like a\n   one-shot initialization/teardown for type-2 enemies that hasn't run yet.\n4. Unconditionally,\
  \ in all paths: stores 8 into obj + oBattleObject_CurAction\n   (byte, offset 9) — action id 8 evidently means\
  \ \"no action/turn finished\" —\n   and stores halfword 0 into obj + oBattleObject_CurPhaseAndPhaseInitialized,\n\
  \   resetting the action phase for the next turn.\nReturns r0 = 0 in every path. r7 is used as scratch for the\
  \ AI data pointer\nbut is popped back from the stack on exit, so it is preserved to callers.\nQuirk: the conditional\
  \ call only happens once per battle (guarded by the\nzero word at aidata+0x40), since the callee presumably sets\
  \ it.\n"
