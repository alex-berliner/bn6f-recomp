  reproduce: python3 tools/asmcat.py 0x08128008
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal in structure: it clamps [r5+0x1e] to 4, reads records from dword_2027590,
    and makes three renderTextGfx calls with row offsets of 0x5C0 to BG tile VRAM. However, the second
    call''s tile count is the immediate `#8` (mov r4, #8), not taken from record+0x10 — that''s the VRAM
    dest offset (0x6004320). The r4/#8 is fixed; record+0x10 isn''t loaded as the count. Also, the first
    call''s count is fixed at 0xb (11), not read from record+0x14 (record+0x14 is loaded but never used
    as r4 here). The text-script call stores the high halfword into [r10 toolkit]+8 correctly.; run wf
    investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
