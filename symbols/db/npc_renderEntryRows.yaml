name: npc_renderEntryRows
address: '0x08128008'
kind: function
status: probable
summary: Renders up to four NPC entry-selection rows (row gfx, secondary gfx, and a text-script name)
  into BG tile VRAM from per-row buffers, clamped to 4 rows.
interface: '(r5 = state struct: u16 count at +0x1e (clamped <=4), u16 first-row index at +0x24; r0 = 0x201
  flag mask for the table build) -> r0 = clobbered; renders 4 rows max'
details: 'First calls buildNpcEntryEventTable_81280DC with mask 0x201 to refresh the entry-event table
  at unk_2026700. Then for up to 4 rows starting at index [r5+0x24], it reads a 0x20-byte record at dword_2027590
  + 0x20*i and makes three renderTextGfx_8045F8C calls per row: 11 tiles from byte_2017A20+i*0x5C0 to
  VRAM 0x6004020, 8 tiles from unk_2017D20+i*0x5C0 to 0x6004320 (tile counts taken from record bytes +0x14
  and +0x10), and a mode-3 text-script draw of 2 tiles from eTextScript201BA00 to 0x6004560, with the
  string selected via the record''s high halfword at +0x1c stored into the toolkit text-renderer state
  ([r10 toolkit]+8). All three calls use dword_86A5D60 as gfx base and write to row buffers offset by
  0x5C0 per row.'
