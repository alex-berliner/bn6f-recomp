    counts 11/8/2; row source buffers byte_2017A20/unk_2017D20/unk_2017F60 offset by 0x5C0*i, and [record+0x1c]>>16
    set into toolkit text state selects the row string; loop bounded by [r5+0x1e] clamped to 4, starting
    at [r5+0x24], records strided 0x20 at dword_2027590; called from submenu_HandleInput_8127B18 (screen
