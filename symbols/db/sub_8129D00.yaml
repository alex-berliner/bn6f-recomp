name: sub_8129D00
address: '0x08129D00'
kind: function
status: confirmed
summary: Handles D-pad cursor movement, A-confirm, and B-cancel for a battle-side list (chip/program submenu).
interface: "void menu_handleListInput_8129D00(u32 listBase /*r5*/, u32 r6, u32 r7, u32 toolkitPtr /*r10*/)\n   \
  \ -> r4 (cursor), r5, r6, r10 preserved/modified;\n   flags NZ, C, V clobbered; Z, N clobbered by callees.\n"
details: "Polls this-frame joypad via toolkit->joypad->Pressed (r10 -> oToolkit_JoypadPtr -> oJoypad_Pressed).\n\
  List state struct lives at r5: [0x20] = item count, [0x13] = current cursor index.\nCursor loop is performed by\
  \ menu_moveCursorUpDown_811FA22 with r2=1 (presumably wrap-enabled\nor step-1); returned value is the new cursor\
  \ index.\n  - If cursor changed: stores new index and calls sub_812B3E4 (presumably redraw/refresh the\n    item\
  \ display for the newly highlighted entry).\n  - Else if A pressed: plays SOUND_MENU_SELECT and calls sub_812B414\
  \ (battle_selectTarget_\n    812B414 — picks the highlighted target / executes the highlighted action).\n  - Else\
  \ if B pressed: plays SOUND_EXIT_SUBMENU, sets state byte [0x03] = 0x0C (close submenu\n    phase), clears [0x1C]\
  \ and [0x1E] to 0, and ORs bit 0 into flag byte [0x1B] (mark\n    \"changed dirty\" so the parent repaints).\n\
  r6, r7, r10 are passed in purely to forward to callees.\n"
