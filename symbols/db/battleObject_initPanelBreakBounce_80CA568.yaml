status: probable
summary: 'Init handler of a bouncing panel-break attack object: breaks the panel it spawns on (or only
  cracks it when the panel is already damaged or occupied), plays SFX 0xDA, sets up sprite and a hopping
  trajectory, and hands off to the bounce updater sub_80CA61A.'
interface: 'void battleObject_initPanelBreakBounce(u32 r5 /* battle object */) : r5 -> [r5 r8 r10]'
details: 'Recomputes pixel coords from panel coords, spawns a dust effect at the object''s X/Y/Z (spawn_t1_0x0_EffectObject
  with r4=0x30), then reads the panel''s status word (object_getPanelParameters): when bit 0x10 is CLEAR,
  or any of the mask 0xF880080 bits is set (panel already damaged/occupied), it only calls sub_8109794
  (crack the tile if allowed) and frees the object. Otherwise: object_breakPanel, PlaySoundEffect(0xDA),
  sprite_load(0x80, 0xC, 0x33) + animation + shadow, CurAnim=0/CurAnimCopy=0xFF, palette 0, ObjectFlags
  |= 2 (visible), flip per alliance, XVelocity = object_getFrontDirection() * 0x80000, Timer = 2, ZVelocity
  = 0x80000 (upward hop); allocates collision data (frees the object on failure), object_setupCollisionData(4,5,1),
  hit effect 5, object_presentCollisionData once, CurState = CUR_STATE_UPDATE, and tail-calls the bounce
  physics updater sub_80CA61A.

  '
