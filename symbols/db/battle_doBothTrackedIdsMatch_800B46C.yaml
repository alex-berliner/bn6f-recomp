name: battle_doBothTrackedIdsMatch_800B46C
address: '0x0800B46C'
kind: function
status: confirmed
summary: Returns TRUE only if both tracked id slots (dword_203F4A0 and dword_203F5A0) hold the given id, else FALSE.
interface: 'bool battle_doBothTrackedIdsMatch(u32 id); // in: r0=id, lr; out: r0=TRUE(1)/FALSE(0), r1=tracked id
  A, r2=tracked id B, r3=id (echoed); c/v set from last compare, nz clobbered'
details: 'Loads two 32-bit values via pointer tables at off_800B660 (=dword_203F4A0) and off_800B664 (=dword_203F5A0),
  then compares each against the id passed in r0. If the first value differs, it returns FALSE immediately with
  flags left from that compare; otherwise it compares the second and returns TRUE only if both match. Short-circuit
  behavior is observable: the flags on exit reflect whichever comparison was the last one executed (first slot on
  mismatch, second slot on full match or second-slot mismatch), so a caller branching directly on return flags sees
  the result of that final compare. r1 and r2 hand the two loaded values back to the caller and r3 echoes the input
  id, letting callers reuse them without reloading. The two globals are separate words (0x100 apart in IWRAM), each
  holding an id/handle of some tracked entity; the exact meaning of those slots is not determined from this function
  alone.'
