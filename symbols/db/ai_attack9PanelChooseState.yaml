name: ai_attack9PanelChooseState
address: '0x08101E96'
kind: function
status: probable
summary: 'AI state for attack 9 panel-choosing: first entry sets AttackDecisionFlag=4 and tail-calls ai_setupAttack9PanelChoose;
  on callback return clears ScriptId/SubState and reinitializes attack-vars if HasMoved.'
interface: (r6 = battle object AI-state struct, r7 = AI attack-vars block) -> r0 = 0; touches AttackDecisionFlag,
  ScriptId, SubState, HasMoved
details: On entry it tests oAIState_AttackDecisionFlag at r6; when clear it stores 4 there and tail-calls
  ai_setupAttack9PanelChoose, passing off_810216C (=sub_8102FF4+1) as the follow-up callback, so this
  is the kick-off for attack 9's panel-choosing phase. When the flag is already set (the callback finished
  the decision), it clears oAIState_ScriptId and oAIState_SubState to return the object to the neutral
  AI script state, and if oAIAttackVars_HasMoved (r7) is set it reinitializes the attack-vars block via
  battle_aiInitAttackVars so the object can attack again. No return value is produced; r0 ends as 0.
