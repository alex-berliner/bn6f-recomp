name: battle_getHitModifierOffsets_800E548
address: '0x0800E548'
kind: function
status: confirmed
summary: Computes knockback direction multiplier and X/Y offset from a hit object's collision-data hit-modifier
  byte and the enemy's facing direction.
interface: 'void battle_getHitModifierOffsets(u32 r4_in, BattleObject *r5, u32 r6_in, void *lr); /* out:
  r0 = direction * s8_multiplier (s32), r1 = s8 offset_x, r2 = u8 offset_y, r3 = collision_data_ptr; flags:
  nzcv set */'
details: 'Calls object_getEnemyDirection(r5) and saves the 4-bit facing value in r4. Loads the collision-data
  pointer from [r5 + oBattleObject_CollisionDataPtr] and reads the hit-modifier byte at [collision + oCollisionData_HitModifierFinal].
  If bit 7 is set (final-hit flag), clears it and adds 5 to the table index. The remaining bits are right-shifted
  by 2 and the number of trailing zeros (capped at 4) becomes the hit-strength class. That class plus
  the +5 final-hit bonus indexes a 3-byte entry in the table at 0x0800E58C: byte 0 is a signed direction
  multiplier, byte 1 a signed X offset, byte 2 an unsigned Y offset. r0 = facing * multiplier (s32 product
  of two s8 values), r1 = offset_x sign-extended, r2 = offset_y zero-extended, r3 still holds the collision-data
  pointer for the caller. r4 and r6 are preserved across the call. The final movs r1,#1 sets N=0 Z=0 before
  the pop, so the caller sees those flags rather than the MUL''s natural flags.'
