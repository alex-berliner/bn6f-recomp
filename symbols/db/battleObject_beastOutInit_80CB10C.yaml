name: battleObject_beastOutInit_80CB10C
address: '0x080CB10C'
kind: function
previous_names:
- sub_80CB10C
status: probable
summary: Sets up a battle object's panel coordinates, palette-flip flags, an animation, and a sound for
  a Beast-Out (cross-unison) transformation.
interface: '(r5 = BattleObject*) -> void ; side effects: writes BattleObject, sprite, sound'
details: 'Operates on the BattleObject passed in r5. Calls object_setCoordinatesFromPanels to

  rebuild pixel X/Y from the object''s current panel X/Y (no change in this path), then

  zeroes oBattleObject_Z16 (offset 0x16, i.e. the Alliance/0x16 byte - actually Z16 is

  the "Alliance/DirectionFlip" u16 per struct; the high byte is written 0 here).

  Calls sprite_load(0x80, 8, 0xd) to install sprite 0x80 with tile/state params, then

  sprite_noShadow to mark the slot as shadow-less. Sets OBJECT_FLAG_UPDATE_DURING_TIMESTOP

  (0x10) on the header via `ldrb ... orr r0, #2`. Actually sets bit 0x02 (OBJECT_FLAG_VISIBLE)

  based on the bit pattern; the `orr r0, r1` with r1=2 sets bit 0x02.

  Writes CurAnim = CurAnimCopy = 0x14, then sprite_setAnimation(0x14) and

  sprite_loadAnimationData to bind the new frames. Sets palette index 0 and calls

  object_getFlip/sprite_setFlip so the sprite is mirrored per the object''s alliance.

  Plays sound effect 0xA7 (the Beast-Out transformation SFX). Finally writes

  CUR_STATE_UPDATE into the CurStateActionPhaseAndPhaseInitialized word (offset 0x8)

  so the object''s state machine advances.

  The "snap_beastsp" snapshots in entry/exit r0=00000004 imply it returns CUR_STATE_UPDATE.

  '
