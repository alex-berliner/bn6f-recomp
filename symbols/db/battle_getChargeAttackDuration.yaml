name: battle_getChargeAttackDuration
address: '0x080F77B0'
kind: function
status: probable
summary: Returns the charge-attack duration (in frames/turn units) read from a data table, offset by a
  player-level check on the active object.
interface: () -> r0 = u16 duration; preserves r4
details: Loads a pointer to dword_80F77D0 (containing 0x1014181E, likely a small packed table of attack-duration
  values indexed by something — possibly the AI difficulty tier just stored, or an external index) and
  passes it to sub_800FE28 to read out one entry. Then calls object_getFlag to read the active object's
  flag word and tests bit 0xA000 (object flag bits 13 and 15 — typically level/character-state flags like
  'is S-ranking' or 'has charge boost'). If set, adds 0x3C (60) to the returned duration. The result is
  stored as AttackDuration in oAIAttackVars_AttackDuration, exactly matching the standard 'AI attack duration
  read plus a level-based bonus' pattern.
