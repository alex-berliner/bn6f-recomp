name: startFadeShakeTransition_802774C
address: '0x0802774C'
kind: function
status: confirmed
summary: 'Kicks off a scripted transition: clears a work flag, sets up a screen fade, starts a camera
  shake, plays three sound effects, and advances the work object to state 8.'
interface: void sub_802774C(r5 = work object, r10 = context passed to sub_80302B6); returns nothing meaningful
  (r2-r6, r10 are just callee leftovers, nzcv clobbered)
details: 'Operates on a work object in r5. First zeroes the word at work+0x40, then calls SetScreenFade(0x64,
  8) — a fade with value 100 and type/mode 8. Next calls the camera-shake helper (sub_80302B6, reached
  via the cameraSetShake label) with r0=1 and r1=0x28 (40), passing r10 through as its context. Then plays
  three sound effects in sequence: id 0x193 (written as 0x94 + 0xff in the assembly), SOUND_MENU_SELECT,
  and 0xBC. Finally stores halfword 8 at work+2, which is the object''s state/phase field, so the owner''s
  state machine moves to phase 8 on return. The combination of a fade, a camera shake and a burst of sound
  effects suggests a dramatic scene transition (e.g. a boss/scene intro beat) rather than a plain menu
  change. The r2 value produced by sub_80302B6 is implicitly threaded through the PlaySoundEffect calls;
  the "outputs" r2-r6/r10 in the contract are just registers the callees happened to leave behind, not
  deliberate results.

  '
