name: e_dispatchUpdateByState
address: '0x08008664'
kind: function
status: probable
summary: Dispatches an entity's per-frame update to one of four handlers selected by its state byte.
interface: (r0 = arg? actually clobbered, r5 = entity struct pointer) -> tail-calls handler table[byte
  at r5+2] with r0 = state index; returns to caller via saved lr
details: Reads the byte at offset 2 of the struct in r5 (an entity/object context, since r5 is caller
  context rather than an argument), uses it as an index into a 4-entry Thumb function pointer table at
  off_8008678, and long-calls the handler with lr set to return back into this function's pop {pc}. The
  state byte is left in r0, so each handler receives its own state index as an argument (r1 holds the
  handler address at call time). The handlers are sub_8008688, sub_80086F8, sub_8008716, and e_battleEndWaitCountdown,
  so the fourth state is the entity that waits for the battle-end countdown. This is a classic per-state
  update dispatcher for battle entity state machines.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#2] then ldr r1,[r1,r0]: state byte at offset 2 indexes the table; off_8008678
    holds 4 Thumb pointers (sub_8008688/86F8/8716, e_battleEndWaitCountdown+1), a state handler table;
    mov lr, pc; bx r1; pop {pc}: tail dispatch that preserves the caller''s return address; e_battleEndWaitCountdown
    as one handler ties this to battle entity update logic; no caller known, so the exact owner of the
    r5 struct and the meaning of states 0-2 are unconfirmed'
