name: sub_804293C
address: '0x0804293C'
kind: function
status: probable
summary: Chatbox text-script command that centers the next run of text horizontally, storing the computed start
  X and draw position into the chatbox object.
interface: u32 chatbox_placeCenteredTextRun_804293C(u32* scriptPtr /* r4 */, Chatbox* chatbox /* r5 */); returns
  1 in r0, new draw pos in r1, aligned offset in r2, next char X in r3, scriptPtr advanced by 3 in r4; flags set
  as for r4+3 add (N=Z=C=V=0 in practice); preserves r6, r7
details: 'Implements a 3-byte text script command (byte at +2 = run length in tiles) for the chatbox text renderer.
  Computes the run''s pixel width as 11*(tileCount-1)+16, then computes a centered start offset: the right edge
  is 0xB0 (176) when the chatbox layout flag selected via chatbox_maskFlags_3e(mask=2) is set, otherwise 0xF0 (240);
  startX = (rightEdge - width) >> 1. When the flag is clear, startX is further reduced by chatbox+oChatbox_TextScriptCharIdx
  (characters already printed on the line). Stores startX + charIdx to chatbox+0x94 (next character X), rounds startX
  down to a multiple of 8 pixels via ((startX>>1)<<1)<<2, adds that to chatbox+oChatbox_Unk_7C (current text draw
  position) and stores it back. Advances the script pointer by 3 bytes; the caller is expected to continue executing
  the script. Returns r0=1 to signal the command was consumed.'
