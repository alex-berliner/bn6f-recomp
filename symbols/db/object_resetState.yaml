name: object_resetState
address: '0x081003AC'
kind: function
status: probable
summary: Resets a battle object's flag, status-slot entry, collision data, region, damage fields and reserved
  panel, operating on the object in r5.
interface: (r5 = battle object ptr; no args) -> void; clobbers r0-r3
details: Takes the battle object from r5 (never set up inside, so it relies on the battle code's register
  convention). It clears ObjectFlags1 bit 0x40 via object_clearFlag, claims/resets a status-UI slot with
  sub_801DC7C(r0=0), then calls object_updateCollisionData(1,2,3) and object_setCollisionRegion(1), which
  looks like restoring default collision values. It copies the low halfword of oBattleObject_DamageAndStaminaDamageCounterDisabler
  into oCollisionData_SelfDamage and its low byte into oCollisionData_StaminaDamageCounterDisabler, then
  reads the AI attack vars' target panel X/Y (AIData+0xA0) to release the object's reserved panel with
  object_removePanelReserve. Overall it looks like a reset/cleanup of an object's battle state, plausibly
  when it despawns or is recycled.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_clearFlag with r0=0x40 clears an ObjectFlags1 bit on the r5 object; object_updateCollisionData(1,2,3)
    and object_setCollisionRegion(1) restore default-looking collision values; strh/strb of oBattleObject_DamageAndStaminaDamageCounterDisabler
    into oCollisionData_SelfDamage/StaminaDamageCounterDisabler; ldrb of oAIAttackVars_TargetPanelX/Y
    (AIData+0xA0) followed by object_removePanelReserve releases the panel the object reserved; uses r5
    without setting it, matching the battle-object register convention seen in callees
