name: initGuiSprite_subEntry
address: '0x0811A3AC'
kind: function
status: probable
summary: 'Initializes a fixed GUI sprite at unk_201D700 for the caller-supplied object: sets object state
  byte 0x23, attaches the sprite via initGuiSprite_8002770, then sets animation 0 (plus loadAnimationData),
  no shadow, palette 0, OAM priority 2, and via slotList_storeHalfwordAndClearField_800306C writes 0 to
  dword_811A3E8, then sub-entry palette bank 8 and sub-record field A 3.'
interface: (r5 = object/base pointer, r0-r3 clobbered) -> r0 = 0; sets [r5]=0x23
details: 'Uses r5 from the caller (this function never sets it), writing 0x23 to [r5], most likely an
  object state/type byte. It calls initGuiSprite_8002770 with the fixed resource pointer unk_201D700,
  then configures the freshly attached sprite: animation index 0 plus loadAnimationData, shadow disabled,
  palette 0, OAM priority 2. It stores halfword 0 through slotList_storeHalfwordAndClearField_800306C
  (dword_811A3E8 = 0 as the value), clearing a slot-list field, then sets sub-entry palette bank 8 and
  sub-record field A 3. This is a fixed one-shot initializer for one specific on-screen object whose identity
  is set by unk_201D700''s sprite data.'
