open_questions:
- No caller is known, so the game-side meaning of this phase (which battle state enters it) is unclear
- sub_80BAF06 is unknown; it may clarify why only variant 3 gets sound and an extra call
- Meaning of ExtraVars values 0-3 and the phase table indexed by ExtraVars*4 is not visible from here
