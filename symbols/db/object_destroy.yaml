name: object_destroy
address: '0x080CD78E'
kind: function
status: probable
summary: 'Tears down the battle object in r5: runs its cleanup hook, frees its collision data, and releases
  its object slot.'
interface: (r5 = battle object pointer) -> r0 = object_freeMemory result; no flags used
details: Standard object destructor. It first calls sub_80CD7D0 (likely a per-type or vtable cleanup/despawn
  hook for the object at r5, since it takes no arguments), then loads the object's CollisionDataPtr field
  (oBattleObject_CollisionDataPtr) from r5 and passes it to object_freeCollisionData, and finally calls
  object_freeMemory on r5 to release the slot, flags, bitmap, and list linkage. It operates on the object
  via r5 rather than r0, so it is meant to be called from code with the object in the reserved register
  (typical object 'self' destructor pattern). No caller is known, but the callee sequence is the canonical
  destroy path.
