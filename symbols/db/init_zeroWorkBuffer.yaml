name: init_zeroWorkBuffer
address: '0x080049E0'
kind: function
status: probable
summary: Zero-fills a 0x400-byte work buffer and publishes its address through a global pointer.
interface: () -> void; no meaningful flags
details: Loads the address of byte_2006848 (an IWRAM buffer) and clears 0x400 bytes of it via ZeroFillByEightWords,
  which wraps a BIOS CpuFastSet fill. It then stores that buffer's address into the global pointer dword_2006C48,
  so other code can reach the buffer through the pointer rather than the fixed label. This looks like
  an init-time setup of a fixed work area of some subsystem, but nothing here shows which one. No callers
  are known, so the subsystem (and thus a better prefix) cannot be determined.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0, off_8004D2C then bl ZeroFillByEightWords with r1 = 0x400 clears byte_2006848 for 1KB;
    str r1, [r0] after ldr r0, off_8004D28 stores the buffer's address into dword_2006C48
  refs:
  - bn6f/asm/asm00_1.s:3513
  - 0x08000900 ZeroFillByEightWords
  reproduce: python3 tools/asmcat.py 0x080049E0
