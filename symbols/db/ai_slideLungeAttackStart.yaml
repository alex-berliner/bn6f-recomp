name: ai_slideLungeAttackStart
address: '0x0810B090'
kind: function
status: probable
summary: 'AI attack step: if the battle object can move, sets OBJECT_FLAGS_CANNOT_SLIDE, packs PanelX|PanelY<<4
  into the AI attack vars, stores 4 into HitElement, and calls ai_lungeTowardTargetPanel; otherwise calls
  object_exitAttackState to abort.'
interface: (r0 = battle object ptr, r5 = object, r7 = AI attack vars) -> r0 = clobbered; sets CANNOT_SLIDE
  flag on success
details: First checks object_canMove for the current battle object. If it can move, ORs OBJECT_FLAGS_CANNOT_SLIDE
  into its ObjectFlags1 (preventing further sliding while the lunge runs), packs the object's PanelX (low
  byte) and PanelY<<4 into oAIAttackVars_Unk_40 (presumably the lunge's target/origin panel encoded as
  one halfword), stores 4 into oAIAttackVars_HitElement as the attack's element/property, and calls ai_lungeTowardTargetPanel
  to dash to the target panel and reserve it. If the object cannot move, it instead calls object_exitAttackState,
  abandoning the attack. r4/r6/r7 are caller-supplied pointers (object and AI attack state) kept intact
  across the calls.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_810B0B2 branches to object_exitAttackState when movement is blocked;
    bl object_setFlag1 with r0=OBJECT_FLAGS_CANNOT_SLIDE sets the no-slide flag before the lunge; PanelX/PanelY
    of r5 packed (y<<4|x) into [r7,oAIAttackVars_Unk_40] as the lunge target data; strh #4 into [r7,oAIAttackVars_HitElement]
    then bl ai_lungeTowardTargetPanel performs the dash; mirrors the shape of other ai attack-step handlers
    in the callees list (ai_lungeTowardTargetPanel, object_exitAttackState)'
