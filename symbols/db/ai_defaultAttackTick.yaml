name: ai_defaultAttackTick
address: '0x0810789E'
kind: function
status: probable
summary: 'AI attack-state step handler for the default (element 4) attack: initializes its timer/animation
  on entry, then counts down and leaves the attack state when done.'
interface: (r5 = battle object, r7 = its oAIAttackVars block) -> r0 = clobbered; updates AttackElement,
  CurAnim, StepTimer, may call object_exitAttackState
details: On the first run (AttackElement == 0) it sets AttackElement to 4, zeroes the object's current
  animation (oBattleObject_CurAnim), and copies AttackDuration into StepTimer — i.e. it initializes a
  default attack. On subsequent runs it decrements StepTimer each tick, and once it reaches zero calls
  object_exitAttackState (0x08011714) to end the attack. The element-4 initialization on element==0 acts
  as a lazy 'attack not yet set up' path, so the routine doubles as init and per-frame tick.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bene — first-run check drives the init branch
    (810789E-81078A2); init branch stores #4 into AttackElement, #0 into [r5,#oBattleObject_CurAnim],
    copies AttackDuration to StepTimer; tick branch decrements StepTimer and ''bgt'' keeps waiting until
    it hits zero; bl object_exitAttackState at 81078B8 ends the attack when the timer expires'
