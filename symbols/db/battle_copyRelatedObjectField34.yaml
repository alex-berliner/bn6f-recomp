name: battle_copyRelatedObjectField34
address: '0x080BC424'
kind: function
status: probable
summary: Copies 12 bytes at offset 0x34 from a related battle object into the current battle object.
interface: (r5 = current battle object, uses its RelatedObject1Ptr) -> r0 = pointer past copied range
  in source; r5+0x34..0x3F overwritten
details: Loads RelatedObject1Ptr from the current battle object at r5, reads three words from source+0x34
  (using post-increment ldmia), then stores them at current+0x34. It is a plain 12-byte block copy between
  two battle objects' parallel fields; r0 ends as source+0x40 but is unused by callers. No flags are meaningful
  (mov doesn't set them; ldm/stm don't affect flags). The meaning of the 0x34 field is not evident from
  this function alone.
