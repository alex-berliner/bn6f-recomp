  detail: 'ldr r1,[r5,#oBattleObject_RelatedObject1Ptr] then add r0,#0x34: source is related object +
    0x34; ldmia r0!,{r1-r3} / stmia r0!,{r1-r3}: exact 12-byte copy, nothing else modified; same +0x34
    offset on r5 destination: copies between identical fields of the two objects; five callers in the
    0x80BC268-0x80BC3B8 cluster all call it with no return value consumed'
