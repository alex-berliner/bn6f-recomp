summary: Object handler that cracks the tile under an object if the panel parameters allow it.
interface: void sub_8109794(u32 r0_lo, u32 r1_hi /* = object handle */); clobbers r0 (NZCV), preserves r4 r5 r6
  r7 r10, returns via pop {pc}.
details: 'Pushes the incoming r0/r1 object handle onto the stack, calls object_getPanelParameters, then pops the
  handle back and tests bit 0x40 (the "can-crack" / "cracked-panel" panel-parameter flag) of the returned r0. If
  the bit is clear the panel is crackable, so it calls object_crackPanel with the original object handle. If the
  bit is set the function simply returns without cracking. The trailing pool entries dword_81097AC (0x405FF01) and
  dword_81097B0 (0xC000000) are unrelated constants placed after the function for pool alignment.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
