name: ai_attackVarsTimerTick16
address: '0x08115432'
kind: function
status: probable
summary: '16-frame periodic tick for an AI attack state: counts down a timer and calls a helper each time
  it elapses.'
interface: (r7 = AI attack-state struct) -> void; timer field [r7+TimerOrCycles] decremented and reloaded
details: Reads the byte at oAIAttackVars_TimerOrCycles, decrements it, stores it back, and returns unless
  it hit zero. On zero it reloads the timer with 0x10 (0x11 frames per cycle counting the zero pass) and
  tail-calls sub_8115446, so that helper runs once every 16 frames. It preserves all registers except
  r0 and lr; r7 is the shared AI attack-vars context used by the move-step and throw-object handlers.
