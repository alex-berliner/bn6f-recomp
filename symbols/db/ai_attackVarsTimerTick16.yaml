name: ai_attackVarsTimerTick16
address: '0x08115432'
kind: function
status: confirmed
summary: Ticks a 16-frame countdown in an AI attack-vars block and, when it wraps, respawns the "hop rear" effect
  for the enemy AI.
interface: 'void ai_attackVarsTickTimer16_spawnHopRearFx(r5, r7 /*attack vars*/); // in: r5 forwarded to ai_spawnHopRearEffect,
  r7 = oAIAttackVars*; out: r1/r5/r7 updated only on the wrap path (r1 returned unchanged otherwise); clobbers r0-r3,
  lr, flags'
details: 'Each call decrements the byte at r7+oAIAttackVars_TimerOrCycles and stores it back. If the result is nonzero,
  the timer is simply still counting and the function returns, leaving r1, r5 and r7 untouched (r1 is just carried
  through for the ABI). When the counter reaches zero it is reloaded with 0x10 (16 ticks per cycle) and ai_spawnHopRearEffect
  is called, which spawns the rear-hop visual/movement effect and may modify r1, r5 and r7. Only the timer field
  of the attack-vars struct is touched; the struct pointer lives in r7 and is preserved by the callee contract (r4-r7
  preserved). Thumb, push {lr} / pop {pc} leaf-with-call structure.

  '
