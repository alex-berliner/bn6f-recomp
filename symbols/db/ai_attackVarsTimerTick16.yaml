- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/strb on [r7,#oAIAttackVars_TimerOrCycles] with sub #1: classic frame-countdown timer;
    mov r0,#0x10; strb reload only on the bne fallthrough: fixed 16-frame period; bl sub_8115446 executes
    solely on timer expiry, so it is the periodic action; callers 0x8115272 (AI panel-move step) and 0x8115340
    (throw step) are both AI attack-state handlers sharing the r7 struct'
