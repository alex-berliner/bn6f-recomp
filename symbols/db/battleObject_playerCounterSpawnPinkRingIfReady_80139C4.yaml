open_questions:
- The exact game-term for "emotion == 2" (beast-out vs Soul Unity vs a generic transformation enum) is
  not nailed down; the wrapper `callPossiblyGetBattleEmotion_8015B54` only suggests it's a transformation/emotion
  state.
- The literal `r1=4 / r3=0x10` is encoded x/z for the spawner; whether 4 means "4 panels ahead" or panel
  coordinates is unknown without more callers of the spawner.
- The `r2` argument (described as "mood" by the spawner signature) is just whatever `callPossiblyGetBattleEmotion_8015B54`
  left in r2; its precise role is not visible here.
