name: startScreen_IsTitleAnimationFinished_803E928
address: '0x0803E928'
kind: function
status: confirmed
summary: Checks whether the start-screen (title) animation has finished by comparing its state byte at 0x200B1A0
  against 2.
interface: 'bool startScreen_IsTitleAnimationFinished(void) — in: lr only; out: r0 = state byte, NZCV set from CMP
  r0,#2 (Z set when state == 2)'
details: 'Tiny predicate over the start-screen animation control byte stored at eStartScreenAnimationControl200B1A0

  (0x200B1A0). Loads the single state byte, compares it with 2 (the "animation finished" state), and

  returns to the caller without doing anything else — the comparison flags are the real output, so callers

  branch on EQ/NE to wait for or detect completion of the title/start-screen animation. R0 also carries the

  raw state byte for callers that want more than a yes/no. No writes, no other registers touched. The magic

  value 2 is presumably one of the animation states (e.g. 0 = not started / playing, 2 = done).

  '
