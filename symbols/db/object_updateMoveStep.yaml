name: object_updateMoveStep
address: '0x080D1D90'
kind: function
status: confirmed
summary: 'Advances one frame of a battle-grid object''s movement: integrates velocity, refreshes panel occupancy
  and collision, and resets the move phase when the step timer expires; destroys the object if it lands on an invalid
  panel.'
interface: void object_tickMoveStep_80D1D90(r5 = oBattleObject *obj, r10) -> (r1, r5 = obj)
details: 'Phase-0 (first frame of a new move): stores CurPhase=1, packs PanelX|PanelY<<4 into ExtraVars+0x18 as
  the origin panel, calls object_stepUpdateByVelocity to derive XVelocity/YVelocity, copies Timer2 into Timer, and
  syncs 16.16 X/Y from panels. Each frame: adds XVelocity and YVelocity to the fixed-point X/Y, re-derives grid
  panels via object_setPanelsFromCoordinates, refreshes collision via object_updateCollisionPanels, then decrements
  Timer; on Timer reaching zero CurPhase is reset to 0 so the object can queue its next move. If object_isCurrentPanelValid
  returns false the object is torn down: collision cleared, CurState set to CUR_STATE_DESTROY, CurAction set to
  2.'
