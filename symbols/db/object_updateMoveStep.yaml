name: object_updateMoveStep
address: '0x080D1D90'
kind: function
status: probable
summary: Per-frame handler that slides a battle object toward a target panel over Timer2 frames, destroying
  it if its starting panel becomes invalid
interface: (r5 = battle object) -> r0 = void; updates object X/Y, PanelX/PanelY, CurPhase, CurState/CurAction
  on failure
details: If the object's current panel is not a valid battlefield position, it clears the collision region,
  sets CurStateActionPhase to CUR_STATE_DESTROY and CurAction to 2, i.e. removes the object. Otherwise
  on phase 0 it latches the start panel as (PanelX | PanelY<<4) into ExtraVars+0x18, calls sub_80D1EF2
  (likely computes X/YVelocity from start vs. target panel and Timer2), copies Timer2 into Timer, and
  derives pixel coordinates from the panels. Each subsequent tick it adds X/YVelocity to X/Y, re-derives
  panels from coordinates, syncs the collision record/facing via object_updateCollisionPanels, and decrements
  Timer; when the timer expires CurPhase is reset to 0 so the move can be re-issued. This is the stepped-interpolation
  tail of a move-to-panel action (slide/push/knockback-style movement).
