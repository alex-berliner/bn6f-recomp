name: startMapTransition
address: '0x08005EA2'
kind: function
status: probable
summary: 'Starts a map warp: snapshots the current map group and player position into game state, triggers
  a screen fade, and sets the subsystem index so the next reload restores the destination scene.'
interface: () -> void; no args or return
details: Reads the game state via the toolkit pointer, copies oGameState_MapGroup into oGameState_LastMapGroup
  so the old map is remembered, then calls updatePlayerGameState_800107A to stash the player's X/Y/Z and
  facing for the return trip. It starts a screen fade with SetScreenFade(0xc, 0x10) and finally writes
  0x2c into oGameState_SubsystemIndex, which per the trigger comment routes through cbGameState_80050EC
  to pet_tickSceneAndReloadOnFade, i.e. the next main-loop state reloads the scene once the fade completes.
  This is the standard 'warp to another map' entry, invoked from a chatbox/script command at 0x080425A0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r5,#oGameState_MapGroup]; strh r0,[r5,#oGameState_LastMapGroup] — saves current map
    for return; bl updatePlayerGameState_800107A — known to snapshot overworld player position/facing
    into game state; bl SetScreenFade with (0xc,0x10) — initiates the fade-out of the transition; strb
    #0x2c,[r5,#oGameState_SubsystemIndex] with cbGameState_80050EC tickSceneAndReloadOnFade comment —
    hands control to the reload-on-fade subsystem; caller 0x080425A0 chatbox_80425A0 — invoked from a
    chatbox/script context, consistent with a warp script command'
  refs:
