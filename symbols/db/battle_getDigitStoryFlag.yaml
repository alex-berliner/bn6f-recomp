name: battle_getDigitStoryFlag
address: '0x08138210'
kind: function
status: probable
summary: Returns the story-progress flag controlling visibility of one battle time digit.
interface: (r0 = default_flag, r1 = flag table, r2 = digit_index) -> r0 = enabled story flag or default_flag;
  flags
details: For digit index r2, reads a byte from unk_201CF00 at r2+1 and uses it as a scaled index into
  a table of 16-bit entries. If the selected entry is nonzero, tests it with TestEventFlag; when the event
  is set, the function returns that entry instead of the caller's default value. Otherwise it preserves
  r0. The caller uses this to choose a per-digit flag before passing it to the digit renderer.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: battle_renderTimeBcdDigits calls it after deriving the enabled digit index with get_indexedTimeBcd
    and before rendering that digit (0x08137EA8-0x08137EB8).; The function indexes unk_201CF00 with digit_index+1
    and reads a 16-bit flag through byte_8138240 (0x0813821C-0x08138226).; A nonzero table entry is passed
    directly to TestEventFlag, and a successful test replaces the returned default with that flag (0x08138228-0x08138230).;
    The embedded table contains story/event flag IDs 0xBF through 0xD0, corresponding to per-digit battle-time
    visibility flags.
