name: ai_attackSpawnVariant
address: '0x08111BFE'
kind: function
status: confirmed
summary: Spawns an AI attack projectile at a randomly-chosen enemy-side panel, using one of five targeting-strategy
  variants (or the alliance-region path) selected by index.
interface: ai_attackSpawnVariant(u32 variantIndex /*r0*/, BattleObject* obj /*r5*/, AIAttackVars* aiVars /*r7*/)
  -> u32 success /*r0, 1=yes 0=no*/, r1/r2/r5 = spawn/region data
details: 'variantIndex (0–4) indexes a five-entry jump table (off_8111C74) whose targets are ai_setClosestEnemyPanelTarget,
  ai_getEnemyColumnPanels, ai_countEnemyFilteredPanels, battle_getEnemySidePanelRegion, and ai_getPanelRegionFromAllianceParam.
  Each target fills a 0x18-byte stack buffer with a list of candidate panel bytes and returns a count in r0. If
  the battle object carries flag bit 0xA000 (AI_FLAG_ALLIANCE_PANEL), ai_attackGetAlliancePanelRegion is called
  instead of the table entry. A zero count means failure (r0 = 0). Otherwise GetPositiveSignedRNG + BIOS SWI 6 (Div)
  picks a random panel byte from the buffer. The byte is packed into a composite attack-ID: upper nibble → bits
  19-16, low 3 bits → bits 11-8, constant 0x28 → bits 8-15, aiVars.StepTimer → bits 7-0. The spawn position is computed
  as the object''s (X + dir*0x30000, Y, Z + 0xC0000) using object_getFrontDirection. aiVars.Damage and aiVars.PanelChooseCallback
  are read and forwarded to battle_spawnType5ObjectFromSource_80C579E, which instantiates the attack object. r4,
  r6, r7 are pushed/popped and thus preserved; r5 and r7 are caller-passed inputs that the sub-calls may mutate
  (r5 in particular is re-read into the region result).

  '
