name: ai_attackSpawnVariant
address: '0x08111BFE'
kind: function
status: probable
summary: 'Spawns one of an AI enemy''s attacks: dispatches a per-variant handler, randomly picks an entry
  from its result, and creates the attack object in front of the user.'
interface: (r0 = attack variant index 0-4; r5 = battle object, r7 = AI attack vars) -> r0 = 1 if an attack
  was spawned, 0 otherwise
details: 'The variant index selects one of five handler functions from the table at off_8111C74 (each
  handler is called via `lr=pc; bx r6`). First object_getFlag is checked against 0xA000: if set, sub_8111D28
  runs instead of the table handler. If the handler returns nonzero (a count), GetPositiveSignedRNG and
  SWI 6 (Div) pick a random byte from the caller''s stack buffer (sp[0..count-1]); that byte''s high nibble
  and low 3 bits are packed as (nibble<<24 | bits<<16) with a constant 0x2800 added and the low byte ORed
  with oAIAttackVars_StepTimer. sub_80C579E is then called with that packed value plus position offset
  in front of the object (x += direction*0x30000, z += 0xC0000, direction from object_getFrontDirection)
  and oAIAttackVars_Damage and oAIAttackVars_PanelChooseCallback, likely spawning the attack object; returns
  1 on success.'
