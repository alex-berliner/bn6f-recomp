  - bn6f/asm/asm03_0.s:12495
  - 0x080005CC PlaySoundEffect
  - 0x0802C54C decodePackedIdFields_802C54C
  - 0x08021AA4 getChip8021DA8
  reproduce: python3 tools/asmcat.py 0x0802C0A4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The summary
    and most details match the code: the counter decrement at r5+0xb, decodePackedIdFields, group 0 chip lookup
    against 0x136 (dword_802C16C) comparing first 4 bytes, group 1 dialog with sound 0x95, group 3 sub_802C5E6 with
    0x95, and the strh 0 at [r5+2] tail all check out. However, group 2 plays 0x95 (not 0x95 as stated — wait, that''s
    correct) but the proposal says ''two sub-screens'' while group 2 calls only sub_802C646 (one). Also the claim
    that [r5+0x10] is ''cleared to 0xFFFF path via [r5+2]=0'' is misleading: only [r5+2] is zeroed, [r5+0x10] is
    never cleared. Minor wording: ''sub-screens'' is overreach since only sub_802C646 is called for group 2.; run
    wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
