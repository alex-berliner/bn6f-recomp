name: submenu_dispatchPendingSelection
address: '0x0802C0A4'
kind: function
status: probable
summary: 'After a per-frame countdown at r5+0xb expires, dispatches the packed selection ID at r5+0x10 by group:
  group 0 validates a chip against the chip DB and calls sub_802C75C with sound 0x96; group 1 opens a text dialog
  (sub_802C5B0) with 0x95; group 2 calls sub_802C646 with 0x95 and re-arms the counter to 0x1e while writing state
  8/0 at [r5+2]/[r5+3]; group 3 calls sub_802C5E6 with 0x95; finally zeroes the halfword at [r5+2].'
interface: '(r5 = menu state struct; no register args) -> r0 clobbered by calls; updates struct: [r5+0xb] counter,
  [r5+0x10] pending ID cleared to 0xFFFF path via [r5+2]=0, [r5+2]/[r5+3] state for group 2'
details: 'r5 is a screen/task state struct passed via the frame register. Each call decrements the byte at r5+0xb;
  the body only runs when it hits 0. It then reads the 16-bit packed selection ID at r5+0x10 (0xFFFF = nothing pending)
  and decodes it with decodePackedIdFields into a 2-bit group plus index fields. Group 0 is chip-related: if [r5+4]
  != 2, it looks up the chip ID (bounded by 0x136) in the chip database and compares the first four bytes of the
  44-byte ChipData record against the decoded sub-index (skipping the action if none match), then calls sub_802C75C
  with (index, subindex, 1, ...) and sound 0x96. Group 1 opens a text dialog via textWindow_openDialog_802C5B0 with
  sound 0x95; group 2 calls sub_802C646, plays 0x95, and reloads the counter with 0x1e while setting [r5+2]=8, [r5+3]=0
  as a new screen state; group 3 calls sub_802C5E6 with sound 0x95. In all other paths it stores 0 to halfword [r5+2],
  ending the current state.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#0xb]; sub r0,#1; strb ...; bne locret — one-shot deferred action gated by a countdown; ldrh
    r0,[r5,#0x10] vs 0xFFFF then bl decodePackedIdFields_802C54C — pending packed selection ID with ''none'' sentinel;
    group 0: bl getChip8021DA8, compares ChipData bytes 0-3 to decoded field r4, then bl sub_802C75C and PlaySoundEffect(0x96);
    group 1: bl textWindow_openDialog_802C5B0 then PlaySoundEffect(0x95) — an in-game dialog action; group 2: bl
    sub_802C646, PlaySoundEffect(0x95), strb 0x1e [r5,#0xb], strb 8 [r5,#2] — transitions to a new timed state'
