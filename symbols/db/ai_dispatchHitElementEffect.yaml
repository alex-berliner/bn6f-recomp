name: ai_dispatchHitElementEffect
address: '0x080F5280'
kind: function
status: probable
summary: Dispatches to a per-element handler based on the element the AI-controlled character was hit
  with.
interface: (r7 = AI entity struct, [r7+oAIAttackVars_HitElement] set) -> no return value; tail-dispatches
  to handler for element index
details: Loads the HitElement byte from the AI attack-vars block of the struct in r7, uses it to index
  a 5-entry table at off_80F5294, and performs a Thumb BL-style dispatch (mov lr, pc; bx r1) into the
  matching handler. The five entries line up with the five Battle Network elements (null/fire/aqua/elec/wood);
  the last entry is the known routine ai_attackRecoveryTimerTick, which ticks a recovery timer, suggesting
  the handlers apply element-specific hit consequences or status/recovery processing to the entity. The
  function itself holds no state and just forwards control.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0] indexes the table by the element byte
    (sub_80F5280); off_80F5294 holds exactly 5 handlers, matching MMBN's five elements; mov lr, pc; bx
    r1 makes each table entry a called subroutine, not a jump-table branch; table entry 4 is ai_attackRecoveryTimerTick,
    an AI-status routine, tying the dispatch to hit after-effects
  refs:
  - bn6f/asm/asm31.s:134001
  reproduce: python3 tools/asmcat.py 0x080F5280
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- No callers known, so when this runs in the battle loop (on being hit vs. each frame) is unconfirmed
- The four anonymous handlers (sub_80F52A8..sub_80F5390) would confirm which element maps to which effect
  and whether index 0 is null-element or a default
