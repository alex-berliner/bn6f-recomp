name: sub_813BD90
address: '0x0813BD90'
kind: function
previous_names: []
status: hypothesis
summary: For each (panelX, panelY) within a 7x3 window, appends panel indices of valid AI attack targets into an
  out-buffer using a per-actor displacement table
interface: '(r0 = actorIndex, r1 = centerPanelX, r2 = centerPanelY, r3 = ?, r8 = outBufPtr, r6 = iteration count+1)
  -> r0 = updated outBufPtr written to r8 ; side effects: writes to byte array at *r10->Unk200414c_Ptr[actorIndex*7+col]'
details: "1. Saves r0..r2 and the incremented r6 (iteration count, stored at sp+0xc) plus initial r8 (outBufPtr\
  \ at sp+0x10) on stack.\n  2. Calls battleObject_runAIDispatchTable_813B7A0(r0=actorIndex, r1=r3) -> r7, returning\
  \ a 7x7 attack-pattern bitmask/byte array for that actor.\n  3. Recomputes r1 = r1_saved - 3 (leftmost column\
  \ of the window), r2 = r2_saved - 3 (top row).\n  4. Builds a base pointer r6 into the toolkit's Unk200414c_Ptr[actorIndex*7\
  \ + col], i.e. `r10->oToolkit_Unk200414c_Ptr + (actorIndex*7 + (r1_saved - 3))`.\n  5. Iterates a 7-wide column\
  \ × 7-tall row nested loop; the outer counter (r5) advances r6 by +7 and r7 by +7 per row, while inner counter\
  \ (r3) advances by +1.\n  6. For each cell it loads `r4 = r7[r3]` (one byte of the attack pattern) and `r0 = r6[r3]`\
  \ (one byte of the target panel table). If either is zero, skips.\n  7. When both non-zero, scans `byte_2006C50`\
  \ for an existing entry equal to r0; if not found (after up to 0x31 probes), calls sub_813C624(r0=panelIndex,\
  \ r1=0, r2=r1_panel, r3=r2_panel) — likely a \"can attack this panel\" check that overwrites r0 with a target\
  \ id and returns success in r1. If that call succeeds, stores r0 at *(r8) and increments r8.\n  8. After the loop,\
  \ writes the final r8 pointer back and returns it in r0 (the function returns r8, used to keep the write cursor\
  \ across iterations of the caller).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battleObject_runAIDispatchTable_813B7A0` returns r7 used as a per-actor 7x7 byte table (r3 = 0..6,
    r7 += 7 per row). - `r6 = r10 + oToolkit_Unk200414c_Ptr`, then `add r6, r6, r3` where `r3 = 7*(r2_saved-3) +
    (r1_saved-3)` indexes a per-actor 7-wide displacement table (asm lines ~`add r6, r6, r3`). - The nested `cmp
    r5, #7` / `cmp r3, #7` bounds the inner loop to a 7x7 region. - The bytes at `byte_2006C50` are scanned linearly
    (`ldrb r5,[r4]; cmp r5,r0; add r4,#1`) to deduplicate written panel indices, suggesting it''s a small global
    "already used" buffer of size ~0x32 (capped by `cmp r1,#0x31`). - `bl sub_813C624` is called with r0=panel index,
    r1=0, r2=panelX, r3=panelY, and only when its return is non-zero is the panel id written out (`strb r0,[r4];
    add r4,#1`). - The final return of r0 = `ldr r0,[sp,#0x10]; mov r8,r0` shows the outBuf pointer is propagated
    back through r8 to the caller (sub_813BD24) for the next actor. - Snapshots show r1=1/3 (column start) and r2=4
    (row), with r0 either 0x34 or 0x90 (two actor indices), matching a 7x7 attack window centered at column+r1,
    row+r2. - The exit r0 = 0x02006C50/0x02006C51 (one or two bytes written) is the caller''s output buffer, confirming
    this function appends to a byte list of target ids.'
