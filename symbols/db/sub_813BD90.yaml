open_questions:
- The exact semantics of byte_2006C50 — global deduplication set vs per-actor scratch; the 0x31 cap and linear scan
  imply a small fixed table.
- What sub_813C624 actually validates (legal-target lookup vs damage estimate vs pathing) is not visible from this
  function alone.
- The meaning of r3 on entry (passed straight through to sub_813B7A0) — likely an actor-mode/team selector.
