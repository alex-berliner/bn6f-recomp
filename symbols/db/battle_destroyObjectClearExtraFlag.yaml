name: battle_destroyObjectClearExtraFlag
address: '0x080DAB8A'
kind: function
status: probable
summary: Destructor wrapper that clears a flag byte in the object's extra-vars struct before destroying
  the battle object.
interface: (r0 unused; r5 = battle object pointer) -> r0 = result of object_genericDestroy
details: Reads the pointer at oBattleObject_ExtraVars+4 from the battle object in r5; if non-null, stores
  0 into its byte at offset 0, presumably disabling some linked state (e.g. a partner/child object's active
  flag). It then tail-calls object_genericDestroy, which releases panel tile reserves, collision data,
  and the object's memory. No callers are known, so which object type uses this and what the cleared flag
  means is unknown.
