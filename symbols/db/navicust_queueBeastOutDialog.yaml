name: navicust_queueBeastOutDialog
address: '0x0813756C'
kind: function
status: probable
summary: Conditionally triggers MegaMan's NaviCust-context dialog about Beast Out and advances the owning
  task's state.
interface: (r0 unused/none, r4-r5 = task/controller context) -> r0 clobbered; writes byte 0x88 to [r5];
  flags preserved by pop {pc}
details: First tests event flag EVENT_EE (the Beast Out-related story flag); if clear it returns immediately.
  It then calls sub_81375F4 with (0x3C, 0x20, 0) - likely a map/area-position check - and sub_8137618,
  bailing out if either fails (beq), and also bails if bit 3 of the chatbox/cutscene flag word eFlags2009F38
  is set (dialog already active/busy). When all conditions pass it runs text script 0x26 through RunTextScriptNaviCustDialog
  and stores 0x88 into the byte at [r5], evidently the state/next-step field of the owning controller
  (r5), so the sequence resumes elsewhere after the dialog.
