name: PlaySoundEffect
address: '0x080005CC'
kind: function
status: confirmed
summary: Thin wrapper that asks the M4A sound engine to start playing the sound effect / music track whose ID is
  given in r0.
interface: void PlaySoundEffect(u32 soundId /* r0, plus args r1-r3 forwarded */)
details: 'Trivial two-instruction wrapper: pushes r1-r7 and lr, tail-calls m4a_800061E

  (the M4A driver''s start-song/play-sequence entry, which reads the track/SFX

  number from r0 and any other arguments the callee convention uses), then pops

  r1-r7 and pc. The push/pop pair means r1-r7 are preserved across the call

  from the caller''s point of view even if the callee clobbers them, so it acts

  as a safe, register-friendly entry point into the sound engine. r0 and r2/r3

  (whatever the callee returns) are not preserved; NZCV flags are whatever the

  callee leaves behind since pop does not affect them. The game name comes from

  typical usage: callers pass a sound ID to trigger a jingle, SFX, or BGM track.

  '
