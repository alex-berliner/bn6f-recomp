name: chatbox_stepTextPrinter_801CE92
address: '0x0801CE92'
kind: function
status: confirmed
summary: Picks a text-advance delay based on the message window's current line/state and starts the text printer,
  ending the message (object state 8) once the state reaches 0x30.
interface: void chatbox_stepTextPrinter(struct MessageWindow *win /* r5 */) -> r0 = win->msgState, flags from CMP
  r0,#0x30; preserves r4-r7
details: "r5 points at a message-window/chatbox object. Field +7 is a message sub-state\n(the line/text-chunk index\
  \ within the message) and field +6 is passed through to\nthe printer as its fourth argument. The sub-state selects\
  \ one of three text-advance\ndelays passed in r2 to the text printer sub_802FE7A (called with r0=0, r1=0x40):\n\
  \  1 or 0x2F -> 0x34\n  2 or 0x2E -> 0x38\n  3 or 0x30 -> 0x40\nSub-states other than 1/2/3/0x2E/0x2F/0x30 skip\
  \ the printer call entirely and fall\nthrough to the end-of-message check. After (or instead of) printing, if\
  \ the\nsub-state is still < 0x30 the routine just returns with it in r0. Once it reaches\n0x30 the whole message\
  \ is finished: the object's main state byte at +0 is set to 8\nand field +7 is cleared to 0. The three delay groups\
  \ look like slow/medium/fast\ntext speeds for successive lines of a multi-line message.\n"
