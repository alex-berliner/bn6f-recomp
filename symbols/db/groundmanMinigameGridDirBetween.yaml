- method: assembly-reading
  date: '2026-10-19'
  detail: 'both points run through ConvertGroundmanMinigameGridCoordsToMapCoords before use (bl at offsets
    2 and 8); delta r0-=r2, r1=r3-r1 then bl calcAngle_800117C computes the A->B angle; add #0x10 / lsr
    #4 / and 0xF / lsr #1 / sub #1 / and 7 quantizes the angle byte into 8 rounded sectors with a one-index
    shift; sole caller sub_8092F1E is undocumented, but the callees'' known summaries fully match this
    pipeline'
