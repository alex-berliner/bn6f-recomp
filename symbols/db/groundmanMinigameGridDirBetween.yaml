name: groundmanMinigameGridDirBetween
address: '0x08143EB0'
kind: function
status: probable
summary: Returns an 8-way direction index pointing from one Groundman-minigame grid cell to another.
interface: (r0 = packed grid coords of point A, r1 = packed grid coords of point B) -> r0 = direction
  0-7 from A to B; flags clobbered
details: 'Converts both grid coordinate pairs to map coordinates via ConvertGroundmanMinigameGridCoordsToMapCoords,
  forms the delta B-A, and passes it to calcAngle_800117C (BIOS ArcTan2) to get a 0-255 angle byte. It
  then quantizes that angle into eight 32-degree sectors: (angle+0x10)>>4 rounds, mask 0xF wraps, >>1
  halves to 0-7, and the -1 with mask 7 shifts the sector boundaries so the result is a dir enum where
  sector 0 starts at angle 16, i.e. dir 7 is centered on angle 0. The rounding (+0x10 before shifting)
  means diagonal-ish angles snap to the nearest cardinal/diagonal direction. Input points appear to be
  packed in single registers since only r0/r1 (and the saved r1 in r4) are forwarded to the converter.'
