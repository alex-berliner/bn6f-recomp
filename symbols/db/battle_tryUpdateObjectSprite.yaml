- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetBattleMode; cmp r0,#6; beq loc_80BC446 bypasses battle_isPaused check in mode 6; ldrh
    r0,[r3,#oBattleObject_HP]; cmp r0,#0; beq exit — dead objects never update; ldr r1,dword_80BC4F0 =0x110C00;
    tst r0,r1; bne exit — flag mask gates the update; bl battle_isTimeStop; bne exit — no sprite advance
    during timestop; bl UpdateBattleObjectSprite; mov r4,#1 — success path sets the return flag
