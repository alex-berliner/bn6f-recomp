name: battle_tryUpdateObjectSprite
address: '0x080BC434'
kind: function
status: probable
summary: Conditionally advances one battle object's sprite, returning 1 if the update ran.
interface: (r5 = battle object pointer, set by caller) -> r0 = 1 if sprite updated this frame, 0 otherwise
details: 'Wrapper around UpdateBattleObjectSprite that first validates the object: it fetches the related-object
  pointer at r5+oBattleObject_RelatedObject1Ptr, bails if that object''s HP is 0, and bails if its collision
  data''s ObjectFlags1 has any bit of mask 0x110C00 (set). If GetBattleMode returns 6 the pause check
  is skipped; otherwise the object is not updated while the battle is paused. Also skips update during
  a time-stop. Returns 1 only when UpdateBattleObjectSprite was actually called. The odd use of r5 without
  setup means callers must preload the object pointer into r5.'
