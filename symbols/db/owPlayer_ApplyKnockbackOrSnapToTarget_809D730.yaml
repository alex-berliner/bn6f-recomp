name: owPlayer_ApplyKnockbackOrSnapToTarget_809D730
address: '0x0809D730'
kind: function
previous_names:
- sub_809D730
status: probable
summary: 'Overworld player per-frame move handler: if the countdown has not finished, integrates the cached
  X/Y velocities into the player''s coordinates and marks the per-tick state as 2; otherwise snaps the
  player onto the precomputed target X/Y/Z.'
interface: '(r5 = OWPlayerObject*) -> ; side effects: writes Unk_38/Unk_3c delta into X/Y (and sets Unk_13
  = 2), or copies NextX/Y/Z into X/Y/Z of the OW player object'
details: "- Single caller chain in the snapshots returns lr=0x0809d650, which sits inside the player tick\
  \ jump table; r5 holds the OWPlayerObject base (consistent with the project convention seen in `ow_player.s`).\n\
  \  - Calls `owPlayer_TickCountdownOrWait_809DDCC` and branches on its return: zero means the countdown\
  \ is still pending and a \"wait\" state is needed.\n  - On non-zero return (countdown done): `X += Unk_38`\
  \ and `Y += Unk_3c` (the `Unk_38`/`Unk_3c` fields look like per-frame X/Y deltas), then `Unk_13 = 2`\
  \ (per-frame sub-state 2 = \"moving / applying velocity\"). Returns via `pop {pc}`.\n  - On zero return\
  \ (countdown still running, wait state): copies `NextX -> X`, `NextY -> Y`, `NextZ -> Z` so the player\
  \ visually snaps onto the target grid cell each frame, with no change to `Unk_13`.\n  - Note: this differs\
  \ from the typical pattern where the \"done\" branch would apply the deltas. Here the non-zero (done)\
  \ return applies the per-tick delta and the zero (not-done / wait) return snaps to target. That matches\
  \ `owPlayer_TickCountdownOrWait_809DDCC`'s contract (it reports \"not done\" via zero only when the\
  \ 0xC00000 status bits are set).\n"
