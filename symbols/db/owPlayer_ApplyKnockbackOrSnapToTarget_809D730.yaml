open_questions:
- The semantics of "non-zero return = apply delta, zero return = snap to target" (rather than the reverse)
  is unusual; it might actually be that `owPlayer_TickCountdownOrWait_809DDCC` reports 1 while waiting
  and 0 when the countdown has fully expired, but the contract comment says the opposite. Verifying `owPlayer_TickCountdownOrWait_809DDCC`'s
  exact return convention would settle it.
- Whether `Unk_38`/`Unk_3c` are velocities, per-tick displacements, or knockback deltas (e.g. for being
  pushed by an object) is unknown — depends on what writes them upstream.
- Meaning of `Unk_13 = 2` (per-frame state byte) is not documented in the OWPlayerObject struct.
