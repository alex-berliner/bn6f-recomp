- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl owPlayer_TickCountdownOrWait_809DDCC` at 0x0809d732 followed by `tst r0, r0` / `beq loc_809D750`
    (asm:746). - On the `beq` not taken: `ldr r0, [r5,#oOWPlayerObject_Unk_38]` then `ldr r1, [r5,#oOWPlayerObject_X]`,
    `add r1, r1, r0`, `str r1, [r5,#oOWPlayerObject_X]` — direct addition of Unk_38 into X (same pattern
    repeated with Unk_3c into Y). - After the two add/stores, `mov r0, #2` / `strb r0, [r5,#oOWPlayerObject_Unk_13]`
    writes the per-tick state byte 2. - On the `beq` taken path (`loc_809D750`): three `ldr … NextX/Y/Z`
    then three `str … X/Y/Z` to overwrite the current coords with the target NextX/Y/Z. - Function saved/restores
    only `lr` via `push {lr}` / `pop {pc}`, so r5 is the implicit "this" pointer (OWPlayerObject*), consistent
    with the project''s r5-base calling convention. - Captured calls all share `lr=0x0809d650`, `sp=0x03007db4`,
    identical r0-r3 — i.e., it is always called from the same per-frame player update site.'
