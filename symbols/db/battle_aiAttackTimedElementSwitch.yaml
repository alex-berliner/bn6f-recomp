name: battle_aiAttackTimedElementSwitch
address: '0x080ED118'
kind: function
status: probable
summary: AI attack handler that sets a 24-frame timer and switches the attack's element on its first frame,
  then ends the attack when the timer expires.
interface: '(implicit: r7 = oAIAttackVars owner, r5 = battle object) -> void; sets/clears oAIAttackVars_AttackElement,
  oAIAttackVars_StepTimer, oBattleObject_RelatedObject1Ptr, oAIData_TempAttackObjectPtr'
details: First invocation (AttackElement == 0) initializes StepTimer to 0x18 frames and rewrites AttackElement
  to 4, so the attack runs with a different element than declared. Each later call decrements StepTimer
  and does nothing until it goes negative. On expiry it zeroes the object's RelatedObject1Ptr and the
  AIData TempAttackObjectPtr, then calls object_exitAttackState to leave the attacking state. It runs
  per-frame from the AI attack state machine, so it relies on r5/r7 being set up by the caller.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; cmp r0,#0; bne — one-time init guarded on element
    being unset; mov r0,#0x18 / strh StepTimer and mov r0,#4 / strb AttackElement — 24-frame duration
    and element rewrite; ldrh StepTimer / sub #1 / strh / bge return — per-frame countdown until underflow;
    str r0,[r5,#oBattleObject_RelatedObject1Ptr] and str r0,[r1,#oAIData_TempAttackObjectPtr] — nulls
    attack refs on expiry; bl object_exitAttackState — known callee that ends the attack state'
  refs:
  - bn6f/asm/asm31.s:116003
  - 0x08011714 object_exitAttackState
