details: "Top-level entry point for opening the chip folder. Zeros a state flag\n(via sub_81237E0(0)),\
  \ then runs the standard \"init\" sequence used across\nthe chip-folder UI: sub_81237E0, chipFolder_initGfx_812386C,\
  \ sub_8046664,\nloads a tile/resource blob at byte_8123400 through sub_80465A0, and runs\ntwo more init\
  \ helpers (sub_8123A80, sub_8123AB8). It then sets up two\nwindow panels on the IWRAM buffer unk_201D220:\n\
  \  - sub_81352A0(unk_201D220, byte_81233D8, 0x9D, 0x48, 4)\n  - sub_8135314(unk_201D220, off_81234FC,\
  \ 0x9D, 0x48, byte_8123508)\nThe 0x9D/0x48 pair is the standard chip-folder window size (x=0x9D,\ny=0x48).\
  \ Finalizes screen setup via sub_8123D24.\n"
