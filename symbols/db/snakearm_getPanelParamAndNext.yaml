name: snakearm_getPanelParamAndNext
address: '0x08114A4A'
kind: function
status: probable
summary: Fetches the alliance-dependent panel-effect parameter entry for the snakearm and passes it to
  the next snakearm routine.
interface: (r0 = battle object/work, r3 = param table byte_8114C30) -> r0 = args pointer from GetAllianceDependentPanelParamArgs
  passed on to sub_8114C90
details: Loads the fixed table address byte_8114C30 into r3 and calls GetAllianceDependentPanelParamArgs,
  which indexes an 8-byte panel-effect parameter entry by the battle object's alliance (team) field and
  returns the entry's param word and args pointer. It then immediately calls sub_8114C90 with those results,
  forming one step of the snakearm AI flow in snakearmAI_81149E0. No local state is kept; r4-r7 are preserved.
  The .word 0 and padding after the pop suggest this is part of a jump-table-dispatched AI state handler.
