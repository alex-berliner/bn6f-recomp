- Exact semantics of sub_808CCAC/sub_808CD04/sub_808CD24/sub_808CFB8/sub_808D108 — they roll the encounter
  and decide forced vs sneak-run paths, but the asm at this level only shows the dispatch.
- Who calls this routine (the contract lists no callers); almost certainly wired into the overworld main-loop
