name: pet_tryStartRandomEncounterStep_808CB0C
address: '0x0808CB0C'
kind: function
status: confirmed
summary: 'Per-step state machine that drives random encounters in the PET area: gates on event flags, ticks a 32-step
  countdown, snapshots player position on first activation, then on expiry (or BBS touch trigger) either rewards
  a Net PET encounter or attempts a jack-in battle.'
interface: '/* r10 = toolkit pointer (toolkit+oToolkit_GameStatePtr → GameState), lr = return addr */

  /* r2, r3, r10, r11 written back to caller; r4–r9, r12 preserved via push/pop */

  /* no return-value register; side-effects via globals and event flags */

  void pet_randomEncounterStepTick(u32 r10 /* toolkit */);

  '
details: "Operates on a 32-byte data block whose base pointer is loaded from dword_808CA44 (resolves to 0x2000B40\
  \ area):\n  +0x0C (u8): \"active\" sentinel – 0 means this is the first activation.\n  +0x03 (u8): countdown step-counter,\
  \ reset to 0x20 (32) on activation or re-roll.\n  +0x1A (u16): player X coordinate captured at first activation.\n\
  \  +0x1C (u16): player Y coordinate captured at first activation.\n\nGate 1 – event flags: EVENT_9D6 AND EVENT_9D8\
  \ must both be set; otherwise the function exits early.\nGate 2 – map exclusion: if GameState.MapGroup == 0x85\
  \ the encounter is suppressed (no sound, no activation); execution falls through to the PET-menu check.\nSound:\
  \ on a successful gate pass (map != 0x85) it plays sound ID 0x1F with parameter 0x13B via sound_8000672.\nGate\
  \ 3 – PET menu: TestPETMenuDataFlag(1) – if the flag is NOT set (bne taken) the encounter is cancelled.\n\nFirst-activation\
  \ path (byte+0x0C == 0):\n  Reads player tile coords via ReadOWPlayerObjectCoords (arithmetic right-shift 16 to\
  \ extract 16-bit tile position), stores them at +0x1A/+0x1C, and writes 0x20 to the step counter.\n\nStep tick\
  \ (every call):\n  Decrement +0x03.  When it reaches 0, call sub_808CCAC (re-roll / choose new encounter) and\
  \ reset the counter to 0x20.\n\nBranch after the counter tick:\n  reqBBS_pollTouchTrigger_808CD04 tests the touchscreen\
  \ (BBS) trigger.\n    If touched (non-zero / !zf): run pet_randomEncounterRewardStep_808CD24 (gives a Net PET\
  \ reward or triggers the next encounter phase).\n    If not touched: clear EVENT_BF1, call jackIn_attemptJackInCheck_808CFB8;\
  \ on success (r0==1) call ow_setupMapTiles_808D108 to prepare the jack-in transition.\n\nBattle init tail (always\
  \ reached after the touch/jack branch):\n  battle_pickBattleStateInitPtr_808CC34 selects a battle-state init record;\
  \ if non-null, StartCutscene is invoked to launch the encounter cutscene.\n\nQuirks:\n  - The \"active\" byte\
  \ at +0x0C is read but never written in this function; it is presumably set by an earlier initialisation routine.\n\
  \  - r5 is pushed/popped so the caller's r5 is invisible to changes made here, yet the lifter lists r5 as an \"\
  output\" (likely a trace artifact from callee calls).\n  - EVENT_9D6/9D8/0xBF1 are 16-bit event-flag constants\
  \ passed as two immediates via movflag pseudo-op.\n  - Map-group check uses only a single byte (oGameState_MapGroup),\
  \ meaning entire map families are excluded rather than individual maps.\n"
