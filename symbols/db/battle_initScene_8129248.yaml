name: battle_initScene_8129248
address: '0x08129248'
kind: function
status: confirmed
summary: Initializes the battle scene by clearing VRAM/GFX buffers, priming the toolkit's render-info block (0x1F40
  at offset 0, rest zeroed), starting the opening cutscene, and writing the variant sub-bytes pulled from dword_8129180
  into the state struct held in r5.
interface: "void battle_initScene_8129248(void /* r5=state, r10=toolkit */);\n  // inputs:  r5 (state struct ptr),\
  \ r10 (toolkit ptr), lr\n  // outputs: r0 = 0, r1 = low byte of the dword_8129180 entry that sub_8120CC8 returned\
  \ in r1;\n  //          NZ reflects r0; preserves r4-r7.\n"
details: 'Clears VRAM (zeroFillVRAM, ZeroFill_byte_3001960, ZeroFillGFX30025c0), calls sub_80015FC(0x10)

  and sub_8046664, then takes the render-info pointer from r10 via the oToolkit_RenderInfoPtr

  offset, writes 0x1F40 (8000) as the first halfword at offset 0 and zeroes the next six

  halfwords (offsets 0x10..0x1A), so the render info gets a fresh BG row/cycle count plus a

  cleared viewport/affine area before the cutscene starts. Runs scene_loadAndStartCutscene_812AF18

  for the battle-opening cutscene. After it returns, writes 4 into state+1 (subState = 4, the

  "post-cutscene" battle state), 0 into state+2, and 0x3C into eStruct200BC30+0xC (a small

  timer/frame counter, likely the 60-frame battle intro delay). Calls sub_8120CC8(0,

  dword_8129180) and stores the two result bytes into state+0x17 and state+0x18 - this is the

  "variant bytes" consumed by the wider battle initializer (chip pool, encounter table, etc.);

  state+0x1B is then zeroed. Final r0 = 0 sets NZ for the r0==0 check, r1 carries the high byte

  sub_8120CC8 left behind. No flags are produced by the function itself beyond the r0 write.

  '
