name: ai_attackStepDispatch_81151A0
address: '0x081151A0'
kind: function
status: confirmed
summary: 'Dispatches an enemy AI''s current attack step: reads the attack-phase byte from the attacker''s
  AI attack vars and jumps to one of six per-step attack handlers.'
interface: void ai_attackStepDispatch_81151A0(void); // r7 = attacker AIAttackVars, r5/r6/r10 inputs passed
  through; returns whatever the selected handler leaves in r1/r5/r8-r12
details: 'r7 points at the attacker''s AIAttackVars struct; the byte at oAIAttackVars_HitElement doubles
  as the attack-step/phase selector. The handler table at off_81151B4 holds six Thumb entry addresses:
  ai_chargeAttackInitAndStep, sub_811523C, ai_attackVars_runMoveStep_8115272, ai_throwObjectStep, ai_hopStepUpdate,
  sub_8115404. The table is indexed with the raw byte (ldr [r1,r0], no <<2), so the byte value IS the
  byte offset into the word table - only values 0, 4, 8, 12, 16, 20 are valid; other values would load
  a misaligned/garbage address. The selected handler is entered with r0 = HitElement (the raw selector)
  and r1 = the handler address itself, via the mov lr, pc; bx r1 idiom (ARM->Thumb interwork long branch).
  Callers consume the handler''s resulting register state directly (r1, r5, r8-r12), so this thunk has
  no observable outputs of its own. The two padding bytes after pop {pc} pad the function to word alignment
  for the table pointer.'
