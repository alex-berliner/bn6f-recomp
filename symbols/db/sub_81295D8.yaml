status: hypothesis
summary: 'Per-frame update for the eStruct200BC30 entity: runs its update handlers, advances a jump-arc state when
  a fade isn''t active, and otherwise boots the intro sequence (chatbox + screen fade).'
interface: void sub_81295D8(void) /* r4 r5 r6 r10 lr in; r5 r8 r9 r10 r11 r12 out; r6 r7 r8 r9 preserved; clobbers
  nz c v r0 r1 r2 r3 r4 lr */
details: "Operates on a small struct pointed to by r5 (offsets 0x1B, 0x1, 0x2, 0x3 are byte fields).\nSequence:\n\
  \  \"1. Always: entity_runAllUpdateHandlers_80465BC and sub_80465F8 (per-frame entity plumbing).\"\n  2. Bail\
  \ (return) if IsScreenFadeActive is false (i.e. only do work while a fade is in progress).\n  3. Read eStruct200BC30_getJumpOffset00;\
  \ if the jump offset is <= 0, or sub_8049D42 returns non-zero, fall through to the intro branch.\n  4. Jump-arc\
  \ toggling: bit 0x2 (mask 4) of r5+0x1B is a \"rising/falling\" flag.\n     - If bit was clear: call sub_8048F9C(1)\
  \ then OR the bit in (mark the jump as having started/ended).\n     - If bit was set: clear the bit, write 4 to\
  \ r5+1, write 0 to r5+2 (reset the arc state).\n  5. Intro branch (loc_8129620): sub_812AFC8(); sub_812B1DC(&byte_812913C);\
  \ sub_812B2C4(0xE);\n     write 4 to r5+2, 0 to r5+3; sub_812B530(); chatbox_runScript_803FD9C_on_eTextScript201BA20(1);\n\
  \     chatbox_set_eFlags2009F38(0x40); SetScreenFade(8, 0x10).\nr4/r6/r10 carry the engine context (entity manager,\
  \ screen, etc.) and are not modified here beyond\nthe listed clobbers. The struct's 0x1B byte doubles as both\
  \ a state bitfield and a flag for the\n\"already showed intro\" / \"jump finished\" decision, and 0x1/0x2/0x3\
  \ hold small sub-state slots\n(current step, frame counter-ish, etc.).\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
