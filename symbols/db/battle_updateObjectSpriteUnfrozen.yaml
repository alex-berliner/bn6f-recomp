name: battle_updateObjectSpriteUnfrozen
address: '0x080BCB34'
kind: function
status: probable
summary: Updates one battle object's sprite only when the battle is neither paused nor time-stopped, returning
  whether the update ran.
interface: (r0 = battle object pointer) -> r0 = 1 if sprite updated, 0 if skipped; flags from battle_isPaused/battle_isTimeStop
  byte reads
details: Thin guard wrapper around UpdateBattleObjectSprite. It first checks the battle-paused flag and
  then the time-stop flag (battle flags bit 2) via battle_isPaused and battle_isTimeStop, branching to
  the exit with r4 = 0 if either is set. Otherwise it falls through to UpdateBattleObjectSprite with r0
  (the battle object) still intact, sets r4 = 1, and returns r4 as the success/updated flag. The pause
  and timestop checks mirror the conditions UpdateBattleObjectSprite itself uses, so this wrapper adds
  a global freeze gate before per-object updates.
