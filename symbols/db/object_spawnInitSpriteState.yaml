name: object_spawnInitSpriteState
address: '0x080E0FC0'
kind: function
status: probable
summary: Initializes a battle object's sprite on spawn (load, shadow, anim, priority, flip) and switches it into
  its update state.
interface: (r5 = object header pointer, no args in r0-r3) -> r0 = result of sub_80E100A; sets oObjectHeader_Flags
  |= 3, timer = 10, state = CUR_STATE_UPDATE
details: Using r5 as the current object header (set by the caller), it sets Flags |= 3 (likely 'active/visible'
  bits), loads sprite resource 0x80 with args (0x10, 5), enables the shadow, starts animation 1, loads the animation
  data and updates the sprite once, sets OAM priority from the object's DirectionAngle, sets Timer to 10 frames,
  and applies the object's effective flip from object_getFlip. It then writes CUR_STATE_UPDATE into CurStateActionPhaseAndPhaseInitialized
  and tail-runs sub_80E100A (presumably the update-state handler entered immediately). A stray path calls object_freeMemory,
  suggesting a variant/exit path in the surrounding code. Which specific entity this spawn belongs to is unknown
  since no caller is identified.
