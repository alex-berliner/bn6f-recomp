name: battle_dispatchModeHandler_8133540
address: '0x08133540'
kind: function
status: confirmed
summary: Battle-side mode dispatcher that calls one of four per-mode handlers (submenu input, spawn-panel
  confirm, or two local routines) selected by [r5+0x68].
interface: 'void battle_dispatchModeHandler_8133540(void); // in: r4 (passed through), r5 = object pointer,
  r10 (passed through), lr = return; out: r5, r8-r12 as left by the selected handler; clobbers r0-r3,
  r6, r7, nzcv'
details: "Trampoline/dispatcher for a battle-mode state machine. Loads the object pointer from r5,\nreads\
  \ the mode/state index from [r5+0x68], and indexes the 4-entry table at off_8133554:\n  0: submenu_handleConfirmOrExitInput\n\
  \  1: battle_confirmSpawnPanelWrap\n  2: sub_81335C0\n  3: sub_81335D8\nThe selected Thumb handler is\
  \ invoked via `mov lr, pc; bx r0`, with r0 = the handler's\nown address and r1 = the mode index. Because\
  \ the handler is reached through a computed\naddress and whatever registers it leaves in r5 and r8-r12\
  \ are this function's outputs,\nthe call must stay in register form (a typed wrapper cannot pass those\
  \ through).\nThe extra 2 bytes of padding after `pop {pc}` align the handler table to a word boundary.\n\
  The mode index presumably doubles as an argument to the handlers (r1), and the handlers\nare expected\
  \ to keep or update the state themselves (e.g. write a new value to [r5+0x68]).\n"
