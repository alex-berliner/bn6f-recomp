open_questions:
- The semantic meaning of Unk_1f (which the project's BattleObject struct labels as part of `Unk_1e_Unk_1f` at 0x1e)
  and what differentiates the two dispatched targets (0 -> sub_80166D0, 1 -> sub_8016730) is unknown. Deeper naming
  of the targets would clarify it.
