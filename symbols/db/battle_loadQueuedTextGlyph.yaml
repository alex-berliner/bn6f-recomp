name: battle_loadQueuedTextGlyph
address: '0x0811B71C'
kind: function
status: probable
summary: Pops one queued text entry for an object's number/text popup and loads its glyph into the matching
  text-buffer/VRAM slot via the text renderer.
interface: (r0-r3 clobbered; r5 = object, r10 = toolkit) -> r0 = undefined; stores entry type to [r5,#0xE],
  glyph param to toolkit->Unk200a220+8; early-returns if no queued entry in range
details: 'Reads the queue head at unk_2037780+0x24, adds the object''s slot byte [r5,#4], minus 2; bails
  if negative or >= the count at +0x1E. The entry at word_2023FA0 + idx*4 holds a char halfword and a
  param halfword: char==0x14C => type 4, param!=0 => type 0, otherwise type 2, stored to [r5,#0xE]. The
  param halfword is written to the toolkit''s render-state (Unk200a220+8). The char index (char-0x90)>>2
  selects one of nine 0x400-byte work buffers (byte_2017A00..unk_2019A00) and one of nine VRAM destinations
  (0x06010680..0x06014E80, from byte_811B7B0), then calls renderTextGfx_8045F8C with font base TextScript873EA50,
  glyph-chunk table dword_86B7AE0, and fixed args r4=8, r5=1, r7=0.'
