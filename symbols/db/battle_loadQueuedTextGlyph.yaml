- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r6,#0x24]; ldrb r1,[r5,#4]; sub r0,#2; cmp r0,r1(+0x1e) bounds-checks a per-object
    queue slot; word_2023FA0+idx*4: char==0x14C=>r4=4, [r1,#2]!=0=>r4=0, else r4=2, stored to [r5,#0xE]
    — entry classification; sub r1,#0x90; lsr r1,#2 indexes off_811B784 (nine 0x400-spaced RAM buffers)
    and byte_811B7B0 (nine descending VRAM addrs 0x06014E80..0x06010680); bl renderTextGfx_8045F8C with
    r0=TextScript873EA50, r2=buffer, r3=VRAM dest, r6=dword_86B7AE0 — hands the glyph chunk to the text
    renderer; Called from object_scaleGrowStep''s grow phase, consistent with battle number popups appearing
    as the object scales up'
