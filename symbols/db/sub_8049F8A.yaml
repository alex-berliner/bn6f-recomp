summary: chatbox step that conditionally bumps a state byte at r5+1 to 0x0C and then calls the chained step sub_8049F70
interface: 'void chatbox_step_8049F8A(void);  // in: r5 (chatbox control struct), r10, lr; out: r8 r9 r10 r11 r12;
  clobbers r0 r1 r2 r3 lr, flags nz c v; preserves r4 r5 r6 r7 r8 r9 r12'
details: 'Guarded by chatbox_mask_eFlags2009F38(0x80): if the flag is currently masked (returns

  non-zero, BNE taken) the function skips straight to the tail call into sub_8049F70.

  Otherwise it calls sub_803BB80; when that returns non-zero (BEQ not taken) it writes

  0x0C to offset +1 of the r5-pointed control struct (treating r5 as a struct of u8 fields

  where byte 0 is something else, byte 1 is a phase/state code). The write of 0x0C looks

  like a transition into chatbox phase/state 12. After the conditional branch the function

  unconditionally tail-calls sub_8049F70, sharing the r5/r10 input struct and the same

  caller-saved register set, so this is best understood as a thin wrapper / phase-step

  sitting in front of sub_8049F70.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
