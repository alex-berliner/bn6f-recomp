open_questions:
- What does the Unk_00 field really encode? It is used both as a jump-table index and (via r2) as a per-phase
  argument, suggesting overlapping meaning (phase id vs. inline arg) that the disassembly's rename-only
  form doesn't reveal.
- Which of sub_80FE240, sub_80FE2A8, and sub_80FE30C are still framework stubs vs. real phase logic, and
  which exact role each plays in the attack sequence (start/windup/recover/end)?
- Is the return convention truly "phase handler returns to original caller" via `pop {r7,pc}`, or does
  it sometimes return through this function's lr?
