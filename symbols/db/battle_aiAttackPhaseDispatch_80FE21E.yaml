name: battle_aiAttackPhaseDispatch_80FE21E
address: '0x080FE21E'
kind: function
status: confirmed
summary: Battle AI attack dispatcher — reads the AI attack phase byte from an opponent's battle vars and
  tail-calls the matching phase handler through the off_80FE230 jump table.
interface: "void battle_aiAttackPhaseDispatch_80FE21E(u32 aiVars /* r7 */, u32 state /* r2 */, u32 entryA\
  \ /* r5 */, u32 entryB /* r6 */, u32 arg /* r10 */);\n  // uses: r7 preserved; reads aiVars + \"oAIAttackVars_Unk_00\"\
  \n  // returns via phase handler (r1, r5, r8, r9, r10, r11, r12 observable to caller)\n  // clobbers\
  \ nzcv, r0, r2, r3, r4, r6, lr\n"
details: 'Loads r7 as the AI battle-vars struct pointer (preserved across the call by saving/restoring
  around the bx). Reads an 8-bit "AIAttackVars_Unk_00" field (the per-NPC AI attack state byte), uses
  it as a byte offset into the small jump table at off_80FE230, and does an interworking `bx` into the
  chosen Thumb handler with r0 = state byte and r1 = (r2 already set to the state''s inline data). The
  four handlers in the table are: phase 0 -> sub_80FE240 (subroutine form, plain ret), phase 1 -> battle_aiAttackWindupTick_80FE284
  (the windup tick), phase 2 -> sub_80FE2A8, phase 3 -> sub_80FE30C. Effectively a state machine that
  advances an NPC''s AI attack animation/logic through 4 phases; the byte at oAIAttackVars_Unk_00 doubles
  as both the phase selector and (via the loaded r2) the per-phase scratch. r7 is restored on exit via
  `pop {r7, pc}` so callers can chain another dispatch in the same frame.

  '
