  reproduce: python3 tools/asmcat.py 0x08132398
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: unk_2033800 of length 0x200 is cleared via ZeroFillByEightWords,
    then a byte is written to [r5+0xF]. The detail that ''stores r1''s low byte'' is correct (r1 still
    holds 0x200, low byte 0, so it zeroes the flag). However ''submenu_clearBuffer'' is misleading since
    it also writes the flag; a name reflecting both actions fits better.; run wf investigate investigate-20261019-003606;
