    reconcile)'
open_questions:
- what unk_2033800 holds exactly (text/tile/list buffer for which submenu)
- which struct r5 points to and the semantic of the +0xF flag (r1's value at the store depends on ZeroFillByEightWords's
  register usage)
- 'The code matches the proposal: unk_2033800 of length 0x200 is cleared via ZeroFillByEightWords, then
  a byte is written to [r5+0xF]. The detail that ''stores r1''s low byte'' is correct (r1 still holds
  0x200, low byte 0, so it zeroes the flag). However ''submenu_clearBuffer'' is misleading since it also
  writes the flag; a name reflecting both actions fits better.'
