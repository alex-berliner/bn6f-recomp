name: battle_object_collisionPhase_80C4F02
address: '0x080C4F02'
kind: function
status: confirmed
summary: 'Battle object collision-phase handler: removes old collision data, spawns a hit effect, then either advances
  the object one panel per tick along its facing direction or reacts to the panel/object it hit (cracking/breaking
  panels, rewriting panel types based on the related object''s state and alliance), finally re-presenting collision
  data and transitioning to the destroy state.'
interface: void sub_80C4F02(void /* r5 = obj */); // clobbers r0,r1,r2,r3,lr; trashes NZCV
details: "The function is invoked as a battle object's per-tick phase routine (the object's\npointer arrives in\
  \ r5 from the dispatcher and is preserved across the call).\n\nEntry sequence (always runs):\n  - object_removeCollisionData(r5)\
  \ clears whatever the object registered last tick.\n  - object_spawnCollisionEffect(r5) spawns the visual hit/impact\
  \ effect.\n  - battle_isBattleOver(r5): if the battle ended, skip to the destroy path.\n\nIt then reads r5->oBattleObject_CollisionDataPtr->oCollisionData_FlagsFromCollision\n\
  to decide between two branches:\n\n1) NO COLLISION (FlagsFromCollision == 0): the object is moving freely.\n \
  \  - On first entry of this phase, PhaseInitialized is 0; the routine copies\n     oBattleObject_Timer2 into oBattleObject_Timer\
  \ and sets PhaseInitialized = 4\n     (so the timer only initialises once).\n   - Each tick it decrements oBattleObject_Timer;\
  \ while it stays >= 0 it just\n     re-presents collision data and returns (no movement yet).\n   - When the timer\
  \ goes negative, the object steps one panel:\n       PanelX += object_getFrontDirection()\n       PanelY += (signed)\
  \ oBattleObject_Param2\n     then Param2 is cleared to 0.\n   - If the new (PanelX, PanelY) is a valid panel (object_isValidPanel):\n\
  \       object_setCoordinatesFromPanels, battle_objectStepUpOntoElevatedPanel_80C5090,\n       object_updateCollisionPanels\
  \ run, PhaseInitialized is reset to 0, and\n       collision data is re-presented (the object will move again\
  \ next tick\n       with a fresh timer).\n   - If invalid: when oBattleObject_Param1 == 0xC, sub_80C5014 is called;\
  \ then\n     the object is destroyed.\n\n2) COLLISION (FlagsFromCollision != 0): the object hit something.\n \
  \  - When oBattleObject_Param1 == 0xC, sub_80C5050 is called first.\n   - Param1 then selects the panel reaction:\n\
  \       0x07 or 0x15 -> object_crackPanel(PanelX, PanelY)\n       0x16         -> object_breakPanel_dup2(PanelX,\
  \ PanelY)\n       0x22         -> if panel is solid, set the panel type to\n                       oBattleObject_RelatedObject1Ptr->oBattleObject_CurState,\n\
  \                       or to 0xC if oBattleObject_Alliance != 0 (NPC owner).\n       0x24         -> same as\
  \ 0x22 but substitutes type 0xB for the non-zero\n                       alliance case.\n       default      ->\
  \ if panel is solid and the related object's CurState is\n                       not 0xFF, set the panel type\
  \ to that CurState.\n   - In every case the object is destroyed afterwards.\n\nDestroy path (shared by every exit\
  \ except the \"re-present and continue\" ones):\n  - object_clearCollisionRegion(r5).\n  - oBattleObject_CurStateActionPhaseAndPhaseInitialized\
  \ is overwritten with\n    CUR_STATE_DESTROY (8), and the routine still falls through to\n    object_presentCollisionData\
  \ before returning.\n\nQuirks / data touches:\n  - The collision flags branch reads the indirection\n    r5->oBattleObject_CollisionDataPtr->oCollisionData_FlagsFromCollision\n\
  \    rather than a flag on the object itself, so the dispatcher must have\n    attached a fresh collision-data\
  \ block.\n  - oBattleObject_Timer2 is treated as an initial delay / step count; only\n    sampled once when PhaseInitialized\
  \ is 0 and copied into the live Timer.\n  - oBattleObject_Param2 is a signed Y offset applied each panel step\
  \ and is\n    then zeroed, so it is effectively a one-shot vertical kick parameter.\n  - oBattleObject_Param1\
  \ doubles as both the special \"0xC\" branch selector\n    for sub_80C5014/sub_80C5050 and as the panel-type code\
  \ (0x07, 0x15, 0x16,\n    0x22, 0x24, ...) used to pick the reaction.\n  - In the 0x22 / 0x24 / default cases\
  \ the new panel type is sourced from\n    oBattleObject_RelatedObject1Ptr->oBattleObject_CurState, with alliance-\n\
  \    dependent overrides (0xC for 0x22, 0xB for 0x24), strongly suggesting\n    the \"related object\" is the\
  \ player (whose CurState encodes element/type\n    that should be left on the panel) while alliance != 0 means\
  \ the object\n    is an enemy and stamps a fixed NPC-type panel.\n  - In the default case the related object's\
  \ CurState value 0xFF is treated\n    as \"do not modify\" and the panel is left alone.\n  - The function always\
  \ ends by calling object_presentCollisionData; even\n    the destroy path does, which is the standard engine pattern\
  \ of\n    re-registering collision data one last time so the object can be\n    collected on the next pass.\n"
