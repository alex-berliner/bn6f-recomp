open_questions:
- What real entity spawns a battle-object phase routine of this shape (a thrown projectile? a wind/blast attack?
  a movement object pushed by a panel effect?). The 0xC Param1 sentinel feeding sub_80C5014/sub_80C5050 and the
  panel-type stamping behaviour suggest it is some kind of panel-altering effect, but the exact origin is not derivable
  from this function alone.
- What the numeric panel types 0x07, 0x15, 0x16, 0x22, 0x24 map to in the game's panel table (cracked normal, broken
  normal, etc.) — the C code only has the raw constants.
- What sub_80C5014 and sub_80C5050 do (they appear to be the "hit something invalid vs hit something solid" callbacks
  for the Param1 == 0xC case).
- Whether "0xC" in the Param1 comparison is the same constant as the 0xC panel type stamped in the 0x22 alliance
  branch, or just a numeric coincidence.
