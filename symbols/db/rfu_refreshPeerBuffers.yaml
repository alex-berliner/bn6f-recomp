name: rfu_refreshPeerBuffers
address: '0x081467A0'
kind: function
status: probable
summary: 'Per-frame: refreshes the per-RFU-peer 13-byte buffer at unk_20098B0 and 8-byte buffer at unk_2009750
  for every peer recorded in byte_2010288, bumping the counter at byte_2009470.'
interface: () -> void; reads byte_2010288 as peer count, writes unk_20098B0 (16-byte stride), unk_2009750
  (8-byte stride), and byte_2009470
details: Loops index i = 0..byte_2010288-1. For each peer, it calls sub_81466F4(i) to obtain source data,
  then sub_81469F0 to copy 0xD bytes into unk_20098B0[i*0x10]. It also calls get_lookupEntryField15Ptr(i)
  to obtain a pointer and sub_81469F0 to copy 8 bytes into unk_2009750[i*8]. The two 16-byte / 8-byte
  strides and the use of get_lookupEntryField15Ptr suggest a pair of per-peer table entries (one main
  16-byte slot, one 8-byte companion) keyed by the same peer index. The byte at byte_2009470 is reset
  to 0 before the loop and incremented inside it, acting as a per-frame iteration counter or handshake
  flag. It is called immediately after clearing chatbox buffers / a chatbox dismiss poll, so the two callers
  appear to be unrelated paths that share this periodic refresh.
