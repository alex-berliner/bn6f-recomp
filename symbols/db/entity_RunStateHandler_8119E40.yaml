name: entity_RunStateHandler_8119E40
address: '0x08119E40'
kind: function
status: confirmed
summary: Trampoline that dispatches an entity/state object (r5) to one of three state-handler routines based on
  the state byte at r5+8.
interface: void entity_RunStateHandler(Entity* state /* r5 */) — reads [r5+8]; passes r0 = handler address, r1 =
  state byte to the handler; tail-calls it so registers/flags after the call are the handler's
details: 'Classic three-entry state-machine dispatcher. The selector byte at [r5+8] is used directly as a byte offset
  into the table at off_8119E54, so the field holds 0, 4 or 8 rather than a 0/1/2 index; any other value would jump
  to garbage (never occurs in practice). The selected handler (sub_8119E60, sub_811A0A4 or sub_811A1EC) is invoked
  as a guest/tail call: LR is set to this function''s pop {pc}, so the handler returns straight to this function''s
  caller. The handler receives r0 = its own table entry (Thumb pointer, exactly as loaded) and r1 = the selector
  byte; r2-r12 and flags pass through untouched. The r5 object layout (state byte at +8, other fields used by the
  handlers) is not further identified here.

  '
