name: ai_attackStepDefaultInit
address: '0x081063F4'
kind: function
status: probable
summary: 'AI attack-state handler: initializes a default element-4 attack (anim 0x14, timer from AttackDuration)
  once, then counts it down and exits the attack when it lapses.'
interface: (r7 = oAIAttackVars*, r5 = battle object) -> void; called each frame while in this attack step
details: On first entry (AttackElement == 0) it commits element 4 into oAIAttackVars_AttackElement, sets
  the object's CurAnim to 0x14, and copies oAIAttackVars_AttackDuration into StepTimer as the step's frame
  counter. On subsequent calls it decrements StepTimer and does nothing until it reaches zero. When the
  timer expires it calls object_exitAttackState_801171C to tear down the AI attack (clearing scratch vars,
  chip lockout, AI flags and power-atk state). Element 4 presumably encodes a default/neutral attack element,
  making this the fallback attack step used when no specific element was chosen.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne: one-shot init guarded by element==0; strb
    #4 -> AttackElement and strb #0x14 -> oBattleObject_CurAnim: sets default element and its animation;
    ldrh AttackDuration -> strh StepTimer: frame timer taken from the AI attack var; decrement StepTimer;
    bgt exit: pure frame countdown after init; bl object_exitAttackState_801171C when timer hits 0: ends
    the attack state via the known teardown callee'
