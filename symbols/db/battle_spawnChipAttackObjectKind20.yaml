open_questions:
- What object kind 0x20 actually is and what its type-4 initializer does with the not-yet-written fields
- Which in-game callers invoke this and what they pass in r5/r6/r7 (likely a chip-use handler setting
  damage and chip ID)
- Whether r0=0x20 is an object kind, HP/size, or another initializer parameter
