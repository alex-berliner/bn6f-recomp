name: sub_803EF84
address: '0x0803EF84'
kind: function
status: hypothesis
summary: Stores the passed value into the link-state camera field at eLinkState+0x34 (aliased as eCamera.unk_84),
  a one-instruction setter.
interface: void link_SetCameraValue(int value) // r0 = value; clobbers r1; no outputs
details: 'A trivial setter: it loads the pointer literal eLinkState and stores r0 at

  offset 0x34 from it, then returns. The disassembly''s literal comment names

  the same address eCamera.unk_84 - 0x20099d0, i.e. the eLinkState symbol is

  placed at the same address as A_eCameraEnd, so this field sits just past

  the camera struct''s end and belongs to the link-state block. Given the

  neighboring eCamera alias, the field is most plausibly camera-related state

  for link/cable-battle scenes (e.g. a camera target, offset, or mode value),

  but nothing in the function itself reveals which quantity is written.

  '
