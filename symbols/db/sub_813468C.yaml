open_questions:
- Exact role of sub_811FAF4 (spawn vs. animation-register vs. palette); the constant 0x20003 and packed coord suggest
  it constructs an OAM/OBJ entry for the child effect, but without the callee's body I can only describe the contract.
- Whether r5 is the parent battle object (the parent whose `0x18` is read for x-offset) or a sprite header — most
  likely battle_object given the project uses it in the spawn flow.
- Why only hi_nibble==1 entries are remapped; could be "internal" vs "external" sprite categories or an effect-class
  filter.
