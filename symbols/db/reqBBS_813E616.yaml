summary: Clears the BBS (bulletin board) work RAM, marking every board slot as unused.
interface: void reqBBS_ResetWorkAreas(void) // takes nothing meaningful; r3 is preserved and returned unchanged
details: 'Initializes the bulletin-board (BBS) subsystem''s work areas in IWRAM/EWRAM before use.

  Fills the 0x200-byte board buffer at 0x2001400 with the value 0x40, which appears to be

  the "unused/empty entry" marker for board entries, then word-aligns and zeroes two

  0x20-byte tables at 0x2000FC0 and 0x2000FF0, which look like per-entry bookkeeping

  (e.g. entry index/id lists or pointers). No return value is produced; the register

  contract shows r3 as both input and output only because the routine preserves it.

  Name prefix reqBBS suggests this runs in the request/BBS screen context.

  '
