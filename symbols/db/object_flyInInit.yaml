name: object_flyInInit
address: '0x080E4DD0'
kind: function
status: probable
summary: Battle-object fly-in setup that loads sprites, positions the object off-screen ahead of its row,
  applies inward X/Z velocities with Timer=2, animation 4, palette, and sound 0x188, then tails into the
  per-frame update.
interface: (r5 = battle object, Param1 = palette, Param2 = skip-reposition flag) -> r0 = destroyed; sets
  PanelX, X/Z, X/ZVelocity, Timer=2, anim=4, flags|=2, phase=CUR_STATE_UPDATE
details: Loads sprite resources (0x80, 0x10, 0x30), disables the shadow, and mirrors the sprite to the
  object's effective facing. Unless Param2 is nonzero, it looks up an alliance-dependent panel-param entry
  (byte_80E4E74, filter 0x20) and asks object_getClosestPanelMatchingRowFiltered for a valid panel column,
  falling back to PanelX + frontDirection if none qualify, storing the result in PanelX. It then recomputes
  pixel coordinates and offsets X by -frontDirection*0x5f0000 (placing it off-screen ahead), sets Z to
  0x280000 (airborne height), and X/Z velocities of frontDirection*0x208000 and 0xc8000, so the object
  flies in toward its row over Timer=2 frames. It sets palette from Param1, sets object flag 0x2, plays
  sound 0x188, starts animation 4, refreshes the sprite, marks the state phase CUR_STATE_UPDATE, and tails
  into sub_80E4E84 for the per-frame update.
