name: ow_animWaitStep
address: '0x080A7E6C'
kind: function
status: probable
summary: 'Overworld NPC-script step: plays an animation variant, starts a ~30-frame wait, decrements a
  repeat counter, then advances the script state.'
interface: (r0-r3 = scratch; r5 = object struct ptr, r7 = script/state struct ptr) -> r0 = 4 written to
  [r5,#9]; no return value
details: The state struct at r7 holds a remaining-count byte at +2 and an animation/direction index at
  +3. It sets the object's sprite animation to ([r7,#3]+4) via sprite_setAnimation and reloads the animation
  data, then stores 30 (0x1E) into the object's frame-timer field [r5,#0x24]. It fetches the player's
  overworld facing direction and calls sub_80A8038; if the result equals [r7,#3], the decrement amount
  becomes [r7,#2] instead of 1, so the counter is zeroed in that case. Otherwise it subtracts 1 (or the
  whole count) from [r7,#2] and, while the counter is still positive, calls sub_80A8020 to keep waiting.
  Finally it writes state 4 into [r5,#9], presumably the object's AI/script phase byte, ending the step.
