- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_setAnimation with r0 = [r7,#3]+4 selects an animation tied to the struct''s index
    byte; str 0x1E -> [r5,#0x24] loads a 30-frame timer into the object struct; bl GetOWPlayerFacingDirection
    and cmp r0, [r7,#3] compares player facing to the state byte; ldrb r6,[r7,#2] / sub r0,r0,r6 / ble
    skip: counter at +2 is decremented until exhausted; mov r0,#4; strb r0,[r5,#9] sets a phase/state
