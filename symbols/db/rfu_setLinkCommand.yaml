- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r2,[r1] / strb r0,[r1] then cmp r0,r2 beq exit — only acts on change of the command byte
    at 0x200BC50; zeroes bytes at +2,+3,+4 and halfword at +0xA — sub-state and counter fields belonging
    to the command being replaced; caller rfu_handleLinkCommand dispatches link command bytes, matching
    a 'set current command' setter
