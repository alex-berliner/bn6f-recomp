name: rfu_setLinkCommand
address: '0x0813D934'
kind: function
status: probable
summary: Stores a wireless link command/state byte into the RFU session struct and, when it changes, clears
  the associated progress/timer fields.
interface: (r0 = link command byte) -> r0 clobbered; no return value; memory at 0x200BC50 updated
details: Reads the current command byte at 0x200BC50 and writes r0 there. If the new byte differs from
  the old one, it zeroes byte_200BC52, byte_200BC53, byte_200BC54 and halfword 0x200BC5A, resetting sub-state
  and counter/timer fields that track progress on that command. If the byte is unchanged, nothing else
  happens — the fields are only reset when switching commands. Called from rfu_handleLinkCommand and several
  0x803xxxx wireless-link routines, all part of the RFU session state machine.
