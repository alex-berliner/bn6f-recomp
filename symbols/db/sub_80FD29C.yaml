name: sub_80FD29C
address: '0x080FD29C'
kind: function
status: confirmed
summary: Returns a battle object pointer fetched via sub_800FE28, offset by 0x3C if the current object's flag "0xA000"
  is set.
interface: R0 out (pointer); clobbers NZCV, R1, R2, LR; preserves R4; R5/LR inputs unused here.
details: 'Loads a small struct pointer from dword_80FD2BC (value 0x0C10181E, used as a key) and

  passes it to sub_800FE28 which returns a battle-related object pointer in R0. Then

  calls object_getFlag() (the "current object" flags for that returned pointer) and tests

  bitmask "0xA000". When set, adds 0x3C to the object pointer before returning it.

  Effectively a selector that picks between two field offsets of the same battle

  object based on a runtime flag.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
