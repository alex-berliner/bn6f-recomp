name: menu_showDialogOnUnselect_8047A80
address: '0x08047A80'
kind: function
status: confirmed
summary: Puts a menu/UI state struct into its "show dialog" state (0x14), makes the chatbox run text script
interface: void sub_8047A80(r4, r5 /*owner struct ptr*/, r6, r7, r10); clobbers r0-r1, r2-r3 (via chatbox_runScript),
  NZCV; preserves r4, r5, r6, r7, r10
details: Reads an owner struct pointer in r5 (r4/r6/r7/r10 are preserved but otherwise unused, so the caller passes
  a fixed register-window context). Writes 0x14 to the struct's state byte at +0x00, which this subsystem apparently
  uses as its "dialog being shown" state id. Loads the TextScriptArchive pointer from struct +0x24 and calls chatbox_runScript(archive,
  2), i.e. always script index 2 of that archive. Finally plays SOUND_UNSELECT_68 via PlaySoundEffect. The combination
  (dialog state + fixed script
