name: save_CommitWorkBufferToGamePak_803FB04
address: '0x0803FB04'
kind: function
status: confirmed
summary: Writes the caller's value into the save work buffer at dword_20067C0 and flushes the 0x80-byte buffer to
  the Game Pak save area at 0xE007F80.
interface: void save_CommitWorkBufferToGamePak_803FB04(u32 value /* r0, stored as first word of the save block */);
  all registers r0-r7 preserved (push {r0-r7,lr} / pop {r0-r7,pc}); flags clobbered
details: 'Saves a single 0x80-byte save chunk. The value passed in r0 is stored as the first word of the save work
  buffer dword_20067C0 (in IWRAM), then the whole 0x80-byte buffer is copied to the Game Pak save ROM area at 0xE007F80
  via libSave_CopyToGamePak(src = dword_20067C0, dest = 0xE007F80, len = 0x80). That callee also expects the source
  pointer in r4, so r4 is loaded with dword_20067C0 before the call (overwriting the caller''s r4, but the function
  restores it on return). The push/pop of r0-r7 makes the routine fully transparent to its caller apart from flags.
  The 0x80 size and fixed save address suggest this is one sector/block of the save data write path, with r0 likely
  a checksum, counter, or status word written at the block start.

  '
