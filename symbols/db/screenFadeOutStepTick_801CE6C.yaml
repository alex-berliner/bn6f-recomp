name: screenFadeOutStepTick_801CE6C
address: '0x0801CE6C'
kind: function
status: confirmed
summary: Ticks a staged screen fade-out, dropping the fade parameter by 0x20 each step until the work block advances
  to state 4.
interface: void sub_801CE6C(u8* work /* r5 */); calls sub_802FE7A(0, 0x40, 0xE0 - 0x20*work[7], work[6]); returns
  r0 = step counter (0 on finishing tick); preserves r4-r7; c/v from `cmp counter,#5`, nz from `movs r0,#0` only
  on the finishing tick
details: 'Drives a multi-step fade effect described by the work block in r5. work[7] is the step counter, work[6]
  is a per-block parameter passed through as r3 to sub_802FE7A, and work[0] is the block''s state byte. Each tick
  issues sub_802FE7A(0, 0x40, 0xE0 - 0x20*step, work[6]); since the third argument shrinks by 0x20 per step from
  0xE0 toward 0, this is a fade that dims in five discrete stages. When the counter reaches 5 the block transitions
  to state 4 (work[0] = 4) and the step counter is reset to 0, so the parent state machine moves on once the fade
  completes. Note the odd flag contract: the early-exit path ends on the `cmp r0,#5` (nz/c/v all from the compare),
  but the finishing path then executes `movs r0,#0`, overriding nz to "zero" while c/v still come from the comparison.

  '
