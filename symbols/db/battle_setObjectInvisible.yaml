name: battle_setObjectInvisible
address: '0x0801A66C'
kind: function
status: probable
summary: 'Starts an invisibility state on a battle object: 120-frame invisible timer plus the invisible
  flag.'
interface: (r5 = battle object) -> void; no return value
details: Loads the object's CollisionData pointer from oBattleObject_CollisionDataPtr and stores 0x78
  into oCollisionData_FlashingInvisTimer, the countdown used for flashing/invisibility. Then it calls
  object_setFlag1 with r0 = 0x200, ORing bit 0x200 into ObjectFlags1 — presumably the invisible bit read
  by collision/hit logic. 0x78 = 120 frames = 2 seconds, matching the standard Invis chip duration. r5
  must already hold the object pointer since only r0/r1 are set.
