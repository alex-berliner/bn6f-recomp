  - 0x08002EE8 sprite_zeroColorShader
  reproduce: python3 tools/asmcat.py 0x0811B8C8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal correctly identifies the fall-through shader 0xA108, the alternating table at byte_811B904,
    and the per-object threshold at r5+4, but its description of the shader halfwords is wrong: the bytes
    at 0x811B904 are 0x00,0x00,0x42,0x08,0x84,0x10,0x42,0x08,0x00,0x80,0x42,0x88,0x84,0x90,0x42,0x88,
    giving eight halfwords (0x0000, 0x0842, 0x1084, 0x0842, 0x8000, 0x8842, 0x9084, 0x8842) indexed by
    (curFrame & 0xF)>>1. This is a classic palette-fade/flash sequence, so ''FlashShader'' fits better
    than the current name which already conveys that — the name is fine but the summary''s parenthetical
    list of eight values must be corrected. The interface description is correct: r0 holds the result
    of sprite_zeroColorShader used by sprite_setColorShader, r5 is caller''s state pointer.; run wf investigate
    investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
