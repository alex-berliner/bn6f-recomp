name: pet_addCurNaviStat18
address: '0x0813CF4C'
kind: function
status: probable
summary: Adds a signed delta to the PET navi's NaviStats byte at offset 0x18, capping the result at 7.
interface: (r0 = signed delta) -> void; no flags used
details: Reads the byte at NaviStats offset 0x18 for the navi currently selected on the PET via GetCurPETNaviStatsByte,
  adds r0 to it, and writes the result back with SetCurPETNaviStatsByte. The sum is clamped to a maximum
  of 7 (cmp r2,#7 / ble / mov r2,#7), suggesting a 3-bit field such as a level or rank counter. There
  is no lower clamp, so the caller must ensure the result does not go below 0. With no known callers,
  which stat offset 0x18 holds is not established.
