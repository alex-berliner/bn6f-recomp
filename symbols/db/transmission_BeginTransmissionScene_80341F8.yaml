name: transmission_BeginTransmissionScene_80341F8
address: '0x080341F8'
kind: function
status: confirmed
summary: 'Prepares the wireless/cable transmission screen: sets a scene state to 4, switches the LCD to a fixed
  render mode, refreshes render info, and starts the transmission music.'
interface: void sub_80341F8(void) (r5 = pointer to a scene/state byte; flags and r0-r1 after return reflect the
  trailing PlayMusic call)
details: 'Stores 4 to the byte at [r5], marking whatever scene/state machine owns that byte as the

  transmission state. Writes 0x40 to the LCD-control render info via SetRenderInfoLCDControl,

  then calls renderInfo_8001788 and renderInfo_80017A0 to refresh the render-info structures.

  Finally plays SONG_TRANSMISSION through PlayMusic, which is why the song keeps playing

  during the transmission cutscene/wireless-play screen. No other state is touched; the

  caller must supply the r5 state pointer. r0-r1 are scratch; r2-r7 and r10 are preserved

  by the callees'' conventions.

  '
