    timers; str r0, [r5,#oBattleObject_ExtraVars] nulls the object''s extra-vars pointer; caller 0x0810DE96
    ai_attackUpdate ''ends the attack state when it expires'' matches this teardown; 7-instruction body
    with no callees: pure field-reset, no side effects'
