name: ai_attackResetState
address: '0x0810DEC4'
kind: function
status: probable
summary: Clears an enemy AI attack's timers and detaches its extra-vars, ending the attack action.
interface: (r0 = unused; r5 = battle object; r7 = oAIAttackVars) -> r0 = 0; flags not meaningful
details: Stores 0 into oAIAttackVars_AttackDuration and oAIAttackVars_StepTimer (halfwords via r7), then
  stores 0 into oBattleObject_ExtraVars (r5), releasing the pointer to the attack's variable block. It
  is the attack-state teardown/reset called from ai_attackUpdate when the attack timer expires (and reachable
  via sub_810DE00). r0 is overwritten with 0 immediately and never used as input. The caller must already
  have r7 pointing at the oAIAttackVars struct, as is the convention in the ai_attackUpdate family.
