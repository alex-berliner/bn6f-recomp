  date: '2026-10-19'
  detail: 'sub_803C316 body: ldrh r1,[r2,#0x20]; tst r1,r0; pop {pc} - pure bit test returning flags;
    0x08049BC8: mov r0,#1; lsl r0,r4; bl sub_803C316; beq skip - loops slot index r4 as bit mask, only
    acts when bit set; 0x08117286: ldrb r1,[r5,#4]; lsl r0,r1; bl sub_803C316; beq - guards a sprite_setCoordinates
    call on the tested bit; Caller 0x8049BC0 combines the bit test with ow_checkJackInFlag, suggesting
