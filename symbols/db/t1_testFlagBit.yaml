name: t1_testFlagBit
address: '0x0803C316'
kind: function
status: probable
summary: Tests bit (1<<index) of the 16-bit flag word word_200A2B0 and returns the result in the Z flag.
interface: (r0 = bitmask, typically 1<<slot) -> r0 unchanged; Z flag set if bit is clear, clear if set
details: Loads the halfword at eS200A290+0x20 (word_200A2B0) and executes tst r1, r0, so callers branch
  on the returned flags via a plain beq/bne after the call (pop {pc} preserves flags). r0 is a bit mask
  built by callers as 1<<index. sub_8049BC0 loops index 0..7 over slots, skipping slots whose bit is clear,
  and only processes slots with the bit set (before calling ow_checkJackInFlag and per-slot helpers).
  sub_811727C tests bit [r5,#4] to decide whether to reposition a sprite (0x23 vs 0x21 state written to
  [r5]) and then calls sprite_update. No other memory is touched.
