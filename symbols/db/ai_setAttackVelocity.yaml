name: ai_setAttackVelocity
address: '0x080F0E96'
kind: function
status: probable
summary: 'Sets the battle object''s attack velocity: horizontal lunge with facing multiplier if on row
  3, otherwise vertical movement of AiAttackParam.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; sets oBattleObject_XVelocity/YVelocity and
  oAIAttackVars_AttackBoost2
details: Reads the object's PanelY from the battle object struct. If it equals 3 (the front row), it calls
  object_getFrontDirection to get the +1/-1 facing multiplier, multiplies the AI attack parameter by it,
  and stores the result in XVelocity with YVelocity cleared to 0 and AttackBoost2 set to 1. Otherwise
  it stores AiAttackParam directly into YVelocity, clears XVelocity, and zeroes AttackBoost2. This makes
  an AI-controlled object either dash forward horizontally (on the front row) or move vertically, with
  a flag recording which mode was chosen.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PanelY]; cmp r0,#3 branches between horizontal and vertical velocity
    paths; bl object_getFrontDirection; mul r1,r0; str r1,[r5,#oBattleObject_XVelocity] shows facing-scaled
    horizontal dash; str r1,[r5,#oBattleObject_YVelocity] in the non-front-row path sets vertical speed
    from AiAttackParam; strb r0,[r7,#oAIAttackVars_AttackBoost2] is set 1 in the horizontal case and 0
    in the vertical case; caller sub_80F0D08 with AI attack vars struct confirms this is an AI attack
    movement routine
