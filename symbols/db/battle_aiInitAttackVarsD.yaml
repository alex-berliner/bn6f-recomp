name: battle_aiInitAttackVarsD
address: '0x081020F0'
kind: function
status: probable
summary: Loads one enemy AI attack's parameters from version-indexed data tables into the battle object's
  AI attack variables, then starts that attack.
interface: (r0 = attack id 0xD passed to object_setAttack0; r7 = battle object) -> sets oAIAttackVars_*
  fields; r0 preserved as attack id for object_setAttack0
details: 'The routine reads four words via sub_800FE28 from tables at dword_8101A48/4C/50/54 and stores
  them into the battle object''s oAIAttackVars_ScratchVar, AiAttackParam, PanelParamFlags2, and ScratchPointerOrPanel
  fields; it then reads two halfwords via battle_aiGetVersionedTableEntry_800FE12 from byte_8101A58/60
  into Damage and ExtraDamage, so the numbers vary with the object''s AI version. It initializes fixed
  state: AttackBoost2=2, TimerOrCycles=0xD, SubStepIndex=PanelParamFlags2, AttackStepIndex=0, InitFlag=0x20,
  AiDifficultyTier=1, and finally calls object_setAttack0 with 0xD to begin the attack. This is one of
  a family of per-attack AI parameter-init routines, dispatched from the caller sub_8101EE2.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'Stores four sub_800FE28 results into oAIAttackVars fields from consecutive table pointers dword_8101A48..8101A54;
    Halfword damage/extra damage loaded with battle_aiGetVersionedTableEntry_800FE12 from byte_8101A58/A60,
    i.e. AI-version-indexed tables; Fixed fields: AttackBoost2=2, TimerOrCycles=0xD, SubStepIndex from
    PanelParamFlags2, InitFlag=0x20, AiDifficultyTier=1; Tail call object_setAttack0 with r0=0xD kicks
    off the attack state; Single caller sub_8101EE2 alongside similar init routines implies an attack-id
    dispatch table'
