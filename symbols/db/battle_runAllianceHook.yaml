    as the dispatch index; lsl r6, r6, #2; ldr r1, [r6, r1] with table base off_8013C70 — word-sized,
    13-entry function-pointer jump table; mov lr, pc; bx r1 — ARM-returning dispatch into the selected
    handler; all 13 entries of off_8013C70 are nullsub_28+1 — the hook slots are stubs in this build'
