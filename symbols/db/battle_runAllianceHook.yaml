name: battle_runAllianceHook
address: '0x08013C4E'
kind: function
status: probable
summary: Clears ObjectFlags1 bit 0x20000 on the battle object, then bx-calls a function pointer from a
  13-entry ARM table at off_8013C70 indexed by the object's alliance byte, returning the handler's result.
interface: () -> r0 = handler return value; no flags of interest
details: The routine first clears flag 0x20000 in the battle object's ObjectFlags1 via object_clearFlag.
  It then fetches byte 0x29 of the battle object's NaviStats through GetBattleNaviStatsByte_AllianceFromBattleObject,
  multiplies it by 4, and uses it as an index into a 13-entry table at off_8013C70. The selected entry
  is a function pointer called with `mov lr, pc; bx r1` (an ARM-mode caller thunk), so this is a dispatch/jump-table
  call, not a plain branch. All 13 table entries currently point to nullsub_28, meaning the dispatchable
  handlers are stubbed at these addresses in this build. The pattern (clear a per-object flag, then run
  a side/alliance-indexed hook) suggests a per-turn or per-phase maintenance routine where each side may
  plug in custom behavior.
