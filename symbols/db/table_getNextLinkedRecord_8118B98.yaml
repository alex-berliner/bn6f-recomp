name: table_getNextLinkedRecord_8118B98
address: '0x08118B98'
kind: function
status: confirmed
summary: Steps to the next entry of a self-linked record chain, using the record's own stride field to
  advance the pointer.
interface: Next record pointer table_getNextLinkedRecord(void* record /* r5 */); returns r0 = record +
  stride
details: 'Takes a pointer to a small variable-size record in r5 and computes the address of the following
  record in the chain. The stride lives in the high nibble of the byte at offset 2 of the record: ldrb
  from [r5,#2], shift right 4 then left 4, giving (high nibble * 16) bytes. That value is added to the
  record pointer and returned in r0. Nothing else is touched and no registers besides r0 are written,
  so it is a pure pointer-arithmetic helper. Callers use it to walk chains of these records without knowing
  their layout; the record itself encodes how far ahead the next entry sits. If the high nibble is 0 the
  function returns the same pointer unchanged, which callers presumably treat as an end-of-chain or self-terminating
  marker. Flags are clobbered by the shifts but the contract lists them as outputs only as nzcv clobber,
  not as meaningful results.

  '
