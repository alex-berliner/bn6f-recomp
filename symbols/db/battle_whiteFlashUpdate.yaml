name: battle_whiteFlashUpdate
address: '0x080E114C'
kind: function
status: probable
summary: Update routine for a battle object that flashes the screen white for a set number of frames,
  then cleans itself up.
interface: (r0/r1 = standard update args, r5 = battle object) -> r0 clobbered; sets/clears object's CurState,
  Timer, Timer2, frees its palettes and memory at end
details: 'This is a per-frame object updater reading Param3 bit 1 as a ''flash active/enabled'' flag:
  while the bit is clear and the battle is paused or time-stopped, it fills palette slots 0x14 and 0x15
  with color 0 (sub_8002378, 9 and 15 entries of iPalette3001B60 / iPallete3001750) so the effect stays
  hidden during pauses. Otherwise, on state 0 it initializes Timer2 = Param2 (flash duration), Timer =
  0, and moves to CUR_STATE_UPDATE. Each frame it decrements Timer2 and, while the count is still >= 0,
  fills both palette slots with 0x7FFF (white) — a white overlay covering those two palettes. When Timer2
  goes negative it terminates palette slots 0x14 and 0x15 via Terminate_ePalette20097a0_Transform and
  releases the object with object_freeMemory.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'fills two software palette slots (0x14, 0x15) with 0x7FFF via sub_8002378 for a countdown of
    Param2 frames (loc_80E119A block); fills the same slots with color 0 while paused/time-stopped (loc_80E116A
    block), hiding the effect; state-0 init: Timer2 = Param2, Timer = 0, CurState = CUR_STATE_UPDATE (loc_80E1188);
    on expiry calls Terminate_ePalette20097a0_Transform twice then object_freeMemory (loc_80E11C0); Param3
    bit 1 gates the whole behavior, tested twice at entry'
