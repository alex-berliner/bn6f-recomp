name: ai_lungeOntoTargetPanels
address: '0x080F3396'
kind: function
status: probable
summary: 'AI attack step: teleports object onto its FuturePanel coordinates, arms SelfDamage (low halfword
  of DamageAndStaminaDamageCounterDisabler) and StaminaDamageCounterDisabler (same low-halfword byte)
  on collision data, sets region 1 and MOVING flag, then after 3 frames writes 0x20 into HitElement.'
interface: (r5 = battle object ptr, r7 = AI attack vars) -> r0 = 0/1; flags from callee bl calls
details: 'On the first invocation (AttackElement == 0) it marks the attack as started by writing element
  4, copies the object''s FuturePanelX/Y into its actual PanelX/Y (a lunge/teleport onto panels selected
  earlier), releases the reserved panel, recomputes pixel coordinates and collision panels, and updates
  collision data with region 1. It then takes the object''s DamageAndStaminaDamageCounterDisabler word:
  low halfword becomes oCollisionData_SelfDamage and the high byte becomes the StaminaDamageCounterDisabler
  byte, arming damage dealt on contact. It clears flags 0x40 and (1<<0x16), sets the CURRENTLY_MOVING_1
  flag, and loads StepTimer with 3. On subsequent calls it just decrements StepTimer; when it reaches
  0 it writes 0x20 into HitElement, which presumably triggers the actual hit/element processing elsewhere.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne -> two-phase state machine keyed on AttackElement;
    ldrb FuturePanelX/Y ... strb PanelX/Y + bl object_removePanelReserve/setCoordinatesFromPanels -> object
    moves onto pre-chosen panels; strh r0,[r2,#oCollisionData_SelfDamage] / strb StaminaDamageCounterDisabler
    -> arms contact damage from the object's damage word; mov r0,#3; strh r0,[r7,#oAIAttackVars_StepTimer]
    then countdown branch writes 0x20 to HitElement; callees object_setFlag1/clearFlag (CURRENTLY_MOVING_1,
    bits 0x40/0x400000) and object_updateCollisionData fit an attacking-move AI step
  refs:
  - bn6f/asm/asm31.s:126452
  - 0x0801A15C object_clearFlag
  - 0x0801BB46 object_removePanelReserve
  - 0x0801A07C object_setCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080F3396
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code at strb r0,[r2,#oCollisionData_StaminaDamageCounterDisabler] stores the low-halfword r0
    (already used for SelfDamage), NOT the high halfword r1; the proposal''s ''high byte becomes the StaminaDamageCounterDisabler
    byte'' contradicts the asm. The return register is r0=3 (first branch) or r0=0x20/>0 (second branch),
    not ''0/1'' as stated in the interface. The lunge/teleport (FuturePanel→Panel copy), region-1 collision
    update, flag manipulation, and 3-frame timer with 0x20 HitElement are all confirmed by lines 5–48.
    The name and overall summary still fit well.; run wf investigate investigate-20261018-155607; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
