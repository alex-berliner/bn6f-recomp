name: sub_804C844
address: '0x0804C844'
kind: function
status: hypothesis
summary: Sets a single field (offset 0x14) of the struct in r5 to 0x10, likely assigning a state, timer, or counter
  on a game object.
interface: 'u32 obj_setField14To16_804C844(u32 obj /* r5 */); // in: r5 (object/struct pointer), lr (return); out:
  r5 unchanged; clobbers r0, NZ flags'
details: 'The routine is two instructions: store the constant 0x10 to [r5+0x14] and return, preserving r4-r7 and
  passing r5 back through unchanged (callers read back only r5; r0 and NZ are clobbered). Given the register contract
  (only r5 in, only r5 out), r5 is almost certainly a pointer to a task/object work structure and offset 0x14 a
  small field such as a state id, phase, or countdown/timeout value being initialized to 16. The bytes immediately
  after the function (dword_804C84C = 0xFF, off_804C850 = 0x12C, off_804C854 -> byte_804C858, and the long byte_804C858/byte_804C860
  tables of small signed 16-bit pairs like 0x01D9, 0xFEC6, 0xFDE0, plus repeated 0x01/0x40/0x80/0x08/0x06 flag-ish
  records) are data owned by neighboring code/tables, not touched by this routine itself, though the table''s record-like
  structure (repeating ~14-16 byte entries with signed short offsets and 0xFF-terminated attribute bytes) suggests
  it belongs to a movement/path or hitbox-table system used alongside this setter.

  '
