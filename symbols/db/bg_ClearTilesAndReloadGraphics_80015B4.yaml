name: bg_ClearTilesAndReloadGraphics_80015B4
address: '0x080015B4'
kind: function
status: confirmed
summary: Clears the BG tile ID area of VRAM and reloads the BG tile graphics, resetting a related graphics buffer
  in the process.
interface: void sub_80015B4(void); // no real arguments; r2/r3/r10 are pass-through state that is left untouched
  (r3 explicitly preserved)
details: "Takes no meaningful arguments despite the register contract listing r2/r3/r10 as inputs —\nthey are just\
  \ carried through for the caller. The routine:\n1. Fills the BG tile ID region of VRAM at 0x600E000 with 0x2000\
  \ bytes of zeros\n   (0x600E000..0x600FFFF), using ZeroFillByEightWords which writes 8 words (32 bytes) per\n\
  \   iteration.\n2. Calls ZeroFillGFX30025c0 to zero the graphics/palette working block at IWRAM 0x30025c0.\n3.\
  \ Calls copyMemory_8001850 to copy the BG tile graphics back into VRAM from ROM.\nNet effect: the BG tilemap/tile\
  \ indices are blanked and the BG tile set is rebuilt, which is\nthe kind of reset done when switching screens\
  \ or reinitialising the background layer.\nClobbers flags and r0/r1/lr; r2 and r3 come out with the same values\
  \ they had on entry\n(r3 is noted as preserved), and r10 is likewise untouched pass-through state.\n"
