name: getWorkAreaPtr_2006CF8
address: '0x0813BD0C'
kind: function
status: confirmed
summary: Trivial getter that returns the address of a work buffer at 0x2006CF8 in r7 for its caller.
interface: 'void getWorkAreaPtr_2006CF8(void) /* out: r7 = &unk_2006CF8; only lr is read, nothing else touched */'
details: Loads the literal address unk_2006CF8 (an IWRAM work-area pointer stored at off_813BD18) into r7 and returns
  immediately via mov pc, lr. No flags, memory, or other registers are touched. Because the callee returns through
  r7 rather than the usual r0, it is presumably a helper inlined before a call sequence whose target convention
  expects the buffer pointer in r7; the actual gameplay role of the 0x2006CF8 buffer is not visible from this function
  alone.
