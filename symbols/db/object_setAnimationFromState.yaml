  reproduce: python3 tools/asmcat.py 0x0812B5AC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
- What states 0x14 and 0x18 mean in game terms (which boss/object uses them) — the callers' handler context
  would say
- Why all other states map to animation 7, and what animation 7 depicts
- What the r1 = 0 argument means precisely in sprite_setEntityAnimation (no-shadow flag vs data pointer)
