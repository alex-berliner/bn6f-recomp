open_questions:
- The exact meaning of "2" passed to sub_80A7BA2 (presumably a battle-begin/reaction enum value) is not visible
  here.
- 'What r5/r7 actually point to (some kind of AIData accessor in a wrapper object: r7 likely points to the AI block
  adjacent to the battle object) is inferred from the r7+1 byte being treated as a radius; the surrounding AIData
  struct definition matches (offset 0x2 = Unk_02). Renaming r5/r7 to specific battle-object/AI fields would settle
  this.'
