name: submenu_isOpen_81355D8
address: '0x081355D8'
kind: function
status: confirmed
summary: Returns whether any submenu other than the main/no-submenu state (0x20) is currently open.
interface: 'Next sub_81355D8(void) // out: r1 = 0 if sSubmenu == 0x20 else 1; NZ reflect r1, C/V left from the CMP'
details: 'Reads the global byte sSubmenu (the currently open submenu id) and compares it against 0x20, which appears
  to be the "no submenu / main menu" state. Sets r1 to 0 when the submenu equals 0x20 and to 1 for any other submenu
  id, so callers can test "is a submenu active?" with r1 and the Z flag. Note the return value is inverted from
  a typical boolean: 0 means main state, 1 means a submenu is open. The C/V flags are left over from the CMP against
  0x20 (not recomputed after the tst), so callers relying on C/V see the comparison result rather than the r1 value.
  Clobbers r0 only; r1 is the output register.'
