open_questions:
- which value GetMaxAndCurHPForCurPETNavi returns in r0 (max vs current HP)
- what unk_2000B40 is and what field +6 holds (the threshold seems to be a multiplier of 100)
- what PET navi stat 0x40/0x42 mean in game terms, and which caller invokes this (none known), needed
  to name the feature precisely
