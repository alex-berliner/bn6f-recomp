name: pet_awardOverflowHPStatOnce
address: '0x0808C6A4'
kind: function
status: probable
summary: One-shot routine that, the first time it runs, plays a jingle and grants the equipped PET navi
  stat 0x40 a value derived from its max HP (surplus over a threshold read from unk_2000B40+6), clamped
  to the stat's cap, then latches event flag 0x9D5 so it never runs again.
interface: (r0 = unused/must be 0) -> r0 = 0; sets event flag EVENT_9D5 and PET navi stat 0x40 on first
  call; flags not meaningful
details: If event flag 0x9D5 is already set, the function just returns 0. Otherwise it plays sound effect
  0x6B, calls GetMaxAndCurHPForCurPETNavi(0) and compares one of the returned HP values against ([unk_2000B40+6]
  * 0x64). The grant value is max(1, hp - threshold), i.e. at least 1 and otherwise the excess over the
  threshold. It then calls sub_80010EC(0, grantValue), which writes PET navi stat 0x40 clamped to the
  cap stored in stat 0x42, and finally sets flag 0x9D5. The flag makes the award one-time; the threshold
  lives in RAM at unk_2000B40+6, a struct of unknown meaning.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bne loc_808C6DC after TestEventFlagFromImmediate(EVENT_9D5) skips the whole body, making it
    one-shot; bl PlaySoundEffect with r0=#0x6b then bl GetMaxAndCurHPForCurPETNavi_80010D4 with r0=#0
    (navi slot 0); ldrh r2,[r5,#6]; mov r3,#0x64; mul r2,r3; cmp r0,r2 — threshold is field+6 times 100;
    r1 = 1 if hp <= threshold else hp - threshold, then bl sub_80010EC which the DB says clamps PET navi
    stat 0x40 to the cap in stat 0x42; SetEventFlagFromImmediate(EVENT_9D5) at the end, matching the test
    at entry
