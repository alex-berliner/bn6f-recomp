name: sub_8012AFA
address: '0x08012AFA'
kind: function
status: confirmed
summary: Tests whether the battle object's current chip is a qualifying power-attack chip with its trigger armed
  (special navi/form only, chip kind 4 with the right trait bits, plus an AI-state/button check unless force-armed).
interface: u8 sub_8012AFA(u32 battleObject, u8 forceArmed, u32 ownerObject) -> u8; r0/r1/r5 in, r0 out, r2 clobbered
  by tst-mask writes, r6/r7 preserved
details: 'Reads the navi id and form from the battle object via

  GetBattleNaviStatsByte_AllianceFromBattleObject (offsets "0x29" NAVI_STAT_NAVI and "0x2C"

  NAVI_STAT_FORM); only navi id 7 and form ids 7 or "0x13" qualify (in-game these are the

  navis whose power-attack AI is special, e.g. protoman/shadow/colonel style).


  Then fetches the current chip pointer with getChip8021DA8(battleObject) and inspects

  two chip fields: byte+9 (trait bits; bit "0x02" must be set and bit "0x01" must be

  clear) and byte+4 (chip kind, must equal 4). The trait masks are tested with `tst

  r1, r2` so r2 is left holding the last mask (2 then 1) on the tested paths, which the

  caller contract exposes as an r2 clobber.


  When forceArmed (r1) is non-zero the AI state check is skipped and the function

  returns 1. Otherwise it dereferences [ownerObject + oBattleObject_AIDataPtr] and

  requires oAIData_PwrAtkState == 2 and oAIData_PwrAtkButton == 1.


  Returns 0/1 in r0. r6 (battle object) and r7 (result scratch, set to 0 and

  overwritten to 1 on the success path) are preserved across the call as required by

  the contract.

  '
