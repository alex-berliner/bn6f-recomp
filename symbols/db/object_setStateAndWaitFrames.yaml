name: object_setStateAndWaitFrames
address: '0x081386CC'
kind: function
status: probable
summary: 'Action-script step: reads a frame count, sets object''s state byte to 8 and timer, then waits
  via object_countdownTimer'
interface: (r3 = script ptr, r5 = object work) -> r0 = 1; advances script by 2
details: Reads a frame duration from [r3+1] and stores it in the object's timer field at [r5+6]. Initializes
  a state/counter byte at [r5+3] to 8. Calls object_countdownTimer to tick the timer down each frame (which
  clears an active flag when it hits zero). Advances the script pointer r3 by 2 and stashes it back in
  the action pointer slot at [r5+0x1c]. Returns 1 (continuing the action). Acts as one entry in the object's
  scripted action/state machine.
