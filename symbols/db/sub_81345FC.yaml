name: sub_81345FC
address: '0x081345FC'
kind: function
status: hypothesis
summary: Parameterless battle-effect update wrapper that invokes battleObject_updateShieldOrStatusEffect_813468C
  with one fixed argument set (0x5A, 32x32 tile dims, 19, the byte_81331F4 table, flag 0x40000000), forwarding the
  caller's r5 as the object/state pointer.
interface: void sub_81345FC(r5 = object/state pointer passed through to the callee); returns the callee's r0-r3
  and NZCV flags to the caller verbatim; r4-r7 preserved, lr clobbered
details: Thin front end for battleObject_updateShieldOrStatusEffect_813468C with everything hardcoded — r0=0x5A
  (90, likely an effect/animation id), r1=r2=0x20 (32x32, likely sprite/tile dimensions), r3=0x13 (19, likely a
  frame count or sub-state), r4=&byte_81331F4 (a data table pointer, probably animation or coordinate data), r6=0x40000000
  (bit-30, a flag word for the callee), and the caller's r5 forwarded untouched as the per-object argument. Since
  r4 and r6 are reused to carry arguments, the function must save and restore the caller's r4-r7 around the call,
  which it does with push {r4-r7,lr}/pop {r4-r7,pc}. The register contract lists r10 as an input but the code never
  touches it, so it is presumably part of the caller's ambient state that happens to be live. Without a typed interface
  for the callee the exact meaning of 0x5A/0x13 is unconfirmed; the choice of battle-effect naming is inferred from
  the callee's name alone.
