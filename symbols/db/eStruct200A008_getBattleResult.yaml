name: eStruct200A008_getBattleResult
address: '0x0800B6B0'
kind: function
status: confirmed
summary: Returns the battle-result flag byte stored just past the start of the overworld player object table (0x200A009).
interface: 'void eStruct200A008_getBattleResult(void); /* out: r0 = battle result flag (byte at 0x200A009), r1 =
  0x200A008 (eOWPlayerObjectEnd) */'
details: Trivial one-byte getter. Loads the literal eOWPlayerObjectEnd (0x200A008, the start/end marker of the overworld
  player object structure) into r1, then reads the byte at r1+1 — byte_200A009, which sits immediately past the
  start of that object's data — into r0 and returns. The caller therefore receives both the flag value (r0) and
  the base address it came from (r1). The byte is presumably a result/status code written by the battle system when
  returning to the overworld; no flags are touched and nothing is modified.
