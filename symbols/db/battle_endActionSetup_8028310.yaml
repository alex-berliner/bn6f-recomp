name: battle_endActionSetup_8028310
address: '0x08028310'
kind: function
status: confirmed
summary: Runs the standard end-of-battle-action bookkeeping, resetting a battle counter with 0x1FF and then firing
  scripted action 0x1D.
interface: void battle_endActionSetup(void) // no meaningful inputs; returns to caller via lr (r0-r1 clobbered,
  flags clobbered, r2-r7 preserved)
details: 'A tiny tail-style helper in the battle subsystem. It first loads the constant 0x1FF (511, likely an "all
  bits set within 9 bits" mask / reset value) into r0 and calls sub_80281C4, which presumably clears or re-arms
  some battle state field or timer with that value. It then loads 0x1D (29) into r0 and calls sub_8028204, presumably
  a "queue/perform action ID" routine, so this looks like the fixed two-call prologue the engine uses when the current
  battle action finishes. No other registers are set up: r1-r7 are deliberately passed through untouched, so the
  callees may read caller state from them (the lifter''s contract confirms r1-r7 are live on entry and preserved
  through this wrapper). Touches no memory of its own; everything is delegated.

  '
