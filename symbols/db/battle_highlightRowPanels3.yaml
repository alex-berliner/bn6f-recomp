name: battle_highlightRowPanels3
address: '0x080F38AA'
kind: function
status: probable
summary: Highlights a 3-panel horizontal row in the battle object's own row, stepping inward from a side-dependent
  starting column.
interface: (r5 = battle object ptr, reads oBattleObject_Alliance and oBattleObject_PanelY) -> r0 = destroyed;
  highlights 3 panels via object_highlightPanel
details: 'r6 is set to 6 when Alliance==0 else 1, serving as the starting X column. For i=0..2 it calls
  object_getFrontDirection, negates it, multiplies by i, and adds to r6, so the highlighted columns march
  opposite the object''s facing direction: an ally highlights columns 6,5,4 and an enemy columns 1,2,3,
  all on the object''s PanelY row. Each computed (x,y) is passed to object_highlightPanel, which sets
  the panel''s flag byte at offset 1. Only PanelY is read from the object; the caller''s r5 must stay
  intact (r4 and r6 are clobbered despite being saved only r4).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_Alliance]; mov r6,#6 / #1 picks starting column by side; loop bl
    object_getFrontDirection; neg; mul r0,r4; add r0,r6 computes column offsets 0..2 opposite facing;
    bl object_highlightPanel with r0=x, r1=[r5,#oBattleObject_PanelY] marks each panel; cmp r4,#3; blt
    loops exactly three panels in one row'
