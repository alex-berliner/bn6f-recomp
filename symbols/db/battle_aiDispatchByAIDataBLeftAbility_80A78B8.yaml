open_questions:
- The function name suggests it dispatches on BLeftAbility, but the index register actually reads `r5[8]`
  which is CurState; the table is therefore a CurState jumptable. BLeftAbility is unused here. Renaming
  to `battle_aiDispatchByCurState_80A78B8` would more honestly describe what the assembly does — kept
  the role-tag but flagged this.
- Whether `sub_8142068` truly takes r0=ListIndex or r0=object pointer is unknown; the call passes whatever
  `r5[4]` is. A look at `sub_8142068` would settle this.
