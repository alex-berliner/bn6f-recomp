name: start_initBattleScene
address: '0x0803CCFC'
kind: function
status: probable
summary: 'Initialises a fresh battle scene: resets graphics state, starts bgm 0x63, sets up battle fade
  gfx state, arms a screen fade-in, and stores 4 to [r5] as the new scene/flow state.'
interface: () -> void; r5 must point to the scene-state byte (assumed set by caller); writes 4 to [r5]
details: Calls chatbox_8040818 (likely chatbox reset), applies toolkit overlay palette 0x16, and writes
  LCD control 0x1F40 (DISPCNT-style) via SetRenderInfoLCDControl. Then clears the render info counters
  (renderInfo_8001788/80017A0) and performs a full graphics reset (VRAM/WRAM/palettes/render info, dummy
  BG scroll callbacks) plus one setup step whose work area is wiped. It initialises the battle fade graphics
  state struct, runs unknown helper sub_803CD58, starts bg music 0x63, and calls SetScreenFade(8, 8) to
  arm a fade-in. Finally it stores byte 4 to [r5], presumably the caller's scene/flow state variable.
  The [r5] use with no prior assignment suggests r5 is caller-set-up scene context.
