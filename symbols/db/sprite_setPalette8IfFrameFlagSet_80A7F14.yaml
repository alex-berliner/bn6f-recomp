name: sprite_setPalette8IfFrameFlagSet_80A7F14
address: '0x080A7F14'
kind: function
status: confirmed
summary: Reads the sprite's current frame parameters and, if the frame's 0x80 flag bit is set, writes
  8 into the sprite's palette/render byte at offset 9.
interface: void sub_80A7F14(r5 sprite_obj); (calls sprite_getFrameParameters(sprite_obj) -> r0 frame params)
details: 'Takes a sprite object pointer in r5 (preserved through the call). Calls

  sprite_getFrameParameters with r5 as the sprite; the returned r0 holds the

  frame parameter bitfield. Tests bit 0x80: if set, stores the immediate 8 as

  a byte at [sprite+9]. If the bit is clear the sprite is left untouched, so

  the effect is one-way (only ever sets the value to 8, never clears it back).

  Offset 9 in the sprite object appears to be a palette index / render-mode

  byte (the frame''s 0x80 parameter bit acts as a "use palette 8" request).

  Clobbers r0-r3 and flags; preserves r4-r7.

  '
