name: sub_81281E0
address: '0x081281E0'
kind: function
status: confirmed
summary: Battle object icon display — submits up to four OBJs to the sprite queue using an icon descriptor table
  and a per-record tile source.
interface: void sub_81281E0(struct battle_obj_state *r5);
details: "Reads the battle-object state at r5:\n  +0x1E u16 count — number of icons to draw; 0 short-circuits, >4\
  \ is clamped to 4.\n  +0x24 u16 base   — index into the dword_2027590 sprite-record pool (records are 0x20 bytes;\
  \ index is re-read each iteration — every icon's base depends on the live field).\n\nFor each icon i in [0, count):\n\
  \  • Reads a packed on-screen (x,y) from byte_8128250 (pairs of halfwords, 4 bytes per icon: entries cover cols\
  \ 0x18/0x28/0x38/0x48 rows 0x18 — single row of four icons).\n  • Builds the sprite record pointer = dword_2027590\
  \ + (base + i) * 0x20.\n  • Tile = 0x210 + ((record.dword0 >> 16 & ~0x80) << 2) — so the high halfword of the\
  \ first word of the record supplies the tile index (with bit 7 forced clear) shifted up by 2.\n  • Calls sub_802FE28(attr01\
  \ = 0x40000000 | packedPos, attr2 = (0xA << 12) | (2 << 10) | tile, 0, 2) — i.e. affine OBJ slot, 4bpp, palette\
  \ 2, with tile 0xA800|tile.\n\nReturns r5 unchanged (only used as a preserved scratch slot). Loop uses r7 as the\
  \ counter; r6 holds count; r4 holds the packed position; r3 is loaded from the table; r0/r1/r2 are call arguments\
  \ to the sprite-queue routine.\n"
