name: eJoypad
address: '0x0200A270'
kind: ram
previous_names: []
status: confirmed
summary: Joypad state; +0x08..+0x10 per-key held-frame counters, +0x13 key-repeat phase (cycles 0..4 while a direction
  is held).
details: Fields as named in include/structs/Joypad.inc (AHeldTimer..RHeldTimer, LowSensitivityTimer). A held direction
  repeats when +0x13 wraps; the repeat bits at +0x04 fire then. A reload resets the counters, so recordings cut
  into segments must restore +0x08..+0x17.
evidence:
- method: runtime
  date: '2026-10-13'
  detail: 'One-off emulator probe: the per-key held timers at +0x08..+0x0F count up while a key is held and saturate
    near 0x10 (the run shows 10 00 00 10, a fresh reload 01 00 00 01).'
  reproduce: 'python3 tools/vidsync/probes/seg12joy.py RESULT STATE G   # on the PC with the vidsync data:
    RESULT/STATE from build-vidsync/data/auto/, run there through tools/vidsync/remote/py.sh; see docs/vidsync/SYMBOL_DOSSIER.md'
- method: runtime
  date: '2026-10-13'
  detail: '+0x13 (LowSensitivityTimer) is the key-repeat phase: segment 12 of the recording opened E-Mail instead
    of NaviCust because it was one phase off after a reload; writing +0x08..+0x17 at the junction fixed it.'
  reproduce: python3 tools/vidsync/probes/seg12fix.py; grep -n 'ALWAYS' tools/vidsync/segments.py
  result: the fixed junction follows the video (NaviCust opens)
