name: object_stateTimerExpire
address: '0x08038D7C'
kind: function
status: probable
summary: 'Per-frame countdown for an object: when its timer hits zero it switches the object to state
  0x14, reloads the timer with 0x2E, and calls a follow-up routine.'
interface: (r5 = object/state struct) -> r0 = result of sub_8039024; flags from that call only on timer
  expiry
details: Reads the halfword timer at [r5+4] and decrements it each call. When it reaches zero, the byte
  state/mode field at [r5+2] is set to 0x14 and the timer is reloaded with 0x2E (46 frames), then sub_8039024
  is invoked — consistent with the common BN6 object pattern of a mode byte plus a frame-countdown halfword.
  On all other ticks it just returns. Nothing else in the function touches r5 or globals.
