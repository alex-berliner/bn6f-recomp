name: ai_pickPanelNearClosestEnemy
address: '0x08116044'
kind: function
status: probable
summary: 'AI helper: finds the closest enemy battle object and picks a filtered panel adjacent/near it
  using a per-state relative-offset list, for AI targeting.'
interface: (implicit r5 = BattleObject; no register args) -> r0 = panelFlagCheck result (selected panel/coords);
  clobbers r0-r4
details: Reads the object's alliance (oBattleObject_Alliance), XORs it with 1 to get the opposing side,
  and calls battleObject_findClosestEnemyBattleObject to locate the nearest enemy object. Uses that enemy's
  panel coordinates (offsets 0x12/0x13) as the base panel. Field 0x68 of the acting object, shifted left
  2, indexes the pointer table off_81160C4, selecting a relative-offset panel candidate list (0x7F-terminated
  format per panelFlagCheck). GetAllianceDependentPanelParamArgs (r3 = byte_8116190 data) supplies the
  panel-effect param word and args for the base panel, and panelFlagCheck walks the offset list, transforming
  offsets by facing and filtering candidate panels. This appears in AI/battlesweep routes, consistent
  with an AI attack/move panel selection step.
