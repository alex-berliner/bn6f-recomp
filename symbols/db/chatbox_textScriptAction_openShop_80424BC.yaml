name: chatbox_textScriptAction_openShop_80424BC
address: '0x080424BC'
kind: function
status: confirmed
summary: Chatbox text-script action for shop counters — closes the chatbox and launches the shop scripted at this
  step, once.
interface: void chatbox_80424BC(void) // r4 = script step context ([r4+2] = shop id), r5 = chatbox state ([r5+4]
  = script step state byte); returns r0 = 0; NZ set (Z=1), C/V as left by prior ops
details: 'Text-script action handler invoked during chatbox script execution. First calls chatbox_setflags_3e with
  mask FLAGS_3E_UNK_0001 (the "close chatbox" flag, so the text window shuts before the shop UI opens). Then reads
  the text-script state byte at [r5+oChatbox_TextScriptState_04]: if 0 (step not yet taken), reads the shop id byte
  at [r4+2] and calls subsystem_launchShop to open that shop, then stores 1 into the state byte so the shop isn''t
  launched again if the script step repeats. Always returns 0 in r0. r4 appears to be the current script step/command
  record (shop id at offset 2) and r5 the chatbox/script state structure whose +4 field records one-shot step completion.
  Quirk: the final `mov r0, #0` only rewrites N and Z — on the skip path C=1/V=0 survive from the `cmp r0, #0`,
  and on the launch path C/V come from subsystem_launchShop, so flags reaching the caller differ per path.

  '
