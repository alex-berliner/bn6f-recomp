name: battle_isTimeStopMirrorActive
address: '0x080BB89C'
kind: function
status: probable
summary: returns whether the related battle object's AI data marks the TimeStop mirror as held
interface: (r0 = unused/0) -> r0 = 1 if TimeStopMirrorHeld bit0 set else 0
details: Loads r5's related-object pointer (oBattleObject_RelatedObject1Ptr), reads that object's oBattleObject_AIDataPtr,
  tests bit 0 of oAIData_TimeStopMirrorHeld, and returns 1/0 accordingly. Pure predicate, no state changes;
  caller at 0x080BB73A uses the result to skip a timer countdown and jump straight to action 0xC / phase
  0 instead of waiting.
