name: sub_80C9774
address: '0x080C9774'
kind: function
status: hypothesis
summary: Advance a parent battle object's position by its child's velocity plus the child's own position, mirror
  one flag bit from the child, and end the action when the first ExtraVars dword is zero.
interface: 'void sub_80C9774(struct BattleObject* self /* r5 */);

  // clobbers r0..r3 and N/Z/C/V; preserves nothing

  '
details: '`self` (r5) is a parent battle object with a non-null `RelatedObject1Ptr` (r3).

  For each axis (X, Y, Z) it reads the child''s coordinate from the related

  object and the parent''s velocity from itself, summing into a new parent

  coordinate and storing it back. So the parent trails/follows the child by

  its velocity - typical "follow the leader while moving" behavior for a

  dual-object battle entity.


  Then it copies bit 1 (`0x02`) of the child''s `oObjectHeader_Flags` into the

  parent''s header flags, clearing bit 1 in the parent first. Bit 1 of the

  header flags is the standard "object is hidden / invisible" bit in this

  engine, so this keeps the parent''s visibility in sync with the child''s.


  If the first dword of `oBattleObject_ExtraVars` (i.e. `ExtraVars[0]`) is

  zero, the action terminates immediately: `CurAction` is set to 4 and the

  combined `CurPhaseAndPhaseInitialized` halfword is zeroed. The non-zero

  branch leaves the action running and the ExtraVars pointer alone.


  r0/r1/r2/r3 returned to the caller hold: (r0 = ExtraVars[0] or 0;

  r1 = related_flags & 2; r2 = 2; r3 = related object pointer), and N/Z are

  set from r0 (C/V cleared by the preceding AND).

  '
