  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne shows a one-time init branch that writes
    element 4 and arms StepTimer=0x24+TimerOrCycles; bl sub_80F82E2; strb r0,[r7,#oAIAttackVars_TargetPanelX]
    picks an aim column during init; bl sub_80E3976 with PanelX/PanelY/AiDifficultyTier and ScratchVar
    as 4th arg spawns an entity whose handle is stored via r7; ChargeCycles increment with lsr #3 carry
    check and bl sub_80F82B0 inside the 0x1B..+TimerOrCycles window is a periodic charge effect; ldr r0,[ScratchVar];
    ldr r0,[r0]; strb 1,[r0,#0xB] at timer==0x1B activates the spawned entity, and HitElement=0x10 on
    timer expiry ends the attack'
