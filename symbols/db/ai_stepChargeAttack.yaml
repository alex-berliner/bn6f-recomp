name: ai_stepChargeAttack
address: '0x080F7D34'
kind: function
status: probable
summary: 'Enemy AI attack state machine: charges up (spawning a charge effect at the object''s panel),
  then fires at a chosen target panel and expires.'
interface: (r0 = element flag check, r5 = battle object, r7 = oAIAttackVars state) -> r0 = clobbered;
  updates oAIAttackVars_StepTimer/ChargeCycles/HitElement and oBattleObject_CurAnim
details: 'First call (AttackElement==0) commits the attack: sets AttackElement=4, gets a target panel
  X from sub_80F82E2, sets StepTimer=0x24+TimerOrCycles (difficulty-scaled duration), clears ChargeCycles,
  and on SubStepIndex==0 calls sub_80E3976 with panel X/Y and the AiDifficultyTier, storing an object
  handle into oAIAttackVars_ScratchVar, and sets CurAnim=0xF (charge pose). During the charge window (timer
  between 0x1B and 0x1B+TimerOrCycles) it counts ChargeCycles and calls sub_80F82B0 every 8th cycle (charge
  tick). When the timer hits 0x1B+TimerOrCycles it switches to anim 0x10 (fire pose); at timer==0x1B it
  dereferences the spawned handle and stores 1 at offset 0xB, triggering the spawned entity; when the
  timer reaches 0 it sets HitElement=0x10 to end the state.'
