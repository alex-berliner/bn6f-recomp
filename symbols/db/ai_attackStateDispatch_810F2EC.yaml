name: ai_attackStateDispatch_810F2EC
address: '0x0810F2EC'
kind: function
status: confirmed
summary: Trampoline that dispatches the current enemy AI attack-state byte to its per-state step handler
  (setup/step/exit) via a jump table.
interface: void sub_810F2EC(r5, r6, r7 /*AIAttackVars**/, r10); results passed through in r1/r5/r8-r12,
  NZCV clobbered
details: 'Tail-call trampoline in the enemy AI attack machinery. Reads the current attack-state byte from
  the AI attack-vars block pointed to by r7 (oAIAttackVars_HitElement/Unk_00, a 1-byte field) and uses
  that raw byte as an offset into the handler table at off_810F300 (valid states are 0, 4, 8, 0xC - one
  word per entry, so the table is indexed by the state value itself, not state*4). It then calls the selected
  Thumb handler with lr set via mov lr, pc / bx r1, passing r0 = state byte and r1 = table entry, with
  r5/r6/r7/r10 forwarded untouched. The four handlers are sub_810F310 (state 0, likely attack-state entry/setup),
  sub_810F33C (state 4, likely the main attack step), ai_beastAttackStepTick (state 8, the repeated attack
  tick), and genericAI_exitAttackStateAfterDelay_81097BA (state 0xC, ending the attack after a delay).
  Because this is a register-based trampoline, everything the handler leaves in r1/r5/r8-r12 flows straight
  back to sub_810F2EC''s caller; r0/r2/r3/r4/r6/r7 and the flags are dead on the way back.

  '
