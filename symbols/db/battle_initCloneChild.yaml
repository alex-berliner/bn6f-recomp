name: battle_initCloneChild
address: '0x081100B0'
kind: function
status: probable
summary: Initializes extra state on the calling battle object, then spawns and links a battle object of
  type 0x2E (a clone/mirrored child) and stores its pointer.
interface: (implicit r4-r7/r5 = parent battle object) -> r0 = pointer to spawned linked child object;
  parent's ExtraVars+8 holds it
details: 'The function treats r5 as a battle object and prepares it before spawning a linked child: it
  zeroes ExtraVars, ExtraVars+0x10, byte 0x7D, and byte 0x66; copies PanelX/PanelY into bytes 0x64/0x65
  (remembering a position); and writes the parent''s AIData ''Version'' byte into 0x7E, apparently passing
  a variant/config value along. It then calls battle_spawnLinkedChild2E, which spawns object type 0x2E
  inheriting the parent''s alliance/flip and flag bit 4, and stores the returned child pointer at ExtraVars+8.
  The pattern (clear extra vars, stash position, link a child) looks like setup for an effect that mirrors
  or duplicates the parent''s behavior on its panel. Since the caller is unknown and type 0x2E is unnamed,
  the exact in-game identity (clone, mirror, shadow) can''t be pinned down.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: str r0,[r5,#oBattleObject_ExtraVars] and ExtraVars+0x10 zeroed first — fresh extra-var state;
    ldrb PanelX/PanelY ... strb to 0x64/0x65 — copies current panel coords into new byte fields; ldr r1,[r5,#oBattleObject_AIDataPtr];
    ldrb [r1,#oAIData_Version_16]; strb to 0x7E — forwards an AI-data byte; bl battle_spawnLinkedChild2E
    — sole callee, spawns type 0x2E linked to the caller; str r0,[r5,#oBattleObject_ExtraVars+8] — result
    of spawn is stored as the linked child pointer
