name: t3_0x2b_80C96A0
address: '0x080C96A0'
kind: function
status: confirmed
summary: Per-frame tick handler for the Shield battle object - dispatches its current-state handler, then refreshes
  the sprite unless time stop is active.
interface: void shield_tick(battleobject* obj /* r5 */, battlectx* ctx /* r10 */); returns r5 = obj as the state
  handler left it (r8-r12 also carry handler state)
details: "Task/frame handler for the shield object (r5 = battle object). Reads the\nobject's CurState byte (oBattleObject_CurState)\
  \ and indexes a 3-entry\njump table at off_80C96BC:\n  state 0 -> battleObject_initElement_80C96C8 (init/spawn\
  \ state)\n  state 1 -> sub_80C9726 (main behaviour)\n  state 2 -> object_freeMemory (self-destruct / free object)\n\
  Dispatch is done with the classic 'mov lr, pc; bx r1' tail-call into\nthumb handlers, passing r0 = state and r1\
  \ = handler; the handler's\noutputs are left in r8-r12 plus an updated r5, which this routine\npropagates to its\
  \ own caller.\nAfter the handler runs it calls battle_isTimeStop; if time stop is NOT\nactive (Z set) it calls\
  \ object_updateSprite(r5) to advance the object's\nsprite frame/animation; during time stop the sprite update\
  \ is skipped so\nshields freeze with the rest of the battlefield.\nInputs per contract: r5 (object), r10 (battle\
  \ context) and lr; the\nhandler chain clobbers r0-r7 and flags and passes back r5, r8-r12.\n"
