name: rollInternetMysteryData_809FDE0
address: '0x0809FDE0'
kind: function
status: confirmed
summary: Rolls which mystery data spawns in the current internet map block, hashing the pending state
  halfword into a slot number and picking that type-5 entry from the block's entry list.
interface: void sub_809FDE0(void); // reads state at byte_2000210; callers pass r4-r7/r10 (preserved)
  and ignore outputs other than flags c/v and r1/r2/r3 side values
details: 'Uses the scratch state at byte_2000210: byte +4 is the internet map id (biased by 0x80), byte
  +5 is a group index, halfword +6 is the pending mystery-data roll result. If the halfword is 0 the function
  returns immediately without touching anything. Otherwise it fills a 16-byte stack scratch buffer with
  0x20 via ByteFill and hashes it together with the current halfword value through sub_8000E3A, adding
  1 to get a 1-based target slot. It then looks up InternetMysteryDataMapGroupEntries[(map-0x80)*8+4]
  to get the group table, indexes it with group*4 to get the entry list, and walks the list in 0xC-byte
  strides (byte 0 = entry type, halfword at +2 = payload). Every type-5 entry (a mystery-data slot) increments
  a counter; when the counter reaches the target, the entry''s payload halfword is written back to byte_2000210+6.
  If the list ends (type 0) before the target is reached, the halfword is cleared to 0 instead, i.e. nothing
  spawns this roll. Quirk: r1 leaves holding group<<2 (the leftover table index shift) and r3 leaves holding
  the slot counter reached, which callers apparently only use for flag/state propagation; r2 is whatever
  sub_8000E3A leaves. Both exits fall through an equal compare, so C is set and Z is set on return.

  '
