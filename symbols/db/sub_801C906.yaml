open_questions:
- What is the table at off_801C970 (dword_86E1C78 / byte_3001B00 / 0x20)? The read-only ROM source array dword_86E1C78
  likely holds 32-byte companion tiles (e.g. a slash, a colon, a letter) that ride next to the four digits; the
  index at obj+3 selects which companion to show, but the field's meaning is not yet identified from the code alone.
- Is +0x24 a raw integer or already BCD? memory_bcdConvert suggests raw integer; whether the BCD result is then
  used to index digit tiles or to spell out HP/MP directly depends on which of the digit glyphs is tile 0xD1A0.
- Does the "label" ever include a leading non-zero digit? The 0xA blank-fill implies HP can show with leading blanks;
  whether that matches the field UI (e.g. ""HP  42"" style) is plausible but not confirmed here.
