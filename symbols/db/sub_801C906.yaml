name: sub_801C906
address: '0x0801C906'
kind: function
status: confirmed
summary: redraws a field object's four-digit HP readout by stamping right-aligned digit glyphs into background tile
  block 3 and queuing the companion 32-byte tile upload for VRAM
interface: 'void drawNumberLabel_801C906(void); /* r5 in: label object; r4-r7 preserved; r3/r4-r7 out: leftover
  from callee, r4-r7 restored to entry values */'
details: "- r5 points at a label/object struct with: u16 at +0x24 (the value to display,\n  a BCD-convertible number),\
  \ u8 at +1 (map j position), u8 at +2 (map i\n  position), u8 at +3 (index into the companion-tile table).\n-\
  \ The value at +0x24 is BCD-converted via memory_bcdConvert, the nibble count\n  is taken via countHexDigits_8000C5C,\
  \ and the high nibbles above the\n  significant digits are filled with 0xA (the blank digit glyph nibble) so the\n\
  \  number is right-aligned with leading blanks.\n- A 4x2 tile-id buffer is built on the stack (8 entries, 4 columns\
  \ x top/bottom).\n  For each of the 4 columns, the nibble picks a digit glyph starting at tile\n  0xD1A0; the\
  \ top tile (0xD1A0 + nibble*2) and the tile below it\n  (top + 1) are stored. Iteration goes column 3 -> 0, so\
  \ the layout is\n  column 0 = rightmost digit.\n- CopyBackgroundTiles is called with (j+1, i, tileBlock=3, tile_ids,\
  \ j_size=4,\n  i_size=2): the readout is drawn one tile right of the stored object position\n  in background tile\
  \ block 3, four tiles wide and two tiles tall.\n- QueueEightWordAlignedGFXTransfer uploads 32 bytes of companion\
  \ tile gfx:\n  the source is the 32-byte table entry indexed by object+3 (dword_86E1C78 +\n  (obj[+3] * 0x20)),\
  \ the destination is byte_3001B00, and the size is 0x20.\n- The function is called as a leaf-style helper from\
  \ a caller that owns a\n  loop over multiple label objects; r4-r7 are pushed on entry and popped on\n  return,\
  \ and the mid-function push/pop of r5 around the CopyBackgroundTiles\n  call simply restores r5 to the caller's\
  \ object pointer before the gfx queue\n  step. The function reads nothing back from its callees."
