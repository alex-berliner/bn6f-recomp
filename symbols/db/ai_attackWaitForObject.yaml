    teardown: str #0 into oBattleObject_RelatedObject1Ptr and oAIData_TempAttackObjectPtr before bl object_exitAttackState;
    callee summaries (object_clearFlag on ObjectFlags1, object_exitAttackState) match an attack-state
    step handler'
