name: ai_attackWaitForObject
address: '0x080EBBE2'
kind: function
status: probable
summary: AI attack step that waits a few frames for a spawned attack object, then detaches it and leaves
  the attack state.
interface: () -> void; uses the dispatcher's current-object registers (r5 = battle object, r7 = its AI
  attack vars)
details: On the first call (AttackElement == 0) it clears ObjectFlags1 bit 0x40 on the object, sets StepTimer
  = 5 and AttackElement = 4 so the init branch never runs again. Every call then decrements StepTimer;
  while it is still >= 0 the function just returns, keeping the attack state alive. Once the timer goes
  negative it nulls oBattleObject_RelatedObject1Ptr and the AIData TempAttackObjectPtr, dropping the reference
  to the spawned attack object, and calls object_exitAttackState to return the AI to normal. Element value
  4 acts purely as an 'already initialized' marker for this waiting phase.
