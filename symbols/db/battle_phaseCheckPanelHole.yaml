name: battle_phaseCheckPanelHole
address: '0x080B9848'
kind: function
status: probable
summary: 'Phase 0: sets CurPhase=4, CurAnim=3, plays sound 0x94, sets Flags bit 1, loads 3-frame timer.
  After timer expires, checks panel status flags for 0x10010; if set, sets CurAction=4, else CurAction=0x10,
  and clears CurPhaseAndPhaseInitialized.'
interface: (r0 unused, r5 = battle object header) -> r0 = 0; touches oBattleObject_CurPhase, CurAnim,
  Flags, TimerAndTimer2, CurAction, CurPhaseAndPhaseInitialized
details: Phase 0 entry sets CurPhase=4, CurAnim=3, plays sound effect 0x94 via PlaySoundEffect, sets oObjectHeader_Flags
  bit 1, and loads a 3-frame timer into TimerAndTimer2, then returns. On later calls it decrements Timer
  and until it expires does nothing. It then reads the object's PanelX/PanelY and calls object_getPanelParameters;
  if the panel's status flags masked with 0x10010 equal 0x10010 (both bits 4 and 16 set, e.g. destroyed/hole),
  it sets CurAction=4, otherwise CurAction=0x10, and clears CurPhaseAndPhaseInitialized either way to
  hand control back to the object's action dispatcher.
