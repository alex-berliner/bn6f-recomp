name: NPCCommand_set_collision_radius
address: '0x0809EE22'
kind: function
status: confirmed
summary: Overworld NPC script opcode handler that sets an NPC object's collision radius from a one-byte argument
  in the script.
interface: (r5 = OverworldNPCObject*, r6 = script cursor) -> r0 = radius byte, r6 = cursor advanced by 2; NZCV set
  from (r6 + 2)
details: 'This is one of the NPC "command" handlers used by overworld NPC scripts. r5 points at

  the overworld NPC object and r6 is the current position in the NPC''s script/command

  stream. The handler reads the byte at cursor+1 (the command''s argument, since the

  opcode itself is at cursor+0) and stores it into the NPC object''s CollisionRadius

  field (oOverworldNPCObject_CollisionRadius). This radius presumably controls the size

  of the NPC''s interaction/collision area when the player approaches it in the overworld.

  It then advances the cursor by 2 (opcode byte + radius byte) so the script interpreter

  continues at the next command, and returns to the dispatcher via the saved lr in pc.

  The flags reflect the r6 += 2 add (harmless side effect of the tail "add r6,#2"),

  and r0 conveniently returns the radius value that was written.

  '
