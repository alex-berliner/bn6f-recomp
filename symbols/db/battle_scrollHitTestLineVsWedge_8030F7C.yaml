    on sign check: `cmp r5, #0 ; ble loc_8030FEE` then `mov r0, #0 ; mov r1, #0 ; pop {pc}`. - Second-axis
    gate uses r8 (`mov r3, r8 ; cmp r3, #1 ; beq loc_8030FB4`) and the [r0,#0xc]/[r0,#0x10] fields. -
    Two-stage ray projection via `bl battleObject_collisionProjectRay_8031048`, each time pushing/popping
    r6/r7 across the call and reading back [r0,#0]/[r0,#4] (projX/projY) to compute deltas. - Final return
    shuffles r9 into r0 and r8 into r1: `mov r0, r9 ; mov r1, r8 ; pop {pc}`. - Captured calls show the
