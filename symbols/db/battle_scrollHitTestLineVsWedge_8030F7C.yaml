summary: Performs a line-vs-wedge hit test for battle camera/scroll queries, returning two offsets via
  r0/r1.
interface: (r0 = CollisionData*, r1 = ?, r2 = lineY/r2_in, r3 = lineX/r3_in, r4 = ?, r5 = ?, r6 = ?, lr
  = ?) -> r0 = dyComp/r9, r1 = dxComp/r8 ; side effects trashes r2-r7, r8, r9
details: 'Reads four u32 vectors from r0 (offsets 0x0, 0x4, 0xC, 0x10) treating them as 2D points/lines
  for a line-vs-wedge query.

  Computes a 2D cross product r2 = (r5*r2 - r4*r3) over the input delta (r6 = r5-r4, r7 = r2-r3).

  Forms a 2x2 determinant using offsets +0x0/+0x4 of r0 with the delta and accumulates into r5.

  If r5 <= 0 takes an early-exit branch returning r0=0, r1=0.

  Otherwise, if r8 != 1, performs a second determinant check using offsets +0xC/+0x10 of r0; bails out
  on r5 > 0 (different sign from the first), but proceeds if either r8==1 or the second determinant is
  also non-positive.

  Builds a vector (-((r0_0 * r6) + r2), r7) and calls battleObject_collisionProjectRay_8031048 to project
  along r6/r7; reads the projected Y and saves (r7 - projY) into r8.

  Builds another vector (-((r0_0 * r7) + r2), r6) and projects again; reads the projected X and saves
  (r6 - projX) into r9.

  Returns r0 = r9, r1 = r8 (the projected component deltas).

  Caller side: battle_scrollAdvanceByPanelStep_8031520/battle_scrollStep_80314CC accumulate these into
  r12 to drive camera scroll/clamp behavior.

  Tail call (`pop {pc}`) used as the return path, so lr is not preserved separately.

  '
