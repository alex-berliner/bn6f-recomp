name: object_animSwap
address: '0x080E3904'
kind: function
status: probable
summary: 'Battle-object step: on first call sets phase=4, CurAnim=1, Timer=27; on timer expiry switches
  to CurAnim=2 with action 0xC and clears the phase.'
interface: (r0 = unused/ignored, r5 = battle object pointer) -> updates oBattleObject_CurPhase, CurAnim,
  Timer, CurAction, CurPhaseAndPhaseInitialized; no return value
details: 'This is a per-frame state handler for a battle object passed in r5 (r0 is loaded but immediately
  overwritten, so it is unused). When oBattleObject_CurPhase is 0 it initializes a state: phase = 4, CurAnim
  = 1, and Timer = 0x1B (27, counted down over ~28 frames). On later frames it decrements the 16-bit Timer
  and returns while it is still positive. When the timer expires it sets CurAnim = 2, CurAction = 0xC,
  and writes 0 to the 16-bit phase/phase-initialized pair so the normal phase machinery restarts. It is
  thus a timed ''play animation 1, then hand off to action 0xC with animation 2'' staging step, presumably
  phase 4 of some scripted object behavior hit on the battlesweep/beastsp/chips routes.'
