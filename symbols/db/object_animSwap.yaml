  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst r0,r0; bne loc_80E391A gates init vs countdown; init
    path: strb #4 CurPhase, strb #1 CurAnim, strh #0x1b Timer; countdown path: ldrh/sub/strh Timer, bgt
    exit while timer > 0; expiry path: strb #2 CurAnim, strb #0xC CurAction, strh #0 CurPhaseAndPhaseInitialized;
    executed on recorded battlesweep, beastsp and chips routes; r0 never read before overwrite'
