name: battle_spawnType4ObjectWithActiveFlag_80E06F8
address: '0x080E06F8'
kind: function
status: confirmed
summary: Spawns a type-4 object (variant 2), then marks the resulting object's header flags with bit 0x04 and returns
  it.
interface: Next sub_80E06F8(u32 a1 /*r1*/, u32 a2 /*r2*/, u32 a3 /*r3*/); r5 on entry holds the object header context,
  returns the spawned object pointer in r0; preserves r4-r5
details: 'Thin wrapper around object_spawnType4: sets r0 = 2 (variant id) while forwarding r1-r3 as the spawner''s
  arguments. After the call, the spawned object header is in r5; the wrapper reads oObjectHeader_Flags, ORs in 0x04
  (the active/enabled flag bit for this object type), stores it back, and returns the object pointer in r0. The
  literal pool word 0x400 at off_80E070C follows the function but is not referenced by this code. Callers'' r4/r5
  are preserved via push/pop.'
