name: battleObject_initObstacle_80D22B0
address: '0x080D22B0'
kind: function
status: confirmed
summary: 'Initializes a battle-field obstacle sprite: loads its 128×16 tilemap, assigns 500 HP / name 0xCE, creates
  a 14×15 solid hitbox, and transitions it to its update state.'
interface: battleObject_initObstacle_80D22B0(r5 = battleObjectPtr, r8 = spriteList) -> (r5 = battleObjectPtr or
  freed, r8 = spriteList); clobbers r0-r3, nzcv, lr; preserves r4-r7
details: 'Loads the obstacle sprite via sprite_load(0x80, 0x10, 8) meaning a 128×16 tile grid at 8 bpp. Resets CurAnimAndCurAnimCopy
  (u16 at oBattleObject_CurAnimAndCurAnimCopy) to 0 and calls sprite_setAnimation, sprite_loadAnimationData, sprite_update,
  sprite_hasShadow, and object_setCoordinatesFromPanels. Centers the object on the depth axis by zeroing oBattleObject_Z,
  copies oBattleObject_PanelXY into oBattleObject_FuturePanelXY, then subtracts 1 from both oBattleObject_Z16 and
  oBattleObject_Y16 (tile-edge rendering nudge). Sets identity fields: oBattleObject_NameID = 0xCE, oBattleObject_HP
  and oBattleObject_MaxHP = 500 (0x1f4, encoded as 0xfa << 1), oBattleObject_Timer = 0x1770 (6000). Calls object_createCollisionData;
  on failure (r0 == 0) frees the object via object_freeMemory and returns immediately with the original r8. On success
  calls object_setupCollisionData(width=0xe, height=0xf, type=3) then object_presentCollisionData to register the
  hitbox in the scene. Finally writes CUR_STATE_UPDATE into oBattleObject_CurState (u8). Quirk: the HP value is
  computed as literal 0xfa shifted left by 1 (250×2 = 500) rather than a direct 0x1f4, which may hint at an internal
  half-HP unit convention.

  '
