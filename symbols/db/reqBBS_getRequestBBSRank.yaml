name: reqBBS_getRequestBBSRank
address: '0x08140798'
kind: function
status: confirmed
summary: Returns the player's request-BBS rank, read from the request-BBS GUI work area's rank byte.
interface: u8 reqBBS_getRequestBBSRank(void) — no register inputs; returns u8 rank in r0 (r1 incidentally left as
  0xE, r4-r7 preserved)
details: 'Trivial getter — loads the byte at eReqBBSGui+0xE (offset held in the literal dword_81407A4 = 0xE) and
  returns it. That byte is presumably the player''s current request-board rank in the request-BBS GUI/save work
  area. The function is already named. Quirk: r1 is not an intentional output; the compiler''s literal load of the
  0xE offset happens to leave 0xE in r1, which the lifter records as an output. No flags are meaningfully set by
  the caller-visible path.'
