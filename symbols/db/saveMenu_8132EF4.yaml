summary: Draws the save menu's background layer by blitting four prebuilt tilemaps (header text plus three window
  pieces) into background tile block 2.
interface: void saveMenu_drawBackground_8132EF4(void); // no meaningful inputs; r4-r7 preserved; r0-r3, flags clobbered
details: 'Pure rendering routine: it makes four calls to CopyBackgroundTiles with tile_block=2, copying tilemap
  data from IWRAM buffers into the background. The four blits are: (6,3) size 8x8 from unk_201C400 — the main 64x64-tile
  menu backdrop/frame; (0x12,3) size 7x2 from unk_201C480 — a 56x16 strip (likely a header/label window); (0x12,7)
  size 7x2 from unk_201C4A0 — second strip; (0x12,9) size 7x2 from unk_201C4C0 — third strip; the three strips stack
  vertically at column 0x12, rows 3/7/9, forming a right-hand panel of three text windows. Tilemap sources are four
  consecutive 0x80-byte-aligned buffers in IWRAM (unk_201C400/480/4A0/4C0), presumably filled earlier by a text/window
  renderer. r2/r3 on return are just leftover values from the last CopyBackgroundTiles call; r4-r7 are pushed/popped
  untouched.

  '
