open_questions:
- Exact semantic of "value 4" written to submenu+2 (it's reported as offset 2 but the SubMenu struct's
  documented idx_00 lives at offset 0; offset 2 is `Unk_02`). The displacement here is almost certainly
  another "next-state" or "phase" byte at offset 2.
- Whether `Unk_0d→Unk_03` carries a chip/menu index, a confirmed action code, or just a copy of "previous
  index" — would need a snapshot inspection of the r5 EWRAM region.
