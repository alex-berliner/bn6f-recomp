name: battle_findTargetPanelDistances
address: '0x080E84D0'
kind: function
status: probable
summary: Scans the battle grid for panels matching flag 0x10 at the column ahead of the object and at
  the opposite edge column, storing their coordinates and the distance (panel count) to the next flagged
  panel in each horizontal direction; returns 1 if the forward distance is <4, else 0.
interface: '(r0 = out struct ptr, r4/r5 = battle object ptr) -> r0 = 1 if a valid target within range,
  else 0; out struct: +0/+1 candidate1 x/y, +3 forward distance (0xFF = none), +4/+5 candidate2 x/y, +6
  candidate2-valid, +7 reverse distance'
details: Fills an 8-byte result struct. First checks the panel at (PanelX + frontDirection, PanelY) against
  flag mask 0x10 via object_checkPanelParameters (coords passed as stack args, table 0xF880080); if it
  matches, stores it as candidate 1 and counts panels forward (object_countPanelsUntilFlag) to the next
  flagged panel into +3. A second candidate at x = 6 - 5*(Alliance^DirectionFlip) (i.e. column 6 or 1)
  is checked and stored at +4/+5 only if it differs from candidate 1; its distance counting runs in the
  flipped horizontal direction into +7. Returns 0 (r6=0) if the forward count is >= 4 (target too far),
  and forces +7 to 0xFF in one edge case; otherwise returns 1.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb PanelX/PanelY + bl object_getFrontDirection: derives facing-relative start panel; two
    bl object_checkPanelParameters calls with r2=0x10 and table dword_80E8578=0xF880080 test candidate
    panels by flag mask; bl object_countPanelsUntilFlag stores 0xFF-sentinel distances at +3 and +7, second
    call uses DirectionFlip eor 1 (reversed direction); cmp r0,#4 / blt pattern clears r6, so a distance
    of 4+ panels means failure; struct layout: strb to [r7,+0..+7] with [r7,#6]=1 set before the counting
    calls'
