  reproduce: python3 tools/asmcat.py 0x080E84D0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is close - it does search for candidate target panels at edge columns and report distances
    - but ''+6 candidate2-valid'' is wrong: the code writes 1 there once and never touches it. Also ''+7
    reverse distance'' is misleading: the second count uses flipped DirectionFlip for the *horizontal*
    axis, not a ''reverse'' search; it''s really the distance count in the opposing horizontal direction.
    The candidate2 column formula (6 - 5*(Alliance^DirectionFlip)) always picks the edge column opposite
    the facing direction, so both candidates are at fixed panel columns (one at front column, one at back
    column edge).; run wf investigate investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
