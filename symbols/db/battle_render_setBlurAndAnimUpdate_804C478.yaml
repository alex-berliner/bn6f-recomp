name: battle_render_setBlurAndAnimUpdate_804C478
address: '0x0804C478'
kind: function
status: confirmed
summary: Enables the blur/animation redraw flag in the render-info control word and submits one sprite draw with
  a z position offset by the blur object's subpixel value.
interface: void battle_render_setBlurAndAnimUpdate_804C478(r5 blur_obj, r7 sprite, r10 toolkit) — outputs r2 r8
  r9 (leftovers of the draw callee); clobbers r0 r1 r3 lr and nzcv
details: 'Reads the toolkit''s render-info pointer (oToolkit_RenderInfoPtr from r10) and ORs the

  control halfword with 0x4800, the bit combination that turns on the blur and

  animation-update redraw path for the frame. Then, using r7 as a sprite state struct

  (x at +0, y at +4, z at +8, palette at +0xC, layer byte at +0x10, priority byte at

  +0x11) and r5 as a blur object whose byte at +0xD is a fixed-point subpixel offset,

  it builds a 12-byte (x, y, z) draw packet on the guest stack. The z value has

  (blur_obj[0xD] << 16) subtracted from it, lowering the sprite''s depth for the blur

  pass. It calls the sprite-draw routine loc_80024D8 directly with r0 = packet

  address (guest SP), r1 = palette, r2 = layer, r3 = priority. The caller keeps

  r4-r9 and r10 intact across the call (r4 is used to reach the toolkit pointer).

  The trailing gfx_anim_data tables after the function body belong to adjacent

  animation data, not to this routine.

  '
