open_questions:
- What does the halfword operand (key 1) represent in the script grammar? It is read but its value is discarded
  here; presumably it encodes mailbox / folder routing that addMail_802f238 re-reads on its own.
- Why does addMail need both r0 and r6 set to the mail id?
- Is the always-queue-one behaviour on a zero run length intentional, or is the script grammar expected to forbid
  length 0?
