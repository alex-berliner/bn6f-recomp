name: MapScriptCutsceneCmd_add_mail_range
address: '0x08038322'
kind: function
status: confirmed
summary: Cutscene script command that queues a contiguous run of mails into the player's inbox.
interface: "void scriptCmd_addMailRange(u32 commandArg /* r0, unused but preserved */,\n                       \
  \     u32 scriptCursor /* r7 */);\n  out: r4 = mailsLeft (clobbered from the run length),\n       r7 = scriptCursor\
  \ + 4 (advanced past this 4-byte command),\n       r0 = 1 (success status),\n       flags NZ = 1 (N clear, Z clear);\n\
  \  clobbers r0 r1 r2 r3 r4 r6 r7 v c; preserves nothing.\n"
details: 'Implemented as MapScriptCutsceneCmd_add_mail_range at 0x08038322. Reads

  two operands from the cutscene/mapscript stream (key 1 via

  ReadMapScriptHalfword, key 3 via ReadMapScriptByte) and queues `runLength`

  mails starting at `mailId` into the inbox by calling addMail_802f238 in a

  loop (id increments, run decrements; loop is do-while, so a zero-length

  argument still queues one mail). Then advances the script cursor by 4 and

  returns 1 to the dispatcher. r0, r1, r2 of the final addMail call are

  discarded. r6 is used to pass the operand selector (1 then 3) to the

  readers, which is why the contract lists r6 as clobbered even though this

  command does not logically use it.

  '
