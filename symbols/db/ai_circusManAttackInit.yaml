name: ai_circusManAttackInit
address: '0x080FEB20'
kind: function
status: probable
summary: 'Initializes the CircusMan AI''s per-attack state: difficulty tier, timers, panel-choose callback,
  and target object, then enters attack state 0xA.'
interface: (r0 = attack-related arg passed to sub_80FEBE4, r5 = owning BattleObject, r7 = oAIAttackVars
  state block) -> r0 = 0xA (attack state set via object_setAttack0)
details: Stores the AI difficulty tier (from battle_getAiDifficultyTier_800FE36) into oAIAttackVars_AiDifficultyTier
  and clears InitFlag. Installs sub_80FF614+1 as the oAIAttackVars_PanelChooseCallback and zeroes fields
  via sub_80FEBE4. Calls sub_80FE9B0 and sub_80FE9E4 to derive the attack duration, boost, and timer values
  stored into oAIAttackVars_AttackDuration/AttackBoost2/TimerOrCycles. Sets two scratch pointers to r5+0x74
  and r5+0x78. Resolves the target as battle_findPlayer(Alliance ^ 1), i.e. the opposing-side player object,
  storing it in oAIAttackVars_TargetObjectPtr, and finally calls object_setAttack0 with 0xA to enter the
  attack state.
