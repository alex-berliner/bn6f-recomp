  detail: 'ldrb [r5,#oBattleObject_PhaseInitialized] / bne loc_80C299C: standard two-stage phase-handler
    pattern; bl spawn_t1_0x5_tempAttackObject_80B8E30 with r4 = off_80C29EC[Param1*4] picks the attack-object
    parameters from byte_80C29F0; object_getFrontDirection + PanelX gives the panel ahead, passed to object_spawnDimmingCollisionRegion
    with dword_80C29E8 = 0x705FF04; object_getCoordinatesForPanels result feeds spawn_t1_0x0_EffectObject
    with 0x27 | ExtraVars+0xC<<8; Timer set to 0x14, decremented, and CurPhaseAndPhaseInitialized zeroed
    at expiry confirms a self-terminating attack phase'
