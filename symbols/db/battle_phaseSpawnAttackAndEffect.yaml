name: battle_phaseSpawnAttackAndEffect
address: '0x080C296C'
kind: function
status: probable
summary: 'Phase handler for a battle object: on init sets CurAnim to 5 (copy 6), spawns a table-parameterized
  type-1/subtype-5 attack object linked via object+0x4C, plays sound 0xB0, sets Timer=0x14 and phase=4.
  When Timer reaches 0xA, spawns a timestop-proof dimming collision region at the panel one step in the
  object''s facing direction, then spawns a type-0 effect object at those pixel coordinates with r4 =
  (ExtraVars+0xC << 8) | 0x27. Timer decrements each frame and at 0 clears the phase field.'
interface: (r5 = battle object) -> void; spawns attack/collision/effect objects, plays sound 0xB0
details: First entry (PhaseInitialized==0) sets CurAnim to 5 (copy to 6), reads oBattleObject_Param1 as
  an index into byte_80C29F0 (three identical {0x11,0x0B,0x01,0x00} entries, *4 per index), calls spawn_t1_0x5_tempAttackObject
  with r7 = object+0x4C as the linked object, plays sound 0xB0, sets Timer=0x14 and marks phase 4 initialized.
  On the frame where Timer==10 it calls object_getFrontDirection and spawns a dimming collision region
  (timestop-proof, dword 0x705FF04) at the panel one step in front, then object_getCoordinatesForPanels
  to spawn a type-0 effect object at those pixel coordinates with r4 = (ExtraVars+0xC << 8) | 0x27. Timer
  counts down each frame; at 0 the phase field CurPhaseAndPhaseInitialized is cleared, ending the attack.
