name: battle_beastPwrAtk_addScaledBaseFromIndex_8010D04
address: '0x08010D04'
kind: function
previous_names:
- sub_8010D04
status: probable
summary: Looks up a 2-byte beast power-Atk base entry at byte_80212D4 + 2*idx and forwards (idx, two table
  bytes) to sub_8012642.
interface: (r0 = beast-power-Atk table index) -> r0 = ... (forwarded from callee, captured as 0x1e) ;
  no side effects in this frame
details: "Sub is a thin wrapper: r0 *= 2 (mul r0, r2 with r2=2), then loads the base address\n  byte_80212D4\
  \ via ldr from off_8010D50, adds the doubled index to get a pointer\n  into the 2-byte-wide table, and\
  \ reads two successive bytes into r0 (low) and\n  r1 (high). It then tail-calls sub_8012642 (named\n\
  \  battle_beastPwrAtk_addScaledBase_8012642 in the callee list). The\n  beast-power-Atk name + \"addScaledBase\"\
  \ callee make clear this is feeding the\n  power-Atk's per-version base and a second parameter into\
  \ a routine that adds\n  the scaled base (likely charge-level-scaled) damage to the AI/AttackVars\n\
  \  buffer. r5 and r10 are callee-saved and restored; the \"in r5, out r5\" pattern\n  in callers shows\
  \ it threads the AIData or AIData-attached object through.\n  Captured calls always enter with r0=0x0B\
  \ (the BPwrAtk table index, e.g.\n  Tomahawkman being the 12th beast but here index 0xB is whatever\
  \ is\n  configured for this beast), r2=0x2C (charge or scaling level), and exit\n  r0=0x1E (the resulting\
  \ scaled-base value from sub_8012642).\n"
