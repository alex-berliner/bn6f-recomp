name: owPlayer_stepTowardTarget
address: '0x0808F9C4'
kind: function
status: probable
summary: Steps the overworld player one 0x10000 unit per axis toward the target coords stored in the state
  struct (loaded via off_808F5D4), clamping to the target when within one step, writes the new (X, Y,
  Z=0x400000) coords, and returns 1 if any axis moved this frame or 0 if already on target.
interface: (void) -> r0 = 1 if the player moved this call, 0 if already at target; no flags meaningful
details: Loads a state struct pointer via off_808F5D4, which holds target X at +0x12 and target Y at +0x14
  (sign-extended to 32-bit fixed point). After calling sub_808FA38 (likely a state/tick helper), it reads
  the player object's current X/Y via ReadOWPlayerObjectCoords. For each axis, if |current - target| >=
  0x10000 it steps current by +/-0x10000 toward the target and sets a 'moved' flag; otherwise it clamps
  to exactly the target. Finally it writes the resulting (X, Y, Z=0x400000) via owPlayer_copyCoordsToNextCoords...,
  which relocates the player object and mirrors coords into the shared player state. Returns nonzero when
  at least one axis moved, zero when the player is already on target — a classic walk-until-arrive step
  used inside the bus-boarding sequence.
