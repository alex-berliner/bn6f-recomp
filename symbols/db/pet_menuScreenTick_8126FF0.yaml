name: pet_menuScreenTick_8126FF0
address: '0x08126FF0'
kind: function
status: confirmed
summary: 'One tick of the PET (PET-menu) screen: runs entity updates, advances fade, draws menu, and dispatches
  the current dialogue choice or exits to map.'
interface: 'pet_menuScreenTick_8126FF0(r5: BattleState*, r10: Toolkit*) -> (nz,c flags from fade check;
  r0-r4 clobbered by callees; r5,r8,r9,r12 preserved)'
details: "Each frame the function:\n1. Calls entity_runAllUpdateHandlers_80465BC to tick all active entities.\n\
  2. Calls sub_8123360; if it returns zero (no fade pending), starts a fade-in\n   via sub_811BED4(0,\
  \ 5) (type 0, speed 5).\n3. Calls menu-draw (sub_80465F8), animation tick (sub_81272C4), and\n   state\
  \ tick (sub_8127374).\n4. Returns early if IsScreenFadeActive reports Z (no fade running).\n5. When\
  \ a fade IS active, clears chatbox eFlags bit 0x40\n   (chatbox_clear_eFlags2009F38), calls sub_81440D8\
  \ and sub_8046664,\n   then clears event flag 0x1713 (page 0x17, bit 0x13).\n6. Reads u32 at [r5+0xC]\
  \ (battle-state choice flags):\n   - bit 0 → result byte 0x24, calls chatbox_8040818(r1=1, r2=flags)\n\
  \   - bit 1 → result byte 0x2C, calls chatbox_8040818(r1=2, r2=flags)\n   - neither → calls pet_menuExitToMap_811F708\
  \ and returns.\n7. Clears chatbox eFlags 0x40 again, zeros the 128-byte submenu buffer\n   at [r10 +\
  \ oToolkit_SubmenuPtr], and writes the result byte to [r5].\nStructure touched: r5 = battle-state block\
  \ (byte 0 = result, u32 at +0xC = choice flags);\nr10 = global Toolkit (field oToolkit_SubmenuPtr →\
  \ 0x80-byte submenu scratch buffer).\n"
