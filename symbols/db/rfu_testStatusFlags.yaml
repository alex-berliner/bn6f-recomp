name: rfu_testStatusFlags
address: '0x0803CB18'
kind: function
status: probable
summary: Tests a caller-supplied bitmask against a global status flags word and returns the result in
  the Z flag.
interface: (r0 = bitmask of flags to test) -> r0 unchanged; Z set if none of the masked bits are set,
  Z clear if any bit matches dword_200BC5C
details: 'Loads the flags/status dword at 0x200BC5C (field 0xC of the struct rooted at eS200BC50), ANDs
  it with the mask in r0 via tst, and returns immediately with only the condition flags set. It is a pure
  predicate: no registers besides the flags are affected and no memory is written. Callers in the wireless
  code (e.g. rfu_wirelessConnectStep) branch on the result to decide connection-state transitions. Because
  tst is used, ''Z set'' means the mask matched nothing, so call sites typically use BEQ for ''flag(s)
  not present''.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r1, [r3,#0xC] reads the flags dword at 0x200BC5C (eS200BC50 + 0xC); tst r1, r0 then mov
    pc, lr: only computes AND result into flags, discards r1; caller rfu_wirelessConnectStep at 0x08049416
    sits in the wireless-connection state machine, consistent with a status-flag query; five callers clustered
    at 0x08039C32-0x08039F78 all in the same rfu-region of the ROM; no other memory access or callee:
    the whole body is one load and one tst'
  refs:
  - bn6f/asm/asm03_1_1.s:8195
  - 0x08049416 rfu_wirelessConnectStep
  - 0x08039C32 sub_8039C32
  - 0x08039C9C sub_8039C9C
  reproduce: python3 tools/asmcat.py 0x0803CB18
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- the exact meaning of the bits in dword_200BC5C (likely the wireless library's status/event flags) would
  need the struct owner of eS200BC50 identified
- whether callers use BEQ or BNE per site to confirm the polarity convention in use
