name: e_setJumpOffset
address: '0x0803EBE4'
kind: function
status: probable
summary: Setter that stores the given byte into offset 0x5 of eStruct200BC30 (the e-struct 'jump offset'
  field).
interface: (r0 = byte value to store) -> void; writes eStruct200BC30 + 0x5, no return value, flags clobbered
  by mov pc, lr is branch so flags preserved except by caller convention
details: 'A trivial two-instruction setter: loads the address of eStruct200BC30 and writes r0 as a byte
  to offset 0x5, which the project has already labeled eStruct200BC30_JumpOffset05. No other registers
  or fields are touched and it has no callees. Its only known caller is sub_803ED4C, which invokes it
  twice at 0x0803ED4C and 0x0803ED90, presumably to set the jump offset before/after some e-entity state
  change. Because the field name ''JumpOffset05'' is already established in the project''s data labels,
  the function is best named as that field''s setter within the ''e'' subsystem.'
