name: battle_drawCustomChipPreview
address: '0x080285FE'
kind: function
status: probable
summary: Renders a chip preview (name text + tile/palette graphics) for the custom screen's chip picker,
  then reloads Beast Out selection sprite sheets.
interface: (r0 = chip id, masked with 0x1FF) -> r0 = undefined; queues GFX to VRAM 0x6009360 (name text)
  and 0x6009560 (chip tiles), writes palette to unk_3001AA0
details: Splits the chip id via chip_SelectNameTextTable_8027D10 and renders the chip-name glyphs to VRAM
  0x6009360 through renderTextGfx_8045F8C with the toolkit state at byte_203C4E0 and glyph base dword_86B7AE0.
  It then masks the id with 0x1FF and looks up the 44-byte chip record via getChip8021DA8. If the record's
  field at +0x24 is non-zero (pointer to chip image data), it queues a 0x540-byte eight-word-aligned GFX
  transfer of that data to 0x6009560 and a 0x20-byte palette from [+0x28] into unk_3001AA0. Finally it
  reloads the Beast Out selection screen sprite sheets, so the preview coexists with that screen's graphics.
