name: sub_80027C4
address: '0x080027C4'
kind: function
previous_names: []
status: hypothesis
summary: Initializes a small sprite/GFX-anim state block at `byte_20098A8` (scale=0x0C, delay=0, idle/duration=0x032F)
  — a leaf resetter for an EWRAM aux state structure.
interface: '(lr) -> r0 = 0x032F ; side effects: writes byte_20098A8..+0x3'
details: "- Loads the base pointer `r1 = off_8002804 == byte_20098A8` (an EWRAM location, used in multiple\n   \
  \ sp-sprite/animation-style call-sites).\n  - `strb r0,[r1,#0x1]` writes 0 to offset +1 (clears a \"delayed/armed\"\
  \ byte).\n  - `strb r0,[r1]` writes the immediate 0x0C to offset +0 (a scale/divisor or sprite-size nibble).\n\
  \  - `mov r0,#0xc` then `strh r0,[r1,#0x2]` writes 0x032F (from `dword_8002808`) as a u16 at offset\n    +2 (a\
  \ frame-count / duration / palette-index field).\n  - Returns r0 = 0x032F for the caller.\n  - This is a tiny\
  \ tail-init routine run from many subsystem-init passes (boot, map/battle entry,\n    scene/scenario/cutscene\
  \ reset, logo-screen init). The same base address is written from several\n    sprite/anim setup paths, suggesting\
  \ `byte_20098A8` is the per-frame sprite-state scratch used by\n    the sp-sprite/sp2 animation driver in `sprite.s`.\n\
  \  - The function takes no inputs from callers other than the return address (in `lr`), matching the\n    ARM\
  \ `mov pc, lr` epilogue and the contract `in=['lr']`.\n  - Caller `main_initToolkitAndOtherSubsystems` (0x080004a4)\
  \ reaches it with lr=0x080004F5, suggesting\n    this lives inside the boot subsystem-init sequence; the other\
  \ call sites are all initialization /\n    reset routines (`EnterMap`, `battle_initFullSetup`, `logoScreen_init`,\n\
  \    `scenario_finalizeFrameOrRestart`, `scene_nextOrUpdate`, `copyTileData` and various sub_X reset\n    hooks),\
  \ each of which wants sprite state primed to (scale=0x0C, time=0, payload=0x032F).\n"
