  detail: '- `ldr r1, off_8002804` resolves to `byte_20098A8`; this is an EWRAM pointer. - `mov r0,#0; strb r0,[r1,#0x1]`
    and `mov r0,#0xc; strb r0,[r1]` clear+prime two adjacent bytes at +0/+1. - `ldr r0, dword_8002808 // =0x32f`
    then `strh r0,[r1,#0x2]` primes the halfword at +2 to the constant 0x032F. - Captured-call exit r0 consistently
    equals 0x032F, matching the value just stored. - All 40 callers are init/reset paths (boot, map-entry, battle-entry,
    logo, scenario teardown, scene teardown, tile-data copy) which fits a "reset sprite aux state" role. - Function
    lives at `bn6f/asm/sprite.s:230` so it groups with the other sprite init helpers.'
