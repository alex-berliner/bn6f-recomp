name: ai_pickRandomPanelTarget
address: '0x080CED78'
kind: function
status: probable
summary: Battle-AI helper that, if the object's Param2 is clear and its current panel is valid returns
  that panel, otherwise builds a candidate list of four fixed x,y pairs (x flipped on enemy alliance)
  plus panels gathered by scanning forward columns via object_getPanelsInColumnFiltered, then uses GetPositiveSignedRNG
  + svc 6 to pick one entry and returns its x in r1 and y in r0.
interface: '(r0 implicit: r5 = battle object) -> r0 = panel id (x in high nibble, y in low 3 bits, x mirrored
  for enemy alliance); flags clobbered.'
details: 'If the object''s Param2 is clear, it first checks the object''s current panel via object_isCurrentPanelValid
  (using ExtraVars+0x12/0x13 as coordinates) and, if valid, bails returning that panel. Otherwise it builds
  a candidate list at sp+0xC: four fixed x,y pairs from byte_80CEE1C (5,1 / 5,3 / 4,2 / 6,2), with x flipped
  to 7-x when the object is on the enemy alliance, encoded as x<<4|y. It then reads a two-word base from
  byte_80CEE28 indexed by alliance*8 and repeatedly calls object_getPanelsInColumnFiltered starting at
  column 3 (ally) or 4 (enemy), stepping the column by the negated front direction and appending encoded
  panel IDs while the column stays in 1..6. Finally GetPositiveSignedRNG plus svc 6 picks a random entry
  modulo the list count, and the entry''s low 3 bits (y) and high nibble (x) are returned. The byte_80CEE28
  table is 0x20,0 for alliance 0 and 0,0x20 pattern shifted for the other side, acting as the scan''s
  base panel data.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loop over byte_80CEE1C pairs with ''sub r0, r2, r0'' mirror for nonzero alliance, orr r0, r1<<4
    encodes x<<4|y; loop calling object_getPanelsInColumnFiltered with r4 = 3/4 by alliance and step =
    negated object_getFrontDirection result, bounded to 1..6; bl GetPositiveSignedRNG then svc 6 (modulo
    r6=count) selects a random entry from the sp+0xC buffer; return path masks ''lsr r1,r0,#4 / lsl r0,#0x1d
    / lsr r0,#0x1d'' splitting the byte into x and 3-bit y; entry shortcut: if Param2==0 and object_isCurrentPanelValid
    passes, returns immediately with the object''s own panel coordinates'
