name: object_stepMoveToTargetPanelThenDim
address: '0x080D3004'
kind: function
status: probable
summary: Per-frame update for a battle object that drifts by its velocity each tick, and once it reaches
  its target panel spawns a dimming collision region (attack/telegraph area) and advances its state to
  8.
interface: '(r5 = battle entity struct: +0x34/+0x38 pos, +0x40/+0x44 vel, +0x12/+0x13 panel, +0x60/+0x64
  target panel, +0x2c owner, +0x8 state) -> void; calls object_setPanelsFromCoordinates and object_spawnDimmingCollisionRegion'
details: Adds the velocity fields at +0x40/+0x44 into the position fields at +0x34/+0x38, then calls object_setPanelsFromCoordinates
  to refresh the object's PanelX/PanelY (+0x12/+0x13). It compares the current panel bytes against target
  values stored at +0x60 and +0x64 (word loads, but only low bytes are compared). If either comparison
  fails it returns immediately, so this is a move-until-arrival step. On arrival it calls object_spawnDimmingCollisionRegion
  with panelX/panelY, z=0, width 8<<16, collision params 0x4050501, owner from +0x2c, and kind/flag 3,
  then stores 8 into +0x8, which looks like a script/state counter for the same entity. The 0x4050501
  word likely encodes collision-region shape/flags. No callers are known, so whether it runs every frame
  or on an animation step is unconfirmed.
