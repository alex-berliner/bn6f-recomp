name: projectObjectToScreen_800362C
address: '0x0800362C'
kind: function
status: confirmed
summary: Projects an object's world position into screen space relative to the camera's next-frame scroll,
  returning screen x/y plus a visibility flag (collapses to an off-screen fallback if outside the clip
  window).
interface: void sub_800362C(u32 r0 = objectPtr, u32 r10 = toolkitPtr) -> r0 = screenX, r1 = screenY, r2
  = visible (1=on-screen, 0=clipped/fallback), r3 = cameraPtr; clobbers nzcv; preserves r4-r7, lr
details: "Reads the active camera pointer from the toolkit at oToolkit_CameraPtr (r3 kept across\nthe\
  \ call). Object world position is taken as three s16 halfwords at offsets 2 (X),\n6 (Y) and 0xA (Z)\
  \ of the object struct. The camera's next-frame scroll is read from\noCamera_nextX_3c / oCamera_nextY_40\
  \ / oCamera_nextZ_44 and shifted >>16 to get the\ninteger part. Per-axis:\n  * X: obj.x - cam.x; if\
  \ eCamera.unk_4C (off_8003690 -> eCamera+0x4C) is non-zero\n    the delta is negated (mirror-x, e.g.\
  \ for reversed/right-facing rooms); then +0x78\n    to recentre on the GBA 240px-wide screen.\n  * Y:\
  \ obj.y - cam.y + 0x50, minus (obj.z - cam.z) so greater Z raises the sprite\n    on screen (parallax\
  \ with depth).\nVisibility window: X in [-0x20, 0x110), Y in [-0x20, 0xE0). On hit, r0=x, r1=y, r2=1.\n\
  On miss, all three are replaced with the fixed fallback (0xA0, 0x50, 0) so the\ncaller can still position\
  \ a shadow/marker but knows it is off-screen. r3 is left\nholding the camera pointer, which most callers\
  \ appear to reuse rather than reloading\nfrom the toolkit.\n"
