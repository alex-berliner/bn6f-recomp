open_questions:
- What is the precise meaning of eCamera.unk_4C? It looks like a per-room mirror-x flag (negates the screen-x
  delta) but its semantic name is unknown.
- Why does the function return the camera pointer in r3 instead of a fresh object hit-test result? Likely
  the caller iterates over multiple objects in one frame and the register saves a reload, but no caller
  in evidence has been traced here yet.
- Is the "depth shifts Y up by Z" offset a deliberate parallax model, or a packing artifact of sprite
  rendering that uses one (x, y) with Z folded in? Unknown,
