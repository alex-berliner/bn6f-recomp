name: MapScriptCutsceneCmd_init_minigame_effect
address: '0x0803829A'
kind: function
status: confirmed
summary: Map-script cutscene command that reads a one-byte ID operand and starts the matching minigame effect, then
  advances the script cursor past it.
interface: void MapScriptCutsceneCmd_init_minigame_effect(u32 r7 /*script cursor*/); returns u32 r0 = 1 (command
  handled, NZ set from it), updated cursor in r7 (r7 += 2); r2-r5 left as callee leaves them
details: 'Part of the cutscene map-script command table. Sets r6 = 1 (fixed argument for

  ReadMapScriptByte) and calls ReadMapScriptByte with the script cursor in r7; that

  helper reads the next byte and returns the byte in r4 and the advanced cursor in r7.

  The byte is passed in r0 to initMinigameEffect_8003a64, which starts the associated

  minigame effect. Afterwards the command adds 2 to r7 (one byte for the operand,

  one for the command/opcode byte) and returns r0 = 1, whose NZ flags the dispatcher

  reads as "command handled".

  '
