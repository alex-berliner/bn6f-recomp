name: CutsceneCmd_start_fixed_battle
address: '0x080381A0'
kind: function
status: confirmed
summary: Map script opcode that starts a fixed preset battle (preset index in next script halfword), after resetting
  Beast Out / navi mood outside the Internet maps, then fades the screen out and advances the script.
interface: "void CutsceneCmd_start_fixed_battle(u32 r7_scriptPos, u10 *r10_toolkit)\n    -> r0 = 1, r7 += 3, N/Z\
  \ from r0=1, C/V from r7+=3\n"
details: "- Reads the current GameState via r10 (toolkit) and the MapGroup byte.\n- If MapGroup < INTERNET_MAP_GROUP_START,\
  \ calls SetBeastOutCounterTo3 and\n  ZeroAllNaviStatsMood so the player's navi state doesn't leak into the fight.\n\
  - Reads one script halfword as the preset index into battle list 0, looks it up\n  via getBattleSettingsFromList0,\
  \ and starts the battle with r1=1 (script-driven).\n- Reads the same halfword again and passes it to sub_803522E\
  \ (battle-setup helper\n  consuming the second halfword slot of the command).\n- Calls SetScreenFade(0x2C, 0x10)\
  \ to fade into the battle.\n- Returns 1 to the script runner and advances r7 by 3 (1 opcode byte + 2-byte halfword).\n\
  - Touches oToolkit_GameStatePtr and oGameState_MapGroup.\n"
