name: ai_attackCleanupAndRunAI
address: '0x0810BBF6'
kind: function
status: probable
summary: Per-frame AI wrapper that, on the object's first tick, clears its AI attack's hit state and frees
  its auxiliary objects, then runs the standard object AI.
interface: (r5 = battle object, uses [r5+0x64] as pointer to a flag/state struct) -> r0 = result of battleObject_initAndRunAI_8016B02
details: 'Wrapper around battleObject_initAndRunAI_8016B02 with one-time cleanup: if the object''s PhaseInitialized
  flag (oBattleObject_PhaseInitialized) is still 0, it takes the pointer at r5+0x64 and passes it to ai_attackHitClearState8,
  which clears the flag the +0x60 pointer refers to and sets the +8 state/timer to 8, and then calls ai_attackFreeAuxObjects
  to release the up-to-five auxiliary object/effect pointers in the object''s ExtraVars. After that (and
  on every subsequent call) it falls through to initAndRunAI, which inits the object''s AI on first call,
  dispatches the AI handler, and commits a staged state transition from Unk_5c. r5 is the implicit object
  pointer, so this is used as an object''s per-frame AI/handler routine rather than a normal r0/r1 function.
  The cleanup only running when PhaseInitialized==0 suggests it finalizes a lingering attack state (hit
  flag + spawned effects) before the object''s normal AI resumes.'
