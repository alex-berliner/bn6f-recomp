name: handleVariableDamageChip_800AEE8
address: '0x0800AEE8'
kind: function
status: probable
summary: Re-rolls the damage value of the currently selected chip in both battlers' records, but only when that
  chip has the variable-damage flag set.
interface: void handleVariableDamageChip_800AEE8(void)
details: 'Walks two per-battler chip records rooted at byte_20349C0 (0x20349C0):

  the player''s block is first, the opponent''s follows 0x50 bytes later

  (battler index 0 = player, 1 = opponent). Each block begins with a

  selector byte; the selected entry starts at selector*2 + 2 and holds the

  chip id as a u16, with the chip''s current damage at +0xC (u16).


  For each battler the code loads the selected chip id, fetches its chip

  data via getChip8021DA8, and tests bit 0x80 of the byte at +9 of the

  chip data (the variable-damage flag). When set, it calls

  sub_80109A4(chip_id, battler) and stores the returned halfword as the

  entry''s new damage; when clear, the stored damage is left untouched.

  Chips without the flag keep whatever value is already at +0xC.


  Quirk: the 0x80 mask is materialized in r2 right after each

  getChip8021DA8 call and survives to callers when the second chip is not

  variable-damage, so r2 is a caller-visible output on that path. The

  final TST only updates n/z; outgoing c/v come from the last guest call.

  '
