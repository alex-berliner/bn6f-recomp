name: chatbox_uncompMapTextArchives_803FD54
address: '0x0803FD54'
kind: function
status: confirmed
summary: LZ77-decompresses the text archive chosen for the current map into the shared decompression buffer at 0x2033400
  and returns 0.
interface: void chatbox_uncompMapTextArchives_803FD54(void); // always returns 0 in r0
details: 'Calls chatbox_selectCompTextByMap_8040794, which returns in r0 a pointer to the LZ77-compressed text archive
  appropriate for the map the player is currently on (the chatbox/dialogue text pool selection). That pointer is
  passed as the source to the BIOS SWI LZ77UnCompReadNormalWrite8bit, with the destination fixed at DecompressionBuf2033400,
  the shared decompression work buffer. The decompressed archive presumably holds the map''s string tables used
  by the chatbox text engine. The function always returns 0 in r0 and sets flags accordingly (mov r0,#0 sets N=0,
  Z=1, C unchanged). r4-r7 are pushed and popped solely to preserve them (the call chain may clobber them); the
  function itself uses none of them, and lr is only needed for the bl. No inputs are actually consumed; the caller''s
  r4-r7/r10 are irrelevant except for ABI preservation.

  '
