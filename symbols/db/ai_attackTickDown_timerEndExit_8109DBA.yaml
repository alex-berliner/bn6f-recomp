name: ai_attackTickDown_timerEndExit_8109DBA
address: '0x08109DBA'
kind: function
status: confirmed
summary: AI attack timer tick - decrements the attack's countdown each frame and, when it hits zero, resets the
  object's animation and exits the attack state.
interface: void sub_8109DBA(BattleObject* obj /*r5*/, AIAttackVars* vars /*r7*/); returns decremented timer in r0;
  flags reflect the SUBS 1
details: "Small per-frame tick used by an AI-controlled attack. Reads the 16-bit countdown\ntimer at r7+oAIAttackVars_Unk_10,\
  \ subtracts 1, and stores it back; r0 returns the\ndecremented value and the NZCV flags reflect the subtraction\
  \ (as if CMP timer,1).\nWhile the timer is still nonzero the function does nothing more and returns.\nWhen the\
  \ countdown reaches zero it:\n  - sets the battle object's current animation (r5+oBattleObject_CurAnim, byte)\
  \ to 0,\n  - stores 1 into r7+oAIAttackVars_Unk_1a, apparently an \"attack finished\" flag,\n  - calls object_exitAttackState\
  \ with r0 = 1 to leave the attack state.\nInputs per the caller contract: r5 = battle object pointer, r7 = AI\
  \ attack vars\nstruct, r6 and lr are passed in by callers (lr is the return address; r6 is not\nreferenced by\
  \ this routine but is listed as an output, so callers evidently expect\nit forwarded/untouched). clobbers r0-r3\
  \ on the exitAttackState path.\n"
