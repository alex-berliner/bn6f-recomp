name: battle_objectUpdateDispatchPhase_80165C2
address: '0x080165C2'
kind: function
status: confirmed
summary: Per-frame update dispatcher for a battle object - runs a flagged-object handler, skips while paused, otherwise
  tail-calls the object's current-phase handler from a 2-entry table.
interface: void battle_objectUpdateDispatchPhase_80165C2(void); /* object in r5; r0/flags from phase handler passed
  through to caller */
details: 'Acts as the per-frame tick for a single battle object whose pointer sits in r5 (the battle object struct
  field oBattleObject_CurPhase is read at offset via ldrb). First calls object_getFlag() and tests the result against
  bit 0x40000000; if that special flag is set the object is handed to sub_8016EC4 instead of the normal phase logic.
  Otherwise it calls battle_isPaused(); when the battle is paused the object is simply not updated this frame. In
  the normal case it reads oBattleObject_CurPhase (0 or 1) and indexes the jump table off_80165F0 (phase 0 -> sub_80165F8,
  phase 1 -> sub_801664E), then tail-calls that handler via the classic ''mov lr, pc; bx r1'' Thumb trick so the
  handler''s return goes straight to this function''s caller - hence the handler''s r0/r1 results and NZCV flags
  flow through unchanged. r0 holds the phase byte and r1 the handler address at the moment of the call. Object pointer
  r5 and the other low registers are expected to be preserved by the callees (this function itself only pushes lr).

  '
