    treated as chip ID, 0 = empty slot; loop at loc_812077C compares r1 (high halfword) against ldrb of
    chip record bytes 0..3, i.e. the chip''s code letters; bl pack_addChipByIdSetLibraryFlag_8021B2A with
    r2=1 grants each validated chip and sets its library flag; caller petNavi_perFrameUpdate_81339BC (PET
