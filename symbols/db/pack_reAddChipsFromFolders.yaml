name: pack_reAddChipsFromFolders
address: '0x08120740'
kind: function
status: probable
summary: Re-grants every chip stored in the folder-storage records (skipping folder index r0) to the spare
  pack with library flag 1, returning 1 if an empty/invalid entry is hit, else 0.
interface: (r0 = folder index to skip) -> r0 = 0 if all folders processed, 1 if aborted on empty/invalid
  entry; flags clobbered
details: Reads a folder count from [oToolkit_S2001c04_Ptr]+5 (does nothing if <=1) and walks that many
  0x3C-byte records (30 halfword chip entries each) in the array at oToolkit_S_Chip_2002178_Ptr, skipping
  record index r0. Each halfword is split into low 9 bits = chip ID and high 9 bits = code character;
  the ID indexes the 44-byte chip database via getChip8021DA8 and the code is checked against that record's
  first 4 bytes (the chip's legal codes). Valid entries are added to the spare pack via pack_addChipByIdSetLibraryFlag
  with a flag argument of 1, which also sets the library event flag and bins the chip by code. An empty
  entry (ID 0) or a code not owned by the chip immediately aborts with return 1; otherwise it returns
  0 after scanning all folders. The literal at off_81207BC supplies the 0x3C stride; unk_20343E0 is just
  adjacent pool data.
