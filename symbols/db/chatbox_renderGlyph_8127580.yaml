  date: '2026-10-14'
  detail: '- `push {r4-r7,lr}` / `pop {r4-r7,pc}` at 0x08127582 and 0x0812759C: function only preserves
    r4-r7, no locals. - `ldr r6, off_81275A0 // =dword_86A5D60` at 0x08127584: loads the toolkit text-gfx
    base pointer required by renderTextGfx_8045F8C. - `mov r4, #0xb` / `mov r5, #2` at 0x08127594: hard-coded
    render-loop constants used by the sub-renderer; 0xB matches the value returned in two of the captured
    calls. - Argument shuffle `mov r7, r1 / mov r1, r0 / mov r0, r3 / mov r3, r2 / mov r2, r4` at 0x08127586..0x08127590
    plus `add r2, r2, r7 / add r3, r3, r7` shows the function offsets the toolkit text-renderer base and
    the destination by the paletteOffset (r1) and forwards to renderTextGfx_8045F8C. - Sole callee is
    `renderTextGfx_8045F8C`, and that function''s summary says it publishes a text-graphics base pointer
