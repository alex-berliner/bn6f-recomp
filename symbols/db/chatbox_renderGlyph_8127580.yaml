name: chatbox_renderGlyph_8127580
address: '0x08127580'
kind: function
previous_names:
- sub_8127580
status: probable
summary: Renders one glyph chunk into the chatbox/text tile area at a given palette offset.
interface: '(r0 = glyphIndex, r1 = paletteOffset, r2 = VRAM tile dest, r3 = toolkit text renderer state,
  r4..r7/r10/lr = toolkit live) -> r0 = 0xB or 0x4 (sub-renderer return) ; side effect: text-gfx base
  ptr published via renderTextGfx_8045F8C, plus tile write into r2+r1/r0 region'
details: "Tiny thunk that just rearranges the five caller-supplied arguments and tail-calls\n  renderTextGfx_8045F8C:\n\
  \    r0 -> r3, r1 -> r7 (used later as palette offset addition), r2 -> r3, r3 -> r0, r4 -> r2.\n  It\
  \ also fixes up two callee-saved regs to constants before the call: r5 = 0xB\n  (renderer \"render this\
  \ many cells of one chunk\" constant used inside renderTextGfx_8045F8C)\n  and r4 becomes r4 + paletteOffset\
  \ so that the destination pointer is offset by the\n  paletteOffset, and r7 becomes r0 (new r3, the\
  \ toolkit text-renderer state) added to that\n  paletteOffset for the base. r6 is loaded from `dword_86A5D60`\
  \ (the toolkit's static text-gfx\n  pointer / \"publish base pointer into the toolkit text-renderer\
  \ state\" step). The function\n  returns whatever renderTextGfx_8045F8C returns; callers ignore it (it\
  \ is `void`-like from\n  the caller's perspective). Captured calls return 0xB (BG-slot 8/9 chip render\
  \ caller)\n  or 0x4 (textbox print caller, where the per-character renderer inside the chunk\n  count\
  \ returns 4 = \"no more chars\").\n  Used both by battle_renderChipSlots_81275C8 (chip slot render,\
  \ three calls with palette\n  offsets 0x000 / 0x400 / 0x800, r0 = glyph index, r2 = 0x06009000 BG tile\
  \ dest) and by\n  sub_8127718 / sub_8127788 (chatbox per-glyph render during text streaming, r2 typically\n\
  \  0x0600A000 tile dest).\n"
