name: setTwoStructs_800A840
address: '0x0800A840'
kind: function
status: confirmed
summary: Stores a battle-result byte into the current battle state and then runs the shared battle-result update
  routine.
interface: void battle_setBattleResult_800A840(u8 result /* r0 */); r10 = toolkit; returns callee's r1, lr clobbered
details: 'Entry point for ending/deciding a battle''s outcome. Reads the toolkit''s battle-state pointer (r10 +
  oToolkit_BattleStatePtr) and writes the r0 byte to battleState + oBattleState_Unk_1f (1-byte field). It then tail-ends
  into eStruct200A008_setBattleResult, which receives the same r0 result byte and the same r10 toolkit (both are
  already in place, so no register shuffling is needed). That callee''s r1 return value is passed straight through
  to this function''s caller. The original symbol name ("setTwoStructs") reflects that it touches two structures
  (battle state and the 0x200A008 result struct) rather than its purpose.

  '
