name: uniConnectionState
address: '0x020101B4'
kind: data
status: probable
summary: 'Proposed name: uniConnectionState. Wireless UNI link connection/state flag used by the RFU routines.
  (u8)'
details: The byte is reset to 1 during receive-state and communication-state initialization, and reset
  to 0 when a wireless session starts. Send requests and packet queuing set it to 0x83. The polling watchdog
  reads the byte and distinguishes the 0x8f state from other states, later transitioning it to 0x83. Its
  values therefore represent RFU wireless link lifecycle/status rather than packet payload data.
