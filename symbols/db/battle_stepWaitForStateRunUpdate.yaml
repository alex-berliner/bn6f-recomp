name: battle_stepWaitForStateRunUpdate
address: '0x0812B26C'
kind: function
status: probable
summary: Entity step wrapper that polls a state value and runs the battle frame update with command 0x13
  when the state is 0x18 or 0x1c, otherwise 0x12.
interface: () -> r0 = command id (0x13 if sub_8132290()==0x18 or 0x1c else 0x12) passed to battle_runFrameUpdate;
  no return value used
details: Calls sub_8132290 with no arguments and compares its return to 0x18 and 0x1c; on either match
  it keeps r4=0x13, otherwise sets r4=0x12, then calls battle_runFrameUpdate with that value as the command/message
  id. Since battle_runFrameUpdate feeds that id into sub_812B2C4 and advances entity update handlers,
  this selects between two update behaviors for the current step. All six callers are eStruct (200BC30)
  step dispatchers, so this is a reusable step handler, likely one that stalls until some tracked state
  reaches one of two completion values. The constants 0x18/0x1c versus 0x12/0x13 suggest the query is
  a step/animation/frame state rather than a random draw.
