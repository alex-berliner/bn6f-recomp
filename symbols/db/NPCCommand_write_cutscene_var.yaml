name: NPCCommand_write_cutscene_var
address: '0x0809F292'
kind: function
status: confirmed
summary: Cutscene script "setvar" opcode handler that stores a byte value into the cutscene's variable buffer at
  a given index.
interface: void NPCCommand_write_cutscene_var(u8 *scriptPtr in r6, toolkit in r10); returns nz c v flags and r0
  = varIndex, r1 = value, r4 = cutsceneState ptr, r6 = scriptPtr advanced by 3
details: Handles the "setvar" opcode of cutscene scripts. R6 points at the current opcode in the running cutscene
  script, laid out as [opcode][var index][value]. It loads the cutscene state pointer from the toolkit (r10 + oToolkit_CutsceneStatePtr),
  reads the variable index and value bytes from the script, writes the value byte into the cutscene state's variable
  buffer at cutsceneState + varIndex, then advances the script pointer past all three bytes (add r6,#3) so execution
  continues at the next opcode. Returns the var index in r0, the value in r1, the cutscene state pointer in r4,
  and the advanced script pointer in r6; flags come from the pointer update. Clobbers r0/r1/r4/r6; preserves r10.
