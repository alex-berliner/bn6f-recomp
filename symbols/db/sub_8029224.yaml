name: sub_8029224
address: '0x08029224'
kind: function
status: confirmed
summary: Walks the chip-use command queue at 0x2033000, validating opcodes against chip attributes and applying
  per-opcode side effects.
interface: void sub_8029224(u32 r3 /* target object for status-bit merge */);
details: 'Iterates slots in the queue starting at dword_2033000+2; each slot is a s16 opcode

  preceded by a u16 chip index. Opcodes 0xB8, 0xB9, 0xC0, 0xC1, 0xC3 are dispatched;

  others cause a plain slot skip. Validation calls getChip8021DA8 (untyped) with the

  stored chip index and tests byte 9 of the returned ChipData: 0xC0/0xC3/0xB8 require

  attribute bit 1, 0xC1 requires bit 2, 0xB9 requires bit 1 and forbids bit 0 (1<<0

  mask). On pass, side effects per opcode: 0xC0/0xC1/0xC3 add slot[+0xC] into

  slot[+0x16]; 0xB8 sets bit 1 of slot-base+0x3C; 0xB9 sets bit 2 of slot-base+0x3C.

  Then bit 0 of r3+0x3C is OR''d into r3+0x3A (status merge into target object).

  Used slots are removed by a shift loop that copies 4 u16 fields (+0x3C, +0x0C,

  +0x24, the opcode) from the next slot until the 0xFFFF sentinel is moved into

  place. After shifting, the pointer is parked on the shifted-in slot for re-scan.

  r3 is clobbered by the shift (set to pos+2) so the input target pointer is lost

  after the first dispatch, exactly as in the original.


  Register form kept (C call semantics could not work): r3 in'
