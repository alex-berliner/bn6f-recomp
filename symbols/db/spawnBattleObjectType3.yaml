name: spawnBattleObjectType3
address: '0x08003390'
kind: function
status: probable
summary: Spawns and prepends a type-3 battle object using a caller-supplied initialization context.
interface: (r0 = context passed to the type-3 initializer) -> r0 = NULL; flags = unchanged
details: Copies the five registers at entry into a 0x14-byte stack context and requests object type 3
  through SpawnBattleObjectCommon. If allocation succeeds, inserts the returned object at the front of
  the global battle-object list with battle_objectListPushFront. The return value is not propagated; it
  always returns zero in r0.
