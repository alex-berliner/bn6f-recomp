name: t3_0x9_80C5DDC
address: '0x080C5DDC'
kind: function
status: confirmed
summary: Dispatches a battle object's per-frame state handler through a jump table and refreshes the object's sprite.
interface: 'void t3_0x9_80C5DDC(void); // in: r5=battle object pointer (CurState at oBattleObject_CurState); out:
  r5=battle object pointer; clobbers r0-r4,r6-r12, flags'
details: 'Reads the object''s CurState byte at oBattleObject_CurState, uses it to index the

  jump table at off_80C5DF4 (three entries: sub_80C5E00, sub_80C5E44,

  object_genericDestroy), tail-calls the selected handler via the original

  `mov lr, pc; bx r1` sequence so the handler runs with r0 = CurState and r1 =

  handler address (lr/return into the trailing `bl object_updateSprite`), then

  calls object_updateSprite to refresh the object''s sprite from whatever r5

  holds afterwards.

  '
