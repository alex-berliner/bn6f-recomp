- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battleObject_initSpriteAndCollision_8011504` with literal `0x41f` (sprite id) and `0xc0d0300`
    (collision data) from dword_80D46AC/dword_80D46B0. - `tst r0,r0 ; bne loc_80D449C` cleanly separates
    init-failure from init-success. - Failure path: `mov r0,#0x34 ; add r0,r0,r5 ; ldmia r0!,{r1-r3}`
    pulls X/Y/Z; `add r3,r3,r4` with `r4 = 0x10 << 16` is a 1.0 fixed-point Z bump passed to `spawn_t1_0x0_EffectObject`
    (its Param3 = Z). - `bl object_freeMemory` after the spawn is a clear "destroy this failed object"
    trail. - Success path: `mov r0,#0xa ; bl object_setCollisionHitEffect` writes HitEffect 0xa. - `mov
    r0,#1 ; strh r0,[r5,#oBattleObject_HP] ; strh r0,[r5,#oBattleObject_MaxHP]` sets HP = MaxHP = 1 (typical
    of a 1-HP obstacle/character). - `cmp r0,#4 ; bne loc_80D44B4` checks Param1; if 4 sets CurAnim=4
    (the alternate init anim). - `bl sprite_setPalette` with palette index 0 (r0 set just before fall-through).
    - `bl object_presentCollisionData` and `ldr r0,[r5,#oBattleObject_ExtraVars] ; str r5,[r0]` stores
    the object pointer in its own ExtraVars[0]. - `ldrb r0,[r5,#oBattleObject_PanelX] ; ldrb r1,[r5,#oBattleObject_PanelY]
    ; bl object_reservePanel` claims the panel under the object. - `mov r0,#0x1e ; strh r0,[r5,#oBattleObject_Timer]`
    sets a 30-frame timer. - `mov r0,#CUR_STATE_UPDATE ; strb r0,[r5,#oBattleObject_CurState]` advances
    the state machine. - callee `spawn_t1_0x0_EffectObject` (0x080e05f6) description says it spawns a
    type-4 battle object with effect type 0, matching the failure-path "spawn default effect" behaviour.'
