name: battleObject_initActorStateT4_80D4472
address: '0x080D4472'
kind: function
status: confirmed
summary: 'Initializes a Type-4 battle actor: allocates sprite/collision, sets 1-HP health, configures palette and
  animation, reserves its panel, and enters the update state (or spawns a destruction effect and frees the object
  on allocation failure).'
interface: void battleObject_initActorStateT4_80D4472(u32 r5 /*obj*/, u32 r6 /*panelX*/, u32 r7 /*panelY*/, u32
  r8 /*collisionArg*/, u32 r10)
details: 'Calls object_setCoordinatesFromPanels(r5) to convert panel grid (r6,r7) into on-screen coordinates stored
  on the battle object. Then calls battleObject_initSpriteAndCollision_8011504 with fixed sprite ID 0x41F and tile-data
  pointer 0xC0D0300 to allocate the sprite and collision box. On failure (r0 == 0): reads three u32 params from
  obj+0x34, adds 0x100000 to the third, sets r4=0x14 (effect type), calls spawn_t1_0x0_EffectObject to emit a visual
  effect, then calls object_freeMemory to release the object and returns. On success: sets collision hit-effect
  ID to 0xA, writes HP and MaxHP to 1 (one-hit entities). Reads oBattleObject_Param1; if equal to 4, forces CurAnim=4
  and palette=0; otherwise palette=Param1 and collision param is the value returned in r1 by initSpriteAndCollision.
  Calls sprite_setPalette and object_presentCollisionData. Writes obj pointer into ExtraVars[0] (self-reference
  for collision callbacks). Calls object_reservePanel with the object''s PanelX/PanelY bytes. Sets oBattleObject_Timer
  to 0x1E (30 frames) and CurState to CUR_STATE_UPDATE so the main battle loop begins ticking the actor. Clobbers
  r4,r0-r3,lr; preserves r4,r5,r6,r7 across the whole function except the failure path.

  '
