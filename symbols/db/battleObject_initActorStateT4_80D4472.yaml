summary: 'Initialises a type-4 battle object''s running "actor" state: sets HP=1, reserves its panel,
  marks collision present, switches to CUR_STATE_UPDATE with a 30-frame timer, or on init failure spawns
  a default effect and frees the slot.'
interface: '(r5 = BattleObject*) -> void ; side effects: EWRAM battle-object fields, panel reservation,
  possible t4 EffectObject spawn'
details: '1. Recomputes pixel X/Y from panel coords via object_setCoordinatesFromPanels.

  2. Calls battleObject_initSpriteAndCollision_8011504 with sprite id 0x41f and collision data ptr 0xc0d0300.

  3. If init returns 0 (failure path): copies 3 words from object+0x34 (Coords block: X, Y, Z), bumps
  Z by 0x10:0000 (one panel upward in fixed point), and calls spawn_t1_0x0_EffectObject with r4=0x10:0000
  (the Z bump). Then object_freeMemory is called and the function exits — the failed object is destroyed.

  4. Success path: sets CollisionData.HitEffect = 0xa, HP = MaxHP = 1, and if Param1 == 4 forces CurAnim
  = 4 then falls through with palette index 0.

  5. sprite_setPalette(0) (palette 0), object_presentCollisionData() refreshes collision, ExtraVars[0]
  is set to the object pointer itself.

  6. object_reservePanel is called with the object''s PanelX/PanelY, Timer is set to 0x1e (30), and CurState
  becomes CUR_STATE_UPDATE so the per-frame logic takes over.

  '
