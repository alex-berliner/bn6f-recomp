name: e_setEventFlagFromStruct
address: '0x0809C954'
kind: function
status: probable
summary: Sets one story/event flag whose ID is read from a field of a context structure.
interface: (r5 = context struct pointer; no args in r0-r3) -> r0 = 0; clobbers r0-r1, lr
details: Loads a pointer from [r5+0x70], then loads a word at offset 0x10 of that pointee and passes it
  to SetEventFlag with r1=0x10, i.e. it marks the story flag whose ID is stored in the struct as set.
  The 'mov r0,r0' after the load is a nop. It always returns 0 in r0. The r5-based struct (likely a cutscene/trigger
  or event-script context whose field 0x70 points to a parameter block) is not otherwise identified here,
  and no callers are recorded, so the in-game trigger that runs it is unknown.
