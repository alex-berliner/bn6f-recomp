name: e_setEventFlagFromStruct
address: '0x0809C954'
kind: function
status: confirmed
summary: Sets the event flag whose id is stored in an object's state block (object+0x70 -> state+0x10).
interface: void e_setEventFlagFromStateBlock(void) — object pointer in r5, context in r10; clobbers r0-r1, r3, C/V;
  sets N/Z from 0 (Z set); preserves r4, r5, r6, r7
details: 'An "e_" (event/object script) helper. It reads the pointer at +0x70 of the object in r5 (the object''s
  state/parameter block used by the event engine), loads the event flag id from word +0x10 of that block, and passes
  it to SetEventFlag. r10 survives across the call as context the flag routine expects intact. After the call r0
  is set to 0, so callers observe N clear and Z set (a "success"/void return convention). This is the struct-driven
  counterpart of calling SetEventFlag directly: the flag id comes from data laid out with the object instead of
  from a script argument. Callers read back r4, r5 and r7, which the prologue/epilogue keep intact.'
