name: ow_saveJackInState
address: '0x0803C2AA'
kind: function
status: probable
summary: Stashes four caller-supplied buffers (r0=0x20, r1=0x20, r2=0x10, r3=0x10) into unk_200A400, unk_200A420,
  unk_200A3A0, and unk_200A3B0, so overworld state can be saved before a jack-in.
interface: (r0 = src buf A, r1 = src buf B, r2 = src buf C, r3 = src buf D) -> r0 destroyed; copies caller buffers
  into unk_200A400/unk_200A420 (0x20 each) and unk_200A3A0/unk_200A3B0 (0x10 each)
details: 'The function does nothing but four CopyBytes calls: caller pointer r0 -> unk_200A400 (0x20 bytes), r1
  -> unk_200A420 (0x20), r2 -> unk_200A3A0 (0x10), r3 -> unk_200A3B0 (0x10). The two 0x20-byte buffers are likely
  string-sized or struct-sized data (e.g. area/map names or position/object state), the 0x10-byte ones smaller records.
  Since data flows from caller-supplied pointers into persistent globals, this is a stash/save of state, and its
  only game-flow caller is ow_attemptJackIn, which would snapshot overworld state so it can be restored on jack-out.
  No validation, no return value.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: Four unconditional CopyBytes calls with fixed destinations unk_200A400/200A420 (0x20) and unk_200A3A0/200A3B0
    (0x10), asm offsets 0x0803C2AA-0x0803C2D9; Sole meaningful caller is ow_attemptJackIn, tying the stashed buffers
    to the jack-in flow; Copy direction (caller args as source, globals as destination per CopyBytes(src,dest,n)
    signature) makes this a save/stash, not a load
  refs:
  - bn6f/asm/asm03_1_1.s:6884
  - 0x0804930C ow_attemptJackIn
  - 0x08039CB4 sub_8039CB4
  - 0x08000920 CopyBytes
  reproduce: python3 tools/asmcat.py 0x0803C2AA
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The code
    matches the proposal exactly: four CopyBytes calls, sizes 0x20/0x20/0x10/0x10, destinations unk_200A400/unk_200A420/unk_200A3A0/unk_200A3B0,
    and ow_attemptJackIn is a confirmed caller. However, one of the destinations (unk_200A3A0) is at a lower address
    than r0''s first source, which a CopyBytes that decrements would not handle correctly; this means the routine
    is specifically saving/stashing state (not a generic copy), so ''ow_saveJackInState'' is reasonable. The interface
    note that r0 is ''destroyed'' is slightly off — r0 starts as the first source pointer and is reused as src for
    successive calls, so its meaning is consumed but the register value is rebuilt. Minor wording fix only.; run
    wf investigate investigate-20261019-022109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- Exact meaning of each of the four buffers (names? warp/position data? object list?) — need the jack-out restore
  routine that reads unk_200A400..200A3B0
- Whether CopyBytes args are (src,dest) or (dest,src) as the project comment claims; the direction of the copy flips
  the function's role if reversed
