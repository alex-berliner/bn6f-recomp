name: scriptCmdFadeScreen
address: '0x08138584'
kind: function
status: probable
summary: 'Script opcode handler: starts a screen fade (kind 0xC) to the level given by the next script
  byte.'
interface: (r3 = script pointer, r5 = interpreter state) -> r0 = 0 (continue); [r5+0x18] = r3+2
details: Reads the operand byte at [r3+1], advances the script cursor r3 by 2, stores the updated pointer
  into offset 0x18 of the interpreter state in r5, then calls SetScreenFade(0xC, operand). The fixed first
  argument 0xC selects the fade type/mode; the operand is the fade parameter (likely level or speed).
  Returns 0 in r0, matching the interpreter's 'keep running' convention. Registers r3/r5 are live inputs,
  so this is a dispatch-table opcode body rather than a standalone call target.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r3,#1] + add r3,#2 + str r3,[r5,#0x18]: two-byte opcode consuming one operand from
    a script stream tracked in the state struct; bl SetScreenFade with r0=#0xc hardcoded: fade is triggered
    with fixed mode 0xC and the script byte as argument; mov r0,#0 return matches other interpreter opcode
    bodies that signal continuation; no callers known: consistent with being reached via an opcode dispatch
    table, not BL'
