name: ow_restoreTilemapFromSnapshot
address: '0x08094708'
kind: function
status: probable
summary: Re-blits the stored overworld tilemap snapshot at unk_2025404 into the map tilemap buffer and
  redraws the tilemap around the camera.
interface: () -> r0 = 0; no flags set meaningfully (values from callee are discarded)
details: Loads the pointer to unk_2025404 (a 3400-halfword block, 34 rows x 100 halfwords) and passes
  it to ow_blitTilemapBlockAndRedraw, which copies it into the overworld map tilemap buffer and triggers
  a camera-centered tilemap redraw. The function is thus a parameterless restore of the tilemap from a
  static backup copy. It always returns 0 to its caller. unk_2025404 is presumably a full-map or screen-sized
  tilemap snapshot kept in EWRAM, written elsewhere. No flags or other registers are consumed from the
  callee.
