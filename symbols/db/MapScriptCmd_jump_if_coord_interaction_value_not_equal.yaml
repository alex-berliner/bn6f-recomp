name: MapScriptCmd_jump_if_coord_interaction_value_not_equal
address: '0x08035BB2'
kind: function
status: confirmed
summary: Map script command that jumps to a script address if the game state's coord-interaction value does not
  equal a byte operand.
interface: void MapScriptCmd_jump_if_coord_interaction_value_not_equal(toolkit_r10, scriptCursor_r7, operandBuffer_r4);
  returns r0 = 1 (continue script), with r4/r6/r7 updated per the taken-or-not branch
details: 'Map script interpreter command handler. Loads the GameState pointer from

  the toolkit (r10 + oToolkit_GameStatePtr) and reads the byte at

  oGameState_CoordInteractionValue. This is the value describing what kind of

  interaction the player last triggered on the current map tile (the "coord

  interaction" used by scripted object/tile checks). It then reads the

  command''s byte operand with ReadMapScriptByte (r6=1 selects byte width; the

  reader returns the operand in r4 and preserves r0, r7, r10). If the operand

  equals the interaction value, the condition fails to fire: the script

  cursor r7 is advanced by 6 (past the 1-byte operand plus a 4-byte word

  operand and command overhead), skipping the jump target. If they differ,

  the cursor is treated as sitting on the jump-target word: ReadMapScriptWord

  (r6=2) reads it into r4 and r7 is set to that value, moving execution to

  the target. Always returns r0 = 1 with NZ flags set on it, the standard

  "continue/keep running scripts" signal. Quirk: on the not-equal path r7 is

  reassigned via an encoded "adds r7, r4, #0", so the carry flag reflects

  that move; the equal path leaves carry from the add-immediate.

  '
