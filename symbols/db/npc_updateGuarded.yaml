name: npc_updateGuarded
address: '0x080A8424'
kind: function
status: probable
summary: Per-frame update for an overworld NPC/actor whose special action only runs when no cutscene,
  busy state, chatbox lock, or PET menu is active.
interface: (r4/r5 = object struct pointer set up by caller) -> void; sets NZ via callee calls for internal
  branches
details: 'r5 points to an object/NPC struct. If story flag EVENT_9FF is set, it writes 8 to byte +8 and
  1 to byte +7 (likely a state/animation id) and skips the normal behavior. Otherwise it bails out (only
  running sub_80A8644 and sprite_update at the tail) if a cutscene script is active, the overworld player
  is busy, chatbox flag 0x80 of eFlags2009F38 is set, story flag EVENT_9D4 is set, or PET menu flag bit
  1 is set — classic ''world is interactive'' guards. When allowed, it reads counter byte +9: if 0 it
  calls sub_80A856C and only proceeds when that returns Z (0); it then latches +9 = 1 so subsequent frames
  skip the check. Each active frame it calls sub_80A85B4 and sub_80A860C (the actual behavior, likely
  movement or a scripted reaction), then always sub_80A8644 and sprite_update on the object''s sprite
  struct.'
