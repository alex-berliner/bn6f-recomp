name: battle_playSideVariantAnim
address: '0x080CA4F6'
kind: function
status: probable
summary: Picks one of four animation variants on battle object r5 based on its team (alliance) XOR facing
  (directionFlip) and plays it via the helper at 0x80CA4D8.
interface: (r5 = battle object pointer, implicit) -> r0 = animation index ((alliance ^ directionFlip)
  * 5 + 1), r1 = 3, r3 = 0x10000 passed to sub_80CA4D8; returns nothing
details: Reads oBattleObject_Alliance and oBattleObject_DirectionFlip from the battle object in r5 and
  XORs them, producing a 0/1 selector that combines team side with horizontal flip. It multiplies by 5
  and adds 1, yielding animation ids 1, 6, 11, or 16 — a stride-5 table of per-side/per-facing animation
  variants. It then calls sub_80CA4D8 with r1 = 3 (likely an animation slot, priority, or mode) and r3
  = 0x10000 (possibly a frame duration or 16.0 fixed-point speed). The function has no other state or
  branching; it is a thin wrapper parameterizing the helper from object fields.
