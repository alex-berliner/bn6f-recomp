name: chargeShotChargeObject_init_80E0E10
address: '0x080E0E10'
kind: function
status: confirmed
summary: Initializes the charge-shot charge battle object, marking it active and jumping straight into its first
  update step.
interface: void chargeShotChargeObject_init_ADDRESS(BattleObject *obj /* r5 */); tail-calls chargeShotChargeObject_update_80E0E20
  and returns its r0-r3 and NZCV.
details: 'Battle-object state initializer (r5 = the charge-shot charge object). Stores 1 into oBattleObject_ExtraVars+4
  (an "active/enabled" flag for this object), then writes CUR_STATE_UPDATE (4, the shared battle-object "run update
  step" state) into oBattleObject_CurStateActionPhaseAndPhaseInitialized to advance the object''s state machine
  into its update phase. It then tail-calls chargeShotChargeObject_update_80E0E20 so the object performs its first
  update immediately on the same frame it is initialized instead of waiting for the next state tick. r4, r6, r7
  and r10 are passed through untouched; the NZCV flags left behind come from the tail-called update''s final flag-setting
  instruction.

  '
