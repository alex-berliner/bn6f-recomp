name: menu_tickInput_81255F8
address: '0x081255F8'
kind: function
status: confirmed
summary: 'Ticks joypad input each frame for an open menu: handles Start/B exit confirmation, L/R page-turn,
  and a pending list-navigation operation by temporarily swapping the cursor index before dispatching
  submenu_moveListCursor.'
interface: void menu_tickInput_81255F8(u32 r0_in, u32 r2, MenuState* r5, Toolkit* r10); /* modifies *r5
  in-place; returns via r8=r0_in, r9/r12 set by callees */
details: 'Loads the joypad pointer from the toolkit via off oToolkit_JoypadPtr, then reads the 16-bit
  pressed word (oJoypad_Pressed) and held word (+4). Three early-return branches: (1) Start|B freshly
  pressed → calls menu_confirmExitAndFade_812580C with kind 0x38; (2) L held → writes 0x10 to state+0x02
  (MenuState_Kind) and plays sound 0x7A; (3) R held → writes 0x08 to state+0x02 and plays sound 0x7A.
  If none of those fire and state+0x5C (PendingOp) is non-zero, the routine saves the u16 cursor at state+0x1C,
  overwrites it with PendingOp so that submenu_moveListCursor interprets it as the target layout index,
  checks whether L/R (mask 0x300) are held or whether Select/Start (mask 0xC0) are held with no fresh
  L/R press, calls submenu_moveListCursor with arg1=7 arg2=0, stores the joypad pointer at state+0x70,
  then restores the original cursor. The u16 cursor save/restore is done via a push/pop of the stack.
  r0_in is copied to r8 in the prologue and preserved as the only "output" the caller reads back; r5 and
  r10 are callee-saved and returned unchanged.

  '
