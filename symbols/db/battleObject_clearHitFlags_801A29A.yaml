name: battleObject_clearHitFlags_801A29A
address: '0x0801A29A'
kind: function
status: confirmed
summary: Clears the object's hit/flinch flag bits (0x10000 in both flag words) and resets a collision-data halfword,
  ending the object's current hit state.
interface: void battleObject_clearHitFlags(BattleObject *obj /* r5 */); clobbers r0-r3, sets NZ from r0 (=0)
details: 'Operates on the battle object passed in r5. Calls object_clearFlag and object_clearFlag2

  with bit 0x10000 (dword_801A534) to clear that bit in the object''s two flag words, then

  loads the object''s CollisionDataPtr (oBattleObject_CollisionDataPtr) and stores 0 into the

  halfword at oCollisionData_Unk_2a of that collision data. The trailing "mov r0,#0" doubles

  as the stored value and leaves NZ flags cleared on return. The bit pattern (flag pair plus

  a collision-data counter) fits clearing a flinch/hitstun or invulnerability state after the

  object has been hit, but which in-game state bit 0x10000 represents is inferred, not proven.

  '
