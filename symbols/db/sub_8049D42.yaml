interface: u32 Next sub_8049D42(void); // r0 = state byte, returns to lr, sets NZ
details: 'Reads the single byte at ''A_byte_2001802'' inside the per-battle state block at ''A_word_2001800''. The
  function exists solely to fetch that state field, returning it in r0 and preserving the NZ flag bits so a tst/bne
  pair can be used directly by the call site (typical idiom: ''bl sub_8049D42; bne ...'' to branch on the state
  value). No registers are preserved, and aside from r0 nothing else is used.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
