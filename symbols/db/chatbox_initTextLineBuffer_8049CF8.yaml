name: chatbox_initTextLineBuffer_8049CF8
address: '0x08049CF8'
kind: function
status: confirmed
summary: Resets the 0x48-byte dialog-text work buffer at 0x2001800, pre-filling its two text lines with
  blank tile bytes (0xE5) plus 0xE6 marker bytes.
interface: void sub_8049CF8(void) — no meaningful inputs; returns with r2=0xE5E5 and r3=0xE500 left over
  from the last fill call, r4-r7 preserved
details: "Zero-fills the whole 0x48-byte work block at word_2001800 (EWRAM) via ZeroFillByWord,\nthen\
  \ lays out blank line data inside it with two HalfwordFill calls:\n\n  +0x00..+0x07  header area, zeroed\
  \ (never written again here)\n  +0x08..+0x27  line 1: filled with halfword 0xE5E5 (i.e. repeated 0xE5\
  \ bytes, the\n                blank-textbox tile/character code), then a 0xE6 byte is stored at\n  \
  \              +0x18 (byte_2001818)\n  +0x28..+0x47  line 2: filled with 0xE5E5 the same way, then a\
  \ 0xE6 byte stored\n                at +0x3C (byte_200183C)\n\nThe two 0xE5E5 fills plus the 0x48 total\
  \ size only line up if HalfwordFill's count\nargument is a byte count (0x20 bytes = 16 halfwords per\
  \ line), which matches the\nsecond line starting exactly at +0x28. The 0xE6 bytes sit inside the filled\
  \ rows\n(at +0x10 into line 1 and +0x14 into line 2), so they look like per-line\nattribute/terminator\
  \ markers rather than end-of-buffer bytes; their exact role in\nthe text renderer isn't confirmed from\
  \ this function alone. Quirk: because\nHalfwordFill preserves r2/r3, the caller-visible exit state carries\
  \ the last fill\nsetup (r2=0xE5E5, r3=0xE500) even though the function takes no arguments.\n"
