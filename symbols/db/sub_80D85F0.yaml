name: sub_80D85F0
address: '0x080D85F0'
kind: function
status: confirmed
summary: Spawns a battle object of subtype 0x98, placing it on the given panel with the supplied element, alliance,
  damage/stamina counter and extra-vars, and marks its header as active.
interface: 'u32 spawnBattleObject_Type98_80D85F0(u32 panelX /*r0*/, u32 panelY /*r1*/, u32 element /*r2*/, u32 objectOutR5,
  u32 alliance /*r4*/, u32 damageCtr /*r6*/, u32 extraVars /*r7*/) -> u32 spawnedObject /*r0*/; flags: nz,c/v clobbered

  '
details: 'Allocates a new oBattleObject via object_spawnType3 with type 0x98 (the object slot is communicated to
  the callee through the caller''s r5 ABI, which the function restores on return). On success it writes the spawned
  object''s body fields: oBattleObject_PanelX (byte), oBattleObject_PanelY (byte), oBattleObject_Element (byte),
  oBattleObject_Alliance (byte), oBattleObject_DamageAndStaminaDamageCounterDisabler (word), and oBattleObject_ExtraVars
  (word). It then sets bits 0x14 (0x10 | 0x04) in oObjectHeader_Flags, which appear to mark the header as "active/in-use".
  Returns the new object pointer in r0, or 0 if the spawn failed (in which case no field writes occur).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
