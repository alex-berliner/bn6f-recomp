summary: Initializes the current battle object to phase 8 with a 32-unit Timer2 after entering animation
  5 and setting its extra state to 9.
interface: (r5 = battleObject) -> void; flags preserved
details: Sets the object's current animation to 5, writes 9 to byte 0x10 of ExtraVars[8], initializes
  Timer2 to 0x20, and sets CurPhaseAndPhaseInitialized to 8. It only mutates fields of the battle object
  or one extra-state pointer and does not call other functions.
