name: spoutcrossBPwrAtk_init_8011C5E
address: '0x08011C5E'
kind: function
status: confirmed
summary: Initializes the AI attack-vars block for the SpoutCross beast-power attack, storing its computed damage
  and parameters and returning the attack id 0x25.
interface: int spoutcrossBPwrAtk_init(r7 vars /*oAIAttackVars*/, r5 powerLevel, r10 unused) -> r0 attack id (0x25),
  r5 updated power level; clobbers r1-r3, lr, flags
details: 'Tail of a SpoutCross (Beast Out) power-attack setup handler. Calls battle_beastPwrAtk_addScaledBase_8012642
  with base damage 0x14 (20) and power modifier 0xA (10), passing the caller''s power level in r5 through (the helper
  both reads and updates it, and returns the scaled damage in r0). Stores the results into the r7 AI attack-vars
  struct: Damage = scaled value (halfword), AttackBoost = 0 (halfword), ExtraDamage = 0x94 (halfword, 148), AiDifficultyTier
  = 2 (byte), AttackBoost2 = 0xD as a full 32-bit store, and InitFlag = 2 (byte). Finally returns the constant 0x25
  in r0, which appears to be the attack id / next-state selector consumed by the caller. r10 is listed as an input
  by the callers but the function never touches it (probably preserved incidentally or used by sibling handlers
  in the same dispatch table).

  '
