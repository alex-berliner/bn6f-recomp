name: ai_scriptDispatch
address: '0x08110E90'
kind: function
status: confirmed
summary: Dispatches to the AI script handler indexed by the object's ScriptId byte, gated by flag 0xA000.
interface: void ai_scriptDispatch(r5 object, r6 aiState) -> r1 (0xA000 if gated, else handler's r1); clobbers r0,r2,r3,r7,lr,nzcv;
  preserves r4,r6; outputs r5,r8-r12
details: 'Calls object_getFlag(r5) and tests against the 0xA000 gate mask; if set, pops and returns without dispatching.
  Otherwise reads the u8 ScriptId from aiState at offset oAIState_ScriptId, uses it to index a 3-entry Thumb jump
  table (off_8110EAC), and dispatches via mov lr,pc / bx r1. Jump-table entries: 0 -> sub_8110EB8 (unnamed), 1 ->
  ai_attackGuardStrike, 2 -> ai_initPanelReserveAttack. The callee inherits r0 = script_id (from the ldrb) and r1
  = table base (clobbered by ldr [r1,r0]); the handler is free to return its own r1 which propagates to the original
  caller.'
