summary: 'Per-frame tick for the battlesweep enemy''s attack: decrements StepTimer each frame and, on
  reaching zero, calls sub_80B87AC with the panel-choose callback/damage/target panel, reloads StepTimer
  with 0x3F, stores 8 as the hit element, and highlights the target panel via ai_sweepHighlightTargetPanel.'
interface: (r0-r3 unused on entry; uses AI struct at r7) -> no return value; clobbers r0-r3, flags
details: 'Reads the AI attack variable block at r7: it decrements oAIAttackVars_StepTimer, and on reaching
  zero calls sub_80B87AC with (PanelChooseCallback, Damage, TargetPanelX, TargetPanelY) — presumably spawning
  the sweep''s hit/attack effect on the marked panel — then reloads StepTimer with 0x3F so the attack
  repeats every 63 frames and writes 8 (an element/type constant) into oAIAttackVars_HitElement. The ChargeCycles-vs-StepTimer
  comparison at the top has an empty branch body and no effect. Every invocation ends with ai_sweepHighlightTargetPanel,
  which blinks the stored target panel on alternating ticks.'
