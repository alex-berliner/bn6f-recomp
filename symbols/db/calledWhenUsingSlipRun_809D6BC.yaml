name: calledWhenUsingSlipRun_809D6BC
address: '0x0809D6BC'
kind: function
status: confirmed
summary: Applies the overworld player's directional walking/anim table for the current facing, swapping to the SlipRun
  table while EVENT_1716 (and not EVENT_173F) is set.
interface: 'void owPlayerApplyFacingAnim_809D6BC(u32 r3, u32 r4, OWPlayerObject* r5, void* r10 /*toolkit*/); out:
  r0=4, r1=group byte, r3=r3_in, r6=GameState*, r7=selected anim entry addr; flags NZ from final add'
details: 'Reads MapGroup from GameState (toolkit + oToolkit_GameStatePtr -> oGameState_MapGroup).

  If MapGroup >= INTERNET_MAP_GROUP_START, picks groupByte = eStruct2000aa0[oS2000aa0_Unk_03],

  else groupByte = 0; the byte indexes between two animation array pointers at off_809D71C

  (default) or off_809D728 (SlipRun). Picks off_809D728 when EVENT_1716 is set AND

  (EVENT_IN_SLIPRUN_STATE is set OR EVENT_173F is clear). Loads

  OWPlayerObject + oOWPlayerObject_FacingDirection, multiplies by 12 to index the chosen

  12-byte entry, and writes: AnimationSelect = entry[0], Unk_38 = entry[4], Unk_3c = entry[8],

  Unk_0a = 4. Touches OWPlayerObject (r5), GameState via toolkit (r10), and eStruct2000aa0

  only on internet maps. Calls TestEventFlagFromImmediate three times via movflag; preserves

  r3/r4/r5/r10 across those calls. The "calledWhenUsingSlipRun" name is misleading: it runs

  on every facing-driven anim update, not only during SlipRun; the SlipRun table is just a

  branch chosen by event flags.

  '
