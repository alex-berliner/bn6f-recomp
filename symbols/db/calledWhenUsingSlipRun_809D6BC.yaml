open_questions:
- Why does the internet-map variant use a different table byte (eStruct2000aa0[3]) instead of the player's facing?
  Likely a secondary row axis for parallel-NPC vs player splits.
- What are oOWPlayerObject_Unk_38/Unk_3c/Unk_0a? Probably a sprite asset pointer pair and a sub-state/frame id;
  4 may be a "set anim playing" sentinel.
- Why does EVENT_IN_SLIPRUN_STATE OR !EVENT_173F both flip to the SlipRun table? Suggests EVENT_173F toggles a different
  slip state (cancel/finish) where the normal table is restored.
