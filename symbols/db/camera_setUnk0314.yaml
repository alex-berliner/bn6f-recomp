summary: Writes 1 into a byte field and clears a word field of the camera struct reached from the r10
  globals, then returns 0.
interface: () -> r0 = 0; writes via camera_writeUnk03_14 into camera struct
details: 'The function loads a pointer from [r10+0x3c], dereferences [ptr+0x18], adds 0x1c, and passes
  that address with r0=1 to camera_writeUnk03_14, which stores a byte (offset 0x3) and a word (offset
  0x14) into the camera struct and leaves its pointer in r2. So this is a one-shot setter/initializer
  for two camera fields: byte field set to 1, word field zeroed. It always returns 0 in r0. r4-r7 are
  pushed but unused. With no known callers, whether this triggers (e.g.) a camera shake or an effect reset
  cannot be determined from this code alone.'
