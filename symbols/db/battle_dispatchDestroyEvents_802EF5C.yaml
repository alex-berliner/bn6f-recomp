- method: assembly-reading
  date: '2026-10-14'
  detail: '- All 19 captured calls show entry r0=0 and exit r0=0 with flags unchanged; never touches any
    memory via r1 (r1 pointer to a mostly-zero 0x40-byte block + one back-pointer at offset 0x30 is just
    an uninitialised scratchpad in the caller''s frame). - 30+ callers all sit in battle-object destroy/teardown
    code paths (battle_teardownObject_80165F8, sub_80170E4, airspinObject_update_80D8988, and dozens of
    sub_80CDXX/sub_80DXXX object teardown handlers). - The two-call 0/1 dispatch pattern to a sub-handler
    is the standard "send command then send acknowledgement" idiom used across MMBN battle object teardown.
    - battle_testFlag0x40_800A8F8 returns 1 when BATTLE flag 0x40 is set, and the caller proceeds only
    then.'
