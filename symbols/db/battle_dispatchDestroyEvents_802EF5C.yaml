name: battle_dispatchDestroyEvents_802EF5C
address: '0x0802EF5C'
kind: function
previous_names:
- sub_802EF5C
status: probable
summary: If battle flag 0x40 is set, dispatches a paired "0 then 1" signal to the battle object's destroy
  sub-event handler (sub_802EF74), then returns; otherwise no-op.
interface: '() -> ; side effect: when BATTLE flag 0x40 is set, calls sub_802EF74(r0=0) then sub_802EF74(r0=1)'
details: "- Only reads inputs (r5/r10/lr) per the contract; r10 is the toolkit/battle-context pointer\
  \ used by the callee.\n  - Calls battle_testFlag0x40_800A8F8 to query flag 0x40 of the battle state.\n\
  \  - If the flag is clear, branches to `locret_802EF72` and returns immediately (no side effects).\n\
  \  - If the flag is set, executes the two-step dispatch: r0=0 then r0=1, both passed to sub_802EF74.\n\
  \  - The 0/1 sequence is a classic \"edge / level\" pair: sub_802EF74 likely uses it to drive a state-machine\
  \ transition (e.g. send \"begin destroy\" then \"destroy confirmed\" or to differentiate a guard word\
  \ from its data word).\n  - Wide use by ~30 battle-object teardown / destruction code paths (airspinObject_update,\
  \ battle_teardownObject_80165F8, sub_80170E4, and many sub_80CDXX/sub_80DXXX teardown helpers) strongly\
  \ suggests this is the standard \"issue the destroy command for this battle object\" hook that runs\
  \ after the per-object teardown has prepared the object for removal.\n  - The function is `void`-like:\
  \ nothing is returned in r0 to callers (callee-saved r4..r7/r5..r7 are caller-managed and overwritten\
  \ by callees).\ndetails_evidence_bullets:\n  - `push {lr}; bl battle_testFlag0x40_800A8F8; cmp r0,#0;\
  \ beq locret_802EF72` shows the flag-guard early-out.\n  - `mov r0,#0; bl sub_802EF74; mov r0,#1; bl\
  \ sub_802EF74` shows the two calls with r0=0 then r0=1, no other state is touched between them.\n  -\
  \ `pop {pc}` returns directly; no value placed in r0.\n"
