open_questions:
- The exact meaning of flag 0x40 (it gates the destroy signal so it only fires in certain battle states,
  e.g. normal turn-end vs. custom-screen victory); settling it requires correlating the writers of flag
  0x40 with battle phases.
- What sub_802EF74 actually does with r0=0 vs r0=1 (e.g. writes a sentinel to the object, signals the
  battle scheduler, or arms a delayed destroy); needs decompilation of sub_802EF74 itself.
