name: battle_hasTwoOrMoreActorsWithParam
address: '0x08111F94'
kind: function
status: probable
summary: 'Battle-side gate: returns 1 if at least two battle actors have a nonzero value in the field
  at offset 0x73, else 0, and on success triggers the sub_8111F70 effect.'
interface: () -> r0 = 1 if count of matching actors >= 2 (and sub_8111F70 is invoked), else 0; flags clobbered
  by callees
details: It calls the known helper FindBattleActorsWithNonzeroParam_ReturnCountAndSum with fixed arguments
  r0=0x60, r1=0x73, r2=0x78, which scans battle actors and returns a count of those with a nonzero value
  (fields 0x73/0x78 presumably a status byte and its paired value, with 0x60 selecting the actor list/bank).
  If the returned count is >= 2 (cmp r0,#2; bge), it calls sub_8111F70 and otherwise passes through; it
  then returns 0 when below the threshold, and r0 after the sub_8111F70 branch comes from that callee,
  which likely returns success. Recorded execution in the battlesweep and beastsp routes shows it runs
  during real battles, so this is a per-battle condition check that fires some effect once two or more
  qualifying actors exist. The exact gameplay meaning depends on what field 0x73 holds, which the callee
  name does not reveal.
