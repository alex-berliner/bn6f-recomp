summary: Stub that zeros a battle object's CurAction byte (offset 0x9).
interface: '(r5 = *BattleObject) -> r0 = 0 ; side effects: writes byte 0 at r5+0x9'
details: "Saves r4-r7 and lr, then loads immediate 0 into r0 and performs strb r0, [r5,#9]\n  before restoring\
  \ the saved registers (pop {r4-r7,pc}) — a single-byte clear with\n  no other side effects. Per the\
  \ battle_object_struct definition, offset 0x9 is\n  CurAction (the current action index next to `CurState`\
  \ at 0x8). This makes the\n  function a minimal \"reset CurAction to 0\" helper, often used as an initialize/\n\
  \  teardown thunk when a phase is reset. The contract shows only r5/lr read and\n  only r5 in the live-out\
  \ callee-saved set, with r0 returned as 0; r4/r6/r7 are\n  pushed/popped but untouched here. The captured\
  \ calls all enter with lr =\n  0x080a7e20 (caller's site), r0 = 0x080a7e45 (the function address with\
  \ Thumb\n  bit set), and r1 = 0; r2/r3 vary and look like unrelated caller state. The\n  function is\
  \ invoked repeatedly during battle steps where the AI/object action\n  index must be cleared.\n"
