    offset 9 of the object pointer passed in r5. - The `push {r4-r7,lr}` / `pop {r4-r7,pc}` pair preserves
    the callee-saved registers and returns via lr; r0 is left as 0 (captured exit r0=0 in every snapshot,
    with the Z flag set: `-Z--`). - Per `battle_object_struct`, offset 0x9 is `CurAction` (sibling of
    `CurState` at 0x8), confirming the role of the cleared byte. - The function has no callees and a void-like
    contract (only r5 preserved in out), matching a tiny inlined clear.'
