name: eOWPlayerObject_X
address: '0x02009F5C'
kind: ram
previous_names: []
status: confirmed
summary: 'MegaMan''s overworld X position (eOWPlayerObject +0x1C, s16.16: pixels in the high halfword); the start
  of the object''s Coords (X, Y, Z, then NextX/Y/Z).'
details: 'Field X of overworld_player_object_struct (include/structs/OverworldPlayerObject.inc:29, loc 0x1C) instantiated

  at eOWPlayerObject = 0x02009F40 (ewram.s:775). The code reaches it through GameState.OverworldPlayerObjectPtr,

  which SpawnOWPlayerObject''s result (eOWPlayerObject) is stored into (ow_player.s:195, 2077). The integer pixel

  part is the high halfword (oOWObjectCoords_X = 2, read with ldrsh, e.g. owObject_lineDraw_8030CAC).

  Writers: the movement handlers add the step (+0x38) to it each frame (owPlayer_applyCountdownUpdate_809D5C4,

  owPlayer_ApplyKnockbackOrSnapToTarget_809D730), set it back from NextX when a frame''s move is cancelled, and

  owPlayer_copyCoordsToNextCoords..._809e188/_809e1d8 set it (keeping the old value in NextX); clampPlayerPosition_809E3D6

  clamps it to bounds held in eStruct2000aa0. Readers include ReadOWPlayerObjectCoords, owPlayer_isMoving_809DFA0

  (X != NextX), the collision sweep (checkCollision_8030b6a -> owObject_lineDraw_8030CAC, from NextX/Y to X/Y)

  and map_triggerEnterMapOnWarp_8005C04, which saves it on a real-world/internet crossing (asm00_1.s:5845).

  vidsync (BN6F_SYMBOLS.md, level R): try_relocate in tools/vidsync/autosync.py writes it, with Y, NextX and NextY,

  through syms.GS_OW_PLAYER_PTR (offset 0x1C) to move MegaMan where the video has him; segment junctions

  (tools/vidsync/segments.py) write the 0x30 bytes from +0x1C; try_position and probes read +0x1C to trace his walk.

  '
