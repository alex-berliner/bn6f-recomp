name: ow_forceKeyState
address: '0x0813768C'
kind: function
status: probable
summary: ORs a key bitmask into all three fields (held, just-pressed, repeat) of the toolkit's joypad
  state, injecting fake held buttons.
interface: (r0 = key bitmask to force) -> r0 = clobbered; modifies toolkit joypad held/new/repeat halves
details: Fetches the joypad struct pointer from the toolkit at r10 (oToolkit_JoypadPtr), then ORs r0 into
  the halfword at +0 (currently held keys), +4 (newly pressed this frame), and +2 (key repeat), storing
  each back. This makes the engine behave as if those buttons are physically pressed for that frame. Likely
  used by scripted sequences (the recorded route is beastsp, i.e. Beast Out) to force input, e.g. to auto-trigger
  or hold a transformation/cutscene. No flags are meaningfully returned; only LR is stacked.
