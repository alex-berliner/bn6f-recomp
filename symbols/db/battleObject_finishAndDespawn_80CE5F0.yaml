open_questions:
- What `sub_80CE64C` (CurAction==0) and `sub_80CE690` (CurAction==1) do exactly; they're presumably the
  per-action "finish" hooks (visual/sound + despawn prep), but without disassembly of them we can't name
  them.
- Whether loc_80CE620's spawn effect is meant only for "battle just ended" cleanup or a generic death
  VFX. The captured calls show both 0x2038790 (some EWRAM) and 0x2038838 as r0 on exit, suggesting two
  distinct collision-region buffers targeted depending on path.
- Whether the CurAction dispatch should fall through to cleanup (loc_80CE62C) after running — `bx r1`
  doesn't tail back here, so we assume the callees either return or never return.
