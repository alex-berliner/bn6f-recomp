name: MapScriptCutsceneCmd_jump_if_progress_in_range
address: '0x08035932'
kind: function
status: confirmed
summary: Map script command that reads the current game progress and jumps to a script address if it lies within
  a [min,max] byte range, otherwise skips the command.
interface: u32 mapScriptCmd_jumpIfProgressInRange(scriptPtr in r7, toolkit in r10); // returns r0 = 1 always; r7
  updated to jump target or scriptPtr+7; r4 = last value read from script; r6 = read-mode counter (1/2/3) for ReadMapScriptByte/Word;
  NZCV flags set by the final add/mov
details: 'Implements the map-script/cutscene opcode "jump if game progress in range".

  Script layout: [opcode][min progress byte][max progress byte][target word] (7 bytes total).

  Loads the game state via r10->oToolkit_GameStatePtr and reads its game-progress byte

  (offset 6 of the game state struct; no named macro in this build). It then performs three

  sequential reads through ReadMapScriptByte/ReadMapScriptWord, using r6 as the mode selector:

  1 = lower bound, 2 = upper bound, 3 = jump target. The lower bound is stashed in r1 (moved

  there straight after the first read, since ReadMapScriptByte returns in r4 and would clobber it).

  If progress >= min and progress <= max (signed byte comparison), the script pointer r7 is set

  to the 16/32-bit target word read from the script (a relative or absolute script address

  depending on ReadMapScriptWord''s convention). Otherwise r7 is advanced by 7 to skip the whole

  command. Both paths return r0 = 1 (the standard "continue/handled" value for script command

  handlers) and pop {pc}, so the return address never survives in lr.

  Note the bounds are compared as signed values (blt/bgt), so progress bytes >= 0x80 would not

  match ranges with min < 0x80; in practice the progress byte is small.

  '
