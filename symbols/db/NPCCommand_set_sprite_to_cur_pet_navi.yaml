name: NPCCommand_set_sprite_to_cur_pet_navi
address: '0x0809EFFC'
kind: function
status: confirmed
summary: NPC script command that changes an overworld NPC's sprite to the current PET Navi's NPC sprite and reattaches
  its shadow.
interface: void NPCCommand_set_sprite_to_cur_pet_navi(OverworldNPCObject* npc /*r5*/, u32 counter /*r6*/); // reads
  r10 (via callee GetCurPETNavi); returns r6 = counter+1; clobbers r0,r1,r3,lr and NZCV
details: 'Script-command handler for overworld NPC objects (r5 = object pointer, r6 = command

  counter, incremented by 1 at the end). Calls GetCurPETNavi() to get the Navi currently

  loaded in the PET, then translates that Navi id through PETNaviToNPCSpriteTable to an

  NPC sprite id. Stores the sprite id (halfword) into npc->NPCSprite and sets

  npc->NPCSpriteCategory to 0x18 (the overworld NPC sprite set category). Also reads

  npc->UnkFlags_60, clears bit 0x80 (OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x80, the shadow

  attached flag), and writes it back so a fresh shadow gets attached to the NPC.

  Used by NPC scripts where an NPC should appear as the player''s currently equipped Navi.

  '
