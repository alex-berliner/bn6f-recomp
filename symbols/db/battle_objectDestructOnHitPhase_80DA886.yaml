open_questions:
- Which CurAction values (0..3) correspond to which sub-handler, and what those sub-handlers actually
  do. The exact semantics of the 0x3f800000 FlagsFromCollision bit (which damage effect triggers immediate
  destruction). Whether the time-stop fallback actually re-enters the same dispatch on the next frame.
