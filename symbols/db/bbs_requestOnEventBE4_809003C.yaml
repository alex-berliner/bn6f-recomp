name: bbs_requestOnEventBE4_809003C
address: '0x0809003C'
kind: function
status: confirmed
summary: Once the BE4 story-event flag is set, plays the mailbox sound, switches the game state to substate 3, and
  raises a BBS request flag; otherwise does nothing.
interface: void sub_809003C(void)   // reads r10/lr per contract, r3 out (callee residue), r4 preserved, flags clobbered
details: 'A small hook, likely run each frame or on a scene tick. It tests the global event flag EVENT_BE4 (0xBE4
  = bank 0x0B, bit 0xE4) via TestEventEventFlagFromImmediate and returns immediately when the flag is clear. When
  the flag is set it performs a one-shot sequence: plays sound effect 4 through the play-sound helper at 0x0809E306
  (the "new mail"/mailbox jingle style id), calls gameState_setUnk09_8001172 with r0=3 to move the game state into
  substate 3 (the state machine field the mail/BBS flow uses), and calls reqBBS_setFlag_e17b0f7_8140A00 to mark
  BBS request e17b0f7 as pending/complete. It is not itself guarded by its own latch, so the game must rely on the
  state change at gameState_setUnk09 or the BE4 flag only becoming set here to avoid repeating the sequence. No
  structures are touched directly; everything goes through the three callee helpers. Register contract is noisy:
  r10 is listed as an input but never used in the body, r3 is an output only as residue from reqBBS_setFlag, and
  r4 is pushed/popped purely to preserve it.

  '
