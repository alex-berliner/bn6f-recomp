name: rfu_advanceTickCounter
address: '0x0803F05C'
kind: function
status: probable
summary: Advances a 3-bit (mod-8) counter in the wireless-lib state block, used as a rotating tick/index
  by rfu callers.
interface: () -> r0 = (old value + 1) & 7 stored to byte_200AC22; no other effects
details: Loads the state pointer byte_200AC20 (a small wireless/RFU-related record), reads the byte at
  +0x2, increments it, ANDs with 7, and stores it back — i.e. it cycles a free-running 0-7 counter with
  no arguments and no return value. Both callers are rfu-queue handlers (they call rfu_queuePushEntry
  on byte_20101E0 and manage per-slot counters like the +0x3C index), so this counter most likely acts
  as a periodic tick or round-robin slot index for the wireless queue/timeout logic. It touches only byte_200AC22,
  and both call sites call it once per state-transition step, unconditionally after updating their own
  counters.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'asm: ldrb [r5,#0x2]; add #1; and #7; strb [r5,#0x2] with r5 = byte_200AC20 — pure mod-8 increment;
    caller 0x08148B34: after rfu_queuePushEntry failure path bumps a slot count at +0x3C then calls this
    — wireless queue context; caller 0x081491CE: increments its own counter at [r4,#0xC] then calls this,
    then reads queue state — periodic step in rfu flow; callers use rfu_queuePushEntry, so the byte_200AC20
    block is plausibly the rfu state the counter belongs to'
