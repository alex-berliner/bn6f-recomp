name: ai_fire3RandomOffsetShots
address: '0x080DF41C'
kind: function
status: probable
summary: Enemy AI attack step that fires three spaced shots at randomized offsets (8/16/24/32 from a table)
  toward the player, then advances the object to action 12.
interface: (r5 = battle object) -> void; clobbers r0-r4, r6; object fields updated in place
details: 'On phase 0 it initializes: phase=4, anim=1, Timer2=3 (shot count), Timer=0. Each time Timer
  (reloaded to 10) expires it draws GetPositiveSignedRNG, masks 3 bits to index dword_80DF484 (bytes 08,10,18,20
  = 8/16/24/32), shifts the picked byte left 16 and pushes it as a stack argument, then calls spawn_t3_0x12_80C6ADA
  with r0 = PanelX + object_getFrontDirection(), r1 = PanelY, r2 = the object''s Element, r4 = 0x12 and
  r6 from DamageAndStaminaDamageCounterDisabler — spawning one projectile, followed by sound effect 0xB9.
  After the third shot (Timer2) it sets CurAction=12 and clears CurPhaseAndPhaseInitialized so the AI
  state machine moves on.'
