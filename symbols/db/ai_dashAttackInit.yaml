name: ai_dashAttackInit
address: '0x0810FE5C'
kind: function
status: probable
summary: 'Enemy AI attack setup: reserves its panel, targets the nearest enemy, and launches a version-indexed
  dash/lunge with attack 0xA.'
interface: (r5 = BattleObject, r6 = AI state, r7 = AI attack vars) -> r0 = 0 stored to oAIState_ScriptId;
  sets velocities, attack vars, CANNOT_SLIDE flag
details: If object_canMove fails, it clears oBattleObject_ExtraVars and ends the AI script (script id
  0). Otherwise it copies its panelX/panelY to offset 0x64/0x65 and calls object_reservePanel to claim
  its own tile, then finds the closest enemy (alliance XOR 1) into oAIAttackVars_TargetObjectPtr. Attack
  stats (duration, damage, extra damage, step timer) are looked up in byte tables indexed by oAIData_Version_16,
  so values differ per game version. It sets oBattleObject_YVelocity from a word table, multiplies it
  by object_getFrontDirection to form XVelocity, and uses BIOS Div (SWI 6) of 0x280000 by the velocity,
  stashing quotient/derived values at object offsets 0x75/0x76 (likely timer/dividend scratch fields).
  Finally it sets OBJECT_FLAGS_CANNOT_SLIDE, starts attack 0xA via object_setAttack0, zeroes oAIAttackVars_AttackElement
  and fields 0x6e/0x6f, and ends the script.
