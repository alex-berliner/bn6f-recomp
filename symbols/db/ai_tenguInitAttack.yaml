name: ai_tenguInitAttack
address: '0x080F9168'
kind: function
status: probable
summary: 'TenguMan AI: initializes an attack by rolling its duration/boost values and targeting the player.'
interface: (r0 = TenguMan battle object, r5 = object base, r7 = oAIAttackVars*) -> r0 = object id passed
  on; no meaningful return
details: Reads the enemy's AI difficulty tier and stores it in oAIAttackVars_AiDifficultyTier, then clears
  the init flag. Calls sub_80F9222 and sub_80F9118 to obtain an attack duration and sub_80F9104 for a
  boost value, storing both in the attack vars. Installs sub_80F9980 as the PanelChooseCallback and resolves
  the opposing object via battle_findPlayer(alliance^1) into TargetObjectPtr. Finally sets attack id 0xA
  with object_setAttack0 and calls sub_80F93C2 to kick off the attack routine.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] after battle_getAiDifficultyTier_800FE36 (lines
    3-5); off_80F92C8 = sub_80F9980+1 stored into oAIAttackVars_PanelChooseCallback; eor r0,#1 + battle_findPlayer
    result stored to oAIAttackVars_TargetObjectPtr — target is the opposing side; mov r0,#0xa; object_setAttack0
    selects the attack being initialized; caller sub_80F9000 is a TenguMan AI step gated by GetPositiveSignedRNG
    rolls, i.e. an AI attack decision
