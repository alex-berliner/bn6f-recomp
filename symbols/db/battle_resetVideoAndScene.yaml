name: battle_resetVideoAndScene
address: '0x08049058'
kind: function
status: probable
summary: After the screen fade gate passes, wipes VRAM, zero-fills the BG tile buffer at 0x30025c0, reloads
  the 0x800-byte GFX block to VRAM 0x600D400 plus the 32-byte IWRAM block at 0x3001B40, reinitializes
  the chatbox, sets DISPCNT-equivalent to 0x40, and calls battle_resetAndInitScene to tear down and restart
  the battle scene.
interface: () -> (); early-returns via ZF from IsScreenFadeActive, no return value
details: 'If IsScreenFadeActive reports the wrong fade state (ZF set) the function just returns, otherwise
  it performs a complete video reset: clears all VRAM, zero-fills the 0x2000-byte BG tile buffer at 0x30025c0,
  reloads the fixed 0x800-byte GFX block into VRAM 0x600D400 plus the 32-byte IWRAM block at 0x3001B40,
  reinitializes the chatbox, writes 0x40 (forced blank) to the render info''s LCD control, and finally
  calls battle_resetAndInitScene, which tears down the mode and jumps the main jumptable to state 0x28
  for a fresh battle scene. The r4-r7 pushes are vestigial (never used). The 0x40 DISPCNT keeps the screen
  blanked while everything is rebuilt, presumably until the next fade-in.'
