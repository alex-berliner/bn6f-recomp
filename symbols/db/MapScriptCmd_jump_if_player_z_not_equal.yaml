name: MapScriptCmd_jump_if_player_z_not_equal
address: '0x08035BFE'
kind: function
status: confirmed
summary: Map-script opcode that jumps to a 32-bit script address when the overworld player's signed Z cell differs
  from a signed halfword operand, otherwise skips the 7-byte instruction.
interface: 'void MapScriptCmd_jump_if_player_z_not_equal(void); inputs: r7 = script cursor, r10 = Toolkit pointer,
  lr = return address; outputs: r7 = updated script cursor, r0 = 1, NZ flag reflecting r0; clobbers: r0, r4, r6,
  lr, flags NZ/C/V'
details: Reads Toolkit->GameStatePtr, then GameState->OverworldPlayerObjectPtr, and treats the high 16 bits of OverworldPlayerObject->Z
  as a signed map cell coordinate. Reads a 2-byte signed comparison operand from the script and reads a 4-byte jump
  target only when the coordinates differ. On mismatch, the jump target becomes the new r7 cursor; on equality,
  r7 advances by 7 bytes from the post-operand cursor, skipping the complete instruction. The script cursor is supplied
  through r7 to both map-script readers, with r6 set to 1 for the signed halfword and 3 for the following word.
