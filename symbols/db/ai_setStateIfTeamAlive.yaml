name: ai_setStateIfTeamAlive
address: '0x080898FC'
kind: function
status: probable
summary: If any actor on team 0x10 is still alive, triggers an AI action, loads a 30-frame value into
  AIData+0x18, and sets the AI state byte to 0x44; always returns 1.
interface: (no meaningful args; r5 = AI/entity context set up by callee) -> r0 = 1; flags from tst r0,r0
details: Calls battle_countAliveActorsOnTeam_8142C20 with team id 0x10; if the count is zero it does nothing
  but return 1. Otherwise it calls sub_8089CA4 with r0=8 (which presumably sets up r5 to point at an AIData
  struct), then ai_setAIDataUnk18_8089CB0 with 0x1E, storing 30 into AIData+0x18 — most likely a frame
  timer or repeat counter. Finally it writes the byte 0x44 to offset 0 of the struct at r5, which reads
  as an AI mode/state selector. The unconditional return of 1 suggests the caller only cares that the
  check ran, not its result.
