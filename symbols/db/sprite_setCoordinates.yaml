name: sprite_setCoordinates
address: '0x0800307C'
kind: function
status: confirmed
summary: Sets an object's x/y position fields within the 0x10-byte sprite sub-entry selected by the high nibble
  of the resource's byte 2.
interface: void sprite_setCoordinates(u16 x /*r0*/, u16 y /*r1*/, SpriteResource* res /*r5*/); returns r3 = selected
  sub-entry address, NZCV from computing it
details: 'Takes the sprite resource pointer in r5 and reads byte 2 (likely the frame/index

  byte). Masking to its high nibble (& 0xF0) yields an offset of 0..0xF0 bytes,

  so byte 2''s high nibble selects one of up to 16 sub-entries of 0x10 bytes each

  within the resource. The halfword coordinate fields of that sub-entry are then

  written: x to entry+0xC and y to entry+0xE, both stored as 16-bit values.

  Returns the address of the selected sub-entry in r3 (handy for chaining), and

  the NZCV flags left over from the add r3, r3, r5 that computed the entry

  address are not meaningful output — callers per the contract do read nz c v,

  presumably incidentally. No other registers are touched. Typical callers pass

  an object''s x/y (r0/r1) and its resource base (r5) to reposition the current

  sprite frame.

  '
