name: t3_0x0_80C4E58
address: '0x080C4E58'
kind: function
status: confirmed
summary: Dispatches a battle object's per-state handler via a small jump table on CurState, then refreshes the object's
  sprite.
interface: 'void t3_0x0_80C4E58(void);  // in: r5=object ptr  out: r5/r8-r12, NZCV clobbered; r7/r10 preserved across
  call? (caller-saved in callees)'
details: "Reads the byte at r5+oBattleObject_CurState and uses it as an index into a\n3-entry thumb dispatch table\
  \ at off_80C4E70 (loaded via off_80C4E6C):\n  state 0 -> sub_80C4E7C  (idle handler, called via ARM BX with lr=pc\
  \ trick)\n  state 4 -> sub_80C4F02  (active handler)\n  state 8 -> object_genericDestroy\nOnly those three CurState\
  \ values are handled; other states fall through with no\nhandler call. After the dispatch it tail-calls object_updateSprite,\
  \ so every\ninvocation also refreshes the sprite. R5 (object pointer) is the implicit input\nthreaded into all\
  \ four callees; the C mockup passes state in R0 as well, but the\nraw asm only loads CurState into r0 for the\
  \ switch — r5 carries the object.\nSaved lr and pops pc (Thumb-2 BX-style return). Lives in the t3_0x0 area that\n\
  handles tertiary battle-object logic; call sites set up r5 and r7 typically.\n"
