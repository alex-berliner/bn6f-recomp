name: adjustSpriteByOffset_811BE9C
address: '0x0811BE9C'
kind: function
status: confirmed
summary: Repositions a sprite by its per-type (x,y) offset and tags it normal or special based on a per-type
  flag table.
interface: 'void sub_811BE9C(struct SpriteObj *r5_sprite);

  // returns in r0 = flag table byte, r1 = attr byte written,

  // r2 = flag table address; r3 left from sprite_setCoordinates;

  // clobbers r0,r1,r2,r3,lr and flags N,Z (from TST) plus C,V (left by sprite_setCoordinates).

  '
details: 'Reads the sprite''s current position via sprite_getCoordinates (r5 -> r0=x, r1=y saved on stack).

  Uses the sprite''s type byte at obj+0xC as an index into a signed-16 dx/dy offset table at

  byte_811BF0C and adds the corresponding offset to (x,y), then writes the result back via

  sprite_setCoordinates.

  Re-reads the type byte (sprite_setCoordinates may rewrite obj+0xC) and looks it up in a

  per-type flag table at byte_811BF94: if the byte is non-zero the sprite is tagged

  0x23 ("special") via strb at obj+0, otherwise it is tagged 0x01 ("normal").

  Outputs the flag byte in r0, the written attr in r1, and the flag-table base in r2 so the

  caller can inspect/dispatch on the sprite''s variant.

  '
