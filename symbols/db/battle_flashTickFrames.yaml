name: battle_flashTickFrames
address: '0x0804C244'
kind: function
status: probable
summary: Initializes and steps the frame counter for the battle screen-flash/background-fill effect driven
  by its caller.
interface: (r5 = effect state object, r10 = toolkit; uses toolkit->oToolkit_Unk2009740_Ptr) -> r0 = void;
  sets state fields 0x11/0x18 and struct bytes 0-3
details: 'On first entry (state byte [r5+0x11] <= 0) it seeds the flash struct behind oToolkit_Unk2009740_Ptr:
  byte0=0x44, byte1=0x3B, byte2=0x10 (total frames), byte3=0 (frame index), and sets a 2-frame sub-timer
  at [r5+0x18]. Every call thereafter it counts down [r5+0x18]; on expiry it reloads it to 2 and, if the
  flash index byte3 is still below 0x10, increments byte3 and decrements byte2 (frames remaining) while
  nonzero. So byte3 acts as the current flash frame (0..15) and byte2 the remaining count, matching the
  caller sub_804C144 which advances a frame index on timer expiry and copies a 32x32 tile block from one
  of 8 frame buffers into character block 2. The bytes 0x44/0x3B written at init are unexplained, and
  the effect aborts silently once byte3 reaches 0x10.'
