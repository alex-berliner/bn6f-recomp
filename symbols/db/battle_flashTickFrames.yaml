name: battle_flashTickFrames
address: '0x0804C244'
kind: function
status: confirmed
summary: Ticks a 2-frame palette flash animation, priming a BGRA slot and advancing its colour-index/ramp bytes
  each cycle until the fade completes.
interface: void battle_flashTickFrames(u32 state_obj /*r5*/, u32 toolkit /*r10*/); /* r5 preserved; flags clobbered
  */
details: 'Called every frame as part of a battle flash effect. State object fields: +0x11 = step counter (0 means
  not yet primed; incremented after priming so it only primes once); +0x18 = 2-frame duration timer (reset to 2
  on expiry). Toolkit fields: +3 = global fade progress counter (capped at 0x10); oToolkit_Unk2009740_Ptr = pointer
  to the active palette slot. Palette slot layout: byte 0 = blue (0x44), byte 1 = green (0x3B), byte 2 = ramp (initial
  0x10, decremented each tick), byte 3 = colour index (incremented each tick, capped at 0x10). On priming the function
  writes a fixed teal-ish BGRA value (0x44,0x3B,0x10,0) and arms the timer; thereafter each call decrements the
  timer, and when it reaches 0 it re-arms, advances colour-index, and decrements ramp—effectively stepping through
  a 16-colour flash ramp over 32 frames (2 per colour). The off_804C294 word (0x400) sits after the function and
  is unused by this code.'
