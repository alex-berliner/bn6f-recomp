name: ai_dispatchAttackElement
address: '0x080F7C5E'
kind: function
status: probable
summary: Dispatches to the AI enemy's attack routine selected by the current attack element
interface: (r7 = AI attack vars struct, element in [r7,#oAIAttackVars_HitElement]) -> tail-jumps to element
  handler, never returns here
details: 'Reads the element byte at oAIAttackVars_HitElement from the AI attack vars in r7, indexes the
  7-entry table at off_80F7C70 (elements: normal, fire, aqua, elec, wood plus two more slots), and performs
  mov lr, pc / bx r1 so the chosen handler returns straight to this function''s caller (a computed jump,
  not a call). Targets include ai_chooseAttackPanel, sub_80F7CF0, sub_80F7D1C, sub_80F7D34, sub_80F7DBA,
  sub_80F7E30 and ai_updateTimedAttack. Element 0 maps to ai_chooseAttackPanel and element 6 to ai_updateTimedAttack,
  so the table order likely follows the game''s element enum. It only exists to share the single ldrb/index/branch
  prologue across all element attack behaviors.'
