summary: 'Proposed name: eBattleLinkPacketEnemy. Second (player 2 / enemy) battle link packet buffer in
  EWRAM, mirroring player 1''s byte_203F4A4 (struct)'
details: 'At 0x0203F5A4 for 8 labeled (up-to-next-label) bytes, but the actual struct size is 0x50 (80
  bytes) per the CopyWords in transferBattleHandNaviStats_800B3D8 and the 0xC copy in sub_800B444. It
  is the second of a pair of link-packet buffers: byte_203F4A4 is the first player, this label is the
  second. battle_initLoopbackLinkPackets builds both via sub_802E45E passing entry index 0 then 1. transferBattleHandNaviStats_800B3D8
  reads its first byte as a sentinel (0xff = unset) and, when battle effect bit 0x8 is set, overlays it
  from a separately-prepared AI block at byte_2034A10. battle_loadBattlerSeed copies its first word to
  entry 1''s +0x44 (RNG seed) and its byte at +4 to entry 1''s +0xE (related seed byte) when the same
  effect bit is set.'
