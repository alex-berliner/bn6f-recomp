name: link_initAndClear_8144158
address: '0x08144158'
kind: function
status: confirmed
summary: Reset GBA link-cable hardware and zero multiplayer comm buffers/state.
interface: 'void sub_8144158(void) /* no registers in/out: lr passes through; preserved {r4-r7}; clobbers
  nz c v {r0 r1 r2 r3} */'
details: "Saves IME around masked IE writes (disables the SIO IRQ bit 7 while the\nSIO mode/control registers\
  \ are reconfigured, then re-enables it). Drives\nSIOCNT through a dummy transfer (writes 0x2000 then\
  \ OR-s 0x4003 to start)\nto bring the multi-player state machine back to a known idle. Clears the\n\
  SIO data registers (SIODATA8/SIODATA32 pair, all four words) and zero-fills\nthe link-state RAM blobs:\n\
  \  * A 614-word (0x266 words, 32-bit) fill into eTimerEnable200F460\n    (multi-player per-connection\
  \ timing/enable table).\n  * A 2-halfword copy from a zero on the stack into unk_200F44C.\n  * Individual\
  \ bytes/halfwords at byte_200F450, byte_2006DFE,\n    byte_2006E00, byte_200F440, byte_200F448, byte_2006E01,\n\
  \    word_2006E02, word_2006E04 (misc per-link flags and the cached\n    IE/IME word at word_2006DFC).\n\
  All SIO/IE access is bracketed by IME=0 to keep IRQ handlers from\nracing the reconfiguration. Returns\
  \ via the lifted \"RETURN_TO_CALLER\"\ntail (`pop {r0}; bx r0`) rather than the usual `pop {pc}`.\n"
