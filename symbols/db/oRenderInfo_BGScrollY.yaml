  reproduce: grep -n 'oRenderInfo_BGScrollY' bn6f/asm/asm00_0.s | head
  result: '"strh r3, [r1,#oRenderInfo_BGScrollY]"'
- method: assembly-reading
  date: '2026-10-15'
