name: oRenderInfo_BGScrollY
address: '0x12'
kind: struct-field
status: probable
summary: BG1/BG3 vertical (Y) scroll offset register pushed to the GBA BG scroll registers each frame.
details: ">\n  Always paired with Unk_10 (the X counterpart) and fed exclusively by per-frame BG scroll\n\
  \  callbacks that compute `counter >> 4` (a 1/16 subpixel-to-tile shift) or by\n  camera_applyDeltaToRenderInfoScroll\
  \ adding the camera Y delta. Cleared to 0 in\n  renderInfo_clearEntryCounts, and copied directly from\
  \ oCamera_Unk_06 (the camera's\n  Y position) by camera_CopyScrollToRenderLayers — the canonical \"\
  vertical scroll\" usage.\n  The name is a u8 in struct but all asm accesses are strh/ldrh (16-bit GBA\
  \ register\n  stores), matching the other Unk_XX fields in this block."
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: BGScrollCB_BG1Diagonal3to2Scroll writes Counter1>>4 (Y-component of diagonal scroll) here, matching
    BGScrollY semantics.
