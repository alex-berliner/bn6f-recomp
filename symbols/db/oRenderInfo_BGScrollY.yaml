  reproduce: grep -n 'oRenderInfo_BGScrollY' bn6f/asm/asm00_0.s | head
  result: '"ldrh r7, [r0,#oRenderInfo_BGScrollY] / add r7, r7, r4 / strh r7, [r0,#oRenderInfo_BGScrollY]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: camera_CopyScrollToRenderLayers writes the masked camera Y (oCamera_Unk_06 & 0xFF) here, confirming
