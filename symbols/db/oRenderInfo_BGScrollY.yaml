  reproduce: grep -n 'oRenderInfo_BGScrollY' bn6f/asm/asm00_0.s | head
  result: '"strh r3, [r1,#oRenderInfo_BGScrollY]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: camera_applyDeltaToRenderInfoScroll_8030136 adds the camera Y delta (r4 = oCamera_Unk_06 - oCamera_Unk_0a)
    into this field, then mirrors to Unk_14/Unk_16 — exactly BG1/BG3/BG-effect vertical scroll registers.
  refs:
