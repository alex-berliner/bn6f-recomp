  reproduce: grep -n 'oRenderInfo_BGScrollY' bn6f/asm/asm00_0.s | head
  result: '"and r2, r4 / strh r2, [r3,#oRenderInfo_BGScrollY]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Cleared each frame in renderInfo_clearEntryCounts, consistent with a per-frame BG scroll register
    reloaded from a live counter.
  refs:
