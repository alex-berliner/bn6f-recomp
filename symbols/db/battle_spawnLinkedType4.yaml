name: battle_spawnLinkedType4
address: '0x080E9BDC'
kind: function
status: probable
summary: Spawns a battle object of type 4 with fixed id 0x89 and links it to a caller-supplied parent
  object and back-pointer slot.
interface: (r5 = parent battle object, r7 = pointer that receives the new object) -> r0 = new object or
  0 on failure; no meaningful flags
details: 'Calls object_spawnType4 with 0x89 as the object kind, then, if the spawn succeeded, initializes
  the child from the parent in r5: it copies the parent''s oBattleObject_AllianceAndDirectionFlip halfword,
  stores the parent as oBattleObject_RelatedObject1Ptr, and stores r7 into oBattleObject_ExtraVars, then
  writes the new object''s address back through r7 so the caller gets a live handle. It also ORs flag
  bits 0x14 into the new object''s oObjectHeader_Flags, likely marking it linked/attached and non-standard-behavior.
  Note the parameters arrive in r5/r7 (register ABI beyond r0-r3), and the beq after pop {r5} is really
  testing the spawn result returned by the callee. The 0x89 constant is hardcoded, so this spawns one
  specific auxiliary battle entity tied to a parent.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_spawnType4 with mov r0,#0x89 shows a fixed type-4 spawn id; ldrh/strh of oBattleObject_AllianceAndDirectionFlip
    copies alliance/flip from parent r5 to the new object; str r5,[r0,#oBattleObject_RelatedObject1Ptr]
    links child to parent; str r0,[r7] publishes the handle; orr r1,#0x14 on oObjectHeader_Flags sets
    attach/link-style flags on the spawn; beq over the copy block shows failure (null spawn) is handled
    by returning early
  refs:
  - bn6f/asm/asm31.s:109375
  - 0x080033AC object_spawnType4
  reproduce: python3 tools/asmcat.py 0x080E9BDC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No known caller, so the game context of object kind 0x89 and which parent spawns it is unknown
- Which flag semantics bits 0x4 and 0x10 have in oObjectHeader_Flags
- Whether r7 points into the parent object or a separate struct field
