name: screens3_initScreen
address: '0x0812A424'
kind: function
status: probable
summary: 'Deferred screens3 screen (re)initialization: gated on the fade being active and a flag at 0x200BC50+5
  being clear; it toggles sub_811B010 0/1, rebuilds the battle scene, draws the screens3 background tiles,
  DMA-loads one entity''s GFX slot, sets r5+1=8, zero-fills 0x10 bytes at unk_20251A0, clears r5+0x1c/0x1e,
  picks a function based on r5+0xe to store a byte at r5+2, spawns eStruct records from byte_8129150,
  then calls SetScreenFade(8,0x10).'
interface: (r5 = screen/scene state struct) -> void; returns early if flag at 0x200BC50 bit 5 is set or
  no screen fade is active
details: 'Runs only while a screen fade is in progress: it first calls sub_811B010 with 0 then 1 (likely
  toggling display layers or sprite/scene visibility), then battle_initScene_8129248 to clear VRAM/GFX
  and re-prime the render-info block, screens3_loadBackgroundTiles to write a 30x20 tilemap plus text
  panels, and loadEntityJumpOffset00Gfx_812B530 to DMA one entity''s 0x100-byte GFX slot. It sets state
  r5+1 = 8, zero-fills 0x40 bytes at unk_20251A0, and clears r5+0x1c/0x1e. Depending on the flag at r5+0xe
  it calls sub_81325F4 or sub_81325E4 (variant-dependent lookup, e.g. player/version dependent value)
  and stores the result at r5+2 with r5+3 = 0. Finally it spawns eStruct records from the 0xFF-terminated
  table at byte_8129150 via battle_spawnEStructRecordsFromTable_80465A0 and kicks off SetScreenFade(8,
  0x10).'
