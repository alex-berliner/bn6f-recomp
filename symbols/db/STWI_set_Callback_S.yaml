name: STWI_set_Callback_S
address: '0x0814C36C'
kind: function
status: confirmed
summary: Registers a callback function in the wireless (STWI) driver work area to be invoked when a wireless send
  completes.
interface: void STWI_set_Callback_S(void *callback /* r0 */)
details: 'Part of the Nintendo STWI (wireless communication) library used by the game''s link/wireless play support.
  Loads the pointer to the STWI library''s global work structure from the word at dword_2010CCC (the work struct
  is heap/ statically allocated and the global only holds its address), then stores r0 into offset 0x1C of that
  struct. Offset 0x1C is the "send done" callback slot, which the STWI interrupt/async-completion path presumably
  calls when a wireless transfer finishes. Clobbers only r1; returns via bx lr with no other side effects and no
  flags set.

  '
