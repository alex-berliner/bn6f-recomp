open_questions:
- Exact gameplay context of the "diagonal 3-to-2" scroll (which scene/map uses this BG3 callback) is not determinable
  from this function alone.
- Whether offsets 0x18/0x1A in render info correspond directly to BG3 horizontal/vertical scroll registers or an
  intermediate needs confirmation from the render code.
- Intended sign of the scroll (which direction the layer appears to move on screen) depends on how the renderer
  applies the offsets.
