name: BGScrollCB_BG3Diagonal3to2Scroll
address: '0x080019D0'
kind: function
status: confirmed
summary: Per-frame background scroll callback that scrolls the BG3 layer diagonally, moving faster on the X axis
  (8 subpixels/frame) than on Y (4 subpixels/frame), giving a shallow-diagonal "3-to-2" pan.
interface: 'void (in: r10 = toolkit/engine context pointer, lr = return address; out: nz/c/v flags, r1 = render
  info pointer, r2 = BG3 X offset, r3 = BG3 Y offset; no clobbers beyond r1-r3)

  '
details: 'Called each frame while this scroll callback is active (r10 holds the engine context, whose oToolkit_RenderInfoPtr
  field points at the render info struct). It reads two 32-bit fixed-point counters (4 fractional bits) from the
  eBGScrollCBCounters struct: Counter0 at offset oBGScrollCBCounters_Counter0 and Counter1 four bytes later. Counter0
  is decremented by 8 and Counter1 by 4 each call, so the layer moves at half-pixel per frame diagonally with an
  2:1 X:Y subpixel rate (whole-pixel steps of 0/1 per frame in X and Y respectively, i.e. the layer drifts down-left
  at a shallow diagonal once per few frames in Y for every X step). The whole-pixel parts (value >> 4) are written
  as halfwords to the render info at oRenderInfo_Unk_18 (X) and oRenderInfo_Unk_1a (Y), which feed the BG3 hardware
  scroll registers. Counters wrap around modulo 2^32 since subtraction is unchecked, so the scroll loops seamlessly
  every 65536/8 and 65536/4 frames respectively if left running. The final flag state comes from the last `lsr`
  on counter1: N/Z reflect the Y offset, C is bit 3 of the pre-shift counter1, and V survives from the `subs r3,
  #4` (only set when counter1 was in [0x80000000, 0x80000003] before decrement). Values persist in the counters
  struct across frames, so callers can re-seed them for other scroll patterns.

  '
