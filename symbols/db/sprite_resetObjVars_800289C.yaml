name: sprite_resetObjVars_800289C
address: '0x0800289C'
kind: function
status: confirmed
summary: Clears the sprite object counter and marks the whole 0x388-entry object table at dword_200A890 as unused
  (0xFFFFFFFF), likely during sprite subsystem init/reset.
interface: void sprite_initObjectPool_800289C(int unused_r3); // r3 passed in but preserved/unused; returns flags
  from WordFill (v set, nz/c clobbered), r2 clobbered
details: 'Writes 0 to the single word at dword_20093A8 (most plausibly a live-object count or allocation index for
  the sprite object manager), then calls WordFill with r0 = dword_200A890, r1 = 0x388 (word count), r2 = 0xFFFFFFFF.
  The 0x388-word table at dword_200A890 is thereby fully set to 0xFFFFFFFF, which reads as "no object allocated
  / free slot" markers — typical of a per-slot handle/index pool for sprite objects being torn down or initialized
  at boot or scene load. dword_20093A8 is reset to 0 so the pool starts empty. The r3 input is preserved untouched,
  so it is dead to this routine (callers apparently still pass something in it). Return flags are simply whatever
  WordFill leaves behind, including the v flag, which the contract lists as an output.

  '
