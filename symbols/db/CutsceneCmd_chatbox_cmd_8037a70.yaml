name: CutsceneCmd_chatbox_cmd_8037a70
address: '0x08037A70'
kind: function
status: confirmed
summary: Cutscene chatbox command that opens/shows the message box, advances the script cursor, and signals
  completion.
interface: Next CutsceneCmd_chatbox_cmd_8037a70(u32 script_ptr_r1, u32 r2, u32 r5, u32* r7_cursor, u32
  r10)
details: 'One of the cutscene (event script) chatbox command handlers. It calls chatbox_8040818, which
  opens/shows the chatbox (the text window used for dialogue during cutscenes), then increments the script
  cursor held in r7 by one entry so the interpreter moves to the next command, and returns 1 in r0 — the
  standard "command handled / done" value the cutscene dispatcher expects. Flags N/Z come from the final
  ''mov r0, #1''; C/V come from the pointer increment. r1, r2, and r5 are preserved (they likely hold
  other interpreter state used by sibling handlers), and lr is popped via ''pop {pc}''.

  '
