name: ai_attackStepChooseFrontPanel
address: '0x08112DC0'
kind: function
status: confirmed
summary: Per-frame AI attack step that targets the panel directly in front of the attacker; on the first tick it
  starts a wind-up, and once the timer expires it resolves the forward hit.
interface: 'ai_attackStepChooseFrontPanel(r5 = BattleObject*, r7 = AIAttackVars*) -> r1 (chosen panel X), r5 (result
  panel data)

  // clobbers r0 r2 r3 lr nzcv; preserves r4 r5 r6 r7

  '
details: "Called each frame as part of the AI attack state machine (r5 = attacking battle object, r7 = per-attack\
  \ AI variable block).\nFirst entry (oAIAttackVars_AttackElement == 0):\n  sets AttackElement to 1, clears oAIAttackVars_PanelChooseCallback,\n\
  \  seeds oAIAttackVars_StepTimer from oAIAttackVars_AttackBoost2,\n  sets oBattleObject_CurAnim to 1 (wind-up\
  \ animation).\nEach subsequent tick decrements StepTimer; while it is still positive the function returns unchanged.\n\
  When the timer reaches zero:\n  queries object_getFrontDirection for the attacker's facing,\n  reads oBattleObject_PanelX\
  \ / oBattleObject_PanelY,\n  calls GetAllianceDependentPanelParamArgs with a static param table (byte_8112E24,\
  \ 16 bytes) to obtain alliance-specific direction offsets,\n  calls object_getFirstPanelInDirectionFiltered to\
  \ locate the nearest valid panel ahead,\n  calls sub_80E3CF2 (generic attack-resolution handler) passing the filtered\
  \ panel result, oAIAttackVars_ScratchVar, the constant 0x0C0000 (panel size flag), AttackBoost2, the panel object,\
  \ and two buffer pointers (ai_vars+0x16 and 0x4C+panel).\nStores the callback result into oAIAttackVars_PanelChooseCallback\
  \ and advances oAIAttackVars_HitElement to 4 (active-hit sub-state).\nr4, r6, r7 are saved/restored around the\
  \ helper calls to preserve caller state.\n"
