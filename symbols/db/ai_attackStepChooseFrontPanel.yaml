name: ai_attackStepChooseFrontPanel
address: '0x08112DC0'
kind: function
status: probable
summary: 'AI attack step: on first call initializes state (AttackElement=1, CurAnim=1) and copies AttackBoost2
  into StepTimer; ticks StepTimer each frame until it reaches 0, then resolves the first filtered panel
  in the attacker''s facing direction and stores the sub_80E3CF2 result into PanelChooseCallback, finally
  setting HitElement=4.'
interface: (r5 = battle object, r7 = AIAttackVars state block; entry r0 unused) -> r0 = attack/callback
  id stored into oAIAttackVars_PanelChooseCallback; no meaningful flags
details: 'On first invocation (AttackElement == 0) it initializes the step: AttackElement = 1, PanelChooseCallback
  = 0, StepTimer = AttackBoost2, and sets the object''s current animation to 1 (likely a step/charge pose).
  Each subsequent frame it decrements StepTimer and returns until it reaches 0. It then reads the front
  direction via object_getFrontDirection and looks up an alliance-dependent panel parameter entry (byte_8112E24,
  param 0x20) for the object''s PanelX/PanelY, passing them to object_getFirstPanelInDirectionFiltered
  to find the target panel. It calls sub_80E3CF2 with r2 = ScratchVar, r3 = 0xC0000, r4 = AttackBoost2
  (as a byte), r6 = AIAttackVars+0x16 and r7 = object+0x4C, storing the result as PanelChooseCallback.
  Finally it sets HitElement = 4, so later steps attack with that element on the chosen panel.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Init branch guarded by ldrb [r7,#oAIAttackVars_AttackElement]; cmp #0 sets AttackElement=1,
    StepTimer=AttackBoost2, anim 1 (loc_8112DD8 block); ldrh StepTimer / sub #1 / bgt locret: pure per-frame
    countdown before acting; bl object_getFrontDirection then GetAllianceDependentPanelParamArgs(table
    byte_8112E24) feeding object_getFirstPanelInDirectionFiltered: panel selection in facing direction;
    result of sub_80E3CF2 stored to [r7,#oAIAttackVars_PanelChooseCallback]; then strh #4 to HitElement;
    Callees object_getFirstPanelInDirectionFiltered / GetAllianceDependentPanelParamArgs match panel-targeting
    semantics; runs in battlesweep/beastsp AI attack routes'
  refs:
  - bn6f/asm/asm32.s:9915
  - 0x081096FA GetAllianceDependentPanelParamArgs
  - 0x0800E2CA object_getFrontDirection
  - 0x0800D0BC object_getFirstPanelInDirectionFiltered
  reproduce: python3 tools/asmcat.py 0x08112DC0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The flow matches: init AttackElement=1, clear PanelChooseCallback, copy AttackBoost2 into StepTimer,
    set CurAnim=1; then count down; on 0 compute front dir and call object_getFirstPanelInDirectionFiltered
    via GetAllianceDependentPanelParamArgs; finally call sub_80E3CF2 with ScratchVar, 0xC0000, AttackBoost2,
    AIAttackVars+0x16, object+0x4C; then store r0 into PanelChooseCallback and set HitElement=4. The proposal''s
    name ''ai_attackStepChooseFrontPanel'' is acceptable but ''StepTimer'' ending in 0 triggers a choose-panel
    step, so the name fits. Minor: the summary says ''plays for AttackBoost2 frames'' but StepTimer is
    halfword, AttackBoost2 a byte; likely fine. The interface claim that r0 is unused at entry is wrong
    only if AttackElement!=0 branch still uses r0 implicitly via the bgt return — otherwise correct. I''ll
    revise the summary to be more precise.; run wf investigate investigate-20261018-182231; proposed by
    Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
