name: sub_80ED154
address: '0x080ED154'
kind: function
previous_names: []
status: hypothesis
summary: 'AI attack-vars step: spawns a guard/shield or snake-like sub-object (0x2B) on the user''s arm slot, then
  updates the linked child over a duration and tears it down on timeout or movement completion.'
interface: '(r5 = self BattleObject*, r6 = ???, r7 = AIAttackVars*) -> r0 = 0/1 ; side effects: spawns/destroys
  linked 0x2B object, plays SFX 0xC5, mutates AIAttackVars and AIData Unk_68, exits attack state on completion'
details: "- Entry checks AIAttackVars+0x01 (Unk_01). If 0: first-time setup — spawns a type 0x2B object linked to\
  \ self via\n    battle_spawnLinkedObjectType2B_80C97E0 at the arm attachment slot (NameID, Alliance, DirectionFlip\
  \ -> getBattleArmPositionMaybe),\n    sets OBJECT_FLAGS_GUARD and bit 22 (OBJECT_FLAGS_UNK_BIT_22_BIT) via object_setFlag1,\
  \ starts animation 0, calls\n    sub_80101D4, then writes AIAttackVars.Unk_30 = 0, Unk_01 = 4, Unk_10 = 0, returning\
  \ r0 = 0.\n  - On subsequent ticks (Unk_01 != 0): inspects collision. If FlagsFromCollision & 0x2, immediately\
  \ kills the linked\n    child (clears RelatedObject1Ptr, AIData.Unk_68, clears bit 0 via object_clearFlag) and\
  \ jumps to the timeout branch.\n  - Otherwise reads Unk_03 (attack subtype). Branches:\n      * Unk_03 == 3 ->\
  \ sub_802E032(Alliance, 0x580) (some AI/state call) and falls through to tick counter.\n      * Unk_03 != 3 ->\
  \ computes facing panel (PanelX + object_getFrontDirection), computes damage = Damage + AttackBoost.\n       \
  \ If Unk_03 <= 2: spawns type 0x2F object at the panel via sub_80C9CDA and PlaySoundEffect(0xC5). If Unk_03 ==\
  \ 4:\n        spawns type-3 object via battle_SpawnAndInitObjectType3_80C4FFE. Other Unk_03 values fall through.\n\
  \  - Sets Unk_30 = 1 once (one-shot spawn flag at AIAttackVars+0x30).\n  - Always increments Unk_10 (frame counter);\
  \ when it exceeds Unk_0c (duration), it kills the child, clears flags and\n    calls object_exitAttackState.\n\
  \  - Captured r0 returns vary (0, 1, 0x0a, 0x0b, 0x0c, 0x0d...) across the 40 snap calls — these are the post-call\
  \ r0\n    values from this function, suggesting Unk_10 / Unk_0c is being returned in r0 via one of the callees\
  \ (likely\n    object_getFrontDirection or related); flags (Z/N/V) flip per call accordingly.\n  - The table at\
  \ byte_80ED24C = 0x00000002 is read as bit test against collision FlagsFromCollision. The 4-byte\n    word at\
  \ 0x80ED254 (0x51, 0x000000A2) is referenced via `ldr r4, [pc,...]` to the address of the table — this\n    matches\
  \ `FlagsFromCollision & 0x2` (0x2 = \"shield/snake collided\").\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- r7 (AIAttackVars*) and r5 (BattleObject*) are read on entry; Unk_01=0 path calls battle_spawnLinkedObjectType2B_80C97E0
    with the mirrored arm offset. - `mov r7, #0x4c ; add r7, r7, r5` then `bl sub_80101D4` plus storing Unk_30 =
    0, Unk_01 = 4 matches a one-shot init that hands off to sub_80101D4 for the rest of the per-frame work. - `bl
    object_getFrontDirection` then `ldrb r1, [r5,#oBattleObject_PanelX] ; add r0, r0, r1` is the standard facing-panel
    computation in BN AI attacks. - `cmp r4, #2 / blt -> sub_80C9CDA + PlaySoundEffect(0xC5)` and `cmp r4, #4 ->
    battle_SpawnAndInitObjectType3_80C4FFE` show two distinct sub-attacks (snake/projectile type-0x2F vs. type-3
    spawn). - `ldr r1, [r5,#oBattleObject_AIDataPtr] ; str r0, [r1,#oAIData_Unk_68]` matches the standard "clear
    child pointer in AIData" pattern, paired with clearing OBJECT_FLAGS_GUARD via object_clearFlag. - `bl object_exitAttackState`
    at the end is the canonical AI attack finish.'
