name: battle_tryJackIn
address: '0x0803AB46'
kind: function
status: probable
summary: Attempts to move/jack-in a battle object to a target spot; on success sets its pending state
  to 0x20 and plays the move sound, otherwise plays the denied/can't-jack-in buzz.
interface: '(r5 = battle object, r0-r2 = fixed check args 1/0x30/0x10 passed to sub_803BFA0) -> r0 = clobbered;
  side effects: [r5+0x13] = 0x20, sound effect played, object reset via sub_803A85C'
details: Calls sub_803BFA0(1, 0x30, 0x10) as a validity check (result tested with beq after setting the
  eq-style condition? — actually beq branches to the failure path when it returns zero). If the check
  passes, it stores 0x20 into byte 0x13 of the battle object in r5 (a pending action/state field), plays
  sound 0x80 (SOUND_CUR_MOVE_80), then calls sub_803A85C which re-enables the object, clears its pending
  state and forces anim step 4. If the check fails, it plays SOUND_CANT_JACK_IN and returns without touching
  the object. r5 is never set inside, so the caller selects the object; the constant check arguments suggest
  a specific fixed destination or tile probe.
