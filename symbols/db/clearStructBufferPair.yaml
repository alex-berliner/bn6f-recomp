name: clearStructBufferPair
address: '0x0803C26A'
kind: function
status: probable
summary: Zeros two 16-byte fields (at struct+0x130 and struct+0x150) of the structure whose pointer the
  caller left in r5.
interface: (r5 = base pointer of an as-yet-unnamed struct) -> r0/r1 clobbered; both 16-byte fields zero-filled
details: 'The routine takes its target from r5, not from an argument register, so callers must load the
  struct pointer into r5 before calling (a common BN6 idiom for shared ''current object'' pointers). It
  calls ZeroFillByByte twice: first on r5+0x130 (0x4C<<2) for 16 bytes, then on r5+0x150 (0x54<<2) for
  16 bytes, walking the ranges backwards byte-by-byte. Nothing else is touched; no flags are meaningful
  to callers. The two cleared fields are 0x20 bytes apart, suggesting two parallel buffers or arrays of
  the struct. Which subsystem the struct belongs to is not visible from this function alone.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_803C26A+04: ''mov r0,#0x4C; lsl r0,r0,#2; add r0,r0,r5'' selects field at struct+0x130;
    sub_803C26A+0A: ''mov r1,#4; lsl r1,r1,#2'' = 16 bytes passed to ZeroFillByByte; sub_803C26A+12: identical
    pattern with 0x54<<2 = struct+0x150, again 16 bytes; both calls go to known callee ZeroFillByByte
    (0x080008B4), confirming the operation is a zero fill, not a copy; three callers (0x08039A58, 0x0803C558,
    0x08049104) exist but are themselves unnamed, so they only confirm the r5-passing convention indirectly'
  refs:
  - bn6f/asm/asm03_1_1.s:6846
  - 0x08039A58 sub_8039A58
  - 0x0803C558 sub_803C558
  - 0x08049104 sub_8049104
