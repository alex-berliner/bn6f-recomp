name: battle_spawnCollisionForObject_80CB0AE
address: '0x080CB0AE'
kind: function
status: confirmed
summary: Spawns a collision region for a battle object at its panel coordinates and sets the new region's
  timer to 5.
interface: u32 battle_spawnCollisionForObject_80CB0AE(u32 obj /* r5 */); // returns region ptr in r0,
  sets N/Z from r0
details: Reads PanelX, PanelY, Element, and DamageAndStaminaDamageCounterDisabler from the battle object
  at r5. Calls object_spawnCollisionRegion with type 0x4050101, spawn mode 3, r3=0 (extra data), and r5=obj
  as the parent. If a non-null region is returned, writes Timer field (16-bit) to 5 on the new region.
  Flags N/Z reflect whether the spawn succeeded. Preserves r4, r6, r7 across the guest call; r0 is clobbered
  by the callee result.
