name: ai_attackCharge
address: '0x0810DE3C'
kind: function
status: probable
summary: 'Per-frame update for an enemy AI charged attack: arms the element/boost, plays the charge animation,
  then fires and counts down the attack duration.'
interface: (r0 unused; r5 = battle object, r7 = oAIAttackVars) -> r0 clobbered; updates oAIAttackVars
  and object animation state
details: On the first call (AttackElement == 0) it marks the attack started (sets AttackElement = 1),
  combines the object's bytes at +0x7A/+0x7B into a single value in AttackBoost2, passes it to sub_810DFD0
  (likely registering the attack power/effect), switches the object to animation 4 (charge pose) and zeroes
  four ExtraVars fields. Each frame with StepTimer bit 2 clear it calls sub_810DED2 (likely spawning/moving
  the charge effect). When the StepTimer countdown reaches 0 it switches to animation 5 (release), sets
  a 0x10-frame counter via object_setCounterTime, reloads StepTimer from AttackDuration, sets HitElement
  = 4, and clears AttackElement so the cycle can re-arm.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'cmp r0, #0 / bne loc_810DE6A plus strb r0=1,[r7,#oAIAttackVars_AttackElement]: one-shot arming
    block on first run; ldrb from object +0x7A/+0x7B, lsl 4/orr into AttackBoost2, then bl sub_810DFD0:
    builds and applies an attack-power value; mov r0, #4 / strb [r5,#oBattleObject_CurAnim] then anim
    5 with object_setCounterTime(0x10): charge then release animation phases; StepTimer decrement loop
    with reload from AttackDuration and HitElement = 4: timed attack window with a fixed hit property;
    callees object_setCounterTime and the two unknown sub_810DED2/sub_810DFD0 fit an AI attack-state helper'
