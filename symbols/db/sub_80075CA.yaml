name: sub_80075CA
address: '0x080075CA'
kind: function
status: confirmed
summary: Loads a scene's graphics by clearing a tile buffer, queueing the VRAM/palette transfer list, and LZ77-decompressing
  a tile set into VRAM.
interface: void sub_80075CA(void);  // uses lr; clobbers r0 r1 r2 r3 lr and flags nzcvc; preserves r4 r5 r6 r7
details: "Performs the GBA scene-init graphics setup for a specific scene/area:\n  1. Zero-fills the 0x40-byte tile\
  \ scratch buffer at VRAM address 0x6008000 (the\n     original code calls ZeroFillByWord against that destination\
  \ twice in a row,\n     likely an intentional belt-and-braces clear rather than a typo).\n  2. Calls QueueGFXTransfersInList\
  \ with the data list at off_80075F0, which\n     describes three queued VRAM/palette transfers:\n       - dword_86E08F8\
  \ -> palette_3001980 (0x100 bytes)\n       - dword_86E09F8 -> palette_3001960 (0x20 bytes)\n       - dword_86E09F8\
  \ -> byte_3001690    (0x20 bytes)\n     followed by a 0x0 terminator.\n  3. LZ77-decompresses the compressed tile\
  \ set dword_86DDBA0 to VRAM 0x6001460\n    via SWI 0x37 (BIOS LZ77UnCompReadNormalWrite16bit, so each source byte\
  \ becomes\n     a halfword in VRAM).\nNo caller register inputs are read; the function takes no parameters and\
  \ returns\nno value. It does not touch any high-level game struct directly - it is a pure\ngraphics-loader shim\
  \ around the BIOS and three helper utilities.\n"
