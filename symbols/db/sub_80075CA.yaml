open_questions:
- Which scene/area of the game is this the loader for? The destination palette addresses (palette_3001980, palette_3001960)
  and tile destination 0x6001460 would identify it once the palette/scene tables are mapped.
- Why is the 0x40-byte zero-fill at 0x6008000 done twice? Looks deliberate but the second call may be vestigial
  from an earlier version.
- Which palette/screen block (BG/sprite) is 0x6001460 tied to (block 1 + 0x1460 offset suggests a mid-block tile
  region for one of the BG layers).
