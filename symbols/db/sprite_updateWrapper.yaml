summary: Trivial wrapper that invokes sprite_update (per-frame sprite/OAM update) and returns its result.
interface: (args passed through to sprite_update) -> r0 = sprite_update result; flags from sprite_update
details: The function saves lr, calls sprite_update, and returns immediately with pop {pc}, so it is a
  pure pass-through thunk around the sprite update routine. It adds no logic of its own, sets no flags,
  and touches no data; whatever object pointer or sprite struct sprite_update expects is forwarded unmodified.
  With only four instructions there is nothing else to characterize. Its single caller sub_81172D0 is
  itself undocumented, so no context about which object or game state triggers this wrapper is visible.
