summary: Writes 0xFF to byte field +0x11 of a passed-in battle entity/structure, unless the pointer is
  null.
interface: (r0 = entity pointer) -> r0 = unchanged; sets byte [r0+0x11] = 0xFF when r0 != 0
details: 'The function is a tiny null-checked setter: it tests r0 and, if non-null, stores the immediate
  0xFF into the byte at offset 0x11 of the pointed-to structure, then returns; r0 is not modified and
  no flags of consequence are left. Offset 0x11 being a single byte suggests a small per-entity field
  such as a timer, counter, or state byte being set to its max/sentinel value 0xFF. It is called from
  the RapidBuster enemy AI attack routine (which fires up to ~9 shots per cycle), plausibly to mark or
  reset that field when the attack cycle ends or when spawning a shot, and from four other unidentified
  battle-side subroutines. No callees; the adjacent data words (0x1AC, 0x1B5, 0x1A0, 0x1B6 and a pointer
  to byte_80B8BD4) belong to the surrounding code, not to this function.'
