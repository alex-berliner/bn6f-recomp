name: init_eStartScreenAnimationControl200B1A0_2
address: '0x0803E914'
kind: function
status: confirmed
summary: Resets the 8-byte start-screen animation control struct and marks it active.
interface: 'void init_startScreenAnimationControl200B1A0_2(void); // flags out: Z=0,C cleared per movs r0,#1 (NZ
  set from result 1)'
details: 'Loads the address of the 8-byte struct eStartScreenAnimationControl200B1A0 (at 0x200B1A0), passes it to
  ZeroFillByByte with a length of 8 to zero the whole struct, then writes 1 to byte offset 0x3 (0x200B1A3), which
  acts as an enabled/active flag for this start-screen animation controller. Only the flag write sets r0=1 afterwards;
  the zero-filled fields at offsets 0x0-0x2 and 0x4-0x7 are left for other code to populate. Preserves r2 and r4
  across the call; returns with flags as left by "movs r0, #1". Appears to be the second initializer variant for
  this control struct (hence the _2 suffix), likely used to (re)activate it on the start screen.

  '
