name: sub_80A5588
address: '0x080A5588'
kind: function
status: hypothesis
summary: 'Cutscene/overworld per-frame step: bails while a script position lock, chatbox flag 0x80 or sub_809E462
  is active; otherwise runs sub_80A55D4, optionally invokes sub_80A5744 when not gated by EVENT_4EA, EVENT_4EB,
  or the r6+8 byte being 2, and always calls sprite_update on exit.'
interface: 'void Next_sub_80A5588(void);  /* inputs: r5, r6, r10, lr  outputs: r2, r5, r10, r11  clobbers nz/c/v,
  r0, r1, r3, lr; preserves r4-r9, r12 */'
details: "bank 0x68 (sub_80A55D4/sub_80A5744) per-frame dispatcher, likely a \"cutscene step\" or\noverworld controller\
  \ tick. It is stored/thunked via LR only (no local stack frame).\nFive early-out conditions skip the entire body\
  \ (not even sprite_update):\n  - cutscene_checkOriginalCutsceneScriptPos_8036F40  != 0\n  - cutscene_checkOriginalCutsceneScriptPos_8036F58\
  \  != 0\n  - chatbox eFlags2009F38 bit 0x80 set\n  - sub_809E462 returns non-zero\nPast the early-outs it always\
  \ calls sub_80A55D4, then gates the inner call to\nsub_80A5744 behind three more tests (any one bypasses it, but\
  \ still runs sprite_update):\n  - EVENT_4EA set -> skip inner\n  - EVENT_4EB set -> skip inner\n  - byte at r6+8\
  \ == 2 -> skip inner\nsprite_update is unconditional on every non-early-exit path. Reads from a structure\npointed\
  \ to by r6 at offset 8 (compared against literal 2). r10/r5 likely carry a\ncutscene/overworld context across\
  \ the call (callers observed per register contract).\nNo globals are written directly here; all side effects flow\
  \ through callees.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
