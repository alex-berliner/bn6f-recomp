open_questions:
- What structure r6 points to and what "byte at r6+8 == 2" actually represents (a cutscene phase / step state /
  sprite subtype?).
- The semantic difference between the two cutscene_checkOriginalCutsceneScriptPos_* probes 0x8036F40 vs 0x8036F58
  -- they look like a near-duplicate pair (same early-out effect), so one may be a subscript or bank variant.
- Meaning of EVENT_4EA / EVENT_4EB (story/cutscene done flags?).
- Whether sub_80A55D4 is the main per-frame action and sub_80A5744 is a sub-step (e.g. the "transition" once the
  r6+8 state leaves 2) or vice versa.
- Identity of sub_809E462 -- it sits between the chatbox flag check and sub_80A55D4 and is the only non-cutscene
  earlier gate, so it likely is another lockout (e.g. "fade/script-running", "menu open", or similar).
- Why sprite_update runs even when the inner block is skipped -- this pattern looks like "advance cutscene, then
  let sprites tick"; needs confirmation against the caller's frame loop.
