name: reqBBS_setFlag_e17b0f7_8140A00
address: '0x08140A00'
kind: function
status: confirmed
summary: BBS request handler that sets event flag 0x7 in event byte 0x17 (memory address 0x2001F68).
interface: 'void reqBBS_setFlag_e17b0f7_8140A00(void); /* inputs: r10, lr; outputs: r1, r3, c, v, lr; clobbers:
  r0, n, z */'
details: 'Thin wrapper invoked as a "BBS request" sub-handler (note the `reqBBS_` prefix already in

  the symbol). Sets a single event flag by delegating to SetEventFlagFromImmediate, passing

  the flag''s address. The address is computed as the event table base 0x2001C88 plus

  `entry * 0x20 + byte` => 0x2001C88 + (0x17 << 5) + 0x0 = 0x2001F68, which the assembler

  captured as the EVENT_1700 symbol. Bit index 0x7 within that byte is the flag being set.

  Because the body is just `movflag + bl + pop {pc}`, the only architectural state observed

  by callers is the standard r0/r1/r3 return convention plus c/v flags (nz clobbered transitively

  by the call to SetEventFlagFromImmediate). The function itself does not read r10/lr in

  any meaningful way - the listing shows them as inputs only because the lifter counts the

  push/pop of lr and r10 being live across the call site. No global structures beyond the

  event-flag byte at 0x2001F68 are touched.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
