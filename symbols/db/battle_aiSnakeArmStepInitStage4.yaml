name: battle_aiSnakeArmStepInitStage4
address: '0x08112A64'
kind: function
status: probable
summary: SnakeArm AI step handler that sets a version-dependent timer, selects AI script 4, and runs the
  SnakeArm AI tick.
interface: (r4 = AI data object, r6 = AI state object) -> r0 = tick result; sets Timer and ScriptId
details: Reads byte_81129D6[oAIData_Version_16] — a small per-version (Falzar/Gregal) lookup table — and
  stores the byte as the halfword at oAIState_Timer, presumably the delay before the next AI action. It
  writes 4 to oAIState_ScriptId, selecting AI script/stage 4. It then tail-continues into battle_aiSnakeArmTickStep_8112A78,
  which counts the timer down and performs stage checks (0x74/0x7F/0x84 and 0x64/0x7F/0x84) to decide
  whether to schedule attack 0xB. The version table likely encodes different timings or stage selections
  for the two game versions.
