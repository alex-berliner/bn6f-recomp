name: battle_aiSnakeArmStepInitStage4
address: '0x08112A64'
kind: function
status: confirmed
summary: 'Stage-4 initializer for the snake-arm AI: loads a per-version step timer into the AI state and switches
  it to script id 4 before entering the shared tick step.'
interface: Next battle_aiSnakeArmStepInitStage4(u32 r4 aiData, u32 r5, u32 r6 aiState, u32 r7 /* r10, lr also inputs
  */); returns r1, r5 (passthrough from battle_aiSnakeArmTickStep_8112A78)
details: Part of a stage/state machine for a snake-arm style boss AI (likely a DelDeltar/Bass-style multi-part enemy
  attack). r4 points to the AI's data block, whose version byte at offset oAIData_Version_16 selects an entry in
  the byte table byte_81129D6. That table value is stored as a halfword into the AI state struct at r6 + oAIState_Timer
  (the step's duration/countdown), and the state's ScriptId byte (oAIState_ScriptId) is set to 4 to select this
  stage's script. It then tail-calls battle_aiSnakeArmTickStep_8112A78, forwarding r4/r5/r6/r7 and passing the version-table
  pointer in r1; the callee's r1 (the same table pointer) and r5 results are returned to this function's caller,
  so the tick step is expected to preserve/forward r1. Flags are clobbered and unused by callers.
