summary: Sets the calling object's state field (offset +8) to 8 if the object pointer is non-null; otherwise a no-op
  tail return.
interface: void sub_80E1B3C(void *r0_obj, lr); clobbers r1; NZ from tst r0,r0
details: 'Thin "write-the-magic-8" setter guarded by a null check on the object pointer. Stores the immediate 8
  into `[r0 + 8]`, which in BN6 object structs is the typical `state` / sub-state slot used to drive per-object
  state machines. No side effects beyond that single store; uses `pop {pc}` to return, so it is a leaf-style tail
  pop rather than a standard `bx lr`.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
