open_questions:
- What sub_8001040 actually spawns (projectiles, animations, packets?) -- the 3-byte entry shape and 0xB37A constant
  are still opaque.
- What byte_8027388's later entries (beyond the first three readable ones) hold; the ROM area is partially readable
  in the dump.
- Why the flags byte is reloaded after the spawn call (sub_8001040 writing the entry?).
- Whether the owner object is specifically an OO, EOO, or a battle-step entity; the field names (state, script_pos,
  wait_timer) match an OO pattern but the calling site decides.
