name: MakeOWPlayerVisible
address: '0x0809E442'
kind: function
status: confirmed
summary: Sets the visible bit in the overworld player object's flags so the player's sprite is drawn again.
interface: MakeOWPlayerVisible(toolkit in r10) -> flags byte out r0, OBJECT_FLAG_VISIBLE out r1, player object ptr
  out r3; NZ flags set from updated flags byte
details: Reads the game state pointer from the toolkit (r10 + oToolkit_GameStatePtr), then the overworld player
  object pointer from the game state (oGameState_OverworldPlayerObjectPtr). Loads the player object's flags byte
  (offset 0), ORs in OBJECT_FLAG_VISIBLE (0x02), stores it back, and sets NZ flags from the result. r0/r1/r3 are
  outputs despite the caller contract; r2 is untouched. Effectively the inverse of a matching HideOWPlayer-style
  routine — used to re-show the player after cutscenes, warps, or effects that hid them in overworld mode.
