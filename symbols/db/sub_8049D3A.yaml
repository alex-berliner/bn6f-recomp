name: sub_8049D3A
address: '0x08049D3A'
kind: function
status: hypothesis
summary: 'Likely flag setter: writes "enabled = 1" into the byte_2001802 enable flag of a shared word_2001800 subsystem
  block.'
interface: void sub_8049D3A(void); // r1 = 1 on return, r0 = &word_2001800
details: 'Loads the global address of word_2001800 (EWRAM at "0x02001800") into r0, stores an immediate 1 into its
  byte at offset 2 (byte_2001802), then returns with r1 = 1. Effectively a one-shot "set enabled" toggle for whatever
  subsystem owns the "0x2001800" block; the function then restores r0 to point at the block so the caller can immediately
  inspect/use it together with the r1 = 1 return.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
