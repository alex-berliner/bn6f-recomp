name: battle_clearIncompatibleChipSlot_813CEA0
address: '0x0813CEA0'
kind: function
status: confirmed
summary: If the PET Navi's equipped chip has an element level exceeding the Navi's stat-9 threshold, mark
  that chip slot as consumed (0xFF).
interface: void battle_clearIncompatibleChipSlot_813CEA0(void /* R10 = toolkit ptr */); /* returns R2
  = leftover from split9BitsFromBitfield_8021AE0 */
details: 'Reads the Navi''s stat byte 9 (element-level threshold) and the active chip-pack index (stat
  byte 0x2D). Computes the current slot offset as chip_index + 0x2E and reads its value; bails if it is
  already 0xFF. Using the Toolkit struct at R10 (field oToolkit_S_Chip_2002178_Ptr), indexes the chip
  pack''s u16 table (0x3C bytes per pack) at the slot value, then calls split9BitsFromBitfield_8021AE0
  to unpack the 18-bit combined chip-ID into two 9-bit halves, followed by getChip8021DA8 to resolve the
  ChipData record. Compares ChipData[8] (the chip''s element level) against stat 9; if the element level
  is greater, writes 0xFF back to the same PET-Navi stat slot via SetCurPETNaviStatsByte, effectively
  consuming / disabling the chip for this Navi''s next turn. The clobbered R2 on return carries the upper
  9-bit half from the bitfield split and is an artifact of the helper calls rather than an intentional
  output.

  '
