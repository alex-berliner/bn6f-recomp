name: battleObject_isHitByPanelRectangle_8031570
address: '0x08031570'
kind: function
previous_names:
- sub_8031570
status: probable
summary: Tests whether a battle-object cell rectangle intersects a fixed rectangle from a PanelData-like
  struct, returning 1 on hit.
interface: (r0 = panelStructPtr, r2 = rectX, r3 = rectY, r4 = rectW, r5 = rectH) -> r0 = 0|1 ; side effects
  none
details: "Computes r6 = r5 - r4 and r7 = r2 - r3, then r3 = r4*r6 (??) — the assembly as written shows\
  \ `mul r3, r4` (one-operand MUL).\n  Cleaned intent: the four corners of an axis-aligned rectangle (x0=r2,\
  \ y0=r3, w=r4, h=r5) are tested against the cell rect\n  described by `panelStructPtr` (offsets 0..7\
  \ read into r3/r4): r3 = *(r0+0) (e.g. cell x), r4 = *(r0+4) (cell w or x extent).\n  Performs a 2D\
  \ AABB overlap test: `r3*di + r4*dj + r2` is the signed overlap sum, and the function returns 1 if non-negative\n\
  \  (`cmp r5,#0; bge -> mov r0,#1`), else 0. `r1` is unused in this caller snapshot (0x6ab2 is just the\
  \ panel struct's +0xC field).\n  Structure accessed at r0 has two u32 fields at offsets 0x0 and 0x4\
  \ followed by a u32 +0x8 (zero in all snapshots).\n  Caller sub_80311F4 re-runs setup and uses the returned\
  \ boolean to trigger an effect; sub_80319FE/sub_8031BFA consume r0 as a hit flag.\n"
