  detail: '- `ldr r3, [r0]` and `ldr r4, [r0,#4]` read two u32 from the panel struct at r0; the third
    u32 at +0x8 is implicit (zero). - `[r0 @0200f3e0]` dump begins `07 00 00 00 03 00 00 00 00 00 00 00
    07 00 00 00 ff ff ff ff ...`, i.e. w=7, h=3, pad=0 then x=7, y=0xffff, etc. - `mul r3, r6` and `mul
    r4, r7` plus `add r3, r3, r4` / `add r5, r5, r3` build a weighted signed overlap value. - Final `cmp
    r5,#0; bge loc_8031590` then returns 0 (no hit) or 1 (hit); exit flags in snapshots exactly match
