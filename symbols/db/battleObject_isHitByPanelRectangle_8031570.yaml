open_questions:
- What the r0 struct actually represents (PanelData has only u16s at 0x0 and 0x2, not two u32s — could
  be an inline panel rectangle or a per-cell rectangle embedded in a battle object).
- Exact role of `r1` (constant 0x6ab2 in all snapshots — looks like panel-type or alliance byte plus unused
  word).
- Why two separate callers (`sub_80319FE` and `sub_8031BFA`) both call it with the same contract — likely
  a duplicated helper compiled into two callers' object files.
