name: battle_countValidChipSlots_8021CA8
address: '0x08021CA8'
kind: function
status: confirmed
summary: Sums the per-slot chip-count entries from the toolkit table across all 320 eligible chip types,
  skipping locked packs, empty (0xFF) slots, and chips flagged with bit 5.
interface: r10 (toolkit* in, preserved) -> r0 (u32 total chip-slot count), r4-r7 preserved, clobbers r1-r3,
  lr, flags; internally calls getChip8021DA8(idx) -> ChipData*, encryption_testPack_8006e84(idx) -> Z
  set means eligible
details: Iterates chip indices 0..0x13F (NUM_CHIPS=0x140=320). For each chip it fetches the ChipData pointer
  via getChip8021DA8 and checks pack eligibility via encryption_testPack_8006e84 (returns 0 / Z-set when
  the chip pack is accessible). Eligible chips are scanned across 4 slots. A slot is skipped when its
  byte value equals 0xFF (CHIP_EMPTY) or when ChipData.flags (offset 9) has bit 5 (0x20, CHIP_FLAGS_EXCLUDE)
  set—likely marking special/hidden chip packs. For each valid slot the function reads a count byte from
  the toolkit's chip-count table at *(toolkit + oToolkit_Unk2002230_Ptr) + 0xC*chipIdx + slot and adds
  it to the running total (r4). It also accumulates a subtotal for chips whose type byte (offset 7) equals
  2 (r5), but the caller never reads r5 as a meaningful return—it is discarded in the register contract.
  The final grand total is returned in r0. The 0xC stride and 4-slot width suggest each chip entry in
  the table stores per-slot availability counts (e.g. how many copies the player holds or how many are
  unlocked).
