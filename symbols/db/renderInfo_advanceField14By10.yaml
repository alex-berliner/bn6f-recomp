name: renderInfo_advanceField14By10
address: '0x0803C2F0'
kind: function
status: probable
summary: Adds 10 to a halfword counter/offset at +0x14 in the toolkit's render info struct, then returns.
interface: (no args read) -> r0 = new value of field +0x14; no flags used
details: Loads the toolkit pointer from r10 at offset oToolkit_RenderInfoPtr, reads the unsigned halfword
  at +0x14 of the RenderInfo struct, adds 0xA (10), and writes it back; the new value is also left in
  r0. The pushes of r4-r7 are dead — the body touches no registers besides r0/r3, suggesting it was an
  inlined statement in the original code. Field +0x14 is likely a frame counter, scroll position, or animation
  timer that advances by 10 per call. Both callers (0x0803970C, 0x080397BC) sit near each other, implying
  a shared per-frame or per-update step. No callee is invoked and no other memory is touched.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r3,[r10,#oToolkit_RenderInfoPtr]; ldrh r0,[r3,#0x14]; add r0,#0xa; strh r0,[r3,#0x14] —
    sole effect is +=10 on that field; value is returned in r0 after strh, suggesting callers may use
    or ignore the updated count; dead push/pop of r4-r7 with lr indicates a trivial leaf helper, likely
    from inlined source; two callers 0x0803970C/0x080397BC close together in code, consistent with one
    update path calling it per step
  refs:
  - bn6f/asm/asm03_1_1.s:6953
  - 0x0803970C sub_803970C
  - 0x080397BC sub_80397BC
  reproduce: python3 tools/asmcat.py 0x0803C2F0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-033611; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- what field +0x14 of RenderInfo means (animation timer, scroll, palette/tile offset) — need a known reader
  of that field
- what the two callers at 0x0803970C/0x080397BC do and when they run, to name the increment in game terms
- why the increment is 10 and whether callers compare the returned value against a threshold
