name: ai_battlesweepUpdate
address: '0x08111384'
kind: function
status: probable
summary: 'Per-frame think routine for the battlesweep enemy AI: periodically triggers its attack, otherwise
  runs the AI script handler for its current state.'
interface: (r5 = battle object, r6 = AI state, r7 = AI attack vars) -> r0 = passthrough of dispatched
  handler; flags clobbered
details: If the object's byte at +0x69 is set (some condition flag) and the byte at +0x68 (attack cooldown/done
  latch) is clear, it latches +0x68 = 1, reloads the step timer (oAIAttackVars_StepTimer) to 0x78, and
  invokes object_setAttack0 with 9 as the attack id. Otherwise it indexes a table at off_81113B8 with
  oAIState_ScriptId and tail-dispatches to that handler via lr=pc/bx, passing r0 through. The table's
  known entries (ai_beginAnchoredAttack, ai_sweepAttackInit) confirm this is the battlesweep AI's state
  dispatcher; the first entry sub_81113C4 is still unknown.
