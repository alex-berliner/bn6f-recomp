name: battle_applyStateSpriteColorShader_801690A
address: '0x0801690A'
kind: function
status: confirmed
summary: Recolors the current battle object's sprite (normal or inverted/white) depending on a bit of the current
  battle state, if the object opts in via flag 0x4000.
interface: void sub_801690A(void); // reads current object via r5/r10; out r3 = value left by sprite_setColorShader
details: 'Called with the current battle object context in r5/r10 (passed straight through to object_getFlag). First
  reads the object''s flags; if bit 0x4000 is clear the function returns without touching the sprite. Otherwise
  it queries the battle''s current state/phase via battle_getStateUnk40_800A704, masks it down to bit 1 (value 0
  or 2), and uses that as a byte offset into the two-entry halfword table word_8016930 = { 0x0000, 0xFFFF }. The
  selected color (0 = default/normal, 0xFFFF = white/full shade) is applied to the object''s sprite with sprite_setColorShader.
  So objects marked with flag 0x4000 get flashed white whenever the battle state''s second bit is set — likely a
  phase/state-driven tint, e.g. a flash effect tied to a battle mode. The function itself never writes r3; the caller-visible
  r3 is whatever sprite_setColorShader leaves behind. Flags nzcv are clobbered and lr is consumed by the tail call
  structure.

  '
