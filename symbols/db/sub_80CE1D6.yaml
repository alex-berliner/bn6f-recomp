name: sub_80CE1D6
address: '0x080CE1D6'
kind: function
status: confirmed
summary: Restores a battle object's HP (either by its stored Damage or the target's MaxHP) once, plays a sound,
  spawns a recovery effect, then waits out a timer and destroys itself.
interface: 'void sub_80CE1D6(void /* r5 = battleObject* */);

  // uses r5 (self object ptr), reads r5->oBattleObject_CurPhase, ->oBattleObject_Damage,

  //   ->oBattleObject_RelatedObject1Ptr, ->oBattleObject_Timer, ->oBattleObject_MaxHP,

  //   ->+0x34 (3-word effect params).

  // clobbers r0,r1,r2,r3,r4,lr; preserves r5,r6,r7,r10; touches NZCV.

  '
details: "Two-phase state machine on a battle object:\n  Phase 0: one-shot \"heal\" effect.\n    - If self->oBattleObject_Damage\
  \ is 0, the heal amount falls back to target's\n      oBattleObject_MaxHP (where target = self->oBattleObject_RelatedObject1Ptr).\n\
  \    - Pushes {r5}, swaps r5 to the target and calls object_addHP(amount) so the\n      target regains HP; pops\
  \ r5 back to self.\n    - Plays SOUND_UNK_8A.\n    - Reads a 3-word (12-byte) effect-parameter block from target\
  \ + 0x34 and forwards\n      it to spawn_t1_0x0_EffectObject (r4=6). The ldmia r0! afterward is the standard\n\
  \      trampoline that advances the param pointer by 12.\n    - Sets self->oBattleObject_Timer = 0x3C (60 frames),\
  \ advances to phase 4.\n  Phase >=1 (phase 4 here): decrement self->oBattleObject_Timer each tick; when it\n \
  \   reaches 0, write CUR_STATE_DESTROY into\n    oBattleObject_CurStateActionPhaseAndPhaseInitialized to let the\
  \ dispatcher free it.\nSuggests this object is a reusable heal-once helper (e.g., Recover/Unrecovable-style\n\
  item/spell effect object) that gets attached to a target via oBattleObject_RelatedObject1Ptr.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
