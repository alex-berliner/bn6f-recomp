name: ai_getVersionedParamPair
address: '0x080F5B02'
kind: function
status: probable
summary: Returns two AI-version-dependent parameter halfwords for battle-object index r0, packed as (tableB
  << 16) | tableA.
interface: (r0 = battle-object/AI index) -> r0 = low halfword from table byte_80F5B34 entry, high halfword
  from byte_80F5B58 entry; flags clobbered
details: 'The function multiplies r0 by 8 (each entry is 4 halfwords, one per AI version) and calls battle_aiGetVersionedTableEntry
  twice: once on byte_80F5B34 and once on byte_80F5B58, so the returned halfword is selected by the battle
  object''s AI version (with the callee''s special scaling for version 4). The first table entry for this
  object is 60/90/120/120 frames across versions; the second is always 10. The result is combined as r6
  | (value << 16) and returned in r0. The literal pool also holds two sibling tables (30/50/70 and 100/170/240)
  that this copy does not read, suggesting cloned variants nearby pick different rows. Given the battlesweep
  route context and neighbors like ai_pickRandomFilteredPanelInFront, the values most likely feed an AI
  timing/decision parameter, but the exact gameplay meaning is not visible here.'
