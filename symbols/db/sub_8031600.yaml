name: sub_8031600
address: '0x08031600'
kind: function
status: hypothesis
summary: Feeds one 4-byte text command entry into the text printer state block, storing its halfword operand and
  marking the printer idle with 0xFE end bytes.
interface: 'void textPrinter_QueueEndCommand(u32* cmd) /* r0: pointer to the current text command entry; no return
  value, no flag contract */'
details: 'Reads the text printer state block pointer from dword_2011A20. Copies the halfword at [r0] (the command''s
  operand) into the state block''s current-character slot at offset +4 (word_2011A24), then advances the printer''s
  read pointer at offset +0 (dword_2011A20 target) by 4 to skip past this command entry. Finally writes 0xFE to
  the two trailing state bytes at +6 and +7 (byte_2011A26, byte_2011A27), which the verified C comments describe
  as the printer''s idle/end marker. Given the 0xFE marker, this is most plausibly a text-engine control-code handler
  (e.g. an end-of-text or wait command) executed by the chatbox/text printer loop, but the exact command opcode
  it serves is not confirmed from this function alone.

  '
