name: game_runModeHandlersAndFrameTick
address: '0x08138348'
kind: function
status: probable
summary: 'Top-level frame driver: runs the current game-mode handler selected by a state byte (once, or
  16 times when a flag byte is set), early-exits on a state value of 4, then ticks entities, battle sprites
  and the overworld pipeline once.'
interface: (r5 = game-state struct base, read-only here) -> r0 clobbered; runs mode handler table[[r5+1]]
  up to r7 iterations (1 normally, 0x10 if byte[r5+9]!=0, aborting if byte[r5]==4), then calls entity_runAllUpdateHandlers,
  battle_updateEStructSprites, ow_perFrameUpdateAndRender; returns void
details: 'r5 is a global state struct: offset +1 selects one of four handler routines from off_813837C
  (sub_813838C, sub_81383C4, sub_81383F4, sub_8138700) and offset +9 acts as a repeat/speed multiplier
  of 16 for that handler, while offset +0 == 4 breaks the repeat loop early. Each iteration calls the
  handler with lr=pc/bx (Thumb→Thumb). After the loop, regardless of how many iterations ran, the standard
  per-frame pipeline runs exactly once: all 15 entity update handlers, the eStruct sprite/anim/palette
  pass, and the full overworld update+render. The 16x repeat suggests the mode handler is a sub-tick (e.g.
  dialogue/transition stepping) that can run multiple times per rendered frame.'
