name: ai_negateExtraVars
address: '0x08115668'
kind: function
status: confirmed
summary: Negates a battle object's ExtraVars word (AI state value), but only when a row-shift destination check
  says it is still needed, then re-runs that check for the caller.
interface: void ai_negateExtraVars(r5 battleObject*) -> r0,r1 from battle_checkRowShiftDestination; r4-r6 passed
  through from the helper; clobbers r2,r3,flags,lr
details: "Entry point for an AI routine that flips the sign of the battle object's\nExtraVars field (oBattleObject_ExtraVars\
  \ at [r5]). Flow:\n1. Calls battle_checkRowShiftDestination (sub_811567E) with r5 = the\n   battle object; its\
  \ r0 result gates the work.\n2. If the check returns nonzero, the function does nothing and returns\n   the helper's\
  \ r0/r1 (and pass-through r4-r6) directly.\n3. If the check returns zero, it loads ExtraVars, negates it\n   (r0\
  \ = 0 - ExtraVars), stores it back, then calls the same check a\n   second time so the caller sees the post-negation\
  \ state in r0/r1.\nThe function itself never touches r4-r6; those values (including the\npossibly-updated r5 object\
  \ pointer) come straight out of the helper call\nand are forwarded to the caller. Flags are clobbered by the cmp/bl\
  \ chain.\nExtraVars appears to be a signed scratch/state word used by AI logic;\nnegating it is presumably how\
  \ an AI effect reverses some direction or\npolarity stored in that word.\n"
