name: ai_negateExtraVars
address: '0x08115668'
kind: function
status: probable
summary: Boss AI helper that, on a failed check, flips the sign of the battle object's ExtraVars field
  (e.g. toggling a direction/offset for the next attack).
interface: (r0 = battle object, r5 = battle object) -> r0 clobbered by calls; no meaningful return
details: Calls sub_811567E and returns immediately if it yields nonzero (a success/probability check,
  given the pattern of an immediate retake). Otherwise it loads the signed 32-bit value at oBattleObject_ExtraVars,
  stores its negation back into the same field, and calls sub_811567E a second time whose result is discarded
  — suggesting that callee has side effects (e.g. consuming/advancing a random or timer state). The sole
  visible effect is sign-flipping ExtraVars, consistent with toggling left/right or mirror positioning
  between boss actions. r0 is passed unchanged into the first callee call.
