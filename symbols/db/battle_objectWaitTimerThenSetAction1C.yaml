name: battle_objectWaitTimerThenSetAction1C
address: '0x080BEC40'
kind: function
status: probable
summary: Battle-object update handler that counts frames in the object's Timer and, once the halfword
  count overflows into negative, switches the object to action 0x1C with phase 0.
interface: (r5 = battle object) -> void; writes oBattleObject_Timer, oBattleObject_PhaseInitialized, oBattleObject_CurAction,
  oBattleObject_CurPhaseAndPhaseInitialized
details: On first invocation (PhaseInitialized == 0) it zeroes the 16-bit Timer and stores 4 to PhaseInitialized,
  the usual one-shot init pattern. Every call it increments the halfword Timer in place. Because the follow-up
  compare is signed (cmp r0,#0 / ble), the branch fires only when the counter has climbed past 0x7FFF
  (about 32768 frames, ~9 minutes) or if something else forced Timer non-positive; at that point it writes
  CurAction = 0x1C and clears CurPhaseAndPhaseInitialized so the object's action handler table is re-entered
  at the new action. The .word byte_80BEC38 after the body looks like the next entry of a handler/data
  table, not data this routine dereferences.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'init block: ldrb PhaseInitialized / strh 0 to Timer / strb 4 to PhaseInitialized — standard
    first-run object-handler prologue; ldrh Timer; add #1; strh — plain per-frame frame counter; cmp r0,#0;
    ble locret — signed check, so it triggers only on wrap to 0x8000 or an externally preset negative
    Timer; on trigger: mov 0x1C -> CurAction and 0 -> CurPhaseAndPhaseInitialized, handing control to
    another action; trailing .word byte_80BEC38 at off_80BEC64 is table data following the handler, untouched
    by the code'
