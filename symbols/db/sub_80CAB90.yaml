name: sub_80CAB90
address: '0x080CAB90'
kind: function
status: confirmed
summary: Per-frame state-machine step for a battle object; tears the object down when the battle is over, otherwise
  dispatches its current action to an action handler.
interface: void battle_objectStepStateFrame_80CAB90(BattleObject* obj /* r5 */, void* ctx /* r10 */); destroys obj
  (sets CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY) if the battle is over; r5/r8-r12 and flags are
  clobbered on return per the caller contract
details: 'Runs one update tick for a battle object passed in r5. First calls battle_isBattleOver; if the battle
  has ended, it writes CUR_STATE_DESTROY into obj->CurStateActionPhaseAndPhaseInitialized (a packed state/phase/phase-initialized
  field), which makes the object destroy itself. If the battle is still running, it loads obj->RelatedObject1Ptr
  and checks that object''s CurAction: actions 0xA and 0xB are terminal (e.g. custom/victory/defeat style end-of-battle
  actions) and the update is skipped. It then calls battle_isTimeStop and skips the update while the battle clock
  is frozen. Otherwise it reads this object''s own CurAction and uses it as an index into the two-entry handler
  table off_80CABC8 (action 0 -> sub_80CABD0, action 1 -> sub_80CAC00), calling the handler via bl with lr manually
  set to the following instruction so the handler can return through the pop {pc}. The handler is invoked with r0
  = action id and r1 = table entry (quirk of the original code); it inherits r5 (the object) and r10 (caller context).
  This looks like a generic wrapper object whose whole behavior is defined by the two action handlers, likely an
  enemy/chip-spawned entity controller.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
