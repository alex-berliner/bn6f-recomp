  reproduce: python3 tools/asmcat.py 0x08115CF8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Structure and name match: AttackElement 0→decrement ChargeCycles→set AttackElement=1, then StepTimer
