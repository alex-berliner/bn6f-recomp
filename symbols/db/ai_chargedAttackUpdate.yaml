name: ai_chargedAttackUpdate
address: '0x08115CF8'
kind: function
status: probable
summary: 'Per-frame enemy charged-attack handler: countdown ChargeCycles, telegraph front panel every
  4 frames via highlightPanelIfSomeCondition, then fire with CurAnim=2, SFX 0x10a, HitElement=4, and reset
  AttackElement.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = 0; updates AttackElement/ChargeCycles/StepTimer/HitElement,
  object anim, counter time, panel highlight, sound
details: 'Phase 0: decrements ChargeCycles each frame; when it reaches 0 sets AttackElement=1 (attack
  phase). Phase 1: decrements StepTimer; while nonzero, every 4 frames highlights the panel one tile in
  front of the object via highlightPanelIfSomeCondition (base = PanelX+frontDir, PanelY, sideSign from
  Alliance^DirectionFlip). When StepTimer hits 0, calls object_setCounterTime(0x10), sets CurAnim=2, runs
  the two strike helpers sub_8115D76/sub_8115DA4, plays SFX 0x0a, stores HitElement=4, and resets AttackElement=0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ChargeCycles countdown then AttackElement=1 matches a charge-up phase before acting; StepTimer
    countdown with &4 gating plus highlightPanelIfSomeCondition telegraphs the target panel during the
    attack; On expiry: object_setCounterTime(0x10), CurAnim=2, SFX 0x0a, HitElement=4, AttackElement=0
    — the attack fires and the state resets; object_getFrontDirection result added to PanelX shows the
    target is the tile in front, side-corrected via Alliance^DirectionFlip'
  refs:
  - bn6f/asm/asm32.s:15400
  - 0x080005CC PlaySoundEffect
  - 0x08109660 highlightPanelIfSomeCondition_8109660
