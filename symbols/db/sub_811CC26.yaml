summary: Sets bit 1 (0x02) on the status byte pointed to by r5 and calls the sub_811CC60 helper with argument 2,
  then returns 1.
interface: int sub_811CC26(void *statusByte /* r5 */); // returns 1 always, r1 and flags clobbered
details: Reads the byte at [r5], ORs in 0x02 (bit 1, likely an "active"/"processed" marker), and stores it back.
  It then invokes sub_811CC60 with r0 = 2, which presumably propagates the same state value (2) to some shared subsystem
  — possibly registering/enabling a handler, spawning an effect, or advancing a state machine tied to this object.
  Always returns 1 to its caller, so callers likely use the return value as a success/completion flag. Touches only
  the single status byte at r5 and the helper; no other memory is written.
