name: object_startFrontLunge
address: '0x080DB04C'
kind: function
status: probable
summary: Sets a battle object's X velocity toward its facing front and computes a frame timer for how
  long the dash lasts to reach the row edge.
interface: (r5 = battle object; no args) -> r0 = timer frames stored to oBattleObject_Timer; sets oBattleObject_XVelocity
details: 'Reads object_getFrontDirection (+1/-1 by alliance/flip), multiplies it by the object''s ExtraVars
  field (a speed set by the caller) and stores that as oBattleObject_XVelocity. It then picks a target
  column: 7 if Alliance is 0 (player side, moving toward the enemy edge) else 0, takes the absolute distance
  from the object''s PanelX, scales it by 40 (fixed-point subpixels/panel), and divides by ExtraVars via
  SWI 6 (Div) to get the number of frames the movement should run, which is stored into the object''s
  Timer. ExtraVars is consumed as a speed divisor, so the caller must set it before calling.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection then mul r0,r1 with ExtraVars stored to oBattleObject_XVelocity
    shows a directional velocity set; target = (Alliance==0 ? 7 : 0) minus PanelX, abs, mirrors dash toward
    opposite row edge; svc 6 is GBA BIOS Div; result strh into oBattleObject_Timer = duration frames =
    distance*40/ExtraVars; callee''s known summary (facing multiplier by alliance/DirectionFlip) matches
    the velocity sign logic'
