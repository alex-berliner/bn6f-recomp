name: battle_isObjectInSpecialAiState_80159A2
address: '0x080159A2'
kind: function
status: confirmed
summary: Returns whether a battle object's AI data has one of two special-state flags set (0x100 in the +0x48 flag
  word or 0x40 in the +0x44 flag word).
interface: u32 battle_isObjectInSpecialAiState_80159A2(BattleObject* object); // r0 = object pointer (NULL allowed);
  returns 1/0 in r0; c and v always clear on return, n/z reflect the result; r5 and r7 preserved
details: 'Predicate over a battle object''s AI-data structure. Saves r5/r7, keeps the object pointer in r0, and
  tests it against zero (the branch reads the flags left by the MOVS r5, r0 move). If the pointer is NULL the function
  returns 0 immediately. Otherwise it sets r5 = object pointer and r7 = 1 (the calling convention the AI-data helpers
  expect) and calls GetAIDataUnk0x48Flag, which yields a flag word from the AI data (field at AI+0x48 per the helper''s
  name). If bit 0x100 is set the function returns 1. If not, it calls GetAIData_Unk_44_Flag (flag word at AI+0x44)
  and returns 1 if bit 0x40 is set, else 0. So the answer is "yes" if EITHER flag is present. The tail MOVS/ADDS
  r0, r7, #0 means carry and overflow are always 0 on return and n/z come from the boolean result — the caller-visible
  flag contract is real, not incidental. The exact meaning of the two flag bits is unknown; they look like AI condition/state
  markers (e.g. a special behavior or disabled-AI state) checked by callers before acting on the object.

  '
