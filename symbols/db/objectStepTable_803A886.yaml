name: objectStepTable_803A886
address: '0x0803A886'
kind: function
status: confirmed
summary: Ticks a per-object countdown/step counter and advances through a table of {flags, duration} pairs
  at off_803A910, clearing both fields when the table ends.
interface: void sub_803A886(u8* stepIndexField /* r0 offset from r5 */, u8* countdownField /* r1 offset
  from r5 */, void* object /* r5 */);
details: 'Object base is passed in r5. r0/r1 are byte offsets relative to r5 selecting two fields in an
  object struct: a step index and a countdown timer. Step 0 is a no-op (sequence not started). Otherwise
  the countdown is decremented; when it underflows from 0 to 0xFF or expires from 1 to 0, the step index
  is incremented and the next entry is loaded from a table at off_803A910 indexed by the new step value,
  each entry being 8 bytes (a u32 control flag, then a u32 whose low byte is the new countdown). If the
  control word is zero, both fields are cleared (sequence finished). Each tick is one call; the caller
  is expected to invoke this per frame from an object update routine. The 0xFF special case handles the
  explicit "delay 0" sentinel encoded as a duration of 0xFF.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
