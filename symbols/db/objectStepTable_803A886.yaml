open_questions:
- What is the meaning of the first word in each off_803A910 entry when non-zero? It is loaded and tested but never
  stored or returned, so callers cannot observe it through this routine alone.
- Are the durations really bytes, or is only the low byte of the second word ever honored (current code truncates
  with `strb`)?
- Is the index field implicitly bounded (e.g. <= 0x1F) so that the `lsl r6,#3` shift cannot overflow the table pointer?
