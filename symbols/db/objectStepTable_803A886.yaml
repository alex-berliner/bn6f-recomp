name: objectStepTable_803A886
address: '0x0803A886'
kind: function
status: confirmed
summary: Advances an object through a table-driven step sequence, ticking a countdown per step and reloading the
  next duration from off_803A910 (8 bytes per entry) until the table terminates.
interface: void objectStepTable_803A886(u8 stepIndexField, u8 countdownField, void* obj); // r0 = offset of step-index
  byte, r1 = offset of countdown byte, r5 = object base // returns nothing; clobbers nz,c,v,r2,r3,r6
details: 'Reads an 8-bit step index at (r5+r0); if it is 0 the function returns immediately

  (no active sequence). Otherwise it decrements the 8-bit countdown at (r5+r1) and,

  using the original `sub r2,#1` + `bgt` semantics (which only treats the post-store

  values 0xFF and 0 as "non-positive"), advances the step when the countdown has

  expired. On advance, the new index is stored back, then a (newIndex * 8)-byte

  slot at A_off_803A910 is read: if its first word is 0 the sequence is finished

  and both index+countdown are cleared to 0, otherwise the slot''s second word is

  stored as the new countdown (truncated to a byte). Each table entry is therefore

  8 bytes: a control word (non-zero = more steps, 0 = end) and a per-step duration

  byte. No flags are documented as required by callers, so the routine is safe to

  call with any flag state. r5 (the object pointer) is not preserved; this is

  consistent with all known callers passing it as a scratch base.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
