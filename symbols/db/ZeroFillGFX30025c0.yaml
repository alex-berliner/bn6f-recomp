name: ZeroFillGFX30025c0
address: '0x0800183C'
kind: function
status: confirmed
summary: Zero-fills the 0x2000-byte BG tile ID block buffer held by the toolkit, resetting the background tilemap
  layer's tile data.
interface: void bg_ClearBGTileIdBlocks_ADDRESS(tools_t *r10 /* toolkit */, ... /* r2, r3 passed through untouched
  */); returns r1 = 0x2000 and flags from the inner memset.
details: 'Reads the toolkit pointer from r10 and loads its oToolkit_iBGTileIdBlocks_Ptr field,

  which points to the BG tile ID block buffer used by the background renderer. It then

  calls ZeroFillByEightWords with that address and a length of 0x2000 bytes, clearing

  the entire tile ID block area. r2 and r3 are untouched pass-throughs (callers rely on

  this), r1 ends as 0x2000, and the flags are whatever the callee left behind. The

  0x2000 length matches the size of one full BG screen of tile ID entries.

  '
