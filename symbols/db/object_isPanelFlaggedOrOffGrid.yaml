name: object_isPanelFlaggedOrOffGrid
address: '0x080D650C'
kind: function
status: probable
summary: Returns 1 if the battle object's panel has flag 0x10010 set or is outside the 6x3 grid; otherwise
  returns 0.
interface: (r0 unused, r5 = battle object) -> r0 = 1 if the object's panel matches mask 0x10010 or is
  off-grid, else 0
details: Reads the object's pixel X/Y from r5 (oBattleObject_X/Y), converts them to 1-based panel column/row
  via convertXYToPanelXY_800E258, then calls object_checkPanelParameters with the fixed masks in the literal
  pool (set-mask 0x10010, clear-mask 0). If the panel matches, that nonzero result is returned directly.
  If not, object_isValidPanel is called; an in-grid panel yields 0 and an out-of-grid panel yields 1,
  so the function reports 'panel unusable or nonexistent'. The masks are hardcoded in the pool at dword_80D653C/80D6540,
  not passed by the caller.
