  date: '2026-10-18'
  detail: convertXYToPanelXY_800E258 call on oBattleObject_X/Y gives panel col/row; object_checkPanelParameters
    called with pool masks dword_80D653C=0x10010, dword_80D6540=0; bne locret returns the match result
    directly when the panel flags match; fallthrough calls object_isValidPanel; invalid -> r0=1, valid
    -> r0=0
