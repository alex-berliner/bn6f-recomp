name: sub_812B318
address: '0x0812B318'
kind: function
status: hypothesis
summary: Walks the table at "unk_20251A0", calling sub_811A768 to deallocate unlocked entries until the per-entity
  counter at "[entity_base+0x1C]" reaches the threshold for the current level in "byte_812B394".
interface: 'u32 sub_812B318(u32 slot_count /* r0 */, void *entity_base /* r5 */); -> { r0: ok_flag (1=all-ok, 0=an
  entry was freed), r1: null_count, r2: locked_count, r3: passthrough from sub_811A768 }'
details: "Increments the 8-bit counter at \"entity_base+0x1C\" by 1 once on entry. Iterates i from 1 to slot_count,\
  \ indexing the dealloc table at \"unk_20251A0\" by \"(i-1)<<2\". For each 32-bit slot:\n  - 0               ->\
  \ \"null_count++\"\n  - bit 31 set       -> \"locked_count++\"\n  - bit 31 clear    -> calls \"sub_811A768(-0x10,\
  \ slot & 0x7FFFFFFF)\"; on r0==0 it zeroes the table entry and clears the success flag.\nLoop terminates early\
  \ when the per-level bound \"byte_812B394[i]\" (s8-ish threshold, signed cmp) becomes >= the byte at \"[entity_base+0x1C]\"\
  . Threshold table (8 bytes): 0, 3, 6, 9, 12, -1 (0xFF), 0, 0 - looks like 5 progressively longer work budgets\
  \ followed by a stop marker.\nThe \"ok\" return (r0=1) means \"no slot was freed this call\"; r0=0 means at least\
  \ one entry was actually deallocated. r1/r2 summarise table state; r3 is whatever sub_811A768 last left in r3.\n"
