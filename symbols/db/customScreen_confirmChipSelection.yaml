name: customScreen_confirmChipSelection
address: '0x0802750C'
kind: function
status: probable
summary: 'Chip-select screen handler that commits the current selection: increments the chip counter,
  decrements the chips-still-selectable byte for active-chip slot 8, marks entry+7 with 0 (more picks
  remain) or 2 (selection complete), advances state to 4/0, plays the confirm sound, and starts the exit
  sequence.'
interface: (r0-r3 = unused; r5 = custom screen state struct) -> r0 = clobbered; sets screen state fields
  and plays a sound
details: 'Increments the counter at [r5,#0x30] (likely chips selected so far), then fetches the special
  active-chip entry 8 via getLocOfActiveChips(8). It decrements the byte at entry+4 (chips still selectable
  this turn) and stores 0 into entry+7 if chips remain, or 2 if the count hit zero (selection finished).
  It then advances the screen state machine: [r5,#1] = 4 and [r5,#2] = 0 (state 4, substate 0), plays
  sound 0x182 (0x83 + 0xFF) as the confirm cue, and unconditionally calls customScreen_ExitSequence_8028E32
  to close out the Custom screen.'
