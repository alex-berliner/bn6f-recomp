name: battle_checkPanelBehindObject
address: '0x08108CBA'
kind: function
status: probable
summary: Checks whether the panel one tile behind a battle object's facing matches the required panel-flag
  mask.
interface: (r0 = battle object ptr, r2 = required-flag mask, r3 = forbidden-flag mask) -> r0 = 1 if panel
  matches, else 0
details: Calls object_getFrontDirection on the object, negates it to point away from the enemy side, and
  adds the object's x/y coordinates stored at struct offsets 0x12 and 0x13 to get the tile coordinates
  of the panel behind the object. It then calls object_checkPanelParameters(x, y, r2, r3), passing through
  the caller's required/forbidden panel-flag masks (r2/r3 are preserved via push/pop across the calls).
  Returns the 1/0 result of that check. Because the direction is negated, this tests the object's rear
  tile rather than its front tile.
