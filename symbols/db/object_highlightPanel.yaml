name: object_highlightPanel
address: '0x0800CBD8'
kind: function
status: confirmed
summary: Marks the panel an object stands on as highlighted by setting the panel data flag byte at offset 1 to 1.
interface: 'void object_highlightPanel(u32 object /*r0*/, u32 attr /*r1*/); // out: r0 = panel data offset (or validity
  result), r1 = 1 on success; NZ/C/V per path'
details: 'Battle-object helper. First calls object_isValidPanel(r0, r1); if the panel is invalid

  (returns zero / EQ), the routine simply returns with the original r0/r1 restored

  (they were pushed to the stack around the validity call and popped back).

  On success it calls object_getPanelDataOffset(r0, r1) to obtain the address of the

  panel data entry for the object''s panel, then writes 1 to the byte at offset 1

  (oPanelData_Unk_01), presumably a "highlighted/flagged" state used by panel

  highlighting effects (e.g. cursor/area markers or attack previews). It also leaves

  r1 = 1 and NZ flags set from the stored value. No other registers are preserved

  beyond what the calls themselves preserve.

  '
