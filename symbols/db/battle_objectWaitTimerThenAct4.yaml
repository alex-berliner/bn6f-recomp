name: battle_objectWaitTimerThenAct4
address: '0x080D6874'
kind: function
status: probable
summary: Battle object state handler that decrements oBattleObject_Timer each frame, returning while it
  is >= 0, then sets CurAnim=1, CurAction=4, and clears the phase field once it expires.
interface: (r5 = battle object) -> r0 = clobbered; flags from the timer subtract
details: Runs per-frame for a battle object whose pointer is in r5. It decrements the 16-bit oBattleObject_Timer
  field and, using the flags from the subtraction, returns each frame while the timer is still non-negative.
  Once the timer counts past zero (bge fails), it writes oBattleObject_CurAnim = 1, oBattleObject_CurAction
  = 4, and clears oBattleObject_CurPhaseAndPhaseInitialized to 0, restarting the object's state machine
  at action 4 with its animation reset. It touches only the object's Timer, CurAnim, CurAction and phase
  fields and preserves no result; it is a leaf state-handler function.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh/strh on oBattleObject_Timer with sub #1 and bge shows a frame-countdown wait loop; after
    expiry, strb #1 to oBattleObject_CurAnim and strb #4 to oBattleObject_CurAction select the next state;
    strh #0 to oBattleObject_CurPhaseAndPhaseInitialized resets the phase marker when the wait ends; no
    other memory or registers touched and pop {pc} return confirms a per-object tick handler'
  refs:
  - bn6f/asm/asm31.s:67411
  reproduce: python3 tools/asmcat.py 0x080D6874
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the described behavior: it decrements oBattleObject_Timer, returns while non-negative,
    then on expiry sets CurAnim=1, CurAction=4, and clears CurPhaseAndPhaseInitialized. However, the proposal''s
    interface states ''r0 = clobbered; flags from the timer subtract'', which is misleading — r0 is set
    to 1, 4, 0 in the post-timer block but is not used as a return value (pop {pc} is a tail return).
    Also ''returns each frame while the timer is still non-negative'' is wrong: it returns while timer
    >= 0, meaning it continues running even when timer equals 0; it only switches action when timer goes
    negative (bge fails).; run wf investigate investigate-20261019-052112; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- which objects use this handler and what CurAction 4 means in their state machines
- what sets oBattleObject_Timer before this state is entered (its duration source)
