name: rfu_setMscCallbackArg
address: '0x081463D0'
kind: function
status: probable
summary: Stores a caller-supplied value into the wireless-link work struct and registers the MSC callback
  that will receive it.
interface: (r0 = arg stored in eStruct200FE00+0x44, passed on to the MSC callback) -> r0 = destroyed;
  no return value
details: Saves r0 to offset 0x44 of the RFU link work buffer eStruct200FE00, then calls rfu_setMSCCallback
  with sub_8145D54+1 (thumb pointer), so that callback presumably reads the stored word at +0x44 when
  invoked. It is a one-line configuration helper called from rfu_initWirelessSession during wireless session
  setup, likely passing a context/ID the MSC callback dispatches on. Nothing else is touched; r0 is clobbered
  by the call.
