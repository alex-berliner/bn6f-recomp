name: ai_attackDispatchHitElementStep_81120E4
address: '0x081120E4'
kind: function
status: confirmed
summary: Tail-styles a jump table dispatch in the AI attack state machine, picking the follow-up handler
  by which element the attack connected with.
interface: void ai_attackDispatchHitElementStep(u32 r5 /*AI state*/, u32 r7 /*attack vars*/, u32 r10 /*AI
  state*/); // r0 in = element byte reloaded by callee; r1, r5, r8-r12 out = whatever the dispatched handler
  leaves; clobbers flags and r0-r7,lr
details: 'Tiny trampoline in the battle AI attack flow. It reads the oAIAttackVars_HitElement byte from
  the attack variable block at r7 and uses it unscaled as an index into the three-word table at off_81120F8:
  entry 0 is ai_attackChargeLineStep, entry 1 is ai_falzarAttackSpawnStep (Falzar-specific follow-up),
  entry 2 is genericAI_exitAttackStateAfterDelay_81097BA (cleanly end the attack state after a delay).
  It then tail-calls the selected Thumb handler via "mov lr, pc; bx r1", so the handler''s register results
  (r1, r5, r8-r12) flow straight through to the caller. The element byte is also re-passed in r0 as the
  handler''s argument, and the table entry stays live in r1. HitElement is presumably zero for non-element
  hits, which makes the plain charge-line step the default path.

  '
