name: object_updateSpawnBlink
address: '0x080CDBAC'
kind: function
status: probable
summary: Battle-object update step that blinks the object (toggles its invisible flag every 2 frames)
  for 8 frames on spawn, then advances to the next action.
interface: (r0 = battle object ptr (also in r5), called as object update thunk) -> r0 = clobbered; updates
  oBattleObject_Timer, oObjectHeader_Flags bit1, CurPhase/CurAction
details: 'Runs as a per-frame update with the object pointer in r5 (standard object-update ABI). On the
  first invocation (CurPhase == 0) it initializes: sets CurPhase = 1, clears the object''s collision region
  via object_clearCollisionRegion (so it can''t be hit/interacted while materializing), and loads Timer
  = 8. Each frame it computes (Timer >> 1) & 1 and writes that (as 0 or 2) into bit 1 of oObjectHeader_Flags,
  toggling the object''s invisible/off flag every other frame pair — a 4-cycle flash over 8 frames. Timer
  counts down each frame; when it reaches 0 it sets CurAction = 2 and clears CurPhaseAndPhaseInitialized,
  handing control to the state machine''s next action.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb [r5,#oBattleObject_CurPhase]; beq init block that sets phase=1, Timer=8 (first-run init);
    bl object_clearCollisionRegion during init — removes the object from collision while it spawns; (Timer>>1)&1
    *2 orred into oObjectHeader_Flags with bic — alternating toggle of bit1 every 2 frames = blink; Timer==0
    fallthrough sets CurAction=2 and zeroes CurPhaseAndPhaseInitialized — advance to next action
  refs:
  - bn6f/asm/asm31.s:47806
  - 0x0801A074 object_clearCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080CDBAC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-030611'
open_questions:
- No callers known, so which entity uses this blink-spawn step (enemy appearance, custom-drawn object,
  etc.) is unconfirmed
- Exact meaning of oObjectHeader_Flags bit1 (invisible vs. no-collision vs. off) not verified from data
