name: GetRNG
address: '0x0800151C'
kind: function
status: confirmed
summary: Advances the global primary RNG seed and returns the new 32-bit value.
interface: (void) -> u32 nextSeed; preserves r7; returns r0 = new seed (r1/r2/r3 also hold the XOR constant, seed<<1,
  seed>>31); nz from final EOR, c/v from the "+1" add
details: 'Reads the 32-bit word at ePrimaryRngSeed, computes the next state as ((seed << 1) + (seed >> 31) + 1)
  ^ 0x873CA9E5 — a multiply-by-2 (with the old top bit wrapped in as a carry) plus 1, then an XOR to decorrelate
  — and stores the result back into ePrimaryRngSeed. r7 is only used as the seed pointer behind its push/pop, so
  it is preserved. Callers get the new seed in r0; r1 still holds 0x873CA9E5, r2 the doubled seed, r3 the old top
  bit (all incidental leftovers, but part of the observed contract). Flags are set as side effects: n/z reflect
  the XOR result, c/v reflect the "+1" add only. This is the game''s main random-source stepper; whatever random
  number a caller wants must be derived from the returned seed afterwards.

  '
