  lingering, invulnerability, etc.) is unconfirmed
- Exact meaning of AI-data bits 0x6800 (Unk_0x48) and 0xC008600 (Unk_0x44) and battle flag 0x4
- What sub_801E0D0(0) does at timer expiry
