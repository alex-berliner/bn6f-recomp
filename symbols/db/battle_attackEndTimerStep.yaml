name: battle_attackEndTimerStep
address: '0x0802DC66'
kind: function
status: probable
summary: Per-frame step that gives an attacking battle object a 4-frame lingering window (with collision
  region 1 set on entry), then clears its AI condition flags and exits the attack state.
interface: (r0 = unused at entry; r7 = battle object) -> r0 = result of object_exitAttackState; decrements
  object timer, clears AI/battle flags when it expires
details: On first invocation (state byte at [r7,#1] == 0) it stores collision region 1 into the object's
  collision data, loads the halfword at [r7,#0x10] with 4, and sets the state byte to 4 so this init branch
  runs only once. Each frame after that it decrements the halfword at [r7,#0x10]; while it is still positive
  the function returns without doing anything else. When the countdown reaches 0, it calls sub_801E0D0
  with r0=0, clears AI-data Unk_0x48 bits selected by mask 0x6800 and Unk_0x44 bits selected by mask 0xC008600,
  clears battle-state flag bit 0x4 via battle_clearFlags, and finally calls object_exitAttackState. The
  two large bit masks suggest several AI state/condition bits being released at once when the attack window
  ends. The unused literal pool words (0x4000, 0x1800, 0x8600, pointers to eBattleNaviStats2034A60) hint
  the same file uses related flag masks for other steps.
evidence:
