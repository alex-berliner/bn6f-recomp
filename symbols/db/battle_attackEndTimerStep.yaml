    r0,[r7,#1]'' =4 only when state byte is 0; countdown: ''ldrh r0,[r7,#0x10]; sub r0,#1; strh r0,[r7,#0x10];
    bgt locret'' gates all teardown work; teardown calls ClearAIDataUnk0x48Flag with mask 0x6800 and ClearAIData_Unk_44_Flag
    with mask 0xC008600; ''bl battle_clearFlags'' with r0=4 and ''bl object_exitAttackState'' run only
