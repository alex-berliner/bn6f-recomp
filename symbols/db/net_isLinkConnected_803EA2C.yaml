name: net_isLinkConnected_803EA2C
address: '0x0803EA2C'
kind: function
status: confirmed
summary: Returns 1 when the link-connection state byte has reached 0xC (connection fully established), else 0.
interface: bool net_isLinkConnected_ADDRESS(void); // r0 = 1 if eLinkState == 0xC, else 0; c/v set by CMP, nz reflects
  the comparison
details: Reads the byte at eLinkState (the link/socket state machine's current state) and tests it against 0xC,
  which evidently marks the "connected" state of the link state machine. Returns 1 in r0 only in that state, 0 otherwise.
  The comment in the verified C mistakenly references eCameraEnd, but the literal pool word at off_803EA3C points
  at eLinkState, so the comparison target is eLinkState. Flags are left as the final CMP leaves them (nz valid,
  c/v from the CMP); callers per the contract read back r0 and the c/v flags. No other memory or registers are touched;
  lr is saved and restored via push/pop {lr}/{pc}.
