name: sub_811B20C
address: '0x0811B20C'
kind: function
status: confirmed
summary: Initialises the sprite of a GUI object - loads the resource for its kind, picks the animation, and applies
  standard palette/priority/slot settings.
interface: void setupGuiObjectSprite(struct GuiObject *obj /* r5 */); also receives r4, r6, r7 (preserved) and lr;
  returns nothing of its own, leaving r0-r3 and flags as the last callee left them
details: 'Takes an object structure in r5. Marks the object state 0x23 (byte at +0), then reads the object''s kind
  byte at +4, shifts it left by 2 and indexes off_811B278 to pick one of two sprite resource pointers (unk_2020484
  for kind 0, unk_202458C otherwise) and passes it with gfxId 9 to initGuiSprite_8002770. Animation selection re-reads
  the kind byte: 0 if kind is 0; otherwise 2 if byte_203778C (field 0xC of unk_2037780) is set, else 1 - so a flag
  in the 0x2037780 work area switches the non-zero-kind animation variant. Then applies the standard GUI sprite
  setup: load animation data, no shadow, palette 0, priority 2, slot-list value 0x130, sub-entry palette bank 2,
  sub-record field A 5, and calls sub_811B298 (unclear, sprite-related). Finally sets obj->field08 = 4, obj->field0C
  = 0, and kicks off one animation update via sprite_objectUpdateAnimation_811B284. Note the kind byte is re-read
  after the sprite init call rather than reused, matching the original exactly.

  '
