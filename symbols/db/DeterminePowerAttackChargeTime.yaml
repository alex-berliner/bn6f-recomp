name: DeterminePowerAttackChargeTime
address: '0x08012F62'
kind: function
status: confirmed
summary: Computes the charge-frame duration of a navi's B/A power attack from the battle object's AI data, picking
  the A-side length and falling back to a Beast-Out length when the navi is transformed with an elementless chip.
interface: 'u32 determinePowerAttackChargeTime(u32 selector, u32 battleObject /* in r5 */); /* r0 in: B-button selector
  vs. A button; r0 out: charge frames (or 0xFF when no AI entry), r1 out: index into powerAttackChargeTimes table,
  r4 preserved, NZCV trashed */'
details: 'Resolves the AIData field for the power-attack charge time. When r0 != JOYPAD_B the routine takes the
  A-power-attack field (offset 5 in AIData) and, only if the navi is in a Beast/Gregar/Falzar Beast Over transformation
  (TF_GREGARBEAST..TF_FALZARBEASTOVER) AND the chip currently in the battle hand has element CHIP_ELEM_NONE, swaps
  to the Beast-Out A-power-attack field (offset 9). When r0 == JOYPAD_B it uses the B-power-attack field (offset
  7) directly. The hand-chip check via getCurChipInBattleHand_8010004 is effectively dead because that helper does
  not set the control codes the test expects; the comment notes it never succeeds.

  Reads from the AIData struct (r4 = battleObject->oBattleObject_AIDataPtr): the selected power-attack stat byte.
  Reads two navi-stats bytes (transformation, then charge level index 3) via GetBattleNaviStatsByte_AllianceFromBattleObject
  with r5 as the battle object. Indexes into powerAttackChargeTimes_8020404 with row = chargeLevel*2 and column
  = pwrAtkStat*10, returning the halfword there. If pwrAtkStat == 0xFF, returns 0xFF as the maximum charge sentinel
  and leaves r1 == 0xFF.

  Quirks: r1 (charge-table index or 0xFF) and r2 (powerAttackChargeTimes base address on the table load path, undefined
  on the 0xFF early return) are part of the caller-visible contract. The beast-out branch''s hand-chip existence
  check is unreachable in practice.

  '
