name: eventFlags_ClearRangeAt2C8_802F0F4
address: '0x0802F0F4'
kind: function
status: confirmed
summary: Zeroes a fixed run of 0x16 halfwords in the toolkit's event flag array starting at offset 0x2C8, resetting
  that block of flags.
interface: void sub_802F0F4(void) /* reads toolkit from r10; preserves r2, r3; returns r2 unchanged */
details: Loads the event flags base pointer from the toolkit struct (r10 + oToolkit_EventFlagsPtr), adds offset
  0x2C8, and calls ZeroFillByHalfword with count 0x16 (22 halfwords = 44 bytes total), clearing flags 0x2C8/2 through
  0x2C8/2+0x15 in the flags array. The register contract (r2/r3 preserved and echoed back) suggests it is called
  with values live in those registers that callers expect to survive, even though the routine itself takes no arguments.
  This looks like a bulk "reset" of a specific flag group, e.g. temporary or per-scenario state that must be wiped
  at some game-state transition.
