name: object_spawnDimmingCollisionRegion
address: '0x080C53A6'
kind: function
status: confirmed
summary: Spawn a collision-region object and mark it to keep updating during timestop.
interface: u32 object_spawnDimmingCollisionRegion(u32 r0, u32 r1, u32 r2, u32 r3, u32 r4, u32 r6, u32 r7, lr); //
  returns spawned object pointer in r0 (or NULL)
details: 'Thin wrapper around object_spawnCollisionRegion that forwards the spawn

  arguments in r0-r4, r6, r7 (lr holds the caller''s return address, preserved

  via push/pop). If the collision region is successfully created (r0 != 0),

  it ORs OBJECT_FLAG_UPDATE_DURING_TIMESTOP into the byte at

  oObjectHeader_Flags so the region continues to animate while a timestop

  effect is active. No new object headers are allocated here; the structure

  is the one produced by object_spawnCollisionRegion. The function tail-

  pops the saved lr into pc, leaving r4-r7 preserved and r0 returning the

  spawned object pointer (or NULL). The adjacent dword 0x0C000000 is a data

  constant at 0x80C53BC, not part of this routine.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
