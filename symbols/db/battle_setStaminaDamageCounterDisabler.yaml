name: battle_setStaminaDamageCounterDisabler
address: '0x08110254'
kind: function
status: probable
summary: Sets a battle object's flag by looking up the AI data's version byte in a per-version table.
interface: (r5 = battle object, field oBattleObject_AIDataPtr already set) -> r0 = halfword stored to
  oBattleObject_StaminaDamageCounterDisabler; no flags used
details: 'The function reads oBattleObject_AIDataPtr from r5''s battle object, then loads byte #16 (oAIData_Version_16)
  of that AI data. It uses that byte as an index into byte_810FD20 and stores the resulting byte as a
  halfword into oBattleObject_StaminaDamageCounterDisabler on the battle object. It is a single field-setter
  with no branches, calls, or loops; the trailing data (byte_8110290, byte_8110298, byte_81102BC) belongs
  to neighboring code such as object_planPanelMove, not to this function. What the version byte itself
  means (game version vs. an object subtype/level) is not visible here.'
