name: sprite_updateAtCenter
address: '0x0811E840'
kind: function
status: probable
summary: Per-frame object update that pins the sprite at fixed coordinates (120, 120) and then runs the
  normal sprite update.
interface: (r0 = object/resource pointer) -> r0 = result passed through from sprite_update; no flags of
  note
details: The function unconditionally calls sprite_setCoordinates with x = 0x78 and y = 0x78, then calls
  sprite_update on the same r0 object, which runs _sprite_update on the sprite struct selected by byte
  2's fields. The constant 0x78 (120) in both axes suggests a fixed screen-anchored position rather than
  a world position. It is effectively a specialized wrapper around sprite_update used by objects whose
  sprite must stay at one spot. No other state is touched and no return value is computed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: mov r0/r1 #0x78 then bl sprite_setCoordinates — always sets position to (120,120); asm:
    bl sprite_update immediately after, with no re-fetch of r0 — plain wrapper sequence; caller sub_811E7F8
    invokes it as the only body step, consistent with a per-frame object tick'
  refs:
  - bn6f/asm/asm32.s:33820
  - 0x0811E7F8 sub_811E7F8
  - 0x0800307C sprite_setCoordinates
  - 0x080026C4 sprite_update
  reproduce: python3 tools/asmcat.py 0x0811E840
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-235109'
open_questions:
- what object type uses this caller (need the caller's own caller or spawn site) to say what is anchored
  at (120,120)
- whether 0x78 is a screen-space or object-space coordinate for this sprite system
