summary: Relocates the overworld player object to the given (X, Y, Z), backing the old position up into the object's
  "Next" fields and mirroring the new position into the shared overworld-player state.
interface: void owPlayer_movePlayerToCoordsCopyCurrentToNextMaybe_809e188(u32 x /* r0 */, u32 y /* r1 */, u32 z
  /* r2 */); // reads r7/r10 (r10 = toolkit, r7 preserved); returns r3 = s200ace0 base address; no flags meaningful
details: Looks up the overworld player object via the toolkit's GameState pointer (R10 + oToolkit_GameStatePtr,
  then oGameState_OverworldPlayerObjectPtr). Copies the object's current oOWPlayerObject_X/Y/Z into its oOWPlayerObject_NextX/NextY/NextZ
  fields (so the previous position survives one update, presumably for movement/interpolation logic), then overwrites
  X/Y/Z with the r0/r1/r2 arguments. It tail-calls owPlayer_indirectlySetPlayerCoordsMaybe_809e1a4, which stores
  the same new X/Y/Z into the shared eStruct200ace0 fields oS200ace0_PlayerX/PlayerY/PlayerZ (EWRAM 0x200ACE8/0x200ACEC/0x200ACF0)
  — the "indirect" name likely reflecting that this struct is what the rest of the overworld code reads rather than
  the player object itself. Because of the tail call, r3 is left holding the s200ace0 base on return, and r0-r2
  pass through unchanged. No flags are intentionally set; r7 is push/popped and preserved. Useful as a teleport/warp-style
  "set player position now" primitive, distinct from the normal per-frame position update.
