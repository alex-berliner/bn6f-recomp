name: t3_0x5f_80D0394
address: '0x080D0394'
kind: function
status: confirmed
summary: 'Per-frame state machine for a type-3 battle object: dispatches through a 3-entry jump table (init spawned
  object, update collision/destroy, destroy wrapper) then performs sprite physics update.'
interface: void battleObject_t3StateUpdate(void) — r5 = BattleObject*, modifies r5/r8–r12 through handlers; returns
  with those registers set.
details: Reads the one-byte CurState field at r5+oBattleObject_CurState, indexes a jump table at off_80D03AC (three
  entries), and branches via bx r1 with lr set so the handler returns to the caller. State 0 calls battleObject_initSpawnedObject_80D03B8
  (first-frame setup for a newly spawned tile-3 object); state 1 calls object_updateCollisionAndDestroy (checks
  overlap with hazards/attacks and may remove the object); state 2 calls object_destroyWrapper_80D04D2 (final teardown).
  After whichever handler runs, object_updateSpritePaused is called to advance the object's sprite animation/physics.
  The handlers themselves may reassign r5 (to a different object) or update the r8–r12 scratch registers that the
  battle engine uses for tile coordinates and timing; those modifications propagate back to the caller.
