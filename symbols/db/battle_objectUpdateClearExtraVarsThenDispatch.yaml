name: battle_objectUpdateClearExtraVarsThenDispatch
address: '0x0810A5C2'
kind: function
status: probable
summary: Battle object update wrapper that zeroes the object's 8-byte extra-vars block on phase 0, then
  runs the normal per-frame phase dispatcher.
interface: (r0 = battle object (also r5 = same object) ) -> r0 = whatever battle_objectUpdateDispatchPhase
  returns; flags clobbered by callee
details: Reads oBattleObject_CurPhase; if it is 0 (i.e. the object is on its first phase/first tick),
  it stores 0 into both oBattleObject_ExtraVars and oBattleObject_ExtraVars+4, clearing an 8-byte scratch/state
  area. It then tail-calls battle_objectUpdateDispatchPhase_80165C2, which runs the object's current-phase
  handler from its 2-entry table (or skips while paused). So this is a variant update handler for an object
  type whose per-phase state must start clean each time phase 0 begins. No other fields are touched.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; cmp r0,#0; bne loc_810A5D0 — clear only on phase 0; str
    r0 (=0) into oBattleObject_ExtraVars and +4 — zeroes 8 bytes of per-object state; bl battle_objectUpdateDispatchPhase_80165C2
    then pop {pc} — plain tail dispatch to the phase handler; Same object pointer pattern (r5 = object
    struct) as the dispatcher's documented per-frame update role
