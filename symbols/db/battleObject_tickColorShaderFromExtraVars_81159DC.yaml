open_questions:
- Which BattleObject type uses this (the offset `ExtraVars+4` is the same absolute offset 0x64 for oBattleObject
  and falls in the ExtraVars array for oT1BattleObject/oT3BattleObject/oT4BattleObject alike). Whether
  it is a t1/t3/t4-only callback or generic could be settled by tracing the object whose vtable/curstate
  dispatches it.
- The semantic meaning of shader id 0xF here (e.g., invisibility flash vs. damage-flash) is not visible
  from this function alone.
