name: battle_objectTickExtraVarsThenDispatch_811363C
address: '0x0811363C'
kind: function
status: confirmed
summary: 'Per-frame tick for a battle object (r5): on phase 0 fires its ExtraVars one-shot action and
  rewinds that payload''s timer to 8, then hands the object to the shared phase-update dispatcher.'
interface: void battle_objectTickExtraVarsThenDispatch_811363C(BattleObject* obj /* r5, tail-passed through
  dispatcher */, ... pass-through r2-r4, r6-r9, r11, r12; outputs r1, r5, r8-r12 from dispatcher)
details: 'r5 is a battle object pointer. If oBattleObject_CurPhase (byte at [r5,#oBattleObject_CurPhase])

  is still 0 (setup phase) and oBattleObject_ExtraVars ([r5,#oBattleObject_ExtraVars]) is

  non-null, the ExtraVars payload''s one-shot action sub_80B8A0A is called with that pointer in r0,

  then the dword at ExtraVars+8 is passed to battle_ResetObjectTimerTo8_80C4072, which resets the

  payload''s countdown so it starts ticking from 8 again. This only happens once per object because

  the dispatcher (battle_objectUpdateDispatchPhase_80165C2) presumably advances CurPhase away from 0.

  The function is a thin wrapper: it preserves its incoming register state across the setup step and

  tail-calls the dispatcher, so its visible outputs (r1, r5, r8-r12; r10 passes through unchanged,

  flags and r0/r2-r4/r6/r7 clobbered) are the dispatcher''s. Everything of substance — the phase

  machine behavior and the exact semantics of the ExtraVars action — lives in the callees.

  '
