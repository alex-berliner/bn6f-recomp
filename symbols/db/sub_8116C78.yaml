name: sub_8116C78
address: '0x08116C78'
kind: function
status: confirmed
summary: Advance the per-frame palette animation of a battle sprite when its alliance matches the caller's, then
  apply the resulting sub-palette bank and palette.
interface: 'void sprite_tickMatchPaletteAnim_8116C78(u32 r5 /*sprite_ptr*/, u32 r7 /*related_ptr*/);

  /* r5 preserved on exit; clobbers r0-r3, r6, lr, NZCV */

  '
details: 'Reads alliance ID (byte 4) from both the sprite (r5) and a related object (r7).

  If they are equal the sprite participates in the match animation; otherwise

  default bank 0xD / palette 1 are used.


  When animating, indexes a 4-byte-per-frame table (byte_8116CCC, two entries:

  {bank 0xC, pal 0, nextFrame 1, nextTimer 8} and {bank 0xD, pal 1, nextFrame 0,

  nextTimer 8}) using the sprite''s frame index at byte 0xC.  The per-frame

  countdown at byte 0xD is decremented; on wrap-to-negative the next entry''s

  frame index and timer are loaded.


  Bit 6 of the sprite''s control byte 0 (the "match pending" flag) is always

  cleared before returning.


  Finally calls sprite_setSubEntryPaletteBank_800304A(bank, r5) and

  sprite_setPalette(palette, r5) to push the resolved values into the OAM

  / palette subsystem.

  '
