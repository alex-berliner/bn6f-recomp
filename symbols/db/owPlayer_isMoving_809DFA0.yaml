name: owPlayer_isMoving_809DFA0
address: '0x0809DFA0'
kind: function
status: confirmed
summary: Returns whether the overworld player object is still moving, by comparing its current X/Y/Z coordinates
  against the "next" coordinates it is heading toward.
interface: int owPlayer_isMoving(OWPlayerObject *obj /* r5 */); returns r0 = 1 if any of X vs NextX, Y vs NextY,
  Z vs NextZ differ, r0 = 0 if stationary; r1/r2 hold the last compared (cur,next) pair; C/V reflect the final CMP
  of that pair (callers branch immediately after)
details: 'Operates on the overworld player object passed in r5, reading three coordinate pairs from

  the offsets oOWPlayerObject_X/NextX, oOWPlayerObject_Y/NextY, oOWPlayerObject_Z/NextZ.

  Compares X against NextX first; if they differ it returns immediately with r0=1 and the

  flags from that CMP (the short-circuit means only the axes actually compared set flags).

  Same for Y and Z. Only when all three axes match (cur == next on X, Y and Z) does it set

  r0=0, i.e. the player has arrived at its target tile/position. r1 and r2 are not zeroed —

  they end up holding the last cur/next values compared, which the readable-C model keeps

  faithful so callers that read them (or branch on the final flags) behave identically.

  No other state is touched; lr is the only stack use.

  '
