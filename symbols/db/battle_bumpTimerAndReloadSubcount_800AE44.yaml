name: battle_bumpTimerAndReloadSubcount_800AE44
address: '0x0800AE44'
kind: function
status: confirmed
summary: Increments a battle-state counter byte and reloads an adjacent sub-counter with 10, as part of a timed
  battle sequence.
interface: battle_bumpTimerAndReloadSubcount(void); inputs r10 = toolkit pointer (r10->oToolkit_BattleStatePtr);
  outputs r1 = battle state pointer; clobbers r0, NZCV flags
details: Loads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), then increments the byte
  at oBattleState_Unk_1c (wrapping at 256, since it is a plain byte add). It always stores 0xa into the byte at
  oBattleState_Unk_1d, which looks like a per-tick sub-countdown (10 frames/steps per tick of Unk_1c) used elsewhere
  by battle code. Returns with the battle state pointer still live in r1 so callers can continue using it. No flags
  or other state are tested; the NZCV clobber is just from the adds/movs.
