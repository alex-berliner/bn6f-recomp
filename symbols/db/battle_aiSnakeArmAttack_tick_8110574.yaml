open_questions:
- What `sub_800E360(MaxHP, 0)` actually does (likely "spawn SnakeArm head segment" but it could be a generic
  damage-on-self helper).
- Exact semantics of `highlightPanelIfSomeCondition_8109660`'s `r2` flag (=1) and which direction `(PanelX^DirectionFlip,
  PanelY)` corresponds to (own panel vs. enemy panel).
- Why `Unk_08 > 0x3c` skips panel highlight — possibly because once `ExtraVars != NULL` next time the
  body has spawned, but here the guard already ensures ExtraVars==NULL on this branch, so it likely means
  "after the projectile-spawn frame stop blinking the cursor".
