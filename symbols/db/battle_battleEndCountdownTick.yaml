name: battle_battleEndCountdownTick
address: '0x080088D6'
kind: function
status: probable
summary: Runs a 30-frame countdown that, when it expires, advances the battle-end sequence by setting
  GameState.BattleEndSubState = 7 and flagging the overworld player struct.
interface: (r5 = battle-end state struct) -> void; r0 clobbered, r1 clobbered by callee
details: 'r5 points to a battle-end state struct: byte +3 is a phase flag, halfword +8 a frame timer,
  byte +4 the next phase. On the first call (phase +3 == 0) it initializes the timer to 30 and sets phase
  to 4; every call afterwards decrements the timer. When the timer reaches 0 it writes 7 into byte +4,
  stores 7 into GameState.BattleEndSubState (via oToolkit_GameStatePtr from r10), and calls eStruct200A008_setUnk02(1)
  to set byte 2 of the fixed overworld player struct at 0x200A008 to 1, presumably signalling the return-to-overworld/handoff
  after battle.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on [r5,#3] with init of strh #0x1e,[r5,#8] and strb #4,[r5,#3] shows a first-run timer
    setup (loc before 0x80088E6); ldrh/sub/strh on [r5,#8] with bgt is a per-frame countdown; on expiry
    strb #7,[r5,#4] and strb r0,[GameState,#oGameState_BattleEndSubState] advance the battle-end state
    to 7; mov r0,#1; bl eStruct200A008_setUnk02 sets byte 2 of the 0x200A008 overworld player struct,
    whose known summary matches'
  refs:
  - bn6f/asm/asm00_1.s:12232
