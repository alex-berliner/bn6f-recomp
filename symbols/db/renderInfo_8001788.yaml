name: renderInfo_8001788
address: '0x08001788'
kind: function
status: confirmed
summary: Zeros the per-frame sprite/render counters in the toolkit's RenderInfo block so each frame's render-list
  build starts from a clean state.
interface: void renderInfo_clearEntryCounts_8001788(void); // r10 = toolkit pointer, no return value
details: 'Reads the RenderInfo pointer from the toolkit struct at offset +8 (oToolkit_RenderInfoPtr) using r10 as
  the toolkit base, then stores 0 into eight consecutive halfword fields of the RenderInfo struct: offsets 0x0C,
  0x0E, 0x10, 0x12, 0x14, 0x16, 0x18 and 0x1A (oRenderInfo_Unk_0c..oRenderInfo_Unk_1a). These look like the counts
  / write cursors used when assembling the sprite (OAM-style) render list for a frame; clearing them resets the
  list to empty for the next build. Note the assembly writes 0x1A before 0x18 (the C mirrors this), which has no
  observable effect since both are set to 0. Flags NZ are clobbered by the mov r0, r10 but nothing depends on them.
  Callers pass only r10 and lr.

  '
