name: battle_objectWaitPhase
address: '0x080D2750'
kind: function
status: probable
summary: Battle-object phase handler that waits a table-driven number of frames, then advances the object
  to CurAction 8.
interface: (r5 = battle object ptr) -> none; on expiry sets oBattleObject_CurAction = 8 and clears oBattleObject_PhaseInitialized
details: On first invocation (oBattleObject_PhaseInitialized == 0) it marks the phase initialized with
  state 4, reads oBattleObject_Param1 as an index into the 4-byte table dword_80D277C {0x12,0x12,0x18,0x18},
  and stores the fetched byte into oBattleObject_Timer as the wait length. On subsequent invocations it
  decrements the Timer; once it reaches zero it sets oBattleObject_CurAction = 8 (move to the next action)
  and clears PhaseInitialized so the phase can restart. No other structures or globals are touched; r0-r1
  only.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80D2750 init: ldrb r0,[r5,#Param1]; ldr r1,off_80D2778; ldrb r0,[r1,r0]; strh r0,[r5,#Timer]
    — Param1 selects wait length from dword_80D277C; sub_80D2750 loop: ldrh r0,[r5,#Timer]; sub r0,#1;
    strh r0,...; bgt return — frame countdown; sub_80D2750 expiry: mov r0,#8; strb r0,[r5,#CurAction]
    and PhaseInitialized=0 — signal next action on timeout; dword_80D277C = 0x12121818 — four possible
    wait durations (18 or 24 frames)'
  refs:
  - bn6f/asm/asm31.s:58500
  reproduce: python3 tools/asmcat.py 0x080D2750
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
