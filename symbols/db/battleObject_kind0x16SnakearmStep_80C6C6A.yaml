name: battleObject_kind0x16SnakearmStep_80C6C6A
address: '0x080C6C6A'
kind: function
previous_names:
- sub_80C6C6A
status: probable
summary: Per-frame step handler for battle-object kind 0x16 (snake-arm); counts down a timer, then spawns
  a kind-0x16 child segment one panel ahead (or via sub_80C6D1E when Param1 is 0xC/0xD/0xE), animates,
  and parks it off-screen with collision cleared on the last frame.
interface: (r5 = battle object ptr) -> r0 = 0, r1 preserved, r5 preserved ; writes to the object at r5
  and to spawned children
details: "- On entry r5 holds the kind-0x16 battle object whose state machine this routine drives.\n \
  \ - First-time-only flag: ldrb r0,[r5,#oBattleObject_CurPhase]; if zero, writes 1 to CurPhase to skip\
  \ the initialiser on later ticks (push {r4,r6,lr}; mov r0,#1; strb r0,[r5,#oBattleObject_CurPhase]).\n\
  \  - Decrements the 16-bit Timer (oBattleObject_Timer = +0x20) every frame; only when it hits zero does\
  \ it actually spawn something (bne loc_80C6CA6).\n  - Spawn location decision: compares Param1 against\
  \ 0xC..0xE. For 0xC/0xD/0xE the helper sub_80C6D1E owns the layout; otherwise it adds object_getFrontDirection()\
  \ to PanelX and reuses the object's own PanelY (bl object_getFrontDirection; ldrb r1,[r5,#oBattleObject_PanelX];\
  \ add r0,r0,r1; ldrb r1,[r5,#oBattleObject_PanelY]).\n  - The child is built by battle_spawnBasicObjectKind0x16_80C6CE4\
  \ with r3=0, r4=Params (from +0x4), r6=DamageAndStaminaDamageCounterDisabler (+0x2c) — so the snake\
  \ segment inherits the parent's params and damage word.\n  - After spawning, sets CurAction to 4 (mov\
  \ r0,#4; strb r0,[r5,#oBattleObject_CurAction]) — likely the \"moving/spawning\" phase of the snake-arm\
  \ animation.\n  - Always calls sprite_getFrameParameters; if bit 0x80 of the returned sprite flag is\
  \ set, snaps X16 to 0xF0 (off-screen / hidden panel column) and runs object_clearCollisionRegion to\
  \ unhook it from collision regions.\n  - Pushes only {r4,r6,lr}, pops the same plus pc in thumb_func_end,\
  \ so the function is \"void\"-style with respect to callers.\n"
