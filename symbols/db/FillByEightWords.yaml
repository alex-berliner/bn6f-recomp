- No call sites were analyzed here, so whether callers always pass multiples of 32 bytes (8 words) or the name just
  reflects one common usage is unconfirmed.
- Whether the length is ever allowed to be non-word-aligned in practice (the shift silently truncates) is not verified
  from callers.
