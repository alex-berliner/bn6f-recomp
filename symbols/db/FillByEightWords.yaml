name: FillByEightWords
address: '0x080009AC'
kind: function
status: confirmed
summary: BIOS-assisted memory fill — writes one 32-bit word repeatedly to a destination via SWI CpuFastSet in fixed-source
  (fill) mode, preserving r0-r3 for the caller.
interface: void mem_FillWordsFastSet(u32* dest /*r0*/, u32 byteLength /*r1*/, u32 fillWord /*r2*/); // r3 passed
  through untouched; flags and lr clobbered; r0-r3 preserved on return
details: 'Thin wrapper around the BIOS call SWI_CpuFastSet used as a memset-style fill. The caller

  gives the destination address in r0, a length in bytes in r1, and the fill word in r2.

  Since CpuFastSet takes its source by pointer rather than by value, the routine pushes the

  fill word onto the (guest) stack with `sub sp,#4; str r2,[sp]` and passes sp as the source

  pointer, then restores sp afterwards. The length is converted from bytes to words with

  `lsr r1,#2` and OR''d with the fixed-source mode flag 0x1000000, so r2 passed to the BIOS is

  0x1000000 | (length/4); length must therefore be a multiple of 4 (CpuFastSet rounds/truncates

  in word units anyway). The final call is SWI_CpuFastSet(src=sp, dst=r0, mode=0x1000000|len/4).

  All four argument registers r0-r3 (plus a saved copy of the caller''s r3) are pushed at entry

  and popped at exit, so the helper is completely non-destructive to the ARM calling registers

  apart from lr and the NZCV flags; r3 is never used by the routine itself and is only carried

  through to satisfy the ABI save set. No game state, structures, or memory-mapped registers are

  touched directly — it is a pure utility wrapper over the BIOS. The label name''s "eight words"

  presumably reflects typical call sites filling 8-word (32-byte) blocks, but the routine itself

  takes an arbitrary word count.

  '
