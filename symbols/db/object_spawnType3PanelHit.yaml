name: object_spawnType3PanelHit
address: '0x080C6018'
kind: function
status: probable
summary: Spawns a type-3 battle attack object (panel-area hit) and fills its panel, element, damage, related-object
  and alliance fields from the caller's arguments/parent object.
interface: (r0 = spawn kind for object_spawnType3 (0xA), r1 = panelX, r2 = panelY, r3 = element, plus
  parent ptr/damage in higher regs) -> r0 = spawned object pointer or 0 on failure
details: 'The routine saves its incoming arguments (and scratch registers) on the stack, calls object_spawnType3
  with the fixed argument 0xA, and on success copies the caller-supplied values into the new battle object:
  oBattleObject_PanelX, oBattleObject_PanelY, oBattleObject_Element, oBattleObject_RelatedObject1Ptr (parent
  object pointer), the oBattleObject_DamageAndStaminaDamageCounterDisabler word, and oBattleObject_Alliance
  taken from the parent object. On spawn failure it returns immediately without touching the fields. The
  byte table after the function (pairs of 0x17/0x04-0x06 headers with 0xC/0x21 payload words) looks like
  related attack-descriptor data for the callers that use this helper. Its only known caller, sub_80C5D84,
  uses it while destroying a battle object to spawn a sword-flavor (Param1==1) or wind-flavor (Param1==2)
  panel-area hit built from the dying object''s panel/element/damage fields. The printed disassembly is
  misaligned after the bl (pop/beq/register use is inconsistent), so exact argument order beyond panelX/panelY/element
  is reconstructed from field stores rather than the raw bytes.'
