name: battle_sweepUpdateMotion
address: '0x080C1320'
kind: function
status: probable
summary: 'Per-frame panel-row sweep: while a 0x61 frame counter is below the 0x65 limit, advance oBattleObject_X
  by oBattleObject_XVelocity and call sub_80C14B2 + object_setPanelsFromCoordinates; when the limit is reached,
  decrement a count at 0x63, toggle flag at 0x64, negate oBattleObject_YVelocity, snap oBattleObject_X to the screen
  coordinate from object_getCoordinatesForPanels(PanelX,PanelY), reset 0x61, and set CurAction=4/CurPhase=0 (gated
  by sub_80C1492/sub_80C1466/sub_80C14EC).'
interface: (r5 = battle object pointer) -> void; r0-r3 scratch
details: Runs on a battle object in r5. Three guard checks (sub_80C1492, sub_80C1466, sub_80C14EC) must all pass,
  otherwise nothing happens. It increments a frame counter at offset 0x61; while below the limit at 0x65 it adds
  oBattleObject_XVelocity to oBattleObject_X, calls sub_80C14B2, and recomputes PanelX/PanelY via object_setPanelsFromCoordinates.
  When the counter reaches the limit it decrements a counter at 0x63, toggles a flag at 0x64, negates oBattleObject_YVelocity,
  snaps oBattleObject_X back to the panel-column screen coordinate from object_getCoordinatesForPanels(PanelX, PanelY),
  zeroes the counter, and sets CurAction=4 with CurPhase=0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r5,#0x61] incremented each call and compared to limit [r5,#0x65]; X += XVelocity while below; on
    limit: toggle bit of [r5,#0x64], neg oBattleObject_YVelocity — a direction reversal; object_getCoordinatesForPanels(PanelX,PanelY)
    result stored to oBattleObject_X snaps X to the panel column; ends by writing oBattleObject_CurAction=4 and
    oBattleObject_CurPhase=0, i.e. entering/looping the sweep action; three early-out tests via sub_80C1492/sub_80C1466/sub_80C14EC
    gate the whole update'
  refs:
  - bn6f/asm/asm31.s:20097
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x0800E2AC object_setPanelsFromCoordinates
  - 0x080C1466 sub_80C1466
  reproduce: python3 tools/asmcat.py 0x080C1320
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The summary
    mostly matches the code: the three guard checks, the counter at 0x61 advanced and compared against 0x65, X advanced
    by XVelocity, sub_80C14B2 and object_setPanelsFromCoordinates called, then on hitting the limit the 0x63 counter
    is decremented, 0x64 flag XORed with 1, YVelocity negated, X snapped via object_getCoordinatesForPanels, 0x61
    zeroed, CurAction=4/CurPhase=0. However the name is misleading: it mentions ''horizontal sweep'' but only X
    velocity is used in the per-frame update; YVelocity negation and panel-X snap (panelX is x-column, not ''panel-column
    snap back'') suggest this is a vertical/panel-bound movement. Also the route tag is ''battlesweep''. The summary
    also says ''Y velocity'' but the code negates oBattleObject_YVelocity (which may be the Y/z velocity field)
    – the ''snap back to panel column'' wording is imprecise since PanelX is the column itself, not a screen coord.;
    run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
