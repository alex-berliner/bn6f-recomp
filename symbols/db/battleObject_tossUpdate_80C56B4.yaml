summary: Throws a battle object in an arc from (Param3,Param4) to (r5+0x34 target) over Param2 frames,
  then spawns a hit effect and self-destructs; if the landing panel is solid, snaps to a collision-stuck
  idle instead.
interface: '(r5 = self) -> void ; side effects: mutates self''s X/Y/Z/XVelocity/YVelocity/ZVelocity/Timer/PhaseInitialized/CurAction/CurPhaseAndPhaseInitialized/CurStateActionPhaseAndPhaseInitialized
  and Flags; may spawn an effect battle object'
details: "1. On first entry (PhaseInitialized == 0) reads the target coords (r5+0x34 = oBattleObject_Coords.X/Y/Z)\
  \ and calls\n   object_getCoordinatesForPanels(Param3,Param4) to get source 16.16 pixel coords (r5 points\
  \ there).\n2. Calls math_getThrowSpeeds with the source/target 16.16 coords (Z component forced to 0),\
  \ storing the\n   returned XVelocity/YVelocity/ZVelocity into the object's velocity fields, copies Param2\
  \ into\n   oBattleObject_Timer, and sets PhaseInitialized=4 (one-shot init latch).\n3. Each frame decrements\
  \ oBattleObject_Timer; while > 0 it integrates X/Y/Z += Velocity, applies a\n   constant downward Z\
  \ acceleration of 0xffffa000 (≈ -0.6 in 16.16), then calls\n   object_setPanelsFromCoordinates and object_updateCollisionPanels.\
  \ Every 8 ticks (Timer & 7 == 0\n   after the >>3 BCC test), it re-highlights the source panel via object_highlightPanel(Param3,Param4).\n\
  4. When the timer hits 0 (or wraps negative via sub #1, bge on unsigned-equivalent), it force-aligns\n\
  \   the object to its panels (Z cleared to 0) and calls object_isCurrentPanelSolid.\n5. If the landing\
  \ panel is NOT solid: spawns a type-1 effect object (spawn_t1_0x0_EffectObject) at\n   r5+0x34 with\
  \ r4=0x14, and transitions the object to CUR_STATE_DESTROY.\n6. If the landing panel IS solid: re-initializes\
  \ (Timer=1, Timer2=1), clears the OBJECT_FLAG_VISIBLE\n   bit in oObjectHeader_Flags, sets collision\
  \ region=1, CurAction=4, CurPhaseAndPhaseInitialized=0\n   (idle/stuck state), and bails out.\nOut register\
  \ set lists r0..r7 in `out` but the function ends with `pop {r4,r6,r7,pc}`, so the caller\nobserves\
  \ only NZCV plus the registers r4/r6/r7 it passed in (caller-saved r0/r1/r2/r3/r5 are clobbered\nby\
  \ the helper calls).\n"
