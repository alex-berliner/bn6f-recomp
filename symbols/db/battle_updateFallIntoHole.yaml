name: battle_updateFallIntoHole
address: '0x080C138E'
kind: function
status: probable
summary: 'Per-frame update for a battle object being pulled down (into a hole/sinking panel): applies
  Y velocity on a countdown, then flags its related object and destroys it.'
interface: (r5 = battle object ptr) -> r0 destroyed; flags from tst checks
details: Gates on three condition helpers (sub_80C1492/1466/14EC), returning without effect if any fails.
  While a countdown byte at offset 0x61 is nonzero it is decremented and the object's Y is advanced by
  its oBattleObject_YVelocity, followed by object_setPanelsFromCoordinates and object_updateCollisionPanels
  so panel/collision data track the falling position. When the countdown reaches 0, if a state byte at
  offset 0x60 equals 3 it writes 1 to RelatedObject1Ptr+0x7C — apparently signaling the counterpart object
  that this one finished. Finally it calls sub_80C1514 with the byte at offset 0x64 and sets the object
  state to CUR_STATE_DESTROY, removing the object from battle.
