name: sub_802CE60
address: '0x0802CE60'
kind: function
status: hypothesis
summary: Looks up one 16-byte entry from a battle table, scrambling the index with the current battle's shuffle
  key so the returned entry is shuffled but deterministic per battle.
interface: battle_getShuffledTableEntry(u32 index /* r0 */) -> entryHalfword0 /* r0 */, entryWord4 /* r1 */, entryHalfword2
  /* r2 */; uses r10 = toolkit
details: 'Reads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), then reads the shuffle
  key byte at oBattleState_Unk_0d. The caller''s index in r0 is XORed with that key, multiplied by 0x10, and added
  to the table base unk_2036720 (IWRAM), selecting a 16-byte record. Loads three fields from the record and returns
  them in registers: halfword at +0 in r0, halfword at +2 in r2, and the full word at +4 in r1. Because the XOR
  key lives in the battle state, the same index maps to different entries in different battles, but stays consistent
  within one battle; callers can therefore reference shuffled content by stable index. Note the unusual return packing
  (r1 holds the +4 word, r2 the middle halfword).'
