  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Most of the summary is correct (timer decrement, X/Z integration, panel recompute, ground touch
    at 0, sound 0xC3, camera shake 3/30, spawn dimming AoE, panel state change, spawn kind 0xA with extra=3
    and var 0x11E00, CurPhase=8, clear flag 0x2). However, the masking condition is inverted: code branches
    to the big-impact path when (panel & 0x0F800010)==0 (no-match/normal panel), and takes the small-effect
    spawn path when the mask matches. Also the spawn is described as ExtraVars=3 but the code passes r7=3
    as the 6th arg (ExtraVars goes in r4=0x11E00). The damage call is unclear (the proposal guesses 0x1E00
    fixed-point via extra vars, which fits).; run wf investigate investigate-20261018-223614; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
