name: battle_runAnimHandler
address: '0x08018002'
kind: function
status: probable
summary: Dispatches a battle object's animation/state handler selected by its PreventAnim index, via a
  6-entry jump table.
interface: (r0 = unused; r5 = battle object) -> r0 = whatever the selected handler returns; calls through
  lr=pc into thumb handler
details: Reads the object's PreventAnim byte at r5+oBattleObject_PreventAnim and uses it as an index into
  the table at off_8018014, which holds six thumb handler addresses (sub_801802C, sub_8018076, sub_8018094,
  sub_80180A8, sub_80180EC, nullsub_57). It then performs a manual call by setting lr=pc and doing bx
  r1, so the chosen handler runs as a subroutine and this function returns its result. No bounds check
  is done on the index, so values above 5 would jump through null/garbage. The field is named PreventAnim
  in the project but here it clearly acts as an animation/state selector, and callers set it to 0 immediately
  before the call, selecting the first handler. The three callers share identical patterned code that
  zeroes PreventAnim and jumps to this dispatcher when certain object flags (0xC00, LCDControl) are set.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8018002: ldrb r0,[r5,#oBattleObject_PreventAnim] then ldr r1,[r1,r0] indexes the off_8018014
    table; mov lr, pc / bx r1 is a thumb subroutine call into the selected handler (six targets incl.
    nullsub_57); each caller sets strb r0(=0),[r5,#oBattleObject_PreventAnim] right before bl sub_8018002,
    selecting handler 0; callers reach the call only when object flag tests (0xC00 or LCDControl) pass,
    i.e. as part of per-object update flow; table off_8018014 lists exactly six word entries, all thumb
    handler pointers (+1)'
