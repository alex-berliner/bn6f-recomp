name: sub_803C0F6
address: '0x0803C0F6'
kind: function
status: hypothesis
summary: Copies a chat/text region with an offset and rewrites trailing 0x00/0xE5 two-byte units to 0xE5 0xE5 until
  the previous 0xE6 marker.
interface: void sub_803C0F6(u8 *src, u8 *dest, int count, int offset)
details: 'Copies `count` bytes from (r0 + r5) to (r1 + r5) via CopyBytes, then scans

  the destination starting at (r1 + r5) for the first byte equal to 0xE6

  found at an even index (the loop increments by 2). Once that sentinel is

  found, it walks backwards in two-byte steps and rewrites any unit whose

  lead byte is 0x00 (blank) or 0xE5 (terminator) to the pair 0xE5 0xE5,

  stopping on any other byte value or when the walk underflows past the

  start of the copied region.

  The 0xE6 byte is the chatbox "end of line" / marker in MegaMan Battle

  Network scripts; 0xE5 is the string terminator and 0x00 is a blank pad

  slot, so the routine effectively normalizes trailing padding and partial

  terminators around a 0xE6 control marker after a paste/insert into the

  chat line buffer.

  r5 is treated as an in/out offset and is preserved across the call.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
