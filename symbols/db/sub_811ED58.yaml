name: sub_811ED58
address: '0x0811ED58'
kind: function
status: confirmed
summary: Per-frame tick that advances the PET window's signed animation timer, reloads GFX animation scripts on
  overflow, replays sprite frames, and copies PET/Navi background tiles.
interface: void pet_windowTick(PETWindow *state /* r5 */)
details: state+0x10 is a signed 16-bit timer incremented by 4 each call (16 ticks/frame). When the timer wraps negative,
  the function loads two GFXAnimScript blobs (byte_811EA68, byte_811EAB8) via LoadGFXAnim, zeroes the timer and
  bookkeeping bytes (state+9, state+0xE), sets state+0xD = 2 and state+0 (phase) = 4, initialises a data block (sub_80465A0
  on byte_811EB78), updates PET display (sub_811F1B8), then replays animation sprite frames (replaySpriteFrames_811F24C).
  Regardless of the branch, the common tail runs sub_811F0C8 (PET comm state), petCommSaveInit_811F11C, and CopyBackgroundTiles_PET_811EF70.
  If the timer is still non-negative (i.e. the animation is actively running), CopyBackgroundTiles_onNaviSelect_811F54C
  additionally draws the current Navi's tiles. r5 (state pointer) is modified by most callees, so the function re-reads
  it after the tail. r10 is passed in but only forwarded; r7/r8/r9/r11/r12 are pass-through outputs touched by callees.
