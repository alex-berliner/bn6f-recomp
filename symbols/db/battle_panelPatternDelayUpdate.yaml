name: battle_panelPatternDelayUpdate
address: '0x080E6C34'
kind: function
status: probable
summary: Phase step for a battle object that waits ~2 seconds, then stamps its panel-type pattern onto
  the field at the halfway point and finishes, playing a per-variant sound effect.
interface: (r5 = battle object self) -> void; sets oBattleObject_PhaseInitialized=4 and Timer=0x78 on
  entry, decrements Timer, applies panel pattern + sound at 0x3C, sets CurAction=8 and clears phase at
  0
details: Called with the object in r5. On first run it marks phase initialized (4) and loads a 120-frame
  timer. Each frame it decrements the timer; when it hits 0x3C it calls battle_applyPanelPattern (which
  stamps a 3x6 panel pattern from a table keyed by Param1 and Alliance) and plays a sound from a 4-entry
  table indexed by Param1>>1 (0x97, 0x11C, 0x118, 0x11B — two Param1 values share sfx 0x97). When the
  timer expires it sets CurAction=8 (some finish/return action) and zeroes CurPhaseAndPhaseInitialized
  so the phase machine restarts. The whole thing is a delayed, one-shot panel-area transformation object
  with sound at mid-delay.
