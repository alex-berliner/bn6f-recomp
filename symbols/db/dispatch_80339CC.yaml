name: dispatch_80339CC
address: '0x080339CC'
kind: function
status: confirmed
summary: 'PET menu scene dispatcher: runs the current sub-handler of the singleton scene state eS2011E30 every tick,
  picking between a real-world and an internet jump table based on the current map group, and choosing between paired
  entries in the real-world table via the CopyBot / PetNavi event flags.'
interface: void dispatch_80339CC(u32 toolkit /* r10 */); // r4-r7 preserved by push/pop; r2,r3,r8-r12 and NZCV pass
  through from the last callee (bails out early if TestPETMenuDataFlag(1) returns 0)
details: "Singleton scene state at eS2011E30 (loaded via `ldr r5, off_8033A78`) carries a 1-byte state index at\
  \ `oS2011E30_Idx_04` that selects which scene handler runs this tick.\nSkips the entire tick when `TestPETMenuDataFlag(1)`\
  \ returns non-zero (uses r0=1, branches on Z flag).\nReads the current map group from `toolkit->GameStatePtr->MapGroup`\
  \ (offset `oToolkit_GameStatePtr` then `oGameState_MapGroup`); once it reaches `INTERNET_MAP_GROUP_START` the\
  \ scene is in internet mode and uses `JumpTableInternet8033A4C` directly (state byte times 8 = slot, so states\
  \ map 1:1 to entries 0,1,2…).\nIn the real-world branch states 1..n have two slots each: the table entry just\
  \ above and just below `state*8`. With state==0 the dispatcher uses slot 0 (entry 0) and never tests the flags.\
  \ Otherwise it tests:\n  - `TestEventFlagFromImmediate(0x17, 0x29)` => EVENT_COPYBOT_ACTIVE, picks the lower entry\
  \ (slot = state*8 - 4)\n  - `TestEventFlagFromImmediate(0x17, 0x1D)` => EVENT_PET_NAVI_ACTIVE, picks the higher\
  \ entry (slot = state*8); if neither flag is set it falls through to the CopyBot (lower) entry.\nThe 11-entry\
  \ jump tables (`JumpTable8033A1C`, `JumpTableInternet8033A4C`) pair real-world and internet variants of each handler;\
  \ some real-world entries 0x1C/0x20/0x28 are duplicates of `onUpdateInRealWorld_8033A96`, and the corresponding\
  \ internet entries 0x1C/0x20/0x28 are duplicates of `onUpdateInInternet_8033B1E`, suggesting they re-export the\
  \ default handlers.\nBoth tables `bx` through r0 (handler address loaded with Thumb bit set), passing r5 = self\
  \ = `eS2011E30`; the prologue/epilogue `push {r4-r7,lr}` / `pop {r4-r7,pc}` shields the caller's r4-r7 from the\
  \ handler callees (which treat r5 as a transient parameter).\nPer-frame call is responsible for updating the state\
  \ index `oS2011E30_Idx_04` itself; this function only dispatches.\n"
