open_questions:
- Which caller installs r10 = toolkit here (the parent per-frame tick)?
- What are the meanings of real-world states 0..6 handled by `callback_noop_8033A7C`, `sub_8033A80`, `onUpdateInRealWorld_8033A96`,
  `sub_8033AB0`, `battle_resetState_8033AC4`, `sub_8033ADC`, `sub_8033AF0`?
- Why are entries 0x1C/0x20/0x28 and 0x24 in both tables duplicates of the default handler rather than unique handlers?
- What is `oToolkit_GameStatePtr` and `oGameState_MapGroup` (which toolkit object is this — battle, overworld, scene
  dispatcher)?
- What does `TestPETMenuDataFlag(1)` represent (probably a 'PET menu data ready / allow scene to tick' check)?
- Are the EVENT_COPYBOT_ACTIVE / EVENT_PET_NAVI_ACTIVE bank/index pairs `0:17 / 1:0x29` and `0:17 / 1:0x1D`, and
  what is the exact flag id mapping for `EVENT_COPYBOT_ACTIVE` and `EVENT_PET_NAVI_ACTIVE`?
