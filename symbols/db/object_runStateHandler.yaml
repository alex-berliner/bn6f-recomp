name: object_runStateHandler
address: '0x0811CD08'
kind: function
status: probable
summary: Dispatches to one of 14 Thumb state handlers indexed by byte [r5,#4] (×4, table at 0x811CD28),
  then calls sprite_update on the object's sprite unless byte [r5,#7] is nonzero.
interface: (r5 = object struct) -> r0 = result of handler (0 keeps sprite_update running); clobbers r0-r3,
  lr
details: Reads the object's state from byte [r5,#4], scales it by 4, and indexes a 14-entry table at 0x811CD28
  of Thumb handler addresses; handlers are shared across states (e.g. sub_811CD94 used for states 1,3,5,
  sub_811D1B8 for 9,10,13). Handlers are called with lr=pc so they can return normally. After the handler
  returns, byte [r5,#7] is tested — if nonzero the sprite update is skipped (locret path), otherwise sprite_update
  is called on the object's sprite struct. One handler is the known object_waitTimerGotoState23, confirming
  these are object state-machine steps for a scripted object/NPC.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#4]; lsl r1,#2; ldr r0,[r0,r1]; bx r0 — state-indexed dispatch table; off_811CD28
    contains .word object_waitTimerGotoState23+1 — table holds object state step handlers; ldrb r0,[r5,#7];
    tst; bne locret — byte 7 nonzero skips the sprite update; bl sprite_update — sprite advanced only
    after the state step runs
  refs:
  - bn6f/asm/asm32.s:30663
  - 0x0811CC94 sub_811CC94
  - 0x080026C4 sprite_update
  reproduce: python3 tools/asmcat.py 0x0811CD08
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code agrees with the dispatch + skip-on-flag behavior (ldrb [r5,#7]; tst r0,r0; bne locret_811CD20;
    bl sprite_update) and the 14-entry table at 0x811CD28 with +1 Thumb offsets; however the proposed
    interface claims r0 returns the handler result and that zero keeps sprite_update running, but the
    actual code tests [r5,#7], not r0, so the handler''s return value is not consulted for the update
    decision. The name object_runStateHandler is reasonable and no better candidate stands out.; run wf
    investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
