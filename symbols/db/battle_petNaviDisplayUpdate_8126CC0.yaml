summary: 'Per-frame update of the PET navi-display scene (sibling of battle_petNaviDisplayInit_8126B6C):
  runs its 9-entry state table, positions the selected entry''s sprites, syncs PET-navi-dependent status
  entries, and redraws the scene.'
details: 'Copies the signed selection byte r5+0x0D into r5+0x0E, then dispatches off_8126DC0[r5+0x2] (9-entry
  state table, first entry chatbox_fadeGuardThenRunState_8126DF8). entity_runAllUpdateHandlers_80465BC.
  Three times resolves the selected entry via sub_81278D8 (entry = [r5+0x40] + 8*ldrsb(r5+0x0D)) and repositions
  sprites: object_setSpritePosition_8119BE8(entry, [r5+0x44], 0), sprite_setPositionByStructIndex_811BDFC(entry,
  [r5+0x44], 5), sprite_setCoordsIfExists_811B46C(entry, [r5+0x44], 1). Reads GetCurPETNavi and GetCurPETNaviStatsByte(navi,
  0xE); registry_setEntryStatusByKey_8119C74 and sub_811BED4/sub_811B48C sync the per-navi status entries.
  Finishes with battle_updateEStructSprites_80465F8.

  '
