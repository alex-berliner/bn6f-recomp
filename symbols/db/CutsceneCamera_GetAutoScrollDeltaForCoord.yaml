name: CutsceneCamera_GetAutoScrollDeltaForCoord
address: '0x08037162'
kind: function
status: confirmed
summary: Computes one axis's per-frame camera auto-scroll step from a coordinate delta, clamping the magnitude to
  a fixed-point maximum and falling back to the raw magnitude for small deltas.
interface: s32 CutsceneCamera_GetAutoScrollDeltaForCoord(s32 coordDelta /* r3 */); returns the signed, clamped step
  in r3 and the minimum-step threshold 0x800 in r4; clobbers r0 and all flags, preserves everything else, returns
  via mov pc, lr.
details: Takes a signed coordinate delta (the remaining distance the cutscene camera must travel on one axis) and
  derives the per-frame scroll step. Magnitude is computed with sign handling duplicated for positive/negative paths,
  then divided by 16 (lsr
