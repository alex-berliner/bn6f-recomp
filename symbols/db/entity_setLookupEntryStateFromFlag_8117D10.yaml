name: entity_setLookupEntryStateFromFlag_8117D10
address: '0x08117D10'
kind: function
status: confirmed
summary: Looks up an entity in the table at 0x2008450 and sets a state byte (4 or 0) in its entry, or does nothing
  if no entry exists.
interface: struct_2008450* sub_8117D10(u32 flag /*r0*/, u32 entityKey /*r1*/); returns entry pointer (in r0, via
  getStructFrom2008450) or 0; r4-r7 preserved; flags clobbered
details: 'Saves r0 (a flag) in r6, then calls getStructFrom2008450 with r1 (the

  original caller''s entity key/handle) to fetch the matching entry from the

  table at 0x2008450. If no entry is returned (r0 == 0), the function

  returns without touching anything. Otherwise it writes byte entry+9:

  4 when the flag (r6) was nonzero, 0 when it was zero. The C checked

  version shows the entry pointer arriving in r1 from the lookup helper and

  r0 carrying the entry/NULL result. Field +9 looks like a small

  state/mode enum; value 4 is presumably one specific state (the semantics

  of 4 vs 0 are not identified from this function alone).

  '
