name: chatboxWindowTileStaging
address: '0x02017204'
kind: data
status: probable
summary: 'Proposed name: chatboxWindowTileStaging. EWRAM staging buffer holding the chatbox window tilemap
  before it is copied into the BG tile block for the text layer. (u8 (tilemap staging buffer, ~2048 bytes))'
details: Lives in EWRAM at 0x02017204, sized to match a 32x32 4bpp BG tilemap. chatbox_uploadWindowTileGfx_804754C
  passes it as the source of a CopyByEightWords call whose destination is iBGTileIdBlocks + 0x800 (the
  BG tile block for the text/window layer) and whose size is 0x800 bytes, so the function DMA-equivalents
  the entire window tilemap from this buffer into VRAM. No other function is documented as writing it
  in the sites provided, so its writer (presumably the chatbox/text composer) is not shown here. It is
  the EWRAM counterpart used to assemble the window's tiles before upload, in the same role the IWRAM
  iBGTileIdBlocks plays for the base BG layers.
