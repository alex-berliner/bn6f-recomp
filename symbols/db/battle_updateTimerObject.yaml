name: battle_updateTimerObject
address: '0x080D072C'
kind: function
status: probable
summary: 'Per-frame handler that drives a battle object''s timer: removes and re-presents its collision
  data, spawns a hit effect, highlights its panel each tick, and destroys the object once its timer expires.'
interface: (r0/r5 = battle object) -> r0 = 0 or next-state; sets oBattleObject state to CUR_STATE_DESTROY
  when timer runs out
details: State handler operating on the object in r5. Each tick it tears down and re-refreshes collision
  data (object_removeCollisionData, object_presentCollisionData), spawns a hit-effect object at the last
  collision position (object_spawnCollisionEffect, which itself may skip if flags/hit-effect rules say
  so), and marks the object's current panel (PanelX/PanelY) highlighted. If the collision data reports
  flags from the last collision, it also clears the object's collision region byte. It decrements oBattleObject_Timer;
  while positive it continues, and when it hits zero it clears the collision region and writes CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, ending the object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_spawnCollisionEffect / object_presentCollisionData each frame before timer check
    (80D072C block); ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; ble loc_80D075C gates destruction on
    timer expiry; loc_80D075C: mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized];
    bl object_highlightPanel with r0=PanelX, r1=PanelY marks the panel the object occupies; tst r0,r0
    on oCollisionData_FlagsFromCollision guards object_clearCollisionRegion call'
