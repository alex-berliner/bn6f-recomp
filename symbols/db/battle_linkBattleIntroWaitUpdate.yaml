name: battle_linkBattleIntroWaitUpdate
address: '0x08008F2E'
kind: function
status: probable
summary: Battle state-machine step that, once per intro phase, fires effect kind 0x58 and then idles until
  the cross-net (link) battle is ready before advancing.
interface: (r5 = battle effect/state struct, r0 ignored) -> r0 = result of comm_checkCrossNetBattleReady
  (clobbered); no meaningful flags
details: 'r5 points to a per-effect state struct: byte +3 is a phase/state counter, halfword +2 a state/timer
  value, halfword +8 a scratch/anim field. On the first pass (phase byte +3 == 0) it dispatches battle
  effect kind 0x58 via battle_dispatchKindEffect_801E792 (which allocates a sprite slot and registers
  the per-kind handler), clears halfword +8, and advances the phase to 4. Every subsequent call it polls
  comm_checkCrossNetBattleReady_801E754; while the cross-net battle is not ready it keeps halfword +2
  pinned at 0xC, effectively stalling this state. Once ready, it just returns and lets the surrounding
  state machine move on.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#3] / tst+bne: byte +3 gates the one-time init, then is set to 4 — a phase counter;
    bl battle_dispatchKindEffect_801E792 with kind 0x58 only inside the phase-0 branch (init-time effect
    spawn); bl comm_checkCrossNetBattleReady_801E754 + cmp/bne: polling loop exit condition is the link-battle-ready
    check; strh #0xc,[r5,#2] on not-ready: state/timer field +2 held at 0xC while waiting; strh #0,[r5,#8]
    in the init branch clears a per-effect scratch/anim field'
