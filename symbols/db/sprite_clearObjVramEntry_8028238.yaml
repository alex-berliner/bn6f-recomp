name: sprite_clearObjVramEntry_8028238
address: '0x08028238'
kind: function
status: confirmed
summary: Wipes one 0xC0-byte OBJ tile slot in VRAM (base 0x6009C20, entry index in r0) by filling it via sub_80281C4,
  used to free/reset a sprite's tile space.
interface: void sprite_clearObjVramEntry(u32 entryIndex /* r0 */); r2-r7 preserved; flags clobbered by callee
details: 'Multiplies r0 by 0xC0 (bytes per entry), adds it to the fixed OBJ tile VRAM base 0x6009C20, then tail-calls
  sub_80281C4 with r0 = 0x1FF (fill value/pattern) and r1 = destination address. sub_80281C4 evidently performs
  the fill/clear of the 0xC0-byte block (likely halfword fills of 0x01FF or a related reset pattern). Entry stride
  of 0xC0 = 192 bytes = 64 tiles x 4bpp (32 tiles of 8x8 4bpp... i.e. 0xC0/32 = 6 tiles'' worth per 32-byte tile;
  consistent with a per-sprite tile block). The wrapper preserves r2-r7 so callers'' register state survives the
  helper call; r0/r1/lr and flags are clobbered as normal for a thumb call.

  '
