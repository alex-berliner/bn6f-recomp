name: sub_80FFA8C
address: '0x080FFA8C'
kind: function
status: hypothesis
summary: Trivial wrapper that calls sub_800FE28 with a pointer to a 4-byte constant table {30,28,26,20} and forwards
  the caller's r5, returning its r0.
interface: 'u32 sub_80FFA8C(u32 r5 /* forwarded */); // in: r5, lr; out: r0; clobbers r1, r2, lr, flags'
details: 'Pushes lr, loads the address of byte_80FFA9C into r0, calls sub_800FE28, and returns with pop {pc}. The
  only data is a 4-entry byte table at 0x080FFA9C holding 0x1E, 0x1C, 0x1A, 0x14 (30, 28, 26, 20). The caller''s
  r5 is passed through untouched to the callee, so this is a curried/thunk form of sub_800FE28 with a fixed first
  argument. The meaning of the values depends entirely on sub_800FE28''s semantics (e.g. a timer/step/scale table
  consumed element by element), which is not established here; the decreasing sequence could be durations, sizes,
  or fade steps. No other registers or memory are touched.

  '
