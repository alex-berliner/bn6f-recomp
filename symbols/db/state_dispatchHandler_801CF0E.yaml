name: state_dispatchHandler_801CF0E
address: '0x0801CF0E'
kind: function
status: confirmed
summary: State-machine dispatcher that reads the current state index from a work block and tail-calls the matching
  handler from a 5-entry ROM table.
interface: void sub_801CF0E(void); /* r7 in/out preserved around the handler call; NZC set by the state*4 shift;
  control passes to the handler, which returns to this function's caller */
details: 'Dispatcher for the state block rooted at byte_2036840. Reads the current state index from byte_2036848
  (block + 0x8), multiplies it by 4 (setting NZ from the shifted value and C from bit 30 of the index), and loads
  the handler pointer from the ROM table off_801CF28. The handler is invoked via mov lr, pc / bx r0, but since the
  dispatcher immediately does pop {r7,pc}, the handlers effectively return straight to this function''s caller,
  making this a tail-call-style dispatch. Handlers receive: r0 = their own handler address (thumb bit set), r1 =
  &off_801CF28 (the jump table itself), r7 = &byte_2036840 (the state block), and the caller''s r7 is restored on
  return. Table layout: states 0-2 all point to sub_801CF3C, state 3 to sub_801CF9E, and state 4 to sub_801D048.
  No bounds check on the state index; values >4 would jump through whatever follows the table.

  '
