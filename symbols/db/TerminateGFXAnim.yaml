name: TerminateGFXAnim
address: '0x08001B6C'
kind: function
status: confirmed
summary: 'Stops a running graphics animation: clears its state flag and tears down the palette transform attached
  to that animation slot.'
interface: gfxAnim_Terminate(u32 animIndex /* r0 */); passes animIndex on to Terminate_ePalette20097a0_Transform
  and returns that callee's r1/r2 and c/v flags to the caller
details: r0 is an index into the eGFXAnimStates array (entry stride oGFXAnimState_Size). The function computes eGFXAnimStates
  + index*stride and stores 0 to that entry's first byte, marking the animation state as inactive/finished. It then
  re-loads the same index into r0 and tail-calls Terminate_ePalette20097a0_Transform, which presumably shuts down
  any palette fade/transform (ePalette 20097a0 block) associated with that animation slot. r4-r7 are preserved across
  the whole call; r1/r2 and the c/v flags produced by the palette routine are returned untouched, so callers can
  use them as if they had called the palette routine directly. Note the odd push/pop {r0} pair, which just guards
  r0 across the load of the eGFXAnimStates base pointer.
