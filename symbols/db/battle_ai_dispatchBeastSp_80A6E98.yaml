summary: AI dispatch wrapper that picks one of three handlers from a jump table using BattleObject.CurState
  (offset 0x8) and calls it via lr/bx, returning its r0 directly.
interface: (r5 = *BattleObject, r1 = ?, others caller-saved) -> r0 = handler result (e.g. 0x26 from samples)
details: "- Saves lr, loads `r6 = unk_2011A90` (unused inside this function; likely scratch for callers).\n\
  \  - Loads `r0 = off_80A6EA8` (= `&off_80A6EAC`), and `r1 = ldrb [r5, #8]` which is `BattleObject.CurState`\
  \ per `oBattleObject`.\n  - Indexes the table: `r0 = [off_80A6EAC + r1*4]`. The table at 0x80A6EAC has\
  \ 3 entries:\n    `[0] = sub_80A6EBC+1`, `[1] = sub_80A6F2C+1`, `[2] = sub_80A6F70+1`. Each is stored\
  \ as +1 (Thumb bit set), so `bx r0` correctly enters Thumb.\n  - Uses `mov lr, pc; bx r0` to tail-call\
  \ the handler, then `pop {pc}` to return to the original caller.\n  - Captured exit r0 = 0x26 across\
  \ all samples, consistent with one of the three handlers returning a fixed value.\n  - The 0x40-byte\
  \ memory range at r0 is not dereferenced inside this wrapper, only used as the function pointer base.\n\
  \  - Caller-side context (r10=Toolkit, r5=BattleObject) and r2/r3 (0x8445190 / 0x84451A4) match the\
  \ beast-sp (AIData) layout, suggesting this is the AIData-state dispatcher fired each frame.\n"
