name: m4a_800061E
address: '0x0800061E'
kind: function
status: confirmed
summary: Thin wrapper/trampoline that dispatches a call into the m4a sound driver via sound_8000808, passing a routine
  pointer taken from the song-table area and shielding r10 from being clobbered.
interface: void m4a_SoundMainWrapper(/* r0 passed through */, /* r2 passed through */); // r1 = incoming r10 (forwarded
  as arg), r3 = m4a_SongNumStart|1 (thumb Fn*); preserves r4-r7, r10
details: 'Saves lr, then pushes r10 onto the stack as a scratch slot and copies it into r1 so it reaches sound_8000808
  as an argument. Loads a routine address from off_800086C (which points at m4a_SongNumStart+1, i.e. a thumb function
  pointer with bit 0 set) into r3, and calls sound_8000808 with r0/r2 passed straight through from the caller. After
  the call it pops the saved value back into r10 and returns. The save/restore of r10 exists because sound_8000808
  is known to clobber it; this wrapper therefore acts as a caller-side safety shim around a single sound-driver
  entry point. It touches no game state of its own beyond the stack scratch slot; all real work happens inside sound_8000808
  with the function pointer from the m4a song-table region.

  '
