name: battle_aiAttackStep_810AF90
address: '0x0810AF90'
kind: function
status: confirmed
summary: 'Advances one tick of an AI-controlled enemy''s attack sub-sequence: periodically highlights
  the panel ahead of the object, decrements the step timer, and on expiry advances the animation, plays
  the impact sound, and resets the timer.'
interface: void battle_aiAttackStep(u16* stepTimer /*[r7+oAIAttackVars_StepTimer]*/, BattleObject* obj
  /*r5*/, AIAttackVars* ai /*r7*/, u32 soundR2 /*r2*/)
details: 'Reads the 16-bit AIAttackVars_StepTimer at [r7]. Shifts it right by 3 and tests the carry flag
  (bit 3 of the timer); if set, the highlight branch is skipped (branch if carry clear to the decrement
  path). When bit 3 IS clear the highlight code does not run either — so the highlight fires on the opposite
  parity, i.e. every other tick where bit 3 is set. Inside the highlight branch: gets the object''s front-facing
  direction via object_getFrontDirection (r5), adds the object''s PanelX to produce a target column, XORs
  DirectionFlip with Alliance for a side flag, and selects a highlight range of 4 or 2 depending on AIAttackVars_AiDifficultyTier
  (0 → 4, nonzero → 2). Calls highlightPanelIfSomeCondition_8109660 with those four values. The r2 result
  from that call (or the original r2 input) is forwarded to PlaySoundEffect as a secondary parameter.
  After the conditional block the step timer is re-read, decremented, and stored back. If it reaches zero:
  CurAnim on the BattleObject is incremented by 1, sound effect 0xB0 is played via PlaySoundEffect(r0=0xB0,
  r2=saved), StepTimer is reloaded from AIAttackVars_AttackDuration, and AIAttackVars_SubStepIndex is
  set to 8 (signalling the next AI phase). Fields touched: oAIAttackVars_StepTimer, oAIAttackVars_AiDifficultyTier,
  oAIAttackVars_AttackDuration, oAIAttackVars_SubStepIndex, oBattleObject_PanelX, oBattleObject_PanelY,
  oBattleObject_Alliance, oBattleObject_DirectionFlip, oBattleObject_CurAnim. Quirk: the timer is re-loaded
  from [r7] after the highlight call rather than using the cached r0, guarding against a callee that might
  have modified it.

  '
