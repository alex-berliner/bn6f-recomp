name: submenu_moveListCursor
address: '0x08125820'
kind: function
status: probable
summary: Moves a scrolling menu list cursor from Up/Down (one row, auto-scrolling at the edges) and L/R
  (whole-page jumps), playing the cursor-move sound effect when the position changes.
interface: (r0 = pressed-keys bitfield (L=0x200 R=0x100 Up=0x40 Down=0x80), r1 = rows per page, r2 = wrap-around
  flag, struct in r5+r8 with u16 fields +0x12 count, +0x14 cursor row, +0x18 scroll offset) -> r0 clobbered
  (=0x18), r7 = 0xFF if cursor moved else 0; updates +0x14/+0x18
details: Reads the total item count from +0x12, the cursor row from +0x14 and the scroll/page-start offset
  from +0x18. Up decrements the cursor row, clamping at 0; if wrap is enabled and the list is scrolled
  to the very top it wraps to the last row of the last page. Down increments the cursor row up to min(count-1,
  pageSize-1); when already on the bottom row it instead advances the scroll offset, clamped to count-pageSize,
  wrapping back to row 0 / scroll 0 when wrap is set. L and R shift the scroll offset by a full page (pageSize
  = r1), clamped to [0, count-pageSize]. If both stored fields are unchanged afterwards it returns with
  r7=0 without a sound; otherwise it plays SOUND_MENU_CUR_MOVE and sets r7=0xFF. The return value convention
  (r7 instead of r0) is unusual and worth confirming against callers.
