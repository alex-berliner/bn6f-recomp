name: rfu_processConnectionState
address: '0x08145DD8'
kind: function
status: probable
summary: 'Per-tick maintenance of the RFU parent/child link: detects new child joins (0x10), times out
  and drops stale slots (0x11), force-disconnects when last child leaves (0x12), or resets state when
  no children remain (0x14); only runs when link-state byte is 5..8 and advances the +0x7 sub-state to
  drive the connection FSM.'
interface: () -> void; no return value, operates on eStruct200FE00 link state and fires the registered
  connection callback with reason codes 0x10/0x11/0x12/0x14
details: 'Runs only while the link-state byte at eStruct200FE00+4 is 5..8 (connected/parent states). It
  XORs the current child bitmap (byte at dword_2010CC0+2) with the stored one at +0xC to detect newly
  joined children, fires callback 0x10 for them, and stores the bitmap. It then loops over the 4 child
  slots: joined slots get a countdown at struct+0x28+i decremented each tick; on timeout (or if a slot''s
  entry at dword_2010CB0 fails the 0x46/+0x61 check, or the child''s id is not found in the parent''s
  table at dword_2010CC0+i*32+0x18) the slot is dropped — clearing its bit at +0x24, zeroing its timer
  and calling rfu_clearSlot(8, slot) — and callback 0x11 fires if any dropped this tick. If the disconnect
  flag +0xD is set and all children are accounted for, it calls rfu_forceDisconnect and fires callback
  0x12. Finally, when no children remain (+0x24 == 0) and state is 8 (parent waiting for children to leave),
  it resets the state bytes and fires callback 0x14, or advances the sub-state at +0x7 (values 1/3 ->
  next states 5/9) if +0x7 is nonzero.'
