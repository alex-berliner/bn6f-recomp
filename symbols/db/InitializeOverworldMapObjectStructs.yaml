name: InitializeOverworldMapObjectStructs
address: '0x08003566'
kind: function
status: confirmed
summary: Thin wrapper that reinitializes all overworld-map object structs (object type 5) via the generic struct
  initializer.
interface: 'void InitializeOverworldMapObjectStructs(r2, r3, r4, r7) — r2/r3/r4/r7 pass straight through to InitializeStructsOfObjectType
  as its parameters; r4 and r7 are preserved; returns to its own caller after the call.

  '
details: 'Pushes lr, loads r0 with the object-type constant 5 (OVERWORLD_MAP_OBJECT), tail-calls InitializeStructsOfObjectType
  (via bl with lr saved so the callee''s return goes back to this function''s caller), and returns. The actual work
  — iterating and resetting every struct of object type 5, the overworld-map object type — happens entirely in InitializeStructsOfObjectType.
  This function is purely a per-type entry point with no logic of its own. No memory is read or written directly
  here; flags are clobbered by the call.

  '
