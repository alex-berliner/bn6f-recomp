name: battle_objectWaitTimerState
address: '0x080CEF5C'
kind: function
status: probable
summary: Battle-object behavior step that starts a timer of table-selected length, then ends the object's
  action (CurAction 4) when it expires.
interface: (r0 = unused, r5 = battle object) -> void; writes CurPhase, Timer, CurAction, PhaseInitialized
details: 'Phase 0: sets CurPhase to 4, reads a byte from table dword_80CEF8C indexed by oBattleObject_Param1,
  adds 0x14 (20 frames), and stores it in oBattleObject_Timer. Subsequent calls (phase != 0) decrement
  the timer each frame; when it reaches 0 the object''s CurAction is set to 4 and CurPhaseAndPhaseInitialized
  is cleared to 0, handing control back to the action dispatcher. The table {0x28,0x1E,0x1A,0x14} plus
  20 gives durations 60/50/46/40 frames selected by Param1. This is a standard ''wait a set duration,
  then finish'' phase handler for some battle object.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r1,r0] with r1=dword_80CEF8C and r0=oBattleObject_Param1: duration looked up by Param1;
    add r0,#0x14 then strh to oBattleObject_Timer: initial timer value is table byte + 20 frames; sub
    r0,#1 / bgt: per-frame countdown of oBattleObject_Timer; on expiry strb #4 to oBattleObject_CurAction
    and clear CurPhaseAndPhaseInitialized: action 4 ends the behavior; dword_80CEF8C = 0x141A1E28: four
    selectable durations (0x28,0x1E,0x1A,0x14)'
