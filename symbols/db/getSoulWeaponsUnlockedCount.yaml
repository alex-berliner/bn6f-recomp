name: getSoulWeaponsUnlockedCount
address: '0x0814270A'
kind: function
status: probable
summary: Counts how many of the soul-weapon flags unlocked for the current soul-weapons map entry are
  set.
interface: () -> r0 = number of set flags in the soul-weapon flag range; flags clobbered by callees
details: GetSoulWeaponsMapIndex selects an entry from a halfword table (byte_8142774), giving a base event-flag
  ID. sub_814278C supplies how many flags belong to that entry. The loop walks the range from the last
  flag down to the first, calling TestEventFlag on base+i and incrementing r6 for each flag that is set
  (beq skips clear flags). It returns the total number of set flags, i.e. a progress/unlock count for
  that soul-weapon group.
