name: battle_objectPhaseWaitThenGoto4
address: '0x080BCF58'
kind: function
status: probable
summary: 'battle object phase handler: waits on the object''s Timer, then starts phase 4 with a 10-frame
  Timer2'
interface: (r0 = unused, r5 = battle object) -> r0 = clobbered; flags set by the timer decrement
details: Standard per-frame phase step for a battle object (r5). On first run (PhaseInitialized == 0)
  it clears oBattleObject_Timer and marks the phase initialized with value 4. Each call it decrements
  oBattleObject_Timer and returns while it is still positive; once it hits zero it writes 10 to oBattleObject_Timer2
  and sets oBattleObject_CurPhaseAndPhaseInitialized to 4, moving the object into phase 4 with a fresh
  10-frame countdown. The caller is presumably a phase-dispatch table keyed by the object's current phase;
  the length of the initial wait is set by whatever wrote Timer before this phase began.
