- The exact meaning of object_updateCollisionData's arguments (1, 6, 5, 1) and of CurAction = 4 in this
  object's action table are unknown
- Whether XVelocity direction is fixed per Alliance or set externally before this runs is not shown
- The summary and name are reasonable—the code does integrate XVelocity into X, recompute panels/collision,
  and on Timer==0 snap to panel coordinates and set CurAction=4. However, the call sequence is object_setPanelsFromCoordinates
  then object_updateCollisionPanels, not the other way around, and it calls object_updateCollisionData(1,6,5,1)
  only when PanelX first equals (Alliance^1)*5+1, registering a wider/different collision state, not a
  'full-field' one. Also, there are no known callers, so the 'toward opponent's back edge' interpretation
  is plausible but unverified by the code; the cleaner name matches code behavior more directly.
