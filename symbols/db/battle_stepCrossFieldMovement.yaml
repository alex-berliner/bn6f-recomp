  reproduce: python3 tools/asmcat.py 0x080CA834
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary and name are reasonable—the code does integrate XVelocity into X, recompute panels/collision,
