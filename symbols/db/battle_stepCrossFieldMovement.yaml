name: battle_stepCrossFieldMovement
address: '0x080CA834'
kind: function
status: probable
summary: Per-tick movement step that adds XVelocity to X, re-derives PanelX/PanelY and collision panels,
  optionally registers a new collision state when reaching the far column, and on Timer expiry snaps coordinates
  to panels then advances CurAction to 4.
interface: (r5 = battle object pointer, no args) -> void; no meaningful return value or flags
details: Adds oBattleObject_XVelocity to oBattleObject_X and re-derives the object's PanelX/PanelY and
  collision panel position from the new pixel coordinates. On the first call where PanelX equals (Alliance^1)*5+1
  (column 1 for player-side objects, column 6 for enemy-side objects — the far edge), sets ExtraVars+4
  = 1 as a one-shot flag and calls object_updateCollisionData(1, 6, 5, 1), likely registering it as a
  full-field collision state. Each call also decrements oBattleObject_Timer; when it reaches 0 it snaps
  pixel coordinates back from the panel position, reloads Timer with 8, or 16 if Param3 is nonzero, and
  sets CurAction = 4 with CurPhaseAndPhaseInitialized = 0 to move to the next scripted phase. The 8/16
  timer split suggests the object moves at different speeds depending on Param3.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r1,[r5,#oBattleObject_XVelocity]; add/str to oBattleObject_X then bl object_setPanelsFromCoordinates
    + object_updateCollisionPanels — one-panel movement step; mov r1,#1; eor; mov r1,#5; mul; add #1;
    cmp with PanelX — checks arrival at column 1 or 6 depending on Alliance; str r0,[r5,#oBattleObject_ExtraVars+4]
    guards the one-shot object_updateCollisionData(1,6,5,1) call at loc_80CA86C entry; Timer decrement,
    bne skip, then bl object_setCoordinatesFromPanels and Timer reload 8/0x10 based on Param3 — periodic
    step pacing; CurAction = 4 and phase cleared only when Timer expires — end-of-move state transition'
