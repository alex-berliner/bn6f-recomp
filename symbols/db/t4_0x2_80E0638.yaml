name: t4_0x2_80E0638
address: '0x080E0638'
kind: function
status: confirmed
summary: Dispatches a battle-object handler by its CurState byte via an indirect tail-call.
interface: "void battle_dispatchCurState_80E0638(u8 /*in r5*/ battle_obj_aware_state_r5);\n    // in:  r5 = battle\
  \ object pointer; lr = return\n    // out: r5, r8, r9, r10, r11, r12 (forwarded from the selected handler;\n \
  \   //      the caller reads these back)\n    // trashes: N, Z, C, V; r0, r1, r2, r3, r4, r6, r7, lr\n"
details: 'Loads `r0 = battle_obj->oBattleObject_CurState` (the raw state byte),

  indexes a two-entry jump table at `off_80E064C` by that byte (offset =

  byte index × 4), and tail-calls the resulting Thumb function address with

  `mov lr, pc; bx r1`. Because the call is a tail call, the `pop {pc}`

  only fires if the handler ever returns normally; otherwise control goes

  directly back to this routine''s caller, which is how the original

  reaches the post-handler code. Table layout at 0x080E064C is

  `[sub_80E0654+1, sub_80E0668+1]` (Thumb bit set), so state 0 →

  `sub_80E0654` and state 4 → `sub_80E0668`. Any other state value would

  jump to the word that happens to live there, matching the original''s

  unbounded indexing. The handler runs with `r0` = state byte and `r1` =

  the table entry that was loaded (Thumb address), while `r5` continues to

  point at the battle object. This routine forwards whatever the handler

  leaves in `r5`/`r8`-`r12`, so the caller relies on those not being

  clobbered on the way in or out.

  '
