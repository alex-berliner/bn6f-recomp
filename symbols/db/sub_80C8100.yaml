name: sub_80C8100
address: '0x080C8100'
kind: function
status: confirmed
summary: Per-frame collision update for a battle object (refresh, run action, publish hit data; tear down on battle
  end or pending hit).
interface: 'void sub_80C8100(void); // in: r5 = battle object; clobbers r0-r4,r6-r7,flags; preserves r5,r8-r12'
details: 'First strips the previous frame''s collision data via object_removeCollisionData and plays

  the impact effect via object_spawnCollisionEffect. It then checks battle_isBattleOver:

  if the battle is over, or if oCollisionData_FlagsFromCollision (read through

  oBattleObject_CollisionDataPtr) is non-zero, the object is torn down with

  object_clearCollisionRegion and its CurStateActionPhaseAndPhaseInitialized field is set

  to CUR_STATE_DESTROY. Otherwise it checks battle_isTimeStop; if time is stopped the

  function leaves collision untouched and returns. Otherwise it looks up an action handler

  in a small table off_80C8140 indexed by oBattleObject_CurAction and tail-calls into

  sub_80C8144, which returns straight into the trailing object_presentCollisionData call

  that publishes the collision region the handler produced.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
