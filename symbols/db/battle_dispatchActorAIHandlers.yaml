name: battle_dispatchActorAIHandlers
address: '0x0800F3CC'
kind: function
status: confirmed
summary: Pure thunk that points r0 at the battle AI handler table and tail-calls the dispatcher that runs the current
  actor's AI handler.
interface: void battle_dispatchActorAIHandlers(void); // passes r4, r5, r8, r10 through to indexByActorTypeAndAIIdxThenDispatch_800F420
  along with r0 = &off_800F3DC; all returned registers/flags are whatever the dispatcher leaves behind
details: 'Sets r0 to off_800F3DC, a table of three pointers (off_8109450, off_80F2794, off_80EAB30), and tail-calls
  indexByActorTypeByAIIdxThenDispatch_800F420, which selects a per-actor AI handler by the actor''s type and AI
  index and dispatches to it. The function itself has no logic of its own: r4/r5/r8 (and guest r10) are forwarded
  untouched, and every "output" register (r3-r12) and flag is simply whatever the dispatcher leaves in the guest
  state. The three sub-tables are likely one entry per actor category (e.g. player/enemy/other battle actors); each
  entry is itself a dispatch table indexed by AI index.

  '
