name: battle_init_8124B5C
address: '0x08124B5C'
kind: function
status: confirmed
summary: 'Initializes the battle scene state struct: clears VRAM/GFX, resets the render-info header, builds
  the battle lookup tables, sets initial timers/mode/lookup slots, and triggers the screen fade-in.'
interface: 'void battle_init_8124B5C(void);  // in: r5 = battle_data struct ptr, r10 = toolkit ptr; out:
  r0 = 0; clobbers nz, r4; preserves r5/r6/r8/r9'
details: "Entry-point style setup routine for the battle subsystem (r5 holds the battle_data\nstruct,\
  \ r10 the toolkit whose oToolkit_RenderInfoPtr points at the render header).\nSequence of work:\n  1.\
  \ zeroFillVRAM / ZeroFill_byte_3001960 / ZeroFillGFX30025c0 to wipe prior\n     graphics state; then\
  \ sub_80015FC(0x10).\n  2. Reset the toolkit render-info header: first u16 = 0x7F40, the next six u16s\n\
  \     (offsets 0x10..0x1A) cleared to 0. Calls sub_8126818(0).\n  3. Initializes battle_data fields:\
  \ [r5+1]=4, [r5+2]=0; runs\n     initRefs_buildAndDecompressTable_8125280 and sub_81254FC to build the\n\
  \     battle references / compressed sprite tables.\n  4. Sets the two timers at +0x74 and +0x78 to\
  \ 0xA0.\n  5. Fills the lookup-table slots via sub_81207F8: indices 0/1/2 go to +0x58/0x5C/0x60,\n \
  \    index 4 to +0x68, index 5 to +0x64. The slot at +0x64 doubles as a \"mode\" flag:\n     its low\
  \ byte becomes the battle mode at [r5+0xE] (4 if non-zero, else 3).\n  6. Populates several u16 sub-fields\
  \ by calling the dedicated initializers\n     sub_81258F8, sub_8125994, sub_8125A6C, sub_8125B3C, sub_8125C08\
  \ into\n     [r5+0x12], +0x1C, +0x26, +0x30, +0x3A respectively.\n  7. Misc subsystem kicks: sub_8046664(),\
  \ sub_80465A0(byte_8124AE0),\n     sub_81252C0, sub_8125D10, sub_812546C.\n  8. Calls sub_8120CC8(0,\
  \ dword_8124A94); combines its r0/r1 outputs as\n     (r0 | (r1<<4)) and stores the byte at [r5+0xC].\n\
  \  9. SetScreenFade(8, 0x10) to fade the screen in, then returns 0.\n"
