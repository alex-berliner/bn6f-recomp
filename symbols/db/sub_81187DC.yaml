name: sub_81187DC
address: '0x081187DC'
kind: function
status: hypothesis
summary: Returns a pointer into a record selected by the high nibble of the record's byte at offset 2, each nibble
  step addressing one 16-byte slot.
interface: u32 *getSubRecordByNibbleSelector(void *base /* r5 */)
details: 'Takes a record base pointer in r5, loads the byte at [r5+2], and keeps only its high nibble (lsl/lsr round
  the whole byte down to a multiple of 16). That value, 0x00-0xF0, is added to the base pointer and returned in
  r0, so the function is a selector over sixteen 16-byte sub-records laid out inline at the start of the parent
  record. The byte at offset 2 therefore doubles as a "current sub-record index << 4" field. Only r0 is returned;
  r5 and lr are the only inputs and nothing is preserved or clobbered beyond flags. The mechanics are certain from
  the code, but which structure this belongs to (and thus its game meaning) is not identifiable from this function
  alone.

  '
