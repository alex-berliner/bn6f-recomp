name: init_applyBeastSpScenarioEventFlags
address: '0x0808CE70'
kind: function
status: confirmed
summary: Sets one event flag and clears a small range of flags per entry, choosing the table by the current map-group
  AI mode, to initialise Beast Spread scenario progression.
interface: void (void) — reads r8, calls ai_getAIModeForMapGroup; clobbers r0-r3 lr; returns r7 (loop counter) to
  caller; preserves r4-r8.
details: 'Queries the active AI mode via ai_getAIModeForMapGroup_808D084, then indexes a 4-entry jump table at 0x0808CEBC
  (one per mode 0-3). Each mode selects an 8-byte-stride array at 0x0808CECC / 0x0808CEE4 / 0x0808CEFC / 0x0808CF14.
  Modes 0-2 carry 3 entries; mode 3 carries 4. Every entry is [u16 setFlag, u16 clearStart, u16 clearEnd, u16 pad].
  For each entry the routine calls SetEventFlag(setFlag) then ClearEventFlagRange(clearStart, clearEnd), effectively
  marking the current scenario beat as reached while wiping the preceding beats'' flags. Flag numbers fall in two
  blocks: 0x9DD-0x9FE (modes 0-2) and 0xFC6-0xFCD (mode 3, the 0xFAF/0xFBF/0xFCF/0xFDF high-nibble variant). r8
  is saved/restored around the call so the AI-mode scratch does not leak outward. The loop counter ends in r7, which
  is declared as an output in the contract.

  '
