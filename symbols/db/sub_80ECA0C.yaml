name: sub_80ECA0C
address: '0x080ECA0C'
kind: function
status: confirmed
summary: Decrements an AI attack state's frame countdown and leaves the attack state once it expires.
interface: void sub_80ECA0C(AIAttackVars* vars /* r7 */); // returns flags/r0-r3 from the decrement or from object_exitAttackState
details: 'Tiny attack-state tick handler. r7 points at an object''s AIAttackVars struct;

  the halfword counter at offset oAIAttackVars_Unk_10 is read, decremented by 1,

  and stored back. The decrement sets the flags (like CMP count, 1): if the

  result is negative (counter was 0 or wrapped under), the routine calls

  object_exitAttackState to leave the attack state; otherwise it just returns.

  r0 carries the decremented value to callers. Data right after the routine

  (dword constants 0x10003/0x10000/0x1E0000/0x180000/0x300000 and a pointer

  table to PanelOffsetListsPointerTable) appears to belong to neighbouring

  attack code, not to this function itself.

  '
