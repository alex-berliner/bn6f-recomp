    run wf investigate investigate-20261019-022109'
open_questions:
- 'No callers known: which object/scene owns the r5 struct and what the stepped sprite groups depict'
- Meaning of state byte 8 at r5+1 and what reads it afterwards
- Whether the 0x10 stride and 0x28 cap encode a fixed 2-3 step animation or a data-driven count
