    is stored to oAIAttackVars_Damage; writes of oAIAttackVars_ExtraDamage=0x94, AiDifficultyTier=1, InitFlag=0,
    AttackBoost=0, AttackBoost2=0x06000000 all target the oAIAttackVars struct at r7; returns literal
