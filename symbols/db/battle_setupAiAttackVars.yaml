name: battle_setupAiAttackVars
address: '0x08012144'
kind: function
status: probable
summary: Initializes the battle AI attack variables for a Navi-controlled attack, scaling base damage
  from the battle object's NaviStats byte and setting fixed per-tier constants.
interface: (r0 = battle object ptr; r7 = oAIAttackVars struct base) -> r0 = 0x38 (state/attack id); no
  flags of interest
details: Calls GetBattleNaviStatsByte_AllianceFromBattleObject with selector r1=1 to fetch one NaviStats
  byte for the object's alliance, adds 1 and multiplies by 10, storing the result as oAIAttackVars_Damage.
  It then hard-sets ExtraDamage to 0x94 (148), AiDifficultyTier to 1, InitFlag to 0, AttackBoost (halfword)
  to 0, and the word field AttackBoost2 to 0x06000000. Finally it returns the constant 0x38, likely an
  attack/state id consumed by the caller. The fields written match an AI attack-variables block, so this
  is one of several per-difficulty/per-attack setup routines.
