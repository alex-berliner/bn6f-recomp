name: toolkit_getUnk2004190EntryPtr_813B9FC
address: '0x0813B9FC'
kind: function
status: confirmed
summary: Returns the address of entry `index` in the 8-byte-per-entry array whose base pointer is held in the toolkit
  struct at oToolkit_Unk2004190_Ptr.
interface: void *toolkit_getUnk2004190EntryPtr(u32 index /* r0 */, toolkit *tk /* r10 */) /* returns r0 = base +
  index*8; also leaves r1 = array base, r2 = 8, and sets NZCV flags from the final ADD (V is listed as an output)
  */
details: 'Tiny helper that indexes into a dynamically-located array. It loads the array

  base pointer from the toolkit struct (r10) at offset oToolkit_Unk2004190_Ptr,

  then computes base + index*8, i.e. the array is 8 bytes per entry. The caller

  presumably knows what those 8 bytes contain; this routine only does the

  addressing. Quirks: it deliberately leaves the multiplier (8) in r2 and the

  base pointer in r1 as live outputs, and the final ADDS sets the condition

  flags (including V), so callers may branch on the result address. It does not

  touch memory beyond reading the base pointer, and preserves nothing special

  (r0-r3 are caller-saved anyway).

  '
