name: rfu_dispatchLinkEvent
address: '0x081473EC'
kind: function
status: probable
summary: 'Wireless link-event dispatcher: on a link event id, updates the wireless session state word
  (eS200BC50+8), drives rfu_setLinkCommand/sub_813D94C, copies ready-flag bitmasks between word_200FE14
  and byte_2010280/byte_2010284, and clears byte_2010368.'
interface: (r0 = link event id, byte) -> r0 = undefined; no flags used by callers known
details: A switch on the byte argument dispatches ~13 event codes (0x00,0x10,0x12,0x14,0x30,0x31,0x33,0x42,0x44,0x50,0xF0,0xF1,0xFF;
  others fall through to loc_81475AA as no-ops). Most handlers write a new state value into eS200BC50+8
  (word_200BC58, the wireless session state) — e.g. 0xB, 0x22, 0x34, 0x3F — and several call rfu_setLinkCommand
  with a command byte (0xE, 0x14, 0x15, 0x1, 0xD). The 0x12 case expands the 4-bit field at eStruct200FE00+0x14
  (word_200FE14) into a bit-mask stored at byte_2010284 (player-ready flags), while 0x13-range/0x30/0x33
  cases OR/Clear those bits into byte_2010280. The 0xF0 case calls sub_813D94C(0x15), copies word_200FE14
  into word_20102D0, clears byte_2010368, and sets state 0x3F; several paths also clear byte_2010368,
  which looks like an event-pending/consume flag.
