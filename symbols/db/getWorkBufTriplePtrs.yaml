name: getWorkBufTriplePtrs
address: '0x08049D82'
kind: function
status: probable
summary: Returns three pointers into the IWRAM work buffer at 0x2001800 (base+0, base+8, base+0x28) for
  the caller to use as a parallel set of state/counter slots.
interface: () -> r0 = word_2001800+0x8, r1 = word_2001800+0x28, r2 = word_2001800+0; no flags meaningfully
  set
details: The function loads the base address word_2001800 into r3 and simply returns base+8, base+0x28
  and base+0 in r0, r1, r2; it touches no memory itself. The sole caller (sub_813281C) stores the three
  returned pointers on its stack and then loops over them in parallel with a static pointer table (off_81328B8),
  writing the halfword 2 through the table pointers (strh r2,[r1]; add r1,#2), so the triple acts as a
  per-slot state/scratch set indexed together with static data. Nothing in the visible code reveals what
  the three structures at +0/+8/+0x28 represent.
