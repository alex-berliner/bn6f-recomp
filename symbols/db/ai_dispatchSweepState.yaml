name: ai_dispatchSweepState
address: '0x0810EA4E'
kind: function
status: probable
summary: 'AI state dispatcher for the battle-sweep actor: reads the object''s AI state id and tail-calls
  that state''s handler from a 4-entry jump table.'
interface: (r6 = AI object, [r6+oAIState_ScriptId] = state id) -> jumps to handler table[state]; no return
  value of its own
details: 'Loads the object''s current state id from field oAIState_ScriptId of the object at r6, indexes
  the pointer table at off_810EA60 with it, and tail-jumps to the handler in Thumb mode (mov lr, pc; bx
  r1), so handlers return to this frame''s pop. The table has exactly 4 handlers: ai_branchScriptOnActorsWithNonzeroParam,
  sub_810EAA2, ai_initAttackSweep, and sub_810EADE — a branch-on-param script case, two unknown sweep
  steps, and an attack-sweep initializer. The callee name ai_initAttackSweep and the recorded battlesweep
  route identify this as the per-frame state machine driver of the sweep AI. It preserves r4/r6 and passes
  r6 (the object) untouched, so handlers read the same object.'
