name: rfu_handleVBlank_81453D4
address: '0x081453D4'
kind: function
status: confirmed
summary: 'Handles an RFU (wireless) VBlank tick: syncs RFU state, and if the sync returned a non-zero
  status, sends command 0xF1 and then processes the RFU response queue.'
interface: void sub_81453D4(void); /* lr in, r4..r12 out; r0..r3/r12/lr clobbered via guests; flags nz/c/v
  clobbered; r4 preserved (not used here) */
details: 'Thin wrapper around the RFU library. Calls rfu_syncVBlank (the guest-mode trampoline into

  the GBA''s RFU/Link subroutine) and inspects its return in r0 shifted to high halfword. When

  non-zero (a sync result other than "nothing pending"), it pushes a command byte 0xF1 with

  argument 0 into the RFU via sub_81461B0, then drains / dispatches the queued response

  through sub_81464B4. No global state is touched directly here; the work lives entirely in

  the RFU helpers. The epilogue reuses the saved lr as the return address (pop {r0}; bx r0),

  a common SWI/BIOS-callback return trick.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
