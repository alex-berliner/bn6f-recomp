name: clearS2001c04Byte6_811FB78
address: '0x0811FB78'
kind: function
status: confirmed
summary: Zeroes byte 6 of the game's S2001c04 work area, reached through the toolkit's pointer to it.
interface: void sub_811FB78(Toolkit *toolkit /* r10 */)
details: 'Reads the toolkit field oToolkit_S2001c04_Ptr (r10-based), which points at the game''s S2001c04 work area,
  and stores 0 into byte at offset 6 of that area (STRB). No other fields are touched and no value is returned.
  Because the single cleared byte is generic here, the name describes the mechanism rather than a gameplay meaning;
  offset 6 of S2001c04 likely holds some state/counter/flag that other code checks, and callers use this to reset
  it. Clobbers r0, r1 and the NZ flags; preserves everything else. Returns via mov pc, lr.

  '
