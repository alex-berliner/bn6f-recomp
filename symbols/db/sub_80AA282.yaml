name: sub_80AA282
address: '0x080AA282'
kind: function
status: probable
summary: 'Falling-object map object (type 0x2C): one primary RNG draw per landing, which sets a random
  8-39 frame wait at object +0x24.'
details: When the object lands it draws once from the primary RNG and stores 8 + (rng & 0x1F) frames at
  object field +0x24 as the wait before the next phase.
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: One GetRNG in the body; the result is masked 0x1F and biased by 8 into object +0x24.
  refs:
  - bn6f/asm/asm29.s
  - docs/vidsync/BN6F_SYMBOLS.md
  reproduce: awk 'index($0,"sub_80AA282:")==1{f=1} f{print} f&&/thumb_func_end/{exit}'
    bn6f/asm/asm29.s | grep -nE 'GetRNG|0x1f|0x24'
  result: 'on the frame-parameters bit 0x80: one GetRNG, wait = 8 + (r & 0x1F) stored at [r5,#0x24] and
    state 0xC at [r5,#8] (asm29.s:10054-10071).'
