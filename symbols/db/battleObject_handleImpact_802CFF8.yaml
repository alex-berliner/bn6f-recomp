name: battleObject_handleImpact_802CFF8
address: '0x0802CFF8'
kind: function
status: confirmed
summary: If the battle object in r5 has its impact/shockwave trigger flag set, look up its alliance in
  table 0x2036720 and apply an impact effect and SFX.
interface: void sub_802CFF8(u32 *battle_object /* r5 */)
details: Reads battle_object->oBattleObject_CollisionDataPtr (offset 4), then byte 0x76 of the pointed-to
  collision data. If bit 0x40 (impact flag) is clear, returns immediately. Otherwise reads battle_object->oBattleObject_Alliance
  (one byte) and passes it to getTable2036720EntryFields_802CE78; if that returns non-zero it then calls
  sub_802CEA6 with the alliance and PlaySoundEffect(0x8E). Tables off_802D020..off_802D034 in this region
  all point at unk_2036720 and are referenced by the called helpers, not by this function directly. r6/r7/r10
  are caller-saved by contract but unused here; only r4 is preserved.
