name: GetBattleSettingsUnk01
address: '0x0802D258'
kind: function
status: hypothesis
summary: Returns the "Unk01" battle-settings value for the currently running battle.
interface: Next GetCurrentBattleSettingsUnk01(tools in r10) -> u32 in r0
details: 'Wrapper getter: reads the toolkit''s battle-state pointer (r10 + oToolkit_BattleStatePtr), loads that
  state''s BattleSettings pointer (oBattleState_BattleSettings), then tail-calls GetBattleSettingsUnk01FromBattleSettings,
  whose return value (the settings'' Unk01 field) is passed straight back in r0. lr is the only clobber; r10 is
  preserved implicitly since it is only read. The actual meaning of the Unk01 field is unknown from this code alone
  - it is just one scalar taken from the per-battle settings structure.

  '
