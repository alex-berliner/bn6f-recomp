name: ShuffleHwordList_SecondaryRNG
address: '0x08000D12'
kind: function
status: hypothesis
summary: In-place Fisher–Yates-style shuffle of a u16 array using the secondary RNG and BIOS Sqrt as the index source.
interface: 'void shuffleHwordList_SecondaryRNG_08000D12(const u16 *r0_array, u32 r1_rngState, u32 r2_count);

  // returns r0 = r0_array, r1 = r1_rngState, r2 = 0, r3 = last computed halfword byte-offset;

  // clobbers nz,c,v; preserves r0/r1/r4/r5/r6/r7.

  '
details: 'Performs `r2` iterations. Per iteration it pushes r0/r1/r2/r3, calls

  `GetPositiveSignedRNGSecondary` once, pipes its result through the GBA BIOS `Sqrt` SWI

  (svc 6) — whose R1 quotient is the actual usable index — and repeats the pair

  (GetPositiveSignedRNGSecondary then Sqrt) to obtain a second index. The two indices are

  doubled (`add r3, r3, r3` / `add r4, r4, r4`) to turn them into byte offsets for `ldrh`/`strh`,

  then the halfwords at those offsets in the array pointer passed in r0 are swapped. r2 is

  decremented and the loop repeats until r2 == 0. Final outputs restore r0/r1 to their incoming

  values, set r2 = 0 (the consumed count), and leave r3 = the last generated index*2. Note

  GetPositiveSignedRNGSecondary is called twice per swap but the Sqrt result from the first

  pair is what is consumed (it uses R1 from the SWI as the index) — i.e. the RNG seed in r1 is

  threaded through both the C helper and the BIOS SWI as if the SWI were part of the RNG mix.

  '
