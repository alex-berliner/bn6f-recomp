name: ShuffleHwordList_SecondaryRNG
address: '0x08000D12'
kind: function
status: confirmed
summary: 'Shuffles a u16 list in place by r2 random swaps: each swap picks two indices as secondary-RNG values modulo
  the list length (BIOS Div).'
interface: '(r0 = u16 *list, r1 = list length, r2 = number of swaps, at least 1) -> r0, r1 unchanged, r2 = 0, r3
  = 2 * the first index of the last swap; r4-r6 restored; clobbers flags.

  '
details: 'Each round calls GetPositiveSignedRNGSecondary twice. After each call r0 is the random value and r1 the
  list length (kept on the stack across the call), and `svc 6` is the BIOS Div: r0 = r0 / r1, r1 = r0 % r1. The
  two remainders are the indices (rng % length, each in 0..length-1); doubled, they are byte offsets, and the two
  halfwords are swapped. r2 counts the rounds down to 0 (a do-while: r2 = 0 would run 2^32 rounds). It is not a
  Fisher-Yates shuffle: the same index can come twice (a no-op swap), and how well the list is mixed depends on
  the number of swaps the caller asks for.

  The twin ShuffleHwordList_PrimaryRNG does the same with the primary RNG.

  '
evidence:
- method: assembly-reading
  date: '2026-10-17'
  detail: 'svc 6 is the GBA BIOS Div (r0 / r1: quotient in r0, remainder in r1), not Sqrt (svc 8). r1 holds the
    list length across both GetPositiveSignedRNGSecondary calls (push {r1} / pop {r1}), so the index taken from
    r1 after each svc is rng % length. Corrects the earlier reading of this entry, which took svc 6 for Sqrt and
    r1 for an RNG state.'
  refs:
  - bn6f/asm/asm00_0.s:1455-1484
  - ShuffleHwordList_PrimaryRNG
  reproduce: awk 'index($0,"ShuffleHwordList_SecondaryRNG:")==1{f=1} f{print} f&&/thumb_func_end/{exit}' bn6f/asm/asm00_0.s
  result: 'svc 6 twice; mov r3, r1 and mov r4, r1 after them; add r3, r3, r3 / add r4, r4, r4; ldrh/strh swap; sub
    r2, #1; bne'
