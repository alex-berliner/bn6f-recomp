open_questions:
- The byte at oAIAttackVars_Unk_00 is interpreted as a raw offset rather than a 0..5 index; the table has 6 entries
  (16 bytes), so only command bytes 0, 4, 8, 12, 16, 20 are valid. Anything else would walk off the end of the table.
  Is oAIAttackVars_Unk_00 really an offset, or is the code reading from the wrong field?
- What do the six handlers (sub_80FD5D8, sub_80FD638, sub_80FD664, sub_80FD682, sub_80FD6A6, sub_80FD6F4) actually
  do, and which attacks or phases of an attack do they represent?
- What is the meaning of the other fields in the AI attack variable block that oAIAttackVars_Unk_00 belongs to?
