name: sub_80FD5AE
address: '0x080FD5AE'
kind: function
status: confirmed
summary: AI attack command dispatcher that tails into one of six handlers chosen by a byte in the attack variable
  block pointed to by r7.
interface: '// Inputs:  r7 = AI attack variable block pointer

  //          r3, r5, r6, r10 = passed through to the selected handler

  //          lr = return address (saved/restored)

  // Outputs: handler''s residue in r1, r5, r8, r9, r10, r11, r12 and flags

  // Clobbers: r0, r2, r3, r4, r6, lr (used as scratch before the dispatch)

  // Preserved: r7 (saved on the stack and restored on return)

  '
details: 'Reads the byte at offset oAIAttackVars_Unk_00 from the AI attack variable

  block pointed to by r7. That byte is used as a raw byte offset (not an

  entry index) into the six-entry handler table at off_80FD5C0, whose

  entries are sub_80FD5D8, sub_80FD638, sub_80FD664, sub_80FD682,

  sub_80FD6A6 and sub_80FD6F4. The chosen handler address is loaded into

  r1 and then jumped to via `mov lr,pc; bx r1`, with the dispatcher''s

  register state handed in unchanged. Because the dispatcher also pushes

  {r7,lr} and pops {r7,pc} around the jump, the handler sees a frame

  whose return is the dispatcher''s own caller, and the dispatched handler

  therefore returns straight to that caller (a tail call). Effectively

  this is a register-preserving jump-table dispatch keyed by the command

  byte in the AI attack variable block.

  '
