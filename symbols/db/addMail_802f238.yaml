name: addMail_802f238
address: '0x0802F238'
kind: function
status: confirmed
summary: Records a newly received mail by setting its event flag and companion flag (mailId + 0x80), then pushes
  the mail's inbox slot (mailId - 0x1CA0) to the front of the inbox entry list and increments the inbox entry count.
interface: void addMail_802f238(u32 mailId /* r0 */); /* clobbers r0, r1, r2, r3, c, v; preserves r4, r6, r7; trashes
  nz */
details: '- Sets two event flags via SetEventFlag: one for mailId, one for mailId + 0x80 (a paired flag for the
  same mail).

  - Computes inbox slot index = mailId - 0x1CA0 and stores it as a byte at byte_2006530 (the inbox entry array,
  ordered newest-first).

  - Shifts existing entries one slot toward the end (indices count-1 .. 0 are moved up by 1) to make room at the
  front.

  - Increments dword_2001140 (the inbox entry count) by 1; the c/v flags come from this add.

  - Quirks: the copy loop decrements src before the signed >=0 test, so when count is non-zero it always copies
  at least once even if its signed interpretation is negative; when count is 0 the function skips the copy entirely
  and falls through. dword_2001140 is read but its signedness is not clearly established; treat it as unsigned unless
  other callers indicate otherwise.

  - Touches global state: byte_2006530 (inbox entry bytes), dword_2001140 (inbox entry count).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
