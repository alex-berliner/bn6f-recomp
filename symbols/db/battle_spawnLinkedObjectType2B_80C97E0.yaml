name: battle_spawnLinkedObjectType2B_80C97E0
address: '0x080C97E0'
kind: function
status: confirmed
summary: Spawns a battle object of type 0x2B and cross-links it with the requesting (owner) object, inheriting
  the owner's alliance/flip setting.
interface: u32 battle_spawnLinkedObjectType2B_80C97E0(u32 spawnArg1, u32 spawnArg2, u32 spawnArg3, BattleObject*
  owner /* r5 */, void** ownerLinkSlot /* r7 */); returns the new object in r0 (0 on spawn failure); flags
  from `adds r0, r5,
details: 'Passes r1-r3 through untouched to object_spawnType3 with spawn type 0x2B and gets

  the new object back in r5 (the spawn routine answers in r5, restored here via pop {r5}

  before the result is moved to r0). On success the new object is set up as follows:

  oBattleObject_RelatedObject1Ptr = owner object (r5), oBattleObject_ExtraVars = r7

  (the owner''s link-slot pointer), and the slot itself is pointed back at the new

  object (*extraVars = new object), forming a two-way link. The new object copies the

  owner''s oBattleObject_AllianceAndDirectionFlip halfword so it shares the owner''s

  alliance and direction-flip state. Finally the new object''s ObjectHeader flags byte

  (offset 0) gets bits 0x04 and 0x10 (0x14) set - likely markers that this object is

  linked/owned and should follow the owner''s lifecycle. On spawn failure (r5==0) the

  function returns immediately without touching anything. Data at off_80C9804 /

  dword_80C9808 ("byte_80C9664" pointer and value "0x100000") sit in this function''s

  pool and belong to the type-0x2B handler''s context, not to this stub itself.

  '
