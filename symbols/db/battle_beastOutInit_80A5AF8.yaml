name: battle_beastOutInit_80A5AF8
address: '0x080A5AF8'
kind: function
previous_names:
- sub_80A5AF8
status: probable
summary: Initialize a player's Beast Out transformation BattleObject (sprite, anim, OAM layer, then hand
  off to the per-frame driver).
interface: 'r5 = player BattleObject (BattleObject*) ; r10 = toolkit ; side effects: writes fields at
  offsets 0,5,6,7,8,0xc,0xd,0xe,0x10,0x24,0x34 of the object and schedules its first tick.'
details: 'Sets the object''s CurState (offset 0) to 3 (probably BEAST_OUT_INIT phase). It calls sub_80A5D0C,
  which appears to resolve a per-Navi/Beast-Out parameter record into r4 (the caller bails if this returns
  0). From that record it copies three u16s (offset 0/2/4) into the object''s fixed-point X/Y/Z slots
  at 0xc/0x10/0x14 as 16.16 values (each lsl #0x10). It then loads sprite #0x80 at VRAM bank 0x18 / tile
  slot 0x3c via sprite_load, and pulls the initial CurAnim (u16 at r4+6) into both Param5 (object+5) and
  Timer (object+0x34) before calling sprite_setAnimation/sprite_loadAnimationData/sprite_noShadow. The
  (r5+0xc) pointer is passed to applyLayerEffectToOWObject_8035694 to lock the OAM layer, then sprite_setPriority_8002E14
  picks the BG priority from the r4+7 byte, which is also stored as Param3 (object+6). Param1 (object+7)
  is forced to 1 and a u32 at offset 0x24 is cleared. After sub_80A5F84, an event flag (EVENT_5F2 / 0x5F2)
  is tested — if set, sub_80A5FD0 is invoked. Finally CurState (object+8) is set to 4 (CUR_STATE_UPDATE)
  and battle_beastOutTick_80A5B70 is called once to drive the first frame. Captured calls show r2 alternating
  between two EWRAM BattleObject pointers (0x084450a0 / 0x08445230) with r3=0x40 (object stride).

  '
