open_questions:
- 'The 16.16 "lsl #16" stores target +0xc/+0x10/+0x14, not the documented Coords @ 0x34; mapping of these
  offsets to BattleObject fields is inferred.'
- Whether the r4 record lives in a per-Navi table or in the navi_stats extension.
- Role of EVENT_5F2 and what sub_80A5FD0 toggles — possibly CrossMergerBeastOut or Beast-Out unlock flag.
