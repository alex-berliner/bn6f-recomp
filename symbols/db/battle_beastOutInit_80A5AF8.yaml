    u16 records from r4 into the 16.16 Coords fields (Coords offset 0x34 in struct; here writes to 0xc/0x10/0x14
    per BattleObject.inc). - sprite_load called with r0=0x80, r1=0x18, r2=0x3c immediately after the coordinate
    copy. - r4+6 (CurAnim) stored both to object+5 (Param2) and to object+0x34 (Timer2 region) then passed
    to sprite_setAnimation. - applyLayerEffectToOWObject_8035694 called on (r5+0xc) and sprite_setPriority_8002E14
    set with the r4+7 byte. - movflag EVENT_5F2 / bl TestEventFlagFromImmediate / beq ... bl sub_80A5FD0
    — event-gated side init. - Tail: mov r0,#4 ; strb r0,[r5,#8] ; bl battle_beastOutTick_80A5B70 — bumps
    CurState to UPDATE and runs the per-frame driver once. - Captured entry r1=0 (object slot index from
    r5 by caller) and r2 alternate between 0x084450a0/0x08445230, r3=0x40 (BattleObject stride).'
