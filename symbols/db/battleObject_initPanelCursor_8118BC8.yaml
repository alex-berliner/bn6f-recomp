status: probable
summary: Initialise a battle-object sprite for the in-battle panel-cursor graphic (animation 0, OAM prio
  3, 0x1E0 slot, palette 0) and run one update tick.
interface: '(r5 = BattleObject*, r6 = parent context) -> void ; side effects: mutates the sprite fields
  (Unk_0, CurAnim/Unk_0c/d, palette, OAM prio, x/y), then tails the per-type update'
details: "- `strb r0, [r5]` with r0=0x23 writes 0x23 into object byte +0 (object_header.Flags); given\
  \ 0x02 is OBJECT_FLAG_VISIBLE and 0x20 is UPDATE_DURING_TIMESTOP, this is setting the sprite-visible+timestop\
  \ flag pair.\n  - `initGuiSprite_8002770(0x13, unk_2021FF0)` is called with a 16-bit resource/template\
  \ id and a pointer in IWRAM, after which the standard GUI-sprite setup has been run on the object at\
  \ r5.\n  - `sprite_setAnimation(0)` then `sprite_loadAnimationData()` so the slot starts on frame 0\
  \ of its first animation and pulls the tile/OAM data in.\n  - `sprite_noShadow()` clears the shadow\
  \ bit on the sprite struct.\n  - `sprite_setPriority_8002E14(3)` makes the cursor sit above most other\
  \ in-battle sprites.\n  - `slotList_storeHalfwordAndClearField_800306C(0x1E0)` writes 0x1E0 into a slot\
  \ in the high-nibble-selected 16-byte record (the sprite-data sub-entry's \"extra\"/status halfword).\n\
  \  - `sprite_setSubRecordFieldA_8003060(4)` and `sprite_setSubEntryPaletteBank_800304A(6)` set the sub-record\
  \ byte +0xA and the high nibble of the bank byte (palette bank = 6) respectively, then `sprite_setPalette(0)`\
  \ sets byte +4 of the sprite to 0 (palette 0).\n  - `strb r0, [r5,#8]` with r0=4 sets CurState=4 (CUR_STATE_UPDATE,\
  \ the standard per-frame \"alive and ticking\" state).\n  - The x/y write uses `r6+0x20` (a halfword\
  \ index into something the parent context holds) multiplied by 0x14, added to a base of 0x1B, and `0x80,\
  \ 0x1B`-ish coordinates are written via `sprite_setCoordinates`. So the cursor is placed on a specific\
  \ panel column derived from the parent.\n  - `strb 0xFF, [r5,#0xc]` and `strb 0xFF, [r5,#0xd]` clear\
  \ (or set \"no-anim\" / \"uninitialised\" markers in) the CurAnimCopy / animation fields.\n  - Finally\
  \ `battleObject_updateByType_8118C2C` is tail-called so the per-type animation/jump dispatch runs once\
  \ after the init.\n  - The \"panel cursor\" role is consistent with: CurAnim 0, a single halfword index\
  \ from a parent context at +0x20 multiplied by 0x14, an OAM priority high enough to sit over the playing\
  \ field, a low bank/palette, and a name that puts this directly next to `battleObject_updateByType_8118C2C`\
  \ in the battle object code.\n"
