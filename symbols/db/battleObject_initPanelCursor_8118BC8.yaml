open_questions:
- The exact meaning of byte 0x23 (which flag combination) is inferred from the OBJECT_FLAG_* constants;
  not directly verified.
- The semantic of `r6+0x20` is not pinned to a struct field here; the caller chain is empty in the supplied
  metadata, so "panel column" is the best fit given the *0x14 scaling (one BN6 panel is 0x14 pixels wide
  in OAM coordinates).
- Why `0xFF` is written into bytes 0xc/0xd rather than 0 is unclear (could be a sentinel meaning "no previous
  animation", or a different field reused for the cursor).
