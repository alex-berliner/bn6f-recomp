name: sub_814E17C
address: '0x0814E17C'
kind: function
status: hypothesis
summary: Runs a helper on a battle object, stores the byte it computes at offset 0xA, and forces flag bits 2-3 (0xC)
  on in the object's flag byte at offset 0.
interface: void battle_objectStoreComputedByteAndSetFlags_C(void); /* r1 = battle object pointer; r0, r4-r11 are
  forwarded untouched to sub_814E0D0; returns r2 = 0xC, r3 = updated flag byte, NZ from the ORR */
details: Tail-less wrapper around sub_814E0D0 - it saves lr into r12 (which sub_814E0D0 preserves) so it can return
  directly with bx r12 afterwards. sub_814E0D0 computes some byte value derived from the object's state and leaves
  it in r3; this function stores that byte to object+0xA, then reads the object's flag byte at offset 0, ORs in
  0xC (bits 2 and 3), and writes it back. The NZ flags are set from the merged flag byte as a side effect of the
  ORR, though nothing here branches on them. Offset 0 acting as a flags/status byte and the 0xA offset suggest the
  standard battle object/work-area layout used by the battle engine; without knowing what sub_814E0D0 measures,
  the game-level meaning of the stored byte (timer, HP, animation value, element, etc.) is unknown. All other incoming
  registers are simply passed through to the helper.
