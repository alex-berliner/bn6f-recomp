name: object_SetStateHandler_811CC4E
address: '0x0811CC4E'
kind: function
status: confirmed
summary: Reads an object's current state index and stores the matching state-handler pointer from a fixed table
  into the object.
interface: void object_SetStateHandler_ADDRESS(void* obj /* r5 */); returns handler in r0, table base in r1, sets
  C from the index shift; modifies N/Z
details: 'Generic state-machine step for object structs. The object pointer arrives in r5 (a callee-saved register,
  so callers are expected to keep the active object there). It reads the u8 state index at obj+0x04, multiplies
  it by 4 (lsl #2, which also sets carry from bit 30 — effectively always clear for sane state IDs), and indexes
  the handler table at off_811C9C0 (an array of 32-bit code pointers, one per state). The selected handler pointer
  is written to obj+0x0C, the field the object''s update loop presumably later calls through. Both r0 (the handler)
  and r1 (the table base off_811C9C0) are left live on return, and the N/Z flags are clobbered by the load/shift.
  Note the state index is a byte, so the table can hold at most 256 entries; no bounds check is performed, so a
  bad state ID would fetch garbage from beyond the table.

  '
