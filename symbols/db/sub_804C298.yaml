name: sub_804C298
address: '0x0804C298'
kind: function
status: hypothesis
summary: Copies a handful of bytes from the source object (r5) and two halfwords/bytes from the toolkit's render-info
  and unk_2009740 pointers into the scratch buffer at unk_2000AC0, and returns the unk_2009740 pointer in r2.
interface: void sub_804C298(u32* r5_obj, u32* r10_toolkit) -> r2=unk_2009740_ptr; clobbers r0, r3; preserves r5;
  no flag contract.
details: '- Destination is the global scratch buffer at unk_2000AC0 (cached in r3 from off_804C308).

  - Source bytes copied from the r5 object: offsets 0x10, 0x11, 0x13, 0x15, 0x17, 0x18 -> dest offsets 0x0F, 0x11,
  0x13, 0x15, 0x16, 0x17 (note the 0x17/0x16 swap and the 0x18/0x17 swap versus a flat copy, and 0x12/0x14 dest
  slots appear skipped, so this is a selective field copy, not a memcpy).

  - Reads oToolkit_RenderInfoPtr (via r10) and copies halfwords at +0x14 and +0x16 to buf+0x1A/+0x1C (likely X/Y
  size or position related to rendering).

  - Reads oToolkit_Unk2009740_Ptr (via r10) and copies bytes at +2 and +3 to buf+0x18/+0x19, then returns that unk_2009740
  pointer in r2 for the caller.

  - The fields it copies from r5 are non-contiguous (every other byte, with two adjacent pairs), suggesting a small
  packed sprite/obj descriptor being reshuffled into a per-frame render buffer.

  - No flags are set or read; the function is a straight data gather, no branches.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
