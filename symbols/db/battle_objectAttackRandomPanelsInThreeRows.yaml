name: battle_objectAttackRandomPanelsInThreeRows
address: '0x080E9A38'
kind: function
status: probable
summary: 'Object attack: shuffles an alliance-specific byte table (seeded with 0x02) via the primary RNG
  to determine a per-row attack variant, then for each of three rows picks a random panel matching team-specific
  panel-flag criteria (avoiding columns already used) and spawns an attack there via sub_80D1182.'
interface: (r5 = battle object ptr; r0-r3 unused on entry) -> no meaningful return; spawns attack(s) via
  sub_80D1182, consumes primary RNG
details: First shuffles the 3-byte list {2,1,0} at sp+0xC with the primary RNG, giving a random order
  of three attack variants. A per-alliance table (byte_80E9ACC, indexed by oBattleObject_Alliance*8) supplies
  two panel-flag masks (required/forbidden) used for panel searches. Looping rows 1..3, it calls object_getPanelsInRowIgnoreColumnFiltered
  with a column-exclusion value kept at sp (initially 0); if the row yields no panel it falls back to
  object_checkPanelParameters and aborts (stores 0, breaks) if even a bare panel match fails. When panels
  exist it draws GetPositiveSignedRNG modulo the count, takes the packed panel byte from the list at sp+0x10,
  splits it into row nibble (>>4) and column (low 3 bits), and stores the column back to sp so later rows
  skip it. Each hit builds Param1 = (variant * 0x1400) | oBattleObject_Param1 and calls sub_80D1182 with
  the object's Damage field and Element, apparently spawning the attack object at that panel.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl ShuffleByteList_PrimaryRNG on {2,1,0} at sp+0xC randomizes which of three variants fires
    at each step; off_80E9ACC table indexed by oBattleObject_Alliance*8 gives required/forbidden panel-flag
    words passed as r2/r3 to the panel queries; loop ''add r4,#1; cmp r4,#3; ble'' iterates rows 1..3,
    calling object_getPanelsInRowIgnoreColumnFiltered per row; GetPositiveSignedRNG + svc 6 selects a
    random panel entry; lsr #4 / low-3-bit split extracts packed panel coords, column fed back to [sp]
    as the ignore filter; ldrb variant*0x14 <<8 orr''d with oBattleObject_Param1, plus Element and DamageAndStaminaDamageCounterDisabler,
    passed to sub_80D1182 (attack spawner)'
