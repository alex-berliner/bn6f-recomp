  attack
- Exact semantics of the r0 argument to object_getPanelsInRowIgnoreColumnFiltered (column filter vs pointer)
- The shuffle list at sp+0xC is initialized with 0x02 only (str r0,[sp,#0xc]), not the 3-byte {2,1,0}
  claimed in the summary; bytes at sp+0xD and sp+0xE are uninitialized garbage that gets shuffled. Also,
  after a row yields no panel, it falls back to object_checkPanelParameters once, then sets sp to 0 and
  breaks — it does not 'abort (stores 0, breaks) if even a bare panel match fails', since that fallback
  still proceeds to spawn via sub_80D1182. Param1 is computed from a *0x14 byte (mul r3,r2 with r2=0x14=20)
  of the shuffled byte value, not 'variant * 0x1400'. The naming otherwise fits.
