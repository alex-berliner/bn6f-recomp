summary: Thin wrapper that spawns a collision region using position/size fields read from the object struct
  in r5.
interface: (r5 = object struct ptr) -> calls object_spawnCollisionRegion(r0=[r5,#0x12], r1=[r5,#0x13],
  r2=[r5,#0xe], r3=0), with r4=0x405FF01, r6=[r5,#0x2c], r7=3 set before the call; return value passes
  through.
details: 'The function is an 11-instruction wrapper around object_spawnCollisionRegion: it loads three
  bytes from the struct pointed to by r5 (offsets 0x12, 0x13, 0xE — plausibly x, y and a size/shape byte)
  and passes them in r0-r2 with r3=0, so the region''s dimensions and coordinates come from the owning
  object rather than the caller. It also prepares r4 = 0x405FF01 (a packed flag/word constant), r6 = word
  at [r5,#0x2c], and r7 = 3, which are either additional arguments the callee reads from these registers
  or values it expects in callee-saved registers — unusual, suggesting hand-written or non-standard calling
  convention. It preserves r4, r6 and r7 around the call, so it is a self-contained helper. No callers
  are known, so which entity type owns the r5 struct (battle object, trap, etc.) is unconfirmed.'
