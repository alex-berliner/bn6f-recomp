name: battle_slidingObjectStateUpdate
address: '0x080D6C88'
kind: function
status: probable
summary: State handler for a battle object sliding diagonally across panels while leaving a highlighted
  trail; on completion it tests the current panel's flags against an alliance-keyed mask and conditionally
  spawns a type-0 effect with extra params before destroying the object.
interface: (r0 unused on entry, r4 = scratch, r5 = battle object pointer) -> r0 = PlaySoundEffect/spawn
  return; sets object CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY when done
details: 'On phase 0 it sets CurPhase to 4, sets XVelocity to ±0xB0000 based on object_getFrontDirection
  (alliance + DirectionFlip), ZVelocity to +0xB0000 (moves diagonally, X+=vx, Z-=vz each frame), plays
  sound effect 0xC4, and sets Timer to 17. Each subsequent frame it moves the object, and every 8th frame
  (Timer2 bit 2) calls object_highlightPanel on its current PanelX/PanelY, leaving a highlighted trail.
  When Timer expires it reads the panel status flags at its panel coordinates and tests them against a
  per-alliance mask word table at byte_80D6D08: alliance 0 → 0x15800010, alliance 1 → 0x2A800010. If the
  panel matches, it spawns a type-0 effect object using a 12-byte parameter block at object+0x34 (ldmia
  {r1-r3}) and calls sub_80D6D3E. It then sets CUR_STATE_DESTROY regardless of the panel check.'
