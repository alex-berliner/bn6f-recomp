name: battle_pickClosestPanelObject_80E1730
address: '0x080E1730'
kind: function
status: confirmed
summary: Returns whichever of two battle objects is closer to a reference object by panel row, with a helper as
  tie-breaker.
interface: Next battle_pickClosestPanelObjectByRow_80E1730(BattleObject *objA /*r0*/, BattleObject *objB /*r3*/,
  BattleObject *ref /*r6*/) -> BattleObject * /*r0*/; preserves r4, r6, r7; flags clobbered
details: 'Compares the PanelY field (offset 0x13) of the reference object against the PanelY of two candidate objects
  (r0 and r3). If the reference''s row matches exactly one candidate, that candidate is returned immediately: row
  match on r0''s object returns it, row match on r3''s object returns it. If the row matches both candidates or
  neither, it calls sub_80E175C to break the tie, passing the candidates swapped (objB in r0, objA in r1) plus the
  reference in r2, and returns that helper''s r0 result. This looks like the "pick the closest target on my panel
  row" step used by target acquisition for attacks/AI that only consider objects sharing (or nearest to) a row.
  Note r0''s object reads PanelY via the literal 0x13 (same offset as oBattleObject_PanelY); r4 and r7 are used
  as local copies of objA/objB. The chosen object is returned by pointer in r0; r4, r6, r7 are preserved exactly,
  all other registers and flags may be clobbered.

  '
