- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r6,#oBattleObject_PanelY]` reads PanelY from r6 (the reference BattleObject).
    - `ldrb r1, [r4,#0x13]` / `ldrb r2, [r7,#oBattleObject_PanelY]` reads the same byte from r4 and r7.
    - Control paths at loc_80E1748 and loc_80E174C only fall through to `bl sub_80E175C` when the three
    PanelY values are not pairwise equal; sub_80E175C is invoked with (r7, r4, r6) and its return value
    becomes the function''s r0 (final `mov r0, r4` after the bl). - Single caller (sub_80E1704) keeps
    r4/r6/r7 across the call, confirming these are preloaded BattleObject pointers.'
