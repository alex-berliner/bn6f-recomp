name: battle_pickClosestPanelObject_80E1730
address: '0x080E1730'
kind: function
previous_names:
- sub_80E1730
status: probable
summary: Picks the battle object (among r4 and r7) whose PanelY best matches the current object's PanelY
interface: '(r0 = objA, r3 = objB, r6 = refObj) -> r0 = chosenObj ; side effects: none'
details: "Saves the two candidate object pointers in r4/r7. Reads PanelY (offset 0x13) of refObj (r6),\
  \ objA\n  (r4) and objB (r7), the same Y-coordinate byte used by many other panel-comparison helpers.\n\
  \n  - If refObj.PanelY == objA.PanelY, it then checks objB.PanelY. If they match, return refObj;\n \
  \   otherwise return objA.\n  - Else (refObj.PanelY != objA.PanelY), if refObj.PanelY == objB.PanelY,\
  \ swap: make r4 = objB\n    (so objB is treated as the \"first match\"), then fall through to compare\
  \ objA.PanelY against\n    objB.PanelY again. If still unequal, defer to sub_80E175C (r7, r4, r6) which\
  \ appears to\n    actually choose among the two objects by some richer criterion, and return its result.\n\
  \n  Returns the chosen BattleObject pointer in r0.\n"
