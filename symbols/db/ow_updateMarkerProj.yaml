  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The projection of unk_20096A0+0x24 via sub_8003694 happens unconditionally, and the visibility flag
    (r2) gates the sprite-queueing at sub_8006A6C/sub_8006B3A only — Unk2009740 is filled every frame,
    not gated. The two channels aren''t ''pan/zoom''; +4 is an animation progress byte (compared to 0xFF
    and the max at +3), while +0xC looks like a Z/depth value hard-capped at 16<<16 (matching sub_8003694''s
