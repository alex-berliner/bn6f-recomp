  date: '2026-10-19'
  detail: 'ldr r0,[r5,#0x24-...] style: r0=r5+0x24 then bx sub_8003694 with tst r2 visibility check gates
    the draw path; sub_8006A6C/sub_8006B3A results stored to oToolkit_Unk200f3a0_Ptr fields +0/+4 after
    writing bytes 0x3F/+8, 0x17/+0xA; fields +8/+0x14/+0x1C and +0x10/+0x18/+0x20 are clamped velocity/accel/target
    pairs added into positions +4 and +0xC; position +0xC hard-capped at 0x10<<16 and truncated >>16 to
    a byte written into Unk2009740+2; return: cmp [+4],0xFF; return 1 if >=, else 0 — completion flag
    consumed by caller sub_804CB64'
