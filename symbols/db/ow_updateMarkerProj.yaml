name: ow_updateMarkerProj
address: '0x08006990'
kind: function
status: probable
summary: Per-frame coroutine that projects an overworld point to screen, conditionally queues its OAM
  marker when visible, fills an Unk2009740 buffer, advances two fixed-point animation fields clamped to
  per-axis targets, and returns 1 when the progress byte reaches 0xFF.
interface: () -> r0 = 1 when anim field 0x20096A4 reaches 0xFF, else 0; clobbers r0-r3
details: 'Works on a state struct at 0x20096A0: +0x24 is the world-space point passed to the camera projection
  (sub_8003694), whose visibility flag gates the draw. On a visible frame with [+4] < 0xFF it calls sub_8006A6C
  and sub_8006B3A and stores their results into toolkit Unk200f3a0 +0/+4, having set +8=0x3F and +0xA=0x17
  (likely tile/palette for the OAM entry), so this queues the marker''s sprite. It also fills Unk2009740
  bytes with 0x48, 0x37, 0x10 and [+0xC]>>16 each frame. Two 16.16 fixed-point channels advance: velocity
  [+8]+accel[+0x14] clamped to target [+0x1C] is added to position [+4], capped by max byte [+3]; velocity
  [+0x10]+accel[+0x18] clamped to [+0x20] likewise feeds [+0xC], which is additionally hard-capped at
  16<<16. Return value 1 when [+4] >= 0xFF makes this an animation/draw coroutine polled by sub_804CB64.'
