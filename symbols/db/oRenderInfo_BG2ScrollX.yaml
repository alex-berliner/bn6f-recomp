  reproduce: grep -n 'oRenderInfo_Unk_18' bn6f/asm/asm00_0.s | head
  result: '"ldrh r6, [r0,#oRenderInfo_Unk_18] / add r6, r6, r1 / strh r6, [r0,#oRenderInfo_Unk_18]"'
- method: assembly-reading
