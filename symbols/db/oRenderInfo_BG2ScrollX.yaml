name: oRenderInfo_BG2ScrollX
address: '0x18'
kind: struct-field
status: probable
summary: Horizontal background scroll offset (BG2/BG3 layer X), snapshotted from the camera each frame
  and accumulated with camera-delta for parallax/lag.
details: 'In renderInfo_SnapScrollToCamera_8030316 and render_ClearScrollOffsets_8030336, Unk_18 is treated
  as one of three parallel X-axis scroll slots (alongside Unk_10 and Unk_14), each receiving camera_Unk_04
  masked with 0xFF — exactly the GBA BGxHOFF write pattern.

  In camera_applyScrollToBgLayers_8030158, Unk_18 is loaded, added with the camera-delta r1, and stored
  back alongside the matching Unk_1a (Y) — the per-frame scroll lag/parallax accumulator.

  Three BGScrollCB_* functions (BG3Diagonal3to2, BG3SlowRight, BG3FastLeft) compute a shifted counter
  value and write it into Unk_18, identifying it as the auto-scroll target for BG3 X.'
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: SnapScroll writes camera_Unk_04 & 0xFF into Unk_18 alongside the same value into Unk_10/Unk_14
    — the third BG X-scroll slot.
  refs:
  - bn6f/asm/asm00_0.s:3158
  reproduce: grep -n 'oRenderInfo_Unk_18' bn6f/asm/asm00_0.s | head
  result: '"strh r1, [r3,#oRenderInfo_Unk_18]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Camera scroll callback loads Unk_18 and adds the per-frame camera-delta — confirms it is an
    accumulated horizontal scroll offset, paired with Unk_1a as its Y twin.
  refs:
