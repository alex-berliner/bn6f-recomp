name: battle_checkEnemySameRowNearTarget
address: '0x0810AC38'
kind: function
status: probable
summary: 'Battle-side condition check: finds the closest enemy battle object, and if no blockers exist,
  the enemy is on the same row and within half a panel of this object''s x-position, stores it as a target
  and returns 1.'
interface: (r5 = source battle object, r7 = caller work struct) -> r0 = 1 if a target was found and stored
  at [r7,#0x2c], else 0
details: 'First it tests the latch [r5,#0x6c]: if set it just clears the latch and returns 0, so the check
  only fires once per latch set. It then reads the object''s flag word via object_getFlag and bails out
  (return 0) if any of the bits in 0xa000 are set, and also bails if FindBattleActorsWithNonzeroParam_ReturnCountAndSum(0x60,
  0xd, 0x12) reports any matching actors. Otherwise it calls battleObject_findClosestEnemyBattleObject
  with the panel coordinate [r5,#0x16] XOR 1, compares the found object''s [#+0x13] (row/panel-y) with
  the source''s, and requires |found[#0x38] - src[#0x38]| <= 0x8000 (i.e. x-positions within half of 0x10000).
  On success the found object pointer is written to [r7,#0x2c] and 1 is returned; all failures return
  0 without writing.'
