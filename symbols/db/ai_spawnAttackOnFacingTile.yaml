  reproduce: python3 tools/asmcat.py 0x081036A6
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The name and flow are essentially correct: the wind-up sets AttackElement=4, anim=9, plays 0xCF,
    runs sub_80C47EC, sets StepTimer=5; the spawn step waits, computes target tile with PanelX+object_getEnemyDirection,
    calls sub_80CF778, and sets HitElement=0x14. The proposal correctly captures the code. Minor nit:
    ''on fire'' in the interface comment is wrong since HitElement=0x14 is just written but not asserted
    to mean fire; better to say it''s the hit element the spawned attack uses. Also calling it ''attackStepSpawnTargetTile''
    is fine but ''ai_spawnTargetTileAfterWindup'' is more descriptive.; run wf investigate investigate-20261018-200615;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
