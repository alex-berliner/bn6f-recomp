name: ow_clearMapObjectsField64
address: '0x080049BA'
kind: function
status: probable
summary: Clears the word at offset 0x64 of all 56 overworld map objects (likely a per-object counter/timer
  reset).
interface: () -> void; no return value, flags clobbered
details: Iterates r0 from 0 to 0x37 (56 objects), walking a base pointer by 0x78 bytes per object — matching
  the eOverworldMapObjects entry size — and stores 0 at base+0x40+0x24 = offset 0x64 of each entry. That
  is the only thing it does; nothing else in the loop is touched. The remaining literal-pool words (eActiveOverworldMapObjectsBitfield,
  dword_2013920, eOverworldMapObject55) are not referenced by this function's code and appear to be pool
  entries shared with or adjacent to neighbouring functions; eOverworldMapObject55 (= base + 55*0x78)
  confirms the 0x78 stride interpretation. With no known callers, the semantic meaning of field 0x64 (timer,
  animation counter, state) is unknown.
