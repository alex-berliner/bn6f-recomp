name: ai_attackStateStep_810A080
address: '0x0810A080'
kind: function
status: confirmed
summary: Per-frame step of an AI opponent's attack state; starts a version-specific attack on the first tick and
  tears down the AI state once the attack finishes.
interface: void ai_attackStateStep_810A080(AIData* r4 /*owner*/, AIState* r6, AIAttackVars* r7); // clobbers r0-r2,
  lr, flags; r0 returns 4 on init path or 0 on teardown
details: 'r4 is the AI data block (version field at +0x16), r6 the AI state struct (current state at +0, substate
  counter at +2), r7 the AI attack variables. First tick (state subfield +2 == 0): installs the per-attack step
  handler sub_810A21A into Unk_28 of the attack vars, reads this game version''s attack id from byte_8109F46[version]
  into Unk_18, calls object_setAttack0(10) to start the attack, and sets the substate counter to 4. On later ticks
  the attack''s own handler has already run: if its phase flag Unk_1a is clear the AI transitions to state 12 (attack
  finished but something still pending, substate reset to 0), otherwise the whole AI state is cleared to 0 so a
  new action can be chosen. Returns 4 (init) or 0 (teardown) in r0 with NZ reflecting it. The version-indexed attack
  id suggests the same AI routine serves different attack tables per game version (Falzar/Gregal).

  '
