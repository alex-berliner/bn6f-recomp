name: battle_onFrameFlagStartNextPhase
address: '0x080C32F4'
kind: function
status: probable
summary: Checks the current animation frame's attribute byte; when its 0x80 bit is set, moves the battle
  object to animation 1 with a 60-frame timer and phase 4.
interface: (r5 = battle object; r0 clobbered by call) -> r0 = attribute byte from sprite_getFrameParameters;
  no meaningful return
details: Calls sprite_getFrameParameters, which returns the current frame's attribute byte in r0. If bit
  0x80 of that byte is clear the function returns without touching the object. Otherwise it stores 1 into
  the object's CurAnim field, stores 0x3C (60 frames) into its Timer, and sets CurPhaseAndPhaseInitialized
  to 4, advancing the object into a new behavior phase after a flagged animation frame plays. The object
  pointer lives in r5, so the caller must have it in r5 before calling; the function has no visible parameters
  of its own.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl sprite_getFrameParameters then tst r0,#0x80 gates the whole body (asm lines 2-4); strb r0(=1),[r5,#oBattleObject_CurAnim]
    switches the object''s animation; strh #0x3C,[r5,#oBattleObject_Timer] gives a 60-frame wait in the
    new phase; strh #4,[r5,#oBattleObject_CurPhaseAndPhaseInitialized] sets the next phase; early return
    path leaves the object untouched when the flag bit is clear'
