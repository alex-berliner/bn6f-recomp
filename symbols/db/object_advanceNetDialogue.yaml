  detail: 'bl sub_803CB00 #1 / bl sub_803A558 / bl sub_803CB18 #2 gate the transition branch (asm 0x08039C38-0x08039C42);
    strb #0x1c,[r5,#1] writes the object state byte; sub_803BB7C(0x1e) stores obj+0x28 (known callee summary); mov
    r0,#0xe; bl sub_803BB2C launches network text script 0xE per callee''s known summary; sub_803A5F4(0x66) then
    lsl r0,#2 + ldr pc-relative table: a timer/counter dispatch into dword_8039C8C; Tail: bl sub_803A104 then bl
    sub_803CB0C(1), symmetric with the opening sub_803CB00(1)'
