name: object_advanceNetDialogue
address: '0x08039C32'
kind: function
status: probable
summary: 'Object advance-phase routine: passes a sequence of checks, then sets object state to 0x1C, stores 0x1E
  at object+0x28, runs net text script 0xE; otherwise dispatches via timer-based table sub_803A5F4(0x66) before
  tail-calling sub_803A104.'
interface: (r5 = object pointer, r0 = check selector on entry) -> r0 = 0 or 1; sets object state byte [r5+1] and
  field [r5+0x28]
details: 'The routine is a small state-machine step: it first probes sub_803CB00(1) and sub_803A558, then sub_803CB18(2);
  if any check fails it goes straight to the tail call sub_803A104 and returns 1. When sub_813D638 reports 0, it
  calls sub_803C320, writes state 0x1C to the object''s state byte at r5+1, stores 0x1E into the object at offset
  0x28 via sub_803BB7C, clears something with sub_803BB90(0), and kicks off network-related text script 0xE via
  sub_803BB2C. Otherwise it polls sub_803A5F4(0x66), and on a nonzero result indexes dword_8039C8C (entry 0 = null/keep,
  entries 1-2 = two identical handlers sub_8039CB4) as a tail call with a bl-style LR. The 0x66 comparison looks
  like a wait-timer threshold; the shared second handler suggests two timer outcomes behave identically.'
