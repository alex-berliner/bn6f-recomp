name: chatbox_stepState_8049984
address: '0x08049984'
kind: function
status: confirmed
summary: Drives one tick of the chatbox state machine, branching to a "done" phase or a fade-out phase
  based on chatbox state and an eFlags bit.
interface: void chatbox_stepState_8049984(struct ChatboxStateObj *r5, void *r10)
details: "Called with r5 pointing to a small state object whose byte at offset 0x1 is the\nnext-phase\
  \ slot. First checks chatbox flags via chatbox_mask_eFlags2009F38(0x80):\nif that bit is already set\
  \ the function skips the branch logic and jumps\nstraight to the epilogue call sub_803A820 (likely the\
  \ chatbox per-frame\nhandler that also advances the phase). Otherwise it queries the current\nchatbox\
  \ state with chatbox_GetState_8045F4C:\n  * state != 0 -> writes 0x28 to byte [r5+1] (chatbox still\
  \ open, advance\n    to a \"close\" / next phase 0x28).\n  * state == 0 -> calls SetScreenFade(0x0C,\
  \ 0x10) to begin a fade and\n    writes 0x3C to byte [r5+1] (advance to a fade-then-done phase 0x3C).\n\
  The 0x80 flag test acts as a one-shot guard so the transition only fires\nonce. Returns via sub_803A820,\
  \ which is the routine that actually consumes\nthe new phase byte. r10 is unused inside this function\
  \ (purely passed through\nper the caller contract).\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
