name: tickLogoScreenFade_803D274
address: '0x0803D274'
kind: function
status: confirmed
summary: 'Per-frame logo screen tick: only advances state when the screen fade finishes.'
interface: void sub_803D274(LogoScreenState *state /* r5 */)
details: 'Called each frame from the logo-screen dispatcher (`logoScreen_dispatch_803D1CA`).

  Polls `IsScreenFadeActive`; if a fade is still in progress the function returns

  unchanged. Otherwise it decrements the u8 countdown at `state->oLogoScreenState_Counter`

  (offset 4); while positive it simply returns the post-decrement value, but once it

  reaches zero it kicks off the next fade stage via `SetScreenFade(0x0C, 0x10)` and

  rewrites `state->oLogoScreenState_Index_00` (offset 0) with `0x0C`, causing the

  dispatcher''s `r0 = 0x0C` arm to be selected on the next call. The `.word 0x3FF`

  after the `pop {pc}` is the standard RN-literal slot used by the disassembly''s

  `ldr Rn,=…` macro and is not executed. Five registers (`r5`) are preserved; the

  rest are clobbered through the two external calls.

  '
