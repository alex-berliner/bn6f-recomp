name: object_stepGlideToPanel
address: '0x080D3B4E'
kind: function
status: probable
summary: Per-frame step of a battle object gliding along one axis (chosen by Param3 bit 0) toward a target
  panel, ending the phase when the step handler says so.
interface: (r5 = battle object) -> void; on completion writes CurAction=8 and CurPhase=0 into the object
details: 'On first run it calls an init helper (sub_80D3EE8) and marks PhaseInitialized=4. Each call it
  converts the object''s PanelX/PanelY to pixel coordinates via object_getCoordinatesForPanels, then integrates
  XVelocity into X and YVelocity into Y. Param3 bit 0 selects the movement axis: the target is that axis''s
  panel-derived pixel coordinate (r4) and the integrated position on that axis (r6) is compared against
  it. While not yet at the target, it calls sub_800E708(pos, target, otherCoord) and, if that passes,
  sub_80D3DFA(0); a nonzero result there aborts the glide by setting CurAction=8 and clearing the phase
  word. Otherwise (target reached, no crossing, or step handler returned 0) it just resyncs via object_setPanelsFromCoordinates
  and object_updateCollisionPanels, keeping the phase alive.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb PanelX/PanelY + bl object_getCoordinatesForPanels computes the target pixel coordinate
    (r4) for one axis; ldrb Param3; lsr r6,#1; bcc branches pick X (bit0=1) or Y as the glide axis; XVelocity/YVelocity
    are added into X/Y every call, i.e. per-frame positional integration; cmp r4,r6 + bl sub_800E708/sub_80D3DFA(0)
    decide when the glide toward the panel ends; completion path stores #8 to oBattleObject_CurAction
    and #0 to CurPhaseAndPhaseInitialized'
  refs:
  - bn6f/asm/asm31.s:60387
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x0800E2AC object_setPanelsFromCoordinates
  - 0x0801A04C object_updateCollisionPanels
  reproduce: python3 tools/asmcat.py 0x080D3B4E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-235109'
open_questions:
- no known caller, so the object kind and which Param3 value triggers which axis is unconfirmed
- sub_800E708 and sub_80D3DFA are unnamed; sub_80D3DFA's nonzero return semantics (arrival vs. blocked)
  determine the exact stop condition
