name: object_delayedSoundAndAnims
address: '0x08038DE0'
kind: function
status: probable
summary: Object step callback that, once a frame-countdown at [r5+4] expires, plays sound 0x100, starts
  two GFX anim scripts, and rearms the timer.
interface: (r0 = unused/ignored, r5 = object struct) -> r0 = destroyed; no meaningful return
details: Decrements the halfword timer at r5+4 each call; when it reaches 0 it plays sound effect 0x100,
  runs LoadGFXAnim on two anim scripts (byte_803891C and byte_80389AC, 0x90 bytes apart in the same anim-script
  pool), then re-arms the timer to 0x2E frames and writes state byte 0x24 to r5+2. While the countdown
  is nonzero it does nothing, so it acts as a one-shot delayed action that repeats every 0x2E frames thereafter.
  The r5 layout (halfword timer at +4, byte state at +2) matches the standard field/object actor struct.
  No caller is known, so it is presumably referenced from a callback/handler table.
