    with off_8038E10 = 0x100 — fixed sound ID fired on expiry; two bl LoadGFXAnim with byte_803891C /
    byte_80389AC — starts two anim scripts; strh #0x2E,[r5,#4] and strb #0x24,[r5,#2] — rearm timer and
