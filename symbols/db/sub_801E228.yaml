name: sub_801E228
address: '0x0801E228'
kind: function
status: confirmed
summary: Draws a scripted message/text window onto the eStruct2035280 VRAM target for a given display mode, falling
  back to a default mode when the caller passes 2.
interface: 'u8 mode /* r0, rewritten to 0x13 when == 2 */;

  r4..r7 preserved; flags clobbered (nz/c/v).

  '
details: 'Operates on the global eStruct2035280 ("eStruct") at 0x2035280, whose layout begins with

  a flags word at +0x40. The function checks bit8 (0x100) of that flags word and, if set,

  first drains that request by calling dispatch_801DACC(0x100), which presumably completes

  any pending eStruct sub-task that exposes the 0x100 flag.


  It then sets eStruct timers/counters at +0xB = 0x3C (=60, likely a frame countdown or

  fade-in delay) and +0xC = 0 (paired field, probably an index or step counter).


  It renders TextScript86F0374 (the standard text-drawing script blob at 0x86F0374) into

  the VRAM tile buffer at byte_203C4E0, using palette/attr 0x6009560, ASCII-speed 0x11,

  arrow/mode 1, font-table pointer A_dword_86B7AE0, and r7 = 0; r0 carries the mode

  (the rewritten 0x13 value when caller passed 2). The mode argument selects which of the

  text script''s variants (size, color, etc.) is used.


  Finally it requests bit8 via eStruct2035280_SetRequestBits_801BECC(0x100) and dispatches

  the same bit through dispatch_801DA48(0x100), which kicks off the eStruct task that

  will present the freshly drawn text. In essence this is the "draw + queue" entry point

  for an eStruct message slot whose render target is byte_203C4E0.

  '
