name: battle_setupObjectSpriteAnim
address: '0x0801BE2A'
kind: function
status: probable
summary: Loads a sprite and its animation data onto the battle object in r5 from a packed word argument,
  then applies the shadow flag and current facing flip.
interface: '(r0 = packed: byte0 = sprite id, byte1 = anim id for oBattleObject_CurAnim, byte2 = sprite_load
  arg, byte3 = shadow flag) -> r0 = 1; object passed in r5'
details: 'Unpacks r6 = r0: byte2 and byte0 are passed to sprite_load (r0 = 0x80 as a fixed first argument,
  likely a bank/flags selector), then sprite_loadAnimationData is chained. Byte3 selects shadow rendering:
  nonzero calls sprite_hasShadow, zero calls sprite_noShadow. Byte1 is stored to oBattleObject_CurAnim
  and 0xFF to oBattleObject_CurAnimCopy (forcing an anim restart). Finally object_getFlip''s result is
  fed to sprite_setFlip so the sprite matches the object''s effective facing, and the function returns
  1. The stale references off_801BE68/off_801BE6C (PanelOffsetListsPointerTable, byte_8019C34) appear
  to be pool data misattributed to this tail, not code.'
