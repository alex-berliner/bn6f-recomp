  date: '2026-10-18'
  detail: 'sub_801BE2A: r1/r2 extracted from r6 bytes 2/0 and passed with r0=0x80 to sprite_load, then
    sprite_loadAnimationData; sub_801BE2A: lsr r0,r6,#0x18; tst; beq picks sprite_hasShadow vs sprite_noShadow
    (byte3 = shadow flag); sub_801BE2A: byte1 stored to [r5,#oBattleObject_CurAnim] with 0xFF to CurAnimCopy;
    sub_801BE2A: object_getFlip result passed straight to sprite_setFlip; All callees operate on the battle-object
