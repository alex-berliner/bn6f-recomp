name: submenuDispatchTypeUpdate
address: '0x0811B338'
kind: function
status: probable
summary: Dispatches to a per-type update handler for a submenu object, tail-calling one of three handlers
  from off_811B34C based on the type byte at [r5,#8].
interface: (r5 = object struct; type id at [r5,#8]) -> tail-calls handler from off_811B34C with r6 = sSubmenu
details: 'Loads the sSubmenu pointer into r6, then reads the byte at [r5,#8] as a type index into the
  3-entry jump table off_811B34C and long-branches (mov lr, pc; bx) to that handler: sub_811B35C, object_dispatchTypeUpdate,
  or sub_811B3EC. It is a pure dispatcher — no logic of its own — following the same dispatchTypeUpdate
  pattern as the known object update dispatcher. Handlers receive the object pointer in r5 and the submenu
  context in r6 (Thumb handlers, since entries are +1).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: off_811B34C holds three handler pointers (sub_811B35C, object_dispatchTypeUpdate, sub_811B3EC)
    indexed by [r5,#8]; ldr r6, off_811B358 (=sSubmenu) sets up shared context before the dispatch; mov
    lr, pc; bx r0 is the standard long-call tail dispatch into Thumb handlers; known callee object_dispatchTypeUpdate
    mirrors the dispatchTypeUpdate naming pattern
  refs:
  - bn6f/asm/asm32.s:27644
