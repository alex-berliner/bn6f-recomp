  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches: it loads sSubmenu into r6 (which is a non-volatile caller-saved in the callees''
    ABI, but that''s the handler''s contract), reads type at [r5,#8], indexes off_811B34C, and tail-calls
    the handler (mov lr, pc; bx r0). The summary and name are accurate, but the prefix should follow convention.
    Since it''s a dispatcher for submenu objects, ''submenu'' is a valid prefix, but the handler chain
    (object_dispatchTypeUpdate as one of the entries) suggests it''s an object-level dispatch. A clearer
    name following the prefix rules: submenuObjectDispatch. Wait — re-reading the rules: lowerCamel with
    a prefix from the list. The existing function is named ''object_dispatchTypeUpdate'' (snake_case),
    but the proposed prefix list uses lowerCamel. I''ll keep it consistent as submenuDispatchTypeUpdate
    is fine, but the summary could note that r6 being set is for callee use rather than argument passing.;
    run wf investigate investigate-20261019-055111; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
