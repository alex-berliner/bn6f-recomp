name: chatbox_fadeGuardThenRunState_8126DF8
address: '0x08126DF8'
kind: function
status: confirmed
summary: If a screen fade is active, clears a chatbox EFlag and marks the chatbox hidden, then tail-calls
  the chatbox state handler.
interface: void sub_8126DF8(uint8_t *r5 /*chatbox struct*/, r2 r4 r10 /*passed through to sub_81272C4*/)
details: "- r5 is treated as a chatbox struct pointer; its byte at offset +2 is the chatbox state.\n-\
  \ Calls IsScreenFadeActive(); when it returns non-zero (Z clear, fade active):\n    * Calls chatbox_clear_eFlags2009F38(0x40)\
  \ to clear the chatbox eflag bit 0x40.\n    * Stores 4 at r5+2, i.e. sets chatbox state byte to 4 (\"\
  hidden\" per the comment).\n- Otherwise does nothing to the chatbox.\n- Then tail-calls sub_81272C4\
  \ (popping LR into PC), which is the per-state chatbox handler;\n  r0-r7, lr, flags are clobbered there,\
  \ while r4 and r5 are preserved across this function.\n- Layout note: chatbox struct +2 is the state/visibility\
  \ byte; chatbox eflags live at 0x02009F38.\n"
