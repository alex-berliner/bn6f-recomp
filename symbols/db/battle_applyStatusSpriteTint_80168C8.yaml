name: battle_applyStatusSpriteTint_80168C8
address: '0x080168C8'
kind: function
status: confirmed
summary: Tints the current battle object's sprite with the color shader only when it has status flag 0x800, choosing
  no-tint/full-tint from a bit of battle_getStateUnk40_800A704.
interface: void sub_80168C8(void); // reads r5 (battle object/state context) and r10 (frame/state pointer?); returns
  r3 plus NZC flags from the flag test path; calls object_getFlag, battle_getStateUnk40_800A704, sprite_setColorShader
details: 'Calls object_getFlag() on the current battle object and tests status bit 0x0800; if clear, the function
  returns immediately without touching the sprite. If set, it calls battle_getStateUnk40_800A704, masks the result
  with 2 (bit 1, used as a byte offset 0 or 2 to select a halfword), and indexes the halfword table dword_80168EC
  = { 0x0000, 0x03FF }: 0x0000 means no tint, 0x03FF means full tint. The selected value is passed to sprite_setColorShader
  to tint the object''s sprite. The 0x800 status flag combined with a binary on/off tint driven by battle state
  looks like a status-condition visual effect (e.g. a flash/blink tint toggled per frame by the state bit). r5 is
  the object/context argument consumed by object_getFlag and r10 is read by battle_getStateUnk40_800A704 (or its
  callees). Quirk: the tint value is a raw 10-bit color mask (0x3FF = all color channels), not an index.'
