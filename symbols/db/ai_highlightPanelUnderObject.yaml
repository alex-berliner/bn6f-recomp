    panel position; mov r2,#9: fixed highlight/region id passed to object_highlightPanelRegion; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip]:
    side/flip argument for the highlight; caller ai_chargeAndStrikeStep ''slams down, cracks the panel
    under it and registers the damage hit'' — matches a crack-panel highlight on the final attack tick;
