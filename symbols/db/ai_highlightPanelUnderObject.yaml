name: ai_highlightPanelUnderObject
address: '0x080F38D0'
kind: function
status: probable
summary: Requests a panel highlight (region type 9, likely the crack effect) at the battle object's current
  panel coordinates.
interface: (r5 = battle object) -> r0 = object_highlightPanelRegion result; no flags used
details: Reads the object's PanelX and PanelY fields, passes them with region id 9 and the object's AllianceAndDirectionFlip
  halfword to object_highlightPanelRegion. Its only caller is ai_chargeAndStrikeStep, which on its final
  tick slams down, cracks the panel under the object and deals damage — so this marks that cracked/attacked
  panel (id 9 presumably selects the crack highlight). The AllianceAndDirectionFlip argument likely tells
  the highlight routine which side the panel belongs to or which palette to use. The function is a thin
  wrapper; everything substantive happens in object_highlightPanelRegion.
