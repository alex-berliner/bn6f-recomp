name: battle_setObjectFlag10Param24
address: '0x080DBEA2'
kind: function
status: probable
summary: Marks the object returned by the object-lookup helper with flag 0x10 and sets its Param2 to 4
interface: (r0 = ?, r1 = ? -> via sub_80DBE82 lookup) -> r0 = lookup result (clobbered); modifies oObjectHeader_Flags
  |= 0x10 and oBattleObject_Param2 = 4 on that object
details: First calls sub_80DBE82, whose r0 result is treated as a pointer to an object header; if it is null the
  function does nothing. Otherwise it reads oObjectHeader_Flags, ORs in 0x10, and stores it back, then writes the
  immediate value 4 into oBattleObject_Param2. No other fields are touched and the result of the store is not returned.
  The caller sub_80E8BE2 computes a value from oBattleObject_Z16Save plus oBattleObject_DamageAndStaminaDamageCounterDisabler
  and loads oBattleObject_Element into r2 before calling, so the marking likely depends on battle state computed
  elsewhere (arguments r0/r1 are inherited from the caller's own inputs, not set in the visible fragment). The meaning
  of flag 0x10 and Param2=4 is not established by the shown code.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80DBEA2: ''bl sub_80DBE82; cmp r0,#0; beq locret'' — result is an object pointer, null-checked; sub_80DBEA2:
    ''ldrb r1,[r0,#oObjectHeader_Flags] ... orr r1,0x10 ... strb'' — sets flag bit 0x10; sub_80DBEA2: ''mov r1,#4;
    strb r1,[r0,#oBattleObject_Param2]'' — writes Param2 = 4; caller 0x080E8BE2: reads oBattleObject_Z16Save, damage
    counter and oBattleObject_Element, then ''bl sub_80DBEA2'' — battle-state context for the marking'
