open_questions:
- What sub_80DBE82 looks up (which object it returns) would identify the target
- What flag 0x10 in oObjectHeader_Flags means (invisible? flagged-for-effect?) and what Param2=4 selects (animation/state?)
- How the caller's element/damage-counter values relate to the r0/r1 arguments passed in
