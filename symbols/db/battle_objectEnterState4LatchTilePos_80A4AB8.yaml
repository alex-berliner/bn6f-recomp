name: battle_objectEnterState4LatchTilePos_80A4AB8
address: '0x080A4AB8'
kind: function
status: confirmed
summary: Sets a battle object's state to 4, snapshots its current tile coordinates into its position fields, and
  continues with the follow-up state handler.
interface: void battle_objectEnterState4LatchTilePos(BattleObj* r5) — r5 in only; r0-r3 and flags clobbered, r4/r6-r8/r10
  preserved
details: 'r5 points to a battle-side object structure. The routine stores the byte 4 at

  offset +0x08 (the object''s state/state-machine field), then latches the object''s

  tile coordinates — the byte at +0x05 (x or y tile coord) is widened and written to

  the 32-bit field at +0x24, and the byte at +0x06 is likewise written to +0x28.

  These +0x24/+0x28 fields act as the object''s current (latched) position, likely

  in subtile/pixel units used by movement or interpolation code. Finally it falls

  through into sub_80A4ACC, the handler that continues the state-4 behavior; r0

  still holds the last-read coordinate (+0x06 value) when that call is made, which

  the callee may rely on. The tail is a bl+pop, so this function is only ever

  entered as a call, never by fall-through.

  '
