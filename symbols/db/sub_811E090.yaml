open_questions:
- Exact semantic of bit 1 of [r5] (a flag byte within ObjectSprite or ObjectHeader) is unknown; the 0x040c return
  value hints it ends up related to SpriteOffset=4 packing but the meaning ("hidden") is inferred from "toggling"
  + "set fixed coords" + "update" sequence, not from a symbol. Identifying the exact bit field (OBJECT_FLAG_VISIBLE
  in ObjectHeader or an Unk in ObjectSprite) would settle it.
