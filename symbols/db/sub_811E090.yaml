name: sub_811E090
address: '0x0811E090'
kind: function
previous_names: []
status: hypothesis
summary: 'Beast-out battle object per-frame hook: toggles a flag bit on the object''s header flags based on its
  element, then sets sprite coords to (0xbc, 0xa) and runs sprite_update.'
interface: (r5 = battleObjectPtr, r6 = AIDataPtr) -> r5 = battleObjectPtr ; side effects write to *(r5+0), sprite
  coords and sprite state via r5
details: "- Reads byte [r5] into r4 (object header flags at offset 0).\n  - Reads byte [r6+0xe] (AIData.Element\
  \ at offset 0xe) into r0.\n  - If Element != 0, clears bit 0x02 in r4 (bic r4, r1 where r1=#2); otherwise sets\
  \ it (orr r4, #2).\n  - Stores updated r4 back to [r5] (header flags).\n  - Loads r0=0xbc, r1=0xa and calls sprite_setCoordinates(r5,\
  \ 0xbc, 0xa).\n  - Calls sprite_update(r5).\n  - Tail-call style with push {lr} / pop {pc}.\n  - Caller is sub_811E048\
  \ which appears to iterate or dispatch BeastOut-style battle-object updates (route covers 40 calls in the beast-sp\
  \ snap).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r4, [r5]` and final `strb r4, [r5]` show r5 is the BattleObject pointer and the flag byte at
    offset 0 is being mutated. - `ldrb r0, [r6,#0xe]` matches AIData.Element (offset 0xe in the AIData struct).
    - `bic r4, r1` (r1=#2) / `orr r4, #2` toggle the bit-0x02 of header flags based on Element==0. - `bl sprite_setCoordinates`
    with r0=0xbc, r1=0xa moves sprite to fixed coords (0xbc, 0xa). - `bl sprite_update` afterwards refreshes sprite
    state. - Caller sub_811E048 has matching contract in r5/r6/lr and calls this with r5/r6 set up for one battle
    object.'
