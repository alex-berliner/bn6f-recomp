name: sub_811E090
address: '0x0811E090'
kind: function
previous_names: []
status: hypothesis
summary: For a battle object, toggles a "hidden by shadow" flag on its ObjectSprite based on byte 0xE of the BattleObject,
  then sets sprite coords to (0xbc, 0x0a) and runs sprite_update.
interface: '(r5 = BattleObjectPtr, r6 = ?) -> r0 = 0x040c ; side effects: writes battle object byte at [r5], sprite
  pos, sprite state'
details: "1. Loads r4 = byte at [r5]; r0 = byte at [r6+0xe].\n  2. If r0 != 0: bic r4, #2 (clears bit 1 of r4).\
  \ Else: orr r4, #2 (sets bit 1).\n  3. Stores r4 back to [r5].\n  4. Sets sprite coordinates via sprite_setCoordinates(r5,\
  \ 0xbc, 0x0a) — based on the sprite_update contract, this writes x/y to ObjectHeader+2 sub-entry (SpriteOffset\
  \ high nibble) of [r5].\n  5. Calls sprite_update(r5) to advance sprite state.\n  6. Returns via pop {pc} (tail-call\
  \ style).\n  The action on [r6+0xe] being zero vs nonzero toggles a single bit (0x02) in whatever byte [r5] points\
  \ to; combined with the snap calls (entry r0 often = 0x040c), this looks like a \"hide/show shadow sprite\" toggle.\
  \ r5 is consistent with a BattleObject pointer (matches sprite_update contract), and r6 with an AIData-style struct\
  \ (the caller sub_811E048 takes r1/r5/r6 and r5 is preserved into here).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r4, [r5]` then conditional `bic r4, #2` / `orr r4, #2` modifies bit 1 of a flag byte at [r5].
    - `ldrb r0, [r6,#0xe]` is the condition; tested with `tst r0, r0; beq loc_811E0A0`. - `mov r0, #0xbc; mov r1,
    #0xa; bl sprite_setCoordinates` writes a fixed (x=0xbc, y=0x0a) pos to the sprite sub-entry. - `bl sprite_update`
    advances sprite per-frame state. - All captured-call exits have r0=0x040c, matching the high nibble 0x04 (SpriteOffset=4)
    returned by the sprite coords update pattern. - Sole caller sub_811E048 takes r5/r6 in and preserves them, consistent
    with passing a BattleObject (r5) and a sibling/AI struct (r6) through.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0811E090

    '
  result: the body read as described above
