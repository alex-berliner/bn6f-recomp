open_questions:
- Exact meaning of toggling OBJECT_FLAG_VISIBLE (bit 0x02) based on Element==0 is unclear — why would visibility
  depend on the actor's element?
- The fixed coords (0xbc, 0xa) look like a "beast-out" staging position rather than real field coordinates; need
  a code/data reference (e.g., animation script) to confirm.
- Whether r0's exit value 0x40c (from the snapshots) is meaningful or just residue from the sprite routines is unknown.
