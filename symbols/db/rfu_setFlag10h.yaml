name: rfu_setFlag10h
address: '0x0813D8D0'
kind: function
status: probable
summary: Sets bit 0x10 in the RFU wireless shared-state flags word before the caller sends link command
  0.
interface: () -> r0 = 1 (from rfu_orFlags); clobbers lr; no arguments
details: 'A one-line wrapper: it calls rfu_orFlags with r0 = 0x10, which ORs bit 0x10 (bit 4) into the
  flags word at offset 0xC of the RFU/wireless shared state structure at 0x200BC50 (eS200BC50). Its only
  caller (sub_81475D4) invokes it in the branch where byte_200AF85 != 1 — i.e. the wireless connection
  is not in the expected state — immediately before calling rfu_setLinkCommand(0), so the flag likely
  signals a link state to the wireless partner as part of connection teardown/error handling. The callee
  rfu_orFlags already knows the structure and offset, so no new structure is introduced. Return value
  is whatever rfu_orFlags returns (its success flag). No other fields or structures are touched.'
