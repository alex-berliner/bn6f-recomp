name: menu_onStartPressBeginTransition_802F7E8
address: '0x0802F7E8'
kind: function
status: confirmed
summary: On a menu screen, while Start is held, clears the screen's work area, plays the select sound, stores the
  next state (0x0C) in the caller's object, and preloads the two GFX animation scripts for the follow-up screen.
interface: 'void sub_802F7E8(void); // in: r5 = caller''s object (state field at +1), r10 = toolkit ptr (copied
  to r7 for callees); out: state byte set to 0x0C, r10 possibly updated by LoadGFXAnim'
details: 'Per-frame handler for one menu screen. Reads the held-key halfword (+2) from the joypad struct pointed
  to by the toolkit''s joypad-pointer field (oToolkit_JoypadPtr, offset 4 in the toolkit). If bit 3 (Start) is held:
  calls zeroFill_813D960, which wipes a work area located via the toolkit pointer in r7 (also reads r5/r10), then
  writes state 0x0C into the caller''s object at r5+1 (signalling the switch to the next screen), plays SOUND_SELECT_67
  via PlaySoundEffect, and loads two GFX animation scripts (byte_802F2E4 and dword_802F334) via LoadGFXAnim — the
  graphics the next state draws with. r7 is set to r10 unconditionally so callees see the toolkit pointer on both
  paths. Quirk: r1 still holds the 8 (tst mask) when PlaySoundEffect is called, so PlaySoundEffect reads it.

  '
