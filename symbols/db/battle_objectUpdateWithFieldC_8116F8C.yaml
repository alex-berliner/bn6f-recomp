name: battle_objectUpdateWithFieldC_8116F8C
address: '0x08116F8C'
kind: function
status: confirmed
summary: Update hook for a battle object in r5 that runs a paired "before" update routine, then re-invokes the follow-up
  routine with the object's halfword field at +0xC as its argument.
interface: void sub_8116F8C(r4=r4, r5=objectPtr, r6=r6, r7=r7); clobbers r0-r3 and flags (returns whatever sub_81170C0
  leaves); preserves r4-r7
details: Three-instruction wrapper, almost certainly reached through an object/function-pointer table, which is
  why the contract records the full r4-r7 context even though only r5 is read here. It first tail-loads nothing
  itself but calls sub_81170AC with the incoming registers untouched (likely the object's per-frame "pre" update,
  using r5 as the object pointer). It then loads the 16-bit field at objectPtr+0xC into r0 and calls sub_81170C0,
  which likely consumes that halfword as a state/step/counter value for the "post" phase. All outgoing register
  values and NZCV flags are simply whatever sub_81170C0 leaves behind; the wrapper itself sets nothing. The exact
  meaning of the +0xC halfword (timer, script step, sub-state) is not established from this function alone.
