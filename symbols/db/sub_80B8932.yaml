open_questions:
- The unreachable `bl object_freeMemory` just before `pop {r4,r6,pc}` looks like a code-gen artifact; whether this
  is a typo for an alternate free path or genuinely dead cannot be settled from this function alone.
- sub_80030BA's semantics are not characterised here — its return is treated as a signed (r0:r1) 32.16 pair with
  only the high word scaled by facing, which matches `lsl r0,#16; mul r0,r6` but assumes the lower 16 bits of r0
  are 0 (otherwise they'd shift into the high half after the lsl).
- Whether the related object is the parent (e.g. a held/equipped object riding on the player) or a child is not
  provable from this snippet — the directionality is inferred from "promote r4 onto r5".
