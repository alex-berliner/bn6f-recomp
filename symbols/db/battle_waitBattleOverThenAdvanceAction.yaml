name: battle_waitBattleOverThenAdvanceAction
address: '0x080D42CC'
kind: function
status: probable
summary: Battle object step that waits until the battle is over and its timer expires, then switches the
  object to action 8 and resets its phase.
interface: (r5 = battle object) -> r0 = 0 when it transitions (else clobbered); modifies oBattleObject_Timer2,
  oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: First calls battle_isBattleOver; while the battle is still running (nonzero return) the function
  returns without doing anything. Once the battle is over, it decrements the object's Timer2 halfword
  each call until it reaches zero. At that point it stores 8 into CurAction (byte) and clears CurPhaseAndPhaseInitialized,
  forcing the object's action/phase state machine into action 8 at phase 0. Timer2 must be preloaded by
  earlier code, since no setup occurs here. r5 is an incoming battle object pointer not set up by this
  routine itself.
