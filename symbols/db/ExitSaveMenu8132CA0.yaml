name: ExitSaveMenu8132CA0
address: '0x08132CA0'
kind: function
status: confirmed
summary: Finalizes the PET save submenu, optionally resetting the chatbox e-flags and returning the PET menu to
  the overworld map while a screen fade is active, then refreshes the save-menu text graphics.
interface: void ExitSaveMenu8132CA0(void); // uses r10/lr in; clobbers nz,c,v,r0-r3,lr; preserves r4-r9; final outputs
  (r5,r8,r9,r10,r11,r12) come from saveMenuTextGfx_8132F4C
details: 'Thin trampoline that, while IsScreenFadeActive() returns true (zf clear), clears chatbox e-flags via chatbox_set_eFlags2009F38
  with the literal mask 0x40 (likely bit 6, the "do not draw / suppress" flag for the chatbox), then calls pet_menuExitToMap_811F708
  to dismiss the PET menu back to the map. After the optional cleanup it unconditionally invokes saveMenuTextGfx_8132F4C,
  whose call-clobber list (r0-r3, r5, r8-r12, lr, nz/c/v) accounts for the function''s full output set; r5/r8/r9/r11/r12
  are otherwise untouched in this body. A developer comment notes this breaks on entering the Save submenu and continues
  inside it before the save is confirmed, and that disabling it crashes the game when entering the save menu.

  '
