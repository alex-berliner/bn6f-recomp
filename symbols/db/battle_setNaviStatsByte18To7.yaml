name: battle_setNaviStatsByte18To7
address: '0x0800B800'
kind: function
status: probable
summary: Wrapper that writes the value 7 to byte 0x18 of the NaviStats record of the navi a battle object
  represents (alliance-selected record).
interface: (r0 = battle object) -> r0 = result byte written by callee; flags set by SetBattleNaviStatsByte_AllianceFromBattleObject
details: 'The function is a three-argument tail setup for SetBattleNaviStatsByte_AllianceFromBattleObject:
  it keeps r0 (the battle object) untouched, sets r1 = 0x18 as the NaviStats field offset and r2 = 7 as
  the byte value, then calls the callee and returns its result. The callee picks the real NaviStats record
  or its ghost copy depending on the object''s alliance flag and stores the byte. So this simply stamps
  the field at offset 0x18 with 7 for the navi tied to the passed object. What field 0x18 semantically
  is (and why 7) is not shown here.'
