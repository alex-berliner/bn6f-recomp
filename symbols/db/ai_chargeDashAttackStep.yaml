name: ai_chargeDashAttackStep
address: '0x081048AA'
kind: function
status: probable
summary: 'Per-frame state handler for an AI battle object''s dash attack: on first call it sets up attack
  data and launches itself toward the target''s panel, then each frame it telegraphs by highlighting panels
  and moves until the step timer expires.'
interface: (r0 unused entry; r5 = battle object ptr, r7 = AI attack vars) -> r0 = varies via callees;
  state fields in r5/r7 updated
details: 'Runs each frame while an attack is active: if oAIAttackVars_AttackElement is 0 it initializes
  — sets element 4, animation 0x4F, collision data (0x35/2/3), copies ScratchVar into oCollisionData_SelfDamage/StaminaDamageCounterDisabler,
  sets collision region 1, snaps its panel to (alliance-based table value, target object''s byte 0x13),
  computes FuturePanel two panels ahead via object_getFrontDirection, computes velocity toward the target
  panels with sub_8105174/sub_8105294, starts a step timer, plays SFX 0x1C7, and zeroes ChargeCycles.
  On later frames it increments ChargeCycles (every 8 frames highlighting the target panel), advances
  X/Z by the stored velocities, re-derives panel from coordinates, clears its collision region and calls
  sub_8105354 if the collision flags came back nonzero, and re-registers region 1 whenever its panel changes.
  When the step timer hits 0 it writes HitElement 0x14, handing off to the hit phase.'
