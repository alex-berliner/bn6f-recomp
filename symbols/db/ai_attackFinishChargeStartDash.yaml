name: ai_attackFinishChargeStartDash
address: '0x0810B270'
kind: function
status: probable
summary: 'Ends an AI attack''s charge-up phase: commits the target panel, then starts the attack dash
  toward it.'
interface: (r7 = AI attack vars struct, r5 = battle object) -> r0 = 0x10 stored to HitElement; no return
  value
details: Called once per frame during an attack's charge phase; it decrements oAIAttackVars_ChargeCycles
  and returns early while nonzero. When the counter hits zero it calls sub_810B21C, copies oBattleObject_FuturePanelX/Y
  into PanelX/Y, releases the panel reservation via object_removePanelReserve, recomputes pixel coordinates
  and collision/facing via object_setCoordinatesFromPanels and object_updateCollisionPanels, resets the
  object's current animation to 0, clears ObjectFlags1 bit 0x40, and sets the OBJECT_FLAGS_CURRENTLY_MOVING_1
  bit. It then loads oAIAttackVars_StepTimer from AttackDuration (so the dash lasts the attack duration)
  and writes HitElement = 0x10.
