open_questions:
- Whether `dword_80152B4` (=0x80008600) is really a single literal pointer to the AIData Unk_44 word,
  or an AIData pointer (with 0x80000000 mask embedded) split across 0x80000 + low bits; the callee signature
  takes `r0` as the AIData pointer, so it is most likely a pointer to the Unk_44 field of some global
  AI struct (probably the player's AI data block, given the constant sits at a project symbol address
  0x08000xxx range — but the constant looks like a packed mask; resolving this requires seeing how ClearAIData_Unk_44_Flag
  dereferences r0).
