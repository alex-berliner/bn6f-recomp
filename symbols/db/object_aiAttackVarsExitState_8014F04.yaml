  detail: '- `push {r4,lr}` then reads `[r7,#oAIAttackVars_Unk_01]` and branches on `tst r0,r0`: first-time
    init seeds Unk_10 = 0x14 and sets Unk_01 = 4 (lines 14162-14165 of asm00_2.s). - `ldrh r0,[r7,#oAIAttackVars_Unk_10]`
    / `sub r0,#1` / `strh r0,[r7,#oAIAttackVars_Unk_10]` / `bge locret_8014F38`: simple per-frame countdown
    gate. - On underflow: `mov r0,#0x80` then `bl ClearAIDataUnk0x48Flag` clears the 0x80 bit of AIData
    Unk_48. - `mov r0,#0x20` then `bl battle_clearFlags` clears battle-state flag 0x20. - `ldr r0,dword_80152B4`
    (=0x80008600) is the address-style argument actually loaded into r0 before `bl ClearAIData_Unk_44_Flag`;
    per the callee summary, ClearAIData_Unk_44_Flag takes an AIData pointer + the mask selects bits, but
    the routine at this function only ever reads r7 (the BattleObject) — so the 0x80008600 likely encodes
    the pointer+bit (mask 0x80000000 in AIData Unk_44, with the high bits being a pointer tag) as one
    immediate; treating the 0x80000 component as the mask is the conservative read. - `bl object_exitAttackState`
    is the terminal cleanup that ends the attack sub-state. - Caller contract reads r5/r6/r7/r10/lr; callee
    summary of object_exitAttackState matches same in/out set, indicating the object is unwound via the
    standard battleObject exit path.'
