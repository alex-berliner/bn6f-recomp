status: probable
summary: Countdown-then-exit routine for an AI attack-vars state, clearing AI/battle flags and tearing
  the object out of its attack state.
interface: (r7 = BattleObject*, r6 = related object?, r5 = related object?, r10 = toolkit) -> side effects
  only (no value returned to callers); clears AI flag 0x80 and the AI Unk_44 flag 0x80000000, clears battle-state
  flag 0x20, and exits the object's attack state via object_exitAttackState.
details: 'Reads AIAttackVars_Unk_01 (a one-shot guard): on first entry (when the byte is 0) it seeds AIAttackVars_Unk_10
  = 0x14 and AIAttackVars_Unk_01 = 4, marking the routine as initialized. Every call then decrements AIAttackVars_Unk_10;
  while it stays non-negative, the routine just returns (r4/lr pop). When it underflows, it calls ClearAIDataUnk0x48Flag
  with r0 = 0x80 (clearing bit 0x80 in the AIData Unk_48 word), then battle_clearFlags with r0 = 0x20
  (clearing that bit of BattleState''s flag halfword), then ClearAIData_Unk_44_Flag with the mask 0x80000
  applied to the AIData Unk_44 word (ClearAIData_Unk_44_Flag receives a pointer in r0 — the literal 0x80008600
  looks like a static, but per the callee summary the bit-mask argument selects the bits), and finally
  object_exitAttackState which detaches the object from its attack action/phase and resets its CurState.
  The routine is keyed on r7 (the BattleObject) and reuses the toolkit in r10 to reach the battle state.

  '
