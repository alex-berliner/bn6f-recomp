name: object_aiAttackVarsExitState_8014F04
address: '0x08014F04'
kind: function
status: confirmed
summary: Ticks an AI object's attack step timer and, once it expires, clears the AI's pending attack flags and returns
  the object to its normal state machine.
interface: void object_aiAttackVarsExitState_8014F04(u32 ai_data /*r5*/, BattleObject* object /*r6*/, AIAttackVars*
  vars /*r7*/); // r10 = battle context, passed through to battle_clearFlags
details: "Per-call state routine for an object's AI attack, operating on the AI attack\nvars block in r7 (oAIAttackVars_AttackElement,\
  \ oAIAttackVars_StepTimer) with\nthe AI data pointer in r5 and the battle object in r6.\n\nOn first entry with\
  \ AttackElement == 0, the attack is initialized: the\nstep timer is set to 20 (0x14) frames and AttackElement\
  \ to 4. Afterwards\n(and every call when the element is already nonzero) the 16-bit step timer\nis decremented;\
  \ while it remains >= 0 nothing else happens, so the attack\nstate simply waits out its countdown.\n\nWhen the\
  \ timer wraps negative (decrementing 0), the attack ends:\n  - ClearAIDataUnk0x48Flag(r5, 0x80)      - clear AI\
  \ data flag bit 0x80\n  - battle_clearFlags(0x20)               - clear battle flag bit 0x20 (uses r10)\n  - ClearAIDataUnk0x48Flag(r5,\
  \ 0x80000)   - clear AI data flag bit 0x80000\n  - ClearAIData_Unk_44_Flag(r5, 0x80008600) - clear mask in AI\
  \ data field 0x44\n  - object_exitAttackState(r5, r6, r7)    - hand the object back to its normal AI state\n\n\
  The 32-bit decrement of a 16-bit stored timer is what detects expiry;\nthe signed >= 0 test on the full register\
  \ means the branch stays in the\nstate until the timer was exactly 0. Preserves r4.\n"
