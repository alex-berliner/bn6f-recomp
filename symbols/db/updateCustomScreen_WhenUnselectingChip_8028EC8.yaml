open_questions:
- The function's name suggests it runs "when unselecting a chip", but the body only writes byte+7 (0/1) and never
  clears a previously-set 2; the real clearing of the "selected" flag is presumably done by the caller before this
  routine runs.
- Why r2 is returned at all is unclear from this file alone - the lifted C treats it as scratch, but the assembly
  explicitly leaves the loop's final monocode/active-chip value there for the caller.
