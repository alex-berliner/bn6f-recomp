name: updateCustomScreen_WhenUnselectingChip_8028EC8
address: '0x08028EC8'
kind: function
status: confirmed
summary: After a chip is unselected on the Custom Screen, scan the 10 active-chip slots and mark each empty slot's
  selection flag (slot+7) as selectable or not based on the current selection count, active-chip ID, monocode, and
  active chip-code (including the 0x1B/0x1C special codes and 0x1A star wildcard).
interface: "void updateCustomScreen_WhenUnselectingChip_8028EC8(void /* r5=state, r10 */);\n  /* inputs:  r5 = custom-screen\
  \ state pointer\n   *          r10 = (caller-saved scratch)\n   * outputs: r3 = 0; r4/r5/r6/r7 preserved\n   *\
  \ clobbers: nz,c,v from r0,r1,r2,lr\n   */\n"
details: "Walks the array of 10 active-chip slot records (12 bytes each) returned by\ngetLocOfActiveChips_8027E1C(0).\
  \ For each empty slot whose byte+7 is not\nalready 2 (\"selected\"), it decides whether the chip in that slot\
  \ can be\nadded to the current folder:\n\n  - If state->selectedCount (r5+8) >= 5, the slot is locked (byte+7\
  \ := 1).\n  - Otherwise the chip's code/ID are decoded via getChipID_802A54E from the\n    data pointer at slot+8:\
  \ code = value>>9, id = value & 0x1FF.\n  - If chipIDIs13f_8029FF4(id) is true, the slot is selectable.\n  - Codes\
  \ 0x1B..0x1C are special \"active-chip\" codes: allowed only when\n    state->activeCode (r5+0xA) is 0 or equals\
  \ the chip's code; otherwise\n    blocked.\n  - For a normal code, the active chip ID at state+0x20 (signed) is\
  \ read;\n    if it is -1 the monocode rules apply, otherwise the slot is\n    selectable only when id == activeChip.\n\
  \  - Monocode rules use state->monocode (r5+9): 0xFF means different codes\n    are already selected so nothing\
  \ further can be added; 0x1A means all\n    currently selected chips are stars so any chip is OK; otherwise the\n\
  \    slot is selectable iff chip code == 0x1A (star wildcard) or chip code\n    == monocode.\nThe loop's last\
  \ computed monocode/active-chip scratch is returned in r2\n(used by the caller as further state), and r3 is cleared\
  \ to 0. The\n\"r2_scratch\" threaded through the C version is just register-lifetime\nnoise from the compiler;\
  \ it has no semantic effect.\n"
