name: battle_objectUpdateFlight
address: '0x080D595C'
kind: function
status: probable
summary: 'Per-frame update for a battle object in a timed moving state: integrates X/Y velocity each tick
  and transitions the action when the timer expires.'
interface: (r0 = ??? clobbered, r5 = battle object pointer) -> mutates object fields; r0 = callee return
details: Standard battle-object state-step handler. On phase 0 it sets CurPhase=4 and calls sub_80D5A0A
  (unknown, likely init of velocity/timer). Each subsequent frame it decrements oBattleObject_Timer; while
  positive it adds XVelocity to X and YVelocity to Y and refreshes PanelX/PanelY via object_setPanelsFromCoordinates.
  When the timer reaches 0 it writes CurAction=4 and resets CurPhase=0, ending the movement step. The
  object is passed in r5 (not r0), so callers must load it into r5; only flags/registers from callees
  leak out.
