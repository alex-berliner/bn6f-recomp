name: scrollBGTileMapToCamera_8030580
address: '0x08030580'
kind: function
status: confirmed
summary: 'Each overworld frame, scroll the BG tile map''s 32x32 window to the camera: draw the columns, then rows,
  that came into view.'
interface: (r10 = toolkit) -> u16 stores into the BG tile-id blocks through the map's callbacks; restores r4-r9,
  r12; r1/r2/r3 = the r8/r9/r12 it was given; c, v as its last compare (or the redraw callback's)
details: Camera position (Camera +4/+6, pixels) >> 3 gives the camera tile; eMapTilesState200be70 +4/+6 hold the
  camera tile the window was last drawn for. A move of 5 tiles or more redraws the whole window (callback +0x20).
