name: owMapObject_weatherTornado_init_80A8E9C
address: '0x080A8E9C'
kind: function
status: confirmed
summary: 'Initializes the weather-tornado overworld map object: loads its sprite/animation, tints it for the current
  map layer, positions it, then decides dormant vs. wandering vs. already-caught behavior based on event flag BFB
  and the player''s capture history.'
interface: void owMapObject_weatherTornado_init(u8 *obj /*r5*/, u8 *sibling /*r6*/)
details: "Sets obj[0] state byte to 3 (INIT).\nLoads tornado sprite: sheet 0x80, frame 0x1C, cell 0x6C via sprite_load;\n\
  selects animation 0x18; loads animation sequence data; disables shadow.\nApplies the current overworld map-layer\
  \ palette tint by passing obj+0xC\n(layer-offset field) to applyLayerEffectToOWObject_8035694, then sets the\n\
  returned OAM priority on the sprite.\nCalls owMapObject_weatherTornado_loadHome_80A90B0 to restore the tornado's\n\
  saved map coordinates.\nBranch on event flag BFB (page 0x0B, offset 0xFB):\n  Flag NOT set (dormant): zeros obj+0x28\
  \ (timer), zeros obj+9 (sub-state),\n  sets obj+0x24 to 1 (dormant marker).\n  Flag IS set: calls owMapObject_weatherTornado_isCaught_80A91D4.\n\
  \    Caught: sets obj+8 to 0xC (CAUGHT sub-state), calls sub_80A8FFC, returns.\n    Not caught: calls owMapObject_weatherTornado_restoreState_80A9268\
  \ to\n      reload the last wandering position/state.\nCommon tail (dormant or not-caught): loads wandering parameters\
  \ via\nowMapObject_weatherTornado_loadParams_80A908C, sets obj+8 to 4 (ACTIVE),\ncalls owMapObject_weatherTornado_active_80A8F08\
  \ to begin movement.\nField offsets touched on obj: [0]=state, [8]=phase/sub-state, [9]=secondary\nsub-state,\
  \ [0xC]=map-layer offset, [0x24]=dormant flag, [0x28]=wander timer.\nClobbers r0, r1, lr, and condition flags;\
  \ writes through r2-r12 via callees.\n"
