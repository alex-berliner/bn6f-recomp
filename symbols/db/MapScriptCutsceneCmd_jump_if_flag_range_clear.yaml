name: MapScriptCutsceneCmd_jump_if_flag_range_clear
address: '0x080359EE'
kind: function
status: confirmed
summary: Map script/cutscene command that jumps to a script address if every event flag in a given range is still
  clear.
interface: 'int MapScriptCutsceneCmd_jump_if_flag_range_clear(void); // in: r7 = current script position, r10 =
  script/cutscene context (consumed by ReadMapScript* helpers via r5/r6 selector); out: r0 = 1, r7 = next script
  position (either old+8 or the word operand), flags nz/c/v set; r5 preserved'
details: 'Implements the map-script interpreter command "jump if a range of event flags is clear". Operands are
  pulled from the script stream with the ReadMapScript* helpers, which return their value in r4; the r6 value selects
  the operand size (1 = byte, 2 = halfword, 4 = word). First a byte operand gives the number of flags to test, then
  a halfword operand gives the first flag index; these are passed to TestEventFlagRange (first flag in r0, count
  in r2, count also left in r1), which reports whether any flag in [first, first+count) is set. If at least one
  flag is set, the interpreter just steps over the whole command: r7 (script position) is advanced by 8 (1 opcode
  byte + 1 byte + 2 halfword + 4 word operands). If the entire range is clear, a following word operand is read
  and becomes the new script position in r7, i.e. the jump is taken. Both exit paths return r0 = 1 with flags set
  from it (via SET_FLAGS_NZ), which the dispatcher presumably treats as "continue script". Touches no structures
  directly; all state flows through r4 (helper return), r6 (helper selector), and r7 (script cursor). The name is
  already in game terms and matches the observed logic, so it is kept.

  '
