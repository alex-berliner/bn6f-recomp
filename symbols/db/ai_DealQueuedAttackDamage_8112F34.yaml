name: ai_DealQueuedAttackDamage_8112F34
address: '0x08112F34'
kind: function
status: confirmed
summary: Fires one of the AI opponent's queued attacks by handing its target panel, elevation and damage value to
  the damage routine.
interface: void ai_DealQueuedAttackDamage(AIAttackVars* vars /* r7 */) // r4, r6 forwarded to the callee and restored;
  r5 passed through; returns whatever sub_80DFF84 leaves in r0-r3
details: 'Takes the AI attack-vars struct (r7) of a queued AI attack and invokes the

  damage routine sub_80DFF84 with: r0 = Unk_16 (target panel x), r1 = Unk_17

  (target panel y), r4 = 0xA00 + Unk_0f (elevation/height, base 0xA00 plus a

  per-attack offset byte), r2 = 0, r3 = 0, and r6 = word at offset 8 of the

  struct (the attack''s damage). r7 (the vars pointer) is forwarded too.

  r4, r6 and r7 are only scratch for setting up the call — the function

  pushes them and pops them after the call, so the caller''s values survive;

  r1-r3 on return are whatever sub_80DFF84 left there. No flags are set by

  this function itself (nz c v reflect the callee''s result).

  '
