name: object_setState30IfAnyUnk2004190EntryActive
address: '0x081367C0'
kind: function
status: probable
summary: If any of the 25 toolkit entries at oToolkit_Unk2004190 is flagged, advances the caller's object
  (r5) to state 0x30, plays SOUND_EXIT_SUBMENU, and runs text script 4 of eTextScript201D280.
interface: (r0 = ignored; reads caller's r5 = object/base pointer) -> void; plays a sound effect, queues
  a chatbox text script, and mutates [r5+#0x02], [r5+#0x16], possibly [r5+#0x1a]
details: Loops r4 = 0..0x18 over the 8-byte-per-entry array whose base is oToolkit_Unk2004190_Ptr, returning
  silently if no entry has a nonzero halfword at offset 0. If one is found and the caller object's state
  byte [r5+#2] equals 4, it calls sub_8136290 with [r5+#0x24]+[r5+#0x20], subtracts 0x90 from the halfword
  it returns and stores that at [r5+#0x1a]. It then saves the old state byte to [r5+#0x16] and writes
  0x30 into [r5+#0x2] — a standard state-transition pattern (prev-state saved, new state set). Finally
  it plays SOUND_EXIT_SUBMENU and runs script 4 of eTextScript201D280 via the chatbox. The matched array
  entry's index is not otherwise used; only 'at least one entry active' gates the whole sequence.
