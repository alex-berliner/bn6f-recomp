name: ai_attackStepDispatch_80F79F0
address: '0x080F79F0'
kind: function
status: confirmed
summary: Dispatcher for the AI's attack routine - jumps to one of three attack-step handlers selected
  by a state byte in the AI attack vars.
interface: void ai_attackStepDispatch(r7 = AI attack vars ptr, r5/r6 = pass-through args); results returned
  by the chosen handler in r1, r5, r8-r12
details: "Tail-dispatch stub for the AI attack state machine. Reads a byte selector from the AI attack\
  \ vars struct (labeled oAIAttackVars_HitElement in the disassembly, described as an attack-phase selector\
  \ in the verified C) and indexes the three-entry table at off_80F7A04 with it:\n  0 -> ai_attackStepChoosePanel,\
  \ 1 -> ai_attackStepAdvanceFuture8,\n  2 -> sub_80F7A98.\nIt loads the handler's thumb address into\
  \ r1, passes the selector byte in r0, sets lr to the return address 0x080F79FC, and branches with bx\
  \ r1. The handler returns straight to this function's caller, and its outputs (r1, r5, r8-r12) flow\
  \ through in the register file - the stub itself only reads r7 and writes nothing. r5 and r6 are inputs\
  \ that pass through to the handler untouched; r7 (the vars pointer) is preserved.\n\nRegister form kept\
  \ (C call semantics could not work): in: r0 = selector byte, r1 = handler address; out: r1, r5, r8-r12\
  \ per handler; the stub must be called in register form since the handler's results live in guest registers"
