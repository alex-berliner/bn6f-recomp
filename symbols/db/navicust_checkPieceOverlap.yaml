name: navicust_checkPieceOverlap
address: '0x0813BB68'
kind: function
status: confirmed
summary: Scans a 7×7 window of the NaviCust board to detect whether a candidate piece's AI-derived footprint overlaps
  any cell already occupied in the toolkit's placement grid.
interface: u32 navicust_checkPieceOverlap(u32 dispatchArg /*r0*/, u32 col /*r2*/, u32 row /*r3*/, u32 r1, struct*
  toolkit /*r10*/) -> nz r0 /*1=overlap,0=none*/ r1 /*hit byte or col residue*/ r2 /*row residue*/
details: Calls ai_dispatchFromGlobalByte(dispatchArg) to obtain a 7×7 byte grid (grid A) representing the piece's
  shape/footprint as computed by the AI dispatch routine. Retrieves a pointer to the toolkit's Unk200414c byte table
  (grid B, the occupied-cells map) via r10. Offsets grid B by (col−3, row−3) so the top-left of grid B aligns with
  the piece's centre cell on the 7×7 NaviCust board. Iterates 7 rows × 7 columns; for each cell within [0,7) bounds
  in both grids, if grid A byte is non-zero AND grid B byte is non-zero, returns r0=1, r1=grid B byte value, r2=current
  row (flags NZ set from r0). If the full 7×7 scan finds no overlap, returns r0=0 with loop residue in r1/r2. The
  inner loop's column index (r3) and row pointer advances (r6/r7 += 7) are straightforward. r4–r7 are saved and
  restored; r8–r12/r10 survive from ai_dispatch's return. The (col−3, row−3) offset means the caller passes the
  piece's centre coordinates on the 7×7 board.
