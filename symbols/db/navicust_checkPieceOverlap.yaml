open_questions:
- What exactly does ai_dispatchFromGlobalByte return in r0? Is it always a 7×7 row-major grid of shape bits, or
  could it be a pointer to a different structure?
- What is the semantic meaning of the Unk200414c grid? Is it a per-cell occupancy bitmask (NaviCust board) or a
  multi-slot piece registry?
- What does r1 (the raw toolkit byte at the overlap hit) represent to the caller—is it a piece-slot index or a type
  flag?
- Is r1's input (str r1, [sp,#4]) ever read in this function? It is stored to the stack but never loaded back—possibly
  a calling-convention artifact from a shared prologue.
