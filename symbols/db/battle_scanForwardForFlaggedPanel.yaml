name: battle_scanForwardForFlaggedPanel
address: '0x08016218'
kind: function
status: probable
summary: Walks column-by-column forward from a battle object, probing rows in a per-row priority order,
  and returns the coordinates of the first panel whose status flags contain the object's alliance-specific
  mask.
interface: (r0..? = battle object in r5) -> r0 = x of first matching panel (0 if none/off-field), r1 =
  y from priority table, r2 = side sign ((PanelX-x)>=0 ^ Alliance); flags clobbered
details: 'Reads the object''s facing via object_getFrontDirection and starts at column PanelX+dir. Per
  column it iterates three candidate y values taken from byte_8016298[(PanelY-1)*3 + i] — tables {1,2,3}/{2,1,3}/{3,1,2}
  mean the object''s own row is tested first, then the other two in a fixed order — passing each as the
  row argument to object_getPanelParameters (r1 still holds the table byte at the call). A panel matches
  when (flags & byte_8016290[Alliance*4]) != 0, where the mask is 4 for alliance 3 and 8 for alliance
  7 (others get 0, which can never match since tst with 0 is always clear). On a match it returns the
  column x, the y byte, and a direction sign (PanelX-x >= 0 ? 1 : 0) XOR Alliance in r2; if a column''s
  three rows all fail it advances x by dir and repeats, and it returns r0=0 once the column leaves the
  6x3 grid (object_isValidPanel). Note r4 is needlessly pushed/popped, and the r2 ''side'' value is only
  useful if the caller reads it.'
