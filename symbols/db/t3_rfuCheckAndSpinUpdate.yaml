open_questions:
- What sub_8148224 does in the non-4 branch (no caller known).
- Why the state must equal 4 before the RFU update runs (likely 'we are connected/linked').
- What the two callers really do with the result — they only seem to use it as a side-effecting gate before
  advancing chatbox/state.
