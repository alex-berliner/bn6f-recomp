name: clearWorkArea_808FE64
address: '0x0808FE64'
kind: function
status: confirmed
summary: Zeroes a 0x80-byte work area whose address is stored in dword_808FDBC, then returns 0.
interface: void sub_808FE64(void) // reads lr only; sets r0=0 on return but callers ignore it
details: 'Fetches the base pointer stored at dword_808FDBC (the slot at off_808FDB8+4, likely part of a small subsystem
  descriptor/table holding {base, workptr} style entries), and calls ZeroFillByWord(base, 0x80) to clear 0x80 bytes
  (32 words) of work memory. Afterwards it sets r0 = 0 before returning; per the register contract no caller reads
  r0, so this looks like a conventional "success" return rather than a used output. r2/r3 are preserved (ZeroFillByWord''s
  contract), nzcv and r0/r1/lr are clobbered. Purely a reset/clear helper for some subsystem''s scratch buffer;
  the caller presumably re-initializes fields afterwards.

  '
