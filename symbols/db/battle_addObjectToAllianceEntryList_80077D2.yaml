name: battle_addObjectToAllianceEntryList_80077D2
address: '0x080077D2'
kind: function
status: confirmed
summary: Appends a battle object's name ID to the next slot of its alliance's entry list in the battle state, used
  to track which combatants belong to each side.
interface: void battle_addObjectToAllianceEntryList(BattleObject* obj /* r5 */, Toolkit* toolkit /* r10 */)
details: 'Reads the object''s NameID (halfword at oBattleObject_NameID) and its alliance (low bits of the halfword
  at oBattleObject_AllianceAndDirectionFlip). In the battle state (r10 -> oToolkit_BattleStatePtr), each alliance
  has a byte-sized entry counter at battleState+8+alliance (oBattleState_Unk_08 base) and a per-alliance list of
  halfword slots at battleState+0x4C + alliance*8 (oBattleState_Unk_4C base), i.e. 8 bytes = 4 name-ID slots per
  alliance. The function takes the current counter value as the free slot index, stores counter+1 back, and writes
  the object''s name ID into list[slot]. Scratch registers on return: r0 = name ID, r1 = final list offset, r2 =
  counter offset, r3 = battle state pointer; NZCV flags come from the final address add (listOffset + slot*2). r4
  and r6 are saved/restored, r5 and r10 are read-only inputs. Likely called during battle setup to record which
  characters (players, enemies, allies) participate on each side, e.g. for the VS/intro name display or turn-order
  bookkeeping.

  '
