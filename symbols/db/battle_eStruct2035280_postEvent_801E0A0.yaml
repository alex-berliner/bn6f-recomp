summary: Posts a battle subsystem event to eStruct2035280 by copying a halfword from +0x24 of a pointer
  at +0x48 into the struct's own +0x24, storing r0/r1 into byte fields, ORing bit 0x80 into the request
  dword, then dispatching with mask 0x80.
interface: '(r0 = param0 -> byte_2035281, r1 = param1 -> byte_2035282, r10 = toolkit) -> void ; side effects:
  writes Struct2035280+0x24/0x1/0x2, ORs 0x80 into Struct2035280+0x40, then calls dispatch_801DA48(r0=0x80)'
details: "Resolves eStruct2035280 via the off_801E0D8 pool constant. Loads the pointer stored at +0x48\
  \ (an EWRAM pointer into another struct), reads a u16 at +0x24 from that target, and writes it into\
  \ eStruct2035280+0x24 — i.e. mirrors a \"current value\" from a source object into the global slot (likely\
  \ a battle phase / event index, since +0x24 of eStruct2035280 is otherwise word_20352A4 and the captured\
  \ value goes through ldrh/strh).\n  Stores r0 into byte_2035281 and r1 into byte_2035282 (these are\
  \ parameters; the meaning isn't directly inferable from the assembly, but callers consistently pass\
  \ small values like 0x00, 0x0f).\n  ORs 0x80 into the request-bits dword (eStruct2035280+0x40) via eStruct2035280_SetRequestBits_801BECC,\
  \ then immediately calls dispatch_801DA48(0x80) to process that exact mask. So the function both enqueues\
  \ and dispatches the 0x80 request in one shot — callers do not need to call dispatch themselves for\
  \ this bit.\n  All callers are battle / object-step code: task484_RunFrame, two unnamed battle routines,\
  \ the Custom Gauge end-of-turn handler, and objStepFinishSetState4 (the object-state finalize helper).\
  \ This confirms the 0x80 bit is a battle-lifecycle event flag (the `battle_customGauge_EndTurn_8027D78`\
  \ caller uses it at end-of-turn, and `objStepFinishSetState4_802BE0C` uses it when finalizing a step).\n\
  \  Push/pop only {lr} — leaf with two `bl`s.\n"
