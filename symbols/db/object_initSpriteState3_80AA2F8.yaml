name: object_initSpriteState3_80AA2F8
address: '0x080AA2F8'
kind: function
status: confirmed
summary: 'Initializes an object''s sprite: sets its state fields, loads a sprite sheet (gfx 0x80, palette 0x1C,
  sprite 0x98), starts animation 0 with no shadow, then runs the follow-up init step.'
interface: void sub_80AA2F8(void); /* object struct pointer passed in r5, preserved; trashes r0-r3 */
details: "Acts on an object/entity record whose pointer the caller leaves in r5 (r4-r7 and r12 are\npreserved, so\
  \ this is an \"r5 = struct\" helper in the object-update family). It writes three\none-byte state fields of that\
  \ record:\n  +0 = 3  (object state / phase byte; 3 likely means \"initializing\"),\n  +4 = 0  (animation frame\
  \ or counter, reset to 0),\n  +8 = 4  (next/queued state, written just before the tail call).\nIt then sets up\
  \ the object's graphics: sprite_load(0x80, 0x1C, 0x98) loads VRAM/OAM data for\ngraphics slot 0x80, palette 0x1C,\
  \ sprite entry 0x98; sprite_setAnimation(0) selects animation\nindex 0; sprite_loadAnimationData() loads that\
  \ animation's frame data; sprite_noShadow()\ndisables the entity's ground shadow. Finally it tail-calls sub_80AA322\
  \ with r0 = 4 (matching\nthe next-state value just stored at +8), which presumably continues the initialization\
  \ for\nthat state. This looks like the shared \"spawn with sprite, enter state 4\" init used by a\ncommon object\
  \ type (the fixed gfx/palette/sprite IDs suggest one specific sprite).\n"
