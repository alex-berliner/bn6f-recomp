name: object_findNearestFrontPanelTarget
address: '0x080C0C9A'
kind: function
status: probable
summary: Filters candidate panels by alliance and a DirectionFlip-aware directional transform (front-direction
  negated, applied to Y), keeps those passing object_checkPanelParameters 0xF800000 or matching RelatedObject1Ptr's
  panel, then returns the packed (y<<4|x) of the candidate closest in Manhattan distance to the object's
  PanelX/PanelY (0xFF sentinel when none).
interface: (r0 = battle object ptr (in r5 by convention), r1 = scratch for callee) -> r0 = (y<<4)|x of
  nearest panel, 0xFF if none (or 0 if the panel list was empty); flags clobbered
details: 'Builds a per-alliance panel filter table (off_80C0D8C indexed by Alliance<<2) and calls object_getPanelsExceptCurrentFiltered
  to list candidate panels (each packed y<<4|x). Candidates are kept only if they lie strictly in front
  of the object''s PanelX according to object_getFrontDirection negated (DirectionFlip-aware), and pass
  object_checkPanelParameters with mask 0xF800000 (attribute matches, no forbidden bits) — except the
  panel occupied by RelatedObject1Ptr, which is accepted unconditionally. Matching panels are packed into
  a stack list, then the function picks the entry with minimal Manhattan components: smallest |dx|, tie-broken
  by smallest |dy|, then smallest y, tracking best values in stack slots (init dx=0xFF, dy=0xFF). The
  winner''s packed coordinates are returned; the caller (battle_panelObject_tryTargetAndSetPhase_80C0938)
  stores them into Param3/Param4 and advances to the execute-panel-effect phase.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getPanelsExceptCurrentFiltered with alliance-indexed mask table off_80C0D8C builds
    the candidate panel list (sub_80C0C9A +0x10..0x22); neg of object_getFrontDirection plus cmp against
    own PanelX restricts candidates to panels ahead of the object (loc_80C0CE8); bl object_checkPanelParameters
    with 0xF800000 attribute mask validates panels, bypassed for RelatedObject1Ptr's panel (loc_80C0D0A..D16);
    second loop compares |dx|,|dy| against running best in [sp,#0x28]/[sp,#0x2c] and keeps the minimum
    (loc_80C0D38..D7A); caller battle_panelObject_tryTargetAndSetPhase_80C0938 stores the returned bytes
    into Param3/Param4 and advances to phase 4
