  reproduce: python3 tools/asmcat.py 0x080C0C9A
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The summary misreads the filtering logic. At loc_80C0CE8 the comparison uses candidate panel X vs
    object''s PanelX chosen by DirectionFlip XOR Alliance, then `ble 0x80C0D22` skips, otherwise `object_getFrontDirection()`
    is negated and added to candidate Y (not X), giving a ''transformed Y'' (sp+0x20). object_checkPanelParameters
    is called with mask 0xF800000 on the *transformed* coordinates, and the related-object check compares
    the transformed X/Y to that object''s panel — so it does not strictly lie ''in front''; it''s a directional
    transform for facing. Also the ''find nearest'' loop uses Manhattan components from object''s PanelX/PanelY,
    not from the transformed ones, and the unrelated claim about the caller storing into Param3/Param4
    matches the caller stub. The prefix should be `object` not `battle_` since it operates on a battle
    object generically, but the rest is close enough to need a rename + summary tweak.; run wf investigate
    investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
