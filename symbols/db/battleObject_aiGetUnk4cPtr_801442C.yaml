  detail: '- asm `ldr r0, [r5, #oBattleObject_AIDataPtr]` followed by `ldr r0, [r0, #oAIData_Unk_4c]`
    shows the two-step indirection through BattleObject->AIDataPtr (offset 0x58) and AIData field at 0x4c.
    - `mov pc, lr` is a thumb-1 leaf returning r0 to the caller. - Single caller sub_80142DC, which the
    project lists as an inlined AI routine fed by r5. - Contract says `in=[''r5'',''lr''] out=[''r0'']`,
