status: probable
summary: Loads AIData +0x4c from a BattleObject for the AI script helpers
interface: (r5 = BattleObject*) -> r0 = *(BattleObject->AIData + 0x4c) ; side effects none
details: "Tiny thunk: ldr r0, [r5, #oBattleObject_AIDataPtr] (offset 0x58) loads the AIData pointer\n\
  \  belonging to the BattleObject in r5, then ldr r0, [r0, #oAIData_Unk_4c] (offset 0x4c)\n  dereferences\
  \ through it. Returns the resulting value in r0. Only caller is sub_80142DC,\n  which uses it inside\
  \ the battle AI walk/dispatch loop; callee list is empty so it never\n  triggers another routine. Acts\
  \ as the r5-based equivalent of \"AIData->Unk_4c\".\n"
