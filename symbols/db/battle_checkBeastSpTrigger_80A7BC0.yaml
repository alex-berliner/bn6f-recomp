name: battle_checkBeastSpTrigger_80A7BC0
address: '0x080A7BC0'
kind: function
status: confirmed
summary: Checks whether the player has entered a Beast-area special encounter zone during battle, and if so fires
  the trigger event, validates AI-data flag count, sets cutscene event 0x1731, and launches the Beast cutscene script.
interface: void battle_checkBeastSpTrigger_80A7BC0(void) /* r5 = trigger object ptr, r10 = toolkit; preserves r4-r7,
  r10 */
details: "Preconditions (all must pass or function returns immediately):\n  1. battle_isInputAllowedOrBattleBusy\
  \ returns Z-set (input allowed, battle idle).\n  2. OverworldPlayerObject (toolkit → gameState → player) has ID\
  \ at 0x24 matching trigger's target ID at 0x14.\n  3. Bounding-box: player position (offsets 0x1C/0x20) plus fixed\
  \ origin (0x80000 each) minus trigger position (offsets 0xC/0x10) must lie in [0, 0x100000] on both axes.\n\n\
  Trigger-object fields touched:\n  0x04 (byte): map-group id passed to beast_getMapGroupIdBase → result fed to\
  \ SetEventFlag.\n  0x08 (byte): written 8 to mark the trigger as fired.\n  0x0C / 0x10: trigger world position\
  \ (x, y).\n  0x14: target game-state ID to match against player.\n\nAfter the bounding-box passes:\n  - Sets an\
  \ event flag derived from the trigger's map-group byte.\n  - Plays SOUND_UNK_73 (0x73).\n  - Calls sub_81418F0\
  \ then battle_getAIDataVersionFields_81418E4; takes the returned r2 as an expected flag count.\n  - Calls battle_getEnemyIndexFromMapGroup_8142080\
  \ (clobbers but value not used here), then getSetFlagCount; if count ≠ expected, bails out silently.\n  - Sets\
  \ EVENT_1731 via SetEventFlagFromImmediate (r0=0x17, r1=0x31).\n  - Calls battle_getEnemyIndexFromMapGroup_8142080\
  \ again; result (r0) is passed as the parameter to StartCutscene with the Beast cutscene script at byte_8089DD8.\n\
  \nRegister contract quirk: r5 and r10 are preserved across the call (pushed/popplied), r6 is also preserved though\
  \ not directly referenced in the body—likely a caller expectation.\n"
