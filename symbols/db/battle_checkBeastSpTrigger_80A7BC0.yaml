- method: assembly-reading
  date: '2026-10-14'
  detail: '- Captured snapshots are named snap_beastsp_*, so r5 is the BeastSP trigger zone. - Calls SetEventFlagFromImmediate
    EVENT_1731, then StartCutscene(byte_8089DD8) — direct cutscene trigger on event 1731. - Uses `ldr
    r7,[r10,#oToolkit_GameStatePtr]; ldr r7,[r7,#oGameState_OverworldPlayerObjectPtr]` to fetch the overworld
    player and reads JoypadHeld (offset 0x24) for the panel direction check. - The 0x80000 / 0x100000
    constants computed via add/sub are the +/-0x80000 (8 panels = 1 column) range math typical of "is
    player within ~2 columns/rows of the trigger zone center" Beast SP proximity tests. - Gate callee
    is named battle_isInputAllowedOrBattleBusy_80A7C58; bl+`bne locret_80A7C3C` is a standard "skip side
    effects unless idle" guard. - Sets byte at r5+8 to 8 immediately before the SFX/cutscene: clearly
    a "this zone just fired" latch.'
