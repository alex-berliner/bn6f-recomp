name: ai_setAttackAtFrontPanel
address: '0x08108F28'
kind: function
status: probable
summary: AI helper that issues an attack command at the panel in front of the acting battle object, using
  its attack-vars block for damage/timer/type.
interface: (r5 = battle object ptr, r7 = oAIAttackVars block) -> r0 = result of sub_80D5718; no flag meaning
  seen
details: 'Calls object_getFrontDirection to get the object''s facing multiplier (+1/-1 from alliance and
  DirectionFlip) and adds it to oBattleObject_PanelX, giving the panel column directly in front; oBattleObject_PanelY
  is passed unchanged. From r7''s oAIAttackVars it passes InitFlag in r2, 0 in r3, and packs r4 = 1 |
  (0xE << 8) | (TimerOrCycles << 16), with oAIAttackVars_Damage in r5, into sub_80D5718. The 0xE<<8 constant
  looks like an encoded attack kind/element and the low 1 a ''valid/attack'' flag, matching the packed-argument
  style of AI attack dispatch helpers. The function is a thin wrapper: it only translates object position
  + AI attack vars into one call and returns its result. Alignment padding (0,0) follows the body.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_getFrontDirection then add r0,r0,r1 with [r5,#oBattleObject_PanelX] => target panel
    is the one faced; r4 = 1 | 0xE<<8 | TimerOrCycles<<16 built from [r7,#oAIAttackVars_...] => packed
    attack command word; ldr r6,[r7,#oAIAttackVars_Damage] moved to r5 => damage comes from the AI attack-vars
    struct; single tail call bl sub_80D5718 with (x,y,flag,0,packed,damage) => dispatch/enqueue of the
    attack, not the logic itself
