name: ai_frontPanelSlashAttack
address: '0x080EECCC'
kind: function
status: probable
summary: 'AI attack step handler: after a 12-frame windup, plays sound 0x10A, spawns a one-panel collision
  region in front of the attacker and a flip-dependent slash effect at that panel, then nulls attack pointers
  and sets HitElement=8 when StepTimer underflows.'
interface: (r5 = battle object, r7 = AI attack vars struct) -> void; uses oAIAttackVars_StepTimer/oAIAttackVars_Damage,
  writes oAIAttackVars_HitElement
details: While StepTimer equals 0xC (the windup frame) it plays sound 0xA, reads the object's Damage,
  and spawns a collision region at PanelX + frontDirection, PanelY with parameters (4, 0) and stack args
  (panelX, panelY, 1), so the hit lands on the single panel in front. It then spawns a type-1 effect object
  (effect type 0) at that panel's pixel coordinates with parameter ((getFlip<<8)+0x33), i.e. a flip-dependent
  effect sprite index, likely a slash sprite. Each call decrements StepTimer; once it goes negative it
  nulls oBattleObject_RelatedObject1Ptr and oAIData_TempAttackObjectPtr and stores HitElement = 8 (sword-type?)
  into the AI attack vars. This matches a one-panel melee swing AI attack in the battle engine.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'cmp StepTimer, #0xc / PlaySoundEffect(0xA): one-shot setup on the windup frame; object_getFrontDirection
    added to oBattleObject_PanelX before object_spawnCollisionRegion: hit panel is the one in front; lsl
    r4, r0, #8 + #0x33 from object_getFlip before spawn_t1_0x0_EffectObject at object_getCoordinatesForPanels
    output: flip-mirrored visual effect at the struck panel; final block: dec StepTimer, on underflow
    clear RelatedObject1Ptr, TempAttackObjectPtr and set HitElement=8: attack teardown; route context
    ''beastsp'' with oAIAttackVars_Damage read: this is an AI-controlled enemy attack routine'
