    in r1/r2; ldr r6,[r7,#oAIAttackVars_Damage] and r7=dword_81039A0(=3) supply damage and a constant
    to object_spawnCollisionRegion; sole caller sub_8103286 runs on the battlesweep route, matching an
    AI attack spawning its hitbox; callee object_spawnCollisionRegion confirms this is hitbox/collision-region
    creation
