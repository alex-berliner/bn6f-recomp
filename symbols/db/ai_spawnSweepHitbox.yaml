name: ai_spawnSweepHitbox
address: '0x08103966'
kind: function
status: probable
summary: Spawns a collision region (hitbox) for an AI sweeping attack variant, using a per-alliance coordinate
  from dword_8103A04 and a packed hitbox parameter from byte_8103990, then forwards Damage and a constant
  3 to object_spawnCollisionRegion.
interface: (r0 = 1-based attack variant index, r5 = battle object, r7 = AI attack vars) -> r0 = object_spawnCollisionRegion
  result; r1 = x from alliance table, r2 = y, r3 = 0, r4 = packed hitbox params from byte_8103990[r0-1],
  r6 = Damage, r7 = 3
details: Decrements r0 and uses it (x4) to index a table of four packed words at byte_8103990 ({0x12,0xFF,0x5,0x7},
  {0x13,...}, {0x1F,...}, {0x22,...}), which is passed in r4 to object_spawnCollisionRegion. Reads oBattleObject_Alliance
  from r5, doubles it, and fetches a two-byte coordinate pair from the per-alliance table at dword_8103A04,
  passing the bytes as r1/r2. Reads oAIAttackVars_Damage and oAIAttackVars_InitFlag from the r7 AI-attack
  struct; Damage goes to the callee in r6 and a constant 3 (from dword_81039A0) in r7, with r3 = 0. The
  InitFlag byte is loaded but apparently only to preserve/refresh it via the struct pointer convention.
  Given the 'battlesweep' route, this is the hitbox-spawn step of a multi-panel sweep attack with up to
  four variants selected by the caller.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: lsl r6,r6,#2 + ldr r4,[r4,r6] selects one of four 4-byte entries in byte_8103990, passed to
