name: HandleCommMenu81291E8
address: '0x081291E8'
kind: function
status: confirmed
summary: Comm-menu state dispatcher that tail-calls a handler selected by the comm-menu state byte via CommMenuJumpTable81291FC.
interface: 'void HandleCommMenu81291E8(void); /* inputs: r5 (comm-menu context pointer whose byte [r5+1] is the
  state index). No other inputs used. No outputs returned; handlers run via tail call. clobbers nz,c,v,r0-r4,r6,r7,lr.
  */'
details: Standard ARM/Thumb "push lr / mov lr,pc / bx r0 / pop {pc}" tail-call dispatcher. Loads a 32-bit function
  pointer from CommMenuJumpTable81291FC indexed by LD8(R5+1) (treated as a word index — the actual byte value acts
  as the slot selector) and tail-calls it, so the caller's return is restored as the handler's return. r5 is not
  declared in the caller contract but is implicitly the comm-menu state object (its byte at offset 1 selects the
  sub-state). The jump table at 0x081291FC has 18 entries (slots 0x00..0x48 by 4) covering handlers such as sub_8129248
  (slot 0), sub_81292A8 (slot 4), sub_8129598 (slot 8), sub_8129F04 (slot 0xC), sub_812A76C (slot 0x10), sub_812A8A4
  (slot 0x14), sub_812B5C8 (slot 0x18), sub_8130904 (slot 0x1C), sub_812B80C (slot 0x20), sub_812B874 (slot 0x24),
  sub_812C2C0 (slot 0x28), sub_812DAE4 (slot 0x2C), sub_812F094 (slot 0x30), and the cluster sub_812ABEC / sub_812AD04
  / sub_812ADFC / sub_812AEC8 / sub_812AEE0 / sub_812AF14 (slots 0x34..0x48). The .hword 0x0 after `pop {pc}` is
  padding for word alignment of the offset pointer. off_81291F8 points to the jump table base itself (an immediate
  self-reference used by the ldr pseudo-op).
