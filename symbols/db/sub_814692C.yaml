name: sub_814692C
address: '0x0814692C'
kind: function
status: confirmed
summary: Tail-call trampoline that runs the RFU (wireless) VBlank handler and returns its preserved registers to
  the caller.
interface: void rfu_vblankTrampoline_814692C(void); /* uses lr as the return address; returns r4-r12 from rfu_handleVBLANK_81453D4
  */
details: 'A four-instruction tail-call wrapper around `rfu_handleVBlank_81453D4`. It pushes lr, calls the RFU VBlank
  handler, pops the saved return into r0, and `bx r0`s to it so the handler''s r4-r12 propagate out as this function''s
  outputs. r0-r3, lr and the condition flags are clobbered across the call; the stack is restored to the caller''s
  level. In the register ABI the SP movement (push/pop) carries the return address, so no general-purpose register
  is used as a parameter. Effectively a transparent shim that lets the caller treat the RFU VBlank as a no-argument
  cdecl function returning nine callee-saved registers.

  '
