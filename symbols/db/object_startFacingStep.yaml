name: object_startFacingStep
address: '0x080A79DC'
kind: function
status: probable
summary: Sets an entity's sprite animation and initializes a linear move of param-scaled ±8 px toward
  the entity's facing direction over a param-length duration.
interface: '(r5 = entity/base struct, r6 = sprite/motion slot, r7 = params: [1]=anim id, [2]=duration
  divisor, [3]=distance scalar) -> r0 = 1'
details: Caches the animation id from param byte 1 into the slot (offset 2) and applies it via sprite_setAnimation
  plus sprite_loadAnimationData. Indexes byte_80A7A38 by anim id*2 to get signed per-direction offsets
  (8,0 / 0,8 / -8,0 / 0,-8), multiplies both by param byte 3, and adds them to r5+0xC / r5+0x10 (current
  x/y) to form a destination stored at r6+0x1C / r6+0x20. Param byte 2 is used with SWI 6 (Div) as 0x10000/value,
  giving a fixed-point reciprocal step size kept at r6+0x24 with its complement in halfword r6+6, suggesting
  per-frame interpolation toward the target. The unmodified r5+0xC/0x10 values are also copied to r6+0x14/0x18
  as the move's origin. Finally calls sub_80A7BA2 with r0=4 (likely arming a per-frame step handler) and
  returns 1.
