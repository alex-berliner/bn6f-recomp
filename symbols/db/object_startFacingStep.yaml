name: object_startFacingStep
address: '0x080A79DC'
kind: function
status: confirmed
summary: Begins a facing/step motion for a battle object — sets the facing-direction animation, computes the step's
  target offset from a direction table scaled by the step length, and seeds the step's duration timer via BIOS division.
interface: void object_startFacingStep(sprite r5, object r6, step r7) -> returns r0 = 1 with NZ flags set from it;
  also returns r5, r6 (preserved/rewritten from inputs); clobbers r0-r3, lr, C/V
details: 'r5 is a sprite context, r6 the battle object struct, r7 a step descriptor byte struct: [?, facing/anim
  id (+1), step duration or flip count (+2), step length scale (+3)]. The function stores the facing id into object+2,
  calls sprite_setAnimation and sprite_loadAnimationData so the object plays the animation for that facing. It then
  looks up a signed (dx,dy) byte pair from byte_80A7A38 indexed by the facing id*2 — the table is (8,0),(0,8),(-8,0),(0,-8),
  i.e. right/down/left/up 8-pixel unit offsets. Each offset is sign-extended, shifted left 16 (fixed point 0x4000-space),
  multiplied by the step length byte at step+3, and added to the sprite''s current position (sprite+0xC/+0x10) to
  form the step''s destination, stored at object+0x1C (x) and +0x20 (y). Next it performs BIOS Div (svc 6) of 0x4000
  by the byte at step+2 (frames/duration): the quotient goes to object+0x24 (step increment per frame) and 0x4000-remainder
  to halfword object+6 (an accumulator/remainder for the fractional motion). The sprite''s current position is snapshotted
  as the step''s start position into object+0x14/+0x18. Finally it calls sub_80A7BA2 with r0=4 (sprite/object update
  mode 4, presumably "start moving" state) and returns 1. Quirk: the multiply of a <<16 value by scale is done with
  32-bit MUL, so a large scale byte could overflow the fixed-point layout; the direction table only has 4 entries,
  so facing ids beyond 3 index past byte_80A7A38.

  '
