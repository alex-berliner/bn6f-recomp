- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#1]; strb r0,[r6,#2]; bl sprite_setAnimation then sprite_loadAnimationData — param
    1 is an animation index applied to the entity; ldrsb pair from byte_80A7A38 at [r6,#2]*1 gives table
    {8,0, 0,8, -8,0, 0,-8} — per-direction ±8 offsets; mul r0/r1 by ldrb r2,[r7,#3], add to [r5,#0xC]/[r5,#0x10],
    store to [r6,#0x1C]/[r6,#0x20] — scaled displacement from current position; mov r0,#0x40; lsl r0,#8;
    svc 6 with r1=[r7,#2] — Div of 0x10000 by param 2, result to r6+0x24 (fixed-point step); str [r5,#0xC]/[r5,#0x10]
    into r6+0x14/0x18 then bl sub_80A7BA2(4), return 1 — records origin and hands off to a follow-up handler
