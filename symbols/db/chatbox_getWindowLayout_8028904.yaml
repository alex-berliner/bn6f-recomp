name: chatbox_getWindowLayout_8028904
address: '0x08028904'
kind: function
status: confirmed
summary: Returns the message-window position (x=0x5B, y=0x87) and a pointer to a fixed tile-layout byte
  table used to draw the chat/text box.
interface: 'void Next sub_8028904(void); /* in: lr only; out: r0 = 0x5B (window x/pos), r1 = 0x87 (window
  y/pos), r6 = &byte_8028918 (layout table); clobbers flags nzcv */'
details: Trivial constant-returning setup routine. Loads r0 with 0x58+3 = 0x5B and r1 with 0x88-1 = 0x87
  (window coordinates, likely the bottom message box at screen position 91,135), and r6 with the address
  of byte_8028918, a 32-byte table. The table's entries look like tile-draw records for the window border/fill,
  e.g. pairs (tile id, count) such as 0x2,0x0 / 0x1,0x0 / 0x2,0x0 / "0x16,0x10 / 0xE,0x0" / "0x16,0x30
  / 0xE,0x0" / 0x1,0x20 / 0x3,0x0 / 0x2,0x0 / 0x3,0x0 / "0x15,0x10 / 0xD,0x0" / "0x15,0x30 / 0xD,0x0"
  / 0x2,0x20 — corner pieces plus repeated edge tiles for a wide, short window, matching the standard
  MMBN text-box frame. Caller consumes r6 (the table pointer) plus r0/r1 (position) after the call, so
  lr is the only live input.
