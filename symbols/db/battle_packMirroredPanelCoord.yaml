name: battle_packMirroredPanelCoord
address: '0x080D9CC2'
kind: function
status: probable
summary: Packs a panel coordinate offset to the opposite arena side (x+3*facing, y) into the r4 request
  word before delegating to the next chip-use handler.
interface: (r0-r3 = chip-use args preserved; r4 = accumulator word) -> r4 |= (panelX + 3*frontDir) <<
  16 | panelY << 24; tail-calls sub_80D9CA4(r0-r3, r4)
details: Calls object_getFrontDirection to get the +1/-1 side multiplier for the battle object in r5,
  multiplies by 3, and adds oBattleObject_PanelX, producing a coordinate shifted into the opposing half
  of the 6-column arena. That value is placed at bits 16-23 and oBattleObject_PanelY at bits 24-31 of
  a packed word, which is OR-merged into r4 (r4 is an in/out accumulator, not saved). r0-r3 are pushed
  on entry and restored right before the tail-call to sub_80D9CA4, so the original arguments reach the
  callee alongside the enriched r4 word. The 17-instruction body is pure coordinate-packing; all real
  work happens in the callee.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mul r0,#3 after bl object_getFrontDirection shows the facing-scaled 3-column offset (asm lines
    4-6); ldrb from oBattleObject_PanelX/oBattleObject_PanelY with lsl 16 / lsl 24 packing shows a (x,y)
    panel word being built; orr r4, r0 merges into a pre-existing r4 rather than returning, so r4 is a
    request word consumed downstream; pop {r0-r3} before bl sub_80D9CA4 shows original call arguments
    are forwarded with the modified r4; executed on recorded chip routes, consistent with chip targeting
    across the arena
