name: ai_pickRandomOffRowPanelFromOffsets
address: '0x08111764'
kind: function
status: probable
summary: Walks an offset table of (x,y) signed pairs (terminated by x==0x7F), mirrors x by the object's
  alliance direction, adds the base column/row, and tests each resulting panel against two flag masks
  via object_checkPanelParameters. Matches whose row differs from the object's own row are stored packed
  as (row<<4|col), then one is chosen randomly with GetPositiveSignedRNG+svc 6 (or 0 if none).
interface: (r4 = offset list of signed (x,y) byte pairs terminated by x==0x7F, r5 = object struct (byte
  0x13 = its row), r6 = object, r0 = base column, r1 = base row, r2 = panel mask-all, r3 = panel mask-none)
  -> r0 = packed candidate (row<<4|column) chosen randomly, or 0 if none; r2 = number of matches; flags
  destroyed.
details: The function walks the r4 table of (x,y) signed-byte pairs until x == 0x7F. For each entry it
  mirrors the x offset by the object's alliance direction (getAllianceDirection), adds the base column/row
  from r0/r1, and calls object_checkPanelParameters with the two flag masks from r2/r3 to test the resulting
  panel. Matching panels whose row differs from the object's current row (ldrb [r5,#0x13]) are packed
  as (row<<4|column) into a stack array. Afterwards GetPositiveSignedRNG plus SWI Div (svc 6, remainder)
  selects a random entry from that array; r2 carries the match count for the caller, and r0 is 0 if nothing
  matched.
