name: ai_falzarAttackSpawnStep
address: '0x0811219C'
kind: function
status: probable
summary: 'AI step for Falzar boss attack: increments StepTimer; on reaching 0x19 spawns an attack via
  sub_80D1442 at panelX+frontDir and plays sound effects 0x1A6 and 0x1A7; when the current sprite frame''s
  attribute bit 0x80 is set, reloads StepTimer from AttackDuration and writes 8 to HitElement to transition
  to the next AI phase.'
interface: (r7 = battle object AI vars struct, r5 = battle object) -> void; updates oAIAttackVars_StepTimer/HitElement,
  spawns attack via sub_80D1442
details: r7 points to an object's oAIAttackVars block; the function increments StepTimer each frame. When
  it reaches 0x19 it calls object_getFrontDirection, adds it to oBattleObject_PanelX, and invokes sub_80D1442(panelX+dir,
  AttackStepIndex, 4, 0x800, AttackBoost2&0xFFFF, Damage, PanelChooseCallback) — evidently a battle helper
  that places/spawns the attack on the target panel, carrying damage and a panel-choice callback. It then
  plays sound effects 0x1A6 and 0x1A7. Every frame it reads the current sprite frame's attribute byte
  via sprite_getFrameParameters; when bit 0x80 is set it reloads StepTimer from oAIAttackVars_AttackDuration
  and writes 8 to oAIAttackVars_HitElement, presumably ending/switching the attack phase. It sits in the
  AI state-handler jump table off_81121F0 alongside sub_8112278 and sub_81120E4, so it is one step of
  a multi-stage boss attack routine; the nearby byte tables (per-level damage/timing bytes) appear to
  belong to those sibling steps.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r7,#oAIAttackVars_StepTimer]; add r0,#1 ... cmp r0,#0x19 — frame counter with a 25-frame
    trigger; bl object_getFrontDirection then add r0,r0,r1 (PanelX) — attack placed on the panel the object
    faces; bl sub_80D1442 with r2=4, r3=0x800 and stack args AttackBoost2, Damage, PanelChooseCallback
    — spawns the attack with damage data; PlaySoundEffect 0x1A6 and 0x1A7 fired together at the spawn
    step; sprite_getFrameParameters; tst r0,#0x80 sets StepTimer=AttackDuration and HitElement=8 — attack-phase
    handoff on animation flag
  refs:
  - bn6f/asm/asm32.s:8498
  - 0x080005CC PlaySoundEffect
  - 0x0800E2CA object_getFrontDirection
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x0811219C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly accurate but misorders arguments: r0 is pushed then r1-r3,r4,r6,r7 are loaded
    afterward, so the call to sub_80D1442 receives (panelX+dir=0x52? no—r0=panelX+dir, r1=AttackStepIndex,
    r2=4, r3=0x40000 shift = 0x80000 not 0x800), not (panelX+dir, ... ,0x800). Also ldr r3,=#4<<16 actually
    loads 0x40000 not 0x800; the ''0x800'' in the proposal is wrong. Two sound IDs are 0x1A7 and 0x1A8
    not 0x1A6/0x1A7 (line `mov r0,#0xa7; add r0,#0xff` = 0x1A6, then `mov r0,#0xa8; add r0,#0xff` = 0x1A7).
    It also doesn''t end on the attribute bit; it reloads StepTimer and sets HitElement to 8 (transitioning),
    which the summary glosses over.; run wf investigate investigate-20261018-182231; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
