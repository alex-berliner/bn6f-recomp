name: ai_falzarAttackSpawnStep
address: '0x0811219C'
kind: function
status: confirmed
summary: 'Per-tick step of Falzar''s attack-projectile spawn animation: at tick 25 spawns a linked object-66 projectile
  in the front panel and plays two SFX; on hit-active sprite frames resets the timer to the attack duration and
  stamps electric (8) as the hit element.'
interface: void ai_falzarAttackSpawnStep(u32 battle_obj /*r5*/, u32 attack_vars /*r7*/); reads/writes nzcv, clobbers
  r0 r2 r3 lr; preserves r4 r5 r6 r7 r10; returns r1=0x80 (flag to caller's AI step dispatcher)
details: 'Advances the 16-bit oAIAttackVars_StepTimer each tick. When it reaches 0x19 (25 frames) the function computes
  a spawn x-panel from object_getFrontDirection + oBattleObject_PanelX, gathers oAIAttackVars_AttackStepIndex, oAIAttackVars_AttackBoost2
  (byte-extracted via lsl/lsr 8), oAIAttackVars_Damage, and oAIAttackVars_PanelChooseCallback, then calls battle_spawnObject66Linked
  (with hard-coded y=4, flag=0x80000) to place the projectile object linked to the caster. Two Falzar-specific sound
  effects (IDs 0x1A6, 0x1A7) are played sequentially. After the spawn block (or when the timer has not yet hit 25)
  the function calls sprite_getFrameParameters on the battle object and tests bit 0x80 (hit-active) of r0; if set
  it overwrites oAIAttackVars_StepTimer with oAIAttackVars_AttackDuration and writes HitElement=8 (electric) so
  the damage handler knows the element. A small jump table at off_81121F0 lists the AI-state dispatch helpers this
  step sits among. The trailing byte arrays (0x112224–0x112272) are attack- pattern lookup tables (panel sequences,
  damage tiers, timing frames) used by sibling AI-step functions rather than by this one directly.

  '
