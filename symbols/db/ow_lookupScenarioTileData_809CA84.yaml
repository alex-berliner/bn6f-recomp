name: ow_lookupScenarioTileData_809CA84
address: '0x0809CA84'
kind: function
status: confirmed
summary: Looks up the scenario/event byte for the tile the overworld player is standing on, returning
  index+1 or 0 if no tile data exists.
interface: static u32 ow_lookupScenarioTileData_809CA84(u32 toolkit /*r10*/, u32 prevStride /*r2 in/out*/)
  -> r0 (scenario byte+1 or 0), r2 (0x18 on hit, prevStride on miss); preserves r4-r7; clobbers r1, nzcv
details: Reads the player's tile-slot byte from eOWPlayerObject+0x83. Fetches the GameState via toolkit[oToolkit_GameStatePtr].
  Derives a row from oGameState_MapGroup (minus 0x90, shifted) and a column from oGameState_MapNumber
  (shifted) to index into the off_809C0F0 tile-data table. If a tile-pointer entry is non-null, sets r2
  to the record stride 0x18 and reads byte offset 0x0D from record (playerSlot - 0x30) * 0x18, returning
  that byte + 1 in r0. On null tile pointer, returns 0 in r0 and leaves r2 unchanged. The subtraction
  of 0x30 suggests slots below 0x30 are not scenario tiles. Called from a cutscene script block near byte_809CAD8
  that gates pet/Nav dialogue and element-folder events based on the returned value.
