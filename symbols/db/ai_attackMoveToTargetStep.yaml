name: ai_attackMoveToTargetStep
address: '0x081086FC'
kind: function
status: probable
summary: Per-frame step of an enemy AI attack that instantly relocates the object to its targeted future
  panel and holds for 13 frames before ending the attack.
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: On the initiating call (AttackElement == 0) it tags the attack as element 4, sets the object's
  animation to 3, releases the panel reserved for the object's current position, then copies FuturePanelX/Y
  into PanelX/Y and releases the reserve on the destination panel as well. It recomputes pixel coordinates
  from the panels and syncs the collision record via object_updateCollisionPanels, clears collision flag
  0x40 (panel reserved), sets the ObjectFlags1 'currently moving' bit, and loads StepTimer with 0xD. On
  subsequent frames (AttackElement != 0) it just decrements StepTimer; once it reaches 0 it calls object_exitAttackState
  to return the AI to normal. The element=4 value likely marks this attack phase for other AI logic rather
  than a damage element.
