name: ai_barrageSpawnStep
address: '0x080EDA0E'
kind: function
status: probable
summary: AI attack-state routine that fires a barrage of linked battle objects (id 0x66) at successive
  panel rows, with sounds, then idles and resets.
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = ?; updates oAIAttackVars state fields (AttackElement,
  StepTimer, ChargeCycles, HitElement, Damage) in place
details: 'Runs as one step of an AI attack state machine keyed on oAIAttackVars_AttackElement: states
  other than 4/8 initialize (StepTimer=3, set the temp attack object''s byte 0x10=1/0x11=0xFF, element=4).
  State 4 waits 3 frames, then for each ChargeCycle spawns object 0x66 linked to the attack, positioned
  at PanelX + front direction and a Y/row offset read from byte_80EDAB4 indexed by (PanelY-1)*2 + (ChargeCycles-1);
  damage = oAIAttackVars_Damage + AttackBoost, passing AttackBoost2 and r3=0x100000. It plays sound effects
  0xA6 and 0xA7, sets StepTimer=10, decrements ChargeCycles, and when cycles run out sets HitElement=8.
  State 8 counts StepTimer down to 0 and resets AttackElement to 0 so the AI attack finishes.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: cmp r0,#4 / cmp r0,#8 dispatch on oAIAttackVars_AttackElement makes it a multi-state attack
    step; bl battle_spawnObject66Linked with Damage+AttackBoost and table byte_80EDAB4 offsets spawns
    the repeated attack objects; two bl PlaySoundEffect with 0xA7-1=0xA6 and 0xA8-1=0xA7 accompany each
    spawn; ChargeCycles decremented per volley and HitElement=8 set on the last one shows a counted multi-hit
    barrage; state 8 path only counts StepTimer down and zeroes AttackElement, i.e. the cooldown/return-to-idle
    state
  refs:
  - bn6f/asm/asm31.s:116375
  - 0x080005CC PlaySoundEffect
  - 0x080D1442 battle_spawnObject66Linked
