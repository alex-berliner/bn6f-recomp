name: chatbox_PrintBuffer_WriteNextGlyph_814E234
address: '0x0814E234'
kind: function
status: confirmed
summary: Fetches the next glyph code from the text stream and writes it (minus 0x40) into a print-buffer state record,
  flagging the record as holding a glyph.
interface: void chatbox_PrintBuffer_WriteNextGlyph(void* fontCtx /* r0 */, PrintBuffer* pb /* r1 */)
details: 'Thin wrapper in the text-printing engine. It saves the real return address in r12 (so the callee sub_814E0D0
  can return straight to this function''s caller when done), then calls sub_814E0D0 to obtain the next glyph code
  for the string being printed. The returned code in r3 has 0x40 subtracted from it (the standard BN font indexing
  offset where glyph data starts at code 0x40) and is stored as a single byte at [r1+0xC], the pending-glyph slot
  of the print-buffer state struct pointed to by r1. Finally the state byte at [r1] is read and OR''d with 0xC,
  marking both flag bits that indicate "a glyph was decoded and is ready to draw" in that struct. r1 (the state
  pointer) is preserved across the internal call, and control returns via r12. The struct at r1 is the per-textbox
  print state used by the chatbox/text renderer; only fields +0x00 (flags/state) and +0x0C (current glyph index)
  are touched here.

  '
