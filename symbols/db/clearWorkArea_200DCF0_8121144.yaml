interface: void clearWorkArea_200DCF0(void); // r0/r1 are set internally; r2-r7 pass through untouched
details: 'Trivial wrapper: loads the address word_200DCF0 into r0, sets r1 = 0x18, and tail-calls

  ZeroFillByHalfword, which fills 0x18 halfwords (0x30 bytes total) at 200DCF0 with zero.

  The register contract reflects the tail-call: r2-r7 are unused inputs that are preserved

  (the callee also preserves them), and the carry/overflow flags returned are whatever

  ZeroFillByHalfword leaves in r0/r1/c/v. No game state, structures, or flags besides the

  buffer itself are touched. Purpose of the 200DCF0 work area is not evident from this

  function alone; likely part of a state-reset or init sequence that callers invoke before

  writing fresh data there.

  '
