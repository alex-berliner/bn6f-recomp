name: win_buildDiagonalEdgeTable
address: '0x08006B94'
kind: function
status: probable
summary: 'Fills an 8-byte-per-scanline table with window-register pairs: per row writes a dword encoding
  WIN0H=(n,n+1) with WIN0V=0xFFFF (a 1-pixel-wide vertical window) followed by 0xFFFFFF00 (full-screen
  WIN1H/WIN1V), stepping n by -0x101 each row to draw a diagonal window edge.'
interface: (r0 = scanline table buffer, r1 = table size in bytes (rows*8), r2 = starting x for the window
  line) -> fills table; clobbers r2, r3, r5.
details: For each 8-byte row, stored back-to-front, it writes a dword 0xFFFF0000|(n<<8)|(n+1) at +0 and
  the constant 0xFFFFFF00 at +4, decrementing n by 0x101 per row. Interpreted as a 32-bit write to 0x04000040,
  the first dword is WIN0H=x2=n, x1=n+1 with WIN0V=0xFFFF (full height), i.e. a 1-pixel vertical window
  line that shifts left one pixel per scanline, forming a diagonal edge; the second dword sets WIN1H/WIN1V
  to the full screen. The byte length r1 is supplied as rows*8 by both callers (0xA0<<3 = 1280 for 160
  scanlines), and the loop terminates when the decremented offset r1 goes negative.
