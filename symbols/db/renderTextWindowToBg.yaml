name: renderTextWindowToBg
address: '0x0812EF60'
kind: function
status: probable
summary: Renders a small text window's glyphs into VRAM via the text renderer and blits its tile map onto
  background block 3.
interface: (r0 = text/source handle, passed through as r1 to renderTextGfx) -> r0 = destroyed; no meaningful
  return
details: Sets up a call to renderTextGfx_8045F8C with the toolkit's text-renderer state (unk_2025070),
  the caller's argument forwarded in r1 (likely a string or text id), palette/map source byte_201B200,
  a VRAM destination base of 0x600B800, dimensions 10x3, and glyph data at dword_86A5D60 (word_2023FA0
  is loaded but unused in this path). After the render it calls sub_812EFA4 (unseen, presumably builds/finalizes
  the tile map at unk_2025A70), then copies a 10x6 block of tile indices from unk_2025A70 into background
  map block 3 at position (i=0xD, j=3) via CopyBackgroundTiles. The 10-wide layout matches between the
  render step and the tile copy, indicating one composed text window/box. The 3-row render inside a 6-row
  copied block suggests the box frame plus text area.
