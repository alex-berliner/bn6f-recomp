name: owMapObject_updateLayerPriorityForPlayerZ_80A95EC
address: '0x080A95EC'
kind: function
status: confirmed
summary: Refreshes an overworld map object's sprite draw priority based on which map layer the player is currently
  standing on.
interface: void owMapObject_updateSpritePriorityByPlayerLayer(mapObject* obj /* r5 */); uses r10 as ambient context
  for the callees; r0-r3 and flags clobbered, r4-r9 and r12 preserved
details: 'Takes a map object in r5. If the object''s byte at +7 is 0 the object is skipped entirely

  (likely an "active/in-use" or visibility flag). Otherwise it calls ReadOWPlayerObjectCoords

  and looks at r2, the player''s current layer/height. If the player is on layer 0, the object''s

  sprite gets a fixed priority of 3 via sprite_setPriority_8002E14 (r5 passed through as the

  second argument, so the callee also receives the map object pointer). If the player is on a

  higher layer, the object''s sprite struct at +0xC is passed to

  applyLayerEffectToOWObject_8035694, which computes a priority from the tile''s layer effect

  (returned in r0), and that value is then set with sprite_setPriority_8002E14. This keeps

  overworld objects sorting correctly against the player when the player moves between

  elevated/foreground layers. The wrapper itself writes no registers; the "outputs"

  r5-r6/r8-r12 are just values left behind by the callees.

  '
