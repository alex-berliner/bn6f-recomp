open_questions:
- Whether r5 points to the OW map object base or to the embedded ObjectSprite (the +0xc offset suggests
  sprite-internal data, but the type byte at +7 is object-header-internal). Worth checking whether callers
  pass an NPC pointer or a sprite pointer; that's the only thing keeping this name from being fully certain.
