status: probable
summary: Build OAM tile-attribute pairs for the chips in one folder for the chip-pack (folder preview)
  sprite layer
interface: (r0 = folder_index, r1 = ptr to folder chip-IDs array of 0x20-stride slots, r2 = memBlock dest
  (size 0x38), r3 = ptr to 4-byte-stride chip-element→OAM-base table, stack r5 = num_chip_slots) -> r0
  = num_oeams_written ; side effects ZeroFillByWord on the 0x38-byte dest, writes 8 bytes per occupied
  slot
details: 'Clears the 0x38-byte output block via ZeroFillByWord. Computes the source slot start as `r1
  + r0*0x20` and walks one chip-slot-halfword per iteration (stepping the source by 0x20, which reads
  chip ID at +0x1c of each folder entry). For each slot: if the high bit (0x8000) of the chip-ID halfword
  is clear, writes two u32 zeros into the dest at offsets r6*4 and r6*4+4. If set, calls getChip8021DA8(id)
  to fetch the chip''s 44-byte data record, reads element/code at +6, then calls battle_synthesizePackEntryFromChipSearchResult_811FF54(elem)
  and multiplies the returned index by 4 to fetch a u32 entry from the table in r3. Packs that entry''s
  low halfword into both halves of a u32 (`lsl r3,r3,#16; orr r3,r1`) and then a second u32 = first +
  0x20002 (an OAM attr2 with affine-enable + shape bits) and writes both at the same dest offsets. Iterates
  `stack_r5` times. Returns the iteration count (r0).

  The 0x8000 high-bit flag marks a valid chip in this fold. Per-chip OAM tile bases come from the table
  at 0xa35c (table indexed by chip element), so chips without an entry in that table are silently skipped
  (no OAM written but iteration still counts toward r0). The fixed `+0x20002` overlay is the OAM attr2
  affine+size constant for the small square chip icon.

  '
