open_questions:
- The exact semantic name of the stored fields (`max`, `bonus`, `tracked object`). The captured
- calls all show the non-equal path being taken (caller is not the tracked object) and r0/r3
- start at 0 in EWRAM, so the function is effectively a no-op for those story2 traces. Whether
- this is a per-turn reset, an enemy-side mirror, or a per-battle accumulator is not resolvable
- from this function alone; cross-referencing `dword_203CFB0` users would settle it.
