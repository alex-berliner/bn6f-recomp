name: object_updateAttackStepTimer
address: '0x0810D34C'
kind: function
status: probable
summary: Advances an object's attack step timer and resets the next charged attack cycle when it expires.
interface: (r0 = implicit current object via r7; r1-r3 unchanged) -> r0 = updated timer; flags preserved
details: Uses r7 to access AIAttackVars and r5 for the battle object, as established by the global battle-object
  context. At step timer 10 it calls object_setCounterTime(20), then decrements StepTimer. When the timer
  reaches zero, it selects animation 4, reloads StepTimer from AttackDuration, clears ChargeCycles, sets
  ScratchVar to 1, and assigns element 12 to HitElement. The function returns without explicitly setting
  a normal C return value; the final timer value remains in r0.
