name: ai_attackStepTick
address: '0x081128DA'
kind: function
status: confirmed
summary: Ticks one step of an AI enemy's attack, switching the battle object from wind-up animation to hit animation
  when the step timer expires.
interface: 'void ai_attackStepTick(u32 attackStarted /*r0: 0 = first step*/, struct BattleObject *obj /*r5*/, struct
  AIAttackVars *vars /*r7*/); clobbers r0 and flags (n, z, c, v); no return value.'
details: 'Called once per step of the AI''s attack routine. On the first step (r0 == 0) it stores 1 into vars+oAIAttackVars_AttackElement
  (a neutral/none element for the wind-up) and sets obj+oBattleObject_CurAnim to 1 (attack wind-up pose). Every
  call it decrements the 16-bit vars+oAIAttackVars_StepTimer; when it reaches 0 the attack lands: obj+oBattleObject_CurAnim
  is set to 2 (hit/impact animation) and vars+oAIAttackVars_HitElement is set to 4 (the element applied by the hit).
  Note the element fields differ in width (AttackElement is a byte, HitElement is a halfword). The function is timer-driven
  with no early exit, so it relies on callers scheduling it and removing it once the timer hits zero.'
