open_questions:
- The exact semantics of sSubmenu.unk_02 == 4 and unk_20 comparison (probably "scroll/animation finished"
  guard that suppresses the timer tick).
- Whether r5 is a chip-select preview object or a folder-browse object — the offsets (0xc/0xd/0xe) live
  outside the documented ObjectHeader/BattleObject regions visible here, so they likely sit in the per-type
  ExtraVars area or a sibling struct.
- What r5[0xe]'s `>>1` vs full-add split actually means in palette-bank layout (likely base bank vs per-chip
  sub-bank).
