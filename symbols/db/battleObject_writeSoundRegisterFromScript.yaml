name: battleObject_writeSoundRegisterFromScript
address: '0x0814E248'
kind: function
status: probable
summary: Battle script opcode handler that writes a byte from the object's update script to a raw PSG/sound
  hardware register.
interface: (r0 = unused on entry, r1 = battle object) -> writes script value to sound register; flags
  n/a
details: The object's per-update script pointer is at [r1+0x40]. The first byte fetched is an index into
  the sound-register block starting at Channel1Sweepregister_NR10_ (NR10 = 0x04000060), giving the destination
  I/O address. It then tails into the shared routine at 814E0D2, which per its known summary reads the
  next script byte, advances the pointer, and validates the pointer; the returned byte is stored with
  strb to the computed register address. So the opcode is '<register offset>, <value>' — a direct poke
  at GBA sound registers from a battle object's script, presumably for scripted sounds/noise.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r3,[r2] / add r2,#1 reads the opcode byte from the script pointer [r1+0x40], same convention
    as battleObject_runUpdateRoutineAndAdvancePC_814E0D0; ldr r0,off_814E25C; add r0,r0,r3 builds the
    destination as Channel1Sweepregister_NR10_ + byte, i.e. an offset into the 0x04000060 sound register
    block; bl loc_814E0D2 reuses the shared script-advance/validate routine, which yields the value byte
    in r3; strb r3,[r0] stores that byte to the computed sound register before returning via bx r12
  refs:
  - bn6f/asm/libs.s:21858
  - 0x0814E0D2 battleObject_runUpdateRoutineAndAdvancePC_814E0D0
  reproduce: python3 tools/asmcat.py 0x0814E248
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
