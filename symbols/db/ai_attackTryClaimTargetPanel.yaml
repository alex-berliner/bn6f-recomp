name: ai_attackTryClaimTargetPanel
address: '0x080F7F1E'
kind: function
status: probable
summary: 'AI attack step: if the object can act and its target panel matches required panel flags, reserves
  that panel and locks itself in place, otherwise falls through to a timed fallback state.'
interface: (r7 = AI attack vars struct, r5 = owner battle object) -> r0 = clobbered, no meaningful return;
  sets oAIAttackVars fields for the next attack step
details: 'First calls object_canMove and aborts to the fallback path if the object is blocked. It loads
  the target panel X/Y from oAIAttackVars_TargetPanelX/Y and calls object_checkPanelParameters with masks
  from off_80F7F70: the panel must have flag 0x10 (dword_80F7F74) and must lack the bits in 0x0F880080
  (dword_80F7F78). On success it calls object_reservePanel to claim the target panel, copies the object''s
  current PanelX/Y into FuturePanelX/Y (so the object stays where it is), calls object_reservePanel again
  (this time for the object''s own panel), and ORs OBJECT_FLAGS_CANNOT_SLIDE into the object''s flags
  so it can''t be pushed. It then advances the AI state: StepTimer=2, HasMoved=1, and sets oAIAttackVars_HitElement
  to 8 (likely the next state/step id rather than an element). On any failure it instead sets AttackDuration=30,
  StepTimer=1, and HitElement=0x1C, a different follow-up state.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_80F7F60: blocked objects take the fallback state immediately; bl
    object_checkPanelParameters with r2=0x10, r3=0x0F880080 from the literal pool: success depends on
    target panel flag state; bl object_reservePanel twice, plus strb PanelX/Y -> FuturePanelX/Y: claims
    target panel while pinning the object to its current panel; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl
    object_setFlag1: prevents the object from being slid during this attack; Success writes StepTimer=2/HitElement=8,
    failure writes AttackDuration=0x1E/StepTimer=1/HitElement=0x1C: two distinct AI follow-up states'
