summary: No-op stub that only returns 0 with the Z flag set; all other registers are preserved.
interface: void sub_8047CA0(void); // returns r0 = 0, Z set / N clear, C unaffected; r2-r7 preserved
details: 'Three-instruction nullsub: pushes r2-r7 and lr, sets r0 = 0, executes `tst r0, r0` (which sets Z and clears
  N based on the zero value), then pops r2-r7 and returns. Callers receive 0 in r0 and zero-comparison flags, and
  nothing else is touched. Since it reads no globals, structures, or memory and performs no side effects, it is
  either a placeholder for removed/optional behaviour (a build left a stub where real code once was or would go)
  or an intentional "do nothing" hook. The C version was verified against the original game. The exact game purpose
  is unobservable from the function body alone; naming beyond "stub returning 0" requires caller analysis.

