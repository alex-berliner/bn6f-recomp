name: ghostNaviCheck_8035274
address: '0x08035274'
kind: function
status: confirmed
summary: Checks whether the player is standing on a ghost Navi trigger in the undernet/network maps and starts the
  shared ghost Navi encounter cutscene if the ghost has appeared but not yet been deleted.
interface: void ghostNaviCheck_8035274(void) — takes nothing (r10 = toolkit pointer is carried over from the caller's
  register form), returns nothing; callers do not read flags.
details: Runs only while normal overworld control is active (IsNotSlipRunningAndNotInCutscene must return no-slip/no-cutscene,
  i.e. Z set on return) and while event flag EVENT_1700 is clear — that flag acts as a one-shot global disable for
  ghost Navi encounters. Reads the GameState pointer from the toolkit (r10 + oToolkit_GameStatePtr), requires GameState_MapGroup
  >= 0x80 (the high map-group range used by the ghost Navi areas), then calls checkCoordinateTrigger_8031a7a on
  the player overworld object's position (OverworldPlayerObjectPtr + 0x1C) to get the coordinate trigger id under
  the player. Only trigger ids 0xD0..0xEF are considered ghost Navi triggers. It then walks a table at word_80352DC
  of 6-byte entries { u16 triggerId, u16 requiredFlag, u16 clearedFlag } terminated by triggerId 0 (entries cover
  triggers 0xD0..0xD6, each requiring flag 0x104/0x21A-region flags per entry and clearing flags 0x1B..0x20 paired
  with parameter words). A parallel table at byte_803530C holds a 4-byte cutscene parameter per entry (values 1..7
  with 0xFF filler). When the player's trigger matches an entry whose required event flag is set (ghost is currently
  appearing) and whose cleared flag is clear (that ghost has not already been battled/deleted), it calls StartCutscene
  with the shared CutsceneScript byte_80990B8 and the table's parameter word, then returns; otherwise it continues
  scanning or exits. Flag checks use TestEventFlag with 16-bit flag ids from the table; the gate uses TestEventFlagFromImmediate
  with EVENT_1700 split as group 0x17 / index 0x00.
