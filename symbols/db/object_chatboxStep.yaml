  and which object/caller invokes this — no callers are known
- 'The summary is mostly accurate, but the chatbox flow relies on sub_813D638 plus a subsequent sub_803BB2C(0xB);
  the proposed summary wrongly says ''sub_803BB94 (chatbox still active?)'' and ordering is off. Also strb writes
