name: battle_deleteObjectWithEffect
address: '0x08016F1A'
kind: function
status: probable
summary: 'Tears down a battle object: spawns the deletion poof effect at its position, releases its panel
  reserve, detaches allies'' targets and its AI source, removes it from the alive-actor list, and sets
  its state to destroy.'
interface: (r5 = battle object to delete) -> r0 = spawned effect object (if not time-stopped); flags clobbered
  by calls
details: Exits immediately if battle_isTimeStop says a time-stop is active, so deletion is deferred during
  time freeze. Reads three words (likely x/y/z position) from object+0x34 and passes them to spawn_t1_0x0_EffectObject,
  which spawns a type-4 object with effect type 0 — the standard deletion/despawn puff. Sets bit 4 (0x4)
  in the spawned effect's oObjectHeader_Flags. Then clears the dying object's slot in its alliance's target
  record (battle_ClearAllianceTargetSlotIfSelf), releases any panel it reserved via oBattleObject_FuturePanelX/Y,
  sets field 8 = 8 on the AI data's spawned-source object (sub_80E1A86, likely a 'source deleted' signal),
  removes the object from the 8-entry alive player actor list, and finally stores CUR_STATE_DESTROY into
  oBattleObject_CurStateActionPhaseAndPhaseInitialized. The object pointer is taken from r5 rather than
  r0, meaning callers invoke it with the object preloaded in a high register (an inlined call convention).
