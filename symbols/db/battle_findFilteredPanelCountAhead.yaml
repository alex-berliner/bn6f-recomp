name: battle_findFilteredPanelCountAhead
address: '0x080ED040'
kind: function
status: probable
summary: Scans columns in the object's facing direction for the first one containing panels that pass
  the alliance-filtered parameter check, and returns how many such panels exist there, defaulting to 6/1
  with r1=0 if the scan leaves the 1–6 field range.
interface: (r0 unused entry, r5 = battle object) -> r0 = count of panels passing the filter in the first
  matching column ahead, or 6/1 when the scan runs off the field; r1 = 0 on the edge path
details: Reads the object's facing multiplier via object_getFrontDirection and its oBattleObject_PanelX,
  then repeatedly adds the direction to the column index. For each in-range column (1..6, stopping at
  0 or >=7) it pushes an 8-byte param entry selected by the object's alliance from byte_80ED080 (param
  0x1 with args 0x4 for one team, 0x8 for the other) and calls GetAllianceDependentPanelParamArgs, then
  object_getPanelsInColumnFiltered to count panels in that column passing object_checkPanelParameters;
  a nonzero count is returned directly. If the walk leaves the board it returns 6 for forward-facing objects
  and 1 for backward-facing ones, with r1 = 0. Callers use it while setting up and iterating an AI attack
  that moves/bounces a target panel, so the count feeds how the attack targets panels of a given type
  ahead.
