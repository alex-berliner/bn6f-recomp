name: battle_queueFixedOverlayOam
address: '0x081267F0'
kind: function
status: probable
summary: If [r5+0x3a] is non-zero, queues one fixed animated overlay OAM entry (r0=0x43, r1=0xe, r2=0,
  r3=0x11, r4=byte_8124A98, r6=0x40000000, r7=byte_8124A9E) via battle_queueAnimatedOamEntry; otherwise
  returns immediately.
interface: (r5 = battle object, flag at [r5+0x3a]) -> none; queues an OAM entry via battle_queueAnimatedOamEntry
  when flag != 0
details: 'A parameterless wrapper that first tests the halfword flag at [r5+0x3a] of the battle object
  (r5 set by callers); if it is zero the routine returns without drawing anything. Otherwise it invokes
  battle_queueAnimatedOamEntry with a fully fixed argument set: r0=0x43 (overlay element id), r1=0xE (count/frames),
  r2=0, r3=0x11 (animation state), r4=byte_8124A98 (per-element animation buffer/table), r6=0x40000000
  (OAM attribute word, likely tile/priority bits), r7=byte_8124A9E (secondary buffer, e.g. the 0xFF-terminated
  animation table or palette/tile data). Since all arguments are constants, the routine draws one specific
  pre-battle overlay sprite each frame while the flag is active. Both known callers run during the battle
  intro/visual-transition phases.'
