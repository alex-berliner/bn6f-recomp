name: rfu_isNotConnected
address: '0x0814656C'
kind: function
status: probable
summary: Returns 1 while the RFU connection state halfword (word_20102D0) is not 3, and 0 once it reaches
  3.
interface: () -> r0 = 0 if word_20102D0 == 3 (connected), else 1; flags set by the cmp
details: Loads the halfword at word_20102D0 — evidently a shared RFU/wireless link state variable — compares
  it against 3, and returns 0 only when it equals 3, otherwise 1. No other state is touched, so it is
  a pure predicate over that global. The value 3 most plausibly denotes the connected/established state,
  making the function a 'not yet connected' test used while polling the wireless connection state machine.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0, off_814657C; ldrh r0,[r0]; cmp r0,#3 — sole input is the halfword state at word_20102D0
    compared to 3; mov r0,#0 / mov r0,#1 branches — boolean predicate returning 0 only for state 3; Caller
    rfu_wirelessConnectStep (0x08049416) runs the wireless-connection state machine, consistent with polling
    for link establishment
  refs:
