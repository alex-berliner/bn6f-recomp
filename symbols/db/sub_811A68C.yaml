name: sub_811A68C
address: '0x0811A68C'
kind: function
status: hypothesis
summary: Looks up a 3-byte ID in a small table by caller-supplied index and dispatches to sub_811A718 (likely an
  e-mail/message slot resolver).
interface: void emailLookupByIndex_811A68C(u32 index_byte in r1); clobbers r0,r1,r2,r3,r4,r12,lr,NZCV; preserves
  r5-r9; sets r10,r11 (return via pop {pc}).
details: 'Function is a thin dispatch: it loads an unsigned byte from a 3-byte table at 0x0811a69c (dword = 0x151413,
  i.e. bytes 0x13, 0x14, 0x15 laid out for indexed access) using r1 as an index (r1 << 0, since ldrb uses [r4,r1]),
  then tail-calls sub_811A718 with that byte in r0. Tail call is implemented literally via `pop {pc}`. Preserved
  r5-r9 and r10/r11-as-output match the typical "secret PET mail/e-mail" accessor pattern in BN6 (sub_811A718 is
  likely a routine that resolves a mail entry from the ID, leaving the resolved pointer/data in r10/r11). The 0x13/0x14/0x15
  sequence looks like consecutive mail indices, consistent with iterating the three in-game e-mails (Courage/Hope/Love)
  — hence the guess at name. No flag semantics beyond what sub_811A718 itself consumes/produces.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
