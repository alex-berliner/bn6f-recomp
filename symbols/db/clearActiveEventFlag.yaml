summary: Clears the single story event flag selected by the current value of a global state byte
interface: () -> r0 = 0; calls ClearEventFlag(flagId)
details: Loads a singleton struct pointer from off_808F5D4[0], reads its byte field at +0xC (likely a
  scenario/progress counter), doubles it, and indexes the halfword table byte_808FC74 to get an event
  flag ID. It then calls ClearEventFlag (0x0802F130) with that ID, clearing one story-progress flag. Always
  returns 0. The table maps each value of the +0xC byte to a flag ID, so the flag cleared depends on current
  game state. With no known callers, the meaning of the +0xC field is inferred, not confirmed.
