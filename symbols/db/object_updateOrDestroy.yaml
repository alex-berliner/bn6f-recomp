name: object_updateOrDestroy
address: '0x080CDFEE'
kind: function
status: probable
summary: 'Shared per-frame battle-object update: tears down collision data, frees the object if its Param2
  flag is set, otherwise dispatches its CurAction state handler.'
interface: (r5 = battle object ptr) -> void
details: 'Runs each frame for a battle object (uses r5 as the object, set up by caller sub_80CDFA4). It
  first removes the object''s collision data. If oBattleObject_Param2 is nonzero, it takes the destroy
  path: clears its collision region, frees its collision-data slot via oBattleObject_CollisionDataPtr,
  and releases the object slot entirely. Otherwise, if the battle is over it calls sub_802CEA6 with oBattleObject_Alliance
  (probably a battle-end cleanup/notification), else it dispatches through a per-CurAction jump table
  (off_80CE02C, two handlers: sub_80CE034, sub_80CE05E), and after the handler returns it refreshes collision
  state via object_presentCollisionData.'
