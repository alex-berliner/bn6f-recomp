- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData at entry: per-frame collision teardown; ldrb r0,[r5,#oBattleObject_Param2];
    tst; bne destroy path calling object_clearCollisionRegion/object_freeCollisionData/object_freeMemory;
    ldr r1,[r1,r0] indexed by oBattleObject_CurAction over off_80CE02C: state-machine dispatch; bl battle_isBattleOver
    / sub_802CEA6(alliance): battle-over alternate branch; bl object_presentCollisionData after bx lr
    handler: normal per-frame collision refresh'
