open_questions:
- The exact identity of unk_2026870 (an EWRAM animation/duration array) and byte_8127984 /
- byte_812798A (the anim and duration tables) is not labeled in the project; what each entry
- '"animates" (number sprite? HP popups? counter sprites?) would settle the role further.'
- Whether the slot here corresponds to the four "battle object sub-flag" positions in
- BattleState or to a separate OAM slot pool is unclear from this function alone.
