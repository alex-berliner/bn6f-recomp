name: getMapAreaDataTableEntry_80A82A4
address: '0x080A82A4'
kind: function
status: confirmed
summary: Returns a pointer into a per-map data table (8-byte records) for the current map area, offset
  by the caller object's byte at +4.
interface: u32 getMapAreaDataTableEntry_80A82A4(void *obj /*r5*/, void *toolkit /*r10*/); // returns r0
  = base + 8*obj[4], no flags defined
details: 'Reads the GameState pointer from the toolkit (r10 + oToolkit_GameStatePtr) and derives an

  area index: if oGameState_MapGroup == 0x85 it forces index 3 (the fourth table, presumably

  shared by that whole group), otherwise it uses oGameState_MapNumber. Indexes the pointer

  table at off_80A82CC (entries byte_80A804C, byte_80A8084, byte_80A80CC, byte_80A8114) with

  area_index*4, then adds 8 times the byte at [r5,#4] (an object-local slot/record index).

  The result is an address of an 8-byte record within the selected map''s data blob, so each

  map''s blob holds records indexed by the object''s field. Callers presumably consume r0 as a

  pointer to the record (this function itself only builds the address). r5 (object) and r10

  (toolkit) are frame-register conventions of the caller; r0-r3 and flags are clobbered.

  '
