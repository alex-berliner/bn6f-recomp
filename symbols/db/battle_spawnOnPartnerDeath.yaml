name: battle_spawnOnPartnerDeath
address: '0x080BC494'
kind: function
status: probable
summary: If the object's linked partner (RelatedObject1Ptr) has HP 0, spawn a cross-linked battle object
  via battle_spawnLinkedObject_80E1A6A and set Timer=0x20, CurAction=0xC; otherwise leave it alone.
interface: (r5 = battle object) -> r0 = 0 if the partner was dead and the spawn/state change happened,
  otherwise r0 = partner HP (nonzero); no flags meaningful
details: Loads oBattleObject_RelatedObject1Ptr and tests its oBattleObject_HP; if it is nonzero the function
  returns immediately (r0 still holds that HP). When the partner's HP is 0, it calls battle_spawnLinkedObject_80E1A6A
  with r4 = 0x10000 and r7 = AIDataPtr+0x74, so the spawned type-0x11 object is cross-linked with this
  object and gets a pointer into the AI data at offset 0x74 for tracking. It then writes Timer = 0x20
  and CurAction = 0xC on the parent object at r5, and returns 0. The 0x10000 constant and the AI-data
  offset are the only opaque values; the spawned object's identity depends on battle_spawnLinkedObject_80E1A6A.
  Called from sub_80BC284/sub_80BC29C in recorded battle routes, consistent with an enemy AI routine gated
  on partner death.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r0,#oBattleObject_HP]; cmp r0,#0; bne locret — only acts when the related object's
    HP is 0 (80BC496-80BC49C); bl battle_spawnLinkedObject_80E1A6A with r7=[r5,#oBattleObject_AIDataPtr]+0x74,
    r4=0x10000 — spawns a linked object tracked via AI data (80BC4A4); strh 0x20,[r5,#oBattleObject_Timer];
    strb 0xC,[r5,#oBattleObject_CurAction] — puts this object into a new timed action state (80BC4AA-80BC4AE);
    callers sub_80BC284/sub_80BC29C run in battle routes, matching an AI-state helper; callee's known
    summary confirms type-0x11 spawn cross-linked to parent + optional pointer slot
