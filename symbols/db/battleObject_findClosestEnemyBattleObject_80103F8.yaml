summary: Finds the closest enemy BattleObject to a panel (panel coords passed via stack) and returns it
interface: '(r0 = actorIndex 0..3 [OpponentActors slot index], r5 = self BattleObject*) -> r0 = closest
  enemy BattleObject* (or NULL); side effects: stack scratch for two (X,Y) pairs'
details: "Saves PanelX/PanelY of self (r5) into [sp+0]/[sp+4] as the \"self panel\" probe.\n  Loads BattleStatePtr\
  \ via r10 (= Toolkit), indexes into BattleActors[r0] (4-byte ptr slots\n  for a 4-slot opponent array),\
  \ iterates r4=4 slots pulling the BattleObject* from each\n  AliveOpponentActors-like slot. For each\
  \ non-null slot, reads CurState (skip if ==8, the\n  destroy state) and calls unpackVerActorTyAndAIIdx_800F29C\
  \ on NameID; the function returns\n  the ActorType. Only ActorType in {0,1,2} (VIRUS/NAVI/PLAYER) are\
  \ accepted as candidates;\n  values 0 and 1 share the same branch (loc_8010432), value 2 likewise.\n\
  \  Each candidate's PanelX/PanelY is passed (along with self's [sp+0]/[sp+4]) to sub_8010460,\n  which\
  \ returns a manhattan-ish distance. The candidate with the minimum distance wins;\n  r7 is the running\
  \ best, and the push/pop at loc_8010452 carries the previous best's\n  distance forward so the new candidate\
  \ can be compared with ble. Ties are not replaced\n  (the ble keeps the earlier one in r7). At the end\
  \ r7 (= the winning BattleObject*) is\n  returned in r0, with NULL meaning no live candidate was found.\n\
  \  Used by many enemy-virus/AI step functions (Mettaur, Swordy, Puffy, ...) to pick a target\n  object\
  \ for the next AI decision.\n"
