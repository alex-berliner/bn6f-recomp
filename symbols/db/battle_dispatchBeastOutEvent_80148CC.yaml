    r0, [r5,#1]` at 0x080148d2 reads the discriminator byte from a struct pointed to by r5 (callee-saved
    across the dispatch); r5 is in the function''s `in=` set. - `ldr r1, [r1, r0]; mov lr, pc; bx r1`
    at 0x080148d4-0x080148dc is a classic Thumb switch/jump-table via PC. - The three tail-call targets
    are listed in off_80148E0 with Thumb bit set: 0x80148ED, 0x8014945, 0x801498F. Their project names
    contain "BeastOut"/"Beast Out", confirming this is the Beast Out pipeline. - Captured calls all show
    r5 = 0x02036828 (EWRAM), r0 = 4 (input), exit r0 = 1 with carry set — consistent with "event ran,
    return 1 to caller".'
