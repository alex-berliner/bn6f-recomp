summary: 'Beast Out sub-state dispatch for an actor: dispatches on actor type to a per-event routine'
interface: (r5 = actor-related state) -> tail-call to one of three routines; returns their result
details: "1. Saves lr and loads a 3-entry jump table (off_80148E0) via off_80148DC.\n  2. Reads the low\
  \ byte at [r5+0x01] — given the captured calls all return r0=1 with that byte\n     treated as an actor/type\
  \ discriminant (the adjacent field is typically the type/index of\n     the actor record the AIData\
  \ lives in; the callee naming \"beastsp\" plus the\n     `BeastOutAPwrAtk` field on AIData suggests\
  \ the discriminant is the AIData's actor type\n     byte at offset 0).\n  3. Performs `ldr r1, [r1,\
  \ r0]; mov lr, pc; bx r1` — a Thumb switch on r0 that tail-calls\n     the chosen routine with the original\
  \ lr on the stack.\n  4. `pop {pc}` then either returns through that pushed lr or — because the callee\
  \ ends with\n     `+1` (BX) and `pop {pc}` — returns directly to the original caller of 0x80148CC.\n\
  \  5. Targets are: `battle_toggleBattleScreenFadeOrSomething_80148EC` (index 0),\n     `activateCrossHappensHere_8014944`\
  \ (index 1), and `battle_runBeastOutIntro_801498E`\n     (index 2). The `+1` Thumb bit on each address\
  \ marks them as Thumb entry points.\n  6. The captured calls always return r0=1 with C flag set (--C-),\
  \ consistent with the\n     callees reporting \"I handled this beast-out phase\" to the per-frame actor\
  \ updater.\n"
