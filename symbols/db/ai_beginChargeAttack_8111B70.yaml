name: ai_beginChargeAttack_8111B70
address: '0x08111B70'
kind: function
status: confirmed
summary: Starts a boss AI charge attack — puts the battle object in charge animation 4 with a 30-frame timer and
  marks it as charging with hit element 4.
interface: void sub_8111B70(battle object r5, ai attack vars r7) -> r1 passthrough from object_setFlag1; NZCV clobbered
details: 'Battle-object AI state helper called from boss AI routines. It stores animation id 4 into the battle object''s
  oBattleObject_CurAnim byte (r5), sets oAIAttackVars_ChargeCycles (r7) to 30 (0x1E), calls object_setFlag1 with
  (1 << OBJECT_FLAGS_UNK_BIT_22_BIT) and the object pointer in r5 — presumably the "is charging" flag — then writes
  hit element 4 into oAIAttackVars_HitElement (r7). The value object_setFlag1 leaves in r1 is returned unchanged,
  which is unusual and suggests callers ignore it or the caller-side contract was inferred rather than intended.
  r0, r2, lr and flags are free to clobber.

  '
