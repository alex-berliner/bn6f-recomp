name: ai_attackStageTargetPanel
address: '0x080F6E20'
kind: function
status: probable
summary: 'AI attack-state step: runs the object''s panel-choose callback once to pick a target panel,
  plays a short charge animation, then applies the hit element, or exits the attack if it cannot act.'
interface: (r0 = battle object (also r5/r7 point to its object/AI-vars)) -> r0 = unspecified; uses object
  flags and AI attack vars
details: On the first call (AttackElement == 0) it latches AttackElement = 4, checks object_canMove, and
  invokes the stored PanelChooseCallback; the callback returns target panel X in r0 and Y in r1 (r0 is
  preloaded from AttackBoost2 as input), which are written to TargetPanelX/Y. On success it sets OBJECT_FLAGS_CANNOT_SLIDE
  plus bit-22 flag via object_setFlag1, marks HasMoved = 1, switches CurAnim to 4, and sets StepTimer
  = 3 as a charge delay. On later frames (AttackElement != 0) it decrements StepTimer and, when it expires,
  sets HitElement = 8, triggering the actual hit. If the object cannot move or the callback fails (returns
  r1 == 0), it clears HasMoved and calls object_exitAttackState. The element values (4 start, 8 hit) and
  the callback-driven panel targeting suggest a specific enemy's attack routine stored per-object.
