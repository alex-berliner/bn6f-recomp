name: sub_8120390
address: '0x08120390'
kind: function
status: confirmed
summary: Builds a folder display record from a template and queues each folder entry's battle-chip sprite GFX, clearing
  unused slots
interface: void battle_loadFolderChipGfx(u32 first_entry_index, u32 entry_array_base, u32 dest_record, u32 template_src,
  u32 gfx_slot_base, s32 entry_count) // takes args in r0-r5, no meaningful return; r0-r3 and lr clobbered, r4-r7
  preserved
details: 'First copies a 0x38-byte template record (r3) over the destination record (r2) with CopyWords, establishing
  the record''s default contents. Then iterates over `entry_count` folder entries of 0x20 bytes each, starting at
  entry_array_base + first_entry_index * 0x20. For each entry it reads the halfword at +0x1C and shifts it right
  by 7 to extract the chip ID (upper 9 bits, leaving flag bits below). If the chip ID is nonzero, it looks up the
  chip via getChip8021DA8, reads the image pointer at ChipData+0x20, and queues a 0x80-byte word-aligned GFX transfer
  into the next slot at gfx_slot_base (which advances 0x80 per entry). If the chip ID is zero, it instead stores
  two zero words (8 bytes) to the corresponding output words at dest_record, zeroing that entry''s display data.
  dest_record itself is not advanced by the loop — only the gfx slots move and the pair of cleared words advances
  8 bytes per iteration from the record base. Caller passes the last two arguments in r4 and r5 (callee-saved but
  not modified), and the listed r6/r7 "outputs" are just preserved entry values.

  '
