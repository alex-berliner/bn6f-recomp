name: CopyBytes
address: '0x08000920'
kind: function
status: confirmed
summary: A backwards byte-copy routine (memmove-style), safe when the destination is at or above the source (shifting
  data toward higher addresses).
interface: 'void CopyBytes(const void *srcEnd /*r0*/, void *dstEnd /*r1*/, int count /*r2*/); // copies count bytes
  from srcEnd[0..count-1] to dstEnd[0..count-1], // walking from the highest byte down to the lowest. // Returns
  r2 = 0, r3 = last byte copied (src[0]); // flags from the final subs (1-1): Z=1, C=1, V=0.

  '
details: 'Simple byte-copy loop that decrements first and copies with ldrb/strb indexed off r0/r2 and r1/r2, so
  r0 and r1 act as the *end pointers* of the source and destination regions and r2 is the byte count. Because it
  copies from the highest index down to index 0, it behaves like a memmove that is safe for overlapping regions
  where dst > src (i.e. shifting a buffer contents toward higher addresses); copying front-to-back in that case
  would corrupt the data. It is NOT safe for dst < src overlap. r0 and r1 are preserved, r2 ends at 0, and r3 is
  left holding src[0] (the last byte copied). Flags are deterministic: the loop exits via the decrement 1 - 1 =
  0, giving Z=1, C=1 (no borrow), V=0. Callers that need the forward direction (dst < src overlap) must use a different
  copy routine.

  '
