name: sub_80EBF10
address: '0x080EBF10'
kind: function
status: confirmed
summary: Dispatches an AI attack step to a per-type handler via a 3-entry jump table indexed by oAIAttackVars_Unk_00.
interface: 'void battle_aiAttackHandlerDispatch_80EBF10(void);

  // r7 = AI attack vars pointer (in)

  // r3, r5, r6, r10, lr (caller''s lr) used by callee (in)

  // r1, r5, r8, r9, r10, r11, r12 returned/used (out)

  // NZCV + r0, r2, r3, r4, r6, r7, lr clobbered

  '
details: "Reads an 8-bit attack-type selector at offset oAIAttackVars_Unk_00 (0) of the\nAI attack vars block pointed\
  \ to by r7. Uses it to index a 3-entry jump\ntable at off_80EBF24:\n  - type 0: aiAttack_genericSpawnAndCountdown_80EBF30\
  \ (generic spawn-and-countdown step)\n  - type 4: sub_80EBF6E\n  - type 8: battle_aiWindRackAttackStep_80EBFF4\n\
  Loads the handler address into r1 and the type byte into r0, sets lr to\nthe pop-pc return, then bx r1 to call\
  \ the handler. Effectively a tail\ncall through a small table of battle AI attack step implementations.\n"
