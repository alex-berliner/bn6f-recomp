name: object_countdownTick_802BEFC
address: '0x0802BEFC'
kind: function
status: confirmed
summary: Ticks down a per-object countdown byte at +0xB and advances the object's state byte at +3 to 8 when it
  expires.
interface: 'int object_countdownTick_ADDRESS(Object *r5); /* in: r5 = object struct, lr = return; out: r0 = decremented
  counter (or 8 when expired), NZCV flags set by SUBS/MOVS */'
details: 'Acts on a structure passed in r5 whose byte at +0xB is a countdown timer and whose

  byte at +3 is a state/mode selector. Each call decrements [r5+0xB]; as long as the

  result is nonzero the call does nothing else. When the counter reaches 0 the state

  byte [r5+3] is set to 8, i.e. this is a delay-then-transition step in some object''s

  state machine (8 being the next state after the timed wait). The caller must keep

  the struct pointer in r5 across the call (the function does not reload it), and it

  reads back r0 plus the flags: r0 holds the decremented counter, or 8 if the timer

  expired, and the flags reflect the last "compare count to 1" (SUBS) or, on expiry,

  the MOV of 8. The register contract shows clobbers "-" because only r0, flags and

  the struct memory are touched and r0''s value is deliberately returned.

  '
