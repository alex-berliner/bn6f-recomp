summary: Zeros the 4-byte chip-gift/folder record at 0x20018EC and then invokes the chip-taking routine for folder
  slot 0.
interface: void sub_8137808(void) — no meaningful inputs; scratch-only use of r2/r4-r7/r10 per callers is incidental;
  returns with r4-r7 preserved and flags clobbered.
details: 'Wrapper of two calls. First it loads the pointer to the 4-byte record at unk_20018EC (EWRAM work area)
  and calls ZeroFillByByte on it with a length of 4, wiping the whole record. It then calls takeChipsWhenGivingFolderIfFolderSlotInUseMaybe_813781C
  with r0 = 0, i.e. targeting folder slot/index 0; the callee sees the freshly cleared record via its global pointer.
  r4 is used only as scratch inside this thunk and is saved/restored around the calls, so nothing is passed through
  to the callee in r4 despite the callee''s declared input list. The "takeChipsWhenGivingFolder..." callee suggests
  this is part of the chip-gifting/trade flow where a record must be reset before chips are pulled from slot 0 of
  the folder.

  '
