name: initSpriteVariant
address: '0x0811D464'
kind: function
status: probable
summary: Initializes a sprite object by indexing into two type tables (sprite id, palette, animation)
  using [r5+5]; the [r5+4] flag toggles between two visual variants (halfword 0x100/0x200, palette bank
  2/6, byte 0x10/0x11 at [r5+0xc]).
interface: (r5 = object/state ptr; [r5+4] = variant flag, [r5+5] = type index) -> r0 = 0; sets up sprite
  slot for the object
details: 'Reads [r5+5] as an index into byte_811D4E8 (10 GUI sprite ids: five 0x8A then 0x59-0x5D) and
  calls initGuiSprite_8002770, then sets animation (all zeros), loads animation data, disables the shadow,
  and sets a palette from byte_811D526 (5, 0x11, 0xB, 0xF, 0x15) plus priority 2. The variant flag [r5+4]
  selects halfword 0x100 vs 0x200 stored via slotList_storeHalfwordAndClearField_800306C, sub-entry palette
  bank 2 vs 6, and a byte 0x10 vs 0x11 written to [r5+0xc]. Sets sub-record field A to 4 and fixed coordinates
  (0x78, 0x80) via sprite_setCoordinates. Finally applies color shader 0x7FFF (likely the neutral/default
  shader). The function is clearly a sprite-entity setup routine with two visual variants, but without
  callers its specific game role is not identifiable from the code alone.'
