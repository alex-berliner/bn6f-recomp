name: battle_earthquakeAttackUpdate
address: '0x080BBD60'
kind: function
status: probable
summary: 'Phase handler for a battle object''s ground-shake attack: shakes the camera and rumbles for
  ~150 frames, then hands control to the next action.'
interface: (r0 unused on entry, r5 = battle object) -> void; updates oBattleObject_CurPhase/Timer/Timer2/CurAction,
  plays SE 0xE5, triggers camera shake
details: 'On entry with CurPhase == 0 it initializes the attack: sets CurPhase to 4, Timer to 0x96 (150
  frames), Timer2 to 0, zeroes ExtraVars+4/+8, plays sound effect 0xE5 (a rumble/quake sound), and calls
  camera_initShakeEffect with magnitude 2 and duration 150. While the main timer counts down, Timer2 acts
  as a 25-frame sub-timer that repeatedly calls sub_80BBE58 (likely spawning debris/dust per shake pulse)
  and reloads Timer2 with 0x19. When the 150-frame Timer expires, it sets CurAction to 0x10 and clears
  CurPhaseAndPhaseInitialized so the object''s state machine advances to the next action. The whole thing
  reads like an earthquake-style enemy attack that lasts 2.5 seconds.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'init block: SE 0xE5 via PlaySoundEffect plus camera_initShakeEffect(2, Timer=0x96) = a long
    magnitude-2 screen shake; repeating sub_timer: ''bl sub_80BBE58'' then ''mov r0,#0x19; strh r0,[r5,#Timer2]''
    fires every 25 frames while the quake runs; completion: ''mov r0,#0x10; strb r0,[r5,#CurAction]''
    with phase reset ends the state and moves to the next action; uses oBattleObject_CurPhase/Timer/Timer2/ExtraVars
    fields exactly like other battle object attack phase handlers'
