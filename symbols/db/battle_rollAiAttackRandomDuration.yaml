name: battle_rollAiAttackRandomDuration
address: '0x080FBD54'
kind: function
status: probable
summary: Rolls a random byte used as AI attack timer/cycles, by calling a shared RNG helper with a randomizer
  seed.
interface: () -> r0 = random byte; uses dword_80FBD64
details: A thunk that loads the address of dword_80FBD64 (value 0x1E28323C) into r0 and tails into sub_800FE28,
  which is shared RNG machinery. Its return value (a byte) is stored into oAIAttackVars_TimerOrCycles
  by ai_initProtoManPanelAttack. The sibling sub_80FBD40 follows the identical pattern and feeds oAIAttackVars_AttackBoost2,
  so this pair likely provides two independent randomized parameters used during ProtoMan's panel-attack
  setup.
