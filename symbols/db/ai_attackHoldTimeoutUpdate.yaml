name: ai_attackHoldTimeoutUpdate
address: '0x080ECC60'
kind: function
status: confirmed
summary: Per-frame update for an AI's held attack state; runs a 20-frame hold timer then clears the temp attack
  object and exits the attack state.
interface: void ai_attackHoldTimeoutUpdate(r5 battleObject, r6 passThrough, r7 attackVars); returns r1 (pass-through
  on early path, or whatever object_exitAttackState leaves in r1); clobbers r0-r3, r6, r7, lr, flags
details: 'Operates on an AI attack variable block at r7 (fields oAIAttackVars_AttackElement and oAIAttackVars_StepTimer).
  On the first call, when AttackElement is still 0, it initializes the hold: StepTimer = 0x14 (20 frames) and AttackElement
  = 4 (a placeholder/default element marker). Every call then decrements StepTimer (halfword) and returns while
  it is still >= 0, keeping the AI in its attack-hold pose. When the timer underflows, the hold is released: RelatedObject1Ptr
  in the battle object (r5) and oAIData_TempAttackObjectPtr in the object''s AI data block (via oBattleObject_AIDataPtr)
  are both zeroed, then object_exitAttackState is called with r5/r6/r7 preserved to make the AI leave the attack
  state. r1 is the outgoing value: passed through unchanged on frames where the hold is still active, otherwise
  whatever object_exitAttackState returns in r1. r6 appears to be an untouched pass-through argument for object_exitAttackState.

  '
