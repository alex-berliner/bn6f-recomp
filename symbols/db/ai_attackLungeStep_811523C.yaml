name: ai_attackLungeStep_811523C
address: '0x0811523C'
kind: function
status: confirmed
summary: One step of an AI-controlled enemy's lunge/dash attack - counts down a wind-up timer, then launches the
  object forward onto its current panel with a sound and element tag.
interface: sub_811523C(r5 = battle object, r7 = oAIAttackVars state block) -> r1, r5 from sub_8115492; r10 as left
  by PlaySoundEffect on the lunge path
details: "Per-frame update for one phase of an enemy attack (probably shared by several AI users via\nthe AIAttackVars\
  \ state block in r7). Calls ai_attackVarsTimerTick16 first (some timers in the\nblock tick every frame regardless\
  \ of phase), then decrements oAIAttackVars_StepTimer.\nWhile the timer is still >= 0 nothing else happens this\
  \ frame. Once it expires:\n  - reads oAIAttackVars_ScratchVar as a stride multiplier, computes\n    XVelocity\
  \ = object_getFrontDirection(r5) * ScratchVar and stores it into\n    oBattleObject_XVelocity - i.e. the object\
  \ suddenly dashes toward the player at a\n    configured speed/direction.\n  - copies the object's current PanelX/PanelY\
  \ into its FuturePanelX/FuturePanelY fields,\n    so the engine treats the panel it stands on as the one it is\
  \ moving into (it lunges\n    onto the panel it occupies / the one ahead, depending on how the engine resolves\n\
  \    future panels).\n  - calls object_reservePanel with panelX/panelY to reserve that panel (preventing the\n\
  \    player from using it / registering the incoming body), then plays sound 0x187\n    (SFX_PANEL_LUNGE, encoded\
  \ in code as mov #0x88, add #0xff), passing reservePanel's\n    leftover r2 as PlaySoundEffect's r2.\n  - stores\
  \ HitElement = 8 into oAIAttackVars_HitElement, tagging the damage type for the\n    strike that follows the lunge.\n\
  On both paths (timer still counting and lunge fired) it tail-calls sub_8115492, which\nreturns r1/r5 that are\
  \ propagated to the caller.\nQuirk: PlaySoundEffect is called with r2 straight from object_reservePanel's leftover\n\
  register output - an untyped argument whose meaning depends on reservePanel's ABI.\n"
