summary: reads AIData.Version_15..Version_17 into r0..r2 from the EWRAM AIData struct
interface: () -> r0 = AIData.Unk_15, r1 = AIData.Version_16, r2 = AIData.Version_14 ; no side effects
  beyond register output
details: "Loads the global pointer at off_8141B14 (= eStruct2001010) into r5. Then loads three\n  bytes\
  \ from that struct into r0/r1/r2:\n    r0 = byte at +0x16  (struct offset 0x16)\n    r1 = byte at +0x15\
  \  (struct offset 0x15)\n    r2 = byte at +0x14  (struct offset 0x14)\n  The disassembly comment labels\
  \ these as (dword_2001024+0/1/2 - 0x2001010), i.e.\n  eStruct2001010 + 0x14..0x16. Cross-referencing\
  \ AIData.inc shows AIData fields at\n  those offsets: Version_15 at 0x15, Version_16 at 0x16, Version_14\
  \ is implicit\n  around there (the struct skips 0x13..0x14 with `u8 Unk_13` then `.space 0x1`\n  before\
  \ Unk_15). So this is returning three AI/version-related bytes from the\n  shared EWRAM AIData block.\
  \ The argument convention is unusual: it returns three\n  bytes in r0/r1/r2 rather than packing them.\
  \ Probably a small inline getter for\n  callers that want to inspect the AI/version triple; both callers\
  \ are battle\n  AI routines (sub_80A7BC0 / sub_811E202 are unnamed but route through the AI\n  update\
  \ chain in the snapshots).\n"
