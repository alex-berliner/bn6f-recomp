name: object_addHP
address: '0x0800E2EC'
kind: function
status: confirmed
summary: Adds R0 to a battle object's HP, clamped to MaxHP, returning the new HP in R1.
interface: void object_addHP(u16 amount, oBattleObject* obj) -> u16 newHP; clobbers nz,c,v
details: 'Increments the HP field of the object in `r5` by the amount passed in `r0`,

  then clamps the result to the object''s MaxHP field. Stores the new value

  back to the HP field and returns the resulting HP in `r1`. Touches the

  standard battle-object fields oBattleObject_HP and oBattleObject_MaxHP.

  Typical use is healing/HP-over-time ticks on a battler; it cannot push HP

  above MaxHP, but does not appear to do anything special if the object is

  already at MaxHP (the add and clamp are unconditional).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
