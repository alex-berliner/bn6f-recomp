name: battle_drawFolderScreen
address: '0x081304EC'
kind: function
status: probable
summary: Renders the in-battle chip-select folder panel (chip name, chip gfx, OAM pack, icon slots, chip-pack
  entries) into background tile block 2 from the current state struct fetched via sub_8130404.
interface: () -> r0 = destroyed; renders tiles into background tile block 2; uses global state from sub_8130404
details: Fetches a state struct via sub_8130404; if byte +0xC is 0 it only calls call_sub_3005EBA(8,8,2,0,0xF,0xA)
  (likely blanking that screen area). Otherwise it indexes a table at dword_8130618 by (byte[+0xC]-1)
  to pick a halfword field of the struct (offsets like 0x24) — evidently a chip/folder id — and drives
  five battle_* renderers in sequence into work buffers unk_2023FB0/20243E8/20244C8/2024500/2024538/2024554,
  copying each result into tile block 2 at fixed positions (name row at 10,8; chip gfx at 8,8; OAM pack
  at 0x12,8; icon slots at 0x14,8 with 1-wide copy; pack entries at 0x15,8). The VRAM base constants 0x6007200/0x6006B80
  and tile ids 0x35C/0x216/0x34F are passed as gfx destinations.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: five callees are the known chip-select/folder renderers (drawChipSelectFighterNames, loadFolderChipGfx,
    buildChipFolderOamPack, loadChipIconSlots, fillChipPackEntries); each callee is followed by CopyBackgroundTiles
    into which_tile_block 2 at successive x positions 10/8/0x12/0x14/0x15, y=8; ldrb r0,[r7,#0xC] / sub
    r0,#1 / ldrb r0,[r1,r0] / ldrh r0,[r7,r0] selects a per-folder halfword (chip id) from the state struct;
    byte[+0xC]==0 path only calls call_sub_3005EBA with the same tile-block-2 region args, i.e. the empty/blank
    case; callers sub_812F530/812F920/8130084/8130370 sit in the same 0x812Fxxx battle chip-select code
    cluster
