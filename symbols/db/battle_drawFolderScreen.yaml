  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The function clearly renders the in-battle chip-select folder panel: it draws chip names, chip graphic,
    OAM pack, icon slots, and chip-pack entries into tile block 2, consistent with the callees. However,
    it does not ''blank'' the area on byte +0xC == 0 — call_sub_3005EBA with args (8,8,2,0,0xF,0xA) is
    just another render call (not a clear), and the proposal''s claim that it ''only calls call_sub_3005EBA''
    omits the rest of the logic. Also the proposal says r0 is destroyed, which is trivially true and meaningless;
    more useful is that r0 actually returns the state pointer. The summary''s overall direction is correct
    but the blanking detail is wrong.; run wf investigate investigate-20261018-223614; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
