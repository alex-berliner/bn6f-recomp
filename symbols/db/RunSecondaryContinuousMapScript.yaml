name: RunSecondaryContinuousMapScript
address: '0x08036064'
kind: function
status: confirmed
summary: Runs the secondary continuous map script by dispatching each op byte through MapScriptCommandJumptable
  until a handler returns zero.
interface: "void runSecondaryContinuousMapScript_8036064(void)\n  // inputs (from caller / loop entry): r1, r2,\
  \ r3, r8, r9, r10, r11, lr\n  // outputs to caller (after last handler): r1, r2, r9, r10, r11\n  // clobbers:\
  \ r0, r3, r8, lr, flags N/Z/C/V\n  // preserved across the function: r4, r5, r6, r7, r12\n  // per-iteration loop\
  \ exit: handler bx-target returns Z-set → break; Z-clear → continue\n"
details: 'Reads eMapScriptState.SecondaryContinuousMapScriptPtr (offset loaded as

  `oMapScriptState_SecondaryContinuousMapScriptPtr` against dword_2011E70 /

  base 0x2011E60). If the pointer is null, returns immediately. Otherwise

  the pointer becomes the script cursor in r7 and the MapScriptCommandJumptable

  base sits in r12 (loaded via r6 from off_803608C). Each iteration reads a

  command byte from [r7], multiplies by 4, indexes the jumptable, and `bx`s

  the resulting handler with lr=pc (tail-style dispatch, not a normal call,

  so loop continuation depends on the handler''s bx target returning to

  0x8036078). The handler is expected to advance the cursor and set Z to

  signal "stop" or clear Z to "continue"; no explicit flag is set on the

  null-pointer path because the `tst r0,r0` already produces Z=1 there.

  r4-r7 and r12 are saved/restored manually (push/pop pair with r12 shuttled

  through r4), matching the readable C contract; preserved callee-saved regs

  are not pushed to the stack by callee-side handlers but by this frame.

  off_803608C → MapScriptCommandJumptable, off_8036090 → eMapScriptState.

  '
