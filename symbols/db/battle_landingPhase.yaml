name: battle_landingPhase
address: '0x080B954C'
kind: function
status: probable
summary: 'Battle-object landing/spawn phase: initializes anim+phase, plays sound 0x94 and a spawn helper,
  waits 6 frames, then chooses action 4 if the panel under the object has hole flags 0x10010, otherwise
  action 0x18.'
interface: (r0 unused on entry; r5 = battle object header) -> r0 clobbered; updates oBattleObject_CurPhase/CurAnim/CurAction/Timer
  and oObjectHeader_Flags
details: 'A per-object phase dispatcher (r5 = battle object). In phase 0 it initializes: sets CurPhase
  4, CurAnim 3, plays sound effect 0x94, calls sub_8010DF6(2,6,1) (likely an effect/spawn helper), sets
  flag bit 1 in oObjectHeader_Flags, and loads a 6-frame timer into oBattleObject_TimerAndTimer2. On later
  calls it decrements oBattleObject_Timer and returns until it hits 0. It then reads the panel status
  flags at the object''s PanelX/PanelY via object_getPanelParameters and tests for mask 0x10010; if the
  panel has those flags (hole/void-like state) it sets CurAction 4, otherwise CurAction 0x18, clearing
  CurPhase/PhaseInitialized either way so the new action starts from its phase 0.'
