name: ai_spawnFrontPanelAttackRegion
address: '0x081079DC'
kind: function
status: probable
summary: 'AI attack helper: spawns a damage collision region on the panel directly in front of the acting
  battle object.'
interface: (r5 = battle object, r7 = oAIAttackVars {InitFlag, Damage}) -> r0 = spawn result from object_spawnCollisionRegion;
  destroys r4,r6,r7
details: Reads the object's facing multiplier via object_getFrontDirection and adds it to oBattleObject_PanelX
  to get the panel one tile ahead, using the object's PanelY unchanged. It then calls object_spawnCollisionRegion
  with r0=x, r1=y, r2=oAIAttackVars_InitFlag, r3=0, passing 0x7050104 (constant dword_81079F8), oAIAttackVars_Damage,
  and 3 (dword_81079FC) in r4/r6/r7 — extra parameters the spawner evidently consumes from those registers.
  The oAIAttackVars struct fields (InitFlag, Damage) indicate this is part of an AI-driven attack setup,
  placing a hitbox on the front panel.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection; add r0,r0,PanelX: target panel is one tile in facing direction;
    r2=[r7,#oAIAttackVars_InitFlag], r6=[r7,#oAIAttackVars_Damage]: attack parameters come from an AI
    attack vars struct; ldr r4,=0x7050104 and r7,=3 loaded immediately before bl object_spawnCollisionRegion:
    extra register args to the spawner; sole caller sub_8106FE6 fits an AI attack script context (oAIAttackVars
    user)'
