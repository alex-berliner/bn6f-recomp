name: battle_checkPanelTypeMatch
address: '0x0802EFD8'
kind: function
status: probable
summary: Returns 1 if the panel at the given (x,y) has the same type byte as the calling object's field
  0x16, else 0.
interface: (r0 = panel X, r1 = panel Y; r5 = object) -> r0 = 1 if panel type equals [r5+0x16], else 0
details: The function resolves the panel entry for coordinates passed in r0/r1 via object_getPanelDataOffset,
  then loads the byte at offset +3 of that panel entry, which in the battle panel data is the panel type/attribute
  byte. It compares that byte against field 0x16 of the object in r5 (the caller's own object, since r5
  is not set inside this routine) and returns 1 on equality, 0 otherwise. It is a simple boolean predicate;
  no state is modified. The exact meaning of panel field +3 and object field 0x16 (e.g. panel element/type)
  is inferred from typical BN6 panel structs and not confirmed by named data here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_getPanelDataOffset with r0/r1 forwarded shows the arguments are panel coordinates
    (asm line 2); ldrb r1,[r0,#3] reads the type byte of the resolved panel entry (asm line 3); cmp r0,r1
    / beq against ldrb r0,[r5,#0x16] compares it to the caller object's field 0x16 (asm lines 4-6); returns
    0/1 with no writes, so it is a pure predicate (asm lines 7-10)
