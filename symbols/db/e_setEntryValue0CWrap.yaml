name: e_setEntryValue0CWrap
address: '0x081302F4'
kind: function
status: probable
summary: 'Thin wrapper around e_setEntryValue0C: masks the value to 17 bits, writes it to entry field
  0xC, and returns the masked value.'
interface: (r0 = value, r1 = entry index/handle) -> r0 = r0 & 0x1FFFF; flags clobbered by call
details: 'r0 is masked to its low 17 bits via lsl/lsr #0x11 and saved in r4; then e_setEntryValue0C is
  called with the masked value and r1 untouched, which stores the 16-bit value into field 0xC of an in-use
  entry of the 0x58-byte struct array at 2008450 and clears that entry''s byte 0x9. The masked value is
  returned in r0. The 17-bit mask is odd since the callee only writes 16 bits, so bit 16 is effectively
  discarded; it may exist to normalize a sign/flag bit used by the callers. Nothing else is touched and
  no branches are taken.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'lsl r0,#0x11 / lsr r0,#0x11 masks the argument to 17 bits before anything else; bl e_setEntryValue0C
    receives (masked r0, r1) unchanged; mov r4,r0 / mov r0,r4 returns the masked input, matching ''value
    written'' semantics; callees known summary: e_setEntryValue0C writes field 0xC of a 2008450 entry
    and clears byte 0x9'
