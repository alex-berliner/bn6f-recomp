name: object_createCollisionData
address: '0x08019892'
kind: function
status: confirmed
summary: Allocates one of 32 collision-data slots for a battle object, zeroing it and linking it to the object.
interface: (u32 *bitfield not taken directly; r10 toolkit, r5 battle object) -> CollisionData *slot (r0; 0 if none
  free)
details: 'Reads the collision data pool pointer from toolkit+oToolkit_CollisionDataPtr and scans

  eActiveCollisionDataBitfield from bit 31 down to bit 0 for the first clear bit; each bit

  corresponds to one 0xA8-byte slot in the pool. If all 32 bits are set, returns 0 without

  claiming anything. Otherwise sets the bit in the bitfield, zeroes the first 0x44 bytes of

  the slot with ZeroFillByWord, zeroes bytes 0x48..0xA7 (0x60 bytes) with ZeroFillByWord,

  sets slot[0] = 1 (active flag byte), stores the slot address into battleObject +

  oBattleObject_CollisionDataPtr, and returns the slot address. The first 0x44 bytes are the

  fixed/header part of the collision record; bytes 0x48..0xA7 look like a per-hit array

  (0x60 bytes = e.g. 12 entries of 8 bytes). Note r4 is pushed/popped only to preserve it;

  it is used as a scratch copy of the slot address. lr is in the register contract''s inputs

  only because of the call.

  '
