name: rfu_softResetLinkState
address: '0x08144D64'
kind: function
status: probable
summary: Soft-resets the wireless adapter and clears the game's link state struct before tearing down
  the connection.
interface: () -> r0 = result of rfu_REQBN_softReset_and_checkID (0x8001 = ok); flags clobbered by callees
details: 'Takes no arguments; it calls rfu_REQBN_softReset_and_checkID and keeps its return in r4, treating
  0x8001 as success (on success sets byte 0x8 of eStruct200FE00 to 1). It then inspects the state byte
  at struct+0x4: if it is neither 0x17 nor 1 it clears bytes +0x5 and +0x4, apparently cancelling an in-progress
  operation. Unconditionally it zeroes bytes +0x7, +0xD, +0x1 and +0x0 and sets byte +0x6 to 0xFF (likely
  ''no slot/partner''), then calls rfu_reqEndConnection with no setup to queue request 0x45 and tear down
  the link. Finally it returns the softReset/checkID result to the caller.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl rfu_REQBN_softReset_and_checkID; cmp r4, 0x8001 — adapter reset, 0x8001 treated as success
    code; strb writes clear eStruct200FE00 bytes 0x0/0x1/0x5/0x7/0xD and set 0x6=0xFF and 0x8=1 — wiping
    per-link state; state byte +0x4 is compared to 0x17 and 1, values of an ongoing link operation, and
    reset otherwise; bl rfu_reqEndConnection — queues rfu request 0x45/arg 0 to end the wireless connection;
    sole caller sub_81453F0 invokes it from six sites, consistent with a reset/restart entry point in
    the wireless flow
