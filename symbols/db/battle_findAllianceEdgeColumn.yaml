open_questions:
- exact meaning of r2 (scanning side's alliance vs. a field-flip boolean) — the caller sub_800D4D0 is
  itself undocumented
- whether callers treat the returned column as the panel just in front of the alliance's area or the boundary
  itself
- panel index layout assumed (column-major 1-based) should be confirmed from object_getPanelDataOffset
