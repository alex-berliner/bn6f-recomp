name: battle_clearObjectStatusUnlessPhase1
address: '0x080145C2'
kind: function
status: probable
summary: Battle hook that clears an object's status/affliction flags and collision timers unless the battle
  is in phase 1 (likely the custom screen, where status timers should be frozen).
interface: (r0 = battle object or state passed through implicitly via r10; no explicit args used) -> r0
  = result of battle_clearObjectStatusFlagsAndTimers; no meaningful flags
details: Reads the toolkit's battle-state pointer from r10 and loads oBattleState_BattlePhase. If the
  phase equals 1, it returns immediately without doing anything; otherwise it tail-context-calls battle_clearObjectStatusFlagsAndTimers_801A264,
  which clears the object's status flags in both flag words and zeroes its blind/confusion-style collision
  timers. The phase==1 early-out suggests status clearing is suppressed while that phase (probably the
  custom screen) is active, so timers don't expire during it. Note the callee is called with r0 holding
  the phase byte read from battle state, so the callee's first argument is likely a battle-state pointer
  or index rather than a direct object pointer, and the project's summary of the callee may be imprecise.
  Only 9 instructions; no known callers, so its trigger context is unconfirmed.
