name: battle_clearObjectStatusUnlessPhase1
address: '0x080145C2'
kind: function
status: confirmed
summary: Runs the per-battle-object status/timer cleanup unless the battle is in phase 1, in which case it does
  nothing.
interface: void battle_clearObjectStatusUnlessPhase1(battleobj_t* obj /* r5 */, toolkit_t* toolkit /* r10 */); returns
  callee's r3 passthrough (u32), otherwise void
details: 'Loads the toolkit''s battle state pointer (r10 + oToolkit_BattleStatePtr), reads oBattleState_BattlePhase,
  and if the phase equals 1 it returns immediately without touching anything. Otherwise it tail-calls battle_clearObjectStatusFlagsAndTimers_801A264
  with the battle object in r5, which presumably clears the object''s status effect flags and associated status
  timers. Quirk: the phase check leaves r3 unmodified on the skip path, so callers see the incoming r3 when skipped
  and the callee''s r3 when it runs; r0-r2, lr and flags are clobbered and ignored by callers.'
