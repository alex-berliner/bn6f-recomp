name: getField0x18OfScenarioEffectState2000780_81421e0
address: '0x081421E0'
kind: function
status: confirmed
summary: Trivial getter that returns the u32 stored at offset 0x18 of the global scenario effect state struct.
interface: void -> u32 (r0 = value at EWRAM 0x2000798; r4-r7 preserved despite being pushed)
details: Loads the address of eScenarioEffectState2000780 (a global state block at 0x2000780, likely scenario/flag-driven
  effect state used by the game's event or story scripting) from a literal pool, then reads the 32-bit field at
  +0x18 (symbol byte_2000798) and returns it in r0. No arguments are taken and lr is never used, though it is pushed/popped
  as part of the r4-r7,lr frame; r4-r7 pass through unchanged. The name byte_2000798 suggests the field was assumed
  8-bit, but the code reads it as a full word (LDR), so the field is at least word-aligned data.
