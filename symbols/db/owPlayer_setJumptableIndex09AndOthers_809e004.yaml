name: owPlayer_setJumptableIndex09AndOthers_809e004
address: '0x0809E004'
kind: function
status: confirmed
summary: Writes a new value into the overworld player's jumptable index (offset 0x09), unless it currently equals
  0x10, in which case the value is parked in the pending slot (offset 0x0b) instead.
interface: void owPlayer_writeJumptableIndexOrPending(u8 value /*r0*/, OWPlayerObject *player /*r5*/); returns r1
  = previous jumptable index; Z/C/V set by CMP old index, 0x10; N likewise
details: Operates on the overworld player object (r5). First it clears the byte at oOWPlayerObject_Unk_0a (offset
  0x0a). It then reads oOWPlayerObject_JumptableIndex_09 (offset 0x09) and compares it with 0x10; the caller can
  inspect the resulting NZCV flags to learn whether the special case fired, and r1 hands back the old index. If
  the index is not 0x10, the new value r0 is written directly into the jumptable index (a normal state/animation
  transition). If the index IS 0x10, the value is instead stored into oOWPlayerObject_Unk_0b (offset 0x0b), a second
  byte adjacent to the cleared byte at 0x0a — most plausibly a 'pending/next' slot so a state change is deferred
  while the player is in state 0x10 rather than overwriting the active one. Byte-sized stores only; the .word eStruct200ace0
  after the return is a literal/alignment artifact, not code.
