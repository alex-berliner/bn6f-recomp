name: battle_checkAnyHitFlag
address: '0x081129EE'
kind: function
status: confirmed
summary: Tests a battle object's five collision hit-flag halfwords and sets the object's "was hit" marker if any
  is set.
interface: void battle_checkAnyHitFlag(BattleObject* self /*r5*/); out r1 = sum of the five hit-flag halfwords (pass-through
  if skipped), flags nzcv clobbered
details: Reads the object's CurAction byte (oBattleObject_CurAction); if it equals 0x0B (custom action), the check
  is skipped entirely and the incoming r1 passes through unchanged. Otherwise it loads the object's CollisionDataPtr
  and sums the halfword hit flags at collision+0x82, +0x84, +0x86, +0x88 and +0x8A. If the sum is nonzero, stores
  1 into the object's ExtraVars word (oBattleObject_ExtraVars), marking that the object was hit this step. The final
  summed value is left in r1 for callers. r5 is not preserved (it is an input register held over from the caller,
  not saved by this routine).
