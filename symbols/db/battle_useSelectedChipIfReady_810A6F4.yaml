name: battle_useSelectedChipIfReady_810A6F4
address: '0x0810A6F4'
kind: function
previous_names:
- sub_810A6F4
status: probable
summary: Triggers the AI/NPC actor's selected battle-chip attack when ready (turn counter gate), and returns
  whether it fired.
interface: '(r0 = unused, r1 = unused, r2 = unused, r3 = unused; relies on r5 = battle object pointer,
  r10 = BattleState toolkit ptr) -> r0 = 1 if the chip attack was set up, 0 otherwise ; side effects:
  BattleState.Unk_40 (turn counter?) compared against 0x12c, and on success calls write-chip-params /
  set-attack-0 / sub_800F322'
details: "Sets r6 = 0 (success flag) up front. Calls battle_getSelectedChipForUse_800ED90(r0 = r5) to\
  \ retrieve\n  the actor's selected chip; the low 7 bits of r0 (mask `0x7F` done via `lsl r4, r0, #0x17;\
  \ lsr r4, r4, #0x17`)\n  are kept in r4. If r3 (the \"has chip selected\" return) is zero, falls through\
  \ to return r6 = 0.\n  Reads battle_getStateUnk40_800A704 (oBattleState.Unk_40) and compares against\
  \ the constant 0x12c\n  (loaded from `off_810A830`). The branch `blt loc_810A720` skips setup unless\
  \ Unk_40 >= 0x12c, i.e.\n  a turn/wave counter gate. On success: moves the chip id (r4) into r0 and\
  \ calls\n  somethingWriteChipParams_80126E4 (writes chip params onto the chosen actor), then\n  object_setAttack0\
  \ (clears attack flag/sets up attack), then sub_800F322 (likely consumes the chip\n  from the hand),\
  \ and sets r6 = 1 to signal a chip was used. The caller (sub_810A5EA) presumably\n  branches on the\
  \ returned flag. Registers r4, r6, r7, r10 are preserved across the call\n  (push/pop). Return value\
  \ in r0 is the boolean 0/1.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r6, #0` followed by `mov r6, #1` only on the success path; final `mov r0, r6` shows
    r0 is the boolean return (`beq loc_810A720` short-circuits on r3 == 0). - `lsl r4, r0, #0x17; lsr
    r4, r4, #0x17` isolates the low 7 bits of the chip id returned from `battle_getSelectedChipForUse_800ED90`
    (the high bits there are flags). - `bl battle_getStateUnk40_800A704` returns `BattleState.Unk_40`
    and `cmp r0, #0x12c; blt` requires it to be at least 0x12c (300) before the chip use runs; this is
    a per-turn/wave readiness gate. - The success path does `bl somethingWriteChipParams_80126E4` (writes
    chip params), `bl object_setAttack0` (sets the actor''s attack state), `bl sub_800F322` (likely consumes
    chip from the hand), in that exact order before flipping r6 to 1 - a "execute selected chip attack"
    sequence. - Caller `sub_810A5EA` has contract out `r1` only (besides restored r5) - so it definitely
    consumes the boolean return value of this helper. - Captured-call snapshots show r0 == 0 on exit,
    consistent with the common "no chip selected / counter not yet >= 0x12c" branch (the three live snapshots
    all hit that branch).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0810A6F4

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: battlesweep, beastsp'
  reproduce: 'grep -l ''^0810a6f4 '' tools/traces/coverage/*.prof

    '
  result: battlesweep, beastsp
open_questions:
- What BattleState.Unk_40 actually counts (likely a turn or chip-cooldown counter, since 0x12c = 300 is
  a meaningful round threshold), and what precisely `somethingWriteChipParams_80126E4`/`sub_800F322` do.
- Whether the `_ifReady` portion of the name is the right framing; it could equally be `_afterCounterReached`
  or `_executeSelectedChipAttack`. A cross-check on BattleState.Unk_40's semantics would settle it.
