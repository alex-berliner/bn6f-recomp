  reproduce: python3 tools/asmcat.py 0x0814D994
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the described behavior: r4=r2-1 (loop count), r2=-1 (sentinel), early-return 0
    when length==0, byte-by-byte compare with ldrb, returns B-1 on first mismatch or 0 on full match.
    However, the name ''string_compareToFirstMismatch'' implies string/null-terminated semantics, but
    the function compares exactly `length` bytes (capped via r4), not until a terminator. The prefix ''copy''
    or ''get'' would fit the byte-buffer nature better than ''string''.; run wf investigate investigate-20261019-055111;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
