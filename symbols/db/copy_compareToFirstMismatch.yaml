name: copy_compareToFirstMismatch
address: '0x0814D994'
kind: function
status: probable
summary: Compares two byte buffers for up to n bytes and returns the address in buffer B of the first
  mismatching byte, or 0 if all n bytes are equal.
interface: (r0 = buffer A ptr, r1 = buffer B ptr, r2 = length in bytes) -> r0 = 0 if all length bytes
  equal, else pointer into buffer B at first differing byte; flags clobbered
details: Sets r4 = length-1 (with length 0 immediately returning 0) and r2 = -1 as a loop-end sentinel,
  then walks both buffers byte by byte. On the first unequal byte pair it returns (current B pointer -
  1), i.e. the address of the mismatching byte in buffer B; if the loop runs out it returns 0, meaning
  the buffers match over the given length. It reads bytes with ldrb, so inputs are treated as unsigned
  bytes, and it never writes to memory. Because the mismatch address is returned rather than an offset
  or a comparison result, callers can use it both as an equality test (r0 == 0) and to locate where two
  strings/blobs diverge.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_814D994: ldrb r1,[r3] / ldrb r0,[r5] / cmp r1,r0 / beq — byte-by-byte comparison of the
    two pointers; sub_814D994: sub r4,r2,#1 and cmp r4,r2 / bne loop — iterates exactly r2 bytes before
    returning 0; sub_814D994: sub r0,r3,#1 / b return — returns address of first differing byte in buffer
    B; sub_814D994: cmp r2,#0 / beq loc_814D9BA — zero length is treated as an immediate match (returns
    0); no callers or callees known; behavior read entirely from the 24-instruction body'
  refs:
