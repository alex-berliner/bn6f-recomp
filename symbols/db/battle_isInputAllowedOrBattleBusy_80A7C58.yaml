open_questions:
- 'Whether the caller''s captured r0 (sometimes 0x80a7b33, sometimes 0) is meaningful: looks like the
  callers are calling with the saved LR or a function-pointer tail, not actually passing that value as
  an argument; the function ignores r0-r3 and only uses r10 (toolkit) for the chatbox call. The exact
  semantic of "0x80" bit in eFlags2009F38 (some battle-input-blocked flag) is not nailed down.'
