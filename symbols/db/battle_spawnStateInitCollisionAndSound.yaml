name: battle_spawnStateInitCollisionAndSound
address: '0x080CC064'
kind: function
status: probable
summary: 'Initial ''spawn'' state handler of a battle object: places it on its panel, spawns its collision
  region, plays sound 0xFC, and switches to the UPDATE state.'
interface: (r5 = battle object, no r0-r3 args) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE
details: This is an object state handler reached (presumably) via a state table, so no direct caller is
  seen. It first calls object_setCoordinatesFromPanels to derive the object's pixel X/Y from oBattleObject_PanelX/PanelY,
  zeroes oBattleObject_Z, then calls object_spawnCollisionRegion with the panel coordinates in r0/r1,
  zero offsets in r2/r3, packed collision params 0x3205ff01 in r4 (and 0x0/0x4200 in r6/r7) — likely defining
  a multi-panel hitbox. It plays sound effect 0xFC, then stores CUR_STATE_UPDATE into the state/phase
  field so the object's next ticks run the update handler at sub_80CC090. The exact object identity and
  the meaning of the 0x3205ff01/0x4200 collision-region fields are not visible from this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_setCoordinatesFromPanels + str of 0 to oBattleObject_Z repositions object from panel
    coords; ldrb PanelX/PanelY into r0/r1 followed by bl object_spawnCollisionRegion with dword_80CC0C8=0x3205ff01
    params; mov r0,#0xfc; bl PlaySoundEffect plays fixed SFX 0xFC on entry; mov r0,#CUR_STATE_UPDATE;
    str to oBattleObject_CurStateActionPhaseAndPhaseInitialized transitions to update state; bl sub_80CC090
    immediately after the state store: classic init-then-run-first-update pattern of state handlers'
