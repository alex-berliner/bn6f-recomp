name: t3_0x1c_80C7C18
address: '0x080C7C18'
kind: function
status: confirmed
summary: Per-frame step routine for a battle object (apparently the panel-shaker) that dispatches through a CurState-indexed
  jump table (init / update collisions / destroy) and then refreshes its sprite.
interface: void t3_0x1c_80C7C18(void); // r5 = battle object; callers also carry r4, r7, r8, r10 and lr; resulting
  r5, r8-r12 are left in the guest register file for the caller
details: "Standard \"task type 3\" battle-object step function. Reads the object's\nCurState byte (oBattleObject_CurState\
  \ off r5) and uses it as a *byte*\noffset into the word table at off_80C7C30 (so only states 0/4/8 are valid\n\
  word slots, or the table is only 3 entries and larger states read garbage).\nThe three handlers are:\n  state\
  \ 0: battleObject_panelShaker_init_80C7C3C (state/init handler)\n  state 1: battle_updateObjectCollisions (per-frame\
  \ update)\n  state 2: object_genericDestroy (self-destruct path)\nThe handler is invoked with mov lr, pc; bx r1,\
  \ so the handler returns to\nthe instruction right after bx and r5 may be replaced by the handler (the\ndestroy\
  \ path swaps in another object). Afterwards it unconditionally calls\nobject_updateSpritePaused with the (possibly\
  \ new) r5, which updates the\nobject's sprite but skips animation advance while the battle is paused.\nThis r5-after-handler\
  \ behaviour is why the sprite call must see the\nhandler's r5 rather than the original object pointer.\nTrampolines\
  \ via lr with push {lr} / pop {pc}; no other registers are\nsaved, matching the game's register-based calling\
  \ convention for these\nobject step callbacks.\n"
