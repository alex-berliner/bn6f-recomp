name: addToByteAtR6_80A7BA2
address: '0x080A7BA2'
kind: function
status: confirmed
summary: Tiny helper that adds r0 to the byte pointed to by r6 and writes the low byte back.
interface: void addToByteAtR6(u32 addend /* r0 */, u8* ptr /* r6 */); /* r1 = full 32-bit sum, flags set
  by ADDS r1,r1,r0 */
details: 'Loads the byte at the address held in r6, adds the 32-bit addend from r0, stores the low 8 bits
  back to [r6], and leaves the full 32-bit sum in r1 before returning. Flag semantics come from the single
  ADDS: C and V reflect the 32-bit addition (not the 8-bit truncation), so callers could in principle
  branch on carry/overflow of the wide add. Touches no other state; it is a pure read-modify-write on
  caller-supplied memory, so its meaning depends entirely on which byte r6 points at in each caller.'
