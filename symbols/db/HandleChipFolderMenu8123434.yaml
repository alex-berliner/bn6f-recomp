name: HandleChipFolderMenu8123434
address: '0x08123434'
kind: function
status: confirmed
summary: Dispatches the chip-folder menu's five-state machine by indexing a handler table with the state byte stored
  in the menu work area.
interface: void HandleChipFolderMenu8123434(void *menu /* r5 */, uint32_t r2, void *r4, void *r6, void *r7, void
  *r10)
details: "Top-level dispatcher for the chip-folder menu screen. The menu work area pointer arrives\nin r5; the state\
  \ byte at offset 1 (oFolderMenu_State:1) of that work area is a byte\noffset into the five-entry handler table\
  \ at off_8123448, taking values 0, 4, 8, 12, 16\n(one entry per state, stride 4). The selected handler is invoked\
  \ via the original\n\"mov lr,pc; bx r0\" sequence with r0 = the table entry's address (so the handler runs in\n\
  Thumb mode) and r1 = the raw state byte; the call pops pc from the stack on return, so\nthis function never returns\
  \ up its normal path -- control flows straight into the handler\nand back to the dispatcher the next frame.\n\n\
  Handler table at off_8123448 (states 0..4):\n  0 -> chipFolder_screenInit_812345C  (screen init)\n  1 -> sub_8123514\n\
  \  2 -> pet_menu_runFrame_81237BC     (PET/per-frame run)\n  3 -> chipFolder_init_812349C\n  4 -> sub_81234DC\n\
  \nThe two named handlers (states 0 and 3) correspond to screen init and the chip folder's\nown init, which is\
  \ consistent with this being the chip-folder menu dispatcher. The\nother three handlers remain sub_ symbols.\n"
