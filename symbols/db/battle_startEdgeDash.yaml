name: battle_startEdgeDash
address: '0x080D11B4'
kind: function
status: probable
summary: Sets the object's XVelocity toward the far edge panel using a Param1-indexed speed table and
  facing step, then computes and stores a halfword Timer = (panel distance * 0x280000) / speed via SWI
  6.
interface: (r5 = battle object pointer; r0 clobbered) -> r0 = computed frame count; writes oBattleObject_XVelocity
  and oBattleObject_Timer
details: 'Reads the object''s Param1 as a speed index into a word table at byte_80D11EC (0x30000, 0x380000,
  0x40000, 0x40000 — 16.16 fixed-point velocities), multiplies it by object_getEnemyDirection''s ±1 alliance-based
  facing step, and stores the product in XVelocity. It then computes the remaining horizontal distance
  to the target edge panel: 7-PanelX for alliance 0, 0-PanelX otherwise, taking the absolute value. That
  distance is scaled by 0x28<<16 (panel width in fixed point) and divided by the speed via SWI 6 (GBA
  Div, quotient in r0), giving the number of frames the dash will take, which is stored in the object''s
  Timer. So the routine launches the object into a straight rush across the battlefield and arms a timer
  that presumably ends the move when it reaches the far edge.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mul r0,r1 then str r0,[r5,#oBattleObject_XVelocity] combines the ±1 direction from object_getEnemyDirection
    with table speed byte_80D11EC[Param1]; target panel is 7 for alliance 0 and 0 otherwise (mov r0,#7
    / tst Alliance / sub PanelX), i.e. the far edge of the 8-panel-wide field; svc 6 is GBA Div: distance*(0x28<<16)
    divided by the still-live r1 speed yields a frame count, stored to oBattleObject_Timer; table words
    0x30000/0x380000/0x40000 are plausible fixed-point velocities, matching battle velocity conventions'
