open_questions:
- What sub_80033E4(0x2b) does and whether its result matters (flags used come from mov r0,r5, not obviously
  from the call)
- Where the target pointer (restored r5) and source values r2/r6/r7 are set up — need the real prologue/full
  function this tail belongs to, or the caller's register state at the bl
- Whether 'push {r0-r2,r5}' is a faithful decode or a misdisassembled register list
