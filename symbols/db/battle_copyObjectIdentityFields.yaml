name: battle_copyObjectIdentityFields
address: '0x080E360E'
kind: function
status: probable
summary: Copies an attacker/owner's identity fields (element, related object, alliance, damage-counter
  disabler, chip ID) into a battle object, skipping if the target pointer is null.
interface: (r0 = selector 0x2b for sub_80033E4; source values in r2/r5/r6/r7 set by caller) -> writes
  oBattleObject_Element, oBattleObject_RelatedObject1Ptr, oBattleObject_Alliance, oBattleObject_DamageAndStaminaDamageCounterDisabler,
  oBattleObject_ChipID into the object at the restored r5; no return value
details: 'The routine saves r0-r2/r5, calls sub_80033E4 with r0=0x2b, then restores the saved registers
  and tests r5 via the flags set by ''mov r0,r5'' (adds r0,r5,#0 encoding): if the restored r5 pointer
  is null it returns without writing. Otherwise it stores r3 (=original r2) into Element, r5 into RelatedObject1Ptr,
  the byte at [r5,#oBattleObject_Alliance] into the target''s Alliance, and the caller''s r6/r7 into DamageAndStaminaDamageCounterDisabler
  and ChipID. The target object pointer and all source values come from registers set up before entry,
  so this reads like a shared tail/worker invoked after a new object (e.g. a destruction effect) has been
  allocated. The only known caller, battle_destroyObjectWithEffect, fits: the effect object inherits the
  destroyed object''s element/alliance/chip identity so hit/damage attribution stays correct. The purpose
  of the r0=0x2b call to sub_80033E4 before the flag test is not visible from this site.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'strb r3,[r0,#oBattleObject_Element] / str r5,[r0,#oBattleObject_RelatedObject1Ptr] / ldrb+strb
    Alliance / str r6, r7 into DamageAndStamina... and ChipID: field-copy block into a battle object;
    pop {r1-r3,r5}; mov r0,r5 (adds encoding sets flags); beq locret: null-check on restored r5 pointer
    gates all stores; push {r0-r2,r5} before bl sub_80033E4 with r0=0x2b, pop afterwards: r0-r2 preserved
    across the call, so r3/r5/r6/r7 used for stores come from entry state; sole known caller 0x080CE05E
    battle_destroyObjectWithEffect: consistent with stamping owner identity onto a destruction-effect
    object'
  refs:
