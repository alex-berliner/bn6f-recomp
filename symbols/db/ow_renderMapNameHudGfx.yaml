name: ow_renderMapNameHudGfx
address: '0x0811EFB8'
kind: function
status: probable
summary: Refreshes the overworld HUD tile graphics for the current area name, also caching the current
  PET navi's id and two HP-related stats.
interface: () -> r0 undefined; writes toolkit Unk200a220 struct fields +8/+0xC, builds gfx in unk_200BEA0,
  repacks into VRAM 0x06015000
details: Loads the toolkit pointer from [r10,#oToolkit_Unk200a220_Ptr]. If sub_8123360 says the selected
  navi is absent for HUD purposes it zeroes the +8 and +0xC fields; otherwise it stores GetCurPETNavi()'s
  id at +8 and reads u16 stats 0x40 and 0x42 for that navi (likely current/max HP) into +8 and +0xC. It
  then runs renderTextGfx_8045F8C with the TextScriptMapNames graphics as base, glyph index 0xF0, destination
  buffer unk_200BEA0, and 9 tiles, then repacks those tiles via sprite_repackAndQueueTiles_811F5DC from
  unk_200BEA0 into VRAM 0x6015000 with byte_200CC20 as layout/params. This matches an overworld HUD element
  (area-name banner) whose tiles get DMA'd each refresh, with the navi id/HP fields read by whatever HUD
  draws from that toolkit struct. Runs on nearly every recorded route (story, maps, menus, battles), consistent
  with a recurring HUD update.
