name: ow_renderMapNameHudGfx
address: '0x0811EFB8'
kind: function
status: confirmed
summary: Overworld map-name HUD update — refreshes the cached PET navi stats, renders the current area's name as
  9 glyphs, and queues the tiles to VRAM.
interface: void ow_renderMapNameHudGfx(u32 r10 /* toolkit ptr */, u32 lr /* return addr */)
details: 'Called with r10 = toolkit pointer; reads the toolkit''s Unk200a220 record

  (oToolkit_Unk200a220_Ptr). First calls sub_8123360(): if it returns false

  (r0 == 0), it zeroes the record''s fields at +8 and +0xC (no PET/navi data

  available); if true, it gets the current PET navi id via GetCurPETNavi and

  caches that navi''s stat halfwords 0x40 into +8 and 0x42 into +0xC

  (presumably the map-name/stat display values shown next to the area name).

  Then it renders text via renderTextGfx_8045F8C with the map-names text

  script table (A_TextScriptMapNames), render flag 0xF0, target scratch tile

  buffer unk_200BEA0, glyph count 9, arg 1, and glyph/layout table

  dword_86A5D60 — i.e. draws the current area''s name (map names are indexed

  elsewhere, likely by the cached stats or a separate map index). Finally

  sprite_repackAndQueueTiles_811F5DC repacks unk_200BEA0 through byte_200CC20

  and queues 9 tiles of the rendered text to VRAM at 0x06015000, the map-name

  HUD character block.

  Register quirks: r4-r7 are pushed/popped unchanged; r8-r12 on exit are

  whatever renderTextGfx_8045F8C leaves (repack call preserves them), so

  callers see pass-through garbage from the text renderer. r0-r3, flags and

  lr are clobbered.

  '
