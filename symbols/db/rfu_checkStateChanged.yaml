name: rfu_checkStateChanged
address: '0x08146938'
kind: function
status: probable
summary: returns 1 when the current value in byte_2010280 no longer matches the state byte at offset +2
  of the struct at dword_2010CC0, letting callers abort a wireless flow
interface: () -> r0 = 1 if byte_2010280 != [dword_2010CC0]+2 (state changed/mismatch), 0 if equal; clobbers
  r0-r2
details: Loads the struct pointer from dword_2010CC0, reads the byte at [ptr+2], and compares it against
  the single byte stored at byte_2010280. It returns 1 on mismatch and 0 on equality; no writes occur.
  The caller (sub_803C90C) only performs this check when byte_2010280 is nonzero, and on a mismatch (nonzero
  return) immediately returns r0=2/r1=0 — a bail-out/error state — instead of continuing to rfu_testStatusFlags(4)
  to verify the link is up. This suggests byte_2010280 is a cached/stored wireless state value (e.g. a
  room, slot, or connection id) that the caller expects to still match the live state struct; the check
  is skipped when the byte is 0 (not in that state).
