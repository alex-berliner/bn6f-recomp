name: loadDecompressedAsset_812AF78
address: '0x0812AF78'
kind: function
status: confirmed
summary: Thunk that decompresses one piece of asset data referenced by off_812B0E8 and copies it to the destination
  encoded in that reference.
interface: void sub_812AF78(void) // no meaningful inputs; only r0 (the reference pointer) is set internally
details: 'A one-line wrapper: it loads the address stored at off_812B0E8 into r0 and tail-tails into

  decompAndCopyData. That routine interprets the pointed-to structure as a compressed asset

  reference (it reads both the source data and the destination pointer from the data itself),

  decompresses it, and copies the result into place. No caller-supplied arguments are used:

  the register contract shows r2-r7 listed as inputs, but they are never read, merely

  preserved across the call as required by the ABI. The function is presumably one of a

  family of per-asset loader thunks invoked indirectly (e.g. from an init table), each

  pointing at its own reference like off_812B0E8.

  '
