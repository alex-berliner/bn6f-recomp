name: ai_judgeManChargeAttack
address: '0x080FFF24'
kind: function
status: probable
summary: 'JudgeMan AI attack state: picks a random target panel once, then charges while highlighting
  that panel each 8 frames until the step timer expires and sets the hit element.'
interface: (no args; r5/r7 = battle object base and oAIAttackVars) -> void; flags clobbered
details: 'On first entry (AttackElement==0) it sets AttackElement=4 and calls the JudgeMan picker (sub_8100144)
  which returns a target panel X in r0 and Y in r1 via RNG over candidates; if no candidate is found it
  exits via object_exitAttackState. Otherwise it stores the target panel coords, sets CurAnim=5, requests
  counter time 0x12 via object_setCounterTime, initializes StepTimer from AttackBoost2 and ChargeCycles=0,
  and if the pointer in ScratchVar is non-null calls sub_80D29B2 (likely a one-shot sound/effect). While
  charging it decrements StepTimer; on reaching zero it writes HitElement=4 to trigger the hit, otherwise
  it increments ChargeCycles and every 8th frame (lsr #3 carry) calls object_highlightPanel on the target
  X/Y.'
