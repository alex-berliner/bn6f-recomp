name: chatbox_80425F0
address: '0x080425F0'
kind: function
status: confirmed
summary: Chatbox option-launcher that, on first tick, sets chatbox flag 0x3E bit "FLAGS_3E_UNK_0001" and opens the
  mail subsystem using the mail index stored at [r4+2], then marks the text-script state byte so it only fires once.
interface: 'void chatbox_launchMailOption_80425F0(void); /* r4: chatbox object (mail index at +2); r5: text-script
  state (guard byte at +4); r10/lr: callers'' frame/link; returns r0 = 0 (nz set), r2/r3 trashed, r4/r5 preserved
  */'
details: 'Sets a chatbox flag mask via chatbox_setflags_3e with FLAGS_3E_UNK_0001. Then, only if the guard

  byte at oChatbox_TextScriptState_04 in r5 is zero (first activation), it reads the mail index

  from [r4+2] into r0 and calls subsystem_launchMail, finally writing 1 to that guard byte so the

  branch is never taken again on subsequent ticks. The function always returns with r0 = 0

  (nz from the mov). The trailing `.byte 0, 0` is alignment padding after the thumb return.

  Touches: chatbox flags (via chatbox_setflags_3e), chatbox object [r4+2] (mail index), and the

  text-script state byte at oChatbox_TextScriptState_04 in r5.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
