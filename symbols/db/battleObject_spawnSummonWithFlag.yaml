name: battleObject_spawnSummonWithFlag
address: '0x080C5F4A'
kind: function
status: probable
summary: Tail-calls sub_80C5F2C to spawn a battle object using caller-supplied parameters; if spawn succeeds,
  sets bit 0x10 in the new object's oObjectHeader_Flags before returning.
interface: (no args, uses caller's saved spawn parameters) -> r0 = spawned object header or null; flags
  preserved
details: The function tail-calls the spawn helper sub_80C5F2C, which creates a battle object of spawn
  type 3 subtype 9 on a panel, inheriting the source object's alliance and flip. If spawning succeeded
  (r0 != 0), it reads the new object's oObjectHeader_Flags byte, ORs in 0x10, and writes it back; if it
  failed, it just returns. Called from bassChipObject_80C3B54, so this is part of the Bass chip activation
  in battle. The 0x10 flag presumably marks the summon with a special behavior (e.g. non-blocking or untargetable)
  but its exact meaning isn't confirmed from this snippet.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sub_80C5F2C spawns a type 3 subtype 9 battle object inheriting alliance/flip; ldrb r1,[r0,#oObjectHeader_Flags]
    / orr 0x10 / strb sets the special flag only when spawn succeeded; beq locret skips the flag set when
    r0 == 0, i.e. graceful no-op on spawn failure; sole caller is bassChipObject_80C3B54, tying it to
    the Bass chip effect
  refs:
  - bn6f/asm/asm31.s:30468
  - 0x080C3B54 bassChipObject_80C3B54
  - 0x080C5F2C sub_80C5F2C
  reproduce: python3 tools/asmcat.py 0x080C5F4A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The callee sub_80C5F2C''s documented spawn type/subtype is wrong: it''s a battle-object spawn helper
    with caller-supplied parameters, not hardcoded to type 3 subtype 9. Also sub_80C5F4A takes no args
    only because parameters live in caller''s saved registers (r0-r3), so the interface wording is misleading.
    The summary''s main thrust (spawn then OR 0x10 into header flags) matches: ldrb/orr/strb at 0x080C5F54-0x080C5F5A
    confirm it. Drop the type/subtype claim.; run wf investigate investigate-20261018-235109; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
