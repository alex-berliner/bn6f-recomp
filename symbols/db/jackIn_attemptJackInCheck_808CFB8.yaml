open_questions:
- The exact mapping of sub_808D034 / sub_808D098 (not in this snippet); they likely format the overworld coords
  and the encounter availability bitmap, but their bodies are not given here.
- The semantic meaning of the u16 at struct+0x6 (jack-in attempts counter vs. visited-spots counter) and of the
  status values 1 vs. 2 — only "0 = nothing" is unambiguous from this code.
- Whether the [0x71, 0x90] range actually corresponds to "cold/empty spots" with a jack-in program installed, or
  to a region-specific filter.
