open_questions:
- What object/actor uses this handler — the caller sub_80AA204 is undocumented, so the game context (which
  attack or event fires on timer end) is unknown
- Meaning of sound IDs 0xDA and 0xC0 and of the state byte value 8 written to [r5,#0x08]
- The summary is accurate (timer countdown at [r5,#0x14], animation index 1, shake 1/10, sounds 0xDA/0xC0,
  state 8, then sprite_update). However the proposed name `object_playImpactOnTimerExpire` invents an
  'Impact' concept not in the asm; a neutral name like `object_handleImpactTimer` or `object_onImpactTimerExpire`
  fits better. Per the suggested naming rules, 'object_updateOnTimerExpire' would also be appropriate.
