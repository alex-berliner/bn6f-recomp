name: object_updateOnTimerExpire
address: '0x080AA248'
kind: function
status: probable
summary: Decrements an actor's fixed-point timer field by 5.0 per frame; when it goes negative, clamps
  to 0, switches the sprite to animation 1, triggers a 1-magnitude/10-frame camera shake, plays sound
  effects 0xDA and 0xC0, writes 0x08 to the actor's state byte, and finally calls sprite_update.
interface: (r5 = actor/object struct, fields at +0x08, +0x14) -> r0 = destroyed/void; no meaningful return;
  r0-r3, r12 clobbered
details: Subtracts 0x50000 (5.0 in 16.16 fixed point) from the signed word at [r5,#0x14], treating it
  as a countdown timer; if the result is still >= 0 it just calls sprite_update and returns. When the
  timer expires it clamps the field to 0, sets the actor's sprite animation to index 1 and loads its animation
  data, requests a camera shake of magnitude 8 lasting 10 frames, plays sound effects 0xDA and 0xC0, and
  stores 8 into the byte at [r5,#0x08] (likely a state/substate code). r4-r7 are pushed but never used,
  suggesting this is a shared update-handler with a fixed register convention.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: ''sub r0, r0, r1'' with r1=5<<16 decrementing [r5,#0x14], bge loc_80AA27C skips the effect
    while the timer remains positive; asm: ''mov r0,#0; str r0,[r5,#0x14]'' clamps the expired timer,
    then sprite_setAnimation(1) + sprite_loadAnimationData() start a new animation; asm: camera_initShakeEffect_80302a8(8,
    0xa) plus PlaySoundEffect(0xDA) and PlaySoundEffect(0xC0) form an impact-style presentation burst;
    asm: ''strb r0,[r5,#8]'' with r0=8 writes an actor state byte before falling through to sprite_update;
    known callee summaries: sprite_setAnimation writes animation index to sprite slot byte 0 and sprite_update
    refreshes the actor''s sprite struct'
