name: battle_initSpriteFromSourceObject
address: '0x080C3024'
kind: function
status: probable
summary: 'Initializes a battle object''s sprite from its RelatedObject1Ptr source: resolves actor type
  to pick sprite id (navi path via NaviStats 0x2C/0x29 + chip_class_lookup, else enemy_getArmPosition),
  loads sprite + anim, copies the source''s 0x34 position triple and recomputes PanelX/Y, sets palette
  via battle_pickPaletteIndexForNavi, applies flip, stores unpacked actor info into ExtraVars, then sets
  CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE.'
interface: (r5 = battle object whose RelatedObject1Ptr is the source object; r0/r1 clobbered) -> r0 =
  0; object's CurStateActionPhase set to CUR_STATE_UPDATE
details: Reads the source object's NameID and unpacks (ver, actorType, aiIdx) via unpackVerActorTyAndAIIdx_800F29C.
  For actorType 2 the sprite id comes from NaviStats bytes 0x2C/0x29 through chip_class_lookup_800FC9E
  (navi path), otherwise from enemy_getArmPosition_800F26C, which also resolves 0xCD..0xFF arm-slot ids;
  the id and a second word are passed to sprite_load and sprite_loadAnimationData. CurAnim is cleared,
  CurAnimCopy set to 0xFF, and bit 1 of oObjectHeader_Flags is set. The 12 bytes at offset 0x34 of the
  source object (position triple) are copied into the new object and object_setPanelsFromCoordinates recomputes
  PanelX/PanelY from them. battle_pickPaletteIndexForNavi_801002C + sprite_setPalette recolor the sprite,
  object_getFlip + sprite_setFlip apply facing, and unpacked actor info is stored into ExtraVars+0xC/+0x10
  before sub_8010DF6 and sub_80E1352 finish setup.
