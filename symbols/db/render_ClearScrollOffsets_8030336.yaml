name: render_ClearScrollOffsets_8030336
address: '0x08030336'
kind: function
status: confirmed
summary: Clears the render info BG scroll offset fields (after briefly writing the masked camera scroll into them,
  which is then overwritten with zero).
interface: 'void render_ClearScrollOffsets(void); /* in: r10 = toolkit; out: r1 = 0, r2 = camera Y & 0xFF, r3 =
  renderInfo, r4 = 0xFF, r5 = camera, r7 = toolkit, NZ set from r1 */'
details: 'Loads the toolkit''s camera pointer (oToolkit_CameraPtr) and render info pointer (oToolkit_RenderInfoPtr).
  Reads the camera''s position halfwords at oCamera_Unk_04 (X) and oCamera_Unk_06 (Y), masks each down to 8 bits
  with 0xFF, and stores the results into the render info scroll offset fields oRenderInfo_Unk_10/12/14/16/18/1a
  (X value into 10/14/18, Y value into 12/16/1a). It then immediately stores 0 into oRenderInfo_Unk_10, _12, _18
  and _1a, so the camera-derived writes to those four fields are dead code; the net effect is simply that the scroll
  offsets are cleared. The stores to _14 and _16 are NOT zeroed and keep the masked camera X/Y. This suggests _10/_12
  are the live scroll values used for drawing while _14/16/18/1a may be per-layer or previous-frame copies that
  are seeded from the camera here. Quirk: the dead masked-camera stores make the 0xFF masking pointless for the
  zeroed fields, and the function leaves several registers with intermediate values (r1 = 0 drives the NZ flag for
  callers).

  '
