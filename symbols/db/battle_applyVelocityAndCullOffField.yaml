name: battle_applyVelocityAndCullOffField
address: '0x080CA8E2'
kind: function
status: probable
summary: Moves a battle object by its X/Z velocity, then destroys it if its resulting panel is off the
  valid battlefield.
interface: (r5 = battle object) -> void; destroys the object (sets state CUR_STATE_DESTROY) when off-field
details: Adds oBattleObject_XVelocity to oBattleObject_X and oBattleObject_ZVelocity to oBattleObject_Z,
  then recomputes the object's PanelX/PanelY via object_setPanelsFromCoordinates and syncs its collision
  record/facing via object_updateCollisionPanels. If object_isCurrentPanelValid reports the new panel
  invalid, it clears the object's collision region (removing it from collision checks) and sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY so the object is destroyed. This is a per-frame movement step for objects that
  fly/leave the field (no Y velocity handled here, so likely aerial or fixed-height movers). The use of
  r5 as the object pointer suggests it is called with the object already in r5 by a shared object-update
  dispatcher.
