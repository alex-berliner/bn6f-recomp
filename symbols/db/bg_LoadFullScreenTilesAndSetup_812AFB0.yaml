name: bg_LoadFullScreenTilesAndSetup_812AFB0
address: '0x0812AFB0'
kind: function
status: confirmed
summary: Fills a full 30x20-tile background screen with tile IDs from the table at unk_201FDA0 (tile block 1) and
  then runs the follow-up setup in sub_812B4AC.
interface: void sub_812AFB0(void); // r1-r3 and the c/v flags returned by sub_812B4AC are passed through to the
  caller; r4-r7 preserved
details: 'Loads an entire 32x32-tile screen block''s visible 30x20 area from a precomputed tile ID table (unk_201FDA0
  in IWRAM/EWRAM) into tile block 1, using CopyBackgroundTiles with origin (j=0, i=0), dimensions j_size=0x1E (30),
  i_size=0x14 (20) — i.e. one full GBA screen of tiles, likely a static background/menu layout. After the copy it
  tail-calls sub_812B4AC, whose results (r1-r3 and the carry/overflow flags) are handed straight back to this function''s
  caller. Because CopyBackgroundTiles receives the dimensions in r4/r5 and may clobber them, r4-r7 are saved and
  restored so callers get their original values back; r0, r2 (tile block = 1), and the arguments are consumed locally.

  '
