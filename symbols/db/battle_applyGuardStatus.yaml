name: battle_applyGuardStatus
address: '0x08110E76'
kind: function
status: confirmed
summary: Puts a battle object into its Guard state — sets the guarding and cannot-slide flags and rolls a 0-3 guard
  value into its extra vars.
interface: void battle_applyGuardStatus(BattleObject* obj /* r5 */) -> returns roll (r0 = roll 0..3, r1 = 3); sets
  n/z from the roll, c/v left as GetPositiveSignedRNG left them
details: "Called with the battle object pointer in r5. It:\n1. object_setFlag1(OBJECT_FLAGS_GUARD) — marks the object\
  \ as guarding (e.g. Guard chip reaction).\n2. object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE) — blocks slide/dash movement\
  \ while guarding.\n3. Calls GetPositiveSignedRNG, masks the result with 3 (a 0..3 roll, r1 is left holding the\
  \ mask 3),\n   and stores it at obj + oBattleObject_ExtraVars + 8 (the third extra-var slot, apparently the\n\
  \   object's guard-related state/counter).\nReturns the stored roll in r0 for callers that care which guard variant\
  \ was rolled. Touches only\nthe object's flag word and that one extra-var field; the object pointer itself is\
  \ never reloaded,\nso both flag sets and the store go to the same r5 object.\n"
