name: battle_applyGuardStatus
address: '0x08110E76'
kind: function
status: probable
summary: Marks the current battle object as guarding and unable to slide, then stores a random 0-3 value
  in one of its extra vars (likely a timer/counter for the status).
interface: (r5 = battle object pointer, object-script context) -> void; r0 clobbered
details: Called in an object script where r5 holds the acting battle object. It ORs OBJECT_FLAGS_GUARD
  and then OBJECT_FLAGS_CANNOT_SLIDE into the object's CollisionData ObjectFlags1 via object_setFlag1,
  making the object block damage and immovable by sliding. It then advances the primary RNG and masks
  the result with 3, storing the 0-3 value into oBattleObject_ExtraVars+8, most plausibly a remaining-duration
  or phase counter for the guard state. No caller is known, so which chip/Navi script invokes it and what
  the stored value counts down are unconfirmed.
