name: sub_8117D4C
address: '0x08117D4C'
kind: function
status: confirmed
summary: Initializes and positions one of the four link-battle partner portrait sprites (graphics ID 0x23) by player
  slot.
interface: void sprite_initLinkPortrait_8117D4C(SpriteBlock *obj /* r5 */);
details: 'obj+0 set to graphics ID 0x23 (link-portrait tile).  Calls initGuiSprite_8002770 with type 0x61 and

  data pointer unk_20251B0.  Derives sub-record field at obj+0xC as (obj+4 frame + 5).  Then

  sequentially configures the sprite: setAnimation, loadAnimationData, noShadow, setPalette(0),

  setPriority(2).  Player slot is read from obj+3 (0–3).  A two-entry word table (off_8117DB4:

  0x90, 0xC0) selects the palette VRAM base passed to slotList_storeHalfwordAndClearField_800306C;

  a four-entry byte table (byte_8117DC4: 2,3,4,0) selects the sub-entry palette bank passed to

  sprite_setSubEntryPaletteBank_800304A.  Sub-record field A is set to 3.  Screen position is

  X=0x78, Y=0x28 + slot*0x20, stacking up to four portraits vertically at 32-px intervals.

  Animation state (obj+8) is forced to 4.  Finally calls sub_8117DC8 (post-init / display helper)

  and returns its outputs in r2, r3, r5, r10, r11.  r4 is preserved across the call.

  '
