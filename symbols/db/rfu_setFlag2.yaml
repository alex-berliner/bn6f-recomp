name: rfu_setFlag2
address: '0x0803C85C'
kind: function
status: probable
summary: Sets bit 1 (value 2) in the flags word of the fixed RFU/wireless shared state at 0x200BC50 and
  returns false.
interface: () -> r0 = 0, r1 = 0; always returns false/zero pair
details: 'Thin wrapper: it loads r0 = 2 and calls rfu_orFlags, which ORs the given bits into the flags
  word at offset 0xC of the hard-coded wireless state structure at 0x200BC50 (no self pointer is passed;
  the struct address is fixed). It then returns r0 = 0 and r1 = 0 unconditionally, so the bool return
  is always false regardless of the flag operation. Effectively a one-way ''raise flag 2'' request on
  the RFU state; the flag is never cleared here. No callers are known, so the semantic meaning of bit
  1 (e.g. some wireless-adapter state like ''connection requested'') is unconfirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #2; bl rfu_orFlags — sole effect is ORing value 2 into the flags word of struct 0x200BC50;
    mov r0, #0; mov r1, #0; pop {pc} — returns a constant (u32=0, bool=false) pair independent of the
    flag call; No other reads/writes or branches: 7 instructions total, no local state touched'
  refs:
  - bn6f/asm/asm03_1_1.s:7826
