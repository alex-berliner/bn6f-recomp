  reproduce: grep -n 'oAIAttackVars_TimerOrCycles' bn6f/asm/asm31.s | head
  result: '"mov r1, #1\n strb r1, [r7,#oAIAttackVars_TimerOrCycles]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Direct tick-down of the field itself, used as an in-frame counter that gates a transition (decrement,
    branch if still nonzero).
  refs:
  - bn6f/asm/asm31.s:109924
  reproduce: grep -n 'oAIAttackVars_TimerOrCycles' bn6f/asm/asm31.s | head
