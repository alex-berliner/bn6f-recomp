- method: assembly-reading
  date: '2026-10-15'
  detail: 'Strongly indicative of "duration": on entry the 0d byte is copied into the 16-bit per-frame
    timer Unk_10 — classic duration initialization.'
  refs:
  - bn6f/asm/asm31.s:109924
  reproduce: grep -n 'oAIAttackVars_TimerOrCycles' bn6f/asm/asm31.s | head
  result: '"ldrb r0,[r7,#oAIAttackVars_TimerOrCycles]\n strh r0,[r7,#oAIAttackVars_Unk_10]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Used as a small step index that increments each phase transition and is compared against a small
    constant (5) — a cycle/iteration count.
  refs:
