name: oAIAttackVars_TimerOrCycles
address: '0xd'
kind: struct-field
status: probable
summary: Per-attack duration/cycle counter for AI attack sub-states; commonly loaded into Unk_10 on enter,
  decremented per frame, and drives exit thresholds.
details: 'Extremely common pattern is to copy this byte into oAIAttackVars_Unk_10 as an initial timer
  (e.g. strh r0,[r7,#Unk_10] immediately after ldrb r0,[r7,#Unk_0d]), then Unk_10 ticks down each frame
  and is compared against another constant. Many sites also do `sub r0,#1; strb r0,[Unk_0d]` to use 0d
  directly as a tick-down step counter when no 16-bit length is needed (e.g. loc_80EC68E, loc_80FF3D6,
  loc_80FA344, loc_80FE3D0 loop). It is also repeatedly written from `sub_800FE28` random/lookup tables
  for stamina/cycle counts, and decremented (`add r0,#1; cmp #5`) to advance a phase.'
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: Storing a numeric duration (0x1e / 30) into the field at attack init, identical to the value
    used for Unk_0c right above — i.e. it is a duration/ticks parameter.
  refs:
  - bn6f/asm/asm31.s:109924
  reproduce: grep -n 'oAIAttackVars_TimerOrCycles' bn6f/asm/asm31.s | head
  result: '"mov r0, #0x1e\n strb r0, [r7,#oAIAttackVars_TimerOrCycles]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: Booleans are valid (here set to 1) but later treated as a numeric value, supporting a general
    "small numeric duration" interpretation rather than a flag.
  refs:
