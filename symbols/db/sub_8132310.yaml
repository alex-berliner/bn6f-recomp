name: sub_8132310
address: '0x08132310'
kind: function
status: confirmed
summary: Dispatches to a menu/object handler selected by the state byte at object+0x12, forwarding r2/r5 in and
  returning r2-r12.
interface: void sub_8132310(u32 r2 /*through*/, u32 r5 /*object ptr*/, u32 lr /*return*/) /* clobbers nz,c,v,r0,r1,lr;
  returns r2..r12 through */
details: 'Pushes {lr} so the dispatched handler sees a valid return address in the

  caller''s frame. Reads the state index from r5+0x12, shifts it left by 2,

  looks up the handler in the jump table at jt_8132324, and tail-calls it

  via "mov lr, pc; bx r0" (a one-shot helper around this pattern is documented

  in the comment block). Only r0/r1 (and flags) are scratch for the handler;

  r2 and r5 are passed in untouched, and the handler''s r2..r12 flow through

  to this routine''s caller. No other memory writes.

  '
