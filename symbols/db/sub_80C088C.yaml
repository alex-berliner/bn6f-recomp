name: sub_80C088C
address: '0x080C088C'
kind: function
status: confirmed
summary: 'Drives one phase of a battle object: on first entry spawns its intro effect and SFX, then flashes the
  object hide-flag each tick and advances the phase once the flash counter reaches zero.'
interface: void sub_80C088C(u32 r5 /* battleObject */); clobbers r0,r1,r2,r3,r4,lr and NZCV; preserves r5,r6,r7,r10.
details: 'Acts on the battle object passed in r5 using its offset table (oBattleObject_*).

  First visit (PhaseInitialized == 0): reads three u32s from object+0x34 (effect type,

  param, coord); the third gets +=0x140000 (a sprite/bg coordinate bias), then calls

  spawn_t1_0x0_EffectObject with effect args in r1,r2,r3 and type 0x26 in r4.

  Sets Unk_19 = 0x1F (frame counter for the flash), plays sound 0x94 (r2 forwarded

  from the spawner return), resets the per-tick Timer u16 to 0, writes PhaseInitialized = 4.

  Subsequent visits: tick Timer += 1; each tick sets ObjectHeader_Flags bit 0x02

  (hide), and on odd ticks clears it again, producing a flashing appearance; the

  Unk_19 counter is decremented by 2/tick and when it reaches 0 the hide bit is

  permanently re-set, Unk_19 cleared, and CurPhaseAndPhaseInitialized is written with

  4 (advancing the state machine). Sound 0x94 is the phase-start SFX.

  '
