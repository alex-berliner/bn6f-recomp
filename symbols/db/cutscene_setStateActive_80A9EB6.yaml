name: cutscene_setStateActive_80A9EB6
address: '0x080A9EB6'
kind: function
status: confirmed
summary: Marks the cutscene state as active by writing 1 to the flag byte at eCutsceneState+8.
interface: void sub_80A9EB6(void) /* sets byte at eCutsceneState+8 = 1; r5 nominally "read back" but unchanged */
details: 'A one-liner cutscene helper: stores the immediate value 1 into the byte at eCutsceneState+8 (byte_2011C58,
  offset 0x8 into the eCutsceneState struct at 0x2011C50). This flag evidently means "a cutscene is currently running"
  (or that the cutscene state machine should advance/lock input accordingly). It touches nothing else, preserves
  r4-r7, and is a plain leaf function (push/pop with pc return). The data words dword_80A9EC0 (0x2AAAA) and dword_80A9EC4
  (0x16C1) sitting before the literal pool are unrelated constants/pointers in the same pool area, not used by this
  routine. Quirk: the caller-derived contract lists r5 as an output, but the function never modifies r5 (it is in
  the preserved set), so callers presumably just have r5 live across the call rather than receiving a real return
  value.

  '
