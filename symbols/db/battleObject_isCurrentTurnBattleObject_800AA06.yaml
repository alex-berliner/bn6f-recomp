name: battleObject_isCurrentTurnBattleObject_800AA06
address: '0x0800AA06'
kind: function
previous_names:
- sub_800AA06
status: probable
summary: Returns true if the battle object whose AIData is at index r0 matches the battle object passed
  in r5.
interface: (r0 = aiDataIndex, r5 = battleObjectPtr) -> r0 = 1 if match else 0 ; sets flags Z (equal) and
  C (carry) via the cmp/bne path; r1/r2 are clobbered
details: "Calls getNextEntryAddress_800AAAE(r0) to get a pointer into the Next array at 0x2038170 (0x20-byte\
  \ entries).\n  Loads the first word at that entry ([r0]) and compares it to r5 (the candidate BattleObject\
  \ pointer).\n  Sets r2 = 1 on equality, 0 otherwise, then returns r2 (which becomes r0 via `mov r0,\
  \ r2`).\n  Effectively a \"is the battle object whose AIData index is r0 the same as the one in r5?\"\
  \ test used by battleObject phase-update paths.\n  Saves only lr; r1/r2 are caller-clobbered but only\
  \ r0 is contractually meaningful.\n"
evidence:
