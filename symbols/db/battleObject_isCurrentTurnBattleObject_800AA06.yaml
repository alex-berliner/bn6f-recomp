  date: '2026-10-14'
  detail: '- `bl getNextEntryAddress_800AAAE` followed by `mov r2,#0; ldr r0,[r0]; cmp r0,r5; bne loc_800AA16;
    mov r2,#1` is exactly "compare entry r0''s first word to r5, return 1 if equal else 0". - getNextEntryAddress
    returns Next[r0] base in r0 and array base in r1 (confirmed by callee summary), confirming r0 indexes
    0x20-byte entries at 0x2038170. - Caller sub_8109EC4 (Mettaur attack loop) uses this to gate Param4/AttackVars
    initialization on whether the "next" AIData target matches the current battle object. - Caller battleObject_joinAlly_80163B4
