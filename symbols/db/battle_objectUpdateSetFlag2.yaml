name: battle_objectUpdateSetFlag2
address: '0x080D358C'
kind: function
status: probable
summary: 'Per-frame update for a battle object: force flag 0x2 each frame, then run the standard tick
  chain (hit-reaction teardown, lifetime timer, action dispatch, sprite, collision).'
interface: (r5 = battle object header) -> r0 = result of object_presentCollisionData; flags from callees
details: Takes the battle object header in r5 and ORs 0x2 into oObjectHeader_Flags every frame before
  doing anything else, so the flag is (re)asserted each tick. It then calls sprite_clearFinalPalette (clears
  the final-palette high nibble, e.g. to drop a white-flash tint), object_finishCollisionHitReaction_801AD12
  (wind down a finished hit, shield flag-0x100 effect, damage finalize, hit spark), battle_objectTimerCountdown
  (lifetime countdown/destroy), battleObject_dispatchActionHandler_801B394 with the local 10-entry action
  table at off_80D35B8 (sub_80D35E0, battle_ResetObjectActionState_80165B8, sub_80D36CE, sub_80166AE,
  battleObject_initAndRunAI_8016B02, sub_8017CC0, sub_8016B36, sub_8016B72, loc_80D35FE, sub_80D3654),
  object_updateSprite, and object_presentCollisionData. This is the standard battle-object tick order;
  the object-specific parts are the forced flag 0x2 and the custom action handler table, so it is the
  update routine for one particular object type (single caller sub_80D3500).
