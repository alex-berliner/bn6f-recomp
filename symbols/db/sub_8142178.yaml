name: sub_8142178
address: '0x08142178'
kind: function
status: confirmed
summary: Increments the scenario effect step counter (byte at 0x200078E) by one.
interface: void sub_8142178(void); // no meaningful register inputs; r4-r7 preserved, r0 and flags (nzcvq) clobbered
details: 'Loads the byte at 0x200078E, which lives inside the scenario effect state structure pointed to by eScenarioEffectState2000780
  (field at offset 0xE), adds 1, and stores it back. The u8 store wraps at 8 bits, so the counter rolls over 0xFF
  -> 0x00. This is a textbook "advance to next step/frame of the scripted effect" helper, presumably called each
  tick by a scenario effect handler that then dispatches on the counter value. It touches nothing else and preserves
  r4-r7 purely by pushing/popping them for alignment/convention; it is effectively a leaf thunk.

  '
