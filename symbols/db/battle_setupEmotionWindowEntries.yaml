name: battle_setupEmotionWindowEntries
address: '0x080390F8'
kind: function
status: probable
summary: 'Preloads EmotionData slots in the 0x58-byte EWRAM array at 0x02008450: loops r4 from 4 down
  to 0 calling battle_initEmotionTableEntry_8046670 twice per iteration with type 0x3A into slots 3+2*r4
  and 2+2*r4 (filling slots 2-11) using packed words from byte_803913C (tag 0x09) and byte_8039154 (tag
  0x0A), and when r4==1 additionally initializes slot 12 with the packed value 0x50D.'
interface: () -> r0 = undefined (void); no flags, writes EmotionData slots in the 0x58-byte EWRAM array
  at 0x02008450
details: Loops r4 from 4 down to 0, calling battle_initEmotionTableEntry_8046670 twice per iteration with
  type 0x3A. Slot indices are 3+2*r4 and 2+2*r4, so slots 2-11 get filled; r2 is a packed word whose low
  byte is a tag (0x09 from byte_803913C, 0x0A from byte_8039154) and whose upper byte is a flags value
  (0,2,4,1,3 in the same order in both tables). When r4==1 it additionally initializes slot 12 with the
  packed value 0x50D (tag 0x0D, flags 0x05). All slots share type 0x3A, so this seeds the portion of the
  emotion-window data belonging to one emotion/window category.
