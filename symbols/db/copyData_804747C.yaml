name: copyData_804747C
address: '0x0804747C'
kind: function
status: confirmed
summary: 'Loads a batch of stage/battle graphics and data: zeros GFX scratch buffers, runs an object-init pass,
  then walks a ROM table to decompress and copy tile sheets, palettes, BG maps, and misc work-RAM blobs.'
interface: "void battle_loadStageAssets_804747C(void) {\n  // r2-r7, r10, lr: caller context; passed through to\
  \ callees\n  // Outputs: nz, c, v, r2-r7 set by final callee (decompAndCopyData)\n  // Clobbers: r0, r1, lr\n\
  \  call_zeroFillGFX30025c0();\n  call_sub_8046664();\n  call_decompAndCopyData(&off_8047494);\n}\n"
details: 'Sequential loader with no branching. 1) ZeroFillGFX30025c0 clears a 0x25C0-byte scratch buffer at 0x30025C0
  (likely a temporary tile/pixel staging area). 2) sub_8046664 performs an unnamed init pass (possibly resetting
  object/animation slots). 3) decompAndCopyData walks a null-terminated table of (source, dest, size) triples at
  off_8047494; entries with COMPRESSED_PTR_FLAG in the high bit are LZ-decompressed before copy. The table loads:
  BG tile sheet -> 0x6000020 (0x20 bytes palette-adjacent at 0x3001960), sprite tiles -> 0x6000800 (palette at 0x3001980,
  0xC0 bytes), a BG map at 0x6010040 (0x180 bytes) and 0x60101C0 (0x80 bytes), plus numerous work-RAM data blobs
  (text archive, misc buffers). All raw-copy and compressed-copy entries target specific VRAM or EWRM addresses.'
