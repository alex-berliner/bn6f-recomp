name: ai_attackChargeTick
address: '0x08100EEE'
kind: function
status: probable
summary: 'Per-frame AI attack state tick: initializes an attack (element 4, duration from AttackBoost2)
  then counts down and signals the hit (element 8) when the timer expires.'
interface: (r0-r3 unused; r7 = object with oAIAttackVars) -> updates oAIAttackVars_AttackElement/StepTimer/HitElement;
  no return value
details: State machine tick over the oAIAttackVars struct at r7. When AttackElement is 0 it writes 4 into
  AttackElement and copies AttackBoost2 into StepTimer as the frame countdown. On later frames it decrements
  StepTimer; when it hits 0 it stores 8 into HitElement, which downstream attack code presumably reads
  as the element of the landing hit. It touches only these three fields and returns without setting flags
  meaningfully. The semantics of element values 4 and 8, and what AttackBoost2 means as a duration, are
  not shown by this code.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — entry condition is ''attack not yet initialized'';
    strb #4 into AttackElement and strh AttackBoost2 into StepTimer — one-time attack setup with a frame
    duration; ldrh StepTimer, sub #1, bgt — per-frame countdown of the attack; strh #8 into HitElement
    when timer expires — signals the attack''s hit element on completion; executed by recorded ''battlesweep''
    routes, consistent with an AI attack step handler'
