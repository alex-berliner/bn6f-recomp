name: battle_setExtraAnimState_80E0F2E
address: '0x080E0F2E'
kind: function
status: confirmed
summary: Switches a battle object's animation-state slot to 0x15 or 8 depending on the selector, and reloads its
  sprite (0x80, anim 0x14) only when the state actually changed.
interface: void battle_setExtraAnimState(int selector /*r0*/, BattleObject* obj /*r5*/); clobbers r0-r3, lr and
  flags; preserves r4/r5; r3 holds the sprite_noShadow return value (or the old slot value on the no-change path)
details: 'Called with r0 = selector and r5 = battle object pointer (uses oBattleObject_ExtraVars+0xC

  as the current state slot and oBattleObject_CurAnimCopy). Picks the new state value:

  0x15 if selector == 1, otherwise 8. Stores it into ExtraVars+0xC. If the old value in

  that slot differed, it performs the full animation refresh: sprite_load(0x80, 0x14, state),

  sprite_loadAnimationData(), and sprite_noShadow() (r2 carries the state value into

  sprite_load, so the third argument is the state/anim index just selected). It then

  writes 0xFF to oBattleObject_CurAnimCopy (invalidating the cached current animation so

  the engine re-pushes it) and clears bit 3 (0x8, the "shadowless"/no-shadow flag) of

  oObjectHeader_Flags at offset 0 of the header. If the state did not change, it exits

  early without touching the sprite, leaving the old slot value in r3. Sprite resource

  0x80 with animation block 0x14 appears to be a shared character sheet where the third

  argument selects which pose/animation within the block; states 8 and 0x15 are two

  different poses of that sheet.

  '
