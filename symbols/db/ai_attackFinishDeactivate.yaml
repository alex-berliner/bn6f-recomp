name: ai_attackFinishDeactivate
address: '0x080F6880'
kind: function
status: probable
summary: 'Tail of an AI attack: after a 3-frame wind-up (anim 4, element 4), calls sub_80F7514 then deactivates
  the battle object, adjusts ObjectFlags1 (clears 0x40, sets CURRENTLY_MOVING_1, clears 0x16), and exits
  the attack state.'
interface: (r0-r3 unused; uses battle object in r5 and AI vars in r7) -> r0 = destroyed; flags set/cleared
  as described
details: Runs as the tail of an AI attack routine. On entry, if oAIAttackVars_AttackElement is 0 it latches
  element=4, sets the object's current animation to 4, and starts a 3-frame StepTimer, returning until
  the timer elapses. Once the timer runs out it calls sub_80F7514 with oAIAttackVars_ScratchVar (unknown
  callback/argument source), then battle_deactivateObject to hide the object (Z=0xFF, no shadow/collision,
  removed from the active-record table). It then clears ObjectFlags1 bit 0x40, sets the bit 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1
  (1<<7?), clears bit 1<<0x16, and finally calls object_exitAttackState to hand control back. In effect
  this is the 'vanish after attacking' cleanup used by one-shot enemies/traps.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'strb #4 to oAIAttackVars_AttackElement and oBattleObject_CurAnim with a 3-frame timer = short
    attack wind-up (asm 0x80F6884-0x80F6894); sub_80F7514 called with oAIAttackVars_ScratchVar right before
    battle_deactivateObject; battle_deactivateObject directly despawns the object mid-attack routine;
    object_clearFlag 0x40 / setFlag1 currently-moving / clearFlag 1<<22 then object_exitAttackState ends
    the attack'
  refs:
  - bn6f/asm/asm31.s:134548
  - 0x080F7140 battle_deactivateObject
  - 0x0801A15C object_clearFlag
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080F6880
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The overall behavior matches: it sets element=4, anim=4, runs a 3-frame StepTimer, then on expiry
    calls sub_80F7514, deactivates the object, toggles flags (clears 0x40, sets 0x7, clears 0x16), and
    exits the attack state. However it returns r0==destroyed only if sub_80F7514 returns that in r0, and
    battle_deactivateObject returns nothing meaningful; the proposal''s ''r0 = destroyed'' claim is unsupported.
    A more accurate summary would emphasize that the function does not truly destroy but merely deactivates
    the object.; run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
