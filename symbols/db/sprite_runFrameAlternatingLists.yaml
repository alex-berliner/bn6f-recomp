name: sprite_runFrameAlternatingLists
address: '0x08089280'
kind: function
status: probable
summary: Selects one of two structurally identical script command tables based on (frame & 0x1F) < 8,
  runs it via scriptListRun_8001158, then always runs a fixed third table — driving a frame-gated, blink-like
  sprite animation.
interface: () -> void; r0-r2 scratch, no meaningful return value
details: 'Loads the toolkit''s current frame pointer (r10 = toolkit), takes frame & 0x1F, and if the result
  is < 8 selects the command table at byte_80892F4, otherwise the one at byte_80892A4; it then runs the
  chosen table with scriptListRun_8001158, and afterwards unconditionally runs the table at byte_8089344.
  The two variant tables are structurally identical: same data arguments (8, 4/0x74, 8/0xE0, 0x4D/0xE4,
  ...) but each entry''s second command word differs, cycling through a contiguous block 0xD240-0xD24F
  (table A uses one set, table B the others), ending with a shared 0xD254 entry — i.e., the two variants
  dispatch to different handlers for the same data. The fixed table''s entries use commands 0x4078/0x4088
  with data args 0x8014/0x8034/0x8054/0x4014/0x4034 (which read like offsets or resource indices). The
  frame-gated alternation suggests a timed blinking/animating effect driven through the generic script
  dispatcher rather than dedicated code.'
