name: sub_8133C58
address: '0x08133C58'
kind: function
status: confirmed
summary: 'Handles a SELECT button press in the in-game chatbox menu: plays the confirm sound, dispatches the appropriate
  close/submenu script, and updates menu state flags.'
interface: chatbox_selectPress_8133C58(r5 = menu_state_ptr) -> nz (1 = action dispatched, 0 = ignored); inputs r2
  r3 r4 r5 r6 r7 r10 lr; outputs nz r4 r5 r6 r7 r10; clobbers r0 r1 r2 r3 lr; preserves r4 r6 r7 r10
details: 'If SELECT is not held, returns with Z set (no action). Reads a blocking byte at menu_state+0x44; if nonzero,
  aborts silently. On a valid press: plays SOUND_MENU_SELECT (0x44 in the local table), zeroes the submenu-active
  byte at menu_state+0x3, calls submenu_isOpen_81355D8 to check whether a submenu is showing, then runs chatbox
  script 0x1B (submenu open) or 0xA (normal close) via chatbox_runScript_803FD9C. Marks menu_state+0x2 with 0xC
  (confirmed selection), then copies menu_state+0x3 (possibly mutated by the script) to menu_state+0xD. Returns
  1 (nz, Z cleared) to signal the caller the press was consumed.'
