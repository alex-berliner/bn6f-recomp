name: battle_spawnObjectElementRegion
address: '0x080DBEBA'
kind: function
status: probable
summary: Spawns a battle collision region carrying the parent object's element and copies one flag bit
  onto it.
interface: (r5 = battle object) -> r0 = spawned object or 0; r4/r6/r7 preloaded with spawn params (0x15050001,
  damageCounterDisabler field, 3)
details: Loads a fixed spawn-parameter word 0x15050001, the parent's DamageAndStaminaDamageCounterDisabler
  field, its Element byte, and its Z coordinate, then calls object_spawnCollisionRegion to create a hit/collision
  region positioned at the object's Z with the parent's element. If the spawn succeeds, it reads bit 0x10
  of the parent's oObjectHeader_Flags and ORs it into the new object's flags, so the region inherits that
  parent flag. If spawning fails (r0 = 0), it just returns. The arguments are set up by the caller sub_80DBDBC,
  which loads them into r4-r7 before jumping here, so this routine is effectively the tail half of that
  spawn sequence.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r2,[r5,#oBattleObject_Element] and ldr r3,[r5,#oBattleObject_Z] feed object_spawnCollisionRegion
    (element + Z params); ldr r6,[r5,#oBattleObject_DamageAndStaminaDamageCounterDisabler] passes a parent
    object field to the spawner; flag copy: ldrb r1,[r5,#oObjectHeader_Flags]; and with 0x10; orr into
    [r0,#oObjectHeader_Flags]; dword_80DBEDC = 0x15050001 is a packed spawn-arg constant passed via r4;
    beq locret when object_spawnCollisionRegion returns null, i.e. spawn-failure guard'
