name: setupBattleBackground_801DDF6
address: '0x0801DDF6'
kind: function
status: confirmed
summary: 'Sets up the battle background: queues a small GFX transfer into VRAM, copies background tiles,
  then enables flag bit 4 on the eStruct2035280 structure.'
interface: "void sub_801DDF6(void)\n  // inputs:  none (callee-saved registers only)\n  // outputs: none\n\
  \  // clobbers: nz c v (flags); caller-saved r0,r1,r2,r3 used for args\n  // preserved: r4, r5 (saved/restored\
  \ around body), r6, r7, r10, lr (preserved through body)\n"
details: "Performs three sequential setup steps for the battle background:\n1. QueueEightWordAlignedGFXTransfer:\
  \ queues a 0x20-byte DMA-style GFX transfer from\n   dword_86E1C78 (ROM/RAM source) to unk_3001A80 (VRAM\
  \ destination). The size is 32 bytes,\n   so only one 8-word aligned chunk is queued.\n2. CopyBackgroundTiles:\
  \ stamps tile data into BG tilemap. Arguments are\n   (j = 6, i = 0, tileBlock32x32 = 3, tileIds = word_801ED6C,\
  \ j_size = 0x12, i_size = 2).\n   The (i, j) range 0..0x12 wide by 0..2 tall implies a 18x2 tile area\
  \ being populated\n   from tile block 3, using the tile ID table at word_801ED6C.\n3. flagSetBits_eStruct2035280_801BEB8:\
  \ sets bit 4 (mask 0x10, i.e. 1 << 4) of the\n   eStruct2035280 structure, marking this background as\
  \ loaded/enabled.\nThe function saves r4/r5 on the stack and restores them, plus the caller's r6/r7\n\
  are preserved through it. The push {r4,r5,lr} / pop {r4,r5,pc} is a standard leaf-like\nwrapper; the\
  \ body does not return early.\n"
