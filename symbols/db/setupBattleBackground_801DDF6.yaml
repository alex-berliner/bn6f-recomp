- Is dword_86E1C78 a compressed or raw tile/palette chunk, and is unk_3001A80 in BG VRAM, OBJ VRAM, or
  a buffer? End-address labels are not typed.
- What does flag bit 4 of eStruct2035280 represent ("background loaded", "battle in progress", something
