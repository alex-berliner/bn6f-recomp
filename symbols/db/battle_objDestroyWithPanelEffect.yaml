name: battle_objDestroyWithPanelEffect
address: '0x080CE3C4'
kind: function
status: probable
summary: 'Destruction handler for a 3-variant battle object: it removes itself from collision, spawns
  a pair of timed panel effects, plays a per-variant sound, and switches to the destroy state.'
interface: (r0 = battle object ptr, r5 also points to it, corrupted) -> r0 = CUR_STATE_DESTROY stored
  to object state; no return value
details: 'The routine first calls object_clearCollisionRegion on the object at r5 so it stops registering
  hits, then reads oBattleObject_CollisionDataPtr->oCollisionData_FlagsFromCollision: r6 becomes 1 if
  the object had collided, 0xF otherwise (an effect lifetime in frames). It indexes two per-variant tables
  with oBattleObject_Param1: byte_80CE421 (0x3B,0x3B,0x3C) is passed with PanelX/PanelY, the duration
  and oBattleObject_AllianceAndDirectionFlip to sub_80CE468 (likely spawns a visual effect/object), and
  byte_80CE41E (0x4,0x7,0x6) is passed with PanelX/PanelY and the duration to sub_80CE424 (likely a second
  effect or a panel-state change). It then plays the halfword sound ID from byte_80CE418 selected by Param1*2
  (0x90, 0x118, 0x11B) and finally writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized.
  The three-entry tables suggest the object has three param-driven variants (e.g. levels or elements)
  sharing one death animation.'
