    (asm lines 2, 24-25); tst on oCollisionData_FlagsFromCollision selects duration 1 vs 0xF for the spawned
    effects (lines 4-9); byte_80CE421 values 0x3B/0x3C passed with panel coords and flip to sub_80CE468
    look like effect/animation IDs (lines 10-18); byte_80CE41E values 4/7/6 passed with panel coords to
    sub_80CE424 suggest a per-variant panel-related effect (lines 19-23); PlaySoundEffect with byte_80CE418[param1*2]
    IDs 0x90/0x118/0x11B gives each variant its own sound (lines 24-27)
