  vs. offsets) is unconfirmed
- whether the target is the player, an enemy, or a summoned object depends on who sets RelatedObject1Ptr
- 'The code matches the summary: Param1/Param2 are written into RelatedObject1Ptr''s panel coords and pixel coords
