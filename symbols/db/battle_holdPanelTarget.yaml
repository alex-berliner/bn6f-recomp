name: battle_holdPanelTarget
address: '0x080E569C'
kind: function
status: probable
summary: Phase handler that pins a related battle object to Param1/Param2's panel for 60 frames via sub_80E5700,
  then ends with object_timefreezeEnd.
interface: (r5 = battle object ptr, implicit) -> void; sets target PanelX/PanelY from Param1/Param2 and recomputes
  its pixel coords each frame
details: 'Runs as a per-frame phase handler for a battle object: if CurPhase is 0 it sets CurPhase=4 and Timer=60
  (0x3C). Every frame it calls sub_80E5700 (unidentified, likely the effect''s own update/animation step), then
  reads Param1 (panel X) and Param2 (panel Y) and writes them into RelatedObject1Ptr''s oBattleObject_PanelX/PanelY,
  so the target object is forcibly held on that panel, followed by object_setCoordinatesFromPanels to sync its pixel
  position. It decrements Timer each frame; when it reaches 0 it calls object_timefreezeEnd to release the effect''s
  memory and reset both sides'' time-freeze state. Param1/Param2 are therefore the destination panel coordinates
  and RelatedObject1Ptr the dragged/held target.'
evidence:
