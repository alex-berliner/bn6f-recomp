summary: Initializes a battle/scene state by queuing several setup actions and resuming script playback.
interface: void sub_8049F70(void);
details: "Thin dispatcher that fires four scripted actions in sequence and returns. The\ncallees and their arguments\
  \ strongly suggest a battle/scene initialization:\n- sub_803BA64() with no argument: appears to be an unconditional\
  \ action enqueue\n  or fade/reset hook.\n- sub_803B522(0xA) with R0=10: enqueues action type 0xA (commonly a load/queue\n\
  \  step in the BN6 action system).\n- sub_803B674(0x28=40) with R0=40: enqueues action type 0x28.\n- sub_803A8B4(1)\
  \ with R0=1: enqueues action type 1.\nThe final \"1\" passed to sub_803A8B4 is consistent with \"run / start the\n\
  queued action stream,\" which is how battle setup scenes typically close.\nInputs r5 and r10 are preserved verbatim\
  \ through the call chain (the function\nonly mutates r0-r3 via ARM ABI and pops {r4-r7,pc}), so callers pass scratch\n\
  values through it. No global state is touched directly here — everything is\ndelegated to the battle/action helpers\
  \ at 0x803BA64, 0x803B522, 0x803B674 and\n0x803A8B4, which are the canonical \"sub_803Bxxx\" battle-action entry\
  \ points\nused throughout BN6.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
