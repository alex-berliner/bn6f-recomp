name: battle_runFadeFrame
address: '0x080491FC'
kind: function
status: probable
summary: Advances one battle frame while a screen fade is active, using temporary network-script object
  state.
interface: (r0 = ?, r1 = ?, r2 = ?, r3 = ?, r4 = ?, r5 = battle/network-script object, r6 = ?, r7 = ?,
  lr = return address) -> r0 = battle_stepFrame result; flags inherited from battle_stepFrame
details: If the screen fade is active, the function calls sub_803C320, writes 0x1C to the object byte
  at offset 1, sets the object field at offset 0x28 to 0x1E via sub_803BB7C, and clears the object's network-script
  timer at offset 0x2C via object_setNetScriptTimer. It then calls battle_stepFrame unconditionally, so
  the fade-related setup occurs only during an active fade but the battle frame always advances. The function
  has no known callers, so its broader caller and r5 provenance are unresolved.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly lines 80491FC-8049218 call IsScreenFadeActive, conditionally call sub_803C320, set
    [r5+1] to 0x1C, call sub_803BB7C with 0x1E, call object_setNetScriptTimer with 0, and unconditionally
    call battle_stepFrame.; The callee metadata identifies object_setNetScriptTimer as writing object
    offset 0x2C and sub_803BB7C as writing object offset 0x28.; The unconditional tail call shows this
    routine wraps battle_stepFrame rather than replacing it.
