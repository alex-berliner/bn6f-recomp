- method: assembly-reading
  date: '2026-10-18'
  detail: cmp r0, r1 / bge+bne blocks add ±0x10000 to [r5+0x14] only when it differs from sub_80AA04C's return (80A9FB8–80A9FD8);
    ldrb r0,[r5,#4]; cmp r0,#8 gates the SetEventFlagFromImmediate/ClearEventFlagFromImmediate pair for EVENT_1640
    (80A9FF6 region); flag is set then conditionally cleared unless lsr r0,#0x10 == 0x20, so it reflects counter
    high word == 32 (80A9FE6–80A9FF4); tail call bl sprite_update shows this is an object tick run alongside sprite
