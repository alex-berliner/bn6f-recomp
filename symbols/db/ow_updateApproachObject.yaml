name: ow_updateApproachObject
address: '0x080A9FB8'
kind: function
status: probable
summary: 'Per-frame map-object update: steps the object''s 16.16 value at +0x14 by 1 toward a target from sub_80AA04C,
  and for object kind 8 sets event flag EVENT_1640 while the value''s high word equals 0x20.'
interface: (r0 = object kind byte from [r5+4], r5 = object struct) -> r0 = sprite_update result; updates [r5+0x14]
  and event flag EVENT_1640
details: 'r5 is an overworld object struct: byte +4 is the object kind, +0x14 a 32-bit (16.16 fixed point) counter.
  sub_80AA04C(kind) yields a target; if the counter already equals it nothing changes, otherwise the counter moves
  ±0x10000 (one integer unit) per call toward the target (signed compare, so it works in both directions). When
  kind == 8, the routine sets flag EVENT_1640 and then clears it again unless counter>>16 == 0x20, leaving the flag
  set exactly on frames where the counter''s integer part is 32 — effectively a threshold trigger. Finally calls
  sprite_update on the object so its sprite follows the updated state.'
