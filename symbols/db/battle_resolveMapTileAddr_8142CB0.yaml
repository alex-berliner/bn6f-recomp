name: battle_resolveMapTileAddr_8142CB0
address: '0x08142CB0'
kind: function
status: confirmed
summary: Resolves the absolute memory address of the current battle-map tile by combining a tile offset
  with the tile-table base inside MapTilesState.
interface: u32 battle_resolveMapTileAddr_8142CB0(/* r10 = battle context */) -> r0 (absolute tile data
  address); r5-r7 preserved
details: 'Loads the global eMapTilesState200be70 pointer (0x200BE70) into r5, calls sub_8142D58 to perform
  a guard/validation pass that may update r0 and r5, then passes r0 to sub_8142DA0 which returns a per-tile
  byte offset in r0 while carrying the (possibly battle-relative) tiles-state pointer in r5. From that
  state struct it reads the tile-table pointer at offset 0xC (dword_200BE7C), reads a stride/base value
  at tile-table+8, adds that to the tile-table pointer to form the tile-array base, and finally adds the
  tile offset to produce the absolute tile address in r0. The function touches the MapTilesState structure
  layout: +0xC tile-table pointer, tile-table +8 stride/array-base. All callee-saved registers r4-r7 are
  pushed/popped; the caller''s r5 is restored before return.'
