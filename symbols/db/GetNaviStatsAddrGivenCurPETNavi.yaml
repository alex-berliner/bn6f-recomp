name: GetNaviStatsAddrGivenCurPETNavi
address: '0x0801401E'
kind: function
status: confirmed
summary: Returns a pointer to the NaviStats struct (entry size 0x64) for the navi currently selected in the PET.
interface: Next GetNaviStatsAddrGivenCurPETNavi(int currentPETNaviId, Toolkit *toolkit /* r10 */)
details: Calls GetNaviStatsIndexGivenCurPETNavi(r0 = current PET navi id) to map the PET's selected navi id to a
  NaviStats slot index (likely via CurPETNaviToNaviStatsIndexTable in the helper). Multiplies that index by 0x64
  (100), i.e. sizeof(NaviStats), and adds it to Toolkit->NaviStatsPtr (r10 + oToolkit_NaviStatsPtr), returning the
  base address of that navi's 100-byte stats record. No validation of the resulting pointer; the callee's table
  maps many navi ids onto index 1.
