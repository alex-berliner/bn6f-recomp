name: battle_renderChipSlots_81275C8
address: '0x081275C8'
kind: function
status: confirmed
summary: Renders the three Battle Chip selection slots (BG slots 8/9/10) of a toolkit selection row, loading each
  slot's selected chip byte from r5+0x14/0x15/0x16 into a toolkit object's +8 field and dispatching each render
  via sub_8127580 with palette offsets 0x000/0x400/0x800.
interface: 'void sub_81275C8(u32 r5 /* chip-slots struct */, u32 r10 /* toolkit_obj_ptr */, u32 r7 /* unused? */,
  u32 lr /* ret addr */); /* outs: r5 r7 r8 r9 r10 r11 r12 preserved; r0 r1 r2 r3 clobbered by callee; NZCV clobbered
  */'
details: "Pulls a pointer to a battle toolkit object from the global at oToolkit_Unk200a220_Ptr (loaded via r10-derived\
  \ pointer). Iterates three times — once per chip slot — each time:\n  1. Reads a selection/byte from r5+0x14,\
  \ r5+0x15, or r5+0x16 and stores it to (toolkit_obj)+8.\n  2. Calls sub_8127580(r0 = slot_id 8/9/10, r1 = palette_offset\
  \ 0x000/0x400/0x800, r2 = 0x6009000, r3 = eTextScript201BF20, r4 = unk_2018A00).\nPalette offsets step by 0x400\
  \ (one 16-color OBJ palette each), consistent with three independent palette banks for the three slots. The fixed\
  \ BG tile base 0x6009000 and the eTextScript201BF20/unk_2018A00 arguments indicate sub_8127580 is a generic tile/script\
  \ loader that uploads slot artwork into VRAM.\nr4..r9 are pushed/popped around the call sequence, so they survive\
  \ intact; the body itself clobbers nothing per-call beyond what sub_8127580 takes (r0-r4) plus its return clobbers,\
  \ which is why preserved register accounting matches the contract.\nNo branches, no writing back to r5; pure render-output,\
  \ no state mutation outside the toolkit+8 field and VRAM fill done by the callee.\n"
