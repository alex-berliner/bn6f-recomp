name: object_dispatchCurAction
address: '0x080E9E10'
kind: function
status: probable
summary: 'Battle-object dispatcher: reads the object''s current action and jumps to the matching handler
  routine via a small jump table.'
interface: (r5 = battle object pointer) -> r0 = return value of the dispatched handler; no flags guaranteed
details: Loads the byte at oBattleObject_CurAction from the object in r5 and uses it as an index into
  a two-entry function-pointer table at off_80E9E24 (action 0 -> sub_80E9E2C, action 1 -> sub_80E9EA0),
  calling the selected handler with a long call (mov lr,pc / bx r1) and returning its result via pop {pc}.
  Any action index outside {0,1} would read a garbage pointer from beyond the table, so the caller must
  keep CurAction in range.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]: dispatch indexed by the object''s CurAction
    field; off_80E9E24 holds exactly two thumb pointers, sub_80E9E2C+1 and sub_80E9EA0+1, so only actions
    0 and 1 are valid; mov lr,pc; bx r1 followed by pop {pc} is a standard tail-call to the selected handler'
  refs:
  - bn6f/asm/asm31.s:108005
