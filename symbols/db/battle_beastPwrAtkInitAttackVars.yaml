name: battle_beastPwrAtkInitAttackVars
address: '0x08011C18'
kind: function
status: probable
summary: 'Initializes the AI attack variable block for a beast-power attack: computes damage from a base/multiplier
  pair and sets extra damage, an init flag, and a boost word.'
interface: (r7 = AI attack vars struct) -> r0 = 0x3d (attack/state id?); r0..r1 clobbered by call
details: Calls battle_beastPwrAtk_addScaledBase_8012642 with base damage 0x1e (30) and multiplier 0x14
  (20), storing the resulting scaled damage into oAIAttackVars_Damage (halfword). It then writes oAIAttackVars_ExtraDamage
  = 0x8a (138), oAIAttackVars_InitFlag = 0x20, and a full word 0x2D3D00 into oAIAttackVars_AttackBoost2.
  Finally it returns 0x3d in r0, which the caller presumably uses as an attack/phase identifier. The struct
  is addressed entirely via r7 with the oAIAttackVars field offsets, so r7 is the working attack-state
  record. No callers are known, so who supplies r7 and consumes the 0x3d return is unverified.
