name: bubbleShotAttack_80ECBB0
address: '0x080ECBB0'
kind: function
status: confirmed
summary: 'Bubble-shot AI attack step: dispatches on the element the attack last hit, either stepping in for a strike
  (normal hit) or updating the hold timeout (missed/held).'
interface: void bubbleShotAttack_80ECBB0(void); // r7 = attackVars (AI attack vars); tail-calls handler with r0
  = HitElement, r1 = handler addr; results returned in r1, r5, r8-r12; flags clobbered
details: 'Trampoline for the AI''s bubble-shot attack routine. Reads the HitElement byte from the AI attack vars
  at [r7, #oAIAttackVars_HitElement] and uses it to index a two-entry handler table at off_80ECBC4: index 0 (no
  element hit / neutral) -> ai_attackFrontStrikeStep+1 (step forward and perform a strike, i.e. the shot connected),
  index 1 -> ai_attackHoldTimeoutUpdate+1 (the attack is still holding / timed out while holding the shot). The
  routine sets up a tail-call: r0 is left holding the element value and r1 holds the selected Thumb handler address,
  then branches via `mov lr, pc; bx r1`, so the handler returns directly to bubbleShotAttack''s caller. All other
  incoming registers (r2 r3 r5 r6 r7 r10) pass through untouched, and the handler''s outputs in r1, r5 and r8-r12
  become this function''s outputs. The element byte therefore acts as a two-way state flag for whether the bubble
  shot landed.

  '
