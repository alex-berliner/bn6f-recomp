name: sub_800AE0C
address: '0x0800AE0C'
kind: function
status: confirmed
summary: Per-frame tick of the battle phase state machine — records phase transitions, kicks phase setup, and runs
  a countdown timer that resets the phase to 0 when it expires.
interface: void battle_updatePhaseState_800AE0C(void); // no meaningful register inputs; reads the battle state
  pointer from the toolkit (r10 + oToolkit_BattleStatePtr). Clobbers r0, r1, lr, flags; preserves r4-r7.
details: "Loads the current BattleState via the toolkit's BattleStatePtr (r10-based). Three byte fields\ndrive it:\
  \ oBattleState_Unk_1c (current phase), oBattleState_Unk_1b (highest phase already\nacknowledged), and oBattleState_Unk_1d\
  \ (phase timer).\n\n1. If the current phase (Unk_1c) is greater than the last recorded phase (Unk_1b), it stores\n\
  \   the new phase into Unk_1b. When the new phase is >= 2, it calls GetBattleMode and, unless\n   the mode equals\
  \ 6 (a mode that does its own setup), calls sub_801E228 with (phase - 2) in\n   r0 to run that phase's setup —\
  \ phase index 2 maps to argument 0, so the setup routine is\n   indexed by (phase - 2).\n2. Then it decrements\
  \ the phase timer byte Unk_1d if nonzero; when the timer is already zero,\n   it resets the current phase Unk_1c\
  \ back to 0.\n\nQuirk: the \"reset to phase 0\" only happens once the timer has fully counted down to 0 and\n\
  been observed at 0, so a phase that never sets Unk_1d gets reset immediately on the next tick\nafter it was entered.\
  \ sub_801E228 is called with the battle state pointer still in r4 (the\npushed r4 is only restored after the call\
  \ returns), suggesting it also reads it from there.\n"
