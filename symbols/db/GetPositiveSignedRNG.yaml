name: GetPositiveSignedRNG
address: '0x08001532'
kind: function
status: confirmed
summary: Advances the game's primary RNG seed with a rotate/increment/XOR step and returns the new seed as a non-negative
  (sign-cleared) value.
interface: 'u32 GetPositiveSignedRNG(void) // in: r7=scratch; out: r0=new seed with bit31 cleared, r2/r3=shift temporaries,
  c=0, v=0, nz from result; preserves r7'
details: 'Steps the global PRNG state at ePrimaryRngSeed forward one iteration. The current 32-bit seed is rotated
  left by one bit, incremented by 1, and XORed with the fixed constant 0x873CA9E5; the result is written back to
  the seed variable. The value returned in r0 is the new seed with its top bit cleared (done via an LSL #1 / LSR
  #1 pair), so callers always get a non-negative signed value. Side effects useful to the lifter: r2 holds old_seed<<1,
  r3 holds old_seed>>31 (the rotation temporaries left in registers by the compiled code), the carry flag ends up
  0 (the bit shifted out of the final LSR is bit 0 of seed<<1, which is 0), overflow is cleared, and N/Z reflect
  the returned value. r7 is used to hold the pointer to ePrimaryRngSeed and is saved/restored around the body. Only
  the single global seed variable is touched; no other game state.

  '
