name: battleObject_computeBButtonOffsets_8028894
address: '0x08028894'
kind: function
previous_names:
- sub_8028894
status: probable
summary: Computes a base offset and slot-index pair (returned in r0/r1) from a battle object's B-button
  chip slot byte
interface: '(r5 = BattleObject*) -> r0 = base, r1 = slot index; side effects: r6 set to &byte_80288B0,
  lr saved/restored via push {lr}/pop {pc}'
details: "Reads `ldrb r0, [r5, #7]` — that is byte 0x7 of the `BattleObject`, which sits inside the\n\
  \  `Params` union (`Param4` / `BPwrAtk` candidate; with the AI/ObjectHeader layout this is the\n  `Param4`\
  \ byte used by chips). If the value is < 5, r1 is left at 0; otherwise r1 becomes 0x18\n  and 5 is subtracted\
  \ from r0. The result is then `r0 = (r0 << 4) + 8`, `r1 += 0x68`.\n  Concretely: the function returns\
  \ a 16-byte-aligned base address/8-bit slot offset (`r0*16+8`)\n  and a per-row constant (`0x68` for\
  \ row 0, `0x80` for row 1) in r1. r6 is loaded with the\n  address of the `byte_80288B0` table at 0x080288B0\
  \ (32 bytes of small constants used by the\n  caller). The function is a tail-call via `pop {pc}`, so\
  \ there is no real frame. It runs with\n  an interrupt-safe saved-lr-on-stack pattern (`push {lr}`).\n"
