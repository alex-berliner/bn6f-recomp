name: battle_setupNoCustomPlusObjectCollision
address: '0x08014760'
kind: function
status: probable
summary: Flags the current battle object with 0x30 in ObjectFlags1 and refreshes its collision with a
  hit modifier of 3 when the NoCustomPlus battle effect is active, else 0.
interface: () -> void; operates on the current battle object tracked outside this function
details: First ORs flag bits 0x30 (bits 4 and 5) into the battle object's CollisionData ObjectFlags1 via
  object_setFlag1, whose target object is not passed here and must be established by the caller. It then
  calls battle_IsNoCustomPlusActive_80107C0, which tests bit 3 of the battle-effects bitmask and yields
  3 only while Custom+ is disabled. That 0-or-3 result is passed as the hit-modifier argument to object_updateCollisionData,
  together with r1 = 0x10 and r2 = 2, which refreshes the collision record and re-evaluates it (marking
  bit 16 while time is stopped). The 0x30 flags likely make the object intangible/ignored by collision
  until further setup. The exact in-game identity of the object depends on the unknown adjacent callers.
