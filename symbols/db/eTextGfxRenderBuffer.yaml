name: eTextGfxRenderBuffer
address: '0x02017C80'
kind: data
status: probable
summary: 'Proposed name: eTextGfxRenderBuffer. EWRAM scratch buffer (160 bytes) used as a tile-destination
  area when rendering text GFX panels into VRAM via renderTextGfx_8045F8C. (struct)'
details: The label is passed as the third argument (r2) to renderTextGfx_8045F8C, which copies text GFX
  tiles into a caller-supplied buffer before they are DMA'd into VRAM. Its size (160 bytes = 20x8 bytes,
  or four 8x8 tile rows in 4bpp) matches a small text panel tile block. It is otherwise only referenced
  from sub_812B430, which renders the eTextScript201BA20 panel into VRAM slot 0x21 and uses this buffer
  as the working destination. No writer is visible at these sites; the buffer is populated inside renderTextGfx_8045F8C.
