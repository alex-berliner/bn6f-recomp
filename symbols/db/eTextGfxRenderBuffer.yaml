  date: '2026-10-20'
  detail: bn6f/asm/asm33.s:17336 — sub_812B430 loads unk_2017C80 into r2 and passes it as the tile-dest
    pointer to renderTextGfx_8045F8C for VRAM slot 0x21; bn6f/asm/asm33.s:17368 — unk_2017C80 is the sole
    entry of off_812B49C, a .word table used to thread a destination buffer into renderTextGfx_8045F8C;
    renderTextGfx_8045F8C takes (script, vramSlot, destBuffer, vramAddr, ...) — the destBuffer is where
    decoded text tile data is staged for DMA into VRAM; 160-byte size is consistent with one 4bpp 20x32-pixel
    text panel of 8x8 tiles; no other bn6f functions reference the label, matching a single-purpose render
