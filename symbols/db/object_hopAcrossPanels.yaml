name: object_hopAcrossPanels
address: '0x080C9964'
kind: function
status: probable
summary: Battle-object state handler that repeatedly hops the object from its panel to a target panel
  over a fixed timer, then destroys it (or destroys it early if it lands on a solid/off-grid panel).
interface: (r0 = battle object) -> void; on failure/finish spawns effect t1 0x14, clears collision region,
  sets state CUR_STATE_DESTROY
details: 'This is a per-frame state routine for a battle object that moves panel-by-panel. On first entry
  (PhaseInitialized==0) it reads a small config struct at oBattleObject_ExtraVars: byte+0 = number of
  hops (repeat count), byte+1 = selects which velocity solver runs (sub_80C9A58 vs sub_80C9AAA), byte+2
  = hop duration in frames; it stores the target panel (ExtraVars+4/+8, seeded from PanelX/PanelY later)
  and computed pixel target/velocities (ExtraVars+0xC/+0x10, X/YVelocity), calls object_updateCollisionPanels,
  resets Timer, and sets PhaseInitialized=4. Each frame it increments Timer; at half the duration it converts
  its current interpolated X/Y via convertXYToPanelXY to keep CollisionData PanelX/Y in sync mid-flight;
  at full duration it re-solves a new target from the current panel, incrementing Param3 until the repeat
  count is reached. Every frame it interpolates position via sub_80C9B36 (object_getCoordinatesForPanels
  start/target + Timer), writes X/Y, and refreshes panels with object_setPanelsFromCoordinates. If the
  occupied panel is solid (object_isPanelSolid) or out of the 6x3 grid (object_isValidPanel fails), or
  the hops are exhausted, it spawns effect 0x14, clears its collision region, and destroys itself.'
