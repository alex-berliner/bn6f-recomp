summary: Returns the AI attack-scheduler's timer value and substep count, each looked up from a 4-entry
  table indexed by the current AI difficulty tier.
interface: () -> r0 = attack timer/cycle count (byte_80F9EF8[tier]), r1 = substep index (byte_80F9EF8[4+tier]);
  flags clobbered
details: 'The function has no real arguments: it twice calls sub_800FE28 with a pointer into byte_80F9EF8,
  first to the table base and once to base+4, and returns the two bytes in r0 and r1. Given the caller
  stores battle_getAiDifficultyTier''s result just before, sub_800FE28 almost certainly indexes the pointed
  table by that difficulty tier (tables are 4 bytes each: {3,3,4,5} and {2,3,3,3}). The caller (sub_80F9FA6,
  an AI attack-variable initializer) stores r0 into oAIAttackVars_TimerOrCycles and r1 into oAIAttackVars_SubStepIndex,
  so the pair configures how the upcoming AI attack is timed. The lookup-by-shared-helper pattern matches
  the neighboring battle_getAiDifficultyTier_800FE36.'
