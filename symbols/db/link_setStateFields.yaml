- method: assembly-reading
  date: '2026-10-19'
  detail: strb r0,#0x34,[r5,#1] then two zeroing strb to [r5,#2] and [r5,#3] — the whole body is a three-field
    struct update; called from link_verifyChecksumAndMatchPartner (0x812B9F8/0x812BA1C), a link-comm state
    transition handler; other callers 0x812B8DC/0x812B97C/0x812BB08 are also link-comm handlers, all passing
    the same struct base in r5
