name: link_setStateFields
address: '0x0812C24C'
kind: function
status: probable
summary: Writes a fixed value 0x34 into byte +1 and clears bytes +2/+3 of an r5 struct used by link-communication
  state handlers.
interface: (r0 = unused, r5 = pointer to link state struct) -> r0 = 0 on return; no flags set meaningfully
details: The function stores 0x34 into [r5+1] and zeros [r5+2] and [r5+3], then returns 0 in r0. It takes
  no real arguments besides the struct in r5 (r0 is overwritten with 0 at the start). Given all callers
  are link-comm state handlers (checksum verification and partner-state matching over unk_2033C00), r5
  is most likely an eLinkState-style record, where +1 is a state/command id being set to 0x34 and +2/+3
  are counters or sub-state bytes reset alongside it. The exact meaning of 0x34 depends on the state table
  used by link_verifyChecksumAndMatchPartner, which is not visible here.
