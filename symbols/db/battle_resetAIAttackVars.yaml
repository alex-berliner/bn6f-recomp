name: battle_resetAIAttackVars
address: '0x08011EF0'
kind: function
status: probable
summary: resets an AI attack-variables block (r7) to default values and returns a fixed status code
interface: (r7 = pointer to oAIAttackVars struct) -> r0 = 0x42; r7 fields overwritten with defaults
details: Zeroes oAIAttackVars_ChargeReadyFlag and oAIAttackVars_AttackBoost, sets ChipUseDelay to 0x14
  and ExtraDamage to 0x14, sets InitFlag to 3, Damage to 0x64 (100), and stores constant 0x3c1000 into
  oAIAttackVars_AttackBoost2. It then returns the constant 0x42, which looks like a status/next-state
  token for the caller's state machine rather than a computed result. The struct pointer comes in via
  r7, so this is a leaf helper inside a battle-AI routine that keeps its context in the high register.
  No callers are known, so the surrounding state machine semantics (what 0x42 and InitFlag=3 mean downstream)
  remain unconfirmed.
