name: sub_8118604
address: '0x08118604'
kind: function
previous_names: []
status: hypothesis
summary: Dispatches AI by Y-coord-indexed entry on r6's BattleObject, scans AI attack vars slots to build a bitmask,
  then stores the result into sprite field 0x2c.
interface: '(r6 = BattleObject*, r5/r10 = toolkit) -> r0/r1/r2/r3 = modified; side effects: AIData dispatched, sprite
  0x2c of r6''s object overwritten'
details: "Loads the u16 `Y` and `Y16` halves from r6+0x38/0x3a (BattleObject Coords Y), sums them,\n  scales by\
  \ 4 to get a u16 stride and indexes into `word_201DA80` (EWRAM table at 0x0201DA80),\n  then subtracts `0x90`\
  \ (the offset of `SpriteData` within the BattleObject that has 0x2c extra\n  vars, i.e. oT1/oT3 layout). It calls\
  \ `battleObject_runAIDispatchTable_813B7A0` with that pointer,\n  r6's `Element` (offset 0xe), and a zero arg.\
  \ The result pointer is taken +8 (skipping the\n  AIAttackVars header) and r4/r6/r7 are used as nested counters:\
  \ outer r4 0..0x31 (49 entries),\n  inner r6 0..5 (6 bytes per row), walking the AI attack-variable table slot\
  \ by slot; every\n  non-zero byte clears the corresponding bit of `r2` (initially `0x40000000`, shifting right\
  \ each\n  inner iteration). The final bitmask in r0 is passed to `sprite_setUnk0x2c` together with the\n  AI dispatch\
  \ result, applying it to the sprite's 0x2c field.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r0, [r6,#0x3a]` / `ldrh r1, [r6,#0x38]` sum BattleObject Coords Y halves (loc 0x38/0x3a). - `lsl
    r0, r0, #2` then `ldr r1, off_81186A4 // =word_201DA80` indexes EWRAM table of u16s. - `sub r0, #0x90` matches
    `oBattleObject_SizeWithoutSpriteDataAndLinkedList` (sprite region base). - `ldrb r1, [r6,#0xe]` loads `Element`;
    `mov r2, #0` followed by `bl battleObject_runAIDispatchTable_813B7A0` is the AI dispatch. - `add r7, #8` skips
    the AIAttackVars header so the scan starts at the per-element subvars. - `mov r0, #0; mvn r0, r0; lsl r0, r0,
    #1; lsr r0, r0, #1` = `0x7FFF`, then `mov r2, #0x80; lsl r2, r2, #0x17` = `0x40000000` (initial bit). - Inner
    loop `tst r3, r3; beq ...; bic r0, r2` clears bits where the byte is non-zero; nested counters `cmp r6,#5` /
    `cmp r4,#0x31` give a 49*6 = 294-byte scan area. - Final `bl sprite_setUnk0x2c` writes the accumulated bitmask
    into the sprite''s 0x2c word.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08118604

