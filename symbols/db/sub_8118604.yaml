name: sub_8118604
address: '0x08118604'
kind: function
previous_names: []
status: hypothesis
summary: Builds a per-element "alive enemy" bitmask from AI dispatch results and writes it to the sprite's 0x2c
  field
interface: '(r6 = battleObject) -> r0 = elementAliveMask ; side effect: sprite_setUnk0x2c stores r0 into object
  sprite field 0x2c'
details: "Reads r6->Unk_38 (u16) and r6->Unk_3a (u16) (BattleObject offsets 0x38/0x3a, both u16s in Coords region)\n\
  \  to compute an index `(Unk_3a + Unk_38) * 4`, then fetches a base pointer from `word_201DA80`\n  and reads a\
  \ u16 there, subtracting 0x90 from it before passing as r0 to `battleObject_runAIDispatchTable_813B7A0`.\n  That\
  \ callee returns r0 = pointer to a per-element \"alive\" byte array for the current frame.\n  The function then\
  \ iterates over ~0x31 entries (`r4` counter up to 0x31, `r6` counter inner 0..5),\n  starting at `r0 + 8`, scanning\
  \ bytes; for each nonzero byte it clears the corresponding bit\n  in a 17-bit mask seeded as `~0 << 1 = 0xFFFE`\
  \ (initial r0 = 0x7FFFFFFE after `mvn; lsl; lsr`).\n  The mask bit position is shifted via r2 = `0x80 << 0x17\
  \ = 0x400000` then `lsr r2, #1` per step,\n  yielding 17 sequential bits (bit 0..16). The 6-cycle inner loop with\
  \ r6<5 + r4+=2, r7+=2\n  partitions the scan into ~9 outer iterations of ~3 elements each (matches Element count\
  \ = 6 in BN6).\n  After the scan, calls `sprite_setUnk0x2c` to persist the mask into the object's sprite struct\
  \ field 0x2c.\n  `Element` is at BattleObject offset 0xe and is passed in r1 to the AI dispatch, suggesting the\n\
  \  iteration walks panel-aligned slots across the field rather than just elements.\n  Returned r0 = final mask\
  \ (typically 0x7F7BFFFF in the captured snapshots, with only some bits clear).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r0,[r6,#0x3a]` / `ldrh r1,[r6,#0x38]` at 0x8118608/0x811860A read two u16 fields of the BattleObject
    - `add r0,r0,r1; lsl r0,#2; ldr r1,=word_201DA80; add r0,r0,r1; ldrh r0,[r0]; sub r0,#0x90` derives an index/pointer
    - `ldrb r1,[r6,#0xe]` reads the BattleObject''s Element byte (struct offset 0xe per BattleObject.inc) - `bl
    battleObject_runAIDispatchTable_813B7A0` returns an `r0` pointer; `add r7,r0,#8` skips 8 header bytes - The
    inner loop at 0x8118632 reads `[r7]` and clears a bit in `r0` via `bic r0,r2` for nonzero bytes - `mvn r0,r0;
    lsl r0,r0,#1; lsr r0,r0,#1` produces the mask `0x7FFFFFFE` (visible as `7f7bffff` in captures since some bits
    cleared) - Final `bl sprite_setUnk0x2c` writes r0 into the sprite''s 0x2c field, used downstream for AI targeting/visibility
    - Captured entry/exit values are stable across 6 snapshots (`r1=0x0813944c`, `r2=0x10`, `r3=0x02008730`, exit
    `r0=0x7f7bffff`), confirming this is a deterministic per-frame mask build'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08118604

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^08118604 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- 'Exact meaning of the bitmask: "alive enemies per element" vs "valid target slots per element" vs something else'
- Why the outer count is 0x31 (~49) and inner is 6 - whether 6 == Element count or 6 == something else
- Why the result is `bic`-ed (cleared on nonzero) rather than `orr`-ed - "alive" semantics may be inverted
- The role of the `word_201DA80` lookup - it likely indexes into a per-frame/per-turn dispatch table; without resolving
  that table the index meaning remains guessed
- Settling any of the above would require either (a) running this code in isolation with a known enemy layout, or
  (b) reading the table at `word_201DA80` and the AIState/AIAttackVars structures referenced by `sub_813B7A0`
