name: checkEventFlag217
address: '0x080AA7D4'
kind: function
status: probable
summary: Returns 1 if story/event flag 217 is set, else 0.
interface: () -> r0 = 1 if EVENT_217 set, else 0; ZF from TestEventFlagFromImmediate consumed internally
details: 'A tiny predicate wrapper: clears r4, tests EVENT_217 via TestEventFlagFromImmediate (the shared
  story-flag table lookup), sets r4=1 when the flag is set, and returns r4 in r0 so the result is a normalized
  0/1 rather than the raw flag state. No other state is touched and no other flags are checked. Without
  callers it is impossible to say what gameplay state flag 217 represents; the name is chosen purely from
  the flag index.'
