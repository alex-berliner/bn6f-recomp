name: ai_attackStepUpdate
address: '0x080FF504'
kind: function
status: probable
summary: 'Per-frame tick for an AI enemy''s attack: arms the attack on its first run, counts down the
  attack timer, and exits the attack state when it expires.'
interface: (r0,r1 unused/passed through; r7 = AI attack vars struct, r5 = battle object) -> r0 clobbered;
  updates AttackElement/StepTimer, calls object_exitAttackState when timer ends
details: 'Uses r7 as an AI attack-variables record and r5 as the battle object. On the first invocation
  (AttackElement == 0) it initializes the attack: sets AttackElement to 4 (likely a default/none element),
  resets the object''s CurAnim to 0, and copies AttackDuration into StepTimer as the countdown. On subsequent
  frames it decrements StepTimer; once the timer reaches 0 it calls object_exitAttackState to return the
  enemy to its normal state. This looks like a shared per-frame state handler dispatched during recorded
  battle sweep routes.'
