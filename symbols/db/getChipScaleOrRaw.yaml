name: getChipScaleOrRaw
address: '0x08010C76'
kind: function
status: probable
summary: Returns the raw halfword at ChipData+0x1A for normal chips; for special chips (field >= 0x3E9),
  maps a per-chip counter through packed-BCD thresholds (0x10..0x28) to a rank 0..10 and returns the corresponding
  halfword from a per-chip rank table.
interface: '(r0 = *ChipData) -> r0 = halfword: table entry [rank][chipIndex] if field 0x1A >= 0x3E9, else
  field 0x1A raw; flags clobbered'
details: Reads the halfword at ChipData+0x1A; values below 0x3E9 (1001) are returned as-is. Otherwise
  the value minus 1001 indexes unk_20018C0 (u16 array, one counter per special chip). That counter is
  converted to packed BCD by memory_bcd_8000D84, then the loop walks byte_8010CB8, a table of ten thresholds
  0x10,0x12,...,0x28 (decimal 10-28 step 2), taking the first threshold >= the value to get rank 0-10
  (values above 0x28 fall through to rank 10). The result is a halfword from byte_8020E54 at offset 22*(chipIndex)
  + 2*rank, i.e. an 11-entry halfword table per special chip, so the returned value scales with the counter's
  rank. The BCD step implies the thresholds are meant as decimal 10..28. Called by the chip-selection
  panel renderer and a chip classifier, so the returned value feeds chip display/classification for the
  affected chips.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r1,[r0,#0x1a]; cmp r1,#0x3e9; blt loc_8010CB0 (raw fallback return); r4 = 2*(field-0x3e9);
    ldrh r0,[unk_20018C0+r4] — per-chip u16 counter table; bl memory_bcd_8000D84 then scan of byte_8010CB8
    thresholds 0x10..0x28 gives rank 0..10; mul r0,r4 by 11 plus 2*rank; ldrh r0,[byte_8020E54 + ...]
    — 11 halfwords per chip entry; callers chipPanel_renderChipGfxAndText_8119438 and sub_811FF80 both
    operate on chip records
