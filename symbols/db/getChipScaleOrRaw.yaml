  reproduce: python3 tools/asmcat.py 0x08010C76
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the described logic: reads halfword at +0x1A, returns raw if <0x3E9, otherwise
    uses (val-0x3E9) as index into unk_20018C0, converts via memory_bcd_8000D84, and walks the threshold
    table at byte_8010CB8 (which is 11 word-sized entries storing little-endian values 0x10, 0x12, ...,
    0x28, not 10 entries). The threshold table has 11 entries (rank 0-10), confirmed by `cmp r1, #0xa`
    followed by fall-through to rank 0xB (11). The returned byte/halfword index uses `mul r0, #0xb` and
    `add r1, r1` (2-byte stride), so it indexes 11 halfwords per chip. Only minor inaccuracy: thresholds
    are listed as ten values but are actually 0x10,0x12,...,0x28 = 10 stepping-by-2 values, matching 11-rank
    (0-10) search. Name is acceptable; a slightly clearer name would be getChipScaleOrRaw since it returns
    a scaled value for special chips and the raw field otherwise.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
