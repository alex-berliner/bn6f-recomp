name: ai_beastAttackStepTick
address: '0x0810F376'
kind: function
status: probable
summary: 'Per-frame tick of a multi-step Beast-Out (Falzar/wood-element) AI attack: counts down the step
  timer and hit counter, tags each hit with wood element, and ends the attack when the counter runs out.'
interface: (r0 implicit; r5 = battle object ptr, r7 = AI attack vars block) -> r0 = 0 or new HitElement
  value; no flags relied on
details: 'Decrements oAIAttackVars_StepTimer; while it is still >= 0 the attack continues. Once it goes
  negative, it decrements oAIAttackVars_AttackBoost2: if boosts remain it stores element 4 (wood) into
  oAIAttackVars_HitElement, matching Falzar Beast Out''s wood element; when the counter hits 0 it reloads
  oAIAttackVars_AttackDuration into StepTimer, clears oBattleObject_CurAnim on the object in r5, and writes
  0xC (no element / attack finished) to HitElement. The jump table right after points at battle object
  state handlers (RunSpawnAnimationMaybe, battleObjectStateDispatcher, sub_810F2EC, sub_810F434), placing
  this among the beast AI attack-state routines used by the battlesweep/beastsp routes.'
