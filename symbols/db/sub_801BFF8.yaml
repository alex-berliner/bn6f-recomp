name: sub_801BFF8
address: '0x0801BFF8'
kind: function
status: hypothesis
summary: Thin trampoline that tail-calls sub_801C002 with a zero first argument, passing its register and flag results
  straight back to the caller.
interface: void sub_801BFF8(void) — callers supply live r4-r7/r10 state that the callee expects; returns whatever
  sub_801C002 returns in r0-r3 and NZCV.
details: 'Two-instruction wrapper (plus push/pop of lr): sets r0 = 0 and branches to sub_801C002.

  No other register is touched, so the callee effectively sees the caller''s own r4-r7 and r10;

  the callee''s outputs (r0-r3 and NZCV) flow through unchanged. The contract shows r4-r7 are

  listed as outputs but also as preserved, consistent with the callee being responsible for

  honoring those registers. Nothing here identifies a game-side purpose — the meaning depends

  entirely on what sub_801C002 does with its r0 argument (a mode/subcommand selector is a

  common pattern for such zero-seeded dispatches). Game-term naming should wait until

  sub_801C002 is understood.

  '
