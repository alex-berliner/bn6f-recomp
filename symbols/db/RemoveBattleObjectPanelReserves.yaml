name: RemoveBattleObjectPanelReserves
address: '0x0801BB78'
kind: function
status: confirmed
summary: Releases every panel reserve on the 7x4 battlefield that is owned by the given battle object, if that object
  holds any.
interface: void RemoveBattleObjectPanelReserves(ObjectHeader* obj /* r5 */)
details: 'Takes a battle object pointer in r5. First checks the object header''s flags byte (oObjectHeader_Flags,
  offset 0) for bit 0x20, which marks the object as holding panel panel reserves; if clear, it returns immediately.
  Otherwise it sweeps the entire 7-column by 4-row battlefield in the original''s downward-counting order (rows
  4..1 outer via r7, columns 7..1 inner via r6). For each tile it calls object_getPanelDataOffset(col,row) to get
  the panel data; if the tile has panel data and its oPanelData_ReserverObjectPtr matches the passed object, it
  calls object_removePanelReserve(col,row) to clear the reservation. Panel data pointers of 0 (empty/no panel entry)
  are skipped. Quirk: r6 and r7 are used as loop counters but are pushed/popped so callers'' values are preserved;
  r2/r3 are left holding whatever the last callee left there.

  '
