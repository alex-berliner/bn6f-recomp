name: object_spawnTableHazard
address: '0x080D6952'
kind: function
status: probable
summary: 'Initializes a battle object as a table-defined trap/hazard: sets up its collision data from
  a per-Param1 entry, or frees the object if it can''t spawn.'
interface: (r5 = battle object, r5->Param1 selects entry in byte_80D6914) -> void; object freed via object_freeMemory
  on failure
details: Reads the 8-byte table entry byte_80D6914[Param1*8], stores its address in the object's ExtraVars,
  then checks the object's panel with object_isCurrentPanelValid; on failure (or if object_createCollisionData
  returns no slot) the object is freed. On success it fills the new collision-data slot via object_setupCollisionData
  (bytes [0],[1] and word [4] of the entry), writes entry byte [3] into collision data +1, byte [2] as
  hit effect via object_setCollisionHitEffect, and byte [5] as a status-effect base via object_setCollisionStatusEffect1;
  if byte [6] is nonzero it calls sub_801A4D0 with byte [7]. It then stores the object pointer as ObjectHeader
  of its RelatedObject1Ptr (marks itself as the collision's parent), runs object_presentCollisionData
  for the first frame, and sets the object state to CUR_STATE_UPDATE before tail-calling sub_80D69B8 (likely
  its state handler).
