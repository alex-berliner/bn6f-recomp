name: battle_spawnEffectOnFrontPanel
address: '0x080C2110'
kind: function
status: probable
summary: Spawns effect object 0x16 on the panel directly in front of the given battle object, positioned
  from its panel coords and facing.
interface: (r5 = battle object pointer, r0 unused) -> r0 = spawned effect object pointer; no flags of
  interest
details: Reads the object's effective horizontal flip (object_getFlip), shifts it into the high byte of
  0x16 to form an effect descriptor (0x16 + flip<<8), and gets the +1/-1 front-direction multiplier from
  object_getFrontDirection. Adds the multiplier to oBattleObject_PanelX to select the adjacent panel toward
  the object's facing side, then converts that panel column/row to 16.16 fixed-point screen coordinates
  via object_getCoordinatesForPanels. Calls spawn_t1_0x0_EffectObject with the coords in r1/r2, the descriptor
  in r4, and r3 = 0x100000. The object pointer arrives in r5 per this file's convention (set by the caller),
  not in r0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: add r4, r4, r0 after flip<<8 builds effect id 0x16 tagged with facing (asm lines 3-5); ldrb
    r1,[r5,#oBattleObject_PanelX]; add r0,r0,r1 adds frontDirection to the panel column; bl object_getCoordinatesForPanels
    converts the adjusted panel to screen x/y; bl spawn_t1_0x0_EffectObject with r3=0x100000 and r4=0x16|flip<<8
    spawns the effect; sole caller sub_80C1B2E sets r5 to the battle object before this is reached
