name: battle_gfx_renderLatticeOrSpinner_811E0BA
address: '0x0811E0BA'
kind: function
status: confirmed
summary: Builds the tile data for a lattice/spinner battle overlay (or a solid flash placeholder) in the GFX staging
  buffer and DMA-transfers it to VRAM at 0x6015580.
interface: void battle_gfx_renderLatticeOrSpinner_811E0BA(void) /* preserves r4-r7, clobbers r0-r3, lr, flags; no
  meaningful input registers */
details: "1. Zero-fills the 0x140-byte staging buffer at byte_2027200 via ZeroFillByWord.\n2. Reads the tile count\
  \ from eStruct2001010 + 0x10.\n   - Non-zero (sprite / lattice path): clears the tick field at +0x12, then selects\
  \ a\n     base palette byte by tile count (>=0x28 → 0xC0, >=0x14 → 0xD0, else 0xE0).\n     For each pair of columns\
  \ the function writes a combined nibble (base|alt =\n     base>>4) or alt-only for a trailing odd column.  Pixels\
  \ are laid out at\n     4-byte stride inside a 0x20-byte row; the destination advances by 1 each\n     iteration\
  \ and jumps +0x1C every 8 iterations (row boundary).\n   - Zero (flash-placeholder path): increments the tick\
  \ field at +0x12; once the\n     tick (masked to 6 bits) reaches 0x20, fills the entire buffer with 0xEE\n   \
  \  (a single solid tile row) using the same stride layout.\n3. Queues an eight-word-aligned GFX DMA transfer (QueueEightWordAlignedGFXTransfer)\n\
  \   from byte_2027200 to VRAM 0x6015580, size 0x140 bytes.\nFields touched: eStruct2001010+0x10 (tile count),\
  \ eStruct2001010+0x12 (tick),\nbyte_2027200 (staging buffer), 0x6015580 (VRAM tile map destination).\n"
