    being zero vs non-zero with the second branch incrementing `[eStruct2001010+0x12]` is visible at `cmp
    r4,#0 / beq loc_811E118` and `add r0,#1; strb r0,[r1,#0x12]`. - Caller `sub_81419A0` is reached from
    `lr=0x081419d9` in every captured snap, and its contract (in r4/r6/r7/r10/lr, out r8/r9/r12) fits
