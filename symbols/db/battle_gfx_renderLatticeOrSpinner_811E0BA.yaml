status: probable
summary: Prepares and VRAM-queues a 0x140-byte background-tile lattice (or "no-data" filler) used by the
  chip-select/lattice battle-screen effect, branching on `eStruct2001010+0x10`.
interface: () -> void ; queues a 0x140-byte GFX transfer from EWRAM `byte_2027200` to VRAM `0x06015580`
  via `QueueEightWordAlignedGFXTransfer`; reads/writes `eStruct2001010+0x10..0x12`.
details: "- Clears the 0x140-byte staging buffer at `byte_2027200` with `ZeroFillByWord(byte_2027200,\
  \ 0xa<<5)` (i.e. 0x140 = 32*10 bytes).\n  - Reads a u8 control byte at `eStruct2001010+0x10` into r4.\
  \ If non-zero (the \"render lattice\" branch), picks a column-width nibble `r1 = r0>>4` and a base nibble\
  \ `r0` from a 3-step table driven by the control value (`0xc0` default; `0xd0` if r4>=0x14; `0xe0` if\
  \ r4>=0x28).\n  - Walks r6 from 0 to r4 in steps that lay down 8 bytes per 4-column tile: `r2 = (r1\
  \ | r0)` once two columns have been written, else just `r1`; the byte is then stored at seven offsets\
  \ `+0,+4,+8,+c,+10,+14,+18,+1c` and r7 advances by 1. Every 8 rows r7 jumps an extra `+0x1c` to skip\
  \ the inter-tile gap (so the writes target the visible 8x8 tile columns only). Stops when r6 reaches\
  \ r4.\n  - If `eStruct2001010+0x10 == 0` (the \"idle / wait\" branch), increments `eStruct2001010+0x12`,\
  \ masks it (`& 0x3f`), and once the low 6 bits reach `0x20..0x3f` writes a uniform `0xee` byte (8 writes\
  \ per row) across r6 = 0..0x50 in the same pattern - a \"spinner / no-data\" fill that runs only on\
  \ alternating ticks.\n  - Both branches fall through to `QueueEightWordAlignedGFXTransfer(byte_2027200,\
  \ 0x06015580, 0xa<<5)` to push the buffer to VRAM character-base `0x06015580` (one screenful of 4bpp\
  \ tiles).\n  - The caller `sub_81419A0` lives in the same lattice-related block (`snap_beastsp_*` traces\
  \ show it firing on every animation tick while a BeastSP-style effect plays), so this is the per-frame\
  \ tile/uploader for that effect.\n"
