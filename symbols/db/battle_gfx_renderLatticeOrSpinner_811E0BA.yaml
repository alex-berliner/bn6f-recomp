    `mov r1,#0xa; lsl r1,r1,#5`). - Destination constant `0x6015580` (`dword_811E15C`) plus size `0xa<<5`
    matches a 4bpp 32x32-tile BG block typical of a BG character base. - The `tst r6,#7` + `add r7,#0x1c`
    pattern emits exactly 8 visible bytes then 28 tri-byte tile-gap bytes per row (28 = 0x1c), consistent
