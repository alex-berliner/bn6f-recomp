name: encryption_zenny_8006f78
address: '0x08006F78'
kind: function
status: confirmed
summary: Anti-cheat check on the player's zenny; sets a cheat flag and reports tampering via the Z flag.
interface: 'void encryption_verifyZennyIntegrity_8006f78(void); /* in: nothing meaningful (r0-r7,lr pushed); out:
  Z flag = zenny checksum still valid (Z set = OK, Z clear = tampered); r0-r7,lr preserved via push/pop */'
details: 'Validates the protected copy of the player''s zenny two ways. First, oGameState_ProtectedZenny must be
  the bitwise complement of the shadow copy at oGameState_Unk_6c in the GameState struct reached via toolkit->oToolkit_GameStatePtr;
  if they differ, bit 0 of oGameState_Unk_74 (a cheat/tamper-detected flag word) is set with an ORR so previously
  detected cheats are not cleared. Second, the stored zenny is XORed with the key at dword_2000060 (IWRAM) and compared
  against a checksum read through a double pointer: toolkit + oToolkit_Unk2005028_Ptr -> pointer -> checksum word.
  The Z flag is the boolean result: the final CMP leaves Z set when the keyed zenny matches the checksum; on mismatch
  the function executes MOVS r0,#1 (which only sets NZ, clearing Z) before returning. r0-r7 and lr are pushed on
  entry and the routine pops r0-r7 plus pc, so all low registers are restored unchanged and lr is discarded; callers
  are expected to branch on Z after the call. No game objects are modified other than the cheat-flag word.

  '
