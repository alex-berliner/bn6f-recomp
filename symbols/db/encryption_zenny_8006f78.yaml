open_questions:
- exact meaning of bit 0 in oGameState_Unk_74 (presumably a cheat-detected flag; how the game reacts to it elsewhere
  is not shown here)
- what struct lies behind toolkit+oToolkit_Unk2005028_Ptr and what the checksum word there represents
- whether callers ever read r0 (contract lists r0-r7 as outputs, but the push/pop restores them, so r0's value at
  return is whatever the caller passed in)
