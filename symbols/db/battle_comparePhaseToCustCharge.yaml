name: battle_comparePhaseToCustCharge
address: '0x0800AF50'
kind: function
status: probable
summary: Three-way comparison of the battle phase-step index against the custom gauge charge level, offset
  by (3 - state-4 event count), returning which side leads or a special value.
interface: () -> r0 = 1 if phaseStep > charge + (3 - eventCount), -1 if charge > phaseStep + (3 - eventCount),
  2 if instead eventCount >= 3, else 0; no inputs, flags clobbered
details: 'Reads oToolkit_BattleStatePtr and loads three byte fields from the battle state: PhaseStepIndex,
  CustGaugeChargeLevel, and State4EventCount. It computes a slack value of 3 - eventCount, then first
  tests phaseStep > charge + slack (returns 1), then charge > phaseStep + slack (returns -1). If the two
  are within slack of each other, it returns 2 when eventCount >= 3, otherwise 0. It is a pure read-only
  helper with no side effects, called from the per-frame battle tick and several battle state-step handlers.
  The slack of 3 minus event count suggests eventCount shrinks a tolerance window on some phase/charge
  timing decision.'
