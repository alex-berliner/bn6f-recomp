- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb from oBattleState_PhaseStepIndex, CustGaugeChargeLevel, State4EventCount off the toolkit's
    battle-state pointer; neg r4,r2; add r4,#3 builds slack = 3 - eventCount used in both comparisons;
    cmp r0,r5 / bgt returns 1; symmetric cmp r1,r5 / bgt returns -1; cmp r2,#3 / bge returns 2 only when
    eventCount >= 3, else 0; called from battle_state_tick_8007CA0 and battle_stepEndFadeWait plus four
