name: toolkit_setUnk2009740StateBytes_804CC6E
address: '0x0804CC6E'
kind: function
status: confirmed
summary: Writes the constant bytes 0x0C and 0x10 into offset 2 and 3 of the toolkit's Unk2009740 struct,
  likely setting a two-byte state/counter pair.
interface: void sub_804CC6E(r10 = toolkit register base); r5 is left untouched (the lifter reports it
  as an "output" only because callers happen to read it back after the call); flags NZ clobbered, r0-r1
  clobbered, r4-r7 preserved.
details: 'Loads the Unk2009740 pointer from the toolkit (r10 base, oToolkit_Unk2009740_Ptr), then stores
  0x0C at ptr+2 and 0x10 at ptr+3 as bytes. No other fields are touched, no return value is produced,
  and r5 is simply preserved through the call. The target struct''s identity is unknown, but the pointer
  lives in the global toolkit area (0x2009740 region), so this most likely tweaks some global battle/system
  state, e.g. a state id and a timer/limit pair. The two constants (12 and 16) look like coupled counters
  or a state/parameter pair rather than a 16-bit halfword write.

  '
