name: object_reloadSpriteState
address: '0x080BB62C'
kind: function
status: probable
summary: Reinitializes a battle object's visuals (sprite, animation, palette, flip) and moves it into
  the CUR_STATE_UPDATE state.
interface: (r5 = battle object, implicit) -> r0 = ?; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_UPDATE
details: Runs entirely against the object in r5 using the sprite subsystem's implicit-object convention.
  It first recomputes the object's pixel X/Y from its panel coordinates and zeroes oBattleObject_Z (ground
  height). It then loads sprite resource 0x80 (with args 8, 4), reloads animation data, enables the shadow,
  resets CurAnim and CurAnimCopy to 0 via sprite_setAnimation, reloads animation data again, sets palette
  0, and applies the object's effective facing via object_getFlip/sprite_setFlip. Finally it stores CUR_STATE_UPDATE
  into the state/phase field, handing the object to the per-frame update path. The combination (reset
  position + reload sprite + reset anim/palette + enter update state) is characteristic of a respawn or
  state-reset routine, e.g. after an object is reused or restored.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_setCoordinatesFromPanels then str r0,[r5,#oBattleObject_Z] zeroes height and repositions
    from panels; bl sprite_load with r0=0x80, r1=8, r2=4 followed by sprite_loadAnimationData and sprite_hasShadow
    reloads the object's visual; strb r0,[r5,#oBattleObject_CurAnim] / CurAnimCopy zeroed before sprite_setAnimation(0)
    resets the animation; sprite_setPalette(0) and object_getFlip -> sprite_setFlip fully re-derive palette
    and facing; mov r0,#CUR_STATE_UPDATE; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
