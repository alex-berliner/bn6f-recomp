name: battleObject_updateBeastSpSlotMask_8118604
address: '0x08118604'
kind: function
status: confirmed
summary: Builds a 31-bit active-slot bitmask from a beast sprite's AI animation pattern table and submits it to
  the sprite.
interface: void battleObject_updateBeastSpSlotMask_8118604(BattleObject *r6 /*, r5, r10 preserved */);
details: 'Computes an index into the word array word_201DA80 from two half-word

  fields of the battle object (offsets 0x38 and 0x3A, summed then shifted

  left 2). The fetched half-word minus 0x90 yields a pattern_id. Together

  with the byte at offset 0x0E this is fed to

  battleObject_runAIDispatchTable_813B7A0 which returns an animation-pattern

  base pointer in r0.


  A 35-byte slot table is then walked starting at base+8 in rows of 5 data

  bytes with a 2-byte gap (7-byte stride per row, 7 rows, 49 loop

  iterations). A mask begins at 0x7FFFFFFF and a bit cursor at 0x80000000;

  each loop iteration shifts the cursor right by 1, and each non-zero data

  byte clears the current cursor bit from the mask (bic). Because the cursor

  reaches zero after 31 shifts, only the first 31 iterations actually modify

  the mask; the trailing gap and last-row data bytes are visited but have no

  effect.


  The final mask is passed as r0 to sprite_setUnk0x2c (along with r5 from

  the dispatch call) to commit it to the sprite. Flags (nzcv) returned to

  the caller originate from sprite_setUnk0x2c. Registers r4-r7 are saved

  and restored; r5 and r6 (the sprite pointer) survive the call for the

  caller''s benefit.

  '
