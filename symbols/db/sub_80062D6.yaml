name: sub_80062D6
address: '0x080062D6'
kind: function
status: probable
summary: Stops, frees the palettes of, and zero-fills the second screen-fade slot in eScreenFade.
interface: () -> void; r0/r1 clobbered by calls
details: Loads the eScreenFade base address, adds 0x20 to select the second of two 0x20-byte fade slots, then calls
  screenFade_StopAndFreePalettes_8006330, which stops the fade and frees its palettes at base+0x12 and base+0x13.
  It then zero-fills the whole 0x20-byte slot with ZeroFillByWord. It is the companion of sub_80062D0, which presumably
  does the same for the first slot at offset 0; the caller sub_80062EC just runs both back to back to fully reset
  the fade system.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r5, off_80063BC (=eScreenFade) with r0=0x20 selects the second 0x20-byte fade slot; bl screenFade_StopAndFreePalettes_8006330
    stops the fade and frees palettes base+0x12/base+0x13; bl ZeroFillByWord with r1=0x20 zeroes exactly one slot-sized
    block; caller sub_80062EC chains sub_80062D0 then this, implying slot 0 + slot 1 reset
  refs:
  - bn6f/asm/asm00_1.s:6832
  - 0x080062EC sub_80062EC
  - 0x080008E0 ZeroFillByWord
