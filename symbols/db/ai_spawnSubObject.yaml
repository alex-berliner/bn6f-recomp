name: ai_spawnSubObject
address: '0x080DFAD6'
kind: function
status: probable
summary: AI helper that spawns a type-0xD1 battle object linked to the parent and initializes fields based
  on the supplied id and a second variant parameter.
interface: (r0 = pattern/attack id from the AI version's table, r1 = random 0-2 roll, r2 = third param,
  r5 = parent battle object) -> r0 = new object pointer or 0 on failure; flags untouched until success
  path sets oObjectHeader_Flags |= 0x10 on the new object
details: 'The wrapper saves its three incoming args plus r5 on the stack, with r5 doubling as the fifth
  stack argument to object_spawnType3, and spawns object type 0xD1 with zero x/y/size args (the initializer
  presumably positions it relative to the parent). The spawn helper evidently returns the new object pointer
  in r5, which the wrapper moves to r0 before popping the saved args back into r1-r3/r5. On success it
  links the new object to the parent via oBattleObject_RelatedObject1Ptr, copies oBattleObject_AllianceAndDirectionFlip
  from the parent, clears oBattleObject_Element, writes the pattern id to +0x60, and writes a variant
  to +0x61: 0 if the id is 3, 1 if it is 4, otherwise the raw random roll. It also stores the third argument
  into oBattleObject_ExtraVars+4 and sets flag 0x10 in oObjectHeader_Flags. If the spawn fails (r0 ==
  0) it returns immediately without touching anything.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: push {r0-r2,r5} then bl object_spawnType3 with r0=0xD1, r1-r3=0 — parent pointer passed
    as fifth stack arg; asm: ''mov r0, r5'' after the bl implies object_spawnType3 returns the new object
    pointer in r5 (nonstandard), moved to r0 before pop {r1-r3,r5}; asm: str r5,[r0,#oBattleObject_RelatedObject1Ptr]
    + copying AllianceAndDirectionFlip ties the spawn to the acting enemy; asm: cmp r1,#3/#4 selecting
    0/1 for +0x61, else keeping r1 (the random roll), pattern id kept at +0x60; caller ai_randomAttackPick
    passes a pattern-table value and a random 0-2 roll, matching the two fields stored'
  refs:
  - bn6f/asm/asm31.s:85346
  - 0x08116510 ai_randomAttackPick
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080DFAD6
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The assembly confirms it saves r0-r2 and r5, spawns type 0xD1, links RelatedObject1Ptr, copies AllianceAndDirectionFlip,
    zeros Element, writes r1 to +0x60, then picks +0x61 based on r1 (0 if ==3, 1 if ==4, else r2). However,
    the spawn helper is object_spawnType3, not type 0xD1 — the 0xD1 is an argument, and the wrapper uses
    r5 as the fifth stack arg only after pushing r0-r2,r5 and then later popping r1-r3/r5; r5 is not the
    5th arg at spawn. Also ''r0=0 on failure'' matches the tst/beq, but the summary''s ''attack-pattern''
    framing is speculative — it''s a generic spawn helper. Name is fine; summary overstates specifics.;
    run wf investigate investigate-20261018-212108; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
