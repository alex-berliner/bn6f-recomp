name: sprite_tickAnimationWithEndEvent_80A77FC
address: '0x080A77FC'
kind: function
status: confirmed
summary: Ticks one sprite's animation, setting its event byte (sprite+8) to 8 when the current animation
  cycle reaches its final frame.
interface: void sub_80A77FC(u32 sprite /* r5 */); returns r2,r3,r4,r5 as left by sprite_update; flags
  nzcv clobbered
details: 'Wrapper around the two-step sprite animation update. It first calls sprite_getFrameParameters
  with the sprite work area in r5 and tests bit 7 (0x80) of the returned frame-parameter word; that bit
  marks that the animation has played through to its last frame. When it is set, the code stores the immediate
  value 8 as a byte at sprite+8, which appears to be an event/animation-finished slot in the sprite structure
  (8 presumably being the "animation ended" event code consumed elsewhere). It then calls sprite_update,
  which performs the sprite''s per-frame animation advance. Callers only consume r2, r3, r4 and r5 after
  the call (the values left by sprite_update) and ignore r0/r1 and the flags, so this function effectively
  passes sprite_update''s state through. No other fields are touched directly by this routine itself.

  '
