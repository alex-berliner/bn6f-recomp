name: battle_loadBeastOutFormParams
address: '0x080A5FD0'
kind: function
status: probable
summary: Loads one Beast Out form's byte parameters from the IWRAM table byte_2000EC0 into the transformation
  struct and copies three table words into the battle object during Beast Out initialization.
interface: (r5 = beast-out struct (index at +4), r6 = battle object) -> r0 = undefined; fills r5+0x24,
  r5+6, r5+7, r6+0x88/0x8C/0x90
details: Reads index r4 = byte [r5+4] (the Beast Out form/type) and fetches byte_2000EC0[0xA+r4] into
  r5+0x24 (stored as a word, likely a duration or counter), [0xE+r4] into r5+7, and [0x12+r4] into r5+6
  — three parallel per-form byte arrays. If the byte at 0xE+index is zero it stores 1 to byte [r5+0] and
  calls e_setFlagFromIndexTable, which resolves a flag ID using the caller's struct, so a form with that
  byte clear is treated as an activated/raised case. It then copies the three fixed words at byte_2000EC0+0xD4/0xD8/0xDC
  into r6+0x88/0x8C/0x90, three consecutive fields of the battle object (possibly pointers or stat/color
  words shared by all forms). No return value is produced. The table lives in IWRAM at 0x2000EC0, so its
  contents are populated at runtime, not from ROM.
