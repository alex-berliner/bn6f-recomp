    / bne skips the [r5]=1 store and bl e_setFlagFromIndexTable, so a zero byte triggers the flag path;
    fixed words at table +0xD4/0xD8/0xDC are copied to r6+0x88/0x8C/0x90 (three consecutive object fields);
