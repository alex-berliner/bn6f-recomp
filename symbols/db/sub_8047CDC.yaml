name: sub_8047CDC
address: '0x08047CDC'
kind: function
status: hypothesis
summary: Multiplies a passed value by 100 unless some global mode word equals 1, in which case the value is returned
  unchanged.
interface: u32 sub_8047CDC(u32 value /* r1 in, r1 out; all other registers preserved, flags clobbered */)
details: 'Reads a pointer from [r5 + 0x1C] (so r5 is a context/global struct whose 0x1C field points to a settings/mode
  record) and dereferences it once. If that first word equals 1, r1 is left untouched; otherwise r1 is multiplied
  by 100 (mov r2,#0x64; mul r1,r2). Only r1 is actually modified; the unusual push {r0,r2-r7,lr} exists to preserve
  everything else and keep the stack aligned, with r0 pushed purely for 8-byte stack alignment. r5 must be set up
  by the caller before entry. The meaning of the "== 1" mode is not identifiable from this function alone; a x100
  scale suggests money/zenny-style value inflation or a difficulty-based multiplier applied to a reward or stat.

  '
