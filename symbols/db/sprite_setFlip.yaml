name: sprite_setFlip
address: '0x08002F5C'
kind: function
previous_names: []
status: confirmed
summary: Set the sprite's flip bits (mask 0x30) in sprite bytes 0x13 and 0x16 from r0 (NPCs pass 1 when mirrored).
interface: (r0 = flip, r5 = object header) -> byte 0x13 bits 4-5 = r0 << 4, byte 0x16 bits 4-5 copied from it; r0
  = 0x30, r1 = byte 0x16, r2 = flip bits, r3 = sprite
