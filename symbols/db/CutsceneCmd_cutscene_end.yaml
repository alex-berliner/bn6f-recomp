name: CutsceneCmd_cutscene_end
address: '0x080378BE'
kind: function
status: confirmed
summary: Cutscene script command that terminates the running cutscene by signaling "stop" to the script engine.
interface: void CutsceneCmd_cutscene_end(void) -> returns r0 = 0, sets NZ flags from that zero
details: 'A no-op script command handler for the cutscene/script engine: it simply sets r0 to 0 and returns to the
  caller (the script interpreter dispatch loop). Because the engine interprets a zero/false return value as the
  command failing or the script being finished, execution of the current cutscene script halts here, effectively
  ending the cutscene. It touches no memory, structures, or other registers; the only side effect is the NZ flags
  being set from the zero result, which the callers'' expected contract includes. This is the script-command counterpart
  to an "end of script" marker in cutscene data.

  '
