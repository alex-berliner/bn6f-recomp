name: object_setupVariantSprite
address: '0x0811D7D0'
kind: function
status: probable
summary: Initializes a type-0x23 object's GUI sprite from its variant index (palette, priority, coordinates,
  flip), or flags it done if the variant has no sprite.
interface: (r0 = object state ptr? r5 = state block, r6 = flip flag; variant index at [r5+5], sub-variant
  at [r5+6]) -> r0 = 1 if skipped, else void; state fields 0x07/0x14/0x16/0x1A/0x1E written
details: Reads variant index [r5+5]; byte_811D884[variant]==0 means no sprite, so it sets state byte 7
  = 1 and returns. Otherwise calls initGuiSprite, writes type byte 0x23 to [r5], sets animation 0, loads
  animation data, disables shadow, sets palette bank 5, then palette = byte_811D88E[variant], priority
  2, and sub-record A = byte_811D889[variant]. Stores 0x1E0 into a sprite slot via slotList_storeHalfwordAndClearField.
  Coordinates come from byte_811D87C[variant] (halfword offsets -8,128 or 248,128) passed through sub_811DC00
  and stored to state +0x1A/+0x1E before sprite_setCoordinates; word at state +0x14 is off_811D874[[r5+6]]
  (0x700 or -0x700) and +0x16 is zeroed; sprite_setFlip is called with 0 or 1 depending on r6.
