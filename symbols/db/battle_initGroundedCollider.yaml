name: battle_initGroundedCollider
address: '0x080F7154'
kind: function
status: probable
summary: 'Resets a battle object to a grounded default state: zero height, shadow on, collision region
  1, and a blank status-UI entry.'
interface: (r5 = battle object pointer, passed implicitly by caller) -> r0 = 0; flags clobbered by calls
details: The function operates on the object in r5, which is set up by the callers rather than passed
  in r0-r3. It zeroes the halfword at oBattleObject_Z16 (the object's height/Z position), turns on the
  sprite's shadow via sprite_hasShadow, stores collision region 1 into the object's collision data via
  object_setCollisionRegion, and finally calls the status-list routine at 0x203EB50 with r0=0 and r1=0,
  claiming a slot with name ID 0 and HP 0. This combination (height 0, shadow, region 1, blank status
  entry) looks like standard setup for a ground-level obstacle or stage-side collider that should not
  show a meaningful name/HP in the status UI. Four nearby callers all use it, suggesting a shared init
  helper.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strh r0,[r5,#oBattleObject_Z16] with r0=0 clears the object's height field; bl sprite_hasShadow
    enables the object's shadow bit in its sprite state; mov r0,#1; bl object_setCollisionRegion sets
    collision region index 1; mov r0,#0; mov r1,#0; bl sub_801DC7C claims a status slot with name ID 0
    and HP 0; r5 is never set inside the function, so all four callers must place the object pointer in
    r5
