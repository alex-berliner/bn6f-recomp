name: npc_dialogBranchStep
address: '0x0812A3C8'
kind: function
status: probable
summary: 'Object/NPC step handler: on clear flag, calls sub_813D978, writes state fields (0x3C/4/5) into
  r5, and plays text script 0x24 of eTextScript201BA20 via the chatbox wrapper; on set flag, calls sub_803CB18
  with r0=0x10 and only on nonzero return writes 0x1C to r5+0xC and 8 to r5+0x28.'
interface: () -> void; uses r5 as object/work struct base, no return value
details: First tests byte offset 5 of the IWRAM struct at 0x200BC50 via the known flag-test helper. If
  the flag is clear, it stores 0x3C into r5+1, 4 into r5+2 and 5 into r5+0x10, then invokes the chatbox
  wrapper to run script index 0x24 of eTextScript201BA20 — a dialog/notice — and returns. If the flag
  is set, it calls sub_803CB18 with r0=0x10 (plausibly a sound or action request); only if that returns
  nonzero does it store 0x1C into r5+0xC and 8 into halfword r5+0x28, advancing the object's state. The
  r5 offsets look like the usual step/state/timer fields of an object work struct, so this is one state
  of a step-machine handler. Which NPC or scenario owns the struct is unknown since no callers are mapped.
