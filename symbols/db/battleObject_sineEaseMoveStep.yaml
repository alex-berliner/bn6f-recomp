name: battleObject_sineEaseMoveStep
address: '0x080A6B10'
kind: function
status: probable
summary: Runs one step of a sine-eased movement of a battle object from its current position toward a
  target position over a fixed number of frames, returning 1 when finished.
interface: (r5 = movement-work struct, r4 = state byte offset, r7 = progress counter halfword offset)
  -> r0 = 0 while moving, 1 when move completed
details: On the first call (state byte [r5,r4]==0) it sets the state, fetches an object via battleObject_getFromListPair_80A6E78,
  reads halfword x/y/z at +2/+4/+6 into 0x18/0x1C/0x20 as the target, halfword +8 as duration, computes
  a 16.16 fixed-point step 0x10000/duration with SWI 6 Div (initial counter [r5,r7] = 0x4000 - remainder)
  and copies the current position 0xC/0x10/0x14 into start fields 0x2C/0x30/0x34. Each later call subtracts
  the step from the counter and, while it stays positive, looks up math_sinTable at index (64 - counter>>8)
  and adds sine-weighted (target-start) deltas to the current position. When the counter reaches 0 it
  snaps the current position to the target, clears the state byte and counter, calls sub_80A6E70 with
  r0=10 (likely a completion/event code), and returns 1. The struct is a movement-controller block distinct
  from the object itself; positions are stored as value<<16 fixed point.
