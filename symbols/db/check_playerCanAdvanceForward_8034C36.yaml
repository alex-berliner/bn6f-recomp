name: check_playerCanAdvanceForward_8034C36
address: '0x08034C36'
kind: function
status: confirmed
summary: Gate check that returns true when the player is allowed to auto-advance one tile forward on the overworld
  (no fade, no advance/sliprun event, no busy subsystem, no chatbox mask 0x80, no cutscene).
interface: bool sub_8034C36(void); // r0 out = 1 allowed, 0 blocked; NZ flags from final MOV r0
details: 'Calls in order: IsScreenFadeActive (skip -> false), TestEventFlagFromImmediate with

  EVENT_1717_PLAYER_ADVANCE_FORWARD (set -> false), TestEventFlagFromImmediate with

  EVENT_IN_SLIPRUN_STATE (set -> false), sub_809E462 (nonzero -> false),

  chatbox_mask_eFlags2009F38 with bit 0x80 (nonzero -> false), IsCutsceneScriptNonNull

  (non-null -> false). If every check passes, returns 1; otherwise 0. Globally named

  event flag "EVENT_1717_PLAYER_ADVANCE_FORWARD" (group 0x17, bit 0x17) is the explicit

  "advance one tile forward" trigger; the sliprun flag (group 0x17, bit 0x3D) gates

  against dashing through the same logic.

  '
