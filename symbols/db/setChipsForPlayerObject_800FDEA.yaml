name: setChipsForPlayerObject_800FDEA
address: '0x0800FDEA'
kind: function
status: confirmed
summary: Records how many chips a battle object holds from its alliance's hand and the first chip's ID onto the
  battle object.
interface: void setChipsFromAllianceHand_800FDEA(BattleObject* obj /*r5*/) — also passes r4/lr as scratch inputs;
  leaves r1 = address of the 0xFFFF terminator entry, r2 = r3 = 0xFFFF in the output registers, preserves r4/r5,
  clobbers nzcv flags.
details: 'Reads the object''s alliance (oBattleObject_Alliance) and fetches that

  alliance''s battle-hand buffer via getBattleHandAddr_8010018. The hand

  buffer is laid out as a count byte followed by halfword chip entries:

  hand[0] is the number of entries belonging to the previous/alliance-lead

  section, so this object''s section starts at hand + 2 + 2*hand[0].

  Counts the halfword entries from there until the 0xFFFF terminator, then

  stores the count into oBattleObject_ChipsHeld (byte) and the first

  entry''s chip ID into oBattleObject_Chip (halfword; 0xFFFF if the section

  is empty). The register side effects (r1 terminator pointer, r2/r3 =

  0xFFFF) look incidental but the lifter reports every caller relying on

  them, so they are documented.

  '
