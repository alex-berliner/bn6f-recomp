name: oAIAttackVars_SubStepIndex
address: '0xe'
kind: struct-field
status: probable
summary: Current step/phase index within a multi-stage attack sequence (incremented each StepTimer wraparound,
  bounded by a sibling counter, also used as animation/variant selector).
details: The field is overwhelmingly treated as a counter that is incremented (or decremented) each main
  loop iteration and compared against a threshold (3 at asm31.s:112187, 5 at asm31.s:154135, TimerOrCycles
  at asm31.s:145581, Unk_0f at asm32.s:9328). It is also used as an index multiplied by 2/4 to fetch animation
  frames, sprite-flip entries, and timer-table values, and its consistent initialization immediately after
  oAIAttackVars_TimerOrCycles from the same per-attack data tables (e.g., asm31.s:129418, 142032, 149751,
  156334) shows it encodes the per-attack step configuration. At asm32.s:2634 it serves as the high-nibble
  variant index combined with an RNG-derived low nibble.
