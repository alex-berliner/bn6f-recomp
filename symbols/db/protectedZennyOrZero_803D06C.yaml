name: protectedZennyOrZero_803D06C
address: '0x0803D06C'
kind: function
status: confirmed
summary: Returns the player's protected (encrypted) zenny amount via the toolkit → game-state chain, or
  0 if the encryption check fails.
interface: u32 protectedZennyOrZero(u32 zenny /* r0 */, u32 arg1 /* r1 */, toolkit_t *toolkit /* r10 */)
  -> r0; clobbers r1, lr; flags nz|c|v set by the encryption helper
details: "Pushes lr, calls encryption_zenny_8006f78(zenny, arg1) and branches on its result:\nif non-zero\
  \ (BNE), the encryption check failed and the function returns 0.\nOn success it dereferences toolkit->gameState\
  \ (R10 -> oToolkit_GameStatePtr),\nloads that game's oGameState_ProtectedZenny field, and returns it.\n\
  The returned pointer chain (toolkit -> gameState -> protectedZenny) matches the\nstandard BN engine\
  \ layout: the \"protected\" zenny is the encrypted/saved amount\nused to validate that on-battle spends\
  \ cannot exceed the stored value.\nQuirks:\n- R1 is overwritten with the game-state pointer on the success\
  \ path before being\n  used as the base of the second LDR, matching the original MOV/LDR sequence.\n\
  - R2-R7 are preserved across the call (push/pop only lr); R1 and the flags are\n  clobbered by the encryption\
  \ helper.\n- The encryption helper's semantics are not visible in this file, so the exact\n  meaning\
  \ of arg1 (R1) and the failure condition (BNE on non-zero result) is\n  inferred from the call site.\n"
