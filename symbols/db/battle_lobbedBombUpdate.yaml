name: battle_lobbedBombUpdate
address: '0x080D5DF4'
kind: function
status: probable
summary: 'State handler for a lobbed bomb battle object: arcs toward a target panel under gravity, marks
  the landing panel, and explodes there.'
interface: (r5 = battle object pointer) -> r0 = 0 or CUR_STATE_DESTROY stored to oBattleObject_CurStateActionPhaseAndPhaseInitialized;
  uses Timer/Timer2
details: On phase 0 it switches to phase 4, converts the object's FuturePanelX/Y to screen coordinates
  and calls math_getThrowSpeeds (with r4=0x2D and gravity constant 0xFFFFC000) to fill X/Y/ZVelocity,
  then sets Timer=0x2D frames of flight. During flight it applies the velocities each frame, adds -0x400
  to ZVelocity (gravity), calls object_setPanelsFromCoordinates to keep PanelX/Y in sync, and blinks object_highlightPanel
  on the target panel every 8 Timer2 frames (Timer>>3 bit0). When Timer runs out it reads the landing
  panel's status flags via object_getPanelParameters and tests them against a per-alliance word mask from
  byte_80D5EA0 (0x15800010 / 0x2A800010 — panels the bomb can detonate on). If the mask matches it plays
  SOUND_HIT_BOMB_1, copies the velocity triple as effect params into spawn_t1_0x0_EffectObject, calls
  sub_80D5EDE, and always transitions to CUR_STATE_DESTROY.
