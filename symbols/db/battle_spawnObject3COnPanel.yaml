name: battle_spawnObject3COnPanel
address: '0x080CB8DE'
kind: function
status: probable
summary: Spawns battle object kind 0x3C via object_spawnType3 and fills in its panel position, element,
  damage field, and the source object's alliance/direction.
interface: (r0 = panel X / 5th spawn arg, r1 = panel Y, r2 = element, r5 = source object whose AllianceAndDirectionFlip
  is copied, r6 = value for DamageAndStaminaDamageCounterDisabler) -> r0 = new battle object or 0; flags
  set by null check on r5 after spawn.
details: The routine saves the caller's r0-r2 plus r5, then calls object_spawnType3 with r0 = 0x3C (a
  fixed object kind) and the caller's r1-r3 plus the original r0 as the stack argument. On success (spawn
  leaves the new object pointer in r5, moved to r0 and null-checked), it stores the original r0/r1 into
  oBattleObject_PanelX/PanelY, r2 into oBattleObject_Element, r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler,
  and halfword-copies oBattleObject_AllianceAndDirectionFlip from the object pointer the caller had in
  r5. It returns the new object pointer, or leaves the spawn failure value if the spawn failed. So it
  is a specialized one-kind object spawner parameterized by placement and damage rather than a generic
  spawn helper.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_spawnType3 with r0 = 0x3C hard-coded as the object kind (sub_80CB8DE); strb r1/r2
    to oBattleObject_PanelX/PanelY and strb r3 to oBattleObject_Element right after the null check; str
    r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler and ldrh/strh copy of oBattleObject_AllianceAndDirectionFlip
    from the r5 source object; mov r0, r5 immediately after the spawn call, then beq locret — spawn returns
    the object in r5 and the branch handles failure; all three known callers (0x080ECB28, 0x081025DA,
    0x0810C4B4) are battle-code routines, and the sole callee is the documented type-3 spawn
