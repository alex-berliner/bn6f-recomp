name: get_areAllKeyIconsEarned
address: '0x08096B00'
kind: function
status: probable
summary: Masks the earned title-screen icon bitmask with 0xF6 and stores 1 at [r5+4] if all five of those
  icons are earned, else 0; always returns 0 in r0.
interface: (no args; r5 = ptr to result struct, set by caller) -> r0 = 0; [r5+4] = 1 if (earnedIconMask
  & 0xF6) == 0xF6 else 0
details: Calls GetTitleScreenIconCount, whose bitmask of earned title-screen icons lands in r1 (the count
  in r0 is immediately overwritten by the 0xF6 pool literal). It masks the earned bitmask with 0xF6 (bits
  1,2,3,4,7) and compares against 0xF6, so the branch-taken case is 'all five of those icons are earned'
  — icons outside the mask don't matter. The boolean (1 on success, 0 otherwise) is stored as a byte at
  offset 4 of the struct in r5, which the caller must have set up since this fragment never initializes
  r5. Always returns 0 in r0. Note r4-r7 are pushed but only r4 is really used; the comparison intentionally
  ignores icons 0, 5 and 6.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl GetTitleScreenIconCount — callee is documented as returning earned-icon count plus bitmask;
    ldr r0, =0xf6 / and r1, r0 — clobbers the count and reduces the bitmask to icons 1,2,3,4,7; cmp r0,
    r1 / bne — equality with 0xF6 means every icon in the mask is earned; strb r4, [r5, #4] — result written
    as a byte flag into a caller-provided struct, offset 4; mov r0, #0 before pop — fixed 0 return value;
    the flag at [r5+4] is the real output'
  refs:
  - bn6f/asm/dat27.s:3127
  - 0x08000EE4 GetTitleScreenIconCount
  reproduce: python3 tools/asmcat.py 0x08096B00
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Behavior is correct: it ANDs the earned-icon bitmask (r1) with 0xF6, compares against 0xF6, and
    stores 1 or 0 at [r5+4] via strb, returning 0 in r0. However, the proposed name uses prefix ''title''
    which is not in the allowed prefix list; ''get'' is the appropriate fit. The proposal''s r5 caveat
    (''caller must have set up'') is reasonable since the code never initializes r5, but worth noting
    that r5 is caller-saved and its incoming value is undefined from this fragment alone.; run wf investigate
    investigate-20261019-045129; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
