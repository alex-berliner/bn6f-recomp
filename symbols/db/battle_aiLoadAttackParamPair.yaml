name: battle_aiLoadAttackParamPair
address: '0x080FFAF8'
kind: function
status: probable
summary: Loads a packed attack parameter word (low byte and bits 16-23 from two per-AI-version tables)
  into [battleObject->AIDataPtr + oAIAttackVars_Damage] for the attack id passed in r0.
interface: (r0 = attack/table index) -> r0 = packed value stored; writes word to [battleObject->AIDataPtr+0xA0]
  (oAIAttackVars_Damage)
details: Takes an index in r0, multiplies it by 8, and reads a table entry from byte_80FFB54 via battle_aiGetVersionedTableEntry_800FE12
  (which selects among per-AI-version copies of the table, r2=8 as the entry stride/scale). It then repeats
  the same indexed read from a second table byte_80FFB6C, shifts that byte left by 16, and ORs it with
  the first result. The packed word — first byte in bits 0-7, second byte in bits 16-23 — is stored to
  [r5->AIDataPtr + 0xA0] (oAIAttackVars_Damage), so the upper byte lands in the halfword at +0xA2, a second
  AI attack variable. This supplies the damage (and likely a second parameter such as element/effect)
  for the attack branch the caller selected via RNG rolls.
