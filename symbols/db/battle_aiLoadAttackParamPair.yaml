  date: '2026-10-18'
  detail: 'asm: two mul-by-8 indexed reads from byte_80FFB54 and byte_80FFB6C through battle_aiGetVersionedTableEntry_800FE12;
    asm: ''lsl r0, #0x10 / orr r6'' packs the second byte into the upper halfword of the result; asm:
    ''str r6, [r3,#oAIAttackVars_Damage]'' with r3 = [r5,#oBattleObject_AIDataPtr]+0xA0 stores into AI
    attack vars; caller sub_80FF904 (JudgeMan AI step) gates an attack branch with GetPositiveSignedRNG
    & 0xF < 0xE before calling this; callee summary confirms AI-version-indexed table reads with a multiplier-scaled
    entry for AI version 4'
