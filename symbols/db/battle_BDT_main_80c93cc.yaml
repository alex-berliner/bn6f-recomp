name: battle_BDT_main_80c93cc
address: '0x080C93CC'
kind: function
status: confirmed
summary: Drives the "battle BDT" object's per-frame state machine (init/update/destroy) and refreshes its sprites
  via object_updateSprite.
interface: void battle_BDT_runState_80c93cc(u32 r5 /* battle object */); clobbers r0-r4,r6,r7,lr,nzcv; preserves
  nothing
details: 'One-line state dispatcher kept on the battle object. Reads u8 oBattleObject_CurState

  from the object in r5, indexes the 3-entry handler table at off_80C93E4

  (init battle_BDT_init_80c940c+1 / update battle_BDT_update_80c94bc+1 / destroy

  battle_BDT_destroy_80c93f0+1, each stored +1 for Thumb), and tail-calls the

  chosen handler with the standard ARM-Thumb trampoline "mov lr,pc; bx r1",

  passing the state byte in r0 and r1 still holding the handler address from

  the table. After the handler returns, calls object_updateSprite(object)

  (object pointer retained in r5) to advance the object''s OAM/sprite frames.

  Quirks: Thumb-handler tail call via +1 in the table; only 3 states, so

  BattleObject_CurState must be <3; tail-call-style cleanup with "bl then

  pop {pc}" effectively makes the update path return directly into object_updateSprite

  and then to the caller.

  '
