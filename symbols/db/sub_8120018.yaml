name: sub_8120018
address: '0x08120018'
kind: function
status: confirmed
summary: Wraps a mode-dispatched battle handler with two-pass lock/unlock of a field array across all battle objects,
  so the handler can safely read or toggle per-object state without races.
interface: battle_fieldLockDispatch_8120018(r0=base, r1=count, r2=fieldIndex, r3=mode) → nz, r2, r3, r4, r6, r7;
  clobbers r0, r1, r5, r8-r12, lr
details: 'Iterates count rows of a 0x20-byte-stride battle-object array, targeting the u32 field at byte offset
  fieldIndex*4 within each row. Two modes are supported (r3=0 and r3=4; other values would index off the 2-entry
  jump table at 0x081200E0): Mode 0 (sentinel-lock): Pass 1 stamps any entry whose lower 16 bits are zero with the
  sentinel 0x7FFFFFFF, marking it "inert" so the handler can skip it. Pass 2 clears any entry still holding the
  sentinel back to zero (entries the handler modified are left alone). Mode 4 (bit-invert-lock): Pass 1 bitwise-inverts
  the lower 16 bits of every entry (upper 16 preserved), acting as a lock flag. Pass 2 inverts again, restoring
  the original lower half if the handler did not alter it; writes the result back. Between the two passes a GUEST_CALL
  is made to an IWRAM handler selected by mode from a 2-entry jump table: mode 0 → 0x030069A9, mode 4 → 0x03006A5F.
  These handlers operate on the same base/count/field/mode arguments. Output registers: r2 retains the byte offset
  (fieldIndex<<2); r3 holds the last value read/written in pass 2; r4 is handler-passthrough (mode 0) or last upper-16
  (mode 4); r6 is the row byte offset of the final iteration; r7 is the negative loop counter sentinel; flags reflect
  r7 (negative → C set, zero → Z set).

  '
