name: battle_updateTimedEffectObject
address: '0x080DE924'
kind: function
status: probable
summary: 'Per-frame update for a short-lived battle effect object: advances an animation counter (4 or
  6 frames), destroys itself when a helper reports done, and keeps its panel position in sync.'
interface: (r5 = battle object) -> void; destroys via oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_DESTROY
details: 'Runs on the object in r5 (BN6 battle-object convention: no register args). It increments the
  counter at oBattleObject_ExtraVars+8, wrapping at 4 if oBattleObject_Param2 is 0, else at 6 — so Param2
  selects one of two animation lengths. After stepping the counter it calls sub_80DE984; a zero return
  means the object''s life/animation is over, so it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and calls object_clearCollisionRegion to drop it out of collision. If ExtraVars+8 was 1 on entry it
  first calls sub_80DE9E4, likely a one-shot setup on the second frame. Finally it always refreshes PanelX/PanelY
  from world position (object_setPanelsFromCoordinates) and syncs collision panels/facing (object_updateCollisionPanels),
  typical of a moving or drifting effect entity.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: cmp r0,#1 / bl sub_80DE9E4 — one-shot call when counter reaches its first frame; mov r1,#4 /
    mov r1,#6 chosen by oBattleObject_Param2 — two animation lengths; cmp r0,#0 after bl sub_80DE984 ->
    writes CUR_STATE_DESTROY and calls object_clearCollisionRegion — self-destruct path; always calls
    object_setPanelsFromCoordinates then object_updateCollisionPanels — keeps a live object's panel/collision
    state current each frame; callee summaries (object_clearCollisionRegion, object_updateCollisionPanels)
    match per-frame battle-object upkeep
