name: isSameSubsystem_800A732
address: '0x0800A732'
kind: function
status: confirmed
summary: Reports whether the currently loaded subsystem counts as "the same" one, returning true when either nothing
  is in use or the shared subsystem state byte at eStruct203F7D8+1 still has bit 1 set.
interface: 'bool isSameSubsystem_800A732(void) /* returns via Z flag: Z clear = same; clobbers r0-r3, lr; preserves
  r4 */'
details: 'Calls IsCurSubsystemInUse to ask whether any subsystem is currently loaded. If none is in use (r0 == 0),
  the answer is TRUE. If one is in use, it reads the state byte at eStruct203F7D8+1 and tests bit 1 (mask 0x2):
  the answer is TRUE while that bit is set, and FALSE once it is cleared. The result is returned both in r0 and
  through the Z flag (tst r0, r0), so callers branch on equality/nonzero. Note the "mov r0, r4" epilogue is really
  "adds r0, r4, #0", so C and V end up cleared and N/Z come from the result. This is a predicate over the global
  eStruct203F7D8 subsystem bookkeeping (field +1 is a state/usage bitmask); presumably used to decide whether a
  transition stays within the same subsystem (e.g. skipping a reload or screen wipe) versus entering a different
  one.

  '
