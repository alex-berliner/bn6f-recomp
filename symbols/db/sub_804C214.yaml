name: sub_804C214
address: '0x0804C214'
kind: function
status: confirmed
summary: Ticks a per-object action/anim timer; on expiry advances toolkit state counters and may trigger a state-4
  transition
interface: void sub_804C214(void /* r5=battle obj?, r10=toolkit */); clobbers r0, N Z C V; preserves r4
details: "Reads/writes byte at [R5+0x18] (a countdown timer). Decrements it; if it\ndidn't reach zero, returns.\
  \ When it reaches zero, reloads that byte to 2,\nthen accesses the toolkit struct pointed to by [R10+oToolkit_Unk2009740_Ptr]:\n\
  \  - byte at offset 2 is an index/counter that wraps at 0x10; once it would\n    exceed 0x10 the function instead\
  \ writes 4 to byte at offset 0\n    (presumably a final/transition state)\n  - byte at offset 3 is a separate\
  \ countdown whose low byte is also\n    decremented once per wrap (only when non-zero, and only via the idx<0x10\n\
  \    branch; the saturating branch skips it)\nr5 and r10 are caller's object/toolkit pointers; the function stores\
  \ only\nr4 (already holding r10) across the toolkit access. Flag-use is limited to\nthe decrement and a single\
  \ cmp against 0x10.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
