details: "Pushes {lr}; loads a u8 field at [r5,#7] (the \"active chip entry index/type byte\"), calls\n\
  getLocOfActiveChips_8027E1C(r0=that-byte) which returns a pointer to an active-chip slot\ndescriptor.\
  \ The first byte (r1=[r0]) is then dispatched:\n  0 -> getChipID_802A54E(ldrh r0,[r0,#8]) then battleObject_loadChipPanelGfx_80284E2\n\
  \      (normal chip-use panel gfx load path)\n  1 -> beastout_QueuePaletteGFXAndSheets_80286D4 (Beast-Out\
  \ variant)\n  2 -> sub_802871C\n  4,5 -> sub_80287A4\n  6,7 -> ldrh r0,[r0,#8]; sub_80285FE\n  3 ->\
  \ sub_8028754\n  8,9 -> sub_802877C\n  fallthrough -> ret\nCaller chain shows it is invoked during custom-screen\
  \ (chip-select) lifecycle from\nbattle_initCustomScreen_8026840, custMenuSomeHandler_8028B74, customScreen_ExitAction_8029032\n\
  and other sub_8027xxx handlers, so the \"active chip entry\" is the slot picked in the\ncustom-screen\
  \ UI.\n"
