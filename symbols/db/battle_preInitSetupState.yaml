open_questions:
- Which structure r5 points to (its fields +0x01/+0x10/+0x13 are only known by offset, not meaning)
- What the table at the (0x10,0x30) argument pair represents — callers of sub_803C0BE/sub_803C132 or the
  table's address would identify it
- What gameplay condition sets eFlags2009F38 bit 0x80 (skip-vs-repeat semantics unknown)
- No callers known, so the trigger point in the game flow is unconfirmed
