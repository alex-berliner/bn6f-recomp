name: battle_preInitSetupState
address: '0x080498AA'
kind: function
status: probable
summary: Before initializing the battle module, resets/normalizes a 2-byte-strided table and stores its
  entry count plus two mode bytes into a global state struct, unless cutscene flag bit 0x80 marks it as
  already done.
interface: () -> void; r5 = pointer to a global battle-state struct (byte fields at +0x01, +0x10, +0x13);
  reads eFlags2009F38 bit 0x80; clobbers r0-r1
details: On entry r0 is unused (immediately overwritten), so the function takes no arguments and works
  through the global r5. It first tests bit 0x80 of the chatbox/cutscene flag word eFlags2009F38 via chatbox_mask_eFlags2009F38;
  if that bit is set it skips straight to battle_moduleInit_803A820. Otherwise it clears byte r5+0x13,
  calls sub_803C0BE(0x10, 0x30) to normalize the halfword table (rewriting trailing 0x00/0xE5 slots into
  0xE5 0xE5 terminator pairs), then sub_803C132(0x10, 0x30) to count live entries up to the 0xE5/0xE6
  marker, storing that count as a byte at r5+0x10. It then writes 0xC to byte r5+0x01, apparently a mode/phase
  selector, and finally calls battle_moduleInit_803A820 unconditionally before returning. The flag-bit
  guard suggests this one-time setup is skipped on repeats (e.g., re-entered battles or cutscene-controlled
  boots).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: chatbox_mask_eFlags2009F38 with r0=0x80 and 'bne loc_80498CE' gates the setup block on flag
