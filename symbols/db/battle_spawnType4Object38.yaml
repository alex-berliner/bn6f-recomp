name: battle_spawnType4Object38
address: '0x080E47A4'
kind: function
status: probable
summary: Thin battle helper that spawns the type-4 battle object/effect with ID 0x38, forwarding the caller's
  remaining spawn arguments.
interface: (r0 = ignored, overwritten with 0x38; r1-r3 = forwarded spawn parameters) -> r0 = result of
  object_spawnType4 (spawned object or status); flags from callee
details: The routine only pushes lr/r5 for alignment, loads 0x38 into r0, and tail-calls object_spawnType4,
  which spawns a battle object of type 4 from five caller-supplied parameters and runs its initializer
  immediately. Since only r0 is set here, r1-r3 (and whatever else the wrapper expects) must already hold
  the position/parent/etc. parameters set up by the caller. The trailing 'mov r7, r5' / pop sequence is
  dead code — r7 is clobbered with a saved-but-unused r5 and never read, suggesting compiler residue.
  The constant 0x38 is the object/effect ID passed to the type-4 spawner; given the explosion caller,
  it is likely a blast-adjacent effect, but its exact identity is not shown here.
