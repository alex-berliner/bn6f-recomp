name: beastout_QueuePaletteGFXAndSheets_80286D4
address: '0x080286D4'
kind: function
status: confirmed
summary: 'Beast-Out selection helper: calls sub_80287D2, then queues two GFX DMA tiles (map+tileset) chosen by the
  state''s alliance byte, then loads selection-screen sprite sheets.'
interface: 'void sub_80286D4(void); // in: r5 = state pointer; out: r1..r7, lr clobbered; r4-r7 preserved; NZCV
  clobbered.'
details: 'Pushes lr; calls sub_80287D2 with no args. Reads byte at r5+8 (alliance flag). If

  non-zero selects the "blue/aligned" palette index (r1=4), else index 0. Uses the

  index to pick a source dword from off_8028708 (two entries pointing to dword_8722AF4

  / dword_87225B4) and queues an 8-word aligned DMA to OBJ VRAM at 0x6009560, size

  0x540. Then picks a second source from off_8028714 (entries dword_8725874 /

  dword_87257F4) and queues a second DMA to unk_3001AA0 (an OBJ-tile destination

  buffer), size 0x20. Finally calls beastout_LoadSelectionScreenSpriteSheets_802869E

  and returns. The two off-table pairs are (map_gfx, tileset_pal) variants for the

  two team alignments used by the Beast-Out screen.

  '
