- What the values 0x23 vs 1 at [r5+0x00] select (actor id, text id, or palette)
- Which specific event flag bit 0x80 of eFlags2009F38 represents
- 'The summary''s claim that [r5,#0xc] is compared against [r5,#0xd] ''previous animation'' on the same
  struct is wrong: both bytes are in r5 and [r5,#0xd] is freshly written by the sub_8118B48 boolean (strb
