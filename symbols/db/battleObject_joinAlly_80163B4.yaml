open_questions:
- Exact meaning of oBattleObject_CurPhaseAndPhaseInitialized = 8 (is the 8 the initialized marker, or
  a phase id, or a combined pack? See sibling write of raw 4 into oBattleObject_CurPhase in the sound
  path).
- What list_tryAddUniqueEntry_800AA1A / sub_800AA06 / oBattleState_Unk_0d / battle_getStateUnk5c_800139A
  actually represent (battle-side telegraph counter? player-side roster?).
- The combination "set flag bit1 / clear flag bit1 across calls" suggests the bit is a per-frame "candidate
  for ally-join" latch whose persistence spans updates; identity of bit 1 in oObjectHeader_Flags still
  unconfirmed.
