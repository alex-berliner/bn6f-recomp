name: battleObject_joinAlly_80163B4
address: '0x080163B4'
kind: function
status: confirmed
summary: 'Phase-update step for a battle object that joins the player''s side: flag it as friendly, set
  its init state, or play the ally-join sound and transition to phase 4.'
interface: 'void sub_80163B4(void /* r5=obj, r10=toolkit */); clobbers r0,r1,r2,r3,lr and NZCV; preserves
  r4-r7,r5,r10. Returns: r0 = phase status / last ST value, r1 = 2.'
details: "Operates on the battle object passed in r5 (using oBattleObject_* layout) and the\nbattle toolkit\
  \ passed in r10 (using oToolkit_BattleStatePtr).\n\nFirst entry (oBattleObject_PhaseInitialized == 0):\n\
  \  * If the object's alliance XOR with battleState->oBattleState_Unk_0d (the\n    opposing-side byte)\
  \ is 0 (i.e. same alliance as the player):\n      - Sets bit 1 of oObjectHeader_Flags (the \"is ally\
  \ / flagged\" bit).\n      - Writes 8 into oBattleObject_CurPhaseAndPhaseInitialized\n        (phase=8/PhaseInitialized\
  \ set together).\n      - Returns; r1 left at 2 (preloaded for the ORR).\n  * If the alliance differs,\
  \ calls list_tryAddUniqueEntry_800AA1A with arg 0,\n    writes 4 into oBattleObject_PhaseInitialized,\
  \ and falls through to the\n    common exit (clears bit 1 of oObjectHeader_Flags).\n\nSubsequent entry\
  \ (oBattleObject_PhaseInitialized != 0):\n  * Calls battle_getStateUnk5c_800139A; if bit 0 set AND sub_800AA06(0)\
  \ returns\n    nonzero: plays sound 0x94 (the ally-join SFX), writes Timer=2, Timer2=0x10,\n    calls\
  \ sprite_setAlpha_8002c7a(0) (alpha = 0, fade out), writes\n    CurPhase = 4, and returns leaving r1\
  \ = whatever sprite_setAlpha left\n    in r1 (=2 by previous MOV).\n  * Else falls through to the common\
  \ exit.\n\nCommon exit: clears bit 1 of oObjectHeader_Flags via BIC r0, #2 (r1 preloaded\nwith 2 so\
  \ r1=2 on every exit path).\n"
