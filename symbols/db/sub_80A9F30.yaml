kind: function
status: probable
summary: 'Per-frame update for the log-out effect object: on a flagged animation frame it advances the object''s
  state to 8, then updates the sprite.'
interface: (r0 = object ptr? sprite args for frame params) -> void; sets [r5,#8]=8 when frame attribute bit 0x80
  set
details: 'Calls sprite_getFrameParameters and tests the returned attribute byte against 0x80; when that bit is set,
  stores 8 into byte 8 of the object at r5, which other object code treats as a state field (ow_startLogoutEffect
  sets state and advances a state machine). Then calls sprite_update to animate the object''s sprite. It is thus
  an animation-driven state machine step: the 0x80 attribute flag on a frame marks the point where the effect switches
  state. r5/r8 hold the object pointer across the calls. Only used by the log-out effect (sprite 0x1C) so far.'
