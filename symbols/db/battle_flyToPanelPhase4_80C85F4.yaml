name: battle_flyToPanelPhase4_80C85F4
address: '0x080C85F4'
kind: function
status: confirmed
summary: Per-frame update for a battle object's phase-4 leap-to-panel arc; on launch sets X/Z velocity
  from facing, then integrates position until it lands, cracking a breakable panel or destroying itself.
interface: void battle_flyToPanelPhase4_80C85F4(u32 r5 /* battle object ptr */); /* r5 preserved, r6 preserved,
  others clobbered */
details: 'Runs once per frame on a battle object currently in a ''leap'' state. First tick (CurPhase==0):
  writes CurPhase=4, queries the object''s front-facing direction via object_getFrontDirection, multiplies
  it by 4<<16 to form a fixed-point XVelocity. Computes flight duration as (0x28<<17 - 0x18<<16)/(4<<16)
  ≈ 14 frames via BIOS SVC 6 (signed divide), stores it in Timer (u16). ZVelocity is (0x10<<16)/Timer,
  giving a fixed per-frame height gain for the parabolic arc. Subsequent ticks: X += XVelocity, Z -= ZVelocity
  (descending), calls object_setPanelsFromCoordinates to update which grid panel the object overlaps,
  decrements Timer. When Timer hits zero: fetches PanelX/PanelY, calls object_getPanelParameters; if the
  returned flags contain 0x10 (breakable/cracked panel) the object switches to CurAction=4 and resets
  CurPhaseAndPhaseInitialized to 0 (to run the panel-cracking action); otherwise the entire state word
  is overwritten with CUR_STATE_DESTROY, removing the object. Uses a combined read-modify-write on CurStateActionPhaseAndPhaseInitialized
  for the destroy path. Quirks: Z velocity is subtracted (positive ZVelocity means falling), XVelocity
  is scaled by direction index so left-facing enemies fly left and right-facing ones fly right.'
