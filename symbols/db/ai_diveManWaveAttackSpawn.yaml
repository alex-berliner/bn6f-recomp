name: ai_diveManWaveAttackSpawn
address: '0x080FE6C8'
kind: function
status: probable
summary: 'AI attack routine: scans rows 1-3 on the target side and spawns a DiveMan wave object on each
  panel that matches the attack''s panel filters.'
interface: (r5 = attacker battle object, r7 = oAIAttackVars struct) -> r0 = number of waves spawned; flags
  from final cmp/tst
details: Loops r4 = 1..3 (three columns/rows relative to the foe's side). For each, object_getClosestPanelMatchingRowFiltered
  finds the closest valid panel using a per-alliance table (byte_80FE780 + alliance*8, giving a row-range
  pair), then object_checkPanelParameters re-verifies that panel against a second per-alliance table (byte_80FE794).
  On success it calls spawnDivemanWaveObject_80CB1E2 with the found coordinates in r0/r1, the panel coordinates,
  and the attack's init flag, AI difficulty tier, and damage read from the oAIAttackVars struct (oAIAttackVars_InitFlag,
  _AiDifficultyTier, _Damage). The mov r2,#1/#6 branch on alliance is dead code since r2 is reloaded immediately
  afterward. Returns the spawn count accumulated on the stack.
