name: ai_attackFrontSwingStep
address: '0x080F4E44'
kind: function
status: probable
summary: 'Per-step AI attack handler: first step telegraphs (sound 0x158, anim 0x10, 12-frame counter),
  spawns a front-panel collision region (damage from oAIAttackVars_Damage, params 0x700FF04/3/InitFlag)
  and an effect object; subsequent steps decrement StepTimer, and on expiry set HitElement to 0x18 when
  difficulty tier is zero or 0x10 when nonzero.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = clobbered; sets AttackElement, StepTimer,
  HitElement, spawns collision region and effect object
details: 'On the initial step (AttackElement == 0) it marks the attack as started by writing element 4
  into oAIAttackVars_AttackElement, plays sound 0x58, sets the object''s animation to 0x10 and a 12-frame
  counter, and stores 12 in oAIAttackVars_StepTimer. It then calls object_spawnCollisionRegion at the
  panel directly in front of the object (PanelX + object_getFrontDirection, PanelY), passing oAIAttackVars_Damage
  as damage and constants 0x700FF04 and 3 (region shape/lifetime params), and spawns an effect object
  (effect type 0) at that same panel''s screen coordinates, x-flip-adjusted via object_getFlip. On every
  subsequent step it decrements StepTimer and, once it expires, writes the hit element to oAIAttackVars_HitElement:
  0x10 normally, or 0x18 if oAIAttackVars_AiDifficultyTier is nonzero — the only difficulty-sensitive
  behavior. The element stored in HitElement (0x10/0x18) presumably drives what damage/element the collision
  region applies when it lands.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne splits first step (init) from subsequent
    steps (timer countdown); PlaySoundEffect(0x59-1), CurAnim=0x10, object_setCounterTime(0xc), StepTimer=0xc
    are the telegraph setup on the init step; object_getFrontDirection + PanelX passed to object_spawnCollisionRegion
    with oAIAttackVars_Damage and dword 0x700FF04/3; object_getCoordinatesForPanels + spawn_t1_0x0_EffectObject
    spawn a visual effect at the same front panel; On timer expiry, AiDifficultyTier selects HitElement
    0x10 vs 0x18 written to oAIAttackVars_HitElement
  refs:
  - bn6f/asm/asm31.s:129790
  - 0x080005CC PlaySoundEffect
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x0800E456 object_getFlip
  reproduce: python3 tools/asmcat.py 0x080F4E44
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The overall structure is correct: first-step telegraph + collision/effect spawn, subsequent-step
    countdown + HitElement write. However the sound ID is 0x158 (mov r0,#0x59; add r0,#0xff), not 0x58
    as stated. More importantly the difficulty logic is inverted in the proposal: the code does ''cmp
    r0,#0; beq loc_80F4EBC'' where beq (tier==0) writes 0x18 and the fallthrough (tier!=0) writes 0x10
    — the proposal reverses this. The InitFlag field (r2 into spawnCollisionRegion) is also unmentioned.;
    run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
