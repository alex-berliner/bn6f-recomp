name: t3_0x3d_80CB900
address: '0x080CB900'
kind: function
status: confirmed
summary: State-machine dispatcher for a battle effect object (beast SP-out template 3, state 0x3D) that jumps to
  one of three per-state handlers and then runs the shared paused-sprite update.
interface: void t3_0x3d_80CB900(r5=battleObject*); passes r0=CurState to the selected handler; object pointer persists
  in r5 through the handler and the sprite-update tail
details: "Reads the object's CurState byte at r5+oBattleObject_CurState and uses it as\nan unscaled byte index into\
  \ the jump table off_80CB918:\n  state 0 -> battleObject_beastSpOut_init_80CB964 (initialization)\n  state 1 ->\
  \ battleObject_handleCollisionFrame_80CB9E2 (per-frame collision handling)\n  state 2 -> battle_effectPlaySoundThenDestroy\
  \ (play sound, then destroy the effect object)\nDispatch uses the mov lr, pc / bx r1 trick, so the handler returns\
  \ straight\nback into this function with the object pointer still in r5. After the\nhandler returns, control falls\
  \ into object_updateSpritePaused on the same\nobject before popping pc. This matches the standard battle-effect\
  \ object\npattern: state 0 spawns/initializes the effect, state 1 tracks it each frame\n(collision/hit detection),\
  \ and state 2 is the teardown state. The three\nhandlers are only reachable through this table, and their register\
  \ side\neffects (notably r5/r9/r11/r12) persist to the caller.\n"
