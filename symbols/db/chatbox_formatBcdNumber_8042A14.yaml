name: chatbox_formatBcdNumber_8042A14
address: '0x08042A14'
kind: function
status: confirmed
summary: Format a BCD-converted integer into a chatbox glyph string with optional padding and right-alignment,
  then write a 3-byte terminator.
interface: void chatbox_formatBcdNumber_8042A14(u32 r0=value, u32 r1=flags, u32 r2=dstBuf); outputs r3=padRemainder,
  r6=fillGlyph, r7=0, r8=bcdValue; preserves r1,r4,r5; clobbers NZCV,r0,r2
details: "Converts the input integer to BCD via memory_bcdConvert (passing flags through in r1), obtains\
  \ the\ndigit count via countHexDigits_8000C5C, then emits each BCD nibble into dstBuf as a font glyph\n\
  index (nibble + 1, since glyph 0 is the terminator slot). r1 flags are interpreted as:\n  - bits 0-3:\
  \ minimum field width; 0 = use natural digit count\n  - bit 6:    pad glyph (0 = glyph 0, 1 = glyph\
  \ 1, \"space\")\n  - bit 7:    alignment (0 = left-align with trailing pad, 1 = right-align with leading\
  \ pad)\nAfter writing the digit run (and any padding), writes a 3-byte terminator 0xE6, 0x00, 0x00 at\
  \ the\nwrite cursor (advancing dstBuf by 3 in the process). Final emitted register state: r3 = padding\n\
  remainder (0 or negative-as-u32 from the final `cmp r3,#0 ; ble` exit), r6 = fill glyph byte,\nr7 =\
  \ 0, r8 = cached BCD value. Stack frame saves r4/r5/lr and preserves r1 across both helper calls\nso\
  \ the caller's flags register is not disturbed.\n"
