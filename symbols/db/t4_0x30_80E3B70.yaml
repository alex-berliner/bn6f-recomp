name: t4_0x30_80E3B70
address: '0x080E3B70'
kind: function
status: confirmed
summary: 'Per-frame dispatcher for a BattleObject: jumps to the handler selected by its current state, then refreshes
  its sprite.'
interface: 'void t4_0x30_80E3B70(void); // in: r5 = BattleObject*; out: r5, r8-r12 (per callees); clobbers nz,cv,r0-r4,r6-r7,lr

  '
details: 'Reads the CurState byte from the BattleObject at r5+oBattleObject_CurState and uses it to index a three-entry
  jump table at 0x080E3B88 (sub_80E3B94 for state 0, battle_objectUpdatePosAndRunAction_80E3BEA for state 4, object_freeMemory
  for state 8). The dispatch is done via the literal "ldr r1,[r1,r0]; mov lr,pc; bx r1" Thumb-thunk pattern; r5
  itself is preserved across the dispatch because the callee inherits the same register file. After the state handler
  returns, object_updateSprite is called unconditionally so the BattleObject''s sprite reflects any motion/pose
  change the handler performed. Out-of-range CurState values would index past the table (the readable notes this
  and falls through, but the original would jump to a garbage address).

  '
