name: aiAttackVars_countdownSub_8109D98
address: '0x08109D98'
kind: function
status: confirmed
summary: 'AI-attack-vars countdown tick: decrements an Unk_10 timer, and on expiry clears flag 0x40, sets
  OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT, reloads the timer from Unk_18, and bumps the phase at Unk_00 to
  0xC.'
interface: 'void sub_8109D98(void) /* in: r5 r7 lr (r7 = oAIAttackVars); out: r1; clobbers nz c v r0 r2
  lr */'
details: "Operates on the AI-attack variable block whose pointer sits in r7 (fields oAIAttackVars_Unk_00,\n\
  oAIAttackVars_Unk_10, oAIAttackVars_Unk_18). Each call:\n  1) loads the u16 at Unk_10, subtracts 1,\
  \ stores it back (sets SUBS flags via the decrement).\n  2) If the result is non-zero, returns immediately\
  \ (subs.Z clear).\n  4) Clears object flag 0x40 via object_clearFlag.\n  5) Sets object flag 1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT\
  \ via object_setFlag1.\n  6) Reloads Unk_10 from the u16 at Unk_18 (timer reset).\n  7) Writes 0xC into\
  \ Unk_00 (phase/state advance).\nFlag behaviour: the non-zero path returns with SUBS reflecting the\
  \ decrement; the zero path\nfalls through into object_clearFlag/object_setFlag1, whose own NZCV clobber\
  \ replaces the SUBS\nresult, matching the original. r1, r2 and lr are reported clobbered by the lifter\
  \ because of\nthose external calls; no further use is made of them here.\n"
