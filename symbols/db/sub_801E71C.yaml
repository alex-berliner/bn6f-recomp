status: hypothesis
summary: Setter that writes a one-byte value into field 0x12 of the global struct at 0x2035280.
interface: void sub_801E71C(u8 value); // reads r0, preserves r1, returns to caller via lr
details: 'Tiny helper: stores the low byte of r0 into byte_2035292, which is offset 0x12 of

  the struct whose base pointer is loaded from off_801E77C (eStruct2035280). No other

  registers or flags are touched; r1 is pushed/popped only so it survives the ldr,

  so callers can keep it live across the call. The function is a leaf routine that

  returns with pop {r1,pc}. Nothing here reveals what the field means in game terms;

  the name is purely positional until callers or cross-references to byte_2035292

  identify the field (a state/flag/mode byte of the eStruct2035280 object, most likely).

  '
