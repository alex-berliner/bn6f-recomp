name: rfu_clearAllSlot
address: '0x0814A828'
kind: function
status: confirmed
summary: Clear all four wireless RFU slot buffers (data and link), mark each slot closed, reset the RFU link-state
  control bytes, and restore the saved IME state.
interface: void rfu_clearAllSlots(void); /* returns RFU base pointer via r2; flags C=1,V=0 (cmp r5,#3 after loop);
  clobbers r2,r3 and r0/r1 scratch; preserves r4-r8 */
details: "Called early in the wireless (RFU) subsystem bring-up/teardown path. Saves and clears the GBA IME (InterruptMasterEnableRegister)\
  \ so the clear runs without reentrancy. Then loops exactly 4 times (slots 0-3), and for each slot:\n  * Fills\
  \ the per-slot data buffer pointed to by dword_2010CB0[slot*4] with zeros (SWI_CpuSet, mode 0x1000034: copy +\
  \ fill by halfword count of 0x34).\n  * Fills the per-slot link/destination buffer pointed to by off_2010CA0[slot*4]\
  \ with zeros (SWI_CpuSet, mode 0x100000a: halfword count of 10 = 5 words).\n  * Writes the \"closed\" status byte\
  \ 0x10 at (RFU_base + 0x10 + slot).\nAfter the loop it resets the RFU state-control bytes at offset 0x04/0x05/0x06\
  \ and sets the link-type byte 0x57 at offset 0x0F, plus zeros byte 0x02 of the secondary RFU structure at dword_2010CC4.\
  \ Finally restores the saved IME value. The function returns the RFU base pointer (from dword_2010CC0) in r2;\
  \ the loop's exit comparison (cmp r5,#3) yields C=1,V=0 by contract.\nQuirks: uses the stack itself (SP and SP+2)\
  \ as the zero-fill source for SWI_CpuSet, so the stack pointer is adjusted by 4 around the loop; pushes r8 alongside\
  \ r4-r7/lr so the saved IME halfword lives there.\n"
