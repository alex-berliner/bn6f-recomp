name: ow_spawnObject1BAtPlayer
address: '0x0808FBA0'
kind: function
status: probable
summary: Spawns overworld map object type 0x1B at the player's current position, passing the player's
  facing direction.
interface: (no args) -> r0 = spawned object or its handle from SpawnOverworldMapObject; clobbers r0-r4,
  lr
details: First calls ReadOWPlayerObjectCoords, which returns the player object pointer in r0 and its X/Y
  position in r1/r2; these are reshuffled into r0/r1/r2. It then calls GetOWPlayerFacingDirection and
  keeps the result in r4 across the spawn call, so the direction is passed to the spawned object as a
  side-parameter. Finally it calls SpawnOverworldMapObject with r0 = 0x1B (object type/ID) — the X/Y and
  direction presumably travel in the reserved registers r1-r4. The function preserves only r5 (pushed/popped
  purely for alignment of the call), takes no arguments of its own, and its return value is whatever the
  spawn call left in r0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl ReadOWPlayerObjectCoords then mov r3,r2 / mov r2,r1 / mov r1,r0 repositions X/Y/Z for the
    next call; bl GetOWPlayerFacingDirection; result kept in r4 across SpawnOverworldMapObject (no other
    use); mov r0,#0x1b; bl SpawnOverworldMapObject is the sole effect of the function; no local state:
    only push {lr} and a dummy push/pop of r5 around the spawn call'
