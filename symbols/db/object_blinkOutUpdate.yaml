name: object_blinkOutUpdate
address: '0x080D1E7E'
kind: function
status: confirmed
summary: Per-frame update for a battle object's blink-out death animation — drop collision, blink the sprite for
  10 frames, then switch to the destroy state.
interface: void object_blinkOutUpdate(u32 r5=obj) -> r1=2, flags nz/c/v from CMP(old_timer, 1)
details: 'Runs as a battle object''s state update while the object is disappearing. On the first tick (oBattleObject_CurPhase
  == 0) it sets CurPhase to 1, calls object_clearCollisionRegion on the object so it can no longer be hit, and arms
  oBattleObject_Timer to 10 frames. Every tick it sets bit 1 of oObjectHeader_Flags (the "blinking/invisible" flag
  the renderer uses to skip drawing), then clears bit 1 again on frames where the timer''s bit 1 is clear — producing
  the alternating visible/hidden blink pattern for the 10 frames. The timer is decremented each tick; when it reaches
  zero the combined CurState/ActionPhase/PhaseInitialized word (oBattleObject_CurStateActionPhaseAndPhaseInitialized)
  is set to CUR_STATE_DESTROY so the object''s next update destroys it. Quirk: it always exits with r1 = 2 (the
  last bit-mask loaded), and the returned NZCV flags reflect `sub r0,#1` on the old timer value, i.e. CMP of old_timer
  against 1; callers must not rely on r0 being preserved. r5 is the only real input and is preserved implicitly
  by not being written.

  '
