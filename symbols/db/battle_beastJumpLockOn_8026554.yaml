name: battle_beastJumpLockOn_8026554
address: '0x08026554'
kind: function
status: confirmed
summary: Dispatches a Beast Out jump lock-on check by id for a panel coordinate, jumping table-style into one of
  ~19 battle panel/handling routines.
interface: 'void battle_beastJumpLockOn_8026554(u32 x /*r0*/, u32 y /*r1*/, u32 checkId /*r2*/); // tail-dispatch:
  selected handler''s results (r0, r1, r5, r8-r12) are this function''s outputs; r6/r7 preserved; clobbers r2-r4,
  flags, lr'
details: 'Beast Out jump lock-on dispatcher. The caller passes a panel coordinate (r0 = x, r1 = y) and a check id
  in r2. If the coordinate is outside the 6x3 playfield (x not in 1..6 or y not in 1..3), the id is forced to 0
  (battle_getObjectPanelXY, the "own panel" lookup). The id selects a handler from the jump table jt_8026584, which
  includes battle_checkFacingTileMatch, battle_runFacingTileCheck, battle_checkAnyAdjacentTile and many small unnamed
  panel-check helpers. The handler is reached in a tail-call fashion: the code sets lr = pc and does bx r2, so the
  handler returns directly to this function''s caller. The handler inherits the live register state: r0/r1 still
  hold the coordinates, r6/r7 are set to the coordinates (the function''s own saved r6/r7 are pushed but immediately
  overwritten, and restored to the caller''s values by the pop on return), r2 is left holding the handler address
  and r3 the jump table address, r4/r5 pass through untouched, and whatever the handler leaves in r0, r1, r5 and
  r8-r12 becomes this function''s output. Handlers therefore read the panel coordinates from r6/r7 and return check
  results in r0/r1 (and other registers, per check).

  '
