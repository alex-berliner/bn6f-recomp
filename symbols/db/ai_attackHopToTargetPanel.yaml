name: ai_attackHopToTargetPanel
address: '0x08108A5A'
kind: function
status: probable
summary: 'AI attack step: hops the enemy onto the reserved target panel, plays the move anim, then waits
  out the step timer before leaving attack state.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = undefined; sets ObjectFlags1 currently-moving
  bit, clears 0x40 flag
details: On first entry (AttackElement == 0) it sets AttackElement = 4 and anim 3, releases the panel
  reserve at (TargetPanelX, TargetPanelY) and the object's own future-panel reserve, copies FuturePanelX/Y
  into PanelX/Y, recomputes pixel coordinates from panels, syncs the collision record/facing via object_updateCollisionPanels,
  clears flag 0x40 and sets the CURRENTLY_MOVING_1 flag, then loads StepTimer = 0xD. While the timer counts
  down it does nothing; at zero it calls object_exitAttackState. Two nonzero fields in the attack vars
  (AiAttackParam and PanelParamFlags2) trigger a call to sub_80B8E58 (unknown, likely a sound or spawn
  effect).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sets AttackElement=4 and anim 3 then 'bl object_removePanelReserve' with TargetPanelX/Y (0x8108A60-0x8108A76);
    copies FuturePanelX/Y into PanelX/Y and removes the second reserve before object_setCoordinatesFromPanels/object_updateCollisionPanels;
    sets ObjectFlags1 bit 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1 and StepTimer=0xD, waits, then 'bl object_exitAttackState';
    all callees are battle-object panel/collision/flag helpers, confirming it manipulates one battle object's
