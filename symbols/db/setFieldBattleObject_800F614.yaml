name: setFieldBattleObject_800F614
address: '0x0800F614'
kind: function
status: confirmed
summary: Inserts a battle-object pointer into the battle state's object list, keyed by alliance and slot type, evicting
  and zeroing the HP of any displaced object.
interface: void battle_placeObjectSlot(u32 r0_newObject, u32 r1_alliance, u32 r2_type, u32 r10_toolkit) -> flags
  nzcv, r1_slotAddr, r2_evicted, r3_state; clobbers r1 r2 r3
details: 'Resolves the battle-state pointer via toolkit (r10 + oToolkit_BattleStatePtr), then indexes into BattleObjectList
  using alliance (row stride 0xC) and type (slot stride 8) to compute the target slot address. If type == 0 (main
  slot), the slot is a two-entry FIFO: if the first entry is empty the object is placed there; if the second is
  empty it is appended; if both are occupied the oldest entry is shifted out, the new object takes slot 1, and the
  evicted object''s BattleObject_HP (offset oBattleObject_HP, u16) is zeroed. If type != 0 (sub slot), the single-pointer
  slot is overwritten in place; any previously stored object also has its HP zeroed. Flags: N and Z reflect the
  last TST of 0 (always Z=1, N=0); C and V come from the final ADDS of oBattleState_BattleObjectList to the computed
  base. r1 returns the slot base address, r2 returns the evicted object pointer (0 if none), r3 is a side-effect
  value (0 after eviction paths, type<<3 when sub-slot had no prior object).'
