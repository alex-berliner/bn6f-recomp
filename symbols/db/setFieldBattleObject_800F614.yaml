open_questions:
- Are the two main-slot entries a strict FIFO or do callers rely on the shift order for priority? (The code always
  shifts entry1 into entry0 and puts new into entry1, so the newest is in the second slot.)
- Does zeroing HP of the evicted object cause an immediate death animation, or is HP==0 merely a sentinel cleaned
  up later by the main loop?
- The C/V flags from the final ADDS are caller-visible; which callers depend on them rather than treating them as
  discarded?
