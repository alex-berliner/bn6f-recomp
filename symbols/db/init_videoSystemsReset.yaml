name: init_videoSystemsReset
address: '0x08039630'
kind: function
status: probable
summary: 'When no screen fade is running, resets the whole video pipeline: clears VRAM and the BG tile
  buffer, reloads base graphics, re-inits chatbox/start-screen renderers, and blanks DISPCNT.'
interface: () -> void; returns early via IsScreenFadeActive flags when a fade is active
details: 'Calls IsScreenFadeActive and if the Z flag indicates a fade is in progress it returns without
  touching anything. Otherwise it performs a full video reset: zeroFillVRAM clears 0x6000000-0x600DFFF,
  ZeroFillGFX30025c0 zeroes the 0x2000-byte BG tile buffer, copyMemory_8001850 loads a fixed 0x800-byte
  graphics block into VRAM 0x600D400 plus 32 bytes to IWRAM 0x3001B40, then chatbox_8040818 and startScreen_init_802F530
  reinitialize the text and start-screen renderers. Finally it writes 0x40 (DISPCNT forced-blank bit)
  via SetRenderInfoLCDControl into the current frame''s render info, leaving the screen blanked with freshly
  loaded base graphics. No arguments or results are passed; r4-r7 are pushed but unused, suggesting a
  standard engine-call signature.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl IsScreenFadeActive / beq locret_8039652: entire body is guarded by fade state; bl zeroFillVRAM
    then bl ZeroFillGFX30025c0: full VRAM + BG tile buffer wipe, a startup/reset pattern; bl copyMemory_8001850:
    reloads the fixed base GFX block (VRAM 0x600D400, IWRAM 0x3001B40); bl chatbox_8040818 and bl startScreen_init_802F530:
    re-inits both renderer subsystems after the VRAM wipe; ldr r0, =0x40 / bl SetRenderInfoLCDControl:
    writes DISPCNT forced-blank (0x40) as the final step'
