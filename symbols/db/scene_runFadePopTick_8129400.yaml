name: scene_runFadePopTick_8129400
address: '0x08129400'
kind: function
status: confirmed
summary: Per-frame "pop" handler that, when the screen fade isn't already running, resets the scene slot,
  loads its palette/BG, opens the chatbox, kicks a fade-out, and dispatches a pop-script from a tiny table;
  always then ticks entity handlers, refreshes scene state, and advances the fade sequencer.
interface: 'void sub_8129400(void);

  // in:  r4 r5 r6 r10 lr

  // out: r5 r8 r9 r10 r11 r12 (preserved), lr consumed

  // clob: r0 r1 r2 r3 r4 r6, N Z C V

  '
details: "Entry path is taken only when IsScreenFadeActive returns false (beq means zf==0 here, i.e. no\
  \ fade in progress). On that branch the function:\n  * calls sub_8046664 (subsystem hook)\n  * clears\
  \ two bytes of the scene state struct pointed at by r5: offset 0xD (next/pop index) <- 0, offset 0x2\
  \ (phase/state) <- 0x0C\n  * clears the \"struct_200BC30\" scratch area via clearStruct200BC30_803EBAC\n\
  \  * loads a per-scene data blob from a_byte_8129168 into the slot via sub_80465A0\n  * loads BG tiles\
  \ and configures the BG via bg_LoadFullScreenTilesAndSetup_812AFB0\n  * draws the chatbox frame via\
  \ chatbox_8040818\n  * starts a screen fade with SetScreenFade(8, 0x10) (probably intensity 8, duration\
  \ 0x10)\n  * indexes dword_8129450 by the (just-zeroed) byte at r5+0xD, reads a script id, and runs\
  \ it through chatbox_runScript_803FD9C_on_eTextScript201BA20; the table holds the literal word '0x5C5D5D'\
  \ (three byte ids 0x5C, 0x5D, 0x5D little-endian).\nTail (always): entity_runAllUpdateHandlers_80465BC,\
  \ sub_80465F8 (refresh/sync), then sub_812B29C(0x0D) — likely a fade sequencer step or vblank/IRQ handler\
  \ tied to fade slot 0x0D.\nThe dword_8129450 table being only three bytes (and the pop-index byte being\
  \ zeroed before the lookup) means on the entry frame the script id is exactly byte_8129450 == 0x5C.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
