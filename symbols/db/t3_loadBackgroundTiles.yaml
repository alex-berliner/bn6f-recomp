details: A parameterless wrapper that calls CopyBackgroundTiles with j=3, i=8 (destination tile offset
  8 in tile block 32x32 index 3), tile_ids = byte_8038700, and a j_size of 0x17 (23) by i_size of 2. So
  it copies a 23x2 tile strip, taken from a static tile table at byte_8038700, into tile block 3 at tile
  index 8. It keeps no state and returns nothing. The odd 23x2 shape suggests a narrow decorative band
  (e.g. a border, sky strip, or panel edge) rather than a full 32x32 map.
