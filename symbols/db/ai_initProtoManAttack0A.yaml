name: ai_initProtoManAttack0A
address: '0x080FBE60'
kind: function
status: probable
summary: 'Initializes one of ProtoMan''s AI attack states: records difficulty tier, resets state vars,
  stores the attack''s panel-choose callback and duration/boost values, targets the opposing player, and
  sets the object''s attack to 0xA.'
interface: (r0 = attacker BattleObject, r5 = same object, r7 = oAIAttackVars struct) -> r0 clobbered;
  writes tier/initFlag/callback/AttackDuration/AttackBoost2/ScratchVar/TargetObjectPtr into r7 struct
  and attack id 0xA onto the object
details: Stores battle_getAiDifficultyTier result into oAIAttackVars_AiDifficultyTier and clears InitFlag,
  then zeroes a value passed to sub_80FBF92 (likely a reset/clear of remaining attack state). It loads
  the callback pointer sub_80FCD70+1 into oAIAttackVars_PanelChooseCallback, and fills oAIAttackVars_AttackDuration
  and oAIAttackVars_AttackBoost2 from helper calls sub_80FBD04/sub_80FBD18, which presumably scale with
  the difficulty tier. It computes ScratchVar = 100 + r5 (object pointer as scratch anchor/handle) and
  stores the opposite-alliance player object (battle_findPlayer with alliance EOR 1) as TargetObjectPtr.
  Finally object_setAttack0(0xA) puts the object into attack state 0xA. This is a per-attack 'begin attack'
  initializer used by the ProtoMan AI decision routines.
