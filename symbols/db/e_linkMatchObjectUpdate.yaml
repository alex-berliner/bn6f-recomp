summary: Per-frame state-machine update for an interactive object that matches a looked-up record against
  the eLinkState global and runs text scripts 0x40/0x41 from eTextScript201BA20.
interface: (r0 = ? (unused), r5 = object work struct, preloaded) -> r0 = ?; sets state bytes [r5+0x10]/[r5+2]/[r5+0x1f],
  counters [r5+0x26]/[r5+0x28]/[r5+0x2a]
details: 'Sets state [r5+0x10]=0x20, calls sub_81312D8, and dispatches on eStruct200BC30''s mode: result
  4 fades the screen via sub_81313C0/sub_8131210, result 1 just ticks sub_8131570/sub_8131458. Bits 0x10/0x8
  of the dispatch result gate a branch where, if eStruct200BC30_getJumpOffset00 is 0, it sets [r5+2]=0x30,
  [r5+0x1f]=4, runs text script 0x41 and sets a 0xf0 timer at [r5+0x28]. Otherwise it fetches eLinkState,
  calls sub_81323B0 (0xffffffff = no record), and compares the found record''s word at +4 with eLinkState+0x1c
  and halfword at +2 with eLinkState+0xa across a 0x10-stride range, aborting on any mismatch. With a
  match, sub_8132430''s result drives branches: <=2 sets state 4 (and script 0x40 with final state 3 or
  4 depending on [r5+0x26]==8), result 4 compares the record''s two halfwords at +0xa (entry[0] vs entry[1])
  and either runs script 0x41 with a reset record and [r5+0x2a]=0xfed9, or calls sub_813178C; result 0xff
  waits for the screen fade; other results require a newly pressed B button (sub_8131768). Every exit
  path ticks sub_8131570 and sub_8131458.'
