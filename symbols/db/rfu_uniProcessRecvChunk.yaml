name: rfu_uniProcessRecvChunk
address: '0x08149150'
kind: function
status: probable
summary: 'Per-wireless-packet receive bookkeeping: counts an incoming UNI data chunk and, once the expected
  chunk count is reached, flushes the assembled buffer and queues a 12-byte completion packet for sending.'
interface: (r0 = ? ignored) -> r0 = 1 if a chunk was processed / transfer completed, 0 if state is 0x8F
  or nothing to do; flags clobbered by calls
details: Reads a state byte at byte_20101B4 and bails with 0 if it equals 0x8F. If the UNI slot selected
  via byte_20103E0 into table off_2010CA0 has its +0x12 flag set, it clears the new-data flag (rfu_UNI_clearRecvNewDataFlag)
  and proceeds. It increments a received-chunk counter byte_2010220 and compares it against the expected
  total stored at unk_20103A0+0x3C; when the count matches, it calls sub_803F334 with the 0x40-byte buffer
  unk_20103A0 (flush/finalize), sets the state byte to 1, and pushes a 12-byte packet from byte_2010390
  via rfu_queuePushEntry (state 0x83 if the queue is full), bumping the sent-counter byte_201039C on success.
  On completion the counter is reset to the total and word_2010420 cleared; otherwise per-packet statistics
  at word_2010400/word_2010420/word_2010428 are incremented depending on whether the current chunk is
  the last one.
