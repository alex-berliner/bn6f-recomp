name: battle_setAnim1PlaySoundA9GotoPhase4
address: '0x080D3620'
kind: function
status: probable
summary: 'Battle-object state handler: starts animation 1, sets a 30-frame timer, plays sound effect 0xA9,
  and advances the object to phase 4.'
interface: (r5 = battle object, implicit) -> writes oBattleObject_CurAnim=1, oBattleObject_Timer2=0x1E,
  oBattleObject_CurPhaseAndPhaseInitialized=4; no return value
details: 'This looks like one arm of a phase-dispatch handler for a battle object: it writes 1 to the
  object''s current animation byte, loads a 30-frame countdown into Timer2, requests M4A sound effect
  0xA9 (immediate value 0xAA adjusted by add #0xff), and stores phase 4 with the phase-initialized flag
  into CurPhaseAndPhaseInitialized before returning. The 30-frame timer suggests a short setup/wind-up
  window that phase 4 presumably waits on. The use of r5 as the object pointer matches the game''s convention
  of keeping the battle object in r5 across phase handlers.'
