name: battleObject_initBattleFieldTilesAndSfxTimer_804C770
address: '0x0804C770'
kind: function
previous_names:
- sub_804C770
status: probable
summary: Sets the BG3/BG2 viewport offset, dispatches a "post-init" callback chosen from r5+0xd, rolls
  a random ambient-SFX timer, and copies a 0x20×0x20 tile block to BG tile area 3.
interface: (r5 = battle object pointer, r10 = toolkit ptr) -> side effects only (modifies RenderInfo,
  calls a thunk, sets SFX timer, copies tiles)
details: "The function begins by reading r10 -> RenderInfoPtr (oToolkit+0x8). It loads the u16 at offset\
  \ 0, ORs it with 0x800 (`dword_804C7C0`) and writes it back. Next it adjusts the BG Y scroll: subtracts\
  \ 0xc from RenderInfo+0x1a and adds 0xc to RenderInfo+0x18, producing a 12-pixel scroll-relative offset\
  \ on those two planes.\n\n  It then loads `off_804C7B0` (a 3-entry table of function pointers at `off_804C7B4`),\
  \ indexes into it using `byte [r5+0xd]` (an enum-like slot on the battle object — likely a \"phase\"\
  \ or \"kind\" field), and dispatches to one of `sub_804C7C4`, `sub_804C7C8`, or `sub_804C7EC` via a\
  \ Thumb/ARM veneer (`mov lr,pc; bx r0`). Without meaningful coverage we cannot tell what these do, but\
  \ they look like sub-mode initializers.\n\n  It calls `sub_804C818` (the random ambient-SFX countdown\
  \ initializer: `one primary RNG draw sets a random 300-555 frame countdown at object +0x14`).\n\n  Finally\
  \ it copies a 0x20×0x20 tile block: r0=0 (j offset within block?), r1=0, r2=3 (which 32×32 tile block\
  \ in VRAM), r3=`byte_86A2C80` (tile-id array), r4=0x20, r5=0x20 → `CopyBackgroundTiles`. The tile block\
  \ 3 destination and u16 src array at `byte_86A2C80` suggest this clears/stamps a virgin field-tile block\
  \ used by the field.\n\n  Return convention: the function restores r4–r7 from the saved frame and `pop`s\
  \ pc out of `lr`; no r0/r1 return value is contractually written (out only carries caller-saved r0…r12/lr\
  \ plus flags), so it is effectively `void` from the caller's point of view.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r4,[r10,#oToolkit_RenderInfoPtr]` reads the Toolkit''s RenderInfo slot (offset 0x8 per
    `toolkit_struct`). - `ldrh r0,[r4]`, `orr r0, r2`, `strh r0,[r4]` OR=0x800 into RenderInfo+0 (display
    control / BG-mode bits). - `ldrh r0,[r4,#0x1a]; sub r0,#0xc; strh r0,[r4,#0x1a]` subtracts 0xc from
    the offset-0x1a plane (BG Y scroll candidate per `render_info_struct`). - `ldrh r0,[r4,#0x18]; add
    r0,#0xc; strh r0,[r4,#0x18]` adds 0xc to the offset-0x18 plane (mirror-symmetric). - `ldrb r1,[r5,#0xd]`
    indexes 3-entry jump table; only the battle object''s +0xd field is read. - `off_804C7B0` is declared
    with three entries `sub_804C7C4+1`, `sub_804C7C8+1`, `sub_804C7EC+1` (Thumb veneers). - `bl sub_804C818`
    matches the project''s summary: rolls 300–555 frame ambient SFX countdown into `object+0x14`. - Final
    block writes r0=0, r1=0, r2=3, r3=`byte_86A2C80`, r4=r5=0x20 then `bl CopyBackgroundTiles`: copies
    a 0x20×0x20 u16 tile-id array into tile block 3 at VRAM origin.'
