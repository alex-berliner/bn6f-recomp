name: battleObject_initBattleFieldTilesAndSfxTimer_804C770
address: '0x0804C770'
kind: function
status: confirmed
summary: 'Per-frame setup of the battlefield background: enables tile-render mode, shifts the scroll window by 12px,
  dispatches the stage-type tile layout, ticks the periodic sound-effect timer, and uploads the 32×32 background
  tile block to VRAM.'
interface: 'void battleObject_initBattleFieldTilesAndSfxTimer_804C770(u32 battle_obj /*r5*/, u32 toolkit /*r10*/)
  -> {r2, r8, r9, r10, r11, r12}; flags: nzcv clobbered'
details: "Reads Toolkit_RenderInfoPtr from r10 (the render-info struct).\nSets bit 11 (0x800) on the render-info\
  \ flags word at offset 0x00,\ntoggling a tile-rendering mode for the background layer.\nAdjusts the background\
  \ scroll window at offsets 0x18 (X, += 0xC)\nand 0x1A (Y, -= 0xC), giving a 12-pixel diagonal shift.\nDispatches\
  \ a stage-specific tile-layout routine via a three-entry\njump table keyed on byte 0xD of the battle object:\n\
  \  type 0 → stub_doNothing_804C7C4 (no-op),\n  type 1 → sub_804C7C8,\n  type 2 → sub_804C7EC.\nThe dispatched\
  \ routine receives render_info in r4, the type byte\nin r1, 0x800 in r2, and the battle object in r5; it writes\n\
  r8/r9/r11/r12 as side-effects (tile-palette or geometry data).\nCalls object_periodicSoundTimerTick_804C818 to\
  \ advance the SFX\ncountdown timer stored in the battle object.\nCalls CopyBackgroundTiles(0, 0, 3, byte_86A2C80,\
  \ 0x20, 0x20)\nto upload tile block index 3 (a 32×32-tile area, i.e. 64×64 px\nof 8×8 tiles) from the static table\
  \ at 0x086A2C80 into background\nVRAM at destination (0,0).\nQuirk: the push/pop of r4–r7 is defeated by the indirect\
  \ dispatch\nand the two calls, which clobber r4–r7; the C wrapper restores\nthem before returning.\n"
