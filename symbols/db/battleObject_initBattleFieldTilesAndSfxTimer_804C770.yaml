open_questions:
- What the three jump-table targets `sub_804C7C4` / `sub_804C7C8` / `sub_804C7EC` actually do — the 0xd
  field selects one, so naming the function by one of them is premature.
- Whether the or-of-0x800 sets a specific display bit (e.g., BG mode or forced blank) versus a per-frame
  BG flag; would settle by inspecting `render_flushDisplayRegisters_800172C`.
- Whether 0xd is a battle-object phase or some child enum.
