  detail: '- bl cutscene_checkOriginalCutsceneScriptPos_8036F40 / 8036F58 and bne loc_80A6F66 at the top gate the
    body on cutscene state (assembly 80A6F2C..80A6F40). - chatbox_mask_eFlags2009F38 with r0 = 0x80 and bne loc_80A6F66
    short-circuits when chatbox flag 0x80 is set. - ldrb r0,[r6,#9] / cmp r0,#0 / cmp r0,#1 dispatch: r6->[9] selects
    between the default path and the anger/cur-action=1 path. - ldr r0,[r5,#0x34] / cmp r0,#0 then b sub_80A7160
    reads the u32 at BattleObject+0x34 (Coords.X upper half / AIData.Anger u16) and uses 0 to mean "no anger yet".
    - mov r0,#8 / strb r0,[r5,#8] sets CurState = CUR_STATE_DESTROY (struct_const CUR_STATE_DESTROY,0x08). - Tail:
    bl sprite_update on r5 and bl sub_80A7238 before pop {r4-r7,pc} are unconditional. - captured calls: in-frame
    r0=4 (== CurAction initialise?), exit r0=0x26 (= CUR_STATE_INITIALIZE|CUR_STATE_UPDATE|CUR_STATE_DESTROY mask?
    actually 0x26 = CUR_STATE_UPDATE|CUR_STATE_INITIALIZE-ish, but more importantly unchanged across calls), consistent
    with this being a per-frame dispatcher rather than a value-returning function.'
