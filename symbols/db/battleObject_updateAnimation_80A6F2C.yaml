status: probable
summary: 'Per-frame update for an enemy battle object: gates its curAction animation logic on cutscene / chatbox
  state, then runs the common sprite + end-of-frame hook.'
interface: '(r5 = BattleObject*, r6 = ?AIData?, r10 = Toolkit*) -> void ; side effects: writes BattleObject->CurState
  / CurAction (0x8..0x9), sets bit at eFlags2009F38 flag 0x80, calls sprite_update, calls sub_80A6F78/sub_80A70FC/sub_80A7160/sub_80A7238.'
details: "Entry guard: if cutscene_checkOriginalCutsceneScriptPos_8036F40 (L-Message sentinel) or 8036F58 (AskJackOut\
  \ sentinel) is set, or if chatbox flag 0x80 is set, all the per-action logic is skipped and we just fall through\
  \ to sprite_update + sub_80A7238 (assembly bne loc_80A6F66 short-circuits past the body).\n\n  Otherwise the body's\
  \ behaviour is keyed off r6->[9] (which is AIData.Unk_09 / CurAction on the ai_data_struct, but here reused as\
  \ a 2-bit CurAction for the object). If Unk_09 is 0 or != 1 we fall into sub_80A6F78 + sub_80A70FC (the \"default\"\
  \ idle/AI tick path). If Unk_09 == 1 we then test [r5+0x34] (BattleObject.Coords.X upper word, the \"Anger\"-like\
  \ value at oBattleObject+0x34 / AIData.Anger at 0x34 in the live object): if non-zero we call sub_80A7160 (which\
  \ is the second captured-call r2 path that branches on r2), otherwise we set BattleObject.CurState = 8 (CUR_STATE_DESTROY)\
  \ at [r5+8] and exit.\n\n  Unconditional tail: bl sprite_update on r5's sprite; bl sub_80A7238; pop {r4-r7,pc}.\
  \ The captured calls show entry r2 is an IWRAM pointer in the 08445xxx range that gets re-passed to sub_80A7160\
  \ (r2 is in its contract), strongly consistent with this being the second captured-call helper.\n"
