name: battle_aiGetAttackBoostValue
address: '0x08100524'
kind: function
status: probable
summary: Returns the Attack Boost value used by an AI attack helper.
interface: () -> r0 = attackBoostValue (byte via sub_800FE28)
details: A trivial wrapper that fetches a constant byte from dword_8100534 via sub_800FE28 and returns
  it. The caller sub_8100580 (which sets up an AI attack via battle_aiLoadVersionedAttackPair) stores
  the returned byte into oAIAttackVars_AttackBoost2, matching the pattern of the sibling read of dword_8100534
  stored into oAIAttackVars_AttackDuration. The literal word 0x0A0A0A0A lives in ROM; only its first byte
  is ever consumed (sub_800FE28 typically masks/extracts a single field). The function is invoked once
  per AI attack initialization.
