name: object_pickFilteredPanel
address: '0x080F3784'
kind: function
status: probable
summary: Returns a candidate panel (x in r0, y in r1) from a battle object's row that matches panel-flag
  parameters, either randomly chosen or the object's own panel.
interface: (r0 = battle object ptr, r2 = required panel-flag mask, r3 = forbidden panel-flag mask, r4
  = mode flag, r5 = object for mode 1) -> r0 = panel x (0 on failure), r1 = panel y; flags clobbered
details: Mode is taken from caller-set r4. With r4==0 it calls object_getPanelsInRowFiltered using the
  row/byte at [r0+0x13] and the two masks, filling a stack buffer with packed panel coordinates (low 3
  bits x, bits 4-7 y); if any match, it draws GetPositiveSignedRNG and reduces it with svc 6 modulo the
  count to pick one entry, unpacking it into x (r0) and y (r1). With r4!=0 it takes the object's own [r5+oBattleObject_PanelX]
  and [r0+0x13], pushes (x,y), and asks object_checkPanelParameters whether that panel passes the masks;
  if so the popped pair is returned unchanged, otherwise r0=0 signals failure. Note it never saves/restores
  r4 and r5, so callers must set these before the call — likely hand-written or compiler-tail-merged code.
