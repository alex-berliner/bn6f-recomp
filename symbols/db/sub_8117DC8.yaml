name: sub_8117DC8
address: '0x08117DC8'
kind: function
status: confirmed
summary: Tail-dispatches to a battle object's mode handler, selected by the mode byte at [r5+5] through the off_8117DDC
  jump table.
interface: void sub_8117DC8(u32 r5 /*object*/); // returns the handler's r2/r3/r5/r10/r11; clobbers r0-r1,r4,r6-r9,r12,flags
details: 'Tiny trampoline: reads the mode byte at [r5+5], shifts it left by 2, loads the corresponding Thumb handler
  address from the table at off_8117DDC (only one entry, sub_8117DE0, is present here), and calls it with "mov lr,
  pc; bx r0" followed by "pop {pc}". Because LR is set from PC during a Thumb BX, the return actually goes through
  the pop, so it behaves as a tail call from the caller''s perspective — outputs r2/r3/r5/r10/r11 are whatever the
  handler leaves, and handlers returning to that LR also fall into the pop {pc}. The helper must issue the guest
  call manually at the loaded address (R0=handler entry, R1=shifted index).

  '
