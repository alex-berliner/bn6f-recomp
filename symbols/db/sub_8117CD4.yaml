name: sub_8117CD4
address: '0x08117CD4'
kind: function
status: confirmed
summary: Draws the menu cursor/highlight sprite for the active menu, sliding it horizontally with the menu's scroll
  value and picking a highlighted tile variant when the selection matches the current entry.
interface: void sub_8117CD4(void); // reads no incoming registers (only lr); returns sub_812068C's r0-r3 and flags
details: "Chooses which menu state block to read: if the shared submenu is open\n(submenu_isOpen_81355D8, Z flag\
  \ set on yes) it uses sSubmenu, otherwise it\nasks sub_81312F4 for the current menu object and uses the pointer\
  \ in r0.\nFrom the chosen block it reads:\n  - byte  at menu+0x17 (selection/cursor index) -> r0\n  - half  at\
  \ menu+0x1E (current entry/index)    -> r3\n  - s16   at menu+0x18 (scroll offset)          -> shifted left by\
  \ 19\nIt then calls sub_812068C with:\n  r0 = selection byte\n  r1 = 0x5140 if selection == entry, else 0x6140\
  \ (tile/attr pair differing\n       by 0x1000, i.e. a highlighted vs normal cursor tile)\n  r2 = 0xC08003 - (scroll\
  \ << 19); the x coordinate field sits at bit 19,\n       so the base x is 24 px and moves left as the menu scrolls\
  \ right\n  r3 = entry halfword\nsub_812068C presumably submits this as an OAM/sprite entry. r7 is saved and\n\
  restored around the calls (it is only used to hold the menu block pointer);\nr4-r6 are untouched despite being\
  \ listed as preserved. Return state is\nwhatever sub_812068C leaves in r0-r3 and the flags.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
