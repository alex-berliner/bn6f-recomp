name: objectThrownFlyPhase
address: '0x080D47C0'
kind: function
status: probable
summary: Per-frame phase handler for a battle object thrown in an arc toward a target panel, integrating
  X/Y/Z with gravity and on landing snapping to panel, setting panel type 4, playing sound 0x90, or aborting
  to CurAction 2 if the panel is not solid.
interface: (r5 = battle object pointer, no args) -> updates object velocities/position/panel state; r0
  clobbered, flags used for time-stop early-out
details: 'On first run (PhaseInitialized==0) it reads Param3/Param4 as target panel column/row, calls
  math_getThrowSpeeds with frame count 0x3C (60) and gravity dword 0xFFFFE000 (-0x2000/frame), stores
  the resulting X/Y/Z velocities, sets Timer2=60, ExtraVars+0xC=1 (in-flight flag), and marks itself initialized
  with phase value 4. Each subsequent frame, once Timer2 drops below 5 it sets collision region 1 via
  object_setCollisionRegion (making the falling body collideable just before impact); it then decrements
  Timer2 and while it is still positive integrates X/Y position and Z, subtracting 0x2000 from ZVelocity
  each frame and syncing collision panels to the new position. When the timer underflows, the object has
  reached its target: if the target panel is solid it snaps coordinates from panel coords, zeroes Z, sets
  the panel type to 4 via object_setPanelType, plays sound effect 0x90, clears the in-flight flag, and
  switches to CurAction 8 phase 0; if the panel is not solid it instead switches to CurAction 2 (abort/destroy
  path) and returns. battle_isTimeStop freezes the whole routine when time-stop is active.'
