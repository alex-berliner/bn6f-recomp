name: clearBeastOutState
address: '0x0809AD4C'
kind: function
status: probable
summary: 'Tears down the Beast Out scenario: clears EVENT_F5/1725, queues PET effect 1, reinitializes
  and deactivates the scenario effect state, zeroes the event work struct, and acks the new-flag byte.'
interface: () -> r0 = 0; no flags meaningful
details: Called during the beastsp route, this sequence clears event flags EVENT_F5 and EVENT_1725 (likely
  Beast Out related), then queues PET effect 1 via doPETEffect_8033fc0 (which writes into the eS2011E30
  state block and clears the pending-effect flag). It then reinitializes the scenario effect state block
  at 0x2000780 (scenario_initEffectState_8003962), one-time zero-fills the 0x48-byte event work struct
  at 0x2001010 (zeroFill_8003AB2), clears the scenario effect's active bit (bit 7) to deactivate the current
  scenario effect, and acks the fresh-flag bit (bit 7) of the event flag byte at eStruct2001010 so the
  event no longer reads as pending. Returns 0. This looks like the cleanup/reset when the Beast special
  sequence ends or is canceled.
