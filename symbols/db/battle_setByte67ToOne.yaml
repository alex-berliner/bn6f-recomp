name: battle_setByte67ToOne
address: '0x0810E336'
kind: function
status: probable
summary: Sets a battle object's byte +0x67 to 1.
interface: () -> r5 holds oBattleObject; writes r5[0x67] = 1
details: A trivial setter that writes the constant 1 into offset +0x67 of the current battle object (held
  in r5). It is invoked from battle_8108F74 only for NameIDs in the 0x43–0x48 range when both a collision-data
  pointer exists and the word at offset +0x84 in that pointer is nonzero, and immediately after battle_clearObjByte67
  has just zeroed the same byte and battle_settleCollisionCounters has run. The byte likely records that
  the object took damage (HP) from a settling-counter event, mirroring battle_clearObjByte67/byte +0x67
  usage elsewhere in the same routine.
