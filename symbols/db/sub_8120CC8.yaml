name: sub_8120CC8
address: '0x08120CC8'
kind: function
status: confirmed
summary: Reads the next byte (character) from a text buffer at a caller-supplied index, treating 0xFF as the end
  marker and wrapping back to the buffer's start with index 0.
interface: int chatbox_readTextChar_8120CC8(int index, u8 *buf) -> r0 = new index (0 if end marker hit), r1 = byte
  read, r2 = buf, r3 = incoming index, carry = (byte == 0xFF), overflow clear
details: 'Takes a text/data buffer pointer in r1 and a character index in r0. Copies the pointer to r2 and index
  to r3, then loads the byte at buf[index]. If that byte is 0xFF (the standard text end marker in the BN chatbox
  format), the byte returned in r1 is re-read from buf[0] and the index returned in r0 is reset to 0, i.e. the read
  wraps around to the start of the buffer/script; otherwise r0 passes the caller''s index through unchanged. The
  flag compare against 0xFF is left in place for the caller (C set iff the first byte read was 0xFF, V clear), so
  the terminator test is effectively performed twice — here and in the caller. r2/r3 coming out as buf/index copies
  look like leftovers of the original''s register setup but appear to be part of the contract (callers may rely
  on them). Typical use is stepping through dialogue or text-script bytes where 0xFF terminates the string.

  '
