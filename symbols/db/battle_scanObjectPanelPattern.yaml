name: battle_scanObjectPanelPattern
address: '0x080266AC'
kind: function
status: probable
summary: Scans panel offset patterns using the calling battle object's r6 and r7 context.
interface: (r0 = r6, r1 = r7, r2 = pattern) -> r0 = match result; flags ...
details: This is a thin wrapper around battle_scanPanelOffsetPattern. It preserves the current object-context
  registers r6 and r7 by passing them as the first two arguments and supplies byte_802679B as the pattern
  source. The return value and condition flags come directly from battle_scanPanelOffsetPattern. No callers
  are known, so its exact game-level role beyond panel-pattern scanning is not established.
