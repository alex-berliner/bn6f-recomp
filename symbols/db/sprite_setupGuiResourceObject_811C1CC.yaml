name: sprite_setupGuiResourceObject_811C1CC
address: '0x0811C1CC'
kind: function
status: confirmed
summary: Spawns and configures the GUI sprite (resource 0x69) for an object, tagging it as type 0x23,
  positioning it at (120,40) and setting its animation/palette/priority attributes.
interface: void sub_811C1CC(r4, r5 work /* object work area */, r6, r7); returns r0-r3 and nz/c/v exactly
  as sprite_updateAnimPassthrough_811C22C leaves them; r4-r7 preserved
details: "Treats r5 as the object's work area and performs a one-shot setup of its\non-screen sprite:\n\
  \  - writes 0x23 to work+0 (object type / handler id tag),\n  - calls initGuiSprite_8002770 with sprite\
  \ id 0x69 and the template\n    pointer unk_20222A0, spawning the GUI sprite resource,\n  - sets animation\
  \ 0, loads its animation data, disables the shadow,\n    uses palette 0 and sprite priority 2,\n  -\
  \ stores the halfword 0xF0 (240) through the slot list\n    (slotList_storeHalfwordAndClearField_800306C)\
  \ and clears the paired field,\n  - sets sub-entry palette bank 5 and sub-record field A 3,\n  - writes\
  \ 4 to work+8, which acts as a sub-state for later update handlers,\n  - positions the sprite at (0x78=120,\
  \ 0x28=40) via\n    sprite_setPositionById_811C23C, using the id read back from work+3\n    (i.e. the\
  \ value stored by the sprite init path, not the 0x23 tag),\n  - finishes with sprite_updateAnimPassthrough_811C22C,\
  \ whose r0-r3/flag\n    results pass straight through to this function's caller.\nThe hardcoded position\
  \ (120,40) and resource 0x69 suggest a fixed\nscreen-space GUI element (e.g. a battle/custom-screen\
  \ widget) attached to\nan object whose subsequent behaviour is selected by the 0x23 tag and the\nwork+8\
  \ sub-state.\n"
