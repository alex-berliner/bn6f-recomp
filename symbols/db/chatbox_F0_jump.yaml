name: chatbox_F0_jump
address: '0x08041ADC'
kind: function
previous_names: []
status: probable
summary: 'Chatbox text opcode F0 (jump table chatbox.s:2498): random weighted branch — opcode F0 nn w... t...: (r
  & 0x3FF) % (sum of weights w) picks which target t to jump to. Consumes (iCurrFrame & 3) + 2 GetRNG draws.'
details: 'Body (chatbox.s 4398-4507): if the low 2 bits of the opcode byte [r4+1] are 0/1/2 it takes fixed paths
  (chatbox_config_80408D0 on a stored byte, or reading/writing the last-script byte at r5+0x9C). Otherwise it draws
  (iCurrFrame & 3) + 2 GetRNG calls in a loop (4418-4428), masks the last one with (lsl/lsr 0x16) to r & 0x3FF (4429-4430),
  sums the opcode''s weights with svc 6 (SWI Div) for the modulo (4448-4454), and walks the cumulative weights to
  pick a target. A skip count of nn >> 7 (bit 7 of the opcode byte) is applied to the weight sum only when event
  flag 0x1709 is set (TestEventFlagFromImmediate EVENT_1709 at 4436-4440); with the flag clear no weight is skipped.'
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: 'Full body re-read: the draw loop, the 0x3FF mask (lsl 0x16 / lsr 0x16 keeps the low 10 bits), the svc
    6 modulo over the summed weights and the cumulative target walk are all literal in the code; the handler is
    referenced once, from the chatbox opcode dispatch table.'
  reproduce: awk 'index($0,"chatbox_F0_jump:")==1{f=1} f{print} f&&/thumb_func_end/{exit}' bn6f/asm/chatbox.s; grep -n chatbox_F0_jump bn6f/asm/chatbox.s
  result: 'the body above (lines 4398-4507) shows bl GetRNG at 4426 inside the loop bounded by r6 = (iCurrFrame & 3) + 2, the mask at 4429-4430, svc 6 at 4454, EVENT_1709 test at 4436-4437; the only other reference is chatbox.s:2498 .word chatbox_F0_jump+1 (dispatch table entry)'
