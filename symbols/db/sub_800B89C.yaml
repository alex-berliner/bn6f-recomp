name: sub_800B89C
address: '0x0800B89C'
kind: function
status: confirmed
summary: Resets a battle object's animation state, clearing its current animation frame and animation timer to 0.
interface: 'void battle_resetObjAnimState(void *battleObj /* r0 in, passed through to sub_800BF5C */); // out flags:
  c, v preserved from the sub_800BF5C call'
details: 'Takes a battle object pointer in r0 and first calls sub_800BF5C, which resolves that object''s sprite/animation
  entry (r0 passes through unchanged as its argument; the returned pointer is the anim/sprite struct used here).
  It then zeroes the byte at offset +1 (the current animation frame index) and the 32-bit field at offset +8 (the
  animation timer/frame counter). No other fields of the struct are touched, so any animation that was in progress
  restarts from frame 0 with a zeroed timer the next time it is stepped. Quirk: the two Thumb "mov r1,#0" encodings
  are MOVS and set n/z, but c and v are left exactly as sub_800BF5C returned them, so callers reading c/v effectively
  read the callee''s flags.

  '
