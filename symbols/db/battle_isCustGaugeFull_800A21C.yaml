status: probable
summary: Returns 1 when the custom gauge is at its 0x4000 maximum and the battle is running (not time-stopped,
  not over); otherwise 0.
interface: () -> r0 = 1 if the custom gauge is full, else 0
details: Calls battle_isTimeStop and battle_isBattleOver, then compares GetCustGauge with 0x4000, the
  maximum SetCustGauge / AddCustGauge clamp to. The 0x4000 it compares against is the gauge value, not
  an animation state. Callers (battle_dispatchNextPhase and two similar flow steps) pause the battle and
  switch the flow state to 0x14 when it returns 1.
