name: SoundMainBTM
address: '0x0814E02C'
kind: function
status: confirmed
summary: Zeroes the 64-byte sound work/state structure used by the sound engine.
interface: void SoundMain_ClearSoundWork64(u32 *soundWork /* r0 */)  /* r4 in and preserved (saved via r12); returns
  r0 = soundWork+64, r1-r3 = 0, Z=1 N=0 from final movs r4,#0 */
details: 'Clears 64 bytes (16 words) at the address given in r0 using four unrolled "stm r0!, {r1-r4}" blocks writing
  zeros, so r0 ends up pointing just past the cleared region. This looks like a reset/initialization of a sound
  work-area struct (channels, mixer state, or similar) at the start of or around a sound update routine. Quirk:
  r4 is temporarily zeroed and restored from r12 purely as a STM fill source, so r4 is unchanged on exit; r12 is
  used as scratch. The final "movs r4, #0" leaves Z=1, N=0. Nothing is written back to memory besides the 64 zeroed
  bytes.'
