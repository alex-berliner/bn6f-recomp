name: battle_aiAtkInitBeastOutVars
address: '0x08011DDC'
kind: function
status: probable
summary: 'Initializes the AI attack-vars block for a BeastOut-style attack: resets charge/delay/boost,
  sets extra damage, and computes the base damage from a scaled BeastOut value.'
interface: (r0 unused; r7 = AI attack vars struct) -> writes oAIAttackVars_* fields; r0 = 0x4F on return
details: Zeroes ChargeReadyFlag, ChipUseDelay and AttackBoost in the r7 AI attack-vars struct, sets ExtraDamage
  (halfword) to 0x9E (158), then calls battle_beastPwrAtk_addScaledBase_8012642 with base 0x46 (70) and
  multiplier arg 0x1E, storing the returned total into the Damage halfword. Finally sets InitFlag = 1
  to mark the vars block initialized and returns the constant 0x4F, which the caller presumably dispatches
  on. The clamped-multiplier helper means the resulting damage scales with the attacker's BeastOut multiplier
  up to a cap.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'strb/strh of 0 to ChargeReadyFlag, ChipUseDelay, AttackBoost shows this is a (re)initialization
    of the AI attack vars; mov r0,#0x9e; strh into ExtraDamage sets a fixed extra-damage term; bl battle_beastPwrAtk_addScaledBase_8012642
    with r0=0x46, r1=0x1e, result stored to Damage ties it to BeastOut scaled damage; strb #1 to InitFlag
    marks the vars block as initialized after setup; mov r0,#0x4f; pop {pc} returns a state/discriminator
    constant to its caller'
  refs:
  - bn6f/asm/asm00_2.s:6949
  - 0x08012642 battle_beastPwrAtk_addScaledBase_8012642
  reproduce: python3 tools/asmcat.py 0x08011DDC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
