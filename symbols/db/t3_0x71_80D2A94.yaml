name: t3_0x71_80D2A94
address: '0x080D2A94'
kind: function
status: confirmed
summary: State dispatcher for a type-3 battle object; calls one of three per-state handlers (init/attack pulse/destroy)
  based on the object's CurState byte.
interface: void battle_type3ObjectStateDispatch(void) /* r5 = battle object; tail-calls handler in r0=CurState,
  r1=handler addr; caller-visible results are the handler's r5/r8-r12 */
details: "r5 holds a pointer to a battle object. Its byte at oBattleObject_CurState indexes a\n3-entry table at\
  \ off_80D2AA8:\n  0: battle_initSpawnObjectCollision\n  1: battle_objectUpdatePulsingAttacker\n  2: object_genericDestroy\n\
  The selected handler is tail-called via blx-style mov lr,pc / bx r1 with r0 = CurState\nand r1 = the handler's\
  \ own address (Thumb bit set). Because lr is set to the return\naddress of this function's caller, the handler\
  \ returns directly past this function,\nso it behaves as if the caller had invoked the handler itself: r4/r7/r8/r10\
  \ pass\nthrough untouched and whatever the handler leaves in r5/r8-r12 is what reaches the\ncaller. Registers\
  \ r4, r5, r7, r8, r10 are meaningful to the handlers (r5 is the\nobject pointer); the dispatcher itself only reads\
  \ r5 and the CurState byte and\ntouches no object fields beyond it. The register contract (inputs r4 r5 r7 r8\
  \ r10 lr,\noutputs r5 r8 r9 r10 r12) reflects this pass-through dispatch rather than any\ncomputation done here.\n"
