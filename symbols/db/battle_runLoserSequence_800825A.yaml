- Why `Unk_10 = Unk_0d ^ 1` — toggle of a battle-state pair used by the post-loss path. Knowing the meaning
  of Unk_0d/Unk_10 would explain it.
- Why mode 7 specifically maps to kind 0x18 in `battle_dispatchKindEffect_801E792` (i.e. which sub-effect
