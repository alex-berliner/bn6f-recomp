status: probable
summary: 'Drives the post-loss/lose-screen battle sequence: clears the eStruct flag, flips a battle-state
  byte, swaps to the loser BGM, picks an effect timer, kicks off the "lose"-style battle intro effect,
  then finishes by flipping game-state + OW-player flags and notifying overworld state once the timer/cross-net
  gate lets it.'
interface: '(r5 = per-actor local state, r10 = ToolkitPtr) -> void ; side effects: eStruct2035280+0x40
  cleared; BattleState->Unk_10 toggled vs Unk_0d; music changed to SONG_LOSER if effects bit 0x8 set;
  battle intro effect kind 0x18 (else kind 0) dispatched; r5[+0x3] set to 4; r5[+0x8] set to 0x66 or 0x5e;
  r5[+0x4] = 2, GameState->Unk_14 = 2, eStruct200A008+0x2 = 1 on exit'
details: '- `r5` is a small per-caller state struct. Byte `r5+3` is a stage guard: when 0, the function
  runs the one-shot setup below and writes it to 4; on later calls with stage already 4 it just ticks
  the timer at `r5+8` (u16 countdown) and checks the gate at the bottom.

  - Setup: `dispatch_801DACC(0xe4c53)` then `flags_clearBits_eStruct2035280_801BED6(0xe4c53)` clears that
  eStruct flag word. Loads `Toolkit->BattleStatePtr` (offset 0x18), reads `BattleState->Unk_0d`, XORs
  with 1 and stores to `BattleState->Unk_10` (so Unk_10 = Unk_0d ^ 1).

  - Music branch: `GetBattleEffects() & 8` ⇒ `PlayMusic(SONG_LOSER)`.

  - Timer branch: `GetBattleEffects() & 2` selects the countdown at `[r5+8]`: 0x5e (94) when bit 2 is
  set, otherwise 0x66 (102). This is the wait before flipping the game-state byte.

  - Effect kickoff: `battle_getPhaseMode_800A152` → mode id saved in r4, `sub_800A8B2()` called, and if
  mode == 7 the effect kind passed to `battle_dispatchKindEffect_801E792` becomes 0x18 (the "lose/intro"
  sub-effect handler); otherwise kind 0 is used. Then `[r5+3] = 4` arms the tick-only path.

  - Tick path: decrements `[r5+8]`; if `comm_checkCrossNetBattleReady_801E754()` returns nonzero OR the
  countdown is still positive, returns. Otherwise writes 2 to `[r5+4]`, `GameState->Unk_14` (Toolkit offset
  0x3c + 0x14), and calls `eStruct200A008_setUnk02(1)` so the overworld side flips its loss flag.

  - The "f2" caller-state struct at r5 looks like: byte 0x3 stage (0→4), byte 0x4 result (set to 2 on
  completion), u16 at 0x8 countdown.

  '
