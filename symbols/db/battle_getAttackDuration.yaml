name: battle_getAttackDuration
address: '0x080F2CC2'
kind: function
status: probable
summary: Returns the battle object's current attack-duration value, with a flag-dependent alternate profile.
interface: (r0 = implicit/global battle object) -> r0 = attack duration; flags = object_getFlag flags
details: The function passes the address of a battle state/object to sub_800FE28, then calls object_getFlag
  on the returned object. If the object's flag word contains 0xA000, it adds 0x3C to the returned duration
  base. The sole caller stores the half-word result in oAIAttackVars_AttackDuration before selecting the
  target and issuing attack ID 9. The helper's argument-register setup is absent because the input is
  implicit in the global object/state access.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: ai_selectTurnPhaseAttack calls sub_80F2CC2 at 0x080F2BD4, then stores r0 as a half-word in [r7,#oAIAttackVars_AttackDuration].;
    The function calls object_getFlag and tests its result against 0xA000, selecting a value offset by
    0x3C.; The returned base is obtained through sub_800FE28 from dword_80F2CE0, indicating battle/object-state
    data rather than a purely AI-local computation.
  refs:
  - bn6f/asm/asm31.s:132721
