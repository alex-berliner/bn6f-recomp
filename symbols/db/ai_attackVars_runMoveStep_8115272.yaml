summary: One step of an AI battle object's scripted panel-by-panel move along the field
interface: (r5 = battleObject, r7 = aiAttackVars) -> void ; advances PanelXY/XY, decrements step counter,
  syncs collision
details: "Called repeatedly during an AI scripted slide/walk. Each call:\n- If the cached collision flags\
  \ carry bit pattern 0x0c000000 (\"currently moving\" / \"freeze\" pair),\n  drop the collision region\
  \ and stash the current PanelXY at AIAttackVars_Unk_38.\n- If the PanelXY has changed since the last\
  \ stashed value, re-join region 1 via object_setCollisionRegion.\n- First call (Unk_01 == 0): set Unk_01\
  \ = 1, compute the next panel in front of the object\n  (using object_getFrontDirection and PanelX/PanelY),\
  \ look up its alliance-keyed flags via\n  GetAllianceDependentPanelParamArgs + object_checkPanelParameters,\
  \ and store the resulting panel X/Y\n  into Unk_16/Unk_17 plus an RNG-derived step count (0x280000 +\
  \ Unk_30, halved) into Unk_10/Unk_12.\n- Optional sub-step (Unk_0c == 1): invoke sub_8115466.\n- Per-frame:\
  \ sub_81154B8 then sub_8115432, add XVelocity to X, and when Unk_10 == Unk_12 finalize:\n  object_setPanelsFromCoordinates\
  \ + object_updateCollisionPanels.\n- Decrement Unk_10; once it goes negative, snap PanelX/PanelY to\
  \ the cached Unk_16/Unk_17,\n  recompute world coords (object_setCoordinatesFromPanels + object_setCollisionPanelsToCurrent),\n\
  \  decrement Unk_0c, and on the last sub-step clear Unk_01 so the next call resets the move.\n- If PanelXY\
  \ never advanced, the function writes 0 into Unk_10 and 0xc into Unk_00 (likely\n  an \"idle\" sub-state\
  \ for the AI attack state machine).\n- Always calls sub_8115492 before returning.\n"
