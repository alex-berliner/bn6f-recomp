name: e_queueHandshakeAndDispatch
address: '0x0804C694'
kind: function
status: probable
summary: Queues the E-connection handshake packet and dispatches the pending event callback.
interface: (r0 = inherited context pointer, r1..r3 = inherited values) -> r0 = callback result or inherited
  r0; flags conditionally inherited from the callback path
details: This routine passes a pointer to the two-word toolkit scratch descriptor to e_queuePacketEntry,
  selecting the table that records the sequence 48 37 0C 0A 80 80 0A 06 40 0E 02 00. It then reads a flag
  from byte 0x0D of an object/structure addressed by r5. If that flag is zero, it invokes run_eStruct200a6a0_Callback_8002484;
  otherwise, it skips the callback and returns. The indirect event-handler helper clears its 0x50-byte
  event block after firing the callback.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Lines 1-3 load off_804C6AC and call e_queuePacketEntry, whose known purpose is emitting a four-byte
    toolkit packet record.; The selected data at off_804C6AC points to dword_804C6B4, whose records encode
    the fixed packet sequence including protocol bytes 0x48 and 0x37.; Lines 4-7 test caller-provided
    structure byte [r5+0x0D] and invoke run_eStruct200a6a0_Callback_8002484 only when that flag is zero.;
    The callee summary establishes that the second call fires the installed event callback and clears
    the complete event block.
