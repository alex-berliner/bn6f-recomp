name: sub_800E45E
address: '0x0800E45E'
kind: function
status: hypothesis
summary: One-line wrapper that tail-calls sub_800E468 with r0 set to 1 (a "true"/enable-style argument); purpose
  in game terms unknown until sub_800E468 is identified.
interface: void sub_800E45E(void) // no meaningful inputs in r0; tail-calls sub_800E468(1); caller-visible r0-r5,
  r8-r12, lr and carry come back from the callee
details: 'Trivial thunk: pushes lr, sets r0 = 1, then bl sub_800E468 and pops pc, so the

  return goes straight back to this function''s caller with the callee''s outputs.

  Only r0 is assigned; every other register (r1-r5, r8-r12) and the callee''s flag

  residue pass through unchanged to the original caller, so this behaves as a

  positional wrapper around sub_800E468 with a constant first argument of 1 —

  likely a boolean enable/true flag or mode selector for the callee.

  No memory, structures, or I/O are touched here; all game effect lives in

  sub_800E468. A meaningful name can only be chosen once sub_800E468''s role is known.

  '
