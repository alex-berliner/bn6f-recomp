name: SaveMenuUpdate8132C34
address: '0x08132C34'
kind: function
status: confirmed
summary: Save-menu state dispatcher; tail-calls the per-state update handler selected by the menu's state byte.
interface: void SaveMenuUpdate8132C34(r5=save-menu work area); tail-calls handler(r0=table word with Thumb bit,
  r1=state byte); handler's registers and flags flow straight back to this function's caller
details: 'R5 points to the save-menu work area; the byte at offset 2 is the current menu

  state and is used directly as a byte offset into JumpTable8132C48 (entries are

  4 bytes, so the stored value is already scaled: 0 = menu opening via

  SaveMenuOpenUpdate8132C50, 4 = menu active via SaveMenuUpdate8132C68).

  The handler address (with Thumb bit set) is loaded from the table into r0, the

  state byte goes into r1, and the call is made with `mov lr, pc; bx r0` so the

  handler''s `pop {pc}` returns to this function''s caller — i.e. the dispatch is

  fully transparent to the caller, including registers and flags. Only the two

  table states occur in play; any other state byte would load garbage from beyond

  the table.

  '
