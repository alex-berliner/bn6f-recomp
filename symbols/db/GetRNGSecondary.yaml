name: GetRNGSecondary
address: '0x0800154C'
kind: function
status: confirmed
summary: Advances the secondary RNG seed one step and stores it back to eSecondaryRngSeed.
interface: void GetRNGSecondary(void); /* leaves new seed in r0, intermediates in r1-r3, sets nz/c/v from the add
  and eor */
details: 'Steps the secondary RNG at eSecondaryRngSeed using the recurrence

  seed = ((seed << 1) + (seed >> 31) + 1) ^ 0x873CA9E5 — a rotate-left-by-1

  plus 1, then XOR with the constant 0x873CA9E5. The new value is written

  back to eSecondaryRngSeed and also returned in r0. r1 gets the XOR

  constant, r2 the doubled seed, r3 the top-bit carry, all as side effects

  of the original''s register allocation. Preserves r7 (used to hold the

  eSecondaryRngSeed pointer). The name GetRNGSecondary is already in

  game-appropriate style, so it is kept.

  '
