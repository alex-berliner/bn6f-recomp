name: battle_aiCheckPanelRangeAndDoAttack_8134930
address: '0x08134930'
kind: function
previous_names:
- sub_8134930
status: probable
summary: Checks an actor's panel position against a target's column/row index and triggers a panel-based attack
  if aligned.
interface: (r0 = HP-offset 0x24, r1 = x-offset 0xA5, r2 = alliance/whatever-offset 0x28, r3 = attacker-flag index,
  r5 = BattleObject ptr, r7 = AIAttackVars ptr) -> r0 = 0x20 if HP-bit set, 0x40 if not (or 1 on branch); calls
  sub_81171F4/sub_81171D4 on AIAttackVars
details: "Saves args on stack; r4 holds r3 (0 or 1 indicating attacker). Reads r5+0x4c (AIDataPtr? no — BattleObject's\
  \ AIDataPtr is at 0x58, so 0x4c is RelatedObject1Ptr / \"target object\").\n  Reads bitmask byte_8134994[r4*4]\
  \ (0x20 for r4=0, 0x40 for r4=1) and ANDs with [r5+0x4c]. If zero, the AI has no target for that attacker index\
  \ and the function returns without acting.\n  Otherwise it reads r5+0x18 (X coords, 16.16) as a signed halfword,\
  \ shifts <<3, and subtracts from r1 (panel-related). Also reads [r5, r3] from off_81349A0 (offsets 0x5c / 0x60,\
  \ which are Unk_5c / Unk_60 of AIData) to load two u32s and computes their difference into r2. If difference <\
  \ 0, calls sub_81171F4 with r0=1 (negative branch — likely \"set target/crow\" via flag update on AIAttackVars);\
  \ if r2 > r3-stored threshold, also calls sub_81171F4. Else multiplies r2<<4 and adds to r1 then calls sub_81171D4,\
  \ followed by sub_81171F4 with r0=0 (do-attack branch).\n  Returns r0 = 0x20 or 0x40 to the caller. sub_81353F0\
  \ is a thin wrapper that tail-calls this with fixed (0x24,0xA5,0x28) plus attacker-flag passed in.\n  Used by\
  \ battle_setupPETNavis_8135314 (caller name misleading — it's actually called from the AI update path during battle).\
  \ Pure AI panel-range decisioning.\n"
