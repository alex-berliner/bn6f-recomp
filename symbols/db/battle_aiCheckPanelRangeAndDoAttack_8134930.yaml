    - off_81349A0 entries 0x5C / 0x60 match AIData''s Unk_5c/Unk_60 offsets: `ldr r3, [r3,r2]; ldr r2, [r5,r3]`
    at sub_8134930+0x24. - `ldrsh r1, [r5,r1]` with r1=0x18 (BattleObject Coords.X) followed by `lsl r1, r1, #3`
    matches X<<3. - Caller sub_81353F0 passes (0x24=HP offset, 0xA5=..., 0x28=NameID offset) confirming r0-r2 are
    field offsets into BattleObject. - Caller lr=0x08135403 (= battle_setupPETNavis_8135314 + offset 0xEF) matches
    an AI loop call site. - Two callees sub_81171D4 and sub_81171F4 take AIAttackVars as the r2 param (saved at
    sp+0x10 from r7), writing 1 vs 0 into r0 to indicate which branch was taken.'
