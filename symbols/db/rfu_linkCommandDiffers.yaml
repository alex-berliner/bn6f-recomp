name: rfu_linkCommandDiffers
address: '0x0813D94C'
kind: function
status: probable
summary: Returns 1 if the stored current link command (eS200BC50) differs from r0, so callers only resend
  via rfu_setLinkCommand when it changed.
interface: (r0 = link command value) -> r0 = 1 if stored command != r0, else 0; flags clobbered
details: Reads the single byte at eS200BC50, which acts as the last-issued link command for the wireless
  (rfu) link state, compares it with r0, and returns 1 on mismatch, 0 on match. It writes nothing; the
  caller is responsible for updating the stored byte (presumably inside rfu_setLinkCommand). Pure comparison
  helper, 10 instructions, no other state touched.
