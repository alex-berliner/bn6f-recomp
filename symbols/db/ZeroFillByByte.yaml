name: ZeroFillByByte
address: '0x080008B4'
kind: function
status: confirmed
summary: Fills a memory range with zero bytes, one byte at a time, walking backwards from the end.
interface: void ZeroFillByByte(void* dest /*r0*/, u32 numBytes /*r1*/); flags out from the final decrement
details: 'A byte-granular memset-to-zero helper (likely part of the CRT/runtime support the game is

  linked with, hence no game-subsystem prefix fits and it already has a meaningful name).

  r0 = destination address, r1 = number of bytes to clear. The routine pushes r0-r2 and lr,

  sets r2 = 0, then loops: decrements r1 first (SUBS r1, #1), stores the zero byte at

  [r0 + r1], and repeats until the counter hits 0. Because the decrement happens before the

  store, the write walks backwards from dest+count-1 down to dest+0, and a count of 0 wraps

  around and fills 4 GiB minus one byte (a do-while with predecrement; callers are expected

  to pass a nonzero count). r2 is only ever read as the zero constant, so it is effectively

  clobber-safe, but the function preserves r0, r1 and r2 by pushing/popping them, and returns

  via pop {pc}. Flags on exit are those of the last SUBS (last iteration: 1-1 = 0, so Z set,

  C set/no borrow); the contract notes callers may branch on them.

  '
