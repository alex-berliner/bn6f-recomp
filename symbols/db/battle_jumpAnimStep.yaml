name: battle_jumpAnimStep
address: '0x0810563C'
kind: function
status: probable
summary: Runs one tick of a battle object's jump/landing step and then switches its current animation
  to id 0x14.
interface: (r0 = battle object pointer) -> r0 = clobbered by call; r5 must hold the battle object whose
  CurAnim is written
details: 'A thin state-handler thunk: it tail-delegates to battleObject_jumpLandStep_8017768 to advance
  the jump/landing sequence for the object, then unconditionally stores the byte 0x14 into the object''s
  oBattleObject_CurAnim field (via r5). This makes the jump/land motion play anim 0x14 while hopping.
  No other fields are touched and no return value is produced. The use of r5 rather than r0 suggests the
  caller keeps the object pointer in r5 across the call.'
