- method: assembly-reading
  date: '2026-10-19'
  detail: bl battleObject_jumpLandStep_8017768 at 0x0810563E delegates the per-frame hop update; mov r0,#0x14
    / strb r0,[r5,#oBattleObject_CurAnim] sets the animation byte right after the hop step; 6-instruction
    body with no branching matches a per-frame state handler pattern
