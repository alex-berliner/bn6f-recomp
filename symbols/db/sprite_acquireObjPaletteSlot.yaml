name: sprite_acquireObjPaletteSlot
address: '0x03006108'
kind: function
status: probable
summary: Returns the OBJ palette slot index for an object's 16-color palette (applying its color shader
  first) by matching the byte_3001550 cache; if no match it falls back to sub_3006428 and either marks
  the sprite dirty or installs the palette in a new slot.
interface: (r5 = object sprite struct; r0 ignored) -> r0 = palette slot index (0xF if all 15 slots are
  in use); sets object byte[3] |= 0x10 when a reload is needed
details: 'From the object sprite struct it computes the address of a 32-byte (16x BGR555) palette: [r5+0x1c]->[+4]
  + [r5+0x18] + 32*(byte[4]+byte[5]). If oObjectSprite_ColorShader is nonzero, it copies the palette to
  iPallete3001750 and calls palette_addOrSubtractColor (r0 = shader value, r2 = bit15<<2 as add/subtract
  mode, r6 = 0x20 length), then continues with the shaded copy (pop {r0}). It then linearly searches the
  15-entry palette cache at byte_3001550 (0x20 bytes per entry, tracked by count dword_200F340) comparing
  all 8 words per entry; an exact match returns that index immediately. Otherwise it calls sub_3006428;
  if r3 != 0 it marks the object dirty (byte[3] |= 0x10, [r5+0x24] = 0) and returns, else it writes the
  palette into the next free cache slot, increments the count, and returns the new index. When the cache
  is full (count >= 0xF) it returns 0xF as a failure code.'
