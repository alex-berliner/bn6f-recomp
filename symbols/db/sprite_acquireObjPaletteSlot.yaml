  date: '2026-10-18'
  detail: caller 0x3006028 is sprite_ensureGfxResident, whose summary mentions OBJ VRAM tiles and 'palette
    has an OBJ palette slot'; loc_3006128 copies 32 bytes to iPallete3001750 then calls palette_addOrSubtractColor
    with mode from ColorShader bit 15; loc_3006154 compares each 0x20-byte entry of byte_3001550 against
    the computed palette and returns the matching index r1; cmp r4,#0xF / bge loc_3006196 caps the cache
    at 15 entries and returns 0xF when full; loc_300616A sets byte[3] |= 0x10 and [r5+0x24]=0 based on
    sub_3006428's r3, then loc_3006184 stores the palette and bumps dword_200F340
