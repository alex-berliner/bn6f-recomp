  reproduce: python3 tools/asmcat.py 0x03006108
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal overall: it locates the 16-color BGR555 palette via [r5+0x1c][4]+[r5+0x18]+32*(byte[4]+byte[5]),
    conditionally applies the color shader via palette_addOrSubtractColor into iPallete3001750, linearly
    searches the byte_3001550 cache (dword_200F340 entries) and either returns the matched slot, marks
    dirty via sub_3006428, or writes a new entry. However the dirty path does NOT write a new palette
    - it returns with r0 still holding the shader-processed pointer (which is iPallete3001750), not the
    slot index; this is a bug in the proposal''s summary. The name is fine but ''sprite_acquireObjPaletteSlot''
    slightly oversells the cache-miss path which also depends on sub_3006428.; run wf investigate investigate-20261018-200615;
