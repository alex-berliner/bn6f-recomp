  then set CurAction 0x10'
interface: (r5 = battle object) -> none; writes oBattleObject_CurPhase, CurAnim, Timer, CurAction, CurPhaseAndPhaseInitialized
details: Phase 0 branch sets CurPhase to 4, CurAnim to 0xB, calls sub_80B903A (likely animation start),
  plays sound effect 0x7F (0x80 + -1), and stores timer 0x3C (60 frames) in oBattleObject_Timer. Subsequent
  calls decrement the timer until it goes negative, then set CurAction to 0x10 and clear CurPhaseAndPhaseInitialized
  to 0 so the action state machine restarts at phase 0 of the next action. r5 is a battle object struct
  using the standard oBattleObject_ layout. The unconditional phase-4 set plus fixed anim suggests a one-shot
  scripted pose (e.g. boss transformation/telegraph) rather than reusable logic.
