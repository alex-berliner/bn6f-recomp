name: ai_pickPanelByTeamFlag
address: '0x0810B6B4'
kind: function
status: probable
summary: Reads the object's panel coordinates, looks up a flag-check param via the object's alliance,
  and returns a panel from a baked relative-offset candidate list (filtered by flag) chosen by panelFlagCheck_8015D80.
interface: (r5 = battle object) -> r0 = chosen panel (or fail marker from panelFlagCheck_8015D80); flags
  from callee
details: Reads oBattleObject_PanelX/PanelY from the object in r5 and calls GetAllianceDependentPanelParamArgs
  with table byte_810B6E0, which yields the panel-flag param word and args pointer for the object's alliance.
  It then calls panelFlagCheck_8015D80 with args in r4 = byte_810B6D4, a 0x7F-terminated relative-offset
  candidate list encoding the four orthogonal neighbours (0,-1),(0,+1),(-1,0),(1,0). The picker rotates
  each candidate by the object's facing direction and returns a random candidate whose panel passes the
  fetched flag test (free/standable). Function is otherwise a thin two-call wrapper; the candidate table
  and param table are baked into its literal pool.
