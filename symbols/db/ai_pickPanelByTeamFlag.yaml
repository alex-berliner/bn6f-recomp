    (alliance-indexed panel param/flags entry); off_810B6D0 -> byte_810B6D4 candidate list = (0,-1),(0,+1),(-1,0),(1,0)
    with 0x7F terminator, i.e. the four orthogonal neighbours; bl panelFlagCheck_8015D80, the known 'filtered
