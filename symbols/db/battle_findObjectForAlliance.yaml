- method: assembly-reading
  date: '2026-10-18'
  detail: bl sub_801A4DC with sp buffer and size 0x10, result used as object count and iteration bound
    (sub_80CF7A4 lines 3-7); ldrb r2,[r5,#oBattleObject_Alliance]; lsl r2,#2; ldr r2,[r3,r2] indexes mask
    table off_80CF7E8 = {0x4000000, 0x8000000}; ldr r1,[r1,#0x30] via obj->[0x54] tests a per-object flag
    word with AND; beq skips non-matching objects; str r0,[r5,#oBattleObject_RelatedObject2Ptr]; mov r0,#1
