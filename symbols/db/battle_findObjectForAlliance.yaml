name: battle_findObjectForAlliance
address: '0x080CF7A4'
kind: function
status: probable
summary: Scans the active battle objects and stores the first one whose alliance flag word matches this
  object's alliance into this->RelatedObject2Ptr, returning whether one was found.
interface: (r5 = battle object whose oBattleObject_Alliance is tested) -> r0 = 1 if a matching object
  was stored in r5->oBattleObject_RelatedObject2Ptr, else 0
details: 'Calls sub_801A4DC with a 0x10-byte stack buffer, which is filled with pointers to active battle
  objects and returns their count (r4). It then walks that array, and for each object loads obj->0x54
  (a sub-structure pointer, skipped if NULL) and tests the word at +0x30 against a per-alliance bitmask:
  mask = table[alliance*4] from off_80CF7E8, entries 0x4000000 (alliance 1) and 0x8000000 (alliance 2),
  i.e. bit (25+alliance). On the first object whose flag word has this object''s alliance bit set, it
  writes that object''s pointer into r5->oBattleObject_RelatedObject2Ptr and returns 1; otherwise returns
  0. Quirk: the mask table is indexed starting at off_80CF7E4, so alliance 0 would read the table pointer
  itself rather than a mask, suggesting the caller only uses alliances 1/2 (or 0 means ''no lookup'').'
