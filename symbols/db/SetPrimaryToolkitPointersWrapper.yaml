name: SetPrimaryToolkitPointersWrapper
address: '0x08006C18'
kind: function
status: confirmed
summary: Trivial wrapper that tail-calls SetPrimaryToolkitPointers to set up the primary toolkit pointers, then
  returns to its own caller.
interface: 'void SetPrimaryToolkitPointersWrapper(void); // in: r3 (pass-through, purpose unknown), lr = return
  address; out: r2, r3 (pass-through), r10 hold SetPrimaryToolkitPointers'' results; clobbers r0, r1, NZCV, lr'
details: Pushes lr, BLs SetPrimaryToolkitPointers, pops the saved lr into r0 and BXs to it, so control returns directly
  to this wrapper's caller as if the call had been made to SetPrimaryToolkitPointers itself. It adds nothing except
  an extra stack frame moment (lr is saved/restored only to be used as the return target). r3 passes through untouched
  into the callee and back out to the caller. The useful outputs (r2, r3, r10) come entirely from SetPrimaryToolkitPointers,
  which sets up the primary toolkit pointers. Likely exists as a veneer/thunk inserted by the build (e.g., for a
  long-distance BL or inter-section call) rather than as a distinct gameplay function.
