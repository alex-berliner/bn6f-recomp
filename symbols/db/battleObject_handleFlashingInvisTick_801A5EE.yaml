open_questions:
- Exact semantics of ObjectFlags2 bit 0x2 (seed trigger) and the global BattleState Unk_32 bit 0 (master
  enable) — confirming them requires matching the flag names in the enum with the code's effect; the assembly
  only shows they must both be true to start the countdown.
- Whether 0x94 is the actual SFX id for "invis wears off" vs. some other SE — the constant is just baked
  into the `mov r0,#0x94`, and there is no symbol for it in the binary.
