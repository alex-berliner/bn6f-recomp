name: ow_clearEventFlagAndFreeObject
address: '0x080A8860'
kind: function
status: probable
summary: 'Termination routine for an overworld map object: clears story flag EVENT_5E0, then releases
  the object''s slot.'
interface: (r0 = overworld map object pointer, passed through to FreeOverworldMapObject) -> r0 = unchanged
  (FreeOverworldMapObject result); no meaningful flags
details: The function first loads the immediate event flag ID 0x5E0 and clears it via ClearEventFlagFromImmediate,
  marking that piece of story progress as undone, then tail-calls FreeOverworldMapObject with r0 untouched,
  so the caller's object pointer is the object being freed. FreeOverworldMapObject clears the object's
  active bit in the global allocation bitfield and detaches it from the sprite system. This looks like
  the kill/despawn handler of a specific overworld object whose presence is gated on event flag 5E0 (e.g.
  an NPC or obstacle that disappears once the flag is reset, or whose despawn condition is tied to it).
  With no known callers, the exact object identity and why the flag is cleared on despawn cannot be confirmed.
