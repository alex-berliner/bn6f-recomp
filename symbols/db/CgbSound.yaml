open_questions:
- 'byte_3007FF0 (state ptr) and the 0x40-byte channel layout: confirm they match the BGB CGB core''s internal CgbSound
  / sndstate_t exactly or are a trimmed variant.'
- The 16-entry volume LUT at byte_81C067C is used only for ch3; what builds it and does ch3 volume here differ from
  a standard NR32 mapping?
- 'SoundPWMControl micro-tuning thresholds (0x3F / 0x7F) and the 0x7FC/0x7FE masks: is this a GBA-specific PWM correction
  for the CGB sound hardware or a general emulator artifact?'
- soundChannel_tickPanVolume_814F4A0 is called but its internals are not shown here; does it handle the envelope-step
  state machine or merely compute volume from period/divisor?
