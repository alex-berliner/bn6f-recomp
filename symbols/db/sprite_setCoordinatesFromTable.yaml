name: sprite_setCoordinatesFromTable
address: '0x0811C440'
kind: function
status: probable
summary: Sets a sprite's position to a fixed base (176, 64) plus a per-index (x,y) offset pair looked
  up from the table at byte_811C460.
interface: (r0 = index into offset table) -> calls sprite_setCoordinates with r0 = 0xB0 + tbl[2*idx],
  r1 = 0x40 + tbl[2*idx+1]; r0-r3 clobbered
details: 'Indexes byte_811C460 by r0*4 and loads two signed halfwords: an x offset and a y offset. It
  adds the fixed bases 0xB0 (x) and 0x40 (y) and passes the results to sprite_setCoordinates, which writes
  them into the selected sprite sub-entry''s x/y fields. The table is a list of offset pairs dominated
  by 0 and 8 (with occasional 4, 6, 0xC, 0x10), consistent with positioning an item in a grid or column
  list spaced ~8 units apart. Note some table bytes sit in the high byte of the halfword (yielding 0x0800-style
  values), suggesting the offsets may be stored in a shifted/fixed-point coordinate format rather than
  raw pixels. The first entry is (0,0), i.e. exactly the base position. The function is a pure one-index
  positioning helper; the sole caller sub_811C2A8 is itself unanalyzed.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'lsl r2, r0, #2 + ldrsh from off_811C45C->byte_811C460: per-index pair of halfword offsets;
    mov r2,#0xB0 / mov r3,#0x40 then add to loaded values: fixed base position (176,64); bl sprite_setCoordinates:
    result is written as the sprite''s x/y coordinates; table data is mostly 0/8 pairs (4, 6, 0xC, 0x10
    also appear): grid/column spacing pattern; only caller is sub_811C2A8, which supplies just an index,
    confirming a table-driven positioning helper'
