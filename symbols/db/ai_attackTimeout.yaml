open_questions:
- No known caller, so which AI attack behaviors use this timer and what value StepTimer is loaded with
  is unknown
- The exact meaning of ObjectFlags1 bit 1<<22 (presumably 'attack hitbox active') is inferred only from
  being cleared alongside exitAttackState
