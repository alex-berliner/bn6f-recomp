name: eStruct200BC30_runStep
address: '0x0803EBFC'
kind: function
status: probable
summary: Dispatches the current step of the eStruct200BC30 sequence through its handler table and returns
  the handler's completion result; callers treat nonzero as 'step finished' and advance the state.
interface: (r0 = passthrough/unused by dispatcher) -> r0 = result of the selected step handler (nonzero
  when the step is done); flags clobbered
details: 'Loads the byte at eStruct200BC30+0x5 as an index and reads a function pointer from the table
  off_803EC10 (entries: sub_803EC1C, sub_803EC54), then does the classic ''mov lr, pc; bx r0'' long-call
  so the handler''s r0 return value becomes this function''s return. It is a state-machine step dispatcher
  for the eStruct200BC30 controller: r1 (the loaded index byte) is passed as an argument to the handler.
  Both call sites repeat the same pattern: call this, save r0, call sub_803EFA0, restore r0, and only
  when r0 != 0 write 8 to byte eStruct200BC30+0xE and return 4 — i.e. the handler returning nonzero marks
  the sequence step complete and the caller moves the controller to its next state.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1, [r5,#0x5]; ldr r0, [r0,r1]; mov lr, pc; bx r0 — indexed jump into off_803EC10 handler
    table keyed by eStruct200BC30+5; off_803EC10 holds exactly two thumb handlers, sub_803EC1C+1 and sub_803EC54+1,
    so the dispatch index selects among sequence steps; Both callers (0x0803EB46, 0x0803EB92) do push
    {r0}; bl sub_803EFA0; pop {r0}; beq return — handler result gates the state change; On nonzero result
    callers write strb 8 -> eStruct200BC30+0xE via eStruct200BC30_getRef and return r0=4, the same 'advance'
    epilogue in both
