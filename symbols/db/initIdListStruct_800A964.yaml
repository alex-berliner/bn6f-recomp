name: initIdListStruct_800A964
address: '0x0800A964'
kind: function
status: confirmed
summary: Initializes a structure by zeroing it and marking its 12-entry ID array (at offset 2) as empty (0xFF).
interface: void initIdListStruct(void *mem /* r0 */)
details: 'Takes a pointer in r0 to a record/list structure and resets it in two steps: first the body of the structure
  is cleared via ZeroFillByWord with a count of 0x50, then ByteFill writes 0xFF into the 12 bytes starting at offset
  +2, treating 0xFF as the "no entry / unused" sentinel for each of the 12 ID slots. So the structure appears to
  be a fixed-size list header plus a 12-entry ID array: the header/count fields are zeroed and all slots are flagged
  empty. r4 is used to hold the struct pointer across the calls and is preserved; r2/r3/r4 are untouched on return
  per the callers'' contract. The exact gameplay meaning of the structure (e.g. a seen/obtained record list, library,
  or flag list) is not determinable from this function alone.

  '
