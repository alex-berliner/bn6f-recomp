- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oBattleObject_PhaseInitialized with first-time init of CurAnim=1, Timer=5, PhaseInitialized=4
    (sub_80E0226 start); ldrh/sub/strh on oBattleObject_Timer with 'bgt' skip implements a frame countdown
