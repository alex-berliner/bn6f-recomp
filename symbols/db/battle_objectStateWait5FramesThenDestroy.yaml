name: battle_objectStateWait5FramesThenDestroy
address: '0x080E0226'
kind: function
status: probable
summary: 'Battle-object state handler: on entry sets anim 1 and a 5-frame timer, then counts down and
  switches the object to the destroy state when it expires.'
interface: (r5 = battle object pointer) -> updates oBattleObject_Timer and oBattleObject_CurStateActionPhaseAndPhaseInitialized;
  may set oBattleObject_CurAnim and oBattleObject_PhaseInitialized
details: 'A per-state update routine for a battle object, using r5 as the object pointer and the oBattleObject_*
  field offsets. On the first invocation (PhaseInitialized == 0) it initializes the state: sets CurAnim
  to 1, Timer to 5 (16-bit store), and PhaseInitialized to 4, marking the state initialized. On every
  invocation it decrements Timer; while the result is still positive it returns, and once it reaches 0
  it writes CUR_STATE_DESTROY into the combined CurState/ActionPhase/PhaseInitialized word, telling the
  object state machine to destroy the object. It preserves no callee-saved registers and is clearly meant
  to be called via a state-handler function pointer.'
