name: ai_attackDropObjectStep
address: '0x08105B4A'
kind: function
status: probable
summary: 'AI attack step: drops an attack object onto a target panel, then after 4 steps flags the hit.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> r0 = scratch; on first call sets up spawn,
  on later calls decrements StepTimer and sets HitElement when it reaches zero
details: First call (oAIAttackVars_AttackElement == 0) stores element 4 into AttackElement, sets oBattleObject_CurAnim
  = 0x16, copies the low bytes of oAIAttackVars_AiAttackParam and oAIAttackVars_PanelParamFlags2 into
  oBattleObject_PanelX/PanelY, then calls object_setCoordinatesFromPanels and object_updateCollisionPanels
  to place the object, and writes 0x400000 to oBattleObject_Z so it hovers above the field. It sets oAIAttackVars_StepTimer
  = 4. Later calls decrement StepTimer and, when it expires, store 0xC into oAIAttackVars_HitElement,
  presumably telling the AI-attack driver which element/attack to resolve. r5/r7 are carried in registers
  by the caller's state machine rather than passed as arguments.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne shows a first-call vs. update-call split
    on the attack state; strb r0,[r5,#oBattleObject_PanelX] / PanelY from AiAttackParam/PanelParamFlags2
    followed by object_setCoordinatesFromPanels and object_updateCollisionPanels places the object on
    a target panel; mov r0,#0x40 lsl r0,#0x10; str r0,[r5,#oBattleObject_Z] lifts the object to a fixed
    height, consistent with a falling attack; StepTimer = 4 then countdown with bgt, expiring into mov
    r0,#0xc; strh r0,[r7,#oAIAttackVars_HitElement] schedules the hit; anim 0x16 and element values 4/0xC
    match the oBattleObject/oAIAttackVars field conventions rather than generic utility code
  refs:
  - bn6f/asm/asm31.s:166841
  - 0x0800E29C object_setCoordinatesFromPanels
  - 0x0801A04C object_updateCollisionPanels
  reproduce: python3 tools/asmcat.py 0x08105B4A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-003606'
