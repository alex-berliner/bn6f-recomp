name: ai_targetOrApproach
address: '0x0810DAAA'
kind: function
status: probable
summary: 'AI handler: picks a target panel ahead via sub_8109708 and on success sets ScriptId=0xC; on
  failure steps one panel closer via sub_810DB20/DB72, also falling to ScriptId=0xC if no step is possible.'
interface: (r5 = battle object, r6 = AI state) -> r0 = result; sets oAIState_ScriptId = 0xC when a panel
  is picked
details: 'The handler reads the object''s facing multiplier via object_getFrontDirection and adds it to
  oBattleObject_PanelX, then passes PanelX, PanelY and ExtraVars+4 to sub_8109708, which picks a random
  panel relative to the object. If sub_8109708 returns nonzero, the AI state''s ScriptId is set to 0xC
  (presumably switching to an attack/action script). Otherwise it checks the object flag word for mask
  0xa000: if set it calls sub_810DB72, else sub_810DB20, both of which step one valid panel toward a target
  (Y preferred, then X, validated via object_checkPanelParameters); if the step succeeds it calls sub_810DC00
  to commit the move. If no panel could be reached, the routine just returns without changing state.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_getFrontDirection + add r0, PanelX then sub_8109708(PanelX+dir, PanelY, ExtraVars+4):
    picks a panel in front of the object; cmp r0,#0 / bne loc_810DADE: success -> strb #0xc, [r6,#oAIState_ScriptId]
    switches AI script; tst r0, 0xa000 on object_getFlag chooses between sub_810DB72 and sub_810DB20;
    sub_810DB20 (known callee) is documented as stepping one panel closer to a target, so failure path
    is movement toward target; cmp r0,#0 after the step / bl sub_810DC00 commits the chosen move panel'
