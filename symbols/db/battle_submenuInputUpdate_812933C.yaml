name: battle_submenuInputUpdate_812933C
address: '0x0812933C'
kind: function
status: confirmed
summary: 'Battle sub-menu input handler: drives cursor movement (showing each option''s dialogue), confirms
  the highlighted option (A) with a screen fade, and cancels out of the sub-menu (B).'
interface: 'void sub_812933C(u32* state_ptr /* r5 */, void* toolkit_ptr /* r10 */);

  /* reads: r5 (+0x1,+0x2,+0x3,+0xD,+0xE,+0x21), r10->joypad->Pressed (r5/r10 preserved across call) */

  /* clobbers NZCV; r0,r1,r2,r3,r6,lr */

  /* preserves r4,r7,r8,r9,r12 */

  '
details: "Skips input while IsScreenFadeActive returns true (ZF set).  Otherwise reads the\npressed-buttons\
  \ halfword from r10->oToolkit_JoypadPtr->oJoypad_Pressed and feeds it,\nalong with the current cursor\
  \ byte at state_ptr+0xD, to\nmenu_moveCursorUpDown_811FA22 (max=2, min=1).  When the cursor changes,\
  \ the new\ncursor index is stored back at +0xD and a small table at dword_81293FC\n(packed word 0x5B5A\
  \ → entries 0x5A, 0x5B) selects a chat-script id which is run\nvia chatbox_runScript_803FD9C_on_eTextScript201BA20.\
  \  Two flag-driven overrides\nfrom gameState_GetUnk74_8006DEC rewrite entries: bit0 set & script==0x5A\
  \ → 0x5F;\nbit1 set & script==0x5B → 0x60 (regional/version branches per game-state).\n\nOn A press\
  \ it plays SOUND_MENU_SELECT then branches on the cursor byte:\n  • cursor==0 (\"Exit\"): calls eStruct200BC30_setJumpOffset00(0),\
  \ writes 8/0/0/0\n    to state +1/+2/+3/+0xE and triggers SetScreenFade(0xC, 0x10).\n  • any other cursor:\
  \ writes 8 to state +2, 0 to state +0x21, same fade.\nOn B press it plays SFX 0x83, calls submenu_ConfirmExitAndFade_811FB64(0x40),\n\
  then SetScreenFade(0xC, 0x10).\n\nAfter the input block (always executed) it runs entity_runAllUpdateHandlers_80465BC,\n\
  sub_80465F8, and finally sub_812B29C(0xD) to tick the menu's update counter.\n"
