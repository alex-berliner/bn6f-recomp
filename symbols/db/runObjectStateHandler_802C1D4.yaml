name: runObjectStateHandler_802C1D4
address: '0x0802C1D4'
kind: function
status: confirmed
summary: Tiny tail-call dispatcher that jumps to one of two per-object handler routines chosen by a state byte stored
  in the object, passing the caller straight through.
interface: Next runObjectStateHandler(Object *obj /* R5 */) — reads obj->state (byte at +3), calls table[obj->state]
  with R0=obj->state, R1=handler address, LR=address of the following `pop {pc}`; NZCV and R0-R12/LR return whatever
  the chosen handler leaves in them.
details: 'Dispatches on the byte at [R5,#3], which acts as a selector/index into the two-word table at off_802C1E8:
  0 selects sub_802C1F0, 4 selects sub_802C218. The trick here is a hand-rolled tail call: after `push {lr}`, the
  code does `mov lr, pc` (landing on the address of the trailing `pop {pc}`) and `bx r1` into the Thumb handler.
  The handler therefore sees the saved LR of this function at [SP] and, when it executes `pop {pc}`, returns directly
  to sub_802C1D4''s own caller, skipping this stub''s epilogue. The handler is called with R0 = the selector byte
  and R1 = its own Thumb entry address, so the selector doubles as the handler''s first argument and the table doubles
  as self-identification. R2-R12 and the flags are passed through untouched in both directions. Quirk: the byte
  is used unmasked as an LDR offset, so any value other than 0 or 4 reads past the two-entry table and would jump
  to garbage; in practice the object''s state logic only ever stores 0 or 4 here. Effectively a two-state behavior/AI
  switch for whatever object structure R5 points at (object type not identified from this stub alone).

  '
