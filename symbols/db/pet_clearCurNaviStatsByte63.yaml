name: pet_clearCurNaviStatsByte63
address: '0x0813CD7A'
kind: function
status: probable
summary: Zeroes the byte at offset 0x63 of the currently selected PET navi's NaviStats record.
interface: (no args) -> void; writes 0 via SetCurPETNaviStatsByte(0, 0x63, 0)
details: The function simply calls SetCurPETNaviStatsByte with r0=0 (meaning current/selected navi per
  that helper's convention), r1=0x63 (byte offset within the NaviStats struct), and implicitly value 0
  in r2. The three tiny callers at 0x0813CD5C/CD66/CD70 all funnel into it, suggesting it is a shared
  clear helper invoked after some navi or PET state change. What field 0x63 holds (a flag, a counter,
  an equipped slot?) is not visible from this code, so the game-level purpose is unidentified.
