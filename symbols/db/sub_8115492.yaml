name: sub_8115492
address: '0x08115492'
kind: function
status: probable
summary: Advances the AI move-step counter and highlights the next panel in the object's move path (one panel ahead
  in its facing direction).
interface: (r7 = attackVars, r5 = battleObject, hidden) -> void; r0 destroyed, lr popped
details: Increments oAIAttackVars_AttackStepIndex; if the new value has bit 2 set (every 4th step), it returns without
  doing anything. Otherwise it calls object_getFrontDirection to get +1/-1 for the object's side/DirectionFlip,
  adds it to oBattleObject_FuturePanelX keeping oBattleObject_PanelY, and passes the object's Alliance, DirectionFlip,
  and oAIAttackVars_AiAttackParam to highlightPanelIfSomeCondition_8109660, which highlights panels from a (dx,dy)
  offset list clamped to the 6x3 grid. So each call highlights one further panel of the scripted move path, pausing
  the highlight every 4th step.
