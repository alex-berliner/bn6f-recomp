name: battle_objectWait20FramesUpdate
address: '0x080E6B64'
kind: function
status: probable
summary: Battle-object phase handler that waits 20 frames, then ends the object's action (CurAction=8)
  and clears its phase.
interface: (r5 = battle object, r0 unused) -> void; no flags relevant
details: If oBattleObject_PhaseInitialized is 0, it stores 4 there and loads oBattleObject_Timer with
  0x14 (20 frames), returning immediately. Otherwise it decrements the timer each call; while positive
  it does nothing more. When the timer reaches 0 it writes CurAction=8 and zeroes CurPhaseAndPhaseInitialized,
  signaling the phase/action is finished. This is a state-machine step run every frame while the object
  is in this phase; it uses no other fields or callees.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oBattleObject_PhaseInitialized + 'mov r0,#4; strb' arms the one-shot init (asm 2-6);
    'mov r0,#0x14; strh [r5,#oBattleObject_Timer]' sets a 20-frame countdown (asm 7-8); timer is decremented
    with 'sub r0,#1; strh; bgt' until it expires (asm 11-14); on expiry 'mov r0,#8; strb [r5,#oBattleObject_CurAction]'
    plus zeroing CurPhaseAndPhaseInitialized ends the state (asm 15-17)
