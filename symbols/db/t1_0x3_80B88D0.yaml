name: t1_0x3_80B88D0
address: '0x080B88D0'
kind: function
status: confirmed
summary: Battle-object state machine dispatcher that jumps to one of three handlers based on the object's CurState
  (init default sprite, sync sprite from related object, or free the object).
interface: void t1_0x3_80B88D0(u32 object /*r5*/, u32 r10); outputs r5/r8/r9/r10/r11/r12 depend on the selected
  handler
details: "Reads oBattleObject_CurState (byte) from the battle object passed in r5 and uses that raw\nvalue as an\
  \ index into a 3-entry jump table at off_80B88E4:\n  state 0: battle_initObjectDefaultSprite\n  state 1: battleObject_syncSpriteFromRelatedObject_80B8932\n\
  \  state 2: object_freeMemory\nThe handler is invoked with lr set to the return address in this function (mov\
  \ lr, pc before\nthe computed branch), the object still in r5 and the state byte in r0. It is a tail-call-style\n\
  dispatcher: r10 passes through untouched and the r5/r8-r12 register results are whatever the\nchosen handler leaves\
  \ behind. No bounds check on the state byte, so any CurState value > 2\nwould index past the table. The three\
  \ handlers suggest this object type is a sprite-following\nbattle entity (e.g. a visual effect or helper tied\
  \ to another object) whose lifecycle is\ninit -> per-frame sync -> free.\n"
