name: next_exitToMap_811F728
address: '0x0811F728'
kind: function
status: confirmed
summary: Coroutine step that abandons the current game mode and transitions back to the overworld map (EnterMap
  subsystem), resetting the chatbox on the way.
interface: void next_exitToMap_811F728(Toolkit *toolkit /*r10*/); // r5 passed in and preserved; returns to caller's
  continuation via lr (pop {pc}); r0-r3 and flags clobbered
details: 'Reads the toolkit from r10 and performs a mode switch to the map: writes 4 to the byte pointed to by oToolkit_MainJumptableIndexPtr
  (offset 0), selecting main state cbGameState_80050EC; then writes 0 to gameState->oGameState_SubsystemIndex so
  that state runs the EnterMap subsystem (subsystem index 0). Stores 0x40 (halfword) into the header field of the
  RenderInfo pointed to by oToolkit_RenderInfoPtr (toolkit offset 8) — likely a screen/render mode or fade flag.
  Plays sound effect 6 via sub_80015FC, then calls sub_809F68C (chatbox state reset) and chatbox_8040818 (refresh/redraw
  the text window), and finally clears chatbox event flag 0x40 via chatbox_clear_eFlags2009F38. It is a Next-style
  coroutine: lr holds the resumption point and the function returns with pop {pc} rather than a plain branch link
  chain.

  '
