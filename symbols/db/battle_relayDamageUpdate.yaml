name: battle_relayDamageUpdate
address: '0x080D95B0'
kind: function
status: probable
summary: Per-frame update that takes normal damage and relays the HP delta to the object two levels deep
  in RelatedObject1 chain (RelatedObject1->RelatedObject1), destroying itself or its partner chain when
  battle ends, partner dies, or damage returns -1.
interface: (r5 = battle object ptr, r0-r3 scratch) -> r0 = clobbered; updates HP, collision region, and
  CurState of r5 and its RelatedObject1
details: Runs the standard destruction preamble (removeCollisionData, spawnCollisionEffect), then bails
  out setting CUR_STATE_DESTROY if the battle is over or sub_80D9690 (likely a partner-dead/HP-zero check)
  says so. If the collision flags (bits 0x0C000000 of oCollisionData_FlagsFromCollision) are set it clears
  the object's collision region, then refreshes its pixel coordinates from panels and updates collision
  panels. It calls basicHandleBattleObjectDamage_801156A; a -1 return means it zeroes the RelatedObject1's
  HP, clears its own collision region, and enters CUR_STATE_DESTROY. Otherwise it stores its new HP, computes
  oldHP-newHP, and subtracts that delta from the RelatedObject1-of-RelatedObject1's HP, clamped to 0,
  then calls sub_80D9638 (likely effect/state update) and object_presentCollisionData.
