summary: bytestring helper that copies two bytes from a caller's record into fixed offsets 0x84/0x88 of a destination
  struct, advances the source pointer, and returns 1 (true).
interface: void* sub_80428FC(void* r4, void* r5) -> int r0 (r4 preserved/incremented; nz/c/v clobbered)
details: 'Reads byte at [r4+2] and [r4+3], writes them as 32-bit stores to [r5+0x84] and [r5+0x88]

  respectively. Then bumps r4 by 4 (skipping the two read bytes plus two padding/header bytes)

  and returns 1 in r0 with NZ flags set. The destination offsets 0x84/0x88 likely correspond to

  width/height or a pair of small integer fields in a sprite/struct header (consistent with the

  use of [r5+0x84] as a stride-like pair). Called from a streaming/record loop where r4 is a

  cursor through a packed byte stream and r5 is the object being populated.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
