name: object_setCollisionRegion
address: '0x0801A07C'
kind: function
status: confirmed
summary: Stores a region index byte into a battle object's collision data and returns the collision data pointer.
interface: void object_setCollisionRegion(u8 region /* r0 */, struct BattleObject* obj /* r5 */) -> struct CollisionData*
  /* r1 */
details: Loads the object's collision data pointer from oBattleObject_CollisionDataPtr, writes the region index
  (r0) as a byte at collisionData + oCollisionData_Region (offset 1; no named macro exists for this field yet),
  and returns the collision data pointer in r1 as a convenience. Very small leaf helper; r5 is used as the object
  base register (this part of the code passes the object in r5 rather than r0), and lr is returned to directly via
  mov pc, lr.
