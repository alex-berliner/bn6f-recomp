name: ow_spriteObjectUpdate
address: '0x080A9D86'
kind: function
status: probable
summary: 'Per-frame update for an overworld sprite object: dispatches to its type''s handler via jump
  table, then runs sprite_update.'
interface: (r5 = overworld object struct, byte at +9 = type id) -> jumps to handler from off_80A9DA4,
  then bl sprite_update; no return value used
details: 'Uses r5 as the object pointer (r5-calling convention). It reads the type byte at [r5,#9], indexes
  a 5-entry dispatch table at off_80A9DA4 (handlers: object_timerStateTick, sub_80A9DFE, sub_80A9E48,
  e_decelRiseUpdate, sub_80A9EB6), and calls the handler with the long-call sequence (mov lr,pc / bx r0).
  After the handler returns, it unconditionally calls sprite_update so the object''s sprite animation/render
  state advances each frame. The function is called from ow_initSpriteObject, meaning it is registered
  as the update callback for newly spawned overworld objects.'
