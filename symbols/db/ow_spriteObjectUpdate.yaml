name: ow_spriteObjectUpdate
address: '0x080A9D86'
kind: function
status: confirmed
summary: Per-frame update for one overworld sprite object — dispatches to a state handler selected by the object's
  state byte, then advances its sprite animation.
interface: void ow_spriteObjectUpdate(r2 param, r5 object /* r10, lr also live in */); callers see r2 r3 r8 r9 r10
  r11 r12 back; nz c v clobbered
details: "r5 points at the overworld sprite object being updated. The state byte at\nobject+9 indexes the 5-entry\
  \ jump table off_80A9DA4:\n  0: object_timerStateTick\n  1: beastsp_updateMotion\n  2: object_tick8SetState\n\
  \  3: e_decelRiseUpdate\n  4: sub_80A9EB6\nThe dispatch is a tail-style table call executed on the live guest\
  \ registers:\nr1 = the state byte read from object+9, r2/r5/r10 pass through unchanged, so\nwhatever the handler\
  \ leaves in r2/r3 and r8-r12 flows straight to this\nroutine's callers (r8 is explicitly saved/restored around\
  \ the dispatch by\nthe original's push {r4}/pop {r4}/mov r8,r4 pair). After the state handler\nreturns, sprite_update(r5)\
  \ is called to advance the object's animation\nframe; its r0-r3/flag results are forwarded, with r2 and r3 being\
  \ the values\ncallers read back. The handler set (timer tick, set-state-after-tick,\ndecel-rise enemy motion,\
  \ beast-sprite motion) suggests this is the generic\nupdate entry used for overworld NPC/enemy sprite objects\
  \ that run small\nstate machines plus standard sprite animation.\n"
