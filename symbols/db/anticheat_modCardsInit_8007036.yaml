name: anticheat_modCardsInit_8007036
address: '0x08007036'
kind: function
status: confirmed
summary: Fills the 256-byte card-modification anticheat table with random bytes and a hidden complemented shadow
  copy for later tamper detection.
interface: void anticheat_modCardsBuildXorTable_8007036(void); // clobbers r0, flags; preserves r1-r7; reads the
  shadow buffer pointer from r10 + oToolkit_Unk2005038_Ptr
details: 'Builds the 256-byte table at byte_2000670 used by the card-modification (ModCards) anticheat check. Iterates
  the table top-down from index 0xFF to 0; for each index it calls GetRNG repeatedly until the resulting byte (RNG
  byte XOR 0x8D) is nonzero, i.e. the raw RNG byte must not be 0x8D. The visible table byte_2000670 stores entry
  ^ 0x8D''s result byte, while a hidden shadow buffer (fetched via oToolkit_Unk2005038_Ptr from the toolkit struct
  in r10) stores the bitwise complement (~entry). The two copies can later be cross-checked to detect memory tampering
  with the card-modification data. The 0x8D XOR makes 0x8D itself an impossible table byte, guaranteeing every entry
  is nonzero after XOR. Preserves all of r1-r7 by pushing them (it is called from arbitrary contexts where those
  are live). Returns nothing; register contract lists r2/r3 as outputs only because callers happen to read them
  back from preserved registers.

  '
