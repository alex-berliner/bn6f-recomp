summary: 'Proposed name: beastSpGfxTiles. Beast-Out SP sprite tile graphics uploaded to VRAM 0x6006C00
  by the SP GFX queue routine. (table of u32)'
details: Lives in ROM at 0x08619730, 1056 bytes (0x420 / 4 = 0x108 u32 words), the source buffer for a
  queued VRAM tile transfer. The sole referencing function, init_queueBeastSpGfx, passes its address as
  the source to QueueEightWordAlignedGFXTransfer with destination 0x6006C00 and size 0x420, which is the
  GBA tile/sprite area used for the Beast-Out SP portrait. The non-zero words at +0x24 onward are 4bpp
  tile data (two pixels packed per byte, palette-indexed), consistent with 0x420 bytes of tile graphics.
