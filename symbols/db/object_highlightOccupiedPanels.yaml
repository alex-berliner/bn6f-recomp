- battlesweep
open_questions:
- Exact meaning of the low-3-bit mask (is any nonzero bit sufficient or is only bit 0 valid?)
- What the high nibble passed in r1 selects in object_highlightPanel (highlight color/type?)
- Which caller sub_810831C is and what object type owns the +0x34 panel list
- 'The loop bound is `cmp r4, #2 / ble`, so r4 iterates 0..2 (three entries) and reads bytes at r7+0x34,
  r7+0x35, r7+0x36 — correct. However, `lsl r0, r0, #0x1d; lsr r0, r0, #0x1d` extracts the low 3 bits
  (mask 0x7), not just bit 0. So the gate is whether the low 3 bits are nonzero, and r1 is the high nibble
  (0..15) passed to the callee. The summary''s ''bit 0 (low 3 bits masked)'' is correct, but the one-line
  ''whose flag bytes are set'' is loose; better to say it calls highlightPanel for each panel index whose
  low-3-bit occupancy flag is nonzero.'
