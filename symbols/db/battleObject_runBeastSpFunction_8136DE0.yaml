summary: Run a saved function table entry for the Beast-SP context, saving/restoring AIData timer fields
  across the call
interface: '(r0 = beast-sp subsystem object ptr, r1 = 0x28) -> r0 = ? (caller treats as unknown); side
  effects: writes EWRAM 0x2009398..0xC and calls one of 0x24 dispatch targets then invokes beastsp_dispatchHandler_81356D4'
details: "Stack-only helper. On entry r10 is the Toolkit (r7 = [r10+0x34] SubmenuPtr, r1 = [r10+4] which\
  \ is\n  ParamWord from somewhere; here r1 holds a short-lived 6-byte scratch pointer).\n  It first copies\
  \ three u16s (offsets 0, 2, 4) from the scratch pointer into EWRAM\n  byte_2009390+0x8..+0xC (the AIData\
  \ Unk_40/Unk_44 area used by the BeastSp code), then\n  zeroes those three u16s in the scratch. It reads\
  \ `byte` from byte_2009390, indexes\n  off_8136E28 with it (a 36-entry thunk table at 0x08136E2C, all\
  \ `sub_xxx+1` Thumb addresses)\n  to call a Beast-SP state function via `mov lr,pc; bx r0` (ARM/Thumb\
  \ switch), then invokes\n  beastsp_dispatchHandler_81356D4 with r10 restored, and finally restores the\
  \ three saved\n  halfwords back into the scratch.\n  The 36 dispatch targets (sub_8136EE4 … sub_81375CC)\
  \ and the use of byte_2009390 for dispatch\n  identify this as a continuation/exec wrapper for the Beast-SP\
  \ state machine used in Beast Out.\n  Captured calls show entry r0=08136DE1 (Thumb bit set, confirming\
  \ the caller PCs to 0x08136DE0),\n  r1=0x28 (the size/scratch byte count passed via r1), exit r0=0xfc00/0xfc02\
  \ which is the canonical\n  default JOYPAD mask (high bits only), suggesting the indirected function\
  \ may end by returning\n  that or by ASLEEPing; the caller then uses r0+offs_81356D4 logic. (8hex addr\
  \ without 0x.)\n"
