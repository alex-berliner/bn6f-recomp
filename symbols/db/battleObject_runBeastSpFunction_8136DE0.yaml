name: battleObject_runBeastSpFunction_8136DE0
address: '0x08136DE0'
kind: function
status: confirmed
summary: 'Per-frame tick of the Beast SP dialog state machine: saves the 3-halfword dialog triple from the battle
  object, dispatches the active dialog handler via a 36-entry jump table, runs the beast-SP handler dispatcher,
  then restores the triple.'
interface: void battleObject_runBeastSpDialogStep(void /* inputs r2 r4 r6 r9 r10 r11 r12 -> outputs r8 r9 r10 r11
  r12; preserves r4 r5 r6 r7 */);
details: '[r10] is the battle-object pointer; [r10+4] is a linked toolkit holding a 3-halfword dialog triple (offsets
  0, +2, +4 – likely dialog-id, page, sub-state).  The triple is copied into a scratch area at byte_2009390 (fields
  at +8, +a, +c) and the live copy is zeroed so the handler sees a clean slate.  byte_2009390 itself (the first
  byte) indexes a 36-entry thumb-mode jump table at off_8136E2C whose entries are chatbox, navicust, and beast-dialog
  helpers (e.g. navicust_showDialogStore8, navicust_advanceBeastEventDialog, chatbox_writeState30IfFlag80Clear,
  navicust_runObjectDialogScript, beastOutDialogDelayStep, navicust_queueBeastOutDialog, navicust_finalizePieceDrop,
  etc.). After the selected handler returns (invoked with mov lr,pc; bx r0 so flags/r0-r3/r8 are clobbered), the
  function reloads the owner pointer from [r10+0x34] and calls beastsp_dispatchHandler_81356D4.  Finally the saved
  triple is written back into the toolkit at [r10+4].  r11 and r12 pass through the handler and dispatcher untouched
  in most cases; the dispatcher may return updated values in r8-r12 which propagate to the caller.  A secondary
  data table at off_8136EC8 (dword_86E55FC, 0x6014800, 0x100, byte_86E56FC, byte_3001590, 0x20) is present but not
  referenced by this code path.

  '
