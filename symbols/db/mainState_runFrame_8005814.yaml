name: mainState_runFrame_8005814
address: '0x08005814'
kind: function
status: confirmed
summary: 'Per-frame main loop dispatcher for the current game state: runs all state handlers, then if
  no screen fade is active also drives chatbox/overlay updates and the reset-and-jump-to-state-28 path.'
interface: void sub_8005814(void);  // no usable inputs/outputs; trashes r0-r3, r7, lr; preserves r4-r6
details: 'Tail of the main loop, called once per VBlank/frame. Issues a fixed sequence of

  guest subroutines in order: dispatch_80339CC (likely the per-frame game-state

  dispatch), then a chain of subsystem ticks (sub_80039AA, sub_8003AFA,

  sub_80027B4, sub_800286C, sub_8003BF4, sub_8003E98, npc_drawSprites_800467C,

  sub_8004298, sub_8004590, sub_8004934) and finally event_runArmedCallback_80024AE

  (fires any armed one-shot script callback). After that it reads the screen-fade

  status via IsScreenFadeActive; only when no fade is in progress does it call

  the chatbox updater chatbox_8040818, an overlay/helper sub_811F6E0, and

  mainState_resetGameAndGoto28_8005524 ("reset game and go to state 28",

  matches the title-screen / soft-reset flow). No globals beyond those touched

  by the callees are referenced here; r4-r6 are preserved across the whole

  sequence, so this is a frame coordinator rather than a state mutator.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
