open_questions:
- The `add r0,r0,r0` doubling looks like an authoring bug or an intentional *2 (giving 0x1E0,
- not 0xF0). Worth confirming in the surrounding module whether 0xF0 or 0x1E0 is the intended
- seed.
- The +2 caller (0x080da8b4) is a different function that just falls into this code at a known
- point; without its full body we can't tell whether this routine is the *only* self-destruct
- timer for this object type, or whether the +2 entry is a hot-path shortcut. Naming the
- function after the alias caller (rather than +0) would settle it.
