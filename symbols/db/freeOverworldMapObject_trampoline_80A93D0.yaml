name: freeOverworldMapObject_trampoline_80A93D0
address: '0x080A93D0'
kind: function
status: confirmed
summary: Tail-call trampoline that frees the overworld map object whose handle is passed in r5, forwarding all callee
  results untouched.
interface: void sub_80A93D0(r5=mapObject) — tail call; returns whatever FreeOverworldMapObject leaves in r0-r3,
  r5 and the n/z/c/v flags
details: 'A pure two-instruction wrapper: push {lr} / bl FreeOverworldMapObject / pop {pc},

  i.e. a thumb tail call. It forwards r5 (a map-object handle/pointer) as the sole

  argument to FreeOverworldMapObject and lets that callee''s r0-r3, r5, lr and N/Z/C/V

  flag state reach its own caller unchanged. No state of its own is touched and no

  registers are preserved beyond what the callee does. Since the callee is

  FreeOverworldMapObject, this is almost certainly a destructor/cleanup callback

  (e.g. an object-descriptor or script handler slot) used where a "delete this map

  object" action is needed but a function pointer, not a direct call, is required.

  Callers can effectively treat it as FreeOverworldMapObject(r5).

  '
