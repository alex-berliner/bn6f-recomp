name: battle_objectTickAction3_80E4A4C
address: '0x080E4A4C'
kind: function
status: confirmed
summary: Ticks a battle object's queued action — starts action/animation 3 when none is queued, otherwise
  ends the action via sub_8016C9C once the sprite's 0x80 (animation end) frame flag fires.
interface: void sub_80E4A4C(battle object in r5); returns r5 unchanged; lr clobbered, flags clobbered
details: 'Expects the battle object pointer in r5 (preserved on exit). If oBattleObject_CurAction is 0
  (no action queued), it writes 3 into oBattleObject_CurAction and 3 into oBattleObject_CurAnim, launching
  both the action and its matching animation in one step. If an action is already queued, it calls sprite_getFrameParameters
  (object still in r5) and tests the returned frame parameter bits for 0x80, the animation-finished flag;
  when set it calls sub_8016C9C, the generic action-completion handler, to wrap up the current action
  (likely advancing the object''s state or clearing the action slot). Hard-codes action/anim id 3, so
  this is the tick handler for one specific action type rather than a general-purpose action dispatcher.
  Flags nzcv are treated as clobbered by the lifter only because of the tst/cmp; the callee side effects
  come from the sprite calls.

  '
