name: reqBBS_81409D0
address: '0x081409D0'
kind: function
status: hypothesis
summary: Returns input % random_byte, using BIOS Div (svc 6) with a freshly rolled 0..255 divisor.
interface: u32 randMod_81409D0(u32 dividend /* r0 */);
details: 'Fetches a 32-bit random value from GetRNG, masks it down to a byte (0..255)

  and uses it as the divisor of the GBA BIOS Div call (svc 6), with the

  caller''s r0 in r6 serving as the numerator. The remainder (BIOS Div places

  it in r1) is then moved into r0 and returned. push {r6,lr} / pop {r6,pc}

  only exists to preserve the caller''s r6; r7 is marked preserved but never

  touched. Clobbers the BIOS Div result registers r2/r3 and the nz/c/v flags.

  Name "reqBBS" in the existing symbol does not appear to relate to in-game

  behavior; the function looks like a generic utility helper rather than a

  BBS/messaging routine.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
