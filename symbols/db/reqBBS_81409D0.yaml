name: reqBBS_81409D0
address: '0x081409D0'
kind: function
status: confirmed
summary: 'Returns a random number in 0..n-1 for n in r0: (GetRNG() & 0xFF) % n, by BIOS Div (svc 6); a
  general helper the overworld map objects use, not a BBS routine.'
interface: u32 randomBelow(u32 n /* r0 */) -> r0 = r1 = (GetRNG() & 0xFF) % n; clobbers r2, r3, nz c v
details: 'BIOS Div takes r0 = numerator, r1 = denominator and returns r0 = quotient, r1 = remainder. Here
  r0 = GetRNG() & 0xFF and r1 = the caller''s argument (kept in r6 across GetRNG), so the result (r1,
  moved to r0) is the random byte modulo the argument: random(n) in 0..n-1. The earlier text of this entry
  had the operands swapped ("input % random byte"); the readable C was right (it calls the BIOS), but
  its comment in cport/src/game/reqBBS.c still says r0 = denominator. Callers: the map object routines
  in asm29.s, e.g. the Mr. Weather comp tornado draws its direction with reqBBS_81409D0(8) (owMapObject_weatherTornado_pickDirection_80A9004).
  Proposed name randomBelow_81409D0. The rename waits in symbols/pending_renames.txt: the subsystem farm''s
  worktrees share bn6f and still hold copies of the C that names this symbol, so renaming now would break
  their builds. Callers (all 4 bl sites): pickBBSMsgForMapGroup_80A5764 as random(4),
  branched on MapGroup 0x85 (the JudgeMan trial''s map group); sub_80A8394 as random(8) into the
  byte_80A8510 table; and the type-0x1A tornado''s pick/repick as random(8). The doc''s claim that map
  object types 5/0x11 call it is unverified: sub_808CBD8 (the type-0x11 spawner) calls
  reqBBS_setFlag_e17b0f7_8140A00, not this routine (BN6F_SYMBOLS.md section 1).'
