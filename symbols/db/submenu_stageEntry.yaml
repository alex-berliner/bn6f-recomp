name: submenu_stageEntry
address: '0x0804AB6C'
kind: function
status: probable
summary: 'Menu A-button handler: either copies the highlighted entry from the navicust/extra list (word_202A020)
  into a slot indexed by +0x28 in unk_202A3E0, or copies an entry from a different source list into the
  first empty slot of word_202A020, decrementing its embedded remaining-count; when the target count at
  eS200AC80+0x30 is reached it calls sub_804AF10(2 or 8), sets the state byte to 0xC, and resets +0x3C
  to 0x7FFF.'
interface: '(r0 = menu-state struct, used as r5: +0x44 list id, +0x46 entry index, +0x28 staged count,
  +0x1e/+0x24 counters, +0x2a/+0x2e offsets, +0x3c timer, +0x44/+0x48 anim words) -> r0 = 0; sets struct
  state byte +0x00 = 0xC on completion'
details: 'Reads a list id at [r5+0x44], indexes dword_804ACB0 to get the source list base, and selects
  entry [r5+0x46] (0x20-byte entries). The entry''s halfword field +0x14 holds (remaining_count << 16)
  | id: if the list base differs from word_202A020 and the high half is 0 (or the +0x14 halfword itself
  is 0 when the entry IS in word_202A020), it plays a ''can''t pick'' buzzer and aborts. Otherwise it
  scans word_202A020 in 0x20-byte strides for the first empty slot (first halfword zero), copies the 0x20-byte
  entry there via CopyByEightWords, decrements the stock count in the entry, and updates counters: [r5+0x1e]
  with wrapover past 7 into +0x24, and [r5+0x28] minus ([r5+0x2a]+[r5+0x2e]). When the stock hits zero
  the entry is retired via sub_804AD98/ADE0/ADB0. When the local count reaches the global target at [eS200AC80+0x30]
  it calls sub_804AF10(2 or 8), sets the state byte to 0xC, resets the +0x3C timer to 0x7FFF and clears
  +0x44/+0x48; otherwise it just refreshes via sub_804ADD0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: Entry has a 0x20-byte stride everywhere (mul r0,#0x20 for index, CopyByEightWords size 0x20),
    typical of chip/item records; tst on [r7,#0x14] / high half of [r7,#0x14] with SOUND_CANT_JACK_IN
    on failure = checking remaining stock before allowing the pick; Copy into word_202A020 + r4 where
    r4 is the first slot whose lead halfword is zero, then sub r6,#1 stored back = stock decrement into
    a staging area; cmp r0,#7 / sub r0,#7 / strh [r5,#0x24] shows a 7-per-page cap with overflow counter;
    cmp global [eS200AC80+0x30] with [r5+0x1e], then sub_804AF10(2 or 8) and state byte 0xC = finishing
    when the required total is staged
  refs:
  - bn6f/asm/asm03_2.s:8407
  - 0x0804AB10 sub_804AB10
  - 0x0804AF20 sub_804AF20
  - 0x08000950 CopyByEightWords
  - 0x080005CC PlaySoundEffect
  - 0x08000900 ZeroFillByEightWords
  reproduce: python3 tools/asmcat.py 0x0804AB6C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code branches on whether the source list base equals word_202A020: if equal, it copies from
    the source into unk_202A3E0 (at index [r5+0x28]) and increments +0x28; if not equal, it scans word_202A020
    for an empty 0x20-byte slot and copies the source entry there, decrementing r6 (remaining count) and
    on reaching zero also calling sub_804AD98/ADE0/ADB0 and decrementing +0x28. The proposal conflates
    these two cases (e.g., claiming word_202A020 is always the destination and that stock decrement always
    happens) and mislabels +0x28 as ''staged count'' in one case and stock count in the other. The function
    does set [r5] = 0xC and writes 0x7FFF to +0x3C, but the proposal''s interface detail about +0x44/+0x48
    ''anim words'' cleared to zero matches. Name ''takeEntryFromStock'' is close but the dual-path behavior
    is better described.; run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
