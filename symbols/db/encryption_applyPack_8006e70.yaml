name: encryption_applyPack_8006e70
address: '0x08006E70'
kind: function
status: confirmed
summary: Re-encrypts one byte of the pack (item) buffer, writing the byte from table byte_20008A0 XOR-0x81 into
  the pack data.
interface: 'void encryption_packDecodeByte_8006e70(u32 index /* r0: byte offset within pack data */)'
details: 'Reads the raw/cipher byte at byte_20008A0[index], XORs it with 0x81, and stores the result into packBuffer[index].
  The pack buffer base comes from Toolkit.unk_2004C20, which is reached via the Toolkit pointer held in r10 (loaded
  as [r10 + oToolkit_Unk2004c20_Ptr]) — so callers must set r10 to the Toolkit base; r10 itself is only read. All
  other registers (r0-r7) are pushed/popped untouched, so the routine has no register outputs besides memory. The
  flags are clobbered (cmp via the xor''s nz update in the lifter''s view), but the push/pop wrapper means this
  is invisible to callers. The 0x81 XOR key matches the standard BN save data obfuscation pattern; byte_20008A0
  appears to be a plaintext/scratch copy of the pack data indexed in parallel with the encrypted buffer.

  '
