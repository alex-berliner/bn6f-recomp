name: ai_attackHitElementBranchTable
address: '0x080FFE26'
kind: function
status: probable
summary: Battle-AI dispatcher that jumps to a per-element handler selected by the AI attack struct's HitElement
  byte.
interface: (r7 = pointer to AI attack vars struct) -> r0 = HitElement value passed to selected handler
  (r1 clobbered); tail-returns handler result
details: 'Reads the byte at [r7,#oAIAttackVars_HitElement] and uses it as an index into the four-entry
  table at off_80FFE38, then tail-calls the selected routine (lr=pc, bx). Entries: three element-specific
  subs (sub_80FFE48, sub_80FF72, sub_80FFEC0) and ai_attackTimerTick as the fourth/default slot, so an
  element value of 3 falls back to the normal attack-timer tick. The callee receives the element value
  in r0 while r7 still points at the vars struct, so handlers can read further AI attack fields. This
  is a plain branch-table dispatch; it holds no state of its own.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0, [r7,#oAIAttackVars_HitElement] then ldr r1,[r1,r0]: table index is the hit-element
    field; table off_80FFE38 mixes three unnamed element subs with known ai_attackTimerTick, implying
    element-specific attack behavior vs default; mov lr,pc / bx r1 is a Thumb-mode tail-call dispatch,
    no state kept in this stub; recorded routes battlesweep/beastsp/chips are all battle-AI execution
    contexts, matching the ai_ prefix of the known callee'
  refs:
  - bn6f/asm/asm31.s:153746
