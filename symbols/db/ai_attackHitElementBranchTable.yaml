name: ai_attackHitElementBranchTable
address: '0x080FFE26'
kind: function
status: confirmed
summary: AI attack-state dispatcher that tail-calls one of four handlers selected by the attack work area's HitElement
  byte.
interface: void ai_attackHitElementBranchTable(r5, r6, r7 = AI attack vars ptr, r10); returns via chosen handler
  (r1,r5,r8,r9,r10,r11,r12 whatever the handler leaves; r7 preserved); clobbers r0-r6, nzcv, lr
details: 'Reads the HitElement byte from the AI attack work area at [r7+oAIAttackVars_HitElement] and

  uses it as a byte offset (not a shifted index) into the branch table at off_80FFE38, which

  holds four handler entry points (thumb, +1): ai_attackDelayHit, sub_80FFE72, sub_80FFEC0,

  ai_attackTimerTick. It then performs a hand-rolled tail call: `mov lr, pc` followed by

  `bx r1` jumps to the handler with lr pointing just after the branch, so the handler''s own

  `pop {r7,pc}` epilogue returns directly to this function''s caller — a classic THUMB

  dispatch idiom that also keeps this frame''s saved r7 live. Because the handlers keep

  working state in r5-r12 across the call, those registers are effectively live in/out

  (contract shows r1,r5,r8-r12 as outputs); typed C cannot express this call. HitElement is

  also left in r0 for the handler, and the table pointer stays in r1 at the moment of the

  branch. Effectively this is the per-element/per-hit-variant state router for the AI''s

  attack sequence: the "HitElement" byte tracks which attack-hit stage/element state the AI

  is in, and each of the four states advances the attack differently.

  '
