name: eStruct2035280
address: '0x02035280'
kind: ram
previous_names: []
status: probable
summary: 'The battle screen''s HUD state: the HP box''s shown HP at +0x24 (a copy of MegaMan''s, updated on hits
  and heals), its tile position, and the redraw/request bits.'
details: 'Fields read from the code (s_2035280_struct in bn6f):

  - +0x01 / +0x02: the HP box''s tile column and row (chatbox_drawHPNumber_801C906 passes +1 + 1 and +2 to CopyBackgroundTiles).

  - +0x03: index of the digit graphics block (x 0x20) that routine queues.

  - +0x24 (u16): the HP the box shows. Written only by battle_eStruct2035280_postEvent_801E0A0 and sub_801E0BC,
  both copying [+0x48]->+0x24 (the battle object''s HP); so the box changes on those events (a hit, a heal), not
  when the object''s HP changes by itself.

  - +0x40: request bits (eStruct2035280_SetRequestBits_801BECC; the post-event routine ORs 0x80).

  - +0x44: callback bits: runFlaggedCallbacks_801BF64 calls off_801BF88[k] for each set bit k, lowest first; bit
  7 is chatbox_drawHPNumber_801C906 (the HP box), bit 2 battle_renderHpOverlays_801C202.

  - +0x48: pointer to the battle object whose HP the box shows (MegaMan''s in the battles vidsync looked at).

  '
