name: object_spawnMirroredObjectPair
address: '0x080E83FC'
kind: function
status: probable
summary: Spawns two kind-0x99 battle objects at two panels using data from a helper-filled struct, mirroring
  the second one's flip bit.
interface: (r5 = source battle object) -> r0 = 0; sets PhaseInitialized=4 on the source object
details: First call sub_80E84D0 fills an 8-byte stack struct (panel x/y pairs, a halfword each). If it
  succeeds, the function spawns object kind 0x99 at panel (struct[0],struct[1]) with halfword struct[2]
  as an argument, copying the source object's element, Z16 and damage+Z16 fields, and passing r5+6 as
  the link struct. If struct[4] is nonzero, a second object is spawned at panel (struct[4],struct[5])
  with r5+7 as link, and its DirectionFlip bit is XORed with 1, i.e. horizontally mirrored relative to
  the first. It then marks the source object PhaseInitialized=4 so the spawn only happens once, and if
  both Param3 and Param4 of the source are zero, resets it to CurAction=0xC, phase 0. This is a one-shot
  'spawn a pair of mirrored entities at panels' step in an object's action script.
