name: sub_81325E4
address: '0x081325E4'
kind: function
status: hypothesis
summary: Returns the byte at dword_81325F0[r0], a small 3-byte lookup table (data at 0x081325f0 = 0x100C08).
interface: uint8_t sub_81325E4(uint32_t index /* r0 */); // returns byte in r0, scratch in r1; no flag effects beyond
  index -> R0
details: 'Loads the address of the constant dword_81325F0 into r1 via the pool entry off_81325EC, then reads a single
  byte at [r1 + r0] and returns it. The table holds 3 bytes (0x08, 0x0C, 0x10) per the 24-bit literal at 0x081325f0,
  so valid r0 values are 0..2. Looks like a simple index-to-value mapping used by callers; the meaning of the returned
  byte is determined by the callers (e.g. chip damage offset or similar scaling). No other side effects, no flag
  usage.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
