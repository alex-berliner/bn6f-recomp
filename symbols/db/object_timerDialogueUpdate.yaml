name: object_timerDialogueUpdate
address: '0x0812A028'
kind: function
status: probable
summary: 'Per-frame object update: draws the object''s sprite if flagged, counts down a timer, and on
  expiry switches state and runs text script 0x5E; also checks sub_813D648 each frame to branch into an
  alternate state.'
interface: (r5 = object state struct) -> void; sets [r5+1]/[r5+2] state bytes and [r5+0x10] substate when
  timer expires, r0 clobbered
details: This is a state-machine tick for an entity whose context pointer is in r5. Each frame it calls
  sprite_drawIfFlagSet_812B504 (renders via sub_811FAF4 only when bit 4 of [r5+0x1B] is set), then decrements
  the 16-bit timer at [r5+0x28]. When the timer reaches zero it writes 0x44 to [r5+1], 0 to [r5+2], and
  5 to [r5+0x10] (state/substate fields), then calls chatbox_runScript_803FD9C_on_eTextScript201BA20 with
  script index 0x5E to pop up dialogue. Every frame it also calls sub_813D648 and, when that returns zero,
  takes a different transition, writing 0xC to [r5+1] and 8 to [r5+2]. The [r5+1]/[r5+2] pair looks like
  a two-byte state/phase selector consumed by a dispatcher elsewhere.
