name: ai_restartAttackAnimOnLoop
address: '0x081135A4'
kind: function
status: probable
summary: When the current attack animation reaches its end frame, rewind it to frame 0 and reload the
  AI attack timer/hit element so the attack repeats.
interface: (r5 = battle object, r7 = AI attack vars; sprite_getFrameParameters args already set) -> void;
  sets oBattleObject_CurAnim=0, oAIAttackVars_StepTimer=AttackDuration, oAIAttackVars_HitElement=0xC when
  anim-end flag set
details: Calls sprite_getFrameParameters and tests bit 0x80 of the attribute byte, the animation-end/loop
  marker. If clear, it returns without touching state, so this runs every frame of the attack. On end,
  it zeroes the object's current animation index so the animation restarts, copies oAIAttackVars_AttackDuration
  into oAIAttackVars_StepTimer to re-arm the per-step delay, and writes 0xC (12) into oAIAttackVars_HitElement,
  re-declaring the attack's hit element. This produces a looping attack animation with periodic hit windows
  for beast-form AI attacks (routes battlesweep and beastsp).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst r0, #0x80 after sprite_getFrameParameters gates all writes: only fires on the animation-end
    frame attribute; strb r0,[r5,#oBattleObject_CurAnim] with r0=0 restarts the object''s animation from
    the first frame; ldrh/strh pair copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer,
    re-arming the attack step delay; strh #0xC into oAIAttackVars_HitElement re-applies the attack''s
    element for the next pass; recorded routes battlesweep/beastsp (Beast Over forms) match a looping
    repeated-hit beast attack helper'
