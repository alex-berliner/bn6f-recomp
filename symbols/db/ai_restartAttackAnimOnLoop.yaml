name: ai_restartAttackAnimOnLoop
address: '0x081135A4'
kind: function
status: confirmed
summary: If an AI attacker's current animation frame has the "loop end" bit set, restarts the attack animation from
  frame 0 and reloads the attack timers.
interface: 'void ai_restartAttackAnimOnLoop(battleObject* obj /*r5*/, AIAttackVars* aiVars /*r7*/); out: r1 = 0x80;
  clobbers r0-r3, flags (C/V), lr'
details: 'Calls sprite_getFrameParameters with the battle object in r5, tests the returned frame parameters against
  0x80 (the loop-end/end-of-animation flag), and if set: stores 0 to obj->oBattleObject_CurAnim (restarts the animation
  at its first frame), copies aiVars->oAIAttackVars_AttackDuration into aiVars->oAIAttackVars_StepTimer (rewinds
  the step timer to the attack''s full duration), and stores 0xC into aiVars->oAIAttackVars_HitElement (resets the
  hit element to its default value). Does nothing otherwise. Quirk: r1 is always left holding the test mask 0x80
  on return, matching the original''s register usage. The data words/bytes after the function (jump tables and per-entry
  timing tables like 0x14/0x28/0x50... and 0xC/0xA/0xA...) belong to adjacent AI attack routines, not this one.'
