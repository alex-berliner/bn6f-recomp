name: camera_followOverworldPlayer
address: '0x08099DAC'
kind: function
status: confirmed
summary: Commands the camera subsystem to follow the overworld player by passing mode 1 and the player-object position
  field (+0x1C) to the camera write helper.
interface: void camera_followOverworldPlayer(r10 = toolkit); -> r0 = 0, nz set, r2 from callee; clobbers c v r0
  r1 lr; preserves r4 r5 r6 r7
details: Reads oToolkit_GameStatePtr from r10, then oGameState_OverworldPlayerObjectPtr from that game-state block.
  Adds 0x1C to the player-object pointer (the field holding the player's map/position data consumed by the camera).
  Calls camera_writeUnk03_14_80301b2 with r0=1 (follow mode) and r1 = playerObj+0x1C. The callee returns a value
  in r2 which the contract lists as an output. The function then zeroes r0 and returns. The surrounding data at
  0x08099DC0 onward are cutscene-script byte sequences unrelated to the function body.
