name: camera_followOverworldPlayer
address: '0x08099DAC'
kind: function
status: probable
summary: Cutscene-called native that points the camera's tracking struct at the overworld player object
  (value 1), presumably re-locking the camera onto the player.
interface: (r0 unused on entry) -> r0 = 0; reads r10 toolkit, no flags meaningful
details: Loads the toolkit from r10, follows GameStatePtr -> oGameState_OverworldPlayerObjectPtr, and
  takes the object + 0x1C (its camera-related sub-struct). It calls camera_writeUnk03_14_80301b2 with
  r0=1 and that pointer; the callee writes a byte and a word into the camera struct and leaves the pointer
  in r2. The function always returns 0. It sits at the head of a cutscene-script blob for the beastsp
  route and is meant to be invoked via cs_call_native_with_return_value, alongside other natives like
  sub_8099E3C that also poke GameState/camera-adjacent fields. The literal 1 suggests an enable/mode flag
  rather than data.
