name: battle_objectIsOffStoredPanel
address: '0x0810BD40'
kind: function
status: probable
summary: Returns whether a battle object's current panel differs from the panel saved in its fields 0x60/0x61
  (1 = moved off it, 0 = still on it).
interface: (r0 unused; r5 = battle object pointer) -> r0 = 1 if PanelX/PanelY != [r5+0x60]/[r5+0x61],
  else 0; flags clobbered
details: Loads the object's stored panel coordinates from offsets 0x60 (X) and 0x61 (Y), then reads its
  current position via oBattleObject_PanelX and oBattleObject_PanelY. If both pairs match it returns 0
  (object is on the recorded panel), otherwise 1 (it has moved off that panel). The result register r4
  is seeded to 1 and only cleared when both comparisons pass, so it behaves as an 'is off panel' predicate.
  r5 is used directly without being taken from r0, so the caller must have the object in r5; r0 is ignored
  despite being passed. Fields 0x60/0x61 are presumably a 'home' or 'target' panel pair written elsewhere
  in the KillrEye AI.
