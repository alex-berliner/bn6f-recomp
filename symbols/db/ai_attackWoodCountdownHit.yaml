name: ai_attackWoodCountdownHit
address: '0x080FC772'
kind: function
status: probable
summary: 'Enemy AI attack step: arms a wood-element attack with AttackDuration frames of delay, then flags
  the hit (HitElement=0x18) when the timer expires.'
interface: (r7 = oAIAttackVars struct, no args in r0-r3) -> r0 clobbered; no return value
details: 'Reads oAIAttackVars_AttackElement from the struct at r7: if it is 0, this is the initialization
  pass, so it writes element 4 (wood) into AttackElement and copies oAIAttackVars_AttackDuration into
  oAIAttackVars_StepTimer. On subsequent calls it decrements StepTimer each frame; when the count reaches
  0 it stores 0x18 into oAIAttackVars_HitElement, which the shared AI battle logic presumably consumes
  as the actual attack/hit. Until the timer expires, HitElement is left untouched. AttackElement remaining
  nonzero is what distinguishes ''attack already armed'' from ''not yet armed''.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne: zero means first call -> setup branch;
    mov r0,#4; strb r0,[r7,#oAIAttackVars_AttackElement]: arms attack with element 4 (wood); ldrh r0,[r7,#oAIAttackVars_AttackDuration];
    strh r0,[r7,#oAIAttackVars_StepTimer]: delay = AttackDuration frames; sub r0,#1; strh ...; bgt locret:
    per-frame countdown of StepTimer; mov r0,#0x18; strh r0,[r7,#oAIAttackVars_HitElement]: on expiry
    sets the hit marker 0x18'
