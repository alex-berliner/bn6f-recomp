name: sub_80027B4
address: '0x080027B4'
kind: function
status: hypothesis
summary: Writes 1 to the flag word at dword_200F350, likely marking some shared engine state (e.g. a sprite/resource
  table) as loaded or ready.
interface: void sub_80027B4(void) — takes nothing (only lr), returns nothing; clobbers r0 and r1.
details: Trivial two-instruction setter. Loads the address dword_200F350 (inside the A_eS200F348_Size work area
  at 0x200F348) and stores the constant 1 into it, then returns. No branches, no other registers touched. The area
  around 0x200F348 looks like a global engine/sprite work block, so this is most plausibly a "mark table X as loaded/available"
  toggle, but nothing in this function alone says which system owns the flag. No flags are meaningful on return
  beyond what the ldr/str/mov leave set (callers appear to ignore them).
