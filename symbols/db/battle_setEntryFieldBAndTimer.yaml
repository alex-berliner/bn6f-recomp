name: battle_setEntryFieldBAndTimer
address: '0x0802E1BE'
kind: function
status: probable
summary: 'On entry indexed by [r5+Alliance] in the unk_2036120 record table, writes r4 into byte+0xB and
  a flag-dependent halfword timer (+0x2E): 0x1E0 if battle flag 0x40 is clear, 0x168 if set.'
interface: (r0 = [r5+oBattleObject_Alliance] entry index, r4 = byte value to store) -> entry[0xB] = r4,
  entry[0x2E] = 0x1E0 or 0x168; r0 = entry pointer (clobbered), no meaningful return
details: 'Calls battle_testFlag0x40_800A8F8 and selects a halfword constant: 0x1E0 (480) if battle flag
  0x40 is clear, 0x168 (360) if set — likely a frame timer, shorter when the flag is active. It then computes
  the 0x1D0-stride entry of the table at unk_2036120 for index [r5+oBattleObject_Alliance], writes the
  caller''s byte r4 into entry+0xB, and the chosen timer into entry+0x2E. r5 is an unmodified object pointer
  from the caller, so this reads another object''s alliance field to pick the record. The meaning of entry+0xB,
  entry+0x2E, and flag 0x40 is not established here.'
