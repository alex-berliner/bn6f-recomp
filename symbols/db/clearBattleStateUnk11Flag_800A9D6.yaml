name: clearBattleStateUnk11Flag_800A9D6
address: '0x0800A9D6'
kind: function
status: confirmed
summary: Clears the requested bits of the current battle state's Unk_11 flag byte.
interface: void battle_clearStateUnk11Flags_800A9D6(u32 mask /* r0 */); clobbers r1, returns r3 = pointer to the
  BattleState
details: 'Reads the toolkit (r10), loads the current BattleState pointer from

  oToolkit_BattleStatePtr, then does a bit-clear (bic) of r0 against the byte at

  oBattleState_Unk_11 and stores it back. r3 is left pointing at the BattleState

  (a side value callers could use, though it is likely incidental). No flags other

  than nz (set by mov/bic) are meaningful; no memory allocation or other state is

  touched. The meaning of the Unk_11 bits is not yet known.

  '
