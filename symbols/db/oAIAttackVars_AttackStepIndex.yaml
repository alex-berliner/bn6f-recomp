name: oAIAttackVars_AttackStepIndex
address: '0xf'
kind: struct-field
status: probable
summary: Counter/index that tracks the current step or repetition within a multi-phase AI attack
details: 'The field is repeatedly incremented with `add r0, #1; strb r0, [r7,#oAIAttackVars_Unk_0f]` and
  compared against thresholds like 3 or 4 (asm31.s:130501, asm32.s:14489, asm32.s:9331) to gate progression.
  It is also used as an offset into a panel-delta table (`sub r1, #1; ldrsb r2, [r1,r3]` at asm31.s:132466),
  and combined with StepTimer shifted left 8 to build panel coordinates for attack effects. However, several
  accesses treat it as a fixed initializer (0, 1, 3, 4) or copy it to CurAnim, so the meaning is not perfectly
  uniform across all sites — hypothesis status warranted.'
