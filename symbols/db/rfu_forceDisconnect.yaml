name: rfu_forceDisconnect
address: '0x081461D8'
kind: function
status: probable
summary: Forces an rfu disconnect request while temporarily flagging the link struct busy, used by the
  connection state machine to tear down a link.
interface: (r0 = connection id/cid, passed through to rfu_REQ_disconnect) -> r0 = rfu_waitREQComplete
  result; flags from callee
details: Saves the byte flag at eStruct200FE00+0xE, writes 1 into it, calls rfu_REQ_disconnect with the
  low-byte-masked r0, then rfu_waitREQComplete, and finally restores the original flag byte before returning.
  The save/set/restore of the 0xE flag around the REQ suggests it is a busy or callback-enabled marker
  that must read as 'busy' so the connection event handler at 200FE00 doesn't act on events during the
  forced shutdown. Only the flag byte and the REQ queue are touched; no other struct fields are modified.
  Callers are all branches of rfu_handleConnectionEvent, i.e. states that need to drop the link immediately
  (search timeout, link error, teardown).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r5,[r4,#0xe] / strb 1 / ... / strb r5,[r4,#0xe] — flag at 200FE0E forced to 1 around the
    disconnect (asm lines 4-10); bl rfu_REQ_disconnect + bl rfu_waitREQComplete — issues and waits for
    a disconnect REQ (asm lines 8-9); ldr r4, off_81461F8 =eStruct200FE00 — operates on the rfu connection
    struct the dispatcher owns; all 6 callers are sites inside rfu_handleConnectionEvent, whose summary
    is advancing/clearing connection states; r0 is only lsl/lsr #0x18-masked and untouched otherwise,
    so it is forwarded as the disconnect argument (likely cid)'
