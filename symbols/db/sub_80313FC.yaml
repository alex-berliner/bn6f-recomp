name: sub_80313FC
address: '0x080313FC'
kind: function
status: hypothesis
summary: Runs a fixed three-call sequence (step handler, a 0x20/0x20/0x20/1 parameterized setup, and a 0-arg call)
  and then sets bit 1 of the caller's state word in r12.
interface: 'void sub_80313FC(void /* r0, r1, r2, r5: passed through and preserved; r12: in/out state word */); returns
  updated state in r12 with NZ flags set from it'
details: A small state-machine "step" helper. It first calls sub_8031176 (no arguments set up by this wrapper, so
  it presumably works on whatever r0-r2/r5 hold from the caller, all of which are preserved across the whole function).
  It then calls sub_8030F7C with the fixed parameter set r2=0, r3=0x20, r4=0x20, r5=0x20, r6=1 — the repeated 0x20
  (32) values look like dimensions/counts or a default fill/setup configuration. Next it calls sub_80310B0 with
  r0=0. Finally it ORs bit 1 (value 2) into the state word passed in r12 and returns that updated value in r12,
  leaving the NZ flags reflecting it so the caller can branch on the new state. The pushed r0-r2/r5 are only used
  to restore the caller's values on exit, i.e. this wrapper is side-effect-transparent to those registers. Without
  identifying the three callees, the subsystem (cutscene, battle, sprite, etc.) is unknown; the bit-1 set suggests
  this is one phase of a multi-step sequence that signals completion/advance by flipping a state bit.
