name: ai_getBossAttackDelay
address: '0x08100500'
kind: function
status: probable
summary: 'Returns a boss attack timing value: base selected from table dword_8100520 via sub_800FE28 indexed
  by difficulty tier, with 0x3C added if the object''s first flag word has bits 0xA000 set.'
interface: () -> r0 = timing value (base from table dword_8100520 via sub_800FE28, +0x3C if object flags
  & 0xA000); flags not significant
details: Loads the address of dword_8100520 (bytes 0x28, 0x24, 0x20, 0x1C, i.e. 40/36/32/28) and passes
  it to sub_800FE28, which presumably indexes it by the current difficulty tier read from game state;
  the selected value is kept in r4. It then calls object_getFlag to fetch the first flag word of the current
  battle object's collision data and tests it against 0xA000 (bits 13 and 15); if set, 0x3C is added to
  the result. Returns the summed value in r0. Its only caller, ai_bossAttackInit, uses it while setting
  up attack timing/boost parameters for a boss AI attack.
