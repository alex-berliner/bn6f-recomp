name: battle_getRelatedObjectHp
address: '0x080DFDC8'
kind: function
status: probable
summary: Returns the current HP of a battle object's RelatedObject1, which is 0 if that object is dead.
interface: (r5 = battle object) -> r0 = RelatedObject1's HP (0 when HP is 0); flags clobbered
details: Loads the pointer at oBattleObject_RelatedObject1Ptr from the battle object in r5, reads the
  halfword HP field (oBattleObject_HP) of that related object, and returns it in r0. If the HP is zero
  it explicitly returns 0; otherwise it returns the raw HP value, so the branch is functionally redundant
  (returns HP either way). Uses r5 rather than a register argument, so it expects to be called with r5
  already holding the battle object. No other state is touched and no callees are made.
