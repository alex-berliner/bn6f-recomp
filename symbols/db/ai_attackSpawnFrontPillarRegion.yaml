name: ai_attackSpawnFrontPillarRegion
address: '0x080EDBCC'
kind: function
status: probable
summary: 'AI attack handler: while its step timer counts down it spawns a collision region on the panel
  column in front of the enemy (wider pattern at high difficulty), then cleans up when the timer expires.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = undefined; modifies oAIAttackVars_StepTimer
  and oAIAttackVars_HitElement
details: 'Each call decrements oAIAttackVars_StepTimer; when it underflows past zero the attack ends:
  if oBattleObject_RelatedObject1Ptr is set, sub_80E5D3E is called (likely to despawn the attack object)
  and HitElement is set to 8. Otherwise it picks a variant (r6=2, or 4 if NaviStats byte 0x22 for the
  object''s alliance is nonzero) and a constant pair (0x2C05FF04, or 0x2C05FF11 when AiDifficultyTier
  >= 3), then calls object_spawnCollisionRegion at panelX + 2*frontDirection, panelY with r2=5, r3=0 and
  extra stack args. It then walks a column of 3 panels (y, y+1, y+2) via object_getPanelDataOffset, loading
  each oPanelData_Type byte. On difficulty tier >= 3 it repeats the panel scan for a second adjacent column
  (x+dir, y-1..y+1). Notably the loaded dword constants, r6 variant, and the panel-type bytes are all
  effectively unused in this routine''s visible flow (r4/r6/r3 are reassigned), suggesting the effect
  lives in the spawned collision region / related object rather than here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r7,#StepTimer] / ldrh r1,[r7,#ChargeCycles]; sub r0,#1; blt -> cleanup path with HitElement=8
    (0x080EDBCC-0x080EDC68); bl GetBattleNaviStatsByte_AllianceFromBattleObject with r1=0x22 selects variant
    r6=2 vs 4 (0x080EDBDC); bl object_getFrontDirection; add r0,r0 + oBattleObject_PanelX, then bl object_spawnCollisionRegion
    with r2=5,r3=0 (0x080EDBF6-0x080EDC16); loop calls object_getPanelDataOffset and reads oPanelData_Type
    for 3 panels stepping y by 1 (0x080EDC1E-0x080EDC2C); AiDifficultyTier>=3 path repeats the 3-panel
    scan at x+frontDirection, y-1; dword_80EDC70/C74 select 0x2C05FF04 vs 0x2C05FF11 by difficulty (0x080EDBF0,
    0x080EDC3A)
  refs:
  - bn6f/asm/asm31.s:116342
  - 0x08013774 GetBattleNaviStatsByte_AllianceFromBattleObject
  - 0x0800E2CA object_getFrontDirection
  - 0x0800C90A object_getPanelDataOffset
  reproduce: python3 tools/asmcat.py 0x080EDBCC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-230610'
open_questions:
- No caller is known, so how r5 (battle object) and r7 (AI attack vars) are set up and which AI dispatch
  table selects this handler is unconfirmed
- What object_spawnCollisionRegion does with r2=5/r3=0 and the stack args, and what 0x2C05FF04/0x2C05FF11
  were meant to configure (they load into r4 but are dead), is unknown
- What sub_80E5D3E does on cleanup and what HitElement=8 means in the AI state machine
- Why the oPanelData_Type reads are discarded — the real per-panel effect may have been optimized into
  the spawned region
