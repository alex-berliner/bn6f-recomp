name: battle_chatboxWaitAndFade
address: '0x0803AF46'
kind: function
status: probable
summary: 'Battle transition step: if the chatbox event bit (0x80) is set, returns after calling battle_moduleInit;
  otherwise if chatbox state is nonzero, writes step 0x28 and returns; once cleared, calls SetScreenFade(0xC,
  0x10), writes step 0x3C, and always calls battle_moduleInit_803A820.'
interface: (r5 = work/context struct, byte at +1 = step field) -> void; sets flags via chatbox bit test
details: 'Reads the chatbox/event flag word (eFlags2009F38) testing bit 0x80: if still set, it only runs
  battle_moduleInit_803A820 and returns. Otherwise it checks the chatbox state selector; while it is nonzero
  it writes step 0x28 into the work struct''s step byte (r5+1). Once the chatbox is done it calls SetScreenFade(0xC,
  0x10) to fade the screen, writes step 0x3C to the same field, and finally always invokes battle_moduleInit_803A820.
  The 0x28/0x3C byte values look like state/step IDs of the caller''s task loop, with 0x28 meaning ''chatbox
  still running'' and 0x3C ''proceed with fade''.'
