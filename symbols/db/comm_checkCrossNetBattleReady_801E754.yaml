name: comm_checkCrossNetBattleReady_801E754
address: '0x0801E754'
kind: function
status: confirmed
summary: Checks whether the cross-net (double/linked battle) state flag is set and whether the linked partner session
  has reached the expected mode, returning 0/1/2 accordingly.
interface: 'u32 sub_801E754(void) — takes no meaningful inputs (r1/r2/lr are scratch, r1 and r2 preserved); returns
  in r0: 0 = bit 15 of dword_20352C0 clear, 1 = flag set but partner state doesn''t match, 2 = flag set and partner
  mode == 4. C/V are left from the caller''s last flag-setting instruction (carry clear on the early-exit path);
  N/Z reflect the last test.'
details: 'Reads the word at eStruct2035280+0x40 (dword_20352C0) and tests bit 15 (mask built as 1<<15), which appears
  to be a "cross-net battle active" flag in the shared/comm event structure. If the bit is clear it returns 0 immediately.
  Otherwise it looks at the link/comm state block at byte_2036840: byte_2036848 (offset 8, likely a session/mode
  slot) must be 4 or 2 for anything further to happen; if it is, the function then checks byte_2036840 (offset 0,
  likely the current partner/phase mode byte) and returns 2 when it equals 4, else 1. If byte_2036848 is neither
  4 nor 2 it returns 1. In short: 0 = no cross-net battle flagged, 1 = flagged but partner not in the expected mode,
  2 = flagged and partner mode reached 4. Purely a state query — no writes, no I/O. Only r0 is a real output; r1
  and r2 are saved/restored purely as caller-save conveniences on Thumb, and the final returned C/V flags are incidental
  side effects of the flag tests.

  '
