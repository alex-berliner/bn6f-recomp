name: sub_80CAC58
address: '0x080CAC58'
kind: function
status: confirmed
summary: Spawns a type-0x36 battle object, links it to a source object (alliance/direction inherited) and a secondary
  related object with a back-pointer, and marks it active.
interface: "void sub_80CAC58(u32 extraVars, u32 elemOrMisc, u32 related1Payload, u32 element,\n                \
  \ u32 sourceObj, u32 relatedObj2Ptr, u32 damageDisabler /*r7*/)\n  -> bool (V cleared), newObj in r2, related1Payload\
  \ in r3, sourceObj in r5\n  clobbers: r0, r1, N/Z/C\n  preserves: r4, r6, r7, lr\n"
details: "Allocates a new battle object via object_spawnType3 with type 0x36. The\nasymmetric push {r0-r2,r5} /\
  \ pop {r1-r3,r5} shifts caller registers so\nthat after the pop: r1=caller.r0 (extraVars), r2=caller.r1, r3=caller.r2\n\
  (element), r5=source object. If spawn succeeds the new object's fields are\ninitialized:\n  oBattleObject_ExtraVars\
  \                    <- caller.r0\n  oBattleObject_Element (byte)              <- caller.r2\n  oBattleObject_RelatedObject1Ptr\
  \             <- source object (r5)\n  oBattleObject_DamageAndStaminaDamageCounterDisabler <- caller.r6\n  oBattleObject_AllianceAndDirectionFlip\
  \     <- copied (word) from source\n  oBattleObject_RelatedObject2Ptr            <- caller.r7\n  [r7]        \
  \                               <- back-pointer to new object\n  oObjectHeader_Flags                       |=\
  \ 0x10 (active/in-battle bit)\nThe new object pointer is returned in r2; r3 returns the inherited\nalliance/direction\
  \ value; flags V cleared (no overflow on final ADDS).\nUses asymmetric push/pop as a register shuffle trick to\
  \ preserve caller's\nr0-r2 across the spawn call.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
