  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The unconditional write of 0xFF to [r6+0x1C] and unconditional call to battleObject_beastSpAdvanceAndDrawTiles_8119A48
