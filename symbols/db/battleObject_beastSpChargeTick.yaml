- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r6,#0x13] / tst / bne guards the call to sub_81199E4 — a state flag gates the tick;
    ldrh r0,[r6,#0x1C]; cmp r0,#0xFF; beq skip — 0xFF sentinel on the counter skips the step; mov r0,#0xFF;
    strh r0,[r6,#0x1C] — counter is stamped with the sentinel after the step; bl battleObject_beastSpAdvanceAndDrawTiles_8119A48
    — known gauge advance/redraw runs every call; Called from sub_81199A0 on recorded beastsp routes —
    context is the Beast SP gauge system
