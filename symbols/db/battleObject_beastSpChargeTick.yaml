name: battleObject_beastSpChargeTick
address: '0x081199C0'
kind: function
status: probable
summary: 'One Beast SP charge tick: if [r6+0x13] is set and the halfword at [r6+0x1C] is not 0xFF, runs
  the increment step via sub_81199E4; then unconditionally consumes the tick by writing 0xFF to [r6+0x1C]
  and advances/redraws the bar via battleObject_beastSpAdvanceAndDrawTiles_8119A48.'
interface: (r6 = Beast SP gauge/entity struct) -> r0 = from callee; [r6+0x1C] = 0xFFFF; no meaningful
  return
details: Reads a state flag at [r6+0x13]; if it is clear AND the halfword counter at [r6+0x1C] is not
  0xFF, calls sub_81199E4, which likely performs the actual increment/decrement of the charge state using
  that counter (the 0xFF value acts as an 'already done / disabled' sentinel). It then writes 0xFF into
  [r6+0x1C] to consume/mark the tick, and unconditionally calls battleObject_beastSpAdvanceAndDrawTiles_8119A48
  to advance the bar strip by one step and redraw it. The [r6+0x13] flag seems to gate whether the timer
  step runs on this pass. Caller sub_81199A0 presumably invokes this once per frame or per qualifying
  event.
