details: 'Thin wrapper that sets up three scan arguments (0x64, 0x13, 0x18) and tail-calls FindBattleActorsWithNonzeroParam_ReturnCountAndSum,
  returning its count/sum unchanged. Its only known user, the Swordy variant at 0x810B49C, compares the
  returned value to <=3 before rolling RNG and launching attack id 0xC, implying the result encodes proximity/panel
  span to a target (likely the player) rather than a plain boolean. The three constants are opaque without
  the callee''s internals: 0x64 is presumably a param/field id and 0x13/0x18 shape the search area or
  column bounds. Quirk: it preserves no state and takes no input, so the scan is fully parameterized by
  these constants.'
