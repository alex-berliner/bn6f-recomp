name: ai_beginAnchoredAttack
address: '0x081113DE'
kind: function
status: probable
summary: AI script step that arms a version-scaled attack (duration 24, damage/extra-damage from per-version
  tables) and, when a condition holds, blocks sliding and launches attack 0x0A.
interface: (r4 = AI/battle object, r5 = battle object, r6 = AI state, r7 = AI attack vars) -> r0 = 0;
  r6 AIState_ScriptId cleared to end the script step.
details: 'Exits early (clearing oAIState_ScriptId, the standard step-end) if the object''s flags disallow
  acting or if FindBattleActorsWithNonzeroParam(0x60,0x6D,0x72) finds any matching actor, so it won''t
  retrigger while such actors exist. Otherwise it loads attack variables: AttackDuration=0x18, Damage=byte_8111374[version],
  ExtraDamage=byte_811137C[version], StepTimer=0xC, where version comes from oAIData_Version_16. It calls
  sub_81116D2; if true, it stores (version<<4)|result into oAIAttackVars_AttackBoost2, sets oBattleObject_ExtraVars=1,
  ORs OBJECT_FLAGS_CANNOT_SLIDE into the object''s ObjectFlags1, and issues attack id 0x0A via object_setAttack0.
  The param filter 0x60/0x6D/0x72 suggests it scans for a specific spawned entity/obstacle tied to this
  attack.'
