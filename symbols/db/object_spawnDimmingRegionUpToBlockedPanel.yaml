name: object_spawnDimmingRegionUpToBlockedPanel
address: '0x080C20B4'
kind: function
status: probable
summary: Scans the battle-object's panels forward one tile at a time until a panel flagged for the object's
  alliance (e.g. hole/broken/enemy-side) is found, then spawns a dimming collision-region object there.
interface: (r0 = battle object in r5 (Alliance/PanelX/PanelY/Element/ExtraVars read)) -> r0 = result of
  object_spawnDimmingCollisionRegion; destroys r4-r7, flags clobbered by calls
details: Reads the object's Alliance to index byte_80C2108 (player mask 0x05080000, enemy mask 0x0A08000A-style
  panel-status bitmask), then loops with r4=1,2,3... computing target x = object_getFrontDirection()*r4
  + PanelX; exits early if x leaves 1..6. Each step calls object_getPanelParameters(x,y) and tst-tests
  the status word against the alliance mask; on a match (or after running off the field, where nothing
  is spawned) it falls through. On a match it calls object_spawnDimmingCollisionRegion with r0/r2 = the
  object's Element, r1 = PanelY, r3 = 0x00100000, a 0x4050501 parameter word, size/count 5 + ExtraVars,
  and the constant 3, i.e. the region is placed at the last valid panel before the blocked one. Note r4
  (the reached distance) is overwritten by 0x4050501 before the call, so the distance is not directly
  forwarded.
