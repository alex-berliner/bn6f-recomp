name: battle_countPanelsForAlliance
address: '0x080C24F4'
kind: function
status: probable
summary: Counts battle-field panels matching an alliance-dependent attribute bitmask into the object's
  Param2 field.
interface: (r5 = battle object, r0 clobbered) -> r0 = panel count stored to oBattleObject_Param2; returns
  count in r0
details: 'Reads the object''s Alliance byte, scales it by 4 to index a two-entry mask table at off_80C2510
  (alliance 0 -> 0x4000000, alliance 1 -> 0x8000000), and passes the selected value as the required-attribute
  mask (r3 = 0, so no forbidden mask) to object_getPanelsExceptCurrentFiltered. The filtered panel list
  buffer lives inside the object itself at r5+0x6C (set up in r7 before the call). The returned entry
  count is written back as a byte into oBattleObject_Param2 and also returned in r0. Effectively: ''how
  many panels currently on the field have the attribute my alliance cares about''.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Alliance]; lsl #2 selects per-alliance mask from off_80C2510 (0x4000000
    / 0x8000000); r3 = 0 and r2 = table mask match the callee''s required/forbidden bitmask parameter
    pair; mov r7,#0x6C; add r7,r7,r5 points the callee''s output list at object+0x6C; strb r0,[r5,#oBattleObject_Param2]
    stores the callee''s returned count into the object; sole callee object_getPanelsExceptCurrentFiltered
    returns the number of matching panels, per project summary'
  refs:
  - bn6f/asm/asm31.s:22794
  - 0x080C2216 sub_80C2216
  - 0x0800CE64 object_getPanelsExceptCurrentFiltered
  reproduce: python3 tools/asmcat.py 0x080C24F4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- Which panel attributes bits 26/27 (0x4000000/0x8000000) denote — needs the panel-state bit definitions
  or the caller sub_80C2216's context
- Why the alliance index is also passed in r0/r1 (table base) to the callee — the callee's exact register
  contract beyond r2/r3 is unconfirmed
