name: t3_0x32_80CA2A8
address: '0x080CA2A8'
kind: function
status: confirmed
summary: Per-frame update for battle object type 3 (a projectile-like object), dispatching a per-state handler selected
  by the object's CurState byte and then refreshing its sprite.
interface: battle_objectType3Update(object in r5, work in r4, args in r7, r8, r10) -> sprite setup in r5, r8, r9,
  r10, r11, r12; clobbers r0-r4, r6, r7, lr and nzcv
details: 'Standard battle-object update thunk. Reads the object''s CurState byte at [r5 + oBattleObject_CurState]
  and uses it directly as a byte offset into the word table at off_80CA2C0, so only states 0, 4 and 8 are valid
  for this type (state 0 -> battleObject_initProjectileFromTable_80CA2D4, state 4 -> object_presentCollisionAndHandleHit_80CA3A0,
  state 8 -> sub_80CA2CC). It performs a long-distance Thumb call with the mov lr, pc / bx r1 idiom, passing the
  state byte in r0, the object pointer in r5, and the caller''s r4/r7/r8/r10 through unchanged (r2/r3 also pass
  through untouched). When the handler returns, its sprite setup left in r5 is fed to object_updateSprite to redraw
  the object, and the sprite registers r5/r8-r12 are propagated back to the caller as this function''s outputs.

  '
