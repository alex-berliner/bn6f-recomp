name: t3_0x5d_80D00A0
address: '0x080D00A0'
kind: function
status: confirmed
summary: Battle object "t3" per-frame step — dispatches to the object's current-state handler and then updates its
  sprite.
interface: void t3_stateStep(BattleObject* r5, u32 r2 passthrough, u32 r10 passthrough); returns r5 (possibly updated
  object pointer), r8-r12 as left by callees; clobbers r0-r4, r6-r7, lr, NZCV
details: 'Reads the battle object''s CurState byte (oBattleObject_CurState off r5) and uses it directly as a byte
  index into the handler table at off_80D00B8, which has three entries: object_initLoadSprite (state 0), object_stateStep
  (state 1), and sub_80D01BC (state 2). The handler is reached via mov lr, pc / bx r1, so it runs in ARM state (table
  entries are +1 Thumb pointers but lr=pc lands at an ARM BX sequence... actually the dispatch keeps Thumb via the
  standard lr=pc trick) and receives r0 = current state, r1 = table entry, with r2, r5 (object pointer) and r10
  passed through untouched. When the handler returns, this routine unconditionally calls object_updateSpritePaused
  on the object, so the sprite is refreshed even in the init/load state. The r5 the handler leaves behind is both
  what the sprite update sees and what this routine''s caller receives; r8-r12 are likewise whatever the callees
  leave. Only three states are covered by the table — a CurState value >= 3 would index past off_80D00B8+0xC into
  garbage, so t3 objects must never be set to higher states (or the table relies on the state byte staying within
  range).

  '
