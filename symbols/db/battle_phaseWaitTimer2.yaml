name: battle_phaseWaitTimer2
address: '0x080E5304'
kind: function
status: confirmed
summary: Ticks a battle object's Timer2 down by one each call and, when it hits zero, resets the object's current
  phase (clearing the phase-initialized flag).
interface: void battle_phaseWaitTimer2(battleObject* obj /* r5 */) — no return value, NZCV and r0 clobbered
details: 'Battle-phase co-routine step taking the object pointer in r5. Decrements the halfword oBattleObject_Timer2
  (timer 2, distinct from the main Timer field) and stores the result back. While the timer is nonzero, nothing
  else happens. When it reaches zero, the halfword oBattleObject_CurPhaseAndPhaseInitialized is written with 0,
  resetting the object''s current phase index and simultaneously clearing the "phase initialized" flag packed into
  that field. The next phase step will then re-initialize the new phase. Typical use: a phase handler sets Timer2
  to a frame count (or 1 for "next tick"), calls this waiter as its phase body each frame, and on expiry the phase
  state drops to 0 so the phase machine advances/re-initializes. Thumb function that tail-returns to its caller
  via pop {pc} (caller-supplied return address in lr). r0 is used as scratch; NZCV are clobbered by the decrement/compare.

  '
