name: battle_objectMoveYStep
address: '0x080DD204'
kind: function
status: probable
summary: 'Per-frame Y-axis movement step for a battle object: advances Y by its YVelocity and refreshes
  panel/collision data, or ends the move when a condition holds.'
interface: (r5 = battle object pointer, r0-r1 scratch) -> void; r0 = result of sub_80DD322 tested with
  tst, then clobbered by callees
details: 'First calls sub_80DD322 and tests its result. If it returns zero, the object''s Y position is
  advanced by its YVelocity (oBattleObject_Y += oBattleObject_YVelocity), then object_setPanelsFromCoordinates
  recomputes PanelX/PanelY from the new world position and object_updateCollisionPanels syncs the collision
  record and facing for the move. If sub_80DD322 returns nonzero, the move is aborted/finished instead:
  CurAction is set to 8, CurPhase to 0, and XVelocity is cleared to 0. The object is accessed through
  the fixed high register r5, so this is an inlined-style per-object tick routine. Which condition sub_80DD322
  checks (e.g. target Y reached or blocked) is not visible from this call site.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r0,[r5,#oBattleObject_Y] / ldr r1,[r5,#oBattleObject_YVelocity] / add/str: integrates YVelocity
    into Y; bl object_setPanelsFromCoordinates then bl object_updateCollisionPanels after the Y update;
    bne loc_80DD220 on sub_80DD322 result takes the termination path instead of moving; termination path:
    strb #8,[r5,#oBattleObject_CurAction], strb #0,[r5,#oBattleObject_CurPhase], str 0,[r5,#oBattleObject_XVelocity]'
