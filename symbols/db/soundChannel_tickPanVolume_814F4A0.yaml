name: soundChannel_tickPanVolume_814F4A0
address: '0x0814F4A0'
kind: function
status: confirmed
summary: Per-tick update of one GBA sound channel's pan / volume / mute bytes (called from the SIO/stream
  audio mixer tick)
interface: void soundChannel_tickPanVolume_814F4A0(struct SoundChannel* r0); clobbers r0 r1, returns via
  lr
details: "Operates on a SoundChannel struct:\n  +0x02, +0x03 : L/R pan byte pair (u8 each, treated as\
  \ left/right attenuation)\n  +0x06        : base volume (u8)\n  +0x0A        : computed pan-average,\
  \ stored here (clamped to 0xF on the 0x0F/0xF0 mute paths only)\n  +0x19        : final scaled ((vol*avg)+0xF)>>4\
  \ volume sent to the channel\n  +0x1B        : channel mute mask (0x0F, 0xF0, or 0xFF derived from L/R\
  \ balance)\n  +0x1C        : per-channel mute flag byte\nLogic:\n  - Compares L pan (+2) vs R pan (+3).\n\
  \  - If R > L (right-dominant): compare (R>>1) vs L. If R is more than 2x L, mute = 0xF0 (kill right)\
  \ and recompute/clamp avg. Else mute = 0xFF (full) and skip the clamp.\n  - If L >= R: symmetric, mute\
  \ = 0x0F (kill left) when L > 2x R, else 0xFF.\n  - Then avg = (L+R)>>4 is written to +0x0A (only clamped\
  \ on the 0x0F/0xF0 paths).\n  - Final volume at +0x19 = ((base_vol * avg) + 0xF) >> 4.\n  - Final mute\
  \ at +0x1B = old_mute & LD8(+0x1C) — ANDs in a per-channel mute bit.\nThe tail pops r4, then r0 into\
  \ pc via lr-style epilogue (no explicit value).\n"
