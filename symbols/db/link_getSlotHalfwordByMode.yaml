name: link_getSlotHalfwordByMode
address: '0x0803E7A4'
kind: function
status: probable
summary: Returns a 16-bit per-slot value from byte_2009940 at offset 8*slot plus a per-link-mode base
  (0x02 for modes 0, 0x04 for mode 3); for unsupported modes (1,2) returns r0=0, r1=1 as an error indicator.
interface: (r0 = slot index 0..7) -> r0 = halfword byte_2009940[8*slot + offset[mode]], r1 = 0 on success;
  r0 = 0, r1 = 1 if the current link mode has no table entry
details: It first calls link_getModeSelector_803DD30, which derives the current link mode (0..3) from
  the eStruct200BC30 jump-offset slot and eLinkState. That mode indexes the byte table at dword_803E7D4
  (0x04FFFF02, i.e. bytes 02,FF,FF,04), yielding a base offset into the byte_2009940 area; 0xFF marks
  modes 1 and 2 as unsupported, in which case it returns r0=0 with r1=1 as an error flag. Otherwise it
  computes 8*r7 + baseOffset and reads a halfword from byte_2009940 at that offset, returning it in r0
  with r1=0. So the buffer is laid out as per-mode blocks of 8 halfwords, with modes 0 and 3 pointing
  at blocks starting at offsets 2 and 4 (their blocks overlap at halfword granularity). The halfword size
  and 8-entry stride suggest per-player/per-slot data such as IDs or selection values in a wireless link
  session. The exact game meaning of byte_2009940 is not established from this function alone.
