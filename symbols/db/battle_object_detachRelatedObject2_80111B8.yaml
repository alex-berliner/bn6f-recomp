name: battle_object_detachRelatedObject2_80111B8
address: '0x080111B8'
kind: function
status: confirmed
summary: Detaches a battle object's "related object 2" attachment, running that object's removal routine first if
  one is attached.
interface: void battle_object_detachRelatedObject2(BattleObject* obj /* r5 */); clobbers r0, r1, lr; sets NZ flags
  from the cleared/zero pointer
details: 'Takes the battle object in r5. Loads the pointer at BattleObject+oBattleObject_RelatedObject2Ptr.

  If non-null, calls sub_80C44C8 with that pointer in r0 — evidently the attached object''s removal/free

  routine (r0 is passed but its return in r1 is left over and propagated, callers ignore it) — then

  stores 0 back into RelatedObject2Ptr to detach it. If the pointer was already null, the routine is

  skipped and the field is left alone. The function tail-returns with pop {pc}.

  Quirks: r0 on return is always 0 when an object was detached (the post-call MOV r0,#0), or the stale

  pointer value when nothing was attached; NZ flags reflect that r0 (TST result on the empty path,

  MOV r0,#0 otherwise), so callers could branch on "was empty". r5 is the implicit object parameter,

  consistent with battle-object methods in this disassembly that receive their object in a register

  rather than r0.

  '
