name: ai_getAIModeForChipForMapGroup_808D060
address: '0x0808D060'
kind: function
previous_names:
- sub_808D060
status: probable
summary: Looks up an AI behaviour pair for the current map group's battle by indexing a small 4-byte-pair
  table with the AI mode returned from `ai_getAIModeForMapGroup_808D084`.
interface: (r10 = Toolkit ptr) -> r0 = signed byte 0 from byte_808D07C[2*mode+0], r1 = signed byte 1 from
  byte_808D07C[2*mode+1] ; no other side effects
details: "- Calls `ai_getAIModeForMapGroup_808D084` (which reads MapGroup out of GameStatePtr/0x4) and\
  \ receives the AI mode in r0.\n  - `lsl r0, r0, #1` doubles the index, then `ldr r3, =byte_808D07C`\
  \ + `add r3, r3, r0` forms `&byte_808D07C[2*mode]`.\n  - `ldrsb r0, [r3, #0]` reads byte_808D07C[2*mode]\
  \ into r0, and `ldrsb r1, [r3, #1]` (after `mov r1, #1`) reads the following byte into r1.\n  - So the\
  \ function returns a 2-byte pair (`r0`, `r1`) interpreted as signed bytes; the table itself is the 8-byte\
  \ literal `byte_808D07C = {0x04, 0x0E, 0x0C, 0x04, 0x0A, 0x04, 0xFC, 0xF6}`, i.e. four pairs: `(4,14)`,\
  \ `(12,4)`, `(10,4)`, `(-4,-10)`.\n  - The `push {lr}` / `pop {pc}` and absence of any other state indicate\
  \ this is a leaf thunk around the indexed table; the only meaningful inputs are read indirectly through\
  \ `ai_getAIModeForMapGroup_808D084`.\n  - The two returned bytes look like (mode/flags, chance?) but\
  \ without callers we can only describe them as a paired AI param tuple for the chosen map group.\n"
evidence:
