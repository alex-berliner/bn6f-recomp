  date: '2026-10-14'
  detail: '- `bl ai_getAIModeForMapGroup_808D084` is the only callee and supplies the index in r0. - `lsl
    r0, r0, #1; ldr r3, off_808D078` shows `byte_808D07C[2*mode]` is the base. - `ldrsb r0, [r3,r0]` (`r0=0`
    afterwards) reads byte 0; `mov r1,#1; ldrsb r1, [r3,r1]` reads byte 1. - `pop {pc}` shows no caller-saved
    state modified. - Toolchain comment at `ai_getAIModeForMapGroup_808D084` confirms it reads MapGroup
    from GameStatePtr+0x4, so the table is keyed by map group.'
