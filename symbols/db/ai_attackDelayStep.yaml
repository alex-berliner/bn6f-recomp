name: ai_attackDelayStep
address: '0x080EB3DC'
kind: function
status: probable
summary: 'Attack step for a battle object: on first tick plays animation 0 and arms a frame delay, then
  counts down and returns the object to its normal state.'
interface: () -> void; r7 = battle object ptr; obj+0x01 state id set to 4, obj+0x10 countdown from obj+0x18,
  obj+0x18 delay copied in
details: Called with r7 already pointing at a battle object (no arguments passed in r0-r3). If the state
  byte at obj+0x01 is zero, it calls object_setAnimation(obj, 0), copies the delay value at obj+0x18 into
  the halfword timer at obj+0x10, and writes 4 to obj+0x01 to enter the 'waiting' phase. On subsequent
  ticks it decrements obj+0x10 each frame while it stays positive. When the counter reaches 0, it calls
  object_exitAttackState to leave the attack. Field 0x18 is likely a per-object attack delay/charge parameter.
