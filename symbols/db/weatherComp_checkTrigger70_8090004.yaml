name: weatherComp_checkTrigger70_8090004
address: '0x08090004'
kind: function
status: confirmed
summary: Checks the active BBS request ID and, if it is one of the ten weather requests (0x70-0x79), selects the
  matching weather (0-9) on a weather object.
interface: bool weatherComp_checkBbsRequestWeather(void* weatherObj /*r5*/, u32 extra /*r10*/); sets NZ flags on
  the bool result
details: 'Part of the weather-component subsystem. It calls reqBBS_81409E4 (fed r10,

  presumably part of the BBS request context) to obtain the current request

  board request ID in r0. If the ID lies in the range 0x70..0x79 inclusive,

  it subtracts 0x70 to get a weather index 0..9 and stores it as a byte at

  [r5+0xE] (the selected-weather field of the weather object passed in r5),

  setting a local success flag. Any other request ID leaves the field

  untouched. Returns the success flag in r0 for the caller, which tests the

  Z flag. r4-r9/r12 are preserved across the helper call; r1-r3 and r10-r11

  carry through the helper''s own outputs.

  '
