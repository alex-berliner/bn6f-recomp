name: object_stepRedirectTowardTargetPanel
address: '0x080D1FA0'
kind: function
status: confirmed
summary: Mid-step course correction for a moving battle object - once its remaining step reaches the column it is
  heading for, it redirects the leftover movement vertically toward the target panel's row (or turns around if already
  on that row).
interface: void object_stepRedirectTowardTargetPanel(u32 step /*r0*/, u32 callerY /*r1, ignored*/, BattleObject
  *obj /*r5*/)
details: 'Caller passes the movement the object still has to make this frame in r0 and the object in r5; r1 is handed
  down by the caller but never read here. Works on oBattleObject_PanelX (byte), PanelY (byte), XVelocity, YVelocity
  and ExtraVars+4 (a magnitude constant, probably the object''s row-change step speed). If XVelocity is negative,
  both the step and the PanelX offset are negated so the distance check is direction-agnostic. If the step is still
  greater than the target column offset, the object keeps walking unchanged. Otherwise it calls sub_80D200C (r5
  in, r1 out = row to aim at, plus flags) and returns on its "greater or equal" outcome (N == V, read via bge).
  If the aimed row equals PanelY it simply negates XVelocity (turn around in place). Otherwise it sets YVelocity
  = ExtraVars+4 * (target row > PanelY ? 1 : -1) and zeroes XVelocity, so the leftover step distance is carried
  into vertical motion toward the target panel. r1 is preserved; nzcv, r0, r2, r3, lr are clobbered.

  '
