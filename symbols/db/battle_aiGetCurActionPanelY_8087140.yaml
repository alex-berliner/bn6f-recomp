open_questions:
- Exact role of offset 0x13 inside the chained pointer isn't fully provable from this function alone;
  could be AIData.Unk_13, AIData-related flag, or AIData+0x13 view of BattleObject. Tracking what sub_8086EA8
  does with the returned value (compared against what panel coords?) would settle it.
