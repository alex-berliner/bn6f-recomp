status: probable
summary: Returns AIData.PanelY (offset 0x13) of the BattleObject pointed to by the Toolkit's current actor
  slot
interface: () -> r0 = u8 PanelY
details: "Reads the Toolkit pointer (r10) and follows Toolkit.GameStatePtr... no, follows\n  Toolkit.BattleStatePtr\
  \ path differently. Code does:\n    r1 = [r10 + 0x3C]            ; r10 always the Toolkit; offset 0x3C\
  \ = GameStatePtr\n    r1 = [r1 + 0x18]             ; GameState.CurBattleDataPtr (loc=0x1c? actually\
  \ loc=0x18? struct shows 0x1c; the 0x18 here is a per-battle sub-struct)\n    r4 = ldrb [r1 + 0x13]\
  \        ; u8 PanelY at +0x13\n  Returns the byte in r0. The two-step indirection (Toolkit -> something\
  \ -> AIData)\n  means the \"something\" is a BattleObject whose AIData is read at offset 0x13. Given\n\
  \  AIData has Unk_13 at 0x13 with a u8_arr slot above it and BeastOutAPwrAtk at 0x11,\n  this is a quick\
  \ read of the AIData byte that callers (e.g. beast-SP AI dispatcher\n  sub_8086EA8) want to consult\
  \ as the current action panel Y.\n  No writes, only r4 is preserved around the call; pure read.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4,lr}` / `pop {r4,pc}` — leaf function, no stack frame beyond saved r4 - `mov r1,
    r10` then `ldr r1, [r1,#0x3c]` — pulls a pointer out of the Toolkit at slot 0x3C (GameStatePtr) -
    `ldr r1, [r1,#0x18]` — dereferences GameState -> CurBattleDataPtr (offset 0x1c in struct, but here
    treated as 0x18; likely an inner per-actor struct view where the battle-actor list starts earlier)
    - `ldrb r4, [r1,#0x13]` — reads a single byte at offset 0x13 - `mov r0, r4` — returns that byte -
    Only caller is sub_8086EA8 (Beast/SP AI dispatch), which iterates per-actor sub-states - 40 captured
    calls; exit r0=0 in 2 cases (r1==0 chain) and r0=2 in 38 cases, consistent with reading a panel Y'
  refs:
