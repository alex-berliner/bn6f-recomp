status: probable
summary: Per-frame overworld check that consumes a coordinate trigger and dispatches to one of nine warp
  cutscene routines based on the warp type.
interface: () -> void ; triggers a warp via Toolkit's Warp2011bb0 state. No register contract for callers
  (saves r5,lr only)
details: 'Reads Toolkit->GameStatePtr (r5) and bails early unless GameState.SubsystemIndex == 4 (overworld
  subsystem).

  Guards: if the overworld player is busy/cutscene is active (owPlayer_isBusyOrCutsceneActive_809E462),
  if the

  current warp helper struct has byte 0x10 != 0 (warp_LoadCurrentAndReadUnk10_8005F28), if PET menu data
  flag 1

  is set (TestPETMenuDataFlag), if no screen fade is active (IsScreenFadeActive), or if a cutscene script
  is

  currently set (IsCutsceneScriptNonNull), the function simply returns.

  Otherwise it asks checkCoordinateTrigger_8031a7a to test the OW player object''s coords; the returned
  u8

  index (r1 → r4) must be in [1, 0xF]. It then tests the event flag (EVENT_16F0 + index) via TestEventFlag

  and bails if it is set (the warp must not have been consumed yet).

  On success it sets Toolkit->Warp2011bb0.Unk_10 = 1, WarpIndex = r4, MapGroupTransitionType = 0, then
  indexes

  WarpDataPtr with (r4 - 1) * sizeof(WarpData) and dispatches via a 9-entry jump table keyed by

  oWarpData_warpType_02 to one of: gameState_beginEndingSequence_800596C, sub_8005990,

  map_onMapWarpCutscene_80059B4, startInMapWarpCutscene_80059D0, sub_80059EC, sub_8005A00,

  sub_8005A0C, sub_8005A28, sub_8005A50. Dispatch uses mov lr,pc / bx r0 with thumb bit set (+1 to each

  label).

  '
