name: chatbox_80416C4
address: '0x080416C4'
kind: function
status: confirmed
summary: Iterates a per-map chatbox script table, selecting and running the entry whose map range includes the current
  map, or skipping empty entries.
interface: void chatbox_tryRunForCurrentMap_80416C4(u32* r4 /*chatbox entry ptr*/, u32 r10 /*toolkit*/) -> r0=1,
  r2=maxMap, r3=currentMap, r4=nextEntry; clobbers r1,lr; flags NZ set (NZ=1), C from r4+=6 on skip path
details: 'Reads a 6-byte chatbox entry table where each record is: [?, minMap, maxMap, scriptInRange, scriptOutOfRange].

  Pulls the live map number via the global game-state pointer (toolkit -> gameState -> mapNumber).

  If currentMap is within [minMap,maxMap] it uses byte +4 as the script id, else byte +5.

  If the selected script byte is 0xFF the entry is skipped by advancing r4 to entry+6 (the next 6-byte

  record); otherwise the script id is passed to chatbox_config_80408D0 to be started.

  Always returns r0=1; r2/r3/r4 are left as documented outputs so the caller can keep iterating and

  knows the current/max map for the last compared entry. The byte at entry+0/+1 is not used here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
