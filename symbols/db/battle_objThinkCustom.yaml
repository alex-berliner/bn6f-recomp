name: battle_objThinkCustom
address: '0x0810D5CE'
kind: function
status: probable
summary: 'Per-frame think/update for a battle object: one-time init via ExtraVars, a common object tick,
  then a per-action handler skipped when CurAction is 6.'
interface: (r5 = battle object pointer, no args in r0-r3) -> r0 clobbered; no meaningful return
details: 'Reads the object at r5. If oBattleObject_PhaseInitialized is 0 and oBattleObject_ExtraVars is
  non-null, calls sub_810D4E8, which likely performs one-time initialization and sets PhaseInitialized.
  Unconditionally calls sub_8016B36, presumably the shared per-frame object update (timers/animation).
  Then if oBattleObject_CurAction != 6 and ExtraVars is non-null, calls sub_810D4BA, the action/state-specific
  logic. CurAction 6 appears to be a state that suppresses custom behavior (possibly idle or inactive).
  ExtraVars acts as a guard: all custom logic is skipped when it is null.'
