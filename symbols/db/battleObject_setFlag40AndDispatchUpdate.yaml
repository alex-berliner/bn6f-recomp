open_questions:
- meaning of bit 0x40 in the +0x1b flags byte (invulnerability? custom open? another state flag)
- whether r5 in the callers equals unk_2037700 or is a different object
- why the dispatcher is invoked on the fixed object unk_2037700 rather than the object whose flag was
  changed
