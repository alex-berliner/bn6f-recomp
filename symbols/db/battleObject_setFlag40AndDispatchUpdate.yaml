name: battleObject_setFlag40AndDispatchUpdate
address: '0x0813188C'
kind: function
status: probable
summary: Sets or clears bit 0x40 in a battle object's flags byte at +0x1b, then runs the state-update
  dispatcher on the battle object at unk_2037700.
interface: '(r0 = bool: set flag if nonzero, clear if zero; r5 = battle object whose +0x1b flag byte is
  modified) -> r0 = result of battleObject_dispatchUpdateByState; flags clobbered'
details: If r0 != 0 the function ORs 0x40 into the byte at [r5+0x1b]; if r0 == 0 it clears that bit with
  BIC, storing the result back. It then loads off_81318AC = unk_2037700 (a battle object/controller whose
  offset-0 field is the current state, per the dispatcher's known behavior) into r5 and tail-calls battleObject_dispatchUpdateByState_8133200,
  so the flag change is immediately followed by that object's per-state handler running. r5 is caller-provided
  (callee-saved), meaning the flag byte lives in some object the caller holds. Whether unk_2037700 is
  the same object as r5 or a separate global dispatcher target is not visible here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'orr/bic of #0x40 with ldrb/strb [r5,#0x1b]: the whole function body is a set/clear of bit 0x40
    in a flags byte; ldr r5, off_81318AC loads unk_2037700 immediately before bl battleObject_dispatchUpdateByState_8133200;
    beq on tst r0,r0 branches between the orr and bic paths, so r0 is a plain set/clear boolean; r5 is
    never assigned inside the function, so the flags byte belongs to a caller-supplied object'
