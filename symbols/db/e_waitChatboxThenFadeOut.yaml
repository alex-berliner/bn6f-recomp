name: e_waitChatboxThenFadeOut
address: '0x08136AA0'
kind: function
status: probable
summary: Cutscene/event step that waits on chatbox flags and state, then closes the textbox, resets the
  step's fields and fades the screen out.
interface: '(r5 = event/step object: [r5] step id, [r5+1] state, [r5+2..3] counters) -> r0 = 0 or state
  byte; no meaningful return'
details: 'This is a per-frame state handler for an event object whose current step id is at [r5]. If the
  step id is 0x28 it jumps straight to the finish: sets [r5+1] = 8, clears [r5+2] and [r5+3], calls SetScreenFade(0xc,
  0x10) to fade the screen, and calls chatbox_8040818 to close/reset the textbox. Otherwise it only proceeds
  when flag bit 0x80 of eFlags2009F38 is set AND flag bit 0x20 (dword_8136AE4) is also set, then calls
  sub_813BAA8; if the chatbox state selector (low 3 bits, via chatbox_GetState_8045F4C) is nonzero it
  calls chatbox_8040818 and sub_8136BDC (likely advancing dialogue/next textbox) and keeps waiting. So
  the step blocks the cutscene while the 0x80/0x20 event-flag condition isn''t met and while dialogue
  is still open.'
