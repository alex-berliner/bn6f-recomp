    to advance via sub_8136BDC + chatbox_8040818; loc_8136ACC writes state 8 to [r5+1], zeroes [r5+2..3],
    SetScreenFade(0xc,0x10), chatbox_8040818; called on the beastsp route with no args in registers, state
    carried in the r5 struct fields'
