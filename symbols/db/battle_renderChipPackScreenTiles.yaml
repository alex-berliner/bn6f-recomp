summary: Refreshes the chip-pack screen background tile patch when the screen object requests a special
  refresh state.
interface: (r5 = battle screen object/state pointer) -> void; flags preserved
details: The routine reads the object's state byte at offset 0x2 and performs no work unless it equals
  0x20. For that state it copies the fixed background tile patch through copyBgTilesToBlock0 and then
  invokes the related screen-update routine sub_812D668. The caller invokes it on both chip-pack-screen
  paths, including immediately before npc_runDialog41(0x20), supporting a rendering/refresh role.
