name: ai_circusmanInitAttackState
address: '0x080FEB9E'
kind: function
status: probable
summary: 'Initializes CircusMan''s AI attack state: reads difficulty tier, fills attack parameters from
  helpers, picks the opposing player as target, and launches attack id 0xC.'
interface: (r0 = battle object? passed via r5/r7 base, r7 = oAIAttackVars struct) -> r0 = destroyed; sets
  up oAIAttackVars and starts attack 0xC
details: Reads the enemy AI difficulty byte (via battle_getAiDifficultyTier) and stores it in oAIAttackVars_AiDifficultyTier,
  then clears the InitFlag. Calls four helpers (sub_80FEBE4 with arg 2, sub_80FEA74, sub_80FEAA8, sub_80FEABC,
  sub_80FEAD8) whose results fill AttackDuration, AttackBoost2, ScratchVar, TimerOrCycles and SubStepIndex
  — i.e. it gathers randomized/per-difficulty attack parameters. Stores r5+0x7C as AiAttackParam, looks
  up the opposing object with battle_findPlayer(alliance XOR 1) into TargetObjectPtr, and finally calls
  object_setAttack0(0xC) to begin the attack. This is the one-time initialization of a CircusMan AI attack
  routine, called from its AI step when the RNG rolls (first <0xE) pass.
