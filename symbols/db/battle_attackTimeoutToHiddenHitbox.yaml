open_questions:
- What sub_80F7514 does with the ScratchVar (spawn effect? play sound?) is unknown
- Which enemy/attack uses this state — no caller is known, so the in-game attack identity and why element
  4 is forced are unconfirmed
- Exact semantics of ObjectFlags bit 0x40 and bit 0x400000 (0x400000 cleared here) are not established
