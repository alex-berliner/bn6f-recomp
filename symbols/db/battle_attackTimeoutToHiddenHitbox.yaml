name: battle_attackTimeoutToHiddenHitbox
address: '0x080F6F7C'
kind: function
status: probable
summary: 'Timed attack-state handler for a battle object: waits out a short timer, then hides the attack
  object and converts it into an invisible, still-moving hitbox carrying its damage before leaving the
  attack state.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: 'On first entry (AttackElement == 0) it sets element 4, animation 4, and a 3-frame StepTimer,
  deferring work to a later tick. On subsequent ticks it counts StepTimer down to 0, then calls sub_80F7514
  with the object''s ScratchVar, deactivates the object (hide, drop shadow/collision via battle_deactivateObject),
  and adjusts ObjectFlags1: clears bit 0x40, sets the CURRENTLY_MOVING_1 bit, and clears bit 0x400000
  — leaving an invisible but active moving object. It then packs the object''s DamageAndStaminaDamageCounterDisabler
  word (low half = damage, high half = stamina-counter disabler) into CollisionData SelfDamage and StaminaDamageCounterDisabler,
  so the hidden hitbox still deals the attack''s damage, and finally exits the attack state via object_exitAttackState.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; be-zero path sets element 4, anim 4, StepTimer 3
    — one-shot initialization delay; decrement of oAIAttackVars_StepTimer with bgt exit — plain frame-countdown
    state; bl battle_deactivateObject followed by object_clearFlag 0x40 / setFlag1 1<<CURRENTLY_MOVING_1
    / clearFlag 1<<0x16 — hides object but keeps it active and moving; strh of DamageAndStaminaDamageCounterDisabler
    low half into [r2,#oCollisionData_SelfDamage] and high half into StaminaDamageCounterDisabler — transfers
    the attack's damage onto the collision; bl object_exitAttackState at the end — this is an attack-state
    step function
