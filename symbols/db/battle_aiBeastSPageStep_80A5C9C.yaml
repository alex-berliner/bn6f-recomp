summary: 'Drives one step of an AIData''s "Beast SP" text-page sub-state: starts the text script the first
  time, then polls chatbox state to finish and unlock the player.'
interface: '(r5 = AIDataPtr, r10 = ToolkitPtr) -> r0 = 2 while running, 1 if page ended cleanly, 0 if
  chatbox flag 0x80 was already cleared at entry ; side effects: locks/unlocks OW player and clears eFlags2009F38
  dialogue busy state'
details: "- On first call (r5->offset 0xa == 0): runs sub_80A5CE4 (likely page-init), then\n    owPlayer_lockPlayerForNonNPCDialogue_809E0B0,\
  \ then sub_80A5E44 (likely sets up\n    the script/state field), then calls reqBBS_RunTextScriptWhoAmI(r0=0,\
  \ r1=r5->0x6\n    = BButton copy). Increments the step counter at r5+0xa and returns 2.\n  - On subsequent\
  \ calls (r5+0xa > 0): checks chatbox_mask_eFlags2009F38 with bit 0x80;\n    if still set, returns 2\
  \ (still busy). Otherwise polls chatbox_GetState_8045F4C:\n    state==0 -> r0=1 (page ended normally);\
  \ else r0=0 (cancelled or alternative exit).\n    In both endings, clears the step counter (r5+0xa =\
  \ 0) and calls\n    owPlayer_unlockPlayerAfterNonNPCDialogue_809E122 to free the player.\n  - Uses r5\
  \ (callee-saved) as the per-actor AIData pointer; r10 is the toolkit\n    required by the dialogue helpers.\
  \ The return value matches the AIData\n    sub-state pattern (2 = busy, 1 = done, 0 = done-with-skip)\
  \ used by sibling\n    sub-states of sub_80A5B70.\n"
