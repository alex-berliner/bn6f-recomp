name: battle_getObjectPairOddByteClamped8_811774C
address: '0x0811774C'
kind: function
status: confirmed
summary: Reads the odd byte of a byte-pair indexed by the object's [r5+4] field from table unk_201C400 and clamps
  it to at most 8.
interface: 'u32 sub_811774C(void *obj); // in: r5=obj, lr=return; out: r0=clamped value, r1=index, flags NZCV from
  cmp value,8'
details: Takes the byte at [r5+4] (some per-object selector/state field), doubles it and adds 1, so it indexes the
  odd member of a byte pair in the table at unk_201C400. The loaded byte is compared with 8; if it is greater than
  8 it is clamped to 8 before being returned. Returns the clamped value in r0 and the computed index in r1. On the
  clamp path the NZ flags are re-set by the mov r0,#8 (reporting equality with 8), while C/V retain the original
  comparison's results - a quirk callers relying on flags should be aware of. unk_201C400 is a byte table in IWRAM/WRAM;
  the doubled index suggests entries stored as pairs (e.g. value/counter or even/odd slot pairs).
