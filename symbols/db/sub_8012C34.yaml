name: sub_8012C34
address: '0x08012C34'
kind: function
status: hypothesis
summary: Merge two flag bits (0x4000 and 0x2000) into a value, selected by bits 2 and 4 of a mask argument
interface: u32 sub_8012C34(u32 value /*r0*/, u32 selectorBits /*r1*/); returns value | 0x4000 (if selectorBits&2)
  | 0x2000 (if selectorBits&4); r3 trashed (=4)
details: 'Tiny bit-merging helper: tests bit 2 of r1 and ORs 0x4000 into r0, then tests bit 4 of r1 and ORs 0x2000
  into r0. Both constants look like flag bits in a status/effect word (0x4000 and 0x2000 are adjacent high bits,
  e.g. hidden/protected-type flags in battle state words). r3 is clobbered to 4 purely as a scratch-register side
  effect; callers relying on r0 and the two flag outputs must not depend on r3. Also reports r3 and flags as outputs
  to callers, which suggests the lifter saw callers reading r3 even though it carries no meaningful result.'
