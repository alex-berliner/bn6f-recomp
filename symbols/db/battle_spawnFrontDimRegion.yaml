open_questions:
- Exact meaning of the r4/r6 words loaded from byte_80C2640 (lifetime vs. width vs. other region fields)
  depends on object_spawnDimmingCollisionRegion's parameter layout
- What the ExtraVars offset represents (charge time? slide timer?) and why slide/charge callers use different
  variant indices
- Whether non-zero element-OR table values are used elsewhere for elemental dim regions
