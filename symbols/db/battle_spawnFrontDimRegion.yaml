name: battle_spawnFrontDimRegion
address: '0x080C2600'
kind: function
status: probable
summary: Spawns a dimming collision-region object covering panels 1–2 tiles in front of the battle object,
  sized/duration chosen by a variant index.
interface: (r0 = variant index 0..2, r5 = battle object) -> r0 = spawned region object from callee; r7
  forced to 3 (timestop keep-updating flag).
details: 'Takes a small variant index in r0 (not the object pointer: r0 is re-used as the index into the
  offset/duration tables and also passed as the index argument to object_getFrontDirection, which reads
  the battle object from r5). Gets the +1/-1 facing multiplier, multiplies it by a per-variant X offset
  from dword_80C2664 (bytes 1,1,2), and adds the object''s oBattleObject_PanelX to get the region''s origin
  panel; oBattleObject_PanelY is passed unchanged. oBattleObject_Element is OR''d with a byte-table entry
  (all zeros here, so the element passes through). Duration/width words are read from byte_80C2640 (words
  0x04050601/02/04) and the r6 value has oBattleObject_ExtraVars added, then object_spawnDimmingCollisionRegion
  is called with the timestop flag 3 (dword_80C264C).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mul r0,r1 with dword_80C2664 bytes 1,1,2 then add oBattleObject_PanelX: X offset in front scales
    with facing direction; ldr r3,[r2,r3] from all-zero byte_80C266C OR''d into oBattleObject_Element:
    element passthrough indexed by variant; ldr r4/r6 from byte_80C2640 (0x04050601/02/04) and r6 += oBattleObject_ExtraVars:
    per-variant duration adjusted by object state; mov r7,#3 passed to object_spawnDimmingCollisionRegion,
    whose summary says it marks the region to keep updating during timestop; callers battle_phaseChargeSpawnAttack
    and battle_slideToPanelAction both reserve/claim panel space before calling this'
  refs:
