  - 0x080C2256 battle_phaseChargeSpawnAttack
  - 0x080C2324 battle_slideToPanelAction
  - 0x080C23F0 sub_80C23F0
  - 0x0800E2CA object_getFrontDirection
  - 0x080C53A6 object_spawnDimmingCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080C2600
