name: sfx_playSfx0C_800A79C
address: '0x0800A79C'
kind: function
status: confirmed
summary: Plays sound effect
interface: void sub_800A79C(void) — callers pass r10 (base/context pointer read by the sfx player); no return value;
  clobbers r0, r1, lr and the nz flags.
details: A one-shot wrapper that loads 0xC into r0 and tail-tail-calls sub_80013A2 (the engine's sound-effect playback
  routine) after saving lr with push {lr} and returning via pop {pc}. The only game-specific behavior is the constant
  SFX id 0x0C; everything else (queueing, channel selection, the r10 sound context) is handled inside sub_80013A2.
  Note the sfx id is passed as a literal 0xC, so the caller site is a fixed, named sound cue rather than a parameterized
  helper.
