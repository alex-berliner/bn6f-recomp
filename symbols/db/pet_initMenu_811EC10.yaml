name: pet_initMenu_811EC10
address: '0x0811EC10'
kind: function
status: confirmed
summary: (Re)initialises the PET menu screen, clearing its state and seeding the scroll offset and first menu entry.
interface: void sub_811EC10(void) // r10 = toolkit; returns r1-r7 scratch, c/v from calls; preserves r4-r7
details: Uses the toolkit (r10) pointer to fetch the submenu work area at oToolkit_SubmenuPtr and word-clears 0x80
  bytes of it. Then zeroes the 0x18-byte ePETMenuData struct, calls SetPETMenuDataFlag(1) to mark the menu data
  as active, and stores 0xFFE0 (-32) as a halfword at ePETMenuData+0x10 — the initial scroll/cursor offset for the
  menu. It then calls sub_8120CC8 with r0=0 and r1=&byte_811EBDA, storing the returned byte pair at ePETMenuData+0xA
  and +0xB (the two bytes describing the first menu entry). Finally calls sub_8046664 to refresh the menu's resources
  before returning.
