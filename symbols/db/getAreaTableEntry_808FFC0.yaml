name: getAreaTableEntry_808FFC0
address: '0x0808FFC0'
kind: function
status: confirmed
summary: Looks up an 8-byte entry in a per-area data table chosen by the current map group, indexed by
  the caller's object field at +0xE, and returns the entry's two halfwords and two bytes.
interface: int getAreaTableEntry(u32 obj /* r5 */, u32 toolkit /* r10 */) -> r0 = entry.half0 << 16, r1
  = entry.half1 << 16, r2 = entry.byte4, r3 = entry.byte6; clobbers N/Z/C/V
details: 'Reads the toolkit''s game state pointer (r10 + oToolkit_GameStatePtr) and picks one of four
  8-byte-stride tables (byte_81434E4, byte_814350C, byte_814352C, byte_8143564) via a table of pointers
  at off_808FFF4: if the map group (oGameState_MapGroup) is 0x85 the last slot is forced (index 3), otherwise
  the byte at gameState+5 selects the table. The table base is then offset by 8 * [r5+0xE] to select an
  entry. The entry is unpacked as: u16 at +0 -> r0<<16, u16 at +2 -> r1<<16, byte at +4 -> r2, byte at
  +6 -> r3. The halfwords are pre-shifted left 16 so callers can sign-extend them cheaply with ASR #16,
  strongly suggesting they are signed 16-bit values (likely coordinates or similar). Only r4 is preserved
  besides the return values.

  '
