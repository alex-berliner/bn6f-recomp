name: sub_800C380
address: '0x0800C380'
kind: function
status: probable
summary: Battle panel tile state-machine update (animating in, settling, activating, timed trigger).
interface: void sub_800C380(u32 r0 /*battle_obj*/, u32 r1 /*tile_data*/) panel_obj in r7 -> u16 r1 (delay) in oTimerActive,
  byte r2 in r7->+6
details: "Acts as the per-tick state machine for a battle field panel/grid tile object.\nDispatches on the object's\
  \ state byte at [r7+0x2]:\n  state 0: no-op.\n  state 1: panel is animating in. Resets oTimerSettle to 0x708,\
  \ decrements oTimerActive each\n            call; on reaching 0 transitions to state 2, refreshes panel params\
  \ and computes a\n            new delay via sub_800C488 into oTimerActive; otherwise sets a \"blink speed\"\n\
  \            (r7+0x6) to 1 (steady) or 2 (blink) based on whether the remaining count is\n            <= 0x3C\
  \ and bit 1 is set.\n  state 3: panel just landed. Sets both timers, then checks flag word at [r7+0x18]; if it\n\
  \            has any of bits 0xF800000 set but NOT bit 0x100000, queries object_getPanelParameters\n         \
  \   and, when the result masked by 0xF880080 is zero, switches to state 1, refreshes\n            params + delay,\
  \ and plays sound 0x97 via PlaySoundEffect.\n  state 8: timed-trigger panel. Refreshes timers, picks an expected\
  \ delay of 0x8C (normal)\n            or 0x46 when [r7+0xa] (tileX) > 3; when the global counter at dword_203CB04\n\
  \            matches, calls sub_80C5B76 to spawn the tile-effect/timer trigger with X=0x28\n            and speed=0x32.\n\
  \  state 9-0xC: post-action settle. Refreshes oTimerActive via sub_800C488, decrements\n            oTimerSettle;\
  \ on reaching 0 transitions to state 2, refreshes params and resets\n            oTimerSettle to 0x708. Otherwise\
  \ sets [r7+0x6] to state (when remaining>0x3C)\n            or to 2 (on the quarter-tick blink); original state\
  \ value doubles as the\n            animation speed byte.\n  default: simply refreshes both timers via sub_800C488.\n\
  Field offsets in the tile object: state at +2, anim/refresh trigger (speed) at +6, tileX at\n+0xa, tileY at +0xb,\
  \ oTimerActive at +0xe, oTimerSettle at +0x12, flags word at +0x18.\nsub_800C488 takes R0 and returns a u16 delay\
  \ in R1 (used to seed oTimerActive each tick).\nobject_updatePanelParameters is called after every state transition\
  \ to refresh the panel's\nrow/column parameters from the battle controller; object_getPanelParameters is read-only.\n"
