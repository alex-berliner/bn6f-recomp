name: battle_applyPanelStateColumn
address: '0x080B8844'
kind: function
status: probable
summary: 'Landing effect of a lobbed projectile: writes a panel-state code (from a small table indexed
  by the object''s Param1) to the landed panel and to the panels above and below it, via sub_80B8870.'
interface: (r5 = battle object) -> none; reads oBattleObject_Param1, PanelX, PanelY; writes oBattleObject_ExtraVars+4;
  calls sub_80B8870(x, y), (x, y-1), (x, y+1)
details: Clamps oBattleObject_Param1 to 0..4 and uses it to index a 5-entry table at byte_80B88B4, storing
  the entry into oBattleObject_ExtraVars+4, then calls sub_80B8870 with (PanelX, PanelY). It then overwrites
  ExtraVars+4 with the constant 1 and calls sub_80B8870 again at (PanelX, PanelY-1) and (PanelX, PanelY+1),
  after adjusting r1 by -1 then +2. So the same panel-mutation helper runs on a vertical 3-panel column,
  with the center panel getting the table-selected state and the two flanking panels getting state 1.
  This matches the caller battle_lobbedProjectileLandPhase's alternate landing behavior of cracking the
  target panel and its neighbors. ExtraVars+4 evidently carries the panel-state/terrain code consumed
  by sub_80B8870.
