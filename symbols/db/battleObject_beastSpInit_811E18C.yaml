status: probable
summary: 'Initializes a BeastOut "SP" overlay BattleObject: sets type 0x23, GUI sprite id 0x32, anim 0,
  palette bank 0xA, no shadow, halfword 0x258 stored, then hands off to its stage-update.'
interface: '(r5 = BattleObject*) -> void ; side effects: writes many fields of the BattleObject/sprite
  and animates via the stage-update.'
details: '- Writes the object header type byte to 0x23 (`strb r0, [r5]` with r0=0x23 — this is the object
  header''s Index field, which lives at r5+1 in the standard layout; here it''s the first byte after the
  0x10-byte linked-list prefix used by the macro, so r5 is being treated as a bare ObjectHeader pointer
  at this point).

  - Calls `initGuiSprite_8002770(0x32)` to attach GUI sprite 0x32 (BeastOut "SP" overlay sprite) to the
  object.

  - Sets animation index 0 (`sprite_setAnimation(0)`), loads its animation data (`sprite_loadAnimationData`),
  and clears the shadow flag (`sprite_noShadow`).

  - Sets the sub-entry palette bank to 0xA (`sprite_setSubEntryPaletteBank_800304A`) and the sub-record
  field+0xA to 0.

  - Writes halfword 0x258 into a slot via `slotList_storeHalfwordAndClearField_800306C(0x258)` — 0x258
  looks like a palette/transform storage value.

  - Sets OAM priority 1 (`sprite_setPriority_8002E14(1)`) and palette 0 (`sprite_setPalette(0)`).

  - Writes 0x04 to r5+8 (object CurState area) — almost certainly `CUR_STATE_UPDATE` (0x4) so the object
  will start updating.

  - Tail-calls `battleObject_setCoordsAndUpdateSprite_811E1D4` which snaps the sprite to (0xCC, 0x1E)
  and runs the object update.

  - The captured-call sites are all `snap_beastsp_*` test fixtures, confirming this is the BeastOut SP
  overlay object initializer used by snapshot/state-restoration paths.

  - No value is returned to callers (only r5/lr are live); function is effectively `void`.

  '
