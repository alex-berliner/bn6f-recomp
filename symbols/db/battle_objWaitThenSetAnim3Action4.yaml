- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst/bne guards one-time init writing phase 4 and timer
    9; ldrh/strh on oBattleObject_Timer with sub/bgt is the frame countdown; expiry block writes oBattleObject_CurAnim=3
    and oBattleObject_CurAction=4, then zeroes CurPhaseAndPhaseInitialized; no arguments used; all state
    accessed via r5, matching the battle-object step dispatch convention; run under battlesweep/beastsp/chips
    routes, i.e. inside battle object scripts
