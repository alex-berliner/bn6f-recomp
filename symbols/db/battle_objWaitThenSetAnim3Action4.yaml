name: battle_objWaitThenSetAnim3Action4
address: '0x080E38C8'
kind: function
status: probable
summary: 'Battle-object behavior step: waits 9 frames on first entry, then switches the object to animation
  3 with action 4.'
interface: (r5 = battle object pointer, implied) -> mutates oBattleObject_CurPhase/Timer/CurAnim/CurAction;
  no return value
details: 'On entry with CurPhase==0 it initializes the step: writes phase 4 and a 9-frame timer into oBattleObject_Timer.
  Every subsequent call decrements the timer until it reaches 0 (bgt loop), then sets CurAnim=3 and CurAction=4
  and clears CurPhaseAndPhaseInitialized to return the object''s script to its dispatch state. It is a
  stateless per-frame step driven by r5, the battle object, not by an argument, so it must be reached
  via a table/dispatcher that keeps the object in r5. The fixed 9-frame delay and fixed anim/action values
  suggest a short wind-up or recovery pause before (or after) an object''s action.'
