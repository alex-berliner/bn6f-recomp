kind: function
status: confirmed
summary: 'Cutscene/chatbox tick: if PET flag 0x01 is clear, neither cutting-back cutscene position matches,
  and chatbox flag 0x80 is unset, run sub_804C144 then sub_804C298.'
interface: 'void sub_804C11C(void); /* in: r5, r10, lr; out: r2; clobbers r0,r1,r3,lr and nz,c,v; preserves
  r4-r7 */'
details: 'Acts as a gated dispatcher for a two-step chatbox/cutscene update. The four early-return checks
  gate the call to sub_804C144 followed by sub_804C298: TestPETMenuDataFlag(1) must return zero (flag
  bit 0x01 of the PET menu data is clear); cutscene_checkOriginalCutsceneScriptPos_8036F40 must not match
  the current cutscene script position; cutscene_checkOriginalCutsceneScriptPos_8036F58 must also not
  match (i.e. we are not within those two blocking cutscene scripts); and chatbox_mask_eFlags2009F38(0x80)
  must report that bit 0x80 of the chatbox eFlags2009F38 byte is clear. Only if all four pass do the two
  sub-routines run, both of which also gate in similar ways (per their own contracts). The function takes
  no explicit C-style parameters and produces no explicit return; r2 is the only register exposed as an
  output to callers.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
