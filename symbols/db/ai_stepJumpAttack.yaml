name: ai_stepJumpAttack
address: '0x080EF348'
kind: function
status: probable
summary: 'Per-frame update for an enemy AI jump/leap attack: starts the jump (animation, flags, upward
  Z velocity, panel reservation) then integrates the Z arc with gravity until the step timer runs out.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; sets oAIAttackVars_HitElement = 4 when the
  timer expires
details: 'If oAIAttackVars_AttackElement is still 0, the jump is initialized: animation 0x11 is started
  via object_setAnimation, the counter timer is reset to default, flag bits 22 and CANNOT_SLIDE are set
  on the object''s flags, ZVelocity is loaded with 0x6000, the step timer is set to 0x10 frames, the object''s
  collision region is cleared, its current panel (PanelX/PanelY copied to FuturePanelX/Y) is reserved
  via object_reservePanel, and AttackElement is set to 4. Every frame after that (and every frame once
  initialized), ZVelocity gets 0x3000 added — decelerating the 0x6000 upward velocity, so the object rises
  then falls — and Z integrates ZVelocity, giving a jump arc. The 0x10-frame step timer counts down; once
  it goes negative, HitElement is set to 4 (attack lands/registers on the reserved panel). No callers
  are known, so it is presumably dispatched through an AI attack state table.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne gates one-time initialization, then mov r0,#4
    stores it back — a state-machine step; bl object_setAnimation with 0x11 plus object_setFlag1 of bit
    22 and OBJECT_FLAGS_CANNOT_SLIDE matches launching a jump (airborne, no slide); ZVelocity := 0x6000
    then ZVelocity += 0x3000 per frame with Z += ZVelocity is a classic gravity arc (rise then fall);
    PanelX/Y copied to FuturePanelX/Y before object_reservePanel — reserving the panel the jump will land
    on; step timer 0x10 counts down and on expiry sets HitElement = 4, handing off the landing hit
  refs:
  - bn6f/asm/asm31.s:119368
  - 0x0801A074 object_clearCollisionRegion
  - 0x0801BB1C object_reservePanel
  - 0x0800F2B6 object_setAnimation
  reproduce: python3 tools/asmcat.py 0x080EF348
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-223614'
