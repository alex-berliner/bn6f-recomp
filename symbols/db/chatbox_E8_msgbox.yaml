name: chatbox_E8_msgbox
address: '0x08040F70'
kind: function
status: confirmed
summary: 'Dispatch a chatbox script opcode (R4+1): pick a sub-handler from the msgbox jump table, optionally pre-loading
  state/cursor fields into the chatbox state buffer (R5), then advance the script pointer by a per-opcode stride.'
interface: '/* Arm-mode entry called with: */

  /* inputs:  r4 = script pointer, r5 = chatbox state buffer */

  /* outputs: r0 = handler return flag (non-zero => advance script), plus r4/r5/r2/r3/r6-r12 clobbered */

  /* flags:   nz/c/v from handler */

  void chatbox_E8_msgbox(void);

  '
details: "Reads the opcode byte at r4+1 and uses it three ways:\n  1. To index chatbox_EB_msgboxJumpTable (after\
  \ <<2) and tail-call one of four thunks\n     (chatbox_stepOpenAnimation_804103E / chatbox_8041090 / chatbox_closeAndReset_80410F8\
  \ /\n     chatbox_804110C) via `mov lr,pc; bx r0`. Indices 0..3, 4..7, 8..B, C..F (and 10..11)\n     all map to\
  \ the same repeating pattern {open, mid, close, post}.\n  2. For opcodes in coarse bands the script-side r4+1\
  \ value maps onto a small msgbox-state\n     constant written to r5+0x1D2 (msgbox_state field): cmd>=0x10 -> 6,\
  \ 0xC..0xF -> 5,\n     8..0xB -> 4, 0..3 -> 0.\n  3. For the mid band (4..7, the else branch) it copies r4+2 verbatim\
  \ into r5+0x1D2 and,\n     if r4+3 != 0xFF, loads a (csrCoord, unk_1B) pair from byte_8045DCC[idx*4] into\n  \
  \   oChatbox_CursorIdx / oChatbox_Unk_1B of the chatbox state buffer.\nIf the tail-called handler returns non-zero\
  \ in r0, the script pointer r4 is advanced by\nLD8(byte_804102C + opcode) (a per-opcode stride table), then returns\
  \ to caller.\nQuirks: pushes {r0-r2} around the else-branch writes because the same registers are needed\nlive\
  \ for the jump-table dispatch afterwards; the jump table entry given to bx is +1'd (Thumb).\n"
