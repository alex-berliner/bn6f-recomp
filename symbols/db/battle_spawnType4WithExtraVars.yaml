name: battle_spawnType4WithExtraVars
address: '0x080C5578'
kind: function
status: probable
summary: Spawns a type-4 battle object from the caller's arguments, stores r7 into its ExtraVars field,
  and runs the standard battle-object initializer on it.
interface: '(r0-r2 = spawn/init args forwarded through, r5/r7 = caller context: r7 = extra-vars value)
  -> r0 = new battle object (or unchanged/0 if the spawn failed); flags from object_spawnType3''s result
  select the failure path'
details: 'The wrapper saves its incoming r0-r2 (and r5) with push {r0-r2,r5}, calls object_spawnType3
  with the object type hardcoded to 4, and reloads the saved arguments via pop {r1-r3,r5} so they line
  up for the initializer. If the spawn failed (beq on object_spawnType3''s result), it returns immediately
  without touching anything. On success it stores r7 — supplied by the caller — into the new object''s
  oBattleObject_ExtraVars field, then calls BasicBattleObjectInitialize with the new object and the saved
  arguments to fill in the base battle-object fields (position, element, related object, flags). It is
  the type-4 analogue of the type-3 spawn path, with the addition of seeding ExtraVars before initialization.
  Both recorded uses fit: the charged-beam AI helper spawns its projectile with it, and sub_80C5590 uses
  it to spawn a sibling object that inherits extra-vars.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: mov r0,#4 then bl object_spawnType3 — hardcodes battle-object type 4 for the spawn; asm:
    beq locret_80C558E right after the spawn call — failure path skips setup and init entirely; asm: str
    r7,[r0,#oBattleObject_ExtraVars] before bl BasicBattleObjectInitialize — seeds ExtraVars from the
    caller; caller 0x0810D808 (ai_attackVars_stepChargeAndShoot) ''spawns the projectile once the timer
    expires'' — projectile spawn via this type-4 helper; caller 0x080C5590 ''spawn a sibling battle object
    inheriting ... extra-vars'' — matches the ExtraVars-seeding behavior'
