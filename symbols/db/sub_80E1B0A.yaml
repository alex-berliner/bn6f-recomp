name: sub_80E1B0A
address: '0x080E1B0A'
kind: function
status: confirmed
summary: Frees a battle object's memory, clearing the extra-vars linked-list head if the object held it.
interface: 'void sub_80E1B0A(void); /* r5 in: battle object; returns r5 intact */'
details: 'Reads the pointer at oBattleObject_ExtraVars off the object in r5; if that

  embedded pointer slot points back at the object itself, it is treated as the

  head of the object''s "extra vars" chain and is nulled (LD32 == R5 → ST32 0)

  before the memory is released. Then tail-calls object_freeMemory with r5 as

  the argument and pops {pc} to return, per the Thumb caller convention.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
