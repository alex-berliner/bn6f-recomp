name: battleObject_updateBeastOutPwrAtk_80A5828
address: '0x080A5828'
kind: function
previous_names:
- sub_80A5828
status: probable
summary: 'Drives a beast-out Navi''s per-tick PwrAtk hand-off animation: copies target coords, runs the
  hand-off sub-state until it finishes, then resets.'
interface: (r5 = BattleObject, r6 = AIData) -> void ; no return; writes AIData.Unk_07 (sub-state), BattleObject.CurState/CurAction,
  then runs sprite_update
details: "Reads AIData byte 7 (r6+7) as a 0..3 sub-state. On 0 it forces CurState=3 via\n  battle_setPlayerDirectionAndAnimFromAIState_80A5890\
  \ then leaves. On 3 it copies 12 bytes\n  from AIData+0x88/+0x8C/+0x90 into BattleObject+0xC/+0x10/+0x14\
  \ (target pose fields), sets\n  CurState=1, bumps Unk_09 (hand-off tick counter) and dispatches sub_80A58E0.\
  \ When that\n  returns non-zero (done), the function clears AIData+7 and resets Unk_09. Any other value\n\
  \  falls through to sub_80A58AC. Always falls through to sub_80A5A5C and sprite_update.\n  Reads/writes\
  \ the BattleObject+CurState/CurAction pair (0x8/0x9), the AIData sub-state at\n  0x07, and the AI-handshake\
  \ tick at 0x09; ends with the standard post-update sprite tick.\n"
