name: battleObject_updateBeastOutPwrAtk_80A5828
address: '0x080A5828'
kind: function
status: confirmed
summary: Per-frame state machine for the Beast Out Power Attack battle-object, handling idle refresh, attack start-up
  data copy, playback stepping, and finish reset.
interface: void battleObject_updateBeastOutPwrAtk(void) — inputs r4,r5,r6,r7,r10,lr; outputs r2,r3,r4,r5,r8,r9,r10,r11,r12;
  clobbers NZCV,r0,r1,lr; preserves r4,r5,r6,r7,r8,r9,r12
details: "Dispatches on owner[r6+7] (the beast-out power-attack selector held by the player object):\n• 0 (idle):\
  \ calls battle_setPlayerDirectionAndAnimFromAIState_80A5890 to keep the sprite\n  facing/anim synced to the current\
  \ AI state.\n• 1 (start-up): on the first frame (obj[r5+9]==0) copies three u32 words from\n  owner+0x88/0x8C/0x90\
  \ into obj+0xC/0x10/0x14 (attack animation/parameter data),\n  sets obj state byte (r5+0) to 3 (playing), marks\
  \ phase byte (r5+9) to 1.\n  Then calls owPlayer_setupPrologue_80A58E0 (playback step). If that returns 0 the\n\
  \  attack animation has finished: clears dispatch byte and phase byte, falls through\n  to the idle-direction\
  \ path.\n• 2 (other/unspecified): calls sub_80A58AC (generic play routine for the object).\n• 3 (finishing): writes\
  \ state 1 into obj byte 0, clears the owner dispatch byte.\nAll paths share a tail that calls battle_copyActorIndexToBattleFlags_80A5A5C(r5)\
  \ to\npropagate the object's actor slot into the battle flag array, then sprite_update(r5)\nto advance the sprite's\
  \ animation frame.\nObject fields touched: r5+0 (state), r5+9 (start-up phase flag), r5+0xC/0x10/0x14\n(copied\
  \ attack data). Owner fields: r6+7 (dispatch selector), r6+0x88/0x8C/0x90\n(source of attack data).\n"
