name: event_mergeFlagRegions
address: '0x0812C194'
kind: function
status: probable
summary: If encryption_800710a returns zero, zero-fills 0x50 bytes at r0 then OR-merges three 0x40-byte
  event-flag regions (bit offsets 0x1E20, 0x2020, 0x2220) from EventFlagsPtr into r0[0..0x3F], storing
  their byte-sum word at r0[0x40]; otherwise just zero-fills the 0x50 bytes and returns.
interface: (r0 = dest buffer, >=0x44 bytes) -> fills r7[0..0x3F] with the OR of three flag regions and
  r7[0x40] = byte sum; flags from encryption_800710a select merge-vs-zero path
details: First calls encryption_800710a; if it returns zero, the function zero-fills 0x50 bytes at r7
  and then, for i in 0..0x3F, writes dest[i] = flagsA[i] | flagsB[i] | flagsC[i], accumulating the byte
  sum into dest[0x40] as a word. The three sources are byte addresses derived from the toolkit's EventFlagsPtr
  plus bit offsets 0x1E20, 0x2020 and 0x2220 shifted right by 3 (i.e. bit-flag regions 0x1E20-0x1E5F,
  0x2020-0x205F, 0x2220-0x225F, each 0x40 bytes). If encryption_800710a returns nonzero, the buffer is
  merely zero-filled (same 0x50-byte ZeroFillByByte) and the merge is skipped, so the checksum word is
  also left zero. The 0x50-byte zero-fill covers the 0x40 data bytes plus slack over the 0x44-byte result.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl encryption_800710a / beq loc_812C1AE gates the merge path against the zero-only path (asm
    lines 3-5 vs 10-12); each source pointer is EventFlagsPtr + (bitIndex>>3) for 0x1E20, 0x2020, 0x2220,
    stored on the stack and read in the loop at loc_812C1F6; loop body ors ldrb from all three pointers
    into dest and accumulates r5, then str r5,[r7,#0x40] stores the sum; ldr r1, =0x40 with add #0x10
    / and 0xF0 gives the 0x50-byte ZeroFillByByte length on both paths'
  refs:
  - bn6f/asm/asm33.s:18824
  - 0x0812C0EC sub_812C0EC
  - 0x080008B4 ZeroFillByByte
  - 0x0800710A encryption_800710a
  reproduce: python3 tools/asmcat.py 0x0812C194
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s mechanics (encryption check, 0x50-byte ZeroFillByByte computed
    as ((0x40+0x10) & 0xF0) = 0x50, OR-merge of three bit-flag regions, byte sum stored at dest[0x40]),
    but the branches are inverted: encryption_800710a BEQ skips to ZeroFill+merge (loc_812C1AE), and the
    fall-through (nonzero) only does the ZeroFill. So when the check is nonzero the buffer is merely zeroed;
    when zero it is filled+merged. Naming and summary need adjusting accordingly.; run wf investigate
    investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
