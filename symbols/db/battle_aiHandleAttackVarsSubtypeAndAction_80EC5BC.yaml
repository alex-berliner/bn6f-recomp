status: probable
summary: Dispatches an AI action based on the AIAttackVars[Unk_00] subtype, calling the matching handler
  and, if bit flags 0x8600 are set in the per-actor Unk_44 word, invoking sub_801056A(r7, 0, 0).
interface: void (no caller-visible return value); r7 = AIDataPtr, lr = return address preserved
details: "Function reads AIAttackVars[Unk_00] via `ldrb r0, [r7, #oAIAttackVars_Unk_00]` (uses r7 as an\
  \ AIData-like\n  pointer). It loads a jump-table base from off_80EC5DC, indexes it by r0, and `bx r1`\
  \ to one of the\n  two handlers listed in off_80EC5E0 (a one-entry direct table here: sub_80EC5EC or\
  \ the\n  battle_aiAttackVarsTryResetAndProcessAction handler). Then it calls GetAIData_Unk_44_Flag,\
  \ ANDs\n  the returned bits against the mask `0x8600`, and only on non-zero does it tail-call\n  `sub_801056A(r7,\
  \ 0, 0)` (mov r1,#0 / mov r2,#0 / bl sub_801056A). The mask 0x8600 = bits 9,11,14\n  of the Unk_44 u32\
  \ (the booleans region of AIData). Pops {pc} to return. r7, r4-r12 are callee-saved\n  and preserved\
  \ through the call.\ndetails-2: |\n  Two handlers in the dispatch table, but only `off_80EC5E0` is shown\
  \ (it points back to\n  off_80EC5DC and then lists sub_80EC5EC+1 and battle_aiAttackVarsTryResetAndProcessAction_80EC67E+1).\n\
  \  Because only one word of dispatch data is shown, both entries are visible in the table — entry 0\n\
  \  is sub_80EC5EC and entry 1 is the processAction helper. Unclear from this slice whether Unk_00==0\n\
  \  maps to sub_80EC5EC (other Unk_00 values fall through to battle_aiAttackVarsTryResetAndProcessAction)\n\
  \  or vice versa. The `+1` indicates Thumb bit-set, normal for Thumb dispatch.\nevidence: |\n  - `push\
  \ {lr}` at sub_80EC5BC entry, `pop {pc}` at locret_80EC5DA: confirms void return / `lr` restore\n  -\
  \ `ldrb r0, [r7, #oAIAttackVars_Unk_00]` reads the dispatch byte from the AI attack vars block\n  -\
  \ `ldr r1, off_80EC5DC` / `ldr r1, [r1, r0]` / `mov lr, pc` / `bx r1`: standard Thumb switch via\n \
  \   in-memory table; `+1` in off_80EC5E0 entries sets Thumb bit\n  - `bl GetAIData_Unk_44_Flag` then\
  \ `tst r0, r1` against mask `0x8600`: checks bits 9,11,14 of Unk_44\n  - `beq locret_80EC5DA` skips\
  \ the optional sub_801056A(r7,0,0) call when mask is zero\n  - `mov r1, #0; mov r2, #0; bl sub_801056A`:\
  \ passes (AIDataPtr=r7, 0, 0) to sub_801056A\n  - No callee-saved register touched across the dispatch\
  \ (r4-r12 appear in `in`/`out` unchanged)\nuncertain: |\n  - Which Unk_00 value maps to which handler\
  \ — only two entries visible here, but the table at\n    off_80EC5E0 may grow; comparing neighbouring\
  \ dispatchers (and using the dispatcher label\n    suffix battle_aiAttackVarsTryResetAndProcessAction_80EC67E)\
  \ suggests Unk_00==1 is the reset/process\n    path, but cannot be confirmed from this slice alone\n\
  \  - Exact meaning of the 0x8600 mask: bits 9/11/14 of AIData Unk_44 correspond to AI/movement flags;\n\
  \    without more callers we cannot tell if this triggers a \"completed action\" or \"needs cleanup\"\
  \n    cleanup\n"
