name: chatbox_clampScrollToTextEnd_813525C
address: '0x0813525C'
kind: function
status: confirmed
summary: Clamps the message viewer's scroll offset so the text window cannot scroll more than 7 lines past the bottom
  of the message.
interface: void chatbox_clampScrollToTextEnd(MessageWindow* win) // win in r5; no return value; clobbers r0, r1
  and flags
details: 'Operates on a message window object passed in r5. Reads the total scrollable text height from +0x28 and
  the current scroll offset (lines scrolled off the top) from +0x2E. If the height is at least 7 and scroll+7 exceeds
  the text height, computes the overshoot, subtracts it from the scroll offset at +0x2E so the visible window stops
  at the last screenful, and adds the overshoot to the text origin adjustment at +0x2A instead. In game terms this
  keeps the text inside the message box when the player scrolls or the page advances beyond the end of the text.
  Signed (ble/blt) comparisons on values loaded with ldrh, so values are treated as signed 16-bit. Pure state update,
  no rendering or input handling here.

  '
