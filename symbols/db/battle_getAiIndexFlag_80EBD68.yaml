name: battle_getAiIndexFlag_80EBD68
address: '0x080EBD68'
kind: function
status: confirmed
summary: Returns a per-AI-index flag byte for AI-controlled battle actors (0 for anything that is not an AI actor),
  reading it from a small lookup table.
interface: 'u8 battle_getAiIndexFlag_80EBD68(battleObject* obj /* r5 */); flags: NZCV clobbered per the C note (CMP
  actorType,#2, plus forced NZ=Z-set on the zero path); r1 clobbered'
details: 'Loads the battle object''s AI data pointer (oBattleObject_AIDataPtr) and checks oAIData_ActorType. If
  the actor type is 2 (AI-controlled), uses oAIData_AIIndex as an index into the byte table at off_80EBD80 and returns
  that byte via a tail "mov pc, lr". Any other actor type returns 0. The table''s set bits (from the words 0x100,
  0x0 and the trailing bytes) are at AI indices 1, 9 and 10 only; all other indices are 0, so this reads as a boolean
  property of specific AI behavior ids (e.g. which AI routines enable some particular conduct). Presumably called
  with a battle object in r5; only r0 is returned, r1 is scratch. Branchless tail return means callers see the CMP''s
  flags unless the zero path ran.

  '
