summary: 'Mr. Weather comp predicate: returns 1 iff the word at eWeatherCompState + 0x20 is 0 (0 otherwise).'
details: 'Body (asm25.s:990-999): r0 = ([r5+0x20] == 0 ? 1 : 0), returned via tst/flags. r5 = eWeatherCompState
  (weatherComp_init_808FDC0 sets +0x20 = 0xFF as a word). weatherComp_pickScript_8090104 (asm25.s:1217) uses it
  together with flag 0xBF2: the byte_808F728 cutscene starts only when this predicate returns 1 (i.e. +0x20 == 0)
  and 0xBF2 is still clear.'
