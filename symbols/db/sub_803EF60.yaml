name: sub_803EF60
address: '0x0803EF60'
kind: function
status: hypothesis
summary: Calls sub_803EF7C to (re)initialize some state and then zero-fills the 0x100-byte buffer it returns.
interface: void clearStateBuffer256_803EF60(void) // takes nothing meaningful in r2/r3 (preserved through); clobbers
  r0/r1, returns garbage in r1
details: 'A tiny two-call wrapper. It first invokes sub_803EF7C, which returns a pointer in r0

  (presumably a work-area/state struct that sub_803EF7C itself just set up or reset).

  It then loads 0x100 into r1 and tail-calls ZeroFillByEightWords, which clears 0x100

  (256) bytes at that pointer, filling eight words per iteration. The function preserves

  r2 and r3 across the calls (ZeroFillByEightWords apparently preserves them too) and

  returns with lr''s flags (nz c v) and r1/r2/r3 live, so callers may inspect r1 after

  the call, but r1 here is just the leftover size argument (0x100), not a meaningful

  result. Without knowing what sub_803EF7C does, the subsystem prefix is unknown; the

  only concrete fact is "reset something, then blank its 256-byte buffer".

  '
