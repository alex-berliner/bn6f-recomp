    direction; bl spawn_t1_0x0_EffectObject with r2=Y+0x20, r3=0x20, r4=0x1e — spawns effect object type
    0; mov r0,#0xa5; bl PlaySoundEffect — dedicated one-shot sound for the moment; strh #0x1e Timer; sub/bgt
    loop; then str #4 into CurPhaseAndPhaseInitialized — fixed 30-frame wait then next phase'
