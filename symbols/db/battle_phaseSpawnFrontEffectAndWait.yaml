name: battle_phaseSpawnFrontEffectAndWait
address: '0x080D3C6C'
kind: function
status: probable
summary: 'Battle-object phase handler: once, spawns an effect 16px in front of the object, plays sound
  0xA5, sets animation 0x1C and a 30-frame timer, then waits before advancing to phase 4.'
interface: (r0 = unused/clobbered; object pointer in r5) -> void; sets oBattleObject_PhaseInitialized=4,
  CurAnim=0x1C, Timer=0x1E, then CurPhaseAndPhaseInitialized=4 when timer expires
details: 'On first invocation (PhaseInitialized == 0) it marks the phase initialized, gets the object''s
  front-direction multiplier via object_getFrontDirection, and computes an X position of object X plus
  (facing * 0x10) — i.e. 16 pixels ahead. It calls spawn_t1_0x0_EffectObject with that X, Y+0x20, r3=0x20
  and r4=0x1E as effect parameters, then plays sound effect 0xA5 and sets the object''s animation to 0x1C
  with a 30-frame timer. On subsequent frames it simply decrements Timer; when it hits zero it writes
  phase 4 into CurPhaseAndPhaseInitialized. The r4=0x1E argument also conveniently keeps r4 saved/restored
  for the caller. This reads like an enemy/NPC attack windup or impact beat: effect + sound + anim, then
  a timed pause before the next phase.'
