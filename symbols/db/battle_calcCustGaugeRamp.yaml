name: battle_calcCustGaugeRamp
address: '0x08010B78'
kind: function
previous_names:
- sub_8010B78
- battle_calcDamageTakenRamp
status: probable
summary: Maps the custom gauge (>>7) through a piecewise-linear ramp to 10..256, or 10 once it is full;
  with battle flag 0x40 returns the per-alliance gauge value (record +0x28) + 0x1500 instead.
interface: (r0 = actor index/param, r1 = index into the 0x1D0-stride array at 2036120) -> r0 = computed
  value; r1 clobbered by BIOS Div.
details: 'Without flag 0x40 the input is GetCustGauge, not a damage counter: t = gauge >> 7 (0..0x80);
  t <= 0x40 gives 10 + 22t/64, t <= 0x70 gives 32 + 96(t-64)/48, t < 0x80 gives 128 + 128(t-112)/15, and
  a full gauge (t = 0x80) returns 10. With flag 0x40 the battle keeps a gauge per alliance (battle_fillCustGauge
  adds 0x1555 to it through sub_802E032), and this returns that record''s +0x28 halfword plus 0x1500.
  What consumes the result is still unknown.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'locret path: total damage counter >>7 drives cmp against 0x40/0x70/0x80 branches, each a linear
    ramp via svc 6 (BIOS Div); add r0,#0xa / #0x20 / #0x80 base offsets give a 10-256 output range that
    drops back to 10 for t>=0x80; flag-0x40 branch: getEntryPtr_2036120_1D0 then ldrh [r0,#0x28]; add
    r0,#0x1500 returns the stored field plus 0x1500 instead; callees battle_getTotalDamageTakenForActor_801DFE4
    and battle_testFlag0x40_800A8F8 place it in the battle subsystem'
