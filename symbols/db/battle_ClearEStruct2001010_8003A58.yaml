name: battle_ClearEStruct2001010_8003A58
address: '0x08003A58'
kind: function
status: confirmed
summary: Zero-fills the 0x48-byte battle work area eStruct2001010 with word-sized stores.
interface: void sub_8003A58(void) // no meaningful inputs or outputs; r0/r1 used internally as ZeroFillByWord args
details: 'Takes no arguments. Loads the address of eStruct2001010 (the symbol is labeled "memBlock")

  into r0 and the constant 0x48 (72) into r1, then tail-calls ZeroFillByWord to clear that

  many bytes word-by-word. eStruct2001010 is a battle-side work area keyed to the 0x2001010

  IWRAM region; 0x48 bytes corresponds to 18 words. Despite the register contract listing

  r2-r7 as inputs/outputs, the function never touches them, so it is safe to call anywhere

  they must be preserved. Flags are clobbered by the call.

  '
