summary: Initializes the player's overworld object struct by calling the generic struct initializer with object
  type 0 (the player).
interface: 'void InitializeOWPlayerObjectStruct(in r2 arg2, in r3 arg3, in r4 arg4, in r7 arg7); out r0, r1, r2,
  r3 (results from callee), flags NZ/C/V set by callee; preserves r4, r7; clobbers lr (saved/restored internally)

  '
details: 'Thin wrapper: loads OVERWORLD_PLAYER_OBJECT (0) into r0 and tail-calls InitializeStructsOfObjectType,
  which presumably zeroes/resets the struct fields for every object of that type (type 0 = the player''s overworld
  object). All other register arguments (r2, r3, r4, r7) are forwarded unchanged to the callee, so their meaning
  is defined by that routine. The wrapper itself does not touch any data or flags.

  '
