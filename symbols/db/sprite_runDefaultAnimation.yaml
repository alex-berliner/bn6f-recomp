name: sprite_runDefaultAnimation
address: '0x08045FBC'
kind: function
status: probable
summary: Wrapper that tail-calls the animation script runner with entry index 0 and r3 = 0.
interface: (r0-r3 = original args, saved to stack) -> r0 = 0, r3 = 0, then b sprite_runAnimationScript;
  returns its result.
details: 'A 5-instruction stub: it pushes lr and then pushes the original r0-r3 (stack alignment and/or
  preserving the caller''s arguments where the callee can find them), zeroes r0 and r3, and tail-jumps
  to sprite_runAnimationScript. Setting r0 = 0 most plausibly selects animation entry 0 (the sprite''s
  default/first animation) of the already-loaded animation file, and r3 = 0 a default mode/flag. Because
  it tail-jumps, sprite_runAnimationScript''s frame begins with the pushed r0-r3, so it may read the original
  arguments back off the stack. Only two unknown callers at 0x0813281C and 0x081328D0 reference it, so
  its exact call context is unconfirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8045FBC ends with ''b loc_8045FEE'', the documented sprite_runAnimationScript; ''mov r0,
    #0 / mov r3, #0'' hardcodes entry 0 and a zero flag before the tail call; ''push {r0-r3}'' after ''push
    {lr}'' saves the caller''s original arguments and keeps sp 8-byte aligned'
  refs:
  - bn6f/asm/asm03_2.s:35
  - 0x0813281C sub_813281C
  - 0x081328D0 sub_81328D0
  - 0x08045FEE sprite_runAnimationScript
  reproduce: python3 tools/asmcat.py 0x08045FBC
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
- Parameter meaning of sprite_runAnimationScript (which arg is the animation file, entry index, mode)
  is needed to confirm r0=0 means 'entry 0'
- Whether sprite_runAnimationScript reads the pushed r0-r3 back from the stack, or the push is only alignment
- What the callers at 0x0813281C/0x081328D0 do and what sprite/object they act on
