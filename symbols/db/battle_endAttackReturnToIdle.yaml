name: battle_endAttackReturnToIdle
address: '0x080F2268'
kind: function
status: probable
summary: 'Battle-object callback that cancels/finishes the current action: resets the object''s animation
  to 0 and exits its attack state.'
interface: (r5 = battle object, r0 unused) -> r0 = object_exitAttackState result; no meaningful flags
details: r5 points at a battle object struct; the function stores 0 into the byte at oBattleObject_CurAnim,
  resetting the object's current animation index (presumably the idle/default animation), then calls object_exitAttackState,
  which clears whatever attack-related state the object was in. With no other arguments or returns, it
  looks like a state-machine hook run when an object's attack or action ends, snapping it back to its
  resting pose. The 6-instruction body suggests it is a small callback (e.g. an 'attack finished' or 'cancel'
  handler) invoked indirectly, which is why no direct callers are on record. Recorded execution from the
  battlesweep route shows it runs during normal battle flow.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r5,#oBattleObject_CurAnim] with r0=0 resets the object's current animation to the idle
    index; tail call to object_exitAttackState (0x08011714), the known routine that leaves the object's
    attack state; r5 is used without being set in the function, so the caller passes the object via the
    register convention for state callbacks; no return value is produced beyond object_exitAttackState's
    r0, consistent with a void state-hook; executed on the battlesweep route, matching a battle object
    state transition
