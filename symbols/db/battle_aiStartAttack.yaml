  detail: bl battle_getAiDifficultyTier_800FE36 / strb r0,[r7,#oAIAttackVars_AiDifficultyTier] — fills
    AI vars block; mov r0,#4; bl battle_aiLoadAttackParams — loads attack 4's parameters; bl battle_findPlayer
    with alliance eor 1, result stored to oAIAttackVars_TargetObjectPtr; mov r0,#0xe; bl object_setAttack0
    — triggers attack id 0xE at the end; Caller sub_81054D8 gates this with GetPositiveSignedRNG & 0xF
    < 6, a random attack choice in the AI step
