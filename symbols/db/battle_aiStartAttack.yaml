name: battle_aiStartAttack
address: '0x0810585C'
kind: function
status: probable
summary: Initializes AI attack-variable block (difficulty tier, init flag 0x20, duration, boost, scratch,
  target) and launches attack id 0xE on the opposing player.
interface: (r0 = battle object?, r5 = battle object, r7 = AI attack-vars block) -> r0 = 0xE attack id
  passed on; sets oAIAttackVars fields
details: Reads the enemy's difficulty tier into oAIAttackVars_AiDifficultyTier and sets InitFlag to 0x20.
  Calls battle_aiLoadAttackParams with attack id 4 to fill version-dependent parameters, then gets a duration
  halfword and boost byte from sub_810574C. Saves oBattleObject_ExtraVars into ScratchVar and stores the
  player object pointer (battle_findPlayer with inverted alliance bit) into TargetObjectPtr. Finally calls
  object_setAttack0 with attack id 0xE to actually start the attack. The InitFlag byte suggests a multi-step
  attack state machine that later steps consume.
