open_questions:
- What is the role of the top 6 bits of each descriptor? They index the jump table but the per-type semantics (e.g.
  flip, palette, VWP) of sub_8001D64 / sub_8001D86 / sub_8001EAE / sub_8001ED0 are unknown.
- Does the "loop always runs once" behaviour for an empty list matter, or is Param2 == 0 simply never produced by
  callers?
- How is the EWRAM scratch region sized? off_8001AB8 is slot-indexed; the total available scratch is not visible
  from this function alone.
