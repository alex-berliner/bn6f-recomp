name: gfx_renderAnimTileSheet_8001C94
address: '0x08001C94'
kind: function
status: confirmed
summary: Renders one frame of an animated GFX tile sheet by decoding each u16 descriptor into an EWRAM scratch buffer
  and queueing a word-aligned copy to the destination
interface: "void gfx_renderAnimTileSheet_8001C94(u32 r0 /* *GFXAnimDataNext */,\n                              \
  \        struct GFXAnimState* r7)\n  -> preserves r4, r7; out c/v from QueueEightWordAlignedGFXTransfer;\n   \
  \  clobbers r0-r3, r5, r6, r8, r9, r12\n"
details: 'Walks the frame''s u16 tile descriptor list (length = state->Param2). Each entry

  is split: low 10 bits = tile byte offset in the tile graphics (<<5 = 32-byte tile

  units), top 6 bits = decoder type used as a jump-table index into off_8001CEC

  (4 handlers: sub_8001D64, sub_8001D86, sub_8001EAE, sub_8001ED0). For every

  entry the chosen handler is called via mov lr,pc / bx r0, decoding one 32-byte

  tile into the EWRAM scratch slot selected by state->Param3 through off_8001AB8.

  After the loop, the full scratch sheet is queued to state->Param1 via

  QueueEightWordAlignedGFXTransfer with size state->Param2 * 32. The slot index

  is re-read before the DMA queue, so a handler that mutates state->Param3 will

  change the source pointer. The post-loop compare is signed against the offset

  after the first iteration, so an empty list still runs the body once.

  Touches: GFXAnimState.Param0 (tile graphics base), .Param1 (DMA dest),

  .Param2 (entry count / DMA size), .Param3 (EWRAM scratch slot); EWRAM via

  off_8001AB8; handler jump table at off_8001CEC.

  '
