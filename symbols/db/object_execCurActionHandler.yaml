name: object_execCurActionHandler
address: '0x080E5964'
kind: function
status: probable
summary: Dispatches a battle object's per-action handler, branching through a table indexed by oBattleObject_CurAction
  (dim screen, draw chip name, ?, undim screen).
interface: (r5 = battle object) -> calls handler from off_80E5978[CurAction] in ARM mode, no return value;
  no flags of note
details: Loads the battle object's CurAction byte, indexes into a 4-entry function-pointer table at off_80E5978,
  and tail-calls the selected handler using the mov lr,pc / bx r1 ARM-return trick. The four handlers
  are object_dimScreen, object_drawChipName, sub_80E5988, and object_undimScreen — the dim/draw/undim
  pattern suggests a screen-overlay object (likely the in-battle chip-name/description display) whose
  CurAction field selects which phase of its behavior to run. The handler is invoked in ARM state (thumb
  bit set in table entries), so it acts as a state-machine driver.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0] indexes the handler table by current
    action; off_80E5978 entries object_dimScreen/object_drawChipName/sub_80E5988/object_undimScreen name
    the possible actions; mov lr,pc / bx r1 plus table entries with +1 thumb bit is the standard BL-from-table
    dispatch pattern; dim/draw/undim handler names imply a transient screen overlay with ordered phases
  refs:
  - bn6f/asm/asm31.s:100715
  reproduce: python3 tools/asmcat.py 0x080E5964
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-055111'
open_questions:
- No known callers, so the identity of the object in r5 and what CurAction values 0-3 mean beyond the
  handler names is unconfirmed
- sub_80E5988 (CurAction 2) is itself undocumented
