name: battle_shiftY16Z16ByOne
address: '0x080BA6A4'
kind: function
status: probable
summary: Adds 1 to a battle object's Y16 and Z16 position fields (fixed-point), e.g. a small per-frame
  movement step.
interface: (r5 = battle object, implied) -> mutates [r5+oBattleObject_Y16] and [r5+oBattleObject_Z16]
  each +1; r0 = 1, r1 = new value; flags set by adds
details: Tiny helper that increments the battle object's Y16 and Z16 halfword fields by exactly 1, leaving
  X16 untouched. It takes the object in r5 rather than an argument register, so it is only usable in contexts
  where r5 already holds the object pointer (the caller likely calls it inside an object update loop).
  Since Y16/Z16 are 12.4 fixed-point position fields, this is a movement of 1/16 unit per call — a slow
  drift, consistent with a floating or rising effect rather than panel-to-panel motion.
