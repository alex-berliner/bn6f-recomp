name: selectPlayerSide_801EA5A
address: '0x0801EA5A'
kind: function
status: confirmed
summary: Picks player-side VRAM and palette-byte bases from a side flag the caller left at sp+8, returning
  them in r2/r3.
interface: 'void selectPlayerSide_801EA5A(void) /* in: [sp+8] side flag; out: r2 base, r3 pal_base; clobbers
  nz c v */'
details: 'Reads a 32-bit side selector at SP+8. If the selector is 1 it hands back the second side''s

  pair: base = byte_203EFA0, pal_base = 0x6017280; otherwise it hands back the first side''s

  pair: base = byte_203EDA0, pal_base = 0x6016E00. Returned through r2/r3 with `mov pc, lr`

  (tail return), so lr is the only incoming register contract. The "base" pointers are guest

  addresses referenced via the A_ labels byte_203EDA0 / byte_203EFA0 in EWRAM; the pal_base

  values are GBA palette/VRAAM constants (0x6016E00 / 0x6017280). Effectively a tiny selector

  helper for choosing between two player-side tile/palette regions.

  '
