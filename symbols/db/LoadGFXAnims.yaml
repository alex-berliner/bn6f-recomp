name: LoadGFXAnims
address: '0x08002354'
kind: function
status: confirmed
summary: Loads every GFX animation script from a NULL/negative-terminated array of GFXAnimScript pointers.
interface: void LoadGFXAnims(void* gfx_anim_data_arr /* FFStop32<[GFXAnimScript*]> in r0 */)
details: 'Iterates over an array in r5 (copy of r0) of 32-bit entries, each a pointer to a GFXAnimScript. Entries
  are read until one is negative (the sentinel is any value with the top bit set, treated here as (s32) < 0, so
  a plain NULL=0 does NOT terminate — lists must end with a negative terminator such as -1). Each non-negative entry
  is passed in r0 to LoadGFXAnim (0x0800234x range) to load/decompress that animation''s graphics/script data. On
  exit r0 and the NZCV flags hold the result of the final CMP against 0 for the terminator entry — callers get flags
  set as if the terminator had just been compared to 0 (so ''blt''/''mi'' on return skips the loop naturally). Trashes
  r0-r3 (scratch in LoadGFXAnim calls) and r5 (restored); preserves r4, r6-r8, r12.

  '
