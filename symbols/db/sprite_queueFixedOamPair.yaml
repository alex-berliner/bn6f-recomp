name: sprite_queueFixedOamPair
address: '0x0801D564'
kind: function
status: probable
summary: Parameterless helper that enqueues two hard-coded OAM entries (offsets 0xD368 and 0xD36C) through
  the OAM queue.
interface: () -> r0 = undefined (clobbered by calls); queues two sprite_queueOamEntry calls with r2 =
  r3 = 0 and returns
details: The function does nothing but push registers and issue two immediate calls to sprite_queueOamEntry
  (via its Thumb->ARM thunk), then return. First call passes a1 = 0x406C0000 with a2 = 0xD368; second
  passes a1 = 0x7C8000 with a2 = 0xD36C; both with r2 = r3 = 0. The two a2 values differ by 4, suggesting
  consecutive 32-bit slots (or paired 16-bit attrs) in a shadow OAM buffer, so a2 is likely an offset/index
  into that buffer while a1 is a packed attribute or graphics word. No conditional logic, no loops, no
  other data touched — it is a fixed two-sprite draw/show step, probably part of a HUD or UI overlay routine.
  What the two constants render (which sprite, which screen state) cannot be determined from this function
  alone.
