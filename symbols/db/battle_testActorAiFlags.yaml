name: battle_testActorAiFlags
address: '0x08010300'
kind: function
status: probable
summary: ANDs a mask with the AI flags of the battle actor at the given index of the alive-actors list,
  returning the masked flags.
interface: (r0 = flag mask, r1 = index into alive-battle-actors list) -> r0 = actorAIData.flags & mask;
  flags preserved from caller
details: Loads the current BattleState from the toolkit's battle-state pointer, scales r1 by 4 and indexes
  the oBattleState_AliveBattleActors array to get an actor object. It then follows the actor's oBattleObject_AIDataPtr
  to its AIData and reads oAIData_Flags, returning r0 & flags. So it is a predicate-style helper checking
  whether an alive actor has certain AI flag bits set. No flags are set or branches taken inside; the
  caller presumably tests the returned mask.
