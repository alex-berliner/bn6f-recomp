name: camera_updateDerivedOffsets_803007C
address: '0x0803007C'
kind: function
status: confirmed
summary: Recomputes two derived 16.16 fixed-point values in the camera state (offsets +4/+6) from the pending scroll
  target nextX/nextY/nextZ, negating the results.
interface: void camera_updateDerivedOffsets_803007C(Camera* cam /* r5 */); callers read back r1, r2, r4, r6, r7,
  r8 and the nzcv flags (final flags come from the last `neg r6, r6`, i.e. 0 - shifted)
details: 'Operates on the camera state struct passed in r5. Loads the pending scroll target from oCamera_nextX_3c
  (+0x3C), oCamera_nextY_40 (+0x40) and oCamera_nextZ_44 (+0x44), and writes two halfwords into the camera struct:
  offset +4 becomes -(high16 of ((-nextX) + (-nextY))) = high16 of (nextX+nextY), and offset +6 becomes -(high16
  of (((-nextY) - (-nextX))>>1 + nextZ)) = -high16 of ((nextX-nextY)/2 + nextZ). The (X-Y)/2 and (X+Y) combinations
  look like a fixed-point projection of the pending scroll target into two derived axes (the pair of fields at +4/+6
  is presumably consumed elsewhere as an offset/rotation-like quantity). Arithmetic is all 32-bit with asr #16/#1
  fixing; nothing else in the struct is touched, and no other state is read or written. Callers rely on leftover
  registers (r1 = value stored at +4, r2 = nextZ, r4 = 0, r6 = value stored at +6, r7 = -nextY, r8 = -nextX) and
  on flags from the final negation, so any reimplementation must reproduce them.

  '
