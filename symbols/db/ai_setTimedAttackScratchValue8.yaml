name: ai_setTimedAttackScratchValue8
address: '0x080E8A46'
kind: function
status: probable
summary: Sets an AI attack scratch variable to 8 when the timed-element attack is initialized.
interface: (r0 = pointer to AI attack scratch variable or 0) -> r0 = unchanged; flags unchanged
details: When the supplied pointer is non-null, the function writes the constant 8 at offset 0x08 from
  that pointer. It is called by ai_attackStepTimedElement only when oAIAttackVars_ScratchVar is nonzero,
  immediately after configuring element 4, animation 0x40, collision region 2, and the attack step timer.
  The function does not modify registers except for using r1 as a temporary and preserves the link register.
