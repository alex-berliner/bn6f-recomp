name: loadEntityJumpOffset00Gfx_812B530
address: '0x0812B530'
kind: function
status: confirmed
summary: "- Loads and DMA-uploads the 0x100-byte graphics slot pointed to by the\n  entity's jump-table\
  \ entry 0, and marks the entity's offset 0x1B flag\n  with 0x10.\n"
interface: 'void sub_812B530(struct Entity *r5);

  '
details: "- Input: r5 = entity struct (size 0x1B+ touched here, anchored at eStruct200BC30).\n- Calls\
  \ eStruct200BC30_getJumpOffset00 to obtain an index from the entity.\n- Treats the index as a slot into\
  \ the four-entry pointer table at\n  off_812B55C (pointers in dword_86D9B84, dword_86D9A00, dword_86D9AC4,\n\
  \  and one more at 0x812B560 pointing to 0x86D9B84).\n- Decompresses the chosen LZ77-compressed graphics\
  \ blob into the shared\n  decompression buffer eDecompBuffer2013A00 via SWI_LZ77UnCompReadNormalWrite8bit.\n\
  - Skips the 4-byte LZ77 header and queues an 8-word-aligned 0x100-byte\n  DMA transfer from the decompression\
  \ buffer into VRAM tile/sprite slot\n  0x06014700 using QueueEightWordAlignedGFXTransfer.\n- OR-s 0x10\
  \ into the entity flag byte at offset 0x1B (likely a\n  \"graphics loaded/visible\" bit).\n- Preserved:\
  \ r4, r5, r6, r7.\n- Quirks: DMA destination is hard-coded (0x06014700, size 0x100) rather\n  than derived\
  \ from the entity; the function does not clear the flag bit\n  first (read-modify-write OR).\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
