name: gfx_fillAllBandedTilemaps_81330AC
address: '0x081330AC'
kind: function
status: confirmed
summary: Refills all seven background tilemap buffers from a static descriptor table, each via a banded
  consecutive-row tilemap fill.
interface: 'void sub_81330AC(void); /* in: none (lr only); out: none; r4-r7 preserved, flags clobbered,
  Z set on exit from final CMP r6,#0x1C */'
details: 'Loops over a table of 7 pointers at off_81330CC (indexed r6 = 0,4,...,0x18; loop runs while
  r6 < 0x1C). Each pointer targets a small descriptor laid out inline after the pointer table: { u32 dst;
  u32 src; u8 rows; u8 bands; } — the destination tilemap buffer in IWRAM (0x201C400, 0x201C480, 0x201C4A0,
  0x201C4C0, 0x201C4E0, 0x201C4F0, 0x201C500) and a source tile-data blob in ROM (0x30B200, 0x30B240,
  0x30B280, 0x30B290, 0x30B2A0, 0x30B2A2, 0x30B2A6). For each entry it loads dst (r0), src (r3), rows
  (r1) and bands (r2) and calls gfx_fillTilemapConsecutiveBanded_8120C94, which presumably writes rows
  of tiles into the destination buffer, split into ''bands'' (the second byte of each descriptor is 4
  for the first entry and 1 for the rest — the first buffer gets a different banding, likely a multi-layer
  or partially differing background). No arguments are taken and none are returned; the function is a
  parameterless "set up all BG tilemaps" initializer. The adjacent byte_813313C/band tables and dword_81331FC
  belong to the same background-setup data block and are not referenced by this routine itself.

  '
