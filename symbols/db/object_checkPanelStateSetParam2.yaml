name: object_checkPanelStateSetParam2
address: '0x080CC006'
kind: function
status: probable
summary: Tests the battle object's panel against an alliance-dependent panel-requirement table and flags
  Param2=1 when the panel state does not match.
interface: (r5 = battle object) -> r0 = panel check result (1 = match); sets oBattleObject_Param2 = 1
  on mismatch; clobbers r1,r3,lr
details: Reads the object's PanelX/PanelY, resolves a panel-parameter entry via GetAllianceDependentPanelParamArgs2
  using the table at byte_80CC024 (mask bytes 0x10 set / 0x80,0x0B cleared, so it requires specific panel
  flag bits and forbids others, e.g. hole/broken states), and calls object_checkPanelParameters. If the
  panel does not satisfy the required flag state, it writes 1 into oBattleObject_Param2, otherwise leaves
  Param2 untouched. The table being alliance-dependent suggests the required panel state differs between
  player/enemy sides (e.g. panel owned or transformed by one side). It is a state check, not an action;
  callers sub_80CBCB0/sub_80CBD10 presumably branch on Param2 afterwards.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0/r1 from oBattleObject_PanelX/PanelY then bl GetAllianceDependentPanelParamArgs2 with
    off_80CC020=byte_80CC024 (sub_80CC006); bl object_checkPanelParameters (known: returns 1/0 for panel
    flag mask match); bne locret skips, and only on cmp r0,#0 fallthrough is ''mov r1,#1; strb r1,[r5,#oBattleObject_Param2]''
    executed; byte_80CC024 = 0x10,0,0,0,0,0,0x80,0x0B: required/forbidden panel flag masks for the check'
