name: getIndexed20ByteTableEntry_80355DE
address: '0x080355DE'
kind: function
status: confirmed
summary: Returns a pointer to entry `index` of a fixed 20-byte-per-entry table at byte_80984C8.
interface: 'u8* getIndexed20ByteTableEntry(u32 index) // in: r0=index, lr=return; out: r0=entry address, r1=table
  base, r2=byte offset; c/v set by the ADDS used for the address computation (nz clobbered)'
details: Pure address-computation helper. Multiplies r0 by 0x14 (20 bytes per entry), adds the fixed base byte_80984C8,
  and returns the entry address in r0. It also leaves the table base in r1 and the byte offset in r2, which some
  callers may rely on. The multiply/add is done with an ADDS-style sequence, so the carry and overflow flags reflect
  the pointer arithmetic and callers are documented to branch on c/v; nz are clobbered. Nothing else is read or
  written, so the meaning of the table's contents (and thus a fully game-specific name) is not yet known from this
  function alone; the 20-byte stride suggests small structs such as text/graphics/NPC metadata entries.
