name: ZeroFillByWord
address: '0x080008E0'
kind: function
status: confirmed
summary: Zero-fills a buffer a word at a time by calling BIOS CpuSet with a fixed-source zero word, leaving all
  argument registers intact.
interface: void ZeroFillByWord(void* dest /*r0*/, u32 sizeBytes /*r1*/); // preserves r0-r3; returns flags N=0,
  Z=1, C=0, V=0
details: 'Utility wrapper around SWI_CpuSet that clears `sizeBytes` bytes at `dest` to zero,

  32 bits at a time. It pushes r0-r3/lr, reserves one stack slot holding the value 0

  as the (fixed) fill source, converts the byte count to a word count (r1 >>= 2), and

  calls CpuSet with control word 0x5000000 | wordCount — the 0x5000000 bits select

  32-bit transfer with a non-incrementing source, so only the destination advances

  through the buffer. No alignment or zero-length checks are made; the caller must

  pass a word-aligned size (and dest should be word-aligned). r0-r3 are restored via

  pop {r0-r3,pc}, so the call is side-effect-free from the caller''s register view.

  The `mov r1, r0` is encoded as `adds r1, r0, #0`, so the outgoing flag state is

  N=0, Z=1, C=0 (dest + 0 never carries), V=0. A generic memory helper rather than a

  game-logic routine; usable as a prefix-less library name, hence the name is kept.

  '
