name: pickHighestWeightRandomTiebreak
address: '0x0802E8A4'
kind: function
status: probable
summary: Scans a 0x170-byte weight table within one record and returns the offset of the highest-weight
  entry, breaking ties randomly via the secondary RNG.
interface: (r0 = index of 0x170-byte record at unk_203A0A0) -> r0 = byte offset (0..0x16F) of winning
  entry, or 0xFFFF if all bytes are 0; flags clobbered by calls
details: Computes unk_203A0A0 + r0*0x170 to select one 0x170-byte record, then walks all 0x170 bytes looking
  for the maximum nonzero value. When a byte strictly exceeds the current best (r7) it is taken unconditionally;
  when it equals the current best, a coin-flip from GetRNGSecondary decides (r0>>28 gives a 0-15 shift
  amount, the shift's carry-out bit is the random bit, taken only if carry is set — so ties are not exactly
  50/50). The index of the winning byte is kept in r6, initialised to 0xFFFF so all-zero records return
  0xFFFF. This looks like AI/utility weighted selection, e.g. picking the best-scoring slot or target
  among equal-priority candidates.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mul r2, r0 by 0x170 + base unk_203A0A0 indexes one record of 0x170 byte weights; cmp r1, r7
    with bgt/bcc: larger bytes always win, equal bytes win only on a random carry; bl GetRNGSecondary;
    lsr r3,r0,#0x1c; lsr r0,r3 uses top nibble as shift and carry-out as random bit; mov r6, r2 stores
    winning index, initialised to 0xFFFF returned when no nonzero byte exists; only callee GetRNGSecondary
    confirms the random tie-break purpose'
  refs:
