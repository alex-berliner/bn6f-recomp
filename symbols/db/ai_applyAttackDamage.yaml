name: ai_applyAttackDamage
address: '0x08106660'
kind: function
status: probable
summary: Wrapper that forwards the boss attack's target panel coords, init flag and damage to the shared
  panel-damage routine.
interface: (no args; reads oAIAttackVars_TargetPanelX/Y, oAIAttackVars_InitFlag, oAIAttackVars_Damage
  from r7 struct) -> r0 = result of sub_80DCDD4
details: 'A near-empty trampoline: it loads the target panel X and Y, the init flag and the damage value
  from the AI attack variable block pointed to by r7 and calls sub_80DCDD4 with them as r0-r3, returning
  its result. It exists only to adapt the boss AI attack struct layout to the generic damage/strike helper''s
  parameter convention. Given the caller is the repeated-strike step of a boss attack, sub_80DCDD4 is
  almost certainly the routine that applies a hit to a battle panel.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1 from oAIAttackVars_TargetPanelX/Y then ldrb r2 InitFlag and ldr r6 Damage before
    single call to sub_80DCDD4; sole caller 0x0810610A ai_attackCycleRepeatStep, which strikes a target
    panel over several cycles and marks the hit element 0x14; function body is only the parameter loads
    plus bl/pop, so its purpose is entirely defined by the call it tailors
  refs:
  - bn6f/asm/asm31.s:169357
  - 0x0810610A ai_attackCycleRepeatStep
