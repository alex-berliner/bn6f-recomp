name: object_updateFreeOnFrameFlag
address: '0x080AA1C8'
kind: function
status: probable
summary: Sprite-update routine for an overworld map object that frees the object when the current animation
  frame's attribute byte has bit 0x80 set, then updates the sprite.
interface: (r0 = object pointer) -> void; flags set by tst/bit test only
details: Calls sprite_getFrameParameters on the object and tests the returned attribute/parameter word
  against 0x80; if the bit is set, calls FreeOverworldMapObject to release the object (clears its allocation
  bit, frees its slot, unmarks it in the sprite system). In either case it then calls sprite_update to
  advance/run the sprite's update handler. Effectively an update callback implementing 'despawn on flagged
  animation frame' for overworld map objects. r4-r7 are preserved but unused. No callers are known, so
  whether r0 is the object pointer as with sibling update callbacks is inferred from the callees' interfaces.
