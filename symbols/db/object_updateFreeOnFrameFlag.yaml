- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_getFrameParameters; mov r1,#0x80; tst r0,r1; beq skip — reads frame attribute and
    tests bit 0x80 (0x080AA1CC-0x80AA1D4); bit set path: bl FreeOverworldMapObject — object is deallocated
    when the flag is present (0x080AA1D6); unconditional bl sprite_update before pop — runs the sprite
    update regardless of branch outcome (0x080AA1D8); callees'' known signatures take the object pointer
    in r0, matching a per-object update callback'
