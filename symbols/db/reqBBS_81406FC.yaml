name: reqBBS_81406FC
address: '0x081406FC'
kind: function
status: confirmed
summary: Builds a 30-bit sprite animation-state mask from HP (offset 0x1E) and stock/charge (offset 0x5) by banding
  each value into five tiers and XOR-ing tier-bit plus intra-tier-progress-bit into 0x3FFFFFFF, then writes the
  mask onto the eStructArr2008450 sprite array via sprite_setUnk0x2c.
interface: 'reqBBS_81406FC(r5: sprite_data*) -> void; preserves r5; clobbers r0-r3, nzcv, lr; tail-calls sprite_setUnk0x2c(r0=mask,
  r5=eStructArr2008450)'
details: HP half-word at r5+0x1E is banded into five tiers (floors 0x28/0x1E/0x14/0x0A/0). Each tier sets one band
  bit in positions 0x0A-0x0E and one progress bit in positions 0-9 (progress = 9 - (value - tier_floor)). Stock
  byte at r5+0x5 is banded identically, setting band bits 0x19-0x1D and progress bits offset by 0xF (so bits 0x0F-0x18).
  All four XOR'd bits are inverted against the base mask 0x3FFFFFFF, producing a 30-bit value that encodes the sprite's
  current HP-band, HP-within-band, stock-band, and stock-within-band simultaneously. The resulting mask is passed
  as r0 to sprite_setUnk0x2c together with the global sprite array pointer eStructArr2008450, which presumably selects
  which visual/animation layers are active for that sprite. r5 is saved/restored around the tail call because sprite_setUnk0x2c
  overwrites r5 with the array address. The 'req' prefix and 'BBS' in the original name suggest this is invoked
  as part of a per-frame sprite-update request loop, likely during battle or overworld rendering.
