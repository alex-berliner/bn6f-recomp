name: battleObject_chipSelectStateTick
address: '0x08027044'
kind: function
status: probable
summary: 'Per-frame update for the battle chip-select object: dispatches a state handler selected by the
  state byte at +2, then runs the chip-slot pulse animation and graphics-queue steps.'
interface: '(r0 = self: * S20364C0) -> r0 = ?; flags from dispatched handler'
details: Reads the object's state byte at [self+2] and indexes the 7-entry table at off_8027060, dispatching
  to one of sub_802707C..sub_80271C2 via blx-style indirect call (mov lr, pc; bx r1). After the state
  handler returns, it unconditionally calls battleObject_chipSelectAnimTick_8029C08 (OAM affine pulse
  push + phase walk) and sub_802899C (queues the object's 0x200-byte gfx block for VRAM 0x6016CC0 plus
  a cartridge FIFO record). The state byte is not validated, so states beyond 6 read past the table. Acts
  as the top-level tick/state machine for the chip-select battle object S20364C0.
