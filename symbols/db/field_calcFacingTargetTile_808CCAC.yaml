name: field_calcFacingTargetTile_808CCAC
address: '0x0808CCAC'
kind: function
status: confirmed
summary: Computes the tile coordinate one cell ahead of the player in their facing direction (8-way) and
  writes it into the target object's position fields.
interface: void field_calcFacingTargetTile_808CCAC(u32 obj /*r5*/, u32 playerCtx /*r10*/); // writes obj+0x1A
  (x tile) and obj+0x1C (y tile); r5 preserved
details: 'Calls GetOWPlayerFacingDirection to get the player''s 8-way facing (0–7) and ReadOWPlayerObjectCoords
  to get the player''s tile coordinates (16.16 fixed point; shifted right by 16 to get the integer tile
  index). Adds or subtracts 0x18 (one tile in pixel units) to x and/or y depending on direction: 0 = (+x,-y),
  1 = (+x), 2 = (+x,+y), 3 = (+y), 4 = (-x,+y), 5 = (-x), 6 = (-x,-y), default = (-y). Stores the resulting
  tile x into [r5+0x1A] and y into [r5+0x1C] as signed halfwords. r10 (player context pointer) is listed
  in the register contract but is not referenced in this function''s body.'
