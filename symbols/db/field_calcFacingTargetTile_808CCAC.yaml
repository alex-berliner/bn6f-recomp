open_questions:
- What object type is r5? The +0x1A/+0x1C fields suggest a generic object struct; could be an NPC, an
  interaction target, or a cutscene entity.
- Why is r10 (player context) in the contract but unused? Possibly a caller passes it for a sibling function
  or the ABI is shared across a group of similar routines.
- The default (facing >= 7) branch matches case 0's y adjustment only; confirm whether facing 7 truly
  means 'down' and falls through, or is an error path.
