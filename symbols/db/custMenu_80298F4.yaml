kind: function
status: confirmed
summary: 'Per-frame handler for the first battle tutorial custMenu: polls the current tutorial state''s check routine
  and, if it yields a message, plays it through the chatbox while parking the menu.'
interface: int custMenu_firstBattleTutorialTick_80298F4(custMenu* menu /* r5 */); returns r0 = 1 when a text script
  was started this frame, 0 otherwise (no tutorial active, no check for this state, or the check produced nothing).
  r2/r3 are returned as the callees leave them; r4-r7/r10 preserved. Flags clobbered (nzcv).
details: 'Reads the menu struct''s state byte at +0x0C and dispatches to one of five

  tutorial check routines keyed by state: sub_802996E (state 0),

  sub_80299B6 (state 1), sub_80299FA (state 3), sub_8029A1E (states 4 and 5

  share this check), sub_8029A36 (state 6). State 0xFF means no tutorial is

  active, and state 2 (plus any other value) has no check, so those return 0

  immediately. Each check receives the state byte in r0 and returns a text

  script index, or 0 for "nothing to say this frame".


  When a check returns a nonzero script index, the function looks up the

  text archive in the TextScriptFirstBattleTutorials table (indexed by the

  state byte, entry size 4) and runs it via chatbox_runScript. It then

  parks the menu while the text plays: the previous value of the timer byte

  at +0x01 is saved to +0x0D, the timer is restarted at 0x34, and the

  halfword counter at +0x02 is cleared. Only r5 (the menu pointer) is

  meaningfully used as input; r4/r6/r7/r10 pass through untouched.

  '
