name: checkLeftRightInputForFolderEdit_8133E3C
address: '0x08133E3C'
kind: function
status: confirmed
summary: Checks left/right d-pad to navigate between folder view and pack view during folder editing.
interface: s32 folderEdit_CheckLeftRightNav(u32 r0 mode_offset, u32 r5 mode_base, u32 r10 toolkit_ptr) -> r0 result,
  nz flags
details: 'Reads the current view mode (bit 2 of byte at mode_base+mode_offset: 0=folder view, 1=pack view) from
  the toolkit''s joypad struct (toolkit+4 gives joypad pointer, +4 gives low-sensitivity held buttons). If left
  is held, returns 1 (accepted) when in folder view, 0 (denied) when in pack view. If right is held, returns 1 when
  in pack view, 0 when in folder view. If neither is held, returns 2 (no input). On denial (result==0), plays sound
  effect 0x7A (the invalid/buzzer beep) via PlaySoundEffect before returning. r1 is an unused input. clobbers r2
  and r0; preserves r3-r7, r10.'
