name: battle_setupAllianceEntryKind3_802DFC8
address: '0x0802DFC8'
kind: function
status: confirmed
summary: Allocates and zero-fills the per-alliance entry in the shared 0x1D0-byte entry pool for a battle object's
  alliance, and if battle flag 0x40 is set, initializes it as an active kind-3 entry anchored at the object's panel
  X and notifies sub_802E07C.
interface: void battle_setupAllianceEntryKind3(BattleObject* obj /* r5 */); // no meaningful return value; r4 ends
  up holding the new entry pointer per the readable C, though the contract lists r4 as preserved
details: 'Reads the object''s alliance (oBattleObject_Alliance) and fetches that alliance''s entry from the pool
  at 0x2036120 via getEntryPtr_2036120_1D0_802E070 (entry stride 0x1D0 bytes). The whole entry is cleared with ZeroFillByWord
  using the odd encoding mov r1,#0xE8; add r1,r1 (0xE8*2 = 0x1D0 bytes). It then tests battle flag 0x40 (battle_testFlag0x40_800A8F8);
  if the flag is clear the fresh entry stays all-zero and the function returns early. If set, it writes: entry+0x00
  = 1 (active), entry+0x0B = 0xFF, entry+0x10 = 1, entry+0x11 = obj->oBattleObject_PanelX (anchor panel x), entry+0x0E
  = 3 (entry kind/type). Finally it re-reads the alliance and calls sub_802E07C(alliance) to register/notify something
  about the new entry. Callers appear to pass junk in r2/r3 (listed as inputs but unread by this code) and the contract
  lists r2 and r3 as outputs.

  '
