name: init_queueBeastSpGfx
address: '0x08142C94'
kind: function
status: probable
summary: Queues a 0x420-byte VRAM DMA of Beast+ special-scenario tile graphics from ROM into BG VRAM.
interface: () -> r0 = queued transfer (src dword_8619730, dest 0x6006C00, size 0x420); no return value
details: 'This is a zero-argument thunk that builds one call to QueueEightWordAlignedGFXTransfer with
  three hardcoded constants: source pointer dword_8619730 (ROM-resident compressed/raw tile data), destination
  0x6006C00 (inside BG VRAM char block 1, at offset 0x2C00), and size 0x420. It performs no logic of its
  own, so its purpose comes entirely from its callers: init_beastSpScenario calls it while initializing
  the Beast+ special-scenario mode (wiping work buffers, clearing flags, starting scene sound), so this
  loads that mode''s VRAM tile set. sub_808CAD4 calls it as well, presumably to (re)load the same tiles.
  No state is kept; nothing is returned.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: only ldr of dword_8619730, 0x6006C00, 0x420 then bl QueueEightWordAlignedGFXTransfer and
    pop {pc}; caller 0x0808CA68 init_beastSpScenario (known Beast+ scenario init) calls it during scenario
    setup; second caller 0x0808CAD4 also invokes it immediately with no arguments; callee QueueEightWordAlignedGFXTransfer
    signature (src, dest, size) matches the three loaded registers; dest 0x6006C00 falls in GBA BG VRAM
    (0x6000000-0x600FFFF), indicating tile/graphics data'
