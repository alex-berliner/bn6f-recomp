name: init_queueBeastSpGfx
address: '0x08142C94'
kind: function
status: confirmed
summary: Queues a VRAM DMA transfer that uploads the Beast-Out SP sprite graphics into the BG/tile area at VRAM
  0x6006C00.
interface: 'void init_queueBeastSpGfx(void); passes callee outputs through: returns r4 and r7 as left by QueueEightWordAlignedGFXTransfer;
  clobbers r0-r3, lr, flags'
details: 'Thin wrapper around QueueEightWordWordAlignedGFXTransfer (queued_src, queued_dest, queued_size):

  src = pointer table dword_8619730 (the Beast-Out SP sprite graphics blob), dest = VRAM address

  0x6006C00, size = 0x420 bytes (0x84 eight-word entries). The queued-transfer helper leaves

  tracking values in r4 and r7 which the caller of this function also expects in its own r4/r7,

  so they are passed through unchanged (r4-r7 preserved here). No other registers are read or

  written; the function is essentially a parameterized call for the Beast-Out SP (Falzar version)

  sprite sheet upload during Beast-Out init.

  '
