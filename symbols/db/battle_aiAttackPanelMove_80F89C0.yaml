name: battle_aiAttackPanelMove_80F89C0
address: '0x080F89C0'
kind: function
status: confirmed
summary: 'AI attack step: pick a destination panel via the per-alliance callback, slide the object there,
  or abort the attack.'
interface: void battle_aiAttackPanelMove_80F89C0(BattleObject *object /*r5*/, u32 r6, AIAttackVars *ai_vars
  /*r7*/) /* returns r1 from callee; clobbers r0-r4,r6-r7,all flags */
details: 'Gate: calls object_canMove (r5=object); if zero-flag set (cannot move) jumps to exit. Panel-data
  table at byte_80F8A0C holds 8-byte entries indexed by BattleObject_Alliance (shifted left by 3). Entry
  layout: word0 = arg1, word1 = arg2 for the callback. The panel-choose callback is read from AIAttackVars_PanelChooseCallback
  (r7+0x?), invoked with r0=table base, r1=arg1, r2=arg2; it returns panel X in r0, panel Y in r1. On
  success (r0 != 0): writes FuturePanelX/Y into the object, calls object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE
  via object_setFlag1, sets CurAnim=4 (slide), StepTimer=3, HasMoved=1, HitElement=4. On failure: sets
  HasMoved=0 and calls object_exitAttackState. r6 is passed through to object_exitAttackState but its
  role is unclear from this call alone.

  '
