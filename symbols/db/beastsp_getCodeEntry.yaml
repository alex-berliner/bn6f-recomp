name: beastsp_getCodeEntry
address: '0x08136290'
kind: function
status: probable
summary: Returns the address of an entry (index*4) in the BeastSP secret-code table at word_201DA80.
interface: (r0 = entry index) -> r0 = pointer to code entry (word_201DA80 + index*4); flags not meaningful
details: 'A tiny table accessor: shifts r0 left by 2 and adds it to the base word_201DA80, returning a
  pointer to a 4-byte record in that array. The BeastSP code UI code (beastsp_feedBoardCodeInput and its
  sibling wrappers at 0x8136218-0x8136384) all call it to fetch entries from the secret-code list, e.g.
  to read a code''s packed data before feeding it to the checker or to compare against the board-cell
  input.'
