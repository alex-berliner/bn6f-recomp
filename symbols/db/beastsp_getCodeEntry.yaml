    getter; caller 0x8136804 beastsp_feedBoardCodeInput uses it on A/B/L/R input to obtain the selected
    code entry for the secret-code checker; multiple adjacent wrappers (0x8136218, 0x8136318, 0x813633C,
    0x8136364, 0x8136384) call it, consistent with field accessors around one code-entry table'
