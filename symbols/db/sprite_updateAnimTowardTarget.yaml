name: sprite_updateAnimTowardTarget
address: '0x080A5E00'
kind: function
status: probable
summary: Thin wrapper that updates an object's animation to face its target using two position pointers
  stored in the object struct.
interface: (r5 = object pointer; reads [r5,#0x28] and [r5,#0x2c] as arguments to sprite_updateAnimByAngleToTarget)
  -> tail-jumps to sprite_updateAnimByAngleToTarget; no own return value logic.
details: 'The function is a 4-instruction thunk: it loads two 32-bit fields at offsets 0x28 and 0x2c of
  the structure reached via r5 and tail-branches into sprite_updateAnimByAngleToTarget, which selects
  an animation from the octant of the angle toward a target position. Given the callee''s purpose, the
  two fields are almost certainly pointers to (or values describing) the object''s own position and its
  target position. It saves r4 and lr per the standard prologue but never uses r4, and its only role is
  to pull the arguments out of the object struct before the call. The caller sub_80A5D80 is undocumented,
  so which entity type owns this struct layout is not confirmed from this snippet alone.'
