name: sub_8129F04
address: '0x08129F04'
kind: function
status: confirmed
summary: Dispatches an eStruct (200BC30) entity to its current step handler and runs the common step epilogue.
interface: 'void eStruct200BC30_runStep_8129F04(void); // pass-through: r2 r3 r4 r5 r6 r8 r9 r10 r11 r12 in; r5
  r8 r9 r10 r11 r12 out; NZCV clobbered'
details: 'Fetches a per-entity step selector from eStruct200BC30_getJumpOffset00 (result in r0), uses it to index
  a 3-entry handler table at off_8129F1C: entry 0 -> sub_8129F28, entries 1 and 2 -> sub_8129FE0. The selected handler
  is called via an indirect `bx` (THUMB+1 switch). After the handler returns, sub_812B26C is invoked as a common
  step epilogue. All other registers (r2-r6, r8-r12) are pass-through inputs to the handler and r5/r8-r12 flow back
  to the caller; r0-r4/r6/r7 are clobbered. Likely the main "tick" / dispatch function for the 200BC30 eStruct entity
  system.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
