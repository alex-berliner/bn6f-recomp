name: object_attackStateTimerTick
address: '0x080FB700'
kind: function
status: probable
summary: Per-frame handler that starts an entity's attack state with a countdown and exits the attack
  when the timer runs out.
interface: (r0-r3 unused; r7 = entity struct, r5 = related entity/work struct) -> updates state byte [r7+1],
  countdown halfword [r7+0x10] (init from [r7+0x18]), counter byte [r5+0x10]; no return value
details: On first invocation (state byte r7+1 == 0) it writes state 4 to r7+1, clears a byte at r5+0x10,
  and copies the halfword at r7+0x18 (the attack duration set elsewhere) into the countdown halfword at
  r7+0x10, then returns. On later frames it decrements r7+0x10 each tick; while it is still positive it
  does nothing else. When the countdown reaches zero it calls object_exitAttackState, ending the attack.
  r5 and r7 most likely point to the same entity (or its work area) as passed by a common object-update
  dispatcher, which would explain the odd mixed use. The state value 4 matches the 'attacking' phase of
  the object state machine.
