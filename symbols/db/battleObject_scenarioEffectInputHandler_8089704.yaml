open_questions:
- The exact range of scenario-effect values that sub_8142A84 constrains on the A path is not directly
  visible; only that bne to "no update" leads to a different flow than beq to "play CAN'T_JACK_IN".
- Whether the sound IDs 0x66 / 0x67 correspond exactly to chip-select L/R/Confirm cues would settle the
  name; current code only proves the interaction with the scenario-effect slot.
- The exact semantic of sub_81421C8 (whether it writes the slot back, or an internal cursor) is inferred
  from being called immediately after a clamped add/sub.
