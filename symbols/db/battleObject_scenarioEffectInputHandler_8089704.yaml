name: battleObject_scenarioEffectInputHandler_8089704
address: '0x08089704'
kind: function
status: confirmed
summary: Processes one frame of joypad input during the battle scenario-effect (jack-in) selection menu; handles
  A to confirm/jack-in, B to cancel, and L/R to cycle the highlighted effect index with 4-step wraparound.
interface: void battleObject_scenarioEffectInputHandler_8089704(void) — reads r2 (extra PlaySoundEffect parameter),
  r10 (toolkit pointer); returns r0 = action code {0 idle/blocked, 1 shoulder cycled, 2 A advanced, 3 B unselected}
  with NZ flags; clobbers r1, r4–r7 via callee wrappers, preserves r4–r7, r10 across the call boundary.
details: "Reads the toolkit's joypad pointer at oToolkit_JoypadPtr (offset from r10).\nHeld-button word is at joypad+2;\
  \ shoulder-button word at joypad+4.\n\nA (mask 0x1 in held word):\n  1. Calls battle_getScenarioEffectStateField_81421D0\
  \ to fetch current state index.\n  2. Calls battle_checkScenarioEffectActive_8142190(state); if Z is set the effect\n\
  \     is not active → play SOUND_CANT_JACK_IN, return 0 (jack-in blocked).\n  3. Calls sub_8142A84; if Z set →\
  \ advance not permitted this frame, return 0.\n  4. Otherwise plays SOUND_SELECT_67 and returns 2 (confirmed/jacked\
  \ in).\n\nB (mask 0x2 in held word):\n  Plays SOUND_UNSELECT_68, returns 3.\n\nL (mask 0x40 in shoulder word):\n\
  \  Plays sound ID 0x66, decrements the state index by 1 (wrapping 0→3),\n  calls e_setScenarioEffectStateB with\
  \ the new index, returns 1.\n\nR (mask 0x80 in shoulder word):\n  Plays sound ID SOUND_UNK_66 (also 0x66 numerically\
  \ in the C path), increments\n  the state index by 1 (wrapping 3→0 at cmp #4), calls e_setScenarioEffectStateB,\n\
  \  returns 1.\n\nFalls through to return 0 when no relevant button is pressed.\nThe state index space is [0..3]\
  \ (four scenario effects selectable).\n"
