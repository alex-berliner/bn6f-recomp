name: battleObject_scenarioEffectInputHandler_8089704
address: '0x08089704'
kind: function
previous_names:
- sub_8089704
status: probable
summary: Battle custom-screen handler that maps joypad (A/B/L/R) inputs over the active scenario-effect
  slot in the chip-select state, playing the appropriate cue and returning a non-zero code on a successful
  change.
interface: 'in (r10 = toolkit, lr) -> r0 = 0 (no change) / 1 (select changed) / 2 (confirm) / 3 (cancel)
  ; side effects: PlaySoundEffect, mutation of scenario-effect state field via sub_81421C8, and reads
  scenario-effect active flag and sub_8142A84.'
details: "- Loads the toolkit joypad pointer from r10 at offset oToolkit_JoypadPtr (0x4), then reads Held\
  \ (offset 0x0) and LowSensitivityHeld (offset 0x4) into r7.\n  - Branches on the A button (test r0=1,\
  \ r7; beq to not-A). The A path calls battle_getScenarioEffectStateField_81421D0 to fetch the current\
  \ scenario-effect slot, then battle_checkScenarioEffectActive_8142190. If both check flags succeed,\
  \ falls through to sub_8142A84; if that returns NZ, plays SOUND_SELECT_67 and returns 2.\n  - On the\
  \ A path but with scenario-effect not active, plays SOUND_CANT_JACK_IN and returns 0.\n  - B button\
  \ (test 0x2) plays SOUND_UNSELECT_68 and returns 3.\n  - L (test 0x40 on LowSensitivityHeld): decrements\
  \ the slot via battle_getScenarioEffectStateField/sub r0,#1; clamps to a minimum of 3 (mov r0,#3 on\
  \ negative), calls sub_81421C8 (setter) with that value, plays sound 0x66, returns 1.\n  - R (test 0x80\
  \ on LowSensitivityHeld): increments slot, clamps to a max of 3 (load 0, on >= 4), setter, plays SOUND_UNK_66,\
  \ returns 1.\n  - The r4 accumulator (0 default) is the final return value via `mov r0, r4` then `tst\
  \ r0, r0; pop {r4-r7,pc}`.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r7, [r7, #oToolkit_JoypadPtr]` (offset 4) and `ldrh r7, [r7, #2]/#4` matches Toolkit
    struct fields JoypadPtr / JoypadPressed (=2) / LowSensitivityHeld (=4). - Constant `1` tested first,
    `beq loc_8089738` skips A; constants 2 / 0x40 / 0x80 match JOYPAD_A / JOYPAD_B / JOYPAD_L / JOYPAD_R.
    - Sounds routed: SOUND_SELECT_67 on confirm, SOUND_CANT_JACK_IN when scenario blocked, SOUND_UNSELECT_68
    on B, sound 0x66 / SOUND_UNK_66 on L / R changes via `bl PlaySoundEffect`. - Helper pair `sub_8142190`/`sub_81421D0`
    named `battle_checkScenarioEffectActive`/`battle_getScenarioEffectStateField` and `sub_81421C8` is
    the setter (called with the new clamped value). - Captured calls show all 6 entries having identical
    r0-r3 at entry and r0=0/flags -Z-- at exit, indicating the routine returns 0 (no effective input)
    on those invocations.'
  refs:
