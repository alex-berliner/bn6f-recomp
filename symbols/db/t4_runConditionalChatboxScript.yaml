open_questions:
- No caller is known, so what object/task r5 belongs to and what the state values 8/0xC/0x10 mean is unconfirmed
- The meaning of gamestate fields 0x28 and 0x1C (flag vs counter vs quest progress) and of the byte written
  to chatbox+0x4C is unknown
- The 0x4C chatbox write and the [r5,#2]=0xC/[r5,#3]=0x10 writes only occur in the script-7 branch (0x1C
  nonzero), not in the script-0xD branch which only sets [r5,#2]=8; the proposal overstates universality.
  The gamestate struct comes from oToolkit_S2001c04_Ptr, not the 201C100 archive (that's the script source).
  No callers or NPC evidence exist, so 'ow'/'npc' in the name is unjustified. A neutral name better fits.
