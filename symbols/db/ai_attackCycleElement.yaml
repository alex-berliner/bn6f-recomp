name: ai_attackCycleElement
address: '0x081008C2'
kind: function
status: probable
summary: AI attack-state handler that cycles an enemy through a fixed sequence of elements, re-skinning
  its palette to match after a white flash.
interface: (r7 = BattleObject holding AI attack vars) -> void; writes oAIAttackVars.AttackElement/StepTimer/HitElement,
  BattleObject element, and sprite palette
details: 'On first entry (AttackElement == 0) it initializes the attack: sets AttackElement to 4 and a
  10-frame StepTimer, then returns. On subsequent calls it flashes the object''s palette white (sprite_forceWhitePalette),
  counts the StepTimer down, and when it hits 0 advances a shared counter: svc 6 computes (counter+1)
  mod 5, storing the remainder back. The remainder indexes byte_810090C {0,4,1,3,2}, whose value is packed
  into the object''s element fields via battleObject_setElement, and indexes the palette list at off_8100918
  (byte_8020600 plus count 4... the pointer list at off_8100918 holds byte_8020600 and a second entry
  4, so the palette index read is from a pointer/byte table). Finally it sets HitElement timer to 12 frames.
  The element sequence 0,4,1,3,2 with per-element palettes strongly suggests an enemy that periodically
  changes its elemental weakness/affinity, telegraphed by a white flash.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: svc 6 (Div) of (counter+1) by 5 with remainder stored back implements a 0-4 cycling counter;
    ldrb from byte_810090C {0,4,1,3,2} fed into battleObject_setElement (writes Element and CollisionData
    elements); ldrb from off_8100918 table fed into sprite_setPalette, recoloring the object per element;
    first-run branch sets AttackElement=4 and StepTimer=10 before doing anything else; sprite_forceWhitePalette
    call immediately before the timer countdown is the change telegraph
