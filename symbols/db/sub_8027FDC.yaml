name: sub_8027FDC
address: '0x08027FDC'
kind: function
status: hypothesis
summary: Per-frame update for the chip-select screen's "currently selected/active" chip pointer (state[3]), using
  a small id-indexed lookup table.
interface: 'void sub_8027FDC(void);

  // inputs:  r6 = chip id (0..0xB), r7 -> state struct (u8[?])

  // outputs: r6 unchanged; state[3] rewritten (clobbers the caller''s ''active chip'' byte)

  // clobbers: r0, r1, flags N/Z/C/V; preserves r4, r6, r7, lr

  '
details: "Reads state[3], calls getLocOfActiveChips_8027E1C(state[3]) to get the\nactive-chip record, and checks\
  \ its byte 0. Only the values 0xA and 0xB are\nconsidered \"active\" -- for everything else the function returns\
  \ with\nstate[3] untouched and r1 left as 0xFF (the \"no active chip\" sentinel).\n\nFor the active case it picks\
  \ one of two base addresses:\n  * 0x802A817 (default for id==0xA, or id<5, or state[0] not in {4,8})\n  * 0x802A81F\
  \ (used when id != 0xA, id >= 5, and state[0] is 8 or 4)\nand on the second base it bumps the id by +1.\n\nThen\
  \ it indexes the 12-byte table at 0x08028028 by the (possibly bumped)\nid and calls sub_8028034(base + table[id]).\
  \ If the returned byte equals\nthe id it stores 0xFF into state[3], else it stores the returned byte.\nEffect:\
  \ when the lookup matches the current id it clears the \"active chip\"\nslot; otherwise it advances to the next\
  \ entry in the table chain for that\nid. The table values (1,2,3,5,7 / 1,2,3,4,5) read like next-slot offsets\n\
  walked by sub_8028034 until a non-match lands on 0xFF or a real value.\n\nQuirks: r1's final value is 0xFF on\
  \ the early-return path and state[0] on\nthe main path; that asymmetry mirrors the assembly exactly but callers\
  \ are\nnot expected to use r1, only state[3].\n"
