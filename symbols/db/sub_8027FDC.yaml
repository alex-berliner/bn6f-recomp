open_questions:
- What is the full layout of the state struct pointed to by r7? Only [0] and [3] are touched here; other fields
  are unknown.
- Why are 0xA and 0xB treated specially as the only "valid" active-chip codes? Looks like Mega/Regal chip sentinels
  but unverified.
- What does sub_8028034 do with (base + index)? Presumably walks a chip-id linked list in chip data and returns
  a code / next id, but unverified.
- Which callers actually depend on state[3] being 0xFF vs. the advanced id, and does the +1 bump + base switch encode
  a "cursor in row 2" mode for the chip select?
