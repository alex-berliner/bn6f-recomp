name: pet_updateNaviStatByte9FromKeyItems
address: '0x0803CFB0'
kind: function
status: probable
summary: After an item grant, recomputes a capped weighted count from three key-item counters and writes
  it to byte 9 of the NaviStats for record 0 and the currently selected PET navi.
interface: (r0 = ignored (overwritten with 0)) -> r0 = clobbered; no meaningful return value
details: 'Reads the toolkit''s key-items buffer and builds a weighted sum: keyItem[0x72] + 2*keyItem[0x73]
  + 3*keyItem[0x74] + 4, clamped to 99 (0x63). It then calls SetCurPETNaviStatsByte with slot 0 (hardcoded
  r0=0) and offset 9, then calls GetCurPETNavi and repeats the write for the currently selected navi,
  so both a fixed record and the active navi get the same byte. The caller GiveItem invokes it right after
  adding a key item, so this keeps a derived stat in the NaviStats in sync whenever one of the three tracked
  key items changes. The +4 base and 99 cap suggest a bounded percentage/level-like value rather than
  a raw counter.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb from keyItemsPtr+0x72/0x73/0x74 with lsl #1 and x3 (lsl #1 + add) weighting, +4, cmp #0x63
    / ble / mov #0x63 clamp (sub_803CFB0); mov r4,r0 (r0=0) then SetCurPETNaviStatsByte(r4, 9, sum) writes
    the fixed record first; bl GetCurPETNavi then SetCurPETNaviStatsByte(ret, 9, sum) writes the same
