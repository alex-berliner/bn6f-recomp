name: startScreen_runTriggerHandler_802FC9C
address: '0x0802FC9C'
kind: function
status: confirmed
summary: Start-screen hook that, when state flag 0x200 in the screen-state word is set, passes a fixed parameter
  block to the generic sub_8001158 handler and otherwise does nothing.
interface: void sub_802FC9C(const StartScreen *self /* r5 */)
details: 'Reads the halfword at StartScreen+0xA and tests bit 0x200 (0x20 << 4). If clear, returns immediately.
  If set, loads the address of byte_802FCB4 into r0 and tail-calls sub_8001158 with no other setup, so sub_8001158
  consumes byte_802FCB4 as a parameter block. The block is 12 bytes: a word pointer 0x806C4016 (0x16, 0x40, 0x6C,
  0x80), a halfword 0xA270 (0x70, 0xA2), then four zero bytes — likely a pointer plus small parameters for whatever
  sub_8001158 dispatches (script, sprite, or chatbox-style handler; not confirmed). Because the call is made unconditionally
  on the flag and the data is static, this reads as a one-shot per-frame trigger check on the title/start screen
  state machine. The caller''s struct pointer arrives in r5 and is preserved; r0-r3 and flags are scratch.'
