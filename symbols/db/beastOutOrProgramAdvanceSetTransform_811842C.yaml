open_questions:
- What sub_81185E4 and sub_8118604 do (and so what state 0x04 / CurAnim 0x23 actually means
- visually) is unknown; their bodies would pin the role of this function.
- The exact semantic of byte 0x28 in the parent object (r6[0]) and of AIData->Unk_0c == 0xc is
- unclear; they are being used as a "in Beast Out phase already" and "not a particular element"
- guard, but the field names are not in the struct comments.
