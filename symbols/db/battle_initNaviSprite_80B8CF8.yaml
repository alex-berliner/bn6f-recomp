- Whether NAMEID_GLIDE_NO_ARM (0x1A0) / NAMEID_GLIDE_ARM_A (0x1B6) correspond to specific navis (e.g.
  Glide/Forte) and whether the Roll range 0x1AC..0x1B5 covers all Roll forms including transforms.
