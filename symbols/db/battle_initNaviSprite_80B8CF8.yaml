name: battle_initNaviSprite_80B8CF8
address: '0x080B8CF8'
kind: function
status: confirmed
summary: 'Spawns/initialises a battle-navi sprite from a per-Param1 table entry: loads the sprite/animation,
  picks a sprite ID (with a transform override for Roll-family navis), sets the initial animation and
  palette, marks the object visible, and seeds X/Z velocity either via a glide-specific path or via the
  arm-position helper.'
interface: void sub_80B8CF8(u32 obj /* r5 */) -> clobbers nz,c,v r0,r1,r2,r3,lr; preserves r4,r5,r6,r7
details: "Reads oBattleObject_Param1 from r5 and indexes the 5-byte navi-sprite table at byte_80B8BD4:\n\
  \  [0] sprite tile, [1] animation data, [2] palette base,\n  [3] sprite ID, [4] arm-position index.\n\
  Calls sprite_load(0x80, table[0], table[1], entry), then sprite_loadAnimationData and sprite_noShadow.\n\
  Sprite ID override: if oBattleObject_NameID of the related object is in [0x1AC..0x1B5] (Roll family)\n\
  and GetBattleNaviStatsByte(alliance, oNaviStats_Transformation) is non-zero, uses 0xF8 instead of table[3].\n\
  Stores that ID in oBattleObject_Unk_0c. Param2 -> oBattleObject_CurAnim/CurAnimCopy and is set via\n\
  sprite_setAnimation (+ sprite_loadAnimationData). Sets oObjectHeader_Flags |= 2 (visible).\nPalette\
  \ = table[2] + oBattleObject_Param4, applied via sprite_setPalette.\nClears oBattleObject_XVelocity/ZVelocity.\
  \ Velocity seeding branches on Param1:\n  * Param1 == 0xF (glide): if related nameID != 0x1A0, hard-codes\
  \ (X,Z) = (0xB,-7) for nameID 0x1B6\n    else (0,0xD), shifted left by 16 into the velocity fields.\
  \ If nameID == 0x1A0 the velocities\n    remain zeroed.\n  * else if table[4] != 0: calls getBattleArmPositionMaybe_8018810(nameID,\
  \ armIdx, alliance, dirFlip)\n    and stores R0<<16 / R1<<16 into XVelocity/ZVelocity.\nFinishes by\
  \ writing CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized and\ntail-calling\
  \ sub_80B8DA6 (which still sees the table entry in r4).\n"
