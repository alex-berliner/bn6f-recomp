name: UpdateBattleObjectLinkedList
address: '0x08003428'
kind: function
status: confirmed
summary: Appends a freshly created battle object to the tail of the battle object doubly-linked list, just before
  the sentinel.
interface: void battle_appendObjectToLinkedList(u32 objectEnd /* r5 */); returns r0 = new object, r1 = sentinel,
  r2 = previous last object; nz/c/v set from the cmp (r5 vs list size) used to derive the object address
details: 'The caller leaves r5 pointing one oBattleObject_LinkedList_Size past the start of the new object, so the
  object address is r5 - size (the linked-list fields live at the tail of the object struct, hence the end-pointer
  convention). The list is a doubly-linked list terminated by the fixed sentinel eBattleObjectsLinkedListSentinel,
  whose prev field (offset 0, matching the objects'' own prev offset) holds the current last element. Four pointer
  writes splice the new object in at the tail: old last object''s Next -> new object, new object''s Prev -> old
  last, new object''s Next -> sentinel, sentinel''s Prev -> new object. When the list is empty the "previous" object
  is the sentinel itself, which still links correctly. Returns the new object address (r0), the sentinel (r1) and
  the old last element (r2); the flags come from the sub/cmp that computed the object pointer, not from any list
  operation.'
