name: battle_phasePeriodicSoundWait
address: '0x080BB3F6'
kind: function
status: probable
summary: Battle-object phase handler that ticks a countdown, plays a sound effect every 12 frames, and
  exits to phase 8 when the countdown ends or once a related object's AI flag is set
interface: (r5 = battle object) -> void; sets oBattleObject_CurPhaseAndPhaseInitialized = 8 and stores
  the old PhaseInitialized byte into ExtraVars+0x1c when finished
details: 'This is one state of a battle object''s phase machine (it reads/writes oBattleObject_CurPhaseAndPhaseInitialized).
  Each call it decrements Timer2; when that reaches 0 it immediately finishes the phase, saving the PhaseInitialized
  byte to ExtraVars+0x1c and switching to phase 8. Otherwise it decrements Timer; when Timer hits 0 it
  reloads Timer with 12, calls sub_80BB4CE (unknown per-tick work), and plays sound effect 0x10E (0xF
  + 0xFF). It then checks the AI data of the object in RelatedObject1Ptr: while bit 0 of oAIData_TimeStopMirrorHeld
  is clear it simply returns and keeps waiting; if that flag is set, the phase ends the same way (jumps
  into the finish block). So the phase lasts at most Timer2 frames, with a repeating sound/tick every
  12 frames unless the mirror-held condition ends it early.'
evidence:
