    tick with sound; ldr [r5,#oBattleObject_RelatedObject1Ptr] then tst oAIData_TimeStopMirrorHeld,#1:
    waits while that AI flag is clear; str r0,[r5,#oBattleObject_ExtraVars+0x1c] and mov r0,#8; strh to
