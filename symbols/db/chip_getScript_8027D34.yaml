name: chip_getScript_8027D34
address: '0x08027D34'
kind: function
status: confirmed
summary: Given a chip id, returns the pointer to that chip's description text-script table and the chip's index
  within it, switching to a second table for ids above 0xFF.
interface: u32* chip_getDescriptionScript_8027D34(u32 chipId /* r0, low 9 bits */); // returns table pointer in
  r0, index in r1; flags clobbered
details: 'Takes a chip id in r0 and masks it to 9 bits (id & 0x1FF). Ids 0x00-0xFF index the

  standard chip-description script table (TextScriptChipDescriptions0); ids 0x100-0x1FF

  (the EX/Giga range) select a second table (TextScriptChipDesc1) and are reduced

  modulo 0x100 so they index it from 0. The table base is picked via the literal pool:

  it starts at off_8027D50 and, for the high range, advances by one word to off_8027D54.

  The function then loads the word at the head of the selected table (the pointer to

  that table''s script data) into r0 and passes the masked index back in r1 so the

  caller can seek into the table. Note the branch on r1 is a signed ble against 0xFF,

  which works because the 9-bit mask keeps values in 0-0x1FF. Implemented with a bare

  mov pc, lr tail-return; only r0/r1 are touched besides flags.

  '
