name: battle_applyFlattenHitStatus_800EB26
address: '0x0800EB26'
kind: function
status: confirmed
summary: After a collision that flattened a battle object, resets its status effect to the "flattened" state (0x12)
  unless it already has one of the protected statuses 0x60-0x65, and updates its object flags.
interface: void sub_800EB26(BattleObject *obj /* r5 */) /* leaves r3 = obj->collisionDataPtr, r2/r3 clobbered, c/v
  set by final cmp */
details: 'Reads the battle object''s collision data pointer from [r5+oBattleObject_CollisionDataPtr]. If the hit-flag
  word at oCollisionData_FlagsFromCollision has bit 0x40 (a "flattening" hit, e.g. from a panel-crush/flatten-type
  attack), it inspects the object''s final status effect byte (oCollisionData_StatusEffectFinal): statuses 0x60..0x65
  are left completely untouched (only the flag compare happens, so c/v are still set for the caller), while any
  other status is overwritten with 0x12 — apparently the standard "flattened/crushed" status. It then sets flag
  0x4000 and clears flag 0x6 on the object''s flag2 word via object_setFlag2/object_clearFlag2 (helpers taking the
  object in a register implied by the helper''s own convention). When the 0x40 hit flag is absent the function returns
  without touching anything. Side effect useful to callers: r3 is left pointing at the collision data struct, and
  the Z/C flags from the final tst/cmp survive the call.

  '
