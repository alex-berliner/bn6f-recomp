open_questions:
- Exact identity of the OW map object at r5 (NPC vs MapObject vs PlayerObject is most consistent with
  NPC given offset 0x8 CurState + 0x4 ObjectHeader.Index gate).
- What triggers `Index +0x4` becoming non-zero on a retry — likely set on first success by the caller
  or a sibling function; not visible in this code.
- Whether the sprite table at byte_80A87B0 holds 4-byte rows of (baseTile, subTile, animIdx, zBias) for
  each scenario effect — the math is consistent, but it isn't confirmed by symbols.
- Meaning of "scenario effect" index returned by battle_getScenarioEffectStateField — likely a Beast-Out
  / Cross-Change / BugFrag / similar state byte.
