name: sub_8135184
address: '0x08135184'
kind: function
status: confirmed
summary: Counts how many entries in a chip folder object match a given chip id.
interface: u32 countChipsInFolderById_8135184(u32 chip_id /* r0 */, void *obj /* r5 */); // returns match count
  in r0; clobbers r1, r2, r3, lr; preserves r4, r5, r6, r7; flags clobbered
details: 'Walks an object''s chip folder entries (counted by the u16 at obj+0x1E) rooted at

  word_202A020, and for each slot reads the 32-bit entry at base + i*0x20 + 0x1C. The

  bits 22:16 of that word (left-shifted 16, then right-shifted 23) form a chip index

  which is resolved via getChip8021DA8 -> *ChipData, and byte 7 of the ChipData

  struct (the chip id byte) is compared against r0. Increments a counter for every

  match and returns the total. r5 holds the caller-supplied object pointer and is

  preserved across the call.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
