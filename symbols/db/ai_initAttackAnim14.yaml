name: ai_initAttackAnim14
address: '0x080EE654'
kind: function
status: probable
summary: 'AI attack-state initializer: plays animation 14, resets attack variables, sets the attack-active
  flag and hit element 4.'
interface: (object pointer expected in r7 per project AI convention) -> void; r0 clobbered
details: This is a small AI state-machine step for a battle object. It starts animation 0xE on the object,
  clears the per-object AI attack variable at AIData+0x68 via ai_clearAttackVar, and ORs bit 22 (1<<OBJECT_FLAGS_UNK_BIT_22_BIT)
  into the object's ObjectFlags1 word, likely marking an attack/wind-up as active. Finally it stores halfword
  4 to r7+oAIAttackVars_HitElement, setting the attack's hit element to 4. The object is addressed through
  r7 rather than r0, consistent with the project's AI attack-state helpers where the caller keeps the
  object in r7. No branch out means it returns immediately, likely a 'begin attack' state reached from
  an enemy's state table.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#0xe; bl object_setAnimation — selects animation 14 for the attack; bl ai_clearAttackVar
    — resets AIData+0x68 before the attack starts; mov r0,#1; lsl r0,#22; bl object_setFlag1 — sets ObjectFlags1
    bit 22, plausibly attack-active; mov r0,#4; strh r0,[r7,#oAIAttackVars_HitElement] — hit element 4,
    object passed in r7; callees object_setAnimation/object_setFlag1/ai_clearAttackVar are all battle-object
    AI helpers
