name: e_linkMatchObjectStateExit
address: '0x08131768'
kind: function
status: probable
summary: 'State handler for the link-match NPC object that ends the interaction: plays the exit-submenu
  sound, runs text script 0x68, and sets the object''s state flag.'
interface: (r0 = object? clobbers r5-relative fields; r5 = object struct) -> void
details: Clears the halfword at [r5,#0x26] to 0 and stores 0xFEDC into [r5,#0x2a] (likely a counter/coordinate
  reset for the object), plays sound effect SOUND_EXIT_SUBMENU via PlaySoundEffect, then kicks off chatbox
  script 0x68 from eTextScript201BA20 via chatbox_runScript_803FD9C_on_eTextScript201BA20. Finally it
  ORs bit 0x20 into the byte at [r5,#0x1b], presumably marking that the object has finished/left its dialogue
  state so the state machine in e_linkMatchObjectUpdate can move on. The 0xFEDC value is suspiciously
  specific and could also be an animation or timer constant.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strh r1 (0) [r5,#0x26] and strh 0xFEDC [r5,#0x2a] reset/initialize two object fields; bl PlaySoundEffect
    with SOUND_EXIT_SUBMENU indicates ending a menu/dialogue interaction; mov r0,#0x68; bl chatbox_runScript_803FD9C_on_eTextScript201BA20
    runs text script 0x68; ldrb/orr 0x20/strb on [r5,#0x1b] sets a state/done flag read by the caller's
    state machine; sole caller e_linkMatchObjectUpdate is a per-frame state machine over eLinkState, so
    this is one of its state handlers
