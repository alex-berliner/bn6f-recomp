name: GetBattleEffectsFromBattleSettings
address: '0x0802D254'
kind: function
status: confirmed
summary: Returns the "optional battle effects" settings word (e.g. battle modifiers like Custom+ effects) from the
  current battle settings struct.
interface: Next GetBattleEffectsFromBattleSettings(BattleSettings *settings); (r0 = BattleSettings ptr in, r0 =
  effects word out; returns via mov pc, lr, so it works from both ARM->THUMB? no, it stays in the caller's state)
details: 'A one-instruction accessor: loads the 32-bit field at offset 0x08 (oBattleSettings_UnkOptSettings) from
  the BattleSettings struct pointed to by r0 and returns it in r0 by branching straight back with mov pc, lr. The
  field is a bitmask/enum of optional in-battle effects configured in the battle settings (the "UnkOptSettings"
  field), which the engine presumably reads to apply per-battle modifiers during a NaviCust/custom-screen-derived
  battle setup. It clobbers nothing besides r0, preserves the caller''s lr implicitly (never touches it).

  '
