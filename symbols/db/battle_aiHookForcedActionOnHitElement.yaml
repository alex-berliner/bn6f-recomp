open_questions:
- no caller is recorded, so it is not confirmed which AI dispatcher invokes this hook or when
- which element 0x14 is in the BN6 hit-element enum (wind? break? cursor?) and thus the real trigger
- what CurAction 8 means in the object action table (blown back? stunned? custom reaction?)
