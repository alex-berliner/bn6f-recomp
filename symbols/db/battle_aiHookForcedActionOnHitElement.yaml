name: battle_aiHookForcedActionOnHitElement
address: '0x080C7A06'
kind: function
status: probable
summary: AI-side check that, when the object was just hit by an attack of hit-element 0x14, forces the
  object into action 8 with a fresh phase counter.
interface: (r5 = battle object) -> void; no return value, clobbers r0-r2
details: Loads the object's RelatedObject1Ptr (likely the AI/attacker context) and reads oAIAttackVars_HitElement
  at offset 0xA0 into the AI data. If the hit element equals 0x14, it overwrites oBattleObject_CurAction
  with 8 and zeroes oBattleObject_CurPhaseAndPhaseInitialized, restarting whatever state machine action
  8 runs; otherwise it does nothing. This reads like one of the per-element reaction hooks the battle
  AI runs after taking a hit (e.g. a knockback/stagger-style forced action for that element). r0 is not
  an argument despite being first read, so the routine operates purely on the r5 object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r2,#oAIAttackVars_HitElement]; cmp r0,#0x14 — branches only on a specific hit element
    from the AI attack vars; strb r0,#8 into oBattleObject_CurAction — forcibly replaces the object's
    current action; strh r0,#0 into oBattleObject_CurPhaseAndPhaseInitialized — resets phase and phase-initialized
    flag for the new action; uses oBattleObject_RelatedObject1Ptr -> oBattleObject_AIDataPtr to reach
    the attacker/hit context of the r5 object; executed only in battle routes, consistent with a battle
    AI hit-reaction hook
  refs:
  - bn6f/asm/asm31.s:33906
  reproduce: python3 tools/asmcat.py 0x080C7A06
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-212108'
