name: record_adjustNthSubRecordFieldC_8116C40
address: '0x08116C40'
kind: function
status: confirmed
summary: Nudges the 16-bit field at +0xC of the currently selected record's Nth sub-record up or down by 2, clamped
  inside 0x16..0x1E, with the direction decided by comparing two state bytes.
interface: void record_adjustNthSubRecordFieldC_8116C40(/* r5 = context A, r7 = context B (byte at +4 of each compared);
  r4/r6 inputs unused-or-passed-through */ void)
details: "Calls record_getNthSubRecordPtr_8116CD4 with the caller's registers untouched\n(the callee apparently\
  \ picks which record/sub-record itself from r5/r6/r7), and\ntakes the returned pointer as the record base. Then:\n\
  \  - reads byte [r7+4] and byte [r5+4]; if equal, step = +2 and limit = 0x1E\n    (raise mode); if different,\
  \ step = -2 and limit = 0x16 (lower mode).\n  - adds the step to the halfword at record+0xC, then clamps: in raise\
  \ mode the\n    result never exceeds 0x1E, in lower mode it never drops below 0x16 — i.e.\n    the field is always\
  \ kept within [0x16, 0x1E] (22..30) once it starts there.\n  - stores the result back to record+0xC as a halfword\
  \ and returns.\nThe 22..30 range strongly suggests a small coordinate or index (e.g. a cursor /\ngrid / scroll\
  \ position) rather than a count. The equal/different test between\ntwo contexts' +4 bytes looks like \"is this\
  \ entry the currently active/highlighted\none\" — matching itself would grow the value, anything else shrinks\
  \ it (or the\nreverse interpretation; the bytes' meaning is not confirmed).\nr4 is overwritten with the record\
  \ pointer, so its incoming value is irrelevant;\nr5, r6, r7 are only read and are preserved to the caller.\n"
