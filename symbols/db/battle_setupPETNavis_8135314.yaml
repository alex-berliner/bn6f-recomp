name: battle_setupPETNavis_8135314
address: '0x08135314'
kind: function
status: probable
summary: 'Battle setup: populates the two PET navi slots, accumulates their HP, and stores the total in the battle
  object.'
interface: u32 sub_8135314(u32 navi_data, u32 stats_arr, u32 arg2, u32 arg3, u32 ptr_array, u32 battle_obj); clobbers
  nz c v r0 r1 r2 r3 lr; preserves r4 r5 r6 r7
details: "Iterates over the two PET navi slots (0 and 1). For each slot it reads a stat-type index from byte_81353B4\
  \ indexed by battle_obj+0x0C, adds the slot index to get a stat-column offset, calls GetCurPETNavi to fetch the\
  \ current PET navi ID, then GetCurPETNaviStatsByte(navi_id, stat_offset) to retrieve the navi's stat byte for\
  \ that column. If the result is 0xFF the slot is skipped (no navi). Otherwise:\n  - Accumulates the upper 16 bits\
  \ of navi_data[stat*0x20 + 0x18] into a running total_hp.\n  - Initializes the per-slot entry pointer from stats_arr[slot]\
  \ using sub_80465A0.\n  - Writes the stat byte as a u16 at battle_obj + offset_813539C[slot] (offsets 0x5C and\
  \ 0x60).\n  - Calls sub_8134930 with kind=0x24, passing r2, r3, the slot, a constant 6 (via r4), battle_obj in\
  \ r5, the stat byte in r6, and a pointer from ptr_array[slot] in r7.\n  - ORs flag bit byte_81353A8[slot] (0x20\
  \ for slot 0, 0x40 for slot 1) into battle_obj+0x4C to mark the slot as active.\nAfter the loop, writes the accumulated\
  \ total_hp to battle_obj+0x64 and returns r3 (the last spawn call's return, or the input r3 if both slots were\
  \ 0xFF).\nNote the call to sub_8134930 temporarily clobbers r4 via push/pop so the original r4 is preserved across\
  \ the loop, matching the stated preserved-register contract.\n"
