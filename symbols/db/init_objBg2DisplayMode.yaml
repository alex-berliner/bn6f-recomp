name: init_objBg2DisplayMode
address: '0x08039864'
kind: function
status: probable
summary: Switches the LCD to a OBJ+BG2 (1D object mapping) display mode and initializes a state struct
  in r5 for that mode.
interface: (r0 unused, r5 = state struct) -> r0 = 0; no flags
details: Writes DISPCNT value 0x1240 (OBJ enable 0x1000, BG2 enable 0x200, 1D OBJ VRAM mapping 0x40) via
  SetRenderInfoLCDControl, so the next frame shows only objects and BG2. It then sets byte r5+0x17 = 1,
  calls sub_803BB7C with r0=0 to store 0 into r5+0x28, stores pointer byte_80393A4 into r5+0x2c, and sets
  r5+2 = 4, which looks like a state/mode index for a state machine. The struct in r5 is touched only
  by offset here; byte_80393A4 is presumably a table or handler list for the new mode. With no known caller,
  the owning subsystem cannot be confirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0, =0x1240; bl SetRenderInfoLCDControl — sets DISPCNT to OBJ+BG2, 1D mapping; strb r0(=1),
    [r5,#0x17] and strb r0(=4), [r5,#2] — flags/state fields of the r5 struct; bl sub_803BB7C with r0=0
    then 'ldr r0, =byte_80393A4; str r0, [r5,#0x2c]' — clears a field and installs a mode data pointer;
    no bl to other subsystems and tiny body — consistent with a mode-enter/init hook
  refs:
  - bn6f/asm/asm03_1_1.s:1669
  - 0x08001778 SetRenderInfoLCDControl
  - 0x0803BB7C sub_803BB7C
  reproduce: python3 tools/asmcat.py 0x08039864
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-003606'
open_questions:
- what structure r5 points to and which subsystem owns it (no caller found)
- what byte_80393A4 contains (mode table, script, or handler list)
- what the mode index 4 and flag r5+0x17=1 mean in the state machine
