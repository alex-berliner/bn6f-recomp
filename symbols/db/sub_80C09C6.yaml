open_questions:
- What does the "0x10" written into CurPhaseAndPhaseInitialized actually mean in the high-level phase FSM? (looks
  like a "completed" sub-flag in the low byte, but the bit layout isn't documented here)
- Is Param3 the panel coordinate, or just one component of it? It's a single u16 being stored into PanelXY, suggesting
  Param3 already encodes both X/Y or only X (need to check object_setCoordinatesFromPanels)
- Which caller passes r5 here (a generic per-object phase dispatcher like the rest of this table)?
- What does sub_80C0DC2 do, and is its r5-out always the same object or sometimes a swapped/recycled one?
