name: sub_80C09C6
address: '0x080C09C6'
kind: function
status: confirmed
summary: 'Per-frame bounce updater for a battle object: flips Z velocity, snaps to a stored panel on first tick,
  integrates Z height each frame, snaps to ground and sets phase = 0x10 when landing, and otherwise ticks a phase
  timer that drives sub_80C0DC2.'
interface: void object_updateBounce(u32 obj /* r5 in/out */); // r5 preserved across call (sub_80C0DC2 may swap
  to a different object pointer)
details: "Battle object is passed in r5. Uses oBattleObject_PhaseInitialized (byte), oBattleObject_ZVelocity (32-bit\
  \ fixed), oBattleObject_Z (32-bit fixed), oBattleObject_Param3 (u16), oBattleObject_PanelXY (u16), oBattleObject_Timer\
  \ (u16), and oBattleObject_CurPhaseAndPhaseInitialized (u16).\nOn entry, if PhaseInitialized == 0 (first time\
  \ this bounce state runs):\n  - Timer := 1\n  - ZVelocity := -ZVelocity (vertical bounce)\n  - PanelXY := Param3\
  \ (recalls the panel the bounce was queued from)\n  - calls object_setCoordinatesFromPanels(obj) to recenter the\
  \ object on that panel\n  - PhaseInitialized := 4 (so subsequent ticks fall into the integrator instead of re-initializing)\n\
  Otherwise (already initialized), adds ZVelocity into Z. The check \"still in the air\" is `((value>>0x10) ASR)\
  \ > 0` using N/V from the ADD and Z from the ASR: a positive integer Z means airborne, zero or negative means\
  \ landed.\nWhen landed: Z := 0, low byte of CurPhaseAndPhaseInitialized := 0x10 (phase done flag), and returns\
  \ without ticking the timer.\nWhen still airborne: decrements Timer. While > 0, returns. When it hits zero, Timer\
  \ := 3 and calls sub_80C0DC2(obj), which appears to be the next bounce sub-phase; r5 is taken from sub_80C0DC2's\
  \ return because it may move the object to a different slot (the C version documents this).\nQuirks: The \"0x10\"\
  \ written to CurPhaseAndPhaseInitialized writes a u16; combined with the existing high byte (the current phase\
  \ index), this looks like setting a \"phase complete / landed\" sub-flag in the low byte. The timer wrap to 3\
  \ before calling sub_80C0DC2 is the cadence of the bounce animation steps.\n"
