name: battle_initLoopbackLinkPackets
address: '0x0800B49E'
kind: function
status: probable
summary: (Re)builds the two loopback battle link packets the game exchanges with itself in solo battles.
interface: () -> void; r0/r1 clobbered via callee calls
details: 'Calls sub_802E45E twice: first with r0=0 targeting byte_203F4A4, then r0=1 targeting byte_203F5A4
  (exactly 0x100 later, so two adjacent packet-sized buffers). byte_203F4A4 is known from symdb as the
  payload of the received loopback battle link packet, containing the battle seed restored at battle phase
  8 and later the battle result record. r0 therefore likely selects which packet to produce (slot/template
  0 vs 1) rather than being a fill byte. The routine takes no arguments and preserves nothing but callee-saved
  regs, so it is a plain initializer invoked before/around battle link setup. Exact behavior depends on
  the unshown callee sub_802E45E.'
