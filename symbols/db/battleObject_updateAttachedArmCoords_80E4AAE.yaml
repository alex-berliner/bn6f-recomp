open_questions:
- The semantic role of slot id 0x1E passed to getBattleArmPositionMaybe; the helper
- comment suggests slots 0xCD..0xFF return default (0,7), but 0x1E is a valid index
- whose arm-table meaning is not yet known.
- Why bit 0x02 (OBJECT_FLAG_VISIBLE) is toggled on r5 based on panel validity and
- bit 0x02 from r4's Flags is then OR'd in when the sentinel is non-zero; the
- exact lifecycle intent (hide/show + attach detach) is not fully clear from the
- assembly alone.
- What writes the non-zero sentinel into *ExtraVars to trigger the destroy path
- is not visible in this function; needs cross-reference from a sibling helper.
