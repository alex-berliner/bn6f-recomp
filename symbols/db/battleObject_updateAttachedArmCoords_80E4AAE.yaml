name: battleObject_updateAttachedArmCoords_80E4AAE
address: '0x080E4AAE'
kind: function
previous_names:
- sub_80E4AAE
status: probable
summary: Recomputes a battle object's X/Y/Z from its RelatedObject1Ptr's arm/part offset, syncs panel
  coords, applies mosaic alpha, and queues destroy when off-panel with a non-zero ExtraVars sentinel.
interface: (r5 = BattleObject *) -> void ; clobbers r0-r7, lr; nz/c/v
details: "1. Loads RelatedObject1Ptr (r4) from [r5+oBattleObject_RelatedObject1Ptr]; reads the\n     related\
  \ object's NameID (r0), Alliance (r2), DirectionFlip (r3) and passes them plus\n     a fixed slot id\
  \ 0x1E to getBattleArmPositionMaybe_8018810, which yields an (x16, y16)\n     arm offset in (r0, r1).\n\
  \  2. Saves the offsets in r7/r6 (<<16 so they become 16.16). Reads the related object's\n     X/Y/Z\
  \ from r4+0x34..0x3c (3 words via ldmia), adds r7 to X (r1) and r6 to Y (r3), and\n     subtracts 0x20000\
  \ from Y and Z (r2, r3) so the base attaches one panel up/back.\n  3. Writes the new X/Y/Z back into\
  \ r5+0x34..0x3c (stmia).\n  4. Calls obj_getSpriteFlag10AndRenderInfoHigh_8002F3E and loc_8002F02 against\
  \ r4\n     (sprite tooling update for the related sprite), then re-loads r4 and calls\n     sprite_getMosaicScalingParameters\
  \ + sprite_setAlpha on r4.\n  5. Calls object_setPanelsFromCoordinates(r5) and object_isCurrentPanelValid(r5).\n\
  \     If the panel is invalid, clears bit 0x02 (OBJECT_FLAG_VISIBLE) in\n     [r5+oObjectHeader_Flags].\n\
  \  6. Reads *([r5+oBattleObject_ExtraVars]). If that sentinel is non-zero: OR's in bit\n     0x02 from\
  \ r4's Flags into r5's Flags, then calls object_getFlag on r4; if bit\n     0x80000000 of the flag word\
  \ is clear, it falls into the destroy path; otherwise it\n     returns leaving r5 alive.\n  7. Destroy\
  \ path: clears *([r5+ExtraVars]) to 0 and sets\n     [r5+oBattleObject_CurStateActionPhaseAndPhaseInitialized]\
  \ = CUR_STATE_DESTROY\n     (0x08). Returns via pop {r4,r6,r7,pc}.\n  Caller (sub_80E4A6E) loops every\
  \ active battle object, so this is the per-object\n  update step for an attached/part-following battle\
  \ actor (snake-arm style entity).\n"
