name: battle_spawnOwnPanelAttackRegion
address: '0x080BBE3A'
kind: function
status: probable
summary: Spawns the object's attack collision-region at its own panel, passing its element, packed attack
  parameters, and damage modifiers.
interface: (r5 = battle object) -> r0 = spawned region object (via callee); no flags used
details: 'Reads the battle object''s PanelX, PanelY, and Element fields, then tail-calls object_spawnDimmingCollisionRegion
  with those plus r3=0, r4=0x15050A01 (packed region/attack parameters, e.g. sizes/offsets/damage encoding),
  r6=the object''s DamageAndStaminaDamageCounterDisabler field, and r7=3. It is a thin parameter-packing
  wrapper: the object supplies position and element, the constant supplies the attack shape. Called from
  battle_slideToOwnPanelPhase once the object finishes sliding to a panel of its own alliance, i.e. this
  is the attack step of that phase sequence.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loads oBattleObject_PanelX/Y/Element into r0-r2 as spawn coordinates/element; r6 = [r5,#oBattleObject_DamageAndStaminaDamageCounterDisabler]
    forwarded to the region spawner; r4 = 0x15050A01 and r7 = 3 are fixed packed constants for the region
    shape/lifetime; only caller battle_slideToOwnPanelPhase reaches this after its slide/countdown completes;
    callee object_spawnDimmingCollisionRegion spawns a timestop-immune collision region
  refs:
