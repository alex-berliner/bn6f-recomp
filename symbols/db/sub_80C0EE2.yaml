name: sub_80C0EE2
address: '0x080C0EE2'
kind: function
status: confirmed
summary: Battle-object sub-state that waits 4 frames after a one-shot setup/teardown call on its related object,
  then triggers an effect tied to the related object's NameID and queues itself for destruction.
interface: void sub_80C0EE2(void);  // r5 = this battle object, r10 = caller state ctx, lr = return; outputs r5/r8-r12;
  clobbers nz,c,v,r0-r3,r6,r7,lr; preserves r4
details: "Two-phase state tied to a battle object (r5):\n  - On first entry (PhaseInitialized == 0), if Param4 !=\
  \ 0, pokes a setup helper on RelatedObject1: sub_80E1352 when ExtraVars == 2, else sub_80E146C.\n  - Sets the\
  \ per-frame Timer to 4 and stamps PhaseInitialized with 4 so the init block doesn't repeat.\n  - Decrements Timer\
  \ by 1 every frame; while it remains > 0 the function only calls object_updateSpriteTimestop and returns.\n  -\
  \ When the timer expires (timer becomes 0): clears bit 1 of the object's header flags, fetches RelatedObject1's\
  \ NameID and runs it through unpackVerActorTyAndAIIdx_800F29C then sub_8011044 with R2=1 to fire a battle effect.\n\
  \  - Symmetric teardown: if Param4 == 0, calls sub_80E13DC (ExtraVars == 2) or sub_80E14AC on RelatedObject1.\n\
  \  - Finally writes CUR_STATE_DESTROY into the CurStateActionPhaseAndPhaseInitialized field to drop this object\
  \ next frame.\nCalls object_updateSpriteTimestop on both the early-out and the destruction paths. The \"bgt\"\
  \ on the SUBS-style timer decrement is signed, matching the standard timer-elapse pattern.\n\nRegister form, old\
  \ prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
