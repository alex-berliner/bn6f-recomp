name: chatbox_confirmShopPurchase_8046ED2
address: '0x08046ED2'
kind: function
status: confirmed
summary: Chatbox shop state handler that processes the player's OK/confirm press to purchase the currently
  highlighted chip, item, or Navi Cust Program.
interface: void chatbox_confirmShopPurchase_8046ED2(u32 r5 /* chatbox state ptr */); returns r0=0; clobbers
  flags; preserves r5,r6
details: 'r5 is the chatbox dialog-box state structure. The handler first calls sub_8047134 to refresh
  the chatbox and checks button flags via chatbox_mask_eFlags2009F38 (0x20 and 0x100 = both confirm buttons;
  8 = confirm-pressed gate). If the chatbox is busy displaying text (chatbox_get_state_8045F4C != 0),
  it replays the current script (index 1) and re-enters state 8. Otherwise it reads the selected shop
  entry from ctx+0x1C (category type) and ctx+0x20 (item data pointer: kind byte at +0, code at +2, param
  at +4, price at +6). Cost is adjusted: type 1 uses raw price, others multiply by 100 (0x64). It validates
  the purchase against an obfuscated scrambled counter (checkScrambledCounter_8047366) at ctx+0x28; failure
  runs script 8 and plays SOUND_CANT_JACK_IN. On success it dispatches by item kind: 2=chip (GiveChips),
  1=item (GiveItem), else Navi Cust Program (GiveNaviCustPrograms, code+0x90). Availability is checked
  via sub_8047384 before giving. Type-2 special chips take a separate path storing remaining to ctx+0x2C
  and entering state 0x28. After a successful purchase it decrements the counter, stores an obfuscated
  token (storeObfuscatedRandomToken_804733C), records the transaction via sub_8048DAE, updates the displayed
  code via sub_8047B88 into ctx+0x12, clamps the menu scroll (menu_clampListScrollAfterCountChange_8047CB6),
  runs a success script (index 7/6/0xC depending on kind), sets ctx+0xD=0xFF (acquisition marker), and
  plays SOUND_UNK_73. State transitions set ctx[0] to 8, 0x28, or 0x1C depending on outcome.'
