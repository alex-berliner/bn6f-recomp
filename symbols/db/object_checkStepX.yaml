name: object_checkStepX
address: '0x080FE59C'
kind: function
status: probable
summary: Checks whether stepping one tile horizontally toward a target x from an object's current panel
  is a valid panel, returning the candidate x or 0.
interface: (r0 = target x) -> r0 = candidate x ([r5+0x12] +/- 1) if the adjacent panel passes the parameter
  check, else 0; r4 preserved
details: 'r5 points to some object/entity whose panel x is at +0x12 and y at +0x13. It compares the object''s
  x with r0: if x < r0 it sets the step to +1, otherwise (including equal) to -1, then forms the neighbouring
  x by adding that step and calls object_checkPanelParameters with (candidate x, y). If the panel check
  returns nonzero, the function returns the candidate x (restored via the push/pop around the call); otherwise
  it returns 0 as failure. Quirks: when x equals the target it still steps by -1, and r2/r3 are not set
  before the panel check, so the required-flag masks must come from elsewhere (registers/global state
  left by the caller or inside the callee).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'cmp r1,r0 / blt / neg r4, r4: step is +1 when [r5+0x12] < arg x, else -1; ldrb r0,[r5,#0x12];
    add r0,r0,r4; ldrb r1,[r5,#0x13]: builds (x+step, y) pair; bl object_checkPanelParameters with that
    pair: neighbour panel is validated; push {r0,r1} around the call, pop {r0,r1} after tst: success returns
    the adjusted x, failure path returns mov r0,#0'
  refs:
