name: ai_attackStepGeneric
address: '0x080FA8F0'
kind: function
status: probable
summary: 'Per-frame AI attack step: initializes AttackElement=4 and a step timer on entry, periodically
  re-fires a camera shake via ChargeCycles, clears the battle object''s collision region when its collision
  flags match the alliance-indexed mask in byte_80FA960, decrements the step timer, and either restarts
  the step or finalizes by writing 0x18 into HitElement.'
interface: '(r0 = [r7]oAIAttackVars_AttackElement on entry: 0 = first frame; r5 = battle object, r7 =
  AI attack vars) -> r0 clobbered; updates oAIAttackVars (AttackElement, StepTimer, ChargeCycles, TimerOrCycles,
  HitElement) and may clear the object''s collision region'
details: On the first frame (AttackElement==0) it sets AttackElement=4, calls sub_80FAC34 (likely spawning/arming
  the attack object), sets StepTimer=AttackBoost2+0x14, and fires a camera shake effect (magnitude 1,
  duration 0xA) via camera_initShakeEffect. Every frame it decrements ChargeCycles and re-fires the same
  camera shake each time it hits 0, resetting it to 10 — the repeated shaking of an ongoing quake. It
  then reads oCollisionData_FlagsFromCollision via the object's CollisionDataPtr, indexes byte_80FA960
  by Alliance<<2 ({0,0,0x580,0xA80}), and calls object_clearCollisionRegion when the flags match, removing
  the hitbox once it has touched a valid target. StepTimer counts down the length of one step; when it
  expires, TimerOrCycles is decremented — if still positive the step restarts (AttackElement reset to
  0 so it re-enters the init path), otherwise it writes 0x18 into HitElement to finalize the attack. The
  AttackElement value 4 and HitElement value 0x18 are element/attack ids whose exact game meaning is not
  visible here.
