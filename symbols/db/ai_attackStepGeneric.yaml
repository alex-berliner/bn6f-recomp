    every ChargeCycles expiry — periodic screen shake (lines 11-13, 20-22); byte_80FA960 per-alliance
    collision-flag table + tst against oCollisionData_FlagsFromCollision followed by object_clearCollisionRegion
    — hitbox removal on contact (loc_80FA928-loc_80FA93C); TimerOrCycles countdown: on expiry either restarts
