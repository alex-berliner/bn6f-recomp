    — The proposed behavior matches the asm: init branch sets AttackElement=4, calls sub_80FAC34, sets
    StepTimer=AttackBoost2+0x14, and triggers camera shake (1,0xa); ChargeCycles is reloaded to 0xa and
    a camera shake re-fires each time it hits 0; collision region is cleared when (flags_from_collision
    & byte_80FA960[Alliance<<2]) is nonzero; StepTimer decrements, on expiry TimerOrCycles-- and if >0
    AttackElement is reset to 0, else HitElement=0x18 is written. The name is reasonable but `ai_quakeAttackStep`
    asserts a quake attack identity not provable here (HitElement=0x18/AttackElement=4 are opaque). A
    more neutral name like `ai_attackStepGeneric` is safer, and `byte_80FA960` uses little-endian so the
    alliance table is {0x580000,0x0A80000}, not {0,0,0x580,0xA80}.; run wf investigate investigate-20261019-010606;
