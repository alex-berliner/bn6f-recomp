open_questions:
- The exact BattleState role of [r5,#1]=4 (entry state index) — could be a sub-mode under CurState/phase.
  Knowing the project-wide enum for BattleState.Index_01 would settle the overlay phase name.
- Whether the loop in sub_803BEC0 is the text-record expansion consumed by chatbox_8040818 (very plausible
  given the immediate chatbox call, but not provable from this function alone).
