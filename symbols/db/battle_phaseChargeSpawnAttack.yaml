name: battle_phaseChargeSpawnAttack
address: '0x080C2256'
kind: function
status: probable
summary: 'Battle-object phase handler: pick a panel, reserve it, charge briefly with sound, spawn a type-5
  attack object, then hand control back to action 0xC.'
interface: (r5 = battle object, this-style) -> r0 = 0 or 1 (panel found?); sets Timer, Timer2, PanelX/Y,
  FuturePanelX/Y, DirectionFlip, CurAnim, CurAction, CurPhaseAndPhaseInitialized.
details: On first entry (PhaseInitialized==0) it sets a 0x1E-frame timer, calls sub_80C2518 which returns
  r0=success flag plus r1/r2 panel X/Y and a flip value; if it fails it just sets Param3=1 and returns.
  On success it stores the panel coords and flip, recomputes pixel coordinates and sprite flip, mirrors
  the coords into FuturePanelX/Y, reserves the panel via object_reservePanel, sets CurAnim=0xA, spawns
  a type-1 subtype-5 temp attack object with packed parameter word 0x10121 linked at [obj+0x64], calls
  sub_80C26C8 and sub_80C2600(0), plays sound 0xB8, and sets Timer2=4. In the running phase it ticks Timer
  (with Param3 gating a faster path), and when it expires resets CurAnim=0, frees/updates something via
  sub_80B8E58 with the object's ExtraVars field, clears Param3, and sets CurAction=0xC with phase 0 —
  the 'done' handoff. While waiting it also ticks Timer2, re-calling sub_80C2600(0) every 4 frames, which
  looks like a periodic charge/flicker effect.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sub_80C2256 calls object_reservePanel, object_setCoordinatesFromPanels and object_getFlip right
    after storing PanelX/Y — classic 'occupy a panel' setup; spawn_t1_0x5_tempAttackObject_80B8E30 is
    invoked with dword_80C22FC = 0x10121 and r7 = obj+0x64, i.e. it materializes the actual attack; PlaySoundEffect(0xB8)
    plus Timer=0x1E and the Timer2=4 loop indicate a timed telegraph/charge before the strike; phase ends
    with CurAction=0xC and CurPhaseAndPhaseInitialized=0, the standard return-to-idle-action handoff in
    phase handlers; failure branch (sub_80C2518 returns 0) only sets Param3=1, so the panel search is
    the gating condition
