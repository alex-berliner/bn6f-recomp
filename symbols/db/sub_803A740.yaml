summary: Initializes battler slots 4 through 9 by calling sub_803B522 on each slot index.
interface: void sub_803A740(void /* r1,r2,r3,r10 preserved across call */)
details: 'Tight loop (r4=4..9 inclusive) that invokes sub_803B522 with the slot

  index in r0 for each iteration. No return value, no extra arguments.

  The callee (sub_803B522) is the per-slot initializer; the loop simply

  fans out the call across the upper battler-slot range (4..9). Register

  contract notes that r1/r2/r3/r10 are inputs callers leave in place and

  that the call clobbers r0/r1/r2/r3/lr and the usual flags (nzcv).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
