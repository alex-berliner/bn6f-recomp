name: battle_conditionalRngRoll
address: '0x08116834'
kind: function
status: probable
summary: Scans an 8-entry pointer array at [r5+0x60]; if enough entries are active and none is flagged,
  rolls a 1/8 RNG chance and returns 4, otherwise 0.
interface: (r5 = base of a structure holding 8 pointers at +0x60, r0 unused) -> r0 = 4 if all conditions
  pass and (RNG & 7) == 4, else r0 = 0; clobbers r0-r4,r6
details: 'The function iterates 8 pointer slots at r5+0x60 (r5 is a hidden input set by the caller, not
  a real argument). For each non-null pointer it increments a total counter and reads byte at +4: if that
  byte equals 4 the whole check aborts with 0. Byte at +6 is also read, and entries with value >= 1 are
  counted separately. After the loop, only if at least 5 slots are non-null and at least 3 have byte+6
  >= 1 does it call GetPositiveSignedRNG, mask with 7, and return 4 on exactly one of the 8 outcomes;
  every other path returns 0. The return value 4 (not a boolean) suggests the caller dispatches on it
  as a state/variant id.'
