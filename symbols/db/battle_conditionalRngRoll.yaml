name: battle_conditionalRngRoll
address: '0x08116834'
kind: function
status: confirmed
summary: Scans the 8 battle-entity slots at base+0x60 and, only if the field is crowded (>=5 entities, >=3 of a
  certain sub-type) and no blocking type-4 entity exists, rolls an RNG check for a 1-in-8 event and returns 4 on
  success.
interface: 'u32 battle_conditionalSpecialRoll(u32 base /* r5 */); /* returns r0: 4 on the winning roll, 0 otherwise;
  r7 must be 0 on entry and is returned via the callee path */'
details: 'Walks eight 4-byte slots starting at r5+0x60, each holding a pointer to a battle object (NULL = empty).
  For each present object it reads byte +4 (object type); if any object has type 4 the whole check aborts immediately
  and returns 0. Otherwise it reads byte +6 as a signed value and counts objects with value >= 1 as "eligible".
  After the loop it requires at least 5 present objects and at least 3 eligible ones; if either threshold fails
  it returns 0. When both pass, it calls GetPositiveSignedRNG and tests (value & 7) == 4 — a 1/8 chance — returning
  4 on a hit and 0 (via the RNG helper''s pass-through r7) on a miss. The r7 result register is zeroed at entry
  and restored from the stack at exit, so the caller always sees r7 preserved, but r7 must be 0 while the RNG helper
  runs because the failed-roll path returns the helper''s r7. The returned value 4 is likely an event/trigger id
  consumed by the caller. The exact game meaning of the thresholds (which entity types byte+4==4 blocks and what
  byte+6>=1 marks, e.g. bosses or a specific enemy class) is inferred from structure offsets only.

  '
