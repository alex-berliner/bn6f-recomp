    down from 8; ldrb r2,[r1,#4]; cmp r2,#4; beq loc_8116874 — byte+4==4 aborts the check with r7 still
    0; ldrb r1,[r1,#6]; cmp r1,#1; blt skip; add r6,#1 — byte+6>=1 entries counted in r6, total non-null
