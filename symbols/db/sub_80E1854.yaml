name: sub_80E1854
address: '0x080E1854'
kind: function
status: confirmed
summary: Waits 30 frames, then advances a battle object to phase 4, notifying its related object once.
interface: void sub_80E1854(void);  // r2 r3 r4 r5 lr in; r5 out; clobbers nz c v r0 r1 r2 r3 lr; preserves r4 r5
  r6 r7
details: 'Battle-object phase timer. On first entry (PhaseInitialized == 0): writes

  oBattleObject_Timer = 0x1E (30 frames), sets PhaseInitialized = 4, and unless

  oBattleObject_Unk_19 == 0x17, loads the pointer at oBattleObject_RelatedObject1Ptr

  into r0 with r1 = 1 and calls sub_80E1332 (a "notify related object" helper).

  On every call: decrements oBattleObject_Timer; if it underflows, writes

  oBattleObject_CurPhaseAndPhaseInitialized = 4, transitioning the object into

  phase 4. The oBattleObject_Unk_19 == 0x17 exemption presumably suppresses

  the notification in some sub-state.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
