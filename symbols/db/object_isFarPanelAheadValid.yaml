name: object_isFarPanelAheadValid
address: '0x080E58F4'
kind: function
status: probable
summary: Returns whether the battle-grid panel 5 tiles (0x78 px) ahead of the object, in its facing direction,
  is on the field.
interface: (r5 = battle object) -> r0 = 1 if the panel at (x + dir*0x78, y) is a valid grid panel, else
  0
details: Calls object_getFrontDirection to get the +1/-1 side multiplier for the object's alliance/DirectionFlip
  flag, multiplies it by 0x78 (= 5 panels of 24 px). That offset is added to the object's current pixel
  X stored at oBattleObject_ExtraVars+0xC, with Y at +0x10. convertXYToPanelXY maps the pixel point to
  1-based (column, row), and object_isValidPanel bounds-checks it against the 6x3 grid; the validity result
  is the return value. Note the object pointer arrives in r5, set up by the caller, not via r0.
