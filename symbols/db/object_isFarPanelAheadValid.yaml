    direction; ldr r1,[r5,#oBattleObject_ExtraVars+0xc/+0x10] supplies the object''s current pixel X/Y
    for the probe point; bl convertXYToPanelXY_800E258 + bl object_isValidPanel is the tail pair whose
    result is returned; caller sub_80E57BC sets r5 to a battle object before this call'
