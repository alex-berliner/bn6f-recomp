open_questions:
- Which oBattleObject_CurPhase values map to which of the 5 handlers (the table entries are listed in the source
  but the phase constants aren't named here).
- What r2's forwarded meaning is — the dispatcher doesn't itself interpret it, so the meaning depends entirely on
  which phase is currently active.
- Whether any phase handler ever changes CurPhase mid-dispatch (the table is indexed once up front), which would
  mean the handler must defer re-dispatch to its caller.
