name: sub_80C0912
address: '0x080C0912'
kind: function
status: confirmed
summary: Battle-object phase dispatcher — looks up the per-CurPhase handler in a jump table at off_80C0924 and tail-calls
  it.
interface: void battleObject_runCurPhase_80C0912(u32 r2_arg, struct BattleObject* r5_obj); returns r5/r8/r9/r10/r11/r12
  from the handler; clobbers r0-r4,r6-r7, lr and flags nz c v.
details: 'Reads the object''s CurPhase byte (oBattleObject_CurPhase), uses it to index a 5-entry

  Thumb jump table at off_80C0924, and tail-dispatches to the chosen handler with the

  caller''s r2 forwarded and the object pointer in r5 preserved. On entry to the handler

  r0 holds the CurPhase value and r1 the table entry just jumped through; the handler''s

  surviving r5/r8-r12 outputs become this function''s outputs (no wrapper, so no extra

  stack frame is materialized). The 5 phase handlers it dispatches to are

  battle_panelObject_tryTargetAndSetPhase_80C0938, sub_80C0956,

  battleObject_jumpUpPhase_80C0988, sub_80C09C6, and sub_80C0A0E; the "+1" trick on

  each table entry signals Thumb interworking (BX into Thumb code).

  '
