    field; sub_803C97C: cmp r4,r0 / blt skip; then bl rfu_setStateEnded — field gates ending the wireless
    session; r4 comes from sub_8146918(byte_200AF84[4]), so the comparison pairs a config byte with this
    struct field; sub_803C84A calls it after sub_81468F4 in a poll-style routine returning (0,0), consistent
    with per-frame comm state sampling'
