name: rfu_getConnectedPlayerCount
address: '0x0814690C'
kind: function
status: probable
summary: returns a halfword status/count field of the wireless (RFU) shared struct at 200FE00+0x26, used
  to decide whether a wireless session has enough participants before ending it
interface: () -> r0 = halfword at [eStruct200FE00+0x26]; no flags set intentionally
details: 'A trivial getter: loads the halfword at offset 0x26 of the RFU/comm work area eStruct200FE00
  and returns it. In sub_803C97C the value is compared against the result of sub_8146918(byte_200AF84[4]);
  if that value is >= this one, rfu_setStateEnded is called and state 2 is returned, otherwise state 0
  — consistent with ''connected players >= required players'' checking. In sub_803C84A it is called right
  after sub_81468F4 as part of a polling sequence whose return value is discarded, suggesting the pair
  updates/reads comm state each frame. The exact meaning of the 0x26 field (player count vs link state
  counter) is not provable from these callers alone.'
