name: ai_clearFlagAndSetCurAction
address: '0x081166F2'
kind: function
status: probable
summary: 'Battle-object AI tick: clears a status flag on the object and, if a battle-state condition bit
  is set, kicks the object into action 1.'
interface: (r5 = object header, no args in r0-r3) -> r0 clobbered; sets object CurAction/CurPhase when
  taken
details: 'Reads ObjectHeader_Flags from the object in r5, clears bit 1 (mask 0x2), and writes it back,
  ending whatever state that flag marks. It then calls battle_getStateUnk5c_800139A to fetch battleState->Unk_5c
  and tests bit 2 (lsr #2 + bcc). If that bit is clear... actually bcc branches on carry clear, i.e. bit
  2 == 0, so only when bit 2 is SET does it write BattleObject_CurAction = 1 and zero CurPhaseAndPhaseInitialized,
  starting (or restarting) action 1 with phase 0 on the next update. Control returns immediately otherwise;
  lr is only needed for the getter call. Being reached from the battlesweep and beastsp recorded routes
  suggests it is one of those bosses''/enemies'' AI behavior callbacks.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/strb with bic r0,#2 on [r5,#oObjectHeader_Flags] clears flag bit 1 unconditionally; bl
    battle_getStateUnk5c_800139A then lsr r0,#2 + bcc gates the action change on Unk_5c bit 2; mov r0,#1
    / strb [r5,#oBattleObject_CurAction] plus strh 0 to CurPhaseAndPhaseInitialized is the standard 'begin
    action 1, phase 0' transition; only callee is the battle-state getter, so all logic operates on the
    r5 object and the state word; recorded route coverage (battlesweep, beastsp) and no other callers
    fits an AI behavior step invoked by the battle engine
  refs:
  - bn6f/asm/asm32.s:16611
  - 0x0800139A battle_getStateUnk5c_800139A
  reproduce: python3 tools/asmcat.py 0x081166F2
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-203615'
coverage:
- battlesweep
- beastsp
open_questions:
- what ObjectHeader_Flags bit 1 means (visible/hit/etc.) — needs another writer/reader of that bit
- what battleState Unk_5c bit 2 signals (timer? phase flag?) — needs the writer of Unk_5c
- which behavior table entry points here, to confirm the owning AI and what action 1 is for this object
