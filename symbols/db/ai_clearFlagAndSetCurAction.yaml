name: ai_clearFlagAndSetCurAction
address: '0x081166F2'
kind: function
status: confirmed
summary: Clears a battle object's busy flag, then if the battle state's bit 1 is set, starts action 1 and resets
  the object's phase counter.
interface: void ai_clearBusyFlagAndMaybeStartAction(obj in r5); returns r1 = 2; clobbers r0, flags (n z c), lr;
  preserves r5, r10
details: 'Battle-AI helper acting on the object header pointer in r5. First it reads oObjectHeader_Flags, clears
  bit 0x02 (a "busy/acting" style flag), and writes the byte back. It then calls battle_getStateUnk5c_800139A to
  read a battle-state word and tests bit 1 of that word (lsr #2 into carry, bcc skips). If the bit is set it writes
  1 to oBattleObject_CurAction and zeroes the halfword pair oBattleObject_CurPhaseAndPhaseInitialized (phase counter
  + phase-initialized flag). Quirk: the value 2 loaded for the flag mask survives the call in r1, so the function
  "returns" r1 = 2; whether callers rely on this is unknown.

  '
