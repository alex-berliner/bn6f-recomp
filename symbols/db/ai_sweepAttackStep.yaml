open_questions:
- No caller is known, so the object/state structures and when this state is entered are only inferred from callees.
- What sub_8110D34 tests (wall reached? target hit?), and what sub_81110C8/sub_811109C do with the panel coords,
  is unknown.
- Exact meaning of HitElement values 8 vs 0x28 and of object offsets 0x78-0x7C is unconfirmed.
