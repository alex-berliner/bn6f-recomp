name: ai_sweepAttackStep
address: '0x0811095E'
kind: function
status: confirmed
summary: 'Per-frame step of a sweep-type battle AI attack: advances across columns until the countdown expires at
  the target panel.'
interface: void ai_sweepAttackStep(BattleObject *r5, AIAttackVars *r7); // returns r5 possibly updated
details: "Decrements a u16 countdown timer at object+0x7C. Three branches:\n(1) Timer expired (<0): snaps object\
  \ to the destination panel stored at\n    object+0x7A (X) and current PanelY; writes those into\n    AIAttackVars_TargetPanelX/Y;\
  \ calls object_setCoordinatesFromPanels +\n    object_updateCollisionPanels; sets HitElement=8 (final-hit marker),\n\
  \    AttackElement=0.\n(2) Timer active + object_hasNextXPanelProperty returns nonzero (a next\n    column exists\
  \ in the sweep pattern): clears bit 1 (advancing) from\n    ObjectHeader_Flags; spawns a trail effect at the old\
  \ panel via\n    spawn_effectAtPanel; reloads the step timer from\n    AIAttackVars_Unk_32 into AIAttackVars_StepTimer;\
  \ moves to next panel\n    coords at object+0x78/+0x79, writes them into both the object and the\n    AIAttackVars\
  \ target fields; updates coordinates and collision; spawns\n    a panel-arrival effect (ai_spawnPanelEffect);\
  \ releases the old panel\n    reserve (object_removePanelReserve); zeroes\n    BattleObject_ExtraVars+0xC; sets\
  \ collision region to 1; sets\n    HitElement=0x28, AttackElement=0.\n(3) Timer active + no next column: drifts\
  \ the object linearly by adding\n    XVelocity to X (sub-pixel movement between panels).\nCommon tail for branches\
  \ (1) and (3): resyncs panels from coordinates\n(object_setPanelsFromCoordinates) then updates collision panels.\n\
  Fields touched: oBattleObject_X, XVelocity, PanelX, PanelY, X+0x7A,\nX+0x78, X+0x79, ObjectHeader_Flags, ExtraVars+0xC;\n\
  oAIAttackVars_TargetPanelX/Y, StepTimer, Unk_32, HitElement,\nAttackElement.\n"
