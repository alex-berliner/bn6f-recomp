name: NPCCommand_set_layer_priority_override_to_2
address: '0x0809EF50'
kind: function
status: confirmed
summary: NPC script bytecode command that sets an overworld NPC's layer priority override to 2 and advances the
  script cursor.
interface: void NPCCommand_set_layer_priority_override_to_2(NPCObject *r5, uint32 *r6 /* script cursor */); returns
  r0 = 2, NZCV from r6++ (caller resumes via lr)
details: 'Part of the overworld NPC script command interpreter. Given r5 = pointer to the

  NPC object and r6 = pointer to the script bytecode cursor, this command stores

  the constant 2 into the NPC object''s LayerPriorityOverride field

  (oOverworldNPCObject_LayerPriorityOverride), forcing the NPC to be drawn/layered

  at priority level 2 regardless of its default layer sorting. It then increments

  the script cursor by one word, so the interpreter continues at the next command.

  r0 is left holding 2 (an incidental leftover of the constant load), and the

  flags reflect the r6 increment — callers of the interpreter dispatch apparently

  rely on the interpreter-level conventions rather than on these values.

  Uses `mov pc, lr` to return (Thumb BX-style interwork capable return).

  '
