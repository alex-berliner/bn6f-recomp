summary: Thin trampoline that invokes sub_801C082 with r0 set to 0; no logic of its own.
interface: void sub_801C078(void)  /* callers pass r4, r5, r6, r7, r10; NZCV and r0-r3 come back from the callee
  */
details: A two-instruction wrapper — it pushes lr, clears r0, and tail-calls sub_801C082 via bl, then pops pc. The
  zeroed r0 is the only argument it supplies, so sub_801C082 evidently takes a single value where 0 selects some
  default/mode-0 behavior. Everything else (results in r0-r3 and the NZCV flags per the caller contract) flows straight
  through from sub_801C082. r4-r7 are preserved across the wrapper only in the sense that the callee preserves them;
  the wrapper itself touches nothing but r0. With no knowledge of sub_801C082's behavior yet, no game-level meaning
  can be assigned — this could be an entry point, a reset-style call, or a mode-0 dispatch into a larger routine.
