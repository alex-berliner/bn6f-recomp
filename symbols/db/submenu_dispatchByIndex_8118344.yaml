status: probable
summary: 3-way state dispatcher for the SubMenu subsystem, indexing into a handler table by the byte at
  r5+8 and tail-calling one of three Thumb handlers.
interface: '(r0 = ???, r5 = ???, r10 = Toolkit) -> does not return normally (tail-calls a handler via
  bx r0); side effects: clobbers r0-r7'
details: "- The function is a thin ARM-mode dispatcher. It loads the address of the global sSubmenu into\
  \ r6 (only to keep it live; r6 is otherwise unused here).\n  - Loads the address of off_8118358 (a 3-entry\
  \ pointer table) into r0, then indexes it by the byte at [r5,#8] (treated as a u32 index × 4). Each\
  \ entry is a Thumb-function pointer (+1 Thumb bit).\n  - The table holds sub_8118368, sub_81183C4, and\
  \ sub_81185B8 — three Thumb handlers. The chosen handler's address is loaded into r0 (the entry pointer),\
  \ then control is transferred via `mov lr, pc; bx r0` (an ARM→Thumb tail call).\n  - Because the call\
  \ is a tail-call (bx, not bl), the function has no normal return path; the trailing `pop {pc}` is the\
  \ epilogue stub for any path that did return, but no caller snapshot shows it being taken — every captured\
  \ call returns into the caller at the same address it was called from, with r0 set to 0x00001c60 (a\
  \ typical \"consumed/no-result\" sentinel for this dispatcher style).\n  - r5 is read for the index\
  \ and is also in/out per the contract, suggesting the caller keeps a pointer to a small struct in r5\
  \ across calls. Without project-wide context for what struct r5 points to here, the exact identity of\
  \ r5's pointee is unknown.\n  - r10 holds the Toolkit pointer (per the contract), standard for game-loop\
  \ dispatchers.\n"
