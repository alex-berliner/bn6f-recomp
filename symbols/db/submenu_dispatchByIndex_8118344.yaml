open_questions:
- The role of each of the three handlers (sub_8118368 / sub_81183C4 / sub_81185B8) is not visible here;
  their names would pin down which SubMenu states are dispatched.
- The exact struct r5 points to is unknown; offset 0x8 in the SubMenu struct (sSubmenu) holds `idx_00`
  only at offset 0, not 8, so r5 likely points to something other than the SubMenu global itself (perhaps
  a SubMenuEntry or similar sub-struct, or an outer state struct).
- Why r0=0x08118345 appears at function entry (the function's own address+1) is unclear; it could be that
  the caller uses an indirect-call-as-tail-call mechanism and the captured r0 reflects the just-loaded
  LR.
