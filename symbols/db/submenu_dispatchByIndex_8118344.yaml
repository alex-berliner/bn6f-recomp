  date: '2026-10-14'
  detail: '- `ldr r6, off_8118364 // =sSubmenu` ties the function to the SubMenu subsystem. - `ldrb r1,
    [r5,#8]` and `ldr r0, [r0,r1]` use the byte at r5+8 as a 0..2 index into a 3-entry dispatch table.
    - The table at off_8118358 contains exactly three entries pointing to sub_8118368, sub_81183C4, sub_81185B8
    (visible in the literal pool). - `mov lr, pc; bx r0` performs an ARM→Thumb tail call to the chosen
    handler; the function does not normally return (no `bx lr`). - Captured exit r0 is consistently 0x00001c60
    with -Z-- flags, suggesting a sentinel return convention (the handlers tail-call back into the dispatcher
    wrapper at +1 = 0x08118345, which then propagates 0x1c60).'
