name: chatbox_cmd_playerFixedAnim_8041EE8
address: '0x08041EE8'
kind: function
status: confirmed
summary: Chatbox script command that requests a fixed overworld player animation (operand byte at script+2) and
  stores the player's byte 0x14 into the chatbox work area.
interface: void chatbox_cmd_playerFixedAnim(ScriptCtx* r4, Chatbox* r5, ? r6, Toolkit* r10); returns r0=0, r4=script+3,
  r1=sub_809E14C result, r7=player object
details: 'Chatbox script interpreter command handler (3-byte command: opcode + operand at [r4+2]).

  1) Sets bit 0 of the chatbox 0x3E flag word via chatbox_setflags_3e (immediate 1, no

  named constant for this bit).

  2) Loads the overworld player object from toolkit->gameState->overworldPlayerObjectPtr

  and copies byte 0x14 of that object (likely facing/state byte) into the chatbox work

  area at offset 0x3C.

  3) Loads the command operand byte and calls owPlayer_RequestFixedAnimation_809E14C

  (r0=operand, r1=chatbox+0x3C''s source pointer still in r1 = r5+0x3C, r7=player object).

  The operand is checked with cmp r0,#7 / bgt, but both paths fall through — a no-op

  (possibly a truncated range check; values >7 are not actually rejected).

  4) Advances the script pointer r4 by 3 and returns r0=0. r5, r6, lr preserved;

  N/Z forced by mov r0,#0, C/V survive the pointer add.

  '
