name: owMapObject_weatherTornado_isBlocked_80A90CC
address: '0x080A90CC'
kind: function
status: confirmed
summary: Returns whether the tile 0xC bytes past an overworld object's coordinate is occupied by a tornado (coordinate-trigger
  value 0xC0), signaling a blocked move.
interface: int owMapObject_weatherTornado_isBlocked(coordBase /*r5*/, pass /*r10*/) -> r0 = 0|1, NZ set from r0
details: 'Tiny predicate used by the weather-tornado map object: it adds 0xC to the object coordinate pointer/base
  in r5 and calls checkCoordinateTrigger_8031a7a with r10 passed through untouched (likely a secondary coordinate
  or context word the trigger checker consumes). If the trigger check returns 0xC0 — the marker for a tornado standing
  on that tile — the result register r4 is set to 1, otherwise it stays 0. Returns the 0/1 result in r0 and sets
  NZ from it so callers can branch directly. Only r4 and the call are local work; r5/r6/r8-r12 on exit are just
  whatever checkCoordinateTrigger_8031a7a left in them (r5 itself is preserved), so callers must not rely on them.

  '
