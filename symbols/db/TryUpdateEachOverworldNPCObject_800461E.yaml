status: confirmed
summary: Run every active overworld NPC's update handler, once per frame.
interface: '() -> unless event flag EVENT_NPC_OBJECTS_DISABLED (0x1701) is set: for each NPC in eOverworldNPCObjects
  (16 x 0xD8 bytes) with OBJECT_FLAG_ACTIVE, and not (GameState.BattlePaused and no OBJECT_FLAG_PAUSE_UPDATE): call
  off_80045BC[ObjectHeader.Index] with r5 = NPC, r0 = handler, r1 = Index*4, flags N=0 Z=(Index==0) C=0; r4-r9,
  r12 preserved; r2 = whatever the last handler left'
details: The handler table has one entry (npc_dispatch_809E570), so Index is always 0 for NPCs. The loop re-reads
  r5 after each handler.
