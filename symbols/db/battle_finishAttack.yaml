name: battle_finishAttack
address: '0x080FBCA2'
kind: function
status: probable
summary: 'Tears down a battle object''s attack state: clears ObjectFlags1 bit 0x40, calls sub_801DC7C(0,0),
  updates collision data with args (r1=1,r2=2,r3=3), sets collision region 1, copies DamageAndStaminaDamageCounterDisabler
  into the collision record (low half -> SelfDamage, high byte -> StaminaDamageCounterDisabler), syncs
  sprite flip, releases the AIDataPtr+0xA0 target panel, and clears ExtraVars+4 if nonzero.'
interface: () -> void; reads r5 = battle object pointer, no arguments or return value
details: Operating on the battle object in r5, it clears ObjectFlags1 bit 0x40 via object_clearFlag, calls
  sub_801DC7C with r0=r1=0, then writes 1/2/3 into object_updateCollisionData's args. It takes oBattleObject_DamageAndStaminaDamageCounterDisabler,
  stores its low half into oCollisionData_SelfDamage and its high byte into oCollisionData_StaminaDamageCounterDisabler,
  then sets collision region 1. It copies object_getFlip's result into sprite_setFlip (mask 0x30 in sprite
  bytes 0x13/0x16). Using the AI data pointer +0xA0, it reads oAIAttackVars_TargetPanelX/Y and releases
  the panel with object_removePanelReserve. Finally, if oBattleObject_ExtraVars+4 is nonzero it is cleared
  to 0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: object_clearFlag(0x40) and object_updateCollisionData(1,2,3) reset collision/flag state at function
    start; low/high split of DamageAndStaminaDamageCounterDisabler written to oCollisionData_SelfDamage
    and oCollisionData_StaminaDamageCounterDisabler; object_getFlip result passed to sprite_setFlip, keeping
    the sprite mirroring in sync with facing; TargetPanelX/Y from AI attack vars at AIData+0xA0 fed to
    object_removePanelReserve — cleanup of a panel reserved for an attack; clearing oBattleObject_ExtraVars+4
    last suggests it resets one-shot per-attack scratch data
  refs:
  - bn6f/asm/asm31.s:145048
  - 0x0801A15C object_clearFlag
  - 0x0800E456 object_getFlip
  - 0x0801BB46 object_removePanelReserve
