name: ai_stepMoveToPanel
address: '0x080FC17C'
kind: function
status: probable
summary: 'AI attack step: calls object_canMove (exit on fail), loads two per-alliance params from byte_80FC1CC
  into r2/r3, then calls oAIAttackVars_PanelChooseCallback (r0=TargetObjectPtr, r2/r3=params); on non-zero
  return stores x/y to FuturePanel, reserves panel, sets CANNOT_SLIDE, CurAnim=4, StepTimer=3, HasMoved=1,
  HitElement=4.'
interface: (r0 = battle object ptr (in r5 via caller convention), r7 = AI attack vars) -> r0 = 1 if a
  move was queued else 0; sets oAIAttackVars_HasMoved
details: First calls object_canMove; if the object is blocked it clears HasMoved and calls object_exitAttackState
  to end the step. Otherwise it indexes byte_80FC1CC by Alliance*8 to load two per-alliance parameters
  into r2/r3, then tail-invokes the callback stored at oAIAttackVars_PanelChooseCallback with r0 = oAIAttackVars_TargetObjectPtr;
  the callback returns the chosen panel in r0 (x) and r1 (y), and returning 0 in r0 aborts like the canMove
  failure. On success it stores the panel into oBattleObject_FuturePanelX/Y, claims it with object_reservePanel,
  sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1 so the object can't be pushed off, sets CurAnim =
  4 (a move/slide animation), loads oAIAttackVars_StepTimer = 3 and oAIAttackVars_HasMoved = 1, and writes
  4 to oAIAttackVars_HitElement. This is clearly one step in the AI attack step machine driven by the
  oAIAttackVars fields.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_canMove + beq failure path that clears HasMoved and calls object_exitAttackState (steps
    0x080FC17C-0x080FC1BC); ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; mov lr,pc; bx r1 — callback
    returns panel x/y in r0/r1, stored into oBattleObject_FuturePanelX/Y; bl object_reservePanel then
    mov r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1 — claims the destination panel and locks sliding;
    CurAnim=4, StepTimer=3, HasMoved=1 written to oAIAttackVars — standard 'movement step taken' bookkeeping
    of the AI attack sequencer; callee summaries (object_canMove, object_reservePanel, object_setFlag1,
    object_exitAttackState) all match this interpretation
  refs:
  - bn6f/asm/asm31.s:144221
  - 0x0800E5E2 object_canMove
  - 0x0801BB1C object_reservePanel
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080FC17C
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The name and overall logic match: object_canMove guard, per-alliance table indexing into r2/r3,
    callback via mov lr,pc;bx r1, FuturePanelX/Y store, reservePanel, CANNOT_SLIDE flag, CurAnim=4, StepTimer=3,
    HasMoved=1, HitElement=4 all confirmed by asm. However the proposal says ''tail-invokes'' but the
    code uses mov lr,pc;bx r1 (a normal call that returns). The interface claims ''r0 = 1 if a move was
    queued else 0'' but the success path leaves r0=4 (from the HitElement store) at pop pc, and the failure
    path''s r0 is whatever object_exitAttackState returns—not a clean 0. Also r2/r3 loaded from byte_80FC1CC
    are passed as extra arguments to the callback, which the summary omits.; run wf investigate investigate-20261018-155607;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
