name: battle_applyObjOamAttrByIndex
address: '0x0811A914'
kind: function
status: probable
summary: Loads a word (0x20000000 or 0x40000000) from byte_811A938 using r0<<2 and stores it via sprite_setUnk0x2c
  on the entity at eStructArr2008450 entry r1. Then returns the entity's first (status) byte with Z set
  iff bit 0x8 is clear.
interface: (r0 = selector indexed into byte_811A938 (word-sized), r1 = index into eStructArr2008450) ->
  r0 = entry status byte; Z set iff bit 0x8 of that byte is clear
details: Fetches the entry of the fixed 0x58-byte struct array at eStructArr2008450 given by r1, keeping
  its pointer in r5. Uses r0<<2 to load a word from byte_811A938 (0x20000000 or 0x40000000 — likely hflip/vflip
  or OAM attr bits) and stores it into field 0x2c of the sprite struct via sprite_setUnk0x2c. Then reads
  the entry's first (status) byte and tests bit 0x8, returning with NZ flags from that test. The two table
  entries suggest a binary choice such as facing direction. Exact meaning of the 0x8 status bit is not
  shown here.
