name: ow_restorePlayerSpriteAfterBeastOut
address: '0x0809E31A'
kind: function
status: probable
summary: Reloads the player's normal overworld sprite and clears beast-out state (event flags and control
  lockout).
interface: () -> void; touches GameState.Unk_09 (set to 0), event flags EVENT_68E (set) / EVENT_68F (cleared),
  eStruct2000aa0 fields 0x4 and 0x8 (zeroed)
details: 'Zeros two state bytes in eStruct2000aa0 (offsets 0x4 and 0x8), then loads a sprite (args 0x80,
  0x18, 0x48) onto the overworld player object from GameState''s player-object pointer, calls sprite_setAnimation
  with the object''s byte 0x14 (the form/animation selector), loads the animation data, disables the shadow,
  and runs sprite_update. It then clears GameState''s Unk_09 byte via gameState_setUnk09_8001172, the
  ''can''t jack out / control message'' flag, and swaps event flags: sets EVENT_68E and clears EVENT_68F.
  This matches a beast-out (or similar temporary overworld form) ending: special sprite removed, normal
  form animation restored, control restriction lifted, and the active-form flags flipped back.'
