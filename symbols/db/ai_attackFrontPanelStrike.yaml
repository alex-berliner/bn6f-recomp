name: ai_attackFrontPanelStrike
address: '0x081026EE'
kind: function
status: probable
summary: AI attack routine that telegraphs (spawns a temp attack object, sound 0xCE) then strikes the
  panel in front with a collision region and effect before handing off via HitElement 8.
interface: (r0 = AttackElement byte of oAIAttackVars, r5 = battle object, r7 = oAIAttackVars struct) ->
  r0 = clobbered; sets CurAnim, StepTimer, AttackElement, HitElement
details: This is a step function for an enemy AI attack driven by oAIAttackVars. On the first invocation
  (AttackElement == 0) it plays animation 5, resets StepTimer, spawns a type-1 subtype-5 temp attack object
  anchored at r5+0x4C, sets a 0x10 counter time, plays sound effect 0xCE, and stores AttackElement = 4.
  In state 4 it waits until StepTimer == 10, then spawns a collision region on the panel one step in front
  (front direction + PanelX, PanelY) with InitFlag, damage from oAIAttackVars_Damage and packed params
  0x705ff11 (r7 = 3 passed as an argument), converts the panel to pixel coordinates and spawns effect
  object 0x04001b (effect 0x1b) flipped per the object's facing. StepTimer then counts to 0x1E (30 frames),
  at which point HitElement is set to 8 to advance to the next attack phase.
