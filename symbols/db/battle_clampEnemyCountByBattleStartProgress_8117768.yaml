- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, #0x75; bl CheckKeyItem` selects which progress key item / flag to inspect (asm lines
    1-2). - `cmp r0, #4; bge loc_8117778` followed by `mov r0, #4` on the fall-through path enforces a
    minimum of 4 (lines 3-5). - `cmp r0, #8; ble locret_811777E` followed by `mov r0, #8` enforces a maximum
    of 8 (lines 6-8). - r10/lr are callee-saved on entry but unused inside; consistent with a leaf helper
    that takes only the toolkit (r10) for CheckKeyItem. - Captured exit r0=4 across all shown battle snapshots,
    matching the clamp floor when the flag is small.'
