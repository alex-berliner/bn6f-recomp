open_questions:
- Exact meaning of key item 0x75 in CheckKeyItem (battle-progress flag / story milestone) — settled by
  reading CheckKeyItem and the surrounding battle-setup caller at 0x081176ee.
- Whether this is virus count, enemy-side actor count, or another battle-array length — the constant 4..8
  range strongly suggests virus battle size limits in BN6, but the precise consumer of the return value
  isn't visible from this function alone.
