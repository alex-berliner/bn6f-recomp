status: probable
summary: Clamps enemy (virus) count for the battle by checking progress flag 0x75 (min 4, max 8 viruses)
interface: (r10 = toolkit, lr = return) -> r0 = clamped enemy count (4..8)
details: "Pushes lr, sets r0 = 0x75 (a flag/index passed to CheckKeyItem), calls CheckKeyItem, then clamps\n\
  \  its return value to the inclusive range [4, 8]: if the result is < 4 it returns 4, if > 8 it\n  returns\
  \ 8, otherwise the original value. The captured calls show a constant lr=0x081176ee (the\n  caller)\
  \ and a stable exit of r0=4 in the recorded frames, meaning in those snapshots the\n  underlying flag\
  \ was below 4 and the clamp raised it to the minimum 4. No global state is\n  written by this function\
  \ itself; it is a pure getter + clamp on a battle-progress flag.\n"
