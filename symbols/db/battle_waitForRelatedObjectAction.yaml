name: battle_waitForRelatedObjectAction
address: '0x080DC668'
kind: function
status: probable
summary: Battle-object state that removes itself from collision, then each frame checks if the related
  object's CurAction matches this object's Param2, or until Timer exceeds Param3, at which point it clears
  its collision region and transitions to CUR_STATE_DESTROY.
interface: (r5 = battle object) -> void; sets oBattleObject state to CUR_STATE_DESTROY when done
details: 'On first run it zeroes the Timer and sets PhaseInitialized=4. Each frame it compares the related
  object''s (RelatedObject1Ptr) CurAction with this object''s Param2: if they differ, or once the Timer
  exceeds Param3, it clears its collision region and moves to the destroy state, ending the wait. While
  waiting, if its collision data reports nonzero collision flags it also clears its collision region (drops
  out of the region) but keeps counting. It then calls sub_80DC6D2 (per-frame behavior, likely animation/sprite
  update) and object_presentCollisionData to run the shared collision processing for the frame.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r0,#oBattleObject_CurAction]; cmp with Param2; bne loc_80DC69E destroys on mismatch
    (0x080DC67C-0x080DC69E); Timer incremented and compared against Param3, exceeding it falls through
    to destroy (0x080DC692-0x080DC6A2); mov r0,#CUR_STATE_DESTROY; str [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    (0x080DC69E); First-run block zeroes Timer and sets PhaseInitialized=4 (0x080DC66E); Callees object_clearCollisionRegion/object_presentCollisionData
    match battle-object collision lifecycle; caller is the entry/state-init handler for the same object
  refs:
  - bn6f/asm/asm31.s:79049
  - 0x080DC61C battle_initFacingSpriteEntryState
  - 0x0801A074 object_clearCollisionRegion
  - 0x0801A018 object_presentCollisionData
  - 0x0801A00E object_removeCollisionData
  reproduce: python3 tools/asmcat.py 0x080DC668
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is mostly accurate: Param2 is compared to related object''s CurAction, Timer counts
    up and is bounded by Param3 (BLE branch falls through to destroy), collision region is cleared in
    both branches, and CUR_STATE_DESTROY is set. However, the function first calls object_removeCollisionData
    unconditionally before the PhaseInitialized check, which the summary omits. Also the name ''waitForRelatedObjectActionState''
    is slightly off since it watches CurAction against Param2 (a target action ID), not the state itself.;
    run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
