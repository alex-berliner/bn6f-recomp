name: timer_IsEnabled_8144CE0
address: '0x08144CE0'
kind: function
status: confirmed
summary: Returns the byte at eTimerEnable200F460+1, the second byte of the timer-enable flags, i.e. whether that
  timer/flag group is currently enabled.
interface: bool timer_IsEnabled(void) — reads none, returns r0 = byte flag (0 or nonzero)
details: 'Trivial getter: loads the pointer to eTimerEnable200F460 from the literal pool and returns the byte at
  offset 1 (byte_200F461) of that timer-enable structure. No state is modified and no flags are touched; it just
  exposes the current enabled state of whatever subsystem that second flag byte controls to callers in a branch-safe
  form (plain bx lr, r0 as the value). The base object eTimerEnable200F460 is evidently a multi-byte flag block
  whose individual bytes gate different timer behaviors, so this accessor is bound to the second of those bytes
  rather than the whole block.'
