name: object_resolveTableEntry_8134558
address: '0x08134558'
kind: function
status: confirmed
summary: Computes a packed object ID from a table-index and sub-identifier, reads two 16-bit attributes from the
  referenced entry, and delegates resolution to sub_811FA98 (lookup type 0x20002, field 0xC24C, count 100, entry-type
  7).
interface: void object_resolveTableEntry_8134558(u32 index, u32 sub_id, u32 attr_a_off, u32 attr_b_off, /*r5=*/u32
  entry_ptr);
details: 'Reads a signed 16-bit stride value at entry_ptr+0x18, scales it by 8 (entry size),

  subtracts it from the caller-supplied index, shifts the result left 16 bits, and ORs

  in the sub_id to form a packed object ID: ((index - stride*8) << 16) | sub_id.

  Loads two unsigned 16-bit attribute words from entry_ptr at the caller-supplied

  byte-offsets attr_a_off and attr_b_off. Passes the ID, the constant lookup type

  0x20002, both attributes, entry_type constant 7, the entry pointer, field-ID

  0xC24C, and count 0x64 (100) to sub_811FA98 for the actual table resolution.

  Pushes/restores r4-r7 around the callee call so outer callers see them unchanged.

  Literal pool: dword_8134588=0x182 (unused in visible path, likely a remnant or

  referenced by an adjacent function), dword_813458C=0x20002, dword_8134590=0xC24C.

  '
