name: battle_winnerAnnounceState
address: '0x08008688'
kind: function
status: probable
summary: Battle-flow state that records the losing side on first entry, plays the winner jingle (or ACDC
  Town music when phase==1), kicks off battle effect 0x14, and ticks a halfword timer down before writing
  0xc to the next-state field.
interface: '(r0 = unused; r5 = battle flow state struct: +3 state byte, +2 next-state halfword, +8 countdown
  halfword) -> r0 = void'
details: 'On first entry (state byte +3 == 0) it clears battle flags 0x824c43, runs the per-tick player
  HP regen, copies oBattleState_PlayerSide into oBattleState_LoserSide, and sets state +3 = 4. It then
  reads the battle effects bitmask: if bit 0x2 is clear it picks SONG_WINNER_1 and a 0x66-frame timer,
  otherwise a 0x19 song and 0x41 timer; if the phase byte (from battle_getPhase) equals 1 it overrides
  the song with SONG_ACDC_TOWN, then dispatches battle effect kind 0x14. On later frames it decrements
  the halfword at +8, waits for comm_checkCrossNetBattleReady_801E754 in linked battles, and once the
  timer hits zero writes 8 to +2 to advance to the next state.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#3] / mov r0,#4; strb r0,[r5,#3] — one-shot entry keyed on a state byte, then self-advances;
    ldrb r1,[r0,#oBattleState_PlayerSide]; strb r1,[r0,#oBattleState_LoserSide] — records who lost; GetBattleEffects
    bit 2 selects SONG_WINNER_1 vs song 0x19 and timer 0x66 vs 0x41 before PlayMusic; cmp r6,#1 (battle_getPhase
    result) swaps in SONG_ACDC_TOWN, suggesting a non-standard battle phase; ldrh r0,[r5,#8]; sub r0,#1
    ... ldrsh r0,[r5,r0]; tst; bgt .ret; strh 8 -> [r5,#2] — frame countdown then next-state write
  refs:
  - bn6f/asm/asm00_1.s:11851
