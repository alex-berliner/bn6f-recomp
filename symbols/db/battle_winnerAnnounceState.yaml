open_questions:
- Exact meaning of the +2 halfword (next state id vs a sub-command) needs the state machine that reads
  it
- What effects-bit 0x2 and phase 1 represent (which battle variants use song 0x19 / town music)
- The summary and most details match the code (first-entry setup copies PlayerSide to LoserSide, picks
  SONG_WINNER_1 vs 0x19 song, overrides SONG_ACDC_TOWN when phase==1, dispatches effect 0x14, decrements
  halfword at +8). However the proposal says the advance writes 8 to +2; the code is `mov r0,#0xc; strh
  r0,[r5,#2]`, so it writes 0xc (12), not 8. Minor but concrete contradiction.
