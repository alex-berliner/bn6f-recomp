name: battle_divemanDispatchActionStep
address: '0x080B9A34'
kind: function
status: probable
summary: 'DiveMan battle-object action dispatcher: calls the per-action update handler selected by the
  object''s CurAction field.'
interface: (r5 = battle object ptr, CurAction used) -> jumps to handler in Thumb via lr; no return value
details: Reads the object's CurAction byte at [r5,#oBattleObject_CurAction] and indexes the jump table
  off_80B9A48 (6 entries) to branch into the matching action handler, using the classic mov lr,pc/bx trick
  for a long Thumb call. Handlers include battle_objPlayAnimAndEndAction, sub_80B9A96, battle_objectShakeScreenActionStep,
  battle_divemanPhaseWaveAttack, sub_80B9B30 and sub_80B9B58, so the table is the per-action state-machine
  step update for a DiveMan battle object. r5 as the self pointer matches the project's battle-object
  calling convention where the object lives in a register across action steps.
