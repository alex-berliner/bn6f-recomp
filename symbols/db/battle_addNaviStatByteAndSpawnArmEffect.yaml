name: battle_addNaviStatByteAndSpawnArmEffect
address: '0x08010820'
kind: function
status: probable
summary: Adds an amount to a byte in the acting Navi's battle NaviStats (clamped to 9), then spawns an
  effect object at an arm-slot offset and plays sound 0x119.
interface: (r0 = amount to add, r5 = battle object ptr) -> r0 = spawned effect object ptr; updates NaviStats
  byte 1
details: 'Masks r0 to 0xFF into r4, reads byte offset 1 of the alliance-side NaviStats via GetBattleNaviStatsByte,
  adds r4 and clamps the result to a maximum of 9, then stores it back with SetBattleNaviStatsByte. It
  then reads 12 bytes at object+0x34, calls getBattleArmPositionMaybe_8018810 with NameID, slot 0x20,
  Alliance and DirectionFlip, sign-extends the returned x (lsl #0x10) and adds it to the first saved word
  and the returned y (r4 = y<<16) to the third. With these adjusted values and r4=0x31 it calls spawn_t1_0x0_EffectObject
  and finally plays sound effect 0x119. The clamp at 9 and the add suggest a gauge/charge counter being
  filled by r0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl GetBattleNaviStatsByte / add r2, r0, r4 / cmp r2, #0xa; blt / mov r2, #9 / bl SetBattleNaviStatsByte:
    add-and-clamp-to-9 stat byte at offset 1; ldmia r0! {r1-r3} from r5+0x34 then bl getBattleArmPositionMaybe_8018810
    with r1=0x20 slot: x/y offsets added into spawn args; mov r4, #0x31 / bl spawn_t1_0x0_EffectObject:
    spawns battle effect with kind 0x31; mov r0, #0x1a / add r0, #0xff / bl PlaySoundEffect: plays sound
    0x119 after spawning; r5 fields oBattleObject_Alliance/NameID/DirectionFlip used throughout: operates
    on a battle object''s acting Navi'
