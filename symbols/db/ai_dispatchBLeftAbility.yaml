name: ai_dispatchBLeftAbility
address: '0x08011790'
kind: function
status: probable
summary: Dispatches to a per-ability handler via a jump table indexed by the AI data's BLeftAbility field,
  with r7 pointing at the AI's attack vars.
interface: (r6 = AIData struct) -> tail-calls handler from table off_80117D4 indexed by [r6,#oAIData_BLeftAbility]*4,
  r7 = r6+oAIData_AttackVars; returns via pop {r6,r7,pc}
details: 'The function is a small trampoline/dispatcher: it computes r7 = r6 + oAIData_AttackVars (a scratch/attack-variable
  area inside the AIData struct the caller works with), then reads the byte at oAIData_BLeftAbility, multiplies
  it by 4, and loads a function pointer from the table at off_80117D4. It sets lr = pc and branches to
  that handler with bx r1, so the handler runs with r6 (AIData) and r7 (attack vars) already set up and
  returns directly to the pop instruction, restoring r6/r7 and returning to the caller. This is a classic
  switch-on-id dispatch over up to N handlers, keeping the caller (playerAI code) small.'
