name: ai_gregarStartPanelAttack
address: '0x08103F54'
kind: function
status: probable
summary: 'Starts a Gregar AI attack step: installs a panel-choice callback, stores attack timing, targets the opposing
  player, and launches attack ID 9.'
interface: (r0-r3 = results of sub_8103E2A passed through) -> r0 = ...; stores callback, duration, boost, timer,
  substep and target into oAIAttackVars on r7
details: Called from the Gregar AI state machine when RNG & 0xF < 8 selects the attack. It saves a callback (sub_8104E98)
  into oAIAttackVars_PanelChooseCallback, calls sub_810407E with 0, then sub_8103E2A whose return values fill AttackDuration
  (halfword), AttackBoost2, TimerOrCycles and SubStepIndex of the oAIAttackVars struct on r7. It then flips the
  owner's Alliance byte and calls battle_findPlayer to fetch the opposite-side player, storing it as oAIAttackVars_TargetObjectPtr.
  Finally it invokes object_setAttack4 with r0=9 to begin the attack.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'str sub_8104E98+1 into oAIAttackVars_PanelChooseCallback: panel-choosing is deferred to a callback; eor
    r0,r1 with oBattleObject_Alliance then battle_findPlayer -> target is the opposite-side (player) object; bl
    object_setAttack4 with r0=#9 launches a specific attack id; caller sub_8103CD0 gates entry with GetPositiveSignedRNG
    & 0xF < 8, i.e. an AI random attack choice'
