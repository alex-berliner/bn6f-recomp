status: probable
summary: 'Cleans up the wireless (RFU) link: invokes rfu_setStateEnded (state 9) then ORs bits 0x8 and
  0x80 into the RFU shared state flags word at offset 0xC of the 0x200BC50 structure.'
interface: () -> r0 = 0 (from last rfu_orFlags call, likely ignored); no flags used
details: 'Trivial two-part teardown sequence: first calls rfu_setStateEnded (0x813D978) which writes state
  value 9 into the RFU/wireless work structure at 0x200BC50 area and invokes the lower RFU state routine
  with 0; then it ORs bits 0x8 and 0x80 into the flags word at offset 0xC of the RFU shared state at 0x200BC50
  via rfu_orFlags. The r4-r7 push/pop is dead code (registers unused), a compiler artifact. The literal
  eS200A290 is loaded but never actually used before the pop, suggesting stripped/partial logic.'
