name: battle_scanAttackPanels
address: '0x080D8EE4'
kind: function
status: probable
summary: On the animation frame flagged as the hit frame (bit 0x80), walks the panels in front of the
  object in its facing direction (up to 5 steps), terminates a list at object+0x60 with -1, and advances
  the object to phase 4.
interface: (battle object in r5, set by caller) -> updates object fields; r0 clobbered
details: Calls sprite_getFrameParameters and tests bit 0x80 of the returned attribute byte, i.e. this
  only acts on the frame marked as the 'active/hit' frame. If set, it stores 1 into oBattleObject_CurAnim,
  gets the +1/-1 facing multiplier from object_getFrontDirection, and starts r0 at oBattleObject_PanelX.
  In a loop of at most 5 iterations it calls sub_80D8F66 (r3 = r5+0x60 + 4*i, r0 = panel x, r1 = direction),
  then r0 += dir; it stops early when r0 becomes 0 or exceeds 6, i.e. when the scan leaves the 1-6 column
  range. The array at r5+0x60 (five 32-bit slots) appears to be filled by sub_80D8F66 during the walk
  and is terminated by storing -1 (0xFFFFFFFF) at the current slot. Finally it stores 4 into oBattleObject_CurPhase,
  likely moving the object to its attack/after-hit phase. If the 0x80 flag is not set it returns immediately
  without touching state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst r0,#0x80 after sprite_getFrameParameters gates the whole body on the frame attribute byte;
    bl object_getFrontDirection then ldrb r0,[r5,#oBattleObject_PanelX] and add r0,r0,r1 steps panel x
    by facing each iteration; cmp r0,#6 / beq on 0 exits when x leaves the 1..6 battle-board range; loop
    counter r4=#5 and r3=r5+0x60 stepping by 4 shows a five-entry list at object+0x60, ended by mov r0,#0
    / sub r0,#1 / str r0,[r3]; strb #4,[r5,#oBattleObject_CurPhase] and strb #1,[r5,#oBattleObject_CurAnim]
    advance object state after the scan'
