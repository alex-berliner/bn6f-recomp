name: ai_chargeAttack_step_80FFD6A
address: '0x080FFD6A'
kind: function
status: confirmed
summary: 'Per-frame AI charge-attack tick: initializes attack element/timer, counts down, and periodically
  highlights the panel in front of the battle object.'
interface: u32 ai_chargeAttack_step_80FFD6A(u32 r5 battleObj, u32 r7 aiVars, u32 r1 in) -> u32 r1
details: 'r5 points to a BattleObject, r7 to AIAttackVars. On first call (AttackElement==0) it sets AttackElement
  to 4 (Wood), seeds StepTimer from AttackBoost2, and zeroes ChargeCycles. Subsequent calls decrement
  StepTimer; when it reaches zero the function writes 0xC (a hit-element code) to HitElement and returns,
  ending the charge. While the timer is still active it increments ChargeCycles; on frames where bit-2
  of ChargeCycles is set (every 4th tick) it skips visual feedback. Otherwise it calls object_getFrontDirection
  to get the facing direction, computes the panel directly ahead (PanelX + dir, PanelY), and calls object_highlightPanelRegion
  with a width of 6 and the battle object''s alliance/direction-flip value. Returns r1 (highlight result
  passthrough).

  '
