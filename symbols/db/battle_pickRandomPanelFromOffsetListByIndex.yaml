name: battle_pickRandomPanelFromOffsetListByIndex
address: '0x0811000E'
kind: function
status: probable
summary: Wrapper that selects a panel-offset list from PanelOffsetListsPointerTable by index and returns
  a uniformly random matching panel from it.
interface: (r0 = panel-parameter masks/args for callee, r4 = list index) -> r0 = random panel (x, y, count);
  clobbers r4-r7, lr
details: 'Thin dispatcher: shifts the index in r4 left by 2, reads the corresponding pointer from PanelOffsetListsPointerTable,
  and tail-calls battle_pickRandomPanelFromOffsetList, which scans that offset list against panel-parameter
  masks and returns one uniformly random matching panel (x, y, and candidate count). The r0 argument is
  passed through untouched, so the caller sets up whatever mask/parameter arguments the random-panel routine
  expects. The table indirection lets callers request a random panel from one of several predefined offset
  lists by number. No quirks visible; it is just an indexed lookup plus a call.'
