name: navicust_checkEquipDialogs
address: '0x081370D4'
kind: function
status: probable
summary: NaviCust menu handler that validates the player's part setup, pops the matching warning dialog
  (script 0x10/0x11/0x12/0x14) and writes the next menu state (0x34/0x38) to [r5].
interface: (r5 = state-out byte ptr, r7 = naviCust menu context) -> r0 = last dialog/param result; [r5]
  = next state 0x34 or 0x38; no branch flags of use
details: 'First closes/resets dialog slot 0x3F8 via sub_8137670, bails if byte [r7,#0xd] is set, and returns
  early when sub_8137648(0, 0xa) reports equality (likely a fade/transition-done check). When context
  state [r7,#2]==4 it reads halfword [r7,#0x20]: value 1 or 2 shows dialog 0x10/0x11 and sets next state
  0x34; otherwise it passes param 1 to sub_8137670, shows dialog 0x14, calls sub_81375D8 and sets state
  0x38. When state==8 it reads halfwords [r7,#0x28] and [r7,#0x2c] as (base,index) into battle_checkItemFlagFor_813B9B4,
  which probes the toolkit flag array at 0x200414C with 7-byte stride; if the flag is set it shows dialog
  0x12, sets state 0x34 and clears the dialog param. The four dialog ids and two result codes make this
  the equip-error/notice branch of the Navi Customizer screen state machine.'
