name: chip_class_lookup_800FC9E
address: '0x0800FC9E'
kind: function
status: confirmed
summary: Looks up a chip's class byte from one of two ROM tables and returns a flag indicating which table was used.
interface: u32 sub_800FC9E(u32 class, u32 code); // returns table byte in r2, flag (0 or 8) in r1
details: "Two adjacent ROM byte tables:\n  * byte_800FCBC (length 25): indexed by `code` (r1) when class (r0) ==\
  \ 0;\n    contains 0x0 bytes for indices 0..10, then 0xB, 0xC, 0x1..0xC.\n  * byte_800FCD5 (length 15): indexed\
  \ by class (r0) when class != 0;\n    contains 0x0..0xB, then three 0x0 bytes.\nOn the class==0 path r1 is clobbered\
  \ to 0 (flag = \"table 0 used\");\non the class!=0 path r1 is clobbered to 8 (flag = \"table 1 used\").\nThe lookup\
  \ payload is returned in r2. NV flags are clobbered (cmp);\nC and V are clobbered by the ldrb and movs; r0 is\
  \ clobbered by the ldr\nof the table base. Caller supplies class and code and consumes both r1\n(table selector\
  \ flag, 0 or 8) and r2 (the looked-up byte).\nThe class!=0 index `r0` is used directly as an offset into the second\n\
  table with no bounds check (table is 15 bytes), so values >=15 read\narbitrary ROM. This may be intentional (caller-supplied\
  \ constant) or\na latent bug; the readable C explicitly notes the unchecked index.\n"
