name: submenu_positionOptionSprite
address: '0x0812B29C'
kind: function
status: probable
summary: Repositions the sub-menu's option sprite (ID 0x78) to the x-slot matching the given option index,
  unless a flag disables it.
interface: (r0 = option index into context struct at r5) -> void; r0-r3 clobbered, no return value
details: Reads the flag byte [r5+0x1b]; if bit 0 is set it exits without touching the sprite. Otherwise
  it loads a byte at r5[index] (the per-option field selected by r0), multiplies it by 0x20 and adds 0x28
  to build an x coordinate, and calls sprite_setPositionById with sprite ID 0x78, that x, and a fixed
  y of 2. The 0x20 spacing per index is typical of horizontally laid-out menu entries (e.g. chip folder/grid
  slots). The flag check acts as a visibility/enable gate for the repositioning.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#0x1b]; tst r0,r1(=1); bne return — early-out when flag bit0 set; ldrb r1,[r5,r6];
    mul r1,#0x20; add r1,#0x28 — x coordinate derived from indexed byte; ldr r0,=0x78; mov r2,#2; bl sprite_setPositionById_811C23C
    — moves sprite ID 0x78 to (x,2); Callers 0x812933C/0x8129400 are sub-menu input/fade-pop handlers
    that drive cursor movement, matching index-driven repositioning
