open_questions:
- What sub_8101FAE actually does (movement undo vs finalize) is unknown without its body
- Which AI script/state table dispatches to this handler, and what attack 9 represents in game terms,
  is not visible here
- The summary is accurate. However, the proposed name `ai_attack9DecisionHandler` implies a 'decision
  handler,' but the function is specifically for attack 9, and the primary action is calling `ai_setupAttack9PanelChoose`.
  A clearer name reflecting that this is an attack-9 panel-choose setup/dispatch function is better.
