name: battleObject_SetSecondaryElementWeakness_8019F9E
address: '0x08019F9E'
kind: function
status: confirmed
summary: Sets the secondary element weakness of a battle object's collision data.
interface: void battleObject_SetSecondaryElementWeakness(battleObject_t* obj /* r5 */, u8 element /* r0 */)
details: Reads the collision data pointer from the battle object (oBattleObject_CollisionDataPtr off r5), then stores
  the byte in r0 at oCollisionData_SecondaryElementWeakness of that collision data. This is the "second weakness"
  slot, distinct from the primary element/weakness field, so callers can mark an object as additionally vulnerable
  to one element (e.g. bosses or objects with a hidden secondary weakness). Returns via mov pc, lr; the register
  contract notes r1 is clobbered (it holds the collision data pointer) and lr is an explicit input, so callers must
  treat lr as live.
