name: ai_setRandomPanelTarget
address: '0x08111650'
kind: function
status: probable
summary: Picks a random panel near the actor (alliance-filtered) and stores it, plus a random 0-3 value,
  into the actor's AI target fields.
interface: (r0 = actor/entity passed to panel picker) -> void; writes [r5+0x64]=GetRNG&3, [r5+0x65]=x,
  [r5+0x66]=y from sub_8015C48, only if a panel was found
details: Calls the random relative panel picker sub_8015C48 with r0 untouched, so r0 is the entity whose
  alliance filter picks candidate panels. If it returns nonzero (r0/r1 = decoded panel coordinates), the
  function stores r0 at r5+0x65 and r1 at r5+0x66 — the target panel x/y of the AI state block in r5.
  It then rolls GetRNG, masks &3, and stores the 0-3 result at r5+0x64, the field just below the coordinates
  (likely a step count or secondary random parameter). If the picker returns 0 (no valid panel), nothing
  is written and the previous target is kept. r5 is callee-saved and must be set up by the caller as the
  entity/AI struct.
