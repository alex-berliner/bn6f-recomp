name: battle_initAIChipQueueSlot
address: '0x0808FF30'
kind: function
status: probable
summary: Battle-side wrapper that initializes the AI chip-queue slot (0x58 bytes in EWRAM at 0x02011860)
  via the AI-chip-queue helper, with r0/r1/r2=0 selecting slot 0 and returning 0.
interface: () -> r0 = 0; no flags meaningful
details: 'The routine is a thin battle-initialization wrapper: it first branches to the 0x080468BA entry
  of the AI-chip-queue helper (which shares its code with the 0x080468C6 entry point, only 12 bytes apart),
  then calls battleObject_initAIChipQueueSlot_80468C6 with r0=r1=r2=0, which per the known summary initializes
  the 0x58-byte AI chip-queue slot in EWRAM at 0x02011860 for actor slot 0. It always returns 0 in r0,
  suggesting it is used as a success-returning init/callback. Its execution on the beastsp route is consistent
  with running during battle start when AI actor state is (re)initialized.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battleObject_initAIChipQueueSlot_80468C6 with r0=r1=r2=0 matches the callee''s known role
    of initializing the 0x58-byte AI chip-queue slot at 0x02011860 for a given actor index (0 here); the
    two bl targets 0x080468BA and 0x080468C6 are 12 bytes apart, so the first call enters the same helper
    at an earlier entry point before the slot init; mov r0, #0 before pop {pc} shows it always returns
    0, typical of an init/callback returning success; executed on the beastsp recorded route, consistent
    with battle startup where AI queue state is cleared'
  refs:
