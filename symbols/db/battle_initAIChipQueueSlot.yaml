  reproduce: python3 tools/asmcat.py 0x0808FF30
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code indeed initializes the AI chip-queue slot with zeroed parameters and returns 0, matching
    the proposal. However, calling it ''battle_resetAIChipQueueSlot0'' is misleading: it resets the slot
    via the init helper (not a reset), and the slot index is passed in r0 (r0=#0 here, but the function
    itself is parameterized). A better name like ''init_battleAIChipQueueSlot'' or ''battle_initAIChipQueueSlot_808FF30''
    reflects that this is a parameterized init wrapper. The summary also overclaims ''slot 0'' when slot
    index is just the current argument (0 in this caller).; run wf investigate investigate-20261018-200615;
