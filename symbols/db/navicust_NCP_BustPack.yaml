name: navicust_NCP_BustPack
address: '0x0813CA00'
kind: function
status: confirmed
summary: 'Bust Pack NaviCust Program: raises the PET''s ATK/DEF/SPD stat caps by 3, clamped at 4.'
interface: void navicust_NCP_BustPack(void); /* PET index 0; clobbers r0-r3, flags, lr; reads r10 */
details: '"Bust Pack" is a NaviCust Program that temporarily boosts the three combat-stat caps

  (slots 1=ATK, 2=DEF, 3=SPD) by +3.  For each slot it calls GetCurPETNaviStatsByte

  (PET index 0, slot in r1) to read the current cap, adds 3, clamps the result to a

  maximum of 4, then writes it back via SetCurPETNaviStatsByte.  Because the clamp is

  4 and the increment is 3, any cap already ≥1 becomes exactly 4 (the hard maximum).

  A slot with a raw value of 0 also becomes 3.  The routine touches only the current

  PET (index 0) and does not return a value.

  '
