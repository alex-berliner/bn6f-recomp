open_questions:
- The exact semantic meaning of the two summed bytes (count-of-subentries vs column-width
- vs row-arity) is inferred from the helper's name and the constant sum, not from a clear
- field label. Settling it requires seeing a wider table-reader that consumes both fields.
- Whether r0 truly means "row-size - 2" in bytes or just "header.r0 + header.r1" is not
- provable from this function alone; the _2 implication comes from external callers.
