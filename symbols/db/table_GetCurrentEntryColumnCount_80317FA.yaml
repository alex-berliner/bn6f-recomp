name: table_GetCurrentEntryColumnCount_80317FA
address: '0x080317FA'
kind: function
previous_names:
- sub_80317FA
status: probable
summary: Reads the current table entry's column count (r0+r1) and returns total row size minus 2
interface: '() -> r0 = header.r0 + header.r1 ; side effects: calls table_GetCurrentEntryHeader_8031760'
details: "Pushes lr (Tail call), sets r0=1 and calls table_GetCurrentEntryHeader_8031760 which reads\n\
  \  the header bytes of the current entry of the table at dword_2011A20 (returning r0=byte@+0,\n  r1=byte@+1,\
  \ r2=byte@+2 when requested). With kind=1 the helper returns the column-count\n  pair from the entry\
  \ header, then add r0,r0,r1 sums the two header bytes and the result is\n  returned in r0 with r1=0.\
  \ The captured-call exits all show r0=4 (e.g. 0x03 + 0x01 = 0x04\n  or 0x02 + 0x02 = 0x04) which matches\
  \ \"row size minus the 2 implicit header bytes of the\n  table entry\" - i.e. total size-of-row in bytes\
  \ excluding the (count,?,?) prefix. The\n  captured callsite r1=0x847d (a packed value: 0x84 = 132,\
  \ 0x7D = 125; e.g. could be the row\n  layout (count=4, type=2, ?=...) of the table that's being walked)\
  \ confirms this is the\n  header-based row/column size for the currently indexed table entry.\n"
