name: battle_phaseTargetedAttackSetup
address: '0x080EA0A0'
kind: function
status: probable
summary: 'Battle-object phase handler: computes a target panel column (from facing or alliance), invokes
  an attack/spawn helper with the object''s element and params, then waits 20 frames before advancing
  to phase 8.'
interface: (r5 = battle object) -> void; sets oBattleObject_Timer=20, PhaseInitialized=4 on first run,
  then CurPhaseAndPhaseInitialized=8 when timer expires
details: 'Standard one-shot phase body guarded by PhaseInitialized. On first entry it picks a target x:
  if Param1(byte)==0 it uses object_getFrontDirection()*2 + PanelX (the panel two ahead in facing direction),
  otherwise x = 5 - 3*Alliance (column 5 for ally side, 2 for enemy side). It then calls sub_80DE960 with
  r0=x, r1=0, r2=Element, r3=0, r4=(Param1<<8)+1, r6=DamageAndStaminaDamageCounterDisabler — r4 looks
  like a packed type/sub-id argument, so sub_80DE960 likely spawns a panel-anchored attack or effect.
  It then arms a 20-frame timer, marks itself initialized (phase 4), and each frame decrements the timer,
  jumping the object to phase 8 (usually the idle/recovery phase) once it hits zero.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'cmp r4,#0 + bl object_getFrontDirection + add r0,r0/add r0,PanelX vs 5-3*Alliance: two-panel
    ahead vs side-dependent fixed column targeting; bl sub_80DE960 with r0=x, r2=oBattleObject_Element,
    r4=(Param1<<8)+1, r6=DamageAndStaminaDamageCounterDisabler: passes panel x and object attack data
    to the effect helper; mov r0,#0x14; strh Timer / mov r0,#4; strb PhaseInitialized: arms a 20-frame
    timer and marks the phase as started; sub Timer,#1; bgt; mov r0,#8; strh CurPhaseAndPhaseInitialized:
    timed transition to phase 8; callee object_getFrontDirection is the known facing-direction multiplier
    for battle objects, confirming panel-coordinate arithmetic'
