  date: '2026-10-14'
  detail: '- `ldrb r0, [r7,#oAIAttackVars_Unk_01]; tst r0, r0; bne loc_80ED7C0` is the init-flag guard
    - The init branch stores `4` into oAIAttackVars_Unk_01 after scanFrontPanels_800FAF6: `mov r0, #4;
    strb r0, [r7,#oAIAttackVars_Unk_01]` - `ldrh r0, [r7,#oAIAttackVars_Unk_10]; sub r0, #1; strh r0,
    [r7,#oAIAttackVars_Unk_10]; bge loc_80ED7D6` decrements the free-panel budget - On underflow the function
    zeros RelatedObject1Ptr and AIData->Unk_68 and calls object_exitAttackState, terminating the walk
    - `bl playerObject_checkDirectionButtons_800FA54` then `bl battleObject_tryGetNextPanelInFacingDirection_800F964`
    implement per-step walking toward an enemy - The final block calls `battle_getCrossNaviTableByte_8010332`,
    `battle_GetAllianceFactionFromBattleObject_80103A8`, then `aiAttack_initVarsAndStart_80116AE` to launch
    the attack'
