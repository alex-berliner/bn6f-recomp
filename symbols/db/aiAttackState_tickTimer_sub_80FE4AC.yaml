name: aiAttackState_tickTimer_sub_80FE4AC
address: '0x080FE4AC'
kind: function
status: confirmed
summary: Ticks an AI attack-state countdown timer on r7 AI attack vars and exits the attack state via
  object_exitAttackState when the timer reaches zero.
interface: void sub_80FE4AC(BattleObject* r5, void* r6, AIAttackVars* r7, return_addr lr) -> r1 (unknown
  output)
details: 'Operates on a "BattleObject" (r5) plus AI attack-vars structure(s) in r6/r7 (the exact split
  between r6 and r7 is not

  fully clear from this function alone - r7 holds the AI attack vars, r6 is passed in but not touched
  here).

  Reads the byte flag oAIAttackVars_Unk_01 at r7+0x01. While it is zero (first call / not yet initialized),
  performs one-time

  setup: writes 4 to oAIAttackVars_Unk_01, clears the BattleObject''s current animation index

  oBattleObject_CurAnim to 0, and copies the halfword oAIAttackVars_Unk_18 into the countdown timer

  oAIAttackVars_Unk_10. Once initialized, decrements oAIAttackVars_Unk_10 by 1 each call (subtract then
  store as u16);

  when the result is 0 or would underflow, calls object_exitAttackState and otherwise returns. Flags used
  as `bgt` on a

  signed comparison of the decremented timer, so the exit branch covers both "hit zero" and "wrapped past
  zero".

  Quirks: clobbers r6/r7 even though they are inputs; output r1 is just whatever falls out of object_exitAttackState

  on the exit path.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
