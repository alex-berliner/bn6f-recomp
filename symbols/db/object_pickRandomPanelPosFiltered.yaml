name: object_pickRandomPanelPosFiltered
address: '0x081078C2'
kind: function
status: probable
summary: Returns a random battle panel position (column in r0, row in r1) from columns 1-6, avoiding the
  requesting object's own column and row; falls back to the object's own position if no candidates.
interface: (r0/r5 = object, r2 = filter arg1, r3 = filter arg2) -> r0 = column (0-7), r1 = row; no flags
  used
details: Saves the object's fields 0x12 (column) and 0x13 (row), then loops columns 1..6, skipping the
  column equal to field 0x12. Each iteration calls object_getPanelsInColumnIgnoreRowFiltered (column,
  row=field 0x13, r2, r3) with an output pointer at sp+0x10+r6, and accumulates the returned count; entries
  appear to be packed bytes (column in low 3 bits, row in the high nibble). If at least one entry was
  collected, GetPositiveSignedRNG supplies a random value which is reduced modulo the count via SWI 6
  (Div, remainder in r1) to pick one entry, which is then unpacked into r0=column (low 3 bits) and r1=row
  (bits 4-7). If no panel qualified, it returns the object's own fields 0x12/0x13 instead. Note the loop
  reads the skip field from r5, which is never set inside this function, so the caller must alias the
  object in r5 (or this is a mis-disassembly of [r0,#0x12]).
