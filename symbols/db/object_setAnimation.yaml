name: object_setAnimation
address: '0x0800F2B6'
kind: function
status: confirmed
summary: Starts an animation on a battle object by storing the animation ID and marking it as pending with 0xFF.
interface: (u32 anim, r5 battleObject, ...) -> u32 (returns 0xFF); also returns r1 = battleObject->NameID
details: 'Takes an animation ID in r0 and a battle object pointer in r5. First loads the object''s

  NameID (oBattleObject_NameID halfword) into r1, then calls nullsub_3, which is an empty

  function (a debug/patch hook that does nothing). Stores the animation ID byte into

  oBattleObject_CurAnim and writes 0xFF into oBattleObject_CurAnimCopy. The C version

  suggests the animation task watches CurAnimCopy: 0xFF means the queued animation should

  be picked up on the next animation update, effectively "requesting" the animation to

  start playing. Returns 0xFF in r0 and the NameID in r1 as side effects of the hook call

  convention. CurAnimCopy being the "queued" slot (with 0xFF as the trigger value) is

  inferred from the C comment; the actual consumer is elsewhere.

  '
