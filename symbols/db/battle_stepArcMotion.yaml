- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_810E54E: ldr/str pairs on oBattleObject_X/oBattleObject_XVelocity and oBattleObject_Z/oBattleObject_ZVelocity
    perform the integration; add r1, r1, r0 with dword_810E7A4 = 0xffff8000 decays ZVelocity every frame
    (gravity); sub r0, #1 / bne on oAIAttackVars_StepTimer gates the teardown path; mov r0, #CUR_STATE_DESTROY;
    str into oBattleObject_CurStateActionPhaseAndPhaseInitialized destroys the object; bic r0, #2 on oObjectHeader_Flags
    clears an active/visible-style flag at expiry'
