name: battle_stepArcMotion
address: '0x0810E54E'
kind: function
status: probable
summary: 'Per-frame physics step for an AI-launched battle object that flies in an arc: moves X/Z by their
  velocities, applies gravity to Z velocity, and destroys the object when its step timer expires.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = 0 (CUR_STATE_DESTROY) when timer ends; flags
  updated on object
details: Adds oBattleObject_XVelocity to X and oBattleObject_ZVelocity to Z (fixed-point positions), then
  subtracts 0x8000 (dword_810E7A4) from ZVelocity each call, so Z velocity decays like gravity on an arc/toss.
  Decrements oAIAttackVars_StepTimer in r7; when it reaches zero it clears bit 1 (0x2) of oObjectHeader_Flags
  and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized, ending the object.
  r5 is the object pointer and r7 the per-attack variable block, consistent with an AI attack-state handler.
