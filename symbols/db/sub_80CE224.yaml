summary: Spawns battle object 0x4E at a given panel, copying the owner's alliance and back-pointer to it
interface: 'void sub_80CE224(u8 panelX /* r0 */, u8 panelY /* r1 */, /* r2 */, /* r3 */, void* owner /* r5 */, int
  counter /* r6 */) /* flags: nz c v clobbered */'
details: "Allocates a new battle object via object_spawnType3 with type id 0x4E, then initialises it as\na panel-anchored\
  \ sub-object owned by the caller-supplied \"owner\" object (r5):\n  - PanelX, PanelY copied from r0/r1 (stb into\
  \ oBattleObject_PanelX / oBattleObject_PanelY).\n  - A 32-bit counter/disabler value from r6 stored at oBattleObject_DamageAndStaminaDamageCounterDisabler\n\
  \    (field name suggests it is the shared damage / stamina-damage counter slot used by status-like objects).\n\
  \  - Alliance byte copied from the owner (oBattleObject_Alliance) so the new object fights for the\n    same side.\n\
  \  - Back-pointer to owner stored at oBattleObject_RelatedObject1Ptr.\n  - Flag 0x10 ORed into oObjectHeader_Flags\
  \ on the new object.\nQuirks:\n  - The function's prologue spills {r0,r1,r5} onto the stack, calls object_spawnType3\
  \ (which\n    returns the spawned pointer in r5), then restores the original owner pointer into r5 from\n    the\
  \ spill before returning. This preserves the caller's r5 register contract, which is why\n    \"owner\" survives\
  \ the call despite r5 being clobbered by the spawner.\n  - The spawn result is tested with BEQ to a tail-return\
  \ (\"locret_80CE248\"), so a failed\n    allocation is simply a no-op (no state written, no error path).\n  -\
  \ r2/r3 are caller-saved parameters that are accepted by the contract but not used inside\n    the function body\
  \ as visible in the snippet.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
