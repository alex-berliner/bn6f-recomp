name: battle_chargeShotSetup
address: '0x0802ECFE'
kind: function
status: probable
summary: 'Sets up the Navi''s charge shot attack: rolls a special charge-shot pick, otherwise initializes
  default charge-shot state and fires attack 0x11.'
interface: (r0 = battle object, r6 = attack state struct) -> r0 = 0; calls sub_802ED68 on the special-pick
  path, else object_setAttack0(0x11)
details: First calls the stat-gated weighted pick (sub_8013D5E, reading NaviStats bytes 0x14/0x15); if
  it returns nonzero this delegates to sub_802ED68 (a special/alternate charge shot) and returns. On the
  default path it zeroes the state struct at r6 (bytes 2-5, halfwords 6 and 0xA, word 0xC), then reads
  NaviStats byte 0x29 for the object's side and uses it to index byte_802ED5C, storing the value (3) as
  a halfword at r6+8 (likely charge-shot power/time). It reads byte 0x29 again and indexes byte_802ED50
  (2), passing that to sub_802EEA2 (likely spawning/configuring the projectile), then triggers attack
  id 0x11 via object_setAttack0 and returns 0. Both lookup tables are uniform (all 2s and all 3s) across
  the 12 entries, so byte 0x29 currently only needs to be in range 0-11.
