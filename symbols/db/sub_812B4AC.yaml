status: confirmed
summary: Opens the battle submenu's two text windows (IDs 0x10 and 0x11) via the window-enqueue routine and returns.
interface: void sub_812B4AC(void); // preserves r4-r7; clobbers r0-r3, lr and flags; callers pass/inspect r10 per
  the contract but it is not used directly here
details: 'The function is a tiny wrapper that makes two calls to the window-enqueue helper call_sub_3005EBA (sub_3005EBA),
  each time passing six arguments in r0-r5: first (0x10, 4, 2, 0, 0xA, 2) and then (0x11, 6, 2, 0, 0xA, 2). Interpreting
  the pattern as (windowId, width, height, ?, column, row), this queues submenu window 0x10 sized 4x2 and window
  0x11 sized 6x2, both positioned at column 0x0A on row 2 — i.e. the two stacked boxes of the in-battle submenu
  (the chip/folder menu area). It then restores r4-r7 and returns immediately; it does not draw content or wait
  for input. Note the disassembly listing also contains a second routine after the first pop {r4-r7,pc}: it loads
  sSubmenu, calls battle_initScene_8129248 and sub_8132614, stores 0x10 into sSubmenu+0x03 and 0 into sSubmenu+0x1E,
  zero-fills 0x10 bytes at unk_20251A0, calls sub_812AFC8, and finally sub_80465A0 with byte_8129150 (likely text/script
  setup). That block appears to be a separate (mis-labeled) submenu-scene init function rather than part of this
  wrapper; the readable-C verification covers only the window-opening part.'
