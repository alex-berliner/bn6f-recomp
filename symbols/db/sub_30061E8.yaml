status: confirmed
summary: Project an object's world position to the screen (through the camera mode) and mark which pieces of its
  frame are on screen.
interface: '(r0 = position, r5 = object; r10 = toolkit) -> sprite struct fields: screen X/Y, visibility flags (+0x03),
  on-screen piece mask (+0x28); promises r5, r10 only'
details: 'Camera mode byte_20098A8[1]: 0 = isometric projection (sub_300631C), 4 = side view (sub_300638C). Objects
  with bit 3 of their flags are culled by position only.'
