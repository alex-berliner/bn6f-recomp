name: chatbox_waitStepUpdateEntities
address: '0x0803A186'
kind: function
status: probable
summary: 'One frame of a cutscene wait step: test chatbox event flag 0x80, feed a done/not-done flag plus
  an indexed id to sub_803BBA4, then tick all entity updates and sprite rendering so the world keeps animating
  while waiting.'
interface: (r5 = record whose byte at +0x0e is an index; r0-r4 scratch) -> void; sets r4 = 1 when flag
  0x80 is clear, 0 when set, passes it as r2 to sub_803BBA4
details: 'Reads the chatbox/cutscene event flag word via chatbox_mask_eFlags2009F38 with mask 0x80 and
  inverts it into r4 (1 while the flag is still clear). It then calls sub_803BBA4 with r0=4, r1=0x21 +
  0x20*[r5+0xe] (a 0x20-strided slot id, index taken from the caller''s record at +0x0e) and r2 = the
  flag-inverted wait state. Afterwards it runs the full per-frame field update: entity_runAllUpdateHandlers
  over the 15-record entity array and battle_updateEStructSprites for the active records'' OAM/palette/tile
  refresh. This is the classic ''keep the field alive during a wait'' step of an event/scene scheduler;
  the actual wait/branch on the flag presumably happens in the callers (0x803A104, 0x803A2CC, 0x803A334).'
