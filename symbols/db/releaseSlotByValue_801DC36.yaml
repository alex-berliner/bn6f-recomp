name: releaseSlotByValue_801DC36
address: '0x0801DC36'
kind: function
status: confirmed
summary: Searches a six-entry slot table for the first occupied entry matching a given value and frees (zeroes)
  that slot, returning 0 on success or 1 if no match was found.
interface: int releaseSlotByValue(u32 value /* r5 */); /* also called with r4, r6, r7, lr preserved; r0 = 0 if a
  slot was cleared, 1 if none matched; c/v set by the last comparison (value match or final loop decrement); r2
  = last flag byte read, r3 = slots left unexamined */
details: 'Walks the fixed table at dword_20352E0 (0x20352E0), which holds six 8-byte slots: byte 0 is an "in use"
  flag and bytes 4-7 a u32 payload. It skips empty slots, and for the first occupied slot whose u32 value equals
  the argument it clears both the flag and the payload (two STR #0 writes), returning 0. If the scan exhausts all
  six slots without a match it returns 1 and leaves the table untouched. The loop counts down from 6, so r2/r3 and
  the carry/overflow flags on exit carry the state of the last comparison performed (the value comparison on a hit,
  the final decrement on a miss). The function also takes r4/r6/r7 as call-preserved registers per the lifter''s
  caller analysis, but only r4 (the table pointer) is actually used.'
