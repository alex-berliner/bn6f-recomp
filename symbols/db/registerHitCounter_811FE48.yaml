name: registerHitCounter_811FE48
address: '0x0811FE48'
kind: function
status: confirmed
summary: Records or increments a hit tally for a 30-slot id->count array, sourcing the new id from word "unk_20343E0"
  +0x1C.
interface: "u16 Next(sub_811FE48)(void *counterArray /*r0*/, void *unk_20343E0 /*r5*/, ? /*lr*/);\n  /* clobbers\
  \ r0,r1,r3 + NZCV; preserves r4-r7; r3 returns the byte offset\n     of the count slot that was written (offset+2),\
  \ or 0x78 if no empty/matching\n     slot was found within 30 entries. */\n"
details: "Scans a 30-entry table (entries are 4 bytes: u16 id at +0, u16 count at +2;\nscan limit 0x78 = 30 * 4).\
  \ For each entry:\n  * if id == 0 (empty slot) -> store the incoming id and set count = 1;\n  * if id matches\
  \ the incoming id -> increment its count;\n  * else advance to the next entry.\nThe id to register is read from\
  \ \"unk_20343E0\" +0x1C (the .word unk_20343E0\nin the pool points at this source buffer, dereferenced as r5+0x1C).\n\
  Returns r3 = byte offset of the count field that was last touched (always\noffset+2 for the hit case), or 0x78\
  \ when the table is exhausted with no match\nand no empty slot. Likely backs a battle damage/element tally or\
  \ contact/\ncombo-hit counter on a battle entity, indexed by some attack id (e.g.\nelement or hit source id stored\
  \ at unk_20343E0 +0x1C).\n"
