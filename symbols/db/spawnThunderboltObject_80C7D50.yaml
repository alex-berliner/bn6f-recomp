name: spawnThunderboltObject_80C7D50
address: '0x080C7D50'
kind: function
status: confirmed
summary: Spawns a battle object of type 0x1C (a thunderbolt effect) on a panel and initializes its position, element,
  damage and alliance from the caller's data.
interface: u32 spawnThunderboltObject(u32 panelX, u32 panelY, u32 element, u32 spawnArg3, u32 spawnArg4, BattleObject*
  sourceObject, u32 damage); returns r0 = new object pointer (0 if the object pool was full); flags NZ from the
  pointer/flag value, C/V always clear
details: "Adapter around object_spawnType3: saves r0-r2/r5, calls object_spawnType3 with r0 = 0x1C\n(object type)\
  \ and the caller's r1-r4 forwarded unchanged, which returns the freshly spawned\nobject in r5 (0 when the pool\
  \ is full). The saved caller registers come back shifted one slot\n(pop {r1-r3,r5}), so entry r0 (panel X), r1\
  \ (panel Y) and r2 (element) land in r1-r3. On a\nsuccessful spawn the routine writes:\n  - oBattleObject_PanelX\
  \ / oBattleObject_PanelY (bytes) from entry r0/r1\n  - oBattleObject_Element (byte) from entry r2\n  - oBattleObject_DamageAndStaminaDamageCounterDisabler\
  \ (word) from entry r6\n  - oBattleObject_AllianceAndDirectionFlip (halfword) copied from the r5 source object,\
  \ so the\n    thunderbolt inherits the owner's team and flip state\n  - sets bit 0x10 in the new object's oObjectHeader_Flags\n\
  If the spawn failed it returns immediately after restoring r5, touching nothing. Exit r1-r3\nare scratch on the\
  \ success path (0x10, the ORRed flags byte, the alliance value); r4/r6/r7\npass through the callee unchanged.\n"
