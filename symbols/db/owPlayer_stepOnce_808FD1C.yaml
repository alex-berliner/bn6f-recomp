name: owPlayer_stepOnce_808FD1C
address: '0x0808FD1C'
kind: function
status: confirmed
summary: Advance the overworld player one tile-step in the facing direction, decrementing a per-move countdown;
  returns whether a step was taken.
interface: owPlayer_stepOnce(r10 /*player ctx*/ , lr) -> nz /*1 stepped, 0 stopped*/ , r2 /*copy flag
  0x00400000 on move*/, r3/r7 /*from owPlayer_copyCoords callee*/ ; clobbers r0 r1 c v lr; preserves r4
  r5 r7
details: Loads a global state-block pointer (via off_808F5D4). Decrements the byte at offset 0x17 (remaining-move
  countdown); if it hits zero the player has finished its multi-step command and the function returns
  0 (Z set). Otherwise it reads the player's current (x,y) from ReadOWPlayerObjectCoords, applies a fixed
  displacement of 8<<16 (one tile in sub-pixel coords) in the direction byte at offset 0x18 (1=+x/east,
  3=+y/south, 5=-x/west, default=-y/north), then commits the new position via owPlayer_copyCoordsToNextCoords…_809e188
  with r2=0x00400000. Returns 1 (NZ set). r10 is the implicit overworld-player context register passed
  by callers. The caller loop presumably invokes this once per frame while the countdown is nonzero.
