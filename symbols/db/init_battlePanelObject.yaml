    object''s sprite; ldrb r0,[r5,#oBattleObject_Element] ... ldrb r0,[r7,r0] with byte_80CF8A8 = 0,1,2,3,4:
    element-indexed palette table; bl object_setCoordinatesFromPanels; str 0x10<<16 -> oBattleObject_Z;
    XVelocity *= object_getFrontDirection(): panel-placed, forward-moving object; object_createCollisionData
    + object_setupCollisionData(7,5,Param1) + region 4, then CUR_STATE_UPDATE and sub_80CF8B0: collision
    setup and state transition'
