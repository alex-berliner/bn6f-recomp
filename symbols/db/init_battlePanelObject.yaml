name: init_battlePanelObject
address: '0x080CF810'
kind: function
status: probable
summary: 'Init entry for a battle panel object: bails out via object_freeMemory if the battle is over,
  otherwise loads sprite 0x80/0xC/0x14, picks palette 0xB or byte_80CF8A8[Element & 0xF], sets position/Z/timer,
  flips XVelocity by front direction, builds 7x5 collision from Param1 with region 4, sets state to CUR_STATE_UPDATE,
  and tail-calls sub_80CF8B0.'
interface: (r5 = battle object header) -> r0 = destroyed? (1 if object freed because battle over); sets
  object's flags/anim/palette/position/velocity/collision
details: Early-outs by freeing the object via object_freeMemory if battle_isBattleOver says the battle
  has ended. Otherwise sets flag bit 3 in oObjectHeader_Flags, loads sprite resource (0x80, 0xC, 0x14),
  plays animation 0, and applies facing via object_getFlip/sprite_setFlip. Palette is 0xB unless oBattleObject_Param2
  is nonzero, in which case it is byte_80CF8A8[oBattleObject_Element & 0xF] = {0,1,2,3,4,...}, an element-to-palette
  lookup. Positions the object from panel coordinates (object_setCoordinatesFromPanels), sets Z = 0x10<<16
  (16), zeroes Timer, multiplies XVelocity by the front direction (so it travels forward from the owner's
  side), then creates collision data sized 7x5 from oBattleObject_Param1 with region 4 and runs the first
  presentCollisionData pass. Finally writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and tail-calls sub_80CF8B0 (the state's first update).
