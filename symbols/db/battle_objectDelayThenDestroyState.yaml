name: battle_objectDelayThenDestroyState
address: '0x080B91E8'
kind: function
status: probable
summary: battle object state handler that waits 4 frames with a set animation, then disables collision
  and destroys the object
interface: (r0 = unused/scratch, r5 = battle object ptr) -> void; sets CurPhase/Anim/Timer, then collision
  off and state = CUR_STATE_DESTROY
details: Reads oBattleObject_CurPhase; if 0, writes phase=4, oBattleObject_CurAnim=4, and oBattleObject_TimerAndTimer2=4
  (a 4-frame timer) and returns. Otherwise decrements oBattleObject_Timer; while positive it just returns.
  When the timer runs out it calls sub_8011044(2,1), clears oCollisionData_Enabled via oBattleObject_CollisionDataPtr,
  and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the object
  is torn down next frame.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: phase-0 branch sets CurPhase=4, CurAnim=4, timer=4 (startup of this state); timer countdown
    via oBattleObject_Timer with strh/bge loop (asm lines at loc_80B91FE); bl sub_8011044 with r0=2, r1=1
    fired exactly when the timer expires; clears oCollisionData_Enabled through oBattleObject_CollisionDataPtr
    before destroying; stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    as the final action
