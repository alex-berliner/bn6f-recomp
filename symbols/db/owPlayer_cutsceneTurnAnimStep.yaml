    SetOWPlayerFacingDirection then GetOWPlayerFacingDirection then table byte_8089958 -> owPlayer_setS200ace0_fixedAnimationSelect:
    player is turned and given animation 0x2E-0x31 per facing; bl camera_startCutsceneScript: the object
    is flagged as camera-active with a fixed camera script; ai_setAIDataUnk18(0x1E) + strb 0x48,[r5]:
    sets a 30-frame timer and a 0x48 step/state byte on r5'
