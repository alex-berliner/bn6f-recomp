name: owPlayer_cutsceneTurnAnimStep
address: '0x0808991C'
kind: function
status: probable
summary: Cutscene/object step that, after a short delay, makes the overworld player turn toward a fixed
  direction and play a fixed animation while a cutscene camera script runs.
interface: (r5 = object/AIData struct) -> r0 = 1 (step continues/finished); no meaningful flags
details: If event-flag bit 0x80 of eFlags2009F38 is set the step does nothing and returns 1. Otherwise
  it waits on a frame timer (the AIData+0x18 ChipLockoutTimer decremented by battle_tickChipLockout) and,
  once expired, calls sub_8142B58, force-sets the OW player's facing direction, re-reads it, and uses
  it to index byte_8089958 (directions 1,2,4,5 map to animation ids 0x2E,0x2F,0x30,0x31; 0 and 3 map to
  0xFF) to select a fixed player animation. It then starts a cutscene camera script on the object, reloads
  the wait timer with 0x1E (30 frames), and writes 0x48 into byte [r5], likely the next step/state id.
