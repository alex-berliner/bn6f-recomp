open_questions:
- The exact meaning of [r5+0x20] (treated here as a packed cursor coord, but lives in AIData's TotalDamageTaken
  slot for an AI struct — though r5 in this project is documented as a BattleObject, not the AIData; the project
  contract says r5 is an in-register pointer, not clear which struct).
- The role of byte_801C6E8 (three bytes 0x6A,0x01,0x69,0x01,0x8F,0x00) referenced via off_801C6E4 — appears unused
  in this function body, possibly a forward reference to a sibling routine.
- Whether call_sub_3005EBA here is a BG-map tile-setter or a generic tile-loader; the constants 0x9222/0x922A suggest
  VRAM tile ids in the 0x9000 region.
