name: object_spawnElemWithParent
address: '0x080D01C8'
kind: function
status: probable
summary: Spawns a battle object of type 0x5D with given panelX/panelY/element/damage/extraVars, copying
  AllianceAndDirectionFlip from a parent and setting ExtraVars[0] to self and ExtraVars[1] to the parent
  pointer.
interface: (r0 = parent/related battle object ptr, r1 = panelX, r2 = panelY, r3 = element, stack/regs
  r5-r7 = relatedObject ptr, damage, extraVars ptr) -> r0 = new object ptr or 0 on failure; flags set
  via object header flag 0x10
details: 'The routine saves its incoming arguments, calls object_spawnType3 with type 0x5D, and if the
  spawn succeeds writes the caller''s arguments into the new battle object: PanelX, PanelY, Element, RelatedObject1Ptr,
  DamageAndStaminaDamageCounterDisabler, and ExtraVars (whose first word is set to the new object itself,
  and whose second word receives a saved value). It then copies AllianceAndDirectionFlip from the parent
  object and sets bit 0x10 in the new object''s oObjectHeader_Flags before returning the object pointer.
  On spawn failure it returns without touching anything, leaving r0 = 0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#0x5d; bl object_spawnType3 — spawns a type-93 battle object; strb r1/r2/r3 to oBattleObject_PanelX/PanelY/Element
    — argument fields stored on the new object; str r5,[RelatedObject1Ptr]; ldrh r3,[r5,#AllianceAndDirectionFlip];
    strh r3,[r0,...] — copies alliance/flip from the parent object; str r0,[r7] and str r3,[r0,#ExtraVars+4]
    — wires the new object into the caller's ExtraVars structure; ldrb r2,[oObjectHeader_Flags]; orr 0x10;
    strb — marks the new object's header flags
  refs:
  - bn6f/asm/asm31.s:52118
  - 0x080FF680 sub_80FF680
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080D01C8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is broadly right, but the proposed interface signature is wrong: the saved third word
    (popped into r3 and stored at ExtraVars+4) is the original r0 (parent ptr), pushed ahead of the rest
    at ''push {r3}'' / ''push {r0-r2,r5}'', so r0 is parent, r1 panelX, r2 panelY, r3 element, r5 relatedObj,
    r6 damage, r7 extraVars — not the rearranged stack/regs the proposal gives. The proposal also miscalls
    oObjectHeader_Flags as ''flag 0x10'' set on the spawn, but the code sets bit 0x10 after copying fields,
    which is fine but the summary phrasing ''flags set via object header flag 0x10'' is accurate. Name
    is okay but ''object_spawnType93Linked'' with ''Linked'' is vague; the routine doesn''t link to ExtraVars
    but rather self-references ExtraVars[0].; run wf investigate investigate-20261018-203615; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
