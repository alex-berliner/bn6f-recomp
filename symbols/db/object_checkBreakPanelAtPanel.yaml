name: object_checkBreakPanelAtPanel
address: '0x080BB228'
kind: function
status: probable
summary: If the panel at (col,row) has the break/hole flag, invokes sub_80C8DE0 (event hook).
interface: '(r0 = col, r1 = row, r2 = ?, r3 = ?) -> no return used; flags tst with #0x10'
details: Preserves r0-r3 around the call to object_getPanelParameters, which returns the status word of
  the panel at the given grid coordinates. Tests bit 0x10 of that status word (the hole/break panel bit
  on the panel status word). If the bit is set, calls sub_80C8DE0; otherwise returns immediately. The
  3rd/4th arguments passed by the caller are preserved but unused by this function. Used in pairs to check
  the four panels around an object's current tile when facing a direction.
