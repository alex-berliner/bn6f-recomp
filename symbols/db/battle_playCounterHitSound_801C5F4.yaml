name: battle_playCounterHitSound_801C5F4
address: '0x0801C5F4'
kind: function
status: confirmed
summary: Plays an escalating hit-combo sound when the consecutive-hit counter crosses into a higher threshold during
  a counter-hit sequence.
interface: void battle_playCounterHitSound_801C5F4(u32 r5_battleObj, u32 r10_toolkit); clobbers r0 r1 r2 flags;
  preserves r3 r4 r5 r6 r7 r10
details: 'Reads the toolkit''s main jump-table index pointer; if the index equals 0x50 (counter-hit phase active)
  the function returns immediately, meaning it is skipped while the counter animation is playing.

  Otherwise it saves the current hit-sfx level field (battleObj+0x18) into the previous-level field (battleObj+0x19),
  then maps the 16-bit hit counter at battleObj+0x20 to a new level 0–3 using three thresholds (0x1500, 0x2A00,
  0x4000).

  It calls battle_testFlag0x40_800A8F8 to confirm the "active counter" flag is set (returns 1); if not, it returns.

  If the newly computed level is strictly greater than the saved previous level, it indexes a u16 sound-ID table
  at 0x0801C6E8 with (level-1)*2 and calls PlaySoundEffect with that ID and the level value.

  The sound is therefore triggered only on level *upgrades*, producing a pitch/volume escalation as the hit combo
  grows.

  '
