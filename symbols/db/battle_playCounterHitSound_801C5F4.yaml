open_questions:
- What 0x50 means as a main-jumptable value, and the exact semantics of `AIData+0x20` here (Anger vs TotalDamageTaken;
  the project's struct currently lists 0x34 as Anger and 0x20 as TotalDamageTaken; the code uses 0x20
  as a u16 with absolute thresholds better fitting a battle-phase timer). Settling it requires matching
  callers to confirm what kinds of AIData this routine is installed on.
