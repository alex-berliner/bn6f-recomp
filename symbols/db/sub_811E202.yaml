open_questions:
- What the four cleared bits in `sprite->Unk_2c` actually represent (likely palette/index-mask bits tied to beast-mode
  forms/spouts, but no struct field is officially named).
- Which two AIData bytes the helper at 0x081418e4 returns — given the divmod-by-10 pattern, plausibly `AIData.Version_16`
  / `AIData.Version_17` (offset 0x16/0x17 in the AIData struct), but unconfirmed by direct read at this site.
- Whether this fires only on beast-out / cross-change init, or in normal Navi sprite setup too — snapshots cover
  only beast-sp paths.
