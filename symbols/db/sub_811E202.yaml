name: sub_811E202
address: '0x0811E202'
kind: function
previous_names: []
status: hypothesis
summary: Clears four index-derived bits in BattleObject sprite field 0x2c using a 10-bit-packed version value, then
  writes the masked constant 0x1FFFFFF8 to sprite field 0x2c.
interface: '(no explicit args read from registers by the function; r5 carries the AIDataPtr-like state used by callees;
  side effects: writes the current sprite''s 0x2c field). No r0 value is returned (post-call r0 = 0x0dffbf78 is
  just a sprite base pointer left by sprite_setUnk0x2c''s seed).'
details: "Called by sub_811E1D4 in the Beast Out / Cross Change / MegaChip context (caller lives at 0x0811e1d4 and\
  \ the snapshots are tagged `snap_beastsp_*`).\n\n  Steps:\n  1. bl battle_getAIDataVersionFields_81418E4, which\
  \ returns two u32s (r0, r1) that are the AI version field pair (related to AIData.Version_16 / AIData.Version_17,\
  \ sizes 0x1,0x1 packed).\n  2. Loads the four-bit constant 0x1FFFFFF8 into r7 (mask).\n  3. svc 6 (CPUReset/SoundBias\
  \ or, more likely, the `SVC 6 = Random` (note: svc 6 on GBA is actually `Sqrt`; here both are used as svc 6 with\
  \ r1=0xa — this is `SVC 0x0A = Div`/`Mod` semantics: returns q in r0, r in r1 from numerator r0). The pattern\
  \ `r0 in, r1=#0xa -> r0=q, r1=r` is the standard GBA div helper.\n     - First svc 6: `r0 = r4 (some AIData field)`,\
  \ `r1 = 0xa`; result: r0 = quot, r1 = rem. Builds a mask `1 << (0x1c - quot)` and clears the corresponding bit\
  \ in r7, then a similar `1 << (0x19 - rem)` bit clear in r7.\n     - Second svc 6 with r0 = r7_partial, r1 = 0xa:\
  \ produces `1 << (0xf - quot)` and `1 << (0xc - rem)` clears.\n  4. Calls sprite_setUnk0x2c (at 0x08002fa6) with\
  \ r0 = the fully cleared mask `0x1FFFFFF8` (less the four cleared bits depending on the AI version pair). This\
  \ sets `sprite->Unk_2c` (ObjectSprite byte index 0x2c) on whatever object r5 targets (sprite setUnk0x2c derives\
  \ the sprite base from the object's TypeAndSpriteOffset nibble).\n  5. tail-call returns `pop {r4-r7,pc}`.\n\n\
  \  Net effect: write a 0x1FFFFFF8-style mask into the sprite's 0x2c field with four bits cleared based on the\
  \ version pair returned by `battle_getAIDataVersionFields_81418E4`. Mostly inferred; the precise two field names,\
  \ bit positions, and whether this is \"beast out\" specifically vs. some other beast-mode toggle remain guessable\
  \ but not confirmed.\n\n  Position in object flow: target the sprite associated with the battle object pointed\
  \ by the caller-supplied r5; the AI version fields drive the cleared bits. The function is short and tightly coupled\
  \ to `sprite_setUnk0x2c` and the version-getter.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battle_getAIDataVersionFields_81418E4` at 0x0811E210 fetches two u32s (r0,r1) used as a divmod
    pair (`mov r1,#0xa; svc 6`). - `ldr r7, dword_811E240 // =0x1ffffff8` is the constant mask seeded before the
    four bit-clears. - Two consecutive svc 6 calls with r1=0xa implement a div-by-10 on r0 (and a re-div on the
    post-clear r7) — typical GBA Thumb div helper invocation; the four `bic r7, r2` instructions each clear one
    bit at `1 << (0x1c - q)`, `1 << (0x19 - r1)`, `1 << (0xf - q)`, `1 << (0xc - r1)`. - `bl sprite_setUnk0x2c`
    consumes r0 = the cleared mask, storing 32 bits into sprite->Unk_2c per the callee''s known behaviour. - Snapshot
    files tagged `snap_beastsp_*` strongly imply this is part of the Beast-Out / beast-mode sprite setup; the function
    lives right after `sub_811E1D4` (the next-higher beast-related routine). - No r0 is set by the function before
    return; exit r0 = 0x0dffbf78 comes from the value left in r0 by the preceding sprite_setUnk0x2c (which seeds
    r0 from the object base) and is not meaningful as a return value.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0811E202

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^0811e202 '' tools/traces/coverage/*.prof

