name: battle_delayedElementSpawn
address: '0x080DA1F8'
kind: function
status: probable
summary: Decrement Timer2 each tick; on expiry, set CurAnim from dword_80DA244[Param3], compute panel
  as (PanelX + facing, PanelY + dword_80DA3E8[Param3]), spawn object kind 0x9F with the parent's Element
  and (Param3<<8)|1 link arg, and advance CurPhase to 0x10.
interface: (r5 = battle object) -> r0 = void; spawns object 0x9F; object CurPhase set to 0x10 on completion
details: On entry it decrements oBattleObject_Timer2 and returns until it reaches zero, so the caller
  keeps invoking this as the object's phase step. When the timer expires it reads oBattleObject_Param3
  and uses it to (1) look up a new CurAnim from table dword_80DA244 (bytes 02,00,00,05) and (2) look up
  a signed byte Y-panel offset from dword_80DA3E8. It computes the spawn panel as PanelX + object_getFrontDirection(parent)
  (alliance-dependent +1/-1) and PanelY + that signed offset, passing Element in r2 and (Param3<<8)|1
  in r4 to battle_spawnObject9F, which links the spawned 0x9F object back to this object. Finally it writes
  0x10 to oBattleObject_CurPhaseAndPhaseInitialized so the next phase runs. The per-Param3 anim and Y-offset
  tables suggest Param3 selects a variant/level of the spawned effect.
