    add r0,r0,PanelX; ldrsb r2,[dword_80DA3E8,Param3]; add r1,r1,r2 — spawn panel offset by facing and
    Param3 Y table; mov r3,#0x60; add r3,r5; ... bl battle_spawnObject9F with Element in r2 and (Param3<<8)|1
    in r4 — parent-linked spawn of kind 0x9F; mov r0,#0x10; strh r0,[r5,#CurPhaseAndPhaseInitialized]
    — advance to phase 0x10 after spawning
