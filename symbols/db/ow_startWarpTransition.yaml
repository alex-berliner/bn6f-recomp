name: ow_startWarpTransition
address: '0x08005E86'
kind: function
status: probable
summary: 'Begins a warp: remembers the previous map group and player position, fades the screen, and switches
  the game to the warp subsystem.'
interface: () -> void; no arguments, no return value
details: Reads the game state via the toolkit pointer (r10). It copies oGameState_MapGroup into oGameState_LastMapGroup
  so the previous map can be restored on exit, then calls updatePlayerGameState_800107A to stash the player's
  X/Y/Z and facing (per its known summary, 'before a warp'). It calls SetScreenFade(0xc, 0x10) to start
  a fade-out, then writes 0x28 to oGameState_SubsystemIndex, which routes the game loop into the cbGameState_80050EC
  handler for that subsystem (sub_800572C), i.e. the warp/transition state.
