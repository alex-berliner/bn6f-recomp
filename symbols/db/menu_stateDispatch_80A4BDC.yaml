name: menu_stateDispatch_80A4BDC
address: '0x080A4BDC'
kind: function
status: confirmed
summary: Tail-call dispatcher that runs one of three phase handlers of the menu object in r5, selected by the pre-multiplied
  phase byte at r5+8.
interface: menu_stateDispatch(void) — no direct args; object pointer is fixed in R5; passes R0 = handler's own table
  entry (thumb address) and R1 = raw phase byte to the selected handler and returns its result verbatim.
details: 'Trampoline/state-machine dispatcher for an object held in R5. Reads the byte at [r5+8], which is stored
  already multiplied by 4 (values 0, 4 or 8), so it is used directly as a byte offset into the three-entry handler
  table off_80A4BF0 (sub_80A4BFC+1, sub_80A4C46+1, sub_80A4C5C+1). Because the code does mov lr, pc / bx r0 (a thumb
  tail-call idiom), the chosen handler returns directly to sub_80A4BDC''s caller, so outputs pass through unchanged;
  this is why the register contract shows all inputs as outputs. Each handler receives R0 = its own table entry
  address (thumb bit set) and R1 = the raw (unshifted) phase byte, presumably its state index. Any phase byte other
  than 0/4/8 would index past the table, so valid values are limited to 0, 1 and 2 after deshifting.

  '
