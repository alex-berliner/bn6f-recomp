name: pet_naviHealCutsceneStep
address: '0x081369D0'
kind: function
status: probable
summary: Per-frame step of a scripted scene that, after a 80-frame delay, fully heals the current PET navi and plays
  a sound/effect flourish before advancing the scene state.
interface: (r5 = scene/PET-event object, fields at +0x03/+0x12/+0x15/+0x1c) -> r0 = sub_8136B10 return value; flags
  from callees
details: Each invocation increments the counter at [r5,#0x12]; while it is below 0x50 it only calls sub_8136B10(2)
  and returns. Once the counter reaches 0x50 it calls reloadCurNaviStatBoosts_813c3ac (restores the current PET
  navi's HP to MaxHP), writes state 0xB into [r5,#0x1c], clears eStruct entry 0xB via sub_8046696, spawns eStruct
  records from the 0xFF-terminated table byte_813683C (likely visual effects), sets [r5,#0x03]=0x30 and [r5,#0x15]=0
  as fresh timers, and plays sound effect 0x74. It always ends by calling sub_8136B10 with r0=2, suggesting a scene-state
  dispatcher. r5 looks like a cutscene/event controller whose 0x1c field is the next step/state id.
