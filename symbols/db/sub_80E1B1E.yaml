name: sub_80E1B1E
address: '0x080E1B1E'
kind: function
status: confirmed
summary: Spawns a type-0x12 battle object via object_spawnType4, stamps in panel coordinates, links it to a hook
  slot, and copies the parent's alliance/direction flags.
interface: void sub_80E1B1E(u32 panelX, u32 panelY, u32 arg_r2, u32 arg_r3, u32 arg_r4, u32 parentObj, u32 hookSlot);
  /* r5=parent, r7=hook in; clobbers r0-r3,r5-r6,nz,cv; new object pointer only via memory */
details: 'Calls object_spawnType4 with type id 0x12 and returns the spawned object''s pointer in r5 (per contract).
  If non-null, writes

  PanelX/PanelX/PanelY, stores hookSlot into the new object''s oBattleObject_ExtraVars and the object pointer back
  into [hookSlot]

  forming a two-way link, then copies parentObj->oBattleObject_AllianceAndDirectionFlip (uint16) to the new object.
  r4 is preserved

  across the call (pushed/popped). Spawn parameters r2-r4 are forwarded to object_spawnType4 but not otherwise stored
  here.

  On spawn failure, no fields are initialised and the hook slot is left untouched.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
