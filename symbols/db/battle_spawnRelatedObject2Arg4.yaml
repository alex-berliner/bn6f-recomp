summary: Thin entry that invokes battle_spawnRelatedObject2 with its variant/size parameter fixed to 4
  (sibling entries pass 6, 8, 10).
interface: (r0, r1 = spawner args, r2 = halfword param, r5 = battle object) -> r0 = spawned object stored
  to [r5+oBattleObject_RelatedObject2Ptr]; flags clobbered probable
details: 'The function is a two-instruction thunk: it sets r3 = 4 and branches into the shared tail of
  battle_spawnRelatedObject2 at loc_8011368. That tail packs the constant 0x0A0C with the caller''s halfword
  (r2), calls spawn_t1_0x47_probablyGeneric_80C468C, stores the result as the spawner''s RelatedObject2Ptr,
  and since r3 != 0 skips the object_setFlag call that the variant-0 entry performs. r3 survives into
  spawn_t1_0x47, so 4 is a real parameter of the spawned kind-0x47 object, and the neighboring entries
  sub_801135A/135E/1362 pass 6/8/10, suggesting a size-or-count-like family of spawns. Nothing in this
  thunk itself reveals what 4 means inside the spawn routine.'
