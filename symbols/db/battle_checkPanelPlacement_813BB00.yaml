name: battle_checkPanelPlacement_813BB00
address: '0x0813BB00'
kind: function
status: confirmed
summary: Tests whether a 7×7 panel shape from a Custom Program or AI-selected attack can legally occupy
  its target tiles on the 15×15 battle grid.
interface: "int battle_checkPanelPlacement(unsigned panel_id /*r0*/, uint8_t *grid /*r1*/,\n         \
  \                      unsigned row /*r2*/, unsigned col /*r3*/);\n/* returns 1 = blocked or fully clear,\
  \ 0 = overlaps non-passable cells;\n   NZ flags reflect the return; r8–r12 are passed through from\n\
  \   ai_dispatchFromGlobalByte */\n"
details: "Calls ai_dispatchFromGlobalByte(panel_id) to retrieve a 7-row × 7-byte\noccupancy table describing\
  \ the panel's shape (non-zero bytes mark tiles the\npanel occupies).  Computes the centre offset for\
  \ the 7×7 window into the\n15×15 grid: ptr + (row+2) + (col+2)*0xF.\n\nIterates every table byte:\n\
  \  • zero  → skip (not part of the panel).\n  • non-zero grid byte == 0 → void tile; break out immediately,\
  \ return 1\n    (\"blocked\").\n  • non-zero grid byte == 3 → normal floor; acceptable, continue.\n\
  \  • any other non-zero grid byte (walls, objects, holes) → clear the\n    all-clear flag.\n\nAfter\
  \ the scan, r0 = 1 if blocked OR all-clear (every occupied cell is\nfloor), r0 = 0 if some cells overlap\
  \ non-floor terrain.  The stack slot at\n[sp+0x10] is the all-clear accumulator (initialised to 1, set\
  \ to 0 on the\nfirst mismatch).  r10 is listed as an input in the contract but the body\nnever reads\
  \ it; the caller's r10 is preserved by the push/pop.\n"
