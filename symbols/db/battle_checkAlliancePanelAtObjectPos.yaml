name: battle_checkAlliancePanelAtObjectPos
address: '0x0810B646'
kind: function
status: confirmed
summary: Checks whether the panel a battle object occupies (including its vertical offset) is valid for the object's
  alliance/side.
interface: void battle_checkAlliancePanelAtObjectPos(r5=oBattleObject*) -> r0=panelX, r1=panelY (with the Y offset
  applied), NZ flags set from object_checkPanelParameters' r0 result; clobbers r2, r3, lr; preserves r4/r5 as left
  by object_checkPanelParameters
details: 'Reads the object''s PanelX (oBattleObject_PanelX, byte) and PanelY (oBattleObject_PanelY, byte) and adds
  the 32-bit value at oBattleObject_ExtraVars+8 to the Y coordinate, so the checked position is (PanelX, PanelY
  + ExtraVars[2]); this offset is presumably an elevation/hover/lift displacement of the object. It then calls GetAllianceDependentPanelParamArgs
  with r3 = pointer to the panel parameter table byte_810B6E0 and r5 = the object, receiving back two parameter
  values in r2/r3 (likely the panel bounds/valid ranges that depend on whether the object is on the player or enemy
  alliance). Those are passed along with the computed x/y to object_checkPanelParameters, whose nonzero/non-negative
  result sets the NZ flags as the return condition. Quirk: the wrapper pushes {r0,r1,lr} before the calls and pops
  {r0,r1,pc} afterward, so the returned r0/r1 are the original panel coordinates read at entry (r1 including the
  ExtraVars+8 offset), not the callee''s r0/r1; callers read the boolean check from the Z flag while getting the
  checked coordinates back in r0/r1. r4/r5 survive only insofar as object_checkPanelParameters preserves them.'
