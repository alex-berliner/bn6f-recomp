name: battle_checkAlliancePanelAtObjectPos
address: '0x0810B646'
kind: function
status: probable
summary: Tests whether the battle panel under an object (Y shifted by a stored offset) satisfies the panel-flag
  requirement taken from the alliance-indexed panel-parameter table, returning the panel coordinates when
  it matches.
interface: (r5 = battle object ptr, r0/r1/r2 set up internally) -> r0 = panel X, r1 = panel Y when the
  check passes (0 otherwise, exact failure path unclear); flags set by cmp before pop
details: 'Reads oBattleObject_PanelX and oBattleObject_PanelY from the battle object in r5, adds the word
  at oBattleObject_ExtraVars+8 to Y (a stored Y offset, e.g. from movement/knockback state), and saves
  X/Y on the stack. It then calls GetAllianceDependentPanelParamArgs with the table base byte_810B6E0
  (loaded via off_810B77C) to fetch the panel-type parameter and args for the object''s alliance, and
  feeds the result to object_checkPanelParameters, which verifies the target panel''s mask bits. The stack
  push of {x,y,lr} is a tail-call trick: on success the pop reloads X into r0 and Y into r1 as the return
  values, so the caller receives the coordinates of the matching panel. The cmp r0,#0 result appears unused
  because pop discards flags, suggesting a conditional return path the listing compresses (12 instructions
  vs 10 shown). Given the callers run during battlesweep and beast-over special routes, this is likely
  a condition check for a panel-dependent battle effect tied to the beast/alliance state.'
