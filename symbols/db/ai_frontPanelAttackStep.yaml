  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]/bne -> branch splits first run vs. countdown phase;
    mov r0,#4; strb [r7,#AttackElement]; PlaySoundEffect(0xC7); anim 0x11 on first run; object_spawnCollisionRegion
    called with panel X+frontDirection, Y, r4=0x700FF02, r6=oAIAttackVars_Damage, r7(overridden)=3; effect
    0x3A spawned at object_getCoordinatesForPanels(X+front,Y) with r4=(object_getFlip<<8)+0x3A; tail:
    decrements StepTimer from 0xC and on expiry sets HitElement=0x18'
