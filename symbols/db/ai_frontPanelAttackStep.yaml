name: ai_frontPanelAttackStep
address: '0x080F4F14'
kind: function
status: probable
summary: 'AI attack state routine: on first run spawns a damaging collision region one panel in front
  of the object plus its visual effect, then counts down and flags the hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars, r0 unused/clobbered) -> r0 = spawned effect object
  (initial run) or clobbered; no meaningful flags
details: 'Two-phase attack coroutine keyed on oAIAttackVars_AttackElement: when zero, it marks the attack
  started (AttackElement=4), plays sound 0xC7, sets the object''s animation to 0x11, and spawns a collision
  region at PanelX+frontDirection/PanelY with size words 0x700FF02 and 0x3, passing oAIAttackVars_Damage
  and InitFlag as parameters. It then spawns a type-1 effect-0 object at that panel''s pixel coordinates
  (object_getCoordinatesForPanels), with parameter r4 = (object_getFlip << 8) + 0x3A so the effect mirrors
  the object''s facing. On subsequent calls (AttackElement != 0) it decrements StepTimer, and when the
  12-frame timer (set to 0xC) expires it writes 0x18 into oAIAttackVars_HitElement to trigger the damage
  application elsewhere. The push/pop of r7 around object_spawnCollisionRegion preserves the AI-vars base
  pointer across the call.'
