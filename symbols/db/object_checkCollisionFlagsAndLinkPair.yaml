name: object_checkCollisionFlagsAndLinkPair
address: '0x03007650'
kind: function
status: probable
summary: For a pair of battle objects, checks that one's target collision flags match the other's self
  collision flags and, if so, records the collision link between them.
interface: (r0 = object A collision/entity record, r1 = object B record) -> r0 = preserved via callee
  flow; no meaningful return, flags clobbered
details: Loads oCollisionData_TargetCollisionTypeFlags from r0 (the object seeking targets) and oCollisionData_SelfCollisionTypeFlags
  from r1 (the candidate target) and tst's them; if no flag bits overlap, the pair is ignored entirely.
  Otherwise it saves both records in r6/r7 and calls sub_3007218 and then sub_3007692, each with the same
  (r0=A, r1=B) arguments, presumably recording the collision connection in each direction or on both records.
  This is the per-pair inner step of object_linkCollisionData, which iterates a group mask table to feed
  pairs in during battle (skipped when paused). The symmetric structure (two callees, same argument order)
  suggests one call handles each side of the link.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst of [r0,#oCollisionData_TargetCollisionTypeFlags] with [r1,#oCollisionData_SelfCollisionTypeFlags]
    gates everything — flag-compatibility check between two collision records; beq skip means non-matching
    flag pairs do nothing, i.e. this is a filter + link step, not unconditional processing; caller object_linkCollisionData
    (known summary) feeds object pairs from a per-group mask table during battle, matching a pair-wise
    collision linker; two consecutive bl sub_3007218 / bl sub_3007692 with identical (r0,r1) arguments
