name: owMapObject_weatherTornado_setPriority_80A91F4
address: '0x080A91F4'
kind: function
status: confirmed
summary: Sets the sprite priority of the overworld tornado weather object, forcing overlay priority 1 once the BE6
  event flag is set and otherwise letting the generic layer-effect code pick the priority.
interface: void owMapObject_weatherTornado_setPriority_80A91F4(owMapObject* obj /*r5*/, u32 context /*r10*/); //
  calls only, no meaningful return; on the layer-effect path r0 (priority) and r5 (object) are left set by applyLayerEffectToOWObject
  for the callee sprite_setPriority
details: "r5 points at the tornado map object's work area; r10 is a context value that is only\npreserved (read\
  \ by callees but not used here). First it tests event flag EVENT_BE6\n(bank 11 / 0xB, flag 0xE6) via TestEventFlagFromImmediate:\n\
  \  - flag set (Z clear): the tornado is currently drawn as a foreground overlay, so it\n    calls sprite_setPriority_8002E14\
  \ with priority r0=1 and the object pointer in r5.\n  - flag clear: it computes r5+0xC (the object's layer record\
  \ / layer-effect field)\n    and calls applyLayerEffectToOWObject_8035694, which decides the sprite priority\n\
  \    from the map layer and leaves the priority in r0 and the object pointer in r5;\n    it then calls sprite_setPriority_8002E14\
  \ with those values.\nThe layer-effect path also leaves other registers (r6, r8-r12) modified; those are\njust\
  \ leftovers from applyLayerEffectToOWObject and are irrelevant here. Tail of the\nfunction is pop {pc}. The r5+0xC\
  \ field is presumably part of the standard overworld\nmap-object work area layout used by applyLayerEffectToOWObject.\n"
