name: battle_dimmingRegionAttackAction
address: '0x080E2EBC'
kind: function
status: probable
summary: Battle action that spawns a dimming collision region on its panel (kind-0xA extra-vars object,
  SE 0xBC), sets Timer=60, white-flashes the linked object each tick, and on expiry advances CurAction
  to 0xC with phase reset.
interface: (r5 = battle object, oBattleObject fields; no args) -> updates object phase/timer fields; sets
  CurAction=0xC, CurPhaseAndPhaseInitialized=0 on expiry
details: First entry (PhaseInitialized==0) sets Timer=60, spawns a kind-0xA object via battle_spawnExtraVarsObject
  with ExtraVars 0x13C00 (likely a graphic/animation id), plays sound effect 0xBC, then calls object_spawnDimmingCollisionRegion
  with PanelX/PanelY as r0/r1, the object's own Element as r2, r4 = byte_80E2F18[Alliance] (entries 0x82,0xFF,0x05,0x34
  for ally/enemy), r3=0 and r7=0x3000 — so the region's look depends on which side spawned it and the
  attack element. Then PhaseInitialized=4. Every tick after that it decrements Timer and calls sprite_forceWhitePalette
  on the object pointed to by RelatedObject1Ptr, producing a flashing-white highlight while the region
  is active; when the timer goes negative it sets CurAction=0xC and clears phase so the normal action
  script continues.
