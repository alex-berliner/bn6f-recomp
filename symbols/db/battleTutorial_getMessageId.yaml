name: battleTutorial_getMessageId
address: '0x080299FA'
kind: function
status: confirmed
summary: Chooses which battle-tutorial text message to show based on the tutorial kind and a "already seen" flag,
  returning the message id (0x24, 0x25, or 0 for none).
interface: u32 battleTutorial_pickMessageId(u8* state /* in r5 */) /* returns message id in r0; clobbers NZCV */
details: 'r5 points at the battle-tutorial state block. Reads the tutorial kind at +0x07 and the seen/progress flag
  byte at +0x17. Kind 0x0B yields message id 0 (no message shown). Kind 0x0A yields 0x25 if the flag byte at +0x17
  is still clear, else 0. Any other kind yields 0x24 if the flag is clear, else 0. The flag byte is only read, never
  written here; the caller presumably advances the tutorial and sets +0x17 elsewhere. Returns via pop {pc} with
  the id in r0; flags are clobbered and all other registers preserved (only lr is pushed).

  '
