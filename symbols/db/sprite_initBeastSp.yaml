name: sprite_initBeastSp
address: '0x080A92E0'
kind: function
status: probable
summary: 'Initializes the hard-coded BeastSP (Beast Out) sprite state: loads a fixed sprite resource,
  applies animation/shadow/priority/palette settings, and resets animation counters.'
interface: (implicit r4 = object/context, r5 = sprite state struct, r6 = object base) -> void; sprite
  slot byte [r5]=3, animation, priority, palette and counters configured
details: Writes 3 to byte 0 of the struct at r5 (sprite slot/flags), then calls sprite_load with hard-coded
  arguments 0x80, 0x1c, 0x6c (sprite resource ids). It then copies the animation index from [r5+4] into
  sprite_setAnimation, loads the animation data, disables the shadow, sets OAM priority from [r5+5], and
  takes the palette index from [r6+0x1c] of the object. Finally it zeroes [r5+6], [r5+7] and the word
  at [r5+0x24] (frame/animation counters and state), stores 4 at [r5+8] (current state/step), and tail-calls
  sub_80A931C to continue the setup. Everything runs through the shared sprite helpers, which operate
  on the object via the preserved registers rather than arguments.
