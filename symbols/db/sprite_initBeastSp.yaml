    -> sprite_setAnimation and ldrb r0,[r5,#5] -> sprite_setPriority match the known helper semantics;
    ldrb r0,[r6,#0x1c] -> sprite_setPalette pulls palette from the object struct; zeroing [r5+6],[r5+7],[r5+0x24]
