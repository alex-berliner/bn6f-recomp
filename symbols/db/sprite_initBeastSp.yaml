name: sprite_initBeastSp
address: '0x080A92E0'
kind: function
status: confirmed
summary: Initialises the Beast Out sprite for an entity — loads its graphics, sets animation/priority/palette, resets
  animation counters, then runs a Beast Out specific setup helper.
interface: void sprite_initBeastSp(r5=sprite state ptr, r6=owning object ptr, r10=context passed through); leaves
  r2/r3/r8-r12 set by sub_80A931C for the caller
details: "Sets up a sprite state (r5) for Beast Out graphics on behalf of its owning entity (r6):\n* [r5] = 3 —\
  \ sprite kind/id tag identifying Beast Out.\n* sprite_load(r5, 0x80, 0x1C, 0x6C): loads a 128x28 tile graphic\
  \ with a 0x6C-byte row stride\n  (the Beast Out sheet).\n* sprite_setAnimation([r5+4]) and sprite_loadAnimationData()\
  \ take the animation index and\n  frame data from the sprite state itself.\n* sprite_noShadow(): Beast Out draws\
  \ with no shadow ellipse.\n* sprite_setPriority_8002E14([r5+5]) — draw priority stored in the sprite state;\n\
  \  sprite_setPalette([r6+0x1C]) — palette index comes from the owning entity instead.\n* Resets the animation\
  \ counters: [r5+6] = 0, [r5+7] = 0, [r5+0x24] = 0, and sets the frame\n  delay [r5+8] = 4.\n* Tail-calls sub_80A931C(sprite)\
  \ for Beast Out specific finish-up; whatever it leaves in\n  r2/r3/r8-r12 is passed straight back to this function's\
  \ caller (r10 passes through\n  unchanged). r4-r7 are saved/restored by the push/pop, so r5 (the sprite state\
  \ pointer)\n  is preserved to the caller even though the lifter lists it in the outputs.\n"
