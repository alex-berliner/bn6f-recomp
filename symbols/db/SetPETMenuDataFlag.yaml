name: SetPETMenuDataFlag
address: '0x0811EBE8'
kind: function
status: confirmed
summary: Sets bits in the PET menu's data-flags byte, marking menu options/data as unlocked or available.
interface: 'void SetPETMenuDataFlag(u8 flagBits) — in: r0 = flag bits to OR in; out: none; clobbers r1, r2, NZ flags;
  returns via caller''s lr.'
details: Reads the flags byte at ePETMenuData+5 (EWRAM 0x200DF25), ORs in the caller-supplied bits from r0, and
  writes it back. ePETMenuData is the game's PET (menu) data structure; offset 5 is a bitfield of menu/data status
  flags. Trivially small THUMB helper, tail-jumps back with mov pc, lr, so callers can use BL directly.
