  detail: 'bl object_getFlag then tst r0,0x8000 / bne return: object runs only when flag bit clear; ldrb
    r0,[r6,#oAIState_ScriptId] + ldr r1,[table,r0]: handler chosen by per-object script id; off_8115A20
    holds exactly three thumb pointers (sub_8115A2C, sub_8115A5C, sub_8115A96): three script states; mov
