name: ai_dispatchBeastSpHandler
address: '0x08115A02'
kind: function
status: probable
summary: 'Per-frame AI dispatcher for a battle object: skips work when the object''s flag word has bit
  0x8000 set, otherwise tail-calls one of three handlers selected by the object''s AIState script-id.'
interface: (r6 = current battle object) -> r0 = handler return value; flags set by tst of flag word
details: Calls object_getFlag on the current object (r6) to fetch its first collision-data flag word;
  if bit 0x8000 is set (likely an inactive/hidden marker) it returns immediately. Otherwise it loads the
  object's oAIState_ScriptId byte, indexes the 3-entry thumb handler table at 0x8115A20 with it, and does
  a 'mov lr,pc; bx r1' tail-call into that handler, so each entry runs as a per-object step routine. r6
  is left holding the object for the handlers, and r4 is preserved across the call. The dispatcher itself
  holds no state; all behavior lives in the three callee routines.
