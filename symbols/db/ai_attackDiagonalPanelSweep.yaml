name: ai_attackDiagonalPanelSweep
address: '0x0810BAAC'
kind: function
status: probable
summary: AI attack routine that marches a panel-hit attack diagonally across the field from the object's
  front, enqueueing one attack entry per panel until it leaves the field.
interface: '(r4 = battle object, r5 = object work area (scratch 0x7D-0x84), r7 = AI attack vars: Damage/ExtraDamage,
  Timer, YOffset(oAIAttackVars_AttackBoost2)) -> r0 = clobbered; no meaningful return'
details: 'Copies the attack''s Damage/ExtraDamage pair to [r5+0x80] and stashes a per-attack pointer at
  [r5+0x84], clearing the panel counter at 0x7F. Computes the starting panel as (PanelX + frontDirection,
  PanelY + YOffset), where YOffset indexes the table dword_810BB58 (signed bytes -1/0/+1), so ''AttackBoost2''
  is really a row offset. It then loops: for each panel with Y in 1..3 and X not yet at the boundary from
  dword_810BB60 (7 for alliance 0, 0 for alliance 1), it calls sub_80D94F2 with panelX/r0, panelY/r1,
  Element/r2, the pointer/r3, a packed word (timer<<16 | YOffset | (counter*3)<<8)/r4 and the damage pair/r6,
  advancing the pointer by 4 each time. After each call it steps X by the facing direction and Y by the
  row offset again (a diagonal walk) and increments the counter. The loop exits once the walk leaves the
  6x5 panel area (Y==0 or Y==4) or reaches the far edge, making this a diagonal sweeping attack such as
  a boss''s slanted beam/line.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
