    (810BAD0-810BADC); dword_810BB60=0x7 indexed by oBattleObject_Alliance gives the stopping X (7 vs
    0), i.e. the far edge relative to side (810BAF4-810BB00); loop bounds cmp r1,#0 / cmp r1,#4 keep the
    walk on rows 1-3 of the panel grid (810BAEA-810BAF0); sub_80D94F2 receives panelX/Y, Element, an advancing
    +4 pointer and a packed (timer,offset,counter*3) word — one call per panel (810BB16-810BB2C); object_getFrontDirection
    orients the walk along the object's facing, called for both the start panel and each step (810BAC2,
    810BB34)
