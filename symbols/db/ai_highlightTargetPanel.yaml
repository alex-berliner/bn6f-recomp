name: ai_highlightTargetPanel
address: '0x081000F6'
kind: function
status: confirmed
summary: Flashes the panel at the column the AI's pending attack is aimed at, using the battle object's alliance/flip
  word for the highlight side.
interface: (u32 battleObject in r5, u32 aiAttackVars in r7) -> u32 out r1; clobbers r0-r3, flags, lr; preserves
  r4
details: Thin wrapper over object_highlightPanelRegion. Loads TargetPanelX (byte at oAIAttackVars_TargetPanelX)
  from the AI attack state in r7, passes constant width 2 and height 5 as the highlighted region's size, and reads
  oBattleObject_AllianceAndDirectionFlip (halfword) from the battle object in r5 to select which side of the field
  gets highlighted. Returns whatever object_highlightPanelRegion leaves in r1, the only output callers consume.
  No branches or state changes of its own.
