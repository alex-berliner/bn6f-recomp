name: ai_highlightTargetPanel
address: '0x081000F6'
kind: function
status: probable
summary: Highlights the AI enemy's targeted attack panel region on the battle field
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = result of object_highlightPanelRegion; calls
  with r0 = targetPanelX, r1 = 2, r2 = 5, r3 = object alliance
details: Thin wrapper around object_highlightPanelRegion. It loads the AI's target panel X from oAIAttackVars_TargetPanelX
  (r7) and the owning object's alliance/direction word from oBattleObject_AllianceAndDirectionFlip (r5),
  then calls object_highlightPanelRegion with fixed constants r1=2 and r2=5, so it always highlights the
  same shape anchored at the target X, on the side matching the object's alliance. This matches the telegraph
  highlight the game draws before an enemy's panel-based attack fires. Runs during recorded battlesweep/beastsp/chips
  routes, i.e. normal battle AI behavior.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_TargetPanelX] supplies the anchor panel from the AI attack-variable
    block; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip] passes the calling object's alliance so
    the highlight lands on the correct field side; tail call to object_highlightPanelRegion (0x0800CCD4)
    is the entire body apart from the constants r1=2, r2=5; single caller sub_80FFE72 at 0x080FFE72 runs
    in battle routes, consistent with AI attack telegraphing
  refs:
