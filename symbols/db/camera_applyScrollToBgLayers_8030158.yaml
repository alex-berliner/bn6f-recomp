name: camera_applyScrollToBgLayers_8030158
address: '0x08030158'
kind: function
status: confirmed
summary: Applies the camera's frame-to-frame movement delta to the background scroll positions, always scrolling
  the first background layer pair and also the second pair unless a check (sub_80269E2) says not to.
interface: int sub_8030158(CameraState* camera /*r5*/, Toolkit* toolkit /*r10*/)
details: 'Computes the camera''s movement since the previous frame as current-minus-previous position: scrollX =
  oCamera_Unk_04 - oCamera_Unk_08, scrollY = oCamera_Unk_06 - oCamera_Unk_0a (halfword loads, so deltas wrap at
  16 bits). Reads the toolkit''s RenderInfo pointer (oToolkit_RenderInfoPtr) and adds the deltas to the first background
  layer pair''s scroll offsets at oRenderInfo_Unk_14/0x16, storing them back as halfwords. It then calls sub_80269E2
  with r0 = RenderInfo and the two deltas passed on the stack; if that returns nonzero the second layer pair (oRenderInfo_Unk_18/0x1a)
  is left untouched and the function returns early with flags from the TST, otherwise the same deltas are added
  to that pair as well and the return flags come from the final ADDS on the Y scroll. r4-r7 are saved and restored,
  so callers see them unchanged; r1/r4 hold the deltas around the call and are reloaded from the saved stack slots
  afterwards (mirroring the original''s push/pop {r1,r4}). This drives overworld background scrolling (map layer
  pair, likely foreground/background parallax) in step with camera movement.

  '
