name: sub_80AA3C2
address: '0x080AA3C2'
kind: function
status: confirmed
summary: (Re)loads the sprite + animation for an overworld object using its 5th-byte sprite-entry index, applies
  the OW layer effect and priority, returning a 0xFF sentinel in r1 when the slot is unused.
interface: "void overworldObject_loadSprite_80AA3C2(\n    u8 spriteTableIdx /* r0 */,\n    OverworldObject* obj\
  \ /* r5 */,\n    u32 unused /* r10 */);\n// returns r1 = byte_80AA430[tableIdx<<3 | obj->spriteEntry] + 4 (0xFF\
  \ sentinel if no sprite)\n// clobbers: r0,r2,r3,r4,r11,r12,lr,nzcv\n"
details: 'The function resolves one entry of the 8-byte-per-index sprite table at byte_80AA430

  using (spriteTableIdx << 3) as base and obj->field_5 (one byte at obj+5) as the

  per-sub-entry offset. The first byte of that slot is a sprite ID (0xFF = "no sprite");

  the second byte is the data/cell argument to sprite_load, which is called with

  VRAM bank 0x80.

  The overworld object''s animation index lives at obj+4; if the loaded sprite ID is NOT

  0x18 the animation index is halved (half-speed walk) before being handed to

  sprite_setAnimation. The standard sprite post-load sequence

  sprite_loadAnimationData -> sprite_hasShadow -> applyLayerEffectToOWObject_8035694

  -> sprite_setPriority_8002E14 is then run, then r1 is loaded from byte_80AA430[(idx<<3)+4]

  and that is what the caller will read back (the 0xFF sentinel falls straight out when

  the early-return path is taken).

  Quirks: the animation halving depends on the loaded sprite ID itself (==0x18 means

  "full speed"), which couples sprite selection to walk speed; obj+5 (not obj+0) is the

  sprite-slot index, suggesting an animation-state byte; 0xFF is used as the explicit

  "empty sprite slot" marker rather than 0.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
