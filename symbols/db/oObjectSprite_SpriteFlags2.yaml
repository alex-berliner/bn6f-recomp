summary: Bitfield of sprite display flags (bit0=shadow, bit2=no-shadow, bit5=?, bit6=?, bit7=animation/graphics
  loaded)
details: ">\n  Consistent bitwise access across multiple specialized sprite functions\n  (sprite_hasShadow\
  \ sets bit0/clears bit2, sprite_removeShadow clears both,\n  sprite_noShadow sets bit2/clears bit0,\
  \ sprite_setField0x3Bit5 sets bit5,\n  sub_800302A sets bit6, sprite_loadAnimationData/_sprite_update\
  \ test bit7).\n  Zeroed on sprite_initialize. The symmetric OR/BIC pair around bits 0 and 2\n  in the\
  \ shadow functions makes this a packed flags byte, not a numeric field."
