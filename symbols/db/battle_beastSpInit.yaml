- method: assembly-reading
  date: '2026-10-18'
  detail: 'strb r0(=3),[r5] and strb r0(=4),[r5,#8]: state-byte initialization on the object struct; sprite_load(0x80,0x1C,0x49)
    then sprite_setAnimation(ldrb [r6,#2]) then loadAnimationData/noShadow/priority 2: full sprite bring-up;
    str r0(=0),[r5,#0x24]: resets a counter/timer field before stepping; bl battle_beastSpStepper_80A7912
    immediately after setup: this is a pre-step to the Beast-SP actuator routine; callee summary of the
    stepper (''Drives a single Beast-Out AI step... Beast-SP'') confirms the subsystem'
