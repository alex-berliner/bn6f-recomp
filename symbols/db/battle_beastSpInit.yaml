name: battle_beastSpInit
address: '0x080A78E0'
kind: function
status: probable
summary: 'Initializes a Beast-SP state on an object: sets state 3, loads its Beast sprite and animation,
  configures sprite flags, then hands off to the Beast-SP stepper.'
interface: (implicit r5 = object/state struct, r6 = param struct with anim index at +2) -> r0 = stepper
  result; writes [r5]=3, [r5+8]=4, [r5+0x24]=0
details: Stores 3 at [r5] (a state/mode byte), then loads sprite resource triple (0x80, 0x1C, 0x49) into
  the object. The animation index is read from [r6,#2] and passed to sprite_setAnimation, followed by
  sprite_loadAnimationData, sprite_noShadow, and sprite_setPriority(2) for the standard overlay look.
  It clears the dword at [r5,#0x24] (likely a timer/counter) and stores 4 at [r5,#8] (a sub-state/action
  id). It then calls battle_beastSpStepper_80A7912 to run the first Beast-SP AI step. r5 and r6 are inputs
  set by the caller (no callers captured), so their exact structure roles are inferred from the callees.
