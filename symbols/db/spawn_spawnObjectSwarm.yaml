name: spawn_spawnObjectSwarm
address: '0x08086F5C'
kind: function
status: probable
summary: 'Spawns a map-dependent number of copies of overworld object #0xA at (0,0), recording the count
  in a work struct.'
interface: () -> r0 = 0 always; spawns 0xA-objects via SpawnOverworldMapObject, count stored at [off_8086D18]+0xB
details: It reads the current MapGroup from the GameState; if the group is 0x81 it uses byte GameState+5
  as an index, otherwise it uses constant 3. That index selects a byte from table dword_8086F9C (0x03020202
  → counts 2,2,2,3), which is saved at struct off_8086D18+0xB (byte_2011A9B). It then loops that many
  times, calling SpawnOverworldMapObject(0xA, 0, 0, 0, i), spawning i-th object id 0xA at x=0,y=0 — likely
  objects that reposition themselves (ambient flock/pieces). Always returns 0.
