- method: assembly-reading
  date: '2026-10-18'
  detail: chatbox_mask_eFlags2009F38 with 0x80 then bne skips mode selection (sub_8049934 prologue); branch
    on [r5+3]==1 stores 0xC to [r5+1] (loc_8049960); chatbox_GetState_8045F4C != 0 stores 0x28 to [r5+1];
    else path calls SetScreenFade(0xC, 0x10) then stores 0x30; unconditional tail bl battle_moduleInit_803A820
