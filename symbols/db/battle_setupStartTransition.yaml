name: battle_setupStartTransition
address: '0x08049934'
kind: function
status: probable
summary: Picks the battle-entry transition mode (fade vs skip) from chatbox/cutscene state, then initializes
  the battle module.
interface: (r5 = battle-transition state struct; byte [r5+3] = sub-state, byte [r5+1] = mode written)
  -> void; sets mode byte then calls battle init
details: If bit 0x80 of eFlags2009F38 is set, mode selection is skipped entirely. Otherwise, if [r5+3]
  == 1 the mode byte [r5+1] is set to 0xC (no fade path). Else if chatbox_GetState_8045F4C returns nonzero,
  [r5+1] = 0x28; otherwise SetScreenFade(0xC, 0x10) runs and [r5+1] = 0x30. In all cases battle_moduleInit_803A820
  is called last, so this is a pre-battle handoff step. r5 is inherited from the caller and never set
  here, implying a struct owned by the battle-start state machine. Mode values 0xC/0x28/0x30 presumably
  select fade-in behaviour or skip inside the battle module.
