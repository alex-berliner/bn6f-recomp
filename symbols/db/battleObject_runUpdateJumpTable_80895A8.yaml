open_questions:
- Whether [r5] truly indexes the full 34-entry table or is masked/clamped before the load — no `and` is
  visible in this 6-instruction stub, so it's presumably already a small byte.
- Whether r0 returned is "alive/keep ticking" vs. "handler finished" — both interpretations fit `tst r0,r0`.
  Following one or two of the callee handlers and seeing how the caller loop uses r0 would settle it.
