name: mplay_initPlayer
address: '0x0814F08C'
kind: function
status: probable
summary: m4a sound-engine helper that initialises a MusicPlayerInfo with its track array, resets each
  track, and links the player into the engine's MPlayMain dispatch chain.
interface: (r0 = MusicPlayerInfo*, r1 = Track array pointer, r2 = u8 track count, clamped to <=0x10) ->
  r0 = clobbered; sets player status/ident, track count, and engine link fields
details: Takes a music player struct (r0), its track array (r1) and track count (r2, clamped to 16). Via
  the global pointer at byte_3007FF0 it validates the engine state with the magic 0x68736D53 ('Smsh')
  in the first word, briefly incrementing it as a handoff token, then aborts if the magic is wrong. It
  stores the track array at player+0x2C, the clamped track count at player+0x08, and writes 0x80000000
  (the 'needs init / active' ident) to player+0x04; then for each track it zeroes the track's first byte
  (track status) using stride 0x50, the MusicPlayerTrack size. If the engine struct has a pending handler
  at +0x20 with argument at +0x24, it hands those to player+0x38/+0x3C and clears them; otherwise it links
  this player by setting engine+0x24 = player and engine+0x20 = MPlayMain+1, and stamps 'Smsh' into player+0x34.
  No song header is assigned here, so it only prepares/registers the player, not start playback of a specific
  song.
