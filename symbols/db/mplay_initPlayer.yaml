name: mplay_initPlayer
address: '0x0814F08C'
kind: function
status: confirmed
summary: Links a music player into the M4A sound driver, initialising its track slots and registering it as the
  driver's active player.
interface: void mplay_initPlayer(MPlayPlayer *player /*r0*/, void *trackBase /*r1*/, u8 trackCount /*r2*/)
details: 'This is the m4a driver''s "attach player" routine (the standard MPlayInit / mplay_initPlayer of the Nintendo
  m4a music engine). r0 is the player control block, r1 the base of an array of 0x50-byte track structures, and
  r2 the track count, read as a byte: 0 aborts without touching anything, values above 0x10 (MPLAY_MAX_TRACKS, the
  m4a channel limit) are clamped to 0x10. It checks the driver control block at *byte_3007FF0: its first word must
  equal the "Shsm" structure tag 0x68736D53, otherwise the driver is uninitialised and the call is a no-op. While
  linking, the tag word is incremented (+1) as a claim marker and restored to "Shsm" at the end. It then calls mplay_trackHandler_814ECB4(player,
  count) to set up the track handlers, stores the track base at player+0x2C, the count byte at player+0x8, and 0x80000000
  (status word, "player ready"/stopped) at player+0x4. Each track slot''s first byte is cleared to 0. If the driver
  still holds a queued player (driver+0x20 non-null), the new player inherits it: the queued routine pointer goes
  to player+0x38 and the saved link value at driver+0x24 to player+0x3C, and the old pointer is dropped. Finally
  the player is hooked in: driver+0x24 = player, driver+0x20 = MPlayMain+1 (the driver''s tick routine), the tag
  word "Shsm" is written both to the driver and to player+0x34, making the player the active music player driven
  by MPlayMain. Quirk: the count is taken modulo 256 and only the first byte of each 0x50-byte track slot is zeroed.

  '
