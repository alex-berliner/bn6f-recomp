name: object_runFrameUpdate_8026A6C
address: '0x08026A6C'
kind: function
status: confirmed
summary: Runs an object's standard per-frame update sequence and returns its state byte.
interface: u8 object_runFrameUpdate(Object* self /* r5 */)
details: 'Self pointer arrives in r5 (struct S20364C0, one of the game''s generic object/actor structs). The routine
  chains together the standard per-frame steps: sub_8027D78 (animation/timer refresh, no args), then loads the object''s
  attribute byte at self+0x0E into r0 and passes it through the shared helper sub_802FE6A followed by sub_80062EC,
  then runs the object-wide update passes sub_802A3CC and sub_802A0F8. Finally it reads self+0x04 (the object''s
  state/result byte) into r0 and returns. Flags are whatever sub_802A0F8 left; r6/r7 are preserved across the call.
  This looks like the generic "tick one object" entry point used by the object scheduler; the meaningful game behavior
  lives in the callees, dispatched by the object''s type/attribute.

  '
