name: setupNaviDisplay_802C34E
address: '0x0802C34E'
kind: function
previous_names:
- sub_802C34E
status: confirmed
summary: 'Sets up the battle result screen: copies the 12-byte result record (r0 = unk_2035260, record battle state
  +0x0D) into eS20364C0 (reward at +0x14 = 0x020364D4), passes the reward to eStruct200A008 (+4, the reward given),
  and queues the screen''s graphics, the PET navi''s included.'
interface: void setupNaviDisplay_802C34E(u32 r0 /*naviAttributeBase*/, u32 r10 /*toolkit*/, int /*lr*/); preserves
  r4-r7; clobbers r0-r3, NZCV, lr
details: "Reads the current navi slot from oBattleState_Unk_0d (offset 0x0D of the battle-state ptr stored at oToolkit_BattleStatePtr\
  \ in the toolkit), indexes a 12-byte-per-entry attribute array (12 = '0xc') passed in r0, and copies selected\
  \ bytes/dwords into the 32-byte navi display struct at eS20364C0 (offsets +0x04 sprite-selector, +0x08 palette/sub-type,\
  \ +0x0D flag, +0x14 and +0x1C tile-data words). The two halfwords at +0x14/+0x16 are then pushed to eStruct200A008\
  \ via setUnk04/setUnk06. Writes 'BATTLEDISPLAY_FLAG 0xE2' to +0x06 to flag the struct as active. After zero-filling\
  \ the struct it:\n  • Picks a tile-sheet source from TILE_SRC_TABLE indexed by the sprite-selector byte and CopyByEightWords\
  \ copies 0x360 bytes into the EWRAM staging buffer unk_2034B30.\n  • Reads a 12-byte (src, VRAM-dest, size) entry\
  \ from off_802C3FC indexed by the same byte and queues the portrait GFX.\n  • Queues the fixed background tile\
  \ transfer from off_802C424 (src dword_8732814 → unk_3001A80, 0x60 bytes, no scaling – R0*0x60+R1 path uses R0=0).\n\
  \  • Queues the extra tile-sheet transfer from off_802C448 (src dword_8732874 → 0x6009400, 0x5E0 bytes).\n  •\
  \ Calls GetCurPETNavi + getIndexed80hRecordPtr_8028164 and queues 0x80 bytes to VRAM 0x6014000.\n  • Calls GetCurPETNavi\
  \ + getPermutedRecord32_8028172 and queues 0x20 bytes to WRAM 0x30016B0.\nNotable quirk: the first QueueEightWordAlignedGFXTransfer\
  \ computes R0 = 0*0x60 + LD32(BG_XFER_ENTRY), i.e. the R0 mul-add path is dead code – the BG transfer always reads\
  \ the entry's first word as the source.\n\n\nCorrection (2026-10-13): the record is the battle result record,\
  \ not a navi attribute block. All four callers (sub_80094B6, sub_8009916, sub_8009C06, sub_8009F3A, battle-end\
  \ states that then wait on sub_802BD60) pass unk_2035260, which sub_800B444 fills from the received link payload\
  \ byte_203F4A4. Record +8 goes to eS20364C0+0x14 (0x020364D4) and its halfwords to eStruct200A008_setUnk04/_setUnk06\
  \ (0x0200A00C/0x0200A00E); vidsync saw the reward on the result screen and the reward given follow exactly these\
  \ words. The graphics part of the text above stands. Proposed name battle_setupResultScreen_802C34E. The rename\
  \ waits in symbols/pending_renames.txt: the subsystem farm's worktrees share bn6f and still hold copies of the\
  \ C that names this symbol, so renaming now would break their builds."
