name: battleObj_dispatchSubstate_803AA40
address: '0x0803AA40'
kind: function
status: confirmed
summary: Dispatches a battle-object handler based on its substate byte ([r5+8]) via a Thumb-mode jump
  table.
interface: void battleObj_dispatchSubstate(u32 r2, struct* r4, struct* r5, u32 r10, lr); // clobbers r0,r1,r2,r3,r8,r9,r11,r12,lr;
  nz,c,v
details: 'Reads an 8-bit substate/phase field from offset 0x8 of the battle-object struct passed in r5;
  uses a chain of cmp/branch instructions to map the substate to one of eight slots (states 0x3F/0x40/0x3C/0x3A/0x3B/0x3D/0x3E
  map to slots 0..6, anything else falls through to slot 7). The slot indexes the dispatch table at off_803AA80,
  whose entries hold the handler addresses stored with the Thumb bit set ("|1"); the chosen handler is
  invoked via an indirect BX (mov lr,pc / bx r0 trampoline), so each handler runs in Thumb mode and returns
  via the saved lr. Preserved across the call: r4-r7; the dispatch itself only reads, so callee-saved
  state in r5/r10 survives. The eight target handlers at sub_803AAA0, sub_803AAD8, sub_803AAF6, sub_803AB20,
  sub_803AB46, sub_803AB6C, sub_803AB94, sub_803ABB4 implement the per-substate logic.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
