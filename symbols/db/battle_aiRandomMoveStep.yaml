    timer branch decrements Timer and only acts when it goes negative (sub r0,#1; bge skip); on timeout:
    bl battle_applyElementAttackModIfEnabled_80CAD14 with r0=Param3,r1=Param4, then CurAction=0 and phase
    cleared; callee battle_aiPickMovePanels summary: ''picks two random destination panels for an AI battle
