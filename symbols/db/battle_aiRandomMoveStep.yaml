name: battle_aiRandomMoveStep
address: '0x080CAC00'
kind: function
status: probable
summary: AI handler that picks a random destination panel, waits a per-type delay, then performs the move
  and ends the action.
interface: (r5 = battle object) -> updates oBattleObject_CurPhase/Param3/Param4/Timer/CurAction; no return
  value
details: Runs one step of the object's phase state machine. On phase 0 it writes phase 4, calls the AI
  panel picker (results into Param3/Param4, likely destination row/col), calls the element-attack-modifier
  routine, and sets Timer from dword_80CAC40[Param1] (values 6,6,12,12 frames). On later phases it decrements
  Timer each frame; when it goes negative it calls the modifier routine again with r0=Param3, r1=Param4
  (the picked panel), writes 0 to CurAction and clears CurPhaseAndPhaseInitialized to finish the action.
