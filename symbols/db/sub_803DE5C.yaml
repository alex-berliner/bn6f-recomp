name: sub_803DE5C
address: '0x0803DE5C'
kind: function
status: hypothesis
summary: Sets the boolean flag at EWRAM 0x200A284 to 1 (true), with no other side effects.
interface: void setFlag_200A284(void)
details: 'Trivial one-store routine: loads the address of unk_200A284 (a single 32-bit field in EWRAM, used as a
  boolean flag) and writes the immediate value 1 to it, then returns. It takes no input registers (only LR for the
  return) and produces no output values; it clobbers r0, r1 and the NZ flags. Because the caller(s) were traced
  by the lifter, the flag variable is known to be read elsewhere, but nothing here indicates which game system owns
  it — the flag is most likely a global "request/enable" or "event happened" latch shared between modules. No other
  state is touched and no flags are set intentionally.

  '
