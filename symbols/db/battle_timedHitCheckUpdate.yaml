name: battle_timedHitCheckUpdate
address: '0x080D0168'
kind: function
status: confirmed
summary: 'Next-frame handler that drives a timed hit-check battle object through a 20-tick countdown: initializes
  phase, spawns a panel collision check at tick 15, plays the hit SFX at tick 10, and self-destructs at tick 0.'
interface: battle_timedHitCheckUpdate(u32 r5 /* BattleObject* */) -> (r5, r10) /* possibly re-read from PlaySoundEffect
  */
details: "Operates on a single BattleObject at r5, advancing its CurPhase/Timer state each frame.\nOn the first\
  \ call (CurPhase == 0) it sets CurPhase = 4 and Timer = 0x14 (20 ticks) then returns.\nSubsequent calls decrement\
  \ the 16-bit Timer and branch on the new value:\n  * Timer == 0xF (15): if Param2 is zero, calls battle_spawnSelfPanelCollisionRegion\
  \ (which may\n    relocate r5), then compares ExtraVars+4 -> byte 0x12 against the object's PanelX. If they\n\
  \    match, sets Param3 = 1 (hit confirmed).\n  * Timer == 0xA (10): if Param2 is zero, plays SFX ID 0x180 (hit\
  \ sound) via PlaySoundEffect,\n    passing r2 through. r5 and r10 are refreshed from PlaySoundEffect's clobbers.\n\
  \  * Timer <= 0: writes CUR_STATE_DESTROY into CurStateActionPhaseAndPhaseInitialized, signalling\n    the object's\
  \ main loop to tear it down.\nParam2 (non-zero) gates both the collision check and the sound, acting as a \"suppress\
  \ effects\"\nflag set by the caller before spawning the object.\nr2 is only forwarded to PlaySoundEffect; it is\
  \ not otherwise inspected.\n"
