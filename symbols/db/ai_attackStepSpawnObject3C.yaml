name: ai_attackStepSpawnObject3C
address: '0x081025DA'
kind: function
status: probable
summary: 'AI attack routine: winds up (anim 6), then at step 5 shakes the camera and spawns attack object
  0x3C on the panel in front of the user, ending after 18 steps by flagging the hit.'
interface: (r0 unused on entry; r5 = battle object, r7 = AI attack vars) -> r0 = trash; updates oAIAttackVars
  state fields and spawns an attack object
details: 'This is a per-frame step handler for one enemy AI attack, driven by oAIAttackVars. On the first
  call (AttackElement == 0) it enters the wind-up: sets the object''s CurAnim to 6, clears StepTimer,
  restarts the temp attack object''s animation via battle_setObjectAnim, sets counter time 0x10, and stores
  4 into AttackElement to mark the active phase. On later frames it increments StepTimer; when the timer
  is exactly 5 it triggers a camera shake (magnitude 1, duration 0x14), gets the object''s facing direction,
  and calls battle_spawnObject3COnPanel at PanelX+direction, PanelY with element/damage parameters (r4
  = AttackBoost2, r6 = Damage, r2 = 0, r3 = 0x18<<16). When the timer reaches 0x12 it stores 8 into HitElement,
  presumably so the shared attack code applies the hit, and the routine returns until reset.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] / strb #4 selects init vs. active phase of the attack
    state machine; mov r0,#6; strb [r5,#oBattleObject_CurAnim] plus battle_setObjectAnim on the AIData
    temp attack object is a wind-up animation; camera_initShakeEffect(1,0x14) and object_getFrontDirection
    before battle_spawnObject3COnPanel place the attack on the adjacent front panel; StepTimer counts
    to 0x12 then writes 8 into oAIAttackVars_HitElement, the standard way these AI attack steps hand off
    to the hit phase; callee battle_spawnObject3COnPanel is documented as spawning kind 0x3C with panel,
    element, damage and alliance fields filled in'
