name: battle_countHandEntryData
address: '0x080E4566'
kind: function
status: probable
summary: 'Returns a count derived from a battle hand slot: for a mode-2 selection it scans halfwords in
  the hand entry until the 0xFFFF terminator, otherwise returns a cached byte from the object.'
interface: (r0 = battle object; [r0+0x58] = pointer to a state struct whose byte 0 is a mode, [r0+0x16]
  = hand slot index, [r0+0x1a] = cached count) -> r0 = count of halfwords before 0xFFFF (or cached byte);
  flags clobbered
details: If the pointer at +0x58 is null it returns 0. When the mode byte at [ptr] equals 2, it takes
  the hand slot address (via getBattleHandAddr on the index at +0x16, array at 0x20349C0, 0x50-byte stride),
  reads the byte at offset 0 of that slot, and seeks to offset 2 + 2*byte within the 0x50-byte entry.
  From there it counts halfwords until it hits 0xFFFF (0x80E4630) and returns that count. If the mode
  byte is anything other than 2, it simply returns the byte at object+0x1a, which is presumably a cached/stale
  version of the same count. The 0x50-byte hand entry thus contains a byte header followed by a 0xFFFF-terminated
  halfword list whose meaning (codes, tags, sub-data) is not shown here.
