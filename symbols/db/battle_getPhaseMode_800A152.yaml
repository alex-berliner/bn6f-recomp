name: battle_getPhaseMode_800A152
address: '0x0800A152'
kind: function
status: confirmed
summary: Returns a small battle-phase/mode id (0/1/2/7) derived from the current battle state's phase flags, returning
  0 while time is stopped.
interface: int sub_800A152(void *r10_toolkit /* lr must be a valid return address */); out r0 = mode id, r1 = last
  phase-flag byte read, r2 = battleState+0x0d byte; NZ flags reflect the last tested byte (or the time-stop result)
details: "Reads the toolkit's battle state pointer (r10 + oToolkit_BattleStatePtr) and inspects\nfour battle-state\
  \ bytes to classify the current phase of the battle:\n  - oBattleState_Unk_04 (flag A), oBattleState_Unk_05 (flag\
  \ B),\n    oBattleState_Unk_0b (flag C) and oBattleState_Unk_0d (a \"done/finished\" byte).\nDecision table:\n\
  \  - battle_isTimeStop() nonzero (custom/scrolling-screen time stop) -> returns 0\n    immediately without touching\
  \ the battle state.\n  - flag A (+4) clear:  returns 2 normally, 1 once byte +0x0d is set.\n  - flag A set, flag\
  \ B (+5) clear: returns 1 normally, 2 once +0x0d is set.\n  - flag A set, flag B set: returns 7 if flag C (+0x0b)\
  \ is set, otherwise 0.\nSide effects on registers: r2 always holds the +0x0d byte, r1 holds the last state\nbyte\
  \ read (flag A, then flag B, then flag C), and NZ flags are set from the last\nTST of that byte — callers appear\
  \ to consume these register/flag side effects\n(the register contract lists r0/r1/r2/lr as outputs and nz as clobbered,\
  \ so the\nfunction doubles as a cheap \"test the phase byte\" helper for its callers).\nNo memory is written;\
  \ purely a read/classify routine over the battle state.\nThe exact meaning of mode ids 1/2/7 (likely intro/turn-phase/custom-screen\n\
  transitions in the battle loop) is inferred from the flag combinations, not\nconfirmed against in-game behaviour.\n"
