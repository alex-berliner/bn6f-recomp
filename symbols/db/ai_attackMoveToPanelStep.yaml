name: ai_attackMoveToPanelStep
address: '0x08100C48'
kind: function
status: probable
summary: 'AI attack state handler: picks a target panel via a callback, moves the object onto it (reserving
  it), then after a short delay flags a hit with element 4.'
interface: (r0 = unused on entry; r5 = battle object, r7 = oAIAttackVars, PanelChooseCallback in r7) ->
  void; clobbers r0-r3, lr
details: On first entry (AttackElement == 0) it writes element 4 into oAIAttackVars_AttackElement, then
  if object_canMove passes it loads a 2-word argument pair from byte_8100CA8 indexed by Alliance*8 and
  tail-calls the stored PanelChooseCallback (lr=pc, bx). The callback returns the chosen panel X in r0
  (must be nonzero) and Y in r1, which are stored into oBattleObject_FuturePanelX/Y; the function then
  claims the panel via object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, sets CurAnim=4,
  marks HasMoved=1 and StepTimer=2. On later calls (AttackElement != 0) it just decrements StepTimer and,
  when it reaches 0, writes HitElement=4. If the object cannot move or the callback fails (returns 0),
  it clears HasMoved and calls object_exitAttackState. The per-alliance table's words (0x10/0x0F8800A0,
  0x30/0x0F880080) are opaque callback arguments, not pointers in any obvious space.
