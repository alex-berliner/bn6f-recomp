    r0/r1 results are stored to FuturePanelX/Y; bl object_reservePanel; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE;
    bl object_setFlag1 — claims the target panel and locks sliding during the move; strb r0,[r5,#oBattleObject_CurAnim]
