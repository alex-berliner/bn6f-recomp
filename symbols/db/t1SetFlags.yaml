    wf investigate investigate-20261021-023329'
open_questions:
- What other callers exist that pass flag values other than 1 (which would confirm the 'any-bit OR' interpretation
  vs. specifically 'mark done')?
- What is the full layout of the byte_200AF80 block — what are offsets 0,2,3,4 used for?
- Is bit 0 specifically 'sequence complete', or is this a general flag set used with other bit values
  elsewhere?
