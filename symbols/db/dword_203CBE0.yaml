name: dword_203CBE0
address: '0x0203CBE0'
kind: ram
previous_names: []
status: probable
summary: Word 0 of the outgoing battle link packet, a tag naming what the packet carries (0x12345678 the battle-start
  state, 0x1F2F3F4F the result record, ...); it is sent last, so the receiver waits for it to know the packet arrived.
details: 'The packet starts here and its payload follows at dword_203CBE4 (+4). Every writer fills the payload,
  stores a

  tag word here, then calls battle_requestSetBattleMode_80200A4(N), which stores N in eStruct203F7D8+3 and sets
  bit

  0 of eStruct203F7D8+2. N is the packet''s length in words, tag included (see the sizes below), so that function

  is misnamed. The transfer builders sub_801FF18 and sub_801FFD6 then decrement eStruct203F7D8+3 and put

  dword_203CBE0[count] into the outgoing record (eStruct2036780+8), one word per frame, highest index first;

  the tag word goes out last.


  | writer | tag | N | payload |

  |---|---|---|---|

  | battle_initBattleStateBuffer_800B144 | 0x12345678 | 0x3E | +4 ePrimaryRngSeed, +8 BattleSettings ptr, +0xC Navi
  stats (0x64 bytes), +0x70/+0x98 two 0x28-byte blocks, +0xC0..+0xF4 (last word +0xF4 = 62 words) |

  | battle_backupStateForRestart_800B3A2 | 0x56789123 | 0x32 | 0x50 + 0x64 + 0x10 bytes from +4 (to +0xC8 = 50 words)
  |

  | sub_800B428 | 0x1F2F3F4F | 4 | the 12-byte result record sub_802C8FA writes at +4 |

  | sub_800B484 | 0xF1F1F1F1 | 0x10 | 0x3C bytes from byte_203F6D0 at +4 |

  | sub_800B4B2 | 0xA9B8C7D6 | 3 | two words at +4, +8 |


  The receiving side checks the tag: battle_doBothTrackedIdsMatch_800B46C(tag) is TRUE when dword_203F4A0 and

  dword_203F5A0 (word 0 of the two received packets) both hold it; battle_state_finishBattlePhase_80079d0 waits
  for

  0x12345678 (asm00_1.s:10145) and two other battle states wait for 0x1F2F3F4F (asm00_1.s:13829, 14428).

  chatbox_resetPrinterState_801FE00 clears the packet (ZeroFillByEightWords(dword_203CBE0, 0x100)) together with

  dword_203F4A0 (0x200) and eStruct203F7D8.


  vidsync (docs/vidsync/RANDOM_EVENTS.md section 1): in single player the packet comes back through a loopback into

  dword_203F4A0; the seed (word 1) reaches 0x0203F4A4 about 61-62 frames after phase 4 and the tag one frame later.

  vidsync''s RNG fixes write the seed word at +4 (dword_203CBE4, runtime evidence there); it never reads or writes

  this word.

  '
