name: ai_setChipUseDelay
address: '0x08011F84'
kind: function
status: probable
summary: Sets the AI attack-state chip-use delay counter to 40 and returns 0x58 to the caller
interface: (r7 = pointer to AI attack vars struct, no other args) -> r0 = 0x58; flags from the mov (no
  meaningful compare)
details: 'A two-effect helper: it stores the immediate 0x28 into the byte field oAIAttackVars_ChipUseDelay
  of the struct at r7, which the project has already labeled as part of the AI attack vars (the delay
  before the AI uses its chip), then loads 0x58 into r0 and returns. The returned 0x58 looks like a state/opcode
  value consumed by an AI dispatch loop, but with no caller known its meaning is unverified. There is
  no branch logic; it always performs the same store and return. Thumb, falls through to mov pc, lr.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strb r0, [r7,#oAIAttackVars_ChipUseDelay] with r0=0x28 directly writes the already-named chip-use-delay
    field; the 'ai' prefix matches the existing oAIAttackVars_* structure naming for this subsystem; mov
    r0,#0x58 immediately before mov pc,lr shows the function's second job is returning the constant 0x58
  refs:
