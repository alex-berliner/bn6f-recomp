name: sprite_stepZoomShrinkOut_811976C
address: '0x0811976C'
kind: function
status: confirmed
summary: One step of a sprite's shrink-zoom animation, snapping scale back to normal and clearing the scaling state
  once the zoom finishes.
interface: void sub_811976C(sprite state record *r5 /* also uses r4, r6, r7 live-in from caller context */); clobbers
  r0-r3, lr; sets flags from the called sprite routines (nz c v)
details: "Operates on a sprite state record passed in r5:\n  +0x00 (byte): state flags — sets bit 0x02 (\"scale\
  \ in progress\") on every call.\n  +0x09 (byte): animation/frame counter — cleared to 0 when the zoom ends.\n\
  \  +0x12 (byte): current scale value — decremented by 0x30 per step.\nPer step: scale -= 0x30. If the (signed\
  \ 32-bit) result is still > 0x40,\nsprite_setScaleParameters(0, newScale, 0x40) applies the intermediate scale.\n\
  If it drops to 0x40 or below (including wrapping below 0, e.g. from 0x20 to\n0xF0 which compares as > 0x40 unsigned\
  \ but is negative signed — actually a\nwrapped small start value would read as large positive; the signed compare\n\
  treats the 32-bit subtract result, so a wrap to e.g. 0xFFFFFFC0 is negative\nand terminates), the zoom is finished:\
  \ scale byte is reset to 0xC0 (the\ndefault/rest scale), the counter at +0x09 is cleared, and\nsprite_makeUnscalable(0)\
  \ removes the sprite's scalable flag.\nr4/r6/r7 are read in per the contract but not used by this body — they\
  \ are\npreserved, likely part of a larger caller-owned state block.\nN/Z/C/V flags on return come from the last\
  \ called sprite routine.\n"
