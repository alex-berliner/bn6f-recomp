name: battle_canAllianceAct_800A772
address: '0x0800A772'
kind: function
status: confirmed
summary: Checks whether one alliance (player or opponent) is currently allowed to act, gating on a chip lockout
  timer and a battle-state permission flag.
interface: 'int battle_canAllianceAct(u32 alliance /* r0: 0 = player, nonzero = opponent */, BattleObject* obj /*
  r5 */); returns r0 = 1 if allowed, 0 if not; r1 = tested flag (or lockout timer on the early-out path), r2 = caller''s
  r0'
details: 'Reads the battle object''s AI data pointer (r5 + oBattleObject_AIDataPtr) and its oAIData_ChipLockoutTimer
  byte; if that timer is nonzero, returns 0 immediately (r1 left holding the timer value as a side effect). Otherwise
  calls battle_getStateUnk5c_800139A to fetch the battle state''s Unk_5c flag word, picks the side''s bit from the
  caller''s r0 (0 -> bit 2 / 0x04 for the player alliance, anything else -> bit 3 / 0x08 for the opponent alliance),
  and returns 1 if that bit is set, 0 if clear. Current knowledge is that the Unk_5c bits are never unset once set,
  so the flag likely acts as a per-side "turn/action granted" latch. The alliance selector is also passed back out
  in r2; the early-out path leaves r2 untouched (still the caller''s value per the contract). Uses push/pop of r0
  around the call to preserve the caller''s argument across the scratch call.

  '
