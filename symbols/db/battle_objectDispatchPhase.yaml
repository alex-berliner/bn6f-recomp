name: battle_objectDispatchPhase
address: '0x080BEBBC'
kind: function
status: probable
summary: Calls one of the battle object's two phase handlers selected by oBattleObject_CurPhase.
interface: (r5 = battle object) -> calls handler for phase (0 -> sub_80BEBD8, 1 -> sub_80BEC40); r0 =
  phase passed through as caller-side arg.
details: 'A tiny state-machine dispatcher: it loads the object''s current phase from [r5,#oBattleObject_CurPhase],
  uses it to index a 2-entry jump table at off_80BEBD0, and does a long-call (mov lr, pc; bx r1, Thumb-bl-style)
  to the selected handler with the phase still in r0. The table has exactly two entries, so this object
  has two phases. No result is consumed and no other state is touched here, so it is purely a per-phase
  update/step trampoline typical of BN6 battle objects.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase] then ldr r1,[r1,r0]: phase indexes the handler table;
    off_80BEBD0 has exactly two words (sub_80BEBD8+1, sub_80BEC40+1), so phases 0/1 only; mov lr, pc;
    bx r1 is the standard Thumb indirect long-call used to run the handler; no stack frame beyond lr and
    no other register setup: pure dispatch'
  refs:
  - bn6f/asm/asm31.s:14776
  reproduce: python3 tools/asmcat.py 0x080BEBBC
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- No callers known, so we cannot tell which object type this belongs to or when it runs each frame
- The two handlers sub_80BEBD8 and sub_80BEC40 are unanalyzed; knowing what they do would name the object
  and the phases
