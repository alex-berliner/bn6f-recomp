    \  - `bl sprite_loadAnimationData` and `bl sprite_noShadow` chain the standard \"load and finish sprite\
    \ setup\" sequence.\n  - `bl object_getFrontDirection`; then `ldr r1,[r5,#oBattleObject_ExtraVars];\
    \ mul r0,r1; str r0,[r5,#oBattleObject_XVelocity]` computes a facing-aware initial velocity from a\
    \ per-object scalar in ExtraVars.\n  - `ldr r0,dword_80E3D38; svc 6` is the only SVC in this function;\
