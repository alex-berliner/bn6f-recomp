open_questions:
- The exact meaning of the ExtraVars scalars (`[r5,#ExtraVars+4]` and `[r5,#ExtraVars]`) is not visible
  here; likely passed by the constructor before calling this init. Tracing the caller at 0x80E3B7C would
  settle which fields of the related-object spawn template they correspond to.
- Which sprite asset (0x10/0x27) this loads — likely a sword/lance-like projectile given the "extra-velocity
  from facing direction" pattern (compare to SnakeArm/Bass chip handlers in BattleObject.inc, e.g. `SNAKEARM_EV_*`),
  but the value 0x27 isn't labeled in the header.
- Whether the svc 6 read cycles or is a profile/timer SVC and which constant dword_80E3D38 represents
  (0x280000 looks like a CPU/clock divisor, not a duration).
