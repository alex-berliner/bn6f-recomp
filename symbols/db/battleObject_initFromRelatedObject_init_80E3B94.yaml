status: probable
summary: 'Initialize a battle object from its related object''s spawn template: sync panel coords, load
  its sprite, set it to face the related object, give it initial velocity/movement timer, register it
  as the related object''s pointer, play sound effect 0x0E, and advance to CUR_STATE_UPDATE.'
interface: '(r5 = self BattleObject*, lr = return to caller) -> r5 = same self, r10 preserved ; side effects:
  writes self''s Coords/PanelXY, sprite slot, animation index, palette, XVelocity, Timer2, Header.Flags
  (sets OBJECT_FLAG_VISIBLE bit 2), and points the related object to self; plays SFX 0x0E'
details: "1. Calls object_setCoordinatesFromPanels(r5) to refresh X/Y from current panel position.\n \
  \ 2. Copies self.PanelXY into the u16 pointed to by self.ExtraVars+4 (a per-object scratch slot).\n\
  \  3. Calls sprite_load(0x80, 0x10, 0x27, r5) to load sprite resources 0x10/0x27 into the object's sprite\
  \ slot.\n  4. Stores 0 into self.CurAnim, calls sprite_setAnimation(0) and sprite_loadAnimationData\
  \ to bind animation 0's frames.\n  5. sprite_noShadow() disables shadow rendering; sprite_setPalette(0)\
  \ assigns palette 0.\n  6. Calls object_getFrontDirection() to get +/-1 facing direction (signed r0).\n\
  \  7. Multiplies it by the value at self.ExtraVars (a per-object signed scalar loaded from ExtraVars\
  \ into r1) and stores the result in self.XVelocity, giving the object an initial horizontal velocity\
  \ pointing toward its ally.\n  8. svc 6 (CPUReset?) with r0 = dword_80E3D38 (0x280000, likely a frequency/timer\
  \ constant), capturing the result's low halfword into self.Timer2 to drive the move/spawn animation\
  \ length.\n  9. Sets OBJECT_FLAG_VISIBLE (bit 1) plus bit 2 (OBJECT_FLAG_PAUSE_UPDATE?; 0x02 OR 0x03\
  \ is used here) in self.oObjectHeader_Flags so the sprite is shown but won't update until flag is cleared.\n\
  \ 10. Points self.RelatedObject1Ptr's oObjectHeader pointer to self (i.e. registers self as the related\
  \ object's child/object pointer — this is what stores related->header = self).\n 11. PlaySoundEffect(0x0E\
  \ + 0xFF = 0x10E after `add r0,#0xff`) plays a \"spawn/appear\" sound effect (sound 0x0F: a typical\
  \ SE id from `sound_data`).\n 12. Writes CUR_STATE_UPDATE (4) into self.CurStateActionPhaseAndPhaseInitialized\
  \ so the battle loop will advance past the init phase next frame.\ndetails_extra:\n  - The captured\
  \ call lr=0x080e3b7c across all story2 frames shows this is reached from a single call site (the init\
  \ helper at 0x80E3B7C) regardless of which story2 stage triggers it. r0/r1 on entry are zero/instr-pointer-and-flag\
  \ which `push {r4,lr}` then `bl`-style flow through, but more likely r0/r1/r3 are non-meaningful: r1=0x080e3b95\
  \ is a Thumb-ified code pointer (this function's address with thumb bit set), r2=0x02036778 a heap-ish\
  \ pointer the caller passes through, r3=4 or 0xC (parameter to internal sub). At exit r0=4 mirrors the\
  \ CurState CUR_STATE_UPDATE assignment.\n"
