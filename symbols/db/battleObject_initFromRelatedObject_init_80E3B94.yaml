    \ r0,r1(2); strb r0,...` sets OBJECT_FLAG_VISIBLE (bit 1) and bit 2.\n  - `ldr r0,[r5,#oBattleObject_RelatedObject1Ptr];\
    \ str r5,[r0,#oBattleObject_ObjectHeader]` registers self into the related object's header pointer.\n\
    \  - `mov r0,#0xf; add r0,#0xff; bl PlaySoundEffect` plays SFX 0x10E (0xF + 0xFF), the typical \"\
    spawn\" cue.\n  - Final `str r0,#oBattleObject_CurStateActionPhaseAndPhaseInitialized` with r0=CUR_STATE_UPDATE\
    \ (4) transitions out of init."
