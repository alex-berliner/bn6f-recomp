    — The code matches the proposed behavior almost exactly: it decrements oBattleObject_Timer, returns
    if still >0; on expiry calls object_setCollisionRegion(1), decrements ExtraVars, reloads Timer with
    8, and when ExtraVars hits 0 sets CurAction=8, clears CurPhaseAndPhaseInitialized, and negates XVelocity.
    The ''keeps region 1 for ExtraVars*8 frames'' phrasing is slightly off — ExtraVars is the number of
