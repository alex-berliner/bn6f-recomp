  date: '2026-10-19'
  detail: bne locret exits until oBattleObject_Timer hits 0, then Timer is reloaded with 8 each cycle;
    bl object_setCollisionRegion with r0=1 selects collision region 1 once per 8-frame cycle; oBattleObject_ExtraVars
    counts the cycles; only when it reaches 0 does state change happen; state change stores CurAction=8,
    clears phase, and negates oBattleObject_XVelocity (reverse motion); callees only object_setCollisionRegion,
    whose summary matches region-index + collision-data use
