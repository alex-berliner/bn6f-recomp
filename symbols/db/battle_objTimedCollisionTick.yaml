name: battle_objTimedCollisionTick
address: '0x080CE9DC'
kind: function
status: probable
summary: Per-frame handler that keeps a battle object's collision region 1 active for ExtraVars iterations
  of 8 frames each, then sets action 8 and flips horizontal velocity.
interface: (r0 = region index 1, r5 = battle object) -> void; no meaningful return
details: Runs once per frame with the battle object in r5. It decrements oBattleObject_Timer; while the
  timer hasn't expired it just returns. When the timer reaches 0 it calls object_setCollisionRegion(1)
  — enabling/selecting collision region 1 — decrements oBattleObject_ExtraVars as a repeat counter, and
  reloads Timer with 8. Once ExtraVars is exhausted, it stores CurAction = 8, resets CurPhaseAndPhaseInitialized
  to 0, and negates oBattleObject_XVelocity, so the object flips horizontal direction for its next action.
  Effectively a countdown that keeps the object solid for a fixed duration before bouncing it back.
evidence:
