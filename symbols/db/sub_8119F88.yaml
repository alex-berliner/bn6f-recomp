name: sub_8119F88
address: '0x08119F88'
kind: function
status: confirmed
summary: Zeroes an object's two sprite tile blocks in object VRAM so its graphics slots can be reused.
interface: void sub_8119F88(void* r5 /* object */); // reads [r5+5] (resource id); preserves r0 and r3 for the caller
details: 'Takes an object pointer in r5 and reads the resource-id byte at [r5+5]. That byte indexes a table of pointers
  (off_8119FD0, four entries), and each resource entry holds the starting tile index of two VRAM blocks: word +0
  (e.g. 0xC0) for block 1 and word +8 (e.g. 0x170) for block 2. Each tile index is multiplied by 32 (lsl #5) and
  added to vObjectTiles, then the helper ZeroFillByEightWords is called to wipe the block: block 1 is 0xA00 bytes
  (80 tiles), block 2 is 0x780 bytes (60 tiles). This frees the object''s character/tile slots when an object (e.g.
  an NPC or battle entity) releases its graphics, letting the next allocation reuse the tiles. The pushes/pops around
  the calls only shuffle r0/r1; the caller''s r0 and r3 are explicitly restored/preserved across the routine.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
