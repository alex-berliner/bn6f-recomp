    run wf investigate investigate-20261019-003606'
open_questions:
- What object 0xB7 actually is (sprite/behavior) depends on object_spawnType3's argument mapping
- What field of the parent r7 points to and what flag 0x10 means exactly need the parent struct layout
  or more callers
- Why 'mov r0, r5' clobbers the spawn result — whether the return value in r0 is meaningful to the caller
