name: battle_condDispatchRelatedPhase_80E527A
address: '0x080E527A'
kind: function
status: confirmed
summary: Conditionally runs the battle object's phase handler unless its related object is performing action 4 or
  has the 0x80010000 collision-flag condition.
interface: void sub_80E527A(u32 r5_object, u32 r10_ctx); // passes r5/r8-r12 through to object_dispatchPhaseHandler;
  outputs r5,r8-r12 (pass-through of callee result or unchanged inputs), clobbers flags
details: 'Small thunk that sits immediately before object_dispatchPhaseHandler and shares its code path (the two
  fall together; callers land here or at the dispatch routine depending on flow). It loads the object''s RelatedObject1Ptr
  from the battle object struct (r5 + oBattleObject_RelatedObject1Ptr) and checks that object''s CurAction byte:
  if it equals 4, the dispatch is skipped entirely. Otherwise it follows the related object''s CollisionDataPtr
  and tests oCollisionData_ObjectFlags1 against dword_80E546C = 0x80010000 (two bits/fields, one possibly a signed/upper-word
  condition); if either is set the dispatch is also skipped. In game terms this appears to gate the object''s per-phase
  update on the state of a linked object (e.g. suppress normal phase processing while the related object is in a
  special action state or flagged as e.g. invulnerable/intangible by collision data). When the gate passes, it tail-calls
  object_dispatchPhaseHandler with r5 (the object) still set; the callee''s outputs r5, r8, r9, r10, r11, r12 are
  returned verbatim to this function''s callers. When the gate blocks, all output registers keep their incoming
  values. r10 is read by object_dispatchPhaseHandler directly from the live register (handler context), so it must
  not have been clobbered before entry. Flags NZCV are clobbered by the compare/test and callee.

  '
