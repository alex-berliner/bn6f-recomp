name: ow_deleteMapObject
address: '0x080AA36C'
kind: function
status: probable
summary: Thin wrapper that frees an overworld map object, forwarding the argument to FreeOverworldMapObject.
interface: (r0 = pointer/handle to overworld map object to delete) -> r0 = whatever FreeOverworldMapObject
  returns; flags from callee
details: 'The function is a 4-instruction trampoline: it saves r4-r7 and lr purely for ABI alignment,
  tail-branches nothing, and simply calls FreeOverworldMapObject with r0 unchanged, then returns. All
  actual work — clearing the active bit in the global allocation bitfield, marking the slot free, and
  unmarking the sprite — happens in the callee. Since r0 is passed through untouched, this is likely an
  object-class delete method or a callback shim invoked with the object pointer.'
