name: text_ReadNextChar_814FE34
address: '0x0814FE34'
kind: function
status: confirmed
summary: Reads the next character byte from a text script and stores it into the text state's current-character
  field, advancing the script pointer.
interface: 'u32 text_ReadNextChar(u32 state /*r1*/); // out: r0 = advanced read pointer, r2 = char read, NZCV from
  the pointer increment'
details: 'r1 points to a text-script state structure. Loads the current read position from state+0x40

  (u32), reads one byte from it (the character/script byte), and stores that byte to

  state+0x1E (the state''s current-character field). Then it increments the read pointer by 1

  and writes it back to state+0x40. The ADDS that performs the increment sets NZCV, so the

  carry/zero flags reflect the pointer arithmetic rather than any deliberate test value.

  Returns r0 = the updated read pointer and r2 = the byte read; the caller presumably uses r2

  (or the stored field) to decide how to interpret/emit the character. No memory beyond the

  state struct and the script buffer is touched; no other registers clobbered.

  '
