name: sub_81244EC
address: '0x081244EC'
kind: function
status: hypothesis
summary: Per-frame update for an entity field-effect, packaging a render descriptor, decrementing a duration timer
  and rolling into the next (state, duration) pair when it expires.
interface: "void entityUpdate_81244EC(void /* r5 = entity*, r10 = ? */);\n    // in:  r5 = entity state struct (fields\
  \ +0xC active flag, +0xD state id,\n    //         +0x12 timer/duration, +0x14 index), r10 = unknown caller-saved\
  \ ptr\n    // out: r5 preserved\n    // clobbers: r0-r3, LR; trashes NZCV\n    // preserved: r4-r7\n"
details: 'Bails out immediately if the entity''s +0xC active flag is unset, so call sites can

  invoke it unconditionally each frame. Otherwise it builds an OAM/effect

  descriptor of the form 0x40000 | (LD16(+0x14) * 0x10 + 0x30) — the 0x30 stride

  plus a 0x40000 base is consistent with a Sprite/affine index field — and hands

  it to sub_811FAF4 along with r1 = 0x10002 (palette/priority bits), the current

  state byte from +0xD, an animation-table pointer in byte_8123F34, and r4 forced

  to 0x40000000. That helper is therefore the field''s frame dispatcher.


  It then decrements the 1-byte duration counter at +0x12; while non-zero the

  function returns. On expiry it calls sub_8120CC8 with the dword at

  dword_8123F3C (a state-machine table) which returns the next state id in r0

  and the next duration in r1, storing them back into +0xD and +0x12 to start

  the next animation phase.


  The r10 input is not touched in the body; it is presumably required by

  sub_811FAF4 (passed through LR/r10 register window). Register r4 is treated

  as a globally-saved scratch and explicitly restored across the call.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
