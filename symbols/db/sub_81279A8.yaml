name: sub_81279A8
address: '0x081279A8'
kind: function
status: confirmed
summary: Returns 1 if all gated story-event flags are satisfied (or none are outstanding); returns 0 as soon as
  an unset event with the 0x80 'blocking' attribute is found.
interface: u32 story_checkEventGate(void) /* r0 = 0 or 1; nz reflect r0; r4–r7 preserved; clobbers r0–r3, lr */
details: 'Reads entry count from dword_2001140. Iterates i = 0..count-1 over byte_2006530 (story-progress table).

  Each byte is converted to a flag index by adding 0x1DA0 and passed to TestEventFlag.

  If the flag is already set (Z clear), the entry is skipped.

  If the flag is NOT set (Z set), the parallel attribute table byte_812851C is consulted at offset 4*entry_byte;

  bit 0x80 in that byte marks the event as a hard gate.

  Finding any such unset-but-gated event immediately returns 0.

  If the loop completes with no blockers (or count == 0), returns 1.

  '
