open_questions:
- What the two callees (sub_801A3DA, sub_801A400) actually do (e.g. spawn shatter animation vs.
- transform to normal panel). What the exact meaning of AIData+0x38 is (it is the field labeled
- Unk_38 in the project struct). Whether the second branch (loc_801A38A path) also clears
- OBJECT_FLAGS_FROZEN bit 16 (0x10000) — only the 0x80000 bit is cleared in the visible code, so
- perhaps the frozen-bit clear happens inside sub_801A3DA.
