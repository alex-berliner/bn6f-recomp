name: ClearAIData_Unk_44_Flag
address: '0x0800FFEE'
kind: function
status: confirmed
summary: Clears the bit(s) selected by the mask in a battle object's AI-data flags word at offset Unk_44, likely
  releasing an AI state/condition flag mid-battle.
interface: void ClearAIData_Unk_44_Flag(u32 mask /* r0 */, BattleObject *obj /* r5 */); returns updated flags in
  r1, AI data pointer in r3, NZ flags set on the updated value; tail-calls via lr.
details: 'Loads the battle object''s AI data pointer from oBattleObject_AIDataPtr (r5), reads the 32-bit field at
  oAIData_Unk_44, clears exactly the bits set in r0 (bic), and stores the result back. This is the counterpart to
  the "set" variant of the same flag word: Unk_44 appears to be a bitmask of per-object AI state flags that other
  AI routines test. Notably it leaves r1 holding the new value and sets NZ on it, and returns r3 pointing at the
  AI data, so callers can immediately test the result or keep working with the AI data pointer without reloading
  it. The function is a tiny tail-returned helper (mov pc, lr) and preserves nothing else but needs nothing preserved
  since it only touches r1/r3 which are its outputs.'
