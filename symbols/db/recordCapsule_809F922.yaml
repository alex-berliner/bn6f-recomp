name: recordCapsule_809F922
address: '0x0809F922'
kind: function
status: confirmed
summary: Appends a capsule/Navi ID to the cap-table at 0x2000210 (up to 16 entries) if event flag 0x1708
  is clear.
interface: '// Preserves r4,r6,r7. NZCV/r0/r1/r3/lr clobbered.

  // r5 in: value to record

  // r10 in: ignored by body (kept by contract convention)

  // returns r3 unchanged for caller

  void recordCapsule_809F922(u32 capsuleId /* r5 */);

  '
details: "Guards on EVENT_1708: TestEventFlagFromImmediate is called first; if the\nflag is set the function\
  \ early-returns (no push/pop side effects beyond the\nprologue).\n\nPersistent cap-table lives at byte_2000210:\n\
  \  +0x00 : u8   nextFreeSlotIndex  (0..0x10)\n  +0x10 : u32[16] capsule entries\n\nReads the slot index;\
  \ if it is >= 0x10 the function returns without storing.\nOtherwise it bumps the index and writes r5\
  \ into\n`byte_2000210 + 0x10 + slot*4` as a 32-bit value.\n\nThe use of r5 + the EVENT_1708 gate + 16-entry\
  \ capped append strongly\nsuggests this is the Navi/Capsule registration buffer used by the CapColle\n\
  / \"Lib\" uplink tutorials (the 0x10 cap matches the chip/soul-screen\nprogress helpers in bn6f).\n\n\
  Register form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
