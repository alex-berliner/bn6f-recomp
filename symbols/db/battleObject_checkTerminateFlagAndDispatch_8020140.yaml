open_questions:
- Exact semantics of the 0x0C value at 0x200BC30 and of dispatch_803C620's return (the byte stored into
  0x2038161). Knowing what the dispatch computes and what "BattleTerminate01" toggles in the larger battle
  frame would confirm whether this is a "request battle-end" path or a generic state-bump.
- Identities of `sub_813D66C` and `dispatch_803C620` are unknown; they are likely the actual story-state
  or chip-select state machines whose outcome drives 0x2038161.
- Whether `r7` is the only true callee-saved used (the broader `out` likely comes from the callees, not
  this wrapper).
