name: rfu_initREQ
address: '0x08144DF0'
kind: function
status: probable
summary: Initializes the wireless adapter's REQ request-management state, filling its work struct and
  installing the MSC/REQ callbacks.
interface: (r0 = nonzero param, likely retry/count; r1 = second param) -> r0 = 0 on success, 4 if r0 ==
  0; flags clobbered
details: Validates r0 and returns 4 immediately if it is 0. Otherwise it fills the first 0x24 words of
  the RFU work struct eStruct200FE00 with zero via SWI_CpuSet in fixed-source mode (0x1000024), sets byte
  200FE06 to 0xFF, and stores the two arguments at offsets 0x40 and 0x44. It then registers sub_8145D54
  as the MSC callback and rfu_handleConnectionEvent as the REQ callback via rfu_setMSCCallback/rfu_setREQCallback,
  and returns 0. This matches librfu's REQ-subsystem initializer, which must set both callbacks before
  any REQ can be issued.
