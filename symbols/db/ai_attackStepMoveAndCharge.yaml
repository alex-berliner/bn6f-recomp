name: ai_attackStepMoveAndCharge
address: '0x0810379E'
kind: function
status: probable
summary: 'Per-frame AI attack step: enemy hops to its target panel and, after a 3-frame delay, signals
  the attack hit.'
interface: (r0 = element? read from [r7+oAIAttackVars_AttackElement], r5 = battle object ptr, r7 = AI
  attack vars) -> void; updates AttackElement, CurAnim, PanelX/Y, flags, StepTimer, HitElement
details: 'Runs as a state handler over an AI attack-vars struct (r7) and battle object (r5). If oAIAttackVars_AttackElement
  is zero it begins the attack: sets AttackElement = 4 and CurAnim = 3 (lunge/charge animation), copies
  FuturePanelX/Y into PanelX/Y, then calls object_removePanelReserve, object_setCoordinatesFromPanels
  and object_updateCollisionPanels to commit the move; it clears ObjectFlags1 bit 0x40 and sets bit 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT,
  and sets StepTimer = 3. On later frames it decrements StepTimer; when it reaches zero it stores 0x24
  into oAIAttackVars_HitElement, presumably a marker consumed by the next AI attack phase to apply the
  hit.'
