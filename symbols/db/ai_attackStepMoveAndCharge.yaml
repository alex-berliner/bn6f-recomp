- method: assembly-reading
  date: '2026-10-18'
  detail: tst r0, r0 / bne loc_81037D6 splits first-call init from per-frame countdown on [r7,#oAIAttackVars_AttackElement];
    strb FuturePanelX/Y -> PanelX/Y then bl object_removePanelReserve / object_setCoordinatesFromPanels
    / object_updateCollisionPanels commits the move to the target panel; mov r0,#3; strb r0,[r5,#oBattleObject_CurAnim]
    plays the attack animation during the approach; object_clearFlag 0x40 and object_setFlag1 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT
