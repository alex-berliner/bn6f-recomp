name: sub_80498E4
address: '0x080498E4'
kind: function
status: confirmed
summary: Per-module battle initializer hook that defers module start until the chatbox clears its 0x80 flag.
interface: void sub_80498E4(u32 modulePtr /* r5 */); // returns via tail-call to battle_moduleInit_803A820, surfacing
  r3, r8-r12, c, v
details: 'Reads the chatbox "eFlags" word at 0x2009F38 and tests bit 0x80 via chatbox_mask_eFlags2009F38.

  If the bit is clear (Z set), writes the marker byte 0x28 to modulePtr+1 (one byte past the

  pointer itself) to record that the module is waiting on the chatbox before it can finish

  initializing. Then unconditionally tail-calls battle_moduleInit_803A820, passing r5 (modulePtr)

  through; that routine is the one that produces the r3 / r8-r12 / c / v outputs the callers of

  this wrapper observe, so this function is effectively a thin per-module ctor/hook layered on

  top of the shared battle_moduleInit_803A820 entry point.

  '
