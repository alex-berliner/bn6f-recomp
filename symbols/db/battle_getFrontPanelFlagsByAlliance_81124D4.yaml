name: battle_getFrontPanelFlagsByAlliance_81124D4
address: '0x081124D4'
kind: function
status: confirmed
summary: Looks up the panel an object is facing and returns its parameter word masked by a side-specific
  bit mask chosen from the object's alliance.
interface: int sub_81124D4(BattleObject* object /* r5 */) -> r0 = panelParams & mask, r1 = mask; clobbers
  r2 r3 lr, flags
details: 'Takes the battle object in r5. Calls object_getFrontDirection to get the horizontal

  step (dx) of the direction the object faces, adds it to oBattleObject_PanelX, and

  passes that plus oBattleObject_PanelY to object_getPanelParameters, which yields the

  panel''s parameter/flag word in r0. Then picks a literal-pool mask based on

  oBattleObject_Alliance: alliance 0 (player side) -> 0x08800000, any other alliance

  -> 0x04800000. Returns the masked parameter in r0 and the mask itself in r1, so

  callers can tell which side test was applied. The two masks share bit 0x00800000

  and differ in 0x08000000 vs 0x04000000, suggesting the low shared bit is a

  side-independent panel property while the differing bit encodes something like

  occupancy/state per side; the exact flag meanings of object_getPanelParameters are

  not yet decoded. Returns both value and mask only because the mask is left in r1

  by the epilogue.

  '
