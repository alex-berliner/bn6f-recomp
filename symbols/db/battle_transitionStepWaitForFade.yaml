- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sequence of sub_812674C, sprite_queueBattleOamEntry, battle_runTransition_8125444, submenu_redrawFolderScreen,
    wrapper_sub8126570_fixedArgs_812650C pumps all per-frame workers; bl IsScreenFadeActive + beq locret:
    state advance only happens when fade condition met; mov r0,#8; strb r0,[r5,#1] writes a small phase/state
    byte in the caller''s struct; callee summary of battle_runTransition_8125444 (transition pump) matches
    a battle-start sequence context'
