name: battle_transitionStepWaitForFade
address: '0x08125104'
kind: function
status: probable
summary: 'Per-frame step of the battle-start transition: pumps all transition/animation workers each call
  and advances the phase state to 8 once the screen fade finishes.'
interface: () -> void; writes phase byte r5+0x1 = 8 when IsScreenFadeActive signals done; no return value
details: 'Unconditionally invokes the animation-step routines in order: the progressive two-part tile
  blit (sub_812674C), battle-scene OAM queueing, the one-shot battle-transition pump, the folder-screen
  redraw, and the fixed-args wrapper that blits a 90x32 region using the byte_/dword_8124A84 tables. It
  then calls IsScreenFadeActive and, when its zero-flag result indicates the fade has ended, stores 8
  into byte r5+0x1, advancing an outer state machine (r5 is the caller''s context/state struct). If the
  fade is still running it does nothing further and just returns, so this state must be re-invoked every
  frame. The phase byte write is the only side effect beyond delegating to the callees.'
