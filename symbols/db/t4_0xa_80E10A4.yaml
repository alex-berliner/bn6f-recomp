name: t4_0xa_80E10A4
address: '0x080E10A4'
kind: function
status: confirmed
summary: Dispatcher (trampoline) that tail-calls one of two battle flash-effect update routines chosen by the battle
  object's Param1 (0 = palette flash, 1 = white flash).
interface: void battle_dispatchFlashUpdate_80E10A4(void) — no typed C signature is possible; r5 = battle object,
  r10 = update context on entry, with r5/r10 passed unchanged to the selected routine and its r5, r8–r12 results
  returned untouched (flags clobbered, lr consumed).
details: 'Pure two-entry dispatch table trampoline. Reads the battle object''s Param1 byte

  (oBattleObject_Param1 at r5), multiplies it by 4, and indexes a table at off_80E10B8:

  entry 0 = battle_flashPaletteObjectUpdate+1 (palette flash), entry 1 = battle_whiteFlashUpdate+1

  (white flash). The call is made with lr loaded from pc (a LONG_CALL-style handoff in thumb via

  bx), so the selected routine runs with the caller''s live registers: r5 still points at the

  battle object and r10 carries the update context. Anything the callee writes into r5 or

  r8–r12 flows straight through to this function''s caller. Only Param1 values 0/1 are handled;

  any other index reads a garbage pointer out of the table. This function is itself reached via

  a task/thread-type table (t4 type 0xa) elsewhere in the battle engine.

  '
