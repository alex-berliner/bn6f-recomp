name: battle_spawnSelfElementCollisionRegion
address: '0x080D05EC'
kind: function
status: probable
summary: Spawns a battle collision region (hitbox) on the object's own panel, using the object's stored
  element and damage data.
interface: (r5 = battle object) -> r0 = result of object_spawnCollisionRegion; preserves r4-r7
details: Reads oBattleObject_PanelX, PanelY and Element from the battle object in r5 and forwards them
  as the region's position and element to object_spawnCollisionRegion. r3 = 0 (probably a side/team flag
  meaning 'object's own side' or 'no owner offset'), r4 points to constant damage/hit data 0x1200FF01,
  r6 passes through the object's DamageAndStaminaDamageCounterDisabler field, and r7 = 1. The immediate
  0x1200FF01 looks like a packed collision-region descriptor (damage 0x12 plus hit-property flags 0xFF01).
  In effect this creates a one-panel attack hitbox matching the object's element, so the object deals
  elemental panel damage at its own location. Only one caller (sub_80D0590) is known, so which entity
  uses it is not established.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element then bl object_spawnCollisionRegion —
    element-dependent hitbox spawn; ldr r4, dword_80D0604 (=0x1200FF01) — constant damage/flags descriptor
    for the region; ldr r6, [r5,#oBattleObject_DamageAndStaminaDamageCounterDisabler] — damage counter
    behavior inherited from the object; r3=0 and r7=1 passed as fixed spawn parameters to object_spawnCollisionRegion
  refs:
  - bn6f/asm/asm31.s:53538
