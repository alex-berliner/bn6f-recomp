name: record_writeU16IfIdMatches_809FDCE
address: '0x0809FDCE'
kind: function
status: confirmed
summary: Compares a caller-supplied 16-bit id against the id stored in a global record and, only on a match, overwrites
  the record's 16-bit value field.
interface: u16 record_writeU16IfIdMatches(u8 idLo /*r0*/, u8 idHi /*r1*/, u16 value /*r2*/); // returns the record's
  currently stored id (r1 out); NZCV set from cmp(id, storedId); r0 and flags clobbered, r4-r7 preserved
details: 'Builds a 16-bit id as (r1 << 8) | r0, loads the stored id halfword from

  byte_2000210+4, and leaves it in r1 for the caller (so the caller learns

  the record''s current id even on a failed match). If the ids are equal,

  stores the r2 halfword at byte_2000210+6. The record thus has layout:

  +4 = u16 id, +6 = u16 value; fields at +0..+3 are not touched here.

  Semantics look like a guarded write: "set this value only if the record

  currently refers to this id" — e.g. applying an effect/update only while

  a matching item/card/entry is active. The global pointer is only ever

  held in a scratch register inside the routine, so r4-r7 are untouched

  despite being pushed. Flags out reflect the id comparison, which callers

  could branch on after the call.

  '
