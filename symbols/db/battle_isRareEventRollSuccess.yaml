name: battle_isRareEventRollSuccess
address: '0x0800A1AA'
kind: function
status: probable
summary: Returns whether this frame's rare-event roll in battle state hit, gated on no time-stop and the
  battle still running.
interface: () -> r0 = 1 if battle state field 0x38 (rare-event roll) >= 0x2D0 and battle is active and
  not time-stopped, else 0; flags clobbered by BLs
details: 'Checks three conditions: time-stop (battle flags bit 2) must be off, the battle must not be
  over, and the halfword at battle state field 0x38 — which battle_getRareEventRoll reads — must be >=
  0x2D0 (720 of 0x1000, about 17.6%, so the roll is presumably a 12-bit random value stored each frame
  or turn). Only when all three hold does it return 1. The time-stop and battle-over gates suggest the
  caller evaluates this in the main battle loop rather than at battle setup. The roll value and threshold
  semantics of field 0x38 come entirely from the getter''s known summary.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isTimeStop / bne loc_800A1C8: returns 0 while time-stop is active; bl battle_isBattleOver
    / tst r0,r0 / bne loc_800A1C8: returns 0 once battle-over conditions are met; bl battle_getRareEventRoll;
    cmp r0, #0x2D0; blt loc_800A1C8: success requires roll >= 720; success path is mov r0,#1 else mov
    r0,#0: a plain boolean predicate'
