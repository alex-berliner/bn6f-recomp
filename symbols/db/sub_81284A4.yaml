interface: void sub_81284A4(void)
details: 'Loads the fixed pointer to byte_2000FE0 (an IWRAM work area) and stores two bytes:

  byte_2000FE0 = 7 and byte_2000FE1 = 4. The two bytes look like a (mode, submode) or

  (screen, phase) pair consumed by whatever main loop polls this area; nothing else is

  read or written and no flags are set. Because the caller contract shows only lr being

  used and r0/r1/nz clobbered, this is a plain parameterless state-setter. Without

  cross-references to what reads 0x2000FE0/0x2000FE1, the meaning of the values 7 and 4

  is unknown, so this is a guess at the function''s role rather than a verified one.

  '
