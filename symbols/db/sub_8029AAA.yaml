name: sub_8029AAA
address: '0x08029AAA'
kind: function
status: confirmed
summary: Maps a battle object's mode (+7) and sub-state (+8) bytes to a numeric status code for other battle logic.
interface: u32 battle_getObjectStatusCode_8029AAA(u32 r5 /* battle object ptr */)
details: "Reads byte at offset +7 (object mode) and byte at offset +8 (object sub-state) of the\nobject pointer\
  \ in r5, then returns a code in r0:\n  • mode 0 or 2: sub-state == 1 → 9, otherwise → 0x0E (14)\n  • mode 0x0A\
  \ (10): → 0x10 (16)\n  • all other modes: sub-state > 2 → 0, sub-state ≤ 2 → 0x16 (22)\nThe returned code appears\
  \ to be a dispatch/acknowledgment value that the caller (or a\nparent object) uses to decide how to proceed with\
  \ this battle entity (e.g. remove it,\nflag it as done, or signal a particular animation phase). Clobbers all\
  \ condition flags\n(N, Z, C, V) but touches no other memory than the two state bytes.\n"
