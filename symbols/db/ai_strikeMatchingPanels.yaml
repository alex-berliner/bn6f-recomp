    run wf investigate investigate-20261019-030611'
open_questions:
- what sub_80D0F0C does with (x, y, InitFlag, ?) — likely spawns the attack/damage effect at that panel
- exact meaning of the two attribute masks 0x4000000/0x8000000 (which panel attribute each alliance targets)
- whether r6 (Damage) is actually passed to sub_80D0F0C via a register convention or read from r7 inside
  the callee
