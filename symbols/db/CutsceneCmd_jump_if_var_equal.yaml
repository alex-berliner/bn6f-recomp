name: CutsceneCmd_jump_if_var_equal
address: '0x08037914'
kind: function
status: confirmed
summary: Cutscene script command "jump if variable equals value" - compares a script variable against a byte operand
  and either continues at a 4-byte destination offset or skips the rest of the command.
interface: void CutsceneCmd_jump_if_var_equal(u8* ctx_r5, int scriptOffset_r7); // returns r0 = 1, r7 = new script
  offset (jump target or entry offset + 7), r4/r6 clobbered via the reader helpers, NZCV set by the final adds/movs
details: 'Handler for one cutscene-script opcode, driven through the shared byte/word reader (ReadMapScriptByte
  / ReadMapScriptWord) using r6 as an operand-step selector: r6=1 reads the first operand byte (variable selector),
  r6=2 reads the second operand byte (the value to compare against), r6=3 reads a 4-byte destination offset. After
  the step-1 read, ldrb r0,[r5,r4] picks up the value to test against; cmp r0,r4 implements the "variable == value"
  check (the reader helpers deliver their results in r4, which is why r4 shows up both as the comparison operand
  and as the jump-target register). If equal, the step-3 word read yields the new script offset and execution continues
  there (r7 = r4); if not equal, r7 += 7 steps past the whole command. Always returns r0 = 1 to the script dispatcher.
  Note the asymmetry: the taken path consumes 1+1+4 bytes of operands while the untaken path skips 7 bytes, so either
  the opcode byte is included in the skip or there is one extra operand byte not accounted for by the three reads.

  '
