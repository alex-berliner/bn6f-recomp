open_questions:
- The exact meaning of the 0x0B/0xC constants in the second word is unknown — they may be chip-element/element-damage
  indices rather than literal fixed values; reverse-engineering the consumer of the produced buffer would
  settle it.
- Whether r0 on entry (count?) is meaningful or just a stale caller value is unclear; r0 is overwritten
  before being used.
