name: battle_clearEnemyFadeinList
address: '0x0800A9F6'
kind: function
status: confirmed
summary: Zero-fills the first 0x80 bytes of the enemy fade-in list used during battle setup, effectively clearing
  all entries.
interface: void battle_clearEnemyFadeinList(void); /* r1 = 0x80 on return; r2, r3 preserved; c, v clobbered */
details: 'No arguments; callers pass nothing meaningful (r2/r3 are merely preserved through). The routine calls
  sub_800AAAE with r0 = 0, which returns (in r0) the base address of the enemy fade-in list structure — passing
  0 selects/queries that buffer rather than indexing it. It then zero-fills 0x80 bytes (0x20 words) at that address
  via ZeroFillByWord, so at most 0x80 bytes of per-enemy fade-in state (e.g. entry flags or positions) are reset.
  As a side effect of the calling convention, r1 is left holding 0x80 (the size passed to ZeroFillByWord) when the
  function returns, and the C/V flags reflect ZeroFillByWord''s exit state. The list is presumably consumed by the
  battle enemy-spawn/fade-in code at the start of an encounter.

  '
