name: ai_beastPwrAtkSetVars
address: '0x08012292'
kind: function
status: probable
summary: 'AI attack-step setup: computes the beast power-attack damage for alliance index 6 and stores
  it (plus a fixed extra damage) into the AI attack vars, then advances to AI state 9.'
interface: (r5 = battle object pointer, r7 = AI attack vars struct) -> stores oAIAttackVars_Damage, oAIAttackVars_ExtraDamage=0x8A,
  oAIAttackVars_InitFlag=0; r0 = 9 (next AI state/step)
details: Reads the battle object's Alliance field (r5 + oBattleObject_Alliance) and passes it with a hardcoded
  index of 6 to battle_beastPwrAtk_addScaledBaseFromIndex_8010D04, which looks up a 2-byte beast power-Atk
  table entry and scales it. The returned value is stored as oAIAttackVars_Damage, and a constant 0x8A
  (138) is written to oAIAttackVars_ExtraDamage. It clears oAIAttackVars_InitFlag to 0, marking the attack
  vars as uninitialized/pending for a later phase, and returns 9, which the caller's AI state machine
  presumably uses as the next step. The fixed index 6 strongly suggests a specific beast-form attack (this
  is the Falzar version), and the returned state id means the function is one arm of a larger AI attack
  dispatch.
