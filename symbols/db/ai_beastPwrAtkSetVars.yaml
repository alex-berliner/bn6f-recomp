    shows which attack is configured; strh r0,[r7,#oAIAttackVars_Damage] stores the callee's computed
    attack value; constant 0x8A written to oAIAttackVars_ExtraDamage is the attack's fixed extra damage;
    strb 0 into oAIAttackVars_InitFlag resets the attack-init flag for a later setup pass; mov r0,#9 before
    pop {pc} matches other AI state-machine steps returning the next state id
