open_questions:
- The exact semantic meaning of OBJECT_FLAGS_2 bit 0x08 (0x100) and the cleared bit 0x04 is unclear; naming
  it "finishCollisionHitReaction" reflects the inferred role of "end-of-collision handling that updates
  flags and spawns the hit effect" but the gameplay tag (e.g., shield / barrier break / panel modifier
  lock) needs another battle-state reverse engineering pass.
