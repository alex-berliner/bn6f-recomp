  date: '2026-10-18'
  detail: 'ldr r1,[r5,#oBattleObject_RelatedObject2Ptr] / ldr r0,[r1,#oBattleObject_ObjectHeader] / cmp
    r0,r5: reads a partner object and tests a mutual back-reference; mov r0,#0 / str r0,[r1,#oBattleObject_ObjectHeader]:
    zeroes the partner''s pointer to this object before teardown; bl object_genericDestroy whose known
    summary is the generic battle-object destructor, so this is a destructor variant; executed on recorded
    battlesweep routes, i.e. during battle object teardown'
