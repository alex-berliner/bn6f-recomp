name: battle_destroyUnlinkRelated2
address: '0x080C7A58'
kind: function
status: probable
summary: Destructor wrapper that, if the RelatedObject2 partner still points back at this object, nulls
  out the partner's back-reference before falling through to object_genericDestroy.
interface: (r5 = battle object being destroyed, engine current-object convention; r0 unused/stale) ->
  void; r0 clobbered
details: Reads [r5,#oBattleObject_RelatedObject2Ptr] to get the partner object, then reads the partner's
  oBattleObject_ObjectHeader and compares it to r5. If the partner still points back at this object, the
  field is zeroed first, preventing the partner from holding a dangling pointer (or from destroying it
  back) once this object is freed. It then falls through to object_genericDestroy, which releases panel
  tile reserves, collision data, and the object's memory. This is a custom destructor hook installed on
  objects that have a RelatedObject2 partner; the plain generic destructor is used for unpaired objects.
  Whether genericDestroy receives the target via r0 or via the engine's current-object register is not
  visible here; r0 holds either 0 or the old header value at the call.
evidence:
