open_questions:
- Exact semantics of `CurAnim` values 0/1/2 (the chosen byte is a local-input flag check, not a static
  table).
- Whether `0x1441` cleared by `object_clearFlag` at 0x8017980 is the "in collision / hidden during move"
  mask — the value is hard-coded in dword_8017A98 and not annotated in the structs.
- What `sub_800E45E -> sub_800E468` is computing (the (dx, dy, timer2) tuple per alliance); without resolving
  sub_800E468 the chosen direction algorithm is opaque.
