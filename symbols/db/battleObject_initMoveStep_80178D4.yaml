name: battleObject_initMoveStep_80178D4
address: '0x080178D4'
kind: function
status: confirmed
summary: 'Per-turn cycle for a battle object: dispatches AI, selects idle animation, resets sprite/panel/collision
  state, then either commits a one-panel step (velocity + panel reserve, sub-state 4) or enters a 24-tick idle wait
  (sub-state 8).'
interface: void battleObject_initMoveStep_80178D4(BattleObject *obj /* r5 */, u32 r4_in /* r4 */, u32 r8_in /* r8
  */); /* writes obj, clobbers r0-r3, flags */
details: "Called once per battle turn for each object that is in the \"moving\" phase of its\nstate machine (the\
  \ next function in the sequence, after the previous turn's\nanimation has fully played).\n1. Calls battle_dispatchActorTurnByTypeAndAIIdx\
  \ to run the NetNavi/custom AI tick\n   (reads/writes r4, r5, r8; may mutate the object's AIData).\n2. Sets flag\
  \ bit 0x500000 (\"acted this turn\") on the object and clears the related-object\n   scratch pointer and AIData::TempAttackObjectPtr.\n\
  3. Picks an idle animation index (CurAnim) from two flag bits: 0x800 → 2,\n   0x20000 → 0, otherwise 1. Resets\
  \ CurAnimCopy to 0xFF to force a sprite refresh.\n4. Calls sub_8011450 (secondary per-turn update) and battleObject_clearPwrAtkState\n\
  \   (resets PowerAttack sub-state fields).\n5. Mirrors the sprite's horizontal flip to match the object's facing\
  \ (object_getFlip →\n   sprite_setFlip).\n6. Commits the queued FuturePanelXY into PanelXY, recomputes world coordinates,\n\
  \   updates collision panel set, zeroes Z, clears flags 0x1441, resets collision state.\n7. Releases the panel\
  \ reservation on the old FuturePanelX/Y.\n8. Increments the per-alliance turn counter (saturated at 3) via tableAddSaturatedByte.\n\
  9. Queries sub_800E45E for a contact-offset (dx, dy) and a step-timer (Timer2).\n10. If Timer2 != 0: computes\
  \ target panel = current panel + offset; checks occupancy\n    via battle_objectCheckPanelByAlliance. If clear,\
  \ sets XVelocity = signbyte(0x1c)*0xA0000,\n    YVelocity = signbyte(0x1d)*0x60000, queues the target as FuturePanel,\
  \ reserves it,\n    and sets MoveSubState = 4 (moving).\n11. Otherwise (Timer2 == 0 or panel occupied): sets Timer\
  \ = 0x18, MoveSubState = 8 (idle wait).\nTouches: oBattleObject_RelatedObject1Ptr, oBattleObject_AIDataPtr→oAIData_TempAttackObjectPtr,\n\
  oBattleObject_CurAnim/CurAnimCopy, oBattleObject_FuturePanelXY→PanelXY, oBattleObject_Z_3c,\noBattleObject_FuturePanelX/Y,\
  \ oBattleObject_Alliance, oBattleObject_ContactPanelOffsetX/\nContactOffsetY, oBattleObject_Timer2/Timer, oBattleObject_XVelocity/YVelocity,\n\
  oBattleObject_MoveSubState, byte offsets 0x1c/0x1d (direction sign bytes).\n"
