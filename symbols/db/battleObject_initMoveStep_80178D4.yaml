name: battleObject_initMoveStep_80178D4
address: '0x080178D4'
kind: function
previous_names:
- sub_80178D4
status: probable
summary: Kicks off an actor's move one panel in the chosen direction by reserving the destination panel,
  computing a constant X/Y velocity from the row/col offset, and setting the end-of-move waiting state
  (or a fallback halt state if the destination panel can't be used).
interface: '(r5 = battleObject) -> r0 = 0x4 or 0x8 ; side effects: writes AIData Unk_68 = 0, RelatedObject1Ptr
  = 0, sets CurAnim, copies FuturePanelXY -> PanelXY, sets XVelocity/YVelocity, reserves next panel, etc.'
details: '- Prologue trampoline: `bl battle_dispatchActorTurnByTypeAndAIIdx_800F404` runs the per-AI-type
  handler first (uses r4/r5/r10/lr), then the function does its own bookkeeping on the same actor.

  - Forces flag 0x500000 (`UNUSED? | DRAG | ANGER`) into CollisionData.ObjectFlags1 via `object_setFlag1`,
  then zeroes `RelatedObject1Ptr` and `AIData.Unk_68`.

  - Picks a `CurAnim` byte by inspecting the actor''s flags: if `OBJECT_FLAGS_UNK_4` (0x800) clear default
  r2=2; if `OBJECT_FLAGS_FLINCHING` (0x800000? — actually 0x80000 = MOVE_COMPLETE; the assembly uses 0x200
  = FLINCHING and 0x800 = INVIS, hard to tell without resolving) set r2=1, else r2=0. Stores the result
  in `CurAnim` and writes `0xFF` into `CurAnimCopy`.

  - Calls `sub_8011450` (per-AI "actor finished" handler) and `battleObject_clearPwrAtkState_8012EA8`
  to clear PwrAtk charge state, then refreshes the sprite''s facing via `object_getFlip -> sprite_setFlip`.

  - Commits `FuturePanelXY` -> `PanelXY`, recomputes pixel coords with `object_setCoordinatesFromPanels`,
  syncs collision panels with `object_updateCollisionPanels`, clears `Z_3c`, and clears flag 0x1441 (`UNK_4|UNK_8|INVULNERABLE|AIRSHOE`)
  with `battle_resetCollisionState_80101C4`.

  - Releases the old panel reservation (`object_removePanelReserve`), adds 1 (saturated) to the per-alliance
  counter at `[0x203EAE0 + 3*Alliance + 1]`, and tail-calls `sub_800E45E` to obtain a (dx, dy, timer2)
  triplet that is stashed in `Unk_1c / Unk_1d / Timer2`.

  - If `Timer2 != 0`, computes the destination panel (`PanelX + Unk_1c`, `PanelY + Unk_1d`), runs `battle_objectCheckPanelByAlliance_800E5AC`;
  on success, sets `XVelocity = 0xa0000 * Unk_1c` and `YVelocity = 0x60000 * Unk_1d` (16.16 fixed-point),
  updates `FuturePanelXY`, calls `object_reservePanel` on the destination, and falls into the success
  exit with `Unk_0d = 4`.

  - Failure/late path: writes `Timer = 0x18`, `Unk_0d = 8`. The `pop {r6,r7,pc}` after the `mov r0, #4
  / strb` returns `0x4` to the caller; the alternate tail `pop {r6,r7,pc}` at loc_8017988 returns without
  setting r0 (the very-low-level contract''s "out=r1,r5" probably reflects this; r0 is not in `out`).

  - Exit sets `r5` preserved (i.e. same actor pointer) and writes a 0/4 byte into `Unk_0d`; the dispatcher
  (`battle_dispatchActorTurnByTypeAndAIIdx`) sees r4/r5 intact for the next tick.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl battle_dispatchActorTurnByTypeAndAIIdx_800F404` at the entry is the standard actor-dispatch
    trampoline. - `ldr r0, dword_8017A90 // =0x500000 ; bl object_setFlag1` directly ORs 0x500000 (DRAG|ANGER)
    into the actor''s CollisionData ObjectFlags1. - `str r0, [r5,#oBattleObject_RelatedObject1Ptr]` and
    `str r0, [r1,#oAIData_Unk_68]` with r0=0 zero those two pointer/longword slots. - `tst r0, r1` against
    0x800 then 0x20000 picks `CurAnim` (these map to `OBJECT_FLAGS_UNK_4` / `OBJECT_FLAGS_FLINCHING`).
    - `strb r2, [r5,#oBattleObject_CurAnim]` / `strb r0, [r5,#oBattleObject_CurAnimCopy]` with r0=0xFF
    records the chosen move-start animation. - `ldrh r0, [r5,#oBattleObject_FuturePanelXY] ; strh r0,
    [r5,#oBattleObject_PanelXY]` commits the queued step. - `mov r0, #0x18 ; strh r0, [r5,#oBattleObject_Timer]`
    sets a 24-frame stall on the failure path; the success path writes nothing to `Timer` (the prior value,
    presumably 0, is kept). - `ldr r0, dword_8017A9C // =0xa0000 ; mul r0, r1` and `0x60000 * r1` form
    per-panel velocities in 16.16, scaled by the signed byte offsets in `Unk_1c/Unk_1d`. - `strb r0, [r5,#oBattleObject_FuturePanelX]
    ; strb r1, [r5,#oBattleObject_FuturePanelY]` followed by `bl object_reservePanel` claims the destination.
    - The two `pop {r6,r7,pc}` endings store `Unk_0d = 4` vs `Unk_0d = 8`/`Timer = 0x18` (loc_8017988),
    the canonical "moving" vs "halted" actor sub-state bytes for this dispatcher family.'
