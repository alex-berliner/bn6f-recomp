name: ai_clearAttackVar
address: '0x080EB562'
kind: function
status: probable
summary: Resets a per-object AI attack variable (AIData+0x68) to zero, used by attack state machines when
  their attack ends.
interface: (r5 = battle object; no args) -> r0 = clobbered by call; no meaningful return
details: Loads the battle object's AIData pointer (oBattleObject_AIDataPtr from r5), computes AIData+0x68,
  and calls sub_80EB572 with that address in r0 and r1 = 0, which almost certainly writes 0 into that
  field. Every known caller is an AI attack routine (buster shot, thunder-style attack) whose summaries
  show state ticking and completion, so this is the cleanup/reset of the attack's progress variable on
  the final tick or when returning to idle. The shared callee with r1=0 strongly indicates a plain 'set
  field to 0' helper rather than anything object- or sprite-related.
