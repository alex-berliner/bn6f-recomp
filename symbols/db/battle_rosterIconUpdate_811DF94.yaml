name: battle_rosterIconUpdate_811DF94
address: '0x0811DF94'
kind: function
status: confirmed
summary: Per-frame tick for a single battle roster icon sprite; resets it to idle when the slot is empty,
  plays a reaction animation on EVENT_BF2, or applies shade, then advances the sprite animation.
interface: 'void battle_rosterIconUpdate_811DF94(void) /* in: r5=sprite, r6=roster-entry; out: r2,r3,r5
  from sprite_update; clobbers r0,r1,flags,lr; preserves r4,r5 (r5 overwritten by sprite_update result)
  */'
details: 'Reads the animation-state byte at [r6+0xB]. When 0 (slot idle/empty): writes 0xFF to [r6+4]
  to mark the roster slot empty, calls sprite_setAnimation(0), sprite_loadAnimationData, sprite_noShadow,
  then battle_rosterIconSetShade. When non-zero: tests event flag BF2 (group 0xB, value 0xF2) via TestEventFlagFromImmediate;
  if the flag is clear it just calls battle_rosterIconSetShade (greyed-out icon), if set it calls sprite_playAltAnimationOnce
  (a reaction/flinch animation). Both paths then call sprite_update and return its r2,r3,r5. The sprite
  pointer (r5) and roster-entry pointer (r6) are the caller''s loop variables; r10 is also passed in but
  unused here. r4 is saved on the stack but never written.'
