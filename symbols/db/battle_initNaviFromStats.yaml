  date: '2026-10-18'
  detail: 'ldrb/mov #0x29 then GetBattleNaviStats2034A60Byte stored to oAIData_AIIndex, and NameID = AIIndex+0x1A0
    (naming uses the navi ID); GetBattleNaviStatsAddr + alliance*0x64 + eBattleNaviStats2034A60 + CopyWords
    of 0x64 words: bulk NaviStats snapshot copy; chip_class_lookup_800FC9E + sprite_load + sprite_setAnimation/palette/flip:
    builds the navi''s battle sprite; GetBattleNaviStatsHword 0x40/0x42 strh to oBattleObject_HP/MaxHP,
    then battle_dispatchActorByTypeAndAIIdx_800F378 registers the actor; battleObject_markUsedAction_80143A6
    and battleObject_setupSecondaryElementWeaknessFromNaviStats_801086C are navi-spawn-time housekeeping'
