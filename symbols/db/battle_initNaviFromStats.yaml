name: battle_initNaviFromStats
address: '0x0802D7A0'
kind: function
status: probable
summary: 'Initializes a navi battle actor for its selected NaviStats entry: syncs the alliance''s live
  NaviStats from the eBattleNaviStats2034A60 snapshot (via sub_802DCCC/init_8013B64), sets NameID from
  AIIndex, loads sprite/animation 3/palette, sets HP/MaxHP, dispatches by type/AIIdx, clears status flags,
  and sets secondary element weakness.'
interface: (r5 = battle object, r7 = AIData vars) -> r0 = ...; sets up oBattleObject_NameID, HP/MaxHP,
  CurAnim, AIIndex; no meaningful return
details: Reads NaviStats byte 0x2C and byte 0x29 (apparently the selected navi ID) for the object's side;
  if the two agree, it copies 0x64 words from eBattleNaviStats2034A60 (indexed by alliance*0x64) into
  the side's live NaviStats via GetBattleNaviStatsAddr/CopyWords, and does a similar sync through sub_802DCCC
  (falling back to init_8013B64 otherwise). It stores byte 0x29 as AIData.AIIndex, sets oBattleObject_NameID
  to AIIndex+0x1A0, then loads the navi's sprite via chip_class_lookup/sprite_load, sets animation 3,
  palette (battle_pickPaletteIndexForNavi), flip, and the popup handler. Finally it writes HP/MaxHP from
  NaviStats hwords 0x40/0x42 (or sub_802DD70 when byte 0x29 is nonzero), marks the used action, clears
  object status flags/invulnerable time, and sets secondary element weakness from NaviStats.
