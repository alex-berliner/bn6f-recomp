  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s name and summary are close, but the function does more than spawn: it picks an in-battle
    navi (ID 0x29 of eBattleNaviStats2034A60 vs side''s 0x29), syncs the live NaviStats from the snapshot
    (CopyWords 0x64 words twice — once on agreement at the start and once after sub_802DCCC), sets HP
    via the 0x40/0x42 path or sub_802DD70, sets oBattleObject_NameID to AIIndex-1+0x1A0, anim 3, palette,
    secondary weakness, and dispatches via battle_dispatchActorByTypeAndAIIdx_800F378. Note the interface
    lists r7=AIData vars but r7 isn''t touched in the code, while r4 holds AIDataPtr — minor inaccuracy.
    The name ''battle_spawnNaviFromStats'' is acceptable but ''init'' prefix fits the init-like setup
    role better.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
