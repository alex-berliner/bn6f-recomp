name: CutsceneCmd_store_or_load_game_progress_buffer_maybe_803843c
address: '0x0803843C'
kind: function
status: confirmed
summary: Cutscene script opcode that reads a 2-byte progress-slot ID and a 1-byte selector, then either snapshots
  current game progress to a buffer or restores it from that buffer.
interface: u32 r7 (script cursor) + u32 r10 (toolkit ptr) in; r2,r3,r4,r5,r7 + NZ flags out; clobbers r0,r6,c,v,lr;
  preserves r5 across the save/load call
details: Fetches the game-state pointer from toolkit[oToolkit_GameStatePtr] into r2 (for downstream callers). Calls
  ReadMapScriptByte with r6=2 to pull a 2-byte slot identifier from the script stream (lands in r4 as cmd_value).
  Calls ReadMapScriptByte with r6=1 to pull a 1-byte selector. Selector==0 branches to storeGameProgressToGameProgressBuffer_8035364
  (saves live state into a buffer keyed by cmd_value); nonzero branches to loadGameProgressFromGameProgressBuffer_8035354
  (restores state from that buffer). After the branch, r7 is advanced by 3 to skip the two bytes consumed by the
  2-byte read plus the one byte of the selector. Returns r0=1 (nonzero, Z clear) to signal the command executed
  without halting the cutscene. The store/load callees leave their own r4/r5 results in place; the outer function
  does not overwrite them before returning, so callers see those values too.
