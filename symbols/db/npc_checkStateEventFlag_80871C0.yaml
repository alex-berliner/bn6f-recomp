name: npc_checkStateEventFlag_80871C0
address: '0x080871C0'
kind: function
status: confirmed
summary: Reads the caller object's current state index, looks up an event-flag id in a small table, and
  returns whether that flag is set via the N/Z flags.
interface: bool check(r5 objectPtr, r10 unused) — tail result is the N/Z flags left by TestEventFlag (Z
  clear = flag set); clobbers r0, r1, r3, lr, C and V
details: 'Takes a pointer in r5 to some object/state struct, loads the byte at r5+0xC (an index into the
  object''s current state or step), doubles it, and indexes the u16 table at byte_80871D8 with that value
  to get an event-flag id. It then calls TestEventFlag(flagId) and simply returns to its caller with the
  flags TestEventFlag left behind, so the caller branches on Z/NZ to decide whether the flag is set. r10
  is listed as an input by callers but the body never touches it — likely a callee-saved-style convention
  artifact rather than a real parameter. The table at byte_80871D8 pairs one flag id per state value;
  its entries are not decoded here. Typical use would be a dialogue/NPC handler that picks which text
  or branch to run based on story progress flags tied to the NPC''s current state.

  '
