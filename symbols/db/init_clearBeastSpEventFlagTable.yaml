name: init_clearBeastSpEventFlagTable
address: '0x0808CE28'
kind: function
status: confirmed
summary: Clears ranges of Beast special-event flags whose gate flag is set, selecting the flag table by the current
  map-group AI mode.
interface: 'void init_clearBeastSpEventFlagTable(void); /* in: r10 (caller ctx), lr; out: r2=3 (stale loop constant);
  r4-r8 preserved */'
details: 'Calls ai_getAIModeForMapGroup_808D084 (passing r8 as context, saved/restored across the call) to determine
  the active AI mode for the current map group. Uses that mode as a word index into a jump-table at off_808CEB8
  (which holds the address off_808CEBC) to select a pointer to an array of 8-byte Beast-SP flag entries. Entry layout:
  +0 u16 gate flag, +2 u16 start of clear range, +4 u16 end of clear range. Iterates 3 entries for modes 0-2 or
  4 entries for modes >= 3. For each entry calls TestEventFlag(gate); if the flag is SET (ZF clear → branch not
  taken), reads the start and end u16s and calls ClearEventFlagRange(start, end). Leaves r2 holding the constant
  3 from the loop-end comparison, which some caller may inspect. r7 is zeroed early but restored by the push/pop
  frame so it is transparently preserved.'
