name: rfu_reinitRecvSlots
address: '0x08146E60'
kind: function
status: probable
summary: 'Re-initialises the RFU receive-side state: clears byte_20101E0 and zeroes per-slot receive buffers,
  then calls rfu_resetRecvSlots.'
interface: () -> void
details: This tiny thunk prepares r0 (byte_20101E0) and r1 (rfuPerSlotRecvBuffers) and r2=0xc as the arguments
  for rfu_resetRecvSlots, which clears queue globals, rebuilds the active-slot bitmask, and zeroes per-slot
  recv state for up to 4 peers. Its only caller, sub_812A4AC, invokes it along the same wireless-link-restart
  path that also re-calls submenu_resetState, rfu_shouldRestartWirelessLink, and rfu_startLinkTransfer.
  The paired byte_20101E0 / rfuPerSlotRecvBuffers arguments match the parameters rfu_resetRecvSlots expects,
  and the size 0xc is just passed through unchanged. It is essentially a typed wrapper around rfu_resetRecvSlots
  in the RFU subsystem.
