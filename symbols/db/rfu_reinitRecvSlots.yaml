open_questions:
- What exactly byte_20101E0 represents (RFU control byte, send flag, etc.) and its role vs. the per-slot
  recv buffers.
- Whether this is meant to be invoked both on link setup and on RFU error recovery, given the caller branches
  on rfu_shouldRestartWirelessLink.
