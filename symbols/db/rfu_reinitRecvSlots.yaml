- method: assembly-reading
  date: '2026-10-21'
  detail: tail-calls rfu_resetRecvSlots after loading byte_20101E0 (r0), rfuPerSlotRecvBuffers (r1), 0xc
    (r2); caller sub_812A4AC places it on the wireless-link recovery path alongside rfu_shouldRestartWirelessLink
    and rfu_startLinkTransfer; function signature (a0, a1, a2 -> void) is exactly rfu_resetRecvSlots's
