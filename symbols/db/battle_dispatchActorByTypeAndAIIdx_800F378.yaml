name: battle_dispatchActorByTypeAndAIIdx_800F378
address: '0x0800F378'
kind: function
status: confirmed
summary: Thin wrapper that hands the battle actor's per-type dispatch table (virus/navi/player) to the actor-type+AI-index
  dispatcher and tail-calls it.
interface: battle_dispatchActorByTypeAndAIIdx_800F378(void *actor /* r0 */) — tail-calls indexByActorTypeAndAIIdxThenDispatch_800F420(r0
  = &off_800F388); r1–r12, c and v flags pass through unchanged to the eventual handler/caller.
details: 'Loads the pointer to off_800F388 into r0 and immediately (tail) calls indexByActorTypeAndAIIdxThenDispatch_800F420,
  so its only real job is supplying the table-of-tables argument. off_800F388 holds three entries selecting the
  dispatch table per actor type: [0] off_81092D0 (viruses), [1] off_80F2668 (navis), [2] off_80EAA04 (player). The
  callee indexes by the battle object''s actor type and AI index and jumps to the matching per-AI handler. Because
  it is a plain push {lr}/pop {pc} tail call, all registers and the carry/overflow flags flow straight through from
  callee to caller. The actor/battle-object pointer itself is presumably still recoverable by the callee (likely
  on the stack or in a struct reachable from r0''s target), which is why this wrapper only needs to pass the dispatch-table
  base.

  '
