name: battle_dispatchBusterAtkHandler
address: '0x080117A4'
kind: function
status: probable
summary: Dispatches the player's buster/attack handler selected by the AI's BPwrAtk level via a jump table.
interface: (r5 = battle object) -> calls handler table[BPwrAtk] with r7 = AIData+AttackVars; returns handler
  result
details: Reads the battle object's AIData pointer from oBattleObject_AIDataPtr, computes r7 = AIData +
  oAIData_AttackVars (an attack-variables struct base handed to the handler through r7), loads the byte
  oAIData_BPwrAtk, scales it by 4, and indexes the table at off_80117D4 to get a handler address, then
  long-calls it with lr=pc (ARM caller into Thumb handlers). The BPwrAtk byte thus acts as an attack/charge-level
  selector; each entry is a separate buster-attack routine operating on the same AttackVars block. No
  result value is produced by the dispatcher itself beyond whatever the handler returns.
