- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r6,#oAIData_BPwrAtk]; lsl r0,r0,#2; ldr r1,[r1,r0]: table indexed by BPwrAtk field;
    r7 = AIData + oAIData_AttackVars set before the call and preserved across it, implying handlers consume
    the attack-vars struct; mov lr,pc; bx r1: indirect long-call into per-level handler, typical of a
    switch/jump table; called from playerAI_sub_80F0354, fitting a player-AI attack step'
