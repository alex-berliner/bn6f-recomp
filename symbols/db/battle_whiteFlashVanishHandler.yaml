name: battle_whiteFlashVanishHandler
address: '0x080171D8'
kind: function
status: probable
summary: 'Battle-object phase handler that kills an object with a white-flash fade: flashes its palette
  for ~90 frames, then detaches it from the battle (alliance, panel reserve, alive list) with a screen
  fade and hands off to the destroy phase.'
interface: (r5 = battle object) -> void; sets object phase 4 on setup, phase 8 on finish
details: On first entry (PhaseInitialized==0, skipped while time-stop is active) it zeroes PreventAnim,
  RelatedObject1Ptr and the AI's TempAttackObjectPtr, spawns a linked type-0x11 object (r7 = AIData+0x74)
  plus an effect object, sets both the object's and the effect's Timer to 0x5A (90 frames), and stores
  phase 4. While the timer counts down, every 4th frame it calls sprite_forceWhitePalette, making the
  object flash white. When the timer expires it clears the alliance target slot pointing at itself, releases
  its reserved panel via object_removePanelReserve, follows the AI's SpawnedSourceObjectPtr (sub_80E1A86),
  reads its NameID, removes itself from the alive-actor list, triggers SetScreenFade(4,4), spawns another
  linked object, and moves to CurPhaseAndPhaseInitialized = 8 (likely the shared destroy phase). Objects
  with NameID in 0x173–0x17E keep their current animation instead of being forced to CurAnim 2, suggesting
  a specific family (bosses?) uses a custom vanish pose.
