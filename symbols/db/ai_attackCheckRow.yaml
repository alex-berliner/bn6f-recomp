name: ai_attackCheckRow
address: '0x080F3EF0'
kind: function
status: probable
summary: 'AI attack step: invokes the panel-choose callback and compares its returned row against the
  target object''s PanelY to pick between two hit-element outcomes (0xC on match, 4 otherwise), or exits
  the attack state if the object can''t move or the callback returns 0.'
interface: (r7 = AI attack vars struct, r5 = battle object) -> r0 = hit element stored to oAIAttackVars_HitElement;
  no return value
details: 'If object_canMove says the attacker is free, it clears oAIAttackVars_PanelParamFlags2, then
  tail-invokes oAIAttackVars_PanelChooseCallback with lr=pc, passing oAIAttackVars_TargetObjectPtr in
  r0, oAIAttackVars_AiAttackParam in r1 and the flags in r2. The callback''s return (a row/panel value)
  is kept in oAIAttackVars_AttackBoost2 and compared with the target-ish object''s oBattleObject_PanelY:
  on match it writes 0xC, otherwise 4, into oAIAttackVars_HitElement — two flavours of the same attack
  distinguished by hitting the chosen row. If the object cannot move or the callback returns 0, it instead
  calls object_exitAttackState to leave the attack state. This is one step of the AI attack coroutine
  state machine, all state living in the r7 struct.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: beq after bl object_canMove routes to bl object_exitAttackState — only acts when the object
    is free to act; mov lr, pc; bx r2 with r2=oAIAttackVars_PanelChooseCallback calls a chosen-panel callback
    with target ptr and attack param; cmp r0, r1 (PanelY) with two strh values 0xC vs 4 into oAIAttackVars_HitElement
    distinguishes hit-on-chosen-row vs miss; callee object_exitAttackState's known summary confirms this
    is an AI attack state that can be aborted
