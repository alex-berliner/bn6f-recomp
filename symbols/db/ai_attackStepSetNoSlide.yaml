name: ai_attackStepSetNoSlide
address: '0x08104340'
kind: function
status: probable
summary: 'AI attack-state step: if the object is free to act, it pins itself (no-slide flag), plays anim
  0x43 and sets short step/hit timers; otherwise it aborts the attack and tears down attack state.'
interface: (r0 = battle object, r5 = object struct, r7 = AI attack vars) -> r0 = clobbered; flags from
  object_canMove comparison
details: Calls object_canMove; on success it ORs OBJECT_FLAGS_CANNOT_SLIDE into the object's ObjectFlags1
  via object_setFlag1, stores animation id 0x43 into oBattleObject_CurAnim, writes step timer 3 and hit
  element 4 into the oAIAttackVars fields, and returns. On failure (canMove == 0) it clears oAIAttackVars_HasMoved
  and calls object_exitAttackState_801171C to cancel the attack cleanly. The 0x43 anim plus hit-element
  4 suggest a short wind-up/pre-hit phase of an enemy attack. No callers are known, so which enemy/AI
  uses this step is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_810435C branches between the ''proceed'' and ''abort'' paths; mov
    r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1 pins the object against sliding; strb r0(0x43),[r5,#oBattleObject_CurAnim]
    selects a specific animation; strh 3/4 into oAIAttackVars_StepTimer / oAIAttackVars_HitElement sets
    attack timing and element; abort path: strb 0 to oAIAttackVars_HasMoved then bl object_exitAttackState_801171C'
