name: keyItemMenu_renderDescription_81179E4
address: '0x081179E4'
kind: function
status: confirmed
summary: Looks up the selected key item and renders its description text into the key item menu screen's VRAM slot.
interface: void sub_81179E4(void); // r4 = key item menu state struct, r7 = menu context struct, r10 = toolkit;
  preserved r4-r9
details: 'Reads the selected key item id from the halfword at menu state +2 and calls CheckKeyItem to resolve it.
  The lookup result (the key item''s description data/pointer) is saved to +8 of the toolkit''s work struct obtained
  via oToolkit_Unk200a220_Ptr (same struct the menu text code reads back later). It then calls renderTextGfx_8045F8C
  to draw the description: gfx source selector taken from [menu_context+0x24], palette/bank arg 0x12, text buffer
  at unk_2016200, VRAM destination 0x6013520 (a BG tile area), tile layout args 2 and 1, source data dword_86A5D60,
  and 0 as the final arg. r4-r7 are scratch inputs that get clobbered by the render call and are restored on exit.

  '
