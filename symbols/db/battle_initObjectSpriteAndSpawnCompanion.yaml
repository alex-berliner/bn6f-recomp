    sprite resource bring-up for the object; asm: sets CurAnim/CurAnimCopy = 0, sprite_setAnimation(0),
    sprite_setPalette(0), sprite_setFlip(object_getFlip()) — standard new-object sprite setup; asm: spawn
    via dword_80C3A20 = 0x14011308 stored into oBattleObject_RelatedObject1Ptr; asm: PlaySoundEffect(0x94),
    Timer = 0x64, CurState = CUR_STATE_UPDATE, then bl sub_80C3A24 — entry into first state after delay;
    callee set (object_getFlip, object_setCoordinatesFromPanels, spawn_t1_...) matches a battle-object
    spawn/init context'
