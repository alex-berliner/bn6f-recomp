name: battle_initObjectSpriteAndSpawnCompanion
address: '0x080C39BA'
kind: function
status: probable
summary: 'Battle object init: loads sprite 0x13 from bank 8 with shadow, sets flag bit 0x2, zeroes CurAnim
  and sets anim 0 with palette 0, applies getFlip/setFlip, repositions from panels, zeroes Z, spawns a
  t1 companion using descriptor 0x14011308 into RelatedObject1Ptr, plays SFX 0x94, sets Timer to 0x64,
  writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized, then tail-calls sub_80C3A24.'
interface: (r5 = battle object header, global object pointer convention) -> void; sets oObjectHeader_Flags,
  oBattleObject_CurAnim(+Copy), Z, RelatedObject1Ptr, Timer, CurStateUpdate/Phase
details: Decompresses sprite 0x13 (bank 8) to temp via sprite_decompressTemp, then loads it with sprite_load(0x80,
  8, 0x13) and enables its shadow. Sets flag bit 1 in the object header flags, zeroes CurAnim/CurAnimCopy
  and runs sprite_setAnimation/sprite_loadAnimationData with animation 0 and palette 0. Faces the sprite
  per object_getFlip and repositions the object from its panel coordinates via object_setCoordinatesFromPanels.
  It then spawns a companion object using spawn descriptor dword_80C3A20 (0x14011308), storing the result
  in RelatedObject1Ptr, plays sound effect 0x94, sets the object Timer to 100 (0x64) frames, and writes
  CUR_STATE_UPDATE into the CurState/Phase field before tail-stepping into the next routine sub_80C3A24.
  Likely the spawn/init entry of an enemy or object state machine whose identity is not shown here.
