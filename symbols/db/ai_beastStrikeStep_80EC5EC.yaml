name: ai_beastStrikeStep_80EC5EC
address: '0x080EC5EC'
kind: function
status: confirmed
summary: 'Advance the Beast Strike (Soul Cross) AI attack one frame: init, hit/effect placement, charge-cycle
  sub-stepping, and timeout.'
interface: "void ai_beastStrikeStep(int soundParam /*r2*/, BattleObject *obj /*r5*/,\n               \
  \         AIAttackVars *av /*r7*/, void *aiExtra /*r10*/);\n"
details: 'Per-frame step handler for the Beast Strike (Soul Cross) special attack. Dispatches on av->AttackElement:
  0 means first-frame init, otherwise continues. Init path: sets animation 0xE on obj, zeroes RelatedObject2Ptr''s
  CurAnimCopy, clears RelatedObject1Ptr, resets the TempAttackObject via battle_resetObjectPhaseCounter,
  nulls that pointer, calls ai_clearAttackVar, sets object flag bit 22, stamps av->AttackElement = 4 and
  zeroes av->StepTimer. Hit path (StepTimer == 1): plays SFX 0xB3, computes an OAM layer byte from a pool
  table (dword_80EC70C) shifted <<16; if obj->Z != 0 switches effect type to 0x10003 and adds Z for depth-sorting.
  Computes total damage = av->Damage + av->AttackBoost and calls ai_placeBeastStrikeEffects. Then cycles
  av->SubStepIndex through 0,1,2 (mod 3) and stores ChargeCycles = 2. Always: increments av->StepTimer;
  once it exceeds 4, sets av->HitElement = 4 (marks the attack as finished). Touches AIAttackVars, BattleObject,
  AIData, and the object flag system.

  '
