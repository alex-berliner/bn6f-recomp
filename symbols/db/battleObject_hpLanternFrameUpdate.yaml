name: battleObject_hpLanternFrameUpdate
address: '0x080DA108'
kind: function
status: probable
summary: 'Per-frame update routine for the HP-recovering lantern battle object: unsets its hit-flash,
  resolves collision, runs its action-state AI, and ticks its sprite.'
interface: (r0 = scratch, r5 = object header pointer) -> r0 = clobbered; flags set by callees
details: 'Standard battle-object tick body: it first ORs bit 2 into the object header''s Flags byte, then
  calls sprite_clearFinalPalette to strip the palette-flash high nibble left by a hit. object_finishCollisionHitReaction_801AD12
  finalizes any pending hit, and sub_800F672 is called with no arguments (likely a shared per-frame helper).
  It then loads the handler table at off_80DA134 (ten entries: custom lantern handlers interleaved with
  shared ones like battle_ResetObjectActionState and battleObject_initAndRunAI) and passes it to battleObject_dispatchActionHandler_801B394,
  finishing with object_updateSprite and object_presentCollisionData. This matches the common ''object
  on-frame update'' shape used across battle objects, here specialized for the HP lantern spawned by battleObject_hpLanternInit_80DA07C.'
