    table and bl battleObject_dispatchActionHandler_801B394; Table mixes lantern-specific handlers (sub_80DA15C,
    sub_80DA2EC, sub_80DA37A, sub_80DA172, sub_80DA266) with shared battle object states; Tail sequence
    bl object_updateSprite / bl object_presentCollisionData is the canonical per-frame object tick tail;
