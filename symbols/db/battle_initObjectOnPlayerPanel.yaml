name: battle_initObjectOnPlayerPanel
address: '0x080E6580'
kind: function
status: probable
summary: 'Initializes a battle object that anchors itself to the player''s panel: loads sprite 0x80/0xC/0x13,
  copies the player''s panel coordinates, sets a palette from Param1, plays sound 0x29, and enters its
  UPDATE state; destroys itself (and zeroes its related object''s flags) if no player is found.'
interface: (r5 = BattleObject*) -> void; sets object CurState to UPDATE or CUR_STATE_DESTROY
details: With the object in r5, it loads sprite resource (0x80, 0xC, 0x13) via sprite_load plus sprite_loadAnimationData,
  and flags it shadowless. It sets CurAnim=1 and CurAnimCopy=0xFF, then calls battle_findPlayer with the
  object's Alliance byte; if no player is returned, it clears oObjectHeader_Flags of RelatedObject1Ptr
  and sets its own state to CUR_STATE_DESTROY, so the object only lives when a player exists. Otherwise
  it copies the player's PanelX/PanelY into Param3/Param4, ORs flag bit 2 into oObjectHeader_Flags, sets
  the sprite palette to Param1<<2 via sprite_setPalette, recomputes pixel coordinates from the panel,
  plays sound effect 0x29 (0x2A-1), sets CurState to CUR_STATE_UPDATE, and calls sub_80E65E0. The Param1-derived
  palette suggests callers pick a palette variant per instance.
