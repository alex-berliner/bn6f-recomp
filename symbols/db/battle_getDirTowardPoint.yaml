open_questions:
- Exact semantic of the 0–3 return values (which facing each number is) is unconfirmed without seeing
  the caller sub_80A8548 use the result
- Which object structure r5 points to (its +0x4/+0xC/+0x10 fields) is inferred, not verified from a known
  struct definition
- The mechanic (shift, subtract object position, call battle_calcAngleOctant_800118A, table-lookup, zero-vector
  fallback) matches the code at 0x080A8518–0x080A8538 exactly. The proposed name 'battle_getDirTowardPoint'
  is fine, but the summary's claim about 'hysterde addressing' is unfounded; the table byte_80A8540 =
  {1,1,0,3,2,0,0,0} maps 1->1, 2->1, 3->0, 4->3 (two adjacent octants sharing 1, not symmetric dead-zone).
  Also the interface should note that for octant 0 the function falls back to the object byte at r5+0x4,
  and that the unused tail 0,0,0 of the table is dead bytes, not part of the mapping.
