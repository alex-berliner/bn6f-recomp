name: battle_killObjectByHpDrain_80D45EC
address: '0x080D45EC'
kind: function
status: confirmed
summary: Destroys a battle object by draining one HP from its related object and marking the object destroyed.
interface: void battle_killObjectByHpDrain_80D45EC(BattleObject* obj in r5) -> obj in r5, leftover r1
  from battle_decrementHp; clobbers flags and r0-r3/lr
details: 'Entry point expects the battle object pointer in r5 (preserved through the call). Reads the
  object''s Param1 byte (oBattleObject_Param1); when it equals 4, it first calls sub_80D4674, an extra
  cleanup/branch for that param value which may replace the r5 object pointer before continuing. It then
  loads RelatedObject1Ptr (oBattleObject_RelatedObject1Ptr) from the object and calls battle_decrementHp
  on that target, removing HP from the linked object. Finally it stores CUR_STATE_DESTROY into the object''s
  CurState byte (oBattleObject_CurState) and returns, so the next state-machine pass removes it. r1 on
  exit is whatever battle_decrementHp leaves there; callers reportedly read r1 and r5, so r1 appears to
  be part of the contract even though it is just an untyped byproduct here. Preserves r4-r7.

  '
