name: battle_runCurActionAndValidatePanel
address: '0x080C3A24'
kind: function
status: probable
summary: Runs one of two per-phase action handlers for a battle object, then destroys the object if it
  ends up on an invalid panel.
interface: (r0 unused on entry, r5 = battle object ptr) -> r0 = object_isCurrentPanelValid result consumed
  internally; object's CurState field set to CUR_STATE_DESTROY on failure
details: Loads the object's oBattleObject_CurAction byte from [r5,#...] and uses it to index off_80C3A48,
  a two-entry handler table (sub_80C3A50, sub_80C3A78), calling the handler with lr set for a return.
  Before the call it computes r6 = r5 + 0x78, presumably a sub-structure the handlers work on. After the
  handler returns, it calls object_isCurrentPanelValid; if the object no longer occupies a valid battlefield
  panel, it writes CUR_STATE_DESTROY into the object's CurState/phase word so the engine deletes it. The
  two-entry table suggests the action has exactly two phases (e.g. windup and fire).
