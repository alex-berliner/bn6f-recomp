  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; bx r1 — dispatch on CurAction via off_80C3A48;
    mov r6,#0x78; add r6,r6,r5 before the call — hands the handlers a pointer at object+0x78; bl object_isCurrentPanelValid;
    tst r0,r0; bne locret — post-action panel validity check; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    — destroys the object when invalid; table has exactly two entries (sub_80C3A50, sub_80C3A78), matching
