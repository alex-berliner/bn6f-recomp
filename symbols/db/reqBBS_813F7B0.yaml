open_questions:
- What BBS request type 0xF7 represents (net-battle result, e-mail, trade, etc.).
- Why the f3a0 header is written twice (before and after the fade-check branch); likely because the pending-mark
  path mutates it.
- Meaning of the fixed byte pattern 0xFF/0x00/0x50/0x50/0x1A/0x36 — possibly command opcode, sub-field, and two
  0x50 screen/window coordinates.
- What slot value 0x1C encodes for the caller's request-state enum.
