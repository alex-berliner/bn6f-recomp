name: reqBBS_813F7B0
address: '0x0813F7B0'
kind: function
status: confirmed
summary: Prepare a BBS request in the toolkit's f3a0 buffer, skip the pending mark during screen fades, then dispatch
  the request via reqBBS_813F8F0.
interface: void reqBBS_setupAndDispatch(u32 slot /*r5*/, u32 toolkit /*r10*/) -> r0=0; r10,r11 clobbered by callee;
  nz set
details: Reads the f3a0 toolkit sub-buffer pointer from [toolkit + oToolkit_Unk200f3a0_Ptr] and writes six fixed
  bytes at offsets +2 (0xFF), +3 (0x00), +6 (0x50), +7 (0x50), +9 (0x1A), +0xA (0x36) — likely a request type/size/offset
  header. Calls IsScreenFadeActive; if no fade is in progress (Z clear) it also writes a pending-request marker
  (0xF7) to the BBS state buffer at [toolkit + oToolkit_Unk2009740_Ptr] offset 0, clears offsets 4 and 6, and stamps
  the caller's slot byte at [r5] with 0x1C, then re-initialises the f3a0 header. Finally tail-calls reqBBS_813F8F0(slot)
  to actually transmit the request. Returns r0 = 0 with NZ flags set.
