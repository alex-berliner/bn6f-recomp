open_questions:
- What sub_80A5EC8 is and when it dispatches here (is r5 a task/object struct, and what does it do before
  this call)?
- What overworld object ID 0x14 actually is (its update/draw handlers) to confirm it is the logout warp/effect
- Whether the three struct fields are x/y/layer or other spawn parameters
