name: ow_spawnLogoutObject
address: '0x080A5F68'
kind: function
status: probable
summary: Spawns overworld map object 0x14 and plays the log-out sound effect, matching the jack-out/logout
  sequence.
interface: (r5 = context struct; r1 = [r5,#0xc], r2 = [r5,#0x10], r3 = [r5,#0x14] as spawn params) ->
  r0 = sound result; calls SpawnOverworldMapObject(r0=0x14,...) and PlaySoundEffect(0x76)
details: The routine takes its inputs through r5, a pointer to some state/object struct rather than the
  usual r0-r3 argument registers, suggesting it is invoked as a callback or tail target where r5 already
  holds the owning object. It reads three fields at offsets 0xc, 0x10 and 0x14 and passes them as the
  parameter/position arguments to SpawnOverworldMapObject with a fixed object ID of 0x14. It then unconditionally
  plays sound effect 0x76, which the project's constants already name SOUND_LOG_OUT_76. The combination
  of a fixed spawn plus the log-out jingle points to the logout/jack-out effect used in the overworld/cyberworld
  transition. Nothing is returned from the spawn call; r0 after return is just the sound routine's result.
  The caller sub_80A5EC8 is undocumented, so the trigger conditions are unconfirmed.
