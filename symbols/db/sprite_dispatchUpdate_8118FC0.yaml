name: sprite_dispatchUpdate_8118FC0
address: '0x08118FC0'
kind: function
status: confirmed
summary: Runs the per-object update handler selected by byte 6 of the object in R5, then advances the object's sprite
  animation via sprite_update.
interface: void sprite_dispatchUpdate(Object *obj /* r5 */, ...) — all registers pass through to the handler and
  to sprite_update; no meaningful return value
details: 'Reads the handler index from byte offset 6 of the object whose pointer is in R5, multiplies it by 4, and
  indexes the table at off_8118FD8 (whose entries are Thumb handler addresses). The table currently has two entries:
  index 0 is nullsub_8118FE0 (a bare "bx lr" stub, i.e. an object with no custom update logic) and index 1 is sub_8118FE4.
  Dispatch is done with the classic "mov lr, pc / bx r0" trick so the handler''s return lands on the following "bl
  sprite_update" call; all other registers (R0-R4, R6-R12, flags) are passed through untouched, and whatever the
  handler leaves in R0/R1 is simply forwarded to sprite_update. After sprite_update returns, the function returns
  to its own caller with "pop {pc}". sprite_update is presumably driven by the same object pointer (likely also
  in R5) or by values the handler left behind.

  '
