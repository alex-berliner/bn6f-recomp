name: NPCCommand_give_detatched_shadow
address: '0x0809EFC6'
kind: function
status: confirmed
summary: NPC script command that detaches the NPC's shadow sprite, flagging the object and refreshing its shadow
  setup.
interface: void NPCCommand_give_detached_shadow(OverworldNPCObject *npc /*r5*/, int *scriptPos /*r6*/); // clobbers
  r0,r1,r3, sets NZCV from the scriptPos increment
details: 'One of the overworld NPC script commands (r5 = overworld NPC object, r6 = current

  position in the NPC''s script/command stream). It ORs flags 0x100 and 0x80

  (OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x80 plus the undocumented 0x100 partner) into

  oOverworldNPCObject_UnkFlags_60, marking the NPC''s shadow as detached

  (cast separately from the sprite), then tail-calls sprite_hasShadow with the same

  npc and scriptPos so the shadow state is (re)applied to the NPC''s sprite. On return

  it advances the command stream position by 1; the ADDS also sets NZCV, which the

  contract lists among outputs. The "detatched" spelling is a typo in the original

  symbol; "detached" is proposed. r1 is clobbered by the flags read/modify/write.

  '
