name: decomposeTileBlock_8132FD0
address: '0x08132FD0'
kind: function
status: confirmed
summary: Decomposes a 3-block compression chain header into a left/right interleaved tile-ID list and
  blits it as one 32x32 BG tile block on layer 2.
interface: void decomposeTileBlock_8132FD0(const u16 *tile_block_header /* r5 */);
details: "Walks three compression chains starting at offsets 0xC, 0xE, 0x10 of a block header (r5)\nusing\
  \ SWI 6 with arg 0xA, counting chain lengths into a 3-entry stack array. Builds an\ninterleaved two-column\
  \ tile-ID buffer in eDecompBuffer2013A00: a fixed 2-entry header pair\ncopied from word_201C4E0, then\
  \ per-block \"body\" + \"trailer\" sections:\n  - Block 0: sequential IDs from VRAM base 0x30B250, then\
  \ 2 pairs from unk_201C4F0\n  - Block 1: sequential IDs from VRAM base 0x30B260, then 2 pairs from unk_201C500\n\
  \  - Block 2: sequential IDs from VRAM base 0x30B270 (no trailer)\nEach block writes to alternating\
  \ left/right columns. The trailing column count (right/2)\nis subtracted from 0x19 to position the blit\
  \ within a 25-tile-wide row. CopyBackgroundTiles\nis invoked as CopyBackgroundTiles(j = 0x19 - right/2,\
  \ i = 5, which_tile_block_32x32 = 2,\ntile_ids = eDecompBuffer2013A00, j_size = right/2, i_size = 2).\n\
  Preserves r4-r7; clobbers r0-r3, lr, flags. Used to materialise a single 32x32 BG tile\nblock from a\
  \ compressed multi-chain header into VRAM.\n"
