    (loc_80E6EF6); Timer<0 path increments Param2 and restarts phase 0 unless Param2>=6, then sets CurStateActionPhase
    to CUR_STATE_DESTROY (loc_80E6ED8..E70A); object_highlightPanel called every 8 Timer2 ticks with the
    stored PanelX/PanelY (warning highlight at loc_80E6EC6); Element field passed as r2 to the thunderbolt
