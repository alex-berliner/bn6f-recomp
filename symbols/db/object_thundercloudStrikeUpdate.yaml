name: object_thundercloudStrikeUpdate
address: '0x080E6EA0'
kind: function
status: probable
summary: Battle object that strikes lightning (thunderbolt) on a panel up to six times, highlighting the
  panel as a warning.
interface: (r4 = object pointer, r5 = object pointer) -> r0 = none; destroys object via CurStateActionPhase
  after 6 strikes
details: 'Reads/writes the standard battle object struct: CurPhase, Param1 (extra initial delay added
  to 0x1E frames), Param2 (strike counter, max 6), PanelX/PanelY (set from callee sub_80E6F32), Element
  (passed to the thunderbolt spawner), Timer, Timer2, and the packed CurState/ActionPhase field set to
  CUR_STATE_DESTROY at the end. Phase 0 is init: sets phase 4, Timer = Param1+0x1E, Timer2 = 0, and fetches
  target panel coords. Phase 4 increments Timer2, calls object_highlightPanel every 8th tick (Timer2>>3
  carry), decrements Timer; at Timer==0x1E it calls spawnThunderboltObject_80C7D50 with panel X, Y, Element,
  r4=0 and the object''s damage field; when Timer goes negative it increments Param2 and either loops
  back to phase 0 or destroys the object at 6 strikes.'
