name: battle_introWaitCrossNetReady
address: '0x080088B2'
kind: function
status: probable
summary: 'Battle intro state: kicks off cross-net-battle intro effect kind 0x1C once, then waits until
  the linked partner''s session is ready before advancing, otherwise queues state 0xC.'
interface: (r0 = unused, r5 = battle intro/effect state struct) -> r0 = result of comm_checkCrossNetBattleReady
  (not meaningful); mutates fields r5+2 (halfword state), r5+3 (byte state), r5+8 (halfword)
details: This is a step in a state machine whose context struct is passed in r5. On the first entry (byte
  at r5+3 == 0) it dispatches battle sub-effect kind 0x1C via battle_dispatchKindEffect_801E792 — that
  callee allocates a sprite slot and picks a per-kind handler, so 0x1C is presumably the cross-net/linked-battle
  intro effect — clears the halfword at r5+8 and sets the state byte at r5+3 to 4 to mark the effect as
  launched. Every tick it then calls comm_checkCrossNetBattleReady_801E754, which checks the double/linked-battle
  flag and the partner's session mode; while the partner isn't ready it writes 0xC into the halfword at
  r5+2, which appears to be the state selector this step returns to its dispatcher. It has no known callers
  in the listing, so the exact owner of the struct is inferred from field usage.
