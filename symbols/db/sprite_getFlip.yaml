name: sprite_getFlip
address: '0x08002F7E'
kind: function
status: confirmed
summary: Returns the flip value (0-3) stored in bits 4-5 of an object's sprite field Unk_16.
interface: u8 sprite_getFlip(ObjectHeader* header /* r0 */)
details: 'Takes a pointer to an object header in r0 and reads the sprite offset byte (oObjectHeader_SpriteOffset,
  byte at +2), masks off its low nibble with &0xF0 (the offset is always a multiple of 16), and adds it to the header
  pointer to reach the object''s sprite struct. From the sprite struct it reads byte oObjectSprite_Unk_16, extracts
  bits 4-5 (mask 0x30, shifted right by 4), and returns that 2-bit flip value in r0. Pure getter with no side effects;
  only writes r1/r3 as scratch and leaves the caller''s flags clobbered.

  '
