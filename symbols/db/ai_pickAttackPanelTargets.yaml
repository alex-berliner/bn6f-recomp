name: ai_pickAttackPanelTargets
address: '0x08108D24'
kind: function
status: probable
summary: AI attack helper that writes the target's packed panel to AiAttackParam[0], then picks a random
  panel from a row-filtered scan into [1] (skipped if target panel invalid) and from a column-ignored
  scan into [2] (always attempted); filter words indexed by alliance from byte_8108DE0.
interface: (r5 = battle object, r7 = oAIAttackVars block) -> AiAttackParam[0]=target panel byte, [1]=random
  row-scan panel, [2]=random ignore-column panel; r0/r1 clobbered
details: Clears AiAttackParam (offset 0x34) and reads the target object's (col,row) from oBattleObject+0x12/0x13,
  validating them with object_isValidPanel; if valid it stores the packed (col|row<<4) byte at r7+0x34.
  It then temporarily reserves the target's panel with object_reservePanel, scans panels with object_getPanelsInRowFiltered
  (r0=2, filter words taken from byte_8108DE0 at Alliance*8, buffer on stack), releases the reservation,
  and picks a random entry with GetPositiveSignedRNG % count (SWI 6 division) stored at r7+0x35. The same
  reserve/scan/release pattern repeats with object_getPanelsIgnoreColumnFiltered (skipping the target's
  column) and the result goes to r7+0x36. The alliance-indexed table byte_8108DE0 supplies per-side filter
  parameters (0x20/0x80 for one side, 0/0xA0 for the other). If the target panel is invalid, both random
  picks are skipped. The final panel reservation is released and not re-taken.
