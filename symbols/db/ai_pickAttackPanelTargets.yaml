    slots being filled; ldrb r0,[r1,#0x12]/[r1,#0x13] + object_isValidPanel: target object''s panel coords
    gate everything; object_reservePanel/object_removePanelReserve around each scan mark panels only to
    exclude them from the filter; GetPositiveSignedRNG + svc 6 (Div) + ldrb [sp8+result] picks a random
    scan result; ldr r3,off_8108DDC with Alliance*8 index: per-alliance filter table byte_8108DE0'
