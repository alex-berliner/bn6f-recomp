  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The name and interface are correct: r5 is the battle object (alliance read at +0x??), r7 is oAIAttackVars,
    and AiAttackParam at +0x34 gets packed panel + two random picks via row-filtered (object_getPanelsInRowFiltered)
    and column-ignored (object_getPanelsIgnoreColumnFiltered) scans with GetPositiveSignedRNG % count.
    However the claim ''If the target panel is invalid, both random picks are skipped'' is wrong: beq
    loc_8108D94 on invalid only skips the first (row) pick; loc_8108D94 unconditionally reserves, scans
    ignore-column, and writes r7+0x36. Also the callee description of object_getPanelsIgnoreColumnFiltered
    says ''skipping the row'' but the function name and filter usage indicate a column skip—the proposal
    correctly says ''ignore-column'' but the row-scan param r0=2 is a fixed row/depth, not literally ''same-row''
    as the target''s row.; run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
