name: sub_80FDF98
address: '0x080FDF98'
kind: function
status: hypothesis
summary: Tiny wrapper that calls sub_800FE28 with a pointer to the fixed ROM constant 0x181E242A and returns its
  result.
interface: 'Next sub_80FDF98(void /* inputs: r5 (unused here), lr */); returns callee result in r0'
details: Pushes lr, loads the address of dword_80FDFA8 (a single ROM word, 0x181E242A, little-endian bytes 2A 24
  1E 18, i.e. 42/36/30/24), passes it in r0 to sub_800FE28, and tail-returns with pop {pc}. It never touches the
  r5 that callers pass in, so r5 is presumably part of the caller-side calling convention rather than an argument
  to this routine. No other state is read or written by this thunk itself; all actual behavior lives in sub_800FE28,
  which per the lifter clobbers r1, r2, flags nzcv and lr and returns its result in r0. The constant's bytes descend
  in steps of 6, which could be a small table of sizes/timers/ids, but its meaning is unknown until sub_800FE28
  is identified.
