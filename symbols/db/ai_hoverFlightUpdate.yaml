name: ai_hoverFlightUpdate
address: '0x08110C26'
kind: function
status: probable
summary: 'AI update for a hovering object: drifts X while timer>0 and sub_8110D34==0; on timer expiry
  lands from panel stored at +0x7A/+0x7B, on sub_8110D34!=0 clears airborne flag and lands from +0x78/+0x79,
  then releases panel reserve, sets collision region 1, and ends the attack element.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = undefined; updates object X/panels/collision
  and AIAttackVars
details: Decrements the object's timer at +0x7C; while non-negative and sub_8110D34 returns 0, applies
  oBattleObject_XVelocity to X (flight drift). On timer expiry or sub_8110D34 != 0 it clears object-header
  flag bit 1 (airborne?), loads the landing panel from +0x7A/+0x7B (path 1) or from +0x78/+0x79 after
  calling sub_81110C8 and sub_811109C (path 2), stores it into both oAIAttackVars_TargetPanelX/Y and oBattleObject_PanelX/Y,
  then calls object_setCoordinatesFromPanels, object_updateCollisionPanels, object_removePanelReserve,
  object_setCollisionRegion(1), and sets oAIAttackVars_HitElement=0x28 and oAIAttackVars_AttackElement=0.
  Both paths end with object_setPanelsFromCoordinates + object_updateCollisionPanels to re-sync position
  from the new panel.
