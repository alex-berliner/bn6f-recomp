name: chatbox_handleJackInResult
address: '0x08133618'
kind: function
status: probable
summary: Handles a jack-in attempt result by displaying a denial message or running the successful jack-in
  text script.
interface: (r5 = chatbox state/context) -> r0 = undefined; flags condition-code dependent
details: Queries sub_8133D64 for a result. A result of 0 plays the menu-select sound, stores 12 at offset
  0x68 of the context, and runs text script index 12; a result of 16 stores 8; any other nonzero result
  shows the canned "can't jack in" message and stores 16. The state field at context offset 0x68 appears
  to select or record the resulting chatbox flow, but its exact type is not yet known.
