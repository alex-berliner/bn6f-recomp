kind: function
status: confirmed
summary: Initializes a battle-object sub-phase by transforming its Damage field and propagating two bytes to a related
  object, then runs a 90-frame timer before destroying the object.
interface: void sub_80C0C48(void r2 u32 a, void r3 u32 b, void r4 u32 c, void r5 oBattleObject* obj) -> preserves
  r4/r5/r6/r7; clobbers r0/r1/r2/r3/lr + nz/c/v; uses lr for return
details: "Operates on a battle object at `r5`.\nOn the first invocation (PhaseInitialized == 0):\n  - Reads `obj->Damage`\
  \ (u16) and transforms it with `sub_80E199A`; result kept in r6.\n  - Reads `obj->Unk_0c` (u8) and `obj->Unk_0d`\
  \ (u8) into r0/r1.\n  - Switches `r5` to `obj->RelatedObject1Ptr` and calls `sub_80CE224(r0=r0, r1=r1, r5=related,\
  \ r6=derived)`.\n  - Restores r5 to `obj`, sets `obj->Timer = 0x5a` (90 frames) and marks the phase as initialized\
  \ via `obj->PhaseInitialized = 4`.\nOn subsequent invocations:\n  - Decrements `obj->Timer`; when it underflows,\
  \ writes `CUR_STATE_DESTROY` into `obj->CurStateActionPhaseAndPhaseInitialized` to terminate the object.\nThe\
  \ trailing `byte_80C0C84` (eight bytes: 0x32,0x32,0x32,0x32,0x32,0x00,0x00,0x00) sits just beyond the function\
  \ body; it appears to be incidental padding/data adjacent to the sub (five `0x32` bytes then three zero bytes).\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
