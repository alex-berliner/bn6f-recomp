name: eT1BattleObject2_HP
address: '0x0203AB84'
kind: ram
previous_names: []
status: confirmed
summary: Current HP (u16) of T1 battle object 2 (eT1BattleObject2 + 0x24, oBattleObject_HP), usually an enemy; writing
  0 deletes it.
details: 'A field label the t1_battle_object_struct macro (bn6f/include/structs/BattleObject.inc) makes for each
  of the 16 T1

  battle objects in eT1BattleObjects (bn6f/ewram.s): eT1BattleObject2 is at 0x0203AB60 (0x0203A9B0 + 2 * 0xD8) and

  its u16 HP field at +0x24 (MaxHP follows at +0x26). The code reaches it only through a battle-object pointer

  (`ldrh/strh rX, [r5, #oBattleObject_HP]`, about 200 sites), never by this name or address.


  Object 0 is MegaMan; in vidsync''s runs objects 1-3 at 0x0203AAAC, 0x0203AB84 and 0x0203AC5C are the enemies whose

  HP the kill handler zeroes.

  '
evidence:
- method: assembly-reading
  date: '2026-10-17'
  detail: The struct definition puts `u16 HP` at loc=0x24 and `u16 MaxHP` at 0x26; eT1BattleObject2 is the third
    t1_battle_object_struct in eT1BattleObjects, and the ELF symbol is 0x0203AB60 + 0x24.
  refs:
  - bn6f/include/structs/BattleObject.inc:105-106
  - bn6f/ewram.s:3027
  reproduce: 'sed -n ''105,106p'' bn6f/include/structs/BattleObject.inc

    sed -n ''3025,3028p'' bn6f/ewram.s

    arm-none-eabi-nm bn6f/bn6f.elf | grep -i '' eT1BattleObject2$\| eT1BattleObject2_HP$''

    '
  result: u16 HP // loc=0x24; eT1BattleObject2 0x0203ab60, eT1BattleObject2_HP 0x0203ab84
- method: runtime
  date: '2026-10-17'
  detail: vidsync's kill handler (try_kill) finds the live enemies (eActiveT1BattleObjectsBitfield, Alliance 1,
    HP and MaxHP nonzero) and writes 0 to each one's HP at +0x24, at the frame that makes the battle end when the
    video's does; the sync keeps the write only when the game then follows the speedrun video. The BeastSP route
    in recomp (tools/traces/beastsp.poke, vidsync's kept fixes) writes 0x203ab84=0x0000/2 in 12 of those fixes,
    games 144359 to 421513, in most of them with object 1 (0x203aaac) or 3 (0x203ac5c) too.
  refs:
  - tools/vidsync/autosync.py:1009-1017
  - tools/vidsync/autosync.py:1042
  - tools/vidsync/autosync.py:1006
  - tools/traces/beastsp.poke
  reproduce: 'grep -n ''def try_kill\|def enemies_alive\|a + 0x24\|^T1_OBJS'' tools/vidsync/autosync.py

    grep -n ''0x203ab84=0x0000/2'' tools/traces/beastsp.poke

    '
  result: '12 route lines (55, 57, 59, 75, 146, 159, 168, 174, 178, 180, 191, 199), e.g. line 55: 144359:144360
    0x203ab84=0x0000/2,0x203ac5c=0x0000/2'
