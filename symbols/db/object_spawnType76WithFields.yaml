name: object_spawnType76WithFields
address: '0x080E8BC0'
kind: function
status: probable
summary: Spawns battle object type 0x76 and fills its panel position, element, related-object link, alliance,
  damage word and chip ID from the caller's registers.
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = source/related object ptr, r6 = damage+stamina
  word, r7 = chip ID) -> r0 = new oBattleObject ptr (or spawn failure, EQ set); fields of the new object
  written
details: The wrapper pushes {r0-r2,r5} so those four words sit on the stack as the extra parameters object_spawnType4
  consumes alongside r0 = type 0x76, then pops them back into r1-r3/r5 after the call. On success (spawn
  returns a non-null object in r0 with Z clear) it writes oBattleObject_PanelX/PanelY/Element from the
  pushed values, stores r5 into RelatedObject1Ptr, copies the halfword AllianceAndDirectionFlip out of
  that related object into the new one, and stores r6 into DamageAndStaminaDamageCounterDisabler and r7
  into ChipID. If the spawn fails it jumps straight to the return, leaving the popped registers as garbage
  side effects. The register-shuffling pop (values come back in r1-r3, not r0-r2) is a quirk to reuse
  the stack arguments as field sources. No callers are known, so the exact in-game identity of object
  type 0x76 is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'push {r0-r2,r5} + mov r0,#0x76 + bl object_spawnType4: four stack params plus type in r0; pop
    {r1-r3,r5} reorders the pushed args so strb r1,[r0,#PanelX] etc. store caller r0/r1/r2; str r5,[r0,#RelatedObject1Ptr]
    and ldrh r1,[r5,#AllianceAndDirectionFlip] link and copy alliance from the source object; beq locret
    after the bl skips all stores on spawn failure; r6/r7 stored unwashed into DamageAndStaminaDamageCounterDisabler
    and ChipID'
