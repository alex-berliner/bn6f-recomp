name: battle_restoreBaseSprite
address: '0x080E70F8'
kind: function
status: confirmed
summary: Puts a battle object back on its base/idle sprite, restoring sprite params saved by a related object and
  returning to the normal update state.
interface: u32 battle_restoreBaseSprite(u32 obj /* r5 */); passes r5 through unchanged
details: 'Restores a battle object (in r5) to its base sprite after some overlay/transformation sprite was in use.
  It copies 12 bytes (three words) of saved sprite parameters from RelatedObject1''s struct at offset +0x34 back
  into the same offset of this object, then reloads the base graphics via sprite_load (VRAM tile 0x80, 8 wide, 0xf
  tall) and sprite_loadAnimationData, and calls sprite_noShadow. It sets flag bit 1 (0x02) in oObjectHeader_Flags
  to mark the sprite for refresh, resets both oBattleObject_CurAnim and oBattleObject_CurAnimCopy to animation index
  8 (the idle/base animation), calls sprite_setAnimation(8) and reloads animation frame data, resets the palette
  to 0, and reapplies the object''s current flip via object_getFlip + sprite_setFlip. Finally it writes CUR_STATE_UPDATE
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the object resumes normal per-frame updating. Uses
  RelatedObject1Ptr as the source of the saved sprite parameters, so the caller must have that pointer valid. r4/r5
  preserved; returns r5.

  '
