name: MapScriptCutsceneCmd_write_word
address: '0x08035EDA'
kind: function
status: confirmed
summary: Map-script cutscene command that writes a 32-bit value read from the script stream to an address also read
  from the script stream.
interface: int mapScriptCmd_writeWord(u8 r7 *cursor, /* r4 script state */); returns 1 (success) in r0; r4/r6/r7
  and NZCV updated
details: 'Handles one cutscene map-script opcode ("write word"). Reads a 32-bit word from the script stream via
  ReadMapScriptWord (passing mode 1 in r6) — this word is the destination address, returned in r4. Then calls ReadMapScriptWord
  again with mode 5 to fetch the value to store, also returned in r4, using the first word (kept in r0) as the read''s
  argument. Stores the value with STR r4,[r0]. Advances the script cursor in r7 by 9 bytes: 1 command byte + 2 payload
  words. Always returns r0 = 1 (success). Flags on return: N/Z from the success constant, C/V from the cursor add
  (r7 += 9), so callers relying on those flags get cursor-add results.

  '
