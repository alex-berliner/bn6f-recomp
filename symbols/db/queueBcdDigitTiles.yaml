name: queueBcdDigitTiles
address: '0x0802B438'
kind: function
status: probable
summary: Renders three 4-digit BCD numbers as digit-glyph tiles into VRAM via queued GFX copies, with
  leading-zero blanking using glyph 0xA. (r0=tile sheet base, r1=halfword array; uses caller-set r5=UI
  struct)
interface: '(r0 = digit tile-sheet base (0x20 bytes per glyph, glyph 0xA = blank), r1 = halfword array
  of entry IDs; uses r5 = UI struct: +0x20 halfword base, +0x24 halfword index) -> void'
details: For each of three slots (loop counter 0..2), it reads a halfword ID from r1 at offset (r5+0x20
  + r5+0x24)*2; 0xFFFF means value 0. Otherwise it loads a halfword from table byte_802B5FC at id*8 +
  slot*2 (three values packed per 8-byte entry) and converts it to packed BCD with memory_bcdConvert.
  It then walks the top four BCD nibbles (r6 from 0x10 down to 4), suppressing leading zeros by substituting
  glyph tile 0xA (0xA*0x20 byte offset into the r0 tile sheet) until a nonzero digit appears; the last
  digit always renders. Each digit queues a 32-byte (one 4bpp tile) copy via QueueWordAlignedGFXTransfer
  to 0x6009A80 + slotIndex*0x20, so the 12 output tiles land consecutively in VRAM (base tile ~0x4D4 of
  the char block).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_802B448: halfword ID read from [r1 + (r5.0x20 + r5.0x24)*2], 0xFFFF check via dword_802B4D0;
    loc_802B45E: table lookup byte_802B5FC + id*8 + slot*2 then memory_bcdConvert — three BCD values per
    entry; loc_802B472 loop: nibble extraction (0x20-r6 shift, r6 -= 4) with leading-zero suppression
    tile 0xA (r2*0x20 into r0 sheet); QueueWordAlignedGFXTransfer(r0 + digit*0x20, 0x6009A80 + [sp]*0x20,
    0x20) — one tile per digit into VRAM; Outer loop cmp r0,#3 / blt gives exactly three rendered numbers
    per call'
