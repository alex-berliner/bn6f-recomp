  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary correctly describes three slots of 4-digit BCD conversion with leading-zero blanking
    and queued tile copies into VRAM at 0x6009A80, but the proposed interface is wrong: the function takes
    (r0=tile sheet base, r1=halfword array) as args and accesses r5 (UI struct) without it being a parameter,
    so it must be set up by callers (sub_802A8A4, sub_802A9D0). The tile size is hardcoded to 0x20 bytes
    and glyph 0xA is used as blank, matching the code. Name ''queueBcdDigitTiles'' is reasonable but no
    standard prefix applies; ''queue'' is acceptable. The summary''s phrase ''12 output tiles'' is accurate.;
    run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
