    entry seeds Unk_10 from Unk_12 and stamps Unk_01=4. - `ldrh r0,[r7,#oAIAttackVars_Unk_10]; sub r0,#1;
    strh r0,[r7,#oAIAttackVars_Unk_10]; bge loc_80EC6D6` — timer countdown with branch-on-non-negative.
