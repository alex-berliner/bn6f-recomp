    loc_80EC6C6` — retry counter. - `mov r1,#0x2c; bl GetBattleNaviStatsByte_AllianceFromBattleObject;
    cmp r0,#0x18; beq loc_80EC6D0` — skips the reset path when "ProcessingBug"/Transformation navi stat
    equals 0x18. - `bl GetAIData_Unk_44_Flag; ldr r1,dword_80ECA20 (=0x10000); tst r0,r1; bne loc_80EC6D0`
    — checks bit 0x10000 of `AIData->Unk_44`. - `ldr r0,[r5,#oBattleObject_AIDataPtr]; ldrb r1,[r0,#oAIData_ActorType];
    cmp r1,#2; bne loc_80EC6D0; ldrh r0,[r0,#oAIData_JoypadHeld]; mov r1,#2; tst r0,r1; beq loc_80EC6D0`
    — checks ActorType == ACTOR_TYPE_PLAYER and JoypadHeld & JOYPAD_B. - `mov r0,#4; str r0,[r7,#oAIAttackVars_Unk_30];
    mov r0,#0; strh r0,[r7,#oAIAttackVars_Unk_00]` — reset path at loc_80EC6C6. - `bl object_canMove;
    beq locret_80EC706; bl playerObject_checkDirectionButtons_800FA54; cmp r0,#0; beq locret_80EC706;
    mov r6,r0; bl sub_800F964; cmp r0,#0; beq locret_80EC706; bl sub_80EC792; bl battle_getCrossNaviTableByte_8010332;
    mov r4,r0; bl battle_GetAllianceFactionFromBattleObject_80103A8; mov r2,r0; mov r0,r6; mov r1,r4;
    bl sub_80116AE` — happy path: gates by canMove + cross-table byte + faction, then forwards (dir, crossNaviByte,
    faction) to sub_80116AE.'
