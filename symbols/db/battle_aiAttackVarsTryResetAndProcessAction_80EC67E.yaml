name: battle_aiAttackVarsTryResetAndProcessAction_80EC67E
address: '0x080EC67E'
kind: function
previous_names:
- sub_80EC67E
status: probable
summary: Advances the AI AttackVars counter, falls through to process an attack action when the timer
  runs out, and resets the state if interrupted by invalid conditions.
interface: '(r5 = current BattleObject, r7 = AI AttackVars block, r10 = toolkit) -> r0/r1/r2/r3 = scratch/clobbered
  ; side effects: writes to AIData->Unk_44 bit, AIData->Unk_30/Unk_00, AttackVars->Unk_01/10/30, and jumps
  into sub_80EC792/sub_80116AE'
details: "- If `oAIAttackVars_Unk_01` is 0, this is the entry of the state: copies `oAIAttackVars_Unk_12`\
  \ (16-bit) into `oAIAttackVars_Unk_10`, and sets `Unk_01 = 4`.\n  - Always decrements `oAIAttackVars_Unk_10`\
  \ (16-bit). If the counter is still >= 0 (timer not expired), proceeds to the \"happy path\" at loc_80EC6D6.\n\
  \  - On timer expiry: if `oAIAttackVars_Unk_0d != 0`, it is decremented and execution continues only\
  \ if it reaches 0.\n  - Once `Unk_0d == 0` it calls `GetBattleNaviStatsByte_AllianceFromBattleObject(0x2c)`.\
  \ Comparing the result to `0x18` (the Transformation/ProcessingBug range) and short-circuits if equal.\n\
  \  - Then tests `AIData->Unk_44` against bit `0x10000` (the AI attack vars \"doodle\" / Busy-Doodle\
  \ flag) via `GetAIData_Unk_44_Flag`. If the bit is set, control jumps to loc_80EC6D0 (sub_80EC792).\n\
  \  - Then checks `AIData->ActorType == 2` (ACTOR_TYPE_PLAYER) and JoypadHeld bit 0x2 (B button). If\
  \ not a player or B is not held, jumps to loc_80EC6D0.\n  - Otherwise (loc_80EC6C6): writes `4` to `AttackVars->Unk_30`,\
  \ clears `AttackVars->Unk_00`, returns.\n  - Happy path (loc_80EC6D6): if `object_canMove` is false,\
  \ return. Otherwise call `playerObject_checkDirectionButtons_800FA54`. If the direction is 0, return.\n\
  \  - Then call `sub_800F964`. If that returns 0, return. Otherwise call `sub_80EC792`, `battle_getCrossNaviTableByte_8010332`,\
  \ `battle_GetAllianceFactionFromBattleObject_80103A8` (r2 = faction), then forward (r0=dir, r1=crossNaviByte,\
  \ r2=faction) into `sub_80116AE`.\n  - The AIAttackVars are accessed via `r7` (which is set by caller\
  \ or implied by register contract); `r7` is not in `in` here so it is established before the call. `r10`\
  \ = toolkit (BattleStatePtr etc.). `r5` = current BattleObject.\n  - The trailing data `dword_80EC70C\
  \ = 0x2C241C16` (paired with offsets of \"Doodle\", \"Busy\" sub-states 0x16, 0x18, 0x1c, 0x2c) plus\
  \ `off_80EC708 -> dword_80EC70C` is dead data following the function; not referenced by this function.\n"
