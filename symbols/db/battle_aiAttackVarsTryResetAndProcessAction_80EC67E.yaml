open_questions:
- Exact semantics of the Unk_0d retry counter and what conditions (other than Transformation and AI busy-flag)
  clear it. The literal `4` written to Unk_30 hints at a "next phase = 4" jump table transition, but whether
  that drives a state-machine in sub_80EC792 or elsewhere is not visible from this function alone.
- Why the `dword_80EC70C = 0x2C241C16` table sits after this function with `off_80EC708 -> dword_80EC70C`
  — looks like a jump-table consumed by a sibling function rather than this one.
