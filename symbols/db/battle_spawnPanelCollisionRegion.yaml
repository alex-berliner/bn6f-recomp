name: battle_spawnPanelCollisionRegion
address: '0x080D43E8'
kind: function
status: probable
summary: Spawns a battle collision/attack region on the owning battle object's current panel with fixed
  preset parameters.
interface: (r5 = battle object, not an argument register) -> r0 = result of object_spawnCollisionRegion;
  no flags used
details: 'Reads oBattleObject_PanelX and oBattleObject_PanelY from the battle object in r5 and passes
  them as the region''s panel position to object_spawnCollisionRegion. The remaining arguments are hardcoded:
  r2 = 5 (likely region type/size), r3 = 0, r4 = 0x3205FF80 (packed region properties: flags/element/damage
  word), r6 = 0, r7 = 0x3300. r5 is used directly and never saved or set inside the function, so the caller
  must place the object pointer in r5 — a non-standard calling convention quirk. With no known callers,
  which object uses this and what the 0x3205FF80 property word encodes is not determined from this function
  alone.'
