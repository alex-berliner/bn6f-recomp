name: sub_8031BE2
address: '0x08031BE2'
kind: function
status: hypothesis
summary: Runs a three-call setup/update sequence, passing fixed tile parameters (0, 0x10, 0xC, 0xC) to the middle
  call.
interface: void sub_8031BE2(int r0, void* r5); // calls sub_803172E(r0,r5), sub_8031594(r0, 0, 0x10, 0xC, 0xC),
  then sub_8031B7C(r0, r5); returns whatever the last callee leaves in r0/r3-r7 and flags
details: Tiny trampoline with no state of its own. It first calls sub_803172E forwarding the incoming r0 and r5
  unchanged, then loads the constant tuple r2=0, r4=0xC, r3=0x10, r5=0xC (note r5, an incoming argument, is overwritten
  here) and calls sub_8031594, and finally calls sub_8031B7C with whatever registers that left behind. Everything
  the caller sees on return (r0, r2-r7, nzcv) is simply whatever sub_8031B7C left, since this function sets no outputs
  itself. The constants 0x10 x 0xC with stride 0xC look like tile/grid dimensions (e.g. a 16x12 tile region, likely
  a text window or BG map block), so the middle call plausibly draws or clears such a region and the other two calls
  handle surrounding setup/teardown, but the callees' own semantics are unknown.
