name: NPCCommand_jump_if_flag_clear
address: '0x0809EDD0'
kind: function
status: confirmed
summary: 'NPC script command: reads a u16 event flag; if the flag is set, advances the script pointer by 7 bytes;
  if the flag is clear, reads a u32 jump target from the script and returns it as the new script pointer.'
interface: void NPCCommand_jump_if_flag_clear(u32 /*inout*/ r6, u32 /*?*/ r10) -> u32 r6
details: "Handler for a single NPC-script opcode. The 7-byte instruction layout it expects is:\n  [opcode u8] [eventFlag\
  \ u16] [jumpTarget u32]\nUses `r6` as the running NPC script pointer (same convention as the other NPCCommand_*\
  \ handlers):\n  - `ReadNPCScriptHalfword(script_ptr + 1)` -> the u16 event flag.\n  - `TestEventFlag(flag)` ->\
  \ tested via Z flag (Z set => flag is clear, matching the\n    helper comment `!Z`; bne .flagNotClear falls through\
  \ to \"flag clear\" only if Z==0).\n  - Branch inversion vs. the function name: the literal arm named \".flagNotClear\"\
  \ is the\n    fall-through that returns `script_ptr + 7` (skip instruction), and the taken `bne` is\n    actually\
  \ \"flag is clear -> jump to target\". The C helper inlines this correctly\n    (`if (test_event_flag(flag)) return\
  \ script_ptr + 7; else return target;`).\n  - `ReadNPCScriptWord(script_ptr + 3)` -> u32 jump target (only consumed\
  \ when jumping).\nNo global state is touched directly besides the event-flag array via `TestEventFlag`\nand the\
  \ script byte stream via `ReadNPCScriptHalfword`/`ReadNPCScriptWord`.\n"
