name: battle_spawnInitializedObject6c_80D1EB8
address: '0x080D1EB8'
kind: function
status: confirmed
summary: Spawns a 0x6C-byte battle object via object_spawnType3 and initializes it from the caller's registers
  plus a source object passed in r5.
interface: void sub_80D1EB8(u32 r0, u32 r1, u32 r2, u32 r3, u32 r4, BattleObject* source /*r5*/, u32 r6,
  u32 r7); outputs r1/r2 path-dependent, r5 preserved
details: 'Calls object_spawnType3 with type/size 0x6C, forwarding r1, r2, 0, and r4 (arguments are shuffled
  through the stack with push {r0-r3,r5} / pop {r1-r5} around the call). On success the new object pointer
  comes back in r5 and the spawn also yields a damage-counter value in r6 and a related-object pointer
  in r7. Initialization of the new object: PanelX = entry r0, PanelY = entry r1, ExtraVars+8 = entry r2,
  ExtraVars+0xC = entry r3, DamageAndStaminaDamageCounterDisabler = spawn''s r6, Element = 4, AllianceAndDirectionFlip
  copied halfword from the source object (entry r5), RelatedObject1Ptr = spawn''s r7. Then it sets bit
  0x10 in the new object''s oObjectHeader_Flags. If the spawn fails (object pointer 0), it returns immediately
  without writing anything. Quirk: the register contract is path-dependent - on failure r1/r2 still hold
  the entry values (r0/r1), on success r1 = flags|0x10 and r2 = the ORR mask 0x10 left in the register;
  r5 always returns its entry value (the source object pointer), since the spawn overwrote r5 with the
  new object pointer used as scratch for the field stores.

  '
