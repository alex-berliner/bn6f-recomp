open_questions:
- Where is RandomizeExtraToolkitPointers called from, and does the caller actually consume the r1-r3 outputs as
  a relocated ToolkitPointers base + remaining offsets, or only the rewritten table?
- Why is the randomization masked to zero (anti-cheat / debug toggle / Falzar-vs-Gregar build difference)? Is eUnusedExtraToolkitPtrsOffset
  actually used elsewhere, or always zero in retail?
- What is eUnusedExtraToolkitPtrsOffset and which structure in the eGameState layout owns it?
- Why does GetRNG run when its result is immediately ANDed to zero - is the RNG index advance (e.g. the visible
  random number / mystery-data sequence) load-bearing?
- Is copyWords_80014EC safe to call with src == dest (the masked-zero case), or does it assume non-overlapping halves
  of eGameState when this hook is enabled in other builds?
