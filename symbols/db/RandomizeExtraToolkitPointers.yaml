name: RandomizeExtraToolkitPointers
address: '0x08006C22'
kind: function
status: hypothesis
summary: After a game-state reload, rebuilds the trailing extra-toolkit pointer slots inside the ToolkitPointers
  block of eGameState from a base pointer stored at eUnusedExtraToolkitPtrsOffset, leaving the counters and table
  pointers in r1-r3 for the caller.
interface: 'void RandomizeExtraToolkitPointers(void); /* in: r10 = &eGameState.ToolkitPointers, lr = return address;
  out: r0 = lr, r1 = final loop counter (0x58), r2 = eGameState + stored offset, r3 = &ToolkitExtraPtrsOffsets,
  plus flags from the final cmp r1,0x58 */'
details: 'Calls GetRNG and stores the result as the "new" eUnusedExtraToolkitPtrsOffset, but two `mov r1, #0 / and
  r0, r1` and `mov r0, #0 / and r3, r0` pairs mask both the new RNG-derived offset and the previously-stored offset
  to zero, so this is effectively a no-op "randomization" (likely an anti-cheat artifact or a stub left in the Falzar
  build). GetRNG is still invoked, so the RNG index advances as in the original. The body then calls copyWords_80014EC
  to copy 0x35BC bytes from eGameState+old_offset to eGameState+new_offset - with both offsets zero this is a self-copy
  of eGameState. After the copy, r10 (start of ToolkitPointers) is advanced by 0x3C to point at the extra-pointer
  slots; the loop walks ToolkitExtraPtrsOffsets (88 bytes, loop bound 0x58 by the original cmp/branch form) and,
  for each entry, writes `(eGameState + new_offset) + offset` into the corresponding slot of ToolkitPointers so
  the toolkit pointers resolve to the relocated toolkit block. Leaves r0 = saved lr (because of the `pop {r0}; bx
  r0` epilogue), r1 = loop counter at 0x58, r2 = eGameState + stored offset, r3 = &ToolkitExtraPtrsOffsets, and
  is called in a context where the caller is expected to read those r1-r3 outputs (the call site immediately reuses
  the new pointer table).

  '
