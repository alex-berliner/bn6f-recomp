name: battle_tickAiSelfDrain_8010230
address: '0x08010230'
kind: function
status: confirmed
summary: Per-frame AI tick that drains 1 HP from a battle object at a fixed interval read from its navi-stats byte
  0x18, skipping objects at/below 1 HP.
interface: void battle_tickAiSelfDrain_8010230(BattleObject *obj /* r5 */); // caller passes obj in r5; preserved
  r4/r6; returns carry+overflow from last flag-setting op
details: 'Runs once per battle update for an AI-controlled object (r5). Early-outs when

  battle_isTimeStop or battle_isPaused is active, and when the object''s HP

  (u16 at oBattleObject_HP) is <= 1, so the drain can never kill the object.

  Follows oBattleObject_AIDataPtr to the AI data struct and reads/writes the

  byte at offset 9 as a tick counter. The interval between hits is looked up

  via GetBattleNaviStatsByte_AllianceFromBattleObject with r1=0x18 (which

  navi-stats byte 0x18 of the object''s alliance/faction selects), then

  indexed through byte_80102A4; an interval of 0 disables the behaviour and

  just keeps the counter cleared. Each call increments the counter; when it

  reaches the interval, object_subtractHP(1) removes 1 HP and the counter

  resets to 0. Behaviour resembles a slow self-damage/HP-siphon tic for

  certain characters.

  '
