name: CutsceneCmd_run_or_stop_cutscene_camera_script
address: '0x0803816A'
kind: function
status: confirmed
summary: Map-script command that either starts a named cutscene camera script or stops the running one and recenters
  the camera on the player.
interface: 'void CutsceneCmd_run_or_stop_cutscene_camera_script(CutsceneState* r5, /* r7 */ u8*& scriptReadPos,
  u8 r10 /* unused/ignored */); returns r0 = 1 (script interpreter keeps running); also outputs NZ/C/V flags from
  that 1, trashes r1/r2/r4/r6, returns advanced r7 and lr. No registers preserved.

  '
details: 'Map-script command handler for cutscene camera control. r5 is the cutscene state block and r7 is the current
  read cursor in the map script. It reads a one-byte flag (r6 is set to 1 before ReadMapScriptByte, telling it the
  operand width). If the flag is 0, it reads a 2-byte script id (r6 = 2 before ReadMapScriptWord), stores it in
  CutsceneState.CutsceneCameraScriptPtr (oCutsceneState_CutsceneCameraScriptPtr), passes it to SetCutsceneCameraScript,
  and sets CutsceneState.CutsceneCameraScriptActive (byte) = 1; r7 advances by 6 (flag byte + word). If the flag
  is nonzero, it NULLs the script pointer, calls cutsceneCamera_focusCameraOnPlayerMaybe_8036faa to snap the camera
  back to the player, sets CutsceneCameraScriptActive = 0, and advances r7 by 2 (flag byte only). Both paths end
  with r0 = 1 so the map-script interpreter continues. Quirk: the flag byte is a "stop" flag — 0 means start the
  following script, any nonzero value stops.

  '
