status: confirmed
summary: Dispatches to one of five mode handlers for an object whose state lives at [r5+2], using a pre-multiplied
  byte index into a 5-entry jump table.
interface: 'void objectDispatch_8129FE0(void); // in: r4,r5,r6,r10,lr; out: r5,r6,r10,r11; clobbers r0-r3,r7-r9,r12,nzcv'
details: 'Tail-calls one of sub_812A008 / sub_812A028 / sub_812A058 / sub_812A14C / sub_812A0CC

  based on the byte at [r5+2] of the caller-supplied object struct, which stores its

  mode already pre-multiplied by 4 so it can be used directly as a byte offset into

  the word table at 0x08129FF4. The "mov lr, pc; bx r0" / "pop {pc}" pair is a

  standard ARM/Thumb tail-call trick: the handler returns to the pop, which then

  returns to this function''s real caller without an extra frame. Inputs r4, r6, r10

  and the returned values r5, r6, r10, r11 are passed through implicitly via the

  guest register file (no save/restore of r4-r11 in this frame). r5 is the object

  pointer.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
