name: battle_waitTimer2EndPhase
address: '0x080CD1AE'
kind: function
status: probable
summary: Battle object phase handler that counts down Timer2 and ends the phase (clearing CurPhase) when
  it hits zero.
interface: (r5 = battle object) -> decrements oBattleObject_Timer2; when zero, sets oBattleObject_CurPhaseAndPhaseInitialized
  = 0; flags not meaningful
details: Loads the halfword at oBattleObject_Timer2 from the battle object in r5, subtracts 1, and stores
  it back. If the result is nonzero the function returns immediately, keeping the object in its waiting
  state. When the counter reaches zero it writes 0 to oBattleObject_CurPhaseAndPhaseInitialized, which
  is the standard 'phase finished' signal in the battle loop. It is a leaf routine using r5 as the object
  pointer, so the caller supplies the object outside the standard r0-r3 argument registers — typical of
  phase-handler tables. No other fields are touched.
