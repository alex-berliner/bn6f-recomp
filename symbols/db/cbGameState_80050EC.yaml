name: cbGameState_80050EC
address: '0x080050EC'
kind: function
status: confirmed
summary: Top-level game-state tick — runs the active subsystem handler selected via GameStateJumptable, then advances
  both hardware RNGs.
interface: "void cbGameState_80050EC(void)\n  // inputs:  r10 = GameToolkit pointer (other r4-r9/r11/r12/lr as caller\
  \ left them)\n  // outputs: r0-r3, NZCV = state of GetRNGSecondary (last callee)\n  // preserved: r4-r7 (push/pop)\n"
details: "Reads the current GameState via oToolkit_GameStatePtr off the toolkit, then\nindexes GameStateJumptable\
  \ by oGameState_SubsystemIndex to dispatch a\nthumb-target handler (the +1 in every entry patches the LSB for\
  \ BX). Jump\ntable entries (subsystem index -> handler):\n  0x00 EnterMap (gamestate_OnInit?)\n  0x04 gamestate_OnMapUpdate_8005268\n\
  \  0x08 battle_init_80052D8\n  0x0C HandlesBattleMainUntilEndOfBattleThenTriggersEnterMap\n  0x10/0x14/0x18 sub_800536E\
  \ / sub_80053E4 / sub_8005462\n  0x1C/0x20/0x24/0x28/0x2C sub_800555A / sub_8005642 / sub_80056B8 / sub_800572C\
  \ / sub_80057A0\n  0x30 sub_80055CE\n  0x34/0x38 sub_8005814 / sub_800585A\nAfter dispatch, unconditionally calls\
  \ GetRNG and GetRNGSecondary to tick\nboth RNG counters every frame. cbGameState_ prefix suggests this is the\n\
  main-loop callback registered with the BIOS-like tick framework.\n"
