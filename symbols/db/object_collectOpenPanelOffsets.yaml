name: object_collectOpenPanelOffsets
address: '0x080BA9A4'
kind: function
status: probable
summary: Scans a block of panels ahead of a battle object (columns 2-5, rows 1-3, mirrored by alliance),
  tests each with the panel-type and panel-flag checks, and stores the passing panels' packed (x|y<<4)
  offsets into a byte list on the object, returning how many were found.
interface: (r0/r5 = battle object ptr; r5 must be preset by caller) -> r0 = number of matching panels
  written to object+0x68 list; flags clobbered
details: 'Loops r4=0..3 over a per-alliance table byte_80BA9F8[alliance*4+r4] (alliance 0: 5,4,3,2; alliance
  1: 2,3,4,5 — i.e. distances 2-5 mirrored to always point into the far side) crossed with r6=1..3, using
  each pair as (x,y) panel offsets relative to the object. For each candidate it calls object_checkPanelTypeMatchesValue_800D618(table
  value, r6, object''s oBattleObject_Alliance) and, if that passes, object_checkPanelParameters with a
  required-flag mask of 0x10 and a forbidden mask of 0x0F880080, so only panels with flag 0x10 set and
  none of the 0x0F880080 bits (occupied/hole-type state) qualify. Matches are packed as (tableOffset |
  r6<<4) and appended at oBattleObject+0x68+n; the loop stops filling when no more candidates pass but
  always runs all 16 offsets. Returns the count in r0. The caller that consumes the object+0x68 list is
  not shown, so the downstream use (likely an attack/support picking target panels) is inferred.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Alliance]; lsl r0,#2; add r0,r4; ldrb r0,[byte_80BA9F8+r0] selects
    an alliance-mirrored column offset; two-step filter: bl object_checkPanelTypeMatchesValue_800D618
    then bl object_checkPanelParameters with r2=0x10, r3=0x0F880080 masks; lsl r1,#4; orr r0,r1; strb
    r0,[r5,#0x68+r7]; add r7,#1 packs and appends each hit to the object''s list; byte_80BA9F8 = 05 04
    03 02 02 03 04 05: two alliance rows of distances 2-5, i.e. the panel scan region is always on the
    opposite side; mov r0,r7 before pop: the function''s return value is the number of stored entries'
