open_questions:
- What consumes the object+0x68 offset list — the sole caller sub_80BA84C is unknown, so the gameplay
  purpose (attack targeting, spawn placement, etc.) is unconfirmed
- Exact meaning of panel flag 0x10 and the forbidden mask 0x0F880080 in the panel status word
- Whether the table value is an absolute column or an offset from the object's column, and likewise for
  r6 1..3 vs the 3-row grid
