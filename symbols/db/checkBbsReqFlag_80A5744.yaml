name: checkBbsReqFlag_80A5744
address: '0x080A5744'
kind: function
status: confirmed
summary: After a BBS request, set event flag 4/234 (EVENT_4EA) if the live request byte differs from the
  previously saved one.
interface: 'void checkBbsReqFlag_80A5744(void);  // inputs: r5,r6,r10,lr (caller-saved pointer/state slots);
  outputs/clobbers: nz,c,v,r0,r1,r2,r3,lr; preserved r4,r5,r6,r7,r8,r9,r11,r12'
details: 'Reads a pending-BBS byte at R5+5; if 0 there is nothing to do. Otherwise calls reqBBS_81409E4,

  subtracts 0xC0 from its return value, and compares it against the saved byte at R6+5. Only on

  mismatch does it set event flag 4/0xEA via SetEventFlagFromImmediate (the "EVENT_4EA" tag in the

  movflag line corresponds to flag index 4, value 0xEA). Acts as a one-shot guard ensuring the

  flag is set exactly when the BBS response deviates from the last requested value, and that no

  flag is touched when the response matches or there is no pending request.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
