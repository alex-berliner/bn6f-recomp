name: object_slideXAndCheckPanel
address: '0x080E54FC'
kind: function
status: probable
summary: Moves a battle object forward by its X velocity, destroying it if it leaves the field or its
  lifetime counter expires, and starts its hole-fall action if it lands on a hole panel.
interface: (r5 = battle object, no args) -> r0 = 1 if object still alive, else 0; destroys object by writing
  CUR_STATE_DESTROY to its state field
details: Takes r5 as the battle object (project's this-register convention). Adds oBattleObject_XVelocity
  into oBattleObject_X, then recomputes PanelX/PanelY via object_setPanelsFromCoordinates. If the new
  panel is invalid, or the word pointed to by oBattleObject_ExtraVars+0xc (looks like a lifetime/hold
  counter) is zero, it zeroes that counter word and sets the object's state to CUR_STATE_DESTROY. Otherwise
  it reads the panel status word via object_getPanelParameters and tests bit 0x4000000 for alliance 0
  (player side) or bit 0x8000000 otherwise (enemy side) — the per-side hole/off-panel flags. If the bit
  is set it sets oBattleObject_CurAction = 4 with phase 0, presumably a falling/destroyed animation state.
  Returns 1 in r0 on the survive path (fallthrough leaves r0 = panel flags masked nonzero) and 0 after
  the destroy branch.
