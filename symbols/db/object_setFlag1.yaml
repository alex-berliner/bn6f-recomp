name: object_setFlag1
address: '0x0801A152'
kind: function
status: confirmed
summary: ORs the given flag bits into a battle object's CollisionData ObjectFlags1 word.
interface: void object_setFlag1(uint32 flags /* r0 */, BattleObject *obj /* r5 */); returns r1 = CollisionData pointer,
  r2 = updated ObjectFlags1, sets NZ from the result
details: Loads the battle object's CollisionData pointer (oBattleObject_CollisionDataPtr), ORs r0 into the oCollisionData_ObjectFlags1
  field, stores it back, and leaves NZ set from the resulting word so callers can test flags immediately. r1 (collision
  data pointer) and r2 (new flags value) are also live on return. Small helper used to set ObjectFlags1 state bits
  (e.g. hit/invuln-style flags) on battle objects; r0 is a bitmask, not a flag index.
