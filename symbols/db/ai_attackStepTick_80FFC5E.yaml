name: ai_attackStepTick_80FFC5E
address: '0x080FFC5E'
kind: function
status: confirmed
summary: Ticks one step of an enemy AI's queued attack, starting it (element 4, anim 0, load step timer)
  on the first call and handing the state back to object_exitAttackState when the timer runs out.
interface: void sub_80FFC5E(u32 object /*r5*/, u32 companion /*r6*/, AIAttackVars* vars /*r7*/); returns
  u16 result in r1 (from object_exitAttackState on the exit path, pass-through otherwise); clobbers r0-r3,
  r6, r7, lr and nzcv
details: 'Per-frame tick of an AI attack state machine. r7 points at the object''s oAIAttackVars: if AttackElement
  is 0, an attack is queued by writing element 4 (some fixed attack id/element used by this AI), setting
  the battle object''s oBattleObject_CurAnim (r5) to 0, and copying AttackDuration into StepTimer as the
  countdown. On subsequent calls (element nonzero) StepTimer is decremented; while it stays >0 nothing
  else happens, and when it hits zero object_exitAttackState(r5=object, r6=companion, r7=vars) is called
  to leave the attack state, which also produces the r1 output value. On the start and still-counting
  paths r1 is simply passed through, so callers get a defined value only after the exit call. r6 is never
  read here, just forwarded.'
