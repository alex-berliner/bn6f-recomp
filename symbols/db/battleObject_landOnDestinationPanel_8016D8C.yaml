open_questions:
- Exact meaning of oBattleObject_Unk_0d=8 / CurPhase=0x14 - whether 0x14 is "wait/animation" or "post-move
  idle" can be read once neighbouring phase handlers are analysed.
- Semantics of oBattleObject_Unk_1c/Unk_1d signed offsets used to step FuturePanelXY - they look like
  per-tick X/Y panel displacement, but their reset/initialisation isn't visible from this function.
