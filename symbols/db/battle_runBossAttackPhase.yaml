  date: '2026-10-18'
  detail: 'init block: strb #5 CurAnim, PlaySoundEffect(0xB0), save/restore oAIData_ActorType+AIIndex
    around spawn_t1_0x5_tempAttackObject_80B8E30; Timer==10 branch: object_getFrontDirection+object_getCoordinatesForPanels
    feed spawn_t1_0x0_EffectObject, then object_spawnDimmingCollisionRegion with Element (r2); same branch
    calls camera_initShakeEffect_80302a8 with args from the chosen constant set and battle_spawnExtraVarsObject;
    two param sets (0x405ff01/0x11e00 vs 0x405ff13/0x12800) selected by ExtraVars+7 nonzero, indicating
