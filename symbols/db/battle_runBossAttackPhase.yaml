name: battle_runBossAttackPhase
address: '0x080BDFA6'
kind: function
status: probable
summary: 'Per-frame handler for a boss attack phase: sets anim 5, plays sound 0xB0, temporarily rewrites
  related-object AI identity to spawn a temp attack object, then at Timer==10 selects one of two attack
  variants via ExtraVars byte 7, spawns an effect and an element-based dimming collision region on the
  front panel, triggers camera shake, and spawns an extra-vars object before transitioning to phase 0x10
  at Timer>0x32.'
interface: (r5 = battle object) -> void; object Timer and CurPhaseAndPhaseInitialized updated
details: On first run (PhaseInitialized clear) it sets CurAnim=5, plays sound 0xB0, saves the related
  object's actorType/AIIndex to bytes 0x74/0x75, temporarily rewrites them to (2,0), builds a composed
  ID from battle_getSpecialActorSlotIfAiMatches/battle_getNaviIdFromActor/sub_80EBB34 and spawns a temp
  attack object via spawn_t1_0x5_tempAttackObject_80B8E30, then restores the saved identity. At Timer==10
  it chooses one of two parameter sets (0x18/0x405ff01/0x19 vs 0x36/0x405ff13/0x23) depending on ExtraVars
  byte 7, spawns an effect object at the panel in front via object_getCoordinatesForPanels, spawns an
  object_spawnDimmingCollisionRegion using the object's Element, triggers camera_initShakeEffect, and
  spawns battle_spawnExtraVarsObject. The phase runs until Timer passes 0x32, then writes phase 0x10.
evidence:
