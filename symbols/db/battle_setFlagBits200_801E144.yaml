name: battle_setFlagBits200_801E144
address: '0x0801E144'
kind: function
status: confirmed
summary: Sets flag bit group 0x200 (bit 9) in the battle-state flag structure at 0x2035280 and returns.
interface: 'void sub_801E144(void); // in: lr only; out: r0 = 0x200, r1/r2 = whatever flagSetBits_eStruct2035280_801BEB8
  leaves, lr = caller return; clobbers N/Z'
details: 'Tiny wrapper: loads r0 with 1<<9 = 0x200 and tail-calls flagSetBits_eStruct2035280_801BEB8,

  which operates on the flag/engine structure at 0x2035280 (the battle/e-struct flag set).

  The callee preserves r0, so 0x200 is still in r0 on return even though this function never

  reads it. No other registers are touched here. The four .word literals after the pop are

  pool data (dword_86E1C78, unk_3001A80, dword_86E1C78) for nearby code, not used by this

  entry. What flag bit 0x200 means in game terms is not determined from this function alone.

  '
