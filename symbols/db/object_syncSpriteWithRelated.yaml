name: object_syncSpriteWithRelated
address: '0x080BFFC0'
kind: function
status: probable
summary: Copies a related object's sprite appearance state (flags, shader, palette, flip, mosaic/alpha)
  onto this object, then dispatches to a per-action handler.
interface: (r5 = battle object with oBattleObject_RelatedObject1Ptr set) -> tail-dispatches via off_80C001C
  jump table indexed by oBattleObject_CurAction; no r0 return of its own
details: 'Reads the object''s RelatedObject1Ptr and mirrors the parent''s visual state onto itself: ORs
  the parent''s 0x02 Flags bit into its own, copies the color shader (get then set on self), the final
  palette byte, the sprite flag-10/render-info-high pair (loc_8002F02 setter), the DirectionFlip-derived
  flip via object_getFlip/sprite_setFlip, and the mosaic/scaling parameters fed into sprite_setAlpha.
  It then loads a handler from off_80C001C using oBattleObject_CurAction (five entries, sub_80C0030..sub_80C0072)
  and tail-jumps to it with lr set so the handler returns to this function''s caller. This looks like
  an attached/mirrored battle entity (shadow, clone, or effect object) that inherits its related object''s
  rendering every tick.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'push/ldr RelatedObject1Ptr then flag bit 0x02 OR-copy: ldrb [r4,#oObjectHeader_Flags] ... orr/strb
    [r5,#oObjectHeader_Flags]; paired get/set on related vs self: bl sprite_getColorShader; bl sprite_setColorShader;
    bl sprite_getFinalPalette; bl sprite_setFinalPalette; flip and alpha copying: object_getFlip -> sprite_setFlip,
    and sprite_getMosaicScalingParameters -> sprite_setAlpha; tail dispatch: ldrb r0,[r5,#oBattleObject_CurAction];
    ldr r1,[r1,r0]; mov lr,pc; bx r1 through off_80C001C table; callee summaries (obj_getSpriteFlag10AndRenderInfoHigh,
    sprite_get*) all read the related object''s sprite record, confirming a visual-state mirror'
