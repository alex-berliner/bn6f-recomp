name: battle_state_endPhaseWithEffect_80079A8
address: '0x080079A8'
kind: function
status: confirmed
summary: Wraps up the current battle phase, recording the active battle-effect byte into the battle state and camera
  before queuing phase 8 (finishBattlePhase).
interface: void battle_state_endPhaseWithEffect_80079A8(battleState* state /* r5, plus r2-r4/r6/r7/r10 live inputs
  */)
details: 'Takes the battle state pointer in r5 (fields at +0x02 phase, +0x0d effect byte). Calls GetBattleEffects()
  and tests bit 3 (overlay/special effect flag); if set, the effect result byte comes from sub_803DD60(), otherwise
  it is 0. The resulting byte is stored to state->unk_0d and also to eCamera.unk_4C (0x20099CC, off_80079CC literal
  "=eCamera+76"). Then calls sub_800B144 to refresh the battle scene/camera, and finally writes phase value 8 into
  state->unk_02, which sub_8007978 picks up to dispatch battle_state_finishBattlePhase. The final "mov r0,#8" sets
  NZ; r4-r7 are preserved.

  '
