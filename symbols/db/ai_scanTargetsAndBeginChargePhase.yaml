name: ai_scanTargetsAndBeginChargePhase
address: '0x080E41F0'
kind: function
status: probable
summary: 'AI phase step: scans forward for enemy panels to attack; if found, starts a charge/timer phase,
  otherwise switches to a fallback action.'
interface: (r0 unused on entry, r5 = battle object) -> r0 = 0 if targets found, nonzero?; writes object
  fields; preserves nothing else
details: Called with r5 pointing at a battle object; it builds r0 = r5+0x60 (a scan context/buffer inside
  the object) and passes the object's Alliance and DirectionFlip to battle_scanForwardColumnTargets, which
  walks columns toward the enemy and records target panels. The returned pointer/count is kept in oBattleObject_ExtraVars+0x14.
  If targets were found it sets Timer=2, Timer2=30 (0x1E), zeroes ExtraVars+0x18, and enters phase 4 —
  presumably a wind-up before an attack using the stored targets. If nothing was found it sets CurAction=0xC
  and phase 0, i.e. aborts to another behavior. The +0x60 buffer and the meaning of action 0xC depend
  on callers not seen here.
