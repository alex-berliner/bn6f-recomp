name: object_resetActionAndPhase
address: '0x080C7524'
kind: function
status: probable
summary: Clears a battle object's current action and phase state, resetting it to its initial (zeroed)
  action/phase.
interface: (r5 = battle object pointer, nonstandard) -> r0 = 0; no flags meaningful
details: Takes the battle object in r5 (r0 is ignored/overwritten — an ARM GCC 'custom DP' calling convention
  where the object pointer lives in r5). It stores 0 into oBattleObject_CurAction (strb) and 0 into oBattleObject_CurPhaseAndPhaseInitialized
  (strh, clearing both the phase number and the phase-initialized flag in one halfword). This effectively
  returns the object to its first action/phase, e.g. for (re)spawning or action restart. Nothing else
  is touched and no calls are made.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strb r0,[r5,#oBattleObject_CurAction] with r0=0 clears the action field; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    zeroes phase and phase-initialized together; r5 is used directly as the object pointer while r0 is
    clobbered, indicating nonstandard register-based argument passing; function is a bare 6-instruction
    leaf with push/pop {lr} only
