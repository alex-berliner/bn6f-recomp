  date: '2026-10-19'
  detail: 'ldrb/strb on [r5,#0x1b] with sub #1 and ''bne locret'' = classic tick-down counter that only
    acts on expiry (sub_801D548 lines 2-5); both callee calls receive mov r0,#1; lsl r0,#0x15 = mask 0x00200000,
    showing one specific global flag drives the action; flags_clearBits_eStruct2035280_801BED6 summary
    confirms it clears that mask in the flags word at dword_20352C0; dispatch_801DACC''s signature (a0:
    flags32) -> () shows the mask is dispatched as an event/trigger after the flag is cleared'
