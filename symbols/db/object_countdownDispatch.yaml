name: object_countdownDispatch
address: '0x0801D548'
kind: function
status: probable
summary: Decrements an object's one-byte countdown timer at +0x1B; on reaching zero it clears global flag
  bit 21 (0x00200000) and dispatches with that flag mask.
interface: (r5 = structure with u8 countdown at +0x1B) -> r0 = 0x00200000 passed to dispatch; Z flag of
  the decrement escapes via the bne
details: 'Loads the byte at [r5,+0x1B], decrements it, stores it back, and returns early while it is still
  nonzero. When the counter hits zero, it builds the mask 1<<21 (0x00200000) and calls flags_clearBits_eStruct2035280_801BED6
  to clear those bits in the flags word at dword_20352C0, then calls dispatch_801DACC with the same mask,
  apparently to trigger whatever action is registered for that flag. This looks like a generic delay/timeout
  tick used by an object or task: fire an event once after N ticks. r5 is a caller-supplied context pointer,
  so the routine is position-independent of any single object type.'
evidence:
