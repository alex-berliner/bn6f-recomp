name: sprite_updateFlipsFromDirections
address: '0x080E8FB0'
kind: function
status: probable
summary: Refreshes the sprite flip state of three sub-objects owned by a parent object based on each one's
  current facing direction.
interface: (r0 = parent object pointer) -> r0 = last sub-object pointer from sprite_updateFlipFromDirection;
  flags from last callee
details: Takes a parent structure whose fields at +0x60, +0x64 and +0x68 hold pointers to three associated
  sprite-bearing objects (parts of one multi-sprite entity). It calls sprite_updateFlipFromDirection on
  each in turn, which reads that object's direction bytes (0x16/0x17), XORs them, and applies the result
  through sprite_setFlip. It returns whatever the final callee returns. Nothing else in the parent is
  touched, so this is purely a flip/orientation refresh helper for the trio.
