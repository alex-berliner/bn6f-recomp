name: ai_attackStepToTargetPanel
address: '0x081076EE'
kind: function
status: probable
summary: AI attack substep that teleports/steps the enemy onto its reserved target panel, then waits ~13
  frames before exiting the attack state.
interface: (r0 unused; r7 = AIAttackVars for this enemy, r5 = BattleObject) -> void; sets AttackElement=4,
  StepTimer=0xD on entry, decrements timer each frame after
details: On first entry (AttackElement==0) it latches element 4 as an 'in progress' marker, switches the
  object to animation 3, releases the panel reserved at TargetPanelX/Y, copies FuturePanelX/Y into PanelX/Y,
  releases that reservation too, and recomputes pixel coords/collision via object_setCoordinatesFromPanels
  and object_updateCollisionPanels. It clears flag 0x40 and sets the 'currently moving' flag (bit 1 of
  ObjectFlags1) in the collision data. It then loads StepTimer=0xD and, if AiAttackParam or PanelParamFlags2
  are nonzero, calls sub_80B8E58 (likely a sound/effect trigger). On subsequent frames it counts StepTimer
  down and, at zero, calls object_exitAttackState to return to the AI's idle flow.
