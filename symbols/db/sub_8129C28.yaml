name: sub_8129C28
address: '0x08129C28'
kind: function
status: hypothesis
summary: Runs the per-step handler selected by the state byte at [r5+3], then calls sub_812B25C(0x13) with the handler's
  leftover r4/r5/r6 as part of a scripted object update (likely a chatbox/sequence step machine).
interface: 'StepResult sub_8129C28(u32 r4, u32 r5, u32 r6, u32 r7, u32 r10);

  // reads r5+3 as state index, dispatches via table at off_8129C40

  // returns r5, r8, r9, r10, r11, r12 from the trailing sub_812B25C(0x13) call

  // clobbers r0-r4, r6, r7, lr and flags nzc

  '
details: '- Function is a small dispatcher. Loads pointer off_8129C3C (-> off_8129C40), uses [r5+3] as an index
  to fetch a Thumb handler address from the 13-entry table at off_8129C40, and bx''s into it with r0 = handler address,
  r1 = index. Several slots (2, 8, 11) reuse sub_8129D78, suggesting common sub-states.

  - After the handler returns, the function unconditionally calls sub_812B25C(0x13) passing in whatever r4/r5/r6
  the handler left. The register contract confirms this tail call''s outputs (r5, r8, r9, r10, r11, r12) are what
  callers observe from the step.

  - r5+3 byte is the dispatcher key; r5 itself is preserved across the handler and read out of the tail call, so
  r5 looks like a pointer to a per-object state/control struct whose byte at offset 3 is the state index.

  - The 0x13 argument to sub_812B25C looks like a routine-id within that callee''s own dispatcher, not data, which
  suggests this is a generic "tick" wrapper that combines a state-specific handler with a fixed cleanup/trigger
  call.

  - Without more context on r5''s struct and which subsystem owns sub_812B25C, the exact purpose (e.g., chatbox
  line advance, battle popup phase, event sequencer) cannot be pinned down. The handler table at off_8129C40 and
  its callees would disambiguate.

  '
