name: ai_megamanChargeShotBPrepAttack
address: '0x08011F8C'
kind: function
status: probable
summary: 'One step of MegaMan''s AI B+power charge-shot attack: counts down a delay, then loads attack
  parameters and hands off to the shot initializer.'
interface: (r6 = oAIData entity, r7 = oAIAttackVars) -> r0 = 0x11 next-state code (or callee's return
  when firing); no flags used
details: 'Reads oAIData_ChargeShotStepIndex: if zero, it jumps straight into megamanChargeShotBPwrAtk_init_8011A26
  to actually launch the charge shot. Otherwise it decrements that step counter, then reads a byte at
  r6+0x6C+remainingCount — a schedule entry indexed by the countdown — masks its low nibble and uses it
  to fetch a halfword from table byte_80E98C0, packing the pair into oAIAttackVars_ScratchVar (byte |
  halfword<<16). It then hardcodes the attack''s damage to 200 (0xC8) and 148 (0x94) in Damage/ExtraDamage,
  zeroes InitFlag, ChargeReadyFlag, AttackBoost, ExtraDamage and ChipUseDelay, and writes AiDifficultyTier
  = 2. It returns 0x11 as the resulting AI state. This looks like a per-frame ''wind-up'' step that prepares
  the shot''s stats until the timer expires.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r6,#oAIData_ChargeShotStepIndex]; bne loc_8011F9A -> bl megamanChargeShotBPwrAtk_init_8011A26
    shows this is a pre-step before the same attack's init; sub r0,#1 / strb ... / add r0,#0x6c / ldrb
    r0,[r6,r0] reads a per-countdown schedule byte from the AIData block; ldr r2,off_8012010 = byte_80E98C0;
    and r1,#0xf; lsl r1,#1; ldrh r1,[r2,r1] picks a halfword entry by low nibble; orr r0,r1 into oAIAttackVars_ScratchVar
    plus stores of 0xC8/0x94 into oAIAttackVars_Damage/ExtraDamage set the attack's parameters; mov r0,#0x11
    returned as the state transition value, matching a step-based AI attack state machine
  refs:
  - bn6f/asm/asm00_2.s:7228
  - 0x08011A26 megamanChargeShotBPwrAtk_init_8011A26
  reproduce: python3 tools/asmcat.py 0x08011F8C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-030611; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
