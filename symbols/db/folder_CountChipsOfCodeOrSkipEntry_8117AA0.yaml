name: folder_CountChipsOfCodeOrSkipEntry_8117AA0
address: '0x08117AA0'
kind: function
status: confirmed
summary: When iterating a 0x40-byte folder/pack entry list, counts folder chips matching a chip id + letter code,
  or advances the current entry pointer past entries with no valid letter code.
interface: void sub_8117AA0(int chipId /*r0*/, int codeIndex /*r1*/, ... /*r2-r5 live*/, FolderEntry** cursor /*r6*/)
details: 'Tail-recursive-style step in a folder/pack scan (the 0x40-byte stride matches the folder entry size used
  by the folder screens). r0 holds a chip id and r1 its letter code index. If r1 is a regular letter code (<= 0x1A,
  i.e. A-Z as signed compare), it calls GetChipCountOfCode(r0=chip id, r1=code) to count matching chips currently
  in the folder and immediately tail-calls sub_8117B94 with that result (and whatever live register state the caller
  chain keeps in r2-r5/r6). If the code index is greater than 0x1A (the ''*'' / no-code / wildcard-style slot that
  has no letter code to match), it simply bumps r6 by 0x40 bytes, skipping the cursor past this entry and returning
  with the advanced pointer. r4, r5 and r7 are preserved; r0/r1 and flags are clobbered by the call chain.

  '
