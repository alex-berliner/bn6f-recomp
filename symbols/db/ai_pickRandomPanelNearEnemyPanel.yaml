name: ai_pickRandomPanelNearEnemyPanel
address: '0x0810EBB8'
kind: function
status: probable
summary: AI helper that locates the closest enemy-side panel matching a filter and then picks a random
  panel from a relative-offset candidate list around it, likely for targeting an attack.
interface: (r5 = battle object, no register args) -> r0 = panel result from panelFlagCheck_8015D80 (or
  0 if no enemy panel found); r4-r7 preserved
details: Reads the object's alliance byte at [r5+#oBattleObject_Alliance], XORs it with 1 to look at the
  opposing team, and calls object_getClosestPanelMatchingRowFiltered with (team, 2, 0, 0x20) to find the
  nearest panel on the enemy's rows passing the filter; if none, returns immediately. On success it looks
  up the 8-byte alliance-indexed entry at byte_810EC30 via GetAllianceDependentPanelParamArgs, then calls
  panelFlagCheck_8015D80 with the 0x7F-terminated relative-offset list byte_810EBE4 (offset pairs like
  (0,-1),(0,1),(1,1)...) to randomly select one of the panels around/relative to that target. A near-duplicate
  routine at 0x0810EBF4 (currently dead code) is identical except it uses a different candidate list byte_810EC24,
  suggesting a second attack pattern variant. The function operates on the object held in r5, which the
  sole caller sub_810EBB0 must set up; the return value is whatever the panel picker produced.
