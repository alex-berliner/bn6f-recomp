name: SetNaviStatsByte
address: '0x080136F0'
kind: function
status: confirmed
summary: Writes one byte into a NaviStats record (record index normalized to 0/1) via the toolkit's NaviStats pointer.
interface: void SetNaviStatsByte(int record /*r0, normalized to 0/1*/, int fieldOffset /*r1*/, u8 value /*r2*/,
  Toolkit* toolkit /*r10*/); returns r0 = record * oNaviStats_Size, r3 = address of written byte
details: 'Normalizes r0 to a boolean-style record index (0 if zero, otherwise 1), scales it by oNaviStats_Size to
  get the byte offset of that record within the NaviStats array, loads the NaviStats base pointer from Toolkit->oToolkit_NaviStatsPtr
  (r10 is the toolkit), adds the record offset, and stores the low byte of r2 at base + recordOffset + r1. The record
  offset is left in r0 and the final byte address in r3 as side outputs; carry/overflow come from the address addition.
  Only supports two records (indices collapse to 0/1), suggesting the NaviStats array holds exactly two entries.

  '
