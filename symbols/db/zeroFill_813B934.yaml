name: zeroFill_813B934
address: '0x0813B934'
kind: function
status: confirmed
summary: Zeroes the two scratch work buffers (0x188 bytes and 0x40 bytes) hanging off the toolkit struct pointed
  to by r10.
interface: void toolkit_clearScratchBuffers(u32 toolkit /*r10*/, u32 passR2 /*r2 in/out*/, u32 passR3 /*r3 in/out*/);
  clobbers r0, r1, lr and flags
details: 'Takes r10 as a pointer to the toolkit/global state struct. Loads the pointer at oToolkit_Unk2004190_Ptr
  and calls ZeroFillByWord on it with a size of 0x188 bytes, then loads the pointer at oToolkit_Unk200414c_Ptr and
  calls ZeroFillByWord with a size of 0x40 bytes. Both blocks are filled with zeros word-by-word. r2 and r3 are
  neither used nor modified, but callers pass values in them and rely on them coming back unchanged, so they behave
  as live-through registers. r10 is preserved as well. This looks like a per-frame or per-phase reset of temporary
  battle/work buffers, run before the buffers are repopulated.

  '
