name: chatbox_F5_mugshot
address: '0x08041CF4'
kind: function
status: confirmed
summary: 'Executes the chatbox F5 (mugshot) scripting command: activates/deactivates the character portrait, sets
  its palette and facial-expression overrides, or looks up display data from id-to-value tables and triggers a graphic
  refresh.'
interface: u32 chatbox_processF5Mugshot_08041cf4(u8* r4_cmd, Chatbox* r5_chatbox) -> r0=1, r4 advanced by cmd size,
  NZCV from pointer-add; r5 preserved; r1/r2/r3/r7/flag-3e clobbered by callees
details: 'Reads the 1-byte sub-command at r4+1. Sub-cmd 1 clears FLAGS_3E_MUGSHOT_ACTIVE and advances r4 by 2. Sub-cmd
  2 writes the palette-index byte from r4+2 into oChatbox_MugshotPaletteIdx. Sub-cmd 3 writes the same byte to offsets
  0x1F0 and 0x1F1 (face/eye override). Sub-cmd 4 stores the byte as a 32-bit mugshot-ID at offset 0x90. The default
  path (sub-cmd 0 or other): if the mugshot flag is not yet active it sets FLAGS_3E_MUGSHOT_ACTIVE and FLAGS_3E_UNK_0004,
  and if flag 0x1000 is not set it writes color-filter 0x18C6 into oChatbox_MugshotColorFilter_40 (offset 0x40).
  Then it linear-scans a (mugshotId, paletteIdx) table at byte_8044244 (0xFF-terminated) to store the palette, reads
  the 0x1F0 field to decide whether the display-state is kept (==3) or zeroed, linear-scans a second (mugshotId,
  extraVal) table at byte_8044260 to obtain the extra display byte and the flag_byte (1 by default, 0 on table hit),
  writes those into oChatbox_Unk_14, oChatbox_Unk_0A, 0x98, and oChatbox_Unk_0B=0xFF, then calls sub_8040B3A (mugshot
  graphic refresh) which clobbers r1/r2/r3/r7. Returns r0=1.'
