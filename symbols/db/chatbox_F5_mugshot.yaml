open_questions:
- What exactly does flag 0x1000 gate (it suppresses the default 0x18C6 color filter)? Likely a 'player already chose
  a custom palette' flag.
- Semantics of oChatbox_Unk_0A, oChatbox_Unk_0B, oChatbox_Unk_14, and offset 0x98 – they appear to be per-portrait
  display/expression state consumed by the renderer.
- What does sub_8040B3A do with r0 (mugshot id) and r1 (flag_byte) – presumably rebuilds the OAM tilemap for the
  portrait sprite.
- Why does sub-cmd 1 advance r4 by only 2 while every other path advances by 3 (extra operand byte skipped)?
