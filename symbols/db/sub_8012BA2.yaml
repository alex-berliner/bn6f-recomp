name: sub_8012BA2
address: '0x08012BA2'
kind: function
status: confirmed
summary: AI decision helper that returns whether the AI Navi should perform a PowerAttack this turn, gated by alliance=0xB,
  a selected chip with element type 5 (Break) and specific chip flags, and only when the AI's PowerAttack state/button
  indicate a button-1 press while r4=0.
interface: u32 sub_8012BA2(u32 navi /*r0*/, u32 r4_arg /*r1*/, u32 ai_obj /*r5*/, u32 chip_idx /*r6*/); flags NZ
  set from result
details: "Resolves r6 to a chip descriptor via getChip8021DA8 and inspects bytes 6 (element/type) and\n9 (flags).\
  \ Returns 1 only when:\n  - GetBattleNaviStatsByte_AllianceFromBattleObject(navi, 0x29) == 0xB,\n  - the chip's\
  \ byte 9 has bit1 set and bit0 clear,\n  - the chip's byte 6 equals 5,\n  - and either r4 != 0, or (r4 == 0 AND\
  \ ai_obj->AIData->PwrAtkState == 2 AND\n    ai_obj->AIData->PwrAtkButton == 1).\nOtherwise returns 0. Touches\
  \ oBattleObject_AIDataPtr / oAIData_PwrAtkState /\noAIData_PwrAtkButton on the AI battle-object state.\n"
