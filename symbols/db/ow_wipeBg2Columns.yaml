name: ow_wipeBg2Columns
address: '0x0802AFD4'
kind: function
status: probable
summary: 'Advances a horizontal BG2 wipe transition: blanks background columns one by one while scrolling
  BG2, until the scroll reaches 120px.'
interface: (r0 unused/r5 = effect state struct) -> r0 = new BG2 scroll X; Z set iff scroll == 0x78 (wipe
  finished)
details: 'Uses a per-effect struct: byte +2 is an init/state flag (set to 4 on first call), +0x38 is the
  scroll offset (advances 0xC per call, pushed/popped across the loop and stored back), +0x3c is the column
  index into the 32x32 tile block. Each iteration calls CopyBackgroundTiles(col, 0, tileBlock=3, tileIds=byte_802B024
  (60 zero tiles), jSize=1, iSize=0x14), writing blank tiles as a full 20-tile-tall column. The number
  of columns per call alternates 1/2 based on bit 2 of the incremented scroll value. The new scroll value
  is written to toolkit->RenderInfo->BG2ScrollX and returned so callers can test for the 0x78 endpoint.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#2]/bne + str 0 to +0x3c,+0x38, mov #4 to +2: one-time init of a stateful effect
    struct; loop calls CopyBackgroundTiles(j=[+0x3c]++, 0, 3, byte_802B024 (all zeros), 1, 0x14): blanks
    one 20-tile column of tile block 3 per iteration; str r0,[r5,#0x38] then strh r0,[r1+oRenderInfo_BG2ScrollX]:
    scroll value drives BG2 X scroll, +0xC per call; cmp r0,#0x78 before pop pc: exposes a completion
    condition to the caller via flags; both callers (0x802ABD0, 0x802AED8) sit in the same transition-effect
    cluster, consistent with a wipe step'
