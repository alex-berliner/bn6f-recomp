name: battleObject_initFromPanelSpriteAndCollision_80CC4EC
address: '0x080CC4EC'
kind: function
status: confirmed
summary: 'Stands a freshly created battle object up on its panel: positions it, loads the shared standing sprite
  (bank 0x80, index 0x10, size 0x29), restarts its animation and attaches a collision box, freeing the object if
  the collision data cannot be allocated.'
interface: void battleObject_spawnStandingOnPanel_80CC4EC(battle_object* r5, u32 r8); callers pass the object pointer
  in r5 and one extra value in r8 (forwarded to object_presentCollisionData); clobbers r0-r3, r5-r8, lr and nz/c/v;
  preserves r4, r5-r7.
details: 'r5 is the battle object header. First calls object_setCoordinatesFromPanels to derive its position from
  its panel coordinates, then zeroes oBattleObject_Z and adds 1 to both oBattleObject_Z and oBattleObject_Y (single-panel
  forward/height step in fixed-point). Loads sprite (0x80, 0x10, 0x29) via sprite_load and suppresses its shadow
  with sprite_noShadow. Sets bit 1 (0x2) of oObjectHeader_Flags to mark the object as owning a loaded sprite, resets
  oBattleObject_CurAnim and oBattleObject_CurAnimCopy to 0, and applies animation 0 with sprite_setAnimation / sprite_loadAnimationData
  / sprite_update. Selects palette 0 and copies the object''s horizontal flip (object_getFlip) onto the sprite.
  object_createCollisionData returns the collision pointer or null on allocation failure; on failure the whole object
  is released via object_freeMemory and the routine returns without setting the state phase. On success it fills
  the collision box with object_setupCollisionData (extent 0x29, shape 0, type 0), sets the standard white-flash
  hit effect (object_setCollisionHitEffect with 0xFF), publishes it with object_presentCollisionData, and stores
  4 into oBattleObject_CurStateActionPhaseAndPhaseInitialized to mark the object as entering state/phase 4. Quirk:
  the final "mov r1, #4" means callers observe r1 = 4 and cleared N/Z on the success path; on the failure path r0-r3/flags
  are whatever object_freeMemory left. r8 is untouched by this function itself but must be live for object_presentCollisionData.'
