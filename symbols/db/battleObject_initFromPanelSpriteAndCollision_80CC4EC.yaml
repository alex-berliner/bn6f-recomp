status: probable
summary: Initialises a battle object's panel coordinates, sprite/animation, and collision block, then
  sets its state-action field to advance out of the init state.
interface: (r5 = BattleObject*) -> void ; writes object fields including oBattleObject_Z, oBattleObject_Y,
  oBattleObject_CurAnim, oBattleObject_CurStateActionPhaseAndPhaseInitialized; on collision-data allocation
  failure frees the object and skips collision work
details: '1. Calls object_setCoordinatesFromPanels so X/Y pixel coords match PanelX/PanelY.

  2. Sets Z = 0 then adds 1 (so Z = 1), and adds 1 to the Y pixel coord, raising the object one pixel
  above its panel (likely a hill/anomaly pixel offset).

  3. Loads sprite id 0x29 with priority 0x10 from archive 0x80 via sprite_load, calls sprite_noShadow,
  sets oObjectHeader_Flags |= 0x02 (OBJECT_FLAG_VISIBLE), zeroes CurAnim/CurAnimCopy, sets anim index
  to 0 via sprite_setAnimation, loads the per-object animation data, advances one sprite frame, sets palette
  0, and applies the object''s horizontal flip via object_getFlip + sprite_setFlip.

  4. Allocates a CollisionData slot with object_createCollisionData; on failure it tears the object down
  with object_freeMemory and returns.

  5. On success, calls object_setupCollisionData(r0=slot, r1=0x29, r2=r3=0), sets the collision hit-effect
  to 0xFF, then object_presentCollisionData to run the per-frame collision handler.

  6. Final step writes 4 to oBattleObject_CurStateActionPhaseAndPhaseInitialized — that''s the CUR_STATE_UPDATE
  (0x4) field encoded into the u32 at 0x8, advancing the state machine past CUR_STATE_INITIALIZE.

  Distinctive constants (sprite 0x29, archive 0x80) are the function''s fingerprint and likely identify
  the specific battle object type this init phase belongs to.

  '
