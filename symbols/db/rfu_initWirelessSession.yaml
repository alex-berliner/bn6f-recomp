name: rfu_initWirelessSession
address: '0x08148D24'
kind: function
status: probable
summary: Resets the wireless-link working buffers, registers the link callbacks, sets the recv buffer/slot
  and starts a 14-byte periodic send, returning 0 with error code 0x31 on failure.
interface: (r0 = unused) -> r0 = 1 on success, 0 on rfu_UNI_setSendData failure; writes error/state 0x31
  to word_200BC58 on failure
details: 'First it scans up to 5 halfword entries at byte_2010290+0x36 against [dword_2010CC0]+0x94, storing
  the match index (or 5 if none) in byte_2010480. It then zero-fills byte_2010390 (32 bytes) and unk_20103A0
  (128 bytes) with CpuSet fixed-source fills, calls sub_8146A70 on unk_200FFF0/unk_200FE90, and clears
  four small arrays (byte_2010220, word_2010400/0x420/0x428, 4 entries each). It copies byte_2010292 into
  byte_2010274, clears byte_20101B4 and byte_201039C, and registers sub_8148E74 and sub_8148FB4 via the
  callback-registration helpers sub_81463E8/sub_81463D0. Finally, using qid from byte_20103E0: rfu_setRecvBuffer(0,
  unk_20103A0, 0x10, 0x40), rfu_clearSlot(3, qid), sub_803ECFC, sub_803F030, then rfu_UNI_setSendData(qid,
  byte_2010390, 0xE, 0x1000000<<qid>>24); a failed send stores 0x31 in word_200BC58 (a state/error field
  of the eS200BC50 struct) and returns 0.'
