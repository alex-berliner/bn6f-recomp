summary: 'State-machine step: reads the current phase byte from a battle-state struct and calls the matching
  handler function from a table.'
interface: (r5 = state struct with phase byte at oBattleState_StatePhase) -> calls handler table entry
  for the phase; returns to caller when handler returns
details: 'Loads the phase byte from the state struct at r5, uses it as an index into a table of function
  pointers (here at off_8009E24, pointed to via off_8009E20), and calls the selected handler with mov
  lr,pc / bx r1 so the handler returns back into this thunk, which then pops pc to return to its own caller.
  The table here has two entries: RunTextScriptDustManUndernetTut_8009E2C (thumb) and sub_8009E40, so
  this instance drives a two-phase scripted sequence (tutorial text then a follow-up step). The table
  pointer is loaded indirectly, so other instances of the pattern can use different handler tables. Pure
  dispatcher: no state fields are written and no flags are meaningful.'
