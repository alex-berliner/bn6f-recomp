name: sub_80FD8B0
address: '0x080FD8B0'
kind: function
status: confirmed
summary: 'Drives a timed AI-attack sub-state: on first call arms a countdown from Unk_18 into Unk_10 and resets
  the object''s animation; on subsequent calls ticks the countdown and exits the attack state when it elapses.'
interface: void aiAttackTimedSubState_80FD8B0(battleObject* r5, ? r6, AIAttackVars* r7); // returns r1, clobbers
  r0 r2 r3 r6 r7 lr, NZCV
details: 'Operates on an AI-attack state record at r7 (fields oAIAttackVars_Unk_01, _Unk_10, _Unk_18)

  and a battle object at r5 (field oBattleObject_CurAnim).

  First entry (Unk_01 == 0): writes 4 to Unk_01 as a one-shot latch, clears the object''s

  current animation slot to 0, and copies the preset duration from Unk_18 into the live

  countdown Unk_10. Subsequent entries decrement Unk_10 and, when it underflows/zeroes,

  invoke object_exitAttackState to leave the attack state. The loop test is `bgt` after the

  subtract-one, so a negative value (s16 wrap) also trips the exit path.

  r6 is unused inside the function and is clobbered by the callee path. r1 is preserved

  across the call per the register contract; it is not written here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
