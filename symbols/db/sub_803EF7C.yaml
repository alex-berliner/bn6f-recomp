status: hypothesis
summary: Returns a single 32-bit field at offset 0x34 into the eCamera area (labeled eCamera.unk_84), apparently
  the camera's "end" value.
interface: uint32 sub_803EF7C(void)
details: 'Trivial getter: loads the pointer off_803EF8C (the eLinkState label, which sits directly before the eCamera
  struct in RAM at 0x20099d0), then reads the word at +0x34 (i.e. eCamera.unk_84) and returns it in r0. The readable
  C names this field eCameraEnd, suggesting callers compare the camera''s current position against this end value
  to detect when a camera scroll/pan has finished. Tail-returns via ''mov pc, lr''; touches no other state and clobbers
  nothing but r0.'
