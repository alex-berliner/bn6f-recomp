name: pack_setChipQuantity
address: '0x08021B78'
kind: function
status: probable
summary: Sets the stocked quantity byte for a given chip (id + code) in the pack, re-encrypting the pack
  byte first when the new value is nonzero.
interface: (r0 = chip id, r1 = code/search key, r2 = new quantity) -> r0 = address of the quantity byte
  that was written; r2 preserved
details: The function saves r0-r2 and, if the new value r2 is nonzero, calls encryption_applyPack(r0),
  which commits the decrypted mirror byte (table at byte_20008A0, XOR 0x81) into the encrypted pack buffer
  for this chip. It then restores r0-r2 and calls getOffsetToQuantityOfChipCodeMaybe(r0, r1, r2), which
  returns the address of the pack-stock quantity byte for that chip id and code letter (falling back to
  the first code slot when absent). The original r2 is finally stored as a byte into that returned address,
  so r2 acts both as a lookup argument and as the value written. The tst/beq guard means zeroing a quantity
  skips the pack re-encryption step, suggesting the deletion path keeps the pack/mirror state differently.
  The pack buffer is stored encrypted (XOR 0x81 of the mirror), so this routine pairs a mirror write with
  a pack re-encryption.
