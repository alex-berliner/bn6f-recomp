name: SetCameraXYZ
address: '0x080301DC'
kind: function
status: confirmed
summary: Writes the (x, y, z) world-space camera position into the camera object referenced by the active toolkit.
interface: void setCameraXYZ(s32 x, s32 y, s32 z, void *toolkit /* r10 */); returns the camera pointer in r3; clobbers
  r3
details: 'Loads the camera object pointer from toolkit + oToolkit_CameraPtr, then stores the three

  position components into the camera object at offsets 0x30 (x), 0x34 (y), 0x38 (z).

  These offsets correspond to an internal WorldVec/SVec-style position; the camera object

  is owned by the toolkit (a per-stage/scene manager struct). The returned r3 is the

  camera pointer, which callers typically use to chain additional camera writes (e.g.

  target, view matrix).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
