name: battleObject_initFromRelatedAndLoadSprite_80C4550
address: '0x080C4550'
kind: function
status: confirmed
summary: Brings a freshly spawned battle object into play by loading its sprite, applying its element palette, starting
  the animation of its related object (offset by Param4), and switching it into the update state.
interface: void battleObject_initFromRelatedAndLoadSprite_80C4550(r5 = battle object ptr, r10 passes through); returns
  r5, r8-r12 as left by battleObject_copyStateAndSyncSpriteFromRelated_80C458C; clobbers r0-r4, r6, r7, lr and NZCV.
details: Initialization tail for a battle object whose parameters were copied from a related object. Calls sprite_load
  with first argument 0x80 and r1/r2 taken from the object's Param1/Param2 bytes (the sprite resource id), then
  sprite_loadAnimationData and sprite_noShadow (this object casts no shadow). Calls battleObject_getDamageElementOrPalette_80C46CC
  to obtain the palette for the object's damage element and applies it with sprite_setPalette. Reads the related
  object's CurAnim byte, adds the object's Param4 byte, stores the sum into the object's CurAnimAndCurAnimCopy halfword,
  and starts that animation with sprite_setAnimation. Reloads animation frame data (sprite_loadAnimationData) and
  runs one sprite_update so the first frame renders. Finally stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and calls battleObject_copyStateAndSyncSpriteFromRelated_80C458C to copy the related object's state and sync the
  sprite; r10 is only consumed by that final helper and simply passes through.
