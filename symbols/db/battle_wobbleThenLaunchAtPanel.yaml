  reproduce: python3 tools/asmcat.py 0x080180A8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: it ldrh ChipID/Z16Save, jitters via AddRandomVarianceToTwoCoords
    with mask 3, writes r1-r3 to r5+0x34, decrements the wobble timer, then on expiry restores X16/Z16
