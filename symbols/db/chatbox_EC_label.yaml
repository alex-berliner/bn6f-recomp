name: chatbox_EC_label
address: '0x08041288'
kind: function
status: confirmed
summary: Chatbox script opcode 0xEC handler - advances the text-cursor counters in the chatbox object by a per-command
  step, then continues the script.
interface: int chatbox_scriptOpEC_advanceCursor(u8 *scriptCmd /*r4*/, Chatbox *chatbox /*r5*/); returns r0=1 (keep
  interpreting), r1=new Unk_7C, r2=new Unk_70, r4 bumped past the 3-byte command; NZCV set per the C version
details: 'Handler for chatbox script opcode 0xEC. r4 points at the current 3-byte script command (opcode, sub-opcode,
  operand) and r5 at the chatbox object. The step is taken from the operand byte at [r4+2]: if the sub-opcode byte
  at [r4+1] is 1 the operand is used raw, otherwise it is treated as an index into an 8-byte-per-entry table and
  the step is operand*8. The step is added to the 32-bit counter at chatbox+oChatbox_Unk_70 and four times the step
  (i.e. advance*4, the byte offset of the same table entry) to chatbox+oChatbox_Unk_7C, so the two fields track
  the same position in byte and entry-index units. Both updated values are also handed back in r2 (Unk_70) and r1
  (Unk_7C). The command is 3 bytes, so r4 += 3 skips to the next script command, and r0 = 1 tells the interpreter
  to keep running. Falls through a trailing .word 0x303 literal pool entry (padding, not executed).

  '
