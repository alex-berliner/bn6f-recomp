name: screenFade_80062C8
address: '0x080062C8'
kind: function
status: confirmed
summary: Returns the current screen fade state — fade mode in r0 and fade intensity level in r1 — from the eScreenFade
  controller struct.
interface: 'void screenFade_getState(out u32 mode /*r0*/, out u32 level /*r1*/); inputs: lr only'
details: 'Reads two bytes of the global screen fade controller struct eScreenFade (0x200A440): byte at +1 (0x200A441)
  is the fade mode/direction and is returned in r0; byte at +3 (0x200A443) is the current fade intensity/level and
  is returned in r1. It is a pure getter — no writes, no flags touched, no other state read, so it is safe to call
  anywhere a fade status check is needed (e.g. deciding when a fade-out has completed before a cutscene or battle
  transition).'
