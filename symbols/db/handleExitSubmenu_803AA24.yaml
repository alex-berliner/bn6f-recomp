summary: 'Handles closing/exiting a submenu: confirms the close, clears a state byte, plays the exit-submenu
  sound, and runs sub_803A84E.'
interface: 'void handleExitSubmenu_803AA24(void);

  // inputs:  r2, r5, lr

  // outputs: r5, r10

  // clobbers: NZCV, r0, r1, r2, r3, lr

  '
details: 'Calls sub_803C068(0x10, 0x30) as a gating/confirmation step; only proceeds if it returns

  non-zero (Z clear). On success, zeroes the byte at r5 + 0x13 (likely a menu state/flag byte

  inside an object pointed to by r5), plays sound effect "SOUND_EXIT_SUBMENU" via PlaySoundEffect,

  then dispatches to sub_803A84E (probably the submenu''s teardown/destructor for the contents

  it was managing). Function is short and r5/r10-preserving, consistent with being an event

  hook on an in-engine "object" (this address range, 0803Axxx, is shared with sub_803A84E and

  sub_803C068 which are all in the same menu/object subsystem).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
