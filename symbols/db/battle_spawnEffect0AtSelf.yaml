name: battle_spawnEffect0AtSelf
address: '0x080DB0D0'
kind: function
status: probable
summary: Spawns the type-0 battle effect object at this battle object's current X/Y position.
interface: (r0 = battle object (passed through to callee), r5 = battle object) -> r0 = spawned effect
  object pointer; flags clobbered
details: 'Thin wrapper around spawn_t1_0x0_EffectObject: it loads the X and Y fields from the battle object
  in r5 (oBattleObject_X/oBattleObject_Y) and passes them as r1/r2, sets r3 to 0x100000 and r4 to 0x12
  as additional spawn parameters, then calls the wrapper that spawns a type-4 battle object with effect
  type 0. r0 is not modified, so the object pointer already in r0 from the caller is forwarded. The effect
  is positioned exactly at the object''s coordinates, so it is an on-self/on-location effect spawn. Which
  visual effect type 0 corresponds to is not shown here.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r1,[r5,#oBattleObject_X] / ldr r2,[r5,#oBattleObject_Y] position the effect at the object's
    coordinates; mov r3,#0x10; lsl r3,r3,#0x10 sets param 0x100000; mov r4,#0x12 sets a second spawn parameter;
    bl spawn_t1_0x0_EffectObject — known callee spawns a type-4 battle object with effect type 0 and returns
    its pointer; three nearby callers (0x080DAF2A, 0x080DAF98, 0x080DB03E) all invoke it right around
    their own object setup, consistent with a 'play effect on self' helper
