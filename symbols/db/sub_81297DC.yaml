name: sub_81297DC
address: '0x081297DC'
kind: function
status: hypothesis
summary: Battle-state dispatcher that reads a phase/handler index from r5+3, jumps through the off_81297F4 table
  to handle the corresponding action, then posts battle message 0x12 via sub_812B25C.
interface: 'void sub_81297DC(u32 r4, u32 r5, u32 r6, u32 r7, u32 r10) -> u32 r5, u32 r8, u32 r9, u32 r10, u32 r11,
  u32 r12. Clobbers: n, z, c, v, r0, r1, r2, r3, r4, r6, r7, lr. Preserves: none.'
details: 'Pushes lr for the tail call. Loads the base of the handler table at off_81297F4 (= off_81297F4),

  indexes it by the unsigned byte at r5+3 (interpreted as a table slot 0..4), and indirect-calls

  the chosen handler (bx r0) with PC moved to lr so the handler returns to the instruction after

  the bx. The handlers in the table are sub_8129808, sub_812982C, sub_8129870,

  battleObj_setCanceledPose_81298D4 and sub_81298F8; r1 is loaded with the index byte so the

  dispatched handler can see which slot was picked. After the dispatched handler returns, the

  function then calls sub_812B25C with r0 = 0x12 (a fixed battle message id), forwarding the

  live r4/r5/r6 values the handler may have updated, and returns to its caller via pop {pc}.

  The 0x12 literal is the only hard-coded post-handler signal, suggesting slot-specific handlers

  each finish by setting up state and then this dispatcher emits a single standardized follow-up

  battle message. The ''cancelled pose'' handler in slot 3 indicates the index is some kind of

  battle-action / phase selector rather than a pure phase number.

  '
