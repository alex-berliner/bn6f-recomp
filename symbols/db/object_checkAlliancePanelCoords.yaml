name: object_checkAlliancePanelCoords
address: '0x08104F6C'
kind: function
status: probable
summary: Checks whether the panel at the fixed x/y coordinate pair assigned to this battle object's alliance
  matches required panel flags, returning 1/0.
interface: (r0 = destroyed, r1 = destroyed; object in r5) -> r0 = 1 if the panel at the alliance's table
  coords satisfies the flag mask, else 0; flags set by tst
details: Reads the object's Alliance field at [r5+#oBattleObject_Alliance], doubles it to index byte_8104F90,
  and loads a two-byte (x,y) coordinate pair for that alliance. The table holds pairs (2,2) and (5,2),
  i.e. one panel per alliance (two alliances covered by the 4-byte table). It passes x/y to object_checkPanelParameters,
  which tests the panel's flag against a required-set/forbidden-set mask; the same r0/r1 pair (the coords)
  is popped after the call, implying both mask arguments were pushed on top of them. Returns 0 immediately
  if the check fails, otherwise falls through returning object_checkPanelParameters' 1.
