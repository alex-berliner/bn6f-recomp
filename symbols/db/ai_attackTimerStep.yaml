name: ai_attackTimerStep
address: '0x080F8A48'
kind: function
status: confirmed
summary: Counts down the AI attack-step timer each tick and, once it expires, resets the attack state (clears the
  0x40 attack flag, marks the object as currently moving, resets the hit element to 0xC).
interface: void ai_attackTimerStep(u32 object /*r5*/, AiAttackVars* vars /*r7*/); returns r1 passthrough (unchanged
  on early path, caller-callee garbage from object_setFlag1 otherwise); flags clobbered
details: "Decrement-and-reload step for the AI attack sequence. r7 points to an AI attack\nvars structure: the halfword\
  \ at oAIAttackVars_StepTimer is decremented every\ncall (one tick). While the value is still positive (> 0, signed\
  \ compare via\nbgt), nothing else happens. When the timer reaches 0 (or has underflowed, since\nthe check is signed),\
  \ the attack step ends:\n  - object_clearFlag(0x40, object) clears bit 0x40 on the battle object\n    (r5 = owning\
  \ object; likely the \"attacking/in attack step\" flag),\n  - object_setFlag1(1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT,\
  \ object) sets the\n    object's currently-moving flag (likely so it can move again after attacking),\n  - the\
  \ halfword at oAIAttackVars_HitElement is reset to 0xC (default/neutral\n    hit element for the next attack).\n\
  Quirks: r1 is returned unchanged on the timer-still-positive path but holds\nwhatever object_setFlag1 left in\
  \ it on the reset path, so callers presumably\nignore r1. The decrement is not clamped, so a step that keeps running\
  \ past 0\nwould re-trigger the reset every tick until something reloads StepTimer.\n"
