    lines 2-5; object_clearFlag(0x40) drops a standing flag only on timer expiry; object_setFlag1(1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)
    marks the object as now moving/attacking; strh 0xC into oAIAttackVars_HitElement assigns a fixed element
    to the upcoming hit; uses only r7-relative fields, matching AI attack script step handlers that receive
