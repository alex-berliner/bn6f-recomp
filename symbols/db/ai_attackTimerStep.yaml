name: ai_attackTimerStep
address: '0x080F8A48'
kind: function
status: probable
summary: 'Per-frame tick of an AI attack step: counts down a frame timer and, when it expires, transitions
  the object into its moving/attacking state with a fixed hit element.'
interface: (r7 = battle object AI attack vars) -> void; flags from the timer subtraction
details: Runs each frame against r7 = the current battle object's AI attack variable block. It decrements
  oAIAttackVars_StepTimer and returns immediately if the result is still positive. When the timer reaches
  zero it clears ObjectFlags1 bit 0x40 (likely an attack-charge/telegraph flag set while waiting), sets
  the OBJECT_FLAGS_CURRENTLY_MOVING_1 bit so the object's movement/attack logic activates, and writes
  HitElement = 0xC into oAIAttackVars_HitElement for the hit that the attack will deal.
