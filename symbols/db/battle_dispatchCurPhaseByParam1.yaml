name: battle_dispatchCurPhaseByParam1
address: '0x080BD478'
kind: function
status: probable
summary: Dispatches a battle object's current phase based on CurAction, choosing one of two handler tables
  depending on Param1.
interface: '(r5 = oBattleObject, Param1==0 ? dispatch table at off_80BD4A0 : table at off_80BD4B0) ->
  tail-calls handler; clobbers r0'
details: Loads the object's Param1 byte. When Param1 is 0, it uses the CurAction byte to index the four-entry
  table at off_80BD4A0 (sub_80BD4BC, object_runCurPhase, sub_80BD742, sub_80BD7EA). Otherwise it indexes
  the three-entry table at off_80BD4B0 (battle_dispatchCurPhase, sub_80BD89C, sub_80BD7EA). Each entry
  holds a Thumb function pointer with the low bit set, and the routine switches to it via mov lr,pc /
  bx r1 with no return — a tail-call dispatcher. Registers r4-r7 are saved/popped by the caller because
  this function never returns.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: ldrb r0, [r5,#oBattleObject_Param1] then cmp r0,#0 / bne loc_80BD48C selects one of two tables;
    ldrb r0, [r5,#oBattleObject_CurAction]; ldr r1,[r1,r0] indexes both tables by CurAction; mov lr,pc
    / bx r1 tail-calls the selected handler with no return; Caller at 0x080BD45E sets CUR_STATE_UPDATE
    then invokes this dispatcher, matching the off_80BD4B0 entry battle_dispatchCurPhase (normal phase
    progression); off_80BD4A0 used when Param1==0 contains object_runCurPhase, the placeholders' initialisation-only
    path
