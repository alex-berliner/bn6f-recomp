name: ai_attackDelayedElementUpdate
address: '0x080ECAE8'
kind: function
status: probable
summary: 'Per-frame AI attack routine: on its first tick plays animation 0xA and spawns a temp attack
  object, then after a 15-frame delay switches the attack''s hit element to 4.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; sets AIAttackVars.HitElement after delay
details: 'Branches on oAIAttackVars_AttackElement: if zero (attack not yet started), it sets animation
  0xA on the object, resets the counter timer to default, stores 0xF into oAIAttackVars_StepTimer, calls
  the type-1 subtype-5 temp-attack-object spawner (r4=0x14 parameter, AI data fetched from oBattleObject_AIDataPtr+0x68),
  sets object flag bit 22 via object_setFlag1, and writes 4 into oAIAttackVars_AttackElement to mark the
  attack started. On every later tick it decrements StepTimer, and once it reaches 0 it writes 4 to oAIAttackVars_HitElement,
  i.e. the attack''s damage element (likely wood, element id 4) only becomes active after the delay.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne splits first tick vs. subsequent ticks;
    first tick: object_setAnimation(0xA), object_setDefaultCounterTime, StepTimer=0xF, then spawn_t1_0x5_tempAttackObject_80B8E30;
    mov r0,#4; strb r0,[r7,#oAIAttackVars_AttackElement] prevents re-spawning the attack object; later
    ticks decrement StepTimer and, at 0, strh r0,#4 into oAIAttackVars_HitElement — a delayed element
    activation'
  refs:
  - bn6f/asm/asm31.s:114004
  - 0x0800F2B6 object_setAnimation
  - 0x0800FDB6 object_setDefaultCounterTime
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080ECAE8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior: conditional first-time setup (animation 0xA, default
    counter time, StepTimer=0xF, spawn_t1_0x5 with r4=0x14 and r7=oAIAttackVars+0x68 from AI data ptr,
    set flag bit 22, write 4 to AttackElement), then per-frame decrement of StepTimer, and finally write
    4 to HitElement (a halfword, strh) when it reaches 0. Minor inaccuracy: HitElement is written with
    strh (halfword), not strb, but this doesn''t change the meaning. The name and summary are otherwise
    accurate; ''attackDelayedElementUpdate'' is fine but the current name is acceptable.; run wf investigate
    investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
