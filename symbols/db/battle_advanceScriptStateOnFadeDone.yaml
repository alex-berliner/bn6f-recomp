name: battle_advanceScriptStateOnFadeDone
address: '0x08027806'
kind: function
status: probable
summary: Polls IsScreenFadeActive; once the fade clears, writes 4 to the state byte at [r5+1] and clears
  the halfword at [r5+2], and if the substate byte at [r5+0xc] is 3, advances [r5+0xc] and [r5+0xd] to
  4 and re-arms the state by writing 0x2c to [r5+1] and 0 to [r5+2].
interface: (-, r5 = event/state struct) -> void; sets [r5+0x1] (state id), [r5+0x2] (counter, halfword),
  and conditionally [r5+0xc]/[r5+0xd]
details: 'Reads IsScreenFadeActive and does nothing while a fade is running. Once no fade is active it
  writes 4 to the state byte at [r5+1] and clears the halfword counter at [r5+2]. It then checks the byte
  at [r5+0xc]: if it equals 3, it advances it to 4, copies 4 into [r5+0xd], and re-arms the state machine
  by writing 0x2c (44) to [r5+1] and 0 to [r5+2]. The adjacent literal TextScriptFirstBattleTutorials
  ties this handler to the first-battle-tutorial text/event script. All state lives in the r5 struct,
  so the caller must set r5 before invoking (likely a dispatched script/event handler).'
