name: ai_attackTickEndOnTimer
address: '0x080F3EA2'
kind: function
status: probable
summary: 'AI attack-state timer: start the countdown on first entry, then reset animation and leave the
  attack state when it expires'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 clobbered; updates AttackElement, StepTimer,
  oBattleObject_CurAnim
details: On entry, if oAIAttackVars_AttackElement is 0 it writes element 4 and copies AttackDuration into
  StepTimer, initializing the attack timer. On later calls it decrements StepTimer each frame. When the
  timer reaches 0 it sets oBattleObject_CurAnim to 0 and calls object_exitAttackState to return the object
  to its idle/normal state. r7 points to the AI attack vars struct and r5 to the parent battle object.
