name: bg_scrollToProjectedPos
address: '0x080024CC'
kind: function
status: probable
summary: Projects a world position through the camera, centers the background scroll on it, and redraws
  that region's BG tiles.
interface: (r0 = world x, r1 = world y, r2 = region width in px (rounded up to even), r3 = region height
  in px (rounded up to even)) -> r0 = left clamp from CopyBackgroundTiles; writes RenderInfo BG scroll
  and Unk200f3a0 extents; clobbered r2-r7, r8-r10
details: 'Selects one of two BG structs via dword_80025C4 (r4 = 0 or 4; the second copy is the bytes at
  0x80025C8): field 0x18 = BG x scroll, 0x1A = BG y scroll, 0x02 = tile-block id. It calls sub_8003694
  to project (r0,r1) to screen space, then negates and centers the result: (240 - width)/2 and (160 -
  height)/2 are subtracted, so the region of the given size is centered on the projected point, and stores
  the result as the BG scroll offsets. It then calls CopyBackgroundTiles(j, i, tileBlock, tileIds=r9,
  j_size=r4>>3, i_size=r5>>3) to refill the BG map for that region. Finally it clamps the projected center
  against the region half-extents (width/2, height/2 rounded up) and writes four clamped extents in pixels
  (0..240 horizontally, 0..160 vertically) into Unk200f3a0+2/3 (x) and +6/7 (y), presumably the visible-tile
  window for later OAM/clipping work.'
