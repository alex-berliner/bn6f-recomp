name: battle_actionVanish
address: '0x080C7306'
kind: function
status: probable
summary: 'Battle-object action handler for action ID 7 (vanish): advances CurPhase to 4, sets up PanelX/PanelY
  via sub_80E1E20, plays sound 0xC6, runs sub_80C73BE and starts animation 1; once PhaseInitialized reaches
  5, resets CurAnim, optionally calls sub_80E1E3E cleanup, then sets CurAction=8 to mark done.'
interface: (r5 = battle object) -> void; side effects on the object's phase/anim/action fields
details: 'State-machine step for a battle object: when CurPhase is 0 it advances the phase to 4, calls
  sub_80E1E20 with the object''s PanelX/PanelY (r7 = object+0x64 set up around the call, though not passed),
  plays sound effect 0xC6, runs sub_80C73BE, and starts animation 1. The second half only runs after the
  phase has been initialized: once PhaseInitialized reaches 5 (animation complete) it resets CurAnim to
  0, calls cleanup sub_80E1E3E if ExtraVars+4 is nonzero, sets CurAction = 8 (action finished) and clears
  CurPhase/PhaseInitialized. The pattern — start anim+sound, block until the animation reports completion,
  then report done — matches the game''s one-shot object action handlers; sound 0xC6 and the panel-coordinate
  setup suggest a vanish/hide/retreat effect rather than a movement.'
