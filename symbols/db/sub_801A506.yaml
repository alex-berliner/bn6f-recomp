open_questions:
- What does SetAIData_Unk_44_Flag actually represent in the AI/battle system, and is bit 0x80000000 a per-turn,
  per-battle, or global flag?
- What are the fields at collision_data offsets 0x75 (byte) and 0x80 (halfword)? They look like a collision-shape-present
  byte plus a size/halfword, but the exact meaning in the eCollisionData struct is not confirmed.
- Why does this routine live alongside so many other constants and the eCollisionData symbol — is it a sub-step
  of a broader per-frame battle-object update, and if so which one calls it via R5?
