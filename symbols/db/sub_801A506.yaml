name: sub_801A506
address: '0x0801A506'
kind: function
status: hypothesis
summary: Conditionally sets AI data unk_44 flag 0x80000000 when the battle object's collision data has both byte
  0x75 and halfword 0x80 non-zero.
interface: 'void sub_801A506(void); /* in: r5 = battle object ptr; out: none; clobbers nzcv, r0, r1, r3, lr */'
details: Reads R5->oBattleObject_CollisionDataPtr to obtain the per-object collision data block. If the byte at
  offset 0x75 is zero, the function returns without acting. Otherwise it tests the halfword at offset 0x80; if that
  is also zero, it returns without acting. Only when both fields are non-zero does it call SetAIData_Unk_44_Flag(0x80000000),
  setting a global AI flag bit. R3 (the collision data pointer) is loaded unconditionally before any branch so callers
  will observe the same value regardless of which path is taken. The constants 0x80000000 (the flag passed) and
  the surrounding data words in the same alignment tail (0x8000, 0x8001E800, 0x300E8, 0x800, 0x10000, 0x20000, 0xFFFF,
  0x100040, 0x2000000, 0x1500, eCollisionData) appear to be nearby literals used by the surrounding routine rather
  than inputs to this function.
