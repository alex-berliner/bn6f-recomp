name: battle_objStateBriefAnimThenDestroy
address: '0x080BADE4'
kind: function
status: probable
summary: Battle-object state handler that plays anim 4 for 2 frames, spawns an effect via sub_8011044(2,0x10),
  disables the hitbox, and moves the object to the destroy state.
interface: (r0 = unused, r5 = battle object ptr preserved from caller) -> r0 = 0 after final tick; sets
  oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY
details: 'Standard two-step state action: on first entry (PhaseInitialized==0) it stamps PhaseInitialized=4,
  sets CurAnim=4 and a 2-frame Timer, and returns. On later ticks it decrements Timer; once it hits 0
  it calls sub_8011044(2,0x10) — likely queuing an effect/animation with id 2 and param 0x10 — writes
  0 to oCollisionData_Enabled via the object''s CollisionDataPtr so it can no longer be hit, and packs
  CUR_STATE_DESTROY into CurStateActionPhaseAndPhaseInitialized to end the object. The very short timer
  suggests a quick death/despawn flourish rather than a full attack animation.'
