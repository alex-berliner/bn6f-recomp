name: zeroFill_813D960
address: '0x0813D960'
kind: function
status: confirmed
summary: Wipes the 16-byte work area at eS200BC50 but saves and restores the single byte at offset 7 so it survives
  the clear.
interface: void clearWorkArea_eS200BC50_keepByte7(void); // r2, r3, r4 preserved; r0/r1 scratch; C/V flags pass
  through from ZeroFillByWord
details: 'Saves byte_200BC57 (offset 7 of the 16-byte buffer starting at eS200BC50), calls ZeroFillByWord with base
  = eS200BC50 and size = 0x10 bytes, then writes the saved byte back to offset 7. Effectively a "clear all fields
  except one" reset of a small static work area. Nothing is returned; the byte at offset 7 appears to hold persistent
  state (a flag or index) that must not be reset by this wipe. The reason for keeping that byte is not evident from
  the function alone.

  '
