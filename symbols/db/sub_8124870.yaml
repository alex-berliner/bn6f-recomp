name: sub_8124870
address: '0x08124870'
kind: function
status: hypothesis
summary: Picks one of two BCD-digit tile tables for the scoreboard based on the current vs. half value, then rebuilds
  the scoreboard's BCD tilemap.
interface: 'void scoreboard_drawCurrent_8124870(struct ScoreState* r5 /* scoreboard state, fields: +0x18 width,
  +0x1A value */);

  '
details: 'Reads the scoreboard state object passed in R5: +0x18 is the current score width (digits), +0x1A is the
  current BCD score value. Compares (value >> 2) against width; if the quartered value is at or above the width,
  selects the "high" digit tile table at 0x3081E0, otherwise the default at 0x3071E0. Hardcodes R4=2 (column?) and
  R6=3 (row?) as extra args, plus R0=unk_201C4B0 (tilemap buffer), then tail-calls scoreboard_buildScoreBcdTilemap_8120900
  which actually lays the BCD digit tiles into the BG map. Function essentially chooses which of two prebuilt BCD→tile-index
  lookup tables to feed the tilemap builder depending on how full the score is. R5 (state pointer) is the only meaningful
  in/out.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
