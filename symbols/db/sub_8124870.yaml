open_questions:
- Whether 0x3071E0/0x3081E0 are tilemap sources or VRAM bg-tile buffers; the helper expects a tilemap-line source
  plus a tilemap dest (unk_201C4B0), but the exact meaning of "selected/remaining" tilemaps wasn't verified against
  a sub-chip UI asset dump.
- Whether the value at r5+0x1a is a pack/stack count or a cursor index — only the arithmetic (`>> 2` vs an 8-bit-ish
  count) hints at stack-count scaling.
