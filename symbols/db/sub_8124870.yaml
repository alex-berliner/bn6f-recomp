name: sub_8124870
address: '0x08124870'
kind: function
previous_names: []
status: hypothesis
summary: Re-renders the Sub-chip "amount" mini-tilemap row on the sub-chip submenu using current cursor/stack counts.
interface: (no args; reads r5 SubMenu and r10 Toolkit) -> r0 = 2 (work restored to r5) ; blits a tilemap row via
  CopyBackgroundTiles
details: 'Reads the active-chip count from r5->0x18 and the current cursor/stack count from r5->0x1a

  (`ldrh r1, [r5,#0x18]` / `ldrh r2, [r5,#0x1a]`), right-shifts the cursor count by 2

  (`lsr r3, r2, #2`), and selects one of two tilemap source buffers at 0x3071E0 or

  0x3081E0 (depending on whether the quartered stack exceeds the chip count). It then

  dispatches to scoreboard_buildScoreBcdTilemap_8120900 with r3 = chosen source,

  r0 = unk_201C4B0 (background tilemap buffer), r4 = 2 (priority terminator flag

  baked into that helper), r6 = 3 (planes / copy flag), and r5/r10 inherited from

  the caller. The contract marks only r5 as an explicit out register, and callers

  set r5 to 2 on exit (captured r0=2). Because the callee actually draws two

  4-digit BCD scores separated by a dash, this is being repurposed here as the

  Sub-chip "amount" row (e.g. "<chip-count>-<remaining-stack>" with leading zeros

  blanked), reusing the same BCD-tilemap builder rather than the generic score

  display; the precise labels aren''t recoverable from this assembly alone.

  '
