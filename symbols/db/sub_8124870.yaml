    \ callers (`submenu_subchip_81242D8`, `submenu_subchip_init_8123F7C`) are submenu\n  sub-chip handlers that\
    \ operate on the same r5 SubMenu, structurally consistent with\n  \"re-render sub-chip count row\"."
