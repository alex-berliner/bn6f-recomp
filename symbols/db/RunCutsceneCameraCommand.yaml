name: RunCutsceneCameraCommand
address: '0x08036FBC'
kind: function
status: confirmed
summary: Dispatches the current overworld/cutscene camera command by reading the next opcode from the camera script
  and tail-calling its handler.
interface: void runCutsceneCameraCommand_8036FBC(void); /* clobbers r0,r1,r2,r3,r8,r9,r12,lr; preserves r4-r7; NZ
  reflect handler's r0, CV unchanged */
details: 'Reads the camera-script pointer from global eCutsceneCameraInfo (offset

  oCutsceneCameraInfo_CutsceneCameraScriptPtr), peeks one command byte at that

  pointer, and dispatches through CutsceneCameraCommandJumptable (19 entries at

  0x00..0x50, every 4 bytes) using a `mov lr,pc; bx r0` tail call. r1 = script

  pointer, r2 = command byte, r5 = camera-info base are passed to the handler.

  After the handler returns, the (possibly advanced) script pointer in r1 is

  stored back into eCutsceneCameraInfo, r4-r7 are restored (the push/pop pair

  exists only to shield the caller''s r4-r7 from handler clobbers), and the

  handler''s r0 is reflected in NZ. The dispatch end (`CutsceneCameraCmd_end`)

  sets r0 = 0 so the caller can detect end-of-script via tst r0,r0.

  Handlers cover camera positioning, scrolling (incl. player, soul-weapons

  cursor, custom 0x24, OW-player-relative), shake init, text script run/wait,

  chatbox wait, generic sub_8001B1C/8001B6C, screen fade set/wait, event

  flag set/clear, sound, music play, and writing camera field 0x03:14.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
