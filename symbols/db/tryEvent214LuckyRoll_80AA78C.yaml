name: tryEvent214LuckyRoll_80AA78C
address: '0x080AA78C'
kind: function
status: confirmed
summary: Returns 1 when "EVENT:214" is set and a [0,255] roll is <= 0xC0 (~75% chance), else 0.
interface: u32 sub_80AA78C(void); /* clobbers nz c v r1 r3 lr; preserves r4 r7 */
details: 'Reads the event-flag bit for "EVENT:214" (selector 2, bit 20); when unset, returns 0

  unconditionally. When set, pulls a byte from GetPositiveSignedRNG() and returns 1 only

  if the rolled value is <= 0xC0 (signed comparison, so values 0xC1..0xFF fail the check).

  The "inputs: r10" in the contract is unused inside the function body; "outputs: r2 r7" is

  an artifact of the caller-lifter analysis. Sets NZ to the returned 0/1 in R0. Decides

  whether the EVENT:214 encounter (procurement / lucky encounter trigger) succeeds as a

  "lucky" outcome.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
