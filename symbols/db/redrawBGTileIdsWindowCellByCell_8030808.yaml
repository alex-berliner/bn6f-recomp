name: redrawBGTileIdsWindowCellByCell_8030808
address: '0x08030808'
kind: function
status: confirmed
summary: Move the 32x32 BG tile-id window to the camera's tile and redraw every cell through the map's tile-id callbacks.
interface: 'static WindowCell redraw_window(u32 camera, u32 tiles) -> the loop''s final carried state (tiles, cell
  x, cell y); adapter: in r5 = eMapTilesState200be70, r10 = toolkit (the adapter reads the camera pointer from it);
  out r0 = r1 = 32, r3 = window x, r4 = window y + 32, Z set (cmp 32, 32); r2/r5/r6/r7 and lr keep the last callback''s
  leftovers, r10-r12 untouched'
details: Writes the window origin (eMapTilesState200be70 +4/+6) from the camera's pixel position >> 3, then walks
  32 rows x 32 cols. Each cell's map position is cell - 15 / -10 + half the map size (the same offsets as bg_scroll.c's
  edges); the ids come from getMapCellTileIds_80305E4 and go to the map's put-tile-ids callback (+0x18) for window
  entry (cell & 31). The loop's state rides in r5/r8/r9 across the calls and is read back after each one, so callee
  leftovers (r2, r5, r6, r7, lr at the end) are reproduced exactly.
