name: battleObject_applyAIDataToAttackTable_8123C20
address: '0x08123C20'
kind: function
previous_names:
- sub_8123C20
status: probable
summary: Applies a single AI attack/variant entry to a battle object, optionally spawning attack effect
  records and dispatching to row-alignment or panel-range AI routines.
interface: (r0 = byte_table_ptr (tbl of u8 lookup bytes), r1 = spawn_bitmask, r2 = spawn_table_ptr, r3
  = bit_idx, r4 = u16 store_offset, r5 = battle_object_ptr, r10 = toolkit_ptr, lr = ret) -> void ; clobbers
  r0/r1/r2/r3/r6/r7/lr; mutates battle object + toolkit/BG/scene state
details: "1. Pushes lr and allocates 0x18 bytes on the stack to save r0..r4/r6 across the call (the body\
  \ reuses r5 as the live battle-object pointer).\n  2. Computes an index into the caller's byte table:\
  \ takes `[r5+0x0c]` (battle_object->Param3? it lies in the ObjectHeader+0xc area; here it acts as a\
  \ per-object lookup slot) and reads the byte at `[r0 + that_index]` (ldrb at 0x08123c30); this selects\
  \ the AI navi index used downstream.\n  3. Calls GetCurPETNaviStatsByte(navi_index, [r5+0x14]) (bl at\
  \ 0x08123c3c) — the second argument is the field offset into NaviStats. Return value 0xFF means \"no\
  \ data for this navi\" and we fall through to the early-out path (label loc_8123C92) after possibly\
  \ setting the spawn-bit in the battle object.\n  4. Otherwise stores the returned u16 (strh r0, [r5,\
  \ [sp+0x10]]; offset was saved on stack from r4, so r4 = u16 offset into the battle object) and continues.\n\
  \  5. Tests `r1 & [r5+0x4c]` (battle_object->RelatedObject1Ptr); if zero, calls battle_spawnEStructRecordsFromTable_80465A0(r2)\
  \ and then ORs the spawn bitmask into the same `[r5+0x4c]` slot (used as a per-object \"have we spawned\
  \ variant N?\" flag). If the bit was already set, the spawn path is skipped.\n  6. Hard-codes a fixed\
  \ geometry constant block: `r0 = 0x24 + battle_object->Param3 * 0x0a` (the panel/panel-range base; uses\
  \ Param3 from the object header at offset 0xc), `r1 = 0x9d`, `r2 = 0x48`, `r6 = bit_idx` (r3 from the\
  \ wrapper), `mov r4, #4`.\n  7. Branch on `[sp+0x14]` (saved r6 = wrapper's bit_idx): if the high bit\
  \ / specific pattern equals 1, calls battle_alignRowCheck_81348DC(r0,r1,r2,r3=0,c=0x9d,...); otherwise\
  \ calls battle_aiCheckPanelRangeAndDoAttack_8134930 with the same packed args.\n  8. Epilogue: `add\
  \ sp, sp, #0x18; pop {pc}`. The function is `void`-shaped: nothing is returned in r0/r1 and the wrapper\
  \ tail-calls return nothing either.\n  9. The three wrappers (sub_8123BC0/3BE0/3C00) provide three pre-baked\
  \ spawn bitmasks (0x1, 0x20, 0x40) and table pointers (0x081233d8/0x081233e0/0x081233e8) keyed by 2-bit\
  \ \"attack slot\" indices, suggesting this function is the per-attack-slot initializer that runs once\
  \ when a battle object is created and once each time an AI attack slot rolls over.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` + `sub sp, sp, #0x18` then `str r0..r4 / [sp]` (loc_8123c24..8123c2e) confirms
    a stack frame used purely to preserve caller-provided r0..r4 across the body — r5 stays live as the
    battle-object pointer (AIData at +0x58 in BattleObject). - `ldrb r0, [r5,#0xc]; ldr r1, [sp]; ldrb
    r1, [r1,r0]` (0x08123c30..34) is a classic "index a small u8 table with a per-object selector" idiom;
    the captured r0 entries 0x08123bdc, 0x08123bfc, 0x08123c1c are exactly the byte tables the three wrappers
    use. - `bl GetCurPETNaviStatsByte` at 0x08123c3c takes (r0 = navi_table_byte, r1 = offset 0x14 from
    r5) — 0x14 in AIData is Version_17/pet context, suggesting a per-version/per-PET field read. - `cmp
    r0, #0xff; bne loc_8123C52` is the standard "no data for this navi" sentinel check (0xFF is the typical
    "slot empty" value used elsewhere by GetCurPETNaviStatsByte). - `strh r0, [r5, r1]` at loc_8123C52
    with r1 = saved r4 = caller-provided u16 offset; this writes the fetched byte into a field of the
    AIData / battle object (matches captured-call offsets 0x40, 0x20 — they sit inside AIData.AttackVars
    / AIData joypad area). - `tst r0, r1` / `beq/bne loc_8123C6C` block is a one-shot spawn guard keyed
    on `[r5+0x4c]` — `[r5+0x4c]` is `RelatedObject1Ptr` per the BattleObject struct, but here it is read/written
    as a u32 bitmask (the OR into it at loc_8123C6C confirms bitwise use). Function sub_8123BE0''s contract
    comment also notes "3-byte constant 0x5A,0x58,0x56" passed in r0 — three bytes packed in one register
    — exactly what the captured entry `r0=08123bfc r1=00000020` shows the 3-byte table is sitting at 0x08123bfc.
    - `mov r0, #0x24 ; ldrb r1, [r5,#0xc]; mov r2, #0xa; mul r1, r2; add r0, r0, r1` (0x08123c6c..78)
    is the geometry base computation; this constant 0x24 + index*0x0a is the same shape used by panel-range
    lookup tables in sub_8134930. - The `cmp r6, #1; beq loc_8123C8C` (0x08123c84) is the dispatcher that
    picks between battle_alignRowCheck_81348DC (called for "=1") and battle_aiCheckPanelRangeAndDoAttack_8134930
    (called otherwise) — captured calls show r6 (saved from caller) varies, and r3 (the bit_idx passed
    in) is passed to both callees as a parameter. - Caller summaries: sub_8123BC0 "thin wrapper with fixed
    constants", sub_8123BE0 "three-byte constant 0x5A,0x58,0x56", sub_8123C00 "three-entry color table
    0x5B5957, work buffer byte_81233E8, constants 0x40/6/0x60/1" — all three are configuring (navi-color
    table, work buffer, spawn bitmask) for the same per-slot init.'
