open_questions:
- The exact semantics of `[r5+0x14]` (which NaviStats field offset is read) and `[r5+0xc]` (whether it
  is ObjectHeader.Param3 or BattleObject.Params.Param3) — confirming this would resolve what the per-slot
  lookup is actually selecting.
- Why the dispatch picks `battle_alignRowCheck_81348DC` only when `r6 == 1` (and what the higher values
  mean for `battle_aiCheckPanelRangeAndDoAttack_8134930`) — would be settled by tracing the wrapper that
  picks `r6 != 1` back to its caller.
