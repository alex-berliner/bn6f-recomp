name: SetPlayerCanMoveEventFlag
address: '0x0809E098'
kind: function
status: confirmed
summary: Sets the "player can move" event flag so the on-map player character is free to walk again after a scripted
  event takes control away.
interface: 'void SetPlayerCanMoveEventFlag(void); // in: none (lr only); out: none; clobbers r0, r1, r3, lr, NZCV'
details: 'Trivial wrapper that calls SetEventFlagFromImmediate with the flag id in r0 (EVENT_PLAYER_CAN_MOVE, id
  0x17) and the value to store in r1 (0x14). The event flag lives in the event-flags array at 0x2001c88, offset
  0x2e2 (address 0x2001f6a, flag slot 3 per the disassembly comment). Typical use is at the end of cutscenes/dialogue
  sequences that have locked the player''s movement, restoring control of the on-map player character. No return
  value; callers get nothing back.

  '
