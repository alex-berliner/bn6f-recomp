name: battle_getSelectedChipForUse_800ED90
address: '0x0800ED90'
kind: function
status: confirmed
summary: Fetches the chip a battle object has selected for use, either from its side's card hand (for hand-driven
  actors) or from the object's own chip field.
interface: int battle_getSelectedChipForUse_800ED90(BattleObject* obj) -> r0 = chip ID, r1 = chip sub-value, r2
  = combined power value, r3 = ChipsHeld; V set by last flag-setting op
details: 'Takes the battle object in r0. Calls unpackVerActorTyAndAIIdx_800F29C on the object''s NameID to get its
  kind; if kind != 2 the selection is simply the object''s own oBattleObject_Chip (halfword) with r1 = r2 = 0. If
  kind == 2 (hand-driven side), reads the object''s Alliance byte and calls getBattleHandAddr_8010018 to get that
  side''s battle-hand struct; the first byte of the hand is the currently selected card slot, each slot being 2
  bytes, entry area starting after a 2-byte header (entry = hand + 2*slot + 2). From the selected entry it returns:
  r0 = entry chip ID (+0x00), r1 = entry +0x0C value, and r2 = entry +0x18 value + sub_800EF34(chipID) + entry +0x24
  value (sub_800EF34 called with r1 = 0 appears to compute some chip-derived value added into the power). r3 always
  gets the object''s oBattleObject_ChipsHeld byte. r5/r7 are pushed and restored; the V flag ends up reflecting
  the last arithmetic/comparison on each path.

  '
