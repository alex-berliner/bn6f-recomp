name: sub_80EC5BC
address: '0x080EC5BC'
kind: function
previous_names: []
status: hypothesis
summary: 'Battle dispatcher that routes based on the AI attack vars index byte: if AIData.Unk_44 matches a known
  pattern (0x8600), a reset/process action runs; otherwise an alternate handler runs.'
interface: (r7 = AIData/AIState/AIAttackVars-like struct ptr; r0..r12 = preserved caller state) -> r0 = Tst result
  state, NZ/C/V flags ; side effects may call into battle action or AI attack vars processors
details: "1. Pushes lr, then reads off_80EC5DC into r1 (a pointer to an inner table off_80EC5E0).\n  2. Reads an\
  \ u8 from [r7 + oAIAttackVars_Unk_00] into r0, then loads r1 = [r1 + r0*4] (a function pointer), moves lr to pc\
  \ and branches with bx, so this is a tail call via table lookup indexed by AIAttackVars byte 0.\n  3. The follow-up\
  \ `bl GetAIData_Unk_44_Flag` is then evaluated. Note the order in the asm is the index-jump first; the `bl GetAIData_Unk_44_Flag`\
  \ that appears in the callee listing is the inline `bl` to that helper, whose result is masked with 0x8600.\n\
  \  4. `tst r0, #0x8600` checks the AI flag mask; if zero, falls through to `locret_80EC5DA` and returns. Otherwise\
  \ sets r1 = r2 = 0 and calls `sub_801056A`.\n  5. Function returns via `pop {pc}` (Thumb tail/return idiom).\n\
  \  6. The inner jump table at off_80EC5E0 has entries: sub_80EC5EC+1 and battle_aiAttackVarsTryResetAndProcessAction_80EC67E+1\
  \ (both +1 to switch to Thumb).\n  7. The dispatch index read is `oAIAttackVars_Unk_00`, an AIAttackVars offset;\
  \ AIAttackVars lives at AIData+0xa0 (per AIData struct).\n  8. Output registers are entirely caller-saved (`r0..r12,\
  \ lr`) and `nz/c/v` flags are clobbered, consistent with a void-like dispatcher.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` followed by `pop {pc}` at locret_80EC5DA implements standard Thumb leaf return. - `ldrb
    r0, [r7,#oAIAttackVars_Unk_00]` then `ldr r1, [r1,r0]` performs a 4-byte-stride function pointer table lookup
    using r0 as the index into off_80EC5E0. - `mov lr, pc` + `bx r1` performs a tail-call (not a normal `bl`); control
    transfers into the indexed handler. - `bl GetAIData_Unk_44_Flag` reads a boolean-style flag from AIData offset
    0x44 and returns it in r0; `ldr r1, dword_80EC5E8 // =0x8600` + `tst r0, r1` masks the result. - `beq locret_80EC5DA`
    short-circuits when the masked flag is zero, returning immediately. - When non-zero, `mov r1, #0; mov r2, #0;
    bl sub_801056A` invokes a reset/process-action helper with cleared args. - The off_80EC5E0 table contains exactly
    two entries (sub_80EC5EC+1 and battle_aiAttackVarsTryResetAndProcessAction_80EC67E+1), confirming an `if/else`
    between two AI attack handlers indexed by AIAttackVars.Unk_00.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080EC5BC

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^080ec5bc '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- Whether the index byte selects between just these two handlers or could index past them (table ends after 2 words,
  so 0/1 are the valid indices; 2+ would read trailing zeros).
- The semantic meaning of `0x8600` as a bitmask on AIData.Unk_44 is not described in any struct comment.
- Which handler covers the "true"/reset branch (sub_80EC5EC) vs the "false" branch (battle_aiAttackVarsTryResetAndProcessAction_80EC67E)
  needs cross-referencing the two callees; I have not disassembled them here.
