name: sub_8123C00
address: '0x08123C00'
kind: function
status: hypothesis
summary: Thin wrapper that loads a fixed argument set (three-entry color table 0x5B5957, work buffer byte_81233E8,
  constants 0x40/6/0x60/1) and tail-calls sub_8123C20.
interface: void sub_8123C20_wrapper(void) — no meaningful inputs of its own; forwards caller's r5 (and whatever
  sub_8123C20 reads) through; returns whatever sub_8123C20 leaves in r0-r3 and flags; preserves r4-r7.
details: "Pushes r4-r7+lr, then sets up a call to sub_8123C20 with:\n  r0 = &dword_8123C1C (three consecutive BGR555\
  \ halfwords 0x0057, 0x0059, 0x005B — three near-identical dark-blue/grey shades, likely a small palette or gradient\
  \ ramp),\n  r1 = 0x40 (64),\n  r2 = &byte_81233E8 (a work/destination buffer),\n  r3 = 6,\n  r4 = 0x60 (96),\n\
  \  r6 = 1.\nr5 and r7 are not written, so this function's callers' values in those registers are passed straight\
  \ through to sub_8123C20 — it is effectively a curried/parameterized variant of the callee. It then pops r4-r7/pc,\
  \ so r4-r7 are restored to entry values on return (matching the register contract showing them both as inputs\
  \ and preserved). The whole thing is a fixed-argument trampoline; the actual behavior lives in sub_8123C20, which\
  \ was not examined here, so the game-level purpose (what the 3-color table + 64/6/96 constants mean) is unknown.\n"
