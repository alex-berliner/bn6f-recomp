name: ai_loadColonelAttackParams
address: '0x0810176E'
kind: function
status: probable
summary: Loads a Colonel AI attack's packed parameter pair (two halfwords from versioned AI tables) into
  the attack-vars damage slot.
interface: (r0 = attack id/index) -> r0 = packed params stored at oAIDataPtr+0xA0 (oAIAttackVars_Damage);
  no meaningful return in r0
details: Given an attack index in r0, it multiplies by 8 and reads a halfword from the AI-version-dependent
  table at byte_81017D8 via battle_aiGetVersionedTableEntry_800FE12, then reads a second halfword from
  byte_8101814 with the same index. It packs the first value into the low halfword and the second (shifted
  left 16) into the high halfword of one word, then stores that word at aiDataPtr+0xA0, i.e. oAIAttackVars_Damage
  of Colonel's per-attack vars. The x8 row stride suggests each table row holds 4 halfword entries of
  which only two are consumed. Both tables are versioned, so values differ by battle AI difficulty/version.
  Called only from Colonel attack-init routines and two small wrappers, all immediately after resetting
  the oAIAttackVars block.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mul r0,#8 + bl battle_aiGetVersionedTableEntry_800FE12 twice with off_81017C4 and off_8101800
    tables (sub_810176E); lsl r0,#0x10 ; orr r6,r0 packs second table entry into upper halfword; str r6,[r3,#oAIAttackVars_Damage]
