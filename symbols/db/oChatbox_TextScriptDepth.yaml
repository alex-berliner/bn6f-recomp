name: oChatbox_TextScriptDepth
address: '0x5'
kind: struct-field
status: probable
summary: Nesting depth (1-based) of the currently-running text-display script levels in the chatbox.
details: ">\n  The field is incremented (+1) at the start of every text-advance opcode handler\n  (chatbox_8041FB4,\
  \ chatbox_loadNaviTextLine_80420BC, chatbox_pushTextLevel_8042128,\n  chatbox_80421D8, chatbox_804222C,\
  \ dead_804303C, chatbox_80430A0, etc.) and\n  decremented (−1) by every corresponding \"sub r0,#1 /\
  \ ldr r1,=0x140 / mul r0,#4 /\n  add r1,r1,r0 / ldr r4,[r5,r1]\" epilogue, which computes a slot in\
  \ a\n  depth-indexed pointer table at chatbox+0x140. The chatbox_E6_end handler\n  treats 0 as \"nothing\
  \ to pop\" and otherwise subtracts 1 to index that same\n  0x140 table, confirming the value is a 1-based\
  \ depth/count of pushed text\n  levels."
