name: flagSetBits_eStruct2035280_801BEB8
address: '0x0801BEB8'
kind: function
status: confirmed
summary: Sets caller-supplied bit(s) in the flag word at eStruct2035280+0x44 (ORs r0 into it) and returns the updated
  word in r2.
interface: 'void sub_801BEB8(u32 bits /* r0 */); out: r1 = eStruct2035280, r2 = updated word, NZ flags set from
  result'
details: 'Tiny helper that ORs the bitmask in r0 into the u32 flag/event field at

  eStruct2035280+0x44 (dword_20352C4) and stores it back. This struct is a

  global game-state/flag workspace; +0x44 appears to be one of its flag words.

  Side effects useful to callers: r1 is left holding the struct base

  (eStruct2035280), r2 holds the new value, and the NZ flags reflect it, so

  callers can test the result without reloading. No other registers or memory

  are touched.

  '
