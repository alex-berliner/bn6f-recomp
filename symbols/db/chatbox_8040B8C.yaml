name: chatbox_8040B8C
address: '0x08040B8C'
kind: function
status: confirmed
summary: Steps the mugshot color-filter fade and renders the chatbox mugshot sprite each tick.
interface: "void chatbox_updateMugshot_8040B8C(void)\n  // inputs:  r5 = chatbox state struct pointer\n  // outputs:\
  \ r2/r3/r5/r8/r9/r10/r11/r12 clobbered\n  // clobbers: r0/r1/r7/lr, N/Z/C/V\n  // preserved: r4/r5/r6\n"
details: 'Per-frame mugshot update, gated by chatbox flag "0x02" (FLAGS_3E_MUGSHOT_ACTIVE). If the mugshot

  flag is unset the routine is a no-op. Otherwise it checks flag "0x100"; when unset it bails out

  unless the chatbox open-state byte at oChatbox_OpenState_10 is already 3 (fully opened),

  meaning the fade is only driven once the text box is at its widest.


  The 32-bit color-filter value at oChatbox_MugshotColorFilter_40 is then stepped once per

  call: flag "0x04" subtracts 0x421 (clamps to 0 and clears the flag), flag "0x08" adds 0x842

  (clears flags "0x08|0x02" once the low 5 bits reach the open threshold). The unadjusted value

  is preserved in r6 so it can be written into the sprite header''s filter slot after the

  helpers below run, while the adjusted value is stored back to the struct. r5 holds the

  chatbox state struct and is also used as the basis for the sprite header pointer at

  chatbox + 0x1F8.


  Rendering: the palette index byte at oChatbox_MugshotPaletteIdx is written into the sprite

  header at offset +4. If the current animation frame byte (chatbox+0x1F2) differs from the

  previously-rendered byte (chatbox+0x1F3), the previous byte is updated, the chatbox''s

  animation-id byte (chatbox+0x1F0) is copied into the sprite header''s anim-id slot, and

  sprite_loadAnimationData_spritePtrProvidedDirectly is called. Then

  sprite_chatbox_80026D6, sprite_loadPalette_8002818, sprite_loadAnimFrameTiles_8002874,

  and sub_8002694 are invoked with r5 = sprite header; sub_8002694 is called with r0=0, r1=3.

  The original (pre-step) filter value is stored as a halfword into the sprite header at

  +6 just before the palette/animation load calls.

  '
