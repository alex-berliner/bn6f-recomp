open_questions:
- What the 0x04 / 0x08 / 0x100 mugshot flags and the two filter deltas (0x421 / 0x842) mean in color-blend terms
  (probably a channel-by-channel fade-in vs. fade-out of the mugshot tint, since +0x842 saturating at >=6 in the
  low 5 bits matches an alpha-style terminator).
- Why flag 0x08's clear path also clears the master "mugshot active" flag - looks like a "fade-in completed" auto-hide.
- Exact fields behind sprite_chatbox_80026D6, sprite_loadPalette_8002818, sprite_loadAnimFrameTiles_8002874 and
  sub_8002694 (the four callees that consume the sprite header built here).
- Why this routine is also called when oChatbox_OpenState_10 != 3 provided flag 0x100 is set - the 0x100 bit looks
  like a "skip open-state gate" override used mid-celebration.
