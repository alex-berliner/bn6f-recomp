name: ow_playerForcedWalkStep
address: '0x0809D964'
kind: function
status: probable
summary: 'Per-frame step of a scripted forced player walk: moves the overworld player by a velocity, plays
  a footstep sound every 6 frames, and ends the action when the target coordinate is reached.'
interface: (r5 = oOWPlayerObject) -> r0 = undefined; updates player X/Y, byte 0x5C counter, byte ActionSubState
details: Decrements the byte at oOWPlayerObject+0x5C; when it wraps below 0 it is reloaded with 6 and
  sound effect 0x98 (a footstep/step noise) is played. Then it advances the player along both axes by
  the deltas at Unk_38/Unk_3c added to X/Y. It compares the halfword at 0x64 against the one at 0x66 (current
  vs. target tile/position counter); when they match it stores 8 into ActionSubState, signalling the move
  is finished. Byte 0x5C thus paces the step sound to every 6 frames while the position update runs every
  frame.
