- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: ldrb r0,[r5,#0x5C]; sub r0,#1; strb; bne -> periodic timer reloaded to 6; asm: mov r0,#0x98;
    bl PlaySoundEffect only when the timer expires -> looping step sound; asm: ldr r0,[r5,#oOWPlayerObject_Unk_38];
    add to oOWPlayerObject_X (and 0x3c to Y) -> per-frame movement deltas; asm: ldrh 0x64 vs ldrh 0x66;
    equal -> strb #8 to oOWPlayerObject_ActionSubState -> arrival condition switches action substate'
