name: reqBBS_813F868
address: '0x0813F868'
kind: function
status: hypothesis
summary: 'BBS chip-trading message request: advance page counter, run a chatbox/screen-fade transition if open,
  then hand off to the BBS driver.'
interface: void reqBBS_813F868(u32 r5_hostState, u32 toolkit_ptr /* r10 */) -> void; flags z/c/v clobbered
details: 'Uses r10 (preserved through) as the toolkit pointer and r5 as a host-side state block.

  Pointer at oToolkit_Unk2009740_Ptr holds the chip-page counter; if value at +6 < 0x40

  it is +=8 and the page index (>>4) is written to +4. The music-state pointer

  (oToolkit_Unk200f3a0_Ptr) has 0x1B written to its +9 byte after the bump.

  Tests chatbox_mask_eFlags2009F38(8): if it is set (Z clear), the transition block

  runs - chatbox_8040818 (chatbox start/setup), r5[0]=0x24, unk200f3a0+9=0x1F,

  r5[8]=5, then SetScreenFade(0x10, 8).

  Always tails into reqBBS_813F8F0(r5) and returns 0.

  The "BBS" prefix suggests this is part of the chip-trade / BBS top-level message

  driver; "req" hints it is dispatched from a message-request state machine.

  '
