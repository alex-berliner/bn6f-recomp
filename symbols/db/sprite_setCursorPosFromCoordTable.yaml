name: sprite_setCursorPosFromCoordTable
address: '0x0811DE74'
kind: function
status: probable
summary: Sets a sprite's position to a fixed base (176,64) plus an (x,y) pair looked up from a static
  table by index — a cursor/highlight position for a vertical list.
interface: (r0 = entry index into table at 0x811DE94) -> r0 = result of sprite_setCoordinates; sets sprite
  x = 0xB0 + table[index*2], y = 0x40 + table[index*2+1]
details: Loads two signed halfwords from byte_811DE94 at r0*4 and r0*4+2 (a table of ~19 (x,y) halfword
  pairs), adds the constants 0xB0 and 0x40 to them, and calls sprite_setCoordinates to write them into
  the target object's sprite coordinates. All table x entries are 0 while y varies (0, 4, 6, 8, 0xC, 0x10),
  consistent with vertical list rows of differing heights (small-font text lines); base (176,64) is a
  screen-space anchor. The sign-extension (ldrsh) allows negative offsets, though none appear in this
  table. The exact UI (which menu owns the cursor and sprite) is not visible from this function alone.
