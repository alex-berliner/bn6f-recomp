name: zeroFill_0xA000Words_811FF6C
address: '0x0811FF6C'
kind: function
status: confirmed
summary: Wrapper that zero-fills a 160 KB (0xA000-word) block of memory starting at the address given in r0.
interface: void sub_811FF6C(void *dest /*r0*/); /* preserves r0, r2, r3; r1/r2/r3 left as ZeroFillByEightWords leaves
  them */
details: 'Loads the literal word count 0xA000 from its literal pool (byte_811FF78) into r1 and tail-calls ZeroFillByEightWords(r0=start
  address, r1=0xA000), i.e. it clears 0xA000 words = 0x28000 bytes (160 KB) starting at the pointer in r0. The function
  itself is just "ldr r1, =0xA000; b ZeroFillByEightWords" with lr pushed/popped purely for the tail-jump. r0, r2
  and r3 pass through untouched, so callers can rely on their pointers/scratch surviving the call; flags are clobbered
  by the callee. The 160 KB size strongly suggests a bulk clear of most of EWRAM (0x02000000.. is 256 KB) or a similarly
  large data region, but the target address is entirely caller-supplied, so the exact region cleared depends on
  the call sites.

  '
