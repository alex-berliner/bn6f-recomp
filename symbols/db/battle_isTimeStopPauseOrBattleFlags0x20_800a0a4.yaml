name: battle_isTimeStopPauseOrBattleFlags0x20_800a0a4
address: '0x0800A0A4'
kind: function
status: confirmed
summary: Battle-engine predicate returning 1 when a time-stop is active, the battle is not paused, or the battle
  flags have bit 0x20 set.
interface: 'bool battle_isTimeStopOrNotPausedOrFlags0x20_800a0a4(void); // out: r0 = 0/1, r1 = scratch left by callees
  (0x20 on the flags path); flags nz clobbered; r10 passed in by callers but unused here'
details: "Leaf-style wrapper of three battle-state queries, used all over the battle engine as a\ngate (presumably\
  \ to decide when battle time/updates are standing still). Logic:\n  1. Calls battle_isTimeStop(); if it returns\
  \ nonzero, return 1 immediately.\n  2. Calls battle_isPaused(); if it returns ZERO, return 1 (note: this path\
  \ fires when\n     the game is NOT reported paused, the opposite of what the current name implies).\n  3. Calls\
  \ battle_getFlags(); tests the result against 0x20 and returns\n     (flags & 0x20) != 0, so 0 only when none\
  \ of the three conditions hold.\nQuirks: r1 is not explicitly set on the first two early exits — it holds whatever\n\
  battle_isTimeStop/battle_isPaused left there — and is 0x20 on the battle_getFlags\npath; callers reportedly depend\
  \ on this, so r1 must be treated as a defined output.\nUses tail `pop {pc}` returns and branches into a shared\
  \ `mov r0,#1` exit at 0x800A0C2.\n"
