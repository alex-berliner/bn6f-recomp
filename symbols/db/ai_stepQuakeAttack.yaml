name: ai_stepQuakeAttack
address: '0x081029CE'
kind: function
status: probable
summary: AI attack step that spawns a temp attack object on the target panel, shakes the camera, plays
  rumble sounds for 12 frames, then flags a quake-type hit.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 12-frame step result; sets HitElement = 0xC
  when finished
details: 'If oAIAttackVars_AttackElement is still 0, it performs the attack''s initiation once: sets the
  object''s CurAnim to 0xF, calls spawn_t1_0x5_tempAttackObject_80B8E30 with r4 = 0x2831 (spawned from
  AIDataPtr+0x68), resets StepTimer, plays sound 0xFD, starts a camera shake (r0=0, duration 0x3C), and
  stores AttackElement = 4. On subsequent calls it plays thud sound 0xE3 every 16 frames of StepTimer,
  increments the timer, and once it reaches 12 writes HitElement = 0xC (quake/ground element) to signal
  the attack''s hit. r7 must be preserved across the spawn call (pushed/popped). No caller is known, so
  which boss uses this is not confirmed.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne guards one-time initiation storing AttackElement=4;
    bl spawn_t1_0x5_tempAttackObject_80B8E30 with r4=dword_8102C1C=0x2831 after loading AIDataPtr+0x68;
    bl PlaySoundEffect with 0xFD, then camera_initShakeEffect_80302a8 with r0=0, r1=0x3C; loop plays sound
    0xE3 when (StepTimer & 0xF)==0 and stops after timer reaches 12 by writing HitElement=0xC
