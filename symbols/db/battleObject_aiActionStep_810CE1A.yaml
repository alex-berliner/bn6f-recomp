  \ (r10) to locate a battle actor under a given panel and inspect its object-flag word.\n  - Calls object_setAttack0\
  \ (r5) to set the attack-0 timer/state on the AI's battle object.\n  - Tail-call / fall-through into\
  \ sub_810CEAE and sub_810CF4A; given the layout (addresses within 0x200 bytes of each other), these\
  \ are likely the \"execute chip\" / \"execute attack\" sub-steps that follow the decision.\n  - All\
  \ 40 captured call sites come from snap_story6_*.bin with r1=0x20 (the \"0x20\" AI state in AIData's\
  \ AIState field at 0x80), so this is the per-tick handler for AIState==0x20 in story chapter 6.\n  -\
  \ Note: no assembly available in repo, so the exact sequence of decisions is inferred from callee identities;\
  \ cannot tell which branch leads to which helper.\nevidence: |\n  - callee battle_pickRandomRowObjectFields_810971A\
  \ returns object id+attr: picks a row target.\n  - callee GetPositiveSignedRNG is the only RNG used\
  \ here, so target selection is randomized.\n  - callee ifPanelFlagSetFindBattleActorWithCollisionOnPanelXY_80E7486\
  \ + object_getFlag: pattern of \"find actor on panel, look at its collision/flag word\".\n  - callee\
  \ object_setAttack0: writes the attack-0 trigger on the AI's battle object (r5).\n  - contract out=['r1','r5']\
  \ with r0 always returned 0 (all 6 captured exits r0=0, -ZC-): caller treats it as a step returning\
  \ nothing meaningful.\n  - captured r1=0x20 across all 40 sites: matches AIData.AIState==0x20 being\
  \ the dispatch state.\n  - file name prefix snap_story6_*: story chapter 6 enemy AI hook.\nuncertain:\
  \ |\n  - Without the assembly we cannot confirm the call ordering of sub_810CEAE vs sub_810CF4A, nor\
  \ which condition gates which; reading the disassembly would settle this and let us name the function\
  \ more precisely (e.g. \"AIState0x20_attackStep\" vs \"AIState0x20_moveStep\").\n"
