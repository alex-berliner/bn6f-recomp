name: ShuffleByteList_PrimaryRNG
address: '0x08000C72'
kind: function
status: confirmed
summary: Shuffles a byte array in place by performing a caller-given number of random swaps, using the primary game
  RNG.
interface: void ShuffleByteArray(u8* r0 array, u32 r1 length, u32 r2 swapCount) — modifies array in place; returns
  r0=array, r1=length (unchanged), r2=0 (decremented to zero), r3=index of first swap slot; Z/C/V set by the final
  decrement (Z set when swapCount reached 0)
details: "Fisher–Yates-style shuffle driver: repeats `swapCount` times (r2), each iteration draws\ntwo independent\
  \ random numbers from GetPositiveSignedRNG and reduces each modulo the\narray length (r1) using the BIOS Div call\
  \ (svc 6), taking the remainder in r1 as an\narray index. It then swaps the two bytes at those indices (ldrb/strb\
  \ pairs). Notes:\n- The RNG call may clobber r1/r2, so the code re-pushes/pops r0/r1/r2 around each call\n  and\
  \ reloads r1 with the length before each svc 6; this is why the routine churns the\n  stack every iteration.\n\
  - r0 (array pointer), r1 (length) and r2 (swap count) are preserved across the whole\n  call, even though r2 ends\
  \ at zero after the final decrement.\n- r3 ends holding the first index of the last swap — an incidental side\
  \ effect, likely\n  not used by callers.\n- Loop condition uses the flags from SUBS r2,#1, so the final flags\
  \ reflect swapCount==0.\n- The second random draw happens before the first division's quotient is overwritten,\n\
  \  matching the original's exact register flow.\n- Uses the primary RNG source (GetPositiveSignedRNG), so results\
  \ are tied to the game's\n  main random state; a separate variant would exist for other RNG streams if needed.\n"
