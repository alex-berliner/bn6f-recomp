summary: Battle chip-preview GFx init trampoline that passes the "open chip preview" flag (=1) into sub_801C002,
  which is the project's hand-table chip-preview GFX loader.
interface: '(none — only uses callee-saved r4, r6, r7, r10, lr) -> void ; side effects: triggers the chip-preview
  GFX load via r0=1'
details: "The function is a 4-instruction leaf-like wrapper: push {lr}; mov r0, #1; bl sub_801C002; pop\
  \ {pc}.\n  It hard-codes r0=1 and forwards execution to battle_loadChipPreviewGfxFromHandTable_801C002,\n\
  \  using tail-call-pops {pc} as the return. The register contract shows it reads only r4/r6/r7/r10/lr\n\
  \  (matching the surrounding Toolkit-style calling convention where r10 is oToolkit, r4/r6/r7 are\n\
  \  general locals), and writes only those callee-saved registers plus r5 in addition. No return\n  value\
  \ is observed in any capture (r0=0 with -ZC- flags on exit, with the captured r0=0 likely\n  being the\
  \ value returned from sub_801C002, which we just discard).\n  The captured \"lr=0x0801bef8\" at call\
  \ sites suggests this is invoked from inside the story2\n  (request-BBS / story flow) sub-system, with\
  \ one common caller. The literal argument 1 presumably\n  selects the \"open / load\" mode for the chip-preview\
  \ GFX drawer (as opposed to a \"close\" or other\n  mode). I drop the final `_ADDRESS` since the role\
  \ is fully explained by the callee name and the\n  literal payload.\n"
