name: submenu_clearBgIfClosed_8134594
address: '0x08134594'
kind: function
status: confirmed
summary: Clears the submenu background tile area when the in-game submenu (menu window) is not currently
  open.
interface: "void submenu_clearBgIfClosed_8134594(void);\n  /* takes no arguments; trashes r0-r3, r4-r6,\
  \ lr; clobbers N, Z, C, V */\n"
details: 'Guards on submenu_isOpen_81355D8: if it returns non-zero (submenu open) the function

  early-returns without touching anything. Otherwise it issues a tile-clear style call into

  sub_813468C with the fixed tile range (0xE7, 0x16, 0x00, 0x10) and a static pointer

  byte_81331EC held in r4, with r6 = 0 (likely a destination/palette/scratch slot).

  The pushed {r4-r7,lr} / pop {r4-r7,pc} envelope means the function preserves r4-r7 across

  the early-return path but, per the contract, the active path lets submenu_set calls win

  (callers see r4-r7 as outputs). The call to sub_813468C uses the standard "fill/draw

  tile rectangle" calling shape used elsewhere in the submenu code, suggesting this routine

  is invoked when transitioning into or out of the submenu to wipe the menu''s BG tiles so

  the map underneath is visible again.

  '
