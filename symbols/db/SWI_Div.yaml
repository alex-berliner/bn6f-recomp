name: SWI_Div
address: '0x0814D8BC'
kind: function
status: confirmed
summary: Thin wrapper that invokes the BIOS signed 32-bit division call (svc 6) and returns the quotient, remainder,
  and absolute quotient to the caller.
interface: int SWI_Div(int dividend /*r0*/, int divisor /*r1*/, int r2_in /*r2 passthrough*/, int r3_ignored); returns
  r0 = dividend / divisor (signed), r1 = dividend % divisor (signed), r3 = abs(quotient) as unsigned, r2 passthrough
details: 'The function body is only an svc 6 instruction followed by bx lr; all the actual work is done by the GBA
  BIOS signed-division routine. Per the BIOS contract, on entry r0 is the signed dividend and r1 the signed divisor;
  on return r0 holds the signed quotient, r1 the signed remainder, and r3 the absolute value of the quotient treated
  as unsigned. r2 and lr are passed through untouched. Known BIOS quirks apply: division by zero returns quotient
  = dividend (negative if dividend negative, i.e. -1 for negative input per BIOS docs), remainder = dividend, and
  abs(quotient) = dividend; the BIOS also emits a divide-by-zero halt if register DivByZeroCheck is set. Being a
  SWI wrapper, it never touches game memory or structures.

  '
