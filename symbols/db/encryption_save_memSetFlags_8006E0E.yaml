name: encryption_save_memSetFlags_8006E0E
address: '0x08006E0E'
kind: function
status: confirmed
summary: XORs every byte of a save buffer with the save obfuscation key, serving as both encrypt and decrypt (applying
  it twice restores the data).
interface: void encryption_save_xorBufferWithKey(u8* buf /*r0*/, s32 count /*r1*/); clobbers r0-r3 and flags; preserves
  r4-r7 (despite pushing them, r7's key is only persisted through memory)
details: 'Loads a 32-bit obfuscation key from eUnusedExtraToolkitPtrsOffset+4, then walks the buffer backwards from
  the last byte (count-1) down to byte 0, XORing each byte with the key''s low byte and storing it back. The loop
  is a do-while, so it runs once even when count <= 0, and a negative index wraps around the address space exactly
  as the hardware ldrb/strb would. The key itself is re-stored unchanged to eUnusedExtraToolkitPtrsOffset+4 before
  returning (it is not rotated or advanced), so the routine is its own inverse and is used both to obfuscate save
  data before writing and to deobfuscate it after reading. r3 is left holding the last XORed byte; r0/r1 and the
  flags are scratch. r4-r7 are pushed/popped, so callers see their incoming values preserved.

  '
