name: battle_dispatchEventScript_8119018
address: '0x08119018'
kind: function
status: confirmed
summary: Sets the battle object to active-state 4, resolves its action-byte script type through parallel
  lookup tables, validates the entry, then tail-calls the text-script interpreter to execute the resulting
  dialogue/event script.
interface: void battle_dispatchEventScript_8119018(u32 r5 /* battle_object_ptr */); /* clobbers r0-r3,
  flags; preserves r4-r7 */
details: r5 points to a battle-object struct. Offset 9 is written with 4 (active/busy state). Offset 3
  holds the action byte; subtracting 7 yields a table index. Two parallel lookup tables (off_811905C for
  object-data pointers, byte_811906C for script-data pointers) are indexed by (index<<2) to retrieve per-script-type
  constants. sub_8137884 is called with (index, obj_val, script_val) and returns a packed entry; the low
  nibble is extracted (>>4) and fed to sub_804A24C (event-script advance/validate). Finally sub_3006B94
  (the text-script interpreter) is invoked via BX to its Thumb entry, with R0 = validated result, R1 =
  a jump-table address (sub_3006B94+1 area, referencing TextScriptFolderNames), R2 = obj_table_val, R3
  = script_table_val, R4 = 8, R5 = 1, R6 = dword_86B7AE0 (a global battle-script context), R7 = 0. The
  function itself is a thin dispatch wrapper; all real script execution happens in the callee.
