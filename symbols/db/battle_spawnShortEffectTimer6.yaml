name: battle_spawnShortEffectTimer6
address: '0x080BB278'
kind: function
status: probable
summary: Spawns a battle effect object (effect type 0) and gives it a 6-frame lifetime, returning the
  object or null.
interface: (r0 = effect spawn args passed through to wrapper) -> r0 = spawned battle object pointer, or
  0 if spawn failed; no meaningful flags
details: 'The function is a thin effect-spawn helper: it calls the known wrapper spawn_t1_0x0_EffectObject,
  which allocates a type-4 battle object running effect type 0, and on success stores 6 into the object''s
  Timer field at oBattleObject_Timer, which acts as the object''s frame lifetime before it despawns. If
  the spawn returns NULL it simply returns without touching anything. The literal pool after the function
  (0x12C, 0x1E04, 0x280000, and a byte table) belongs to neighbouring data/code, not to this routine.
  The 6-frame timer suggests a brief visual effect such as an impact flash or puff tied to the caller
  at 0x080BB23E.'
