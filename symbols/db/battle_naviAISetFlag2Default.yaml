name: battle_naviAISetFlag2Default
address: '0x080143CE'
kind: function
status: probable
summary: Conditionally sets flags-2 bit 0x200 on the battle object's AI data when two AI-state gate fields
  are clear
interface: (r0 = BattleObject ptr via callee convention) -> r0 = clobbered; flags from callees
details: 'Called from the navi AI tick as one of its per-frame gating checks. It first calls battle_aiAIDataUnk32IsZero_801445C,
  which returns with Z set iff the BattleObject''s AIData Unk_32 halfword is zero; if non-zero it returns
  immediately. Next it calls battle_checkAIDataUnk36IsNonZero_8014490 and likewise bails if Unk_36 is
  non-zero. Only when both fields are zero does it load 0x200 and call object_setFlag2, setting bit 0x200
  in the object''s collision-data flags2 word. This looks like a ''fall back to a default flag when no
  special AI condition is active'' behavior: Unk_32/Unk_36 act as inhibitors, and 0x200 is some default
  or idle mode bit consumed elsewhere by the AI or collision logic.'
