name: sub_812053C
address: '0x0812053C'
kind: function
status: hypothesis
summary: Builds a low "0x4000"-flagged VRAM/palette-ish word from sub_81205C0's result and dispatches it via sub_802FE28
  with a small index offset.
interface: '(u32 r0, u32 r1, u32 r2, u32 lr) -> u32 r0; flags out: N,Z,C,V'
details: 'Saves r4..r7 and lr. Copies caller''s r1 into r4. Calls sub_81205C0 with r3=0 (no args besides the implicit
  one). If r0 is negative the function returns immediately. Otherwise it masks off bits 0xC0008000 of r0, ORs in
  constant "0x4000" (from byte_8120564), then computes r1 = 0xC + original_r1, sets r2 = 0, r3 = 1, and calls sub_802FE28
  (a "do thing with id" style dispatcher that takes a tag/flags word, an index, two control ints). Behavior on the
  negative branch is just an early return; the 0x4000 flag is the only bit forced on, and 0x8000 plus the top two
  bits 0xC000 are explicitly cleared -- a narrow window. sub_81205C0 is the producer of the bits, so this function
  is a thin post-processor that funnels its output into the sub_802FE28 dispatcher.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
