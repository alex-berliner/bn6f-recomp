open_questions:
- The exact meaning of r0 ("kind" 4) and what the masked bits (0xC0008000) clear; sub_81205C0 is un-analyzed and
  its return value is the only thing reformatted here.
- Whether the "r4 = r1" copy is the OAM slot buffer base or some other context; the literal 0xC stride is the strongest
  hint that r1 pointed at a 12-byte-per-entry OAM list.
- Why the early return path leaves r0 = 0xFF — is that sub_81205C0's own error code being preserved (the blt doesn't
  write r0) or did some preceding call produce it?
