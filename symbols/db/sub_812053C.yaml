name: sub_812053C
address: '0x0812053C'
kind: function
previous_names: []
status: hypothesis
summary: spawns a damage-number OAM overlay for a battle object given an effect descriptor
interface: '(r0 = damageEffectId, r1 = oamSlot/battleObject?, r2 = packed(oamIndex|flags)|0x37, r3 = oS20047CCptr)
  -> r0 = 0xFF ; side effects: queues OAM via sprite_queueOamEntryThunk_802FE28'
details: "Stub. Pushes r4-r7; saves r1 in r4, zeroes r3, calls sub_81205C0 with (r0,r1,r2,r3=0).\n  If sub_81205C0\
  \ returns negative (BLT locret), bail out. Otherwise it strips the OBJ-mode\n  attribute bits 0xC000_8000 from\
  \ r0 and ORs in `byte_8120564` (=0), then forms a tile attribute\n  word with `0xC << (r4*4)` placed in r1 (looks\
  \ like `add r1,r1,r4` builds a 4-bit-per-slot\n  selector; `mov r1,#0xc` → `add r1,r1,r4` → r1=0xC+r4, presumably\
  \ the tile-count shift),\n  passing (r0, r1, r2=0, r3=1) to sprite_queueOamEntryThunk_802FE28.\n  The captured\
  \ entry r1=0x8160, r2=0x00BA0037, and exit r0=0xFF strongly suggest this is a\n  \"spawn damage-number sprite\"\
  \ path used in battle: r0 carries a damage/effect id (cleared to\n  0xFF for the caller), r1 a battle object pointer,\
  \ r2 a packed OAM-attrs/shape word\n  (0xBA0037 looks like OBJ-affine/SIZE_8x32 + tile base), and r3 points at\
  \ oS20047CC\n  (battle sub-state at 0x020047CC per captured calls).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r4,r1 ; mov r3,#0 ; bl sub_81205C0` — saves r1 (battle object?), zeros r3, defers to sub_81205C0
    for the prep work. - `tst r0,r0 ; blt locret_812055E` — early-exit on negative result, classic success/fail
    gate. - `ldr r1,dword_8120560 ; bic r0,r1` followed by `ldr r1,byte_8120564 ; orr r0,r1` — strips the OBJ-bank
    bits and re-ORs a constant zero, building a clean tile-attr word for OAM. - `bl sprite_queueOamEntryThunk_802FE28`
    — directly calls the OAM-queue helper. - Captured calls consistently r0=4, r1=0x8160, r2=0x00BA0037, r3=0x020047CC
    (=oS20047CC), exit r0=0xFF — matches "spawn a damage-number OAM frame for an in-battle effect, return 0xFF as
    a sentinel".'
