name: battle_lungeUpdate
address: '0x080BFA38'
kind: function
status: probable
summary: Per-frame phase handler for a battle object that teleports 100px to the opposite side, then dashes
  back to its panel over 10 frames leaving afterimages.
interface: (r5 = battle object, no args) -> r0 = undefined; sets object's CurPhaseAndPhaseInitialized
  = 4 when done
details: On first entry (PhaseInitialized==0) it plays sound 0x3B, resets the timer, instantly offsets
  X by facing*0x640000 (100px, 16.16 fixed point), sets Z=0x640000, sets XVelocity = -facing*0xa0000 and
  ZVelocity = -0xa0000, and marks PhaseInitialized=4. Each subsequent frame it integrates X/Z by those
  velocities and spawns an illusion/afterimage pair via battle_spawnIllusionPair on timer frames 5 and
  7. When the timer reaches 10 (i.e. it has slid back ~100px), it snaps position to the panel grid with
  object_setCoordinatesFromPanels, calls sprite_disableAlpha to clear any alpha blending, and writes phase
  4 to CurPhaseAndPhaseInitialized to advance the state machine. The object pointer is passed in r5, matching
  the project's phase-handler convention; the function takes no arguments.
