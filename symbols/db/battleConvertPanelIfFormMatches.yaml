name: battleConvertPanelIfFormMatches
address: '0x080128FC'
kind: function
status: probable
summary: If the object's panel type is 6 and the battle side's NaviStats byte 0x2C is 7 or 0x13, and the
  chip record (via chip id) has byte+6==3 with bit1 set and bit0 clear, converts the panel to type 2 and
  returns 1; otherwise returns 0.
interface: (r0 = battle object/handle (saved, unused here), r1 = chip id) -> r0 = 1 if panel converted
  to type 2, else 0 via sub_8012956 path; r5 = battle object supplying x/y at +0x12/+0x13
details: Reads the object's panel coordinates from r5+0x12 and r5+0x13 and fetches the panel record via
  object_getPanelDataOffset; if none, returns 0. Only panels whose byte at +2 equals 6 proceed. It then
  reads the battle side's NaviStats byte 0x2C and requires it to be 7 or 0x13 (some cross/beast form id).
  The caller's chip id is resolved through getChip8021DA8; the 44-byte chip record must have byte+9 with
  bit1 set and bit0 clear (an element/flag test) and byte+6 equal to 3. When all conditions pass, object_setPanelType(x,
  y, 2) rewrites the panel and the function returns 1. Otherwise it branches into shared tail sub_8012956,
  which presumably cleans up/returns 0. r4 holds the first argument but is never read in this body.
