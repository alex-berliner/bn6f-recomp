name: battle_spawnTempAttackDelayPhase
address: '0x080BF8A8'
kind: function
status: probable
summary: 'Attack-phase handler for a battle object: on first entry it sets animation 0xA, spawns a subtype-5
  temp attack object linked to itself, plays sound effect 0x94, then waits 30 frames before advancing
  to phase 4.'
interface: (r5 = battle object ptr, r4 = 0x10032 spawn param, r7 = r5+0x60 linked-object data) -> r0 clobbered;
  sets oBattleObject_CurAnim=0xA, oBattleObject_Timer=30, oBattleObject_PhaseInitialized=4, then oBattleObject_CurPhaseAndPhaseInitialized=4
  when timer expires
details: 'Standard battle-object phase step using the PhaseInitialized/Timer pattern: on first run it
  stores anim 0xA and a 30-frame timer (0x1E), loads the constant 0x10032 from a nearby data pool into
  r4, and calls spawn_t1_0x5_tempAttackObject_80B8E30 with r5+0x60 prepared, so the spawned attack object
  inherits the owner''s panel position/alliance and is linked back to r5. It then plays M4A sound 0x94
  and marks the phase as initialized with value 4. On subsequent frames it decrements oBattleObject_Timer;
  when it reaches 0 it writes phase value 4 into the combined CurPhaseAndPhaseInitialized byte, ending
  the wait. The 0x10032 constant likely encodes spawn placement or flags for the temp attack; the exact
  enemy/move identity can''t be read from this code alone.'
