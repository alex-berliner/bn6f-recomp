- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/strb around oBattleObject_PhaseInitialized with bne skip shows a run-once init section
    (asm lines 2-16); strb #0xa to oBattleObject_CurAnim and strh #0x1e to oBattleObject_Timer set a 30-frame
    anim/wait (init block); ldr r4, dword_80BF978 (=0x10032) followed by bl spawn_t1_0x5_tempAttackObject_80B8E30
    passes a fixed spawn parameter; mov r0,#0x94; bl PlaySoundEffect plays sound 0x94 immediately after
    the spawn; timer decrement with bgt, then strh #4 to oBattleObject_CurPhaseAndPhaseInitialized, transitions
    to phase 4 after the wait'
