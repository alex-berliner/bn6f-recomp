name: sub_802C588
address: '0x0802C588'
kind: function
status: hypothesis
summary: Writes 42 consecutive halfword values (0xC1E8..0xC211) to memory at r0, most plausibly the tile-index field
  of a run of OAM entries for one large sprite/animation frame.
interface: void sprite_FillConsecutiveTileIndices(u16 *dst /*r0*/); returns with r0 = dst+0x54 (past the filled
  range), r1 = 0xC212 (one past last value written), r2 = 0 (exhausted counter); clobbers flags, preserves nothing
details: Simple linear fill loop — loads the start value 0xC1E8 from a literal pool dword, stores it as a halfword
  at [r0], then increments both the value and the destination pointer by one halfword step, 0x2A (42) times, so
  the destination receives the unbroken sequence 0xC1E8, 0xC1E9, ... 0xC211. The value range (0xC1E8 = 49640, well
  above real VRAM tile numbers) strongly suggests these are OAM attribute-2 halfwords where only the low tile-index
  bits matter, i.e. it patches the tile indices of ~42 sprite objects so each points at the next tile — typical
  for building/relocating a large multi-tile sprite or animation frame whose tiles must be consecutive. Callers
  must supply the destination; the function returns loop-exhaustion state in r2 and the next value in r1, but callers
  per the contract appear to ignore both outputs, treating it as void. No flags are used by the loop (sub/bne only
  tests the counter).
