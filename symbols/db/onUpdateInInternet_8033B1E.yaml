name: onUpdateInInternet_8033B1E
address: '0x08033B1E'
kind: function
status: confirmed
summary: Per-frame update hook while browsing the Internet overworld — runs the common Internet update step, requests
  state 1, and redraws the current map/area name display.
interface: 'void onUpdateInInternet_8033B1E(self: *S2011E30 /* in r5 */); reads r4-r7, r9-r12, lr from callers;
  passes through all callee register and flag (nz c v) effects'
details: "Update callback invoked while the player is navigating the Internet\n(cyberworld overworld) map. Three\
  \ steps:\n1. Calls sub_8033E0C, the shared Internet-mode per-frame update\n   (self context in r5, pointer to\
  \ struct S2011E30).\n2. Sets r0 = 1 and calls sub_8033F80, apparently selecting/flagging\n   state 1 for whatever\
  \ that routine updates (likely the map-name\n   overlay or display mode).\n3. Calls RenderMapName_8033EE8 to redraw\
  \ the current Internet area\n   name on screen.\nIt is a bare tail-style sequence: no locals, no state of its\
  \ own, and\nit does not clean up register/flag side effects — NZCV and registers\nare simply passed through from\
  \ the last callee to the caller, so the\ncaller effectively sees RenderMapName_8033EE8's condition codes.\nr5\
  \ (the S2011E30 self pointer) is preserved across the routine.\n"
