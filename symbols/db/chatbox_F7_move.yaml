name: chatbox_F7_move
address: '0x08042830'
kind: function
status: confirmed
summary: Chatbox state-machine dispatcher — reads the chatbox object's state byte and tail-jumps to one of ten per-state
  update handlers.
interface: void chatbox_dispatchState(Chatbox* r4) — r4 = chatbox object; returns whatever/wherever the selected
  handler returns (the handler's results and flags pass straight through to this function's caller)
details: 'r4 points at the chatbox state object; the byte at [r4,+1] is the current

  state (0-9 in practice). The state is shifted left by 2 and used as an

  index into a jump table of ten handler pointers (0x0804286C, 0x080428B8,

  0x080428C0, 0x080428E4, 0x080428EC, 0x080428FC, 0x08042910, 0x0804293C,

  0x08042990, 0x080429D8 — the chatbox''s typewriter-text / input / close

  update steps). The dispatch is a tail call done with `mov lr, pc / bx r0`,

  so the selected handler returns directly to chatbox_F7_move''s own caller

  rather than back here; the handler receives R1 = state*4 and R0 = its own

  table entry address (an artifact of the computed call), and its register

  and flag outputs become this function''s outputs. There is no bounds

  check — an out-of-range state byte would fetch a garbage pointer from

  beyond the table.

  '
