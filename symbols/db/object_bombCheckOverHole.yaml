name: object_bombCheckOverHole
address: '0x080D146A'
kind: function
status: probable
summary: Returns whether the bomb object is over a hole (bit 0x10 of the panel status) at its own tile
  or the tile one row toward the player, so the caller can make it drop/explode accordingly.
interface: (r0 = unused, r5 = battle object) -> r0 = nonzero if the bomb is above a hole panel (or region
  is 0); flags clobbered
details: Reads the object's collision data 'Region' byte; if it is 0 it immediately returns 1. Otherwise
  it reads the object's PanelX/PanelY and calls object_getPanelParameters, masking the status word with
  0x10 (the hole/broken-panel bit); if Param1 is 0 it returns that result as-is. When Param1 is nonzero
  it repeats the query at PanelY-1 (one panel toward the player's side) and ORs the two 0x10 bits together,
  so the bomb counts as 'over a hole' if either tile is one. Only fields of the battle object and its
  CollisionData struct are touched; r4 is used as scratch despite only being pushed for alignment.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r0,#oCollisionData_Region]; cmp #0; mov r0,#1 — early ''true'' return when collision
    region is 0 (80D146E-80D1476); bl object_getPanelParameters on the object''s own PanelX/PanelY, then
    and r0,#0x10 — tests the hole bit of the current tile; second getPanelParameters call with sub r1,#1
    and orr r0,r4 — ORs in the hole bit of the tile one row toward the player; guard ldrb r1,[r5,#oBattleObject_Param1];
    beq — skips the second panel check when Param1 is zero; sole caller object_bombUpdate_80D12CA is the
    type-1 bomb object''s per-frame update, so the hole check gates bomb behavior'
