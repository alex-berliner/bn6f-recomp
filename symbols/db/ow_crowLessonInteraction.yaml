name: ow_crowLessonInteraction
address: '0x08142FC8'
kind: function
status: probable
summary: 'Per-frame overworld handler for the Cybercrow lesson spot: a denied forward/jack-in press begins
  a flag-staged cutscene sequence with the crows.'
interface: () -> r0 = 0 always; runs each frame while the player stands at the spot, setting/clearing
  EVENT_962/EVENT_963 and starting cutscenes as side effects
details: 'Runs only when check_playerCanAdvanceForward_8034C36 reports the player is pressing forward
  at this tile. First press: sub_81433DA succeeds -> set EVENT_962 (stage 1), otherwise PlaySoundEffect(SOUND_CANT_JACK_IN).
  Next frames (EVENT_962 set): set EVENT_963 (stage 2), and if no other script is active (sub_80357AE),
  start cutscene byte_808C2F0 and call sub_81433F6(1). Stage-2 helper sub_8143088 (which manipulates the
  crow record array byte_2000D20: +0 state, +2/+6 timers, +4 heading, +8..+0x10 XYZ) yields an index used
  to pick one of two follow-up cutscenes from the table off_8143078; sub_8143198 signals when the lesson
  sequence is done, at which point both flags are cleared and the handler returns 0. The flags are also
  cleared every frame on the early-exit paths, so they act as one-frame-latched step markers rather than
  persistent progress.'
