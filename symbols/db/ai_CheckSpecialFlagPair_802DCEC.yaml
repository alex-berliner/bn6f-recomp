name: ai_CheckSpecialFlagPair_802DCEC
address: '0x0802DCEC'
kind: function
status: confirmed
summary: AI helper that reports whether a battler's AI data has either of two special state flags (0x1000 at +0x48
  or 0x4000000 at +0x44) set.
interface: 'bool ai_CheckSpecialFlagPair_802DCEC(u32 aiIndex); // in: r0 = AI/battler parameter; out: r0 = 1 if
  either flag is set, else 0; clobbers r1, r3, NZ; clears C and V; preserves caller''s r5/r7'
details: 'Takes a parameter (r0) that is passed straight through to the AI-data flag getters, most plausibly a battler/enemy
  index or AI handle. If the parameter is 0 the function short-circuits and returns 0. Otherwise it calls GetAIDataUnk0x48Flag
  with the parameter and tests the returned flag word against bit 0x1000; if that bit is set it returns 1 immediately.
  Otherwise it calls GetAIData_Unk_44_Flag (which, due to instruction scheduling in the original, is entered with
  r1 still holding 0x1000) and tests bit 0x4000000; if set, returns 1, else 0. So the verdict is "yes" if either
  the +0x48 bit 0x1000 flag or the +0x44 bit 0x4000000 flag is set for this AI entity. Quirks: r5 and r7 are used
  as scratch (parameter copy and running result) but are pushed/popped, so callers see their r5/r7 unchanged; r1
  ends up holding the mask of the last flag tested (0x4000000, or untouched on the parameter==0 path); the final
  mov r0,r7 assembles to adds r0,r7,#0, which clears C and V on every return path. The dual-bit pattern suggests
  two different conditions (e.g. two AI behaviour/mode flags such as a boss-mode or special-tactics marker) that
  both gate the same decision.

  '
