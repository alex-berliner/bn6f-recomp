name: battle_initActiveChipEntries
address: '0x08027F42'
kind: function
status: probable
summary: During chip-select turn initialization, walks the 12 active-chip records and refreshes each non-Mega/Giga
  entry's selection index, slot chip id, and selected-chip pointer.
interface: (void) -> void; only calls out, r6/r7 clobbered internally (saved)
details: 'Counts r6 from 0xB down to 0, i.e. it iterates all 12 active-chip records used by the chip-select
  screen. For each index it fetches the 12-byte record via getLocOfActiveChips_8027E1C and reads the record''s
  first byte. If that byte is 0xA or 0xB (Mega/Giga class marker) the record is skipped entirely; otherwise
  it runs the clear/update chain: battle_clearActiveChipIfMegaGiga_8027F6A (resets the active-chip selection
  index to 0xFF), battle_updateActiveChipSlotId_8027F84 (re-derives the highlighted slot''s chip id, with
  the slot 5/9 special case), and sub_8027FDC (recomputes the selected-chip pointer from the id lookup
  table). Its only caller is battle_initChipSelectTurn_8027E2C, which sets up the chip-select active state
  at the start of a turn, so this re-initializes per-entry selection state. The exact meaning of the 0xA/0xB
  test on byte 0 (chip class stored first vs. a per-record state flag) is not provable from this function
  alone, but the skip-then-refresh shape is clear.'
