    from processing; body calls battle_clearActiveChipIfMegaGiga_8027F6A, battle_updateActiveChipSlotId_8027F84,
    sub_8027FDC in sequence, all entry-index independent (r6 already consumed by getLocOfActiveChips);
    sole caller battle_initChipSelectTurn_8027E2C runs during chip-select turn init, matching a per-record
    reset/refresh role'
