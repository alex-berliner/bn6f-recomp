- method: assembly-reading
  date: '2026-10-18'
  detail: bl reqBBS_8140974 then addMail with flag base dword_809C0E4 = 0x1CA0 (asm lines 2-8); byte [r5,#7] gates
    the read-state update via tst/beq; ClearEventFlag on 0x1D20-based id matches addMail's companion-flag scheme
    (mailId + 0x80); SetEventFlag on 0x1DA0-based id mirrors 0x1CA0 (post index) plus 0x100 offset; return value
