name: sub_809C09C
address: '0x0809C09C'
kind: function
status: probable
summary: Grants the mail attached to a BBS board post, then marks that post as read.
interface: '(r0 = unused/ignored, r5 = context: [r5+6] = BBS post index, [r5+7] = mark-read flag) -> r0 = 0; flags
  set/cleared via event-flag calls'
details: Calls reqBBS_8140974 to get the selected BBS post's runtime index, adds it to [r5+6] and to base 0x1CA0,
  and passes the result to addMail_802f238, so the post's mail id is 0x1CA0 + postIndex + boardOffset. If byte [r5+7]
  is nonzero, it then clears flag 0x1D20 + postIndex + index (the post's 'new/unread' indicator) and sets flag 0x1DA0
  + postIndex + index (the 'read' indicator). Always returns 0. This matches BN6's BBS system where reading certain
  board topics delivers mail and flips the topic's read state.
