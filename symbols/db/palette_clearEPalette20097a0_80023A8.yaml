name: palette_clearEPalette20097a0_80023A8
address: '0x080023A8'
kind: function
status: confirmed
summary: Zero-fills the 0xD8-byte palette object at ePalette20097a0 (216 bytes = 16 palettes of 16 BGR555 entries).
interface: void sub_80023A8(void)
details: 'Pushes LR, then calls ZeroFillByWord with the fixed address ePalette20097a0 in r0 and size 0xD8 in r1,
  clearing the buffer word by word, and returns via popped PC. The 0xD8 (216) byte size matches a full hardware
  palette''s worth of colors (16 subpalettes x 16 colors x 2 bytes), so this appears to (re)initialize a scratch/current
  palette buffer used by the sprite/palette subsystem, likely before new palette data is loaded into it. r0/r1 are
  scratch; r2/r3 are preserved (the register contract lists them as both inputs and outputs, i.e. untouched pass-throughs);
  flags are clobbered by the callee. The address and size are both loaded via literal pools, so the target is hard-coded.

  '
