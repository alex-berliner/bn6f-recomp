name: overworldObject55_ReadStreamEntry_8031A68
address: '0x08031A68'
kind: function
status: confirmed
summary: Reads one 32-bit entry from an overworld script/data stream into object 55's value field, advances the
  stream pointer, and resets its two sentinel bytes to 0xFE.
interface: 'void overworldObject55_ReadStreamEntry(u32* stream) // r0 in: pointer to the entry to consume; no register
  outputs, flags clobbered'
details: Operates on the singleton structure at 0x2013920 (an overworld map object, eOverworldMapObject55). It reads
  the word at r0, stores its low halfword into the value field at +4 (word_2013924), then advances r0 by 4 and stores
  the updated read pointer back into the stream-position field at +0 (dword_2013920). Finally it writes 0xFE to
  both bytes at +6 and +7 (word_2013926/27), likely terminator/sentinel or command-state bytes indicating "no pending
  command". Callers pass r0 as the current position within a script/data stream; the object effectively consumes
  one halfword-sized value per call. Note that although the entry is read as 32 bits, only the low halfword is kept.
