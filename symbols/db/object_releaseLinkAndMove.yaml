open_questions:
- No callers are known, so the meaning of r5 (partner object? expected pointer?) and who sets +0x4C to
  point 0x60 bytes into another structure is unverified
- The semantics of halfword +0x20 = 0x3C, halfword +0xA = 4, flags 0x40, and bytes +0x12/+0x13 vs +0x14/+0x15
  need confirmation from the movement/state code that consumes them
- Whether this belongs to a specific battle object type (tethered/homing entity) requires finding the
  caller or the writer of +0x4C
