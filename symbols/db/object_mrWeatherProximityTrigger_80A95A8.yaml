    the Z-match early-out at 0x80A95B4. - `mov r4,#0xc; lsl r4,r4,#0x10` then `bl overworldObject_withinBoxCheck_signed_80011D6`
    constructs the ±0xC0000 box half-extent; helper description matches. - `cmp r0,#1; bne locret_80A95E6`
    requires the helper to return exactly 1 to pass. - `movflag EVENT_BFC; bl SetEventFlagFromImmediate`
