status: probable
summary: 'Mr. Weather comp map object''s proximity trigger: if the player is on the same Z and within
  ±0xC0000 of the object''s (X,Y), set story event 0xBFC, copy the object index into r6, mark the per-instance
  event flag, hide the shadow, force state byte to 8 and play sound 0x1A4.'
interface: '(r5 = Mr. Weather object ptr, r6 = other object, r10 = Toolkit) -> void ; side effects: event
  flag 0xBFC, per-instance flag 0x0BF4+idx, r6+4 byte, sprite shadow cleared, [r5+8]=8, SFX 0x1A4'
details: 'Pushes {r4,lr}. Calls ReadOWPlayerObjectCoords returning (r0,r1)=X,Y and r2=Z. Compared object''s
  Z ([r5+0x14]) to player Z (r2); on mismatch, returns early (locret_80A95E6).

  On Z match, takes object''s X ([r5+0xC]) and Y ([r5+0x10]), keeps player (r0,r1), sets r4=0xC0000 and
  calls overworldObject_withinBoxCheck_signed_80011D6 — that helper returns 1 iff the player lies inside
  the ±0xC0000 box.

  If r0==1: SetEventFlagFromImmediate with EVENT_BFC (= 0xBFC), ldrb r0,[r5+4]; strb r0,[r6+4] (copying
  the Mr. Weather object''s index into a sibling object header''s Index slot), bl sub_80A9614 to mark
  0x0BF4+idx, sprite_removeShadow, mov r0,#8; strb r0,[r5+8] (force CurState-like byte to 8), PlaySoundEffect(0x1A4).
  Otherwise just pops and returns.

  Out registers from contract are r5/r10 only; function is void-like.

  '
