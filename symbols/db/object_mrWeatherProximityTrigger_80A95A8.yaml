    r0,[r6,#4]` copies the byte at object+4 (header `Index`) into another object''s header. - `bl sub_80A9614`
    per its one-liner marks the per-instance flag 0x0BF4+idx. - `bl sprite_removeShadow` clears the shadow
    as described. - `mov r0,#8; strb r0,[r5,#8]` writes 8 into the object''s state-like byte. - `ldr r0,off_80A95E8
    (=0x1A4); bl PlaySoundEffect` plays SFX 0x1A4.'
