name: battle_buildPetNaviList_8127638
address: '0x08127638'
kind: function
status: confirmed
summary: Builds and compacts the list of available PET navi IDs for the current battle toolkit, scanning
  toolkit entries and a secondary table when a special event flag is set.
interface: "void battle_buildPetNaviList_8127638(u32 toolkit /* r5 */);\n/* reads: r5 (toolkit base),\
  \ r2/r4/r6/r7/r10 present but not consumed per verified C */\n/* writes: byte_201D74C[0..0x28] navi\
  \ ID list, unk_2024394[0..0x28] secondary data,\n   [r5+0x1E] u16 navi count incremented per match */\n\
  /* clobbers: r0-r3, lr, nzcv; preserves r4-r7 via push/pop */\n"
details: 'Clears the two 0x28-byte global tables (byte_201D74C = navi ID list, unk_2024394 = secondary

  data table) via ZeroFillByByte.

  First pass (indices 0..0x18): calls toolkit_getUnk2004190EntryPtr_813B9FC(i) for each toolkit

  slot; if the u16 at the entry is non-zero AND GetCurPETNavi() == 0 (no PET navi currently

  in play), writes (val >> 2) as a u8 into byte_201D74C[i] and increments the u16 count at

  [r5+0x1E].

  Second pass (gated on EVENT_163 / TestEventFlagFromImmediate(1,0x63)): calls sub_81276E4 to

  obtain a pointer to an array of 8-byte (two-u32-field) secondary navi entries, terminated by

  field0 == 0xFFFFFFFF. For each entry it stores (field0>>2)+0x40 as a u8 into byte_201D74C

  (at the running index continuing from 0x19) and into unk_2024394 (at a separate 2-byte

  stride), copies field1 as a u16 into unk_2024394, and bumps the count at [r5+0x1E].

  Compaction: walks byte_201D74C[0..0x21]; whenever a zero byte is found, shifts the next

  non-zero byte down into the gap, repeating until the end of the 0x22 range. This removes

  holes left by skipped toolkit slots so the ID list is contiguous.

  Note: the first-pass loop body has a quirk—r7 is reassigned to the entry''s u16 value before

  calling GetCurPETNavi, discarding the entry pointer; the readable C confirms this does not

  affect correctness because only the u16 value is used afterward.

  '
