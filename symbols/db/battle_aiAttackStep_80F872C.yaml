name: battle_aiAttackStep_80F872C
address: '0x080F872C'
kind: function
status: confirmed
summary: 'AI attack state-machine step: on first tick picks and reserves a target panel via an alliance-indexed
  callback, then slides toward it; on subsequent ticks counts down the hit-timer and fires the attack
  element.'
interface: void battle_aiAttackStep(u32 r5 /*battleObject*/, u32 r7 /*aiAttackVars*/, /* r1 pass-through/clobbered
  */); /* clobbers r0-r4,r6,r7,flags; r5,r8-r12 preserved */
details: 'Reads aiAttackVars.AttackElement. If zero (first tick): writes AttackElement=4, calls object_canMove;
  if that returns Z (cannot move) it aborts the attack by setting AttackDuration=0x50 and HitElement=8.
  Otherwise it indexes a two-u32-per-alliance table at byte_80F8784 (offset = Alliance*8), loads two values,
  retrieves aiAttackVars.PanelChooseCallback, and jumps through it (mov lr,pc; bx r0) expecting the callback
  to return panel X in r0 and panel Y in r1. Those coordinates are stored into battleObject.FuturePanelX/Y,
  then object_reservePanel is called to claim the tile. The CANNOT_SLIDE flag is set via object_setFlag1,
  CurAnim is written to 4 (slide), and StepTimer is set to 3. If AttackElement was already non-zero (subsequent
  ticks): decrements StepTimer; when it reaches zero it writes HitElement=4, completing the attack. The
  table at byte_80F8784 holds per-alliance (Player/Net) panel-selection parameters: entries look like
  {0x10, 0x88F0000} for alliance 0 and {0x30, 0xF880000} for alliance 1.'
