name: sub_80010EC
address: '0x080010EC'
kind: function
status: confirmed
summary: Clamps a requested value for PET navi stat 0x40 to the existing cap held in stat 0x42, then stores it.
interface: u8 which_navi (r0), s32 requested_value (r1) -> void (returns via pop {pc}); r4-r7 preserved.
details: 'Reads the current PET/Navi stat at index 0x42 via GetCurPETNaviStatsHword (r0 = navi, r1 = 0x42) and uses
  it as a cap for the value in r6. The cap comparison is performed with ble using the signed-result flags from the
  getter, so the cap is treated as signed. Stores the (possibly clamped) value via SetCurPETNaviStatsHword into
  stat 0x40 (r0 = navi, r1 = 0x40, r2 = value). Only r2 carries the clamped value to the setter; r1/r3 are clobbered
  by the inner calls.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
