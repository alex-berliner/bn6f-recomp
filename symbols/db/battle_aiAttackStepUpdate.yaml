name: battle_aiAttackStepUpdate
address: '0x08113A1C'
kind: function
status: probable
summary: 'AI attack per-frame step: keeps AttackElement nonzero, ticks StepTimer, and while nonzero with
  bit 2 clear calls a 6x3-grid panel highlight routine using object front direction and alliance; when
  the timer expires it sets counter time, anim 5, runs sub_80C00C2 with 0xb, reloads StepTimer from AttackDuration,
  clears object byte 0x6e, sets HitElement to 0x1c, and clears AttackElement.'
interface: (r0 = scratch, r5 = battle object, r7 = AI attack vars) -> r0 = clobbered; updates oAIAttackVars_StepTimer/HitElement/AttackElement
  and object anim/counter
details: 'Runs as a per-frame AI attack update for a battle object. It first defaults oAIAttackVars_AttackElement
  to 1 when zero, then decrements oAIAttackVars_StepTimer; while it is still counting and the value is
  a multiple of 4 (tst with #4), it highlights the panel one tile in front of the object using object_getFrontDirection/Alliance/DirectionFlip,
  so the telegraph appears on the correct side. When the timer expires it calls object_setCounterTime(0x10),
  sets the object''s current animation to 5, calls sub_80C00C2 on oBattleObject_ExtraVars+8 with 0xb (likely
  a sub-object/pose setup), reloads StepTimer from oAIAttackVars_AttackDuration for the next cycle, clears
  the byte at offset 0x6e of the object, and sets oAIAttackVars_HitElement to 0x1c before zeroing AttackElement
  — i.e. it commits the strike and resets the charge.'
