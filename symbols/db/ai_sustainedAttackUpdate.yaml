name: ai_sustainedAttackUpdate
address: '0x08107644'
kind: function
status: probable
summary: 'Per-frame AI attack update: on first entry sets AttackElement=4, anim 0xE, spawns two type-1
  subtype-5 temp objects (params 6 and 5), plays SFX 0xAE, and arms a 90-frame timer with a 5-frame charge
  counter; every 5 frames it re-triggers anim 0xE (CurAnimCopy=0xFF), calls sub_8107B06, and calls sub_80B8E7C
  on each spawned object; on timer expiry writes HitElement=0x28 and ends.'
interface: () -> void; uses r5 = battle object, r7 = object's AI attack vars (oAIAttackVars); no return
  value
details: Called each frame for one AI-controlled attack. On first entry (AttackElement == 0) it marks
  the attack as element 4, switches the battle object to animation 0xE, calls sub_8107B06, and spawns
  two type-1 subtype-5 temp attack objects (params 6 and 5) that inherit position/alliance from the attacker;
  their pointers are stored at oAIAttackVars_AiAttackParam and oAIAttackVars_PanelParamFlags2. It then
  starts a 90-frame StepTimer and a 5-frame ChargeCycles counter. Each frame after that it decrements
  StepTimer; when it reaches 0 it writes HitElement = 0x28 and returns, ending the attack. Otherwise every
  5 frames it restarts animation 0xE (CurAnimCopy = 0xFF), calls sub_8107B06, replays sound effect 0xAE
  (a looping/rapid-fire noise), and calls sub_80B8E7C on each spawned object that is non-null, likely
  refreshing/moving them. The repeated sound and continuous anim restart suggest a sustained attack such
  as a beam or breath.
