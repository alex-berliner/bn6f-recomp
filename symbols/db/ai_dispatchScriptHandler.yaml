    r1 is the Thumb long-call dispatch idiom, returning straight to pop {r4,r6,pc}; table entries are
    ai_pickTargetViaOppositeAlliance/ai_initTargetedAttack/ai_setupMeleeAttack/ai_initAttackVars, all
