name: ai_dispatchScriptHandler
address: '0x08113DD8'
kind: function
status: probable
summary: Tail-dispatches to one of four AI behavior handlers (ai_pickTargetViaOppositeAlliance, ai_initTargetedAttack,
  ai_setupMeleeAttack, ai_initAttackVars) selected from off_8113DEC by the AI work struct's oAIState_ScriptId
  byte; uses mov lr,pc / bx r1 Thumb interwork so the callee returns through the enclosing pop.
interface: (r6 = AI work struct) -> r0 = return value of the dispatched ai_* handler; returns to caller
  via lr
details: 'Indexes the handler table at off_8113DEC with the byte at [r6,#oAIState_ScriptId] and tail-dispatches
  to it using the classic mov lr, pc / bx r1 Thumb interwork trick, so the callee''s return lands on the
  following pop {r4,r6,pc}. r6 is the AI/enemy work structure and oAIState_ScriptId selects which phase
  of the AI script runs. The table holds four known AI behaviors: ai_pickTargetViaOppositeAlliance, ai_initTargetedAttack,
  ai_setupMeleeAttack, and ai_initAttackVars, so each script-id corresponds to a step in an attack routine.
  No bounds check is visible; the state id is expected to be within table range.'
