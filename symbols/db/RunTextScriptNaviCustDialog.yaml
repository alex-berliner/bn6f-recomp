name: RunTextScriptNaviCustDialog
address: '0x081376A8'
kind: function
status: confirmed
summary: Runs a script (r0 = script index) from the fixed NaviCust dialog text archive in the chatbox, forwarding
  the chatbox context in r10.
interface: void chatbox_runNaviCustDialog(u8 script_idx /* r0 */, ChatboxCtx* ctx /* r10 */) — returns chatbox_runScript's
  live r2/r4/r5/r6/r7 to the caller; clobbers r0-r3, flags, lr; preserves r4-r7.
details: 'Thin wrapper around chatbox_runScript. It moves the script index from r0 into r1, loads the constant archive
  pointer TextScriptNaviCustDialog into r0, and tail-calls chatbox_runScript via bl (push {lr} / pop {pc}). All
  behavior — text display, state updates, and the values left in r2/r4/r5/r6/r7 that callers read back — comes from
  chatbox_runScript itself; the wrapper adds no logic. r10 (chatbox context) is passed through untouched. Being
  a fixed archive pointer, this only ever shows the NaviCust-related dialog text (e.g. Navi Customizer menu prompts/messages).

  '
