open_questions:
- Exact ordering of flag set/clear vs gfx load is unknown (no assembly available). Whether it returns anything meaningful
  to its caller is unknown. What `sub_809E462` is called for (the only non-graphics, non-event callee) is unclear.
  Getting the assembly and one captured call would let us split the high-level name into concrete role.
