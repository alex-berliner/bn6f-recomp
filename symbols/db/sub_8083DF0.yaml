  \ callees touch `0x2001F68` (event byte 0x17) and are wired into BBS request handling, which is part of the main-menu/connector\
  \ screen machinery; that is the strongest contextual hint for `startScreen_`.\n  - sub_809E462 is called late\
  \ and (one-line) returns nz — consistent with a \"wait for VBlank/intr\" stall at the end of an init sequence.\n"
