    / `_8036F58` discriminate cutscene-script variants (L-Message vs AskJackOut), strongly suggesting this is the
    cutscene sub-step that branches on which script is queued. - The two BBS helpers (`reqBBS_setFlag_e17b0f7_8140A00`
    confirms it pokes BBS state for the selection) appearing alongside multiple `load_gfx_anim_8083*` calls indicates
    GUI/animation timing for the JackOut dialog. - `sub_809E462` returns `nz` only and reads only r10/lr, fitting
