details: "The function body is not present in `bn6f/asm` (\"sub_8083DF0 not found in bn6f/asm\"), so every claim\
  \ below is inferred solely from the lifter's register contract and the confirmed callees listed for it.\n  All\
  \ callees touch cutscene/script state via r10 (Toolkit): `cutscene_checkOriginalCutsceneScriptPos_8036F40` / `8036F58`\
  \ test which cutscene script is saved, and `Clear/Set/TestEventFlagFromImmediate` manipulate event flags (r0,\
  \ r1 carry the flag bytes).\n  `reqBBS_setFlag_e17b0f7_8140A00` writes event flag 0x7 in event byte 0x17 (BBS\
  \ request handler) and `reqBBS_clearFlag_8140A0C` clears a corresponding BBS flag; these match a \"preload/sync\
  \ BBS requests\" pattern that games often tie to a specific story-progress script (here the L-Message/AskJackOut\
  \ scripts the two `cutscene_checkOriginal...` helpers recognize).\n  The three `load_gfx_anim_*` callees (`8083FC0`,\
  \ `8083FFC`, `8084068`) plus `struct_copy_80840C4` and `sub_8083F80`/`sub_8084080`/`sub_8084180`/`sub_8084214`/`sub_80842D8`\
  \ look like a self-contained \"load + cache GFX anim data, then dispatch by saved-script kind\" cluster that lives\
  \ in the same code page (0x8083xxx-0x8084xxx), consistent with a helper called from an overworld/cutscene subsystem.\n\
  \  `sub_809E462` (0x809e462, returns nz) is the only call outside that page; it has an `out=['nz']` contract,\
  \ suggesting this routine queries a \"should we run?\" condition and conditionally proceeds to the script-specific\
  \ branches.\n  Because r10 is the only input and the out set exposes r4/r5/r7/r8/r9/r12 plus nz, this is a typical\
  \ Thumb void-but-flags function that uses several callee-saved registers internally and lets the caller restore\
  \ them.\n"
