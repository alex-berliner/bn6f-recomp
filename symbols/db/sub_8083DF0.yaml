details: "Pure Thumb entry stub; the lifter could not recover assembly (`sub_8083DF0 not found in bn6f/asm`),\n\
  \  so the only ground truth is the callee set and the live-out register contract (`out` carries\n  r2/r3/r4/r5/r7/r8/r9/r12\
  \ plus the nz flag, plus r10 is read but not listed as live-out, meaning\n  the toolkit pointer is preserved by\
  \ the AAPCS callee-saved convention).\n  Callee list groups into three concerns:\n  1) Cutscene-sentinel tests:\
  \ `cutscene_checkOriginalCutsceneScriptPos_8036F40` (L-Message script) and\n     `_8036F58` (AskJackOut script).\
  \ These both return `nz` in r2; the function itself returns only\n     `nz` to its caller, so it must fold those\
  \ checks (likely with the locally produced nz) before\n     branching into the per-case helpers.\n  2) Event-flag\
  \ ops: `ClearEventFlagFromImmediate`, `SetEventFlagFromImmediate`, `TestEventFlagFromImmediate`\n     (generic\
  \ two-byte flag r0=byte, r1=bit) and the named BBS wrappers `reqBBS_setFlag_e17b0f7_8140A00`\n     (set 0x17/0x07)\
  \ and `reqBBS_clearFlag_8140A0C` (clear the same byte/flag 0x7 of event 0x17).\n     Together they strongly suggest\
  \ the function tracks and toggles a single BBS/request bit\n     tied to whether the L-Message or AskJackOut cutscene\
  \ is currently queued, and re-asserts or\n     clears event 0x17/0x07 accordingly.\n  3) Gfx-anim loaders: `load_gfx_anim_8083FC0`,\
  \ `load_gfx_anim_8083FFC`, `load_gfx_anim_8084068`,\n     `struct_copy_80840C4` (r5=ptr in/out copier), and `sub_8083F80`/`sub_8084080`/`sub_8084180`/\n\
  \     `sub_8084214`/`sub_80842D8` — all of which take r5 (an animation/struct base ptr) and clobber\n     the\
  \ same r2/r3/r4/r5/r8/r9/r12 set, indicating they advance a per-frame GFX-anim state machine\n     into a destination\
  \ struct. `sub_809E462` is the only non-r5 helper and only touches nz, so it\n     is likely a small \"is anim\
  \ done?\" predicate.\n  Given the cutscene checks + flag toggle + anim-load grouping, this is best read as the\
  \ per-frame\n  step of a GFX-anim driver that decides which anim slot to advance (or whether to start a\n  cutscene-bound\
  \ L-Message/RequestBBS anim) based on the saved cutscene script pointer.\n"
