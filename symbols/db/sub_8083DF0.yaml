open_questions:
- Assembly was not available in the lifter output, so the exact control flow (which flag is the trigger, what r5
  field gets written, ordering of the three load_gfx_anim calls) cannot be read directly.
- 'Whether sub_809E462''s NZ controls branch selection or is just an unrelated probe the compiler placed here by
  coincidence (named callee contract: in=[r10,lr], out=[nz]).'
- Whether the routine targets the player's beast-out, an opponent's, or both (callers section is empty, so we cannot
  see the calling context).
- Confirming whether the BBS-flag pair is the temporary beast-out active flag, or simply a related BBS grant (e.g.
  freedom-progress flag 0x17/7).
- Captured-call register values were not supplied, so the entry r0–r3 contents are unknown — having them would tell
  us whether r0 encodes the object to mutate or a flag id pair.
