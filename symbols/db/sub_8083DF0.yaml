summary: Cutscene/talk-script runner driven by event flags 0x17B0 and 0x17B1 (L-message/ask-jack-out) that prepares
  the related GFX animation, manages story progress flags, and dispatches the correct sub-flow via a per-script
  helper set.
interface: '(r10 = toolkit ptr) -> r0 = nz ; clobbers many caller-saved regs; side effect: mutates cutscene state,
  event flags, and several battle/GFX state structs in EWRAM.'
details: "Entry contract lists only r10 (toolkit) and lr, so the function takes no explicit argument\n  and returns\
  \ a boolean-ish flag in r0 (the `nz` clobber indicates a test/set used by callers).\n  The callee list shows the\
  \ routine first probes the cutscene state's originally-saved script\n  position via `cutscene_checkOriginalCutsceneScriptPos_8036F40`\
  \ (L-message sentinel) and\n  `cutscene_checkOriginalCutsceneScriptPos_8036F58` (AskJackOut sentinel) — i.e. the\
  \ script that\n  was interrupted is the L-message or \"Ask to jack out\" cutscript, both stored at\n  `CutsceneState.originalCutsceneScriptPos_40`\
  \ (oCutsceneState + 0x40).\n\n  It then manipulates story flags through `ClearEventFlagFromImmediate` /\n  `SetEventFlagFromImmediate`\
  \ / `TestEventFlagFromImmediate` (0x2001F00-range event bit array,\n  see reqBBS_setFlag_e17b0f7_8140A00 for the\
  \ exact storage at 0x2001F68). The two named BBS\n  helpers (`reqBBS_setFlag_e17b0f7_8140A00` sets event byte\
  \ 0x17 bit 0x7, and\n  `reqBBS_clearFlag_8140A0C` clears the same bit) are the \"remember the player dismissed\
  \ the\n  L-message this frame\" / \"consume that request\" pair the routine uses to drive the\n  re-execution.\n\
  \n  Three `load_gfx_anim_*` callees (0x8083FC0/0x8083FFC/0x8084068) and three private helpers\n  (sub_8083F80,\
  \ sub_8084080, sub_8084180, sub_8084214, sub_80842D8) are dispatched to load\n  the appropriate GFX animation\
  \ state (`struct GFXAnimState` at oGFXAnimState, size 0x18) for\n  the chatbox / L-button prompt, the \"ask to\
  \ jack out\" dialog, or the regular overworld L\n  message. `struct_copy_80840C4` (in r5, no out) is a struct-to-struct\
  \ copy, and\n  `sub_809E462` returns nz, used as a \"should we run the flow now\" guard.\n\n  No assembly was\
  \ available in the lift (the asm blob is `None:None`), so the precise\n  control flow / which helper corresponds\
  \ to which branch is reconstructed from the\n  callee set; r5 is the dominant input register to most helpers,\
  \ suggesting a `r5` pointer\n  to a per-script state struct (likely a small EWRAM struct indexed off the cutscene\
  \ state).\n"
