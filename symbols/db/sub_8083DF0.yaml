name: sub_8083DF0
address: '0x08083DF0'
kind: function
previous_names: []
status: hypothesis
summary: Drives the cutscene-state → BBS-request path that handles L-Message / AskJackOut cutscenes for the player's
  PET Navi, including event-flag tests/sets and several GFX anim loads.
interface: () -> side effects only (no return value used)
details: "Takes no arguments in registers (r10 = toolkit is implicit; callee-saved only).\n  Looks at the current\
  \ cutscene script via two predicates (cutscene_checkOriginalCutsceneScriptPos_8036F40 / _8036F58) to decide which\
  \ branch to take.\n  Tests/clears/sets story event flags via TestEventFlagFromImmediate / ClearEventFlagFromImmediate\
  \ / SetEventFlagFromImmediate, and ends by triggering reqBBS_setFlag_e17b0f7_8140A00 and reqBBS_clearFlag_8140A0C.\n\
  \  Calls three load_gfx_anim_* helpers (8083FC0, 8083FFC, 8084068) and the helper sub_8083F80 plus subs 8084080/8084180/8084214/80842D8/8084080\
  \ to drive the per-state behaviour.\n  The \"[unnamed]\" sub_ calls this function makes (sub_8083F80, load_gfx_anim_*,\
  \ struct_copy_80840C4, sub_8084080/8084180/8084214/80842D8, sub_809E462) are all under this same request-BBS-state\
  \ region, supporting that this is the per-frame driver of the BBS request step.\n  Likely the \"PET/Navi cutscene-BBS\
  \ request\" step (the one that requests/show the BBS UI during a cutscene and may set event flag 0x7 in event\
  \ byte 0x17).\n"
