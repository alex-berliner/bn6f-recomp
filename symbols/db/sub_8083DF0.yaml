    so it can reach EventFlagsPtr, BattleStatePtr, ChatboxPtr, etc. - `cutscene_checkOriginalCutsceneScriptPos_*`
    callees → reacts to `CutsceneState.originalCutsceneScriptPos_40` (sectors 0x1c..0x40 of CutsceneState.inc) being
    the L-Message/AskJackOut sentinels. - `SetEventFlagFromImmediate` / `ClearEventFlagFromImmediate` / `TestEventFlagFromImmediate`
    → reads/writes the toolkit''s EventFlagsPtr at offsets implied by the immediates. - `reqBBS_setFlag_e17b0f7_8140A00`
    and `reqBBS_clearFlag_8140A0C` → sibling BBS-request handlers that mutate the same EWRAM event byte 0x17 / flag
    0x7, so this function lives in the BBS request family. - `load_gfx_anim_*` and the 0x8083xxx/0x8084xxx helpers
    cluster with BBS request work, so they are likely BBS-related init/teardown/copy helpers invoked here.'
