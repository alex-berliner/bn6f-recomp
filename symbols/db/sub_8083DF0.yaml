name: sub_8083DF0
address: '0x08083DF0'
kind: function
previous_names: []
status: hypothesis
summary: Per-frame BBS request handler for the "Navi Portraits" reward screen — checks story flags and cutscene
  markers, then draws/initiates the GFX anim state and object-portrait rendering.
interface: '() -> flags nz (caller-decides routine) ; side effects: event-flag set/clear/test on a handful of (high-byte,
  low-byte) pairs, BBS request flag 0x17/0x07 set/clear, GFXAnimState and battle/OW object structs populated via
  the load_gfx_anim_*, struct_copy_80840C4, sub_8083F80/8084080/8084180/8084214/80842D8, and sub_809E462 helpers'
details: "- The function reads only r10 (the Toolkit ptr) and lr on entry, with no r0..r3 inputs, so it is a\n \
  \   vblank/tick dispatcher driven entirely off globals (EventFlagsPtr, CutsceneStatePtr, BBS state).\n  - It reads\
  \ at least four event-flag two-byte pairs via TestEventFlagFromImmediate (configured as\n    \"Set\" or \"Clear\"\
  \ via SetEventFlagFromImmediate / ClearEventFlagFromImmediate), which based\n    on the surrounding 0x80xxxx immediate\
  \ pool are typical story-progress milestones (one of the set\n    pairs is 0x17/0x07, encoded as the BBS-request-event\
  \ writeback confirmed in\n    reqBBS_setFlag_e17b0f7_8140A00 and reqBBS_clearFlag_8140A0C).\n  - It then consults\
  \ cutscene_checkOriginalCutsceneScriptPos_8036F40 and _8036F58 to branch on whether\n    the cutscene-script sentinel\
  \ / \"AskJackOut\" marker is currently saved at oCutsceneState+0x40,\n    gating the per-frame \"did the BBS-portrait-cutscene\
  \ just start\" check (probably toggling between\n    the two portrait stages).\n  - On the active branch it invokes\
  \ load_gfx_anim_8083FC0 / _8083FFC / _8084068 to push anim scripts\n    into a GFXAnimState struct (push) and\
  \ one of these returns likely feed a load_gfx_anim index to\n    sub_8084180 — the helper that lobs data into\
  \ the OW/battle-object SpriteData region.\n  - struct_copy_80840C4 is the small \"memcpy a fixed chunk into OW\
  \ object\" glue (r5 is a struct base,\n    out list is empty because it's a void-style copier), used to copy palette/animation\
  \ tables onto\n    the portrait-OW object.\n  - sub_8083F80 (in: r0, r5, r10, lr) is the per-frame animstate pump;\
  \ sub_8084080 (in: r5, lr)\n    sets up the object/anim base record using r5 (the same base passed to the load_gfx_anim_*\
  \ chain);\n    sub_8084180, _8084214 and _80842D8 form a \"render-fanout\" trio that walks the loaded anim set\n\
  \    into ObjectSprite fields.\n  - sub_809E462 (in: r10, lr → nz) is the \"did the L-Message / AskJackOut cutscene\
  \ actually start?\"\n    detector; its nz flag is what gates whether portrait frames advance, i.e. the source\
  \ of the\n    \"anim only advances while the cutscene is showing\" behavior.\n  - On exit, nz reflects whether\
  \ the function did any drawing this tick (or equivalently which of the\n    two portrait-setup paths was taken),\
  \ and r4/r5/r7/r8/r9/r12 are the OW-object / anim-state base\n    pointers it pre-loaded, so the caller can chain\
  \ into the next BBS stage without restoring them.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Contract is in=[''r10'',''lr''] with no arg registers: consistent with a tick handler driven off the
    Toolkit, not a call-by-value function. - Three sibling load_gfx_anim_* callees at 8083FC0/8083FFC/8084068 —
    the leading 8083xxx window of this function, plus a struct_copy_80840C4 "memcpy into a local struct" callee
    — match the pattern of "load anim scripts → push into object" used by other bn6f BBS screens. - Event flag pair
    0x17/0x07 appears via the confirmed calrees reqBBS_setFlag_e17b0f7_8140A00 / reqBBS_clearFlag_8140A0C, which
    is the BBS-request event-flag writeback; the surrounding four TestEventFlagFromImmediate / Set/Clear calls are
    a gating story-progress ladder. - The two cutscene_checkOriginalCutsceneScriptPos_* callees at 8036F40/8036F58
    read oCutsceneState.originalCutsceneScriptPos_40, so this function is specifically tied to a BBS reward cutscene
    (Reward scenes in BN6 use originalCutsceneScriptPos_40 = "L-Message" / "AskJackOut" sentinels).'
