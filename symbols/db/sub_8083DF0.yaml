name: sub_8083DF0
address: '0x08083DF0'
kind: function
previous_names: []
status: hypothesis
summary: Per-frame update for the BBS request subsystem that toggles event flags and dispatches GFX animations based
  on cutscene/cutscript and BBS request state.
interface: (r10 = Toolkit) -> side effects only; no return value carried in r0 (caller restores r0). may clobber
  r0..r5
details: "- Entry reads only r10 (the toolkit), consistent with a state-update routine dispatched from the\n   \
  \ per-subsystem update table (r10 -> MainJumptableIndexPtr at +0x0 is the standard hook).\n  - It calls SetEventFlagFromImmediate,\
  \ ClearEventFlagFromImmediate and TestEventFlagFromImmediate,\n    which operate on event flag bytes in the save/event\
  \ buffer (Toolkit + 0x44, the EventFlagsPtr\n    slot). This strongly implies the function is reading/writing\
  \ one or two of the BBS/quest\n    progress event flags as part of its update.\n  - It dispatches into `sub_809E462`\
  \ which, given the in/out contract `out=['nz']` only, behaves\n    like a boolean check used as a branch input\
  \ (likely \"is BBS request X currently active?\").\n  - The two cutscene \"original script pos\" probes (`cutscene_checkOriginalCutsceneScriptPos_8036F40`\n\
  \    and `cutscene_checkOriginalCutsceneScriptPos_8036F58`) suggest the function gates work on\n    whether the\
  \ player is currently inside a specific cutscene (L-Message or AskJackOut) and\n    skips its body otherwise.\n\
  \  - It invokes a chain of `load_gfx_anim_*` helpers plus `sub_8083F80`, `sub_8084080`,\n    `sub_8084180`, `sub_8084214`,\
  \ `sub_80842D8` and `struct_copy_80840C4` (all with `r5` as\n    incoming argument), which matches the standard\
  \ pattern of a state-action dispatcher that\n    copies the next state block into the GFXAnimState struct at Toolkit\
  \ + 0x24 (CurFramePtr) and\n    fires the corresponding animation commands.\n  - It also calls `reqBBS_clearFlag_8140A0C`\
  \ and `reqBBS_setFlag_e17b0f7_8140A00` which are\n    direct BBS request mutators: one clears a flag in the BBS\
  \ request buffer and the other sets\n    event flag 0x7 in event byte 0x17 (address 0x02001F68). Together these\
  \ pin the subsystem\n    as the \"BBS request\" / \"ReqBBS\" pipeline.\n  - The contract says `in=['r10','lr']`\
  \ and `out` only lists preserved/callee-saved registers;\n    nothing is returned in r0, so this is a `void` update\
  \ hook.\n  - Exact address 0x08083DF0 sits inside the same 0x0808xxxx block as the GFX anim loaders it\n    calls\
  \ (0x08083FC0..0x08084068), so the function lives next to its own animation helpers.\n"
