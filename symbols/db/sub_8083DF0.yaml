open_questions:
- The exact high-level role of this BBS subsystem (e.g. is it the post-battle "Request BBS"
- popup, the NetCafe "Request" counter, the in-battle BBS popup, or the request counter that
- the title screen reads?). Knowing which caller sits in the per-subsystem update table and
- what `MainJumptableIndex` value triggers 0x08083DF0 would settle this.
- What event flags (which bytes) get set/cleared, and on what conditions — without the
- constants used in the Set/Clear/TestEventFlagFromImmediate calls, the precise state machine
- cannot be reconstructed.
- The role of the inner state struct (the one copied via `struct_copy_80840C4`) — whether it
- is a per-frame GFXAnimState, a per-state sprite-anim descriptor, or a sub-controller for
- the BBS popup's window — is not recoverable from the assembly stub alone.
