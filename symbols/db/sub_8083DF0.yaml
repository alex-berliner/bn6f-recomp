summary: Overworld/jack-out BBS request handler that tests L-Message / AskJackOut cutscene sentinels, clears or
  sets a story flag, refreshes the ReqBBS GUI, and loads player/navi battle graphics
interface: '(r10 = Toolkit) -> nz (caller-tested); side effects: clears or sets BBS event flags, clears/loads several
  GFX anim states, refreshes ReqBBS2001150 and eReqBBSGui, and may load a battle object set'
details: "This function is the \"master\" handler for the overworld ReqBBS subsystem jump table\n  entry 0x14 (offset\
  \ 0x14 from r10): the requester entry r10 is the toolkit (per the\n  contract). It first calls cutscene_checkOriginalCutsceneScriptPos_8036F40\
  \ and\n  cutscene_checkOriginalCutsceneScriptPos_8036F58 (both confirming \"script pointer equals\n  the L-Message\
  \ script / AskJackOut script sentinels\") and then takes an event flag byte\n  pair `(r0, r1)` and either `ClearEventFlagFromImmediate`\
  \ or `SetEventFlagFromImmediate`\n  (the immediate event flag set is in some GFX-load path: see `reqBBS_setFlag_e17b0f7_8140A00`\n\
  \  which sets bit 7 of event byte 0x17). It calls `reqBBS_clearFlag_8140A0C` (a related\n  clear handler), `sub_809E462`\
  \ (likely the ReqBBS GUI refresh), then several\n  `load_gfx_anim_8083FC0 / 8083FFC / 8084068` (sequentially walking\
  \ the GFXAnimState table\n  into / out of VRAM) and `sub_8083F80 / sub_8084080 / sub_8084180 / sub_8084214 /\n\
  \  sub_80842D8` plus `struct_copy_80840C4` — these match the typical MegaMan/PET icon BG,\n  palette, OAM and\
  \ grid loops used by the battle-side `loadPet_setUpGfxAnim_*` series.\n"
