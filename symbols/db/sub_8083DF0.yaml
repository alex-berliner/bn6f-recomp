status: hypothesis
summary: Loader/dispatcher for gfx-anim subcommands (loads gfx-anim scripts into GFXAnimState slots, reads story
  event flags, and advances a per-state step counter)
interface: '(r10 = toolkit) -> nz ; side effects: r2/r3/r4/r5/r7/r8/r9/r12 clobbered, event flags at 0x17.x tested/set/cleared,
  BBS request flag 0x17:7 manipulated, GFXAnimState entries populated via sub_8083F80/4080/4180/4214/42D8'
details: "Top-level entry of a gfx-anim \"step\" driver. After pushing r4-r9 and r12 it reads the\n  cutscene state's\
  \ `originalCutsceneScriptPos_40` and checks whether it currently\n  matches the L-Message sentinel (cutscene_checkOriginalCutsceneScriptPos_8036F40)\
  \ or\n  the AskJackOut script (cutscene_checkOriginalCutsceneScriptPos_8036F58), then\n  routes through ClearEventFlagFromImmediate\
  \ / SetEventFlagFromImmediate /\n  TestEventFlagFromImmediate on the story event byte. Event byte 0x17 bit 0x7\
  \ is\n  cleared/queried via reqBBS_setFlag_e17b0f7_8140A00 and reqBBS_clearFlag_8140A0C\n  to coordinate the BBS-request\
  \ gating used by the cutscene. The bulk of the\n  routine is a switch over a per-call step/phase byte that fans\
  \ out to gfx-anim\n  loaders (load_gfx_anim_8083FC0, .4068, .3FFC) and state-steppers\n  (sub_8083F80, sub_8084080,\
  \ sub_8084180, sub_8084214, sub_80842D8); the shared\n  struct_copy_80840C4 is the per-frame memcpy used by those\
  \ steppers. The\n  final `sub_809E462` call is the per-frame chokepoint that walks whatever the\n  loaders queued.\
  \ Returns nz as a generic \"kept running\" / per-state active\n  boolean. The assembly for the body was not located\
  \ in the ROM in this\n  project snapshot (asm listing is empty), so the ordering above is inferred\n  from callee\
  \ names and r10-as-toolkit contract.\n"
