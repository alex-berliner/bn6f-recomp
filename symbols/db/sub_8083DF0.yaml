summary: Cutscene/BBS handler that runs the big BBS-branch script flow (event-flag gates, sub_8083F80 ladder, cutscript
  sentinel checks) and ultimately exec()'s into sub_8084080 and the cutscene-step chain.
interface: () -> nz ; side effects (event flags, cutscene state, sound/animation sets)
details: "- Stored in the \"Cutscene\" / SubsystemIndex-7-ish area: r10 is the toolkit, contract in only r10/lr.\
  \ Reads/writes many of the r10-pointed global flags and probably uses sub_8083F80 (which itself reads r0, r5,\
  \ r10, lr) as the per-state dispatch.\n  - Callee set is the BBS-flavoured triad: reqBBS_clearFlag_8140A0C, reqBBS_setFlag_e17b0f7_8140A00,\
  \ plus event-flag ops (Set/Clear/TestEventFlagFromImmediate), the two cutscene sentinel checks at 8036F40/8036F58,\
  \ and the load_gfx_anim_8083FC0/FFC/068 helpers used to load BBS-related sprite sets.\n  - sub_8084080 is the\
  \ chosen \"run command\" of the BBS script (its callee contract is in=r5/lr, no caller-visible return), and sub_8083F80\
  \ appears to be the small per-instruction dispatcher it eventually jumps through; sub_8084180 / 8084214 / 80842D8\
  \ / sub_809E462 are downstream commands of the same script chain.\n  - No assembly is available in this dump so\
  \ the contract inference rests entirely on the callee fingerprint (r10-in, nz-out, BBS event-flag ops + cutscript\
  \ sentinels + the 0x80xxxx-gfx anim loaders that the rest of the module shares).\n"
