summary: Cutscene-graphics-orchestrator (reads L-Message / AskJackOut cutscene script markers, sets/clocks GFX anims
  0x8083FC0/0x8083FFC/0x08084068, and toggles event flag 0x17 bit 7 via the BBS request handlers) — placeholder
  for the scene that runs at 0x8083DF0.
interface: '(r10 = oToolkit, lr = return) -> nz flags ; side effects: event flag bit (0x17, 0x07) read/cleared/set,
  three GFX anim state slots loaded and ticked, sub_8083F80 / sub_80840C4 / sub_8084080 / sub_8084180 / sub_8084214
  / sub_80842D8 driven, sub_809E462 called'
details: "No assembly bytes were recovered for this routine (asm panel says \"sub_8083DF0 not found in\n  bn6f/asm\"\
  ) so behaviour must be inferred from its callees and the register contract.\n  Reads only r10 (=oToolkit) and\
  \ lr, so it is a top-level scene dispatched from the subsystem\n  jumptable (r10 carries the toolkit, like every\
  \ other bn6f scene). Out contract includes r4..r12\n  plus nz flags, which is consistent with a long-lived per-frame\
  \ state-machine: r5/r7/r8/r9\n  come back to the caller and are presumably re-loaded each call rather than preserved.\n\
  \  The contract `may_write=['lr']` and the absence of any out=`r0/r1` registers indicates this\n  is void-like.\n\
  \  Callee mix is unusually graphics-heavy: three \"load_gfx_anim_*\" routines (0x8083FC0, 0x8083FFC,\n  0x8084068)\
  \ plus struct_copy 0x80840C4 suggest this function orchestrates a small list of\n  GFXAnimState entries (struct\
  \ size 0x18, oGFXAnimState). It also drives six sibling helpers\n  labelled sub_8083F80 / 0x8084080 / 0x8084180\
  \ / 0x8084214 / 0x80842D8 in the same code page,\n  which read r5 as their main state pointer — that page (0x8083F80..0x8084338)\
  \ reads as a\n  mini cutscene/animation driver.\n  Two cutscene-marker probes (8036F40 \"L-Message sentinel?\"\
  , 8036F58 \"AskJackOut script?\") and\n  direct read/write of an event flag (TestEventFlagFromImmediate / ClearEventFlagFromImmediate\n\
  \  / SetEventFlagFromImmediate) imply this scene reacts to whichever L-Message / jackout script\n  is currently\
  \ queued in oCutsceneState.\n  Event-flag operating target is fixed by the confirmed callee\n  reqBBS_setFlag_e17b0f7_8140A00\
  \ (\"sets event flag 0x7 in event byte 0x17\"), with its sibling\n  reqBBS_clearFlag_8140A0C clearing it again;\
  \ this is the BBS-request-via-cutscene flow used\n  when the player agrees to jack out during an L-Message.\n\
  \  sub_809E462 (nz out) is the only call that returns a boolean check to the caller, so the\n  scene likely branches\
  \ on it once anims are loaded (e.g. wait-for-input / has-scrolled).\n  Naming is intentionally generic (\"scene/orchestrator\"\
  ) because the exact subsystem is not\n  pinned down; the absence of battle-state helpers (no oBattleStatePtr field\
  \ in the contract,\n  no battle_* callees) makes this an overworld/cutscene-side routine rather than a battle\n\
  \  routine, despite the \"battle_\" prefix candidates fitting the address layout.\n"
