summary: 'BBS request handler that drives the ReqBBS "Mystery Data" (?) flow: gates/manipulates the BBS state and
  related cutscene by testing/setting event flags, copies event-flag state, drives the local `gfx_anim_*` loader
  pipeline, and registers/clears a BBS request — all keyed off the toolkit in r10'
interface: '(no input registers; r10 = toolkit) -> nz ; side effects: writes through r10 (toolkit state, BBS request
  state, event flags, cutscene/script state, mystery-data scratch), uses r5 as a scratch pointer to a scratch state
  struct'
details: "The lifter could not locate an assembly body, so behaviour is inferred from the\n  callee list and contract\
  \ alone.\n  - Reads `r10` (Toolkit; always-this register in bn6f) on entry; preserves r4/r5/r7/r8/r9/r12 to the\
  \ caller\n    while clobbering r2/r3.\n  - Three cutscene-script-pointer probes are taken via 8036F40 / 8036F58\
  \ (these tell whether the\n    original cutscene script pointer is the \"L-Message\" or \"AskJackOut\" sentinel\
  \ scripts).\n  - Two event-flag immediates are then manipulated (Clear 802F12C and Set 802F110), and one more\n\
  \    is Tested (802F164). This is the typical pre/post pattern for a BBS-mediated story-progress\n    branch in\
  \ bn6f's request handlers.\n  - A pair of BBS request handlers is dispatched: 8140A0C (clear an event flag in\
  \ 0x2001150) and\n    8140A00 (set event flag 0x7 in byte 0x17 at 0x2001F68). Both live in the `reqBBS_*` bucket.\n\
  \  - Two gfx/anim pipelines are pumped forward: `load_gfx_anim_8083FC0`, `load_gfx_anim_8083FFC`,\n    and `load_gfx_anim_8084068`\
  \ (all `gfx_anim_*` collaborators). `struct_copy_80840C4` then\n    duplicates a small struct, and 8083F80/8084080/8084180/8084214/80842D8\
  \ form the per-frame\n    update sequence used by the loaded anims (typical \"init-then-tick\" shape: 8083F80\
  \ likely\n    inits the loader, the others tick different phases).\n  - 809E462 is a tail-call mystery helper\
  \ (its `in=['r10','lr']`, `out=['nz']` shape matches\n    a \"request completed, advance subsystem state\" wrapper\
  \ used elsewhere).\n  - A scratch buffer is reached through r5 (r5 is in the in-register list and outlives the\
  \ call),\n    with r5 unchanged across the gfx-anim helpers — strongly suggests an EWRAM scratch struct\n    passed\
  \ implicitly via r5, not part of the toolkit.\n  - Naming: I picked `reqBBS_…` because both BBS handlers are the\
  \ only true BBS-side callees; the\n    cutscene + event-flag work is consistent with a \"BBS request open/close\"\
  \ branch rather than\n    free-form script execution. The \"MysteryDataHandling\" reading is speculative — could\
  \ equally\n    be a generic \"BBS subsystem update\" loop. Worth confirming by checking what event flag the\n\
  \    Set/Test pair is touching and whether 809E462 wraps a \"request completed\" handler.\n"
