details: "Entry reads toolkit globals via r10 (standard in-pattern). It dispatches to a small block\n  of unnamed\
  \ helpers (sub_8083F80, 8084080, 8084180, 8084214, 80842D8) that all take r5 in,\n  plus a sequence of read-modify-writes\
  \ on event-flag bytes. Surrounding that, it queries\n  cutscene state with cutscene_checkOriginalCutsceneScriptPos_8036F40\
  \ and _8036F58, sets\n  flag 0x7 of event byte 0x17 via reqBBS_setFlag_e17b0f7_8140A00, clears a BBS request flag\n\
  \  with reqBBS_clearFlag_8140A0C, and triggers three GFX anim drivers\n  (load_gfx_anim_8083FC0 / 8083FFC / 8084068).\
  \ The struct_copy_80840C4 likely moves a\n  small fixed data block; sub_809E462 is a thin glue callback. No assembly\
  \ was supplied, so\n  the exact order/cases of these calls cannot be pinpointed beyond \"this function owns\n\
  \  the orchestration\".\n  Contract: `out` lists only nz plus the callee-saved registers (r2,r3,r4,r5,r7,r8,r9,r12)\n\
  \  that the caller reloads itself; nothing is returned to the caller in r0/r1, so this is\n  effectively a void\
  \ cutscene-stage function from the toolkit dispatcher.\n"
