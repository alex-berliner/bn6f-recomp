  \ and parameterize\n  one or more GFX animations tied to the cutscene step, and ends in sub_809E462 (a generic\
  \ test helper).\n  Several callees take r5 as an opaque per-frame buffer pointer; the function appears to be the\n\
  \  per-VBlank cutscene tick driver invoked while CutsceneState.TextArchivePtr is active.\n"
