summary: Cutscene-time handler that tests event flags then drives GFX anims and request-BBS flag updates for a BBS
  request screen
interface: (r10 = Toolkit ptr) -> side effects only; no return value to callers
details: "The function lives in a cutscene/render region (callees take g/rn, see Toolkit at r10). It branches on\n\
  \  TestEventFlagFromImmediate to gate which branch it takes; the two cutscene_checkOriginalCutsceneScriptPos_*\n\
  \  helpers at 0x8036f40/0x8036f58 inspect the saved original cutscene script pointer to detect the L-Message\n\
  \  and AskJackOut sentinels, deciding whether to display the request BBS screen or jack-out animation.\n  Sets/Clears\
  \ immediate event flags via Set/ClearEventFlagFromImmediate to mutate story progress, and calls\n  reqBBS_setFlag_e17b0f7_8140A00\
  \ / reqBBS_clearFlag_8140A0C to flip the corresponding event-byte flag.\n  Drives GFX anim updates by calling\
  \ the load_gfx_anim_8083FC0 / 8083FFC / 8084068 / 8084080 / sub_8083F80 /\n  struct_copy_80840C4 / sub_8084180\
  \ / sub_8084214 / sub_80842D8 chain and finally sub_809E462 (unnamed BBS\n  draw step). Touches the BBS request\
  \ subsystem (event byte 0x17 at 0x2001F68), cutscene state (script\n  pos at 0x40), and an OAM/GFX anim state\
  \ struct.\n  No callers listed in route coverage, suggesting it is itself a state-handler called from a jumptable\n\
  \  entry tied to cutscene state / BBS request display.\n"
