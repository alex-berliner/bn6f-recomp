name: sub_8083DF0
address: '0x08083DF0'
kind: function
previous_names: []
status: hypothesis
summary: Battle graphics/animation loader that toggles several event flags (BBS request flag 0x7, AskJackOut/L-Message
  sentinels, etc.) and dispatches to multiple `load_gfx_anim_*` helpers
interface: '() -> nz ; r2/r3/r4/r5/r7/r8/r9/r12 callee-saved; side effects: GFXAnimState slots and story event flags'
details: "- The function takes no explicit args in r0..r3; everything goes through r10 (the toolkit) plus a few\
  \ high registers (r5..r9, r12). It pushes r4-r9 and r12 in addition to r10, so it is a fairly heavy \"orchestrator\"\
  \ stub.\n  - Direct calls include the event-flag triplet (Set/Clear/TestEventFlagFromImmediate), both `cutscene_checkOriginalCutsceneScriptPos_*`\
  \ helpers, the BBS flag setters/clears, and six helper functions all sharing the `load_gfx_anim_*` / `sub_8083F80..`\
  \ / `struct_copy_80840C4` naming band (0x8083F80..0x80842D8). The handful of nearby `load_gfx_anim_*` callees\
  \ strongly suggests this is a battle boot phase that loads/copies several GFXAnim slots and possibly toggles the\
  \ AskJackOut/L-Message sentinels that gate the cutscene-resume path.\n  - It is `void`-like on the contract (`out`\
  \ only contains callee-saved regs + `nz` for the linker's BL dispatch); nothing meaningful is returned to callers.\n\
  \  - The assembly itself is missing (\"sub_8083DF0 not found in bn6f/asm\") so we cannot verify the exact sequence;\
  \ the naming is derived from callee patterns only.\n"
