  `8083FFC`, `8084068`) plus `sub_8084080`, `sub_8084180`, `sub_8084214`, `sub_80842D8` and `struct_copy_80840C4`
  suggest this function runs once per VBlank to step an animated overlay/effect, possibly a job-results / PET-status
  overlay given the BBS request hook.

