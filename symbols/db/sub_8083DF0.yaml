summary: BBS request dispatcher that reads/clauses the request entry, asks the cutscene engine which script sent
  it, and routes to the appropriate per-request handler (set/clear flag, NSF animation loaders, set-event-flag helpers).
interface: (r10 = eToolkit ptr, lr = return) -> flags nz ; side effects on r0-r9/r12, EWRAM via r10, calls a chain
  of subsystem helpers
details: "- Standalone function body is missing from the lifted asm (`sub_8083DF0 not found in bn6f/asm`).\n  -\
  \ The caller/callee graph shows it switches on the BBS request slot's index field (likely oReqBBS2001150.Unk_04\
  \ / Unk_28) and dispatches:\n      * reqBBS_setFlag_e17b0f7_8140A00 (set event-flag 0x7 of byte 0x17) for one\
  \ branch.\n      * reqBBS_clearFlag_8140A0C (clear the matching event flag) as its complement.\n      * load_gfx_anim_8083FC0\
  \ / load_gfx_anim_8083FFC / load_gfx_anim_8084068 plus struct_copy_80840C4 / sub_8083F80 / sub_8084080 / sub_8084180\
  \ / sub_8084214 / sub_80842D8 for graphical request slots (likely NSF/avatar-loading BBS requests).\n  - cutscene_checkOriginalCutsceneScriptPos_8036F40\
  \ and cutscene_checkOriginalCutsceneScriptPos_8036F58 are consulted to decide whether the originating cutscene\
  \ script is the L-Message or \"AskJackOut\" sentinel; their nz result likely steers which gfx/anim helper is invoked.\n\
  \  - sub_809E462 is invoked as another branch terminator (probably a \"default/no-op\" handler).\n  - Reads/writes\
  \ std event flags via SetEventFlagFromImmediate / ClearEventFlagFromImmediate / TestEventFlagFromImmediate; those\
  \ routines gate on the byte id and bit id passed in r0/r1.\n  - The contract writes `nz`, so the boolean decision\
  \ (which branch was taken, or whether a flag was set/cleared) propagates to the caller — typical of a BBS state-machine\
  \ hander returning \"handled yes/no\" to the BBS subsystem dispatcher.\n"
