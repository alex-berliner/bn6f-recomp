    and 8036F58 ("AskJackOut sentinel") show this routine gates on whether the current cutscene is the L-Message/Beast-Out
    entry script. - Multiple Set/Clear/TestEventFlagFromImmediate calls and the load_gfx_anim helpers imply it both
    flips story flags AND queues animation loading — i.e. it is the per-frame "apply beast-out" pump. - sub_809E462
