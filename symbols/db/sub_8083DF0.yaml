  \ sentinels (`cutscene_checkOriginalCutsceneScriptPos_8036F40` / `_8036F58`) — strongly implies an\n  L-button\
  \ / \"AskJackOut\" / pet-jack-out flow; (b) `SetEventFlagFromImmediate` / `ClearEventFlagFromImmediate`\n  / `TestEventFlagFromImmediate`\
  \ with r10 — the standard flag-mutate triplet on the toolkit's\n  EventFlagsPtr; (c) `reqBBS_setFlag_e17b0f7_8140A00`\
  \ and `reqBBS_clearFlag_8140A0C` — other BBS request\n  handlers, confirming this sits in the BBS-request family;\
  \ (d) `load_gfx_anim_8083FC0`/`_8083FFC`/\n  `_8084068` and `sub_8083F80`/`sub_8084080`/`sub_8084180`/`sub_8084214`/`sub_80842D8`/`struct_copy_80840C4`\n\
  \  — sibling helpers in the 0x8083xxx..0x8084xxx range, almost certainly the BBS-related battle state\n  init/update/copy\
  \ subroutines; (e) `sub_809E462` — generic helper. The function takes no input register\n  and returns no output,\
  \ so it is void-like.\n"
