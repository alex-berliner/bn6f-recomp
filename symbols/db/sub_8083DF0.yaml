    confirm event-flag mutation is part of the routine. - Calls to `cutscene_checkOriginalCutsceneScriptPos_8036F40`
    (L-Message sentinel) and `cutscene_checkOriginalCutsceneScriptPos_8036F58` (AskJackOut sentinel) confirm it
    consults/toggles cutscene state too. - No captured calls or assembly, so any more specific role is unverified.'
