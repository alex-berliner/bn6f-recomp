name: sub_8083DF0
address: '0x08083DF0'
kind: function
previous_names: []
status: hypothesis
summary: Drives cutscene GFX/anim loading and event-flag toggling (BBS flag 0x17/0x7) when the cutscene state's
  originally-saved script was a sentinel cutscript.
interface: (in = r10 = ToolkitPtr, lr = ret addr) -> nz flags (loop-control condition); preserves r4-r9, r12 through
  callees; r0-r3 clobbered
details: "Entry takes the ToolkitPtr in r10 and a return address in lr (Thumb callee). The body\n  is a single block\
  \ of more than a dozen `bl`/`b` calls with no assembly available in\n  the prompt, so all behaviour must be inferred\
  \ from the callee set and the contract:\n  - First probes the cutscene state's saved original script pointer via\
  \ both\n    cutscene_checkOriginalCutsceneScriptPos_8036F40 (\"L-Message\" sentinel) and\n    cutscene_checkOriginalCutsceneScriptPos_8036F58\
  \ (\"AskJackOut\" sentinel), then\n    picks a branch (the function emits `nz` per the contract, suggesting it\
  \ gates\n    further work on which sentinel matched).\n  - Sets/clears/tests event flags through ClearEventFlagFromImmediate\
  \ /\n    SetEventFlagFromImmediate / TestEventFlagFromImmediate, plus the BBS\n    request layer `reqBBS_setFlag_e17b0f7_8140A00`\
  \ (event byte 0x17, bit 0x7) and\n    `reqBBS_clearFlag_8140A0C`.\n  - Sequences GFX/animation commands through\
  \ `load_gfx_anim_8083FC0`,\n    `load_gfx_anim_8083FFC`, `load_gfx_anim_8084068`, plus helpers\n    `sub_8083F80\
  \ / sub_8084080 / sub_8084180 / sub_8084214 / sub_80842D8` and the\n    `struct_copy_80840C4` helper.\n  - Ends\
  \ by re-tests the sentinel and falls through.\n  - Returns condition codes only (callee-saved r4-r9, r12 written\
  \ back); no r0/r1 result\n    is exposed to the caller - it is a void-like worker whose exit `nz` simply tells\n\
  \    upstream call sites whether the script-sentinel condition held.\n  - Pattern (flag ops + multiple gfx/anim\
  \ bls + script-pointer checks + BBS updates) is\n    consistent with an \"advance the cutscene player's anim pipeline\
  \ after a sentinel\n    cutscript\" routine in an overlay.\n"
