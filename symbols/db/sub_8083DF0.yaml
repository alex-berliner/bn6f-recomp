name: sub_8083DF0
address: '0x08083DF0'
kind: function
previous_names: []
status: hypothesis
summary: Initializes/refreshes a beast-out related battle object (loads gfx anims, manages event flags and cutscene-script
  sentinels) and writes into the battle object's AIData/extras; result is a void-like side-effect call used by beast-out
  AI processing.
interface: (r10 = Toolkit) ; side effects on battle object in r5, BBS request flags, event flags 0x17[7] / 0x17[?],
  and several EWRAM-backed data slots
details: "The block sits in the 0x8083xxx range together with the other beast-out related helpers (load_gfx_anim_8083FC0,\
  \ load_gfx_anim_8083FFC, sub_8083F80, struct_copy_80840C4, sub_8084080, sub_8084180, sub_8084214, sub_80842D8)\
  \ and is described by the lifter as a leaf-ish routine that preserves r10/lr but is allowed to trash r2/r3/r4/r5/r7/r8/r9/r12\
  \ and the flags.\n  Inputs/uses: r10 (Toolkit) provides BattleStatePtr/ChatboxPtr/CutsceneStatePtr/ReqBBS pointers\
  \ etc., and r5 points at a BattleObject whose BeastOut/CustStyle extras live behind ExtraVars. The routine ends\
  \ up driving non-trivial state changes through the chain: reqBBS_setFlag_e17b0f7_8140A00 (BBS that flips event\
  \ byte 0x17 bit 7), reqBBS_clearFlag_8140A0C (paired clear), TestEventFlagFromImmediate / SetEventFlagFromImmediate\
  \ / ClearEventFlagFromImmediate on adjacent story flags, and the two cutscene-state sentinels 8036F40 / 8036F58\
  \ (\"L-Message\" and \"AskJackOut\"). GFX side: it pulls in three load_gfx_anim_* helpers (8083FC0, 8083FFC, 8084068)\
  \ plus a struct_copy_80840C4 and several sub_8084* mutators, which together is the typical shape of \"load anim\
  \ scripts for the beast-out animation, then patch the object's AIData/anim/extra vars\".\n  Output: nothing is\
  \ returned to callers (out only lists r4–r9/r12/lr callee-saves — none of r0..r3/NZ are promised to callers),\
  \ so treat it as `void`. The contract marking `nz` means it tests one of the event/cutscene flags and may branch\
  \ on the result, but it does not surface that branch to the caller beyond the function's own internal flow.\n\
  \  Because both arms (set + clear) of the BBS flag handlers and both cutscene sentinels are queried, this looks\
  \ like the beast-out entry/exit dispatcher: pick a flag, do the cutscene sentinel check, then either run the \"\
  entering\" path (load anim, copy struct, push sub_8084180/4214/42D8) or the \"exiting\" path (clear flag, run\
  \ sub_8083F80 reverse path). sub_809E462 is the lone unrelated callee — it returns NZ (likely a \"menu/screen\
  \ open\" probe) whose value steers which branch is taken.\n  Naming is kept tentative because the assembly listing\
  \ was lost (`sub_8083DF0 not found in bn6f/asm`), so the exact decision tree (set flag vs clear flag, which flag\
  \ pair is the trigger, and the precise object field it writes via struct_copy_80840C4) is inferred from callee\
  \ behaviour.\n"
