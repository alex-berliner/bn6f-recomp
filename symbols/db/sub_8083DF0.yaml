    event flag at `(0x17, 7)` — exactly the kind of state this handler refreshes. - Three near-adjacent `load_gfx_anim_*`
    callees (8083FC0 / 8083FFC / 8084068) plus five `sub_8083F80 / 8084080 / 8084180 / 8084214 / 80842D8` calls
    match a "set up BG + anim + copy + finalise" sequence used elsewhere by jack-out / battle-init. - `struct_copy_80840C4`
    accepts `r5` and writes `r0/r1` only — characteristic of a small `memcpy` between two GFX-anim related buffers.
    - `sub_809E462` returning NZ (and matching the size of the ReqBBSGui struct in'
