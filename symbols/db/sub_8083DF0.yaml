summary: Cutscene submode driver for the JackOut / BBS-request selection step (advances sub-state, loads GFX anims,
  manages event flags and call-script pointers)
interface: 'in=(r10 = ToolkitPtr) ; side effects: scratch regs r0-r6, r12, lr; nz clobbered; calls into cutscene/event-flag/gfx-anim/BBS
  helpers'
details: "- The contract takes r10 (Toolkit) and lr; everything else is local. It clobbers all scratch regs and\
  \ a lot of callee-saved-looking locals (r2-r5, r7-r9, r12) but the lifetime is internal - the function effectively\
  \ returns `void`-style (only `nz` flag and caller-saves for tail state).\n  - It dispatches via three cutscene-script-position\
  \ checks (`cutscene_checkOriginalCutsceneScriptPos_8036F40` for L-Message sentinel, `cutscene_checkOriginalCutsceneScriptPos_8036F58`\
  \ for \"AskJackOut\") plus a third condition handled by `sub_809E462`, branching into one of three sub-mode paths.\n\
  \  - On the AskJackOut / BBS path it sets/clears event flag 0x7 in event byte 0x17 (`reqBBS_setFlag_e17b0f7_8140A00`\
  \ / `reqBBS_clearFlag_8140A0C`) and the immediate two-byte event-flag helpers (`SetEventFlagFromImmediate` / `ClearEventFlagFromImmediate`\
  \ / `TestEventFlagFromImmediate`).\n  - It drives GFX anim loading: `load_gfx_anim_8083FC0`, `load_gfx_anim_8083FFC`,\
  \ `load_gfx_anim_8084068`, plus `sub_8083F80` (anim init using `r0 + r5` shape), `sub_8084080` (anim per-frame?),\
  \ `struct_copy_80840C4` (struct copy), and the heavier helpers `sub_8084180` / `sub_8084214` / `sub_80842D8` that\
  \ look like choice-result and BBS-row updaters.\n  - No assembly text was provided in the prompt, so the precise\
  \ internal control flow (jump table offsets, struct addresses) cannot be cited.\n"
