name: ow_spawnObjectFromConfig_80A9B9C
address: '0x080A9B9C'
kind: function
status: confirmed
summary: Brings a freshly spawned overworld object live — resolves its spawn/event flags, loads and configures
  its sprite from its spawn-config table entry, and marks it active.
interface: void sub_80A9B9C(u32 obj /* r5 */, u32 cfg /* r7 */); // r6 holds the object's saved z across
  the priority fallback; clobbers r6 and returns whatever sub_80A9C26 leaves in r0-r3 and the flags
details: 'Overworld-object spawn handler operating on two structures passed in registers: r5 = the object''s
  state block, r7 = its spawn-config table entry. Steps: sets obj->state (+0) to 3 ("spawning") and zeroes
  the object''s timer/counter at +0x24. Then it branches on the event flag at cfg+0 (via TestEventFlag):
  if the flag is already set — a repeat spawn — it sets the flag at cfg+2 and clears the companion flag
  at cfg+4; if not set — first spawn — it parks the object in state 1 instead and only clears the cfg+2
  flag (this path never spawns the visible object). Next it loads the object''s sprite with sprite_load(0x80,
  cfg+6 resource, cfg+7 sprite index). If the priority byte at cfg+0xC is 0xFF, the priority is derived
  from position: the object''s z field (+0x14) is saved, checkZCoordModifiers_8031612''s result is stored
  there shifted left 16, applyLayerEffectToOWObject_8035694 computes the priority from obj+0xC, and the
  original z is restored; otherwise the cfg byte is used directly and passed to sprite_setPriority_8002E14.
  Remaining sprite setup from the config: animation index (+8) via sprite_setAnimation plus sprite_loadAnimationData,
  shadow disabled (sprite_noShadow), the byte at +0xA shifted left 24 into sprite_setUnk0x2c, palette
  at +0xB, and flip at +0xD. Finally the object''s sub-state at +8 is set to 4 (active) and sub_80A9C26
  is tail-called to finish initialisation.

  '
