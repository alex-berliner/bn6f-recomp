name: sub_8010D58
address: '0x08010D58'
kind: function
status: confirmed
summary: Dispatcher over a 5-entry handler table (ids 0-4); an id of 0xFF, or one flagged by the validator, is rejected
  and returns 0xFFFF instead of running a handler.
interface: int dispatchHandlerById(int id /*r0*/, ... /*r2, r3 passed through to handler*/); returns handler's r0/r1
  with r4 = 0, or 0xFFFF on rejection; r6 preserved
details: 'Small indirect-call dispatcher. The id in r0 is shifted left by 2 into r6 (offset into the table at off_8010D84).
  If the id is 0xFF the function returns 0xFFFF immediately without touching anything. Otherwise it calls sub_800F4A8
  with the id: if the result is >= 1 the id is "already taken/ active" — it then calls sub_800F4B2 with r0 = 1 (apparently
  recording or clearing that state) and returns 0xFFFF as a "no handler ran" marker. If the result is < 1, the id
  is valid and the handler at off_8010D84[id] (sub_8010D98, sub_8010DA2, sub_8010DAC, sub_8010DB6, sub_8010DC0)
  is entered via the classic `ldr r0,[r1,r6]; mov lr,pc; bx r0` sequence, so the handler sees r0 = its own thumb
  address, r1 = table base, r6 = id*4, and r2/r3 passed through as arguments. On this path the function clears r4
  before returning, and the caller receives whatever the handler left in r0/r1. r6 is saved/restored around the
  whole thing.

  '
