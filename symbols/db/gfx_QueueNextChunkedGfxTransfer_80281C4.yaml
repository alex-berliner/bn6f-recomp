name: gfx_QueueNextChunkedGfxTransfer_80281C4
address: '0x080281C4'
kind: function
status: confirmed
summary: Queues one 0x80-byte chunk of a graphics DMA transfer, using a helper to set up the next source/destination
  pair.
interface: gfx_QueueNextChunkedGfxTransfer(u32 src /*r0*/, u32 dest /*r1*/, ... /*r3 = context for sub_80281A8*/)
  -> u32 /*r1 = dest + 0x80*/; preserves r2-r7
details: 'This is one step of a chunked graphics upload. It first calls sub_80281A8,

  which is responsible for producing the actual source (r0) and destination

  (r1) pointers for the next chunk (r3 is passed through as its context).

  It then calls QueueEightWordAlignedGFXTransfer with r2 = 0x80, i.e. it

  queues a transfer of exactly 0x80 bytes into the queue, and finally

  advances r1 (the destination pointer) by 0x80 so a repeated call streams

  the destination forward chunk by chunk. r2 and r3 are saved on the stack

  and restored on return (push {r2,r3,lr} / pop {r2,r3,pc}), so callers see

  r2-r7 unchanged; r0 and the flags are clobbered, and the function returns

  the advanced destination pointer in r1. The 0x80 size and eight-word

  alignment suggest this is the inner loop of a larger VRAM/OAM/palette

  streaming routine, with sub_80281A8 handling per-chunk bookkeeping

  (possibly alternating buffers or computing the next bank).

  '
