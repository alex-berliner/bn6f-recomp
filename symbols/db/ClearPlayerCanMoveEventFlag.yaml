name: ClearPlayerCanMoveEventFlag
address: '0x0809E0A4'
kind: function
status: confirmed
summary: Clears the event-work flag that gates whether the player is allowed to move, disabling player input movement
  until it is set again.
interface: 'void ClearPlayerCanMoveEventFlag(void) // in: lr (via r10 base for flag work area); out: r0, r1, r3,
  nz/c/v per ClearEventFlagFromImmediate'
details: Clears the single "player can move" event flag (EVENT_PLAYER_CAN_MOVE, flag word 0x17, bit 0x14) in the
  event flag work area at 0x2001c88; the bit lives at byte address 0x2001f6a. It is a thin wrapper that loads the
  flag word index and bit index and tail-calls the generic ClearEventFlagFromImmediate helper, which does the actual
  test-and-clear and defines the register/flag outputs. Tail-call via pop {pc} means lr is consumed and not preserved.
  This flag is presumably set elsewhere to allow movement during event cutscenes and cleared here when control should
  be taken away (or vice versa depending on polarity at set sites).
