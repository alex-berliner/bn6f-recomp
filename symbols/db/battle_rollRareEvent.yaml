name: battle_rollRareEvent
address: '0x0801C4AE'
kind: function
status: probable
summary: 'At battle setup, rolls the battle RNG for a rare event: stores a scaled random halfword in the
  battle state, and on the rare hit sets battle flag 0x2 and plays sound 0x8F.'
interface: (r5 = battle state struct) -> writes halfword at [r5+0x20]; may set battle flag bit 1 via battle_setFlags;
  r0 clobbered
details: Reads the battle state flags halfword and bails out early if bit 0x2 is already set, so the roll
  happens at most once per battle. Calls sub_800A70C (unidentified, almost certainly the battle RNG rand),
  multiplies the result by 0x4000 and uses GBA BIOS svc 6 (Div) by 0x2D0 (720), scaling the random number
  into roughly [0,0x4000]. The halfword result is stored at [r5+0x20] of the battle state struct. If the
  scaled value comes out exactly 0x4000, it ORs flag bit 0x2 into the battle flags and plays sound effect
  0x8F — a rare-event check (mystery data / bonus appearance style), with the exact trigger odds depending
  on the range of sub_800A70C's return value.
