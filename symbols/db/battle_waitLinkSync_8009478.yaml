name: battle_waitLinkSync_8009478
address: '0x08009478'
kind: function
status: confirmed
summary: Link-battle sync wait state handler — waits until both linked GBA systems report the same tracked ID (or
  a ~3 s timeout) before letting the battle advance.
interface: void battle_waitLinkSync(battleState *state /* r5 */) // called with r4-r7,r10 live; returns flags nz/c/v
  and r0 = 4 (init/match paths), incremented frame counter, or 0xC (timeout) as side effects of the tail dispatch
details: 'Per-frame handler for one state of the battle state machine; the state struct pointer

  arrives in r5 and fields are accessed at fixed offsets: oBattleState_Index_00 (+0,

  next handler index), Unk_02_03 (+2, halfword result/status), Unk_03 (+3, byte

  sub-state), Unk_28 (+0x28, halfword frame timer).

  First entry (state+3 == 0): calls sub_800B428 to (re)initialize the link tracked-ID

  checker, clears the timer at +0x28, sets the sub-state byte to 4, and returns r0=4.

  After that: loads constant 0x1F2F3F4F (the "both sides tracked ID" magic selector)

  and calls battle_doBothTrackedIdsMatch_800B46C. If both sides match, it tears the

  tracker down via sub_800B460/sub_800B444, stores 4 into the halfword at +2 as the

  "sync complete" result, and returns r0=4.

  While unmatched it increments the frame counter at +0x28; once it exceeds 0xB4

  (180 frames, ~3 seconds) it writes 0xC into the state index at +0, forcing the

  battle state machine to move on even if the link peers never agreed (comment in

  disassembly notes the switch happens via battle_main_8007800 dispatch).

  r0/r1/r2/r3 and flags are whatever the dispatch machinery expects afterwards; r5

  is preserved.

  '
