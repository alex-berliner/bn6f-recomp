name: sprite_copyGlyphTiles3x14
address: '0x0813808C'
kind: function
status: probable
summary: Blits a fixed 3x14 block of tiles from a tile-id list into BG tile block 2, as the draw step
  of glyph rendering.
interface: (r0 = dest tile j, r1 = dest tile i, r2 = *tile_ids u16) -> void; r3-r5 repurposed as CopyBackgroundTiles
  args (tile block 2, size 3, size 14)
details: 'Wrapper: moves the incoming tile-id pointer to r3, sets which_tile_block_32x32=2, j_size=3,
  i_size=0xE (14), and tail-calls CopyBackgroundTiles unchanged on r0/r1. So callers address a position
  inside BG tile block 2 and supply a 42-entry tile id buffer; the routine writes a 3-wide by 14-tall
  region there. No state of its own beyond saving r4-r7 for the ABI. The fixed 3x14 shape and the sole
  caller sprite_renderCharGlyph indicate it''s the blit half of glyph rendering — the glyph lookup produces
  tile ids, this copies them to the background.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r3,r2 / mov r2,#2 / mov r4,#3 / mov r5,#0xe directly set up the documented CopyBackgroundTiles
    signature; bl CopyBackgroundTiles with r0,r1 untouched: pure positional wrapper, no other logic; sole
    caller sprite_renderCharGlyph ''rebuilds [sprite buffer] from a single character code'', so the tile
    ids come from glyph lookup'
  refs:
  - bn6f/asm/asm36.s:16952
  - 0x08137F5C sprite_renderCharGlyph
  - 0x080018C2 CopyBackgroundTiles
  reproduce: python3 tools/asmcat.py 0x0813808C
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
