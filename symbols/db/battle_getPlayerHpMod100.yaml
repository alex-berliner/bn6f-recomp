name: battle_getPlayerHpMod100
address: '0x08010BF0'
kind: function
status: probable
summary: Returns the current player's HP modulo 100 (low two digits).
interface: (r0 = ?, r1 = alliance flag passed to battle_findPlayer) -> r0 = playerHP % 100; r1 = remainder
  clobbered
details: The function forwards its argument (an alliance flag) to battle_findPlayer to fetch the player's
  BattleObject, returning 0 if none exists. It loads oBattleObject_HP, sets r1 = 0x64 (100), and issues
  svc 6, the BIOS Div routine, which puts quotient in r0 and remainder in r1. It then copies r1 into r0,
  so the return value is HP % 100, not the quotient. Likely used for two-digit HP displays or HP-digit
  breakup; the identity of r0 on entry is unknown since it is overwritten before the call.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_findPlayer with r0 = r1: fetches the player BattleObject by alliance flag; ldrh r0,
    [r0,#oBattleObject_HP]: reads the player''s HP field; mov r1, #0x64 ; svc 6: BIOS Div, HP divided
    by 100; mov r0, r1 after svc: keeps the remainder (HP % 100) as the return value; tst r0,r0 / beq:
    returns 0 when no player object is found'
  refs:
  - bn6f/asm/asm00_2.s:4547
  - 0x080103BC battle_findPlayer
  reproduce: python3 tools/asmcat.py 0x08010BF0
