name: CutsceneCmd_set_or_clear_chatbox_flags
address: '0x08037A7C'
kind: function
status: confirmed
summary: Cutscene/map-script opcode that sets or clears a chatbox flag bit in eFlags2009F38 from a 3-byte argument
  (2-byte flag id + 1-byte mode).
interface: 'u32 chatbox_setClearFlag_cutsceneCommand_8037A7C(u32 scriptPtr /*r7*/); /* returns 1 in r0, advances
  r7 by 3, leaves flag id in r0, set/clear mode in r4; clobbers r0 r6 lr; flags: nz=cv preserved */ // internal:
  reads two script bytes (r6=2 then r6=1 via ReadMapScriptByte -> r4), and if mode==1 calls chatbox_clear_eFlags2009F38(flag_id)
  else chatbox_set_eFlags2009F38(flag_id).'
details: 'Invoked as a map/cutscene script command. The script cursor in r7 points at a 3-byte payload: a 2-byte
  little-endian chatbox flag id followed by a 1-byte mode. ReadMapScriptByte is called twice with r6=2 then r6=1
  (the width in bytes); each call leaves the read byte in r4 and preserves r0-r2 and r7. The assembly then copies
  r4 into r0 before the second read so the flag id survives into the chatbox call.

  The mode byte selects the operation: value 1 clears the flag via chatbox_clear_eFlags2009F38, anything else (typically
  0) sets it via chatbox_set_eFlags2009F38. Both helpers take the flag id in r0 and operate on the chatbox state
  struct at 0x02009F38.

  Afterwards r7 is advanced by 3 bytes (so the caller''s script loop moves to the next opcode) and r0 is forced
  to 1, which the cutscene dispatcher uses to indicate "command consumed / keep going". The summary in the readable
  C describing outputs as "nz r1 r2 r4 r7" reflects the fact that r1, r2 and r7 are preserved across the function
  while r4 holds the mode and the nz flags reflect r0=1.

  Quirks: the compare-and-branch is `cmp r4, #1; beq .clearChatboxFlags`, so only an exact 1 clears; all other values
  fall through to set. The "add r7, #3; mov r0, #1" tail sets the documented flag pattern (c/v from the add, n/z
  from r0=1).

  '
