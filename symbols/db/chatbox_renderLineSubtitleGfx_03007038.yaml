open_questions:
- Exact semantics of `unk_200BEA0` (slot-table-of-pointers vs. array-of-records) and whether `byte_8043CA4`
  is panel-x in tiles or half-pixels. The function's precise chatbox phase ("open", "scroll", "render
  lines") isn't pinpointed — it could also serve battle-floating-text, which uses 12-tile lines too. Naming
  uses `_ADDRESS` suffix because only one of these roles is certain.
