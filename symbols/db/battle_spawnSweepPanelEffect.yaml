name: battle_spawnSweepPanelEffect
address: '0x0810B244'
kind: function
status: probable
summary: 'Part of an AI attack routine: if the attack-scratch variable is set, spawns a type-0 effect
  object at the object''s future panel and initializes the AI attack state (charge cycles and hit element).'
interface: (r5 = battle object, r7 = AI attack-vars struct) -> r0 = spawned effect object or undefined;
  no flags of interest
details: First calls sub_810AF30 (unknown helper, likely part of the same AI attack setup). If the AIAttackVars
  scratch var at [r7+oAIAttackVars_ScratchVar] is nonzero, it reads the object's FuturePanelX/Y, converts
  them to fixed-point screen coordinates via object_getCoordinatesForPanels, and spawns an effect-type-0
  battle object there (spawn_t1_0x0_EffectObject with x/y in r0-r2, r3=0x100000, r4=0x15). It then stores
  3 into oAIAttackVars_ChargeCycles and 0xC into oAIAttackVars_HitElement, setting up the charge timer
  and hit element for the attack that follows. The scratch-var gate means the effect/state setup only
  happens on a specific pass through the caller's attack state machine.
