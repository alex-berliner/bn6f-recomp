name: sub_8028476
address: '0x08028476'
kind: function
status: confirmed
summary: For a battle object, look up the side's active-chip entry and dispatch on its kind byte to the matching
  handler (chip activation, beast-out palette GFX, or one of several chip-side effects).
interface: '// void sub_8028476(u32 r5_battleObject)

  //   reads r2 r3 r5 r6 r8 r9 r10 r11 r12 lr as inputs, ignores them

  //   writes r1 r2 r3 r4 r5 r6 r7 r8 r9 r10 r11 r12 lr as outputs (whichever callees leave behind)

  //   clobbers N Z C V and r0

  //   preserves r4, r7

  //   uses r5 as the battle object pointer and reads its side byte at +7

  '
details: "- Reads battle object's \"side\" byte (offset +7) and asks getLocOfActiveChips_8027E1C\n  to return the\
  \ active-chip record for that side.\n- The record's first byte (`ACTIVE_REC_KIND`, offset 0) is the dispatch key\n\
  \  and is also loaded into r1, which is why r1 is an output register even when\n  no handler runs.\n- Dispatch\
  \ table (kind -> handler):\n    0: load raw id from [rec+8] (u16), resolve to chip id via getChipID_802A54E,\n\
  \       then call sub_80284E2 (real chip activation).\n    1: sub_80286D4 (named beastout_QueuePaletteGFXAndSheets_80286D4\
  \ - BeastOut palette/GFX/sheet setup).\n    2: sub_802871C.\n    3: sub_8028754.\n    4 or 5: sub_80287A4.\n \
  \   6 or 7: load raw id from [rec+8] (u16) and call sub_80285FE (raw id passed unresolved).\n    8 or 9: sub_802877C.\n\
  \    default (incl. any unhandled kind): falls through, nothing runs, r1 still carries the kind byte.\n- Only\
  \ the kind 0 and 6/7 branches consume the [rec+8] chip-id pointer; every other\n  branch just takes the record\
  \ pointer itself.\n- No explicit local state; this is pure dispatch - all \"output\" registers and\n  flags come\
  \ from the callees it tail-calls.\n"
