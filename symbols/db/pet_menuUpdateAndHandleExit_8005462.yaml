status: probable
summary: 'Per-frame main state handler of the PET menu subsystem (game state 0x18): runs the PET scene
  pipeline each tick and handles the exit modes - fade-out back to main state 0x28, or the final return
  to the overworld.'
interface: 'void pet_menuUpdateAndHandleExit(u32 r5 /* GameState */) : r5 -> [r4 r5 r6 r8 r9 r10 r11 r12]
  (captured exits r0 = 0)'
details: 'One-time gate: when ePETMenuData byte 0x8 (byte_200DF28) is 0 it stores 1 and calls sub_811EC50
  (the subsystem''s five-step init) before the first frame. Every frame it runs the PET pipeline in fixed
  order: dispatch_80339CC, sub_80039AA, sub_8003AFA, sub_80027B4, sub_800286C, sub_8003BF4, sub_8003E98,
  npc_drawSprites_800467C, sub_8004298, sub_8004590, sub_8004934, event_runArmedCallback_80024AE. Exit
  handling reads ePETMenuData byte 0x1 (byte_200DF21): mode 4 with a screen fade already active reloads
  the menu gfx (copyMemory_8001850 to VRAM 0x600D400), zero-fills the 0x2009740/0x200F3A0 scratch structs,
  calls pet_prepareMenuOnReturn_811F6C0, mainState_resetGameAndGoto28_8005524 (main state -> 0x28), TerminateGFXAnim(0x11),
  sub_8046664 and chatbox_8040818; mode 4 without a fade starts the fade-out (SetScreenFade(0xC, 0x10)
  after ho_811ED1C); mode 8 is the final exit to the overworld: writes 4 into oGameState_SubsystemIndex
  (r5), 0 into oGameState+0xE, clears the OW player state bytes 0xD-0xF (owPlayer_ClearStateBytes_D_E_F_809E04C)
  and clears event flags 742, 743, 962, 963.

  '
