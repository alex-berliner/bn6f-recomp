open_questions:
- Whether byte 0 of AIAttackVars here is a phase index (0/1/2) or a chip/element selector; the table only has 3
  entries so a 2-bit field is plausible.
- Whether r7 truly points at AIData + oAIAttackVars (AIData.Unk_00 is 0x00 and AIData sits at the AIData offset
  from BattleObject.AIDataPtr) or at a standalone AIAttackVars; the +oAIAttackVars_Unk_00 symbol name indicates
  AIData, since `def_struct_offsets ai_attack_vars_struct, oAIAttackVars` matches that label.
- The other two callees (`sub_80F17E4`, `sub_80F1888`) are still unnamed; their identity would fully settle whether
  index 0 is the "no-op/init" and index 2 is the "despawn/cleanup" phase.
