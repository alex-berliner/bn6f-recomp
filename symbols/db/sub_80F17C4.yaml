name: sub_80F17C4
address: '0x080F17C4'
kind: function
previous_names: []
status: hypothesis
summary: Dispatches to one of three AI attack handlers based on AIAttackVars byte 0; the picked function runs with
  r0=that byte and r7 (battle object) live.
interface: () -> r0,r1-r12,flags inherited from the dispatched callee ; side effects via the chosen handler
details: "- Only saves r7,lr and reads AIAttackVars offset 0 (oAIAttackVars_Unk_00 = loc=0x0) from the battle object\
  \ pointed to by r7 (`ldrb r0, [r7,#oAIAttackVars_Unk_00]`).\n  - Loads a base pointer `off_80F17D8` into r1, then\
  \ indexes it by the read byte via `ldr r1,[r1,r0]` to pick one of three Thumb targets, tail-calling through `mov\
  \ lr,pc / bx r1`.\n  - Tail-call dispatcher: r0 carries the dispatched byte, r7 is preserved as the caller-saved-but-restored\
  \ live register, and the popped {r7,pc} returns. All other registers/flags pass through unchanged to the chosen\
  \ callee.\n  - The three targets are `sub_80F17E4+1` (idx 0), `battleObject_aiSpawnSnakeArmAttack_80F1808+1` (idx\
  \ 1) and `sub_80F1888+1` (idx 2). `battleObject_aiSpawnSnakeArmAttack_80F1808` strongly suggests SnakeArm-specific\
  \ AI attack phases, and the snake-arm extra vars (`SNAKEARM_EV_1..3`) line up with indices 1..3 if you count from\
  \ the start.\n  - Naming uses `_ADDRESS` because the role is partly inferred from the lone named callee and the\
  \ AIAttackVars context; not certain this is the *SnakeArm* dispatcher despite the strong hint.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r7,lr}` then `ldrb r0,[r7,#oAIAttackVars_Unk_00]` shows r7 is the live battle object pointer
    and the dispatch key is the first byte of AIAttackVars. - `ldr r1,off_80F17D4` followed by `ldr r1,[r1,r0]`
    and `bx r1` is a classic tail-call jump table dispatcher. - The `off_80F17D8` table contains exactly three Thumb
    entries (+1 encoded into the bx target marks Thumb), matching a small phase dispatcher. - One callee is named
    `battleObject_aiSpawnSnakeArmAttack_80F1808`, so the surrounding dispatcher belongs to the AIAttackVars snake-arm
    phase logic. - The contract lists only r7 in `in` (besides the implicit cc/f) and the epilogue `pop {r7,pc}`
    confirms r7 is the only callee-preserved live register.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080F17C4

    '
  result: the body read as described above
- method: coverage
