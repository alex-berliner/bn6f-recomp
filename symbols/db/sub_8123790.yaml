status: confirmed
summary: Restore a chatbox from its pending snapshot (unk_2037780) while the screen is still fading out.
interface: void chatbox_restore_8123790(struct ChatboxObject* r5 /* 0x80 bytes */, u32 r10 /* preserved */)
details: 'Triggered only when IsScreenFadeActive returns true (beq early-exit). Advances the chatbox

  state machine via chatbox_8040818, then overwrites the live chatbox object at r5 (size 0x80)

  from the snapshot held at unk_2037780 (also 0x80 bytes) using CopyWords. Calls sub_8049DDC

  with the slot index byte at r5+0xC to notify the chatbox subsystem that the object has been

  replaced, and finally zeroes the r5 object in place with ZeroFillByWord(0x80) — consistent

  with cleaning up the source after copying its contents into unk_2037780''s successor.

  Open: confirm whether unk_2037780 is the staging/source buffer or the destination, and the

  exact role of sub_8049DDC and chatbox_8040818; track the field at +0xC (chatbox slot/index).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
