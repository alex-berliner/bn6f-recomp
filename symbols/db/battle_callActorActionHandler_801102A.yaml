name: battle_callActorActionHandler_801102A
address: '0x0801102A'
kind: function
previous_names:
- sub_801102A
status: probable
summary: Dispatches an actor's action handler by (ActorType, AIIndex) via a 2D jump table.
interface: '(r0 = actorNameID: u8) -> r0 = handlerRoutinePtr: u32 (moved to lr and jumped to)'
details: "Looks up the enemy's record via GetVerActorTyAndAIIdx_80182B4(r0=nameID) which returns a pointer\n\
  \  to a small AIData-like record. Reads fields at offsets +1 (ActorType) and +2 (AIIndex); these\n \
  \ form the two axes of a 2D dispatch table. Computes r1 = actorType<<2 and r2 = aiIndex<<2,\n  loads\
  \ the table base from off_8011058 (a `**func` style array), double-indexes ([base+type] +\n  aiIndex),\
  \ and tail-calls the resulting function pointer via `mov lr,pc; bx r0`. The Pop at the\n  end is dead\
  \ code (LR is consumed by the bx) — it's a \"thunk\" tail pattern, not a real return.\n  Effect: the\
  \ chosen function runs in place, and the constant observed at caller exit (0x080114d5)\n  is whatever\
  \ code those thunks happen to fall into.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl GetVerActorTyAndAIIdx_80182B4` then `ldrb r1,[r0,#1]; ldrb r2,[r0,#2]` show the function
    reads ActorType/AIIndex from the per-enemy record. - `lsl r1,r1,#2; lsl r2,r2,#2` build u32 stride
    indices into a pointer table. - `ldr r0,off_8011058 ; ldr r0,[r0,r1] ; ldr r0,[r0,r2]` is a textbook
    double-dereferenced 2D dispatch (each axis of `ActorType` x `AIIndex` picks a function pointer). -
    `mov lr,pc ; bx r0` is an indirect tail-call (no lr save/reload needed across it). - Sole in-caller
    `battle_getObjectNameID_8011020` reads battle_object.NameID and tail-calls here, confirming r0 is
    the actor NameID.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0801102A

    '
  result: the body read as described above
