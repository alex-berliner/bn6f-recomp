open_questions:
- Exact contents of the dispatch table at off_8011058 → off_801105C (the `**func` it points
- into); would settle by reading the ROM at that pointer.
- Whether there are actually 3 ActorType rows (VIRUS/NAVI/PLAYER) and how many AIIndex columns;
- would settle by reading the table base + stride ranges.
- 'What 0x080114d5 (the captured return value on exit) actually represents: r0 ends up holding'
- the last value of r0 from the called AI routine (since this is a tail call), so it tells us
- one such handler returned that pointer in some captured scenarios, not the function itself.
