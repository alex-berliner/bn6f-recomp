open_questions:
- what Unk_40 & 2 actually represents in BattleState (just a "shade index" toggle, or a meaningful flag
  like "team-1 has emotion 2 active").
- which emotion/transform state value 2 corresponds to (BeastOut? Anger-2?) — callPossiblyGetBattleEmotion_8015B54
  is only described as "fetches the player's current battle emotion/transformation state", and r0 is treated
  as a side selector here, not an emotion id, so the 2 is presumably the enemy's state side flag.
- the second entry of dword_8016CE4 (offset 2) is not initialised in the captured ROM dump; only 0x7C000000
  is present, so the ldrh at offset 2 likely reads the upper 16 bits of the next word (which is uninitialised
  padding) — likely the routine was patched to a single shader id, or the other entry is set at runtime.
