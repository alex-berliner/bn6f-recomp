  detail: '- bl battle_isBattleOver ; tst r0,r0 ; bne locret_8016CDE -> guards on battle-active state.
    - ldr r1,[r1,#oToolkit_BattleStatePtr] then ldrb r1,[r1,#oBattleState_Unk_0d] -> reads BattleState.Unk_0d
    as a "side/emotion" byte. - ldrb r0,[r5,#oBattleObject_Alliance] ; eor r1,r0 ; beq locret_8016CDE
    -> only when object''s side != state byte. - bl callPossiblyGetBattleEmotion_8015B54 with side = eor(Alliance,1)
    ; cmp r0,#2 ; bne locret -> only when opposing-side emotion is 2. - ldr r3,[r5,#oBattleObject_CollisionDataPtr]
    ; ldrb r0,[r3,#oCollisionData_CounterTimer] ; tst r0,r0 ; beq -> only when a counter timer is active.
    - bl battle_getStateUnk40_800A704 ; mov r1,#2 ; and r0,r1 ; ldr r1,off_8016CE0 ; ldrh r0,[r1,r0] ;
    bl sprite_setColorShader -> picks one of two sprite-shader ids from the inline table at 0x8016CE4
