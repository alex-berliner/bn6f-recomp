name: e_copyBgTileBlock11x3
address: '0x08131570'
kind: function
status: probable
summary: Copies a fixed 8x8 tile block of tile IDs into BG tile block 0 at tile position (0x11, 3), used
  by the eLink match object's update paths to redraw part of the background.
interface: () -> void; no return value, no flag guarantees
details: 'The function is a parameterless wrapper: it loads constants j=0x11, i=3, tileBlock32x32=0, j_size=8,
  i_size=8, and points r3 at byte_8130884, then calls CopyBackgroundTiles. That copies an 8x8 grid of
  tile IDs from the byte_8130884 table into the 32x32 tile block 0 at tile coordinates (i=3, j=0x11),
  stamping a prebuilt 64-tile image onto the background layer. It touches no game object state; all behavior
  is fixed by the constants and the byte_8130884 tile table. All known callers are update routines of
  the e-link match object (including e_linkMatchObjectUpdate), so it is the object''s way of refreshing/drawing
  this background region when its state machine reaches the right state.'
