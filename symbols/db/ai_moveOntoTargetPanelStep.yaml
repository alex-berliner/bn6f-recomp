name: ai_moveOntoTargetPanelStep
address: '0x080F5C90'
kind: function
status: probable
summary: 'AI attack step: if the enemy can move, gets a destination panel from a per-alliance chooser
  callback, reserves it and plays the move-in animation; otherwise aborts the move.'
interface: (r0 = battle object ptr (also in r5), r5 = same object, r7 = AI attack vars block) -> r0 =
  destroyed; sets object fields and AI vars
details: Calls object_canMove; if the object is blocked, it clears oAIAttackVars_HasMoved and calls object_exitAttackState.
  Otherwise it indexes byte_80F5CE0 by Alliance*8 to fetch two words (r2/r3) and calls the PanelChooseCallback
  stored in the AI vars with the target object pointer in r0, expecting the chosen panel X in r0 and Y
  in r1. If the callback reports failure (r0==0) it takes the same abort path. On success it stores X/Y
  into oBattleObject_FuturePanelX/Y, claims the panel with object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE
  on the object, switches CurAnim to 4, sets StepTimer=3, HasMoved=1, and HitElement=4.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_canMove / beq loc_80F5CD0 — move only attempted when the object is free (0x80F5C94);
    ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; bx r1 with target in r0 and table words in r2/r3 —
    panel selection is delegated to a callback (0x80F5CA8-0x80F5CB2); strb r0/r1 into oBattleObject_FuturePanelX/Y
    then bl object_reservePanel — the chosen tile is claimed for this object (0x80F5CB6-0x80F5CC0); mov
    r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1 — object is locked in place after moving (0x80F5CC2);
    CurAnim=4, StepTimer=3, HasMoved=1, HitElement=4 written to the AI vars on success vs HasMoved=0 +
    object_exitAttackState on failure (0x80F5CC8-0x80F5CD6)
