name: battle_objectPerFrameUpdate
address: '0x080CD08C'
kind: function
status: probable
summary: 'Per-frame update routine for a battle object: marks the object with flag 0x2, runs the hit-reaction
  teardown, then dispatches the object''s state machine from a fixed action table and refreshes sprite/collision.'
interface: (r4 = object pointer? r5 = object header) -> void; sets oObjectHeader_Flags bit 0x2 each frame
details: Each frame it ORs bit 0x2 into the object header's flags byte (r5 base, per the caller's object
  layout), then calls sprite_clearFinalPalette and object_finishCollisionHitReaction_801AD12 to wrap up
  any pending hit reaction, plus sub_800F672 (unknown, likely a type-specific tick). It then passes the
  action-handler table at off_80CD0B8 to battleObject_dispatchActionHandler_801B394 — the table holds
  ten state handlers including battle_ResetObjectActionState_80165B8 and battleObject_initAndRunAI_8016B02,
  i.e. a normal AI-driven state machine. Finally it runs the standard object_updateSprite and object_presentCollisionData
  per-frame steps. The unconditional flag-0x2 set every frame is the only non-generic part and likely
  marks the object as continuously active/attacking for other systems.
