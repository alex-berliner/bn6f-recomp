    hit-reaction wrap-up sequence; ldr r0, off_80CD0B4 then bl battleObject_dispatchActionHandler_801B394
    — dispatches the 10-entry state table at off_80CD0B8; table contains battle_ResetObjectActionState_80165B8
    and battleObject_initAndRunAI_8016B02 — confirms an AI-driven object state machine; caller battleObject_initFromHPTableByParam1_80CCFFC
