summary: Looks up a chatbox script index from the battle object's message id (offset 0x12) and dispatches it through
  the chatbox script runner.
interface: void sub_812B3CC(u32 lr); // r4, r5, r10 in; r4, r5, r6 out; preserves r6, r7; clobbers r0-r3, lr, nzcv
details: 'Reads an 8-bit message id from r5+0x12 (a battle object field), uses it as an index

  into a small 3-entry table at dword_812B3E0 (entries: 0x100F0E plus two adjacent

  words holding the other indices), and passes the resulting byte to

  chatbox_runScript_803FD9C_on_eTextScript201BA20. Acts as a thin indirection that

  translates a battle object''s message-id field into the corresponding chatbox

  eTextScript201BA20 sub-script.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
