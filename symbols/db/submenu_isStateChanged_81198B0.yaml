name: submenu_isStateChanged_81198B0
address: '0x081198B0'
kind: function
status: confirmed
summary: Returns whether the submenu's state byte has changed, treating submenu states 1-5 as always-changed
  and otherwise comparing bytes at +0xE and +0xF of either sSubmenu or the active submenu pointer (when
  the submenu popup is open).
interface: bool submenu_isStateChanged_81198B0(u32* submenu_r5, u32 r1_unused) -> r1=byte+0xF, NZ=state1-5
  else (submenu+0xE) != (submenu+0xF)
details: 'Inspects byte at [r5+5] (the submenu state field on the caller''s r5 pointer). If that

  state is in [1..5] the routine short-circuits with NZ set (tst 1,1) and r1 untouched;

  callers use this to treat those states as "always different" without inspecting the

  comparison bytes. Otherwise it picks the submenu struct to read: when submenu_isOpen

  returns true (submenu_isOpen_81355D8) the result of sub_81312F4 is used, else the

  global sSubmenu (off_81198E4). It then loads bytes at +0xE and +0xF of that struct,

  returns +0xF in r1 and sets flags from (byte+0xE) - (byte+0xF). Preserved: nothing;

  clobbers r0/r1/r6/lr plus C/V.


  Register form kept (C call semantics could not work): r5,u32 r1_in -> u8 r1_out, nz/cv'
