name: object_updateCollisionStateBasic
address: '0x080DFA58'
kind: function
status: probable
summary: 'Per-frame collision-processing update for a battle object: resolves the last hit, dispatches
  the action''s hit handler, and destroys the object once the battle is over.'
interface: (uses r5 = battle object; no args in r0-r3) -> r0 = destroyed (via callees); sets oBattleObject
  state to CUR_STATE_DESTROY when battle over
details: First calls object_removeCollisionData to tear down the object's previous collision data, then
  object_spawnCollisionEffect to spawn the hit-effect object at the last collision point (jittered). If
  battle_isBattleOver says the battle ended, it clears the object's collision region, runs object_presentCollisionData
  once, and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized. Otherwise
  it reads oCollisionData_FlagsFromCollision via oBattleObject_CollisionDataPtr; nonzero flags route to
  sub_80DFB80 (hit/reaction handling). If flags are clear and battle_isTimeStop is false, it dispatches
  via a 2-entry table (off_80DFAA0) indexed by oBattleObject_CurAction to sub_80DFAA8 or sub_80DFACE;
  either way it finishes with object_presentCollisionData to refresh this frame's collision state.
