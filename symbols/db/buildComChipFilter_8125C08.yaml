name: buildComChipFilter_8125C08
address: '0x08125C08'
kind: function
status: confirmed
summary: Builds the available COM-chip list by scanning event flags for chips 0x140-0x15E and compacting
  the resulting slot array.
interface: void buildComChipFilter_8125C08(void); /* returns chip count in r0 */
details: "Zeros the 0x578-byte buffer at dword_201FC20 (a packed slot array of word entries up to unk_2020198).\
  \ Iterates chip IDs 0x140..0x15E (31 chips). For each chip, fetches its ChipData via getChip8021DA8\
  \ and reads the element kind at offset 0x15; the slot pointer is ((kind-1) << 2) + base. Only kind-byte\
  \ == 4 (the COM element) is processed.\n\nFor each COM chip, three event-flag ranges are tested via\
  \ TestEventFlag:\n  - flag 0x1F60+i          -> status byte 0 (always unlocked)\n  - flag (0x2220+i)+(0x1F60-0x1E20)\
  \ -> status byte 1\n  - flag (0x2020+i)+(0x1F60-0x1E20) -> status byte is then refined: TestEventFlagFromImmediate(page\
  \ 0x17, idx 0x11) returns 2 if set, else 1\n\nWhen a flag matches, the slot at r2 receives: [u16 chip_id][u8\
  \ status][u8 pad] and r5 (count) is incremented.\n\nAfter the scan, a second pass compacts the word\
  \ array from base toward unk_2020198 by sliding non-zero words forward and zeroing the vacated slots\
  \ (in-place compaction, 0x13F iterations).\n\nReturns: r0 = number of matching COM chips (count), r5/r4-r7\
  \ preserved across the call.\n"
