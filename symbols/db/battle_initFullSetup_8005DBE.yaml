name: battle_initFullSetup_8005DBE
address: '0x08005DBE'
kind: function
status: confirmed
summary: 'Runs the complete battle-entry initialization sequence: clears the auxiliary game-state pointer,
  frees all type-0x25 objects, then inits graphics, work areas, scenario effects, and NetNav stats in
  order.'
interface: void battle_initFullSetup_8005DBE(void); /* r10 = toolkit pointer (preserved); clobbers r0-r3,
  lr; preserves r4-r12 */
details: 'Loads the game-state pointer from toolkit offset oToolkit_GameStatePtr, then

  zeroes the secondary pointer at oGameState_Ptr_20 so downstream code knows the

  auxiliary structure has not been rebuilt yet. Calls FreeAllObjectsOfSpecifiedTypes

  with r0=0x25 (a type mask likely for transient battle entities such as PET objects

  or chip-visual nodes) while passing the game state in r5; the enclosing push/pop

  preserves r5 across that callee. Then sequentially calls eight subsystem init

  helpers: resetAllGraphicsState_8005F40 (tilemap/OAM reset),

  runSetupStepAndClearWorkArea_8005F6C (staged scene setup + work-area wipe),

  sub_80027C4 (unnamed subsystem), zeroFill_80024A2 (buffer clear),

  scenario_initEffectState_8003962 (per-scenario visual-effect state),

  zeroFill_8003AB2 (second buffer clear), sub_803FB28 (unnamed subsystem), and

  reloadCurNaviStatBoosts_813c3ac (re-applies the current NetNav''s stat modifiers

  from save data). No return value; all callers treat it as void setup.

  '
