name: chatbox_animateWindowOpen
address: '0x0809ACD0'
kind: function
status: probable
summary: 'Per-frame open animation for the dialog text window: advances an opening counter and slides
  the window''s three sprites apart until fully open.'
interface: (r0 unused; r5 = window/dialog struct, r10+0x2c = ptr to window config) -> r0 = 1 while still
  opening, 0 when fully open; clobbers r4-r7
details: 'Reads the open-progress byte at [r5+4], adds 0x10, and if the result is <= 0x60 stores it back
  and moves three sprite-table entries to x = progress-0x30 (growing from the center outward, y=0x58),
  returning 1. When the progress would exceed 0x60 the window is fully open: it copies the final dimensions
  from the config table ([r6+0x4c] halfword -> [r5+6], [r6+0x50] byte -> [r5+5]), clamps progress to 0x60
  and returns 0. Afterwards it runs the full per-frame entity update pass (entity_runAllUpdateHandlers)
  and the eStruct sprite refresh, so the window sprites redraw with the new position. Field +4 is thus
  the window width/open amount with 0x60 as the fully-open value.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#4]; add r0,#0x10; cmp r0,#0x60 — progress counter stepped per frame toward 0x60;
    add r0,r0,#-0x30 (dword_809AD48=0xffffffd0) then sprite_setPositionForIdRange3 with r1=0x58,r2=0 —
    sprites slide outward as the counter grows; fully-open branch: strh [r6,#0x4c]->[r5,#6], strb [r6,#0x50]->[r5,#5],
    strb 0x60->[r5,#4], returns 0; calls entity_runAllUpdateHandlers_80465BC and battle_updateEStructSprites_80465F8
    every invocation, i.e. it is itself a per-frame step; return value r7=1 while animating vs 0 when
    done fits a blocking ''wait for window open'' caller'
