name: sub_814E1E8
address: '0x0814E1E8'
kind: function
previous_names: []
status: hypothesis
summary: Advances the battle object's update routine's script PC, then sets bit 0x0C in the object flags and subtracts
  0x40 from the BattleObject.Element field.
interface: '(r0 = battleObject, r1 = scriptContext/AIState) -> r0 = battleObject ; side effects: writes [r1+0xE]
  (subtract 0x40), ORs 0xC into [r0 object flags], preserves r4-r11/lr per contract'
details: "Uses `mov r12, lr; bx r12` tail-call pattern into `sub_814E0D0` (named `battleObject_runUpdateRoutineAndAdvancePC_814E0D0`),\
  \ which\n  presumably drives the object's per-action update step and advances its script PC.\n  After that call,\
  \ the function performs two fixed patches on the battle object/AI state pair:\n    - `sub r3, #0x40; strb r3,\
  \ [r1,#0xe]` — reads byte at [r1], subtracts 0x40, stores back at [r1+0xE]. Given r1 in captured\n      calls\
  \ points at an AIState-shaped buffer (offset 0xE exists), this is most plausibly masking the state field (e.g.,\n\
  \      clearing the high bit) — though subtracting 0x40 from the *previous* byte and writing at +0xE is an odd\
  \ pairing.\n    - `ldrb r3, [r1]; orr r3, #0xc; strb r3, [r1]` — ORs 0x0C into the byte at [r1]; given BattleObject's\
  \ first byte is the\n      `ObjectHeader.Flags` field, this sets bits 0x2 (VISIBLE) and 0x4 (PAUSE_UPDATE) — i.e.,\
  \ the object becomes visible and\n      update is paused.\n  Returns r0 = original battleObject (per captured-call\
  \ exits: r0=02010890 unchanged). The function is invoked from a script\n  dispatch loop (lr=0814E36D) with r2\
  \ holding a script-byte pointer and r3 the address right after `sub_814E1E8`'s own\n  pointer (0814E1E9) — strongly\
  \ suggesting this is itself an opcode-handler shim that lives in a script jumptable.\n"
