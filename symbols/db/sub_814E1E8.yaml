name: sub_814E1E8
address: '0x0814E1E8'
kind: function
status: hypothesis
summary: Runs the check in sub_814E0D0 and writes its status, biased by 0x40, plus flag bits 0x0C into a state struct.
interface: void recordCheckResultInState(void); // no direct args; callee sub_814E0D0 leaves the state struct pointer
  in r1; returns to caller via r12; clobbers r2, r3 and flags (c/v from SUB, nz from ORR)
details: 'Thin wrapper around sub_814E0D0. It first copies lr into r12 so it can return through r12 (a calling pattern
  shared with the callee). After the guest call, sub_814E0D0 has left a status byte in r3 and the address of a state
  struct in r1. The wrapper subtracts 0x40 from the status byte (so a returned 0x40 is recorded as 0, i.e. the raw
  value looks like "result + 0x40") and stores it at struct+0x0E, the struct''s result field. It then reads the
  struct''s header byte at struct+0x00, ORs in the flag bits 0x0C, and writes it back, marking the struct with the
  "checked" bits 0x0C. The ORR result is left in r3 and flags are set as by the original instructions. The meaning
  of the status byte, the bias constant 0x40, and the identity of the state struct are not known from this wrapper
  alone; they depend entirely on what sub_814E0D0 computes.

  '
