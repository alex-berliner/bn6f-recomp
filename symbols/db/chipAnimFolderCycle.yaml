open_questions:
- No caller is known, so the exact screen/state that drives this (folder-open shuffle vs chip-order display)
  and how state 0xC is dispatched are unconfirmed
- The exact meaning of the two render variants (r4=9 vs r4=1) and the fields at r5+6/r5+7 (regular vs
  tag/extra chips?) would need the surrounding state machine or sub_802B8B0's writer to confirm
