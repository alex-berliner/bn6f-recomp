name: sub_80FEB64
address: '0x080FEB64'
kind: function
status: probable
summary: 'CircusMan AI attack-initialization step: fills the AIAttackVars block for a new attack and enters the
  attack state.'
interface: (r0 = battle object/AI context, r7 = oAIAttackVars struct) -> r0 = result of object_setAttack0; no meaningful
  flags
details: Reads the enemy's difficulty tier via battle_getAiDifficultyTier and stores it in oAIAttackVars_AiDifficultyTier,
  then clears InitFlag. Installs sub_80FF614 as the PanelChooseCallback, calls sub_80FEBE4(1) (some per-attack setup
  with a fixed argument), and fills AttackDuration, AttackBoost2, TimerOrCycles and SubStepIndex from the return
  values of sub_80FEA08 and sub_80FEA3C. It looks up the opposing side's object with battle_findPlayer(alliance
  ^ 1) and stores it as TargetObjectPtr. Finally it starts the attack behavior with object_setAttack0(0xb). It is
  the 'begin attack' step reached from the CircusMan AI decision step sub_80FE8E4.
