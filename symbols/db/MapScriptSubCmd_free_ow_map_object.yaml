name: MapScriptSubCmd_free_ow_map_object
address: '0x08037F6E'
kind: function
status: confirmed
summary: Map-script sub-command that frees one overworld map object from a cutscene-state slot, advancing the script
  cursor and reporting success.
interface: void MapScriptSubCmd_free_ow_map_object(u32 commandWord /*r4 low nibble = slot index*/, CutsceneState*
  cutsceneState /*r5, preserved*/, u8** scriptCursor /*r7, advanced by 2*/); // returns r0 = 1
details: 'Handles a map-script sub-command that releases an overworld map object. The command word (r4) carries
  the target slot in its low nibble (masked with 0xF); the slot index is shifted left by 2 to form a byte offset
  into the cutscene state''s owMapObjectPtrs pointer array (base oCutsceneState_owMapObjectPtrs_44, i.e. 16 slots
  of 4 bytes). If the slot holds a non-NULL object pointer, the pointer field is cleared to NULL first and the object
  is passed to FreeOverworldMapObject for deallocation; an empty slot skips the call. The script cursor (r7) is
  advanced by 2 bytes to step past this command, and the function always returns 1 (success). r5 (cutscene state
  pointer) is preserved across the callee; the slot index and cutscene-state pointer come from registers set up
  by the map-script dispatcher.

  '
