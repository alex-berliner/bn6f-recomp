name: camera_applyDeltaToRenderInfoScroll_8030136
address: '0x08030136'
kind: function
previous_names:
- sub_8030136
status: probable
summary: Applies the camera's positional delta (Unk_04/Unk_06 minus Unk_08/Unk_0a) to the toolkit's RenderInfo
  scroll register pair (Unk_10/12) and writes the same value to its offset copy (Unk_14/16).
interface: '(r5 = Camera*, r10 = Toolkit*; uses both) -> no return value ; side effect: writes Toolkit->RenderInfo+0x10,
  +0x12, +0x14, +0x16'
details: "Reads four halfwords from the Camera struct pointed to by r5: Unk_04, Unk_06, Unk_08, Unk_0a.\n\
  \  Computes a per-axis delta by subtracting the lower pair (Unk_08/0a) from the upper pair (Unk_04/06)\n\
  \  with `sub r1, r1, r2` and `sub r4, r4, r2`.\n  Loads Toolkit (r10)->RenderInfoPtr and reads Unk_10\
  \ and Unk_12 (the BG scroll/coordinate registers),\n  then adds the two deltas in turn and stores the\
  \ new values both into Unk_10/12 (live registers\n  that get pushed to GBA display registers) and into\
  \ the offset copy Unk_14/16. Strh/strh pattern at\n  the end. Returns via `mov pc, lr` (no callee save\
  \ churn).\n  In effect, this advances the BG scroll position by the camera's inter-frame XY delta. Likely\
  \ a\n  per-frame call wired into the camera update path so the field of view follows camera motion.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r1, [r5,#oCamera_Unk_04]` / `ldrh r2, [r5,#oCamera_Unk_08]` and `sub r1, r1, r2` produces
    X delta; analogous pair for r4/r2 produces Y delta, matching BG scroll setup. - `ldr r0, [r10,#oToolkit_RenderInfoPtr]`
    confirms r10 is Toolkit and o+0x8 is RenderInfoPtr. - `ldrh r6, [r0,#oRenderInfo_Unk_10]` / `ldrh
    r7, [r0,#oRenderInfo_Unk_12]` are the live scroll values; `add` merges the delta computed above. -
    `strh r6, [r0,#oRenderInfo_Unk_10]` and `strh r7, [r0,#oRenderInfo_Unk_12]` followed by the mirroring
    writes to `oRenderInfo_Unk_14`/`oRenderInfo_Unk_16` show the offset-copy pattern repeatedly used in
    this project (live registers plus a same-frame shadow copy). - `mov pc, lr` (no push/pop, no bl) shows
    it is a leaf routine returning void.'
