open_questions:
- Exact role of Unk_04/06 vs Unk_08/0a on Camera (current scroll vs previous-frame scroll vs
- shake offset) is unknown; would settle it by inspecting the camera updater that produces them.
- Whether Unk_14/16 is consumed by VBlank copy or by the BG layer descriptors would tell us if
- this is BG0/1/2/3 specific.
