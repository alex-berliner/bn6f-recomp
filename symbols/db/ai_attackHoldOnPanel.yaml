open_questions:
- No callers are known, so which boss/objects use this attack state is unknown
- The meaning of AttackElement = 4 (which element/attack type) and of anim IDs 0x40/0x42 are not established
- Whether the packed DamageAndStaminaDamageCounterDisabler source field is per-object config or scratch
  is unconfirmed
