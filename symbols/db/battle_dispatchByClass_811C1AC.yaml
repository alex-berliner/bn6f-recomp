name: battle_dispatchByClass_811C1AC
address: '0x0811C1AC'
kind: function
status: confirmed
summary: Dispatches a battle-object update to one of three handlers based on the class-offset byte at
  [obj+8].
interface: void sub_811C1AC(u32 obj /* r5 */, r2, r3, r4, r6, r7, r8, r9, r10, r11, r12, lr); /* clobbers
  all of r0–r12, lr, NZCV */
details: 'Thin shim over an inline dispatch table at off_811C1C0 containing three Thumb targets

  (sub_811C1CC, sprite_updateAnimPassthrough_811C22C, sub_811C234). The selector is the

  byte at offset 8 of the structure pointed to by r5 (a battle object). Valid offsets

  observed in the data are 0, 4, and 8; the assembly does not bounds-check, so any

  other value reads past the table and branches to garbage. The function loads r0 from

  a literal pointer (off_811C1BC -> off_811C1C0), reads the table entry as a word, and

  performs a Thumb->Thumb call via `mov lr,pc; bx r0`, then `pop {pc}` returns to the

  original caller. No registers are saved/restored across the trampoline other than the

  implicit lr/pc; all of r2–r12 plus r5 and lr are forwarded to the callee unchanged.

  The three destinations appear to be the per-class update entry points for battle

  objects (one of them is already named sprite_updateAnimPassthrough).

  '
