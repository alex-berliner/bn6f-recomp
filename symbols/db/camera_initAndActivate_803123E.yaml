name: camera_initAndActivate_803123E
address: '0x0803123E'
kind: function
status: confirmed
summary: Initializes a camera via sub_8031122, snaps it to its current center (halved coords from sub_8030E8C)
  via camera_moveByDelta_80310B0, and sets bits 0 and 1 of the caller's r12 to mark it active and ready.
interface: void camera_initAndActivate_803123E(u32 savedR0, u32 savedR1, u32 savedR2, u32 savedR5, u32*
  cameraState);
details: 'Stack-saves r0..r2, r5, and lr (using them as a return slot, then `pop {r0-r2,r5,pc}`).

  Calls sub_8031122 (camera context prep) with no explicit args; args are arranged via r12.

  Queries current scene coordinates with sub_8030E8C using window (r2=0, r3=0x20, r5=0x20, r6=1); the
  X

  in r0 is halved (LSR) and Y in r1 is halved (ASR, signed), then handed to camera_moveByDelta_80310B0

  so the camera positions itself on the center of that query.

  Finally ORs 3 into the caller''s r12 (state word): bit 0 = active, bit 1 = ready. r0/r1/r2/r5 are

  preserved across the call so the caller''s loop state survives.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
