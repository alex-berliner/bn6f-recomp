- 'What r5 actually points to: the project''s SubMenu struct only declares'
- '`idx_00` at offset 0; the read at [r5,#8] implies r5 is either a'
- SubMenu wrapper, a 0x8-prefixed state struct, or unrelated — identifying
- the r5 struct would settle the name. Tracing the callers (none listed)
- to find how r5 is set up before each call would do it.
- Whether the three callees are init/step/destroy or input-dispatch
