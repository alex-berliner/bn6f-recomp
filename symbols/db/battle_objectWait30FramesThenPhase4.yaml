name: battle_objectWait30FramesThenPhase4
address: '0x080E924C'
kind: function
status: probable
summary: 'Battle-object phase step: performs a one-time action on its related object, then waits 30 frames
  before advancing the object to phase 4.'
interface: (r5 = battle object ptr) -> void; sets oBattleObject_Timer to 30 on entry, transitions CurPhaseAndPhaseInitialized
  to 4 when the timer expires
details: Runs as a per-frame update for a battle object whose pointer is in r5. If oBattleObject_PhaseInitialized
  is still 0, it calls sub_80C0F52 through wrapper sub_80E1332 with r0 = oBattleObject_RelatedObject1Ptr
  and r1 = 1, stores 30 (0x1E) into oBattleObject_Timer, and stores 4 into oBattleObject_PhaseInitialized
  so the init block runs only once. On every invocation it decrements oBattleObject_Timer and, once the
  value goes negative (bge not taken), stores 4 into the halfword oBattleObject_CurPhaseAndPhaseInitialized,
  moving the object to phase 4 and implicitly clearing the initialized flag. The value 4 is used both
  as the 'initialized' marker and as the destination phase, suggesting the field doubles as a next-phase
  slot. The exact effect of the sub_80C0F52 call is unknown from this function alone.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized]; tst/bne guards the one-time init block at 80E924C-80E9252;
    bl sub_80E1332 with r0=RelatedObject1Ptr, r1=1 forwards to sub_80C0F52 in the init block; mov r0,#0x1e;
    strh r0,[r5,#oBattleObject_Timer] sets a 30-frame delay; sub r0,#1; strh; bge locret decrements the
    timer each frame until negative; mov r0,#4; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    advances the object to phase 4
