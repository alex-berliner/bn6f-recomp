name: battleObj_initSprite_80C3F00
address: '0x080C3F00'
kind: function
status: confirmed
summary: Initializes a battle object's sprite (panel coords, sprite/image, animation, palette, flip) and
  hands it off to the update-phase handler.
interface: void sub_80C3F00(struct BattleObject *obj /* r5 */)
details: 'Battle-object construction/initialization step used when an object is being set up

  for display during battle.

  Reads obj fields: oBattleObject_Param1, oBattleObject_Param2 (sprite bank/slot args,

  passed to sprite_load together with the fixed image id 0x80), oObjectHeader_Flags

  (OR-ed with 0x02, presumably the "sprite loaded / initialized" bit),

  oBattleObject_ExtraVars+4 (animation id, written to oBattleObject_CurAnim and

  oBattleObject_CurAnimCopy), oBattleObject_Param3 (palette source flag),

  oBattleObject_RelatedObject1Ptr (palette donor when Param3 == 0),

  oBattleObject_Param4 (palette index used when Param3 != 0).

  Sequence: object_setPanelsFromCoordinates -> sprite_load(0x80, Param1, Param2) ->

  sprite_loadAnimationData -> sprite_noShadow -> set header flag bit 0x02 ->

  sprite_setAnimation(ExtraVars[4]) -> sprite_loadAnimationData ->

  palette resolution (Param4, or inherited from RelatedObject1Ptr''s sprite if Param3 == 0)

  -> sprite_setPalette -> propagate object_getFlip -> write CUR_STATE_UPDATE

  (value 4) into oBattleObject_CurStateActionPhaseAndPhaseInitialized ->

  tail-call sub_80C3F52 to begin update-phase ticking.

  The "tail-call" is realized by `pop {r4-r7, pc}`, restoring the caller''s LR pushed

  at entry and branching to it, so this routine effectively transfers control to

  sub_80C3F52 while preserving r4..r7.

  '
