status: confirmed
summary: Allocate a 0x28-byte battle object and initialise it at the given panel with damage and copied alliance/flip
  from a source object.
interface: "u32 battle_allocChildObject_80C9184(u8 panelX, u8 panelY, u32 source, u32 damage /* r6 */);\n  // args:\
  \ r0=panelX, r1=panelY, r5=source object, r6=damage/counter-disabler\n  // returns r0 = new object pointer (0\
  \ on pool exhaustion), r1 = copied alliance/flip halfword (or unchanged panelX on failure)\n  // preserved: r4,\
  \ r5, r6, r7\n  // clobbers: r0, r1, r2, r3, lr, NZCV\n"
details: "Requests a 0x28-byte object from the battle-object pool via sub_8003374\n(size passed in r0, result returned\
  \ in r5 per that allocator's contract).\nIf the allocator returned non-zero:\n  - oBattleObject_PanelX  is set\
  \ to the panel X byte (r0)\n  - oBattleObject_PanelY  is set to the panel Y byte (r1)\n  - oBattleObject_DamageAndStaminaDamageCounterDisabler\
  \ is set to r6\n  - oBattleObject_AllianceAndDirectionFlip is copied as a halfword\n    from the source object's\
  \ same field\nr1 is left holding that copied halfword so the caller sees the new\nobject's alliance immediately.\
  \ The push/pop of {r0,r1,r5} is purely to\nsurvive sub_8003374 clobbering those registers; r0 is then reloaded\
  \ from\nr5 (the allocator's result) before the conditional stores. The branch\non the result of `mov r0, r5` means\
  \ the Z flag tells the caller whether\nallocation succeeded.\n\nRegister form, old prompt; queued for retype (the\
  \ farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
