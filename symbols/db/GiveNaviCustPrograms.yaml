name: GiveNaviCustPrograms
address: '0x0803D108'
kind: function
status: confirmed
summary: Resolves the NaviCust program awarded for the current event and passes it to GiveItem.
interface: void GiveNaviCustPrograms(u32 lookup_r0, u32 lookup_r1, u32 give_r1, u32 ctx_r5, u32 ctx_r7, u32 ctx_r8,
  u32 ctx_r9, u32 ctx_r11, u32 ctx_r12); preserves r4 and lr; clobbers NZ, C, V; other register outputs are inherited
  from the GiveItem call.
details: Saves the caller's r4, preserves the incoming r2 in r4 across sub_803D148, then calls GiveItem with r0
  from sub_803D148 and r1 equal to the original r2. The function therefore selects or resolves the program before
  handing it to the normal item-award routine. r4 is restored on return; no explicit result is returned in a conventional
  typed sense.
