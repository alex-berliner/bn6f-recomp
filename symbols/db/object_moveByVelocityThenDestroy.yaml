name: object_moveByVelocityThenDestroy
address: '0x080C3678'
kind: function
status: probable
summary: 'Battle-object behavior step: adds the object''s velocity (x,y,z) to its position each frame
  and destroys the object when its timer runs out.'
interface: (r5 = battle object pointer; r0-r3/r4/r6 scratch) -> void; when oBattleObject_Timer reaches
  0, sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY
details: Reads three words from offset 0x34 into r0-r2 and three words from offset 0x40 into r3/r4/r6,
  adds them pairwise, and stores the sums back to offset 0x34 — the classic position += velocity update
  for a battle object. It then decrements the halfword at oBattleObject_Timer; only when the result is
  zero (bne skips on nonzero) does it write CUR_STATE_DESTROY into the state field, so the object lives
  exactly Timer more frames. Uses r7 as a scratch address register, no other registers saved. No flags
  meaningful to callers.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldmia [r5+0x34] {r0-r2} / ldmia [r5+0x40] {r3,r4,r6} / add+stmia back to 0x34: three-component
    position += velocity; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bne locret: counts down
    the object timer each invocation; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]:
    self-destructs when timer hits 0; push {lr}/pop {pc} with only r5-based addressing: leaf step function
    operating on the caller''s battle object'
