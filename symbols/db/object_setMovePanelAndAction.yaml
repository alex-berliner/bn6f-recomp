name: object_setMovePanelAndAction
address: '0x080D2780'
kind: function
status: probable
summary: Stores the panel returned by sub_80D29BA into the object's PanelX/PanelY, recomputes pixel coordinates
  and collision panels, then unconditionally sets CurAction to 4 and clears PhaseInitialized.
interface: (r5 = battle object, implicit) -> r0 = 0 after storing; object's PanelX/PanelY, pixel coords,
  collision panels, CurAction and PhaseInitialized updated
details: Calls sub_80D29BA, which returns a success flag in r0 and (apparently) a destination panel in
  r0/r1. On success it writes those bytes to oBattleObject_PanelX/PanelY, then calls object_setCoordinatesFromPanels
  to recompute the object's pixel X/Y and object_updateCollisionPanels to sync the panel into the collision
  record with the new facing. Whether or not a panel was found, it sets oBattleObject_CurAction to 4 and
  clears oBattleObject_PhaseInitialized, i.e. it kicks the object into action state 4 (likely the move/hop
  action) so its per-phase logic reinitializes.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strb r0/[r1] to oBattleObject_PanelX/PanelY right after the tst of sub_80D29BA's return; object_setCoordinatesFromPanels
    and object_updateCollisionPanels follow immediately, per the known summaries; mov r0,#4; strb [r5,#oBattleObject_CurAction];
    strb 0 to PhaseInitialized unconditionally at loc_80D2796
