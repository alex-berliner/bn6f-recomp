open_questions:
- sub_80D29BA is unknown — it should show how the destination panel is chosen (random walk? AI?), which
  would confirm this is an enemy movement picker
- the meaning of CurAction value 4 (move/hop?) is unconfirmed without other action-state handlers
- no callers known, so who invokes this (which enemy AI step) is unknown
- The code at loc_80D2796 unconditionally sets CurAction=4 and clears PhaseInitialized regardless of sub_80D29BA's
  result, so the summary's 'if one was found' qualifier is fine but the action state assignment is unconditional.
  sub_80D29BA returns success in r0 and the destination panel in r0/r1, not a separate flag, which is
  a minor inaccuracy. A better name keeps the 'object_' prefix.
