name: petNaviSelectDialogStep
address: '0x0809CB88'
kind: function
status: probable
summary: 'Per-frame step of the PET navi-select dialog: gates on chatbox flag 0x8, then runs script 0x20
  from the script archive; when chatbox text completes, branches on EVENT_163 to either run the prompt
  script 0x1f or commit by writing the current PET navi to the toolkit struct and clearing CurPETNavi
  plus a dialog field.'
interface: (r5 = dialog state struct) -> r0 = 1 while waiting (chatbox flag bit 3 clear), 0 once a step
  advanced; stores substate 0/1/2 into [r5,#8]
details: 'A state machine advanced by repeated calls. First it requires bit 3 of eFlags2009F38 (chatbox
  flag word) to be set, else returns 1. It then checks chatbox mask 0x100; if set it runs script 0x20
  from the archive pointer at byte_809CEAC+4, stores state 2 and returns 0. Otherwise it reads the chatbox
  low-3-bit state: if the text finished (state 0) and event flag EVENT_163 is clear, it runs script 0x1f
  (likely the ''choose navi'' prompt) and sets state 1; if EVENT_163 is set, it commits the choice by
  saving the current navi via writeCurPETNaviToS2001c04, calling SetCurPETNavi(0), clearing [r5,#0x70],
  then rerunning script 0x20 with state 0. EVENT_163 evidently marks that the player made the selection
  (set elsewhere, e.g. by a script choice).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl chatbox_mask_eFlags2009F38 with 8, then 0x100, gates entry and the 0x20 branch (sub_809CB88
    start); bl chatbox_runScript with (byte_809CEAC+4, 0x1f) and (byte_809CEAC+4, 0x20) are the two dialog
    scripts; bl writeCurPETNaviToS2001c04_Unk07_80010c6 then mov r0,#0; bl SetCurPETNavi on the EVENT_163-set
    path commits navi 0; str r0,[r5,#8] writes substates 0/1/2 after each branch, showing an external
    state struct drives the flow; returns 1 when chatbox flag bit 8/0x100 conditions unmet, 0 after advancing
    (tail branches)
  refs:
  - bn6f/asm/asm28_0.s:4922
  - 0x080010BE SetCurPETNavi
  - 0x0802F164 TestEventFlagFromImmediate
  - 0x08045F4C chatbox_GetState_8045F4C
  reproduce: python3 tools/asmcat.py 0x0809CB88
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The core flow matches: chatbox mask 0x8 gating (returns 1), mask 0x100 branching, scripts 0x1f/0x20
    from byte_809CEAC+4 archive, EVENT_163 gating, and the writeCurPETNaviToS2001c04 + SetCurPETNavi(0)
    + clear [r5,#0x70] commit path at loc_809CBAA are all present in the asm. However, the substate store
    at [r5,#8] is set to 2 (at loc_809CBB8), 1 (loc_809CBD2), or 0 (loc_809CBEE/loc_809CBB0 commit), not
    stored on every return path as implied, and the r0 return is 0 on advance and 1 only at the top gate,
    which the summary gets right. The name ''pet_naviSelectDialogStep'' is fine but the chosen-navi-to-game-state
    commitment contradicts the call SetCurPETNavi(0), which clears the current PET navi rather than applying
    a selection; the function looks more like it finalizes a dialog that triggers PET-navi reassignment.
    A more accurate name would reflect the dialog driver nature.; run wf investigate investigate-20261018-223614;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
