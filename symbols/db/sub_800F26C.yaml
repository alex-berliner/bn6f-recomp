open_questions:
- The exact semantics of the 5-byte row (the table layout at `byte_8021220`) — only the returned (r0, r1) are confirmed
  as the mirrored (x, y); r2/r3/r4 may be other per-slot metadata (e.g., slot kind, mask). Settling it requires
  mapping `byte_8021220` against a build-time arm table (likely an overlay).
