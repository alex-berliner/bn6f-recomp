name: sub_800F26C
address: '0x0800F26C'
kind: function
previous_names: []
status: hypothesis
summary: Resolves a battle-object arm/attachment slot index to its (x, y) attachment offset plus extra metadata,
  with a fixed fallback for invalid slot ids (>=0xCD).
interface: '(r0 = slotId) -> r0 = attachment0, r1 = attachment1, r2 = attachment2, r3 = attachment3, r4 = attachment4
  ; side effects: none'
details: "On entry, slotId is in r0. The function checks whether slotId is in [0xCD, 0xFF]: it computes `r2 = r0\
  \ - 0xCD`, compares against 0x32 (so the acceptable range is 0..0x32, i.e. slotIds 0xCD..0xFF), and if `r2 > 0x32`\
  \ (ordinary actor indices), it forwards to `enemy_getStruct1` and returns `r1 = [AIData+1]` (AIIndex) into r1,\
  \ `r0 = [AIData+0]` (ActorType), clearing r2, r3 and returning through `pop {pc}` — note the contract says r4\
  \ is in `out` but the asm `pop {pc}` doesn't pop r4; this is likely a callee-saved restoration by the only direct\
  \ bl `enemy_getStruct1`, which doesn't show up because the contract is inferred from the many indirect call sites\
  \ that go through this function with r4 live.\n\n  For slotIds 0xCD..0xFF (5-byte arm table), it loads from `byte_8021220\
  \ + (slotId-0xCD)*5`: bytes 0..4 are loaded into r0,r1,r2,r3,r4 respectively. The data layout (5 bytes per entry)\
  \ maps cleanly to a (x, y, ...) attachment-offsets table for arms/parts: r0, r1 are likely the mirrored (dx, dy)\
  \ returned to callers; r2, r3, r4 are extra fields.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `sub r2, r0, r2` / `cmp r2, r1` / `bls loc_800F286` implement a `slotId ∈ [0xCD, 0xFF]` range check
    (the 0xCD constant matches `OW_MAP_OBJECT_ID_UNK_CD..OW_MAP_OBJECT_ID_UNK_F3` range; the table offset constant
    `0x32` covers exactly that 0xCD..0xFF window length + 1). - `mul r0, r1 ; ldr r3, off_800F4D4 // =byte_8021220
    ; add r3, r3, r0` indexes the 5-byte-per-entry table at `byte_8021220`. - Five `ldrb` loads at offsets 0,1,2,3,4
    of the resolved entry map cleanly to r0,r1,r2,r3,r4 — exactly matching the register contract (4 attachment offsets
    + 1). - The `enemy_getStruct1` branch (actor-type path) returns ActorType (`[r0+0]`) into r0 and AIIndex (`[r0+1]`)
    into r1, consistent with mirroring "if invalid arm slot, look up via enemy_getStruct1". - Caller `getBattleArmPositionMaybe_8018810`
    (confirmed) explicitly returns "the mirrored (x, y) attachment offset of an arm/part slot on a battle object,
    or the fixed default pair (0, 7) for invalid slot ids 0xCD..0xFF", strongly supporting that this is the underlying
    resolver.'
  refs:
