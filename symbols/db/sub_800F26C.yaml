name: sub_800F26C
address: '0x0800F26C'
kind: function
status: hypothesis
summary: 'Given an enemy ID, returns a small set of per-enemy display parameters: a fixed 5-byte table record for
  IDs 0xCD..0xFF, otherwise the first two bytes of the enemy''s own struct with the rest zeroed.

  '
interface: 'u32x5 enemy_getVisualParams(u32 id /* r0 */); in: r0 = enemy ID; out: r0..r3 = bytes 0-3 of the record
  (r4 = byte 4 on the table path, untouched garbage on the struct path); flags clobbered.

  '
details: 'Takes an enemy ID in r0. If (id - 0xCD) <= 0x32 (i.e. IDs 0xCD..0xFF, 51 special entries), indexes the
  table byte_8021220 at (id - 0xCD) * 5 and returns its 5 bytes in r0-r4. Otherwise calls enemy_getStruct1(id) and
  returns byte[0] and byte[1] of that struct in r0/r1 with r2 = r3 = 0 (r4 keeps whatever the caller had). The dual
  path and the two-byte fields returned for normal enemies suggest these are rendering parameters such as palette
  / color / sprite-variant indices; IDs 0xCD and up appear to be a special block (e.g. bosses or placeholder/hidden
  entries) that uses a static table instead of the live enemy struct. Note the table path leaks r4 as an output
  while the struct path does not, so callers must treat r4 as meaningful only for IDs >= 0xCD.

  '
