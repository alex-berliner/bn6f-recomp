name: object_runCollisionState_80D1D14
address: '0x080D1D14'
kind: function
previous_names:
- sub_80D1D14
status: probable
summary: 'Drives a battle object''s collision state machine: tears down prior collision data, spawns the
  collision effect, then either destroys the object or routes through a per-CurAction jump table (with
  branch overrides for time-stop and refresh).'
interface: '(r5 = BattleObject*) -> void ; side effects: modifies the object (CurAction, CurPhaseAndPhaseInitialized,
  CurState), its CollisionData, and battle collision regions; tail-call dispatches to per-action handlers'
details: "- Caller-preserved: r5 holds the current BattleObject; the callee-saved set r4,r7,lr is pushed\
  \ (the contract says it restores a lot, but the function only touches r5,r7 and the object in r5; the\
  \ saved set in the listing is r4,r7,lr, with r4 written but not used — see evidence).\n- Always: bl\
  \ object_removeCollisionData, then bl object_spawnCollisionEffect to reset/build collision state for\
  \ this frame.\n- bl battle_isBattleOver; if true (returned nz), bne loc_80D1D76 jumps to the destroy\
  \ path.\n- bl object_isCurrentPanelValid; if false (tst r0,r0 beq), also bne to destroy.\n- Loads r7\
  \ = [r5,oBattleObject_CollisionDataPtr] = the CollisionData; reads r0 = [r7,oCollisionData_FlagsFromCollision]\
  \ (offset 0x70).\n- If FlagsFromCollision != 0, then checks [r7,0x84] (last u16 field). If non-zero\
  \ → destroy. Else masks r0 with 0x03800000 and 0x0c000000:\n    - If 0x03800000 set → destroy.\n   \
  \ - Else if 0x0c000000 set → object_clearCollisionRegion, and if CurAction != 4 forces CurAction = 4\
  \ and clears CurPhaseAndPhaseInitialized.\n- Falls into the time-stop branch: bl battle_isTimeStop.\n\
  - If NOT time-stopped: dispatches via the off_80D1D84 table indexed by CurAction, jumping to sub_80D1D90,\
  \ sub_80D1DEE, sub_80D1E7E (the action handlers at the table addresses 0x80D1D84/88/8C).\n- If time-stopped:\
  \ bl object_presentCollisionData (refreshes state), then bl object_highlightCurrentCollisionPanels,\
  \ then returns.\n- destroy path (loc_80D1D76): object_clearCollisionRegion, writes CUR_STATE_DESTROY\
  \ (8) into CurStateActionPhaseAndPhaseInitialized (u32 at oBattleObject+0x8) and returns.\n- The pushed\
  \ r4 is popped but never set inside the function — it's preserved through calls by the callee-saved\
  \ ABI rather than touched here, which explains the `out`/`may_write` listing r4.\n- CurPhaseAndPhaseInitialized\
  \ is a u16 (offset 0xa); the strh writing 0 to it is paired with the forced CurAction=4 transition (looks\
  \ like \"kick the action into its first phase again\").\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4,r7,lr}` / `pop {r4,r7,pc}` show the callee-saved frame in the assembly. - `bl object_removeCollisionData`
    then `bl object_spawnCollisionEffect` directly match the collision teardown + spawn pattern used elsewhere
    in battle-object update. - `bl battle_isBattleOver` + `tst r0,r0` + `bne loc_80D1D76` — battle over
    → destroy path. - `bl object_isCurrentPanelValid` + `beq loc_80D1D76` — invalid panel → destroy path.
    - `ldr r7,[r5,#oBattleObject_CollisionDataPtr]` and `ldr r0,[r7,#oCollisionData_FlagsFromCollision]`
    (offset 0x70) show the collision-data-driven decisions. - The mask constants `dword_80D2024=0x3800000`
    and `dword_80D2028=0xc000000` matching OBJECT_FLAGS_AFFECTED_BY_ICE / OBJECT_FLAGS_UNK_26 and UNAFFECTED_BY_POISON
    / UNK_28 (high bytes of ObjectFlags2 area), suggesting two "destroy me" ObjectFlags2 cases. - `str
    r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]` with r0 = CUR_STATE_DESTROY (0x8) writes
    the destroy state (enum at oBattleObject+0x8). - `strb r0,[r5,#oBattleObject_CurAction]` and `strh
    r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]` (offsets 0x9 and 0xa) match the BattleObject union
    layout. - The dispatch table at off_80D1D84 lists the three CurAction handlers sub_80D1D90 / sub_80D1DEE
    / sub_80D1E7E (each +1 because of Thumb bx r1). - `bl battle_isTimeStop` + `bne loc_80D1D6C` selects
    the time-stop branch path (presentCollisionData + highlightCurrentCollisionPanels). - r5 = current
    battle object (per the project convention; the helpers'' contracts take r5 as the BattleObject*).'
  refs:
  - bn6f/asm/asm31.s
  reproduce: 'python3 tools/asmcat.py 0x080D1D14

    '
  result: the body read as described above
  note: 'Proposed name (pending rename): object_runCollisionState_80D1D14

