name: object_runCollisionState_80D1D14
address: '0x080D1D14'
kind: function
status: confirmed
summary: 'Per-frame collision-state tick for a battle object: tears down and re-presents hit geometry, dispatches
  the current collision action via jump table, decides whether to advance to attack on body-hit, or destroy the
  object when the battle ends, the panel becomes invalid, or a fatal collision is recorded.'
interface: void object_runCollisionState_80D1D14(u32 r4, u32 r5 /* objectPtr */, u32 r7, u32 r8, u32 r10); → writes
  r5 r8 r9 r10 r11 r12; preserves r4 r7; clobbers r0-r3 r6 lr, flags n z c v
details: 'Called each frame while a battle object is in the collision state. Sequence: (1) object_removeCollisionData
  and object_spawnCollisionEffect reset and recreate hit visuals. (2) Early-destroy exits if battle_isBattleOver
  is true or object_isCurrentPanelValid returns 0. (3) Reads oCollisionData_FlagsFromCollision from the object''s
  collision-data pointer (r5+oBattleObject_CollisionDataPtr). If flags are zero, skips to step 4. If the halfword
  at collision-data offset 0x84 (pending-hit counter) is non-zero, destroy. If flags & 0x3800000 (wall/shield-break
  or fatal collision bits), destroy. If flags & 0xC000000 (enemy-body-hit), calls object_clearCollisionRegion and,
  if the object is not already in action 4, sets oBattleObject_CurAction=4 and resets oBattleObject_CurPhaseAndPhaseInitialized
  to 0. (4) Checks battle_isTimeStop; if time is NOT stopped, dispatches through a 3-entry jump table indexed by
  oBattleObject_CurAction: [0]=object_updateMoveStep, [1]=battle_dispatchObjectPhaseHandler_80D1DEE, [2]=object_blinkOutUpdate.
  If time IS stopped, skips the dispatch. (5) Calls object_presentCollisionData then object_highlightCurrentCollisionPanels
  to re-project the hit region onto the grid. Destroy path at loc_80D1D76 calls object_clearCollisionRegion and
  writes CUR_STATE_DESTROY into the packed oBattleObject_CurStateActionPhaseAndPhaseInitialized dword. Jump-table
  entries are stored with thumb bit set (+1) and dispatched via bx.'
