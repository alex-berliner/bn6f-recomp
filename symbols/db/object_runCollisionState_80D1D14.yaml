open_questions:
- The exact meaning of the 0x03800000 and 0x0c000000 bit masks on FlagsFromCollision is unknown; the value
  being read from FlagsFromCollision then masked with bits that match parts of the ObjectFlags2 enum is
  suggestive but not certain — confirming which two status combos cause an early destroy would settle
  it.
- The CurAction values 0/1/2 mapped to sub_80D1D90/DEE/E7E are inferred but the function never inspects
  CurAction values 3+ in the table; this dispatcher is presumably the "owner" CurAction for a particular
  battle-object type and the three handlers are its three states.
