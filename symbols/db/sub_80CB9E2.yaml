open_questions:
- 'The exact meaning of `0xf800000` (probably a packaged status flag set from collision: invuln/move-complete/guard/superarmor),
  and whether the destroy path here is correct vs. just "skip this frame" — knowing what `basicHandleBattleObjectDamage_801156A`
  returns for an unharmed, action-dispatching object would confirm the role split.'
- The two CurAction targets `sub_80CBA34`/`sub_80CBA52` aren't followed here; they likely select between "objects
  that ride an existing collision into the new frame" vs. "objects whose own CurAction drives spawn timing," but
  only direct disassembly can confirm.
- Whether `r8` and `r4` carry any object-index meaning that influences the destroy condition.
