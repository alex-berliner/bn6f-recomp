name: sub_80CB9E2
address: '0x080CB9E2'
kind: function
previous_names: []
status: hypothesis
summary: Per-frame handler for a battle object that removes stale collision data, emits a collision-effect spawn,
  and either routes to a CurAction dispatch or tears the object down via CUR_STATE_DESTROY.
interface: (r4 = prev linked-list ptr, r5 = BattleObject*, r7 = ?, r8 = ?, r10 = Toolkit*) -> void ; mutates r5->CollisionDataPtr,
  r5->CurStateActionPhaseAndPhaseInitialized, r0/r1/r2/r3
details: "Entry pushes only r4/r7/lr; r5 (BattleObject*), r8, r10 (Toolkit*) are preserved by the calling convention.\n\
  \n  Sequence on entry:\n  1. `bl object_removeCollisionData` — tears down the object's existing collision region/region\
  \ indices.\n  2. `bl object_spawnCollisionEffect` — spawns the standard per-collision-frame spawn effect for this\
  \ object.\n  3. `bl battle_isBattleOver` — checked: if battle already over, branch to the destroy path.\n  4.\
  \ `mov r0, #0` then `bl basicHandleBattleObjectDamage_801156A` with damage 0; `add r0, #1; beq` — the +1 then\
  \ BEQ trick means we branch to the destroy path only when the call returned exactly 0 (the \"no further processing\
  \ / object should die\" sentinel). Otherwise we keep going.\n  5. Loads `r7 = [r5+#oBattleObject_CollisionDataPtr]`,\
  \ then reads `r0 = [r7+#oCollisionData_FlagsFromCollision]`, ANDs against `0x0f800000` (bit-shifted guard/superarmor/invuln\
  \ set: GUARD=0x1, INVIS=0x2, INVULNERABLE=0x8, SUPERARMOR=0x20000, MOVE_COMPLETE=0x80000 → combined mask plausible\
  \ from the OBJECT_FLAGS_GUARD..BUBBLED set of bits). If any of these bits are set, also branch to destroy.\n \
  \ 6. `bl battle_isTimeStop` — bne branch: if time is stopped (NZ = true), skip the CurAction dispatch and instead\
  \ re-present collision data (`object_presentCollisionData`) then return (continue living).\n  7. Otherwise it\
  \ loads `CurAction` byte at `oBattleObject_CurAction` (0x9), uses it as an index into the small table at `off_80CBA2C`\
  \ (table of two Thumb function pointers `sub_80CBA34+1`, `sub_80CBA52+1`), and tail-calls the selected routine\
  \ via `mov lr, pc; bx r1`. So CurAction 0 → one handler, CurAction 1 → another; higher values presumably hit the\
  \ same destroy path indirectly.\n\n  Destroy path (loc_80CBA1E): `bl object_clearCollisionRegion`, set `[r5+#oBattleObject_CurStateActionPhaseAndPhaseInitialized]\
  \ = CUR_STATE_DESTROY (8)`, then pop and return. The \"1\" return from the damage probe (i.e. non-zero after +1)\
  \ means we keep this object alive, \"0\" means it dies this frame.\n\n  The `0x0f800000` mask in `dword_80CBB40`\
  \ (= 0xf800000) corresponds to bits for INVIS/INVULNERABLE/SUPERARMOR/MOVE_COMPLETE etc. — when these are present\
  \ the object is \"untouchable enough\" to skip per-frame collision processing and instead be queued for destruction\
  \ here? Worth verifying in another caller of this pattern.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4,r7,lr}` plus pop `{r4,r7,pc}` at all three returns shows the saved-set is exactly r4/r7/r8/r10
    in-entry contract, while r5 is left in `out` (callee-preserved only). - `bl object_removeCollisionData` immediately
    after entry → unconditional collision tear-down. - `bl object_spawnCollisionEffect` straight after → unconditional
    spawn of the collision-effect/visual. - `bl battle_isBattleOver` then `tst r0,r0; bne loc_80CBA1E` → battle-end
    ⇒ destroy branch. - `mov r0,#0; bl basicHandleBattleObjectDamage_801156A; add r0,#1; beq loc_80CBA1E` → if the
    routine returns 0 we increment to 1 and branch-equal, so a `0` return means destroy; we rely on the contract
    that this callee is the standard "has this object been touched / is its HP zero" probe. - `ldr r7,[r5,#oBattleObject_CollisionDataPtr];
    ldr r0,[r7,#oCollisionData_FlagsFromCollision]; ldr r1,dword_80CBB40; tst r0,r1; bne loc_80CBA1E` → if specific
    FlagsFromCollision bits are set, mark for destroy; constant `0xf800000` matches the upper high-half of the ObjectFlags1
    enum (bits 19..26: MOVE_COMPLETE/DRAG/ANGER/USING_ACTION/UNK_24..UNK_28). - `bl battle_isTimeStop; bne loc_80CBA18`
    → when time-stopped, skip the CurAction dispatch. - `ldrb r0,[r5,#oBattleObject_CurAction]` accesses the 0x9
    field; offset table `off_80CBA28 → off_80CBA2C`, whose first word is `sub_80CBA34+1` and second is `sub_80CBA52+1`
    — a Thumb-BX dispatch on CurAction values 0 and 1. - `bl object_presentCollisionData` is the only call in the
    time-stop branch, restoring per-frame collision state without action dispatch. - Destroy path writes `CUR_STATE_DESTROY
    (0x8)` to `oBattleObject_CurStateActionPhaseAndPhaseInitialized` (union covering CurState at offset 0x8).'
