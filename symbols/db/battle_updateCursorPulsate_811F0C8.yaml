  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#4]; cmp r0, #8; beq loc_811F0DE` shows a two-mode dispatch keyed off a byte
    in the r5 scratch struct. - The `ldrh r0, [r0,#0x4]` of `dword_811F10C[0]` and the immediate `0x19A`
    at `word_811F110` match the captured exit r0 == 0x019A on every recorded call. - The `strb r0,[r5,#7];
    strb r1,[r5,#6]` after `bl sub_811F184` is the only place those scratch bytes are written, and the
    call passes the previous values back in, confirming sub_811F184 is a step function for these two bytes.
    - Caller `initPetSelectScreen_811EF28` is described as setting up "GFX anim scripts" and "PET/Navi-select"
    backgrounds, which fits a per-frame pulse driver.'
