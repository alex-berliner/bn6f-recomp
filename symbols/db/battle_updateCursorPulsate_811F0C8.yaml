open_questions:
- The semantic role of r5+6 / r5+7 (probably a sub-frame index/phase) and of word_3001B2C
- (likely BG palette or BLDCNT-related; the constant 0x019A in the GFXAnimState literal table
- is suggestive of a timer rather than a palette index, but the writer does not contradict
- either). Settling it needs a writer of word_3001B2C in a known GFX path or a cross-ref of
- 0x019A to a GFXAnimState.Timer field in the engine.
- The contract lists `r10` in `in` but this function never uses it; the caller just happens
- to pass it through.
