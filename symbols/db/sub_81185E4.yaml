open_questions:
- The exact meaning of the (Unk_38+Unk_3a) -> 0x90 lookup table (beast-sprite id? enemy palette slot?).
- Whether byte 3 of the resolved object is really ObjectHeader.Type (high nibble of
- TypeAndSpriteOffset), the Element byte at oBattleObject+0xe, or some other u8 - reading at
- +3 is unusual and disassembly of the resolved object would confirm the meaning.
- Captured-call r0/r1/r2/r3 entry values are all zero, so the trace did not capture a live
- AIData look-up; running the function in a real cross-fight scenario would expose a nonzero
- table slot.
