name: sub_81185E4
address: '0x081185E4'
kind: function
previous_names: []
status: hypothesis
summary: Set a battle object's sprite palette using an index table referenced from its AIData.
interface: '(r6 = BattleObject*) -> void ; side effect: writes sprite palette index'
details: "The function reads two halfwords from the AIData attached to the battle object in r6: a base\n  index\
  \ at r6+0x38 and an additional index at r6+0x3a (these match the Unk_38 / Unk_3a fields\n  of AIData). It sums\
  \ them, multiplies by 4, and adds the base of a global table at\n  word_201DA80 (the off_81186A4 entry). It loads\
  \ a u16 from that table slot and subtracts\n  0x90 from it; the result is used as an index passed to battleObject_getByIndex_813B780.\n\
  \  The function then reads byte 3 of the returned object, subtracts 1 from it, and calls\n  sprite_setPalette\
  \ with that value. Effectively: look up a battle object via the AIData\n  table, then set the calling object's\
  \ sprite palette to one less than some byte of the\n  resolved object (likely the element/type byte) so the sprite\
  \ palette reflects the\n  target object's identity (e.g. enemy Navi element color in cross/BeastOut contexts).\n\
  \  All callers are unnamed battle sub_ routines that pass r6 holding a battle object\n  pointer; this is a \"\
  void\" helper used inside a battle dispatch.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrh r0, [r6,#0x3a]` and `ldrh r1, [r6,#0x38]` read two u16 fields from the object at r6, matching
    the AIData Unk_38 / Unk_3a offsets exposed via AIDataPtr at oBattleObject+0x58. - `lsl r0,r0,#2` then `ldr r1,
    off_81186A4 // =word_201DA80` and `add r0,r0,r1` form a u16* lookup into a global table of (Unk_38+Unk_3a)*4
    entries. - `sub r0,#0x90` subtracts 0x90 before passing the index to battleObject_getByIndex_813B780, consistent
    with converting a packed (base+slot) into a battle-actor index. - The result is dereferenced at offset 3 (`ldrb
    r0,[r0,#3]`) which on the BattleObject is the Type byte (ObjectHeader.TypeAndSpriteOffset high nibble, offset
    0x3). - Final `sub r0,#1` then `bl sprite_setPalette` stores (Type-1) into the sprite''s palette byte (sprite_setPalette
    writes object sprite +0x4). - All eight callers pass r5/r6/r10 in their contracts and feed this function with
    r6 as a battle object pointer (per `sub_811842C`/`sub_811847C`/...), confirming a per-frame/per-phase'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x081185E4

    '
  result: the body read as described above
