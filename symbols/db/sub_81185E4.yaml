open_questions:
- The exact object type r6 points to (likely AIData, but could be a small wrapper).
- 'The semantics of the `sub r0, #0x90` before `getByIndex`: index-sentinel vs. palette bias.'
- What the two summed u16s represent (Unk_38 + Unk_3a of AIData could be a row+col index, a frame counter pair,
  etc.).
- Why the same caller in 40 captures shows identical args — the captured frames may all sample the same game tick.
