name: rfu_handleConnTimeout
address: '0x08145FFC'
kind: function
status: probable
summary: 'RFU link-state watchdog: times out a pending-connection slot, then forces a disconnect and fires
  the connection callback with error 0x25.'
interface: (r0 = unused/ignored) -> r0 = undefined; saves/restores IME, mutates eStruct200FE00 state fields,
  may call rfu_forceDisconnect and the connection callback
details: Runs with interrupts masked (IME saved/cleared/restored). If the link state byte eStruct200FE00+0x4
  is 0xF (awaiting response), it decrements the per-slot countdown halfword at +0x28 + (+0x10)*2; when
  it reaches 0 (or the partner status halfword read via dword_2010CB0[+0x10] equals 0x27), it calls sub_81464D4,
  advances the state to 0x18 (disconnecting), clears slot 4 via rfu_clearSlot, clears the slot's bit in
  the +0x24 mask, and zeroes the countdown. In state 0x18 it optionally calls sub_81464D4 again (when
  +0x2 == 1), and once +0x2 reaches 0 it zeroes +0x5 and +0x4, calls rfu_forceDisconnect with the uid
  bytes from dword_2010CC0, and invokes rfu_fireConnCallbackAndClearState(0x25, 1) to report the failed/terminated
  link and clear the +0x14/+0x16 state halfwords. This is the timeout/failure path of the connection state
  machine, driven repeatedly by sub_81453F0.
