name: battle_bombFallUpdate
address: '0x080DDD30'
kind: function
status: probable
summary: 'Per-frame update for a falling bomb battle object: moves it via velocity each frame, then on
  landing explodes, shakes the camera, and cracks the panel.'
interface: (r5 = battle object) -> void; sets oBattleObject_CurAction=4 and clears phase on landing, clears
  object flag bit 1
details: 'Decrements oBattleObject_Timer; while it counts down, adds XVelocity/YVelocity to X/Y and subtracts
  ZVelocity from Z, and every other frame (Timer & 4) highlights the panel under the bomb via object_highlightPanel.
  When the timer hits 0, it recomputes pixel coordinates from panel coordinates, zeroes Z, and reads the
  panel status via object_getPanelParameters; if the panel is usable (status & 0xF800010 == 0, i.e. not
  a hole/void panel), it spawns effect object #5 (explosion), plays SOUND_HIT_BOMB_1, triggers camera
  shake (magnitude 1, duration 15), cracks the panel, and sets collision region 1. Finally it transitions
  the object to CurAction 4 with phase 0 and clears bit 1 of oObjectHeader_Flags. r5 is the object pointer
  throughout, so callers must set it up (this is a state-handler called via the battle object update table).'
