name: object_removePanelReserve
address: '0x0801BB46'
kind: function
status: confirmed
summary: Releases a battle panel previously reserved by a given object, clearing its reserver pointer and reserved
  flag.
interface: int object_removePanelReserve(panelLookup r0/r1, void *requestingObject r5); returns 1 if the reservation
  was cleared, 0 otherwise; N/Z reflect the boolean result, C/V carry over from the reserver comparison on failure/success
  paths
details: 'Looks up the panel data at the position described by the r0/r1 arguments (via object_getPanelDataOffset).
  If no panel exists there, or the panel''s oPanelData_ReserverObjectPtr does not match the requesting object in
  r5, returns 0 without modifying anything. If the panel is reserved by the requesting object, writes NULL to oPanelData_ReserverObjectPtr
  and clears bit 0x80 in oPanelData_Flags, then returns 1. This pairs with the panel reservation system used when
  objects (e.g. battlefield obstacles, holes, cracked-panel effects) claim a panel tile so others won''t treat it
  as free; this call is the "give the panel back" half. Quirk: callers receive leftover register/flag state that
  varies by exit path - on failure r1 holds the panel''s reserver pointer (or whatever object_getPanelDataOffset
  left there if no panel was found), on success r1 holds the updated panel flags and r2 the cleared mask 0x80; C/V
  come from the reserver cmp on the two non-early paths.

  '
