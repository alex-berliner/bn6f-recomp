name: tryStartNotificationCutscene_8035054
address: '0x08035054'
kind: function
status: confirmed
summary: Checks that the player has normal control and no cutscene is active, then starts the one-time "notification"
  cutscene (guarded by event flag 0x171A); returns 0 if it started, 1 otherwise.
interface: int tryStartNotificationCutscene(void); // returns 0 = cutscene started, 1 = blocked; preserves r2,r4-r7;
  reads GameState via toolkit in r10
details: "Gate function for the one-time notification cutscene (CutsceneScriptNotification_809AE68).\nThe cutscene\
  \ is only allowed to start when all of the following hold:\n  1. IsNotSlipRunningAndNotInCutscene returns nonzero\
  \ (Slip/Beast mode overlay not running AND no cutscene already active),\n  2. the byte at GameState+oGameState_Unk_12\
  \ is not 0xFF (unknown state byte; 0xFF blocks the notification),\n  3. event flag EVENT_171A is not yet set.\n\
  If all conditions pass, it calls StartCutscene(script=CutsceneScriptNotification_809AE68, param=r1) and\npresumably\
  \ the script itself (or the cutscene system) sets EVENT_171A, making this fire only once per save.\nQuirk: the\
  \ cutscene's u32 parameter is whatever r1 TestEventFlagFromImmediate left behind (0x1A, the low\nhalf of the flag\
  \ id) — effectively an accident of register reuse rather than a meaningful parameter.\nThe r2/r4-r7 \"inputs/outputs\"\
  \ in the contract are just preservation across the call chain; the function\nitself takes no meaningful arguments.\n"
