name: tryStartNotificationCutscene_8035054
address: '0x08035054'
kind: function
status: confirmed
summary: Checks that the player has normal control and no cutscene is active, then starts the "notification" cutscene
  (the comm-error text) if event flag 0x171A requests it; returns 0 if it started, 1 otherwise.
interface: int tryStartNotificationCutscene(void); // returns 0 = cutscene started, 1 = blocked; preserves r2,r4-r7;
  reads GameState via toolkit in r10
details: "Gate function for the notification cutscene (CutsceneScriptNotification_809AE68, which fades the screen,\
  \ respawns the map's NPCs and shows TextScriptCommError873B9E0).\nThe cutscene starts only when all of the following\
  \ hold:\n  1. IsNotSlipRunningAndNotInCutscene returns nonzero (Slip/Beast mode overlay not running AND no cutscene\
  \ already active),\n  2. the byte at GameState+oGameState_Unk_12 is not 0xFF (unknown state byte; 0xFF blocks\
  \ it),\n  3. event flag EVENT_171A is SET (beq after TestEventFlagFromImmediate skips when Z is set, i.e. when\
  \ the flag is clear). Text scripts set EVENT_171A (ts_flag_set in CompText876A5B4, CompText8772974, CompText8781048),\
  \ so the flag is a request for the notification.\n(An earlier version of this entry said 'not yet set'; that was\
  \ wrong.)\nIf all pass, it calls StartCutscene(script=CutsceneScriptNotification_809AE68, param=r1).\nQuirk: the\
  \ cutscene's u32 parameter is whatever r1 TestEventFlagFromImmediate left behind (the flag's bit mask), an accident\
  \ of register reuse rather than a meaningful parameter.\nThe r2/r4-r7 \"inputs/outputs\" in the contract are just\
  \ preservation across the call chain; the function itself takes no meaningful arguments.\n"
