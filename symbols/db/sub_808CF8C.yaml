open_questions:
- Why the chatbox+0x4C slot? The chatbox struct has `MugshotColorFilter_40` documented at 0x40,
- not 0x4C; 0x4C is listed as `Unk_4C`. The name and exact meaning of the slot the value lands in
- is uncertain — a quick disassembly of `chatbox_*` writers and any palette/mugshot routines using
- chatbox+0x4C would settle it.
- Whether this is mugshot-related at all (versus some other chatbox field) — the SFX 0x122 and the
- gating on event 9D9 hint at a story moment, possibly a specific character speaking in the
- post-game / Falzar storyline, but the actual story context is not deducible from this function
- alone. Checking `EVENT_9D9`'s setter and the call sites of `sub_808CC34` would pin this down.
