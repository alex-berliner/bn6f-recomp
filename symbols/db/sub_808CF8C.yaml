name: sub_808CF8C
address: '0x0808CF8C'
kind: function
previous_names: []
status: hypothesis
summary: If event flag 9D9 is set, copies a battle object's ID-word (low half) into the chatbox MugshotColorFilter
  slot (offset 0x4C) and plays sound effect 0x122, returning 1; otherwise returns 0
interface: (r5 = some battle object, r10 = toolkit) -> r0 = 1 if flag set else 0 ; may play SFX, may clobber r0/r1/r2/r3
details: "- On entry, r4 is forced to 0 and `TestEventFlagFromImmediate` is asked about flag `EVENT_9D9` (two-byte\n\
  \    flag literal emitted by the `movflag` macro ahead of the call).\n  - If the flag is unset, zf is set after\
  \ `TestEventFlagFromImmediate` and execution jumps to `loc_808CFAC`,\n    returning the 0 that was preloaded into\
  \ r4.\n  - If the flag is set, r1 is loaded from `oToolkit_ChatboxPtr` via r10; r2 = 0x4C; r0 is the halfword\
  \ at\n    `r5 + 6` (i.e. `oBattleObject.Chip` / the packed NameID-and-Chip low half of the battle object\n   \
  \ passed in r5). That value is stored as a word into the chatbox at offset 0x4C, which the chatbox\n    struct\
  \ defines as `MugshotColorFilter_40`... wait, the chatbox's documented `MugshotColorFilter` slot\n    lives at\
  \ 0x40, but the code writes to 0x4C, which is in the chatbox's `Unk_4C` field — so this is more\n    likely an\
  \ `Unk_4C` chatbox slot repurposed as a mugshot color/filter driver.\n  - Then `PlaySoundEffect(0x122)` is called\
  \ (the literal `0x122` is at `dword_808CFB4`) and r4 is set to\n    1, which becomes the return value at `loc_808CFAC`\
  \ via `mov r0, r4; tst r0, r0; pop {r4,pc}`.\n  - The `tst r0, r0` only affects flags, so the contract says nz/c/v\
  \ may be written but the meaningful\n    return is r0 (1 or 0).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `movflag EVENT_9D9` followed by `bl TestEventFlagFromImmediate` and a `beq` shows the gating on event
    flag 0x9D9 (assembly lines 1727..1730). - `ldr r1, [r10,#oToolkit_ChatboxPtr]` shows the chatbox is fetched
    through r10''s toolkit pointer (chatbox offset 0x2C in the toolkit struct). - `mov r2, #0x4c ; ldrh r0, [r5,#6]
    ; str r0, [r1,r2]` writes the battle object''s +6 halfword into chatbox+0x4C. - `ldr r0, dword_808CFB4` followed
    by `bl PlaySoundEffect` plays the SFX whose ID is the 32-bit literal at 0x0808CFB4 (= 0x122). - Return path
    `mov r0, r4 ; tst r0, r0 ; pop {r4,pc}` returns r4 (1 if branch was taken, else 0). - r5 holds a battle object:
    r5 is in the in-set and the caller `sub_808CC34` passes r5 through; the halfword at offset 6 in `BattleObject`
    is the union of `NameID` (0x28) and `Chip` (0x2A), so the halfword read here is actually two bytes into the
    object header (Unk_06 area). The exact battle'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0808CF8C

    '
  result: the body read as described above
