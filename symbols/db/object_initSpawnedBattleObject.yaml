  date: '2026-10-18'
  detail: 'opens with object_setCoordinatesFromPanels and strh r0=8,[r5,#oBattleObject_Z16], then sprite_load(8,0x10,0xF)
    + sprite_noShadow; sets oBattleObject_CurAnim/CurAnimCopy to 1 and calls sprite_setAnimation/sprite_loadAnimationData/sprite_setPalette/object_getFlip+sprite_setFlip;
    object_createCollisionData result tested; failure path calls object_freeMemory and returns early;
    success path: object_setupCollisionData(4,5,3), object_setCollisionStatusEffect1(0x50), object_setCollisionHitEffect(2),
    object_clearCollisionRegion, object_presentCollisionData; ends by storing CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized,
    the standard handoff to the object''s update state'
