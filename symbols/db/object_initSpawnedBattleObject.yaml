name: object_initSpawnedBattleObject
address: '0x080D6DB0'
kind: function
status: probable
summary: 'One-time spawn initializer for a battle object: positions it from its panel, loads its sprite/animation,
  allocates collision data, and hands it to the update state.'
interface: (uses r5 = battle object pointer) -> r0 = clobbered; object's CurState set to CUR_STATE_UPDATE
  on success, object freed on failure
details: Runs on a battle object held in r5 (the callee-style helpers read r5). It first snaps the object
  to its panel coordinates, stores Z=8, loads sprite id 8 with graphics 0x10/palette 0xF via sprite_load
  and disables its shadow, then sets an object flag bit 1 (likely 'initialized/active'). It selects animation
  1 (also copied to CurAnimCopy), loads the animation data, sets palette 0, applies facing via object_getFlip/sprite_setFlip,
  and allocates a collision slot; if allocation fails it frees the object and returns. On success it configures
  collision data with parameters (4,5,3), sets status effect 0x50 and hit effect 2, clears the collision
  region (so it doesn't collide until refreshed), runs one collision present-tick, and finally writes
  CUR_STATE_UPDATE into the state field so the per-frame update handler takes over.
evidence:
