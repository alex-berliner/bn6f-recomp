name: submenu_entryDelayTick
address: '0x08118030'
kind: function
status: probable
summary: Counts down a per-entry delay; when it expires, commits a pending value into the entry, halves
  a submenu counter, and re-renders the entry text.
interface: (r5 = pointer to submenu entry struct, no r0 use) -> r0 = clobbered; sets r5+0x14 from r5+0x10,
  clears r5+0x0A, halves sSubmenu+0x0D
details: A halfword timer at r5+0x12 is decremented and the function returns early while it is still >0
  (bgt). On expiry it copies the signed halfword r5+0x10 into r5+0x14 (likely a pending target such as
  scroll offset or state, applied after the delay), zeroes byte r5+0x0A (active/hold flag), and halves
  sSubmenu.unk_0D (a global counter/flag in the submenu state struct at 0x2009a30). It then calls sub_8118104,
  submenu_renderEntryText and sub_81181DC to update the visible entry list. Called presumably per-frame
  while an entry is in its delayed state; no caller is known, so the register convention (r5 as arg) is
  inferred from the callee-style code.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r5,#0x12]; sub r0,#1; strh; bgt locret — frame-countdown timer gating the update; ldrsh
    r0,[r5,#0x10]; strh r0,[r5,#0x14] — commits a pending signed value after the delay; ldr r0,off_8118310;
    ldrb r1,[r0,#0xD]; lsr r1,#1; strb — halves sSubmenu+0x0D, an animation/counter step; bl submenu_renderEntryText
    — refreshes the entry's list text after the state change; strb r0,[r5,#0xA] with r0=0 — clears an
    active/hold byte once the delay finishes
