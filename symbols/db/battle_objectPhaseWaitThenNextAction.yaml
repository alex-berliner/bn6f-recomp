name: battle_objectPhaseWaitThenNextAction
address: '0x080BEB90'
kind: function
status: probable
summary: Battle-object phase handler that waits a timed delay (Param4 * 20 frames), then advances the
  object to action 4, phase 0.
interface: (r5 = battle object, no register args) -> r0 = clobbered; no return value; writes oBattleObject_Timer,
  oBattleObject_PhaseInitialized, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: Standard battle-object phase step routine using r5 as 'this'. On first invocation (PhaseInitialized
  == 0) it initializes Timer to Param4 * 0x14, i.e. Param4 counts units of 20 frames (thirds of a second),
  and marks the phase initialized with value 4. Each subsequent call decrements Timer; while it is still
  positive the call simply returns, so the object idles. When the countdown expires it sets CurAction
  = 4 and clears CurPhaseAndPhaseInitialized, handing control to the object's next action/phase. The trailing
  word off_80BEBB8 -> byte_80BEB20 suggests this function is one entry of a per-object action/phase dispatch
  table.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb [r5,#PhaseInitialized] / bne guard: init-once pattern that sets Timer = Param4*0x14 and
    stores 4 to PhaseInitialized (loc before 80BEBA4); ldrh Timer; sub #1; strh; bgt return: per-frame
    countdown, object waits until it hits zero; on expiry: mov r0,#4; strb [r5,#CurAction]; mov r0,#0;
    strh [r5,#CurPhaseAndPhaseInitialized] — transitions to action 4 phase 0; trailing .word byte_80BEB20:
    function is referenced by a table, consistent with a battle-object action/phase handler'
