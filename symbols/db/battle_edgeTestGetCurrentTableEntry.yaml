name: battle_edgeTestGetCurrentTableEntry
address: '0x080317DE'
kind: function
status: probable
summary: Computes an entity's position relative to a target, runs a half-plane test against a fixed edge,
  then returns a pointer into the current hit-area table entry with r1 cleared.
interface: (r0 = entity ptr, r1 = target/ref ptr) -> r0 = pointer to current table entry header + offset,
  r1 = 0; flags from the final add
details: First calls battle_calcRelPosToTarget_803172E to fill the shared scratch buffer with the entity's
  (and next-position's) coordinates relative to a doubled target point. It then sets up a fixed edge/point
  pair (0, 0x10)-(0xC, 0xC) in r2-r5 and calls math_pointCrossHalfPlaneTest_8031594, the inner test of
  the polygon/hit-area fill machinery. No branch is taken on that result, so within this function the
  test's side effect (scratch state) matters, not its return value. Finally table_GetCurrentEntryHeader_8031760
  is called on the dword_2011A20 table iterator, and r0+r1 yields a pointer to the current entry's payload
  with r1 = 0. Without any caller it is unclear whether callers chain this per-edge or ignore the half-plane
  result.
