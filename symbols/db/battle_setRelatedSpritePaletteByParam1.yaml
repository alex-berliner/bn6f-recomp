  values 1-4 represent in that context is unknown
- Whether the related object pointed to by RelatedObject1Ptr is always a sprite struct (assumed from sprite_setPalette's
  known behavior)
- The summary and behavior match the code well; r0 is used as scratch index, r5 holds the battle object,
  and the function correctly reads Param1 and dispatches palette to the related sprite. However, the proposed
  name `battle_setSpritePaletteByParam1` is fine but the table entries (1,2 / 2,4 / 4,6 / 3,8) suggest
  these are color/layer pairings, not just param1→palette mapping; the function name could be more specific.
  Also the interface comment says "r0-r4 unused" but r0 is actually used as the loop index (set from r3
  at `mov r0, r3`). A name like `battle_setRelatedSpritePaletteByParam1` is slightly more precise.
