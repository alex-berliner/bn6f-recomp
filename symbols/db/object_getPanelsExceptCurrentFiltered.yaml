name: object_getPanelsExceptCurrentFiltered
address: '0x0800CE64'
kind: function
status: confirmed
summary: Scans every field panel and collects those matching required/forbidden attribute bitmasks (excluding the
  object's own panel) into a caller-supplied list, returning the entry count.
interface: u32 battle_object_collectMatchingPanelsExceptSelf_800CE64(u32 r5_battleObject, u32 r2_requiredAttrs,
  u32 r3_forbiddenAttrs, u32 r7_outList)
details: "Iterates x from 6 down to 1 and y from 3 down to 1, covering the standard 6x3\nbattle field. For each\
  \ (x,y) it calls object_getPanelParameters to fetch the\npanel's attribute bitmask, then filters it:\n  * skip\
  \ if (attrs & r3_forbiddenAttrs) != 0\n  * skip if (attrs & r2_requiredAttrs) != r2_requiredAttrs (i.e. any required\n\
  \    bit missing, including r2 == 0 which trivially matches)\n  * skip if (x,y) equals the object's own panel\
  \ read from\n    oBattleObject_PanelX / oBattleObject_PanelY at r5\nEach surviving panel is packed as (y << 4)\
  \ | x and written as a single byte\nto r7_outList[count]. Returns the final count in r0. r4 is used as a scratch\n\
  that is preserved across the object_getPanelParameters call (pushed/popped\ntogether with r0-r3,r6,r7), so the\
  \ outer ABI sees r2/r3/r4/r6/r7 preserved\non exit while r0 holds the count and NZ flags reflect the final add.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
