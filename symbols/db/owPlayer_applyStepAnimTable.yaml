name: owPlayer_applyStepAnimTable
address: '0x0809B7A4'
kind: function
status: probable
summary: Indexes a 4-byte table via a byte from [r10+0x3c]+4, writes entry[0..1] into r5+4/+5, sets the
  overworld player facing via entry[0], stores entry[2] as a fixed animation id via owPlayer_setS200ace0_fixedAnimationSelect_809e13c,
  then clears byte [r10+0x14]+0x10 and returns 0.
interface: (r0 unused; r10 struct supplies index and state pointer, r5 = target struct) -> r0 = 0
details: 'Reads a byte at +4 of the struct at [r10+0x3c], multiplies by 4, and indexes table byte_809B7D4
  (entries: {0x32,5,1,0xFF}, {0xA,5,1,0xFF}, {0xFF...}, {0x14,5,1,0xFF}, {0x1E,3,7,0xFF}, {0x28,3,7,0xFF}).
  Copies entry bytes 0 and 1 to [r5+4] and [r5+5]. Passes entry byte 0 to SetOWPlayerFacingDirection and
  entry byte 2 to owPlayer_setS200ace0_fixedAnimationSelect_809e13c, which stores the animation id into
  eStruct200ace0 and raises EVENT_1719. Finally zeroes byte +0x10 of the struct at [r10+0x14] (likely
  a step/progress counter) and returns 0. The 0xFF-filled third table slot looks like a terminator/no-op
  entry. Fits a cutscene/script-driven player pose change, matching the beastsp recorded route.'
