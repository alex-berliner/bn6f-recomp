name: custMenuPressOK_8028D3A
address: '0x08028D3A'
kind: function
status: confirmed
summary: Handles confirming with OK in the Custom Screen menu, running the chosen action handler, switching state,
  and playing the select sound.
interface: Next custMenuPressOK_8028D3A(void); r5 in = menu state struct (oS20364C0_*), r0 out = 0, Z set
details: 'Called when the player presses OK on the custom screen menu. r5 points at the menu state struct. It first
  calls sub_8029110 and sub_80293F8 as pre-OK bookkeeping. Then, if the byte at oS20364C0_Unk_19 is nonzero it calls
  sub_802937A with that byte in r0; otherwise, if the halfword at oS20364C0_Unk_3a is nonzero it calls sub_80293B0
  with that halfword in r0, dispatching whichever of the two highlight/selection handlers applies to the current
  selection state. Afterwards it hands control back to the custom menu main loop (custMenuMainMaybe_8026A88 dispatch)
  by storing 8 into the jump offset byte at r5+1 (oS20364C0_JumpOffset01) and clearing the halfword counter at r5+2
  (oS20364C0_Unk_02). It plays SOUND_SELECT_82 via PlaySoundEffect and returns 0 in r0 with Z set. Returns via pop
  {pc} to the LR captured on entry, so entry LR must survive the guest calls. Clobbers r0-r3, r12, lr, and flags
  per the guest calls; preserves r4-r7 per the contract.

  '
