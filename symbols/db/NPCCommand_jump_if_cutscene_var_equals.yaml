name: NPCCommand_jump_if_cutscene_var_equals
address: '0x0809F2A2'
kind: function
status: confirmed
summary: 'NPC script opcode: conditional jump to a script word when a cutscene-state byte equals a script-provided
  expected value, else advance past the 7-byte instruction.'
interface: void NPCCommand_jump_if_cutscene_var_equals(u32* r10 /*toolkit*/, u8* r6 /*script cursor*/) -> (u8* r6
  /*new script cursor*/); clobbers r0,r1,r2,r3,r4,lr; flags NZCV set by cmp.
details: 'Pulls a 32-bit cutscene-state pointer from the toolkit struct at oToolkit_CutsceneStatePtr

  (via r10). Reads two script bytes at r6+1 (var_index) and r6+2 (expected) and indexes the

  cutscene state array by var_index, comparing the actual byte to expected. On match, hands

  (r6+3) to ReadNPCScriptWord, whose return value becomes the new script cursor in r6; on

  mismatch, simply bumps r6 by 7 to step over the whole 7-byte instruction. Instruction

  layout is therefore [op, varIndex, expected, offsetWord(3 bytes)].


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
