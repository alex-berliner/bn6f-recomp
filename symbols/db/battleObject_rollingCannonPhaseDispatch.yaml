name: battleObject_rollingCannonPhaseDispatch
address: '0x080CC23E'
kind: function
status: confirmed
summary: Tail-calls the per-phase handler for a rolling-cannon battle object, dispatching on the object's current
  phase via a 4-entry jump table.
interface: 'void battleObject_rollingCannonPhaseDispatch(r2 arg, r5 obj, r10 arg) — tail-dispatch: handler at table[obj->CurPhase]
  runs with r0=phase, r1=handler addr, r2/r5/r10 passed through; handler''s results (r1 r5 r8-r12) are this function''s
  results'
details: "Reads the battle object's current phase from [r5 + oBattleObject_CurPhase] (byte), uses it\nto index the\
  \ table at off_80CC250, and invokes the selected handler via the classic\n`mov lr, pc; bx r1; pop {pc}` thunk:\
  \ the handler returns directly to this function's\ncaller, making the whole thing a tail call. The handler is\
  \ entered with r0 = phase,\nr1 = handler address (still live from the table load), r2/r5/r10 forwarded unchanged,\n\
  so the dispatcher itself is stateless and its \"outputs\" are whatever the handler leaves\nbehind. Phase table\
  \ (off_80CC250, 4 entries, thumb+1 addresses):\n  phase 0 -> sub_80CC260 (idle/unnamed main handler)\n  phase\
  \ 1 -> battleObject_rollingCannonPhase_Init_80CC29E (initialization phase)\n  phase 2 -> loc_80CC320 (unnamed\
  \ phase 2 body)\n  phase 3 -> battle_phaseAppear (shared \"object appears\" phase, presumably used by\n      \
  \       all spawned battle objects)\nNo flags are meaningful on exit (handler-clobbered). Phase count is exactly\
  \ 4; any\nphase byte >= 4 would read past the table, so callers are expected to keep CurPhase\nin range.\n"
