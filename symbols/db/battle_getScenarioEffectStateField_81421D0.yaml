summary: Returns the byte at offset 0xB of the scenario/effect state (eScenarioEffectState2000780).
interface: () -> r0 = byte at state + 0xB ; no side effects
details: "Loads the static address `eScenarioEffectState2000780` (a global EWRAM byte array at\n  0x02000780)\
  \ into r5, then performs a single `ldrb r0, [r5, #0xb]`, reading byte 0xB of\n  that state. Returns\
  \ that byte directly in r0; the `push {r4-r7,lr}` / `pop {r4-r7,pc}`\n  pair is a no-cost leaf-frame\
  \ trick (lr saved into the saved-PC slot of the pop). The\n  eight named callers (e.g. 0x08089704, 0x080a86b4,\
  \ 0x0811e2b4, 0x081429ca) all read this\n  byte as a flag/selector that varies per frame in the captured\
  \ beastspecialization samples.\n"
