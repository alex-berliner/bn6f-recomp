summary: AI-state jump-table dispatcher for a battle object; indexes one of three routines using byte
  at r5+8 (the object's CurState) and tail-calls it via `mov lr,pc; bx`.
interface: (no explicit params; r5 = battle object, r10 = toolkit) -> r0 = result of dispatched routine;
  tail-call (no return), caller pushes lr and pops pc
details: "- Loads the address of an inner jump table at `off_8117EDC` from `off_8117ED8`, then indexes\
  \ it by `ldrb r1,[r5,#8]`, i.e. `BattleObject.CurState` (object_header+8 in BattleObject struct).\n\
  \  - Builds `r0 = table[CurState]` and does `mov lr,pc / bx r0` — this is the standard Thumb tail-call\
  \ pattern; the final `pop {pc}` only fires if the BX somehow didn't take control. So callers treat this\
  \ as a `bl`-like call.\n  - Three targets: `sub_8117EE8+1` (entry 0, CUR_STATE_INITIALIZE), `sub_8117F78+1`\
  \ (entry 4, CUR_STATE_UPDATE), `sub_81180FC+1` (entry 8, CUR_STATE_DESTROY). These are the AI/state\
  \ lifecycle handlers for a specific battle object type.\n  - The captured calls all show r0=0x08117ec9,\
  \ r1=0x3c, lr=0x080465e0 — that lr is the canonical return site used by every call to this dispatcher,\
  \ strongly suggesting it sits inside the per-frame battle-object update loop. The `r1=0x3c` value is\
  \ consumed by the dispatched routine, not by the dispatcher itself.\n  - `r5` is preserved across the\
  \ call (it's in the contract as both in and out) — required because the dispatcher uses it only for\
  \ the byte read and the called routine likely also expects the object pointer in r5.\n"
