name: battle_objectTickWithExtraHandler_8109F6A
address: '0x08109F6A'
kind: function
status: confirmed
summary: Per-frame update for a battle object; runs the object's phase-0 extra handler (if any), then advances its
  phase logic.
interface: void battle_objectTickWithExtraHandler(battle_object_t* obj /* r5 */); no useful return value (r0 holds
  the last callee's result)
details: 'r5 points at a battle object structure. The current phase byte is read at oBattleObject_CurPhase; when
  it is still 0, the function calls the helper sub_800AA40 with r0 = the pointer stored in the object''s second
  extra variable (oBattleObject_ExtraVars+4) — that field appears to hold a per-object handler/callback invoked
  during the initial phase. Regardless of phase, sub_80165C2 is then called to perform the regular phase tick (it
  reads r0, which after the phase-0 branch carries the handler call result / phase byte). The routine is a pure
  tail-style dispatcher: it preserves nothing and just pops pc. The register contract is uninformative (everything
  listed as in/out), consistent with r5 being an agreed-upon object pointer rather than a normal argument.

  '
