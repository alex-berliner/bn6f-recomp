name: object_updateCollisionData
address: '0x0801A082'
kind: function
status: probable
summary: Refreshes a battle object's collision record (hit modifier, pending damage, both sides' collision type
  flags) and re-evaluates it, marking bit 16 while time is stopped.
interface: void object_updateCollisionData(u32 ownElement /*r1*/, u32 otherElement /*r2*/, u8 hitModifier /*r3*/,
  BattleObject* obj /*r5*/); clobbers r0-r3,r6,r7(saved),lr; sets nz cv from battle_isTimeStop path
details: 'r5 points to the battle object whose oBattleObject_CollisionDataPtr is loaded; the record (oCollisionData)
  is refreshed in place: r3 is stored as oCollisionData_HitModifierBase, the object''s oBattleObject_Damage halfword
  is copied into oCollisionData_SelfDamage. Then object_getTableEntry_801A0BA is called twice with the object''s
  oBattleObject_Alliance (r0) and the caller-supplied element keys: r1 as the object''s own element (result stored
  to oCollisionData_SelfCollisionTypeFlags) and r2 as the opposing element (stored to oCollisionData_TargetCollisionTypeFlags).
  If battle_isTimeStop() returns nonzero (time frozen), 0x10000 is OR-ed into oCollisionData_SelfCollisionTypeFlags
  and r1 is left holding 1<<16 as a side-channel input to sub_8019F44, which is finally called with r0 = collision
  record pointer to re-evaluate the collision. r4 and r7 are saved/restored; r4''s incoming value is passed through
  to the getTableEntry calls only as the scratch copy of r2 (mov r4, r2), not used after.

  '
