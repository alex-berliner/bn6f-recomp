name: initGuiTopRightSprite
address: '0x0811E59C'
kind: function
status: probable
summary: Initializes a fixed GUI sprite object (type 0x23) at the top-right of the screen with no shadow,
  animation 0, and palette 0.
interface: (r0 unused?, r5 = object struct base) -> r0 = clobbered; [r5]=0x23, [r5+8]=4
details: 'Writes object type/id 0x23 to [r5] and 4 to [r5,#8], then calls initGuiSprite_8002770 with 0x3a
  to create the sprite resource. Configures the sprite: animation 0 via sprite_setAnimation + sprite_loadAnimationData,
  sprite_noShadow, halfword 0x280 stored via the slot list, sub-entry palette bank 0xa, palette 0, sub-record
  field A 0, and priority 0. Finally positions it at (0xd8, 0xe) = (216, 14), top-right of the 240x160
  screen, before tail-calling the still-unknown sub_811E5EC. The r5 base register implies the caller passes
  the object struct in a nonstandard register, so the calling convention is unusual.'
