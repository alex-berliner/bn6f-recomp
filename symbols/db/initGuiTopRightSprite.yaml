- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0,#0x23; strb r0,[r5] then initGuiSprite_8002770 with 0x3a: creates a specific GUI object;
    sprite_setCoordinates(0xd8,0xe): fixed position 216,14 — top-right of the GBA screen; sprite_noShadow
    + sprite_setPriority(0): overlays-style rendering with no ground shadow; slotList_storeHalfwordAndClearField_800306C
    with 0x280: stores a constant into a sprite slot field; strb #4,[r5,#8]: sets a state/flag byte on
    the object struct before the unknown tail call'
