name: object_dieOrUpdateCollision_80CC562
address: '0x080CC562'
kind: function
status: confirmed
summary: Handles a battle object's death tick or collision refresh - removes and respawns its collision data with
  a death effect, and if the battle is over, clears its collision region and marks it destroyed.
interface: void object_dieOrUpdateCollision(u32 r4, BattleObject* r5, u32 r7, u32 r8, u32 r10); // r5 and r8 are
  in/out via callees; r4/r7 passed through; clobbers r0-r3, lr, flags
details: 'Runs the per-object death/collision update in the battle engine. r5 is the battle object pointer (oBattleObject
  struct) and is the argument every callee receives; r4/r7 carry additional object context and r8 is collision scratch
  state that callees keep up to date; r10 is the battle toolkit pointer, preserved throughout. Sequence: object_removeCollisionData
  drops the object''s current collision data (possibly retargeting r5), then object_spawnCollisionEffect spawns
  the object''s removal/damage effect. If battle_isBattleOver returns 0 (battle still running), the object''s present
  collision data is rebuilt via object_presentCollisionData. Otherwise (battle finished) object_clearCollisionRegion
  empties the collision region and the object''s state field oBattleObject_CurStateActionPhaseAndPhaseInitialized
  at [r5] is set to CUR_STATE_DESTROY, marking the object destroyed. The r5/r8 outputs are produced entirely inside
  the callees; the function itself only writes the destroy state in the battle-over branch.

  '
