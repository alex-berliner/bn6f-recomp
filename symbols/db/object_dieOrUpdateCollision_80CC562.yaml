open_questions:
- Whether the "battle not over" path's clearCollisionRegion+CUR_STATE_DESTROY is meant for this-frame
  deletion or a deferred kill; the precise object subtype (r5 is treated as a generic BattleObject* by
  all callees, so no t1/t3/t4 distinction can be inferred here).
- Why `CUR_STATE_DESTROY` is set unconditionally with `CUR_STATE_DESTROY (0x08)` while the other three
  state bits aren't touched; may rely on prior zeroing or only matters combined with CurAction already
  set.
