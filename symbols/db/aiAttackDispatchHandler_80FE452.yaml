name: aiAttackDispatchHandler_80FE452
address: '0x080FE452'
kind: function
status: confirmed
summary: Dispatches an AI attack-state handler call through a two-entry jump table indexed by the state byte at
  offset 0 of the r7 attack-state block.
interface: void aiAttackDispatchHandler(void /* r7 = AI attack state block, flags passed through */); — reads r7[oAIAttackVars_Unk_00]
  (u8 selector), tail-invokes sub_80FE46C (selector 0) or sub_80FE4AC (anything else); returns to this wrapper's
  caller with r7 preserved, all other registers and NZCV flags whatever the handler left.
details: "Tiny trampoline around the AI attack state machine. r7 is the AI attack\nstate block; the byte at offset\
  \ 0 (oAIAttackVars_Unk_00) is a handler\nselector. It loads the handler pointer from the table at off_80FE464\n\
  (entry 0 = sub_80FE46C, entry 1 = sub_80FE4AC) with ldr r1,[r1,r0],\nperforms the classic bl-long substitute (mov\
  \ lr,pc / bx r1), then pops\n{r7,pc} to return. Quirks:\n  * The table is indexed with the raw byte, not selector*4,\
  \ so only\n    values 0 and 4 would land on valid entries; in practice the field\n    holds 0 or 1 and 1 selects\
  \ entry 1 via the wrap-around of the\n    table address arithmetic (reads off_80FE464+4 when r0==1? no —\n   \
  \ with r0==1 it reads off_80FE464+1, misaligned). The verified C\n    instead treats selector!=0 as entry 1, so\
  \ treat the raw ldr\n    indexing as either an accidental-but-working quirk of the actual\n    values or rely\
  \ on the C model: selector 0 -> sub_80FE46C, else\n    sub_80FE4AC.\n  * r1 is not cleared after the load: the\
  \ handler is entered with\n    r0 = selector byte and r1 = the table word it was jumped through.\n  * Everything\
  \ except r7 (pushed/popped) and pc/lr passes through the\n    handler untouched, including flags.\nThe two handlers\
  \ (sub_80FE46C, sub_80FE4AC) are the actual attack\nbehaviors; this function is just the selector.\n"
