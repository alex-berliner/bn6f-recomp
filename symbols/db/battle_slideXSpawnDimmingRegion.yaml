name: battle_slideXSpawnDimmingRegion
address: '0x080BBB18'
kind: function
status: probable
summary: Spawns a dimming collision-region object at the sliding battle object's current panel, passing
  its element and a fixed parameter set.
interface: (r0/r1/r2 = object pointer in r5 convention; reads oBattleObject_PanelX/PanelY/Element/DamageAndStaminaDamageCounterDisabler)
  -> r0 = spawned region object from object_spawnDimmingCollisionRegion; flags clobbered
details: Reads the object's panel X/Y and its Element field, then calls object_spawnDimmingCollisionRegion
  with r0=panelX, r1=panelY, r2=element, r3=0, r4=0x6050A01, r7=3, and r6 taken from the object's DamageAndStaminaDamageCounterDisabler
  field. The literal 0x6050A01 looks like a packed parameter blob (dimming/region settings) for the collision
  region rather than a pointer, and r7=3 is likely a lifetime or layer value. The callee marks the spawned
  region to keep updating during timestop. Its only caller is battle_slideXMovePhase, so this is the effect
  deposited by a sliding object at its panel, with the element presumably selecting the region's appearance
  or behavior.
