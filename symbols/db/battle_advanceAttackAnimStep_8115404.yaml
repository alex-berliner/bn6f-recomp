name: battle_advanceAttackAnimStep_8115404
address: '0x08115404'
kind: function
status: confirmed
summary: Per-frame battle-AI update that checks whether the current attack animation has finished, decrements
  the step timer, and on expiry refreshes collision data and exits the attack state.
interface: void battle_advanceAttackAnimStep(u32 r5_battleObj, u32 r7_attackVars); /* out r1; clobbers
  r0,r2,r3,r6,r7,nzcv,lr; preserves r4 */
details: 'Reads byte field oBattleObject_CurAnim on the battle object (r5); if non-zero it calls sprite_getFrameParameters
  and tests bit 7 of the returned r0. When that bit is set the animation is considered complete and CurAnim
  is cleared to 0. Regardless of the animation check, decrements the halfword oAIAttackVars_StepTimer
  (r7) by 1. When the unsigned result wraps below zero (bge fails), it calls object_updateCollisionData
  with mode args (r1=1, r2=2, r3=3, r5=battleObj) then object_exitAttackState with the updated r6/r7 from
  the collision call, transitioning the battle object out of its attack sub-state. Returns whatever value
  ends up in r1 (pass-through of caller''s r1 on the early path, or the result from object_exitAttackState
  on the timeout path). Fields touched: oBattleObject_CurAnim (byte), oAIAttackVars_StepTimer (halfword).

  '
