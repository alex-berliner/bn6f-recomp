name: handleDriveOutEvents_803522E
address: '0x0803522E'
kind: function
status: confirmed
summary: Scans a hardcoded {trigger, flag} table and sets the matching story/quest flag when the given
  event ID is found
interface: u16 handleDriveOutEvents(u32 event /* r0 */); // returns final loaded trigger word in r1 (0xFFFF
  sentinel on exit), flags CV set by `cmp r1,
details: 'Walks a table at word_8035250 consisting of repeating {trigger_id u16, flag_id u16}

  entries terminated by the sentinel trigger id 0xFFFF. For each entry whose

  trigger_id matches the event id passed in r0, calls SetEventFlag with that

  entry''s flag_id. The table bundled here drives the following mappings:

  1->0x21A, 2->0x21B, 3->0x21C, 4->0x21D, 5->0x21E, 6->0x21F, 7->0x220,

  0x8D->0x221. The "name" suffix 0x21A..0x221 corresponds to the

  "drive-out" (encounter / cross-area leaving) event flag range, so this is

  almost certainly the dispatcher fired when an encounter-style drive-out

  triggers its associated quest/story flag. Preserved registers r4-r7 plus lr

  match the standard prologue/epilogue.

  '
