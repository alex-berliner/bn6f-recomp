name: sprite_tickWithFlagReset_80A4C46
address: '0x080A4C46'
kind: function
status: confirmed
summary: Ticks a sprite object's animation, resetting byte +8 to 8 when the current frame carries the 0x80 parameter
  flag.
interface: void sub_80A4C46(int unused /*r4*/, SpriteObj* sprite /*r5*/); returns sprite_update's flags and r0-r3
details: Sprite animation tick for an object at r5. Calls sprite_getFrameParameters (which likely reads r0-r3 frame
  state internally) and checks bit 0x80 of the returned frame-parameter word; if set, stores 8 into the sprite object's
  byte at offset +8, which looks like a sub-action/animation/counter field being reloaded at a marked key frame.
  Then unconditionally calls sprite_update to advance the sprite's animation. r4 is passed through but never used,
  suggesting a dropped or optional context argument; r5 is the only structure touched. Final flags and r0-r3 are
  whatever sprite_update leaves behind.
