summary: Thin thunk that tail-calls sub_814692C with no arguments.
interface: void sub_813D5DC(void); // tail-call to sub_814692C, no params, no return value
details: 'A three-instruction wrapper. It pushes lr, branches-and-links to

  sub_814692C, then pops pc into the return address, making it a literal

  tail call. No register is loaded from or written to between the two,

  so callers observe the same input/output contract as sub_814692C itself.

  The disassembly''s register contract lists lr as the only "input" and

  a wide set of r4..r12 as "outputs", which simply reflects that the

  thunk neither reads nor writes any callee-preserved register; all the

  listed callee-saved regs only reach the caller because the called

  function frees them on the way back. No globals or memory are touched

  directly here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
