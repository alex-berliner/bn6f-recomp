name: battle_getTargetPanelByMode
address: '0x080EB402'
kind: function
status: probable
summary: Resolves the panel to target for a battle object according to a selector mode (ahead, at own
  coords, at other object's coords, special).
interface: (r0 = panel/offset arg, r1 = mode 0-3, r5 = current battle object, r7 = other object) -> r0
  = panel ptr or coords (r0/r1), 0 on invalid mode
details: 'Dispatches on r1: mode 0 returns battleObject_tryGetNextPanelInFacingDirection_800F964(r5) i.e.
  the panel ahead of the object; mode 1 reads the object''s panel coords from r5+0x12/0x13 and calls sub_800F998
  with r2 = r0 (probably an offset or secondary selector) returning a result in r0; mode 2 returns the
  raw coords bytes at r7+0x16/0x17 in r0/r1; mode 3 calls sub_800FA20; any other mode returns 0. r5+0x12/0x13
  and r7+0x16/0x17 look like x/y panel coordinates in the battle object struct. Return type differs per
  mode (panel pointer vs coord pair), so callers must know the mode.'
