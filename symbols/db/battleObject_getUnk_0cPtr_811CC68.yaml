details: 'Single-instruction tail call: `ldr r0, [r5, #0xc] ; mov pc, lr`. Treats r5 as a BattleObject
  (per

  BattleObject.inc the +0x8 region holds CurState/Phase flags and +0xC is the first byte past that —

  Unk_0c — which the floating-anim routine elsewhere indexes sin/cos tables with). All callers pass

  r5 holding the active BattleObject and immediately use the returned pointer as an index into a

  per-frame animation curve. `math_sinTable` / `math_cosTable` constants live immediately after the

  function at off_811CC6C/off_811CC70, hinting this whole region is the floating-anim lookup set.

  No side effects other than r0 written.

  '
