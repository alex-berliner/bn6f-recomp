name: battle_tickDespawnTimer
address: '0x080D75A4'
kind: function
status: probable
summary: Battle-object per-tick handler that mirrors the timer's bit 1 into the object's flag bit 1, decrements
  the timer, and destroys the object when the timer expires or the object's panel becomes invalid.
interface: (r5 = battle object) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to
  CUR_STATE_DESTROY on expiry or bad panel
details: First calls object_isCurrentPanelValid on the object's own position (r5); if the panel is invalid
  it immediately transitions the object to CUR_STATE_DESTROY. Otherwise it clears bit 1 (value 2) of oObjectHeader_Flags,
  then re-sets that bit if bit 1 of oBattleObject_Timer is set — so the flag mirrors the timer's low bit,
  likely a blink/flash indicator. It then decrements oBattleObject_Timer; when the counter reaches zero
  the object is destroyed as well. r5 is the object pointer, never initialized in this function, so it
  must be supplied by a caller-side convention (e.g. a script/state handler keeping the active object
  in r5).
