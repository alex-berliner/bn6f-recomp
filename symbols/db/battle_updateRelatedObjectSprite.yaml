name: battle_updateRelatedObjectSprite
address: '0x080C114E'
kind: function
status: probable
summary: Conditionally advances the sprite of the object linked from r5's battle object, honoring pause/timestop
  and gating conditions, returning whether it updated.
interface: (r5 = battle object whose oBattleObject_RelatedObject1Ptr is used) -> r0 = 1 if the related
  object's sprite was updated this frame, else 0; flags clobbered by calls
details: Gets the current battle mode; if it is not 6, it bails out when the battle is paused. It then
  loads the object referenced by the caller's object's RelatedObject1Ptr and only proceeds if that object's
  HP is nonzero and its collision ObjectFlags1 has none of the bits in mask 0x80110C00 set, and no time-stop
  is active. If all checks pass it calls UpdateBattleObjectSprite on that related object and sets the
  return value to 1, otherwise it returns 0. The battle-mode-6 exemption means the update runs even while
  paused in that mode.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetBattleMode; cmp r0,#6; beq skips the battle_isPaused check, so mode 6 updates while paused;
    ldr r3,[r5,#oBattleObject_RelatedObject1Ptr]; ldrh r0,[r3,#oBattleObject_HP]; beq bail gates on the
    linked object's HP; tst r0,r1 with dword_80C11A4=0x80110C00 against oCollisionData_ObjectFlags1 blocks
    update when those flags are set; bl battle_isTimeStop; bne bail and bl UpdateBattleObjectSprite; mov
    r4,#1 show a guarded single sprite update; Callers sub_80C1094 (twice) and sub_80C10AC invoke it in
    a battlesweep route, consistent with per-frame sprite upkeep of attached objects
