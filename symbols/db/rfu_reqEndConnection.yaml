name: rfu_reqEndConnection
address: '0x081464B4'
kind: function
status: probable
summary: Clears the link event flag in the rfu connection struct and queues rfu request 0x45 with argument
  0, presumably to tear down the wireless link state.
interface: (r0 = unused, clobbered) -> r0 = undefined; clears byte at eStruct200FE00+0x2 and side-effects
  the rfu request queue via sub_81461B0
details: Reads the byte flag at eStruct200FE00+0x2; if it is zero the function returns immediately (it
  is called from many dispatcher states, so this acts as a no-op guard). If the flag is set, it writes
  0 back to that byte, then calls sub_81461B0 with r0=0x45 (an rfu request/command ID) and r1=0 (likely
  a parameter or slot). The pop {r0}; bx r0 idiom is just a return. The byte at +0x2 looks like a one-shot
  'event pending/handled' latch inside the connection struct at 200FE00.
