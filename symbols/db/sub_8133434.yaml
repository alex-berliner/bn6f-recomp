open_questions:
- The exact meaning of [r5+0xd] / [r5+3] (the SubMenu struct definition only declares idx_00 and
- total size 0x50/0x80, so byte 0xd is a guess). Settling it requires looking at the SubMenu
- full layout or the writers of those offsets.
- Whether r0=0x80 vs r0=0x20 distinguish "submenu can be exited right now" vs "wait for chatbox
- to finish"; the chatbox_GetState==0 test inside the 0x20 branch supports this but the exact
- semantic is a guess.
- The "copy [r5+0xd] to [r5+3]" is plausibly "next state" or "queued selection" but unverified.
