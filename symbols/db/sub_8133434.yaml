status: hypothesis
summary: 'Submenu dispatch: clears the bg if not open, runs beast status, and routes the B/exit button — either
  closing the submenu (or transitioning to state 4) based on chatbox flag 0x80 and sub-state 0x20.'
interface: '(r5 = SubMenu state ptr, r10 = Toolkit) -> void ; side effects: writes [r5+2], [r5+3], may call PlaySoundEffect
  / submenu_ConfirmExitAndFade, mutates chatbox-related state'
details: "- Standard tail-call-style body (push {lr} / pop {pc}, no locals). r5 holds the submenu state\n    struct\
  \ and r10 the toolkit (confirmed by callee contracts).\n  - Always calls submenu_clearBgIfClosed_8134594, then\
  \ object_resolveTableEntryByIndex_8134538\n    and battleObject_runBeastStatusEffect_81345B0, then object_resolveTableEntryWrapper_8134548\n\
  \    (likely object-table lookups against the index written into [r5+1]).\n  - Tests chatbox flag 0x80 (chatbox_mask_eFlags2009F38,\
  \ r0=0x80): if zero, unconditionally writes\n    state 0x04 to [r5+2] and copies [r5+0xd] to [r5+3], then returns.\n\
  \  - Otherwise tests chatbox flag 0x20; if set, also tests chatbox_GetState_8045F4C against zero:\n      * chatbox\
  \ state == 0  -> calls submenu_ConfirmExitAndFade_811FB64 with r0=8 (fade value),\n        then writes 0x04 to\
  \ [r5+2].\n      * chatbox state != 0 -> plays SOUND_MENU_SELECT, writes 0x04 to [r5+2] and copies [r5+0xd]\n\
  \        to [r5+3] (the same no-fade branch as the first one).\n  - The two \"write 0x04 + copy [r5+0xd] to [r5+3]\"\
  \ branches are equivalent visually; the difference\n    is whether a confirmation sound/fade was triggered. The\
  \ r5 offsets look like a small submenu\n    state struct (idx_00, ..., CurState at +2, PrevState/Next at +3, etc.)\
  \ but the project struct\n    SubMenu only defines idx_00 + size, so offsets 0xd/0x3 are inferences.\n  - No result\
  \ register is meaningful to callers (out only mentions r5/r10); the function is\n    effectively void for the\
  \ caller. Returns via `pop {pc}`.\n"
