name: object_spawnAttackObject
address: '0x080D54F0'
kind: function
status: probable
summary: 'Spawns a kind-0x80 battle object and fills it in as an attack: panel position, element, damage
  word, and the parent''s alliance/direction.'
interface: 'custom regs: r0 = panel X, r1 = panel Y, r2 = element, r5 = parent battle object, r6 = damage/stamina-disable
  word -> no return value; Z flag from object_spawnType3 gates the init (beq skips on spawn failure)'
details: The wrapper shuffles its arguments with push {r0-r2,r5} / pop {r1-r2,r5} so the original r0,r1,r2
  land in r1,r2,r3, then calls object_spawnType3 with r0=0x80 (object kind) and the parent pointer as
  the extra stack/register argument. On success it captures the spawned object pointer (left in r5 by
  the callee, grabbed with mov r0,r5 before the pop restores the caller's r5) and writes oBattleObject_PanelX/PanelY/Element
  from its first three arguments, the full damage word from r6, and copies oBattleObject_AllianceAndDirectionFlip
  from the parent object in r5. It then sets bit 0x10 in the new object's oObjectHeader_Flags. r5/r6 are
  used as argument registers without a normal ABI, so this is one of the battle engine's custom-convention
  spawn thunks; the old r5 must be preserved because it doubles as the parent-object source.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0,#0x80 + bl object_spawnType3: spawns object kind 0x80 and beq skips everything when
    it fails; pop {r1-r2,r5} reroutes original r0,r1,r2 into r1,r2,r3, which are stored to oBattleObject_PanelX/PanelY/Element;
    str r6,[r0,#oBattleObject_DamageAndStaminaDamageCounterDisabler] copies the caller''s damage word
    into the new object; ldrh/strh of oBattleObject_AllianceAndDirectionFlip from r5 to r0 copies the
    parent''s alliance to the spawn; caller ai_attackRandomPanel ''launches an attack on it using the
    object''s damage value'', matching this parameter set'
