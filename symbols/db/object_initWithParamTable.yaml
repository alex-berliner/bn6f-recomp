name: object_initWithParamTable
address: '0x080E4364'
kind: function
status: probable
summary: 'Initializes a newly spawned battle object: validates its panel and either loads its per-type
  parameter table entry or frees the object, then enters the update state.'
interface: (r5 = battle object) -> r0 = destroyed; sets object's ExtraVars/Timer/Param2-4 and CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_UPDATE, or frees the object
details: Stores the object's X/Y (oBattleObject_X/Y) into its PanelX/PanelY byte fields, then calls object_isCurrentPanelValid;
  if the panel is invalid the object is destroyed via object_freeMemory. Otherwise Param1 indexes byte_80E4334
  (x4, one 4-byte entry per Param1 value); the entry pointer goes to ExtraVars, Param2 goes to ExtraVars+4,
  and the entry's four bytes fill Timer (as halfword), Param2, Param3 and Param4. Finally the object's
  state word is set to CUR_STATE_UPDATE and sub_80E43A8 is called (likely the state dispatch/first update
  step). The table at byte_80E4334 therefore holds per-variant {initial timer, param2, param3, param4}
  tuples.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: strb of oBattleObject_X/Y into oBattleObject_PanelX/Y then bl object_isCurrentPanelValid — spawn
    coordinates become the occupied panel; beq loc_80E439E -> bl object_freeMemory — invalid spawn position
    deletes the object; Param1*4 indexed table off_80E43A4 -> byte_80E4334 stored to ExtraVars, entry
    bytes copied to Timer/Param2-4 — per-type init data; mov r0,#CUR_STATE_UPDATE; str to oBattleObject_CurStateActionPhaseAndPhaseInitialized
    — hands the object to its update state; callees object_freeMemory/object_isCurrentPanelValid confirm
