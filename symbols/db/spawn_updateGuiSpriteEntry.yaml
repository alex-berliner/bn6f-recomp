name: spawn_updateGuiSpriteEntry
address: '0x08118DE0'
kind: function
status: probable
summary: 'Per-frame update for a spawned type-0x23 GUI sprite object: dispatches the object''s state handler
  from a small jump table indexed by a byte field, then runs the sprite updater.'
interface: '(r0 = object struct, object byte #9 = state index) -> void; r0 clobbered, handler also entered
  with r0 = its own Thumb pointer'
details: The object's update routine reads the byte at offset 9 of the object (r5 in the caller's frame)
  and uses it as an index into table off_8118DF8, then tail-dispatches to the selected Thumb handler via
  mov lr,pc/bx r0 (so the handler receives its own address in r0 and presumably accesses the object via
  a preserved register like r5). After the handler returns, it calls sprite_update on the object so the
  OAM/animation state advances. The table currently holds exactly one entry, sub_8118DFC, so all type-0x23
  GUI sprite objects share one state routine so far. The caller spawn_initGuiSpriteEntry sets up such
  an object from the GUI resource at unk_20222F0 (animation, priority, palette, list-row position) before
  this update routine is used.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#9]; ldr r0,[r0,r1]; mov lr,pc; bx r0 — indexed handler dispatch on object field
