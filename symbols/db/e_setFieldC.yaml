name: e_setFieldC
address: '0x08143F68'
kind: function
status: probable
summary: Stores a 0/1 enable-disable word into field 0xC of the global struct at 0x2001010.
interface: (r0 = value (observed 0 or 1)) -> r0 = value; Z flag set per tst r0,r0 (unused by callers)
details: 'Loads the pointer to eStruct2001010 (0x2001010) and writes r0 to offset 0xC (dword_200101C),
  then returns the value with flags set via tst. Callers only ever pass boolean values: sub_8092E44 passes
  1 each frame while a frame counter (sub_8143F72) exceeds 0x96 and [r5+0xB] counts up to 3, and 0 otherwise;
  sub_8143C30 calls it after clearing a large batch of event flags (D98.., DA2..), presumably with 0.
  The struct and the meaning of the boolean are unknown, so the name only describes the setter behavior.'
