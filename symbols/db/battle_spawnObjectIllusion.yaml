name: battle_spawnObjectIllusion
address: '0x080DE9E4'
kind: function
status: probable
summary: Spawns an illusion (clone/afterimage) object copying the given battle object's position, animation
  and facing, choosing between two sprite sets.
interface: (r5 = battle object ptr; r0 = ?) -> r0 = spawned illusion object or 0; clobbers r4,r6,r7
details: 'Reads the battle object''s effective flip via object_getFlip and composes a packed word: flip<<24
  | 0x450C | CurAnim<<16, which spawnIllusionObject_80E33FA interprets (0x450C likely palette/render flags).
  Passes the object''s X, Y and Z fields so the illusion is placed exactly on the original. Chooses sprite
  id 0x83E0 when oBattleObject_Param2 == 0, else 0xA1EF, and passes 0xE as an argument (size/type of the
  spawn). When Param2 == 1 it additionally calls sub_80E3428, likely to link or initialize the spawned
  illusion further. Called from battle_updateTimedEffectObject, so the illusion is re-spawned/kept in
  sync during the effect''s lifetime.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFlip and orr r4,r0 with 0x450C and ldrb CurAnim<<16: packed anim/flip/flags argument
    for the spawn; ldr r1/r2/r3 from oBattleObject_X/Y/Z: illusion spawned at the source object''s position;
    cmp Param2 / two literal ids 0x83E0 vs 0xA1EF: sprite variant selected by Param2; bl spawnIllusionObject_80E33FA
    with r7=0xE: the actual spawn call; caller battle_updateTimedEffectObject: invoked per-frame for a
    timed effect object'
