name: init_loadScreenAssets
address: '0x081288FC'
kind: function
status: probable
summary: Builds a decompAndCopyData reference list (with one pointer resolved via the keyed-table lookup),
  decompresses/copies the screen's graphics into VRAM/RAM, then copies a 30x20 background tilemap.
interface: () -> void; no meaningful return value
details: 'Iterates a 4-entry descriptor table at off_8128950: for each entry it calls getKeyedTableEntry_811FB84
  on the first two words (a keyed pointer, e.g. palette_3001960 selected by toolkit S2001c04 byte 6),
  stores it into unk_20096E0, then appends two literal words, terminating the list with NULL after 4 entries
  (32 bytes consumed). It then calls decompAndCopyData twice: once on unk_20096E0 (the built list) and
  once on byte_8128978, a static list that LZ77-decompresses comp_86C8054 into VRAM 0x6000020 (character
  tiles), CompText873DE4C into eDecompBuffer2013A00/unk_201C1B0, and comp_86D64F0 likewise. Finally CopyBackgroundTiles
  copies a 30x20 tilemap from eTextScript201BA00 into tile block 1, with tile ids referencing 0x6014840/0x6014800
  BG tiles. Overall this is the asset/graphics-loading step of a screen initializer; the keyed lookup
  makes one asset (palette) selection-dependent.'
