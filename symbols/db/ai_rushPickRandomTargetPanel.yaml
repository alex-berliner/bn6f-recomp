name: ai_rushPickRandomTargetPanel
address: '0x0810FA2C'
kind: function
status: probable
summary: Picks a random battle panel (via the alliance-dependent panel filter) for the Rush attack to
  charge at.
interface: (r0 = attacker battle object) -> r0 = chosen panel (x = low bits, y = high nibble), or current
  panel if list empty; flags from callee
details: 'Loads the table pointer byte_810FA3C and calls GetAllianceDependentPanelParamArgs, which indexes
  that 16-byte table (two 8-byte entries: param 0x00000000 and 0x00000020) by the battle object''s alliance
  field, yielding a filter param word and args pointer. It then feeds those into sub_8015C94, the random
  panel picker, which does GetPositiveSignedRNG % count over the filtered panel list (excluding the current
  panel) and returns x (low 3 bits) / y (high nibble) of the chosen panel. The 0x20 param for one alliance
  presumably restricts the pick to the opposing side''s panels. Only r0 is forwarded; the wrapper exists
  solely to pair the alliance-dependent table with the random picker.'
