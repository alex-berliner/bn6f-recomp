name: battle_beginTurnOpenSetup
address: '0x080144CA'
kind: function
status: probable
summary: 'Body of battle_beginTurnOpenProcess_80144C0: zeroes the 12-halfword hand field, clears AIData
  0x20, conditionally releases the opposite-alliance player slot under battle-effect bit 8, sets NoCustom+
  hit modifier and collision region 1, resets PwrAtk state, optionally inits AIData, then runs sub_8014536,
  secondary-element weakness setup, and battle-effect self damage.'
interface: (r5 = battle object) -> r0 = result of battle_applySelfDamageFromBattleEffect_80142C2; r7 flags
  whether AIData init is skipped
details: Zeroes 0xC halfwords at getBattleHandAddr(alliance)+0x26 and clears bit 0x20 of the object's
  AIData field 0x48. If battle effects bit 8 is set and the inverted alliance is nonzero, it locates the
  opposite-alliance player object and calls releaseSlotByValue_801DC36. It then stores the value from
  battle_IsNoCustomPlusActive (0 or 3) as the object's hit modifier and sets collision region 1. r7=1
  on entry makes the battleObject_initAIData call dead from this entry point, suggesting a second entry
  at 0x80144C0 that enters with r7=0. Ends with sub_8014536, secondary-element weakness setup from NaviStats,
  and battle-effect self damage.
