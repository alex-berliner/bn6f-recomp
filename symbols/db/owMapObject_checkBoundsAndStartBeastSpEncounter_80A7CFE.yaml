name: owMapObject_checkBoundsAndStartBeastSpEncounter_80A7CFE
address: '0x080A7CFE'
kind: function
previous_names:
- sub_80A7CFE
status: probable
summary: 'Overworld interaction trigger: if the player is inside a fixed 0xE0000..0x1C0000 X/Y box and
  conditions hold (no chatbox 0x80, no cutscene, no busy player, not faded), set event flag 0x1731 and
  start the BeastSp encounter cutscene (script selected by player id).'
interface: (r5 = unknown 0x14-byte param for StartCutscene) -> void ; uses overworld player coords from
  tk->GameState
details: "Reads r10 (Toolkit) → GameStatePtr → OverworldPlayerObjectPtr to get the OW player's on-map\
  \ fixed-point\n  coords at +0x1c (X) and +0x20 (Y). Subtracts constants from dword_80A7D78/7C, then\
  \ checks the player is\n  within the half-open box [0xE0000 .. 0x1C0000] on both axes (signed compare/ble/blt\
  \ pattern, so it\n  bails on locret_80A7D70 if outside). If still in-range: chatbox_mask_eFlags2009F38(0x80)\
  \ must be clear,\n  IsCutsceneScriptNonNull must be false, owPlayer_isBusyOrCutsceneActive_809E462 must\
  \ be false, and\n  IsScreenFadeActive must be true (fade NOT active via `beq` to early-out means \"\
  NOT active\" — i.e. fade\n  is finished) before continuing.\n  Sets story event flag 0x1731 via SetEventFlagFromImmediate\
  \ (the flag word passed in r0/r1 is named\n  `movflag EVENT_1731`).\n  Reads the player's slot id from\
  \ OWPlayerObject+0x24 into r4, compares with the caller's discriminator\n  at [r5+0x14]: if equal, starts\
  \ cutscene script byte_8089E44 with param r5; otherwise calls sub_81420B0,\n  compares its return to\
  \ r4, and on match starts cutscene script byte_8089FD8 with param r5. The caller\n  (sub_80A7CEA) feeds\
  \ multiple per-OW-player interaction areas (snap_*_0140000 shows param r5 points at\n  0x02039568..0x0203957c,\
  \ each entry carrying an id at +0x14), so this routine picks the right cutscene\n  depending on which\
  \ OW player slot is overlapping the trigger box.\n"
