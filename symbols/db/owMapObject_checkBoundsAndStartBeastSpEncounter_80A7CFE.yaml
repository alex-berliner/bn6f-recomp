open_questions:
- Which exact game-state this trigger fires in (the box at 0xE0000..0x1C0000 looks like a fixed map
- region — possibly a BeastSp spawn area in BeastSp map). Knowing the map+coords `0xE0000..` on the
- live map would pin it down.
- What `sub_81420B0` does (it returns something used to discriminate the player slot before starting
- one of two scripts).
- The exact meaning of the two CutsceneScripts byte_8089E44 / byte_8089FD8 (intro vs. battle-start
- variant likely).
- Whether the "IsScreenFadeActive" guard is inverted from how I read it; tracing IsScreenFadeActive's
- return convention in full would settle it.
