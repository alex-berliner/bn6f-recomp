name: oAIAttackVars_HitElement
address: '0x0'
kind: struct-field
status: hypothesis
summary: AI attack sub-state index used to dispatch the next handler via a small jump table and to advance
  between phases of the attack sequence.
details: 'The vast majority of accesses (1130 total) read this byte with `ldrb r0, [r7,#oAIAttackVars_Unk_00]`
  and immediately use it as an index into a 2/3-entry jump table (`ldr r1, [r1,r0]` followed by `bx r1`),
  across many distinct dispatcher functions (e.g. `aiAttack_stepStateMachine_80EB04C`, `battle_aiAttackDispatch_80EB436`,
  `aiAttack_dispatchStateHandler_80EBC0E`, `megamanChargeShotAiAttack_80EBE00`, `battle_aiAttackHandlerDispatch_80EBF10`,
  `sub_80EC960`, `battle_aiAttackStateDispatch_80EC884`, etc.). Writes almost always use `strh` with small
  enumerator values (0, 4, 8, 0xc, 0x10) to advance to the next phase — e.g. `mov r0, #4 / strh r0, [r7,#oAIAttackVars_Unk_00]`
  after a countdown elapses, and `strh r0, [r7,#oAIAttackVars_Unk_00]` with #0 in `object_exitAttackState`
  to reset. The dominant "3-entry phase byte at +0 (values 0/4/8)" pattern is exactly a sub-state machine
  index.'
