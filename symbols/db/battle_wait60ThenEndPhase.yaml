name: battle_wait60ThenEndPhase
address: '0x080E3504'
kind: function
status: probable
summary: 'Battle-object phase handler: on first tick frees the object''s impact slot, runs a one-time
  setup call, waits 60 frames, then switches the object to action 0xC (phase 0).'
interface: (r5 = battle object ptr; r0,r1,r2,r3 clobbered) -> r0 = N/A; no meaningful flags
details: Runs per-frame with the battle object in r5. If PhaseInitialized is 0, it sets Timer = 0x3C (60
  frames), clears the impact-effect slot indexed by oBattleObject_Alliance via battle_clearImpactSlot,
  calls sub_80E3560, and then calls sub_802CE8A with (RelatedObject1Ptr, ChipID, DamageAndStaminaDamageCounterDisabler,
  Z16Save) — likely registering the object's effect/hit against its related object — before setting PhaseInitialized
  = 4. On every tick it decrements Timer; while it stays >= 0 the handler returns. When the countdown
  underflows, it sets CurAction = 0xC and CurPhase/PhaseInitialized = 0, handing the object to the next
  action state (probably its teardown/remove action).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb PhaseInitialized / mov r0,#0x3C; strh Timer: one-time 60-frame timer setup; bl battle_clearImpactSlot
    with r0 = oBattleObject_Alliance: frees the alliance''s impact slot during init; bl sub_802CE8A with
    (RelatedObject1Ptr, ChipID, DamageCounterDisabler, Z16Save): one-time effect/hit registration; mov
    r0,#4; strb PhaseInitialized: marks the init branch as done; sub Timer,#1; bge ... else CurAction=0xC,
    CurPhase=0: ends the wait and transitions action after 60 frames'
