    checks OBJECT_FLAG_UPDATE_DURING_TIMESTOP (0x10) on the BattleObject header. - `bl battle_isBattleOver`
    at 0x080dfec0; `tst r0, r0` / `bne loc_80DFED2` sends objects to destruction when the battle continues
    normally. - At `loc_80DFED2`: `bl object_clearCollisionRegion` clears collision region, then `mov
    r0, #0x8; str r0, [r5,#0x8]` writes CUR_STATE_DESTROY to the CurStateActionPhaseAndPhaseInitialized
    field. - At `loc_80DFEC2`: `ldrb r0, [r5,#oBattleObject_CurAction]` and the table `off_80DFEE0` with
    two entries (sub_80DFEE8 and loc_80DFF64) implement a per-CurAction dispatch; `bl object_presentCollisionData`
    then refreshes'
