name: battleObject_destroyOnCollision_80DFEA8
address: '0x080DFEA8'
kind: function
previous_names:
- sub_80DFEA8
status: probable
summary: 'Tear-down path for a battle object after collision: remove its collision data, spawn the destruction
  effect, and either destroy the object (if it should not persist during the destruction effect) or continue
  running its per-action collision handler.'
interface: (r5 = BattleObject*, r10 = Toolkit*) -> void ; no return value
details: "1. Calls `object_removeCollisionData` (THUMB trampoline) to tear down the object's\n     collision\
  \ data, with r5 holding the BattleObject and r10 the toolkit.\n  2. Calls `object_spawnCollisionEffect`\
  \ to spawn the visual effect for the\n     object being destroyed.\n  3. Loads `oObjectHeader_Flags`\
  \ (BattleObject offset 0x0) and tests bit 0x10\n     (OBJECT_FLAG_UPDATE_DURING_TIMESTOP). If that bit\
  \ is set, jumps straight to\n     the per-action dispatch (`loc_80DFEC2`).\n  4. Otherwise calls `battle_isBattleOver`;\
  \ if the battle is not over\n     (r0 non-zero), the object is queued for destruction: `object_clearCollisionRegion`\n\
  \     is called and `CUR_STATE_DESTROY` (0x08) is written into\n     `oBattleObject_CurStateActionPhaseAndPhaseInitialized`\
  \ (offset 0x8).\n  5. In the normal path (`loc_80DFEC2`), reads `oBattleObject_CurAction` (offset 0x9)\n\
  \     and uses a 2-entry table at `off_80DFEE0` to dispatch to either\n     `sub_80DFEE8` (when CurAction\
  \ selects index 0) or `loc_80DFF64` (index 1),\n     which are the per-action handlers. After that,\
  \ `object_presentCollisionData`\n     is invoked before returning.\n  6. Used as a battle-object handler;\
  \ `lr` returns to the caller that invoked\n     this object handler.\n"
