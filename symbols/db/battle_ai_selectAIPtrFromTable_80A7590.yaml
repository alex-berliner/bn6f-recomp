open_questions:
- The semantic name of the table at 0x8140C60 and whether the entries are AI main loop pointers, AI state
  jump table entries, or animation callbacks. Knowing what the caller does with r0 after this returns
  (and what r5+0x28 is consumed as) would pin the role.
- Whether r5 is a BattleObject or an AIData struct here — the offsets 0x28 / 0x2c fit both, but only one
  is correct.
