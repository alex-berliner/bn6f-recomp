name: ai_dispatchAttackHandler_80FF042
address: '0x080FF042'
kind: function
status: confirmed
summary: AI attack state dispatcher; reads the current attack's HitElement byte and jumps to the matching per-element
  attack behavior handler.
interface: void sub_80FF042(u32 attackVars /*r7*/, u32 passthroughR3 /*r3*/, u32 passthroughR5 /*r5*/, u32 passthroughR10
  /*r10*/); results returned by the dispatched handler in r1 r5 r8 r9 r10 r11 r12, flags clobbered
details: "Tail-style dispatcher over the AI attack block pointer in r7. Loads the oAIAttackVars_HitElement byte\
  \ (values are already multiples of 4 in memory: 0x00, 0x04, 0x08, 0x0C, 0x10) and uses it directly as an index\
  \ into the handler table at off_80FF054:\n  0x00 -> sub_80FF068\n  0x04 -> battleObject_moveAlongThrow_80FF0DC\
  \ (thrown/moved attack)\n  0x08 -> ai_attackChargeHandler (charge-up phase)\n  0x0C -> sub_80FF1A2 (not yet symbolized)\n\
  \  0x10 -> ai_runAttackTimer (active attack timer)\nThe table entry is computed with a two-step indirection (ldr\
  \ off_80FF050 -> off_80FF054), then entered via a mov lr,pc / bx r1 long-call, so the dispatched handler returns\
  \ directly to this function's caller and its register state (r1, r5, r8-r12) becomes this function's visible outputs.\
  \ Entry state to the handler: r0 = HitElement value, r1 = table entry (handler address), r3/r5/r10 pass through\
  \ untouched. Only r7 is preserved across the call.\n"
