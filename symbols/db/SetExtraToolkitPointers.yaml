name: SetExtraToolkitPointers
address: '0x08006C6C'
kind: function
status: confirmed
summary: Initializes 22 extra toolkit pointers by storing absolute pointers (base + per-entry offset) into the toolkit's
  GameStatePtr block.
interface: 'void setExtraToolkitPointers_8006C6C(void);

  // implicit input: r10 = toolkit struct pointer

  // no explicit outputs; r1..r3 trashed (nz/c/v set), r4-r7/lr preserved

  '
details: 'Copies 22 dwords (table byte size 0x58 = 22*4) from the ToolkitExtraPtrsOffsets

  table into the toolkit struct at offset oToolkit_GameStatePtr, converting each

  entry from a base-relative offset to an absolute pointer by adding

  eToolkitExtraPtrsMemory (base). The "and r3, r4" with r4=0 zeroes the unused

  extra-toolkit offset (eUnusedExtraToolkitPtrsOffset), so the base reduces to

  just eToolkitExtraPtrsMemory regardless of that variable. Used as part of

  toolkit setup so the extra toolkit memory region is reachable through the

  toolkit''s GameStatePtr-anchored pointer array.

  '
