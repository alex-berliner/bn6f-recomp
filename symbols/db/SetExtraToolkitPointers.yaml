open_questions:
- Why does the loop also store at index 0x54..0x57 (one past the 22nd entry) given the `cmp ... blt` check uses
  0x58 as limit and increments by 4 last? Looks like a copy-paste of the runtime helper copyWords_80014EC whose
  size constant is inclusive of the last word.
- Is eToolkitExtraPtrsMemory an EWRAM-resident region shared with the extra toolkit (a separate per-battle/per-scene
  toolkit)?
- The C comment marks a second helper `derive_base` that always returns `eGameState + 0`; original disassembly actually
  returns `eToolkitExtraPtrsMemory + 0` — possible typo in the readable.
