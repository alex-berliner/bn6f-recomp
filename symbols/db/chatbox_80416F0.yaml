name: chatbox_80416F0
address: '0x080416F0'
kind: function
status: confirmed
summary: Executes one 6-byte chatbox script table entry, selecting a script by current map group, and advances to
  the next entry if the chosen slot is 0xFF.
interface: void chatbox_runEntry_80416F0(struct ChatboxScriptEntry* r4, struct ToolKit* r10) -> r0=1; clobbers r1-r3,
  r4, lr, nzcv
details: "Reads a 6-byte chatbox script entry whose layout is:\n  +0..1  reserved (offset 0/1)\n  +2     mapLow\
  \  (u8) inclusive lower bound on current MapGroup\n  +3     mapHigh (u8) inclusive upper bound on current MapGroup\n\
  \  +4     scriptID_whenInRange  (u8)\n  +5     scriptID_whenOutOfRange (u8)\nPulls the current map group via the\
  \ toolkit's gameState pointer\n(oToolkit_GameStatePtr -> oGameState_MapGroup). If mapGroup is within\n[mapLow,\
  \ mapHigh] (both compared as signed bytes via blt/bgt) the in-range\nslot (+4) is used; otherwise the out-of-range\
  \ slot (+5) is used. If the\nselected scriptID is 0xFF the entry is treated as empty: r4 is advanced by\n6 bytes\
  \ (to the next entry in the table) and no chatbox is shown. Otherwise\nchatbox_config_80408D0 is called with r0=0,\
  \ r1=scriptID. r2/r3 are left\nholding mapHigh/mapGroup respectively, matching the original register\nliveness\
  \ across the call. Always returns 1 in r0.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
