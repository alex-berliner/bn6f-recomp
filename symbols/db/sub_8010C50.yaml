open_questions:
- The actual semantics of `(element - 0x3FF)` passed to sub_8010D04 and what sub_8010D04
- ultimately writes. Naming this `processChipActivation` is plausible from the captured-call
- profile but the exact role of r1 (alliance vs. raw carry) is only inferred from the
- battle_findPlayer contract; disassembling sub_8010D04 would settle it.
