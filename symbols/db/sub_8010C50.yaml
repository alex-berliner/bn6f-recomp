name: sub_8010C50
address: '0x08010C50'
kind: function
previous_names: []
status: hypothesis
summary: Sets a player BattleObject's PwrAtk charge time to the chip's charge value when the chip is a BeastOut/charge-style
  chip (ID != 0x3FF) and the alliance side has a player battle object.
interface: '(r0 = chipId, r1 = alliance, r10 = ToolkitPtr) -> r0 = chipId (or 0x1E on chip id miss); side effects:
  writes AIData fields (charge time) via sub_8010D04 when player found'
details: "- Saves r0 as r4 (chipId), r1 as r6 (alliance), then resolves alliance -> player BattleObject with battle_findPlayer.\n\
  \  - If no player found (r5 == 0), returns immediately at locret_8010C74.\n  - Otherwise it looks up the chip\
  \ via getChip8021DA8(r0=chipId) and reads a u16 at offset 0x1A (likely the chip's charge-time value).\n  - Subtracts\
  \ 0x3FF (dword_8010D40) from that value; the result is the duration applied (sub_8010D04 is then called with (r0\
  \ = duration, r1 = alliance)). The 0x3FF subtraction looks like a sentinel/cap: chips at/near 0x3FF would underflow,\
  \ so likely the caller pre-filters chipId to chips whose value at +0x1A is >= 0x3FF.\n  - sub_8010D04 is the worker\
  \ that actually writes the PwrAtk state onto the player's AIData (consistent with its r0/r5/r10/r4 contract and\
  \ the AIData fields BeastOutAPwrAtk / PwrAtkCurChargeTime / PwrAtkState / PwrAtkButton).\n  - Captured calls all\
  \ enter with r0 = 0x195 (a chip ID), r1 = 0, exit r0 = 0x1E with Z clear (ldrh at offset 0x1A returns whatever\
  \ value is at that chip record, then sub_r0_r1 returns the diff; the constant 0x1E looks like a code result, not\
  \ a written field).\n  - Likely paired with caller `080109CE` (returns to LR=080109CE), which itself decides which\
  \ chip's PwrAtk to enqueue per player.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4-r6,lr}; mov r4,r0; mov r6,r1` preserves chipId and alliance across the call. - `mov r0,r1;
    bl battle_findPlayer` resolves alliance to player BattleObject; r5 stored as result. - `tst r5,r5; beq locret_8010C74`
    shows the "no player found" early-out is real (corresponds to observed `----` exit flag when alliance has no
    player). - `bl getChip8021DA8` with the original chipId confirms static-chip lookup by ID. - `ldrh r0,[r0,#0x1a]`
    loads a u16 charge field from the 44-byte ChipData record; offset 0x1A is plausible for a chip''s charge/length
    field given the struct size of 44 bytes. - `ldr r1,dword_8010D40` (=0x3FF) `sub r0,r0,r1` produces a duration
    delta capped at 0x3FF. - `mov r1,r6; bl sub_8010D04` hands duration + alliance to the worker; sub_8010D04''s
    contract reads r10 (ToolkitPtr) which matches the parent fn. - Captured entry r0=0x195 across 6+ traces with
    r1=0 indicates a single fixed chip-id call site (chip 0x195 ~= *BeastOut / Cross-Arm / PwrAtk family*), LR=080109CE
    single caller. - Exit r0=0x1E is constant across all 6 snapshots despite r3 varying, confirming r0 is recomputed
    purely from chip data (not from r3/BattleObject state).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08010C50

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp'
  reproduce: 'grep -l ''^08010c50 '' tools/traces/coverage/*.prof

    '
  result: beastsp
open_questions:
- Exact semantics of `chipData+0x1A` (charge ticks vs. duration field name) and the role of the 0x3FF subtraction/cap.
- Whether sub_8010D04's writes correspond to AIData.PwrAtkCurChargeTime, PwrAtkState, PwrAtkButton, or just BeastOutAPwrAtk
  - needs sub_8010D04 disassembly.
- Why exit r0 is 0x1E specifically (chip 0x195 +0x1A -0x3FF = 0x1E?), would be confirmed by inspecting chip 0x195's
  table entry.
