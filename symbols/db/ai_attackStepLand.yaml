name: ai_attackStepLand
address: '0x080F8A1C'
kind: function
status: confirmed
summary: Landing half of an NPC's AI attack-step — counts the step timer down and, when it expires, moves the object
  onto its planned attack panel and arms the landing hit.
interface: void ai_attackStepLand(BattleObject *object /*r5*/, AIAttackVars *vars /*r7*/); // lr return; passes
  r1 through while timer still > 0, returns object_updateCollisionPanels' r1 once landed
details: 'Runs once per frame while an NPC is stepping toward the panel it intends to attack from. Decrements vars->StepTimer
  (u16 at oAIAttackVars_StepTimer); while the decremented value is still positive it returns immediately, leaving
  r1 untouched. When the timer expires the step completes: sets object->CurAnim (oBattleObject_CurAnim) to 3, the
  landing/arrival animation; commits the planned destination by copying object->FuturePanelX/FuturePanelY into object->PanelX/PanelY;
  calls object_removePanelReserve(x, y, object) to release the panel reservation on the new panel, object_setCoordinatesFromPanels(object)
  to sync the object''s screen position, and object_updateCollisionPanels(object) to rebuild its collision panel
  data. Then restarts vars->StepTimer at 3 and sets vars->HitElement (oAIAttackVars_HitElement) to 8, the element
  used for the landing hit. r4 and r6 are preserved; flags are clobbered.

  '
