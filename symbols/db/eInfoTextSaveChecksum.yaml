  being written to/read from SRAM (u32)'
details: Held in EWRAM as a 4-byte field (str/ldr 32-bit). saveInfoTextBlockToSram clears it (str r2,[r3]
  where r2=0) then sums the 0x28 bytes of the save block into it; sub_803F976 reads the stored value,
  clears it, and similarly sums the block to compare against the saved checksum. Both functions operate
  on the same info-text record (timestamp at byte_2006720, block at byte_2006710, size 0x28), so this
  label is that block's checksum word.
