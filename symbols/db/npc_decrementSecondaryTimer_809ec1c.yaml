name: npc_decrementSecondaryTimer_809ec1c
address: '0x0809EC1C'
kind: function
status: confirmed
summary: Decrements the secondary-script timer on an overworld NPC object and, when it expires, flags the script
  for termination.
interface: 'void npc_decrementSecondaryTimer_809ec1c(void);

  // inputs:  r5 = overworld NPC object pointer

  // outputs: r0 = post-decrement timer (or 0 on expire), N/Z set from pre-decrement timer SUBS

  // clobbers: r0, N/Z flags; lr preserved via pop {pc}

  '
details: 'Reads the u16 at oOverworldNPCObject_Timer_22 (offset 0x22) of the NPC struct pointed to by r5,

  subtracts 1, and writes it back. If the result is non-zero, returns it in r0 with the SUBS flags

  reflecting the pre-decrement value (so the caller sees Z set only when the value was exactly 1).

  If the decrement hits zero, writes 0 to oOverworldNPCObject_TerminateScript_1f (offset 0x1f) to

  mark the secondary script for teardown on the next script-loop tick, and returns 0 in r0. Uses

  `pop {pc}` as a tail return, so it must be entered via a `push {lr}`-balanced call. Sits just

  before the NPCCommands jumptable that dispatches NPCCommand_* handlers.

  '
