name: ai_getAttackBoost2
address: '0x080FBDCC'
kind: function
status: probable
summary: returns a value from the current AI attack parameter data, stored by the caller as the AI attack's
  'AttackBoost2' field
interface: '() -> r0 = AttackBoost2 byte of the loaded versioned AI attack params; flags: from callee'
details: It loads the pointer dword_80FBDDC (= 0xC0E1014, likely a handle/offset into the attack parameter
  blob) into r0 and tail-calls sub_800FE28, returning its result. It is one of a trio of one-line getters
  (sub_80FBDB8 -> AttackDuration, this -> AttackBoost2, sub_80FBDE0 -> TimerOrCycles) called right after
  ai_loadVersionedAttackParams(r0=4) in the AI attack initializer, each result being written to a different
  field of the oAIAttackVars struct. The actual decoding happens in sub_800FE28, which this function only
  supplies an argument to.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80FBDCC body: ldr r0, =dword_80FBDDC (0xC0E1014); bl sub_800FE28; pop {pc} — pure getter
    passing a fixed data reference; caller 0x080FBF6C: bl sub_80FBDCC; strb r0, [r7,#oAIAttackVars_AttackBoost2]
    — result is stored as AttackBoost2; caller context: mov r0,#4; bl ai_loadVersionedAttackParams precedes
    the three getters, so they read fields of the freshly loaded attack params; sibling calls: sub_80FBDB8
