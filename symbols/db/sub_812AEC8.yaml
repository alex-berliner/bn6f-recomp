open_questions:
- What does sub_80465F8 actually tick? (Not lifted here — could be input, audio, or another entity bucket.)
- Why is exit_to_overworld_map gated on "no fade active" rather than "fade finished"? Suggests a fade-out is normally
  initiated just before this loop, and the menu tears down the frame the fade starts.
- Is this called every frame from the pet-menu VBlank/task loop, or only once per state transition? The name `runAllUpdateHandlers`
  plus the fade-poll suggests an idle/transition tick rather than a one-shot.
