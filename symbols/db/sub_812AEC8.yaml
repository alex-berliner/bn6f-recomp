name: sub_812AEC8
address: '0x0812AEC8'
kind: function
status: confirmed
summary: Pet-menu overworld tick — runs all entity update handlers (and a secondary tick handler), then bails out
  to the overworld map once the screen fade completes.
interface: void sub_812AEC8(void);
details: "Wraps four guest calls in a fixed sequence:\n  1. entity_runAllUpdateHandlers_80465BC — advances every\
  \ registered entity update handler (sprite/animation/state machines).\n  2. sub_80465F8 — secondary per-frame\
  \ tick (untyped here).\n  3. IsScreenFadeActive — Z set when a fade transition is currently running.\n  4. If\
  \ no fade is active, pet_menuExitToMap_811F708 closes the pet menu and returns control to the map scene.\nLives\
  \ in the pet-menu module (near 0x0812xxxx, alongside pet_menuExitToMap_811F708). Return path is `pop {pc}`, so\
  \ the caller resumes immediately and the LR save register is just the function's return address. The trailing\
  \ `.byte 0, 0` is alignment padding, not data — typical of thumb functions in this range. Register contract `inputs:\
  \ r10 lr` reflects the lone `push {lr}`; callee clobbers (r0–r3, r5/r8/r9/r11/r12, lr, nzcv) match the union of\
  \ the four guest calls' side effects rather than anything local.\n"
