name: sub_8026E4C
address: '0x08026E4C'
kind: function
status: confirmed
summary: Chatbox state-machine step that waits for text printing to finish, then plays a sound effect and moves
  the chatbox to state 4.
interface: 'void sub_8026E4C(ChatboxState *self /* r5: struct S20364C0 */)'
details: 'Checks eFlags2009F38 bit 0x80 (via chatbox_mask_eFlags2009F38). If clear, or if the

  text-busy probe sub_802A220 returns something other than 0xFF, the text is considered

  done: plays sound effect 0x9E, calls chatbox_8040818 (in the flag-set path, before the

  transition), sets the state byte at self+1 to 4, clears the halfword timer at self+2,

  and finally runs the periodic update sub_8029C08 on the same struct. While sub_802A220

  reports 0xFF (text still printing), it skips the sound and state change and only runs

  the periodic update. r4-r7 and r10 are preserved throughout; only flags and scratch

  registers change.

  '
