summary: Boolean flag indicating a charged/ready attack state (0 = not ready, 1 = ready).
details: 'The field is overwhelmingly written as 0 during attack initialization sequences, but is written
  as 1 in exactly two cases: sub_8011CB4 (when chip ids 0x53/0x54 are selected) and sub_8012044 (alongside
  AiDifficultyTier=1). The two ldrb reads (asm31.s:118900, 119077) test it against 0 to gate a special
  action (oBattleObject_CurAction = 0x41). This read-after-test-zero pattern is consistent with a boolean
  readiness/gating flag rather than a counter or indexed value, but the precise meaning of the 1 state
  cannot be confirmed without further context.'
