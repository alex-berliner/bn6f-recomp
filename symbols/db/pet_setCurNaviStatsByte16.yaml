name: pet_setCurNaviStatsByte16
address: '0x0813CF1C'
kind: function
status: probable
summary: Writes an 8-bit value at offset 0x16 of the PET's currently selected Navi's stats record.
interface: (r0 = byte value to store) -> void; flags clobbered by call
details: 'Thin wrapper: it moves the caller''s r0 value into the third argument slot, sets record index
  0 (the Navi currently selected in the PET) and field offset 0x16, and tail-calls SetCurPETNaviStatsByte,
  which writes one byte into the current NaviStats record. It has no other logic and returns nothing.
  The meaning of the 0x16 field in NaviStats is not established here, so the wrapper is named by its effect,
  not the stat''s semantics. No callers are known, which prevents identifying what value the game stores
  there.'
