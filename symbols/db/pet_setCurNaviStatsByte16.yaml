- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r2, r0 / mov r1, #0x16 / mov r0, #0 before bl SetCurPETNaviStatsByte — passes (record 0,
    offset 0x16, value); SetCurPETNaviStatsByte is documented as writing one byte into the NaviStats record
    of the currently selected PET Navi'
