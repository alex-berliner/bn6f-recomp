name: wrapper_sub8126570_fixedArgs_812650C
address: '0x0812650C'
kind: function
status: confirmed
summary: Parameter-filling wrapper that invokes worker sub_8126570 with fixed extents (90, 32, 30, 12) and pointers
  to the byte_8124A84 / dword_8124A84 tables plus the constant 0x40000000.
interface: void sub_812650C(void); // no caller-passed inputs used; r2/r3 returned unchanged from sub_8126570, r4-r7
  preserved
details: 'Takes no real arguments of its own — it only loads fixed constants into the worker''s argument registers
  and tail-calls sub_8126570 (the bl is followed immediately by the pop, so the pop is dead but r4-r7 are still
  preserved across the call in practice). Arguments set up: r0=0x5A (x extent, 90), r1=0x20 (y extent, 32), r2=0x1E
  (width, 30), r3=0x0C (height, 12), r4=pointer to byte_8124A84 (byte table), r6=0x40000000 (constant passed straight
  through), r7=pointer to dword_8124A94 (word table). r5 is not initialized here, so the worker either ignores r5
  or expects it from an outer context; the register contract lists r5 as an input, suggesting some callers have
  it live. All the geometry/table/constant values are hard-coded, so this is one specific invocation of the more
  general worker sub_8126570. No game-term meaning (what the 90x32/30x12 region or the two tables represent) can
  be read from this function alone.

  '
