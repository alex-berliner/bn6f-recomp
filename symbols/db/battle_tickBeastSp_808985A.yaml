open_questions:
- The exact semantic of the three sub-action bytes (0x34/0x18/0x3c) - whether
- 0x34 truly means "chip-locked", 0x18 means "charging", 0x3c means "BeastOut
- fire" - is from naming conventions and would settle by tracing what
- reads [r5,#0] in the rest of beastsp.
- Whether [r7,#0xc] is the AIData Anger field or something else; knowing r7's
- type here would lock it down.
