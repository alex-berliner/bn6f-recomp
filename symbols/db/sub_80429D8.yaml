name: sub_80429D8
address: '0x080429D8'
kind: function
status: hypothesis
summary: Advances the chatbox's script cursor by a row-aligned half-width offset, bumps an internal data pointer
  by an 8-byte aligned slot, and steps the caller's row iterator forward by 3; returns 1.
interface: void sub_80429D8(u8* r4_rowIter, ChatboxState* r5_chatbox); /* returns 1 in r0, nz/c/v clobbered, r6/r7
  preserved; passes r2=step, r3=half+cursor, r4+=3, r8=half */
details: 'Operates entirely on a chatbox-state struct passed in r5. Reads the 0-based

  line index from [r4+2]-1 and uses a hard-coded vertical region of 0xAC

  (built up as 0x79+0x33) to compute a half-remainder offset `(0xAC -

  row*0xB - 16) >> 1` saved in r8. The current text-script char index at

  `oChatbox_TextScriptCharIdx` is then added to that half and stored to a

  one-byte field at chatbox+0x94 (the "next slot script cursor"). A separate

  working pointer at `oChatbox_Unk_7C` is advanced by `((half>>1)<<1)<<2`,

  i.e. `floor(half/2)*8`, an 8-byte aligned slot bump whose size depends on

  the row position. The caller-provided iterator in r4 is post-incremented

  by 3 (three u8 rows: presumably idx, count, and a padding byte). Always

  returns 1 in r0 with the NZ flags set. Used in chatbox script/line layout

  setup; the exact meaning of chatbox+0x94 vs `oChatbox_TextScriptCharIdx`

  (mirrored script cursor vs active cursor) and of `oChatbox_Unk_7C`

  (likely a sprite/oam or per-row descriptor table pointer) is not fully

  pinned down by this function alone.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
