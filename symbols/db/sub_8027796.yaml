name: sub_8027796
address: '0x08027796'
kind: function
status: probable
summary: On leaving the custom screen, rotates the queued chip entries right by one and reloads each chip's sprite
  tiles into its VRAM slot, then runs the exit sequence with a screen fade.
interface: (r0 = ??? passed straight to battle_getActorEmotion, r5 = custom-screen state struct) -> r0 = destroyed;
  sets state field [r5+2]h = 0x10
details: 'Reads the battle actor emotion: if it is 1 it uses base 0xC instead of 0 and passes it to sub_802A040
  (a beast-out-related variant of the setup). It then takes the byte count at [r5+8]-1 and, walking down from the
  last entry of the byte array at r5+0x48, shifts every element one slot later (a right rotation, since the original
  last element saved in r6 is finally written to [r5+0x48]); for each shifted index it fetches the active-chip entry,
  takes the low 11 bits of the halfword at +8 as a sprite id, and calls sprite_CopyObjTilesToVramSlot to load that
  chip''s 0x80-byte OBJ tiles into the matching VRAM slot. After the loop it calls sub_802A034 and loads one more
  sprite into slot 0, stores 2 into byte +7 of active-chip entry 11, runs customScreen_ExitSequence, requests a
  fade via SetScreenFade(0x60, 8), and sets the state halfword [r5+2] to 0x10 to advance to the next step.'
