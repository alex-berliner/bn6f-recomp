name: battle_loadNaviCustomizerGfx
address: '0x08135B94'
kind: function
status: probable
summary: 'Loads the Navi Customizer scene''s palettes, tiles and BG maps: resolves a 3-entry key/pointer
  table into unk_20096E0 for decompAndCopyData, copies a second hard-coded table into VRAM/buffers, block-copies
  0x100 bytes, then blits three BG tilemaps (r5 = scene struct, byte[r5+0xf] selects a variant tilemap).'
interface: (r0 = pointer to a scene-state struct; byte [r0+0xf] selects a graphics variant) -> r0 = clobbered;
  no meaningful return
details: 'First it builds a 4-entry, 12-byte descriptor table at unk_20096E0 by calling getKeyedTableEntry_811FB84
  on the first word of each entry (resolving runtime pointers like palette_3001960 and unk_30019A0), then
  null-terminates it and hands it to decompAndCopyData, which loads the scene palettes/GFX. A second hard-coded
  descriptor table (off_8135C64) is passed to decompAndCopyData as well, streaming compressed tiles into
  VRAM 0x6014600, 0x6000020, 0x6004000, 0x6007C20, 0x6008020 and buffers like unk_30019C0, via the shared
  eDecompBuffer2013A00 scratch. It then copies 0x100 bytes from unk_201CF80 to unk_30019E0 (likely a palette
  or scroll setup). Finally three CopyBackgroundTiles calls blit the BG maps: a 0x1e x 0x14 area from
  byte_201BE80 into tileblock 1, a 0x11 x 0x11 area picked from off_8135D80 indexed by byte [r0+0xf]<<2
  (variant like folder/selected view) into tileblock 1, and a 0xc x 9 area from unk_201D180 into tileblock
  2. The second descriptor table ends with CompText86D55C8 explicitly annotated ''For navi customizer'',
  confirming the scene.'
