name: battle_loadNaviCustomizerGfx
address: '0x08135B94'
kind: function
status: confirmed
summary: Initialises the Navi Customizer screen by decompressing tile/asset data, copying the palette to IWRAM,
  and drawing three background tile layers (full panel, per-Navi artwork, and button strip).
interface: void battle_loadNaviCustomizerGfx(u32 *customizer_obj /* r5 */); /* r10 caller-provided, unused; preserves
  r4-r7 */
details: "1. Builds a NULL-terminated init-references list at unk_20096E0 by iterating a key/size/extras table (off_8135C2C,\
  \ 0x30 bytes = 6 entries): each entry pairs a key and size fed to getKeyedTableEntry_811FB84, followed by two\
  \ extra u32 words copied verbatim. The list is terminated with a zero word.\n2. Calls decompAndCopyData twice:\
  \ once on the just-built list, once on a static list at off_8135C64 (entries include compressed tile/palette assets\
  \ destined for VRAM slots like 0x6014600, 0x6000020, etc., and EWRAM work buffers).\n3. Copies 0x100 bytes of\
  \ palette from unk_201CF80 to IWRAM at unk_30019E0 via CopyByEightWords.\n4. Draws three CopyBackgroundTiles calls:\n\
  \   - (j=0,i=0,block=1, byte_201BE80, 0x1E x 0x14): full panel background.\n   - (j=1,i=2,block=1, tile_src, 0x11\
  \ x 0x11): per-Navi artwork; tile_src is selected from a 3-entry table at off_8135D80 using byte[0xF] of the customizer\
  \ object (r5) as index (left-shifted by 2).\n   - (j=0x11,i=0xB,block=2, unk_201D180, 0xC x 9): button/extra panel\
  \ strip.\nThe callee set (decompAndCopyData, CopyBackgroundTiles) dirties r4-r7 internally; the original restores\
  \ them via its push/pop frame.\n"
