name: menu_drawChipDescription
address: '0x08119EEC'
kind: function
status: probable
summary: 'Chip-info/library screen: draws the selected chip''s name and description text, or blanks the
  display if the chip entry is unavailable.'
interface: (r0-r4/r6-r7 unused; caller passes menu-state object in r5) -> r0 = renderTextGfx result; no
  flags relied on by caller
details: 'Reads a chip ID from the state object at r5+0xE (with a byte selector at r5+0xC and a table-select
  byte at r5+0x5). It fetches that chip''s record via getChip8021DA8; if the table-entry checks fail or
  record+0x24 is zero, it calls sub_8119F88 to zero the sprite tile blocks (blank slot) and returns. Otherwise
  it makes two renderTextGfx_8045F8C calls: the first uses the RAM text base unk_2028000 with index (chipId-0x140)*5
  + byte[r5+0xC] and gfx base dword_86B7AE0; the second uses TextScriptChipDescriptions0 (chipId <= 0xFF)
  or TextScriptChipDesc1 (chipId > 0xFF, index masked to 0xFF) with gfx base dword_86A5D60. Both calls
  take position/geometry from per-slot pointer tables (off_8119FF0/off_8119FD0/off_8119FE8, indexed by
  byte r5+0x5 << 2), whose entries supply values shifted left by 5 (tile-row scaled coordinates).'
