name: t4_0x3c_80E4A1C
address: '0x080E4A1C'
kind: function
status: confirmed
summary: Per-frame tick for the arm-attack battle object — runs the current state's handler via a jump table, then
  advances the object's sprite animation.
interface: u32 battle_armAttackObject_tick_80E4A1C(BattleObject* obj /* r5 */); r10 also read by callees; returns/propagates
  r5 (possibly updated by the state handler), clobbers r0-r4, r6-r12, lr and flags.
details: 'Entered with r5 = the battle object (and r10 passed through to the animation callees).

  Reads BattleObject.CurState (byte at oBattleObject_CurState) and indexes the handler

  table at off_80E4A40 with the RAW byte value ("ldr r1,[r1,r0]", no *4 scaling) — so the

  table is byte-packed. Then does "mov lr,pc / bx r1" to dispatch; the handler is entered

  with r0 = CurState, r1 = its own table entry, r5 = the object, and may change the state

  and/or r5 (the updated object pointer is what comes back).

  Handlers: state 0 = battle_spawnArmAttackObject (spawn/init the arm attack), state 1 =

  battleObject_updateAttachedArmCoords_80E4AAE (keep the arm sprite attached to its owner),

  state 2 = sub_80E4A4C.

  After the handler returns, CurState is re-read (it may have changed): state 8 gets

  battleObject_updateSpriteAnimIfChanged_801BCD0 (full animation restart on frame change),

  any other state gets battleObject_tickSpriteAnim_801BC24 (plain animation tick).

  Part of the battle-object tick family (name t4_0x3c suggests a shared tick slot);

  all state changes go through the handlers, this wrapper only dispatches and animates.

  '
