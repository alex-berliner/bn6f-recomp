name: battle_getObjectHandCardId
address: '0x0802DEAE'
kind: function
status: probable
summary: Returns the chip ID of the card in the hand slot selected by a battle object, or 0xFFFF when
  the object's flags mark it as having none.
interface: '(r0 = battle object ptr for object_getFlag; r5 = object context: +0x16 slot index, +0x58->+0x19
  flag byte) -> r0 = hand card halfword at slot+2 (chip ID) or 0xFFFF; flags clobbered.'
details: Starts with r4 = 0xFFFF as the default return. If the byte at [r5+0x58]+0x19 is nonzero, or the
  object's first collision-flag word (via object_getFlag) has bit 0x1000 set, it skips the lookup and
  returns 0xFFFF. Otherwise it reads the slot index from [r5+0x16], gets that hand entry from the hand
  array at 0x20349C0 (0x50-byte strides) via getBattleHandAddr_8010018, and returns the halfword at offset
  +2, which in the battle hand layout is the chip ID. The 0xFFFF sentinel and the 0x1000 flag check suggest
  cases where the object has no usable chip queued. r5 is not set inside this routine, so it relies on
  a caller/dispatcher convention establishing the object context in r5.
