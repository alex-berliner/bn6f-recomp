name: reqBBS_813F6F8
address: '0x0813F6F8'
kind: function
status: confirmed
summary: Per-frame BBS request tick that animates two scratch sprites on the toolkit and, when the request's counter
  expires, marks it finished and runs the closing sequence.
interface: void tickBBSRequest_813F6F8(u32 r5 /* request state */, u32 r10 /* toolkit ptr */, u32 lr); clobbers
  r0-r4,r6,r7,r12,lr and N/Z/C/V; preserves r5,r8,r9; returns r10 unchanged, r0:=0 then flags NZ.
details: 'Reads the toolkit''s two scratch objects via oToolkit_Unk2009740_Ptr and oToolkit_Unk200f3a0_Ptr. On object
  0x9740: byte[6] -= 8 then byte[4] = (byte[6]>>4) (interpreted as an animation frame derived from a 240-tick counter).
  On object 0xF3A0: byte[9]=0x1B always; byte[7]+=8; byte[6]-=8. Then decrements the request''s counter at r5+8
  and, while it is still >0 (signed `bgt`), calls reqBBS_813F8F0(r5) and returns 0. When the counter drops to <=0,
  it writes 4 to r5+0 (state "finished"), calls reqBBS_813FEB0(r5) to play the BBS finish sequence, then resets
  object 0xF3A0: byte[9]=byte[10]=0x3F, byte[3]=0xFF, byte[2]=0, byte[7]=0xFF, byte[6]=0, and finally calls reqBBS_813F8F0(r5).
  The leading `push {lr}` and trailing `mov r0,#0 / pop {pc}` show this is the thunk called by the BBS request dispatcher
  each frame; the .balign + thumb_func_end suggest it''s a leaf in the thumb vector.'
