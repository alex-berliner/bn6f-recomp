name: battleRefreshTrackedObjectArmPos_801DBD4
address: '0x0801DBD4'
kind: function
status: confirmed
summary: Finds the tracking-table slot (6 slots at 0x20352E0) that holds the given battle object and rewrites its
  stored x/y arm position, returning 1 if the object is not tracked.
interface: 'int battleRefreshTrackedObjectArmPos_801DBD4(void); // in: r5 = battle object ptr; out: r0 = 0 if slot
  found/updated, 1 if not tracked; C set/V clear, NZ clear on the not-found path'
details: 'Walks a six-entry, 8-byte-per-entry table at 0x20352E0 (reached via the eStruct2035280 Size field symbol).
  Each entry: +0 active flag, +1 stored x, +2 stored y, +4 pointer to a battle object. It scans for an entry whose
  active flag is nonzero and whose +4 pointer equals the r5 battle object. On a hit it reads the object''s NameID
  (halfword), Alliance and DirectionFlip bytes and calls getBattleArmPositionMaybe_8018810 (r1=3 as the position
  selector) to derive the arm/hand position; the returned x is stored at slot+1 and the returned y is negated and
  shifted up 8 pixels (y = -y - 8) before being stored at slot+2. If no slot tracks the object it returns 1 without
  writing anything. The stored coordinates look like data consumed elsewhere (e.g. HUD or effect placement tracking
  an object''s arm), so this is a position-sync helper, not a state changer.

  '
