name: battle_startObjectInvisible
address: '0x08010474'
kind: function
status: probable
summary: 'Turns a battle object invisible: sets its flashing/invisibility countdown, raises the invisibility
  flag, and plays sound effect 0x93.'
interface: (r5 = battle object, r4 = invisibility/flashing timer) -> r0 = 0; flags clobbered by callees
details: Loads the object's CollisionData pointer from oBattleObject_CollisionDataPtr and writes r4 into
  oCollisionData_FlashingInvisTimer, which counts down while the invisibility (flash) lasts. It then ORs
  OBJECT_FLAGS_INVIS into the object's ObjectFlags1 via object_setFlag1, making the object invisible/untargetable
  by the collision system. Finally it plays sound effect 0x93, presumably the invisibility-activation
  sound. Inputs are passed in registers held by the caller (r4/r5), so this is a leaf-style effect routine
  operating on the caller's active object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strh r4,[r2,#oCollisionData_FlashingInvisTimer] stores the timer into the object's collision
    data; object_setFlag1 with OBJECT_FLAGS_INVIS sets the invisibility flag on the object; PlaySoundEffect(0x93)
    plays a sound tied to the effect; called from sub_8013EC2/sub_8013EF0/sub_801E7518 which set r4/r5
    beforehand
