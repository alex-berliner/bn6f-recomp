name: object_applyXVelocity
address: '0x080DDB98'
kind: function
status: probable
summary: Moves a battle object horizontally by its XVelocity and resyncs its panel/collision position
interface: (r5 = battle object; r0, r1 = scratch) -> r0 = object pointer passed to callees; no meaningful
  return
details: Loads oBattleObject_XVelocity from the object at r5, adds it to oBattleObject_X, and stores the
  sum back into oBattleObject_X. It then calls object_setPanelsFromCoordinates to recompute the object's
  PanelX/PanelY from the new world X/Y/Z, and object_updateCollisionPanels to copy the new panel position
  into its collision record and recompute facing for the move. No bounds or collision checks are done
  here; only the X axis is advanced, so Y/Z movement must be handled by sibling routines. r5 rather than
  r0 carries the object pointer, implying the caller sets r5 before this step in an update sequence.
