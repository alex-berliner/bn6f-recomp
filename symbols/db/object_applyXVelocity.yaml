  detail: ldr r0,[r5,#oBattleObject_XVelocity]; add r0,r0,r1 where r1=[r5,#oBattleObject_X]; str r0 back
    to oBattleObject_X — velocity integrated into X; bl object_setPanelsFromCoordinates immediately after
    the store — panel coords derived from new position; bl object_updateCollisionPanels — collision record
    and facing synced for the move; no other fields touched in the 10-instruction body — purely an X-axis
