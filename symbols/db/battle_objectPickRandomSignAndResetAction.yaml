name: battle_objectPickRandomSignAndResetAction
address: '0x0811555C'
kind: function
status: probable
summary: Writes 0xA to the object's StaminaDamageCounterDisabler, stores a random +1/-1 (from (GetPositiveSignedRNG()&2)-1)
  into ExtraVars, zeroes the halfword at +0x6C, then resets the object's action to 8 via battle_ResetObjectActionState_80165B8.
interface: (r5 = battle object) -> r0 = 0 (from battle_ResetObjectActionState); sets collisionData disabler
  byte, ExtraVars, and halfword +0x6C
details: Stores 0xA into oCollisionData_StaminaDamageCounterDisabler of the object's collision data, which
  evidently suppresses that counter's effect. Calls GetPositiveSignedRNG and computes (rng & 2) - 1, storing
  -1 or +1 into oBattleObject_ExtraVars — a random binary choice. Clears the halfword at object+0x6C (likely
  a timer or repeat counter). Finishes by calling battle_ResetObjectActionState_80165B8, setting the current
  action to 8 and clearing the phase, i.e. returning the object to its idle/none state.
