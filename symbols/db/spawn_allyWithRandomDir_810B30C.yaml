name: spawn_allyWithRandomDir_810B30C
address: '0x0810B30C'
kind: function
status: confirmed
summary: Spawns a generic type-1 battle ally (descriptor 0x7000404), stores its handle in ExtraVars, picks
  a random −1/+1 movement direction, and clears a halfword status at object offset 0x6C.
interface: void spawn_allyWithRandomDir_810B30C(u32 r1 /*caller_arg*/, u32 r5 /*battle_object_ptr*/);
  /* clobbers r0-r4, r6-r7, flags; preserves r5-r7 */
details: Loads descriptor 0x7000404 into r4, zeroes r2 and sets r3=0xFF, then calls spawn_t1_0x47_probablyGeneric_80C468C
  to create a generic type-1 entity (likely a Navu or companion). The returned entity handle is stored
  at [r5 + oBattleObject_ExtraVars]. battle_setObjectExtraFlagC_80C46C6 is then invoked with that handle
  (likely a post-spawn initialization hook). GetPositiveSignedRNG produces a random number; bit 0 is extracted,
  shifted left by 1, and decremented by 1 to yield either −1 or +1, stored at [r5 + oBattleObject_ExtraVars
  + 8] as the horizontal movement direction. Finally, a halfword at r5+0x6C is zeroed (a per-object status
  or flag field). Registers r5, r6, r7 are preserved; on exit r0=0x6C and r1=0, with flags reflecting
  the SUBS r0,#1 from the direction calculation and the zero from MOV r1,#0.
