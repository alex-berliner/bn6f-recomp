name: battle_waitPhaseThenSetCurAction
address: '0x080B9160'
kind: function
status: probable
summary: 'Battle-object state step: on phase 0 it starts anim 0 with a 30-frame timer, then when the timer
  expires sets CurAction=8 and resets the phase.'
interface: (r5 = battle object, no register args) -> r0 = scratch only; no return value, flags clobbered
details: 'Self-styled routine taking the object in r5. If oBattleObject_CurPhase is 0 it writes phase=4,
  CurAnim=0, and TimerAndTimer2=0x1E (30 frames) and returns. Otherwise it decrements oBattleObject_Timer;
  while it is still positive it does nothing, and when it reaches 0 it stores 8 into oBattleObject_CurAction
  and clears CurPhaseAndPhaseInitialized to 0. So it is a one-shot delay/state handler: arm a 30-frame
  wait, then hand control to action 8. Which gameplay behavior action 8 corresponds to is not visible
  here.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80B9160+2: ldrb r0,[r5,#oBattleObject_CurPhase]; tst r0,r0 branches to timer wait when
    nonzero; init branch stores 4 to CurPhase, 0 to CurAnim and 0x1E to oBattleObject_TimerAndTimer2;
    wait branch decrements oBattleObject_Timer with ''sub r0,#1; bgt'' until it hits zero; on expiry stores
    8 to oBattleObject_CurAction and 0 to oBattleObject_CurPhaseAndPhaseInitialized'
  refs:
  - bn6f/asm/asm31.s:2088
  reproduce: python3 tools/asmcat.py 0x080B9160
