name: ai_getVersionSlotIndex_810F1E6
address: '0x0810F1E6'
kind: function
status: confirmed
summary: Computes an AI version slot index from the battle object's ExtraVars field and the AI data's
  version byte (6 entries per extra var).
interface: int ai_getVersionSlotIndex_810F1E6(AIData* aiData /* r4 */, BattleObject* obj /* r5 */); //
  returns r0 = obj->ExtraVars * 6 + aiData->Version, tail-calls back to lr
details: 'Small leaf helper (returns via mov pc, lr, so callers pass the return address in lr and it

  preserves nothing it doesn''t need to). Reads oBattleObject_ExtraVars (u32) from the battle

  object in r5 and oAIData_Version_16 (u8) from the AI data in r4, then returns

  ExtraVars * 6 + Version in r0. The multiply-by-6 implies a table of 6 entries (words or

  slots) per extra-var value, indexed by the AI data''s version byte - i.e. the version byte

  selects an entry within one extra-var group and ExtraVars selects the group. Sets flags as

  a side effect of the mov/mul (nz c v clobbered) but callers appear to only use r0.

  '
