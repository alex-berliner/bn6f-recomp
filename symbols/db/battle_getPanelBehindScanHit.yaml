open_questions:
- exact meaning of battle_scanPanelsInFront's return value (panel pointer vs x/column vs panel index)
  and its struct size, to confirm the ±1 arithmetic
- what callers use the returned square for (e.g. spawning an object one tile short of a target)
- The summary is mostly right, but `sub_80FFE72` is the sole caller and the callee `object_getEnemyDirection`
  returns +1/-1 (so ±1 arithmetic on a panel/column coordinate is sensible). However, calling it 'getPanelBeforeFrontTarget'
  mixes 'before' (behind) and 'frontTarget' (ahead), which is confusing. A cleaner name reflecting 'panel
  just behind the scan hit, in front of the object' is better.
