    run wf investigate investigate-20261019-030611'
open_questions:
- which entities install this as an animation-end handler (no known callers)
- meaning of object bytes 0x64, 0x65 and 0x66
- whether sprite attribute bit 0x80 specifically means 'animation finished' rather than another flag
