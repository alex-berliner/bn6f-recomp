name: camera_CopyScrollToRenderLayers_80302F8
address: '0x080302F8'
kind: function
status: confirmed
summary: Copies the camera's current X/Y position (masked to 8 bits) into the scroll fields of all three render
  layers each frame.
interface: void sub_80302F8(void /* r10 = toolkit */) // sets r1 = camX, r2 = camY, r3 = renderInfo, r4 = 0xFF,
  r5 = camera, r7 = toolkit; NZ from "and r2, r4"
details: Reads the toolkit (r10) camera pointer (oToolkit_CameraPtr) and takes oCamera_Unk_04 as X and oCamera_Unk_06
  as Y from the camera struct. Each coordinate is masked with 0xFF (only the low 8 bits are used, suggesting the
  camera values are in fine 1/256-pixel units and only the integer pixel part scrolls). The X value is stored to
  oRenderInfo_Unk_10/_14/_18 and the Y value to oRenderInfo_Unk_12/_16/_1A of the render info struct (oToolkit_RenderInfoPtr),
  i.e. the same scroll offset is written to three consecutive layer pairs (likely BG layers 0-2), synchronizing
  all backgrounds to the camera position. Only r7, r5, r4, r3, r1, r2 and flags are modified beyond the stores;
  r4 holds the 0xFF mask and NZ flags come from masking Y.
