name: battle_enemyShootProjectilePhase
address: '0x080BDDCA'
kind: function
status: probable
summary: 'Battle phase that fires an enemy attack: plays sound 0x6A, spawns two temp attack objects (subtype
  5) from ExtraVars-reused slots at obj+0x68/0x6C seeded via sub_80B8E58, ends the related object''s animation,
  and spawns a type-0x1D element-3 object on the tile in front, then counts Timer down to advance to phase
  8.'
interface: (r5 = battle object ptr) -> r0 = 0; on completion writes phase 8 to oBattleObject_CurPhaseAndPhaseInitialized
details: 'Runs once (oBattleObject_PhaseInitialized==0 branch): sets CurAnim to 0xE with CurAnimCopy 0xFF,
  Timer to 10, and plays sound 0x6A. It then spawns type-1 subtype-5 temp attack objects from fields at
  obj+0x68 (reused via sub_80EB572 if ExtraVars+0x10 is nonzero, else freshly spawned with id word 0x10006)
  and obj+0x6c (id 0x10005), each seeded from ExtraVars+8/+0xC via sub_80B8E58. It ends the related object''s
  current animation, reads the enemy''s facing via object_getFrontDirection, and spawns a type-3 object
  with element word 0x100000 and id 0x1D at (PanelX+direction, PanelY), ORing flag 0x10 into its oObjectHeader_Flags.
  Finally it stores phase state 4 in PhaseInitialized; on later runs it decrements Timer and Timer2, resetting
  PhaseInitialized when Timer2 expires and moving to phase 8 when Timer expires.'
