open_questions:
- Which enemy uses this handler and what attack id 0x1D / element word 0x100000 represent in game terms
- Semantics of ExtraVars+8/+0xC/+0x10 and the target pointers at obj+0x68/0x6C
- No callers known, so where in the enemy phase table this is registered is unconfirmed
- The summary's 'type-3 object with id 0x1D' matches `mov r4,#0x1d` and `dword_80BDEB8 = 0x100000`, and
  the audio/animation details match. However, the timer logic at loc_80BDE3C only decrements Timer and
  Timer2 and jumps to phase 8 (via CurPhaseAndPhaseInitialized word store) when *Timer* expires, not Timer2;
  Timer2's expiry resets PhaseInitialized. Naming is fine but could be sharper.
