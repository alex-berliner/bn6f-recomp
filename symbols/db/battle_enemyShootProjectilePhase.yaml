- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb PhaseInitialized; strb 0xE to CurAnim, 0xFF to CurAnimCopy, strh 0xA to Timer, bl PlaySoundEffect(0x6A)
    — one-shot attack windup; bl spawn_t1_0x5_tempAttackObject_80B8E30 with r7=obj+0x6c, r4=0x10005 —
    spawns an attack object linked to a target from ExtraVars; bl object_getFrontDirection; add PanelX;
    bl battle_SpawnAndInitObjectType3_80C4FFE with r4=0x1D, dword 0x100000 — places an object one tile
    in front of the enemy; orr 0x10 into oObjectHeader_Flags of the spawned object, then strb 4 to PhaseInitialized;
    tail decrements Timer/Timer2 and writes 8 to CurPhaseAndPhaseInitialized — standard battle phase-handler
