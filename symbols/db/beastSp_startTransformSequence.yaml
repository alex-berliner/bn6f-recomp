name: beastSp_startTransformSequence
address: '0x0804CBDC'
kind: function
status: probable
summary: Loads two 0x20-byte tile transfers, configures blend (0x1F09) into toolkit RenderInfo and 0x48/0x37 into
  Unk2009740, freezes BG scroll, dispatches a per-form handler by AIData Unk_0c (0-2→sub_804CC58, 3→sub_804CC6E,
  4-5→sub_804CC7E), runs sub_804CCF0, sets state 4, and calls beastSp_spawnIndexDispatcher_804CC8E.
interface: (r5 = battle/AIData struct (reads Unk_0c, writes Unk_0x10), r10 = toolkit) -> void; no return value
details: 'Queues a 0x20-byte tile from byte_86A39B0 into BG tile VRAM at 0x600CFE0 and another 0x20 bytes from byte_86A3990
  into the queue buffer at byte_3001B00, i.e. prepares the transformation overlay/flash tile. It writes 0x1F09 (a
  BLDALPHA-style blend: EVA=0x1F, EVB=9) to toolkit RenderInfo+0xA and bytes 0x48/0x37 into the Unk2009740 struct,
  configuring the screen effect. SetDummyBGScrollCallbacks freezes background scrolling for the duration of the
  cutscene. It then calls one of five handlers via off_804CC40 indexed by the AIData Unk_0c byte (entries 0-2 share
  sub_804CC58, 3/4/5 differ — likely form-specific variants), followed by sub_804CCF0. Finally it stores 4 into
  r5+0x10 as the next state and calls beastSp_spawnIndexDispatcher_804CC8E to advance the beast-out spawn logic.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'QueueEightWordAlignedGFXTransfer twice: byte_86A39B0 -> VRAM 0x600CFE0 and byte_86A3990 -> byte_3001B00,
    0x20 bytes each (effect gfx); strh 0x1F09 to [r4+oToolkit_RenderInfoPtr]+0xA sets a blend/fade value for the
    transformation flash; bl SetDummyBGScrollCallbacks installs no-op scroll/HBlank handlers, freezing the BG during
    the sequence; call table off_804CC40 indexed by ldrb [r5,#0xc]<<2 selects a form-specific handler, then r5+0x10
    = 4 sets the next state; ends with bl beastSp_spawnIndexDispatcher_804CC8E, tying this to the beast-spawn route
    (beastsp)'
