name: ai_attackArriveAtTargetPanel
address: '0x080F678E'
kind: function
status: probable
summary: 'Delayed AI-attack step: when the step timer runs out, teleports the object to the target panel
  and arms a hit element.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = clobbered; no meaningful return
details: Decrements oAIAttackVars_StepTimer and returns while it is still positive. On expiry, sets the
  object's CurAnim to 0, copies oAIAttackVars_TargetPanelX/Y into oBattleObject_PanelX/Y, then calls object_setCoordinatesFromPanels
  to recompute pixel position, object_updateCollisionPanels to sync the panel into the collision record
  and refacing, and battle_initGroundedCollider for a grounded default (zero height, shadow on, region
  1). Finally stores 8 into oAIAttackVars_HitElement, likely an element/property flag for the ensuing
  hit. No callers are known, so the exact attack it belongs to is unidentified.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r7,#oAIAttackVars_StepTimer]; sub #1; bgt return — gated step handler of an AI attack
    sequence; ldrb TargetPanelX/Y stored into oBattleObject_PanelX/Y, then object_setCoordinatesFromPanels
    — object teleports to the target panel; bl battle_initGroundedCollider — resets collider to grounded
    default after arriving; mov r0,#8; strh r0,[r7,#oAIAttackVars_HitElement] — sets hit element 8 after
    arrival'
