name: t3_0x50_80CE530
address: '0x080CE530'
kind: function
status: confirmed
summary: 'Per-frame update for the type-3 battle object in state 0x50 (a fast-lunge attack): dispatches the object''s
  state handler, then refreshes its sprite.'
interface: void update(r5=battleObject /* also r4, r7, r8, r10 live inputs */) -> outputs r5, r8-r12 (object pointer
  possibly advanced); clobbers r0-r4, r6, r7, lr and nzcv
details: 'State-machine step for a battle object (r5) whose CurState byte is 0x50-range; the routine loads oBattleObject_CurState,
  indexes the jump table at off_80CE548 with it, and tail-calls the handler with the state byte in r0 and the table
  entry in r1. Handlers: state 0 -> battleObject_initFastLunge_80CE554 (begins the lunge), state 1 -> battleObject_finishAndDespawn_80CE5F0,
  state 2 -> object_genericDestroy. Whatever the handler leaves in r5 is then passed to object_updateSprite, so
  the handler may advance or swap the object pointer before the sprite refresh. The handler''s r8-r12 results stay
  live in the register file and are what callers read back — this routine is essentially an adapter around the per-state
  handler plus the common sprite update.

  '
