name: object_checkStatusFlag_811BE90
address: '0x0811BE90'
kind: function
status: confirmed
summary: Loads a status byte from a lookup table indexed by the object's field at +0xC and sets the Z flag on whether
  it is zero.
interface: bool sub_811BE90(void *obj /* r5 */); // returns flag byte in r0, table base in r2, zero/nonzero in Z
  flag
details: 'Reads a byte-sized index/ID from [r5+0xC] of the object/state struct passed in r5, uses it as an index
  into the byte table at byte_811BF94, and returns the selected byte in r0 with the NZ flags set from it (so callers
  branch on Z for "flag is zero"). The table address is also left in r2. It is a pure predicate with no side effects:
  no memory writes, no calls, only r0/r2 and flags change. The trailing "mov pc, lr" returns without touching lr,
  so callers must not rely on lr preservation beyond the immediate return. What the flag byte means depends on the
  caller; the table indexed by [r5+0xC] suggests a per-kind or per-state flag lookup (e.g. an enabled/disabled or
  valid/invalid property keyed by an object type/state id).

  '
