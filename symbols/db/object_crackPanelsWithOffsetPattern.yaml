name: object_crackPanelsWithOffsetPattern
address: '0x080DB48A'
kind: function
status: probable
summary: Applies the panel-crack effect to every tile offset in a selected pattern list, centered on a
  given tile.
interface: (r0 = base x, r1 = base y, r2 = arg passed to crack routine, r3 = pattern index into PanelOffsetListsPointerTable)
  -> r0 = result of last crackPanel call; no meaningful flags
details: r3<<2 indexes PanelOffsetListsPointerTable to fetch a pointer to a list of signed-byte (dx,dy)
  pairs. It loops over pairs, stopping when the first byte is 0x7F (terminator), calling object_crackPanelDup1
  with x=r0+dx, y=r1+dy, and r2 forwarded unchanged. Each pair is 2 bytes; the list is effectively an
  area-of-effect shape template (e.g. a crack/spread pattern). All three parameter registers besides the
  pattern index come straight from the caller, so r2's meaning is whatever object_crackPanelDup1 takes.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r4, off_80DB560 (=PanelOffsetListsPointerTable); ldr r4,[r4,r3] selects the pattern by r3;
    ldrsb r0/r1 then cmp r0,#0x7f; beq locret — 0x7F first byte terminates the (dx,dy) pair list; add
    r0,r0,r6; add r1,r1,r7; bl object_crackPanelDup1 — applies crack effect at each offset from base (r6,r7);
    loop advances r4,#2 per iteration, confirming 2-byte signed offset entries
