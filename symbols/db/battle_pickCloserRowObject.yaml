open_questions:
- The only known caller sub_80E175C is itself unnamed, so the game-level use (which Beast Out special
  or targeting routine invokes this and with which two candidates) is unconfirmed
- Whether callers pass enemies, allies, or generic objects, and whether the tie-break ordering matters
  for gameplay (e.g. front-row preference), needs caller analysis
- The code loads oBattleObject_PanelY from r6 (A) at offset oBattleObject_PanelY, and offset 0x13 from
  r7 (B), but the proposal says both use oBattleObject_PanelY. The line `ldrb r2, [r7,#0x13]` reads a
  different offset for B; if 0x13 == B's PanelY, then code matches, otherwise B's field differs. Also,
  the tie-break uses ref.PanelY vs A.PanelY, returning A when ref >= A, which matches the proposal. Offset
  0x13 vs the documented PanelY offset is the discrepancy; assuming offset 0x13 is B's PanelY, the row-closer
  logic fits.
