name: battle_drawChipSelectNameAndIconRows
address: '0x0804A8F4'
kind: function
status: probable
summary: Renders the chip-select screen's fighter-name row and chip-icon row into background tile block
  2, the icon column extent being capped at 7 by a clamped global.
interface: (object ptr left in r5 by caller; r0 = [r5+0x24] halfword param read internally) -> r0 clobbered;
  draws into tile block 2 via CopyBackgroundTiles
details: Reads a halfword at [r5+0x24] (r5 = caller-supplied object, since r7=r5 with r5 never set) and
  passes it as the entry-count argument to battle_drawChipSelectFighterNames_81200EC (with buffers word_202A020/unk_2034458
  and count 0xb). It then copies that tile block to background at (0x14,4) block 2, 8 x min(dword_200ACB0_field30,
  7) tiles. It calls battle_loadChipIconSlots_8120458 (r0=[r5+0x24], buffers word_202A020/unk_20345A8,
  count 0xb, flag 0x30216) and copies those tiles to (0x1c,4), 1 x 14. The clamp of dword_200ACB0+0x30
  to 7 caps how many icon/name columns are blitted. Both rows are drawn into tile block 2, so this is
  a screen-refresh of the chip select UI's two rows.
