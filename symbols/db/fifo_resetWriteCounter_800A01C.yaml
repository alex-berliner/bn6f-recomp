name: fifo_resetWriteCounter_800A01C
address: '0x0800A01C'
kind: function
previous_names:
- sub_800A01C
status: probable
summary: Resets the FIFO ring-buffer write counter (byte_3000EA8, the write index of dword_3002180) to
  0; companion to fifo_pushRecord16_8009FF8.
interface: '(void) -> nz flags ; side effect: writes 0 to byte_3000EA8 (0x03000EA8)'
details: "The function sets r0 = 0, loads the address 0x03000EA8 (byte_3000EA8 in IWRAM) into r1, then\n\
  \  writes r0 as a 32-bit word to [r1], clearing that location to zero. It is a tail-call (`mov pc, lr`)\n\
  \  returning to the caller with no preserved input, only the NZ flags clobbered by the `str` operation.\n\
  \  All four callers are battle-state-related (battle_update_8007A44, initBattleStructsAndVram_80071D4,\n\
  \  sub_8007B9C, sub_8007F4E), suggesting this is a small per-frame/per-transition reset of some\n  battle\
  \ bookkeeping byte. The exact role of byte_3000EA8 is not in the supplied struct definitions,\n  so\
  \ the \"SomeEWRAMByte\" hedge is honest; the contract `out=['nz']` plus writes to r0/r1 indicate\n \
  \ the caller treats the call as void.\n"
