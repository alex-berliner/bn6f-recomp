name: object_phaseHandlerWait3FramesToPhase8
address: '0x080C290C'
kind: function
status: probable
summary: 'Battle object phase-update handler: initializes the current phase (animation 4, clears related
  object, 3-frame timer) and once the timer expires advances the object to phase 8.'
interface: (r5 = battle object ptr) -> r0 = clobbered; updates oBattleObject_CurAnim, RelatedObject1Ptr,
  Timer, PhaseInitialized, CurPhaseAndPhaseInitialized
details: Standard per-frame phase handler taking the object in r5. On first invocation (oBattleObject_PhaseInitialized
  == 0) it sets oBattleObject_CurAnim to 4, zeroes oBattleObject_RelatedObject1Ptr, loads oBattleObject_Timer
  with 3, and sets the initialized flag. On every later frame it decrements oBattleObject_Timer and returns
  while it is still positive; when the count reaches 0 it stores 8 into oBattleObject_CurPhaseAndPhaseInitialized
  as a halfword, which both selects the next phase (8) and clears the initialized flag so that phase's
  handler re-initializes. No other state is read or written; the transition target and animation are hard-coded.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / tst+bne gates one-time initialization vs. per-frame
    countdown; init block: strb #4 to oBattleObject_CurAnim, str #0 to RelatedObject1Ptr, strh #3 to oBattleObject_Timer;
    countdown: ldrh Timer, sub #1, strh, bgt exit — exits until timer reaches 0; strh #8 to oBattleObject_CurPhaseAndPhaseInitialized
    ends the phase, clearing the initialized bit via the halfword write; push {lr}/pop {pc} with no arguments
    or return value — pure state-machine step on the object in r5'
