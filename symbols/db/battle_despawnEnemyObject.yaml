name: battle_despawnEnemyObject
address: '0x080E33D2'
kind: function
status: probable
summary: 'Tears down a defeated enemy battle object: signals a linked object, notifies a per-enemy counter
  via the enemy''s version/actor/AI record, then frees the object slot.'
interface: (r0 unused, r5 = battle object ptr via caller convention) -> r0 clobbered; sets flag 0x4 on
  RelatedObject2's flags when Param1 == 0xFF
details: Reads oBattleObject_Param1; if it equals 0xFF and oBattleObject_RelatedObject2Ptr is non-null,
  it ORs flag 0x4 into that object's oObjectHeader_Flags (likely telling a linked/child object, e.g. a
  summon or panel object, that its owner is gone). It then loads oBattleObject_NameID and calls unpackVerActorTyAndAIIdx_800F29C
  to decompose it into the enemy's {version, actor type, AI index} register triple, calls sub_8011044
  with r2=1 (possibly decrementing a live-enemy count for that kind), and finally calls object_freeMemory
  to unlink and free the object's slot. Ran on the recorded battlesweep and beastsp routes, consistent
  with enemy-death cleanup.
