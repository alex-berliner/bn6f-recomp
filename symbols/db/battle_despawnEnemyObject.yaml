name: battle_despawnEnemyObject
address: '0x080E33D2'
kind: function
status: confirmed
summary: Removes an enemy battle object, dragging along a chained related object when flagged, and frees its memory.
interface: void battle_despawnEnemyObject(object in r5); returns with whatever object_freeMemory leaves in r0-r3/r5
  and flags (nzcv)
details: 'Entry point takes the battle object to despawn in r5. If the object''s

  oBattleObject_Param1 byte is 0xFF (a "chained/attached" marker), it reads

  oBattleObject_RelatedObject2Ptr; if that is non-NULL it sets bit 2

  (0x04) of the related object''s oObjectHeader_Flags, marking that object

  to be cleaned up together with its owner. It then reads the object''s

  oBattleObject_NameID halfword, calls unpackVerActorTyAndAIIdx_800F29C to

  split it into the version-specific actor type and AI index, passes those

  plus the object pointer to battle_runObjectTeardownByNameID (sub_8011044)

  for actor-slot bookkeeping, and finally releases the object''s memory with

  object_freeMemory. The function is a tail-of-chain wrapper: it preserves

  nothing and its visible return state is exactly object_freeMemory''s.

  '
