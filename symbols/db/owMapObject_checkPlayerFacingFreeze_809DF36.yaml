summary: Reads the player's frozen-animation byte from eStruct200ace0 and returns its current value.
interface: () -> r0 = byte at eStruct200ace0+0 ; clobbers r7
details: "- The function pushes lr then loads r7 from the literal pool entry `eStruct200ace0`.\n  - It\
  \ jumps into a tiny trampoline (`loc_809DF3A`) that loads `ldrb r0, [r7]` and `pop {pc}` to return that\
  \ byte in r0 (zero-extended).\n  - `eStruct200ace0` is the small EWRAM block `S200ace0` whose offset\
  \ 0x02 is `owPlayerFixedAnimationSelect_02` (per `S200ace0.inc`); given the caller sits in `ow_player.s`,\
  \ this read is most plausibly the player's \"fixed animation select\" flag used to decide whether the\
  \ player can change facing while frozen.\n  - The contract lists lr as an input (consumed by `pop {pc}`);\
  \ only r7 is destroyed and r0 holds the return value.\n  - All captured call sites share `r3 = 0x020047cc`\
  \ (likely the OWPlayerObject pointer) and return `r0 = 1` with the Z bit still set, suggesting the byte\
  \ is being treated as a boolean (`!= 0`) by the caller.\n  - No callees; this is a leaf helper assembled\
  \ next to its only caller.\n"
