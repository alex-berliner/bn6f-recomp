name: sub_81273B4
address: '0x081273B4'
kind: function
status: probable
summary: If event flag 163 is set, increments a per-toolkit progress counter and shows either the in-progress or
  completion text script (0x12 or 0x13) via the chatbox/text-script runner.
interface: void sub_81273B4(u32* toolkitContainer /* r10 */);
details: 'Guards on event flag 163 via TestEventFlagFromImmediate; if the flag is clear it

  returns immediately. Otherwise it dereferences r10 through oToolkit_Unk200a220_Ptr

  to obtain a toolkit pointer, calls sub_8121198 to fetch the current progress

  counter, then writes counter+1 back to toolkit+0xC UNLESS the new value equals

  0xF (15), in which case the counter is left untouched and 0x13 is treated as the

  final/completion script; otherwise the in-progress script 0x12 is shown. The

  chosen script id is passed to sub_8127578 along with fixed chatbox arguments

  (palette/base = 0x600AC00, text-script pointer = eTextScript201BF20, dest

  buffer = unk_201A600) and a 0 second parameter. The 0xF cap acts as the terminal

  step, after which further entries into this function will keep showing 0x13.

  '
