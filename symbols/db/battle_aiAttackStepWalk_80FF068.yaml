name: battle_aiAttackStepWalk_80FF068
address: '0x080FF068'
kind: function
status: confirmed
summary: AI attack step handler that walks the enemy one panel toward its target before landing the hit.
interface: u32 battle_aiAttackStepWalk(u32 object /* r5 */, u32 vars /* r7 */, u32 r1_in) -> r1 (untouched
  caller r1 on the countdown paths, else last callee's r1); r8-r12 preserved; flags clobbered
details: 'Per-frame step handler for a "walk up and attack" AI action, operating on a battle

  object (r5) and its oAIAttackVars block (r7). First invocation: AttackElement is 0,

  so it writes AI_ELEM_WALKING (4) into oAIAttackVars_AttackElement, checks

  object_canMove, and if the object can move loads two context words from a

  per-alliance table at byte_80FF0CC (entry = alliance<<3: alliance 0 gives

  {0x10, 0x0F88}, alliance 1 gives {0x30, 0x0F80}) and tail-calls the AI''s

  oAIAttackVars_PanelChooseCallback via mov lr,pc / bx r1 with

  r0=oAIAttackVars_TargetObjectPtr and r1=the callback address itself. If the

  callback returns nonzero r0 (chosen X) it stores FuturePanelX/FuturePanelY on the

  object, calls object_reservePanel, sets oBattleObject_CurAnim = 4 (walk anim), sets

  flag OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, clears the collision region, and

  sets oAIAttackVars_StepTimer = 5. Later frames count StepTimer down; at zero it sets

  oAIAttackVars_HitElement = 4 to trigger the attack''s hit. Failure paths (cannot

  move, or the callback returns X == 0) cancel the attack by writing

  oAIAttackVars_AttackDuration = 0x3C and oAIAttackVars_HitElement = 0x10.

  '
