name: bg_drawArenaTiles_8125E78
address: '0x08125E78'
kind: function
status: probable
summary: Renders the battle arena background floor tiles, selecting between a Dark-Chip-team layout (alliance==5)
  and a standard-team layout based on the object's team field.
interface: void bg_drawArenaTiles_8125E78(arena_obj *r5)
details: 'Reads the team/alliance identifier at obj+0x60; returns immediately if it is 0. Computes a row
  index from obj+0x74 (subtracting the 0x71 base) and a tile-set id from obj+0x2c (u16).  When alliance
  == 5 the function additionally calls sub_81261FC to initialise the tile background and sub_812625C to
  set a 4-wide tile block of value 5 before placing tiles; the standard path skips those two calls.  Both
  branches then execute the same six-stage pipeline: place a tile at map coords (0xa, 0xb) with tile numbers
  0x70 (Dark Chip) or 0x71 (regular), draw a 4-wide tile strip (value 0xa), copy a tilemap from ROM data
  at byte_8124A14 into VRAM 0x6007400, draw a 2x14 tile region, update the map via sub_8126494, and copy
  a tile-patch block.  Row offsets added to the computed base differ between the two layouts (e.g. +1/+6/+4/+0xe
  for Dark Chip vs +3/+1/+0xb for regular).  Globals referenced: byte_2017A00 (active tileset), dword_201EC20
  (active map buffer), byte_8124A14 (ROM tile-source data).'
