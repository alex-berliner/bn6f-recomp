  index, not Timer2 itself, contradicting ''Timer2 doubles as a byte-list cursor''. Panel decode (r1=row
  high nibble, r0=col low 3 bits) is right; the row validity check `cmp r1,#0 / cmp r1,#3 bgt` is valid
  1..3, not ''exhausted''. spawn call passes r3=0x60000, matching. Name ''battle_updatePanelEffectList''
  is fine; summary is slightly off on cursor and exhaustion.'
