name: battle_updatePanelEffectList
address: '0x080CB898'
kind: function
status: probable
summary: Battle-object update that every 4 frames spawns a type-4 effect (effect type 0) at a panel decoded
  from a byte list indexed by (Timer2+4); Timer2 decrements each tick and the object is destroyed when
  it underflows.
interface: (r0 = battle object pointer in r5) -> r0 = clobbered; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY when done
details: 'Runs on a battle object (r5). A 4-frame Timer gate makes it act every 4th frame; on that frame
  it reads the byte at [r5 + oBattleObject_Timer2] (Timer2 doubles as a byte-list cursor): the low 3 bits
  are a panel column and the high 4 bits a panel row. It converts that panel to 16.16 fixed-point screen
  coords via object_getCoordinatesForPanels and spawns a type-4 effect object (effect type 0) at that
  position with parameter r3 = 0x60000. Timer2 is then decremented each tick, walking backwards through
  the byte list; when it goes below zero the object is marked CUR_STATE_DESTROY.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Timer==0 gate sets Timer=4: ''cmp r0,#0 / bne ... / mov r0,#4 / strh r0,[r5,#oBattleObject_Timer]'';
    Byte at [r5+Timer2] split into nibbles: ''ldrb r0,[r5,r0] / lsr r1,r0,#4 / lsl r0,r0,#0x1d'' then
    fed to object_getCoordinatesForPanels; Spawn with param 6<<16: ''mov r3,#6 / lsl r3,#0x10 / bl spawn_t1_0x0_EffectObject'';
    Cursor decrement and destroy: ''sub r0,#1 / strh ... / bge locret ... mov r0,#CUR_STATE_DESTROY'';
    Timer!=0 path just decrements Timer, confirming a periodic every-4-frames action'
  refs:
  - bn6f/asm/asm31.s:42375
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x080E05F6 spawn_t1_0x0_EffectObject
  reproduce: python3 tools/asmcat.py 0x080CB898
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The 4-frame gate and Timer2 walk match (Timer reset to 4, then decremented at loc_80CB8D8; Timer2
    read, decremented at loc_80CB8CA). The byte-list read at `add r0, #4 ; ldrb r0, [r5,r0]` uses Timer2+4
    as index, not Timer2 itself, contradicting ''Timer2 doubles as a byte-list cursor''. Panel decode
    (r1=row high nibble, r0=col low 3 bits) is right; the row validity check `cmp r1,#0 / cmp r1,#3 bgt`
    is valid 1..3, not ''exhausted''. spawn call passes r3=0x60000, matching. Name ''battle_updatePanelEffectList''
    is fine; summary is slightly off on cursor and exhaustion.; run wf investigate investigate-20261018-200615;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
coverage:
- battlesweep
