name: object_blinkPanelsThenSet
address: '0x080E1FB6'
kind: function
status: probable
summary: Battle object that blinks a set of panels as a warning for Param3 frames, then permanently converts
  them to panel type Param1 and frees itself.
interface: '(r5 = battle object: Param1 = target panel type, Param3 = blink duration in frames) -> r0
  = destroyed; touches oPanelData_Type/oPanelData_Alliance via panel setters'
details: 'Each tick increments oBattleObject_Timer. While Timer < Param3, every 8th frame (carry of Timer>>3)
  it calls object_setPanelTypeBlink on panels: a loop over x=6..0 with r1=2 (row/area selector), then
  four (x,y) pairs read from byte_80E2060: (2,1),(2,3),(2,5),(1,5); empty panels (Type==0) are skipped,
  and each panel''s own oPanelData_Alliance is forwarded as the blink alliance. Once Timer >= Param3,
  it re-applies the same panels with object_setPanelType (final, non-blinking type Param1) and releases
  its slot with object_freeMemory. Param1 is the panel type being applied; the two-phase structure is
  a standard ''flash warning, then commit'' attack effect.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh/strh on oBattleObject_Timer and 'cmp r0, Param3 / bge loc_80E2010' split the routine into
    blink phase and commit phase; lsr r0,#3 / bcs makes the blink calls fire only every 8th frame during
    phase 1; both phases call object_setPanelTypeBlink / object_setPanelType with r2 = [r5,#oBattleObject_Param1]
    as the panel type and r3 = oPanelData_Alliance of the target panel; the second phase ends with 'bl
    object_freeMemory', freeing the object's slot after the panel change commits; off_80E205C points to
    byte_80E2060, an (x,y) pair table iterated 4 times with 'add r7,#2'
  refs:
  - bn6f/asm/asm31.s:90953
  - 0x08003458 object_freeMemory
  - 0x0800C90A object_getPanelDataOffset
  - 0x0800CC0A object_setPanelType
  reproduce: python3 tools/asmcat.py 0x080E1FB6
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-230610'
open_questions:
- No caller is known, so which attack/boss spawns this object and what panel type Param1 typically holds
  (e.g. poison, cracked) is unconfirmed
- Exact meaning of the r1=2 argument to object_getPanelDataOffset/setPanelType* (row vs area index) needs
  the callee's documentation
