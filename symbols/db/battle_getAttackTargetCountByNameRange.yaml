- method: assembly-reading
  date: '2026-10-21'
  detail: The function calls object_getEnemyByNameRange twice, with ranges 1 and 0x3D, and returns the
    sum of their counts.; sub_810D4BA checks the count and iterates out[] while calling object_setInvulnerableTime
    with 0xFFFF.; sub_810D4E8 clears AiAttackParam, then iterates the returned count and calls object_clearInvulnerableTime
    on each out[] entry.; sub_810D516 iterates the returned count, accesses each object's BattleObject
    fields, and spawns a T1 effect.
