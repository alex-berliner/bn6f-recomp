name: battle_getAttackTargetCountByNameRange
address: '0x0810D498'
kind: function
status: probable
summary: Counts two categories of enemy battle objects by the caller's alliance and returns the total
  while optionally writing their object pointers to the supplied array.
interface: (r0 = u32 *out, r1 unused) -> r0 = total count; flags caller-dependent
details: Queries enemy name-range 1, writes its count to out[0], and queries name-range 0x3D, returning
  the sum of both counts. It uses r5, implicitly containing the current battle object, and reads that
  object's alliance field for both searches. Callers use the count to iterate out[] and invoke invulnerability
  setters, clear invulnerability, or spawn effects, so out[] contains pointers to qualifying enemy objects.
  The second search argument is passed directly from a constant table pointer and may encode a name-range
  descriptor rather than a plain identifier.
