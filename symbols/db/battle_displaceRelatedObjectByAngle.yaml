name: battle_displaceRelatedObjectByAngle
address: '0x080C060A'
kind: function
status: probable
summary: Moves a battle object's attached/related object along a direction taken from the trig tables
  by a caller-supplied magnitude, while drifting the owner's Y/Z up by 2 each call (used for dash/charge
  motion effects).
interface: (r0 = magnitude (fixed-point, scaled by <<8), r1 = angle index 0..255 into math_cosTable/math_sinTable)
  -> r0 = clobbered; reads/writes [r5+RelatedObject1Ptr]+0x34 triple and r5 oBattleObject_Y16/Z16
details: Looks up math_cosTable[r1] and math_sinTable[r1], multiplies each by r0 and shifts left 8 to
  form fixed-point deltas. Loads the 3-word block at RelatedObject1Ptr+0x34 (likely x/?,z of an attached
  sprite's position), adds the cos delta to the first word and the sin delta to the third, and stores
  it back; the middle word is untouched. It then increments the owning object's Y16 and Z16 by 2 each
  call, so repeated calls move both the owner and its attached object steadily. r1 is masked to 8 bits
  by the caller, matching the 256-entry trig tables. In sub_80C0544 the angle is (timer*0x70)&0xff and
  magnitude timer*4, followed by sprite_setColorShader(0x2108); in sub_80C05C6 it is called once with
  (0,0) and followed by a countdown to sprite_disableAlpha, i.e. a timed fade/motion phase.
