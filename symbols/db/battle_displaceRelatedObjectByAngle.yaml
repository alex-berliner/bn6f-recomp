    attached object''s pos words 0 and 2; sub_80C0544: r1=(Timer*0x70)&0xff angle, r0=Timer*4 magnitude,
    then sprite_setColorShader 0x2108; sub_80C05C6: calls it with (0,0) then counts Timer down and calls
