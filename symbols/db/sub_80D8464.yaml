status: confirmed
summary: Initialize a "FlagMan"-style battle object (snap to panel, load sprite/animation, set stats, build hitbox,
  grant invulnerability) and advance its phase to CUR_STATE_UPDATE.
interface: 'Next sub_80D8464(void);

  // Inputs:  r5 = oBattleObject*

  // Outputs: r5 preserved (object pointer unchanged)

  // Clobbers nz/c/v, r0-r3, lr

  '
details: "- Object init routine patterned exactly on the existing FlagMan-style object\n  constructors (compare\
  \ with the other object_init_* / setup siblings): it\n  snaps the object to its current panel, copies PanelXY\
  \ into FuturePanelXY,\n  zeros Z, loads sprite slot 0x80 sub 0x10 variant 0, drops the shadow,\n  and sets the\
  \ \"belongs to player\" bit (oObjectHeader_Flags |= 2).\n- Starts animation 3 on both oBattleObject_CurAnim and\
  \ the mirrored\n  oBattleObject_CurAnimCopy slot, then calls sprite_setAnimation /\n  sprite_loadAnimationData\
  \ / sprite_update.\n- Applies sprite_setPalette(0), then decrements oBattleObject_Z16 and\n  oBattleObject_Y16\
  \ by 1 (rendering offset for layering).\n- Writes the stat sheet: oBattleObject_NameID = 0xD2, oBattleObject_HP\
  \ = 1,\n  oBattleObject_MaxHP = 1 (matches the FlagMan-style \"1 HP token\" stat\n  pattern seen elsewhere).\n\
  - Calls object_createCollisionData; if it returns NULL (tst r0,r0; bne),\n  bails via object_freeMemory and returns.\n\
  - Otherwise calls object_setupCollisionData(0xE, 0xF, 3) (14-panel x / 15-panel\n  y hitbox, 3-frame lifetime),\
  \ object_presentCollisionData, and\n  object_setFlag1(OBJECT_FLAGS_INVULNERABLE) — i.e. freshly spawned objects\n\
  \  are invulnerable until their first state update.\n- Stamps CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized\n\
  \  so the per-frame dispatcher will run the update logic next.\n- 0x80/0x10 / sprite slot, 0xD2 name id, 1/1 HP,\
  \ and invulnerability on\n  spawn are the \"FlagMan\" tell; the proposed name reflects that without\n  claiming\
  \ a definitive identity beyond probable.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
