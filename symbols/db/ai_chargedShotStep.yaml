name: ai_chargedShotStep
address: '0x080EF9A2'
kind: function
status: probable
summary: 'Per-frame step for an AI navi''s charged-shot attack: begins charge (anim 5, sound 0xb0, spawns
  per-navi temp attack object, sets flag bit 22, StepTimer=0x15, AttackElement=4), at StepTimer=0xc computes
  the front panel and fires sub_80CF91E with Damage+AttackBoost and AttackBoost2 (on hit, X-velocity=8<<16);
  when StepTimer expires, decrements ChargeCycles (clear charge sprite and loop if remaining, else set
  HitElement=8).'
interface: (r5 = battle object, r7 = oAIAttackVars attack-state struct) -> void; sets AttackElement/StepTimer/HitElement
  state in the attack vars
details: 'If AttackElement is 0 the attack begins: animation 5 plays, sound 0xb0 fires, a per-navi entry
  (base from sub_80EBB34 plus getNaviIdFromActor*0x100) is passed to the temp-attack-object spawner at
  object+0x4C, flag bit 22 is set on the object, StepTimer is set to 0x15 and AttackElement to 4 (charging).
  While StepTimer equals 0xC, it computes the panel in front of the navi (front direction + PanelX/PanelY)
  and calls sub_80CF91E with Damage+AttackBoost and AttackBoost2; on success it spawns a mover with XVelocity
  = 8<<16 (forward). StepTimer counts down each frame; when it drops below 0, ChargeCycles is decremented
  — if still cycles remain the charge sprite is detached (RelatedObject1Ptr and oAIData_TempAttackObjectPtr
  cleared) and AttackElement reset, otherwise HitElement is set to 8.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'init branch: object_setAnimation(5), PlaySoundEffect(0xb0), spawn_t1_0x5_tempAttackObject_80B8E30
    with navi-keyed table entry; StepTimer==0xC path builds target panel from object_getFrontDirection
    + oBattleObject_PanelX/PanelY and calls sub_80CF91E with Damage+AttackBoost; spawned mover gets XVelocity
    = 8<<16, i.e. a forward shot; ChargeCycles countdown decides between resetting attack state and setting
    HitElement=8 — a charged attack with limited charge; state stored in oAIAttackVars fields (AttackElement,
    StepTimer, ChargeCycles, Damage, AttackBoost) matches the shared AI attack-var struct'
  refs:
  - bn6f/asm/asm31.s:120170
  - 0x080005CC PlaySoundEffect
  - 0x080EBAE8 battle_getNaviIdFromActor
  - 0x0800E2CA object_getFrontDirection
  reproduce: python3 tools/asmcat.py 0x080EF9A2
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function is identical to sub_80EF92C except it uses AttackBoost2 (used as Damage+AttackBoost
    spread: r6=Damage+r3, r4=AttackBoost2 separately) while the other function used r6=Damage+r3, r4=Damage2
    in sub_80CF91E. The name should reflect navi charged-shot; ''ai_chargedShotStep'' is fine, but the
    summary''s claim that the function decrements ChargeCycles and resets only when cycles remain matches
    `ble loc_80EFA2A` (≤0 sets HitElement=8, otherwise clears sprite refs). One concrete error: the proposal
    says ''flag bit 22 is set'' which matches `1 << OBJECT_FLAGS_UNK_BIT_22_BIT`. The summary otherwise
    fits the asm.; run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
