name: sub_811B314
address: '0x0811B314'
kind: function
status: confirmed
summary: Starts a requested animation on an object's sprite and hides its shadow, unless the sprite's state byte
  has the 0x08 flag set.
interface: void sprite_startAnimNoShadow_811B314(u32 objectId /* r0 */, u32 animId /* r1 */);
details: 'Takes an object id in r0 and an animation id in r1 (stashed in r4). Looks the object up in the sprite/entity
  list rooted at 2008450 via getStructFrom2008450, which returns the sprite struct in r1 and signals "not found"
  through the Z flag. Returns without doing anything if no struct was found, or if the struct''s first byte (a state/flags
  byte, [r1+0]) has bit 0x08 set — that flag appears to mean "animation locked / don''t touch". Otherwise it calls
  sprite_setAnimation(animId) on the struct, then sprite_loadAnimationData() to load the new animation''s frame
  data, then sprite_noShadow() to disable the sprite''s shadow blob, so this is a one-shot "play this animation
  with no shadow" helper for sprites/effects that float (air attacks, flying enemies, etc.). Leaves r2 = 8 (the
  mask value tested) and, per the lifter''s caller analysis, r5 holding the sprite struct pointer after the callee
  chain runs; the function itself preserves r4/r5 on every path.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
