name: owMapObject_weatherTornado_repickDirection_80A90E4
address: '0x080A90E4'
kind: function
status: confirmed
summary: Rolls a new random compass direction for an overworld weather tornado, validates the target tile, shifts
  direction history in the weather table, and bumps the spawn counter.
interface: void owMapObject_weatherTornado_repickDirection(owMapWeatherTornado *tornado /*r5*/, u8 *weatherTable
  /*r6*/); /* r10 context passed through; r8-r12 side-effects from isBlocked */
details: 'Tornado object fields touched: +4 = weather slot index (byte), +5 = current direction (byte, 0-7), +6
  = previous direction (byte), +0xC/+0x10 = current position backup (word), +0x18/+0x1C = saved position used for
  rollback (word), +0x28 = spawn counter (byte). Calls reqBBS_81409D0(8) for the RNG roll (note: reqBBS clobbers
  r6/r7, so r6 is reloaded from the call result). Calls owMapObject_weatherTornado_step_80A9038 to advance one tile,
  then owMapObject_weatherTornado_isBlocked_80A90CC; Z=1 means the tile is free and the loop exits. If blocked,
  position and direction are restored and the roll is retried. After a successful pick the function writes the history
  chain in weatherTable: table[0x31+slot] is shifted to table[0x19+slot], and table[0x31+slot] receives the old
  (previous) direction. Finally table[0x28] on the tornado is incremented. The byte tail (0,0) is alignment padding.'
