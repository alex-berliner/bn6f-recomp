name: ai_attackTimerExpired
address: '0x080FD98C'
kind: function
status: probable
summary: Counts down an AI attack's step timer; on expiry clears flag 0x40, marks the object as moving,
  and sets the attack's hit element to Random.
interface: (r7 = battle object AI attack vars) -> void; sets no meaningful flags of its own
details: Decrementing is done in place on the ObjectAttackVars StepTimer halfword at r7+0x?; while it
  is still >0 the function returns immediately. When the timer hits zero, it clears ObjectFlags bit 0x40
  via object_clearFlag, ORs the CURRENTLY_MOVING_1 flag into ObjectFlags1 via object_setFlag1, and stores
  0xC (element 'Random') into oAIAttackVars_HitElement. This looks like the point in an enemy attack script
  where a windup ends and the actual hit/movement begins with a random-element attack.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/strh on oAIAttackVars_StepTimer with sub #1 and bgt locret: a delay loop that does nothing
    until the timer expires; bl object_clearFlag with r0=0x40: clears an ObjectFlags bit once the timer
    runs out; bl object_setFlag1 with r0 = 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT: marks the object as
    starting to move; strh #0xC into oAIAttackVars_HitElement: assigns element value 0xC to the attack;
    callees object_clearFlag/object_setFlag1 confirm r7 points at a battle object''s collision/AI data'
