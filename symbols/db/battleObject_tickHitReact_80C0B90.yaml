name: battleObject_tickHitReact_80C0B90
address: '0x080C0B90'
kind: function
status: confirmed
summary: Per-frame update for a battle object's freeze/hit-react phase; triggers a reaction anim and SFX
  0xBE, then advances the object to phase 4 once a short timer expires.
interface: void sub_80C0B90(void)  // reads/writes via battle object in R5; clobbers R0, R1, LR, sets
  NZCV
details: "Drives a small per-object state machine via the PhaseInitialized byte:\n  - First entry (PhaseInitialized\
  \ == 0): sets CurAnim = 2, calls\n    PlaySoundEffect(0xBE) (a hit/freeze reaction SFX), arms a 5-frame\n\
  \    Timer, then stamps PhaseInitialized = 4 to mark the entry work done.\n  - Subsequent ticks: decrements\
  \ the 16-bit Timer field each call; when\n    it reaches zero, clears bit 0x02 in the ObjectHeader Flags\
  \ byte\n    (likely a \"busy/animation playing\" flag) and writes 4 to\n    CurPhaseAndPhaseInitialized\
  \ to advance the object's phase to 4.\nFields touched on the battle object (offsets relative to R5):\n\
  \  oBattleObject_PhaseInitialized, oBattleObject_CurAnimAndCurAnimCopy,\n  oBattleObject_Timer, oObjectHeader_Flags,\n\
  \  oBattleObject_CurPhaseAndPhaseInitialized.\nQuirks:\n  - The \"if (timerVal > 0)\" check is implemented\
  \ as ARM BGT against the\n    subtraction, with V forced 0 so it reduces to a signed-positive\n    nonzero\
  \ test on the loaded 32-bit value.\n  - Despite only writing 5 (which fits a u8), the Timer field is\
  \ stored\n    as a u16 (strh), matching the original.\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
