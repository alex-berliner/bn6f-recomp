  date: '2026-10-19'
  detail: 'push {r4-r7,lr}; bl FreeOverworldMapObject; pop {r4-r7,pc} — entire body is a passthrough call;
    r0 is not modified before the bl, so the object pointer is forwarded verbatim; callee summary: FreeOverworldMapObject
    releases the object, clears its allocation bit, and unmarks it in the sprite system'
  refs:
