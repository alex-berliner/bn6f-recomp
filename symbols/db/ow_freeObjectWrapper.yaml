name: ow_freeObjectWrapper
address: '0x080A79D4'
kind: function
status: probable
summary: Thin wrapper that frees an overworld map object, likely used as a cleanup/destructor callback.
interface: (r0 = overworld map object pointer) -> r0 = FreeOverworldMapObject return value; flags clobbered
  by call
details: The function preserves r4-r7 and lr, immediately tail-calls FreeOverworldMapObject with r0 unchanged,
  then returns. FreeOverworldMapObject clears the object's active bit in the global allocation bitfield,
  marks its slot free, and unmarks it in the sprite system. Since a plain wrapper around a single call
  serves no purpose as a direct call, it is most plausibly registered somewhere as a function pointer
  (e.g., an object's free/destructor handler). r1-r3 and flags are simply inherited from the callee's
  contract. Nothing else is touched.
