name: object_runCollisionHandler
address: '0x080CCDFC'
kind: function
status: probable
summary: 'Per-frame battle-object collision handler: spawns the hit effect, clears the collision region
  if flagged, and dispatches to the current action''s collision routine.'
interface: (r5 = battle object) -> void; r0 clobbered by callees
details: First tears down the object's previous collision data and spawns a hit-effect object at the object's
  position (jittered via RNG). If the battle is over it clears the collision region and sets CurState
  to CUR_STATE_DESTROY. Otherwise it loads the collision flags left by the last collision (oCollisionData_FlagsFromCollision)
  and tests them against a per-alliance mask word from byte_80CCE5C (alliance*4 index); on match it clears
  the collision region. If time-stop is active it instead just refreshes present-collision state; otherwise
  it dispatches via a 4-entry jump table indexed by oBattleObject_CurAction to action-specific collision
  handlers (sub_80CCE64/80CCEAC/80CCED0/80CCF88).
