- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData/object_spawnCollisionEffect at entry: cleanup of prior collision
    + hit effect spawn; ldr r2,[r2,#oCollisionData_FlagsFromCollision] and tst against byte_80CCE5C[alliance*4]:
    reacts to flags from the last collision; battle_isBattleOver branch sets CurState = CUR_STATE_DESTROY
