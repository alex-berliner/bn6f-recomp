name: collision_resetAllHitData_801986C
address: '0x0801986C'
kind: function
status: confirmed
summary: Resets the collision system by clearing the active-collision bitfield, reinitializing all 32 collision
  data slots with unique one-hot index bits, and clearing the collision scratch buffer.
interface: void sub_801986C(void); // reads toolkit ptr from r10; preserves r2-r5 and r10; clobbers r0,r1,lr and
  NZCV
details: 'Zeroes eActiveCollisionDataBitfield (the global "collision currently active" bitmask), then

  walks the array of oCollisionData_Size-sized slots pointed to by the toolkit''s

  oToolkit_CollisionDataPtr field (r10 + offset). Each of the 32 slots is zero-filled via

  ZeroFillByWord and its oCollisionData_CollisionIndexBit field is set to a unique one-hot bit:

  0x80000000 for slot 0, 0x40000000 for slot 1, and so on down to 1 for slot 31. The loop uses

  the shifting mask itself as the termination condition, so the slot count is hardwired to 32.

  Afterwards it calls clearScratchBuffer_2034F60_8019FA4 to wipe the collision scratch buffer at

  0x02034F60. This is a full per-frame (or per-scene-load) reinitialization of collision-hit

  bookkeeping — each slot''s CollisionIndexBit doubles as its "in use / which hit" identifier in

  later collision checks.

  '
