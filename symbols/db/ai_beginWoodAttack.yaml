name: ai_beginWoodAttack
address: '0x080F194C'
kind: function
status: probable
summary: AI attack-state handler that initiates a wood-element attack (anim 7, 30-frame duration) and
  ticks it down until exiting the attack state
interface: (r7 = battle object AI vars, r5 = battle object) -> void; no meaningful return
details: 'Called every frame while the object is in this attack state. On entry, if oAIAttackVars_AttackElement
  is 0 it initializes the attack: writes element 4 (wood), sets oBattleObject_CurAnim to 7, loads oAIAttackVars_StepTimer
  with 30 frames, and if oAIAttackVars_ScratchVar is non-null sets byte at +9 to 2 (likely a substate/flag
  for the spawned effect or target). On subsequent frames it decrements StepTimer, and when it reaches
  zero calls object_exitAttackState to return to normal AI behavior. Uses the oAIAttackVars fields AttackElement,
  StepTimer and ScratchVar and the object''s CurAnim field.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne loc_80F196C — element 0 means attack not
    yet started, so first pass is the init branch; strb r0(4) to AttackElement, strb 7 to oBattleObject_CurAnim,
    strh 30 to StepTimer — element/anim/duration setup; strb #2 to [r2,#9] via oAIAttackVars_ScratchVar
    — marks a byte in a scratch/effect struct; loc_80F196C: decrement StepTimer, bgt exit — frame-countdown
    wait for the attack to finish; bl object_exitAttackState when timer hits 0 — hands control back to
    the AI state machine'
  refs:
  - bn6f/asm/asm31.s:125843
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F194C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
