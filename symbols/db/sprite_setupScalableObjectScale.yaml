name: sprite_setupScalableObjectScale
address: '0x080A6D5C'
kind: function
status: probable
summary: Makes a battle object's sprite scalable, applies scale values taken from a battle-object list
  node, and sets a follow-up sprite state.
interface: (r0 = battle object) -> r0 = 1 (success); flags destroyed by calls
details: The object in r0 is first passed to sprite_makeScalable, which repoints its sprite data to a
  16-byte-aligned scalable variant. It then reads a node entry via battleObject_getFromListPair_80A6E78
  and loads two halfwords from offsets +2 and +4 of that entry — likely horizontal and vertical scale
  factors — passing them with r0=0 to sprite_setScaleParameters (r0 is presumably a scale mode or axis
  select). Finally it calls sub_80A6E70 with r0=6, which likely sets a sprite render flag/state (6) on
  the object. The function always returns 1 and takes no error path.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_makeScalable immediately on entry converts the object''s sprite to scalable form;
    ldrh r1,[r0,#2] / ldrh r2,[r0,#4] pull two halfword parameters from the list-node entry; mov r0,#0
    then bl sprite_setScaleParameters applies those values as scale parameters; mov r0,#6 then bl sub_80A6E70
    sets a follow-up sprite/property state; mov r0,#1 / pop {pc}: constant success return, no failure
    branch'
