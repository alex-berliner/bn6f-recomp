name: camera_checkLinkEndSync
address: '0x08131068'
kind: function
status: probable
summary: 'Checks link-battle camera end-sync readiness: dispatches on mode (4 forces end state at r5+1; 1 aborts);
  otherwise copies link-camera fields, scans two 0x10-byte entries against eLinkState, then verifies sub_81325C0
  pair matches [r5+0x26] (0x10 or 0x8) before setting end-camera state at r5+2=0x24.'
interface: () -> void; uses global r5 (eCamera-like struct) and eLinkState via sub_803E8F8, no args or return value
details: 'Dispatches on the mode byte of eStruct200BC30 via sub_803EAE4: mode 4 immediately sets byte [r5+1]=0x34
  and clears bytes +2/+3; mode 1 does nothing. Otherwise it copies eLinkState fields (0x1C, 0x0A) into the eCamera
  end struct (camera_copyLinkStateToEnd), stores [r5+0x2A] into [r5+0xA] and [r5+0x26] into end+8, then scans two
  0x10-byte entries returned by sub_81323B0 (skip if -1), comparing entry+4 against eLinkState+0x1C and entry+2
  against eLinkState+0xA. If both match (bitmask r3 exhausted), it re-checks the value at [r5+0x26] (0x10 or 0x8)
  against the pair returned by sub_81325C0 (order of r0/r1 checks depends on sub_803DD60''s result), and on success
  sets byte [r5+2]=0x24 and clears bytes [r5+0xC] and [r5+3]. Finally calls sub_8131570 and sub_8131458 every frame.'
