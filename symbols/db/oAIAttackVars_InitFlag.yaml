name: oAIAttackVars_InitFlag
address: '0x2'
kind: struct-field
status: probable
summary: Element type of the attack's hit/projectile (e.g., Fire, Aqua, Elec, Wood) passed as a parameter
  to projectile-spawning routines.
details: Across the asm corpus, this field is consistently loaded into r2 and forwarded alongside panelX/Y,
  damage, and the 0c flags word into spawn routines such as sub_80C5176, sub_80C5578, sub_80C67D8, sub_80D07A0,
  sub_80D19D4, sub_80D1442, sub_80D398E, sub_80D5718, spawnDollThunderObject_80D5890, sub_80D6B78, sub_80D7ED4,
  sub_80DDBAC, sub_80DDDCC, sub_80DE660, sub_80CF91E, spawnRiskyHoneyObject_80D32FE, sub_80DB800, sub_80DB970,
  sub_80F0B80's collision-region spawn, and the asm31 sub_80EC350 attack resolver. Each spawn call pattern
  is `ldrb r2, [r7,#oAIAttackVars_Unk_02]` followed by panelX/panelY damage/0c — the same slot that BattleChip/projectile
  spawners receive as the element byte. Initialization sites also assign distinct per-attack values (1,
  2, 3, 0x10, 0x20, 0x40, 0x80), matching a small enum of element IDs rather than a flag or counter. No
  access pattern is consistent with a boolean, counter, index into a non-element table, or angle magnitude.
