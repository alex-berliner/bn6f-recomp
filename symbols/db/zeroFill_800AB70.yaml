name: zeroFill_800AB70
address: '0x0800AB70'
kind: function
status: confirmed
summary: Zero-fills the fixed 0x20-byte work buffer at IWRAM 0x203EAE0, leaving r2/r3 untouched for the caller.
interface: void zeroFill_workBuf20_203EAE0(/* passthrough */ int r2, int r3); // preserves r2, r3
details: 'Trivial wrapper: loads the address byte_203EAE0 (a 32-byte IWRAM buffer) into r0, sets r1 = 0x20, and
  tail-calls ZeroFillByWord to word-wise clear it. r2 and r3 are neither set nor read by this function itself; the
  register contract shows callers passing values in r2/r3 and reading them back unchanged, so they are pass-through
  across the call. Flags (nz c v) are clobbered by the ZeroFillByWord call, so the caller cannot rely on flag state.
  The 0x20-byte buffer is probably a small scratch/ staging area (e.g. chatbox or sprite scratch); its purpose is
  not evident from this function alone.'
