name: battle_handleBeastOutStep_8089AE8
address: '0x08089AE8'
kind: function
previous_names:
- sub_8089AE8
status: probable
summary: 'Beast-out AI step: when chatbox/cutscene flag 0x80 is clear, advance chip-lockout and decide
  the controlled beast''s next facing/animation state.'
interface: '(r0 = toolkit via r10, r5 = battleObject, r7 = ?, lr) -> r0 = 1 ; side effects: clears PanelY
  in battle object, sets OW player facing to 4 (down), pushes a fixed OW player animation via eStruct200ace0,
  rewrites battle object byte0 to either 0x70 or 0x6c, calls sub_8089CB0(0|0x1e)'
details: "Pushes {r4-r7,lr}. Reads chatbox/cutscene flag word via chatbox_mask_eFlags2009F38(0x80); if\
  \ the bit is set (bne) the function short-circuits to returning 1.\n  Otherwise it calls battle_tickChipLockout_8089CB4;\
  \ if that returns equal (timer still running / condition false), it also returns 1.\n  When the chip\
  \ lockout has elapsed, the function focuses the cutscene camera on the player (cutsceneCamera_focusCameraOnPlayerMaybe_8036faa),\
  \ clears the BattleObject.PanelY byte ([r5,#0x13]=0), sets the OW player facing direction to 4 (SetOWPlayerFacingDirection(4)),\
  \ then GetOWPlayerFacingDirection is fed into owPlayer_setS200ace0_fixedAnimationSelect_809e13c so the\
  \ OW sprite mirrors the beast's facing. It then branches on [r7,#0x10]: when 0, it calls sub_8089CB0(0)\
  \ and writes 0x70 to BattleObject byte 0 (CurAnim); otherwise calls sub_8089CB0(0x1e) and writes 0x6c.\
  \ Always returns 1 in r0.\n  The 0x70/0x6c values look like two variant CurAnim ids the beast controller\
  \ cycles between, and the [r7,#0x10] test picks the variant. sub_8089CB0 takes the variant as its r0,\
  \ which based on its contract writes flags+something via r5 (likely a state/timer store).\n  Note: writes\
  \ to byte 0 of the BattleObject ([r5]) and to PanelY ([r5,#0x13]) - these are the BattleObject header\
  \ byte and the PanelY field respectively per BattleObject.inc.\n"
