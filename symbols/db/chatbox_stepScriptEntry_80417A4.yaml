name: chatbox_stepScriptEntry_80417A4
address: '0x080417A4'
kind: function
status: confirmed
summary: Processes one 4-byte chatbox script entry — dispatches the byte at offset 3 as a script ID to the chatbox
  config handler, or advances the script cursor past a 0xFF end-of-entry marker.
interface: 'Next chatbox_stepScriptEntry(void); /* in: r4 = pointer to current script entry; out: r0 = 1 always,
  flags set, r4 = advanced cursor on the 0xFF path, r2/r3 preserved */'
details: 'Called with r4 pointing at the current chatbox script entry (4 bytes per entry).

  Reads the byte at entry offset 3 (r1 = *(u8*)(r4+3)).

  If that byte is 0xFF (entry terminator / "go to next line" marker), it bumps the

  script cursor by one entry (r4 += 4) and returns.

  Otherwise it calls chatbox_config_80408D0(notUsed=3, scriptID=byte), letting the

  chatbox interpreter run the script/dialog command the byte selects. The

  "mov r0, #2" before "mov r0, #3" is dead code left in the original binary.

  Always returns r0 = 1 (truthy, "entry processed"). On the terminator path the

  NZ/C/V flags come from the r4 += 4 add; on the dispatch path they come from

  chatbox_config_80408D0, then both paths set NZ from r0 = 1.

  '
