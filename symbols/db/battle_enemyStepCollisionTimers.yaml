- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_removeCollisionData then tst on oCollisionData_FlagsFromCollision drives the ExtraVars+0x10/0x14
    counter/timer update (loc_80DC794 path); off_80DC7EC is a 4-entry jump table by oBattleObject_CurAction
    invoked with the mov lr,pc; bx r1 long-call idiom; Panel XY is saved before the handler and compared
    after; a change resets ExtraVars+0x10 and re-sets region 1; CurAction values 0 and 0xC are special-cased
