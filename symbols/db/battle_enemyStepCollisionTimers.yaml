name: battle_enemyStepCollisionTimers
address: '0x080DC778'
kind: function
status: probable
summary: 'Per-frame update for a battle enemy object: tears down/rebuilds its collision data, manages
  a collision-based counter and 8-step timer, then dispatches its current action handler and refreshes
  panel/collision state.'
interface: (r5 = battle object, set by caller) -> void; r4/r7 preserved, lr used for the long-call dispatch
details: The function operates on the object in r5 (a callee-saved frame register the caller sub_80DC730
  sets). It removes the object's collision data, and if the collision flags (oCollisionData_FlagsFromCollision)
  are nonzero it clears the region, increments ExtraVars+0x10, and loads ExtraVars+0x14 with 8. When CurAction
  is neither 0 nor 0xC and the collision region is 0, it decrements ExtraVars+0x14 and, once it hits 0,
  sets collision region 1. It then saves the object's panel XY, long-calls one of four action handlers
  via off_80DC7EC indexed by CurAction (values 0..3), and if the panel XY changed afterwards it resets
  ExtraVars+0x10 and — unless CurAction is 0xC — sets region 1 again. Finally it highlights the panel
  the object stands on and refreshes per-frame collision data via object_presentCollisionData.
