name: setFadeModeIfFading_8127B08
address: '0x08127B08'
kind: function
status: confirmed
summary: Sets [battle object + 2] = 4 (fade-out / hiding mode) while the screen fade is in progress, then
  returns
interface: u32 sub_8127B08(void *r5_obj_ptr) -> r0; flags nz c v clobbered
details: 'Called on a per-frame or per-step tick on a battle object held in r5. Probes

  IsScreenFadeActive via GUEST_CALL; when it returns Z=1 the function is a

  pass-through (returns IsScreenFadeActive''s r0 untouched, and does not touch

  the object). When Z=0 (fade is active), it writes the constant 4 to the

  byte at offset 2 of the object — this is the battle object''s "phase"/state

  field, used here to drive the fading/hiding transition for the sprite or

  panel linked to that object (consistent with offset 2 = phase byte used

  elsewhere in the battle object layout). The function does not clear flags,

  so on the active path N=0, Z=0, C, V preserved from the IsScreenFadeActive

  call exactly match the values the original `mov r0,#4` would set, letting

  the result be returned directly. r5 is taken to point into a battle object

  struct (this struct layout is shared across the battle-object tick handlers

  in this region of the ROM).

  '
