name: SetOWPlayerNaviColorShader
address: '0x0809E2F6'
kind: function
status: confirmed
summary: Stores the given color-shader id to be applied to the player's navi sprite while in the overworld.
interface: void SetOWPlayerNaviColorShader(u16 shaderId /* r0 */); returns r3 = eStruct2000aa0
details: 'Writes the halfword shader id from r0 into field word_2000AA6 (offset +6 of eStruct2000aa0, the per-frame
  overworld state struct at 0x2000AA0). This id selects the palette/color shader used to tint the player''s navi
  sprite on the overworld map, so the game can recolor the current navi (or copies of it) without separate sprites.
  Quirk: the original returns the struct pointer in r3 (a leftover from loading the base address) rather than a
  true void return; callers must not rely on other r-registers.

  '
