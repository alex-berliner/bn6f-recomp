open_questions:
- Which of the four Unk_03 cases corresponds to which enemy behavior (e.g. "charge player", "lunge toward
  target", "re-use last pick") is not distinguishable without more callers/context.
- Whether the bitmask from calc8DirBitmaskTowardsPoint is later consumed by SetAIDataUnk0x48Flag directly,
  or is just used to seed the FacingDirection — the assembly calls the helper before SetAIDataUnk0x48Flag
  but does not store r0.
