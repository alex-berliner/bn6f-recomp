name: SetCurPETNaviStatsHword
address: '0x080137E6'
kind: function
status: confirmed
summary: Writes a 16-bit value into a field of the NaviStats entry for the navi currently selected on the PET.
interface: 'void SetCurPETNaviStatsHword(naviId r0, fieldOffset r1, value r2, toolkit r10); out: r0 = entry offset,
  r3 = written address, flags from the base+offset add; r1/r2 preserved'
details: 'Computes which slot of the NaviStats array the PET''s currently selected navi occupies by calling GetNaviStatsIndexGivenCurPETNavi(r0),
  scaling the returned index by oNaviStats_Size, then adding it to toolkit->NaviStatsPtr (loaded via oToolkit_NaviStatsPtr
  off r10). Stores the halfword in r2 at [statsBase + index*oNaviStats_Size + fieldOffset(r1)]. r1 and r2 are pushed/popped
  around the callee since GetNaviStatsIndexGivenCurPETNavi clobbers them, so callers can rely on the offset and
  value surviving the call. Returns r0 = byte offset of the chosen entry, r3 = exact address written, and flags
  reflecting statsBase + entryOffset (an add-style flag computation, not a compare).

  '
