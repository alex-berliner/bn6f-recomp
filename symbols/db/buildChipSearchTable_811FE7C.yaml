name: buildChipSearchTable_811FE7C
address: '0x0811FE7C'
kind: function
status: confirmed
summary: Build a 0x20-byte-entry chip search/index table in the given buffer by scanning chips 1..0x13A,
  returning the entry count
interface: u32 sub_811FE7C(u32 dest /*r0*/, u32 mode /*r1*/) -> r0 = entry count; preserves r4-r7; clobbers
  r1-r3, lr, nzcv
details: "Zero-fills the destination buffer (via zeroFill_0xA000Words_811FF6C), then iterates chip\nindices\
  \ 1..0x13A (inclusive). For each chip, applies optional filters when mode!=0\n(skip chip \"0:137\",\
  \ chip type 2 at +7, flag bit 0x20 at +9) and always skips chips\nflagged at +0x16 bit 0x20. For each\
  \ of four search-item slots (offset 0..3) whose\nbyte != 0xFF, looks up the quantity pointer via getOffsetToQuantityOfChipCodeMaybe_8021c7c;\n\
  a zero quantity also skips. Otherwise writes a 0x20-byte entry into the destination\nbuffer, packed\
  \ as 8 little-endian u32 dwords whose high half is a payload field and\nwhose low half is a shared composite\
  \ \"key\" = (chipField_0x1C << 7) | searchItem:\n  +0x00: high = chip+0x1C (u16)\n  +0x04: high = chip+0x18\
  \ (u16)\n  +0x08: high = searchItem (u8, zero-extended)\n  +0x0C: high = map_chip_index(idx, key)  \
  \          (sub_811FF80)\n  +0x10: high = map_chip_element(chip+6)            (sub_811FF54)\n  +0x14:\
  \ high = quantity (u8, zero-extended)\n  +0x18: high = chip+8 (u8, zero-extended)\n  +0x1C: high = loadU16FromTableEntry(table_index)\
  \ (from chip code table), low = ((idx << 7) | searchItem)\nReturns (cur - dest) / 0x20 (SWI 6 signed\
  \ divide) as the entry count. Mode==0 disables\nthe three additional skip checks but the +0x16 bit-0x20\
  \ skip remains unconditional.\n"
