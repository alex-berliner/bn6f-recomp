name: ai_attackSpawnTimedTempObject
address: '0x080ED41C'
kind: function
status: probable
summary: AI attack step that once spawns a temp attack object, waits 10 frames, then removes it and ends
  the attack.
interface: () -> void; reads r5 = battle object, r7 = AI attack vars (oAIAttackVars)
details: On entry, if oAIAttackVars_AttackElement is 0 it calls sub_80B8E70 with the object's AIData TempAttackObjectPtr
  and 0 (likely spawning/initializing the temp attack object), sets StepTimer = 10 and writes AttackElement
  = 4 as a 'spawned' phase marker. Each call then decrements StepTimer; while it is still positive it
  returns. When the timer runs out it clears ObjectFlags1 bit 1<<22 via object_clearFlag, nulls oBattleObject_RelatedObject1Ptr
  and oAIData_TempAttackObjectPtr (detaching the temp object), and calls object_exitAttackState to leave
  the attack state. So the spawned object persists for about 10 frames attached to the user before being
  cleaned up.
