name: ai_attackSpawnTimedTempObject
address: '0x080ED41C'
kind: function
status: confirmed
summary: Per-frame AI attack step that starts a temp attack object's animation, counts a 10-frame timer, then tears
  the temp object down when it expires.
interface: void ai_attackSpawnTimedTempObject(BattleObject* r5 object, u32 r6 unused, AIAttackVars* r7 vars); leaves
  r1 = last callee's value (not meaningful)
details: 'Per-frame update for the "temp object" attack phase of an AI-controlled BattleObject.

  r5 = acting BattleObject, r7 = this attack''s oAIAttackVars block; r6 is passed through

  but never read. While oAIAttackVars_AttackElement is still 0 (spawn frame), it fetches

  the temp attack object pointer from AIData (oAIData_TempAttackObjectPtr, reached via

  oBattleObject_AIDataPtr), starts its animation with battle_setObjectAnim(tempObj, 0),

  arms oAIAttackVars_StepTimer to 10 frames and advances AttackElement to phase 4.

  On every call it then decrements StepTimer; while it stays >0 the attack keeps running.

  When the timer hits 0 the teardown runs: object_clearFlag(1<<22) clears the

  temp-object-attack-in-progress flag, oBattleObject_RelatedObject1Ptr is nulled, the

  oAIData_TempAttackObjectPtr back-reference is cleared, and object_exitAttackState(0,

  aiData) ends the attack state (r1 carries the AI data pointer into that call).

  Quirk: the teardown path overwrites r1 (via callees), so callers cannot rely on r1

  returning any computed value.

  '
