    one-shot spawn + 10-frame timer; bgt locret: pure frame countdown while timer > 0; mov r0,#1; lsl
    r0,#0x16; bl object_clearFlag: clears flag 0x400000 on cleanup; str r0 to RelatedObject1Ptr and TempAttackObjectPtr
    then bl object_exitAttackState: detaches temp object and ends attack'
