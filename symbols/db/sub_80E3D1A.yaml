name: sub_80E3D1A
address: '0x080E3D1A'
kind: function
status: confirmed
summary: Converts a pixel coordinate to a panel position, reads that panel's parameter bits, and sets a battle object's
  ExtraVars+8 flag to 1 when the panel type matches the object's alliance (normal panels for player-side, dark panels
  for enemies).
interface: int sub_80E3D1A(int x, int y, struct BattleObject* object /* r5, preserved */); returns x and y unchanged
  in r0/r1; also returns the alliance byte in r2; flags clobbered.
details: 'Preserves r0, r1, r5 via push {r0,r1,lr} / pop {r0,r1,pc}. Calls convertXYToPanelXY_800E258 to turn pixel
  (x,y) into a panel position in r0, then object_getPanelParameters to fetch that panel''s parameter bitmask. Reads
  BattleObject.Alliance (r5+oBattleObject_Alliance): alliance 0 uses panel mask 0x4000000 (normal panel bit); any
  nonzero alliance uses 0x8000000 (dark panel bit). If the bit is set, stores 1 into the dword at r5+oBattleObject_ExtraVars+8
  (ExtraVars[8]); the flag is never cleared here. Followed by a small data table (dword_80E3D38/byte_80E3D44) belonging
  to neighboring functions.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
