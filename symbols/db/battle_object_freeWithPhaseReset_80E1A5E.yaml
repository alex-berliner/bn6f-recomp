name: battle_object_freeWithPhaseReset_80E1A5E
address: '0x080E1A5E'
kind: function
status: confirmed
summary: Sets a battle object's phase-initialized flag and then frees the object's memory via object_freeMemory.
interface: void sub_80E1A5E(BattleObject* r5); // caller passes r5 (object) and lr; returns r0-r3 and nz,c,v as
  left by object_freeMemory
details: Takes a battle object pointer in r5 (preserved across the call). Stores 1 to the object's oBattleObject_PhaseInitialized
  byte, marking the phase as (un)initialized, then tail-continues into object_freeMemory with r0 = 1, freeing the
  object's memory. All result registers (r0-r3) and flags (nz,c,v) are simply whatever object_freeMemory leaves
  behind; lr is consumed by the return.
