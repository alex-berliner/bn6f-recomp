name: spawn_battleObjectVariantChildren
address: '0x080DE7C8'
kind: function
status: probable
summary: Spawns 4 child objects (type 200) around a battle object variant, using a per-variant 4-byte
  offset table.
interface: (r5 = battle object ptr) -> void; reads byte_80DE3F4[Param1*4 .. Param1*4+3]
details: Looks up a 4-byte table at byte_80DE3F4 indexed by oBattleObject_Param1, then loops 4 times calling
  battle_spawnObject200AtPanel with each table byte as r3, passing the parent's PanelX, PanelY, and Param1.
  Likely places the 4 child objects in a small pattern around the variant. math_sinTable is adjacent in
  the data section but not referenced by the code.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Loop r2=0..3 spawns exactly 4 children (loc_80DE7D4, cmp r2,#4); r3 each iteration = byte_80DE3F4
    + Param1*4 + i, the per-variant offset/direction; Caller spawn_battleObjectVariant calls it right
    after object_presentCollisionData and initPanelMotion, as part of finalizing the variant spawn; battle_spawnObject200AtPanel
    takes PanelX/PanelY from r5, confirming children are placed around the parent; Param1 is forwarded
    as an argument, so children inherit the variant id
  refs:
  - bn6f/asm/asm31.s:87261
  - 0x080DE430 spawn_battleObjectVariant
  - 0x080DE2F0 battle_spawnObject200AtPanel
  reproduce: python3 tools/asmcat.py 0x080DE7C8
  result: 'proposed by minimax/MiniMax-M3, self_score 3; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-023329'
open_questions:
- What the 4 table bytes actually represent (offsets? direction indices passed to sinTable?) — math_sinTable
  is in the data area but not directly referenced here
- What object 200 is and what role the 4 children play in the variant effect
