status: probable
summary: 'BeastSP battle object''s initialize-phase handler: primes its sprite/animation, halts the sprite-update
  chain, and leaves the object ready for the next state.'
interface: (r5 = object, r6 = unknown context) -> nothing explicit returned; side effects on sprite fields
  plus TailCall into battleObject_dispatchSpriteUpdate_8118874
details: 'Called during a battle object''s initialize phase: writes 0x23 into the object''s header

  byte 0 (typical "type/init" marker for BeastSP-derived objects), then initGuiSprite_8002770

  with r0=0x15, r1=&unk_20218F0 to bind a sprite resource of header type 0x15.

  Forces CurAnim+0 ([r5,#0xc]) to 0, calls sprite_setAnimation(0) and sprite_loadAnimationData

  to load frame data with no shadow, OAM priority 3, halfword slot 0x1D8 cleared, sub-record +A

  written with 3, palette bank 7 / palette 0, then sets [r5,#8]=4, [r5,#0xd]=0xFF (looks like

  forcing a render pass through the sub-slot selector). Computes a y/x-shaped coordinate from

  r6+0x20*0x14+0x1B and calls sprite_setCoordinates, then clears CurAnim again and runs the

  sprite update dispatcher (battleObject_dispatchSpriteUpdate_8118874) which copies the

  CurAnim into CurAnimCopy and then dispatches to one of 14 sprite routines. Because the

  dispatcher itself chains into sprite_update with whatever CurAnimCopy holds, BeastSP''s

  initialize handler forces CurAnim=0 right before the dispatcher to make it a no-op draw

  pass on the very first tick after init. Function ends with pop {pc} rather than bx lr.

  '
