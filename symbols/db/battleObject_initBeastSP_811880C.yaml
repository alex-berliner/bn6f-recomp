open_questions:
- 'What r6 points to: not a known struct in the project''s structs file; could be a battle state pointer
  or a per-panel column table'
- The byte 0x23 written into [r5] — the project uses [r5] as the byte that mostly receives Flags in the
  object header (offset +0), so 0x23 = ACTIVE|VISIBLE|UNUSED flags; combined with no Pause-update bit
  this matches "make visible"
