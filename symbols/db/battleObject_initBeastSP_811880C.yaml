name: battleObject_initBeastSP_811880C
address: '0x0811880C'
kind: function
status: confirmed
summary: 'Initialises the Beast Link special sprite: tags the record as type 0x23, loads its animation and tileset,
  sets palette/priority, positions it on-screen from the battle-slot row, then dispatches the OAM finalisation routine.'
interface: void battleObject_initBeastSP_811880C(SpriteRecord *r5, BattleSlotData *r6); /* r5, r6 in; r2, r3, r5,
  r10, r11 out (from dispatchSpriteUpdate) */
details: 'Sprite record (r5) is tagged with type byte 0x23 (BeastSP). initGuiSprite is called with sub-type 0x15
  and a data blob at unk_20218F0 (likely Beast Link tile/animation source). Animation index 0 is selected and its
  data loaded; the shadow flag is cleared. Priority is set to 3 and the tile offset 0x1D8 is stored via slotList_storeHalfwordAndClearField
  (identifies the Beast Link tile region in VRAM). The sub-record gets field A = 3, palette bank = 7, palette =
  0 – a unique colour set for the Beast Link overlay. Two state bytes are written: offset 8 = 4 (draw-state) and
  offset 0xD = 0xFF (sentinel/unset). Screen coordinates are computed as x = 0x88 (centred horizontally), y = 0x1B
  + (battle_data[0x20]) * 0x14, i.e. one row down per battle slot index, placing the sprite above the correct NetBattle
  icon. Finally battleObject_dispatchSpriteUpdate_8118874 is tail-called to commit the OAM entries.'
