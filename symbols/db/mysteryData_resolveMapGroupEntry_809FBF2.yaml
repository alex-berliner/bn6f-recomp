name: mysteryData_resolveMapGroupEntry_809FBF2
address: '0x0809FBF2'
kind: function
status: confirmed
summary: Resolves the per-map-group entry pointer for a mystery-data group table, returning the base pointer unchanged
  for all non-mystery-data group ids.
interface: u32* mysteryData_resolveMapGroupEntry_809FBF2(u32 groupId /*r0*/, u32* tableBase /*r1*/)
details: 'Takes a map-group id in r0 and a base pointer in r1. When the group id is 5 (the mystery-data map group),
  the base is treated as an array of 12-byte entries: the offset is computed as entryIndex*8 + entryIndex*4 (i.e.
  entryIndex*12), with the entry index built up as 0 here, so entry 0 is selected and the returned pointer equals
  the base. For any other group id the base pointer is passed through unchanged in r0. The 12-byte entry size matches
  the nearby mystery-data map group tables (RealWorldMysteryDataMapGroupEntries / InternetMysteryDataMapGroupEntries
  pointers and byte_2000210 are pooled right after the routine). The entry index being hardcoded to 0 suggests this
  inlined form is used where only the first entry of the mystery-data group table is needed, or that other call
  sites supply different index constants. r0 is the only meaningful output; r2-r7 are preserved. Note the assembly
  computes the index via (idx<<3)+(idx<<2), a mul-free 12x for Thumb.

  '
