open_questions:
- what scene/state jumptable index 0x34 corresponds to (which handler receives control after the transition)
- which object types the 0x21 argument to FreeAllObjectsOfSpecifiedTypes selects
- why the GameState pointer is loaded but apparently unused (may be for a later optimization or side effect)
