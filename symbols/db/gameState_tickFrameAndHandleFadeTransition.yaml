name: gameState_tickFrameAndHandleFadeTransition
address: '0x080056B8'
kind: function
status: probable
summary: 'Per-frame tick of the main game-state loop: runs scene dispatch, renders all sprites, and when
  a screen fade is active, tears everything down and jumps the main jumptable to scene 0x34.'
interface: (void) -> void; sets *(oToolkit_MainJumptableIndexPtr) = 0x34 when IsScreenFadeActive is true
details: 'Runs one frame of the active game state: dispatches the PET-menu sub-handler (dispatch_80339CC),
  the scenario effect-state jumptable, and per-type object logic; then flushes/queues all sprite rendering
  (setRenderFlushState, palette reset, map-object draw, NPC draw, OAM finalize, owMapObject_queueSprites)
  and runs the armed event callback. If IsScreenFadeActive is false it returns immediately; otherwise
  it performs a scene reload: kills chatbox, frees all objects of selected types (0x21), clears NPC state
  words, resets all graphics state, clears the work area, reinits fade/battle gfx and scenario effect
  state, zeroes scratch, randomizes extra toolkit pointers, and reloads current Navi stat boosts. Finally
  it reads the GameState pointer from the toolkit (self comment is misleading; r5 is loaded from oToolkit_GameStatePtr),
  then writes byte 0x34 to the main jumptable index, switching the engine to the next scene handler.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: long unconditional chain of per-frame dispatch/draw calls (bl dispatch_80339CC ... bl owMapObject_queueSprites_8004934)
    shows a frame tick; bl IsScreenFadeActive; beq locret_800572A gates the entire teardown block on fade
    state; teardown block calls FreeAllObjectsOfSpecifiedTypes(0x21), resetAllGraphicsState_8005F40, runSetupStepAndClearWorkArea_8005F6C
    — a scene reload; ldr r0,[r7,#oToolkit_MainJumptableIndexPtr]; mov r1,#0x34; strb r1,[r0] selects
    the next main-loop scene handler; self is only referenced via oToolkit_GameStatePtr at the end, matching
    a global per-frame step rather than an instance method
