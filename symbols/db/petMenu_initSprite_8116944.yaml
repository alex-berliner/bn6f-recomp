name: petMenu_initSprite_8116944
address: '0x08116944'
kind: function
status: confirmed
summary: Initializes a pet-menu sprite/object record with GUI type, animation, palette, coordinates and a follow-up
  update call.
interface: void sub_8116944(int gui_type /* r1 */, u32 obj /* r5 */) -> r0 (clobbered); clobbers r0,r1,r2,r3,r4,r6,r8,r9,r10,r11,r12,lr,NZCV;
  preserves r7
details: 'Operates on a pet-menu object record passed in r5. Calls initGuiSprite_8002770 with r0=1 and r1=gui_type,

  then sets the sprite''s animation index from obj[4], loads animation data, disables shadow, sets the

  sub-entry palette bank to 0xC and palette to 0, sets priority, stores halfword 0x2D4 and clears a field

  via slotList_storeHalfwordAndClearField_800306C, and zeros a sprite sub-record field. Writes 4 to

  obj[8]. Branches on obj[5]: if zero, writes (0,1) to (obj[9], obj[0]); otherwise writes (8,0x23).

  Sets coordinates to (0xB0, 0x40). Marks animation field obj[4] as 0xFF (pending/cleared) and stores

  6 at obj[0xC]. Finally calls petMenu_updateObject_81169B0 with argument 6 to continue the per-frame

  update path. The "(0xB0,0x40)" and 0x2D4 values are hard-coded literals from the data pool.

  '
