name: copyToVRAMAndClear_iBGTileIdBlocks_Ptr
address: '0x080015D0'
kind: function
status: confirmed
summary: Uploads the toolkit's iBG tile-id block table to VRAM each frame, then clears the table to 0x2FF "no tile"
  entries for the next frame.
interface: void copyToVRAMAndClear_iBGTileIdBlocks_Ptr(void) /* r10 = toolkit ptr, r3 preserved; clobbers r0-r2,
  nzcv, lr */
details: 'Reads the toolkit field oToolkit_iBGTileIdBlocks_Ptr (via r10, the global toolkit/context pointer) to
  get the

  address of the in-memory iBG tile-id block table. Copies 0x2000 bytes (0x800 words) of that table to the

  BG tile-id region of VRAM at 0x0600E000 using CopyByEightWords (32-byte chunk copies). Then fills the same

  in-memory table, 0x800 words long, with the word 0x2FF02FF (i.e. every halfword entry = 0x2FF, the "no tile /

  empty" tile id), using FillByEightWords. Net effect: commit this frame''s iBG tile-id changes to the BG tile-map

  hardware region and reset the working table so per-frame dirty-block writes start from a clean slate.

  r3 is passed through untouched (preserved), suggesting callers use it for their own state across the call.

  '
