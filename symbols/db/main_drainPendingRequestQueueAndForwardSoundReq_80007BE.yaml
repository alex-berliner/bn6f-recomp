open_questions:
- Exact semantic of dword_200A498 (pointer to a 16-byte pre-built sound request) and what field of byte_200A494
  is being indexed; the `0x1a` cap is opaque without more callers.
- The bump/drain happens even when the count `[r5]` is 0 (the `byte_200A494` increment and zeroing of
  dword_200A498 occur before the count check), suggesting the loop is gated by a "running" flag at +0
  while the table is always advanced — disambiguating that needs more callers.
