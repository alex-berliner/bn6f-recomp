name: battle_loadBeastSpEnemyStats
address: '0x080A7208'
kind: function
status: probable
summary: Copies a per-index Beast Out SP enemy stat entry from table byte_2000EC0 into fields of the battle
  object pointed to by r5.
interface: (r5 = battle object struct, uses object's index byte at r5+4) -> fills r5+0x05, r5+0x06, r5+0x0C,
  r5+0x10, r5+0x34; no return value, clobbered flags/registers only
details: 'The function uses r5 as a target struct pointer passed via register (not the standard r0-r3
  convention, so callers must set it up specially). It first copies the fixed byte at byte_2000EC0+0x16
  into struct+0x05, then uses the byte at struct+0x04 as an index into the table: byte at 0x17+idx goes
  to struct+0x06, byte at 0x26+idx to struct+0x34, and words at 0x2C+4*idx and 0x44+4*idx go to struct+0x0C
  and struct+0x10 (the latter two using the index scaled by 4, so those are word-array entries). Given
  the caller battleObject_initBeastSpEnemy_80A6EBC, the table appears to hold Beast Out SP enemy parameters
  (e.g. HP/attack/other per-enemy values). Nothing is validated; the index byte is used raw.'
