name: battleObject_incrementUnk200431cCounterForMatchingObjects_813BE38
address: '0x0813BE38'
kind: function
status: confirmed
summary: Tallies how many active battle objects share the same type as a reference object, incrementing a per-subtype
  counter in the toolkit's Unk200431c array for each match.
interface: void battleObject_countSameKindBySubtype_813BE38(u32 r0 /* battleObjIndex */, u32 r6 /* callerEntryIdx
  (skipped) */, u32 r10 /* toolkitPtr */);
details: 'Resolves the battle object at r0 via battleObject_getByIndex_813B780 and reads its type byte at offset
  3. Then iterates the 0x31-slot lookup table byte_2006C50. For each non-zero slot, subtracts 1 to get an entry
  index; skips the caller''s own entry (r6). Resolves the entry through toolkit_getUnk2004190EntryPtr_813B9FC to
  get a record whose first halfword is a battle-object index; if zero the slot is inactive. Looks up that object
  and compares its type byte (offset 3) to the reference. On match, reads the object''s subtype byte (offset 4)
  and uses it as an index into the byte array at [r10 + oToolkit_Unk200431c_Ptr], incrementing that counter by 1.
  r6 is preserved across the call via the stack slot; all other registers are clobbered.

  '
