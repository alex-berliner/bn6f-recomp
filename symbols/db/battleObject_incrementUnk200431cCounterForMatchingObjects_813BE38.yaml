status: probable
summary: Bumps a per-battle counter for sibling battle objects sharing the caller's Element
interface: '(r0 = battleObject index, r6 = saved caller Element, r10 = toolkit) -> r0 = 0 ; side effects:
  increments byte in Unk200431c (toolkit+0x60) for every other live battle object with the same Element'
details: "Iterates over the 0x31-entry fixed table at byte_2006C50 (typically ordered list of\n  battle\
  \ object indices). For each occupied slot whose index (after -1) differs from the\n  caller's saved\
  \ index, looks up the corresponding entry in Unk2004190 (8 bytes per entry),\n  fetches the live BattleObject\
  \ via battleObject_getByIndex_813B780, and if its Element byte\n  at oBattleObject+0xE matches the caller's,\
  \ increments byte_200431c[obj+4] by one. Caller\n  in sub_813BD24 seeds r6 from oBattleObject+0xE before\
  \ invoking.\n  • Scratch: battleObject scratch at r7, Element scratch at r4; r6 is dead-stored on stack\n\
  \  • Loop bound 0x31 = the standard 49-actor cap (AlivePlayerActors/AliveOpponentActors each\n    hold\
  \ 0x10, fits).\n  • The offset oBattleObject+4 is being used as an index into Unk200431c — this is consistent\n\
  \    with a u8 per-battle-object \"hits taken by matched element\" / targeting / damage-dealt\n    counter\
  \ that the caller then consumes or displays.\n"
