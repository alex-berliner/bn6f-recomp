name: chipFolder_initGfx_812386C
address: '0x0812386C'
kind: function
status: confirmed
summary: 'Initializes all graphics for the chip-folder PET screen: decompresses tile/sprite/palette data, loads
  folder-page label text scripts, and fills two regions of tile-block-1 with background grid tiles.'
interface: void chipFolder_initGfx(void); // r4-r7 preserved; r2/r3 carry last CopyBackgroundTiles in/out params
details: "Step 1 – Build a 4-entry descriptor table in scratch RAM at unk_20096E0 from the ROM\ntable at off_812391C\
  \ (four {src_ptr, size, arg1, arg2} quadruplets). Each src_ptr is\nresolved through sub_811FB84 (handles COMPRESSED_PTR_FLAG\
  \ indirection), then written as\na flat {resolved_ptr, arg1, arg2} triple followed by a null terminator (0x40\
  \ + 4 bytes).\n\nStep 2 – Call decompAndCopyData twice: once on the built table (unk_20096E0) for folder\nicons/sprites/palettes,\
  \ and once on the static table at dword_8123964 for additional\ncompressed tiles (VRAM targets at 0x6000000+),\
  \ tile maps, and BG data.\n\nStep 3 – Load compressed text-script blocks (folder-page title/label glyphs) via\n\
  sub_8123300, reading the pointer list at off_81238E4 into eTextScript201C220 through\ndecompression buffer eDecompBuffer2013A00.\n\
  \nStep 4 – Copy background tiles into tile block 1 at two grid positions:\n  (i=0, j=0) 30×20 tiles from eTextScript201BA20,\
  \ and\n  (i=9, j=6) 20×13 tiles from eTextScript201BF20.\nThese form the folder navigation background layout.\n\
  \nSource data rows include palette_3001960, BG tile blocks at 0x6004000/0x6006800/\n0x6006B80/0x6012800/0x6012C00/0x6014800/0x6014980/0x6014A00,\
  \ and sprite/object buffers\nin WRAM.\n"
