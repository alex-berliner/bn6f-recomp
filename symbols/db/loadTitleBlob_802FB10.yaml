name: loadTitleBlob_802FB10
address: '0x0802FB10'
kind: function
status: confirmed
summary: Loads the title-screen VRAM/tile blob (byte_802FB20) by handing it to sub_8001158.
interface: 'void sub_802FB10(void);  // inputs: none read; clobbers: r0-r3, lr, NZCV'
details: 'Thin wrapper that pushes r4-r7/lr, loads the address of the 64-byte constant

  byte_802FB20 (a packed tile/tilemap record: entries of the form 7E 00 XX 80 YY 61 00 00,

  with 0x7E and 0x61 appearing to be OAM-style tile/affine tags around X/Y position pairs

  stepping by 0x20 in X and 0x10 in Y across 8 rows, ending in a 7-zero terminator), and

  tail-calls sub_8001158 (the system''s generic loader/decoder for such resource blobs,

  probably LZ77-decompress-into-VRAM or similar). Restores r4-r7 and returns via pop {pc}.

  Anything sub_8001158 does with the pointer is opaque from this file.

  '
