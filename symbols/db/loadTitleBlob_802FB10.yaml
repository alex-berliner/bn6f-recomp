open_questions:
- Exact semantics of sub_8001158 (decompressor? DMA? BG/OAM uploader?), and therefore whether byte_802FB20
  is compressed LZ77 data, raw tiles, an OAM table, or an affine-sprite table. The 0x7E...0x61 framing
  and 0x20/0x10 stride are suggestive of an OAM/affine sprite layout but unconfirmed.
- Called from where / how often (once at boot? per title-screen entry?), which would confirm the "title-screen"
  guess vs. some other one-shot resource upload.
