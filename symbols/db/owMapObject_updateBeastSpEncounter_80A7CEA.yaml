  \  caller (out is r2/r3), this is effectively a `void` per-frame tick for an OW map object that has\n\
  \  a beast SP transition. The captured-call snapshots show entry r1 == 4 (NPC/list index-ish),\n  r2\
  \ around 0x0203956x (EWRAM/OW object pointer), r3 == 0x40; the variable r0 exit values\n  (0x998/0x9fc)\
  \ are typical of sprite_update's OAM bookkeeping.\n  No struct fields are read/written by this function\
  \ directly — all reads happen through its\n  callees. The function is only invoked from sub_80A7CA4\
  \ in the same module.\n"
