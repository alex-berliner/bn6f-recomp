name: battle_findNearestPanelColumn
address: '0x080E94F8'
kind: function
status: probable
summary: Scans columns successively farther from a battle object's panel X for the first column containing
  a panel matching alliance-specific panel-flag criteria, moving the object's X there and returning how
  many matching panels were found.
interface: (r0 = object, r5 = battle object) -> r0 = number of matching panels found in the chosen column;
  writes oBattleObject_PanelX when a column is found
details: 'Starting one panel away, it walks outward one column per outer iteration: candidate X = oBattleObject_PanelX
  - object_getEnemyDirection(object)*offset. For each candidate column it tests rows 1..3 with object_checkPanelParameters(x,
  y, setMask, clearMask), where the masks come from a per-alliance table at byte_80E955C indexed by oBattleObject_Alliance*8
  (alliance 0: set 0x10/clear 0; alliance 1: set 0x20/clear 0x03800000; alliance 2: set 0x30/clear 0).
  On each match it calls sub_80DF4D4(object, matchIndex, element*10, oBattleObject_DamageAndStaminaDamageCounterDisabler)
  and counts the match. If any panel in the column matched, it stores the candidate X into oBattleObject_PanelX
  and returns the count; otherwise it widens the search by one column and retries. Only columns landing
  in x=1..6 are tested, so if the search direction never yields a valid panel the loop has no visible
  bound.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: neg r0 / mul r6 with object_getEnemyDirection builds candidate columns from oBattleObject_PanelX
    (loc_80E9500); cmp x with 1..6 bounds the scan to the 6 battle columns (loc_80E9500); byte_80E955C
    is read as two mask words per oBattleObject_Alliance*8 and passed to object_checkPanelParameters;
    strb r0, [r5,#oBattleObject_PanelX] stores the matched column only when match count r7 is nonzero
    (loc_80E954E); sub_80DF4D4 is called per matching row with oBattleObject_Element*10 and the damage
    field, and r7 counts calls
