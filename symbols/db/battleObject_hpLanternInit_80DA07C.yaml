open_questions:
- The exact role of 0xE4 as NameID (an enemy-name index? an HP-counter sprite id?) and the meaning of
  Param3 after the table lookup (heal amount tier?) are not pinned down.
- Whether the object's Parameter block before the call already had ACTIVE (0x01) set, or whether this
  function relies on the caller to do it, is not provable from this assembly alone.
