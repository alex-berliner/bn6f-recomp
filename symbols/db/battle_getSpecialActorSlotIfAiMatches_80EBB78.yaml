name: battle_getSpecialActorSlotIfAiMatches_80EBB78
address: '0x080EBB78'
kind: function
status: confirmed
summary: Checks a battle object's AI data for one specific enemy actor (type 1, AI index 0x12, version 4) and returns
  its slot ID 0xC, otherwise 0.
interface: int sub_80EBB78(struct BattleObject* obj /* r5 */); returns r0 = 0xC on match, 0 otherwise; r2 = AI data's
  version byte
details: 'Loads the battle object''s AI data pointer from r5+oBattleObject_AIDataPtr and reads three bytes: oAIData_ActorType
  (offset 0), oAIData_AIIndex (offset 1) and the version byte at oAidata_Version_16. If the triple matches actorType==1,
  aiIndex==0x12 and version==4, the function returns 0xC (a slot/variant identifier); otherwise it returns 0. The
  version byte is left in r2 on exit, so callers that also need the version can read it back without reloading.
  Purely a read-side classifier: it never writes to the object or AI data. Uses r4 and r7 only as scratch and preserves
  them. The magic triple (type 1 / AI index 0x12 / version 4) presumably identifies one particular enemy customization
  or boss variant used elsewhere in the battle engine; without seeing callers, "slot 0xC" is just the constant this
  function hands back.'
