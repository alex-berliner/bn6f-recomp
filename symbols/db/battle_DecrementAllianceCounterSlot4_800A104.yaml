name: battle_DecrementAllianceCounterSlot4_800A104
address: '0x0800A104'
kind: function
status: confirmed
summary: Decrements a per-alliance counter in the battle state (slot = this object's alliance + 4) unless a flag
  in the object's AI data suppresses it.
interface: void battle_DecrementAllianceCounterSlot4(battleobj* obj /*r5*/, toolkit* tk /*r10*/); returns new counter
  value in r2 (unchanged if early-out)
details: 'Reads the object''s AI data pointer (oBattleObject_AIDataPtr) and checks the byte at

  oAIData_Unk_02; if it is nonzero the function returns immediately without touching anything

  (r2 is then unmodified, which callers must not rely on). Otherwise it takes the object''s

  oBattleObject_Alliance byte, adds 4 to it to index into the battle state (fetched from

  oToolkit_BattleStatePtr), loads that byte, subtracts 1, stores it back, and leaves the new

  value in r2. The slot range alliance+4 suggests the battle state holds a small array of

  byte counters, one per alliance/faction, with entries 0..3 used for something else. This

  looks like a timed-effect countdown (e.g. a buff/debuff or field effect lasting N turns or

  frames) that is gated per-object by the AI data flag.

  '
