name: battle_objectHasExtraVars
address: '0x080FFAEC'
kind: function
status: probable
summary: Predicate that reports whether a battle object has allocated its ExtraVars block.
interface: (r5 = battle object pointer; r0 unused) -> r0 = 1 if [r5+oBattleObject_ExtraVars] != NULL,
  else 0; flags clobbered by tst
details: Loads the object's ExtraVars pointer field and tests it with tst; if the pointer is NULL it falls
  through and returns 0 in r0 (the loaded value, which is 0), otherwise sets r0 = 1. It is a simple boolean
  'does this object have extra vars' check, taking the object via r5 (the battle-object register convention)
  rather than r0. No other fields are touched and it never writes memory.
