name: battle_objectHasExtraVars
address: '0x080FFAEC'
kind: function
status: confirmed
summary: Returns whether a battle object has any extra-variables data attached (nonzero ExtraVars pointer/flag).
interface: bool battle_objectHasExtraVars(object in r5) -> r0 (0 or 1); flags NZ clobbered
details: 'Small predicate helper. Loads oBattleObject_ExtraVars from the battle object whose

  address is passed in r5 (not the usual r0 convention), tst''s it against itself, and

  returns 1 in r0 if the field is nonzero, otherwise 0. ExtraVars most likely holds a

  pointer (or handle) to an object''s extended/per-instance variable block, so this

  tests "does this object have extra vars at all". Sets only r0; no other state is

  touched. Callers are expected to have placed the object pointer in r5 themselves,

  which suggests it is used inside loops that already iterate objects in r5.

  '
