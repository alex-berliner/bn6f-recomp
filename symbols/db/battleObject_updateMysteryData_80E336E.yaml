open_questions:
- 'Exact meaning of ExtraVars[0xc] submode values 1 vs 2: the transformation-window branch (1) vs the
  parent-action branch (2) hints at two different object types sharing this update, but the specific object
  type (looks like a "mystery data" / transformation-related BattleObject given the SNAKEARM_EV/BASS_CHIP_EV
  constants in the header) is not pinned down.'
- What sub_80E33D2 actually does (cleanup, particle spawn, etc.) — only its name remains unknown.
- Why OBJECT_FLAG_VISIBLE strobes every 2 frames when ExtraVars[8] is null (likely a flashing animation
  effect) is unconfirmed.
