name: battleObject_updateMysteryData_80E336E
address: '0x080E336E'
kind: function
status: confirmed
summary: 'Per-frame tick for a Mystery Data collectible in battle: checks spawn gates, advances the timer with a
  4-frame flash animation, and despawns when expired or gated out.'
interface: void battle_updateMysteryData(BattleObject* obj /*r5*/); clobbers r0-r4,r6-r7,lr; reads/preserves r10;
  outputs r5,r8-r12 via callee convention
details: "Operates on a single BattleObject (r5) representing a Mystery Data item floating in battle. Two conditional\
  \ despawn gates are evaluated at the start, selected by the value of obj->ExtraVars[3] (u32 at offset +0xC):\n\
  \  Gate 1 (value == 1): calls GetBattleNaviStatsByte(alliance, 0x2C) and\n    despawns if the returned stat byte\
  \ is outside the signed range [0x0B,0x18].\n    This restricts which Navis (identified by their stat byte 0x2C)\
  \ can collect\n    this mystery data.\n  Gate 2 (value == 2): reads the related object (obj->RelatedObject1Ptr)\
  \ and\n    despawns if that object's CurAction < 0x10, tying the collectible's\n    lifetime to another battle\
  \ entity's action phase.\nAfter the gates, the function calls battle_isPaused; it returns without further processing\
  \ when the battle is NOT paused (bne skips the Z-clear path). When processing continues, the 16-bit Timer (offset\
  \ oBattleObject_Timer) is incremented; if it reaches Timer2 (the configured duration), the object is marked CUR_STATE_DESTROY\
  \ and battle_despawnEnemyObject is called. Otherwise sprite_update is called, the object's Flags bit 1 (visibility)\
  \ is set, and a flash toggle runs: if ExtraVars[2] (offset +0x8) is zero and the timer's bit 1 is clear, visibility\
  \ bit 1 is cleared, producing a 4-frame on/off blink cycle.\n"
