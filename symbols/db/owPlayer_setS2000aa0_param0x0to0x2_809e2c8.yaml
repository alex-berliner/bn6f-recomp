name: owPlayer_setS2000aa0_param0x0to0x2_809e2c8
address: '0x0809E2C8'
kind: function
status: confirmed
summary: Stores the overworld player navi's sprite transform settings (horizontal compress, vertical compress, rotation)
  into the persistent player state struct at 0x2000AA0.
interface: void owPlayer_setNaviSpriteTransform(u8 horizontalCompress /*r0*/, u8 verticalCompress /*r1*/, u8 rotation
  /*r2*/); clobbers r3
details: "Tiny setter: loads the base address of eStruct2000aa0 (an EWRAM/IWRAM state struct at\n0x2000AA0 used\
  \ for overworld player state) into r3 and stores its three arguments as\nindividual bytes:\n  byte_2000AA0 = r0\
  \  (oS2000aa0_OWPlayerNaviHorizontalCompress)\n  byte_2000AA1 = r1  (oS2000aa0_OWPlayerNaviVerticalCompress)\n\
  \  byte_2000AA2 = r2  (oS2000aa0_OWPlayerNaviRotation)\nThese fields presumably control how the overworld navi\
  \ sprite is squashed/stretched\nhorizontally and vertically and rotated, e.g. for the Beast Out / cross transformation\n\
  or slide/movement squash-and-stretch effects. No flags are touched, no other registers\nare modified besides r3.\n"
