name: battle_getObjectNameID_8011020
address: '0x08011020'
kind: function
status: confirmed
summary: Tiny helper that reads the NameID field of a battle object (passed in r5) and tail-calls sub_801102A with
  it.
interface: void sub_8011020(void) — takes the battle object pointer implicitly in r5; returns whatever sub_801102A
  returns in r0 (not forwarded here; it branches via pop {pc} after the call returns)
details: 'One-line trampoline: loads the halfword at r5 + oBattleObject_NameID (the battle

  object''s name/chip ID field) and immediately calls sub_801102A with that value in r0.

  Since lr was saved on entry and restored with pop {pc} after the call, it is NOT a

  tail-call — sub_801102A returns here first, then execution returns to the original

  caller. sub_8011020''s own r0 clobber and flag effects are just those of the callee

  passed through; no state of its own is touched beyond the pushed lr.

  The battle object layout offset oBattleObject_NameID identifies the struct as a

  battle object/entity record; the NameID presumably selects which name (object,

  enemy, or chip name) sub_801102A looks up or prints.

  '
