name: object_waitThenEndAction
address: '0x080DAF74'
kind: function
status: probable
summary: Battle-object phase handler that waits Param3 frames, then marks the object's action as finished.
interface: (r5 = battle object) -> r0 = scratch only; no return value, updates oBattleObject_CurPhase/Timer/CurAction
details: On the first invocation for a phase (oBattleObject_CurPhase == 0) it stores phase 4 and copies
  oBattleObject_Param3 into oBattleObject_Timer, initializing the wait. On later invocations it decrements
  the Timer each frame and returns while it is still > 0. When the timer expires it writes 4 to oBattleObject_CurAction
  (action complete / idle) and zeroes CurPhaseAndPhaseInitialized so the next action can begin. Uses the
  standard battle-object fields; no OAM, animation, or other side effects.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase]; tst/bne: phase 0 triggers one-time init storing phase
    4 (loc_80DAF86 path); strh r0,[r5,#oBattleObject_Timer] with r0=Param3: wait duration comes from oBattleObject_Param3;
    ldrh/sub/strh on oBattleObject_Timer with bgt exit: per-frame countdown; mov r0,#4; strb r0,[r5,#oBattleObject_CurAction]
    plus zeroing CurPhaseAndPhaseInitialized: ends the action when timer hits 0'
