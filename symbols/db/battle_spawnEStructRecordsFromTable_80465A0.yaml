summary: 'Table-driven spawner for eStruct records: walks a 0xFF-terminated table of 4-byte (id, slot,
  param) triples and creates one 0x58-byte record (type 9) of eStructArr2008450 per entry via sub_8046670.'
details: 'Loop: byte r0+0 == 0xFF ends the walk. Otherwise ldrb r0 = entry+0, ldrb r1 = entry+1, ldrh
  r2 = entry+2, call sub_8046670(r0, r1, r2), advance r0 by 4. sub_8046670 selects eStructArr2008450 +
  r1*0x58, stores type byte 9 at +0, the id at +1, the param word at +4, and zeroes +8 - so entry byte
  1 is the record slot index and byte 0 the record id. Callers are scene-init routines passing ROM tables
  (e.g. shop_initScreen_8046D4C with byte_8046B8C); the same records are walked every frame by battle_updateEStructSprites_80465F8.

  '
