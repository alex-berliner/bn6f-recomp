open_questions:
- What is the type/length of the record at R5 and what does byte +0x01=8, +0x02 (state), +0x03=4, and byte +0x12
  (selection index) actually represent?
- What menu does `sub_8132290` belong to, and what do the choices 0x18/0x1C/0x20/0x24 label in the UI (e.g. Yes/No/Buy/Sell,
  Chip select slots, etc.)?
- What does `sub_81325F4` do with `[R5+0x12]` -- is it clamping, validation, or a lookup that yields a real handler
  index?
- Why is R0 explicitly set to 4 on exit instead of the dispatch value? Is byte +0x03 a "ready" / "next handler id"
  flag and 4 the universal "idle" phase?
- Is `sub_803EBB8` a teardown of a previous menu or an init helper, given it runs before the type byte is rewritten?
- 'Retype: register form, old prompt; queued for retype (tools/abi/retype_queue.tsv), to be converted again as typed
