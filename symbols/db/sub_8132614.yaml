name: sub_8132614
address: '0x08132614'
kind: function
status: hypothesis
summary: Dispatches on sub_8132290's menu choice, sets a flag byte, picks a sub-state via lookup, and writes the
  next handler index into the menu record.
interface: void sub_8132614(struct MenuRecord *r5) * ; returns nz=1 in Z due to `mov r0,
details: "Calls `sub_803EBB8` (some menu helper), then forces `[R5+1] = 8` (a fixed \"menu open\" or\ntype byte).\
  \ Calls `sub_8132290` (likely a \"wait for selection\" routine that returns the\nhighlighted/pressed option id\
  \ 0x18/0x1C/0x20/0x24).\nDispatches on the returned choice:\n  * 0x18 or 0x1C -> read an 8-bit selection index\
  \ from `[R5+0x12]`, call `sub_81325F4`\n    (probably resolves/corrects it via a table) and use its return as\
  \ `[R5+2]`.\n  * 0x20 or 0x24 -> `[R5+2] = 0x0C`.\n  * anything else -> `[R5+2] = 0x10`.\nFinally writes `[R5+3]\
  \ = 4` and returns with R0=4 (not the dispatch value), so R0 is\neffectively a constant \"done, state=4\" return\
  \ rather than the menu pick itself. The\nobject layout touched is small: bytes at offsets 0x01, 0x02, 0x03, 0x12,\
  \ strongly\nsuggesting a compact menu/state record.\nQuirk: R5 (the only input) is preserved across the calls\
  \ (`push {lr}` only), so it is\nthe live working pointer the caller must keep valid. The \"8 / 0x0C / 0x10 / 4\"\
  \ constants\nread like a small FSM phase/cursor field set.\n\nRegister form, old prompt; queued for retype (the\
  \ farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
