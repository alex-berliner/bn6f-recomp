name: start_enableInterrupts
address: '0x03005E60'
kind: function
status: probable
summary: Sets IME = 1 to globally enable interrupts, used during startup.
interface: () -> void; writes 1 to IME (0x04000208) halfword
details: Loads the address of the Interrupt Master Enable register (0x04000208, labeled InterruptMasterEnableRegister
  in the literal pool) and stores the halfword 1 into it, turning on the CPU's master interrupt switch
  so acknowledged IRQs can be dispatched. It preserves only r4/lr and does nothing else; no flags are
  set for the caller. Called from start_800029C, which fits enabling interrupts at the end of early boot
  initialization.
