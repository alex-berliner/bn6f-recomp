name: chatbox_storeWord_8045EDC
address: '0x08045EDC'
kind: function
status: confirmed
summary: Writes one 32-bit value into the active chatbox's word buffer at a given slot index.
interface: void chatbox_storeWord(u32 slot, u32 value, Toolkit *toolkit); // r0=slot index, r1=value,
  r10=toolkit; returns r5 unchanged (caller artifact)
details: 'Loads the active chatbox pointer from toolkit + oToolkit_ChatboxPtr, then stores

  r1 at chatbox + 0x4C + (r0 << 2). Offset 0x4C is the start of the chatbox''s word

  buffer; slot is an index into this u32 array (no bounds check visible here).

  Used to fill the chatbox''s text/formatting word data before or during message

  display. r5 is pushed and popped but callers treat it as an output, so it is

  simply passed through unchanged. Flags are clobbered by the mov/ldr/lsl/add/str

  sequence but callers ignore them.

  '
