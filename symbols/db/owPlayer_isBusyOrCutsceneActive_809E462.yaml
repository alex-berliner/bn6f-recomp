  date: '2026-10-14'
  detail: '- `push {lr}` / `pop {pc}` -> leaf function with no stack locals. - `ldr r1, [r10, #oToolkit_GameStatePtr]`
    -> reads GameStatePtr from the toolkit. - `ldrb r0, [r1, #oGameState_Unk_10]` -> reads the u8 Unk_10
    field of GameState. - `tst r0, r0` -> sets Z when Unk_10 == 0, NZ otherwise; r0 holds the raw byte
    for callers that also want the value (matches captured-call exit r0 = 0x00 with Z set in every shown
