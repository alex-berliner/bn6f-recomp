name: owPlayer_isBusyOrCutsceneActive_809E462
address: '0x0809E462'
kind: function
previous_names:
- sub_809E462
status: probable
summary: Returns NZ if the overworld player is currently busy / a cutscene is running (GameState+0x10
  != 0), used as a "do not interrupt" guard.
interface: () -> nz = 1 if busy, 0 if idle (tst r0,r0) ; reads Toolkit->GameStatePtr +0x10, no side effects
details: "- Loads Toolkit via r10 (r1 <- [r10 + oToolkit_GameStatePtr]) and reads a single byte at offset\n\
  \    oGameState_Unk_10 (= 0x10). The struct field name is Unk_10, used as a generic \"player busy /\
  \ cutscene\n    active\" flag byte.\n  - Returns the byte in r0 and leaves it in r0. Uses `tst r0,r0`\
  \ so callers see Z when the byte is 0\n    (idle) and NZ when non-zero (busy). No memory writes; only\
  \ r0 and nz are clobbered for callers.\n  - The contract \"in=[r10,lr], out=[nz]\" matches a pure leaf\
  \ predicate: r10 is the Toolkit pointer\n    callee-preserved, lr is the usual return register, no other\
  \ args.\n  - Caller pattern: every site is a gate that wants to skip side effects while the overworld\
  \ player is\n    locked into a cutscene/animation. `checkThenStartBattle_8005A8C`, `check_playerCanAdvanceForward_8034C36`\n\
  \    and `playerAdvanceForwardCheck_8034C6E` test it before letting a battle start or letting the player\n\
  \    auto-advance. `sub_80058D0` (warp arming) and `sub_8005AF4` / `sub_8005B6E` use it to suppress\n\
  \    warp/cutscene interaction while a transition is in flight. `owPlayer_RequestFixedAnimation_809E14C`\n\
  \    blocks new fixed-anim requests while this flag is set, and several cutscene per-frame steppers\n\
  \    (sub_80A5588, sub_80A7C58, sub_80A7CFE, sub_80A8424, sub_80A8DF0, sub_81419A0, sub_8083DF0) use\n\
  \    it as part of the \"is something scripted happening?\" check.\n"
