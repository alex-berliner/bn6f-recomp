name: sprite_loadPalettes
address: '0x08006414'
kind: function
status: probable
summary: Loads two palette records (selected by [r5+0x18]/[r5+0x1C] indices) from arrays at [r5+0x10]/[r5+0x14]
  into software palette slots [r5+0xC]+0x14 (2 entries) and [r5+0xC]+0x15 (4 entries).
interface: '(r5 = sprite resource struct: [0x10]/[0x14] palette array ptrs, [0x18]/[0x1C] entry indices,
  [0xC] base slot; r6 = arg passed to palette filler) -> void; r0-r3 clobbered'
details: 'r5 points to a resource struct whose fields 0x10 and 0x14 hold pointers to arrays of 32-byte
  palette records (one 16-color palette each); fields 0x18 and 0x1C select which record via index*0x20.
  The function calls sub_8002378 twice: first filling palette slot [r5+0xC]+0x14 with 2 colors/entries
  from the first array, then slot [r5+0xC]+0x15 with 4 from the second, passing r6 unchanged as the filler''s
  r1 in both calls. The byte at [r5+0xC] is a per-object palette-slot base so multiple objects can share
  the code with different banks. Both callers (sub_80063C0, sub_8006444) are adjacent sprite-setup routines,
  so r5/r6 are set up by them before this runs.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r5,#0x18]; lsl r0,#5; add r4,r4,r0 — 32-byte-stride index into array at [r5+0x10];
    mov r2,#2 / bl sub_8002378 with r3=[r5+0xC]+0x14 — fills slot base+0x14; mov r2,#4 / bl sub_8002378
    with r3=[r5+0xC]+0x15 — fills slot base+0x15 from second array at [r5+0x14]; callee sub_8002378 is
    the documented software-palette-table filler keyed by slot r3
