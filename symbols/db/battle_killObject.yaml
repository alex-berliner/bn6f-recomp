name: battle_killObject
address: '0x080E3EDC'
kind: function
status: probable
summary: 'Forces the battle object to die: zeroes its HP and queues the destroy state, unless a time-stop
  or the related object''s action blocks it.'
interface: (r0 = unused, r5 = battle object pointer) -> r0 = clobbered; sets oBattleObject_HP and possibly
  CurStateActionPhaseAndPhaseInitialized
details: Writes 1 into oBattleObject_HP, then calls battle_isTimeStop; if the battle is frozen it returns
  immediately, leaving HP at 1. Otherwise it writes 0 to HP and reads the RelatedObject1Ptr's oBattleObject_CurAction
  — if that object is performing action 0xb it returns without destroying. Otherwise it stores CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, killing the object through the normal state
  machine. The initial HP=1 write may be there so the generic HP>0 death check doesn't fire before this
  routine's own destroy state is queued.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strh r0 (1),[r5,#oBattleObject_HP] followed by strh 0,[r5,#oBattleObject_HP] shows forced HP
    zeroing; bl battle_isTimeStop / bne locret skips the kill while time-stop is active; ldrb r0,[r0,#oBattleObject_CurAction];
    cmp r0,#0xb; beq skips the kill for related-object action 0xb; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    queues destruction
  refs:
  - bn6f/asm/asm31.s:94584
  - 0x0800A098 battle_isTimeStop
  reproduce: python3 tools/asmcat.py 0x080E3EDC
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-203615'
