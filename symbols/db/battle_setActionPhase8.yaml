name: battle_setActionPhase8
address: '0x080C4204'
kind: function
status: probable
summary: Sets a battle object's packed action-phase field to 8 (marking the phase not yet initialized),
  used to restart the battle state machine at phase 8.
interface: (r0 = battle object pointer or 0) -> r0 destroyed; no flags guaranteed (falls through tst/beq)
details: 'The routine is tiny: it tests r0 and, if non-null, stores the immediate value 8 into the battle
  object''s packed field oBattleObject_CurStateActionPhaseAndPhaseInitialized, then returns. Writing 8
  sets the phase counter to 8 and clears the phase-initialized sub-field, so on the next battle-loop tick
  the engine runs phase 8''s initialization handler before its update. The r0==0 guard makes it safe to
  call with a possibly-null object pointer. No other state is touched and it has no callees. What phase
  8 means (e.g. custom-screen open, post-action reset) is not visible from this function alone.'
