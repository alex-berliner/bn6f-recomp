open_questions:
- Exactly what 0x182 indexes and which Navi the lookup is for. Captured r0=0xFF on entry looks like a
- default/object-id placeholder, but the wrapper overwrites r0 with 0x182 before the call, so the real
- input is the caller's r5/object context. Settling this would require walking petNavi_perFrameUpdate
- to see which PET index it loads into r1..r3 before invoking.
