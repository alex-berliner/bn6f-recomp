name: battle_calcRelPosToTarget_803172E
address: '0x0803172E'
kind: function
status: confirmed
summary: Computes an entity's (and its next-position) coordinates relative to a doubled target reference point,
  storing the results in a scratch buffer.
interface: Next* battle_calcRelPosToTarget_803172E(void* posBlock /* r0 */, void* targetBlock /* r5 */); // returns
  r0 = &dword_200F3E0, r6 = posBlock, r7 = last value written
details: "Takes r0 = pointer to a position block with fixed-point fields (16.16-style, converted with asr #15):\
  \ current x at +0x00, y at +0x04, \"next\" x at +0x0C, \"next\" y at +0x10. Takes r5 = pointer to a target/reference\
  \ block whose fields at +0x0C (x) and +0x10 (y) are plain values that get doubled (lsl #1). Writes four relative\
  \ coordinates into the scratch array at dword_200F3E0, mirroring the source block's layout:\n  [+0x00] = (x >>\
  \ 15) - 2*target[+0x0C]\n  [+0x04] = (y >> 15) - 2*target[+0x10]\n  [+0x0C] = (nextX >> 15) - 2*target[+0x0C]\n\
  \  [+0x10] = (nextY >> 15) - 2*target[+0x10]\nThe 2x scaling of the target values is intentional in the original\
  \ code (the comment \"(x * 2 - tx * 2)\" appears in the disassembly), so the target coordinates are treated at\
  \ double resolution relative to the converted fixed-point positions. Results land at the same offsets in the scratch\
  \ buffer as their source fields, and only offsets 0x00, 0x04, 0x0C, 0x10 are touched (0x08 is skipped, matching\
  \ the source layout gap). Tail call via mov pc, lr; r2 and r5 are clobbered.\n"
