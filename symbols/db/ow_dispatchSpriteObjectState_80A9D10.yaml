name: ow_dispatchSpriteObjectState_80A9D10
address: '0x080A9D10'
kind: function
status: confirmed
summary: Dispatcher that runs the per-state routine (init / update / sub_80A9DB8) for an overworld sprite
  object, selected by the object's state byte.
interface: void sub_80A9D10(r2 arg, r5 object, r10 arg); passes r2/r5/r10 through to the selected routine;
  results come back in r2 r3 r4 r5 r8 r9 r10 r11 r12 per the callee's own contract (r4/r5 restored here);
  clobbers r0 r1 lr and nzcv flags
details: "r5 points at an overworld sprite object; the byte at offset 8 is a state/stage selector.\nIt\
  \ indexes a three-entry jump table at off_80A9D24:\n  0 = ow_initSpriteObject (initialize a newly created\
  \ sprite object)\n  1 = ow_spriteObjectUpdate (per-frame update)\n  2 = sub_80A9DB8 (third, unnamed\
  \ state handler)\nDispatch is via mov lr, pc / bx r0 through the table (thumb targets, entries stored\
  \ +1),\nwith push {r4-r7,lr} / pop {r4-r7,pc} wrapping the call so r4-r7 survive whatever the\ncallee\
  \ does. r2 and r10 are forwarded untouched, r5 carries the object pointer, and the\nselected routine's\
  \ return values simply land in the caller's registers unchanged.\nIn effect this is the object-state\
  \ machine step for overworld sprite objects: callers\ninvoke it once per object and the object's own\
  \ state byte decides whether it gets\ninitialized, updated, or handled by the third routine.\n"
