name: aiAttack_startAttack
address: '0x080116F6'
kind: function
status: probable
summary: Configures the player's AI-attack state struct with parameters, marks it active, and immediately
  steps the attack state machine once.
interface: (r0/r1/r2 = three bytes stored at attackState+0x16/+0x17/+0x18, r3 = word stored at attackState+0x2c;
  r5 = battle object whose +0x58 field holds the sub-struct) -> r0 = result of the first aiAttack state-machine
  step
details: Reads the battle object's sub-struct pointer from r5+0x58 and adds 0xA0 to reach the AI-attack
  state struct. It stores the three byte parameters at offsets 0x16, 0x17 and 0x18, a word parameter at
  0x2C (likely an attack id or callback), and writes 2 to offset 3 (a mode/state selector consumed by
  the state machine). It then calls object_setAttack4 with r0=0x10, and finally calls aiAttack_stepStateMachine_80EB04C
  once so the attack begins on the same frame. Note it relies on r5 already holding the object pointer,
  so it is only valid in contexts (e.g. other object handlers) where r5 is the battle object.
