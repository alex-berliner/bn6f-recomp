name: sub_8031C94
address: '0x08031C94'
kind: function
status: hypothesis
summary: Runs a fixed three-call setup sequence on an object (pointer in r0), then falls straight back to this function's
  own caller, passing everything through.
interface: 'Next sub_8031C94(void) /* in: r0 (object ptr), r5, lr; out: flags nzcv and r0-r7,lr all passed through
  from the last callee */'
details: Tiny glue/thunk in a "Next"-style (coroutine/task) call chain. It first calls sub_803172E, then calls sub_80315B8
  with a hardcoded parameter set (r2=0, r3=0x10, r4=2, r5=2), then calls sub_8031B7C, which consumes whatever r2/r5
  sub_80315B8 left behind; r3=0x10 and r4=2 must survive into that final call. Every register and the flags are
  simply passed through to the caller of this function via RETURN_TO_CALLER (pop {pc} after the bl chain), so it
  behaves like a transparent step in the chain rather than a normal leaf. The fixed values 0x10/2/2 look like dimensions,
  palette/slot ids, or mode constants for whatever sub_80315B8 configures, but without reading the callees the game-side
  meaning (sprite, npc, chatbox, battle object, etc.) is not identifiable from this function alone.
