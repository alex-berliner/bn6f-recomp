name: battle_updateLoseSequence
address: '0x08008B7C'
kind: function
status: probable
summary: 'Per-frame handler for the player-defeat battle phase: plays the lose music, dispatches the lose
  effect, waits out a timer, then hands off to the battle-end game state.'
interface: (r0..r4 scratch; r5 = battle-step struct, r10 = toolkit) -> void; sets [r5,#3] phase and [r5,#4],
  writes oGameState_BattleEndSubState
details: 'First pass (phase byte [r5,#3]==0) dispatches flags value 0x4C43 and clears those bits in the
  dword_20352C0 flags word, then reads the toolkit''s battle state and stores (oBattleState_PlayerSide
  ^ 1) into oBattleState_LoserSide. Calls GetBattleEffects twice: bit 0x8 triggers PlayMusic(SONG_LOSER);
  bit 0x2 selects a shorter wait timer — 0x66 vs 0x41 halfwords stored at [r5,#8]. It then queues battle
  sub-effect kind 0x18 via battle_dispatchKindEffect_801E792 and sets the phase byte to 4. On subsequent
  frames it decrements [r5,#8]; when it reaches 0 (signed halfword <= 0) and comm_checkCrossNetBattleReady
  returns 0, it stores 2 at [r5,#4], writes 2 into the game state''s oGameState_BattleEndSubState, and
  calls eStruct200A008_setUnk02(1).'
