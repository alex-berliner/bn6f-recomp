name: ow_removeQueuedEvent
address: '0x0802F270'
kind: function
status: probable
summary: Removes an event id from the active-event list and clears its event flag pair (id and id+0x80).
interface: (r0 = event flag id (>= 0x1CA0), relative id = r0-0x1CA0) -> r0 = preserved id; no meaningful
  flags
details: 'Searches the array at byte_2006530 (a list of active event ids terminated by the 0x80 sentinel)
  for an entry equal to r0-0x1CA0; if not found, returns without doing anything. When found, shifts every
  following entry down by one, writes the 0x80 sentinel at the end, and decrements the count stored at
  dword_2001140. It then calls ClearEventFlag twice: once with the original id and once with id+0x80,
  clearing both halves of the event''s flag pair (e.g. the trigger flag and its completion/''seen'' counterpart).
  This looks like cancelling/deactivating a pending overworld event that had been queued.'
