name: object_queueChoiceOam
address: '0x0813064C'
kind: function
status: probable
summary: Queues a single OAM sprite whose source halfword within the scene struct is chosen from a 3-entry
  offset table indexed by struct field 0xC (0 = skip).
interface: (r5 = scene/choice struct via callees, no args passed in) -> r0 = OAM queue result; r0 on entry
  unused; struct field 0xC selects entry (0 = draw nothing).
details: It first calls sub_8130404 and sub_8130250 (likely returning the active scene struct and refreshing
  its state into r5). If the byte at [r5,#0xC] is zero it returns without drawing, so that field is a
  selection index that is 0 when no choice is active. Otherwise it subtracts 1 and uses it to index the
  byte table at 0x8130688 (bytes 0x24, 0x2E, 0x38), loading a halfword from the struct at that offset
  — i.e. one of three 2-byte entries spaced 10 bytes apart, plausibly X/Y coordinates or a tile parameter
  for choice 1-3. It then calls object_computeAndQueueOamEntry_811FA98 with fixed packed parameters (r0=0xBA003D,
  r1=0x20002, r2=0x1E, r3=chosen halfword, r4=5, r6=0xC24C, r7=0x46) to emit exactly one OAM entry. The
  three-way table plus one-shot OAM queue strongly suggests a cursor/arrow highlighting one of three on-screen
  options in a t4 overlay cutscene.
