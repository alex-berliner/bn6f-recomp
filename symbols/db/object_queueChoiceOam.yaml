    one of three struct entries; single bl object_computeAndQueueOamEntry_811FA98 with constants 0xBA003D/0x20002/0x1E/5/0xC24C/0x46
    queues exactly one sprite; caller t4_sceneInit (0x08130084) is the overlay cutscene initializer, matching
    a scene-local cursor draw; two callee calls whose results feed r5 show it operates on a scene-state
    struct, not raw arguments'
