name: object_setEventFlagsLoadRecord
address: '0x0809B868'
kind: function
status: probable
summary: Stores a pointer to a 0x34-byte record table entry (selected by the struct's field +8) into the
  struct and sets story event flags 38 and 39.
interface: '(r0 = unused, r5 = object/work struct: +8 = record index, +0x34 = record pointer out) -> r0
  = 0; flags set via EVENT_38, EVENT_39'
details: Reads an index from [r5,#8], multiplies it by 0x34, and adds it to byte_809B174 to compute a
  record pointer, which is written to [r5,#0x34]. It then sets two consecutive event flags, EVENT_38 and
  EVENT_39, each via a movflag followed by SetEventFlagFromImmediate. Finally it returns 0, likely as
  a success/completion code. r4-r6 are pushed but unused, suggesting a shared prologue/epilogue template
  or a stripped call. The 0x34-byte records at byte_809B174 are unidentified; the caller and struct owner
  are unknown.
