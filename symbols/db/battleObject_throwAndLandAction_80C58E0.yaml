name: battleObject_throwAndLandAction_80C58E0
address: '0x080C58E0'
kind: function
status: confirmed
summary: Per-frame tick that drives a battle object (e.g. a thrown chip) along a parabolic arc toward a target panel,
  swaps animation frames at checkpoints, and snaps it onto the destination panel with a landing sound when the flight
  timer expires.
interface: void battleObject_tickThrowArc(u32 r5 /* object */); // returns r1 (ExtraVars ptr or panel-highlight
  result), preserves r4-r7,r10
details: 'Called once per frame as an action handler on a BattleObject pointed to by r5.


  *Phase-0 init (first tick):* reads target panel from Param3/Param4, converts to world coordinates via object_getCoordinatesForPanels,
  sets Timer to 0x30 (48 frames), and fills X/Y/Z velocities via math_getThrowSpeeds using a horizontal-reach constant
  0xB0000, flight duration 0x30, and per-frame gravity increment 0xFFFFB000.


  *Every tick:* integrates position (X+=XVel, Y+=YVel, Z+=ZVel), then subtracts the gravity constant from ZVel.
  Reads the ExtraVars pointer and, at specific Timer values (0x28, 0x20, 0x18, 0x10, 0x04), loads a byte from ExtraVars+1..5
  into CurAnim to cycle the visual animation frames (spin/tumble of the thrown object). Decrements Timer by 1.


  *Landing (Timer underflows past 0):* snaps PanelX/PanelY to Param3/Param4, zeroes Z to 0x30000 (ground height),
  calls object_setCoordinatesFromPanels + object_updateCollisionPanels, enables collision region 1, sets CurAnim=5
  (landed pose), plays SFX 0x1D0 (chip/object impact), sets CurAction=4 (hand off to the next action in the sequence),
  and resets CurPhaseAndPhaseInitialized.


  *Panel blink:* after decrementing Timer, if bit 3 of the new Timer is set, calls object_highlightPanel on the
  destination panel (flashing the target square during flight). The trailing byte table at byte_80C59A4 (18 bytes
  of signed offsets) appears to be animation/ExtraVars data not directly referenced by this code path; it may be
  indexed by a sibling action handler.


  Fields touched: oBattleObject_CurPhase, Param3, Param4, Timer, X, Y, Z, XVelocity, YVelocity, ZVelocity, ExtraVars,
  CurAnim, PanelX, PanelY, CurAction, CurPhaseAndPhaseInitialized.'
