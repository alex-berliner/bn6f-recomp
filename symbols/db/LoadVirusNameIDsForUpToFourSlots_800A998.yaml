name: LoadVirusNameIDsForUpToFourSlots_800A998
address: '0x0800A998'
kind: function
status: confirmed
summary: Writes the NameIDs of the up to four living actors on the side of the battle opposite the current one into
  a caller-provided array and returns how many were written.
interface: u32 battle_collectOpponentActorNameIds_800A998(u16 nameIds_out[4]) // r0 = u16[4] out; returns entry
  count (0-4); clobbers r1-r3 and flags, preserves r4
details: Reads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), takes the byte oBattleState_Unk_0d
  (an actor-list side selector) and flips it with 1^side, then indexes oBattleState_AliveBattleActors at 0x00 for
  side 0 and 0x10 for side 1 - i.e. the list of AlivePlayerActors vs AliveOpponentActors. Loops over the 4 pointer
  slots; each non-null battle object's oBattleObject_NameID (u16) is stored packed into the caller's array (2 bytes
  per entry, empty slots skipped so entries are compacted to the front). Returns byteOffset/2, the number of entries
  written. Only 4 slots are supported, matching the 4-virus-per-panel encounter display use case. r4 is push/pop'd
  only as a scratch save, not used as an input.
