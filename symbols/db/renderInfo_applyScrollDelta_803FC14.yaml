name: renderInfo_applyScrollDelta_803FC14
address: '0x0803FC14'
kind: function
status: confirmed
summary: Scans the OAM decomp buffer and offsets each row's Y by a scroll delta sourced from the toolkit's
  render-info field, decrementing that field by 4 first.
interface: "void sub_803FC14(void);\n  // inputs:  r10 = oToolkit* (RenderInfoPtr read via r10), r1 passed\
  \ in but not consumed\n  // outputs: r0 = final computed row offset, r1 = last byte_803FC50 entry read\n\
  \  //          r2 = 0x140 (loop end), r3 = eDecompBuffer2013A00 base\n  // clobbers: N Z C V (set by\
  \ final cmp pos,end or cmp cell,0x14)\n  // preserved: r4 r6 r7\n"
details: "- Reads oToolkit->RenderInfoPtr (an \"oToolkit_RenderInfoPtr\" field on the\n  toolkit struct\
  \ held through r10), then decrements the u16 at\n  RenderInfoPtr+0x10 by 4 and writes it back: this\
  \ is the per-frame\n  vertical scroll accumulator (likely a Y-shake / screen-shake counter).\n- Walks\
  \ eDecompBuffer2013A00, a 0x140-byte (20*4 = 80-halfword?) region\n  used as a packed OAM attribute\
  \ source for the decompressor. For each\n  cell it writes the current offset into 4 halfwords, then\
  \ reads the\n  next halfword and subtracts byte_803FC50[cell] (a per-cell delta\n  table: 8, 0x10, 0xC\
  \ repeating) to produce the next row offset, then\n  writes that into the following 8 halfwords.\n-\
  \ Termination is whichever fires first: the bge on `pos >= 0x140`\n  (buffer fully written) or the ble\
  \ on `cell <= 0x14` (20 cells done).\n- byte_803FC50 is a 20-entry delta table (8, 0x10, 0xC) that drives\
  \ a\n  staggered vertical scroll across 20 rows of the decomp buffer.\n- The outer loop's \"write 8,\
  \ read 1, advance cell\" pattern is the\n  classic GBA OAM decomp-buffer staggered-shape trick; the\
  \ render-\n  info offset being decremented each call suggests this is invoked\n  once per frame while\
  \ a screen-shake / scroll animation is active.\n"
