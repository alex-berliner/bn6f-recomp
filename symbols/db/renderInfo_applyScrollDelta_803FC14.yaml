open_questions:
- Is RenderInfoPtr+0x10 really a Y-scroll/shake counter, or a generic "draw offset" reused by this caller?
  Other callers of the same field would tell us.
- Is the buffer layout 20 rows of 8 halfwords (matching the 4-then-8 write pattern and the 0x14=20-cell
  count), or something else? The "first 4, then 8" asymmetry is unusual and may correspond to OAM affine/regular
  attribute grouping.
- Does r1 actually carry meaningful input here, or is it a vestigial caller-saved value from a now-removed
  fast path?
