name: ow_setupCoordTriggerRequest
address: '0x0809B00C'
kind: function
status: probable
summary: 'Populates an overworld trigger/dialog request (r5) for the player at a coordinate trigger: looks
  up the trigger id via checkCoordinateTrigger_8031a7a on player+0x1C, indexes dword_809B050 (after subtracting
  0xC0) into r5+4, sets r5+5=0x1A, and stores r5+6=2 / r5+0x1A=0 if player+0x24>>16 >= 0x3C else r5+6=3
  / r5+0x1A=0x18; r5+0x18=-1; returns 0.'
interface: (r0 unused in, r4/r5 = dialog-request struct) -> fills r5+4 (table byte), r5+5 = 0x1A, r5+6
  (2 or 3), r5+0x1A (0 or 0x18), r5+0x18 = -1; r0 = 0
details: Reads the game state's overworld player object and calls checkCoordinateTrigger_8031a7a on its
  +0x1C field (likely tile/trigger coordinates), then maps the returned trigger id by subtracting 0xC0
  (trigger range 192+) and indexing a byte table at dword_809B050, storing the looked-up byte at r5+4
  and a constant 0x1A at r5+5. It then reads player field +0x24 >> 16 (a coordinate, likely facing or
  position component) and stores 2 if >= 0x3C else 3 at r5+6, storing a matching halfword (0 for the 2
  case, 0x18 for the 3 case) at r5+0x1A, and -1 at r5+0x18. The r5 layout and values (0x1A/0x18 constants,
  -1 sentinel) suggest an overworld dialog or scripted-event setup struct, but the struct type and the
  meaning of the table bytes (0x05, 0x01) are unverified.
