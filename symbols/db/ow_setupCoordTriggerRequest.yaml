    — trigger id offset 0xC0 indexes byte table dword_809B050 into r5+4; ldr r1,[r1,#0x24]; asr r1,#0x10;
    cmp r1,#0x3c — player field +0x24>>16 selects constant 2 vs 3 at r5+6; strh 0/0x18 at r5+0x1A and
    -1 at r5+0x18 — paired pair of fields, pattern typical of dialog/queue setup structs; Callee checkCoordinateTrigger_8031a7a
