name: battle_compactFolderChipList_802945A
address: '0x0802945A'
kind: function
status: confirmed
summary: Compacts the current battle folder chip list in eBattleFolder by dropping empty (0xFFFF) slots and padding
  the tail so it always holds 30 entries.
interface: void battle_compactFolderChipList_802945A(void)
details: 'Walks the 30 halfword slots (0x3C bytes) of eBattleFolder, copying every non-empty chip ID (anything other
  than 0xFFFF, the "no chip" sentinel) down to the front of the list, then fills any remaining slots with 0xFFFF.
  Effectively removes gaps left by used/removed chips while keeping the folder a fixed 30-entry array. No arguments;
  operates solely on the eBattleFolder buffer. r4/r6/r7 are pushed and popped purely as scratch, so callers see
  them preserved. Flags nz/c/v are clobbered.

  '
