name: sub_813759C
address: '0x0813759C'
kind: function
status: confirmed
summary: If chatbox event flag 0x80 is clear, writes textbox command byte 0x8C to the caller-supplied byte; otherwise
  does nothing.
interface: void sub_813759C(u8* dest /* r5 */)
details: 'Trivial chatbox helper. Calls chatbox_mask_eFlags2009F38 with flag bit 0x80; that helper

  returns with Z clear when the flag is set. Only when the Z flag indicates the flag is clear

  (bne skips the store when the flag is set), the byte at r5 is set to 0x8C — a chatbox/

  textbox command code written into what is presumably a command queue or state byte owned by

  the caller. No other registers are touched; r1 is preserved and only r0, lr and the NZ flags

  are clobbered. The meaning of command 0x8C and of event flag 0x80 in the 0x2009F38 flag

  block is not established from this function alone.

  '
