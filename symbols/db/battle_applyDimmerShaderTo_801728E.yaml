name: battle_applyDimmerShaderTo_801728E
address: '0x0801728E'
kind: function
status: confirmed
summary: Applies a hit-flash darken shader to the sprite of the current acting battle object when the battle is
  in the "enemy-being-hit" flag state.
interface: "void battle_applyHitFlashShadeToActor_801728E(void);\n  // in:  r5 = battle object; r10 = unknown caller\
  \ state; lr = return\n  // out: r3, r4 = (clobbered, used by caller); r10 preserved\n  // clobbers: nzcv r0, r1,\
  \ lr\n  // preserved: r4\n"
details: 'Early-outs if battle flag 0x40 is clear, or if the current battle object has no active action

  (oBattleObject_CurAction == 0), or if the opposing entry''s 0x50 status byte is zero.

  Reads battle_getStateUnk40_800A704, masks with 0x1F, and uses the result as an index into the

  in-function table byte_80172C8 (32 entries: ramps up 0,2,4,...,0x1E then mirrors back down),

  producing a brightness/dim shade index. The shade index is multiplied by 0x21 (i.e. 33) and

  passed to sprite_setColorShader as the packed RGB shading value (R=shadeIdx, G=shadeIdx*2

  mod 32, B=0) — a single-channel "darken" tint typical of a hit-flash.

  Structures: oBattleObject (r5: oBattleObject_CurAction, oBattleObject_Alliance); battle-side

  state at 0x02036120 (entry accessed via getEntryPtr_2036120_1D0_802E070, byte at +0x50);

  battle_getStateUnk40_800A704 timer. Effect target: the sprite of the currently acting object.

  Quirks: r4 is preserved across the call despite r3/r4 being output; r10 input is unused

  inside. The 0x21 multiplier is the standard "shadeIdx -> 0x21 standard packing" conversion.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
