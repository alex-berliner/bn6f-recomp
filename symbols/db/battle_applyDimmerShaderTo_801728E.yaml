name: battle_applyDimmerShaderTo_801728E
address: '0x0801728E'
kind: function
status: probable
summary: When battle state flag 0x40 is set and the current battle object is acting and belongs to an
  alliance whose entry byte 0x50 is non-zero, applies a per-frame dimmer/flash shader to its sprite by
  indexing a 32-step palette ramp with (battleStateUnk40 & 0x1F).
interface: void battle_applyDimmerShaderTo_801728E(void /* implicit r3 */, void /* implicit r5 = battleObj
  */, void /* implicit r10 */); /* returns shader-applied result via r3/r4; clobbers nzcv, r0, r1, lr;
  preserves r4 */
details: "Early-outs via locret_80172C0 if any of the three gates fail:\n  1. battle_testFlag0x40_800A8F8()\
  \ == 0\n  2. battleObj->CurAction (oBattleObject_CurAction) == 0\n  3. getEntryPtr_2036120_1D0_802E070(alliance)->byte_0x50\
  \ == 0\nOtherwise reads battle_getStateUnk40_800A704(), masks with 0x1F to get an index\ninto byte_80172C8\
  \ (a 32-entry ramp 0,2,4..0x1E ramping up then down to 0; stored\ninline right after this function along\
  \ with what looks like a stub byte_80A0C0E\nand constant 0x20406 referenced via the off_80172C4 word).\
  \ The ramp value is\nexpanded to value + (value << 5) i.e. value * 33 (RGB555-ish: bit pattern\n0bbbbbgggggrrrrr\
  \ with 5 bits of r/r and ~5 bits of g) and passed to\nsprite_setColorShader as the per-frame tint factor,\
  \ producing the standard\nBN dimmer/brightness oscillation over the sprite.\nTouched structs/fields:\
  \ oBattleObject_CurAction, oBattleObject_Alliance on the\nbattle object (r5); the alliance entry-table\
  \ flag byte at offset 0x50; the global\n\"stateUnk40\" word.\nQuirks: r3/r4 are returned but only r3\
  \ is meaningfully written (it is just\npropagated through); r10 input is ignored; the function does\
  \ not touch its\ncaller's stack — it is a leaf dispatched from a battle per-frame hook and\nreturns\
  \ via `pop {pc}`. Inline data following the code includes dword_80172E8\n= 0x173 and dword_80172EC =\
  \ 0x17E which are not referenced in this snippet and\nlikely feed a sibling function.\n"
