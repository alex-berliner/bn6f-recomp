  windup clock, or a global effect phase?
- What does the alliance entry byte at 0x50 represent (a "should dim" flag, a hidden/invisible flag, an
  aura flag)?
- The .word byte_80A0C0E and .word 0x20406 immediately after the ramp table seem to be referenced by off_80172C4
  only insofar as they sit there; what function consumes them?
- Is the 0x1F-masked index essentially repurposing a low-5-bit "in-game frame counter" so the dimmer oscillates
  smoothly through the 32-entry ramp every ~32 frames?
