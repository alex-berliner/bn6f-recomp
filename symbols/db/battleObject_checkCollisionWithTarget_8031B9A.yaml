summary: Computes whether an object's relation to its target yields a "near/on-target" condition by chaining
  relative-position computation, half-plane edge test, and a state check.
interface: '(r0 = *BattleObject, r5 = ?) -> r0 = 0 or 1 (nz/Z flag reflects result) ; side effects: r2..r7
  clobbered'
details: "Tail call wrapper of three battle-helpers. Saves lr and immediately calls\n  battle_calcRelPosToTarget_803172E\
  \ which fills a scratch buffer at r5 (or in a global\n  reachable from it) with the entity and next-position\
  \ coordinates relative to a doubled\n  target reference. Then loads r2=4, r4=0, r3=4, r5=0x10 (constants\
  \ used by the inner\n  half-plane test) and calls math_pointCrossHalfPlaneTest_8031594 which evaluates\
  \ a\n  cross product against a directed edge and returns 1 when the point lies on the negative\n  side.\
  \ Finally calls sub_8031B7C (r0==1 -> byte at [[0x2013920]+0x14] else 0) and pops pc\n  to return that\
  \ r0 directly. So the visible r0 is whatever sub_8031B7C returns; the\n  earlier half-plane test only\
  \ feeds it via r0. Captured calls show r0 ending as 0 with\n  Z flag set, on every recorded invocation,\
  \ consistent with the sequence always answering\n  \"false\" in those snapshots. The buffer pointed\
  \ to by r0 (0x02009f5c) contains pairs of\n  16.16 coordinates laid out as (x,0,y,0, x',0,y',0, ...)\
  \ feeding the relative-position\n  computation - first two snapshots show 0xfe66 / 0xfe68 then later\
  \ ones show 0xfe62 /\n  0xfe64, but always with the trailing control byte 0x25, indicating the same\
  \ routine\n  state for the same beastout enemy configuration across replay frames.\n"
