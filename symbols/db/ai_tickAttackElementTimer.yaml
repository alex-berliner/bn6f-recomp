  reproduce: python3 tools/asmcat.py 0x080F7C3A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s mechanics match the code exactly: first call arms element 4 and copies AttackDuration
    into StepTimer, later calls decrement StepTimer and only call object_exitAttackState (with CurAnim=0)
    when it hits zero or below. However, the proposed name uses ''tick'' which is reasonable but ambiguous;
    the routine is specifically the AI step/duration timer for an attack element, so ''ai_tickAttackElementTimer''
    is fine, though a name like ''ai_runAttackElementTimer'' is slightly more standard for an AI tick
    handler. The summary overstates ''normal'' state — returning to normal is an assumption; the code
    simply exits the attack state and zeroes the cur anim index.; run wf investigate investigate-20261018-203615;
