name: ai_tickAttackElementTimer
address: '0x080F7C3A'
kind: function
status: probable
summary: 'AI per-tick handler for an element-typed attack: on first call arms AttackElement (default 4)
  and copies AttackDuration into StepTimer, then each tick decrements StepTimer and on expiry clears CurAnim
  and calls object_exitAttackState.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = destroyed; sets oAIAttackVars_AttackElement,
  StepTimer, oBattleObject_CurAnim
details: On the first invocation (AttackElement == 0) it writes element 4 into oAIAttackVars_AttackElement
  and copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, arming the countdown. On later
  invocations it decrements StepTimer and simply returns while it is still positive. When the timer reaches
  zero it sets the object's oBattleObject_CurAnim to 0 and calls object_exitAttackState, ending the attack.
  The element-4 default written on first entry suggests this handler serves a generic/fallback attack
  kind (or converts an unspecified element to a fixed one) whose length is configured elsewhere via AttackDuration.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] + tst/bne: element==0 branch stores 4 and copies AttackDuration
    into StepTimer (loc_80F7C4C vs arm path); ldrh StepTimer; sub #1; strh; bgt: classic countdown kept
    in the AI attack-variables struct; strb #0,[r5,#oBattleObject_CurAnim] before object_exitAttackState:
    resets animation when timing out; bl object_exitAttackState (0x08011714): hands the object back to
    its normal non-attack state'
  refs:
