- method: assembly-reading
  date: '2026-10-19'
  detail: mul r0,#8 then bl battle_aiGetVersionedTableEntry_800FE12 twice with off_80F2E7C and off_80F2EA0
    (sub_80F2E54); lsl r0,#0x10 / orr r0,r6 packs the two halfword results into one word; off_80F2E7C
    lists three table bases byte_80F2E88/90/98, matching the AI-version table selection of the callee;
