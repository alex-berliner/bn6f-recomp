name: battle_aiGetParamPair
address: '0x080F2E54'
kind: function
status: probable
summary: Packs two halfword AI parameter-table entries, selected by index and the battle object's AI version,
  into one return word.
interface: (r0 = parameter index) -> r0 = (second-table halfword << 16) | first-table halfword; flags
  from the orr
details: 'Multiplies r0 by 8 and calls battle_aiGetVersionedTableEntry_800FE12 twice: first with table-pointer
  list off_80F2E7C (byte_80F2E88/90/98), then with off_80F2EA0 (byte_80F2EAC/B4/BC), passing stride 8
  in r2. The callee picks one of three 8-byte (4-halfword) tables by the battle object''s AI version and
  reads the halfword at index*8. First table group yields 20/60/110/10, or 40/120/220/10 for a doubled
  variant; second group is always 10. Result is combined as (hi<<16)|lo, so the low halfword is the varying
  value and the high halfword is constant 10.'
