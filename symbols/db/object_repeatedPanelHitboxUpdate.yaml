name: object_repeatedPanelHitboxUpdate
address: '0x080DDF86'
kind: function
status: probable
summary: Battle-object update that spawns a collision region on its panel at two countdown ticks and then
  self-destructs.
interface: (r0/r1 unused, r5 = battle object) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_DESTROY when done
details: 'On first run (phase 0) it sets CurPhase to 4 and Timer to 30 frames. Each frame after, it decrements
  oBattleObject_Timer; when the timer hits 20 (0x14) or 10 (0xA) it calls object_spawnCollisionRegionAtPanel,
  which places a hitbox on the object''s current panel using its coordinates and element. When the timer
  reaches 0 it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the
  object is removed. Net effect: two timed hitbox spawns over a ~30-frame lifetime, a pattern typical
  of recurring panel-attack objects.'
