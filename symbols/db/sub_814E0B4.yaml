  \ at r1). All 40 captured\n  calls return with r0 unchanged and flags = ----, consistent with just a single ldrb.\
  \ The lone\n  caller `ply_goto` is itself an ARM/Thumb trampoline (lr returns into ARM at 0x0814e0f5), explaining\n\
  \  why this stub exists.\n"
