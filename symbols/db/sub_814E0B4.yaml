name: sub_814E0B4
address: '0x0814E0B4'
kind: function
status: hypothesis
summary: Loads one byte from the buffer pointed to by r2 and tail-calls the next handler (sub_814E0B6) with that
  byte in r3, leaving r0 untouched.
interface: void sub_814E0B4(int arg /*r0*/, u8* src /*r2*/) /* r3 out = *src, r0 passed through, lr is the tail-call
  target */
details: 'Two-instruction thunk: LDRB r3, [r2] followed by a tail-branch to sub_814E0B6.

  It reads a single byte from the address in r2 into r3 and immediately hands control

  (and the caller''s lr) to sub_814E0B6, which continues processing using that byte.

  r0 is never read or written here, so it is some context/state argument consumed by

  the continuation. The NZ flags of the caller are clobbered (the ldrb sets them),

  while C and V are listed as outputs, meaning they come from sub_814E0B6, not from

  this load. Given the shape (state arg in r0, byte source in r2, byte passed on in

  r3), this looks like one step of a byte-stream consumer chain, e.g. a text/chatbox

  decoder, script interpreter, or data-stream parser that processes one byte per link.

  Without caller context the exact subsystem is unknown, so the name is a guess.

  '
