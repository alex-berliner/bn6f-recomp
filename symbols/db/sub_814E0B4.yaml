  \ `sub_814E0B6` (which the lifter shows as a direct bl target in the callee list). This is the\n  classic BN split-Arm/Thumb\
  \ pattern where the ARM-side entry point reads one byte at *r2 (a\n  script/opcode pointer) into r3 so the Thumb\
  \ body can switch on it without needing to re-load it.\n  The captured entry snapshots consistently show r2 pointing\
  \ into ROM (0x0818xxxx/0x0819xxxx range)\n  and r3 on exit mirrors the byte read from *r2 (e.g. snap_story2_0:\
