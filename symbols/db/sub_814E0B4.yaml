name: sub_814E0B4
address: '0x0814E0B4'
kind: function
previous_names: []
status: hypothesis
summary: 'Trivial thunk: reads a byte from an AIData pointer (Pet) into r3 as a setup for the next call.'
interface: '(r0 = ?, r1 = ?, r2 = AIData* pet, r3 = ?) -> r0 unchanged, r3 = AIData[0]; side effects: none observed'
details: "Three instructions: `ldrb r3, [r2]` then fall through to sub_814E0B6. The contract on\n  the *thunk* only\
  \ exposes r2/lr as inputs because everything before is just to set up\n  the ldrb source. r3 is overwritten with\
  \ the byte at *r2; the caller `ply_goto`\n  passes r2 in the captured calls as addresses in the 0x0818xxxx/0x0819axxx\
  \ range\n  (e.g. 0x0818e800, 0x0818e897+0x40=0x0818e8d7). Those addresses fall inside the\n  AIData struct range\
  \ used by AIBattle code, but r2 is treated as a plain byte\n  pointer here.\n  Effectively a glue/tail-call into\
  \ sub_814E0B6 with r3 preloaded from [r2].\ndetails: |\n  Sub-helper to ply_goto. The \"?\" of role is hard to\
  \ settle without seeing\n  sub_814E0B6 itself; this function on its own only sets r3 and falls through.\n"
