  detail: '- `ldrb r3, [r2]` (single Thumb instr at 0x0814e0b4) loads the byte at *r2. - `thumb_func_end sub_814E0B4`
    immediately follows, so the next function at 0x0814e0b6 continues execution with r3 already loaded. - Caller
    `ply_goto` (0x0814e0dc) is listed as unnamed; the captured calls show r2 ≈ 0x0818e800/0x0819a700 ranges (AIData
    territory). - r0 is preserved across the call (r0_exit == r0_entry in every snapshot).'
