name: get_overworldPlayerPosition
address: '0x0809E1CA'
kind: function
status: probable
summary: Returns three position fields (likely x/y/z) of the overworld player object.
interface: () -> r0 = playerObj+0x20, r1 = playerObj+0x1c, r2 = playerObj+0x24; flags clobbered by loads
details: 'Dereferences the toolkit''s GameStatePtr, then oGameState_OverworldPlayerObjectPtr, and copies
  fields 0x1c, 0x20 and 0x24 of the player object into r1, r0 and r2 respectively. It is a leaf getter:
  no writes, no calls, just three loads and return. Note the return order is swapped relative to memory
  order (r0 gets 0x20, r1 gets 0x1c), suggesting callers expect (y, x) or a specific argument order. The
  offsets most plausibly hold the player''s overworld coordinates, but the field semantics are unverified.'
