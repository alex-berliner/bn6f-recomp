status: probable
summary: 'One-time-per-run init of the battle custom (chip-select) screen: resets battle state words,
  loads the chip-select tilemap/OBJ graphics, initialises the eS20364C0 state (NaviIndex, folder chip
  count, selectable PET-Navi candidates) and advances the battle phase counter.'
interface: 'void battle_initCustomScreen(void) : r10 (toolkit) -> [r2 r3 r4 r5 r6 r8 r9] (callee-saved
  restored)'
details: 'Reads oBattleState_Unk_07; on the first entry (==0) also zero-fills dword_20349A0 (0x14 bytes)
  and calls battle_setUnk20349A5Flag_802A210. Always: ClearCustGauge, dispatch_801DACC(0x30172) and dispatch_801DACC(0x400),
  clears mask 0x20130 in eStruct2035280 (flags_clearBits_eStruct2035280_801BED6). Reads NaviStats byte
  0x29 (NaviIndex) for the actor; when sub_8029F70''s mode condition passes and the actor emotion is not
  5, counts unmasked event flags (countUnmaskedEventFlags_8029EC8) and copies one of the two 0x258-byte
  tilemap blobs (byte_86E625C vs byte_86E64B4) to unk_2035000, then stamps rectangles from the 6-byte-entry
  table byte_8027B2C (x,y,w,h,flags; 0xFF sentinel) via sub_8027CCC. Zero-fills eS20364C0 (0x70 bytes)
  and initialises it: +0x10/+0x11/+0x15 = NaviIndex, +4 = 1, +0xC = 0xFF, +0x18 = sub_8029EF8''s selectable
  PET-Navi candidate list (when the mode condition holds and emotion != 5), +9 = 0x1A, halfword +0x20
  = 0xFFFF. Increments oBattleState_Unk_07. byte_20364CC from the GetBattleMode lookup byte_80269BC (modes
  2..5 -> 0..3, mode 8 -> 6, else 0xFF); on later passes, mode 5 with the emotion condition forces 5.
  Then tickBeastOutCounter_802A49C, battle_updateBeastOutCounter_802A40C, battle_compactFolderChipList_802945A,
  expireBattleFlag_802A646, battle_countFolderChips_8027D58 (count into eS20364C0+5), sub_8027E2C, sub_8028250,
  sprite_CopyObjTilesToVramSlot_80281D4 + sub_8029CD4 (4 OBJ tile slots), sub_8028476, sub_8015940, battle_ClearPendingEventFlag_802A0EC.
  Called once per custom-screen run by sub_8009338''s tick, which then polls sub_8026A28 until the screen
  finishes and advances the battle state machine.

  '
