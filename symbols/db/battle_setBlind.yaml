    mov r0,#0x20; bl object_setFlag2 sets a single status bit in the object''s flags2; ldr r1,[r5,#oBattleObject_CollisionDataPtr]
    shows it operates on the caller''s battle object; callee summary: object_setFlag2 sets bits in a battle
    object''s flags2 collision word, confirming the flag write'
