name: battle_setBlind
address: '0x08013F04'
kind: function
status: probable
summary: Inflicts the blind (darkness) status on a battle object for 600 frames and sets its blind flag.
interface: (r0 unused, r5 = battle object) -> writes BlindTimer to the object's collision data and sets
  flags2 bit 0x20; flags not meaningful
details: Loads the collision-data pointer from the object at r5 and stores 0x258 (600 frames, 10 seconds)
  into the BlindTimer field, then calls object_setFlag2 with bit 0x20, presumably marking the blind/darkness
  state as active. The constant 0x258 matches a timed status effect counted down elsewhere. The r5 base
  and the oBattleObject_CollisionDataPtr load indicate this runs on the caller's own battle object, most
  likely the player. object_setFlag2 only ORs the given bits into the flags2 word of the collision data,
  so the function is purely a status application, not a visual effect itself.
