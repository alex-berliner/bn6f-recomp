name: battle_objectAdvanceCounterToState8_8046DDC
address: '0x08046DDC'
kind: function
status: confirmed
summary: Steps an object's counter at (+8) forward by 2 each call, and once it reaches 21 clamps it and switches
  the object's state byte (+0) to 8, then calls a per-object update helper.
interface: int sub_8046DDC(void *obj /* r5 */)  // always returns 0; clobbers r0-r3, r12, flags; preserves r4-r7
details: 'Treats r5 as a pointer to a small object/state record. It reads the byte at offset 0x08 (a frame/charge
  counter), adds 2, and stores it back. If the new value has reached 0x15 (21), it clamps the counter at 0x15 and
  writes 8 into the byte at offset 0x00, which appears to be the object''s state/mode field (writing 8 here moves
  the object into state 8, presumably its next phase). It then calls sub_8047134 with r5 still holding the object
  pointer (that helper likely updates/renders the object for its current state) and finally returns 0 in r0 with
  flags set from 0. The +2 step and the 0x15 cap suggest a timed transition: the object spends a fixed number of
  ticks in its current state before switching to state 8. Note the counter is stored before the comparison, so the
  stored value is the unclamped sum; the clamp rewrite only happens when the threshold is crossed. Only r4-r7 (r5
  included) are preserved per the caller contract; the callee-saved r8-r12 listed as outputs are effectively whatever
  the helper leaves behind.

  '
