name: ai_attackReleaseWait
address: '0x080ECB84'
kind: function
status: probable
summary: 'AI attack sub-step: clears the spawned attack object reference, plays animation 7, waits 3 frames,
  then exits the attack state.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no return value
details: On first entry (AttackElement == 0) it nulls oBattleObject_RelatedObject1Ptr and oAIData_TempAttackObjectPtr,
  cutting the AI's link to its spawned attack object, starts animation 7 on the object, sets StepTimer
  = 3, and stores 4 into oAIAttackVars_AttackElement so the setup branch never runs again. Each subsequent
  call decrements StepTimer; once it goes negative (bge fails) it calls object_exitAttackState to return
  the object to its normal AI state. The element field is evidently reused as a sub-state marker (4 =
  'release & wait' phase). Only 3 frames of delay suggests a brief pause after firing before resuming.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: setup branch writes 0 to RelatedObject1Ptr and AIData_TempAttackObjectPtr, detaching the attack
    object (0x080ECB8C-0x080ECB94); object_setAnimation with ID 7, then StepTimer=3 and AttackElement=4
    latch (0x080ECB9C-0x080ECBA0); decrement of oAIAttackVars_StepTimer with bge gate calls object_exitAttackState
    when elapsed (0x080ECBA2-0x080ECBAC); callee object_setAnimation 'marks animation pending' and object_exitAttackState
    'exits attack state' match a post-attack wait step
