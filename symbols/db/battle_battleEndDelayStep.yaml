name: battle_battleEndDelayStep
address: '0x08008B52'
kind: function
status: confirmed
summary: Runs the post-battle delay state of the battle object, counting down 30 frames before flagging the battle-end
  sequence as started.
interface: void battle_battleEndDelayStep(u32 battleObj /*r5*/, u32 toolkit /*r10*/) — no return value; updates
  N/Z/C/V via the countdown test
details: "State-machine step for the battle object's end-of-battle handling, called from the battle\nobject update\
  \ loop with the object in r5 and the toolkit in r10.\n\nFirst entry (object byte at +3 still 0): stores a 30-frame\
  \ countdown into the object's\nhalfword timer at +8 and advances the object's state byte (+3) to 4, so subsequent\
  \ calls\ntake the countdown path immediately.\n\nEvery call then decrements the halfword timer at +8 and returns\
  \ while it is still > 0\n(the decrement result drives flags; branch on >0 keeps the state active for the remaining\n\
  frames).\n\nWhen the countdown expires:\n- stores 1 into the object's byte at +4 (its battle-end flag slot),\n\
  - reads the toolkit's GameState pointer (oToolkit_GameStatePtr) and stores 1 into the\n  game state's battle-end\
  \ substate byte (oGameState_BattleEndSubState), signalling the\n  battle end sequence has begun,\n- calls eStruct200A008_setUnk02\
  \ with r0 = 0, clearing that toolkit/entity-struct flag.\n\nQuirks: the \"first call\" check relies on state byte\
  \ +3 being zero on entry; the timer is\na 16-bit halfword so the decrement wraps at 0, but the >0 branch makes\
  \ the countdown\nbehave as a plain signed-style test in practice. Clobbers r0, r1 and lr (calls out via\nbl),\
  \ so lr is consumed.\n"
