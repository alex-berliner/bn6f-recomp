name: battle_battleEndDelayStep
address: '0x08008B52'
kind: function
status: probable
summary: Per-frame countdown (30 frames) that, on expiry, advances the battle-end substate and clears
  a flag in the overworld player struct.
interface: (r5 = battle-side struct with state at +3, timer at +8 halfword, result flag at +4; r10 = toolkit)
  -> r0 = overworld struct base from callee; no meaningful return
details: 'State machine step: if the byte at [r5,#3] is 0, it initializes the halfword timer at +8 to
  0x1E (30) and sets the state byte to 4. Every call then decrements the +8 halfword; while it is still
  positive it returns. When it reaches zero, it stores 1 into [r5,#4], stores 1 into the GameState field
  oGameState_BattleEndSubState (via the toolkit pointer in r10), and calls eStruct200A008_setUnk02(0),
  which zeroes byte 2 of the fixed overworld player struct at 0x200A008. This matches a short wait after
  a battle result before handing control back to the overworld/state machine.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#3]; tst/be: lazy-init timer 0x1E and state 4 at loc_8008B52 branch; ldrh r0,[r5,#8];
    sub r0,#1; strh; bgt locret: per-frame decrement until zero; strb r0(=1),[r1,#oGameState_BattleEndSubState]
    via toolkit''s GameStatePtr: signals battle-end progression; mov r0,#0; bl eStruct200A008_setUnk02:
    clears byte 2 of overworld struct 0x200A008 at the same moment'
