  date: '2026-10-14'
  detail: '- `push {lr}` / `pop {pc}` and only `r5/r10` used from the caller-preserved set ⇒ void. - `ldrb
    r0,[r5,#oObjectHeader_Flags]; orr r0,#2; strb r0,[r5,#oObjectHeader_Flags]` sets OBJECT_FLAG_VISIBLE
    on the object pointed to by r5. - Direct call to `sprite_clearFinalPalette` immediately after that.
    - `ldr r0, off_80D2344` then `bl battleObject_dispatchActionHandler_801B394` shows the jumptable at
    jt_80D2348 is the action handler table; the table contains 9 handlers with r5 preserved across the
    call. - `bl object_presentCollisionData` and `bl object_updateSpriteTimestop` are the documented per-frame
    finalize/sync pair for battle objects. - Project callee summaries describe `battleObject_dispatchActionHandler_801B394`
    as routing on CurAction.'
