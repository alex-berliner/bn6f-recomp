name: battleObject_runUpdateActionsAndCollisions_80D2320
address: '0x080D2320'
kind: function
status: confirmed
summary: Per-frame update of one battle object — flags it as updated, frees its palette slot, resolves incoming
  hits, runs its action-state handler, publishes its collision box, and animates its sprite (honoring time stop).
interface: void battleObject_runUpdateActionsAndCollisions(u32 r2, u32 r4, u32 r5 /*object header*/, u32 r8, u32
  r9, u32 r10, u32 r11, u32 r12); returns r5/r8/r9/r10/r11/r12 as left by the action dispatcher (r10 passed through
  unchanged); r6/r7 preserved; clobbers r0-r4, lr and nzcv
details: 'Tail of the battle object update loop, called with r5 pointing at the object header. Steps in order: (1)
  sets bit 1 (0x2) of oObjectHeader_Flags, marking the object as updated this frame; (2) sprite_clearFinalPalette
  releases the object''s final-palette slot for this frame; (3) object_applyCollisionHit_801AD9E resolves hits against
  the object (uses r4 and r5, overwrites r2 before the dispatcher reads it); (4) battleObject_dispatchActionHandler_801B394
  runs the handler for the object''s current state, selected via the jump table jt_80D2348 with 9 entries (clearActiveOnDeletion,
  resetActionState, beginDestroy, sub_80166AE, initAndRunAI, ai_dispatchMoveSubState, pendingCommit, hoverBobUpdate,
  sub_80D2398); (5) object_presentCollisionData publishes the object''s collision box for this frame; (6) object_updateSpriteTimestop
  animates the sprite, frozen while time stop is active. r5/r8/r9/r11/r12 on exit are whatever the dispatcher left
  behind; r6/r7 are untouched by all callees here.

  '
