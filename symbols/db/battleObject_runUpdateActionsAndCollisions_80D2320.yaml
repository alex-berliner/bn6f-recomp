status: probable
summary: 'Per-frame battle object action step: forces VISIBLE, clears final palette, dispatches the CurAction
  handler, then refreshes collision and sprite state.'
interface: (r5 = BattleObject*, r10 = Toolkit*) -> side effects on the object only; void.
details: "Sets OBJECT_FLAG_VISIBLE (0x2) into the object's ObjectHeader.Flags byte via `ldrb/orr/strb\
  \ [r5,#oObjectHeader_Flags]` (so the object is drawn this frame).\n  Calls `sprite_clearFinalPalette`\
  \ to zero the high nibble of the sprite's final palette byte.\n  Loads `jt_80D2348` (the per-CurAction\
  \ jumptable) and dispatches it through `battleObject_dispatchActionHandler_801B394`, which runs one\
  \ of: sub_80D236C, battle_ResetObjectActionState_80165B8, sub_80D239C, sub_80166AE, sub_8016B02, sub_8017E26,\
  \ sub_8016B36, sub_8016B72, sub_80D2398. The CurAction byte (offset 0x9 in BattleObject) is the index.\n\
  \  Runs `object_presentCollisionData` so any queued hit/status data is applied this frame.\n  Finally\
  \ `object_updateSpriteTimestop` advances the sprite animation, respecting time-stop.\n  Tail-call returns\
  \ with `pop {pc}`; no caller-visible return value.\n"
