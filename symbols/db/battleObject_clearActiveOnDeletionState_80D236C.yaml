    / `#2` shows OBJECT_FLAG_PAUSE_UPDATE cleared and OBJECT_FLAG_ACTIVE set - `mov r0, #8; strb r0, [r5,#oBattleObject_CurAction]`
    writes CurAction = 8 (CUR_STATE_DESTROY-like sentinel) - `mov r0, #0; strh r0, [r5,#oBattleObject_CurPhaseAndPhaseInitialized]`
