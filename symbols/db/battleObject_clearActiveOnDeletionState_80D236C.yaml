name: battleObject_clearActiveOnDeletionState_80D236C
address: '0x080D236C'
kind: function
previous_names:
- sub_80D236C
status: probable
summary: If the deletion-state battle flag is set, clear the object's ACTIVE bit, set PAUSE_UPDATE, force
  CurAction=8 and zero CurPhaseAndPhaseInitialized.
interface: (r5 = BattleObject*) -> side effects only; no return value
details: "Calls battle_getFlags to read the battle state's halfword at offset 0x32, then tests bit 0 with\
  \ tst r0, #1.\n  If bit 0 is clear, calls nullsub_10 (an empty stub) and returns.\n  If bit 0 is set,\
  \ manipulates the BattleObject at r5:\n    - reads byte at oObjectHeader_Flags (offset 0 in the ObjectHeader),\
  \ clears bit 0x04 (OBJECT_FLAG_PAUSE_UPDATE) and writes it back\n    - then reads it again, sets bit\
  \ 0x02 (OBJECT_FLAG_ACTIVE) and writes it back\n    - writes immediate 8 into oBattleObject_CurAction\
  \ (offset 0x9)\n    - writes halfword 0 into oBattleObject_CurPhaseAndPhaseInitialized (offset 0xa)\n\
  \  Net effect: when the per-frame \"deletion\" flag is asserted, the object is left ACTIVE but update-paused,\
  \ with its action forced to 8 and phase counter reset.\n  Used as a per-frame routine during battle\
  \ object lifecycle handling.\n"
