name: battleObject_clearActiveOnDeletionState_80D236C
address: '0x080D236C'
kind: function
status: confirmed
summary: During battle teardown, transitions a still-active battle object into the inactive/deleting state by clearing
  its active flag, setting its inactive flag, forcing its action to the deletion handler (8), and zeroing its phase
  counters.
interface: 'battleObject_clearActiveOnDeletionState_80D236C(r5: Object* obj, r10: BattleCtx* ctx) -> r1: u32 (2
  = cleared, 1 = no-op); clobbers r0, nz, lr'
details: 'Reads the global battle flags via battle_getFlags(). If bit 0 (battle-active) is clear,

  it calls nullsub_10 (a no-op placeholder) and returns with r1 = 1, leaving the object

  untouched. If the battle IS active, it manipulates the object''s oObjectHeader_Flags

  byte: clears bit 2 (the "active/living" flag) and sets bit 1 (the "inactive/deleting"

  flag), writes oBattleObject_CurAction = 8 (the deletion/dispose action), and zeroes

  oBattleObject_CurPhaseAndPhaseInitialized (16-bit) so the object restarts at phase 0

  while already in the deletion action. r10 is in the register contract but never

  actually read here; it is preserved across the callee calls. r1 ends up as 1 (not

  active) or 2 (cleared), set by the mov #2 before the bic/orr pair or left at #1 from

  the earlier mov in the not-active path.

  '
