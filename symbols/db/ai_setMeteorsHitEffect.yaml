name: ai_setMeteorsHitEffect
address: '0x08104608'
kind: function
status: probable
summary: AI step that spawns/repositions a meteor visual at the target and flips to hit state once it
  lands.
interface: (void, reads oAIAttackVars_AttackElement of r7, oBattleObject via r5) -> void; sets element,
  anim, Z, ZVelocity, StepTimer, HitElement
details: On first call sets AttackElement to 4, kicks the target object's animation to 0x41, lifts its
  Z to 0x960000 with upward velocity 0x140000, arms StepTimer=7. On subsequent calls pulls Z down by ZVelocity
  each frame, decrements StepTimer; when it underflows writes 0x10 to HitElement, marking the meteor impact.
  Operates on r7 (AI attack vars) and r5 (battle object / missile).
