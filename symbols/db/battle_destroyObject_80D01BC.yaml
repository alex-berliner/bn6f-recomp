name: battle_destroyObject_80D01BC
address: '0x080D01BC'
kind: function
status: confirmed
summary: Tears down a battle object, clearing its owner back-reference in the extra-vars list and then freeing the
  object itself.
interface: void sub_80D01BC(u32 object /* r5 */) -> returns object in r5; lr is return address, all other registers
  scratch
details: 'Small destructor wrapper for a battle object passed in r5. First calls battle_clearExtraVarsOwnerRef with
  r5 unchanged, which clears the owner back-reference the object holds in the extra-vars list (so the list no longer
  points at a freed object). Then calls object_genericDestroy, the generic object teardown that releases the object
  from the battle object manager. Neither callee modifies r5, so the wrapper passes the object pointer back out
  in r5; callers apparently use that value (it is listed as an output). Flags nz c v and r0-r3/lr are clobbered
  by the callees; r6 and r7 are preserved. Typical use is as the cleanup/destroy step of an object''s lifecycle
  callbacks.

  '
