summary: Long-call trampoline that forwards to sprite_projectAndCull unchanged.
interface: (r0-r3 = args passed through to sprite_projectAndCull) -> r0 = whatever sprite_projectAndCull
  returns; flags preserved from callee (pop does not clobber)
details: 'A 7-instruction wrapper: pushes {r5,lr}, loads the address of sprite_projectAndCull+1 from off_8002D10,
  sets LR = PC and branches via BX to perform an interworking (ARM-> Thumb state via +1) far call, then
  pops {r5,pc} to return. It performs no argument marshaling, so r0-r3 reach the callee as-is. The r5
  push/pop is dead boilerplate typical of the project''s generated long-call thunks. Behavior is exactly
  that of the callee: project an object''s world position through the camera and mark on-screen frame
  pieces.'
