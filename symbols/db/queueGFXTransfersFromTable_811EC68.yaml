name: queueGFXTransfersFromTable_811EC68
address: '0x0811EC68'
kind: function
status: confirmed
summary: Builds the per-frame GFX transfer list in the staging buffer at unk_20096E0 (packing two source-table
  entries via sub_811FB84, then appending the trailing off_811ECB4 table verbatim) and submits it via
  QueueGFXTransfersInList.
interface: void sub_811EC68(void /* uses r10/lr as inputs per lifter, no meaningful args */)
details: 'Walks a small packed source table at off_811ECFC containing two records of 4 words each

  { src, size, dest, size }; for each it calls sub_811FB84(src, size) to compute a

  "packed" 32-bit header (returned in r0) and writes it into the staging buffer at

  unk_20096E0, followed by the trailing two words { dest, size } of that record copied

  verbatim. The first loop is bounded by srcOff < 0x20 (exactly two records, matching

  the 0x20-byte table). Then it appends a second table at off_811ECB4 word-for-word

  until a NULL terminator (off_811ECB4 lists five { ptr, dst, size } triples plus NULL,

  pointing at VRAM regions like 0x600D000/0x340, 0x600D340/0xB40, 0x6016E80/0x180,

  0x6017000/0x160 plus a small OBJ/unk_3001B10 region). Finally it passes the

  staging buffer to QueueGFXTransfersInList, which presumably kicks off DMA into the

  queued VRAM/OBJ/OAM regions for the upcoming frame.

  Quirks: register form really is just a staged-DMA build; the function takes no

  arguments and returns nothing. The lifter flags nz as clobbered because the tail

  `tst r0, r0` (r0 = the NULL terminator) sets Z.

  '
