name: battle_highlightTwoPanelsAhead
address: '0x08105050'
kind: function
status: probable
summary: Highlights the two panels in front of the battle object this object is on
interface: (r5 = battle object ptr, implicit) -> calls object_highlightPanelRegion(x + 2*dir, y, 0x1a,
  allianceDirFlags); no return value
details: Gets the facing-direction multiplier from the object's alliance side and DirectionFlip flag,
  multiplies it by 2, and adds it to the object's PanelX to compute the highlight's anchor X (PanelY unchanged).
  It then calls object_highlightPanelRegion with r2=0x1a (highlight kind/extent — likely a 2-panel-long
  strip or its color/style id) and r3 = the object's AllianceAndDirectionFlip halfword so the highlight
  matches the owner's side. r5 is used directly, so the caller sub_8104474 must keep the object pointer
  in r5.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_getFrontDirection then mov r1,#2 / mul r0,r1 gives a 2-tile offset in the facing direction;
    ldrb r1,[r5,#oBattleObject_PanelX] / add r0,r0,r1 and ldrb r1,[r5,#oBattleObject_PanelY] build the
    panel coordinates; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip] passed as last arg matches
    object_highlightPanelRegion's side/color parameter; tail call bl object_highlightPanelRegion with
    fixed r2=0x1a selects the highlight type
