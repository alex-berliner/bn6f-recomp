name: sub_811CBA0
address: '0x0811CBA0'
kind: function
status: confirmed
summary: Steps a one-shot countdown timer on a state object (r5); on the first call it initializes the delay from
  a lookup entry, and once the timer runs out it bumps a counter by 4 and reports completion.
interface: Next sub_811CBA0(void *obj /* r5 */); returns r0 = 1 when the timer expired this call, 0 while still
  counting; clobbers r0-r1, lr, flags (NZCV reflect the timer decrement/expiry)
details: 'r5 points to a small state object. Byte +0x9 is an "active/started" flag,

  word +0x10 is the remaining-timer count, and word +0xC is a u32 counter the

  expiry path advances. On the first invocation (flag clear) it sets the flag

  to 1, calls sub_811CC68 (no args, likely a getter for the current table/

  script entry given the shared r5 context), loads the halfword at entry+2,

  and stores it as the initial timer value at +0x10. Each subsequent call

  decrements +0x10 (subs r0, #1, flags preserved to caller). While the result

  is >= 0 it stores the new count and returns 0. When the decrement goes

  negative it resets the active flag to 0, stores 0 back into +0x10, calls

  counter_addU32_r5Plus0C_811CC60 with r0 = 4 (adds 4 to the u32 at obj+0xC,

  probably an event/progress counter advancing to the next step), and returns

  1. The +0xC counter being bumped by exactly 4 suggests step-coded event

  progression rather than a plain tick counter. Note the timer is compared

  as signed after the decrement, so a stored delay of 0 expires immediately

  on the first call.

  '
