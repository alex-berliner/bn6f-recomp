name: object_setPanelsFromCoordinates
address: '0x0800E2AC'
kind: function
status: confirmed
summary: Recomputes a battle object's PanelX/PanelY from its current world X/Y/Z position.
interface: void object_setPanelsFromCoordinates(BattleObject* obj /* r5 */); clobbers r0-r3; preserves r5-r6; returns
  panel coords in r0/r1 as side effect; flags reflect convertXYToPanelXY_800E258
details: 'Thin wrapper around convertXYToPanelXY_800E258. Loads the object''s world position from oBattleObject_X,
  oBattleObject_Y and oBattleObject_Z (Z is passed as the third argument to the conversion helper, likely a height/
  layer input), then writes the resulting panel column/row bytes back into the object''s oBattleObject_PanelX and
  oBattleObject_PanelY fields. The object pointer is expected in r5 per the engine''s convention; r3 appears in
  callers'' inputs but is not read by this function. R0/R1 still hold the converted panel coordinates on return,
  which callers may reuse.

  '
