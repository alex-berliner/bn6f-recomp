name: battleGetPanelChooseDuration
address: '0x080FAEA0'
kind: function
status: probable
summary: Returns the panel-choose attack duration, with a longer variant when the target has the specified
  battle flag.
interface: (r0 = ..., r1 = ...) -> r0 = attack duration; flags clobbered
details: Loads a duration base from dword_80FAEC0 through sub_800FE28 and saves it in r4. It then reads
  the first battle-object flag word with object_getFlag, whose object comes from the preceding call/setup.
  If bit 0xA000 is set, it adds 0x3C to the duration; otherwise it returns the base unchanged. The only
  caller stores the return value in oAIAttackVars_AttackDuration before entering attack state 9.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: ai_beginPanelChooseAttack line 0x080FAFA6 stores the return value directly in oAIAttackVars_AttackDuration.;
    The function tests object_getFlag's result against 0xA000, then adds 0x3C only when the test is nonzero.;
    The base duration is obtained from dword_80FAEC0 via sub_800FE28.; ai_beginPanelChooseAttack arms
    PanelChooseCallback and calls object_setAttack4(9), confirming this is panel-choose attack setup.
  refs:
  - bn6f/asm/asm31.s:149893
