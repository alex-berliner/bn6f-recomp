name: object_stepColorFadeInAndUpdate
address: '0x0811E510'
kind: function
status: probable
summary: Advances an object's color-fade-in effect and immediately updates its sprite.
interface: (r0 = object pointer) -> r0 = unspecified; flags unspecified
details: This six-instruction wrapper passes the incoming object pointer to object_stepColorFadeIn, then
  calls sprite_update with its result. It therefore performs one fade-in step followed by one sprite refresh.
  The known callee summary says the step advances an increasingly bright uniform tint and a saturating
  frame counter; the wrapper itself provides no explicit return contract.
