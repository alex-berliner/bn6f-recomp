name: oBattleObject_WobbleOrEffectTimer
address: '0x19'
kind: struct-field
status: hypothesis
summary: Generic short-duration timer (in frames) used by various object effects such as wobble, color-shading
  flashes, and inter-object fade transitions.
details: 'Almost every access follows the same pattern: the byte is initialized to a small constant (0x1e,
  0x20, 0x1f, 0x3c, or derived from Unk_1e_Unk_1f), then decremented each tick (`sub r0, #1` / `sub r0,
  #2`) and tested against 0 to trigger end-of-effect behavior (restore coords, set CurPhase 4, etc.).
  This is the canonical "frames remaining" timer idiom. The few non-timer uses (e.g., `sprite_setColorShader`
  in sub_80B844A / sub_80C0DB0 / sub_80C2A3A / sub_80C2F84, and the dispatch in `timefreezeObjectRunFunction_80E1880`)
  repurpose the same byte as an index/seed, suggesting it is in fact a shared scratch byte whose meaning
  depends on the active state/handler — which is why a single precise name is hard to pin down.'
