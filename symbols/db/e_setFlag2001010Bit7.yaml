name: e_setFlag2001010Bit7
address: '0x08003AD4'
kind: function
status: probable
summary: Sets bit 0x80 on the status byte at eStruct2001010, but only if that byte is currently nonzero
interface: (no args) -> r0 = flag byte value; flags from tst/loret, no meaningful return
details: 'Loads the byte at eStruct2001010; if it is zero the function returns without touching it. Otherwise
  it ORs in 0x80 and stores the byte back, leaving all other bits unchanged. r4-r7 are pushed but unused.
  The conditional (skip when zero) is a quirk: the flag bit is only raised when some other part of the
  byte is already set. The meaning of eStruct2001010 and of bit 0x80 is not determinable from this function
  alone.'
