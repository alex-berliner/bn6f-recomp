name: sub_810DB20
address: '0x0810DB20'
kind: function
status: confirmed
summary: AI helper that picks the next valid panel one step closer to its target along the Y axis (preferred) or
  X axis, validated via object_checkPanelParameters.
interface: 'void aiStepPanelTowardTarget_810DB20(u32 /*r5*/ battle_obj, u32 /*r6*/ ai_state); // out: r0 = candidate
  panel X (0 if none valid), r1 = candidate panel Y; clobbers r2, r3, lr; flags NZCV clobbered'
details: "Reads battle_obj->PanelY (r5+oBattleObject_PanelY) and ai_state->Unk_05 (r6+oAIState_Unk_05).\n  If they\
  \ differ, nudges PanelY by ±1 toward Unk_05, reads PanelX from the object,\n  calls GetAllianceDependentPanelParamArgs\
  \ with table byte_810DBF0 (via off_810DCF4),\n  then object_checkPanelParameters(x, y, r2, r3). If it returns\
  \ non-zero, returns\n  (x, y) immediately (Y axis path wins).\nFalls through to X axis: compares PanelX (r5+oBattleObject_PanelX)\
  \ with ai_state->Unk_04\n  (r6+oAIState_Unk_04). If equal, returns (0, Unk_04) — note the C verifies r0 = 0,\n\
  \  r1 = ai_state Unk_04 (target X is loaded into r1 in this branch only when equal).\n  If not equal, nudges PanelX\
  \ by ±1 toward Unk_04, calls the same\n  GetAllianceDependentPanelParamArgs (off_810DCF8 also points to byte_810DBF0)\
  \ with\n  (newX, PanelY, r2, r3) into object_checkPanelParameters. If non-zero, returns\n  (newX, PanelY); otherwise\
  \ returns (0, PanelY).\nBoth axis helpers share the same lookup table byte_810DBF0 (passed via r3 through\nGetAllianceDependentPanelParamArgs,\
  \ which produces the panel-attribute args r2/r3 for\nobject_checkPanelParameters). Used by an NPC/object AI driver\
  \ (probably a moving enemy\nor allied chip) to decide its next panel position when stepping toward a stored target.\n\
  Quirks: the \"no Y step valid\" fallthrough reuses the same r3 table pointer, and the\nX-equal branch's return\
  \ value {0, target_x} is somewhat unusual (r1 is loaded with\nUnk_04 rather than PanelY). The presaved r4/r5/r6/r7\
  \ across the BL calls is the\nreason for the push/pop sets around them.\n"
