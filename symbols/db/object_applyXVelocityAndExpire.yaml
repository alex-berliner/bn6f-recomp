name: object_applyXVelocityAndExpire
address: '0x080D5BCC'
kind: function
status: probable
summary: 'Per-frame movement step for a battle object: slides it along X by its X velocity, and when its
  timer runs out clears its collision region and destroys it.'
interface: (r5 = battle object) -> void; destroys object (state=CUR_STATE_DESTROY) when Timer hits 0
details: Adds oBattleObject_XVelocity to oBattleObject_X each call, then recomputes PanelX/PanelY via
  object_setPanelsFromCoordinates and syncs collision panels/facing via object_updateCollisionPanels.
  It then decrements oBattleObject_Timer. While the timer is still positive, if the object's PanelX changed
  since entry it writes collision region 1 via object_setCollisionRegion (marking the new panel column
  as occupied). Once the timer reaches 0 it clears the collision region and sets the state word to CUR_STATE_DESTROY.
  This matches a projectile or sliding attack that travels across panels for a fixed duration.
