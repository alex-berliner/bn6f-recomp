name: sprite_getMosaicScalingParameters
address: '0x08002CE0'
kind: function
status: confirmed
summary: Reads the mosaic/scaling parameters for an object's attached sprite, returning the flag bits for that sprite
  and the current global scaling parameter from the toolkit.
interface: u8 sprite_getMosaicScalingParameters(ObjectHeader* obj /*r0*/, Toolkit* toolkit /*r10*/, u8* flagsOut
  /*r2*/); returns r0 = toolkit->Unk2009740_Ptr[2], sets r2 = objSprite->Unk_11 & 0x0C; clobbers r1, r3 and flags
details: 'Takes an object header in r0 and the toolkit pointer in r10. The high nibble of oObjectHeader_TypeAndSpriteOffset
  holds the sprite offset in 16-byte units, so it is masked (lsr/lsl by 4) and added to the header pointer to locate
  the object''s sprite struct. From that sprite''s oObjectSprite_Unk_11 byte it extracts bits 2-3 (mask 0x0C), which
  encode the mosaic/scaling mode for the sprite, and returns them in r2. It then follows the toolkit''s oToolkit_Unk2009740_Ptr
  and returns byte 2 of that structure in r0, which appears to be a global mosaic/ scaling parameter applied alongside
  the per-sprite flags. Only r0 and r2 carry results; r1/r3 and the condition flags are scratch. r10 is a required
  input, so callers must have the toolkit pointer loaded there before calling.

  '
