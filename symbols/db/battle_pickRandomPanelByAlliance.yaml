name: battle_pickRandomPanelByAlliance
address: '0x08112562'
kind: function
status: confirmed
summary: Picks a random battle panel for a battle object, with the search window/parameters chosen according to
  the object's current alliance.
interface: void battle_pickRandomPanelByAlliance(u32 flagCheckContext /* r4 */, BattleObject* obj /* r5 */); results
  are whatever panelFlagCheck_8015D80 leaves in r0/r1 (plus r5 passthrough)
details: 'Thin adapter over two calls. Snapshots the object''s panel coordinates from obj->PanelX and obj->PanelY
  (oBattleObject_PanelX/Y, byte fields) into r0/r1 up front, so the downstream flag check sees this snapshot even
  if the helper rewrites those fields. Loads r3 with the pointer to the alliance-dependent parameter table byte_81125E0
  (from off_81126D0) and calls GetAllianceDependentPanelParamArgs with (r3 = table, r5 = battle object); that helper
  consumes the table plus the object and returns in r2/r3 the two arguments the panel flag check needs (apparently
  the random-panel search window bounds/params, e.g. the table bytes 0x10, 0xA0, 0x0F88, 0x30, 0x80, 0x0F88 look
  like panel-coordinate/bounds pairs). It then tail-calls panelFlagCheck_8015D80 with r0 = panelX, r1 = panelY,
  r2/r3 = helper results, r4 = caller-provided context word passed through untouched, and r5 = battle object. Everything
  callers observe on exit (r0, r1, r5, and the r7 value) is simply whatever panelFlagCheck_8015D80 leaves behind;
  this function itself writes nothing. Flags nz/c/v are clobbered via the calls. The trailing .word/.byte padding
  and the dead data blobs (off_8112580, off_8112598 with their byte tables, byte_81125F0) are unrelated data laid
  out after the function body, not touched by this routine.

  '
