name: battle_pickRandomPanelByAlliance
address: '0x08112562'
kind: function
status: probable
summary: Picks a random panel near a battle object's position using an alliance-dependent candidate list,
  filtering by a panel flag.
interface: (r5 = battle object) -> r0/r1 = chosen panel coords (via tail-call); r0 = object PanelX, r1
  = PanelY, r3 = table byte_81125E0 on entry to callee
details: 'Reads the battle object''s PanelX and PanelY and calls GetAllianceDependentPanelParamArgs with
  the two-entry (8-byte each) table byte_81125E0; entry 0 carries param word 0x10, entry 1 param 0x30,
  each with an args pointer, so the entry chosen depends on the object''s team. The returned param and
  args pointer are forwarded unchanged (no register setup between the bl''s) to panelFlagCheck_8015D80,
  the filtered random relative-panel picker, whose relative offsets get transformed by the object''s facing.
  The trailing data blobs (off_8112584/off_811259C lists like {0,-1,0,1,0x7F}) are relative-offset candidate
  lists in the same style, most likely consumed by the sibling caller sub_811252C. Net effect: select
  a random panel around the object, with different parameters/candidates for player-side vs enemy-side
  objects, typical of AI attack-panel selection.'
