name: sub_801DDD8
address: '0x0801DDD8'
kind: function
status: hypothesis
summary: Small wrapper that issues one fixed chatbox/window setup call with hardcoded dimensions (6, 0, 3, 0, 18,
  2) and then a follow-up animate/wait call (0x10, 4).
interface: void sub_801DDD8(void); // caller's r4/r5 are used as scratch and restored; returns whatever r0-r3 and
  NZCV the second callee leaves
details: 'No parameters of its own: the function just pushes r4/r5/lr, overwrites r4 and r5 with call arguments
  (so the caller''s values there are dead), and makes two calls. First call_sub_3005EBA(6, 0, 3, 0, 0x12, 2) — the
  argument shape (six small ints, 0x12 = 18) looks like a textbox/window descriptor such as font or box id, x, y,
  width in characters, and a mode/count. Second call is sub_801BEC2 with r0 = 0x10 (built as 1 << 4) and r1 = 4;
  note r2 and r3 are deliberately NOT reloaded, so sub_801BEC2 sees whatever call_sub_3005EBA left in them, and
  the LSL that builds r0 sets N/Z/C (C = 0, from the bit shifted out of 1) which are also carried into the call.
  Returns with r0-r3 and flags from sub_801BEC2, r4/r5 restored via pop. Without knowing call_sub_3005EBA''s exact
  meaning this is a guess; the fixed argument list suggests it is a one-off scripted window open for one specific
  dialog/screen rather than a general helper.

  '
