name: pet_addCurNaviHPCapped
address: '0x0803CF74'
kind: function
status: probable
summary: Adds an amount to the current PET navi's HP stat (0x40), clamping it at the navi's max (stat
  0x42).
interface: (r0 = navi slot index, r1 = amount to add) -> r0 = undefined (destroyed); no meaningful flags.
details: 'Saves r0 in r4 and r1 in r7, gets the currently selected PET navi, and calls reloadCurNaviStatBoosts_813c3ac
  first so boosts/max are fresh. It then reads the u16 stat field 0x40 for that navi via GetCurPETNaviStatsHword,
  adds r7 to it, and writes the sum back with SetCurPETNaviStatsHword. Afterwards it reads stat 0x42 (apparently
  the cap/max for field 0x40) and, if the new value exceeds it, rewrites stat 0x40 back down to 0x42,
  leaving stat 0x42 untouched. Stat 0x40 is HP: the callee reloadCurNaviStatBoosts_813c3ac is described
  as healing/clamping the current navi''s HP to MaxHP. The caller pet_addCurNaviStat0x3ECapped_803CF3C
  performs the same read/add/cap-1000/write pattern on stat 0x3E and then calls this routine with the
  same arguments, so 0x3E and 0x40 are updated in tandem (0x3E likely a parallel boost/half value).'
