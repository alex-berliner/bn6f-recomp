name: t3_0xb_80C60A8
address: '0x080C60A8'
kind: function
status: confirmed
summary: Per-frame dispatcher for a battle "train arrow" object - runs the current state's handler from a 3-entry
  table, then updates the object's sprite.
interface: void battle_trainArrow_stateDispatch_80C60A8(u32 r5 /*battle object*/); callers also pass r4, r7, r8,
  r10, lr; out r5, r8, r9, r10, r11, r12, nz c v clobbered
details: 'Task-3 battle object tick routine. Loads the object''s current state byte from [r5 + oBattleObject_CurState]
  and uses it to index the handler table at off_80C60C0: state 0 -> battleObject_initTrainArrowVariant_80C60CC (setup/initialization),
  state 1 -> trainArrow_80C619C (the arrow''s main per-frame behavior), state >=2 -> object_genericDestroy (kill
  the object). The handler is entered with lr via "mov lr, pc; bx r1", receiving r0 = current state, r1 = handler
  address, and r5 = object pointer; handlers are expected to return into this routine via LR. After the handler
  returns, it calls object_updateSprite(r5) to refresh the object''s sprite, then returns. The routine itself touches
  no other fields; all real work happens in the state handlers. r8-r12 pass through untouched (outputs are just
  the values the callee/ callers leave behind).

  '
