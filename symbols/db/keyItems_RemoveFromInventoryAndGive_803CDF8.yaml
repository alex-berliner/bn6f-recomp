name: keyItems_RemoveFromInventoryAndGive_803CDF8
address: '0x0803CDF8'
kind: function
status: confirmed
summary: Clears the given key item slot in the player's key item inventory and then calls GiveItem to hand the item
  over.
interface: void sub_803CDF8(u32 keyItemSlot /* r0 */, u32 giveItemArg /* r1, passed through to GiveItem */)
details: Loads the key item inventory pointer from the toolkit (r10 + oToolkit_KeyItemsPtr), stores 0 into the byte
  at keyItems[r0] so the player no longer owns that key item, then tail-calls GiveItem with r0 (slot index) and
  r1 unchanged; r2 is reloaded as the key items pointer and r3 is 0 when GiveItem is entered. r4-r7 are preserved;
  r0-r3 on return are whatever GiveItem left. Likely the "hand a key item to an NPC / give it away" path, where
  the item must first be removed from the player's inventory.
