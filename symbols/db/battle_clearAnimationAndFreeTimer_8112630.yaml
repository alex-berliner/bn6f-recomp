name: battle_clearAnimationAndFreeTimer_8112630
address: '0x08112630'
kind: function
status: confirmed
summary: Clears a battle object's current animation id and, if it holds an extra timer slot, resets that timer and
  releases the slot.
interface: void battle_clearAnimationAndFreeTimer_8112630(BattleObject* object /* r5 */)
details: 'Takes the battle object in r5. First it stores 0 into the object''s current animation

  byte at oBattleObject_CurAnim, ending whatever animation the object was playing.

  Then it reads the pointer/handle stored at oBattleObject_ExtraVars+0x10; if non-zero,

  it calls battle_ResetObjectTimerTo8_80C4072 with that value (resetting the associated

  timer to 8) and stores 0 back into oBattleObject_ExtraVars+0x10, releasing the slot.

  If the slot was already empty, the call is skipped. r4 is preserved; flags and

  r0/r1/lr are clobbered. No meaningful return value.

  '
