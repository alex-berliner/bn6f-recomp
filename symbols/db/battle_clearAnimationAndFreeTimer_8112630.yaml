name: battle_clearAnimationAndFreeTimer_8112630
address: '0x08112630'
kind: function
previous_names:
- sub_8112630
status: probable
summary: Clears a battle object's current animation and frees/disarms its extra-vars timer slot.
interface: (r5 = BattleObject*) -> void ; clobbers r0, r1, flags
details: "Pushes {r4, lr} (note: r4 is preserved but not actually used inside), zeroes the object's\n\
  \  CurAnim field at +0x10 (BattleObject.CurAnim, 1 byte), then if the +0x10 slot of the\n  ExtraVars\
  \ region (i.e. ExtraVars[0x10]) is non-null it is passed to\n  battle_ResetObjectTimerTo8_80C4072 and\
  \ then nulled. The function then returns. The\n  constant 0x10 used to read/write the ExtraVars+0x10\
  \ field does not coincide with any named\n  field in BattleObject.inc; it is treated as an opaque timer/handle\
  \ pointer slot inside\n  the per-object ExtraVars region. Caller (sub_81122A0) preserves r5/r4/r6/r7/r10\
  \ across the\n  call, matching the contract.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `strb r0, [r5,#oBattleObject_CurAnim]` (0x10) zeroes the current animation index. - `ldr
    r0, [r5,#oBattleObject_ExtraVars+0x10]` loads a u32 handle; `cmp r0,#0` skips when null. - `bl battle_ResetObjectTimerTo8_80C4072`
    is the only callee and is described as resetting an object wait/timer field; `str r0, [r5,#oBattleObject_ExtraVars+0x10]`
    then clears the slot. - Contract `out` list contains only r4 (callee-saved), so the function returns
    void. - Sole caller sub_81122A0 treats it as a teardown/reset step taken while the object is being
    recycled (its caller context suggests object destroy/finish).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08112630

    '
  result: the body read as described above
