name: get_groundmanMinigameMapId
address: '0x08143C18'
kind: function
status: probable
summary: Returns a map ID (0xD32 or 0xD33) looked up from the current Groundman minigame map index.
interface: () -> r0 = halfword map ID from table dword_8143C2C indexed by GetGroundmanMinigameMapIndex;
  flags from ldrh
details: Calls GetGroundmanMinigameMapIndex to get the current minigame map/sub-area index, doubles it,
  and reads a halfword from the two-entry table dword_8143C2C ({0x0D32, 0x0D33}), returning it in r0.
  Map index 0 yields 0xD32, any other index yields 0xD33, so the table maps each minigame sub-area to
  a location/map number. r4-r7 are pushed but unused (likely ABI padding). The values 0xD32/0xD33 match
  the range of other map-ID constants in the game, suggesting the unnamed callers use this result as a
  warp/travel destination.
