open_questions:
- Exact meaning of sprite bytes 0x16 and 0x17 (facing vs. animation direction fields) is unconfirmed
- The role of the r1 = 1 argument to sprite_setFlip is unknown
- Caller sub_80E8FB0 is undocumented, so the game context triggering this flip update is unclear
