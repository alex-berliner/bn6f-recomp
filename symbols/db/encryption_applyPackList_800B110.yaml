name: encryption_applyPackList_800B110
address: '0x0800B110'
kind: function
status: confirmed
summary: Re-applies a fixed list of encryption packs (IDs 0x195-0x19A) by walking a 0-terminated halfword table
  and calling encryption_applyPack_8006e70 on each.
interface: void sub_800B110(void); // no meaningful inputs; all caller registers r1-r7 are preserved, only r0/r12(lr)
  and flags are clobbered
details: 'Iterates over the halfword table at word_800B128, which contains pack IDs 0x195, 0x196, 0x197, 0x198,
  0x199, 0x19A followed by a 0x0000 terminator. For each non-zero entry it passes the ID in r0 to encryption_applyPack_8006e70,
  which presumably re-keys/decodes some encrypted data region for that pack. The table cursor is kept in r4 across
  the call (r4 is pushed/popped). No other state is read or written by this routine itself; neighboring data (off_800B138
  -> byte_20349C0, dword_800B13C = 0x4000, dword_800B140 = 0x1555) is unrelated data used elsewhere. The hardcoded
  list suggests this refreshes a standard set of encrypted pack slots at a fixed point (likely on boot or after
  loading save data).

  '
