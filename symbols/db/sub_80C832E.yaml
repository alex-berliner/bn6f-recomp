name: sub_80C832E
address: '0x080C832E'
kind: function
status: confirmed
summary: Walks up to N panels in a battle object's facing direction from its own panel, populating a per-distance
  target list (obj+0x60) for each in-bounds panel found.
interface: void sub_80C832E(u32 r0_panelCount, u32 r3_unused, oBattleObject* r5_obj); clobbers r0-r2, lr, N Z C
  V; preserves r4, r5 (re-read), r6, r7; r0, r1, r2, r3, r5 out values are scratch/unchanged respectively per contract
details: 'For distance = 1..r0_panelCount, computes (panelX, panelY) = obj''s own

  panel + (frontDirection * distance) using object_getFrontDirection and the

  byte fields at oBattleObject_PanelX / oBattleObject_PanelY. Calls

  object_isValidPanel; if the panel is off-field the walk stops. Otherwise

  records the panel in the target list at obj + 0x60 + (distance-1)*4 via

  sub_80E1B1E (r0=x, r1=y, r2=(distance-1)*4, r7=obj+0x60+slot). r3 input

  is unused. r4 and r6 are live across the inner call and must be

  preserved/restored as the original does. The target list offset

  (0x60) is per oBattleObject_TargetList.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
