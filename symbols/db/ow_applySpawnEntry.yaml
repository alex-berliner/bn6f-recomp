name: ow_applySpawnEntry
address: '0x08099D44'
kind: function
status: confirmed
summary: Applies one scripted transition/teleport entry from the spawn table to the overworld player and camera
  state.
interface: ow_applySpawnEntry(r5 /* OWState* */) -> r0=0; clobbers r1, r2, r3, c, v; preserves r4-r7, r10, lr
details: "Indexes a 20-byte entry in the spawn table at byte_809929C using the script-step byte at OWState+4.  If\
  \ the entry's field-0 (u32) is non-zero it is written to OWState+0x30 (next-script / destination pointer).  Entry\
  \ byte at +4 is copied to OWState+5 (a sub-state flag).  When entry byte at +7 is non-zero (the \"teleport/camera\"\
  \ flag), the function additionally: (1) sets the player facing direction from entry+5 via SetOWPlayerFacingDirection;\
  \ (2) reads three signed 16-bit fields at entry+8/+A/+C (player X/Y/Z in Q16\n    fixed-point, formed by shifting\
  \ left 16) and moves the overworld player;\n(3) writes the player-Y value into camera field at offset 0x14; (4)\
  \ reads three signed 16-bit fields at entry+E/+10/+12 (camera X/Y/Z, also\n    Q16) and calls SetCameraXYZ;\n\
  (5) clears event flag EVENT_EVENT_CUR_DIR_LOCKED (0x17) so the player can\n    move freely after the scripted\
  \ arrival.\nThe function always returns 0 in r0.\n"
