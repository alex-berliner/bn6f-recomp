name: ow_applySpawnEntry
address: '0x08099D44'
kind: function
status: probable
summary: 'Applies a location/spawn entry from a 20-byte-per-entry table: restores a saved word, sets the
  overworld player''s facing and coordinates, and positions the camera.'
interface: (r5 = state struct, entry id in [r5+4]) -> r0 = 0; r7 = table entry base
details: Indexes the table at byte_809929C by [r5,#4]*0x14 (20-byte entries). If the entry's word at +0
  is nonzero it is copied into [r5,#0x30], and the byte at +4 is stored to [r5,#5]. If the enable byte
  at +7 is nonzero, it sets the player's facing from entry byte +5, writes the player's x/y/z from signed
  halfwords at +8/+0xA/+0xC, writes camera byte 0 via camera_writeUnk03_14_80301b2, sets the camera XYZ
  from halfwords at +0xE/+0x10/+0x12, and clears EVENT_EVENT_CUR_DIR_LOCKED so the new facing sticks.
  Always returns 0. r5 is used without being set, so the caller must supply it in r5; entry +0 likely
  restores a prior field and entry +4 a related state byte.
