name: sprite_setPositionByFlags_811A5BC
address: '0x0811A5BC'
kind: function
status: confirmed
summary: 'Battle: pick a sprite-coordinate pair from one of three tables based on two flag bytes and apply
  it via sprite_setCoordinates.'
interface: void sub_811A5BC(const u8* r5); /* r5 -> object-array entry; flags at +4/+7, table index at
  +6 */
details: "R5 points into a per-frame object array. Byte offsets are interpreted as:\n  [R5+4] : primary\
  \ flag (0 = use base table dword_811A5FC; non-zero = branch on inner flag)\n  [R5+7] : inner flag (only\
  \ inspected when [R5+4] != 0; 0 = use table byte_811A5EC, non-zero = use table byte_811A600)\n  [R5+6]\
  \ : index into the chosen table; multiplied by 4 to step over signed halfword pairs (x, y)\nThe three\
  \ tables store six (x,y) pairs each as int16. dword_811A5FC embeds the same coords as\nint32 literal\
  \ 0x16002C (single x halfword 0x0016 / y halfword 0x002C). byte_811A5EC holds the\n\"normal\" on-screen\
  \ offsets (e.g. 0x3C,0x26 ... 0x3C,0x5F). byte_811A600 is the off-screen /\n\"hidden\" variant with\
  \ negative x (0xFFD0) at indices 0,2,4,6 and the same y values as byte_811A5EC.\nThe selected (x, y)\
  \ are pushed as R0/R1 into sprite_setCoordinates. clobbers nz,c,v,r0-r3,lr.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
