name: battle_applyEnemyChipDeduction
address: '0x0800EE98'
kind: function
status: probable
summary: After spawning the chip-use effect (with sound 0x8D when applicable), look up the chip's data,
  optionally skip on bit 0x80 of +0x16, then subtract an element-indexed halfword value from the actor's
  +0x28 counter, clamping to 0.
interface: '(r5 = battle object ptr (Alliance read), r6 = user/attack record: chip ID at +0x34, counter
  at +0x28) -> r0 clobbered; writes halfword table value to word_200F3C4-indexed scratch and clamps [r6,#0x28]
  down by it; no meaningful return.'
details: It first reads the user's Alliance from r5 and the chip ID from r6+0x34, calls sub_802E830(alliance,
  chipId) (likely spawning the chip-use graphic), and if battle_networkInvert(alliance) returns 0 it runs
  sub_801E2BA on the result and plays sound effect 0x8D. It then fetches the chip's ChipData via getChip8021DA8;
  if ChipData+0x16 has bit 0x80 set the whole cost step is skipped. Otherwise it doubles ChipData.elemIdx
  (+0x7) to index the halfword table byte_800EEF8 {0, 0x15, 0x2A, 0x40, -1}, stores that value into the
  word_200F3C4 scratch array at offset 2*r6, and subtracts it from the halfword counter at r6+0x28, clamping
  to 0 if it would go negative. The element-scaled values look like a per-element cost, and the 0x80 flag
  on the chip record acts as a 'no cost / no deduction' gate.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r6,#0x34] then bl getChip8021DA8 — the record's field +0x34 is a chip ID looked up
    in the chip database; ldrb r0,[r4,#0x7]; add r0,r0,r0; ldrh r0,[r1,r0] over byte_800EEF8 = {0,21,42,64,-1}
    — value selected by ChipData.elemIdx; strh r0,[word_200F3C4 + 2*r6]; ldrh r1,[r6,#0x28]; sub/clamp
    to 0; strh back — the looked-up value is deducted from a halfword counter; ldrb r0,[r4,#0x16]; tst
    0x80; bne return — a chip-data flag skips the deduction path entirely; bl battle_networkInvert(r5.Alliance);
    tst; then PlaySoundEffect(0x8D) — the effect/sound side only fires for one alliance state
  refs:
  - bn6f/asm/asm00_2.s:172
  - 0x0800EE26 battle_getEnemyChipAttackParams
  - 0x080005CC PlaySoundEffect
  - 0x0800A9EC battle_networkInvert
  - 0x08021AA4 getChip8021DA8
  reproduce: python3 tools/asmcat.py 0x0800EE98
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The assembly matches the described logic: it reads alliance/chipID, calls sub_802E830, conditionally
    calls sub_801E2BA and plays sound 0x8D, reads ChipData via getChip8021DA8, skips deduction if ChipData+0x16
    has bit 0x80, and otherwise indexes byte_800EEF8 by 2*elemIdx into word_200F3C4 and subtracts from
    r6+0x28 clamped to 0. However, the summary''s claim about ''per-element cost'' is an interpretation;
    the byte_800EEF8 values {0,0x15,0x2A,0x40,-1} are more likely a damage/count scale rather than a chip
    cost, and this is called from battle_getEnemyChipAttackParams, suggesting it''s processing enemy attack
    parameters rather than a generic chip-use. The name ''battle_processEnemyChipUse'' overstates generality;
    a more neutral one is better.; run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
