name: battleObject_aiSetupCombatInit_81122A0
address: '0x081122A0'
kind: function
status: confirmed
summary: 'Initializes a NetBattler''s AI combat phase: selects a handler, places it on a panel (or uses a fallback),
  configures the first attack (ID 9) with target/duration, and sets the AI script.'
interface: 'void battleObject_aiCombatInit_81122A0(/*r4=*/AIData *ai_data, /*r5=*/BattleObject **inout_battle_obj,
  /*r6=*/AIState *ai_state, /*r7=*/AIAttackVars *attack_vars) /* out: r1, r5 updated */'
details: "Reads object flags (0xA000 mask) to branch three ways:\n\n1. Flag 0xA000 set – fixed pre-configured attack\
  \ path: installs handler byte_811223C,\n   turn counter 1, step timer 0x3C, attack ID 9, script ID 4, copies panel\
  \ X/Y into\n   BattleObject_ExtraVars, resets AIState_Timer to 0.\n\n2. battle_randFilteredPanelXY fails (r0 !=\
  \ 0) – no valid panel: installs handler\n   byte_8112224, turn counter 4, calls battle_ensureAuxObject54 to create\
  \ the aux\n   object, indexes a per-version step-timer table (byte_8112260[AIData_Version_16]),\n   then applies\
  \ the same shared attack setup (ID 9, script 4, panel coords copy).\n\n3. Panel found – main combat-init path:\
  \ clears animation/timer, then calls\n   battle_getFrontPanelFlagsByAlliance_81124D4. If zero, immediately configures\
  \ a\n   random-panel attack (duration 0x12, callback battle_randFilteredPanelXY+1,\n   ai_beginAttackB). If nonzero,\
  \ increments AIState_Timer each call; once it reaches\n   0x3C it checks FindBattleActorsWithNonzeroParam_ReturnCountAndSum\
  \ for rows 0x6C,\n   0x79, 0x7E (alliance-clear condition). When the area is clear it targets the\n   closest\
  \ enemy of the opposite alliance, sets attack duration 5, callback\n   ai_pickFilteredPanelOrRandom+1, calls ai_beginAttackB,\
  \ and sets script ID 8.\n\nShared tail (paths 1 and 2): writes oAIAttackVars_StepTimer, calls object_setAttack0\n\
  with attack ID 9, sets oAIState_ScriptId = 4, stores PanelX/PanelY into\noBattleObject_ExtraVars and +4, resets\
  \ oAIState_Timer to 0.\n\nThe function may change r5 (battle object pointer) after ensureAuxObject54 or the\n\
  randFilteredPanelXY call reassigns the register.\n"
