open_questions:
- What do handler byte_811223C and byte_8112224 do (the oAIState_Unk_0c pointers)?
- What is AuxObject54 and why is it created in the no-panel fallback path?
- What do panel rows/columns 0x6C, 0x79, 0x7E represent in FindBattleActorsWithNonzeroParam?
- Why does the flagged path use step timer 0x3C and script 4 while the no-panel path uses a version-indexed timer
  and the same script 4?
- What is the semantic meaning of oBattleObject_ExtraVars+0xC being set to 1 in the timed-attack branch?
