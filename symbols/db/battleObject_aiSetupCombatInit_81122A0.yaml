open_questions:
- the exact identity of the per-version table byte_8112260 (chip/code script?) and the meaning of byte_8112224/byte_811223C
  (the script blobs) - these would settle whether the "engage" branch is a real "strike now" path vs.
  a "wait/approach" path.
- 'the meaning of sub_81123EC/sub_81124D4/sub_8112630/sub_8112648/sub_8112666: their contracts say "in
  r5,lr out r0" so they almost certainly consult the same battle object in r5; the names "engageable",
  "tickTimer", "setupCombat", "notifyAction" are inferred from how this function uses their return values.'
