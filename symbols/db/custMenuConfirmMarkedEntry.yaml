name: custMenuConfirmMarkedEntry
address: '0x08028DBC'
kind: function
status: probable
summary: 'Custom Screen action handler: flags the currently indexed 0x20-byte entry as chosen (byte+8
  = 1), sets a global confirm flag, then runs the OK-confirm path.'
interface: () -> r0 = 0; no meaningful flags; sets entry[+8] = 1 and byte_20349A4 = 1 as side effects
details: It reads the byte at offset 0x0d of the battle state (via battle_getStateByte0d_800A7E2) and
  passes it as the index to getTableEntryPtr32_802D064, which returns one 0x20-byte entry of the IWRAM
  array at byte_203C4A0 — plausibly the folder/chip entry selected on the Custom Screen. It stores 1 into
  that entry's byte at offset +8 (a 'used/confirmed' style flag), then stores 1 into byte_20349A4 of the
  dword_20349A0 custom-menu struct. Finally it calls custMenuPressOK_8028D3A, which runs the chosen action
  handler, switches state, and plays the select sound. The function always returns 0 and takes no arguments.
  No callers are known, but the call structure matches the other Custom Screen button/action handlers
  around it.
