    byte; ldr r0,off_8028F80; strb r1,[r0,#0x4]: sets byte_20349A4 flag in the dword_20349A0 menu struct;
    bl custMenuPressOK_8028D3A: known callee performs OK-confirm action, state switch and select sound;
