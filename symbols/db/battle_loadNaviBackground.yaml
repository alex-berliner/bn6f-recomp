name: battle_loadNaviBackground
address: '0x08137ACC'
kind: function
status: probable
summary: 'Loads a per-navi background scene: resolves an asset list by key (likely navi ID), decompresses
  tiles/palettes into VRAM, loads the navi tile grid, and draws a full 30x20 tile block to background
  block 1.'
interface: () -> void; no arguments, no meaningful return, clobbers r0-r5 and flags via callees
details: 'The function builds an asset-loading table at unk_20096E0 by iterating off_8137B6C in 4-word
  strides (r7 to 0x30): the first two words of each entry are resolved through getKeyedTableEntry_811FB84
  (keyed lists indexed by toolkit S2001c04 byte 6, evidently a navi/variant selector) and the next two
  are copied verbatim, producing a NULL-terminated entry list. That list is fed to decompAndCopyData,
  which decompresses assets into palette_3001960, unk_3001A40 and unk_3001A60. A second hardcoded list
  (off_8137BA4) decompresses more assets to VRAM 0x6000020 and 0x6004000 (0x2800 bytes, a full tilemap)
  plus comp_86D8E94. battle_loadTileGridByNavi_8123300 then picks the per-PET-navi tile grid from the
  13-entry table at off_8137B2C (mostly dword_86D9068, one CompText86D8FA4) into eTextScript201BF00/eDecompBuffer2013A00.
  Finally CopyBackgroundTiles copies a 30x20 tile-id block from eTextScript201BA00 into BG tile block
  1 at (0,0), covering the whole screen. The navi-keyed lookups plus the per-navi tile grid indicate the
  background artwork changes with the selected navi.'
