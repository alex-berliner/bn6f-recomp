name: battle_getPrepStatus_80299B6
address: '0x080299B6'
kind: function
status: confirmed
summary: Inspects a battle object's prep-state/mode/slot fields and returns a preparation-status code
  (0/8/9/0xD) for the navi-cust battle flow.
interface: u8 battle_getPrepStatus_80299B6(void *obj /* r5 */);  // returns status in r0, leaves r3 =
  0x48 or 0x49 (or untouched on early exit)
details: "Reads three bytes from the r5-pointed battle-object-like struct:\n  - obj[7] : state (must be\
  \ 0xA, otherwise returns 0)\n  - obj[8] : mode (0, 1, or >=2)\n  - obj[0x48], obj[0x49] : two slot/choice\
  \ bytes, only read when mode >= 1\nDecision table (state must be 0xA):\n  mode == 0                \
  \       -> 8\n  mode == 1,  obj[0x48] != 0      -> 8\n  mode == 1,  obj[0x48] == 0      -> 0xD\n  mode\
  \ >= 2, (0, 1)               -> 0\n  mode >= 2, (1, 0)               -> 9\n  mode >= 2, otherwise  \
  \          -> 8\nSide effect: r3 is left as 0x48 after the mode-1 branch, 0x49 after the mode>=2 branch,\n\
  and is preserved from input on the early-exit (state != 0xA or mode == 0) paths.\nSets NZ flags from\
  \ the returned status byte. The 0xD/9/0/8 codes are the same shape\nused elsewhere as battlePrep / selection\
  \ phase codes in BN6.\n"
