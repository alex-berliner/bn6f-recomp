name: sub_81264F4
address: '0x081264F4'
kind: function
status: hypothesis
summary: Parameterless wrapper that tail-calls sub_8126570 with a fixed set of screen coordinates, sizes, and table
  pointers, apparently to draw or update one fixed on-screen element.
interface: void sub_81264F4(void); // called with r5 and r10 already holding caller state; forwards both untouched
  to sub_8126570; returns callee's r2/r3 results
details: 'Sets up a constant argument set and calls sub_8126570: r0=0x5A (90), r1=0x20 (32), r2=0x14 (20), r3=0x0C
  (12) - plausibly an x/y position (90,32) and width/height (20,12) or two coordinate/size pairs for a screen-space
  rectangle. Also passes r4=byte_8124A84 (a data table), r6=0x40000000 (an I/O-register-mirror value or base, e.g.
  a hardware register address/flag in the 0x04000000 region), and r7=dword_8124A94 (a second table). r5 and r10
  are forwarded untouched from the caller, so this routine only makes sense in a context where those registers already
  carry state into sub_8126570. It pushes r4-r7, overwrites them for the call, then pops them before returning,
  so r4-r7 are preserved from the caller''s perspective; only the callee''s results in r2/r3 escape. The fixed constant
  arguments (small rect-like numbers) suggest a specific hardcoded UI element - window, menu frame, HUD piece, or
  text region - rather than a general routine. No other callers'' context is visible, so the exact game meaning
  of the tables at byte_8124A84 and dword_8124A94 and of the 0x40000000 value is unresolved.

  '
