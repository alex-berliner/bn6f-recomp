name: crow_decrementCounter
address: '0x08143470'
kind: function
status: probable
summary: Decrements a saturating counter in the crow/bird system struct (eStruct2001010+0xC), clamping
  at zero and returning the new value.
interface: () -> r0 = new counter value (old value - 1, min 0); flags set from final value (Z if zero,
  N if negative before clamp)
details: Loads the pointer to eStruct2001010 and decrements the dword at offset 0xC (dword_200101C), clamping
  the result to 0 if it would go negative, then stores it back. The result is tested (tst r0, r0) so Z/N
  flags reflect the stored value before returning. The sole known caller manages spawning crows into the
  first free slot of byte_2000D20 (max 6 active), suggesting this counter tracks a crow-related countdown,
  such as active count or a timer. No other fields are touched and r4-r7 are preserved unused, implying
  a minimal helper inlined-style decrement.
