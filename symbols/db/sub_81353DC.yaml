summary: Zero-argument wrapper that invokes sub_81348DC with one fixed parameter set (0x24, 0xA5, 0x28, 4, 6) and
  returns its r2/r3 results.
interface: void sub_81353DC(void); // passes fixed r0=0x24, r1=0xA5, r2=0x28, r3=4, r4=6 into sub_81348DC; returns
  callee's r2/r3 to caller, preserves r4-r7
details: 'Tiny thumb stub: pushes {r4,lr}, loads five constants into r0-r4 (r0=0x24, r1=0xA5, r2=0x28, r3=0x4, r4=0x6),
  tail-calls sub_81348DC via bl, then pops {r4,pc} so the caller''s r4 is preserved even though the callee may clobber
  it. Nothing else is read or written by the stub itself; whatever sub_81348DC does with these arguments (likely
  a sprite/textbox/battle setup call whose meaning is defined at sub_81348DC) determines the game behavior. Two
  padding zero bytes follow the function. No game-level meaning can be assigned until sub_81348DC is identified,
  so this stays under its address name.

  '
