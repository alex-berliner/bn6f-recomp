name: battle_objHitStateUpdate
address: '0x080DDE82'
kind: function
status: probable
summary: 'Per-frame update for a battle object''s hit/damaged state: tears down its collision data, spawns
  the hit effect, and either moves the object to CUR_STATE_DESTROY (if the battle is over or its RelatedObject1''s
  CurAction != 9) or, after checking alliance-specific collision flags and optionally clearing the collision
  region / setting CurAction=8, dispatches via the 3-entry handler table (or calls object_presentCollisionData
  during time-stop).'
interface: (r5 = battle object) -> void; sets oBattleObject_CurState/CurAction/CurPhase, may clear collision
  region
details: 'Runs each frame for an object in this state: it tears down the object''s collision data and
  spawns the hit-effect object at its position (with jitter). If the battle is over, or the object''s
  RelatedObject1Ptr has CurAction 9, it clears its collision region and moves to CUR_STATE_DESTROY (removal).
  Otherwise it tests the collision flags from the current collision against a per-alliance mask table
  (byte_80DDEEC, indexed by Alliance<<2); on a match it clears the collision region and sets CurAction=8,
  CurPhase=0. Unless time-stop is active it then dispatches via off_80DDEDC on CurAction to sub_80DDEF4/sub_80DDF18/sub_80DDF86
  (note ldr uses byte offsets, so action 8 also lands on sub_80DDF86); during time-stop it instead calls
  object_presentCollisionData.'
