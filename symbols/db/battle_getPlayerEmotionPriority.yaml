    AIDataPtr; chain of tst/cmp producing r0 = 5 -> 3 -> 1 -> 2 -> 0 is a priority selection, not a computed
    value; returns stats+0x21 in r3 alongside the code, suggesting a paired status/timer output; only
    caller sub_8015B5C is a thin wrapper; route captured in beastsp (Beast Out) sequences'
