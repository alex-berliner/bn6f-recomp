name: battle_getPlayerEmotionPriority
address: '0x08015BA8'
kind: function
status: probable
summary: Returns the player's emotion/priority code (0/1/2/3/5) for the navi based on AI data flags (poison,
  anger, counter-hit chain) and navi-stats bytes 0xE and 0x2C, with the 0x21 stats byte returned alongside
  in r3.
interface: (r0 = ? passed through to battle_findPlayer, likely alliance flag) -> r0 = status priority
  code (0/1/2/3/5), r3 = naviStats+0x21 byte; flags clobbered
details: Calls GetBattleNaviStats2034A60Addr to get the persistent navi-stats block (0x2034A60) and battle_findPlayer(r0)
  to get the player BattleObject, then reads oBattleObject_AIDataPtr. It reads stats+0x2C and stats+0xE
  as inputs to the decision. Starting from r0=5 (default), if AIData PoisonDamagePerTick != 0 and stats+0xE
  != 0 it sets r0=3; if AIData Anger != 0 it sets r0=1; if AIData CounterHitChainFlag != 0 it sets r0=2,
  and r0=0 only when stats+0xE == 0xFF, i.e. later checks override earlier ones. The final value plus
  the byte at stats+0x21 (returned in r3) are presumably consumed together by the caller as an emotion/status
  index and its timer.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl GetBattleNaviStats2034A60Addr / battle_findPlayer: inputs are the navi stats block and player
