open_questions:
- Which game subsystem actually owns mode 4 vs the interpolation modes (the LUTs `byte_81C05A4`, `byte_81C0628`,
  `byte_81C0640` are shared, so naming this `battle_*` or `sprite_*` without a known caller is speculation).
- Meaning of each non-4 mode value - mode is treated as a boolean here, but the routine may be invoked with mode
  values beyond 4 that just fall into the same interpolation branch.
- Intended semantics of the +0x800 bias on the interpolated result (rounding offset vs domain offset).
