summary: Computes a screen-x or screen-y position from a panel coordinate and a fixed-point table, used by battle-object
  positioning code.
interface: '(r0 = selector: 4 = single-table branch, otherwise double-table; r1 = raw panel coord; r2 = unused (saved
  to r12)) -> r0 = position with 0x800 bias ; side effects: none'
details: "Computes a screen-x or screen-y position from a panel coordinate\n  and a fixed-point table.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `lsl r0, r0, #0x18; lsr r0, r0, #0x18` — r0 is a small selector byte; `cmp r0, #4; bne loc_814F3DC`
    shows one of two branches is taken when r0 == 4. - `lsl r1, r1, #0x18; lsr r5, r1, #0x18` — r1 is treated as
    a u8 panel index, then offset into either `byte_81C0640` (r0==4 path) or `byte_81C05A4` (otherwise) by `r5`.
    - `loc_814F3C0` clamps `r5` to `[0,0x3b]` after subtracting 0x15 (i.e. inputs 0x15..0xa6 → 0..0x91), and `loc_814F3E8`
    clamps `r5` to `[0,0x82]` after subtracting 0x24 (i.e. inputs 0x24..0xa6 → 0..0x82), suggesting two valid panel
    ranges (the second range being wider). - `ldr r4, off_814F448 // =byte_81C0628` is read as a `ldrsh` table of
    16-bit signed offsets; entries are indexed by the low nibble of each table byte (`and r0, r2; lsl r0, r0, #1`).
    - High-nibble interpolation: `asr r0, r6, #4` (then used as `mul r0, r7`/`asr r0, r0, #8`) implements a linear
    interpolation between two adjacent table entries weighted by the upper nibble (i.e. 0..15 → 0..1 step of 1/256
    after `asr #8`). - Final bias `mov r1, #0x80; lsl r1, r1, #4; add r0, r0, r1` adds 0x800 — the well-known fixed-point-center
    bias used by battle screen-coordinate helpers (e.g. panel centre = 0x800). - `r3` saved at entry (`r3 = 0814f3a5`)
    is the Thumb return address and shows this is called from `0x0814e725` (lr in captured calls); r2 is moved into
    r12 but is otherwise unused on the r0==4 branch, hinting at a parameter that became vestigial in this version.
    - The single captured call snapshot `snap_story2_12.bin` uses r0=2 → 0x758 (i.e. 0x800 - 0xa8), consistent with
    the negative-direction interpretation of the same formula.'
