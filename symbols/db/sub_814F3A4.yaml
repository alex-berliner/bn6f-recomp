name: sub_814F3A4
address: '0x0814F3A4'
kind: function
status: hypothesis
summary: Mode-selecting packed/single-byte LUT lookup with linear interpolation between adjacent packed entries,
  used as a generic helper across multiple subsystems.
interface: 'u32 interpLutLookup_814F3A4(u8 mode, u8 index, u8 frac); /* inputs: r0=mode, r1=index, r2=frac, r3/r4/r5/r6/r7/lr=unused;
  outputs: r0=result, r1=lr (return), r2=0 or frac, r3=table addr, r12=frac (interp path) or frac (simple); flags
  set by final add (interp: add(interp, 0x800); simple: add(idx, table_addr)) */'
details: "Two branches selected by `mode` (r0):\n  * mode == 4 (\"simple\"): clamps `index` to range [0..0x3B] (clamped\
  \ to 0 if <=0x14, else index-0x15); returns the byte at `byte_81C0640 + clamped_index`. r2 and r12 keep the original\
  \ `frac` byte; r3 unchanged.\n  * other modes (\"packed\"): clamps `index` to range [0..0x82] (clamped to 0 if\
  \ <=0x23, else index-0x24; `frac` forced to 0 if idx<=0x23 and to 0xFF if idx saturated at 0x82). Each byte of\
  \ `byte_81C05A4` is a packed entry: low nibble indexes an s16 in the pool `byte_81C0628` (scaled <<1), high nibble\
  \ is an arithmetic shift amount (ASR). Decodes entry at idx and idx+1, then returns `va + ((frac * (vb-va)) >>\
  \ 8) + 0x800` (a fixed-point linear interpolation), with final `adds` setting nz/c/v from the +0x800.\nOutput\
  \ registers: r0=result, r1=return address popped, r2=0 on interp path (frac on simple), r3=`byte_81C05A4` on interp\
  \ path (passthru on simple), r12=`frac` always. r4-r7 preserved. r4 holds TABLE_S16 (`byte_81C0628`) and r5 holds\
  \ the clamped index / frac scratch inside the function.\nTables involved: `byte_81C05A4` (packed entries), `byte_81C0628`\
  \ (s16 pool), `byte_81C0640` (simple byte LUT). The exact consumer (battle, map, sprite, etc.) is not deducible\
  \ from this function alone - several call sites exist and reuse the same helper for unrelated contexts.\n"
