name: ow_setWarpTrigger
address: '0x08141914'
kind: function
status: probable
summary: Records a map-anchored trigger point (position offset by a per-index pair, size 12x8) into the
  eStruct2001010 slot, tagging it with the current map group/number.
interface: (r0 = base x, r1 = base y, r2 = param stored at +0x24, r3 = index into byte_8141958 offset
  table) -> r0 = 0 (clobbered); writes eStruct2001010+0x18..0x3B
details: Index r3 selects a pair of words from byte_8141958 (r3*8 bytes apart) which are added to r0 and
  r1 as x/y offsets; the results are stored at eStruct2001010+0x1C/0x20/0x24 and r3 itself at byte +0x1B.
  The function then stamps the trigger with the current map by copying oGameState_MapGroup and oGameState_MapNumber
  from the GameState into bytes +0x18/+0x19 and zeroing +0x1A. Finally it initializes the following record's
  first four bytes (0x2001038-0x200103B) to 12, 8, 0xFF, 0xFF — plausibly a 12x8 activation box with two
  'unset' byte fields (likely destination coordinates or ids). Writing map group/number plus an x/y position
  strongly suggests an overworld transition/warp or event trigger registration rather than a sprite operation.
