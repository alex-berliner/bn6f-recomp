open_questions:
- What exactly do sub_80AAB04 (chip apply) and sub_80AAA3C (navi select, mode 0 vs 1) do in game terms?
- What does the 0x26 stats byte encode—is it a per-navi chip-slot descriptor or an RNG seed selector?
- Is the 2-element pool size a hard cap on the attribute table column width, or could a wider table exist?
- Why does the backward scan stop at col >= 4 (skipping columns 0–3) rather than col >= 0?
