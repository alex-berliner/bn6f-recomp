name: battle_pickChipAttr_80AA910
address: '0x080AA910'
kind: function
status: confirmed
summary: Select a chip attribute for the active navi using stats byte 0x26 to choose between direct chip
  application, single-offset read, or random table-column scan.
interface: u16 battle_pickChipAttr_80AA910(u32 naviId0 /*r0*/, u32 naviId1 /*r1*/, u32 attrIdx /*r2*/,
  u32 coordX /*r3*/, u32 coordY /*r4*/, u32 statNavi /*r5*/) → r0; outputs c, v; clobbers nz, r1–r3, lr;
  preserves r4–r7
details: 'Calls GetBattleNaviStatsByte(r5, 0x26) to read a mode byte from the stat navi''s battle stats.
  Bit 0 set → Mode A: select navi (sub_80AAA3C mode 0), get base (sub_80AAE98), apply chip (sub_80AAB04
  with r3, r4) and return its result. Bit 1 clear → Mode B: select navi mode 0, get base, compute offset
  via damage_jitter_80AAA98(r2,r3,r4,0,base), return LD16(base + offset). Bit 1 set → Mode C: select navi
  mode 1 (returns 0 → give -1), get base, compute offset via damage_jitter_80AAA98(r2,r3,r4,2,base).  If
  offset >= 0x14, bump base by 0x14 and reduce offset. Then scan pairs of u16 entries at (base + col)
  stepping back by 4 from offset down to col >= 4, collecting entries whose top two bits (15:14) are zero
  into a 2-element pool on the stack. If no pair found in the backward pass and offset < 0x12, scan forward
  by 4 up to 0x14. If still none, return -1.  Otherwise call GetPositiveSignedRNG(r7=original offset)
  to get a random number, SWI 6 to divide by the found-count (remainder = chosen index), and return the
  selected u16 from the pool.  The c/v flags carry the random index back to the caller.

  '
