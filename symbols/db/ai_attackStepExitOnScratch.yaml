name: ai_attackStepExitOnScratch
address: '0x0810B058'
kind: function
status: probable
summary: 'Per-frame AI attack step: runs the attack''s update routine, then leaves the attack state if
  its scratch flag/var is set.'
interface: (r7 = battle object with AI attack vars) -> r0 = undefined; calls object_exitAttackState when
  ScratchVar != 0
details: First calls sub_810AF30, presumably the per-frame body of some enemy attack routine. It then
  loads oAIAttackVars_ScratchVar from the object's AI attack variable struct via r7 and compares it to
  0; if it is nonzero it tails into object_exitAttackState to end the attack state, otherwise it returns
  with the attack still active. The scratch var thus acts as a completion/end flag set by the attack logic
  (likely inside sub_810AF30). Only 9 instructions; no other state is touched. Actual caller context and
  the identity of sub_810AF30 are unknown.
