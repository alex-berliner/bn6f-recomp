name: battle_setFieldHitFlag
address: '0x081100E2'
kind: function
status: probable
summary: 'Battle-object step: sets obj+0x7D to 1 when a halfword in CollisionDataPtr selected by obj+0x7E
  is nonzero; early-returns if ExtraVars is set.'
interface: (no args; r5 = battle object) -> void; sets byte at obj+0x7D = 1 if the tested collision halfword
  is nonzero, r0/r1/r2 clobbered
details: If obj+ExtraVars is nonzero the routine exits immediately. Otherwise it loads a byte at obj+0x7E,
  multiplies by 4, and indexes the word table byte_8110108; the loaded word is used as a halfword offset
  into [r5,#oBattleObject_CollisionDataPtr]. The first four entries are offsets 0x86, 0x8A, 0x84, 0x88
  (a cluster of halfword fields in the collision-data struct, likely hitbox coordinates/sizes); remaining
  entries are 0xFFFFFFFF words and a pointer to byte_8110124 (values 8,0xA,9,0xB,0xD,0xD), so 0x7E is
  probably restricted to values 0-3. If the halfword at the selected offset is zero, nothing happens;
  if nonzero, byte 0x7D is set to 1. No return value is produced; the effect is purely the state flag
  at 0x7D.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst of [r5,#oBattleObject_ExtraVars] with bne exit gates the whole routine; ldrb [r5,#0x7E];
    lsl r1,#2; ldr [r0,r1] indexes table byte_8110108 as words; result used as ldrh offset into [r5,#oBattleObject_CollisionDataPtr],
    cmp #0, beq exit; nonzero branch only does mov r0,#0x7D; mov r1,#1; strb r1,[r5,r0]; table entries
    0x86/0x8A/0x84/0x88 are halfword offsets into the collision struct, matching hitbox field spacing'
  refs:
