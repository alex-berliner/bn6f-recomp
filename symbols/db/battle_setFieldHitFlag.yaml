    halfword from CollisionDataPtr at that offset, and sets byte 0x7D=1 if nonzero. The table values are
    indeed 0x86,0x8A,0x84,0x88 followed by 0xFFFFFFFF words and a pointer. A better prefix/name: ''battle_setFieldHitFlag''
    fits better since it sets a flag based on a hitbox field being nonzero, not a generic collision check.;
