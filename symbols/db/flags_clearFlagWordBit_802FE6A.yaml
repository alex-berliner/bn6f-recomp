name: flags_clearFlagWordBit_802FE6A
address: '0x0802FE6A'
kind: function
status: confirmed
summary: Clears one bit, selected by an MSB-first index in r0, in the 32-bit flag word at dword_2009A2C.
interface: void flags_clearFlagWordBit(u8 bitIndex /* r0, 0 = bit 31 of the word ... 31 = bit 0 */);
details: 'Reads the flag word at dword_2009A2C (IWRAM), builds a mask with

  mov r2,#0x80; lsl r2,#18 (0x80000000) followed by `lsr r2, r0`, then

  bic''s it into the word and stores it back. Bit numbering is from the

  top: index 0 clears 0x80000000, index 31 clears 0x00000001. An index

  of 32 or more shifts the mask out completely, so the word is left

  untouched (though flags r2/C are still set per the shift). The 0x2009A2C

  word is presumably part of the game''s event/progress flag work area;

  this is the "clear" counterpart of a matching set/test routine.

  Side effects for callers: r1 = updated word, r2 = mask, r3 = pointer to

  the word, NZ from the updated word, C from the barrel shift (C=1 only

  for a shift count of exactly 32). Returns via mov pc, lr.

  '
