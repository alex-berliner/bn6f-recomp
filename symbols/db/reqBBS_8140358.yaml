name: reqBBS_8140358
address: '0x08140358'
kind: function
status: confirmed
summary: Routes a BBS joypad press (R/A/B/Start+Select) to the matching sub-handler, gated by the per-slot action
  counter.
interface: void bbsDispatchJoypadReq(u32 ignored_r0, u32 r2 /* forward param */, BbsStateBlock *r5, Toolkit *r10);
  /* preserves r4-r7; r5,r10,r11 memory may be modified by sub-handlers */
details: "Loads the joypad pointer from [r10 + oToolkit_JoypadPtr], reads the 16-bit Pressed field, then dispatches:\
  \ - bit 1 (R): call reqBBS_81403A8 (open/refresh the BBS screen). - Gate: if [r5+0x1E] (u16 action counter) is\
  \ zero, return immediately. - bit 4 (A): call reqBBS_8140414 (confirm/action). - bit 1 (B): call reqBBS_81403C0\
  \ (cancel/back). - Otherwise check the Held-button field at [joypad+4] against mask 0x3C0\n  (Start+Select+L+R\
  \ combo region); if any bit is set, call\n  menu_adjustCursorOrValue_811F7F8 with r1=8, r2=r3=0 and store the\
  \ low\n  byte of the joypad pointer (left in r7) into [r5+0x0B].\nSub-handler results in r8-r11 propagate as this\
  \ function's \"outputs\". r0 is saved to r8 but never read; it is effectively ignored.\n"
