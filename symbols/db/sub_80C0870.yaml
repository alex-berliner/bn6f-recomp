name: sub_80C0870
address: '0x080C0870'
kind: function
status: confirmed
summary: Dispatches to the phase-specific handler for a battle object based on its current phase byte.
interface: void sub_80C0870(u32 r5 = battleObject); // r5, r8-r12 preserved by handler; r0/r1/flags clobbered
details: 'Reads the battle object''s `oBattleObject_CurPhase` byte (r5 + that offset) and

  uses it as a direct byte index into the handler table at off_80C0884. The

  current table contains only two entries: phase 0 -> sub_80C088C and phase 4

  -> battleObject_runFirstTurnPhase_80C08EE. The selected handler is invoked

  via `mov lr, pc; bx r1` with r0 carrying the phase byte, so the handler

  returns straight to the original caller of sub_80C0870. The handler is

  expected to leave r5 and r8-r12 untouched (callers'' preserved set), with

  r0, r1, r2-r4, r6, r7, lr and the flags free for scratch. The `pop {pc}`

  here only acts as the handler''s return target; sub_80C0870 itself has no

  return path of its own beyond that.

  '
