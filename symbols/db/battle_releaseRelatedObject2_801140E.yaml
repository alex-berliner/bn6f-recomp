name: battle_releaseRelatedObject2_801140E
address: '0x0801140E'
kind: function
status: confirmed
summary: Runs the action-phase-8 step on a battle object's related object (if any) and then clears the
  RelatedObject2Ptr link.
interface: void battle_releaseRelatedObject2_801140E(BattleObject* self /* r5 */) — inputs r5, lr; outputs
  c (set), v (clear), r1 (callee's result, or caller's r1 untouched if no link); preserves lr via pop
  {pc}
details: 'Reads BattleObject.RelatedObject2Ptr (oBattleObject_RelatedObject2Ptr) from the object passed

  in r5. If the pointer is non-NULL, calls battle_setObjectStateActionPhase8 with the related

  object as r0 — driving that object to its action-phase-8 state/step — and then stores NULL back

  into RelatedObject2Ptr, severing the link. If the pointer was already NULL, nothing happens

  (falls straight through to the return, leaving the caller''s r1 untouched). The pointer compare

  leaves C set and V clear; callers apparently read r1 out of the callee when a link existed.

  Presumably called on an object when its associated "partner/secondary" entity should be

  advanced to phase 8 and detached (cleanup of a finished related action).

  '
