name: CutsceneCmd_wait_camera_script
address: '0x080377F6'
kind: function
status: confirmed
summary: Cutscene script command that pauses the cutscene until the parallel-running camera script finishes.
interface: u8 CutsceneCmd_wait_camera_script(CutsceneState *r5, u32 r7_commandCounter /* in/out */); returns 0 while
  the camera script is active (counter unchanged), 1 when done (counter advanced); sets nz from r0, and on the done
  path c/v come from the ADDS r7,#1
details: A cutscene command handler. Reads the CutsceneCameraScriptActive byte field of the cutscene state struct
  at r5. If nonzero, a camera script is still running alongside the cutscene, so it returns r0=0 without touching
  the command counter, making the interpreter re-execute this wait command next frame. Once the field reads zero,
  it advances the interpreter's command pointer r7 by 1 (via ADDS, which sets c/v from the increment) and returns
  r0=1 so the cutscene proceeds to the next command. No other registers are clobbered; lr is popped as pc.
