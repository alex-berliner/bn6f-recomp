name: npc_tickTimerPhaseEnd4_8136EE4
address: '0x08136EE4'
kind: function
status: confirmed
summary: Counts 20 frames in the object's current phase, then switches its state byte to 4 to end the phase.
interface: void sub_8136EE4(u8 *obj /* r5 */); no return value; flags clobbered
details: 'Tiny per-object updater that runs one step of a fixed-length phase. It loads the

  16-bit counter at obj+0xE, increments it, and stores it back. Once the count

  reaches 0x14 (the 21st tick, i.e. after 20 increments have elapsed), it writes

  state 4 into the state byte at obj+0x00, presumably telling the object''s state

  machine to move to its next phase. The count is held in a 32-bit register for the

  comparison, so a saturated 0xFFFF counter would still trip the >=0x14 test before

  being truncated back to 16 bits on store. Registers used: r5 = object pointer

  (preserved by caller contract), lr popped to pc.

  '
