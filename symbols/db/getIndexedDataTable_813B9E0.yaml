name: getIndexedDataTable_813B9E0
address: '0x0813B9E0'
kind: function
status: confirmed
summary: Returns the address of one of three data tables (byte_813B1EC, byte_813B2CD, byte_813B3AE) selected by
  the index in r0.
interface: 'u32* getIndexedDataTable(u32 index) // in: r0 = table index; out: r0 = pointer to selected table; clobbers
  r1, flags'
details: 'Tiny dispatcher: loads a jump/table pointer at off_813B9EC (=off_813B9F0), shifts the

  incoming index left by 2, and reads the 32-bit entry off_813B9F0[index] into r0,

  returning it directly (tail return via popped pc). The table at off_813B9F0 holds

  three entries: byte_813B1EC, byte_813B2CD, byte_813B3AE, so index 0-2 selects one of

  those byte tables. There is no bounds check, so any index outside 0-2 returns

  whatever garbage lies past the table. Nothing else is touched; the function is a

  pure table-select helper whose callers presumably use the returned pointer to walk

  the corresponding byte_813Bxxx data.

  '
