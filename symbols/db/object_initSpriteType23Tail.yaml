name: object_initSpriteType23Tail
address: '0x0811E68C'
kind: function
status: probable
summary: 'Tail of object_initSpriteType23: invokes sub_811E6A0 then sprite_update on the freshly built
  sprite.'
interface: (no args) -> r0 = sprite_update result; flags from sub_811E6A0/sprite_update
details: 'Called at the end of object_initSpriteType23, which builds the object''s GUI sprite (id 0x39,
  anim 0, no shadow, palette 0, priority 0) at screen position (220, 44). This routine first branches
  to sub_811E6A0, whose behavior is not documented, then calls sprite_update, which runs _sprite_update
  on the object''s sprite struct (header plus byte 2 & 0xF0). This looks like a post-init hook: perform
  any type-0x23-specific state setup, then immediately render/update the sprite so its first frame is
  queued. The 220,44 placement and sprite id 0x39 suggest a fixed GUI element (likely a screen overlay/cursor-style
  object), but the setup callee is unknown. The function itself has no locals and only chains the two
  calls.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'asm: push {lr}; bl sub_811E6A0; bl sprite_update; pop {pc} — two-call wrapper, no own state;
    caller object_initSpriteType23 (0x0811E63C): builds sprite id 0x39, anim 0, pos (220,44), then calls
    this; callee sprite_update (0x080026C4): runs _sprite_update on header + (byte 2 & 0xF0), i.e. the
    shared per-frame sprite refresh; callee sub_811E6A0 is undocumented, so the type-specific half of
    the behavior is unseen'
