  table off_804A564[state] with r0 = state index and r1 = state index' — looking at the asm, r0 is loaded
  from off_804A564 (the handler pointer) before ldrb reads the state into r1, so r0 is the handler address,
  not the state index, and r1 holds the state index. Also, the function pushes {lr} (not push {r4, lr}),
  uses r5 as the object struct passed in, and the tail-call via mov lr, pc; bx r0 means the handler returns
  via pop {pc} rather than a normal return. The summary is broadly fine but the r0/r1 detail is wrong.
