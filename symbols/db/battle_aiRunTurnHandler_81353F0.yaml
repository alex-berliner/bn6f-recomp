summary: Dispatches an AI turn action (r0=row/action id) with r1 (often a 0/1 sub-mode) into the AI panel-range/attack
  routine using constants 0x24, 0xA5, 0x28, 6.
interface: (r0 = action index [5..6], r1 = sub-flag [0..1], r5 = caller's object/AIData, lr = caller's
  lr) -> r0 = result bitmask/status word ; no other return registers per contract
details: "- Single basic block. Saves r4-r7+lr, copies r0->r7, r1->r3, then loads r0=0x24, r1=0xA5, r2=0x28,\
  \ r4=6, and tail-calls battle_aiCheckPanelRangeAndDoAttack_8134930.\n  - The fixed args 0x24/0xA5/0x28/6\
  \ are constant for every captured call (only r0/r1 vary as 5,0 or 6,1), so this is a thin typed entry\
  \ point into the AI attack dispatcher.\n  - It is called from six battle-object update paths (battle_objectUpdate_8133400,\
  \ sub_8133484, sub_81337E8 submenu, sub_81338D4, sub_8133944 menu scene, sub_8133D64) — i.e., per-frame\
  \ battle tick, menu and submenu flow — consistent with an AI turn-handler stub that the host object\
  \ forwards its action byte and a player/navi flag into.\n  - Exit returns r0 (e.g., 0x20 / 0x40) which\
  \ matches the r0 contract of the underlying ai routine; the named result is just whatever that callee\
  \ returns.\n  - Because the contract lists r2/r3/r5/r6 as live out (preserved by callee-save? actually\
  \ written) and flags clobbered, treat as a void-like stub; r0 is the only true return.\n"
