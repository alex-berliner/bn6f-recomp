name: cutscene_end_8036ED4
address: '0x08036ED4'
kind: function
status: confirmed
summary: Ends/aborts the currently running cutscene by parking the script interpreter on the dummy script, resetting
  skip-resume state and clearing event flag EVENT_1731.
interface: void cutscene_end_8036ED4(toolkit r10); returns with r1, r3, c, v as left by ClearEventFlagFromImmediate;
  r4-r7 preserved; clobbers r0, nz
details: 'Fetches the cutscene state struct from [r10 + oToolkit_CutsceneStatePtr] and parks the cutscene

  script interpreter: stores script position 1 (CUTSCENE_SCRIPT_UNK_MAGIC_SCRIPT_VALUE_0x1, the

  marker the dummy script consumes) into ptr_1C, and points ptr_20/ptr_24/ptr_28 all at

  DummyCutsceneScript so nothing further is executed. Zeroes

  oCutsceneState_CutsceneScriptAfterCutsceneSkip (unk_38), so if the player skips out of this

  cutscene there is no script to resume. Then loads the toolkit''s s2001c04 struct pointer and

  clears halfword fields unk_12 and unk_14. Finally clears event flag EVENT_1731 (group 0x17,

  bit 0x31) via ClearEventFlagFromImmediate, whose outgoing r1/r3/c/v are returned to the caller

  as-is. No tail return: pops and re-executes the call as a return through RETURN_TO_CALLER,

  which is why c/v count as outputs. Effectively the "cutscene finished / was terminated" hook —

  safe to call even when scripts are running, since the dummy script just idles.

  '
