name: object_releaseRelatedAndDestroy_80D1C44
address: '0x080D1C44'
kind: function
status: confirmed
summary: Drops a reference on the object's related object, clears its extra variable slot, and runs the
  generic object destructor on it.
interface: u32 object_releaseRelatedAndDestroy(u32 r5 self); // returns the same object pointer in r5,
  flags clobbered
details: 'Battle-object teardown helper taking the object pointer in r5. It reads the related-object

  pointer at self+oBattleObject_RelatedObject1Ptr and decrements that object''s

  oBattleObject_ObjectHeader field by 1, i.e. releases one reference/share of the related

  object''s header. It then zeroes the word pointed to by self+oBattleObject_ExtraVars+8

  (a pointer to an extra variable slot in the object) and tail-calls object_genericDestroy,

  which does the standard destruction for this object. object_genericDestroy preserves r5,

  so the caller still holds the same object pointer in r5 on return; the function is

  effectively "pop {pc}"-terminated with r5 passing straight through. Preserves r5-r7,

  clobbers r0-r3 and lr plus all flags.

  '
