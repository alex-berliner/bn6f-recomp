name: oBattleObject_PendingStateAction
address: '0x5c'
kind: struct-field
status: probable
summary: Scratch field holding a saved copy of the CurStateActionPhaseAndPhaseInitialized word that gets
  restored back into that field when a transient one-shot flag (e.g., attack/animation/exit-pending bit)
  is cleared.
details: In every example the field is read with `ldr`, compared/tested against zero, and when zero the
  current CurStateActionPhaseAndPhaseInitialized word is stored into it (snapshot); when the trigger condition
  fires, that snapshot is copied back into CurStateActionPhaseAndPhaseInitialized and Unk_5c is cleared
  to zero with `mov r0,#0; str r0,[r5,#oBattleObject_Unk_5c]`. This save/restore-around-an-ack idiom matches
  a "pending state to restore on confirmation" purpose, and only ever holds a previously-observed full
  state word, so a u32 is the natural type.
