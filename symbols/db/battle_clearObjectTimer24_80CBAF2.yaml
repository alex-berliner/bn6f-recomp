name: battle_clearObjectTimer24_80CBAF2
address: '0x080CBAF2'
kind: function
status: confirmed
summary: Clears the halfword counter/timer field at offset 0x24 of a battle object.
interface: void sub_80CBAF2(u32 object /* r0 */); preserves and effectively "returns" the incoming r5
  value; flags clobbered (N/Z)
details: Stores 0 into the halfword at [r0+0x24] of the object whose address is passed in r0, then returns.
  Offset 0x24 in the battle object/work-area layout is a counter or timer field used per-entity, so this
  resets that counter to zero for the given object. Nothing else is touched. The push/pop of r5 exists
  purely so that r5 is preserved across the call; every caller relies on r5 passing through unchanged,
  and the lifter models this by having the helper "return" the incoming r5. The halfword store with value
  0 is the function's entire effect, so its purpose is tied to whatever field 0x24 holds in this object
  type (most likely a per-object timer or state counter reset on spawn/state change).
