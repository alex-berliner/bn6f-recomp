name: ai_attackInitWait
address: '0x080FB540'
kind: function
status: probable
summary: 'AI attack state handler: on first call initializes the attack (sets AttackElement=4, CurAnim=0x17,
  counter time 0x12, sound 0xFF) and spawns/configures the attack object via sub_80D59E2; subsequent calls
  decrement StepTimer (0x23 frames) and on expiry write 0x14 into HitElement to start the hit phase.'
interface: (r5 = battle object, r7 = oAIAttackVars block) -> void; returns with r0=0x23, r1/r2/r3 = object
  X/Y/Z and r4 = flip<<8+0x51 left for the caller
details: 'On first invocation (AttackElement == 0) it commits to the attack: sets oAIAttackVars_AttackElement
  = 4, sets the object''s CurAnim to 0x17, calls object_setCounterTime(0x12), and plays sound effect 0xFF.
  It then calls sub_80D59E2 with the object''s PanelX/PanelY, the target panel X from oAIAttackVars_TargetPanelX
  shifted into the upper byte of a word whose low byte is AiDifficultyTier, and oAIAttackVars_Damage —
  configuring a spawned attack entity. It reads the object''s facing via object_getFlip and computes (flip<<8)+0x51
  as an X position/offset, loads the object''s X/Y/Z into r1-r3, stores 0x23 (35) into StepTimer, and
  returns. On later calls it decrements StepTimer each frame; when it hits zero it writes 0x14 into oAIAttackVars_HitElement,
  marking the attack''s damage/hit phase. The leftover r0-r3/r4 values after return suggest the caller
  uses them to finish spawning or positioning something.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]/tst + strb #4: first-entry gate that commits the
    attack; mov r0,#0x17; strb [r5,#oBattleObject_CurAnim] + bl object_setCounterTime(0x12) + bl PlaySoundEffect(0xff):
    attack startup; bl sub_80D59E2 with PanelX/PanelY, (TargetPanelX<<8)|AiDifficultyTier, Damage: spawns/parameterizes
    the attack entity; bl object_getFlip; lsl r4,#8; add r4,#0x51: computes a flip-dependent X offset,
    X/Y/Z loaded into r1-r3 before return; StepTimer-- / bgt, then strh #0x14 into oAIAttackVars_HitElement:
    35-frame windup before the hit flag'
  refs:
  - bn6f/asm/asm31.s:143128
  - 0x080005CC PlaySoundEffect
  - 0x0800E456 object_getFlip
