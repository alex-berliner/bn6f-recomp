  reproduce: python3 tools/asmcat.py 0x080FB540
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary conflates sub_80D59E2''s arguments: r2 is oAIAttackVars_InitFlag, not a packaged word
    of target X with difficulty tier (r3 is target X<<8 ORed with r4=AiDifficultyTier, so r4 is that combined
    word, not r2). The HitElement write is strh not strb (0x14 implies 16-bit, contradicting ''byte'').
    A small wording fix is warranted. The name ''ai_attackInitWait'' captures both the init branch and
    the post-init wait/poll branch, which fits the two-branch structure.; run wf investigate investigate-20261018-182231;
