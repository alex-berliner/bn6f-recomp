name: event_runArmedCallback_80024AE
address: '0x080024AE'
kind: function
status: confirmed
summary: Invokes the currently armed callback stored in the record at 0x200A6A0, if its armed flag is set.
interface: 'void event_runArmedCallback(void); /* trashes r0, flags; preserves r1-r12 per contract; tail effect:
  whatever the registered callback does to r1-r3/flags is hidden by the lifter''s caller analysis */'
details: 'Reads the one-byte "armed" flag at eStruct200a6a0 (0x200A6A0). If it is zero, the function returns immediately
  without touching anything else. If it is nonzero, it loads the callback address from 0x200A6A4 and dispatches
  to it with its own address in r0 (a common convention so the callback can re-arm/clear itself). r4-r7 are pushed/popped
  around the dispatch, so the caller''s r4-r7 survive no matter what the callback does; the flag byte is not cleared
  here, so either the callback clears it or it stays armed for the next call. This is a generic deferred/event-callback
  dispatcher rather than anything gameplay-specific — a "run pending registered handler" hook that some main-loop
  or interrupt path can call.

  '
