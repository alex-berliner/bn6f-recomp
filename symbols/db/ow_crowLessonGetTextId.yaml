name: ow_crowLessonGetTextId
address: '0x081430DC'
kind: function
status: probable
summary: Returns one of two text/message IDs (0x96E/0x96F) for the Cybercrow lesson spot, chosen by a
  state value from a helper.
interface: () -> r0 = message/text ID (halfword 0x96E or 0x96F from table dword_81430F0); no flag guarantees
details: 'Calls sub_8143088 with no arguments and treats its r0 result as an index: lsl r0,r0,#1 then
  ldrh from dword_81430F0 indexed by r0. The table holds two consecutive halfwords, 0x096E and 0x096F,
  matching the game''s text-archive ID range, so the function maps some crow-lesson state/progress value
  (returned by sub_8143088) onto one of two dialogue lines. It clobbers nothing beyond the call (r4-r7
  saved/restored). Only two entries exist, so indexes other than 0/1 read out-of-range garbage.'
