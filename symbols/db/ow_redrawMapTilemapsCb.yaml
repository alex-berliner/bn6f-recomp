name: ow_redrawMapTilemapsCb
address: '0x08142D4C'
kind: function
status: probable
summary: Register-saving trampoline (push r4-r7/lr, bl sub_80307D8, pop) used as a callback that triggers
  sub_80307D8 to repaint both tilemap layers of the overworld map window centered on the camera.
interface: () -> r0 = result of sub_80307D8 (unknown); r4-r7 clobbered (saved/restored)
details: The function does nothing itself except save r4-r7, call sub_80307D8, and return; the real work
  happens in the callee, which repaints both tilemap layers of the map window centered on the camera's
  current tile. The word eMapTilesState200be70 in the function's literal pool suggests the surrounding
  module owns the map-tiles state that sub_80307D8 operates on, but this function never loads it. Given
  the beastsp route context and the callee's known behavior, this looks like an event hook or scheduler
  callback invoked whenever the map needs refreshing (e.g. after a camera move or scene change). Its non-leaf
  wrapper form (saving registers it never uses) suggests it is called indirectly as a callback rather
  than as ordinary code.
