name: navicust_handleBoardInput
address: '0x08135830'
kind: function
status: confirmed
summary: Per-frame joypad input dispatcher for the in-battle NavCust board; routes SELECT/START/A/B/D-pad to cursor
  movement, cell confirm/cancel, beast-spirit code input, or sub-menu, then snapshots coordinates to the draw back-buffer.
interface: void navicust_handleBoardInput(u32 r2 /* initial cursor param */, u32 r5 /* board object */, u32 r10
  /* toolkit */); outputs r5 r8-r12; clobbers r0-r3, flags, lr
details: 'Field layout on the object (r5): +0x02 = state byte (set to 8 on cell-select), +0x0C = board state-machine
  phase (skip advance if 0xC), +0x0D = busy/animation counter (skip all input if nonzero), +0x13 = draw-flag cleared
  every frame, +0x17 = cancel-pending flag (cleared each frame outside code-input mode), +0x20/+0x22 = x / prev-x
  (u16), +0x24/+0x26 = y / prev-y (u16), +0x38/+0x3A = committed draw x/y (u16). Reads joypad via toolkit+oToolkit_JoypadPtr;
  checks raw held (bit 0x10 for beast code mode), pressed (bit 0x20 for select), and low-sensitivity-held (D-pad
  repeat) fields. Dispatches to: object_setState30IfAnyUnk2004190EntryActive (SELECT), navicust_boardCursorUp +
  navicust_getCellProgramId (START), beastsp_feedBoardCodeInput (code-input mode), navicust_boardInputCancelExit
  (START|B), navicust_handleBoardConfirm (A), navicust_loadSelectedCellParams + sub_8135F5C + sub_813660C + navicust_drawBoardTilemap
  + PlaySoundEffect(SOUND_MENU_SELECT) (cell select), menu_adjustCursorOrValue_811F7F8 (D-pad cursor move, sets
  busy to 0x7F), navicust_getMoveDir (state-machine advance). Final commit writes +0x20/+0x24 into +0x38/+0x3A and
  zeroes +0x13.'
