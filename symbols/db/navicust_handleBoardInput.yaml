name: navicust_handleBoardInput
address: '0x08135830'
kind: function
status: probable
summary: 'Per-frame input handler for the Navi Customizer board screen: dispatches button presses (select/confirm/cancel/compress
  actions) and cursor movement, then updates the selected-cell state.'
interface: (r5 = navicust screen state struct, no r0 args) -> r0 = 0/bool; updates struct fields 0x02,
  0x0c, 0x0d, 0x13, 0x22, 0x26, 0x38, 0x3a
details: 'Saves the current cursor/scroll halfwords (0x20, 0x24) into prev-slots (0x22, 0x26) and at exit
  copies them again into 0x38/0x3a, clearing byte 0x13. If byte 0x0d is set it skips input (busy/animating).
  SELECT calls sub_81367C0 (likely compress/board special action), START calls sub_81367A0 + sub_8135F18,
  B+START calls sub_813627C (cancel/exit), A calls sub_8136218 (open part menu / confirm). Right held
  (0x10 of held) calls sub_8136804; a press of bit 0x20 plays SOUND_MENU_SELECT, sets state byte 0x02
  = 8, runs sub_8135FA4/sub_8135F5C/sub_813660C(1) and redraws the board via navicust_drawBoardTilemap(1).
  Otherwise menu_adjustCursorOrValue_811F7F8 (mask 4, low-sensitivity held) moves the selection: on change
  it redraws via sub_8135F18, sets byte 0x0d = 0x7f, and sub_8135EEC resolves the new selected cell index
  (compared against max 0xc) into byte 0x0c.'
