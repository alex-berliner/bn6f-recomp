  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The loop condition is `cmp r6, r4; ble loc_812D57A` with r4 = r1+2 and r6 starting at r1, so it
    actually covers r1, r1+1, r1+2, r1+3 (four records), not three. Also, `tst r6, r6; bne loc_812D588`
