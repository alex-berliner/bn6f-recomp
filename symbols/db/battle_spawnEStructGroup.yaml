name: battle_spawnEStructGroup
address: '0x0812D56C'
kind: function
status: probable
summary: Spawns a group of up to four eStruct records from a 0xFF-terminated (id,slot,param) table, links
  each spawned record to the first one via a back-pointer at offset 0x14, and gives each one the same
  sprite position via sprite_setCoordinates.
interface: (r0 = 0xFF-terminated (id,slot,param) spawn table, r1 = first eStructArr2008450 slot index
  (loop covers r1..r1+2), r2 = pointer passed on to sprite_setCoordinates) -> void; no return value.
details: First calls battle_spawnEStructRecordsFromTable_80465A0 on r0 to create 0x58-byte type-9 records
  in eStructArr2008450. It then iterates three slot indices (r1 through r1+2); for each slot getStructFrom2008450
  returns a status flag in r0 (loop skips the slot when it's zero) and a pointer to the record in r1.
  For every existing record it calls sprite_setCoordinates with the caller's r2 pointer and the constant
  0x58, so all records in the group share one position. On the first iteration only (index == 0) it saves
  the returned record pointer in r7, and that pointer is stored at record+0x14 of every record in the
  group, linking each to the first. The r2 argument is stacked across the spawner call. Callers at 0x0812D52E/0x0812D54C
  invoke this twice/thrice in sequence, suggesting several groups are set up together.
evidence:
