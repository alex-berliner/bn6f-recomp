open_questions:
- exact meaning of record+0x14 (back-pointer to first record, or something else)
- precise return convention of getStructFrom2008450 (flag in r0 vs pointer in r1) — the project summary
  only documents the flag
- what the caller's r2 argument points to, and how 0x58 encodes the position passed to sprite_setCoordinates
- what gameplay entity these three-record groups represent (needs caller context beyond sub_812D52E/sub_812D54C)
- The loop condition is `cmp r6, r4; ble loc_812D57A` with r4 = r1+2 and r6 starting at r1, so it actually
  covers r1, r1+1, r1+2, r1+3 (four records), not three. Also, `tst r6, r6; bne loc_812D588` means the
  back-pointer assignment is skipped on iteration 0 (r7 is saved there), not 'only the first iteration
  saves the pointer' while later iterations write r7. The summary's three-records claim and first-iteration
  linkage description are wrong.
