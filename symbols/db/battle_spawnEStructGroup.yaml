    r7=r1 captured only when tst r6,r6 shows index==0, then str r7,[r5,#0x14] for each record; sprite_setCoordinates([sp](=caller
    r2), #0x58) called identically for every found record; callees'' known summaries: 0x58-byte eStruct
    records in eStructArr2008450, sprite_setCoordinates sets x/y in a sprite sub-entry'
