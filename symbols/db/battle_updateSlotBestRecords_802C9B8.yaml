name: battle_updateSlotBestRecords_802C9B8
address: '0x0802C9B8'
kind: function
status: confirmed
summary: Records this battle's value (u32 at battle state +0x40) into the per-slot best/running record tables chosen
  by the state's byte at +0x0D, keeping the lowest value seen.
interface: 'void battle_updateSlotBestRecords_802C9B8(void); // no direct args: reads battle state via helpers;
  preserves r4/r5, returns with v flag set by the last value comparison'
details: 'Fetches the u32 at battle_state+0x40 (the value to record, likely a time or counter for the

  just-finished battle/task) with battle_getStateUnk40_800A704, then reads battle_state+0x0D

  with battle_getStateByte0d_800A7E2 and passes that byte (plus the value in r4) to sub_802CA1E,

  which resolves a 2-byte table slot index; 0xFF means "nothing to record" and the call returns

  immediately. For a valid slot it halves the index into a u16 offset and compares the value

  against two record tables: unk_20018C0 (best/lowest recorded value per slot) and unk_2000260

  (running/current value per slot). If the value is below the recorded best it overwrites both

  entries; otherwise it only lowers the unk_2000260 entry if the value is below that. Entries

  are u16 halfwords, compared and stored as signed 16-bit values while the source value is a

  u32 (only the low 16 bits survive into the tables). Flags are left from the final comparison

  (the v flag is part of the register contract; nz/c are free).

  '
