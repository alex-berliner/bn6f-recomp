name: battle_getAiDifficultyTier_800FE36
address: '0x0800FE36'
kind: function
status: confirmed
summary: Reads the enemy's AI data difficulty byte and maps it to a tier (0-2), but only for AI data version 4.
interface: int sub_800FE36(battle object in r5) -> r0 = tier (0-2, or version byte on early exit), r1 = AI data
  pointer, r2 = raw difficulty byte (version 4 only); NZCV set by the last comparison performed
details: 'Loads the battle object''s AI data pointer from oBattleObject_AIDataPtr and checks the AI data version
  byte at oAIData_Version_16. Only version 4 is accepted; any other version returns immediately, leaving r0 holding
  the version byte. With version 4, it reads the difficulty byte at oAIData_Unk_0c and buckets it into three tiers:
  <=3 -> 0, 4-6 -> 1, >6 -> 2. This tier likely selects which AI behaviour script/level an enemy uses in battle
  (the classic BWN "AI level" ramp, e.g. for progressive difficulty or SP forms). r1 always returns the AI data
  pointer and r2 returns the raw difficulty byte on the version-4 path. Flags are whatever the last executed comparison
  left: the version CMP on the early-exit path, otherwise the tier comparisons (and NZ from the final mov on the
  tier-2 path).'
