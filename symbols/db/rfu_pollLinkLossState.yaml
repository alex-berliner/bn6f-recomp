name: rfu_pollLinkLossState
address: '0x081464D4'
kind: function
status: probable
summary: Advances the wireless-adapter link-loss state machine at eStruct200FE00+0x2, firing the connection
  callback with code 0x45 once the disconnect is fully processed.
interface: () -> r0 = undefined (tail of callback path returns from callee); writes state byte eStruct200FE00+0x2
details: Reads the state byte at eStruct200FE00+0x2. If it is 0, it calls rfu_fireConnCallbackAndClearState(0x45,
  0), reporting a link-loss/disconnect completion (code 0x45) and letting that callee zero the connection-state
  halfwords at +0x14/+0x16. If it is 1, it advances the state to 2, deferring the callback to a later
  poll. Any other value does nothing. It is called repeatedly from sub_8147C20, which looks like the RFU
  poll loop, consistent with a per-frame state-machine step.
