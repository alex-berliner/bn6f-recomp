  detail: 'state machine on eStruct200FE00+0x2: 0 -> callback(0x45,0) and clear; 1 -> 2 (asm cmp/bne at
    81464DA-81464EC); r0=0x45, r1=0 passed to rfu_fireConnCallbackAndClearState, which invokes the callback
    in eStruct200FE00+0x40 and clears +0x14/+0x16; called 5x from sub_8147C20 (RFU poll loop) and once
    from rfu_handleConnTimeout, which itself fires callback 0x25 on timeout; no arguments are taken (only
    lr pushed), fitting a parameterless poll/step function'
