name: pet_ClearMenuData_811EC00
address: '0x0811EC00'
kind: function
status: confirmed
summary: Zero-fills the 0x18-byte ePETMenuData structure, resetting the PET menu state.
interface: (void) -> void; leaves r4 = &ePETMenuData for the caller
details: 'Loads the address of ePETMenuData into r4, sets a size of 0x18 bytes, and calls ZeroFillByWord to clear
  the whole PET menu data block word by word. It is a leaf-style wrapper: it preserves r2/r3 untouched and exits
  via pop {pc} after the call, so the caller can rely on r4 pointing at the freshly cleared struct. The routine
  ignores any values the caller may have left in r0-r3; the reported "outputs" r1-r3 are just leftover register
  states from the call rather than meaningful results. ePETMenuData is the 0x18-byte working struct behind the PET
  menu screens (cursor/selection state etc.), so this is almost certainly a menu-init or menu-exit reset routine.

  '
