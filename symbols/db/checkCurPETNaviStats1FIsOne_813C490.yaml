name: checkCurPETNaviStats1FIsOne_813C490
address: '0x0813C490'
kind: function
status: confirmed
summary: Reads byte 0x1F of the current PET's navi stats and returns whether it equals 1.
interface: bool checkCurPETNaviStats1FIsOne(void)
details: 'A tiny wrapper around GetCurPETNaviStatsByte: calls it with a1 = 0 (base/stats

  selector, effectively unused here) and a2 = 0x1F (byte index into the current

  PET navi''s stats block), then tests the returned byte against 1. Returns 1 if

  the byte is exactly 1, otherwise 0. No state is modified; the only side effect

  is the call into the PET/navi save-stats accessor. The caller contract lists

  r4/r10 as inputs, but the code never reads them (r4 is pushed/popped solely to

  preserve it), so the function is effect-free apart from its return value.

  Byte 0x1F of the navi stats is likely a cross-menu "navi is set/active" flag

  rather than a numeric stat, given the equality-with-1 test.

  '
