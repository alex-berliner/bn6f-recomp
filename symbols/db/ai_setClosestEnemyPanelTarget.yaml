name: ai_setClosestEnemyPanelTarget
address: '0x08111C88'
kind: function
status: probable
summary: 'AI helper: finds the closest enemy battle object, checks its panel against an alliance-dependent
  required-panel condition, and if it matches records it as the AI''s target, returning 1.'
interface: (r5 = battle object, r4 = target byte out, r7 = AI attack vars out) -> r0 = 1 if target set
  (0 if panel check failed); writes x|(y<<4) to [r4] and panel x to [r7+oAIAttackVars_AttackBoost2]
details: Reads the caller's battle object's Alliance field (r5+oBattleObject_Alliance), XORs it with 1
  to get the opposing team, and asks battleObject_findClosestEnemyBattleObject_80103F8 for the nearest
  enemy. It takes that object's panel coords (0x12 = x, 0x13 = y) and passes them with the static table
  pointer off_8111D70 to GetAllianceDependentPanelParamArgs, which yields the panel requirement param
  and args. object_checkPanelParameters tests the enemy's panel against that requirement; on success the
  encoded coords (x | y<<4) are stored to [r4] and the raw x to oAIAttackVars_AttackBoost2, returning
  1, otherwise r0 stays 0 from the check. The XOR-1 alliance flip and the shared param table suggest this
  is used by panel-conditioned enemy attacks whose target panel depends on which side the object is on.
