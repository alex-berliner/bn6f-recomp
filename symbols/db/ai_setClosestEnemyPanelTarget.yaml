name: ai_setClosestEnemyPanelTarget
address: '0x08111C88'
kind: function
status: confirmed
summary: Finds the nearest opposing-team battle object, validates its panel position, and writes the packed target
  coordinates and attack-boost value for the calling AI attack routine.
interface: u32 ai_setClosestEnemyPanelTarget(BattleObject* self /*r5*/, u8* attackTargetByte /*r4*/, AIAttackVars*
  aiVars /*r7*/); returns 1 on success, 0 if target panel invalid; r1 carries panelY<<4, r2 carries check-param
  passthrough; r4 and r7 memory written
details: Flips self->Alliance (XOR 1) to get the opposing team id, then calls battleObject_findClosestEnemyBattleObject_80103F8
  to locate the nearest enemy. Reads the enemy's panel coordinates from byte offsets +0x12 (x) and +0x13 (y). Obtains
  alliance-dependent tolerance arguments via GetAllianceDependentPanelParamArgs using a jump-table at off_8111D70,
  then validates the (x,y) pair with object_checkPanelParameters. On failure (check.r0==0) the function returns
  0 with no writes. On success it packs x | (y << 4) into the single byte at r4 (the AI attack target coordinate)
  and stores panel_x into r7+oAIAttackVars_AttackBoost2. r10 is listed as input in the register contract but is
  never referenced in the body; it is likely a caller-expected frame pointer or loop counter that this routine simply
  preserves by not clobbering. Flags (nzcv) are clobbered by the cmp at the end; r6 is pushed/popped as scratch.
