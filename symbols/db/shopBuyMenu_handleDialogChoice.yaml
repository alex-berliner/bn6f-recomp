name: shopBuyMenu_handleDialogChoice
address: '0x08047066'
kind: function
status: probable
summary: 'Shop buy-menu per-frame step: after the buy menu updates, if the active chatbox dialog finished,
  records the player''s choice into a 0x2420-base event flag and chains the next script.'
interface: (r0 = unused, r5 = shop menu state struct from caller) -> r0 = 0; sets event flag 0x2420 +
  dialog result
details: Per-frame shop-menu callback sharing r5 (shop state struct) with the caller. It first runs the
  buy-menu frame update. It then tests bit 8 of the chatbox/cutscene flag word (chatbox_mask_eFlags2009F38);
  if clear it just returns 0. When the dialog is done, chatbox_8045EEC(0) fetches the dialog result, and
  SetEventFlag(0x2420 + result) records the choice. State byte [r5,#0xd] is set to 0xFF, byte [r5,#1]
  is copied to [r5] (state/step handoff), and chatbox_runScript runs the script at index [r5,#6] from
  the archive pointer [r5,#0x24].
