name: t3_setMapTilesSize64
address: '0x080303F2'
kind: function
status: probable
summary: Resets the map-tiles grid dimensions to 64x64 in the eMapTilesState buffer
interface: () -> void; writes eMapTilesState200be70.MapWidth and .MapHeight = 0x40
details: Loads the address of eMapTilesState200be70 and stores 0x40 into the MapWidth and MapHeight byte
  fields, which sit at offsets 0 and 1 of that structure. It initializes nothing else, so it only sets
  the tile-grid size, leaving other state (likely tile data) to be filled by other code. Its single known
  caller sub_81387D8 presumably invokes this as part of map loading or reset, sizing the grid before tiles
  are populated.
