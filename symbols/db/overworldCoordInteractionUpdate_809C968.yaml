name: overworldCoordInteractionUpdate_809C968
address: '0x0809C968'
kind: function
status: probable
summary: 'Overworld coord-interaction update: records a valid interaction coord (0x30–0x33) into the player object
  while EVENT_1B9 is clear, and otherwise drives a cutscene entry gated by key item count.'
interface: 'void sub_809C968(struct Toolkit *toolkit /* r10 */);

  // r2 produced (callee leftover from helpers); r4-r7, r10 preserved; NZCV clobbered

  '
details: "Reads the global game state through toolkit->gameStatePtr.\nGated by sub_8034C36 and EVENT_224:2 must\
  \ be set, else falls through cleanup.\nWhen EVENT_1B9 (group 1, index 0xB9) is clear:\n  - Requires MapGroup >=\
  \ 0x80, no cutscene script running, and a CoordInteractionValue\n    in 0x30..0x33. Writes that value into eOWPlayerObject+0x83\
  \ and sets EVENT_1B9.\nWhen EVENT_1B9 is set and EVENT_1BA (group 1, index 0xBA) is clear: just sets EVENT_1BA.\n\
  When both EVENT_1B9 and EVENT_1BA are set: looks up a per-map entry via the\n  two-level table at off_809C0F0,\
  \ indexed by (MapGroup - 0x90) and MapNumber.\n  Each row is 0x18 bytes; index = (playerCoord - 0x30).\n  Entry\
  \ layout read: +0x0D required count offset, +0x10 event flag id.\n  If entry's flag already set: bail.\n  If CheckKeyItem(0x2C)\
  \ < entry[+0xD]+1: play SOUND_CANT_JACK_IN and bail.\n  Otherwise StartCutscene(byte_809C354 /* CutsceneScript\
  \ */, entry).\nOn the cleanup path (any non-success exit) EVENT_1BA and EVENT_1B9 are both cleared.\nTouched globals:\
  \ off_809CABC/eOWPlayerObject (+0x83 stashed coord),\n  off_809C0F0/byte_809C354, EVENT_1B9, EVENT_1BA, EVENT_224.\n"
