name: t3_0x66_80D1218
address: '0x080D1218'
kind: function
status: confirmed
summary: Per-frame update for a bomb-type battle object; runs the state handler for the object's current state,
  then refreshes its sprite (including the paused/frozen handling).
interface: void battle_bombObject_perFrameUpdate_80D1218(BattleObject* obj /* r5, may be replaced */); returns the
  possibly-updated object pointer in r5
details: "Called with the battle object in r5 (other input registers r4, r6, r7, r8, r10 are ignored; r8-r12 are\
  \ simply preserved through to the outputs). Reads the object's CurState byte (oBattleObject_CurState) and uses\
  \ it as a raw index into the handler table at off_80D1230, which has exactly three entries:\n  state 0 = battle_initSpawnState\
  \ (spawn/initialise),\n  state 1 = object_bombUpdate_80D12CA (live bomb behaviour),\n  state 2 = battle_destroyWithRelatedUnlink\
  \ (self-destruct and unlink related objects).\nThe dispatch is a tail-style computed jump (mov lr, pc; bx r1)\
  \ with the state in r0 and the table word still in r1, so the handlers can re-enter this dispatcher or return;\
  \ handlers receive and may replace the object pointer in r5. After the handler returns, object_updateSpritePaused\
  \ is always called with that r5 (updates the object's sprite and handles paused objects), and the final r5 is\
  \ returned. This looks like the update routine for the bomb object class (e.g. enemy bomb projectiles) in the\
  \ battle subsystem.\n"
