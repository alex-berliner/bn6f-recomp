name: sub_802A00C
address: '0x0802A00C'
kind: function
status: hypothesis
summary: Returns 1 if the low 9 bits of the given ID equal a special configured value (0x13F in this build), else
  0.
interface: int checkIdMatchesSpecialValue(u32 id); /* preserves r1-r7; returns bool in r0 with Z set iff true */
details: 'Masks the argument down to 9 bits (id & 0x1FF) and compares it against two 32-bit words read through the
  pointer at off_802A028: the word at dword_802A02C and the word at dword_802A030. If the ID equals either word,
  returns 1 in r0, otherwise 0. In this build both words hold 0x13F (319), so the effective check is id == 0x13F;
  the two-entry comparison suggests the words are meant to hold two distinct target IDs (possibly differing in the
  Gregar version or patched at build/patch time). The final MOV r0, r3 uses the flag-setting Thumb encoding, so
  the Z flag is also set when the result is 0 (match) and cleared otherwise, with C/V forced to 0 — callers may
  be branching on Z rather than reading r0. The 9-bit mask implies an ID space of at most 512 entries (text, flag,
  or battle/scene IDs); 0x13F = 319 would be near the top of such a range. Everything except r0 and the flags is
  preserved.

  '
