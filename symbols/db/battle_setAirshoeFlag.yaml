name: battle_setAirshoeFlag
address: '0x0801473C'
kind: function
status: probable
summary: Thunk that sets the AirShoe flag bit in a battle object's ObjectFlags1.
interface: () -> void; r0 input is ignored/clobbered with the flag constant
details: 'Loads #OBJECT_FLAGS_AIRSHOE into r0 and tail-calls object_setFlag1, which ORs the given bits
  into the CollisionData ObjectFlags1 word of some battle object. The wrapper discards any incoming r0,
  so the target object is not passed here — object_setFlag1 must resolve it itself (likely a global/current-object
  pointer). Effect in game terms is enabling AirShoe behavior (walking over tiles without cracking/lifting
  rules) for that object. No other logic, no flags returned.'
