name: chatbox_GetState_8045F4C
address: '0x08045F4C'
kind: function
status: confirmed
summary: Reads the chatbox/text state selector (low 3 bits) from the flags word at eFlags2009F38.
interface: u32 chatbox_GetState(u32 r1_in /* ignored, preserved */); returns state (0-7) in r0, sets NZ flags on
  it
details: Loads the word pointer at eFlags2009F38, then masks it with 7 and returns the result in r0, setting NZ
  from the masked value. r1 is pushed/popped purely to preserve it across the call (callers pass it but the value
  is irrelevant); lr is used as the return address via mov pc, lr. The value at eFlags2009F38 appears to be a global
  chatbox/textbox state enum whose low three bits encode the current mode (0-7), likely checked by callers to decide
  whether a textbox is open/busy before advancing dialogue.
