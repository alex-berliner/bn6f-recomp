name: TryCutsceneSkip
address: '0x08036F84'
kind: function
status: confirmed
summary: Returns true (with SELECT button bit set) when a fade is in progress and the player presses SELECT, letting
  a cutscene be skipped.
interface: bool TryCutsceneSkip(void /* r10 = toolkit */) -> r1 (carry preserved), Z reflects the skip eligibility
  (Z=1 = not eligible because no fade), NZ otherwise reflects (pressed & SELECT)
details: 'Reads the joypad pointed to by r10''s toolkit (toolkit->joypad->pressed). Polls IsScreenFadeActive

  first: if the Z flag comes back set (meaning the screen fade is NOT active), it returns

  immediately with the r1 value IsScreenFadeActive left behind (treated here as "no skip

  possible", Z=1). Otherwise (fade is running) it tests (pressed & JOYPAD_SELECT) and

  returns the SELECT bit in r1 with NZ reflecting whether the bit was held that frame; C is

  preserved from the tst. r3 and r4-r7 are pass-through (r4-r7 explicitly preserved via

  {r4-r7,lr}/{r4-r7,pc}).

  '
