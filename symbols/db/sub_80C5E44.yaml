name: sub_80C5E44
address: '0x080C5E44'
kind: function
status: confirmed
summary: 'Per-frame collision step for a battle object: refreshes its collision data and contact effect, then either
  dispatches the object''s current action handler or tears it down if the battle has ended.'
interface: "void sub_80C5E44(void);\n  // implicit in: r4, r5 (battle object), r7, r8, r10, lr\n  // implicit out:\
  \ r5, r8, r9, r10, r11, r12\n  // clobbers: r0, r1, r2, r3, r6, lr; flags nzcv\n  // preserved: r4, r7\n"
details: 'Reads r5 as the active battle object. Calls object_removeCollisionData,

  then object_spawnCollisionEffect. Reads the object''s oObjectHeader_Flags

  byte at r5+0x10; bit 0x10 forces the "battle-over" branch to be skipped

  entirely. If bit 0x10 is clear and battle_isBattleOver returns nonzero,

  calls object_clearCollisionRegion, writes CUR_STATE_DESTROY into

  r5+oBattleObject_CurStateActionPhaseAndPhaseInitialized and returns.

  Otherwise indexes oBattleObject_CurAction (r5+...) into the dispatch

  table at off_80C5E7C (currently two entries: sub_80C5E84 and

  sub_80C5F0C, called with r0 = action index, r1 = handler address, via

  a `mov lr,pc; bx r1` tail-call) and finally calls

  object_presentCollisionData before returning.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
