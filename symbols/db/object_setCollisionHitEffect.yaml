name: object_setCollisionHitEffect
address: '0x0801A140'
kind: function
status: confirmed
summary: Stores the hit-effect type (e.g. what visual/effect kind a collision hit produces) into a battle object's
  collision data.
interface: void object_setCollisionHitEffect(u8 hitEffect /*r0*/, struct BattleObject* obj /*r5*/); returns r3 =
  obj->CollisionDataPtr
details: 'Reads the battle object''s CollisionDataPtr field (oBattleObject_CollisionDataPtr) from the object

  at r5, then stores the low byte of r0 into offset 9 of the collision data struct

  (oCollisionData_HitEffect). Returns the collision data pointer in r3, likely a side effect of the

  ldr used to load the pointer rather than an intentional output. The hit-effect value presumably

  selects the impact/effect shown when this object''s hitbox connects (element/type of hit reaction).

  Caller must supply r0 (effect id) and r5 (object); r5 being fixed suggests the compiler kept the

  object pointer in a callee-saved register across the call site.

  '
