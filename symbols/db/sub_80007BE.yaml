name: sub_80007BE
address: '0x080007BE'
kind: function
previous_names: []
status: hypothesis
summary: Drains the pending sound-request queue at dword_200A490, dispatching callbacks/continuations and submitting
  a queued SSEQ request to the sound engine.
interface: '(r0..r3 caller-saved, lr restored) -> r0 = 0 ; no other return value; side effects: clears the queue
  and posts one pending request to sound_8000808'
details: "- On entry r5 := pointer to the pending-sound-request state at 0x0200A490 (dword_200A490_p).\n  - If the\
  \ first word (r7 := [r5]) is zero, the queue is empty and execution jumps straight to loc_80007F0, which clears\
  \ [r5] and dispatches the deferred request stored at dword_200A498.\n  - Otherwise the pending counter byte_200A494\
  \ is incremented (mod 0x1A), the deferred-request pointer dword_200A498 is zeroed, and a loop walks r7 16-byte\
  \ entries starting at 0x0200A49C, popping r0..r3 and bx-ing into r3 as a Thumb continuation with r10 stashed on\
  \ the stack across the call.\n  - After the loop clears the head word, the function ldmia's the deferred pointer\
  \ at dword_200A498 and bl-s sound_8000808 to enqueue an SSEQ/bgm request.\n  - The contract is void-like for callers\
  \ (no returned value carries information); main uses it from the captured LR 0x080002d9 each frame as a sound\
  \ flush/dispatch step.\n  - 0x10 in the queue's first word appears to be the number of pending entries r7 (since\
  \ loc_80007E8 sub r7,#1 bne keeps draining); the [r0] dump at 0x0200A870 in the snap_story2_* captures does not\
  \ back this function (LR points at the caller's caller 0x080002d9), so the captured memory is incidental.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- ldr r5, dword_200A490_p and ldr r7, [r5]; the captured pointer is 0x0200A870, a separate struct (likely
    the snap state). - loc_80007DC loops r7 times doing ldmia r6!, {r0-r3} then bx r3 with r10 saved/restored on
    the stack (push/pop {r4}) - classic Thumb trampoline for queueing continuations. - byte_200A494 add #1 cmp #0x1A
    blt / mov r0,#0 implements a mod-0x1A saturating counter (the only place its value is read). - The deferred
    request at dword_200A498 is loaded with ldmia r6!, {r0-r3} and bl sound_8000808, which the project''s summary
    confirms appends a 16-byte SSEQ request to a queue with 32 entries. - Caller chain (main_080002bc) is the only
    call site, lr=0x080002d9 in every captured call.'
