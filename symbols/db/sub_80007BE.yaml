open_questions:
- What the queue's per-entry r0..r3 layout actually represents (callback function in r3, r10-saved context in r10)
  and what writes to dword_200A490 elsewhere set r7 to a non-zero count - knowing any producer of these entries
  would confirm whether r7 is a count or a sentinel.
- The semantics of byte_200A494 (frame counter? 0x1A = 26, suspiciously close to 30 fps vs 26 wrap) - need to find
  its writers.
