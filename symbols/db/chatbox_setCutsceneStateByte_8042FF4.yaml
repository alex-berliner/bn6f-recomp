name: chatbox_setCutsceneStateByte_8042FF4
address: '0x08042FF4'
kind: function
status: confirmed
summary: Chatbox script opcode handler that writes a value from the script into one of the cutscene state's byte
  variables.
interface: Next chatbox_setCutsceneStateByte(u8* cmd /* r4 */, Toolkit* toolkit /* r10 */); returns r0 = 1, r1 =
  stored value, r2 = byte-array base, r4 = cmd advanced by 4
details: 'Script-command handler invoked by the chatbox/cutscene interpreter. Reads a two-byte operand from the
  current command word: cmd[2] is an index (0-255) into a byte array at offset oCutsceneState_Unk_08 within the
  cutscene state struct (reached via toolkit->oToolkit_CutsceneStatePtr), and cmd[3] is the value to store. It performs
  state->bytes[cmd[2]] = cmd[3], then advances the command pointer r4 by 4 bytes and returns the constant 1 in r0
  as the handler''s result code for the interpreter loop. Side-effect register leftovers: r1 holds the value written,
  r2 the byte-array base. Flags: nz set by "mov r0, #1" (so Z=0, N=0), c/v from the final "adds r4, #4" (carry only
  if the command pointer wraps the address space, normally clear).

  '
