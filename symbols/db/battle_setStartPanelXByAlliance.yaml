name: battle_setStartPanelXByAlliance
address: '0x080E9480'
kind: function
status: probable
summary: State handler that snaps a battle object to its side's starting panel column (1 if allied, otherwise
  6), resets its timer, and re-enters the update state.
interface: (r5 = battle object) -> writes oBattleObject_PanelX (1 or 6), oBattleObject_Timer = 0, oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE; no return value; r0/r1 clobbered
details: Reads the object's Alliance byte; a nonzero alliance yields PanelX = 1 (player side column),
  zero yields PanelX = 6 (enemy side column). It then zeroes the 16-bit Timer field and sets the object's
  state word to CUR_STATE_UPDATE, the standard way handlers chain to the generic update phase. The pattern
  (write a state constant into CurStateActionPhaseAndPhaseInitialized, pop {pc}) marks this as a battle-object
  state/action handler taking the object in r5 rather than an ordinary r0-arg function. The choice of
  column 1 vs 6 suggests repositioning something to the far edge of its owner's field area.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#oBattleObject_Alliance]; tst/beq pick 6 or 1, then strb r0,[r5,#oBattleObject_PanelX]
    — column chosen by alliance side; mov r0,#0; strh r0,[r5,#oBattleObject_Timer] — timer reset alongside
    the reposition; mov r0,#CUR_STATE_UPDATE; str r0,[...CurStateActionPhaseAndPhaseInitialized]; pop
    {pc} — terminal state transition, typical state-handler epilogue; No callers/callees known, so behavior
