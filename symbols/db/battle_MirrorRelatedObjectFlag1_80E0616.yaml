name: battle_MirrorRelatedObjectFlag1_80E0616
address: '0x080E0616'
kind: function
status: confirmed
summary: Copies bit 1 of a related battle object's flag byte into this object's flag byte, only when this object
  has extra vars.
interface: void battle_MirrorRelatedObjectFlag1(battle object* this /* r5 */); clobbers r0-r2, sets c/v from (ExtraVars
  == 0)
details: 'Reads the 32-bit ExtraVars pointer at oBattleObject_ExtraVars from the battle object in r5. If it is null,
  the function does nothing except leave c/v set from the CMP with 0. Otherwise it clears bit 1 (0x02) of this object''s
  flag byte (oObjectHeader_Flags, which is read via the same offset on the object base), then reads the RelatedObject1Ptr
  (oBattleObject_RelatedObject1Ptr), takes bit 1 of that object''s flag byte, ORs it into the local flags and stores
  the byte back. Net effect: this object''s flag bit 1 always ends up matching the related object''s bit 1. Only
  r5 (the object) and lr are used as inputs; r1 and r2 are scratch. The literal pool right after the routine points
  at byte_80E0398 (off_80E0634), suggesting this is one entry of a per-type function table.

  '
