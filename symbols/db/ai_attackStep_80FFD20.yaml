name: ai_attackStep_80FFD20
address: '0x080FFD20'
kind: function
status: confirmed
summary: 'Per-frame AI attack step: on first call commits a panel move and starts the attack animation
  with a 2-frame timer, then on expiry stops the animation and triggers the hit.'
interface: 'void ai_attackStep(u32 r5 /*battleObject*/, u32 r7 /*AIAttackVars*/) -> u32 r1 /*from object_setFlag1*/;
  flags: clobbers nzcv'
details: 'Two-phase state machine keyed on AIAttackVars_AttackElement. Init phase (element==0): writes
  element=4 (Wood), CurAnim=3 (attack anim), copies FuturePanelX/Y into PanelX/Y, calls object_removePanelReserve,
  object_setCoordinatesFromPanels, object_updateCollisionPanels, object_clearFlag(0x40 /*panel-occupied*/),
  object_setFlag1(1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT), and sets StepTimer=2. Countdown phase (element!=0):
  decrements StepTimer; while >0 returns early; at expiry writes CurAnim=0 and HitElement=8 to trigger
  damage application. Touches fields: AIAttackVars.{AttackElement,StepTimer,HitElement}, BattleObject.{CurAnim,FuturePanelX/Y,PanelX/Y}.
  Output r1 is a side-effect of object_setFlag1.'
