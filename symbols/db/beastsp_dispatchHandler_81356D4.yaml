  detail: '- `ldrb r1, [r5,#1]` at 0x081356D8 reads a u8 from a struct held in r5; offset +1 matches AIIndex
    in ai_data_struct. - `ldr r0, [r0,r1]` at 0x081356DA does `[base_of_81356E8 + r1] -> r0`, i.e. an
    indexed function-pointer load. - `mov lr, pc` followed by `bx r0` at 0x081356DC-0x081356E0 tail-calls
    the chosen handler (ARM-mode switch via the low bit of the handler address, since the .word entries
    are written as `+1`). - The three handler slots at off_81356E8 are sub_81356F4, beastsp_dispatchHandler_81357C4,
    and sub_8135B54 - all already named in the beastsp_ subsystem, confirming this is a beast-state dispatch
    wrapper. - Captured callers all have lr = 0x08136e13, i.e. sub_8136DE0 (the only listed caller), and
    r3 = 0x02001c04 which is the toolkit''s S2001c04 EWRAM pointer, consistent with the beast-state context.
    - The callees section is empty because the only "calls" are tail-calls via `bx r0` (not `bl`), so
    the static analyser doesn''t record direct `bl` targets.'
