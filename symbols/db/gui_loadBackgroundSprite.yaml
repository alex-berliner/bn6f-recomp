details: 'The function is a thin wrapper: it clears r0/r1 to 0 as the destination tile coordinates, sets
  which_tile_block to 1, and passes the eGuiSprite2022AA0 tile-id array with dimensions 30x14 tiles (240x112
  pixels) to CopyBackgroundTiles. It has no state of its own and no conditional logic. The surrounding
  stubs in the same region call sub_81329C8 with tile blocks 0 and 1 and sizes 0x20/0x10 and 0x20/0x1c,
  suggesting a family of one-shot BG painters for a menu/GUI screen. No registers or flags are meaningfully
  returned.'
