name: ai_attackDispatchByHitElement_80FFB88
address: '0x080FFB88'
kind: function
status: confirmed
summary: Tail-call dispatcher that routes AI attack processing to one of three handlers selected by the
  AI attack vars' HitElement byte.
interface: void ai_attackDispatchByHitElement_80FFB88(AIAttackVars *attackVars /* r7, passed through to
  handler */); tail-calls handler(element, handlerAddr) and forwards its r1/r5/r8-r12 results to the caller
details: "r7 points to the AI attack variables struct; the byte at oAIAttackVars_HitElement\nis loaded\
  \ into r0 and used unscaled as a byte offset into the table at off_80FFB9C\n(so HitElement holds 0/4/8,\
  \ not a 0/1/2 index):\n  +0: ai_attackStepReservePanel\n  +4: ai_attackStrikeStep\n  +8: sub_80FFC5E\n\
  The selected handler is entered as a tail call via `mov lr, pc; bx r1`: lr gets\n0x80FFB94, the address\
  \ of this function's `pop {r7,pc}`, so the pop restores r7\nand returns directly to this function's\
  \ caller. Consequently the handler's results\n(r1 and r5, r8-r12) must pass through untouched, and r0\
  \ (the hit element byte) and\nr1 (the handler's own table entry) are live on entry as leftovers of the\
  \ dispatch.\nTouches no other state besides the jump table.\n"
