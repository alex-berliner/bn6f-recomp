name: battleObject_handleActionCollision_80C9C5C
address: '0x080C9C5C'
kind: function
previous_names:
- sub_80C9C5C
status: probable
summary: Tear down then re-present a battle object's collision data for its current action, or destroy
  it if the battle is over.
interface: '(r5 = oBattleObject*) -> void ; side effects: mutates the BattleObject and its CollisionData,
  may flip CurState to CUR_STATE_DESTROY'
details: "1. Calls `object_removeCollisionData` to drop any collision the object currently owns.\n  2.\
  \ Calls `object_spawnCollisionEffect` to spawn the visual hit/effect.\n  3. Calls `battle_isBattleOver`;\
  \ if non-zero (battle ended), clears the object's collision region and writes CUR_STATE_DESTROY into\
  \ `oBattleObject_CurStateActionPhaseAndPhaseInitialized` and returns.\n  4. Otherwise loads `oBattleObject_CollisionDataPtr`\
  \ and reads `oCollisionData_FlagsFromCollision`; if non-zero, calls `object_clearCollisionRegion` to\
  \ release its current collision slot.\n  5. Indexes a small 2-entry Thumb jumptable at `off_80C9C90`\
  \ by `oBattleObject_CurAction`. The two targets are `battle_objectCountdownFireAttackTick_80C9CA2` (Fire-element\
  \ attack action handler) and `battle_objectDestroyWhenAnimFrameDone_80C9CC4` (wait until animation completes\
  \ then destroy), as indicated by the table labels in the assembly.\n  6. Finally calls `object_presentCollisionData`\
  \ to put the object's collision back into the panel system for the next tick.\n"
