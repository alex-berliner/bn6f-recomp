  detail: '- `bl object_removeCollisionData` then `bl object_spawnCollisionEffect` are the only top-level
    clean-up + VFX calls visible at the entry. - `bl battle_isBattleOver` followed by `tst r0, r0`/`bne
    loc_80C9C98` and the `mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]`
    shows the early-out destroy branch when the battle has ended. - `ldr r7,[r5,#oBattleObject_CollisionDataPtr];
    ldr r0,[r7,#oCollisionData_FlagsFromCollision]; tst r0,r0; beq loc_80C9C7A; bl object_clearCollisionRegion`
    shows the conditional region-clear. - `ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,off_80C9C8C;
    ldr r1,[r1,r0]; mov lr,pc; bx r1` is a Thumb jumptable dispatch by CurAction, with `off_80C9C90` containing
    the two handler pointers labelled in the source. - All five captured snap_battles1 entries return
    `r0 = 02038838` (battle over branch) or `020388e0` (non-battle-over branch), matching the two paths
