name: battle_isBattleOver
address: '0x0800A18E'
kind: function
status: confirmed
summary: Returns whether the current battle is still running (0 means the battle-over conditions are all met and
  the battle should end).
interface: bool battle_isBattleOver(void) — takes the toolkit pointer in r10, returns "battle continues" (1) / "battle
  over" (0) in r0; also returns the battle-state pointer in r3 and the last-tested flag byte in r1, with flags set
  from the final test
details: Reads the current battle state through r10 + oToolkit_BattleStatePtr. The battle is considered over only
  when oBattleState_Unk_12 (a battle-end/round flag) is non-zero AND oBattleState_Unk_13 (a second end-of-battle
  flag) is non-zero AND oBattleState_Unk_0b (likely a "battle restarting / still active" counter or flag) is zero;
  in that case r0 = 0, otherwise r0 = 1 at every early return. r3 ends up holding the battle-state pointer and r1
  the last byte tested, so callers following the register contract can reuse them. The NZ flags on exit reflect
  whichever value was tested last (the "battle over" path leaves the flags set from oBattleState_Unk_0b, the early-exit
  paths from flag12 or flag13), so branch-on-result callers should test r0 rather than the flags unless they know
  the exact path taken.
