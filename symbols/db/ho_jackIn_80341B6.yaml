name: ho_jackIn_80341B6
address: '0x080341B6'
kind: function
status: confirmed
summary: 'Jack-in cutscene step dispatcher: branches on map group (real-world vs internet) and the current step
  byte in byte_2011A40 to call one of six handlers, restoring the caller''s r4-r7.'
interface: void ho_jackIn_80341B6(u32 toolkit /* r10 */, u32 r4, u32 r5, u32 r6, u32 r7 /* preserved across call
  */, u32 r8, u32 r9, u32 r11, u32 r12 /* clobbered in transit */); /* uses lr */
details: "Reads the game-state pointer through oToolkit_GameStatePtr, then peeks oGameState_MapGroup.\nCompares\
  \ mapGroup against INTERNET_MAP_GROUP_START (signed) to pick one of two jump tables:\n  * off_80341DC (real-world\
  \ groups): stepByte 0 -> transmission_BeginTransmissionScene_80341F8,\n    4 -> ho_8034218, 8 -> map_setupEnterMapAfterWarp_803423C.\n\
  \  * off_80341E8 (internet groups): stepByte 0 -> sub_80342DC, 4 -> sub_80342E4,\n    8 -> map_beginEnterMapOnWarpStep4_80342EC.\n\
  stepByte is the current jack-in phase index stored as a byte at byte_2011A40, used as a word\noffset (0/4/8) into\
  \ the chosen table. The selected handler is invoked via `bx r0` with\nr1=stepByte, r2=gameStatePtr, r5=&byte_2011A40,\
  \ and the cmp flags from the map-group test;\nr0-r3 and flags flow back to it. The function restores the caller's\
  \ r4-r7 with pop {r4-r7,pc}.\n"
