name: MapScriptCutsceneCmd_sound_cmd_803810e
address: '0x0803810E'
kind: function
status: confirmed
summary: Map script cutscene command that plays a sound cue and flags the BGM state as changed.
interface: void MapScriptCutsceneCmd_playSound(ScriptCtx* r5, int r7 /*script ptr*/, Toolkit* r10); returns r0=1
  (continue), r1=GameState*, flags NZCV (from add r7,#3 then movs r0,#1)
details: 'Handler for the "play sound" opcode in map/cutscene scripts. Reads two operand bytes from

  the script stream: the first with ReadMapScriptByte in bank 1 (r6=1), the second with bank 2

  (r6=2); the read value is returned in r4. It then calls sound_dispatchCueHandler_800068A with

  r0 = second byte (likely cue/sound id) and r1 = first byte (likely bank/channel/sub-cue).

  After dispatching, it loads the GameState via toolkit->GameStatePtr (r10+oToolkit_GameStatePtr)

  and stores 0x63 into GameState+BGMusicIndicator, the "background music changed" marker the

  audio engine polls so it picks up the new track/cue. It advances the script pointer (r7) by 3

  (opcode + 2 operand bytes) and returns 1 in r0, telling the script interpreter to continue

  normally. r5 and r10 are preserved; r1 is left holding the GameState pointer on return.

  '
