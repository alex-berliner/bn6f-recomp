name: ai_attackRecoveryStep
address: '0x080EE9F2'
kind: function
status: probable
summary: 'AI attack wind-down: once an attack lands/finishes, restores the object''s animation and collision,
  releases its reserved panel, clears AI/obj flags, and counts a short timer before leaving the attack
  state.'
interface: (r5 = battle object ptr, r7 = AI attack vars) -> r0 = undefined; flags from timer decrement
details: 'Guards on oAIAttackVars_AttackElement: if it is 0, this is the one-time recovery setup — animation
  0 via object_setAnimation, collision region 1 via object_setCollisionRegion, release the panel reserved
  at oBattleObject_FuturePanelX/Y, clear AI-data flag 0x200 (ClearAIData_Unk_44_Flag) and ObjectFlags1
  bit 0x40 (object_clearFlag). It then stores StepTimer=5 and sets AttackElement=4 to mark the recovery
  phase. On every later call (AttackElement != 0) it just decrements oAIAttackVars_StepTimer; when it
  goes negative it calls object_exitAttackState. Effectively the post-attack cooldown tail of an AI attack
  routine.'
