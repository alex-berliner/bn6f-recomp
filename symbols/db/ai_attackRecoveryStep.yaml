- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne skips setup on repeat calls; mov r0,#0; bl
    object_setAnimation + mov r0,#1; bl object_setCollisionRegion restore normal pose/hitbox; ldrb FuturePanelX/Y
    + bl object_removePanelReserve frees the reserved attack panel; off_80EEA30 =0x200 -> ClearAIData_Unk_44_Flag
    and 0x40 -> object_clearFlag undo attack-time state; StepTimer=5 countdown then bl object_exitAttackState
