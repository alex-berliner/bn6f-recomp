name: eStruct200A008_setUnk06
address: '0x0800B6DA'
kind: function
status: confirmed
summary: Setter that writes a 16-bit value into offset 0x6 of the fixed overworld struct at 0x200A008 (the struct
  whose end marker is labeled eOWPlayerObjectEnd).
interface: void owStruct200A008_setUnk06(u16 value /* r0 */)
details: 'Trivial Thumb leaf: loads the literal address eOWPlayerObjectEnd (0x200A008 area), then STRH stores r0''s
  low halfword at [r1,#0x6], i.e. global word_200A00E (base 0x200A008 + 0x6). No other registers or flags are touched;
  r1 is scratch. The caller-side analysis shows callers only pass r0 and never read anything back, consistent with
  a pure setter. The +0x6 field of this struct is not yet identified in game terms (it sits right after the eOWPlayerObject-related
  data), so the function is documented as an opaque field writer for the overworld-side struct.

  '
