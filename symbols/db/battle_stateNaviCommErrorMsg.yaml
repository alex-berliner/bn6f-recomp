name: battle_stateNaviCommErrorMsg
address: '0x080095C8'
kind: function
status: probable
summary: Battle state handler that displays a communication-error chatbox script naming the current navi,
  then advances the battle state once the message finishes.
interface: (r5 = *BattleState) -> r0 = void; sets NZ from tst/tst of init flag / eFlags2009F38 bit 0x80
  for internal branches
details: On first call (oBattleState_SubPhaseInitFlag == 0) it reads the selected navi via GetCurPETNavi,
  computes script index 0x73 + naviId, and runs it from TextScriptCommError87370C0 through chatbox_runScript,
  then stores 4 into oBattleState_SubPhaseInitFlag to latch. On later calls it polls eFlags2009F38 bit
  0x80 via chatbox_mask_eFlags2009F38 (the chatbox message-done flag); when set, it stores 4 into oBattleState_Index_01,
  zeroes the halfword at oBattleState_StatePhaseAndInitFlag, and returns, moving the battle state machine
  on. The +naviId offset implies the script archive holds per-navi variants of the comm-error text. No
  return value.
