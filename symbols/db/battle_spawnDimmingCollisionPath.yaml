name: battle_spawnDimmingCollisionPath
address: '0x080C6F50'
kind: function
status: probable
summary: Spawns a line of dimming collision regions from the object forward along its row (up to 4 panels,
  stopping short of a target column), plus a two-tile-tall column at the target column, each lasting a
  set time.
interface: (r0 = lifetime for each region's Timer, r1 = target column; r5 = battle object) -> r0 = last
  spawned region object; no flags of note
details: With r5 pointing at a battle object, it first loops rows PanelY-1 and PanelY at the r1 column,
  validating each with object_isValidPanel, and calls object_spawnDimmingCollisionRegion(col=r1, row,
  element=[r5+Element], 0, types=0x4050201, r6=[r5+DamageAndStaminaDamageCounterDisabler], r7=3), then
  writes r0 into the new object's Timer. It then walks columns PanelX + object_getFrontDirection()*1..4
  on PanelY, spawning the same region on each column, but stops (without spawning) as soon as a column
  equals the r1 target column, so the forward trail never reaches the target column itself. The caller
  must set r5 to the acting object before calling. The 0x3 in r7 and the keep-updating-during-timestop
  property suggest an attack that persists through timestop; the exact move identity is not visible from
  this function alone.
