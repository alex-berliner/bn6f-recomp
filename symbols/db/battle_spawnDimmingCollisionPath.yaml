name: battle_spawnDimmingCollisionPath
address: '0x080C6F50'
kind: function
status: confirmed
summary: Spawns a T-shaped dimming collision region overlay around a battle object, extending vertically across
  three rows at the source column and forward along the facing direction up to four tiles, stamping a caller-supplied
  timer on each region.
interface: void battle_spawnDimmingCollisionPath(u32 timer /*r0*/, u32 source_col /*r1*/, u32 battle_obj /*r5*/)
details: 'Loop 1 iterates row offsets -1, 0, +1 relative to the battle object''s PanelY at the given source_col;
  for each valid panel (checked via object_isValidPanel) it calls object_spawnDimmingCollisionRegion(col, row, element,
  0, 0x4050201 /*region type/subtype*/, obj, DamageAndStaminaDamageCounterDisabler, 3 /*spawn flag*/).

  Loop 2 calls object_getFrontDirection to obtain the facing step vector (x,y encoded as one int), then sweeps steps
  1..4 in that direction from the object''s PanelX/PanelY. It stops early if the scan column wraps back to source_col.
  Each step that does not coincide with the source column spawns a region at (scan_x, PanelY) with the same parameters
  as Loop 1.

  After every successful spawn the returned region pointer''s oBattleObject_Timer (u16) is set to the r0 timer value,
  linking the region''s expiry to the caller''s lifetime request.

  Constants 0x4050201 and 3 are read from literal-pool addresses dword_80C6FC0 / dword_80C6FC4 and describe the
  dimming-region type and spawn mode shared across both loops.

  '
