name: sub_8046670
address: '0x08046670'
kind: function
status: hypothesis
summary: Initializes one 0x58-byte entry of the struct array at 0x2008450 as "type 9", storing an id byte, a parameter
  word, and clearing its counter/state word.
interface: struct* initType9Entry(u8 id /*r0*/, u32 slot /*r1*/, u32 param /*r2*/); returns r0 = pointer to the
  0x58-byte entry, r1 = slot*0x58, flags N/Z from the returned pointer (C set, V clear)
details: "Computes the entry address as eStructArr2008450 + r1*0x58 (a fixed-size record array in IWRAM,\n0x2008450,\
  \ record size 0x58), then fills the header fields of that entry:\n  +0x00 (byte) = 9          - entry type/kind\
  \ marker\n  +0x01 (byte) = r0         - caller-supplied id byte\n  +0x04 (word) = r2         - caller-supplied\
  \ parameter (pointer or value)\n  +0x08 (word) = 0          - counter/state cleared\nIt does not touch any other\
  \ fields of the 0x58-byte record, so the rest of the entry keeps\nwhatever it held before. Returns the entry pointer\
  \ in r0 and, unusually, leaves the scaled\nbyte offset (r1*0x58) in r1; the final \"adds r0, entry, #0\" exists\
  \ only to set flags, so\ncallers could in principle branch on the result. Preserves r4-r7. The type-9 record kind\
  \ and\nwhat the array at 0x2008450 holds (objects, effects, npc slots, ...) are not yet identified,\nhence the\
  \ generic name.\n"
