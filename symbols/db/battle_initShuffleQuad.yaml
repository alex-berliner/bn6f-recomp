name: battle_initShuffleQuad
address: '0x080E2BE0'
kind: function
status: probable
summary: 'Initializes a battle object: stores substate 3, packed packed value 0x030201, and 0; shuffles
  4 bytes at offset 0x64 via ShuffleByteList_PrimaryRNG with 3 swaps; sets timer=12 and enters phase 4.'
interface: (r5 = battle object) -> sets object fields, returns void; r0-r3 clobbered
details: 'Treats r5 as a battle object: stores 3 at oBattleObject_ExtraVars+0, 0 at +8, and the packed
  constant 0x30201 at +4 (three substate values 1,2,3, likely consumed one per later step). It then shuffles
  the 4 bytes at object+0x64 by calling ShuffleByteList_PrimaryRNG with r1=3 random swaps, so the list
  contents are randomized in place using the game RNG. Finally it sets oBattleObject_Timer to 12 and oBattleObject_CurPhaseAndPhaseInitialized
  to 4, moving the object into phase 4 with a short delay. The +0x64 bytes are presumably meaningful identifiers
  or panel/tile indices set elsewhere; the shuffled order drives whatever the object does in phase 4 onward.'
