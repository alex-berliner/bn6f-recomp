name: sprite_getFrameParameters
address: '0x08002DEA'
kind: function
status: confirmed
summary: 'Reads the current animation frame''s rendering parameters (tile index, flip-disable flag, attribute byte)
  from an object''s sprite data table.

  '
interface: 'void sprite_getFrameParameters(ObjectHeader* header /* r5 */) — out: r0 = attribute byte (sprite+2,
  with 0xC0 flip bits cleared when flag byte nonzero), r1 = r2 = frame/tile index byte (sprite+0), r3 = sprite data
  address; flags out: c = 1, v = 0, nz per the flag byte at sprite+1.

  '
details: "Takes r5 = pointer to an object header. Reads the type/sprite-offset byte at header + oObjectHeader_TypeAndSpriteOffset\
  \ (+2), clears its low nibble (so the offset is a multiple of 0x10), and adds it to r5 to reach the object's sprite\
  \ frame table entry. From there it loads:\n  sprite+2 = attribute byte (returned in r0) — bits 0xC0 are H/V flip\n\
  \    flags, which are masked off when the byte at sprite+1 is nonzero;\n  sprite+1 = flag byte (used only for\
  \ the flip-mask test and the flag\n    side effects);\n  sprite+0 = frame/tile index byte, loaded twice and returned\
  \ in both\n    r1 and r2.\nReturns the sprite data address in r3 so callers can read further frame fields. The\
  \ CMP #0 against the flag byte always leaves c set and v clear, with nz reflecting that byte — callers can branch\
  \ on it for free. The duplicate ldrb into r1/r2 is a compiler artifact (same address, same value).\n"
