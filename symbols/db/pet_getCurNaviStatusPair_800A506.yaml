name: pet_getCurNaviStatusPair_800A506
address: '0x0800A506'
kind: function
status: confirmed
summary: Reads a 2-byte status word (low, high) for the navi currently equipped in the PET, returning 0xFF,0xFF
  when no navi data is available.
interface: u8 pair() -> r0 = low byte, r1 = high byte; NZCV set from the final `mov r1, r0` (reflects the high byte);
  preserves r4 and r6
details: 'Calls GetBattleMode first; if the mode is 1 (some non-standard/no-navi battle mode, e.g. a special scenario),
  it immediately returns 0xFF for both bytes. Otherwise it calls GetCurPETNavi() to get the current navi id, then
  uses the byte accessor sub_800A540(navi, offset) three times: offset 0x2D returns an entry selector (an index
  into a per-navi table), and the two status bytes live at offsets (0x56 + 2*entry) and (0x57 + 2*entry) of that
  navi''s data block — i.e. a 16-bit little-endian word indexed by the selector. The low byte is pushed/popped around
  the high-byte fetch because there are no free low registers. Flags on return come from the high byte only. The
  meaning of the 0x56/0x57 table entries is not confirmed from this function alone; callers should reveal what consumes
  the pair.

  '
