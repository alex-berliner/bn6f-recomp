name: folderEdit_step_813388C
address: '0x0813388C'
kind: function
status: confirmed
summary: 'One frame of the folder-edit object step: passes three outer guards, checks an input-locked
  flag and the held-joypad buttons for a folder-edit gesture, otherwise delegates L/R handling to the
  folder-edit helper, and saves state into state 8 when handled.'
interface: void sub_813388C(void); /* uses r5 = folder_obj, r10 = toolkit; clobbers nz c v r0 r1 r2 r3
  r4 r6 r12; preserves r7 r8 r10 */
details: 'Acts as the per-frame dispatcher for the folder-edit object. Inputs are

  r5 = folder object pointer and r10 = toolkit pointer (the standard

  caller convention documented for this subsystem).


  Body runs three sequential guards (sub_8133BB4, sub_8133C0C, sub_8134A3C);

  each must return 0 (Z set) for execution to continue. Any non-zero return

  short-circuits to the post-step tail.


  On continuation it reads folder_obj->0x28 as the input-locked word

  (tst/beq branches). When non-zero it fetches toolkit->oToolkit_JoypadPtr,

  dereferences the joypad struct''s oJoypad_LowSensitivityHeld word, and

  passes it plus (r1=7, r2=0, r3=0xA) into sub_811F7F8, which appears to be

  a generic joypad-gesture matcher. A match (r0 != 0) skips the rest of the

  body.


  Otherwise it calls checkLeftRightInputForFolderEdit_8133E3C with r0=3.

  A non-zero return means L/R was handled and the save is skipped; a zero

  return means save state and set state 8 via

  object_saveStateAndSetState8_8133E7C.


  Tail sub_8134310, sub_81345B0, sub_8134548 run unconditionally on every

  path, so post-step bookkeeping always happens regardless of which branch

  was taken.

  '
