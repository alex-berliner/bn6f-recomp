name: sub_802EF5C
address: '0x0802EF5C'
kind: function
status: hypothesis
summary: If a condition check (sub_800A8F8) reports active, drives the sub_802EF74 state machine twice with argument
  0 then 1.
interface: void sub_802EF5C(void); returns whatever flags/r0-r2 the last callee left
details: 'Tiny wrapper with no state of its own. It first calls sub_800A8F8 (no arguments

  passed); if that returns 0 in r0 the function returns immediately, leaving the

  flags from that cmp r0,#0 as the outgoing condition codes. If the check returns

  nonzero, it calls sub_802EF74 twice in sequence, first with r0=0 and then with

  r0=1. The 0/1 argument pair strongly suggests a two-phase step of some per-object

  or per-effect state machine (e.g. advance phase 0 then phase 1, or clear-then-set

  of a flag), and the guard suggests it only runs while some feature/effect is

  enabled. Without reading sub_800A8F8 and sub_802EF74 it is not possible to say

  which subsystem (sprite, battle effect, text, etc.) is being driven, so the name

  is left as the original and the entry stays a hypothesis. r4-r7 are preserved

  across the whole routine (pushed lr only, callees preserve them).

  '
