name: owMapObject_weatherTornado_80A8E74
address: '0x080A8E74'
kind: function
status: confirmed
summary: 'State dispatcher for the Mr. Weather comp tornado map object (type 0x1A): tail-calls the handler selected
  by the object''s state byte (init / active / caught / free-when-animation-ends).'
interface: void weatherTornadoDispatcher(mapObject in r5, context in r10); r6 = &eWeatherCompState; clobbers r0,r1,r2-r5,r6,r7,r8-r12,NZCV;
  tail-call — handler's registers (r2-r5, r8-r12) are the observed outputs
details: 'Pure dispatcher. Loads the map object''s state byte at [r5,#8] (values 0, 4, 8, 0xC, doubling as byte
  offsets into the table off_80A8E88) and jumps to the corresponding Thumb handler via a computed bx, with push
  {lr}/pop {pc} making it a tail call — the chosen handler returns directly to the map object''s caller. Handlers
  are owMapObject_weatherTornado_init_80A8E9C (state 0), _active_80A8F08 (state 4), _caught_80A8FA0 (state 8), and
  _freeWhenAnimEnds_80A8FE4 (state 0xC). On entry to the handler: r5 = the map object, r6 = address of the shared
  state variable eWeatherCompState (table off_80A8E98), r10 = caller''s context passed through untouched. The dispatcher
  itself clobbers r0, r1, r6, r7 and lr; the handler''s register side effects (r2-r5, r8-r12 plus flags) flow through
  to callers and cannot be expressed as a C return value.

  '
