name: sprite_dispatchObjectUpdate_811BDCC
address: '0x0811BDCC'
kind: function
status: confirmed
summary: Runs one object's per-frame update by dispatching on its kind byte, then advances its sprite unless the
  handler reports no update is needed.
interface: void sub_811BDCC(void) — reads the object pointer from r5; r1 receives the kind byte and r0 the handler
  address for the dispatched call; returns with r0 and NZCV as left by the last called function (sub_811BE90 or
  sprite_update).
details: 'R5 points to the object being updated; the kind byte at R5+9 indexes the dispatch table at off_811BDE8.
  The handler is entered in ARM/Thumb state via `mov lr, pc; bx r0` with the handler''s own address in r0 and the
  kind byte in r1. The built-in table has a single entry, sub_811BDEC (kind 0); any other kind would read past the
  table into the following pool, so kind is effectively always 0. After the handler returns, sub_811BE90 reports
  a status in r0 and leaves the zero flag reflecting it: a zero result means the object''s sprite does not need
  advancing, so sprite_update is skipped and the function returns immediately with sub_811BE90''s flags. Otherwise
  sprite_update runs and its flags are passed through to the caller. LR is used as the return path (push {lr} /
  pop {pc}).

  '
