name: battle_EndObjectCurrentAnim_80C44D2
address: '0x080C44D2'
kind: function
status: confirmed
summary: Ends a battle object's current animation by marking it finished (0xFF) and refreshing the object's animation
  state; a NULL object pointer is a no-op.
interface: void battle_EndObjectCurrentAnim(BattleObject* obj /* r0 */); clobbers r1-r3, sets flags; preserves r4/r5
details: 'Takes a battle object pointer in r0. If the pointer is NULL (tst r0,r0), the function returns immediately
  without touching anything. Otherwise it stores 0xFF into the object''s current-animation slot (oBattleObject_CurAnimCopy,
  byte at r0+offset), which evidently acts as an "animation finished/none" marker, then copies the object pointer
  into r5 and calls sub_801BCD0, which presumably recomputes or resets the object''s animation state for the frame
  (the helper takes its argument in r5 rather than r0). The helper is tail-free; the wrapper just pushes/pops r5
  and lr. Flag behavior is quirky: on the NULL path flags come from the tst r0,r0; otherwise the Thumb "mov r5,
  r0" (really adds r5, r0, #0) is the last flag-setting instruction before the helper call, clearing C and V.

  '
