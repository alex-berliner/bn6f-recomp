name: sub_804754C
address: '0x0804754C'
kind: function
status: confirmed
summary: Uploads the current text window's tile graphics from its staging buffer into the BG tile block and renders
  the text object into the text layer.
interface: (r3 = passthrough context, r5 = text object ptr, r10 = toolkit) -> clobbers r0-r2, r4, r6, r7, lr; preserves
  r5, r8, r9; NZC flags clobbered
details: 'First copies 0x800 bytes (0x200 eight-words) of tile data from the staging buffer byte_2017204 into the
  second half of the toolkit''s BG tile block allocation: the destination is [r10 + oToolkit_iBGTileIdBlocks_Ptr]
  + 0x800, via CopyByEightWords, which preserves r3-r7 and r10. It then reads the text object''s font/gfx pointer
  at +0x24 and calls renderTextGfx_8045F8C with fixed arguments: r1=0x10 (palette/ tile params), r2=unk_2015E00
  (palette data or glyph source), r3=0x6002000 (text layer VRAM char block), r4=r5=1, r6=dword_86A5D60 (a table
  in ROM), r7=0. The staging buffer byte_2017204 is presumably filled earlier by a text-layout step, so this routine
  is the "commit graphics" half of drawing a text window.

  '
