name: weatherComp_checkRingCapture_809019C
address: '0x0809019C'
kind: function
status: confirmed
summary: Scans all rings of the weather component for uncaptured tornadoes, sets the captured event flag, and decrements
  the remaining-capture counter.
interface: 'u32 weatherComp_checkRingCapture_809019C(u32 r5 = weatherCompPtr); /* r10 = context (unused) */ /* returns
  nz: nonzero if at least one ring was captured; r5 preserved */'
details: 'Gate: requires event flag 0xBE8 to be set (returns 0 if clear). Loops ring index from 0 to weatherCompPtr+0xA
  (ring count, u8). For each ring: (1) calls weatherComp_isTornadoInRing_809022C(ring, r5) and skips if no tornado
  (zf set); (2) reads a 16-bit ''processed'' event flag ID from a lookup table at byte_8090226[ring*2] and skips
  if TestEventFlag already has it set; (3) sets the ''captured'' event flag whose ID is in table byte_8090220[ring*2]
  via SetEventFlag; (4) sets local found=1; (5) decrements the remaining-capture u8 counter at weatherCompPtr+0xB
  and breaks the loop if it reaches zero. Returns 1 (nz) if any ring was captured, 0 otherwise. Two static u16 arrays
  (byte_8090220, byte_8090226) map ring indices to event-flag IDs; the exact flag IDs and their narrative meaning
  (tornado-capture side-effects) are in the event-flag table.'
