name: battle_countdownNotifySourceThenDestroy
address: '0x080C10AC'
kind: function
status: probable
summary: Advances the linked sprite, counts a lifetime timer down, and on expiry signals the object that
  spawned it and destroys itself.
interface: (no args; r5 = battle object) -> r0 = result of battle_updateRelatedObjectSprite; destroys
  object by writing CUR_STATE_DESTROY when timer reaches 0
details: The routine first calls battle_updateRelatedObjectSprite for the object in r5, then decrements
  oBattleObject_Timer and stores it back. When the timer hits zero, it loads oAIData_SpawnedSourceObjectPtr
  from the object's AIData pointer and calls sub_80E1A86, which writes 8 into that object's field at offset
  8 (non-NULL only), presumably a request/state code telling the spawner something happened. It then writes
  CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized, ending the object. This
  pattern fits short-lived spawned objects (e.g. AI-summoned entities) that notify their origin before
  vanishing.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_updateRelatedObjectSprite at start runs the linked object's sprite update; ldrh/sub/strh
    on oBattleObject_Timer implements a one-shot countdown; bne skips the expiry block, so the notification+destroy
    happens exactly at timer 0; sub_80E1A86 sets spawned-source object's +8 field to 8 if non-NULL, a
    notification to the spawner; mov r0,#CUR_STATE_DESTROY / str to oBattleObject_CurStateActionPhaseAndPhaseInitialized
    destroys the object
  refs:
  - bn6f/asm/asm31.s:19870
