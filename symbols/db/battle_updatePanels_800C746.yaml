name: battle_updatePanels_800C746
address: '0x0800C746'
kind: function
status: confirmed
summary: 'Per-frame battle update: advances 6 team state counters, resolves queued panel-encounter pair
  events, and ticks the 6×3 field-grid cell timers while toggling alliance-visibility bits.'
interface: 'void battle_updatePanels(void); /* in: none required (reads globals); out: r3 = last grid-cell
  visibility flag, r2 = from callee; clobbers r0 r1 lr NZCV; preserves r4 r5 r6 r7 r10 */'
details: 'Three sequential phases. Phase 1 (teams 1-6): calls sub_800C6F0 for each team, writes 4 bytes
  into the team''s 8-byte record at unk_2034018 + team*8 (offsets +2..+5); if first byte is zero, clears
  the u16 timer at +6; otherwise decrements the timer and sets a flag byte at +1 to 1 when it reaches
  zero. Phase 2 (event queue at byte_203F6B0): walks 4-byte entries (id, step, count, aux) until a 0xFF
  terminator; for each entry it iterates ''count'' panels stepping by ''step'', collects consecutive pairs
  where flag[4] equals value[5] and flag[1] is set, then calls battle_getPanelEntry_800C8C2 and sub_800C81E
  to clear matched pairs. Phase 3 (6×3 grid via object_getPanelDataOffset): copies Alliance byte to Unk_07,
  decrements u16 Unk_10 timer, and XORs bit-2 of the decremented timer into Unk_07 to toggle visibility.
  The final r3 (last cell''s visibility) is read back by callers.'
