name: NPCCommand_set_sprite
address: '0x0809EF00'
kind: function
status: confirmed
summary: NPC script command that assigns a sprite id to an overworld NPC, applying special-case palette/hidden-OAM
  overrides from a lookup table.
interface: void NPCCommand_set_sprite(OverworldNPCObject* npc /*r5*/, const u8* cmdStream /*r6*/); // sets nz/c/v
  from r6 += 2, clobbers r0-r3, preserves r5
details: 'Handles one opcode of an overworld NPC script/command stream. r5 points at an

  OverworldNPCObject and r6 at the current command; the command''s second byte

  ([r6+1]) is a sprite id. The routine stores the id into

  OverworldNPCObject_NPCSprite (halfword), resets PaletteIndex to 0 and

  HiddenOAMPieces to 0, then walks OverworldNPCSpriteVariations (3-byte entries:

  {u8 SpriteId, u8 HiddenOAMPieces, u8 PaletteIndex}, terminated by SpriteId 0xFF)

  looking for a matching sprite id. On a match, the entry''s HiddenOAMPieces is

  copied into the object''s HiddenOAMPieces field shifted left by 24 (the count

  lives in the top byte of the 32-bit field, matching the original''s

  lsl r0,#24 store), and its PaletteIndex overwrites the object''s palette index.

  If the search hits the 0xFF terminator first, the defaults just written remain.

  Afterwards NPCSpriteCategory is forced to 0x18 (the standard NPC sprite

  category) and the shadow flag (OW_NPC_UNK_FLAGS_60_SHADOW_FLAG_0x80, bit 0x80)

  is cleared in OverworldNPCObject_UnkFlags_60, so a newly set sprite never

  starts with a shadow. Finally r6 is advanced past the 2-byte command and the

  ADDS that does so sets the flags for the dispatcher; lr is moved to pc, so the

  command handler table returns through lr.

  '
