name: battle_objectPhasePlaySfxThenEnd
address: '0x080C1AB8'
kind: function
status: probable
summary: 'One-time phase handler for a battle object: plays sound effect 0x94, switches to animation 3,
  waits 3 frames, then advances the object to CurAction 4.'
interface: (r0 = scratch, uses r5 = battle object pointer) -> void; sets PhaseInitialized, CurAnim, object
  flags bit 1, Timer; on expiry sets CurAction=4 and clears CurPhaseAndPhaseInitialized.
details: Runs as a per-phase/state handler with the battle object in r5. On first entry (PhaseInitialized
  == 0) it marks the phase initialized with 4, sets CurAnim to 3, ORs bit 1 (0x2) into the object header
  flags, plays M4A sound effect 0x94, and loads Timer with 3. On subsequent frames it decrements Timer;
  when it hits zero it sets CurAction to 4 and clears the phase/initialized halfword, handing control
  to the next action. The 3-frame delay plus a sound cue suggests a short one-shot effect (e.g. an object
  finishing/spawning with a sound) rather than player-visible behavior.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oBattleObject_PhaseInitialized with 'mov r0,#4; strb' is the standard once-per-phase
    init idiom; mov r0,#3; strh [r5,oBattleObject_Timer] followed by a decrement loop is a 3-frame delay;
    bl PlaySoundEffect with r0=0x94 fires a sound exactly once at phase start; on Timer expiry it stores
    CurAction=4 and zeroes CurPhaseAndPhaseInitialized, ending the phase; sets oObjectHeader_Flags bit
    0x2, likely marking the object as animating/updated
