name: snakearm_dispatchScriptStep
address: '0x08112A4A'
kind: function
status: confirmed
summary: Thunks one SnakeArm boss-AI script step by jumping into the handler selected via the script-ID byte in
  the AI state.
interface: snakearm_dispatchScriptStep(r4, r5, r6=aiState, r7, r10, lr) -> r1, r5, r8, r9, r10, r11, r12; preserves
  r4, r6; clobbers r0, r2, r3, r7, lr, nzcv
details: Reads the script-ID byte at aiState+oAIState_ScriptId (offset 0 within the AI state struct). Uses that
  byte as a raw (unscaled) word offset into the two-entry jump table at off_8112A5C, so script id 0 selects battle_aiSnakeArmStepInitStage4
  and script id 4 selects battle_aiSnakeArmTickStep_8112A78. Loads the handler address into r1, sets r0 to the script
  id, and calls through r1 with bx r1. The entire caller register file (except r0 and r1 as noted) is passed through
  to the handler; the handler's writes to r5 and r8-r12 become this thunk's outputs. r4 (loop counter or scratch)
  and r6 (AI state pointer) are pushed/popped to survive the call. The thunk itself has no game logic; it is a per-boss
  dispatch trampoline that lets the battle-AI tick loop call the correct step handler generically.
