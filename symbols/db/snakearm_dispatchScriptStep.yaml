open_questions:
- Why is the script-ID offset unscaled (byte value, not multiplied by 4)? Likely the two handlers expect ids 0 and
  4 to match the +4 word stride, but the game may write 4 directly rather than 1.
- Is there a larger jump table elsewhere for other bosses, or is this two-entry table unique to SnakeArm?
- What registers does each handler actually read beyond the full file? The contract only records what the dispatch
  thunk preserves/clobbers.
