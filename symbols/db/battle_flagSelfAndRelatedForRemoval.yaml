name: battle_flagSelfAndRelatedForRemoval
address: '0x080E14AC'
kind: function
status: probable
summary: Sets the deletion flag bit (0x2) on the battle object's header, calls teardown sub_80E0DD0 on
  its subordinate (if non-NULL), and sets the same flag on oCollisionData_LastHitObjectPtr and the object
  at collision_data+0x4C (each if non-NULL); finally dispatches state 1 via dispatch_801DA48.
interface: (r0 = battle object) -> r0 = dispatch_801DA48 result; destroys nothing directly but sets oObjectHeader_Flags
  |= 2 on up to four objects
details: Reads the collision-data pointer from the battle object and unconditionally sets bit 1 (0x2)
  of the object's own oObjectHeader_Flags, a flag the engine evidently treats as 'remove this object'.
  It then does the same to the subordinate object via oAIData_SubordinateObjectPtr (calling sub_80E0DD0
  on it, likely its own teardown/destructor), to the object in oCollisionData_LastHitObjectPtr, and to
  the object stored at collision data +0x4C, each only if non-NULL. Finally it calls dispatch_801DA48
  with r0=1, the standard one-shot state-dispatch idiom used by one-frame object states. The caller at
  0x80C0EE2 waits 4 frames after a one-shot setup call and then queues its object for destruction, matching
  a self-destruct-with-victims behavior (e.g. a bomb, trap or panel-clearing attack entity).
