name: battle_objectActPlayAnimAdvance
address: '0x080B9CDC'
kind: function
status: probable
summary: 'Battle-object action handler: starts a short animation (anim 3) with SFX 0x94, waits 3 frames,
  then hands control to action 4.'
interface: (r5 = battle object) -> void; sets oBattleObject_CurPhase/Anim/Flags/Timer, then CurAction
details: Runs on a battle object pointed to by r5. On phase 0 it latches phase 4, sets CurAnim = 3, plays
  sound effect 0x94, sets bit 1 (0x2) of oObjectHeader_Flags, and stores 3 into the packed TimerAndTimer2
  field. On later phases it decrements oBattleObject_Timer; when it hits 0 it writes CurAction = 4 and
  clears the phase/phase-initialized halfword so the next action begins. This is the classic BN6 pattern
  of an action step that plays an anim+SFX for a fixed delay and then chains into a follow-up action;
  what action 4 is (and thus what this action depicts) is not determinable from this code alone.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'strb r1=4,[r5,#oBattleObject_CurPhase] plus mov r0,#3; strb [..CurAnim]: selects phase 4 and
    anim 3; mov r0,#0x94; bl PlaySoundEffect: plays SFX 0x94 during the anim; orr with #2 into oObjectHeader_Flags:
    marks object with flag bit 1 for the duration; mov r0,#3; str [r5,#oBattleObject_TimerAndTimer2]:
    3-frame wait before advancing; timer countdown then strb #4,[CurAction] and phase clear: chains into
    action 4'
