name: getByteInStructArray
address: '0x08021D2A'
kind: function
status: probable
summary: Returns one byte from field r1 of record r0 in a table of 0x170-byte entries at 0x203A0A0.
interface: (r0 = record index, r1 = byte offset within record) -> r0 = byte value; flags clobbered by
  mul/add
details: 'Pure thumb getter: multiplies the index by the constant record size 0x170 (0x170 = 368 bytes
  per entry), adds it to the table base unk_203A0A0 in IWRAM, loads an unsigned byte at [base + index*0x170
  + r1], and returns it in r0. It writes nothing and touches no other state, so it is a field accessor
  for whatever 0x170-byte-stride structure lives at 0x203A0A0. The large stride suggests a fixed array
  of sizeable records (objects, NPCs, or similar), but the asm alone does not reveal which.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r2, off_8021D9C (=0x170); mul r2, r0 — constant 0x170-byte record stride indexed by r0;
    ldr r0, off_8021DA4 (=unk_203A0A0); add r0, r0, r2 — table base in IWRAM plus record offset; ldrb
    r0, [r0,r1]; mov pc, lr — byte load at caller-chosen field offset, no side effects
  refs:
