name: ai_handleHitInterrupt
address: '0x080DA248'
kind: function
status: probable
summary: If the AI object's extra-vars flag at +0x66 is set, clears the pending attack-hit state and switches
  the object to action 9 at phase 0.
interface: (r5 = battle object; no args) -> r0 = 0 on the transition path; modifies object fields, no
  flag guarantee
details: 'Reads the object''s oBattleObject_ExtraVars pointer (r5 +offset) and bails out if it is null
  or if byte +0x66 is zero. Otherwise it calls ai_attackHitClearState8, which clears the flag behind the
  extra-vars +0x60 pointer and resets the AI attacker''s +8 state/timer to 8, then writes CurAction =
  9 and clears CurPhaseAndPhaseInitialized (halfword = 0) on the object. It therefore acts as a conditional
  interrupt/reaction step in an AI action script: a side flag set elsewhere (e.g. by a hit or custom behavior)
  reroutes the object into action 9 after cleaning up an in-flight attack.'
