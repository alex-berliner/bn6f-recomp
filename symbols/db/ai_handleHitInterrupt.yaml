- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r0,#0x66] / beq: only proceeds when extra-vars flag 0x66 is set; bl ai_attackHitClearState8
    matches the known ''attack resolves'' cleanup helper; strb #9,[r5,#oBattleObject_CurAction] + strh
    #0 to CurPhaseAndPhaseInitialized = restart at action 9, phase 0; null check on oBattleObject_ExtraVars
    guards the whole routine'
