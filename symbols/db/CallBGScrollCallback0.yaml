name: CallBGScrollCallback0
address: '0x08001994'
kind: function
status: confirmed
summary: trampoline that loads slot 0 of eBGScrollCallbacks and tail-calls its handler
interface: void CallBGScrollCallback0(void) // reads handler via r0=handler,r1=tableBase at the bx; r4-r12 forwarded,
  r0-r3+flags clobbered by the handler
details: 'Pushes lr, loads the BG scroll callback table base (eBGScrollCallbacks) into r1

  and the slot-0 entry (oBGScrollCallbacks_Callback0) into r0, then does the

  standard Thumb "mov lr,pc ; bx r0" hand-off to a guest/handler address that is

  only known at run time. The pop {pc} returns straight into the calling

  routine, so r4-r12 are visible to that caller as forwarded outputs (no save

  of those registers is performed by this stub); r0-r3 and flags belong to the

  handler. The handler is therefore called with (r0 = handler pointer,

  r1 = eBGScrollCallbacks table base), and that convention is part of the

  table''s slot-0 contract.

  '
