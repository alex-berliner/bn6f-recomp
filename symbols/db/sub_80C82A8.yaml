name: sub_80C82A8
address: '0x080C82A8'
kind: function
status: confirmed
summary: Allocates a spawn-type-0x20 battle object and wires it to a related object, copying its panel coordinates,
  element, alliance/direction-flip, and counter-disabler value from caller-supplied registers.
interface: "u32 sub_80C82A8(u32 r0_panelX, u32 r1_panelY, u32 r2_element,\n                u32 r5_relatedObject,\
  \ u32 r6_counterDisabler);\n// returns the spawned object pointer in r0 (also preserves caller's r5/r6/r7);\n\
  // r2/r5/r7 clobbered; N/Z/CV from \"mov r0, r5\" on success\n"
details: "Spawns a new battle object via object_spawnType3 with spawn type 0x20.\nIf allocation succeeds, the new\
  \ object has set:\n  PanelX          = caller's r0\n  PanelY          = caller's r1\n  Element         = caller's\
  \ r2\n  RelatedObject1Ptr = caller's r5 (the source object)\n  DamageAndStaminaDamageCounterDisabler = caller's\
  \ r6\n  AllianceAndDirectionFlip = copied halfword from caller's r5 (the related object)\n  HeaderFlags bit 0x10\
  \ (\"has related object\") OR-ed in\nThe push/pop shuffle ensures the caller's r0/r1/r2 are reloaded into\nr1/r2/r3\
  \ from the stack before the stores, and that r5/r6/r7 are\npreserved across the call (r5 holds the related-object\
  \ pointer again\nafter the pop). The \"mov r0, r5\" in the original is really an lsls that\nalso updates N/Z flags\
  \ from the new object pointer. On failure, r1/r2/r3\nend up holding the caller's r0/r1/r2; on success, r1=0x10\
  \ and r2 holds\nthe updated header flags, r3 holds the copied alliance halfword.\nLikely used to spawn things\
  \ like damage counters, status effect\nindicators, or sub-objects that attach to a parent battle object.\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
