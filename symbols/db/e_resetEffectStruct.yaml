name: e_resetEffectStruct
address: '0x08143F20'
kind: function
status: probable
summary: 'Initializes the eStruct2001010 effect state: selects effect type 5 and clears its 0x40-byte
  data block.'
interface: () -> r0 = 0; no flags meaningful
details: Takes no arguments and first calls initMinigameEffect_8003a64 with 5, which presumably records
  the active effect/kind in eStruct2001010's header. It then zero-fills the 0x40-byte payload at eStruct2001010+8
  via ZeroFillByWord (BIOS CpuSet with a fixed zero word), wiping whatever per-effect state lives there.
  Returns 0 in r0, so callers can treat it as a success/status value. The unused r4-r7 push/pop suggests
  copy-pasted boilerplate from larger sibling functions. It is effectively a 'reset the effect struct
  to defaults' routine tied to effect id 5.
