name: clampPlayerPosition_809E3D6
address: '0x0809E3D6'
kind: function
status: confirmed
summary: 'Overworld per-frame clamp: pushes the player object''s X/Y coordinates out to the bounding box
  stored in eStruct2000aa0 when its enable flag is set.'
interface: 'void sub_809E3D6(u32 /* r10 */ in toolkit, LR: out); clobbers NZCV, r0, r1; preserves r4-r7.'
details: 'Reads the engine state toolbox via r10 to obtain oGameState_OverworldPlayerObjectPtr

  (offsets 0x1C / 0x20 hold the player''s primary/secondary axis coordinates, 0x28 / 0x2C

  are swapped into them on snap). Compares them against four s32 limits from

  eStruct2000aa0: high/low of primary axis at offsets 0xC / 0x14, and high/low of

  secondary axis at 0x10 / 0x18. When the current value is past a limit the coordinate

  is snapped to the limit and the other axis is taken from the swapped copy (0x2C into

  0x20, or 0x28 into 0x1C) — likely the "previous tick" position used for friction-style

  resolution. Early-returns if the enable byte at eStruct2000aa0+0xB is 0. The

  oGameState_MapGroup compare against 0x80 is dead — its only purpose is to give the

  pipeline a delay slot before the player pointer load.

  '
