    guarded by cmp [r5], #0x28 / beq: runs game text script 1 unless mode is 0x28; strb #0x2C,[r5,#3]
    then bl navicust_drawBoardTilemap(0): advances state id and redraws the customizer board; strb #0,[r5,#0x13]
