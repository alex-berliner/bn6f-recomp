name: navicust_stateWaitFramesThenAdvance
address: '0x08136A74'
kind: function
status: probable
summary: 'Navi Customizer screen state handler: counts ~32 frames, optionally runs a text script once,
  then moves to state 0x2C and redraws the board.'
interface: (r0 = unused/overwritten, r5 = navi-cust screen state struct) -> r0 = 0; updates [r5+0x03]
  state id, [r5+0x12] timer, [r5+0x13] flag
details: 'r5 points to the navi-cust screen state/task struct (state id at +0, phase at +3, frame counter
  at +0x12, per-frame flag at +0x13). Each call increments the timer at +0x12; once it reaches 0x20 (32
  frames), the wait is over: unless the mode byte [r5] equals 0x28, it runs text script 1 via chatbox_runScript,
  then sets phase +3 to 0x2C, calls navicust_drawBoardTilemap(0) to refresh the grid, and clears the timer.
  The +0x13 byte is reset to 0 every call, likely a one-shot/subflag consumed elsewhere. With script 1
  skipped only in mode 0x28, this reads as a timed delay state that (re)displays a message before handing
  control to the next state.'
