- The specific "kind" of battle object this initializes (chip effect, panel attack, obstacle, etc.) is
  unclear — Param3==0/1/other is just three values feeding a small switch, but the meaning of those values
  and what 0xa/5 represent in object_setupCollisionData isn't documented. Cross-referencing callers would
  pin the role.
