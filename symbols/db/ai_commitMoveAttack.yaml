name: ai_commitMoveAttack
address: '0x08111A28'
kind: function
status: probable
summary: 'AI attack step: if the object can act and the target panel matches its required panel flags,
  it reserves that panel, marks itself unable to slide, plays its attack animation/boost state, and launches
  the attack; otherwise it aborts and exits the attack state.'
interface: (r4 = object ptr, r5 = object ptr, r7 = oAIAttackVars*) -> r0 = 1 when the attack was committed;
  no meaningful flags
details: Reads the AI attack variables (TargetPanelX/Y, AiAttackParam, PanelParamFlags2) from the r7 AI
  state. If object_canMove passes and object_checkPanelParameters accepts the target panel, it writes
  TargetPanelX/Y into the object's FuturePanelX/Y, reserves the panel for itself, ORs OBJECT_FLAGS_CANNOT_SLIDE
  into its ObjectFlags1, sets oBattleObject_CurAnim to 1, sets AttackBoost2 to 0x10 and HitElement to
  4, then calls sub_8111B06 and sub_8111A72 (likely spawning the attack hitbox/animation). On any failure
  it clears oAIAttackVars_HasMoved and calls object_exitAttackState to return to idle.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_canMove / beq loc_8111A68 guards the whole commit path; bl object_checkPanelParameters
    validates the target panel against AiAttackParam/PanelParamFlags2 before committing; bl object_reservePanel
    + object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE) claim the panel and prevent sliding during the move;
    strb #1 -> oBattleObject_CurAnim and strb #0x10 -> oAIAttackVars_AttackBoost2 set up attack state;
    failure path: strb #0 -> oAIAttackVars_HasMoved then bl object_exitAttackState'
