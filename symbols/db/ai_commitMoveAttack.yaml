name: ai_commitMoveAttack
address: '0x08111A28'
kind: function
status: confirmed
summary: Commits an AI battle object's planned move onto its target panel and launches the attack, or abandons the
  move if the object cannot move or the panel is no longer valid.
interface: void ai_commitMoveAttack(u32 r5 obj, u32 r6 auxState, u32 r7 aiAttackVars) -> r1, r5 (flags clobbered)
details: 'Part of the battle AI attack state machine. r5 is the battle object, r6 an auxiliary

  state pointer, r7 the per-attack AI variable block (oAIAttackVars_*).


  Success path: if object_canMove(r5) succeeds (Z clear), the stored target panel

  coordinates (oAIAttackVars_TargetPanelX/Y), plus oAIAttackVars_AiAttackParam and

  oAIAttackVars_PanelParamFlags2, are re-validated with object_checkPanelParameters.

  If still valid, the move is committed: the target panel is written into

  oBattleObject_FuturePanelX/Y on the object, object_reservePanel reserves it, and

  object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE) locks the object from sliding. The object''s

  animation is set to 1 (oBattleObject_CurAnim), the attack vars record AttackBoost2 = 0x10

  and HitElement = 4 (oAIAttackVars_HitElement, halfword), then sub_8111B06 and

  sub_8111A72 fire the attack; sub_8111A72 can return a replacement object pointer in r5

  along with r1.


  Failure path (either check fails): clears oAIAttackVars_HasMoved to 0 and calls

  object_exitAttackState to leave the attack state.


  Quirks: the original passes r0=0 to object_exitAttackState but that callee only reads

  r5/r6/r7. On failure r5 is returned unchanged; on success r5 comes from sub_8111A72.

  '
