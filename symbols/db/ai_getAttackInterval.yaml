name: ai_getAttackInterval
address: '0x080FEABC'
kind: function
status: probable
summary: Returns an attack interval halfword (180/240/300/360) from a table indexed by AI difficulty tier.
interface: (r0 = unused) -> r0 = interval halfword from table [180,240,300,360]; flags from the ldrh
details: Calls battle_getAiDifficultyTier_800FE36 to read the enemy AI data's difficulty byte (tier 0-2
  for AI version 4), doubles the tier as a halfword index, and loads a 16-bit value from byte_80FEAD0.
  The table contains 0xB4=180, 0xF0=240, 0x12C=300, 0x168=360, values that look like frame durations increasing
  with difficulty (though difficulty rising giving shorter waits would suggest the caller subtracts or
  the ordering needs checking). Its only caller, ai_circusmanInitAttackState (0x080FEB9E), fills attack
  parameters after picking the player as target, so this value is presumably the wait time before or duration
  of attack id 0xC.
