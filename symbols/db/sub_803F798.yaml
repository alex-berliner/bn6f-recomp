summary: 'Entry stub of a multi-entry routine: saves r1-r7 and lr, seeds the shared body''s loop counter (r4) to
  0, then falls through into the shared code at loc_803F7A2.'
interface: void sub_803F798(void); // caller's r1-r7 and lr are spilled to the stack by the stub itself; returns
  to the caller via the shared body's pop {r1-r7,pc}
details: 'This is not a standalone function but one of several entry points into a shared routine body at loc_803F7A2.
  The stub executes `push {r1-r7,lr}` (32 bytes: r1,r2,r3,r4,r5,r6,r7 at frame+0x00..0x18 and the return address/lr
  at frame+0x1C), sets r4 = 0 as the initial value of the counter used by the shared body, and then continues directly
  into loc_803F7A2. The shared body''s epilogue pops {r1-r7,pc}, so the values pushed here are restored to the caller
  on return and the return goes to the original caller''s lr. Sibling entry points presumably exist that push the
  same frame but seed r4 with different starting values, making this the "start from 0" variant of a dispatch/loop
  family. Without reading loc_803F7A2 there is no evidence of which game system (text, battle, sprites, etc.) the
  shared body serves, so no subsystem prefix can be justified.'
