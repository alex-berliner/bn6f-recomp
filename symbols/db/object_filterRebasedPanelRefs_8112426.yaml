name: object_filterRebasedPanelRefs_8112426
address: '0x08112426'
kind: function
status: confirmed
summary: Rewrites a list of packed panel-reference bytes, rebasing each relative direction against the
  object's facing and dropping entries whose adjusted panel is invalid.
interface: (int count in r0, void *object in r5, u8 *srcList in r7) -> int writtenCount in r0
details: 'Each source byte packs a panel reference: high nibble (bits 4-7) is a type/flags nibble, low
  3 bits (bits 0-2) are a direction index relative to the object. The routine first calls object_getFrontDirection
  on the object (r5) and GetAllianceDependentPanelParamArgs with a lookup from table byte_81125E0 (indexed
  via r3, set from the object) to get the side/alliance panel parameters (returned in r2/r3, stashed across
  the loop via a pushed r7+0x10 pointer). It then walks the source list at r7 for count (r0) entries:
  for each byte it splits flags and direction, subtracts the front direction from the direction (mod 8
  via masking), and calls object_checkPanelParameters(direction, flags, side params); if it returns nonzero,
  the byte is repacked as (flags << 4) | adjustedDirection and stored into the output list, which starts
  at srcList + 0x10 (i.e. the filtered list is written in place right after the input region). Invalid
  entries are skipped, compacting the list. Returns the number of bytes written (dst - dstStart). Quirks:
  the loop is do/while with a pre-decrement counter, so count 0 wraps and processes 4G entries in principle;
  r4-r7 are preserved but also appear in the contract''s outputs because the epilogue pops them back,
  leaving them unchanged.

  '
