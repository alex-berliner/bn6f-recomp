open_questions:
- Exact meaning of the request bits 0x80, 0x10, 0x20, 0x400, 0x20000 in the eStruct1 request system (likely
  battle_801DA48 / eStruct2035280_SetRequestBits_801BECC).
- Semantic meaning of battle_state[7] (path selector) and of battle flag 0x40 (battle_testFlag0x40_800A8F8)
  — they choose between the gauge-init and the end-of-turn cleanup variants.
- What render_info+0x18 actually counts (cleared at the top, presumably the "trigger pending" field used
  by the gauge HUD).
- Difference between sub_801DF0C / sub_801DEEE / custGauge_Init_801DED0 (the three "path 1" cleanup variants)
  and between the 0x20 vs 0x10 mode-dependent requests.
