name: battle_customGauge_EndTurn_8027D78
address: '0x08027D78'
kind: function
status: probable
summary: 'Per-turn Custom Gauge housekeeping for the battle UI: resets the gauge, dispatches ending/init
  requests, and routes to the appropriate end-of-turn cleanup based on battle state, mode, and the 0x40
  battle flag.'
interface: 'void sub_8027D78(void);  // inputs: r10=oToolkit (render-info + battle-state ptrs), lr=return;
  outputs: none; clobbers r0-r3, r12, N Z C V; preserved r4-r9, r11'
details: "Operates on the Battle Toolkit (r10) which yields oToolkit_RenderInfoPtr and\noToolkit_BattleStatePtr.\
  \ First writes 0 to render_info+0x18 (clears a pending-trigger\ncounter), then drives the standard battle\
  \ Custom Gauge init sequence:\n  sub_801E71C        // gauge display reset\n  dispatch_801DACC(0x80)\n\
  \  sub_801E0A0(0, 0)  // clear gauge counter\nthen unconditionally sets the 0x400 \"ending\" request\
  \ via\nSetRequestBits_801BECC followed by dispatch_801DA48 (note this path reverses the\norder seen\
  \ in every other branch: SetRequestBits first, then dispatch).\n\nIf battle_IsBattleEnding_800A97A returns\
  \ true, the function exits early.\n\nOtherwise it reads battle_state[7] as a path selector:\n  - path\
  \ == 1: if battle_testFlag0x40_800A8F8 -> sub_801DF0C; else if\n    GetBattleMode==1 -> sub_801DEEE;\
  \ else custGauge_Init_801DED0.\n  - path != 1: if battle_testFlag0x40 -> request bits 0x20000\n    (dispatch\
  \ then SetRequestBits); else ClearCustGauge, then if mode==1\n    request bits 0x20, else request bits\
  \ 0x10 (always dispatch then SetRequestBits).\n\nThe asymmetry between the unconditional 0x400 path\
  \ (SetRequestBits-then-dispatch)\nand the 0x20000/0x20/0x10 paths (dispatch-then-SetRequestBits) is\
  \ preserved from\nthe original code and looks intentional.\n"
