name: battle_customGauge_EndTurn_8027D78
address: '0x08027D78'
kind: function
status: confirmed
summary: End-of-turn Custom Gauge handler that clears the gauge state, posts an end-of-turn request, and dispatches
  the correct teardown/init path based on battle state, flag 0x40, and battle mode.
interface: 'void battle_customGauge_EndTurn_8027D78(void);

  // in: r10 = Toolkit pointer, lr = return

  // out/clobber: r0-r4, r8-r12; flags n/z/c/v

  '
details: "Reads Toolkit->RenderInfoPtr via r10, zeroes the halfword at offset 0x18\n(pending-trigger field). Then\
  \ calls three gauge helpers with r0=0\n(sub_801E71C, sub_801E0A0) and one dispatch with r0=0x80\n(dispatch_801DACC).\
  \ Posts the 0x400 ending request pair\n(SetRequestBits_801BECC then dispatch_801DA48). If\nbattle_IsBattleEnding_800A97A\
  \ returns nonzero, returns early.\n\nOtherwise reads byte 7 of Toolkit->BattleStatePtr:\n  - ==1 (normal ending):\n\
  \      * if battle_testFlag0x40_800A8F8 -> sub_801DF0C (flag-set end)\n      * elif battle mode == 1 -> sub_801DEEE\n\
  \      * else custGauge_Init_801DED0 (re-init gauge)\n  - !=1 (alternate):\n      * if flag 0x40 set -> post request\
  \ 0x20000 (SetRequestBits + dispatch)\n      * else ClearCustGauge; then if mode == 1 post 0x20, else post 0x10\n\
  \        (each as SetRequestBits_801BECC + dispatch_801DA48 pair)\n\nRequest-bit values seen: 0x400 (ending),\
  \ 0x80 (end-of-turn dispatch),\n0x20000, 0x20, 0x10.\n"
