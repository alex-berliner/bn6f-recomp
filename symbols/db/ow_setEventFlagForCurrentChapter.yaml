name: ow_setEventFlagForCurrentChapter
address: '0x0808FCB0'
kind: function
status: probable
summary: Sets the story event flag that corresponds to the player's current scenario/chapter.
interface: (no args) -> r0 = 0; flags from SetEventFlag call
details: Fetches a progress-struct pointer from [r10, 0x3C]. Reads the byte at offset 4; if it equals
  0x85 it substitutes the constant 3, otherwise it reads the byte at offset 5 instead. Doubles that value
  (halfword index) and loads a flag ID from the table at byte_808FCD8, then calls SetEventFlag with it.
  Always returns 0. The 0x85 special case likely maps a particular chapter to a shared or fallback flag
  index.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r0,#4] / cmp #0x85 selects either constant 3 or the byte at +5 as index; ldrh r0,[table,
    r1*2] loads a flag ID from a per-chapter table at byte_808FCD8; bl SetEventFlag (known: sets one story
    progress flag) with the table value; mov r0,#0 before pop: fixed return value, no other side effects'
  refs:
  - bn6f/asm/asm25.s:613
  - 0x0802F114 SetEventFlag
  reproduce: python3 tools/asmcat.py 0x0808FCB0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-030611'
open_questions:
- contents of the byte_808FCD8 table (which flag IDs map to which chapters)
- what structure r10+0x3C points to and what fields 4/5 mean exactly
- why chapter 0x85 hardcodes index 3, and which callers invoke this
