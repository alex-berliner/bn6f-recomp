name: sub_802899C
address: '0x0802899C'
kind: function
status: confirmed
summary: During an active battle effect, queues a 0x200-byte graphics block (selected by the object's gfx-bank field)
  into VRAM at 0x6016CC0, then pushes a cartridge-side FIFO record.
interface: "void battleStreamingGfxTransfer_802899C(u32 /*r5*/ battleObj, u32 /*r10*/ toolkit)\n    /* preserves:\
  \ r4-r7 */\n    /* returns: nz/c/v set on the not-skipped path (whatever fifo_pushRecord16_8009FF8 leaves),\n\
  \       or nz/c/v from the `cmp r0,#0` early-exit path; r0-r3 clobbered. */\n"
details: "- Early-out: loads oToolkit_BattleStatePtr (r10) then the battleState byte at +0x17; if\n  that byte is\
  \ 0, returns immediately. Only streams while a battle effect is active.\n- Reads gfx-bank selector at battleObj+0x40:\
  \ low 3 bits = gfx bank id (stored in r4),\n  bit 3 (mask 8) selects between two halves of dword_86E1238. The\
  \ selector itself is\n  held in r5 across the sub-call.\n- When gfxBank == 0, computes srcOffset = (bankSelect\
  \ & 8) << 6 (so 0 or 0x200) and\n  calls QueueEightWordAlignedGFXTransfer with:\n    src  = dword_86E1238 + srcOffset\n\
  \    dst  = 0x6016CC0 (VRAM)\n    size = 0x200\n- Unconditionally pushes a FIFO record via fifo_pushRecord16_8009FF8\
  \ with\n  (0x80020064, 0xB766, 1, 0); this is the cartridge-side handler dispatch regardless\n  of whether the\
  \ local VRAM copy took place.\n- r4/r5 are used as scratch but written back from the saved originals on return,\
  \ so the\n  ABI-preserved r4-r7 contract holds.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
