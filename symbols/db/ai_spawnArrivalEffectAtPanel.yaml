open_questions:
- exact meaning of effect type 0 and the 0x14 parameter word in spawn_t1_0x0_EffectObject (teleport flash
  vs. generic spawn puff) needs the spawn wrapper's internals
- The XOR of oBattleObject_Alliance with oBattleObject_DirectionFlip isn't a meaningful 'side flag'; DirectionFlip
  is just a mirror bit and XORing it in only possibly flips one bit of the alliance value. The high byte
  passed to spawn_t1_0x0_EffectObject is simply that shifted alliance byte (likely a palette/side tag),
  and 0x14 is one spawn parameter, not a z/sort value. The function is specifically called by ai_moveToTargetPanelStartAttack
  to play the arrival/teleport effect when the enemy reaches its target panel, so the summary is close
  but the name should reflect that.
