name: battle_spawnObject49
address: '0x080CD488'
kind: function
status: probable
summary: Spawns a battle object of ID 0x49 via object_spawnType3; on success, copies the four caller's
  arguments into the new object at offsets +0x12, +0x13, +0x16, +0x2c and +0x64, and if the +0x64 value
  is non-NULL, writes 1 through that pointer to set a flag/counter.
interface: '(args in r0-r3 and on stack: params for object 0x49, last arg = pointer to a byte flag/counter)
  -> r0 = spawned object pointer, or 0 if spawn failed; flags set by spawn result'
details: 'This is a thin parameterized spawn wrapper: it calls object_spawnType3 with object ID 0x49 and
  the caller-supplied argument set, then, when the spawn succeeded, writes the arguments into the freshly
  allocated battle object: bytes at +0x12 and +0x13, a halfword at +0x16, a word at +0x2c, and a word
  at +0x64. If the value stored at +0x64 is non-NULL, it writes 1 to the first byte of the struct it points
  at (likely initializing a counter or active flag). On spawn failure it returns without touching anything.
  The saved-register prologue/epilogue in the listing looks like a mis-decoded push of the high registers,
  so the exact argument mapping beyond the field writes is approximate.'
