name: battle_stateCountdownTick_8007BD0
address: '0x08007BD0'
kind: function
status: confirmed
summary: Ticks a 10-frame countdown in the battle state object, then flips its phase field to 4 when the timer expires.
interface: 'void battle_stateCountdownTick(BattleState* r5); /* out: r0 = remaining timer (or 4 when started/finished),
  flags nz c v set; lr clobbered */'
details: 'Operates on the battle state object in r5. If the phase byte at

  oBattleState_Unk_03 is zero, this is the first call: it stores 10

  (0xA) into the halfword timer at oBattleState_Unk_28, writes phase 4

  into the byte at offset 3, and returns with r0 = 4. On later calls it

  decrements the halfword at oBattleState_Unk_28 each frame; while the

  timer is still >= 0 it returns the decremented value in r0. When the

  subtract underflows (timer hits 0xFFFF), it stores 4 into the halfword

  at oBattleState_Unk_02_03 (offset 2), which presumably advances the

  battle state machine to the next phase. R0 ends as 4 when the countdown

  was just started or just finished, otherwise as the decremented timer.

  Flags: "on the start/expire paths nz comes from MOVS #4 (c/v from the"

  earlier subtract); on the still-counting path from the SUBS #1.

  Callers appear to ignore r0/flags, but the contract is as listed.

  '
