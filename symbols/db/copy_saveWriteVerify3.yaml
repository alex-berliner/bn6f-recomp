    followed by same-args check; cmp r3, #0 / bne loc_814DA34 (0x814DA50): nonzero verify result triggers
    retry; cmp r7, #2 / bhi loc_814DA58 with r7 incremented each failure (0x814DA34-0x814DA3A): hard cap
    of 3 attempts; mov r0, r3 before pop (0x814DA58): returns the last verify result; callee libSave_CopyToGamePak
    summary confirms Game Pak write with WS0=3'
