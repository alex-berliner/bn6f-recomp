name: copy_saveWriteVerify3
address: '0x0814DA28'
kind: function
status: probable
summary: Writes r2 bytes from r0 to Game Pak address r1 and verifies via sub_814D9C4, retrying up to 3
  times; returns the last verify result in r0.
interface: (r0 = src ptr, r1 = dst Game Pak addr, r2 = byte count) -> r0 = verify result of last attempt
  (0 = success); flags clobbered
details: 'Copies r2 bytes from r0 to Game Pak address r1 via libSave_CopyToGamePak (which forces WS0 waitstate
  3), then calls sub_814D9C4 with identical arguments, which by usage is a readback/compare verify of
  the same range. The verify result in r3 decides the loop: nonzero keeps looping with the attempt counter
  (r7, byte-sized) incremented, so at most 3 write+verify attempts occur before bailing out. The final
  verify result is returned in r0. Argument meanings (src vs dst order) are inferred from libSave_CopyToGamePak''s
  known summary.'
