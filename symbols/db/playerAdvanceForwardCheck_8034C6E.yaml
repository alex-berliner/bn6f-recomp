name: playerAdvanceForwardCheck_8034C6E
address: '0x08034C6E'
kind: function
status: confirmed
summary: Returns 1 when the player is permitted to auto-advance the overworld forward, otherwise 0
interface: u32 sub_8034C6E(void) /* returns 1 in r0 with NZ flags if advance allowed, else 0 */
details: "Guards player forward-advance by short-circuiting to 0 if any blocking condition is active.\nConditions\
  \ checked (all must hold for advance):\n  1. IsScreenFadeActive: screen fade must currently be in progress.\n\
  \  2. TestEventFlagFromImmediate(EVENT_1717_PLAYER_ADVANCE_FORWARD, page 0x17, bit 0x17): the\n     event flag\
  \ \"EVENT_1717_PLAYER_ADVANCE_FORWARD\" must be CLEAR (Z set means flag clear).\n  3. sub_809E462: must return\
  \ 0 (some blocking state, perhaps dialog/pause; callee semantics unknown).\n  4. chatbox_mask_eFlags2009F38(0x80):\
  \ chatbox mask bit 0x80 must be unset.\n  5. IsCutsceneScriptNonNull: no cutscene script may be active.\nReturns\
  \ 1 with NZ flags only when all five conditions pass; otherwise 0 with Z flags.\nCallee-preserved: r4-r7. Clobbers:\
  \ r0, r1, r3, lr, cv flags. Inputs to callees use r0/r1 as\nimmediate operands for the flag test. `r10` is the\
  \ conventional scratch for flag bit helpers but\nis not directly used in this routine.\n"
