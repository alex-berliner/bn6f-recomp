status: probable
summary: Copies 0x31 bytes of chip/buster data from a beastSP buffer (r7) into a battle object (r4).
interface: (r0=r7=src buffer ptr, r1=r4=dest battle object ptr, r2=0x31) -> side effects only
details: "Tail-end helper of the beastSP/custom-slot logic. The function does not read its incoming r0/r1\n\
  \  from r0/r1 directly; instead it takes the pointers from callee-saved registers r7 (source) and\n\
  \  r4 (destination), hard-codes a byte count of 0x31 in r2, then falls into `CopyBytes`. The\n  length\
  \ 0x31 and source naming on the captured-call filenames (`beastsp_0080000_*`) match the\n  known size\
  \ of the per-Navi beast-SP/Custom+Style slot payload in bn6; the destination appears\n  to be a `BattleObject`\
  \ (or one of the slim T1/T3 variants) whose cursor/slot fields live in\n  the first 0x31 bytes. CopyBytes\
  \ returns in r1 the source pointer (which is how the contract\n  explains the `out=['r1']` value), and\
  \ the original capture traces show exit r0 with C set\n  (NS-C-Z) because CopyBytes leaves the Thumb\
  \ carry flag from its final loop iteration; the\n  function itself is functionally void for the caller,\
  \ which is why it restores lr via\n  `pop {pc}` instead of `bx lr`.\n"
