name: battle_CheckSpawnLimit_8135500
address: '0x08135500'
kind: function
status: confirmed
summary: Scans the 30 battle-object array for allies of a given alliance, buckets them by HP tier, and
  reports whether the caller would exceed the per-tier spawn limit for its own HP bucket.
interface: 'u32 battle_CheckSpawnLimit_8135500(u32 obj_ptr, u32 alliance) -> r0: exceeded flag (0/1);
  r1: capped limit (when exceeded) or current bucket count + 1 (when not); r2: overflowing bucket index
  0..4 (when exceeded) or unchanged (when not); clobbers nzcv'
details: "Operates on word_202A020, the in-battle object array of 0x20-byte slots iterated 0x3C0/0x20\
  \ = 30 times.\nFor each slot whose u16 alliance tag at +0x1C (extracted by r0 >> 7) matches the caller-supplied\
  \ alliance,\nthe slot's HP field at +0x18 (upper 16 bits of a u32) is bucketed into one of five tiers:\n\
  \  bucket 0: HP <= 0x13   (limit 5)\n  bucket 1: HP <= 0x1D   (limit 4)\n  bucket 2: HP <= 0x27   (limit\
  \ 3)\n  bucket 3: HP <= 0x31   (limit 2)\n  bucket 4: HP >  0x31   (limit 1)\nThe caller object itself\
  \ is bucketed by reading a u8 tier at obj_ptr+0x08 using the same thresholds.\nIf counts[bucket] + 1\
  \ exceeds the bucket's hard cap, r0 is set to 1 and r1/r2 carry the capped count\nand overflowing bucket\
  \ index; otherwise r0 = 0 and r1 carries the proposed count while r2 is left\nas the caller passed it\
  \ (acts as an in/out parameter for bucket id when no overflow occurs).\nUsed to gate whether an additional\
  \ allied unit of a given strength tier may be spawned/added.\n"
