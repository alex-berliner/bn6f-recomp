open_questions:
- Where is r2's caller's value meaningful? The C notes it passes through as prev_r2 when no overflow;
  the actual caller semantics (e.g. whether r2 is an existing bucket or count slot) are not visible from
  this function alone.
- The alliance extraction as "(bits 7..15) >> 7" only yields 9 bits; whether +0x1C stores alliance in
  a packed bitfield alongside another flag (bit 0..6) is unknown.
- The exact meaning of the HP tier boundaries (0x13/0x1D/0x27/0x31) and whether they correspond to enemy
  rank letters or numeric HP thresholds is not confirmed.
