name: object_spawnLinkedType3
address: '0x080C6248'
kind: function
status: probable
summary: Spawns a kind-0xB type-3 battle object and links it to a parent object, copying its alliance
  and setting its damage and extra-vars fields.
interface: (r5 = parent battle object, r6 = damage value, r7 = extra vars; r0-r4 preset for object_spawnType3)
  -> r0 = parent object pointer; sets Z from parent pointer
details: 'Wrapper around object_spawnType3 that spawns a type-3 object with the fixed kind 0xB, then,
  on success, initializes the new object from caller-supplied registers: damage = r6, alliance/direction
  copied from the parent object r5, RelatedObject1Ptr = parent, ExtraVars = r7. This makes the spawned
  object an attack/effect child tied to the attacker so it inherits side and direction. Callers include
  the AI buster-attack step, which uses it to spawn the buster-shot/attack object with its AttackVars-driven
  damage. The child object is fully configured by this routine; callers only supply parent, damage and
  vars.'
