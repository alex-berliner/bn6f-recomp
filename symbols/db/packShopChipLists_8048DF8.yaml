name: packShopChipLists_8048DF8
address: '0x08048DF8'
kind: function
status: probable
summary: Splits one shop's chip stock list into two packed display regions based on per-chip event flags (bought/sold/unlocked
  state), compacts the empty slots, and hands both region pointers back to the caller.
interface: void sub_8048DF8(u32 list_index r0, void* region_a r1, void* region_b r2, u32 capacity r4, struct Toolkit*
  r10) -> r2 = region_a ptr (packed path) / unchanged (skip path), r3 = region_b ptr / shop data ptr
details: 'Indexed through a table at dword_8046B98 with 16-byte records: +0x00 u32 state (2 = list still needs packing;
  any other value makes the function return immediately without touching r1/r2, leaving r2 as it came in and r3
  = toolkit->shopDataPtr), +0x08 list pointer relative to the shop data block from toolkit+oToolkit_ShopDataPtr
  (r10), +0x0C capacity in 8-byte slots. On the packing path both destination regions are zero-filled to capacity*2*8
  bytes via ZeroFillByWord. Each 8-byte source entry is {u8 chip_id, u8, u16 chip_index, u8, u8, u16} and is routed
  by three event flags keyed on the chip index: chip_index+0x1E20 set -> region B far half (slot offset 0x140);
  else chip_index+0x2020 or chip_index+0x2220 set -> region B near half (slot offset 0); else region A (slot offset
  0, and entry byte +5 is set to 1 instead of 0). The destination slot is (getChip8021DA8(chip_id)->field_0x1C +
  slot_offset) * 8, i.e. placed by a slot number stored in the chip data table, so skipped/unset chips leave gaps.
  After the source list ends (chip_id 0), both regions are compacted: entries are pulled down over empty slots and
  the moved-from entries are cleared. r2/r3 report the two region pointers back to the caller on the packed path.
  Preserves r4-r9 and r12; the routine deliberately reuses r8/r9/r12 as high registers to hold region end pointers.'
