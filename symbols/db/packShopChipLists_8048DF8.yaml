name: packShopChipLists_8048DF8
address: '0x08048DF8'
kind: function
status: confirmed
summary: For event-gated (type-2) shops, split the chip inventory into a normal list and a special list using progression
  event flags, then compact both to remove gaps.
interface: void packShopChipLists_8048DF8(u32 shop_index /*r0*/, u32 dest_normal /*r1*/, u32 dest_special /*r2*/,
  u32 toolkit /*r10, [oToolkit_ShopDataPtr]*)
details: 'Reads the shop entry at 0x8046B98 + shop_index*0x10 (type, chip_count, chip_data_offset). Only type-2
  shops are processed; all others return immediately. Computes the chip-data pointer as chip_data_offset + toolkit[oToolkit_ShopDataPtr].
  Allocates two buffers of chip_count*16 bytes each in dest_normal and dest_special, zero-filling both via ZeroFillByWord.
  Iterates 8-byte chip records from the shop''s data until a zero byte-0 is hit. For each chip it tests three event
  flags derived from chip_id + bases 0x1E20 (special), 0x2020 (alt1), 0x2220 (alt2): if the special flag is set
  the chip goes to dest_special at a slot shifted by 0x140 (from the chip''s static slot index in ChipData+0x1C);
  if only alt1 or alt2 is set it goes to dest_special at slot 0 offset; if none are set it goes to dest_normal.
  A 5-byte flag field records whether the chip was special-routed. After the fill pass, both buffers are compacted
  in place: empty (byte-0==0) slots have the next occupied slot slid down, clearing the source, so the final lists
  are gap-free and ordered.'
