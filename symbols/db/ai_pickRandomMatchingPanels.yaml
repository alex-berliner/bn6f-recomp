name: ai_pickRandomMatchingPanels
address: '0x080F7238'
kind: function
status: probable
summary: AI battle routine that gathers candidate panels matching a panel-type mask around the target
  (plus anywhere else on the field), shuffles them, and invokes a per-panel effect on up to r0 of them.
interface: (r0 = number of panels to affect, r5 = acting battle object) -> r0 = destroyed; uses target
  object's panel x/y from [r7+oAIAttackVars_TargetObjectPtr]+0x12/0x13
details: 'The routine reads the target object''s panel coordinates and builds a candidate list on the
  stack as packed bytes ((x<<4)|y, 4-bit coordinates). It first checks the target''s own panel, then an
  8-entry signed (dx,dy) offset table (byte_80F7380, a 3x3 neighborhood around the target), testing each
  with object_checkPanelParameters using required/forbidden attribute masks indexed by oBattleObject_Alliance
  (byte_80F7398). Matching candidates are reserved via object_reservePanel so duplicates can''t be picked;
  then object_getPanelsExceptCurrentFiltered collects every other matching panel on the field with a second
  alliance-indexed mask table (byte_80F73AC), after which all reservations are released via object_removePanelReserve.
  If more than one candidate exists in either group, each group is shuffled with ShuffleByteList_PrimaryRNG.
  Finally it walks the combined shuffled list and calls sub_80F73BC once per panel with the packed (x<<4)|y
  coordinate, stopping after r0 panels. Quirks: the neighbor-check loop runs 8 times but the reserve/remove
  loops run 9 times (one extra pass over the offset table).'
