name: object_getPanelInFlipDirection
address: '0x0800D4D0'
kind: function
status: probable
summary: From a starting battle panel, scans along a direction keyed by the second entity's facing through
  a 2-entry {dx,dy} table, applies a flip-direction offset, and validates the resulting panel against
  the 6x3 grid.
interface: (r0 = facing flag A (also direction-table index), r1 = facing flag B, r2 = starting panel)
  -> r0 = resulting panel (0 if none/check fails); Z flag = object_isValidPanel result
details: 'Computes -object_getFlipDirection(r0, r1) and passes it as the 4th argument to object_getFirstPanelInDirectionFiltered,
  so the scan direction is mirrored relative to the two entities'' facing. Uses r0 as an index into the
  2-entry table byte_800D52C (each entry is an 8-byte {dx, dy} pair: {0,0x20} vertical, {0x20,0x horizontal),
  i.e. 32-pixel panel steps). sub_800D53C is called first as a gate — if it returns 0 the function returns
  0 immediately. If a panel is found, the raw object_getFlipDirection value (+1/-1) is added to it, producing
  a panel one step further along the flip axis, and object_isValidPanel checks the 6x3 grid bounds. Quirk:
  the validity check''s flags survive to the caller while r0 is reloaded with the adjusted panel, so callers
  must read both.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: neg r0 after object_getFlipDirection; result passed in r4 to object_getFirstPanelInDirectionFiltered
    (mirrored scan); off_800D528 table indexed by r0<<3 yields {0,0x20} or {0x20,0} — one-panel pixel
    step vectors for vertical vs horizontal scan; found panel at [sp,#8] gets object_getFlipDirection
    added, then object_isValidPanel(r0, r2) bounds-checks it; caller object_getEdgePanelMatchingRow fits
    a 'find panel along a row toward the edge' use; beq loc_800D524 after both sub_800D53C and the scan
    return 0, so failure propagates as r0=0
  refs:
  - bn6f/asm/object.s:4127
