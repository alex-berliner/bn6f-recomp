  reproduce: python3 tools/asmcat.py 0x0800D4D0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The asm shows r0 is used as index into the direction table (lsl r2,r2,#3; add r1,r1,r2) and the
    table has entries {dx,dy} with 0x20 steps. object_getFlipDirection is negated and passed as 4th arg,
    then added to the found panel. However, the direction table is indexed by r1 (the second facing flag),
    not r0 as stated. Also r0 is the facing flag A, r1 is facing flag B, r2 is starting panel. The proposed
    name captures the essence but misses that r1 indexes the table.; run wf investigate investigate-20261018-230610;
