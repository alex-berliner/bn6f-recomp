name: event_markStepDoneAndPlayFinishEffects_801E0DC
address: '0x0801E0DC'
kind: function
status: confirmed
summary: Marks two state bytes of an event/quest struct as done (0xFF), plays effects 6 and 0x1A, and clears event
  flag bit 0x400 at 0x20352C4.
interface: void sub_801E0DC(u8* r5 /* struct pointer, at least 11 bytes */); clobbers r0-r3 and the scratch copy
  of r4/r5; preserves the caller's r4, r5; returns with NZ set from 0x400 and C=0 (see quirks)
details: 'Called with r5 pointing at some per-event/per-NPC state struct. It stores 0xFF into the bytes at +8 and
  +0xA, which elsewhere in the code pattern typically means "progress/counter complete" (e.g. a step counter or
  an item/talk state that is finished). It then invokes call_sub_3005EBA twice, which looks like the shared effect/SFX
  dispatcher, first with effect id 6 and then with effect id 0x1A, both times with the identical parameter set r1=2,
  r2=3, r3=0, r4=4, r5=2 — the fixed arguments are loaded into the registers while the caller''s r4/r5 are stashed
  in locals, since r4/r5 are call-saved by the ABI but reused as argument registers here. Finally it clears bit
  0x400 in the flag word at 0x20352C4 via flags_clearBits_20352C4_801BEC2, i.e. it de-asserts whatever event/trigger
  flag caused this step to run, so the event does not repeat.

  '
