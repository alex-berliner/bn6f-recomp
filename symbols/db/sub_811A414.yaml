name: sub_811A414
address: '0x0811A414'
kind: function
status: confirmed
summary: Dispatches a battle object's per-frame state to one of three handlers based on its state byte.
interface: "/* @r5: battle object base; @r10: caller-saved scratch (passed through)\n   State byte is read from\
  \ (r5 + 8); used as offset into off_811A428\n   (states stored pre-multiplied by 4).\n   On entry r0 = handler\
  \ (with Thumb bit set), r1 = raw state byte.\n   Returns r2, r3, r5, r10, r11 from the chosen handler. */\nvoid\
  \ sub_811A414(u32 r5, u32 r10, void (*handler)(void));\n"
details: "Pure jump-table dispatcher. off_811A428 is a 3-entry table of Thumb\nhandler pointers (+1 already OR'd\
  \ in):\n  state 0 -> sub_811A434\n  state 4 -> sub_811A4DC\n  state 8 -> sub_811A5B4\nThe \"mov lr, pc; bx r0\"\
  \ sequence transfers control to the handler with\nlr = return address pointing at the trailing pop {pc}, so the\
  \ handler\nreturns directly to the original caller of sub_811A414 — this function\nis effectively a tail-call\
  \ trampoline. r2/r3/r5/r10/r11 are read back\nfrom whatever the handler leaves in them; r0/r1/r4/r6/r7/r8/r9/r12\
  \ are\nclobbered and treated as caller-saved. Only r5 (object base) and r10\ncarry meaningful input; lr is the\
  \ standard link register. No memory\nother than (r5+8) and off_811A428 is touched.\n"
