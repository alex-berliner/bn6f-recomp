open_questions:
- The actual subject of each 0x44-byte row is not known (animation sequence opcode list? scripted
- action list?). Identifying which game struct uses a 0x44-byte block would settle the role.
- Exact semantics of the form index (r0) and why r0==0 needs the remap is not derivable from this
- function alone; correlating with the few projects calling it (only getIndexedSignedBytePair_8018842
- is known) would clarify whether r0 is a "form id" or a variant select bit.
