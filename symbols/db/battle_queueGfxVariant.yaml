name: battle_queueGfxVariant
address: '0x080282AE'
kind: function
status: confirmed
summary: Queues a 0x100-byte VRAM graphics transfer for a battle object, picking the first or second 0x100-byte
  tileset variant based on the object's palette/variant flag at +7.
interface: void battle_queueGfxVariant(u32 dest /* r1 */, BattleObject* object /* r4 */) — returns QueueEightWordAlignedGFXTransfer's
  r3/r4/r7 and nz/c/v flags unchanged
details: 'Loads the base source pointer byte_86E79CC (a 0x100-byte graphics blob, likely an element/variant palette-or-tiles
  image in the battle object GFX set), reads the byte at object+7 (r4+7), and if it is nonzero advances the source
  by 0x100 to the second variant blob. Then calls QueueEightWordAlignedGFXTransfer with (src, dest from r1, size
  0x100) to enqueue an eight-word-aligned GFX DMA transfer. This function is a thin selector/wrapper: it only chooses
  which of the two 0x100-byte variants to upload; everything else (including the outgoing r3/r4/r7 and the nz/c/v
  flag state) is whatever QueueEightWordAlignedGFXTransfer leaves behind. r4 (the battle object pointer) is preserved
  through the call. Callers are expected to keep the object pointer in r4 across the call since the callee''s r4
  output equals its input.

  '
