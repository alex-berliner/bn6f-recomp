name: battle_queueGfxVariant
address: '0x080282AE'
kind: function
status: probable
summary: Queues a 0x100-byte VRAM graphics transfer, picking one of two 256-byte tile blocks in ROM based
  on a flag byte in the caller's work struct.
interface: (r1 = dest VRAM address set by caller; r4 = work struct, byte [r4,#7] selects variant) -> queues
  GFX transfer of byte_86E79CC (flag==0) or byte_86E79CC+0x100 (flag!=0), 0x100 bytes; no return value
details: 'The function reads byte_86E79CC as the base source and 0x100 as the size, then branches on a
  byte stored at offset 7 of the struct pointed to by r4: if zero it uses the first 256-byte block, otherwise
  it skips to the second block at +0x100. It then calls QueueEightWordAlignedGFXTransfer(src, dest, size),
  leaving r1 (the destination) untouched from the caller. Two variant graphics of 0x100 bytes each (16
  4bpp tiles) live side by side in ROM at 0x86E79CC. r4 is the caller''s persistent object/work pointer,
  so this is a per-object graphics (re)load helper rather than a standalone routine. It only pushes lr,
  so dest and struct pointer must both be prepared by the caller.'
