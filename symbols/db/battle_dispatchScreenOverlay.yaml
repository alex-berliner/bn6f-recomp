name: battle_dispatchScreenOverlay
address: '0x080E74F4'
kind: function
status: probable
summary: Dispatches to one of four screen-effect handlers based on the current battle object's action/phase.
interface: (r5 = battle object) -> nothing; branches (tail-calls) into handler via jump table, no return
  value
details: Reads the byte at oBattleObject_CurAction from the battle object in r5 and uses it to index a
  4-entry thumb-function pointer table at off_80E7508, then long-calls the selected handler with lr=pc.
  The targets are object_dimScreen, object_drawChipName, battle_hideRelatedObjectPhase, and object_undimScreen,
  so the table alternates screen-dimming/chip-name-draw style overlays keyed to the battle phase (likely
  custom/open/dim/restore). No arguments are set up beyond r5, and the call is a tail branch (pop {pc}
  after bx), so it runs these handlers in the caller's place.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_CurAction] indexes ldr r1,[r1,r0] then bx r1 — a phase-indexed jump
    table; table entries: object_dimScreen+1, object_drawChipName+1, battle_hideRelatedObjectPhase+1,
    object_undimScreen+1; mov lr,pc / bx r1 / pop {pc} — tail-call into the chosen handler, no result
    used; callee set (dim/undim screen, draw chip name) shows it drives on-screen battle-phase overlay
    effects'
