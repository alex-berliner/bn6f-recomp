open_questions:
- Exact semantics of the r6 category codes (1=transform, 2=beast-out, 4=power-attack/dark-invis, 6=hp-restore/AI-power-attack)
  are inferred from the callee names; the chip-bits word's broader meaning (chip selection mask? blocking
  flags?) is not derived here.
- Sp+8 (r3 in) is forwarded to every predicate as r1 but is not labeled in any struct; could be an AIData*
  subfield, a chip-source index, or a flag set.
- The "r1 = category code" return may actually just be coincidental (the callee helper which supplied
  r6 to r1 at exit happens to match r6) - need to verify the caller (sub_801C6EE / useChipRelated_80127C0)
  reads r1.
