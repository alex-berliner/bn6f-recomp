name: battle_aiClassifyChipCategory_8012A38
address: '0x08012A38'
kind: function
previous_names:
- sub_8012A38
status: probable
summary: Classifies the navi's selected chip into one of a small set of AI categories (emotion=Beast/Transform,
  power-attack armed, HP-full-restore, AI power-attack, dark/invis special chip) and OR-s 0x8000 into
  the caller's chip-bits word.
interface: '(r0 = *BattleObject, r1 = chipIdx, r2 = chipBitsInOut, r3 = someCtxOrBits, r10 = *Toolkit)
  -> r0 = chipBitsOut (with 0x8000 OR''d if any category matched), r1 = categoryClass {0,1,2,4,6} ; side
  effects: r2..r7 trashed, NZCV clobbered'
details: "Saves caller regs and the four argument words on the stack (sp+0=chipIdx, sp+4=chipBitsInOut,\
  \ sp+8=ctxOrBits).\n  Looks up chip data via getChip8021DA8(chipIdx) and tests chip-byte[9] bit 1 (the\
  \ chip-kind/trait bit).\n  If bit1 is clear, returns immediately with r6=0 (no category) and r1=0; the\
  \ OR of 0x8000 into *sp+4 is skipped.\n  If bit1 is set, branches on the result of callPossiblyGetBattleEmotion_8015B54(alliance):\n\
  \    - r0==2 -> r6=1 (\"transform\" category)\n    - r0==3 -> r6=2 (\"beast-out\" category)\n  Otherwise\
  \ it tries, in order, sub_8012AFA (power-attack chip+trigger armed, r6=4), then\n  battle_chipMatchesHpFullRestoreAiBranch_8012B4E\
  \ (r6=6), then ai_decidePowerAttack_8012BA2 (r6=6),\n  and finally battle_isChipSpecialDarkInvisQualifying_8012ABC\
  \ (r6=4). Each helper checks (chipIdx, ctx) and\n  returns truthy in r0; the first match wins. When\
  \ any branch matches, control falls through to\n  loc_8012AAC which ORs 0x8000 into the chip-bits word\
  \ copy at [sp+4] and loads the result into r0.\n  Exit: r0 = the (possibly 0x8000-OR'd) chip-bits value,\
  \ r1 = r6 (the category code).\n  No global/EWRAM writes observed; BattleObject and Toolkit pointers\
  \ are only read.\n"
