    sets r6 to a fixed enum value (1,2,4,6) and falls through to the same OR site. - All callees are battle-AI
    predicates that take the chip index plus an opaque context in r1 (loaded from sp+8) and return a bool
    in r0. - callPossiblyGetBattleEmotion_8015B54 is invoked with `ldrb r0, [r5, #oBattleObject_Alliance]`
    (r0=Alliance), confirming r5 is a BattleObject*. - Captured exit r0=03007d8a and Z set matches a no-match
