name: battle_updateAttachedSprite
address: '0x080E80E0'
kind: function
status: probable
summary: 'Per-frame update for a sprite battle object tied to a parent object: copies the parent''s xyz
  each frame and adds its own xyz velocity, ticks two halfword counters, clears a header flag bit when
  the sprite frame attribute bit 0x80 is set, sets CUR_STATE_DESTROY, and advances the sprite.'
interface: (r5 = battle object) -> void; sets object state to CUR_STATE_DESTROY when the frame attribute
  bit 0x80 is set
details: Each frame it loads {x,y,z} from offset 0x34 of the object pointed to by oBattleObject_RelatedObject1Ptr
  (the parent), adds the object's own X/Y/Z velocity fields, and writes the result into its own offset-0x34
  position — so the effect tracks its parent with a fixed velocity offset that is re-applied rather than
  accumulated. It then increments the oBattleObject_Z16 and oBattleObject_Y16 halfword counters by 1 each
  frame (likely animation/lifetime tick counters). It calls sprite_getFrameParameters and tests bit 0x80
  of the returned attribute byte; when set it clears bit 2 of oObjectHeader_Flags and sets the object's
  state word to CUR_STATE_DESTROY, i.e. the sprite data marks 'delete when animation ends'. Finally it
  calls sprite_update to advance the animation/rendering state. This matches the caller battle_initSpriteObj,
  which creates a kind-7 sprite object and hands it to the per-frame update state.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldmia from RelatedObject1Ptr+0x34 / stmia to r5+0x34 with X/Y/Z velocity added: position is
    re-derived from a parent object each frame (asm lines 2-14); ldrh/strh +1 on oBattleObject_Z16 and
    oBattleObject_Y16: per-frame counters incremented (lines 15-20); tst r0,#0x80 after sprite_getFrameParameters,
    then bic flag bit 2 and store CUR_STATE_DESTROY: destroy-on-animation-end attribute handled (lines
    22-29); tail bl sprite_update matches callee summary ''run _sprite_update on the object''s sprite
    struct'' (line 31); sole caller battle_initSpriteObj sets up a kind-7 sprite object and ''switches
    it into the per-frame update state'', i.e. this is that state''s handler'
  refs:
  - bn6f/asm/asm31.s:103722
  - 0x080E809C battle_initSpriteObj
  - 0x08002DEA sprite_getFrameParameters
  - 0x080026C4 sprite_update
  reproduce: python3 tools/asmcat.py 0x080E80E0
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s behaviour matches the asm: it does load parent xyz via RelatedObject1Ptr + 0x34,
    add this object''s velocities, store back, tick Z16/Y16, test attr 0x80 via sprite_getFrameParameters,
    clear bit 2 of header flags and set CUR_STATE_DESTROY, then call sprite_update. Caller battle_initSpriteObj
    also confirms this is a per-frame handler. However the summary''s ''destroy when frame attribute bit
    0x80 is set'' wording is slightly off — it''s also cleared unconditionally before destroy, and Z16/Y16
    aren''t really ''animation/lifetime tick counters'' here, just generic halfword counters. Otherwise
    correct.; run wf investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
