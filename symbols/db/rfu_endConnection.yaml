name: rfu_endConnection
address: '0x0813D98C'
kind: function
status: probable
summary: Ends the current RFU wireless session and marks the wireless work struct with a post-end state.
interface: () -> r0 = 4 (clobbered); touches eStruct200BC30 field 0xE
details: Calls rfu_setStateEnded, which records RFU state 9 in the wireless work struct and runs the lower
  RFU state routine with 0, cleanly ending the link. It then stores the constant 4 into byte 0x0E of eStruct200BC30,
  apparently a follow-up connection-state/substate flag consumed elsewhere. Takes no arguments and returns
  nothing meaningful. Callers gate the call on a bit-0x80 flag and on byte_200AF85 equaling 1, i.e. only
  when a wireless session is actually active.
