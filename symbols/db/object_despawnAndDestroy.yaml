name: object_despawnAndDestroy
address: '0x080D83CC'
kind: function
status: probable
summary: Battle-object update handler that plays a brief non-hittable despawn animation, then frees the
  object's ExtraVars and destroys it.
interface: (r5 = battle object pointer, r0 = scratch) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY when done
details: 'On phase 0 it starts the despawn: sets CurPhase to 4, CurAnim to 2, clears the object''s collision
  region via object_clearCollisionRegion (making it unhittable), and sets Timer to 2. On subsequent calls
  it decrements Timer; when it hits 0, if ExtraVars points to an allocation it zeroes the first word and
  nulls the pointer (leaked/one-word free pattern), then writes CUR_STATE_DESTROY into the combined state
  field so the object loop tears it down. The 2-frame window suggests a short flash/pop before removal,
  with collision disabled so it can''t be hit again.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: phase 0 branch sets oBattleObject_CurPhase=4, oBattleObject_CurAnim=2, timer=2 — one-shot despawn
    init; bl object_clearCollisionRegion during init removes the object from collision while it despawns;
    Timer decrement with 'bgt locret' makes phase 4 a 2-frame wait before teardown; zeroes [ExtraVars],
    nulls ExtraVars, then mov r0,#CUR_STATE_DESTROY into the state word — standard self-destruct
