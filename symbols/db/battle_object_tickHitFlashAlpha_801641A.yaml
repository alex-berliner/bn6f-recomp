name: battle_object_tickHitFlashAlpha_801641A
address: '0x0801641A'
kind: function
status: confirmed
summary: Per-tick update for a battle object that animates a hit-flash (mosaic + alpha) for a fixed duration,
  then advances the object to phase "8".
interface: 'void sub_801641A(u32 r5_battleObj, u32 r1_unused) /* -> r1, clobbers nzcv r0 r2 r3 lr; preserves
  r4 r7 */

  '
details: 'Decrements `oBattleObject_Timer` each frame. While it is non-zero the function just returns;
  the final flag state matches `SUBS r0, #1` (C = old_time >= 1, V = 0).


  When the frame timer hits zero it is reloaded with 2 and the secondary flash-duration counter `oBattleObject_Timer2`
  is decremented.


  Mid-flash frames call out to `sprite_setMosaicSize(timer2, timer2)`, then compute the alpha as `-(timer2
  - 0x10)` (i.e. 0x10, 0x0F, 0x0E … ramping the alpha DOWN as the flash ages — first flash frame is fully
  opaque, last visible frame is alpha 1) and pass it to `sprite_setAlpha_8002c7a`. The object header flag
  byte (`oObjectHeader_Flags`) is OR''d with 0x2 to mark the in-flash state. Path ends with `ORR`, so
  N/Z come from the byte, C and V are cleared, r1 = 2.


  When `timer2` reaches zero the flash is torn down: `sprite_disableAlpha`, `sprite_clearMosaic`, then
  `sub_800AA40(0)`, and finally `oBattleObject_CurPhaseAndPhaseInitialized` is set to 8 (handing the object
  off to whatever phase 8 handler exists). Final flags = `sub_800AA40`''s tail; r1 = sub_800AA40''s r1;
  r0 = 8.


  Struct fields touched (relative to the battle-object base in r5): `oBattleObject_Timer` (+0x??, 16-bit
  frame tick), `oBattleObject_Timer2` (+0x??, 16-bit flash duration), `oBattleObject_CurPhaseAndPhaseInitialized`
  (+0x??, 16-bit phase word), `oObjectHeader_Flags` (+0x??, 8-bit, OR''d with 0x2). Offsets are not pinned
  down in this snippet — they are project-wide constants used by every per-tick handler.

  '
