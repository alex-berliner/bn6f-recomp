name: chipIDIs13f_8029FF4
address: '0x08029FF4'
kind: function
status: confirmed
summary: Returns 1 if the given chip ID matches either of the two chip IDs stored in the table at dword_802A02C,
  else 0.
interface: bool u32 chipIDIsInSpecialPair(u32 chipID /* r0 */); preserves r1-r7; clobbers flags only
details: 'Loads a pointer from dword_802A02C and compares r0 against the two words stored there ([table] and [table+4]).
  If the chip ID equals either entry, r0 = 1, otherwise r0 = 0. The comparison table holds two chip IDs (the original
  disassembly name suggests one of them is 0x13F); such pairs typically mark a two-chip gate or special condition
  elsewhere in the game (e.g. a MegaMan-variant or gater chip check). The function is a pure predicate: it touches
  no game state, preserves r1-r7, and only returns the match flag in r0. Note the pointer is fetched indirectly,
  so the table location could in principle be patched rather than hardcoded.

  '
