name: chatbox_stepRunScript12IfFlag80Clear
address: '0x08133740'
kind: function
status: probable
summary: Cutscene/chatbox step that, unless event-flag bit 0x80 is set, performs sub_8134FE0, sets a state
  field to 0xC in the context struct, and runs text script 0x12.
interface: (r5 = cutscene/chatbox context struct) -> r0 = script result; flags from flag test are consumed
  internally
details: This is a step-style routine (push {lr}/pop {pc}, no args in r0-r3) that tests bit 0x80 of the
  shared chatbox/event flag word eFlags2009F38 via chatbox_mask_eFlags2009F38. If that bit is set, it
  returns immediately without side effects. Otherwise it calls sub_8134FE0 (purpose unknown), stores 0xC
  at offset 0x68 of the r5 context struct (likely a next-state/step index or delay counter), and kicks
  off text script index 0x12 (18) from the eTextScript2028A20 archive through chatbox_runScript_803FD9C_on_eTextScript2028A20.
  The [r5+0x68] write suggests the surrounding dispatcher reads that field to pick the following step.
