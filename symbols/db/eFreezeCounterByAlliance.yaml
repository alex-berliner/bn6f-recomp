name: eFreezeCounterByAlliance
address: '0x0200F3B8'
kind: data
status: probable
summary: 'Proposed name: eFreezeCounterByAlliance. EWRAM array of 3 per-alliance freeze counters, cleared
  when a time freeze begins and incremented when SnakeArm queues its battle effect. (table of u32 (3 entries
  by alliance))'
details: Indexed by oBattleObject_Alliance (0..2) shifted left by 2, so it is a 3-entry u32 table in EWRAM
  keyed by alliance. object_timefreezeBegin clears the entry (stores 0) for the object's alliance. battleObject_stepSnakeArm_800BA8A
  sets it to 1 after queuing the 0x4C/0x50 battle effect, consistent with a per-alliance freeze/cross-net
  counter. Each use is paired with a separate .word table (off_800B948, off_800BBA4) that simply holds
  a pointer to the variable, which is the standard shape for EWRAM cross-reference tables.
