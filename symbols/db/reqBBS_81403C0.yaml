name: reqBBS_81403C0
address: '0x081403C0'
kind: function
status: confirmed
summary: 'Opens a BBS (Buddy Battle System) menu entry: stamps the state as ''opening'', configures the window-animation
  slot, plays SELECT, runs the easing/layout pass, redraws the header text, and resets the message-box pointer.'
interface: 'void reqBBS_openEntry_81403C0(void) // in: r2, r5 (entry-state struct ptr), r10 (toolkit ptr), lr; out:
  r10 (updated toolkit ptr), r11 (header-render result); clobbers: r0-r4, r7, r12, nzcv'
details: 1. Sets byte 0 of the r5 entry-state struct to 0x18 ('opening' phase). 2. Loads a window-animation struct
  pointer from [r10 + oToolkit_Unk200f3a0_Ptr] and writes six configuration bytes (offsets +2=0xFF, +3=0x00, +6=0x50,
  +7=0x50, +9=0x1B, +A=0x36) to set up the fade/expand animation. 3. Plays SOUND_SELECT_67 via PlaySoundEffect.
  4. Sets r5+8 (sub-state/animation-phase field) to 6. 5. Calls the fixed-layout easing pass at 0x3005EBA with args
  (0, 0, 3, 0, 0x1E, 0x14) — a 0x1E×0x14 grid, size 3, no offset. 6. Calls reqBBS_renderSelectedEntry_HeaderText
  (passing r5) which returns updated r10 and r11. 7. Loads the message-box pointer from [new r10 + 0x20], stamps
  byte 0 with 0xF7 ('ready'), clears bytes at +4 and +6. 8. Returns with r10, r11 updated for the caller's toolkit
  context.
