name: aiAttackingBuster_8013396
address: '0x08013396'
kind: function
status: confirmed
summary: Returns nz whether the battle object's AI is currently executing a buster attack
interface: bool aiAttackingBuster_8013396(u32* battle_object /* r5 */); // r0 nz on true, 0 on false;
  clobbers r1 r3 lr
details: 'Reads the AI data pointer (oBattleObject_AIDataPtr) from the battle object in r5 and

  inspects oAIData_BPwrAtk. If that byte is 0xFF (no override BP/attack), returns 0.

  Otherwise calls returnBoolIfAIDataFlagsAreSet_8012F3E on the battle object and

  returns its boolean result as 1/0 in r0 (with NZ flags reflecting it).

  "Buster" here is the buster attack check used by the AI subsystem.

  '
