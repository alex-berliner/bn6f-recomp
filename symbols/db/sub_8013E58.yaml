name: sub_8013E58
address: '0x08013E58'
kind: function
status: confirmed
summary: Reads the battle object's alliance navi stats byte 0x1A and dispatches one of nine handlers from a table,
  randomizing among entries 1-4 or 5-8 when the byte is 9 or 10.
interface: void sub_8013E58(r5, r10); r5/r10 passed through to callees, r4 = 0 or 4 (half selector) on tail-call,
  r1 = table base; r4 preserved for caller
details: 'First calls GetBattleEffects and, only if bit 3 (0x8) of the result is clear, GetBattleMode — but both
  results are discarded; the two branches merge at loc_8013E6C, so these reads have no effect on control flow (likely
  leftover or debug gating). It then calls GetBattleNaviStatsByte_AllianceFromBattleObject with r1=0x1A to fetch
  the partner/alliance navi''s stats byte 0x1A. Byte value 9 or 10 is special-cased: r4 is set to 0 (for 9) or 4
  (for 10) and the RNG is called, taking (RNG & 3) + r4 + 1 as the table index, i.e. a random entry among indices
  1-4 or 5-8 respectively. Any other value indexes the table directly with r4 = 4. The handler address is loaded
  from off_8013E9C (nine entries: nullsub_45, sub_8013EC2 .. sub_8013F14) and invoked via `mov lr, pc; bx r0` with
  r1 holding the table base, r4 the half selector, and r5/r10 passed through unchanged; the handler returns straight
  back to this function''s caller (pop {r4,pc}), so r4 is preserved across the whole call. The purpose of the per-byte
  handlers (status effects? beast/cross upkeep per alliance navi state?) is not yet determined.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
