name: npc_clearOverworldNpcStateWord_8004702
address: '0x08004702'
kind: function
status: confirmed
summary: Clears one state word (offset 0xC4) of all 16 overworld NPC object slots, presumably invalidating each
  NPC's active/behavior word before an area (re)load.
interface: void sub_8004702(void) — no meaningful inputs (lr = return address only); returns garbage in r0..r3 (r0=0x10,
  r2=0, r1/r3 = loop addresses) and flags from the final CMP r0,#0x10 (Z=1, C=1, V=0, N=0); callers read back only
  r0-r3 and nzcv per the contract.
details: 'Walks the fixed overworld NPC object table at eOverworldNPCObjects, 16 slots of 0xD8 bytes each. In each
  slot it computes entry + 0xA0 and stores 0 at that address + 0x24, i.e. entry + 0xC4, a u32 the readable C labels
  the object''s "active"/behavior word. The loop is unstructured: r0 counts iterations, and the leftover register
  values and flags leak to the caller (r0 = 0x10, r2 = 0, r1 = last store address, r3 = base + 16*0xD8), though
  callers likely ignore them. The literal pool also references eActiveOverworldNPCObjectsBitfield, byte_2006530,
  and a table of overworld NPC behavior dispatch handlers (sub_80A4984..sub_80AA374), but this function itself touches
  none of them beyond the 16 zero-stores. Runs entirely from ROM, no flags or other memory written.'
