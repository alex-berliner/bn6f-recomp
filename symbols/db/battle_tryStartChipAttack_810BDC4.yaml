name: battle_tryStartChipAttack_810BDC4
address: '0x0810BDC4'
kind: function
status: confirmed
summary: Gates and commits the player's selected chip as an attack, consuming a held copy once phase timing and
  chip validity pass.
interface: u32 battle_tryStartChipAttack_810BDC4(u32 r4 /*battleCtx*/, u32 r5 /*battleObject*/, u32 r7, u32 r10)
  -> r0 /*1 on success, 0 on fail*/, r1 /*clobbered*/; preserves r4, r6, r7
details: 'Calls battle_getSelectedChipForUse_800ED90 with r5 (battle object) and r4 to retrieve the currently-selected
  chip; r3 from that call is a validity flag—zero means no usable chip so the function returns 0. On a valid chip
  the low 9 bits of the returned value are masked out (lsl/lsr by 0x17) to extract the chip code. battle_getStateUnk40_800A704
  returns a battle-phase/timer counter; it must be >= 0x12C (300) or the attack is rejected—this is the selection-window
  that locks the player''s input during chip selection and the transition to action. If both gates pass, somethingWriteChipParams_80126E4
  is called with the 9-bit code to fill in the attack descriptor (damage, hitbox, element, etc.), then object_setAttack0
  attaches that descriptor to the player''s battle object slot 0. battleObject_decrementChipHeldAndClearChip_800F322
  then consumes one held copy of the chip from the Navi folder and clears the selection indicator so the chip is
  no longer "selected". Returns 1 in r0 on the full success path, 0 on either early-out. r6 is the success/fail
  flag, restored via push/pop so callers may rely on it; r4 is also saved and restored.

  '
