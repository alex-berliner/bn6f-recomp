open_questions:
- Exact semantic meaning of `oBattleState_Unk_40 >= 0x12C` (turn-counter? readiness timer?) is not derivable from
  this function alone.
- Whether the "r0 = r5" copying the BattleObject pointer into the chip-selection helper is the actor the caller
  is currently driving, or a related object, depends on the caller sub_810BC44 which I do not have the full body
  of here.
