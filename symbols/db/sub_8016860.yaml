name: sub_8016860
address: '0x08016860'
kind: function
status: confirmed
summary: Per-frame battle-object update that pulses the object's sprite color shader via a 32-entry triangular ramp
  table.
interface: "void sub_8016860(u32 r5_battleObject /* battle object base, in r5 */);\n  // inputs: r5 = battle object,\
  \ r10, lr\n  // outputs: r4\n  // clobbers: nz c v r0 r1 r3 lr\n  // preserved: r4 r6\n"
details: 'Reads the object''s alliance via GetBattleNaviStatsByte_AllianceFromBattleObject with

  field id 0x2C; alliances 0x17..0x18 are excluded.

  Reads the action byte at oBattleObject_CurAction: actions 0 and 0x56 are excluded.

  Calls object_getFlag and requires bit 0x8 set.

  Picks a left-shift amount: 5 normally, 0 if GetBattleMode() == 1.

  Indexes the 32-byte ramp at 0x080168A8 (a symmetric triangular table: 0, 2, 4, ..., 0x1E,

  0x1E, 0x1C, ..., 0) by battle_getStateUnk40_800A704() & 0x1F, shifts the byte left by the

  chosen amount, and forwards the result to sprite_setColorShader.

  Operates on the sprite associated with the battle object passed in r5.

  '
