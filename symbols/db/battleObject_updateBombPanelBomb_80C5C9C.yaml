open_questions:
- Whether the curstate path (valid+solid) actually stops here or also lets the bomb later detonate from
  a separate handler; only an init/landing hook is visible here.
- The exact element/Param1 table at dword_80C5D7C is small (single u32 0x0F000001) so most Param1 values
  probably resolve to Region=0; a full Param1->Region mapping is unknown.
- Whether `str r6,[r5,#oBattleObject_ZVelocity]` is intentional (gravity being applied through Y) or a
  genuine port artifact that other games correct.
