name: battle_rosterIconSetShade
address: '0x0811DFD4'
kind: function
status: confirmed
summary: Applies a shade/darkness level (from the battle object at r6) to a roster icon sprite, building the shade
  bitmask and handing it to the sprite renderer.
interface: void battle_rosterIconSetShade(u32 sprite /* r5 */, BattleObj* obj /* r6 */); clobbers r0,r2,r3,lr,NZCV
details: 'Reads the shade index from obj+0x04. If it is 0xFF ("fully lit" / no shade), the constant 0x3F800000 (the
  float 1.0 bit pattern, likely a fixed-point or bitmask constant here) is stored to obj+0x20 wholesale. Otherwise
  a mask bit (1 << (0x1D - shade)) is cleared in the word at obj+0x20, so larger shade indices clear lower bits
  and the bit position decreases as the shade index grows. The resulting word is written back to obj+0x20 and passed
  in r0 to sprite_setUnk0x2c together with the sprite handle in r5, which presumably applies the shade/palette darkening
  to the rendered sprite. r6 is the same battle-object layout used elsewhere in the battle subsystem (+0x04 attribute
  byte, +0x20 flag/mask word). Callers pass the sprite handle in r5 and the object pointer in r6; no return value
  is produced.

  '
