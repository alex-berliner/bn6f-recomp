name: battle_rosterIconSetShade
address: '0x0811DFD4'
kind: function
status: probable
summary: Sets a Navi roster icon's shade level from its roster index, writing a 1.0/0.5/0.25/... float
  into the object and its sprite struct.
interface: (r0 = unused on entry; index read from [r6,#4], object base in r6) -> r0 = shade value passed
  to sprite_setUnk0x2c; no meaningful flags
details: Reads the icon's roster index from object field 0x4. If it is 0xFF, stores 0x3F800000 (1.0f,
  full brightness) into object field 0x20. Otherwise clears bit (0x1D - index) of field 0x20, which turns
  1.0f into the decreasing shade ladder 0.5, 0.25, 0.0625, ... for indices 6..0 (the cleared bit is an
  exponent bit of the float). The new field 0x20 value is then passed to sprite_setUnk0x2c, which copies
  it into field 0x2c of the sprite struct for rendering. The operation is idempotent per frame, so each
  icon settles at the shade fixed by its index.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r6,#4]; cmp #0xFF selects reset path storing 0x3F800000 (=1.0f) to [r6,#0x20]; mov
    r2,#0x1D; sub r2,r2,r0; lsl r3,r2; bic r0,r3 clears bit 29-index of field 0x20; 0x3F800000 has bits
    23-29 set, so clearing one exponent bit yields the 1.0/0.5/0.25/... shade sequence; result in r0 is
    passed to sprite_setUnk0x2c, which stores it into sprite struct field 0x2c; caller sub_811DF94 is
    the per-frame update of a pre-battle lineup Navi roster icon'
