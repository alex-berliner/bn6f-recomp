summary: Trivial wrapper that switches the game into mode/state 2 via sub_80028C0.
interface: void sub_80046F8(void)
details: 'Pushes lr, loads r0 = 2 and tail-calls sub_80028C0 (with a bl, so the return goes back to this function''s
  caller via pop {pc}). The called routine is evidently a global "set mode/state" setter that takes the mode number
  in r0; no other registers or memory are touched here, and no flags are set for the caller. Callers of this routine
  therefore just trigger a switch of the game (or engine) into mode 2. The exact meaning of mode 2 depends on how
  sub_80028C0 dispatches (scene loading, main loop state, etc.) and is not visible in this wrapper.

  '
