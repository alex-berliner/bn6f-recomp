name: battle_cardDrawAnimUpdate
address: '0x080C33CA'
kind: function
status: probable
summary: Per-frame update for a battle object that, on a flagged animation frame, deals the next card
  into the opposite alliance player's hand and advances itself into the post-draw phase.
interface: (r0 = ignored, r5 = BattleObject this update runs on) -> r0 = collision data pointer from object_setCollisionRegion;
  flags clobbered
details: First calls sprite_getFrameParameters and only acts when the current frame's attribute byte has
  bit 0x80 set, so this is an animation-frame-triggered event handler. If oBattleObject_Param3 already
  equals 0x17e it skips the draw step, suggesting 0x17e marks 'card already dealt'. Otherwise it XORs
  oBattleObject_Alliance with 1, calls battle_findPlayer to get the opposing side's player, and calls
  battle_drawCardToHand_800FC7C to deal that player's next card during card selection. It then sets its
  own CurAnim to 3, Timer to 60 frames, collision region to 1, and writes 0x10 to oBattleObject_CurPhaseAndPhaseInitialized,
  entering the next phase. If the attribute bit is clear it returns immediately without changing state.
