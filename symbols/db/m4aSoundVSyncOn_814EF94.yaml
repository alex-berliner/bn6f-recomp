name: m4aSoundVSyncOn_814EF94
address: '0x0814EF94'
kind: function
status: confirmed
summary: 'm4a''s m4aSoundVSyncOn: restarts the PCM DMA — re-enables DMA1/DMA2, clears the DMA counter, takes the
  ident back and reloads and starts Timer 0 at the start of line 159.'
interface: 'static VsyncOnRegisters sound_vsync_on(u32 incoming_r1, u32 incoming_r12)

  Next sub_814EF94: in r4 preserved, r1/r12 (kept only when nothing is done),

  lr; out r0 the popped return word, r1/r2/r3/r12, r4 restored, nz/c/v.

  '
details: 'ident == ID_NUMBER means already live: nothing is written and r1/r2/r3/r12

  survive as they came in (r2 = the SoundInfo pointer, r3 = ident). Otherwise

  both PCM DMA controls get 0xB600, pcmDmaCounter is cleared, ident -= 10, and

  after m4a''s VCOUNT handshake (wait out line 159, then wait for it again)

  Timer 0 is reloaded with -(280896 / pcmSamplesPerVBlank) and started. The

  leftover registers are the division loop''s r2/r3/r12 with A_Timer0Control in

  r1; the flags are the neg''s C/V with N/Z from the final mov 0x80.

  '
