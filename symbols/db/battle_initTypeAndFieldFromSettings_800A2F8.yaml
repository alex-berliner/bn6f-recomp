name: battle_initTypeAndFieldFromSettings_800A2F8
address: '0x0800A2F8'
kind: function
status: confirmed
summary: At battle start, copies the battle type and battlefield from the battle settings into the battle state
  and derives a navi-stat value by dividing a stat by 100.
interface: void battle_initTypeAndFieldFromSettings_800A2F8(void); /* uses r10 = toolkit; trashes r0-r1 and flags;
  leaves battle state ptr in r3; r2/r4 preserved */
details: 'Reads the toolkit (r10) and fetches oToolkit_NaviStatsPtr. Loads the halfword at

  naviStats+0x3E, performs BIOS Div (svc 6) by 100, and stores the quotient byte into

  naviStats+0x2B (the BIOS call also leaves the remainder in r1, which is discarded).

  Then fetches oToolkit_BattleStatePtr, reads oBattleState_BattleSettings, and copies

  the BattleType byte (settings offset oBattleSettings_BattleType) into

  battleState+oBattleState_BattleType and the Battlefield byte

  (settings offset oBattleSettings_Battlefield) into battleState+oBattleState_BattleField,

  so later battle code can read these from the battle state instead of the settings.

  The C decompilation''s field offsets in the pseudocode listing differ in order from the

  assembly, but the struct-offset symbolic names in the assembly are authoritative.

  '
