    it back (clearing a per-entry mark); cmp r0,#0x30 / strb 0x28 + bl sub_812B3E4: state 0x30 advances
    to 0x28 and triggers a chatbox script line keyed off the struct; ldrb r1,[r5,#0x1b]; bic bit0; strb:
    clears a flag byte in the same event struct; bl SetScreenFade with (8, 0x10): screen fade issued after
    the transition, typical of a cutscene step end'
