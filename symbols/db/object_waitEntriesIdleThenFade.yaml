name: object_waitEntriesIdleThenFade
address: '0x08129DC4'
kind: function
status: probable
summary: Waits until every object pointer in the list at unk_20251A0 has its +7 flag cleared, then clears
  a marker bit on all entries, advances the caller's event state (running a chatbox line when leaving
  state 0x30), and fades the screen.
interface: '(r5 = event/object struct: count at +0x20, state at +3, flags at +0x1b, script offset at +0x13)
  -> void; early-returns with screen untouched if any list entry has byte +7 nonzero'
details: 'The function is a polling/gating step: it scans r5[0x20] pointers in the array unk_20251A0,
  and if any pointed-to object has a nonzero byte at offset 7 it returns immediately without side effects
  (so it is presumably called every frame until the condition holds). Once all are clear, a second pass
  strips bit 31 from each stored pointer and writes it back, suggesting bit 31 is a temporary mark/tag
  set by earlier processing that is now cleared. It then performs a state transition on the r5 struct:
  if r5[3] == 0x30 it is set to 0x28, a chatbox line is run via sub_812B3E4 (which reads a script index
  from r5+0x13), and bit 0 of r5[0x1b] is cleared; otherwise r5[3] is set to 0x18. Finally it calls SetScreenFade(8,
  0x10) to start a screen fade, making this look like the wrap-up step of a scripted event that despawns
  or completes a batch of objects.'
