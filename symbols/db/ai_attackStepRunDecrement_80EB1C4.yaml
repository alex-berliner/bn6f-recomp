name: ai_attackStepRunDecrement_80EB1C4
address: '0x080EB1C4'
kind: function
previous_names:
- sub_80EB1C4
status: probable
summary: 'AI tick: decrements AIAttackVars.Unk_10 countdown; on expiry resolves an outcome and either
  exits the attack state or advances a sub-step.'
interface: (r4 = AIDataPtr, r7 = AIAttackVarsPtr) -> r0 = 0..3 (success/result); side effects updates
  AIAttackVars.Unk_10, AIData.Unk_1a; may call object_exitAttackState.
details: "1. push {lr} and read a halfword at [r7,#oAIAttackVars_Unk_10] (the AttackVars buffer at AIData+0xa0,\
  \ so offset 0x10 within it is the u16 at AIData+0xb0).\n  2. sub r0,#1 and strh back, then bgt locret_80EB1F6:\
  \ while the counter is still > 0 the function returns immediately with r0=0 (per snap_story2_11.bin\
  \ where r0 was 0 and flags -ZC-, indicating the counter hit 0 on this tick).\n  3. When the counter\
  \ reaches 0 (or below), read [r7,#oAIAttackVars_Unk_03] (AIAttackVars.Unk_03). If it is 1, skip the\
  \ roll and force r0=0 via the loc_80EB1E0 branch.\n  4. Otherwise call battle_RollNaviStatChance_8013FAE\
  \ (which uses r5=AI owner and rolls a d8 against the navi's BeastOutAPwrAtk stat byte at +0x11). If\
  \ the roll returns 0, also fall through to r0=0; if non-zero, read [r7,#oAIAttackVars_Unk_0c] (AIAttackVars.Unk_0c)\
  \ and use that as the result.\n  5. strb r0,[r4,#oAIData_Unk_1a] (AIData.Unk_1a) storing the resolved\
  \ value (0..3) seen in the captured exits.\n  6. bl sub_80F02A2; if it returns non-zero, bl object_exitAttackState\
  \ to end the attack; otherwise bl sub_801171C to advance to the next sub-step.\n  7. pop {pc} returns.\
  \ r0 carries the resolved outcome (0..3), matching all captured-call exit r0 values 0,1,2,3.\n"
