name: battle_dispatchActorAIByTypeAndAIIdx_800F394
address: '0x0800F394'
kind: function
status: confirmed
summary: Tail-calls the shared actor dispatcher with a 3-entry table of handler tables, so each actor's AI handler
  is chosen by its actor type and AI index and run with all caller registers forwarded.
interface: 'void battle_dispatchActorAIByTypeAndAIIdx(void) — in: r4-r12 carry per-actor/context state to the dispatched
  handler (r0 is overwritten); out: whatever the dispatched handler returns, r4-r12 passed through.'
details: A pure trampoline. It pushes lr only to be able to return, loads r0 with the pointer to off_800F3A4 — a
  table of three word-sized entries (off_8109350, off_80F26CC, off_80EAA68), evidently one handler table per actor
  type — and tail-calls indexByActorTypeAndAIIdxThenDispatch_800F420 via bl, leaving lr pointing at the original
  caller so the callee returns straight to it. The dispatcher presumably indexes the selected sub-table by the current
  actor's AI index (read from actor data in the preserved registers) and jumps to the resulting handler, which continues
  with r4-r12 intact. No game state is touched here directly; the three sub-tables are the actual per-type AI handler
  lists (likely the three enemy/family actor kinds used by this script/battle module).
