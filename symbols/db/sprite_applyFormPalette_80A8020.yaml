name: sprite_applyFormPalette_80A8020
address: '0x080A8020'
kind: function
status: confirmed
summary: Reads a form index from a work struct and applies the matching sprite palette via sprite_setPalette.
interface: void sub_80A8020(r5 = sprite/draw work pointer, r7 = struct with form index byte at +2); r5 and r7 pass
  through unchanged, flags and r0/r1/r3 clobbered
details: 'Loads the byte at [r7,#2] (a form/variant index), uses it as an index into a byte table whose address
  is read via off_80A8030 -> off_80A8034, where the table starts at unk_2010000 (EWRAM, so the table contents are
  built at runtime rather than being ROM data). The resulting palette number is passed in r0 to sprite_setPalette,
  with r5 (the sprite/draw object whose palette should change) preserved across the call. The wrapper is a thin
  dispatcher: push r4-r7/lr, two ldrb lookups, bl sprite_setPalette, pop. r4 and r6 are pushed only for alignment/preservation
  and never touched. Callers get back whatever sprite_setPalette leaves in flags/r0/r1/r3; r5 and r7 are unchanged.

  '
