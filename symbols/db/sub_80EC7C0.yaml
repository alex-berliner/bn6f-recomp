name: sub_80EC7C0
address: '0x080EC7C0'
kind: function
status: confirmed
summary: 'AI-attack controller that plays a Thunder-style attack: init on first tick, spawns a thunder projectile
  at the caster''s panel on tick 1, then terminates after 4 ticks.'
interface: "void aiAttack_thunder_80EC7C0(void);\n  inputs:  r5 = caster battle object (oBattleObject_*), r7 = caster\
  \ AI-attack vars (oAIAttackVars_*), r10, lr\n  outputs: r1, r5, r8, r9 (r7 is preserved explicitly via guest-stack\
  \ push/pop across the spawn call)\n  clobbers: NZCV, r0, r2, r3, r4, r6, lr\n"
details: "Drives a 4-tick state machine stored in the AI attack-vars block on r7:\n  - oAIAttackVars_Unk_01 (0x01)\
  \   : init guard / current attack-state byte (0 on entry, set to 4 after setup).\n  - oAIAttackVars_Unk_00 (0x00)\
  \   : termination marker; set to 4 when the attack ends.\n  - oAIAttackVars_Unk_10 (0x10)   : local tick counter,\
  \ incremented each call (0..4).\n  - oAIAttackVars_Unk_02 (0x02)   : byte read into R2 for the spawned projectile.\n\
  \  - oAIAttackVars_Unk_0c (0x0c)   : dword propagated as R4 to spawnThunderObjectMaybe_80c954c.\n  - oAIAttackVars_Damage\
  \           : base damage; combined with AttackBoost before passing in R6.\n  - oAIAttackVars_AttackBoost    \
  \  : 16-bit bonus added to Damage for the projectile.\n\nBehaviour:\n  \"Tick 0 (entry when Unk_01 == 0): runs\
  \ one-shot setup — object_setAnimation(0xE), sub_80EB562,\"\n  object_setDefaultCounterTime(), object_setFlag1\
  \ with bit OBJECT_FLAGS_UNK_BIT_22_BIT (0x400000),\n  then sets Unk_01 = 4 and tick = 0.\n\n  Tick 1 (Unk_10 ==\
  \ 1): spawns the projectile via spawnThunderObjectMaybe_80c954c. The target column\n  comes from object_getFrontDirection()\
  \ + caster's oBattleObject_PanelX; the row is the caster's\n  oBattleObject_PanelY. R7 is spilled onto the guest\
  \ stack and reloaded afterwards because the spawn\n  call destroys r7. R3 is set to 0x0A0000 (a 0xA sub-id / flags\
  \ field packed in the high halfword),\n  R7 is forced to 0 for the call.\n\n  After each call the tick is bumped;\
  \ once it exceeds 4, Unk_00 is set to 4 to mark the attack\n  finished, ending the controller.\n\nQuirks: the\
  \ spawn path is skipped until tick 1 (so setup is on tick 0, spawn on tick 1, idle ticks\n2..4). The damage passed\
  \ in is damage + atkBoost, capped/extended into 32-bit R6.\n\nRegister form, old prompt; queued for retype (the\
  \ farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
