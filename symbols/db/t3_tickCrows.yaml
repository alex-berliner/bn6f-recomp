name: t3_tickCrows
address: '0x08143294'
kind: function
status: probable
summary: 'Per-frame loop over 8 Cybercrow lesson records at byte_2000D20: for each active slot, marks
  +1 = 8 when the player is within 0xFA<<16 hypot distance of the crow''s position, then calls sub_81432FA(i,
  1) for every active slot.'
interface: (void) -> void; touches byte_2000D20 slots (+0 state read, +1 written 8 when player near),
  calls sub_81432FA(i, 1) per active slot
details: Iterates 8 records of 0x14 bytes at byte_2000D20 using r5 as cursor and r4 as slot index. Skips
  records whose state byte at +0 is zero. For active records it reads the player overworld object via
  gameState->overworldPlayerObject, takes the player's X/Y at +0x1C/+0x20, subtracts the record's position
  at +8/+0xC, and calls calc_hypotFixed12 for the distance. If distance < 0xFA<<16 (threshold in the hypot's
  fixed-point scale), it stores 8 into the record's +1 byte (likely a state/animation selector for the
  crow reacting to the player). The 'mov r1,#3' before that store is dead — r1 is never read afterwards.
  Finally it calls sub_81432FA(r4, 1) for every active slot, presumably the per-slot crow update/tick
  with an argument flag.
