open_questions:
- The exact meaning of BattleState `Unk_0d` (a navi-side selector) and the two-byte global table at `dword_20367E0`
  are not pinned to fields in any struct, so the precise "dark-chip threshold" semantics are inferred.
  - Why the input word uses bits 9..15 as a chip-class selector (rather than just bits 0..8) is not visible
  here; this likely comes from how the chip-select UI packs the chip ID and category, but the encoder
  side is unknown. - The threshold of 0x19B (411) for skipping pack test is the only boundary constant
  observed; whether it is a chip-ID max or an offset into the pack is unclear.
