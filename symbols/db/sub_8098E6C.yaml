name: sub_8098E6C
address: '0x08098E6C'
kind: function
status: hypothesis
summary: Copies three per-entry setting bytes (with 0xFF meaning "keep current") from a 0x1C-byte-per-entry table
  into bytes 6-8 of the work struct reached via R10+0x3C, indexed by the byte at R5+4.
interface: 'int sub_8098E6C(void) /* in: r5 = source object/entry struct, r10 = context whose +0x3C holds the destination
  struct pointer; out: r0 = 0, r1 = entry index, r2 = 0x1C*index, NZ set from r0 */'
details: 'Reads the entry selector byte at [R5+4] and indexes the fixed table off_8098CFC with a 0x1C-byte stride.
  For each of the three table bytes at entry+0x18, +0x19 and +0x1A, if the value is not 0xFF it is stored to destination
  bytes 6, 7 and 8 respectively of the struct pointer loaded from [R10+0x3C]; a table byte of 0xFF leaves the destination
  byte untouched, so the table acts as "defaults to apply, or leave as-is". Always returns 0 with the NZ flags reflecting
  that zero. The destination bytes 6-8 look like a small triple of settings (possibly colours/IDs/flags) belonging
  to whatever actor or system object the R10 context represents; the exact meaning of the table (off_8098CFC) and
  of the copied bytes is not visible from this function alone. Quirk: R1 and R2 are left holding the index and the
  byte offset (0x1C*index) from the addressing math — they look like scratch leftovers rather than intended results,
  but the register contract shows callers see them.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
