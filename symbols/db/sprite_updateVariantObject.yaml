name: sprite_updateVariantObject
address: '0x08117488'
kind: function
status: probable
summary: 'Per-frame update for variant sprite objects: runs one of five state handlers selected by a state
  index until it reports done, then refreshes the sprite/OAM.'
interface: () -> r0 = 0; calls sprite_update before returning; loops internally while the dispatched handler
  returns nonzero
details: Calls sub_81175C4 to obtain a struct pointer, reads halfword [r0] as a state index (0-4) into
  table off_81174A4, and tail-invokes the selected thumb handler via mov lr,pc/bx r0 (lr = the following
  bne, so the handler's r0 is tested). A nonzero return re-enters the loop, re-calling sub_81175C4 so
  handlers can change the state index; zero exits the loop. After the loop it calls sprite_update (0x080026C4)
  to process the object's sprite struct for this frame. The five handlers (sub_81174C0/811753C/811756C/8117588/8117592)
  implement the object's states/behaviors. Called from sprite_initVariantObject, so it is the runtime
  tick for those entities.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrh r0,[r0] after bl sub_81175C4 indexes off_81174A4 — halfword is a state/handler selector;
    mov lr,pc; bx r0 with entries sub_81174C0+1 etc. — dispatched call whose r0 return drives bne loc_811748A
    loop; bl sprite_update after the loop exits — standard per-frame OAM/sprite refresh; caller sprite_initVariantObject
    sets up the entity's sprite display for a variant, so this is that entity's update tick
