name: battle_blinkOutHandler
address: '0x080BD4DC'
kind: function
status: probable
summary: Battle-object phase handler that flashes the object's sprite on/off each frame while counting
  down, then ends the phase (despawn-style blink-out).
interface: (r0 = unused, r5 = battle object header) -> r0 = 4 (next phase); updates object flags/timer/Param4
details: On first run (PhaseInitialized==0) it applies color shader 0x7FFF to the object's sprite, sets
  Param4=0x1F, plays sound effect 0x94, clears Timer, and marks the phase initialized. Each subsequent
  frame it sets the object header flag bit 2 (hide sprite), then every other frame (Timer bit 0) clears
  it again, producing a blink; Timer is incremented each frame. Param4 is decremented by 2 per frame;
  once it reaches 0 the flag bit is set (sprite hidden), Param4 is zeroed, and the object's CurPhase is
  set to 4 with the phase-initialized bit, ending the blink sequence.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] gate runs one-time setup (shader, sound 0x94,
    Param4=0x1F) then strb #4 to PhaseInitialized; bl sprite_setColorShader with dword_80BD534=0x7FFF
    tints/whitens the object''s sprite; orr/bic of oObjectHeader_Flags bit 2 on alternating Timer parity
    implements blink visibility toggling; Param4 counts down by 2 per frame until <=0, then strh #4 to
    oBattleObject_CurPhaseAndPhaseInitialized advances the state machine; callee PlaySoundEffect(0x94)
    fires once at phase entry, matching a one-shot effect cue'
