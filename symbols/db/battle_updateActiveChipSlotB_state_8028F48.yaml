name: battle_updateActiveChipSlotB_state_8028F48
address: '0x08028F48'
kind: function
status: confirmed
summary: Updates the substate byte (+7) of active-chip-list slot 11 (the chip being handled on the custom screen)
  based on the battle object's state, either clearing it to 0 when the chip may be unmarked or setting it to 1 otherwise.
interface: void sub_8028F48(/* r5 */ BattleObj* battleObj); // uses caller-set r4-r7,r10 only as pass-through; returns
  r2/r3/r4-r7 unchanged, clobbers r0,r1,lr and NZCV
details: 'Calls getLocOfActiveChips_8027E1C with a1=0xB to fetch record 11 of the active-chip list (dword_20349A0
  table, per off_8028F80). Early-exits (record untouched) if the record''s byte at +0 (state) is not 2, or if its
  byte at +7 is already 2. Otherwise it decides a new value for the record''s byte at +7: if the battle object''s
  byte at +8 is >= 5 the flag is forced to 1; otherwise it calls sub_802A57E with the battle object''s byte at +8
  in r0, and sets the flag to 0 only when that helper returns non-zero AND the battle object''s byte at +0x19 is
  zero; all other cases set it to 1. r4-r7 are preserved (pushed/popped), so the reported r2/r3 "outputs" are pass-through
  values from the caller, not produced here. The byte at +7 appears to be a per-chip substate/keep-flag used by
  later chip-handling code; value 2 means "already finalized" and blocks re-evaluation.

  '
