name: zeroFill_80024A2
address: '0x080024A2'
kind: function
status: confirmed
summary: Zero-fills the fixed 0x50-byte global struct at eStruct200a6a0, resetting it to a cleared state.
interface: void zeroFill_80024A2(void); // takes nothing in registers, returns r1 and c/v flags as left by ZeroFillByWord
  (callers effectively ignore them)
details: A no-argument thunk that loads the fixed address eStruct200a6a0 into r0 and a byte count of 0x50 into r1,
  then tail-calls ZeroFillByWord (word-wise zero fill). The 0x50-byte block at 0x0200a6a0 is a global work struct
  in EWRAM; no fields are addressed individually here, so the exact contents it resets are unknown from this function
  alone. r2-r7 and lr are preserved apart from the standard push/pop; nz flags are clobbered by the mov r1,#0x50.
