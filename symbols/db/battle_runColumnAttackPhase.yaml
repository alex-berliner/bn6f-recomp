name: battle_runColumnAttackPhase
address: '0x080B96C2'
kind: function
status: probable
summary: 'Phase handler for a battle object''s attack: it targets the first filtered column ahead of the
  object, fires a column-wide attack with a sound effect, waits 90 frames, then advances to the object''s
  next action.'
interface: (r0/r1 unused on entry, r5 = battle object pointer) -> r0 = 0 or leftover; updates oBattleObject_CurPhase,
  CurAnim, Timer, ExtraVars, CurAction
details: On phase 0 it immediately switches to phase 4, sets animation 0x15, plays sound effect 0x89,
  and loads a 90-frame timer into oBattleObject_Timer. It calls battle_findFilteredColumnAhead to get
  the x of the first column matching the object's panel filter, packs column<<16 | timer<<8 | 4 into r4,
  and calls sub_80C6EE0 with (panelX, panelY, element, DamageAndStaminaDamageCounterDisabler) plus that
  packed word — effectively a 5th argument holding the target column, duration and a type code of 4. In
  phase 4 it just decrements the timer each frame. When the timer expires it resets CurAnim to 0, writes
  2 to byte 0x0B of the ExtraVars struct (if present), sets CurAction to 0x18 and clears CurPhaseAndPhaseInitialized,
  ending this action.
