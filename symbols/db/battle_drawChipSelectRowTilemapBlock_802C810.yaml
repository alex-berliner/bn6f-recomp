name: battle_drawChipSelectRowTilemapBlock_802C810
address: '0x0802C810'
kind: function
previous_names:
- sub_802C810
status: probable
summary: Draws one of two small tilemap sprite blocks (10 halfword pairs) into unk_2034B30's 24-wide row
  buffer at x=2,y=0xE for the chip selection screen, picking the block by the caller's anim-state index.
interface: (r0 = animStateIndex 0..1) -> side effects only (writes halfwords into the row buffer via blitTileBlockToRowBuffer_802C4B6;
  returns r0=0xA, callee-saved r5/r6/r7 clobbered across the blit)
details: "Steps:\n    1. push {r5,lr}; r2 = off_802C82C pointer-table address (loaded via off_802C828\
  \ then resolved through [r2] -> off_802C82C).\n    2. r2 = [r2 + r0<<2]  -> selects one of two tile-pair\
  \ blocks (byte_802C834 for index 0, byte_802C848 for index 1) referenced by off_802C82C[0]/off_802C82C[1].\n\
  \    3. Prepares blit args: r0=2 (x), r1=0xE (y), r3=0xA (width=10 halfwords), r4=1 (height=1 row),\
  \ and tail-calls blitTileBlockToRowBuffer_802C4B6 to copy 10 halfword tile IDs from the chosen block\
  \ into the unk_2034B30 row buffer at column 2, row 14.\n    4. pop {r5,pc}; r0 ends up as 0xA from the\
  \ callee (the 0xA is the height? Actually blit's r3=0xA is width; r0=0xA return matches the callee's\
  \ documented \"out r2/r5/r6/r7 but r0 we observe from snap exits\" and is the same width value forwarded).\n\
  \  Tile content:\n    - byte_802C834 (index 0): repeating pattern 0xC4,0x90 for 10 entries (a single\
  \ tile repeated).\n    - byte_802C848 (index 1): 0xBA..0xC3 paired with 0x90 (a 10-entry gradient/sequence\
  \ of tile IDs).\n  Caller (battle_pickObjectAnimState_802BF0C) hands either 0 or 1 depending on scripted\
  \ state at +0xC of the chip-select object or bit-3 of the global frame counter, matching the two-table\
  \ slot pattern.\n  Struct context: callee writes into unk_2034B30 (24-halfword-wide row buffer) used\
  \ by the chip-select / battle row tilemap blitter pipeline.\n"
