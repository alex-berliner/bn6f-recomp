    confirms two 10-halfword blocks selected by r0. - `mov r0,#2; mov r1,#0xE; mov r3,#0xa; mov r4,#1`
    matches blitTileBlockToRowBuffer_802C4B6''s documented signature (r0=x, r1=y, r3=width_halfwords,
