name: battle_destroySelfIfBattleOver
address: '0x080E1DFC'
kind: function
status: probable
summary: If the battle has ended, flags the battle object in r5 to be destroyed by setting its state to
  CUR_STATE_DESTROY.
interface: (r5 = battle object, no args in r0/r1) -> no return value; r0 clobbered
details: Calls battle_isBattleOver to check whether battle-end conditions are met. If so (nonzero), it
  stores CUR_STATE_DESTROY into the object's combined state/phase word at oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  letting the object system tear the entity down. If the battle is still running, it does nothing and
  returns. r5 is the implicit object pointer, so this is a per-object update-style helper rather than
  a normal argument-passing routine.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_isBattleOver then tst r0,r0 / beq skips the store — action is conditional on battle
    end; mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    writes the destroy state into the object state field; callee battle_isBattleOver is documented as
    signaling battle-over conditions met; no other memory accesses: the sole effect is the state-field
    write'
