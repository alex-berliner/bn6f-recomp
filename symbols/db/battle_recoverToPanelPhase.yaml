name: battle_recoverToPanelPhase
address: '0x08017688'
kind: function
status: probable
summary: Battle-object phase handler that resets a stunned/pulled object and snaps it onto its reserved
  panel, then waits until it is freed before returning to its normal action.
interface: (r5 = battle object pointer, no register args) -> r0 = scratch; writes oBattleObject_PhaseInitialized,
  PanelX/Y, Z, CurAnim, CurAction, CurPhaseAndPhaseInitialized and many object/AI flag bits
details: 'On the first tick (PhaseInitialized == 0) it performs a one-time reset: sets ObjectFlags1 bit
  0x400000, clears flags 0x41 and the flashing-invisible timer, resets collision state and invulnerable
  time, plays SFX 0x18 (0x19-1), clears AIData Unk_48 mask 0x20005F and the PwrAtk charged state, then
  copies FuturePanelX/Y into PanelX/Y, removes the panel reservation, recomputes coordinates and collision
  panels, zeroes Z and the RelatedObject1/TempAttackObject pointers, sets CurAnim 2 (mirror via object_getFlip/sprite_setFlip),
  and saturating-adds 1 (cap 3) to Alliance. It then stores PhaseInitialized = 4 and switches to polling:
  each frame, if any joypad button is pressed in the object''s AIData it decrements the halfword at CollisionData+0x2A,
  and when that counter reaches 0 it clears ObjectFlags1 0x10000. Once flag 0x10000 is clear the handler
  cleans up (AIData Unk_44 mask 0x1000003F, flag 0x400000), restores CurAnim 0 and sets CurAction = 8
  with CurPhase/PhaseInitialized = 0, handing the object back to its normal routine.'
