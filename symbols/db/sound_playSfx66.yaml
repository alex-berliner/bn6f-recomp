name: sound_playSfx66
address: '0x0802B5D0'
kind: function
status: probable
summary: One-line wrapper that plays sound effect ID 0x66 via the M4A engine.
interface: () -> void; no return value
details: The function pushes lr, loads the constant 0x66 into r0, and calls PlaySoundEffect, then returns.
  It takes no arguments and uses no memory, so it is purely a fixed-ID sound trigger. What sound 0x66
  represents in game terms is not determinable from this code, and the only caller (sub_802AC6E) is itself
  undocumented.
