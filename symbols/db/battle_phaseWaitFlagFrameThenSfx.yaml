name: battle_phaseWaitFlagFrameThenSfx
address: '0x080C174A'
kind: function
status: probable
summary: 'Battle-object phase handler: waits for a sprite frame with attribute bit 0x80, loads a 16-bit timer with
  10, decrements it each call, then on expiry sets CurAnim=2, calls sub_80C185C/sub_80C188C, plays SFX 0x0A, and
  advances the phase to 0xC.'
interface: (r5 = battle object; r0 = phase scratch) -> void; sets object PhaseInitialized, Timer, CurAnim, CurPhaseAndPhaseInitialized
details: 'Standard phase step: if PhaseInitialized is clear, it calls sprite_getFrameParameters and tests the frame''s
  attribute byte for bit 0x80; once a flagged frame appears it marks the phase initialized (PhaseInitialized=1)
  and loads the timer with 10. Each call then decrements oBattleObject_Timer until it hits zero. On expiry it sets
  CurAnim=2, runs the two local helpers sub_80C185C/sub_80C188C (likely spawning/positioning something for this
  phase), plays sound 0x0A (0x0B + 0xFF wrap), and stores phase 0xC into CurPhaseAndPhaseInitialized, ending the
  step. The 0x80 frame-parameter bit appears to mark a specific key frame (e.g. an action/motion point) that gates
  the rest of the phase.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst 0x80 on sprite_getFrameParameters result gates arming PhaseInitialized and Timer=10 (asm loc
    before loc_80C1764); Timer countdown loop at loc_80C1764 delays the phase transition; mov r0,#0xb; add r0,#0xff;
    PlaySoundEffect => SFX id 0x0A fired at timer expiry; strb #2 to oBattleObject_CurAnim and strh #0xc to oBattleObject_CurPhaseAndPhaseInitialized
    advance the object to the next phase; Calls sprite_getFrameParameters, so behavior is tied to the object''s
    current animation frames'
