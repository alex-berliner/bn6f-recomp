  - bn6f/asm/asm31.s:20817
  - 0x080005CC PlaySoundEffect
  - 0x08002DEA sprite_getFrameParameters
  - 0x080C185C sub_80C185C
  reproduce: python3 tools/asmcat.py 0x080C174A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The summary
    matches: PhaseInitialized gates a frame-parameter 0x80 test (tst r0, #0x80), then Timer=10, decremented each
    call, on expiry sets CurAnim=2, calls sub_80C185C and sub_80C188C, plays sound via PlaySoundEffect with r0=0x0A
