name: battle_alignRowCheck_81348DC
address: '0x081348DC'
kind: function
status: confirmed
summary: Verifies a battle object's column position against its expected row offset; if aligned, repositions
  the object and clears a misalignment flag, otherwise sets the flag.
interface: void battle_alignRowCheck_81348DC(u32 row_off /*r0*/, u32 cur_x /*r1*/, u32 cur_y /*r2*/, u32
  flag_obj /*r3*/, u32 threshold /*r4*/, BattleObj* obj /*r5*/); flags nz,c,v modified; r4-r7 preserved
details: 'Gate check: if obj+0x4C bit-0 is clear the function returns immediately with flags set from
  the TST (R0=1, R1=bit-32 of obj+0x4C, nz/c from tst). Alignment path: reads a signed scroll offset s16
  at obj+0x18, left-shifts by 3 (tiles to pixels, 8 px/tile) and subtracts from cur_x to get adjusted
  X. Reads unsigned row_top (u16) at obj+0x1C and unsigned row_idx (u16) at obj+row_off to compute a signed
  diff = row_top - row_idx. If diff is negative or exceeds the supplied threshold the object is considered
  misaligned: calls sub_81171F4(1, flag_obj) to set the invalid flag and returns. Otherwise calls sub_81171D4(adj_x,
  adj_y, flag_obj, threshold, row_off) where adj_y = cur_y + (diff << 4) (16 px per row), repositioning
  the object, then calls sub_81171F4(0, flag_obj) to clear the invalid flag. Structure fields touched:
  obj+0x18 (scroll, s16), obj+0x1C (row_top, u16), obj+0x4C (gate/active bit-32). R4 is saved/restored
  via push/pop; the internal use of R4 for row_off is a temporary only.

  '
