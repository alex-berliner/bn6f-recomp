name: protectZenny_803D02C
address: '0x0803D02C'
kind: function
status: confirmed
summary: Stores a zenny value into the protected zenny save slot and re-encrypts the zenny block, guarded by an
  integrity check.
interface: void sub_803D02C(u32 r0, u32 r1, u32 r2, u32 r3, u32 r4, u32 r5, u32 r6, u32 r7, Toolkit* r10); // r0..r7
  preserved, r2/r3/r6/r7 hold callee outputs, nz/c/v from callee
details: 'Takes an incoming toolkit pointer in r10 and 8 argument words in r0-r7. Calls

  encryption_zenny_8006f78 first; if its result is non-zero (bne locret_803D03E) the

  integrity check is considered failed and the function returns immediately. Otherwise

  it loads the GameState pointer via oToolkit_GameStatePtr from the toolkit, stores

  the preserved r0 (the new zenny value) at offset oGameState_ProtectedZenny inside

  GameState, and then calls encryption_zenny_8006f54 to re-encrypt the zenny block.

  All caller-saved registers r0..r7 are preserved across both calls (callees are

  expected not to clobber them); only r1 (last encryption result) and the nz/c/v flags

  leak to the caller.

  '
