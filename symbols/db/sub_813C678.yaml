name: sub_813C678
address: '0x0813C678'
kind: function
status: hypothesis
summary: Writes zero to the halfword pointed at by the toolkit's Unk2004334 pointer (likely resetting some global
  UI/state counter).
interface: void sub_813C678(Toolkit* toolkit /* r10 */)
details: 'Tail-ish leaf helper: loads the pointer stored in the toolkit (r10) at offset

  oToolkit_Unk2004334_Ptr, then stores halfword 0 at the address it points to.

  No other registers or flags are read or written; lr is pushed only because the

  callee returns via pop {pc}. The toolkit pointer is passed in r10 rather than

  r0, which is the convention for functions reached through the farcall/trap

  dispatch mechanisms, so this is plausibly a callback or hook that resets the

  field at 0x2004334 (unknown what gameplay system owns that halfword — could be

  a timer, counter, or message/state index).

  '
