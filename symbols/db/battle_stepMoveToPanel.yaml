name: battle_stepMoveToPanel
address: '0x080DB75C'
kind: function
status: probable
summary: 'Per-frame step of a battle object''s move-to-panel action: on phase 0 it calls sub_80DB828 to
  set up and sub_80DB864 to test, otherwise each frame decrements Timer, advances X by XVelocity toward
  the target panel pixel coordinate, re-snaps PanelX/PanelY via object_setPanelsFromCoordinates, and sets
  CurAction=4 / CurPhase=0 to end the action.'
interface: (r0 = battle object (r5 also holds it)) -> r0 = destroyed; writes oBattleObject_CurPhase/CurAction/Timer/X/PanelX/PanelY
details: 'On entry with CurPhase==0 it initializes: sets CurPhase=4, calls sub_80DB828 (likely computes
  target panel/velocity) and sub_80DB864 (likely an arrival/abort check); if that returns nonzero it finishes
  immediately. Otherwise each frame it decrements Timer, converts PanelX/PanelY to pixel coordinates via
  object_getCoordinatesForPanels, adds XVelocity to X, and when X matches the target pixel coordinate
  (and sub_800E708 permits) it stops, calls object_setPanelsFromCoordinates to snap PanelX/PanelY to the
  new world position. On arrival or Timer expiry it sets CurAction=4 and CurPhase=0, ending the action.
  The r5 register holding the object without any caller shown is a quirk.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'phase 0 branch: strb #4 CurPhase then bl sub_80DB828 / sub_80DB864, so phase 0 is one-time
    setup; loop: ldrh Timer, sub #1, ble loc_80DB7A8 — bounded duration movement; object_getCoordinatesForPanels(PanelX,PanelY)
    compared against old X to detect reaching the target panel column; X = X + XVelocity each frame, then
    object_setPanelsFromCoordinates on completion; exit path sets CurAction=4 and CurPhase=0, the standard
    end-of-action pattern in battle object state machines'
  refs:
  - bn6f/asm/asm31.s:77282
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x0800E2AC object_setPanelsFromCoordinates
  - 0x0800E708 sub_800E708
  reproduce: python3 tools/asmcat.py 0x080DB75C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s core flow matches: init phase=4, call sub_80DB828 then sub_80DB864, bail if nonzero;
    then each frame decrement Timer, convert PanelX/PanelY to target pixel X via object_getCoordinatesForPanels,
    add XVelocity to X, compare against target, and finalize. However the summary says ''eases along X
    until it reaches target panel'' but the code only updates X (never Y/Z), and the comparison uses the
    previously-loaded target X (r2) against the old X (r1, not the newly-written r0), so it''s checking
    pre-step X == target. Also CurAction=4 is written at finish, not ''CurAction=4 then CurPhase=0 ending
    the action'' in that sense; phase is set first to 4 then 0. The name ''battle_moveToPanelStep'' is
    reasonable but ''battle_stepMoveToPanel'' better reflects the per-frame step nature and the object''s
    perspective.; run wf investigate investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
