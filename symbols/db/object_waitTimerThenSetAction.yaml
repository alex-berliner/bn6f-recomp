name: object_waitTimerThenSetAction
address: '0x080BFAAE'
kind: function
status: probable
summary: 'Battle-object delay handler: on first entry initializes the object''s Timer, then counts it
  down each frame and, when it expires, sets the object''s CurAction to 4 and clears its phase.'
interface: (r5 = battle object pointer, no args in r0-r3) -> r0 = scratch; no return value; sets oBattleObject_Timer,
  oBattleObject_PhaseInitialized, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: Uses r5 as the battle object. If oBattleObject_PhaseInitialized is 0, it stores Timer=0 and PhaseInitialized=4,
  marking this phase as set up. It then decrements oBattleObject_Timer; while the result is still positive
  it returns, and once the timer has counted down (0 -> -1, so effectively fires the first call after
  init unless the timer is preset) it writes CurAction=4 and CurPhaseAndPhaseInitialized=0, handing control
  back to the object's action dispatcher. This is the standard BN6 battle-object 'wait N ticks then advance
  to action' pattern; the object must be switched back to a phase that sets Timer again for the wait to
  repeat.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / bne: init block only runs once per phase, sets
    Timer=0 and PhaseInitialized=4; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt: per-frame
    countdown of the object Timer; mov r0,#4; strb r0,[r5,#oBattleObject_CurAction]: on expiry the object
    is moved to action 4; mov r0,#0; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized]: phase state
    cleared so the dispatcher re-runs phase logic; two trailing .word literals (0x640000, 0xA0000) are
