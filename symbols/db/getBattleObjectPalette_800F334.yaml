name: getBattleObjectPalette_800F334
address: '0x0800F334'
kind: function
status: confirmed
summary: Computes the OAM palette bank for a battle object from its AI data's actor type, version, and unk03 (variant)
  fields.
interface: u8 battle_getObjectPalette_800F334(BattleObject* obj /* r5 */) -> r0 = palette index; also returns r1
  = actorType, r2 = version (or version*unk03 for viruses); clobbers r3, NZCV; preserves nothing extra
details: 'Reads the object''s AIData pointer (BattleObject + oBattleObject_AIDataPtr), then loads oAIData_ActorType
  (offset 0), oAIData_Version_16, and oAIData_Unk_03. If the actor type is ACTOR_TYPE_VIRUS (0), the palette index
  is simply version * unk03, letting viruses pick palettes across their version/variant grid. For all other actor
  types, version is first mapped through the byte table byte_800F354 ({0,0,0,0,3,1,0,0}) to a palette base, then
  multiplied by unk03; versions 4 and 5 map to palette bases 3 and 1 respectively, all others to 0, so the multiplier
  only shifts the palette for those entries. Side-effect register returns are a quirk kept from the original: r2
  receives version * unk03 for viruses, plain version otherwise, and r1 always receives the actor type.

  '
