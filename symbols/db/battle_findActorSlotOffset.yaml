  reproduce: python3 tools/asmcat.py 0x0800B4CE
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s scan of oBattleState_AliveOpponentActors and oBattleState_BattleObjectList,
