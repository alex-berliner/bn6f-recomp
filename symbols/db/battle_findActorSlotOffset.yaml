open_questions:
- exact role of effect bit 0x8 that suppresses the first-slot match
- how battle_linkSendTaggedPacketMode3 consumes the returned offset (packet field layout unknown)
- meaning of the fields between AliveOpponentActors and Drop (are they ally/enemy actor slots?)
- The code matches the proposal's scan of oBattleState_AliveOpponentActors and oBattleState_BattleObjectList,
  returning offset 0 via loc_800B50A on no match or on the effect-0x8 case. However, the offset is stored
  in r4 and returned via pop {pc}, so r0 holds the actor pointer (not the offset), contradicting the proposed
  interface. The summary should clarify r4 is returned (offset or 0).
