name: aiAttack_BeginAttackSequence_80EB84C
address: '0x080EB84C'
kind: function
status: confirmed
summary: Starts a new AI attack sequence on an attack-vars block, choosing the attack command and resetting its
  timer.
interface: void aiAttack_BeginAttackSequence(AIAttackVars *vars /* r7 */); /* returns r0=8, r1=vars->Unk_03, NZ
  from r0=8, C/V unchanged */
details: 'Operates on the AI attack-vars struct passed in r7 (offsets used: oAIAttackVars_Unk_00 = attack timer,
  stored as halfword with the constant 8; oAIAttackVars_Unk_03 = byte selector read at entry; oAIAttackVars_Unk_12
  = attack command, stored as halfword; oAIAttackVars_Unk_30 = 32-bit state/counter field, zeroed). The command
  written to Unk_12 is 2 when the Unk_03 byte equals 11 (0xB), otherwise 1; so Unk_03 acts as a mode/attack-kind
  selector for the sequence about to run. Unk_30 = 0 resets the sequence''s progress/state, and Unk_00 = 8 reloads
  the countdown/step timer that presumably ticks down each frame while the attack plays out. Quirk: the function
  is not void in practice - it leaves r0 = 8 and r1 = the Unk_03 byte it read, and the final "mov r0,#8" sets N/Z
  (both cleared) while leaving C/V as they were; the register contract shows callers see nz and r0/r1, though nothing
  suggests the values are consumed meaningfully.

  '
