name: navicust_validatePartPlacement
address: '0x0813BAEC'
kind: function
status: probable
summary: Confirms a Navi Customizer part can be placed by checking panel and overlap rules.
interface: (r0 = part header pointer, r1 = placement data ptr, r2 = ?, r3 = ?) -> r0 = 0 if legal, non-zero
  otherwise
details: Saves args, calls battle_checkPanelPlacement_813BB00; if that succeeds (Z set), it then calls
  navicust_checkPieceOverlap to test collision with already-placed pieces. Returns the non-zero/zero status
  flag from whichever check fails (or 0 if both pass). Used as the final validation gate by navicust_checkPartPlacement
  when confirming where the hovered part lands.
