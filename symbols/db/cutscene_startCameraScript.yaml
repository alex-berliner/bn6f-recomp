name: cutscene_startCameraScript
address: '0x08089CC4'
kind: function
status: probable
summary: Cutscene step that loads camera script byte_8089480 into a context object and starts it playing.
interface: (r5 = scenario/cutscene context object; args unused) -> r0 clobbered; stores camera script
  ptr at [r5,#0x3c], sets byte [r5,#0x13] = 1
details: First refreshes the scenario-effect player-offset matrix via battleObject_scenarioEffectInitPlayerOffsetMatrix_81429CA,
  then loads the address byte_8089480, saves it into the context object field at +0x3C, and hands it to
  SetCutsceneCameraScript, which points the cutscene camera engine at that script and resets its command
  timer. Finally sets byte +0x13 to 1, likely an 'active/running' flag or step counter for the cutscene.
  r5 is the caller-provided context struct; r0-r3 inputs are ignored.
