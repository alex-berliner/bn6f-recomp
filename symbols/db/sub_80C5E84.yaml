name: sub_80C5E84
address: '0x080C5E84'
kind: function
status: confirmed
summary: Per-frame update of the highlight-then-teleport battle-object action (timer-driven panel highlight, then
  sprite swap + SFX 0xB9 on success, or self-destruct if the destination panel becomes invalid).
interface: void sub_80C5E84(struct BattleObject *r5_obj);  // reads/writes r5, returns nothing meaningful; clobbers
  r0/r1/r2/r3/lr, NZCV; preserves r4/r5/r6/r7/r10
details: "Object passed in r5 is a battle object (uses oBattleObject_* offsets). Runs each frame while CurAction\
  \ is in this state:\n  - While (Timer & 4) == 0, redraws the panel highlight at (PanelX, PanelY) via object_highlightPanel.\n\
  \  - Decrements oBattleObject_Timer (u16) by 1 each call; if the pre-decrement value was > 1, returns early.\n\
  \  - On timer expiry, if oBattleObject_Param4 is set it queries object_getPanelParameters for the same (PanelX,\
  \ PanelY); if bit 0x10 of the returned flags is clear the teleport destination is no longer valid, so it clears\
  \ the collision region (object_clearCollisionRegion) and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized\
  \ to terminate the object.\n  - Otherwise (success path) it loads a teleport sprite (sprite_load with palette\
  \ 0x10, tile bank 0x26, base id 0x80), drops the shadow (sprite_noShadow), sets bit 1 of the object header flags\
  \ (oObjectHeader_Flags |= 2) to mark the sprite as visible, zeros CurAnim / CurAnimCopy, kicks off sprite_setAnimation(0)\
  \ + sprite_loadAnimationData, mirrors the existing flip via object_getFlip -> sprite_setFlip, and re-enables collision\
  \ with object_setCollisionRegion(1).\n  - If oBattleObject_Param1 is nonzero, sub_8109794 is called with (PanelX,\
  \ PanelY) — presumably to update whatever panel state is linked to this object after the warp.\n  - Plays SFX\
  \ 0xB9 (PlaySoundEffect), then transitions to CurAction = 4 and zeroes CurPhaseAndPhaseInitialized, handing control\
  \ to the next action.\nQuirks: the timer guard uses Timer & 4 (bit 2) as a \"highlight active\" flag separate\
  \ from the countdown; the visible-sprite flag is oObjectHeader_Flags bit 1, not a separate field.\n"
