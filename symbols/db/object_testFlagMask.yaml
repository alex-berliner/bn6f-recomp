name: object_testFlagMask
address: '0x080D4C6C'
kind: function
status: probable
summary: Returns 1 if (object's extra flags & mask) != expected value, else 0 — the projectile collision
  handler uses this to decide destroy vs. continue.
interface: (r5 = battle object) -> r0 = 1 if (extra->flags & mask) != expected, else 0; flags clobbered
details: Loads the pointer in the object's ExtraVars field, reads the first word through it as a flags
  value, ANDs it with the mask word at ExtraVars+4, and compares the result to the word at ExtraVars+8.
  Sets r3=1 when the masked value differs from the expected value, 0 when equal, and returns it in r0.
  The three operands (value, mask, expected) form a small condition record attached to the object; no
  other state is touched. Only object_updateProjectileFrame calls it, choosing between destroying the
  collided projectile and stepping it forward.
