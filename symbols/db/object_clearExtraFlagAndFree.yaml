name: object_clearExtraFlagAndFree
address: '0x080BF69C'
kind: function
status: probable
summary: 'Object destructor: clears the first byte of the object''s ExtraVars block (if any) and then
  frees the battle object''s slot.'
interface: (r5 = battle object pointer, oBattleObject layout) -> r0 = object_freeMemory result; no meaningful
  flags
details: Loads the object's ExtraVars pointer from [r5,#oBattleObject_ExtraVars]; if non-NULL it stores
  0 into the first byte of that block, then unconditionally calls object_freeMemory to release the object
  slot (flags, bitmap slot, active-list unlink, sprite scaling reset). The cleared byte likely disables
  or marks the extra data (e.g. an alive/enabled flag) before the object is torn down. Note r5 is caller-supplied
  and no callers are known, so the exact role of the cleared byte and which object types use this path
  are unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0,[r5,#oBattleObject_ExtraVars]; tst r0,r0; beq skip — reads the object's extra-data pointer;
    strb r1,[r0] with r1=0 — zeroes the first byte of the ExtraVars block; bl object_freeMemory — ends
    by releasing the battle object slot like other object destructors
  refs:
  - bn6f/asm/asm31.s:16106
  - 0x08003458 object_freeMemory
  reproduce: python3 tools/asmcat.py 0x080BF69C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
