name: musicGameState_8000784
address: '0x08000784'
kind: function
status: confirmed
summary: Asks the sound driver to switch music state (via callback sub_814EA58) and marks the game state so background
  music is treated as off.
interface: void music_stopBgm(u32 argR0, u32 argR2, Toolkit *toolkit /*r10*/); sets r0 = 0xFF, r1 = toolkit, flags
  NZ from the 0xFF load
details: 'Saves r10 (the Toolkit pointer) on the stack, loads the Thumb callback sub_814EA58 into r3, and calls
  sound_8000808 with r0 and r2 passed through unchanged — this is the sound-driver request path used to change or
  stop the current music state. After the call it restores r10, reads Toolkit.gamestate (oToolkit_GameStatePtr),
  and stores 0xFF into GameState.bgMusicIndicator (oGameState_BGMusicIndicator), which is the engine''s flag that
  no background music is playing (0xFF = none/off). The Thumb "mov r0,#0xFF" incidentally sets NZ flags. r4-r7 and
  r10 are preserved; the load of the gamestate pointer into r7 is dead because r7 is restored by the epilogue pop.

  '
