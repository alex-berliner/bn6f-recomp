name: spawn_facingOffsetEffect
address: '0x080D0230'
kind: function
status: probable
summary: Spawns an effect object (type 0x12 or 0x13 from table at 0x80D0264, selected by r0) at the caller's
  battle-object position offset 0x140000 in the front-facing direction and +/-0x180000 vertically depending
  on [r5+5].
interface: (r0 = effect selector, also passed to object_getFrontDirection; r5 = battle object ptr in caller)
  -> r0 = spawned effect object; r4, r6 clobbered
details: 'Uses the caller''s r5 as a battle object: [r5+0x34] is the x position and [r5+0x38] the y position,
  both in 16.16 fixed point. It multiplies object_getFrontDirection''s +1/-1 result by 0x14 (20px) and
  adds it to x, so the effect appears one ''step'' in front of the object. The y offset is +/-0x18 (24px),
  with the sign chosen by the flag byte at [r5+5] (nonzero = positive). The effect ID is read from the
  2-byte table dword_80D0264 = {0x12, 0x13}, indexed by the argument r0 (also forwarded to object_getFrontDirection),
  and the effect is spawned via the type-4 effect-object wrapper. Note the function never sets r5 itself,
  so it relies on the caller''s register state.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mul r0, r1 with r1=0x14 after bl object_getFrontDirection gives x offset of 20*direction (asm
    lines 3-6); add r1/r2 from [r5,#0x34] and [r5,#0x38] shows it offsets the object's x/y position fields;
    tst of ldrb [r5,#5] with neg r3 (0x18<<16) picks the +/- vertical offset; ldrb r4, [r4,r6] from dword_80D0264
    = 0x1213 selects effect ID 0x12 or 0x13 by argument; tail bl spawn_t1_0x0_EffectObject spawns the
    type-4 effect object with those coords and ID
  refs:
  - bn6f/asm/asm31.s:52663
  - 0x0800E2CA object_getFrontDirection
  - 0x080E05F6 spawn_t1_0x0_EffectObject
  reproduce: python3 tools/asmcat.py 0x080D0230
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The table dword_80D0264 = 0x1213 is little-endian, so ldrb at [r4,r6] yields 0x13 for r0=0 and 0x12
    for r0=1, not {0x12, 0x13}. The proposal also misses that [r5+0x3c] is loaded into r3 before the spawn
    call (line 12). The interface otherwise matches: r0 selects effect/forwarded to object_getFrontDirection,
    r5 is caller-saved battle object, r0=spawned pointer, r4/r6 clobbered.; run wf investigate investigate-20261019-003606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- Which visual effects IDs 0x12/0x13 are (needs effect-resource data)
- Exact meaning of the r0 selector (0/1 variant vs something else) and why it is also passed to object_getFrontDirection
- Semantics of the flag byte at [r5+5] and which caller contexts set r5 to which object
- 'The table dword_80D0264 = 0x1213 is little-endian, so ldrb at [r4,r6] yields 0x13 for r0=0 and 0x12
  for r0=1, not {0x12, 0x13}. The proposal also misses that [r5+0x3c] is loaded into r3 before the spawn
  call (line 12). The interface otherwise matches: r0 selects effect/forwarded to object_getFrontDirection,
  r5 is caller-saved battle object, r0=spawned pointer, r4/r6 clobbered.'
