name: sprite_blitTileEntryToBitBuffer
address: '0x080461D0'
kind: function
status: probable
summary: 'Animation-opcode handler: blits a 0x60-byte tile entry (12 rows of 8 bytes) from the sprite
  tile-data base at work+0x18 into the bit-packed render buffer, advancing the bit cursor by a per-bank
  width-table value and a per-row byte stride from work+0.'
interface: (r1 = tile/entry index into the 0x60-byte tile data array at work+0x18) -> r0 = destroyed;
  updates work at byte_200A220 (bit cursor +0x1c, byte counter +0x3c), no return value
details: 'Uses the sprite work area at 200A220: +0x18 is a tile-data base whose entries are 0x60 bytes,
  selected by r1 (stride 0x60 via mul 0x60*r1). +0x1c is a bit cursor split into a word index (>>5<<2
  added to the +0x20 bitstream buffer) and a bit offset (&0x1f) used as the insert position. A table chosen
  by the bank byte at +0x3 (three tables: byte_8043CA4/byte_8043E84/byte_8044064) is indexed by r1; its
  value is added to a counter at +0x3c and <<2 to the bit cursor, so it encodes the tile''s consumed width.
  The loop copies 12 rows (2 source words each), shifts them into the destination word(s) at the current
  bit offset (writing up to 3 destination words as the field spans word boundaries), and advances the
  destination pointer by the row-stride byte at work+0 each row. Destination pointer starts from work+0x38
  saved on the stack. This is a software sprite-composition step: placing variable-width tile data bit-aligned
  into a scratch bitmap, invoked as one opcode of the animation interpreter (caller sub_8046154).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'caller sub_8046154 is described as dispatching an animation opcode stream, so this is one opcode''s
    handler; mul r7,#0x60 / add r7,[r5,#0x18]: reads a 0x60-byte entry of tile data selected by r1; ldr
    r6,[r5,#0x1c]; lsr/lsl #5 & and #0x1f: bit cursor split into word index into +0x20 buffer and bit
    offset; ldrb r3,[r4,r1] from off_8046284 tables (selected by byte at +0x3) then cursor += val<<2,
    counter +0x3c += val: per-tile width table; loop of 12 iterations copying 2 words with shifts by r9/r10
    and r8 += [work+0] stride: row-by-row bit-aligned blit into a bitmap'
  refs:
  - bn6f/asm/asm03_2.s:283
  - 0x08046154 sub_8046154
  - 0x080463A0 sub_80463A0
  reproduce: python3 tools/asmcat.py 0x080461D0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly correct: +0x18 base, stride 0x60, three-bank width table indexed by +0x3,
    bit-cursor handling at +0x1c/+0x20, and counter at +0x3c all match. However, the loop bound is r6
    starting at 0xb (=11) and decremented until <0 (bge loc_8046222), so it iterates 12 times (0..11),
    copying 12 rows. Also `add r8, r0` at the end uses byte `[byte_200A220]` (work+0, a byte row stride),
    not work+0x38 as stated. The destination pointer is loaded from work+0x38 and stored on stack. A better
    name reflects opcode-driven sprite tile blit with per-row stride.; run wf investigate investigate-20261018-212108;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
