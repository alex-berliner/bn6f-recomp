name: navicust_confirmPartPlacement
address: '0x08136450'
kind: function
status: probable
summary: 'Navi Customizer screen: attempts to confirm the currently selected part placement, redrawing
  the board and playing select/error sounds.'
interface: (r0 = selection value stored to state+0x18, likely part ID or cell index; r5 = Navi Cust screen
  state struct) -> r0 = 0; flags from sub_81364BC choose valid vs invalid path
details: 'First calls sub_81364BC whose flags gate everything: if the check fails it only plays SOUND_CANT_JACK_IN
  and returns. On success it saves r0 as a halfword into state+0x18 and calls sub_81364E8 (likely applying
  the pending selection). It then branches on state byte +0x10: if clear it sets state+0x2 = 4 (a screen/substate
  transition), zeroes +0xe and +0x14, calls sub_813B920 and the sub_81362F8/sub_8135F18/sub_81366D0 reset
  chain, then sub_813660C(0) and navicust_drawBoardTilemap(0). If +0x10 was set it clears it, calls sub_813660C(1)
  and navicust_drawBoardTilemap(1) instead, and zeroes +0xe/+0x14 — so +0x10 looks like an ''install vs
  remove/alternate mode'' flag. Both success paths end with SOUND_MENU_SELECT, and both redraw the 49-cell
  board via navicust_drawBoardTilemap with the mode passed through.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: flags of bl sub_81364BC select valid path vs 'bne loc_81364B4' which only plays SOUND_CANT_JACK_IN;
    'strh r0, [r5,#0x18]' latches the argument into the screen state before applying it; both branches
    call navicust_drawBoardTilemap with 0 or 1 and PlaySoundEffect(SOUND_MENU_SELECT), i.e. a confirmed
    board edit; 'mov r0,#4; strb r0,[r5,#2]' writes a screen/substate ID, typical of menu state machines;
    sole caller sub_813612C and callee navicust_drawBoardTilemap place this in the Navi Customizer screen
  refs:
  - bn6f/asm/asm36.s:13052
  - 0x0813612C sub_813612C
