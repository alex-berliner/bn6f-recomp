name: navicust_confirmPartPlacement
address: '0x08136450'
kind: function
status: confirmed
summary: Commits a part/chip placement on the NavICust board after validating the target slot; opens a submenu or
  repaints the board depending on navigation depth.
interface: void navicust_confirmPartPlacement(void); // r5 = NavICust state ptr (in), r2/r10 passed to callees (in);
  r8-r12 side-effected (out)
details: "Validates the hovered slot via navicust_checkPartPlacement (result in r0, Z flag).\nIf invalid, plays\
  \ SOUND_CANT_JACK_IN and returns.\nOn success: stores the slot halfword at state+0x18, calls navicust_installSelectedPart.\n\
  Then branches on submenu-depth byte at state+0x10:\n  0  – entering a part-configuration submenu: sets busy status\
  \ to 4 at +0x2,\n       clears tick counters at +0xE and +0x14, runs init chain\n       (sub_813B920, sub_81362F8,\
  \ navicust_getCellProgramId,\n       battle_trackObjectIdInList, sub_813660C(0)), repaints board,\n       plays\
  \ SOUND_MENU_SELECT.\n  ≠0 – leaving back to the parent grid view: clears +0x10, repaints with\n       sub_813660C(1)\
  \ and navicust_drawBoardTilemap(1), resets counters\n       at +0xE/+0x14, plays SOUND_MENU_SELECT.\nState fields\
  \ touched: +0x2 (UI mode/status), +0x10 (submenu depth),\n+0x14 (timer), +0x18 (confirmed slot index, u16).\n"
