name: ai_attackStepTimerEnd
address: '0x080FC208'
kind: function
status: probable
summary: 'AI attack-var handler: when the attack''s StepTimer runs out, ends the charge/hold state, marks
  the object as moving, and sets hit element 0xC.'
interface: (r7 = battle object with AI attack vars) -> void; sets/clears ObjectFlags1 bits and writes
  oAIAttackVars_HitElement
details: Decrements the object's oAIAttackVars_StepTimer at [r7,#...] and returns while it is still >0.
  Once the timer expires (result <= 0), it clears ObjectFlags1 bit 0x40 via object_clearFlag (likely a
  per-attack state such as charging/holding), sets the ObjectFlags1 'currently moving' bit (1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)
  via object_setFlag1, and stores 0xC into oAIAttackVars_HitElement. The early-out via bgt means the post-timer
  actions run on the tick the counter reaches zero and also every later call while it stays <= 0. It operates
  purely on the battle object pointed to by r7, consistent with AI attack step handlers that run in the
  battle sweep route.
