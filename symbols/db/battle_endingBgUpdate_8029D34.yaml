name: battle_endingBgUpdate_8029D34
address: '0x08029D34'
kind: function
status: probable
summary: While a battle is ending, swaps the background tile block 3 strip for the ending sequence, or
  delegates to a late-phase handler past phase 0x1C.
interface: void battle_endingBgUpdate_8029D34(void) // r5=battle_state (phase @ +0x40, &0x1F), r4 forwarded
  to sub_8029D80; clobbers r0-r3, preserves r4-r7; NZCVV undefined
details: 'Guards on battle_IsBattleEnding_800A97A; returns immediately if the battle is not ending.

  Reads the ending-phase counter from [r5+0x40] masked to 5 bits (&0x1F).

  If phase >= 0x1C: calls sub_8029D80 (late-phase ending handler; r4/r5 still hold caller''s

  battle-state and object pointers at entry to that callee).

  Otherwise: calls CopyBackgroundTiles to write a 7x2-tile strip into tile block 32x32 index 3

  at grid origin (col 0xF, row 4). The tile-ID table (byte_8029D64) holds 28 u16 entries whose

  low bytes form the sequence 8D,8E,8F,90,91,92,93,94,95,96,97,98,99,9A interleaved with 0x90

  filler, producing a horizontal background band used during the earlier ending phases.

  r6, r7, r10 are passed through from the caller but not inspected here.

  '
