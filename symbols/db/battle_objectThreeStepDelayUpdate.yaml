name: battle_objectThreeStepDelayUpdate
address: '0x080BAD76'
kind: function
status: probable
summary: Battle-object update that waits 16 frames per step, fires sub_80BAEC0 for steps 0-2, then ends
  the action with CurAction 0x14.
interface: (r5 = battle object) -> void; sets oBattleObject fields PhaseInitialized, Param3, Timer, CurAction,
  CurPhaseAndPhaseInitialized
details: 'Standard phase-initialized pattern: on first run it sets PhaseInitialized=4, clears Param3 and
  Timer, and returns. Afterwards it decrements Timer each call and, once it hits zero, calls sub_80BAEC0
  with r0 = Param3 (step index), increments Param3, and reloads Timer with 0x10. After the third step
  (Param3 reaching 3) it sets CurAction = 0x14 and zeroes CurPhaseAndPhaseInitialized, handing control
  back to the object''s action dispatcher. No return value; relies on r5 as the object pointer, so it
  is called as a state-machine step, not a leaf helper.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'first-run block sets PhaseInitialized=4 and clears Param3/Timer (sub_80BAD76 prologue); main
    path: ldrb r0,[r5,#oBattleObject_Param3]; bl sub_80BAEC0; add r0,#1 — passes the step index to the
    callee; cmp r0,#3; bge loc_80BADAA followed by Timer=0x10 — three steps of 16 frames each; locret
    path sets CurAction=0x14 and CurPhaseAndPhaseInitialized=0, the usual action-finished transition;
    no callers known; callee sub_80BAEC0 also unnamed, so the payload of each step is unknown'
  refs:
  - bn6f/asm/asm31.s:6201
