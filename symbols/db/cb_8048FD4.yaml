kind: function
status: confirmed
summary: Subsystem tick callback dispatched by the state byte at eS200A290, firing completion event 0xDA arg 2 when
  the subsystem reports no longer in use.
interface: 'void subsystemTick_cb_8048FD4(void);

  // clobbers NZCV and r0–r3, r5 (restored), r12, lr

  // preserves r4, r6, r7 (r5 saved/restored around handler dispatch)

  // no explicit inputs; reads global state byte eS200A290

  '
details: 'Top-level "cb_" tick callback (per its name and signature). Loads a

  pointer to the state struct at eS200A290 into r5, then reads the low

  state byte and uses it (shifted as 0/4/8/12) to index a four-entry

  jump table at off_8048FF4 whose entries are the four subsystem

  handlers sub_804900C / sub_8049058 / sub_8049080 / sub_804971C. The

  selected handler is called with r5 pointing at the eS200A290 struct

  (and r1 = the offset value, r0 = pointer into the jump table slot);

  lr is rewritten for a bx-thunk style call, so handler semantics are

  those of a Thumb-mode function dispatched through the table.


  After the handler returns, the routine asks IsCurSubsystemInUse and

  bails out (skipping the completion event) if it returns non-zero. If

  the subsystem has finished it raises the framework completion event

  0xDA with argument 2 via sub_803C59C ("event 0xDA arg 2"), which in

  BN6 is the standard "subsystem finished, tear down" pair (id 0xDA,

  payload byte 2).


  r4/r6/r7 are preserved by the push/pop frame; r5 is only "clobbered"

  in the sense that the readable C explicitly saves/restores it around

  the handler dispatch, since r5 was banked to eS200A290 for the handler.

  The hand-written readable notes that the actual ARM-side register

  contract (per the lifter) shows r2/r4/r6/r7/r8/r9/r10/r11/r12 and lr

  as inputs to the thunked handler, which is consistent with the

  parent engine''s handler calling convention rather than something this

  stub itself consumes.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
