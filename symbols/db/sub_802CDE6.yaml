name: sub_802CDE6
address: '0x0802CDE6'
kind: function
status: confirmed
summary: Detach the BattleObject passed in r5 from its alliance's tracking slot in the battle arena, clearing the
  slot if it currently owns it.
interface: void sub_802CDE6(struct BattleObject *r5 /* in */);
details: 'Reads the object''s alliance byte at oBattleObject_Alliance to pick one of two

  back-to-back slots in a global arena array anchored at dword_203CFB0 (alliance 0

  uses the slot at base+0x0C; non-zero alliances use the base+0x00 slot). Each slot

  holds a current-owner pointer at +4 and a secondary tracking field at +8. If the

  passed BattleObject equals the slot''s current owner, both the owner pointer and

  the +8 field are cleared to 0, so the slot no longer tracks this object. Clobbers

  r0,r1 and the nzc/v flags; lr is the return address.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
