name: object_initCenteredSprite
address: '0x0811C0AC'
kind: function
status: probable
summary: 'Initializes a battle object: stores its type/state byte, sets up sprite resource 0x3D with animation 4,
  no shadow, and positions it at x=0x78.'
interface: (r5 = object struct pointer) -> void; r0-r3 clobbered; ends by tail-calling sub_811C0F8
details: Takes the object in r5 (never reloaded, so r5 is a caller-provided object pointer). Writes 0x23 into the
  object's first byte (likely a type/state id), then calls initGuiSprite with resource id 0x3D to attach a sprite.
  Sets animation index 4, loads its animation data, and disables the shadow. Stores halfword 0x3C0 via the slot
  list (probably a tile/attribute value), sets palette bank 0xF, sub-record field A to 0, and OAM priority 1. Positions
  the sprite at x=0x78 (screen center) with y taken from object field +4, then overwrites object byte +4 with 0x10
  and byte +8 with 4 (likely timers/state), and tail-calls an unknown helper sub_811C0F8.
