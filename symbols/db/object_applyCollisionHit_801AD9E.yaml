summary: 'Applies a collision hit to a battle object: guards against battle flags/dead targets, on HitModifierFinal
  bit 0x40 marks the hit state (ObjectFlags2 0x100, clear 0x4, Unk_0f=1), then recomputes final damage
  and spawns the hit effect.'
details: 'r5 is the target battle object, r2 flows through to object_spawnHiteffect. sprite_clearFinalPalette,
  r7 = oBattleObject_CollisionDataPtr; early-out ladder: battle_getFlags bit 0 set -> return; object_removeCollisionData;
  battle_isBattleOver -> return; object_getFlag & 0x100 (dead) -> return. Then reads oCollisionData_HitModifierFinal;
  the hit-state block runs only when the object LACKS ObjectFlags bit 0x40 AND HitModifierFinal HAS bit
  0x40: object_setFlag2(0x100), object_clearFlag2(4), sub_801A6A6, and 1 into oBattleObject_Unk_0f. Tail
  (all non-exited paths): object_calculateFinalDamage2, object_spawnHiteffect.

  '
