open_questions:
- Whether r5 always points at a real BattleObject or could be a generic object whose
- offset 0x10 is also an animation index (the dispatch key is just "CurAnim"); without
- seeing the callees' bodies it is not certain what animation states 0 and 1 mean.
- No callers are listed, so call sites would clarify whether this fires for every
- BattleObject each frame or only for specific object types.
