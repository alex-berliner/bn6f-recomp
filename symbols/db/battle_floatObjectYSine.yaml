    (0x1 / 0xFFFFFFFF words) — ±1 sign multiplier via r5+0x74; add r1,[r5,#oBattleObject_ExtraVars+0x18];
    str r1,[r5,#oBattleObject_Y] — base height plus bob stored to object Y'
