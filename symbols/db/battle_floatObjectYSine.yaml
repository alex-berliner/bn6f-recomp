name: battle_floatObjectYSine
address: '0x0810FA64'
kind: function
status: probable
summary: Oscillates a battle object's Y position with a sine-wave bob around a base height.
interface: (r0 unused; r5 = battle object) -> updates [obj+oBattleObject_Y]; no meaningful return/flags
details: The routine reads a byte at obj+0x76 (a per-frame counter/step) and adds it to an accumulated
  angle at obj+0x77, doubling the sum as an index into math_sinTable. The sine value is scaled by 12 <<
  8 (amplitude), then multiplied by a ±1 factor picked from byte_810FA98 via (obj+0x74)*4 — entries 1,0,0,0
  / -1,-1,-1,-1 select bobbing up or down. The result is added to a base Y held in ExtraVars+0x18 and
  written to oBattleObject_Y, giving a smooth floating/bobbing vertical motion. The 0x74 byte therefore
  acts as a phase/direction selector shared by several objects pointing at the same table pairs.
