name: ai_chargePanelStrikeUpdate
address: '0x0810883A'
kind: function
status: probable
summary: 'AI attack routine: charges an attack, telegraphs the panel(s) in front of the object by highlighting
  them, and raises HitElement=0x10 when the timer expires.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets oAIAttackVars fields, no return value
details: 'On entry with AttackElement==0 it arms the attack: writes element 4 into oAIAttackVars_AttackElement,
  copies AttackBoost2 into StepTimer as the countdown, and zeroes ChargeCycles. While armed, ChargeCycles
  increments each call; its bit 3 (charge >> 3 carry) gates the telegraph so the panel highlight flashes
  every 8 frames. The telegraph calls object_getFrontDirection for the +1/-1 facing multiplier, computes
  target panel x = PanelX + direction, y = PanelY, passes r2=2 (likely region width/panel count) and the
  AllianceAndDirectionFlip halfword to object_highlightPanelRegion. Each call also decrements StepTimer;
  when it reaches zero it stores 0x10 into HitElement, which presumably triggers the actual hit elsewhere.
  r5 and r7 are caller-provided context pointers (battle object and its AI attack variable block).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; beq-path writes 4, copies AttackBoost2 to StepTimer,
    clears ChargeCycles: init-once behavior; lsr r0,r0,#3 / bcs skips highlight: telegraph flashes only
    every 8th charge tick; bl object_getFrontDirection then add r0,PanelX and object_highlightPanelRegion(r2=2,
    alliance halfword): highlights the facing panel region; ldrh r0,[StepTimer]; sub #1; strh; bgt / mov
    r0,#0x10; strh [HitElement]: countdown ends by setting HitElement=0x10; callees object_getFrontDirection
    and object_highlightPanelRegion summaries match a facing-panel attack telegraph'
