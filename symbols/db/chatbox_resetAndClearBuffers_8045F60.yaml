name: chatbox_resetAndClearBuffers_8045F60
address: '0x08045F60'
kind: function
status: confirmed
summary: Resets the chatbox state fields and wipes its text buffer and glyph/tile buffer (0xF00 bytes each) for
  a fresh textbox.
interface: void chatbox_8045F60(void) /* r5 = chatbox work area; clobbers r0, r1, flags; preserves r2, r3 */
details: 'Takes the chatbox work area in r5 and clears its runtime state: zeroes the word at

  oChatbox_Unk_70, the bytes at oChatbox_BoxGfxLoadState_0F (gfx load progress/phase) and

  oChatbox_Unk_0E, and the word at oChatbox_Unk_7C. Then calls ZeroFillByEightWords twice:

  once on the text buffer at unk_200BEA0 with length 0xF00, and once on the buffer at

  dword_200CDA0 (glyph/tile data) reusing r1 = 0xF00 from the first call — so the second

  call implicitly depends on r1 surviving the first ZeroFillByEightWords. Callers must

  treat r0, r1, flags c, v and nz as clobbered; r2/r3 are preserved. Intended to be called

  before opening/reusing a textbox so no stale text or glyphs remain.

  '
