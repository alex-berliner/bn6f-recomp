name: object_panelReleasePhase
address: '0x080D1106'
kind: function
status: probable
summary: 'Battle-object phase stub: on phase 0 it stores phase 4, sets animation 2, releases the object''s
  reserved panel via object_removePanelReserve, and sets Timer=12; thereafter it ticks Timer down and,
  on underflow, sets CurAction=0xC and clears CurPhaseAndPhaseInitialized.'
interface: (r5 = battle object pointer, no args) -> r0 = clobbered; updates oBattleObject_CurPhase, CurAnim,
  PanelX/Y args, Timer, CurAction, CurPhaseAndPhaseInitialized
details: On entry with CurPhase==0 it stores phase 4, sets CurAnim to 2, passes PanelX/PanelY to object_removePanelReserve
  to clear the panel reservation this object held, and loads Timer with 12. On subsequent calls it decrements
  Timer and returns while it is still >=0. Once the timer underflows it writes CurAction = 0xC (the object's
  next behavior) and zeroes CurPhaseAndPhaseInitialized so the phase machine restarts cleanly. It touches
  only the standard battle-object struct fields and the panel-reserve bookkeeping; no other state or globals
  are touched. The 12-frame delay with a vanish-type animation suggests the object hides or leaves its
  tile before action 0xC takes over.
