name: battle_freeRelatedObject1
address: '0x080C3900'
kind: function
status: probable
summary: Frees the battle object linked via the current object's RelatedObject1Ptr field
interface: (r5 = battle object whose RelatedObject1Ptr is used; r0 ignored) -> r0 = object_freeMemory
  return; no meaningful flags
details: Loads the pointer at [r5, oBattleObject_RelatedObject1Ptr], zeroes the target's oObjectHeader_Flags
  byte, and calls object_freeMemory to release the target's slot, bitmap, and list linkage. Operates on
  the related/companion object rather than the object in r5 itself, so it is a teardown helper for an
  attached or spawned companion object. No caller is known, so the trigger context (parent despawn, hit
  handler, etc.) is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
