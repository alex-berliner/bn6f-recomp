name: object_getPanelInFrontOffset
address: '0x080E02F4'
kind: function
status: probable
summary: Finds a valid panel just in front of the battle object (same row, else one row up or down) and
  returns its screen position plus the facing and the vertical offset used.
interface: (r5 = battle object) -> r0 = screen x, r1 = screen y, r2 = facing (+1/-1), r3 = row offset
  (-1/0/+1); flags clobbered by calls
details: Reads oBattleObject_PanelX/PanelY from the object in r5 and adds the front-direction multiplier
  to PanelX to get the panel directly ahead. sub_80E02AC(x,y) acts as a boolean panel test; if the front
  panel passes, the offset stays 0. Otherwise it tries (x, y-1) setting the offset to -1, then (x, y+1)
  setting it to +1. The chosen panel is converted to 16.16 screen pixel coordinates with object_getCoordinatesForPanels,
  and object_getFrontDirection is called a second time to fill r2. Callers would use this to place or
  move something (sprite, hitbox) on the square in front of an object with an automatic row shift.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl object_getFrontDirection / add r0,r0,PanelX: front panel is current panel shifted by facing;
    three calls to sub_80E02AC with tst/bne-beq: it is a pass/fail test on a panel coordinate, same row
    first then y-1 then y+1; neg/mov r4 pattern sets r3 return to -1/0/+1 depending on which row was accepted;
    bl object_getCoordinatesForPanels then push/pop {r0,r1}: returns screen coords of the chosen panel
    in r0/r1; second bl object_getFrontDirection right before return: facing re-fetched into r2 as part
    of the 4-value result'
