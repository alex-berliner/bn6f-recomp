name: textWindow_openDialog_802C5B0
address: '0x0802C5B0'
kind: function
status: confirmed
summary: Opens an in-game text/dialog window — records the caller's value in the toolkit state struct, blits the
  window's text graphics to VRAM, and queues the window's tilemap/draw update job.
interface: (r0 = value to record) -> r1, r2 (and r3) = results of the queued draw job; r4-r9 preserved; flags clobbered
details: "Saves r0 into offset 8 of the state struct reached through the toolkit's\noToolkit_Unk200a220_Ptr entry\
  \ (r10-relative), so later window code can read\nback the value the caller opened the window with. Then it renders\
  \ the\nwindow's text via renderTextGfx_8045F8C with:\n  script = TextScript8736D74, arg1 = 5, tiles = unk_2035320,\n\
  \  vram dst = 0x600BA80, w = 10, h = 1, palette = dword_86B7AE0, arg7 = 8,\nand finally calls sub_802C4B6(2, 12,\
  \ byte_802C6C4, 10, 2) to queue the\nwindow's tilemap/update job (whose r1/r2 become this function's return\n\
  values). The 0x70-byte stack frame is allocated and its address spilled\nacross the calls but never actually used\
  \ — a quirk of the original.\nA 0x70-byte unused stack frame is allocated; its address is stored to the\nstack\
  \ across the calls but never read.\n"
