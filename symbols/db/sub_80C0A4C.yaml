name: sub_80C0A4C
address: '0x080C0A4C'
kind: function
status: confirmed
summary: Dispatches a battle object's current phase handler via a small table at off_80C0A60.
interface: 'void sub_80C0A4C(void);

  // r5 = battle object pointer; r2, r3, r7, lr used as inputs by convention

  // returns nothing; handler''s r5/r8-r12 leak back as outputs

  // clobbers nz/cv, r0, r1, r2, r3, r4, r6, r7, lr

  '
details: "Reads oBattleObject_CurPhase (a byte offset on the battle object pointed\nto by r5) and uses it to index\
  \ a four-entry handler table at off_80C0A60\n(loaded indirectly via off_80C0A5C). The three dispatchable handlers\
  \ are:\n  phase 0 -> advancePhase3ToPhase4_80C0A6C\n  phase 1 -> sub_80C0A90\n  phase 2 -> sub_80C0B4A\nThe table\
  \ is invoked via `bx` with LR set up as a return into a `pop {pc}`,\nmeaning the dispatched handler is expected\
  \ to return straight to the caller\nof sub_80C0A4C rather than back here. The decompiler models this by\nshifting\
  \ SP down four bytes, writing LR there, and reading r0 as the phase\nargument and r1 as the resolved handler address\
  \ before the guest call.\n"
