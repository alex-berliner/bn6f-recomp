name: battleItems_countByType_813C584
address: '0x0813C584'
kind: function
status: confirmed
summary: Scans the battle-item grid, counting each item into a per-type tally array supplied by the caller.
interface: void sub_813C584(u8* count_array /* r0 */);
details: "Clears two 0x31-byte scratch buffers at byte_2006D68 and byte_2006DA0.\nIterates a 7x7 region\
  \ of an item-grid data structure (row stride 0xF,\nbase row 5, base column 5). For each cell whose type\
  \ byte equals 3,\ncalls sub_813B9B4(col, row); if it returns non-zero, the returned\nitem-id byte is\
  \ appended to byte_2006D68 (gathering pass).\nPerforms a counting-sort-like compaction into byte_2006DA0\
  \ keyed by\nitem id 1..0x30, again bounded by 0x31 slots.\nThen walks byte_2006DA0 until a zero sentinel,\
  \ and for each entry:\n  - decrements the id by 1 and calls toolkit_getUnk2004190EntryPtr_813B9FC\n\
  \    to get an entry pointer, reads a u16 from [0],\n  - passes that u16 to sub_813B780 and reads a\
  \ type byte at offset 4\n    of the returned object,\n  - increments count_array[type] (the caller's\
  \ r0 buffer).\nTouches byte_2006D68, byte_2006DA0, the indexed data table at\ngetIndexedDataTable_813B9E0,\
  \ and the caller-supplied count array.\n"
