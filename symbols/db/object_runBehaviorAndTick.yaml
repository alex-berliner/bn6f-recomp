open_questions:
- semantic of oObjectHeader_Flags bit 0x2 (visibility? targetable? state flag?)
- what sub_80C493C/sub_80C49E4/sub_80C4A52 (the three Param1 variants) do, to identify the object type
- what sub_80C4848 is and which in-game entity registers objects with this update handler
- The flow agrees (set bit 0x2, blind check clears it, Param1 dispatch, object_updateSpriteTimestop),
  but naming 'object_updateWithBlindCheck' implies the blind check is the routine's purpose rather than
  the config. A name like 'object_runBehaviorAndTick' better captures the dispatch+sprite-update shape.
  Also the proposal mentions r4 but r4 is not used here; it's r5.
