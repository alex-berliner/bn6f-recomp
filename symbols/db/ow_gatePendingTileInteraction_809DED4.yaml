name: ow_gatePendingTileInteraction_809DED4
address: '0x0809DED4'
kind: function
status: confirmed
summary: Overworld dispatcher that suppresses a pending tile-interaction request while the PET menu's
  data flag is set or a cutscene is running, otherwise hands it off to the tile-interaction handler.
interface: 'void ow_gatePendingTileInteraction_809DED4(void); // in: r5 = overworld player object pointer;
  out: r0 (handler return value); clobbers r0,r2,r5,r8,r9,r10,r11,r12,r1,r3,r4,r6,r7,lr,NZCV'
details: Called as the overworld's pending-interaction gate (the player-object pointer is passed in r5,
  the customary overworld object's-this register). Reads the pending-action byte oOWPlayerObject_Unk_07
  on the player object. If TestPETMenuDataFlag(1) returns non-zero (flag active) or IsCutsceneScriptNonNull()
  returns non-NULL (cutscene playing), the pending byte is zeroed and the function returns 0 with no dispatch.
  Otherwise the same byte is reused as a 1-entry index into off_809DEF8 (only slot is ow_tryTileInteraction_809DF00)
  and execution is transferred there via `mov lr,pc; bx`. Because the dispatch uses bx the table holds
  Thumb addresses with the low bit set (e.g. ow_tryTileInteraction_809DF00+1). Flag state on exit mirrors
  the callees (no canonicalisation).
