name: ai_attackStepWaitEnd
address: '0x0811288C'
kind: function
status: probable
summary: 'Per-tick handler for an AI attack step: waits while oAIAttackVars_StepTimer is nonzero, then
  clears the 0x40 ObjectFlags1 bit, sets CURRENTLY_MOVING, resets current animation, marks HasMoved, and
  exits the attack state.'
interface: (r7 = battle object AI attack vars, r5 = battle object) -> r0 = destroyed; flags from subtract
details: Each invocation decrements oAIAttackVars_StepTimer and returns immediately while it is nonzero
  (bne to pop). When the timer hits zero, it clears ObjectFlags1 bit 0x40 (likely a 'step in progress'
  bit), sets the OBJECT_FLAGS_CURRENTLY_MOVING_1 bit via object_setFlag1, zeroes the object's current
  animation (oBattleObject_CurAnim), sets oAIAttackVars_HasMoved = 1, and calls object_exitAttackState
  to leave the attack routine. It is a state-machine tick callback for an AI attack phase that pauses
  during a step/move before committing the move.
