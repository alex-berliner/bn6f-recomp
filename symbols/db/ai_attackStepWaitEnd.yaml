  detail: 'ldrh/sub/strh on oAIAttackVars_StepTimer with bne locret: waits N frames before acting; object_clearFlag(0x40)
    and object_setFlag1(1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) toggle movement flags on completion; strb
    r0,[r5,#oBattleObject_CurAnim] resets animation to 0 and strb 1 to oAIAttackVars_HasMoved marks the
    move done; tail call object_exitAttackState shows it is the terminal tick of an AI attack sub-state'
