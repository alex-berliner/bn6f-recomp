name: sub_80C0DD8
address: '0x080C0DD8'
kind: function
status: confirmed
summary: Spawns a type-0x2C battle object (an FX/projectile) at the given panel X/Y, linked back to the source object,
  copying its alliance/facing and marking a caller-supplied active flag byte.
interface: void sub_80C0DD8(u8 panelX r0, u8 panelY r1, *BattleObject sourceObj r5, u32 disabler r6? -- 0xF800000
  default, *u8 activeFlag r7); - clobbers nzcv r0,r1,r2,lr; preserves r3,r4,r5,r6,r7
details: "Spawns a new BattleObject of type 0x2C via object_spawnType1 (the freshly\nallocated pointer is returned\
  \ in r5 by that routine). On spawn failure\n(null result) the function just returns. On success it:\n  * writes\
  \ the panel X/Y into both oBattleObject_PanelX/PanelY and the\n    paired mirror fields oBattleObject_Unk_0c/Unk_0d\
  \ (kept in sync);\n  * inherits oBattleObject_AllianceAndDirectionFlip from the source object\n    (so the spawned\
  \ FX shares its parent's side and facing);\n  * stores r6 in oBattleObject_DamageAndStaminaDamageCounterDisabler\n\
  \    (default constant at 0x080C0E00 is 0xF800000, presumably a flag mask\n    that disables damage/stamina counters\
  \ for the FX);\n  * sets oBattleObject_RelatedObject1Ptr to the source object (parent link);\n  * stores r7 in\
  \ oBattleObject_ExtraVars+4 and writes a 1 byte at *r7,\n    treating r7 as a pointer to an owner's \"active/projectile-out\"\
  \ flag.\nThe unusual push {r0,r1,r3,r5}/pop {r1-r3,r5} pattern exists because\nobject_spawnType1 clobbers r3 and\
  \ r5, so the caller-saved panelX/Y and\nthe source pointer in r5 (plus the live r3) are spilled to the stack\n\
  and reloaded after the spawn. The verbatim 0xF800000 immediate stored\nin r6 by callers ties this FX type to a\
  \ specific subsystem (damage\ncounter disabler mask).\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
