name: ai_sweepMoveStep
address: '0x08108558'
kind: function
status: probable
summary: 'AI attack step: on a countdown expiring, snaps the attacker onto its target panel and arms its
  hit element for a sweeping melee attack.'
interface: (r5 = battle object ptr, r7 = oAIAttackVars block) -> void; no return value
details: 'Part of a state-machine-driven AI attack: decrements oAIAttackVars_StepTimer and does nothing
  until it reaches 0. Then it sets the object''s anim to 3, copies the planned target panel (oAIAttackVars_TargetPanelX/Y)
  into oBattleObject_PanelX/Y, recomputes pixel coordinates and collision/facing, reloads StepTimer with
  3 to delay the next step, and writes 8 into oAIAttackVars_HitElement so a later step applies that element
  to whatever it hits. The move-then-hit pattern with a step timer fits a sweep/lunge attack where the
  enemy advances onto (or past) the target.'
