name: ai_dispatchAttackStep_80F15CE
address: '0x080F15CE'
kind: function
status: confirmed
summary: 'Dispatches the AI''s current attack step: reads the attack-selector byte from the AI attack
  vars and jumps to one of seven per-attack step handlers.'
interface: void sub_80F15CE(void /* r5, r6 context, r7 = AI attack vars ptr */); /* returns r1, r5, r8-r12
  as left by the dispatched handler */
details: 'Reads the selector byte at [r7+oAIAttackVars_HitElement] from the AI attack vars struct (r7
  is the struct pointer, preserved across the call), indexes the dispatch table at off_80F15E0 with it,
  and tail-calls the chosen handler via "mov lr, pc; bx r1" (thumb handlers, so the table entries are
  +1). The seven handlers are ai_attackStepWood, ai_lungeForwardThreePanels, ai_stepMoveAttackToTargetPanel,
  ai_attackPhaseStep, sub_80F16E0, ai_beastSpikeTick and ai_attackBlinkStep, i.e. the per-frame/tick step
  routines for the different boss/enemy attack behaviours (wood attack, lunge, step-move attack, beast
  spike, blink attack, etc.). This routine itself computes nothing: r1 and r5, r8-r12 it returns are exactly
  whatever the dispatched handler left there, and the handler returns straight back to sub_80F15CE''s
  caller through the lr set by mov lr, pc. r0-r4, r6, r12 and the flags are clobbered per the handlers''
  contracts.

  '
