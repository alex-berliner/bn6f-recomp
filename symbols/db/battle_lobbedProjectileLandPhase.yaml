name: battle_lobbedProjectileLandPhase
address: '0x080B86F8'
kind: function
status: probable
summary: 'Phase handler for a flying battle object: moves it by its velocity each frame until its timer
  expires, then lands it — spawning an explosion hitbox on the target panel, or cracking that panel and
  its vertical neighbors with a screen shake and sounds.'
interface: (r5 = battle object, no register args) -> void; sets oBattleObject_CurPhase = 4 when the timer
  runs out
details: Each call adds oBattleObject_XVelocity to X and subtracts oBattleObject_ZVelocity from Z (forward
  travel in BN's grid), then decrements oBattleObject_Timer; while the timer is nonzero it just returns.
  When it hits 0, it reads the panel status of (PanelX, PanelY) via object_getPanelParameters. If status
  bit 0x10 is clear, it spawns a collision region (r7=3 typed args, plus r4 from oBattleObject_ExtraVars+4),
  copies 12 bytes from object+0x34 into a type-4 effect object spawn (effect id 0x15), clears oBattleObject_PanelXY,
  recomputes pixel coordinates, and moves to phase 4. If bit 0x10 is set, it instead calls sub_80B8844,
  triggers a camera shake (magnitude 2, duration 0x1e), cracks the landing panel and the panels at y-1
  and y+1, and plays sound effects 0xC0 and 0x10D. Bit 0x10 of panel status is likely 'already cracked/broken',
  making this a heavy projectile whose impact shatters cracked ground and spreads cracks to the adjacent
  column.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: X/Z += velocity and Timer-- loop with 'bne locret' shows per-frame projectile travel until landing
    (first 8 instructions); object_getPanelParameters + 'tst r0,#0x10; bne' branches between the normal
    landing and the cracking paths; Three object_crackPanel calls at (x,y), (x,y-1), (x,y+1) plus camera_initShakeEffect(2,0x1e)
    and PlaySoundEffect(0xC0/0x10D) mark an explosive, screen-shaking panel-breaking impact; object_spawnCollisionRegion
    (r7=3) and spawn_t1_0x0_EffectObject with r4=0x15 spawn the damage hitbox and impact effect on the
    landing panel; 'mov r0,#4; strb r0,[r5,#oBattleObject_CurPhase]' on both paths shows this is one phase
    of a multi-phase object handler
