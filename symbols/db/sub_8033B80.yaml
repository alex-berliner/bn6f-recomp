name: sub_8033B80
address: '0x08033B80'
kind: function
previous_names: []
status: hypothesis
summary: Queues one OAM row for a "Battle Start" cinematic sprite from a 24-frame table, then advances a frame counter
  held in r5+5.
interface: '(r0 = frameIndex, r5 = battleWorkPtr) -> r0 = nextFrameIndex ; side effect: queues an OAM entry via
  sprite_queueOamEntryThunk_802FE28 and updates the frame counter at battleWorkPtr+0x05'
details: "- `r2 = r0 * 0x18` computes a byte offset into `byte_8033BB8` (the 24-frame pose table at 0x8033BB8).\n\
  \  - The first 18 bytes of the table are all zero (0x00..0x11), then a 6-byte pattern 0x01,0x02,0x03,0x02,0x01,0x00\
  \ repeats 4 times (frames 0x12..0x23, i.e. 6 entries x 4). So this is a 24-frame, 0x18-byte cyclic pose table.\n\
  \  - Loads `curFrame = [r5 + 5]`, adds the table offset to get `tableIndex = (curFrame * 0x18) + r0_in`, reads\
  \ the `u8` pose id.\n  - Builds an OAM attribute 0: `0x80028003 + (pose << 16)`, and attribute 1: `0xC790` (the\
  \ standard OAM 0xC790 corresponds to GBA OAM attr1 bits: 16-color, shape/size, with y/x packed). The constant\
  \ `0xC790` is the typical Square 8x8 (size 0) attr1 with low X bits 0x90. So this is a small \"Ready\"/\"Go!\"\
  \ battle-start OAM element being uploaded.\n  - Calls `sprite_queueOamEntryThunk_802FE28(arg=0x80028003+pose<<16,\
  \ attr1=0xC790, 1, 0)`.\n  - Increments the frame counter at `[r5 + 5]`; wraps back to 0 when it reaches 0x18\
  \ (24).\n  - Caller's exit `r0` recorded as `curFrame + 1` (1, 2, 0xb, 0xc, 0xd, 0xe...) — matches the increment.\n\
  \  - The caller passes `r0 = 0` and `r1 = 4` (the latter is irrelevant to this function; r1 is not used). r5 is\
  \ the per-battle work pointer, and r5+0x05 is a u8 animation-phase counter shared by the four battle-state routines.\n\
  details_continuation: |\n  - The `_ADDRESS` suffix is kept because the surrounding struct/role of r5 is inferred\
  \ from the callers (battle-state init routines) and not from a labeled struct field here.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `byte_8033BB8` is a 24 (0x18) byte table of which the first 18 are 0 and the rest cycle 0x01,0x02,0x03,0x02,0x01,0x00
    four times — consistent with a 24-frame battle-start OAM pose table (visible at lines byte_8033BB8+). - `mul
    r2, r0; add r0, r2` (offset 0x8033B86..0x8033B8A) explicitly indexes the table by `r0 + r5[5]*0x18`; r0 is treated
    as an additional starting offset. - Constant `0x80028003` is the standard OAM attr0 starting value (rot/scale
    disabled, normal, obj mode 0) used for sprite uploads in this game; the `0xC790` constant for attr1 matches
    an 8x8 / 16x16 at x=0x90 sprite — the GBA "Ready!" / "Go!" lettering size. - Single call to `sprite_queueOamEntryThunk_802FE28`
    with a notUsed=1, queueCount=0 (positional args 3/4) means queue exactly one entry. - The compare `cmp r0, #0x18;
    blt ...; mov r0, #0` wraps the counter at 24, matching the table length. - All six captured-call exit r0 values
    (1, 2, 0xb, 0xc, 0xd, 0xe) are simply the previous frame + 1, all under 0x18, confirming the +1 counter update
    and the wrapped return.'
