name: sub_8033B80
address: '0x08033B80'
kind: function
status: hypothesis
summary: Tick a state's per-frame animation index and dispatch the matching guest routine via sub_802FE28.
interface: 'void sub_8033B80(u32 index, void *state /* r5 */);

  clobbers r0-r3, lr; flags NZCV; preserves r4-r7.

  '
details: 'Reads the state''s frame counter byte at r5+5, uses r0 (a 0..3-ish index, scaled by 0x18) to

  pick an offset from the per-state table at byte_8033BB8. Shifts that offset left 16 and adds

  the fixed base 0x80028003 to form a guest routine address, then calls sub_802FE28 with

  (routine_addr, 0xC790, 1, 0). Increments the r5+5 frame counter and wraps it at 0x18 (24),

  writing the result back. The 24-byte stride and wrap-24 strongly suggest this drives a 24-frame

  animation/state table.

  '
