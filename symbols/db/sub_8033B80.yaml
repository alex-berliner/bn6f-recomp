name: sub_8033B80
address: '0x08033B80'
kind: function
previous_names: []
status: hypothesis
summary: Queues an OAM entry for the battle-object whose index is given by r0, picking the tile/datasrc slot from
  a small 24-entry table indexed by the per-frame counter at r5+5; advances that counter and stores the next slot
  back into r5+5.
interface: '(r0 = battleObjectIndex, r1 = ?, r5 = per-frame/anim state struct) -> r0 = next frame index (0..0x17)
  ; side effects: advances the OAM queue, updates r5+5 counter.'
details: "- Loads byte at r5+5 (the current \"step\"/offset) and multiplies r0 by 0x18 (so r0 selects one of\n \
  \   two looks 0..? — the 24 table slices are indexed by (curStep + 24*objectIndex)).\n  - Reads byte from `byte_8033BB8`\
  \ at that offset (table is 0x18*2=0x30 bytes long; first 24 are 0,\n    next 24 cycle 1,0,1,2,3,2 around a triangle\
  \ — pattern A,B,A,C,D,C,A,…).\n  - Computes OAM attr0 = `0x80028003 + (tableValue << 16)` and attr1 = `0xC790`,\
  \ then calls\n    `sprite_queueOamEntryThunk_802FE28(r0=attr0packed, r1=0xC790, r2=1, r3=0)`, which queues a\n\
  \    single 2x2 affine/round OAM tile by reusing `r0` as a packed tile-index and adding the table\n    shift directly\
  \ into attr0.\n  - Increments the counter at r5+5; if it reaches 0x18 wraps it back to 0; writes back to r5+5.\n\
  \  - Return r0 = the next counter value. Captured calls all show exit r0 = (entryR0 -> entryR0+1)\n    sequence\
  \ `1,2,b,c,d,e,…`, consistent with the wrap-around counter stepping +1 each frame.\n  - r5 appears to be a per-frame\
  \ \"battle renderer state\" struct; r5+5 holds the current OAM frame\n    index. Functionally it does an OAM queue\
  \ push for one sprite entity whose tile slot cycles\n    through the 24-entry triangular table, advancing the\
  \ counter after each push. Matches OAM\n    attr0 pattern: 0x8002_8003 = GBA OAM attr0 base (rotation/scale enable,\
  \ y=3, rotscale=0).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mul r2, r0` with `mov r2, #0x18` => 24-byte stride per object index (asm line: `mov r2, #0x18; mul
    r2, r0`). - `ldrb r0, [r5,#5]; add r0, r0, r2` reads/writes the u8 at offset 0x5 of the struct in r5 (the per-frame
    counter / object slot). - `ldrb r1, [r1,r0]` against `off_8033BB4 -> byte_8033BB8` (0x30-byte table) selects
    one of {0,1,2,3}. - `lsl r1, r1, #0x10; add r0, r0, r1` shifts the table byte into OAM attr1 bits 16-19 (tile-id
    upper nibble). - `dword_8033BAC = 0x80028003` is a packed OAM attr0 (rotate/scale enable, y=3, rotscale index
    0). - `dword_8033BB0 = 0xC790` is the attr1 (size 3 -> 64x64 affine, x=-112 -> mostly off-screen anchor). -
    `bl sprite_queueOamEntryThunk_802FE28` matches the callee''s `(a1=attr0-packed, a2=attr1, a3=1, a4=0)` thunk
    signature. - Exit captured-call r0 values: caller enters with r0=0 and exits with `1,2,0xb,0xc,0xd,0xe,...`,
    consistent with `counter+1` wrap from the increment loop. - r5 is preserved by the function (`push {lr}` only)
    and `strb r0, [r5,#5]` only touches +5.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08033B80

    '
  result: the body read as described above
