open_questions:
- 'What r5+5 actually represents: it''s a per-battle u8 counter, but its struct field name (BattleState field vs
  BattleObject field vs some scene-state field) is not directly visible from this function; the callers'' contracts
  imply it is the battle-state animation-frame counter.'
- Whether r0 is meant to be a "phase offset" or simply the current frame index (callers pass 0 in the captured sample,
  so the role of r0 is unclear without additional caller code).
- The semantic of the OAM attribute `0xC790` (i.e., which 8x8 / 16x16 tile slot it targets) — knowing the current
  battle-start sprite assets would settle the exact graphic.
