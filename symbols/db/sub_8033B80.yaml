open_questions:
- r1's role on entry — only used as the OAM register pass-through to the thunk; the assembly
- loads a fresh `0xC790` into r1, so r1's caller-provided value is unused and likely just sentinel.
- The semantic meaning of the 0..0x17 cycle table (likely a battle-state "shimmer" / cursor
- animation that picks a tile variation per step).
- What kind of object r5+5 represents — without a confirmed r5 struct definition I only know
- that r5 is preserved and only +5 is touched.
