name: spawn_panelEffectForSide
address: '0x0810E774'
kind: function
status: probable
summary: Spawns a type-0 battle effect object at a given field panel, tagged with the source object's
  side (alliance XOR direction flip).
interface: (r0 = panel column, r1 = panel row, r5 = source battle object) -> r0 = spawned effect object
  pointer
details: The original r0/r1 (panel col/row) are pushed, then oBattleObject_Alliance XOR oBattleObject_DirectionFlip
  from r5 is shifted left 8 to form a side flag and saved. object_getCoordinatesForPanels converts col/row
  into 16.16 fixed-point screen x (r0) and y (r1); the function rearranges to r1=x, r2=y, sets r3=0, pops
  the side flag, ORs in 0x14 (likely an effect parameter/offset) and calls spawn_t1_0x0_EffectObject.
  The side flag in bit 8 presumably tells the effect object which way to render or which alliance it belongs
  to. Nearby tables (widths 0x64/0x96/0xC8/0xFA, decreasing heights) belong to the surrounding attack
  state data, not this routine itself.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: eor of [r5,#oBattleObject_Alliance] and [r5,#oBattleObject_DirectionFlip] shifted <<8, pushed
    and popped into r0 as the spawn flag; object_getCoordinatesForPanels called with the saved panel col/row,
    results moved to r1=x, r2=y; spawn_t1_0x0_EffectObject called with r4 = 0x14 | sideFlag, r3 = 0; push/pop
    of r0,r1 around the flag computation preserves the incoming panel coordinates; both callers sub_810E5B0
