name: battle_aiInitBeastPwrAttackVars
address: '0x08011CF8'
kind: function
status: probable
summary: 'Initializes an AI attack''s variables: Beast-Out-scaled damage, fixed extra damage, a difficulty
  tier read from NaviStats, and returns the attack ID 0x45.'
interface: (r7 = battle/AI object with oAIAttackVars fields) -> r0 = 0x45 (attack/anim ID); writes Damage,
  ExtraDamage, AiDifficultyTier, InitFlag
details: Computes damage as base 0x28 passed to battle_beastPwrAtk_addScaledBase_8012642, which returns
  baseDamage * beastOutMulti with the multiplier clamped to 5, and stores it into oAIAttackVars_Damage
  (r7). Stores a fixed 0x94 into oAIAttackVars_ExtraDamage. Calls GetBattleNaviStatsByte_AllianceFromBattleObject
  with byte offset 0x2C, sets oAIAttackVars_AiDifficultyTier to 0 if the byte equals 4, otherwise 1. Clears
  oAIAttackVars_InitFlag and returns 0x45, presumably the attack identifier the caller dispatched. The
  use of the beast-power scaling helper indicates this configures one specific Beast Out-era AI attack.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_beastPwrAtk_addScaledBase_8012642 with r0=0x28, result strh into oAIAttackVars_Damage
    (lines 3-5); mov r0,#0x94; strh [r7,oAIAttackVars_ExtraDamage] sets a constant secondary damage; bl
    GetBattleNaviStatsByte_AllianceFromBattleObject with r1=0x2C, then cmp r0,#4 chooses tier 0 vs 1 for
    oAIAttackVars_AiDifficultyTier; strb 0 into oAIAttackVars_InitFlag then pop with r0=0x45 as the return
    value
