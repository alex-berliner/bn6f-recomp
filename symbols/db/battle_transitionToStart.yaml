    standard fade-to-battle sequence; strb r0, [r5,#1] with 0x38/0x48/0x3C — the function only advances the phase
    byte of a state machine; bl sub_803BB2C with r0 = 0xF shows a network script on the non-trigger path, so this
    belongs to a net/NPC scenario object; both paths end with bl sub_803A104 — shared state-handler epilogue
