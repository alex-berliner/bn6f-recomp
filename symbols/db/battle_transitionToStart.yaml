name: battle_transitionToStart
address: '0x08039DB4'
kind: function
status: probable
summary: 'State phase handler that branches on sub_803A558: one branch shows a script via sub_803BB2C and sets phase
  0x38; the other waits (sub_803CB18 frames 8/0x10), then on success fades the screen, stops music, plays SOUND_BATTLE_START,
  and advances to phase 0x3C.'
interface: (r5 = pointer to object/state struct; r0/r1 scratch) -> r0 = result of sub_803A104; writes next phase
  id into byte at r5+1 (0x38, 0x48, or 0x3C)
details: 'This is one phase handler of a state-driven object (r5 is a context struct, byte at r5+1 holds the current
  phase). If sub_803A558 fails a check, it reads input via sub_814656C, shows network text script 0xF via sub_803BB2C,
  and sets phase 0x38. Otherwise it waits with sub_803CB18 (returns nonzero when the 8- or 0x10-frame wait expires),
  then performs the battle transition: sub_803CB0C(0x100) starts something timed, sub_8146CFC/sub_8147B24 stop animations,
  sub_802D070(0) resets a subsystem, SetScreenFade(0x2C, 0x10) fades out, musicGameState_8000784 switches music
  off, PlaySoundEffect(SOUND_BATTLE_START) plays the encounter jingle, and phase 0x3C is stored before the common
  sub_803A104 epilogue. The 0x48 phase is set when the first wait completes but the second check (sub_803C330/sub_803C2A0
  path with sub_803CB00(0x20)) fails.'
