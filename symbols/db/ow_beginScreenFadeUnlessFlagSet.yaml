name: ow_beginScreenFadeUnlessFlagSet
address: '0x0812A67C'
kind: function
status: probable
summary: If the 0x200BC50 flag bit is clear, starts a screen fade (mode 12, speed 16) and writes state
  0x10 to [r5+0xC]; otherwise does nothing.
interface: () -> void; uses caller's r5 as a state struct, branches on the flag test's Z flag
details: The routine first calls the helper that reads bit 5 of the byte at IWRAM 0x200BC50+5; if that
  flag is set it returns immediately without side effects. Otherwise it calls SetScreenFade(0xC, 0x10)
  — presumably fade kind 12 at speed/step 16 — and then stores the byte 0x10 into offset 0xC of the struct
  in r5, which looks like a scenario/task state field being advanced to the next step. r5 is inherited
  from the caller, so the struct layout and meaning of state 0x10 are unknown here. With no known callers
  it is not clear which game flow (overworld transition, cutscene, battle entry) triggers this path.
