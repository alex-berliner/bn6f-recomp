name: sub_812B3E4
address: '0x0812B3E4'
kind: function
status: confirmed
summary: Looks up a chatbox script index from an offset on the caller-provided struct (r5+0x13) and runs the corresponding
  chatbox line from eTextScript201BA20.
interface: 'void sub_812B3E4(void); // in: r4, r5, r10, lr; out: r2, r3, r4, r5, r6, r7, lr; clobbers r0, r1, N,
  Z; preserved r6, r7'
details: 'Loads a single-byte index from the caller-supplied struct at r5+0x13, uses it as an

  unsigned index into a 4-byte constant table at "0x541211" (dword_812B3F8), then

  passes the looked-up byte (in r0) to chatbox_runScript_803FD9C_on_eTextScript201BA20,

  which advances the chatbox state machine for the eTextScript201BA20 script.

  r4/r10/lr are accepted but only lr is meaningful (popped as pc at the end). The

  function does not modify any field of the r5 struct itself; it merely reads one

  index byte and delegates all script handling to the chatbox script runner.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
