name: battle_drawPanelAreaMarkers
address: '0x080BB59A'
kind: function
status: probable
summary: Converts a battle object's panel position to screen coords and queues three effect draws forming
  a 3-panel-wide (or 3-tall) marker strip around it.
interface: (r0, r1 = unused args saved to r4/r7; r5 = battle object) -> void; reads panel col/row from
  oBattleObject_ExtraVars+0x14/+0x18
details: 'Shared tail fragment: with r5 = battle object, loads ExtraVars+0x14/+0x18 as panel column/row
  and passes them to object_getCoordinatesForPanels, getting 16.16 fixed-point screen x/y. It then calls
  sub_80BB5DC three times with r3=0: once centered, then offset. If oBattleObject_PhaseInitialized is
  0 it offsets the y coordinate by −24 px then +24 px (−0x180000, then +0x300000); otherwise it offsets
  the x coordinate by −40 px then +40 px (−0x280000, then +0x500000). This produces three evenly spaced
  draws spanning roughly three panel widths or heights around the object''s panel, consistent with an
  area/width-3 attack visualization. The r0/r1 arguments are stored to r4/r7 and never read; the meaning
  of sub_80BB5DC''s r0 argument (left holding the x return on the first call, then the offset constants)
  is unclear.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldr r0,[r5,#ExtraVars+0x14]/[r5,#+0x18] then bl object_getCoordinatesForPanels: fields are
    panel col/row; three bl sub_80BB5DC calls with constants 0x180000/0x300000 or 0x280000/0x500000: symmetric
    ±spacing offsets in 16.16 fixed point; branch on ldrb [r5,#oBattleObject_PhaseInitialized] selects
    horizontal vs vertical offset axis; reached only from sub_80BB398 and sub_80BB4CE, implying a shared
    tail with r5 = battle object'
