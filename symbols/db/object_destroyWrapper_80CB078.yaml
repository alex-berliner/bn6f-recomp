status: confirmed
summary: Thin wrapper that destroys the object in R0 via the generic object destructor.
interface: void object_destroyWrapper(void *obj /* r0 */); clobbers r0-r3 and flags, preserves r5-r7
details: 'A two-instruction tail wrapper: it pushes LR, calls object_genericDestroy with the object pointer untouched
  in R0, and returns with pop {pc}. object_genericDestroy is the generic object destructor that unlinks/frees an
  object (entity) record, so this function is simply an object-destroy entry point — likely used as a callback or
  veneer where a dedicated "destroy this object" routine address is expected. It adds no logic of its own: all register
  outputs and NZCV flags are exactly those left by object_genericDestroy. No structure fields are touched here beyond
  whatever the generic destructor does with the object at R0.

  '
