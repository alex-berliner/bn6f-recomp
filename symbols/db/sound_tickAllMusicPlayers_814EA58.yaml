name: sound_tickAllMusicPlayers_814EA58
address: '0x0814EA58'
kind: function
status: confirmed
summary: Iterates the 32-entry music player table gMPlayTable and ticks every music player once (per-frame audio
  update).
interface: void sub_814EA58(void); // takes no meaningful arguments; calls sub_814F1E8(playerInfo) for each entry;
  returns with r0 = return address
details: 'Reads a literal-pool constant 0x20 (MPLAY_TABLE_COUNT) and, unless it is zero (which can never

  happen since it is a fixed nonzero constant), walks gMPlayTable for 32 entries of 12 bytes each.

  For each entry it loads the first word (the music player info pointer) into r0 and calls

  sub_814F1E8, the per-player M4A/music-player advance routine. Entry stride 0xC matches the

  standard M4A MPlayTable layout. Preserves r4-r5; the epilogue pops lr into r0 and does

  "bx r0", so on return r0 holds the return address rather than a value. Exit flags come from

  the final loop "cmp r4, #0".

  Quirk: the "count == 0" early-out on the literal constant is dead code.

  '
