open_questions:
- Exact AIAttackVars field meanings (`Unk_00`/`Unk_01`/`Unk_03`/`Unk_0c`/`Unk_0d`/`Unk_10`/`Unk_12`) — names in
  the struct are still `Unk_*`, so whether `Unk_03==2` is "cannon/cannon GS" vs a different buster variant can't
  be confirmed without more callers.
- Whether the `sub_80EB562` helper is part of the same AI attack state machine or performs additional setup (e.g.
  locking the caster, hiding navi cust).
- True identity of the second/third `battle_SpawnObjectOnFrontPanel` calls when `Unk_03 == 1` (likely the charge
  pellet + the cancel-cust anim marker, but unverified).
- Role of the captured entry `r1 = 0x080eb451` (Thumb BL+1 address) — likely just the caller's saved LR pushed for
  re-entry; not an input.
