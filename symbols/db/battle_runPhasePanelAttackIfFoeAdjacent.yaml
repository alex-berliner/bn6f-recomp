name: battle_runPhasePanelAttackIfFoeAdjacent
address: '0x080E75AC'
kind: function
status: probable
summary: 'Battle phase handler: on first run uses Alliance^DirectionFlip to index dword_80E75FC and tests
  battle_countAdjacentPanelsOfOtherAlliance; if foes exist, calls sub_80D67A6 with Element, Damage+Z16Save
  and Params, sets PhaseInitialized=4; otherwise (or after) ends the action by writing CurAction=0x0C
  and clearing CurPhaseAndPhaseInitialized.'
interface: (r5 = battle object) -> r0 = 0/flag; writes object fields PhaseInitialized, CurAction, CurPhaseAndPhaseInitialized
details: A per-phase handler for a battle object. On first run (PhaseInitialized==0) it computes an index
  from Alliance EOR DirectionFlip (mirroring by side) into the 4-byte table dword_80E75FC = {06,01,01,01},
  giving a pair of scan parameters; with those and the object's Alliance it calls battle_countAdjacentPanelsOfOtherAlliance
  to test for enemy panels in that direction. If any are found, it calls sub_80D67A6 with the table bytes,
  the object's Element, Damage+Z16Save as power, Params in r4 and object+0xC in r7 (extra hidden args),
  i.e. an attack/damage application, and stores 4 to PhaseInitialized. Afterwards (or immediately if no
  target), if DirectionAngle is nonzero it returns, otherwise it terminates the action by writing CurAction=0x0C
  and CurPhase=0. The Alliance^DirectionFlip index shows the scan direction is relative to the object's
  facing side.
