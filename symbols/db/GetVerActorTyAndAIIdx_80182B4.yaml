name: GetVerActorTyAndAIIdx_80182B4
address: '0x080182B4'
kind: function
status: confirmed
summary: Looks up the battle enemy's per-index {game version, actor type, AI index} record
interface: u16 enemy_idx (r0) -> const u8* record (r0); clobbers r1, NZC; preserves nothing
details: "Returns a pointer into the 3-byte-per-entry table at byte_80182C4, indexed by\n`enemy_idx * 3`. Each entry\
  \ is `{ version, ActorType, ai_index }`.\nThe table covers the catalogue of battle opponents by enum index:\n\
  \  * 0x00..0xFF: viruses (Mettaur family 0x00..0x7E, Gunner family 0x85..0x9C,\n    and a large tail of 0x01 placeholder\
  \ entries 0xBB..0xFF).\n  * 0x100..0x19F: Navi opponents (boss Navis) — entries 0x191..0x19F\n    decay to `{0x00,\
  \ ACTOR_TYPE_NAVI, 0x00}` and the lone anomaly at 0x112 is\n    encoded as `{0x05, 0x00, 0x03}`.\n  * 0x1A0..0x1C3:\
  \ player-side actors (MegaMan 0x1A0 and the roster 0x1A1..).\nACTOR_TYPE_VIRUS / ACTOR_TYPE_NAVI / ACTOR_TYPE_PLAYER\
  \ / ActorType are the\nactor class enum. The function is a pure table lookup (mul r1,r0,#3 +\nbase pointer add),\
  \ with no bounds check; callers are expected to pass a\nvalid enemy enum value.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
