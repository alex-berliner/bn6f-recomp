name: object_getPanelParameters
address: '0x0800C8F8'
kind: function
status: confirmed
summary: Returns the status flags word of the panel at the given coordinates, or 0 if the coordinates are off the
  field.
interface: u32 object_getPanelFlags(int x /*r0*/, int y /*r1*/); returns panel flags word, or 0 for invalid panels
details: Thin wrapper over object_getPanelDataOffset, which resolves panel (x, y) to a pointer into the panel data
  table (r0), setting c/v as side effects. If the pointer is null (invalid coordinates), returns 0 without a load;
  otherwise loads and returns the word at oPanelData_Flags of the panel data entry. The nz flags on return reflect
  the null check (set from the data pointer before the load), matching the original; c/v come from object_getPanelDataOffset.
  r1-r3 are scratch through the call.
