name: firstBattleTutorial_step_8029A56
address: '0x08029A56'
kind: function
status: confirmed
summary: Advances the first-battle tutorial chatbox driver one tick, running a tutorial text script when
  its state predicate succeeds.
interface: void firstBattleTutorial_step_8029A56(struct FirstBattleTutorialObj* obj /* r5 */);
details: "`obj` (r5) is a small struct with the driver state at +0xC, the current chatbox\nstate byte\
  \ at +0x1, a timer at +0x2, and a saved previous state byte at +0xD.\nThe state byte at +0xC dispatches:\n\
  \  - 0xFF or unhandled -> return (idle).\n  - 0 -> call sub_8029AAA (returns r0 = script idx, 0 = not\
  \ ready).\n  - 1 -> call sub_8029ADA.\n  - 3 -> call sub_8029B16.\nA zero return aborts. Otherwise the\
  \ matching entry in `TextScriptFirstBattleTutorials`\n(a pointer table indexed by state<<2) is loaded\
  \ into r0 and `chatbox_runScript(archive, idx)`\nis invoked. The function then snapshots the current\
  \ chatbox state into +0xD, writes\n0x34 to +0x1, and zeroes the u16 timer at +0x2. Inputs: r5 = obj,\
  \ r10 = scratch,\nlr = return; clobbers r0-r3 and flags; preserves r4, r5, r6, r7.\n"
