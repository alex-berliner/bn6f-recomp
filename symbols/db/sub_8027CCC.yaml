name: sub_8027CCC
address: '0x08027CCC'
kind: function
status: confirmed
summary: Stamps a width×height rectangle of running u16 tile indices into the 0x02035000 grid buffer at the given
  starting cell, optionally numbering down columns rather than across rows, and returns the next index after the
  block.
interface: 'in: r0 column, r1 row, r2 firstTile, r3 width, r4 height, r5 numberingOrder (1 = column-wise); out:
  r2 tile index following the rectangle; r6 and r7 also nominally preserved by push/pop; clobbers: n z c v; preserved:
  r0, r1, r3-r7'
details: 'Targets a 15-column (0x1E-byte row) grid of u16 tile indices at unk_2035000 (0x02035000).

  Inner loop strides through `width` cells, advancing the running tile index by `step`, which

  is `height` when r5 == 1 (column-wise numbering) and 1 otherwise (row-wise).

  After each grid row is filled, the next row''s start tile is computed: when stepping by 1,

  the next row simply continues from the last tile written; when stepping by `height`, each

  subsequent row starts one index later than the row above, and r2 is adjusted to leave

  behind the index immediately following the entire rectangle.

  r6 and r7 are pushed/popped but only as scratch for `step` and `rowStartTile`.

  Unknown: what subsystem (UI panel, menu, battle chip view, etc.) owns the unk_2035000 grid.

  '
