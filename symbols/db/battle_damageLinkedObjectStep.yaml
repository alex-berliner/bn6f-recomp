    — The asm matches the proposal: oBattleObject_Timer=0x3c, object_subtractHP called with RelatedObject1Ptr
    and oBattleObject_Damage, two sub_80E1D7A calls at y±0x100000, sub_80E2ACA with (r5+5,6), Param2=1
