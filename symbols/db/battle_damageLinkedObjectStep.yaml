name: battle_damageLinkedObjectStep
address: '0x080E376C'
kind: function
status: probable
summary: Phase step that subtracts this object's Damage from its linked object's HP every 60 frames and
  spawns hit effects slightly above and below the target's panel.
interface: (r5 = battle object) -> r0 = clobbered; updates oBattleObject_Timer, Param2, PhaseInitialized,
  CurAction of r5 and HP of RelatedObject1
details: On first run (oBattleObject_PhaseInitialized==0) it sets Timer to 60 frames, calls object_subtractHP
  with RelatedObject1Ptr and oBattleObject_Damage, converts the linked object's PanelX/PanelY to screen
  coordinates, and calls sub_80E1D7A twice with y+0x100000 (16.16 fixed 16px) and y-0x100000, spawning
  effects above and below the target. It then calls sub_80E2ACA with the panel coords and (r5+5, 6), sets
  Param2=1 and PhaseInitialized=4. Afterwards it idles until Param2 is cleared (presumably by a spawned
  effect finishing), then sets CurAction=0xC and CurPhaseAndPhaseInitialized=0 so the object's phase loop
  restarts. The 60-frame timer plus repeated HP subtraction suggests a recurring damage tick against the
  linked object.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_subtractHP with ldrh r0,[r5,#oBattleObject_Damage] and RelatedObject1Ptr shows it
    deals the object's Damage to a linked object; bl object_getCoordinatesForPanels on the linked object's
    PanelX/PanelY, then two sub_80E1D7A calls at y±16px spawn paired effects at the target panel; mov
    r0,#0x3c; strh r0,[r5,#oBattleObject_Timer] sets a 60-frame delay before the next phase tick; tail
    sets CurAction=0xC and CurPhaseAndPhaseInitialized=0, looping the phase behavior; PhaseInitialized
    set to 4 and gated on Param2 matches the standard battle-object phase-machine pattern
  refs:
  - bn6f/asm/asm31.s:94659
  - 0x0800E276 object_getCoordinatesForPanels
  - 0x0800E2D8 object_subtractHP
  - 0x080E1D7A sub_80E1D7A
  reproduce: python3 tools/asmcat.py 0x080E376C
