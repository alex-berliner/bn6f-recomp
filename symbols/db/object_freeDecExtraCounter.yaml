  date: '2026-10-19'
  detail: 'ldr r1,[r5,#oBattleObject_ExtraVars+8]; ldr r0,[r1]; sub r0,#1; strb r0,[r1] — decrements a
    byte in the struct referenced by extra vars; no branch on the decremented value before bl object_freeMemory
    — counter is bookkeeping, not a lifetime check; callees list: object_freeMemory (0x08003458) frees
    the battle object slot, confirming this is an object teardown path'
