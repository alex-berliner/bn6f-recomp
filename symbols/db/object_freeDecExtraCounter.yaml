name: object_freeDecExtraCounter
address: '0x080D3048'
kind: function
status: probable
summary: 'Object teardown helper: decrements a byte counter in a struct referenced by the object''s extra-vars,
  then frees the object''s slot.'
interface: (r5 = battle object) -> r0 = decremented counter value; object freed via object_freeMemory
details: Reads the pointer at oBattleObject_ExtraVars+8 of the object in r5, loads a byte from that pointed-to
  struct, decrements it, and stores it back, then tail-calls object_freeMemory to release the object's
  slot (flags, bitmap slot, object-list unlink). The decremented byte is never tested, so this is not
  a lifetime timer with a zero-check; it most likely maintains a live-instance/reference count held by
  some owner (e.g. a spawner or shared extra data) while the object itself is unconditionally destroyed.
  No caller is known, so whether it is an on-delete handler or a normal exit path is unconfirmed.
