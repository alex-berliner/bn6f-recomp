- What battle object id 0x91 is and what header flag 0x10 means
- What the caller sub_80C314E passes in r5/r6 (which source object and which damage value) and in what
  gameplay context this runs
- 'The summary''s claim that r6 is ''the damage value'' is correct (it''s written to oBattleObject_DamageAndStaminaDamageCounterDisabler),
  but the push/pop quirk is slightly off: it pushes r0-r2 and r5, then after the spawn does `mov r0, r5`
  so the popped values (r1-r3) align with the saved panel X/Y/element. The name ''battle_spawnObjectWithProps''
  is acceptable but a more specific name reflecting the fixed object id 0x91 would be clearer, e.g. battle_spawnObjectId91.'
