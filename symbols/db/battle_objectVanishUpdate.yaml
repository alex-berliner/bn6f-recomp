name: battle_objectVanishUpdate
address: '0x080BB7CC'
kind: function
status: probable
summary: Battle-object state handler that plays animation 4 for 3 frames, then disables the object's hitbox
  and marks it for destruction.
interface: (r0 = unused, r5 = battle object pointer, called as state-action handler) -> r0 = clobbered;
  sets oBattleObject_CurPhase/Anim/Timer, later oCollisionData_Enabled and state to CUR_STATE_DESTROY
details: On first invocation (CurPhase == 0) it switches the object to phase 4, sets oBattleObject_CurAnim
  to 4, and loads the shared TimerAndTimer2 field with 3. On subsequent invocations it decrements oBattleObject_Timer;
  while the timer is still >= 0 it just returns. When the timer expires it stores 0 into oCollisionData_Enabled
  via the object's CollisionDataPtr (turning the hitbox off) and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the engine destroys the object. This is the classic 'brief vanish/blink then delete' pattern used
  for objects that disappear on their own.
