name: NPCCommand_clear_unk_flags_60_flag_0x200
address: '0x0809F30C'
kind: function
status: confirmed
summary: NPC script VM command that sets bit 0x200 in the overworld NPC's UnkFlags_60 and advances the script command
  counter.
interface: (r5 = overworld NPC object pointer, r6 = script command counter) -> r6 = counter + 1; clobbers r0, r1
  and NZCV flags; returns to caller in lr via pop {pc}
details: 'One of the overworld NPC script VM commands (NPCCommand_ handlers, reached via the NPC command dispatch
  with r5 = the oOverworldNPCObject and r6 = the command/program counter). Loads the NPC''s UnkFlags_60 field at
  offset oOverworldNPCObject_UnkFlags_60, ORs in the constant OW_NPC_UNK_FLAGS_60_0x200, stores it back, then increments
  r6 by one so the interpreter moves to the next script command. Note the existing name says "clear" but the code
  actually sets the flag (orr, not bic); the flag''s in-game meaning within UnkFlags_60 is not yet identified.

  '
