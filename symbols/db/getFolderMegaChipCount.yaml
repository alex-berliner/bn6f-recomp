name: getFolderMegaChipCount
address: '0x081351C0'
kind: function
status: probable
summary: Counts how many chips in the folder have the Mega-class (bit 5) flag set in their chip data record,
  for folder-limit validation.
interface: (r5 = pointer to folder header whose halfword at +0x1E is the chip count; folder entries at
  word_202A020, 0x20 bytes each) -> r0 = number of entries whose chip ID (halfword at entry+0x1C >> 1)
  has bit 5 set in ChipData byte 9; flags clobbered
details: Reads the entry count from [r5,#0x1E], then loops over that many 0x20-byte folder entries based
  at word_202A020, fetching the halfword at entry+0x1C. The value is shifted right by one (bit 0 appears
  to be a separate flag, bits 1-15 the chip ID) and looked up with getChip8021DA8 to get the 44-byte static
  chip record. It then tests bit 5 (0x20) of byte 9 of that record and increments a counter if set, returning
  the count in r0. Bit 5 of the class/flags byte in BN6 chip data corresponds to Mega-class chips, so
  this is almost certainly the folder Mega-chip limit check. r5 is both the input (folder header pointer)
  and reused as the counter, an unusual calling convention.
