- method: assembly-reading
  date: '2026-10-19'
  detail: mul r7,r3,#0x20; add r2,#0x1C; ldr r0,[r4,r2] — strides 0x20-byte entries in word_202A020, chip
    id halfword at +0x1C; lsl r0,#0x10; lsr r0,#0x17 — extracts (halfword >> 1), i.e. chip ID with bit
    0 as a flag; bl getChip8021DA8; ldrb r0,[r0,#9]; tst r0,#0x20; beq — tests bit 5 of the chip record's
    class/flags byte; ldrh r6,[r5,#0x1e] before the loop; cmp r3,r6 — loop count comes from the folder
    header's +0x1E field; single caller sub_8135080 — consistent with a folder-validation helper
