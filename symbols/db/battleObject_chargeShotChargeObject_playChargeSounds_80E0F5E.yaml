name: battleObject_chargeShotChargeObject_playChargeSounds_80E0F5E
address: '0x080E0F5E'
kind: function
status: confirmed
summary: Plays the buster charge-up sound for a BattleObject that is currently charging its shot, gated by which
  button is held and which side the object is on.
interface: void battleObject_chargeShotChargeObject_playChargeSounds_80E0F5E(BattleObject* r5 /*, r10 */)
details: 'r5 is the charging BattleObject. The function follows r5->RelatedObject1Ptr to the

  controlling entity and reads its AIData''s PwrAtkButton byte to see which attack button

  is held. If the button is 2, the sound plays unconditionally; for any other value it

  calls battle_networkInvert on the related object''s Alliance byte and bails out silently

  when the result is nonzero (i.e. only the owning/player side gets charge sounds).

  It then inspects the object''s charge state in ExtraVars: field +0x14 is the charge phase

  and +0x18 is a tick counter within that phase. Phase 1 with counter 0 plays

  SOUND_BUSTER_CHARGE (the start-of-charge loop cue); phase 2 with counter 1 plays

  SOUND_UNK_72 (presumably the fully-charged cue). All other phase/counter combinations

  play nothing. Note r2 passed to PlaySoundEffect is a leftover: the AIData pointer, or

  whatever battle_networkInvert left in r2 when the alliance check ran. r4, r5 and r10 are

  preserved; flags are clobbered.

  '
