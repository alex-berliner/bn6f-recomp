name: battleObject_chargeShotChargeObject_playChargeSounds_80E0F5E
address: '0x080E0F5E'
kind: function
previous_names:
- sub_80E0F5E
status: probable
summary: Plays the buster-charge SFX at the right charge stage for a charge-shot object, or stays silent
  if the controller does not own the charge input.
interface: '(r5 = ChargeShotBattleObjectPtr) -> (no return used by caller); side effects: may call PlaySoundEffect
  for SOUND_BUSTER_CHARGE or SOUND_UNK_72'
details: "Reads r5's RelatedObject1Ptr (oBattleObject_RelatedObject1Ptr, 0x4c) and that object's AIDataPtr\
  \ (0x58), then looks at AIData.PwrAtkButton (0x1e). If PwrAtkButton is 1 (A button) or 2 (B button),\
  \ it fetches RelatedObject1's Alliance (0x16) and XORs it via battle_networkInvert. If the resulting\
  \ \"network-inverted\" value is non-zero (i.e. the local controller does not own this charge), the routine\
  \ returns without playing a sound.\n  Otherwise (or when PwrAtkButton is not 1/2) it consults the charge\
  \ object's own ExtraVars (0x60+): word at ExtraVars+0x14 acts as a charge stage. If stage==1 and ExtraVars+0x18==0,\
  \ it plays SOUND_BUSTER_CHARGE. If stage==2 and ExtraVars+0x18==1, it plays SOUND_UNK_72. Any other\
  \ combination just returns. Because it uses `pop {pc}` and never writes r0 into anything the caller\
  \ reads, it behaves void-like.\n"
