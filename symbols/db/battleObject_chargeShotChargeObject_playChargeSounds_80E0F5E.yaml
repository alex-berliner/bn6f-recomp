- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` / `pop {pc}` at 0x80e0f5e and 0x80e0f9e show a leaf void-like helper. - `ldrb
    r0, [r2, #oAIData_PwrAtkButton]` reads offset 0x1e from AIData (per AIData struct). - `cmp r0, #1
    / #2` and the `beq loc_80E0F6E` chain gate the controller-ownership check to A/B. - `ldrb r0, [r1,
    #oBattleObject_Alliance]` reads offset 0x16 of RelatedObject1, passed to battle_networkInvert; `tst
    r0, r0; bne locret_80E0F9E` makes the non-local case silent. - `ldr r0, [r5, #oBattleObject_ExtraVars+0x14]`
    and `ExtraVars+0x18` index into the charge object''s ExtraVars (0x60). - `cmp r0, #1 / #2` plus the
    second-level `cmp r0, #0` / `#1` against ExtraVars+0x18 match the two SFX branches: SOUND_BUSTER_CHARGE
    and SOUND_UNK_72. - Only caller listed is chargeShotChargeObject_update_80E0E20, which is invoked
    from the charge-shot object update path.'
