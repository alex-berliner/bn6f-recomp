name: battle_setCollisionRegionOne
address: '0x080D94B8'
kind: function
status: probable
summary: Thin wrapper that sets a battle object's collision region index to 1.
interface: (r0 = ignored, overwritten with 1; r1 = battle object) -> r0 = pointer to the object's collision
  data; flags preserved from callee
details: The function discards its first argument, loads the constant 1, and tail-calls object_setCollisionRegion,
  which stores that region index byte into the battle object's collision data (passed in r1) and returns
  the collision data pointer in r0. It is only a constant-argument wrapper around the known setter, so
  its whole behavior is defined by the callee. The value 1 presumably selects a specific collision region
  layout, but which one (e.g. a wide/expanded hitbox) is not visible here.
