name: object_setStatePhase4_8027738
address: '0x08027738'
kind: function
status: confirmed
summary: Initializes a state-machine object (r5) to phase 4 with both flag bytes set to 1 and a zeroed counter at
  +0x40.
interface: void sub_8027738(struct Obj *r5)
details: 'Pure state-setter on the object pointer in r5: clears the u32 field at +0x40 (likely a timer,

  counter, or accumulated value), writes 1 to the u8 fields at +0x17 and +0xF (likely per-object

  active/flag bytes such as "enabled"/"visible" or two separate trigger flags), and stores 4 into

  the u16 field at +2 (almost certainly the object''s phase/state ID, so this branch selects the

  "phase 4" transition of the surrounding state machine). Touches nothing else and returns

  immediately; the leftover r0=4 matches the last strh value but callers ignore it.

  '
