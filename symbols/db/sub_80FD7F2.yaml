summary: Ticks one AI attack (init on first call, fires handler every 8 frames until timer expires)
interface: void sub_80FD7F2(void);  /* r5 = oBattleObject*, r7 = oAIAttackVars*; outputs only r1; clobbers r0 r2
  r3 lr, flags */
details: "Operates on a battle object (r5) and its companion AI attack-vars struct (r7).\nFields touched:\n  [r7\
  \ + oAIAttackVars_Unk_01]  state byte: 0 on entry -> set to 4 (\"attack active\")\n  [r5 + oBattleObject_CurAnim]\
  \  cleared to 0 when attack starts\n  [r7 + oAIAttackVars_Unk_10]  attack timer; initialised to 10, decremented\
  \ each call\n  [r7 + oAIAttackVars_Unk_0c]  attack parameter byte passed to the handler\n  [r7 + oAIAttackVars_Unk_00]\
  \  follow-up delay; set to 0x10 when the timer underflows\nQuirks:\n  - The handler sub_80FDCA4 is invoked only\
  \ on ticks where (timer & 4) == 0, i.e. every 8th frame\n    while the timer counts down (mask uses the carry\
  \ flag from `lsr r0,#3`, bcs skips the call).\n  - Timer is a u16 decremented until it hits 0; the `bgt` branch\
  \ leaves Unk_00 untouched, only the\n  -- wrap sets it to 0x10 (a \"next phase\" / post-attack delay for the AI\
  \ state machine).\n  - Reads via `ldrb/ldrh` of Unk_01 (checked for 0) make this the standard \"init-then-tick\"\
  \ idiom\n    seen across the AI attack table.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
