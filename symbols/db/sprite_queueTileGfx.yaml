name: sprite_queueTileGfx
address: '0x08029EAC'
kind: function
status: probable
summary: Queues a 32-byte GFX transfer copying one tile (index r0) from a ROM sprite-sheet table into
  the fixed buffer unk_3001AA0.
interface: (r0 = tile/frame index) -> r0 = preserved?; queues transfer via QueueEightWordAlignedGFXTransfer
details: Computes src = dword_86E944C + r0*0x20, i.e. entry r0 of a table of 32-byte blocks at 0x86E944C
  in ROM, then calls QueueEightWordAlignedGFXTransfer with dest unk_3001AA0 (a fixed RAM staging buffer)
  and size 0x20. 32 bytes is exactly one 8x8 4bpp tile, so this loads a single tile of a sprite sheet
  for later upload to VRAM. The destination is always the same buffer, so successive calls overwrite the
  previous tile. No return value is produced beyond the callee's.
