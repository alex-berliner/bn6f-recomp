name: object_setState8
address: '0x080E5D3E'
kind: function
status: probable
summary: Tiny helper that sets a battle object's state field to 8 (state 8, phase 0, not initialized).
interface: (r0 = battle object pointer) -> r0 preserved?; no flags guaranteed
details: It stores the constant 8 into the object's packed CurStateActionPhaseAndPhaseInitialized field
  at [r0+offset], then returns. Since the field packs current state, action phase, and phase-initialized
  flag, writing 8 selects state 8 with action phase 0 and the initialized flag cleared. It is a shared
  state-setter used by the AI attack handler ai_attackSpawnFrontPillarRegion (likely to move the enemy
  into the next state after spawning its pillar collision region) and by an unrelated caller sub_80BE1DC.
  The meaning of state 8 is not established from this function alone.
