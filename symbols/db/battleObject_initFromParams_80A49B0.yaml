open_questions:
- Whether `r5` points to `OverworldNPCObject` (size 0xd8) or `OWPlayerObject` (size 0xc8) — both put `CurState`
  at +8; we cannot tell from the assembly alone.
- Exact identity/format of the r7 parameter table (its length and meaning beyond byte 8 are unknown —
  the function only consumes bytes 0..3 and 4,8).
- Whether `r7` is a stack-resident local from the caller or an EWRAM pointer — captured-call evidence
  shows `r3=0x00000040` in some cases (likely 64-byte aligned EWRAM/IRAM) and `r3=0x02001f68` in others,
  suggesting two callers pass different things in r3 that may or may not equal r7.
- Why `r4/r8/r9/r10/r12` are reported as `out` even though this function doesn't touch them in the visible
  instructions; most likely the contract is a fall-through artifact of how the caller-jumped code was
  unwound (lr was popped as pc).
