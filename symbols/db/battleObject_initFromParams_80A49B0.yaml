summary: 'Initialise an OverworldNPCObject-style object (r5) from a per-object parameter table (r7): load
  its sprite, set animation/no-shadow, then conditionally apply Z-coord/layer priority and a sprite priority/palette,
  before stamping CurState=4 and calling the post-event hook event_80A4A08.'
interface: '(r5 = object base, r7 = params table) -> void ; side effects: mutates r5''s header/sprite
  and writes object field 0x8 = 4, 0x6 = 0, 0x7 = 0'
details: "- `push {lr}` only (no callee-saved frame): the contract reports r4/r5/r8/r9/r10/r12/r2/r3 in\
  \ `out`, which means those are read off the saved-r4 context — this is consistent with the function\
  \ being entered after a frame was already set up by a caller; only lr is saved here.\n  - Loads a sprite\
  \ with r0=0x80, r1=[r7+0] (sprite id nibble?), r2=[r7+1] (`sprite_load` contract: `in=['r0','r1','r2','r5','lr']`).\n\
  \  - `ldrb r0, [r7,#2]` → `sprite_setAnimation` writes the object's current animation index.\n  - `sprite_loadAnimationData`\
  \ and `sprite_noShadow` follow unconditionally (so the params table provides only base sprite + animation\
  \ + a flag to disable shadow only when r7[3]!=0xFF... actually noShadow is called before the `cmp r0,#0xff`\
  \ test).\n  - The conditional (`cmp r7[3],#0xff ; bne loc_80A49E8`) decides whether to run `checkZCoordModifiers_8031612`\
  \ and `applyLayerEffectToOWObject_8035694` (both typical OW-object setup helpers) on `r5+0xc` (the Coords\
  \ block per `overworld_npc_object_struct`, where X=0x24..Z=0x2c; here `r5+0xc` is consistent with a\
  \ smaller object header — `overworld_player_object_struct` puts Z at 0x24 and `r5+0xc` lands inside\
  \ the Coords region). It saves and restores `[r5+0x14]` around the calls (a save-stack slot typical\
  \ of layered rendering).\n  - `sprite_setPriority_8002E14` is unconditional, then `[r7+4]` → `sprite_setUnk0x2c`\
  \ (a per-object sprite config word), and `[r7+8]` → `sprite_setPalette` (palette index).\n  - Final\
  \ writes stamp `*(r5+8) = 4`, `*(r5+6) = 0`, `*(r5+7) = 0` and tail-call `event_80A4A08` before `pop\
  \ {pc}`. The `=4` written at +8 matches `enum8 CurState` (`CUR_STATE_UPDATE=0x04`) for either `overworld_npc_object_struct`\
  \ or `overworld_player_object_struct`.\n  - Callee `event_80A4A08` shares the same `(r5,r10,lr)` input\
  \ contract, suggesting it is the per-event continuation invoked right after this init.\n  - The `pop\
  \ {pc}` (no `bx`/link) and absence of stack-frame setup indicate this is a tail-called leaf in a wider\
  \ per-event dispatcher; r4/r8/r9/r10/r12 are spill registers the caller already preserved.\n"
