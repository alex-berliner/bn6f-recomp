  detail: 'ldrb [r5,#0x78]/[r5,#0x79] + ldr r2,[r2,r0]; ldr r2,[r2,r1]: 2D table lookup of the offset
    list; loop cmp r3,#4 / blt: exactly 4 (dx,dy) byte pairs processed per call; r1 += [r2+r4]; r0 +=
    [r2+r4+1] with nibble split of [r7+oAIAttackVars_AttackBoost2]: boosts shift the area; eor r3 (Alliance,DirectionFlip)
    passed with the pair to highlightPanelIfSomeCondition_8109660, whose summary matches panel highlighting
    on the battle grid; called only from sub_810DE3C during battlesweep, alongside object_getFrontDirection,
    consistent with AI attack area display'
