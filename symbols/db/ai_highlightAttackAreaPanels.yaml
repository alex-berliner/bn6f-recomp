name: ai_highlightAttackAreaPanels
address: '0x0810DED2'
kind: function
status: probable
summary: AI helper that highlights up to 4 battle panels per attack by reading a (dx,dy) pattern from
  a 2D table at off_810DF98 (indexed by object bytes +0x78/+0x79), adding nibbles of AttackBoost2 to dx/dy,
  and mirroring offsets by side via object_getFrontDirection before calling highlightPanelIfSomeCondition_8109660.
interface: (r5 = battle object, r7 = AI vars struct) -> r0 = highlight result of last panel; flags from
  loop compare
details: Reads two index bytes from the battle object at +0x78 and +0x79 and uses them to pick a list
  of (dx,dy) byte pairs from the nested table at off_810DF98. For each of the 4 entries it adds the top
  nibble of [r7+oAIAttackVars_AttackBoost2] to dx and the low 3 bits to dy, so boosts shift the highlighted
  area. It queries object_getFrontDirection for the object's side, then calls highlightPanelIfSomeCondition_8109660
  with the adjusted y in r0, x in r1, and r3 = Alliance xor DirectionFlip, so the offsets are mirrored
  by facing side; the highlight helper clamps to the 6x3 grid. The dx,dy pair is kept on the stack across
  the direction call and restored for the highlight call. Runs during battlesweep routes, i.e. inside
  AI attack setup.
