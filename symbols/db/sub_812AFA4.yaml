  by this function itself despite the caller contract listing them as inputs. The contract''s outputs (r1-r7, c,
  v) are just whatever decompAndCopyData leaves behind, since this routine returns straight into the caller with
  pop {pc}. The "initRefs" annotation suggests this is one of a family of small per-resource loader stubs, each
  hardwired to a single compressed blob (here the one at byte_812B1C0), likely for sprite or interface graphics/data
  initialization. Two padding bytes (0,0) follow the function.

