summary: Trivial wrapper that decompresses the blob at byte_812B1C0 and copies it into place via decompAndCopyData.
interface: void sub_812AFA4(void); // tail-calls decompAndCopyData(u32 *src), so effectively returns whatever that
  returns
details: 'Pushes lr, loads the address of byte_812B1C0 from the literal pool at off_812B1BC into r0, and tail-calls
  decompAndCopyData, which decompresses the referenced data and copies it to its destination. The caller is expected
  to have already set up everything decompAndCopyData needs beyond r0 (destination, etc.); none of r2-r7 are read
  by this function itself despite the caller contract listing them as inputs. The contract''s outputs (r1-r7, c,
  v) are just whatever decompAndCopyData leaves behind, since this routine returns straight into the caller with
  pop {pc}. The "initRefs" annotation suggests this is one of a family of small per-resource loader stubs, each
  hardwired to a single compressed blob (here the one at byte_812B1C0), likely for sprite or interface graphics/data
  initialization. Two padding bytes (0,0) follow the function.

  '
