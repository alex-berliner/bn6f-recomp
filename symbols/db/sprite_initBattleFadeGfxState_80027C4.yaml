details: "Loads the address of `byte_20098A8` (an EWRAM state struct used by the sprite/battle\n  fade\
  \ pipeline) into r1, then:\n    - clears `byte_20098A9` (`strb r0,[r1,#0x1]` with r0=0),\n    - writes\
  \ 0x0C into `byte_20098A8` (a state/mode byte),\n    - writes 0x32F into the halfword at `[r1+0x2]`\
  \ (i.e. `word_20098AA`).\n  Returns r0 = 0x32F (which the contract confirms: all captured-call exits\
  \ show\n  r0 = 0x32F). It then `mov pc, lr`, so it is a void-like init helper used for\n  its side effects\
  \ on the global EWRAM state; the 0x32F return value is not\n  relied on by callers.\n  Called from a\
  \ wide range of \"enter scene / reset\" routines (EnterMap,\n  battle_initFullSetup_8005DBE, copyTileData_803FC64,\
  \ logoScreen_init_803D1FC,\n  main_jumptable steps, scenario restart), so this is a standard\n  \"reinitialise\
  \ fade-related graphics state before a screen transition\".\n"
