open_questions:
- What the entries in unk_201C400 actually encode (the +1 byte being the "has sub-chip" flag is inferred from the
  cant-jack-in branch; the +0 byte's role is unknown).
- Which option_count value signals "no sub-chips available" (the A-press branch is skipped when +0xC == 0; whether
  0 means truly empty vs. hidden is not clear).
- Exact meaning of r0=8 passed to submenu_ConfirmExitAndFade_811FB64 (likely an exit sub-state / fade id but not
  verified).
- What sub_81245D4 does in detail (jacks the player in? equips the sub-chip? consumes it?).
- Why option_count == 1 disables cursor movement (single entry, or guard for a different layout where the cursor
  index is repurposed?).
