name: submenu_subchip_81240D0
address: '0x081240D0'
kind: function
status: confirmed
summary: Sub-chip submenu input handler; processes Start/B to confirm-exit-and-fade, A to jack in (after checking
  the slot's sub-chip table entry), and Up/Down to move the cursor among more than one sub-chip option, then redraws.
interface: void submenu_subchip_handleInput(u32 r2, u32 r4, struct SubChipSubmenu* state_r5, u32 r6, u32 r7, struct
  Toolkit* toolkit_r10) -> r5 r8 r9 r10 r11 r12; clobbers r0 r1 r2 r3 r4 r6 r7 lr, n z c v
details: "Runs once per frame for the sub-chip submenu (state struct in r5 with fields\n+0x0C = u8 option_count,\
  \ +0x14 = u16 cursor_index; toolkit in r10).\n- If Start or B is held, calls submenu_ConfirmExitAndFade_811FB64\
  \ with r0=8 (likely exit\n  state id) and the current state, then runs the redraw helper sub_81244EC and returns.\n\
  - Else if option_count != 0 and A is held, looks up unk_201C400[cursor*2 + 1] (a packed\n  table of sub-chip slot\
  \ entries; the +1 byte being non-zero marks the slot as filled).\n  Empty slot plays SOUND_CANT_JACK_IN; filled\
  \ slot calls sub_81245D4 (the actual\n  jack-in / equip-sub-chip action) and plays SOUND_MENU_SELECT. Either path\
  \ redraws via\n  sub_81244EC.\n- Otherwise reads toolkit->joypad->LowSensitivityHeld and, if option_count > 1,\
  \ calls\n  menu_moveCursorUpDown_811FA22 (r0=held, r1=count, r2=1 wrap flag, r3=current cursor),\n  then stores\
  \ the returned index back at state+0x14 and redraws. With count <= 1 just\n  redraws without changing the cursor.\n\
  End-of-frame redraw is always performed through sub_81244EC; the function tail-calls\nsub_81244EC rather than\
  \ falling through."
