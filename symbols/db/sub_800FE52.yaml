name: sub_800FE52
address: '0x0800FE52'
kind: function
status: confirmed
summary: Counts how many Navi bonus-stat fields are currently set on the allied BattleObject.
interface: u32 countActiveNaviBonuses_800FE52(u32 r5_battleObject); // r0 = active bonus count; r4, r6 preserved;
  NZCV clobbered
details: Iterates ten BattleObject stat slots (offsets 0x31, 0x13, 0x14, 0x16, 0x54, 0x24, 0x18, 0x19, 0x1A, 0x63)
  via GetBattleNaviStatsByte_AllianceFromBattleObject / GetBattleNaviStatsHword_AllianceFromBattleObject, incrementing
  a counter when each is "active". Field 0x31 is treated specially — it only counts when equal to 1, not merely
  non-zero — suggesting it is a boolean flag whose non-1 value means a different state (e.g. disabled/clearing).
  All other fields count whenever non-zero, indicating they hold value-bearing data (bonus counts, equipped bonus
  chips, etc.). The function is purely a tally; it does not modify the BattleObject and only returns the count in
  r0. Likely consumed by a BattleObject spawn/refresh path to decide how many visual Navi-bonus icons to render
  in the status panel.
