open_questions:
- The exact identity of this object (e.g. is it the "Cross Fusion"/beast-out helper object, a transformation
  FX, an ally summoned entity, etc.). Without a NameID-equality check or matching against the related
  object more concretely, the precise battle feature it backs is guesswork; the assembly only proves "mirrors
  related object's PLAYER-state sprite into self, then expires in 4 frames".
- What `sub_8011420` is being told to do here (the r2=1, r1 = navi-index byte sequence) is opaque without
  that callee's higher-level contract.
