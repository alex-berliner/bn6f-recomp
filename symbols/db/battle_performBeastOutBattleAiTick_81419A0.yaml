name: battle_performBeastOutBattleAiTick_81419A0
address: '0x081419A0'
kind: function
status: confirmed
summary: 'Per-frame Beast Out AI tick: initialises pet chip queues on first entry, runs battle helpers, gates on
  cutscene/fade/chatbox/subsystem, then advances SP evolution or ticks the action cooldown.'
interface: '// void battle_beastOutAiFrameTick_81419A0(

  //   u32 r4, u32 r6, u32 r7, u32 r10, u32 lr);

  // in  : r4 (caller context), r6 (caller context), r7 (caller context),

  //       r10 (toolkit pointer), lr

  // out : r8, r9, r10, r11, r12 (written by sub-calls)

  // clobbers: r0-r3, lr, all flags

  // preserved: r4, r5, r6, r7, r8, r9, r12 (r5 saved/restored via push {r4-r7,lr})

  // always returns r0=0

  '
details: "Loads the pet struct pointer (eStruct2001010) into r5 and calls\npet_testIsMapGroupAllowed_8141AA8; bails\
  \ early if the map group is\nnot battle-allowed.\n\nOne-shot init: byte_2001013 (offset +3 of eStruct2001010)\
  \ acts as a\n\"first frame of this battle\" flag.  If set it is consumed (zeroed),\nsub_80468BA is called (likely\
  \ resets battle-object slots), and two\nAI chip-queue slots are initialised via\nbattleObject_initAIChipQueueSlot_80468C6\
  \ (slot 1 → (0,0), slot 2 →\n(1,0)) so the pet has a starting move queue.\n\nUnconditional per-frame work (runs\
  \ even when later gates reject):\n  - battle_callAIDispatch_8046818  – dispatches normal AI tick\n  - battleObject_updateSpriteGfxForAll_8046854\
  \ – refreshes sprite\n    gfx for every battle object; leaves toolkit ptr in r10\n  - battle_gfx_renderLatticeOrSpinner_811E0BA\
  \  – draws lattice\n    grid / spinner effect\n\nGate chain (all must pass to reach the Beast Out decision):\n\
  \  1. IsCutsceneScriptNonNull – no active cutscene script (Z set)\n  2. owPlayer_isBusyOrCutsceneActive_809E462\
  \ – player idle (Z set)\n  3. IsScreenFadeActive – fade must be in progress (Z clear)\n  4. chatbox_mask_eFlags2009F38(0x80)\
  \ – chatbox suppress flag\n     must be clear (Z set)\n  5. gameState.SubsystemIndex == 4 – pet subsystem must\
  \ be active\n\nDecision:\n  battle_canBeastOut_8141AD2 checks whether the pet can trigger\n  Beast Out.  If Z\
  \ (can evolve) → battle_beastSpEvolveStep_8141A10\n  advances one SP-evolution step.  Otherwise →\n  battleObject_tickBeastOutActionCooldown_8141A70\
  \ decrements the\n  cooldown timer so Beast Out can be attempted next opportunity.\n\nAlways returns r0 = 0.\n"
