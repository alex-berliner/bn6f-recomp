open_questions:
- Exact role of `sub_80468BA` (called between clear and the two `sub_80468C6`); could be something like
  "play Beast-SP enter sfx" or "broadcast a UI event."
- The semantics of `eStruct2001010+3` (likely a "is-beast-mode-transitioning" or "beast-mode-armed" byte)
  — not visible from this function alone.
- Whether `sub_8046818` is the canonical "battle AI tick" or only Beast-SP AI; `sub_811E0BA`'s role (only
  ever called in this Beast-SP branch, never seen in the canonical beastsp_0140000_N paths' tail apparently)
  leaves some doubt, though it appears common to this caller.
- What the matching standard-mode battle ticker calls at the same return address — would settle why this
  is split off.
