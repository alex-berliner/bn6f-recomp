summary: Beast-SP Battle AI per-frame dispatch (init sub-mode, run AI, conditionally run sub-routines)
  returning 0.
interface: (r10 = ToolkitPtr) -> r0 = 0 ; updates r4–r7/r8/r9/r12, calls many subsystems, may call chatbox_mask_eFlags2009F38
details: "Reads `eStruct2001010` (a per-subsystem state struct at 0x02010100) into r5 and asks `sub_8141AA8`\
  \ (next-subsystem mode helper) whether a transition is needed; if no, falls through. Otherwise clears\
  \ `eStruct2001010+3`, runs two `sub_80468C6` setup calls (`(1,0,0)` then `(2,1,0)` — likely Beast-SP\
  \ on/off and player/state selects), then continues.\n  Common tail (run regardless when no transition):\
  \ `sub_8046818` (battle AI dispatch — wrapper), `sub_8046854` (battleObject_updateSpriteGfxForAll —\
  \ refresh OAM for every BattleObject), and `sub_811E0BA` (likely battle housekeeping — possibly background\
  \ anims/effects).\n  If no cutscene script is active (`IsCutsceneScriptNonNull`), OW player isn't busy\
  \ (`owPlayer_isBusyOrCutsceneActive_809E462` returns Z), and a screen-fade is in progress (`IsScreenFadeActive`\
  \ returns Z), it reads the chatbox/event-flag word (`chatbox_mask_eFlags2009F38` with `r0=0x80`). When\
  \ the flag bit is *not* set, checks `GameState->SubsystemIndex == 4` (Battle subsystem). If yes, calls\
  \ `sub_8141AD2` (likely \"is Beast-SP initialized?\"); based on its NZ result it picks `sub_8141A10`\
  \ (Beast-SP tick) or `sub_8141A70` (Beast-SP init or alternate branch).\n  Always returns 0. The `snap_beastsp_*.bin`\
  \ frames captured all enter with `r0=0x081419a1` (the low bit set — Thumb `+1` mode, typical of the\
  \ call-site odd address), `r1=0x10`, `r2=1`, `r3=0x02001f6e`, and exit with `r0=0` — consistent with\
  \ this being a Beast-SP-mode loop of the main battle ticker.\n  EWRAM touched: `eStruct2001010` (`off_8141B14`);\
  \ chatbox/event-flag word at `eFlags2009F38`; GameState pointer via Toolkit.\n"
