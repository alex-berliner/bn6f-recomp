name: shop_addItemStockEntry
address: '0x08048CCC'
kind: function
status: confirmed
summary: Merges a batch of 8-byte item entries into a shop's stock table, adding quantities of matching items or
  copying new items into empty slots
interface: void shop_addItemStockEntry(u32 tableIndex /*r0*/, u32 sourceEntries /*r1*/); /* uses r10 as toolkit
  ptr; outputs r0-r3 + NZCV */
details: 'Looks up a 16-byte record in the global table at dword_8046B98 via tableIndex*0x10; reads slotCount from
  offset 0x0C and a stock-list base offset from 0x08, then adds the ShopDataPtr (read from toolkit at oToolkit_ShopDataPtr,
  loaded via r10) to form the live pointer r8. Iterates up to slotCount 8-byte entries in the source array pointed
  to by r1. For each non-empty source entry (ID byte != 0): (1) linear-search the stock list for an existing slot
  whose ID (byte 0), sub-id (u16 at byte 2), and type/flag (byte 4) all match; if found, add the source quantity
  (byte 1) to the existing quantity and clamp the sum to 255 via a signed comparison against 0xFF; (2) if no match,
  linear-search again for the first slot with ID byte == 0 and CopyBytes the 8-byte source entry into it; (3) if
  the stock is full, the entry is silently dropped. Outer loop advances source by 8 and increments r0, terminating
  when r0 reaches slotCount. Leaves r0-r3 and NZCV flags set from the final cmp r0,r5.'
