name: ow_loadEnterMapEntry
address: '0x0809BFE8'
kind: function
status: probable
summary: Selects a 0x1C-byte map-entry record from the table at byte_809BF24 by the index stored in the
  caller's struct and copies its transition settings, including fade parameters for entering a map.
interface: (r0-r4 unused; r5 = object/state struct with index at +0x4) -> r0 = 0; stores record pointer
  at [r5+0x34], bytes at [r5+5..7], and GameState fade params
details: 'Reads an entry index from [r5+4], multiplies by 0x1C, and bases the record table byte_809BF24
  to get a per-entry config. It saves the record pointer into the struct at +0x34 (for later use) and
  copies record+0x13 to [r5+5], record+0x10 to [r5+6], and record+0x11 to [r5+7]. Record+0x12 is treated
  as a fade parameter: if it is 0xFF it is skipped, otherwise it is written to GameState_EnterMapFadeParam1
  with EnterMapFadeParam2 fixed at 0x10, then the function returns 0. The struct fields +5..+7 look like
  stored map-entry attributes (e.g. map/area ids) consumed elsewhere.'
