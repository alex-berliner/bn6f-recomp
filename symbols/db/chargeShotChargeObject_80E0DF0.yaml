name: chargeShotChargeObject_80E0DF0
address: '0x080E0DF0'
kind: function
status: confirmed
summary: State dispatcher (object "main" routine) for the charge-shot charge-up battle object; runs the init, per-frame
  update, or free handler depending on the object's state byte.
interface: void chargeShotChargeObject_main_80E0DF0(void); // object in r5, tail-dispatches via mov lr,pc / bx r1
  to the handler selected by r5->CurState, then returns to the caller
details: "Standard battle-object dispatcher: r5 points to the battle object, and its\nCurState byte (offset 8) is\
  \ used directly as a byte offset into the\nthree-entry handler table at off_80E0E04, meaning the object stores\
  \ its\nstate already multiplied by four:\n  state 0 -> chargeShotChargeObject_init_80E0E10  (first tick after\
  \ spawn)\n  state 4 -> chargeShotChargeObject_update_80E0E20 (per-frame behaviour)\n  state 8 -> object_freeMemory\
  \                     (object being removed)\nThe handler is called with r0 = state byte and r1 = the table entry's\
  \ own\naddress; all other registers pass through untouched. The call is done with\n\"mov lr, pc; bx r1\" followed\
  \ by \"pop {pc}\", so when the handler returns\nhere it simply returns to this function's own caller (a tail-call\
  \ style\ndispatcher). No registers are saved or restored.\n"
