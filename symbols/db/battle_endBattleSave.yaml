    check passes; bl chatbox_8040818 followed by strb #8,[r5,#2] — chatbox teardown and state field set
    to 8; mov r0,#1; bl initSaveStateBlock_8048F9C — E-Save init with save_arg 1 (battle-results save,
    jumptable 0x30); no other caller context, but the callees'' summaries (15-entry eStruct array, E-Save
    block eS200A290) match a battle teardown step'
