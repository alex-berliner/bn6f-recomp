name: battle_endBattleSave
address: '0x0812954C'
kind: function
status: probable
summary: 'Battle-end step: runs entity and e-struct sprite pipelines, waits for the screen fade to end,
  then closes the chatbox, sets state byte +2 to 8, and hands off to the extra-save flow (initSaveStateBlock
  with save_arg=1, which clears eS200A290, writes its header, and sets the main jumptable index to 0x30).'
interface: (r5 = state/context struct, r0-r3 unused on entry) -> r0 = 1 passed to initSaveStateBlock;
  sets state->byte_2 = 8; no meaningful return value
details: 'This is a step in a battle state machine: it first advances the entity simulation (entity_runAllUpdateHandlers)
  and the sprite pipeline (battle_updateEStructSprites) for the 15 eStruct records. It then polls IsScreenFadeActive
  and returns immediately while the fade flag says to wait. When the check passes, it calls chatbox_8040818
  (tearing down/closing the message box), writes 8 into byte 2 of the struct pointed to by r5 (a state/phase
  field, 8 presumably ''finished''), and calls initSaveStateBlock_8048F9C with save_arg = 1, which zeroes
  the E-Save block eS200A290, writes the header, and sets the main jumptable index to 0x30 — the handoff
  that commits the battle results into the extra save.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl entity_runAllUpdateHandlers_80465BC / bl battle_updateEStructSprites_80465F8 — final simulation+sprite
