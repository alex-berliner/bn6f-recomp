name: sub_814F44C
address: '0x0814F44C'
kind: function
status: confirmed
summary: Starts one of the four APU sound channels (1–4) by writing envelope/length then trigger, returning the
  trigger register address to the caller.
interface: void soundStartChannel_814F44C(u8 channel /* r0 */, void *ret /* lr */) -> void *triggerReg /* r1 */;
  clobbers nz,c,v; flags set by ADDS/#-addition path matching the original exit instruction
details: "Masks the input channel argument to a byte and dispatches on its value:\n  1 → writes 0x08 to NR12 (length/envelope)\
  \ and 0x80 to NR14 (trigger).\n  2 → writes 0x08 to NR22 (length/envelope) and 0x80 to NR24 (trigger).\n  3 →\
  \ writes 0x00 to NR30 (stops the wave channel; no separate trigger byte on the GBA).\n  0 / any value >3 → writes\
  \ 0x08 to NR42 (length/envelope) and 0x80 to NR44 (trigger) using channel 4.\nReferences the APU IO register symbols\
  \ that already exist in the disassembly:\nChannel1Duty_Length_Envelope_NR11_NR12_ +1 (i.e. NR12),\nChannel2Duty_Length_Envelope_NR21_NR22_\
  \ +1 (i.e. NR22),\nChannel3Stop_WaveRAMselect_NR30_,\nChannel4Length_Envelope_NR41_NR42_ +1 (i.e. NR42).\nThe\
  \ function ends with `pop {r0}` to return the saved LR in r0, so r0 is in fact\nthe caller's return address —\
  \ the \"void *ret\" shape — and r1 carries the address\nof the last register that was written (the NRx4 trigger\
  \ register, or NR30 for\nthe wave-channel stop case). Flag clobbers reproduce the exit ADDS of each\npath so callers\
  \ that branch on flags right after the call behave identically.\n"
