open_questions:
- Is the channel argument treated as 0-indexed (0→ch1, 1→ch2, 2→ch3, 3→ch4) or 1-indexed at the call sites? The
  actual register mapping for values 0 and >3 both funnel to channel 4, which only makes sense if callers pass 1..3;
  passing 0 is almost certainly not intentional.
- What does the caller do with the returned trigger-register address in r1? It looks like a write-target, but the
  trigger byte has already been written here, so the caller may be using it as a status/handle.
