name: ai_beastSpAttackStep
address: '0x080EDCDC'
kind: function
status: confirmed
summary: 'One tick of Beast PET''s special-attack AI state machine: initialise animation/element, fire a difficulty-scaled
  directional projectile when the step timer hits 13, then expire the attack on countdown.'
interface: 'void ai_beastSpAttackStep(u32 r5 /*obj: battle_object* */, u32 r7 /*vars: AIAttackVars* */, u32 r10,
  u32 lr) -> r1 /*result from jump-table callee or flag op*/; preserves r4,r6,r7; clobbers r0,r2,r3,lr,nzc_v'
details: "oAIAttackVars fields touched:\n  oAIAttackVars_AttackElement (u8) – set to 4 (fire) on init; tested for\
  \ zero to detect first frame.\n  oAIAttackVars_StepTimer (u16) – initialised to 0xF, decremented each call; attack\
  \ fires at 0xD.\n  oAIAttackVars_AiDifficultyTier (u8) – indexes a two-entry jump table at off_80EDD54 selecting\n\
  \    battle_spawnObject9BHeader10 (tier 0) or sub_80E025E (tier 1).\n  oAIAttackVars_Damage (u32) – base damage,\
  \ added to oAIAttackVars_AttackBoost (u16) before firing.\n  oAIAttackVars_AttackBoost2 (u32) – passed as r4 to\
  \ the jump-table callee.\n  oAIAttackVars_InitFlag (u8) – passed as r2 to the jump-table callee.\n  oAIAttackVars_HitElement\
  \ (u16) – set to 4 on timer expiry.\noBattleObject fields: oBattleObject_PanelX, oBattleObject_PanelY – projectile\
  \ spawns at front-direction + PanelX, at PanelY.\nCalls: object_setAnimation(0xC), object_setDefaultCounterTime,\
  \ object_setFlag1(0x400040),\n  object_getFrontDirection, object_clearFlag(0x40), then an indirect bl through\
  \ the tier table.\nThe indirect call saves r7 (push {r7}) because the callee's prologue clobbers it; r4/r6 carry\n\
  AttackBoost2/Damage arguments and are restored by the outer frame's push/pop.\nQuirk: the step-timer branch to\
  \ loc_80EDD30 always executes even when the timer equals 0xD (the\nfire block is not an else-branch), so the timer\
  \ is still decremented after firing.\n"
