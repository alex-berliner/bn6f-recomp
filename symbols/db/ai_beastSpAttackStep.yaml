name: ai_beastSpAttackStep
address: '0x080EDCDC'
kind: function
status: probable
summary: 'AI attack step handler for a Beast/SP boss attack: starts its animation, and on a timed step
  spawns the attack via a difficulty-selected sub-attack function, then cleans up flags when the timer
  expires.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> void; spawns attack via function pointer
  with r0 = panelX + facing dir, r1 = panelY, r2 = InitFlag, r3 = 0, r4 = AttackBoost2, r6 = Damage +
  AttackBoost
details: 'Uses r5 as the battle object and r7 as an oAIAttackVars struct. If AttackElement is 0 the attack
  initializes: animation 0xC via object_setAnimation, default counter time, ObjectFlags1 |= 0x400040,
  StepTimer = 0xF, AttackElement = 4. When StepTimer reaches 0xD it reads a function pointer from off_80EDD54
  indexed by AiDifficultyTier*4 (a small per-difficulty table, two entries seen: sub_80D8B96+1, sub_80E025E+1)
  and long-calls it (lr=pc, bx) with target panel coordinates computed from PanelX plus object_getFrontDirection,
  damage plus AttackBoost in r6, AttackBoost2 in r4, InitFlag in r2, 0 in r3 — the callee spawns/controls
  the actual attack. StepTimer is decremented each frame; when it goes negative the routine clears ObjectFlags1
  bit 0x40 and sets HitElement = 4.'
