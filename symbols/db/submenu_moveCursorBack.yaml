    callee sub_803C0BE pads trailing 0x00/0xE5 slots with 0xE5 pairs up to a 0xE6 terminator — list/text
    buffer trimming; bl PlaySoundEffect with SOUND_CUR_MOVE_80 — cursor movement sound confirms menu navigation
