name: ai_attackElementStep
address: '0x08107258'
kind: function
status: probable
summary: Per-entity battle-AI step that assigns a default attack element and counts down a timer before
  flagging a hit element
interface: (r7 = AI entity struct oAIAttackVars) -> r0 = 0 (discarded); no flags relied on by caller
details: 'Reads oAIAttackVars_AttackElement (byte at r7). If it is zero, stores element value 4 into AttackElement
  and a 10-frame delay into StepTimer, then returns. On subsequent calls it decrements StepTimer; when
  it reaches zero it stores 0x10 into the halfword oAIAttackVars_HitElement. This is a self-contained
  state step of an AI attack routine: initialize element+delay on first entry, then wait, then set the
  HitElement result code that later AI code presumably acts on. Element 4 and result 0x10 are the only
  constants; no other state is touched.'
