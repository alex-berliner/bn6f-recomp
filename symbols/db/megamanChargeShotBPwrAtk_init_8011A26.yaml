summary: 'MegaMan''s charge shot: burns one primary RNG draw per shot and, stat-gated, runs sub_8013D5E
  (a weighted 1/2 pick) whose outcome sends the shot down a second RNG-consuming path.'
details: 'One GetPositiveSignedRNG in this body, plus the draw inside sub_8013D5E when its stats
  are nonzero. It first calls sub_8013D5E and branches on the outcome: 1 goes to sub_8011ADA, 2 to
  busterBugChargeShotDamageCalcHappensHere_8011A7E, every other value (0 included) continues. It then
  reads navi stat 0x4D and, when it is nonzero, draws once (mask 1, or 7 when the stat is >= 0x1E) into
  AIAttackVars+0x0C.'
