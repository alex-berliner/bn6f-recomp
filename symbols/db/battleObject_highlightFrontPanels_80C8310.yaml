name: battleObject_highlightFrontPanels_80C8310
address: '0x080C8310'
kind: function
status: confirmed
summary: Highlight a consecutive run of panels in front of a battle object, one per step.
interface: void sub_80C8310(s32 panel_count /* r0 */, struct BattleObject* obj /* r5 */);
details: 'Iterates `step` from 1 to panel_count (inclusive), inclusive comparison against

  a treated-as-signed count. Each iteration calls object_getFrontDirection to

  obtain the unit increment along the object''s facing axis (returned in r0),

  multiplies it by the current step, adds it to the object''s current PanelX

  (read from `r5 + oBattleObject_PanelX` as a byte) to compute the X of the

  panel to highlight, and uses the object''s unchanged PanelY

  (`r5 + oBattleObject_PanelY`) as the Y, then calls object_highlightPanel

  with (x, y). Preserves r4 and r6; loops r4 1..panel_count, with r6 holding

  the original count passed in r0. Only the immediate panel directly in front

  (step==1) up to `panel_count` panels ahead are highlighted; nothing else

  on the object is touched.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
