name: customScreen_consumeSelectedChipsStep
address: '0x08027458'
kind: function
status: probable
summary: 'Per-frame update of the battle custom screen''s confirm phase: every 25 frames pops one selected
  chip (sound 0x196, chip-picker effect, slot redraw), tracks a 20-frame animation timer on activeChip[8].byte7,
  and when the queue is done compacts the folder and advances state via [r5+2]=8.'
interface: (r5 = custom-screen state object) -> void; increments [r5+0x40], updates [r5+8] remaining-chip
  count, [r5+0x5F] used-chip count, [r5+0x44] frame timer, and sets [r5+2] = 8 when done
details: Increments a counter at [r5+0x40] and divides it by 25 via SWI 6 (Div); only when the remainder
  is 0 does it pop one chip, so chips are consumed on a timed cadence. It reads the queue of selected
  chip indices at r5+0x47 indexed by the count byte [r5+8], gets the 12-byte active-chip entry via getLocOfActiveChips,
  and clears that entry (writes 0xFFFF through its pointer at +8, clears bit0 of +4 which also zeroes
  BattleState+0x17). The chip word read from the entry is appended to a 'used chips' list at r5+0x60+2*[r5+0x5F],
  the remaining-count is decremented, sprite tiles (0x1FF) are copied to a VRAM slot, slot 0 of the screen
  is redrawn, the chip-picker effect runs, and sound 0x196 plays, then a 20-frame timer at [r5+0x44] is
  started; while that timer runs, activeChip[8].byte7 = 3 (animation flag), reverting to 0 when it expires.
  When [r5+8] == 0 (no chips left, or the selected entry is empty), it instead compacts the battle folder
  chip list, calls two follow-up helpers, and sets [r5+2] = 8 to move the custom screen to its next state.
