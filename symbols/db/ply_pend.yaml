name: ply_pend
address: '0x0814E118'
kind: function
status: confirmed
summary: Pops the most recently queued entry off a player "pending" list and copies it into the current-entry slot.
interface: void ply_pend(void* list /* r1 */); /* returns r2=poppped entry value (or count if empty), r3=&list+4*newCount,
  sets nzcv; lr preserved */
details: 'Operates on a small pending-action structure pointed to by r1: a byte

  count of queued entries at +0x02, a 32-bit "current" slot at +0x40, and

  an array of 4-byte queued entries starting at +0x44. If the count is

  zero the function returns without changing anything (flags reflect the

  count == 0 compare). Otherwise it decrements the count, stores it back,

  computes &list + 4*newCount (flags from that add), loads the 4-byte

  entry at +0x44 + 4*newCount (i.e. the last queued entry), and writes it

  to the +0x40 current slot. So the last entry queued becomes the active

  one and is removed from the queue; earlier queued entries remain in the

  array. r2/r3 and the nzcv flags are scratch/outputs, matching the

  register contract; nothing else in memory is touched. Note the list

  header count lives at +0x02, not the start of the struct, and entries

  are popped LIFO even though the array would allow FIFO indexing.

  '
