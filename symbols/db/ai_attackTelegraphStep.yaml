name: ai_attackTelegraphStep
address: '0x080ED764'
kind: function
status: confirmed
summary: Runs the wind-up/telegraph phase of an enemy AI attack, playing the charge animation and sound before arming
  the hit element.
interface: void ai_attackTelegraphStep(u32 *attackVars /* r7 */, void *object /* r5 */, u32 soundArg /* r2 */);
  no return value
details: 'r7 points at the acting object''s AI attack variable block (oAIAttackVars) and r5 at the

  object itself. On the first call (AttackElement == 0) it kicks off the telegraph:

  plays the charge animation (object_setAnimation with anim id 0xE), clears the AI attack

  state via ai_clearAttackVar, sets the object''s "charging attack" flag bit

  (1 << OBJECT_FLAGS_UNK_BIT_22_BIT) via object_setFlag1, zeroes StepTimer and writes

  AttackElement = 4 to mark the telegraph state. On every call (including the first),

  it reads the 16-bit StepTimer; when the timer reads 1 it plays sound effect 0xF8

  (the charge-up sound). It then increments StepTimer, and once the timer exceeds 4 it

  writes HitElement = 4, arming the element so the next AI attack step can fire. The

  timer is left above 4 so the telegraph does not restart.

  '
