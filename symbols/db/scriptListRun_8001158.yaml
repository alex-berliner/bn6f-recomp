name: scriptListRun_8001158
address: '0x08001158'
kind: function
status: confirmed
summary: Walks a script table (array of {cmd, arg} pairs terminated by a zero cmd) and dispatches each
  pair to sub_802FE28.
interface: void sub_8001158(const void *scriptTable);  // r0 = list ptr; clobbers r0-r3, r5, lr; flags
  NZ clobbered
details: 'Iterates an array of 8-byte entries laid out as [u32 cmd, u32 arg]. For each entry whose

  cmd word is non-zero it calls sub_802FE28(cmd, arg, 0, 0) with the cmd in r0, arg in r1,

  and zeroes in r2/r3. The loop terminates on a zero cmd (r0 is tested via tst r0,r0 and

  branches when zero). Pointer is advanced with `add r7,#8` per entry. r7 holds the walking

  pointer; r0/r1/r2/r3/lr are clobbered by the dispatcher call, r4-r6 preserved.

  The "sub" prefix is dropped because the readable C confirms a single responsibility (script

  table iteration), and sub_802FE28 is the per-command handler. The exact semantics of

  sub_802FE28 (and therefore what "cmd"/"arg" represent) are not known from this function alone.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
