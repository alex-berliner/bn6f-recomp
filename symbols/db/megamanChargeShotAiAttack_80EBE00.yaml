name: megamanChargeShotAiAttack_80EBE00
address: '0x080EBE00'
kind: function
status: confirmed
summary: Dispatches one step of MegaMan's charge-shot AI attack by tail-calling the routine selected from a 3-entry
  table using the phase byte in the AI attack state.
interface: Next megamanChargeShotAiAttackDispatcher_80EBE00(void); // r7 = AI attack state, phase byte at +0 (values
  0/4/8); flags and all callee registers pass straight through to caller
details: 'Reads the phase byte at offset 0 (oAIAttackVars_Unk_00) of the AI attack state block held in r7, then
  indexes off_80EBE14 with the raw byte value (so stored phases are byte offsets 0, 4, 8, not indices 0-2) to fetch
  a Thumb entry address: +0 -> sub_80EBE20, +4 -> sub_80EBE54, +8 -> sub_80EBEB2. Performs a tail call via "mov
  lr, pc; bx r1" followed by "pop {pc}", so the chosen routine returns directly to this function''s caller and its
  register/flag results pass through unchanged. r0 on entry to the callee is the phase byte itself, and r1 holds
  the loaded branch target (artifacts of the implementation). Any phase byte other than 0/4/8 would branch to a
  garbage word read from the table region; the game never stores one. The three callees are the successive stages
  of the charge-shot attack behavior for the AI-controlled MegaMan (e.g. wind-up, fire, recovery).'
