name: LoadGFXAnimsForMapGroup
address: '0x08030A30'
kind: function
status: confirmed
summary: Dispatches a GFX-anim load handler for a map's group via one of three jumptables (real-world, internet,
  unknown range), keyed on the map group number.
interface: (u8 mapGroup in r0, u8 mapNumber in r1) -> void; clobbers r0-r3, r12, lr and flags; preserves nothing
  beyond the normal caller-saved set
details: 'Takes a map group index in r0 (and a map number in r1 that is passed through to the handlers untouched)
  and tail-dispatches to a per-group loader routine. Group values below INTERNET_MAP_GROUP_START index RealWorldMapGroupLoadGFXAnimsJumptable
  directly; values from INTERNET_MAP_GROUP_START up to (but not including) UNKNOWN_MAP_GROUP_START index InternetMapGroupLoadGFXAnimsJumptable
  with the start value subtracted; values >= UNKNOWN_MAP_GROUP_START index UnkMapGroupRangeLoadGFXAnimsJumptable
  relative to its own start. The chosen handler is entered with r0 = (group - rangeStart) * 4 (the byte offset of
  its jumptable entry) and r2 = the handler''s own address. It uses the classic "mov lr, pc / bx r2" trick, so the
  handler returns to the pop {pc} immediately after the dispatch, which returns straight to this function''s caller
  — the handlers effectively tail-call back into LoadGFXAnimsForMapGroup''s return. Handlers are thumb routines
  stored as 32-bit addresses in the jumptables. Note the group index is treated as signed for the comparisons.

  '
