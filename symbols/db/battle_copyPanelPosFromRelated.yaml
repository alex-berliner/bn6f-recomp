name: battle_copyPanelPosFromRelated
address: '0x080D9682'
kind: function
status: probable
summary: Copies the related object's panel coordinates into this battle object's PanelX/PanelY.
interface: (r5 = battle object) -> void; r0 clobbered, no flags meaningful
details: 'Loads the pointer at oBattleObject_RelatedObject1Ptr from the object in r5, then reads PanelX
  and PanelY bytes from that related object and stores them into the same fields of r5''s object. It is
  a 4-byte-effective field copy of the panel position only — nothing else is synchronized and no other
  state is touched. Called from battle_initCollisionBodyState during battle object spawn, suggesting a
  newly created object (e.g. a summoned or attached entity) inherits its panel square from its related/owner
  object. Quirk: it assumes RelatedObject1Ptr is already valid; there is no null check.'
