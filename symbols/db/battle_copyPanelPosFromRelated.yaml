  date: '2026-10-18'
  detail: ldrb r0,[r3,#oBattleObject_PanelX]/strb r0,[r5,...] pairs copy PanelX then PanelY from the related
    object; r3 loaded from [r5,#oBattleObject_RelatedObject1Ptr], so the source is the linked object;
    caller battle_initCollisionBodyState runs it during spawn/init before advancing the object to update
    state
