name: tryStartBbsGuiCutscene_809CF2C
address: '0x0809CF2C'
kind: function
status: probable
summary: Starts the BBS GUI cutscene if the global cond-check passes and a BBS request is pending.
interface: 'void sub_809CF2C(void); // in: none, out: nz/c/v (BEQ branches), preserved r4-r7'
details: 'Calls sub_8034C36; bails (no-op) if it returns zero. Otherwise calls reqBBS_81407D8

  with r0=0 (some BBS-request query/pop) and bails if zero. When both succeed, reads

  byte at eReqBBSGui + 0xE, transforms it via (byte - 1) + 0x32, and calls

  StartCutscene(A_byte_809CEB4 /* CutsceneScript */, transformed_param, R2=0).

  Likely the world/event side of "player interacted with a BBS terminal while a

  BBS request is queued", kicking off the gui cutscene and embedding the request

  index as the cutscene param.

  '
