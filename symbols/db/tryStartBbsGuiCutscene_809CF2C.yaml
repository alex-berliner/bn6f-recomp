name: tryStartBbsGuiCutscene_809CF2C
address: '0x0809CF2C'
kind: function
status: confirmed
summary: Conditional entry point that starts the BBS GUI cutscene when the player can advance forward and a BBS
  request is pending.
interface: 'void tryStartBbsGuiCutscene_809CF2C(void); // inputs: r10 (caller-saved, preserved by extra push? —
  actually untouched), lr; outputs/clobbers: r0, r1, r2, r3, NZCV; preserved: r4–r7'
details: "Guarded launcher for the BBS GUI cutscene. It performs two preconditions before\ncalling StartCutscene:\n\
  \  1. check_playerCanAdvanceForward_8034C36 — if it returns false (Z set after `beq`),\n     bail out without\
  \ touching anything else.\n  2. reqBBS_81407D8 — called with r0 still carrying the previous result (the function\n\
  \     apparently ignores or reuses its input); if it returns 0, bail out.\n\nOn success it starts the cutscene\
  \ defined by byte_809CEB4 (the script pointer loaded\nvia off_809CF50). The parameter passed to StartCutscene\
  \ is computed as\n`eReqBBSGui[0xE] - 1 + 0x32`, i.e. an entry-id-based index into the cutscene parameter\ntable.\
  \ The constant 0xE is loaded from dword_809CF54 and reused as both the byte\noffset into eReqBBSGui (off_809CF58)\
  \ and a scratch value subtracted/added immediately\nafter the load — a small code-size trick rather than a separate\
  \ constant. The \"−1 + 0x32\"\nis therefore equivalent to \"+0x31\".\n\nThe function name, callee list, and the\
  \ eReqBBSGui/eReqBBS naming strongly suggest\nthis lives in the overworld/BBS (message-board) subsystem: the function\
  \ is the\none that decides whether to trigger the GUI cutscene when the player tries to interact\nwith a BBS terminal.\
  \ r1/r2/r3 are explicitly listed as outputs because StartCutscene\nis a void-returning leaf that leaves its scratch\
  \ registers dirty, and the surrounding\ncode does not restore them.\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
