name: sub_810D808
address: '0x0810D808'
kind: function
previous_names: []
status: hypothesis
summary: Drives one battle object's per-frame panel-highlight pass (counter-timer reset, side-flip direction lookup,
  panel highlight for matching cells, related flag set).
interface: (r0=ignored, r1=`BattleObject*` aliased with `r5`, r2=0x80, r3=3; out=r0=panel slot/iteration byte, r1=possibly
  the cur-chip slot index; r4/r5/r7/r10/lr are callee-saved)
details: "The assembly for this address was not located in the bn6f asm directory (`sub_810D808 not found in bn6f/asm`),\
  \ so the description is inferred from the lifter contract, callees and captured-call arguments.\n  - Entry always\
  \ loads r0=0, r1=`0810d809` (a `BattleObject*`-like address matching the linked-list sentinel of the battle-object\
  \ list), r2=0x80, r3=3, sp=`03007d70`, lr=`0810d7f0`. That matches the project's \"battle object list walk with\
  \ param block\" calling convention used by other `0x810D7xx` battle-object dispatchers.\n  - The callees it invokes\
  \ match the operation: `battle_ResetObjectTimerTo8_80C4072` writes 8 into `BattleObject.Timer`; `object_setCounterTime`\
  \ writes the counter; `object_getFrontDirection` returns the +/-1 facing multiplier; `object_setFlag1` ORs a flag\
  \ into the object's collision `ObjectFlags1`; `highlightPanelIfSomeCondition_8109660` highlights panels using\
  \ a (dx,dy) list around the object's panel coords with a side multiplier.\n  - Exit r0 cycles through small values\
  \ (0x24, 0x25, 0x7f) and the captured-call stack frame is the same `03007d70` used by other battle update frames.\
  \ Together this points to a per-frame battle object update that walks a panel list, sets per-object state, and\
  \ returns either a hit count or a chip/slot index.\n  - Because no assembly was provided, every claim about field\
  \ offsets, the highlight rule, and the meaning of the return value is inference from callee behaviour, not from\
  \ disassembly.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- 40 captured calls all show the identical `(r0=0, r1=0810d809, r2=0x80, r3=3, sp=03007d70, lr=0810d7f0)`
    frame, consistent with a fixed dispatcher called once per object per frame. - r1=0x0810d809 is odd-aligned (`+1`)
    so it almost certainly points at `oBattleObjectsLinkedListStart` (0x10 byte sentinel containing `Prev/Next`),
    with the +1 flag the same kind of "list head" marker used in other object walkers. - callee list: `battle_ResetObjectTimerTo8_80C4072`
    writes 8 to the battle object''s Timer field; `object_setCounterTime` + `object_setFlag1` (writing to `CollisionData.ObjectFlags1`)
    match "counter driven highlight" semantics. - `object_getFrontDirection` returning a +/-1 multiplier and `highlightPanelIfSomeCondition_8109660`
    taking a panel-coordinate list with a side sign parameter directly implies the function passes panel (dx,dy)
    offsets weighted by alliance side direction. - exit r0 range 0x24..0x7f is consistent with a small byte written
    back into a per-object chip/slot index or a "did we hit a highlighted panel" counter; the exact meaning cannot
    be pinned without seeing the epilogue.'
  refs:
