  \ build (asm listing \"not found in bn6f/asm\"). The captured-call snapshots all share the\n  same caller frame:\
  \ entry r0=0, r1=0x0810d809 (this function +1, thumb-pop marker), r2=0x80,\n  r3=3, lr=0x0810d7f0, suggesting\
  \ a small trampoline/inner helper at 0x0810d808 reached from\n  the routine at 0x0810d7f0. The callees imply it\
  \ manipulates a battle object (sets a flag,\n  resets the +8 timer, sets a counter time, queries DirectionFlip\
  \ and a panel-highlight helper).\n  It does not return to its caller via a normal pop; r0 is left holding one\
