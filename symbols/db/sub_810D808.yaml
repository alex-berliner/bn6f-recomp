name: sub_810D808
address: '0x0810D808'
kind: function
previous_names: []
status: hypothesis
summary: AI/state tick handler that drives a battle object through its current state, updating counters, panel highlights,
  and object flags per frame.
interface: (r0 = object ptr? -> set up via r4/r5/r7/r10) ; r5 (battle object?) and r1 (return status) are live for
  caller; side effects mutate battle object state, panels, and AIData
details: "Contract lists in-registers r4/r5/r7/r10/lr and out r1/r5, with heavy may_write on almost everything\n\
  \  (flags + r0-r7 + lr). Callees include battle_ResetObjectTimerTo8_80C4072 (timer reset to 8),\n  highlightPanelIfSomeCondition_8109660\
  \ (panel-highlight loop over a list of dx/dy offsets around a\n  base panel using object_getFrontDirection's +/-1\
  \ side sign), object_setFlag1 (OR a flag bit into\n  CollisionData ObjectFlags1), object_setCounterTime, object_getFrontDirection,\
  \ and an unnamed\n  sub_80C5578 helper that takes 7 args. The combination (set counter time, reset an object's\n\
  \  wait timer to 8, OR an ObjectFlags1 bit, then walk a panel-offset list to highlight panels\n  with the side-aware\
  \ sign) matches a per-frame AI/state step: pick an action/state, set the\n  count-down, mark the object as \"\
  using action\", then visually mark the panels this step\n  affects. r10 is the toolkit convention (AIData / battle-state\
  \ struct), r5 is the battle\n  object, r4/r7 are loop/scratch. Captured-call exits return small r0 values (0x24,\
  \ 0x25,\n  0x7f) that look like the new CurState/CurAction byte after the step.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Captured-call entry r1 = 0x0810d809 (this+1, the Thumb `+1` trick used by BL/BLX-style indirect calls)
    and r2 = 0x80, r3 = 3, lr = 0x0810d7f0 (the parent dispatcher) on every snap, which is the typical "AI dispatch
    table tick" calling convention. - r4/r5/r7/r10 in-regs align with toolkit (r10) + battle object (r5) + scratch.
    - battle_ResetObjectTimerTo8_80C4072 sets a battle object''s +8 (CurState) area''s timer to 8, which is the
    standard "wait 8 frames before next AI step" pattern. - highlightPanelIfSomeCondition_8109660 + object_getFrontDirection
    (returns +/-1 side sign) together mean "highlight these panels relative to my current panel, mirror for enemy
    side". - object_setFlag1 OR-ing OBJECT_FLAGS_USING_ACTION (or similar) is the canonical "I''m acting this frame"
    marker on ObjectFlags1. - Exit r0 returns 0x24, 0x25, 0x7f depending on snap -- consistent with returning the
    new CurState/CurAction byte that the caller will dispatch on next frame.'
