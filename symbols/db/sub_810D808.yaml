name: sub_810D808
address: '0x0810D808'
kind: function
previous_names: []
status: hypothesis
summary: Tick handler for a battle object's per-action update (advance state, retarget by facing, refresh counter/highlight),
  given battle object and an internal action id.
interface: (r0 = 0, r1 = &ret_810D808 thunk for caller -> this function at 0x810D809, r2 = 0x80, r3 = 3, r4..r7/r10/lr
  from caller) -> r0 = an exit small value (often 0x24, 0x25, 0x7F) ; no side effect contract on global EWRAM shown.
details: "- Address 0x810D808 is the entry, with the body actually starting at 0x810D809 (matches r1=0x0810d809\
  \ in the captures, which is a \"+1\" Thumb-mode trick: caller stored the +1 of the destination and the routine\
  \ negates the bias; in the captures the next instr is `bl sub_810D808` from 0x0810d7f0, and Thumb BL ignores bit0;\
  \ so the captured `r1=0x0810d809` is just the disassembler quirk of showing a +1 bias for a Thumb target).\n \
  \ - The r2=0x80, r3=3 look like a small argument pair (an action index 0x80 in some flag-byte sense, with mask\
  \ 3) but the contract lists no in-r0..r3, so they are scratch.\n  - In-reg contract {r4,r5,r7,r10,lr} and out\
  \ {r1,r5} plus r5-r7/r10/lr may_write, plus a single byte in r0, with flags in C/V/N/Z changing: strongly suggests\
  \ this is a per-frame state-machine action tick.\n  - r5 in is read with `object_getFrontDirection` (which uses\
  \ r5 -> facing direction) and `object_setFlag1` (r0 = r5), so r5 is the active battle object pointer.\n  - r10\
  \ is read by `object_setCounterTime(r0,r5,r10,lr)` -> r10 is the toolkit (matches the convention \"toolkit struct,\
  \ always in r10\").\n  - r7 in + out r7 (may_write): typical index/counter register in a `for (...)` loop.\n \
  \ - The callee `highlightPanelIfSomeCondition_8109660` matches a \"highlight a column of panels\" routine that\
  \ takes a baseX/baseY and a sign, consistent with a BattleObject update that needs to redraw an attack-row highlight\
  \ when an action triggers a panel selection.\n  - The callee `sub_80C5578` is a generic `in r0..r7/lr -> out r0..r3/r5/lr`\
  \ worker used widely as a state-tick helper.\n  - `battle_ResetObjectTimerTo8_80C4072` is called to reset the\
  \ per-action timer to 8 ticks, consistent with a \"begin a new action phase\" update.\n  - Captured exit r0 values\
  \ 0x24, 0x25, 0x7F across calls correspond to small \"phase\" / \"status\" codes returned to the dispatcher.\n\
  \  - Without disassembly the exact stage of the action being ticked is unknown; callees and the out-r1 plus the\
  \ various small r0 returns suggest this routine both advances the action and tells the dispatcher the next phase\
  \ index.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Callee `object_setCounterTime` and `object_setFlag1` both take r5 as the battle object, so r5 in this
    function is the BattleObject* (consistent with the project''s convention BattleObject* in r5). - `object_getFrontDirection`
    is called with r5 to compute facing side-sign; this is used to expand a panel highlight in `highlightPanelIfSomeCondition_8109660`,
    the typical pattern when an action projects a row/column ahead of the actor. - `battle_ResetObjectTimerTo8_80C4072`
    writing 8 to +0x8 fits the BattleObject.CurState/CurAction region, i.e. advancing a per-action timer. - r10
    in and being passed to `object_setCounterTime` matches the toolkit-in-r10 rule. - Captured r0=0, r1=0x0810d809,
    r2=0x80, r3=3 is identical across the six calls shown, with lr=0x0810d7f0: a single dispatcher loop in 0x0810d7f0
    is invoking this routine as a "+1" Thumb target via `bl 0x0810d808` with bit0=1 set, so the body actually starts
    at 0x0810d809. - Exit r0 values 0x24, 0x25, 0x7F vary across calls but always tiny; this is the shape of a "phase"
    or "state code" return used by an action jumptable.'
