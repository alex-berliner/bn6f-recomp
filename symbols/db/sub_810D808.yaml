open_questions:
- We have no assembly; the role above is reconstructed only from the callee set and the in/out contract.
- The semantic meaning of r0 returns 0x24 vs 0x25 vs 0x7F (idle / action end / error?) is unknown; needs the disassembly
  to read the `cmp`/`bne` ladder.
- Whether this routine is the per-frame `CurState==CUR_STATE_UPDATE` dispatcher or a single named action like "step
  forward" / "attack" cannot be determined from the caller list (caller is hidden as "0x0810d7f0").
