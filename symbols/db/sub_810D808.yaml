name: sub_810D808
address: '0x0810D808'
kind: function
previous_names: []
status: hypothesis
summary: 'Per-tick SnakeArm battle-object driver: highlights the panel pattern from the current panel, refreshes
  the object''s counter timer/facing flags, resets the wait timer, and returns a per-step state byte.'
interface: '() -> r0 = step status (0x25/0x24 final, 0x7f mid); r5 = preserved; side effects: panel highlights +
  battle object timer/counter/flag updates.'
details: "Empty assembly dump, so reconstruction is from callers/callees/captures. Every captured entry comes from\
  \ one caller (lr=0x0810d7f0) with r1=0x0810d809 and r2=0x80, r3=0x03, with r0=0 on entry — strongly suggesting\
  \ this is a state thunk invoked as a jumptable action (likely action+phase dispatch on the snake-arm battle object's\
  \ CurState/CurAction at +8/+9, fed with r0=0 scratch, r1=self-code address, r2=param1=0x80, r3=param2=0x03).\n\
  \  Returns in r0 are either 0x25/0x24 (terminal) or 0x7f (still ticking) with C flag cleared, which is consistent\
  \ with this being a CurState INIT/UPDATE/DESTROY-style dispatch returning a \"still running\" flag in 0x7f.\n\
  \  Callees match: it queries object_getFrontDirection and object_setFlag1 on its own battle object, calls object_setCounterTime,\
  \ calls battle_ResetObjectTimerTo8_80C4072 (resets +8 wait timer), and calls highlightPanelIfSomeCondition_8109660\
  \ with (r0..r3) — likely the panel-position-list helper that paints the curving arm shape from the object's current\
  \ panel using r2/r3 as the (dx,dy) list base and the side sign from object_getFrontDirection.\n  sub_80C5578 is\
  \ a generic battle subroutine (high register clobber list, in/out match many registers) likely called to drive\
  \ the per-frame panel/movement updates.\n  The fixed input r2=0x80 + r3=0x03 (param1/param2 of the SnakeArm battle\
  \ object = 0x80/0x03 in BattleObject.Params/Param1..4) plus the highlighted panels via a (dx,dy) offset list make\
  \ this the SnakeArm chip's per-tick spread/outline logic. Naming keeps the `_ADDRESS` suffix because the precise\
  \ returned state values are not verifiable from the lifted code.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- Caller lr=0x0810d7f0 in every captured invocation is the snake-arm object dispatcher; entry r1=0x0810d809
    indicates self-code passed in (typical bn6 battle-object jumptable entry). - Entry r2=0x80, r3=0x03 match the
    BattleObject Params/Param1..4 of the SnakeArm battle object (constant per object type). - Exit r0 in {0x25,
    0x24} (terminal, C set then cleared) and r0=0x7f (mid-state, Z+C clear) — characteristic of a per-tick driver
    returning a "still busy" sentinel. - highlightPanelIfSomeCondition_8109660 is called with the panel-offset-list
    signature (in r0..r3); combined with object_getFrontDirection this is exactly how a curved-arm highlight chain
    is drawn each frame. - battle_ResetObjectTimerTo8_80C4072 resets +8 (CurState/CurAction region) wait timer between
    ticks, the standard "schedule next tick" pattern for chip-object state machines. - object_setFlag1 + object_setCounterTime
    touch the collision/state fields typical for an in-progress attack anim.'
