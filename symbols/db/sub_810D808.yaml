name: sub_810D808
address: '0x0810D808'
kind: function
previous_names: []
status: hypothesis
summary: Battle object hook that resets the object's timer, ORs a flag bit, updates a counter and highlights a panel
  range relative to the object's facing direction.
interface: (r0 = unused, r1 = thispc+1 (called via tail-call), r2 = ?, r3 = ?, r4/r5/r7/r10 = preserved object/toolkit;
  lr = return) -> r0 = counter value (0x24..0x7f), r1 = panel side-sign, r5 = preserved; NZCV clobbered
details: "Assembly is not present in the provided slice (\"sub_810D808 not found in bn6f/asm\"), so the\n  description\
  \ is reconstructed only from the register contract, callee list and 40 captured\n  call snapshots.\n  Looks like\
  \ a per-frame AI/panel step for a battle object whose this-pointer comes in via r1\n  with bit 0 set (r1 = 0x0810d809\
  \ = sub_810D808 | 1, i.e. Thumb callee entered with BX-style\n  tail call). It calls battle_ResetObjectTimerTo8_80C4072\
  \ on r0, then object_setCounterTime\n  (contract uses r0, r5, r10), then object_setFlag1 to OR a flag into the\
  \ object's\n  CollisionData, then highlightPanelIfSomeCondition_8109660 using object_getFrontDirection\n  (r5)\
  \ to derive a +1/-1 side-sign, and finally writes a small monotonic counter into r0\n  (0x24, 0x25, 0x7f, ...\
  \ observed). Exits with r1 carrying the side-sign and r5 intact\n  (r5 is listed in `in` and `out`, so it is preserved\
  \ across the call).\n  The captured-return counters (0x24, 0x25, 0x7f) are consistent with a per-tick value that\n\
  \  ramps up to 0x7f and possibly wraps; the function is `void`-ish from the caller's POV\n  (r0 is not a \"real\"\
  \ return - it is a state value the caller might read).\n"
