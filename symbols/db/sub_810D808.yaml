open_questions:
- The asm wasn't found, so field offsets, the exact state machine (counter reset -> counter set -> drive highlight
  -> flag set), and the meaning of the return value are guessed.
- r0 returned values like 0x7f (carry/zero) suggest "max panel index reached" or "saturated", but could equally
  be a flag mask. Disassembling the epilogue at 0x810d808 and the matching 0x810d7f0 caller would settle the contract.
