summary: 'Battle-object AI step (story-boss Anpanman/Snake-arm logic): resets the object''s timer to 8, refreshes
  its panel highlight set with a directional side offset, sets a counter time and the INVISIBLE flag, then lets
  the side-sign fall back through the helper.'
interface: (r0 = ignored, r1 = &this function = 0x0810d809, r2 = 0x80, r3 = 3) -> r0 = 0x25 | 0x24 | 0x7f ; writes
  the visible panels via sub_8109660, mutates the battle object's CollisionData/Timer, sets OBJECT_FLAGS_INVIS on
  the object, leaves r1 with the side-direction multiplier the caller preserves in r5.
details: "- Live snapshot is at 0x03007d70; capture comes from a story cutscene (snap_story6_*.bin) with lr = 0x0810d7f0.\n\
  \  - lr 0x0810d7f0 means this is dispatched from a per-cutscene jumptable slot at 0x0810d7f0..0x0810d807 (5 thumb\
  \ slots) — i.e. it's a story-boss behaviour invoked every BattleObject Update tick.\n  - Captured return r0 ranges:\
  \ 0x24, 0x25, 0x7f, with C/V flags set; this is the chain of helper return values, not a \"real\" return value\
  \ passed back to game state.\n  - Direct callees:\n      * battle_ResetObjectTimerTo8_80C4072 — sets the object's\
  \ CurStateAction phase timer / CounterTimer field at +8 to 8 (start-of-tick).\n      * highlightPanelIfSomeCondition_8109660\
  \ — paints the highlight set; takes (basePanelX, basePanelY, sideSign, ?). The constant r2=0x80 / r3=3 in the\
  \ live capture feed this call.\n      * object_setCounterTime — sets CollisionData+0xd \"CounterTimer\" (already-initialised\
  \ at 8 by the first helper, then set by this one with r5 = battler).\n      * object_setFlag1 — sets OBJECT_FLAGS_INVISIBLE\
  \ (0x02) on CollisionData+3c.\n      * object_getFrontDirection — returns +1/-1 facing sign for the battler (r5\
  \ in / r0 out).\n      * sub_80C5578 — likely an object-state/handler animation tick helper; commonly used to\
  \ advance phase / AnimState.\n  - High-level flow derived from the callee set: reset timer to 8, paint highlight\
  \ panels relative to battler panel using front direction, set counter time and INVISIBLE flag, run sub_80C5578\
  \ with current state, then return the side-direction sign from object_getFrontDirection to the caller.\n  - The\
  \ function uses r5 as the live battle-object pointer (BattleObject*), r10 as ToolkitPtr (standard battle convention),\
  \ and clobbers r0-r4 plus callee-saved lr.\n  - The captured exit r0 values 0x24 and 0x25 are unusual — they're\
  \ values returned by the chain of helpers, not meaningful to the caller. The 0x7f exits look like a side-effect\
  \ of a subsequent helper returning a status byte (likely sub_80C5578's anim-state return).\n  - The chosen name\
  \ reflects the story6 capture (Anpanman is a story-boss battler in BN6) plus the panel highlight + snake/arm panel-pattern\
  \ behaviour suggested by highlightPanelIfSomeCondition_8109660.\n"
