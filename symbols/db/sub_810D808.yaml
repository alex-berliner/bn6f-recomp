details: "The lifter reports a 0x0c-byte prologue typical of Thumb code at 0x0810d808, but the\n  actual instruction\
  \ bytes are absent from the dump (\"sub_810D808 not found in\n  bn6f/asm\"). All evidence therefore comes from\
  \ callees, captured-call context and\n  callers. Entry context from snap_story6_*.bin is nearly constant:\n  \
  \  r0=0, r1=0x0810d809 (Thumb address of this function + 1, i.e. \"this + 1\" sentinel\n    pattern), r2=0x80,\
  \ r3=0x03, sp=0x03007d70, lr=0x0810d7f0 (i.e. the caller sits\n    just before this function). r5 is a battle-object\
  \ pointer in r5 (per callee\n    contracts of `object_getFrontDirection`/`object_setCounterTime`/`object_setFlag1`,\n\
  \    which take the object in r5). r7 is used and r10 is the toolkit pointer, the\n    standard battle call-site\
  \ shape.\n\n  The five captured exits show r0 takes one of three values: 0x24, 0x25, or 0x7F.\n  Values 0x24 and\
  \ 0x7F are common battle \"step\" return codes in this engine\n  (continue/wait); 0x25 is one of a few small-script\
  \ return constants as well. The\n  varying carry/zero flags and the wide register-clobber list indicate this routine\n\
  \  does real work (calls into helpers that mutate the object and the panel grid)\n  rather than a thin trampoline.\n\
  \n  Direct callees:\n    - `battle_ResetObjectTimerTo8_80C4072` -- null-safe write of 8 into a battle\n      object's\
  \ +8 timer slot (per the callee contract: in r0 object, out r1). This\n      implies the routine owns a phase\
  \ that must explicitly re-arm an object timer\n      (consistent with a re-entrant script step).\n    - `highlightPanelIfSomeCondition_8109660`\
  \ -- bulk-highlights a 6x3 panel offset\n      list; per the contract it takes (r0 base, r1 = ?, r2 = 0x80 ?,\
  \ r3 = 3 ?, ...).\n      Note the captured entry args (0, 0x810d809, 0x80, 3) match the callee's in[]\n      exactly,\
  \ suggesting the captured context was *while the call to this helper\n      was about to happen / just happened*\
  \ -- i.e. this is the dominant path\n      through the routine.\n    - `object_getFrontDirection` (r5 -> r0/r1\
  \ side sign) -- reads battle-object\n      alliance/DirectionFlip to compute a +1/-1 facing direction multiplier.\n\
  \    - `object_setCounterTime` (r0/r5/r10) -- writes the battle-object counter\n      timer using the toolkit\
  \ (r10).\n    - `object_setFlag1` (r0/r5) -- ORs flag bits into the object's\n      CollisionData.ObjectFlags1\
  \ word.\n    - `sub_80C5578` -- a larger battle helper that takes/returns many registers;\n      likely a panel/grid\
  \ update routine called from this step.\n\n  Combined, the routine clearly: (1) holds a battle object in r5 and\
  \ the toolkit\n  in r10, (2) recomputes front direction (r5 -> object_getFrontDirection),\n  (3) highlights panels\
  \ around a base position (the snap entry args r0=0,r2=0x80,\n  r3=3 match `highlightPanelIfSomeCondition_8109660`'s\
  \ shape), (4) sets a counter\n  timer on the object, (5) sets ObjectFlags1 bits, and (6) on exit returns a\n \
  \ one-byte status in r0. Calling convention places lr=0x0810d7f0 right before\n  this function; the dispatcher\
  \ that lives there is the obvious next thing to\n  disassemble to confirm the role.\n\n  The \"story6\" tag on\
  \ the captured snapshots strongly suggests this is a\n  per-frame script step for a story-battle cut-in panel\
  \ selector / cursor\n  (e.g. a \"choose a panel to highlight/target\" or \"advance the story banner\"\n  handler\
  \ that the dispatcher at 0x0810d7f0 calls once per frame for the story-6\n  scene). Without the assembly, the\
  \ specific game-level role is uncertain.\n"
