name: sub_810D808
address: '0x0810D808'
kind: function
previous_names: []
status: hypothesis
summary: One update tick of a SnakeArm-style battle object, selecting the next panel along its arm and resetting
  the object's wait timer.
interface: (r0..r3 not meaningful, caller saves its own state; returns r1 = scratch, r5 = pointer of true owning
  battle object for the caller) -> void-like for callers
details: "Snaps from the captured-call profile: every entry comes in with r1 = 0x0810d809 (= this function + 1,\
  \ i.e. caller is passing a pool/scratch pointer with Thumb bit set), r2 = 0x80, r3 = 3, and the same lr (0x0810d7f0)\
  \ — clearly invoked from a tight per-object loop in a single caller, presumably a \"snake-arm\" or SnakeArm-like\
  \ object whose params (0x80 = Param1, 3 = Param3) identify which arm segment / step counter to advance. The callees\
  \ tell the rest of the story:\n    - object_getFrontDirection -> reads r5 (the live battle object) and returns\
  \ ±1 facing multiplier.\n    - object_setCounterTime(r0, r5, r10) -> writes the per-step counter timer on the\
  \ same object.\n    - object_setFlag1 -> sets a bit in the object's CollisionData ObjectFlags1 (likely OBJECT_FLAGS_MOVE_COMPLETE\
  \ / USING_ACTION).\n    - highlightPanelIfSomeCondition_8109660 -> takes r0..r3 (panel (x, y), sideSign, base)\
  \ and highlights matching grid panels.\n    - battle_ResetObjectTimerTo8_80C4072 -> resets the +8 (CurState) wait/counter\
  \ timer to 8 frames.\n    - sub_80C5578 -> shared per-step battle helper (the r1 = 0x0810d809 input matches its\
  \ pool pointer).\n  Reads `r5`, `r7`, `r10` and writes `r5` live, consistent with: r5 = the active battle object,\
  \ r7 = a panel/base-coordinate pair, r10 = Toolkit. Returns r0 = 0x24/0x25/0x7F depending on call (story6_0..13),\
  \ so the exit r0 encodes a \"next panel index / column choice\" — values 0x24..0x7F fit a panel column selector\
  \ or curAnim index. The whole function is one arm-step iteration that highlights the next valid panel(s), sets\
  \ the action timer, marks MOVE_COMPLETE/USING_ACTION and re-arms the 8-frame wait so the parent loop calls it\
  \ again next tick.\n"
