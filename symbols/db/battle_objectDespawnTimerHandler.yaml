name: battle_objectDespawnTimerHandler
address: '0x080BA186'
kind: function
status: probable
summary: 'Battle-object despawn step: on entry writes CurPhase=4/CurAnim=4 and sets the timer to 3, then
  on each tick decrements the timer; when it expires it disables oCollisionData_Enabled via CollisionDataPtr
  and writes CUR_STATE_DESTROY (0) into CurStateActionPhaseAndPhaseInitialized so the object is torn down.'
interface: (r5 = battle object pointer; r0 clobbered) -> void; sets oBattleObject_CurPhase/CurAnim/Timer
  on entry, state to CUR_STATE_DESTROY on expiry
details: Runs as an object update/state handler using r5 as the object, not a normal argument-passing
  call. On first entry (phase 0) it writes phase=4, anim=4, and timer=3, i.e. it kicks off the object's
  final animation. On subsequent ticks it decrements oBattleObject_Timer; once it goes negative it clears
  oCollisionData_Enabled via the object's CollisionDataPtr and writes CUR_STATE_DESTROY (likely 4) into
  oBattleObject_CurStateActionPhaseAndPhaseInitialized so the object loop tears it down. A 3-frame timer
  is very short, so this looks like a quick fade/pop-out step shared by objects that vanish without further
  scripting.
