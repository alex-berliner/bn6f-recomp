name: battle_lobbedBombStep
address: '0x080D5DC8'
kind: function
status: probable
summary: 'Per-frame update stub for the lobbed-bomb battle object: ends in destroy state when the battle
  is over, respects time-stop, otherwise dispatches into bomb-specific update logic.'
interface: (r5 = battle object) -> r0 = 0/1 from checks, discarded; no return value used; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_DESTROY on battle end
details: 'Called each frame for a battle object whose state is kept in r5. If battle_isBattleOver returns
  true it stores CUR_STATE_DESTROY into the object''s combined state/phase word, freeing the object. Otherwise,
  if battle_isTimeStop says the battle is frozen it returns without updating. Otherwise it reads oBattleObject_CurAction
  and calls through a dispatch table at off_80D5DF0, which contains a single handler, battle_lobbedBombUpdate,
  so only action 0 is valid; the tail ''mov lr, pc; bx r1'' plus following branch is the standard BL-long-call
  trampoline. Quirk: the action-indexed table has exactly one entry, so any CurAction value other than
  0 would call garbage.'
