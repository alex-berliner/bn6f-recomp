- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_isBattleOver; tst; bne -> stores CUR_STATE_DESTROY into [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    (loc_80D5DE4); bl battle_isTimeStop; bne locret skips the update while time-stop is active; ldrb r0,[r5,#oBattleObject_CurAction];
    ldr r1,[r1,r0]; bx r1 dispatches via off_80D5DF0; off_80D5DF0 contains only battle_lobbedBombUpdate+1,
