name: lookupValueForIdInTableAt_200DCA0_8002986
address: '0x08002986'
kind: function
status: confirmed
summary: Looks up an id in a 12-entry table in IWRAM at byte_200DCA0 and returns the matching entry's 32-bit payload,
  or 0 if the id is not found.
interface: u32 lookupValueForIdInTableAt_200DCA0(u32 id /* r0 */); returns payload u32 or 0; r5 preserved (also
  used internally as the table pointer), r1/r2 scratch, flags clobbered
details: 'Loads the table base from the literal pool (byte_200DCA0, in IWRAM) into r5 and scans up to 12 entries.
  Entry i stores a u16 id at base+4+i*2 and a u32 value at base+0x1C+i*4; the ids are compared as halfwords against
  the key in r0. On a match it returns the u32 payload (i.e. entries are 0x1C-4+4 = stride 4 ids packed at +4, payloads
  at +0x1C, so each record is effectively 8 bytes apart: id halfword pair plus a value word). When no entry matches
  within 12 tries it returns 0 instead of a sentinel payload, so callers presumably treat 0 as "not present" or
  id 0 is simply never a valid key with a nonzero payload. The 12-entry capacity suggests a small fixed registry
  (e.g. up to 12 tracked objects/handles with an associated value). r5 is pushed/popped only to satisfy the ABI;
  the incoming r5 value is never read.

  '
