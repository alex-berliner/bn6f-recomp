summary: Trivial stub that does nothing except return 0 in r0.
interface: int stub_returnZero(void) /* always returns 0 in r0; flags clobbered */
details: 'Saves r4-r7 and lr, clears r4, moves r4 into r0 so r0 = 0, then pops r4-r7 and pc immediately. The push/pop
  pair is pure ceremony: r4-r7 are preserved and only r0 changes, so the function behaves exactly like a nullsub
  that returns 0. No memory, struct, or I/O is touched. This is the classic shape of a feature hook or virtual-method
  slot that was stubbed out in this build (e.g. a region-specific or debug callback left in the call table). Callers
  can still rely on it clobbering the condition flags, since the tst sets them before the return.

  '
