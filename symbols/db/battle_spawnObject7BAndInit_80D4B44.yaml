name: battle_spawnObject7BAndInit_80D4B44
address: '0x080D4B44'
kind: function
status: confirmed
summary: Spawns a battle object of spawn-type 0x7B with the caller's r1-r4 as arguments and, if the spawn
  produced a non-null object, runs the basic battle-object initializer on it.
interface: void battle_spawnObject7BAndInit_80D4B44(u32 initArg0 /*r0*/, u32 spawnArg1 /*r1*/, u32 spawnArg2
  /*r2*/, u32 spawnArg3 /*r3*/, u32 spawnArg4 /*r4*/, u32 initArg5 /*r5*/, u32 r6); // clobbers r0-r3,
  lr, flags; returns caller's r5 unchanged
details: 'Wrapper around two battle-subsystem calls. It pushes the caller''s r0-r2 and r5,

  calls object_spawnType3 with r0 = 0x7B (the object/spawn type) and the caller''s

  r1-r4 as the spawn arguments; the new object pointer comes back in r5 from that

  call. It then does "mov r0, r5" and "pop {r1-r3,r5}": in Thumb the low-register

  mov is encoded as lsls rd, rs, #0 and sets the Z/N flags, so the following

  "beq" branches on the object pointer being null. If non-null, it calls

  BasicBattleObjectInitialize with r0 = the new object, r1-r3 = the caller''s

  original r0-r2, and r5/r6 passing through unchanged - i.e. the caller''s r0-r2

  are reinterpreted as initialization parameters for the spawned object. If the

  spawn failed (null pointer), the initializer is skipped and only the pop runs.

  On return, r5 holds the caller''s original r5 (restored by the pop), so despite

  the register contract listing r5 as an output, it is effectively pass-through.

  No memory structures are touched directly by this function; it only orchestrates

  the spawn and init calls. No caller of record was visible in the provided snippet,

  so the actual meaning of spawn type 0x7B (which battle entity it creates) is

  inferred only from the shared spawn/init pattern, not identified.

  '
