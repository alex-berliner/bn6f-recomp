name: ow_cutsceneLoadEntry
address: '0x08099164'
kind: function
status: confirmed
summary: 'Loads and applies one overworld cutscene entry: decompresses its text archive, advances the sequence index,
  and optionally repositions the player and camera based on the entry''s flag byte.'
interface: s32 ow_cutsceneLoadEntry(u32 context /* r5, cutscene state struct ptr */); /* returns 0, sets Z; preserves
  r4-r7 */
details: 'Reads the current entry index from context+6, multiplies by 0x14 to select a 20-byte record from the static
  cutscene table at byte_8098E9C. If the record''s first word (archive pointer) is non-null, calls DecompressTextArchiveForCutscene
  and stores the result at context+0x30. Advances context+6 to the ''next entry'' byte stored at table record+4.
  If bit 0 of the flags byte at record+7 is set, executes a player/camera setup block: sets facing direction from
  record+5, selects a fixed animation from record+5+record+6, sets player XYZ from signed shorts at record+8/+10/+12
  (shifted left 16 for 16.16 fixed-point), zeroes a camera aux field via camera_writeUnk03_14, sets camera XYZ from
  signed shorts at record+14/+16/+18, and clears event flag 0x17 (EVENT_EVENT_CUR_DIR_LOCKED). Regardless of the
  flag gate, stores bit 7 of the flags byte into context+8 as the direction-lock indicator. Returns 0 so the caller
  sees Z set. r10 is passed in by the caller (likely a global or table base) but is not directly used here.'
