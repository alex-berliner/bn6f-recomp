    archive ref stored in the scene struct; bl SetOWPlayerFacingDirection / owPlayer_setS200ace0_fixedAnimationSelect
    / owPlayer_indirectlySetPlayerCoordsMaybe — entry bytes drive initial player placement; bl camera_writeUnk03_14_80301b2(0)
