open_questions:
- What is the layout of the 20-byte cutscene table record beyond the fields identified (archive ptr, next-index,
  flags, facing, anim offset, player pos, camera pos)? Are there more entries in byte_8098E9C and how many?
- What does context+8 (direction-lock indicator) control downstream—does the caller or another system read it to
  block player movement?
- Why does the caller pass r10 in if this function never reads it?
- Is DecompressTextArchiveForCutscene writing to a fixed RAM buffer, and does context+0x30 pointer get consumed
  by the chatbox/text-display subsystem?
- The event flag 0x17 is cleared here—does setting it elsewhere (before cutscene starts) lock facing during scripted
  sequences, and is bit 7 of the flags byte the signal to keep or release that lock?
