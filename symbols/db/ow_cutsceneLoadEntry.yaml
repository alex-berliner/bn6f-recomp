name: ow_cutsceneLoadEntry
address: '0x08099164'
kind: function
status: probable
summary: 'Loads a cutscene setup entry by ID: resolves its text archive and, if flagged, places the player
  (facing, animation, coords) and camera for the scene start.'
interface: (r5 = cutscene state struct, cutscene entry id at +6) -> r0 = 0; writes text archive ptr to
  +0x30, entry byte to +6, bit7 of entry flags to +8
details: Reads an entry id from r5+6 and indexes a 20-byte-per-entry table at byte_8098E9C. If the entry's
  first word is nonzero it is treated as a (possibly compressed) text archive pointer, decompressed via
  DecompressTextArchiveForCutscene and stored at r5+0x30. Entry byte 4 is copied back to r5+6 (advancing/selecting
  the id). If entry byte 7 bit0 is set, it sets the player's facing direction (entry byte 5), a fixed
  animation select (bytes 5+6), player x/y/z (entry halfwords 0x8/0xA/0xC), zeroes a camera field via
  camera_writeUnk03_14_80301b2, sets camera x/y/z (entry halfwords 0xE/0x10/0x12), and clears EVENT_EVENT_CUR_DIR_LOCKED.
  Finally bit7 of entry byte 7 is stored to r5+8 (likely a 'has setup' or continue flag) and the function
  always returns 0.
