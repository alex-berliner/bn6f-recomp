name: object_freeWithCollision
address: '0x080CF324'
kind: function
status: probable
summary: Destructor that releases a battle object's collision slot and then frees the object itself.
interface: (r5 = battle object pointer) -> r0 = destroyed; clobbers lr/flags via calls
details: Takes the object from r5 ( Thumb convention for this engine's object routines), loads its collision-data
  pointer from offset 0x54, and calls object_freeCollisionData to disable that collision slot and clear
  its active bit. Then it unconditionally calls object_freeMemory, which clears the object's flags, frees
  its type's bitmap slot, unlinks it from the active-object list, and resets sprite scaling. It is essentially
  a two-step teardown used where an object owns collision data at 0x54.
