name: battle_objectSetStateActionPhase8
address: '0x080C44C8'
kind: function
status: probable
summary: If the given battle object exists, force its current state-action phase field to 8 (a fixed phase
  value, presumably despawn/remove), clearing the phase-initialized bit.
interface: (r0 = battle object pointer, may be NULL) -> void; no return value, flags clobbered
details: 'A guard-setter: tst r0, r0 skips NULL objects, otherwise it stores the immediate 8 into the
  packed oBattleObject_CurStateActionPhaseAndPhaseInitialized field. Because the packed field also carries
  the phase-initialized flag, writing 8 resets that flag so the object''s phase-8 state action runs fresh.
  It is only ever invoked from the battle-object detachment family (detachRelatedObject2 and its neighboring
  thunks), consistent with using phase 8 as the teardown/despawn phase for related objects. No other structures
  or fields are touched.'
