name: sub_813BF1C
address: '0x0813BF1C'
kind: function
status: confirmed
summary: Returns 1 if event flag 0x1720 is set, 0 otherwise, leaving it for the caller to branch on via NZ (the
  dead EVENT_1723 test in the assembly is never reached).
interface: void eventFlag1720IsSet_813BF1C(void); // r4-r7 preserved; result is in NZ (R0 = 0/1); clobbers R0-R3,
  LR, C, V
details: 'Loads R6=1, then calls TestEventFlagFromImmediate for the 16-bit flag 0x1720 (passed

  split as R0=0x17, R1=0x20 per the EventFlag 16-bit convention). If the flag is set (!Z)

  it jumps past a label; if clear it falls into loc_813BF36 which clears R6 to 0. Then

  moves R6 into R0 and tst''s it, so NZ reflects 1 vs 0.

  The intermediate block (movflag EVENT_1723, TestEventFlagFromImmediate, bne loc_813BF38)

  sits between the bne loc_813BF38 and loc_813BF36 in the listing but is unreachable: the

  only path into it is via the b loc_813BF38 which is unconditional from the BNE branch —

  the disassembly comment notes this as a fused-out/dead region. So in game terms only

  flag 0x1720 matters here.

  R10/LR are listed as inputs by the lifter because of the call into the helper; r4/r5/r6/r7

  are preserved across the call (the helper does not touch them). Caller convention reads

  NZ and consumes R4/R5 as scratch from the helper''s frame.

  '
