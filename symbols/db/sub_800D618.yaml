name: sub_800D618
address: '0x0800D618'
kind: function
status: confirmed
summary: Returns 1 only when the panel the object stands on has its type/status byte equal to a requested value
  and that byte differs from the panel's alliance byte.
interface: bool object_checkPanelTypeMatchesValue(object* obj /*r0*/, u32 panelArg /*r1*/, u8 expected /*r2*/);
  r4 must hold caller's value and is preserved (passed through as context); returns 0/1 in r0; clobbers nz, c/v
  state as left by object_getPanelDataOffset on the no-panel exit
details: 'Saves r2 into r4 (also preserving it for the caller) and calls object_getPanelDataOffset to fetch the
  panel data for the panel the object (r0, with r1 as an argument) currently occupies. If there is no panel data
  (r0 == 0) it returns 0 immediately, leaving r1/r2 and the flags exactly as the callee left them. Otherwise it
  loads the panel''s byte at oPanelData_Unk_04 and its oPanelData_Alliance byte and returns 1 only if both hold:
  Unk_04 != Alliance, and Unk_04 == the requested value (r2). This reads like a "is this panel of type X, but not
  one claimed by the panel''s alliance" test, likely used for panel-type-dependent battle effects (grass/ice/poison/cube-style
  checks that shouldn''t count on panels already owned/aligned). The alliance-vs-type comparison is odd enough that
  the semantic of oPanelData_Unk_04 is not settled.

  '
