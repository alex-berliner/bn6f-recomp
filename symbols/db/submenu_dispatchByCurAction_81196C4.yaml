summary: Submenu object action dispatcher — reads `oBattleObject+9` (CurAction) and jumps through a small
  thunk table to one of the submenu sub-actions (panel chip info, generic step, NPC chain state, sprite
  zoom-shrink), then calls `sprite_setUnk0x2cFromLoader_81198E8` to store the sprite's `0x2C` loader addr.
interface: '(r5 = battleObjectPtr, r10 = toolkit, lr = return) -> r0 = 0x40000000 ; side effects: dispatches
  to one of 5 submenu action handlers; sprite unk0x2c is written by the `sprite_setUnk0x2cFromLoader`
  follow-up.'
details: "- `push {lr}`; load the dispatch table base via `off_81196D8 -> [off_81196DC]` (a pointer to\
  \ a 5-entry table of `{func+1}` targets, Thumb-bit-set so `bx` works).\n  - `ldrb r1, [r5, #9]` reads\
  \ `CurAction` (offset 0x9 in `oBattleObject`/`OverworldNPCObject` etc.).\n  - `ldr r0, [r0, r1]` indexes\
  \ the table by CurAction; `mov lr, pc; bx r0` tail-dispatches to the chosen submenu update sub-function.\n\
  \  - Four of the five slots resolve to known helpers: `submenu_updatePanelChipInfoIfDirty_81196F0`,\
  \ `sub_8119730`, `sub_811974C`, `npc_stepChainSetState0x10_811975C`, `sprite_stepZoomShrinkOut_811976C`.\n\
  \  - The `bl sprite_setUnk0x2cFromLoader_81198E8` placed right after the table in this function appears\
  \ to actually belong to that region (likely written here by the assembler as a placeholder; the live\
  \ call lives inside `0x081196E0`-ish code). It writes the sprite's `+0x2C` loader address based on whether\
  \ `oBattleObject+0xC` is `0xFF` (use `0x40000000` base) or `0` otherwise.\n  - Exit value `r0 = 0x40000000`\
  \ and `----` flags are seen on every captured call (the `bl sprite_setUnk0x2cFromLoader` is what writes\
  \ that base address into r0 before returning).\n"
