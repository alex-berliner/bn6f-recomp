name: ai_setupAttackVars
address: '0x08012278'
kind: function
status: confirmed
summary: Fills the AI's attack-variables struct with fixed default values (damage 10, extra damage 0x8A, init flag
  4, boost 6, timer 6) and returns 9.
interface: u32 ai_setupAttackVars(struct AIAttackVars *vars /* r7 */); returns 9 in r0; clobbers N/Z flags
details: "Takes a pointer in r7 to the AI attack-variables block (oAIAttackVars_* fields, presumably part of\nthe\
  \ per-entity/battle AI state) and writes a fixed set of defaults:\n  - halfword oAIAttackVars_Damage       = 0x0A\
  \ (base damage 10)\n  - halfword oAIAttackVars_ExtraDamage  = 0x8A (large extra-damage value; note 0x8A is > signed\
  \ char range, stored as halfword)\n  - byte   oAIAttackVars_InitFlag       = 4\n  - byte   oAIAttackVars_AttackBoost2\
  \   = 6\n  - byte   oAIAttackVars_TimerOrCycles  = 6\nIt is a pure initializer: it reads nothing from the struct\
  \ and touches no other memory or I/O.\nThe function ends with mov r0,#9, so it always returns the constant 9,\
  \ which callers apparently\nuse as a next-state/return code (the flag-setting NZ on r0 is likely incidental, from\
  \ the mov).\nThe hard-coded values suggest one specific AI attack pattern whose numbers were tuned by hand;\n\
  other similar setup functions presumably exist with different constants.\n"
