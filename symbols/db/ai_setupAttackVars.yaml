summary: Initializes the AI attack-vars block for an attack (damage 10, extra damage 138, boost 6, timer
  6) and returns state 9.
interface: (r7 = entity AI attack-vars struct) -> r0 = 9 (state/phase code); fields Damage=10, ExtraDamage=138,
  InitFlag=4, AttackBoost2=6, TimerOrCycles=6 written
details: 'Takes the per-entity AI attack parameter struct in r7 and stores a fixed set of constants into
  its fields: Damage=0xA, ExtraDamage=0x8A (138), InitFlag=4, AttackBoost2=6, and TimerOrCycles=6. It
  then returns the constant 9 in r0, which is most likely a state/phase selector consumed by an AI state
  machine rather than a status code. The struct offsets match the project''s oAIAttackVars_* layout. No
  callees and no known caller, so which boss/attack this configures (routes battlesweep/beastsp suggest
  a boss AI step) is not directly visible.'
