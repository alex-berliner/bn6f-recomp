name: sub_810DA4C
address: '0x0810DA4C'
kind: function
status: confirmed
summary: AI step that picks a movement-target X for a battle object by probing the front tile and locating the opposing-side
  object.
interface: void ai_selectMovementTarget_810DA4C(void) /* r5 = battle object, r6 = AI state, r10, lr in; r1 = range
  lo, r5 preserved out; clobbers r0,r2,r3,lr,NZCV */
details: 'Battle-object AI helper. Reads the object''s facing via object_getFrontDirection and

  adds it to oBattleObject_PanelX to get the panel one step ahead; together with

  oBattleObject_PanelY and the ExtraVars+4 word it calls sub_8109708 (panel-validity

  / walkability check). If that returns non-zero the front tile is blocked, it writes

  0xC into oAIState_Unk_00 of the r6 AI-state struct and aborts. Otherwise it XORs

  oBattleObject_Alliance with 1 to get the opposing side and calls sub_80103F8 to

  resolve that side''s battle object (r4). It stashes r4[0x13] into oAIState_Unk_05.

  A second call to object_getFrontDirection provides a step offset d; with

  ExtraVars[0] as a multiplier it builds a target X range [px+min(d, d*extra0), px+max(d, d*extra0)].

  It then compares r4[0x12] (enemy''s panel X) to that range: if the enemy sits inside

  the range it stores px (our column) into oAIState_Unk_04, otherwise enemy_x - d*extra0.

  Finally oAIState_Unk_02 is set to 4. r1 is returned as the low end of the range.

  Preserves r4..r7; clobbers r0,r2,r3,lr,NZCV.

  '
