name: TestCutsceneFlag
address: '0x080385E0'
kind: function
status: confirmed
summary: Tests whether a numbered cutscene flag is set in the current cutscene state's flag word, returning
  the result in the Z flag.
interface: u32 TestCutsceneFlag(u32 flagNumber /*r0*/, struct CutsceneState *state /*r5*/); returns flag
  word in r0, Z clear iff flag set (N also from mask result), C from the shift barrel shifter; r1 preserved
details: 'Builds the mask 1 << flagNumber in r1 (the barrel shifter''s carry output is reproduced: shifting
  1 left clears C, a shift count of 32 leaves C set, count 0 leaves C untouched) and TSTs it against the
  cutscene flag word loaded from [r5 + oCutsceneState_CutsceneFlags]. Callers branch EQ (flag clear) /
  NE (flag set) on the result. Note the polarity: the Z flag is CLEAR when the flag is set, since TST
  sets Z only when (flagWord & bit) == 0. r0 returns the entire flag word rather than a 0/1 boolean, so
  callers wanting a value should test the bit themselves or mask it. Flag numbers >= 32 yield a zero mask,
  so they always read as "clear". r1 is pushed/popped only to preserve it across the mask computation.'
