name: ai_attackEndDelay
address: '0x080EE274'
kind: function
status: probable
summary: 'AI attack-state wind-down: waits 5 frames, then clears the attack-object references and exits
  the attack state.'
interface: (r0 = unused scratch, r7 = battle object AI vars, r5 = battle object) -> r0 = clobbered; no
  meaningful return
details: If oAIAttackVars_AttackElement is 0, it first sets the element to 4 and a 5-frame timer in oAIAttackVars_StepTimer.
  It then decrements StepTimer each call; while the result is still >= 0 it returns, delaying the attack
  teardown. Once the timer lapses, it nulls oBattleObject_RelatedObject1Ptr and the oAIData_TempAttackObjectPtr
  field of oBattleObject_AIDataPtr, then calls object_exitAttackState to leave the attacking state. The
  trailing word 0x1906 is presumably data for the adjacent table, not this routine. This reads like the
  end-of-attack linger phase of an enemy AI attack script.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: sets AttackElement=4 and StepTimer=5 only when element was 0 (loc setup at top); decrements
    oAIAttackVars_StepTimer and loops via bge locret_80EE298 until it goes negative; stores 0 to [r5,#oBattleObject_RelatedObject1Ptr]
    and [r1,#oAIData_TempAttackObjectPtr] on timer expiry; tail call object_exitAttackState matches ending
    the AI attack state; no callers known, but field layout matches the AI attack-handler family writing
    oAIAttackVars_*
