name: battle_panelAuraPhase
address: '0x080D90C8'
kind: function
status: probable
summary: Battle-object phase that alternates between two collision-region IDs every 8-frame pass while
  Timer2 is nonzero, spawning the region and calling sub_801BD3C (0x3D panel effect), then clears the
  region and destroys itself when Timer2 expires.
interface: (r5 = battle object) -> void; sets oBattleObject_Timer=8 and phase=4 to continue, or state=CUR_STATE_DESTROY
  when Timer2 reaches 0
details: Each invocation selects one of two packed parameter words (0x405FF09 or 0x405FF0B) based on bit
  1 of oBattleObject_Timer2, passing it on the stack to object_spawnCollisionRegion along with PanelX,
  PanelY, Element and 0x1000. It then calls sub_801BD3C with PanelX, PanelY, r2=0x3D, r3 = low byte of
  the chosen word (0x09 or 0x0B), r4 = Alliance and r7=0xA0000, likely dealing damage or spawning a hit/effect
  tied to the collision region. Timer2 acts as a lifetime counter, decremented once per pass; while nonzero
  the object waits 8 frames (Timer=8, phase=4) and repeats, alternating the 9/11 parameter each pass.
  On expiry it calls object_clearCollisionRegion to remove the region and sets its state to CUR_STATE_DESTROY.
  The two alternating parameter IDs suggest a two-stage or alternating panel effect.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'lsr/bcc on oBattleObject_Timer2 bit 1 selects dword_80D9118 vs dword_80D911C (0x405FF09/0x405FF0B)
    pushed as spawnCollisionRegion''s stack arg; object_spawnCollisionRegion called with oBattleObject_PanelX/Y,
    Element, r3=0, r4-word, 0x1000; sub_801BD3C called with PanelX, PanelY, 0x3D, (word&0xFF)=9|11, Alliance,
    0xA0000; ldrh Timer2; sub #1; beq -> object_clearCollisionRegion then CUR_STATE_DESTROY; otherwise
    Timer=8, phase=4'
