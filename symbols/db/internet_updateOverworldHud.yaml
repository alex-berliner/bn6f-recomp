name: internet_updateOverworldHud
address: '0x08033B30'
kind: function
status: probable
summary: 'Per-frame update/draw of the Internet-overworld HUD: HP digits, battle-start overlay, alert
  beep, and map name.'
interface: () -> (); preserves registers, no return value; r5 already points at the S2011E30 Internet-UI
  state
details: 'A stub that calls, in order: internet_drawHpDigits (draw PET HP as 4 OAM digits), battle_drawBattleStartOverlay
  with r0=1, internet_tickAlertSoundTimer (periodic SFX 0x9A), and RenderMapName. It has no own state
  and takes no arguments; the callees operate on the shared Internet-UI struct in r5 (S2011E30), so this
  is the frame driver for that state. The r0=1 argument to the overlay draw presumably selects the ''show''
  variant of the battle-start frame queue.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'body is only four BLs to Internet-overworld UI routines (0x08033B30-0x08033B2E); callee internet_drawHpDigits_8033E0C
    draws PET HP OAM digits in the Internet overworld UI; callee internet_tickAlertSoundTimer decrements
    a timer in the Internet-overworld UI state; callee RenderMapName_8033EE8 renders the map name, another
    overworld HUD element; comment ''(self: * S2011E30 $r5)'' shows callees share one Internet-UI state
    struct'
