name: battle_incrementAllianceStatOnCollisionHit_801A6B4
address: '0x0801A6B4'
kind: function
status: confirmed
summary: When the given battle object registers a collision hit, increments its alliance navi stat at offset 0x18
  by one, capped at 7.
interface: void battle_incrementAllianceStatOnCollisionHit(BattleObject *obj /* r5 */); clobbers r0-r3, flags; preserves
  r4 (caller's collision-data pointer restored)
details: 'Loads the object''s collision data pointer from oBattleObject_CollisionDataPtr into r4 and calls

  sub_801A6E8 to test for a hit. If no hit (r0 == 0), returns immediately. On a hit it reads

  offset 0x18 of the object''s alliance stats via GetBattleNaviStatsByte_AllianceFromBattleObject,

  adds 1, saturates the result at 7 (values above 7 become 7), and writes it back with

  SetBattleNaviStatsByte_AllianceFromBattleObject (byte index 0x18 in r1, new value in r2).

  The cap of 7 suggests the byte is a small level/charge counter with 8 states (0..7), such as

  an attack-power or gauge level that builds up each time this object lands or takes a hit.

  Note the object pointer arrives in r5 (not a normal C argument slot) and r4 is saved/restored

  around the call because sub_801A6E8 uses it as its collision-data input.

  '
