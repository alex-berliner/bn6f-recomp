name: sub_80FD7D4
address: '0x080FD7D4'
kind: function
status: confirmed
summary: Ticks down an AI attack-related counter on the battle object; on expiry, clears the 0x40 object flag, sets
  the "currently moving" flag, and resets a sibling AI attack variable to 0xC.
interface: void aiAttack_tickTimerOrFinish_80FD7D4(u32 r5, BattleObject* r7); /* clobbers r0,r2,lr; out r1; NZCV
  */
details: 'Reads the u16 counter at `r7 + oAIAttackVars_Unk_10`, decrements it, stores back, and checks the

  NZ flags. While the counter remains > 0 the routine returns immediately. When the counter

  reaches 0 (or underflows): calls `object_clearFlag(0x40)` to drop that bit on the object,

  calls `object_setFlag1(1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)` to mark the object as

  currently moving, then writes the constant 0xC into `r7 + oAIAttackVars_Unk_00`. The two

  fields at offsets `oAIAttackVars_Unk_00` and `oAIAttackVars_Unk_10` are part of an opaque

  `AIAttackVars` blob hung off the battle object; the constant 0xC paired with the

  `oAIAttackVars_Unk_10` countdown suggests this is a small state machine gating an AI attack

  animation/execution (counter expires → object transitions to "moving" phase, possibly

  starting a slide/teleport step governed by `Unk_00 = 0xC` ticks).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
