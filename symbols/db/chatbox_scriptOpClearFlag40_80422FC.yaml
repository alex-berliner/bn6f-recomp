name: chatbox_scriptOpClearFlag40_80422FC
address: '0x080422FC'
kind: function
status: confirmed
summary: Chatbox script opcode handler that clears chatbox status flag 0x40 and resumes script execution.
interface: void chatbox_scriptOpClearFlag40(u8* scriptPtr in r4); returns Next=1 in r0 (continue script), r4 = scriptPtr
  + 2; N/Z set from r0, C/V from the pointer increment
details: One of the chatbox script interpreter's opcode handlers. It calls chatbox_clearFlags_3e with mask FLAGS_3E_UNK_0040
  (0x40) to clear that bit in the chatbox status flags field, then advances the script pointer in r4 by 2 bytes
  (opcode + no operands, or operand consumed elsewhere), and returns 1 in r0, the chatbox interpreter's "keep running"
  result. r1 and r5 appear in the caller contract only as caller context/scratch, not as meaningful inputs. The
  meaning of status flag 0x40 is not identified from this function alone.
