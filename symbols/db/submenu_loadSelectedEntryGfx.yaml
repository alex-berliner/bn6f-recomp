name: submenu_loadSelectedEntryGfx
address: '0x08089244'
kind: function
status: probable
summary: 'Menu cursor-move handler: copies the selected entry''s 0x80-byte record into a work buffer,
  decompresses its display graphics into VRAM, and plays the cursor-move sound effect.'
interface: (r0 = selected entry index into table byte_87DE44C, stride 0x80) -> r0 destroyed; loads 0x20
  words to byte_30016F0, LZ77 asset to VRAM 0x6014800, plays SOUND_MENU_CUR_MOVE
details: r0 is an index that is multiplied by 0x20 (giving a 0x80-byte stride) and offset against the
  table at byte_87DE44C; 32 words from that record are CopyWords'd into the work buffer at byte_30016F0.
  It then calls decompAndCopyData with a hardcoded init-ref entry pointing at unk_87DDD4C with destination
  0x6014800 (VRAM) and size/mode word 0x700, so a shared compressed graphic is reloaded into VRAM regardless
  of selection. It finishes by playing SOUND_MENU_CUR_MOVE, the standard menu cursor-move blip. The record
  copied to 30016F0 likely holds per-entry display/text parameters consumed elsewhere. r4-r7 are pushed
  but unused — likely a compiled with-prologue artifact.
