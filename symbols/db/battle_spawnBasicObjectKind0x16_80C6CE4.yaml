name: battle_spawnBasicObjectKind0x16_80C6CE4
address: '0x080C6CE4'
kind: function
status: confirmed
summary: Spawn wrapper that creates a type-3 battle object of kind 0x16 and runs the basic battle-object initializer
  on it.
interface: (u32 arg0, u32 arg1, u32 arg2) -> new battle object pointer (spawn routine delivers it in r5; on the
  spawn-failure path r0 returns 0; register contract also marks r1-r3 as read back by callers)
details: 'Thin helper over object_spawnType3 with the object kind hardcoded to 0x16.

  It saves the three incoming arguments (r0-r2) plus the incoming r5 on the

  stack, calls object_spawnType3 with r0=0x16, and receives the newly created

  object pointer back in r5 (the type-3 spawn convention). If the pointer is

  non-NULL it calls BasicBattleObjectInitialize with r0 = new object,

  r1-r3 = the original arguments (recovered from the stack shifted one slot

  by the pop {r1-r3,r5}), then r3 is forced to 0 by the mov before the call

  actually executes — wait, the mov r3,#0 happens after the pop, so the

  fourth initializer argument is always 0, overriding the popped arg2.

  Reading the assembly order carefully: pop {r1-r3,r5} loads r1=arg0,

  r2=arg1, r3=arg2, then ''mov r0, r5'' precedes the beq, and ''mov r3, #0''

  executes only on the non-null path just before BasicBattleObjectInitialize,

  so the initializer is always called as (newObject, arg0, arg1, 0).

  If the spawn returned NULL, the function returns with r0 = 0 and skips

  initialization. r4-r7 and lr are preserved per the contract (r4-r6 pushed

  implicitly by the shifted-pop trick is only r0-r2,r5; r4-r7 survive because

  the callee-saved set is untouched apart from r5, which is restored).

  Quirk: the push {r0-r2,r5} / pop {r1-r3,r5} pairing deliberately shifts the

  saved arguments by one stack slot so they land directly in the argument

  registers r1-r3 for the initializer call.

  '
