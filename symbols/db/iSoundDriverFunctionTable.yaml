name: iSoundDriverFunctionTable
address: '0x03005570'
kind: data
status: probable
summary: 'Proposed name: iSoundDriverFunctionTable. IWRAM function-pointer table used by the CGB sound
  driver and its player initialization wrapper. (table of function pointers)'
details: The table is patched during CGB sound-driver initialization, including entries at offsets +0x20,
  +0x44, and +0x4c. soundInit passes its address to sub_814E09C and stores that same address in the music-player
  structure at offset +0x34. sub_814FD74 dereferences the first pointer and passes it to rfu_callFuncByPtr_814DA68.
  The visible sites establish its role as a shared function-pointer table, but do not identify every entry.
