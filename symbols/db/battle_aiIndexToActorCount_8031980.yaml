status: probable
summary: Returns the per-actor count for an AI sub-state (3 for AIIndex 1, else 2).
interface: (r0 = AIIndex selector) -> r0 = 2 or 3 ; clobbers r5, flags
details: "Pushes lr (tail-call pattern via pop {pc}). Loads a constant dword_2013940 into r5 but\n  never\
  \ uses it before returning, so it's effectively a dead load (or a planned hook slot).\n  Compares r0\
  \ against 1; if equal, returns 3, otherwise returns 2. The captured calls all\n  pass r0=1 and exit\
  \ with r0=3 and the C flag set (from the `mov r0,#3` immediately before\n  `pop {pc}`), matching the\
  \ assembly exactly.\n  Called by 9 sibling thunks spaced 0x18 bytes apart (0x0803199E..0x08031A5E) which\
  \ look\n  like a dispatch/jump table; each passes a different AIData sub-state selector plus r5,\n \
  \ and the value returned (2 or 3) is then used as an init selector downstream.\n"
