- method: assembly-reading
  date: '2026-10-14'
  detail: '- asm `cmp r0, #1; beq loc_803198A; b loc_803198E` shows a 1-vs-not-1 branch. - asm `mov r0,
    #3 / mov r0, #2` then `pop {pc}` shows the return value and tail-call form. - All 6 captured calls
    enter with r0=1 and exit with r0=3, consistent with the AIIndex==1 path. - Caller sub_8031A5E is hypothesized
    to be a type-3 AI init helper, fitting a "count of actors" return. - r5 is loaded with dword_2013940
    but never read; this is likely an unused thunk or hook placeholder.'
