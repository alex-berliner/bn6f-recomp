interface: void sub_802869E(int r2 /* forwarded to sub_802868C, untouched */); returns with r1=0x6009B60 and r3=3
  from the last call setup
details: 'Three successive calls to sub_802868C, each with r0 = compressed/raw graphics source, r1 = VRAM destination,
  r3 = sheet slot index: 1) byte_802A6C0 -> 0x6009AA0 (slot 1), 2) byte_802A680 -> 0x6009AE0 (slot 2), 3) byte_802A6C0
  again -> 0x6009B60 (slot 3). Note the same graphics blob byte_802A6C0 is uploaded twice, into two different VRAM
  destinations (slots 1 and 3), suggesting one sheet is reused/modified in place or is shared between two tile blocks.
  The caller''s r2 is never set here and is preserved through the calls, so sub_802868C sees the caller''s r2 as
  an extra argument (likely a size, mode, or palette parameter). Trashes r0, sets r1/r3 as described; flags clobbered.

  '
