name: battle_beastOutTransformAdvanceTimers
address: '0x08118794'
kind: function
status: probable
summary: 'Advances the two frame timers (0xB6 and 0x2F) of the beast-out transform effect toward their
  targets via sub_8118320, and returns the count of timers that reached it (0-2) with flags set by a final
  cmp against #2.'
interface: (r0 = unused/0) -> r0 = count (0-2) of timers that reached their target; flags clobbered by
  calls
details: 'Fetches the transform effect''s work struct via sub_81187DC, then twice calls sub_8118320(target,
  counter): first with target 0xB6 (182) against the halfword at +0xC, then target 0x2F (47) against +0xE,
  storing each result back as a halfword. sub_8118320 evidently increments/wraps the counter toward the
  target, so equality after the call means the timer finished; each finished timer bumps a local counter
  on the stack. The return value is that count (0-2), letting the caller (battle_beastOutTransformUpdate)
  know when both the long scroll timer and the short timer have expired. Note the return value is the
  raw count in r0, not a boolean; no flag-setting compare before the pop.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl sub_81187DC then ldrh r1,[r7,#0xC] / bl sub_8118320 / strh r0,[r7,#0xC] — read-modify-write
    of a timer field; cmp r0,#0xB6 / bne skip / increment [sp,#4] — equality with target marks that timer
    done; second block repeats the pattern with 0x2F against [r7,#0xE]; final ldr r0,[sp,#4]; cmp r0,#2;
    pop — returns how many of the two timers completed; sole caller battle_beastOutTransformUpdate is
    the per-frame beast-out transform effect, matching a timing/wait helper
  refs:
  - bn6f/asm/asm32.s:21694
  - 0x08118510 battle_beastOutTransformUpdate
  - 0x08118320 sub_8118320
  - 0x081187DC sub_81187DC
  reproduce: python3 tools/asmcat.py 0x08118794
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s mechanics: it calls sub_81187DC, then sub_8118320 twice with targets
    0xB6 (+0xC) and 0x2F (+0xE), bumping a stack counter on equality. However, the function does not simply
    return the count: at loc_81187D2 it loads the count, subtracts/compares against #2 (which is a flag-setting
    test), and then pops, so it returns via pop {pc} with r0 = count and flags set from cmp r0,#2. The
    proposal overstates the interface (''count 0-2 returned, not boolean, no flag-setting compare'');
    the final cmp r0,#2 before the pop does set flags. The name and summary are otherwise accurate.; run
    wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
