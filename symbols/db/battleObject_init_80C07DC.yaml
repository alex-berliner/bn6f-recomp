status: probable
summary: Initializes a battle object's per-spawn sprite setup (decompress, load, animate, palettize) then
  chains into its first update tick.
interface: '(r5 = BattleObject*) -> void ; side effects: writes BattleObject header flags, sprite state,
  Z, palette, color shader, and CurStateActionPhaseAndPhaseInitialized; returns via sub_80C0840'
details: "1. Calls sprite_decompressTemp(0x0C, 0x50) to ensure the sprite-decompression buffer is ready.\n\
  \  2. Sets OBJECT_FLAG_VISIBLE (0x02) on the object's Flags byte at oObjectHeader_Flags.\n  3. Loads\
  \ the object's normal sprite via sprite_load(0x80, 0x0C, 0x50) and tail-calls sprite_loadAnimationData\
  \ to populate its animation script.\n  4. Enables shadow rendering via sprite_hasShadow and resets CurAnim/CurAnimCopy\
  \ at offsets 0x10/0x11 to 0.\n  5. Sets animation 0 via sprite_setAnimation(0), reloads animation data,\
  \ then recomputes X/Y from the current panel via object_setCoordinatesFromPanels.\n  6. Zeros the Z\
  \ field at oBattleObject_Z (0x3C..0x3F), applies object_getFlip into sprite_setFlip so the sprite mirrors\
  \ according to side.\n  8. Picks palette index 1 only when Param1 == 4, else 0, and stores it via sprite_setPalette;\
  \ sets the color-shader id to 0x7FFF (palette-mask disable) via sprite_setColorShader.\n  9. Writes\
  \ CUR_STATE_UPDATE (0x04) into CurStateActionPhaseAndPhaseInitialized (0x08..0x0B) and tail-calls sub_80C0840\
  \ to run the per-action update and end-of-tick sprite flush.\nevidence: |\n  - `sprite_decompressTemp(0x0C,\
  \ 0x50)` is the standard sprite-decompression buffer init (`bl sprite_decompressTemp`).\n  - `orr r0,\
  \ r1` with r1=#2 against `[r5,#oObjectHeader_Flags]` sets OBJECT_FLAG_VISIBLE.\n  - `sprite_load(0x80,\
  \ 0x0C, 0x50)` selects sprite id 0x80 of the loaded object.\n  - `strb r0,[r5,#oBattleObject_CurAnim]`\
  \ and `[r5,#oBattleObject_CurAnimCopy]` reset animation state.\n  - `str r0,[r5,#oBattleObject_Z]` zeros\
  \ the 32-bit Z field (offset 0x3C).\n  - Palette branch `cmp r1,#4; bne loc_80C0828; mov r0,#1` shows\
  \ palette 1 is only chosen for Param1==4.\n  - `ldr r0,dword_80C083C` = 0x7FFF, fed into sprite_setColorShader,\
  \ is the conventional \"no shader\" mask.\n  - `CUR_STATE_UPDATE` (=0x04) literal store at `[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]`\
  \ transitions from init phase to update phase.\n  - Tail `bl sub_80C0840` hands off to the per-state\
  \ dispatcher; sub_80C0840's summary explicitly says \"shared end-of-update processing\".\n"
