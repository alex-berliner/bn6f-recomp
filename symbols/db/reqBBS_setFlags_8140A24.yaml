name: reqBBS_setFlags_8140A24
address: '0x08140A24'
kind: function
status: confirmed
summary: Bulk-sets the request-board (BBS) event flag ranges in event word 0x16 and always returns success.
interface: void reqBBS_setAllBoardFlags_ADDRESS(void) -> (r0 = 0, flags NZ from r0); clobbers r1-r3; preserves r4,
  r5
details: 'Takes no real input despite the caller contract listing r4/r5/r10 (they are preserved, not used). Calls
  SetEventFlagRangeFromImmediate twice: first with entryIdx=0x16, byteFlagIdx=0x40, count=0x40 (EVENT_1640), then
  entryIdx=0x16, byteFlagIdx=0xC0, count=0x10 (EVENT_16C0). Together these mark the full 0x50 request-board flag
  slots of event word 0x16 as set, i.e. flags every board request entry as done/read in one go. Padded with two
  zero bytes after pop {pc}. Always returns 0 in r0 and sets the NZ flags from it.

  '
