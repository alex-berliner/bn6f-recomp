name: battle_redrawCommandMenuWindow_801E1A4
address: '0x0801E1A4'
kind: function
status: confirmed
summary: Redraws the battle command-menu window frame (narrowed while the custom screen is open), clears battle
  flag 0x100, and advances the menu state if the battle is still running with the custom screen closed.
interface: void sub_801E1A4(BattleWork* work /* r5 */); preserves r4-r6; returns callee-side r0-r3 and flags (cmp
  results, or dispatch_801DA48's flags on the dispatch path)
details: 'r5 points at the battle work struct; byte [r5+0xC] selects the menu layout: value 2 means the custom screen
  is open, in which case a shift of 6 is used, otherwise the shift is 0. The window-drawing helper call_sub_3005EBA
  is then invoked with left = 7 + (shift >> 1), top = 2, r2 = 3, r3 = 0, width = 0x11 - shift, and r5 = 2, so the
  custom-screen variant is six pixels narrower with its left edge pulled in by three. After drawing, flags_clearBits_20352C4_801BEC2
  clears bit 0x100 of the battle flag word at 0x20352C4. If battle_isBattleOver returns 1, or the custom screen
  is open (shift != 0), the function returns without further action; otherwise it dispatches event 0x400 (1 << 10)
  through dispatch_801DA48 to advance the command-menu state machine. r4-r6 are saved and restored even though r4-r5
  are overwritten with window parameters.

  '
