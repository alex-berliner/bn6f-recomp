name: object_spawnHitboxRegion
address: '0x080D0CB4'
kind: function
status: probable
summary: Reads the battle object's Param1 as an index into a shape/flag byte table, then calls object_spawnCollisionRegion
  using the object's panel coordinates and element plus the packed region attributes 0x3105FF01.
interface: (r5 = battle object pointer, implicit) -> r0 = spawnCollisionRegion result; clobbers r0-r3,
  r6, r7
details: 'Reads oBattleObject_Param1 from the object at r5 and uses it as an index into the byte table
  at 0x080D0CDC (bytes 02,04,08,80,01,... — powers of two, likely a shape/size or hit-type bitmask), storing
  the result in r6. It then loads oBattleObject_PanelX, oBattleObject_PanelY and oBattleObject_Element
  and calls object_spawnCollisionRegion with r0=PanelX, r1=PanelY, r2=Element, r3=0, r4=0x3105FF01 (a
  packed constant of region attributes) and r7=0. Notably r5 is an implicit input: it is never saved or
  set inside the function, so the caller must place the object pointer in r5. The function is otherwise
  a thin wrapper that fills the spawn-collision-region argument set from the object''s fields plus one
  table-driven parameter.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; ldrb r6,[r1,r0] indexes the table dword_80D0CDC by Param1;
    ldrb r0/r1/r2 of PanelX/PanelY/Element immediately before the call sets the region position/element
    arguments; ldr r4,=0x3105FF01 and mov r3,#0 / r7=0 fill the remaining fixed arguments; bl object_spawnCollisionRegion
    — the only call, matching the 'spawn a collision region' purpose; push {r4,r6,r7,lr} omits r5, showing
    r5 is an implicit object-pointer input preserved across the call
  refs:
  - bn6f/asm/asm31.s:54455
  - 0x080D0BD4 sub_80D0BD4
  - 0x080C536A object_spawnCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080D0CB4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior: it reads Param1 as a table index, loads PanelX/PanelY/Element,
    and calls object_spawnCollisionRegion with the packed constants. However, ''battle_'' is not an allowed
    naming prefix; the proposal also misreads the table byte as 0x80 instead of 0x10, and incorrectly
    lists r4/r7 as clobbered (they are pushed/popped). The wrapper nature and r5-as-implicit-input are
    correct.; run wf investigate investigate-20261019-022109; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- exact meaning of the fields packed in 0x3105FF01 and of the table bytes (shape vs. damage flags) depends
  on object_spawnCollisionRegion's signature
- which object types call this via sub_80D0BD4 and what Param1 values 0-4 represent
- 'The code matches the proposal''s behavior: it reads Param1 as a table index, loads PanelX/PanelY/Element,
  and calls object_spawnCollisionRegion with the packed constants. However, ''battle_'' is not an allowed
  naming prefix; the proposal also misreads the table byte as 0x80 instead of 0x10, and incorrectly lists
  r4/r7 as clobbered (they are pushed/popped). The wrapper nature and r5-as-implicit-input are correct.'
