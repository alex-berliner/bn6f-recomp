name: battle_categorizeRandomIds_813BC1C
address: '0x0813BC1C'
kind: function
status: confirmed
summary: Picks seven random IDs, classifies the corresponding toolkit objects by type, and writes them
  into two global target arrays (unk_2006CC0 for type-1/2, unk_2006CF8 for other types), while incrementing
  per-ID occurrence counters for type-1 objects in a caller-supplied byte array.
interface: void battle_categorizeRandomIds_813BC1C(void *byte_array_ptr /* r0 */) — preserves r4-r7; clobbers
  r0-r3, flags, lr
details: 'Allocates a 24-byte stack frame holding seven sentinel bytes (0xFF) used as a "already-seen"
  set. For each slot idx from 6 down to 0, calls get_random_id(idx, 3) (sub_813B9B4) to obtain a candidate
  ID. Duplicates and zero IDs are skipped. Non-zero IDs are stored in the seen-set, then resolved through
  toolkit_getUnk2004190EntryPtr_813B9FC(id-1) to get a 16-bit flag word; if the flag is zero the ID is
  discarded. The flag is fed to sub_813B780 which returns an object pointer. The object''s type byte (offset
  +1) determines routing: type 1 writes the ID into unk_2006CC0[idx] AND increments the occurrence counter
  at byte_array_ptr + object.offset (+4); type 2 writes into unk_2006CC0[idx]; all other types write into
  unk_2006CF8[idx]. The caller-provided byte_array_ptr (r0, saved at sp+0x1c) is a per-ID counter table
  that tracks how many times each type-1 object has been selected. Two literal-pool pointers (off_813BD20
  / off_813BD18) resolve to unk_2006CC0 and unk_2006CF8 respectively.

  '
