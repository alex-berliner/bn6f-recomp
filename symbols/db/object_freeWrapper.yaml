interface: (r0 = object slot pointer) -> r0 = object_freeMemory's return; flags from object_freeMemory
details: 'The function pushes lr, branches to object_freeMemory (the battle-object slot releaser: clears
  flags, frees the type''s bitmap slot, unlinks from the active-object list, resets sprite scaling), and
  returns immediately with pop {pc}, passing r0 through untouched. Since it adds no logic of its own,
  it almost certainly exists only so its address can be taken as a callback — e.g. an object''s free/despawn
  handler stored in a structure or jump table. Nothing in the body itself reveals which callers use it
  that way.'
