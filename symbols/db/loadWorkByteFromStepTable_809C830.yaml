name: loadWorkByteFromStepTable_809C830
address: '0x0809C830'
kind: function
status: confirmed
summary: Looks up one byte from a fixed 4x4 step/sequence table using two selector bytes in an object's
  state block and stores it into the work object at +0x5.
interface: 'void sub_809C830(void); /* in: r5 = work object; out: [r5+5] = table byte, r2 = selected table
  word, r3 = state pointer, NZ from ''mov r0,#0'' (Z set, C clobbered), r0/r1 scratch, r4-r7 preserved
  */'
details: 'Reads the state-block pointer from [r5+0x70]. Two bytes in that state act as indices: state+0xC
  (0..3) selects one of four words in the table at off_809C850, and state+0xD (0..3) indexes a byte within
  that word. The four words are 0x20100, 0x50403, 0x80706 and 0xB0A09, i.e. the byte values (00 01 02
  00), (03 04 05 00), (06 07 08 00), (09 0A 0B 00) — a 12-step sequence arranged as four groups of 3,
  with the 4th slot of each word always 0. The selected byte is written to [r5+5] of the work object,
  likely a step/phase counter derived from the state''s group-and-step pair. Leaves r2 = the selected
  table word and r3 = the state pointer live for callers; returns r0 = 0. Purely table-driven, no other
  memory or hardware touched.

  '
