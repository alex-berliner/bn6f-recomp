name: sub_811A29C
address: '0x0811A29C'
kind: function
status: hypothesis
summary: Tweaks a sprite's unk0x2c field based on the current menu-state table entry (sets a per-state bit otherwise
  clears/OR-in default bits)
interface: 'return: void; clobbers: r0 r1 r2 r3 lr; flags NZCV; preserved: r4 r5 r6 r7; stack: pushes {r4-r7,lr};
  pops {r4-r7,pc}'
details: "Calls menu_getTableEntryForStateIndex_811A268 to fetch three outputs (r0=index/ptr-ish, r1, r2). The\n\
  \"active\" branch fires when r0 != 0 AND (r2 != 0 OR r1 == 0):\n  * Loads a state byte from byte_8124B1C indexed\
  \ by (r0 - 0x140).\n  * Builds a single-bit mask by shifting 0x40 right by that byte (ARM `lsr` so >=32 yields\
  \ 0).\n  * ORs sprite.unk0x2c with 0x7E, then clears the bit at that mask position.\nOtherwise (\"inactive\" branch)\
  \ clears the 0x7E bits and ORs in 0x3E.\nBoth paths go through sprite_getUnk0x2c / sprite_setUnk0x2c. The `0x7E`\
  \ constant (bits 1..6) and\n`0x3E` (bits 1..5) suggest toggling a 6-bit field on the sprite; the active path picks\
  \ one of those\n6 bits per state index. Likely called once per menu state update to keep the sprite's state flags\n\
  in sync with the menu table. Only entry in byte_8124B1C sampled here; the full 6-state table is\nimplied by `0x140`\
  \ being the state index offset.\n"
