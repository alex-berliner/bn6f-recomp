name: t1_0x5e_pinkRingOnCounter_80C4B18
address: '0x080C4B18'
kind: function
status: confirmed
summary: Tick routine for the tutorial battle object that shows the pink "counter hit" ring over MegaMan — runs
  the object's per-state handler, then animates its sprite unless the battle is time-stopped or paused.
interface: void tick(BattleObject* obj /* r5 */) ; clobbers r0-r3,lr per callee handlers; flags untouched by prologue/epilogue
details: "r5 points to the battle object. Reads oBattleObject_CurState (offset +8) and\nindexes a 3-entry handler\
  \ table at off_80C4B3C:\n  state 0 -> sub_80C4B48 (init),\n  state 4 -> sub_80C4B84 (run/update),\n  state 8 ->\
  \ object_freeMemory.\nDispatch is done with \"mov lr, pc; bx r1\" (ARM-mode-return trick), leaving\nr0 = state\
  \ and r1 = handler address for the handler, as in the original.\nAfter the handler returns, it checks battle_isTimeStop\
  \ and battle_isPaused;\nif either is true it skips the sprite update. Otherwise it calls\nUpdateBattleObjectSprite.\
  \ Comment in the source notes that removing the\ntime-stop/pause guards is what makes the pink ring fail to appear\
  \ when\nMegaMan lands a counter hit — the ring must stay frozen/visible during\nthe counter-hit time stop, while\
  \ normal animation is skipped.\nThe name prefix t1_0x5e suggests tutorial scenario, task/object id 0x5e.\n"
