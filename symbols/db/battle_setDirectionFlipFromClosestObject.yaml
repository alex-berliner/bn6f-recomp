name: battle_setDirectionFlipFromClosestObject
address: '0x081161B0'
kind: function
status: probable
summary: Finds the closest enemy BattleObject to a given panel, then sets the caller object's DirectionFlip
  flag based on the sign of (caller.x - enemy.x) scaled by the caller's horizontal facing step, also considering
  dy.
interface: (r0 = panel x, r1 = panel y [stack-passed], r5 = BattleObject*) -> r0 = DirectionFlip value
  written to [r5+oBattleObject_DirectionFlip]; clobbers r0-r3
details: 'Saves the caller''s panel coords on the stack, XORs r5''s alliance with 1 and calls battleObject_findClosestEnemyBattleObject
  to get the nearest object on the opposite side, reading its panel coords from offsets 0x12 (x) and 0x13
  (y). It computes dx = caller.x - enemy.x and dy = caller.y - enemy.y, then normalizes dx by multiplying
  with the ±1 step from object_getEnemyDirection (based on alliance). The stored flip flag is simply (normalized
  dx >= 1) ? 1 : 0; the branch tree checks dy as well, but every path yields the same result, so the dy
  comparisons are redundant. DirectionFlip is written as a byte 0 or 1 on the r5 object; no other fields
  are touched.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: push {r0,r1} before bl passes panel coords by stack to battleObject_findClosestEnemyBattleObject_80103F8;
    ldrb r2,[r0,#0x12]/r3,[r0,#0x13] read the found object's panel x/y; ldrb r0,[r5,#oBattleObject_Alliance];
    eor r0,#1 selects the closest object of the flipped alliance relative to r5; sub/sub deltas then mul
    r0 by object_getEnemyDirection's ±1 result sign-normalizes dx by side; all branches end in strb 0/1
    to [r5,#oBattleObject_DirectionFlip], chosen solely by cmp r0,#1 (dx >= 1); sole caller sub_8115FCE
    is itself undocumented; function runs on recorded battlesweep routes
  refs:
  - bn6f/asm/asm32.s:16131
  - 0x08115FCE sub_8115FCE
  - 0x080103F8 battleObject_findClosestEnemyBattleObject_80103F8
