  reproduce: python3 tools/asmcat.py 0x081161B0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function logic, callees, and DirectionFlip write at strb r0,[r5,#oBattleObject_DirectionFlip]
    match the proposal. However, the proposal''s claim that ''every path yields the same result, so the
    dy comparisons are redundant'' is wrong: when r1 != 0 (dy branch), the result depends on both dx and
    dy comparisons (lines at loc_81161EA through loc_8116208), producing 0 or 1 differently from the r1==0
    path. Also, the interface has r0/r1 panel coords pushed on stack (stack-passed), not register-passed
    for r1; and dx*step sign matters, not just >=1.; run wf investigate investigate-20261018-200615; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
