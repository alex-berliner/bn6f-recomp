summary: 'Paralyze action handler (CurAction 4, ''on paralyze'' in the action tables): commits the pushed-back
  position, plays animation 2, then waits out the paralysis counter (shortened by button mashing) before
  ending the action.'
details: 'Entry 4 of the per-AIIndex action handler tables (the ''// on paralyze // 0x04'' entries of
  PlayerObjectAIAttackJumptables / off_80EA52C and copies), dispatched through battleObject_dispatchActionHandler_801B394.
  One-time init (oBattleObject_PhaseInitialized == 0): battle_dispatchActorAIByTypeAndAIIdx_800F394, object_setFlag1(0x400000),
  object_clearFlag(0x41), battle_resetCollisionState_80101C4, ClearAIDataUnk0x48Flag(0x20005f), sub_8012EA8;
  unless ObjectFlags1 bit 0x1000 (sliding) is set it commits the move (FuturePanelX/Y -> PanelX/Y, object_removePanelReserve,
  object_setCoordinatesFromPanels, object_updateCollisionPanels, Z=0); then CurAnim=2 / CurAnimCopy=0xFF,
  flip, RelatedObject1Ptr = 0, oAIData_Unk_68 = 0, tableAddSaturatedByte_800AB46(alliance, 3, 1), PhaseInitialized
  = 4. Every later call: when oAIData_JoypadPressed is nonzero the signed halfword at CollisionData+0x1c
  is decremented (and clamped to 0); when it reaches 0 object_clearFlag(0x800) clears PARALYZED. While
  ObjectFlags1 bit 0x800 is still set the handler returns. On recovery: ClearAIData_Unk_44_Flag(0x1000003f),
  object_clearFlag(0x400000), CurAnim=0, CurAction=8, CurPhaseAndPhaseInitialized=0.

