name: textScript_buildFolderNameBuffers_804A17A
address: '0x0804A17A'
kind: function
status: confirmed
summary: Builds the two text-script folder name buffers at unk_2001850, filling each with 0x20 halfwords
  of 0xE5E5, copying the wide folder name, and stamping a 0xE6 terminator at offset 0x10.
interface: 'void sub_804A17A(void);  // callee-saved: r4-r7; uses r0-r3 + flags internally'
details: "Allocates no stack; uses the fixed 0x60-byte block at unk_2001850 (two 0x30-byte halves).\n\
  \  * Half 0 (base 0x2001850):\n    - ZeroFillByWord clears 0x60 bytes total.\n    - HalfwordFill writes\
  \ 0x20 copies of halfword 0xE5E5.\n    - textScript_copyFolderNameToWide_804A1FC is called with folder\
  \ index 0 as the source.\n    - A single byte 0xE6 is written at offset 0x10 within the half (= unk_2001860).\n\
  \  * Half 1 (base 0x2001850 + 0x20):\n    - HalfwordFill writes 0x20 copies of halfword 0xE5E5.\n  \
  \  - Folder index 1 is copied to that half.\n    - A single byte 0xE6 is written at offset 0x10 within\
  \ the half (= unk_2001880).\n0xE5 / 0xE6 are the BN6 single-byte text-script control codes for line-feed\
  \ / end-of-string, so this routine is producing the two pre-filled \"folder name\" text strings that\
  \ the in-game text renderer will display when listing a folder pair (e.g., the two save slots, two library\
  \ entries, or two chatbox lines managed by textScript_copyFolderNameToWide_804A1FC).\n"
