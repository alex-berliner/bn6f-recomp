open_questions:
- What sub_8120A88 does (called with no args after the zero-fill) and what word_2023FA0 is used for
- What mode 5 / arg 4 mean in battle_fieldLockDispatch_8120018 and which handler runs over the table
- What the caller sub_812D298 does — needed to confirm whether this feeds the battle chip-select/search
  UI or another chip list screen
- Semantics of the +2/+3 bytes (5 and 4) in the S2001c04 struct
