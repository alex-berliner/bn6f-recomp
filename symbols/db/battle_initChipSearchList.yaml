name: battle_initChipSearchList
address: '0x0812D3A8'
kind: function
status: probable
summary: Builds an in-battle chip search table and dispatches it to battle objects, then sets a 5x4 list/menu
  size on the battle UI state.
interface: () -> void; r7 points to a context whose +0x28 halfword receives the table entry count + 1
details: First zeroes the 0x20-byte buffer word_2023FA0 via CpuFastSet and calls sub_8120A88 (purpose
  unknown, no args). It then builds a 0x20-byte-entry chip search table in unk_2023FC0 by scanning chips
  1..0x13A via buildChipSearchTable_811FE7C, which returns the entry count. The count+1 is stored as a
  halfword at [r7,#0x28] and the raw count is passed, together with the table base and constants 5 and
  4, to battle_fieldLockDispatch_8120018, which locks/unlocks per-battle-object state around a mode-dispatched
  handler (mode 5, arg 4) so it can read the table. Finally it writes 5 and 4 as bytes at offsets +2 and
  +3 of the struct pointed to by the battle toolkit's oToolkit_S2001c04_Ptr field, which look like menu/list
  dimensions or mode parameters set after the list is built.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ZeroFillByEightWords(word_2023FA0, 0x20) clears the working buffer before building the list;
    buildChipSearchTable_811FE7C(unk_2023FC0, 1) result+1 stored to [r7,#0x28]; battle_fieldLockDispatch_8120018(unk_2023FC0,
    count+1, 5, 4) hands the table to the mode-dispatched battle handler; strb #5/[r1,#2] and strb #4/[r1,#3]
    on the toolkit S2001c04 pointer set list dimensions/mode after dispatch'
