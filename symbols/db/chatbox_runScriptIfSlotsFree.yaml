name: chatbox_runScriptIfSlotsFree
address: '0x08129AF0'
kind: function
status: probable
summary: If both text-slot structs at unk_20251A0 have a zero byte at +7, clears bit31 on both slot pointers,
  sets the caller's state byte at r5+3 to 8, runs a chatbox script on the second slot via sub_812B3B4,
  and clears bit0 of r5+0x1b; otherwise returns without side effects.
interface: (r5 = caller context struct, pre-set by caller; r0 unused on entry) -> r0 = script-runner result;
  writes bit31 flags of both unk_20251A0 entries, r5[3] = 8, clears bit0 of r5[0x1b]
details: The function walks two pointer slots at unk_20251A0 (offsets 0 and 4). Each pointer carries bit31
  as a flag; it masks the flag off and reads byte +7 of the pointed-to struct. If either struct has a
  nonzero byte at +7 the function returns immediately without side effects. Otherwise a second loop stores
  both pointers back with bit31 cleared (releasing/claiming the slots), stores 8 into byte +3 of the caller's
  struct r5, calls sub_812B3B4 with r0 = the second slot struct (which picks a script number via a byte
  in that struct and runs it on eTextScript201BA20), and finally clears bit0 of r5[0x1b]. Note r5 is callee-saved
  and never initialized here, so the caller owns this context struct.
