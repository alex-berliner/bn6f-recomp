- method: assembly-reading
  date: '2026-10-18'
  detail: bl SWI_LZ77UnCompReadNormalWrite8bit with src=comp_82FCA14, dest=unk_201AA00 decompresses the
    resource; bl initGuiSprite_8002770(r7+4, 0x8F) initializes sprite slot from the decompressed data;
    bl sprite_setAnimation(0); bl sprite_loadAnimationData; bl sprite_noShadow configure slot 0's sprite;
    mov r0,#0x80; mov r1,#0x80; bl sprite_setCoordinates places it at screen center; only caller sub_811CDF4
    invokes it as a standalone setup step
