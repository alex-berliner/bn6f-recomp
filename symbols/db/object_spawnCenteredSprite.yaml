name: object_spawnCenteredSprite
address: '0x0811D5F8'
kind: function
status: probable
summary: Decompresses a sprite resource into a static buffer, initializes it as a GUI sprite with resource
  0x8F, sets animation 0, disables shadow, and positions it at (0x80, 0x80) on screen.
interface: () -> void; r7 clobbered
details: 'LZ77-decompresses comp_82FCA14 into the static buffer unk_201AA00, then calls initGuiSprite_8002770
  with unk_201AA00+4 and resource id 0x8F to initialize sprite slot 0. It then sets the slot''s animation
  to index 0, loads its animation data, and clears the shadow flag so the sprite renders without a shadow.
  Finally it positions the object at (0x80, 0x80) via sprite_setCoordinates — the exact center of the
  160x128 GBA screen. This is a one-shot setup routine: spawn a fixed GUI/cutscene sprite dead-center
  with no movement.'
