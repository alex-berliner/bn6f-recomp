name: chatbox_EB_option
address: '0x08041244'
kind: function
status: confirmed
summary: Appends one entry to the chatbox's option (choice) list, copying the option's parameter bytes into the
  next free slot and resetting the choice cursor.
interface: chatbox_EB_option(u32 r1 /* unused */, const u8 *r4 optionDef, Chatbox *r5) -> r0=1, r1=oChatbox_Unk_80,
  r2=offset of new entry's gfx-load-state byte, r3=oChatbox_Unk_70 word, r4=optionDef+4; NZCV from ADDS r4,#4; r2/r3/r4/lr
  clobbered
details: 'Part of the chatbox "0xEB" (option/choice) opcode handling. First sets chatbox flag bit FLAGS_3E_UNK_0010
  via chatbox_setflags_3e and stores 0xA (10) to the halfword oChatbox_BoxYX. Then it reads the option-entry count
  from oChatbox_Unk_80 and computes a bare offset (not an absolute address) into the chatbox struct: entryOff =
  0xA0 + count*0x10, i.e. each entry is a 0x10-byte slot in an array starting at chatbox+0xA0. Into that slot it
  writes optionDef[1] at +0, optionDef[2] at +4, optionDef[3] at +5, the shared word oChatbox_Unk_70 at +8, and
  finally the byte from oChatbox_BoxGfxLoadState_0F at +0xC (the entry''s gfx-load-state trailer). The count is
  incremented and stored back to oChatbox_Unk_80 and also (as a byte) to oChatbox_Unk_12; oChatbox_ChoiceCursorPos
  is reset to 0 so a newly opened choice box starts with the first option highlighted. Returns 1 in r0, hands optionDef+4
  back in r4 so the caller can advance to the next option definition, and leaves the entry offset in r2 for the
  caller. The r1 input is never read.

  '
