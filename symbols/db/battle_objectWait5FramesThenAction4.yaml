name: battle_objectWait5FramesThenAction4
address: '0x080D837C'
kind: function
status: probable
summary: Battle-object state step that waits 5 frames on first entry, then switches the object to CurAction
  4.
interface: (r0 = unused/scratch, r5 = battle object pointer) -> r0 = 0 or remaining timer; updates oBattleObject_CurPhase,
  oBattleObject_Timer, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized
details: Reads oBattleObject_CurPhase from the object in r5; if phase is 0 it initializes the wait by
  writing phase 4 and Timer = 5 and returns immediately. On later invocations it decrements oBattleObject_Timer
  and returns while it is still > 0. Once the timer expires it writes CurAction = 4 and zeroes CurPhaseAndPhaseInitialized
  so the object's action handler restarts at phase 0. CurPhase is left at 4 during the whole wait, suggesting
  phase 4 is this handler's own id within a dispatcher. No other objects or globals are touched.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_CurPhase] / tst r0,r0 + bne: phase 0 means first entry, initializes
    the wait; mov r1,#4; strb r1,[r5,#oBattleObject_CurPhase] + mov r0,#5; strh r0,[r5,#oBattleObject_Timer]:
    sets 5-frame timer under phase 4; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt: per-frame
    countdown while waiting; mov r0,#4; strb r0,[r5,#oBattleObject_CurAction] + zeroing CurPhaseAndPhaseInitialized:
    transition to action 4 with fresh phase state'
