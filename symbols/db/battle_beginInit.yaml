  then calls battle_initState_813BBD4 on r5, which lays out the battle state and its sprite/cell setup.
  Finally it calls sub_8136B10 with r0=1, probably selecting a step or mode 1 of a state machine, and
  returns its result. Its 12-instruction shape is that of a battle-start entry point that seeds fields
  before the main init chain runs.
