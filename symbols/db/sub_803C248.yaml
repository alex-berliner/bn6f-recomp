name: sub_803C248
address: '0x0803C248'
kind: function
status: hypothesis
summary: Tests whether a range of 2-byte table slots starting at (base+index) contains only empty/placeholder entries,
  walking until a 0xE6 terminator.
interface: bool isSlotRangeEmpty_803C248(const void *base, u32 index); // r0=base, r5=index (bytes), returns r4=1
  if empty / 0 if occupied, sets nz from r4, r5 preserved
details: 'Computes cursor = R0 + R5, then walks the table in 2-byte strides, examining only the first byte of each
  entry.

  0xE6 is the end-of-range terminator (stop, return current result).

  0xE5 and 0x00 are treated as "empty" slot markers and skipped.

  Any other byte means the slot is occupied; result is set to 0 and the scan terminates.

  R4/R5 are preserved per the calling convention (they appear in the preserved set and are not used as locals across
  the loop boundary; the loop body just re-reads R3/R0/R4).

  Likely used to check free/occupied status in some packed 2-byte-per-entry table (slot id in the high byte, status/flag
  in the low byte, with 0xE5/0x00 as vacant/cleared markers and 0xE6 as end-of-list).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
