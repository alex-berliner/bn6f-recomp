- Whether byte_8043CA4 is width only or also encodes advance/spacing (TileBufferOffset += width vs Unk_7C
  += width*5)
- 'Contents of dword_3006B84: presumed per-color palette base added to each pixel byte'
- 'The proposal is largely correct: r1 indexes the glyph at byte_86ACD60+0x60, r4 (pushed/popped r6) is
  loaded from byte_8043CA4 as the width, and r5+oChatbox_TileBufferOffset += r4; r5+0x7C += r4*5 (lsl
  r4,#2 then add to r6). However, r5+oChatbox_TileBufferOffset and oChatbox_Unk_7C are not the cursor
