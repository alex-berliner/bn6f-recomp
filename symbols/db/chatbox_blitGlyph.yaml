name: chatbox_blitGlyph
address: '0x03006F8C'
kind: function
status: probable
summary: Blits a 12xN 4bpp dialog-font glyph (sourced from byte_86ACD60 + idx*0x60, width from byte_8043CA4)
  into the chatbox scanline buffer in unk_200BEA0 at the current bit offset, OR-ing a per-chatbox color
  base from dword_3006B84, then advances the chatbox's tile-buffer-offset field and a 5x-scaled offset
  by the glyph width.
interface: (r1 = glyph/char index, r5 = chatbox struct, r6 = pen position as bit offset (pixelX*4)) ->
  r0 clobbered; updates [r5+oChatbox_TileBufferOffset] += width and [r5+oChatbox_Unk_7C] += width*5
details: Picks the glyph bitmap at byte_86ACD60 + r1*0x60 (0x60 bytes per glyph = 12 rows x 2 source words)
  and its width in pixels from byte_804CA4[r1]. The destination is the word at unk_200BEA0[r6>>5] (a pointer
  indexed by 8-pixel column), with r6&0x1F giving the intra-word bit offset, i.e. (x%8)*4 for 4bpp pixels.
  The 12-iteration loop read-modify-writes 3 destination words per row, OR-ing the glyph's shifted bits
  in classic unaligned-bitblit fashion (lsl/lsr pairs with shift 0x40-4*width), so glyphs up to 16px wide
  are supported. r12 = dword_3006B84[[r5+0x1D0]] is added to each source word before blitting, almost
  certainly a replicated palette/color base so the text color is selectable per chatbox. After blitting,
  the chatbox cursor fields are advanced by the glyph width. Runs from IWRAM, called only by the chatbox
  dialog-character interpreter.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'All four callers are chatbox_interpreteAndDrawDialogChar / _1, i.e. the dialog text renderer;
    add r7,r7,r4 with r7=#0x60*r1 selects per-glyph data at byte_86ACD60 (0x60 bytes/glyph); ldrb r4,[byte_8043CA4,r1]
    then r4=0x40-4*r4 used as the mask/shift: variable glyph width in pixels; r3=r6&0x1F bit shift and
    unk_200BEA0[r6>>5] destination pointer form an unaligned bit-offset blit into the text buffer; Loop
    runs 12 rows (r6=0xb, bge) writing 3 words/row with 0x60 stride, then bumps oChatbox_TileBufferOffset
    by the width'
  refs:
  - bn6f/asm/asm38.s:2934
  - 0x0803FF50 chatbox_interpreteAndDrawDialogChar
  - 0x0804005C chatbox_interpreteAndDrawDialogChar_1
  - 0x08040086 chatbox_interpreteAndDrawDialogChar_1
  reproduce: python3 tools/asmcat.py 0x03006F8C
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is largely correct: r1 indexes the glyph at byte_86ACD60+0x60, r4 (pushed/popped r6)
    is loaded from byte_8043CA4 as the width, and r5+oChatbox_TileBufferOffset += r4; r5+0x7C += r4*5
    (lsl r4,#2 then add to r6). However, r5+oChatbox_TileBufferOffset and oChatbox_Unk_7C are not the
    cursor pen-position fields in the usual sense — they look more like raw/dirty/clip tracking — and
    ''pen position'' for r6 as bit offset is a guess. Most damning, ''chatbox_blitGlyphToTileBuffer''
    misnames the function: it reads unk_200BEA0 (pointer table indexed by row/column-block) and writes
    to [r2]/[r2,#4]/[r2,#8], so it blits into an arbitrary 4bpp row buffer, not a tile. Better to use
    a verb-neutral name.; run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
