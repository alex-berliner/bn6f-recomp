name: sprite_initialize
address: '0x0800272C'
kind: function
status: confirmed
summary: Resets an object's sprite state — zeroes animation/position/timer fields, invalidates the current frame,
  and sets the default 8x8 cell size.
interface: void sprite_init(u32 firstResource /* r0, sprite resource id/base */, SpriteObj* obj /* r5 */); returns
  c/v from r0+4
details: 'Initializer/reset routine for a sprite object (r5 points at an oObjectSprite-style struct). The only meaningful
  input is r0, a sprite resource index: it stores r0+4 into Unk_18, which is the first resource slot used by the
  sprite (the +4 skips a fixed header/first entry). Everything else is unconditional clearing: state bytes at +0/+3/+4/+5
  and Unk_14, timers/positions at Unk_0a, +6, Unk_10/Unk_12, words Unk_24, Unk_2c, Unk_30 and Unk_34 are all zeroed.
  Unk_28 is set to 0xFFFFFFFF, meaning "no active/current frame" so the first render pass must load one. Finally
  Unk_15 (byte) and Unk_16 (halfword) are both set to 8 — the default 8x8 OAM cell dimensions. No return value;
  the c/v flags left by the opening ADDS r0,#4 are an incidental side effect of the resource computation.

  '
