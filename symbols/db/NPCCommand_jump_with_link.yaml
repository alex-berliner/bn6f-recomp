name: NPCCommand_jump_with_link
address: '0x0809F1C6'
kind: function
status: confirmed
summary: NPC script VM "call subroutine" opcode — saves a return address in the NPC object's link register and jumps
  to a 32-bit destination read from the script.
interface: void NPCCommand_jump_with_link(OverworldNPCObject* npc /* r5 */, int scriptPc /* r6 */); returns r0 =
  r6 = new script Pc (jump target), sets flags via "movs r6, r0"
details: 'Implements the script-VM subroutine-call opcode. The NPC object pointer is in r5 and

  the script program counter is in r6. It stores Pc + 5 (the instruction is a 1-byte

  opcode plus a 4-byte operand) as the return address into the NPC object at offset

  oOverworldNPCObject_LinkRegister, then calls ReadNPCScriptWord on Pc + 1 to fetch the

  32-bit jump destination from the script, and resumes the script at that address

  (returned in both r0 and r6). The link register field offset is re-materialized in r4

  on each invocation. Quirk: the final "mov r6, r0" is actually a flags-setting "movs"

  (adds r6, r0, #0), so the N/Z/C/V flags left for the caller reflect the destination

  address value (C and V effectively constant 0, N/Z from the address bits).

  '
