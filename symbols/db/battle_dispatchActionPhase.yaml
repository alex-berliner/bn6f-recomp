- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly lines read Param1 and CurAction, select between off_80BDD24 and off_80BDD34, then bx
    to the indexed function pointer.; sub_80BDBC8 initializes the object's action/state fields and calls
    this dispatcher immediately before returning.; The dispatch tables contain battle_phasePlaySoundAndWait,
    sub_80BDD70, sub_80BDD88, sub_80BDEC0, and object_waitPhasePlaySoundAndAdvance, showing action-specific
    battle handlers.
