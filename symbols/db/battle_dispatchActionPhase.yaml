name: battle_dispatchActionPhase
address: '0x080BDCFC'
kind: function
status: probable
summary: Dispatches a battle object's current action to the handler selected by Param1 and CurAction.
interface: (implicit r5 = battle object) -> void; flags preserved/unspecified
details: This is a small battle-object action dispatcher. It reads oBattleObject_Param1 and selects one
  of two function-pointer tables based on whether Param1 is zero. It indexes the selected table by oBattleObject_CurAction
  and tail-calls the resulting handler, so the function returns only after that handler finishes. The
  callers' surrounding setup initializes action state before invoking it.
