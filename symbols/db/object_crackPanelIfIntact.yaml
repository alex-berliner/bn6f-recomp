name: object_crackPanelIfIntact
address: '0x080C8A60'
kind: function
status: probable
summary: Cracks the panel at the given field coordinates only if it is not already cracked.
interface: (r0 = panel x, r1 = panel y, r2 = force flag) -> void; clobbers r0-r3, lr
details: With r2 == 0 the function first reads the panel's status flags at (r0, r1) via object_getPanelParameters
  and returns immediately if bit 0x40 (the cracked-panel flag) is already set; otherwise, or whenever
  r2 != 0, it calls object_crackPanel on the same coordinates. Args are pushed so that r0/r1 can be restored
  from the stack after the flags call clobbers them. It is a thin guarded wrapper around object_crackPanel,
  likely used by panel-breaking attacks/effects that must not re-crack an already cracked tile.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: cmp r2,#0 / bne skips the intactness check, so r2 forces cracking unconditionally; tst r0,#0x40
    with bne to pop returns early when the panel is already cracked; ldr r0,[sp] / ldr r1,[sp,#4] reload
    the saved x/y before calling object_crackPanel; callee object_getPanelParameters returns the panel
    status word used for the 0x40 test
  refs:
  - bn6f/asm/asm31.s:36399
  - 0x080C89C8 sub_80C89C8
