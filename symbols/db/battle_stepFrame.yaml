  - bn6f/asm/asm03_1_1.s:2869
  - 0x08039AB8 sub_8039AB8
  - 0x08039AE4 sub_8039AE4
  - 0x08039B0A sub_8039B0A
  - 0x080465F8 battle_updateEStructSprites_80465F8
