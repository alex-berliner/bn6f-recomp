  reproduce: python3 tools/asmcat.py 0x0803A1B0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The body order in the proposal matches: sub_803A214 once, sub_803A1D8 in a 4-iteration loop, then
    entity_runAllUpdateHandlers and battle_updateEStructSprites. However, the gate flag interpretation
    is inverted: `ldrb r0,[r5,#0x18]` then `tst r0,r0` with `beq loc_803A1BE` means the gate sub_803A2A4
    is skipped when the flag is zero and called when non-zero; the `beq locret_803A1D6` after the call
    aborts the frame only when sub_803A2A4 returns 0 (EQ), i.e. the check fails (not a general pause).
    Also the loop counter is r6 incremented after each call, compared to #4, blt — correct 4 passes. Name
    is acceptable; summary''s ''optional gate check / pause-freeze'' phrasing misrepresents the logic.;
    run wf investigate investigate-20261019-003606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
