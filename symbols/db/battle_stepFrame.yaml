name: battle_stepFrame
address: '0x0803A1B0'
kind: function
status: probable
summary: 'Per-frame battle tick: calls sub_803A214 once, runs sub_803A1D8 four times in a fixed loop,
  then dispatches entity update handlers and refreshes eStruct sprites; an optional gate sub_803A2A4 at
  [r5+0x18] can short-circuit the frame.'
interface: (r5 = battle/global state struct) -> r0 = clobbered; returns early if gate sub_803A2A4 returns
  0
details: Reads a flag byte at [r5,#0x18]; if set, calls sub_803A2A4 and aborts the tick when it returns
  zero (a pause/freeze-style gate). Otherwise runs sub_803A214 once, then loops sub_803A1D8 exactly 4
  times (r6 counted 0..3), a fixed 4-pass sub-step. It finishes the frame by calling entity_runAllUpdateHandlers_80465BC
  (walks the 15-entry 0x58-byte entity array dispatching update handlers) and battle_updateEStructSprites_80465F8
  (per-record hitbox/palette/tile refresh for active records). The r5 base is preserved across the routine,
  implying a persistent battle-state pointer held by the callers. Multiple callers at 0x08039AB8-0x08039B98
  invoking it under different conditions fits a battle state machine calling the same per-frame step from
  several states.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst/beq on [r5,#0x18] plus bl sub_803A2A4 + beq locret: conditional early-out gate before any
    updates (asm lines 2-5); mov r6,#0 / bl sub_803A1D8 / cmp r6,#4 / blt: fixed 4-iteration sub-step
    loop (asm lines 8-12); bl entity_runAllUpdateHandlers_80465BC then bl battle_updateEStructSprites_80465F8:
    classic end-of-frame entity+sprite pipeline (asm lines 13-14); six callers in 0x08039AB8-0x08039B98,
    all adjacent battle-state helpers, consistent with a shared per-frame tick; callee summaries (entity
    update dispatch, eStruct sprite refresh) match a battle frame-update role'
