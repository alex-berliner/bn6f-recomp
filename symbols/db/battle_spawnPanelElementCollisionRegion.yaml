name: battle_spawnPanelElementCollisionRegion
address: '0x080BA686'
kind: function
status: probable
summary: Spawns a dimming collision-region battle object over this object's panel, passing the object's
  element.
interface: (r0 unused on entry; r5 = battle object) -> r0 = spawned object; r4/r6/r7 clobbered by wrapper
  convention
details: Reads oBattleObject_PanelX, oBattleObject_PanelY and oBattleObject_Element from the battle object
  in r5 and calls object_spawnDimmingCollisionRegion with x, y, element as r0-r2 and r3 = 0. The constant
  0x1605FF01 (word_80BA69C) is loaded into r4 as a flags/parameter word, and the object's oBattleObject_DamageAndStaminaDamageCounterDisabler
  field is passed in r6, with r7 = 3. This looks like a thin wrapper so an attack/object script can drop
  an elemental collision region on its own panel.
