name: oAIAttackVars_PanelParamFlags2
address: '0x38'
kind: struct-field
status: probable
summary: Secondary panel-mask parameter paired with Unk_34; often a static bitmask constant (e.g. 0xf880080,
  0x3800000, 0x10) used in object_checkPanelParameters calls and as a hit-element flag for spawned child
  attack objects.
details: In many accesses the field is loaded as a word and passed as the r3 (mask) argument to object_checkPanelParameters
  alongside Unk_34 (paired "panel param args" from GetAllianceDependentPanelParamArgs — see asm31.s:175513,
  175704, asm32.s:8132, 10616). In sub_810209E/sub_81020F0 it is initialized via sub_800FE28 from a per-version
  dword table (dword_8101A30/...50) and its low byte is copied into TimerOrCycles/Unk_0e, suggesting the
  high bytes are a panel-validity bitmask. The pair is also cleared to 0 when a step begins (asm31.s:156954,
  142297) and used as a tst-tested "child object" pointer elsewhere, but those reads treat it as a pointer
  — i.e. the field is reused as either a bitmask or an object pointer depending on attack phase. Two competing
  roles (mask vs. object handle) prevent a probable rating.
