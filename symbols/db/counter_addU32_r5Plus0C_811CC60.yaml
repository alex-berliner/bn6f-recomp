name: counter_addU32_r5Plus0C_811CC60
address: '0x0811CC60'
kind: function
status: confirmed
summary: Adds an amount to a 32-bit counter field at +0xC of the struct passed in r5, returning the new value (and
  old value in r1) with carry/overflow flags from the addition.
interface: u32 counter_addU32(struct *r5, u32 amount /* r0 */); returns new value in r0, old value in r1; c/v (and
  nz) set per the ADDS
details: Three-instruction helper. Loads the 32-bit word at [r5,#0xC], adds r0 to it, stores the sum back to the
  same field. r1 ends up holding the pre-add value, r0 the post-add value, so callers get both like an atomic exchange.
  The carry and overflow flags come straight from the ADDS, suggesting at least one caller tests them (e.g. to detect
  wraparound of the counter). Nothing else is touched and no registers are preserved beyond what the caller contract
  lists. Which game system owns the struct at r5 is not visible from this function alone; it is only identifiable
  as "whatever keeps a u32 counter at offset 0xC".
