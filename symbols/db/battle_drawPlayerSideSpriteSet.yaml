name: battle_drawPlayerSideSpriteSet
address: '0x0801D47A'
kind: function
status: probable
summary: Uploads a two-frame 2-tile graphic to OBJ VRAM and queues three OAM sprites (one 16x16, two 32x32
  with one h-flipped) anchored horizontally to the player-side battle entity.
interface: (r5 = battle object ptr, field +0x36 halfword = state; r10 = toolkit) -> void; queues GFX +
  OAM, no return value
details: 'Reads halfword [r5+0x36]: bit0 picks one of two 0x40-byte frames from dword_86E98CC, which are
  queued to OBJ VRAM 0x6017900 via QueueEightWordAlignedGFXTransfer (64 bytes = 2 4bpp tiles, likely only
  the changing tiles of an animation). It then indexes the player-side battle entity (fixed-stride 0x1D0
  array at unk_2036120, index from battleState+oBattleState_PlayerSide) and reads halfword +0x3E, scaling
  it by 0x50 and shifting left 16 so it offsets all three queued OAM entries identically (shared horizontal
  anchor). The low byte of dword_801D510 table {0x00,0x30,0x10} is indexed by [r5+0x36] clamped with (v>=3
  ? v-3 : v), giving a per-state X offset. It calls sprite_queueOamEntry three times with packed attrs:
  tile/palette word 0xC3C0 (tile 0x3C0, priority 3, palette 12) for the first sprite, 0xC3C8 for the other
  two; the third call ORs 0x10000000 (attr1 horizontal-flip bit) and adds 0x48 to the position, so two
  mirrored 32x32 sprites (y from 0x8090) flank/offset the smaller 0x4080-based sprite. Net effect: a small
  animated, entity-tracking multi-sprite graphic in the lower screen area (y ~0x80-0x90).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'QueueEightWordAlignedGFXTransfer(dword_86E98CC + ([r5+0x36]&1)*0x40, 0x6017900, 0x40) uploads
    a bit-selected 2-tile frame; getEntryPtr_2036120_1D0(battleState->PlayerSide) then ldrh [r0,#0x3E];
    *0x50; lsl #0x10 feeds the same r4 offset into all three queueOamEntry calls; three sprite_queueOamEntryThunk
    calls share r2=3, r3=0 and tile words 0xC3C0/0xC3C8 (pal 12, prio 3); third call adds 0x10000000 =
    OBJ hflip and +0x48 to position; ldrb from dword_801D510 (bytes 00/30/10) indexed by [r5+0x36] wrapped
    mod 3 gives the per-state X offset; OAM bases 0x80044080 (16x16, y=0x80) and 0x8090 (32x32, y=0x90)
    place all sprites in the bottom battle-screen band'
