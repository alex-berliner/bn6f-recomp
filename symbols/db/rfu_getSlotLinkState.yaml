name: rfu_getSlotLinkState
address: '0x081468F4'
kind: function
status: probable
summary: Returns the per-RFU-slot link-state halfword from the RFU child table at eStruct200FE00 + 0x28.
interface: () -> r0 = u16 (link-state word for rfuSlotId)
details: Computes address = eStruct200FE00 + 0x28 + rfuSlotId*2 and returns the 16-bit value loaded from
  it. Indexed by rfuSlotId, so each wireless child has its own entry. The caller (sub_803C84A) uses the
  result together with rfu_getConnectedPlayerCount, consistent with a per-slot RFU status query used when
  probing link state. No writes occur.
