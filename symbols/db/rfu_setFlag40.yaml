summary: Sets bit 0x40 in the RFU shared-state flags word (0x200BC50+0xC), likely signalling some wireless
  condition.
interface: () -> void; r0 clobbered by call to rfu_orFlags
details: 'The function is a tiny wrapper: it loads the address of the RFU shared state structure (eS200A290
  = 0x200BC50) and calls rfu_orFlags with r0 = 0x40, which ORs bit 0x40 into the flags word at offset
  0xC of that structure. It takes no arguments and returns nothing; r4-r7 are saved/restored only to satisfy
  the callee''s register conventions. Without any known callers, the in-game meaning of flag 0x40 is unknown.'
