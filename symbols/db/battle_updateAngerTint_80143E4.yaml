name: battle_updateAngerTint_80143E4
address: '0x080143E4'
kind: function
status: confirmed
summary: If a battle object's AI data has any anger built up, flashes its sprite with the enraged red color shader
  (0xF).
interface: 'void battle_updateAngerTint(battleObj in r5); out: r3, flags c/v preserved from caller, nz set by the
  anger test; lr consumed'
details: 'Reads the battle object''s AI data pointer (oBattleObject_AIDataPtr at r5) and tests

  oAIData_Anger (a 16-bit anger counter/flag). If it is nonzero, calls

  sprite_setColorShader with color shader 0xF, the red tint used for the "enraged"

  flash on enemies that have taken damage or been provoked. If anger is zero the

  function returns without touching the sprite, leaving any prior shader as-is.

  The tst r0,r0 before the branch means the NZ flags seen by the caller always

  reflect the anger value, even on the early-return path.

  '
