name: getRecordFlagBit3
address: '0x0800A07C'
kind: function
status: probable
summary: Returns 1 if bit 3 of the flag halfword is set in record r0 of the 8-byte-record table at 0x2036820,
  else 0.
interface: (r0 = record index into dword_2036820) -> r0 = 1 if bit 3 of halfword at record+4 is set, else
  0
details: The function computes record base = dword_2036820 + r0*8, so the table holds 8-byte entries.
  It loads the halfword at entry+4 and tests it against 0x8, returning 1 when the bit is set and 0 otherwise;
  no other fields are touched and no calls are made. The bit tested is presumably one flag bit of a 16-bit
  status/flags word shared by all entries. Because all four callers are themselves unnamed functions in
  the same 0x08008xxx region, the table's identity (entities, tasks, save flags, etc.) cannot be confirmed
  from this view.
