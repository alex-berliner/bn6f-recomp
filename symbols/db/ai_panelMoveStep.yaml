name: ai_panelMoveStep
address: '0x080F98C0'
kind: function
status: probable
summary: 'One step of an AI attack handler: on first call commits the object''s reserved panel (copies
  FuturePanel to Panel, recomputes coords, releases the panel reservation, clears flag 0x40, sets CURRENTLY_MOVING),
  configures its collision record (collision data 0x10/2/3, region 1, SelfDamage/StaminaDamageCounterDisabler
  from the object''s packed damage field, sub_801DC7C(0,0)), stamps AttackElement=4, CurAnim=3, and StepTimer=3;
  subsequent calls decrement StepTimer and when it expires write HitElement=0x14 to trigger the hit.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets AttackElement=4, CurAnim=3, StepTimer,
  HitElement on r7
details: On the first call (AttackElement == 0) it stamps AttackElement = 4 and CurAnim = 3, copies FuturePanelX/Y
  into PanelX/Y, recomputes pixel coordinates from the panels, releases the panel reservation, refreshes
  collision panels, clears flag 0x40 and sets the CURRENTLY_MOVING flag on the object, then programs the
  collision record via object_updateCollisionData(0x10, 2, 3) and object_setCollisionRegion(1). It copies
  the packed value from oBattleObject_DamageAndStaminaDamageCounterDisabler into the collision data's
  SelfDamage halfword and StaminaDamageCounterDisabler byte, calls sub_801DC7C(0,0), and sets StepTimer
  = 3. On subsequent calls it just decrements StepTimer; when it reaches 0 it writes HitElement = 0x14,
  which presumably activates the attack's hit effect on the region it now occupies.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne makes this a multi-step routine driven by
    AttackElement; copies FuturePanelX/Y to PanelX/Y then calls object_setCoordinatesFromPanels + object_removePanelReserve:
    it lands on the reserved panel; object_setFlag1(1<<CURRENTLY_MOVING_1_BIT) and object_updateCollisionData(0x10,2,3)
    + setCollisionRegion(1) arm the attack hitbox; DamageAndStaminaDamageCounterDisabler field is split
    and stored to oCollisionData_SelfDamage / StaminaDamageCounterDisabler; StepTimer = 3 then decrement
    loop ends by writing oAIAttackVars_HitElement = 0x14, the delayed trigger of the hit'
  refs:
  - bn6f/asm/asm31.s:140517
  - 0x0801A15C object_clearFlag
  - 0x0801BB46 object_removePanelReserve
  - 0x0801A07C object_setCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080F98C0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary correctly tracks the first-call path: stamps AttackElement=4, CurAnim=3, copies FuturePanel->Panel,
    recomputes coords, releases reserve, refreshes panels, clears flag 0x40, sets CURRENTLY_MOVING, updates
    collision data (0x10,2,3), sets region 1, copies the packed DamageAndStaminaDamageCounterDisabler
    into SelfDamage/StaminaDamageCounterDisabler, calls sub_801DC7C(0,0), and sets StepTimer=3. However
    StepTimer is a halfword (ldrh/strh), the proposal wrote HitElement as a halfword too (strh r0,[r7,#HitElement])
    but AttackElement was stored as a byte (strb) - a minor inconsistency. More importantly, this routine
    is called from the broader AI attack handler (the oAIAttackVars context and HitElement suggest a generic
    panel-move step), not specifically a ''boss'' attack. A more general name fits better.; run wf investigate
    investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
