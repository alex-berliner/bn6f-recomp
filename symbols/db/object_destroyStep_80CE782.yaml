open_questions:
- Which CurAction value(s) actually flow through this function — table only has one entry currently (`sub_80CE7C4+1`),
  so most action indices likely never reach the dispatcher; the destruction branch dominates.
- What sub_80CE7C4 does and why CurAction 0x04 is the special case (entry captured shows r0=4 on every
  path).
- Whether the `0x0f800000` mask is "halt collision" or "force destroy" — `bne loc_80CE7B2` only says "if
  set, take the destroy branch".
