name: background_drawSceneSection_81275A8
address: '0x081275A8'
kind: function
status: confirmed
summary: Redraws an 11x8 block of the background (tile block 3) at a row determined by a scene-state page index
  plus 0x11.
interface: void background_drawSceneSection(void* state /* r5 = scene/background state struct */); r4, r6, r7, r10
  are also passed by callers but unused inside; r4-r7 preserved
details: "Reads a signed byte page/screen index from state+0xD, adds 0x11 to get the\ndestination row (j), then\
  \ calls CopyBackgroundTiles with:\n  j = state[0xD] + 0x11 (destination row),\n  i = 3 (destination column),\n\
  \  tile block = 3 (which 32x32-pixel tile-block of the BG to fill),\n  tile_ids = byte_8126930 (table of tile\
  \ ids to blit),\n  j_size = 11 (blocks tall),\n  i_size = 8 (blocks wide).\nSo it paints a fixed 11x8-tile-block\
  \ window starting at row 17, column 3 of\ntile block 3, using the tile-id table byte_8126930, shifted vertically\
  \ by\nthe page index stored in the state struct. Only r5 is actually used; the\ncaller's r4-r7 are preserved purely\
  \ as work-register courtesy (the callee\nbriefly reuses r4/r5 for CopyBackgroundTiles arguments and restores them).\n"
