open_questions:
- The exact meaning of off_808FEA0 -> off_808FDB8 (r5); presumably a shared weather-cutscene state object,
  but offset/struct unknown.
- What r1 ("sub_809019C")'s r5 state and r10 tell sub_809005C/80900C8 — i.e. which sub-state they collectively
  update.
- What criterion sub_8090104 uses to pick a script (map? weather? progress flags?). Resolving it would
  let us rename this driver more confidently.
