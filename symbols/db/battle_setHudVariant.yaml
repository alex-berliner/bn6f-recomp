name: battle_setHudVariant
address: '0x0801E474'
kind: function
status: probable
summary: Sets the HUD variant (0..2) in eStruct2035280+0xB, queues the matching GFX transfer list, marks
  the HUD dirty (0x3F at +0x0), and dispatches bit 0x1000.
interface: (r0 = variant index 0..2) -> r0 = dispatch_801DA48(0x1000) result; touches eStruct2035280 bytes
  +0xB and +0x0
details: Stores r0 into eStruct2035280+0xB, then uses it as an index (r0*4) into a 3-entry table at off_801E4A0
  whose entries (off_801EF30/EF4C/EF68) are graphics transfer lists passed to QueueGFXTransfersInList.
  It then writes 0x3F to eStruct2035280+0x0 (likely a redraw work/counter byte), ORs bit 0x1000 into the
  request dword at +0x40 via eStruct2035280_SetRequestBits_801BECC, and finally calls dispatch_801DA48
  with 0x1000 so the flagged request is processed. No bounds check on r0; out-of-range values read garbage
  pointers from the table.
