  date: '2026-10-18'
  detail: 'strb r0,[r1,#0xb] saves the variant selector into eStruct2035280+0xB; lsl r0,r0,#2 + ldr r0,[r1,r0]
    indexes off_801E4A0''s three list pointers; bl QueueGFXTransfersInList queues the chosen list''s VRAM
    copies; strb #0x3F,[eStruct2035280] then SetRequestBits(0x1000) flags HUD redraw state; bl dispatch_801DA48(0x1000)
    services the just-set request bit'
