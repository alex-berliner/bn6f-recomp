name: battle_collisionSetPackedParam
address: '0x0801A4D0'
kind: function
status: probable
summary: Writes (r1<<8)|r0 as a packed halfword into collision-data field +0x12 of the battle object in
  r5; used by spawn/init handlers to stamp a two-byte param tag (e.g. high type, low sub-param) onto a
  new collision block.
interface: (r0 = low byte param, r1 = high byte param; r5 = battle object) -> r0 = 0x12; no flag significance
details: Loads r5's collision-data pointer (oBattleObject_CollisionDataPtr), computes (r1<<8)|r0, and
  strh's it at collisionData+0x12, then returns r0=0x12 (the mov r0,#0x12 doubles as the return value).
  All known callers are battle-object spawn/initialization routines (snake-arm spawn, chained-collision
  init, table-defined move/hazard init), so this field is set once at object creation from per-object
  definition data. The packed high/low byte layout suggests two small fields sharing a halfword (e.g.
  a type/id plus a sub-param). It touches only that one collision-data halfword; no other object state
  is modified.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r3,[r5,#oBattleObject_CollisionDataPtr] + strh r1,[r3,#0x12] shows it writes collision data
    field 0x12 of the r5 object; lsl r1,#8; add r1,r0 packs r0 into the low byte and r1 into the high
    byte of the stored halfword; callers 0x080D6A44/0x080D80B4/0x080D6952 are all object spawn/init handlers
    setting collision params from definition tables; mov r0,#0x12 left in place means the function returns
    the field offset in r0
