name: resetBattleBuffers_801BE70
address: '0x0801BE70'
kind: function
status: confirmed
summary: Resets a battery of battle-related RAM buffers to zero and initialises the main one.
interface: void sub_801BE70(void)
details: 'Zeros three RAM blocks via ZeroFillByWord: a 0x60-byte struct at eStruct2035280 (the

  primary battle state buffer), a 0x30-byte block at dword_20352E0, and a 0x50-byte block

  at byte_203EB50. After zeroing, it initialises two halfword fields of eStruct2035280:

  +0x22 = 0x20 (a count/cap of 32) and +0x26 = 0xFFFF (an unsigned sentinel). It then clears

  two dword pairs: dword_203CA48 (8 bytes total) and dword_20367E0 (4 bytes). Returns via

  `pop {pc}`, with r3 preserved across the call. No inputs/outputs other than the implicit

  return address in lr.

  '
