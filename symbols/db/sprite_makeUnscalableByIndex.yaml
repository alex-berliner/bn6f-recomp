name: sprite_makeUnscalableByIndex
address: '0x0811A968'
kind: function
status: probable
summary: Looks up an object/sprite entry by index in the 0x58-byte struct array at 0x2008450 and resets
  its scale counter, rebuilding it as unscalable.
interface: (r0 = index into eStructArr2008450) -> entry fetched via getStructFrom2008450 (status byte
  in r0, entry pointer in r1, kept in r5); then sprite_clearScaleCounterAndMakeUnscalable_804668A clears
  the scale/cycle counter byte; flags from the callee
details: 'The function is a two-call wrapper: it passes an index to getStructFrom2008450, which reads
  the first (in-use/status) byte of the corresponding 0x58-byte entry of eStructArr2008450 and returns
  with the entry pointer in r1. r1 is copied to r5, then sprite_clearScaleCounterAndMakeUnscalable_804668A
  is invoked, which zeroes the sprite''s scale/cycle counter byte and rebuilds the sprite so it can no
  longer be scaled. The function adds nothing else, so its purpose is exactly ''reset this entry''s sprite
  scaling''. The three callers at 0x812CC44/0x812E440/0x812FAE4 presumably invoke it per entry when an
  effect ends. The mov r5, r1 is odd since r5 is never used afterwards; it may exist to satisfy a calling
  convention of the callee or be a compiler artifact.'
