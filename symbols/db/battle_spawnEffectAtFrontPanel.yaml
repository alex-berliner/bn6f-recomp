name: battle_spawnEffectAtFrontPanel
address: '0x08108E64'
kind: function
status: probable
summary: Spawns one of two effect objects on the panel directly in front of a battle object, choosing
  the effect id from a small table and mirroring it by facing.
interface: (r0 = effect index into table dword_8108E94, r5 = battle object ptr from caller) -> r0 = spawned
  effect object ptr; flags from spawn call
details: Reads a base effect id (0x39 or 0x3A) from table dword_8108E94 using the r0 index, then adds
  object_getFlip() shifted left 8, so the final effect id is 0x39/0x3A or 0x139/0x13A depending on horizontal
  facing. It reads the object's PanelX from oBattleObject_PanelX (r5 set by the caller), adds object_getFrontDirection()
  (+1/-1) to target the adjacent panel in front, converts that panel column/row to 16.16 fixed-point pixel
  coordinates via object_getCoordinatesForPanels, and calls spawn_t1_0x0_EffectObject (effect type 0)
  with r3 = 0x100000. The flip<<8 trick means the effect sprite has mirrored variants 0x100 apart in the
  effect table.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r4,[r1,r0] with r1=off_8108E90 loads base id {0x39,0x3A} from the index argument; lsl r0,#8
    after object_getFlip and add r4,r4,r0 gives a flip-mirrored effect id; add r0,r0 (frontDirection),[r5,#oBattleObject_PanelX]
    targets the panel in front of the object; bl object_getCoordinatesForPanels then spawn_t1_0x0_EffectObject
    spawns the effect at those pixel coords; three callers (sub_8108602/8108688/810887A) invoke it in
    the same battle module, consistent with a shared spawn-effect helper
