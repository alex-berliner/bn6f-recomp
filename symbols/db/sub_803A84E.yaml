name: sub_803A84E
address: '0x0803A84E'
kind: function
status: confirmed
summary: Mark a battle object's main action as performed, clear its sub-state, and reset state byte to 0.
interface: 'void battlerFinishAction_803A84E(void* r5); clobbers: r0, N/Z flags'
details: "Operates on a battle-object struct pointed to by r5. Writes:\n  - byte at +0x1E := 1 (flags this object's\
  \ main action as taken).\n  - byte at +0x1C := 0 (clears the sub-action / sub-state slot).\n  - byte at +0x02\
  \ := 0 (resets the object's state field), with r0 := 0 producing the NZ flag result.\nTail-returns via `mov pc,\
  \ lr`, so it is a simple void state-finalizer used as a leaf handler.\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
