name: ai_hitReactDispatchByElement
address: '0x080EDAE0'
kind: function
status: probable
summary: 'AI behavior step: reacts to being hit by dispatching on the hit''s element, then conditionally
  performs a chip attack.'
interface: (r7 = AI data block of the acting battle object) -> r0 = destroyed; tail-dispatches through
  a per-element handler table, may call ai_useChipAttack(r1=0, r2=0).
details: Loads the hit-element field from the object's AI attack vars at [r7,#oAIAttackVars_HitElement]
  and uses it to index a 3-entry handler table (off_80EDB08), invoking the handler with the classic 'mov
  lr, pc; bx r1' THUMB dispatch. After the handler returns, it reads the AI-data flag at offset 0x44 via
  GetAIData_Unk_44_Flag and tests it against mask 0x8600 (bits 9, 10, 15); if any set, it calls ai_useChipAttack
  with r1 = r2 = 0, i.e. triggering the AI's chip attack with default/empty attack variables. One of the
  three handlers is ai_attackSpawnFrontPillarRegion, so the element-dependent reaction spawns a front-row
  pillar attack; the other two handlers (sub_80EDB14, sub_80EDC78) are unrenamed. No caller is known,
  so the owning enemy and trigger context are inferred only from the callees.
