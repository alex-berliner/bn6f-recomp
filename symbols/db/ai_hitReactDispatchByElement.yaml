open_questions:
- Which enemy's AI script invokes this (no caller known) and in what context (on-hit tick vs. periodic).
- What sub_80EDB14 and sub_80EDC78 (the other two element handlers) actually do.
- The meaning of the 0x8600 bit mask tested against the offset-0x44 AI flag, and what r1/r2=0 means for
