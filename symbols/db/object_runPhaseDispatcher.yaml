name: object_runPhaseDispatcher
address: '0x080D41B6'
kind: function
status: probable
summary: 'Guarded phase dispatcher for one battle object: if the battle is not time-stopped, jumps to
  one of two per-phase handlers indexed by the object''s current phase.'
interface: (r5 = battle object) -> r0 = handler return; flags from handler/tst
details: Calls battle_isTimeStop; if the time-stop battle flag (bit 2) is set it returns immediately,
  freezing the object. Otherwise it loads the object's CurPhase byte at oBattleObject_CurPhase from r5,
  uses it to index a two-entry table at off_80D41D0, and tail-calls the selected handler with lr = pc
  so the handler returns straight back to this function's caller. Phase 0 goes to sub_80D41D8, phase 1
  to sub_80D41E8; the table lives right after the code. r5 is not set up here, so the caller must have
  the object pointer in r5 before calling — a common convention in this engine's object routines.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_isTimeStop; tst r0,r0; bne locret_80D41CA — early return when time-stop is active;
    ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0] — dispatch index comes from the battle object's
    phase field; off_80D41CC = off_80D41D0, table entries sub_80D41D8+1 and sub_80D41E8+1 — exactly two
    phase handlers; mov lr,pc; bx r1 — tail-call so the handler returns directly to the original caller
  refs:
  - bn6f/asm/asm31.s:61711
  - 0x0800A098 battle_isTimeStop
  reproduce: python3 tools/asmcat.py 0x080D41B6
