name: submenu_subchip_dispatch_812407C
address: '0x0812407C'
kind: function
status: confirmed
summary: Runs one phase step of the sub-chip submenu (dispatch on state phase byte) then refreshes entities, scene
  strips and background.
interface: void submenu_subchip_runPhase_812407C(struct UnkSubMenu* state /* r5 */)
details: 'Reads phase = state[2] (byte), shifts it right by 2 (phase/4, likely phase*4 bytes per tick subdivided),
  and dispatches via jt_81240A0 to one of seven submenu_subchip_* handlers (addresses 81240BC..8124340). The handler
  is entered in an unorthodox way: mov lr, pc; bx r0, so the handler runs with r0 = its own Thumb jump-table entry
  and r1 = the phase byte, while pc-relative lr lets it "return" into the code right after the bx. After the handler,
  calls entity_runAllUpdateHandlers_80465BC, sub_80465F8, sub_812453C, and background_updateSceneStrips_812475C
  to advance entity update handlers and redraw the affected screen strips. State struct: field at +2 is the phase
  counter. Outputs r8-r12 according to the contract, consistent with callee-saved usage by guests.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
