name: battle_objDispatchCurAction
address: '0x080B9FA6'
kind: function
status: probable
summary: Calls the per-action handler for a battle object, selected by its current action id.
interface: (r5 = battle object) -> tail-calls handler for [r5+oBattleObject_CurAction]; returns handler's
  result
details: Reads the object's CurAction byte and uses it to index an 8-entry table of Thumb handlers (off_80B9FB8),
  then jumps to the selected routine via bx with lr set to pc so the callee can return straight to this
  function's caller (pop {pc}). The object pointer stays in r5, so the handlers operate on the same battle
  object. Entries include battle_stepAdvanceColumn and battle_objMoveToPanelPhase alongside six unnamed
  handlers, indicating this object's actions are movement/attack behaviors dispatched once per update
  step.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; bx r1 — dispatch on the object's current
    action field; table off_80B9FB8 holds 8 Thumb code pointers (Thumb bit set via +1) including battle_stepAdvanceColumn
    and battle_objMoveToPanelPhase; mov lr,pc / bx r1 / pop {pc} makes this a transparent tail-dispatch
    preserving the caller's return path
