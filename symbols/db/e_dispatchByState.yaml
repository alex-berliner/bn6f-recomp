name: e_dispatchByState
address: '0x0811E6C0'
kind: function
status: probable
summary: Dispatches one of three update handlers for eStruct2001010 based on the state byte at [r5,#8].
interface: (r5 = object/work struct; r1 = state = [r5,#8]) -> tail-call via 'mov lr, pc; bx r0' into off_811E6D4[r1];
  sets r6 = eStruct2001010 for the handler
details: Loads the global eStruct2001010 pointer into r6, then reads a state index from [r5,#8] and looks
  it up in a 3-entry jump table (sub_811E6E4, sprite_resetToCenter, sub_811E73C). The 'mov lr, pc; bx
  r0' trick makes the call return straight to this function's own caller, so it acts as a transparent
  state-machine dispatcher. One handler is the known sprite_resetToCenter, suggesting the states drive
  sprite/entity behavior of the object owning r5. With no callers or handler summaries available, the
  actual game role of the object and struct cannot be determined.
