status: probable
summary: Tail-call wrapper around battleObject_runUpdateRoutineAndAdvancePC_814E0D0 that also sets CurPhase
  = CurPhase | 0x0C on the caller-supplied AIState and returns the original object pointer in r0.
interface: '(r0 = BattleObject*, r1 = AIState*) -> r0 = same BattleObject* ; side effects: writes CurPhase
  (offset 0xA) and the bottom-of-AIState byte (offset 0x0) of *r1.'
details: "Saves lr into r12, then jumps to sub_814E0D0 (the function summary in the callee contract\n\
  \  describes it as \"run update routine and advance PC\"; given r3 is in/out there it returns\n  the\
  \ next-action/state byte in r3 with flags set). After that call:\n    - r3 is stored at [r1,#0xa] —\
  \ this is `CurPhase` of the AIState struct (offset 0xa\n      per ai_state_struct).\n    - r1's byte\
  \ 0 (`Unk_00` of AIState) is loaded, ORed with 0x0C, and stored back. 0x0C sets\n      bits 2 and 3,\
  \ which on `CurState`/`CurAction` of the BattleObject look like a\n      \"phase initialised\" / \"\
  waiting on a sub-action\" marker; in practice this just marks\n      the AIState as having been stepped\
  \ once.\n  r0 is never touched, so the caller gets its BattleObject pointer back unchanged.\n  Ends\
  \ with `bx r12` which is the saved lr — i.e. this is a tail call.\n  Captured calls show r0 = a BattleObject*\
  \ (0200xxxx), r1 = an AIState* (0200xxxx),\n  with the AIState address slot at +0x2C of the BattleObject\
  \ matching Unk_5c/AIDataPtr\n  layout seen elsewhere. The struct written by sub_814E0D0 at [r0 + 0x5c]\
  \ for the AIDataPtr\n  lines up with the AIData at +0x58 of BattleObject.\n"
