name: battle_objectStatePendingCommit
address: '0x08016B36'
kind: function
status: probable
summary: 'Battle-object state handler: initializes a phase once (sound 0x18, reset collision), then waits
  for object flag 0x10000 to clear before committing the pending state action.'
interface: (r4/r5 = battle object ptr, no args) -> void; no meaningful return value
details: On first invocation (oBattleObject_PhaseInitialized == 0) it clears ObjectFlags bit 0x100000
  via object_clearFlag, calls sub_800F3B0, resets the object's collision state, zeroes oBattleObject_RelatedObject1Ptr,
  plays sound effect 0x18 (0x19-1), and stores 4 into oBattleObject_PhaseInitialized. On every call afterwards
  it reads the object's flags via object_getFlag and, while bit 0x10000 (r1 = 1<<16) is set, returns without
  doing anything. Once that bit is clear, it copies oBattleObject_PendingStateAction into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and zeroes the pending field, i.e. it commits a queued state/phase transition. r5 is the battle object
  base pointer throughout; the function relies on the caller having pre-filled PendingStateAction.
