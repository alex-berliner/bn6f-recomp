- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r5,#oBattleObject_PhaseInitialized] + bne guards the one-time init block (lines 2-4);
    init block: object_clearFlag(0x100000), battle_resetCollisionState, RelatedObject1Ptr=0, PlaySoundEffect(0x18),
    PhaseInitialized=4; object_getFlag then tst with 1<<16 and bne locret = busy-wait while flag 0x10000
    is set; PendingStateAction is copied into CurStateActionPhaseAndPhaseInitialized and cleared only
