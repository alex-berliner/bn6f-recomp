name: sub_8137884
address: '0x08137884'
kind: function
status: hypothesis
summary: Returns a byte selected by index from a lookup table stored in IWRAM at 0x20018EC.
interface: u8 getByteFromTable_20018EC(u8 index) // r0 = index in, r0 = table[index] out; flags untouched (tail
  'mov pc, lr')
details: 'Tiny thumb helper: loads the fixed table pointer 0x20018EC (IWRAM) from the literal pool,

  reads the byte at table[r0], and returns it via ''mov pc, lr'' (no stack frame, no flags

  affected since it does not restore CPSR-style state). The table lives in IWRAM, so its

  contents are written at runtime by other code; the meaning of the index and of the returned

  byte depends entirely on what populates unk_20018EC. With only this one-line body and no

  callers inspected here, the table''s game purpose (e.g. an array of flags, IDs, or counters)

  is unknown. Callers clobber r1 is not visible from this body alone but matches the lifted

  contract (r1 used for the pointer).

  '
