name: get_weightedRandomIndex
address: '0x0802C8B0'
kind: function
status: probable
summary: Picks a random index from a byte-weight table, weighted by each entry's value.
interface: (r0 = pointer to byte weight table, r1 = total sum of weights) -> r0 = selected index; destroys
  r1-r3, r7
details: 'Calls GetPositiveSignedRNG, shifts the result right by 8, then uses SWI 6 (Div) with r1 to compute
  (rng>>8) mod r1, giving a uniform remainder in [0, r1). It then walks the byte table at r0, subtracting
  each entry from the remainder until the value goes negative, and returns that entry''s index in r0.
  This implements weighted random selection where each byte is its entry''s weight and r1 must equal the
  sum of all weights. Quirk: caller must supply the weight total; the function does not compute it.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl GetPositiveSignedRNG + lsr r0,#8: draws a random number as the source of randomness; svc
    6 with r0=rng>>8, r1=arg: SWI Div leaves (rng>>8) mod arg in r1, a uniform value below the total;
    loop at loc_802C8C6: ldrb r2,[r7,r0]; sub r1,r1,r2; blt exit — subtracts successive byte weights until
    negative; return path leaves the loop counter r0 in r0, i.e. the index of the weight bucket that absorbed
    the remainder'
