name: npc_doHopMovement_809e8cc
address: '0x0809E8CC'
kind: function
status: confirmed
summary: Dispatches an overworld NPC's hop/leap movement handler (init/update × hop/leap/diagonal leap) selected
  by oOverworldNPCObject_MovementFlag_0a, then runs its secondary script.
interface: void npc_runHopMovement_809e8cc(struct OverworldNPCObject *npcObj /* r5 */); /* returns r0, leaves nz/c/v
  from npc_runSecondaryScriptMaybe_809ebf8 */
details: 'Reads the NPC object''s oOverworldNPCObject_MovementFlag_0a byte (offset 0x0A) and uses

  its raw value as a word index into the 6-entry jump table at jt_809E8E0 (entries at

  offsets 0, 4, 8, 12, 16, 20 corresponding to flag bytes 0/4/8/12/16/20). The table

  holds Thumb entry+1 targets (BX) for: npc_initHopMovement_809e8fc,

  npc_updateHopMovement_809e916, npc_initLeapMovement_809e944,

  npc_updateLeapMovement_809e95e, npc_initDiagonalLeapMovement_809e9c0,

  npc_updateDiagonalLeapMovement_809e9da. After the dispatched handler returns,

  npc_runSecondaryScriptMaybe_809ebf8 is unconditionally invoked. The function is

  a leaf (push {lr} / pop {pc}) and relies on the dispatched handler to honour

  the r0/r7 ABI described in the readable C.

  '
