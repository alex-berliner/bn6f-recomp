name: ai_dispatchHitElementFunc
address: '0x080EDF5C'
kind: function
status: probable
summary: Dispatches to one of two handlers based on the AI attack's hit element
interface: (r7 = AI attack vars struct) -> tail-call to table[HitElement] (sub_80EDF78 or sub_80EDFC0); r0 passes
  through
details: Reads a byte at [r7, oAIAttackVars_HitElement] and uses it as an index into a 2-entry function-pointer
  table at off_80EDF70, then makes a long-call (mov lr, pc; bx r1) so the callee's return goes through pop {pc}.
  Entry 0 is sub_80EDF78 and entry 1 is sub_80EDFC0, so the field is treated as a 0/1 flag here. r0 is not otherwise
  set up, so the callee presumably receives whatever was in r0 on entry. No callers are known, and neither callee
  is documented, so what the two branches do is unknown.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0, [r7,#oAIAttackVars_HitElement]; ldr r1, [r1,r0] indexes the table by the hit-element byte; mov
    lr, pc; bx r1 with pop {pc} is the standard ARM/Thumb long-call tail dispatch; off_80EDF70 holds exactly two
    words, sub_80EDF78+1 and sub_80EDFC0+1, bounding the index to 0/1
  refs:
  - bn6f/asm/asm31.s:118848
  reproduce: python3 tools/asmcat.py 0x080EDF5C
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree; run wf investigate
    investigate-20261019-052112'
open_questions:
- no callers known, so the purpose of the dispatch and what r7 actually points to is unconfirmed
- the two callees sub_80EDF78 and sub_80EDFC0 are undocumented, so the meaning of hit-element values 0 and 1 here
  is unknown
