name: sprite_renderCharGlyph
address: '0x08137F5C'
kind: function
status: probable
summary: Clears a sprite/OAM work buffer and rebuilds it from a single character code looked up in a table,
  then finalizes it into OAM entries.
interface: (r0-r4 undefined on entry, caller sets r5 = object/struct; reads [r5+0x24] as a 16-bit char/index)
  -> r0 = undefined; buffer unk_2017C68 rebuilt
details: First zeroes 0x54 halfwords (0xA8 bytes, ~21 OAM slots) at unk_2017C68 via ZeroFillByHalfword,
  so the buffer holds sprite/OAM data. It then reads a halfword at [r5+0x24] of the caller's struct (likely
  a character/emote/tile index) and calls sub_8137F8C with that index, the table unk_201CF00, the buffer,
  and constants 7 and 0 — consistent with expanding one glyph/index into the buffer using fixed width/params.
  Finally sub_813808C is called with (0x1A, 4, buffer), plausibly committing the built entries to OAM
  with a base tile/palette. Both callers (battle_initRoundState, submenu cursor handler) pass an object-like
  struct in r5, so this is a shared draw-one-glyph helper used when initializing or refreshing a displayed
  sprite.
