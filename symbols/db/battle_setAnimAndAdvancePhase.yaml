name: battle_setAnimAndAdvancePhase
address: '0x080BEF02'
kind: function
status: probable
summary: 'Battle object phase handler: on first entry sets animation 0 (r0 = battle object base via oBattleObject_ExtraVars+4,
  r1 = 0) and a 10-frame timer; when the timer expires writes 0x20 to oBattleObject_CurAction and clears
  oBattleObject_CurPhaseAndPhaseInitialized.'
interface: (r0 = anim index (always 0), r1 = 0; r5 = battle object) -> r0 = clobbered; sets object action/phase
  fields
details: On first entry (PhaseInitialized == 0) it calls battle_setObjectAnim with anim 0, stores a 10-frame
  timer at oBattleObject_Timer, and marks the phase initialized (0x04). Every subsequent call decrements
  the timer; once it hits zero it writes 0x20 to oBattleObject_CurAction and clears oBattleObject_CurPhaseAndPhaseInitialized,
  so the object's action machine moves to action 0x20 and re-enters phase 0 next tick. This is a standard
  'idle/wait then transition' phase step; the r5 base and offsets come from the battle object struct used
  throughout the battle engine.
