open_questions:
- Whether this is the EXE 6 *Cannon* (rolling projectile across enemy/own row) vs a SnakeArm variant;
  the table at byte_80CC0D0 (HP) would identify the exact chip/element. Decompiling the caller to see
  which object index dispatches here with which Param1 values would confirm.
