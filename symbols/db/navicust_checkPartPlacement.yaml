name: navicust_checkPartPlacement
address: '0x081364BC'
kind: function
status: probable
summary: On the Navi Customizer board, looks up the part under the cursor/grid cell and validates it (via sub_813BAEC)
  as part of confirming the placement.
interface: (r5 = naviCust screen state; r0/r1 unused) -> r0 = part id (cell id - 0x90, only if occupied), flags
  Z/N set from validator result in r1 (NZ = invalid)
details: r5 is the customizer screen/work struct. It sums the two halfword coordinates at +0x38 and +0x3a and calls
  sub_8136290, which returns a pointer to a board-cell record (offset 0 = value, offset 2 = occupancy/flag halfword).
  If the cell is empty (+2 == 0) it returns immediately with no flags meaningfully set. Otherwise it takes the cell's
  id at +0, subtracts 0x90 to turn it into a part index, and calls sub_813BAEC with r0 = index, r1 = [r5+0x44] (likely
  the grid/placed-parts buffer), r2 = [r5+0x28] and r3 = [r5+0x2c] (likely grid dimensions). It moves the validator's
  result to r1, restores the part index in r0, and leaves Z set from tst r1,r1, so the caller can branch on success/failure
  to play select vs error sounds.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: caller 0x08136450 navicust_confirmPartPlacement confirms part placement, redrawing board and playing select/error
    sounds — matches a validity check before commit; sub_8136290 called with sum of [r5+0x38]+[r5+0x3a] returns
    a record whose +2 halfword gates the rest (cell occupancy); sub r0,#0x90 after loading [cell+0] converts a stored
    id into a part index (customizer part id range starts at 0x90); sub_813BAEC gets index plus [r5+0x44]/[r5+0x28]/[r5+0x2c]
    and its return is only tested (tst r1,r1), i.e. a boolean validity/fit check; returns r0 = part index while
    preserving Z from the validator, so caller can both act on the part and branch on success
