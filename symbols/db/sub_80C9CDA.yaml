name: sub_80C9CDA
address: '0x080C9CDA'
kind: function
status: confirmed
summary: Spawns a battle object of spawn type 0x2F via object_spawnType3 and, if one was created, finishes it with
  BasicBattleObjectInitialize.
interface: void battle_spawnAndInitObject2F(in u32 r0, in u32 r1, in u32 r2, in u32 r3, in u32 r4, in u32 r6; out
  u32 r1, out u32 r2, out u32 r5; clobbers r0, r3, lr, flags)
details: 'A thin battle-side spawn wrapper. It pushes r0-r2/r5, sets r0 = 0x2F (spawn

  type/kind 47) and calls object_spawnType3 with the caller''s r1-r4 passed

  through unchanged as spawn parameters. The spawn''s result is returned in

  r5: a non-zero value is the new object pointer/handle, zero means nothing

  was spawned. If the spawn succeeded (branch on the flags object_spawnType3

  left), the new object in r0 is passed to BasicBattleObjectInitialize with

  r1 = the caller''s original r0, r2 = the caller''s original r1 (restored by

  the pop), r3 = 0, r5 = the caller''s original r5, and r6 = whatever the

  spawn left in r6. If the spawn failed, initialization is skipped entirely

  and the function returns immediately. The stack trick (push {r0-r2,r5} /

  pop {r1-r3,r5}) means on exit r1 = old r0, r2 = old r1 and r5 = old r5, so

  the caller''s first two arguments end up shifted down one register; r3 also

  receives old r2 on the failure path before the early return. r4/r6/r7 are

  left holding whatever the callee(s) left behind. The 0x2F spawn kind is

  presumably a specific battle entity (object/obstacle/effect) defined by

  object_spawnType3''s dispatch table.

  '
