summary: Per-frame battle handler that drives the Custom Gauge state machine (initial copy-in, normal/custom-condition
  branch and gauge-state writes) for the active battle.
interface: '(in: r5=cur state byte, r8..r12=toolkit/BattleState-preserved) -> r0 = pointer to eStruct2036780
  ; side effects: writes eStruct2083197D8 (offsets 0 and 1), may copy 0x10 bytes from unk_20399F0/unk_2039A00
  into eStruct2036780.'
details: "1. Loads eStruct2083197D8 (off_80200D8) and snapshots `eStruct2083197D8[1]` into r6, then forces\
  \ `eStruct2083197D8[1]=2` (a \"running\" marker).\n  2. If `eStruct2083197D8[0]==0`, the gauge system\
  \ has not been initialised yet: it falls into loc_801FED2 and copies 0x10 bytes from `unk_20399F0` into\
  \ `eStruct2036780`, then 0x10 bytes from `unk_2039A00` into `eStruct2036780`. After this, eStruct2083197D8[0]\
  \ is left non-zero on next visits so the init branch is skipped.\n  3. Otherwise (running), tests story\
  \ flag EVENT_172D via `TestEventFlagFromImmediate`. If the flag is set (branch loc_801FEB6), it restores\
  \ `eStruct2083197D8[1]=r6` and:\n     - Calls `GetBattleEffects`. If effect bit 0x8 is *not* set, runs\
  \ `sub_803DEB4` and stores its return value into `eStruct2083197D8[1]` (the normal state transition\
  \ path).\n     - If effect bit 0x8 *is* set, keeps `eStruct2083197D8[1]=r6`.\n  4. If the flag is clear\
  \ (loc_801FEB0 branch), it then queries `sub_8144D04(0)`. If that returns 1 and `sub_8144D04(3)` also\
  \ returns 1, the function returns with the gauge untouched. Otherwise it forces `eStruct2083197D8[1]=4`\
  \ (special \"force-set\" gauge state).\n  5. `r0` exit value is `eStruct2036780` (loaded in loc_801FED2\
  \ via off_80200E4 and left in r0 across the pop {pc}); captured calls show r0=0x02036780 matching that\
  \ label.\n  6. The callees paint a clear \"story flag + battle effect + cross-checks two debug/condition\
  \ queries\" pattern consistent with Custom Gauge's \"should we use the player's saved gauge or compute\
  \ a new one?\" decision.\n"
