name: battle_tickCollisionHighlight_80C7D08
address: '0x080C7D08'
kind: function
status: confirmed
summary: 'Per-frame tick for a battle object''s collision-highlight state machine: initialises phase 4
  on first entry, re-highlights the object''s panel each frame, clears the collision region when hit or
  when short timer expires, and destroys the object when the main timer reaches zero.'
interface: u32 battle_tickCollisionHighlight_80C7D08(r5 = battle_object_ptr) -> r1 (pass-through from
  callee)
details: 'CurPhase byte at oBattleObject_CurPhase: if zero (first frame) sets CurPhase=4, oBattleObject_Timer=0xF
  (15 frames main lifetime), oBattleObject_Timer2=0xA (10 frames highlight window).  On subsequent frames:
  reads oBattleObject_CollisionDataPtr -> oCollisionData_FlagsFromCollision; if non-zero (object was hit
  by a bullet or attack) calls object_clearCollisionRegion.  Then calls object_highlightPanel with oBattleObject_PanelX/PanelY
  to keep the panel flash visible.  Decrements oBattleObject_Timer2; on reaching zero clears the collision
  region again (highlight window ended).  Decrements oBattleObject_Timer; on reaching zero clears the
  collision region a final time and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  signalling the main loop to remove this object next update.  r1 is written to on the first-frame path
  (set to 4) and otherwise carries the return value of whichever callee last touched it.  nz flags are
  clobbered by the sub/bgt pairs; lr is saved/restored.

  '
