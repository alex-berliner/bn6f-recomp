name: battleObjectFindPanelAndWait
address: '0x080BA054'
kind: function
status: probable
summary: Scans forward for an occupied panel, then waits before advancing the battle object's action state.
interface: (r0 = battle object pointer, r5 = same battle object pointer) -> r0 = unchanged; flags are
  caller-clobbered
details: On phase 0, it sets the object's phase to 4, searches for the nearest column in front with a
  nonzero panel result, and records that column in Param2. If a column is found, it starts animation 0x14
  and sets a timer of 10. On phase 4, it decrements the timer and changes the current action to 0x0C after
  it expires; if no panel is found, it changes the action to 0x10 immediately and clears phase initialization.
