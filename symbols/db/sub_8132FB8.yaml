name: sub_8132FB8
address: '0x08132FB8'
kind: function
status: hypothesis
summary: Copies a halfword selected by index from a caller-provided table into field +8 of the struct behind the
  toolkit's oToolkit_Unk200a220_Ptr
interface: void sub_8132FB8(u16 index /*r0*/, const u16 *table /*r1*/); reads toolkit from r10; no return value
details: 'Trivial setter/lookup helper: loads the halfword at [r1 + r0] (r0 is an index/offset into a

  halfword table passed in r1, so r0 may be a byte offset, not an element index), zero-extends it

  via ldrh, then fetches the pointer at [r10 + oToolkit_Unk200a220_Ptr] (the toolkit''s pointer to

  the IWRAM/ERAM struct at 0x0200a220-area) and stores the 32-bit (zero-extended halfword) value

  at structPtr + 8. No other fields of the target struct are touched, and the table itself is only

  read. The purpose of struct+8 and where the table comes from are not evident from this function

  alone; callers presumably pass a per-state lookup table. r4-r7/lr are only pushed/popped for

  alignment/ABI and are unused.

  '
