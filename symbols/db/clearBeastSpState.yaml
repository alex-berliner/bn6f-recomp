name: clearBeastSpState
address: '0x081375D8'
kind: function
status: probable
summary: Resets a small beastsp state record (zeroes two bytes) and clears the two event flags EVENT_EE/EVENT_EF.
interface: (r5 = pointer to state struct, set by caller) -> r0 = 0 (from last mov, clobbered by calls);
  flags from ClearEventFlagFromImmediate
details: Writes 0 to byte offsets +2 and +3 of the struct in r5, then calls ClearEventFlagFromImmediate
  twice to clear story/event flags EVENT_EE and EVENT_EF. No other state is touched and no values are
  returned. The function is a plain reset/cleanup routine; r5 must already point at the caller's state
  object since nothing sets it here. All six callers are in the same 0x08136xxx-0x08137xxx beastsp code
  region, so it is likely the shared 'end/reset' path for whatever state those functions manage. What
  EE/EF gate in game terms is not shown here.
