name: object_initAttackState
address: '0x0802EB80'
kind: function
status: probable
summary: Initializes a battle object's attack/state struct (state 0, counter 3, timer 0x23C) and queues
  attack 0x2B via object_setAttack0.
interface: (r6 = object struct pointer, passed implicitly via register) -> r0 = 1 (success); no flags
  used
details: 'Writes to a struct whose base is already in r6 (caller-supplied): byte +2 = 0, byte +3 = 3,
  bytes +4/+5 = 0, halfwords +6/+8/+0xA = 0, and word +0xC = 0x23C (572, likely a frame timer or countdown).
  It then calls object_setAttack0 with r0 = 0x2B (43), which per its name sets/starts attack behavior
  0x2B on the object. The function always returns 1 and is self-contained, reading no other data, so it
  behaves as a reset/initialization routine for one object''s attack parameters.'
