name: object_landingImpactSpawnRegion
address: '0x080D5A9C'
kind: function
status: probable
summary: Spawns the crack/impact collision region on the panel where the landing object touched down.
interface: (r5 = battle object) -> r0 = spawn result; no flags of note
details: Reads the object's PanelX, PanelY and Element fields (oBattleObject offsets) and passes them
  as r0-r2 with r3=0 to object_spawnCollisionRegion, i.e. it spawns a tile-space collision region at the
  panel the object is over, with the element possibly selecting the panel-crack type. The immediate 0x15050A01
  in r4 is a packed constant for the spawn (likely hitbox extents/flags for a one-tile ground region),
  r7=3 is a spawn kind, and r6 carries the object's DamageAndStaminaDamageCounterDisabler word through
  so the spawned region inherits damage/disabler data. Only r4/r6/r7 are preserved across the call, matching
  object_spawnCollisionRegion's clobber set. The caller object_landingImpactState invokes this as part
  of its impact sequence (camera shake, sound, panel crack) and then destroys itself, so this is the one-shot
  'place the cracked-panel hitbox' step.
