name: object_runTypeUpdateThenSpriteUpdate_811A0A4
address: '0x0811A0A4'
kind: function
status: confirmed
summary: Per-frame battle-object update that dispatches on the object's type byte to one of four update handlers,
  then advances the object's sprite state.
interface: void object_runTypeUpdateThenSpriteUpdate_811A0A4(Object* obj /* r5 */); flags N/Z set from the shifted
  type index, C cleared before dispatch
details: "The object struct is passed in R5. The type byte at [R5+4] is shifted left by 2 and used\nas an index\
  \ into a 4-entry jump table at off_811A0BC:\n  entry 0 -> sub_811A0CC\n  entry 1 -> object_runUpdateDispatch_811A190\n\
  \  entry 2 -> sub_811A1E8\n  entry 3 -> sub_811A0CC (same handler as entry 0, so types 0 and 3 share behavior).\n\
  The dispatch is done with the classic \"ldr r0,[table,index]; mov lr,pc; bx r0\" pattern, so\nthe handler is entered\
  \ with R0 = table entry (handler address) and R1 = shifted index\n(type<<2), and returns via LR to the sprite_update\
  \ call. The N/Z flags reflect the shifted\nindex and C is clear at that point (a byte value shifted left by 2\
  \ never shifts a bit out).\nAfter the handler returns, sprite_update is called (no visible arguments set up here,\
  \ so it\npresumably works on the object still in R5 or off a fixed pointer). The routine is wrapped\nin push {lr}/pop\
  \ {pc}: it returns to its own entry LR regardless of what the calls left in LR.\nQuirk: handlers inherit the odd\
  \ side effects of the dispatch idiom (R0/R1 holding the table\npointer and shifted index, LR pointing at the sprite_update\
  \ call) rather than a clean ABI call.\n"
