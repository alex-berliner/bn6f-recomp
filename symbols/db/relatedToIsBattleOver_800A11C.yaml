name: relatedToIsBattleOver_800A11C
address: '0x0800A11C'
kind: function
status: confirmed
summary: When a battle actor leaves (e.g. is deleted), decrement its alliance's member count and clear its entries
  in the alive-actor turn list.
interface: void battle_removeActorFromBattleState(BattleObject *actor /*r5*/, Toolkit *toolkit /*r10*/); returns
  loop count 8 in r2, sets flags from cmp r2,#8; clobbers r0-r2, NZ flags
details: 'Reads the actor''s Alliance byte (r5 + oBattleObject_Alliance) and uses it to index one of the

  alliance member-count bytes at oBattleState_Unk_12 in the battle state (fetched from

  r10 + oToolkit_BattleStatePtr), decrementing that count by one. Then it walks the eight

  u32 slots at oBattleState_AliveBattleActors in the battle state and zeroes every slot that

  points to this actor, so it no longer participates in the alive-actor/turn rotation.

  Quirks: r2 is left holding the loop exit count (8) and flags are set from cmp r2,#8 —

  callers apparently consume c/v, suggesting the contract is unusual or the caller relies on

  the comparison outcome; the count byte index is (alliance + oBattleState_Unk_12), implying

  per-alliance counters laid out consecutively. Returns via mov pc, lr without pushing regs.

  '
