open_questions:
- Whether the byte at the PC is actually treated as an executable address (validated 02xxxxxx) or just
  as an indexed dispatch byte that is then later resolved; the sub_814E0B6 summary says "RAM pointer ...
  valid", but every caller reads it as a tag/index, so the semantics are still ambiguous.
- The exact struct used for [r1+0x40] (attack-script PC in AIAttackVars, or something else) – settled
  by following what the caller wrappers write next to that byte.
