name: battle_DecrementAllianceTimer_802E1D8
address: '0x0802E1D8'
kind: function
status: confirmed
summary: Ticks down (by one per call) the halfword timer at +0x30 of the record sub_802E070 looks up for the given
  battle object's alliance, and returns the new timer value in r1.
interface: u16 battle_DecrementAllianceTimer(void) /* caller sets r5 = battle object ptr; returns r1 = timer after
  decrement (0 if already 0); clobbers r0, flags, lr */
details: 'Called with r5 pointing to a battle object; reads the object''s Alliance field (oBattleObject_Alliance)
  and passes it to sub_802E070, which returns a pointer to some per-alliance record. That record''s halfword field
  at +0x30 is a countdown timer: if nonzero it is decremented by 1 and written back; if it is already 0 it is left
  untouched. The post-update value is returned in r1 so callers can check for expiry (r1 == 0). Only r1 is meaningful
  on return; r0, flags and lr are clobbered (lr is pushed/popped as pc). The record''s other fields are not touched
  here. Because the decrement happens only once per call, callers control the tick rate (e.g. per frame).'
