  reproduce: python3 tools/asmcat.py 0x0804A970
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal captures the structure correctly: it loops [r5+0x1e] times over 0x20-byte entries at
    word_202A020, extracts index from the low 7 bits of entry+0x1c, derives count via lsl #16 / lsr #0x17,
    calls TakeChips, then sub_8048D60 with r0=9 and the entry''s first halfword. However the call order
    is reversed: sub_8048D60 takes r0=9 as a constant code (not ''the entry''s first halfword''; that''s
    the second arg) and r1 = entry[0] halfword as the chip id. The count argument to TakeChips is r0 from
    the shifted word, not r1 — TakeChips is called with (idx=r1, count=r0, off=r2=1). The summary''s phrasing
    ''removing each requested chip'' is fine but the details mislabel the arguments; the name req_takeOrderedChips
    is reasonable.; run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
