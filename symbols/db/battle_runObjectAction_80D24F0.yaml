name: battle_runObjectAction_80D24F0
address: '0x080D24F0'
kind: function
status: confirmed
summary: Marks a battle object as mid-action (sets header flag 0x02) and dispatches to the handler for
  its current action via a jump table.
interface: void sub_80D24F0(r5 = object ptr) -> r5 = object ptr, r8-r12 = results set by the action handler
  (live-register contract); clobbers r0-r4, r6, r7, flags, lr
details: 'Battle-object action dispatcher, run with the object pointer in r5. First it ORs bit 0x02 into
  the object header''s Flags byte (oObjectHeader_Flags), the "action busy / handler running" marker that
  the rest of the battle object code presumably tests to avoid re-entry or to see that an action is in
  progress. It then reads the object''s CurAction byte (oBattleObject_CurAction) and uses it directly
  as a byte offset into the table at off_80D250C — i.e. word-index = CurAction/4, with the entries 4 bytes
  apart, so action value 0 selects sub_80D2514 and action value 4 selects sub_80D255A. The selected handler
  is entered with the classic `mov lr, pc; bx r1` Thumb tail-call, so the handler runs with r0 = CurAction,
  r1 = its own entry address, r5 = the object, and lr pointing back into this function; the `pop {pc}`
  after the return re-enters the caller directly. The handler''s results are left in r5 and r8-r12 (a
  live-register contract that typed C parameters cannot express), and flags nzcv are clobbered. This two-entry
  table variant only supports two action states for this object kind; other object types likely have their
  own copies/tables of this dispatcher pattern.

  '
