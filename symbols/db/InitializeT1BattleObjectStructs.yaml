name: InitializeT1BattleObjectStructs
address: '0x0800353E'
kind: function
status: confirmed
summary: Thin wrapper that resets/initializes all battle object structs of type T1_BATTLE_OBJECT (type 1) for the
  start of a battle.
interface: 'Next InitializeT1BattleObjectStructs(void); // pass-through args: r2, r3, r4 (preserved), r7 (preserved);
  r0 set to T1_BATTLE_OBJECT before tail-calling InitializeStructsOfObjectType; lr saved/restored

  '
details: 'Pushes lr, loads r0 with the object type ID T1_BATTLE_OBJECT (1), and calls InitializeStructsOfObjectType,
  then returns to that function''s caller via pop {pc} (so this is effectively a tail call). r2, r3, r4 and r7 are
  passed through untouched, meaning the real arguments (likely pointers to the struct arrays, counts, or a base
  pointer) are consumed by InitializeStructsOfObjectType. The function itself contains no logic of its own; it exists
  to bind the generic struct-initializer to the "T1 battle object" type used at battle setup. Registers r4 and r7
  are preserved across the call per the contract; r0, r1 and the nzcv flags are clobbered by the callee.

  '
