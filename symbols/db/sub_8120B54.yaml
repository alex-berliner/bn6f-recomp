name: sub_8120B54
address: '0x08120B54'
kind: function
status: confirmed
summary: Maps a chip ID to its style-sub-element override code (6–10) via a fixed ROM lookup table, gated by guard
  byte, battle phase, active effects, and style-swap slot state.
interface: 'style_override_t style_getChipOverrideCode_8120B54(uint32_t chipId /*r2*/, uint32_t in_r3 /*passthrough*/);

  /* r10 = pointer consumed by GetBattleEffects; returns r0 = override code, r3 = column index */

  '
details: "1. Short-circuits to default 0xFF if the global guard byte at EWRAM 0x0200AD04 is zero\n   (notZero_eByte200AD04\
  \ sets Z when byte == 0).\n2. Queries battle phase via sub_803F674. If phase >= 2 (mid/late battle), checks\n\
  \   GetBattleEffects for bit 3 (mask 0x08). When that bit is clear the function calls\n   sub_8144D30 (side-effect\
  \ only) and returns the default 0xFF; when set it continues\n   to the table scan.\n3. Reads link/style-swap slot\
  \ 4 via link_getSlotState_803F740(4). If r1 != 0 the style\n   swap is \"occupied\" and the function returns default\
  \ 0xFF.\n4. Scans a 5-row ROM table at 0x08120BB4 (stride 4 bytes, loop bound 0x18). Each row\n   holds a base\
  \ chip ID: 0x019B, 0x01AA, 0x01B9, 0x01C8, 0x01D7 — consecutive groups of\n   15 (0x0F) chip IDs. For each column\
  \ 0..14 it tests base+col == r2. A match selects\n   the parallel entry from the result table at 0x08120BCC (codes\
  \ 6, 7, 8, 9, 10) and\n   stores the column index in r3.\n5. No match falls through to the last table entry at\
  \ offset 0x14, which is 0xFF, and\n   leaves r3 at 15.\nCallee sub_803F674 clobbers r4–r6; those are preserved\
  \ here via push/pop so the\nregister contract reports them as preserved across the whole function.\n"
