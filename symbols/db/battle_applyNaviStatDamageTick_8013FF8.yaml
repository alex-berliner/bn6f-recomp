name: battle_applyNaviStatDamageTick_8013FF8
address: '0x08013FF8'
kind: function
status: confirmed
summary: Deals a poison-style damage tick to a battle object, sized by its navi stats byte 0x3D, but never dropping
  its HP below 1.
interface: void sub_8013FF8(u32 r4, BattleObject* r5 /* object */, u32 r6); // preserves r4/r6, returns r1/r2 and
  flags from the damage path
details: 'Reads navi stats byte index 0x3D for the battle object in r5 via

  GetBattleNaviStatsByte_AllianceFromBattleObject (the "alliance" lookup,

  so the stat can come from an allied/custom navi rather than the object

  itself). A stat of 0 means no damage at all (early-out). Otherwise the

  damage cap is stat-1 and the object''s HP (oBattleObject_HP, halfword) is

  inspected: if HP is already 1 the function returns without touching it;

  if HP exceeds the cap the full stat value is dealt, otherwise only

  HP-1 is dealt, via object_subtractHP — either way the object is left

  with at least 1 HP. This is the classic non-lethal DoT behaviour

  (e.g. poison/poison-panel style status ticks). Quirk: callers see

  r1/r2 and c/v set from whichever internal path was taken (callee flags

  on early-out, cmp r1,#1 at the 1-HP bail, object_subtractHP otherwise).

  '
