    timer; bgt locret: does nothing until the timer reaches 0; mov r0,#0xc; strh [r7,#oAIAttackVars_HitElement]:
    on expiry writes element id 12 into the attack vars; recorded route ''battlesweep'' ties it to AI-controlled
