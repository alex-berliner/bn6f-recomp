name: ai_attackWaitSetHitElement
address: '0x080FC6AC'
kind: function
status: probable
summary: 'AI attack handler step: counts down the attack''s step timer and, when it expires, writes hit
  element 0xC into the attack vars'
interface: (r7 = AI attack vars struct) -> r0 = new HitElement (0xC) on expiry; sets flags via SUB/CMP
  on decrement
details: Reads the halfword at oAIAttackVars_StepTimer in the struct pointed to by r7, decrements it,
  and stores it back; the bgt keeps the routine a no-op while the timer is still positive. Once the timer
  hits zero (or below), it stores 0xC into oAIAttackVars_HitElement, presumably tagging the attack's damage
  with element 12 at the moment it takes effect. The struct uses the oAIAttackVars layout (StepTimer,
  HitElement fields already known to the project). With no known callers or callees, the exact attack
  this belongs to and the meaning of element 0xC are inferred from field names only.
