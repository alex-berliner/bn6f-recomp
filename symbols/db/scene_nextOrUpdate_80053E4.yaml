name: scene_nextOrUpdate_80053E4
address: '0x080053E4'
kind: function
status: confirmed
summary: 'Per-frame GameState tick: runs all scene sub-updates (dispatch, NPC AI, sprites, events), and
  when a screen fade is active performs a full scene-transition reset (free objects, clear buffers, set
  jump-table step 8, reinit graphics/LCD).'
interface: void scene_nextOrUpdate_80053E4(GameState *self /*r5*/, Toolkit *toolkit /*r10*/)
details: 'Called as a dispatch-table entry for a specific GameState jump-table slot. Phase 1 (always executes):
  sequential per-frame calls — dispatch_80339CC, NPC/AI helpers (sub_80039AA, sub_8003AFA, sub_80027B4,
  sub_800286C, sub_8003BF4, sub_8003E98), npc_drawSprites_800467C, more scene helpers (sub_8004298, sub_8004590,
  sub_8004934), and event_runArmedCallback_80024AE.

  Phase 2 (only when IsScreenFadeActive clears the Z flag, i.e. fade is NOT active — the beq exits early
  when fade IS active): full scene teardown and reinitialisation. chatbox_8040818 processes pending chat;
  FreeAllObjectsOfSpecifiedTypes(0x25) frees type-0x25 (37) objects; clearWorkBuffer_2011A40 wipes the
  work buffer; toolkit->MainJumptableIndex is set to 8 (the next-scene step); resetAllGraphicsState_8005F40
  resets OAM/VBlank state; runSetupStepAndClearWorkArea_8005F6C loads the next scene; scenario_initEffectState_8003962
  zeroes effect structs; RandomizeExtraToolkitPointers reshuffles pointer arrays; reloadCurNaviStatBoosts_813c3ac
  restores Navi stat-boost data. Finally SetRenderInfoLCDControl is called with the 32-bit literal at
  word_8005460 — the pool entry is .hword 0x0040 but the LDR reads 4 bytes, picking up the next instruction
  encoding (push {r7,lr}=0xB580), so the callee effectively receives 0xB580_0040; it uses only the low
  16 bits (0x0040 = bit 6, likely OBJ 16-colour mode enable).

  r5 is overwritten at the end of the transition path with toolkit->GameStatePtr (0x34 offset); on the
  early-return (fade active) path r5 keeps its original caller-supplied value. r4 and r6 are untouched
  (preserved per the register contract).

  '
