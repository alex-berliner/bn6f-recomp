name: sprite_drawValuePairAndQueueOam
address: '0x0803A4D0'
kind: function
status: probable
summary: Renders two small text/number buffers from an object's state fields and queues an OAM entry for
  each at fixed screen positions.
interface: (r5 = object/UI struct; r4 = [r5+0x24] reused per call) -> r0 = result of last sprite_queueOamEntryAt;
  no flags guaranteed
details: 'The function works on a struct in r5 (set up by caller sub_803A410) and twice repeats the same
  pattern: fill a buffer via sub_803B814, then queue one OAM entry with sprite_queueOamEntryAt. First
  pass: sub_803B814(8, 0x13, 6, r5+0xF0, [r5+0x24]), then sub_803C418() supplies the OAM handle, and an
  entry is queued at (0x58, 0x18) with parameter 4. Second pass: sub_803B814(0xa8, 0x83, 6, r5+0x110,
  [r5+0x24]), sub_8146728(r5+0x120) supplies the handle, and an entry is queued at (0x80, 0x88). Field
  [r5+0x24] (likely palette/OAM attribute) is reloaded before each draw call; the buffers live at fixed
  offsets 0xF0, 0x110, 0x120 in the struct. The paired fixed screen coordinates suggest a label/value
  display pair.'
