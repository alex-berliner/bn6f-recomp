name: battle_getMissingHpCapped
address: '0x08010BD0'
kind: function
status: probable
summary: Returns how much HP the player has lost (MaxHP - HP), capped at 500.
interface: (r0 = unused/ignored, r1 = alliance flag for battle_findPlayer) -> r0 = min(MaxHP - HP, 500);
  flags clobbered by callee
details: Looks up the player BattleObject via battle_findPlayer (passing r1 through as the alliance/team
  selector), reads oBattleObject_HP and oBattleObject_MaxHP as halfwords, and computes MaxHP - HP. If
  the deficit exceeds 0x1F4 (500) it returns 500 instead, otherwise the raw deficit. The first argument
  is saved to r6 but never used, suggesting a vestigial parameter or a wrapper convention. No other state
  is touched; this is a pure query of the player's current HP.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_findPlayer with r0=r1 passes the alliance selector straight through (0x8010BD8-8010BDC);
    ldrh r1,[r0,#oBattleObject_HP] / ldrh r0,[r0,#oBattleObject_MaxHP] then sub r0,r0,r1 computes missing
    HP; ldr r1,off_8010D38 = 0x1F4 and cmp/ble with r0=0x1F4 on overflow clamps the result to 500; r6
    holds the incoming r0 but is never read before pop, showing only the second argument matters
  refs:
  - bn6f/asm/asm00_2.s:4530
  - 0x080103BC battle_findPlayer
  reproduce: python3 tools/asmcat.py 0x08010BD0
