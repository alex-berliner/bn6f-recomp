name: battle_findForwardUsableAttackPanel
address: '0x080FF6E0'
kind: function
status: probable
summary: Searches the opponent's row for a panel matching per-alliance attack criteria, falling back to
  a looser mask and requiring a neighbor panel of the stricter type; returns the panel X/Y or 0 if none
  qualifies.
interface: (r0 = this BattleObject in r5, no args) -> r0 = panel X, r1 = panel Y, or r0 = 0 if no panel
  found; r4/r6 clobbered
details: Loads the object's Alliance, XORs it with 1 and calls battle_findPlayer to get the opposing player,
  taking the player's PanelY as the search row. It then calls object_getClosestPanelMatchingRowFiltered
  with per-alliance panel-flag masks from byte_80FF780 (alliance*8 gives required/forbidden word pairs);
  if the found panel is not in this object's own row, or is in this object's row but strictly ahead by
  object_getFrontDirection, its X/Y are returned directly. Otherwise a second search uses the masks at
  byte_80FF794, and the found panel is accepted only if the panel at Y+1 or Y-1 matches the first mask
  set (object_checkPanelParameters); if neither neighbor qualifies, or no panel was found at all, it returns
  0. The two 8-byte tables hold (requiredMask, forbiddenMask) word pairs per alliance (0x10/0x0F8800A0,
  0x30/0x0F880080 and 0x00010000/0x20, 0x00010020/0). The push/pop of r0,r1 around object_getFrontDirection
  preserves the found coordinates for the return.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'eor with 1 then battle_findPlayer: targets the player of the opposite alliance (asm after push);
    ldrb r6,[r0,#oBattleObject_PanelY] seeds the search row from the player; cmp r1,r3 compares result
    row to this object''s PanelY; off_80FF77C/byte_80FF780 and byte_80FF794 are per-alliance (alliance<<3)
    required/forbidden mask pairs fed to the panel-search/check helpers; sub r4, r0, r2; mul by object_getFrontDirection;
    bgt keeps the panel only if it lies ahead of this object in its own row; fallthrough sets mov r0,#0
    before locret_80FF778, so failure returns 0 while success returns the found X in r0 and Y in r1'
