name: battle_findForwardUsableAttackPanel
address: '0x080FF6E0'
kind: function
status: confirmed
summary: Locates the nearest usable panel directly in front of the attacker that the opponent occupies, with adjacency-clearance
  checks.
interface: 'Next battle_findForwardUsableAttackPanel(void) — in: r5 (self BattleObject); out: r0 (0 = usable panel
  found, else panel_x), r1 (panel_y), r2 (extra data / own panel_x), r5 (pass-through self); clobbers r3, nzcv,
  lr'
details: "Two-stage panel search for attack targeting:\n\n1. Looks up the opposing BattleObject via battle_findPlayer(self->alliance\
  \ ^ 1) and\n   reads their PanelY (row).\n2. Calls object_getClosestPanelMatchingRowFiltered with the \"standard\"\
  \ filter table\n   at byte_80FF780 (indexed by alliance<<3) to find the closest panel on that row.\n   If a panel\
  \ is found, it verifies (a) it is on the attacker's own row and (b) it is\n   at or behind the attacker along\
  \ the front direction\n   ((panel_x − self_x) × frontDir ≤ 0). If either check fails the result is returned\n\
  \   immediately with r0 ≠ 0 (not usable).\n3. Otherwise performs a second call to object_getClosestPanelMatchingRowFiltered\n\
  \   using the dedicated \"attack-panel\" filter table at byte_80FF794 (same indexing).\n   If no panel is found\
  \ at all, r0 = 0 and the caller treats the slot as unusable.\n4. For the panel returned in step 3, checks the\
  \ two adjacent rows (y+1 and y−1) via\n   object_checkPanelParameters against the standard filter. If an adjacent\
  \ row yields\n   a non-zero result the panel on that row is returned (r0 = panel_x, r1 = adjusted_y).\n   If both\
  \ neighbours are clear the function falls through with r0 = 0, meaning the\n   attack-panel row itself is the\
  \ usable forward panel.\n\nFilter tables are 8-byte pairs of (uint32_t panelMask, uint32_t rowMask) selected by\n\
  alliance index. The second search's mask pair (byte_80FF794) encodes a narrower set of\npanels (only row-1 panels\
  \ with specific x-bit flags) suggesting \"attack-only\" tiles.\n\nQuirks: the second call to object_checkPanelParameters\
  \ reuses r4 (a value set by the\nfirst callee) as its r0 input rather than re-reading panel_x; this is intentional\n\
  aliasing that the original C re-derivation accounts for.\n"
