name: battle_assignPanelAttack_810BE2A
address: '0x0810BE2A'
kind: function
status: confirmed
summary: Marks a battle object as having an active action, caches its panel coordinates, and selects a
  random attack value based on its panel row from a per-row lookup table.
interface: void battle_assignPanelAttack(BattleObject* obj /* r5 */)
details: "Writes 1 to obj+0x63 (active-action flag). Caches PanelX and PanelY into obj+0x60 and obj+0x61.\
  \ Calls GetRNG(), masks to 0–3 to pick a column. Uses (PanelY - 1) as an index into a 3-entry pointer\
  \ table (off_810BE5C); each entry is a 4-byte row:\n  row 0 (PanelY=1): {01, 01, 01, 01}\n  row 1 (PanelY=2):\
  \ {00, 02, 00, 02}\n  row 2 (PanelY=3): {00, 00, 00, 00}\nThe selected byte is stored at obj+0x62 (cached\
  \ attack value). PanelY is read twice (once for the cache write, once for the row calculation), so it\
  \ must not change between the two loads. The shift by 2 sets the carry flag from bit 29 of (PanelY-1),\
  \ which the caller may or may not use.\n"
