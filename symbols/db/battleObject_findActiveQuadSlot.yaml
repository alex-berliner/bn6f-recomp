open_questions:
- what field byte +3 of the 0x10-byte battle-object descriptor represents (active flag, type, team, ...)
- why the scan starts 0x90 index-units before the argument — whether r0 is an index, a byte offset, or
  a pointer into StructArr_813944C
- how sub_803D170 uses the returned value (as an index, pointer, or just a found/offset flag), which would
  pin down the game-level purpose
