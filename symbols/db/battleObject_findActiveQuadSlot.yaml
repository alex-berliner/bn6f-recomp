name: battleObject_findActiveQuadSlot
address: '0x0803D180'
kind: function
status: probable
summary: Scans four consecutive battle-object descriptor slots (starting 0x90 index-units before r0) and
  returns the relative index of the first one whose byte at +3 is nonzero, or 0 if all four are clear.
interface: (r0 = base battle-object descriptor index) -> r0 = base + offset (0..3) of first slot with
  byte[+3] != 0, or 0 if none; flags clobbered
details: The function computes r4 = r0 - 0x90, then for i = 0..3 calls battleObject_getByIndex_813B780
  with index r4 + i to fetch a 0x10-byte descriptor slot from StructArr_813944C. Each slot's byte at offset
  3 is loaded and compared against r5 (0); as long as it equals 0 the loop advances to the next slot.
  If a slot with a nonzero byte at +3 is found, the loop exits and the function returns r4 + i + 0x90,
  i.e. the original r0 plus the slot's offset within the scanned quad. If all four slots have a zero byte
  at +3, it returns 0. Byte +3 thus acts as an occupied/active flag for these descriptors, and the 0x90
  back-offset suggests the caller passes an index into a group whose four checked slots live one 0x90-sized
  block earlier. Nothing writes to the structures; it is a pure search.
