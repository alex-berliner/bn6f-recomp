- What submenu / screen is this on? "one per-line chip-preview routine" suggests it's invoked once per
  row of some chip-selection submenu (Edit/Custom-equivalent screen for BN6 Falzar).
- Is byte_811A1E0 actually a palette remap table or a sprite-palette index table? The mapping (0,1,2,0,...)
  suggests at most 3 distinct palettes are reachable from this code path; raw palette values >=3 are silently
  mapped to 0.
- 'Meaning of flagsPtr bit 1 (mask 2): likely "this line is locked / not allowed to preview" but unconfirmed.'
- 'Contract of submenu_compareCursorBytes_811A24C: how does it consume its inputs? R0/R1? A struct ptr?
