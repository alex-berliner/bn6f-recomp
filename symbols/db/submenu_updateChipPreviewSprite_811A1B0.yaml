name: submenu_updateChipPreviewSprite_811A1B0
address: '0x0811A1B0'
kind: function
status: confirmed
summary: Updates the chip-preview sprite palette on a submenu line when its selected chip or cursor byte
  has changed (also stashes them as the new "previous" values), bailing out when the cursor bytes match
  and gate-bit-1 of the flags byte is set.
interface: 'void sub_811A1B0(struct SubmenuLine *line /* r5 */);

  // returns via pop {pc}; no return value carried in regs to the caller

  // reads: line->cursorByte, line->cursorByteBak, line->chipIndex, line->chipIndexBak, line->flagsPtr

  // writes: line->chipIndexBak, line->cursorByteBak

  // flags out: nz/c/v from the final callee (sprite_setPalette) when the preview path runs; from submenu_compareCursorBytes_811A24C
  / TST when the gate path runs

  '
details: "Operates on a small per-line struct at offsets 0x0C..0x14 in r5:\n  +0x0C  u8  cursorByte\n\
  \  +0x0D  u8  cursorByteBak\n  +0x0E  u16 chipIndex\n  +0x10  u16 chipIndexBak\n  +0x14  u32 flagsPtr\
  \ (-> u8 flag byte)\n\n1) Calls submenu_compareCursorBytes_811A24C which, given the cursor bytes somehow\
  \ already loaded into r0/r1 etc., returns Z=1 when the two byte sequences are equal. (The exact contract\
  \ isn't visible inside this function.)\n2) If Z=1, it dereferences flagsPtr (+0x14) to read a u8 flag\
  \ byte and tests bit 1 (mask 2). If the bit is set, the function returns immediately — early-out for\
  \ \"gate closed\" or \"selection locked\".\n3) Otherwise, it reads chipIndex (u16 at +0x0E) and cursorByte\
  \ (u8 at +0x0C) into r4/r6, calls getChip8021DA8(chipIndex) to get the ChipData pointer, reads the palette\
  \ byte at offset +7 of that ChipData structure, indexes into the ROM table at byte_811A1E0 (8 entries:\
  \ 0,1,2,0,0,0,0,0) to remap raw palette to a sprite palette number, and calls sprite_setPalette(mapped_palette).\n\
  4) Finally stores the current chipIndex/cursorByte into the *Bak slots (+0x10 / +0x0D) so the next invocation's\
  \ comparison against the previous selection succeeds — this is a \"dirty check\" / change-detection\
  \ idiom.\n\nQuirks / notes:\n  - Uses `pop {pc}` as the return (Thumb-2 tail-return), so lr is pushed\
  \ only at entry and restored by popping the saved lr straight into PC.\n  - r1 is loaded with the address\
  \ of byte_811A1E0 immediately before the call to sprite_setPalette; the callee is documented to preserve\
  \ r1, so the value in r1 on exit is just the table address. The readable C lists it as res.r1 for symmetry,\
  \ but no caller-visible meaning has been confirmed.\n  - The address-of-table load happens via `ldr\
  \ r1, off_811A1DC` -> `byte_811A1E0`; off_811A1DC holds a 4-byte pointer word to that byte label.\n\
  \  - Flag semantics: clobbers nz/c/v are inherited from the callee path; the early-out path leaves c/v\
  \ from submenu_compareCursorBytes_811A24C (the TST itself only sets N/Z).\n  - 0x14 holds a *pointer*\
  \ to a flag byte, not the flag byte itself — confirmed by the `ldr r1, [r5,#0x14]` / `ldrb r0, [r1]`\
  \ pair.\n"
