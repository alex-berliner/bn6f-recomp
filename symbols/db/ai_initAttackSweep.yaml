name: ai_initAttackSweep
address: '0x0810EAA6'
kind: function
status: probable
summary: 'AI attack-phase initializer: arms a panel-choose callback, loads attack duration by game version,
  and starts attack id 0x0B.'
interface: (r4 = AI data ptr, r5 = AI counter object, r6 = AI state, r7 = oAIAttackVars) -> r0 = 0; sets
  attack vars and resets oAIState_ScriptId
details: Increments a per-object counter at [r5,0x74] (likely a phase/use counter) and installs sub_810EB76
  as oAIAttackVars_PanelChooseCallback, the routine that later picks the panel to attack. It loads AttackDuration
  from byte_810E804 indexed by oAIData_Version_16, hardcodes AiDifficultyTier=2, AttackBoost2=0x14 and
  TimerOrCycles=0x15, and sets ScratchVar and AiAttackParam to 3. It then calls object_setAttack0 with
  r0=0x0B to begin attack slot 11, calls genericAI_movementRelated_8109952 to reposition/queue movement,
  and clears oAIState_ScriptId so the AI state machine returns to script 0. The whole block is a one-shot
  setup for one attack step of the AI, run during battlesweep-recorded play.
