name: busStation_runBusMoveSequence_controller_808F900
address: '0x0808F900'
kind: function
status: confirmed
summary: Per-frame controller for the bus-ride cutscene state machine at the bus station - walks the player to the
  bus, seats them, then walks them off at the destination and reports whether the ride is still running.
interface: 'void busStation_tickBusRideCutscene(void); // in: r6, r7 (pass-through to sub_808FA7C/sub_808FA84),
  r10, lr; out: r0 = 0 when the ride finished, 1 while still in progress (NZ set from r0); r2-r5 hold callee garbage;
  r4-r7 restored on exit'
details: 'Runs one tick of a 4-step state machine whose state byte lives at BUS_STATE (+0x2) of the bus-ride block
  pointed to by off_808F5D4 (0x2000310-based struct). Step <=0 (ride not yet started): writes 0xFF to BUS_RIDE_DONE
  (+0x11) as a ride-started marker, clears event flags EVENT_BE4 and EVENT_BE5 (both gates of the ride trigger),
  calls sub_808FA7C to set up the bus approach, disables the player''s wall collision, and advances the state. Step
  1: owPlayer_stepTowardTarget walks the player toward the bus; while it reports "not arrived" (Z clear) the tick
  returns 1 to keep the cutscene running. Step 2 (bus arrived): sub_808FA84 (bus arrival setup), ZeroOWPlayerNaviPaletteIndex,
  ow_spawnMapObject1b (r5 = bus block) to spawn the bus map object, and ow_seatPlayerForBusRide put the player inside
  the bus, then returns 1. Step 3 (destination): owPlayer_stepTowardTarget walks the player off the bus; on arrival
  it re-enables wall collision, resets the state byte to 0, calls resetStruct2000aa0State_809E3B2, teleports the
  player to the arrival coordinates stored as halfwords at +0x12/+0x14 (shifted left 16 to 26.6/1/65536-style fixed
  point, with r2 = 0x00400000 as the third argument, likely a z/height or interpolation param), plays the fixed
  animation selected by BUS_ANIM_SELECT (+0xF), sets the facing direction from BUS_FACING (+0x10), calls reqBBS_clearFlag_8140A0C,
  and returns 0. Quirk: on the early exits (steps 1 and 3 still walking) r0 = 1 and the state byte was already bumped
  before the return in the step-2 path, so the increment persists even though the tick "failed" to finish.'
