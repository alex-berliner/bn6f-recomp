name: submenu_ConfirmExitAndFade_811FB64
address: '0x0811FB64'
kind: function
status: confirmed
summary: Confirms the highlighted submenu entry, plays the "exit submenu" sound, and starts a screen fade to leave
  the submenu.
interface: void submenu_ConfirmExitAndFade(u8 selectedEntry /*r0*/, u8* submenuState /*r5*/)
details: 'Called from a submenu UI handler: r5 points to a submenu state/work struct, and the selected

  (highlighted) entry index in r0 is stored to byte offset +1 of that struct, saving the player''s

  choice. It then plays SOUND_EXIT_SUBMENU via PlaySoundEffect and kicks off SetScreenFade with

  duration 0xC and mode 0x10, producing the fade transition used when closing a submenu.

  Preserves r4-r7 and r10 (callee-saved registers loaded by the caller); returns via popped lr.

  Note the state pointer arrives in r5 rather than a normal argument register, so the caller

  keeps it resident in a callee-saved register across the selection loop.

  '
