name: chatbox_cmdPlayMusic_80422E8
address: '0x080422E8'
kind: function
status: confirmed
summary: Chatbox script command handler that plays the music track given as a u16 operand and advances the script
  pointer.
interface: Next chatbox_cmdPlayMusic(u8** r4_scriptPtr); returns r0 = 1 always; clobbers r0, r1, lr; preserves r2,
  r3, r5, r6, r7, r10
details: 'Handler for a chatbox script opcode. r4 points at the current script command; the operand at [r4+2] (low
  byte) and [r4+3] (high byte) forms a little-endian u16 song id, which is passed to PlayMusic. The pointer is advanced
  by 4 (opcode + 2-byte operand... 4-byte command stride), and r0 is set to 1, likely a generic "continue/success"
  return used by the script dispatcher. Exit flags are incidental: n/z from "movs r0, #1", c/v from "adds r4, #4".
  Touches only the chatbox script stream via r4; no other state.'
