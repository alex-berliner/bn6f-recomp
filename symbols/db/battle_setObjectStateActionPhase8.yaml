name: battle_setObjectStateActionPhase8
address: '0x080C46B0'
kind: function
status: probable
summary: Writes 8 into a battle object's state/action-phase field (r0 = object pointer).
interface: (r0 = battle object pointer) -> [r0 + oBattleObject_CurStateActionPhaseAndPhaseInitialized]
  = 8; no return value, flags clobbered by mov.
details: 'The whole routine is a constant setter: it loads the immediate 8 and stores it at offset oBattleObject_CurStateActionPhaseAndPhaseInitialized
  of the structure passed in r0, then returns. That field is the battle object''s combined current-state
  / action-phase tracker (the same one the battle engine reads to dispatch object behavior), so this moves
  an object into state/phase 8, presumably a specific action phase used by several object kinds. It touches
  nothing else and calls nothing, so the only open point is what gameplay state 8 means; the five call
  sites (battle, object, and beastsp-route code) would need disassembly to confirm which entity types
  use it.'
