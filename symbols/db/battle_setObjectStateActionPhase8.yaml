name: battle_setObjectStateActionPhase8
address: '0x080C46B0'
kind: function
status: confirmed
summary: Sets a battle object's current action phase to 8 and returns that phase number to the caller.
interface: u32 battle_setObjectStateActionPhase8(BattleObject* object) // r0 = object ptr, returns phase (8) in
  r1; clobbers N/Z flags
details: 'Writes the immediate value 8 into the object''s combined CurStateActionPhaseAndPhaseInitialized field
  at offset oBattleObject_CurStateActionPhaseAndPhaseInitialized, advancing the battle object''s state machine into
  action phase 8. The same value (8) is also copied to r1 as the return value, so callers get the new phase without
  re-reading the object. The mov r1, #8 updates the NZ flags (always clearing N and Z here), which is why nz is
  listed as clobbered. r0 and lr are the only other registers involved; nothing else is preserved or touched. Very
  likely a small helper in a family of per-phase setters (one per action phase) used by the battle object state
  machine.

  '
