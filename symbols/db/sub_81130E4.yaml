details: 'A two-call tail wrapper. The function pushes only LR, calls sub_8113114, then calls sub_8016B02, and uses
  `pop {pc}` to return rather than the usual `bx lr`. Because sub_8016B02 does not consume LR from the stack, the
  net effect on guest-visible register/flag state is equivalent to two normal calls followed by a `RETURN_TO_CALLER()`.
  Inputs/outputs/clobbers come purely from the caller contracts of the two callees; the wrapper itself adds no state
  changes. The address suffix 81130E4 is preserved in the proposed name.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
