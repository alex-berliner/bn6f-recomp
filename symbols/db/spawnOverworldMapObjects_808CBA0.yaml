name: spawnOverworldMapObjects_808CBA0
address: '0x0808CBA0'
kind: function
status: confirmed
summary: Spawns the initial batch of overworld map objects, with the count depending on the current map
  (12 in map group 0x85, 9 elsewhere with a nonzero MapNumber, otherwise 7).
interface: void sub_808CBA0(r10 toolkit); takes the toolkit pointer in r10, reads GameState via oToolkit_GameStatePtr;
  returns nothing meaningful — r2 holds whatever the last SpawnOverworldMapObject call left behind; r4-r7
  reach the caller exactly as they arrived
details: 'Loads the GameState pointer from the toolkit (r10 + oToolkit_GameStatePtr) and picks the object
  count from the map id: if oGameState_MapGroup == 0x85 the count is 12, else if oGameState_MapNumber
  != 0 the count is 9, else 7. Then loops index = 0..count-1 calling SpawnOverworldMapObject(0x10, 0,
  0, 0, index); all objects use the same type/id argument 0x10, differentiated only by the index in r4.
  Quirk: SpawnOverworldMapObject clobbers r5/r6 and its call path loads r4, so the routine brackets everything
  with push/pop {r4-r7} (plus an inner push/pop {r5} around each call) to hand r4-r7 back to the caller
  unchanged — r7 is briefly used as the loop limit but is restored on exit. The map-group 0x85 case is
  a special map that gets 12 objects instead of the usual 7 or 9.'
