- method: assembly-reading
  date: '2026-10-18'
  detail: 'loc_80FA31E arm phase: strb #4,[r7,#oAIAttackVars_AttackElement]; strh #0x14 StepTimer; byte_80FA374
    masks 0x500/0xA00 checked against oCollisionData_FlagsFromCollision by Alliance index; on timer expiry:
    object_clearCollisionRegion, sprite_noShadow, strh #0xff -> oBattleObject_Z16; TimerOrCycles>0 sets
    HitElement=4, else HitElement=0x10 — repeating strike then end; route tags ''battlesweep''/''chips''
    and callees (collision/shadow) match an airborne attack exit'
