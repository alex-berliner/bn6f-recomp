name: ai_attackFlyOffStep
address: '0x080FA31E'
kind: function
status: probable
summary: Staged AI attack routine that arms an element-4 attack, then after a delay makes the object drop
  collision, lose its shadow, fly off-screen (Z=0xFF), and deal hit element 4 each cycle until cycles
  run out.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = destroyed/cleared result of sub_801DD34;
  updates oAIAttackVars fields on r7 and oBattleObject_Z16 on r5
details: 'First call (AttackElement==0) arms the attack: sets AttackElement=4 and StepTimer=0x14 (20 frames).
  On later calls it reads the object''s collision-data flags and, if flags match the per-alliance mask
  from byte_80FA374 (indexed by Alliance<<2), clears the object''s collision region. It then counts down
  StepTimer; when it hits zero it clears the collision region again, clears this object''s record in the
  byte_203EB50 table via sub_801DD34 (keyed by r5), removes its shadow, sets Z16=0xFF (flies off-screen),
  and decrements TimerOrCycles. While cycles remain it sets HitElement=4, otherwise 0x10 (finished/none).'
