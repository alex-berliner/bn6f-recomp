open_questions:
- what structure r5 points to and what the byte written at offset 1 (0x50/0x58) selects
- what dispatch_803C620 actually dispatches (its result values besides 1) and who advances it
- what sub_8148214 does (likely per-step teardown/cleanup) and what the 0x200BC50+5 IWRAM flag means
- what the handlers sub_803C34E and sub_813D750 do, which would reveal the subsystem
