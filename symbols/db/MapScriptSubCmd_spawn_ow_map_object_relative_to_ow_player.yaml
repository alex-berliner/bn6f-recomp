open_questions:
- What does the 32-bit word read at script offset 9 represent? It is loaded into r4 but the C stub passes it through
  SpawnOverworldMapObject; its semantic meaning (object subtype? parameters? event id?) is unclear.
- 'Is the lsl #16 on the halfword offsets confirming a 16.16 fixed-point coordinate system for OW objects, or does
  SpawnOverworldMapObject reinterpret the lower bits differently?'
- Which CutsceneState field (oCutsceneState_owMapObjectPtrs_44) and how many slots does it contain—does the 0xF
  mask limit slots to 16?
