name: MapScriptSubCmd_spawn_ow_map_object_relative_to_ow_player
address: '0x08037E96'
kind: function
status: probable
summary: Map-script subcommand that spawns an overworld map object at a position relative to the OW player and stores
  the handle in a CutsceneState slot.
interface: r4 (slot index, low nibble used), r5 (CutsceneState base ptr) → r0=1 (success), r7 advanced by 0xD, NZCV
  from r7+0xD; r5 preserved; clobbers r1 r2 r3 r6 r0 r7 lr; reads [r5+offset] as input, writes [slot_ptr] as output
details: Computes a slot pointer as r5 + ((r4 & 0xF)<<2) + oCutsceneState_owMapObjectPtrs_44. Calls ReadOWPlayerObjectCoords
  to get the player's current 32-bit fixed-point X/Y/Z (returned in r0/r1/r2), saved on a 0xC-byte stack frame.
  Reads three signed 16-bit halfwords from the map script at offsets 3, 5, 7 (the relative offsets), shifts each
  left by 16 to form upper-half fixed-point values, then adds them to the player coords to produce absolute spawn
  positions. Reads a byte at script offset 2 as the object type and a word at offset 9 as additional data (passed
  through r0 to SpawnOverworldMapObject, though the C stub shows obj_type via r0 and the word is read but not explicitly
  passed—likely consumed inside the spawn routine via the script pointer). Calls SpawnOverworldMapObject (r0=type,
  r1=x, r2=y, r3=z, r6=slot_ptr); the new object handle comes back in r5, which is stored into the CutsceneState
  slot. Script pointer r7 is advanced by 0xD (the command's total size) and r0 is set to 1. The caller's r5 is pushed/popped
  to protect it across the SpawnOverworldMapObject call.
