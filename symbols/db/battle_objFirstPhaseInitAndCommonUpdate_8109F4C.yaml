name: battle_objFirstPhaseInitAndCommonUpdate_8109F4C
address: '0x08109F4C'
kind: function
status: confirmed
summary: Per-frame battle object update that performs a one-time side/alliance setup during phase 0, then runs the
  object's common update routine every frame.
interface: void battle_objFirstPhaseInitAndCommonUpdate(battleObject* obj /*r5*/, int unk /*r7*/); // sets nz from
  cmp(CurPhase,0), c/v from last callee
details: 'Battle object per-frame handler taking the object in r5 (r7 passed through to callees).

  While the object''s CurPhase (oBattleObject_CurPhase) is 0, it performs a one-time

  initialization: computes Alliance ^ DirectionFlip (side adjusted by facing flip) and

  stores it to the ExtraVars word at ExtraVars+4, calls sub_800AA1A with r0 = that value

  and r1 = DirectionFlip (likely registering/queueing a side-dependent behavior), and

  clears the byte at Param4. On every frame (both paths) it then calls sub_80165B8,

  the object''s common update, before returning. The `cmp r0,#0` on CurPhase leaves

  NZ set; C/V at return come from sub_80165B8 (NZ only) or sub_800AA1A on the

  phase-0 path. No registers other than flags, r0/r1 and the outgoing lr are live.

  '
