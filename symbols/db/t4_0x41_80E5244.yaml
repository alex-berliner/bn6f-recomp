name: t4_0x41_80E5244
address: '0x080E5244'
kind: function
status: confirmed
summary: Dispatches a battle object to its per-state handler, selecting the routine from a 3-entry jump table indexed
  by the object's CurState byte.
interface: void battle_runObjectStateHandler(BattleObject* obj in r5, u32 arg2 in r2, u32 arg10 in r10); returns
  the handler's r5/r8-r12 pass-through results
details: 'r5 points to a battle object; the byte at oBattleObject_CurState is loaded and used

  (unmasked, as a raw byte index) into the jump table at off_80E5258, which holds three

  thumb handlers: sub_80E5264 (state 0), sub_80E527A (state 1), sub_80E5314 (state 2).

  The call is made with mov lr, pc / bx r1 so the handler returns back here, which then

  pops pc to return to the original caller. The handler receives r0 = CurState,

  r1 = handler address (still holding the table entry at the bx), r2 and r10 passed

  through from this function''s caller, and r5 = the object pointer. Any register results

  the handler leaves in r5/r8-r12 simply pass through to this function''s caller.

  States 3+ would read past the table (undefined behavior on out-of-range CurState).

  '
