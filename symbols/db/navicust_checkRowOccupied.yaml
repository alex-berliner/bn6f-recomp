name: navicust_checkRowOccupied
address: '0x0813BF60'
kind: function
status: probable
summary: Scans the 7x7 Navi Customizer grid and returns whether any occupied cell lies on the middle row
  within ±3 columns of the given column.
interface: (r0 = unused/dispatch seed, r1 = column, r2 = row) -> r0 = 1 if a nonzero grid byte is found
  in row 3 with column in [r1-3, r1+3], else 0
details: Obtains a grid pointer by calling ai_dispatchFromGlobalByte (global byte at 20096D8 selects it),
  then treats it as a 7x7 row-major byte map with stride 7. It walks the 7-row window arg2-3..arg2+3 (clipped
  to 0..6) and, per row, the 7 column offsets clipped to arg1-3..arg1+3. A cell counts only if its byte
  is nonzero AND the running row counter equals 3; hitting such a cell returns 1 at once, otherwise it
  returns 0. Because arg2 is always a valid row, the row window always spans row 3, so arg2 mostly just
  positions the scan; the effective test is 'row 3 occupied near column arg1'. Called from navicust_checkPiecePlacement,
  so the boolean is one of the placement-validation outcomes; row 3 likely maps to the command-line arm
  of the grid layout.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl ai_dispatchFromGlobalByte; mov r7, r0 — result used as base pointer of a byte array, not
    a scalar; ldr r4, [r7,r3] with r7 += 7 per outer iteration and r3 = 0..6 — 7x7 row-major byte grid;
    cmp r1,#0 / cmp r1,#7 and cmp r2,#0 / cmp r2,#7 — both coordinates clipped to a 0..6 grid; cmp r2,#3;
    bne skip plus tst r4,r4; beq skip — only nonzero bytes in row 3 trigger the early return 1; Caller
    navicust_checkPiecePlacement validates placing the held part at the cursor cell, so this is a placement-occupancy
    check
