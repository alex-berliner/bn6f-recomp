name: navicust_checkRowOccupied
address: '0x0813BF60'
kind: function
status: confirmed
summary: Checks whether the centre row (index 3) of the Navi Customizer's 7×7 placement grid contains any occupied
  cell.
interface: u32 navicust_checkRowOccupied(u32 gridByte /*r0, passed to ai_dispatchFromGlobalByte*/, u32 col /*r1*/,
  u32 row /*r2*/); /* returns 1 or 0 in r0; sets Z on return; r4-r7 preserved per callee convention */
details: 'Calls ai_dispatchFromGlobalByte(r0) to obtain a pointer to a 7×7 byte grid (one byte per cell, 0 = empty,
  non-zero = occupied). Iterates over all 49 cells in row-major order (outer loop advances the row pointer by 7
  each of 7 iterations; inner loop walks 7 columns via a byte-offset r3). For each cell it bounds-checks the logical
  row and column indices (derived from the input col/row minus 3) against the 0–6 range. If a cell is non-zero AND
  the current outer-loop row index r2 equals 3 (the centre row of the grid), the function returns 1 immediately.
  Otherwise it returns 0 after exhausting all rows. The col and row arguments appear to define a window offset but
  the only effective check is against the fixed centre row; the column is scanned across all seven positions. Quirk:
  the inner loop uses push {r1}/pop {r1} around the bounds test to save and restore the column cursor, which is
  functionally equivalent to a local variable.'
