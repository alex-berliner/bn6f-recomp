name: rfu_orFlags
address: '0x0803CB00'
kind: function
status: probable
summary: ORs the caller's bits into the flags word (offset 0xC) of the RFU/wireless shared state structure
  at 0x200BC50.
interface: (r0 = flag bits to set) -> r0 = clobbered; no condition flags meaningful, returns via mov pc,
  lr
details: Loads the base pointer eS200BC50 from a literal pool, reads the dword at base+0xC (dword_200BC5C),
  ORs r0 into it, and stores it back — a classic bit-set helper for a global flags word. The structure
  at 0x200BC50 is the wireless/RFU shared state area, as the one known caller is the wireless-connection
  state machine (rfu_wirelessConnectStep), which likely marks flags such as 'connection step completed'
  or 'error occurred'. The other callers in the 0x8039xxx–0x803Cxxx range are nearby wireless-related
  subs doing the same. It is a leaf function with no other side effects.
