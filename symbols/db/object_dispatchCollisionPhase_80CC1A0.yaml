open_questions:
- What the three sub-actions sub_80CC208/23E/3B8 actually do (move, hit-stop, etc.); the function only
  chooses between them. Inspecting those would pin down the CurAction enum meanings.
- The semantic of writing 0xc into the halfword at offset 0xa is "force phase reinit" but the precise
  interpretation of the low/high nibbles (CurPhase vs PhaseInitialized) isn't directly stated by the code
  at this site.
- Why the dispatch table off_80CC1F0 has space for a third entry (the .word after sub_80CC23E+1 is sub_80CC3B8+1,
  only 2 entries are stored despite the surrounding word suggesting more) is unclear without context.
