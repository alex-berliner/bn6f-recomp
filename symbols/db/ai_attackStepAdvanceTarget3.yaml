name: ai_attackStepAdvanceTarget3
address: '0x08106F5C'
kind: function
status: probable
summary: 'Tick for an AI attack''s step movement: on timer expiry it teleports the attacker to its target
  panel and marks the hit as element 8.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> void; no return value, state updated in
  both structs
details: Decrements oAIAttackVars_StepTimer and does nothing until it hits zero. Then it sets the battle
  object's animation to 3, copies oAIAttackVars_TargetPanelX/Y into the object's PanelX/PanelY, and calls
  object_setCoordinatesFromPanels and object_updateCollisionPanels to move the sprite and collision/facing
  to the new panel. It reloads StepTimer with 3 (so each step advance takes 3 frames) and stores 8 into
  oAIAttackVars_HitElement for the hit that follows. This is one iteration of a multi-step attack approach
  — a later/parallel routine presumably checks reachability and issues further steps.
