name: object_getPanelsInColumnFiltered
address: '0x0800CFDC'
kind: function
status: confirmed
summary: Iterates the three column panels of a panel base and writes the encoded ID of each one that passes object_checkPanelParameters
  into a caller-supplied buffer, returning the count written.
interface: "u32 object_getPanelsInColumnFiltered(\n    u32 panelBase,         // r0\n    u32 param0,           \
  \ // r2 (sp+0)\n    u32 param1,            // r3 (sp+4)\n    u8 *outBuffer /*r7*/);\n// returns: r0 = number of\
  \ panel bytes appended to outBuffer; flags NZ/C/V set from ADD r0,r6,#0\n"
details: "Walks column = 1..3 (inclusive). For each column it calls\nobject_checkPanelParameters(panelBase, column,\
  \ param0, param1); when that\nreturns non-zero the column's panel is accepted and a byte is written:\n  enc =\
  \ (u8)(panelBase | (column << 4))\nThe encoded byte (low nibble = base, high nibble = column index) is stored\n\
  to r7 + count via strb, then count is incremented. After the loop r0 holds\nthe final count (encoded as `add r0,\
  \ r6, #0`, so it sets flags: C=0,\nV=0, N/Z reflect the count). Stack frame is 8 bytes used to spill r2/r3\nacross\
  \ the call. r4-r7 are preserved across the call (they form the\nstandard callee-saved set used here). The function\
  \ encodes a panel's\nidentity by packing base id (low nibble) and column number (high nibble)\ninto one byte,\
  \ which fits the MMBN panel encoding scheme (0xXY where X is\ncolumn, Y is the panel-within-column index).\n\n\
  Register form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
