name: GetCameraXYZ
address: '0x080301D0'
kind: function
status: confirmed
summary: Returns the current camera position (X, Y, Z) from the active camera object in r0/r1/r2.
interface: GetCameraXYZ(void) -> (r0 = camera X, r1 = camera Y, r2 = camera Z); inputs r10 = toolkit base, clobbers
  r3
details: 'Reads the camera object pointer from the toolkit struct at oToolkit_CameraPtr (r10 is the toolkit base,
  the usual global state pointer), then loads three consecutive-ish fields of the camera struct: oCamera_X into
  r0, oCamera_Y into r1, and oCamera_Z into r2. Pure getter with no side effects, no flags touched, and nothing
  preserved beyond the standard r3 scratch use. Callers use this to position sprites or effects relative to the
  overworld camera.

  '
