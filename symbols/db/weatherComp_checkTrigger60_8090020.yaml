name: weatherComp_checkTrigger60_8090020
address: '0x08090020'
kind: function
status: confirmed
summary: Polls a request/BBS result code; if it is in the 0x60-0x69 trigger range, stores code-0x60 as the weather
  component's new state and reports a hit.
interface: u32 weatherComp_checkTrigger60(u32 flag /*in/out r4*/, void* stateObj /*in r5*/) -> nz on r4 (1 = trigger
  hit, else incoming flag); clobbers r0-r3, r9-r12 via callee
details: 'Weather-component trigger check, one of a family of per-trigger handlers. Calls

  reqBBS_81409E4 (no typed interface yet) to obtain a result code in r0. If the

  code, compared signed (blt/bgt), lies in the inclusive range 0x60..0x69, it is

  treated as a trigger hit: the component''s state byte at [r5 + 0x0E] is written

  with (code - 0x60), i.e. trigger slot 0-9, and the return flag is set to 1.

  Otherwise the incoming r4 is passed through unchanged ("no trigger"). r4 and r5

  are preserved across the call (r4 pushed, r5 kept by the callee). The caller

  tests the returned value with tst to branch on Z/N. r1/r2/r3 and r9-r12 are

  whatever reqBBS_81409E4 leaves in them, not meaningful outputs of this routine.

  Note the incoming r4 is the default return value, so callers seed it with the

  "not triggered" result beforehand.

  '
