name: sub_801746E
address: '0x0801746E'
kind: function
status: confirmed
summary: Starts a battle object's destruction sequence (sets anim 2, clears paired object and AI scratch, plays
  sound 0x6C, spawns two effect objects at the object's position, and arms a 21-frame countdown into phase 8); no-op
  while time stop is active.
interface: void sub_801746E(u32 /*r5*/ obj) -> r1 (callee return), r5 (does r10 hold?); clobbers r0 r2 r3 r4 lr;
  flags NZCV affected. Inputs via r5 (obj) and lr.
details: "Battle-time helper gated by battle_isTimeStop (early return via pop {pc} when nonzero). When\nnot time-stopped\
  \ it:\n  - ST8 obj+oBattleObject_CurAnim = 2 (the destruction animation)\n  - ST32 obj+oBattleObject_RelatedObject1Ptr\
  \ = 0 (unlinks the linked object)\n  - ST8 obj+oBattleObject_PreventAnim = 0 (re-enables the animator)\n  - Loads\
  \ oBattleObject_AIDataPtr into r1 and clears its oAIData_Unk_5c and oAIData_Unk_68 words.\n  - PlaySoundEffect(0x6C);\
  \ r1 (the AI pointer) is still the live second arg when it is called.\n  - Reads three words from obj+0x34..0x3C\
  \ (x/y/z position block) and obj+0x40 as a fourth\n    word, sets r4 = 3, and calls spawn_t1_0x0_EffectObject\
  \ twice back to back. Note: the second\n    call reuses the first call's return-state in registers, so the spawner\
  \ is called with\n    identical inputs both times (a \"pair\" of effect objects).\n  - ST16 obj+oBattleObject_Timer\
  \ = 0x15 (21-frame countdown)\n  - ST16 obj+oBattleObject_CurPhaseAndPhaseInitialized = 8 (advance to phase 8\
  \ with the\n    \"initialized\" nibble cleared: 0x08).\nReturn is `pop {pc}` so it is leaf-like but performs a\
  \ tail-return to the caller.\n"
