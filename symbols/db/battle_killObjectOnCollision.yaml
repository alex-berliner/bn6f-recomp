name: battle_killObjectOnCollision
address: '0x080DB934'
kind: function
status: probable
summary: Tears down a battle object after it has been hit (spawning its hit effect), or lets it linger
  on a countdown timer before freeing it.
interface: (r5 = battle object) -> void; no return value
details: 'Runs on an object held in r5. It first removes the object''s collision data, then spawns the
  hit effect for its last collision (jittered via GetRNG). It then reads the collision flags from the
  CollisionDataPtr: if flags are zero, it decrements oBattleObject_Timer and, while the timer is still
  positive, refreshes the collision state via object_presentCollisionData and returns, keeping the object
  alive another frame. If the timer expired, or if the flags are set and include bits 0xC000000, it falls
  through to teardown (bit 0xC000000 additionally calls sub_80E8912 first, likely a per-type death hook).
  Teardown clears the collision region, frees the collision data slot, and releases the object''s memory
  slot.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData / object_spawnCollisionEffect at entry: hit teardown sequence
    on the r5 object; loc_80DB952: decrement oBattleObject_Timer, if still >0 bl object_presentCollisionData
    and return alive; flags test tst r0, r1 with 0xC000000 gates the extra call to sub_80E8912 before
    death; loc_80DB960: object_clearCollisionRegion + object_freeCollisionData + object_freeMemory is
    full object teardown; sole caller sub_80DB8EC plus callees all take the battle object in r5'
