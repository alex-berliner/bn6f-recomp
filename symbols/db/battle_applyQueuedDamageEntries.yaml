name: battle_applyQueuedDamageEntries
address: '0x080C6774'
kind: function
status: probable
summary: Iterates the object's queued byte-encoded hit entries and applies each one's damage to the target
  the queue lookup resolves.
interface: () -> r0 = destroyed; uses [r5] battle object; r4/r6-r7 clobbered
details: Reads a count from [r5,#oBattleObject_ExtraVars] and walks a byte array at object+0x64. Each
  entry byte encodes a value in its high nibble (passed as r1) and a 3-bit index (passed as r0); sub_80C67A4(r0,r1)
  returns a resolved target/value, and if nonzero sub_80C67D8 is invoked with r2=oBattleObject_Element,
  r3=0, r4=oBattleObject_Param1+1 (power/count) and r6=oBattleObject_DamageAndStaminaDamageCounterDisabler,
  i.e. an attack-application call. The only caller is a bomb-style object (plays SOUND_HIT_BOMB_1) that
  fires this once when oBattleObject_Timer2 counts down to zero, suggesting the queue is consumed one
  tick at a time (e.g. one damage application per explosion tick).
