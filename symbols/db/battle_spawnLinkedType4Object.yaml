name: battle_spawnLinkedType4Object
address: '0x080EA438'
kind: function
status: probable
summary: Spawns a battle object of type id 0x90 linked to a source object, copying its team and panel
  position.
interface: (r0-r3 = spawn params from caller, r0 forced to 0x90; r5 = source battle object) -> r0 = new
  object ptr (0 if spawn failed); flags N/Z from r0
details: Calls object_spawnType4 with type id 0x90 (other spawn parameters prepared by the caller). If
  the spawn returns a non-null object pointer, it stores the source object (r5) into the new object's
  RelatedObject1Ptr field, copying AllianceAndDirectionFlip, PanelX and PanelY from the source, so the
  new object starts on the same panel and team as its source. It then sets flag 0x4 in the new object's
  header flags. If spawning fails, it just returns without touching anything.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'asm: bl object_spawnType4 with mov r0,#0x90 hardcodes the spawned object id; asm: str r5,[r0,#oBattleObject_RelatedObject1Ptr]
    links new object back to the caller''s source object; asm: copies AllianceAndDirectionFlip/PanelX/PanelY
    from r5 to the new object, placing it at the source''s panel/team; asm: orr with 4 on oObjectHeader_Flags
    marks the new object with flag 0x4; callee summary: object_spawnType4 spawns a battle object from
    caller-supplied params and runs its initializer'
