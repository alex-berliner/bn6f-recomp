open_questions:
- Exact meaning of NaviStats byte 0x2c and why the 0xb–0x16 range (CrossBeast forms?) — needs a caller
  or the form table
- Meaning of ChipData flag byte +9 (bit1 set/bit0 clear) and byte +6 == 0xa (element id?)
- What structure [r5+0x58] is and what state 0x1d==2 represents, and what r1's bypass flag means
