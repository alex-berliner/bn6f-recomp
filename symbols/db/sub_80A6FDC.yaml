name: sub_80A6FDC
address: '0x080A6FDC'
kind: function
previous_names: []
status: hypothesis
summary: Looks up a battle object's APwrAtk/BPwrAtk/BButton entries in a small 4×3 jump table and stores two attack-stat
  words into the object's AIData at offsets 0x24/0x28 (zeroing the index on sentinel).
interface: (r5 = BattleObjectPtr) -> void ; side effects writes [r5+0x24], [r5+0x28], [r5+0x6]
details: "- The function takes r5 as the battle object (matching every other AI helper in this\n    region), and\
  \ uses three byte indices on it: r5+5 (APwrAtk), r5+4 (AIIndex/param),\n    r5+6 (BButton).\n  - It loads a 4-entry\
  \ outer table at off_80A7010, indexes it with APwrAtk shifted by 2\n    (so APwrAtk must be 0..3 to stay in range),\
  \ giving a per-button sub-table pointer.\n  - The sub-table (4 entries, each 3 ptrs into attack-stat blobs at\
  \ byte_8140C68 /\n    byte_8140CA4 / byte_8140CE0 / byte_8140D1C) is indexed with AIIndex*4, producing a\n   \
  \ pointer to a small record whose first u16 is the attack-index and second u16 is the\n    attack stat.\n  - It\
  \ adds BButton*4 to that record pointer and reads [r2] (attack index) and [r2+2]\n    (attack stat). Both are\
  \ shifted left by 16 (i.e. treated as 16.16 fixed-point ints\n    or just zero-extended into the upper half-word)\
  \ and stored as full u32 words at\n    r5+0x24 and r5+0x28 - which match the AIData `JoypadPressed` (0x24) and\n\
  \    `JoypadUp` (0x24 layout differs in this dump) / `JoypadReleased` slot. More likely\n    these are AIData\
  \ attack-vars slots feeding the AI loop.\n  - If the first u16 of the chosen record is 0xFFFF, it clears BButton\
  \ (r5+6) to 0 and\n    loops back to retry with BButton=0, ensuring the lookup never returns the sentinel.\n \
  \ - Returns nothing in r0; the contract's \"out = []\" matches this loader's void style.\n  - The function never\
  \ calls any helper; all work is direct table walking. It is called\n    only from sub_80A6F78, which the contract\
  \ shows reads r5/lr and writes r5/r6 - a\n    typical AI per-frame driver that then calls this to (re)load attack\
  \ vars each turn.\n"
