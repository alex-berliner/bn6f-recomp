  date: '2026-10-14'
  detail: '- `push {lr}` and tail `pop {pc}` show a non-returning TailCall-via-LR pattern with no callees; matches
    a self-contained lookup. - `ldrb r3, [r5,#5]` / `[r5,#4]` / `[r5,#6]` line up with BattleObject offsets: r5+0x4
    is `Param1`, r5+0x5 is `Param2` (APwrAtk per AIData mapping), r5+0x6 is `Param3` (BButton per AIData mapping).
    - `off_80A7010` lists 4 sub-table pointers (`byte_8140C68/CA4/CE0/D1C`) and each sub-table is 3 entries, giving
    a 4 (button) × 3 (variant) attack-stat table. - `cmp r0, #0xff` / `bne` and `strb r0, [r5,#6]` implement the
    sentinel retry with BButton forced to 0. - Final stores `str r0, [r5,#0x24]` and `str r1, [r5,#0x28]` write
    the two chosen stats; their slot alignment (0x24, 0x28) matches the BattleObject/AIData fields that the calling
    AI update reads next.'
