open_questions:
- Exact semantics of the chosen stat (raw damage vs. animation id vs. parameter) is
- 'not pinned: the table pointers and the 0xFFFF sentinel suggest "end of list", but'
- the only way to be sure is to read the data at byte_8140C68 / CA4 / CE0 / D1C.
- Which AIData fields 0x24/0x28 actually correspond to (JoypadPressed vs. some
- attack-var) is inferred from offsets; the AIData struct lists 0x24=`JoypadPressed`
- and 0x26=`JoypadUp`, so a u32 write at 0x24 clobbers both. Confirming with
- callers that read these slots would settle the role.
- The exact identification of r5 fields (Param1/2/3) as APwrAtk/AIIndex/BButton
- comes from cross-referencing the AIData macro; verifying against sub_80A6F78
- would confirm.
