summary: If this battle object has a RelatedObject2, deletes/frees it and clears the pointer.
interface: (r5 = battle object) -> void; destroys r0
details: Takes the battle object in r5. Loads oBattleObject_RelatedObject2Ptr; if non-null, calls sub_80C44C8
  with the related object pointer in r0 (presumably its delete/kill routine), then stores 0 back into
  RelatedObject2Ptr so the reference is not double-freed. No branch on the call's return; the pointer
  is cleared unconditionally after the call. Skips everything if the pointer was already null. No known
  callers, so whether it is a shared cleanup helper or an object-specific on-delete step is unconfirmed.
