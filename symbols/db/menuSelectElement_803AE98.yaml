name: menuSelectElement_803AE98
address: '0x0803AE98'
kind: function
status: confirmed
summary: 'Handles the "select" action on a UI list element: if its current index is below its max, plays
  a select SFX, clears a flag, opens sub-window 0x11 with ID 0x90, then refreshes the menu; otherwise
  defers to the overflow handler.'
interface: void menuSelectElement_803AE98(u32 r2, Element* r5, u32 lr) -> r10 preserved; NZCV clobbered
details: "R5 is a pointer to a menu element structure.\n  [R5+0x11]: current index (u8, compared against\
  \ target)\n  [R5+0x13]: flag byte, cleared to 0 on select\n  [R5+0x26]: target/max index (u16)\nIf current\
  \ < target:\n  - PlaySoundEffect(SOUND_MENU_SELECT)  (0x2D)\n  - [R5+0x13] = 0\n  - sub_803BF70(0x11,\
  \ 0x90)  -> opens/targets a sub-window with ID 0x11 and param 0x90\n  - sub_803A878()           -> rebuilds/redraws\
  \ the menu list\nOtherwise (current >= target, meaning the user has scrolled past the last selectable\
  \ entry):\n  - sub_803AEC0()           -> overflow/cancel handling\nFunction is a tail of the two sub-calls\
  \ (pop {pc}), so it acts as a dispatcher between \"valid selection\" and \"out-of-range selection\"\
  \ for a scrollable list element.\n\nRegister form, old prompt; queued for retype (the farm's prompt\
  \ 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
