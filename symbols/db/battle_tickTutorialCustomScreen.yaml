name: battle_tickTutorialCustomScreen
address: '0x08027ADE'
kind: function
status: probable
summary: 'Per-frame tick for a tutorial''s Custom Screen phase: gates on fade, ticks chip-picker GFX helpers,
  sets state=4, and at step 6 queues chatbox_runScript with the TextScriptFirstBattleTutorials archive
  (index out-of-range suggests caller pre-loads r5 or the step check is gated).'
interface: '(r0 = scratch/ignored, r5 = tutorial state struct: +0x01 state byte, +0x02 timer halfword,
  +0x0C step counter, +0x0D substate) -> r0 = clobbered; updates state fields in r5 struct'
details: Early-outs while a screen fade is active. Otherwise calls sub_80279FC, battle_customScreen_clearSelection_80279C8
  (ticks chip-select anim, refreshes the 5 slot sprites), and battleObject_runCustomScreenChipPickerEffect_8028476,
  then sets state [r5+1]=4 and clears the timer [r5+2]=0. When the step counter [r5+0xC] equals 6 it loads
  the script archive at table[6] (TextScriptFirstBattleTutorials entries 0-2 plus the DadCybeast/Shuko
  entries give index 6 = TextScriptShukoCrossTut), runs its script 2 through chatbox_runScript, sets substate
  [r5+0xD]=4 and state [r5+1]=0x34. The trailing byte arrays (byte_8027B2C..byte_8027B4F, off_8027BEC/off_8027C84
  tables) look like data shared with neighbouring tutorial handlers rather than used by this function.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl IsScreenFadeActive + bne locret: frame tick that pauses during fades; bl battle_customScreen_clearSelection_80279C8
    / battleObject_runCustomScreenChipPickerEffect_8028476: runs the custom-screen chip-picker anim each
    frame; strb #4,[r5,#1] / strh #0,[r5,#2]: state machine advance with timer reset; cmp r2,#6 + ldr
    r0,[r0,r2] + chatbox_runScript(r0,r1=2): step-6 trigger opens tutorial dialog script 2; strb #0x34,[r5,#1]
    after script: transitions to the dialog-wait state 0x34'
  refs:
  - bn6f/asm/asm03_0.s:3181
  - 0x08028476 battleObject_runCustomScreenChipPickerEffect_8028476
  - 0x080279C8 battle_customScreen_clearSelection_80279C8
  - 0x08040384 chatbox_runScript
  reproduce: python3 tools/asmcat.py 0x08027ADE
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code at off_8027B1C loads TextScriptFirstBattleTutorials (3 entries: BattleTut1, BattleTutAreaGrab,
    BattleTutFullSynchro), not a Shuko/DadCybeast table. At step==6 this index is out of range, contradicting
    the ''Shuko Cross tutorial'' claim. The base structure of the function (fade gate, sub_80279FC + clearSelection
    + chipPickerEffect, state=4, timer=0, then at step==6 run chatbox script with substate=4, state=0x34)
    fits the summary otherwise. Interface r5 fields (+1 state, +2 timer, +0xC step, +0xD substate) match
    the strb/ldrb instructions.; run wf investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
