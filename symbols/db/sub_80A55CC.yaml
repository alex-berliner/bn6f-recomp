name: sub_80A55CC
address: '0x080A55CC'
kind: function
status: confirmed
summary: Thin wrapper that frees an overworld map object by index (r5) via FreeOverworldMapObject, forwarding its
  r2/r5 outputs to the caller.
interface: 'void freeMapObject_80A55CC(U in: r5 object_index; out: r2, r5; clobbers: nzcv r0 r1 r3 lr)'
details: 'Single-call tail wrapper: pushes lr, calls FreeOverworldMapObject with r5 as the object identifier, then
  returns via pop {pc}. All real work lives in FreeOverworldMapObject; this function only forwards the caller''s
  r5 input and returns the callee''s r2/r5 (r5 preserved through). Used wherever an overworld map object handle
  needs to be released.'
