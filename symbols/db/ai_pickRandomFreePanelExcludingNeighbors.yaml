name: ai_pickRandomFreePanelExcludingNeighbors
address: '0x080F53EA'
kind: function
status: probable
summary: Temporarily reserves the four panels adjacent to an object, picks a random free panel matching
  the caller's attribute filters (i.e. not adjacent to the object) and returns its coordinates, or 0 if
  none exist.
interface: (r0/r2 = required attr bitmask, r1/r3 = forbidden attr bitmask, r5 = object) -> r0 = panel
  x (low 3 bits of list byte), r1 = panel y (high nibble); r0 = 0 if no candidate panel
details: 'Using the offset table byte_80F547C = {(-1,0),(0,-1),(1,0),(0,1)}, the function calls object_reservePanel
  four times to reserve the panels adjacent to the object at r5 (coords at r5+0x12/0x13). It then calls
  object_getPanelsExceptCurrentFiltered with the two attribute masks to list matching, still-unreserved
  panels into a 0x18-byte buffer at sp+8 (count in r6), after which a second loop releases the four neighbor
  reservations via object_removePanelReserve. If the list is empty it retries the filter call once; if
  still empty it returns 0. Otherwise it draws GetPositiveSignedRNG and uses svc 6 (__rt_divmod) remainder
  to index the list, returning x = byte&7 in r0 and y = byte>>4 in r1. Quirk: r5 (and possibly r0/r1)
  are read but not saved, so the caller must set r5 before the call; no known caller confirms the register-result
  convention.'
