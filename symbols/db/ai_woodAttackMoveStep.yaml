name: ai_woodAttackMoveStep
address: '0x08105F20'
kind: function
status: probable
summary: 'Per-frame step of an AI attack: on first call marks the object as a wood-element attacker moving
  onto its reserved target panel, then counts 4 frames and finally stamps the hit element.'
interface: () -> void; r5 = battle object, r7 = object's oAIAttackVars; no return value
details: 'The routine branches on oAIAttackVars_AttackElement: if it is still 0, it sets it to 4 (wood),
  switches the object to animation 0x16, commits FuturePanelX/Y into PanelX/Y, releases the panel reservation,
  recomputes pixel coordinates and collision panels from the new panel position, clears flag 0x40 and
  sets the ''currently moving'' flag (bit 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT), and primes StepTimer
  to 4. On subsequent calls it just decrements StepTimer; once it expires it stores HitElement = 0xC,
  presumably handing off to the hit/damage phase of the attack. This reads as one state of a larger AI
  attack state machine driven by AttackElement/StepTimer/HitElement.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] / strb #4 guards one-time initialization vs countdown
    (asm start); copies oBattleObject_FuturePanelX/Y into PanelX/Y then object_removePanelReserve + object_setCoordinatesFromPanels:
    committing a planned move to the target panel; object_clearFlag 0x40 and object_setFlag1 (1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)
    mark the object as mid-move; anim 0x16 + StepTimer=4, then StepTimer-- with HitElement=0xC on expiry:
    timed animation phase of the attack'
