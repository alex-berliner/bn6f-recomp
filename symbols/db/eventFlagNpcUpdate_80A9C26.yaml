name: eventFlagNpcUpdate_80A9C26
address: '0x080A9C26'
kind: function
status: confirmed
summary: Overworld event-driven object update that flips an NPC/object between hidden (state 1) and shown
  (state 3) based on an event flag, syncing flags and playing appear/disappear animations with a sound
  effect.
interface: void sub_80A9C26(r5 = object ptr, r7 = flag script record ptr); no meaningful return value
  (r0-r3 and nz/c/v are whatever the final sprite_update call leaves behind); preserves r4, r6, r7, r10
details: 'r7 points at a three-halfword flag record: +0 is a trigger flag selecting the object''s state,
  +2 is a flag kept in sync with the object''s idle/active state, and +4 is a one-shot flag cleared once
  the object becomes active. r5 is the object: byte +0 is its state byte, word +0x24 tracks whether the
  active ("appeared") animation is currently up. Each run: if the trigger flag at [r7] is set, the object
  is put in state 3, the +2 flag is set and the +4 flag is cleared; otherwise the object is put in state
  1 and the +2 flag is cleared. While the trigger flag is set, sub_80A9CAE is called as an extra condition
  (it consumes whatever r0 TestEventFlag left behind, a register-form quirk): if it returns nonzero and
  obj+0x24 is still 0, the appear animation is played once — sprite_setAnimation(3), sprite_loadAnimationData,
  sprite_noShadow, PlaySoundEffect(0x1D8) (written as 0xD9+0xFF) — and obj+0x24 is set to 1; if the condition
  has gone away and obj+0x24 is still set, the disappear animation plays once — sprite_setAnimation(5),
  sprite_loadAnimationData, sprite_noShadow — and obj+0x24 is cleared. Finally sprite_update runs. Typical
  use is an NPC/object that materializes or vanishes when an event flag plus an extra condition are satisfied.

  '
