  date: '2026-10-19'
  detail: 'sub_803EFA0: ldrh loop over word_2010420[i] (i=0..3) with cmp r0,#0x168 / bge, returning r4=1
    on first hit else 0; caller 0x0803EB4C and 0x0803EB98: bl sub_803EFA0 then beq returns the pushed
    sub_803EBFC result unchanged; both callers: on nonzero result, eStruct200BC30_getRef then strb #8,[r0,#0xe]
    and mov r0,#4; callers also call sub_8146E78/sub_8148884 and sub_8147B3C/sub_8148FC0 with a cmp r4,#4
