name: checkAnyCounterReached360
address: '0x0803EFA0'
kind: function
status: probable
summary: Returns true if any of four halfword counters at word_2010420 has reached 0x168 (360); callers
  use it to trigger a state change (set byte 0xE=8 in eStruct200BC30 and return 4).
interface: () -> r0 = 1 if any of word_2010420[0..3] >= 0x168 else 0; flags clobbered
details: 'Loops over four halfwords at word_2010420, comparing each against 0x168 (360); if any entry
  is >= 360 it returns 1 immediately, otherwise after all four are below the threshold it returns 0. Both
  callers wrap it the same way: they call sub_803EBFC, save its result on the stack, call this; if it
  returns 0 the saved sub_803EBFC result is returned unchanged, but if it returns 1 the caller writes
  8 to byte +0xE of the eStruct200BC30 structure and returns 4 instead. The array of four short values
  against a single threshold suggests per-slot timers or progress counters, but the game meaning of word_2010420
  is not established here.'
