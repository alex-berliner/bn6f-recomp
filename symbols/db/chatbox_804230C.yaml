name: chatbox_804230C
address: '0x0804230C'
kind: function
status: confirmed
summary: 'One chatbox state-machine step: sets chatbox flag 0x40, bumps the caller''s state pointer by 2 bytes,
  and reports 1.'
interface: int chatbox_stateSetFlag40Advance(void) /* r1,r4,r5 in; r4 is a state cursor advanced by 2; r1 preserved;
  returns r0=1; N/Z set from 1, C/V from the r4+=2 add */
details: 'Tiny chatbox state-machine handler. It calls chatbox_setflags_3e with mask FLAGS_3E_UNK_0040 (flag 0x40
  in the chatbox flag word), then does add r4, #2 on the caller''s state pointer — the standard +2 "advance to the
  next state entry" step used by the chatbox script/state interpreter — and returns 1 in r0. The mov r0, #1 and
  the add both set flags: N/Z reflect the value 1, C/V reflect the pointer add. r1 (used by the caller, e.g. a chatbox
  object pointer or argument) survives because chatbox_setflags_3e is a leaf that keeps r1/r4 intact. Given it sets
  flag 0x40 (likely a "text finished / waiting for advance" style flag) and immediately advances the state cursor,
  this is probably the step executed when a chatbox page completes, telling the state machine to move on.

  '
