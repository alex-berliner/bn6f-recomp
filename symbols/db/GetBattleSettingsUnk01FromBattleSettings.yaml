name: GetBattleSettingsUnk01FromBattleSettings
address: '0x0802D266'
kind: function
status: confirmed
summary: Returns byte at offset 1 of the battle settings struct, an unknown settings field.
interface: Next GetBattleSettingsUnk01FromBattleSettings(u8 *battleSettings /* r0 */)
details: Trivial one-byte getter, likely inlined/tailcalled. Loads the byte at [r0+1] from the battle settings structure
  and returns it in r0 without touching any other registers, so it is a pure accessor for the field at offset 1
  (a still-unidentified setting byte). No flags are intentionally set; the ldrb sets condition flags as a side effect,
  but callers presumably use only r0. The exact in-game meaning of "Unk01" is not determinable from this function
  alone.
