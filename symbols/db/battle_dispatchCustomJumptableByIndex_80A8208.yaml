open_questions:
- What struct `r5` points to and what the byte at `+0x8` semantically represents (looks like `CurState`
  based on the `battle_object_struct` layout, but unconfirmed without a caller trace).
- What the three targets actually do — they aren't named in the provided context. Listing them as a `dispatch`
  table is solid; assigning per-entry meaning needs their bodies.
- Why `r6` is preloaded with `unk_2000B40` (probably so the targets can read/write a shared EWRAM scratch,
  but the trampoline never reads it).
