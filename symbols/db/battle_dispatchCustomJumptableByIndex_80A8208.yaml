name: battle_dispatchCustomJumptableByIndex_80A8208
address: '0x080A8208'
kind: function
status: confirmed
summary: Tail-dispatches a battle object (r5) through a 3-entry state jumptable selected by its byte at +8 (setup
  beast sprite / update sprite / delete).
interface: void battle_beastObjectDispatchState_80A8208(BeastObject *obj /* r5 */, u32 passthrough /* r10 */) /*
  tail-calls table[obj->state08]; results left by the handler in r2-r5,r8-r12 are this function's outputs; clobbers
  r0,r1,r6,r7,lr,NZCV */
details: 'State-machine dispatcher for a battle object that uses the "beast" sprite path (beast-out / Falzar-related
  battle object). r5 points at the object; its byte at +8 is a state index used to fetch a Thumb handler pointer
  from a table of three: index 0 -> battleObject_setupBeastSprite, 1 -> battleObject_updateSpriteAndMaybeReloadAnim_80A827C,
  2 -> deleteOverworldMapObject. The call is a hand-rolled tail call: mov lr,pc / bx r0 / pop {pc}, so the handler
  returns straight to this function''s caller. The handler is entered with r0 = its own address, r1 = the state
  index, r5 = the object pointer, and r6 = the shared work area at 0x2000B40 (loaded from the literal pool), which
  all three handlers evidently expect. Per the caller-derived register contract, r10 is both an input and an output
  (pass-through) and whatever the handler leaves in r2-r5 and r8-r12 becomes this function''s output, so only a
  guest-register-form dispatch can carry it (hence register_form null). r0/r1/r6/r7/lr and the flags are clobbered.
  Classic object-state pattern: 0 = init, 1 = per-frame update, 2 = free/kill.

  '
