name: battleBounceObject
address: '0x080C3598'
kind: function
status: probable
summary: Moves a battle object by its velocity and makes it bounce when its timer expires.
interface: (r5 = battle object pointer) -> void
details: Adds the three components at offsets 0x40-0x48 to the position at offsets 0x34-0x3C and writes
  the result back. Decrements oBattleObject_Timer; on expiration, switches to animation 1, resets the
  timer to 6, reverses oBattleObject_ZVelocity, and sets CurPhaseAndPhaseInitialized to 8.
