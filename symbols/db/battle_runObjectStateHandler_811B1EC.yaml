name: battle_runObjectStateHandler_811B1EC
address: '0x0811B1EC'
kind: function
status: confirmed
summary: Dispatcher that calls the current state handler of the battle object in r5, selected by the state byte
  at +8 via a three-entry jump table.
interface: void battle_runObjectStateHandler(void /* r5 = battle object */); tail-calls handler(r0 = handler address,
  r1 = state id) and returns whatever the handler returns
details: 'Tiny trampoline for a battle-entity state machine. It reads the object''s state id from

  [r5+8] (a byte) and uses it directly as a byte offset into the table at off_811B200, so

  the three valid states are 0, 4 and 8 (any other value would index past the table).

  The selected handler is invoked with lr=pc/bx, i.e. a Tail-call: r0 holds the handler''s

  own address and r1 the state id on entry; all other registers and the NZCV flags pass

  through untouched, and the handler''s return goes straight back to this function''s caller

  (the pop {pc} only runs if a handler returns normally, which the known ones appear to do

  by branching back). Table entries: state 0 -> sub_811B20C, state 4 -> sub_811B284,

  state 8 -> sub_811B290. The object structure touched is only the state byte at +8.

  '
