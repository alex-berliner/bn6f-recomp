- battlesweep
open_questions:
- Exact meaning of the two words passed to the panel-choose callback (x/y bounds?) and which callbacks
  are installed in oAIAttackVars_PanelChooseCallback
- What animation/state id 4 and the value 4 in oAIAttackVars_HitElement correspond to
- 'The overall flow matches: object_canMove gate, per-alliance 8-byte table indexing, callback invocation,
  FuturePanelX/Y stores, object_reservePanel, CANNOT_SLIDE flag, CurAnim=4, StepTimer=3, HitElement=4,
  and object_exitAttackState on failure. However the interface claim ''r0 = 1 if a move was started''
  is wrong—the last explicit r0 assignment before the return is `mov r0, #4` (for HitElement at strh),
  so the success path returns 4, not 1. The name ''ai_chooseMovePanel'' undersells the function: it doesn''t
  just choose a panel, it also reserves it, sets flags, and kicks off the lunge animation and timers,
  making ''ai_startPanelLunge'' more accurate.'
