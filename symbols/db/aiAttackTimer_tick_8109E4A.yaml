name: aiAttackTimer_tick_8109E4A
address: '0x08109E4A'
kind: function
status: confirmed
summary: Ticks an AI attack's countdown timer and tears down the attack when it expires.
interface: void ai_runtick(u32 r5_battleObj, u32 r7_aiVars)
details: "Receives the battle object in r5 and the AI attack-state vars struct pointer in r7.\nOn the\
  \ first call (when the \"initialised\" flag at oAIAttackVars_Unk_01 is 0) it sets\nthat flag to 1 and\
  \ seeds the timer at oAIAttackVars_Unk_10 with 0x28 (40 frames).\nEach subsequent call decrements that\
  \ 16-bit timer; if it is non-zero it returns\nthe post-decrement value (the wrapper sub_8109E4A then\
  \ performs the\n\"SET_FLAGS_CMP(R0 + 1, 1)\" trick to test against 1).\n\nWhen the timer hits zero the\
  \ function performs the attack cleanup:\n  * r5->oBattleObject_ExtraVars+4 (a sliding list) is passed\
  \ through sub_800AA40\n    (list recalculation) and then list_tryAddUniqueEntry_800AA1A (deduplicated\n\
  \    append), keeping that list consistent with the now-ending attack.\n  * The 32-bit pointer stored\
  \ at oAIAttackVars_Unk_30 (the attack-object pointer\n    held by the AI vars) is overwritten with 0\
  \ so the AI no longer references\n    the attack.\n  * object_exitAttackState is invoked to formally\
  \ exit the object's attack state.\n\nQuirks:\n  * Cleanup paths read oBattleObject_ExtraVars+4 twice;\
  \ the ldr/ldr pair between\n    the two helper calls is deliberate (sub_800AA40 may modify the list\
  \ head).\n  * The pointer stored at oAIAttackVars_Unk_30 is treated as a write target rather\n    than\
  \ a pointer dereference here, suggesting that field normally holds a\n    pointer to a slot that the\
  \ AI has been filling during the attack.\n  * The function preserves r4; r5/r7 are explicit inputs,\
  \ r6 is unused.\n"
