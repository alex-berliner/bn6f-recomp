- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_load(0x80, 0, 0xb) + sprite_loadAnimationData + sprite_noShadow attach the object's sprite;
    strb r0,[r5,#oBattleObject_CurAnim] / CurAnimCopy then sprite_setAnimation(0) reset animation state;
    object_getFlip -> sprite_setFlip matches sprite mirroring to the object's facing; strh 0x1B6,[r5,#oBattleObject_NameID]
    identifies which enemy this initializer creates; final str CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized
