name: battle_initEnemy438
address: '0x080C1A34'
kind: function
status: probable
summary: 'Initializes a specific battle enemy object: loads its sprite, resets animation/palette/flip,
  sets its name ID (0x1B6), and switches it to the update state.'
interface: (r5 = battle object pointer, r0..r2 scratch) -> r0 = CUR_STATE_UPDATE stored to object; no
  meaningful return
details: Runs sub_80C205C first (likely common object setup), then calls sprite_load with (0x80, 0, 0xb)
  and sprite_loadAnimationData to attach the enemy's sprite resource. It marks the sprite shadowless,
  zeroes oBattleObject_CurAnim and CurAnimCopy, applies animation 0 via sprite_setAnimation, reloads animation
  data, and sets palette 0. object_getFlip/sprite_setFlip sync the sprite's mirroring with the object's
  facing. It writes halfword 0x1B6 to oBattleObject_NameID (enemy/name-table entry 438), zeroes oBattleObject_Param3,
  and stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the object
  enters its normal per-frame update.
