name: battle_clearAIDataAndBarrier_801A7F4
address: '0x0801A7F4'
kind: function
status: confirmed
summary: Clears a battle object's AI state field (oAIData_Unk_60) and removes its barrier flag in its collision
  data.
interface: battle_clearAIDataAndBarrier(BattleObject *obj /* r5 */)
details: Takes the battle object in r5. Reads the object's AI data pointer (oBattleObject_AIDataPtr) and stores
  0 to oAIData_Unk_60, resetting some AI state; then reads the collision data pointer (oBattleObject_CollisionDataPtr)
  and stores 0 as a byte to offset 6 (oCollisionData_Barrier), dropping the object's barrier. Clobbers r0/r1 and
  the NZ flags; returns via mov pc, lr. Likely called at the end of an AI turn/state where a barrier granted for
  the action expires.
