name: object_timerCountdownPlaySfx
address: '0x080A71EC'
kind: function
status: probable
summary: Decrements an object's countdown timer at +0x38 and plays SFX 0xE2 on its final tick
interface: (r5 = object struct with u32 timer at +0x38; no args) -> r0 = destroyed (void); no meaningful
  flags
details: Reads the 32-bit counter at [r5,#0x38]; if it is 0 the function does nothing. If it is exactly
  1 it plays sound effect 0xE2 before decrementing, so the sound fires once on the last tick. Otherwise
  it just decrements and writes the value back to [r5,#0x38]. Only r5 and that one field are used; r4,
  r6, r7 are pushed/popped needlessly, suggesting a standard object-update entry point whose other work
  was removed or shared.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: cmp [r5,#0x38] with 0/1 gates both the early return and the PlaySoundEffect(0xE2) call (0x080A71EC-0x080A71FA);
    sub r0,#1; str r0,[r5,#0x38] decrements and stores the same field every non-zero pass (0x080A71FE);
    only callee is PlaySoundEffect with fixed ID 0xE2, confirming a one-shot cue, not music; single caller
    sub_80A7160 is itself undocumented, so the owning entity is unidentified
