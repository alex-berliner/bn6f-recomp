name: battle_despawnObject
address: '0x081162AE'
kind: function
status: probable
summary: 'Deactivates a battle object: resets its action state, sets object flag 0x800000, and removes
  it from its collision region.'
interface: (r0 = battle object ptr, passed through to callees) -> r0 = 0 from battle_ResetObjectActionState_80165B8;
  no meaningful flags
details: The function takes a battle object pointer in r0 and immediately calls battle_ResetObjectActionState_80165B8,
  which sets the object's current action to 8 and clears its current phase and phase-initialized flag.
  It then ORs the flag bit 0x800000 into the object's CollisionData ObjectFlags1 word via object_setFlag1,
  and finally clears the object's collision region byte with object_clearCollisionRegion so it no longer
  occupies a collision region. This is the classic teardown sequence for a battle object being removed
  or marked as dead (flag 0x800000 in ObjectFlags1). The data after the function (off_81163F0 handler
  table and adjacent byte tables) indicates this routine is itself an entry in an object definition's
  handler table, consistent with an on-removal/death handler rather than a general utility. No other behavior
  is performed and nothing is read back.
