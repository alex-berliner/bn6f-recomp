name: battleObject_queuePairedSprites
address: '0x081278E8'
kind: function
status: probable
summary: Queues two OAM sprite entries for a battle object, selecting a variant from two adjacent lookup
  tables via the object's byte at +0xD.
interface: (r5 = battle object ptr, reads signed byte at r5+0xD as variant index; r0 = ((variant*8 + 0x200)<<16)|0x70
  and +0x220 variant, r1 = 0x70, r2 = 0, r3 = table, r4 = 0x80004000) -> r0 = callee result (next row
  index); queues 2 OAM entries, then calls sub_8127944
details: Reads the signed byte field at r5+0xD, multiplies it by 8 (table row stride), and adds a base
  (0x200 for the first sprite, 0x220 for the second); the result is shifted to the high halfword and OR'd
  with 0x70 in the low halfword, so r0 packs a tile/coordinate pair for the OAM queueing callee. It passes
  row index 0 into two adjacent u16 tables (dword_8126904, dword_8126908) via battleObject_queueOamFromTableRow_811FAF4,
  with fixed OAM attributes 0x80004000 (attr1 0x8000 / attr2 0x4000), once per table — i.e. two sprite
  pieces drawn together, with the object's +0xD byte picking which graphics variant of each piece. After
  both entries are queued it calls the unknown sub_8127944 before returning. The identical structure of
  the two calls apart from base (0x200 vs 0x220) and table pointer strongly suggests a two-part composite
  sprite (e.g. two halves or two layers of one effect/indicator).
