open_questions:
- No callers known, so the meaning of the +0xD field (variant/frame selector?) and which on-screen element
  uses these two tables is unconfirmed
- sub_8127944 is undocumented; it may post-process the queued entries or update r5 state
- Exact packing semantics of r0's high halfword (tile base vs screen coordinate) depend on the callee's
  internals
