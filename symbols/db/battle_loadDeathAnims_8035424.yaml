name: battle_loadDeathAnims_8035424
address: '0x08035424'
kind: function
status: confirmed
summary: Loads the alternate-death GFX/animation scripts (the "Death" GFXAnim script set referenced via
  `byte_8034AFC`) at battle setup when story flag EVENT_28 is set and the battle-effects bitmask's bit
  3 (mask `0x8`) is clear.
interface: 'void sub_8035424(void);  // uses r10 lr in; clobbers r0-r3, r8-r12, lr; preserves r4-r7

  '
details: "- Three-step gate inside `sub_8035424`:\n  1. `TestEventFlagFromImmediate` against immediate\
  \ flag `EVENT_28` (== `0x28`). If the flag is clear (BEQ taken → function returns), no further work\
  \ is done.\n  2. `GetBattleEffects()` returns an int; the function AND-tests bit 3 (`r1 = 8`, `tst r0,\
  \ r1`). If non-zero (BNE taken → function returns), no further work is done.\n  3. Otherwise, `LoadGFXAnims(gfx_anim_data_arr)`\
  \ is called with the pointer `off_8035448`, which dereferences to `byte_8034AFC` followed by a sentinel\
  \ `0xFFFFFFFF` (i.e. an FFStop32-terminated `[GFXAnimScript]` table). This is what the disassembly currently\
  \ calls the \"death animation\" GFX bank.\n- The trailing function `sub_8035450` plus the two object-spawn\
  \ tables at `byte_803546C` and `byte_80354D4` are not called from `sub_8035424` itself — they are linked\
  \ symbols in the same translation unit (verified C only models `sub_8035424`), so they are not part\
  \ of this entry's behaviour. The C verification confirms `sub_8035424` is a thin wrapper around `gate_load_death_gfx_anims`.\n\
  - Effect in game terms: when flag EVENT_28 is set and the battle is not running the \"alternate death\"\
  \ effect bit, preload the alternate-death animation sprite/GFX scripts into the GFXAnim system so they\
  \ can be referenced later (likely by the death-state scripts in `byte_803546C`/`byte_80354D4`).\n"
