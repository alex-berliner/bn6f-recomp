name: battle_loadCustGaugeGfx
address: '0x0801DF32'
kind: function
status: probable
summary: Resets the in-battle custom gauge and loads its tile graphics and 16-color palette, then flags
  the palette for upload.
interface: () -> r0 = 0 (clobbered by calls); queues VRAM/palette transfers and sets request bit 0x20000
details: First calls ClearCustGauge to zero the gauge progress. It then queues a small graphics list whose
  two entries copy tile data from ROM (dword_86E4C1C, dword_86E489C) to VRAM 0x600C7C0 (0x180 bytes) and
  0x600C440 (0x380 bytes) — the custom gauge tiles. Next it copies 0x20 bytes (16 colors, one BG palette)
  from dword_86E1C78 into the palette staging buffer byte_3001B00. Finally it ORs bit 0x20000 into the
  request dword at eStruct2035280+0x40 and dispatches that bit via dispatch_801DA48, which presumably
  commits the palette in the next frame update.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: calls ClearCustGauge first, tying the function to the custom gauge; gfx list entries target
    VRAM 0x600C7C0/0x180 and 0x600C440/0x380 — tile graphics, matching gauge tile blocks; 0x20-byte copy
    to byte_3001B00 is exactly one 16-color palette load from ROM dword_86E1C78; sets request bit 0x20000
    via eStruct2035280_SetRequestBits_801BECC then immediately dispatches it, marking the palette buffer
    for upload
