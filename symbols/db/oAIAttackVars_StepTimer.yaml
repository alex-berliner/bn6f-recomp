name: oAIAttackVars_StepTimer
address: '0x10'
kind: struct-field
status: probable
summary: Per-frame countdown timer that drives AI-attack sub-state ticks (initialised by state-entry handlers,
  decremented each frame, and tested against 0/thresholds to advance the AI-attack state machine).
details: 'Across all four files the dominant pattern is "strh init_value; ... ldrh/strh sub #1; bmi/bge/bgt
  against zero". In asm00_2.s handlers set Unk_10 to 0x14/0x1e/0xa/0x28/0x36 and in asm31.s aiAttackTimerTick_80EB758
  sets it to 5, sub_80EB1F8 to 5, battleObject_aiAttackTickCharge_80EBEB2 reloads from Unk_12, aiAttack_TimerTickEnd_80EB194
  reloads from Unk_18, aiAttack_handleMoveDirectionTimerAndStartNewAttack_80EB502 reloads from Unk_12,
  and ai_attackStepRunDecrement_80EB1C4''s symdb description calls it a "countdown". The single byte store
  "mov r0,#0x1e; strh r0,[r7,#oAIAttackVars_Unk_10]" in sub_80121BC is the canonical AIAttackVars init.
  asm31.s:110262 (`aiAttackTimerTick_80EB758`) and symdb "confirmed" entry for it (`recomp symbols/db/aiAttackTimerTick_80EB758.yaml`)
  describe this exact decrement/exit pattern.'
