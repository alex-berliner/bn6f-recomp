name: sub_80A52E4
address: '0x080A52E4'
kind: function
status: confirmed
summary: Sprite object step that signals its wait event and marks itself done when its animation ends, then ticks
  the sprite.
interface: void sub_80A52E4(struct object* r5, struct spriteObj* r7, void* r10); returns r2, r5
details: 'Called per frame for an object driven by a sprite animation.

  Reads the current sprite frame parameters via sprite_getFrameParameters;

  if the returned flags have bit 0x80 set (end-of-animation marker), it

  raises the event id stored as a u16 at [r7, #2] (by calling SetEventFlag

  with that id) and writes 0x10 to [r5, #8] to flag the object as finished.

  Always calls sprite_update afterwards to advance the animation.

  r5 is the generic object header (offset 0x8 is the status/state byte),

  r7 is the sprite-specific data block (offset 0x2 holds the event id).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
