name: npc_overworld_CheckStateFlags50000_809F638
address: '0x0809F638'
kind: function
status: confirmed
summary: Tests an overworld NPC object's state flag word for the 0x50000 bit pair and returns 1 if either is set,
  0 otherwise.
interface: bool npc_overworld_CheckStateFlags50000_ADDRESS(OverworldNPCObject *npc /* r5 */); also returns the raw
  flag word in r1 and the mask 0x50000 in r2; clobbers N/Z flags
details: 'Takes the NPC object pointer in r5 and loads the 32-bit flag/state word at

  oOverworldNPCObject_Unk_54 (+0x54). It tests that word against mask 0x50000

  (bits 16 and 18, e.g. some movement/animation or scripted-state marker) via

  tst, returning 1 in r0 when any of those bits is set and 0 when clear.

  As a side effect of the original code, the unmasked flag word is left in r1

  and the constant mask 0x50000 is left in r2; callers per the contract do read

  r1 and r2 back, so they may be consuming these values rather than just the

  boolean. Only the N/Z flags are clobbered.

  '
