name: ai_setFacingTowardTarget
address: '0x081117DA'
kind: function
status: probable
summary: Computes dx = targetX - selfX and dy = targetY - selfY, then writes the facing code (1=right,
  3=left, 2=down, 0=up) to AI work area +0x64, encoding the direction from the entity toward the passed
  target tile.
interface: (r0 = target tile x, r1 = target tile y, r5 = AI work area base) -> r0 = direction code (0/1/2/3)
  stored at [r5+0x64]; no return value; flags set by the compare branches
details: 'Reads the entity''s current position bytes from AI work area +0x65 (x) and +0x66 (y), subtracts
  them from the passed r0/r1 to get dx/dy deltas, then classifies: dx==1 stores 1, dx!=0 and !=1 stores
  3, dx==0 with dy==1 stores 2, dx==0 otherwise stores 0; dy==0 with dx==0 writes nothing. This matches
  the common 0=up, 1=right, 2=down, 3=left compass encoding, so it sets the direction the AI should face/act
  toward the chosen target, written to field +0x64 (the byte just before the position pair). Only writes
  when a direction differs from ''same tile''; the delta can exceed 1 if caller passes non-adjacent tiles,
  in which case dx>1 collapses to 3 (left).'
