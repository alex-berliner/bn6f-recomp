name: getMapGroupVariant
address: '0x080A5F48'
kind: function
status: probable
summary: Returns a byte selected from a three-entry table according to the current map group, with a special
  map-group 0x81 path.
interface: '(r0 = unused r10 context pointer, r1-r3 = unused) -> r0 = selected byte from byte_80A5F64;
  flags: none'
details: The function reads the global game-state pointer through the passed context, then reads the map-group
  byte. Map group 0x81 selects table entry 5, while every other map group selects entry 3; the resulting
  address is loaded from the table and its byte is returned. The table contains bytes 2, 2, and 3, so
  the possible returned values are 2 or 3. The 0x81-specific offset accesses memory immediately after
  the table (byte_80A5F67), also containing 2.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The function reads oToolkit_GameStatePtr and oGameState_MapGroup before branching on 0x81.;
    For map group 0x81 it uses index 5; otherwise it uses index 3.; The indexed load dereferences byte_80A5F64
    and returns the byte at that address.; The embedded table and byte_80A5F67 contain 2, 2, 3, and 2,
    constraining the returned values.
  refs:
  - bn6f/asm/asm29.s:2394
  reproduce: python3 tools/asmcat.py 0x080A5F48
  result: 'proposed by minimax/MiniMax-M3, self_score 3; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-004802'
open_questions:
