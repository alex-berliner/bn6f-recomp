name: battle_SpawnEnemyObjects_8007358
address: '0x08007358'
kind: function
status: confirmed
summary: Spawns the enemy battle objects for the current battle from the enemy setup array, then runs post-spawn
  setup.
interface: void sub_8007358(void) — r5 = battle state (implicit); preserves r2-r12 and lr contents, returns via
  pop {pc}
details: 'Thin wrapper that creates all enemy entities for a battle. It reads the battle settings pointer

  from the battle state struct at r5 (field oBattleState_BattleSettings), then loads the pointer to

  the enemy setup array (oBattleSettings_EnemySetupArrPtr) and passes it as r0 to

  SpawnBattleObjectUsingBattleEntityConfig_8007368, which presumably iterates the array (described

  as MagicStop8<0xF0, [EnemySetup]>, i.e. an array of 0xF0-byte EnemySetup entries) and creates one

  battle object per entry. It then calls sub_80AA88C with no arguments, the post-spawn setup/

  initialization step. Only r0, r1 and the NZ flags are clobbered; every other register the caller

  had is preserved, consistent with this being a leaf-ish helper invoked mid-routine.

  '
