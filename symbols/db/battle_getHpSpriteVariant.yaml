name: battle_getHpSpriteVariant
address: '0x080F2D64'
kind: function
status: probable
summary: Picks a sprite/animation variant index for a battle object, choosing a damaged variant when its
  HP falls below half of MaxHP.
interface: (r0 = base variant index, r5 = battle object) -> r0 = variant index from byte_80F2D80; flags
  clobbered
details: 'Takes the battle object''s MaxHP (oBattleObject_MaxHP), halves it, and compares it with the
  object''s current HP (oBattleObject_HP): if HP <= half max, an offset of 4 is added to r0, otherwise
  0. The resulting index 0-7 is used to read byte_80F2D80, whose two halves are {1,2,3,5} (healthy) and
  {1,3,4,6} (low HP), returning that value in r0. This is the classic ''boss changes appearance when damaged
  below half'' pattern; r0 selects among variant families and the low-HP half shifts to the damaged set.
  r5 is the implicit object pointer, matching the battle-object convention used by other battle code.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r1,[r5,#oBattleObject_MaxHP]; lsr r1,r1,#1 compared to ldrh r2,[r5,#oBattleObject_HP] sets
    the 4-offset low-HP state; ldr r1,=byte_80F2D80; ldrb r0,[r1,r0] returns table values 1,2,3,5 / 1,3,4,6
    for base+state; byte_80F2D80 data shows two parallel 4-entry variant sets differing only in the upper
    entries; called from sub_80F2BEE on a recorded battlesweep route, i.e. during battle object update
  refs:
  - bn6f/asm/asm31.s:126694
  - 0x080F2BEE sub_80F2BEE
  reproduce: python3 tools/asmcat.py 0x080F2D64
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code does take MaxHP, halve it via lsr, compare to HP, and add 4 to r0 if HP > half (ble skips
    the add, so r3=4 when HP is below or equal half), then index into byte_80F2D80 with the combined index.
    However, the summary says ''if HP <= half, add 4'', which is backwards: ble loc_80F2D74 means if half_max
    <= HP (HP not low), skip the add; so r3=4 when HP is strictly less than half_max, not <= half. Also
    the description of the table halves as {1,2,3,5}/{1,3,4,6} is correct. The name and overall idea are
    fine; just the conditional polarity is wrong in the summary.; run wf investigate investigate-20261018-222121;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
