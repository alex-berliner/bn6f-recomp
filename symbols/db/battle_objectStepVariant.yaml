name: battle_objectStepVariant
address: '0x080CD160'
kind: function
status: probable
summary: 'Per-step battle-object handler: early-exits if bytes at offset 0x64 are both nonzero, ticks
  a counter at ExtraVars+0xC that wraps 1→3, dispatches on ExtraVars[1] to sub_80CD26C or sub_80CD236,
  and on nonzero return spawns via sub_80CD488 before moving to phase 4 with timer 12.'
interface: (r4, r5 = battle object) -> void; r0/r2/r4/r6 used for the spawn call to sub_80CD488; sets
  oBattleObject_Timer2 and oBattleObject_CurPhaseAndPhaseInitialized
details: r5 is a battle object; r7=r5+0x64 is read as two bytes and if both are nonzero the function exits
  immediately, so it only acts while at least one of those conditions is clear. It decrements the counter
  at [oBattleObject_ExtraVars+0xC], wrapping 1 back to 3, so the action repeats on a 3-frame cycle. It
  then reads a byte at offset 1 of the struct pointed to by oBattleObject_ExtraVars and calls sub_80CD26C
  when it is zero or sub_80CD236 when it is not — two variants of the same step. If that step returns
  nonzero, it calls sub_80CD488 with r2 = oBattleObject_AllianceAndDirectionFlip, r4 = that same byte,
  and r6 = 0, presumably queuing the attack's effect/projectile. Finally it writes 12 to oBattleObject_Timer2
  and phase 4 to oBattleObject_CurPhaseAndPhaseInitialized, handing control to the next phase after a
  12-frame delay.
