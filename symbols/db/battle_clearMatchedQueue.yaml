open_questions:
- what byte_2019A00's queue holds (its producer writes entries from elsewhere)
- the meaning of byte_8047DA0's array and why entries match by halfword +2 plus byte +4
- which battle field at [r5+0x1c]+0 (value 2) makes the check skipped; a known caller context would settle
  the exact game meaning
- The code zeroes exactly 0x80 bytes (mov r1,#0x40; add r1,#0x40; bl ZeroFillByWord) at byte_2019A00 on
  match, but the loop walks [r7+0xc] entries of 8 bytes each — if count>16, not all entries are zeroed,
  so 'wipes the whole queue' is wrong. The two 'compares' are actually scans via findRecordWithHalfwordAtOffset2/battleFindEntryByFieldByte
  that take only r0 and search arrays at r7. Function name should reflect a conditional queue clear rather
  than clearing a single matched entry.
