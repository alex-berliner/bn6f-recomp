name: sub_80FD4C8
address: '0x080FD4C8'
kind: function
status: confirmed
summary: Dispatches an enemy AI attack by indexing a jump table with the attack index stored in the AI state block.
interface: 'void sub_80FD4C8(void); // in: r7 = AI attack state block; out/clobber: whatever the dispatched handler
  returns (r1, r5, r8-r12 are caller-visible from the handler, plus nz/c/v and r0,r2,r3,r4,r6,lr); r7 preserved.'
details: 'Reads the byte at offset oAIAttackVars_Unk_00 of the AI attack state block

  pointed to by r7 and uses it as a 4-byte index into the jump table at

  off_80FD4DC. The selected entry is loaded into r1 and then tail-called via

  `mov lr,pc / bx r1`, so the dispatch is implemented as a register-indirect

  jump (no switch table wrapper exists in the lifter''s output). The tail call

  means r7 is preserved across the dispatched attack routine and the

  function''s own return (`pop {r7,pc}`) simply restores the caller. The

  three currently known table entries all encode a thumb switch bit (+1) and

  point to sub_80FD4E8, sub_80FD548, and sub_80FD574 respectively.

  '
