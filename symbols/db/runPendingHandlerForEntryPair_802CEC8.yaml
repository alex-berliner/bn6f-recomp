name: runPendingHandlerForEntryPair_802CEC8
address: '0x0802CEC8'
kind: function
status: confirmed
summary: Walks a fixed two-slot table at 0x2036720 and, for each slot whose entry pointer is set and whose "busy"
  halfword flag at +0x24 is clear, invokes a shared handler (sub_802CEA6) with that entry's byte at +0x16.
interface: 'void sub_802CEC8(void); /* out: r4 = &unk_2036720[1] (base + 0x10) */'
details: 'The table base unk_2036720 holds two fixed-size (stride 0x10) slots; the interesting field of each slot
  is a pointer at +0x8 (stored at 0x2036728 and 0x2036738). For each slot in turn the function loads the pointer,
  skips it if it is NULL, then reads the halfword at entry+0x24 and skips it if nonzero (treating it as an in-progress/disabled
  flag). Otherwise it loads the byte at entry+0x16 and calls sub_802CEA6 with it in r0; the callee''s result is
  discarded. Nothing is written back here, so this is a read-only dispatcher/pass over the two entries. As a side
  effect, r4 is left pointing at the second slot''s base (unk_2036720 + 0x10) rather than restored — callers that
  care about r4 must not rely on it being preserved, though the register contract says callers treat r4 as an output,
  suggesting they reuse that pointer. Clobbers r0-r2, lr and flags; preserves nothing.

  '
