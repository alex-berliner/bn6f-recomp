name: NPCCommand_set_text_script_index
address: '0x0809EF40'
kind: function
status: confirmed
summary: NPC script command that reads an immediate byte and sets which text script the overworld NPC will play
  when interacted with.
interface: void NPCCommand_set_text_script_index(r5 = NPC object, r6 = script cursor; returns r0 = text script index,
  r6 advanced by 2; NZCV set by the cursor add)
details: 'This is one of the overworld NPC script interpreter''s command handlers. The cursor (r6)

  points at an opcode byte; the handler reads the operand byte at cursor+1 and stores it

  into the NPC object''s TextScriptIndex field (oOverworldNPCObject_TextScriptIndex),

  which controls which dialog/text script plays when the player talks to this NPC.

  It then advances the cursor by 2 (opcode + operand), so execution continues with the

  next NPC command. Returns the loaded index in r0. The NZCV flags left behind are just

  a side effect of the "add r6,#2" increment, not meaningful output.

  Inputs: r5 = overworld NPC object pointer, r6 = script cursor; lr holds the return

  address (dispatched with "mov pc, lr" like the other NPCCommand_ handlers).

  No memory or registers other than r0/r6 and the object field are touched.

  '
