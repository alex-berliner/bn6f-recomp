name: battle_aiAttackTimerExpire
address: '0x08108580'
kind: function
status: probable
summary: 'AI attack step timer: when the countdown hits zero, reset the attacker''s animation/state and
  finish the attack step setup.'
interface: (r7 = AI attack vars, r5 = battle object) -> r0 = ?; sets ObjectFlags1 CURRENTLY_MOVING_1 bit,
  clears 0x40 bitfield, writes HitElement=0xC, writes StepTimer=0 on expiry
details: Decrements oAIAttackVars_StepTimer and returns early while it is still positive (bgt). When the
  timer reaches zero, it stores 0 into oBattleObject_CurAnim (reset to default/none animation), calls
  object_clearFlag with 0x40, calls object_setFlag1 with the CURRENTLY_MOVING_1 bit, and sets oAIAttackVars_HitElement
  to 0xC. It does not rearm the timer, so it only acts on the tick the timer hits zero. The exact meaning
  of element 0xC and the 0x40 flag depends on the attack that set up this step.
