- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/strh on r7,#oAIAttackVars_StepTimer with sub #1 and bgt — a countdown gate; strb 0 into
    r5,#oBattleObject_CurAnim resets the object''s current animation; object_clearFlag(0x40) and object_setFlag1(1<<CURRENTLY_MOVING_1_BIT)
    toggle the object''s collision flags; strh 0xC into r7,#oAIAttackVars_HitElement assigns the attack
    element for the step; recorded route: battlesweep — runs during battle AI attack processing'
