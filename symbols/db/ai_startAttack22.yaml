name: ai_startAttack22
address: '0x0802EDBC'
kind: function
status: probable
summary: Initializes an enemy's state-work fields, sets a 40-frame timer, and makes the object begin attack
  id 0x16 (22).
interface: (r6 = object/enemy work pointer, set by caller) -> r0 = 1, r1 = 0; clobbers lr
details: Takes its target struct in r6 (callee-saved, so the caller parks the pointer there rather than
  in r0). It zeroes the byte fields at +2, +3, +4, +5, halfwords at +6 and +0xA, and the word at +0xC
  — a state/counter reset — then stores 0x28 (40) into the halfword at +8, likely a frame timer or duration.
  It calls sub_802EEA2 with r0 = 0xA (10), an unknown helper presumably configuring something for this
  state. Finally it calls object_setAttack0 with 0x16, selecting attack/behavior id 22, and returns 1
  in r0 with r1 = 0, the usual 'state step continues/handled' result of a battle AI step function.
