name: battle_setBeastOutAttackDamage
address: '0x0801206E'
kind: function
status: probable
summary: Sets up a Beast Out attack's parameters and computes its damage from the attacker's alliance-scaled
  beast power table entry.
interface: (r0 unused/scratch; uses r5 = attacker battle object, r7 = AI attack vars) -> writes oAIAttackVars_Damage
  (scaled beast power-Atk) and oAIAttackVars_ExtraDamage = 0x8A; no return value
details: First calls somethingWriteChipParams_80126E4 with r0=0x48, likely installing the base chip/attack
  parameters (id 0x48) for this attack. It then loads the attacker's alliance/team byte from the battle
  object at r5 and passes index 0x14 with battle_beastPwrAtk_addScaledBaseFromIndex_8010D04, which looks
  up a 2-byte base value at byte_80212D4 + 2*idx (entry 0x14), forwards it to sub_8012642 for scaling
  by alliance, and returns the final damage. That result is stored into oAIAttackVars_Damage at r7, and
  a fixed extra-damage value of 0x8A is written into oAIAttackVars_ExtraDamage. The use of the beast power
  table and the alliance scaling strongly ties this to Beast Out (Falzar/Gregar) damage calculation for
  an AI-driven attack.
