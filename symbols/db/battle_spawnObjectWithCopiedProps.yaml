name: battle_spawnObjectWithCopiedProps
address: '0x080E6F10'
kind: function
status: probable
summary: Spawns battle object type 0x57 and initializes its panel position, element, and assorted combat
  fields from the caller's arguments and a source object.
interface: (r0 = panel X, r1 = panel Y, r2 = element, r5 = source battle object ptr, r6 = damage/stamina-counter
  field, r7 = extra vars) -> r0 = new object ptr (or spawn-failure value); Z from callee's null check
details: The function saves its r0-r2 arguments plus r5 on the stack, sets r0 = 0x57 and calls object_spawnType4,
  which spawns a battle object and runs its initializer. After the call it pops the saved values back
  into r1-r3/r5 (r0 keeps the spawned object pointer from the callee). It stores the three arguments into
  the new object's oBattleObject_PanelX, PanelY and Element bytes. It then copies oBattleObject_AllianceAndDirectionFlip
  from the source object pointer passed in r5, and stores that same pointer into oBattleObject_RelatedObject1Ptr,
  along with r6 into DamageAndStaminaDamageCounterDisabler and r7 into ExtraVars. A conditional branch
  on the flags left by the spawn wrapper skips all field writes when the spawn returned failure, and r0
  remains the new object pointer for the caller.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: push {r0-r2,r5} / pop {r1-r3,r5} shuffle saves arguments and restores them as the values stored
    to PanelX/PanelY/Element; mov r0,#0x57 before bl object_spawnType4 selects the spawned object id;
    ldrh r1,[r5,#oBattleObject_AllianceAndDirectionFlip] + strh back into the new object shows r5 is a
    source battle object being copied; str r5,[r0,#oBattleObject_RelatedObject1Ptr] links the new object
    to the source object; beq locret right after the call skips all field stores on spawn failure, showing
    flags come from the callee's null check
  refs:
  - bn6f/asm/asm31.s:103028
  - 0x081010DA sub_81010DA
  - 0x080033AC object_spawnType4
