name: ai_attackTeleportToTarget
address: '0x0810749C'
kind: function
status: probable
summary: 'AI attack handler: when the step timer expires, teleports the battle object to its target panel
  (updating panel coords, sprite position, collision record, facing and anim) and arms HitElement=8 for
  3 frames.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no return value
details: Decrements oAIAttackVars_StepTimer and returns early unless it reached 0. On expiry it sets oBattleObject_CurAnim
  to 3, copies oAIAttackVars_TargetPanelX/Y into oBattleObject_PanelX/Y, then calls object_setCoordinatesFromPanels
  and object_updateCollisionPanels so the sprite position, collision record and facing match the new panel.
  It reloads StepTimer with 3 and sets oAIAttackVars_HitElement to 8, likely making the object harmful
  on the target panel for the next few frames. The 3-frame reload implies the handler is called repeatedly
  and may re-trigger steps or a hit window.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh/strh on oAIAttackVars_StepTimer with 'bgt locret' gates everything after the timer hits
    zero; TargetPanelX/Y copied into oBattleObject_PanelX/Y followed by object_setCoordinatesFromPanels
    and object_updateCollisionPanels; mov r0,#3; strb r0,[r5,oBattleObject_CurAnim] sets an attack-style
    animation on expiry; mov r0,#8; strh r0,[r7,oAIAttackVars_HitElement] arms a hit type after arrival;
    reload of StepTimer with 3 keeps the state machine periodic rather than one-shot
  refs:
  - bn6f/asm/asm31.s:168399
  - 0x0800E29C object_setCoordinatesFromPanels
  - 0x0801A04C object_updateCollisionPanels
  reproduce: python3 tools/asmcat.py 0x0810749C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: it decrements StepTimer, on reaching 0 sets CurAnim=3, copies TargetPanelX/Y
    into PanelX/Y, calls object_setCoordinatesFromPanels and object_updateCollisionPanels, reloads StepTimer
    with 3, and sets HitElement=8. However, the bgt early-return is a standard timer pattern; calling
    it ''ai_attackStepToTargetPanel'' is fine but the name emphasizes ''Step'' which is just the timer,
    not the core action (teleporting to target panel and arming hitbox). A clearer name reflecting the
    teleport+arm-hitbox behavior is better.; run wf investigate investigate-20261018-200615; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
