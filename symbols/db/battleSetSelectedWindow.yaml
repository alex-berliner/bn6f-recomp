name: battleSetSelectedWindow
address: '0x0812EC2C'
kind: function
status: probable
summary: Sets or clears a battle-overlay window state by window ID and action type
interface: (r0 = windowId, r1 = mode, r2 = type) -> r0 = windowId; flags preserved
details: Masks r0 to 16 bits, then calls sub_811BC00 with the original window ID and arguments (r1 = mode,
  r2 = type) after placing the masked ID in r4. It returns the masked window ID unchanged. Callers use
  IDs 0x90 and values derived from menu window tables, while battle_restoreMapBackground also passes the
  value at [r5+0x2a]. The underlying sub_811BC00 appears to update a window/overlay state structure; its
  exact field semantics are not visible here.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The wrapper preserves the masked r0 in r4 and passes it to sub_811BC00 as the third argument
    after moving caller r1/r2 into the callee parameter positions.; battle_restoreMapBackground calls
    it as (windowId from [r5+0x2a], 0, 4) and later as (0x90, 1, 4), indicating battle-window state selection/configuration.;
    submenu_renderSelectedWindow passes a table-derived window ID, mode 9, and type 0 immediately after
    drawing that window to BG.; The function returns the masked input window ID rather than a value from
    sub_811BC00, suggesting a setter/state-selection wrapper.
