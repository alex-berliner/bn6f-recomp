name: req_enqueueTask
address: '0x080068EC'
kind: function
status: probable
summary: 'Producer for a polled background-request queue: fills the fixed control block at byte_20081B0
  with a command id, parameters and a work-buffer pointer, then raises its active flag.'
interface: '(r0 = word param stored at +0x4, r1 = word param stored at +0x8, r2 = byte command stored
  at +0x1, r3 = packed value whose upper halfword is stored at +0x2) -> r0 = 1; clobbered: r4-r7 not visible
  to caller, flags destroyed'
details: 'It writes a single static request control block at 0x20081B0: byte +0x1 = r2 (command/type),
  halfword +0x2 = r3>>16 (parameter, e.g. count), word +0x4 = r0 and word +0x8 = r1 (likely source/destination
  or pointer/length pair), word +0xC = constant pointer unk_2008E80, word +0x10 = constant 0x500. Finally
  it stores 1 into byte +0x0 last, which behaves as a pending/busy flag a polling worker would test —
  the last-store order is deliberate. unk_2008E80 is therefore a 0x500-byte work buffer permanently attached
  to the request, not per-call data. The function has no callees and touches no other state; it is purely
  the enqueue half of a producer/consumer pair. Both callers (sub_803FBE8 twice, sub_8006920 once) just
  prepare r0-r3 and call this to post a job.'
