open_questions:
- The exact semantics of r0/r1 on entry are unknown (only r2 is captured); calling convention suggests
  r0 may be unused and r1 may be the beast-out variant index. Whether unk_30019E0 is the actual beast-out
  cross-reference table or a chip/anim pair buffer would settle the meaning of the two-word stores.
