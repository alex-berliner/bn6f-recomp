    the constants 0x4142/0x51e4 vs 0x522e/0x35c3 (`loc_813C0D4`/`loc_813C0DE`). - `mul r2, r3` with `mov
    r3,#0xe` and the `off_813C180`/`off_813C184` (byte_813C188/byte_813C1A4) tables show two parallel
    14-byte stride tables indexed by that mode flag. - `bl battle_checkItemFlagFor_813B9B4` plus `toolkit_getUnk2004190EntryPtr_813B9FC`
    and `battleObject_getByIndex_813B780` give the per-slot battle object whose byte 3 (and byte 1, in
    the loc_813C0F8 path) drives the index passed to sub_813C4A8. - The inner loop counter `cmp r4,#0x31`
    plus the `ldrb r0,[r6,r4]` byte-walk is consistent with scanning the 0x31-byte Unk200414c slot list
    held by the toolkit. - `strh r1,[r2]`/`strh r1,[r2,#2]` into `unk_30019E0 + lsl r3,#1` writes a u16
    pair into the RAM region. - All callees live in the battle/AI/object subsystem (`battle_checkItemFlagFor_813B9B4`,
    `battleObject_getByIndex_813B780`, `toolkit_getUnk2004190EntryPtr_813B9FC`), and the LR 0x08136B3F
    points at the beast-out driver in `sub_8136B10`.'
