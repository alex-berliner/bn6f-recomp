name: battle_beastOutApplyCrossChanges_813C06C
address: '0x0813C06C'
kind: function
previous_names:
- sub_813C06C
status: probable
summary: Iterates the battle slot table for the beast-out forms, swaps in matched chip/animation pairs
  into `unk_30019E0` when the active navi owns the appropriate flag.
interface: '(r0 = ?, r1 = ?, r2 = modeFlag, r10 = toolkit) -> r0 = 0 ; side effects: writes to unk_30019E0
  entry table'
details: "Allocates 0xc bytes on stack to stash the original r2 (the mode flag passed in by sub_8136B10),\
  \ a pointer to the chip-id row (byte_813C1A4) and the cached \"checked item flag\" word.\n  The function\
  \ picks one of two parallel tables by the value of r2: byte_813C188 holds animation slots and byte_813C1A4\
  \ holds chip-id slots (both 14-byte stride via `mul r2, #0xe`). It also preloads `byte_813C14C`, a 49-entry\
  \ table of remap indices used by sub_813C4C8.\n  Calls `battle_checkItemFlagFor_813B9B4(r1)` to obtain\
  \ a 1..N flag id, then loops r4 over 0..0x30 scanning the toolkit's Unk200414c_Ptr byte list (`ldrb\
  \ r0,[r6,r4]`). For each non-zero entry it calls `toolkit_getUnk2004190EntryPtr_813B9FC(idx-1)` to fetch\
  \ a u16, looks up a battle object via `battleObject_getByIndex_813B780(u16)`, reads a per-object byte\
  \ at offset 3, doubles it, and hands it (plus the cached flag) to sub_813C4A8/sub_813C4C8 which together\
  \ pick a remap slot from byte_813C14C.\n  When the slot returned by sub_813C4C8 is non-zero, it stores\
  \ either the row-0 (animation) or row-1 (chip) u16 from the chosen table into `unk_30019E0 + 2*slot`.\
  \ If `curAnimCopy` (object[1]) is non-zero it also overwrites the +2 word of that entry with the second\
  \ table value, suggesting the two u16 words form an anim/chip pair.\n  Returns 0 (r0) on exit and clobbers\
  \ r4-r7 only for the caller.\n"
