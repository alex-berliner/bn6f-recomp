open_questions:
- The exact classification returned by sub_800118A (0..7). The 8-byte table at byte_80A7084
- plus the early-out on r0==0 strongly suggest it returns a signed direction class (e.g.
- N..N with 0 meaning "same panel"); capturing the return value for distinct r0/r1 inputs
- would pin it down.
