name: aiAttack_stepStateMachine_80EB04C
address: '0x080EB04C'
kind: function
status: confirmed
summary: Runs one step of the AI-controlled attack state machine for a battle player object, dispatching via a state
  table and latching "busy" when the held D-pad direction changes.
interface: void aiAttack_stepStateMachine_80EB04C(struct AIAttackVars *ai /* r7 */)
details: 'Dispatches on the state byte oAIAttackVars_Unk_00, which is not an index but a raw byte offset (0,4,8,0xC,0x10)
  into the handler table at off_80EB074 (sub_80EB088, sub_80EB128, sub_80EB194, sub_80EB1C4, sub_80EB1F8). The handler
  is entered with r0 = state byte, r1 = its own table entry, using a mov lr,pc / bx r1 dispatch so a handler that
  returns with pop {pc} would return to this function''s caller; handlers may clobber flags and LR which pass through.
  After the handler returns, it tests oAIAttackVars_Unk_30 ("busy"): if nonzero it returns immediately. Otherwise
  it polls the D-pad with playerObject_checkDirectionButtons_800FA54 and compares the result with the remembered
  direction in oAIAttackVars_Unk_0c; if they differ it stores 1 into oAIAttackVars_Unk_30, marking the AI busy (presumably
  to re-evaluate or cancel the current attack decision when the player-facing direction input changes). All state
  lives in the R7 object struct.

  '
