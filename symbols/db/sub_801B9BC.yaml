open_questions:
- Whether r5 at entry truly is the caller-supplied battle object used to find the AI, or whether the AI pointer
  itself is the target whose HP is zeroed; the assembly uses r3 as AIData and r5 both for the early load and the
  final HP write
- The exact semantic of oAIData_Unk_54 (target object pointer vs other AI field) — knowing what writes to oAIData_Unk_54
  in callers would settle it
