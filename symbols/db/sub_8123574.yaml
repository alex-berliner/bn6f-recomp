name: sub_8123574
address: '0x08123574'
kind: function
status: confirmed
summary: Drives a battle object into mode 2 by running its setup chain and triggering a fade/sfx effect, then moves
  the object into sub-state "0xC / 0" once any in-flight screen fade completes.
interface: void sub_8123574(void); /* r5 = battle object ptr, r6/r10/lr in; r5 out; clobbers r0-r3, lr, n/z/c/v
  */
details: '- r5 is treated as a battle object handle. Field at offset 0x20 (u16) is set to 2 (a "mode" or phase).

  - Calls a fixed setup chain sub_8123BC0 -> sub_8123BE0 -> sub_8123C00 -> sub_8123D70, each operating on the same
  r5-based object.

  - Calls sub_811B314(1, 3) which kicks off the battle''s fade/sfx helper (arg1=1 likely fade-in/transition kind,
  arg2=3 likely speed or color preset).

  - Calls IsScreenFadeActive; only when NO fade is currently running does it advance the object''s sub-state bytes
  to 0x0C at offset 2 and 0x00 at offset 3. The bytes at +2/+3 read as a sub-state / step pair (e.g. (phase=0xC,
  step=0)).

  - The two-byte ST16 at r5+0x20 plus the ST8 fields at r5+2 / r5+3 suggest the object layout is `[+2 sub-state][+3
  step]` and `[+0x20 mode]`.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
