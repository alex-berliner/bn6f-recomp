name: battle_scanPanelRunEnd
address: '0x080E52B0'
kind: function
status: confirmed
summary: 'Periodic check (run from the scan phase driver) for whether a battle object''s panel run has reached its
  end tile; when it has, spawns the follow-up object 49 and advances the object to phase 4 with a 12-frame timer.

  '
interface: 'void battle_scanPanelRunEnd(r5=battleObject, r10=toolkit, lr=return; preserves r4, r6, r7; returns with
  r5 as set by battle_spawnObject49 on the success path, otherwise untouched; clobbers r0-r3, lr and flags)

  '
details: 'Early-outs (no side effects) if either gate fails: (1) when oBattleObject_Param3 is set, the alliance''s
  slot in the toolkit''s battle state (offset 0xC0 + alliance*4) must be free; (2) the scratch byte pair at obj+0x60/0x61
  must not both be non-zero (run already marked). Otherwise it decrements the counter at oBattleObject_ExtraVars+0xC
  (wrapping 0 back to 3), calls object_findMatchingPanelRunEnd with the counter in r1, the object in r5, and r7
  pointing at the obj+0x60 scratch bytes; if that search finds the run''s end tile, it spawns object 49 with the
  found tile data, the object''s AllianceAndDirectionFlip halfword, and Param1, then writes Timer2 = 12 and CurPhase
  = 4 (phase-initialized byte cleared as a side effect of the halfword store).

  '
