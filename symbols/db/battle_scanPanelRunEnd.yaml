  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise — The behavior
    matches the proposal (Param3 gate, alliance pointer at +0xC0, decrementing ExtraVars+0xC wrapping to 3, calling
    object_findMatchingPanelRunEnd, then sub_80CD488 with Param1/AllianceAndDirectionFlip, Timer2=0xC, phase=4).
    However, Timer2 is set to 0xC frames and the next phase is written as phase=4 (strh, both bytes), but the proposal
    says oBattleObject_CurPhase=4 ignoring it''s a halfword write of phase+initialized. More importantly, the function
    is a battle-object phase step, so the prefix should be ''battle'' not ''object'', and the name should reflect
    the panel-run search action, not ''PanelRunAdvance''. Also, no callers were captured, so ''periodically'' is
    speculative.; run wf investigate investigate-20261018-212108; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
