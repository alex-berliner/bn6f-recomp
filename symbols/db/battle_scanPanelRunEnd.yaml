name: battle_scanPanelRunEnd
address: '0x080E52B0'
kind: function
status: probable
summary: Battle-object phase routine that, if Param3 is unset (or alliance pointer at BattleState+0xC0 is set) and
  overlap flags at +0x60/+0x61 are clear, decrements a counter at ExtraVars+0xC (wrapping 3→0) and calls object_findMatchingPanelRunEnd;
  on success it invokes sub_80CD488 and sets Timer2=12 frames with phase=4.
interface: (r0-r3 = scratch; r5 = battle object, r10 = toolkit) -> void; sets oBattleObject_Timer2=0xC and oBattleObject_CurPhase=4
  when a run is found
details: 'Gates on oBattleObject_Param3: if set, it aborts unless the alliance''s pointer at BattleState + alliance*4
  + 0xC0 is non-null. It also aborts if either byte at r5+0x60/r5+0x61 (likely overlap/collision flags) is nonzero.
  Otherwise it decrements the counter at oBattleObject_ExtraVars+0xC, wrapping 0 to 3, so the scan cycles r1 = 3,2,1
  — the side argument to object_findMatchingPanelRunEnd, making it probe a different direction each 4th call. If
  that callee finds the far edge of a matching panel run (nonzero return), it calls sub_80CD488 with r2 = AllianceAndDirectionFlip,
  r4 = Param1, r6 = 0 (probably moving/acting toward the found edge), then sets Timer2 = 12 frames and phase = 4.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_Param3] plus alliance-indexed BattleState+0xC0 pointer check gates the scan;
    ExtraVars+0xC is decremented and wrapped to 3, then passed as r1 to object_findMatchingPanelRunEnd (side rotation);
    on hit: sub_80CD488 called with AllianceAndDirectionFlip/Param1, then Timer2=0xC and CurPhase=4 written; no
    known callers; recorded in battlesweep and beastsp routes'
  refs:
  - bn6f/asm/asm31.s:97506
