name: initBattleNaviData_8013554
address: '0x08013554'
kind: function
status: confirmed
summary: Initialize a 100-byte battle NetNavi struct with default fields, sentinel ranges, and a stat
  value pulled from the Navi stats table.
interface: void initBattleNaviData_8013554(BattleNaviData *navi /* r0 */); r10 provides the Navi stats
  table base; returns with the struct pointer preserved in r4.
details: "Zero-fills 0x64 (100) bytes at r0 via ZeroFillByWord, then writes fixed default byte fields:\n\
  \  +0x04 = 0x46 (navi type/identity marker),\n  +0x08/+0x09/+0x0A/+0x0B = 0x00/0x04/0x05/0x05 (action-state\
  \ defaults),\n  +0x0C = 0x01 (active flag),\n  +0x0E = 0x99 (state/sub-state sentinel),\n  +0x27 = 0x1F\
  \ (timer or animation counter default).\nCalls GetNaviStatsHword(1, 0x42) — argument 0 likely selects\
  \ the \"current player Navi\" slot,\n0x42 is the stat index (possibly attack power or max HP). The returned\
  \ hword is stored at\noffsets 0x3E, 0x40, and 0x42 (three adjacent hword slots, probably cur-HP / max-HP\
  \ / attack).\nByte ranges 0x2E–0x30 and 0x56–0x5B are filled with 0xFF as \"unset/invalid\" sentinels\
  \ so\nlater logic can detect uninitialized sub-fields.\nr10 is read implicitly by GetNaviStatsHword\
  \ (global Navi-stats table pointer). r2 is preserved.\n"
