name: sprite_loadAnimationData
address: '0x080026A4'
kind: function
status: confirmed
summary: Skips an object header forward to its attached sprite data block and tail-calls the shared animation loader
  on it.
interface: void sprite_loadObjectSpriteAnimation(ObjectHeader* header /* r5 */, scratch r4); trashes r0-r3 and flags;
  preserves r4/r5; called with lr as return address
details: 'Takes an object header pointer in r5. Reads the byte at header+2 (oObjectHeader_TypeAndSpriteOffset),
  keeps only the high nibble (>>4 then <<4), and advances r5 by that many bytes to point past the 16-byte-aligned
  header at this object''s sprite data. It then loads the word at off_80026C0 — which resolves to the shared loader
  entry, _sprite_loadAnimationData+1 (Thumb bit set) — into r4, sets lr = pc so the callee returns straight back
  here, and bxs to it. After the callee returns, r4 and r5 are popped from the stack, so both are preserved for
  this function''s caller; r0-r3 and the NZCV flags are whatever the loader leaves behind. The computed call through
  off_80026C0 is effectively a self-referential dispatch: the pointer target carries this same symbol name, so the
  real shared loader body is presumably merged/mislabeled at this address in the current disassembly.

  '
