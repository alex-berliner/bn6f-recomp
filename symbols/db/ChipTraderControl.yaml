  - bn6f/asm/main.s:67
  reproduce: 'grep -rn ChipTraderControl bn6f/asm

    sed -n ''30,42p;67,96p'' bn6f/asm/main.s'
  result: main.s:95 (.word ChipTraderControl+1 under the 0x34 comment) and the definition only
- method: assembly-reading
  date: '2026-10-13'
  detail: vidsync's reading lists the chip trader as a per-frame primary advance (one GetRNG a frame) and notes
    it is not on the any% route; its sync driver never runs, writes or reads it. Its docs cite asm03_2.s:7061, which
    is stale (the definition is at 7306).
  refs:
