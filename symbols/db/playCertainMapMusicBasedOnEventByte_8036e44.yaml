name: playCertainMapMusicBasedOnEventByte_8036e44
address: '0x08036E44'
kind: function
status: confirmed
summary: Selects and stores the music track for the map the player is currently on, looked up per map group/number
  with a per-sub-area table, defaulting to track 0x63.
interface: void playMapMusicForCurrentSubArea(toToolkit* toolkit in r10 /* r4-r7 preserved */); leaves r1 = current
  map group (gameState+4), r2 = current map number (gameState+5) in registers on return; clobbers r0 and flags.
details: 'Reads the GameState pointer and the s2001c04 music work-area pointer from the toolkit (r10). Takes the
  current map group (oGameState_MapGroup, +4) and map number (oGameState_MapNumber, +5), and uses game state byte
  7 (oGameState_Unk_07, treated as a map sub-area selector) shifted left by 2 to index the table at off_80360E4,
  yielding a per-sub-area list of 8-byte entries: byte 0 is a map group and bytes 4..7 are a pointer to a byte array
  of tracks indexed by map number. Walks the entries until one whose group matches; stores the track byte for the
  current map number into oS2001c04_MapMusic (+4 of the s2001c04 work area). If an entry with group byte 0xFF is
  reached (terminator / no match for this group), stores the default track 0x63 instead. r1 and r2 still hold the
  map group and map number on return, which callers may rely on; r4-r7 are pushed/popped and thus preserved. Despite
  the current name, the lookup is driven by the map group/number and the sub-area byte at oGameState_Unk_07, not
  obviously by an event flag byte — hence the proposed rename.'
