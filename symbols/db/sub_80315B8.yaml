open_questions:
- What struct is at r0 — the captured pointer `0x0200f3e0` doesn't match a documented AIData/BattleState offset
  cleanly; verifying which global holds it and whether `r0[0]/r0[1]` are ints, fixed-point, or half-words would
  settle the real semantics (hitbox-in-rect vs. signed-area vs. point-in-quad).
- Why a chatbox/text setup path calls a 2D-vector test at all — possibly it is being called for the chatbox print-position
  calculation against the mugshot/box bounds; needs the caller's argument setup to confirm.
