name: sub_80315B8
address: '0x080315B8'
kind: function
previous_names: []
status: hypothesis
summary: Tests whether a character cell (column r4, row r3) inside a chatbox text block at r0 lies inside a non-blank
  tile using 2D cross-product-style sign tests
interface: (r0 = chatbox/text-block struct ptr, r1 = ?unused/0x6fd6, r2 = height-in-cells (r5), r3 = ?cell coord
  (used both as row count and index), r4 = ?cell coord, r5 = width-in-cells (r6)) -> r0 = 1 if hit, 0 if blank;
  side effects none beyond return value
details: "Thumb math: r6 = r5 - r4  (signed diff)\n            r7 = r2 - r3\n            r3 = r3 * r4    (low half\
  \ of MUL)\n            r2 = r5 * r2\n            r2 = r3 - r2    -> r2 = r3*r4 - r5*r2 = r4*r3 - (width)*(row)\n\
  \  Then loads two 32-bit values from [r0+0] and [r0+4] into r3 and r4,\n  folds r6 (= width - cellX) and r7 (=\
  \ height - cellY) into them,\n  and adds r2 to the sum. The combined value is compared with 0 (`ble loc_80315D8`\
  \ => no, else yes).\n  This looks like a 2D half-plane test (\"is point (cellX,cellY) inside rectangle whose opposite\
  \ corner is (width,height)\")\n  using the determinant (x*Y - y*X), but loaded from the chatbox struct (possibly\
  \ tile/block descriptors).\n  Two captured calls with r0=0200f3e0 dump bytes 0..0x27 of that struct: first u32\
  \ = some kind of \"top-left tile index\",\n  second u32 = the matching \"bottom-right tile index\". Other captured\
  \ calls show r0=0200f3e0 with first/second u32\n  swapped sign (0xffffffff 0x07...), which would make the result\
  \ positive (= \"inside\") and exit r0=1, matching snap_story2_10..12.\n  Callee list is empty (leaf function);\
  \ all callers chain through other textbox/text setup helpers.\n  Inputs r0..r5/lr are read; only r0 is written\
  \ on exit (r2..r7/r4/r5 preserved per contract — they're callee-saved so this is normal).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mul r3, r4` / `mul r2, r5` followed by `sub r2, r3, r2` (asm line ~24725) computes r4*r3 - r5*r2 —
    a 2D cross term - The two `ldr` from `[r0]` and `[r0,#4]` plus the multiplication by `(width-cellX)` and `(height-cellY)`
    produce (cellX,cellY)''s offset from the bottom-right tile''s coordinate frame. - `cmp r5, #0; ble loc_80315D8;
    mov r0,#1` vs `mov r0,#0` returns a clean bool — typical "is point inside cell?" helper. - All callers (`text_setupTextboxAndStartPrint_8031BB2`,
    `textbox_StepAndRefreshWindow_8031BCA`, plus the sub_8031C2A/C2A/C94/7C/C2/5B6 series) are text/textbox-step
    routines, and r0 in the dumps points to what looks like a chatbox tile-range sub-struct. - Captured exits flip
    between r0=0 and r0=1 purely based on the sign of the leading u32 word in [r0..3], confirming the test depends
    only on those two 32-bit fields and the cross term.'
