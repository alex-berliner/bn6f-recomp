name: sub_80315B8
address: '0x080315B8'
kind: function
previous_names: []
status: hypothesis
summary: Returns 1 if the (r4,r5) and (r3,r2) deltas cross-product *into* a 2x2 cross-shaped hit area defined by
  a struct passed in r0; otherwise 0.
interface: (r0 = ptr to a small struct of two u32 pairs; r2,r3,r4,r5 = signed 16.16 coords forming two vectors)
  -> r0 = 1 if test passes else 0 ; side effects none
details: "Steps:\n    r6 = r5 - r4          ; r7 = r2 - r3\n    r3 = r3 * r4          ; r2 = r2 * r5\n    r2 = r3\
  \ - r2          ; cross product (r3,r4) x (r2,r5)? (signed)\n    r3 = [r0]   ; r4 = [r0+4]\n    r5 = r2\n    r3\
  \ = r3 * r6 ; r4 = r4 * r7\n    r3 = r3 + r4\n    r5 = r5 + r3\n    if r5 > 0 -> r0 = 1 else r0 = 0\n  No callees.\
  \ Pure leaf. Two memory loads from *r0.\n  Called only from the textbox subsystem chain (`text_setupTextboxAndStartPrint_8031BB2`,\n\
  \  `textbox_StepAndRefreshWindow_8031BCA`, and a handful of related `sub_8031C2A/1C7C/1C94`\n  wrappers), but\
  \ the routine itself reads at most 8 bytes and has no chatbox-aware\n  behaviour — the callers are reaching into\
  \ an AIData-style struct ([r0] and [r0+4]\n  could be the 2x2 AttackVars-style block at oAIData+0xa0). Treat the\
  \ struct type as\n  unknown.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mul r3,r4`; `mul r2,r5`; `sub r2,r3,r2` is a textbook 2D signed cross product (`r3*r5 - r2*r4`). -
    Two `ldr` from `r0` and `r0+4`, plus `mul` against the just-computed differences — second inner product / dot-ish
    sum. - Final `cmp r5,#0; ble 0; mov r0,#1` vs `mov r0,#0` — boolean return (>0 ⇒ true). - Captured-call memory
    at `[r0 @0200f3e0]` shows two consecutive u32 pairs (`03 00 00 00 08 00 00 00` and `00 00 00 00 ff ff ff ff`/etc.)
    — exactly the *x0,y0,x1,y1* pattern an AttackVars hitbox would have, but the pointer is EWRAM 0x0200f3e0, not
    0x0200xxx known AIData slots, so the struct identity is not pinned down. - Caller list (textbox setup/refresh
    wrappers) is the only way to reach it during story2 captures.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080315B8

    '
  result: the body read as described above
- method: coverage
