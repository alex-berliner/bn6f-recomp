name: battle_objectDelay4ThenDestroy
address: '0x080BE39A'
kind: function
status: probable
summary: Battle-object state handler that plays anim 2 for 4 frames and then flags the object for destruction.
interface: (r5 = battle object) -> r0 = clobbered (return value unused by handler)
details: On first invocation (PhaseInitialized == 0) it sets CurAnim = 2, Timer = 4, and marks the phase
  initialized, so the object shows animation state 2 for exactly 4 frames. Each subsequent call decrements
  Timer; while Timer > 0 the handler returns and does nothing else. When the countdown reaches 0 it clears
  bit 1 of oObjectHeader_Flags and writes CUR_STATE_DESTROY to oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  making the engine despawn the object. The function takes its object in r5, so it is a state-action callback
  dispatched by the battle object loop rather than a normal callee with r0 args.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'asm: first-call branch sets CurAnim=2, Timer=4, PhaseInitialized=4 (loc at 0x080BE39A-80BE3AD);
    asm: Timer is decremented and ''bgt locret'' skips destruction while still counting; asm: on Timer
    expiry, ''bic r0,#2'' clears bit 1 of oObjectHeader_Flags and CUR_STATE_DESTROY is stored to CurStateActionPhaseAndPhaseInitialized;
    struct fields oBattleObject_PhaseInitialized/CurAnim/Timer/oObjectHeader_Flags show this is a standard
