name: battleObject_syncVisualStateFromRelatedObject_80B863A
address: '0x080B863A'
kind: function
status: confirmed
summary: Copies all visual properties (flags, shader, palette, render info, flip, mosaic, alpha) from a battle object's
  RelatedObject1 onto itself, then dispatches a per-action render step via a jump table.
interface: void battleObject_mirrorVisualStateAndStep_80B863A(BattleObject *r5 self, void *r10 renderBase); // outputs
  r5-r12; clobbers r0-r4,r6-r7,flags,lr
details: 'Reads r5''s RelatedObject1 pointer (oBattleObject_RelatedObject1Ptr) to obtain the source ''master'' object.
  Merges bit-1 (hidden/invisible) from the master''s ObjectHeader_Flags into self''s flags. Fetches the master''s
  colour shader via sprite_getColorShader and applies it to self with sprite_setColorShader. Fetches the master''s
  final palette via sprite_getFinalPalette and applies it with sprite_setFinalPalette (passing the result in R1
  through r5 self). Gets sprite-flag-10 / render-info-high from the master via obj_getSpriteFlag10AndRenderInfoHigh_8002F3E
  and stores them on self through loc_8002F02. Copies oBattleObject_DirectionFlip byte from master to self. Reads
  self''s sprite flip via object_getFlip and applies it via sprite_setFlip. Reads the master''s mosaic scaling parameters
  via sprite_getMosaicScalingParameters and feeds them into sprite_setAlpha for self. Finally, indexes a 3-entry
  jump table at off_80B8698 with r5''s oBattleObject_CurAction: entry 0 → battleObject_stepSprite_80B86A4, entry
  1 → battleObject_stepSprite_80B86C4, entry 2 → battle_lobbedProjectileUpdate. The dispatch uses mov lr, pc / bx
  r1 (a tail-style indirect call that will push/pop through the target''s own epilogue). r10 (render base) is left
  untouched for the callee. The three jump-table entries are Thumb targets (+1 suffix), confirming the dispatch
  is in Thumb mode.'
