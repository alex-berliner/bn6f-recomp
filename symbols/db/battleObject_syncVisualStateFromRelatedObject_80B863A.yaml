open_questions:
- What the three action sub-handlers (sub_80B86A4/C4/D4) actually do — whether they are idle/active/destroy
- phases or different visual sync modes. The exact semantics of "related object" here (is it always a
- parent/owner, or sometimes a target?) is also unverified beyond the naming.
