name: object_freeClearingOwnerRef
address: '0x080E1E0C'
kind: function
status: probable
summary: Destructor that clears a self/back-reference stored in the object's extra-vars list, then frees
  the battle object slot.
interface: (r5 = battle object ptr, r0 unused) -> r0 = clobbered by call; object slot freed
details: Loads the object's oBattleObject_ExtraVars list pointer and reads its first entry. If that entry
  points back at the object itself (r5), it writes 0 there, removing the circular reference (likely so
  a variable pointing to the owner doesn't dangle). It then tail-ends into object_freeMemory, which clears
  flags, frees the sprite/bitmap slot, unlinks from the active list and resets scaling. Note the object
  pointer arrives in r5 rather than r0, so callers must set r5 up (typical of this codebase's object-destroy
  convention).
