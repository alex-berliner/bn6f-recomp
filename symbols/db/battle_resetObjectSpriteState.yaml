name: battle_resetObjectSpriteState
address: '0x080C1590'
kind: function
status: probable
summary: 'Re-initializes a battle object''s sprite: loads sprite set 4/0x1d, resets animation/position/flip/palette,
  clears a flag, and moves the object into its update state.'
interface: (r5 = battle object pointer, set by caller) -> r0 = result of tail-called sub_80C15EC; no other
  regs preserved
details: Runs with the object in r5 (never set here, so callers must have loaded it). It decompresses
  sprite resource (4, 0x1d) via sprite_decompressTemp, then sprite_load(0x80, 4, 0x1d) and refreshes the
  animation data and shadow. It zeroes oBattleObject_CurAnim and its copy, calls sprite_setAnimation(0),
  recomputes pixel coordinates from the object's panel grid, zeroes oBattleObject_Z, and applies object_getFlip
  to the sprite. Palette is set to 3 * the byte at r5+0x64, i.e. that field indexes a palette variant
  with three palettes per value. It clears bit 2 of oObjectHeader_Flags (likely an unloaded/inactive bit),
  stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized, and tail-calls sub_80C15EC.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sprite_decompressTemp(4,0x1d) + bl sprite_load(0x80,4,0x1d) reload a specific sprite resource
    set; strb r0(0),[r5,#oBattleObject_CurAnim] and bl sprite_setAnimation(0) reset the animation; bl
    object_setCoordinatesFromPanels / str 0,[r5,#oBattleObject_Z] / bl object_getFlip + sprite_setFlip
    reset placement; ldrb r0,[r5,#0x64]; mul r0,#3; bl sprite_setPalette derives palette from a variant
    field; mov r0,#CUR_STATE_UPDATE; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    advances the state machine
  refs:
  - bn6f/asm/asm31.s:20501
  - 0x0800E456 object_getFlip
  - 0x0800E29C object_setCoordinatesFromPanels
  - 0x08002E3C sprite_hasShadow
  reproduce: python3 tools/asmcat.py 0x080C1590
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-223614'
open_questions:
- No callers are known, so which object type uses sprite resource (4, 0x1d) and when this reset runs is
  unknown
- Meaning of the byte at object offset 0x64 and why palettes come in groups of three
- What the tail-called sub_80C15EC does and what bit 2 of oObjectHeader_Flags means
