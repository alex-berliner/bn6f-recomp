name: sub_8129918
address: '0x08129918'
kind: function
status: confirmed
summary: Text-box command dispatcher; routes by state byte to one of six handlers, then runs sub_812B25C(0x12).
interface: '/* On entry: r5 = text-box object pointer, r4/r6/r7/r10/lr = caller state */

  /* On exit : r5/r8/r9/r10/r11/r12 = sub_812B25C''s r5/r8/r9/r10/r11/r12 (clobbers r0-r4,r6,r7,lr and NZCV) */

  void textbox_step_8129918(void /* preserved via r5 -> typed wrapper */);

  '
details: 'Looks at byte 3 of the text-box state object at `r5` (0..20 step of 4: 0x00/0x04/0x08/0x0C/0x10/0x14),

  indexes the jump table at `0x08129930` (six entries, each loaded with the `+1` Thumb-bit trick), and

  tail-dispatches with `mov lr, pc; bx r0` so the handler runs with r0 = its own table slot and r1 =

  the raw state byte, all other guest registers (r2-r7, r10-r12, SP) preserved. After the handler

  returns, calls `sub_812B25C` with r0 = 0x12 and the handler''s modified r4/r5/r6 threaded through,

  and propagates that call''s r5/r8-r12 back to the caller. This is the "0x12" follow-up phase for the

  per-step text-box command interpreter.

  '
