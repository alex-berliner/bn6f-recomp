name: sub_8134740
address: '0x08134740'
kind: function
status: hypothesis
summary: 'Per-frame battle object tile blit: copies one tile row using a mode chosen by the palette-slot byte and
  decrements the upper-nibble animation counter in obj+0x15, reloading it from sub_8120CC8 when it reaches zero.'
interface: void sub_8134740(u32 battleObj /* r5 */); /* r5 preserved; nz/c/v clobbered; r0-r3,r4,lr clobbered via
  sub_811FAF4/sub_8120CC8 */
details: "Object layout used (offsets from r5):\n  +0x0D : palette-slot byte - selects tile-source mode mask\n \
  \         0 -> 0xC0000, nonzero -> 0xA40000\n  +0x15 : packed state byte - low nibble is preserved/forwarded to\
  \ the\n          blitter and the sub_8120CC8 result; high nibble is the\n          animation counter (decremented\
  \ each call, reloaded on underflow)\n  +0x34 : u16 X coordinate - multiplied by 0x10 and ORed into the\n     \
  \     tile-source descriptor (plus a constant 0x20 base)\nTile-source descriptor passed to sub_811FAF4: mode |\
  \ (x*0x10 + 0x20).\nsub_811FAF4 is called with r0=tile_src, r1=2, r2=low nibble of obj+0x15,\nr3=byte_81331F4,\
  \ r4=0x40000000 (looks like an OAM/tile blit setup with a\nfixed base in VRAM).\nAfter the blit, the saved high\
  \ nibble of obj+0x15 is decremented; on\nunderflow (becomes 0) sub_8120CC8(blit_r0, dword_81331FC) is invoked\
  \ and\nits return r0 overwrites the whole obj+0x15 byte while r1 provides the\nnext counter value, which is then\
  \ shifted back into the upper nibble\nalongside the (post-call) current low nibble. r4 is preserved across the\n\
  whole sequence even though sub_811FAF4 trashes it.\nNaming \"battle_obj_*\" because the layout (palette slot,\
  \ X coord, packed\nstate byte with frame counter) is consistent with the per-frame battle\nobject driver in BN6;\
  \ without stronger context the exact object type\n(chip, enemy, panel, effect...) is not pinned down.\n"
