name: object_runVanishPhase
address: '0x080D4DF0'
kind: function
status: probable
summary: 'Battle-object phase handler for an object that has hidden itself: keeps it out of collision,
  periodically queues a battle effect tied to its panel/element, and destroys it (with a poof effect)
  once its vanish timer expires or the battle ends.'
interface: (r5 = battle object pointer) -> r0 = clobbered; sets oBattleObject_CurPhase to 4, or destroys
  the object via CUR_STATE_DESTROY
details: The routine first bails out during time-stop, clears oBattleObject_PreventAnim and removes the
  object from its collision region (so it is intangible). It then calls sub_80D4FF6 on oBattleObject_ExtraVars;
  a 0xff result means the hidden state is finished, otherwise the returned value is stored into oBattleObject_Alliance
  (the object apparently changes side/identity while hidden). It fires dispatch_801DACC with flag 0x40,
  computes an effect id via sub_80E6878 from oBattleObject_PanelX/PanelY/Element (r3=0), Params and DamageAndStaminaDamageCounterDisabler
  with base 0x75, and passes it to battle_queueEffectRequest as an active effect request with side flag
  1, then advances oBattleObject_CurPhase to 4. In the battle-over/expired path it clears the collision
  region again, reads three words at r5+0x34 (position/anim data, y-offset + 0x100000) to spawn a type-0
  effect object, clears object flag bit 1 (visible/active), and sets the combined state word to CUR_STATE_DESTROY.
