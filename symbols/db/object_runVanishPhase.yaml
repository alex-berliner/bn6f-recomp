    the effect; destroy path: ldmia r5+0x34 into spawn_t1_0x0_EffectObject, bic flag bit 1 of oObjectHeader_Flags,
    then CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized'
