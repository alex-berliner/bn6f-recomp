name: battle_applyPanelPattern
address: '0x080E6CAA'
kind: function
status: probable
summary: Stamps a per-attack 3x6 panel-type pattern (from a table indexed by Param1 and Alliance) onto battle panels
  whose flags match a required state.
interface: (r0 = battle object in r5? uses r5 fields, no args passed) -> r0 clobbered; sets panel types via object_setPanelType
  and calls sub_80E6DFC per panel
details: Reads oBattleObject_Param1 (x12) and oBattleObject_Alliance (x120) to index byte_80E6D0C, a 240-byte table
  of 20 patterns, each 12 bytes = 3 rows x 4 bytes. For row r6 = 1..3 and column r4 = 1..6 it loads the row word,
  extracts nibble (r4-1) (values 0,2,3,6,7,8 = normal/crack/broken/grass/holy/ice panel types), calls object_checkPanelParameters(col,row,0x10,0x40)
  to confirm the panel's flags (set-mask 0x10, clear-mask 0x40, likely 'not a hole/protected'), and only then calls
  object_setPanelType with the nibble and sub_80E6DFC (likely panel-change visual/handler). The Alliance index presumably
  selects the mirrored copy of the pattern for the opposing side. Nothing is returned; the function acts purely
  on the panel field.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; mul by 0xc; ldrb r1,[r5,#oBattleObject_Alliance]; mul 0xa*0xc -> indexes
    byte_80E6D0C as 20 patterns of 12 bytes; loop r4=1..6 (cols) inside r6=1..3 (rows) matches the 6x3 battle field;
    ldr word, lsr (r4-1)*4, and 0xf then object_setPanelType -> panel type taken from packed nibbles (0,2,3,6,7,8
    seen in table); object_checkPanelParameters(r4,r6,0x10,0x40) gates each change, skipping panels that fail the
    flag test; byte_80E6D0C second half (0x66,0x62,0x28,0x26...) repeats the first half's shapes with different
    types, consistent with an Alliance-mirrored variant table
