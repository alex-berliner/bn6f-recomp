name: battle_setPosRadialOffsetFromRelatedObject
address: '0x080E1CB0'
kind: function
status: probable
summary: Positions this battle object at a radial offset (distance r0, angle r1) from its linked object's
  position, copying that object's 3-word position block to +0x34 with cos/dist applied to the first word
  and sin/dist to the third.
interface: (r0 = distance in 1/256 fixed point, r1 = angle index 0-255 into math_cosTable/math_sinTable)
  -> r0 = clobbered; writes 3 words at object+0x34, no flags of note
details: Reads cosTable[r1*2] and sinTable[r1*2] as signed halfwords, multiplies each by r0 and shifts
  left 8 (so r0 is a fixed-point radius, tables are 1/256 scaled). It then loads three words from [oBattleObject_RelatedObject1Ptr
  + 0x34] and stores them to r5+0x34, adding the cos*radius term to the first word and the sin*radius
  term to the third word — i.e. the linked object's x/y (or x/depth) position displaced along a circle
  of the given radius and angle. Caller sub_80E1BDC passes a growing radius (timer*4) and a wrapping angle
  (timer*0x70 & 0xFF), producing a spiral-away motion before resetting the object's action/phase. Caller
  sub_80E1C66 passes (0,0), which simply snaps this object onto the linked object's exact position before
  setting sprite priority and starting an alpha fade.
