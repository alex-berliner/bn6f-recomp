name: battle_resolveBattleOutcome
address: '0x08009E56'
kind: function
status: probable
summary: Battle-state handler that, after the hand-validation helper returns a nonzero outcome code (1/2/7),
  records that result and busting-level category, writes BattlePhase to eStruct fields, gates phase-2
  completion on battle-effect bits 0x8/0x2/0x400, then sets Index_01 (0x14 or 0) and clears StatePhaseAndInitFlag
  to advance the state machine.
interface: (r5 = current battle state object) -> void; sets battle state fields BattlePhase->result byte,
  BustingLevelCategory, Index_01, StatePhaseAndInitFlag
details: 'Runs the per-frame init-once pattern (SubPhaseInitFlag guards sub_8009140), then calls the hand-validation
  helper; when it returns nonzero the battle is being resolved. It dispatches on oBattleState_BattlePhase:
  for phases 1 and 2 it stores that value as the battle result via setTwoStructs_800A840, computes the
  busting-level category from battle effects into oBattleState_BustingLevelCategory, and writes player-eStruct
  fields Unk03 (battle phase) and Unk00. In the phase-2 branch it additionally reads GetBattleEffects
  and only proceeds when bit 8 and bit 2 are clear, unless bit 0x400 is set and sub_800AF50 returns nonzero
  — gating the end on special battle-effect conditions. Phase 7 just stores result 7. Finally Index_01
  is set to 0x14 (or r2=0 in the gated path) and StatePhaseAndInitFlag is cleared to move to the next
  battle sub-state.'
