    tst), and only enters the 0x400/sub_800AF50 gate when both are SET. Name is acceptable but summary
    should say ''dispatches on the hand-validation outcome code'' rather than ''BattlePhase''.; run wf
    investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
