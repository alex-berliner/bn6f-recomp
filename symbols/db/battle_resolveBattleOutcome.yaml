    result stored to [r5,#oBattleState_BustingLevelCategory]; phase-2 branch tst's GetBattleEffects against
    8, 2 and 0x400 (off_8009FB8) before sub_800AF50; tail sets [r5,#oBattleState_Index_01]=r2 (0x14 or
    0) and strh 0 to StatePhaseAndInitFlag
