  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal claims dispatch is on oBattleState_BattlePhase, but after push/pop of the hand-validation
    return value, cmp r0,#1/2/7 branches on someChipHandValidationHappensHere''s result (the outcome code
    1=win, 2=loss, 7=other), while BattlePhase is only read to write eStruct via setUnk03. The bit-condition
