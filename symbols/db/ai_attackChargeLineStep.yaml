name: ai_attackChargeLineStep
address: '0x08112104'
kind: function
status: probable
summary: 'AI attack state step: charge animation, telegraphs a line of panels in front of the attacker,
  then fires (sets hit element and counter).'
interface: (r0 unused entry, r5 = battle object, r7 = AI attack vars) -> void; updates oBattleObject_CurAnim,
  oAIAttackVars_AttackElement/AttackStepIndex/StepTimer/HitElement
details: On first entry (AttackElement==0) it sets AttackElement=1, computes AttackStepIndex from the
  object's PanelY and the target's byte 0x13 (target HP-ish field), and starts CurAnim=3. While CurAnim==2
  it waits for sprite_getFrameParameters' 0x80 attribute bit before re-entering anim 3. Every 4th StepTimer
  tick it iterates x from PanelX+frontDir while 0<=x<=6, calling the panel-highlight helper with a row
  offset of 1 (or 0x18 when AttackBoost2 is set) to mark the attack's path on the grid. When StepTimer
  hits 0 it sets CurAnim=4, arms object_setCounterTime(0x1E), clears the timer, and stores HitElement=4.
  Uses Alliance^DirectionFlip for facing like other battle code.
