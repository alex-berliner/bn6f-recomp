    anim 3; loop loc_8112170: bl highlightPanelIfSomeCondition_8109660 with x+=frontDir, bounded by cmp
    #6 — telegraphed panel line; StepTimer countdown then mov #4 strb CurAnim + bl object_setCounterTime(0x1E)
    + HitElement=4 — attack fires when charge ends; AttackBoost2 branches select row offset 1 vs 0x18,
