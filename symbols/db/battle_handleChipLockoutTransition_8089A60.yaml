open_questions:
- 'What `ClearEventFlag` argument the code passes is opaque: assembly uses `mov r0,r0` (a NOP) before the call,
  so r0 is whatever `battle_getSoulWeaponBase_81427CE` returned — but its meaning (an event flag ID? a struct ptr?)
  isn''t fully verified.'
- The role of sub_814219C / sub_81422B4 (whose return values flow into the SetEventFlagFromImmediate / ClearEventFlagFromImmediate
  macro operands) is opaque from this fn alone.
- Whether r5 truly is a BattleObject or some battle-context struct is inferred from the offset 0/byte-write pattern;
  the captured registers don't include a struct dump so the exact meaning of "chip-lockout state byte" is hypothesis.
