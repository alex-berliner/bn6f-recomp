name: NPCCommand_do_not_face_player_when_interacted
address: '0x0809EEAA'
kind: function
status: confirmed
summary: Overworld NPC script command that marks the NPC so it does not turn to face the player when talked to,
  then advances the script.
interface: "Next NPCCommand_do_not_face_player_when_interacted(void) /* r5 = overworld NPC object pointer (in),\
  \ r6 = script/pc counter (in/out),\n   r0, r1 = scratch (out); NZCV set by the r6 increment; returns via lr */\n"
details: 'Script-command handler for overworld NPCs. Reads the NPC''s UnkFlags_60 field (oOverworldNPCObject_UnkFlags_60),
  ORs in bit 1 (value 2, OW_NPC_UNK_FLAGS_60_FACE_PLAYER_WHEN_INTERACTED), and writes it back. Despite the constant''s
  name, the command''s effect (per its established name) is to stop the NPC from re-orienting toward the player
  when interacted with, implying the bit actually acts as a "keep facing" suppressor (or the flag semantics are
  inverted relative to the constant name). It then increments r6, the NPC script program counter, so execution proceeds
  to the next script command; flag outputs (nz/c/v) are just side effects of that add. No other registers or memory
  are touched.

  '
