  detail: '- `r2 * 0xe` (`mov r3,#0xe; mul r2,r3; add r5,r5,r2`) and the matching `byte_813C188`/`byte_813C1A4`
    tables of length 0x1c/0x1c (7 u16 entries each) imply a per-index table of 7 codes (0xe stride = 7 halfwords).
    - The 0x31-iteration loop (`cmp r4,#0x31; blt loc_813C08C`) walks `Unk200414c_Ptr` (an 0x31-entry u8 array via
    the toolkit offset). - Captured calls all show r1=3 (the BeastOut trigger code) and r2 toggling between 0 and
    1 across snap_beastsp_*.bin, matching the `tst r2,r2; bne loc_813C0DE; ... 0x5A91/0x35C3` selection between
    two pairs of codes. - `strh r1,[r2]` into `unk_30019E0 + 2*flag` matches an indexed write to a 16-bit beast-out
    flag/state array in EWRAM. - The two helpers `sub_813C4A8`/`sub_813C4C8` only consume `(r0)` or `(r0,r1)` and
    return a struct base + an AIData offset, consistent with translating a BattleObject slot to its AIData.'
