name: sound_stepFadeSequence
address: '0x0802A30C'
kind: function
status: probable
summary: 'Per-step sound ticker for the screen fade: plays the two fade-sequence sound effects for the
  current step, advances the step counter, and latches the next fade state once the fade ends.'
interface: (r5 = fade controller *S20364C0) -> r0 = clobbered; sound requests queued
details: Reads oS20364C0_FadeSeqIndex from the fade controller and uses it to index byte_802A3F4 and byte_802A400,
  two parallel tables of sound parameters. For each table it calls sound_dispatchSoundRequest_8000642
  once — handler 0x1f with the byte_802A3F4 value, then handler 0x16 with the byte_802A400 value — both
  with r1 = 0xffff, so each fade step emits two paired sound events (likely one per fade channel/phase).
  It then advances FadeSeqIndex by 2 and stores it back, consuming two bytes per step. If IsScreenFadeActive
  reports the fade is over (r0 == 0), it writes 8 to oS20364C0_JumpOffset12, the controller's next-state/jump
  field. No return value.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r4,[r5,#oS20364C0_FadeSeqIndex] then ldrh r2,[r2,r4] indexes byte_802A3F4/byte_802A400
    per step; two sound_dispatchSoundRequest_8000642 calls with fixed handler ids 0x1f and 0x16 and r1=0xffff;
    add r4,#2 / strb r4,[r5,#oS20364C0_FadeSeqIndex] advances the sequence two bytes per call; bl IsScreenFadeActive;
    cmp r0,#0; bne skip; mov r0,#8; strb r0,[r5,#oS20364C0_JumpOffset12] sets next state only when fade
    finished; callee summary: sound_dispatchSoundRequest_8000642 looks up a sound handler by id and forwards
    it to the dispatcher'
