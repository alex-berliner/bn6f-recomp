name: sub_800B79A
address: '0x0800B79A'
kind: function
status: hypothesis
summary: Range-checked dispatcher that jumps to one of five handlers based on a command id in r0 (valid ids 0x11E-0x122),
  ignoring any other value.
interface: void dispatchScriptCommand_800B79A(int id /* r0 */); tail-calls handler via lr; r2-r5, r8-r12 pass through
  untouched to the handler
details: 'Takes a command/opcode id in r0 and bounds-checks it against 0x122 (upper) and 0x11E (lower); if it falls
  outside the range the function just returns via pop {pc}. Otherwise it subtracts 0x11E, scales by 4, and loads
  a Thumb handler pointer from off_800B7BC (entries 0..4: sub_800B7D0, sub_800B7E8, sub_800B800, nullsub_2, sub_800B80E).
  The dispatch trick is unusual: the handler pointer itself is left in r0, lr is set to the instruction after the
  bx (mov lr, pc picks up the two-set-bit Thumb address of locret_800B7B4''s pop), so the handler''s own return-to-caller
  convention chains straight through this function — the handlers see their own table entry in r0 and everything
  except r0/r1/r6/r7/flags passes through unchanged. A range of ids starting at 0x11E with a small handler table
  plus a nullsub slot is characteristic of a script/text-engine or NPC command opcode dispatcher, but the subsystem
  prefix is a guess until the five handlers are identified.

  '
