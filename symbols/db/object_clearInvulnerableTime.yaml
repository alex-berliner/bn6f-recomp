name: object_clearInvulnerableTime
address: '0x0800EB08'
kind: function
status: confirmed
summary: Ends a battle object's post-hit invulnerability by zeroing its invulnerability timer and clearing the invulnerable
  flag.
interface: void object_clearInvulnerableTime(r5=battle object*); out r1, r2 (leavings of object_clearFlag), clobbers
  r0 and flags
details: Takes the battle object in r5, loads its CollisionDataPtr (oBattleObject_CollisionDataPtr), and stores
  0 as a halfword into oCollisionData_Unk_28, which is the post-hit invulnerability countdown that blocks further
  hits after damage is taken. It then calls object_clearFlag with r0 = 8 to clear bit 8 of the object's flag bitfield,
  the "currently invulnerable" state bit. Because it tail-delegates to object_clearFlag and pops {pc}, the register
  contract propagates object_clearFlag's r1/r2 outputs to callers; callers that want only the flag state should
  ignore them. Typically invoked when the invulnerability window should end early (e.g. on recovery or state reset),
  complementary to whatever decrements the timer each frame.
