name: sub_811CC3A
address: '0x0811CC3A'
kind: function
status: hypothesis
summary: Clears bit 1 of an object/status byte, dispatches command 2 through sub_811CC60, and always reports success
  (returns 1).
interface: int sub_811CC3A(void* statusByte /* r5 */); /* always returns 1; sets NZ,C,V from r0=1; r1 and lr are
  clobbered */
details: Takes a pointer in r5 to a one-byte status/state field, reads it, clears the 0x02 bit (bic r0,#2), and
  writes it back. It then calls sub_811CC60 with r0 = 2, which appears to be a command/request dispatcher keyed
  by this small command value (bit 1 of the status byte may be an "in progress"/"busy" marker being released as
  command 2 is issued). The function unconditionally returns 1, with flags set from that value, so callers likely
  only test the boolean result or ignore it entirely. No other memory or registers are touched; the exact meaning
  of the status byte and command 2 depends on what structure r5 points into, which is not visible from this function
  alone.
