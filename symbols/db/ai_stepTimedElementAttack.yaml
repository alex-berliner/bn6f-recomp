  date: '2026-10-18'
  detail: 'ldrb/tst on oAIAttackVars_AttackElement with mov #4 store: one-time element setup on entry
    (asm lines 3-8); ldrh AttackDuration -> strh StepTimer: initializes the countdown from a per-attack
    duration field; sub StepTimer / bgt locret: per-frame countdown, idle until it hits zero; ldr ScratchVar;
    bl sub_80FCF9C then bl object_exitAttackState: fires the attack payload once, then leaves attack state;
    Field names oAIAttackVars_* and callee object_exitAttackState place this in the enemy AI attack-state
