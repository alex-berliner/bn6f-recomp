name: ai_stepTimedElementAttack
address: '0x080FC2DC'
kind: function
status: probable
summary: 'AI attack-state tick: arms an element and delay on entry, then on expiry fires the attack and
  exits the attack state'
interface: (no args; r7 = enemy object with oAIAttackVars) -> r0 = ScratchVar passed to sub_80FCF9C; flags
  from sub_80FCF9C/exitAttackState
details: Runs each frame while the object is in this AI attack state. On first invocation, when oAIAttackVars_AttackElement
  is 0, it writes element 4 into AttackElement and copies AttackDuration into StepTimer, arming a countdown
  (element is only chosen once, so a nonzero value persists across re-entry). On later frames it decrements
  StepTimer and does nothing until it reaches 0. When the timer expires it reads oAIAttackVars_ScratchVar
  and calls sub_80FCF9C with it — presumably the routine that actually performs/spawns the attack — then
  calls object_exitAttackState to leave the attack state.
