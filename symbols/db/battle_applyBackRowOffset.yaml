  date: '2026-10-18'
  detail: bl object_setPanelsFromCoordinates immediately on entry ties the routine to battle-object panel
    re-derivation; ldrb r0,[r5,#oBattleObject_PanelY]; sub r0,r1,r0; mul by dword_80C40D0=0x180000 gives
    (3-PanelY)*1.5; the product is added to both oBattleObject_Y and oBattleObject_Z (str to both fields);
    Y16 and Z16 are each loaded, incremented by 1, and stored back — per-frame counters; constant table
    0x10000/0x80110C00/0x180000/0x2110 shows fixed-point math around the 1.5 multiplier
  refs:
