name: battle_applyBackRowOffset
address: '0x080C409C'
kind: function
status: probable
summary: Recomputes the battle object's PanelX/PanelY from world coords, then adds (3 - PanelY) * 1.5
  to both Y and Z (bigger push for smaller/back PanelY) and ticks the Y16 and Z16 16-bit counters.
interface: (r5 = battle object; r0 passed through to callee) -> updates oBattleObject_PanelX/PanelY, Y,
  Z, Y16, Z16; no meaningful return
details: Calls object_setPanelsFromCoordinates to recompute the object's PanelX/PanelY from its world
  X/Y/Z. It then computes (3 - oBattleObject_PanelY) * 0x180000 (0x180000 = 1.5 in fixed point) and adds
  that value to both oBattleObject_Y and oBattleObject_Z, so the offset applied grows for smaller (back)
  PanelY values. Independently it increments the halfword fields oBattleObject_Y16 and oBattleObject_Z16
  by 1 each call, which look like per-frame counters. Note r5 is used without being set in this function,
  so the object pointer must arrive in a preserved/global register convention shared with the callee.
  The equal adjustment of Y and Z keeps their difference constant while shifting both.
