summary: 'Proposed name: battlePanelRuns. Player-grid equal-panel runs emitted by battle_encodePanelRuns
  and consumed during battle panel updates. (table of what)'
details: A runtime list of four-byte run records for equal panels in the player side of the 6×3 panel
  grid. battle_encodePanelRuns scans the grid in zigzag order and appends records until a terminating
  0xFF byte. battle_updatePanels_800C746 treats the first byte as an end marker and reads the third byte
  to process each queued panel-encounter pair. The label's size therefore reflects only the allocation
  before the next label, not the list's maximum logical extent.
