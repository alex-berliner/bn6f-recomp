open_questions:
- Exact meaning of each sub_80039AA / sub_8003AFA / sub_80027B4 / sub_800286C / sub_8003BF4 / sub_8003E98 / sub_8004298
  / sub_8004590 / sub_8004934 — they are ordered init/update passes for the battle scene, but their individual roles
  are not yet named.
- sub_800531C is identified only as "battle main"; whether it is the per-frame battle update loop or a one-shot
  scene transition into battle is not pinned down.
- The two-stage gate (countdown finished AND fade still active) suggests battle_main is deliberately not entered
  during a still-dark or pre-fade-in moment; the precise design intent (preventing first-frame glitches vs. intentional
  sequencing) is unclear.
