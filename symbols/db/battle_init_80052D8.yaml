name: battle_init_80052D8
address: '0x080052D8'
kind: function
status: confirmed
summary: Per-frame battle-scene init that ticks the dispatch and each sub-system, then hands off to the battle main
  loop once the start countdown has elapsed and a screen fade is still active.
interface: void battle_init_80052D8(void) /* r4 r6 r7 preserved; clobbers r0 r1 r2 r3 r5 r8 r9 r10 r11 r12 lr; flags
  nz,c,v */
details: "Battle scene initialization step (one frame). Calls a fixed sequence of subsystems that\nmake up battle\
  \ setup/updates:\n  - dispatch_80339CC (input / event dispatch)\n  - sub_80039AA, sub_8003AFA (battle subsystem\
  \ ticks)\n  - sub_80027B4, sub_800286C (likely battle object/animation setup)\n  - sub_8003BF4, sub_8003E98 (battle\
  \ subsystem ticks)\n  - npc_drawSprites_800467C (NPC sprite drawing)\n  - sub_8004298, sub_8004590, sub_8004934\
  \ (further battle subsystem ticks)\n  - event_runArmedCallback_80024AE (runs any armed scripted-event callback)\n\
  Then calls tickCountdownGate_803F530; the bne (Z clear) means \"countdown still ticking\",\nso we only proceed\
  \ when the countdown has finished (Z set, i.e. the gate is open).\nAlso checks IsScreenFadeActive (Z clear ->\
  \ fade active); we proceed only when the fade\nis still active. Only when both conditions hold does it call sub_800531C,\
  \ which is the\nbattle main loop (the comment in the assembly says \"triggers battle main\").\nPreserves r4/r6/r7\
  \ across the call (matches the GameState pointer convention used by\nthe engine), so the function treats r5 as\
  \ a long-lived GameState/self pointer rather\nthan allocating fresh state.\n"
