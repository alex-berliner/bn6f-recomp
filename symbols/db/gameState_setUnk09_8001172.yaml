open_questions:
- The semantic meaning of the byte (the comment says "03 = can't jack out") is not directly visible from
  this function; it would be confirmed by checking which callers use 0x03 vs 0x00 and which transitions
  they accompany. - Whether the field is really "can't jack out" or some other L-button/scenario gate,
  since the struct comment is the only hint we have here.
