name: battle_objectMoveLinearAndCheckDestroyFlag
address: '0x080DD22E'
kind: function
status: probable
summary: Per-frame update that moves an object by its velocity and destroys it when the current anim frame
  carries the 0x80 attribute flag.
interface: (r5 = battle object pointer) -> r0 = frame attribute byte; sets oBattleObject_X/Y, oBattleObject_CurStateActionPhaseAndPhaseInitialized
details: Uses r5 as the object pointer without ever setting it, so the caller passes the object in r5
  (a common BN6 convention). On the first call it sets oBattleObject_CurPhase and oBattleObject_CurAnim
  to 1, then every call adds oBattleObject_XVelocity to oBattleObject_X and oBattleObject_YVelocity to
  oBattleObject_Y. It calls sprite_getFrameParameters for the current frame and tests bit 0x80 of the
  returned attribute byte; if set it writes CUR_STATE_DESTROY into the state field, ending the object.
  Suitable for one-shot flying projectiles/effects that fly straight and despawn on their last frame.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r1,[r5,#oBattleObject_CurAnim] with 1 on first tick (80DD232-80DD23C) initializes phase/anim;
    add r0,r0,r1 pairs on X/XVelocity and Y/YVelocity integrate motion; bl sprite_getFrameParameters then
    tst r0,#0x80 reads frame attribute for destroy condition; mov r0,#CUR_STATE_DESTROY; str into state
    field is the standard object kill path; callee sprite_getFrameParameters documented as returning tile
    index, flip flag and attribute byte
