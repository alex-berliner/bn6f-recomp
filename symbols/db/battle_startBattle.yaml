name: battle_startBattle
address: '0x0812B768'
kind: function
status: probable
summary: Loads battle settings via getBattleSettingsFromList1/copyBattleSettingsTo_200AF60, conditionally
  applies stage flag-mask from table 0x812B7AC and background, then fades screen, turns off music, and
  plays SOUND_BATTLE_START to begin the battle.
interface: (r0 = battleSettings list index, r1 = background/stage id) -> r0 = PlaySoundEffect result;
  r5[0x12]/r5[0x13] index the flag-mask table
details: Loads the BattleSettings for r0 via getBattleSettingsFromList1 and copies it to 0x200AF60. Computes
  (r5[0x12]<<1)+r5[0x13] as a word index into the table at 0x812B7AC (masks like 0x200, 0x204, 0x200200)
  and, if the mask is nonzero, calls battleSettings_setFlags_unkSettings with it, then battleSettings_setBackground
  with the r1 background id. It then calls SetScreenFade(0x2C, 0x10), turns music state off via musicGameState_8000784,
  and plays SOUND_BATTLE_START. This is the battle-start transition that stages terrain/flags and the
  backdrop before fade-in.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl getBattleSettingsFromList1 + bl copyBattleSettingsTo_200AF60: settings entry r0 is loaded
    into the working battle settings; ldrb r0,[r5,#0x12]; ldrb r1,[r5,#0x13]; ldr r0,[off_812B7A8+r0*4]:
    stage-dependent flag mask from table at 0x812B7AC; bl battleSettings_setFlags_unkSettings / battleSettings_setBackground(r1
    from stack): applies stage flags and background; bl SetScreenFade(0x2C,0x10) + bl musicGameState_8000784
    + PlaySoundEffect(SOUND_BATTLE_START): screen fade and battle-start audio; sole caller sub_812B608
    is itself unknown, so selection source (r5 fields) is unconfirmed'
