  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is accurate but the proposed name ''battle_startApplyStageSettings'' is misleading:
    this function applies stage flag masks and background only conditionally (when the mask is nonzero),
    and the order is reverse — background is set second. The unconditional tail (SetScreenFade, music
    off, PlaySoundEffect SOUND_BATTLE_START) is the actual ''start battle'' transition. A name like ''battle_startBattle''
    better captures the function''s primary purpose.; run wf investigate investigate-20261018-223614;
