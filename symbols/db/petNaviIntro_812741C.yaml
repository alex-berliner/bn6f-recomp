name: petNaviIntro_812741C
address: '0x0812741C'
kind: function
status: probable
summary: PET Navi info screen — draws level/attack/speed/type stat lines for the currently-bonded PET
  Navi via text-script slot 5-7, with a special placeholder when no Navi is bonded and a guard event hasn't
  fired.
interface: void sub_812741C(void); /* r10 = toolkit base pointer; uses {r4-r7,lr}. No other register inputs
  consumed; preserves r4-r12 across calls. */
details: "Reads the per-toolkit navi-data pointer at oToolkit_Unk200a220_Ptr (loaded into r6) and uses\n\
  field offset 8 of that struct as a temporary scratch byte that sub_8127578 reads back to\nformat the\
  \ stat (value written is stat+1, presumably so 0 can mean \"blank\").\n\nFor each of the three stat\
  \ lines it calls GetCurPETNavi() then GetCurPETNaviStatsByte()\nwith stat indices 1 (level), 2 (attack),\
  \ 3 (speed), writes the (value+1) into the struct,\nthen calls sub_8127578 with: msg_id in r0 (5/6/7),\
  \ y-coord in r1 (row<<4 - 0x20 ->\nSTAT_Y_LEVEL / STAT_Y_ATK / STAT_Y_SPD), text buffer 0x6008020 in\
  \ r2, script pointer\neTextScript201BF20 in r3, data byte_2017A00 in r4.\n\nFor the type/species line\
  \ (row STAT_Y_TYPE) it picks a message id by:\n  - if get_cur_pet_navi() == 0 AND byte_200AD04 != 0\
  \ AND event flag EVENT_163 is unset:\n      use 0x51 (NO_NAVI_MSG, the \"no Navi\" placeholder).\n \
  \ - else: take stat 0x17 (\"type\"), and if nonzero index byte_812756C; otherwise take\n    stat 5 (\"\
  species\"), linear-search byte_81274F8 (length 0x3A) for the species and\n    index byte_8127532 to\
  \ get the message; default index 2 if not found.\n\nIteratively calls GetCurPETNavi()/GetCurPETNaviStatsByte()\
  \ several times rather than\ncaching — the value can change. r6 is preserved across the three stat sub_8127578\
  \ calls\nbut is clobbered by the last branch; sub_8127578 is responsible for holding the toolkit\nscratch\
  \ value.\n"
