open_questions:
- exact meaning of each defaulted field (e.g. +0x09..+0x0C counts, +0x0E=0x99, +0x4C/+0x4B)
- whether GetNaviStatsHword(1,0x42) is HP or another navi stat
- which struct/offset inside dword_203CBE0 this block occupies and what reads these fields during the
  custom screen
- The summary's overall behavior is largely correct (zero-fill, defaults, GetNaviStatsHword(1,0x42) stored
  at +0x3E/+0x40/+0x42, 0xFF slot stamps at +0x2E..0x30 and +0x56..0x5B), but several byte-store details
  in the proposal are wrong. The hardcoded defaults are not '4,5,5,1 at +0x09..+0x0C' — the code stores
  4 at +0x09, 5 at +0x0A, 5 at +0x0B, but +0x0C is 0 (with 1 stored at +0x0D). Also +0x18 and +0x19 are
  explicitly cleared to 0, +0x29 is 0x0A, +0x2C and +0x2D are cleared, and the '0xFF sentinels' at +0x05
  and +0x07 are correct but the proposal omits the +0x4C/+0x4B/+0x44 bytes. Since the function is called
  once from battle_initBattleStateBuffer and fills a 0x64-byte chip-hand/custom-screen block, battle_initChipSelectState
  better captures it.
