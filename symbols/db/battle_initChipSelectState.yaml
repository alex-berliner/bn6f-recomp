name: battle_initChipSelectState
address: '0x080135E8'
kind: function
status: probable
summary: Zero-fills the 0x64-byte in-battle chip-select/custom-screen state block, writes hardcoded defaults
  (chip count/hand fields, sentinel bytes, and 0x99/0x1F markers), stamps the three parallel HP halfwords
  from GetNaviStatsHword(1, 0x42), and marks the chip-slot arrays empty with 0xFF.
interface: (r0 = *state block (within the per-battle buffer)) -> r0 = *same block; flags clobbered by
  calls
details: 'Zero-fills 0x64 (100) bytes of the block, then writes hardcoded defaults: counts/sizes 4,5,5,1
  at +0x09..+0x0C, 0xFF sentinels at +0x05, +0x07, +0x12, 0x99 at +0x0E, and 0x1F at +0x27. It queries
  GetNaviStatsHword(1, 0x42) and stores the returned halfword to +0x3E, +0x40 and +0x42 (three parallel
  copies, likely HP-related fields such as base/current/max). Two small loops stamp 0xFF over +0x2E..+0x30
  and +0x56..+0x5B, consistent with marking chip slot arrays empty (0xFF = no chip). The called-from battle_initBattleStateBuffer
  context and the slot/count layout point at the in-battle chip hand / custom screen state rather than
  generic battle data.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ZeroFillByWord(memBlock=r0, 0x64) clears the whole state block first; counts 4/5/5/1 written
    to +0x09..+0x0C match chip-hand size/layout constants; 0xFF stamped over byte ranges 0x2E-0x30 and
    0x56-0x5B looks like empty-chip sentinel fills; GetNaviStatsHword(1, 0x42) result stored to three
    halfword fields +0x3E/+0x40/+0x42, likely HP triple; sole caller is battle_initBattleStateBuffer_800B144,
    which sets up per-battle state at the start of a battle
  refs:
