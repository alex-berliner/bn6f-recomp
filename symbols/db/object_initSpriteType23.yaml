name: object_initSpriteType23
address: '0x0811E63C'
kind: function
status: probable
summary: 'Initializer for a fixed on-screen object of type 0x23: builds its GUI sprite (id 0x39) with animation
  0, no shadow, palette 0, priority 0, and places it at (220, 44).'
interface: (r0/r1 = caller context, r5 = object struct pointer) -> r0 = result of sub_811E68C; no meaningful flags
details: Writes 0x23 into byte 0 of the object struct at r5 (its type/state byte), then calls initGuiSprite with
  id 0x39 to allocate the sprite (r1 presumably still carries the object pointer). It sets animation 0, loads the
  animation data, disables the shadow, stores halfword 0x2A8 into the sprite slot via the slot-list store helper
  (clearing the following field), selects sub-entry palette bank 0xB, sets palette 0, clears sub-record field A,
  and sets priority 0. It then hardcodes the position (0xDC, 0x2C) = (220, 44) via sprite_setCoordinates and stores
  4 into byte 8 of the object struct, before tail-calling the unknown sub_811E68C. All parameters are constants,
  so this initializes one specific, non-moving, priority-0 screen object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'strb #0x23,[r5] and strb #4,[r5,#8]: fills fixed fields of the object struct at r5; initGuiSprite(0x39)
    followed by sprite_setAnimation(0)/sprite_loadAnimationData/sprite_noShadow: standard sprite bring-up sequence;
    slotList_storeHalfwordAndClearField(0x2A8): writes constant 0x2A8 into the sprite slot''s halfword field; sprite_setPalette(0),
    sprite_setPriority(0), sprite_setSubEntryPaletteBank(0xB): fully hardcoded render parameters; sprite_setCoordinates(0xDC,0x2C):
    fixed screen position (220,44), indicating a static UI/NPC object'
