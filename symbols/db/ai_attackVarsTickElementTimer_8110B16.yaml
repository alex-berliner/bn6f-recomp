name: ai_attackVarsTickElementTimer_8110B16
address: '0x08110B16'
kind: function
status: confirmed
summary: Ticks an enemy-AI attack state's step timer, winding the attack down (setting hit element 0x18
  and clearing the attack element) each time it expires.
interface: 'void sub_8110B16(oAIAttackVars *r7); /* r5 pass-through: read as input and returned unchanged
  in r5; no flags consumed, NZCV clobbered */'
details: 'Runs one tick of an AI attack whose state lives in an oAIAttackVars struct pointed to by r7.

  First, if oAIAttackVars_AttackElement (byte) is 0 it is forced to 1, ensuring an attack is

  flagged active before the timer runs. Then oAIAttackVars_StepTimer (halfword) is decremented

  and written back. If it did not reach 0 the routine just returns. When the timer hits 0 it is

  reloaded from oAIAttackVars_ScratchVar (halfword) — so the scratch field acts as the period of

  this attack''s tick — oAIAttackVars_HitElement (halfword) is set to 0x18 (24, some fixed

  element/effect id consumed elsewhere), and oAIAttackVars_AttackElement is cleared back to 0,

  ending the attack until something re-arms it. Purely a state-machine step function: no

  pointers dereferenced beyond the r7 struct, r4-r7 preserved, r5 simply passes through.

  '
