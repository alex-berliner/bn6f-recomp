name: object_Clear3RAMBytes_800371A
address: '0x0800371A'
kind: function
status: confirmed
summary: Zeroes three single-byte object-related state flags in IWRAM.
interface: void object_ClearStateFlags(void)
details: 'Writes 0 to three separate single-byte IWRAM locations: byte_2036778, dword_203CA7C (named dword but only
  the low byte is cleared via strb), and byte_2036830. All three look like per-frame or per-object transient flags
  (e.g. "object spawned/hit/removed this frame" markers) that some higher-level object update clears together before
  or after processing. No other registers or memory are touched; flags NZ are clobbered incidentally by the mov
  r0,#0.

  '
