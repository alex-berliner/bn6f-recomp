summary: 'Initializes an object''s sprite setup: assigns sprite resource 8 from table unk_2024E8C, sets
  animation 0, no shadow, palette 0, priority 2, and writes object state bytes.'
interface: (r5 = object pointer, r0/r1 caller args unused) -> r0 = clobbered; sets object state byte [r5]
  = 0x23, [r5,#8] = 4, sprite fields via setters
details: 'The routine operates on an object reached via r5. It first stores 0x23 into the object''s first
  byte (likely a state/type ID) and 4 into offset 8. It calls 0x8002774 with r0=8 and r1=unk_2024E8C,
  presumably binding sprite resource index 8 from that resource table to the object. It then configures
  the sprite through the standard setter family: animation 0 plus animation-data load, no-shadow flag,
  palette 0, OAM priority 2, sub-entry palette bank 0 (with the value 0 from dword_811ABC0 passed through
  slotList_storeHalfwordAndClearField), and sub-record field A = 2. Finally it tail-invokes unknown sub_811ABC8
  before returning. The fixed, hardcoded parameters suggest a bespoke one-off initializer for a specific
  overworld/NPC object.'
