name: storeObfuscatedRandomToken_804733C
address: '0x0804733C'
kind: function
status: confirmed
summary: Rolls a nonzero random byte and stores a bit-scrambled/obfuscated code derived from it (plus the caller's
  base value) into object+0x30.
interface: void storeObfuscatedRandomToken(u32 base /*r0*/, struct Object* obj /*r5*/); returns with r0-r4/r5/r7
  preserved, flags set as side effects (C=0, V from base+byte, N/Z from the stored value)
details: "Draws a random value via GetPositiveSignedRNG and retries until the low 8 bits are\nnonzero, then computes:\n\
  \n    stored = ~(((base + byte) << 8) | (byteHi << 28) | (byteLo ^ byteHi))\n\nwhere byteHi = byte >> 4 and byteLo\
  \ = byte & 0xF, and writes the result to obj+0x30.\nLayout of the stored word: bits 0-3 are the XOR-fold (byteLo\
  \ ^ byteHi), bits 4-7 are\nzero, bits 8-27 hold (base + byte) shifted up by 8, bits 28-31 repeat byteHi; the\n\
  whole word is bitwise NOT'ed. r0 (base) and r5 (object pointer) are the only inputs\nactually used; r1-r4 are\
  \ listed in the caller contract but are dead inputs (r1 is\nimmediately overwritten with r4). Nothing else in\
  \ the object is touched. The XOR-fold\nand repeat-nibble structure looks like a light obfuscation/anti-tamper\
  \ token (e.g. a\nrandom passcode or checksum seed) rather than a plain random ID, but the exact purpose\nof field\
  \ +0x30 is unknown.\n"
