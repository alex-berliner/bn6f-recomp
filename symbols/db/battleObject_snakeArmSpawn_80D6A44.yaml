name: battleObject_snakeArmSpawn_80D6A44
address: '0x080D6A44'
kind: function
previous_names:
- sub_80D6A44
status: probable
summary: 'Initialize and spawn a SnakeArm projectile battle object for its parent: load its sprite/animation,
  attach to the parent''s NameID-relative arm slot, set up collision with hit/status params from the parent''s
  Params, play the summon SFX and switch to the Update state.'
interface: '(r5 = this, r10 = toolkit) -> void ; side effect: object slot is freed and returned if collision-data
  allocation fails'
details: '- Loads sprite 0x80/0x10/0x40 and turns off its shadow, then sets OBJECT_FLAG_VISIBLE on oObjectHeader_Flags
  (orr with 2).

  - Sets oBattleObject_CurAnim and oBattleObject_CurAnimCopy to 0, sets the sprite animation to 0 and
  loads the animation data.

  - Picks a palette index from a 3-entry palette table at dword_80D6B24 indexed by Param4 (values 1,2,3
  → palettes), then sets the sprite palette and flip from object_getFlip / sprite_setFlip.

  - Copies Param3 into oBattleObject_Timer, recomputes the object''s pixel coords from panel coords, then
  nudges oBattleObject_X16 backwards by 0x28 * front-direction multiplier so the SnakeArm appears in front
  of the parent.

  - Adds a per-arm offset from the parent''s NameID via getBattleArmPositionMaybe_8018810 (slot 0x1c)
  to oBattleObject_X and oBattleObject_Z so it arms multiple onto the parent at distinct attachment points.

  - Allocates a collision-data slot (object_createCollisionData); on failure frees the object slot and
  returns. Otherwise sets region=0xb, calls object_setupCollisionData with Param1 as a collision-type
  table index, sets HitEffect=0xFF, and copies Param2 into the status-effect base only if it is not already
  nonzero.

  - Param4 branches: Param4>=2 && Param4!=3 → sub_801A4D0(0x18, 1); Param4==3 → sub_801A4D0(0xF6, 0);
  Param4<2 → no branch (no extra setup).

  - Calls object_presentCollisionData, plays SFX 0xF3, sets CurStateActionPhaseAndPhaseInitialized = CUR_STATE_UPDATE
  (0x4) and tail-calls sub_80D6B28 (the per-state Update handler).

  '
