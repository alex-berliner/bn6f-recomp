  detail: '- sprite_load call with constants 0x80/0x10/0x40 at asm offset 80D6A4A–80D6A50 identifies a
    fixed SnakeArm sprite. - `orr r0, #2 ; strb r0, [r5,#oObjectHeader_Flags]` sets OBJECT_FLAG_VISIBLE
    (0x02) defined in ObjectHeader.inc. - Palette table dword_80D6B24 = 0x03000201 — three bytes (palettes)
    for Param4 indices 0/1/2; 0x03 is the third entry used by the `Param4==3` branch. - The "front-direction"
    offset: `object_getFrontDirection → mul 0x28 → sub from X16` matches an "in front of parent" placement
    for a projectile spawning at the user''s panel row. - `getBattleArmPositionMaybe_8018810` with slot
    0x1c returns mirrored attachment offsets used so several SnakeArm copies (Param4=1..3) attach to distinct
    points on the parent''s body, indexed by Param4. - `object_setupCollisionData(0xb, 5, Param1, ...)`
    and `Param2 → oCollisionData_StatusEffectBase`/`Param4 → oCollisionData → sub_801A4D0(0x18/0xF6)`
    parameterise the collision from the four Params bytes (obj0..obj3). - `mov r0, #CUR_STATE_UPDATE ;
    str r0, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]` then `bl sub_80D6B28` shows this
    is the init (CUR_STATE_INITIALIZE) entry that hands off to its own update dispatcher. - `PlaySoundEffect(0xF3)`
    is the SnakeArm summon cue (BN6 SnakeArm SE). - On `object_createCollisionData` returning NULL the
    code calls `object_freeMemory` and returns via `pop {r4,pc}`, indicating the slot is freed if collision
    allocation fails.'
