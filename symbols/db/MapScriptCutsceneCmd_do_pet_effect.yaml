name: MapScriptCutsceneCmd_do_pet_effect
address: '0x08035F98'
kind: function
status: confirmed
summary: Map script cutscene command that triggers a PET (player terminal) effect, taking the effect id either from
  a lookup table or inline from the script.
interface: 'Next MapScriptCutsceneCmd_doPetEffect(u8 *scriptCtx /*r5*/, u8 *scriptPtr /*r7*/); // in: r5=script/context
  struct holding the effect-id table, r7=script read pointer; out: r0=1 (success), r7+=3, N/Z from ''mov r0,#1'',
  C/V from the ''add r7,#3''; preserves r2,r3,r5,r10'
details: 'Map script interpreter command handler for a PET effect during cutscenes. It reads one script byte via
  ReadMapScriptByte (r6=1 selects the indirect operand mode). If that byte is 0xFF, it is a marker meaning the effect
  id follows directly in the script: r6 is set to 2 and a second byte is read, and that raw value is used as the
  effect id. Otherwise the byte is used as an index into a byte table at r5 (the script context struct) and the
  table entry is the effect id. The id is passed in r0 to doPETEffect_8033fc0, which performs the actual PET-side
  effect (animation/sound on the PET screen). The handler always advances the script pointer r7 by 3 and returns
  1 in r0 to signal the command completed. Quirk: the indirect form consumes only one operand byte but the pointer
  is still advanced by 3 regardless, so indirect uses must account for a skipped byte (or the second byte is reserved/padding).
  The flags left behind are deliberate: C/V come from the r7+3 ADDS (which the interpreter branches on) and N/Z
  from the final ''mov r0,#1'', matching the interpreter''s command-return convention.

  '
