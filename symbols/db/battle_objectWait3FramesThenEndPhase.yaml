    (asm 2-8); ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; strh; bgt: frame-countdown wait loop; on
    expiry writes CurAction=4 and clears CurPhaseAndPhaseInitialized (asm 13-16), the standard phase-advance
    pattern; no callees and no other data touched: pure field-update state handler on the battle object'
