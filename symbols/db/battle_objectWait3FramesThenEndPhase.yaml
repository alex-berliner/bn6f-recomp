name: battle_objectWait3FramesThenEndPhase
address: '0x080DC180'
kind: function
status: probable
summary: 'Per-frame phase handler for a battle object: waits 3 frames, then finishes the phase by setting
  CurAction = 4 and clearing the phase state.'
interface: (r5 = battle object) -> r0 = clobbered; flags from the timer decrement (bgt)
details: On first run (oBattleObject_PhaseInitialized == 0) it stores 3 into oBattleObject_Timer and 4
  into oBattleObject_PhaseInitialized so the wait only arms once. Every subsequent call it decrements
  oBattleObject_Timer and branches out while it is still positive. When the counter reaches zero it writes
  4 to oBattleObject_CurAction and zeroes oBattleObject_CurPhaseAndPhaseInitialized, which ends the current
  phase so the object's dispatcher moves on. It reads/writes only the standard battle-object control fields,
  taking the object in r5 per the engine's handler convention, and returns nothing.
