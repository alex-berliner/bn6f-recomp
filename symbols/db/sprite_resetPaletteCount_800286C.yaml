name: sprite_resetPaletteCount_800286C
address: '0x0800286C'
kind: function
previous_names:
- sub_800286C
status: probable
summary: Resets the sprite palette count at 0x0200F340 (dword_200F340) to 0 after it's been recorded into
  byte_200F389 by sprite_recordPaletteCount_80028C0.
interface: () -> r0 = 0x0200F340 ; no return value to caller (only r0/r1 are clobbered)
details: "Loads the EWRAM address dword_200F340 (the global held in r12 by the toolkit pattern) into r0,\n\
  \  then writes an immediate 0 into that word and returns. The function tail is `mov pc, lr` so it\n\
  \  is a leaf that does not push the link register; the input contract is read-only 'lr' from the\n \
  \ tooling. Many overworld/battle per-frame tickers call it (battle_init_80052D8,\n  battle_update_8007A44,\
  \ gamestate_OnMapUpdate_8005268, scene_nextOrUpdate_80053E4,\n  scenario_finalizeFrameOrRestart_8005642,\
  \ mainState_runFrame_8005814, plus a long list of\n  state 0x2C sub-state handlers), so this is a shared\
  \ \"reset a sprite-system latch each frame\"\n  helper. The leaf return shape (`out` only contains lr/r0/r1)\
  \ means callers do not rely on a\n  returned value - it is void-like. The captured-call samples all\
  \ show zero being written into\n  0x0200F340 (the r0 exit value becomes the address, not its contents;\
  \ the 0 is stored at that\n  address) and the buffer at r0 in callers is the 64-byte region 0x0200F350\
  \ which the writes\n  do not touch directly. Likely semantics: a tile/block-dirty or shadow-OAM-style\
  \ one-shot flag\n  for the sprite subsystem; the S200F348 struct incidentally sits at 0x0200F348 (size\
  \ 8, used\n  by gameOver song timing), which would mean we are clearing the byte just before that struct\
  \ -\n  consistent with a per-frame \"have-we-done-it-this-frame\" latch.\n"
