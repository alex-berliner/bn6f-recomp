name: GetTitleScreenIconCount
address: '0x08000EE4'
kind: function
status: confirmed
summary: Counts how many of 9 title-screen reward icons the player has earned and returns the count plus a bitmask
  of which ones
interface: void GetTitleScreenIconCount(void) -> (u32 count r0, u16 bitmask r1); clobbers r2-r7, nzcv
details: 'Reads several story/event flags (0xE00, 0x370, 0x340) and a range of flags starting at 0x3BD

  (5 consecutive flags) via TestEventFlagFromImmediate / TestEventFlagRangeFromImmediate, plus

  five progress stats via sub_81207F8 (indices 0,1,2,5,4 against thresholds 200, 39, 5, 15, 29).

  Each satisfied test increments a count and ORs the corresponding bit into a 9-bit mask. Bits

  used are 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80, 0x100, 0x200 (i.e. bits 1..8 plus bits 9

  and 10 of a 16-bit value). Returns (count, bitmask) in r0/r1; the title-screen menu uses these

  to know which icons to display.'
