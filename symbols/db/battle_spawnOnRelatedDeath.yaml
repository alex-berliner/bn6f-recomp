name: battle_spawnOnRelatedDeath
address: '0x080C0116'
kind: function
status: probable
summary: Watches the object's related object; when its HP reaches 0, spawns a linked object from AI data
  +0x74 and puts this object into action 0x10 with a 0x20-frame timer.
interface: (r5 = battle object) -> r0 = 0 if related object alive, else spawned and r0 = truthy/HP value;
  r4, r7 clobbered
details: Loads oBattleObject_RelatedObject1Ptr from r5 and tests its oBattleObject_HP. If HP != 0 it returns
  immediately with that value in r0. If HP == 0, it loads dword 0x10000 into r4 and aIData+0x74 into r7
  and calls battle_spawnLinkedObject_80E1A6A, which spawns a type-0x11 object cross-linked to this object.
  Afterwards it writes 0x20 to oBattleObject_Timer and 0x10 to oBattleObject_CurAction, so the object
  enters a new state (likely a death/aftermath sequence) for 32 frames. The spawn parameters presumably
  live at aIData+0x74; 0x10000 in r4 is likely a packed argument pair for the spawner helper. Runs during
  battlesweep route processing.
