open_questions:
- exact encoding of the 0xA40000 tile base and the r1=2 argument to queueOamFromTableRow
- whether r5+0x34 is a sprite-sheet/variant selector and where it is set
- advanceAnimTableBy0xFF's effect on r1 (the writeback ORs r1<<4 into the state byte, which only makes
  sense if the callee zeroes/returns it)
- what animation the dword_804A2AC table belongs to (which object/routine installs it)
