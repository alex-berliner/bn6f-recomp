name: battle_pickRandomPanelIgnoringColumn
address: '0x0810FFC4'
kind: function
status: probable
summary: Picks a random panel from the full battle grid (ignoring one column derived from the closest
  enemy's field-0x13 panel-param entry) and returns its column and row.
interface: (r5 = BattleObject, stack buffer at sp) -> r0 = column (low 3 bits), r1 = row (byte>>4) of
  a randomly chosen enemy-side panel; r0 = 0 if no enemy object or no qualifying panels
details: Reads the BattleObject's alliance field, XORs it with 1 to target the opposing team, and finds
  the closest enemy BattleObject via battleObject_findClosestEnemyBattleObject_80103F8. From that enemy
  it loads field 0x13 and looks up an entry in table byte_81100A0 via GetAllianceDependentPanelParamArgs,
  which yields the parameter that object_getPanelsIgnoreColumnFiltered uses as its ignore-column filter;
  the matching panels (packed as col | row<<4) are written to a buffer on the stack. It then draws GetPositiveSignedRNG,
  uses SWI 6 (Div) to reduce it modulo the panel count, and indexes the buffer with the remainder. The
  chosen byte is split into row (r1 = byte>>4) and column (r0 = low bits). On either failure path (no
  enemy, zero panels) it returns early with r0 = 0.
