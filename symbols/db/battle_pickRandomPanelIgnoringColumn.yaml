    — targets the enemy team's side; ldrb r0,[r0,#0x13]; ldr r3,=byte_81100A0; bl GetAllianceDependentPanelParamArgs
    — fetches the panel-param entry that supplies the filter; bl object_getPanelsIgnoreColumnFiltered
    followed by tst r0/beq — fills sp buffer with (col|row<<4) panels and bails if none; bl GetPositiveSignedRNG
    with panel count in r1, then svc 6 (Div) — remainder r1 is a random index into the panel buffer; lsr
    r1,r0,#4 / lsl r0,#0x1d; lsr r0,#0x1d — splits the packed byte into row and column return values
