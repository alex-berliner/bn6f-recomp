name: battle_attackTimerTick_8109CBC
address: '0x08109CBC'
kind: function
status: confirmed
summary: Per-frame tick for an AI attack that counts a frame timer down and, once it expires, runs the attack's
  cleanup helpers and makes the object leave its attack state.
interface: void battle_attackTimerTick_8109CBC(void) /* r5 = battle object, r7 = this attack's variable block (oAIAttackVars);
  sets nz/c/v from the countdown subtract, returns early while the timer is still non-negative */
details: "Attack-state tick routine shared by AI-driven attacks. r7 points at an\noAIAttackVars block for the current\
  \ attack; the halfword at\noAIAttackVars_Unk_10 is a remaining-frames countdown which is decremented\neach call.\
  \ The SUBS flags are kept so that \"bge\" (timer >= 0 after the\ndecrement) lets the attack simply persist for\
  \ another frame without any\nother work.\n\nWhen the counter runs out (goes negative):\n  - oAIAttackVars_Unk_30\
  \ holds a pointer to a state word. If the word it\n    points at is nonzero, the object's extra var at\n    oBattleObject_ExtraVars+4\
  \ is passed to two cleanup helpers,\n    sub_800AA40 and sub_800AA1A (likely freeing/releasing the attack's\n\
  \    tracked resource, e.g. a custom entity or panel-state handle), and\n    then the state word is zeroed to\
  \ mark it as released.\n  - object_exitAttackState is called unconditionally on the object so the\n    battle\
  \ object leaves its attack state this frame.\n\nQuirk: the two cleanup helpers are only run when the state word\
  \ was\nnonzero; the exit from the attack state happens either way. Note the\ndecrement writes back the halfword\
  \ even on the last (now-negative) frame.\n"
