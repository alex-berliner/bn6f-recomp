name: battle_sceneReset_8127A1C
address: '0x08127A1C'
kind: function
status: confirmed
summary: 'Full battle-scene reset: clears VRAM/GFX buffers, initialises the transition-state struct and
  render-info fade timer, kicks off a screen fade, and rebuilds palettes/backgrounds.'
interface: void sub_8127A1C(u32* r5 /*transition state*/, u32 r10 /*toolkit*/); /* clobbers r0-r7, r8-r12,
  lr, N/Z/C/V */
details: "Called when entering (or restarting) a battle/scene. Steps:\n1. zeroFillVRAM / ZeroFill_byte_3001960\
  \ / ZeroFillGFX30025c0 — wipe display and\n   GFX working buffers.\n2. sub_80015FC(0x10) — one-shot\
  \ subsystem init.\n3. Writes 0x1F40 (RENDER_FADE_TIMER) into the render-info header at\n   [r10 + oToolkit_RenderInfoPtr]\
  \ and zeroes per-plane halfwords at +0x10..+0x1A.\n4. Sets transition state at r5: byte+1 = 4 (active),\
  \ byte+2 = 0 (sub-state idle).\n5. SetScreenFade(8, 0x10) — fade type and speed.\n6. sub_8046664 / sub_8127CB8\
  \ — extra scene setup hooks.\n7. Stores the current scene id (dword_2001140) into r5+0x1E.\n8. Initialises\
  \ fade/transition fields at r5 + 0x20, 0x24, 0x28 (step count = 4),\n   0x2A, 0x2E to 0, and r5 + 0x22,\
  \ 0x26, 0x2C, 0x30 to 0xFF (sentinel/\"no entry\").\n9. sub_8120CC8(0, dword_8127980) -> (step, frame)\
  \ written into r5+0xC, 0xE, 0xF, 0x10\n   (fade palette index pair mirrored to two slots).\n10. sub_81283A0\
  \ — post-fade hook.\n11. byte_2000FE0 = 7 (fade type), byte_2000FE1 = 4 (fade direction).\n12. Rebuilds\
  \ display via sub_8128500, palette_fillBufferWithFadeByte_8128260,\n    sub_8127E9C, sub_8128008, bg_ReloadBackgroundRegion_5_3_81281C0,\n\
  \    sub_81281E0, sub_8128280.\nReturns via pop {pc}; no value is produced for the caller.\n"
