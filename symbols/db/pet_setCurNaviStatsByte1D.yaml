name: pet_setCurNaviStatsByte1D
address: '0x081316B4'
kind: function
status: probable
summary: Sets byte 0x1D of the current PET navi's stats struct (0x203CCE0) to 1.
interface: () -> void; no return value, r0 clobbered by calls
details: Calls GetCurPETNavi to obtain the navi currently selected on the PET (its index/state returned
  in r0, game state pointer in r3), then calls SetNaviStats203CCE0Byte with r1=0x1D (offset into the per-navi
  stats block at 0x203CCE0) and r2=1, storing the value 1 at that offset. This effectively raises a per-navi
  byte flag. With no known callers and no read of the byte's meaning, the semantic purpose of flag 0x1D
  is unidentified.
