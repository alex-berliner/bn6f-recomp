name: battle_beastJumpPickLockOnParams
address: '0x080EEFBC'
kind: function
status: probable
summary: 'Chooses Beast Jump lock-on parameters: same-row targets use mode 2, otherwise passes the target''s
  panel row with mode 0xB.'
interface: (r0 = caller's battle object in r5; uses AI target from caller AI data) -> r0/r1/r2 forwarded
  to battle_beastJumpLockOn_8026554 (r1 = row, r2 = mode 2 or 0xB); flags from compare
details: Calls ai_getTargetObjectPos to read the targeted battle object's position, then compares the
  returned Y against r5->oBattleObject_PanelY (the acting object's own panel row). On equality it forces
  r2=2 while keeping r1 from the position call; otherwise it copies the target PanelY into r1 and sets
  r2=0xB. The triple is passed straight into battle_beastJumpLockOn_8026554, so r1/r2 act as target-row
  and behavior/arc selectors for the beast jump attack. The 16-instruction body is a pure parameter-adapter
  wrapper. r4, r6, r7 are saved but unused here.
