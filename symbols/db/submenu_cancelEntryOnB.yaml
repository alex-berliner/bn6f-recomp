name: submenu_cancelEntryOnB
address: '0x0802B560'
kind: function
status: probable
summary: On B press, cancels/closes the currently open submenu entry (window slot), restoring the underlying
  screen and playing the exit sound.
interface: (r5 = submenu work struct; r10 = toolkit) -> r0 = PlaySoundEffect return; reads joypad held
details: Checks the low-sensitivity held joypad for bit 2 (B button); if not held it returns immediately.
  It reads the entry IDs at r5+0x11 and r5+0x10 (skipping if both are 0xFF), calls sub_802B5B0 with the
  active entry ID, then writes 0xFF into that field to free/close the entry. It calls sub_802B358(unk_2031000,
  decomp_2032000) and sub_802B438(unk_2030E60, unk_2031000), which look like restoring the saved background/layer
  buffers under the closed window, then plays SOUND_EXIT_SUBMENU.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst r0,#2 on oJoypad_LowSensitivityHeld gates the whole body on B being held; ldrb r0,[r5,#0x11]/[r5,#0x10]
    then strb 0xFF back — picking the open entry and marking it closed; bl sub_802B5B0 with the entry
    ID before clearing it; sub_802B358/802B438 shuffle buffers unk_2031000/decomp_2032000/unk_2030E60
    like backing-store restore; mov r0,#SOUND_EXIT_SUBMENU; bl PlaySoundEffect — the canonical cancel
    sound
  refs:
  - bn6f/asm/asm03_0.s:11217
  - 0x0802A9D0 sub_802A9D0
  - 0x080005CC PlaySoundEffect
