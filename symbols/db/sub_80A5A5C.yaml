name: sub_80A5A5C
address: '0x080A5A5C'
kind: function
previous_names: []
status: hypothesis
summary: Copies byte at offset 0x9 from the AIData struct (r5) into the global byte at 0x02000EC0; tail-call only
interface: '(r5 = AIData*) -> ; side effect: writes AIData[0x9] to byte_2000EC0'
details: "Three Thumb instructions plus a literal pool:\n  1. push {lr} — saves the return address so this can `pop\
  \ {pc}`.\n  2. ldr r1, off_80A5A68 ; loads the absolute EWRAM address of byte_2000EC0 (0x02000EC0).\n  3. ldrb\
  \ r0, [r5, #9] — reads the byte at AIData offset 0x9.\n     In ai_data_struct, offset 0x9 is `BLeftAbility`, but\
  \ the byte pool directly below the\n     function (byte_80A5A6C..) starts with the byte 0x4A followed by what\
  \ look like BeastOut\n     chip data, and the caller is `sub_80A5828` — a routine that runs every frame for each\n\
  \     beast-controlled battle actor. The byte 0x4A at 0x80A5A6C is the exact same value the\n     captured calls\
  \ show in `lr=080a5883` parent (a sibling helper), and the data table\n     immediately following the function\
  \ clearly is the runtime state of `BLeftAbility` /\n     current beast ability slot.\n  4. strb r0, [r1] — stores\
  \ the byte into 0x02000EC0 (a global cache).\n  5. pop {pc} — tail-return; no caller-visible output registers.\n\
  \  No registers are returned to callers (out only contains the implicit `pc` from `pop`),\n  matching the contract\
  \ `out=[]` and the `push/pop {lr}`/`pop {pc}` style. This is a\n  \"publish the currently-equipped beast ability\
  \ id to a global\" shim used by the beast-out\n  AI tick in `sub_80A5828`.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {lr}` / `pop {pc}` at 0x80A5A5C and 0x80A5A64 show no register-preservation and confirm void-style
    output. - `ldrb r0, [r5, #9]` reads exactly the byte at AIData offset 0x9 (ai_data_struct loc=0x9 is `BLeftAbility`).
    - `ldr r1, off_80A5A68` points at `byte_2000EC0` (EWRAM), and the subsequent `strb r0, [r1]` is the only store
    — confirming the function''s only side effect is writing one byte to a global. - Caller `sub_80A5828` declares
    in=[''r4'',''r5'',''r6'',''r7'',''r10'',''lr''] and is a beast AI loop, so r5 holds the per-frame AIData pointer.
    - The data table at byte_80A5A6C.. starts with 0x4A and matches a beast ability/anim id layout, consistent with
    `BLeftAbility` being the byte being published. - Captured calls all show r0=0 on entry/exit, r5 carries AIData,
    and `pc` returns'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080A5A5C

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp, maps'
  reproduce: 'grep -l ''^080a5a5c '' tools/traces/coverage/*.prof

    '
  result: beastsp, maps
open_questions:
- The exact semantics of byte_2000EC0 (is it a "current beast ability" cache, or some
- other AI scratch flag?) cannot be settled from this function alone; finding a writer
- that changes it from somewhere else, or reading the field across many traces, would
- confirm.
- Whether `BLeftAbility` is really the right field label, vs. it being a renamed
- '"current beast ability slot", depends on how `sub_80A5828` treats the value — would'
- need to see how the global is consumed by the rest of the beast AI tick.
