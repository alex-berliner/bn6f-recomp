name: battle_spawnKindEffect40AtObjectPos
address: '0x0802CBCC'
kind: function
status: probable
summary: 'State step of a battle object: spawns battle sub-effect kind 0x28 at the object''s (possibly
  mirrored) position, then advances the object to state 4 with a zeroed counter.'
interface: '(r0 unused, r5 = battle object struct: +8/+0xA = coords, +1 = state, +2 = counter) -> r0 =
  dispatch result; no meaningful flags'
details: Reads halfwords at r5+8 and r5+0xA, which look like tile coordinates. Loads oToolkit_BattleStatePtr->oBattleState_PlayerSide;
  if nonzero (enemy side) it swaps the two coordinate values, mirroring the effect's placement. It then
  invokes battle_dispatchKindEffect_801E792 with kind byte 0x28, which allocates a sprite slot and runs
  the per-kind effect handler (guarded against re-entry by eStruct2035280+0x40 bit 0x8000 inside the callee).
  Finally it stores 4 into the struct's state byte at +1 and 0 into the halfword counter at +2, moving
  the object's state machine to its next phase. This looks like an 'emit effect at my tile and move on'
  step of some battle object's script/state loop.
