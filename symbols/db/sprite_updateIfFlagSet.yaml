name: sprite_updateIfFlagSet
address: '0x0811DC70'
kind: function
status: probable
summary: Object step that runs sprite_update only when the object's byte-0 flag 0x02 is set.
interface: (r5 = object struct pointer, no args in registers) -> r0 = sprite_update result if flag set,
  else untouched; flags from tst/bl.
details: Loads byte 0 of the object at [r5] and tests bit 1 (0x02). If the bit is clear it returns immediately;
  if set it tail-enters sprite_update, which per the project runs the object's sprite update using its
  sprite struct (header plus (byte 2 & 0xF0)). This is a small wrapper/step function, not a leaf; r5 is
  the usual object base pointer. No other fields are touched.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5]; tst r0,r1 with r1=2 gates the call on object byte 0 bit 1; beq locret skips the
    work entirely when the bit is clear; bl sprite_update matches the known sprite-step callee on the
    object's sprite struct
  refs:
  - bn6f/asm/asm32.s:32488
  - 0x0811DC54 sub_811DC54
  - 0x080026C4 sprite_update
  reproduce: python3 tools/asmcat.py 0x0811DC70
