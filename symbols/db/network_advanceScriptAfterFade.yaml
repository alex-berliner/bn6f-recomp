name: network_advanceScriptAfterFade
address: '0x0803970C'
kind: function
status: probable
summary: State-machine update step gated on IsScreenFadeActive and bit 8 of eFlags2009F38; clears [r5,#0x14],
  calls sub_803BB2C with phase 0, sets phase 8 at [r5,#1], then unconditionally calls sub_803B880 and
  sub_803C2F0.
interface: (r5 = task/state object pointer set by caller) -> r0 = result of sub_803C2F0; flags from last
  callee
details: r5 is never set here, so it must be a persistent task/context pointer established by callers.
  It first calls IsScreenFadeActive and only proceeds when that check passes, then tests bit 8 of the
  chatbox/cutscene flag word eFlags2009F38 via chatbox_mask_eFlags2009F38; if the bit is clear it skips
  the body. When the bit is set it clears the byte at [r5,#0x14], calls sub_803BB2C with r0=0 (which selects
  and displays the network text script for the current jump-table phase), and writes phase value 8 to
  the state byte [r5,#1]. It then unconditionally calls sub_803B880 and sub_803C2F0 before returning,
  so those run every invocation regardless of the gated body.
