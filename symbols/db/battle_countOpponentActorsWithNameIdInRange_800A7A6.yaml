name: battle_countOpponentActorsWithNameIdInRange_800A7A6
address: '0x0800A7A6'
kind: function
status: confirmed
summary: Counts the opponent-side battle actors whose NameID lies within a caller-supplied inclusive range.
interface: int battle_countOpponentActorsWithNameIdInRange(int minNameId /*r1*/, int maxNameId /*r2*/); returns
  count in r0; clobbers r3 and NZ flags (flags set by final MOV r0, r4); r4-r7 preserved.
details: 'Reads the toolkit''s battle state pointer (r10 + oToolkit_BattleStatePtr), then walks the

  opponent actor list at oBattleState_OpponentActors, which is four pointer slots (0x10 bytes,

  step 4). For each non-NULL actor pointer it loads the halfword oBattleObject_NameID and,

  if it is >= r1 and <= r2 (signed comparison), increments a counter. Returns the counter in r0.

  NULL slots are skipped. Note the ID fields are compared as 16-bit values loaded via LDRH but

  compared with signed CMP against the caller''s r1/r2, so negative-range arguments would never

  match; in practice caller IDs are small positive name IDs (e.g. virus/enemy IDs on the

  opponent side of the battle).

  '
