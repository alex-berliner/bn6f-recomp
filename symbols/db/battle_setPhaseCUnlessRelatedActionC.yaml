name: battle_setPhaseCUnlessRelatedActionC
address: '0x080CC428'
kind: function
status: probable
summary: 'Battle-object phase handler: advances this object to phase 0xC unless its related object is
  currently in action 0xC.'
interface: (r5 = battle object) -> r0 = 0xC on the phase-write path; no return value used, flags clobbered
details: Reads the object at r5+oBattleObject_RelatedObject1Ptr and tests its oBattleObject_CurAction
  against 0xC. If equal, the function returns immediately, leaving r5's phase untouched (i.e. it keeps
  waiting in its current phase). Otherwise it writes the halfword 0xC to r5+oBattleObject_CurPhaseAndPhaseInitialized,
  setting the phase counter to 0xC and clearing the phase-initialized byte in one strh. This matches the
  usual BN6 phase-handler idiom where each phase value routes to a handler that either advances the phase
  or holds it until a condition is met.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r0,#oBattleObject_CurAction]; cmp r0,#0xc; beq locret — hold phase while related object's
    action is 0xC; mov r0,#0xc; strh r0,[r5,#oBattleObject_CurPhaseAndPhaseInitialized] — otherwise advance
    own phase to 0xC with initialized flag cleared; uses oBattleObject_RelatedObject1Ptr, so the condition
    depends on a paired/related battle object, not r5 itself; no other registers touched; pure conditional
    phase transition, typical per-phase handler dispatched by the battle object loop
  refs:
  - bn6f/asm/asm31.s:44902
  reproduce: python3 tools/asmcat.py 0x080CC428
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-045129'
open_questions:
- No callers known, so which battle objects use this phase and what action 0xC represents (custom screen,
  deletion, idle, etc.) is unconfirmed
- Whether the intended reading is 'wait for related object to leave action 0xC' or the opposite depends
  on caller context
