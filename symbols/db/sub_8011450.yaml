name: sub_8011450
address: '0x08011450'
kind: function
status: confirmed
summary: Dispatches a per-AI-type "actor finished" handler for a battle object, usually ending the actor's current
  animation.
interface: void battle_RunObjectActorEndHandler_8011450(BattleObject* obj /* r5 */); clobbers r0-r4, r6-r12, flags,
  lr; r1/r2 still hold aiIndex/aiDataPtr on the actorType==0 early return
details: 'Called with the battle object in r5. Loads the object''s AI data pointer

  (oBattleObject_AIDataPtr), reads oAIData_ActorType and oAIData_AIIndex, and

  returns immediately if the actor type is 0 (no actor attached). Otherwise it

  indexes the ROM jump table at off_8011470 with aiIndex*4 and does a long-blx

  (mov lr, pc / bx r1) into the handler, passing r0 = the object''s

  RelatedObject2 pointer. Handlers are mostly battle_EndObjectCurrentAnim_80C44D2

  (AI indices 0, 1, 9, 13, 16, 18, 19), two bespoke handlers (sub_80FF668 for

  AI index 14, sub_80C46B6 for AI index 24), and nullsub_43 no-ops for the rest.

  Quirks: an AI index >= 25 reads past the table end (undefined jump target in

  the original); r5 is used as the object pointer rather than r0, so callers

  must set it up beforehand; the callee address is also left in r1 as a

  side effect.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
