name: battle_syncFromRelatedAndAdvanceYZ
address: '0x080C00CE'
kind: function
status: probable
summary: Copies 12 bytes (three words) from RelatedObject1Ptr+0x34 into the battle object at +0x34, then
  increments its Y16 and Z16 by 1, returning new Y16 in r0 and Z16 in r1.
interface: (r5 = battle object; r0/r1 scratch) -> r0/r1 = new Y16/Z16 values; flags from last strh path
details: Loads the pointer at oBattleObject_RelatedObject1Ptr, block-copies three words from related+0x34
  into this object's offset 0x34 (fields at 0x34..0x3F shared with/derived from the related object, likely
  target/attack-area data). It then reads oBattleObject_Y16 and oBattleObject_Z16, increments each by
  1, and stores them back, so the object advances one step in both Y and Z each call. r0 is clobbered
  immediately, so callers pass nothing meaningful in r0. Called from three nearby wrappers (sub_80C0030/4C/72),
  so it is a small shared movement/sync primitive.
