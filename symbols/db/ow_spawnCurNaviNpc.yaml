name: ow_spawnCurNaviNpc
address: '0x080A6CFC'
kind: function
status: probable
summary: Spawns an overworld NPC sprite matching the PET's currently selected navi at the player's position, then
  forwards mode 2 to sub_80A6E70 and returns 1.
interface: (r0 = object/state pointer, saved and passed on; r5 = object) -> r0 = 1; clobbers r1-r3
details: Reads the PET's currently selected navi, maps it through PETNaviToNPCSpriteTable to a sprite index, and
  loads that sprite (resource 0x80, palette 0x18) into the object in r5. It then sets animation index 1, loads the
  animation data, and removes the object's shadow, giving it a plain standing-NPC look. ReadOWPlayerObjectCoords
  provides the player's X/Y/Z, which are written into the object's position fields at r5+0xC/0x10/0x14, so the NPC
  appears where the player is. Finally the original r0 argument is restored, overwritten with mode 2, and passed
  to sub_80A6E70, and the function returns 1.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetCurPETNavi + ldrb r2,[r2,r0] via PETNaviToNPCSpriteTable selects the sprite from the chosen navi;
    bl sprite_load with (0x80, 0x18, r2) then sprite_setAnimation(1) and sprite_loadAnimationData set up the NPC
    sprite; bl sprite_removeShadow drops the shadow, consistent with an NPC display object rather than the player;
    bl ReadOWPlayerObjectCoords then str r0/r1/r2 to [r5,#0xc/#0x10/#0x14] copies player position into the object;
    tail call sub_80A6E70 with r0=2 after pop {r0} hands the object/state to a follow-up handler and returns 1
  refs:
  - bn6f/asm/asm29.s:3264
  - 0x080010B6 GetCurPETNavi
  - 0x0809E1AE ReadOWPlayerObjectCoords
  - 0x080026E4 sprite_load
  reproduce: python3 tools/asmcat.py 0x080A6CFC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The summary
    and naming are largely correct: the code reads the current PET navi, looks it up in PETNaviToNPCSpriteTable,
    loads sprite 0x80/palette 0x18, sets animation 1, removes shadow, and writes ReadOWPlayerObjectCoords'' r0/r1/r2
    into r5+0xC/0x10/0x14. However, the proposal''s interface description is wrong: the function does not save/restore
    r0 as a ''object/state pointer'' — `push {r0}` / `pop {r0}` actually preserve the navi id returned by GetCurPETNavi,
    then immediately overwrite it with `mov r0, #2` before calling sub_80A6E70. So r0 going into sub_80A6E70 is
    mode 2, not the original argument.; run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- What sub_80A6E70 does with mode 2 (finalize spawn vs. set state) is unknown
- No callers known, so whether this runs on map load or on a PET navi change is unconfirmed
- Exact meaning of the object fields at r5+0xC/0x10/0x14 (position vs. target coords) not verified
- 'The summary and naming are largely correct: the code reads the current PET navi, looks it up in PETNaviToNPCSpriteTable,
  loads sprite 0x80/palette 0x18, sets animation 1, removes shadow, and writes ReadOWPlayerObjectCoords'' r0/r1/r2
  into r5+0xC/0x10/0x14. However, the proposal''s interface description is wrong: the function does not save/restore
  r0 as a ''object/state pointer'' — `push {r0}` / `pop {r0}` actually preserve the navi id returned by GetCurPETNavi,
  then immediately overwrite it with `mov r0, #2` before calling sub_80A6E70. So r0 going into sub_80A6E70 is mode
  2, not the original argument.'
