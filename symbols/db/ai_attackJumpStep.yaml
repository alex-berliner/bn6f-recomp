name: ai_attackJumpStep
address: '0x0810C070'
kind: function
status: confirmed
summary: 'One tick of an AI-controlled jump-attack arc: integrates velocity, applies Z gravity, toggles collision
  at the landing threshold, and on timer expiry snaps to the destination panel and switches to the landing/attack
  animation.'
interface: 'ai_attackJumpStep(r5: BattleObject*, r7: AIAttackVars*) -> r1: u32 (collision-region result or coordinate-update
  value); clobbers r0,r2,r3,lr,nzcv'
details: 'Adds each axis velocity (X,Y,Z) to the object''s position fields. The Z velocity is then damped by a constant
  read from AIAttackVars at offset oAIAttackVars_Unk_40 (gravity / hop deceleration). If the new Z position is below
  0x100000 the object is still airborne: collision region is set to 1 (if not already active), the destination FuturePanelX/Y
  are committed to PanelX/Y, and object_updateCollisionPanels is called. If Z is at or above 0x100000 the object
  has passed the landing height and the collision region is cleared. A signed half-word step timer (oAIAttackVars_StepTimer)
  is decremented each tick; when it goes negative the hop is complete: the final panel is committed, the panel reservation
  is released via object_removePanelReserve, world coordinates are recalculated from panels, Z is zeroed, the current
  animation is set to 2 (landing/idle), and oAIAttackVars_HitElement is set to 0x0C (the element associated with
  the follow-up attack). Preserved registers r4 and r6 are untouched.

  '
