name: eStruct200BC30_dispatchJumpOffset00_8007BF0
address: '0x08007BF0'
kind: function
status: confirmed
summary: Tail-call dispatcher that asks the e-struct at 0x200BC30 which jump handler applies and immediately jumps
  to it via the off_8007C04 jump table.
interface: void sub_8007BF0(void); /* all registers and NZCV flags pass through unmodified to the selected handler,
  whose results are returned directly to this routine's caller */
details: 'Trampoline/wrapper, no state of its own. Calls eStruct200BC30_getJumpOffset00, which reads the

  e-struct (at 0x200BC30) and returns a byte offset in R0 selecting an entry of the 4-word jump

  table at off_8007C04. The selected handler address is loaded into R0, the table base into R1,

  and the routine tail-calls it with mov lr,pc / bx r0 / pop {pc} so the handler returns straight

  to sub_8007BF0''s own caller — everything (R0-R12, flags) the handler leaves behind is this

  routine''s de-facto output. The table holds only two distinct Thumb entry points:

  entries 0 and 3 -> sub_8007C14+1, entries 1 and 2 -> sub_8007C50+1. The caller passes nz,c,v

  and R2-R12 as inputs, meaning the chosen handler is expected to consume whatever state the

  original caller set up; this routine itself only clobbers lr (restored as return address).

  Quirk: the disassembly''s C check distinguishes the two handlers by comparing the loaded entry

  against table entry 0, since 0 and 3 always hold the same target.

  '
