name: object_spawnTypeEFromSourceObject
address: '0x080C6330'
kind: function
status: probable
summary: 'Spawns battle object kind 0xE and initializes it from a source object: panel X/Y, element, related-object
  link, damage word, and the source''s alliance/flip, then sets object flag 0x10.'
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = source battle object ptr, r6 = DamageAndStamina
  word) -> r0 = new object ptr or unchanged-on-failure; Z flag from object_spawnType3 gates initialization
details: 'Saves the caller''s r0-r2/r5, calls object_spawnType3 with r0=0xE (object kind) and the caller''s
  r1-r3 still in place, then on success writes the popped arguments into the new object: orig r0 -> PanelX,
  orig r1 -> PanelY, orig r2 -> Element, orig r5 -> RelatedObject1Ptr, orig r6 -> DamageAndStaminaDamageCounterDisabler.
  It then reads AllianceAndDirectionFlip from the source object at r5 and copies it to the new object,
  so the spawn inherits the source''s team/direction. Finally it sets bit 0x10 of oObjectHeader_Flags
  on the new object. Quirk: the new object pointer must come back in r5 from object_spawnType3 (r0 is
  reloaded from r5 before the pop), and r6 is an implicit argument that survives the spawn call; r3 passed
  to the initializer is a fourth, unidentified value.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0xe before bl object_spawnType3 selects spawned object kind 0xE; pop {r1-r3,r5} then
    strb r1/r2/r3 to PanelX/PanelY/Element maps orig r0-r2 into the new object; str r5,[RelatedObject1Ptr]
    and ldrh r3,[r5,#AllianceAndDirectionFlip]/strh back-to-back shows r5 is the source object, whose
    alliance is inherited; orr r2,#0x10 into oObjectHeader_Flags sets a marker flag on the freshly spawned
    object; str r6,[DamageAndStaminaDamageCounterDisabler] stores an untouched caller-provided damage
    word
  refs:
  - bn6f/asm/asm31.s:31190
  - 0x080F0228 sub_80F0228
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080C6330
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109; its name was fixed mechanically by tools/investigate_land.py
