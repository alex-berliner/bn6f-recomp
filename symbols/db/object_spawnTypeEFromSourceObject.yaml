open_questions:
- What battle object kind 0xE actually is in-game (only one caller, sub_80F0228, is known and undocumented)
- What the fourth initializer argument (orig r3 passed through to object_spawnType3) means
- Whether flag 0x10 marks 'has related object' or something else
