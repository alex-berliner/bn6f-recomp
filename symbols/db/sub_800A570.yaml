name: sub_800A570
address: '0x0800A570'
kind: function
status: confirmed
summary: Shuffles a 30-chip battle folder in place, splitting gigas, reshuffling pools, and (optionally) tagging
  two chips into the last slots.
interface: 'void sub_800A570(u32 folder_ptr, u32 reg_flag, u32 tag_flag, u32 toolkit /* r10 */); /* out: none; clobbers
  nz,c,v,r0-r3,lr; preserves r4-r7 */'
details: "Operates on a 30-entry u16 chip folder at `folder_ptr`. Walks all 30 entries, looking up each chip via\
  \ `getChip8021DA8` and inspecting `ChipData.elemIdx` (offset 7). Chips with elem == 2 (Giga) are split into the\
  \ giga buffer at 0x2033040; everything else goes into the non-giga buffer at 0x2033000.\n\nThe non-giga pool is\
  \ shuffled by `ShuffleHwordList_SecondaryRNG`, optionally skipping the first entry (reg_flag) and/or the last\
  \ two entries (tag_flag) at the shuffle boundary. The giga pool is then shuffled as well, and each giga is interleaved\
  \ into the non-giga pool at a random insertion index via `sub_800A672`. The allowed range depends on `GetBattleMode()`:\n\
  \  - Mode != 1 (Crossover): insertion index lies in [10, len-2] (R0 % (len-12) + 10).\n  - Mode == 1 (Crossover):\
  \ insertion index lies in [8, 18] (R0 % 11 + 8).\n\nIn the tag path (tag_flag set), a random chip position in\
  \ [1, 19] is picked via the secondary RNG, the chosen position is recorded into `battle_state->tagChipPos` (offset\
  \ 0x45) reachable via `toolkit[oToolkit_BattleStatePtr]`, and that chip is swapped with slot 28, and the following\
  \ slot is swapped with slot 29.\n\nFinally 0x3C (60) halfwords are copied from the staging buffer at 0x2033000\
  \ back to `folder_ptr` via `CopyHalfwords`.\n"
