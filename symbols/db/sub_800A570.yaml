open_questions:
- The exact meaning of reg_flag beyond "shrink shuffle window by 1" is unclear from this site alone; what entry
  it protects or why.
- 'The two pinned chips in the tag path: does slot 28 always hold a specific type, and is slot 29 a different counter
  (chip + element)?'
- Why crossover mode uses a fixed divisor of 11 while normal mode uses `len-12` - is the spreading algorithm asymmetric
  by design?
- Caller's `r10` is loaded as toolkit; is there ever a path where `toolkit` is not a battle context (e.g., normal/multi
  selection screens)?
