name: battle_getAIHandlerSlot_80ECC86
address: '0x080ECC86'
kind: function
status: confirmed
summary: Looks up a battle enemy's AI index in its AI data and maps it through a small table to an AI
  behavior slot (0 = default, 2 = custom handler).
interface: int battle_getAIHandlerSlot(BattleObject* obj /* in r5 */); returns slot byte in r0
details: 'Reads the battle object''s AI data pointer (oBattleObject_AIDataPtr at [r5,#oBattleObject_AIDataPtr]),

  loads the AI index byte (oAIData_AIIndex) from that AI data struct, and uses it as an index into

  the byte table at 0x080ECC94 (27 entries). Table values are only 0 or 2 in the observed data:

  indices 1 and 9 and 10 map to 2, everything else to 0. Likely a discriminator between the default

  AI routine (0) and a special/custom AI handler (2), e.g. for specific enemy types whose

  aiIndex values are 1, 9, or 10. Uses lr as a plain jump target (tail-style return, mov pc, lr)

  and only clobbers r1 (the table pointer).

  '
