name: ai_randomAttackPick
address: '0x08116510'
kind: function
status: probable
summary: 'Battle AI step: finds the closest enemy to the acting object, then calls helper sub_80DFAD6 with a value
  picked from the AI version''s pattern table and a random 0-2 roll.'
interface: (r4 = AI data of acting object, r5 = acting BattleObject) -> r0 = result of sub_80DFAD6(r0=table value,
  r1=random 0-2, r2=closest enemy BattleObject)
details: Reads the acting object's Alliance field from r5, inverts it (eor 1) and passes it to battleObject_findClosestEnemyBattleObject_80103F8;
  if no enemy is found it returns immediately. Otherwise it indexes a table-of-tables at off_8116554 by the AI's
  Version field (oAIData_Version_16 << 2), draws GetPositiveSignedRNG()&0xF to select an entry from that 16-byte
  repeating pattern (values 0,2,3 or 0,2,3,4 depending on version), draws another RNG&0xF to index byte_8116594
  (a repeating 0,1,2 pattern), and finally calls sub_80DFAD6 with (selected value, random 0-2, enemy object pointer).
  The &0xF masks are wider than the repeating period, so the draws are uniform over the pattern's distinct values.
  The pattern tables likely encode attack/move choices; the meaning of the arguments to sub_80DFAD6 is not visible
  here.
