name: object_phaseTeleportToPanel
address: '0x080D3CE0'
kind: function
status: probable
summary: 'Battle-object phase handler: warps the object to a panel chosen by a helper, waits 5 frames,
  then advances to phase 0xC (or aborts to anim 0x14/action 4 if no panel was found).'
interface: (r5 = battle object, fields read/written) -> void; sets PhaseInitialized, PanelX/PanelY, Timer,
  CurPhaseAndPhaseInitialized, CurAnim, CurAction
details: Runs once per object phase with the object in r5. On the first invocation (PhaseInitialized ==
  0) it sets PhaseInitialized = 4 and calls sub_80D3F42; if that returns a nonzero panel pair, it stores
  r0 into PanelX and r1 into PanelY, refreshes the object's pixel position via object_setCoordinatesFromPanels
  and its collision record via object_updateCollisionPanels, and loads Timer with 5. Each subsequent call
  decrements Timer and, on reaching 0, writes phase 0xC into CurPhaseAndPhaseInitialized (keeping the
  initialized nibble). If sub_80D3F42 fails (returns 0), the object instead gets CurAnim = 0x14, CurAction
  = 4, and phase reset to 0, i.e. it falls back to some other behavior instead of teleporting.
