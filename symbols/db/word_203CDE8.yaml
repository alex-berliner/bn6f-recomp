open_questions:
- 'suggested name: eBattleFolder_Slot28 (the 29th of the folder''s 30 u16; the first Tag chip while the folder is
  built). Better still, give eBattleFolder its full 60 bytes in bn6f/ewram.s and drop this label and byte_203CDEA,
  whose first 2 bytes are slot 29.'
- Which battle-effect flag bit 0x80 is (it gates both the Regular chip and the Tag pair); BattleState+0x17 is named
  oBattleState_BeastOutFlag in battle_populateBattleFolder_800A3E4, which the Regular-chip use here contradicts.
