  detail: 'All references to +0x38. In battle_populateBattleFolder_800A3E4 the copy loop runs r2 = 0..0x3A in steps
    of 2 (cmp r2, #0x3c); the source entry at the Regular index goes to +0, the one at the first Tag index to [eBattleFolder,
    #0x38] (asm00_1.s:16237), the one at the second to +0x3A (16245), the rest in order. In the unreferenced sub_800A318
    the Tag pair is swapped into +0x38 / +0x3A after pet_getCurNaviStatusPair_800A506 (asm00_1.s:16110-16124). shuffleFolder_800A570
    swaps its work buffer''s +0x38 / +0x3A with entries r + 1, r + 2 (asm00_1.s:16490-16509) and copies 0x3C bytes
