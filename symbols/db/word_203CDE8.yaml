name: word_203CDE8
address: '0x0203CDE8'
kind: ram
previous_names: []
status: confirmed
summary: Slot 28 of the battle folder eBattleFolder (u16 chip id | code << 9); while the folder is built it holds
  the first Tag chip, which the shuffle then moves into the folder.
details: 'bn6f/ewram.s gives eBattleFolder (0x0203CDB0) only `.space 56` (slots 0-27), then this label (2 bytes)
  and

  byte_203CDEA (6 bytes); but the folder is 30 u16 (60 bytes, 0x0203CDB0..0x0203CDEB): every copy into or out of

  it moves 0x3C bytes, and the code addresses slots 28 and 29 as eBattleFolder+0x38 and +0x3A. So this is slot 28,

  and the first 2 bytes of byte_203CDEA are slot 29; the label split is the disassembler''s, not a separate

  variable.


  battle_populateBattleFolder_800A3E4 (asm00_1.s:16151) builds the folder from a 30-chip source (normally the Navi''s

  current folder in S_Chip_2002178, 0x3C bytes per folder, picked by Navi stats byte 0x2D). When battle effect bit

  0x80 is set it takes two per-folder choices from the Navi stats: pet_getCurNaviChainedLookup_800A4E0 (byte 0x2E
  +

  folder) gives the index of the chip that goes to slot 0 (the Regular chip) and sets BattleState+0x17;

  pet_getCurNaviStatusPair_800A506 (bytes 0x56/0x57 + 2 * folder) gives two indices, the Tag chip pair, whose chips
  go

  to slot 28 (this word) and slot 29, and sets BattleState+0x44. The other chips fill the remaining slots in order.

  shuffleFolder_800A570 is then called with those two flags: it leaves the first non-Giga entry (Regular) and the

  last two (the Tag pair) out of the shuffle (the disassembly''s own comments there say "reg?" and "tag?"), and

  afterwards, with a third roll r = GetPositiveSignedRNGSecondary % 0x13, stores r + 1 in BattleState+0x45 and swaps

  the Tag pair at work-buffer +0x38/+0x3A with entries r + 1 and r + 2. So in the shuffled folder the Tag pair sits

  together at r + 1, r + 2 and slot 28 holds an ordinary chip. Without the Tag flag, slot 28 is simply the folder''s

  29th chip after the shuffle.


  sub_800A318 (asm00_1.s:16037, no references in bn6f) is an older form of the same build: it copies the folder

  first and then swaps the Regular chip into slot 0 and the Tag pair into slots 28 and 29 (with a special case when

  the second Tag chip already sits in slot 28), before the same shuffleFolder_800A570 call. Its lines

  asm00_1.s:16110-16124 are the ldrh/strh pairs at +0x38 and +0x3A.


  During the battle a used chip''s slot reads 0xFFFF (vidsync''s hand handler, tools/vidsync/autosync.py try_hand).

  '
