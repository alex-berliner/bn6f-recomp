name: sub_802DE5C
address: '0x0802DE5C'
kind: function
status: hypothesis
summary: When test-battle flag 0x40 is set, runs the sub_802E2C4 handler for indices 0 and 1; otherwise does nothing.
interface: void sub_802DE5C(void)
details: 'Checks the test-battle flag bit 0x40 via TestBattleFlag_0x40. If the flag is set

  (branch not taken), calls sub_802E2C4 twice in a row, first with r0 = 0 and then with

  r0 = 1, presumably activating or updating two slots/entries of whatever per-index

  facility sub_802E2C4 provides in the test-battle/debug context. If the flag is clear

  the function returns immediately without any side effects. No registers are read from

  the caller and nothing is returned; the only observable behavior is the pair of

  sub_802E2C4 calls gated by the flag.

  '
