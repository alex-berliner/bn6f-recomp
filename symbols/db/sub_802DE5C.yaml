name: sub_802DE5C
address: '0x0802DE5C'
kind: function
previous_names: []
status: hypothesis
summary: When the 0x40 battle flag is set, sequentially runs two battle sub-routines (with r10 toolkit), first with
  r0=0 then r0=1.
interface: '(r10 = Toolkit*) -> void ; side effects: calls TestBattleFlag_0x40 and up to two calls to sub_802E2C4'
details: "Tests the 0x40 bit of the current battle-state flag word via TestBattleFlag_0x40.\n  If that bit is not\
  \ set, returns immediately (pop {pc}).\n  If the bit is set, sets r0=0 and calls sub_802E2C4, then sets r0=1 and\
  \ calls sub_802E2C4 again.\n  No return value is exposed to callers; out list contains only callee-saved registers\
  \ and r1-r3 (which are sub_802E2C4's documented outputs), so this is effectively a `void` helper.\n  Lives in\
  \ the battle subsystem (asm03), uses the r10 toolkit convention, and is invoked from early battle per-frame dispatch\
  \ (sub_800801C) and the chip-select related dispatchers (sub_8008950, sub_8008D60), suggesting it triggers battle-end-of-turn\
  \ bookkeeping (counter/flag update + an after-effect) gated on a battle-state flag.\n  The bit being tested is\
  \ the 0x40 bit of the battle-state flag word (the same word where bits 0x20/0x10 mark other turn end conditions);\
  \ without the 0x40 flag set the body is skipped entirely.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl TestBattleFlag_0x40` then `beq locret_802DE70` is the gate; the named callee targets the 0x40 bit
    of the battle flag word. - `mov r0, #0` / `bl sub_802E2C4` followed by `mov r0, #1` / `bl sub_802E2C4` shows
    two staged calls passing 0 then 1 in r0. - Caller `sub_800801C` has r10 in its `in` contract and produces a
    return value in r0, matching a battle-step dispatcher. - Callers `sub_8008950` and `sub_8008D60` carry r10 and
    consume/produce the wide battle state, consistent with battle chip-select turn dispatchers. - Captured calls
    show diverse r0/r1/r2/r3 values (0x00000001, 0x02036828, 0x00008463, etc.), confirming this routine does not
    depend on specific argument conventions itself but only on the toolkit.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0802DE5C

    '
  result: the body read as described above
