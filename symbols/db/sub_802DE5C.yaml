open_questions:
- What sub_802E2C4 actually does with r0=0 vs r0=1 — naming it "run special turn events" is an inference from the
  gating flag, the r10 toolkit context, and the (0, 1) two-stage call pattern. Disassembling sub_802E2C4 would settle
  the role.
