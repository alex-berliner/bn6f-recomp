name: sub_802DE5C
address: '0x0802DE5C'
kind: function
previous_names: []
status: hypothesis
summary: If the 0x40 battle flag is set, recalculates the Pressure-style chip picks by calling sub_802E2C4 first
  with argument 0 (likely clears the previous selection), then with 1 (likely commits the new one).
interface: '() -> void ; side effects: calls sub_802E2C4 twice with r0 = 0 then r0 = 1 when battle flag 0x40 is
  set'
details: "Pushes lr, calls TestBattleFlag_0x40 in r10 (Toolkit/BattleState), branches over both calls if the\n \
  \ bit is clear (beq locret_802DE70 → pop {pc}). When set, it loads r0 = 0 and bl sub_802E2C4, then\n  r0 = 1 and\
  \ bl sub_802E2C4 again before restoring lr via pop {pc}. No other registers are used by\n  this function and r1..r3,\
  \ r4..r10 are listed only as out preserves from the callees (no writes of\n  its own). The 40 captured snapshots\
  \ all show r1 / r2 / r3 carrying opaque params for the caller,\n  while exit r0 stays at the constant 0 used as\
  \ the immediate to sub_802E2C4, consistent with this\n  being a thin \"trigger side-effect when X\" stub. The\
  \ two sub_802E2C4 calls with 0 and 1 read like a\n  setup/commit pair (e.g. begin / end update) for something\
  \ driven by flag 0x40.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl TestBattleFlag_0x40` at 0x0802de60 and `beq locret_802DE70` show a flag-gated branch. - `mov r0,
    #0` immediately before `bl sub_802E2C4`, then `mov r0, #1` before the second call at 0x0802de66 and 0x0802de6a
    — a paired 0/1 invocation pattern. - No other register is loaded between the callees, so r0 is the only argument.
    - Captured-call exit r0 = 0 in 6/6 samples (4 with Z set) — function returns 0 immediately when TestBattleFlag_0x40
    returned false, otherwise returns whatever the second sub_802E2C4 left in r0 (also 0 in the captured slice).
    - Callers sub_800801C / sub_8008950 / sub_8008D60 are battle-side helpers that hold r10 (Toolkit) live and have
    battle state in flight, fitting a battle-side trigger.'
