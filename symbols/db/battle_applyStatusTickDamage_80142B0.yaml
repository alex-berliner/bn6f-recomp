name: battle_applyStatusTickDamage_80142B0
address: '0x080142B0'
kind: function
status: confirmed
summary: If the active battle effects flag a damage-over-time status, writes a fixed pending damage of 10 to the
  battle object.
interface: void battle_applyStatusTickDamage(BattleObject* obj /* r5 */); reads battle effect flags via GetBattleEffects();
  r10 is passed by callers but never read
details: 'Wrapper-style hook called with r5 pointing at a battle object. It queries GetBattleEffects()

  and tests bit 0x8 of the returned effect mask. If that bit is set, it stores halfword 0xA

  (10) into the object''s Damage field (oBattleObject_Damage), which acts as pending/fixed

  damage applied to the object this tick (the comment pairs it with the usual decimal damage

  scaling, i.e. 1000). Nothing is done when the bit is clear. The call preserves no registers

  other than returning to the caller; lr is clobbered by the inner call. r10 is listed as an

  input by the callers but the routine never touches it.

  '
