name: scenario_setEffectState0E
address: '0x08142166'
kind: function
status: probable
summary: Writes a one-byte value (likely a cutscene/scenario effect parameter) into the global scenario
  effect state, as part of Beast Out / Soul Unleash application.
interface: (r0 = byte value to store) -> r0 = destroyed; no flags meaningful
details: Loads the address of eScenarioEffectState2000780 and stores the low byte of r0 at offset 0xE
  (byte_200078E) of that structure, then returns immediately; r4-r7 are pushed/popped purely for stack
  alignment and never used, so this is a one-field setter. The struct is the game's scenario/effect state
  block at EWRAM 0x2000780. The only known caller, soulWeapons_apply_8142510, is the routine that applies
  Beast Out/Soul Unleash map state and starts the matching cutscene, so byte 0xE most likely records the
  pending cutscene or effect id for the applied soul/beast state. Nothing else reads or clears the field
  within this snippet, so the consumer is elsewhere.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0, [r5,#0xe] with r5 = eScenarioEffectState2000780 shows a single-byte store into the
    scenario effect state; push/pop of r4-r7 with no use of those registers indicates a trivial setter,
    not a real subroutine body; sole caller soulWeapons_apply_8142510 'starts the matching cutscene',
    fitting a pending-scenario/effect-id field
