name: submenu_drawChipNameTiles
address: '0x0812626C'
kind: function
status: probable
summary: 'Draws one custom-screen chip slot''s two BG tilemap strips: reads chip codes from a 4-byte/entry
  table, blanking each 0x10-byte strip when the code is zero and clear-mode is set, otherwise decoding
  chip-name glyphs via TextScriptChipNamesPtrs and text_decodeCharTiles8, with a secondary palette for
  entries whose +2 byte > 1 and a Submenu-state reset on chip-encryption failure.'
interface: '(r0 = entry index, r1 = entry-table base (4 bytes/entry: u16 chip code+id, u8 color flag at
  +2), r2 = tilemap dest strip, r3 = palette A, r4 = palette B, r5 = (entryCount<<4 | clearMode)) -> writes
  8 halfword tilemap entries per strip per entry; no return value'
details: Each 4-byte entry is indexed at r1 + r0*4; the low halfword is the chip's packed code/id. If
  it is zero and the low nibble of r5 is set, both 0x10-byte strips (8 tilemap halfwords each) are zeroed
  to blank the slot; otherwise a default 'blank/unknown' char (table entry 0, char 4) or the real characters
  are drawn. The chip halfword is passed through encryption_80070e6; a nonzero result makes the draw fall
  back to the blank tile and zero the Submenu state (fields 0x58-0x68 and halfwords 0x12-0x3a, plus flag
  |= 1 at +0x7c). Valid chips index TextScriptChipNamesPtrs by the high byte (<<2) and offset by the low
  byte<<1 to get a char table, which text_decodeCharTiles8 decodes into both strips. Tilemap halfwords
  are built as palette<<12 | 0x200 tile base, with the alternate palette r4 used when entry byte +2 exceeds
  1.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: Caller 0x08125D10 battle_drawCustFolderSlots paints chip-slot strips with BG tile block 2, matching
    the 0x200 tile base and palette<<12 halfword construction (lsl r3,#12 / orr 0x200).; ldrh r1,[r5]
    then bl encryption_80070e6 with beq gating the normal decode path vs blank-tile fallback plus Submenu
    field zeroing.; lsr r7,r1,#8 / ldr r0,[TextScriptChipNamesPtrs,r7,lsl 2] / ldrh r1,[r0,r1<<1] selects
    the chip-code char table exactly like the known chip-name decoder.; bl text_decodeCharTiles8 writes
    8 tilemap halfwords into r2 and r3, each advanced by 0x10 per entry (two strips).; byte [r5,#2] >
    1 swaps the palette word from [sp] to [sp,#4], a per-entry color/highlight flag.
