name: battle_objectUpdateExtraVarsCall
address: '0x0810B338'
kind: function
status: probable
summary: Battle object update wrapper that, while the object is in phase 0 and its ExtraVars field is
  nonzero, calls sub_80C46B0 once, then tail-calls battle_objectUpdateDispatchPhase_80165C2 for the standard
  per-phase dispatch.
interface: (r5 = battle object pointer) -> r0 = result of battle_objectUpdateDispatchPhase_80165C2; flags
  from callees
details: Reads oBattleObject_CurPhase from the object at r5; while the object is still in phase 0 and
  its oBattleObject_ExtraVars field is nonzero, it calls sub_80C46B0 (an unknown routine, presumably tied
  to that extra var) before updating. It then tail-calls the standard per-frame dispatcher battle_objectUpdateDispatchPhase_80165C2,
  which runs the flagged-object handler and jumps to the current-phase handler from its 2-entry table.
  This is a thin custom object 'update' entry whose only added behavior over plain dispatch is the conditional
  extra call in phase 0. The extra call is not gated by a latch visible here, so sub_80C46B0 (or the ExtraVars
  check inside/around it) is presumed to handle its own once-only semantics or to be idempotent.
