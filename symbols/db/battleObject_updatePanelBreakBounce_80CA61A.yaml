status: probable
summary: 'Per-frame update of a bouncing panel-break attack object: tears down stale collision data, applies
  Z hop until apex, moves X and counts panel-bounces off the column edge, refreshes panels, and finally
  destroys the object.'
interface: '(r5 = battle object) -> void ; side effects: mutates BattleObject fields (X, Z, ZVelocity,
  PanelX/PanelY, header Flags, CurState), removes and re-presents collision data, may destroy object'
details: 'Entry is the standard battle-object updater shape: r5 holds the object, lr is the caller''s
  return, and the function preserves r5/r8 (and r4 for the thunk removeCollisionData trampoline) on the
  stack with `push {r4,r6,lr}`.

  First two unconditional `bl`s do frame setup: `object_removeCollisionData` tears down last frame''s
  collision data, and `object_spawnCollisionEffect` re-creates it for this frame.

  Reads `BattleObject.CollisionDataPtr->FlagsFromCollision`; if any flag is set it falls straight to the
  destroy branch at loc_80CA670, bypassing all motion.

  Otherwise reads Z (16.16) and compares the integer part against 0x14 (20). While the object is still
  below the apex, ZVelocity is added to Z and the function continues to `object_presentCollisionData`
  (no X step yet).

  Once Z has reached the apex (or it has been pushed past 20), it asks the panel grid for the X coordinate
  of the object''s current (PanelX,PanelY) via `object_getCoordinatesForPanels` (returning r0=target X),
  applies XVelocity to X, and asks `IsR2BetweenR0AndR1` whether the new X lies within `[oldX - XVelocity,
  oldX]` (the panel boundary on one side).

  If the new X is inside that panel it decrements `BattleObject.Param1` and, when it underflows below
  1, drops into the destroy path; otherwise falls through to re-snap panel coords.

  `object_setPanelsFromCoordinates` recomputes PanelX/PanelY from the new X/Y, `object_updateCollisionPanels`
  syncs that into the collision record and re-faces the object, and `object_isCurrentPanelValid` decides
  whether the object is still on a legal battlefield panel. An invalid panel routes to the destroy branch.

  Destroy branch (loc_80CA670): clears the OBJECT_FLAG_VISIBLE bit (mask 0x02) in `oObjectHeader_Flags`,
  calls `object_clearCollisionRegion`, then sets `CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY`
  (0x08).

  Tail path loc_80CA680 always runs `object_presentCollisionData` to commit the new collision state, then
  returns via `pop {r4,r6,pc}`.

  Caller `battleObject_initPanelBreakBounce_80CA568` initializes the X trajectory and seeds Param1 with
  the bounce count (snap_story2_12 captured call shows non-zero `Param1`), and on every subsequent frame
  the engine dispatches into this updater.

  '
