- method: assembly-reading
  date: '2026-10-14'
  detail: '- r5 in/r5 out contract with no other args; pushes r4/r6/lr — classic battle-object state handler.
    - CurPhase==0 branch writes 4 to oBattleObject_CurPhase (+0xa): standard two-phase (init/update) pattern.
    - object_getCoordinatesForPanels reads FuturePanelX (+0x14) and FuturePanelY (+0x15). - math_getThrowSpeeds
    is called with r0=object+0x34 (inline coords/target), r4=ExtraVars[0] (+0x60), r6=ExtraVars[4] (+0x64),
    producing X/Y/Z velocities stored at +0x40/+0x44/+0x48. - Timer (u16 at +0x20) is loaded from the
    low half of ExtraVars[0] and counts down each frame; bge on the decremented value gates arrival. -
    Timer2 (u16 at +0x22) is incremented each frame and tested via `lsr r0,r0,#3; bcs` — every 8th frame
    it highlights the destination panel. - ZVelocity is bumped by ExtraVars[4] each frame, producing a
    parabolic arc. - object_setPanelsFromCoordinates is called each frame to update PanelX/Y from world
    coords. - On expiry, object_getPanelParameters fetches the destination panel flags; the byte_80CB070
    lookup keyed by Alliance<<2 acts as an alliance-aware "valid landing panel" mask. - spawn_t1_0x0_EffectObject
    (type 4, effect 0) and battle_spawnCollisionForObject_80CB0AE create the on-arrival impact effect/collision.
    - CurStateActionPhaseAndPhaseInitialized = 0x08 (CUR_STATE_DESTROY) ends the state. - 40 captured
    calls all share entry r5 as object pointer, lr=0x80cafb6, consistent with a state-dispatch site; exit
    r0 varies (0/4/5) which are leftover flags / phase values, not meaningful returns.'
