status: probable
summary: Battle-object state that throws itself (or its 0x34-inline params) to a target panel as a parabolic
  projectile, spawning an impact effect and collision on arrival.
interface: (r5 = oBattleObject*) -> void; updates object state, velocities, timer, panel highlight
details: 'Phase 0 entry: sets CurPhase to 4 (init phase), looks up pixel coordinates of the future

  target panel via object_getCoordinatesForPanels (FuturePanelX/Y at +0x14/+0x15), and calls

  math_getThrowSpeeds using ExtraVars[0] (r4 = +0x60 lo) and ExtraVars[4] (r6 = +0x64) plus

  the just-fetched coordinates and object+0x34 (likely start position) to compute X/Y/Z velocities

  stored into +0x40/+0x44/+0x48. Timer is set from the low half of ExtraVars[0] (+0x60) and

  Timer2 cleared.


  Phase 4+ (every subsequent call): Timer2 increments every frame; on bit 3 (every 8 frames)

  object_highlightPanel is called for the destination panel. Each frame X/Y/Z accumulate their

  velocities, and ZVelocity itself increases by ExtraVars[4] each frame (gravity-like accel).

  object_setPanelsFromCoordinates recomputes PanelX/Y from world coords.


  When Timer underflows (Timer -= 1; bge skip): reads oBattleObject_Alliance, indexes the

  byte_80CB070 table {0x10, 0x80, 0x15, 0x10, 0x80, 0x2A} by Alliance<<2, and if the

  destination panel''s flags intersect that mask, spawns a type-4 effect object at object+0x34

  via spawn_t1_0x0_EffectObject and creates a collision region via

  battle_spawnCollisionForObject_80CB0AE. Then sets CurStateActionPhaseAndPhaseInitialized to

  CUR_STATE_DESTROY and clears Timer2.


  Caller (lr=0x80cafb6 in the captured snapshots) is the dispatcher that funnels each object

  state''s update; this is one row in that jumptable. No callers other than the dispatcher are

  listed, consistent with how other battle-object state functions are dispatched.

  '
