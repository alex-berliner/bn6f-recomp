open_questions:
- What the inline 0x34..0x44 block actually represents (start position? target coords? something else).
  The 0x60/0x64 ExtraVars are not yet annotated semantically (initial speed, gravity?). Naming the effect
  "projectile" / "throw" is a guess from math_getThrowSpeeds plus the parabolic Z update; if ExtraVars[0]
  is actually a number of frames and ExtraVars[4] is a fixed increment, the same code path would still
  be "move to panel along an arc and explode". Settling this needs a known chip/battle that exercises
  this state with known parameters (e.g. a thrown BombCorn / SnakeArm / similar).
