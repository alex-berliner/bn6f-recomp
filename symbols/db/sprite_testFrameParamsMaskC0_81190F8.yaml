name: sprite_testFrameParamsMaskC0_81190F8
address: '0x081190F8'
kind: function
status: confirmed
summary: Returns 1 if the sprite registered under the given handle has status bits 0xC0 set in its current frame
  parameters, else 0.
interface: int sub_81190F8(u32 spriteHandle /* r0 */); returns r0 = 1 if any of frame-parameter bits 0xC0 are set,
  0 otherwise or if the handle has no registered struct; N/Z reflect r0, C/V cleared; r1 = 0xC0 on the found path
details: 'Looks up the sprite struct for the handle in r0 through the registry list at 0x2008450 (getStructFrom2008450
  returns the struct pointer in r0 and an accompanying value in r1). If no struct is found it returns 0 immediately.
  Otherwise it passes the accompanying value (r1) along as r5 to sprite_getFrameParameters, which yields the current
  frame''s parameter bits in r0, and tests them against the mask 0xC0 (bit 6 | bit 7). If either bit is set the
  result is 1, otherwise 0. Sets r4 = 0 before the callee calls and uses r4 as the boolean result, preserving the
  caller''s r4/r5. Trailing mov r0, r4 is actually adds r0, r4, #0, which clears C and V; the final tst r0, r0 re-derives
  N/Z, so callers can branch on the returned flag directly. The exact meaning of bits 0xC0 in the frame parameters
  (e.g. flip/rotation or some finished/hidden state) is not determined from this function alone.'
