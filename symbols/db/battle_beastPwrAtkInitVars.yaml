name: battle_beastPwrAtkInitVars
address: '0x08011BA2'
kind: function
status: probable
summary: Initializes an enemy AI attack-vars block for a beast-power attack with base damage 30 x multiplier
  20 and fixed difficulty/charge settings.
interface: (r7 = pointer to oAIAttackVars struct, implicit) -> r0 = 0x27 (next attack state/step); struct
  fields Damage/ExtraDamage/InitFlag/etc. written
details: Calls battle_beastPwrAtk_addScaledBase_8012642 with r0=0x1E (base damage) and r1=0x14 (multiplier)
  and stores the returned total to oAIAttackVars_Damage. Sets ExtraDamage to 0x94 (148), InitFlag to 1,
  AiDifficultyTier to 1, ChargeReadyFlag to 0, AttackBoost to 0, ChipUseDelay to 0, and stores the constant
  word 0x23C to oAIAttackVars_AttackBoost2. Returns 0x27 in r0, likely a state or step identifier consumed
  by the caller's AI attack dispatcher. The struct base arrives in r7, so the caller passes the attack-vars
  context via the high register, typical of these battle AI routines.
