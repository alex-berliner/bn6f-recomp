summary: Clears the `Unk_09` byte at offset 0x9 of an unknown struct passed in r5 (no return value).
interface: (r5 = ptr to a struct with a byte field at offset 0x9) -> void
details: "The function pushes r4-r7+lr, immediately writes 0 to [r5, #9], and returns.\n  BattleObject layout starts\
  \ with an `object_header_struct` (Flags/Index at 0, Type at 2, etc.),\n  so offset 0x9 is `CurAction` on BattleObject.\
  \ But other structs (e.g. AIState, OverworldNPCObject)\n  also have meaningful bytes at +0x9. Without any captured\
  \ call showing r5, or a caller/callee,\n  the concrete role of offset 0x9 cannot be pinned down.\n  The contract\
  \ lists only r5 in/out (callee-saved), so the function is effectively void from the\n  caller's perspective —\
  \ it just mutates one byte at a fixed offset on a struct already in r5.\n"
