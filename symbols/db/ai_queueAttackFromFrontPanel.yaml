name: ai_queueAttackFromFrontPanel
address: '0x08112968'
kind: function
status: probable
summary: AI helper that targets the panel one step in front of the acting battle object (PanelX +/- 1 via front
  direction, PanelY) and calls sub_80D1EB8 with packed DifficultyTier|SubStepIndex, Damage, and a pointer to AttackBoost2
  offset from the battle object, after dereferencing oAIAttackVars_TimerOrCycles by SubStepIndex.
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = sub_80D1EB8 result; flags clobbered
details: Reads the object's facing side via object_getFrontDirection and adds it to oBattleObject_PanelX to get
  the target panel column (r0), with oBattleObject_PanelY as row (r1). Computes r2 = pointer to a step entry inside
  the oAIAttackVars struct (base + SubStepIndex*4). Packs r4 = AiDifficultyTier | (SubStepIndex << 8), loads r6
  = oAIAttackVars_Damage, and r7 = pointer to oAIAttackVars_AttackBoost2, then calls sub_80D1EB8 which presumably
  spawns/queues the attack with those parameters. Difficulty-indexed byte tables right after (counters 5/10/20/25...,
  values 0xFF/0x78/0x5C..., and constants 0x3C/0x30/0x24...) suggest per-difficulty timing/damage data for this
  attack used by nearby state handlers.
