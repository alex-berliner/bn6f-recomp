name: battle_objectTimedSelfDestructUpdate
address: '0x080BBDAC'
kind: function
status: probable
summary: Battle-object update state that plays an animation for a fixed timer, then plays a sound, disables
  the object's hitbox, and destroys the object.
interface: (r5 = battle object, implicit) -> void; no arguments, no return value
details: 'This is an object state handler reading its object from r5. On phase 0 it initializes: phase=4,
  animation=4 (oBattleObject_CurAnim), timer=4, and if ExtraVars is non-null calls sub_80E78AE (likely
  an animation/effect helper on that pointer). On later phases it counts the 16-bit timer down each frame;
  when it expires it calls sub_8011044(2, 9) — consistent with a sound/jingle request — clears oCollisionData_Enabled
  at the object''s CollisionDataPtr so it stops registering hits, and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object manager removes it. The hard-coded anim 4 and 4-frame lifetime suggest a short-lived one-shot
  effect rather than a reusable enemy behavior.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'phase-0 branch sets oBattleObject_CurPhase=4, oBattleObject_CurAnim=4, oBattleObject_TimerAndTimer2=4
    (asm lines 3-8); timer is decremented each frame and exit is gated on it going negative (ldrh/sub/strh/bge);
    sub_8011044(2,9) fired exactly when the timer expires, right before teardown; collision disabled:
    strb r0=0,[r1,#oCollisionData_Enabled] from oBattleObject_CollisionDataPtr; ends with mov r0,#CUR_STATE_DESTROY;
    str to oBattleObject_CurStateActionPhaseAndPhaseInitialized, the standard self-destruct pattern'
