name: battle_runPwrAtkStep
address: '0x080EAD9C'
kind: function
status: confirmed
summary: Runs one frame of a battle object's PowerAtk action — dispatches the current step handler from a jump table,
  then either ticks down an input-wait counter or arms the attack on an A-button press.
interface: void battle_runPwrAtkStep(u32 r2, AIData* r4, BattleObject* r7 /* also r5,r6,r8-r12 pass-through */);
  outputs r1/r5/r8-r12 as left by the step handler (r1=1 when the wait counter had reached 0), r7 restored; clobbers
  r0-r4,r6,flags
details: 'Per-frame driver for the "PowerAtk" action state of a battle object (r7). Computes r3 = obj+0x1E (the
  step-number byte), reads it, and indexes the jump table at off_80EADD0 with it, then does the classic mov lr,pc
  / bx r1 BL-long-style dispatch so the handler sees the caller''s entire register state: r0 = step value, r1 =
  handler address, r3 = pointer to the step byte, r7 = battle object, everything else passed through untouched.
  The three steps are battle_commitPanelMove, battleObject_slashBeastWaveUpdate_80EAE28 and object_endPwrAtkAction_80EAF36
  — a panel-move setup, a beast-style slash/wave attack, and the action''s cleanup, so this is the step sequencer
  for a charged/power slash attack that first moves the attacker''s panel, spawns the slash wave, then ends. After
  the handler returns, the pushed r3 (obj+0x1E) is popped into r7, so the following code reads the object at +0x22
  (PWR_ATK_ARM) and +0x23 (PWR_ATK_WAIT): if byte +0x23 (the wait countdown at handler-relative +5) is nonzero it
  is decremented and input is ignored for that frame; otherwise r1 is set to 1 and, if bit 0 (A) of oAIData_JoypadPressed
  in r4''s AIData is set, byte +0x22 is set to 1, arming the attack. r7 is then restored to the battle object and
  the handler''s r1/r5/r8-r12 values flow back to the caller (the register contract lists r1/r5/r8-r12 as outputs,
  r7 preserved).

  '
