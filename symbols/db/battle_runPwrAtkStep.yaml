name: battle_runPwrAtkStep
address: '0x080EAD9C'
kind: function
status: probable
summary: 'Per-frame step runner for the enemy''s scripted power attack: dispatches a sub-step (panel move,
  beast wave slash, end action) and waits for an A press before finishing.'
interface: (r7 = AI attack state struct, r4 = AIData) -> r0 = handler's return; writes state+0x1E (step
  idx consumed by handler), state+5 (wait counter), state+4 (done/A-press flag)
details: 'Called from RunAIAttack, it tail-dispatches through off_80EADD0 using the byte at state+0x1E
  to one of three handlers: battle_commitPanelMove, battleObject_slashBeastWaveUpdate_80EAE28, object_endPwrAtkAction.
  After the handler returns, it decrements the byte at state+5 while nonzero (a hold/delay counter). Once
  that counter reaches 0, it tests AIData_JoypadPressed for bit 0 (A button) and, if pressed, stores 1
  to state+4, signaling the attack sequence is finished. The sequence move-to-panel, slash beast wave,
  end action identifies this as the enemy power-attack (PwrAtk) routine shared by the beast-out AI attack.'
