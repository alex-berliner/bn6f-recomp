name: battle_repeatActionPhase
address: '0x080D8ADC'
kind: function
status: confirmed
summary: Runs a battle object's repeating phase - counts down a timer, replays a panel effect plus sound 0xC7 on
  each expiry, and moves to action 0x0C when repeats run out
interface: void battle_repeatActionPhase(BattleObject* r5)
details: Called with r5 = battle object. On first entry (PhaseInitialized == 0) it sets CurAnim = 1, Timer = 0,
  and PhaseInitialized = 4 to mark the phase as initialized. Each tick afterwards it decrements the 16-bit Timer
  and returns while it is still above zero. When the timer expires it reloads Timer from the 32-bit field ExtraVars+4,
  spawns a panel element effect via battle_spawnPanelElementEffect (r5 = object), plays sound effect 0xC7, and decrements
  the repeat count in Param2. While repeats remain it returns. When the last repeat is used up it sets CurAction
  = 0x0C and zeroes the combined CurPhaseAndPhaseInitialized halfword so the object's action script advances to
  the next step. Preserves r4, r6, r7; r1/r10 outputs seen by callers come from PlaySoundEffect, r5 is unchanged.
