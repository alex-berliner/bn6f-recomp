name: battle_objectRunBehaviorStep_8116D6C
address: '0x08116D6C'
kind: function
status: confirmed
summary: Runs one behavior step of a battle object (dispatched by its state byte) and then advances its sprite animation.
interface: void battle_objectRunBehaviorStep_8116D6C(/* r5 */ BattleObject* obj /* plus r2-r12 passed through */)
details: 'Dispatcher/stepper for a battle-side object whose pointer is in R5. Reads the byte at [R5+9] and uses
  it directly as a byte offset into a 3-entry handler table at off_8116D84 (0 -> sub_8116D90, 4 -> sub_8116DB4,
  8 -> sub_8116DEC), calling the selected handler with the Thumb ''mov lr, pc; bx r0'' idiom so the handler returns
  straight back into this function. R2-R12 (including R5, the object pointer) are passed through untouched so the
  handlers see the same context. After the handler returns, calls sprite_update via BL to advance the object''s
  sprite/animation frame, then returns with ''pop {pc}''. The three handlers presumably encode the object''s per-state
  logic (e.g. idle/move/attack phases); their state byte lives at offset +9 of the object struct.

  '
