name: owPlayer_toggleUsingCopybot_809e4bc
address: '0x0809E4BC'
kind: function
status: confirmed
summary: Toggle the CopyBot active event flag and refresh the overworld player sprite to show (or hide) the CopyBot
  companion
interface: 'void owPlayer_toggleUsingCopybot_809e4bc(void); /* inputs: r10 = oToolkit*; outputs: r1, r2; clobbers
  r0, r3, lr, nz, c, v; preserves r4-r7 */'
details: 'Toggles the EVENT_COPYBOT_ACTIVE flag via ToggleEventFlagFromImmediate

  (flag entry 0x17, bit 0x29), then walks the toolkit → GameState →

  OverworldPlayerObject pointer chain (r5) to reach oOWPlayerObject.


  After toggling, it re-tests the flag: if set, spriteId = 0x37 (CopyBot

  companion sprite); otherwise spriteId = 0. It then calls sprite_load

  on overworld slot 0x80, sprite index 0x18, with that spriteId, applies

  the player''s current AnimationSelect via sprite_setAnimation, builds

  frames with sprite_loadAnimationData, calls sprite_noShadow to suppress

  the shadow, and finally sprite_update to push it to the display.


  Effect is essentially a visual refresh of the player object to reflect

  whether the CopyBot is currently assisting the player.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
