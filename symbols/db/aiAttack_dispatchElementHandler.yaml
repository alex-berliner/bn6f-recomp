name: aiAttack_dispatchElementHandler
address: '0x080ECCB0'
kind: function
status: probable
summary: Dispatches an AI attack handler chosen by the attack's element field, defaulting to the tick-timer-and-exit
  handler
interface: (r0 = scratch/arg passed through, r7 = AI attack struct) -> tail-calls handler[HitElement];
  no return value of its own
details: 'Loads the byte at r7+oAIAttackVars_HitElement and indexes off_80ECCC4, then performs a Thumb
  tail-call (mov lr, pc; bx r1) to the selected routine, so r0 passes through unchanged to the handler.
  Table entry 0 is sub_80ECCCC (unknown), entry 1 is aiAttack_tickTimerAndExitWhenDone_80ECA0C, the generic
  ''wait until attack finished then exit'' behavior. The 2-entry table suggests a boolean split: element
  0 (normal/none) gets the special path, any other element gets the default wait handler. Since the tail-call
  sets lr, the callee''s return goes straight to this function''s caller.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_HitElement]; ldr r1,[r1,r0] selects handler by element (sub_80ECCB0
    lines 3-4); mov lr,pc; bx r1 is a Thumb tail-call dispatch to table entry (sub_80ECCB0 lines 5-6);
    off_80ECCC4[1] = aiAttack_tickTimerAndExitWhenDone_80ECA0C+1, the known default wait/exit handler;
    off_80ECCC4[0] = sub_80ECCCC+1, an unknown special-case handler for element 0
  refs:
  - bn6f/asm/asm31.s:116205
  reproduce: python3 tools/asmcat.py 0x080ECCB0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
- what sub_80ECCCC does (the element-0 handler), which would reveal the semantic split
- no known callers, so the context of r7 and the meaning of the HitElement field value 0 are unconfirmed
