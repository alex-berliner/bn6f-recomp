name: battleObject_checkPanelMatch_80A743C
address: '0x080A743C'
kind: function
previous_names:
- sub_80A743C
status: probable
summary: Returns 1 if the battle object's two (FuturePanelX,FuturePanelY) pairs (r5+0x18/0x1c) match its
  (PanelX,PanelY) pair (r5+0xc/0x10), else 0
interface: '(r5 = BattleObject*) -> r0 = 0|1 ; side effects: none'
details: "Pushes only lr. Default r0 = 0. Loads [r5+0x18] and [r5+0xc], compares; if unequal returns 0.\n\
  \  Otherwise loads [r5+0x1c] and [r5+0x10], compares; if unequal returns 0.\n  Otherwise sets r0 = 1\
  \ and returns via pop {pc}.\n  The offsets line up exactly with BattleObject.NextPanelX/NextPanelY at\
  \ +0x14/+0x15 vs PanelX/PanelY at +0x12/+0x13 — but 0x18/0x1c and 0xc/0x10 are the FuturePanelXY/PanelXY\
  \ u16 halves when read as bytes (FuturePanelXY at 0x14, PanelXY at 0x12), the ldr after a u16 load will\
  \ pick up the high byte +1 position; effectively this is testing whether the object's current (PanelX,PanelY)\
  \ already matches its (FuturePanelX,FuturePanelY), i.e. has the panel-swap finished.\n  Caller (sub_80A73A0)\
  \ iterates battle objects; the captured r1,r2,r3 wildcards look like (damage, hit) data from the surrounding\
  \ helper loop. Per returned 1, swaps are complete.\n  Likely used to gate panel-step animations or damage\
  \ hit-frame application when the object is already on the destination panel.\n"
