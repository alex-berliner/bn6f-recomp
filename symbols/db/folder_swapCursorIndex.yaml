- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r6, [r6,r0] / off_8135078 words 0x5C,0x60: r0 selects one of two struct fields; cmp r1,r2
    / cmp r1,r3 with str r2 / str r3 branches: field is rewritten to the opposite of the value it matches;
    mov r4,#0 / #1 + tst r4,r4 distinguishes which match fired so the correct replacement is stored; sole
