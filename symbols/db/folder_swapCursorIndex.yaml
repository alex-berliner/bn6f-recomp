name: folder_swapCursorIndex
address: '0x08135054'
kind: function
status: probable
summary: Swaps a list-cursor/selected-index between old and new values after a chip entry is moved in
  the folder editor.
interface: (r0 = list selector 0/1 picking field 0x5C/0x60, r2 = old index, r3 = new index, r5 = UI state
  struct base) -> void; no return value
details: r0 indexes a two-word table (0x5C, 0x60) to pick an offset into the struct at r5, i.e. the selected-index
  field of one of the two chip lists in the folder/pack editor. It loads that word; if it equals r2 it
  stores r3, if it equals r3 it stores r2, and for any other value it leaves the field untouched (r4 is
  a flag distinguishing the two cases). This keeps the cursor or selection valid when an entry changes
  position via folder_moveChipEntry. No flags are meaningfully returned and no other state is touched.
