name: GetBattleNaviStatsByte
address: '0x080136CC'
kind: function
status: confirmed
summary: Reads a single byte from either side's NaviStats record at a caller-chosen offset
interface: u8 GetBattleNaviStatsByte(bool side /*r0*/, u32 offset /*r1*/)
details: 'Calls GetBattleNaviStatsAddr with the r0 side flag (which selects the ally/alliance NaviStats record vs
  the normal one), then loads one byte from the returned NaviStats pointer at the offset given in r1. It is a generic
  field accessor: the caller decides which NaviStats byte (HP, attack, custom, speed, etc.) to read via the offset.
  r6 is used as a saved copy of the offset and is preserved across the call; r1 passes through GetBattleNaviStatsAddr
  untouched, so the offset survives to the load. Sets NZ flags via the ldrb, and the C/V outputs come from the callee.
  The offset is unchecked, so out-of-range values read adjacent memory.'
