name: battle_spawnObjectCollisionRegion
address: '0x080D0C5C'
kind: function
status: probable
summary: Thin wrapper that spawns a collision/hitbox region on the battle object's own panel, passing
  its element through to object_spawnCollisionRegion.
interface: (r5 = battle object) -> r0 = result of object_spawnCollisionRegion; r4/r6/r7 clobbered then
  restored
details: 'Reads the object''s PanelX, PanelY and Element fields from the battle object struct at r5, sets
  sort key/flags to 0, and calls object_spawnCollisionRegion with two hardcoded constants: 0x3105FF01
  (packed region params) and 0x4000. It is a fixed-parameter wrapper — nothing else is computed. Callers
  sub_80D0B54 and sub_80D0BD4 presumably set up r5 to the object before calling.'
