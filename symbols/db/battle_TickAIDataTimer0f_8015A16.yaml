name: battle_TickAIDataTimer0f_8015A16
address: '0x08015A16'
kind: function
status: confirmed
summary: Decrements a one-byte countdown timer stored in a battle object's AI data (offset 0x0F) when that timer
  is enabled and the object's navi stats byte 0x29 is clear.
interface: 'void sub_8015A16(BattleObject* obj /* r0 */); // inputs: r0 = battle object, r5/r6 passed through and
  preserved; outputs: r1 = AI data pointer (or 0x29 stats id on bail-outs), r2 = new timer value; clobbers r0, NZCV
  flags'
details: 'Takes a battle object pointer in r0 and bails out immediately if it is NULL.

  Queries GetBattleNaviStatsByte_AllianceFromBattleObject for stats byte 0x29;

  if that byte is non-zero the feature is considered off and the timer is left

  untouched. Otherwise loads the object''s AI data pointer (oBattleObject_AIDataPtr)

  and reads the byte at oAIData_Unk_0f, treating it as a countdown timer:

  0xFF means "disabled" and 0 means "already expired"; any other value is

  decremented by 1 and stored back. Quirk: on the early bail-outs r1 is left

  holding the stats-id constant 0x29 rather than the AI data pointer, and on

  the countdown path r2 exposes the (post-decrement) timer value — callers

  appear to ignore both. r5 is saved and restored around the whole body and

  only used as scratch, so r5/r6 are preserved for callers.

  '
