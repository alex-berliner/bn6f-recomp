name: sub_803FA42
address: '0x0803FA42'
kind: function
status: probable
summary: At title-screen init, verifies the ROM's version string and checksum of a data blob against saved values;
  on mismatch clears a story flag and reinitializes the state block.
interface: () -> r0 = 0 if the version string and checksum match (EVENT_1737 set), r0 = 1 otherwise (EVENT_1737
  cleared, state block reinitialized)
details: Calls sub_814D8F0 with (src 0xE007E80, dst dword_2006740, len 0x78), apparently copying/decoding a 120-byte
  ROM blob into RAM. It then byte-compares 20 bytes at EXE6_InfoText_timestamp against byte_2006750 — a version/build-string
  check. If that passes, it sums all 0x78 bytes of dword_2006740 and compares against the saved checksum in dword_2006744
  (which it zeroes before summing). Both matching sets EVENT_1737 and returns 0; any mismatch clears EVENT_1737,
  calls initStateBlock_803C352 to rebuild the 0x48-byte state at A_word_2006770, and returns 1.
