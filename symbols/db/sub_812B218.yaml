name: sub_812B218
address: '0x0812B218'
kind: function
status: hypothesis
summary: Allocates a fresh entry from the resource pool into the per-record slot at unk_20251A0[record->slot], tagging
  it 0x80000000, the first time that slot is empty, and increments the slot counter byte on the record.
interface: void sub_812B218(struct Record* r5 /* +0x1E = slot index */) /* preserves r4-r7; clobbers nz c v */
details: 'Walks the slot index from byte +0x1E of the record at r5, scales it into

  a u32 offset into the global table at unk_20251A0. If that slot is still

  empty (entry == 0) it calls sub_8046670 (the pool/request dispatcher)

  with (r0=0x1C, r1=slot+1, r2=(slot<<16)|0x01000001, r3=1), ORs the

  returned handle with the high bit 0x80000000 (alloc/dispatch sentinel),

  stores it back into unk_20251A0[slot], and bumps the record''s slot

  counter. When the slot is already populated, returns the existing entry

  in r0 without calling sub_8046670. The (r2=0x01000001) literal looks like

  a "parent id 0x1C, child id 0x01000001" pool allocation tag.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
