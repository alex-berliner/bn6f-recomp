name: battle_setObjectExtraFlagC_80C46C6
address: '0x080C46C6'
kind: function
status: confirmed
summary: Stores 1 into a battle object's 13th extra variable (ExtraVars+0xC), likely a per-turn "has acted"/reset
  flag.
interface: void battle_setObjectExtraFlagC_80C46C6(BattleObject *obj) // r0 = battle object; no outputs,
  flags clobbered
details: 'Two-instruction setter: writes the constant 1 to [r0 + oBattleObject_ExtraVars + 0xC] and returns.
  r0 is a battle object pointer (the standard battle entity struct); the field touched is the twelfth
  (0xC) word of the object''s ExtraVars block, so it is the 13th extra var. No other registers are read,
  no flags are preserved. The exact meaning of the flag is not apparent from the function itself — a constant
  store of 1 with no other access here suggests it marks a state such as "has acted" or a per-frame/per-turn
  reset consumed elsewhere.'
