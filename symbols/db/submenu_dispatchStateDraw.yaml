name: submenu_dispatchStateDraw
address: '0x08133A44'
kind: function
status: probable
summary: Dispatches a submenu widget's per-state handler (r5+2 = state, 3 states) via jump table, then
  draws the submenu box.
interface: (r5 = submenu widget struct; r5+2 = state byte 0-2) -> r0 = result of state handler; calls
  menu_drawSubmenuBox_8134490 afterwards
details: Reads the widget's state byte at [r5,#2], indexes a 3-entry table at off_8133A5C, and tail-invokes
  the chosen handler with a manual 'mov lr, pc; bx r0' long-call so the handler returns here. After the
  handler runs, it calls menu_drawSubmenuBox_8134490 to draw the submenu's side borders/box for the current
  state. The three state handlers (sub_8133A68, sub_8133B18, sub_8133B74) are not shown, so their exact
  per-state behavior is unknown. This is a per-frame update/draw routine for one submenu widget instance
  held in r5.
