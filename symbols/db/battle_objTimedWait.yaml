name: battle_objTimedWait
address: '0x080BF38A'
kind: function
status: probable
summary: Per-frame update that on first call sets CurAnim=1 and Timer=30, then after 30 frames transitions
  the object to CurAction 8 with phase 0.
interface: (r5 = battle object) -> r0 = clobbered; updates oBattleObject fields on r5; no return value
details: 'Uses r5 as a battle object pointer (not passed in r0). On first invocation (oBattleObject_PhaseInitialized
  == 0) it initializes the phase: CurAnim = 1, Timer = 0x1E (30 frames), and writes 4 to PhaseInitialized
  to mark the phase set up. Every frame it decrements the halfword oBattleObject_Timer; while it stays
  > 0 the function just returns. When the timer reaches 0 it sets oBattleObject_CurAction = 8 and clears
  oBattleObject_CurPhaseAndPhaseInitialized to 0, handing control back to the object''s action dispatcher
  for the next action. This is a typical ''wait N frames, then move on'' state used for timed object behaviour
  (e.g. a spawn/despawn or telegraph delay).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb PhaseInitialized / bne skip, then CurAnim=1, Timer=0x1E, PhaseInitialized=4 — standard
    one-time phase init of a battle object; ldrh Timer; sub 1; strh; bgt locret — frame-countdown gate
    that returns each frame until expiry; on expiry: CurAction=8 and CurPhaseAndPhaseInitialized=0 — phase
    ends by dispatching to action 8; field names oBattleObject_* and the phase/action pattern match the
    project''s battle object state machine convention'
  refs:
  - bn6f/asm/asm31.s:15871
  reproduce: python3 tools/asmcat.py 0x080BF38A
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Code matches the proposal: it reads oBattleObject_PhaseInitialized, on zero sets CurAnim=1, Timer=0x1E,
    PhaseInitialized=4, then decrements Timer and on <=0 sets CurAction=8 and clears CurPhaseAndPhaseInitialized.
    One nit: the reset writes 0 to oBattleObject_CurPhaseAndPhaseInitialized, not ''clears PhaseInitialized
    to 0'' as the summary loosely says, but it does clear phase index too. The name is fine but ''TimedWait''
    is clearer.; run wf investigate investigate-20261019-055111; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
