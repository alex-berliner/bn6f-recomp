name: sub_814E0B6
address: '0x0814E0B6'
kind: function
status: hypothesis
summary: Range-checks the value in r2 and treats it as valid (leaves r3 alone) only when it is a RAM pointer (bit
  25 set, i.e. 0x02000000-0x03FFFFFF); otherwise it clears r3 to signal "invalid".
interface: 'void checkIsRamPointer(void) // in: r2 = value to test, r3 = caller''s flag (must be pre-set nonzero
  for a meaningful pass); out: r3 = 0 on failure, untouched on success; r0 always preserved; flags set as side effects
  of the last shift/compare'
details: 'Saves r0 on the stack (its only stack use) and tests r2 in three steps. First it shifts r2 right by 25:
  if any bit at 0x02000000 or above is set (EWRAM/IWRAM range) it returns immediately with r3 untouched, so the
  caller''s nonzero flag counts as "pass". Otherwise it loads the literal pool word, which is the ROM address 0x081C0418
  (the value living at off_81C0418), and compares r2 against it: anything below that constant fails and falls into
  "mov r3,#0". Anything at/above it is then shifted right by 14; only a result of zero would jump to the pass path,
  but since r2 >= 0x081C0418 the shift is always nonzero, so that path also ends in r3 = 0. Net effect: the function
  is a "is r2 a pointer into RAM?" predicate, with r3 = 0 meaning no and r3 unchanged (caller-provided) meaning
  yes. r0 is carefully preserved throughout, and the flags left behind are whatever the last executed shift/compare
  produced (callers appear to ignore them or the contract would be cleaner). The ROM-side branch (>= 0x081C0418
  with r2>>14 == 0) is effectively unreachable given the constant, so either the constant is patched/varies or the
  extra test is defensive/dead code.

  '
