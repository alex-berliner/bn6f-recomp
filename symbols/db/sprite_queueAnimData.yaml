name: sprite_queueAnimData
address: '0x03006E98'
kind: function
status: probable
summary: Copies a 0x40-byte sprite data block, chosen from one of ten tables by fields of the caller's
  descriptor, into the next free slot of a queued buffer and records the pointers in the sprite work state.
interface: '(r0 = descriptor struct: byte +1 = variant flag, byte +2 = table index, +3 = sub-pointer)
  -> r0 = pointer to the queued 0x40-byte block in the queue buffer; updates state at byte_200A220 (+0x28,
  +0x2c, +0x30, +0x34)'
details: First it increments a global counter at byte_200A220+0x30. It reads byte [r0+2] as a table index,
  adding 2 if byte [r0+1] is nonzero, then multiplies by 4 to pick one of ten pointers in the table at
  off_3006EEC (unk_2001186 ... byte_2001AC0). The destination is byte_200AFA0 + (halfword at byte_200A220+0x34
  << 6), i.e. a queue of 0x40-byte slots. It copies 0x40 bytes from the selected table entry via CopyBytes,
  then increments the byte slot counter at +0x34, stores the destination pointer at state+0x28 and r0+3
  at state+0x2c, and returns the destination. No caller is known, so the identity of the descriptor struct
  and of the ten source tables is inferred only from the addressing.
