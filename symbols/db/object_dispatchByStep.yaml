name: object_dispatchByStep
address: '0x0802BDF0'
kind: function
status: probable
summary: Thunk that calls an object's per-step handler chosen by the step index stored at [r5+2].
interface: (r5 = object ptr; step = byte [r5,#2]) -> jumps to table[step] with r0 = step, r1 = &jump table
  base; returns handler's r0
details: Reads the object's current step counter (byte at r5+2), uses it to index a two-entry thumb function-pointer
  table at off_802BE04, and tail-dispatches via 'mov lr, pc; bx r1'. Entry 0 is objStepFinishSetState4_802BE0C
  (a known 'finish step, set state 4' object helper) and entry 1 is sub_802BE36, so the object has two
  scripted steps. The jump table is stored right after the code (the .byte 0,0 padding plus two .word
  entries). r5 is not loaded inside, so the caller must have set r5 to the object structure; r0 passed
  to the handler is the step index. Behaves as the standard per-frame step dispatcher for one small object/task
  routine.
