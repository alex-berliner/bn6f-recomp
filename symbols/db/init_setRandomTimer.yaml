name: init_setRandomTimer
address: '0x08143204'
kind: function
status: probable
summary: Calls sub_81431F8 to obtain a struct pointer, then writes a random halfword in range 30–93 ([GetRNG
  & 0x3F] + 0x1E) at offset +6 of that struct, used as a frame-delay timer.
interface: () -> r0 = undefined; stores halfword timer into [crowState+6]
details: Calls sub_81431F8, whose return value is treated as a struct pointer (r5) and stored to halfword
  offset 6; given the adjacent caller sub_8143314 spawns crows into byte_2000D20 slots, r5 is most likely
  the active crow slot/state record. It then draws one raw GetRNG value, masks it with 0x3F (0–63), adds
  the constant 0x1E (30) from dword_814321C, and writes the sum (30–93) as a halfword at +6. That range
  and halfword store are typical of a frame-delay/timer field. No other fields are touched and no flags
  are meaningful.
