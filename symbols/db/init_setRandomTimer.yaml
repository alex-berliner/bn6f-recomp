    random value in 0..63; ldr r0,dword_814321C (=0x1E); add r0,r0,r1; strh r0,[r5,#6]: writes 30+rand(64)
    to halfword field +6; caller sub_8143314 nearby spawns crows into byte_2000D20 slots, tying this to
    the crow subsystem'
