name: object_setSmashFactor
address: '0x0814F988'
kind: function
status: confirmed
summary: Applies a 16-bit "smash" value to a battle object flagged 'Smsh', storing the value and a fixed-point (value
  * rate >> 8) result in the object.
interface: 'void object_setSmashFactor(BattleObject* obj /*r0*/, u16 value /*r1*/); extra register outputs callers
  rely on: r2 = obj, r3 = kind word from +0x34, r1 = masked value on the non-smash path but the rate from +0x1C
  on the smash path; clobbers r0 and nzcv.'
details: 'Reads the object''s kind word at +0x34 and only acts when it equals the magic 0x68736D53 (little-endian
  ''Smsh''), which marks smash-sensitive battle objects (objects that react to being smashed/hit). For such objects
  it stores the truncated 16-bit input at +0x1E, loads the 16-bit rate already present at +0x1C, computes (value
  * rate) >> 8 with an arithmetic shift (an 8.8 fixed-point product), and stores that at +0x20. For any other kind
  word the function writes nothing and just returns, leaving the caller-visible r1 holding the masked input. Quirks:
  the register leftovers differ between the two paths (r1 holds the input vs. the rate), so callers appear to depend
  on the exact exit path; the function is a plain leaf with push {lr}/pop {r0}; bx r0.'
