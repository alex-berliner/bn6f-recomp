name: object_setSmashFactor
address: '0x0814F988'
kind: function
status: probable
summary: Sets a strength value on an object tagged with the 'Smsh' magic and recomputes its scaled product
  field.
interface: (r0 = object ptr with magic 'Smsh' (0x68736D53) at +0x34, r1 = 8-bit factor) -> r0 clobbered
  (popped into pc path); stores factor at +0x1E and factor*base>>8 at +0x20; flags from cmp/mul
details: The function takes a struct pointer in r0 and a value in r1, masks r1 to 16 bits, and only acts
  if the struct's field at +0x34 equals the fourcc 0x68736D53 ('Smsh' little-endian). It stores the masked
  r1 into halfword +0x1E, reads halfword +0x1C as a base value, computes base*factor with the result arithmetically
  shifted right by 8 (a fixed-point /256 scale), and writes that to halfword +0x20. If the magic check
  fails it does nothing, so this is a type-guarded setter rather than a generic field write. The /256
  fixed-point multiply suggests +0x1C is a full magnitude and +0x20 a scaled result (e.g. a size or intensity
  driven by a 0-255 factor). No other fields are touched and there is no call in this function.
