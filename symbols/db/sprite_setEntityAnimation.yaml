name: sprite_setEntityAnimation
address: '0x0811A610'
kind: function
status: probable
summary: Sets a battle entity's sprite animation to the given index (with data load and no-shadow flag),
  unless it already shows that animation.
interface: (r0 = animation index, r1 = entity index into eStructArr2008450) -> void; flags from getStructFrom2008450's
  status byte
details: r1 indexes the 0x58-byte battle-entity struct array at 0x2008450 via getStructFrom2008450; r0
  is the wanted animation index. It bails if the entity is absent, if status byte 0 has bit 0x8 set (invisible/undrawable),
  or if byte +0xC already equals the requested animation, so repeated calls for the same animation are
  no-ops. Otherwise it stores the index into +0xC (which sprite_setAnimation reads), calls sprite_loadAnimationData
  on the entity's sprite, and sprite_noShadow to clear the shadow flag. Callers in the battle AI/action
  dispatch (e.g. sub_8129758 on action 3, decideBattleAction_8129AC8, sub_8129C74) invoke it when an entity's
  state changes, consistent with swapping to that state's animation.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: getStructFrom2008450 call with r1 as index, then tst r0,#8 / bne exit gates on the entry's status
    flag; ldrb r0,[r5,#0xc]; cmp r4,r0; beq exit — early-out when byte 0xC already holds the requested
    animation, then strb r0,[r5,#0xc]; tail sequence sprite_setAnimation -> sprite_loadAnimationData ->
    sprite_noShadow applies the new animation to the entity's sprite; callers sub_8129758/sub_8129C74
    (battle state dispatch, state 3/4 transitions) call it with an action/state index, matching per-state
    animations
