open_questions:
- Exact bit constants for the three flags; "OBJECT_FLAG_ACTIVE" matches bit 0x01 but the "STOP_SPRITE_UPDATE" and
  "UPDATE_DURING_TIMESTOP" bit values are inferred from usage order and naming, not yet pinned.
- Whether sprite_setAnimation/sprite_loadAnimationData can mutate CurAnim (the C port re-reads it after the calls;
  the assembly only stores r0 of CurAnim once before them).
- Exact structure offsets oObjectHeader_Flags, oBattleObject_CollisionDataPtr, oBattleObject_PreventAnim, oBattleObject_CurAnim,
  oBattleObject_CurAnimCopy are not provided here and would need confirmation from the object header.
