name: UpdateBattleObjectSprite
address: '0x0801BC64'
kind: function
status: confirmed
summary: Advances one battle object's sprite for the current frame, skipping it when inactive, sprite-update-locked,
  caught by an active timestop, or when collision-attached with animation locked.
interface: void UpdateBattleObjectSprite(struct BattleObject *obj /* r5 */, struct BattleSpriteState *state /* r10
  */, lr /* lr */); returns nothing (NZ/C/V and r0..r5 left as last callee, or as the tst that branched)
details: 'Reads oObjectHeader_Flags and tests three bits: 0x01 "OBJECT_FLAG_ACTIVE" (object must be active),

  "OBJECT_FLAG_STOP_SPRITE_UPDATE" (suppresses update), and "OBJECT_FLAG_UPDATE_DURING_TIMESTOP"

  (lets the sprite keep ticking through a timestop). When the timestop-exemption bit is clear,

  calls battle_isTimeStop and bails on "stopped". Then, if oBattleObject_CollisionDataPtr is

  non-null, checks oBattleObject_PreventAnim and skips the update when set. Otherwise compares

  oBattleObject_CurAnim against oBattleObject_CurAnimCopy and, on mismatch, calls

  sprite_setAnimation(CurAnim), sprite_loadAnimationData(), and writes the (possibly re-read)

  CurAnim back into CurAnimCopy. Finally calls sprite_update(). Preserved registers: r4, r5.

  '
