name: ai_clearCounterHitChainFlag
address: '0x0801443C'
kind: function
status: confirmed
summary: Clears a battle object's counter-hit chain flag by writing 0xFFFF to the CounterHitChainFlag field of its
  AIData.
interface: void ai_clearCounterHitChainFlag(battleObject *obj in r5); returns AIData pointer in r3; clobbers r0
details: 'Reads the object''s AIData pointer from battle object field oBattleObject_AIDataPtr (r5-based), then stores
  the halfword 0xFFFF to oAIData_CounterHitChainFlag. The value 0xFFFF presumably means "no counter-hit chain" /
  inactive rather than a valid chain index or timer. Handy quirk of the compiled code: it returns the AIData pointer
  in r3, so the caller can keep working with the AI data without reloading it. Uses r5 as the object pointer and
  does not touch flags.'
