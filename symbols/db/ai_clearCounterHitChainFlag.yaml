name: ai_clearCounterHitChainFlag
address: '0x0801443C'
kind: function
status: probable
summary: Resets the battle object's AI counter-hit chain field to the 0xFFFF 'none' sentinel.
interface: (r5 = battle object) -> void; writes 0xFFFF to oAIData_CounterHitChainFlag of the object's
  AI data; no return value, no flags
details: Loads the battle object's AI data pointer from oBattleObject_AIDataPtr and stores the halfword
  0xFFFF into oAIData_CounterHitChainFlag, using 0xFFFF as an invalid/none marker. It is a one-field setter
  with no other state touched and no calls. Callers in navi AI tick and the beast-out eligibility check
  use it to clear a stale counter-hit chain before evaluating AI state, which fits 0xFFFF meaning 'no
  chain active'. r5 must already hold the battle object pointer on entry.
