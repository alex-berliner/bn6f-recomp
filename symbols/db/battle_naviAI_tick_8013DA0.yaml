name: battle_naviAI_tick_8013DA0
address: '0x08013DA0'
kind: function
status: confirmed
summary: Per-frame AI tick for a battle navi that gates on three navi-stat fields, runs a 60-frame decision
  timer, picks a new AI state from a 16-slot weighted table using positive RNG, and dispatches to one
  of four action routines.
interface: void sub_8013DA0(u32 /*r5*/ battleObject, u32 /*r10*/ ?, u32 /*lr*/ link); clobbers nzcv r0-r3
  r12 lr; preserves r4 r5 r6 r7
details: 'Guards bail early via battle_isPaused() or when any of the three navi-stat

  byte fields at offsets 0x24, 0x21, 0x2C read via

  GetBattleNaviStatsByte_AllianceFromBattleObject is zero. If 0x2C is non-zero

  it fires sub_80143A6 + sub_8014446 immediately and exits. Otherwise it walks

  oBattleObject_AIDataPtr -> oAIData_Unk_3a as a u16 frame counter; when it

  reaches 0x3C (60 frames) it is reset to 0, sub_80143A6 + sub_8014446 are run,

  and a transition decision is made. The current state byte at oAIData_Unk_0b

  is compared against the 16-byte weight table byte_8013E44

  (entries: 0x00,0x00,0x00,0x00,0x00,0x00,0x01,0x01,0x01,0x01,0x01,0x01,0x01,

  0x01,0x02,0x03) to build a 16-byte mark array on the stack: matching the

  current state writes 1 if current state is 0 else 0 (a self-stay/quit slot),

  non-matching entries pass their weight through. The index into the mark

  table is GetPositiveSignedRNG() % 16 via SWI 6 (value in r0, modulus in r1,

  result in r1). The selected mark byte overwrites oAIData_Unk_0b. Dispatch:

  mark == 2 -> sub_80143CE; mark == 1 -> sub_801443C; otherwise look up

  dword_8013E54 (=0xFF003C99) byte [new_state] and pass it together with

  battle_obj''s oBattleObject_Alliance byte to

  battle_setPlayerNaviStatsField0E_8015BEC. r10 is read by callers per the

  contract but not touched here.

  '
