summary: 'Battle camera: returns 1 if the current battle actor (from r10''s BattleState) is in front of
  the camera, else 0.'
interface: () -> r0 = 0 or 1 (Z set on r0); no side effects beyond r0, r1, r3.
details: "- Calls battle_GetObjectByteAt14_800A9E2 with r0=0 to read battleState+0x14 for index 0 (the\n\
  \    byte used elsewhere for \"is object in front of camera\", per the caller context).\n  - ANDs the\
  \ returned byte with 0x5 (mask of bits 0 and 2) and returns 1 if any of those bits\n    is set, else\
  \ 0. The result ends up in r0 with Z flag set when r0 == 0.\n  - The captured-call snapshots show consistent\
  \ r0/r1/r2/r3 values from camera_doShakeEffect\n    (the only caller), confirming the function is invoked\
  \ unconditionally on camera-shake\n    frames and is just a quick predicate.\n  - The choice of `0x5`\
  \ mask is the only \"magic\" here: it likely corresponds to \"alliance\n    bit(s)\" on the indexed\
  \ battle object (bits 0 and 2 of Unk_14 in BattleState, where 0\n    typically = player row facing friend).\n"
