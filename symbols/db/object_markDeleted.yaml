name: object_markDeleted
address: '0x080C4C4C'
kind: function
status: probable
summary: Tiny helper that sets a flag byte in a battle object struct, called while tearing down objects
  during battle-object deletion.
interface: (r0 = battle object pointer) -> r0 = unchanged; writes 1 to [r0+0xC]
details: The whole routine is 'mov r1,#1; strb r1,[r0,#0xC]; mov pc,lr' — it unconditionally stores 1
  into byte 0xC of the object pointed to by r0. Its only known caller is battle_killObjectWithDependents,
  which conditionally sets a delete flag on an object, flags linked objects for deletion, resets AI state,
  and dispatches an event; this helper is most plausibly the 'set deleted/removal flag on one object'
  step of that teardown. No other callers or struct layouts are visible, so the exact meaning of byte
  0xC (deleted vs. some kill-related status flag) is inferred from the single call site.
