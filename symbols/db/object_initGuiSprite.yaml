  reproduce: python3 tools/asmcat.py 0x0811B9D8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary''s core flow (state 0x23, GUI sprite 0x12, animation 6, no shadow, priority 3, slot
    halfword 0x300/0x260, palette bank, +8=4, +9=4/0, +0xC=6, tail-call sub_811BA58) matches the asm exactly.
    The flag check at [r5+4] selects whether +9 is 4 or 0, and palette bank is 0xB or [r5+3]+0xB, all
    as described. Minor wording quibble: ''+3 is a selector, +4 is a variant flag'' is correct but the
    proposal says ''+9=4-or-0 (same flag)'' which misattributes ''+4'' as ''same flag'' only - it''s the
    +4 flag driving both branches. Name and intent fit; summary is slightly imprecise on the flag field
    but overall agrees.; run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
