name: getSignedHalfword
address: '0x080A7B90'
kind: function
status: probable
summary: Reads a little-endian signed 16-bit halfword from [r0]/[r0+1] and returns it sign-extended in
  r1 (r0 is scratch, flags clobbered).
interface: (r0 = pointer to two-byte field) -> r0 = sign-extended 16-bit value of [r0] | [r0+1]<<8; flags
  clobbered
details: 'Loads the byte at offset 0 and the byte at offset 1 of the struct pointed to by r0, combines
  them into a halfword (low byte first, so little-endian), then sign-extends via lsl #16 / asr #16. This
  is a standard accessor for a 16-bit signed field (e.g. a coordinate or counter) kept split across two
  byte slots. It touches no other memory and calls nothing; r1/r2 are scratch. The single known caller
  sub_80A7AFA sits directly before it, suggesting the pair are accessors for the same structure.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r0] + ldrb r2,[r0,#1]; lsl r2,#8; orr -> little-endian halfword assembly (sub_80A7B90
    lines 1-4); lsl r1,#0x10; asr r1,#0x10 -> sign-extends the halfword, so the field is signed (sub_80A7B90
    lines 5-6); no callee calls and only mov pc,lr -> pure inline-style getter; caller sub_80A7AFA immediately
    precedes it at 0x080A7AFA, implying an accessor cluster for one struct
  refs:
  - bn6f/asm/asm29.s:5339
  - 0x080A7AFA sub_80A7AFA
