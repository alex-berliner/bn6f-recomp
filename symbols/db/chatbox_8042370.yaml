name: chatbox_8042370
address: '0x08042370'
kind: function
status: confirmed
summary: Plays a queued SE (sound_id, param) from the chatbox script stream and advances the cursor.
interface: void chatbox_playSoundEntry_8042370(void);  /* reads r4 as script cursor, returns 1 in r0; clobbers r0,r1,r2,r3,flags
  */
details: 'Treats r4 as a pointer into a chatbox script/command stream. Reads two bytes at

  r4+2 (sound_id and an auxiliary param), calls sound_80006A2 with the sound_id

  in r0, the param in r1, and a hard-coded priority/volume byte 0x1F in r2.

  Then bumps r4 by 4 (consuming this 4-byte entry past whatever the caller uses

  in the first two bytes) and returns 1 so the chatbox runner knows the entry

  was handled. Only entry point in the file with this pattern; a likely match

  for chatbox opcode "play SE" (0x1F priority is a tell that it''s the standard

  chatbox SE priority slot).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
