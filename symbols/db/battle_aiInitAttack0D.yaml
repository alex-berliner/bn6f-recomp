name: battle_aiInitAttack0D
address: '0x0810209E'
kind: function
status: probable
summary: Initializes the AI attack-variable block of a battle object from the dword_8101A28 table and
  the version-scaled Damage/ExtraDamage halfword tables at 8101A38/8101A40, seeding the per-attack locals
  (boost, timer, step indices, init flag, difficulty tier), then triggers object_setAttack0(0xD).
interface: (r7 = battle object) -> void; object fields oAIAttackVars_* filled, object_setAttack0(0xd)
  invoked, flags not meaningful
details: 'Loads four 32-bit parameters (from dword_8101A28/2C/30/34) through sub_800FE28 into ScratchVar,
  AiAttackParam, PanelParamFlags2 and ScratchPointerOrPanel, then reads two version-scaled table entries
  via battle_aiGetVersionedTableEntry into Damage and ExtraDamage. It seeds constants: AttackBoost2 =
  4, TimerOrCycles = copy of PanelParamFlags2, SubStepIndex = 8, AttackStepIndex = 0, InitFlag = 1, AiDifficultyTier
  = 0. Finally it calls object_setAttack0 with attack id 0xD, so this is the setup routine for one specific
  AI attack pattern whose tuning numbers live in the 8101A28.. table.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_810209E stores sub_800FE28 results into oAIAttackVars_ScratchVar/AiAttackParam/PanelParamFlags2/ScratchPointerOrPanel;
    battle_aiGetVersionedTableEntry_800FE12 results stored to oAIAttackVars_Damage and oAIAttackVars_ExtraDamage;
    constant stores: AttackBoost2=4, SubStepIndex=8, AttackStepIndex=0, InitFlag=1, AiDifficultyTier=0,
    TimerOrCycles=PanelParamFlags2; ends with mov r0,#0xd; bl object_setAttack0 — the initialized state
    is used to run attack 0xd; data constants dword_8101A28..byte_8101A40 are a per-attack parameter block
    read via the AI table helpers'
