name: ow_spawnMapObject1b
address: '0x0808FF9C'
kind: function
status: probable
summary: Spawns overworld map object type 0x1B (likely the bus entity) using position/parameters computed by sub_808FFC0,
  then stores a byte into the new object.
interface: () -> r0 = 0 (always); internally calls sub_808FFC0 to obtain r0-r3 args for SpawnOverworldMapObject
  (r0=0x1B type, r3=0x400000), writes sub_808FFC0's r3 low byte to new object+5
details: First calls sub_808FFC0, whose return values in r0-r3 are reshuffled into the spawn arguments; r2/r1 become
  the spawn's r1/r2, while its r3 is saved in r6. It forces the object id to 0x1B and the fourth argument to 0x00400000
  before calling SpawnOverworldMapObject, which apparently leaves the new object's pointer in r5. It then stores
  the saved byte at [object+5], a per-instance field of the spawned object. Called from the bus-station state machine,
  this is the helper that materializes the bus (object 0x1B) on the stop map; sub_808FFC0 most likely supplies its
  screen/map coordinates.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sub_808FFC0 then mov r6,r3 / mov r4,r2 / mov r2,r1 / mov r1,r0 chains its outputs into the next call;
    mov r0,#0x1b and r3=0x400000 set fixed type/flag args before bl SpawnOverworldMapObject; strb r6,[r5,#5] right
    after the spawn writes the saved byte into the new object (r5 set by the callee); caller 0x0808F900 is the bus-station
    move sequence controller, so the 0x1B object is the bus there; returns mov r0,#0 unconditionally, like other
    overworld state-machine step helpers
