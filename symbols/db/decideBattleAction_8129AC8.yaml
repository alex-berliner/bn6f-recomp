name: decideBattleAction_8129AC8
address: '0x08129AC8'
kind: function
status: confirmed
summary: Picks the battle-side action for an entity, dispatching to the move-event handler when the chosen
  kind is 2.
interface: void decideBattleAction_8129AC8(struct Entity* r5); /* returns via tail pop */
details: 'Reads the entity''s 0x1d byte and forwards it to sub_812B318, which returns

  a "valid" flag in r1 and an action "kind" in r2. If !valid, returns

  immediately. If kind == 2, writes 4 to entity+3 (action/state slot) and

  triggers sub_811A610(2, 0) -- the battle move/script dispatcher; otherwise

  delegates the side''s behavior to its sibling sub_812B218.

  r4 keeps a local copy of the kind; r4/r5/r6/r7 are preserved across the

  call.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
