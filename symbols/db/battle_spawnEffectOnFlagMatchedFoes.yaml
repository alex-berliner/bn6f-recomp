name: battle_spawnEffectOnFlagMatchedFoes
address: '0x080EA2A4'
kind: function
status: probable
summary: One-shot phase that flips Alliance to scan the opposite side's four alive actors, spawns a type-0
  effect (param 0x68, z+0x140000) on each actor whose flag word AND 0x202 is nonzero, records those actor
  pointers at this+0x60, then sets Timer=10 and waits before handing control to the state machine.
interface: (r5 = battle object this) -> r0 = 0; sets this->Timer=10, CurAction=4, CurPhase=4 on setup
  pass; decrements Timer afterwards and sets state to CUR_STATE_UPDATE when it hits 0.
details: On the uninitialized pass (PhaseInitialized==0) it flips this->Alliance with EOR 1, multiplies
  by 0x10 and adds it to oBattleState_AliveBattleActors to get the enemy side's actor array in the battle
  state, then loops the 4 slots. For each non-null actor it calls object_getFlag and tests the result
  against 0x202 (bits 0x2 and 0x200 together); matching actors get an effect object spawned (spawn_t1_0x0_EffectObject,
  r4=0x68 parameter) at the actor's coordinates read from +0x34 (ldmia {r1-r3}) with the third coordinate
  offset by 0x140000, and the effect's oObjectHeader_Flags gets bit 4 set. Each targeted actor pointer
  is recorded into this object's array at +0x60 (four slots, stride 4). Finally Timer=0xA and CurAction/CurPhase=4;
  on later calls it just counts Timer down and hands control back to the state machine via CUR_STATE_UPDATE.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'eor r0,#1 / mul r0,#0x10 / add #oBattleState_AliveBattleActors selects the opposite alliance''s
    actor array; loop `cmp r6,#4` over 4 slots calls object_getFlag and `tst r0, dword_80EA360 =0x202`
    filters targets; bl spawn_t1_0x0_EffectObject with coords from [actor+0x34] plus 0x14<<16 spawns the
    per-target effect; str r5,[r4] / add r4,#4 with r4=this+0x60 records each hit actor in a 4-entry list;
    Timer=0xA, CurAction=CurPhase=4, then decrement-and-CUR_STATE_UPDATE path shows a two-phase step handler'
  refs:
  - bn6f/asm/asm31.s:109831
  - 0x0801A166 object_getFlag
  - 0x080E05F6 spawn_t1_0x0_EffectObject
  reproduce: python3 tools/asmcat.py 0x080EA2A4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The setup behavior matches: flipping Alliance (EOR 1), indexing AliveBattleActors (mul 0x10), looping
    4 slots, testing object_getFlag against 0x202, and spawning a type-0 effect at the actor''s coords
    with +0x140000 z-offset and 0x68 param is all correct. The phase-4 wait and CUR_STATE_UPDATE handoff
    also match. However, the proposed name is misleading: it spawns an effect on a single target''s 4
    slots on the opposite side, but this object''s parent is itself an effect (spawn_t1_0x0_EffectObject
    is called from it), and storing actor pointers at +0x60 in four slots suggests it tracks ''flagged
    foes'' for follow-up phases rather than just ''spawn effect on flagged foes'' — a more accurate name
    reflects the flag-mask gating and effect spawning role.; run wf investigate investigate-20261019-010606;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
