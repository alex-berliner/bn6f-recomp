name: battle_startFadeIn
address: '0x0803AEE6'
kind: function
status: probable
summary: Waits for any chatbox/cutscene to finish, then triggers the fade-in into battle and sets a frame
  delay, running the battle module step afterwards.
interface: (r5 = battle-context struct pointer, preserved from caller; r0/r1 scratch) -> writes frame-delay
  counter to [r5+1]; calls SetScreenFade and battle_moduleInit_803A820; branches on chatbox flag Z/NZ
details: r5 points to a battle-context struct whose field +1 is a frame counter/delay and +3 a mode selector.
  It first tests bit 0x80 of the chatbox flag word eFlags2009F38 and does nothing (except the module step)
  while a chatbox/cutscene holds that bit. If [r5+3] == 1 it just sets the delay to 0xC; otherwise, if
  the chatbox state (low 3 bits of eFlags2009F38) is still active it sets delay 0x28 (post-text wait),
  and when the text is fully done it calls SetScreenFade(0xC, 0x10) — presumably a 12-frame fade with
  intensity/step 0x10 — and sets delay 0x30. In every path it tail-calls battle_moduleInit_803A820, so
  this runs as part of a per-frame battle state machine.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#0x80; bl chatbox_mask_eFlags2009F38; bne loc_803AF16 — skip until the chatbox bit clears;
    bl chatbox_GetState_8045F4C; cmp r0,#0; beq ... mov r0,#0x28; strb r0,[r5,#1] — longer wait while
    text still running; bl SetScreenFade with r0=0xC, r1=0x10; mov r0,#0x30; strb r0,[r5,#1] — start fade
    and set 0x30-frame delay; ldrb r0,[r5,#3]; cmp r0,#1; beq -> strb 0xC,[r5,#1] — mode field selects
    the short-delay path; bl battle_moduleInit_803A820 before pop — battle main routine runs every pass,
    so this is a state tick
