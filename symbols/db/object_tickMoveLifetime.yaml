name: object_tickMoveLifetime
address: '0x080E2358'
kind: function
status: probable
summary: 'Battle-object update: decrement lifetime timer, move object by its velocity each frame, and
  free the object when the timer expires or the battle ends.'
interface: (r5 = battle object pointer) -> void; frees the object slot when Timer <= 0 or battle is over
details: 'Reads the battle object at r5. First returns without action if battle_isBattleOver says the
  battle is ending, or if battle_isTimeStop indicates a time-stop freeze (in both of the battle-over case
  it goes straight to freeing, since the battle-over branch falls into the free path). Otherwise decrements
  oBattleObject_Timer; if it hits 0 or below, the object is released via object_freeMemory. While the
  timer is still positive, adds oBattleObject_XVelocity to oBattleObject_X and oBattleObject_YVelocity
  to oBattleObject_Y, i.e. straight-line movement with no other behavior. Object fields used: Timer, X,
  Y, XVelocity, YVelocity.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isBattleOver + tst/bne loc_80E2382: battle-over goes directly to object_freeMemory;
    bl battle_isTimeStop + bne locret: time-stop skips the whole update; ldrh r0,[r5,#oBattleObject_Timer];
    sub #1; strh; ble loc_80E2382: timer expiry frees the object; ldr/str pairs on oBattleObject_XVelocity/X
    and YVelocity/Y: per-frame velocity integration; bl object_freeMemory as the only teardown callee:
    object slot release on expiry'
