name: ai_stepRefreshSprite
address: '0x081096BA'
kind: function
status: probable
summary: AI step routine that only refreshes the object's sprite facing/arm each tick, used during teleport-style
  attack steps.
interface: (r0 = battle object) -> r0 = battleObject_refreshSpriteAndArm_800F2C6 result; no flags documented
details: 'The function is a bare wrapper: it calls battleObject_refreshSpriteAndArm_800F2C6 with the object
  pointer in r0 and returns, doing nothing else. Its only callers are AI attack-state step functions (ai_stepFinishMoveToPanel,
  ai_teleportToPanelStep) which invoke it as one of the per-tick step handlers while the enemy is warping
  to a highlighted panel, so it serves as the ''idle/refresh appearance'' step of those attack state machines.
  The callee updates the object''s sprite facing and arm position (player objects via a custom arm write,
  others via the tracked-arm table). No state fields are touched directly by this function itself.'
