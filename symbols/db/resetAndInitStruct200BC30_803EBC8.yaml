name: resetAndInitStruct200BC30_803EBC8
address: '0x0803EBC8'
kind: function
status: confirmed
summary: Resets the linked-list head at dword_200B1B0 and reinitializes the 0x20-byte state struct at eStruct200BC30,
  likely at scene/subsystem startup.
interface: void sub_803EBC8(void) — takes nothing meaningful from callers (r2/r3 are pass-through and preserved
  untouched); returns with r2/r3 intact; clobbers r0, r1, flags, lr
details: "Sequence of three steps:\n1. Loads the address of dword_200B1B0 (a word-sized list head / state anchor\
  \ in IWRAM) into r0 and\n   calls sub_803EF84, which presumably clears/resets that list head (typical \"init list\"\
  \ helper).\n2. Loads eStruct200BC30 into r0 with size 0x20 and calls ZeroFillByWord, wiping a 32-byte\n   struct\
  \ (8 words) at 0x200BC30.\n3. Calls sub_803EF60 with no arguments, which (re)initializes that same struct/subsystem\
  \ —\n   the readable-C note says sub_803EF60 is the owner of this state.\nThe 0x20-byte struct at 0x200BC30 and\
  \ the head at 0x200B1B0 belong to the same subsystem;\nthis function is the \"fresh start\" entry point for it.\
  \ Callers pass r2/r3 through unchanged,\nwhich suggests it is invoked from a generic init/update dispatch table\
  \ where r2/r3 carry\ncontext the dispatcher expects to survive the call.\nNo game-term meaning (npc, battle, sprite,\
  \ etc.) could be pinned down from this snippet alone,\nsince the callees' contents are not shown here.\n"
