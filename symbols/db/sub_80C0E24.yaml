name: sub_80C0E24
address: '0x080C0E24'
kind: function
status: confirmed
summary: On a battle-object's UPDATE action, if it represents a real Navi (ExtraVars == 2), initialize its sprite,
  palette, animation and related-objects from the underlying BattleNavi stats; otherwise just advance the state
  phase.
interface: void sub_80C0E24(battleObject *r5); // clobbers r0-r3, r6, r7, lr, flags; preserves r4
details: "- Reads RelatedObject1 (the underlying BattleNavi stats) and decodes its NameID via\n  unpackVerActorTyAndAIIdx_800F29C,\
  \ storing the result in oBattleObject_ExtraVars.\n- Only when ExtraVars == 2 (i.e. a real Navi) is the full init\
  \ performed:\n    * Looks up a chip class id via chip_class_lookup_800FC9E(stat_0x29, stat_0x2C / alliance)\n\
  \      and uses it (0x80) to load the sprite, its animation data, and apply a shadow.\n    * Sets bit 1 (HURT)\
  \ of oObjectHeader_Flags on the battle object.\n    * Copies 12 bytes from RelatedObject1 + 0x34 to the battle\
  \ object + 0x34.\n    * Runs sub_801002C on RelatedObject1 and applies its palette to the battle object.\n   \
  \ * Calls sub_8011420(stat_0x29, alliance, 1) on RelatedObject1.\n    * If alliance (stat_0x2C) != 0 and RelatedObject2\
  \ exists, marks it as a\n      follow-up sprite: Param3 = 1, OR 0x14 into its oObjectHeader_Flags.\n- Synchronizes\
  \ the sprite flip with object_getFlip / sprite_setFlip, then sets\n  oBattleObject_CurAnim = 3 + Param4 and forces\
  \ an anim refresh via\n  oBattleObject_CurAnimCopy = 0xFF.\n- Always writes CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized\n\
  \  and tails into sub_80C0EE2.\n- Uses push/pop around calls to preserve r5 (battle object pointer) across the\
  \ temporary\n  switch to RelatedObject1 (r5) needed to call the GetBattleNaviStatsByte helpers.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
