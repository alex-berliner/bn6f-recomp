name: aiAttack_spawnRandomElementFrontShotStep
address: '0x080EC490'
kind: function
status: probable
summary: 'Per-frame step of one player/AI attack state: on its first tick it spawns an attack object on
  the panel in front with a randomly chosen element and Damage+AttackBoost power, runs for a fixed charge
  length, and can be cancelled early by walking.'
interface: (r5 = battle object, r7 = object's oAIAttackVars) -> void; spawns attack object, may exit attack
  state
details: On first entry (AttackElement==0) it sets animation 0xE, clears AIData+0x68, sets object flag
  bit 22, writes AttackElement=4, ChargeCycles=4 (6-2) and StepTimer=0. When StepTimer reaches 1 it plays
  SFX 0xB9, rolls GetPositiveSignedRNG()&3 to index two 4-entry byte tables (dword_80EC5B0/dword_80EC5B4)
  for an element and a second parameter, and calls battle_SpawnObjectOnFrontPanel_800FAAC with element,
  Damage+AttackBoost and the table byte; it then also spawns a temp attack object (spawn_t1_0x5_tempAttackObject_80B8E30
  on r5+0x4C). StepTimer increments each frame; once it exceeds ChargeCycles, HitElement is set to 4 (attack
  spent/neutral marker). Each frame after tick 3, if object_canMove and the player holds a direction with
  a valid next panel, it clears RelatedObject1Ptr, frees the temp attack object via sub_80B8E58, exits
  the attack state, and starts a walking aiAttack via aiAttack_initVarsAndStart_80116AE with the cross-navi
  table byte and alliance faction. A branch after the spawn leaves an unreachable PlaySoundEffect(SONG_NO_MUSIC)
  call behind.
