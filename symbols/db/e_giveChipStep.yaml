name: e_giveChipStep
address: '0x0804A460'
kind: function
status: probable
summary: 'Per-tick step of a scenario effect: if a state byte equals 0x10, grants a chip via GiveChips
  and queues a return-to-overworld fade (EnterMapFadeParam1=0xC), returning 1; otherwise resets the effect
  state and acks the new-event flag, returning 0.'
interface: () -> r0 = 1 when the chip was granted and the exit fade was queued, 0 otherwise; no flag guarantees
details: 'Runs on a per-scenario-effect state struct eS200AC80 (fields +0x04/+0x06 hold chip id/code,
  +0x30 a dword). Each tick it first runs several effect-side helpers (sub_804A8F4, menuCopyBackgroundTiles_804A7C0,
  sub_804A9A0, sub_804AA58) and then checks IsScreenFadeActive: while a fade is active it abandons the
  current mode via next_exitToMap_811F728 and unlocks the player. If a state byte pointed to by r5 equals
  0x10 it takes the reward path: sub_804BD00 returns the chip id (r0, stored at +0x04) and code (r1, stored
  at +0x06), calls GiveChips with count=1, sets GameState EnterMapFadeParam1 to 0xC to trigger the exit
  fade, and returns 1. Otherwise it zeroes the struct fields, reinitializes/clears the scenario effect
  (scenario_initEffectState_8003962, zeroFill_8003AB2, scenario_ClearEffectActiveFlag_800399A) and acks
  the new-event flag, returning 0.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl GiveChips with r0/r1 from sub_804BD00 and mov r2,#1 — grants one chip, whose id/code were
    just stored at eS200AC80+4/+6; ldr r0,[r0,#oToolkit_GameStatePtr]; strb #0xC,[r0,#oGameState_EnterMapFadeParam1]
    then return 1 — queues the map-exit fade after the reward; beq loc_804A4CC after IsScreenFadeActive
    gates the whole handler on the screen fade state, returning 0 otherwise; bl scenario_ClearEffectActiveFlag_800399A
    / event_ackNewFlagByte_8003AEA / scenario_initEffectState_8003962 — deactivates the scenario effect
    and its event flag on the non-reward path; bl battle_resetEStructRecords_8046664 and bl next_exitToMap_811F728
    — tears down battle-overlay records and transitions back to the overworld map'
