name: battle_destroyObjectClearExtraVars_80D4464
address: '0x080D4464'
kind: function
status: confirmed
summary: 'Tears down a battle object: clears the first word of its extra-variable list, then destroys the object.'
interface: void sub_80D4464(r5 = battle object pointer); r5 passes through unchanged; clobbers r0-r3, lr, flags
details: 'Called with the battle object pointer in r5 (Thumb BL callers won''t set r5 directly, so callers

  arrange r5 before branching — typical of this codebase''s object routines that keep the object in r5).

  Loads the oBattleObject_ExtraVars field from the object, which is a pointer to the object''s

  extra-variable list, and stores 0 into the first word at that address (clearing the list head /

  first extra var). Then calls object_genericDestroy(r5) to run the generic object teardown.

  Returns with r5 still holding the object pointer, since the original never reloads or modifies it;

  callers can rely on that but likely don''t. This looks like the standard "destroy with extra vars"

  exit path for battle objects whose ExtraVars list must be reset before/while destruction happens.

  '
