name: battleObject_hasKeyItem
address: '0x08136364'
kind: function
status: probable
summary: Resolves a battle object from an r5-struct-driven index and returns whether the player owns the
  key item linked to that object (id = obj byte3 + 0x4F).
interface: (no r0 args; reads struct at r5 fields 0x38/0x3A) -> r0 = nonzero if CheckKeyItem(objId + 0x4F)
  is set; flags from tst
details: Computes r0 = [r5+0x3A] + [r5+0x38] (both halfwords, likely indices/counts) and calls sub_8136290
  with the sum, which returns a pointer whose halfword is loaded — an id/entry lookup. It subtracts 0x90
  from that halfword and passes the result to battleObject_getByIndex_813B780, fetching the 0x10-byte
  battle-object descriptor from StructArr_813944C. It reads byte 3 of that descriptor, adds 0x4F to form
  a key-item id, and calls CheckKeyItem, returning its result directly (tst then pop, so r0 is the boolean).
  No state is written; it is a pure ownership test. The 0x90 bias and +0x4F id offset suggest byte 3 of
  the descriptor is an object-kind code that maps to a fixed key-item range.
