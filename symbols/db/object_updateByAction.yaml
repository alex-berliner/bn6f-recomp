name: object_updateByAction
address: '0x080C2770'
kind: function
status: probable
summary: 'Per-frame battle object update: dispatches to one of three handlers based on the object''s current
  action, then advances its sprite animation.'
interface: (r5 = battle object) -> r0 = clobbered by callees; no meaningful return
details: Reads the object's oBattleObject_CurAction byte from the battle object struct in r5 and uses
  it to index a 3-entry thumb jump table (actions 0-2) at off_80C2788, branching to the matching handler
  with lr set to pc so handlers can return directly. After the handler returns it unconditionally calls
  object_updateSpriteTimestop to advance the object's sprite animation (respecting pause/time-stop) and
  then sub_80C2A3A. r5 holding the object pointer implies the caller iterates over battle objects; the
  action handlers at 0x080C2798/0x080C2854/0x080C29FC likely correspond to idle/acting states.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction] then ldr r1,[r1,r0] with off_80C2788 = 3-entry thumb dispatch
    table; bl object_updateSpriteTimestop immediately after the dispatched handler returns; mov lr, pc;
    bx r1 is a BLX-style tail-dispatch into per-action thumb handlers; only caller sub_80C2710 passes
    the object in r5, consistent with a battle object loop
  refs:
  - bn6f/asm/asm31.s:23106
  - 0x080C2710 sub_80C2710
  - 0x0801BBF4 object_updateSpriteTimestop
  - 0x080C2A3A sub_80C2A3A
  reproduce: python3 tools/asmcat.py 0x080C2770
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
