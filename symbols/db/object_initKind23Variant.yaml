name: object_initKind23Variant
address: '0x0811E914'
kind: function
status: probable
summary: Dispatches to one of three subtype initializers for 'kind 23' objects based on a subtype byte
  at entity+8.
interface: (r5 = entity*, uses r6 = eStruct2001010) -> never returns normally (bx+pop {pc}); dispatches
  via jump table
details: Loads a 3-entry Thumb-mode jump table (object_initKind23Entity, sub_811E980, sub_811E998), indexes
  it by the subtype byte at r5+8, and tail-calls the selected initializer. r6 is preloaded with the global
  eStruct2001010 pointer that the three callees expect. The pop-into-PC pattern means the chosen callee
  is expected to return on behalf of this dispatcher; in practice the callees likely tail-return to the
  real caller.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: ldrb r1, [r5,#8] reads the subtype byte from the entity struct at offset 8; off_811E928 holds
    three Thumb-mode function pointers (+1) for the three variants; mov lr, pc; bx r0 performs a tail-call
    through the selected table entry; pop {pc} in place of pop {lr}; bx makes this a one-shot dispatcher,
    not a real callee; r6 is set to eStruct2001010 before the bx, matching the ARM calling convention
    used by sibling eStruct-aware init routines
  refs:
  - bn6f/asm/asm32.s:35035
  reproduce: python3 tools/asmcat.py 0x0811E914
  result: 'proposed by minimax/MiniMax-M3, self_score 3; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-023329'
