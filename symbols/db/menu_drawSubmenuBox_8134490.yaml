open_questions:
- What 0xFF semantically means to the caller; the return is just held as a constant so it could be a "draw
  done" flag, a default palette id, or simply the leftover from a bl helper. Cross-referencing sub_81333A0's
  use of r0 after the call would settle it.
- The exact identity of the halfword at SubMenu+0x18; the submenu struct only declares 0x50/0x80 of named
  fields, so 0x18 is in the "Unk" region and could be a cursor/index, scroll offset, or animation phase.
  Watching how the captured snap files evolve between successive calls would confirm.
- Whether the GetCurPETNaviStatsByte(9) value is meant to be a "navi color" or a "selected folder reg";
  struct offset 9 of NaviStats is "RegUP" per the NaviStats.inc, which is unusual to use for a submenu
  palette, so this is the most likely misread in the chain (sub_812053C may mask/shift it down before
  use).
