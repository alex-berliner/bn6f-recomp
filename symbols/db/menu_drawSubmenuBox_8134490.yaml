name: menu_drawSubmenuBox_8134490
address: '0x08134490'
kind: function
previous_names:
- sub_8134490
status: probable
summary: Draws a submenu's two side border strips (with blank-fill inside) and dispatches a per-state
  palette/VRAM word for the submenu widget, varying the strip layout and palette id by submenu state and
  current submenu-vs-no-submenu branch.
interface: '(r5 = *SubMenu, r10 = *Toolkit) -> r0 = 0xFF ; side effects: writes tilemap blocks via CopyBackgroundTiles
  and queues a sub_812053C dispatch'
details: "- Saves callee-saved {r4-r7,lr}; mirrors r5 into r7 so the SubMenu pointer survives across the\
  \ two helper calls.\n  - Calls submenu_isOpen_81355D8; if a submenu (other than 0x20) is open, picks\
  \ palette index 0x07 + tile-block style \"submenu open\" (sub_81202FC with r0=7, r2=0xB, r3=1, r4=0xF),\
  \ otherwise reads the SubMenu state byte at r7+0x0C and runs sub_8120348 with the same fixed params\
  \ (the routine name implies blank-fill of two spans of a tilemap with the text-box tile).\n  - Then\
  \ computes r2 = sign-extended halfword at r7+0x18 (a \"current item index\" or \"scroll offset\" stored\
  \ alongside the SubMenu state at offset 0x18) and uses CopyBackgroundTiles to blit tile ids from unk_20347D8\
  \ into background tile block 2, with j = 0xB - r2, i=2, j_size=0xF, i_size=2. This carves a left/right\
  \ border column of width 2 and a variable horizontal offset.\n  - Second tilemap: dispatches sub_81202FC\
  \ with r0=0xA, r1=unk_2034814, r2=0xB, r3=0xC, r4=0x14, then a symmetric CopyBackgroundTiles where j\
  \ = 0x1F - r2, i=2, j_size=0x14, i_size=2 from unk_2034814 into tile block 2. This produces the right-side\
  \ strip of the submenu box.\n  - Picks a palette id: 0x1E if a non-main submenu is open, else queries\
  \ the current PET Navi and reads a byte at offset 9 of the NaviStats struct (GetCurPETNaviStatsByte(9)\
  \ -> most likely a \"selected navi color index\" since offset 9 is RegUP/folder2 reg; here 0x1E is the\
  \ fallback palette when no submenu is open).\n  - Computes r1 = r2 << 19 (r2 is the sign-extended halfword\
  \ at r7+0x18, scaled into a stride/offset), r2 = 0xC20016 - r1, and dispatches sub_812053C with r1=0x8160,\
  \ which the callee description says produces a \"low 0x4000-flagged VRAM/palette-ish word\". Effectively\
  \ this enqueues a per-state palette/animation parameter for the submenu widget, offset by the current\
  \ submenu index halfword.\n  - Returns r0=0xFF (this value is written through lr-pop into r0 and is\
  \ also what the captured exits show); the function is otherwise void-like but the captured r0=0xFF is\
  \ consistent across all 40 calls, so the caller (sub_81333A0's submenu state dispatcher) consumes that\
  \ 0xFF.\n  - Uses unk_20347D8 and unk_2034814 as paired tilemap-data scratch blobs; the 0xF (15) and\
  \ 0x14 (20) widths plus 0xB and 0xC heights match the visible submenu box geometry (left and right borders)\
  \ of a 0x11x0xD area centered on the screen.\n"
