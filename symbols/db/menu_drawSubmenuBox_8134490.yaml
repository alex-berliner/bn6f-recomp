  detail: '- `mov r7, r5; push {r4-r7,lr}` at 8134490 and `ldrsh r2, [r7,#0x18]` show r5 (incoming SubMenu
    ptr) is preserved and a halfword at SubMenu+0x18 is read; both CopyBackgroundTiles calls consume r2
    via `mov r1, r2; sub r0, r0, r1`. - First branch `beq loc_81344AA` after `bl submenu_isOpen_81355D8`
    selects between sub_81202FC and sub_8120348 with identical r2/r3/r4 but r0=7 vs `ldrb r0, [r7,#0xC]`;
    this is exactly "open-submenu blank fill vs idle-state fill" behaviour. - Two `bl CopyBackgroundTiles`
    calls with the same r3 tile-id source, r2=2 tileBlock32x32, but different r1 source ptrs (unk_20347D8
    vs unk_2034814) and mirrored j offsets (0xB - r2 vs 0x1F - r2) carve symmetric left/right strips around
    the submenu box. - Second submenu-open check after the tilemap blits chooses r0=0x1E vs `GetCurPETNaviStatsByte(9)`;
    combined with the 0x8160 dispatch in sub_812053C, the value flows into a VRAM/palette word whose 0x13-bit
    shift aligns with a "submenu widget palette slot". - Captured r0=0xFF on exit is uniform across 40
