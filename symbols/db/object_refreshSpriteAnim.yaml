    + shadow off; ldrb r0,[r5,#4]; cmp #3; beq skip and ldrb r0,[r5,#5]; tst; bne skip — state/type gates
    the extra call; bl sub_81170AC only in the fall-through case — conditional extra update, callee unknown'
