name: object_refreshSpriteAnim
address: '0x08116F60'
kind: function
status: probable
summary: 'Refreshes an object''s sprite: selects animation index 1 when +0xe is zero else 0, reloads animation
  data, clears the shadow, and only calls sub_81170AC when +4 != 3 and +5 == 0.'
interface: (r5 = object pointer, no r0 argument) -> r0 clobbered; flags clobbered by calls
details: Reads the 16-bit field at [r5+0xe] and passes 1 to sprite_setAnimation if it is nonzero, else
  0, so the flag selects between two animation indices. It then reloads the sprite's animation data via
  sprite_loadAnimationData and clears the shadow via sprite_noShadow, so this looks like a re-initialization/refresh
  of an object's visuals rather than a per-frame tick. Finally it skips sub_81170AC when [r5+4] (byte)
  equals 3 or when [r5+5] (byte) is nonzero, suggesting +4 is an object type/state where 3 means 'skip'
  and +5 a boolean that also suppresses it. r5 is a global or caller-set object pointer, not a stack argument.
  The purpose of sub_81170AC is unknown, so the tail of the function's role is only partially characterized.
