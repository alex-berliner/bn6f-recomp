name: battle_customGaugeResetGfxAndRequest
address: '0x0801DEEE'
kind: function
status: probable
summary: End-of-turn handler that empties the custom gauge, reloads its gauge tile graphics into VRAM,
  and posts request 0x20 to refresh the gauge display.
interface: () -> r0 = request id passed to dispatcher; calls ClearCustGauge, queues GFX transfer, ORs
  bit 0x20 into eStruct2035280 request dword.
details: Called only from battle_customGauge_EndTurn_8027D78 when a turn ends. It first calls ClearCustGauge
  (0x0801DF92) to zero the gauge progress counter and clear its flags. Then it queues a DMA-style copy
  of 0x380 bytes from ROM dword_86E489C to VRAM 0x600c440 — evidently the full/empty gauge tile images
  — via QueueEightWordAlignedGFXTransfer. Finally it sets request bit 0x20 in the eStruct2035280+0x40
  dword and dispatches request id 0x20 through dispatch_801DA48, which presumably redraws/updates the
  on-screen custom gauge for the new turn.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl ClearCustGauge then GFX queue src=dword_86E489C dst=0x600c440 size=0x380: gauge cleared
    and its graphics reloaded; dest 0x600c440 and size 0x380 are OAM-adjacent VRAM tile data consistent
    with gauge UI tiles; mov r0,#0x20 / bl eStruct2035280_SetRequestBits_801BECC then dispatch_801DA48
    with r0=0x20: posts and runs the gauge refresh request; sole caller battle_customGauge_EndTurn_8027D78
    runs this on end-of-turn, matching gauge reset semantics'
