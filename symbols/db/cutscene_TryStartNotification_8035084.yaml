name: cutscene_TryStartNotification_8035084
address: '0x08035084'
kind: function
status: confirmed
summary: Attempts to launch the "notification" cutscene, returning 0 if it started or 1 if skipped.
interface: u32 cutscene_TryStartNotification_8035084(void); // returns 0 = notification cutscene started, 1 = not
  started
details: 'Gate function that triggers the notification cutscene. First calls

  IsNotSlipRunningAndNotInCutscene; if it returns zero (Slip effect running OR a

  cutscene is already active) it bails out and returns 1. Otherwise it calls

  sub_8035756, which appears to fetch the pending notification: a nonzero return

  value (the notification kind/id) is passed as the parameter to StartCutscene

  together with the CutsceneScript pointer at CutsceneScriptNotification_8098BB8,

  and the function returns 0. If there is no pending notification (sub_8035756

  returned 0), it returns 1 without starting anything. r0 is the only meaningful

  output; the other listed registers are incidental to the caller analysis.

  '
