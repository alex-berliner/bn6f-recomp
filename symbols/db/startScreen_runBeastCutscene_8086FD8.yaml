name: startScreen_runBeastCutscene_8086FD8
address: '0x08086FD8'
kind: function
status: confirmed
summary: Per-tick dispatcher for the Giga Beast (BBS) cutscene during start-screen transitions, routing by BBS request
  code or event-flag priority to pick and launch the correct cutscene script, then running cleanup once the flag
  is already set.
interface: void startScreen_runBeastCutscene_8086FD8(BeastCutsceneState* state /*r5*/, Toolkit* toolkit /*r10*/,
  u32 r2_sfxVolume); /* r5 preserved */
details: 'The state struct (r5) holds: byte 1 = re-entry latch (0 on first tick, non-zero after a cutscene was queued),
  byte 5 = BBS variant index, byte 7 = variant index (duplicate?), byte 9 = seen-already marker, byte 0xC = BBS-request
  offset from 0xB0.

  First invocation (byte 1 == 0): queries reqBBS_81409F4 for the current BBS request code. If the code falls in
  [0xB0, 0xC0) the offset is stored and npc_checkStateEventFlag_80871C0 together with event flag 5F2 selects between
  two scripts (byte_8086D5C or byte_8086D74). Outside that range the function walks a priority ladder over flags
  5F1, 5F3, 5F4: 5F1 → marks byte 9, launches script byte_8086D2C+4; 5F3 → marks bytes 5,7, sets latch byte 1, clears
  5F3, sets 5F2, launches off_8086D1C+4; 5F4 → marks bytes 5,7 = 2, clears 5F4, launches off_8086D1C+4; none set
  → returns without action.

  Subsequent invocation (byte 1 != 0): clears the latch, reads the GameState (via toolkit → oToolkit_GameStatePtr)
  for map group / number. Map group 0x85 uses flag FC0; map groups < 0x85 use flags 5E1/5E2/5E3 keyed to map numbers
  0/1/≥2. If the flag is already set the cleanup path runs (optional SFX 0x23 when map group is 0x81, then sub_8086F18
  and spawn_spawnObjectSwarm). If not yet set the flag is recorded and the per-location cutscene script is launched
  via StartCutscene.

  All cutscene script pointers are offsets into byte arrays in the 0x8086D1C–0x8086D74 and 0x8086340–0x8086460 regions.
  The function is called each tick while the start screen is active; the latch byte ensures the one-shot setup runs
  only once.

  '
