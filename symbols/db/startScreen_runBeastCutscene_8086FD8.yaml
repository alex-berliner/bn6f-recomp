name: startScreen_runBeastCutscene_8086FD8
address: '0x08086FD8'
kind: function
previous_names:
- sub_8086FD8
status: probable
summary: Picks a beast-out / beast-sp intro cutscene based on result code, story flags, and current map,
  then calls StartCutscene
interface: (r5 = *ReqBBSGui-ish state byte, r10 = *Toolkit, r2 = ?, lr = return) -> (void) ; may start
  a cutscene, set state bytes in r5, toggle event flags
details: "Reads [r5+1] as a state byte. If it is non-zero the function jumps to a different branch\n \
  \ (loc_8087068) that sets [r5+1] = 0, looks at the current map via Toolkit->GameState->MapGroup/MapNumber,\n\
  \  and either starts a beast cutscene (MapGroup 0x85 + EVENT_FC0, or MapNumber 0/1/other + EVENT_5E1/5E2/5E3)\n\
  \  or, when the map is 0x81, calls sub_800060A with arg 0x23, then runs sub_8086F18 and sub_8086F5C.\n\
  \  If [r5+1] is zero, calls reqBBS_81409F4 and inspects r0: 0xB0..0xBF are treated as a beast-out index\n\
  \  written to [r5+0xC] and dispatched via sub_80871C0 -> StartCutscene of one of two byte_8086D5C/8086D74\n\
  \  scripts, gated by EVENT_5F2. Values outside that range branch on EVENT_5F1/5F3/5F4: 5F1 sets [r5+9]=1,\n\
  \  5F3 sets [r5+5]=[r5+7]=[r5+1]=1, clears 5F3, sets 5F2 and starts byte_8086D1C+4; 5F4 sets [r5+5]=[r5+7]=2,\n\
  \  clears 5F4 and starts byte_8086D1C+4 again. Most paths converge on StartCutscene via loc_80870F2.\n\
  \  The contract shows only r5 in `out`, so the function is effectively void from a caller's POV.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r5,#1]; cmp r0, #0; bne loc_8087068` shows the two-entry dispatch on a state byte
    at +1 of r5. - `bl reqBBS_81409F4; cmp r0, #0xc0; bge loc_8086FF4; cmp r0, #0xb0; blt loc_8086FF4`
    defines the 0xB0..0xBF "beast index" range; `sub r4, r0, #0xb0; strb r4, [r5,#0xc]` stores the offset.
    - `movflag EVENT_5F3; bl TestEventFlagFromImmediate` followed by `ClearEventFlagFromImmediate EVENT_5F3`
    / `SetEventFlagFromImmediate EVENT_5F2` and `ldr r0, off_80870F8 // =off_8086D1C+4` shows the cutscene-script
    pointer coming from a data table. - `ldr r0, [r10, #oToolkit_GameStatePtr]; ldrb r1, [r0, #oGameState_MapGroup];
    cmp r1, #0x85` shows the map-based dispatch reading Toolkit->GameState. - Many paths land in `loc_80870F2:
    bl StartCutscene`, confirming this function''s job is to choose and start a cutscene. - Caller is
    sub_8086EA8 which itself lives near other ReqBBS / BBS beast-state code (reqBBS_81409F4, sub_8086F18/8086F5C/80871C0);
    r5 has the layout of a ReqBBS state struct (ReusableSubsystem frame at +1).'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08086FD8

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: beastsp, maps'
  reproduce: 'grep -l ''^08086fd8 '' tools/traces/coverage/*.prof

    '
  result: beastsp, maps
open_questions:
- Exact role of the [r5+1] state byte (BBS frame inited?) and what each EVENT_5Fx branch represents narratively
  (beast-out variants vs. pre-beast tutorial vs. post-beast). Settle by reading the cutscene scripts at
  byte_8086D1C+4 / byte_8086D2C+4 / byte_8086D5C / byte_8086D74 and matching their text against known
  BN6 beast-out dialogue.
- Whether sub_800060A(0x23) and the post-StartCutscene helpers (sub_8086F18/8086F5C) are part of the same
  flow or an unrelated tail.
