open_questions:
- No caller is known, so the structure at r5 (task control block?) and the meaning of its +2/+0xD bytes
  are inferred
- Exact semantics of IsScreenFadeActive's ZF return (fade active vs inactive) — the branch direction implies
  the teardown runs on one specific fade state
- What the record at 0x200BC30 represents (wireless connection state?) and why its first byte gates the
  RFU stop
