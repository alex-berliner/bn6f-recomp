name: battle_frameUpdateAndStopRfuAfterFade
address: '0x0812956C'
kind: function
status: probable
summary: Per-frame battle-side update that runs all entity and sprite updates, then once the screen fade
  has finished marks its task state done and shuts the wireless adapter down.
interface: '(r5 = task/state struct: +2 state byte, +0xD done flag; r0 = scratch) -> void'
details: Each call first advances the battle simulation (entity_runAllUpdateHandlers over the 15 eStruct
  records) and redraws sprites (battle_updateEStructSprites). It then checks IsScreenFadeActive; once
  the fade condition is met it writes 0 to r5+2 (reset/set state byte) and 1 to r5+0xD (a done/exit flag
  for the owning task). It reads the first byte of the record at EWRAM 0x200BC30 via eStruct200BC30_getJumpOffset00;
  if nonzero (a wireless connection/RFU session is active) it issues rfu_REQ_stopMode and waits for the
  request to complete. The r5 fields suggest this is registered as a task/scene callback rather than called
  directly. Presence of the RFU teardown indicates this is the wireless-battle (or wireless trade) scene's
  frame update, cleaning up the adapter on exit.
