summary: Writes a pair of bytes (likely x/y coordinates) into the beast-spread struct eStruct2001010 at
  offsets 0x14/0x15.
interface: (r0 = first byte, r1 = second byte) -> r0 = ?; no flags set
details: The function loads the pointer to eStruct2001010 and stores r0 and r1 as bytes into offsets 0x14
  and 0x15, then returns. Adjacent byte-sized fields in this struct suggest a coordinate pair used by
  the beast-spread map-object system. Its only known caller, beast_spawnObjectsAndSetup_8141F7C, works
  with per-MapGroup beast-spread config and spawns overworld map objects, so these two bytes most likely
  record the position at which the spread objects are placed. The function ignores r4-r7 it saves; the
  stores are plain byte writes with no clamping or validation.
