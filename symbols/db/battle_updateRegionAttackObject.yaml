name: battle_updateRegionAttackObject
address: '0x080E55E0'
kind: function
status: probable
summary: Per-frame state dispatcher for delayed region-attack battle objects, jumping to a handler based
  on the object's CurAction.
interface: (r5 = battle object) -> tail-jumps to state handler; no return value of its own
details: Reads oBattleObject_CurAction (byte at [r5,+CurAction]) and uses it to index the table at off_80E55F4,
  then performs a manual tail call (mov lr, pc; bx r1) to the selected state handler. State 0 = battle_waitScreenFadeEnd
  (object idles until the battle-intro/fade finishes), state 1 = battle_updateDelayedRegionAttackObject
  (main delayed panel-attack logic), state 2 = sub_80E566C (unknown third state, likely cleanup/destruction).
  r1 is loaded via a pointer-table indirection (off_80E55F0 points at off_80E55F4) rather than directly,
  so the table address is data-driven. The two trailing zero bytes are padding between this thunk and
  the table.
