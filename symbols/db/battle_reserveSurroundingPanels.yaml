name: battle_reserveSurroundingPanels
address: '0x08102CA0'
kind: function
status: probable
summary: Reserves the 8 panels around an object's tile, using a table of signed x/y offsets.
interface: (r5 = object whose tile coords are at +0x12 (x) and +0x13 (y)) -> r0 clobbered; reserves each
  adjacent panel via object_reservePanel
details: Loops 8 times over a table of 8 two-byte entries at byte_8102CE8, reading each entry as two signed
  bytes (dx, dy). Each iteration re-reads the object's tile coordinates from r5+0x12/+0x13, adds the current
  dx/dy, and calls object_reservePanel to claim that panel for the object. Eight offsets around a center
  point is the 8-neighbour ring, so this marks every panel adjacent to the object's tile as reserved.
  The object pointer arrives in r5 (callee-saved), so the caller sub_8102C38 must set it up before the
  call; the function itself never validates r5.
