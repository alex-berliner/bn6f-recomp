name: object_despawnAfterTimerPhase
address: '0x080CF030'
kind: function
status: probable
summary: Battle-object phase handler that plays anim 2 for 15 frames, then removes the object's collision
  region and destroys it.
interface: (r5 = battle object) -> void; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to
  CUR_STATE_DESTROY when done
details: Runs per-object with the object in r5. On phase 0 it advances CurPhase to 4, sets CurAnim to
  2 and Timer to 0xF, i.e. starts a short 15-frame animation. On later entries it decrements Timer; once
  it reaches 0 it calls object_clearCollisionRegion so the object no longer participates in collision,
  then writes CUR_STATE_DESTROY to the combined state/phase field, which makes the engine run the object's
  destroy path. The pattern is typical for effects or projectiles that linger briefly (anim 2 likely a
  fade-out/disappear animation) before self-despawning.
