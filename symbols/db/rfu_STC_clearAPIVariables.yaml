name: rfu_STC_clearAPIVariables
address: '0x0814935C'
kind: function
status: confirmed
summary: Resets the wireless-adapter (RFU) API state, including its link-state and work blocks, slot table, and
  status halfwords, with interrupts disabled.
interface: void rfu_clearAPIVariables(void); returns r2=4, r3=0; clobbers r0,r1,flags
details: "Saves and restores IME around the routine so it runs with interrupts masked.\nUses SWI_CpuSet twice as\
  \ a 16-bit fill (0x01000000 mode bits) sourced from a\n2-byte scratch slot on the guest stack (SP -= 4 / SP +=\
  \ 4):\n  - 40-byte (20 halfwords) clear of the link-state block behind dword_2010CC4,\n    after which bit 3 of\
  \ byte 0 of that block is restored from the value that\n    was there before the wipe.\n  - 180-byte (90 halfwords)\
  \ clear of the API work block behind dword_2010CC0.\nAfter the memsets it re-seeds a few header bytes:\n  - [work_block]\
  \ + 9 = 4\n  - [link_state_block] + 6 = 0\n  - [work_block] + 0 = 0xFF\nCalls rfu_clearAllSlot to release every\
  \ slot in the link-state block, then\nwrites 0 to [link_state_block] + 9, and loops i = 0..3 clearing the four\n\
  status halfwords at [link_state_block] + 0x12 + 2*i (the block pointer is\nre-loaded from dword_2010CC4 every\
  \ iteration, matching the original).\nSaves/restores r4-r8 and uses lr only for the return; r2/r3 left in the\n\
  return path are 4 and 0 (loop-trip count and zero fill value), not meaningful.\n"
