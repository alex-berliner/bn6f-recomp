name: ai_attackSpawnEffectStep
address: '0x080F5D74'
kind: function
status: probable
summary: 'AI attack state machine: winds up (animation + sound), then on frame 5 of the timer spawns the
  attack effect two panels in front of the enemy and marks the hit element when the timer runs out.'
interface: (r7 = battle object's oAIAttackVars, r5 = battle object) -> r0 = destroyed; updates oAIAttackVars_AttackElement,
  _StepTimer, _HitElement
details: 'On the first invocation (AttackElement == 0) it commits the attack: stores element 4 into AttackElement,
  sets the battle object''s current animation to 0x14, plays sound effect 0xC7, and loads StepTimer with
  10. On subsequent invocations it decrements StepTimer; when it reaches 5 it calls sub_80F622A and battle_spawnEffectInFrontOfSelf
  to place the actual attack effect on the panel two ahead, and when it hits 0 it stores 0x14 into HitElement,
  presumably telling the hit/damage code which element the attack carries. It is a per-frame ''step''
  handler of the generic AI attack framework rather than a standalone attack.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — first-entry vs. in-progress attack branches
    (sub_80F5D74 start); mov r0,#0x14; strb r0,[r5,#oBattleObject_CurAnim] plus PlaySoundEffect(0xC7)
    — wind-up animation and sound; cmp r0,#5; beq loc_80F5DA4 followed by bl battle_spawnEffectInFrontOfSelf
    — attack effect fires 5 frames in; cmp r0,#0; bgt ...; mov r0,#0x14; strh r0,[r7,#oAIAttackVars_HitElement]
    — end of attack sets hit element; callee battle_spawnEffectInFrontOfSelf spawns a type-4 effect on
    the panel two steps in front of the acting battle object
