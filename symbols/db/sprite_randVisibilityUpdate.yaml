name: sprite_randVisibilityUpdate
address: '0x08116F9C'
kind: function
status: probable
summary: Per-frame updater that drives a randomized sprite flicker/visibility effect for an object, conditionally
  resetting its state byte when a menu/chat state is active and the sprite is near the top of the screen.
interface: (r0 = unused at entry; r5 = object context, [r5,#0xe] = mode/flag halfword) -> r0 = clobbered;
  no meaningful return; writes object state byte [r5]
details: 'Reads halfword [r5,#0xe]; if it is nonzero the object state byte [r5] is set to 0xA3, otherwise
  to 1. Calls sub_81170AC (r5-based helper), then passes [r5,#0xe] to sub_81170C0, which draws twice from
  BIOS PRNG and applies the resulting visibility mask to the sprite via sprite_setUnk0x2c — i.e. the sprite
  is randomly shown/hidden each frame. It then reads the sSubmenu state byte: when it equals 0x18 or 8
  it calls sprite_getCoordinates, and if the returned coordinate is < 0x38 it forces [r5] back to 1. Likely
  a weather/ambient or concealment flicker effect on overworld maps, but the exact object and meaning
  of state 0xA3 are unconfirmed.'
