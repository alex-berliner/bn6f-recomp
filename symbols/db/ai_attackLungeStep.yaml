name: ai_attackLungeStep
address: '0x080FA708'
kind: function
status: probable
summary: 'AI attack state step: moves the object onto a reserved panel next to/beneath the target, pauses
  4 ticks, then triggers the attack (or aborts if it can''t move).'
interface: (r5 = battle object, r7 = AI attack vars struct) -> r0 = 1 if the lunge panel was claimed,
  else 0; updates oAIAttackVars state
details: On first invocation (AttackElement == 0) it sets AttackElement = 4 and checks object_canMove;
  if blocked it clears HasMoved and calls object_exitAttackState. Otherwise it indexes byte_80FA770 by
  Alliance*8 to load two per-side parameters and calls the PanelChooseCallback (called via bx with lr=pc),
  which returns a panel X/Y in r0/r1; failure (r0==0) also aborts via exitAttackState. On success it stores
  FuturePanelX/Y on the object, claims the panel with object_reservePanel, sets OBJECT_FLAGS_CANNOT_SLIDE
  on its CollisionData flags, plays anim 4, zeroes AiAttackParam, sets HasMoved=1 and StepTimer=4. On
  later invocations it decrements StepTimer, and when it reaches zero sets HitElement=4, handing control
  to the next attack stage.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] / strb #4 acts as a state latch: init pass vs. countdown
    pass; bl object_canMove + beq loc_80FA760 (clear HasMoved, object_exitAttackState) aborts when the
    object cannot act; callback via [r7,#oAIAttackVars_PanelChooseCallback] returns panel coords stored
    to oBattleObject_FuturePanelX/Y before object_reservePanel; mov r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl
    object_setFlag1 marks the claimed panel non-slidable while lunging; StepTimer=4 then decrement-and-bgt,
    on expiry strh #4 to oAIAttackVars_HitElement fires the attack'
