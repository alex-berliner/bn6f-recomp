name: ow_drawBgTilesSetDrawnFlag
address: '0x0801E376'
kind: function
status: probable
summary: Copies an 8x2 block of background tiles to position (j=0xB, i=0) in tile block 3 from the table
  at byte_801EE78, then marks that section as drawn in eStruct2035280's flag word.
interface: () -> void; sets bit 11 of the flag word at eStruct2035280+0x44 (returned in r2 by the callee)
details: Takes no arguments; it hardcodes a CopyBackgroundTiles call with j=0xB, i=0, tile block 3, a
  tile-id list at byte_801EE78, and dimensions 8x2 (r4=8, r5=2). After the copy it calls flagSetBits_eStruct2035280_801BEB8
  with 1<<11, so bit 11 of the +0x44 flag word records that this background piece was drawn. The r4/r5
  registers are dead after the bl, consistent with them being size parameters only. The pattern of 'copy
  tiles then set a drawn flag' suggests a one-time background decoration drawn conditionally by an unseen
  caller that checks the same bit. With no known caller, the exact which screen/scenario context is unknown.
