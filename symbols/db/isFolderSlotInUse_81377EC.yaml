name: isFolderSlotInUse_81377EC
address: '0x081377EC'
kind: function
status: confirmed
summary: Looks up which of the 3 in-use folder-slot entries (at unk_20018EC) holds a given folder slot,
  returning its index, or 3 if the slot is not in use.
interface: int folder_findSlotInUseIndex(u32 packedChipData /* slot in high nibble of r0 */); // returns
  0-2 = matching entry index, 3 = not in use; also leaves r2 = last compared entry's slot nibble, r3 =
  table address
details: 'Takes packed chip data in r0 and treats the high nibble (r0>>4) as a folder slot number. Scans
  the 3-byte in-use table at IWRAM unk_20018EC (0x20018EC); each byte stores a slot number in its high
  nibble. Returns the index (0-2) of the first entry whose slot nibble matches, or 3 if none of the 3
  entries use that slot, so callers can treat 3 as "no match"/free. The table likely tracks the chips
  currently loaded into the battle''s three chip-hand slots (e.g. first chip plus regular/megachip selection),
  keyed by folder slot so a chip can be located or marked used. Quirks: search stops at index 3 even on
  match at the loop''s last iteration is impossible (loop bound is i<3), so index 3 doubles as the not-in-use
  sentinel; the match is on the high nibble only, so the low nibble (likely the chip''s selected-count/status
  bits) is ignored. Clobbers r0-r3 and flags, preserves nothing, returns via popped lr.'
