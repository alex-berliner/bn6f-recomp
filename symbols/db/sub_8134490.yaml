open_questions:
- 'Exact role of `r5`: the `0x18` offset doesn''t map to any obvious field in BattleObject/SubMenu; it could be
  a submenu/state struct held in r5 by the caller sub_81333A0 / sub_813399C.'
- The two unk_ buffers (unk_20347D8 / unk_2034814) aren't defined anywhere I can see — they likely hold tile-id
  arrays for the chip slots (one per row).
- What the `0xC20016 / 0x8160` constants and the `r0=0x1e`/NaviStats[9] discriminator correspond to (a base tile
  id? a palette bank?) would need a cross-ref into the tile-asset tables.
- Whether this is the *chip-select* row rather than e.g. a generic "draw chip-curve panel" — the captured-call names
  ("battles1") and the per-column shift strongly suggest chip selection, but I haven't confirmed by cross-referencing
  the unk buffers' tile ids.
