name: ai_dashAttackChargeTick
address: '0x0810B1F4'
kind: function
status: probable
summary: Charges an AI dash attack; on the final charge tick, teleports the attacker to the target panel
  and starts the hit.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 8 stored to HitElement when charge completes;
  flags from charge decrement (Z for done)
details: Decrements oAIAttackVars_ChargeCycles in the r7 AI-attack-vars struct; if nonzero, returns immediately.
  On reaching zero it calls ai_spawnDashEffect to spawn the dash illusion object at the attacker's position/facing,
  copies oAIAttackVars_TargetPanelX/Y into the battle object's PanelX/PanelY (teleporting it to the target
  panel), then refreshes pixel coordinates via object_setCoordinatesFromPanels and syncs collision/facing
  via object_updateCollisionPanels. Finally calls sub_810B244 (unknown, likely the dash-hit/movement step)
  and writes 8 into oAIAttackVars_HitElement, probably marking the incoming hit type/state. The zero flag
  from the decrement doubles as the 'charge finished' condition.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh r0,[r7,#oAIAttackVars_ChargeCycles]; sub/decr/bne — per-frame countdown until zero; bl
    ai_spawnDashEffect — spawns the dash effect/illusion when charging finishes; strb target panel X/Y
    into oBattleObject_PanelX/PanelY then object_setCoordinatesFromPanels — attacker relocates to target
    panel; mov r0,#8; strh into oAIAttackVars_HitElement — marks the resulting hit state/type; bl sub_810B244
    — follow-up step of the dash (body of attack unknown)
