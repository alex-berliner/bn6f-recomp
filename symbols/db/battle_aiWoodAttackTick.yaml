name: battle_aiWoodAttackTick
address: '0x080F0990'
kind: function
status: probable
summary: 'Runs a wood-element AI attack: arms element/anim/30-frame timer on the first call, then counts
  down and ends the attack.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 clobbered; no meaningful return; flags from
  timer decrement
details: On entry it checks oAIAttackVars_AttackElement; if zero, it writes element 4 (wood) into AttackElement,
  sets oBattleObject_CurAnim to 0x13 and oAIAttackVars_StepTimer to 0x1e (30 frames), and returns. On
  every subsequent call it decrements StepTimer; while positive it just returns. When the timer expires
  it clears oBattleObject_CurAnim to 0 and calls object_exitAttackState, returning the object to its normal
  state. The two-phase structure (init on AttackElement==0, tick afterwards) is the standard pattern for
  these oAIAttackVars attack routines.
