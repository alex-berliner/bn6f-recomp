    call (init phase); strh #0x1e into oAIAttackVars_StepTimer gives the 30-frame attack duration; decrement
    of StepTimer with bgt keeps the attack alive until the timer expires; bl object_exitAttackState after
    clearing CurAnim=0 ends the attack state'
