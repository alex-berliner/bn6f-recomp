name: logoScreen_dispatch_803D1CA
address: '0x0803D1CA'
kind: function
status: confirmed
summary: Logo screen state-machine tick — dispatches the current LogoScreenState handler, then animates the "PRESS
  START" text.
interface: void logoScreen_tickState_803D1CA(void) /* uses eLogoScreenState singleton; r4-r7 preserved; r0-r3,r12,clobbers
  */
details: 'Per-frame update for the logo screen. Loads the state index byte from eLogoScreenState+0 (oLogoScreenState_Index_00)
  and uses it directly as a byte offset into the handler table at off_803D1E4 (no shift — the field stores raw offsets
  0x00/0x04/0x08/0x0C/0x10, not 0..4). Dispatches via `mov lr, pc; bx r0`, so each handler receives its own Thumb
  table entry in r0, the raw state offset in r1, and the eLogoScreenState pointer in r5; r0/r1 from the handler
  carry into the following call. After the state handler, always calls startScreen_AnimatePressStart_803E938 to
  blink/animate the "PRESS START" text. States: 0x00 init/fade-in (sub_803D1FC), 0x04 (sub_803D24C), 0x08 (sub_803D274),
  0x0C (sub_803D298), 0x10 finish — hands control back to the scene manager (logoScreen_finish_803D2A6). r4-r7 saved/restored
  around the calls.

  '
