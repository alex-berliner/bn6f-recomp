summary: Redraws a two-layer scrolling background (30x20 base layer plus a horizontally parallax-scrolled 60x17
  layer) into tile block 1, then runs the follow-up update routine.
interface: void bg_redrawScrollingLayers_8133E88(struct BgState* bg /* in r5, scroll x at +0x18 */)
details: 'Expects the background state struct pointer in r5 (copied to r7 for the callees). First call to CopyBackgroundTiles
  stamps the full base layer: j=0, i=0, tile block 1 (which_tile_block_32x32 = 1), tile ids from unk_201CA20, 0x1E
  (30) by 0x14 (20) tiles — exactly one full GBA screen. Second call stamps the parallax/overlay layer from unk_2020A20
  at j = -(s16)[r5+0x18] (scroll offset read as a sign-extended halfword), i = 2, same tile block, 0x3C (60) by
  0x11 (17) tiles — wider than the screen so the horizontal scroll value slides it. Finally calls sub_8134138 to
  finish the update (likely DMA/commit of the tile block). Preserves r4-r7; the struct pointer must also survive
  in r5 since it is returned in r5. The trailing .byte data after the pop is literal pool padding, not code.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
