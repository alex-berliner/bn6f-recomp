summary: Zero-fills the 52-byte work buffer at 0x2000FA0 (0x1A halfwords) by delegating to ZeroFillByHalfword.
interface: void clearWorkArea_2000FA0(void) — tail-calls ZeroFillByHalfword(word_2000FA0, 0x1A); r2/r3 pass through
  untouched, returned flags (v) and r3 are whatever ZeroFillByHalfword produces
details: Pushes lr, loads the address word_2000FA0 (0x2000FA0) into r0 and a halfword count of 0x1A (52 bytes) into
  r1, then bl's ZeroFillByHalfword to wipe the buffer, returning via pop {pc}. The caller contract shows r2 and
  r3 are preserved across the call, so they act as pass-through inputs (outputs r3 reflects the callee's behavior,
  not this function's own work). No other state is touched; the function is purely "clear this fixed buffer." What
  lives at 0x2000FA0 (52 bytes, likely an IWRAM work area or struct scratch space) is not yet identified, so the
  name is descriptive of the operation, not the purpose.
