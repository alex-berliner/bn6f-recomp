name: submenu_shiftChipSelectUp
address: '0x08027150'
kind: function
status: probable
summary: Shifts the chip-selection ordering array at r5+0x48 toward higher indices while reloading OBJ
  tiles for each moved chip, inserts 0xB at the front, marks active-chip entry 0's byte+7 as 2, runs the
  custom-screen exit with a fade and SFX 0x92, sets state 0x18, then idles each frame.
interface: (r0 = unused on entry; r5 = custom-screen state struct) -> r0 = return of sub_80298D8; sets
  [r5+2] halfword to 0x18, marks active-chip entry, starts fade and SFX 0x92
details: Bails out if a screen fade is already active. Reads the count at r5+8, decrements it, and shifts
  the byte array at r5+0x48 up by one slot (each byte copied to the next address), writing 0xb into the
  front slot at r5+0x48 — the array looks like an ordering/queue of selected slots. For each shifted index
  it calls getLocOfActiveChips_8027E1C, takes the chip ID from the low 15 bits of the halfword at entry+8
  (entry is 12 bytes), and loads that chip's tiles into OBJ tile slot r3 via sprite_CopyObjTilesToVramSlot_80281D4
  (slots at 0x0600A4A0 + 0x80*slot). It then sets active-chip entry 0's byte+7 to 2, passes byte+6 (or
  +5 if +6 is zero) to sub_80281E4 with r1=0 (likely texture/tile setup for the chosen chip), runs the
  custom-screen exit sequence, sets a screen fade with (0, 0x20), plays SFX 0x92, and stores state 0x18
  into r5+2 before idling in sub_80298D8 each frame.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: loop 8027164-8027186 shifts bytes [r5+0x48..] up one slot and writes 0xb to the front, per ldrb/strb
    pattern; calls getLocOfActiveChips_8027E1C and reads low 15 bits of [entry+8] halfword, then sprite_CopyObjTilesToVramSlot_80281D4(chipId,
    slotIndex); sets entry byte+7 = 2 and calls sub_80281E4 with byte+6 or +5 — per-chip resource setup;
    closes with customScreen_ExitSequence_8028E32, SetScreenFade(0,0x20), PlaySoundEffect(0x92), and state
    0x18 in [r5+2]; early return at 80271BC when IsScreenFadeActive says a transition is already running
  refs:
  - bn6f/asm/asm03_0.s:1812
  - 0x080005CC PlaySoundEffect
  - 0x08028E32 customScreen_ExitSequence_8028E32
  - 0x08027E1C getLocOfActiveChips_8027E1C
  reproduce: python3 tools/asmcat.py 0x08027150
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal captures the routine accurately: it bails on active fade, decrements the count at r5+8,
    shifts bytes at r5+0x48 up with getLocOfActiveChips_8027E1C + sprite_CopyObjTilesToVramSlot_80281D4,
    writes 0xB into the front, sets byte+7 to 2, calls sub_80281E4, then customScreen_ExitSequence_8028E32,
    SetScreenFade(0,0x20), PlaySoundEffect(0x92), stores 0x18 at r5+2 and idles in sub_80298D8. However
    the description ''shifts down'' is backwards — the inlined loop increments r2 (copies byte to next
    address) while decrementing r3, meaning earlier slots shift upward toward higher indices, leaving
    the front slot (lowest index) filled with 0xB; the final slot''s tile load at the ''for each shifted
    index'' step actually corresponds to moving chip entries one position back. The name also hints ''down''
    incorrectly. Since callers are unknown, a generic name fits better than asserting ''customScreen''.;
    run wf investigate investigate-20261018-223614; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
