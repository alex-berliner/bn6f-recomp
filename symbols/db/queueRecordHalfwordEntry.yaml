name: queueRecordHalfwordEntry
address: '0x0802E5FC'
kind: function
status: probable
summary: Appends a halfword value to one of up to 5 slots in a 0x1D0-byte record from the array at 0x2036120,
  failing when the record's list is full.
interface: (r0 = record index, r1 = halfword value, r2 = extra arg passed on to sub_802E674) -> r0 = 1
  if appended, 0 if the record already holds 5 entries; flags clobbered
details: It fetches the record at unk_2036120 + r0*0x1D0 via getEntryPtr_2036120_1D0_802E070, reads the
  entry count at record+3, and returns 0 if it is already >= 5. Otherwise it stores the r1 halfword at
  record + 0x18 + count*2 (a five-slot halfword array starting at offset 0x18), increments the count at
  record+3, and calls sub_802E674 with the record index and the original r2 before returning 1. Fields
  0x00-0x17 of the record are untouched header/other data; only the count byte and one halfword slot are
  written. The return value is a success/full flag, and the r2 parameter is unused here except as an argument
  to the callee.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl getEntryPtr_2036120_1D0_802E070 fetches record r0 of the 0x1D0-stride array; ldrb r1,[r0,#3];
    cmp r1,#5; bge loc_802E626 — count at +3, cap of 5 entries returns 0; add r1,r1,r1; add r1,#0x18;
    strh r5,[r0,r1] — halfword stored at +0x18+2*count; strb r1,[r0,#3] with r1 = old count+1 increments
    the slot counter; bl sub_802E674 with (saved r0, saved r2) runs after a successful append; final mov
    r0,#1 is the success return
