name: battle_clearAlliancePermissionFlags
address: '0x0800138E'
kind: function
status: probable
summary: Clears the given bits in the current battle state's AlliancePermissionFlags field.
interface: (r0 = bitmask of alliance permission flags to clear) -> r0 = undefined; flags clobbered
details: Loads the battle state pointer from the toolkit (r10) at oToolkit_BattleStatePtr, reads oBattleState_AlliancePermissionFlags,
  clears all bits set in the r0 mask with BIC, and stores the result back. It is the counterpart of a
  set-flags routine; no other registers or structures are touched. r0 is not preserved as a return value.
