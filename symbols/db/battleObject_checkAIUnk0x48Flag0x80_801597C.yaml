    r0, #0x80` then `beq loc_8015990` / `mov r2, #1` / `mov r0, r2` builds a strict 0/1 boolean of the
    0x80 bit of the returned AIData flag word. - exit r0 is consistently 1 in all six captured calls (AIData.Unk_48
