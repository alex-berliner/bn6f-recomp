summary: Returns 1 if battle object AIData has Unk_48 & 0x80 set, else 0 (nullptr-safe).
interface: '(r0 = *BattleObject) -> r0 = 0 or 1 ; side effects: none'
details: "Saves r0 (BattleObject*) into r5, then branches on a \"branch if equal\" — disassembled as `beq\n\
  \  locret_8015992` with no prior compare; the lifter's contract marks the BEQ as conditional, so\n \
  \ this is effectively a `b locret` and the function returns r0 untouched when called. In normal\n  capture\
  \ (r0 = 0x0203a9b0, a non-null BattleObject) the call goes to GetAIDataUnk0x48Flag\n  (0x0801032c) which\
  \ returns the value of AIData->Unk_48. The result is then masked with 0x80\n  (`tst r0, #0x80`): if\
  \ bit 7 is clear, r2 stays 0 and that 0 is returned; if set, r2 = 1 and 1\n  is returned. So this is\
  \ a boolean predicate on AIData.Unk_48 & 0x80.\n  Callers: `activateCrossHappensHere_8014944` (only\
  \ one), which decides whether the\n  Cross-Activate battle action fires based on this bit.\n"
