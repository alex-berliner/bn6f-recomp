name: battle_objectWaitPhaseStep
address: '0x080CEFFC'
kind: function
status: probable
summary: Per-frame state handler that delays a battle object for a Param1-selected duration, then moves
  it to action 0xC.
interface: (r0 = unused, r5 = battle object pointer) -> r0 = clobbered; updates oBattleObject_CurPhase/CurAnim/Timer/CurAction
details: On phase 0 it writes phase=4, sets CurAnim=3, and reads a byte delay from dword_80CF02C (values
  0x28, 0x1E, 0x1A, 0x14) indexed by oBattleObject_Param1, storing it in oBattleObject_Timer. Each later
  frame decrements the Timer until it reaches 0, then sets oBattleObject_CurAction=0xC and clears CurPhaseAndPhaseInitialized
  to restart the state machine. Uses the standard battle-object struct fields (CurPhase, CurAnim, Param1,
  Timer, CurAction). The descending table suggests Param1 picks among a few preset delay lengths.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Param1]; ldrb r0,[r1,r0]; strh r0,[r5,#oBattleObject_Timer] loads
    a table-indexed delay into the timer; dword_80CF02C holds bytes 0x28,0x1E,0x1A,0x14 — four preset
    durations selected by Param1; locret path: sub timer, bgt exit — a simple per-frame countdown; on
    expiry: mov r0,#0xc; strb r0,[r5,#oBattleObject_CurAction] and phase reset to 0 — transition to action
    12'
