name: battle_spawnFixedArgEffect_wrapper_81345E8
address: '0x081345E8'
kind: function
status: confirmed
summary: Parameterless wrapper that spawns/queues one effect via sub_813468C with a hard-coded argument set (position
  240,32, params 42/19, data table byte_81331F4, flag word 0x40000000).
interface: void sub_81345E8(void); /* takes nothing from callers; returns callee's r1-r3, preserves r4-r7 */
details: "Pure forwarding stub: pushes r4-r7,lr, loads a fixed argument set, calls sub_813468C, then pops\nr4-r7\
  \ before returning. Arguments to the callee:\n  r0 = 0xF0 (240) and r1 = 0x20 (32) - most plausibly screen/x-y\
  \ coordinates for the effect;\n  r2 = 0x2A (42) and r3 = 0x13 (19) - additional fixed params (size/dimensions\
  \ or variant indices);\n  r4 = pointer to byte_81331F4, a data table the callee consumes;\n  r6 = literal-pool\
  \ constant 0x40000000 (bit 30 set - a flag/ID word; note the pool label\n  byte_81346FC is annotated \"=0x0\"\
  \ in the disassembly, a likely bad comment since the verified C\n  reads 0x40000000);\n  r5 and r7 are passed\
  \ through unmodified to the callee (not set here).\nBecause it restores r4-r7 after the call, the wrapper exposes\
  \ only r1-r3 (the callee's results)\nto its own callers; nzcv are clobbered. Being parameterless, this is almost\
  \ certainly a\nfixed one-shot effect used at one specific story/battle moment rather than a general routine.\n"
