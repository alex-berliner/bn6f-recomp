name: sub_8131C2C
address: '0x08131C2C'
kind: function
status: probable
summary: Eight-pass secondary-RNG table shuffle into dword_202522C (0x0202522C); the UI that reads the
  result is not identified.
details: 'Copies a 16-word source table (off_8131C6C: byte_81318D4..byte_8131A00) into dword_202522C,
  then runs 8 swap passes, one GetRNGSecondary each (swap two u32 entries 0-15), and ends with
  sub_8131E70. What on-screen list the shuffled table drives is still open.'
evidence:
- method: assembly-reading
  date: '2026-10-13'
  detail: 'The body copies the 16-word source table into dword_202522C, then loops r7 = 8..0: one
    GetRNGSecondary per pass, & 0xF picks the first entry, the next (wrapping) entry is swapped in.'
  refs:
  - bn6f/asm/asm36.s
  - docs/vidsync/BN6F_SYMBOLS.md
  reproduce: awk 'index($0,"sub_8131C2C:")==1{f=1} f{print} f&&/thumb_func_end/{exit}'
    bn6f/asm/asm36.s | grep -c 'GetRNGSecondary'
  result: '1 GetRNGSecondary in the pass loop (asm36.s:3432), 8 passes (mov r7,#8 at 3430), destination
    dword_202522C (3421), tail call to sub_8131E70 (3447).'
