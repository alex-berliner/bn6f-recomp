open_questions:
- Whether the loop should really be (NumChipsSelected - 1) inclusive or exclusive; the `bgt` (>) makes
  it
- '`r0 <= r2`, i.e. slots 0..(count-2) get r1=1, and slot count-1 (if any) gets r1=0. The intent looks
  like'
- '"mark the slot that just emptied", but the exact "which slot is the just-used one" is not visible here.'
- Whether sub_8029C08 / sub_8029CD4 / sub_802899C etc. are truly specific to *clearing* a selection vs.
  an
- arbitrary "deselect-one-chip-and-exit" event. The Custom Screen flow context strongly suggests the former.
