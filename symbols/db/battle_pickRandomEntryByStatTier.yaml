    run wf investigate investigate-20261019-010606'
open_questions:
- what stat 0x3E of the battle object holds (HP? some percentage?) and what its /100 tiers mean
- what the returned halfwords (IDs up to 0x54 plus the repeated 0x153 sentinel) index
- what undocumented caller sub_802D4F0 does with the result
