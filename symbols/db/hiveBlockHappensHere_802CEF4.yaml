name: hiveBlockHappensHere_802CEF4
address: '0x0802CEF4'
kind: function
status: probable
summary: 'Evaluates the outcome of an attack hitting RiskyHoney''s hive block: nullifies damage, breaks/rebuilds
  the hive shield based on accumulated damage, triggers AntiSword, and clears the collision buffer.'
interface: void battle_evalHiveBlockCollision(BattleObject *self /*r5*/, CollisionData *col /*r4->CollisionDataPtr*/)
  /* clobbers r0 r1 r2 r3; preserves r4 r5 r6 r7 r10 lr; NZCV clobbered */
details: "r5 holds the BattleObject pointer; r4 is loaded from it as the CollisionData pointer.\nr6, r7, r10 are\
  \ caller-set context preserved across calls.\n\nHive-up fast path (RiskyHoney's 0x200000 flag via GetAIDataUnk0x48Flag):\n\
  \  If PanelDamage2 is 0 (no direct panel hit), OR-combines PanelDamage 1/3/4/5.\n  If any residual damage exists,\
  \ sets AIAttackVars+0xA0 field 0x30 to 1 and\n  plays SFX 0x6E (hive-up sound), then falls through to collision\
  \ cleanup.\n\nGeneral hive-block path:\n  Loads alliance byte (r5+Alliance) and queries getTable2036720EntryFields_802CE78\n\
  \  with r6=10 (damage threshold). Entry 0xBB or 0x157 marks hive-type alliances.\n  If not a hive alliance, checks\
  \ 0x800 flag (active hive-block); if set, forces\n  type 0xBB and threshold 1. Otherwise only 0xBC (AntiSword)\
  \ continues.\n\n  AntiSword sub-path: checks sword-hit flag 0x2000 and hive-intact flag 0x20000\n  in FlagsFromCollision;\
  \ on a valid hit with no intact hive, sets 0x400 in\n  AIData+0x44 via SetAIData_Unk_44_Flag.\n\nShared hive resolution:\n\
  \  Aborts if 0x8200 already set in AIData+0x44 (block resolved).\n  Requires high object-type bits (0xff800000)\
  \ in FlagsFromCollision.\n  Sums five half-words at col+0x82; if sum >= threshold, sets hive-broken (0x200)\n\
  \  or hive-rebuilt (0x8000) depending on alliance type in AIData+0x44.\n\nCleanup (loc_802CFB8): zeroes PanelDamage1–5,\
  \ fields at 0x8E/0x90/0x92/0x74,\nHitModifierFinal, StatusEffectFinal, 0xA4, 0x1C, 0x2A, 0x2C; clears bit 0x40\n\
  (hive-present) from FlagsFromCollision and bits 0x301BE from ObjectFlags2.\n"
