name: hiveBlockHappensHere_802CEF4
address: '0x0802CEF4'
kind: function
status: confirmed
summary: Resolves a collision outcome for a hive/AntiSword battle object, updating the hive-broken/hive-rebuilt/AntiSword
  AI flags and clearing the per-panel damage scratch buffer.
interface: void hive_block_802CEF4(u32 *object /* r5 */); /* preserves r4,r5,r6,r7,r10; clobbers r0-r3,lr,flags
  */
details: "Operates on a battle object passed in r5. Pulls oBattleObject_CollisionDataPtr (r4) and oBattleObject_AIDataPtr.\n\
  Three branches:\n  1) Hive-up (riskyhoney \"0x200000\" flag on AI 0x48): if any of the PanelDamage1/3/4/5 slots\n\
  \     are non-zero (PanelDamage2 must be 0), writes 1 to oAIAttackVars_Unk_30 at AIData+0xA0 and\n     plays sound\
  \ 0x6E, then falls into the shared cleanup.\n  2) Generic hive block: queries alliance via getTable2036720EntryFields_802CE78.\
  \ Hardcoded\n     types 0xBB (true hive) and 0x157 (other hive?) start with threshold 10. Otherwise the\n    \
  \ active flag \"0x800\" promotes the object to hive-type 0xBB with threshold 1.\n  3) AntiSword (alliance 0xBC):\
  \ when the AntiSword flag \"0x400\" in AI 0x44 is unset and the\n    collision carries sword-hit \"0x2000\" but\
  \ NOT the hive-intact \"0x20000\" bit, sets the\n    AntiSword flag and cleans.\nShared hive-broken path: if AI\
  \ 0x44 already has \"0x8200\", or the collision high bits\n\"0xFF800000\" are clear, exits without acting. Otherwise\
  \ sums five u16s at CollisionData+0x82\nand compares to the threshold. Reaching threshold sets AI 0x44 to 0x200\
  \ (hive broken, hive_type\n0xBB) or 0x8000 (rebuilt, hive_type 0x157).\nCleanup zeroes PanelDamage[1..5], oCollisionData_Unk_8e/90/92,\
  \ the u32 at +0x74,\noCollisionData_HitModifierFinal, oCollisionData_StatusEffectFinal, the u16 at +0xA4,\noCollisionData_Unk_1c/2a/2c,\
  \ and clears bits 0x40 of oCollisionData_FlagsFromCollision and\n0x301BE of oCollisionData_ObjectFlags2."
