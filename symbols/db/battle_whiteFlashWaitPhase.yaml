name: battle_whiteFlashWaitPhase
address: '0x080E2E94'
kind: function
status: probable
summary: 'battle object phase: hold ~10 frames while keeping the related object''s sprite forced to a
  white palette, then advance to phase 4'
interface: (r5 = battle object) -> void; advances oBattleObject_CurPhaseAndPhaseInitialized to 4 when
  timer expires
details: On first invocation (oBattleObject_PhaseInitialized == 0) it sets oBattleObject_Timer to 10 and
  sets PhaseInitialized to 4. Each frame it loads RelatedObject1Ptr and calls sprite_forceWhitePalette
  on it, so the linked object's sprite stays white for the duration. It then decrements oBattleObject_Timer;
  while the result is >= 0 it returns, and once the timer underflows it stores phase 4 into the combined
  CurPhaseAndPhaseInitialized field. This looks like a short white-flash/whiteout pause step in a larger
  phased sequence (e.g. an enemy transformation or defeat effect) before moving to the next phase.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oBattleObject_PhaseInitialized with timer=10, PhaseInitialized=4 one-time init block;
    ldr r5,[r5,#oBattleObject_RelatedObject1Ptr]; bl sprite_forceWhitePalette applies white palette to
    linked object every frame; ldrh/sub/strh on oBattleObject_Timer with bge loop is a frame countdown;
    mov r0,#4; strh [r5,#oBattleObject_CurPhaseAndPhaseInitialized] transitions to next phase when timer
    expires
