name: battle_spawnThunderboltsOnQueuedPanels
address: '0x080C7BCC'
kind: function
status: probable
summary: Sums the Param3-length byte table at obj+0x74 into an offset, then iterates DamageAndStaminaDamageCounterDisabler
  times over obj+0x60+offset, spawning one thunderbolt object per queued nibble-encoded panel coordinate.
interface: (r5 = battle object, set by caller; no register args) -> spawns spawnThunderboltObject_80C7D50
  per entry; returns void
details: r5 points to a battle object. It reads oBattleObject_Param3 as a count and sums the first Param3
  bytes of the byte table at obj+0x74 into r7, giving an offset into the queue area at obj+0x60. It then
  iterates DamageAndStaminaDamageCounterDisabler times (count reused here as the number of queued targets),
  reading one byte per iteration from obj+0x60+r7+r4 and splitting it into high nibble (r1, likely panel
  x) and low nibble (r0, likely panel y), passing them with oBattleObject_Element and the damage field
  to spawnThunderboltObject_80C7D50. The function never saves or loads r5, so it is almost certainly a
  secondary entry point branched into from sub_80C7A20, which sets r5 beforehand.
