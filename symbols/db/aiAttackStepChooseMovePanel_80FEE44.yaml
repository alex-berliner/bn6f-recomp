name: aiAttackStepChooseMovePanel_80FEE44
address: '0x080FEE44'
kind: function
status: confirmed
summary: AI attack state step - picks a target panel for the attack move (or falls back to a stationary attack)
  and counts down the attack timer.
interface: void sub_80FEE44(BattleObject *obj /*r5*/, AIAttackVars *ai /*r7*/); returns r1 = last callee's r1 (untouched
  on entry value along the timer path); clobbers r0-r4, r6, r7, lr and nzcv; r5 and r8-r12 pass through
details: "Step handler for an AI-controlled BattleObject's attack phase, driven by the AIAttackVars\nblock in r7\
  \ (obj pointer in r5).\n\nState 1 - AttackElement == 0 (attack not yet started):\n  Sets AttackElement = 4 to\
  \ mark the object as attacking, then calls object_canMove(obj).\n  - If the object cannot move (Z set): stationary-attack\
  \ fallback - writes\n    AttackDuration = 0x3C and HitElement = 0x18 (shock/electric hit element) into the\n \
  \   AIAttackVars, and returns.\n  - If it can move: reads oBattleObject_Alliance from the object, indexes byte_80FEEA8\n\
  \    (per-alliance 8-byte entries = two words, likely panel offsets/ranges) with\n    alliance*8, then indirect-calls\
  \ ai->PanelChooseCallback with\n    r0 = ai->TargetObjectPtr, r1 = callback address (mov lr,pc; bx r1 long-call\
  \ trick),\n    r2/r3 = the two table words. If the callback returns x == 0 (no panel chosen),\n    takes the same\
  \ stationary-attack fallback. Otherwise writes the chosen x/y into\n    oBattleObject_FuturePanelX/Y, reserves\
  \ that panel via object_reservePanel, sets\n    oBattleObject_CurAnim = 4 (move/charge animation), sets object\
  \ flag\n    OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1, clears the collision region\n    (object_clearCollisionRegion\
  \ - makes the moving attacker intangible), and loads\n    StepTimer = 5.\nState 2 - AttackElement != 0 (attack\
  \ in progress):\n  Decrements StepTimer; while it is still > 0 nothing else happens. When it reaches 0,\n  writes\
  \ HitElement = 4 (ending the charge, switching to the hit element id 4).\n\nTouches: oAIAttackVars_{AttackElement,\
  \ StepTimer, AttackDuration, HitElement,\nTargetObjectPtr, PanelChooseCallback}, oBattleObject_{Alliance, FuturePanelX,\n\
  FuturePanelY, CurAnim}; data table byte_80FEEA8 (alliance*8 stride).\nQuirks: the \"4\" written to AttackElement/CurAnim/HitElement\
  \ is named ANIM_IDLE in the\nverified C but is really the \"attack queued / step 4\" element id here; the callback\n\
  uses the mov lr,pc;bx r1 pattern so the callback receives its own address in r1.\nr1 on exit is just leftover\
  \ callee state, not a meaningful result.\n"
