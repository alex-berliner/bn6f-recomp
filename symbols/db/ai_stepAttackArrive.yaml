name: ai_stepAttackArrive
address: '0x08103634'
kind: function
status: probable
summary: 'Per-frame tick of an AI step attack: when the step timer runs out, moves the object onto its
  target panel and sets the hit element for the step.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets oBattleObject_CurAnim=3, PanelX/Y=TargetPanelX/Y,
  HitElement=8, reloads StepTimer=3
details: Decrements oAIAttackVars_StepTimer and returns if still positive. On expiry it sets the object's
  current animation to 3, copies TargetPanelX/Y from the AI attack vars into oBattleObject_PanelX/PanelY,
  then calls object_removePanelReserve to release the reserved panel, object_setCoordinatesFromPanels
  to recompute pixel position, and object_updateCollisionPanels to sync collision panels and facing. It
  reloads StepTimer with 3 (so the object advances one panel every 3 frames) and stores 8 into oAIAttackVars_HitElement,
  presumably the element/damage type applied when this step connects. No return value; flags unused.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/sub/strh on oAIAttackVars_StepTimer with bgt locret makes it a periodic tick; strb TargetPanelX/Y
    into oBattleObject_PanelX/Y then removePanelReserve/setCoordinatesFromPanels/updateCollisionPanels
    performs the actual move; strb #3 to oBattleObject_CurAnim selects the attack-step animation; strh
    #3 to StepTimer and strh #8 to HitElement configure the next step and its hit element; callees object_removePanelReserve/object_updateCollisionPanels
    summaries match moving a reserved battle panel'
