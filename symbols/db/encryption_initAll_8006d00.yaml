name: encryption_initAll_8006d00
address: '0x08006D00'
kind: function
status: confirmed
summary: initialize all encryption/anti-cheat subsystems at game start (key tables, Zenny/BugFrag obfuscation, mod-card
  anti-cheat) from the toolkit pointer in r10
interface: void encryption_initAll_8006d00(u32 toolkit /* r10 */);
details: "Initializes the global encryption / anti-cheat machinery on game boot.\nWalks r10 = the toolkit pointer\
  \ base.\n1. Zero-fills the 0x80-byte \"extra toolkit pointers\" block at\n   \"eUnusedExtraToolkitPtrsOffset\"\
  :=8006E38, then stores a fresh GetRNG()\n   u32 at +0x4 as an RNG seed.\n2. For each of three named byte arrays\
  \ it generates non-zero random\n   bytes (mask 0xFF) XORed with a per-table constant, rejected and\n   re-rolled\
  \ when the result is 0, writing them from high index down to\n   0:\n     - \"byte_20004E0\" (0x200 bytes, XOR\
  \ 0x6F)  - item names; mirror\n       copied (NOT form) into toolkit->Unk2004a8c_Ptr buffer.\n     - \"byte_20008A0\"\
  \ (0x200 bytes, XOR 0x81)  - pet names; mirrored\n       (NOT) into toolkit->Unk2004c20_Ptr buffer.\n     - \"\
  byte_2001600\" (4 bytes, XOR 0xFE)  - short strings; mirrored\n       (NOT) into toolkit->Unk2004e24_Ptr buffer.\n\
  3. Builds a 12-bit-masked GetRNG() (lsl #12; lsr #12) and XORs with a\n   constant, rejecting 0:\n     - dword_2000060\
  \ ^= 0x802412C (Zenny obfuscation key), then\n       chains encryption_zenny_8006f54.\n     - dword_20018B8 ^=\
  \ 0x803ED90 (BugFrag obfuscation key), then\n       chains encryption_bugfrags_8006fac.\n4. Finally runs anticheat_modCardsInit_8007036\
  \ to seed the\n   mod-card anti-cheat tables.\nAll GetRNG() results except the seed are discarded; the named byte\n\
  arrays and the two dwords persist as run-time keys/state.\n"
