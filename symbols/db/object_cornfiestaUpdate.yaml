name: object_cornfiestaUpdate
address: '0x080DAB22'
kind: function
status: probable
summary: 'Per-frame update for the Cornfiesta chip-attack object: periodically drops the attack on a random
  panel and shakes the camera.'
interface: (r5 = battle object) -> void; r0 clobbered
details: 'Runs on the battle object''s frame update: increments oBattleObject_Timer, and every 8 frames
  increments oBattleObject_Timer2. When Timer2 reaches 0x10, or battle_isBattleOver returns true, or chooseCornfiestaPanelXY
  fails to pick a panel, the object sets its state to CUR_STATE_DESTROY. Otherwise it calls sub_80C67D8
  with the panel x/y from RNG, oBattleObject_Element, 0xff and oBattleObject_DamageAndStaminaDamageCounterDisabler,
  apparently spawning the attack/damage object, then sets its oObjectHeader_Flags bit 0x10. It stores
  a result byte into a small 3-entry ring buffer at oBattleObject_ExtraVars+0xC indexed by ExtraVars+0x10
  (which cycles 0..2), then triggers a camera shake of magnitude 1 for 0x14 frames.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Timer/Timer2 bookkeeping with destroy on Timer2==0x10 or battle over (first ~10 instructions,
    loc_80DAB84); bl chooseCornfiestaPanelXY_80DABC4 followed by bl sub_80C67D8 passing oBattleObject_Element
    and damage fields; strb to [r5, ExtraVars+0xC + index] with index cycled mod 3 (ExtraVars+0x10 compare
    #3); bl camera_initShakeEffect_80302a8 with r0=1, r1=0x14 after each hit; callee chooseCornfiestaPanelXY
    is documented as a Cornfiesta chip-attack panel chooser using GetRNG&0xF'
