name: battle_startAiAttackA
address: '0x080F4AC6'
kind: function
status: probable
summary: Initializes the AI attack-vars struct with the current difficulty tier and resets its fields,
  then assigns a panel-choose callback, selects the opposing player as target, and transitions the object
  into attack state 0xA.
interface: (r7 = * oAIAttackVars struct for this battle object; r5 = * battle object) -> r0 = destroyed;
  sets object attack state to 0
details: Stores the AI difficulty tier (from battle_getAiDifficultyTier_800FE36) into oAIAttackVars_AiDifficultyTier
  and clears the InitFlag. Calls sub_80F4B74 with r0=0 (likely a state/phase reset), then fills AttackDuration
  from sub_80F49D4 and AttackBoost2/TimerOrCycles from sub_80F49F8, both presumably derived from the tier.
  Installs a callback pointer (sub_80F5484+1) into oAIAttackVars_PanelChooseCallback, picks the opposing
  player object via battle_findPlayer(Alliance ^ 1) into oAIAttackVars_TargetObjectPtr, and finally calls
  object_setAttack0 with 0xA to put the object into attack state 0xA. This is clearly a per-object initialization/setup
  routine for an AI attack behavior block at oAIAttackVars.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] after bl battle_getAiDifficultyTier_800FE36 stores
    the tier into the AI vars struct; ldr r0,off_80F4C18; str r0,[r7,#oAIAttackVars_PanelChooseCallback]
    installs a per-state callback pointer; bl battle_findPlayer with Alliance^1 stores the opposing player
    pointer into oAIAttackVars_TargetObjectPtr; mov r0,#0xa; bl object_setAttack0 ends the routine by
    entering attack state 0xA; struct writes all target oAIAttackVars_* fields of r7, matching an AI attack
    state-machine block
