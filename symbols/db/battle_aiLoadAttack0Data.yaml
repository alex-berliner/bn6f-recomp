name: battle_aiLoadAttack0Data
address: '0x08107EFC'
kind: function
status: probable
summary: Wrapper called from battle_aiInitAttack0 that hands a fixed ROM data pointer (0x080C1010) to
  sub_800FE28, presumably to load attack 0's data/script for the enemy AI.
interface: (none) -> r0 = pointer 0x080C1010 passed to sub_800FE28; returns its result in r0
details: 'The routine is a two-call thunk: it pushes lr, loads the address of the literal dword_8107F0C
  (which contains 0x0C0C1010, i.e. mirror-space address 0x080C1010 in ROM) and calls sub_800FE28 with
  that pointer in r0, then returns with the callee''s r0. The constant is likely a pointer to an attack-pattern/script
  blob in ROM rather than a computed value, since it is stored in the thunk''s own data area. Its only
  known caller is battle_aiInitAttack0, which sets up an enemy AI attack, so the data passed is most plausibly
  attack 0''s definition or script. What sub_800FE28 does with the pointer (copy, register as callback,
  run a script VM) is not visible here.'
