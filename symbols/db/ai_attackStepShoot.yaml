name: ai_attackStepShoot
address: '0x080EF4D0'
kind: function
status: probable
summary: AI attack routine that winds up with a shoot animation and periodically fires a projectile attack
  using the object's damage/element settings.
interface: (r0 = attack element state from oAIAttackVars, working object in r1/r5/r7 registers) -> r0
  = spawn/hit result from sub_80DE660; no meaningful return to caller
details: Runs each frame on an enemy's AI attack vars (r7 = oAIAttackVars, r5 = battle object). If AttackElement
  is 0 it starts animation 0xC, resets the counter timer to default 0x10, sets ObjectFlags1 bit 22, sets
  StepTimer to 0xF and AttackElement to 4. When StepTimer reaches 0xD it resolves a target position (sub_80ED040,
  or object PanelX + front direction if that fails) and calls sub_80DE660 with x = PanelX/direction, y
  = 0, damage = Damage + AttackBoost, element 4, InitFlag and AiDifficultyTier — presumably spawning the
  attack entity or applying a hit. StepTimer then decrements each frame; when it drops below 0 it is reset
  to 5 and HitElement is set to 4, scheduling the next shot. The dword_80EF530 constant 0x40201 is likely
  an attack descriptor/flag word used with this attack.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne gates one-time setup (animation 0xC, flag
    bit 22, StepTimer=0xF, AttackElement=4); cmp r0,#0xD at loc 0xD triggers the single fire: sub_80ED040/object_getFrontDirection
    then bl sub_80DE660 with Damage+AttackBoost, element, InitFlag, AiDifficultyTier; sub r0,#1 / strh
    StepTimer with reset to 5 and HitElement=4 is a repeating fire-cooldown timer; callees object_setAnimation,
    object_setDefaultCounterTime, object_setFlag1 are all battle-object AI/animation helpers'
