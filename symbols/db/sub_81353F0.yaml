name: sub_81353F0
address: '0x081353F0'
kind: function
previous_names: []
status: hypothesis
summary: Thin per-frame wrapper that calls sub_8134930 with fixed opcode parameters (0x24, 0xa5, 0x28) on a battle
  object.
interface: (r0 = ?, r1 = ?, r5 = ?, lr) -> r2 = ?, r3 = ?, r5 = preserved, r6 = ? ; side effects via sub_8134930
details: "Pushes r4-r7 and lr, copies r0 into r7 (unused after) and r1 into r3. Sets up three immediates\n  (#0x24,\
  \ #0xa5, #0x28) and r4 = 6, then tail-calls sub_8134930 with the original r0/r1 as args\n  in addition to r2=0x28\
  \ and r3=r1 (saved from r1). Pops r4-r7 and returns via pc.\n  No local computation is visible here — every action\
  \ is delegated to sub_8134930. The literal\n  opcode 0x24 / 0xa5 / 0x28 / arg 6 combination looks like a fixed\
  \ sub-command header.\n  Captured entries show r0 ∈ {5,6} (an object index) and r1 ∈ {0,1} (an alliance flag /\
  \ sub-id);\n  exits return r0 ∈ {0x20,0x40}, consistent with sub_8134930 doing a state transition.\n  The function\
  \ is called from multiple battle-object update sites (object update, submenu scene,\n  joypad scene, etc.) but\
  \ never appears on a \"hot\" route that the project names — coverage hit\n  count is 0 listed, suggesting it may\
  \ be a leftover/edge-case dispatch helper. The captured call\n  lrs (0x08133429 / 0x08133431) match the two neighbouring\
  \ call sites inside battle_objectUpdate_8133400,\n  which the project calls \"Per-frame update tick for a battle\
  \ object\".\n"
