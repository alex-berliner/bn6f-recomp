name: sub_81353F0
address: '0x081353F0'
kind: function
status: hypothesis
summary: Thin wrapper that tail-calls sub_8134930 with fixed parameters (0x24, 0xA5, 0x28) and argument 6, forwarding
  two caller values through.
interface: void sub_81353F0(u32 arg0 /* -> callee r7 */, u32 arg1 /* -> callee r3 */); clobbers r0-r3 and flags,
  preserves r4-r7
details: 'Pure trampoline: pushes r4-r7+lr, moves the caller''s r0 into r7 and r1 into r3,

  loads r0=0x24 (36), r1=0xA5 (165), r2=0x28 (40), r4=6, and calls sub_8134930,

  then pops r4-r7 back into pc. r5 and r6 pass through to the callee unchanged.

  The C note describes 6 as a "chip/flag argument", suggesting the target is

  battle/chip related, but the meaning of the fixed constants 0x24, 0xA5 and

  0x28 is not visible from this wrapper alone. Game-level behavior depends

  entirely on what sub_8134930 does with these arguments.

  '
