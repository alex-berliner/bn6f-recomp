open_questions:
- Is the source at off_8086D1C really a saved prior-trail record, or an unrelated common struct being
  repurposed? A second caller orcallee walking the same off_8086D1C layout would nail this down.
- What exactly do the copied byte slots (offsets 5..13 of the trail struct) represent (frame counter,
  animation phase, position slots)? Without a known symbol on the trail struct the meaning is inferred
  from the caller's pre-fills only.
