    EVENT_5F2 set, EVENT_5E4 clear, EVENT_5FF clear and sub_8086FA4 nonzero — typical conditional trail-restore
    branch; Assembly copies bytes [r3+1..9] to [r5+5..13] and 0x21 words from [r3+0x5C] to [r5+0x10] of
    the trail record at RAM 0x2000EC0; Trailing call to reqBBS_setFlag_e17b0f7_8140A00 sets event flag
