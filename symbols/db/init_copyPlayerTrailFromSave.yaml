name: init_copyPlayerTrailFromSave
address: '0x08087238'
kind: function
status: probable
summary: Copies a saved player trail record from off_8086D1C into the active trail struct and sets event
  flag 0x5E5.
interface: (r5 = ptr to player trail struct) -> void; r5+0x5..r5+0xd filled from src[1..9], r5+0x10..
  filled with 0x21 words from src+0x5C
details: Loads the base pointer through off_8086D18 (taking +4 to reach the trail record at RAM 0x2000EC0).
  Copies 9 single bytes (offsets 1..9 of the source) into the destination at offsets 5..13, matching the
  layout hinted at by the caller's pre-set bytes (0xa, 0xf, 1). Then copies 33 words from source+0x5C
  to dest+0x10. After copying, it calls reqBBS_setFlag_e17b0f7_8140A00, which sets event flag 0x5E5 (typically
  the 'trail data loaded/copied' marker). The caller only invokes this branch when EVENT_5F2 is set and
  EVENT_5E4 is clear and a sub_8086FA4 check passes and EVENT_5FF is clear, suggesting it is one path
  of a state machine for trail restoration on entering the BeastSp area.
