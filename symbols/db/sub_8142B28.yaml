name: sub_8142B28
address: '0x08142B28'
kind: function
previous_names: []
status: hypothesis
summary: Checks if the overworld player is at the same position as an OW object entry and returns a u16 from the
  matched battle object (likely an interaction id or panel/type id).
interface: '(r5 = OWMapObjectPtr, r10 = toolkit) -> r0 = u16 id (or 0); side effects: r4-r7 modified; may clobber
  r0-r3,lr; Z flag set if non-zero'
details: "- Function reads byte at [r5+0] (ObjectID/Flags from object_header); if zero AND [r5+1] == 0xF (overworld\
  \ map object type?), the check proceeds.\n  - Loads overworld player coords via `ReadOWPlayerObjectCoords`; compares\
  \ player's coord (returned in r2, likely Y or Z) with `[r5+0x14]` (which is the OW object's NextY field per `oOWPlayerObject`).\n\
  \  - If that matches, reads `[r5+4]` (ObjectID for overworld map object / MovementSpeed for NPC) as an index,\
  \ calls `battleObject_getByIndex_81428C2`, then returns the halfword at `[returnedPtr+4]` (which lines up with\
  \ the `Params`/`Param1..4` region of a BattleObject - likely the chip id or a small interaction token).\n  - On\
  \ any mismatch (or if ObjectID byte is non-zero), returns 0. Return value's meaning is not certain; given the\
  \ `(ObjectID==0, sub-type==0xF)` check, this looks like \"find the locked interaction object for player at this\
  \ OW map object slot\".\n  - The contract lists r0 in `out`, so it does return a value; r5 holds the OW map object\
  \ candidate, r10 holds the toolkit.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0,[r5]; tst r0,r0; beq loc_8142B4C` -> gates on ObjectID==0 (mov r4,#0 default). - `ldrb r0,[r5,#1];
    cmp r0,#0xf; bne loc_8142B4C` -> requires sub-type 0xF. - `bl ReadOWPlayerObjectCoords` then `ldr r0,[r5,#0x14];
    cmp r0,r2; bne loc_8142B4C` -> compares player Y/Z with stored value at offset 0x14 (NextY/NextZ per `OverworldPlayerObject`).
    - `ldrb r0,[r5,#4]; bl battleObject_getByIndex_81428C2; ldrh r4,[r0,#4]` -> looks up a BattleObject by index
    from the OW object''s field 4 and returns a halfword from offset 4 of that BattleObject (Params u32 lo half).
    - `mov r0,r4; tst r0,r0; pop {r4-r7,pc}` -> returns the halfword in r0, Z reflects zero/non-zero.'
