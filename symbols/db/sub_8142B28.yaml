open_questions:
- What semantic the returned u16 represents (chip id? panel index? interaction token?). The struct offset of 4 on
  a BattleObject is `Params`/`Param1` which is opaque here.
- Whether [r5+1]==0xF really means "a particular OW map object category" or some special flag - the surrounding
  code at 0x08142a84 and 0x08142b04 (the only two callers, both unnamed) would disambiguate.
- The role of the captured r0/r1 entry values (often 0x00000000 with r1=8 or 1) - probably just "no prior state"
  snapshots in the test inputs.
