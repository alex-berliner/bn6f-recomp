name: battle_timerToEndBattle
address: '0x080090EE'
kind: function
status: probable
summary: One-shot battle state that waits 30 frames, then triggers the battle-end sequence (substate 7)
  and flags the overworld player struct.
interface: (r5 = battle state struct) -> r0 = 0/1 from eStruct200A008_setUnk02; no meaningful return
details: 'Uses r5 as a state struct: byte +3 is a phase and halfword +8 a frame countdown. On the first
  call (phase == 0) it initializes the countdown to 30 (0x1E) and sets phase to 4, so the delay runs once.
  Each subsequent call decrements the timer; when it reaches 0 it stores 7 into byte +4 (next state),
  writes 7 into GameState''s BattleEndSubState via the toolkit pointer in r10, and calls eStruct200A008_setUnk02(1)
  to set byte 2 of the fixed overworld player struct at 0x200A008, likely telling the overworld side the
  battle is ending.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#3]; tst/bne: phase byte gates a one-time init of timer 0x1E and phase 4; ldrh/sub/strh
    on [r5,#8] with bgt: per-frame countdown, branch taken while timer > 0; strb r0,[r1,#oGameState_BattleEndSubState]
    with r0=7: fires battle-end substate 7 when timer expires; bl eStruct200A008_setUnk02 with r0=1: notifies
    the overworld player struct (0x200A008 byte 2) after the wait'
  refs:
  - bn6f/asm/asm00_1.s:13383
  - 0x0800B6C2 eStruct200A008_setUnk02
  reproduce: python3 tools/asmcat.py 0x080090EE
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No known caller, so which battle situation installs this state (victory, escape, dialog-before-end)
  is unconfirmed
- Exact meaning of state bytes +3/+4 and of the value 1 written to 0x200A008 byte 2 needs the state-machine
  dispatcher
