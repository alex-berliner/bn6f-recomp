name: rfu_initLinkSessionState
address: '0x0812A058'
kind: function
status: probable
summary: State-machine step that draws the scene, prepares EWRAM link buffers, calls rfu_initLinkSession,
  and on failure fades the screen and sets substate 0x10 (index 8) or 0x0C, zeroing [r5+3] and [r5+0x24];
  on success advances to state 0x34.
interface: '(r5 = link object struct: +1 state byte, +2/+3 substate bytes, +0x24 halfword) -> r0 = rfu
  result; sets next state fields in [r5]'
details: The function first calls the conditional draw helper, then some prep (sub_8146588) and reads
  the mode/jump index of the EWRAM record at 0x200BC30 via eStruct200BC30_getJumpOffset00. If the index
  is not 8 it runs a sub_8049D98/sub_8049DA0/sub_814695C/sub_8049D7C/sub_81469BC chain between the two
  EWRAM buffers unk_201FD20 and unk_201FD40 (likely building/parsing a link payload before the session).
  It then calls rfu_initLinkSession; a zero (success) result leads to a screen fade (SetScreenFade(0xC,
  0x10)) and next-state 0x10 when the 0x200BC30 index is 8, else 0xC, in both cases zeroing [r5+3] and
  [r5+0x24]. On rfu failure it writes state 0x34 into [r5+1] and clears [r5+2..3], i.e. an error/retry
  state. The r5 layout (state byte at +1, substate at +2/+3, halfword counter at +0x24) matches the game's
  screen-controller/task state machines.
