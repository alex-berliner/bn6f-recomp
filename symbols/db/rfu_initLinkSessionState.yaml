    SetScreenFade(0xC,0x10) then strb 0x10 or 0xC to [r5,#2] depending on eStruct200BC30_getJumpOffset00()==8;
    reads/writes only the pair unk_201FD20/unk_201FD40 through sub_8049DA0/sub_814695C/sub_81469BC, consistent
    with link buffer prep; bl sprite_drawIfFlagSet_812B504 at entry shows r5 is the standard draw-flag
