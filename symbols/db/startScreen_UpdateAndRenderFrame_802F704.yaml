name: startScreen_UpdateAndRenderFrame_802F704
address: '0x0802F704'
kind: function
status: confirmed
summary: Advances the title/start screen by one frame — runs its state update, then redraws it.
interface: void startScreen_UpdateAndRenderFrame(StartScreen* self /* r5 */); no meaningful return
details: 'A per-frame tick for the start (title) screen. It keeps the screen struct pointer in r5 and simply calls
  two helpers in sequence, both of which receive the same pointer in r5: first sub_802F81C (the update/state-advance
  half) and then sub_802F8D8 (the render/draw half, which already carries an explicit StartScreen* contract). The
  function itself is a pure orchestrator: no fields are touched directly here, no conditionals, no return value
  beyond whatever falls through in r0-r3. Callers preserve r4-r6 and r10 across it per the contract. This is presumably
  called each frame while the game sits on the start screen.

  '
