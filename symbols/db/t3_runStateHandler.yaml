name: t3_runStateHandler
address: '0x0803A558'
kind: function
status: probable
summary: If dispatch_803C620 returns nonzero index and zero busy flag, loads a table entry (stride 8)
  from dword_803A5C4, copies its low byte into [r5+1], and long-calls its second word as a state handler,
  returning 1; otherwise returns 0 (sub_8148214 runs in both paths).
interface: (r0/r1 set by dispatch_803C620; r5 = work struct ptr supplied by caller) -> r0 = 1 if a state
  handler ran, 0 if finished/blocked; flags clobbered
details: 'dispatch_803C620 returns (r0 = state index, r1 = busy/error flag). If r1 is nonzero or r0 is
  0, the function calls sub_8148214 and returns 0 without doing anything. Otherwise it calls sub_813D978,
  then reads a table at dword_803A5C4: entry size 8 bytes, indexed by index*8. Word 0 of the entry is
  stored as a single byte at [r5+1] (a state id/param in the caller''s work struct, since r5 is not set
  here), and word 4 is a function pointer invoked via the classic mov lr,pc / bx r0 long call. After the
  handler returns, sub_8148214 runs and the function returns 1, so callers can poll this until it returns
  0. The dispatch-then-table pattern makes this a generic ''step to next state and run its callback''
  helper shared by the six nearby callers.'
evidence:
