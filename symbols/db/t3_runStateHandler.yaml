  date: '2026-10-19'
  detail: 'tst r1,r1 / bne + tst r0,r0 / beq: return 0 path when dispatch signals busy or index 0 (loc_803A584);
    lsl r4,r4,#3 + add r3,r3,r4: 8-byte table stride indexed by dispatch''s r0; strb r0,[r5,#1]: only
    the low byte of table word 0 is written to the caller''s work struct at +1; ldr r0,[r3,#4] / mov lr,pc
    / bx r0: per-entry function pointer called as a long call; six callers at 0x08039BC0-0x08039DB4 in
    the same module all reuse this stepper'
