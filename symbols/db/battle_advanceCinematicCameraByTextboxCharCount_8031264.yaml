details: "Prologue: pushes {r0-r2,r5,lr} saving r0-r2 (r0 is the textbox/state ptr, captured 0x02009f5c),\n\
  \  r5 (saved across bl), and lr.\n  Calls sub_8031122 which (per its summary) zeros two counter/flag\
  \ words of the global state\n  struct at dword_200F3E0 and dispatches into sub_80310EC.\n  Then sets\
  \ up args for sub_8030F04 (the unnamed callee whose name `battle_runTextboxUpdateAndSetStateBit1_8030F04`\
  \ we can read from your structured prompt summary): r2=0, r4=0, r3=0x20, r5=0x20, r6=1.\n  After return,\
  \ negates r0 twice via `neg r0,r0 ; lsr r0,#1 ; neg r0,r0` which produces a\n  fixed-point safety net\
  \ (rounded abs), then `lsr r1,r1,#1` halves the second return reg.\n  Passes (r0,r1) into camera_moveByDelta_80310B0,\
  \ which adds the (scaled) delta to the camera\n  scroll positions.\n  Finally ORs r12 (the saved flag\
  \ word) with 3 and stores back; this looks like flipping in\n  bits 0 and 1 of a state/bitfield word\
  \ that the caller expects to be set after a successful\n  textbox-driven advance step.\n  5 captured\
  \ story snapshots (story3_0..4) all use the same r0=0x02009f5c, r1=0x00008466, r2=0x02027c50 entry signature,\n\
  \  consistent with this being called per-cinematic-frame during a script line where the textbox\n  cursor\
  \ advances by exactly one character (the 0x33..0x38 range in the snapshot matches the\n  textbox cursor\
  \ positions seen across sequential frames).\n  Name `battle_advanceCinematicCameraByTextboxCharCount_8031264`\
  \ matches: per-char advance of\n  a textbox whose char count drives a camera delta, plus or-in of two\
  \ state bits via r12.\n"
