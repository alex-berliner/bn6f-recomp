name: eStruct200BC30_getJumpOffset00
address: '0x0803EA60'
kind: function
status: confirmed
summary: Returns the first byte of the record at EWRAM 0x200BC30, used as an index/offset (likely for a jump-table
  dispatch on that record).
interface: (void) -> u8 r0 (byte at eStruct200BC30[0]); also sets r1 = pointer to eStruct200BC30; lr is used as
  return (mov pc, lr), no flags guaranteed.
details: 'Trivial getter: loads the address of the eStruct200BC30 record (EWRAM 0x200BC30) into r1, reads its first
  byte with ldrb into r0, and returns. The record''s first byte is presumably a state, type, or branch-selector
  value consumed by a caller that dispatches through a jump table (hence ''JumpOffset00'' — likely one of several
  numbered accessors for the same record, each reading a different field). r1 is left pointing at the record, which
  callers may or may not use. No side effects, no other registers touched.'
