name: oOWPlayerObject_ActionSubState
address: '0xa'
kind: struct-field
status: probable
summary: Secondary action/sub-state index for the overworld player; used to dispatch via small jumptables
  and cleared on interaction retry or chat-closure.
details: The field is read in 4 distinct dispatcher sites and used as an index into separate jumptables
  (off_809D554, off_809D6B0, off_809D798, off_809D91C), confirming it is a state index, not a flag or
  counter. It is paired with JumptableIndex_09 at +0x09 and a pending slot at +0x0b that is written only
  when +0x09==0x10 (mirroring the same "live/pending" pattern). Values written are discrete small constants
  (0 on reset/retarget, 4 as the common "advance queued" state, 8 for counter-talk/equal-x, 0x98 once)
  consistent with enumerated sub-states rather than a flag, timer, or magnitude.
