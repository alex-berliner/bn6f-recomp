summary: 'Flinch action handler (CurAction 3, ''on flinch'' in the PlayerObjectAIAttackJumptables annotation):
  dispatches the AI, commits the pushed-back FuturePanel position, plays animation 1 for 23 frames, then
  ends the action.'
interface: 'void battleObject_actionFlinch(u32 r5 /* battle object */) : r5 -> [r5 r10] (captured exits
  r0 = Timer countdown)'
details: 'Entry 3 of the per-AIIndex action handler tables (PlayerObjectAIAttackJumptables / off_80EA52C
  and its copies, annotated ''// on flinch // 0x03''), dispatched through sub_801B394''s CurAction dispatch.
  First entry (oBattleObject_PhaseInitialized == 0): ai_dispatchByTypeAndIndex_800F3E8 runs the AI''s
  reaction, then object_setFlag1(0x400400), battle_object_clearFlagsAndCollisionCounter_801A284, battleObject_clearHitFlags_801A29A,
  battleObject_resetCollisionState_801A2B0, battle_resetCollisionState_80101C4, ClearAIDataUnk0x48Flag(0x20005f),
  object_clearFlag(0x100041), sub_8012EA8. Unless ObjectFlags1 bit 0x1000 (sliding) is set, commits the
  move: FuturePanelX/Y -> PanelX/Y, object_removePanelReserve, object_setCoordinatesFromPanels, object_updateCollisionPanels,
  Z = 0. Then CurAnim=1 / CurAnimCopy=0xFF, sub_8011450, flip, RelatedObject1Ptr = 0, oAIData_Unk_68 =
  0, tableAddSaturatedByte_800AB46(alliance, 3, 1), Timer = 0x17 (23 frames), PhaseInitialized = 4. Countdown:
  decrements Timer each frame; when it goes negative, clears 0x400400, ClearAIData_Unk_44_Flag(0x3f),
  CurAnim = 0, CurAction = 8, CurPhaseAndPhaseInitialized = 0.

  '
