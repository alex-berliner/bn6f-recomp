name: clearVramAndTilemap
address: '0x0803CD58'
kind: function
status: probable
summary: Clears VRAM and zeroes the BG tile ID block buffer as part of a graphics reset.
interface: () -> (); no return value
details: 'A parameterless helper that wipes the display memory: it calls zeroFillVRAM to clear VRAM 0x6000000-0x600DFFF,
  then ZeroFillGFX30025c0 to zero the 0x2000-byte BG tile ID block buffer used by the background layer.
  It takes no arguments and returns nothing, only preserving r4-r7 across the two calls. This pairs naturally
  with video reset/startup sequences where both the hardware VRAM and the toolkit''s tilemap tile data
  must start blank.'
