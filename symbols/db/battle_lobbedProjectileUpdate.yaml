name: battle_lobbedProjectileUpdate
address: '0x080B86D4'
kind: function
status: probable
summary: 'Per-frame update for a lobbed-projectile battle object: steps its sprite, then dispatches the
  phase handler for the object''s current phase.'
interface: (r0 = battle object pointer, r5 = same object) -> r0 = phase handler's return; calls phase
  handler via long bl (lr=pc, bx).
details: First calls battleObject_stepSpriteIfAliveAndUnfrozen_80B881E on the object; if that returns
  0 (sprite not stepped), it returns immediately. Otherwise it loads oBattleObject_CurPhase from the object
  and indexes a two-entry dispatch table at off_80B86F0, calling that handler with a manual long bl (mov
  lr,pc; bx). Phase 0 is battle_lobbedProjectileLandPhase; every other phase falls through to nullsub_8
  (table index beyond entries would read adjacent data, so phase must be 0 or 1 in practice). This is
  a standard battle-object 'step + phase dispatch' routine specialized to the lobbed projectile object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battleObject_stepSpriteIfAliveAndUnfrozen_80B881E then beq locret — sprite step gates the
    phase dispatch; ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0]; bx r1 — dispatch on object phase
    field; table off_80B86F0: battle_lobbedProjectileLandPhase+1, nullsub_8+1 — phase 0 lands the projectile,
    other phases do nothing; mov lr,pc; bx r1 — Thumb long-call into phase handler, standard bn6 battle
    pattern'
