name: sub_8029ADA
address: '0x08029ADA'
kind: function
status: probable
summary: Returns a small movement/action index (5, 6, 7, 10, 15, or 0) derived from the entity's primary state and
  sub-state bytes.
interface: u32 sub_8029ADA(struct Entity *r5_entity) -> u32 r0_index; clobbers nz,c,v (sets N/Z/C/V from r0)
details: 'Reads the entity''s primary state byte at offset 0x7 and sub-state byte at offset 0x8 (entity-relative).
  Dispatches on the primary state: primary==0x0A unconditionally returns 0xF (15); primary==0x00 with sub-state==0x01
  returns 5; primary==0x01 with sub-state 0x01/0x02 returns 6 and 0xA respectively; any (primary, sub_state<2) other
  pairing returns 7 (used as the walking/idle default); and any unrecognised combination with sub_state>=2 falls
  through to 0. The 0 case appears to act as a guard/done sentinel, and the dispatched indices (5, 6, 7, 0xA, 0xF)
  match the project''s enumerated action table.'
