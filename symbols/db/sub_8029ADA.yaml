open_questions:
- Which entity/object type r5 points to (the offsets 0x7/0x8 suggest a shared entity base with battle/field scripts).
- Meaning of action indices in the consumer's action table (what 5/6/7/0xA/0xF actually drive).
- Why the awkward `sub_state==0x01` arms sit inside `primary==0x00` and `primary==0x01` while the `default` branch
  handles the `sub_state<2` cases — looks like it inlines a partial special case for clarity, but exact intent is
  unclear.
