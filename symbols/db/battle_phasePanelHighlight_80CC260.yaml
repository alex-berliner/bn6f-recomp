name: battle_phasePanelHighlight_80CC260
address: '0x080CC260'
kind: function
status: confirmed
summary: Per-frame update for a battle object's "highlight the panel it stands on" phase, ending in phase 4 after
  0x14 frames.
interface: void sub_80CC260(r5=battle object, r1=pass-through value) -> r1 (4 after phase init, otherwise whatever
  object_highlightPanelRegion leaves / incoming value on skipped frames)
details: 'Phase handler for a battle object (r5 = object base, standard oBattleObject layout).

  On the first frame of the phase (oBattleObject_PhaseInitialized == 0) it initialises:

  PhaseInitialized = 4, CurAnim = 1, Timer = 0x14 (20 frames), Timer2 = 0, and returns r1 = 4.

  On subsequent frames it increments Timer2; whenever bit 2 of the incremented Timer2 is

  clear (carry of Timer2>>3 clear, so the highlight fires in alternating 4-frame windows

  of each 8-frame cycle, not just once per 8 frames) it calls

  object_highlightPanelRegion(PanelX, PanelY, 8, AllianceAndDirectionFlip) to highlight

  the panel region under the object; r2 = 8 is passed verbatim (likely region size/kind).

  Every frame it decrements Timer; once it underflows below zero the 16-bit

  oBattleObject_CurPhaseAndPhaseInitialized field is written with 4, which both advances

  the state machine to phase 4 and clears PhaseInitialized so a later activation

  re-initialises. r1 is untouched except on the init frame (set to 4) and on frames that

  call the highlight routine (r1 is whatever that helper leaves).

  '
