name: battle_spawnPairedVariantAtFrontPanel
address: '0x080E3290'
kind: function
status: probable
summary: Battle-object step that spawns the paired variant object (0x4B) on the first matching panel in
  front of the acting object.
interface: (r0 = battle object in r5, r1 = panel-param index for the lookup) -> r0 = 0; spawns object
  0x4B at found panel
details: r5 is the acting battle object; its Alliance byte is passed to battle_getFirstPanelInFrontByParam
  to find the first panel in the object's facing direction whose panel state matches an alliance-dependent
  parameter entry (r1 selects the entry). If no panel is found the function returns immediately. Otherwise
  it loads the object's Params pointer, its DamageAndStaminaDamageCounterDisabler value plus Z16Save (an
  offset/counter into that structure), and the Alliance into r2, and calls battle_spawnPairedVariantObject,
  which spawns object 0x4B, attaches an 8-byte per-variant record from these values, and initializes it
  as a field battle object. The trailing .byte pool is literal data (0x08010010, 0x0F800000), not code.
  Effectively a 'place attack/field effect object on the first panel ahead' step.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_Alliance] then bl battle_getFirstPanelInFrontByParam, tst/beq: panel
    found in front or skip; ldr r4,[r5,#oBattleObject_Params] and add r6, r6, r3 with oBattleObject_Z16Save:
    builds per-variant spawn data; bl battle_spawnPairedVariantObject whose summary spawns object 0x4B
