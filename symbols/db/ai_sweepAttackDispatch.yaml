name: ai_sweepAttackDispatch
address: '0x0811121C'
kind: function
status: probable
summary: 'Dispatcher for the battlesweep AI attack: jumps to the next attack step based on the AI attack
  vars'' HitElement state byte.'
interface: (r7 = AI attack vars struct) -> r0 = HitElement value passed to selected handler; returns to
  caller after handler via pop
details: Reads the byte at r7+oAIAttackVars_HitElement and uses it as an index into a three-entry jump
  table at off_8111230. Entry 0 calls ai_sweepPanelHighlightStep, entry 1 calls sub_811128C, entry 2 calls
  genericAI_exitAttackStateAffterDelay_81097B4. The mov lr,pc / bx r1 idiom is just a Thumb long-call,
  so each handler returns into the pop; control never comes back to this function otherwise. The HitElement
  field is thus being reused as an attack-phase selector for the sweep attack sequence rather than a true
  element. No argument setup is done besides carrying r0 through, so handlers expect the state in r0 and
  their context elsewhere.
