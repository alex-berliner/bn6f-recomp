name: isEventFlag212Set_80AA764
address: '0x080AA764'
kind: function
status: confirmed
summary: Returns 1 if event flag EVENT_212 is set, otherwise 0, and leaves N/Z flags reflecting the result.
interface: 'bool isEventFlag212Set(void) — in: none (r4/r10/lr only per contract, all unused); out: r0 = 0 or 1,
  N/Z set from r0 (C/V clobbered by the flag test call)'
details: 'Tiny predicate wrapper: clears a local result, calls TestEventFlagFromImmediate with

  flag EVENT_212 (group 2, number 0x12), and sets the result to 1 when the flag is set.

  The returned value in r0 is also mirrored into the N/Z flags (the final mov r0, r4 sets

  them), so callers may branch directly on the return value. r4 is preserved. The only

  thing it touches is the event-flag state for EVENT_212; nothing else is read or written.

  The contract''s listed r4/r10 inputs are artifacts of caller context — the function never

  reads them.

  '
