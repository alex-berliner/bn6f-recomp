- method: lockstep
  date: '2026-10-09'
  detail: 'The readable version decided on r0 after TestEventFlag(FromImmediate), but that call answers through
    the Z flag (tst r0, r1) and leaves r0 = the flag''s whole byte, nonzero whenever any of the 8 flags sharing
    it is set. With a neighbouring flag set and this one clear, the readable version took the ''set'' path. Fixed
    to test the Z flag (cpu.nz), as the original''s beq/bne does. Found by the story4 recording (Cyber Academy,
    the classroom fire): the port''s palette went dark at game frame 32905 (story5: frame 1120) because the port
    started CutsceneScriptNotification_809AE68, whose screen fades the original never ran. Bisected over the 107
    converted functions executed in frames 32880-32906: switching tryStartNotificationCutscene_8035054 alone back
    to its lifted original made the frames identical. The other three entries were found by sweeping cport/src/game
    for any readable code that tests r0 after a call documented as returning in Z. Why verification passed it: the
    random-input difftest is out of domain for it (the event flags are reached through r10), and no captured call
    or oracle state had a neighbouring flag set with this flag clear.'
