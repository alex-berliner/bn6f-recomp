name: object_endSubObject
address: '0x080BC644'
kind: function
status: probable
summary: If r0 is non-null, stores 0xFF into byte offset 0x11 of the pointed object to mark it as finished/ended;
  otherwise returns immediately.
interface: (r0 = pointer to a sub-object/entry structure, may be NULL) -> r0 clobbered; no return value,
  flags from tst
details: Tests r0 against itself; if non-null it stores the immediate 0xFF into byte offset 0x11 of the
  pointed-to structure and returns. The null check means callers pass possibly-unset pointers. The sole
  caller invokes it on four consecutive pointer fields of a parent structure (offsets 0x60, 0x64, 0x68,
  0x6C), so it is used to terminate or expire up to four child entries in one sweep. Writing 0xFF to a
  small state/counter byte is a typical 'done/dead' marker in BN6 object code, but the exact meaning of
  field 0x11 is not established here.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80BC644: tst r0,r0 / beq return / mov r1,#0xFF; strb r1,[r0,#0x11] — null-checked write
    of 0xFF to byte +0x11; sub_80E7DA4 calls it four times on [r5+0x60], [r5+0x64], [r5+0x68], [r5+0x6C]
    with no use of any result; caller ignores return value and only stores r5 at entry, so the function
    acts purely by side effect on the pointed-to structures'
  refs:
  - bn6f/asm/asm31.s:9657
  - 0x080E7DA4 sub_80E7DA4
  reproduce: python3 tools/asmcat.py 0x080BC644
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the summary: tst r0,r0 / beq null-skip / mov r1,#0xff / strb r1,[r0,#0x11] / bx
    lr. The name `object_killSubObject` is reasonable but not strictly wrong; however the routine doesn''t
    dereference any sub-structure (no fields read beyond byte at 0x11), so it more plausibly just marks
    the sub-object''s state as done/dead. A name like `object_endSubObject` fits the action (setting 0xFF
    as a finished marker) without implying destruction semantics. The summary otherwise accurately describes
    the behavior and the caller''s pattern of iterating four pointer fields at offsets 0x60-0x6C.; run
    wf investigate investigate-20261019-045129; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- what structure type the r0 pointers point to (object? sprite? task?)
- what field 0x11 means in that structure (state, timer, delete flag?)
- what sub_80E7DA4's parent structure is and when this cleanup runs
- 'The code matches the summary: tst r0,r0 / beq null-skip / mov r1,#0xff / strb r1,[r0,#0x11] / bx lr.
  The name `object_killSubObject` is reasonable but not strictly wrong; however the routine doesn''t dereference
  any sub-structure (no fields read beyond byte at 0x11), so it more plausibly just marks the sub-object''s
  state as done/dead. A name like `object_endSubObject` fits the action (setting 0xFF as a finished marker)
  without implying destruction semantics. The summary otherwise accurately describes the behavior and
  the caller''s pattern of iterating four pointer fields at offsets 0x60-0x6C.'
