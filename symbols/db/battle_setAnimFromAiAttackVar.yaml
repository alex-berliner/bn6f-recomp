name: battle_setAnimFromAiAttackVar
address: '0x0810BA40'
kind: function
status: probable
summary: Picks a battle-object animation id from the AI's attack-state variable via a small lookup table,
  skipping the write on a 0xFF sentinel.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = chosen anim id (clobbered); sets CurAnim
  unless table entry is 0xFF
details: Loads r0 = oAIAttackVars_AttackBoost2 from the struct at r7, uses it as an index into the table
  at 0x810BA54 (bytes 08, 07, 09, FF), and if the fetched value is not 0xFF stores it into oBattleObject_CurAnim
  at r5. The 0xFF entry acts as a no-op sentinel, so index 3 leaves the animation untouched. It is a leaf
  function that only touches the caller-provided structs; the table dword_810BA54 = 0xFF090708 decodes
  to the four byte entries. Likely called mid-attack-sweep to swap the boss/enemy animation according
  to the current AI attack phase.
