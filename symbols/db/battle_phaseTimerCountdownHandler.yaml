name: battle_phaseTimerCountdownHandler
address: '0x080BA528'
kind: function
status: probable
summary: 'Battle object phase handler: on phase 0 sets CurPhase=4, CurAnim=0xF, Timer=0x2E and plays sound
  0xAA; decrements Timer each call, plays sound 0x14 at 0x15 remaining, and on reaching 0 sets CurAction=0x14
  and clears CurPhaseAndPhaseInitialized.'
interface: (r5 = battle object) -> mutates oBattleObject_CurPhase/CurAnim/Timer/CurAction; no return value
details: On phase 0 it sets CurPhase to 4, CurAnim to 0xF, plays sound 0xAA (0xAB-1), and stores Timer=0x2E
  via bl sub_80BA6A4 and the strh. While the timer runs it decrements it each call; at 0x15 remaining
  it plays sound 0x14 (a countdown/heartbeat cue), and when it reaches 0 it sets CurAction to 0x14 and
  clears CurPhaseAndPhaseInitialized to 0 so the next action's phase restarts. Everything is done through
  the standard battle-object fields at offsets oBattleObject_CurPhase, oBattleObject_CurAnim, oBattleObject_Timer,
  oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized. The exact meaning of action 0x14
  and what object uses this handler is unknown since no callers are identified.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'strb #4,[r5,#CurPhase]; strb #0xf,[r5,#CurAnim] then bl PlaySoundEffect(0xAA) and Timer=0x2E
    — phase init block; cmp r0,#0x15 / beq plays sound 0x14 — audible cue near the end of the countdown;
    timer reaching 0 sets CurAction=0x14 and zeroes CurPhaseAndPhaseInitialized — handoff to the next
    action; callees are only PlaySoundEffect (0x080005CC) and sub_80BA6A4 — pure state/AV sequencing,
    no rendering or collision'
