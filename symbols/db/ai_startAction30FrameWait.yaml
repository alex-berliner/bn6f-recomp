name: ai_startAction30FrameWait
address: '0x08116758'
kind: function
status: probable
summary: 'AI state handler: on first entry sets substate=1, loads a 30-frame timer, and fires sub_811677A
  once; subsequent entries decrement the timer and reset substate to 0 when it expires.'
interface: (r6 = battle object with AI state fields) -> r0 = 0/1 passthrough from callee call; flags not
  meaningfully used
details: Entry point of an AI state (r6 is the battle object, fields at oAIState_SubState and oAIState_Timer).
  On the first pass (substate 0) it sets substate to 1, loads the timer with 30 frames, and calls sub_811677A
  once — presumably to trigger an animation, effect or movement for this state. On subsequent passes it
  simply decrements the timer each frame; when the counter reaches zero it clears the substate back to
  0, so the next invocation of this state re-runs the initialization and action. Effectively a self-restarting
  30-frame pause with an action at the start of each cycle.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r6,#oAIState_SubState]; cmp/beq pattern guards one-time init (sub_8116758+2); mov r0,#0x1e;
    strh r0,[r6,#oAIState_Timer] sets a 30-frame delay; bl sub_811677A is issued only inside the substate==0
    branch, i.e. once per cycle; timer is decremented every frame and substate is reset to 0 when it hits
    0, restarting the cycle
  refs:
  - bn6f/asm/asm32.s:17010
  - 0x0811677A sub_811677A
  reproduce: python3 tools/asmcat.py 0x08116758
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches: substate 0 sets it to 1, loads timer=0x1e (30), calls sub_811677A; subsequent
    passes decrement timer via sub r0,#1 (not ''each frame'' unconditionally — bne returns early), and
    clear substate when it hits zero. The name ai_pauseLoopWithAction overstates intent (timer is decremented
    in one call, not ''each frame''); r0 is a void passthrough. Better name reflects a delayed, action-triggering
    init+wait.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
