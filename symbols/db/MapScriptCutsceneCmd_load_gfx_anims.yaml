name: MapScriptCutsceneCmd_load_gfx_anims
address: '0x08035F3E'
kind: function
status: confirmed
summary: Cutscene stream opcode that loads a bank of GFX anim scripts (FFStop32-terminated array) into the GFX anim
  pool.
interface: 'void cutsceneCmd_loadGFXAnims_8035F3E(void); // in: r7=cutscene PC, r6=1; out: r0=1 (NZ), r1/r2/r4/r5/r7..r12
  preserved; clobbers r0,r3,r6,LR'
details: 'Reads the u32 payload following the opcode byte from the cutscene byte stream (r7 points just past the
  opcode; r6=1 selects word fetch). The pointer lands in r4 and is forwarded (via r0=r4) to LoadGFXAnims, which
  presumably installs each GFXAnimScript in the FFStop32-terminated array into the running GFX anim pool. After
  the loader returns, the script cursor r7 is advanced by 5 (1 opcode byte + 4-byte u32 payload). Returns r0=1 with
  NZ flags so the cutscene dispatcher continues walking opcodes. No side effects beyond the loader call and pointer
  bump.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
