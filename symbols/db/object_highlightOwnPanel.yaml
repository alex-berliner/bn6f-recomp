name: object_highlightOwnPanel
address: '0x080D4020'
kind: function
status: probable
summary: Wrapper that highlights the battle panel the object currently occupies
interface: (r5 = battle object*) -> r0 = object_highlightPanelRegion result; no flag dependence
details: Takes the object in r5 and forwards its PanelX and PanelY fields plus its AllianceAndDirectionFlip
  halfword as arguments to object_highlightPanelRegion, with the highlight kind fixed at r2 = 0xA. It
  is a parameterless thunk in practice — everything comes from the object struct at fixed offsets. The
  0xA argument is presumably a highlight color/type index used by the panel-highlight routine. Only one
  caller (sub_80D3D22) is known, so the exact in-game trigger for this highlight variant is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PanelX] / ldrb r1,[r5,#oBattleObject_PanelY] feed the tile coordinates;
    ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip] passes team/flip data as the last argument; mov
    r2,#0xA sets a constant highlight type before bl object_highlightPanelRegion; no other work: push
    {lr} ... bl ... pop {pc}, a pure forwarding wrapper'
