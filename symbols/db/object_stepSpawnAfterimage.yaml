name: object_stepSpawnAfterimage
address: '0x080DD6F4'
kind: function
status: probable
summary: During horizontal movement, every 6 frames spawns an 'illusion' afterimage copy of the object
  at its current position while a dash/charge state is active.
interface: (r5 = battle object) -> r0 = 0 (stores reset counter into oBattleObject_ExtraVars+8); no meaningful
  return value
details: Runs only when oBattleObject_ExtraVars+4 (movement/state selector) equals 2; it increments the
  frame counter at oBattleObject_ExtraVars+8 and, once the count reaches 6, spawns an effect object via
  spawnIllusionObject_80E33FA and resets the counter to 0. The effect's packed argument r4 is built as
  bytes [Alliance XOR DirectionFlip][CurAnim][0x0D][0x10], i.e. mirrored side plus current animation identify
  which sprite the afterimage shows. It passes the object's current X/Y/Z as position, 0xA94A as a data/effect
  pointer, and 0xC (likely lifetime or sort priority) as the last argument. The XOR with DirectionFlip
  ensures the afterimage faces the same way as the moving object. r0 is forced to 0 and stored back into
  the counter field on both paths.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'cmp r0,#2 / bne skips: only active in one specific ExtraVars+4 state; counter at ExtraVars+8
    compared to #6 then reset: periodic every-6-frame spawn; eor r4, DirectionFlip with Alliance plus
    CurAnim packed with constants 0xD/0x10: afterimage mirrors the mover''s side and animation; ldr r1..r3
    from oBattleObject_X/Y/Z then bl spawnIllusionObject_80E33FA: spawns the copy at the object''s position;
    called from object_stepMoveX (per-frame horizontal movement step), matching a trail/afterimage during
