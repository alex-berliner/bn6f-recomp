    run wf investigate investigate-20261019-030611'
open_questions:
- What gameplay object type 0x14 is (its initialiser inside object_spawnType1)
- Who calls this and with what source object (sub_80E7208 is undocumented), which would reveal the in-game
  meaning (clone, shadow, trap, etc.)
