summary: Advances the scramble-counter panel's countdown/frame animation, then runs shared cleanup.
interface: void sub_8046E06(void);   // r5 in = state ptr; returns 0 in r0 with NZ set
details: "Animates a scramble-counter UI panel every frame while no chatbox message is active and\nno\
  \ scramble counter is currently being resolved (guard A). Panel state struct (r5-based):\n  +0    strb\
  \ set to 0x10 once frames reaches the threshold (visible \"ID\" sentinel?)\n  +8    strb \"ticker\"\
  \ decremented by 2 per tick; cleared to 0 once it goes non-positive\n  +0xA  strb \"frames\" incremented;\
  \ reset (with +0) when it reaches 0x10\n  +0x28 word passed to checkScrambledCounter_8047366 (scramble\
  \ counter id/handle)\nOn reaching the 0x10-frame milestone, calls SetScreenFade(0xC, 0xC) (likely fades\
  \ in/out\nthe scramble effect). Then unconditionally tail-calls sub_8047134 (shared follow-up step)\n\
  and returns 0.\n"
