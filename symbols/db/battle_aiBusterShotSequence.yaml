name: battle_aiBusterShotSequence
address: '0x080EEA78'
kind: function
status: probable
summary: 'AI buster-shot sequence: sets animation 5 and SFX 0xB0, spawns a type-1/subtype-5 temp attack object (aim
  cursor) and flags it; once StepTimer==0xC spawns a projectile on the front panel via sub_80CF91E with front-panel
  coords, Damage+AttackBoost, and a per-charge byte from the 0x80EEB14 table, giving it XVelocity=8<<16; decrements
  ChargeCycles and re-arms by clearing AttackElement until cycles are spent, then sets HitElement=8.'
interface: (r5 = battle object, r7 = AI attack vars block, set by caller) -> updates oAIAttackVars_* and object
  fields; r0 = scratch
details: On entry with AttackElement==0 it sets animation 5, calls sub_8011450/sub_802CEA6, plays SFX 0xB0, computes
  navi id via battle_getNaviIdFromActor combined with sub_80EBB34, spawns a type-1 subtype-5 temp attack object
  linked to this object, sets ObjectFlags1 bit 1<<22, and initializes StepTimer=0x15 and AttackElement=4. While
  StepTimer==0xC it calls object_getFrontDirection and sub_80CF91E with the front panel X/Y, Damage+AttackBoost,
  InitFlag, ChargeCycles and a per-cycle byte from the table at 0x80EEB14 (01,03,10,01 — likely damage/level per
  charge stage), and on success gives the new object XVelocity = 8<<16. Each time StepTimer counts below 0 it decrements
  ChargeCycles; if cycles remain it clears the object's RelatedObject1Ptr and AIData_TempAttackObjectPtr and resets
  AttackElement to 0 so the sequence repeats, otherwise it sets HitElement=8 and the attack ends on the next pass.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl PlaySoundEffect #0xB0 + bl spawn_t1_0x5_tempAttackObject_80B8E30 in the setup block shows a buster-shot
    attack spawn; ldrb r4, [r4,r3] with r3=oAIAttackVars_ChargeCycles and table bytes 0x01,0x03,0x10,0x01 passed
    to sub_80CF91E shows charge-level-dependent shot power; StepTimer==0xC branch uses object_getFrontDirection
    + oBattleObject_PanelX/Y to place the shot on the panel ahead, then sets XVelocity=8<<16; Tail: ChargeCycles<=0
    sets oAIAttackVars_HitElement=8, else clears RelatedObject1Ptr/AIData_TempAttackObjectPtr and AttackElement=0
    to re-fire; r7 offsets oAIAttackVars_* throughout match the standard Navi-AI attack state block used by other
    AI attack handlers'
