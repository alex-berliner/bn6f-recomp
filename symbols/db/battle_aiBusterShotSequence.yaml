    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- exact meaning of the dword_80EEB14 table bytes (per-charge-level damage vs. animation/effect id) and what sub_80CF91E
  spawns
- which Navi/attack dispatches this handler and what the animation id 5 corresponds to
- The AI spawns a type-1 subtype-5 temp attack object (an aim/cursor-type, not a projectile), then while StepTimer==0xC
  calls sub_80CF91E which appears to spawn the actual buster shot on the panel in front, setting XVelocity=8<<16.
  The summary's claim that the spawned temp attack object IS the projectile is wrong; sub_80CF91E spawns the real
  shot. SFX 0xB0 and animation 5 + the per-cycle byte table (01,03,10,01) are correct. Better name reflects it's
  an AI-driven buster shot sequence.
