name: sprite_updateWrapper_811B45C
address: '0x0811B45C'
kind: function
status: confirmed
summary: Thin trampoline that tail-calls sprite_update and passes its results straight back to the caller.
interface: int sprite_updateWrapper(int arg_r4, int arg_r5) — takes whatever sprite_update expects in r0-r3 (set
  up by the caller), returns sprite_update's r0-r3 and NZCV flags unchanged; r4/r5 are preserved.
details: The function is a pure wrapper — it pushes lr, calls sprite_update, and pops pc, adding no logic of its
  own. It neither sets up arguments nor inspects results, so the actual sprite object/state pointers must already
  be in the argument registers when the caller branches here. The register contract (r4/r5 in and preserved, r0-r3
  and NZCV out) mirrors sprite_update's own contract, confirming this is a pass-through. Likely used as an indirect/overridable
  per-entity update hook or a vtable-style entry point where a caller wants the standard sprite update but may swap
  in specialized variants elsewhere.
