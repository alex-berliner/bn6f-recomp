- battlesweep
open_questions:
- what effect type 0 looks like in game (needs effect-type table or a route where the effect is visible)
- meaning of the packed constant fields in r0/r3 of the spawn wrapper
- r3 is built as 0x10<<0x10 = 0x100000, not 0x100002 as claimed; r4 holds 0x10002 but is never passed
  to spawn_t1_0x0_EffectObject (only r0/r1/r2/r3 are). The r3=0x100000 value still represents a subtype/parameter
  for the type-0 effect, but the proposal's claim about packed constants is incorrect.
