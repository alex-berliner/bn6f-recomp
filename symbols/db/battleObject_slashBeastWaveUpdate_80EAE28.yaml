  date: '2026-10-14'
  detail: '- `strb r2,[r5,#oBattleObject_PanelX]; strb r3,[r5,#oBattleObject_PanelY]` at 0x80EAEB0 writes
    the new panel into BattleObject — confirms this is a battle-object AI update that moves it between
    panels. - The repeated halfword countdown at r6[8] and the state byte at r6[1] (toggled 0->1 on first
    call) make r6 an AI state scratch, and the contiguous references `[r6,#1]/#2/3/8/#0` match `AIAttackVars.Unk_00..0x17/...`
    layout. - `naviAi_changePanel_8013CC4(r5_panelXY)` + `object_updateCollisionPanels` + `object_setCoordinatesFromPanels`
    is the standard battle-AI panel-jump sequence in this codebase. - Constants `0x17`/`0x18` compared
    against NaviStats offset 0x2C correspond to transform IDs (Shark=0x17, Beast=0x18 per BeastOut variables
    in AIData/BN6), gating on beast-mode players. - `bl battle_beastJumpLockOn_8026554` plus its inlined
    offset-0x17 read from `getChip8021DA8` + sub_80E164A + sub_80EAF1A + `getSlashBeastWaveAttackLockonTypeMaybe_80EAF26`
    identify it as the slash-style beast wave jump attack. - Two `sub_80EAFC2` calls with XYZ pushed/spread:
    first with r3=8 then with r3=0 is the "interpolate from old panel through midpoint to new panel" pattern.'
