summary: Initializes a battle object as a Snake-Arm style moving object (loads sprite 0x80/0x14, sets
  anim 0x0B with no shadow, recomputes panel coords, sets element 5 and front-facing X-velocity, allocates
  collision data, configures it as alliance slot 4/element 5 and transitions into CUR_STATE_UPDATE).
interface: '(r5 = BattleObject*) -> void ; side effects: sets r5->CurAnim = 0x0B, r5->Element = 5, r5->XVelocity
  = +1/-1 facing, allocates and initializes a CollisionData block linked to r5, sets r5->CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE'
details: '1. sprite_load(r5, 0x80, 0x14, 5): loads the sprite for the object using sprite-id 0x14 with
  a 0x80-flavored header/palette.

  2. r5->CurAnim = 0x0B via strb + sprite_setAnimation: chooses animation 11.

  3. sprite_loadAnimationData + sprite_noShadow + sprite_update: brings the sprite online, disables the
  shadow, and runs one update so the first frame is valid.

  4. object_setCoordinatesFromPanels: recomputes X/Y from current PanelX/PanelY.

  5. object_getFrontDirection result is stored into r5->XVelocity, so the object starts moving toward
  the enemy line at panel-step speed.

  6. r5->Element = 5 (Aqua, per the BattleObject Element enum convention; the code uses the raw value
  5).

  7. object_createCollisionData: if it returns NULL (tst r0,r0 / bne), the object is freed via object_freeMemory
  and the function returns — the standard "no collision slot" early-out.

  8. Otherwise object_setupCollisionData(r0, 1, 5, 0): fills the new CollisionData with r5''s element/region
  data; the constant 1 is written into collision-type byte 0x4 (Alliance = 1) and 5 into PrimaryElement.

  9. object_presentCollisionData: primes the just-built collision block.

  10. Writes CUR_STATE_UPDATE (0x04) into the combined CurStateActionPhaseAndPhaseInitialized field, so
  the object is immediately active in the update phase.

  The constant set (sprite 0x14, anim 0x0B, element 5, alliance slot 1 with collision 4) is consistent
  with a "snake/arm" sub-boss (e.g. the underwater virus pattern in BN6), but only the init pattern itself
  is grounded in the asm; the in-game role is inferred.

  '
