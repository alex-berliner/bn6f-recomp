    str r0, [r5,#oBattleObject_XVelocity]` writes the +1/-1 facing multiplier into XVelocity (offset 0x40).
    - `mov r0, #5; strb r0, [r5,#oBattleObject_Element]` sets Element (offset 0x0E) to 5. - `bl object_createCollisionData;
