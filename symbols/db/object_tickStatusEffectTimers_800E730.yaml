open_questions:
- The exact gameplay meaning of offsets 0x1c/0x2a/0x2c/0x1e/0x22/0x28 in CollisionData is not named in
  the structs; the matching ObjectFlags1 bit names from CollisionData.inc are the working labels (paralysis/freeze/bubble/confuse/immobilize/blind/invuln)
  but those assignments are inferred from the bit values.
- r4 is set to 1 in the blind path and to 0 in the confused path before each sub_80E09EE call — purpose
  of that selector unknown without seeing the callees.
- The relationship between CurAction values 4/6/7 and the status is guessed from BN series conventions;
  not directly confirmed by strings.
