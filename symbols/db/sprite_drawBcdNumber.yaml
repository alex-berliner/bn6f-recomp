  to queueOamEntry mean
- Whether the 0x1000 flag and the uninitialized low 12 bits of r5 are intentional or caller-guaranteed
  zeros
- 'The code matches the proposal''s mechanics: `orr r5, r2` does indeed read uninitialized r5 (caller-saved
  quirk), and the loop at 0x8132A2C iterates 5 times with r7 starting at 0x1c and stepping by 7, using
  `and r2, r6 #0xf` for the BCD digit. However the proposal''s name `sprite_drawBcdNumber` is fine, but
  the summary''s claim about ''most-significant digit first at the largest offset'' is backwards: r7 starts
  at 28 and decreases, so the first queued digit (LSB of BCD) is placed at the rightmost (largest x) offset.
  Also ''rendering as a row'' is fine, but the BCD is iterated LSB-first from the right, not MSD-first.'
