name: reqBBS_813F754
address: '0x0813F754'
kind: function
status: confirmed
summary: Sets up screen-fade transition parameters in the toolkit's fade block and, when no fade is already running,
  injects a fast-forward command and stamps request code 0x0C into the caller buffer before dispatching the BBS
  transition.
interface: void reqBBS_813F754(u32 r5 /* caller request buffer */, u32 r10 /* toolkit base */); /* returns r0=0,
  r10/r11 propagated from dispatch callee */
details: "Writes six byte fields to the fade-parameter block at\nLD32(r10+oToolkit_Unk200f3a0_Ptr): offset 2=0xFF,\
  \ 3=0,\n6=0x50, 7=0x50, 9=0x1A, 10=0x36 (durations/ranges for the\nscreen fade or wipe).  Calls IsScreenFadeActive;\
  \ if the\nzero flag is clear (a fade IS active) the whole middle\nbranch is skipped and the function jumps straight\
  \ to the\ndispatch call.  When NO fade is active it:\n  - loads the control block at LD32(r10+oToolkit_Unk2009740_Ptr),\n\
  \  - writes 0xF7 to its byte 0 (fast-forward / skip signal),\n  - clears byte 4 and byte 6 (timers),\n  - writes\
  \ 0x0C into byte 0 of the caller buffer r5 (request\n    type stamp),\n  - re-applies the same six fade-parameter\
  \ bytes (belt-and-\n    braces in case the control-block write perturbed them).\nFinally calls reqBBS_813F8F0\
  \ (the actual BBS request\ndispatcher) with r5 set, returns r0=0, and propagates\nr10/r11 out.  r8 and r9 are\
  \ never touched.\n"
