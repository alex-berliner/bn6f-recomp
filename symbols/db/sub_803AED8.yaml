summary: Plays the cursor-move SFX (SOUND_CUR_MOVE_80) and marks the object as having already triggered its movement-cursor
  SFX this step by writing 0x3F to its byte flag.
interface: void playCurMoveSfx_803AED8(struct Obj* r5, uint32_t r2, uint32_t lr); flags clobbered (NZCV), r5 and
  r10 preserved; sets r0 (sound id) for PlaySoundEffect, lr clobbered by bl.
details: 'Calls GameSoundEffect with sound id SOUND_CUR_MOVE_80 (the standard cursor/movement tick sound). Then
  writes 0x3F into the byte at r5+0x8, a flag used elsewhere as a cursor-SFX debounce so the sound is not retriggered
  every frame while the cursor is being moved. r5 is the object/entity structure pointer and r10 is a field pointer
  within it; r2 is an input the function neither reads nor writes.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
