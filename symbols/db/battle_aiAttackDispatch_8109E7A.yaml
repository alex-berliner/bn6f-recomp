name: battle_aiAttackDispatch_8109E7A
address: '0x08109E7A'
kind: function
status: confirmed
summary: Dispatches the AI attack step by jumping through a 3-entry handler table selected by the state byte of
  the current enemy's AI attack variable block.
interface: void sub_8109E7A(r5 in/work, r6 in (preserved), r7 = AI attack vars ptr, lr return); tail-jump into handler(r0
  = state index, r1 = handler address); outputs r1,r5,r8-r12 from the chosen handler, r6 preserved, flags clobbered
details: 'Reads the first byte of the AI attack variable block (oAIAttackVars_HitElement / Unk_00, at [r7]) and
  uses it as an index into the table at off_8109E8C, which has exactly three entries: sub_8109E98 (initial/default
  state), battleObject_beastOutOnTurn_8109EC4 (Beast Out triggered on this turn), and battle_attackTimerExpireExit
  (attack timer expired - exit). The selected handler is entered with r0 = the state index, r1 = the handler''s
  own address (a common self-pointer convention), and r5/r6/r7 passed through unchanged; the call is done via mov
  lr,pc / bx r1 so the handler returns directly to this function''s caller through pop {r6,pc}, making the handler''s
  register state (r1, r5, r8-r12) effectively this function''s output. r6 is preserved across the dispatch by the
  pop. This is a state-machine trampoline in the battle AI attack sequencing, not a routine with its own logic.

  '
