open_questions:
- What sub_802FF10 actually returns and what r3 means (matrix-pair index vs raw slot); the 0x10
- stride suggests two paired slots but the convention isn't visible here.
- The role of the bytes written to [r0,#9] and [r0,#0xa] (palette/affine-index bytes).
- Why some callers (chatbox_/flags_/screenFade_) invoke this with r1,r2 in the 0x40-0x90 range —
- looks like they are reusing it as a generic "fill affine buffer with sin/cos * r3" helper, but
- that's inferred only.
