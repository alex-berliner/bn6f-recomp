  reproduce: python3 tools/asmcat.py 0x080E532C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly correct: it spawns type 0x41, copies alliance, back-links r5 into oBattleObject_RelatedObject1Ptr,
    clears flag 0x10, and calls sub_80E541A with r2=1. However, the bail condition is inverted in the
    proposal: `beq loc_80E5340` skips the bail when sub_80E543C returns nonzero AND r1>=1, meaning the
    function actually spawns when one already exists (or skips when none does) - the proposal claims the
    opposite. Also `object_spawnType4` takes type 4 from params but is called with r0=0x41 as the type
    byte here, not a generic type-4 spawn. The name is acceptable but ''object_spawnLinkedType65Helper''
    references 0x65 which is wrong (type is 0x41).; run wf investigate investigate-20261018-203615; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
