name: object_planOpenPanelAttack
address: '0x080BA84C'
kind: function
status: probable
summary: 'Enemy AI phase handler: after a 30-frame wind-up (anim 7, sound 0xBA), scans open panels ahead
  of the object and picks the attack action (0x10) if any were found, else the fallback action (0x18).'
interface: (r0 = battle object, also in r5) -> r0 = packed panel-offset list head or 0 (side effect, stored
  to oBattleObject_ExtraVars+4); no meaningful return flags
details: 'State machine keyed on oBattleObject_CurPhase: phase 0 initializes (CurPhase=4, CurAnim=7, sub_80BA946,
  PlaySoundEffect 0xBA, Timer=0x1E); phase 4 decrements Timer and returns until it hits 0. Then, if ExtraVars
  is nonzero it calls sub_80E71B8 (probably freeing the previous list in ExtraVars+4), calls object_collectOpenPanelOffsets
  which returns packed (x|y<<4) open-panel offsets ahead of the object (mirrored by alliance) and stores
  the list in ExtraVars+4. If the list is non-empty it sets CurAction=0x10, otherwise CurAction=0x18,
  zeroing CurPhaseAndPhaseInitialized both ways so the object''s action handler restarts at phase 0.'
