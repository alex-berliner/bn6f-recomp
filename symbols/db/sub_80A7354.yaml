open_questions:
- Whether this function is beast-out specific or one of several near-identical CurAction helpers (0x80A7354, 0x80A73A0,
  0x80A75DC, 0x80A7640, 0x80A775C may form a small per-action family under 0x80A72D8); seeing the dispatcher's switch
  would settle whether r6/r5 always point at the same MegaBeast object.
- Sub_80A7640 vs sub_80A73A0 identity (charge-advance vs init) – only call-graph separation hints at it.
