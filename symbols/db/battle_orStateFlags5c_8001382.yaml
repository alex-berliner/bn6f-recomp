name: battle_orStateFlags5c_8001382
address: '0x08001382'
kind: function
status: confirmed
summary: Sets the caller-supplied bit(s) in the current battle state's flags word at +0x5c.
interface: void battle_orStateFlags5c_ADDRESS(u32 bits /* r0 */) ; returns r1 = battle state ptr, r2 = updated flags
  word ; clobbers NZ
details: 'Loads the toolkit''s current battle state pointer from [r10 + oToolkit_BattleStatePtr] (r10 is the global
  toolkit/context register), reads the 32-bit word at oBattleState_Unk_5c, ORs in the bit mask passed in r0, and
  stores the result back to the same field. As a side effect it leaves r1 holding the battle state pointer and r2
  holding the new value of the word, which some callers may rely on. The field is unnamed (Unk_5c), so the exact
  game meaning of these bits is not yet known, but the read-modify-write-with-OR pattern is a standard "raise state
  flag" idiom; callers each contribute their own bit mask, and nothing here clears bits.

  '
