name: state_waitFadeEndThenAdvance
address: '0x080275D8'
kind: function
status: probable
summary: Waits while a screen fade is running, then sets a state field to 4 and clears a counter, advancing
  some state machine once the fade ends.
interface: (r5 = pointer to state struct; byte at +1 = state, halfword at +2 = counter/timer) -> r0 =
  0 on the advance path; no other return value
details: Calls IsScreenFadeActive; if a fade is still active (r0 != 0) the function returns immediately
  without touching state. Once no fade is active, it stores 4 into the byte at [r5,#1] and zero to the
  halfword at [r5,#2], which looks like a next-state id and a per-state timer/counter being reset. The
  r5 struct is not identified, and no callers are known, so which engine object this belongs to (task,
  cutscene step, or NPC state machine) is unclear.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl IsScreenFadeActive + bne locret: early-outs while a screen fade is in progress (asm lines
    2-5); mov r0,#4 / strb r0,[r5,#1]: writes state value 4 into byte field +1 when fade is done; mov
    r0,#0 / strh r0,[r5,#2]: clears the halfword field at +2, consistent with resetting a timer for the
    new state'
  refs:
  - bn6f/asm/asm03_0.s:2505
  - 0x080062F8 IsScreenFadeActive
  reproduce: python3 tools/asmcat.py 0x080275D8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
- No callers known — finding one would identify what struct r5 points to and which subsystem (task/cutscene/NPC)
  owns the state field
- Meaning of the value 4 written to [r5+1] and of the halfword at [r5+2] (timer vs. index) is unconfirmed
