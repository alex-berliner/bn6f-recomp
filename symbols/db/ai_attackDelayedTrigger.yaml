name: ai_attackDelayedTrigger
address: '0x08015128'
kind: function
status: probable
summary: Enemy AI attack step that waits ~20 frames, then fires a table-based effect and cleans up flags
  before leaving the attack state
interface: (r7 = attack-state vars, r5 = battle object; no args read) -> void; no meaningful return
details: On first invocation (AttackElement == 0) it stores StepTimer = 0x14 and sets AttackElement =
  4, acting as an init marker. Every call then decrements StepTimer; while it stays >= 0 the function
  returns early. Once the counter goes negative it writes byte 0xB into entry [oBattleObject_Alliance]
  of the 16-byte-stride table at byte_203EAE0 via setIndexedTableByte, clears bit 0x80 and 0x80000 in
  the object's AI data Unk_0x48 flags and 0x80008600 in Unk_44, clears battle flag 0x20 via battle_clearFlags,
  and calls object_exitAttackState to end the attack.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb/tst on oAIAttackVars_AttackElement with 'mov r0,#4; strb' arms a one-shot init, and StepTimer=0x14
    is the frame delay; sub StepTimer / bge locret shows a countdown gate before the effect runs; bl setIndexedTableByte
    with r0=oBattleObject_Alliance, r1=0xb writes the per-object table byte; three flag-clear calls (0x80,
    0x80000 in Unk_0x48; 0x80008600 in Unk_44) plus battle_clearFlags(0x20) are typical attack-state cleanup;
    bl object_exitAttackState as the final action confirms this is the tail end of an attack behavior
  refs:
  - bn6f/asm/asm00_2.s:14581
  - 0x0800FFEE ClearAIData_Unk_44_Flag
  - 0x0800A2E4 battle_clearFlags
  - 0x0800AB2E setIndexedTableByte
  reproduce: python3 tools/asmcat.py 0x08015128
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-223614'
open_questions:
- What table byte_203EAE0 represents and what value 0xB means (panel state? target selection?) — a caller
  or the table's other writers would clarify
- Which attack/element this state belongs to and what battle flag 0x20 marks; the parent AI state machine
  entry that calls this handler is unknown
