name: InitializeT4BattleObjectStructs
address: '0x08003552'
kind: function
status: confirmed
summary: Thin wrapper that re-initializes all battle-object structs of the T4 (tourney battle) object type by tail-calling
  InitializeStructsOfObjectType with type constant 4.
interface: void InitializeT4BattleObjectStructs(...) — inputs r2, r3, r4, r7, lr (pass-through args and saved regs
  for InitializeStructsOfObjectType); outputs v, r1, r2, r3, r4, r7 from the callee; clobbers nz, c, r0, lr; preserves
  r4, r7.
details: 'Pushes lr, loads the constant T4_BATTLE_OBJECT (4) into r0, then calls InitializeStructsOfObjectType,
  which resets every battle object struct of that object type. This function itself holds no state and does no work
  beyond choosing the object type: r2 and r3 (and the preserved r4/r7) are forwarded untouched to the callee, and
  all outputs are simply whatever the callee leaves behind. The pop {pc} makes it a tail-call in effect. The "T4"
  object type presumably relates to tourney/Tournament-4 battle objects; the exact structure layout and reset semantics
  live in InitializeStructsOfObjectType.

  '
