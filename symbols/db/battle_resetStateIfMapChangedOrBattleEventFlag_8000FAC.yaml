summary: On entering a map, if the destination differs from the last map, or event flag 0x170C is set,
  clear the current battle data pointer and three overworld walk-step counters, then always clear flag
  0x170C.
interface: '() -> ; side effects: may zero GameState.CurBattleDataPtr and three counters in S2001c04;
  clears event flag 0x170C'
details: 'Reads GameState from the Toolkit (r10). Tests event flag 0x170C; if set, jumps to the cleanup
  path.

  Otherwise compares GameState.MapGroup/MapNumber against LastMapGroup/LastMapNumber; if they differ,
  also

  takes the cleanup path. The cleanup writes 0 to GameState.CurBattleDataPtr (offset 0x1c), then to

  S2001c04+0x1c, +0x2c and +0x28 (via oToolkit_S2001c04_Ptr). Finally, ClearEventFlagFromImmediate(0x170C)

  is always called. The captured calls show r0=0x40/0x50/0x64 (fade params) with r3=020047CC (the S20047CC

  pointer used by the caller EnterMap); exit always sets Z flag with r0=0.

  '
