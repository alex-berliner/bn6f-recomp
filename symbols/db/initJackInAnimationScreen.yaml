    the same state object's timer/counter/state fields; bl zeroFillVRAM + bl ZeroFillGFX30025c0 + bl toolkit_applyOverlayPalette_80015FC(9)
    — classic VRAM/GFX/palette reset sequence for entering a screen; ldr r0, =0x1341; bl SetRenderInfoLCDControl
