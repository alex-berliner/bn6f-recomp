name: initJackInAnimationScreen
address: '0x08034268'
kind: function
status: probable
summary: One-time video/GFX setup and state reset that starts the jack-in animation screen (VRAM reset,
  overlay palette, decompressed GFX, LCD control, fade, state fields).
interface: (no args; r5 = global jack-in/animation state object) -> r0 = 0; no flags
details: 'This is a screen/state initializer: it loads overlay palette slot 9 into the render-info write
  area, then wipes VRAM and the toolkit''s 0x2000-byte BG tile buffer so the decompressed jack-in animation
  GFX can be loaded cleanly (decompJackInAnimationGfx_8034314 also primes the r5 animation object). It
  then sets DISPCNT to 0x1341 (BG0/BG1/OBJ enabled, 1D OBJ mapping) in the frame''s render info, stores
  0x50 (frame count?) at r5+4 and clears r5+8 as the animation''s timer/counter fields, requests a screen
  fade via SetScreenFade(0,4), writes state byte 4 to r5+1, and immediately runs one frame-step via sub_80343B0.
  The state object layout (byte +1 = mode/state, halfword +4 = timer, word +8 = counter) matches the chip-select/jack-in
  animation state described for the callee.'
