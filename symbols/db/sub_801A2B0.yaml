name: sub_801A2B0
address: '0x0801A2B0'
kind: function
status: confirmed
summary: Clears a battle object's active-collision state, resetting its flags, collision timer, and restoring its
  Z position from its AI data block.
interface: void battleObject_resetCollisionState(r5 = battle object); // lr in, clobbers r0/lr/nz; contract says
  callers read back r1-r3 (r3 = collision data pointer, r1/r2 unmodeled)
details: 'Operates on the battle object passed in r5. Calls object_clearFlag with 0x80000000 and object_clearFlag2
  with 0x20000, clearing what are likely "in collision" / "locked" status bits on the object''s two flag fields.
  It then loads the object''s collision data pointer (oBattleObject_CollisionDataPtr) and zeroes the halfword timer
  at oCollisionData_Unk_2c (offset 0x2c), which appears to be a per-collision counter/elapsed timer. Finally it
  reads a halfword from oAIData_Unk_3c (offset 0x3c of the AI data block) and stores it into oBattleObject_Z16,
  restoring the object''s Z coordinate to the value its AI data says it should have - i.e. undoing any Z displacement
  caused by the collision state (e.g. being lifted, floated, or knocked airborne). Leaves the collision data pointer
  in r3 and the restored Z value in r0, though callers per the contract only rely on r1-r3. The 0x80000000 / 0x20000
  flag pairs and the Z restore suggest this is the "end of collision state" cleanup shared by whatever collision-handling
  code paths call it.

  '
