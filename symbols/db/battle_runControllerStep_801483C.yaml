status: probable
summary: Dispatches a battle controller state to one of three step handlers indexed by an internal byte.
interface: '(no caller-supplied inputs) -> r0 = sub-handler''s r0 ; side effects: reads controller-state
  byte at dword_20367F0, calls one of three handlers, returns handler''s r0 and writes handler''s r0 back
  to dword_20367F0+4.'
details: "Loads a base pointer (r5) from dword_20367F0, then uses the byte at [r5] as an\n  index into\
  \ a 3-entry table at off_8014860. With r0 holding the table and r1 the\n  index, it does `ldr r1, [r1,\
  \ r0]; bx r1` — a Thumb->Thumb dispatch via Thumb\n  bx. After the dispatched routine returns, it reads\
  \ byte [r5, #4] (i.e. the\n  next state slot in the controller struct) and pops with lr as the return.\n\
  \  The controller struct base is shared between two callers (both in the pre-battle\n  intro step at\
  \ 0x0800840c and 0x08008492), so r5/byte_0 and byte_4 belong to the\n  same per-controller state block.\
  \ The three dispatch targets are\n  sub_801486C (case 0), sub_80148CC (case 1), and sub_8014A00 (case\
  \ 2). Return\n  values seen in captured calls are 0/1 (boolean-looking), matching typical\n  \"did the\
  \ controller finish a step\" semantics. The function is `void`-shaped\n  from the caller contract perspective:\
  \ r0 is read by callers as a result, but\n  the contract lists it as out, and sub-handlers are responsible\
  \ for it.\n"
