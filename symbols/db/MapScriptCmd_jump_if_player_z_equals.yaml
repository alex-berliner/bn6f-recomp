name: MapScriptCmd_jump_if_player_z_equals
address: '0x08035BD6'
kind: function
status: confirmed
summary: 'Map-script opcode: read a signed halfword and jump to a 4-byte target if the overworld player''s Z coordinate
  equals it.'
interface: '// r10 = oToolkit*, r7 = current map script PC

  // returns r7 = next script PC; r0 = 1; NZ flags reflect r0

  // clobbers r0, r4, r6, lr; flags c/v

  void MapScriptCmd_jump_if_player_z_equals(u32 /*r10*/ toolkit, u32 /*in/out r7*/ scriptPc);

  '
details: 'Follows oToolkit_GameStatePtr -> oGameState_OverworldPlayerObjectPtr and reads

  oOWPlayerObject_Z (a fixed-point world Z; shifted right 16 to get integer Z).

  Calls ReadMapScriptSignedHalfword(r6=1) to fetch a signed-halfword operand and

  advance past opcode + 2 bytes. If player Z != operand, advances PC by 7

  (1 opcode + 2 halfword + 4 unused trailing bytes). If equal, calls

  ReadMapScriptWord(r6=3) to consume the trailing 4 bytes as the jump target,

  returning its value as the new PC. Always returns 1 in r0 and sets NZ on r0.

  Mirrors the companion opcodes (`MapScriptCmd_jump_if_player_y_*`, etc.).

  '
