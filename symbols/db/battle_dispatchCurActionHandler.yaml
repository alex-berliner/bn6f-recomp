name: battle_dispatchCurActionHandler
address: '0x080BA3D8'
kind: function
status: probable
summary: Dispatches to the per-action state handler for the battle object's current action (CurAction
  index).
interface: (r5 = battle object, no args) -> tail-jumps to handler table[CurAction]; returns whatever the
  handler returns
details: 'Reads oBattleObject_CurAction (byte at [r5,#CurAction]) and indexes off_80BA3EC, a 10-entry
  thumb handler table, calling the selected handler via ''mov lr,pc; bx r1'' then returning with its result
  in pc. Table entries are known battle phase handlers: a local init (sub_80BA414), battle_wait30FramesThenStartAction8,
  battle_phaseWaitTimerHandler, battle_leapForwardPhaseHandler, several local sub_80BA5xx handlers, and
  battle_deathAnimStateHandler — consistent with a state machine for one object''s action (e.g. leap forward
  then death). It takes no arguments in r0-r3; the object must already be in r5, implying it is itself
  installed as a state handler. The +1 on each table entry confirms thumb addresses.'
