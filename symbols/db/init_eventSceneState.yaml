name: init_eventSceneState
address: '0x08128CD8'
kind: function
status: probable
summary: 'Init for a story-event scene state: sets EVENT_197/1AD, resets VRAM/palette/BG tile buffer,
  loads BG/text GFX, spawns scene eStructs, optionally decompresses a text script, then transitions to
  state 4.'
interface: (r5 = scene state struct, preserved from caller) -> void; sets r5+0x1e = event flag list handle,
  r5+0xc/0xd = resolved state, r5+1 = 4
details: Sets story flags EVENT_197 and EVENT_1AD, then zero-fills VRAM, the palette buffer at 0x3001960,
  and the 0x2000-byte GFX block at 0x30025c0, and applies palette 8. Writes 0x1F40 to the toolkit render
  info word and zeroes six halfword fields at +0x10..+0x1a. Loads two graphics blocks (0x9070 bytes to
  VRAM 0x6008E00, 0x9060 bytes to 0x6008C00) through byte_201BB60, resets the eStruct record array and
  spawns records from the table at byte_8128CB0. If getEventFlagList(byte_201BDB8) is non-zero it also
  loads 0x90D4 bytes to 0x6009A80 and decompresses the text script into eTextScript201BA00 via byte_201BDB8.
  Resolves the current state name from dword_8129180 (advanceAnimTableBy0xFF helper), stores it at r5+0xc/0xd,
  inits r5+0xf=0 / r5+0x10=-1 (the -1 store is written twice), sets a screen fade (8, 0x10), then stores
  state 4 at r5+1 and runs entity update handlers plus battle_updateEStructSprites. The duplicate strb
  to r5+0x10 and duplicated off_8128D9C lookups are compiler quirks.
