name: battle_checkAttackAnimEnd
address: '0x0810A51E'
kind: function
status: probable
summary: 'Per-frame check: when the current attack animation reaches its end-flagged frame, reset the
  animation and leave the attack state.'
interface: (r0 = battle object) -> r0 = destroyed; also requires r5 = same battle object; no meaningful
  return
details: Calls sprite_getFrameParameters on the object and tests bit 0x80 of the returned attribute byte,
  the 'last frame / animation finished' flag. If set, it stores 0 into oBattleObject_CurAnim (restart/neutralize
  the current animation) and calls object_exitAttackState to return the object to its normal state. It
  is a small conditional hook, almost certainly invoked after an animation frame advances for objects
  in an attack state. The value in r0 after the call is clobbered (sprite_getFrameParameters result or
  0).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sprite_getFrameParameters; tst r0,#0x80 tests the frame attribute's end flag; strb r0,[r5,#oBattleObject_CurAnim]
    with r0=0 clears the current animation index; bl object_exitAttackState only runs when the end flag
    is set; both callees are known sprite/battle-object helpers, matching an attack-animation terminator
  refs:
