name: CheckIfThunderObjectFindsOpponentByGoingRight
address: '0x080C9620'
kind: function
status: confirmed
summary: Scans rightward from a battle object's panel column across 4 rows looking for an opponent (used by Thunder
  chip's pathing).
interface: u32 thunderScanRightForOpponent_80C9620(u8 opponentMask, const BattleObject* obj); /* returns panelX
  in r6, last-y in r7; r4 preserved */
details: 'Reads `oBattleObject_PanelX` from the battle object in r5, then iterates columns from that x to 6 inclusive.

  For each column, iterates y = 3 down to 0 and calls `object_getPanelParameters(x, y)`. If the returned bitmask

  (in r0) ANDs with the opponent mask in r4, the search succeeds and exits with r6=x, r7=y.

  If the column index would reach 7, sets it to 0 (presumably wrapping to column 0 / no-op column) and exits

  with the fail sentinel (r6=0). Note that y is never actually decremented to 0 in the failing case — the

  inner loop''s break on y==0 still leaves r7=0 implicitly, but only the success path is relied upon.

  The "rightward" traversal and the role of r4 as an opponent-side mask suggest this is the right-going leg

  of a Thunder chip''s bolt path finding (the symmetric left-going helper would be a sibling routine).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
