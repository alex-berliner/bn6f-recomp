name: battle_trackSelectedChipHold
address: '0x080DB1E0'
kind: function
status: probable
summary: Every 5 frames, counts how long a battle actor's hand cursor stays on the same selected chip
  (if the chip has flag 0x02), recording per-slot hold counters in the hand struct.
interface: (r5 = battle object) -> void; no return value
details: One-shot init sets oBattleObject_CurAnim=1, Timer2=0 and PhaseInitialized=4, then Timer2 gates
  the body to run every 5 frames. It fetches the object's selected chip via battle_getSelectedChipForUse
  and looks it up in the chip database; only if ChipData byte 9 has bit 0x02 does it proceed. It snapshots
  hand[0] (cursor/selected slot index) and hand[0x3E+slot] into ExtraVars[0..1]; if either changed from
  the previous tick it resets the ExtraVars[8] hold counter. While unchanged and below 0x32 (50 ticks
  = 250 frames), it increments a 16-bit per-slot counter at hand+0x1A+2*slot and ExtraVars[8]. The counters
  live inside the shared 0x50-byte hand structure at 0x20349C0, so this data is presumably read elsewhere.
