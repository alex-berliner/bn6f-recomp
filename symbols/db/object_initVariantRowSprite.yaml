    reconcile)'
open_questions:
- Which in-game object/entity type 0x23 and sprite resource 0x25 represent (no callers known)
- Meaning of the halfword 0x240-0x48*i stored through slotList_storeHalfwordAndClearField_800306C
- Whether 0xB0 is the x or y argument to sprite_setCoordinates and what coordinate space it uses
- The code confirms most details (type 0x23, resource 0x25, initGuiSprite_8002770, anim 1, noShadow, priority
  3, the nine entry tables at off_811B530 and byte_811B55C, and state bytes). However the proposal claims
  palette bank 0 via sprite_setSubEntryPaletteBank, but the assembly actually calls sprite_setSubEntryPaletteBank_800304A
  with r0=[r5+4] (the variant index) and r1=0, so r0 is the variant index, not zero. Also the variant
  index is added with `add r0, r0, r1` (where r1=0), not passed as a separate palette argument. The name
  is reasonable but the palette detail is wrong.
