summary: 'Initializes a kind-0x23 object: writes kind byte, calls loc_8002774 with 0x66, runs the standard
  sprite init block (animation 0, load anim data, no shadow, palette bank 0xF, subrecord A=0, priority
  0, palette 0), stores selector 0x2A8 via slotList, and sets byte [r5+8]=4 before tail-calling sub_811E980.'
interface: (r5 = object ptr, clobbers r0) -> r0 = result of last callee; object fields at [r5], [r5+8]
  written
details: 'Writes 0x23 to byte 0 of the object struct at r5 (the entity/kind ID) and calls loc_8002774
  with r0=0x66, likely a shared sprite-resource or sub-ID setup. It then performs the standard sprite
  initialization block: sprite_setAnimation(0), sprite_loadAnimationData(), sprite_noShadow(), palette
  bank 0xF via sprite_setSubEntryPaletteBank_800304A, subrecord field A = 0, OAM priority 0 and palette
  0. It stores a caller-table halfword using selector 0x2A8 via slotList_storeHalfwordAndClearField_800306C,
  sets byte [r5+8] to 4, and finally calls sub_811E980 before returning. The mix of generic sprite defaults
  with two magic constants (0x23 kind, 0x66, 0x2A8) marks this as the init routine of one specific object
  type.'
