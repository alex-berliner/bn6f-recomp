name: SetBeastOutCounterTo3
address: '0x080141AC'
kind: function
status: confirmed
summary: Sets the current PET navi's Beast Out counter to 3, re-arming the Beast Out turn limit (e.g. when a Beast
  Out transformation ends).
interface: 'void SetBeastOutCounterTo3(void); /* in: r10 (PET context used by GetCurPETNavi), lr; clobbers r0-r3,
  flags; returns to caller via pop {pc} */'
details: Trivial wrapper. Calls GetCurPETNavi () -> u8 to get the current navi id, then calls SetCurPETNaviStatsByte(naviId,
  oNaviStats_BeastOutCounter, 3) to write the value 3 into the NaviStats BeastOutCounter byte. In game terms this
  restores the full Beast Out countdown (3 turns) to the navi's stats — the value 3 matches the Beast Out duration,
  so this appears to reset/re-arm the timer, likely when a Beast Out state is ended or re-entered. The three trailing
  .words (0x12C=300, 0x258=600, 0x104=260) are pool data after the function body, unrelated to this routine.
