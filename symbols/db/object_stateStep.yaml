name: object_stateStep
address: '0x080D0132'
kind: function
status: confirmed
summary: Steps one battle object's state machine - destroys it if the battle is over or its related object is not
  in action 0xA, otherwise dispatches its action handler unless time is stopped.
interface: void object_stateStep(u32 r2 arg, BattleObject* r5 obj, BattleContext* r10 battleCtx); destroys via CUR_STATE_DESTROY
  in oBattleObject_CurStateActionPhaseAndPhaseInitialized or tail-dispatches the action handler; clobbers r0-r3,
  r6, r7, flags and lr; preserves r4; outputs r5, r8-r12 follow the handler
details: 'Per-frame stepper for a battle object held in r5 (r10 carries the battle context that the battle_* helpers
  read from the guest register). First calls battle_isBattleOver; if the battle has ended, the object''s state word
  oBattleObject_CurStateActionPhaseAndPhaseInitialized is set to CUR_STATE_DESTROY and the function returns. Otherwise
  it loads the object''s RelatedObject1Ptr partner and reads the partner''s oBattleObject_CurAction; if that action
  is not 0xA (PARTNER_ACTION_GATE), the object is likewise destroyed. If the partner is in action 0xA, battle_isTimeStop
  is called; while time is stopped (Z flag clear on return) the step is simply held - no destroy and no handler
  call. Otherwise the object''s own oBattleObject_CurAction byte indexes the table at off_80D0164 (whose entry points
  at battle_timedHitCheckUpdate and, presumably, further handler words), and the selected handler is invoked with
  r0 = action, r1 = handler address, r2 = forwarded caller argument, r5 = object, using the mov lr, pc / bx r1 trick
  so the handler can return past the following branch. Quirk: r1 is loaded with the handler''s own address before
  the call, so handlers receive their entry point as an argument. The handler''s register side effects (r0-r3, r6-r7
  clobbered, r5 and r8-r12 as it leaves them) propagate to the caller unchanged.

  '
