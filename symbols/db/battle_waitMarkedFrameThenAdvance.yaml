name: battle_waitMarkedFrameThenAdvance
address: '0x080C1786'
kind: function
status: probable
summary: Waits for a sprite frame flagged with attribute bit 0x80, holds 16 more frames, then sets the
  object's action to 8 and clears its phase.
interface: (r0-r4 = battle object, used via r5 base) -> void; sets oBattleObject_PhaseInitialized, Timer,
  CurAction, CurPhaseAndPhaseInitialized
details: Runs per-frame on a battle object. Until oBattleObject_PhaseInitialized is set, it calls sprite_getFrameParameters
  and tests bit 0x80 of the frame's attribute byte; when that frame is reached it sets PhaseInitialized=1
  and loads oBattleObject_Timer with 0x10. Each subsequent call decrements Timer, and on reaching 0 it
  writes CurAction=8 and zeroes CurPhaseAndPhaseInitialized, moving the object into its next action/phase.
  The 0x80 attribute bit thus acts as a 'wait until this frame' marker with a fixed 16-frame tail delay.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl sprite_getFrameParameters then tst r0,#0x80 gates the whole sequence (frame attribute check);
    mov r0,#1; strb [r5,PhaseInitialized]; mov r0,#0x10; strh [r5,Timer] arms a 16-frame delay; ldrh/sub/strh
    on Timer with bne-locret is a standard per-frame countdown; on expiry: strb #8 to CurAction and strh
    #0 to CurPhaseAndPhaseInitialized advances the state machine'
