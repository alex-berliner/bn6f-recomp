name: battle_destroyWithRelatedUnlink
address: '0x080D123C'
kind: function
status: probable
summary: Clears the back-pointer a related battle object holds to this one, then destroys this object.
interface: (r0 = this battle object, r5 must also hold it) -> r0 = destroyed; no meaningful return
details: Reads [r5+oBattleObject_RelatedObject1Ptr]; if the related object exists, stores 0 into its oBattleObject_ObjectHeader
  field, which is evidently a pointer back to this object, detaching the pair's link. It then falls through
  to object_genericDestroy, releasing this object's panel tile reserves, collision data, and memory. Note
  the pointer is fetched via r5 while the destroy call passes r0, so both registers must reference the
  object on entry. This suggests RelatedObject1 is a paired/tethered entity whose header pointer must
  be nulled before teardown so the partner never dereferences a dead object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]; cmp/beq: only nulls the link when a related object
    exists; str r1(=0),[r0,#oBattleObject_ObjectHeader]: writes NULL into the related object''s header
    field before teardown; bl object_genericDestroy: known generic battle-object destructor, so this is
    a destroy-path routine; no other reads/writes and only 9 instructions: pure unlink+destroy wrapper'
  refs:
  - bn6f/asm/asm31.s:54347
