name: battle_destroyWithRelatedUnlink
address: '0x080D123C'
kind: function
status: confirmed
summary: Clears the linked related object's owner pointer and then destroys this battle object.
interface: battle_destroyWithRelatedUnlink(void); takes the battle object in r5 (also lr), calls object_genericDestroy(r5),
  and returns the (updated) object pointer in r5
details: 'Wrapper around object_genericDestroy that first severs one direction of an object link.

  Reads oBattleObject_RelatedObject1Ptr from the battle object in r5; if non-null, it stores 0

  into that related object''s oBattleObject_ObjectHeader field, so the related object no longer

  points back at (references) the object about to be destroyed. It then falls through to

  object_genericDestroy, which performs the actual destruction of the r5 object and returns the

  updated pointer in r5 (back through this wrapper to its caller). r5-r7 are preserved; the

  related object itself is NOT destroyed here — only its back-pointer/header is nulled, so it

  presumably outlives this object or is handled elsewhere.

  '
