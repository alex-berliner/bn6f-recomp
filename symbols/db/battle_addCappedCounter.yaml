name: battle_addCappedCounter
address: '0x0802E032'
kind: function
status: probable
summary: Adds an amount to a battle-entity's 16-bit counter at field 0x28, saturating at 0x4000.
interface: (r0 = entry index in the 0x1D0-stride array at unk_2036120, r1 = amount to add) -> r0 = new
  saturated counter value; flags from the cmp are clobbered by the final stores path (returns updated
  value in r0).
details: It fetches the record pointer via getEntryPtr_2036120_1D0_802E070 (base 0x2036120, stride 0x1D0),
  loads the halfword at +0x28, adds r1, clamps the sum to 0x4000 with a ble/ mov saturation, and stores
  it back. The array at 0x2036120 with 0x1D0-byte entries is a battle-side entity/state table, and the
  caller battle_handleCollisionCrouchSlideReset_801A45C operates on the same per-object structures, supporting
  a battle subsystem prefix. The 0x4000 ceiling suggests a gauge- or charge-style accumulator rather than
  HP. r0 is reused as the loaded value, so the entry argument is destroyed.
