name: battle_actPlaySoundThenExit
address: '0x080CC868'
kind: function
status: probable
summary: 'Battle-object action step: on phase 0 play sound 0xB7 once and store Param2 into Timer; on subsequent
  calls decrement Timer, and when it expires set CurAction=4 and zero CurPhaseAndPhaseInitialized to end
  the action.'
interface: (r5 = battle object) -> void; updates oBattleObject_CurPhase, oBattleObject_Timer, oBattleObject_CurAction
details: On phase 0 it stores 4 into oBattleObject_CurPhase, plays sound effect 0xB7 via PlaySoundEffect,
  and copies oBattleObject_Param2 into oBattleObject_Timer as a frame countdown. On subsequent calls it
  decrements oBattleObject_Timer until it goes below zero. When the timer expires it sets oBattleObject_CurAction
  to 4 and zeroes oBattleObject_CurPhaseAndPhaseInitialized, returning control to the object's action
  scheduler. The 4 written to CurPhase mid-step and the shared phase/action fields indicate this is one
  step of a scripted action sequence.
