  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; tst; bne — phase-0-only setup block typical of action
    steps; bl PlaySoundEffect with r0=0xB7 only in the phase-0 branch; ldrb r0,[r5,#oBattleObject_Param2];
    strh r0,[r5,#oBattleObject_Timer] — timer seeded from a per-instance parameter; sub r0,#1; bge loop
    on oBattleObject_Timer — frame countdown until expiry; mov r0,#4; strb r0,[r5,#oBattleObject_CurAction]
