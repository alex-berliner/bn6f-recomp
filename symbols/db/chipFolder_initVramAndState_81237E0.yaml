  detail: '- `push {r4,lr}`; `mov r4, r0`; the same r4 controls the only `beq loc_8123830` branch, confirming
    r0 is a one-shot init flag. - All zero stores use r5 as base pointer and offsets 0x10..0x3a match
    the upper half of oSubMenu/JumpTable struct used by the chip folder. - `str r1, [r5,#0x4c]` and `strh
    r0, [r5,#0x..]` show r1 is a table or script pointer associated with the screen. - `bl battleObject_advanceAnimTableBy0xFF_8120CC8`
    with index 0 -> the lsl+orr pattern packs two bytes into one; result stored at +0x12. - `bl GetCurPETNavi`
    and the immediate `strb r0, [r5,#0x14]` confirm +0x14 holds the current navi index. - `tst r4,r4`
    then `beq loc_8123830` skips both `zeroFillVRAM` and `ZeroFill_byte_3001960`, gating hardware clears
    behind first-init. - `bl GetCurPETNaviStatsByte` with `r0=currentNavi`, `r1=0x2d` and result stored
    at +0xc. - `bl toolkit_applyOverlayPalette_80015FC` with `r0=0x10`, then `ldr r1,=0x1f40 ; strh r1,
    [r0]` writes 0x1F40 to RenderInfo+0 (likely a BG mode/control register pair). - `mov r0,#8 ; mov r1,#0x10
    ; bl SetScreenFade` queues a fade of style 8 with parameter 0x10. - Final `strb r0, [r5,#2]` zeroes
    submenu byte +2.'
