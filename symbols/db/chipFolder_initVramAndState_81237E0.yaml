open_questions:
- Exact role of +0x12 (anim-derived panel/coord). The pack-into-one-byte result of `advanceAnimTableBy0xFF`
  may actually be a sprite-tile selection rather than PanelX.
- Semantics of r4 (firstTimeInitFlag) – name follows from the `tst/beq` pattern but the project doesn't
  yet have a constant for it.
- The render-info halfword 0x1F40 and palette slot 0x10 specifics (BG3 priority / mosaic) are inferred
  from the toolkit helpers, not from labelled offsets.
