status: probable
summary: Initialize the chip folder screen state, clear VRAM/palette/BG tile blocks, fetch the current
  Navi palette idx, apply a default palette, and queue a screen fade.
interface: '(r0 = firstTimeInitFlag, r1 = ptr stored at submenu+0x4c) -> void ; side effects: writes submenu+0x10..0x3a,
  +0x4c; clears VRAM and IWRAM 0x3001960; zeroes BG tile ID block at 0x30025c0; sets render info 0x1f40;
  calls SetScreenFade(0x8, 0x10).'
details: '- r0 (saved in `r4`) is used as a "first-time init" flag: only when nonzero does the function
  zero VRAM and zero the small palette buffer at IWRAM 0x3001960 (ZeroFill_byte_3001960). It is the same
  `r4` flag pushed at entry, so its meaning is "do expensive hardware reset on first call only".

  - The state struct being initialized is at r5 (the toolkit->SubmenuPtr, since the chip folder uses the
  SubMenu subsystem; matches SubMenu struct oSubMenu being small but accessed at offsets up to 0x4c).
  Offsets cleared/initialised: 0x10,0x11 (bytes 0), 0x12 (panelX), 0x14 (futurePanelX), 0x18 (preventAnim),
  0x20..0x3a (joypad held/pressed/up/release, HP/MaxHP, Damage, StaminaDamageCounterDisabler, Timer, Timer2).
  Then stores r1 at +0x4c.

  - `battleObject_advanceAnimTableBy0xFF_8120CC8` is called with index `0` against a small animation table
  `dword_81233D4`; the resulting two-byte "X|Y" gets OR''d into r0 and stored as a single byte at +0x12
  (PanelX). This matches the way BN6 packs a per-frame panel coordinate from an anim table.

  - Current PET Navi index is fetched (`GetCurPETNavi`) and stored at +0x14. When first-time init, `GetCurPETNaviStatsByte`
  is called with offset `0x2d` (`FloatShoes`?) and stored at +0xc.

  - After VRAM clear: `toolkit_applyOverlayPalette_80015FC(0x10)` applies palette slot 0x10 to the toolkit
  render write area; the render info''s first halfword is then written with `0x1F40` (probably a brightness/alpha/BG
  mode bits) and 0x10..0x1a are zeroed.

  - Submenu+1 = 0x4 (probably a state/jump table index), submenu+2 = 0, and SetScreenFade(8, 0x10) is
  queued.

  - Callee `GetCurPETNaviStatsByte(0x2d)` with the in-game NaviStats struct implies +0xc is a copy of
  the FloatShoes navi stat byte (offset 0x1b in struct, but this callee applies a caller-chosen offset,
  so it''s a user-defined slot for navi-specific data).

  '
