    r0,#0xb7; bl PlaySoundEffect — fixed sound effect tied to the state transition; mov r0,#0xc; strb r0,[r5,#2]
    — writes new state 12 into the object's state byte; bl sub_803A422; mov r0,#0; pop — per-frame helper then returns
    0 like other object step handlers
