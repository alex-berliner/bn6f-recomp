name: object_timerTransition
address: '0x0803A39C'
kind: function
status: probable
summary: Per-frame battle-object step that decrements a counter at [r5+0x1a]; when it reaches 0, loads a GFX anim
  script (byte_80392D8), plays sound 0xB7, and writes state 0xC to [r5+2], then calls sub_803A422 and returns 0.
interface: (r5 = object struct, r0-r4 unused on entry) -> r0 = 0; no flags meaningful
details: 'This is a per-frame object routine: it decrements the countdown byte at [r5+0x1a] and, while it is still
  positive, only calls sub_803A422. Once the counter reaches 0, it calls LoadGFXAnim with the anim-script pointer
  stored at off_803A3C0 (byte_80392D8), plays sound effect 0xB7 via PlaySoundEffect, and writes 12 into the object''s
  state/behavior byte at [r5+2]. Every path ends by calling sub_803A422 and returning 0, which is the standard ''keep
  object alive'' return for battle object step handlers. Because r5 is never set up inside, the caller must place
  the object pointer in r5 before invoking it. The anim/sound/state values suggest a one-shot timed event (e.g.
  a charge-up or fuse) that transitions the object to its next behavior.'
