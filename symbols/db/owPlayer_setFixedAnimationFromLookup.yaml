name: owPlayer_setFixedAnimationFromLookup
address: '0x0809C814'
kind: function
status: probable
summary: Reads an index from an object field and sets the overworld player's fixed animation to a table-mapped
  animation id.
interface: (r5 = context object, no args) -> r0 = 0; calls owPlayer_setS200ace0_fixedAnimationSelect with
  mapped animation id
details: Loads a sub-structure pointer from [r5+0x70] and reads a byte at +0xC as an index. Uses that
  index to look up a byte in the 4-entry table dword_809C82C (bytes 01 03 05 07), mapping indices 0-3
  to animation ids 1,3,5,7. Passes the mapped id (and the table pointer in r1, likely vestigial) to owPlayer_setS200ace0_fixedAnimationSelect,
  which stores it into eStruct200ace0 and raises EVENT_1719. Always returns 0, suggesting it is a script/event
  step handler. The 4-way mapping suggests a state (e.g., form or transformation) selecting among four
  fixed player animations.
