name: owPlayer_setFixedAnimationFromLookup
address: '0x0809C814'
kind: function
status: confirmed
summary: Reads the player's overworld state index and applies the matching fixed animation id from a small lookup
  table.
interface: void owPlayer_setFixedAnimationFromLookup(r5 player, r10 context) -> r0 = 0 (Z set, N clear), r3 = callee's
  r3, r4/r5/r7 preserved
details: 'Loads [player+0x70], a pointer to a shared state block, reads its byte at offset 0x0C as a pose/state
  index, and uses that byte to index the table dword_809C82C (whose four bytes are 1, 3, 5, 7) to get an animation
  id. That id is passed in r0 to owPlayer_setS200ace0_fixedAnimationSelect_809e13c, which actually applies the animation.
  r10 must still hold the caller''s value for the callee (likely a sprite/animation context pointer); r4, r5 and
  r7 are pushed/popped so they survive the callee unchanged and are visible to the caller after return, along with
  the callee''s r3. Always returns r0 = 0 with Z set and N clear via "mov r0, #0". Only the first four entries of
  dword_809C82C are meaningful here (the word packs 0x7050301); indices 0-3 map to animations 1, 3, 5, 7 - the odd
  animation ids suggest state indices step through a fixed animation set in pairs.

  '
