status: probable
summary: Draws the PET navi's current HP as 4 OAM digits in the Internet overworld UI, copying a sprite
  template for the current HP block.
interface: (no r0-r3 contract documented by caller) -> side effects only; mutates [r5+0x8] and queues
  OAM sprites
details: "1. Tests event flag 1732 (movflag EVENT_1732 + TestEventFlagFromImmediate); if set, jumps to\
  \ the draw loop at loc_8033E6A, skipping the HP \"smoothing\" branch entirely.\n  2. In the smoothing\
  \ branch it calls GetCurPETNavi + GetMaxAndCurHPForCurPETNavi_80010D4 to read curHP (r1), then compares\
  \ it with the previous value stored at [r5+0x8] (a u16 working slot in the caller-provided context object).\n\
  \     - r6 holds the \"delta direction\" tag: 0=no change, 1=curHP dropped more than 4 below the cached\
  \ value, 2=curHP rose more than 4 above it. Otherwise the cached value is simply overwritten with the\
  \ fresh curHP and r6 stays 0.\n     - The +4 / -4 hysteresis is applied to the *cached* value before\
  \ comparing (sub r0,#4 / add r0,#4), so small HP changes (<=4) don't update the display, but a single\
  \ jump of >4 does, and the cached value snaps to the new curHP either way.\n  3. After re-reading curHP,\
  \ it computes r1 = curHP >> 2 (i.e. curHP / 4, the bar segment index) and selects a sprite-template\
  \ offset via r2:\n     - r6==0 (steady): pick one of three slots in `byte_86C1F20` -- base (0x20) if\
  \ maxHP >= curHP/4 (r0 is the maxHP returned earlier? actually r0 holds maxHP at that point), else 0;\
  \ otherwise lsl r2,r6,#5 to use one of the per-direction slots.\n     - Then CopyByEightWords copies\
  \ 0x20 bytes (8 words) from `byte_86C1F20 + r2` into the EWRAM buffer at `byte_30016D0` -- an OAM template\
  \ area.\n  4. At loc_8033E6A it converts the cached HP value at [r5+0x8] to 8-digit packed BCD via memory_bcdConvert,\
  \ then walks 4 digits by shifting r7 (starting at 0xc, decrementing by 4) and masks 4 bits. It tracks\
  \ a \"leading-zero suppression\" flag in r8/r4: once a non-zero digit is emitted, r8=1 and subsequent\
  \ digits display; leading zeros (and the very first nibble while still zero) are replaced with OAM tile\
  \ id 0xb (a blank/space tile). Each digit is queued through sprite_queueOamEntryThunk_802FE28 with attribute\
  \ word 0x8000 | (tileRow<<16) -- the tileRow is 8/0x10/0x18/0x20 for the 4 digit columns (r0 incremented\
  \ by 8 each iteration) and the OAM tile id is 0xC792 + 2*digitValue (so the digit glyphs live at 0xC792,\
  \ 0xC794, ...).\n  5. After the digit loop it queues two extra sprite entries: one with attribute word\
  \ 0x8000 and tile id 0xC790 (the static \"HP\" label tile in the HUD), and a second with attribute word\
  \ 0x10288000 + 0xC790 (a palette/shape variant, possibly the colon or \"x\" separator).\n  6. The caller\
  \ contract shows r5 as a context pointer (its offset 0x8 holds the cached HP), and r10 is the Toolkit.\
  \ Other callers (sub_8033B0C/B30/B46/B5C/B6E) appear to share the same context object: r5 always in,\
  \ r4-r8 clobbered, return via `pop {r5,pc}` (a Thumb tail-call idiom) so this function never actually\
  \ returns -- it dispatches into another function via r5.\ndetails-cn: |\n  Note: the contract \"out=r2/r4..r8\"\
  \ plus the `pop {r5,pc}` epilogue strongly suggest r5 was loaded with the next-function address before\
  \ this was called (i.e. the caller does `mov r5, lr; ... bl sub_8033E0C; ...` style), and the function's\
  \ last `pop {r5,pc}` returns to *that* address rather than to the caller's lr. That matches the caller\
  \ onUpdateInInternet_8033B1E whose contract is `out=['r8','r9']` -- the same tail-call mechanism is\
  \ used there.\n"
