open_questions:
- The exact meaning of the four template slots in `byte_86C1F20` (steady / dropping / rising / low-HP).
  The conditional `r0,r1` at s:855 looks like a maxHP-vs-derivation comparison, but the values are not
  obviously typed in any provided struct.
- The second label sprite at 0x10288000 -- colon, "HP" suffix, or HP-bar endcap? Without a font sheet
  it's hard to tell.
- What EVENT_1732 gates -- the call is short-circuited to just draw the digits, so it's probably "show
  the HP readout" itself; needs the story-flag table to confirm.
- The `r10` (Toolkit) value is unused inside this function, which is consistent with the caller passing
  it for register-window symmetry rather than direct use.
