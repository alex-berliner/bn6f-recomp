name: checkBattleOrderMatch_802CE30
address: '0x0802CE30'
kind: function
status: confirmed
summary: Returns 1 if the current battle object's entry in the battle order table matches R5 and its next
  pointer is non-zero, else 0 (used to validate the caller as the front-of-order battler of its team).
interface: 'bool checkBattleOrderMatch_802CE30(void); /* in: r5 = battle object; out: r0 = 0/1, NZ flags
  */

  '
details: 'Reads a per-team battle-order struct from A_dword_203CFB0. If the object''s alliance byte is
  zero (one team), it advances the base by 0xc to the second slot (i.e., two tables of three dwords each,
  one per team). It then checks that the second dword of the selected slot equals R5 and the third dword
  (the "next" pointer) is non-zero. Both conditions must hold for a 1 return; any mismatch yields 0. Preserves
  nothing (no push/pop of R5), clobbers R0/R1 and N/Z flags.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
