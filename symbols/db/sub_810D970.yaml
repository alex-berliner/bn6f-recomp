name: sub_810D970
address: '0x0810D970'
kind: function
status: confirmed
summary: Battle object per-phase hook that, on phase 0, clears an extra-var slot and optionally resets the object's
  frame timer, then runs the standard per-phase dispatch.
interface: void sub_810D970(void /* R5 = oBattleObject* */);
details: "Called per-phase on a battle object (R5 = battle object pointer, shared oBattleObject_* layout).\nIf oBattleObject_CurPhase\
  \ (byte) == 0:\n    * zero out the +0xC extra-var slot (oBattleObject_ExtraVars + 0xC = 0)\n    * if the +8 extra-var\
  \ pointer (oBattleObject_ExtraVars + 8) is non-NULL,\n      call battle_ResetObjectTimerTo8_80C4072 to reset the\
  \ object's frame timer to 8.\n  Note: oBattleObject_ExtraVars + 8 is treated as a non-null gate, but the address\
  \ itself\n  is not used as the timer argument — the routine likely pulls the object out of R5 itself.\nThen unconditionally\
  \ tail-calls battle_objectUpdateDispatchPhase_80165C2 to run the normal\nphase update for the object.\nTail call\
  \ via `pop {pc}` — no local stack frame beyond lr save.\nThe function name/value \"8\" in battle_ResetObjectTimerTo8_80C4072\
  \ is a fixed timer-tick count, not a magic literal.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
