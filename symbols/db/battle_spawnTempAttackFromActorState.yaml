name: battle_spawnTempAttackFromActorState
address: '0x080EB572'
kind: function
status: probable
summary: Builds a type-1 subtype-5 temp-attack id from actor type (r4 base), AIIndex, caller arg, and
  a high byte set from NaviStats 0x2c / emotion / AI flag 0x48 / NaviStats 0x10, then spawns via spawn_t1_0x5_tempAttackObject_80B8E30;
  only zeroes oAIData_TempAttackObjectPtr when actor type is 0 and AIIndex is nonzero.
interface: (r0 = battle object ptr [also r5 = same object?], r1 = component shifted into bits 16-23) ->
  r0 = spawned object ptr via spawn_t1_0x5; if actor is not player(0,aiIdx 0) or navi(1), TempAttackObjectPtr
  in AIData is zeroed instead
details: 'Reads oBattleObject_AIDataPtr and branches on oAIData_ActorType: type 0 with AIIndex 0 uses
  the player path, type 1 (opponent/navi) uses base id 0x2b with r6=0xd and variant = AIIndex-1; anything
  else just clears oAIData_TempAttackObjectPtr and exits. The player path reads NaviStats byte 0x2c (via
  alliance) - if 0 it falls back to testing AIData+0x48 flag bit 0x200 (r6=0xe) then NaviStats byte 0x10
  (r6=0x14+value); if nonzero it maps values 0xb/0xc to r6=0xe and 0xd-0x11 to r6=5+value-0xd, with byte
  0xe OR-ed into the high byte only when possiblyGetBattleEmotion returns emotion 2 (beast-out-like state).
  The final packed 32-bit id = base(r4) | aiIndex<<8 | callerArg<<16 | extra<<24 is passed to spawn_t1_0x5_tempAttackObject_80B8E30,
  which links the object to the battle object and copies panel XY/alliance/direction.'
