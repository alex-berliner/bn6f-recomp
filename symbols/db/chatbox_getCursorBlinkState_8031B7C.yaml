open_questions:
- What specifically the returned byte represents (raw blink phase vs. a derived "ready/selected" flag)
  and the exact identity of the 0x14-offset sub-struct (only one byte is consumed, so the struct could
  be wider). Tracing the 0x14 struct's other users would settle the role of byte +1.
