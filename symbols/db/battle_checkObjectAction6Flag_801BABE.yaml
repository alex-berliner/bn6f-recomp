name: battle_checkObjectAction6Flag_801BABE
address: '0x0801BABE'
kind: function
status: confirmed
summary: 'Checks a battle object''s current action and returns a state code: 0 if the action is not 6, 1 if action
  6 without flag-2 bit set, and 2 if action 6 with flag-2 set, running sub_801A29A as a side effect in the last
  case.

  '
interface: 'int battle_checkObjectActionFlag6(BattleObject *obj /* r5 */); returns 0/1/2 in r0; flags on exit reflect
  the returned value (final "mov r0, r4" is an adds r0, r4, #0).

  '
details: 'Reads the object''s current action id at offset 9 (oBattleObject_CurAction) of the battle object struct.
  If it is not 6, returns 0 immediately. If it is 6, calls object_getFlag2 (r5 still holds the object; r4 is set
  to 1 before the call, and callers/callees can observe it) and tests bit 1 (mask 2, moved into r1 before the tst,
  so r1=2 is also visible to any further callee). If the bit is clear it returns 1; if set it calls sub_801A29A
  with the flag bits still in r0 and returns 2. r4 is only pushed/popped and always restored; r1/r2/lr are scratch.
  The action id 6 presumably corresponds to a specific battle state (e.g. a custom/charge or special state) whose
  flag-2 bit triggers the follow-up routine sub_801A29A. Result values look like a three-state status consumed by
  the caller''s action-dispatch logic.

  '
