name: ai_dispatchAttackStep_81107A0
address: '0x081107A0'
kind: function
status: confirmed
summary: Tail-call dispatcher that jumps to the AI attack-step handler selected by the HitElement field (dash start
  vs dash move step).
interface: void sub_81107A0(r5 attackCtx, r6 attackCtx2, r7 aiAttackVars); outputs r1, r5, r6, r8-r12 come from
  the selected handler; clobbers r0-r4, r7, lr and nzcv
details: Reads the HitElement byte at [r7 + oAIAttackVars_HitElement] from the AI attack-vars block, indexes the
  two-entry table at off_81107B4 (0 = ai_attackDashStart, 1 = ai_attackDashMoveStep, stored as thumb addresses +1),
  and does mov lr, pc / bx r1 so the handler returns straight back to this thunk's caller. The handler is entered
  with r0 = HitElement, r1 = its own handler address (left over from the table load), r5/r6/r7 = the caller's AI
  state pointers, so this is effectively a computed tail call over the caller's registers. Outputs (r1, r5, r6,
  r8-r12) are whatever the chosen step handler leaves in those registers. The table currently only covers two element/step
  values, so HitElement must be 0 or 1 or the dispatch reads garbage.
