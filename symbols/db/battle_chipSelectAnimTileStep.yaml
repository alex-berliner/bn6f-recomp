name: battle_chipSelectAnimTileStep
address: '0x0802C044'
kind: function
status: probable
summary: 'Animates the chip-select screen reveal: draws one tile of a 7x6 tile block per call, with a
  tick sound every 4th tile, until all 42 tiles are placed.'
interface: (r0 = row buffer fill target? unused after fill, r5 = UI state struct ptr) -> void; r5+0xB
  counter incremented, r5+3 set to 8 on completion
details: Each call first fills a 0x2A-halfword stack row with ascending tile IDs starting at 0xC1E8 (battle_fillChipSelectRow_802C588).
  It then reads counter [r5+0xB]; if >= 0x2A it instead stores 8 to [r5+3] and 0x1E to [r5+0xB] and returns
  (animation finished). Otherwise it indexes unk_2035320[counter] to get v, picks the halfword at sp+4+v*2
  (tile 0xC1E8+v) into sp+0, divides v by 7 via SWI 6, and calls blitTileBlockToRowBuffer_802C4B6 with
  x/y = (v%7)+14 / (v/7)+10 (after an r0/r1 swap), copying one halfword into the 24-halfword-wide buffer
  at unk_2034B30. The counter is stored back incremented, and PlaySoundEffect(0x7E) fires when (counter
  & 3) == 3. unk_2035320 is a 42-entry byte table mapping the animation frame to which tile/position is
  drawn next.
