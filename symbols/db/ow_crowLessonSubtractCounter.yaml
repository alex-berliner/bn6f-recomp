name: ow_crowLessonSubtractCounter
address: '0x081433F6'
kind: function
status: probable
summary: Subtracts r0 from the crow-lesson counter at eStruct2001010+0x9, clamping the result at zero.
interface: (r0 = amount to subtract) -> r0 preserved; counter at byte_2001019 becomes max(counter - r0,
  0); flags set by the SUB
details: Loads eStruct2001010, reads the byte at +0x9, computes counter - r0, and if the result would
  go negative stores 0 instead, otherwise stores the subtraction result. It writes nothing else and calls
  nothing, so it is purely a clamped counter-decrement helper. The counter byte at 0x2001019 belongs to
  the state structure used by ow_crowLessonInteraction, the Cybercrow lesson overworld handler, so it
  presumably tracks some lesson progress quantity (e.g. crows remaining or a step count). r0's meaning
  (a fixed constant vs. a variable amount) depends on the caller.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#0x9] then sub r1,r1,r0 with bge clamp shows a decremented counter; mov r1,#0 before
    store ensures the counter saturates at zero instead of wrapping; eStruct2001010 pointer and caller
    ow_crowLessonInteraction tie the counter to the crow lesson sequence
