name: battle_spawnLinkedLaserShot
address: '0x080CC486'
kind: function
status: probable
summary: Spawns a type-0x40 battle object via object_spawnType3, links it to a parent object (Alliance
  + RelatedObject1Ptr), wires ExtraVars from r6/r7 and writes the new pointer back through r7, sets Flags|=0x10,
  then runs battleObject_initLaserShot_80CC110 (with r5 reused as the new object).
interface: (r0 = panelX, r1 = panelY, r2/r3 = spawn args passed through, r5 = parent battle object, r6/r7
  = pointers stored into ExtraVars) -> r0 = new object ptr or 0; Z flag from spawn success
details: 'Saves r0/r1/r5, calls object_spawnType3 with r0=0x40 (object/resource selector). If spawn failed
  it returns immediately. Otherwise it fills the new object: PanelX/PanelY from the caller''s r0/r1, Alliance
  copied from the parent object at r5, RelatedObject1Ptr = parent (r5), ExtraVars+4 = r6 and ExtraVars
  = r7, and writes the new object pointer back into (*r7) so the owner can track it. Sets oObjectHeader_Flags
  bit 0x10 on the new object, then calls battleObject_initLaserShot_80CC110 with r5 = new object to load
  sprite/anim/palette and enter its first phase. r6/r7 are live inputs (not saved), so callers must set
  them before the call.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: mov r0,#0x40 + bl object_spawnType3 spawns the battle object; beq locret skips all setup on
    failure; strb r1/r2 to oBattleObject_PanelX/PanelY after pop {r1,r2,r5} shows r0/r1 are panel coordinates;
    ldrb r3,[r5,#oBattleObject_Alliance] and str r5,[r0,#oBattleObject_RelatedObject1Ptr] copy owner identity
    from r5; str r0,[r7] stores the new object pointer into the caller's r7 struct for back-linking; push
    {r5}; mov r5,r0; bl battleObject_initLaserShot_80CC110; pop {r5} initializes the spawn as a laser
    tracer
  refs:
  - bn6f/asm/asm31.s:43997
  - 0x080F8540 sub_80F8540
  - 0x080CC110 battleObject_initLaserShot_80CC110
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080CC486
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code indeed spawns a type-0x40 object, links it to a parent (r5), stores ExtraVars via r6/r7
    and writes back the new pointer to (*r7), then sets Flags|=0x10 and calls battleObject_initLaserShot_80CC110.
    However, the summary says r5 is passed to initLaserShot, but actually r0 (new obj ptr) is moved into
    r5 first, so initLaserShot receives r5=newObject. Also r5 is saved/restored around the call, contradicting
    the claim that r5 is not saved. Name is fine but mention of ''laser-tracer'' comes only from the initLaserShot
    callee; the function itself is a generic spawn-and-link helper.; run wf investigate investigate-20261018-200615;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
