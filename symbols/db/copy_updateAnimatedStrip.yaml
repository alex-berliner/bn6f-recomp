name: copy_updateAnimatedStrip
address: '0x0801D2A4'
kind: function
status: probable
summary: Loads context via [caller_r5+0x48]; copies a 28x2 tile strip from byte_801D9B4 into BG block
  0 at (0,0x12), then uploads three tilemap chunks (0,0x280→0x200,0x500→0x400) bracketed by sub_802E440/44A/454
  calls. Increments a frame counter and every 32 frames redraws a 9x2 segment at y=0x12 using segment
  index (state-1)*10+1.
interface: '(r0-r3 unused; context pointer expected in caller''s r5: +0x16 = buffer/BG id, +0x1a = segment
  selector, +0x30 = frame counter) -> r0 = clobbered; no meaningful return'
details: First copies tiles from byte_801D9B4 via CopyBackgroundTiles (y=0x12, block 0, 28 wide, 2 tall).
  It then reads byte [r5+0x16], calls sub_802E066 to get a value saved on the stack (likely a buffer/VRAM
  pointer), and calls sub_801D344 three times with (srcOff,dstOff) pairs (0,0), (0x280,0x200), (0x500,0x400),
  bracketed by calls to sub_802E440/sub_802E44A/sub_802E454 on the same id byte — most plausibly chunked
  tilemap/palette upload setup and teardown. It then increments a frame counter at [r5+0x30]; every 32
  frames (bit 0x20 test) it calls sub_3005EBA with r0=(byte[r5+0x1a]-1)*10+1, r1=0x12, r4=9, r5=2, which
  resembles redrawing a 9x2 segment at the same row using a segment index derived from the state byte.
  The use of the caller's r5 as a context pointer without a parameter suggests a fixed-register convention
  in this module.
