    strip; three sub_801D344 calls use source/dest offsets 0/0, 0x280/0x200, 0x500/0x400 with the value
    from sub_802E066([r5+0x16]); counter at [r5+0x30] incremented, action taken only when (counter & 0x20)
    != 0, i.e. every 32 frames; periodic call r0=(b[r5+0x1a]-1)*10+1 with r1=0x12 matching the strip's
    row, r4=9, r5=2 segment dimensions
