- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst AttackElement / bne loc_80FA2F0: two-phase attack state machine (start vs countdown); strb
    4,[AttackElement] + anim 0x13 + PlaySoundEffect(0xBF) + object_updateCollisionData(0x3a,2,3): attack
    initiation; strb TargetPanelX/Y to oBattleObject_PanelX/Y + object_setCoordinatesFromPanels + object_updateCollisionPanels
    + object_breakPanel_dup2: object lunges to target panel and breaks it; StepTimer 0x1E countdown with
    anim 0x14 at 0x10 and HitElement=0xC at 0: timed windup then hit arming; byte_80FA374[Alliance] &
    CollisionData flags gate object_clearCollisionRegion during countdown'
