name: ai_attackLungeBreakPanels
address: '0x080FA284'
kind: function
status: probable
summary: Per-frame step of an enemy AI attack that teleports the object onto its target panel, breaks
  the panels there, then waits out a countdown before arming the hit element.
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no return value
details: 'When oAIAttackVars_AttackElement is 0 it starts the attack: marks AttackElement=4, plays animation
  0x13 and sound 0xBF, writes oAIAttackVars_Damage (low 16 bits) into oCollisionData_SelfDamage and the
  high 16 bits into StaminaDamageCounterDisabler via object_updateCollisionData(0x3a,2,3), moves the object
  to TargetPanelX/Y (updating PanelX/Y, pixel coords, collision panels, region 1), breaks the panel at
  its position with object_breakPanel_dup2, clears Z to 0, sets counter time 12 and StepTimer=0x1E. On
  later frames it decrements StepTimer; if the object''s alliance shares a collision-type flag with byte_80FA374[Alliance]
  it clears its collision region; at timer 0x10 it switches to anim 0x14, and at 0 it sets HitElement=0xC
  (break-type hit) to complete the attack.'
