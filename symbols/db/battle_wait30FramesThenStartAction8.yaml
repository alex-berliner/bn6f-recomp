name: battle_wait30FramesThenStartAction8
address: '0x080BA468'
kind: function
status: probable
summary: 'Battle-object state handler: initializes a 30-frame wait (phase 4, anim 0), then on expiry sets
  the object''s action to 8.'
interface: (battle object in r5) -> void; flags from the timer decrement
details: Reads oBattleObject_CurPhase; if it is 0, sets CurPhase to 4, CurAnim to 0, and stores 0x1E (30
  frames) into oBattleObject_TimerAndTimer2, then returns. Otherwise it decrements the 16-bit oBattleObject_Timer;
  while it is still positive it just returns. When the timer reaches 0 it writes 8 to oBattleObject_CurAction
  and clears oBattleObject_CurPhaseAndPhaseInitialized, handing control back to the object's action dispatcher.
