name: submenu_updateFadeAndDraw
address: '0x08039816'
kind: function
status: probable
summary: Updates the submenu display during an active screen fade, clears its shared state, and redraws
  its numbers and cursor.
interface: (r0 = implicit menu context, r5 = implicit state pointer) -> r0 = undefined; flags are caller-clobbered
details: When IsScreenFadeActive reports a fade in progress, the function calls cleareMemory_802FF2C,
  sets the first byte of the state structure at r5 to 0x14, and clears the byte at offset 1. It then unconditionally
  calls submenu_drawNumbersAndCursor. The cleared state is described as a 0x180-byte shared work buffer,
  so this appears to reset and render a menu during a transition.
