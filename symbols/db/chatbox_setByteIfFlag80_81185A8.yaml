name: chatbox_setByteIfFlag80_81185A8
address: '0x081185A8'
kind: function
status: confirmed
summary: Sets the byte pointed to by r5 to 1 when chatbox eFlags bit 0x80 is set, otherwise leaves it unchanged.
interface: void sub_81185A8(u8* dest /* r5 */)
details: 'Small conditional-store helper. Calls chatbox_mask_eFlags2009F38 with mask 0x80;

  if the masked flag value is nonzero, it stores the byte 1 at the address passed in r5.

  If the flag is clear, *dest is not written at all, so callers must preinitialize the byte.

  r5 is treated as the destination pointer (not preserved-through convention — the function

  itself reads r5 as an input); r1 is preserved, flags nz and r0/lr are clobbered by the call.

  The meaning of eFlags bit 0x80 (e.g. some chatbox-active/text-done state) is not determined here.

  '
