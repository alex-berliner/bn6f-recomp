name: battle_setStateOnFrameAttr
address: '0x080CCBDC'
kind: function
status: probable
summary: Checks the current sprite frame's attribute byte for bit 7; if set, switches the battle object
  to animation 2 with a 60-frame timer and action 12.
interface: (r5 = battle object pointer, r0-r3 clobbered by call) -> void; flags set by tst of attribute
  byte vs 0x80
details: Calls sprite_getFrameParameters to fetch the current animation frame's attribute byte, then tests
  bit 0x80. When the bit is clear, the function does nothing and returns. When set, it writes animation
  2 to oBattleObject_CurAnim, timer value 0x3C (60 frames) to oBattleObject_Timer, and action value 0xC
  to oBattleObject_CurAction on the object at r5. The object pointer comes only from r5, so the caller
  must set it up before calling (likely a per-object state handler dispatched with the object in r5).
  Bit 7 of the frame attribute evidently marks a frame at which this scripted state/animation transition
  fires.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl sprite_getFrameParameters; tst r0,#0x80 gates the whole body; strb r0,#2,[r5,#oBattleObject_CurAnim]
    and strh #0x3C -> oBattleObject_Timer set the transition; strb #0xC,[r5,#oBattleObject_CurAction]
    selects the follow-up action/state; no callers known, so r5 setup and the meaning of anim 2/action
    0xC are unconfirmed'
  refs:
  - bn6f/asm/asm31.s:45540
  - 0x08002DEA sprite_getFrameParameters
  reproduce: python3 tools/asmcat.py 0x080CCBDC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
- 'no known caller: which object/state machine dispatches this and with what meaning for anim 2 / action
  0xC'
- what bit 7 of the frame attribute byte means in the sprite table (end marker, trigger flag, ...)
