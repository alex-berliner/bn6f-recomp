status: probable
summary: Tick AIAttackVars.Unk_10 countdown, run conditional callback each frame, exit attack when timer
  hits zero or callback returns nonzero
interface: (r7 = AIAttackVars ptr) -> side effects only (void-like)
details: "Initializes r6 = 0. Each iteration:\n    - Loads [r7+0x2c] into r0 and [r7+0x28] into r1, then\
  \ bx r1 (a function pointer/handler stored in AttackVars).\n      Convention: handler takes (arg in\
  \ r0) and returns nonzero to indicate \"done\".\n    - If handler returned 0, decrements the halfword\
  \ at [r7+0x10] (bge: loop again while >= 0).\n    - If handler returned nonzero OR the timer underflowed,\
  \ exits the attack:\n        * First iteration (r6==0) calls object_exitAttackState.\n        * Subsequent\
  \ iteration (r6!=0) calls the alternate object_exitAttackState_801171C which the project labels separately.\n\
  \  r7 is preserved by being callee-saved in r7 per the contract (lr-save site preserves r6/lr only,\n\
  \  but the function reads/writes r7 via the contract so the caller passes/keeps r7).\n  Side effects:\
  \ invokes the function pointer stored at +0x28 with arg [r7+0x2c], decrements [r7+0x10],\n  and dispatches\
  \ to one of two `object_exitAttackState` variants depending on a sticky r6 flag.\n"
