- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r6, #0` then re-entered path reuses `cmp r6, #0` to pick between two exit variants —
    sticky loop guard across single re-entry. - `ldr r0, [r7,#0x2c]` / `ldr r1, [r7,#0x28]` then `bx r1`
    is an indirect call through a function pointer in the AttackVars sub-struct (matches AIAttackVars
    offsets Unk_28 / Unk_2c). - `ldrh r0, [r7,#0x10]` then `sub r0, #1` / `strh r0, [r7,#0x10]` decrements
    Unk_10 by 1 per tick. - `tst r0, r0` then `bne loc_81097F4` — handler-returned-nonzero path joins
    the timeout path. - `bge locret_8109802` — continue ticking while the counter is still non-negative.
    - Calls `object_exitAttackState (0x08011714)` and `sub_801171C / object_exitAttackState_801171C` directly,
    both helper exits.'
