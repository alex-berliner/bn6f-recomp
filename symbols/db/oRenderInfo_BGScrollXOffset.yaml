  depending on context).
details: ">\n  Field is cleared by the per-frame init at renderInfo_8001788 (alongside sibling\n  Unk_12/Unk_14/Unk_16).\
  \ Multiple BG scroll callbacks (BG1Diagonal3to2Scroll,\n  BG1SlowRightScroll, BG1FastLeftScroll) compute\
  \ a tile-aligned horizontal delta\n  from oBGScrollCBCounters_Counter0 and store it here, while the\
  \ sibling Unk_12\n  receives the vertical delta. camera_applyDeltaToRenderInfoScroll_8030136 and\n \
  \ sub_8030194 add the camera X delta to this field and propagate to Unk_14 (and\n  Unk_16 for Y), matching\
  \ a layered scroll-buffer scheme. camera_CopyScrollToRenderLayers_80302F8\n  and renderInfo_SnapScrollToCamera_8030316\
  \ mask the camera X position to 0xFF\n  and store it here, with the Y component going to Unk_12 — Unk_10\
  \ = X, Unk_12 = Y\n  is unambiguous across 13 accesses."
