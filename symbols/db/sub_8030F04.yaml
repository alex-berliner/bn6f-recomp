name: sub_8030F04
address: '0x08030F04'
kind: function
previous_names: []
status: hypothesis
summary: Computes signed per-axis clip/penetration deltas for two battle objects against an axis-aligned bounding
  box reference
interface: (r0 = objOrAabbPtr, r1 = otherObjPtr, r2 = aabbHalfWidthDelta, r3 = aabbHalfHeightDelta, r4 = otherHalfWidth,
  r5 = otherHalfHeight, r6 = axisMaskOrDim, r7 = ?, lr) -> r0 = negY, r1 = negX
details: "Function operates on a struct at r0 of at least ~0x14 bytes, reading a u32 at +0 and +4, and u32s at +0xC\
  \ and +0x10.\n  Computes r2 = r2*r5 - r3*r4 (a cross-product / 2D extent test) into r2; then r5 = r2 + r0*((r6=r6-r5)?\
  \ r5? - r5? - actually r6 = (r6 - r5) using the captured r6)  -- re-reading: r6 := (r6 - r5) saved into r8; r7\
  \ := (r2 - r3) saved into r7; then r5 = r2 + r0*((r8)*(r6)) + r4*((r7)*(r7))? \n\n  The actual logic:\n  - r6_in\
  \ = original r6 (held in r8 after `mov r8,r6`)\n  - r6 = r2-r3 held in r7; r5 = r4-r5? no: r4 = r4-r5; Actually:\n\
  \    r8 = original r6\n    r6 = r5 - r4 (no, r4 = sub r6,r5,r4) -> r6 = r5 - r4  (this is the axis-aligned diff)\n\
  \    r7 = r2 - r3  (the other diff)\n  - r3 *= r4; r2 *= r5; r2 = r3 - r2 (the 2D cross)\n  - Load [r0] and [r0+4]\
  \ as the \"penetration\" axes, multiply by r6,r7 and accumulate into r3\n  - r5 = r2 + r3 (the discriminant of\
  \ sorts)\n  - if r5 <= 0, branch tests the alternate pair ([r0+0xC],[r0+0x10]) similarly\n  - if both fail, returns\
  \ (0,0) (loc_8030F76)\n  - otherwise calls sub_8031048 twice (the \"real\" sub), once with negated-X delta and\
  \ once with negated-Y delta, reading [result+4] and [result+0] respectively, and returns (r8=negY, r9=negX) in\
  \ (r0,r1) (mov r0,r9; mov r1,r8)\n  Captured calls show r1 = a heap pointer (0x8379, 0x9924, 0x9928), r2 always\
  \ 0x20, r3 always 0, exit r0 always negative (sign set), and the input struct has pattern like 0f 00 / 03 00 /\
  \ 00 00 / 13 00 / fc ff (little-endian s16 pairs followed by s16 ffff), strongly suggesting four signed halfword\
  \ components (X1, Y1?, X2, Y2?) representing AABB extents or a collision vector.\n"
