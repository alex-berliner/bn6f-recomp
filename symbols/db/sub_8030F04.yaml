    and `[r0,#4]` (at 8030F18/8030F1A) then multiplying with r6,r7 and adding to the cross -- classic separating
    axis test (SAT) for two OBBs - Branches on the sign of the accumulated value with `bgt loc_8030F76` (8030F32)
    and the second pair `[r0,#0xc]`/`[r0,#0x10]` (at 8030F40) indicate the two axis pairs of an OBB - `sub_8031048`
    is called twice (8030F64 and 8030F88) with negated args, then returns the per-axis penetration - Captured-call
    r0=0200f3e0, r1=heapObj, r2=0x20, r3=0 with negative exit r0 (e.g. fffffff1, fffffff8) and 64-bit pattern of
    4 s16 values matches an AABB or OBB axis pair structure - Caller `sub_8031478` ("Two-axis camera scroll during
