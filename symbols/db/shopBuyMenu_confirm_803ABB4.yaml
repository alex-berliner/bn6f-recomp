name: shopBuyMenu_confirm_803ABB4
address: '0x0803ABB4'
kind: function
status: confirmed
summary: 'Shop/buy-menu confirm handler: plays the menu-select sound and runs the purchase callbacks when
  a shop slot is chosen, otherwise delegates to a sibling handler.'
interface: 'void sub_803ABB4(void); /* inputs: r2, r5 (object ptr), lr; outputs/clobbers: r10 preserved,
  nz/c/v trashed, r0/r1/lr clobbered */'
details: "Operates on a menu/shop object in r5 with three fields:\n  +0x10 : u8  current cursor index\n\
  \  +0x13 : u8  flag/state byte (cleared to 0 on confirm)\n  +0x24 : u16 total slot count\nBranches on\
  \ `cursor < totalSlots` (signed, bge). When true it plays\n`SOUND_MENU_SELECT` (0x15) via PlaySoundEffect,\
  \ zeroes the +0x13 flag,\ninvokes `sub_803BF70(0x10, 0x30)` and `sub_803A85C()` — the menu-flow\ncallbacks\
  \ that advance the buy screen into the next phase.\nWhen the cursor has reached/exceeded the stored\
  \ count, control falls\nthrough to `sub_803ABDC`, presumably the sibling \"cursor at end-of-list\"\n\
  or \"back/exit\" handler.\nRestores {r4-r7, pc} on return; r10 is preserved per caller's contract.\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
