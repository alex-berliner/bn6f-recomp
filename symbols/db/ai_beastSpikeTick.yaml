name: ai_beastSpikeTick
address: '0x080F172C'
kind: function
status: probable
summary: 'Per-frame step of a boss spike attack: on first call sets AttackElement=4, CurAnim=4, OBJECT_FLAGS_CANNOT_SLIDE,
  and StepTimer=6; when the timer hits zero, stores 0x18 into HitElement as a halfword.'
interface: (r7 = battle object's oAIAttackVars, r5 = battle object) -> r0 = undefined; flags preserved
  via branch only
details: 'Reads oAIAttackVars_AttackElement: if zero, initializes the attack by storing element 4, setting
  the object''s oBattleObject_CurAnim to 4, setting OBJECT_FLAGS_CANNOT_SLIDE in the object''s ObjectFlags1
  via object_setFlag1, and loading oAIAttackVars_StepTimer with 6. Otherwise it decrements StepTimer each
  frame; when it reaches zero it stores 0x18 into oAIAttackVars_HitElement, presumably making the active
  attack/hitbox deal that element. The branch bgt on the timer makes the function idle for the remaining
  frames. It never resets AttackElement itself, so something else must clear the vars to allow re-entry.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst r0,r0 + mov r0,#4 strb [r7,#oAIAttackVars_AttackElement] shows one-shot init keyed on element==0;
    str r0,[r5,#oBattleObject_CurAnim] with anim 4 and bl object_setFlag1 (OBJECT_FLAGS_CANNOT_SLIDE)
    show a wind-up pose that can't slide; ldrh/sub/strh on oAIAttackVars_StepTimer with initial 6 is a
    6-frame countdown; strh r0,#0x18 into oAIAttackVars_HitElement after expiry arms the hit element;
    only known route 'beastsp' runs it, and the sole callee is the battle-object flag setter
  refs:
  - bn6f/asm/asm31.s:123522
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080F172C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is mostly correct, but it writes 0x18 with strh (halfword), not strb, indicating HitElement
    is a 16-bit field. The summary should not claim ''arms hit element 0x18 after 6 frames'' without noting
    it''s set when the timer hits zero. Also, the interface note about ''r0 = undefined'' is wrong: r0
    returns 0x18 (since bl is the last call before pop, r0 still holds the value just stored). The function
    does not idle via bgt — it returns via pop regardless. The name and core semantics fit.; run wf investigate
    investigate-20261018-203615; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
coverage:
- beastsp
open_questions:
- no callers known, so which enemy/boss AI invokes it and on what condition is unconfirmed
- the meaning of AttackElement=4 and HitElement=0x18 in the element enum is unknown
- whether 0x18 triggers damage directly or is consumed by a hitbox updater elsewhere
- 'The proposal is mostly correct, but it writes 0x18 with strh (halfword), not strb, indicating HitElement
  is a 16-bit field. The summary should not claim ''arms hit element 0x18 after 6 frames'' without noting
  it''s set when the timer hits zero. Also, the interface note about ''r0 = undefined'' is wrong: r0 returns
