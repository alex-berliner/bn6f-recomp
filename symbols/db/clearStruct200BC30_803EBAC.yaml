name: clearStruct200BC30_803EBAC
address: '0x0803EBAC'
kind: function
status: confirmed
summary: Zero-fills the 0x20-byte work struct at 0x200BC30 (eStruct200BC30).
interface: void sub_803EBAC(void) — callers pass r2/r3 (which are preserved and pass through untouched); returns
  r1 as left by ZeroFillByWord, r2/r3 unchanged; clobbers r0, lr, flags
details: 'A tiny helper that loads the address of eStruct200BC30 (0x200BC30) into r0 and the size 0x20 into r1,
  then tail-calls ZeroFillByWord to clear eight words of the struct before popping pc directly to the caller. The
  struct is some 0x20-byte work/scratch area referenced elsewhere by the eStruct200BC30 symbol; this function is
  its reset/init routine. Quirk: it is effectively a tail call (pop {pc} follows the bl), and r2/r3 are neither
  used nor clobbered — callers evidently keep live values in them across the call.'
