name: ai_strikeTwoFrontPanels
address: '0x080ED470'
kind: function
status: probable
summary: AI attack state that spawns a t1 subtype-5 temp attack object on first entry, then every step
  when StepTimer==0x20 strikes the panel two tiles in front of the attacker using one of three per-tier
  helpers, counting them on the spawned object, and finishes by writing HitElement=4 when the step timer
  elapses.
interface: (r5 = battle object, r7 = its oAIAttackVars) -> void; no return value
details: 'On first entry (oAIAttackVars_AttackElement == 0) it starts animation 0xA via object_setAnimation,
  resets the counter timer to default, spawns a t1 subtype-5 temp attack object (spawn_t1_0x5_tempAttackObject)
  with subtype varying by oAIAttackVars_AiDifficultyTier (base 0x21, or 0x22 for tiers 2+), sets object
  flag bit 22, and initializes AttackElement = 4 and StepTimer = 0x2A. Each tick thereafter, when StepTimer
  == 0x20 it targets the panel frontDirection*2 + PanelX, PanelY, computes damage = oAIAttackVars_Damage
  + AttackBoost, and calls one of three per-tier strike helpers: sub_80CA0E2 (tiers 0-1), sub_80CA104
  (tier 2, scaling with countActiveNaviBonuses of the object''s alliance), or sub_80CA19E (tier 3, reading
  a byte-table row via table_GetByte16Row_203EAE0_800AB3A). After each strike it increments byte 0x10
  of the spawned temp attack object, counting hits. StepTimer counts down each frame; when it reaches
  0 the routine stores HitElement = 4, which likely signals the state machine to move on. The AttackElement/HitElement
  value 4 and the exact visual of the strike are not identified here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bee — first-entry setup branch spawns attack
    and sets timers; bl spawn_t1_0x5_tempAttackObject_80B8E30 with r4 = 0x21/0x22 + tier — spawns the
    attack object; add r0,r0,r1 where r0 = object_getFrontDirection()*2 + PanelX — target panel is two
    tiles ahead; branch on oAIAttackVars_AiDifficultyTier to sub_80CA0E2 / sub_80CA104 (with countActiveNaviBonuses)
    / sub_80CA19E — per-tier strike variants; locret: strh r0,[r7,#oAIAttackVars_HitElement] with 4 once
    StepTimer hits 0 — ends the attack'
