name: ai_attackEmergeAtTargetPanel
address: '0x0801562C'
kind: function
status: probable
summary: Enemy AI attack step that makes the object emerge/warp onto its reserved target panel (white-flash,
  sound, effect), then waits ~30 frames before releasing AI flags and leaving the attack state.
interface: (r5 = battle object, r7 = AI attack vars context) -> void; sets r0 result of battle_checkEmergeDirectionFlip
  into oBattleObject_DirectionFlip
details: On first entry (oAIAttackVars_AttackElement == 0) it flags RelatedObject2Ptr with bits 0x14,
  derives a phase value (1, or 2 when PendingStateAction is 4/6/7) into the element byte, plays SFX 0x8E,
  copies FuturePanelX/Y into PanelX/Y, removes the panel reserve and recomputes coordinates/collision
  panels. It sets the emerge direction flip, refreshes sprite/arm, spawns effect object 3 from the object's
  +0x34 data with flag bit 2 set, clears object flags, zeroes AIType, and writes byte 0x2C of the NaviStats
  (alliance-aware) to 0. It then loads sprite resource 0x80 and animation data, applies the current animation
  (skipping the generic object_setAnimation when phase==2), forces the white palette (spawn flash), and
  starts the turn-open process; it also negates the AI forward-step delta for a custom gauge-bar animation
  and clears RelatedObject1Ptr/AIData TempAttackObjectPtr/TargetObjectPtr, sets NameID to 0x1A0, and arms
  a 30-frame StepTimer. On subsequent frames it only decrements the timer; when it expires it clears AIData
  flag masks 0x1000863D and 0x200900 and either exits the attack state (phase != 2) or promotes PendingStateAction
  into CurStateActionPhaseAndPhaseInitialized and zeroes it (phase == 2).
