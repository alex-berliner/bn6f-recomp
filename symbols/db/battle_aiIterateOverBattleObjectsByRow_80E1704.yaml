name: battle_aiIterateOverBattleObjectsByRow_80E1704
address: '0x080E1704'
kind: function
status: confirmed
summary: Scans a NULL-terminated battle-object list for the sprite in a given row whose PanelX is nearest to a reference
  column, used by AI targeting.
interface: 'u32 battle_findClosestObjectInRow(u32 row_bits /* r4: byte0=lower PanelX, bits8+=upper PanelX */, u32
  ref_panel /* r6: reference column for closeness */, u32* obj_list /* r7: NULL-terminated pointer array */) ->
  u32 best_obj /* r0 */'
details: 'Unpacks a row descriptor from r4: byte 0 gives the minimum PanelX and bits 8+ give the maximum. Walks
  the pointer array at r7 (stepping 4 bytes), reading each object''s PanelX at offset oBattleObject_PanelX. Objects
  whose PanelX falls within [lower, upper] (unsigned comparison after masking r4 to a byte for the lower bound)
  are candidates. On the first hit the candidate is stored as the best; subsequent hits go through battle_pickClosestPanelObject_80E1730(r0=best,
  r3=next, r6=ref_panel) to keep whichever is closer to the reference column. Returns the winning pointer, or 0
  if no object in the list matched the row.'
