open_questions:
- Exact meaning of the high byte of r4 — it's tested only against `PanelX`, not `PanelY`, so it likely
  represents another column-x bound (panel-width?). Possibly a [colmin, colmax] range on the same row,
  but the row axis is not directly compared here.
- What `sub_80E1730` does on the second/later match — without its body we cannot tell whether this picks
  the closest, farthest, or applies an AI decision.
- 'Role of r6: passed through to `sub_80E1730` but never used in this function; probably an AIData/BattleObject
  context pointer setup by the caller.'
