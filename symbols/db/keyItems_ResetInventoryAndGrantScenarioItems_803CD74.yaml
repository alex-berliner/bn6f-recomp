name: keyItems_ResetInventoryAndGrantScenarioItems_803CD74
address: '0x0803CD74'
kind: function
status: confirmed
summary: Wipes the player's key-item inventory and re-grants a fixed starting set (four copies of key item 0x75
  and one of key item 0).
interface: void sub_803CD74(void) — reads the toolkit pointer from r10; no return value; clobbers r0-r3, r12, lr
  and flags; preserves r4-r7
details: 'Fetches the key-item inventory buffer via the toolkit (r10 + oToolkit_KeyItemsPtr), then zero-fills 0x190
  bytes (the full key-item inventory struct) with ZeroFillByWord. It then calls keyItems_RemoveFromInventoryAndGive_803CDF8
  twice: first with (id=0x75, count=4) — granting four copies of key item 0x75 — then with (id=0, count=1) — granting
  one copy of key item 0. Net effect is a deterministic key-item state, so this is almost certainly part of a scenario/event
  setup or a new-game/branch reset that puts the key-item inventory into a known configuration rather than emptying
  it. The key-item inventory size 0x190 comes from the literal pool at off_803CD94.'
