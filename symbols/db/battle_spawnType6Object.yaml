open_questions:
- No callers known, so the meanings of the r1-r4 arguments passed to spawnType1 (x/y/z/params) and why
  old r0 becomes PanelX while r1 becomes both PanelY and spawn x are unconfirmed
- What object index 6 actually is (its type-specific initialiser) and which game entity uses this spawner
- Exact meaning of the DamageAndStaminaDamageCounterDisabler word and of collision-data byte 0 = 1
