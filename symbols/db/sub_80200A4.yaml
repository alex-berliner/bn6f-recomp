name: sub_80200A4
address: '0x080200A4'
kind: function
status: hypothesis
summary: Sets a byte in the chip-use queue/selector struct (eStruct203F7D8+3) and marks it dirty by OR-ing 1 into
  its flags byte (eStruct203F7D8+2).
interface: void sub_80200A4(u8 r0=value); // r1 := 1, r3 := A_eStruct203F7D8, NZ clobbered
details: "Writes the input byte (r0) into byte offset 3 of the engine struct eStruct203F7D8,\nthen reads byte offset\
  \ 2, OR-s in 1, and stores it back. The single-bit flag at\noffset 2 likely signals \"dirty/needs refresh\" for\
  \ whatever value sits at offset 3.\nOn exit r1 = 1 (success/ack) and r3 holds the struct base pointer (eStruct203F7D8).\n\
  The data block immediately following the function is a pool of 8 packed pointer/\nliteral entries (eStruct203F7D8\
  \ / eStruct2036780 / dword_203F4A0 / 0x200 / \ndword_203CBE0 / 0x100 / unk_20399F0 / unk_2039A00 / unk_2036120\
  \ / dword_203F5A0\n/ unk_20362F0) — probably an adjacent table consumed by callers of this helper.\nTentative\
  \ identification as a chip-slot setter; the prefix is kept light because\nthe struct's role is not confirmed beyond\
  \ its name.\n"
