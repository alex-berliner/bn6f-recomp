name: battleObject_copyCoordsFromRelatedObject_80B8800
address: '0x080B8800'
kind: function
previous_names:
- sub_80B8800
status: probable
summary: Copies the 0x34 coord triple (X, Y, Z) from this object's RelatedObject1Ptr into its own
interface: '(r5 = oBattleObject) -> r1 = oRelated->X, r2 = oRelated->Y, r3 = oRelated->Z ; side effects:
  writes oBattleObject+0x34..0x3F with the same three u32s'
details: "Reads r5 (a BattleObject pointer). Loads its RelatedObject1Ptr (oBattleObject_RelatedObject1Ptr\
  \ = 0x4C) into r1,\n  then takes the address r1+0x34 (Coords.X) and ldmia-populates r1,r2,r3 with the\
  \ three u32s at 0x34..0x3F\n  (XVelocity-adjacent coords in the object struct).\n  Sets r0 to r5+0x34\
  \ and stmia-writes r1,r2,r3 back into oBattleObject[0x34..0x3F], copying the related object's\n  X/Y/Z\
  \ triple verbatim into this object's own Coords slot.\n  Tail-returns via `mov pc, lr`. Because the\
  \ struct defines the same 0x34 region as `Coords` (X, Y, Z), this\n  is a teleport/sync helper: snap\
  \ this object's position to its related object's position.\n  Callers (sub_80B86A4 / sub_80B86C4) both\
  \ use r5+offset 0x34 immediately after as well, consistent with\n  the function being called during\
  \ animation states that need to overwrite local coords.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r1, [r5,#oBattleObject_RelatedObject1Ptr]` — fetches the related-object pointer at offset
    0x4C. - `add r0, r0, r1` with r0=0x34, then `ldmia r0!, {r1-r3}` — loads three u32s starting at oRelated+0x34.
    - `add r0, r0, r5` with r0=0x34, then `stmia r0!, {r1-r3}` — stores the same three u32s into oSelf+0x34.
    - Struct shows oBattleObject Coords begin at 0x34 (X, Y, Z as 16.16), and the loop loads 12 bytes
    = 3 u32s. - r5 contract: function only consumes r5 (the BattleObject) and returns in r1/r2/r3 the
    new X/Y/Z it just wrote.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x080B8800

    '
  result: the body read as described above
- method: coverage
