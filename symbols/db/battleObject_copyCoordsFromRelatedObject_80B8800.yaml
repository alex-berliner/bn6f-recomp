open_questions:
- Whether the bytes at 0x34 are really position or velocity — Coords is documented at 0x34, but the next
- declared field is XVelocity at 0x40. Three u32s from 0x34..0x3F is exactly the Coords triple, so it's
  a
- coord copy, not a velocity copy, but watching the callers' context would confirm the semantic role.
