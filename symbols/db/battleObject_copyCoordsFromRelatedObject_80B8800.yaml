name: battleObject_copyCoordsFromRelatedObject_80B8800
address: '0x080B8800'
kind: function
status: confirmed
summary: Copies three coordinate words at offset 0x34 from the object's RelatedObject1 into this battle object.
interface: void battleObject_copyCoordsFromRelatedObject_80B8800(r5 battleObject *this) /* clobbers r0-r3, nzcv
  */
details: 'Reads the RelatedObject1Ptr field (oBattleObject_RelatedObject1Ptr) from the battle object in r5,

  then copies three consecutive words (offsets 0x34, 0x38, 0x3C within the object — likely the

  x/y/other position or coordinate triple) from the related object to the same offsets in this

  object. Implemented as ldmia/stmia of {r1-r3} from related+0x34 to this+0x34. The related

  pointer is not validated; a null pointer would fault. No other state, flags, or fields touched.

  '
