name: setFieldsInThreeTableEntries_811980C
address: '0x0811980C'
kind: function
status: confirmed
summary: For three consecutive entries of a table rooted at 0x2008450, writes a byte, a halfword and another halfword
  into each entry's struct when that entry exists.
interface: void sub_811980C(u16 valE /*r0*/, u8 valC /*r1*/, u32 startIndex /*r2*/, u16 val18 /*r3*/)
details: "Saves all four argument registers on the stack, then loops over exactly\nthree table indices: startIndex\
  \ (r2) through startIndex+2 (r7 = r2+3 is\nthe loop end). Each iteration calls getStructFrom2008450 with the index\n\
  in r0; that lookup returns a status in r0 (nonzero = entry found) and\nthe struct pointer in r1. If the entry\
  \ exists, it stores:\n  - halfword value at struct+0x0E (from the original r0)\n  - byte value at struct+0x0C\
  \ (from the original r1)\n  - halfword value at struct+0x18 (from the original r3)\nEmpty/nonexistent entries\
  \ are simply skipped (the conditional branch\njumps past the stores). No error is reported; the loop always runs\
  \ all\nthree indices. Callee-saved r4-r7 are preserved; r0/r1 on return hold\nthe last lookup's status/pointer,\
  \ and the NZCV flags come from the\nfinal CMP of the loop counter against the end index (always equal on\nexit).\
  \ The meaning of the three fields (0x0C byte, 0x0E halfword,\n0x18 halfword) is unknown without knowing the struct\
  \ layout of the\n0x2008450 table.\n"
