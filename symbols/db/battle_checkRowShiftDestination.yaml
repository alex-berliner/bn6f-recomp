  this is not a generic ''row shift target panel'' check — it''s specifically a row-slide/row-shift step
  validator used during column-row movement (likely sliding along a row, since PanelX is preserved and
  only PanelY changes). A clearer name would reflect that it validates a vertical row-step destination,
  not a ''target panel'' in general.'
