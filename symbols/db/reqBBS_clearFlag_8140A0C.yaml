name: reqBBS_clearFlag_8140A0C
address: '0x08140A0C'
kind: function
status: confirmed
summary: Completes a bulletin-board (BBS) request by clearing its event flag and marking the request's state slot
  as resolved in the save work area.
interface: void reqBBS_finishRequest(Toolkit* toolkit /* r10 */) -> r1 = as left by ClearEventFlagFromImmediate,
  r3 = 0x12, c/v as left by ClearEventFlagFromImmediate; r4/r5 preserved
details: 'Board-request completion routine. First clears the fixed event flag EVENT_1700 via ClearEventFlagFromImmediate
  (the movflag pseudo-op splits the flag number''s high byte into r0 and low byte into r1). Then it loads the toolkit''s
  save work-area pointer from Toolkit + oToolkit_S2001c04_Ptr (r5,[r10] -> r5), reads the request''s state halfword
  at work + 0x14, and stores that same value to work + 0x12 — the halfword slot the game checks to treat the request
  as resolved. So the 0x14 -> 0x12 copy folds the request''s current state onto the "done" slot rather than writing
  a constant. Final `movs r3,#0x12` leaves 0x12 in r3 and refreshes only n/z; carry and overflow stay as the flag-clear
  call left them. r3/r4/r5 registers are scratch in the original but callers read back r1 and r3.

  '
