open_questions:
- Exact semantics of byte 0x12 on the found object (assumed panel X) could be confirmed from battleObject_findClosestEnemyBattleObject_80103F8's
  own docs
- Caller sub_80D1EF2 is undocumented, so which object types invoke this (player-only?) is unconfirmed
