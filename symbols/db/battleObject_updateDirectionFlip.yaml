  with panelX at offset 0x12 (loc_80D1FE0-80D1FF6), nonzero velocity falls through to the sign-bit compare
  (loc_80D1FF8), strb writes oBattleObject_DirectionFlip, then refreshSpriteAndArm is called. However
  the proposal''s branch for the zero-velocity case is wrong: the `beq locret_80D200A` happens after the
  subtraction when equal, not ''leaves flip untouched'', and when vel is nonzero r0 still holds object_getEnemyDirection''s
  result used in the sign-bit compare, not r1. The name ''updateDirectionFlip'' is fine, but ''chooses
  facing ... or toward the nearest opposing object'' misframes it — it sets a flip flag based on direction,
