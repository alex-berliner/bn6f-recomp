name: object_setRandomStateByte
address: '0x0811E548'
kind: function
status: probable
summary: Stores a random 0-63 value from the global RNG into byte offset 7 of the object pointed to by
  r5.
interface: (r5 = object ptr, untouched on input) -> byte [r5,#7] = GetRNG() & 0x3F; r0 clobbered
details: Calls GetRNG (which advances the global primary seed and returns the new value), masks the result
  with 0x3F, and writes the low byte to offset 0x7 of the structure in r5 — the same field region the
  sprite-object initializer sets as kind/state bytes. It takes no arguments in r0-r3; it relies on the
  caller having the object pointer in r5, a typical convention in this object code. The 0-63 range suggests
  a random timer/counter or a random variant/state pick for the sprite object. Given the only identified
  caller is an object initializer for sprite 0xA1, this likely randomizes that object's initial state
  or delay.
