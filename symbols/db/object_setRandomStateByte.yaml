  detail: bl GetRNG at sub_811E548+2 then and r0,#0x3f shows an RNG draw masked to 0-63; strb r0,[r5,#7]
    writes the result to offset 7 of the r5 object struct; caller object_initSpriteObjA1 sets the object's
