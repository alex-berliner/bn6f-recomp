name: battle_object_onAction8EndClearExtraVars_8109FA2
address: '0x08109FA2'
kind: function
status: confirmed
summary: Battle-object action-end cleanup — when the object finishes action 8 while still holding extra-variable
  state, it releases the referenced data and clears the extra-vars/Param4 fields.
interface: void sub_8109FA2(r4=?, battleObject r5, r7=?, lr=return); clobbers r0 r1 r3 and flags (nz c v); preserves
  r4 r7; tail-calls nothing (plain pop {pc})
details: 'Called with r5 = a battle object (uses oBattleObject_CurAction at +9, oBattleObject_ExtraVars,

  oBattleObject_ExtraVars+4, and oBattleObject_Param4 at +7). Acts as an "on action finished"

  hook: if CurAction != 8 (some late/final action slot) it returns immediately; if the

  oBattleObject_ExtraVars pointer is NULL it also returns. Otherwise it calls sub_800AA40 on

  ExtraVars[1] (release/free of whatever the sub-object points at), reloads ExtraVars[1]

  (in case the first call modified it) and calls sub_800AA1A on it (deletes the referenced

  list/sub-object), then writes 0 to oBattleObject_ExtraVars and 0 to the byte

  oBattleObject_Param4, so the object is left with no pending extra-variable state.

  r0/r1/r3 after the calls come from the last callee; flags on the early-exit paths match

  the last compare (CurAction vs 8, or ExtraVars vs 0).

  '
