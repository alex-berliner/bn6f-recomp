name: camera_applyScrollDeltaToBgScroll
address: '0x08030194'
kind: function
status: probable
summary: adds the camera's scroll delta since it was last saved to the render info's BG scroll offsets
interface: (r5 = camera struct) -> void; updates RenderInfo BGScrollXOffset/BGScrollY
details: Computes current-minus-saved for Camera_ScrollX and Camera_CameraYInt, then adds both deltas
  to RenderInfo_BGScrollXOffset and RenderInfo_BGScrollY in the toolkit's render info struct. No other
  effect; r0-r7 used, r5 and r10 assumed set by caller.
