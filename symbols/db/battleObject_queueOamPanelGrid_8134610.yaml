  detail: '- `ldrb r0,[r5,r0]` then `cmp r3,#2` / `beq` near offset 0x8134642 show `r5` is being indexed
    as a struct with fields at +0x40, +0x3E, +0x3C, +0x2E, +0x24, +0x16, +0x12 — all BattleObject offsets.
    - `blt`/`bgt` on the computed `(Z+pad)-R4` constrains the value to `[0..6]`; `mov r3,#0x10; mul r2,r3;
    add r1,r1,r2; orr r0,r1` produces a packed (X<<16)|Y16 OAM attr0. - `bl battleObject_queueOamFromTableRow_811FAF4`
    is the only OAM-pushing callee. - The `lsr r1,r1,#4; sub r1,#1; bne loc_813467A` sequence is the classic
    "every Nth call" gate; combined with `lsl r1,r1,#4` to repack, this is a 7-frame-per-row stepping
    counter. - `sub_8120CC8` is confirmed as the lookup-table wrapper, called with palette-table arg `dword_81331FC`;
    result stored into the low nibble of `+0x16`. - Captured calls all share `r0,r1 ∈ {0x40..0x62}`, `r2
    = 0x13`, `r3 = 0x0f`, `lr = 0x081333d9` (the caller sub_81333A0 path). All exits return `r0=0` with
    `-Z--` — matches a function that always falls through `loc_8134686`. - Only caller `sub_81333A0` reads
    `r5` (BattleObject), `r10` (Toolkit), `lr` — matches the in-contract exactly.'
