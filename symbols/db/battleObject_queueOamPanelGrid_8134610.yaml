open_questions:
- Exact semantics of `[r5+0x44]` gate (never nonzero in captured runs) — likely an "object type/phase"
  flag controlling whether this object draws a panel sprite at all.
- Identity of `byte_813470C` (a 3- or 4-entry u32 table, indexed via `Unk_40` 0..3) — probably per-`Team`
  panel-side base-X for navi vs virus.
- Whether the `r0/r1 = 0x50/0x40`-style captures represent object index or panel position is not directly
  verifiable; values stay in a small range and the caller `sub_81333A0` is the dispatcher.
