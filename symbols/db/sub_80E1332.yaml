name: sub_80E1332
address: '0x080E1332'
kind: function
status: hypothesis
summary: Tail-call wrapper that forwards its arguments to sub_80C0F52 and returns whatever sub_80C0F52 returns.
interface: 'void sub_80E1332(u32 r0, u32 r1, u32 r2, u32 r3, u32 r4); // returns: flags c/v set by sub_80C0F52,
  all callee-saved regs preserved; r0 clobbered, r1-r4 forwarded as outputs'
details: 'Implements a pure tail call: pushes LR, branches into sub_80C0F52, and the callee''s normal epilogue pops
  LR straight into PC. There is no local stack frame and no register shuffling here, so every register contract
  (r0-r4 in, c/v plus the standard caller-saved set out) is dictated entirely by the callee sub_80C0F52. The presence
  of an "object_spawnType4" / "str [r0,#0x4c]" / "strb r2, [r0,#7]" / "ldrh r2, [r1,#0x16]" snippet after the tail-call
  block (which the readable C represents as a separate sibling function) suggests this address sits next to a sibling
  routine that spawns an object of type 0xc, stores the r1 pointer at offset 0x4c and r2 byte at offset 7 on the
  spawned object, and copies the parent entity''s halfword at offset 0x16 into the child''s offset 0x16. Because
  that sibling appears as a distinct routine adjacent to the tail, sub_80E1332 itself should be understood strictly
  as the tail-call passthrough.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
