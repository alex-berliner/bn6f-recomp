open_questions:
- Exact semantics of NaviStats+0xD bit 0 (likely "chip already stolen this battle" or "anti-steal shield");
  offset 0x16 bit 1 of ChipData (likely a "stealable" chip flag) is also inferred from context only.
- The constant 0x179 packed alongside the chipID looks like an effect/event-type ID; confirming what sub_80E90FE
  does with the high 16 bits would lock down the VFX ID.
- Whether this function is invoked from the player AI (playerAI_sub_80F0354) only on a successful chip-selection
  vs. autonomously by the opponent's turn logic.
