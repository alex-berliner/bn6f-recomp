name: sub_8003BF4
address: '0x08003BF4'
kind: function
status: hypothesis
summary: Per-frame draw driver for the overworld object list (starting at the player); projects each visible sprite,
  ensures its tiles are resident, queues OAM pieces, then flushes the queue.
interface: 'void sub_8003BF4(void)  // inputs: r10, lr; outputs: none; clobbers r0-r3, r10, NZCV; preserves r4-r9,
  r12 (saved/restored around the work)'
details: "Walks the overworld object array whose first entry is the global `eOWPlayerObject`\n(loaded via off_8003C94).\
  \ The hard-coded count `r0 = 1` in the original means only\nthat head entry is processed each frame — i.e. just\
  \ the player's overworld sprite.\nPer-object layout (stride 0xC8):\n    +0x00  u8 flags (bit 0 = OW_FLAG_ACTIVE,\
  \ bit 1 = OW_FLAG_VISIBLE)\n    +0x1C  world position (passed to projection)\n    +0x90  sprite/OAM state block\
  \ (its +0x24 holds the queued-piece count)\nPer entry: if visible, call sprite_projectAndCull (via +1 thumb tail),\
  \ then\nsprite_ensureGfxResident(0, …) to keep its GFX resident, then\nsprite_queueFramePieces(2, 0x60, sprite+0x90)\
  \ to emit OAM pieces. If hidden,\nzero the queued-piece count at sprite+0xB4 and only call sprite_projectAndCull\n\
  again when bit 0 (active) is on, so the projected screen pos stays current\nwithout submitting new pieces. After\
  \ the loop, sub_80028C0(0, end) commits\nthe queued OAM frame. `r5` doubles as the walking object pointer and\
  \ as a\nhidden argument expected by each callee (position/sprite pointer), which is\nwhy the body carefully restores\
  \ it across the `push {r0,r1,r5}` saves.\nr4–r9 and r12 are pushed/popped verbatim so the caller's high registers\
  \ are\npreserved through the guest calls.\n"
