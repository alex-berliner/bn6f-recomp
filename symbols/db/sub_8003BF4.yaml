open_questions:
- The loop bound is hard-coded to 1 (mov r0,#1 / blt r1,r0); is this a deliberate player-only pass with sibling
  routines handling NPCs/enemies, or a stub where the count was meant to come from a global?
- sub_80028C0 is invoked with r5 holding the post-loop pointer and r1 forced back to 0; the precise meaning of that
  "list_end" argument is not yet documented.
