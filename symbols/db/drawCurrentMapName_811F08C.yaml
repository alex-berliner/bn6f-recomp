name: drawCurrentMapName_811F08C
address: '0x0811F08C'
kind: function
status: confirmed
summary: Resolves the name of the map the player is currently on, renders it as text, and uploads it to the map-name
  VRAM slot.
interface: void drawCurrentMapName_811F08C(void)
details: "No inputs; acts on global state. Calls sub_811F290 to get (in r0) the text-script\nindex of the current\
  \ map's name (the game's map the player is standing in).\nThen calls renderTextGfx_8045F8C with:\n  r0 = TextScriptMapNames\
  \ (string table base),\n  r1 = map name string index from sub_811F290,\n  r2 = byte_200C620 (rendered-text work\
  \ buffer),\n  r3 = 0, r4 = 0xC (render width, 12), r5 = 1, r6 = dword_86A5D60 (font/metadata\n  table), r7 = 0.\n\
  Finally calls sub_811F5DC(source=byte_200C620, sourceMap=byte_200C920,\nvramDest=0x6015780, tileCount=0xC) to\
  \ copy the 12 rendered tiles of the map\nname into the map-name display area of VRAM at 0x6015780.\nPurely a fixed-sequence\
  \ helper: r4-r7 are pushed/popped only around the calls,\nso r4-r7, r8-r12 are preserved for callers; r0-r3, lr\
  \ and the nz flags are\nclobbered; c/v come back from the last callee.\n"
