kind: function
status: hypothesis
summary: Thin trampoline that frees an object's allocated memory then returns to the caller.
interface: 'void sub_80CE21C(void); /* in: r5 = object pointer, lr = return address; out: r5 preserved */'
details: 'Body is just `bl object_freeMemory` followed by `pop {pc}`, so it is a tail-call wrapper:

  it frees the memory owned by the object passed by the caller in r5 (object_freeMemory''s

  standard argument register), and then pops the saved return into pc to the original lr value.

  Likely used as a one-shot cleanup/return helper (e.g. when an object''s state handler is

  finished and its memory should be released before returning to its owner). r5 is the

  only callee-preserved register across this call, consistent with object_freeMemory being

  expected to preserve it. No other state is touched here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
