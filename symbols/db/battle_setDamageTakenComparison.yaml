name: battle_setDamageTakenComparison
address: '0x0802CB38'
kind: function
status: probable
summary: Records both sides' total damage taken in the battle-result struct at 203EAD0 and stores which
  side took less damage.
interface: (r0 = total damage taken by side 1, r1 = total damage taken by side 0) -> r0 = 0; writes dword_203EAD0
  struct and byte [r5,#0x10]
details: 'Stores r0 and r1 as halfwords at dword_203EAD0+8 and +0xA, then computes a verdict: 0xFF if
  equal, 0 if r0<r1, 1 if r0>r1; this verdict is also written to caller state byte [r5,#0x10]. From the
  verdict it derives a winner code at dword_203EAD4+3 (byte 0x203EAD7): 3 on a tie, otherwise 2 if the
  verdict matches oBattleState_PlayerSide or 1 if not — i.e. which side took less damage. Finally it clears
  the dword at 203EAD0 and the halfwords at 203EADC/203EADE, resetting the struct''s counters for a new
  comparison phase.'
