- method: assembly-reading
  date: '2026-10-19'
  detail: strh r0/r1 to 203EAD8/203EADA store the two totals passed in; cmp/beq/blt chain yields 0xFF/0/1
    verdict stored to [r5,#0x10] and 0x203EAD7; eor r0, r6 against oBattleState_PlayerSide decides the
    2-vs-1 winner code; caller 0x0800838A passes battle_getPlayerTotalDamageTaken(1) and (0) as r0/r1,
    then advances its phase state to 4; zeroing 203EAD0, 203EADC, 203EADE resets counters after recording
