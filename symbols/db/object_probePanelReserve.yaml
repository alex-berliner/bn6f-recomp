name: object_probePanelReserve
address: '0x08113F60'
kind: function
status: probable
summary: Temporarily reserves the panel tile at the object's coordinates, runs three checks, then releases
  the reservation and returns the tile coordinates.
interface: (r5 = object ptr; x = [r5+0x12], y = [r5+0x13]) -> r0 = x, r1 = y of the probed tile; flags
  from final pop-restore path
details: 'Reads the object''s tile coordinates from fields 0x12/0x13 and calls object_reservePanel to
  claim that panel. It then evaluates three sub-checks (sub_8113FC0, sub_8113FE8, sub_8114030); a nonzero
  result from any of them short-circuits to the cleanup label. Cleanup always calls object_removePanelReserve
  with the same coordinates, so the reservation is only ever transient — the panel is marked reserved
  just for the duration of the checks. The function pushes {r0,r1} at loc_8113F86 and pops them after
  the release call, so it returns the original x/y coordinates in r0/r1 regardless of the check outcomes.
  The object pointer arrives in r5 (never loaded inside), so callers set up r5 before calling. Effectively
  a ''probe'' pattern: reserve, test something while holding the tile, then give it back.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#0x12]/ldrb r1,[r5,#0x13] then bl object_reservePanel — reserves the tile under
    the object; three tst r0,r0/bne loc_8113F86 chains make sub_8113FC0/FE8/4030 short-circuit conditions;
    loc_8113F86 unconditionally calls object_removePanelReserve with the same 0x12/0x13 coords, so the
    hold is temporary; push {r0,r1} ... pop {r0,r1} around the release makes x/y the return values; r5
    is used without being loaded, so the object pointer is an incoming register argument
