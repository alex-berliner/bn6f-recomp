name: gameState_fadeToOverworldAfterEvent
address: '0x08005A50'
kind: function
status: confirmed
summary: 'Wraps up an in-map event/cutscene: sets the post-event event flags, starts a screen fade, then hands control
  back to the overworld map subsystem.'
interface: void gameState_fadeToOverworldAfterEvent(GameState *self /*r5*/, u32 flagBank /*r10*/)
details: 'Game-state handler (self pointer in r5, called via the gameState dispatch in cbGameState_80050EC). Sequence:
  (1) sets event flag EVENT_1703 (event/cutscene finished) and EVENT_1738 (leaving the map after the event) via
  SetEventFlagFromImmediate, passing the flag ID''s high byte (word number) in r0 and low byte (bit index) in r1,
  with the flag bank/base in r10 per the movflag macro; (2) calls SetScreenFade(0xC, 0x10) — 12 frames down, 16
  frames per step — to fade the screen; (3) calls timer_tickCountdownTable_8035738 to keep the shared countdown
  table ticking; (4) stores 0xA0 (160 frames) into self+oGameState_FrameCountdown as the state timer; (5) stores
  0x10 into self+oGameState_SubsystemIndex, which selects the overworld map subsystem (overworld_owMap_renderAndTickSubsystems_800536E)
  on the next dispatch. Tail of the routine holds a jump table of CutsceneScript pointers (off_8005A78..off_8005A88:
  CutsceneScriptOnMapWarp_8098a02, CutsceneScriptOnMapEnterAfterJackOut_8098a2e, CutsceneScriptOnInMapWarp_8098a78,
  CutsceneScript_809b5ad, CutsceneScript_8098b1c) reached from nearby dispatch code. r4-r7 preserved; clobbers r0-r3,
  lr and flags.

  '
