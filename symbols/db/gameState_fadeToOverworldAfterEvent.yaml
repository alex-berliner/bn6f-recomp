name: gameState_fadeToOverworldAfterEvent
address: '0x08005A50'
kind: function
status: probable
summary: 'One-shot game state handler: sets two story event flags, starts a screen fade, delays 160 frames,
  then hands control to the overworld subsystem.'
interface: (r5 = * GameState, self) -> void; no return value, writes SubsystemIndex = 0x10 to schedule
  overworld_owMap_renderAndTickSubsystems_800536E via cbGameState_80050EC
details: Runs as a GameState callback (r5 = state struct). It first sets event flags EVENT_1703 and EVENT_1738
  via SetEventFlagFromImmediate, then calls SetScreenFade(0xc, 0x10) — presumably a fade-in of the overworld
  after an event/cutscene. It ticks the 32-entry countdown-timer table, then stores 0xa0 (160) into GameState.FrameCountdown,
  a delay before the next transition, and finally writes 0x10 into GameState.SubsystemIndex to switch
  to the overworld subsystem. The word table right after the body points at CutsceneScripts for map warp
  / jack-in / enter-after-jack-out, suggesting this state is part of the map-warp/jack-out flow and the
  table is consumed by the state dispatcher or a neighbor function.
