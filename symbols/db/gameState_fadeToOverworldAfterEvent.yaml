    SetScreenFade with r0=0xc, r1=0x10 starts the screen transition; str 0xa0 -> [r5,#oGameState_FrameCountdown]
    sets a 160-frame delay; strb 0x10 -> [r5,#oGameState_SubsystemIndex] with comment 'trigger overworld_owMap_renderAndTickSubsystems_800536E
    via cbGameState_80050EC' shows the exit into the overworld; off_8005A78 table of CutsceneScriptOnMapWarp/OnInMapWarp/OnMapEnterAfterJackOut
