name: ow_startLogoutEffect
address: '0x080A9EEC'
kind: function
status: probable
summary: 'Initializes an overworld object as a log-out effect: sets its state, fetches position values,
  loads sprite 0x1C with animation 0 and no shadow, plays the LOG_OUT sound, and advances its state machine.'
interface: (r5 = object/actor struct, set by caller/global) -> void; calls sub_809C890 which returns r1/r2/r3
  stored into the object, then tail-calls sub_80A9F30
details: 'The function operates on an object whose pointer is already in r5 (a global/caller-set register):
  it writes state 3 to the object''s first byte and calls sub_809C890, storing its three results at +0xC,
  +0x10, +0x14 (likely position/coordinates used for layering). It then loads sprite id 0x1C with args
  (0x80, 0x1C, 0), sets animation 0 via sprite_setAnimation, loads the animation data, and disables the
  shadow with sprite_noShadow. applyLayerEffectToOWObject_8035694 on r5+0xC followed by sprite_setPriority_8002E14
  sets the correct draw layer/priority for an overworld sprite. It plays SOUND_LOG_OUT_76, writes state
  4 to object+8 (the state/step counter used by the object''s update handler), and tail-calls sub_80A9F30
  for the next step. The sound name and the whole sprite-setup sequence point at a jack-out/log-out visual
  effect actor.'
