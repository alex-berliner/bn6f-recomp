name: ow_startLogoutEffect
address: '0x080A9EEC'
kind: function
status: confirmed
summary: Overworld state-machine step that spawns the internet-log-out visual effect, plays the logout SFX, and
  advances to the done state.
interface: void ow_startLogoutEffect_80A9EEC(u8 *r5_owObject, u32 r10); /* r5 = OW object base, r10 unused here;
  writes r5[0], r5[0xC], r5[0x10], r5[0x14], r5[8]; clobbers r0-r3,r8-r12,flags */
details: 'Sets the OW object''s state byte (r5[0]) to 3 (LOGOUT_START). Calls

  ow_applyCutsceneDirOffset to compute a screen-anchored (x, y, depth) tuple

  and stores them at r5+0xC, r5+0x10, r5+0x14. Loads sprite tile 0x80,

  graphic set 0x1C on layer 0 via sprite_load; sets animation index 0, loads

  animation data, and disables the shadow. Calls applyLayerEffectToOWObject

  on the position struct (r5+0xC) to map the sprite onto the overworld depth

  layer, then sprite_setPriority to assign BG/object rendering priority from

  the mapped Y. Plays SOUND_LOG_OUT (SFX index 0x76). Finally writes state 4

  (LOGOUT_DONE) to r5[8] and calls sprite_frameTickMarkState8_80A9F30 to

  advance the frame-tick state machine. r10 is passed in by the caller but

  never dereferenced inside this handler.

  '
