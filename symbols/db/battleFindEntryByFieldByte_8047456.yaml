name: battleFindEntryByFieldByte_8047456
address: '0x08047456'
kind: function
status: confirmed
summary: Searches an 8-byte-stride table for the entry whose byte at offset 4 equals a given value, returning via
  the Z flag.
interface: int sub_8047456(u32 needle /*r0*/, u32 entryCount /*r4*/, const void* table /*r7*/); returns via flags
  (Z set = match found, Z clear = not found), r1/r3 clobbered
details: Linear scan over a table of 8-byte entries pointed to by r7. For each entry it loads the byte at offset
  4 with ldrb and compares it to the value in r0; on the first match it stops with the loop counter (r3) holding
  the index of the matching entry. If the loop runs through all r4 entries without a match it falls through with
  r6=1 and sets the NZ flags from 1 (Z clear), while a match leaves Z set. Only the byte at offset 4 of each 8-byte
  entry is examined, so the other 7 bytes are unknown payload or padding. Nearby literal pools reference byte_2019A00,
  byte_2011C10, and byte_8047DA0, which likely belong to the caller's table/data rather than this routine. Callers
  must treat Z (and possibly the r3 index) as the result, not r0.
